<style>body{margin:20px;font-family:"Noto Sans KR","Malgun Gothic",sans-serif;color:#111827}table{border-collapse:collapse;width:100%;font-size:12px}th,td{border:1px solid #d1d5db;padding:5px;text-align:left}th{background:#f3f4f6}.PASS{color:#166534;font-weight:700}.RUNNING{color:#92400e}.FAIL{color:#b91c1c;font-weight:700}#frame{position:fixed;left:-12000px;top:0;width:1280px;height:900px;border:0}</style>
<h1>고1 「여러 가지 부등식」 H15-SA-08 전수 실제 브라우저 렌더</h1>
<p id="summary">RUNNING · 대상 목록 로딩 중</p>
<p id="error" style="color:#b91c1c;white-space:pre-wrap"></p>
<table><thead><tr><th>시험지</th><th>mode</th><th>기대 문항</th><th>표시 수</th><th>페이지</th><th>이미지</th><th>MathJax/visual</th><th>overflow</th><th>판정</th></tr></thead><tbody id="rows"></tbody></table>
<iframe id="frame" width="1280" height="900"></iframe>
<script>
const rels=["original/high/h1/1final/22_금당고_1학기_기말_고1_기출.js","original/high/h1/1final/22_매산고_1학기_기말_고1_기출.js","original/high/h1/1final/22_복성고_1학기_기말_고1_기출.js","original/high/h1/1final/22_순천여고_1학기_기말_고1_기출.js","original/high/h1/1final/22_팔마고_1학기_기말_고1_기출.js","original/high/h1/1final/22_효천고_1학기_기말_고1_기출.js","original/high/h1/1final/23_강남여고_1학기_기말_고1_기출.js","original/high/h1/1final/23_금당고_1학기_기말_고1_기출.js","original/high/h1/1final/23_매산고_1학기_기말_고1_기출.js","original/high/h1/1final/23_복성고_1학기_기말_고1_기출.js","original/high/h1/1final/23_순천여고_1학기_기말_고1_기출.js","original/high/h1/1final/23_제일고_1학기_기말_고1_기출.js","original/high/h1/1final/23_팔마고_1학기_기말_고1_기출.js","original/high/h1/1final/24_금당고_1학기_기말_고1_기출.js","original/high/h1/1final/24_매산고_1학기_기말_고1_기출.js","original/high/h1/1final/24_제일고_1학기_기말_고1_기출.js","original/high/h1/1mid/23_한영고_1학기_중간_고1_기출.js","original/high/h1/1mid/24_한영고_1학기_중간_고1_기출.js","original/high/h1/2mid/24_금당고_2학기_중간_고1_기출.js","original/high/h1/2mid/24_제일고_2학기_중간_고1_기출.js"];
const targetIdsByRel={"original/high/h1/1final/22_금당고_1학기_기말_고1_기출.js":[2,15,17],"original/high/h1/1final/22_매산고_1학기_기말_고1_기출.js":[1,3,11,16],"original/high/h1/1final/22_복성고_1학기_기말_고1_기출.js":[4,5,6,10,13,18,19],"original/high/h1/1final/22_순천여고_1학기_기말_고1_기출.js":[2,13,14,15],"original/high/h1/1final/22_팔마고_1학기_기말_고1_기출.js":[1,10,11,12,21],"original/high/h1/1final/22_효천고_1학기_기말_고1_기출.js":[6,10,11,21],"original/high/h1/1final/23_강남여고_1학기_기말_고1_기출.js":[1,10,11,18],"original/high/h1/1final/23_금당고_1학기_기말_고1_기출.js":[4,11,14],"original/high/h1/1final/23_매산고_1학기_기말_고1_기출.js":[3,8,11,13,17,19],"original/high/h1/1final/23_복성고_1학기_기말_고1_기출.js":[2,7,9,16],"original/high/h1/1final/23_순천여고_1학기_기말_고1_기출.js":[7],"original/high/h1/1final/23_제일고_1학기_기말_고1_기출.js":[4,6],"original/high/h1/1final/23_팔마고_1학기_기말_고1_기출.js":[7,9,10,13,15,20],"original/high/h1/1final/24_금당고_1학기_기말_고1_기출.js":[1,18],"original/high/h1/1final/24_매산고_1학기_기말_고1_기출.js":[1,2,13],"original/high/h1/1final/24_제일고_1학기_기말_고1_기출.js":[19],"original/high/h1/1mid/23_한영고_1학기_중간_고1_기출.js":[11,21],"original/high/h1/1mid/24_한영고_1학기_중간_고1_기출.js":[16],"original/high/h1/2mid/24_금당고_2학기_중간_고1_기출.js":[8,19],"original/high/h1/2mid/24_제일고_2학기_중간_고1_기출.js":[5,6,8,20]};
const modes=['exam','sol','ans'], rowsEl=document.getElementById('rows'), frame=document.getElementById('frame'), results=[];
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const renderRel = rel => rel.includes('22_효천고_1학기_기말_고1_기출.js') ? '_generated/high1-render-cache/h15sa08-hyo.js' : rel;
const scriptUrl = rel => renderRel(rel).startsWith('exams/') ? '/archive/'+renderRel(rel) : '/archive/exams/'+renderRel(rel);
const engineData = rel => renderRel(rel).startsWith('exams/') ? renderRel(rel) : 'exams/'+renderRel(rel);
async function expectedCount(rel){const text=await fetch(scriptUrl(rel)).then(r=>r.text());const sandbox={window:{}};new Function('window',text)(sandbox.window);return Array.isArray(sandbox.window.questionBank)?sandbox.window.questionBank.length:0;}
function addRow(rel,mode,expected){const tr=document.createElement('tr');tr.innerHTML='<td>'+rel+'</td><td>'+mode+'</td><td>'+expected+'</td><td>…</td><td>…</td><td>…</td><td>…</td><td>…</td><td class="RUNNING">RUNNING</td>';rowsEl.appendChild(tr);return tr;}
function inspect(doc,mode,expected,targetIds){const boxSelector=mode==='sol'?'.page .q-box.sol-box':'.page .q-box';const allBoxes=[...doc.querySelectorAll(boxSelector)];const boxes=mode==='sol'?allBoxes.filter(x=>(x.querySelector('.q-num')?.textContent||'').trim()):allBoxes;const targetBoxes=mode==='ans'?[]:boxes.filter(x=>targetIds.includes(Number((x.querySelector('.q-num')?.textContent||'').replace(/D/g,''))));const nums=mode==='ans'?[...doc.querySelectorAll('.ans-n')]:boxes;const imgs=[...doc.querySelectorAll('img')];const errors=[...doc.querySelectorAll('.error,.load-error')].map(x=>x.textContent).filter(Boolean);const overflow=targetBoxes.filter(x=>x.scrollWidth>x.clientWidth+2).length;const visual=doc.querySelectorAll('.mjx-container,.MathJax,svg[role="img"],img[alt]').length;const broken=imgs.filter(x=>!x.complete||x.naturalWidth<=0).length;const pass=nums.length===expected&&broken===0&&overflow===0&&!errors.length&&(mode==='ans'||visual>0);return{count:nums.length,pages:doc.querySelectorAll('.page').length,images:imgs.length,broken,visual,overflow,errors,pass};}
async function runMode(rel,expected,mode){const tr=addRow(rel,mode,expected);frame.src='/archive/engine.html?mode='+mode+'&qpp=4&data='+encodeURIComponent(engineData(rel));let result=null;for(let attempt=0;attempt<20;attempt++){await sleep(1000);try{const doc=frame.contentDocument;if(doc){result=inspect(doc,mode,expected,targetIdsByRel[rel]||[]);if(result.pass||attempt===19)break;}}catch(e){result={count:0,pages:0,images:0,broken:0,visual:0,overflow:0,errors:[String(e)],pass:false};}}result ||= {count:0,pages:0,images:0,broken:0,visual:0,overflow:0,errors:['frame unavailable'],pass:false};const cells=tr.children;cells[3].textContent=result.count;cells[4].textContent=result.pages;cells[5].textContent=result.images+' (broken '+result.broken+')';cells[6].textContent=result.visual;cells[7].textContent=result.overflow;cells[8].textContent=result.pass?'PASS':'FAIL';cells[8].className=result.pass?'PASS':'FAIL';results.push({rel,mode,expected,...result});document.getElementById('summary').textContent=results.length+'/'+(rels.length*modes.length)+' complete · pass '+results.filter(x=>x.pass).length;}
window.onerror=(message,source,line,column,error)=>{document.getElementById('error').textContent='window.onerror: '+message+' @'+line+':'+column+'\n'+(error?.stack||'');};
async function run(){try{const cases=[];for(const rel of rels)cases.push([rel,await expectedCount(rel)]);document.getElementById('summary').textContent='RUNNING · '+cases.length+' files · '+cases.reduce((s,x)=>s+x[1],0)+' questions · '+(cases.length*modes.length)+' modes';for(const [rel,n] of cases)for(const mode of modes)await runMode(rel,n,mode);window.renderResults=results;const pass=results.filter(x=>x.pass).length;document.getElementById('summary').textContent='DONE · '+results.length+' modes · pass '+pass+' · fail '+(results.length-pass);}catch(error){document.getElementById('error').textContent='run error: '+(error?.stack||error);throw error;}}
run().catch(()=>{});
</script>
