name: Archive Reviewed Exam Meta Register

on:
  push:
    branches: [main]
    paths:
      - ".archive-meta-register/inbox/*.json"
      - "archive/data/meta-foundation/exam-scoped/25_금당고_2학기_중간_고2_확률과통계.parent-links.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: archive-reviewed-exam-meta-register-main
  cancel-in-progress: false

jobs:
  register:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Find requests and trigger scope
        id: req
        shell: bash
        run: |
          set -euo pipefail
          count="$(find .archive-meta-register/inbox -maxdepth 1 -type f -name '*.json' 2>/dev/null | wc -l | tr -d ' ' || true)"
          echo "count=$count" >> "$GITHUB_OUTPUT"
          # Scoped detection uses the triggering push itself (event payload), never HEAD^ of the
          # moving `ref: main` checkout. A manual dispatch is a recovery re-run: treat as scoped
          # (the push helper is a no-op when nothing changes). When the event cannot prove the
          # answer, assume scoped: that only costs an idempotent rebuild.
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            scoped=true
          else
            scoped="$(node tools/ci/push-touches-paths.mjs --paths-file tools/ci/archive-meta-register-trigger-paths.txt --literal-only --uncertain true)"
          fi
          echo "scoped=$scoped" >> "$GITHUB_OUTPUT"
      - name: Register, rebuild, and validate
        if: steps.req.outputs.count != '0' || steps.req.outputs.scoped == 'true'
        shell: bash
        env:
          ARCHIVE_META_SCOPED: ${{ steps.req.outputs.scoped }}
        run: bash tools/ci/reviewed-meta-register-pass.sh
      - name: Commit and push final reviewed-meta registration
        id: push
        if: steps.req.outputs.count != '0' || steps.req.outputs.scoped == 'true'
        shell: bash
        env:
          ARCHIVE_META_SCOPED: ${{ steps.req.outputs.scoped }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Never force-pushes. If another writer moved main first, the helper resets to the new tip,
          # re-runs the full registration pass (register, build, validate) there,
          # and pushes that fresh result (max 3 attempts); an identical tree already on main is success.
          node tools/ci/git-push-derived-with-retry.mjs \
            --paths-file tools/ci/archive-meta-register-commit.paths \
            --message "chore(archive): register reviewed exam meta [skip ci]" \
            --regenerate "bash tools/ci/reviewed-meta-register-pass.sh" \
            --remote origin --branch main --max-attempts 3 \
            --label "Reviewed exam meta registration" --summary-file "$GITHUB_STEP_SUMMARY"
          echo "registered_main_sha=$(git rev-parse origin/main)" >> "$GITHUB_STEP_SUMMARY"
      - name: Verify changed-UID approval in the effective student consumer
        if: (steps.req.outputs.count != '0' || steps.req.outputs.scoped == 'true') && steps.push.outcome == 'success'
        shell: bash
        env:
          ARCHIVE_META_SCOPED: ${{ steps.req.outputs.scoped }}
        run: bash tools/ci/verify-registered-consumer-approval.sh
