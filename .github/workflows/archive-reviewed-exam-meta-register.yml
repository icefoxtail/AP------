name: Archive Reviewed Exam Meta Register

on:
  push:
    branches: [main]
    paths:
      - ".archive-meta-register/inbox/*.json"

permissions:
  contents: write

concurrency:
  group: archive-reviewed-exam-meta-register-main
  cancel-in-progress: false

jobs:
  register:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Find request
        id: req
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t reqs < <(find .archive-meta-register/inbox -maxdepth 1 -type f -name '*.json' -print 2>/dev/null | sort)
          if [[ ${#reqs[@]} -ne 1 ]]; then
            echo "Expected exactly one reviewed-exam meta request; found ${#reqs[@]}" >&2
            exit 1
          fi
          echo "path=${reqs[0]}" >> "$GITHUB_OUTPUT"
      - name: Register reviewed exam meta and runtime
        run: node archive/tools/meta-foundation/register-reviewed-exam-meta-source.mjs --request "${{ steps.req.outputs.path }}" --write
      - name: Rebuild DB, UID, index, catalog, and registration projections
        run: python archive/build_db.py
      - name: Validate registration and canonical baseline
        run: |
          node archive/tools/verify-archive-registration.mjs
          node archive/tools/build-archive2-catalog.mjs --check
          node archive/tools/meta-foundation/compile-meta-foundation.mjs --canonical-only-check
          git diff --check
      - name: Commit final reviewed-meta registration
        shell: bash
        env:
          REQUEST: ${{ steps.req.outputs.path }}
        run: |
          set -euo pipefail
          rm -f -- "$REQUEST"
          git add -- \
            archive/data/question_metadata.json \
            archive/data/meta-foundation/runtime/*.json \
            archive/data/meta-foundation/evidence/reviewed-exam-meta/v1/*.json \
            archive/db.js \
            archive/data/question_identity_map.json \
            archive/question-identity.js \
            archive/question-index.js \
            archive/question-index-report.md \
            archive/question-index-audit.md \
            archive/data/archive2-catalog.json \
            archive/data/archive2-crosswalk-inventory.json \
            archive/data/basic-scope-parent-links.json \
            "$REQUEST"
          if git diff --cached --quiet; then
            echo "No registration changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(archive): register reviewed exam meta [skip ci]"
          git push origin HEAD:main
