name: Archive Reviewed Exam Meta Register
# Compatibility recovery button only. Main pushes and inbox consumption belong to the single writer.
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: write
jobs:
  register:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Resume the existing single main writer
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run archive-main-auto-meta.yml --repo "$GH_REPO" --ref main
