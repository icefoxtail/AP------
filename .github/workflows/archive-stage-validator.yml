name: Archive Stage Validator

on:
  pull_request:
    branches: [main]
    paths:
      - "archive/tools/archive-stage-validator.mjs"
      - "archive/fixtures/stage-validator-pilot/**"
      - "tests/archive-stage-validator-pilot.test.mjs"
      - ".github/workflows/archive-stage-validator.yml"
  workflow_dispatch:
    inputs:
      target_ref:
        description: "Branch/ref containing the target exam and evidence"
        required: true
        default: "main"
        type: string
      stage:
        description: "CREATE, R1, R2, or R3"
        required: true
        default: "R2"
        type: choice
        options:
          - CREATE
          - R1
          - R2
          - R3
      exam_path:
        description: "Repository-relative exam JS path on target_ref"
        required: true
        type: string
      evidence_path:
        description: "Repository-relative evidence JSON path on target_ref"
        required: true
        type: string

permissions:
  contents: read

jobs:
  pilot:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generic validator pilot
        run: node tests/archive-stage-validator-pilot.test.mjs

      - name: Full-evidence control through generic entrypoint
        run: |
          node archive/tools/archive-stage-validator.mjs \
            --stage R2 \
            --exam "archive/exams/original/middle/m2/1mid/25_매산중_1학기_중간_중2_기출.js" \
            --evidence "archive/data/r2e-intake/m2/25_매산중_1학기_중간_중2_기출.review2.physical-evidence.json" \
            --json

  validate:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout target ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_ref }}
          path: target

      - name: Checkout validator authority
        uses: actions/checkout@v4
        with:
          ref: main
          path: validator-src

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate target stage
        shell: bash
        run: |
          set -euo pipefail
          node validator-src/archive/tools/archive-stage-validator.mjs \
            --stage "${{ inputs.stage }}" \
            --exam "$GITHUB_WORKSPACE/target/${{ inputs.exam_path }}" \
            --evidence "$GITHUB_WORKSPACE/target/${{ inputs.evidence_path }}" \
            --json
