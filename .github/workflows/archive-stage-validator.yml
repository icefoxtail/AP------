name: Archive Stage Validator

on:
  pull_request:
    branches: [main]
    paths:
      - "archive/tools/archive-stage-validator.mjs"
      - "archive/tools/archive-codex-closeout-v2.mjs"
      - "archive/data/codex-quality-calibration-registry-v2.json"
      - "tests/archive-codex-closeout-v2.test.mjs"
      - ".codex/agents/**"
      - "archive/tools/archive-stage-validator-artifact-v2.mjs"
      - "archive/tools/archive-stage-validator-common-v2.mjs"
      - "archive/tools/archive-stage-validator-create-v2.mjs"
      - "archive/tools/archive-stage-validator-r1-v2.mjs"
      - "archive/tools/archive-repair-alive-v2.mjs"
      - "archive/tools/archive-stage-runtime-v2.mjs"
      - "archive/tools/archive-stage-validator-r2-v2.mjs"
      - "archive/tools/archive-stage-validator-r3-v2.mjs"
      - "archive/fixtures/stage-validator-pilot/**"
      - "tests/archive-stage-validator-pilot.test.mjs"
      - "tests/archive-stage-validator-artifact-v2.test.mjs"
      - "tests/archive-stage-validator-v2-routing.test.mjs"
      - "tests/archive2-v2-shadow.test.mjs"
      - "tests/archive-repair-alive-v2.test.mjs"
      - "tests/archive-stage-runtime-v2.test.mjs"
      - "tests/archive-stage-validator-r2-v2.test.mjs"
      - "tests/archive-stage-validator-r3-v2.test.mjs"
      - ".github/workflows/archive-stage-validator.yml"
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      target_ref:
        description: "Branch/ref containing the target exam and evidence"
        required: true
        default: "main"
        type: string
      quality_contract:
        description: "CURRENT enforces Codex V2; LEGACY is explicit historical validation"
        required: true
        default: "CURRENT"
        type: choice
        options: [CURRENT, LEGACY]
      stage:
        description: "CREATE, R1, R2, or R3"
        required: true
        default: "R2"
        type: choice
        options:
          - CREATE
          - R1
          - R2
          - R3
      exam_path:
        description: "Repository-relative exam JS path on target_ref"
        required: true
        type: string
      evidence_path:
        description: "Repository-relative evidence JSON path on target_ref"
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read
  issues: read

jobs:
  pilot:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Artifact contract v2 regression
        run: node tests/archive-stage-validator-artifact-v2.test.mjs

      - name: Codex render and publication receipt regression
        run: node --test tests/archive-codex-closeout-v2.test.mjs

      - name: Generic validator pilot
        run: node tests/archive-stage-validator-pilot.test.mjs

      - name: Repair / ALIVE v2 regression
        run: node tests/archive-repair-alive-v2.test.mjs

      - name: Stage runtime v2 regression
        run: node tests/archive-stage-runtime-v2.test.mjs

      - name: V2 generic routing and closure consumer
        run: node tests/archive-stage-validator-v2-routing.test.mjs

      - name: V2 shadow regression
        run: node tests/archive2-v2-shadow.test.mjs

      - name: R2 v2 regression
        run: node tests/archive-stage-validator-r2-v2.test.mjs

      - name: R3 v2 regression
        run: node tests/archive-stage-validator-r3-v2.test.mjs


  validate:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout target ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_ref }}
          path: target

      - name: Checkout validator authority
        uses: actions/checkout@v4
        with:
          ref: main
          path: validator-src

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate target stage
        shell: bash
        env:
          QUALITY: ${{ inputs.quality_contract }}
          STAGE: ${{ inputs.stage }}
          EXAM: ${{ inputs.exam_path }}
          EVIDENCE: ${{ inputs.evidence_path }}
        run: |
          set -euo pipefail
          quality_args=()
          if [[ "$QUALITY" != LEGACY ]]; then quality_args=(--quality-contract JS_ARCHIVE_QUALITY_CONTRACT_V2_20261006); fi
          node validator-src/archive/tools/archive-stage-validator.mjs \
            "${quality_args[@]}" --stage "$STAGE" \
            --exam "$GITHUB_WORKSPACE/target/$EXAM" \
            --evidence "$GITHUB_WORKSPACE/target/$EVIDENCE" --json

  validate-pr-comment:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      github.event.comment.user.login == github.repository_owner &&
      (startsWith(github.event.comment.body, '/archive-stage-validate ') || startsWith(github.event.comment.body, '/archive-stage-validate-legacy '))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Parse pilot command
        id: args
        shell: bash
        env:
          COMMENT: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail
          read -r cmd stage exam evidence extra <<< "$COMMENT"
          [[ "$cmd" == "/archive-stage-validate" || "$cmd" == "/archive-stage-validate-legacy" ]]
          [[ "$stage" =~ ^(CREATE|R1|R2|R3)$ ]]
          [[ -z "${extra:-}" ]]
          for value in "$exam" "$evidence"; do
            [[ "$value" == archive/* ]]
            [[ "$value" != *".."* ]]
          done
          {
            if [[ "$cmd" == "/archive-stage-validate-legacy" ]]; then echo "contract=LEGACY"; else echo "contract=CURRENT"; fi
            echo "stage=$stage"
            echo "exam=$exam"
            echo "evidence=$evidence"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ github.event.issue.number }}/head
          path: target

      - name: Checkout validator authority
        uses: actions/checkout@v4
        with:
          ref: main
          path: validator-src

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate live PR stage
        shell: bash
        env:
          QUALITY: ${{ steps.args.outputs.contract }}
          STAGE: ${{ steps.args.outputs.stage }}
          EXAM: ${{ steps.args.outputs.exam }}
          EVIDENCE: ${{ steps.args.outputs.evidence }}
        run: |
          set -euo pipefail
          quality_args=()
          if [[ "$QUALITY" != LEGACY ]]; then quality_args=(--quality-contract JS_ARCHIVE_QUALITY_CONTRACT_V2_20261006); fi
          node validator-src/archive/tools/archive-stage-validator.mjs \
            "${quality_args[@]}" --stage "$STAGE" \
            --exam "$GITHUB_WORKSPACE/target/$EXAM" \
            --evidence "$GITHUB_WORKSPACE/target/$EVIDENCE" --json
