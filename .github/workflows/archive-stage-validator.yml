name: Archive Stage Validator

on:
  pull_request:
    branches: [main]
    paths:
      - "archive/tools/archive-stage-validator.mjs"
      - "archive/tools/archive-codex-closeout-v2.mjs"
      - "archive/tools/archive-gpt-closeout-v2.mjs"
      - "archive/data/gpt-quality-calibration-registry-v2.json"
      - "tests/archive-gpt-closeout-v2.test.mjs"
      - "archive/data/codex-quality-calibration-registry-v2.json"
      - "tests/archive-codex-closeout-v2.test.mjs"
      - ".codex/agents/**"
      - "archive/tools/archive-stage-validator-artifact-v2.mjs"
      - "archive/tools/archive-stage-validator-common-v2.mjs"
      - "archive/tools/archive-stage-validator-create-v2.mjs"
      - "archive/tools/archive-stage-validator-r1-v2.mjs"
      - "archive/tools/archive-repair-alive-v2.mjs"
      - "archive/tools/archive-stage-runtime-v2.mjs"
      - "archive/tools/archive-stage-validator-r2-v2.mjs"
      - "archive/tools/archive-stage-validator-r3-v2.mjs"
      - "archive/fixtures/stage-validator-pilot/**"
      - "tests/archive-stage-validator-pilot.test.mjs"
      - "tests/archive-stage-validator-artifact-v2.test.mjs"
      - "tests/archive-stage-validator-v2-routing.test.mjs"
      - "tests/archive2-v2-shadow.test.mjs"
      - "tests/archive-repair-alive-v2.test.mjs"
      - "tests/archive-stage-runtime-v2.test.mjs"
      - "tests/archive-stage-validator-r2-v2.test.mjs"
      - "tests/archive-stage-validator-r3-v2.test.mjs"
      - ".github/workflows/archive-stage-validator.yml"
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      target_ref:
        description: "Branch/ref containing the target exam and evidence"
        required: true
        default: "main"
        type: string
      quality_contract:
        description: "CURRENT enforces Codex V2; LEGACY is explicit historical validation"
        required: true
        default: "CURRENT"
        type: choice
        options: [CURRENT, LEGACY]
      stage:
        description: "CREATE, R1, R2, or R3"
        required: true
        default: "R2"
        type: choice
        options:
          - CREATE
          - R1
          - R2
          - R3
      exam_path:
        description: "Repository-relative exam JS path on target_ref"
        required: true
        type: string
      evidence_path:
        description: "Repository-relative evidence JSON path on target_ref"
        required: true
        type: string
      execution_line:
        description: "Execution authority for CURRENT V2 (CODEX or GPT_SCHEDULED)"
        required: true
        default: "CODEX"
        type: choice
        options: [CODEX, GPT_SCHEDULED]
      campaign_id:
        description: "Required when execution_line is GPT_SCHEDULED"
        required: false
        type: string
      stream:
        description: "A, B, or C; required when execution_line is GPT_SCHEDULED"
        required: false
        type: string

permissions:
  contents: read
  pull-requests: read
  issues: read

jobs:
  pilot:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Artifact contract v2 regression
        run: node tests/archive-stage-validator-artifact-v2.test.mjs

      - name: Codex render and publication receipt regression
        run: node --test tests/archive-codex-closeout-v2.test.mjs

      - name: GPT publication receipt regression
        run: node --test tests/archive-gpt-closeout-v2.test.mjs

      - name: Generic validator pilot
        run: node tests/archive-stage-validator-pilot.test.mjs

      - name: Repair / ALIVE v2 regression
        run: node tests/archive-repair-alive-v2.test.mjs

      - name: Stage runtime v2 regression
        run: node tests/archive-stage-runtime-v2.test.mjs

      - name: V2 generic routing and closure consumer
        run: node tests/archive-stage-validator-v2-routing.test.mjs

      - name: V2 shadow regression
        run: node tests/archive2-v2-shadow.test.mjs

      - name: R2 v2 regression
        run: node tests/archive-stage-validator-r2-v2.test.mjs

      - name: R3 v2 regression
        run: node tests/archive-stage-validator-r3-v2.test.mjs


  validate:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout target ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_ref }}
          path: target

      - name: Checkout validator authority
        uses: actions/checkout@v4
        with:
          ref: main
          path: validator-src

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate target stage
        shell: bash
        env:
          QUALITY: ${{ inputs.quality_contract }}
          STAGE: ${{ inputs.stage }}
          EXAM: ${{ inputs.exam_path }}
          EVIDENCE: ${{ inputs.evidence_path }}
          EXECUTION_LINE: ${{ inputs.execution_line }}
          CAMPAIGN: ${{ inputs.campaign_id }}
          STREAM: ${{ inputs.stream }}
        run: |
          set -euo pipefail
          quality_args=()
          if [[ "$QUALITY" != LEGACY ]]; then quality_args=(--quality-contract JS_ARCHIVE_QUALITY_CONTRACT_V2_20261006); fi
          gpt_args=()
          if [[ "$EXECUTION_LINE" == "GPT_SCHEDULED" ]]; then
            [[ "$QUALITY" == "CURRENT" && "$CAMPAIGN" =~ ^[A-Za-z0-9_]+$ && "$STREAM" =~ ^[ABC]$ ]] || { echo "INVALID_GPT_DISPATCH_CONTEXT"; exit 1; }
            gpt_args=(--execution-line GPT_SCHEDULED --campaign-id "$CAMPAIGN" --stream "$STREAM")
          elif [[ "$EXECUTION_LINE" != "CODEX" ]]; then
            echo "INVALID_EXECUTION_LINE"; exit 1
          fi
          node validator-src/archive/tools/archive-stage-validator.mjs \
            "${quality_args[@]}" "${gpt_args[@]}" --stage "$STAGE" \
            --exam "$GITHUB_WORKSPACE/target/$EXAM" \
            --evidence "$GITHUB_WORKSPACE/target/$EVIDENCE" \
            --asset-root "$GITHUB_WORKSPACE/target/archive" --json

      - name: Seal GPT dispatch stage with canonical V2 CLI
        if: inputs.execution_line == 'GPT_SCHEDULED'
        shell: bash
        env:
          STAGE: ${{ inputs.stage }}
          EXAM: ${{ inputs.exam_path }}
          EVIDENCE: ${{ inputs.evidence_path }}
          CAMPAIGN: ${{ inputs.campaign_id }}
          STREAM: ${{ inputs.stream }}
        run: |
          set -euo pipefail
          exam_uid="$(basename "$EXAM" .js)"
          node validator-src/archive/tools/gpt2-validate-and-seal.mjs \
            --stage "$STAGE" \
            --exam "$GITHUB_WORKSPACE/target/$EXAM" \
            --evidence "$GITHUB_WORKSPACE/target/$EVIDENCE" \
            --asset-root "$GITHUB_WORKSPACE/target/archive" \
            --output-root "$RUNNER_TEMP/gpt2-seals" \
            --campaign-id "$CAMPAIGN" --stream "$STREAM" --exam-uid "$exam_uid"

      - name: Upload official GPT V2 seal and handoff
        if: success() && inputs.execution_line == 'GPT_SCHEDULED'
        uses: actions/upload-artifact@v4
        with:
          name: gpt2-dispatch-seal-${{ github.run_id }}
          path: ${{ runner.temp }}/gpt2-seals
          if-no-files-found: error
          retention-days: 30

  validate-pr-comment:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      github.event.comment.user.login == github.repository_owner &&
      (startsWith(github.event.comment.body, '/archive-stage-validate ') || startsWith(github.event.comment.body, '/archive-stage-validate-legacy ') || startsWith(github.event.comment.body, '/archive-stage-validate-gpt '))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Parse pilot command
        id: args
        shell: bash
        env:
          COMMENT: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail
          read -r cmd stage exam evidence campaign stream extra <<< "$COMMENT"
          [[ "$cmd" == "/archive-stage-validate" || "$cmd" == "/archive-stage-validate-legacy" || "$cmd" == "/archive-stage-validate-gpt" ]]
          [[ "$stage" =~ ^(CREATE|R1|R2|R3)$ ]]
          if [[ "$cmd" == "/archive-stage-validate-gpt" ]]; then
            [[ "$campaign" =~ ^[A-Za-z0-9_]+$ && "$stream" =~ ^[ABC]$ && -z "${extra:-}" ]]
          else
            [[ -z "${campaign:-}" && -z "${stream:-}" && -z "${extra:-}" ]]
          fi
          for value in "$exam" "$evidence"; do
            [[ "$value" == archive/* ]]
            [[ "$value" != *".."* ]]
          done
          {
            if [[ "$cmd" == "/archive-stage-validate-legacy" ]]; then echo "contract=LEGACY"; else echo "contract=CURRENT"; fi
            echo "stage=$stage"
            echo "exam=$exam"
            echo "evidence=$evidence"
            if [[ "$cmd" == "/archive-stage-validate-gpt" ]]; then
              echo "execution_line=GPT_SCHEDULED"
              echo "campaign_id=$campaign"
              echo "stream=$stream"
            fi
          } >> "$GITHUB_OUTPUT"

      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ github.event.issue.number }}/head
          path: target

      - name: Checkout validator authority
        uses: actions/checkout@v4
        with:
          ref: main
          path: validator-src

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate live PR stage
        shell: bash
        env:
          QUALITY: ${{ steps.args.outputs.contract }}
          STAGE: ${{ steps.args.outputs.stage }}
          EXAM: ${{ steps.args.outputs.exam }}
          EVIDENCE: ${{ steps.args.outputs.evidence }}
        run: |
          set -euo pipefail
          quality_args=()
          if [[ "$QUALITY" != LEGACY ]]; then quality_args=(--quality-contract JS_ARCHIVE_QUALITY_CONTRACT_V2_20261006); fi
          gpt_args=()
          if [[ "${{ steps.args.outputs.execution_line }}" == GPT_SCHEDULED ]]; then
            gpt_args=(--execution-line GPT_SCHEDULED --campaign-id "${{ steps.args.outputs.campaign_id }}" --stream "${{ steps.args.outputs.stream }}")
          fi
          node validator-src/archive/tools/archive-stage-validator.mjs \
            "${quality_args[@]}" "${gpt_args[@]}" --stage "$STAGE" \
            --exam "$GITHUB_WORKSPACE/target/$EXAM" \
            --evidence "$GITHUB_WORKSPACE/target/$EVIDENCE" --json

      - name: Seal GPT stage with canonical V2 CLI
        if: steps.args.outputs.execution_line == 'GPT_SCHEDULED'
        shell: bash
        env:
          STAGE: ${{ steps.args.outputs.stage }}
          EXAM: ${{ steps.args.outputs.exam }}
          EVIDENCE: ${{ steps.args.outputs.evidence }}
          CAMPAIGN: ${{ steps.args.outputs.campaign_id }}
          STREAM: ${{ steps.args.outputs.stream }}
        run: |
          set -euo pipefail
          exam_uid="$(basename "$EXAM" .js)"
          node validator-src/archive/tools/gpt2-validate-and-seal.mjs \
            --stage "$STAGE" \
            --exam "$GITHUB_WORKSPACE/target/$EXAM" \
            --evidence "$GITHUB_WORKSPACE/target/$EVIDENCE" \
            --asset-root "$GITHUB_WORKSPACE/target/archive" \
            --output-root "$RUNNER_TEMP/gpt2-seals" \
            --campaign-id "$CAMPAIGN" --stream "$STREAM" --exam-uid "$exam_uid"

      - name: Upload immutable GPT V2 seal and handoff
        if: success() && steps.args.outputs.execution_line == 'GPT_SCHEDULED'
        uses: actions/upload-artifact@v4
        with:
          name: gpt2-native-seal-${{ github.event.issue.number }}-${{ github.run_id }}
          path: ${{ runner.temp }}/gpt2-seals
          if-no-files-found: error
          retention-days: 30
