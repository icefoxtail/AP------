name: Problem Bank Shared Meta
on:
  push:
    branches: [main]
    paths: ['archive/**', 'tests/*meta*', 'tests/archive-original-exam-access.browser.cjs', '.github/workflows/problem-bank-meta.yml']
  pull_request:
    branches: [main]
    paths: ['archive/**', 'tests/*meta*', 'tests/archive-original-exam-access.browser.cjs', '.github/workflows/problem-bank-meta.yml']
  workflow_dispatch:
# A newer push to the same pull request cancels that PR's older run, and a newer push to the same branch (main)
# cancels that branch's older run: only the newest commit keeps a verdict (runner capacity: 20 concurrent jobs —
# on 2026-11-24 forty merges queued 100+ runs and the student release waited 40-50 minutes for a runner).
# Manual runs keep one group per run and are never cancelled.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('problem-bank-meta-pr-{0}', github.event.pull_request.number) || github.event_name == 'push' && format('problem-bank-meta-push-{0}', github.ref) || format('problem-bank-meta-{0}-{1}', github.event_name, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

permissions:
  contents: read
jobs:
  shared-meta:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Assemble question metadata (git holds its shards)
        run: if [ -d archive/data/question-metadata/v1 ]; then node archive/tools/meta-foundation/question-metadata-format.mjs assemble; fi
      - name: Meta persistence, recovery and shared consumer contracts
        id: meta_diagnostics
        continue-on-error: true
        run: node --test tests/problem-bank-meta.test.cjs tests/problem-bank-meta-consumers.test.cjs tests/generated-meta-backfill.test.cjs tests/generated-meta-browse-aliases.test.cjs
      - name: Record metadata repair debt
        if: always()
        env:
          META_OUTCOME: ${{ steps.meta_diagnostics.outcome }}
        run: |
          echo "metadata_integrity=$META_OUTCOME" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$META_OUTCOME" != success ]]; then
            echo "::warning title=Metadata supplement required::Student availability checks continue; review failed meta diagnostics."
          fi
      - uses: browser-actions/setup-chrome@v1
        id: chrome
        with:
          chrome-version: stable
      - name: Install browser driver used by this audit
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm install --no-save --package-lock=false playwright@1.62.1
      - name: Actual Chrome shared search and storage failure
        id: browser_meta_diagnostics
        continue-on-error: true
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: node tests/problem-bank-meta-browser.cjs
      - name: Verify original exam opens for students in actual Chrome
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: node tests/archive-original-exam-access.browser.cjs
      - name: Record browser metadata repair debt
        if: always()
        env:
          BROWSER_META_OUTCOME: ${{ steps.browser_meta_diagnostics.outcome }}
        run: |
          echo "browser_meta_diagnostics=$BROWSER_META_OUTCOME" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$BROWSER_META_OUTCOME" != success ]]; then
            echo "::warning title=Search metadata supplement required::Original exam access was checked separately."
          fi
