name: AP Math G7 published verification carrier

# Read-only verification of an already deployed release. The carrier commit is
# separate from the fixed production source and never participates in deployment.
on:
  push:
    branches: ['verify/g7-published-20261113']
    paths:
      - '.github/workflows/apmath-g7-published-verification.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: g7-published-verification-${{ github.ref }}
  cancel-in-progress: false

jobs:
  published-site:
    if: github.event_name == 'push' && github.ref == 'refs/heads/verify/g7-published-20261113'
    name: Published G7 contents and exploration
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      G7_EXPECTED_SOURCE_SHA: 2b90b85dd848806ba62f844b85225db8bcae5ee3
      G7_RELEASE_RUN_ID: '43405046014'
      G7_RELEASE_RECEIPT_URL: https://icefoxtail.github.io/AP------/_archive-release.json
      # Same STUDENT_BASE as g7-student-live-smoke.mjs, without manual=1.
      G7_BASE_URL: https://icefoxtail.github.io/AP------/apmath/playground/next/labs/
      G7_TOC_SCENARIOS: contents-inventory,responsive-navigation,exploration-reload-sharing,live-history-restoration,polyhedra-direct-manipulation,coordinate-reading
      G7_REFERENCE_PLAYBACK: reuse
      G7_REFERENCE_EVIDENCE: >-
        Unchanged proof mathematics and playback reuse PR https://github.com/icefoxtail/AP------/pull/1950
        and CI https://github.com/icefoxtail/AP------/actions/runs/43348371314
        and https://github.com/icefoxtail/AP------/actions/runs/43346417520.
        This published-site run checks changed student navigation and exploration;
        it does not replay all 580 proofs.
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 2b90b85dd848806ba62f844b85225db8bcae5ee3
          fetch-depth: 1
          sparse-checkout: apmath/playground/next
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Bind the checked-out source and verify published file bytes
        id: published_source
        timeout-minutes: 5
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import crypto from 'node:crypto';
          import fs from 'node:fs';
          import path from 'node:path';
          import { execFileSync } from 'node:child_process';
          const out = path.join(process.env.RUNNER_TEMP, 'g7-toc-live');
          const sourceDir = path.join(out, 'source');
          fs.mkdirSync(sourceDir, { recursive: true });
          const sourceSha = execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim();
          const sourceTree = execFileSync('git', ['rev-parse', 'HEAD^{tree}'], { encoding: 'utf8' }).trim();
          fs.writeFileSync(path.join(sourceDir, 'commit.txt'), sourceSha + '\n');
          fs.writeFileSync(path.join(sourceDir, 'tree.txt'), sourceTree + '\n');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `sha=${sourceSha}\n`);
          const sha256 = bytes => crypto.createHash('sha256').update(bytes).digest('hex');
          const trigger = {
            event: process.env.GITHUB_EVENT_NAME, ref: process.env.GITHUB_REF,
            carrierSha: process.env.GITHUB_SHA, workflowSha: process.env.GITHUB_WORKFLOW_SHA,
            workflowRef: process.env.GITHUB_WORKFLOW_REF
          };
          fs.writeFileSync(path.join(sourceDir, 'trigger.json'), JSON.stringify(trigger, null, 2) + '\n');
          assert.equal(trigger.event, 'push');
          assert.equal(trigger.ref, 'refs/heads/verify/g7-published-20261113');
          assert.equal(process.env.GITHUB_REPOSITORY, 'icefoxtail/AP------');
          assert.equal(sourceSha, process.env.G7_EXPECTED_SOURCE_SHA);
          assert.match(process.env.G7_RELEASE_RUN_ID, /^\d+$/);
          assert.ok(process.env.GITHUB_TOKEN, 'Read-only Actions token is required to verify the release');
          // Store response bodies and observations, never the authorization headers.
          const getEvidenceJSON = async (url, file, headers = {}) => {
            const response = await fetch(url, {
              method: 'GET', redirect: 'error', signal: AbortSignal.timeout(30000),
              headers: { 'Cache-Control': 'no-cache', 'Accept-Encoding': 'identity', ...headers }
            });
            const bytes = Buffer.from(await response.arrayBuffer());
            fs.writeFileSync(path.join(sourceDir, `${file}.json`), bytes);
            const observation = {
              url, responseURL: response.url, status: response.status,
              bytes: bytes.length, sha256: sha256(bytes), fetchedAt: new Date().toISOString(),
              etag: response.headers.get('etag'), lastModified: response.headers.get('last-modified')
            };
            fs.writeFileSync(path.join(sourceDir, `${file}-observation.json`), JSON.stringify(observation, null, 2) + '\n');
            assert.equal(response.status, 200, `Expected a successful GET for ${file}`);
            return { value: JSON.parse(bytes.toString('utf8')), observation };
          };
          const api = new URL(process.env.GITHUB_API_URL);
          assert.equal(api.origin, 'https://api.github.com');
          const releaseURL = new URL(`/repos/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.G7_RELEASE_RUN_ID}`, api);
          const apiHeaders = {
            Authorization: `Bearer ${process.env.GITHUB_TOKEN}`,
            Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'
          };
          const { value: release } = await getEvidenceJSON(releaseURL.href, 'release-run', apiHeaders);
          assert.equal(String(release.id), process.env.G7_RELEASE_RUN_ID);
          assert.equal(release.name, 'Archive Pages Release');
          assert.equal(release.head_branch, 'main');
          assert.equal(release.status, 'completed');
          assert.equal(release.conclusion, 'success');
          assert.equal(release.head_sha, sourceSha);
          const { value: releaseJobs } = await getEvidenceJSON(`${releaseURL.href}/jobs?filter=latest&per_page=100`, 'release-jobs', apiHeaders);
          assert.equal(releaseJobs.jobs.length, releaseJobs.total_count, 'All jobs in this exact release must be observed');
          const deployments = releaseJobs.jobs.filter(job => job.name === 'Deploy the verified student release');
          assert.equal(deployments.length, 1, 'The release must contain an actual deploy job');
          const deployment = deployments[0];
          assert.equal(deployment.run_id, release.id);
          assert.equal(deployment.status, 'completed');
          assert.equal(deployment.conclusion, 'success');
          const deploySteps = deployment.steps.filter(step => step.name === 'Deploy Pages artifact');
          assert.equal(deploySteps.length, 1);
          assert.equal(deploySteps[0].status, 'completed');
          assert.equal(deploySteps[0].conclusion, 'success');
          // Public receipt requests deliberately receive no GitHub authorization header.
          const { value: receipt, observation: receiptObservation } = await getEvidenceJSON(process.env.G7_RELEASE_RECEIPT_URL, 'published-release-receipt');
          assert.equal(receipt.registeredMainSHA, sourceSha);
          assert.equal(receipt.releaseGate, 'RELEASE_GATE_PASS');
          const source = {
            sourceSha, sourceTree, baseURL: process.env.G7_BASE_URL,
            workflowContextSha: process.env.GITHUB_SHA, trigger,
            runId: process.env.GITHUB_RUN_ID, runAttempt: process.env.GITHUB_RUN_ATTEMPT,
            release: { id: release.id, url: release.html_url, eventHeadSha: release.head_sha, headBranch: release.head_branch, status: release.status, conclusion: release.conclusion, deployJobId: deployment.id, deployStep: deploySteps[0].name },
            publishedReceipt: { ...receiptObservation, registeredMainSHA: receipt.registeredMainSHA, releaseGate: receipt.releaseGate, packageDigest: receipt.packageDigest },
            expectedScenarios: process.env.G7_TOC_SCENARIOS.split(','),
            extraNativeCheck: { lab: 'common-circle-eq', environment: 'PC·칠판', expectedScenes: 32, entryMode: 'Existing scene-smoke native manual route, separate from ordinary G7 student URLs' },
            reusedPlaybackEvidence: process.env.G7_REFERENCE_EVIDENCE,
            sourceMeaning: 'Browser and native test source is the fixed deployed main checkout, distinct from the push carrier SHA. The exact successful release, actual deploy job/step and public receipt are verified before the eight changed runtime files are compared byte for byte. This carrier adds a verification entry and does not change or run deployment gates.'
          };
          fs.writeFileSync(path.join(sourceDir, 'context.json'), JSON.stringify(source, null, 2) + '\n');
          fs.writeFileSync(path.join(sourceDir, 'git-objects.txt'), execFileSync('git', [
            'ls-tree', '-r', 'HEAD', '--', 'apmath/playground/next', '.github/workflows/apmath-g7-toc-ux.yml'
          ]));
          // The Pages manifest includes apmath; its builder copies these JS/CSS/HTML
          // bytes unchanged. Its JSON compaction and added SVG projections do not apply.
          const files = [
            'kit/apl-g7-learning.css', 'kit/apl-g7-learning.js',
            'kit/apl-g7-short-coordinates.js', 'kit/apl-player.js',
            'kit/apl-toc.js', 'labs/middle-functions/g7.js', 'labs/middle-functions/core.js',
            'labs/common-circle-eq.html'
          ];
          const nextBase = new URL('../', process.env.G7_BASE_URL);
          const report = { status: 'RUNNING', sourceSha, baseURL: source.baseURL, files: [], errors: [] };
          const save = () => fs.writeFileSync(path.join(out, 'published-bytes.json'), JSON.stringify(report, null, 2) + '\n');
          save();
          for (const relative of files) {
            const file = `apmath/playground/next/${relative}`;
            const url = new URL(relative, nextBase).href;
            const row = { file, url };
            report.files.push(row);
            try {
              const expected = fs.readFileSync(file);
              const expectedPath = path.join(out, 'source-files', relative);
              fs.mkdirSync(path.dirname(expectedPath), { recursive: true });
              fs.writeFileSync(expectedPath, expected);
              row.expectedBytes = expected.length;
              row.expectedSha256 = sha256(expected);
              const response = await fetch(url, {
                method: 'GET', redirect: 'error', signal: AbortSignal.timeout(30000),
                headers: { 'Cache-Control': 'no-cache', 'Accept-Encoding': 'identity' }
              });
              const bytes = Buffer.from(await response.arrayBuffer());
              const servedPath = path.join(out, 'served-files', relative);
              fs.mkdirSync(path.dirname(servedPath), { recursive: true });
              fs.writeFileSync(servedPath, bytes);
              Object.assign(row, {
                status: response.status, responseURL: response.url, servedBytes: bytes.length,
                servedSha256: sha256(bytes), etag: response.headers.get('etag'),
                lastModified: response.headers.get('last-modified'), fetchedAt: new Date().toISOString()
              });
              row.match = response.status === 200 && row.servedSha256 === row.expectedSha256 && bytes.equals(expected);
              if (!row.match) report.errors.push({ file, reason: 'Published response does not match checked-out source bytes' });
            } catch (error) {
              row.match = false;
              row.error = error.message;
              report.errors.push({ file, reason: error.message });
            }
            save();
          }
          report.status = report.errors.length ? 'FAIL' : 'PUBLISHED_BYTES_MATCHED';
          save();
          assert.equal(report.errors.length, 0, 'Published runtime bytes must match checked-out main before browser verification');
          NODE

      - name: Install Chromium and Korean fonts
        timeout-minutes: 10
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/g7-toc-live-browser" --no-save --package-lock=false --no-audit --no-fund playwright@1.56.1
          "$RUNNER_TEMP/g7-toc-live-browser/node_modules/.bin/playwright" install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk

      - name: Read the published student contents and exploration routes
        timeout-minutes: 20
        env:
          NODE_PATH: ${{ runner.temp }}/g7-toc-live-browser/node_modules
          G7_PUBLISHED_SOURCE_SHA: ${{ steps.published_source.outputs.sha }}
          G7_TOC_EVIDENCE: ${{ runner.temp }}/g7-toc-live/browser
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$G7_PUBLISHED_SOURCE_SHA" ]]
          # Only this child process receives the actual checkout SHA for the
          # existing report.commit field; the carrier event SHA is saved above.
          GITHUB_SHA="$G7_PUBLISHED_SOURCE_SHA" \
            node apmath/playground/next/tools/g7-toc-ux-browser.mjs \
            2>&1 | tee "$RUNNER_TEMP/g7-toc-live/browser.log"

      - name: Read the published common-circle-eq native bootstrap separately
        timeout-minutes: 5
        env:
          NODE_PATH: ${{ runner.temp }}/g7-toc-live-browser/node_modules
          G7_PUBLISHED_SOURCE_SHA: ${{ steps.published_source.outputs.sha }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$G7_PUBLISHED_SOURCE_SHA" ]]
          g7_native_out="$RUNNER_TEMP/g7-toc-live/extra-native/common-circle-eq"
          mkdir -p "$g7_native_out"
          # This existing native/manual smoke is additional to the six ordinary
          # G7 student routes above; their entry URLs and checks remain unchanged.
          GITHUB_SHA="$G7_PUBLISHED_SOURCE_SHA" \
            node apmath/playground/next/tools/scene-smoke.mjs "$G7_BASE_URL" \
            --only common-circle-eq --runs 'PC·칠판' --report "$g7_native_out/report.json" \
            2>&1 | tee "$g7_native_out/run.log"

      - name: Verify published evidence identities and measured scenarios
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import path from 'node:path';
          import { execFileSync } from 'node:child_process';
          const out = path.join(process.env.RUNNER_TEMP, 'g7-toc-live');
          const read = file => JSON.parse(fs.readFileSync(path.join(out, file), 'utf8'));
          const source = read('source/context.json');
          const bytes = read('published-bytes.json');
          const browser = read('browser/toc-ux-report.json');
          const native = read('extra-native/common-circle-eq/report.json');
          assert.equal(source.sourceSha, execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim());
          assert.equal(source.sourceSha, process.env.G7_EXPECTED_SOURCE_SHA);
          assert.equal(source.workflowContextSha, process.env.GITHUB_SHA);
          assert.equal(source.trigger.carrierSha, process.env.GITHUB_SHA);
          assert.equal(source.release.eventHeadSha, source.sourceSha);
          assert.equal(String(source.release.id), process.env.G7_RELEASE_RUN_ID);
          assert.equal(source.publishedReceipt.registeredMainSHA, source.sourceSha);
          assert.equal(source.publishedReceipt.releaseGate, 'RELEASE_GATE_PASS');
          assert.equal(bytes.sourceSha, source.sourceSha);
          assert.equal(bytes.status, 'PUBLISHED_BYTES_MATCHED');
          assert.equal(bytes.files.length, 8);
          assert.ok(bytes.files.every(file => file.match));
          assert.equal(browser.commit, source.sourceSha);
          assert.equal(browser.status, 'UX_TECHNICAL_CHECKS_PASSED');
          assert.deepEqual(browser.scenarios.map(row => row.name).sort(), [...source.expectedScenarios].sort());
          assert.ok(browser.scenarios.every(row => row.status === 'PASS'));
          assert.equal(native.source, source.sourceSha);
          assert.equal(native.status, 'PASS');
          assert.equal(native.runs.length, 1);
          const nativeRun = native.runs[0];
          assert.equal(nativeRun.file, `${source.extraNativeCheck.lab}.html`);
          assert.equal(nativeRun.environment, source.extraNativeCheck.environment);
          assert.equal(nativeRun.status, 'PASS');
          assert.equal(nativeRun.rows.length, source.extraNativeCheck.expectedScenes);
          assert.equal(new Set(nativeRun.rows.map(row => row.id)).size, source.extraNativeCheck.expectedScenes);
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, [
            `Published student URL: ${source.baseURL}`,
            `Checked-out source: ${source.sourceSha}`,
            `Eight changed runtime files: exact published SHA256 and bytes matched`,
            `Measured student scenarios: ${browser.scenarios.map(row => row.name).join(', ')}`,
            `Current contents inventory: ${JSON.stringify(browser.conversion)}`,
            `Additional native bootstrap: ${source.extraNativeCheck.lab}, ${nativeRun.environment}, ${nativeRun.rows.length} scenes; separate from ordinary G7 student routes`,
            `Verified Pages release: ${source.release.url}; actual deploy job ${source.release.deployJobId}; source ${source.release.eventHeadSha}`,
            `Published receipt: ${source.publishedReceipt.registeredMainSHA}, ${source.publishedReceipt.releaseGate}`,
            `Verification carrier: ${source.trigger.carrierSha} (${source.trigger.event} ${source.trigger.ref})`,
            'Scope: published navigation and exploration; unchanged proof playback uses the recorded prior evidence.',
            ''
          ].join('\n'));
          NODE

      - name: Preserve published source, response bytes, reports and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g7-toc-live-release-43405046014-${{ github.run_id }}-${{ github.run_attempt }}-carrier-${{ github.sha }}
          path: ${{ runner.temp }}/g7-toc-live/
          retention-days: 14
          if-no-files-found: error
