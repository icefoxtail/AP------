name: G8 G9 geometry browser

on:
  pull_request:
    branches: [main]
    paths:
      - 'apmath/playground/next/labs/g8-*/**'
      - 'apmath/playground/next/labs/g8-*.html'
      - 'apmath/playground/next/labs/g9-*/**'
      - 'apmath/playground/next/labs/g9-*.html'
      - 'apmath/playground/next/kit/**'
      - 'apmath/playground/next/tools/g8-*'
      - 'apmath/playground/next/tools/g9-*'
      - 'apmath/playground/next/tools/high-evidence-binding.mjs'
      - 'apmath/playground/next/tools/browser-screenshot-guard*'
      - 'apmath/playground/next/tools/high-viewport-evidence*'
      - 'apmath/playground/next/tools/middle-screenshot-contract.test.mjs'
      - '.github/workflows/g8-g9-geometry-browser.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    strategy:
      fail-fast: false
      matrix:
        unit: [g8-triangles, g8-quadrilaterals, g8-similarity, g8-pythagoras, g9-trig-ratio, g9-circle]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      APMATH_CANDIDATE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      APMATH_BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
      APMATH_PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            apmath/playground
            .github/workflows
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Select affected units and fixed baseline
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
          UNIT: ${{ matrix.unit }}
        run: |
          git fetch --no-tags --depth=1 origin "$APMATH_CANDIDATE_HEAD_SHA"
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          node --input-type=module <<'JS'
          import {execFileSync} from 'node:child_process';
          import fs from 'node:fs';
          const all = ['g8-triangles','g8-quadrilaterals','g8-similarity','g8-pythagoras','g9-trig-ratio','g9-circle'];
          const changed = execFileSync('git',['diff','--name-only',process.env.BASE_SHA,'HEAD'],{encoding:'utf8'}).trim().split('\n');
          const picked = new Set(changed.map(p => /^apmath\/playground\/next\/labs\/(g[89]-[\w-]+)(?:\/|\.html$)/.exec(p)?.[1]).filter(x => all.includes(x)));
          for (const p of changed) {
            const unit = /(?:g8-g9-geometry-audit-targets-)?(g[89]-[\w-]+)(?:\.json|-.*\.test\.mjs)$/.exec(p)?.[1];
            if (all.includes(unit)) picked.add(unit);
          }
          // A unit implementation PR includes its full scene inventory. Shared-kit
          // changes or a harness-only PR test every unit; no scene sampling gate.
          const shared = changed.some(p => /\/kit\//.test(p) || /high-evidence-binding\.mjs$|(?:browser-screenshot-guard|high-viewport-evidence|middle-screenshot-contract)(?:\.test)?\.mjs$|g8-g9-(?:geometry-browser-audit|student-live-smoke)\.mjs$|g8-g9-geometry-browser\.yml$/.test(p));
          const affected = shared || !picked.size ? all : [...picked];
          const active = affected.includes(process.env.UNIT);
          fs.appendFileSync(process.env.GITHUB_OUTPUT,`active=${active}\n`);
          if (active) execFileSync('git',['worktree','add','--detach',`${process.env.RUNNER_TEMP}/g89-baseline`,process.env.BASE_SHA]);
          JS
      - name: Current-question mathematical regressions
        if: steps.scope.outputs.active == 'true'
        shell: bash
        env:
          UNIT: ${{ matrix.unit }}
        run: |
          shopt -s nullglob
          tests=(apmath/playground/next/tools/"$UNIT"-*.test.mjs)
          if (( ${#tests[@]} )); then node --test "${tests[@]}"; else echo "No unit-specific mathematical regression supplied yet"; fi
          node --test apmath/playground/next/tools/catalog.test.mjs apmath/playground/next/tools/apl-problem-tag-state.test.mjs apmath/playground/next/tools/g8-g9-student-live-smoke.test.mjs
          node --test apmath/playground/next/tools/browser-screenshot-guard.test.mjs apmath/playground/next/tools/middle-screenshot-contract.test.mjs
      - name: Install Chromium test runtime
        if: steps.scope.outputs.active == 'true'
        run: |
          npm install --prefix "$RUNNER_TEMP/g89-browser" --no-save --package-lock=false --no-audit --no-fund playwright@1.56.1
          "$RUNNER_TEMP/g89-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Observe baseline at four viewports and both themes
        if: steps.scope.outputs.active == 'true'
        env:
          NODE_PATH: ${{ runner.temp }}/g89-browser/node_modules
          UNIT: ${{ matrix.unit }}
        run: node apmath/playground/next/tools/g8-g9-geometry-browser-audit.mjs --root "$RUNNER_TEMP/g89-baseline" --out "$RUNNER_TEMP/g89-evidence/before" --units "$UNIT" --baseline-observe
      - name: Validate every candidate scene and generated variants
        if: steps.scope.outputs.active == 'true'
        env:
          NODE_PATH: ${{ runner.temp }}/g89-browser/node_modules
          UNIT: ${{ matrix.unit }}
        run: node apmath/playground/next/tools/g8-g9-geometry-browser-audit.mjs --root . --out "$RUNNER_TEMP/g89-evidence/after" --units "$UNIT"
      - uses: actions/upload-artifact@v4
        if: always() && steps.scope.outputs.active == 'true'
        with:
          name: g8-g9-geometry-${{ github.run_id }}-${{ matrix.unit }}
          path: ${{ runner.temp }}/g89-evidence/
          retention-days: 14
      - name: Prepare geometry review pack
        if: always() && steps.scope.outputs.active == 'true'
        run: node apmath/playground/next/tools/geometry-review-pack.mjs --input "$RUNNER_TEMP/g89-evidence" --out "$RUNNER_TEMP/g89-review-pack"
      - uses: actions/upload-artifact@v4
        if: always() && steps.scope.outputs.active == 'true'
        with:
          name: geometry-review-${{ github.run_id }}-${{ matrix.unit }}
          path: ${{ runner.temp }}/g89-review-pack/
          retention-days: 14

  student-flow:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: apmath/playground
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium for the actual student navigation
        run: |
          npm install --prefix "$RUNNER_TEMP/g89-flow-browser" --no-save --package-lock=false --no-audit --no-fund playwright@1.56.1
          "$RUNNER_TEMP/g89-flow-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Verify six lab flows and exact checkout assets at four sizes and both themes
        env:
          NODE_PATH: ${{ runner.temp }}/g89-flow-browser/node_modules
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory . > "$RUNNER_TEMP/g89-flow-http.log" 2>&1 &
          G89_FLOW_HTTP_PID=$!
          trap 'kill "$G89_FLOW_HTTP_PID" 2>/dev/null || true' EXIT
          node --input-type=module <<'JS'
          for (let n = 0; ; n++) {
            try { const r = await fetch('http://127.0.0.1:4173/apmath/playground/next/kit/apl-catalog.js'); if (r.ok) break; } catch {}
            if (n >= 30) throw Error('Local CI HTTP server did not become ready');
            await new Promise(resolve => setTimeout(resolve, 200));
          }
          JS
          node apmath/playground/next/tools/g8-g9-student-live-smoke.mjs --base-url http://127.0.0.1:4173/apmath/playground/next/labs/ --out "$RUNNER_TEMP/g89-student-flow"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g8-g9-student-flow-${{ github.run_id }}
          path: ${{ runner.temp }}/g89-student-flow/
          retention-days: 14
