name: Middle Bounded Renderer Continuity Chrome

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.github/workflows/middle-bounded-renderer-continuity-chrome.yml'
      - 'tools/check-m1s2-problem-seven-browser.cjs'
      - 'tools/check-m3s2-q16-layout-browser.cjs'
      - 'tools/check-reviewed-problem-renderer-browser.cjs'
      - 'tests/fixtures/archive-m1s2-problem-seven-ui.json'
      - 'tests/fixtures/archive-m3s2-q16-layout-ui.json'
      - 'archive/engine.html'
      - 'archive/exams/original/middle/m1/2final/23_금당중_2학기_기말_중1_기출.js'
      - 'archive/exams/original/middle/m1/2final/23_왕운중_2학기_기말_중1_기출.js'
      - 'archive/exams/original/middle/m1/2final/24_향림중_2학기_기말_중1_기출.js'
      - 'archive/exams/original/middle/m1/2final/25_팔마중_2학기_기말_중1_기출.js'
      - 'archive/exams/original/middle/m1/2final/25_풍덕중_2학기_기말_중1_기출.js'
      - 'archive/exams/original/middle/m3/2final/25_풍덕중_2학기_기말_중3_기출.js'

permissions:
  contents: read

concurrency:
  group: middle-bounded-renderer-ui-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  m1s2-problem-seven:
    name: M1S2 seven problem renderers — 14 views
    if: github.repository == 'icefoxtail/AP------' && github.event.pull_request.head.repo.full_name == github.repository && !github.event.pull_request.head.repo.fork
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /archive/*.js
            /archive/*.css
            /archive/engine.html
            /archive/css/
            /archive/js/
            /archive/vendor/
            /archive/data/svg-accessibility-index.js
            /archive/data/question_identity_map.json
            /archive/exams/original/middle/m1/2final/24_향림중_2학기_기말_중1_기출.js
            /archive/exams/original/middle/m1/2final/25_팔마중_2학기_기말_중1_기출.js
            /archive/exams/original/middle/m1/2final/25_풍덕중_2학기_기말_중1_기출.js
            /archive/exams/original/middle/m1/2mid/23_향림중_2학기_중간_중1_기출.js
            /archive/exams/original/middle/m1/2mid/26_팔마중_2학기_중간_중1_기출.js
            /archive/assets/images/24_향림중_2학기_기말_중1_기출/
            /archive/assets/images/25_팔마중_2학기_기말_중1_기출/
            /archive/assets/images/25_풍덕중_2학기_기말_중1_기출/
            /archive/assets/images/23_향림중_2학기_중간_중1_기출/
            /archive/assets/images/26_팔마중_2학기_중간_중1_기출/
            /apmath/css/student-navigation.css
            /apmath/js/student-navigation.js
            /tools/check-reviewed-problem-renderer-browser.cjs
            /tools/check-m1s2-problem-seven-browser.cjs
            /tests/fixtures/archive-m1s2-problem-seven-ui.json
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: browser-actions/setup-chrome@v1
        id: chrome
        with:
          chrome-version: stable
      - name: Install the isolated browser driver
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm install --prefix "$RUNNER_TEMP/m1-renderer-driver" --no-save --package-lock=false playwright@1.62.1
      - name: Capture the exact seven selected problem surfaces
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
          ARCHIVE_M1S2_UI_EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: NODE_PATH="$RUNNER_TEMP/m1-renderer-driver/node_modules" node tools/check-m1s2-problem-seven-browser.cjs --root "$GITHUB_WORKSPACE" --output "$RUNNER_TEMP/m1s2-problem-seven-ui"
      - name: Preserve raw technical evidence and original capture tiles
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m1s2-problem-seven-ui-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/m1s2-problem-seven-ui/
          if-no-files-found: error
          retention-days: 14

  m3s2-layout-one:
    name: M3S2 one existing layout — 2 views
    if: github.repository == 'icefoxtail/AP------' && github.event.pull_request.head.repo.full_name == github.repository && !github.event.pull_request.head.repo.fork
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /archive/*.js
            /archive/*.css
            /archive/engine.html
            /archive/css/
            /archive/js/
            /archive/vendor/
            /archive/data/svg-accessibility-index.js
            /archive/data/question_identity_map.json
            /archive/exams/original/middle/m3/2final/25_풍덕중_2학기_기말_중3_기출.js
            /archive/assets/images/25_풍덕중_2학기_기말_중3_기출/
            /apmath/css/student-navigation.css
            /apmath/js/student-navigation.js
            /tools/check-reviewed-problem-renderer-browser.cjs
            /tools/check-m3s2-q16-layout-browser.cjs
            /tests/fixtures/archive-m3s2-q16-layout-ui.json
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: browser-actions/setup-chrome@v1
        id: chrome
        with:
          chrome-version: stable
      - name: Install the isolated browser driver
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm install --prefix "$RUNNER_TEMP/m3-layout-driver" --no-save --package-lock=false playwright@1.62.1
      - name: Capture the exact existing layout in both viewports
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
          ARCHIVE_M3S2_LAYOUT_UI_EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: NODE_PATH="$RUNNER_TEMP/m3-layout-driver/node_modules" node tools/check-m3s2-q16-layout-browser.cjs --output "$RUNNER_TEMP/m3s2-q16-layout-ui"
      - name: Preserve separate layout technical evidence and capture tiles
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3s2-q16-layout-ui-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/m3s2-q16-layout-ui/
          if-no-files-found: error
          retention-days: 14
