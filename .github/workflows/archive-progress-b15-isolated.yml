name: Archive Progress B15 Scoped Integration (review only)
on:
  push:
    branches: [review/archive-progress-live-20261011]
    paths: [.observer-review/b15-trigger.txt]
permissions:
  contents: write
  actions: read
  pull-requests: read
jobs:
  b15-live:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Exact reviewed checkout
        uses: actions/checkout@v4
        with:
          ref: c78dd7ac4bbb009a6917dc4d97f30ea9e580d9ae
          persist-credentials: false
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Collect B15 read-only actual API evidence and write test state only
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OBSERVER_EXPECTED_SHA: c78dd7ac4bbb009a6917dc4d97f30ea9e580d9ae
        run: node .observer-review/b15-live-check.mjs
      - name: Render saved real JSON with Chromium and test refresh behavior
        run: |
          python3 -m pip install --quiet playwright
          python3 -m playwright install --with-deps chromium
          python3 .observer-review/live-ui.py
      - name: Preserve screen and readback evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: archive-progress-b15-actual-live-screen
          path: |
            observer-live-status.json
            observer-live-report.json
            observer-live-screenshot.png
          if-no-files-found: warn
          retention-days: 7
