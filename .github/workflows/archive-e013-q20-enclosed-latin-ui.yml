name: Archive E013 Enclosed Latin UI Evidence

on:
  push:
    branches: ['review-reference/e013-enclosed-latin-ui-20261116']
    paths:
      - 'archive/engine.html'
      - 'archive/mathjax_render_loop.js'
      - 'archive/vendor/ap-enclosed-latin/**'
      - 'tools/check-e013-q20-enclosed-latin-browser.cjs'
      - 'tools/check-reviewed-problem-renderer-browser.cjs'
      - 'tests/fixtures/archive-e013-q20-enclosed-latin-ui.json'
      - 'tests/archive-e013-q20-enclosed-latin-ui.test.cjs'
      - 'tests/archive-mathjax-enclosed-latin-font.test.cjs'
      - '.github/workflows/archive-e013-q20-enclosed-latin-ui.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e013-enclosed-latin-ui:
    name: Exact E013 Q20 problem-only desktop and mobile evidence
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify the closed problem-only capture contract
        run: node --test tests/archive-e013-q20-enclosed-latin-ui.test.cjs tests/archive-mathjax-enclosed-latin-font.test.cjs tests/archive-mathjax-render-loop.test.js
      - uses: browser-actions/setup-chrome@v1
        id: chrome
        with:
          chrome-version: stable
      - name: Install the pinned browser driver outside the checkout
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm install --prefix "$RUNNER_TEMP/e013-enclosed-latin-ui-browser" --no-save --package-lock=false --no-audit --no-fund playwright@1.62.1
      - name: Capture exact E013 Q20 original scroll tiles in actual Chrome
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
          NODE_PATH: ${{ runner.temp }}/e013-enclosed-latin-ui-browser/node_modules
          ARCHIVE_E013_Q20_UI_EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node tools/check-e013-q20-enclosed-latin-browser.cjs --output "$RUNNER_TEMP/e013-q20-enclosed-latin-ui"
      - name: Preserve original problem-only evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e013-q20-enclosed-latin-ui-only-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/e013-q20-enclosed-latin-ui/
          if-no-files-found: warn
          retention-days: 14
