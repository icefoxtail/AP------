name: Generated Mock Exam Browser Smoke

on:
  push:
    branches: [main]
    paths:
      - 'archive/generated-bank.html'
      - 'archive/data/generated-lite-consumer/**'
      - 'tools/check-generated-bank-browser.cjs'
      - '.github/workflows/generated-consumer-browser-smoke.yml'
  pull_request:
    branches: [main]
    paths:
      - 'archive/generated-bank.html'
      - 'archive/data/generated-lite-consumer/**'
      - 'tools/check-generated-bank-browser.cjs'
      - '.github/workflows/generated-consumer-browser-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Actual Chrome 23/26 mock exam print
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify registered 165 and original 23/26 mock paper flow
        run: node --test tests/archive2-generated-bank-registration.test.js tests/archive2-generated-bank-subjective-table.test.cjs tests/archive2-bokseong-b04-b05-consumer.test.cjs
      - uses: browser-actions/setup-chrome@v1
        id: chrome
        with:
          chrome-version: stable
      - name: Verify 23/26 papers, math table, and HOLD exclusion in Chrome
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: node tools/check-generated-bank-browser.cjs
