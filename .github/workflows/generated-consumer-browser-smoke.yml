name: Generated Consumer Browser Smoke

on:
  push:
    branches: [main]
    paths:
      - 'archive/generated-bank.html'
      - 'archive/problem-bank-meta.js'
      - 'archive/archive2-source.js'
      - 'archive/problem-bank-search.html'
      - 'archive/data/generated-lite-consumer/**'
      - 'archive/generated/lite/v1/**'
      - 'archive/tools/generated-meta/rebuild-main-source-consumer.mjs'
      - 'tools/check-geumdang-qid9-browser.cjs'
      - '.github/workflows/generated-consumer-browser-smoke.yml'
  pull_request:
    branches: [main]
    paths:
      - 'archive/generated-bank.html'
      - 'archive/problem-bank-meta.js'
      - 'archive/archive2-source.js'
      - 'archive/problem-bank-search.html'
      - 'archive/data/generated-lite-consumer/**'
      - 'archive/generated/lite/v1/**'
      - 'archive/tools/generated-meta/rebuild-main-source-consumer.mjs'
      - 'tools/check-geumdang-qid9-browser.cjs'
      - '.github/workflows/generated-consumer-browser-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Archive2 Geumdang search and output
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify main source to Generated Consumer projection
        run: node archive/tools/generated-meta/rebuild-main-source-consumer.mjs --check
      - uses: browser-actions/setup-chrome@v1
        id: chrome
        with:
          chrome-version: stable
      - name: Search, select, render problem and solution, and open print preview
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: node tools/check-geumdang-qid9-browser.cjs
