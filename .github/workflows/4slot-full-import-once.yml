name: 4slot Full Import Inspection
on:
  push:
    branches: ['ops/4slot-full-import-20261105']
    paths: ['.github/workflows/4slot-full-import-once.yml']
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Import pinned authored results on latest main without merging author history
        env:
          RELEASE_BRANCH: data/4slot-full-import-e7aab246-20261105
        run: |
          set -euo pipefail
          export RELEASE_EVIDENCE_DIR="$RUNNER_TEMP/4slot-full-release"
          mkdir -p "$RELEASE_EVIDENCE_DIR"
          cp .github/4slot-release.patch.b64 "$RUNNER_TEMP/4slot-release.patch.b64"
          cp .github/4slot-full-release.cjs "$RUNNER_TEMP/4slot-full-release.cjs"
          python - <<'PY'
          import os,base64,zlib,hashlib
          p=os.environ['RUNNER_TEMP']
          s=open(p+'/4slot-release.patch.b64').read().strip()
          s=s.replace('aKeKp3q2i29','aKeKp3qWIxTq2i29')
          b=zlib.decompress(base64.b64decode(s,validate=True))
          assert hashlib.sha256(b).hexdigest()=='71eb97aefc4a3eb812408e42884212516dedcf040d3c8d28becf4d1eee7d8d2a','PATCH_TRANSFER_HASH_MISMATCH'
          marker=b'--- a/tests/item-4slot-runtime.test.cjs\n'
          assert b.count(marker)==1,'TEST_INCLUDE_PATCH_NOT_UNIQUE'
          body,tail=b.split(marker)
          assert tail==b"+++ b/tests/item-4slot-runtime.test.cjs\n@@ -1,1 +1,2 @@\n 'use strict';\n+require('./item-4slot-import-compat.test.cjs');\n",'UNEXPECTED_TEST_PATCH'
          open(p+'/4slot-release.patch','wb').write(body)
          PY
          git fetch origin main
          if git ls-remote --exit-code --heads origin "$RELEASE_BRANCH" >/dev/null; then
            echo 'Release branch already exists; refusing to overwrite.' >&2
            exit 1
          fi
          git switch -c "$RELEASE_BRANCH" origin/main
          git apply --check "$RUNNER_TEMP/4slot-release.patch"
          git apply "$RUNNER_TEMP/4slot-release.patch"
          python - <<'PY'
          p='tests/item-4slot-runtime.test.cjs'
          b=open(p,'rb').read()
          head=b"'use strict';\n"
          include=b"require('./item-4slot-import-compat.test.cjs');\n"
          assert b.startswith(head) and include not in b,'TEST_ENTRYPOINT_CHANGED'
          open(p,'wb').write(head+include+b[len(head):])
          PY
          node "$RUNNER_TEMP/4slot-full-release.cjs" | tee "$RELEASE_EVIDENCE_DIR/prepare.log"
          node --test tests/item-4slot-runtime.test.cjs > "$RELEASE_EVIDENCE_DIR/regression.log"
          node tests/item-4slot-data.test.cjs | tee "$RELEASE_EVIDENCE_DIR/data-test.log"
          node tools/4slot/build-4slot-runtime.cjs --write --report "$RELEASE_EVIDENCE_DIR/register.json" > "$RELEASE_EVIDENCE_DIR/register.log"
          node tools/4slot/build-4slot-runtime.cjs --check --report "$RELEASE_EVIDENCE_DIR/check.json" > "$RELEASE_EVIDENCE_DIR/check.log"
          node tools/4slot/build-4slot-runtime.cjs --write --report "$RELEASE_EVIDENCE_DIR/replay.json" > "$RELEASE_EVIDENCE_DIR/replay.log"
          node - "$RELEASE_EVIDENCE_DIR" <<'JS'
          const fs=require('fs'),p=process.argv[2];
          const read=n=>JSON.parse(fs.readFileSync(p+'/'+n+'.json'));
          for(const n of ['register','check','replay']){const x=read(n);if(x.counts.registered!==8129||x.counts.pending!==0||x.counts.files!==358)throw Error('FULL_IMPORT_INCOMPLETE:'+n);}
          if(read('replay').changed!==false)throw Error('NON_IDEMPOTENT_IMPORT');
          console.log('ALL_8129_REGISTERED_CONSUMER_VERIFIED_NO_DUPLICATE');
          JS
          git restore -- archive/data/item-4slot-index.json
          git diff --exit-code -- archive/exams archive/data/question_metadata.json archive/data/question_identity_map.json
          git diff --check
          git add -- archive/data/item-4slot tools/4slot/exam-items.cjs tools/4slot/build-4slot-runtime.cjs tools/4slot/import-4slot.cjs tests/item-4slot-data.test.cjs tests/item-4slot-import-compat.test.cjs tests/item-4slot-runtime.test.cjs
          git diff --cached --name-only > "$RELEASE_EVIDENCE_DIR/changed-files.txt"
          git diff --cached --stat > "$RELEASE_EVIDENCE_DIR/diff-stat.txt"
          python - <<'PY'
          import subprocess
          paths=subprocess.check_output(['git','diff','--cached','--name-only','-z']).decode().split('\0')
          code={'tools/4slot/exam-items.cjs','tools/4slot/build-4slot-runtime.cjs','tools/4slot/import-4slot.cjs','tests/item-4slot-data.test.cjs','tests/item-4slot-import-compat.test.cjs','tests/item-4slot-runtime.test.cjs'}
          bad=[p for p in paths if p and not(p.startswith('archive/data/item-4slot/') and p.endswith('.4slot.json')) and p not in code]
          assert not bad,bad
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(4slot): import all 358 authored exams with source-bound compact metadata'
          git push origin "HEAD:refs/heads/$RELEASE_BRANCH"
          git rev-parse HEAD > "$RELEASE_EVIDENCE_DIR/release-head.txt"
          git ls-remote origin "refs/heads/$RELEASE_BRANCH" > "$RELEASE_EVIDENCE_DIR/remote-head.txt"
          test "$(cut -f1 "$RELEASE_EVIDENCE_DIR/remote-head.txt")" = "$(cat "$RELEASE_EVIDENCE_DIR/release-head.txt")"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 4slot-full-release
          path: ${{ runner.temp }}/4slot-full-release/
          retention-days: 14
