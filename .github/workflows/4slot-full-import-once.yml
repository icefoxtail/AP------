name: 4slot Full Import Inspection
on:
  push:
    branches: ['ops/4slot-full-import-20261105']
    paths: ['.github/workflows/4slot-full-import-once.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Collect exact historical source objects without changing input
        env:
          AUTHOR_SHA: e7aab2467ecad89b07442f3e2889ddaa889f5eb1
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/4slot-history"
          node <<'JS'
          const fs=require('fs'),path=require('path'),cp=require('child_process'),vm=require('vm');
          const out=process.env.RUNNER_TEMP+'/4slot-history',ref=process.env.AUTHOR_SHA;
          const git=(...a)=>cp.execFileSync('git',a,{encoding:'utf8',maxBuffer:128*1024*1024,stdio:['ignore','pipe','pipe']});
          const queue=JSON.parse(git('show',ref+':archive-work/4slot-annotate-v1/QUEUE-original.json'));
          const qmap=new Map(queue.list.map(r=>[r.path,r]));
          const prefix='archive-work/4slot-annotate-v1/out/';
          const files=git('ls-tree','-rz','--name-only',ref,'--',prefix).split('\0').filter(p=>p.endsWith('.4slot.json'));
          const load=s=>{const ctx={window:{}};vm.createContext(ctx);vm.runInContext(s,ctx,{timeout:3000});return ctx.window.questionBank||ctx.window.examData?.questions||ctx.window.questions;};
          const rows=[];
          for(const f of files){
            const source=f.slice(prefix.length).replace(/\.4slot\.json$/,'.js'),current='archive/exams/'+source;
            const authored=JSON.parse(git('show',ref+':'+f)),baseline=qmap.get(source)?.blob||authored.sourceGitBlobSha;
            const now=git('hash-object',current).trim();if(now===baseline)continue;
            const row={source,baseline,current:now};
            try{const old=git('cat-file','blob',baseline);const p=path.join(out,'historical',source);fs.mkdirSync(path.dirname(p),{recursive:true});fs.writeFileSync(p,old);
              const a=load(old),b=load(fs.readFileSync(current,'utf8'));
              const fields=['content','question','choices','answer','solution','image','images','figureSvg','solutionImage','solutionFigureSvg'];row.changed=[];
              for(let i=0;i<Math.max(a.length,b.length);i++){const changed=fields.filter(k=>JSON.stringify(a[i]?.[k]??null)!==JSON.stringify(b[i]?.[k]??null));if(changed.length)row.changed.push({ordinal:i+1,no:b[i]?.id??b[i]?.number,fields:changed,before:Object.fromEntries(changed.map(k=>[k,a[i]?.[k]??null])),after:Object.fromEntries(changed.map(k=>[k,b[i]?.[k]??null]))});}
            }catch(e){row.error=String(e.message);}rows.push(row);
          }
          fs.writeFileSync(out+'/deltas.json',JSON.stringify(rows,null,2));console.log(JSON.stringify(rows.map(r=>({source:r.source,changed:r.changed?.map(x=>({ordinal:x.ordinal,fields:x.fields})),error:r.error})),null,2));
          JS
          tar -czf "$RUNNER_TEMP/4slot-history.tgz" -C "$RUNNER_TEMP/4slot-history" .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 4slot-history
          path: ${{ runner.temp }}/4slot-history.tgz
          retention-days: 7
