    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node archive/tools/solution-calibration-gate.mjs --exam 'archive/exams/original/middle/m2/1final/26_신흥중_1학기_기말_중2_기출.js' --evidence 'archive/data/r2e-intake/m2/26_신흥중_1학기_기말_중2_기출.review1.physical-evidence.json' --stage R1 --preflight --json
      - run: node archive/tools/review-evidence-gate.mjs --exam 'archive/exams/original/middle/m2/1final/26_신흥중_1학기_기말_중2_기출.js' --evidence 'archive/data/r2e-intake/m2/26_신흥중_1학기_기말_중2_기출.review1.physical-evidence.json' --stage R1 --json
