name: Archive Registration Sync
# Read-only PR preview. Main drift recovery belongs exclusively to Archive Main Auto Metadata.

on:
  pull_request:
    branches: [main]
    paths:
      - "archive/exams/**/*.js"
      - "archive/db.js"
      - "archive/data/archive2-catalog.json"
      - "archive/data/question_identity_map.json"
      - "archive/data/question_metadata.json"
      - "archive/data/generated-lite-consumer/v1/index.json"
      - "archive/data/archive2-canonical-input-manifest.json"
      - "archive/data/archive2-canonical-projection-policy.json"
      - "archive/data/meta-foundation/canonical/**"
      - "archive/data/meta-foundation/compiled/**"
      - "archive/question-index.js"
      - "archive/build_db.py"
      - "archive/archive2-core.js"
      - "archive/archive2-canonical.js"
      - "archive/problem-bank-meta.js"
      - "archive/problem-bank-search.html"
      - "archive/tools/build-question-index.mjs"
      - "archive/tools/build-archive2-catalog.mjs"
      - "archive/tools/build-basic-scope-parent-links.mjs"
      - "archive/data/basic-scope-source-links.json"
      - "archive/data/basic-scope-parent-groups.json"
      - "archive/data/meta-foundation/runtime/**"
      - "archive/data/meta-foundation/crosswalks/rpm-primary-v1.0/**"
      - "archive/tools/build-archive2-crosswalk-inventory.mjs"
      - "archive/tools/intelligence/sync-question-identity-map-v1.mjs"
      - "archive/tools/intelligence/sync-pending-question-metadata-v1.mjs"
      - "archive/tools/meta-foundation/sync-runtime-source-path-renames.mjs"
      - "archive/data/r2e-intake/**/*.meta-review2.meta-v2.payload.json"
      - "archive/tools/meta-foundation/materialize-meta-v2-payloads.mjs"
      - "archive/tools/verify-archive-registration.mjs"
      - "tests/archive2-meta-v2-semantic-authority.test.cjs"
      - "tests/archive-original-search-exposure.browser.cjs"
      - ".github/workflows/archive-registration-sync.yml"

permissions:
  contents: read

concurrency:
  group: archive-registration-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      source_sha: ${{ steps.preview.outputs.source_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Materialize current META_V2 payloads
        run: node archive/tools/meta-foundation/materialize-meta-v2-payloads.mjs --write

      - name: Run archive registration sync
        run: python archive/build_db.py

      - name: Record META_V2 completeness diagnostics
        id: meta_v2_diagnostics
        continue-on-error: true
        run: |
          node tests/archive-meta-v2-materializer.test.mjs
          node tests/archive2-meta-v2-semantic-authority.test.cjs
          node archive/tools/meta-foundation/materialize-meta-v2-payloads.mjs --check
      - name: Report META_V2 supplementation debt
        if: always()
        env:
          META_OUTCOME: ${{ steps.meta_v2_diagnostics.outcome }}
        run: |
          echo "meta_v2_diagnostics=$META_OUTCOME" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$META_OUTCOME" != success ]]; then
            echo "::warning title=Metadata supplement required::Student source and browser checks still run."
          fi
      - name: Verify student registration and source identity
        run: |
          node tests/archive-question-identity-contract.test.mjs
          node tests/archive-question-identity-runtime.test.mjs
          node tests/jeil-legacy-similar-22-registration.test.cjs
          node tests/palma-legacy-similar-23-registration.test.cjs
          node archive/tools/verify-archive-registration.mjs
          git diff --check

      - uses: browser-actions/setup-chrome@v1
        id: search_chrome
        with:
          chrome-version: stable

      - name: Install browser driver used by the Archive 2.0 search audit
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm install --no-save --package-lock=false playwright@1.62.1

      - name: Verify original exam visibility in the student search UI
        id: original_search_diagnostics
        continue-on-error: true
        env:
          CHROME_BIN: ${{ steps.search_chrome.outputs.chrome-path }}
        run: node tests/archive-original-search-exposure.browser.cjs
      - name: Verify original exam opens for students in actual Chrome
        env:
          CHROME_BIN: ${{ steps.search_chrome.outputs.chrome-path }}
        run: node tests/archive-original-exam-access.browser.cjs
      - name: Record search metadata repair debt
        if: always()
        env:
          SEARCH_OUTCOME: ${{ steps.original_search_diagnostics.outcome }}
        run: |
          echo "original_search_diagnostics=$SEARCH_OUTCOME" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$SEARCH_OUTCOME" != success ]]; then
            echo "::warning title=Search metadata supplement required::Direct original exam access remains the release check."
          fi

      - name: Set up real Chrome for Jeil print QA
        if: github.event_name == 'pull_request' && (github.head_ref == 'work/review-25-jeil-h1-2final-legacy22-20261012' || github.head_ref == 'work/palma-legacy-similar-23-final-20261014')
        uses: browser-actions/setup-chrome@v1
        id: jeil_chrome
        with:
          chrome-version: stable

      - name: Install Korean fonts for real student print
        if: github.event_name == 'pull_request' && (github.head_ref == 'work/review-25-jeil-h1-2final-legacy22-20261012' || github.head_ref == 'work/palma-legacy-similar-23-final-20261014')
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          fc-cache -f
          fc-list :lang=ko family | grep -qi 'Noto Sans CJK'

      - name: Verify Jeil exam, answer, solution Chrome print
        if: github.event_name == 'pull_request' && github.head_ref == 'work/review-25-jeil-h1-2final-legacy22-20261012'
        env:
          CHROME_BIN: ${{ steps.jeil_chrome.outputs.chrome-path }}
          JEIL_CHROME_OUT: ${{ runner.temp }}/jeil-chrome-print
        run: node tools/check-jeil-legacy-similar-chrome.cjs

      - name: Upload Jeil Chrome print proof
        if: always() && github.event_name == 'pull_request' && github.head_ref == 'work/review-25-jeil-h1-2final-legacy22-20261012'
        uses: actions/upload-artifact@v4
        with:
          name: jeil-legacy-similar-chrome-print
          path: ${{ runner.temp }}/jeil-chrome-print/
          if-no-files-found: warn

      - name: Verify Palma 23 exam, answer, solution Chrome print
        if: github.event_name == 'pull_request' && github.head_ref == 'work/palma-legacy-similar-23-final-20261014'
        env:
          CHROME_BIN: ${{ steps.jeil_chrome.outputs.chrome-path }}
          PALMA_CHROME_OUT: ${{ runner.temp }}/palma-chrome-print
        run: node tools/check-palma-legacy-similar-chrome.cjs

      - name: Upload Palma Chrome print proof
        if: always() && github.event_name == 'pull_request' && github.head_ref == 'work/palma-legacy-similar-23-final-20261014'
        uses: actions/upload-artifact@v4
        with:
          name: palma-legacy-similar-chrome-print
          path: ${{ runner.temp }}/palma-chrome-print/
          if-no-files-found: warn

      - name: Guard generated scope
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(
            {
              git diff --name-only HEAD
              git ls-files --others --exclude-standard
            } | sort -u
          )
          allowed='^(archive/db\.js|archive/data/question_identity_map\.json|archive/data/question_metadata\.json|archive/question-identity\.js|archive/question-index\.js|archive/question-index-report\.md|archive/question-index-audit\.md|archive/data/archive2-catalog\.json|archive/data/archive2-source-verification-index\.json|archive/data/archive2-source-verification/v1/[^/]+\.json|archive/data/archive2-crosswalk-inventory\.json|archive/data/archive2-canonical-input-manifest\.json|archive/data/archive2-canonical-projection-policy\.json|archive/data/archive2-item-review-overrides\.json|archive/data/basic-scope-parent-links\.json|archive/data/meta-foundation/runtime/[^/]+\.json)$'
          for file in "${changed[@]}"; do
            if [[ -n "$file" && ! "$file" =~ $allowed ]]; then
              echo "Unexpected generated file: $file"
              exit 1
            fi
          done
          printf '%s\n' "${changed[@]}"

      - name: Record the read-only registration preview
        id: preview
        shell: bash
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          preview="$RUNNER_TEMP/registration-preview"
          mkdir -p "$preview"
          # The scope guard above has already rejected unexpected paths. Include new
          # generated files in the patch without committing or changing any remote ref.
          mapfile -d '' -t untracked < <(git ls-files --others --exclude-standard -z)
          if (( ${#untracked[@]} )); then
            git add --intent-to-add -- "${untracked[@]}"
          fi
          git diff --binary --full-index HEAD > "$preview/registration.patch"
          git rev-parse HEAD > "$preview/source.sha"
          source_sha="$(cat "$preview/source.sha")"
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          {
            echo "### Read-only Archive registration verification"
            echo "Tested snapshot: $source_sha"
            echo "Author PR head: ${PR_HEAD_SHA:-not-a-pull-request}"
            echo "Remote writes: none. Generated files exist only in this runner and its preview artifact."
            git diff --stat HEAD
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload registration preview
        uses: actions/upload-artifact@v4
        with:
          name: archive-registration-preview-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/registration-preview/
          if-no-files-found: error
          retention-days: 7
