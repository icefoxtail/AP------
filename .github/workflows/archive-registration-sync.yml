name: Archive Registration Sync
# Read-only PR check. CI owns the temporary registration data check and publishes
# a metadata proof; this job reuses it and keeps the direct-source Chrome gate.

on:
  pull_request:
    branches: [main]
    paths:
      - "archive/exams/**/*.js"
      - "archive/db.js"
      - "archive/data/archive2-catalog.json"
      - "archive/data/question_identity_map.json"
      - "archive/data/question_metadata.json"
      - "archive/data/generated-lite-consumer/v1/index.json"
      - "archive/data/archive2-canonical-input-manifest.json"
      - "archive/data/archive2-canonical-projection-policy.json"
      - "archive/data/meta-foundation/canonical/**"
      - "archive/data/meta-foundation/compiled/**"
      - "archive/question-index.js"
      - "archive/build_db.py"
      - "archive/archive2-core.js"
      - "archive/archive2-canonical.js"
      - "archive/problem-bank-meta.js"
      - "archive/problem-bank-search.html"
      - "archive/tools/build-question-index.mjs"
      - "archive/tools/build-archive2-catalog.mjs"
      - "archive/tools/build-basic-scope-parent-links.mjs"
      - "archive/data/basic-scope-source-links.json"
      - "archive/data/basic-scope-parent-groups.json"
      - "archive/data/meta-foundation/runtime/**"
      - "archive/data/meta-foundation/crosswalks/rpm-primary-v1.0/**"
      - "archive/tools/build-archive2-crosswalk-inventory.mjs"
      - "archive/tools/intelligence/sync-question-identity-map-v1.mjs"
      - "archive/tools/intelligence/sync-pending-question-metadata-v1.mjs"
      - "archive/tools/meta-foundation/sync-runtime-source-path-renames.mjs"
      - "archive/data/r2e-intake/**/*.meta-review2.meta-v2.payload.json"
      - "archive/tools/meta-foundation/materialize-meta-v2-payloads.mjs"
      - "archive/tools/verify-archive-registration.mjs"
      - "tests/archive2-meta-v2-semantic-authority.test.cjs"
      - "tests/archive-original-search-exposure.browser.cjs"
      - ".github/workflows/archive-registration-sync.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: archive-registration-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    # CI permits 5 minutes of planning and 15 of tests; leave queue and Chrome headroom.
    timeout-minutes: 35
    outputs:
      source_sha: ${{ steps.registration_proof.outputs.source_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Reuse the exact CI registration data proof
        id: registration_proof
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node tools/ci/archive-pr-registration-proof.mjs consume --proof-file "$RUNNER_TEMP/registration-preview/proof.json" --timeout-seconds 1500 --poll-seconds 30

      - name: Set up Chrome for the direct original exam check
        uses: browser-actions/setup-chrome@v1
        id: search_chrome
        with:
          chrome-version: stable

      - name: Install the direct original exam browser driver
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm install --no-save --package-lock=false playwright@1.62.1

      - name: Verify original exam opens for students in actual Chrome
        id: original_chrome_check
        env:
          CHROME_BIN: ${{ steps.search_chrome.outputs.chrome-path }}
        run: node tests/archive-original-exam-access.browser.cjs

      - name: Set up real Chrome for Jeil print QA
        if: github.event_name == 'pull_request' && (github.head_ref == 'work/review-25-jeil-h1-2final-legacy22-20261012' || github.head_ref == 'work/palma-legacy-similar-23-final-20261014')
        uses: browser-actions/setup-chrome@v1
        id: jeil_chrome
        with:
          chrome-version: stable

      - name: Install Korean fonts for real student print
        if: github.event_name == 'pull_request' && (github.head_ref == 'work/review-25-jeil-h1-2final-legacy22-20261012' || github.head_ref == 'work/palma-legacy-similar-23-final-20261014')
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          fc-cache -f
          fc-list :lang=ko family | grep -qi 'Noto Sans CJK'

      - name: Verify Jeil exam, answer, solution Chrome print
        if: github.event_name == 'pull_request' && github.head_ref == 'work/review-25-jeil-h1-2final-legacy22-20261012'
        env:
          CHROME_BIN: ${{ steps.jeil_chrome.outputs.chrome-path }}
          JEIL_CHROME_OUT: ${{ runner.temp }}/jeil-chrome-print
        run: node tools/check-jeil-legacy-similar-chrome.cjs

      - name: Upload Jeil Chrome print proof
        if: always() && github.event_name == 'pull_request' && github.head_ref == 'work/review-25-jeil-h1-2final-legacy22-20261012'
        uses: actions/upload-artifact@v4
        with:
          name: jeil-legacy-similar-chrome-print
          path: ${{ runner.temp }}/jeil-chrome-print/
          if-no-files-found: warn

      - name: Verify Palma 23 exam, answer, solution Chrome print
        if: github.event_name == 'pull_request' && github.head_ref == 'work/palma-legacy-similar-23-final-20261014'
        env:
          CHROME_BIN: ${{ steps.jeil_chrome.outputs.chrome-path }}
          PALMA_CHROME_OUT: ${{ runner.temp }}/palma-chrome-print
        run: node tools/check-palma-legacy-similar-chrome.cjs

      - name: Upload Palma Chrome print proof
        if: always() && github.event_name == 'pull_request' && github.head_ref == 'work/palma-legacy-similar-23-final-20261014'
        uses: actions/upload-artifact@v4
        with:
          name: palma-legacy-similar-chrome-print
          path: ${{ runner.temp }}/palma-chrome-print/
          if-no-files-found: warn

      - name: Record the read-only registration preview
        shell: bash
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PROOF_SOURCE_SHA: ${{ steps.registration_proof.outputs.source_sha }}
          CI_RUN_ID: ${{ steps.registration_proof.outputs.ci_run_id }}
          CI_RUN_ATTEMPT: ${{ steps.registration_proof.outputs.ci_run_attempt }}
          CI_ARTIFACT_ID: ${{ steps.registration_proof.outputs.artifact_id }}
          CI_ARTIFACT_DIGEST: ${{ steps.registration_proof.outputs.artifact_digest }}
          CHROME_OUTCOME: ${{ steps.original_chrome_check.outcome }}
        run: |
          set -euo pipefail
          preview="$RUNNER_TEMP/registration-preview"
          mkdir -p "$preview"
          git rev-parse HEAD > "$preview/source.sha"
          test "$(cat "$preview/source.sha")" = "$PROOF_SOURCE_SHA"
          git diff --quiet HEAD
          test -z "$(git ls-files --others --exclude-standard)"
          # Native inventories can also load ignored source files. Browser packages
          # outside these inputs are irrelevant; the verified checkout stays exact.
          test -z "$(git ls-files --others --ignored --exclude-standard -- archive shared alive/06_EXECUTION/H1_SCHOOL_EXPANSION docs/rules/01_CANONICAL/taxonomy)"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          const env = process.env;
          if (env.CHROME_OUTCOME !== 'success') throw Error('DIRECT_ORIGINAL_CHROME_NOT_SUCCESS');
          const ciUrl = `https://github.com/${env.GITHUB_REPOSITORY}/actions/runs/${env.CI_RUN_ID}/attempts/${env.CI_RUN_ATTEMPT}`;
          const report = {
            schemaVersion: 'archive-pr-registration-preview/v2',
            sourceSha: env.PROOF_SOURCE_SHA,
            authorHeadSha: env.PR_HEAD_SHA,
            registrationData: { state: 'REUSED', scope: 'registration-data-only',
              ciRunId: Number(env.CI_RUN_ID), ciRunAttempt: Number(env.CI_RUN_ATTEMPT),
              artifactId: Number(env.CI_ARTIFACT_ID), artifactDigest: env.CI_ARTIFACT_DIGEST, ciUrl },
            directOriginalChrome: env.CHROME_OUTCOME,
            generatedDataIncluded: false,
            remoteWrites: 0,
          };
          fs.writeFileSync(path.join(env.RUNNER_TEMP, 'registration-preview', 'preview.json'), JSON.stringify(report, null, 2) + '\n');
          fs.appendFileSync(env.GITHUB_STEP_SUMMARY,
            `### Read-only Archive registration verification\n` +
            `Tested snapshot: ${env.PROOF_SOURCE_SHA}\nAuthor PR head: ${env.PR_HEAD_SHA}\n` +
            `Registration data reused from ${ciUrl}; direct original Chrome: ${env.CHROME_OUTCOME}.\n` +
            `Remote writes: none. This artifact contains metadata only; generated data remains in the CI runner.\n`);
          NODE

      - name: Upload registration preview
        uses: actions/upload-artifact@v4
        with:
          name: archive-registration-preview-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/registration-preview/
          if-no-files-found: error
          retention-days: 7
