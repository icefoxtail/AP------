name: Archive Registration Sync

on:
  pull_request:
    branches: [main]
    paths:
      - "archive/exams/**/*.js"
      - "archive/db.js"
      - "archive/build_db.py"
      - "archive/tools/build-question-index.mjs"
      - "archive/tools/build-archive2-catalog.mjs"
      - "archive/tools/build-basic-scope-parent-links.mjs"
      - "archive/data/basic-scope-source-links.json"
      - "archive/data/basic-scope-parent-groups.json"
      - "archive/data/meta-foundation/runtime/**"
      - "archive/data/meta-foundation/crosswalks/rpm-primary-v1.0/**"
      - "archive/tools/build-archive2-crosswalk-inventory.mjs"
      - "archive/tools/intelligence/sync-question-identity-map-v1.mjs"
      - "archive/tools/intelligence/sync-pending-question-metadata-v1.mjs"
      - "archive/tools/meta-foundation/sync-runtime-source-path-renames.mjs"
      - "archive/data/r2e-intake/**/*.meta-review2.meta-v2.payload.json"
      - "archive/tools/meta-foundation/materialize-meta-v2-payloads.mjs"
      - "archive/tools/verify-archive-registration.mjs"
      - "tests/archive2-meta-v2-semantic-authority.test.cjs"
      - ".github/workflows/archive-registration-sync.yml"
  push:
    branches: [main]
    paths:
      - "archive/exams/**/*.js"
      - "archive/db.js"
      - "archive/build_db.py"
      - "archive/tools/build-archive2-catalog.mjs"
      - "archive/tools/build-basic-scope-parent-links.mjs"
      - "archive/data/basic-scope-source-links.json"
      - "archive/data/basic-scope-parent-groups.json"
      - "archive/data/meta-foundation/runtime/**"
      - "archive/data/meta-foundation/crosswalks/rpm-primary-v1.0/**"
      - "archive/tools/intelligence/sync-question-identity-map-v1.mjs"
      - "archive/tools/intelligence/sync-pending-question-metadata-v1.mjs"
      - "archive/tools/meta-foundation/sync-runtime-source-path-renames.mjs"
      - "archive/data/r2e-intake/**/*.meta-review2.meta-v2.payload.json"
      - "archive/tools/meta-foundation/materialize-meta-v2-payloads.mjs"
      - "archive/tools/verify-archive-registration.mjs"
      - "tests/archive2-meta-v2-semantic-authority.test.cjs"
      - ".github/workflows/archive-registration-sync.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: archive-registration-sync-main
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Materialize current META_V2 payloads
        run: node archive/tools/meta-foundation/materialize-meta-v2-payloads.mjs --write

      - name: Run archive registration sync
        run: python archive/build_db.py

      - name: Targeted registration tests
        run: |
          node tests/archive-meta-v2-materializer.test.mjs
          node tests/archive2-meta-v2-semantic-authority.test.cjs
          node archive/tools/meta-foundation/materialize-meta-v2-payloads.mjs --check
          node tests/archive-question-identity-contract.test.mjs
          node tests/archive-question-identity-runtime.test.mjs
          node archive/tools/verify-archive-registration.mjs
          git diff --check

      - name: Guard generated scope
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(
            {
              git diff --name-only
              git ls-files --others --exclude-standard
            } | sort -u
          )
          allowed='^(archive/db\.js|archive/data/question_identity_map\.json|archive/data/question_metadata\.json|archive/question-identity\.js|archive/question-index\.js|archive/question-index-report\.md|archive/question-index-audit\.md|archive/data/archive2-catalog\.json|archive/data/archive2-crosswalk-inventory\.json|archive/data/archive2-canonical-input-manifest\.json|archive/data/archive2-canonical-projection-policy\.json|archive/data/archive2-item-review-overrides\.json|archive/data/basic-scope-parent-links\.json|archive/data/meta-foundation/runtime/[^/]+\.json)$'
          for file in "${changed[@]}"; do
            if [[ -n "$file" && ! "$file" =~ $allowed ]]; then
              echo "Unexpected generated file: $file"
              exit 1
            fi
          done
          printf '%s\n' "${changed[@]}"

      - name: Commit generated registration artifacts
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          git add -- archive/db.js archive/data/question_identity_map.json archive/data/question_metadata.json archive/question-identity.js archive/question-index.js archive/question-index-report.md archive/question-index-audit.md archive/data/archive2-catalog.json archive/data/archive2-crosswalk-inventory.json archive/data/archive2-canonical-input-manifest.json archive/data/archive2-canonical-projection-policy.json archive/data/archive2-item-review-overrides.json archive/data/basic-scope-parent-links.json archive/data/meta-foundation/runtime/*.json
          if git diff --cached --quiet; then
            echo "Archive registration artifacts already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(archive): sync registration artifacts [skip ci]"
          if git push origin HEAD:main; then
            exit 0
          fi
          # Another publication may advance main while the full scan runs.
          # Rebuild from the new main; never force-push stale projections.
          for attempt in 2 3 4; do
            echo "Registration publish race; rebuilding latest main (attempt $attempt/4)"
            git fetch --no-tags origin main
            git reset --hard origin/main
            node archive/tools/meta-foundation/materialize-meta-v2-payloads.mjs --write
            python archive/build_db.py
            node tests/archive-meta-v2-materializer.test.mjs
            node tests/archive2-meta-v2-semantic-authority.test.cjs
            node archive/tools/meta-foundation/materialize-meta-v2-payloads.mjs --check
            node tests/archive-question-identity-contract.test.mjs
            node tests/archive-question-identity-runtime.test.mjs
            node archive/tools/verify-archive-registration.mjs
            git diff --check
            git add -- archive/db.js archive/data/question_identity_map.json archive/data/question_metadata.json archive/question-identity.js archive/question-index.js archive/question-index-report.md archive/question-index-audit.md archive/data/archive2-catalog.json archive/data/archive2-crosswalk-inventory.json archive/data/archive2-canonical-input-manifest.json archive/data/archive2-canonical-projection-policy.json archive/data/archive2-item-review-overrides.json archive/data/basic-scope-parent-links.json archive/data/meta-foundation/runtime/*.json
            if git diff --cached --quiet; then
              echo "Latest main already has the generated registration."
              exit 0
            fi
            git commit -m "chore(archive): sync registration artifacts [skip ci]"
            if git push origin HEAD:main; then
              exit 0
            fi
          done
          echo "Main advanced across all four non-force registration attempts" >&2
          exit 1
