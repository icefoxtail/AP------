name: Universe six-stage browser build (temporary)
on:
  pull_request:
    branches:
      - main
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and verify Universe bundle
        working-directory: archive/prototypes/ap-galaxy
        run: |
          npm install --no-package-lock
          npm run build
          node --test tests/*.test.cjs
      - name: Commit built browser asset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- archive/prototypes/ap-galaxy/assets/orbital-world.js
          if git diff --cached --quiet; then
            echo "Browser bundle unchanged"
            exit 0
          fi
          git commit -m "Build updated Universe browser bundle"
          git push origin HEAD:work/universe-six-stage-preview-20261016
