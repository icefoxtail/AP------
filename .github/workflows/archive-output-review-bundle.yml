name: Archive Output Review Bundle
on:
  push:
    branches: ['perf/archive-output-718c238a']
    paths: ['.github/workflows/archive-output-review-bundle.yml']
permissions:
  contents: read
jobs:
  review-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Collect exact runtime and test source bytes without question data
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/output-review"
          for ref in 03724a9690d22cdc39fc24994e62079b62b15005 8a6a71af2317060dacd877a7a7af86d347dc06e6 87d7a554448d8ecf9ab5a535f2ff5541b0c79a0a; do
            git fetch --no-tags --depth=1 origin "$ref"
          done
          python3 - <<'PY'
          import os, pathlib, subprocess, hashlib, json
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'output-review'
          refs = {'candidate':'03724a9690d22cdc39fc24994e62079b62b15005', 'main':'8a6a71af2317060dacd877a7a7af86d347dc06e6', 'baseline':'87d7a554448d8ecf9ab5a535f2ff5541b0c79a0a'}
          manifest = {'refs':refs,'files':[]}
          for label, ref in refs.items():
            names = subprocess.check_output(['git','ls-tree','-r','--name-only',ref], text=True).splitlines()
            selected = []
            for name in names:
              p = pathlib.PurePosixPath(name)
              runtime = p.parent.as_posix() == 'archive' and p.suffix in ('.js','.css','.html') and not p.name.startswith(('question-index','db','data'))
              tests = p.parent.as_posix() == 'tests' and p.name.startswith(('archive','print','apmath-exam-pdf')) and p.suffix in ('.js','.cjs','.mjs')
              rule = name in ('AGENTS.md','package.json','tools/check-archive2-runtime.cjs','tools/archive-pages-release-manifest.json','.github/workflows/archive-output-performance.yml') or (name.startswith('docs/agents/') and name.endswith('.md'))
              nested = name.endswith('/AGENTS.md') and name.startswith(('archive/','tests/'))
              if runtime or tests or rule or nested: selected.append(name)
            for name in selected:
              data = subprocess.check_output(['git','show',ref+':'+name])
              out = root / label / name
              out.parent.mkdir(parents=True,exist_ok=True)
              out.write_bytes(data)
              manifest['files'].append({'label':label,'path':name,'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest()})
          (root/'source-manifest.json').write_text(json.dumps(manifest,sort_keys=True,indent=2)+'\n')
          print(json.dumps({'refs':refs,'files':len(manifest['files']),'sourceQuestionDataIncluded':False}))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: archive-output-review-source
          path: ${{ runner.temp }}/output-review/
          retention-days: 7
          if-no-files-found: error
