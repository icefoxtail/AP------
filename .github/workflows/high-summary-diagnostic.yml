name: High summary pointer diagnostic
on:
  push:
    branches: [high/summary-probe-7907d5aa]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --prefix "$RUNNER_TEMP/high-browser" --no-save --package-lock=false --no-audit --no-fund playwright@1.56.1
          "$RUNNER_TEMP/high-browser/node_modules/.bin/playwright" install --with-deps chromium
      - run: node apmath/playground/next/tools/high-summary-diagnostic.mjs
        env:
          NODE_PATH: ${{ runner.temp }}/high-browser/node_modules
          PROBE_OUT: ${{ runner.temp }}/summary-probe
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: summary-pointer-probe
          path: ${{ runner.temp }}/summary-probe
          retention-days: 5
