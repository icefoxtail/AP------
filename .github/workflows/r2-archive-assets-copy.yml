name: R2 Archive Assets Copy

# Cloudflare R2 bills every write-class request (Class A). Keep this workflow cheap:
#   * NEVER compare, list or copy the whole image folder -- user decision 2026-11-17, reason: Class A charges.
#     Every rclone call below names its files explicitly (--files-from0) and uses --no-traverse.
#   * push (main): upload ONLY the images that changed. Base = last successful run of this workflow, else this push's
#     own `before`; if neither can be diffed the job FAILS and uploads nothing (it never widens to "everything").
#   * manual run: upload the git-tracked images of ONE exam folder given as input (bounded by a file-count limit).
#   * --no-update-modtime on every copy: a fresh checkout stamps new mtimes on every file; without this flag rclone
#     refreshes the stored mtime of each "equal" object with a server-side copy (one Class A request per image).
# Student site releases (archive-pages-release.yml, tools/ci/archive-pages-image-r2-gate.mjs) wait for the exact image
# bytes on img.wangjiedu.com; they do not read this workflow's logs or conclusion.

on:
  workflow_dispatch:
    inputs:
      folder:
        description: "Exam image folder name under archive/assets/images/ (one name, no slash), e.g. 25_풍덕중_2학기_기말_중3_기출"
        required: true
        type: string
  push:
    branches: [main]
    paths:
      - "archive/assets/images/**"
      - ".github/workflows/r2-archive-assets-copy.yml"

# One run at a time, queued in order. cancel-in-progress stays false so a running upload is never cut off.
# A newer push may replace a run that is still queued; that is safe because every run diffs against the last
# SUCCESSFUL run (not against its own push `before`), so the newest run also covers the images of replaced or failed runs.
concurrency:
  group: r2-archive-assets-copy
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  copy-archive-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Safety limits: one run uploads at most this many images, otherwise it fails instead of uploading.
      R2_MAX_IMAGES_PUSH: "2000"
      R2_MAX_IMAGES_FOLDER: "500"
      RCLONE_VERSION: v1.76.0
      RCLONE_ZIP_SHA256: b00f00b3266c3764413afe599d3ec316f6f43b3e0ea8a0bc1d186d2133e46df7
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            archive/assets/images
            tools/ci

      - name: Check archive image folder
        id: archive_assets
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d archive/assets/images ]; then
            echo "archive/assets/images is absent; nothing to copy."
            echo "exists=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "exists=true" >> "$GITHUB_OUTPUT"

      - name: Validate secrets
        if: steps.archive_assets.outputs.exists == 'true'
        shell: bash
        run: |
          set -euo pipefail
          required=(
            R2_ACCOUNT_ID
            R2_ACCESS_KEY_ID
            R2_SECRET_ACCESS_KEY
            R2_BUCKET
            R2_PUBLIC_BASE_URL
          )

          for name in "${required[@]}"; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required secret: ${name}" >&2
              exit 1
            fi
          done

      - name: Install rclone (pinned)
        if: steps.archive_assets.outputs.exists == 'true'
        shell: bash
        run: |
          set -euo pipefail
          zip="rclone-${RCLONE_VERSION}-linux-amd64.zip"
          curl -fsSL "https://downloads.rclone.org/${RCLONE_VERSION}/${zip}" -o "${RUNNER_TEMP}/${zip}"
          echo "${RCLONE_ZIP_SHA256}  ${RUNNER_TEMP}/${zip}" | sha256sum -c -
          unzip -q -o "${RUNNER_TEMP}/${zip}" -d "${RUNNER_TEMP}/rclone-unpacked"
          sudo install -m 0755 "${RUNNER_TEMP}/rclone-unpacked/rclone-${RCLONE_VERSION}-linux-amd64/rclone" /usr/local/bin/rclone
          rclone version | sed -n 1p

      - name: Configure Cloudflare R2 remote
        if: steps.archive_assets.outputs.exists == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf <<EOF
          [r2-ap-assets]
          type = s3
          provider = Cloudflare
          access_key_id = ${R2_ACCESS_KEY_ID}
          secret_access_key = ${R2_SECRET_ACCESS_KEY}
          endpoint = https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com
          acl = private
          EOF
          chmod 600 ~/.config/rclone/rclone.conf

      # Decides which images to upload. The result is always an explicit file list (never "everything").
      #   push:     (a) last successful run of this workflow .. HEAD
      #             (b) else this push's `before` .. HEAD (reason line says images of earlier failed runs may be missing)
      #             (c) else FAIL: nothing is uploaded, nothing widens to a full comparison.
      #   dispatch: git-tracked images of the single folder named by the `folder` input.
      # The folder input reaches the shell only through env (FOLDER_INPUT), never through ${{ }} inside the script.
      - name: Plan upload (explicit image list)
        id: plan
        if: steps.archive_assets.outputs.exists == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          FOLDER_INPUT: ${{ github.event.inputs.folder }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          # GitHub starts this shell as `bash -eo pipefail`; the plan inspects exit codes itself, so turn -e off here.
          # Every other step keeps -e and pipefail: pipes that may close early (| head) must not be used there.
          set +e
          set -uo pipefail
          list="${RUNNER_TEMP}/changed-images.z"
          rm -f "$list" "${list}.part"
          mode=""
          reason=""

          fail_plan() {
            line="R2 plan: mode=none images_to_check=0 ($1)"
            echo "$line"
            {
              echo "$line"
              echo ""
              echo "$2"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::$1"
            exit 1
          }

          # diff_range <base>: exit 3 means "over the safety limit" and must not fall back.
          diff_range() {
            R2_MAX_IMAGES="$R2_MAX_IMAGES_PUSH" bash tools/ci/r2-changed-images.sh "$1" "$GITHUB_SHA" "$list"
          }
          too_many() {
            fail_plan "more than ${R2_MAX_IMAGES_PUSH} images changed; nothing uploaded" \
              "Too many changed images for one automatic run (limit ${R2_MAX_IMAGES_PUSH}). Nothing was uploaded. Run this workflow manually per exam folder (workflow_dispatch input 'folder')."
          }

          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            mode=folder
            rc=0
            R2_MAX_IMAGES="$R2_MAX_IMAGES_FOLDER" bash tools/ci/r2-changed-images.sh --folder "${FOLDER_INPUT:-}" "$list" || rc=$?
            if [ "$rc" -eq 3 ]; then
              fail_plan "folder has more than ${R2_MAX_IMAGES_FOLDER} images; nothing uploaded" \
                "The folder has more images than the manual limit (${R2_MAX_IMAGES_FOLDER}). Nothing was uploaded."
            elif [ "$rc" -ne 0 ]; then
              fail_plan "folder input rejected or has no tracked images (exit ${rc}); nothing uploaded" \
                "Give one folder name that exists under archive/assets/images/ (no slash, no '..'). Nothing was uploaded."
            fi
            reason="manual run: folder ${FOLDER_INPUT}"
          elif [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            base="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/r2-archive-assets-copy.yml/runs?branch=main&status=success&per_page=1" \
              --jq '.workflow_runs[0].head_sha // empty' 2>/dev/null || true)"
            why=""
            if [[ "$base" =~ ^[0-9a-f]{40}$ ]]; then
              rc=0
              diff_range "$base" || rc=$?
              if [ "$rc" -eq 0 ]; then
                mode=push
                reason="changed since last successful run ${base:0:12}"
              elif [ "$rc" -eq 3 ]; then
                too_many
              else
                rm -f "$list" "${list}.part"
                why="could not diff against last successful run ${base:0:12}"
              fi
            else
              why="no earlier successful run found"
            fi
            if [ -z "$mode" ]; then
              before="${PUSH_BEFORE:-}"
              if [[ "$before" =~ ^[0-9a-f]{40}$ ]] && [ "$before" != "0000000000000000000000000000000000000000" ]; then
                rc=0
                diff_range "$before" || rc=$?
                if [ "$rc" -eq 0 ]; then
                  mode=push
                  reason="fallback to this push only (${why}); changed ${before:0:12}..${GITHUB_SHA:0:12}, images of earlier unsuccessful runs may be missing"
                elif [ "$rc" -eq 3 ]; then
                  too_many
                else
                  rm -f "$list" "${list}.part"
                  why="${why}; could not diff against push before ${before:0:12}"
                fi
              else
                why="${why}; push has no usable before commit"
              fi
            fi
            if [ -z "$mode" ]; then
              fail_plan "could not decide which images changed (${why}); nothing uploaded" \
                "어떤 이미지가 바뀌었는지 정하지 못해 올리지 않았음. 수동 실행에서 폴더를 지정해 올릴 것. (Could not decide which images changed, so nothing was uploaded. Run this workflow manually with the 'folder' input.)"
            fi
          else
            fail_plan "unsupported event ${GITHUB_EVENT_NAME}; nothing uploaded" "Only push and workflow_dispatch are supported."
          fi

          count="$(tr -cd '\0' < "$list" | wc -c | tr -d ' ')"
          echo "mode=${mode}" >> "$GITHUB_OUTPUT"
          echo "count=${count}" >> "$GITHUB_OUTPUT"
          echo "list=${list}" >> "$GITHUB_OUTPUT"
          line="R2 plan: mode=${mode} images_to_check=${count} (${reason})"
          echo "$line"
          echo "$line" >> "$GITHUB_STEP_SUMMARY"
          if [ "$count" -gt 0 ]; then
            # head reads the file itself: a pipe into `head` would die with SIGPIPE (141) under pipefail on big lists.
            head -z -n 20 "$list" | tr '\0' '\n' || true
            if [ "$count" -gt 20 ]; then echo "... and $((count - 20)) more"; fi
          fi

      # No --progress: CI logs stay short. -v prints one line per changed object and the periodic stats line.
      # The only upload command: it copies exactly the listed files (--files-from0) without listing the bucket
      # (--no-traverse); there is no whole-folder variant.
      - name: Copy archive image assets
        if: steps.archive_assets.outputs.exists == 'true'
        shell: bash
        env:
          PLAN_MODE: ${{ steps.plan.outputs.mode }}
          PLAN_COUNT: ${{ steps.plan.outputs.count }}
          PLAN_LIST: ${{ steps.plan.outputs.list }}
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/rclone-copy.log"
          if [ "$PLAN_MODE" != push ] && [ "$PLAN_MODE" != folder ]; then
            echo "Refusing to upload: unexpected plan mode '${PLAN_MODE}'." >&2
            exit 1
          fi
          if [ "$PLAN_COUNT" -eq 0 ]; then
            echo "No image to upload."
            echo "R2 copy: mode=${PLAN_MODE} requested=0 uploaded=0 server_side_copies=0 mtime_updates=0" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          rclone copy archive/assets/images "r2-ap-assets:${R2_BUCKET}/exams/images" \
            --files-from0 "$PLAN_LIST" \
            --no-traverse \
            --checksum \
            --no-update-modtime \
            --transfers 16 \
            --checkers 16 \
            -v --stats 60s --stats-one-line 2>&1 | tee "$log"
          uploaded="$(grep -c ': Copied (' "$log" || true)"
          server_side="$(grep -c 'server-side copy' "$log" || true)"
          mtime_updates="$(grep -ci 'modification time' "$log" || true)"
          line="R2 copy: mode=${PLAN_MODE} requested=${PLAN_COUNT} uploaded=${uploaded} server_side_copies=${server_side} mtime_updates=${mtime_updates}"
          echo "$line"
          echo "$line" >> "$GITHUB_STEP_SUMMARY"

      # Read-back check of exactly the files this run was asked to upload (size + MD5 against R2).
      - name: Verify uploaded images
        if: steps.archive_assets.outputs.exists == 'true' && steps.plan.outputs.count != '0'
        shell: bash
        env:
          PLAN_LIST: ${{ steps.plan.outputs.list }}
        run: |
          set -euo pipefail
          rclone check archive/assets/images "r2-ap-assets:${R2_BUCKET}/exams/images" \
            --files-from0 "$PLAN_LIST" \
            --no-traverse \
            --one-way \
            --checkers 16
