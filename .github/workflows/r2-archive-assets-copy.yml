name: R2 Archive Assets Copy

# Cloudflare R2 bills every write-class request (Class A). Keep this workflow cheap:
#   * push (main): upload ONLY the images that changed since the last successful run of this workflow.
#   * manual run / fallback: compare every image by size + MD5 (--checksum) and upload what differs.
#   * --no-update-modtime on every copy: a fresh checkout stamps new mtimes on every file; without this flag rclone
#     refreshes the stored mtime of each "equal" object with a server-side copy (one Class A request per image).
# Student site releases (archive-pages-release.yml, tools/ci/archive-pages-image-r2-gate.mjs) wait for the exact image
# bytes on img.wangjiedu.com; they do not read this workflow's logs or conclusion.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "archive/assets/images/**"
      - ".github/workflows/r2-archive-assets-copy.yml"

# One run at a time, queued in order. cancel-in-progress stays false so a running upload is never cut off.
# A newer push may replace a run that is still queued; that is safe because every run diffs against the last
# SUCCESSFUL run (not against its own push `before`), so the newest run also covers the images of replaced or failed runs.
concurrency:
  group: r2-archive-assets-copy
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  copy-archive-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RCLONE_VERSION: v1.76.0
      RCLONE_ZIP_SHA256: b00f00b3266c3764413afe599d3ec316f6f43b3e0ea8a0bc1d186d2133e46df7
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            archive/assets/images
            tools/ci

      - name: Check archive image folder
        id: archive_assets
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d archive/assets/images ]; then
            echo "archive/assets/images is absent; nothing to copy."
            echo "exists=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "exists=true" >> "$GITHUB_OUTPUT"

      - name: Validate secrets
        if: steps.archive_assets.outputs.exists == 'true'
        shell: bash
        run: |
          set -euo pipefail
          required=(
            R2_ACCOUNT_ID
            R2_ACCESS_KEY_ID
            R2_SECRET_ACCESS_KEY
            R2_BUCKET
            R2_PUBLIC_BASE_URL
          )

          for name in "${required[@]}"; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required secret: ${name}" >&2
              exit 1
            fi
          done

      - name: Install rclone (pinned)
        if: steps.archive_assets.outputs.exists == 'true'
        shell: bash
        run: |
          set -euo pipefail
          zip="rclone-${RCLONE_VERSION}-linux-amd64.zip"
          curl -fsSL "https://downloads.rclone.org/${RCLONE_VERSION}/${zip}" -o "${RUNNER_TEMP}/${zip}"
          echo "${RCLONE_ZIP_SHA256}  ${RUNNER_TEMP}/${zip}" | sha256sum -c -
          unzip -q -o "${RUNNER_TEMP}/${zip}" -d "${RUNNER_TEMP}/rclone-unpacked"
          sudo install -m 0755 "${RUNNER_TEMP}/rclone-unpacked/rclone-${RCLONE_VERSION}-linux-amd64/rclone" /usr/local/bin/rclone
          rclone version | head -1

      - name: Configure Cloudflare R2 remote
        if: steps.archive_assets.outputs.exists == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf <<EOF
          [r2-ap-assets]
          type = s3
          provider = Cloudflare
          access_key_id = ${R2_ACCESS_KEY_ID}
          secret_access_key = ${R2_SECRET_ACCESS_KEY}
          endpoint = https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com
          acl = private
          EOF
          chmod 600 ~/.config/rclone/rclone.conf

      # Decides what to upload. mode=push uploads only the listed files; mode=full compares every image.
      # Anything unexpected (no earlier successful run, base commit not fetchable, diff error) selects full: the
      # safe direction, because a full --checksum comparison uploads exactly what is missing or different.
      - name: Plan upload (changed images since the last successful run)
        id: plan
        if: steps.archive_assets.outputs.exists == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          list="${RUNNER_TEMP}/changed-images.z"
          : > "$list"
          mode=full
          base=""
          if [ "${GITHUB_EVENT_NAME}" != "push" ]; then
            reason="manual run: compare every image"
          else
            base="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/r2-archive-assets-copy.yml/runs?branch=main&status=success&per_page=1" \
              --jq '.workflow_runs[0].head_sha // empty' 2>/dev/null || true)"
            if ! [[ "$base" =~ ^[0-9a-f]{40}$ ]]; then
              reason="no earlier successful run found: compare every image"
            elif bash tools/ci/r2-changed-images.sh "$base" "$GITHUB_SHA" "$list"; then
              mode=push
              reason="changed since last successful run ${base:0:12}"
            else
              : > "$list"
              reason="could not diff against ${base:0:12}: compare every image"
            fi
          fi
          count=0
          if [ "$mode" = push ]; then
            count="$(tr -cd '\0' < "$list" | wc -c | tr -d ' ')"
          fi
          echo "mode=${mode}" >> "$GITHUB_OUTPUT"
          echo "count=${count}" >> "$GITHUB_OUTPUT"
          echo "list=${list}" >> "$GITHUB_OUTPUT"
          line="R2 plan: mode=${mode} images_to_check=${count} (${reason})"
          echo "$line"
          echo "$line" >> "$GITHUB_STEP_SUMMARY"
          if [ "$count" -gt 0 ]; then
            tr '\0' '\n' < "$list" | head -20
            if [ "$count" -gt 20 ]; then echo "... and $((count - 20)) more"; fi
          fi

      # No --progress: CI logs stay short. -v prints one line per changed object and the periodic stats line.
      - name: Copy archive image assets
        if: steps.archive_assets.outputs.exists == 'true'
        shell: bash
        env:
          PLAN_MODE: ${{ steps.plan.outputs.mode }}
          PLAN_COUNT: ${{ steps.plan.outputs.count }}
          PLAN_LIST: ${{ steps.plan.outputs.list }}
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/rclone-copy.log"
          if [ "$PLAN_MODE" = push ]; then
            if [ "$PLAN_COUNT" -eq 0 ]; then
              echo "No image changed since the last successful run; nothing to upload."
              echo "R2 copy: mode=push requested=0 uploaded=0" | tee -a "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            rclone copy archive/assets/images "r2-ap-assets:${R2_BUCKET}/exams/images" \
              --files-from0 "$PLAN_LIST" \
              --no-traverse \
              --checksum \
              --no-update-modtime \
              --transfers 16 \
              --checkers 16 \
              -v --stats 60s --stats-one-line 2>&1 | tee "$log"
          else
            rclone copy archive/assets/images "r2-ap-assets:${R2_BUCKET}/exams/images" \
              --checksum \
              --no-update-modtime \
              --transfers 16 \
              --checkers 32 \
              --fast-list \
              -v --stats 60s --stats-one-line 2>&1 | tee "$log"
          fi
          uploaded="$(grep -c ': Copied (' "$log" || true)"
          server_side="$(grep -c 'server-side copy' "$log" || true)"
          mtime_updates="$(grep -ci 'modification time' "$log" || true)"
          line="R2 copy: mode=${PLAN_MODE} requested=${PLAN_COUNT} uploaded=${uploaded} server_side_copies=${server_side} mtime_updates=${mtime_updates}"
          echo "$line"
          echo "$line" >> "$GITHUB_STEP_SUMMARY"

      # Read-back check of exactly the files this run was asked to upload (size + MD5 against R2).
      # Full runs already compared every image with --checksum in the copy step.
      - name: Verify uploaded images
        if: steps.archive_assets.outputs.exists == 'true' && steps.plan.outputs.mode == 'push' && steps.plan.outputs.count != '0'
        shell: bash
        env:
          PLAN_LIST: ${{ steps.plan.outputs.list }}
        run: |
          set -euo pipefail
          rclone check archive/assets/images "r2-ap-assets:${R2_BUCKET}/exams/images" \
            --files-from0 "$PLAN_LIST" \
            --one-way \
            --checkers 16
