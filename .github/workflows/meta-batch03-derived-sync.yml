name: Meta BATCH-03 derived output sync (temporary)

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/meta-batch03-derived-sync.yml"

permissions:
  contents: write

concurrency:
  group: meta-batch03-derived-sync
  cancel-in-progress: false

jobs:
  refresh-derived:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/meta-1397-batch-03' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          persist-credentials: true
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Regenerate deterministic Meta Foundation artifacts
        run: |
          set -euo pipefail
          node archive/tools/meta-foundation/compile-meta-foundation.mjs --write
          python archive/build_db.py
          node archive/tools/meta-foundation/refresh-runtime-source-readiness.mjs --write
          node archive/tools/meta-foundation/compile-meta-foundation.mjs --check
          node archive/tools/meta-foundation/refresh-runtime-source-readiness.mjs --check
          git diff --check
      - name: Commit only registration-and-compiler-owned derived artifacts
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA" || {
            echo "Branch moved before sync: refusing stale push."
            exit 1
          }
          git add -- \
            archive/db.js \
            archive/data/question_identity_map.json \
            archive/data/question_metadata.json \
            archive/question-identity.js \
            archive/question-index.js \
            archive/question-index-report.md \
            archive/question-index-audit.md \
            archive/data/archive2-catalog.json \
            archive/data/archive2-source-verification-index.json \
            archive/data/archive2-source-verification/v1 \
            archive/data/archive2-crosswalk-inventory.json \
            archive/data/archive2-canonical-input-manifest.json \
            archive/data/archive2-canonical-projection-policy.json \
            archive/data/archive2-item-review-overrides.json \
            archive/data/basic-scope-parent-links.json \
            archive/data/meta-foundation/compiled/curriculum_bindings.json \
            archive/data/meta-foundation/compiled/taxonomy_registry.json \
            archive/data/meta-foundation/compiled/meta_foundation_compiled.json \
            archive/data/meta-foundation/canonical/registry_index.json \
            archive/data/meta-foundation/runtime
          test -z "$(git diff --name-only)" || {
            echo "Additional compiler files modified, refusing incomplete commit:"
            git diff --name-only
            exit 1
          }
          if git diff --cached --quiet; then
            echo "All tracked derived artifacts are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(meta): refresh generated foundation artifacts for BATCH-03"
          git push origin "HEAD:refs/heads/fix/meta-1397-batch-03"
# BATCH-03 scoped temporary regeneration; delete after artifact sync.
