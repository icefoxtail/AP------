name: Archive2 Runtime Guard

on:
  push:
    branches: [main]
    paths:
      - 'AGENTS.md'
      - 'archive/**'
      - 'tests/archive2-*'
      - 'tests/archive-solution-loading.test.cjs'
      - 'tests/archive-render-feedback.test.cjs'
      - 'tests/archive-font-invalidation.test.cjs'
      - 'tests/fixtures/archive2-*'
      - 'tools/check-archive2-runtime.cjs'
      - 'tools/check-archive2-finder-filter-browser.cjs'
      - 'tools/check-archive-rpm-middle-browser.cjs'
      - 'tools/check-archive-content-browser.mjs'
      - 'tools/ci/archive-ci-scope.mjs'
      - 'tools/ci/run-scoped-tests.mjs'
      - 'tests/archive-ci-scope.test.mjs'
      - 'tests/archive-content-scope.test.mjs'
      - 'tests/archive-original-exam-access.browser.cjs'
      - 'tools/run-tests.js'
      - 'docs/rules/01_CANONICAL/Archive2_Runtime_Responsiveness_and_Original_Source_Contract_v1.md'
      - '.github/workflows/archive2-runtime-guard.yml'
  pull_request:
    branches: [main]
    paths:
      - 'AGENTS.md'
      - 'archive/**'
      - 'tests/archive2-*'
      - 'tests/archive-solution-loading.test.cjs'
      - 'tests/archive-render-feedback.test.cjs'
      - 'tests/archive-font-invalidation.test.cjs'
      - 'tests/fixtures/archive2-*'
      - 'tools/check-archive2-runtime.cjs'
      - 'tools/check-archive2-finder-filter-browser.cjs'
      - 'tools/check-archive-rpm-middle-browser.cjs'
      - 'tools/check-archive-content-browser.mjs'
      - 'tools/ci/archive-ci-scope.mjs'
      - 'tools/ci/run-scoped-tests.mjs'
      - 'tests/archive-ci-scope.test.mjs'
      - 'tests/archive-content-scope.test.mjs'
      - 'tests/archive-original-exam-access.browser.cjs'
      - 'tools/run-tests.js'
      - 'docs/rules/01_CANONICAL/Archive2_Runtime_Responsiveness_and_Original_Source_Contract_v1.md'
      - '.github/workflows/archive2-runtime-guard.yml'
  workflow_dispatch:
    inputs:
      solution_baseline_sha:
        description: 'Optional exact baseline override; otherwise use the pinned correctness-only reference in tests/archive2-output-comparison-references.json.'
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  runtime-contract:
    name: Archive2 runtime contract
    runs-on: ubuntu-latest
    # Full history checkout plus the runtime suite consumed the former 5-minute
    # job budget before Chrome could start. Keep every check and allow both stages.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Classify the fixed snapshot impact
        id: scope
        run: node tools/ci/archive-ci-scope.mjs --output "$RUNNER_TEMP/archive-ci-scope.json"
      - name: Record unchanged shared runtime scope
        if: steps.scope.outputs.runtime_contract != 'true'
        env:
          SCOPE_MODE: ${{ steps.scope.outputs.mode }}
        run: |
          printf 'Shared runtime regression: NOT_APPLICABLE for %s; common output/runtime code and its checkers are unchanged.\n' "$SCOPE_MODE" >> "$GITHUB_STEP_SUMMARY"
          echo 'CI executes the selected source, Meta/Consumer, or registration fixtures. Existing Shared Meta Chrome checks retain their own policies.' >> "$GITHUB_STEP_SUMMARY"
      - name: Verify original routes, response budgets, and storage failures
        if: steps.scope.outputs.runtime_contract == 'true'
        env:
          SVG_ACCESSIBILITY_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: node tools/check-archive2-runtime.cjs
      - uses: browser-actions/setup-chrome@v1
        if: steps.scope.outputs.runtime_chrome == 'true'
        id: chrome
        with:
          chrome-version: stable
      - name: Verify finder and current middle RPM selection in actual Chrome
        if: steps.scope.outputs.runtime_chrome == 'true'
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
          RPM_MIDDLE_BROWSER_REPORT_DIR: ${{ runner.temp }}/archive-rpm-middle-browser
        run: node tools/check-archive2-finder-filter-browser.cjs
      - name: Upload middle RPM browser evidence
        if: always() && steps.scope.outputs.runtime_chrome == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: archive-rpm-middle-browser-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/archive-rpm-middle-browser/
          if-no-files-found: warn
          retention-days: 14

  solution-loading:
    name: Archive2 50-question solution Chrome
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          # Test the same immutable PR merge snapshot as CI and runtime-contract.
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Classify the fixed snapshot impact
        id: scope
        run: node tools/ci/archive-ci-scope.mjs --output "$RUNNER_TEMP/archive-ci-scope.json"
      - name: Verify image deadlines and render feedback regressions
        if: steps.scope.outputs.solution_browser == 'true'
        run: >-
          node --test
          tests/archive-solution-loading.test.cjs
          tests/archive-render-feedback.test.cjs
          tests/archive-font-invalidation.test.cjs
          tests/archive-inline-image-readiness.test.js
          tests/archive-question-image-map-regression.test.js
          tests/archive2-output-strict-gate.test.cjs
      - uses: browser-actions/setup-chrome@v1
        if: steps.scope.outputs.solution_browser == 'true' || steps.scope.outputs.mode == 'archive-content' || steps.scope.outputs.scoped_browser_changed == 'true'
        id: chrome
        with:
          chrome-version: stable
      - name: Install the pinned browser driver outside the checkout
        if: steps.scope.outputs.solution_browser == 'true' || steps.scope.outputs.mode == 'archive-content' || steps.scope.outputs.scoped_browser_changed == 'true'
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm install --prefix "$RUNNER_TEMP/archive-solution-browser" --no-save --package-lock=false --no-audit --no-fund playwright@1.62.1
      - name: Compare 50 real solutions and verify asset failures in actual Chrome
        if: steps.scope.outputs.solution_browser == 'true'
        timeout-minutes: 8
        # The test's checked-in reference applies only the shared image-fit fix
        # to the old engine. Never accept the old overflow as output parity,
        # and never widen the existing one-pixel geometry tolerance.
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
          NODE_PATH: ${{ runner.temp }}/archive-solution-browser/node_modules
          ARCHIVE_SOLUTION_BASE_SHA: ${{ inputs.solution_baseline_sha }}
          ARCHIVE_SOLUTION_REPORT_DIR: ${{ runner.temp }}/archive-solution-loading-evidence
          ARCHIVE_SOLUTION_REPEATS: '2'
        run: node tests/archive2-solution-loading-browser.cjs
      - name: Load and print the changed original sources in actual Chrome
        if: steps.scope.outputs.mode == 'archive-content'
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
          NODE_PATH: ${{ runner.temp }}/archive-solution-browser/node_modules
          ARCHIVE_SOLUTION_REPORT_DIR: ${{ runner.temp }}/archive-solution-loading-evidence
        run: node tools/check-archive-content-browser.mjs --scope "$RUNNER_TEMP/archive-ci-scope.json"
      - name: Verify the changed scoped browser checker on one existing original
        if: steps.scope.outputs.scoped_browser_changed == 'true'
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
          NODE_PATH: ${{ runner.temp }}/archive-solution-browser/node_modules
        run: |
          node tests/archive-original-exam-access.browser.cjs
          ARCHIVE_OUTPUT_MODE=sol node tests/archive-original-exam-access.browser.cjs
      - name: Record unchanged common output scope
        if: steps.scope.outputs.solution_browser != 'true' && steps.scope.outputs.mode != 'archive-content'
        env:
          SCOPE_MODE: ${{ steps.scope.outputs.mode }}
        run: printf '50-question output comparison NOT_APPLICABLE for %s; common output and checker versions did not change. Affected project and data checks run in their existing jobs.\n' "$SCOPE_MODE" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload solution loading metadata, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: archive-solution-loading-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/archive-solution-loading-evidence/
          if-no-files-found: warn
          retention-days: 14
