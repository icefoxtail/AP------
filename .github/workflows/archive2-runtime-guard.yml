name: Shinheung Registered Main Chrome

on:
  push:
    branches: [verify/m1-shinheung-registered-chrome-20261113-bf]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shinheung-registered-chrome-${{ github.ref }}
  cancel-in-progress: false

env:
  EXPECTED_MAIN_SHA: '440f412bd221e3d62df16130984a2626a3ee6441'
  EXPECTED_SOURCE: 'original/middle/m1/2mid/26_신흥중_2학기_중간_중1_기출.js'
  EXPECTED_SOURCE_RAW_SHA256: '2f1ab79eba940498b5c575ad1509a038b3f2dabd390823177635d83937fe4b56'
  EXPECTED_SOURCE_BLOB_SHA1: 'f1a73e96053d17564b42672415ca6bfc5b73cb2c'
  EXPECTED_REQUEST_ID: 'm1-shinheung-meta-closeout-20261113-bf-r1'
  # Official v2 receipt uses the stable JSON digest, not the request file raw digest.
  EXPECTED_REQUEST_DIGEST: 'e8368cd95a8e5820ec4fa312bbeb6adc1f0d10f32564f52f7a84e4816a7671c1'
  EXPECTED_RECEIPT_SHA256: 'bd627b6fe34082ed8ca2a90e49955e75ffb7ee2cfc6e3e4411ae4041d4d2d555'
  EXPECTED_RECEIPT_BLOB_SHA1: '6fe74ab3e215a064dbbbfc8d98555f12e075335d'
  EXPECTED_DRIVER_SHA256: 'a61cc4ea9d5419dcdf2f959b48d2500c6bb48d10ce69ebe270110b38377f741a'
  EXPECTED_INPUT_SHA256: '948b05e71dab0730fa175355d9cf3773852c7f90260089597ce840a8e48ff0da'

jobs:
  registered-main-readonly:
    if: ${{ github.ref == 'refs/heads/verify/m1-shinheung-registered-chrome-20261113-bf' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Read the verification-only commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Preserve and bind the three-file verification package
        id: package
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs'), path = require('node:path'), crypto = require('node:crypto');
          const assert = require('node:assert/strict'), { execFileSync } = require('node:child_process');
          const git = args => execFileSync('git', args, { encoding: 'utf8' }).trim();
          const hash = bytes => crypto.createHash('sha256').update(bytes).digest('hex');
          const expected = process.env.EXPECTED_MAIN_SHA;
          assert.match(expected, /^[a-f0-9]{40}$/);
          assert.equal(process.env.GITHUB_REF, 'refs/heads/verify/m1-shinheung-registered-chrome-20261113-bf');
          assert.deepEqual(git(['show', '-s', '--format=%P', 'HEAD']).split(' '), [expected],
            'verification commit must have the exact registered main as its sole parent');
          const workflow = '.github/workflows/archive2-runtime-guard.yml';
          const driver = 'tools/verification/check-shinheung-registered-browser.cjs';
          const input = 'tools/verification/shinheung-effective-parent-report-input.json';
          const changed = execFileSync('git', ['diff', '--name-only', '-z', expected, 'HEAD'], { encoding: 'utf8' })
            .split('\0').filter(Boolean).sort();
          assert.deepEqual(changed, [workflow, driver, input].sort(), 'exactly the three verification files may differ');
          assert.equal(hash(fs.readFileSync(driver)), process.env.EXPECTED_DRIVER_SHA256);
          assert.equal(hash(fs.readFileSync(input)), process.env.EXPECTED_INPUT_SHA256);
          const task = path.join(process.env.RUNNER_TEMP, 'shinheung-registered-chrome');
          const artifacts = path.join(task, 'artifacts');
          fs.mkdirSync(artifacts, { recursive: true });
          fs.copyFileSync(driver, path.join(task, 'driver.cjs'));
          fs.copyFileSync(input, path.join(task, 'input.json'));
          fs.writeFileSync(path.join(artifacts, 'verification-package.json'), JSON.stringify({
            status: 'BYTE_BOUND_VERIFICATION_PACKAGE', verifierCommit: git(['rev-parse', 'HEAD']),
            expectedRegisteredMain: expected, branch: process.env.GITHUB_REF,
            files: changed.map(file => ({ path: file, sha256: hash(fs.readFileSync(file)) })),
            productionChanges: false, automaticRegistration: false
          }, null, 2) + '\n');
          fs.appendFileSync(process.env.GITHUB_ENV, 'TASK_TEMP=' + task + '\nAUDIT_DIR=' + artifacts + '\n');
          NODE

      - name: Check out the immutable registered main snapshot
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_MAIN_SHA }}
          fetch-depth: 0
          persist-credentials: false
          clean: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Require the actual main receipt and unchanged registered inputs
        id: preflight
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs'), path = require('node:path'), crypto = require('node:crypto');
          const assert = require('node:assert/strict'), { execFileSync } = require('node:child_process');
          const hash = bytes => crypto.createHash('sha256').update(bytes).digest('hex');
          const git = args => execFileSync('git', args, { encoding: 'utf8' }).trim();
          assert.equal(git(['rev-parse', 'HEAD']), process.env.EXPECTED_MAIN_SHA);
          execFileSync('git', ['merge-base', '--is-ancestor', process.env.EXPECTED_MAIN_SHA, 'refs/remotes/origin/main']);
          execFileSync('git', ['diff', '--exit-code']);
          execFileSync('git', ['diff', '--cached', '--exit-code']);
          const statusArgs = ['status', '--porcelain=v1', '--untracked-files=all', '--ignored=matching'];
          assert.equal(git(statusArgs), '', 'registered checkout must be clean, including ignored files');
          const source = 'archive/exams/' + process.env.EXPECTED_SOURCE;
          assert.equal(hash(fs.readFileSync(source)), process.env.EXPECTED_SOURCE_RAW_SHA256);
          assert.equal(git(['rev-parse', 'HEAD:' + source]), process.env.EXPECTED_SOURCE_BLOB_SHA1);
          const input = JSON.parse(fs.readFileSync(path.join(process.env.TASK_TEMP, 'input.json')));
          assert.equal(input.rows.length, 24);
          const uids = input.rows.map(row => row.questionUid).sort();
          assert.equal(new Set(uids).size, 24);
          const receiptPath = 'archive/data/meta-foundation/evidence/reviewed-exam-meta/v1/' + process.env.EXPECTED_REQUEST_ID + '.json';
          const receiptBytes = fs.readFileSync(receiptPath);
          assert.equal(hash(receiptBytes), process.env.EXPECTED_RECEIPT_SHA256);
          assert.equal(git(['rev-parse', 'HEAD:' + receiptPath]), process.env.EXPECTED_RECEIPT_BLOB_SHA1);
          const receipt = JSON.parse(receiptBytes);
          assert.equal(receipt.schemaVersion, 'archive-reviewed-exam-meta-registration-v2');
          assert.equal(receipt.requestId, process.env.EXPECTED_REQUEST_ID);
          assert.equal(receipt.requestSha256, process.env.EXPECTED_REQUEST_DIGEST);
          assert.equal(receipt.metadataRegistrationStatus, 'REGISTERED');
          assert.equal(receipt.sourceArchiveFile, process.env.EXPECTED_SOURCE);
          assert.equal(receipt.sourceRawSha256, process.env.EXPECTED_SOURCE_RAW_SHA256);
          assert.equal(receipt.sourceBlobSha1, process.env.EXPECTED_SOURCE_BLOB_SHA1);
          assert.equal(receipt.approval.type, 'FINAL_QA');
          assert.equal(receipt.approval.metadataReviewed, true);
          assert.equal(receipt.totalQuestions, 24);
          assert.deepEqual(receipt.registryChanges, []);
          for (const field of ['appliedRecords', 'appliedIdentityRecords', 'runtimeRecords']) {
            assert.equal(receipt[field].length, 24, field);
            assert.deepEqual(receipt[field].map(row => row.questionUid).sort(), uids, field + ' exact UID set');
            assert.deepEqual(receipt[field].map(row => Number(row.sourceOrdinal)).sort((a, b) => a - b),
              Array.from({ length: 24 }, (_, i) => i + 1), field + ' exact ordinal set');
          }
          assert(!fs.existsSync('.archive-meta-register/inbox/' + process.env.EXPECTED_REQUEST_ID + '.json'),
            'the actual writer must have consumed this request');
          const approvalRefs = receipt.approval.evidenceRefs.map(ref => {
            const full = path.resolve(ref.path);
            assert(full.startsWith(process.cwd() + path.sep), 'approval evidence must remain in this checkout');
            assert.equal(hash(fs.readFileSync(full)), ref.sha256, 'approval evidence raw hash');
            return { path: ref.path, sha256: ref.sha256 };
          });
          const protectedPaths = [source, receiptPath, 'tests/archive-original-exam-access.browser.cjs',
            'tests/meta-foundation-derivative-runtime.test.js', 'tests/meta-foundation-middle-geometry-runtime.test.js'];
          const snapshot = {
            status: 'REGISTERED_MAIN_PREFLIGHT_PASS', mainSha: git(['rev-parse', 'HEAD']),
            observedOriginMain: git(['rev-parse', 'refs/remotes/origin/main']),
            source, sourceRawSha256: process.env.EXPECTED_SOURCE_RAW_SHA256,
            receiptPath, receiptRawSha256: hash(receiptBytes), requestDigest: receipt.requestSha256,
            totalQuestions: 24, registryChanges: 0, approvalEvidence: approvalRefs,
            protectedFiles: protectedPaths.map(file => ({ path: file, sha256: hash(fs.readFileSync(file)) })),
            indexSha256: hash(execFileSync('git', ['ls-files', '-s', '-z'])),
            statusArgs, gitStatus: '', capturedAtUtc: new Date().toISOString()
          };
          fs.writeFileSync(path.join(process.env.AUDIT_DIR, 'registered-main-preflight.json'), JSON.stringify(snapshot, null, 2) + '\n');
          NODE

      - name: Recheck the two pre-registration stale-runtime tests once
        id: native_tests
        if: ${{ !cancelled() && steps.preflight.outcome == 'success' }}
        shell: bash
        run: |
          set -uo pipefail
          result=0
          for file in tests/meta-foundation-derivative-runtime.test.js tests/meta-foundation-middle-geometry-runtime.test.js; do
            name="$(basename "$file" .js)"
            if node "$file" > "$AUDIT_DIR/$name.log" 2>&1; then
              printf '%s PASS\n' "$file"
            else
              result=1
              printf '%s FAIL; see uploaded log\n' "$file"
            fi
          done
          exit "$result"

      - name: Set up official Google Chrome
        id: chrome
        if: ${{ !cancelled() && steps.preflight.outcome == 'success' }}
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Install the fixed browser driver outside the checkout
        id: install
        if: ${{ !cancelled() && steps.preflight.outcome == 'success' && steps.chrome.outcome == 'success' }}
        shell: bash
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          set -euo pipefail
          npm install --prefix "$TASK_TEMP/deps" --no-save --package-lock=false --no-audit --no-fund playwright@1.62.1
          export NODE_PATH="$TASK_TEMP/deps/node_modules"
          printf 'NODE_PATH=%s\n' "$NODE_PATH" >> "$GITHUB_ENV"
          printf 'CHROME_BIN=%s\n' "$CHROME_BIN" >> "$GITHUB_ENV"
          node <<'NODE'
          const fs = require('node:fs'), path = require('node:path'), crypto = require('node:crypto');
          const assert = require('node:assert/strict'), { execFileSync } = require('node:child_process');
          const version = execFileSync(process.env.CHROME_BIN, ['--version'], { encoding: 'utf8' }).trim();
          assert.match(version, /^Google Chrome(?: for Testing)? /, 'the executable must be actual Google Chrome');
          const playwright = require('playwright/package.json').version;
          assert.equal(playwright, '1.62.1');
          fs.writeFileSync(path.join(process.env.AUDIT_DIR, 'browser-environment.json'), JSON.stringify({
            chromeVersion: version, executableSha256: crypto.createHash('sha256').update(fs.readFileSync(process.env.CHROME_BIN)).digest('hex'),
            playwrightVersion: playwright, nodeVersion: process.version
          }, null, 2) + '\n');
          NODE

      - name: Open the original exam and solution in actual Chrome
        id: original_outputs
        if: ${{ !cancelled() && steps.preflight.outcome == 'success' && steps.install.outcome == 'success' }}
        shell: bash
        env:
          ARCHIVE_ORIGINAL_EXAM: ${{ env.EXPECTED_SOURCE }}
        run: |
          set -uo pipefail
          result=0
          for mode in exam sol; do
            if ARCHIVE_EXAM_ACCESS_ROOT="$GITHUB_WORKSPACE" ARCHIVE_OUTPUT_MODE="$mode" \
              node tests/archive-original-exam-access.browser.cjs > "$AUDIT_DIR/original-$mode.json" 2> "$AUDIT_DIR/original-$mode.stderr.log"; then
              printf '%s checker completed\n' "$mode"
            else
              result=1
              printf '%s checker failed; see uploaded evidence\n' "$mode"
            fi
          done
          if ! node <<'NODE'
          const fs = require('node:fs'), path = require('node:path'), assert = require('node:assert/strict');
          for (const mode of ['exam', 'sol']) {
            const result = JSON.parse(fs.readFileSync(path.join(process.env.AUDIT_DIR, 'original-' + mode + '.json')));
            assert.equal(result.status, 'OUTPUT_TECHNICAL_PASS');
            assert.equal(result.source, process.env.EXPECTED_SOURCE);
            assert.equal(result.mode, mode);
            assert.equal(result.questions, 24, 'the exact Shinheung exam must contain 24 rendered questions');
          }
          NODE
          then
            result=1
          fi
          exit "$result"

      - name: Verify all 24 actual parent searches and source selections
        id: finder
        if: ${{ !cancelled() && steps.preflight.outcome == 'success' && steps.install.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          node "$TASK_TEMP/driver.cjs" "$GITHUB_WORKSPACE" "$TASK_TEMP/input.json" "$AUDIT_DIR/finder" \
            > "$AUDIT_DIR/finder.log" 2>&1

      - name: Verify the registered checkout stayed unchanged
        id: readonly
        if: ${{ always() && steps.preflight.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs'), path = require('node:path'), crypto = require('node:crypto');
          const assert = require('node:assert/strict'), { execFileSync } = require('node:child_process');
          const hash = bytes => crypto.createHash('sha256').update(bytes).digest('hex');
          const git = args => execFileSync('git', args, { encoding: 'utf8' }).trim();
          const before = JSON.parse(fs.readFileSync(path.join(process.env.AUDIT_DIR, 'registered-main-preflight.json')));
          const after = { mainSha: git(['rev-parse', 'HEAD']), gitStatus: git(before.statusArgs),
            indexSha256: hash(execFileSync('git', ['ls-files', '-s', '-z'])),
            protectedFiles: before.protectedFiles.map(ref => ({ path: ref.path, sha256: hash(fs.readFileSync(ref.path)) })) };
          fs.writeFileSync(path.join(process.env.AUDIT_DIR, 'checkout-after.json'), JSON.stringify(after, null, 2) + '\n');
          execFileSync('git', ['diff', '--exit-code']);
          execFileSync('git', ['diff', '--cached', '--exit-code']);
          assert.equal(after.mainSha, before.mainSha);
          assert.equal(after.gitStatus, before.gitStatus);
          assert.equal(after.indexSha256, before.indexSha256);
          assert.deepEqual(after.protectedFiles, before.protectedFiles);
          assert.equal(hash(fs.readFileSync(path.join(process.env.TASK_TEMP, 'driver.cjs'))), process.env.EXPECTED_DRIVER_SHA256);
          assert.equal(hash(fs.readFileSync(path.join(process.env.TASK_TEMP, 'input.json'))), process.env.EXPECTED_INPUT_SHA256);
          NODE

      - name: Record the exact verification verdict
        if: always()
        shell: bash
        env:
          PACKAGE_OUTCOME: ${{ steps.package.outcome }}
          PREFLIGHT_OUTCOME: ${{ steps.preflight.outcome }}
          NATIVE_OUTCOME: ${{ steps.native_tests.outcome }}
          CHROME_OUTCOME: ${{ steps.chrome.outcome }}
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          OUTPUT_OUTCOME: ${{ steps.original_outputs.outcome }}
          FINDER_OUTCOME: ${{ steps.finder.outcome }}
          READONLY_OUTCOME: ${{ steps.readonly.outcome }}
        run: |
          node <<'NODE'
          const fs = require('node:fs'), path = require('node:path');
          const directory = path.join(process.env.RUNNER_TEMP, 'shinheung-registered-chrome', 'artifacts');
          fs.mkdirSync(directory, { recursive: true });
          const outcomes = Object.fromEntries(['PACKAGE', 'PREFLIGHT', 'NATIVE', 'CHROME', 'INSTALL', 'OUTPUT', 'FINDER', 'READONLY']
            .map(name => [name, process.env[name + '_OUTCOME'] || 'unknown']));
          const passed = Object.values(outcomes).every(value => value === 'success');
          const verdict = { status: passed ? 'REGISTERED_MAIN_ACTUAL_CHROME_PASS' : 'FAIL_OR_INCOMPLETE',
            registeredMainSha: process.env.EXPECTED_MAIN_SHA, verificationCommit: process.env.GITHUB_SHA,
            runId: process.env.GITHUB_RUN_ID, runAttempt: process.env.GITHUB_RUN_ATTEMPT,
            outcomes, examQuestionsRequired: 24, solutionQuestionsRequired: 24, finderQuestionsRequired: 24,
            registrationPerformed: false, productionWritesPerformed: false, mathematicalReviewPerformed: false,
            finishedAtUtc: new Date().toISOString() };
          fs.writeFileSync(path.join(directory, 'verdict.json'), JSON.stringify(verdict, null, 2) + '\n');
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,
            '### ' + verdict.status + '\n\nRegistered main: ' + verdict.registeredMainSha + '\n\n' +
            Object.entries(outcomes).map(([key, value]) => '- ' + key + ': ' + value).join('\n') + '\n');
          console.log(JSON.stringify(verdict));
          if (!passed) process.exitCode = 1;
          NODE

      - name: Preserve evidence even when a required check fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shinheung-registered-main-chrome-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/shinheung-registered-chrome/artifacts
          if-no-files-found: warn
          retention-days: 14
