name: Middle Runtime Focused Existing Receipt Gate
on:
  push:
    branches:
      - ops/middle-runtime-focused-26fc-20261117
permissions:
  contents: read
concurrency:
  group: middle-runtime-focused-${{ github.ref }}
  cancel-in-progress: false
jobs:
  focused-runtime:
    if: github.repository == 'icefoxtail/AP------' && github.event_name == 'push' && github.ref == 'refs/heads/ops/middle-runtime-focused-26fc-20261117'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - name: Checkout the exact source event with complete immutable history
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Supported Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Parse the two changed regression files
        run: |
          node --check tests/helpers/middle-geometry-issued-approval.cjs
          node --check tests/meta-foundation-middle-geometry-runtime.test.js
      - name: Official temporary source registration projection
        id: projection
        run: node tools/ci/archive-pr-registration-prepare.mjs
      - name: The existing middle geometry runtime regression only
        id: runtime
        run: node tests/meta-foundation-middle-geometry-runtime.test.js
      - name: Record actual outcomes without issuing approval
        if: always()
        env:
          PROJECTION_OUTCOME: ${{ steps.projection.outcome }}
          RUNTIME_OUTCOME: ${{ steps.runtime.outcome }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import {execFileSync} from 'node:child_process';
          const e=process.env;
          const head=execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim();
          if(head!==e.GITHUB_SHA)throw Error('FOCUSED_CHECKOUT_CHANGED');
          const report={schemaVersion:'archive-middle-runtime-focused-outcome-v1',
            repository:e.GITHUB_REPOSITORY,ref:e.GITHUB_REF,checkoutCommit:head,
            runId:e.GITHUB_RUN_ID,runAttempt:Number(e.GITHUB_RUN_ATTEMPT),
            officialPushProjection:e.PROJECTION_OUTCOME,runtimeFile:e.RUNTIME_OUTCOME,
            fullPrCi:'NOT_RUN',newApprovals:0,mainWrites:0};
          const dir=path.join(e.RUNNER_TEMP,'middle-runtime-focused');
          fs.mkdirSync(dir,{recursive:true});
          fs.writeFileSync(path.join(dir,'outcome.json'),JSON.stringify(report,null,2)+'\n');
          console.log(JSON.stringify(report));
          NODE
      - name: Preserve the actual focused result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: middle-runtime-focused-${{ github.sha }}
          path: ${{ runner.temp }}/middle-runtime-focused/outcome.json
          if-no-files-found: error
