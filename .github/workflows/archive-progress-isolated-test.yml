name: Archive Progress Isolated Live Test (review only)
on:
  push:
    branches: [review/archive-progress-live-20261011]
    paths:
      - archive/tools/archive-progress-observer.mjs
permissions:
  contents: write
  actions: read
  pull-requests: read
jobs:
  live-observer-check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact review event SHA (never main)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Confirm actual observer code revision
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          echo "OBSERVER_CHECKOUT_SHA=$actual"
          test "$actual" = "$GITHUB_SHA"
          test -f archive/tools/archive-progress-observer.mjs
      - name: Download only B15 small diagnostic ZIP (never Pages ZIP)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api /repos/icefoxtail/AP------/actions/artifacts/11691357897/zip > "$RUNNER_TEMP/b15-release-diagnostics.zip"
          unzip -t "$RUNNER_TEMP/b15-release-diagnostics.zip" >/dev/null
          test "$(stat -c%s "$RUNNER_TEMP/b15-release-diagnostics.zip")" -lt 8388608
      - name: Existing regression tests with physical B15 evidence
        env:
          B15_DIAGNOSTIC_ZIP: ${{ runner.temp }}/b15-release-diagnostics.zip
        run: node --test tests/archive-progress-observer.test.mjs tests/archive-progress-realpaths.test.mjs tests/archive-progress-recovery.test.mjs tests/archive-progress-cache-targets.test.mjs tests/b15-actual-diagnostic.test.mjs
      - name: Live GitHub API collection and isolated state-branch roundtrip
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .observer-review/live-check.mjs
      - name: Chromium test with real remote-readback JSON
        shell: bash
        run: |
          python3 -m pip install --quiet playwright
          python3 -m playwright install --with-deps chromium
          python3 .observer-review/live-ui.py
      - name: Save actual collection and screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: archive-progress-isolated-live-evidence
          path: |
            observer-live-status.json
            observer-live-report.json
            observer-live-screenshot.png
          if-no-files-found: warn
          retention-days: 7
