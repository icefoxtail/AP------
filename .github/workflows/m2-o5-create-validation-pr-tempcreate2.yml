name: M2 o5 R1 validation PR r1-1
on:
  pull_request:
    branches:
      - main
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Calibration preflight
        run: node archive/tools/solution-calibration-gate.mjs --exam "archive/exams/original/middle/m2/1mid/24_연향중_1학기_중간_중2_기출.js" --evidence "archive/data/r2e-intake/m2/24_연향중_1학기_중간_중2_기출.review1.physical-evidence.json" --stage R1 --preflight
      - name: Canonical R1 gate
        run: node archive/tools/review-evidence-gate.mjs --exam "archive/exams/original/middle/m2/1mid/24_연향중_1학기_중간_중2_기출.js" --evidence "archive/data/r2e-intake/m2/24_연향중_1학기_중간_중2_기출.review1.physical-evidence.json" --stage R1
