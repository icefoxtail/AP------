name: M2 o5 CREATE validation PR temp-create2
on:
  pull_request:
    branches:
      - main
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Calibration preflight
        run: node archive/tools/solution-calibration-gate.mjs --exam "archive/exams/original/middle/m2/1mid/24_연향중_1학기_중간_중2_기출.js" --evidence "archive/data/r2e-intake/m2/24_연향중_1학기_중간_중2_기출.create.physical-evidence.json" --stage CREATE --preflight
      - name: Canonical CREATE gate
        run: node archive/tools/review-evidence-gate.mjs --exam "archive/exams/original/middle/m2/1mid/24_연향중_1학기_중간_중2_기출.js" --evidence "archive/data/r2e-intake/m2/24_연향중_1학기_중간_중2_기출.create.physical-evidence.json" --stage CREATE
