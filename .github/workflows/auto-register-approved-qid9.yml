name: Register main-resident Generated questions
on:
  push:
    branches: [main]
    paths:
      - 'archive/generated/lite/v1/**/shards/**/*.js'
      - 'archive/generated/lite/v1/**/metadata/**/*.json'
      - 'archive/tools/generated-meta/rebuild-main-source-consumer.mjs'
      - 'archive/problem-bank-meta.js'
      - 'archive/archive2-source.js'
      - 'archive/generated-bank.html'
      - 'archive/problem-bank-search.html'
      - '.github/workflows/auto-register-approved-qid9.yml'
  pull_request:
    branches: [main]
    paths:
      - 'archive/generated/lite/v1/**/shards/**/*.js'
      - 'archive/generated/lite/v1/**/metadata/**/*.json'
      - 'archive/tools/generated-meta/rebuild-main-source-consumer.mjs'
      - 'archive/problem-bank-meta.js'
      - 'archive/archive2-source.js'
      - 'archive/generated-bank.html'
      - 'archive/problem-bank-search.html'
      - '.github/workflows/auto-register-approved-qid9.yml'
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: main-generated-source-consumer
  cancel-in-progress: false
jobs:
  register:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rebuild and verify complete main-resident source projection
        run: |
          node archive/tools/generated-meta/rebuild-main-source-consumer.mjs --write
          node archive/tools/generated-meta/rebuild-main-source-consumer.mjs --check
      - name: Validate Archive 2.0 technical integrity and search/output flow
        run: node --test tests/problem-bank-meta.test.cjs
      - name: Create and normally merge the projection PR
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add archive/generated/lite/v1 archive/data/generated-lite-consumer/v1
          if git diff --cached --quiet; then
            echo 'Generated Consumer projection is current.'
            exit 0
          fi
          branch="codex/main-generated-consumer-${GITHUB_RUN_ID}"
          git switch -c "$branch"
          git commit -m 'chore(archive): sync main Generated question sources'
          git push origin HEAD
          pr_url="$(gh pr create --base main --head "$branch" --title 'Sync main Generated Consumer projection' --body 'Automated projection of main-resident Generated question JS and metadata. Review history remains intact; source availability is independent of review approval.' || true)"
          if [ -z "$pr_url" ]; then
            pr_url="$(gh pr list --state open --base main --head "$branch" --json url --jq '.[0].url // empty')"
          fi
          if [ -z "$pr_url" ]; then
            echo 'Could not create or resolve the normal projection PR.' >&2
            exit 1
          fi
          # Perform an ordinary merge through GitHub. Repository protections still apply;
          # no administrator bypass, merge-queue override, or direct main push is used.
          gh pr merge "$pr_url" --merge --delete-branch
