name: Register approved QID9 source packages

on:
  pull_request:
    branches: [main]
    paths:
      - 'alive/06_EXECUTION/H1_SCHOOL_EXPANSION/**/GPT_QID9_EXAM_MANIFEST.json'
      - 'alive/06_EXECUTION/H1_SCHOOL_EXPANSION/**/GPT_QID9_Q*_PACKAGE.json'
      - 'alive/06_EXECUTION/H1_SCHOOL_EXPANSION/**/GPT_QID9_*_USER_DIRECTED_APPROVAL_*.json'
      - 'archive/data/evidence-authority/v1/palma-mock-builder-20261010/**'
      - 'archive/data/evidence-authority/v1/index.json'
      - 'archive/assets/generated-lite/ALITE-PALMA25-2MID-Q*-*.svg'
      - 'alive/06_EXECUTION/H1_SCHOOL_EXPANSION/**/GPT_QID9_Q*_CREATE_DRAFT.json'
      - 'archive/data/generated-source-import-roots-v1.json'
      - 'archive/tools/generated-meta/compile-qid9-main-source.mjs'
      - 'tools/check-qid9-main-source-browser.cjs'
      - 'archive/generated/lite/v1/**/shards/**/*.js'
      - 'archive/generated/lite/v1/**/metadata/**/*.json'
      - 'archive/tools/generated-meta/auto-register-approved-qid9.mjs'
      - 'archive/tools/generated-meta/register-approved-generated-meta.mjs'
      - 'archive/tools/generated-meta-retention-gate.cjs'
      - 'archive/data/generated-lite-consumer/v1/**'
      - 'archive/generated-mock-selection.js'
      - 'archive/generated-bank.html'
      - 'tests/archive2-generated-bank-registration.test.js'
      - 'tests/archive2-generated-mock-selection.test.cjs'
      - 'tests/generated-meta-retention.test.cjs'
      - '.github/workflows/auto-register-approved-qid9.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: approved-qid9-source-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-approved-source:
    name: Approved source, scoped Meta, and Consumer validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Materialize configured QID9 source and visual assets
        run: |
          node archive/tools/generated-meta/compile-qid9-main-source.mjs --write
          node archive/tools/generated-meta/compile-qid9-main-source.mjs --check
      - name: Materialize approved QID9 items from source packages and receipts
        run: node archive/tools/generated-meta/auto-register-approved-qid9.mjs --write
      - name: Check approved UID completeness and source projection parity
        run: node archive/tools/generated-meta/auto-register-approved-qid9.mjs --check
      - name: Rebuild and check all main-resident source rows
        run: |
          node archive/tools/generated-meta/rebuild-main-source-consumer.mjs --write
          node archive/tools/generated-meta/rebuild-main-source-consumer.mjs --check
      - name: Verify configured QID9 Consumer and visual parity
        run: node archive/tools/generated-meta/verify-qid9-main-source-projection.mjs
      - name: Validate scoped approval Meta and source availability contracts
        run: >-
          node --test
          archive/tools/generated-meta/register-approved-generated-meta.test.mjs
          archive/tools/generated-meta/auto-register-approved-qid9.test.mjs
          tests/generated-meta-retention.test.cjs
          tests/generated-main-source-consumer-sync.test.cjs
          tests/archive2-generated-bank-registration.test.js
          tests/archive2-generated-mock-selection.test.cjs
          tests/problem-bank-meta.test.cjs

      - uses: browser-actions/setup-chrome@v1
        id: qid9_chrome
        with:
          chrome-version: stable
      - name: Verify both configured QID9 schools in actual Chrome
        env:
          CHROME_BIN: ${{ steps.qid9_chrome.outputs.chrome-path }}
        run: |
          node tools/check-qid9-main-source-browser.cjs
          QID9_SOURCE_ROOT_INDEX=1 QID9_SAMPLE_QID=17 node tools/check-qid9-main-source-browser.cjs
