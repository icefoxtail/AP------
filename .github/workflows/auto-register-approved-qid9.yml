name: Auto-register approved QID9 Meta and Consumer
on:
  push:
    branches: [main]
    paths:
      - 'alive/06_EXECUTION/H1_SCHOOL_EXPANSION/**/GPT_QID9_EXAM_MANIFEST.json'
      - 'alive/06_EXECUTION/H1_SCHOOL_EXPANSION/**/GPT_QID9_Q*_PACKAGE.json'
      - 'alive/06_EXECUTION/H1_SCHOOL_EXPANSION/**/GPT_QID9_*_USER_DIRECTED_APPROVAL_*.json'
      - 'archive/analysis/palma-mock-builder-20261010/**'
      - 'archive/assets/generated-lite/ALITE-PALMA25-2MID-Q*-*.svg'
      - 'archive/tools/generated-meta/auto-register-approved-qid9.mjs'
      - 'tools/check-generated-bank-browser.cjs'
      - 'archive/generated/lite/v1/2022/H1/**/extension-l4/**'
      - 'archive/generated/lite/v1/2022/H1/**/extension-meta/**'
      - '.github/workflows/auto-register-approved-qid9.yml'
  pull_request:
    branches: [main]
    paths:
      - 'archive/tools/generated-meta/auto-register-approved-qid9.mjs'
      - 'archive/tools/generated-meta-retention-gate.cjs'
      - 'tests/generated-meta-retention.test.cjs'
      - 'tests/archive2-generated-bank-registration.test.js'
      - 'tools/check-generated-bank-browser.cjs'
      - '.github/workflows/auto-register-approved-qid9.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: approved-qid9-auto-register-main
  cancel-in-progress: false

jobs:
  auto-register:
    name: Approval-to-Meta-to-Consumer-to-Chrome
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Materialize only approved QID9 items
        run: node archive/tools/generated-meta/auto-register-approved-qid9.mjs --write
      - name: Validate complete approved Meta and student Consumer
        run: |
          node archive/tools/generated-meta-retention-gate.cjs
          node --test archive/tools/generated-meta/register-approved-generated-meta.test.mjs archive/tools/generated-meta/auto-register-approved-qid9.test.mjs tests/generated-meta-retention.test.cjs tests/archive2-generated-bank-registration.test.js tests/problem-bank-meta.test.cjs tests/generated-meta-backfill.test.cjs
      - name: Install real Chrome
        uses: browser-actions/setup-chrome@v1
        id: chrome
        with:
          chrome-version: stable
      - name: Confirm actual student lookup, preview and print
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: node tools/check-generated-bank-browser.cjs
