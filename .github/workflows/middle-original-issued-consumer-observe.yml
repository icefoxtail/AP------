name: Original middle issued Consumer observation

on:
  push:
    branches:
      - ops/middle-original-issued-consumer-26fc-20261117

permissions:
  contents: read

concurrency:
  group: middle-original-issued-consumer-readonly
  cancel-in-progress: false

jobs:
  observe-current:
    if: >-
      github.repository == 'icefoxtail/AP------' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/ops/middle-original-issued-consumer-26fc-20261117'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out exact observer code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: code
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /tools/ci/observe-original-middle-issued-3330.cjs
          persist-credentials: false
      - name: Check out actual persisted main without generating data
        uses: actions/checkout@v4
        with:
          ref: main
          path: actual
          fetch-depth: 0
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.gitattributes
            /package.json
            /archive/*.js
            /archive/data/
            /docs/rules/01_CANONICAL/taxonomy/rpm-primary-v1.0/00_POLICY/CANONICAL_MASTER.json
            /archive/tools/
            /archive/exams/original/middle/m2/
            /archive/exams/original/middle/m3/2mid/
            /archive/exams/original/middle/m3/2final/
            /tools/
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Observer syntax and pure metadata protocol
        run: |
          node --check code/tools/ci/observe-original-middle-issued-3330.cjs
          node code/tools/ci/observe-original-middle-issued-3330.cjs --self-test
      - name: Observe stored fields and official current Consumer for the exact 3330 members
        run: |
          node --max-old-space-size=6144 code/tools/ci/observe-original-middle-issued-3330.cjs \
            --root "$GITHUB_WORKSPACE/actual" \
            --code-root "$GITHUB_WORKSPACE/code" \
            --output "$RUNNER_TEMP/original-issued3330/observation.json" \
            --allow-git-object-hydration
      - name: Preserve the exact readonly observation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: original-middle-issued3330-observation
          path: ${{ runner.temp }}/original-issued3330/observation.json
          if-no-files-found: warn
          retention-days: 14
