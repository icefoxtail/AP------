name: JS Archive Meta Resolver Bridge
on:
  pull_request:
    paths:
      - 'archive/tools/meta-foundation/stage-meta-bridge.mjs'
      - 'archive/tools/meta-foundation/stage-meta-bridge.test.mjs'
      - 'archive/tools/meta-foundation/rpm-active-resolver.mjs'
      - 'archive/tools/meta-foundation/rpm-active-resolver.test.mjs'
      - 'archive/tools/past-exam-pipeline/lib/completion-evidence.mjs'
      - '.github/workflows/meta-resolver-bridge.yml'
  push:
    branches: [main]
    paths:
      - 'archive/tools/meta-foundation/stage-meta-bridge.mjs'
      - 'archive/tools/meta-foundation/stage-meta-bridge.test.mjs'
      - 'archive/tools/meta-foundation/rpm-active-resolver.mjs'
      - 'archive/tools/meta-foundation/rpm-active-resolver.test.mjs'
      - 'archive/tools/past-exam-pipeline/lib/completion-evidence.mjs'
      - '.github/workflows/meta-resolver-bridge.yml'
  workflow_dispatch:

# A newer push to the same pull request cancels that PR's older run (runner demand).
# main and manual runs keep one group per run and are never cancelled, so every main commit keeps its verdict.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('meta-resolver-bridge-pr-{0}', github.event.pull_request.number) || format('meta-resolver-bridge-{0}-{1}', github.event_name, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  resolver-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Assemble question metadata (git holds its shards)
        run: if [ -d archive/data/question-metadata/v1 ]; then node archive/tools/meta-foundation/question-metadata-format.mjs assemble; fi
      - name: Parse only changed code path
        run: |
          node --check archive/tools/meta-foundation/stage-meta-bridge.mjs
          node --check archive/tools/meta-foundation/stage-meta-bridge.test.mjs
          node --check archive/tools/past-exam-pipeline/lib/completion-evidence.mjs
      - name: Run official resolver and projection parity regression
        run: |
          node --test archive/tools/meta-foundation/stage-meta-bridge.test.mjs
          node --test archive/tools/meta-foundation/rpm-active-resolver.test.mjs
