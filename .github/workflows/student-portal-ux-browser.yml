name: Student portal UX browser

on:
  pull_request:
    paths:
      - 'apmath/student/**'
      - 'apmath/homework/**'
      - 'apmath/planner/**'
      - 'apmath/playground/index.html'
      - 'apmath/playground/universe/universe.css'
      - 'apmath/playground/next/**'
      - 'apmath/playground/next/kit/apl-hub.css'
      - 'apmath/css/student-tools.css'
      - 'apmath/css/student-navigation.css'
      - 'apmath/js/student-navigation.js'
      - 'apmath/wrong_print_engine.html'
      - 'archive/archive2-reader-controls.js'
      - 'apmath/css/apms-student-experience.css'
      - 'tests/student-portal-*'
      - 'tests/apmath-student-teacher-preview.test.js'
      - 'tests/fixtures/student-portal-ux-api.cjs'
      - '.github/workflows/student-portal-ux-browser.yml'
  push:
    branches: [main]
    paths:
      - 'apmath/student/**'
      - 'apmath/homework/**'
      - 'apmath/planner/**'
      - 'apmath/playground/index.html'
      - 'apmath/playground/universe/universe.css'
      - 'apmath/playground/next/**'
      - 'apmath/playground/next/kit/apl-hub.css'
      - 'apmath/css/student-tools.css'
      - 'apmath/css/student-navigation.css'
      - 'apmath/js/student-navigation.js'
      - 'apmath/wrong_print_engine.html'
      - 'archive/archive2-reader-controls.js'
      - 'apmath/css/apms-student-experience.css'
      - 'tests/student-portal-*'
      - 'tests/apmath-student-teacher-preview.test.js'
      - 'tests/fixtures/student-portal-ux-api.cjs'
      - '.github/workflows/student-portal-ux-browser.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: student-portal-ux-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  synthetic-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out the exact proposed revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: source
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /apmath/student/
            /apmath/homework/
            /apmath/planner/
            /apmath/css/
            /apmath/playground/
            /apmath/js/student.js
            /apmath/js/student-navigation.js
            /apmath/wrong_print_engine.html
            /apmath/worker-backup/worker/
            /archive/*.js
            /archive/*.css
            /archive/css/
            /archive/js/
            /archive/vendor/
            /archive/data/svg-accessibility-index.js
            /archive/engine.html
            /archive/mixed_engine.html
            /tests/student-portal-*
            /tests/student-navigation-subpages.test.cjs
            /tests/apmath-student-teacher-preview.test.js
            /tests/fixtures/student-portal-ux-api.cjs
      - name: Check out the exact baseline for visual comparison
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha || github.event.before || 'main' }}
          path: baseline
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /apmath/student/
            /apmath/homework/
            /apmath/planner/
            /apmath/css/
            /archive/*.js
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Targeted student UX and snapshot regression
        working-directory: source
        run: |
          node tests/student-portal-experience.test.js
          node tests/student-portal-geometry-lab-entry.test.js
          node tests/student-portal-mixed-review-payload.test.js
          node tests/student-portal-omr-review-ui.test.js
          node tests/student-portal-wrong-clinic-hotfix.test.js
          node tests/apmath-student-teacher-preview.test.js
          node tests/student-portal-omr-history-routes.test.js
          node tests/student-navigation-subpages.test.cjs
      - name: Install isolated Chromium test runtime and Korean glyphs
        if: ${{ !cancelled() }}
        run: |
          npm install --prefix "$RUNNER_TEMP/student-browser" --no-save --package-lock=false --no-audit --no-fund playwright@1.56.1 esbuild@0.28.1 miniflare@4.20260708.1 @cloudflare/puppeteer@1.4.0
          "$RUNNER_TEMP/student-browser/node_modules/.bin/playwright" install --with-deps chromium
          sudo apt-get install --no-install-recommends -y fonts-noto-cjk
      - name: Capture baseline with synthetic data
        if: ${{ !cancelled() }}
        env:
          NODE_PATH: ${{ runner.temp }}/student-browser/node_modules
        run: |
          node source/tests/student-portal-ux-browser.cjs --screens-only \
            --source-root="$GITHUB_WORKSPACE/baseline" \
            --output="$RUNNER_TEMP/student-portal-ux/baseline" \
            --revision="$(git -C baseline rev-parse HEAD)"
      - name: Verify complete student learning flows
        if: ${{ !cancelled() }}
        env:
          NODE_PATH: ${{ runner.temp }}/student-browser/node_modules
        run: |
          node source/tests/student-portal-ux-browser.cjs \
            --output="$RUNNER_TEMP/student-portal-ux/proposed" \
            --revision="$(git -C source rev-parse HEAD)"
      - name: Verify independent experience coverage and all 150 assignments
        if: ${{ !cancelled() }}
        env:
          NODE_PATH: ${{ runner.temp }}/student-browser/node_modules
          STUDENT_UX_SHOTS_DIR: ${{ runner.temp }}/student-portal-ux/experience
        run: |
          export STUDENT_UX_REVISION="$(git -C source rev-parse HEAD)"
          node source/tests/student-portal-experience-browser.cjs
      - name: Verify feature access using real Worker authentication in isolated D1
        if: ${{ !cancelled() }}
        env:
          NODE_PATH: ${{ runner.temp }}/student-browser/node_modules
        run: |
          node source/tests/student-portal-accessibility-browser.cjs \
            --output="$RUNNER_TEMP/student-portal-ux/accessibility" \
            --revision="$(git -C source rev-parse HEAD)"
      - name: Upload screenshots and machine readable evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: student-portal-ux-${{ github.run_id }}
          path: ${{ runner.temp }}/student-portal-ux/
          if-no-files-found: error
          retention-days: 14
