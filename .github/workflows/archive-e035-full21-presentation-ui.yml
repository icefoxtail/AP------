name: E035 Full21 Presentation Evidence

on:
  push:
    branches:
      - 'checkpoint/middle-registration-6f9942eb-e035-full21-ui-20261116'
    paths:
      - '.github/workflows/archive-e035-full21-presentation-ui.yml'
      - 'tools/check-e035-full21-presentation-browser.cjs'
      - 'tests/fixtures/archive-e035-full21-presentation-ui.json'
  pull_request:
    paths:
      - '.github/workflows/archive-e035-full21-presentation-ui.yml'
      - 'tools/check-e035-full21-presentation-browser.cjs'
      - 'tests/fixtures/archive-e035-full21-presentation-ui.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e035-full21-presentation-evidence-${{ github.event.pull_request.number || github.ref }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  exact-presentation54-ui:
    name: E035 full21 bank, 54 exact presentation views
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: browser-actions/setup-chrome@v1
        id: chrome
        with:
          chrome-version: stable
      - name: Install the pinned project browser driver outside the checkout
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm install --prefix "$RUNNER_TEMP/e035-browser" --no-save --package-lock=false --no-audit --no-fund playwright@1.62.1
      - name: Capture 54 current technical views without issuing a continuity or slot decision
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
          NODE_PATH: ${{ runner.temp }}/e035-browser/node_modules
          E035_PRODUCER_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: >-
          node tools/check-e035-full21-presentation-browser.cjs
          --repo "$GITHUB_WORKSPACE"
          --producer-commit "$E035_PRODUCER_COMMIT"
          --output "$RUNNER_TEMP/e035-full21-ui-evidence"
          --chrome "$CHROME_BIN"
      - name: Preserve original PNG tiles and all failure diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e035-full21-presentation-ui-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/e035-full21-ui-evidence/
          if-no-files-found: warn
          retention-days: 14
