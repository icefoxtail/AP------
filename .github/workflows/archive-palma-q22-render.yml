name: Palma Q22 bounded visual evidence
on:
  pull_request:
    branches: [main]
    paths:
      - 'docs/operations/m2s1-palma-q22-render-20261115/**'
      - '.github/workflows/archive-palma-q22-render.yml'
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GEOMETRY_PYTHON: python
      GEOMETRY_BROWSER_EXECUTABLE: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bind the restored exact source and official calibration
        run: |
          git rev-parse HEAD > source-commit.txt
          node archive/tools/solution-calibration-gate.mjs --exam archive/exams/original/middle/m2/1mid/21_팔마중_1학기_중간_중2_기출.js --evidence docs/operations/m2s1-palma-q22-render-20261115/calibration-r2.json --stage VISUAL_REPAIR --preflight --json
          test -x "$GEOMETRY_BROWSER_EXECUTABLE"
      - name: Install the locked official renderer dependencies
        run: node archive/tools/geometry-equation/production/setup-spikes.mjs
      - name: Capture the restored source and frozen SVG in actual Archive
        run: node docs/operations/m2s1-palma-q22-render-20261115/final-render-ci.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: palma-q22-final-source-evidence
          include-hidden-files: true
          path: |
            source-commit.txt
            .tmp/archive/
            docs/operations/m2s1-palma-q22-render-20261115/
          retention-days: 30
