name: Archive M2 Problem24 Current Student UI Evidence

on:
  push:
    branches: ['review-reference/m2-problem24-current-ui-20261116']
    paths:
      - '.github/workflows/archive-m2-problem24-current-ui.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  problem-ui:
    name: Exact 24 problems in desktop and mobile student UI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify the exact Hangul recapture renderer
        run: |
          node - <<'NODE'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const bytes = fs.readFileSync('archive/engine.html');
          const sha256 = crypto.createHash('sha256').update(bytes).digest('hex');
          const gitBlobSha1 = crypto.createHash('sha1').update(Buffer.from('blob ' + bytes.length + '\0')).update(bytes).digest('hex');
          assert.equal(sha256, 'c712d0ebb52e3b5de22f4d8ad364d61bc56c13a0f6e463d22da0deda6ee9f1c4', 'Q10_RECAPTURE_ENGINE_RAW_DRIFT');
          assert.equal(gitBlobSha1, '26b4e2aa643f7ef1f2c57001b81aff944c1b54af', 'Q10_RECAPTURE_ENGINE_GIT_DRIFT');
          console.log(JSON.stringify({ status: 'EXACT_ENGINE_BOUND', sha256, gitBlobSha1, expectedLogicalCases: 48 }));
          NODE
      - name: Verify the closed problem capture contract
        run: node --test tests/archive-m2-problem24-ui-contract.test.cjs
      - uses: browser-actions/setup-chrome@v1
        id: chrome
        with:
          chrome-version: stable
      - name: Install the pinned browser driver outside the checkout
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm install --prefix "$RUNNER_TEMP/m2-problem24-ui-browser" --no-save --package-lock=false --no-audit --no-fund playwright@1.62.1
      - name: Capture exact original problem scroll tiles
        env:
          ARCHIVE_M2_PROBLEM24_UI_EXPECTED_SHA: ${{ github.sha }}
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
          NODE_PATH: ${{ runner.temp }}/m2-problem24-ui-browser/node_modules
        run: node tools/check-m2-problem24-renderer-browser.cjs --output "$RUNNER_TEMP/m2-problem24-current-ui"
      - name: Preserve original problem evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m2-problem24-current-ui-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/m2-problem24-current-ui/
          if-no-files-found: warn
          retention-days: 14
