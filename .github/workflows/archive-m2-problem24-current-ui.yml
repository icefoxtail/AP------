name: Archive M2 Problem24 Current Student UI Evidence

on:
  push:
    branches: ['review-reference/m2-problem24-current-ui-20261116']
    paths:
      - '.github/workflows/archive-m2-problem24-current-ui.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  problem-ui:
    name: Exact 24 problems in desktop and mobile student UI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify the closed problem capture contract
        run: node --test tests/archive-m2-problem24-ui-contract.test.cjs
      - uses: browser-actions/setup-chrome@v1
        id: chrome
        with:
          chrome-version: stable
      - name: Install the pinned browser driver outside the checkout
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm install --prefix "$RUNNER_TEMP/m2-problem24-ui-browser" --no-save --package-lock=false --no-audit --no-fund playwright@1.62.1
      - name: Capture exact original problem scroll tiles
        env:
          ARCHIVE_M2_PROBLEM24_UI_EXPECTED_SHA: ${{ github.sha }}
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
          NODE_PATH: ${{ runner.temp }}/m2-problem24-ui-browser/node_modules
        run: node tools/check-m2-problem24-renderer-browser.cjs --output "$RUNNER_TEMP/m2-problem24-current-ui"
      - name: Preserve original problem evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m2-problem24-current-ui-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/m2-problem24-current-ui/
          if-no-files-found: warn
          retention-days: 14

