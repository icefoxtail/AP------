name: High school lab browser

on:
  pull_request:
    branches: [main]
    paths:
      - 'apmath/playground/next/labs/common-*'
      - 'apmath/playground/next/labs/common-*/**'
      - 'apmath/playground/next/labs/alg-*'
      - 'apmath/playground/next/labs/alg-*/**'
      - 'apmath/playground/next/labs/calc1-*'
      - 'apmath/playground/next/labs/geom-*'
      - 'apmath/playground/next/labs/prob-*'
      - 'apmath/playground/next/kit/**'
      - 'apmath/playground/next/tools/high-*'
      - 'apmath/playground/next/tools/scene-smoke.mjs'
      - '.github/workflows/high-lab-browser.yml'
  workflow_dispatch:
    inputs:
      only:
        description: 'Course or comma-separated lab IDs; blank selects all high-school labs'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: high-lab-browser-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: apmath/playground
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Select affected high-school labs
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
          REQUESTED: ${{ inputs.only }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import {execFileSync} from 'node:child_process';
          const paths=execFileSync('git',['diff','--name-only',process.env.BASE_SHA,'HEAD'],{encoding:'utf8'}).trim().split('\n');
          const ids=[...new Set(paths.map(p=>/^apmath\/playground\/next\/labs\/((?:common|alg|calc1|geom|prob)-[\w-]+)(?:\/|\.html$|\.js$)/.exec(p)?.[1]).filter(Boolean))];
          const all=paths.some(p=>/\/kit\//.test(p))||!ids.length;
          fs.appendFileSync(process.env.GITHUB_OUTPUT,`only=${process.env.REQUESTED||(all?'':ids.join(','))}\n`);
          execFileSync('git',['worktree','add','--detach',`${process.env.RUNNER_TEMP}/high-baseline`,process.env.BASE_SHA]);
          JS
      - name: Install Chromium runtime
        run: |
          npm install --prefix "$RUNNER_TEMP/high-browser" --no-save --package-lock=false --no-audit --no-fund playwright@1.56.1
          "$RUNNER_TEMP/high-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Observe fixed main baseline
        env:
          NODE_PATH: ${{ runner.temp }}/high-browser/node_modules
          ONLY: ${{ steps.scope.outputs.only }}
        run: node apmath/playground/next/tools/scene-smoke.mjs --high-school --root "$RUNNER_TEMP/high-baseline" --only "$ONLY" --out "$RUNNER_TEMP/high-evidence/before" --baseline-observe
      - name: Verify every candidate scene and step
        env:
          NODE_PATH: ${{ runner.temp }}/high-browser/node_modules
          ONLY: ${{ steps.scope.outputs.only }}
        run: node apmath/playground/next/tools/scene-smoke.mjs --high-school --root . --only "$ONLY" --out "$RUNNER_TEMP/high-evidence/after"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: high-labs-${{ github.run_id }}
          path: ${{ runner.temp }}/high-evidence/
          retention-days: 14
