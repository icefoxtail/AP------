name: M2 o20 CREATE Validation THANOS3 PR

on:
  push:
    branches:
      - validation/m2-o20-create-pr-thanos3-20261003-2120
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Calibration preflight
        run: node archive/tools/solution-calibration-gate.mjs --exam 'archive/exams/original/middle/m2/1final/26_신흥중_1학기_기말_중2_기출.js' --evidence 'archive/data/r2e-intake/m2/26_신흥중_1학기_기말_중2_기출.create.physical-evidence.thanos3.json' --stage CREATE --preflight --json
      - name: Canonical CREATE gate
        run: node archive/tools/review-evidence-gate.mjs --exam 'archive/exams/original/middle/m2/1final/26_신흥중_1학기_기말_중2_기출.js' --evidence 'archive/data/r2e-intake/m2/26_신흥중_1학기_기말_중2_기출.create.physical-evidence.thanos3.json' --stage CREATE --json
