name: R3 Six Source-Derivative Refresh (one-off)

on:
  push:
    branches:
      - work/gpt-r3-seven-source-recovery-20261017
    paths:
      - .github/workflows/archive-r3-refresher-oneoff.yml

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Refresh exact image inventory and runtime receipt only
        run: |
          node archive/tools/build-inline-image-inventory.mjs --write
          node archive/tools/meta-foundation/refresh-runtime-source-readiness.mjs --write
          node <<'NODE'
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('docs/reports/archive-inline-image-inventory-20260915.json','utf8'));
          const testPath = 'tests/archive-inline-image-inventory.test.js';
          let t = fs.readFileSync(testPath, 'utf8');
          for (const [key, expression] of [['total','generated.total'],['productionTotal','generated.productionTotal'],['testFixtureTotal','generated.testFixtureTotal'],['qImageAndInlineTotal','generated.qImageAndInlineTotal']]) {
            const pattern = new RegExp('assert\\.equal\\('+expression.replaceAll('.','\\.')+', \\d+\\);');
            if (!pattern.test(t)) throw Error('Missing assertion: '+key);
            t=t.replace(pattern,'assert.equal('+expression+', '+report[key]+');');
          }
          const oldExt = /assert\.deepEqual\(generated\.extensionCounts, \{ '[.]png': \d+, '[.]svg': \d+ \}\);/;
          if (!oldExt.test(t)) throw Error('Missing extension golden');
          t=t.replace(oldExt,"assert.deepEqual(generated.extensionCounts, { '.png': "+report.extensionCounts['.png']+", '.svg': "+report.extensionCounts['.svg']+" });");
          fs.writeFileSync(testPath,t);
          console.log(JSON.stringify({total:report.total,production:report.productionTotal,extension:report.extensionCounts,qImageAndInlineTotal:report.qImageAndInlineTotal,errors:report.validation},null,2));
          NODE
      - name: Targeted derived artifact tests
        run: |
          node --test tests/archive-inline-image-inventory.test.js
          node tests/meta-foundation-derivative-runtime.test.js
          git diff --check
      - name: Commit only refreshed snapshot/test and runtime receipt
        shell: bash
        run: |
          set -euo pipefail
          git add -- docs/reports/archive-inline-image-inventory-20260915.json tests/archive-inline-image-inventory.test.js archive/data/meta-foundation/runtime/runtime-bridge-receipt.json
          if git diff --cached --quiet; then echo "No derived changes"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(archive): refresh six-exam inline inventory and runtime receipt"
          git push origin HEAD:refs/heads/work/gpt-r3-seven-source-recovery-20261017
