name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refresh upstream main ref
        run: git fetch --no-tags origin main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Syntax check (node --check)
        shell: bash
        run: |
          set -euo pipefail
          fail=0
          while IFS= read -r f; do
            if ! node --check "$f" > /tmp/check.log 2>&1; then
              echo "SYNTAX ERROR: $f"
              cat /tmp/check.log
              fail=1
            fi
          done < <(git ls-files \
            'apmath/js/*.js' 'apmath/app.js' 'apmath/service-worker.js' \
            'apmath/worker-backup/worker/index.js' \
            'apmath/worker-backup/worker/helpers/*.js' \
            'apmath/worker-backup/worker/routes/*.js' \
            'workers/**/*.js' \
            'eie/js/**/*.js' \
            'archive/unit-past-exams-core.js' \
            'archive/unit-past-exams.js' \
            'archive/tools/build-question-index.mjs' \
            'shared/js/*.js' \
            'tools/run-tests.js')
          exit $fail

      - name: Verify Git-managed project skills
        run: node tools/skills/verify-skills.mjs --json

      - name: Run tests
        run: node tools/run-tests.js


  o60_create_gate:
    if: github.head_ref == 'archive-gate/o60-manual-20261002'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PR merge
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: o60 calibration preflight
        run: node archive/tools/solution-calibration-gate.mjs --exam 'archive/exams/original/middle/m3/2final/23_풍덕중_2학기_기말_중3_기출.js' --evidence 'archive/data/r2e-intake/m3/23_풍덕중_2학기_기말_중3_기출.create.meta-v2.physical-evidence.json' --stage CREATE --preflight
      - name: o60 CREATE evidence gate
        run: node archive/tools/review-evidence-gate.mjs --exam 'archive/exams/original/middle/m3/2final/23_풍덕중_2학기_기말_중3_기출.js' --evidence 'archive/data/r2e-intake/m3/23_풍덕중_2학기_기말_중3_기출.create.meta-v2.physical-evidence.json' --stage CREATE
