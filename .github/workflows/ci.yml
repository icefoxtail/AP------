name: CI

# Ordinary CI validates the fixed event snapshot. The single registration writer
# validates each derived candidate before push; Pages validates its exact registered SHA.
# Their completion events do not start another full CI run against moving main.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      base_sha:
        description: "Pre-transition main commit SHA for the footprint guard after an authorized history rewrite; keep this object reachable for the run."
        required: true
        type: string

# Keep each actual event's check names and verdict; newer events never cancel it.
concurrency:
  group: ${{ format('ci-{0}-{1}', github.event_name, github.run_id) }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      run: ${{ steps.plan.outputs.run }}
      checkout_ref: ${{ steps.plan.outputs.checkout_ref }}
      base_sha: ${{ steps.plan.outputs.base_sha }}
    steps:
      - name: Checkout the fixed event planner
        uses: actions/checkout@v4
        with:
          sparse-checkout: tools/ci
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Decide whether this event needs a CI run
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: node tools/ci/ci-tip-plan.mjs

  test:
    needs: plan
    if: needs.plan.outputs.run == 'true'
    runs-on: ubuntu-latest
    # Source PRs generate and verify their temporary projection, including one
    # bounded builder recovery, before running the unchanged full test scope.
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The exact event merge/source snapshot selected by plan.
          ref: ${{ needs.plan.outputs.checkout_ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Classify the fixed snapshot impact
        id: scope
        env:
          CI_CHECKOUT_SHA: ${{ needs.plan.outputs.checkout_ref }}
          CI_SCOPE_BASE_SHA: ${{ needs.plan.outputs.base_sha }}
        run: node tools/ci/archive-ci-scope.mjs --output "$RUNNER_TEMP/archive-ci-scope.json"

      - name: Install Worker test dependencies
        if: steps.scope.outputs.worker_dependencies == 'true'
        run: npm ci --prefix apmath/worker-backup/worker --no-audit --no-fund

      - name: Syntax check (node --check)
        if: steps.scope.outputs.mode == 'full'
        shell: bash
        run: |
          set -euo pipefail
          fail=0
          while IFS= read -r f; do
            if ! node --check "$f" > /tmp/check.log 2>&1; then
              echo "SYNTAX ERROR: $f"
              cat /tmp/check.log
              fail=1
            fi
          done < <(git ls-files \
            'apmath/js/*.js' 'apmath/app.js' 'apmath/service-worker.js' \
            'apmath/worker-backup/worker/index.js' \
            'apmath/worker-backup/worker/helpers/*.js' \
            'apmath/worker-backup/worker/routes/*.js' \
            'workers/**/*.js' \
            'eie/js/**/*.js' \
            'archive/unit-past-exams-core.js' \
            'archive/unit-past-exams.js' \
            'archive/tools/build-question-index.mjs' \
            'shared/js/*.js' \
            'tools/run-tests.js')
          exit $fail

      - name: Verify Git-managed project skills
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          # Validate the merge snapshot against the base carried by this PR event, not a main ref
          # that another PR can move while this job runs. GitHub separately checks mergeability
          # and branch protection at merge time. Local verify-skills defaults remain unchanged.
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            if [[ ! "$PR_BASE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
              echo "PR event has no exact base SHA; refusing an unbound skills check." >&2
              exit 2
            fi
            node tools/skills/verify-skills.mjs --json --upstream "$PR_BASE_SHA"
          else
            node tools/skills/verify-skills.mjs --json --upstream HEAD
          fi

      - name: Git footprint regression
        run: node --test tests/git-growth.test.mjs

      - name: Offline evidence authority and recovery regression
        if: steps.scope.outputs.mode == 'full'
        run: node --test tests/archive-cold-evidence.test.mjs tests/evidence-authority-v1.test.mjs tests/archive-analysis-recovery.test.mjs

      - name: Decide whether PR registration data proof is needed
        if: github.event_name == 'pull_request'
        id: registration_scope
        env:
          CI_SCOPE_FILE: ${{ runner.temp }}/archive-ci-scope.json
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { prRegistrationProofNeeded } from './tools/ci/archive-pr-registration-proof.mjs';
          const scope = JSON.parse(fs.readFileSync(process.env.CI_SCOPE_FILE, 'utf8'));
          const needed = prRegistrationProofNeeded(scope.changedFiles);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `needed=${needed}\n`);
          NODE

      - name: Prepare and verify PR registration data once
        if: github.event_name == 'pull_request' && steps.registration_scope.outputs.needed == 'true'
        id: registration_proof
        run: node tools/ci/archive-pr-registration-proof.mjs produce --proof-file "$RUNNER_TEMP/archive-pr-registration-proof/proof.json"

      - name: Prepare temporary main source registration projection
        if: github.event_name == 'push' && steps.scope.outputs.prepare_projection == 'true'
        run: node tools/ci/archive-pr-registration-prepare.mjs

      - name: Record META_V2 completeness diagnostics
        if: steps.registration_proof.outputs.registration_data == 'PASS'
        id: meta_v2_diagnostics
        continue-on-error: true
        run: |
          node tests/archive-meta-v2-materializer.test.mjs
          node tests/archive2-meta-v2-semantic-authority.test.cjs
          node archive/tools/meta-foundation/materialize-meta-v2-payloads.mjs --check

      - name: Set up Chrome for registration search diagnostics
        if: steps.registration_proof.outputs.registration_data == 'PASS'
        uses: browser-actions/setup-chrome@v1
        id: search_chrome
        with:
          chrome-version: stable

      - name: Install the registration search browser driver
        if: steps.registration_proof.outputs.registration_data == 'PASS'
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm install --no-save --package-lock=false playwright@1.62.1

      - name: Verify original exam visibility in the student search UI
        if: steps.registration_proof.outputs.registration_data == 'PASS'
        id: original_search_diagnostics
        continue-on-error: true
        env:
          CHROME_BIN: ${{ steps.search_chrome.outputs.chrome-path }}
        run: node tests/archive-original-search-exposure.browser.cjs

      - name: Record registration supplementation outcomes
        if: always() && steps.registration_proof.outputs.registration_data == 'PASS'
        env:
          META_OUTCOME: ${{ steps.meta_v2_diagnostics.outcome }}
          SEARCH_OUTCOME: ${{ steps.original_search_diagnostics.outcome }}
        run: |
          {
            echo "meta_v2_diagnostics=$META_OUTCOME"
            echo "original_search_diagnostics=$SEARCH_OUTCOME"
            echo "These diagnostics inspected this CI projection; they are advisory and outside the data proof."
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "$META_OUTCOME" != success || "$SEARCH_OUTCOME" != success ]]; then
            echo "::warning title=Archive supplementation diagnostics::See the actual metadata/search outcomes above. Required registration and direct original Chrome checks are unchanged."
          fi

      - name: Guard changed Git objects against footprint growth
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          MANUAL_BASE_SHA: ${{ github.event.inputs.base_sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base_ref="$PR_BASE_SHA"
          elif [[ "$EVENT_NAME" == "push" ]]; then
            base_ref="$BEFORE_SHA"
          elif [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
              echo "Manual CI footprint dispatch must target main." >&2
              exit 2
            fi
            base_ref="$MANUAL_BASE_SHA"
          else
            echo "Unsupported CI footprint event: $EVENT_NAME" >&2
            exit 2
          fi
          if [[ ! "$base_ref" =~ ^[0-9a-fA-F]{40}$ || "$base_ref" =~ ^0+$ ]]; then
            echo "CI footprint audit requires the exact nonzero event base SHA." >&2
            exit 2
          fi
          if ! git cat-file -e "$base_ref^{commit}" 2>/dev/null; then
            echo "Footprint baseline commit is unavailable in this checkout; refusing an incomplete audit." >&2
            exit 2
          fi
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            # HEAD is GitHub's test-merge commit: parent 1 is the base branch tip it was merged onto,
            # parent 2 the PR head. PR_BASE_SHA can be older than that tip (main moved after the PR
            # opened), and base..HEAD would then charge the PR for other people's commits. Audit only
            # what the merge adds on top of that tip. A non-merge HEAD keeps the event base.
            read -r -a commit_parents < <(git rev-list --parents -n 1 HEAD)
            if [[ "${#commit_parents[@]}" -eq 3 ]] && git cat-file -e "${commit_parents[1]}^{commit}" 2>/dev/null; then
              base_ref="${commit_parents[1]}"
            fi
          fi
          test -f tools/git-history-rewrite-policy.v1.json || { echo "Active Git history rewrite policy receipt is missing; refusing to skip ancestry protection." >&2; exit 2; }
          node tools/check-git-growth.mjs --base "$base_ref" --head HEAD

      - name: Run tests
        env:
          ARCHIVE_PR_REGISTRATION_PROOF: ${{ steps.registration_proof.outputs.proof_file }}
        run: node tools/run-tests.js --ci-scope "$RUNNER_TEMP/archive-ci-scope.json"
