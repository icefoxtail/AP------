name: GPT2 Connected Host Bridge Canary

on:
  pull_request:
    branches: [main]
    paths:
      - 'archive/tools/gpt2-connected-stdio-host.mjs'
      - 'archive/tools/gpt2-connected-stdio-host.test.mjs'
      - 'archive/tools/GPT2_CONNECTED_STDIO_HOST.md'
      - '.github/workflows/gpt2-connected-host-canary.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rpc-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax
        run: node --check archive/tools/gpt2-connected-stdio-host.mjs
      - name: Connector RPC unit tests (no real credentials)
        run: node --test archive/tools/gpt2-connected-stdio-host.test.mjs