name: M2 Closed Eight Current Renderer

on:
  push:
    branches:
      - 'ops/m2-closed8-current-renderer-26fc-20261117'

permissions:
  contents: read

concurrency:
  group: m2-closed8-current-ui-${{ github.sha }}
  cancel-in-progress: false

jobs:
  contract:
    name: Closed eight provenance and lossless transport contracts
    if: github.repository == 'icefoxtail/AP------' && github.event_name == 'push' && github.ref == 'refs/heads/ops/m2-closed8-current-renderer-26fc-20261117' && github.event.repository.fork == false && github.event.deleted == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /tools/check-reviewed-problem-renderer-browser.cjs
            /tools/capture-m1s2-problem-surface.cjs
            /tools/check-m1s2-problem-seven-browser.cjs
            /tools/check-m2s2-closed-eight-current-browser.cjs
            /tools/emit-protected9-ui-log-transport.cjs
            /tests/fixtures/archive-m2s2-closed-eight-current-ui.json
            /tests/m2s2-closed-eight-current-browser.test.cjs
            /tests/protected9-ui-log-transport.test.cjs
            /tests/protected-current-ui-log-transport.test.cjs
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify the exact closed push and checkout
        env:
          ARCHIVE_M2S2_CLOSED8_UI_EXPECTED_SHA: ${{ github.sha }}
        run: node -e "const cp=require('node:child_process');const C=require('./tools/check-m2s2-closed-eight-current-browser.cjs');C.checkoutEvidence(cp.execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim());"
      - name: Verify the new closed scope and unchanged transport profiles
        run: node --test tests/m2s2-closed-eight-current-browser.test.cjs tests/protected9-ui-log-transport.test.cjs tests/protected-current-ui-log-transport.test.cjs

  current-ui:
    name: Current closed eight problem surfaces
    needs: contract
    if: github.repository == 'icefoxtail/AP------' && github.event_name == 'push' && github.ref == 'refs/heads/ops/m2-closed8-current-renderer-26fc-20261117' && github.event.repository.fork == false && github.event.deleted == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /archive/*.js
            /archive/*.css
            /archive/engine.html
            /archive/css/
            /archive/js/
            /archive/vendor/
            /archive/data/svg-accessibility-index.js
            /archive/data/question_metadata.json
            /archive/data/question_identity_map.json
            /apmath/css/student-navigation.css
            /apmath/js/student-navigation.js
            /tools/check-reviewed-problem-renderer-browser.cjs
            /tools/check-m2s2-closed-eight-current-browser.cjs
            /tools/emit-protected9-ui-log-transport.cjs
            /tests/fixtures/archive-m2s2-closed-eight-current-ui.json
            /archive/exams/original/middle/m2/2mid/24_연향중_2학기_중간_중2_수학.js
            /archive/exams/original/middle/m2/2final/23_연향중_2학기_기말_중2_기출.js
            /archive/assets/images/24_연향중_2학기_중간_중2_수학/
            /archive/assets/images/23_연향중_2학기_기말_중2_기출/
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify the exact closed push and checkout
        env:
          ARCHIVE_M2S2_CLOSED8_UI_EXPECTED_SHA: ${{ github.sha }}
        run: node -e "const cp=require('node:child_process');const C=require('./tools/check-m2s2-closed-eight-current-browser.cjs');C.checkoutEvidence(cp.execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim());"
      - uses: browser-actions/setup-chrome@v1
        id: chrome
        with:
          chrome-version: stable
      - name: Install the isolated browser driver
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm install --prefix "$RUNNER_TEMP/m2-closed8-current-driver" --no-save --package-lock=false playwright@1.62.1
      - name: Capture sixteen logical views and every original selected problem tile
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
          ARCHIVE_M2S2_CLOSED8_UI_EXPECTED_SHA: ${{ github.sha }}
          NODE_PATH: ${{ runner.temp }}/m2-closed8-current-driver/node_modules
        run: node tools/check-m2s2-closed-eight-current-browser.cjs --output "$RUNNER_TEMP/closed8-current-ui"
      - name: Preserve exact technical JSON and all original problem tiles in log frames
        if: always()
        run: node tools/emit-protected9-ui-log-transport.cjs --root "$GITHUB_WORKSPACE" --output "$RUNNER_TEMP/closed8-current-ui" --profile closed8 --expected-head "${{ github.sha }}"
      - name: Preserve the original technical JSON and all scroll tiles as an artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m2-closed8-current-${{ github.sha }}
          path: ${{ runner.temp }}/closed8-current-ui/
          if-no-files-found: error
          retention-days: 14
