name: Archive Main Auto Metadata
# Single serialized main registration writer. Existing native producers keep their schemas and
# lane-specific policies; one verified transaction is committed, then its exact SHA is published.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - 'tools/ci/archive-registration-writer.mjs'
      - 'tools/ci/archive-registration-whitespace.mjs'
      - 'tools/ci/git-push-derived-with-retry.mjs'
      - 'tools/ci/archive-main-auto-meta-pass.sh'
      - 'tools/ci/reviewed-meta-register-pass.sh'
      - 'tools/ci/archive-four-slot-pass.sh'
      - 'tools/ci/archive-pages-registration-derive.sh'
      - 'tools/ci/*register*.paths'
      - 'tools/ci/archive-pages-registration.paths'
      - 'archive/tools/meta-foundation/auto-register-merged-source.mjs'
      - 'archive/tools/generated-meta/**'
      - 'archive/data/item-4slot/**'
      - 'docs/architecture/4slot/term-dictionary*.json'
      - 'archive/item-4slot.js'
      - 'tools/4slot/**'
      - 'tests/archive-registration-writer.test.mjs'
      - 'tests/archive-registration-whitespace.test.mjs'
      - 'tests/git-push-derived-with-retry.test.mjs'
      - 'tests/archive-single-writer-workflows.test.mjs'
      - 'tests/archive-main-merge-meta.test.mjs'
      - 'tests/item-4slot-runtime.test.cjs'
      - '.archive-meta-register/auto/config.json'
      - '.github/workflows/archive-main-auto-meta.yml'
      - '.github/workflows/archive-reviewed-exam-meta-register.yml'
      - '.github/workflows/archive-reviewed-apply.yml'
      - '.github/workflows/archive-pages-release.yml'
  workflow_dispatch:
  schedule:
    - cron: '43 * * * *'
permissions:
  contents: read
jobs:
  test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Automation fixtures run once in CI; this existing check retains the native read-only inventory.
      - run: bash -n tools/ci/archive-main-auto-meta-pass.sh tools/ci/reviewed-meta-register-pass.sh tools/ci/archive-four-slot-pass.sh tools/ci/archive-pages-registration-derive.sh
      - name: Real production inventory (no writes or mathematical review)
        run: |
          mkdir -p "${RUNNER_TEMP}/auto-meta-preview"
          node archive/tools/meta-foundation/auto-register-merged-source.mjs --report "${RUNNER_TEMP}/auto-meta-preview/semantic.json"
          node tools/4slot/build-4slot-runtime.cjs --report "${RUNNER_TEMP}/auto-meta-preview/4slot.json"
          git diff --exit-code HEAD --
      - name: Upload exact read-only inventory and validation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auto-meta-preview-${{ github.run_id }}
          path: ${{ runner.temp }}/auto-meta-preview/
          if-no-files-found: warn
          retention-days: 14
  register:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: write
      actions: write
    concurrency:
      # Retain the former reviewed/AutoMeta lock while retiring their other entrypoints.
      group: archive-reviewed-exam-meta-register-main
      cancel-in-progress: false
    steps:
      - name: Initialize runner evidence paths
        run: |
          printf 'WRITER_WORK_DIR=%s/archive-registration-writer\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare only changed native registration lanes in one transaction
        id: prepare
        timeout-minutes: 70
        run: node tools/ci/archive-registration-writer.mjs --work-dir "$WRITER_WORK_DIR"
      - name: Persist verified lanes, native cursors and receipts once with race-safe regeneration
        id: persist
        if: steps.prepare.outputs.safe_to_persist == 'true'
        timeout-minutes: 90
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          node tools/ci/git-push-derived-with-retry.mjs \
            --paths-file "$WRITER_WORK_DIR/commit.paths" \
            --message 'chore(archive): register main snapshot [skip ci]' \
            --regenerate 'node tools/ci/archive-registration-writer.mjs --work-dir "$WRITER_WORK_DIR"' \
            --verify-command 'node tools/check-git-growth.mjs --base "$DERIVED_BASE_SHA" --head "$DERIVED_HEAD_SHA"' \
            --reapply-check 'node tools/ci/archive-registration-writer.mjs --unrelated-range "$DERIVED_BASE_SHA" "$COMPETITOR_HEAD_SHA"' \
            --remote origin --branch main --max-attempts 3 \
            --summary-file "$GITHUB_STEP_SUMMARY" --label 'single Archive registration writer'
      - name: Bind the persisted snapshot before any publication handoff
        id: registered
        if: steps.persist.outcome == 'success'
        timeout-minutes: 5
        env:
          REGISTERED_MAIN_SHA: ${{ steps.persist.outputs.registered_sha }}
        run: |
          set -euo pipefail
          [[ "$REGISTERED_MAIN_SHA" =~ ^[a-f0-9]{40}$ ]]
          git checkout --detach "$REGISTERED_MAIN_SHA"
          [[ "$(git rev-parse HEAD)" == "$REGISTERED_MAIN_SHA" ]]
          node tools/ci/archive-registration-writer.mjs --check --work-dir "$WRITER_WORK_DIR/persisted"
          printf 'registered_main_sha=%s\n' "$REGISTERED_MAIN_SHA" >> "$GITHUB_STEP_SUMMARY"
      - name: Dispatch the exact registered snapshot through the single Pages entrypoint
        if: steps.registered.outputs.publishable == 'true' && (steps.persist.outputs.result == 'PUSHED' || github.event_name != 'schedule')
        env:
          GH_TOKEN: ${{ github.token }}
          REGISTERED_MAIN_SHA: ${{ steps.persist.outputs.registered_sha }}
        run: |
          [[ "$REGISTERED_MAIN_SHA" =~ ^[a-f0-9]{40}$ ]]
          gh workflow run archive-pages-release.yml --ref main -f registered_main_sha="$REGISTERED_MAIN_SHA"
      - name: Report incomplete required registration without publishing
        if: steps.persist.outcome == 'success' && steps.registered.outputs.publishable != 'true'
        run: |
          echo '::error::Required registration remains incomplete; verified independent lanes were persisted, and the existing student site remains live. See per-lane evidence; hourly reconciliation resumes the remaining inputs.'
          exit 1
      - name: Upload registration evidence including isolated failures and no-op decisions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: archive-main-registration-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/archive-registration-writer/
          if-no-files-found: warn
          retention-days: 30
