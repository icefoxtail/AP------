name: Middle public source observation

# Read-only observation of the public student deployment. No deploy, gate or product changes.
on:
  push:
    branches: ['audit/pr1568-capture-061b9d72']
    paths: ['.github/workflows/middle-tablet-screenshot-review.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: middle-public-source-observation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  public-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 'b45e9ac5b48e3a4c55fdce73fac44828cfe14953'
          sparse-checkout: apmath/playground
          persist-credentials: false
      - name: Read exact public release receipt and priority source bytes
        env:
          EXPECTED_SOURCE_SHA: 'b45e9ac5b48e3a4c55fdce73fac44828cfe14953'
        run: |
          python3 - <<'PY'
          import hashlib, json, os, subprocess, time, urllib.request
          from datetime import datetime, timezone
          from pathlib import Path
          base = "https://icefoxtail.github.io/AP------/"
          expected = os.environ["EXPECTED_SOURCE_SHA"]
          assert len(expected) == 40 and all(c in "0123456789abcdef" for c in expected)
          assert subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip() == expected
          out = {"schemaVersion":1,"observedAt":datetime.now(timezone.utc).isoformat(),
                 "expectedSourceSHA":expected,"sourceRun":os.environ["GITHUB_RUN_ID"],
                 "observationOnly":True,"browserInteractionStatus":"NOT_RUN","files":[]}
          paths = ["_archive-release.json",
                   "apmath/playground/next/index.html",
                   "apmath/playground/next/labs/g7-circle-sector.html",
                   "apmath/playground/next/kit/apl.css",
                   "apmath/playground/next/kit/apl-shell.js",
                   "apmath/playground/next/labs/g7-circle-sector/f01.js",
                   "apmath/playground/next/labs/g7-circle-sector/f03.js"]
          for path in paths:
              item = {"path":path}
              try:
                  url = base + path + "?pr1568_source_check=" + str(int(time.time()))
                  req = urllib.request.Request(url, headers={"User-Agent":"PR1568-public-source-observation","Cache-Control":"no-cache"})
                  with urllib.request.urlopen(req, timeout=45) as response:
                      assert response.url.startswith(base), "Unexpected redirect"
                      data = response.read(2*1024*1024+1)
                      assert len(data) <= 2*1024*1024, "Unexpected response size"
                      item.update({"httpStatus":response.status,"bytes":len(data),"sha256":hashlib.sha256(data).hexdigest()})
                  if path == "_archive-release.json":
                      receipt = json.loads(data.decode("utf-8-sig"))
                      item["receipt"] = receipt
                      item["kind"] = "public_release_receipt"
                  else:
                      local = Path(path)
                      assert local.is_file(), "Expected source file missing from checked-out merge"
                      expected_data = local.read_bytes()
                      item["expectedBytes"] = len(expected_data)
                      item["expectedSHA256"] = hashlib.sha256(expected_data).hexdigest()
                      item["matchesExpectedSource"] = data == expected_data
              except Exception as e:
                  item["error"] = type(e).__name__ + ": " + str(e)
              out["files"].append(item)
          out["allComparedAssetsMatch"] = all(x.get("matchesExpectedSource") is True for x in out["files"][1:])
          target = Path(os.environ["RUNNER_TEMP"]) / "middle-public-observation"
          target.mkdir()
          report = json.dumps(out, ensure_ascii=False, sort_keys=True, indent=2) + "\n"
          (target / "public-source-observation.json").write_text(report, encoding="utf-8")
          print("PUBLIC_SOURCE_OBSERVATION " + json.dumps(out, ensure_ascii=False, sort_keys=True))
          print("PUBLIC_SOURCE_REPORT_SHA256 " + hashlib.sha256(report.encode("utf-8")).hexdigest())
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: middle-public-observation-${{ github.run_id }}
          path: ${{ runner.temp }}/middle-public-observation/
          retention-days: 30
