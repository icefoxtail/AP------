name: Archive2 save round trip

# The teacher's "save a paper" job, end to end: the real screen script (archive/archive2-workspace.js, in a vm) builds a paper with
# generate() and saves it with savePapers() against the real Worker code (apmath/worker-backup/worker, bundled and run in
# Miniflare with a local D1). Then it reads the paper back, saves it again, opens it as a revision, and assigns it to a class.
# A separate job on purpose: when this goes red it means "a teacher cannot save a paper", and it must not be lost among the
# other red checks of the full `test` job. It is NOT listed in tools/run-tests.js (no double run): this file is its one place.
# The second step (tests/archive-saved-papers-many-images.test.mjs, about 20 s) saves image-heavy 20- and 50-question papers and a paper with
# one unreadable picture against the same Worker code: "a paper with many pictures cannot be saved" and "one picture blocks the whole save" land here.
#
# PRs test the checkout's sources immediately. On main, the registration writer must finish first:
# a push can contain new meta whose registered package is written in a later bot commit, and checking
# that pre-registration push with --package-only produces a false save failure. Keep the strict check
# but run it after the registration workflow. No production request is made.

on:
  workflow_run:
    workflows: ['Archive Main Auto Metadata']
    types: [completed]
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - 'archive/archive2-*.js'
      - 'archive/workspace.html'
      - 'archive/data/**'
      - 'archive/problem-bank-*.js'
      - 'archive/meta-foundation-runtime.js'
      - 'archive/mixer-selector.js'
      - 'archive/rpm-middle-toc.js'
      - 'archive/unit-past-exams-core.js'
      - 'apmath/worker-backup/**'
      - 'tests/archive2-save-roundtrip.e2e.mjs'
      - 'tests/archive-saved-papers-many-images.test.mjs'
      - 'tests/helpers/archive2-save-roundtrip-harness.mjs'
      - 'tests/helpers/archive2-scope-harness.cjs'
      - '.github/workflows/archive2-save-roundtrip.yml'
  workflow_dispatch:

# A newer PR commit cancels the older PR run. Registered-main runs also keep only the newest
# verification so a burst of registration completions cannot consume many runners.
# Manual runs keep one group per run and are never cancelled.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('archive2-save-roundtrip-pr-{0}', github.event.pull_request.number) || github.event_name == 'push' && format('archive2-save-roundtrip-push-{0}', github.ref) || format('archive2-save-roundtrip-{0}-{1}', github.event_name, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

permissions:
  contents: read

jobs:
  scope:
    name: Select save-sensitive registered snapshot
    runs-on: ubuntu-latest
    outputs:
      run_save: ${{ steps.select.outputs.run_save }}
    steps:
      - name: Check the triggering commit for save-sensitive files
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          SOURCE_EVENT: ${{ github.event.workflow_run.event }}
          SOURCE_RESULT: ${{ github.event.workflow_run.conclusion }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" != workflow_run ]]; then
            echo 'run_save=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$SOURCE_EVENT" != push || "$SOURCE_RESULT" != success ]]; then
            echo 'run_save=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          paths="$(gh api "repos/$GITHUB_REPOSITORY/commits/$SOURCE_SHA?per_page=300" --jq '.files[].filename')"
          matched=false
          count=0
          while IFS= read -r changed; do
            [[ -z "$changed" ]] && continue
            count=$((count + 1))
            case "$changed" in
              archive/archive2-*.js|archive/workspace.html|archive/data/*|archive/problem-bank-*.js|\
              archive/tools/build-archive2-catalog.mjs|archive/tools/materialize-archive-package-shards.mjs|\
              archive/tools/meta-foundation/question-metadata-format.mjs|\
              archive/meta-foundation-runtime.js|archive/mixer-selector.js|archive/rpm-middle-toc.js|\
              archive/unit-past-exams-core.js|apmath/worker-backup/*|\
              tests/archive2-save-roundtrip.e2e.mjs|tests/archive-saved-papers-many-images.test.mjs|\
              tests/helpers/archive2-save-roundtrip-harness.mjs|tests/helpers/archive2-scope-harness.cjs|\
              .github/workflows/archive2-save-roundtrip.yml)
                matched=true
                ;;
            esac
          done <<< "$paths"
          # GitHub may truncate a very large commit's file list at 300. Run the check rather than miss a change.
          if (( count >= 300 )); then matched=true; fi
          echo "run_save=$matched" >> "$GITHUB_OUTPUT"
          echo "Save-sensitive change=$matched for triggering commit $SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"

  save-round-trip:
    name: Archive2 save round trip
    needs: scope
    if: needs.scope.outputs.run_save == 'true'
    concurrency:
      group: ${{ github.event_name == 'workflow_run' && 'archive2-save-roundtrip-registered-main' || format('archive2-save-roundtrip-job-{0}', github.run_id) }}
      cancel-in-progress: ${{ github.event_name == 'workflow_run' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, like the other Archive2 jobs: the package builder verifies source-quality holds against pinned commits
          # (a shallow checkout fails with ORIGINAL_SOURCE_ERROR_HOLD:IMMUTABLE_GIT_INPUT_UNAVAILABLE).
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Same preparation as the Worker tests in the full CI job: miniflare and esbuild come from the Worker package.
      - name: Assemble question metadata (git holds its shards)
        run: if [ -d archive/data/question-metadata/v1 ]; then node archive/tools/meta-foundation/question-metadata-format.mjs assemble; fi
      - name: Install Worker test dependencies
        run: npm ci --prefix apmath/worker-backup/worker --no-audit --no-fund
      # The mixed verification shards are build output (gitignored); the Worker reads them to verify every saved question.
      # A pull request carries only sources (original exam JS, meta): the registered generated files are written by the registrar
      # after the merge. So on a pull request the checkout's own build generates them (temporary, never committed) and the same
      # computation as --package-only runs inside that build (a broken exam JS still stops it). main and manual runs keep
      # --package-only, which also requires the registered files to match their inputs.
      - name: Generate the ignored package shards (pull request, build from sources)
        if: github.event_name == 'pull_request'
        run: node archive/tools/build-archive2-catalog.mjs
      - name: Generate the ignored package shards (registered files must match)
        if: github.event_name != 'pull_request'
        run: node archive/tools/build-archive2-catalog.mjs --package-only
      - name: Save a paper, read it back, save again, open as revision, assign
        run: node --test tests/archive2-save-roundtrip.e2e.mjs
      - name: Save image-heavy papers (20 and 50 questions) and a paper with one unreadable picture
        run: node --test tests/archive-saved-papers-many-images.test.mjs
