name: Observe E006 twelve retained issued Native and producer plan

on:
  push:
    branches:
      - ops/middle-e006-retained-issued-probe-26fc-20261117

permissions:
  contents: read

concurrency:
  group: middle-e006-retained-issued-probe-26fc-20261117
  cancel-in-progress: false

jobs:
  observe-current-main:
    if: github.repository == 'icefoxtail/AP------' && github.event_name == 'push' && github.ref == 'refs/heads/ops/middle-e006-retained-issued-probe-26fc-20261117'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Read the immutable probe code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: probe-code
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /tools/ci/observe-e006-retained-issued-native-plan.cjs
          persist-credentials: false
      - name: Read the exact current-main snapshot without regenerating data
        uses: actions/checkout@v4
        with:
          ref: 90ba4c2c3ce042b0bee4d68588ce83aa37e3f95f
          path: actual-main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Observe twelve current Native and producer results without applying
        run: node "$GITHUB_WORKSPACE/probe-code/tools/ci/observe-e006-retained-issued-native-plan.cjs" --root "$GITHUB_WORKSPACE/actual-main" --output "$RUNNER_TEMP/middle-e006-retained-issued-native-plan.json"
      - name: Preserve the metadata-only observation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: middle-e006-retained-issued-native-plan
          path: ${{ runner.temp }}/middle-e006-retained-issued-native-plan.json
          if-no-files-found: warn
          retention-days: 14
