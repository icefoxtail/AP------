name: Repack initial audit evidence
on:
  push:
    branches: ['qa/apmath-middle-evidence-repack-20261109']
permissions:
  contents: read
  actions: read
jobs:
  repack:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download existing immutable evidence archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --location --silent --show-error --retry 2 --header "Authorization: Bearer $GH_TOKEN" --header "Accept: application/vnd.github+json" https://api.github.com/repos/icefoxtail/AP------/actions/artifacts/13671589451/zip --output "$RUNNER_TEMP/original.zip"
          echo "1a6dde2653f1d44dbf7b861675487947f1a4f8c5037f0f427fc86d27e1824931  $RUNNER_TEMP/original.zip" | sha256sum --check
          split -b 200M --numeric-suffixes=1 --suffix-length=2 "$RUNNER_TEMP/original.zip" "$RUNNER_TEMP/circle-part-"
      - uses: actions/upload-artifact@v4
        with:
          name: circle-source-42612331078-part-01
          path: ${{ runner.temp }}/circle-part-01
          retention-days: 14
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: circle-source-42612331078-part-02
          path: ${{ runner.temp }}/circle-part-02
          retention-days: 14
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: circle-source-42612331078-part-03
          path: ${{ runner.temp }}/circle-part-03
          retention-days: 14
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: circle-source-42612331078-part-04
          path: ${{ runner.temp }}/circle-part-04
          retention-days: 14
          compression-level: 0
