name: M2 Closed Eight Existing Authority Gate
on:
  push:
    branches:
      - ops/m2-closed8-current-native-26fc-20261117
permissions:
  contents: read
concurrency:
  group: m2-closed8-current-native-26fc-20261117
  cancel-in-progress: false
jobs:
  closed8-existing-authority:
    if: github.repository == 'icefoxtail/AP------' && github.ref == 'refs/heads/ops/m2-closed8-current-native-26fc-20261117'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Original Native eight, current source47, Consumer and refusal checks
        env:
          ARCHIVE_M2_CLOSED8_GATE_EXPECTED_SHA: ${{ github.sha }}
        run: |
          node tools/4slot/check-m2-closed8-current-ui-scoped.cjs --root "$GITHUB_WORKSPACE" --output "$RUNNER_TEMP/m2-closed8-source47/scoped-result.json"
      - name: Preserve bounded scoped result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m2-closed8-source47-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/m2-closed8-source47/scoped-result.json
          if-no-files-found: error
          retention-days: 30
