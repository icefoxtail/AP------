name: Archive Progress Review Installer (isolated)
on:
  push:
    branches: [review/archive-progress-live-20261011]
    paths: [.observer-review/archive-progress-source.zip]
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
      - name: Apply checked ZIP to observer files only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/observer-src"
          unzip -q .observer-review/archive-progress-source.zip -d "$RUNNER_TEMP/observer-src"
          src="$RUNNER_TEMP/observer-src/archive_progress_v1"
          paths=(
            .github/workflows/archive-progress-observer.yml
            .github/scripts/archive-progress-evidence.mjs
            .github/scripts/archive-progress-site-snapshot.py
            archive/tools/archive-progress-core.mjs
            archive/tools/archive-progress-collector.mjs
            archive/tools/archive-progress-github-proof.mjs
            archive/tools/archive-progress-content-proof.mjs
            archive/tools/archive-progress-observer.mjs
            archive/tools/archive-progress-retry.mjs
            archive/progress.html
            archive/progress.js
            tests/archive-progress-cache-targets.test.mjs
            tests/archive-progress-observer.test.mjs
            tests/archive-progress-realpaths.test.mjs
            tests/archive-progress-recovery.test.mjs
            tests/b15-actual-diagnostic.test.mjs
            tests/browser-smoke.py
          )
          for f in "${paths[@]}"; do
            test -f "$src/$f"
            mkdir -p "$(dirname "$f")"
            cp "$src/$f" "$f"
          done
          git add -- "${paths[@]}"
          git diff --cached --name-only
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test(observer): install reviewed progress code on isolated branch"
          git push origin HEAD:refs/heads/review/archive-progress-live-20261011
