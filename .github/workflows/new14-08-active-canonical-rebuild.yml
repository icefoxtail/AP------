name: NEW14 08 Canonical Compile and Target Quality
on:
  push:
    branches: [new14-08-active-canonical-final-20261020]
permissions:
  contents: write
jobs:
  scoped-canonical:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regenerate and verify official Meta Foundation compiled artifacts
        run: |
          node archive/tools/meta-foundation/compile-meta-foundation.mjs --write
          node archive/tools/meta-foundation/compile-meta-foundation.mjs --check
      - name: Validate 21 original item metadata against CURRENT compiled authorities
        run: |
          node <<'NODE'
          const fs=require('fs'),vm=require('vm'),cp=require('child_process');
          const path='archive/exams/original/high/h2/1mid/21_효천고_1학기_중간_고2_수학I.js';
          const load=s=>{const ctx={window:{}};vm.createContext(ctx);vm.runInContext(s,ctx,{timeout:5000});return ctx.window.questionBank;};
          const q=load(fs.readFileSync(path,'utf8'));
          const frozen=load(cp.execFileSync('git',['show','d9a559cd9f8466744c1477aefa940200f50f33c4:'+path],{encoding:'utf8'}));
          const ta=JSON.parse(fs.readFileSync('archive/data/meta-foundation/compiled/taxonomy_registry.json'));
          const bi=JSON.parse(fs.readFileSync('archive/data/meta-foundation/compiled/curriculum_bindings.json'));
          const co=JSON.parse(fs.readFileSync('archive/data/meta-foundation/compiled/concept_registry.json'));
          const cd=JSON.parse(fs.readFileSync('archive/data/meta-foundation/compiled/condition_registry.json'));
          const pt=new Set(ta.problemTypes.map(x=>x.problemTypeKey)),tpl=new Map(ta.templates.map(x=>[x.templateKey,x])),cc=new Set(co.concepts.map(x=>x.conceptKey)),conds=new Set(cd.conditions.map(x=>x.conditionKey));
          const binding=new Set(bi.bindings.map(x=>[x.curriculum,x.standardUnitKey,x.subUnitKey,x.problemTypeKey].join(':')));
          if(q.length!==21||frozen.length!==21)throw Error('COUNT_NOT_21');
          let reused=0;
          for(let i=0;i<21;i++){
            const x=q[i],f=frozen[i],fields=['id','content','choices','answer','solution','image','solutionImage','score','sourceMode'];
            for(const key of fields)if(JSON.stringify(x[key])!==JSON.stringify(f[key]))throw Error('STUDENT_FIELD_CHANGED:q'+x.id+':'+key);
            if(!pt.has(x.problemTypeKey)||tpl.get(x.templateKey)?.parentProblemTypeKey!==x.problemTypeKey)throw Error('ACTIVE_PT_TPL_INVALID:q'+x.id);
            if(!binding.has([x.curriculum,x.standardUnitKey,x.subUnitKey,x.problemTypeKey].join(':')))throw Error('EXACT_BINDING_MISSING:q'+x.id);
            for(const key of x.crossConceptKeys||[])if(!cc.has(key))throw Error('CC_NOT_ACTIVE:q'+x.id+':'+key);
            for(const key of x.conditionKeys||[])if(!conds.has(key))throw Error('COND_NOT_ACTIVE:q'+x.id+':'+key);
            if(x.id===5&&x.problemTypeKey==='PT_EXPONENTIAL_INEQUALITY')throw Error('Q05_WRONG_PT');
          }
          console.log(JSON.stringify({status:'PASS',target:'NEW14_08',qids:21,ptTplAndExactBinding:'21/21',sourceStudentParity:'21/21',q05WrongPT:false}));
          NODE
      - name: Persist generated canonical parity under scoped branch
        run: |
          git config user.name "Archive scoped canonical compiler"
          git config user.email "actions@users.noreply.github.com"
          git add archive/data/meta-foundation/compiled/ archive/data/meta-foundation/canonical/registry_index.json
          if ! git diff --cached --quiet; then
            git commit -m "build(new14-08): regenerate exact ACTIVE registry and canonical source digests"
            git push origin HEAD:refs/heads/new14-08-active-canonical-final-20261020
          fi
