name: Archive Pages Release

# Publish one exact writer-verified main snapshot. No shared-data generation or Git writes.
# The existing scheduled recovery remains; stale registration is explicitly deferred.
# Identical student package and external asset bytes are a content NO_OP; a changed checker does
# not receive a reused PASS or new receipt. Unknown live versions only allow the fixed main tip. Required outcomes reach
# the gate even with continue-on-error; a failed build never replaces the previous student site.

on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:
    inputs:
      registered_main_sha:
        description: 'Exact verified registration commit. Empty uses the fixed event SHA for recovery.'
        required: false
        default: ''
        type: string

permissions:
  contents: read
  deployments: read
  actions: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify the student release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      ready: ${{ steps.registered.outputs.publishable }}
      needed: ${{ steps.identity.outputs.needed || 'true' }}
      registered_main_sha: ${{ steps.context.outputs.registered_main_sha }}
    defaults:
      run:
        shell: bash
    env:
      REGISTERED_MAIN_SHA: ${{ inputs.registered_main_sha || github.sha }}
    steps:
      - name: Initialize runner evidence paths
        run: |
          printf 'RELEASE_EVIDENCE_DIR=%s/archive-pages-release-evidence\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.registered_main_sha || github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Bind release evidence to the exact main snapshot
        id: context
        timeout-minutes: 2
        run: |
          set -euo pipefail
          [[ "$REGISTERED_MAIN_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$(git rev-parse HEAD)" == "$REGISTERED_MAIN_SHA" ]]
          git merge-base --is-ancestor "$REGISTERED_MAIN_SHA" origin/main
          mkdir -p "$RELEASE_EVIDENCE_DIR"
          {
            printf 'source_sha=%s\n' "$REGISTERED_MAIN_SHA"
            printf 'event=%s\n' "$GITHUB_EVENT_NAME"
            printf 'run_id=%s\n' "$GITHUB_RUN_ID"
            printf 'run_attempt=%s\n' "$GITHUB_RUN_ATTEMPT"
            printf 'workflow_ref=%s\n' "$GITHUB_WORKFLOW_REF"
            printf 'workflow_run_url=%s/%s/actions/runs/%s\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
          } > "$RELEASE_EVIDENCE_DIR/context.txt"
          printf 'registered_main_sha=%s\n' "$REGISTERED_MAIN_SHA" >> "$GITHUB_OUTPUT"

      - name: Check registered inputs, outputs and validator versions without writes
        id: registered
        timeout-minutes: 5
        env:
          REQUESTED_REGISTERED_SHA: ${{ inputs.registered_main_sha }}
        run: |
          set -euo pipefail
          node tools/ci/archive-registration-writer.mjs --check --work-dir "$RELEASE_EVIDENCE_DIR/registration-check"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const report = JSON.parse(fs.readFileSync(`${process.env.RELEASE_EVIDENCE_DIR}/registration-check/report.json`, 'utf8'));
          if (!report.publishable) {
            const message = `DEFERRED_REGISTRATION: ${report.status}; the hourly writer must finish before publication.`;
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, message + '\n');
            if (process.env.REQUESTED_REGISTERED_SHA) throw new Error(message);
          }
          NODE

      - name: Materialize only untracked package shards from the registered catalog
        id: package_shards
        if: steps.registered.outputs.publishable == 'true'
        timeout-minutes: 5
        run: node archive/tools/build-archive2-catalog.mjs --package-only

      - name: Compare effective package and external dependency content with the live receipt
        id: identity
        if: steps.registered.outputs.publishable == 'true'
        timeout-minutes: 5
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node tools/ci/archive-pages-deploy-needed.mjs \
            --registered-main-sha "$REGISTERED_MAIN_SHA" \
            --identity-file "$RELEASE_EVIDENCE_DIR/release-identity.json"

      - name: Record the content no-op or superseded snapshot
        if: steps.registered.outputs.publishable == 'true' && steps.identity.outputs.needed == 'false'
        env:
          NO_OP_REASON: ${{ steps.identity.outputs.reason }}
        run: printf '%s\n' "$NO_OP_REASON" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify the explicit Pages package manifest and safeguards
        if: steps.registered.outputs.publishable == 'true' && steps.identity.outputs.needed != 'false'
        timeout-minutes: 5
        run: node --test tests/archive-pages-site-package.test.mjs

      - name: Verify student source visuals and exam selection contracts
        if: steps.registered.outputs.publishable == 'true' && steps.identity.outputs.needed != 'false' && steps.identity.outputs.archive_needed != 'false'
        id: selection_tests
        timeout-minutes: 10
        continue-on-error: true
        env:
          RELEASE_EVIDENCE_DIR: ${{ runner.temp }}/archive-pages-release-evidence
        run: node --test tests/generated-source-svg-namespace.test.cjs tests/generated-main-source-consumer-sync.test.cjs tests/archive2-generated-bank-registration.test.js tests/archive2-generated-mock-selection.test.cjs 2>&1 | tee "$RELEASE_EVIDENCE_DIR/selection-tests.log"

      - uses: browser-actions/setup-chrome@v1
        if: steps.registered.outputs.publishable == 'true' && steps.identity.outputs.needed != 'false'
        id: chrome
        with:
          chrome-version: stable

      - name: Verify actual generated-bank lookup, preview, and print
        if: steps.registered.outputs.publishable == 'true' && steps.identity.outputs.needed != 'false' && steps.identity.outputs.archive_needed != 'false'
        id: chrome_generated_bank
        timeout-minutes: 8
        continue-on-error: true
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
          RELEASE_EVIDENCE_DIR: ${{ runner.temp }}/archive-pages-release-evidence
        run: node tools/check-generated-bank-browser.cjs 2>&1 | tee "$RELEASE_EVIDENCE_DIR/generated-bank-chrome.log"

      - name: Verify main-resident Geumdang source output
        if: steps.registered.outputs.publishable == 'true' && steps.identity.outputs.needed != 'false' && steps.identity.outputs.archive_needed != 'false'
        id: chrome_geumdang
        timeout-minutes: 8
        continue-on-error: true
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
          RELEASE_EVIDENCE_DIR: ${{ runner.temp }}/archive-pages-release-evidence
        run: node tools/check-geumdang-qid9-browser.cjs 2>&1 | tee "$RELEASE_EVIDENCE_DIR/geumdang-source-chrome.log"

      - name: Verify imported QID9 student lookup selection exam answer and solution in actual Chrome
        if: steps.registered.outputs.publishable == 'true' && steps.identity.outputs.needed != 'false' && steps.identity.outputs.archive_needed != 'false'
        id: chrome_qid9_student
        timeout-minutes: 10
        continue-on-error: true
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
          RELEASE_EVIDENCE_DIR: ${{ runner.temp }}/archive-pages-release-evidence
        run: |
          node tools/check-qid9-main-source-browser.cjs 2>&1 | tee "$RELEASE_EVIDENCE_DIR/qid9-student-chrome.log"
          QID9_SOURCE_ROOT_INDEX=1 QID9_SAMPLE_QID=17 node tools/check-qid9-main-source-browser.cjs 2>&1 | tee "$RELEASE_EVIDENCE_DIR/qid9-jeil-student-chrome.log"
          QID9_SOURCE_ROOT_INDEX=2 QID9_SAMPLE_QID=23 node tools/check-qid9-main-source-browser.cjs 2>&1 | tee "$RELEASE_EVIDENCE_DIR/qid9-hyochen-student-chrome.log"

      - name: Verify complete generated mock selection, preview, print, answer, and solution flow
        if: steps.registered.outputs.publishable == 'true' && steps.identity.outputs.needed != 'false' && steps.identity.outputs.archive_needed != 'false'
        id: mock_qa
        timeout-minutes: 5
        continue-on-error: true
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
          RELEASE_EVIDENCE_DIR: ${{ runner.temp }}/archive-pages-release-evidence
        run: node tools/check-generated-mock-qa.cjs --out-dir "$RELEASE_EVIDENCE_DIR/mock-qa" 2>&1 | tee "$RELEASE_EVIDENCE_DIR/generated-mock-qa.log"

      - name: Verify Archive 2.0 runtime contract
        if: steps.registered.outputs.publishable == 'true' && steps.identity.outputs.needed != 'false' && steps.identity.outputs.archive_needed != 'false'
        id: archive2_runtime
        timeout-minutes: 12
        continue-on-error: true
        env:
          RELEASE_EVIDENCE_DIR: ${{ runner.temp }}/archive-pages-release-evidence
        run: node tools/check-archive2-runtime.cjs --registered 2>&1 | tee "$RELEASE_EVIDENCE_DIR/archive2-runtime.log"

      # The builder prints the largest directories/files and the remaining headroom below the fixed 1,000,000,000-byte
      # Pages limit, and emits a ::warning annotation (never a failure) when less than 50 MB remain. Size reductions
      # (compact mixed verification rows, whitespace-only JSON compaction, digest-verified inputs that no page fetches)
      # are declared in tools/archive-pages-release-manifest.json; maxBytes is never raised.

      - name: Build the explicit student Pages file set
        if: steps.registered.outputs.publishable == 'true' && steps.identity.outputs.needed != 'false'
        id: pages_build
        timeout-minutes: 10
        env:
          RELEASE_EVIDENCE_DIR: ${{ runner.temp }}/archive-pages-release-evidence
        run: |
          set -euo pipefail
          node tools/build-archive-pages-site.mjs \
            --root "$GITHUB_WORKSPACE" \
            --output "$GITHUB_WORKSPACE/_site" \
            --report "$RELEASE_EVIDENCE_DIR/pages-site-package.json" \
            2>&1 | tee "$RELEASE_EVIDENCE_DIR/pages-site-package-build.log"

      - name: Verify the staged Pages frontend and archive output in real Chrome
        if: steps.registered.outputs.publishable == 'true' && steps.identity.outputs.needed != 'false'
        id: staged_site_chrome
        timeout-minutes: 12
        continue-on-error: true
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
          ARCHIVE_PAGES_SITE_ROOT: ${{ github.workspace }}/_site
          ARCHIVE_PAGES_BASE_PATH: /AP------/
          RELEASE_EVIDENCE_DIR: ${{ runner.temp }}/archive-pages-release-evidence
        run: |
          set -euo pipefail
          node tools/check-archive-pages-site-browser.cjs \
            --site-root "$ARCHIVE_PAGES_SITE_ROOT" \
            --base-path "$ARCHIVE_PAGES_BASE_PATH" \
            2>&1 | tee "$RELEASE_EVIDENCE_DIR/pages-site-browser-smoke.log"

      - name: Wait for the APMS Worker deploy when this release changes Worker-bundled files
        if: steps.registered.outputs.publishable == 'true' && steps.identity.outputs.needed != 'false'
        id: worker_order
        timeout-minutes: 15
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_EVIDENCE_DIR: ${{ runner.temp }}/archive-pages-release-evidence
        run: |
          node tools/ci/apms-worker-deploy-gate.mjs \
            --timeout-minutes 14 --interval-seconds 20 \
            --evidence-file "$RELEASE_EVIDENCE_DIR/context.txt" --summary-file "$GITHUB_STEP_SUMMARY" \
            2>&1 | tee "$RELEASE_EVIDENCE_DIR/worker-order.log"

      - name: Wait for the exact R2 image bytes in this registered release
        if: steps.registered.outputs.publishable == 'true' && steps.identity.outputs.needed != 'false'
        id: image_order
        timeout-minutes: 15
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_EVIDENCE_DIR: ${{ runner.temp }}/archive-pages-release-evidence
        run: |
          node tools/ci/archive-pages-image-r2-gate.mjs \
            --timeout-minutes 14 --interval-seconds 30 \
            --evidence-file "$RELEASE_EVIDENCE_DIR/context.txt" --summary-file "$GITHUB_STEP_SUMMARY" \
            2>&1 | tee "$RELEASE_EVIDENCE_DIR/image-order.log"

      - name: Guard the unchanged registered tree after all checks
        id: snapshot_guard
        if: steps.registered.outputs.publishable == 'true' && steps.identity.outputs.needed != 'false'
        timeout-minutes: 2
        continue-on-error: true
        run: |
          [[ "$(git rev-parse HEAD)" == "$REGISTERED_MAIN_SHA" ]]
          git diff --exit-code HEAD --
          printf 'verified_release_main_sha=%s\n' "$REGISTERED_MAIN_SHA" >> "$RELEASE_EVIDENCE_DIR/context.txt"

      - name: Pages release gate
        id: release_gate
        if: steps.registered.outputs.publishable == 'true' && steps.identity.outputs.needed != 'false'
        timeout-minutes: 2
        env:
          STEPS_JSON: ${{ toJSON(steps) }}
          ARCHIVE_NEEDED: ${{ steps.identity.outputs.archive_needed }}
        run: |
          skip_ok=''
          if [[ "$ARCHIVE_NEEDED" == 'false' ]]; then
            skip_ok='selection_tests,chrome_geumdang,chrome_qid9_student,mock_qa,archive2_runtime'
            printf 'archive_validation=reused_matching_input_dependency_validator_digest\n' >> "$RELEASE_EVIDENCE_DIR/context.txt"
          fi
          node tools/ci/archive-pages-release-gate.mjs \
            --required registered,package_shards,identity,selection_tests,chrome_geumdang,chrome_qid9_student,mock_qa,archive2_runtime,pages_build,staged_site_chrome,worker_order,image_order,snapshot_guard \
            --skip-ok "$skip_ok" \
            --advisory chrome_generated_bank \
            --evidence-file "$RELEASE_EVIDENCE_DIR/context.txt" \
            --summary-file "$GITHUB_STEP_SUMMARY"

      - name: Seal the exact registered and verified package receipt
        id: release_receipt
        if: steps.registered.outputs.publishable == 'true' && steps.identity.outputs.needed != 'false'
        timeout-minutes: 5
        run: |
          node tools/ci/archive-pages-release-identity.mjs \
            --registered-main-sha "$REGISTERED_MAIN_SHA" \
            --identity-file "$RELEASE_EVIDENCE_DIR/release-identity.json" \
            --package-report "$RELEASE_EVIDENCE_DIR/pages-site-package.json" \
            --gate-evidence "$RELEASE_EVIDENCE_DIR/context.txt"

      - name: Upload release diagnostics, including failed and deferred runs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: archive-pages-release-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/archive-pages-release-evidence/
          if-no-files-found: warn
          retention-days: 30

      - name: Upload the verified student site
        if: steps.registered.outputs.publishable == 'true' && steps.identity.outputs.needed != 'false'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy the verified student release
    needs: build
    if: needs.build.outputs.ready == 'true' && needs.build.outputs.needed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
