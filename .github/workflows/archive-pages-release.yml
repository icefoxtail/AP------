name: Archive Pages Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify the student release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      question_json_sync_outcome: ${{ steps.question_json_sync.outcome }}
      question_json_artifact_lookup_outcome: ${{ steps.question_json_artifact_lookup.outcome }}
      question_json_cache_save_outcome: ${{ steps.question_json_cache_save.outcome }}
      question_json_artifact_upload_outcome: ${{ steps.question_json_artifact_upload.outcome }}
      question_json_evidence_record_outcome: ${{ steps.question_json_evidence_record.outcome }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'


      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Create release evidence context
        env:
          RELEASE_EVIDENCE_DIR: ${{ runner.temp }}/archive-pages-release-evidence
        run: |
          mkdir -p "$RELEASE_EVIDENCE_DIR"
          {
            printf 'source_sha='; git rev-parse HEAD
            printf 'event=%s\n' "$GITHUB_EVENT_NAME"
            printf 'run_id=%s\n' "$GITHUB_RUN_ID"
            printf 'run_attempt=%s\n' "$GITHUB_RUN_ATTEMPT"
            printf 'workflow_ref=%s\n' "$GITHUB_WORKFLOW_REF"
            printf 'workflow_run_url=%s/%s/actions/runs/%s\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
          } > "$RELEASE_EVIDENCE_DIR/context.txt"

      - name: Materialize reviewed META_V2 and register Archive sources
        env:
          RELEASE_EVIDENCE_DIR: ${{ runner.temp }}/archive-pages-release-evidence
        run: |
          node archive/tools/meta-foundation/materialize-meta-v2-payloads.mjs --write 2>&1 | tee "$RELEASE_EVIDENCE_DIR/meta-v2-materializer-write.log"
          python archive/build_db.py 2>&1 | tee "$RELEASE_EVIDENCE_DIR/archive-registration-build.log"

      - name: Verify Archive DB, UID, Meta, index, and catalog registration
        env:
          RELEASE_EVIDENCE_DIR: ${{ runner.temp }}/archive-pages-release-evidence
        run: |
          node tests/archive-meta-v2-materializer.test.mjs 2>&1 | tee "$RELEASE_EVIDENCE_DIR/meta-v2-materializer-tests.log"
          node tests/archive2-meta-v2-semantic-authority.test.cjs 2>&1 | tee "$RELEASE_EVIDENCE_DIR/meta-v2-authority-tests.log"
          node archive/tools/meta-foundation/materialize-meta-v2-payloads.mjs --check 2>&1 | tee "$RELEASE_EVIDENCE_DIR/meta-v2-materializer-check.log"
          node tests/archive-question-identity-contract.test.mjs 2>&1 | tee "$RELEASE_EVIDENCE_DIR/question-identity-contract-tests.log"
          node tests/archive-question-identity-runtime.test.mjs 2>&1 | tee "$RELEASE_EVIDENCE_DIR/question-identity-runtime-tests.log"
          node tests/jeil-legacy-similar-22-registration.test.cjs 2>&1 | tee "$RELEASE_EVIDENCE_DIR/jeil-registration-tests.log"
          node tests/palma-legacy-similar-23-registration.test.cjs 2>&1 | tee "$RELEASE_EVIDENCE_DIR/palma-registration-tests.log"
          node archive/tools/verify-archive-registration.mjs 2>&1 | tee "$RELEASE_EVIDENCE_DIR/archive-registration-parity.log"
          git diff --check

      - name: Guard generated Archive registration scope
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(
            {
              git diff --name-only
              git ls-files --others --exclude-standard
            } | sort -u
          )
          allowed='^(archive/db\.js|archive/data/question_identity_map\.json|archive/data/question_metadata\.json|archive/question-identity\.js|archive/question-index\.js|archive/question-index-report\.md|archive/question-index-audit\.md|archive/data/archive2-catalog\.json|archive/data/archive2-crosswalk-inventory\.json|archive/data/archive2-canonical-input-manifest\.json|archive/data/archive2-canonical-projection-policy\.json|archive/data/archive2-item-review-overrides\.json|archive/data/basic-scope-parent-links\.json|archive/data/meta-foundation/runtime/[^/]+\.json)$'
          for file in "${changed[@]}"; do
            if [[ -n "$file" && ! "$file" =~ $allowed ]]; then
              echo "Unexpected generated Archive registration file: $file"
              exit 1
            fi
          done
          printf '%s\n' "${changed[@]}"

      - name: Commit generated Archive registration artifacts
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          RELEASE_EVIDENCE_DIR: ${{ runner.temp }}/archive-pages-release-evidence
        shell: bash
        run: |
          set -euo pipefail
          git add -- archive/db.js archive/data/question_identity_map.json archive/data/question_metadata.json archive/question-identity.js archive/question-index.js archive/question-index-report.md archive/question-index-audit.md archive/data/archive2-catalog.json archive/data/archive2-crosswalk-inventory.json archive/data/archive2-canonical-input-manifest.json archive/data/archive2-canonical-projection-policy.json archive/data/archive2-item-review-overrides.json archive/data/basic-scope-parent-links.json archive/data/meta-foundation/runtime/*.json
          if git diff --cached --quiet; then
            echo "Archive registration artifacts already current."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore(archive): sync registration artifacts [skip ci]"
            git push origin HEAD:main
          fi
          git fetch --no-tags origin main
          registered_sha="$(git rev-parse HEAD)"
          remote_sha="$(git rev-parse origin/main)"
          if [[ "$registered_sha" != "$remote_sha" ]]; then
            echo "main advanced while Archive registration ran; refusing to release stale output" >&2
            echo "registered=$registered_sha remote=$remote_sha" >&2
            exit 1
          fi
          {
            printf 'registration_input_sha=%s\n' "$GITHUB_SHA"
            printf 'registration_commit_sha=%s\n' "$registered_sha"
            printf 'registration_remote_main_sha=%s\n' "$remote_sha"
          } >> "$RELEASE_EVIDENCE_DIR/context.txt"

      - name: Materialize main-resident QID9 source formats through common converter
        env:
          RELEASE_EVIDENCE_DIR: ${{ runner.temp }}/archive-pages-release-evidence
        run: |
          node archive/tools/generated-meta/compile-qid9-main-source.mjs --write 2>&1 | tee "$RELEASE_EVIDENCE_DIR/qid9-source-write.log"
          node archive/tools/generated-meta/compile-qid9-main-source.mjs --check 2>&1 | tee "$RELEASE_EVIDENCE_DIR/qid9-source-check.log"

      - name: Compile student projection from approved production sources
        env:
          RELEASE_EVIDENCE_DIR: ${{ runner.temp }}/archive-pages-release-evidence
        run: node archive/tools/generated-meta/auto-register-approved-qid9.mjs --write 2>&1 | tee "$RELEASE_EVIDENCE_DIR/projection-write.log"

      - name: Check approved UID completeness and projection parity
        env:
          RELEASE_EVIDENCE_DIR: ${{ runner.temp }}/archive-pages-release-evidence
        run: node archive/tools/generated-meta/auto-register-approved-qid9.mjs --check 2>&1 | tee "$RELEASE_EVIDENCE_DIR/projection-check.log"

      - name: Derive and check all main-resident Generated source rows
        env:
          RELEASE_EVIDENCE_DIR: ${{ runner.temp }}/archive-pages-release-evidence
        run: |
          node archive/tools/generated-meta/rebuild-main-source-consumer.mjs --write 2>&1 | tee "$RELEASE_EVIDENCE_DIR/main-source-projection-write.log"
          node archive/tools/generated-meta/rebuild-main-source-consumer.mjs --check 2>&1 | tee "$RELEASE_EVIDENCE_DIR/main-source-projection-check.log"

      - name: Verify exact QID9 source to student Consumer parity
        env:
          RELEASE_EVIDENCE_DIR: ${{ runner.temp }}/archive-pages-release-evidence
        run: node archive/tools/generated-meta/verify-qid9-main-source-projection.mjs 2>&1 | tee "$RELEASE_EVIDENCE_DIR/qid9-consumer-parity.log"

      - name: Verify approved UID Meta, complete source inventory, and selection contracts
        env:
          RELEASE_EVIDENCE_DIR: ${{ runner.temp }}/archive-pages-release-evidence
        run: node --test archive/tools/generated-meta/register-approved-generated-meta.test.mjs archive/tools/generated-meta/auto-register-approved-qid9.test.mjs archive/tools/generated-meta/auto-register-source-rebind.test.mjs tests/generated-source-svg-namespace.test.cjs tests/generated-meta-retention.test.cjs tests/generated-main-source-consumer-sync.test.cjs tests/problem-bank-meta.test.cjs tests/archive2-generated-bank-registration.test.js tests/archive2-generated-mock-selection.test.cjs 2>&1 | tee "$RELEASE_EVIDENCE_DIR/selection-tests.log"

      - uses: browser-actions/setup-chrome@v1
        id: chrome
        with:
          chrome-version: stable

      - name: Verify actual generated-bank lookup, preview, and print
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
          RELEASE_EVIDENCE_DIR: ${{ runner.temp }}/archive-pages-release-evidence
        run: node tools/check-generated-bank-browser.cjs 2>&1 | tee "$RELEASE_EVIDENCE_DIR/generated-bank-chrome.log"

      - name: Verify main-resident Geumdang source output
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
          RELEASE_EVIDENCE_DIR: ${{ runner.temp }}/archive-pages-release-evidence
        run: node tools/check-geumdang-qid9-browser.cjs 2>&1 | tee "$RELEASE_EVIDENCE_DIR/geumdang-source-chrome.log"

      - name: Verify imported QID9 student lookup selection exam answer and solution in actual Chrome
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
          RELEASE_EVIDENCE_DIR: ${{ runner.temp }}/archive-pages-release-evidence
        run: |
          node tools/check-qid9-main-source-browser.cjs 2>&1 | tee "$RELEASE_EVIDENCE_DIR/qid9-student-chrome.log"
          QID9_SOURCE_ROOT_INDEX=1 QID9_SAMPLE_QID=17 node tools/check-qid9-main-source-browser.cjs 2>&1 | tee "$RELEASE_EVIDENCE_DIR/qid9-jeil-student-chrome.log"

      - name: Verify complete generated mock selection, preview, print, answer, and solution flow
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
          RELEASE_EVIDENCE_DIR: ${{ runner.temp }}/archive-pages-release-evidence
        run: node tools/check-generated-mock-qa.cjs --out-dir "$RELEASE_EVIDENCE_DIR/mock-qa" 2>&1 | tee "$RELEASE_EVIDENCE_DIR/generated-mock-qa.log"

      - name: Verify Archive 2.0 runtime contract
        env:
          RELEASE_EVIDENCE_DIR: ${{ runner.temp }}/archive-pages-release-evidence
          SVG_ACCESSIBILITY_BASE_SHA: ${{ github.event.before }}
        run: node tools/check-archive2-runtime.cjs 2>&1 | tee "$RELEASE_EVIDENCE_DIR/archive2-runtime.log"

      - name: Restore last-good question JSON snapshot cache
        id: question_json_cache_restore
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/apmath-question-bank
          key: apmath-question-bank-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            apmath-question-bank-

      - name: Locate previous successful question JSON artifact if cache is unavailable
        id: question_json_artifact_lookup
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          JSON_BANK_DIR: ${{ runner.temp }}/apmath-question-bank
        run: |
          set -euo pipefail
          if node archive/tools/sync-question-json.mjs --verify-current "$JSON_BANK_DIR" >/dev/null 2>&1; then
            echo 'run_id=' >> "$GITHUB_OUTPUT"
            echo 'Last-good question JSON cache restored.'
            exit 0
          fi
          run_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=archive-pages-question-json-bank&per_page=100" --jq '.artifacts | map(select(.expired == false and .name == "archive-pages-question-json-bank")) | sort_by(.created_at) | reverse | .[0].workflow_run.id // empty' 2>/dev/null || true)"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          if [[ -n "$run_id" ]]; then
            echo "Found last-good JSON artifact in run $run_id."
          else
            echo 'No last-good cache or retained artifact is available.'
          fi

      - name: Download previous successful question JSON artifact
        id: question_json_artifact_download
        if: steps.question_json_artifact_lookup.outputs.run_id != ''
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: archive-pages-question-json-bank
          path: ${{ runner.temp }}/apmath-question-bank-fallback
          run-id: ${{ steps.question_json_artifact_lookup.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Restore downloaded last-good JSON snapshot
        if: steps.question_json_artifact_download.outcome == 'success'
        continue-on-error: true
        env:
          JSON_BANK_DIR: ${{ runner.temp }}/apmath-question-bank
          JSON_FALLBACK_DIR: ${{ runner.temp }}/apmath-question-bank-fallback
        run: |
          set -euo pipefail
          if [[ -f "$JSON_FALLBACK_DIR/current.json" ]]; then
            mkdir -p "$JSON_BANK_DIR"
            cp -a "$JSON_FALLBACK_DIR/." "$JSON_BANK_DIR/"
            echo 'Restored last-good question JSON artifact fallback.'
          else
            echo 'Downloaded artifact had no current pointer; a new build will not treat it as last-good.'
          fi

      - name: Build question JSON sync snapshot outside Pages
        id: question_json_sync
        continue-on-error: true
        env:
          RELEASE_EVIDENCE_DIR: ${{ runner.temp }}/archive-pages-release-evidence
          JSON_BANK_DIR: ${{ runner.temp }}/apmath-question-bank
          JSON_STATUS_FILE: ${{ runner.temp }}/archive-pages-release-evidence/question-json-status.json
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          set -euo pipefail
          node --test archive/tools/export-question-json.test.mjs archive/tools/sync-question-json.test.mjs 2>&1 | tee "$RELEASE_EVIDENCE_DIR/question-json-tests.log"
          node archive/tools/sync-question-json.mjs --repo-root "$GITHUB_WORKSPACE" --out-dir "$JSON_BANK_DIR" --temp-root "$RUNNER_TEMP" --status-file "$JSON_STATUS_FILE" 2>&1 | tee "$RELEASE_EVIDENCE_DIR/question-json-sync.log"

      - name: Confirm deployment is built from current registered main
        env:
          RELEASE_EVIDENCE_DIR: ${{ runner.temp }}/archive-pages-release-evidence
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          release_sha="$(git rev-parse HEAD)"
          remote_sha="$(git rev-parse origin/main)"
          if [[ "$release_sha" != "$remote_sha" ]]; then
            echo "main advanced during Pages verification; refusing to deploy a stale artifact" >&2
            echo "release=$release_sha remote=$remote_sha" >&2
            exit 1
          fi
          printf 'verified_release_main_sha=%s\n' "$release_sha" >> "$RELEASE_EVIDENCE_DIR/context.txt"

      - name: Save last-good question JSON snapshot cache
        id: question_json_cache_save
        if: steps.question_json_sync.outcome == 'success'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/apmath-question-bank
          key: apmath-question-bank-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload last-good question JSON snapshot artifact outside Pages
        id: question_json_artifact_upload
        if: success() && steps.question_json_sync.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: archive-pages-question-json-bank
          path: ${{ runner.temp }}/apmath-question-bank/
          if-no-files-found: error
          retention-days: 30

      - name: Record question JSON outcome in release evidence
        id: question_json_evidence_record
        if: always()
        continue-on-error: true
        env:
          RELEASE_EVIDENCE_DIR: ${{ runner.temp }}/archive-pages-release-evidence
          JSON_SYNC_OUTCOME: ${{ steps.question_json_sync.outcome }}
          JSON_CACHE_RESTORE_OUTCOME: ${{ steps.question_json_cache_restore.outcome }}
          JSON_ARTIFACT_LOOKUP_OUTCOME: ${{ steps.question_json_artifact_lookup.outcome }}
          JSON_CACHE_SAVE_OUTCOME: ${{ steps.question_json_cache_save.outcome }}
          JSON_ARTIFACT_UPLOAD_OUTCOME: ${{ steps.question_json_artifact_upload.outcome }}
        run: |
          {
            printf 'question_json_sync_outcome=%s\n' "$JSON_SYNC_OUTCOME"
            printf 'question_json_cache_restore_outcome=%s\n' "$JSON_CACHE_RESTORE_OUTCOME"
            printf 'question_json_artifact_lookup_outcome=%s\n' "$JSON_ARTIFACT_LOOKUP_OUTCOME"
            printf 'question_json_cache_save_outcome=%s\n' "$JSON_CACHE_SAVE_OUTCOME"
            printf 'question_json_artifact_upload_outcome=%s\n' "$JSON_ARTIFACT_UPLOAD_OUTCOME"
          } >> "$RELEASE_EVIDENCE_DIR/context.txt"

      - name: Upload release diagnostics, including failed runs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: archive-pages-release-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/archive-pages-release-evidence/
          if-no-files-found: warn
          retention-days: 30

      - name: Upload the verified student site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    name: Deploy the verified student release
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4

  question-json-status:
    name: Report question JSON sync outcome outside Pages
    needs: build
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Keep JSON sync health visible without gating Pages deployment
        env:
          BUILD_OUTCOME: ${{ needs.build.result }}
          JSON_SYNC_OUTCOME: ${{ needs.build.outputs.question_json_sync_outcome }}
          JSON_ARTIFACT_LOOKUP_OUTCOME: ${{ needs.build.outputs.question_json_artifact_lookup_outcome }}
          JSON_CACHE_SAVE_OUTCOME: ${{ needs.build.outputs.question_json_cache_save_outcome }}
          JSON_ARTIFACT_UPLOAD_OUTCOME: ${{ needs.build.outputs.question_json_artifact_upload_outcome }}
          JSON_EVIDENCE_RECORD_OUTCOME: ${{ needs.build.outputs.question_json_evidence_record_outcome }}
        run: |
          set -euo pipefail
          if [[ "$BUILD_OUTCOME" != "success" ]]; then
            echo "JSON sync not run because the existing Pages build ended as $BUILD_OUTCOME."
            exit 0
          fi
          if [[ "$JSON_SYNC_OUTCOME" != "success" ]]; then
            echo "::error::Question JSON sync outcome outside Pages: ${JSON_SYNC_OUTCOME:-missing}. See release evidence and the retained last-good snapshot."
            exit 1
          fi
          if [[ "$JSON_CACHE_SAVE_OUTCOME" != "success" && "$JSON_ARTIFACT_UPLOAD_OUTCOME" != "success" ]]; then
            echo "::error::Question JSON succeeded but both last-good persistence paths failed (cache=$JSON_CACHE_SAVE_OUTCOME; artifact=$JSON_ARTIFACT_UPLOAD_OUTCOME)."
            exit 1
          fi
          echo "Question JSON sync outside Pages: $JSON_SYNC_OUTCOME; artifact lookup: $JSON_ARTIFACT_LOOKUP_OUTCOME; cache save: $JSON_CACHE_SAVE_OUTCOME; artifact upload: $JSON_ARTIFACT_UPLOAD_OUTCOME; evidence record: $JSON_EVIDENCE_RECORD_OUTCOME."
