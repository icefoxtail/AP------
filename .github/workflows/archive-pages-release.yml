name: Archive Pages Release

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: [Archive Reviewed Exam Meta Register]
    types: [completed]
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  registration-ready:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.inbox.outputs.ready }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          sparse-checkout: |
            .archive-meta-register/inbox
            tools/ci
          sparse-checkout-cone-mode: false
      - id: inbox
        shell: bash
        run: |
          set -euo pipefail
          # The register workflow is the single derived-data writer for pushes that touch its trigger
          # paths. Decide from the triggering push itself (event payload), not from the moving main
          # checkout. If the event cannot prove it, do not defer: a deferral waits for a register run
          # that may never have started.
          touched="$(node tools/ci/push-touches-paths.mjs --paths-file tools/ci/archive-meta-register-trigger-paths.txt --uncertain false)"
          if [[ "$touched" == "true" ]]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "The push touched reviewed-meta registration inputs; the register workflow is the single writer and its completion event will resume release."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
  build:
    needs: registration-ready
    if: needs.registration-ready.outputs.ready == 'true'
    name: Build and verify the student release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: '22'


      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify the explicit Pages package manifest and safeguards
        run: node --test tests/archive-pages-site-package.test.mjs

      - name: Create release evidence context
        env:
          RELEASE_EVIDENCE_DIR: ${{ runner.temp }}/archive-pages-release-evidence
        run: |
          mkdir -p "$RELEASE_EVIDENCE_DIR"
          {
            printf 'source_sha='; git rev-parse HEAD
            printf 'event=%s\n' "$GITHUB_EVENT_NAME"
            printf 'run_id=%s\n' "$GITHUB_RUN_ID"
            printf 'run_attempt=%s\n' "$GITHUB_RUN_ATTEMPT"
            printf 'workflow_ref=%s\n' "$GITHUB_WORKFLOW_REF"
            printf 'workflow_run_url=%s/%s/actions/runs/%s\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
          } > "$RELEASE_EVIDENCE_DIR/context.txt"

      - name: Materialize reviewed META_V2 and register Archive sources
        continue-on-error: true
        env:
          RELEASE_EVIDENCE_DIR: ${{ runner.temp }}/archive-pages-release-evidence
        run: bash tools/ci/archive-pages-registration-derive.sh materialize

      - name: Verify Archive DB, UID, Meta, index, and catalog registration
        continue-on-error: true
        env:
          RELEASE_EVIDENCE_DIR: ${{ runner.temp }}/archive-pages-release-evidence
        run: bash tools/ci/archive-pages-registration-derive.sh verify

      - name: Guard generated Archive registration scope
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(
            {
              git diff --name-only
              git ls-files --others --exclude-standard
            } | sort -u
          )
          allowed='^(archive/db\.js|archive/data/question_identity_map\.json|archive/data/question_metadata\.json|archive/question-identity\.js|archive/question-index\.js|archive/question-index-report\.md|archive/question-index-audit\.md|archive/data/archive2-catalog\.json|archive/data/archive2-source-verification-index\.json|archive/data/archive2-source-verification/v1/[^/]+\.json|archive/data/archive2-crosswalk-inventory\.json|archive/data/archive2-canonical-input-manifest\.json|archive/data/archive2-canonical-projection-policy\.json|archive/data/archive2-item-review-overrides\.json|archive/data/basic-scope-parent-links\.json|archive/data/meta-foundation/runtime/[^/]+\.json)$'
          for file in "${changed[@]}"; do
            if [[ -n "$file" && ! "$file" =~ $allowed ]]; then
              echo "Unexpected generated Archive registration file: $file"
              exit 1
            fi
          done
          printf '%s\n' "${changed[@]}"

      - name: Commit generated Archive registration artifacts
        continue-on-error: true
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          RELEASE_EVIDENCE_DIR: ${{ runner.temp }}/archive-pages-release-evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Never force-pushes. If another writer moved main first, the helper resets to the new tip,
          # re-derives and re-verifies there (same script as the steps above), and pushes the fresh
          # result (max 3 attempts); an identical tree already on main is success.
          node tools/ci/git-push-derived-with-retry.mjs \
            --paths-file tools/ci/archive-pages-registration.paths \
            --message "chore(archive): sync registration artifacts [skip ci]" \
            --regenerate "bash tools/ci/archive-pages-registration-derive.sh all" \
            --remote origin --branch main --max-attempts 3 \
            --label "Pages registration sync" --summary-file "$GITHUB_STEP_SUMMARY"
          git fetch --no-tags origin main
          registered_sha="$(git rev-parse HEAD)"
          remote_sha="$(git rev-parse origin/main)"
          if [[ "$registered_sha" != "$remote_sha" ]]; then
            echo "main advanced while Archive registration ran; refusing to release stale output" >&2
            echo "registered=$registered_sha remote=$remote_sha" >&2
            exit 1
          fi
          {
            printf 'registration_input_sha=%s\n' "$GITHUB_SHA"
            printf 'registration_commit_sha=%s\n' "$registered_sha"
            printf 'registration_remote_main_sha=%s\n' "$remote_sha"
          } >> "$RELEASE_EVIDENCE_DIR/context.txt"

      - name: Materialize main-resident QID9 source formats through common converter
        continue-on-error: true
        env:
          RELEASE_EVIDENCE_DIR: ${{ runner.temp }}/archive-pages-release-evidence
        run: |
          node archive/tools/generated-meta/compile-qid9-main-source.mjs --write 2>&1 | tee "$RELEASE_EVIDENCE_DIR/qid9-source-write.log"
          node archive/tools/generated-meta/compile-qid9-main-source.mjs --check 2>&1 | tee "$RELEASE_EVIDENCE_DIR/qid9-source-check.log"

      - name: Compile student projection from approved production sources
        continue-on-error: true
        env:
          RELEASE_EVIDENCE_DIR: ${{ runner.temp }}/archive-pages-release-evidence
        run: node archive/tools/generated-meta/auto-register-approved-qid9.mjs --write 2>&1 | tee "$RELEASE_EVIDENCE_DIR/projection-write.log"

      - name: Check approved UID completeness and projection parity
        continue-on-error: true
        env:
          RELEASE_EVIDENCE_DIR: ${{ runner.temp }}/archive-pages-release-evidence
        run: node archive/tools/generated-meta/auto-register-approved-qid9.mjs --check 2>&1 | tee "$RELEASE_EVIDENCE_DIR/projection-check.log"

      - name: Derive and check all main-resident Generated source rows
        continue-on-error: true
        env:
          RELEASE_EVIDENCE_DIR: ${{ runner.temp }}/archive-pages-release-evidence
        run: |
          node archive/tools/generated-meta/rebuild-main-source-consumer.mjs --write 2>&1 | tee "$RELEASE_EVIDENCE_DIR/main-source-projection-write.log"
          node archive/tools/generated-meta/rebuild-main-source-consumer.mjs --check 2>&1 | tee "$RELEASE_EVIDENCE_DIR/main-source-projection-check.log"

      - name: Verify exact QID9 source to student Consumer parity
        continue-on-error: true
        env:
          RELEASE_EVIDENCE_DIR: ${{ runner.temp }}/archive-pages-release-evidence
        run: node archive/tools/generated-meta/verify-qid9-main-source-projection.mjs 2>&1 | tee "$RELEASE_EVIDENCE_DIR/qid9-consumer-parity.log"

      - name: Verify approved UID Meta, complete source inventory, and selection contracts
        continue-on-error: true
        env:
          RELEASE_EVIDENCE_DIR: ${{ runner.temp }}/archive-pages-release-evidence
        run: node --test archive/tools/generated-meta/register-approved-generated-meta.test.mjs archive/tools/generated-meta/auto-register-approved-qid9.test.mjs archive/tools/generated-meta/auto-register-source-rebind.test.mjs tests/generated-source-svg-namespace.test.cjs tests/generated-meta-retention.test.cjs tests/generated-main-source-consumer-sync.test.cjs tests/problem-bank-meta.test.cjs tests/archive2-generated-bank-registration.test.js tests/archive2-generated-mock-selection.test.cjs 2>&1 | tee "$RELEASE_EVIDENCE_DIR/selection-tests.log"

      - uses: browser-actions/setup-chrome@v1
        id: chrome
        with:
          chrome-version: stable

      - name: Verify actual generated-bank lookup, preview, and print
        continue-on-error: true
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
          RELEASE_EVIDENCE_DIR: ${{ runner.temp }}/archive-pages-release-evidence
        run: node tools/check-generated-bank-browser.cjs 2>&1 | tee "$RELEASE_EVIDENCE_DIR/generated-bank-chrome.log"

      - name: Verify main-resident Geumdang source output
        continue-on-error: true
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
          RELEASE_EVIDENCE_DIR: ${{ runner.temp }}/archive-pages-release-evidence
        run: node tools/check-geumdang-qid9-browser.cjs 2>&1 | tee "$RELEASE_EVIDENCE_DIR/geumdang-source-chrome.log"

      - name: Verify imported QID9 student lookup selection exam answer and solution in actual Chrome
        continue-on-error: true
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
          RELEASE_EVIDENCE_DIR: ${{ runner.temp }}/archive-pages-release-evidence
        run: |
          node tools/check-qid9-main-source-browser.cjs 2>&1 | tee "$RELEASE_EVIDENCE_DIR/qid9-student-chrome.log"
          QID9_SOURCE_ROOT_INDEX=1 QID9_SAMPLE_QID=17 node tools/check-qid9-main-source-browser.cjs 2>&1 | tee "$RELEASE_EVIDENCE_DIR/qid9-jeil-student-chrome.log"
          QID9_SOURCE_ROOT_INDEX=2 QID9_SAMPLE_QID=23 node tools/check-qid9-main-source-browser.cjs 2>&1 | tee "$RELEASE_EVIDENCE_DIR/qid9-hyochen-student-chrome.log"

      - name: Verify complete generated mock selection, preview, print, answer, and solution flow
        continue-on-error: true
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
          RELEASE_EVIDENCE_DIR: ${{ runner.temp }}/archive-pages-release-evidence
        run: node tools/check-generated-mock-qa.cjs --out-dir "$RELEASE_EVIDENCE_DIR/mock-qa" 2>&1 | tee "$RELEASE_EVIDENCE_DIR/generated-mock-qa.log"

      - name: Verify Archive 2.0 runtime contract
        continue-on-error: true
        env:
          RELEASE_EVIDENCE_DIR: ${{ runner.temp }}/archive-pages-release-evidence
          SVG_ACCESSIBILITY_BASE_SHA: ${{ github.event.before }}
        run: node tools/check-archive2-runtime.cjs 2>&1 | tee "$RELEASE_EVIDENCE_DIR/archive2-runtime.log"

      - name: Build the explicit student Pages file set
        env:
          RELEASE_EVIDENCE_DIR: ${{ runner.temp }}/archive-pages-release-evidence
        run: |
          set -euo pipefail
          node tools/build-archive-pages-site.mjs \
            --root "$GITHUB_WORKSPACE" \
            --output "$GITHUB_WORKSPACE/_site" \
            --report "$RELEASE_EVIDENCE_DIR/pages-site-package.json" \
            2>&1 | tee "$RELEASE_EVIDENCE_DIR/pages-site-package-build.log"

      - name: Verify the staged Pages frontend and archive output in real Chrome
        continue-on-error: true
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
          ARCHIVE_PAGES_SITE_ROOT: ${{ github.workspace }}/_site
          ARCHIVE_PAGES_BASE_PATH: /AP------/
          RELEASE_EVIDENCE_DIR: ${{ runner.temp }}/archive-pages-release-evidence
        run: |
          set -euo pipefail
          node tools/check-archive-pages-site-browser.cjs \
            --site-root "$ARCHIVE_PAGES_SITE_ROOT" \
            --base-path "$ARCHIVE_PAGES_BASE_PATH" \
            2>&1 | tee "$RELEASE_EVIDENCE_DIR/pages-site-browser-smoke.log"
          node tools/check-generated-bank-browser.cjs \
            2>&1 | tee "$RELEASE_EVIDENCE_DIR/generated-bank-staged-site-browser.log"

      - name: Confirm deployment is built from current registered main
        continue-on-error: true
        env:
          RELEASE_EVIDENCE_DIR: ${{ runner.temp }}/archive-pages-release-evidence
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          release_sha="$(git rev-parse HEAD)"
          remote_sha="$(git rev-parse origin/main)"
          if [[ "$release_sha" != "$remote_sha" ]]; then
            echo "::warning::main advanced during Pages verification: release=$release_sha remote=$remote_sha" >&2
          fi
          printf 'verified_release_main_sha=%s\n' "$release_sha" >> "$RELEASE_EVIDENCE_DIR/context.txt"

      - name: Upload release diagnostics, including failed runs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: archive-pages-release-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/archive-pages-release-evidence/
          if-no-files-found: warn
          retention-days: 30

      - name: Upload the verified student site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy the verified student release
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
