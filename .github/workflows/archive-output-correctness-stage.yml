name: Archive Output Correctness Stage
on:
  push:
    branches: ['perf/archive-output-718c238a']
    paths: ['.github/workflows/archive-output-correctness-stage.yml']
permissions:
  contents: write
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Inspect applicable nested instructions
        run: |
          for file in archive/AGENTS.md tests/AGENTS.md tools/AGENTS.md tools/ci/AGENTS.md; do
            if test -f "$file"; then printf '\n--- %s ---\n' "$file"; cat "$file"; fi
          done
      - name: Stage source blobs and immutable comparison references without changing main or task ref
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path('tools/ci/archive-output-correctness-stage.py').read_text()
          anchor = "    tree = api('POST','git/trees',{'base_tree':git('rev-parse',parent+'^{tree}'),'tree':entries})['sha']"
          assert source.count(anchor) == 1, 'EXACT_STAGE_ANCHOR_REQUIRED'
          # GITHUB_TOKEN cannot create a tree changing workflow files. Do not
          # increase permissions or retry that operation. Retain the reviewed
          # source blobs for the separately authorized connector to commit.
          replacement = "    if message == 'fix(archive): share reminder fitting and require fully clean measured output':\n        return None, None, entries\n" + anchor
          source = source.replace(anchor, replacement, 1)
          exec(compile(source, 'tools/ci/archive-output-correctness-stage.py', 'exec'))
          PY
          cat "$RUNNER_TEMP/output-repair-stage/stage-manifest.json"
      - name: Retain source-only staged changes for independent readback
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: archive-output-correctness-stage-${{ github.run_id }}
          path: ${{ runner.temp }}/output-repair-stage/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
