name: M1 Palma Two Current Source Chrome

on:
  push:
    branches:
      - ops/m1-palma-two-current-source-ui-26fc-20261117

permissions:
  contents: read

concurrency:
  group: m1-palma-two-current-source-${{ github.ref }}
  cancel-in-progress: false

jobs:
  palma-two:
    if: github.repository == 'icefoxtail/AP------' && github.event_name == 'push' && github.ref == 'refs/heads/ops/m1-palma-two-current-source-ui-26fc-20261117'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ARCHIVE_M1S2_PALMA_TWO_UI_EXPECTED_SHA: ${{ github.sha }}
    steps:
      - name: Checkout the exact closed ops HEAD
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /archive/*.js
            /archive/*.css
            /archive/engine.html
            /archive/css/
            /archive/js/
            /archive/vendor/
            /archive/data/svg-accessibility-index.js
            /archive/data/question_metadata.json
            /archive/data/question_identity_map.json
            /archive/exams/original/middle/m1/2mid/26_팔마중_2학기_중간_중1_기출.js
            /archive/assets/images/26_팔마중_2학기_중간_중1_기출/
            /apmath/css/student-navigation.css
            /apmath/js/student-navigation.js
            /tools/check-reviewed-problem-renderer-browser.cjs
            /tools/capture-m1s2-problem-surface.cjs
            /tools/check-m1s2-palma-two-current-source-browser.cjs
            /tests/fixtures/archive-m1s2-palma-two-current-source-ui.json
      - name: Supported Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Parse the closed capture producer
        run: node --check tools/check-m1s2-palma-two-current-source-browser.cjs
      - name: Verify the two-item manifest and exact push contract
        run: |
          node <<'NODE'
          const assert=require('node:assert/strict'),fs=require('node:fs');
          const cap=require('./tools/check-m1s2-palma-two-current-source-browser.cjs');
          const manifest=JSON.parse(fs.readFileSync('tests/fixtures/archive-m1s2-palma-two-current-source-ui.json','utf8'));
          assert.equal(cap.validateManifest(manifest),manifest);
          const clone=x=>JSON.parse(JSON.stringify(x)),head=process.env.ARCHIVE_M1S2_PALMA_TWO_UI_EXPECTED_SHA;
          const ref='refs/heads/ops/m1-palma-two-current-source-ui-26fc-20261117';
          const env={GITHUB_ACTIONS:'true',GITHUB_EVENT_NAME:'push',GITHUB_REPOSITORY:'icefoxtail/AP------',GITHUB_REF:ref,GITHUB_SHA:head,
            GITHUB_RUN_ID:process.env.GITHUB_RUN_ID,GITHUB_RUN_ATTEMPT:process.env.GITHUB_RUN_ATTEMPT,GITHUB_WORKFLOW:process.env.GITHUB_WORKFLOW,GITHUB_JOB:process.env.GITHUB_JOB};
          const event={repository:{full_name:'icefoxtail/AP------',fork:false},ref,after:head,deleted:false};
          const positive=cap.executionProvenance(head,env,event);
          assert.equal(positive.eventName,'push');assert.equal(positive.capturedHead,head);
          assert.equal(positive.ref,ref);assert.equal(positive.pullRequest,null);assert.equal(positive.baseSha,null);
          let negativeCases=0;
          for(const change of[
            (e,p)=>e.GITHUB_ACTIONS='false',
            (e,p)=>e.GITHUB_EVENT_NAME='pull_request',
            (e,p)=>e.GITHUB_REPOSITORY='other/repository',
            (e,p)=>p.repository.full_name='other/repository',
            (e,p)=>p.repository.fork=true,
            (e,p)=>e.GITHUB_REF='refs/heads/main',
            (e,p)=>p.ref='refs/heads/main',
            (e,p)=>p.deleted=true,
            (e,p)=>e.GITHUB_SHA='0'.repeat(40),
            (e,p)=>p.after='0'.repeat(40),
            (e,p)=>e.GITHUB_RUN_ATTEMPT='0'
          ]){const e=clone(env),p=clone(event);change(e,p);assert.throws(()=>cap.executionProvenance(head,e,p),/UI_/);negativeCases++;}
          for(const change of[
            m=>m.items[0].questionUid='qid_v1_'+'0'.repeat(64),
            m=>m.expectedCases=14,
            m=>m.items[0].sourceGitBlobSha1='0'.repeat(40)
          ]){const m=clone(manifest);change(m);assert.throws(()=>cap.validateManifest(m),/UI_CLOSED_MANIFEST/);negativeCases++;}
          assert.equal(negativeCases,14);
          console.log(JSON.stringify({status:'CLOSED_CAPTURE_CONTRACT_PASS',positiveCases:2,negativeCases,ChromeRuns:0,newApprovals:0}));
          NODE
      - name: Supported Chrome
        uses: browser-actions/setup-chrome@v1
        id: chrome
        with:
          chrome-version: stable
      - name: Install the isolated browser driver
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm install --prefix "$RUNNER_TEMP/m1-palma-two-driver" --no-save --package-lock=false playwright@1.62.1
      - name: Capture only Q6 and Q8 in the two unchanged viewports
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: >-
          NODE_PATH="$RUNNER_TEMP/m1-palma-two-driver/node_modules" node tools/check-m1s2-palma-two-current-source-browser.cjs
          --root "$GITHUB_WORKSPACE" --output "$RUNNER_TEMP/m1-palma-two-current-source-ui"
      - name: Verify no tracked or untracked checkout changes
        if: always()
        run: test -z "$(GIT_OPTIONAL_LOCKS=0 git status --porcelain=v1 --untracked-files=all)"
      - name: Preserve raw technical evidence and every original capture tile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m1-palma-two-current-source-ui-${{ github.sha }}
          path: ${{ runner.temp }}/m1-palma-two-current-source-ui/
          if-no-files-found: error
          retention-days: 14
