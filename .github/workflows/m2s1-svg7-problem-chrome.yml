name: M2S1 SVG7 Problem Chrome

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.github/workflows/m2s1-svg7-problem-chrome.yml'
      - 'tools/check-m2s1-svg7-problem-browser.cjs'
      - 'tools/capture-m1s2-problem-surface.cjs'
      - 'tools/check-reviewed-problem-renderer-browser.cjs'
      - 'tests/archive-m2s1-svg7-problem-browser.test.cjs'
      - 'tests/fixtures/archive-m2s1-svg7-problem-ui.json'
      - 'archive/engine.html'
      - 'archive/exams/original/middle/m2/1final/22_풍덕중_1학기_기말_중2_수학.js'
      - 'archive/exams/original/middle/m2/1mid/21_금당중_1학기_중간_중2_기출.js'
      - 'archive/exams/original/middle/m2/1final/21_팔마중_1학기_기말_중2_수학.js'
      - 'archive/assets/images/22_풍덕중_1학기_기말_중2_수학/*source-repair-r1.svg'
      - 'archive/assets/images/21_금당중_1학기_중간_중2_기출/*source-repair-r1.svg'
      - 'archive/assets/images/21_팔마중_1학기_기말_중2_수학/*source-repair-r1.svg'

permissions:
  contents: read

concurrency:
  group: m2s1-svg7-problem-ui-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  m2s1-svg7-problem:
    name: M2S1 SVG7 problem renderers — 14 views
    if: github.repository == 'icefoxtail/AP------' && github.event.pull_request.head.repo.full_name == github.repository && !github.event.pull_request.head.repo.fork
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /archive/*.js
            /archive/*.css
            /archive/engine.html
            /archive/css/
            /archive/js/
            /archive/vendor/
            /archive/data/svg-accessibility-index.js
            /archive/data/question_metadata.json
            /archive/data/question_identity_map.json
            /archive/exams/original/middle/m2/1final/22_풍덕중_1학기_기말_중2_수학.js
            /archive/exams/original/middle/m2/1mid/21_금당중_1학기_중간_중2_기출.js
            /archive/exams/original/middle/m2/1final/21_팔마중_1학기_기말_중2_수학.js
            /archive/assets/images/22_풍덕중_1학기_기말_중2_수학/
            /archive/assets/images/21_금당중_1학기_중간_중2_기출/
            /archive/assets/images/21_팔마중_1학기_기말_중2_수학/
            /apmath/css/student-navigation.css
            /apmath/js/student-navigation.js
            /tools/check-reviewed-problem-renderer-browser.cjs
            /tools/check-m2s1-svg7-problem-browser.cjs
            /tools/capture-m1s2-problem-surface.cjs
            /tests/archive-m2s1-svg7-problem-browser.test.cjs
            /tests/fixtures/archive-m2s1-svg7-problem-ui.json
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: browser-actions/setup-chrome@v1
        id: chrome
        with:
          chrome-version: stable
      - name: Install the isolated browser driver
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm install --prefix "$RUNNER_TEMP/m2-svg7-driver" --no-save --package-lock=false playwright@1.62.1
      - name: Check exact selection and provenance refusal guards
        run: node --test tests/archive-m2s1-svg7-problem-browser.test.cjs
      - name: Capture seven existing repaired problem surfaces
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
          ARCHIVE_M2S1_SVG7_UI_EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: NODE_PATH="$RUNNER_TEMP/m2-svg7-driver/node_modules" node tools/check-m2s1-svg7-problem-browser.cjs --root "$GITHUB_WORKSPACE" --output "$RUNNER_TEMP/m2s1-svg7-problem-ui"
      - name: Preserve technical evidence and original scroll tiles
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m2s1-svg7-problem-ui-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/m2s1-svg7-problem-ui/
          if-no-files-found: error
          retention-days: 14
