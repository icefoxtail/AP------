name: Archive Q22 Problem UI Evidence

on:
  push:
    branches: ['review-reference/q22-problem-ui-20261116']
    paths:
      - 'tools/check-q22-basic-parent-problem-browser.cjs'
      - 'tools/check-reviewed-problem-renderer-browser.cjs'
      - 'tests/fixtures/archive-q22-basic-parent-problem-ui.json'
      - 'tests/archive-q22-basic-parent-problem-ui.test.js'
      - '.github/workflows/archive-q22-basic-parent-problem-ui.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  q22-problem-ui:
    name: Exact Q22 problem-only desktop and mobile evidence
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify the closed problem-only capture contract
        run: node --test tests/archive-q22-basic-parent-problem-ui.test.js
      - uses: browser-actions/setup-chrome@v1
        id: chrome
        with:
          chrome-version: stable
      - name: Install the pinned browser driver outside the checkout
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm install --prefix "$RUNNER_TEMP/q22-problem-ui-browser" --no-save --package-lock=false --no-audit --no-fund playwright@1.62.1
      - name: Capture exact Q22 original scroll tiles in actual Chrome
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
          NODE_PATH: ${{ runner.temp }}/q22-problem-ui-browser/node_modules
          ARCHIVE_Q22_PROBLEM_UI_EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node tools/check-q22-basic-parent-problem-browser.cjs --output "$RUNNER_TEMP/q22-basic-parent-problem-ui"
      - name: Preserve original problem-only evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: q22-basic-parent-problem-ui-only-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/q22-basic-parent-problem-ui/
          if-no-files-found: warn
          retention-days: 14
