name: Archive Progress Review Closure (temporary test only)
on:
  push:
    branches: [review/archive-progress-live-20261011]
    paths:
      - .github/workflows/archive-progress-review-closure.yml
      - apply.py
      - tests/browser-smoke.py
      - tests/browser-remote-github.py
permissions:
  contents: read
  actions: read
jobs:
  observer-review-closure:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - name: Checkout exact test commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify clean checkout SHA and installer
        shell: bash
        run: |
          set -euo pipefail
          echo "OBSERVER_TEST_SHA=$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -f apply.py
          test "$(git hash-object apply.py)" = "e67035203e662d67d071d17fa8af506985f34360"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Obtain B15 actual small diagnostics (not Pages ZIP)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api /repos/icefoxtail/AP------/actions/artifacts/11691357897/zip > "$RUNNER_TEMP/b15-release-diagnostics.zip"
          test "$(stat -c %s "$RUNNER_TEMP/b15-release-diagnostics.zip")" -lt 8388608
          unzip -t "$RUNNER_TEMP/b15-release-diagnostics.zip" >/dev/null
      - name: Node regression including the two apply.py tests
        env:
          B15_DIAGNOSTIC_ZIP: ${{ runner.temp }}/b15-release-diagnostics.zip
        run: |
          node --test tests/archive-progress-observer.test.mjs tests/archive-progress-realpaths.test.mjs tests/archive-progress-recovery.test.mjs tests/archive-progress-cache-targets.test.mjs tests/b15-actual-diagnostic.test.mjs
      - name: Install isolated Chromium test runtime
        run: |
          python3 -m pip install --quiet playwright
          python3 -m playwright install --with-deps chromium
      - name: Original UI smoke with strict post-timer counter
        run: python3 tests/browser-smoke.py
      - name: Chromium native fetch from B15 test-state GitHub branch
        env:
          ARCHIVE_PROGRESS_REMOTE_JSON_URL: https://raw.githubusercontent.com/icefoxtail/AP------/review/archive-progress-state-b15-live-20261011/archive-progress.json
          ARCHIVE_PROGRESS_REMOTE_SCREENSHOT: observer-remote-network.png
        run: python3 tests/browser-remote-github.py
      - name: Save remote-network screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: archive-progress-review-remote-network
          path: observer-remote-network.png
          if-no-files-found: warn
          retention-days: 7
