  ['1final/24_금당고_1학기_기말_고1_기출.js',20], ['1final/24_매산고_1학기_기말_고1_기출.js',20], ['1mid/23_충무고_1학기_중간_고1_기출.js',21], ['1mid/24_제일고_1학기_중간_고1_기출.js',22], ['2final/21_제일고_2학기_기말_고1_기출.js',22],

const sleep=ms=>new Promise(resolve=>setTimeout(resolve,ms));
function inspect(doc,mode,expected,targetIds){
  const nums=mode==='ans'?[...doc.querySelectorAll('.ans-n')]:[...doc.querySelectorAll('#staging .q-box')];
  const imgs=[...doc.querySelectorAll('img')];
  const errors=[...doc.querySelectorAll('.error,.load-error')].map(x=>x.textContent).filter(Boolean);
  const count=nums.length, broken=imgs.filter(x=>!x.complete||x.naturalWidth<=0).length;
  const scope=doc.querySelector('#staging')||doc;
  const targetBoxes=mode==='ans'?[]:[...doc.querySelectorAll('#staging .q-box')].filter(x=>targetIds.includes(Number((x.querySelector('.q-num')?.textContent||'').replace(/\D/g,''))));
  const overflow=targetBoxes.filter(x=>x.scrollWidth>x.clientWidth+2).length;
  const visual=doc.querySelectorAll('.mjx-container,.MathJax,svg[role="img"],img[alt]').length;
  const pass=count===expected&&broken===0&&overflow===0&&!errors.length&&(mode==='ans'||visual>0);
  return {count,pages:doc.querySelectorAll('.page').length,images:imgs.length,broken,visual,overflow,errors,pass};
}
function addRow(rel,mode,expected){const tr=document.createElement('tr');tr.innerHTML=`<td>${rel}</td><td>${mode}</td><td>${expected}</td><td>…</td><td>…</td><td>…</td><td>…</td><td>…</td><td class="RUNNING">RUNNING</td>`;rowsEl.appendChild(tr);return tr;}
async function runMode(rel,expected,mode){
  const tr=addRow(rel,mode,expected); frame.src='../..'+'/archive/engine.html?mode='+mode+'&qpp=4&data='+encodeURIComponent('exams/original/high/h1/'+rel);
  let result=null;
  for(let attempt=0;attempt<6;attempt++){await sleep(1200);try{const doc=frame.contentDocument;if(doc){result=inspect(doc,mode,expected,targetIdsByRel[rel]||[]);if(result.pass||attempt===5)break;}}catch(e){result={count:0,pages:0,images:0,broken:0,visual:0,overflow:0,errors:[String(e)],pass:false};}}
  result ||= {count:0,pages:0,images:0,broken:0,visual:0,overflow:0,errors:['frame unavailable'],pass:false};
  const cells=tr.children;cells[3].textContent=result.count;cells[4].textContent=result.pages;cells[5].textContent=`${result.images} (broken ${result.broken})`;cells[6].textContent=result.visual;cells[7].textContent=result.overflow;cells[8].textContent=result.pass?'PASS':'FAIL';cells[8].className=result.pass?'PASS':'FAIL';results.push({rel,mode,expected,...result});document.getElementById('summary').textContent=`${results.length}/${cases.length*modes.length} complete · pass ${results.filter(x=>x.pass).length}`;
}
async function run(){for(const [rel,n] of cases)for(const mode of modes)await runMode(rel,n,mode);window.renderResults=results;document.getElementById('summary').textContent=`DONE · ${results.length} modes · pass ${results.filter(x=>x.pass).length} · fail ${results.filter(x=>!x.pass).length}`;}
run();
