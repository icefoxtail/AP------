<!doctype html>
<meta charset="utf-8">
<title>APMath 65 SVG engine render harness</title>
<style>
  body { margin: 20px; font-family: "Noto Sans KR", "Malgun Gothic", sans-serif; color: #111827; }
  table { border-collapse: collapse; width: 100%; font-size: 12px; } th, td { border: 1px solid #d1d5db; padding: 5px; text-align: left; }
  th { background: #f3f4f6; } .PASS { color: #166534; font-weight: 700; } .RUNNING { color: #92400e; } .FAIL { color: #b91c1c; font-weight: 700; }
  #frame { position: fixed; left: -12000px; top: 0; width: 1280px; height: 900px; border: 0; }
</style>
<h1>25개 시험지 × exam/sol/ans 실제 브라우저 렌더</h1>
<p id="summary">RUNNING</p><table><thead><tr><th>시험지</th><th>모드</th><th>기대 문항</th><th>q/ans 표시 수</th><th>페이지</th><th>SVG/이미지</th><th>overflow</th><th>판정</th></tr></thead><tbody id="rows"></tbody></table>
<div id="frames"></div>
<script>
const cases = [
  ['1final/22_금당고_1학기_기말_고1_기출.js',21], ['1final/22_매산고_1학기_기말_고1_기출.js',20], ['1final/22_복성고_1학기_기말_고1_기출.js',22], ['1final/22_순천여고_1학기_기말_고1_기출.js',23], ['1final/22_팔마고_1학기_기말_고1_기출.js',22], ['1final/22_효천고_1학기_기말_고1_기출.js',22], ['1final/22_제일고_1학기_기말_고1_기출.js',22],
  ['1final/23_매산고_1학기_기말_고1_기출.js',20], ['1final/23_복성고_1학기_기말_고1_기출.js',22], ['1final/23_순천여고_1학기_기말_고1_기출.js',23], ['1final/23_제일고_1학기_기말_고1_기출.js',22], ['1final/23_팔마고_1학기_기말_고1_기출.js',22],
  ['1final/24_금당고_1학기_기말_고1_기출.js',20], ['1final/24_매산고_1학기_기말_고1_기출.js',20], ['1final/24_제일고_1학기_기말_고1_기출.js',22],
  ['2mid/21_복성고_2학기_중간_고1_기출.js',22], ['2mid/21_순천고_2학기_중간_고1_기출.js',22], ['2mid/21_제일고_2학기_중간_고1_기출.js',22],
  ['2final/25_금당고_2학기_기말_고1_기출.js',22], ['2final/25_제일고_2학기_기말_고1_기출.js',22], ['2mid/25_금당고_2학기_중간_고1_기출.js',22], ['2mid/25_매산고_2학기_중간_고1_기출.js',20], ['2mid/25_순천고_2학기_중간_고1_기출.js',23], ['2mid/25_순천여고_2학기_중간_고1_공통수학2.js',21], ['2mid/25_제일고_2학기_중간_고1_기출.js',22]
];
const modes = ['exam','sol','ans']; const rowsEl=document.getElementById('rows'); const framesEl=document.getElementById('frames'); const results=[];
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function addRow(rel, expected, mode){ const tr=document.createElement('tr'); tr.innerHTML=`<td>${rel}</td><td>${mode}</td><td>${expected}</td><td>…</td><td>…</td><td>…</td><td>…</td><td class="RUNNING">RUNNING</td>`; rowsEl.appendChild(tr); return tr; }
function inspect(doc, mode, expected){
  doc.defaultView.scrollTo(0, doc.documentElement.scrollHeight);
  const nums = mode === 'ans' ? [...doc.querySelectorAll('.ans-n')] : [...doc.querySelectorAll('.q-num')];
  const imgs = [...doc.querySelectorAll('img')];
  const broken = imgs.filter(img => !img.complete || img.naturalWidth <= 0).length;
  const pages = doc.querySelectorAll('.page').length;
  const overflow = [...doc.querySelectorAll('.page, .q-box, #print-area')].filter(el => el.scrollWidth > el.clientWidth + 2).length;
  const error = /불러올 수 없습니다|렌더링 중 오류|apRenderError/i.test(doc.body?.innerText || '');
  const count = nums.length;
  return { count, pages, images: imgs.length, broken, overflow, error, pass: count === expected && broken === 0 && overflow === 0 && !error };
}
const frame=document.createElement('iframe'); frame.width=1280; frame.height=900; frame.style.cssText='position:fixed;left:-12000px;top:0;border:0'; framesEl.appendChild(frame);
async function runMode(rel, expected, mode){
  const tr=addRow(rel,expected,mode);
  frame.src='../..' + '/archive/engine.html?mode='+mode+'&qpp=4&data='+encodeURIComponent('exams/original/high/h1/'+rel);
  let result=null;
  for(let attempt=0;attempt<4;attempt++){
    await sleep(2500);
    try{ const doc=frame.contentDocument; if(doc){ result=inspect(doc,mode,expected); if(result.count===expected || attempt===3) break; } }catch(e){ result={count:0,pages:0,images:0,broken:0,overflow:0,error:true,pass:false}; }
  }
  result ||= {count:0,pages:0,images:0,broken:0,overflow:0,error:true,pass:false};
  const c=tr.children; c[3].textContent=result.count; c[4].textContent=result.pages; c[5].textContent=`${result.images} (broken ${result.broken})`; c[6].textContent=result.overflow; c[7].textContent=result.pass?'PASS':'FAIL'; c[7].className=result.pass?'PASS':'FAIL';
  results.push({rel,mode,expected,...result}); document.getElementById('summary').textContent=`${results.length}/${cases.length*modes.length} complete · pass ${results.filter(x=>x.pass).length}`;
}
async function run(){
  for(const [rel,expected] of cases) for(const mode of modes) await runMode(rel,expected,mode);
  window.renderResults=results; document.getElementById('summary').textContent=`DONE · ${results.length} modes · pass ${results.filter(x=>x.pass).length} · fail ${results.filter(x=>!x.pass).length}`;
}
run();
</script>
