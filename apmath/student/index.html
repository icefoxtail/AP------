<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#faf9f7">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="application-name" content="AP 학생">
  <meta name="apple-mobile-web-app-title" content="AP 학생">
  <link rel="manifest" href="./manifest.json?v=2026.11.10.1">
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png?v=2026.11.10.1">
  <link rel="icon" type="image/png" sizes="512x512" href="./icons/icon-512.png?v=2026.11.10.1">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png?v=2026.11.10.1">
  <title>AP Math OS | 학생 포털</title>
  <script>try{localStorage.removeItem("ap.examImageBase.qa");}catch(e){}/* students never use the teacher-only exam image base QA override */</script>
  <script src="../../archive/archive2-output-contract.js?v=20261003-student-review-1"></script>
  <script src="../../archive/archive2-output.js?v=20261003-student-output-s4-1"></script>
  <script src="./archive-review-output.js?v=20261003-student-review-s4-1"></script>
  <script src="./clinic-lineage-view.js?v=2026.11.10.1"></script>
  <script src="./clinic-learning-view.js?v=2026.11.10.1"></script>
  <!-- 글꼴은 화면을 막지 않고, 첫 화면이 그려져 한가해진 뒤에 적용한다(처음엔 시스템 글꼴, 이어서 Pretendard로 바뀜). dynamic-subset은 쓰는 글자 조각만 받는다. -->
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css" media="print" onload="var l=this,f=function(){l.media='all'};window.requestIdleCallback?requestIdleCallback(f,{timeout:2500}):setTimeout(f,400)">
  <noscript><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css"></noscript>
  <link rel="stylesheet" href="./student-portal.css?v=2026.11.10.1">
</head>
<body class="student-portal-theme">
  <a class="skip-link" href="#app">본문으로 바로가기</a>
  <header class="top">
    <div class="brand">
      <img class="brand-logo" src="./icons/icon-192.png?v=2026.11.10.1" alt="AP Math">
      <div class="brand-copy">
        <div class="brand-main">AP Math OS</div>
        <div class="brand-sub">학생 포털</div>
      </div>
    </div>
    <div class="top-actions">
      <div id="student-chip" class="chip"></div>
      <button id="logout-btn" class="logout hidden" onclick="logoutStudent()">로그아웃</button>
    </div>
  </header>
  <nav id="student-nav" class="student-nav" aria-label="학생 포털" hidden></nav>
  <main id="app" class="app" tabindex="-1"></main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="student-update-notice" class="student-update-notice" role="status" aria-live="polite"></div>

  <script>
    // 학생 포털 배포 시 함께 올릴 값:
    // 1. index.html STUDENT_APP_VERSION
    // 2. student-version.json version
    // 3. manifest.json version
    // 4. sw.js STUDENT_SW_VERSION / CACHE_NAME
    // 5. index.html 정적 리소스 ?v=
    const STUDENT_APP_VERSION = '2026.11.10.1';
    const API_BASE = 'https://ap-math-os-v2612.js-pdf.workers.dev/api';
    const SESSION_KEY = 'APMATH_STUDENT_PORTAL_SESSION';
    const TEACHER_SESSION_KEY = 'APMATH_SESSION';
    const previewParams = new URLSearchParams(window.location.search || '');
    const teacherPreviewStudentId = previewParams.get('teacher_preview') === '1'
      ? String(previewParams.get('student_id') || '').trim()
      : '';
    const isTeacherPreview = !!teacherPreviewStudentId;
    const exactOmrAssignmentId = String(previewParams.get('assignment_id') || '').trim();

    let session = null;
    let studentRequestGeneration = 0;
    const studentRequestSequences = Object.create(null);
    let studentViewGeneration = 0;
    let currentStudentView = 'boot';
    let isLoadingViewGeneration = null;
    let homeData = null;
    let homeIndex = null;
    let omrData = null;
    let omrIndex = null;
    let omrLoadedAssignmentId = null;
    let omrDraft = null;
    let omrResultAssignmentId = '';
    let omrListFilter = 'all';
    let materialWrongData = null;
    let wrongClinicData = null;
    let wrongClinicLoadError = '';
    let wrongClinicView = 'recent';
    let wrongClinicStatusFilter = 'all';
    let wrongClinicFilterStudentId = '';
    let latestWrongClinicRefresh = null;
    let pendingWrongClinicOpen = null;
    let materialWrongDraft = null;
    let materialWrongTargetId = '';
    let wrongClinicDraft = null;
    let isLoading = false;
    let deferredInstallPrompt = null;
    let clinicLearningController = null;
    let materialShowAll = false;
    let studentHistoryRestoring = false;
    let studentHistoryReady = false;
    let pendingStudentWrites = 0;
    const pendingOmrSubmissionIds = new Set();

    function $(id) { return document.getElementById(id); }
    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>"']/g, ch => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[ch]));
    }
    function toast(message) {
      const el = $('toast');
      el.textContent = message;
      el.classList.add('show');
      clearTimeout(window.__toastTimer);
      window.__toastTimer = setTimeout(() => el.classList.remove('show'), 1900);
    }
    function beginStudentRequest(resource) {
      const sequence = (studentRequestSequences[resource] || 0) + 1;
      studentRequestSequences[resource] = sequence;
      return { ...captureStudentAuthContext(),
        resource,
        sequence
      };
    }
    function captureStudentAuthContext() {
      return {
        generation: studentRequestGeneration,
        studentId: String(session?.student_id || ''),
        studentToken: String(session?.student_token || ''),
        teacherToken: isTeacherPreview ? readTeacherPreviewToken() : ''
      };
    }
    function isStudentAuthContextCurrent(request) {
      if (!request || request.generation !== studentRequestGeneration) return false;
      if (String(session?.student_id || '') !== request.studentId) return false;
      if (String(session?.student_token || '') !== request.studentToken) return false;
      return !isTeacherPreview || readTeacherPreviewToken() === request.teacherToken;
    }
    function isStudentRequestCurrent(request) {
      return isStudentAuthContextCurrent(request) &&
        studentRequestSequences[request.resource] === request.sequence;
    }
    function enterStudentView(view, preserveCurrent = false, forceNew = false) {
      if (currentStudentView === 'home' && view !== 'home' && clinicLearningController) disposeClinicLearningView();
      if (preserveCurrent && currentStudentView === view) return captureStudentView();
      if (currentStudentView !== view || forceNew) {
        currentStudentView = view;
        studentViewGeneration += 1;
        if (isLoadingViewGeneration !== null && isLoadingViewGeneration !== studentViewGeneration) {
          isLoading = false;
          isLoadingViewGeneration = null;
        }
      }
      updateStudentNavigation(view);
      recordStudentView(view);
      return captureStudentView();
    }
    function captureStudentView() {
      return { view: currentStudentView, generation: studentViewGeneration };
    }
    function isStudentViewCurrent(viewContext, expectedView = viewContext?.view) {
      return Boolean(viewContext) && viewContext.view === expectedView &&
        currentStudentView === expectedView && viewContext.generation === studentViewGeneration;
    }
    function updateStudentNavigation(view) {
      document.body.dataset.studentView = view;
      const nav = $('student-nav');
      if (!nav) return;
      nav.hidden = !session?.student_id || ['boot', 'login', 'preview-error'].includes(view);
      if (nav.hidden) return;
      const restoreNavFocus = nav.contains(document.activeElement);
      const selected = view.startsWith('omr-') ? 'exams' : ['clinic-review', 'material-wrong'].includes(view) ? 'review' : 'home';
      const navigationHtml = `
        <button type="button" class="nav-item ${selected === 'home' ? 'active' : ''}" ${selected === 'home' ? 'aria-current="page"' : ''} onclick="renderHome()">홈</button>
        <button type="button" class="nav-item ${selected === 'exams' ? 'active' : ''}" ${selected === 'exams' ? 'aria-current="page"' : ''} onclick="renderOmrExams()">시험지</button>
        ${isTeacherPreview ? '' : `<a class="nav-item" href="${geometryLabHref()}">실험실</a>`}
        <button type="button" class="nav-item ${selected === 'review' ? 'active' : ''}" ${selected === 'review' ? 'aria-current="page"' : ''} onclick="openStudentReview()">복습·기록</button>
      `;
      if (nav.innerHTML !== navigationHtml) nav.innerHTML = navigationHtml;
      if (restoreNavFocus) requestAnimationFrame(() => {
        if (document.activeElement === document.body) $('app')?.focus({ preventScroll: true });
      });
    }
    function openStudentReview() {
      if (currentStudentView !== 'home') renderHome();
      const target = $('student-review-section');
      if (target) {
        target.open = true;
        target.scrollIntoView({ behavior: 'auto', block: 'start' });
        target.querySelector('summary')?.focus({ preventScroll: true });
      }
    }
    function recordStudentView(view) {
      if (studentHistoryRestoring) { studentHistoryRestoring = false; return; }
      if (!session?.student_id || ['boot', 'login', 'preview-error'].includes(view)) return;
      const state = { apStudentView: view };
      if (view === 'omr-input') state.assignmentId = omrDraft?.assignment_id || '';
      if (view === 'omr-result') state.assignmentId = omrResultAssignmentId;
      if (view === 'clinic-review') state.packetKey = wrongClinicDraft?.packet_key || '';
      if (view === 'material-wrong') state.assignmentId = materialWrongTargetId || materialWrongDraft?.assignment_id || '';
      const previous = window.history.state;
      try {
        if (!studentHistoryReady) { window.history.replaceState(state, '', window.location.href); studentHistoryReady = true; }
        else if (previous?.apStudentView !== view || previous?.assignmentId !== state.assignmentId || previous?.packetKey !== state.packetKey) {
          window.history.pushState(state, '', window.location.href);
          window.scrollTo(0, 0);
        }
      } catch (e) { /* Navigation remains available if history is unavailable. */ }
    }
    async function restoreStudentView(event) {
      if (!hasPortalReadAccess() || !event.state?.apStudentView) return;
      studentHistoryRestoring = true;
      try {
        const view = event.state.apStudentView;
        if (view === 'omr-list') await renderOmrExams();
        else if (view === 'assignments') renderAssignments();
        else if (view === 'omr-input' || view === 'omr-result') {
          const exam = findOmrExam(event.state.assignmentId);
          if (!exam) await renderOmrExams();
          else if (getStudentPortalRecordedSubmission(exam) === 'submitted') renderOmrResult(exam);
          else if (omrDraft?.assignment_id === exam.assignment_id) { enterStudentView('omr-input', false, true); drawOmrInput(exam); }
          else renderOmrInput(exam.assignment_id);
        } else if (view === 'clinic-review' && findWrongClinicPacket(event.state.packetKey)) renderWrongClinicReview(event.state.packetKey);
        else if (view === 'material-wrong' && event.state.assignmentId) await openMaterialWrongOmr(event.state.assignmentId);
        else renderHome();
      } finally { studentHistoryRestoring = false; }
    }
    window.addEventListener('popstate', restoreStudentView);
    function renderStudentAppVersion() {
      return `<div class="student-app-version">v${escapeHtml(STUDENT_APP_VERSION)}</div>`;
    }
    let studentVersionCheckPromise = null;
    async function checkStudentPortalVersion() {
      if (studentVersionCheckPromise) return studentVersionCheckPromise;
      studentVersionCheckPromise = (async () => {
        try {
          const res = await fetch('./student-version.json?ts=' + Date.now(), {
            cache: 'no-store'
          });
          if (!res.ok) return;

          const data = await res.json().catch(() => null);
          const latest = String(data?.version || '').trim();
          if (!latest || latest === STUDENT_APP_VERSION) return;

          showStudentUpdateNotice(latest, data?.message || '');
        } catch (e) {
          console.warn('[student portal] version check failed:', e);
        } finally {
          studentVersionCheckPromise = null;
        }
      })();
      return studentVersionCheckPromise;
    }
    function showStudentUpdateNotice(version, message) {
      const el = $('student-update-notice');
      if (!el) return;
      const latest = String(version || '').trim().replace(/[^\w.-]/g, '');
      const detail = String(message || '').trim() || '화면이 예전처럼 보이면 업데이트를 눌러주세요.';
      if (!latest) return;
      el.innerHTML = `
        <div class="student-update-copy">
          <strong>새 버전이 있습니다.</strong>
          <span>${escapeHtml(detail)}</span>
        </div>
        <button type="button" class="student-update-btn" onclick="reloadStudentPortalWithVersion('${escapeHtml(latest)}')">업데이트</button>
      `;
      el.classList.add('show');
    }
    function reloadStudentPortalWithVersion(version) {
      if (hasUnfinishedStudentWork() && !confirm('아직 저장하지 않은 선택은 사라집니다. 업데이트할까요?')) return;
      const nextVersion = encodeURIComponent(version || STUDENT_APP_VERSION);
      const url = new URL(window.location.href);
      url.searchParams.set('v', nextVersion);
      url.searchParams.set('t', String(Date.now()));
      window.location.replace(url.toString());
    }
    function hasUnfinishedStudentWork() {
      if (isLoading || pendingStudentWrites > 0 || ['omr-input', 'clinic-review', 'material-wrong'].includes(currentStudentView)) return true;
      if (omrDraft && getStudentPortalRecordedSubmission(findOmrExam(omrDraft.assignment_id)) !== 'submitted' &&
        JSON.stringify(normalizeOmrWrongIds(omrDraft.wrong_ids)) !== JSON.stringify(normalizeOmrWrongIds(omrDraft.saved_wrong_ids))) return true;
      if (wrongClinicDraft && JSON.stringify(normalizeWrongClinicWrongIds(wrongClinicDraft.wrong_ids)) !==
        JSON.stringify(normalizeWrongClinicWrongIds(wrongClinicDraft.saved_wrong_ids))) return true;
      return Boolean(materialWrongDraft && (
        JSON.stringify(Array.from(materialWrongDraft.wrong_numbers).sort((a, b) => a - b)) !== JSON.stringify(materialWrongDraft.saved_wrong_numbers || []) ||
        materialWrongDraft.is_no_wrong !== materialWrongDraft.saved_is_no_wrong || materialWrongDraft.quick_input
      ));
    }
    function setTopStudent(name) {
      $('student-chip').textContent = name || '';
      $('logout-btn').classList.toggle('hidden', !name || isTeacherPreview);
    }
    function isStandalonePwa() {
      return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
    }
    function isIosSafari() {
      const ua = window.navigator.userAgent || '';
      const isIos = /iphone|ipad|ipod/i.test(ua);
      const isSafari = /safari/i.test(ua) && !/crios|fxios|edgios|kakaotalk|naver/i.test(ua);
      return isIos && isSafari;
    }
    function shouldShowInstallCard() {
      if (isStandalonePwa()) return false;
      return !!deferredInstallPrompt || isIosSafari();
    }
    function renderInstallCard(compact = false) {
      if (isTeacherPreview) return '';
      const visible = shouldShowInstallCard();
      const ios = isIosSafari() && !deferredInstallPrompt;
      const desc = ios
        ? '아이폰은 Safari 공유 버튼을 누른 뒤 “홈 화면에 추가”를 선택하면 됩니다.'
        : '홈 화면에 추가하면 다음부터 AP 학생 앱처럼 바로 들어올 수 있습니다.';
      const button = deferredInstallPrompt
        ? '<button class="install-mini-btn primary" onclick="installStudentApp()">앱 설치하기</button>'
        : '';
      return `
        <div id="install-card" class="install-card ${compact ? 'compact' : ''} ${visible ? 'show' : ''}">
          <div class="install-icon">AP</div>
          <div class="install-body">
            <div class="install-title">AP 학생 앱으로 홈 화면에 추가</div>
            <div class="install-desc">${desc}</div>
            <div class="install-actions">
              ${button}
              <button class="install-mini-btn" onclick="dismissInstallGuide()">나중에</button>
            </div>
          </div>
        </div>
      `;
    }
    function refreshInstallCards() {
      document.querySelectorAll('#install-card').forEach((el, idx) => {
        const compact = el.classList.contains('compact');
        const wrap = document.createElement('div');
        wrap.innerHTML = renderInstallCard(compact).trim();
        el.replaceWith(wrap.firstElementChild);
      });
    }
    async function installStudentApp() {
      if (!deferredInstallPrompt) {
        toast(isIosSafari() ? '공유 버튼 → 홈 화면에 추가를 눌러주세요.' : '브라우저 메뉴에서 홈 화면에 추가를 눌러주세요.');
        return;
      }
      const promptEvent = deferredInstallPrompt;
      deferredInstallPrompt = null;
      promptEvent.prompt();
      try { await promptEvent.userChoice; } catch (e) {}
      refreshInstallCards();
    }
    function dismissInstallGuide() {
      document.querySelectorAll('#install-card').forEach(el => el.classList.remove('show'));
      toast('나중에 브라우저 메뉴에서 추가할 수 있습니다.');
    }
    function saveSession(next) {
      const prevStudentId = session?.student_id;
      const prevStudentToken = session?.student_token;
      const contextChanged = String(prevStudentId || '') !== String(next?.student_id || '') ||
        String(prevStudentToken || '') !== String(next?.student_token || '');
      session = next;
      if (contextChanged) {
        studentRequestGeneration += 1;
        studentHistoryReady = false;
        materialShowAll = false;
        omrDraft = null;
        disposeClinicLearningView();
        homeData = null;
        homeIndex = null;
        omrData = null;
        omrIndex = null;
        omrLoadedAssignmentId = null;
        omrListFilter = 'all';
        materialWrongData = null;
        materialWrongDraft = null;
        materialWrongTargetId = '';
        omrResultAssignmentId = '';
        wrongClinicData = null;
        wrongClinicLoadError = '';
        wrongClinicView = 'recent';
        wrongClinicStatusFilter = 'all';
        wrongClinicFilterStudentId = `${String(next?.student_id || '')}|${String(next?.student_token || '')}`;
        latestWrongClinicRefresh = null;
        pendingWrongClinicOpen = null;
        wrongClinicDraft = null;
      }
      localStorage.setItem(SESSION_KEY, JSON.stringify(next));

      if (next?.student_id && next?.pin) {
        localStorage.setItem('PLANNER_SID', String(next.student_id));
        localStorage.setItem('PLANNER_PIN', String(next.pin));
        sessionStorage.setItem('PLANNER_SID', String(next.student_id));
        sessionStorage.setItem('PLANNER_PIN', String(next.pin));
      }
    }
    function readSession() {
      try { return JSON.parse(localStorage.getItem(SESSION_KEY)) || null; } catch (e) { return null; }
    }
    function readTeacherPreviewToken() {
      if (!isTeacherPreview) return '';
      try {
        const teacherSession = JSON.parse(localStorage.getItem(TEACHER_SESSION_KEY)) || null;
        return String(teacherSession?.session_token || '').trim();
      } catch (e) {
        return '';
      }
    }
    function hasPortalReadAccess() {
      return !!session?.student_id && (isTeacherPreview ? !!readTeacherPreviewToken() : !!session?.student_token);
    }
    function shouldOpenOmrFromUrl() {
      try {
        const params = new URLSearchParams(window.location.search || '');
        return params.get('omr') === '1';
      } catch (e) {
        return false;
      }
    }
    function getPendingWrongClinicKeyFromUrl() {
      try {
        const params = new URLSearchParams(window.location.search || '');
        return String(params.get('wrong_clinic') || '').trim();
      } catch (e) {
        return '';
      }
    }
    function clearPendingWrongClinicKeyFromUrl() {
      try {
        const url = new URL(window.location.href);
        url.searchParams.delete('wrong_clinic');
        window.history.replaceState(window.history.state, '', url.toString());
      } catch (e) {}
    }
    function clearSession() {
      studentRequestGeneration += 1;
      disposeClinicLearningView();
      localStorage.removeItem(SESSION_KEY);
      localStorage.removeItem('PLANNER_SID');
      localStorage.removeItem('PLANNER_PIN');
      sessionStorage.removeItem('PLANNER_SID');
      sessionStorage.removeItem('PLANNER_PIN');
      session = null;
      studentHistoryReady = false;
      materialShowAll = false;
      omrDraft = null;
      materialWrongDraft = null;
      materialWrongTargetId = '';
      omrResultAssignmentId = '';
      materialWrongData = null;
      homeData = null;
      homeIndex = null;
      omrData = null;
      omrIndex = null;
      omrLoadedAssignmentId = null;
      omrListFilter = 'all';
      wrongClinicData = null;
      wrongClinicLoadError = '';
      wrongClinicView = 'recent';
      wrongClinicStatusFilter = 'all';
      wrongClinicFilterStudentId = '';
      latestWrongClinicRefresh = null;
      pendingWrongClinicOpen = null;
      wrongClinicDraft = null;
      isLoading = false;
      isLoadingViewGeneration = null;
    }
    async function apiPost(path, body) {
      if (isTeacherPreview) throw new Error('학생 화면 확인에서는 저장할 수 없습니다.');
      const r = await fetch(`${API_BASE}/${path}`, {
        method:'POST',
        headers:{ 'Content-Type':'application/json' },
        body: JSON.stringify(body || {})
      });
      const data = await r.json().catch(() => ({}));
      if (!r.ok || data.success === false) throw new Error(data.message || data.error || '요청 실패');
      return data;
    }
    async function apiGet(path, token) {
      const headers = { 'Content-Type':'application/json' };
      if (isTeacherPreview) {
        const teacherToken = readTeacherPreviewToken();
        if (teacherToken) headers.Authorization = `Bearer ${teacherToken}`;
      } else if (token) {
        headers['X-Student-Token'] = token;
      }
      const r = await fetch(`${API_BASE}/${path}`, { headers });
      const data = await r.json().catch(() => ({}));
      if (!r.ok || data.success === false) throw new Error(data.message || data.error || '요청 실패');
      return data;
    }
    async function downloadExamPdf(assignmentId) {
      const exam = findOmrExam(assignmentId);
      if (!exam || !session?.student_id) return toast('다운로드할 시험지를 찾을 수 없습니다.');
      const headers = {};
      if (isTeacherPreview) {
        const teacherToken = readTeacherPreviewToken();
        if (teacherToken) headers.Authorization = `Bearer ${teacherToken}`;
      } else if (session.student_token) {
        headers['X-Student-Token'] = session.student_token;
      }
      try {
        const path = `student-portal/exam-pdf?student_id=${encodeURIComponent(session.student_id)}&assignment_id=${encodeURIComponent(assignmentId)}`;
        const response = await fetch(`${API_BASE}/${path}`, { headers });
        if (!response.ok) {
          const data = await response.json().catch(() => ({}));
          throw new Error(data.message || data.error || 'PDF 다운로드 실패');
        }
        const blob = await response.blob();
        const href = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = href;
        link.download = `${String(exam.exam_title || '시험지').replace(/[\\/:*?"<>|]/g, '_')}.pdf`;
        document.body.appendChild(link);
        link.click();
        link.remove();

    async function openMaterialWrongOmr(assignmentId) {
      if (isTeacherPreview || !assignmentId || !session?.student_id || !session?.student_token) return;
      materialWrongTargetId = String(assignmentId);
      const request = beginStudentRequest('materialOpen');
      const view = enterStudentView('material-wrong', false, true);
      if (String(materialWrongDraft?.assignment_id || '') === materialWrongTargetId) {
        drawMaterialWrongOmr();
        return;
      }
      $('app').innerHTML = '<div class="student-shell"><button type="button" class="btn back-btn" onclick="renderHome()">← 홈</button><div class="empty" role="status">수업자료 오답을 불러오는 중입니다.</div></div>';
      try {
        const data = await apiGet(`material-omr/assignment?assignment_id=${encodeURIComponent(assignmentId)}&student_id=${encodeURIComponent(request.studentId)}`, request.studentToken);
        if (!isStudentRequestCurrent(request) || !isStudentViewCurrent(view, 'material-wrong')) return;
        materialWrongDraft = {
          assignment_id: assignmentId,
          material: data.material,
          assignment: data.assignment,
          wrong_numbers: new Set((data.submission?.wrong_numbers || []).map(Number).filter(Number.isFinite)),
          saved_wrong_numbers: (data.submission?.wrong_numbers || []).map(Number).filter(Number.isFinite).sort((a, b) => a - b),
          saved_is_no_wrong: Number(data.submission?.is_no_wrong || 0) === 1 ? 1 : 0,
          range_start: Number(data.material?.number_start || 1),
          range_size: 100,
          is_no_wrong: Number(data.submission?.is_no_wrong || 0) === 1 ? 1 : 0
        };
        drawMaterialWrongOmr();
      } catch (e) {
        if (!isStudentRequestCurrent(request) || !isStudentViewCurrent(view, 'material-wrong')) return;
        $('app').innerHTML = `<div class="student-shell"><button type="button" class="btn back-btn" onclick="renderHome()">← 홈</button><div class="empty" role="alert"><strong>수업자료를 불러오지 못했습니다.</strong><p>${escapeHtml(e.message || '연결을 확인해 주세요.')}</p><button type="button" class="btn" onclick="openMaterialWrongOmr('${escapeHtml(assignmentId)}')">다시 불러오기</button></div></div>`;
      }
    }
    function getMaterialWrongBounds() {
      const material = materialWrongDraft?.material || {};
      const rawStart = Number(material.number_start);
      const start = Number.isFinite(rawStart) && rawStart > 0 ? Math.trunc(rawStart) : 1;
      const rawEnd = Number(material.number_end);
      const end = Number.isFinite(rawEnd) && rawEnd >= start ? Math.trunc(rawEnd) : start + 199;
      return { start, end };
    }
    function materialWrongRanges() {
      const { start, end } = getMaterialWrongBounds();
      const ranges = [];
      for (let s = start; s <= end; s += 100) ranges.push({ start: s, end: Math.min(end, s + 99) });
      return ranges;
    }
    function drawMaterialWrongOmr() {
      if (!materialWrongDraft) return;
      materialWrongTargetId = String(materialWrongDraft.assignment_id || '');
      enterStudentView('material-wrong');
      const { start, end } = getMaterialWrongBounds();
      const currentStart = Math.min(Math.max(Number(materialWrongDraft.range_start || start), start), end);
      const currentEnd = Math.min(end, currentStart + 99);
      const ranges = materialWrongRanges().map(r => `
        <button type="button" class="material-range-tab ${r.start === currentStart ? 'active' : ''}" aria-pressed="${r.start === currentStart}" onclick="setMaterialWrongRange(${r.start})">${r.start}-${r.end}</button>
      `).join('');
      const buttons = [];
      for (let no = currentStart; no <= currentEnd; no += 1) {
        const selected = materialWrongDraft.wrong_numbers.has(no);
        buttons.push(`<button type="button" class="omr-no ${selected ? 'wrong' : ''}" aria-label="${no}번 오답" aria-pressed="${selected}" data-material-no="${no}" onclick="toggleMaterialWrongNo(${no})">${no}</button>`);
      }
      const selected = Array.from(materialWrongDraft.wrong_numbers).sort((a, b) => a - b);
      $('app').innerHTML = `
        <div class="student-shell">
          <button class="btn back-btn" onclick="renderHome()">← 홈</button>
          <section class="card">
            <h1 class="card-title">${escapeHtml(materialWrongDraft.material?.title || '수업자료 오답')}</h1>
            <p class="card-desc">${escapeHtml(materialWrongDraft.assignment?.title || '')}</p>
            <div class="material-range-tabs">${ranges}</div>
            <div class="omr-sheet">${buttons.join('')}</div>
            <div class="material-wrong-tools">
              <label class="field-label" for="material-quick-input">오답 번호 빠른 입력</label><input id="material-quick-input" class="material-quick-input" value="${escapeHtml(materialWrongDraft.quick_input || '')}" placeholder="예: 123,124,130 또는 123-128" oninput="materialWrongDraft.quick_input=this.value" onkeydown="if(event.key==='Enter')applyMaterialQuickInput()">
              <button class="btn" onclick="applyMaterialQuickInput()">빠른 입력</button>
              <button class="btn material-no-wrong" onclick="markMaterialNoWrong()">오답 없음</button>
            </div>
            <div class="material-selected" id="material-selected" role="status">선택됨: ${selected.length ? selected.join(', ') : '없음'}</div>
          </section>
          <div class="omr-submit-bar">
            <button id="material-submit-btn" class="btn btn-primary" onclick="submitMaterialWrongOmr()">제출</button>
          </div>
          ${renderStudentAppVersion()}
        </div>
      `;
    }
    function setMaterialWrongRange(start) {
      if (isLoading || !materialWrongDraft) return;
      materialWrongDraft.range_start = Number(start);
      drawMaterialWrongOmr();
    }
    function toggleMaterialWrongNo(no) {
      if (isLoading || !materialWrongDraft) return;
      const n = Number(no);
      materialWrongDraft.is_no_wrong = 0;
      if (materialWrongDraft.wrong_numbers.has(n)) materialWrongDraft.wrong_numbers.delete(n);
      else materialWrongDraft.wrong_numbers.add(n);
      const button = document.querySelector(`[data-material-no="${n}"]`);
      const selected = materialWrongDraft.wrong_numbers.has(n);
      if (button) { button.classList.toggle('wrong', selected); button.setAttribute('aria-pressed', String(selected)); }
      const numbers = Array.from(materialWrongDraft.wrong_numbers).sort((a, b) => a - b);
      if ($('material-selected')) $('material-selected').textContent = `선택됨: ${numbers.length ? numbers.join(', ') : '없음'}`;
    }
    function parseMaterialQuickInput(raw) {
      const { start, end } = getMaterialWrongBounds();
      const out = [];
      String(raw || '').split(',').map(v => v.trim()).filter(Boolean).forEach(part => {
        const range = part.match(/^(\d+)\s*-\s*(\d+)$/);
        if (range) {
          const a = Number(range[1]);
          const b = Number(range[2]);
          for (let n = Math.min(a, b); n <= Math.max(a, b); n += 1) out.push(n);
        } else {
          out.push(Number(part));
        }
      });
      return [...new Set(out.filter(n => Number.isFinite(n) && n >= start && n <= end))].sort((a, b) => a - b);
    }
    function applyMaterialQuickInput() {
      if (isLoading || !materialWrongDraft) return;
      const input = $('material-quick-input');
      const parsed = parseMaterialQuickInput(input?.value || '');
      if (!parsed.length) {
        toast('입력할 오답 번호를 확인해 주세요.');
        return;
      }
      parsed.forEach(no => materialWrongDraft.wrong_numbers.add(no));
      materialWrongDraft.is_no_wrong = 0;
      materialWrongDraft.quick_input = '';
      drawMaterialWrongOmr();
    }
    function markMaterialNoWrong() {
      if (isLoading || !materialWrongDraft) return;
      materialWrongDraft.wrong_numbers.clear();
      materialWrongDraft.is_no_wrong = 1;
      drawMaterialWrongOmr();
      toast('오답 없음으로 선택했습니다.');
    }
    async function submitMaterialWrongOmr() {
      if (isLoading || !materialWrongDraft) return;
      const request = beginStudentRequest('materialMutation');
      const view = captureStudentView();
      if (!isStudentViewCurrent(view, 'material-wrong')) return;
      const draft = materialWrongDraft;
      const btn = $('material-submit-btn');
      isLoading = true;
      isLoadingViewGeneration = view.generation;
      pendingStudentWrites += 1;
      if (btn) {
        btn.disabled = true;
        btn.textContent = '제출 중...';
      }
      try {
        const wrongNumbers = Array.from(draft.wrong_numbers).sort((a, b) => a - b);
        const isNoWrong = draft.is_no_wrong ? 1 : 0;
        await apiPost('material-omr/submit', {
          assignment_id: draft.assignment_id,
          student_id: request.studentId,
          token: request.studentToken,
          student_token: request.studentToken,
          wrong_numbers: wrongNumbers,
          is_no_wrong: isNoWrong
        });
        if (!isStudentRequestCurrent(request)) return;
        materialWrongData = null;
        if (materialWrongDraft === draft) {
          draft.saved_wrong_numbers = wrongNumbers;
          draft.saved_is_no_wrong = isNoWrong;
          const draftUnchanged = JSON.stringify(Array.from(draft.wrong_numbers).sort((a, b) => a - b)) === JSON.stringify(wrongNumbers) && (draft.is_no_wrong ? 1 : 0) === isNoWrong;
          if (isStudentViewCurrent(view, 'material-wrong') && draftUnchanged) {
            toast('수업자료 오답이 제출되었습니다.');
            materialWrongDraft = null;
            renderHome();
            openStudentReview();
          }
        }
      } catch (e) {
        if (isStudentRequestCurrent(request) && isStudentViewCurrent(view, 'material-wrong')) toast(e.message || '제출에 실패했습니다.');
      } finally {
        pendingStudentWrites = Math.max(0, pendingStudentWrites - 1);
        if (isStudentRequestCurrent(request) && isLoadingViewGeneration === view.generation) {
          isLoading = false;
          isLoadingViewGeneration = null;
        }
        if (isStudentRequestCurrent(request) && isStudentViewCurrent(view, 'material-wrong') && btn?.isConnected) {
          btn.disabled = false;
          btn.textContent = '제출';
        }
      }
    }

        if (!hadStudentWorkerController || studentWorkerReloading) return;
        if (hasUnfinishedStudentWork()) {
          showStudentUpdateNotice(STUDENT_APP_VERSION, '작성 중인 내용을 먼저 제출하거나 저장한 뒤 업데이트하세요.');
          return;
        }
        studentWorkerReloading = true;
        window.location.reload();
      });

      async function refreshStudentPortalUpdate() {
        checkStudentPortalVersion();
        try {
          const reg = await navigator.serviceWorker.getRegistration('./');
          if (reg) await reg.update();
        } catch (e) {
          console.warn('[student portal] service worker update failed:', e);
        }
      }

      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js', { updateViaCache: 'none' })
          .then(reg => {
            reg.update().catch(() => {});
          })
          .catch(() => {});
      });

      window.addEventListener('pageshow', refreshStudentPortalUpdate);
      window.addEventListener('focus', () => {
        refreshStudentPortalUpdate();
        refreshStudentHomeAssignments();
      });
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible') {
          refreshStudentPortalUpdate();
          refreshStudentHomeAssignments();
        }
      });
      window.setInterval(() => {
        if (document.visibilityState === 'visible') {
          refreshStudentPortalUpdate();
          refreshStudentHomeAssignments();
        }
      }, 30 * 1000);
    }
  </script>
</body>
</html>
