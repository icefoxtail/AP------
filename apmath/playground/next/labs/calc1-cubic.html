<script>
/* ==========================================================================
   미적분Ⅰ · 삼차함수 비율관계 (AP Math Lab 2.0 이식본)

   - 수학 함수(삼차함수 f, 도함수, 변곡접선, 삼차방정식 실근 솔버, 외부점 접선 접점,
     일반형 식 생성)는 원본과 같은 식입니다. 원본이 전역 state를 읽던 것을 상태 s를
     첫 인자로 받도록만 바꿨습니다.
   - 바뀐 점: 셸·레이아웃은 공용 키트가 담당, 무대는 1:1 축척, 점은 직접 끌 수 있는 손잡이
     (극소 B·변곡점 I·접점 T·외부점 P·수평선 y=k), 의미색으로 색 통일.
   ========================================================================== */
window.addEventListener('DOMContentLoaded', function () {
  const { tex, fmt, clamp } = APLab;
  const lcuActive = s => !!(s && (s.lessonOn || s.lessonEntry));

  /* ---------- 1. 삼차함수 f(x) = a(x-m)³ - 3aδ(x-m) + ym 와 도함수 (원본 evalF / evalFp) ---------- */
  function evalF(s, x) {
    const u = x - s.m;
    return s.a * u * u * u - 3 * s.a * s.delta * u + s.ym;
  }

  function evalFp(s, x) {
    const u = x - s.m;
    return 3 * s.a * (u * u - s.delta);
  }

  // 변곡점에서의 접선 식 y = g_inf(x)
  function evalInflectionTangent(s, x) {
    const slopeI = -3 * s.a * s.delta;
    return s.ym + slopeI * (x - s.m);
  }

  // 삼차방정식 c3*u^3 + c2*u^2 + c1*u + c0 = 0 의 서로 다른 실근 배열 반환
  function solveCubicRealRoots(c3, c2, c1, c0) {
    if (Math.abs(c3) < 1e-9) return [];
    const A = c2 / c3;
    const B = c1 / c3;
    const C = c0 / c3;

    // u = y - A/3 치환 -> y^3 + p*y + q = 0
    const p = B - (A * A) / 3;
    const q = (2 * A * A * A) / 27 - (A * B) / 3 + C;
    const disc = (q * q) / 4 + (p * p * p) / 27;
    const shift = -A / 3;
    const roots = [];

    const tol = 64 * Number.EPSILON * Math.max(Math.abs(q*q/4), Math.abs(p*p*p/27), Number.MIN_VALUE);
    if (Math.abs(disc) <= tol) {
      if (p === 0 && q === 0) {
        roots.push(shift);
      } else {
        const u1 = Math.cbrt(-q / 2);
        roots.push(2 * u1 + shift, -u1 + shift);
      }
    } else if (disc > 0) {
      const sqrtD = Math.sqrt(disc);
      const u = Math.cbrt(-q / 2 + sqrtD);
      const v = Math.cbrt(-q / 2 - sqrtD);
      roots.push(u + v + shift);
    } else {
      const r = Math.sqrt(Math.max(0, -p / 3));
      const cosArg = Math.max(-1, Math.min(1, -q / (2 * r * r * r)));
      const phi = Math.acos(cosArg);
      roots.push(
        2 * r * Math.cos(phi / 3) + shift,
        2 * r * Math.cos((phi + 2 * Math.PI) / 3) + shift,
        2 * r * Math.cos((phi + 4 * Math.PI) / 3) + shift
      );
    }
    return roots.sort((x, y) => x - y);
  }

  // 외부 점 P(x0, y0)에서 곡선에 그은 접선의 접점 x좌표 t들을 구함
  // y0 - f(t) = f'(t)(x0 - t)
  // u = t - m, u0 = x0 - m, v0 = y0 - ym 치환 시:
  // 2a*u^3 - 3a*u0*u^2 + (3a*delta*u0 + v0) = 0
  function getTangentContactsFromPoint(s, x0, y0) {
    const u0 = x0 - s.m;
    const v0 = y0 - s.ym;
    const a = s.a;
    const c3 = 2 * a;
    const c2 = -3 * a * u0;
    const c1 = 0;
    const c0 = 3 * a * s.delta * u0 + v0;

    const uRoots = solveCubicRealRoots(c3, c2, c1, c0);
    // 중복 제거 필터링
    const uniqueT = [];
    uRoots.forEach((u) => {
      const tVal = u + s.m;
      if (!uniqueT.some((existing) => Math.abs(existing - tVal) < 1e-9 * Math.max(1, Math.abs(tVal), Math.abs(existing)))) {
        uniqueT.push(tVal);
      }
    });
    return uniqueT;
  }

  // 일반형 f(x) = ax³ + bx² + cx + d 수식 문자열 생성
  function getExpandedFormulaLatex(s) {
    const a = s.a;
    const m = s.m;
    const dlt = s.delta;
    const ym = s.ym;

    const A = a;
    const B = -3 * a * m;
    const C = 3 * a * (m * m - dlt);
    const D = a * (-m * m * m + 3 * m * dlt) + ym;

    const fmtNum = (v, isFirst = false) => {
      if (Math.abs(v) < 1e-6) return null;
      const sign = v > 0 ? (isFirst ? '' : ' + ') : (isFirst ? '-' : ' - ');
      const absV = Math.abs(v);
      const numStr = Number.isInteger(+absV.toFixed(2)) ? absV.toFixed(0) : absV.toFixed(2);
      return { sign, absV, numStr };
    };

    let str = 'f(x) = ';
    const t3 = fmtNum(A, true);
    if (t3) str += `${t3.sign}${Math.abs(t3.absV - 1) < 1e-6 ? '' : t3.numStr}x^3`;

    const t2 = fmtNum(B, false);
    if (t2) str += `${t2.sign}${Math.abs(t2.absV - 1) < 1e-6 ? '' : t2.numStr}x^2`;

    const t1 = fmtNum(C, false);
    if (t1) str += `${t1.sign}${Math.abs(t1.absV - 1) < 1e-6 ? '' : t1.numStr}x`;

    const t0 = fmtNum(D, false);
    if (t0) str += `${t0.sign}${t0.numStr}`;

    let ds = "f'(x) = ";
    const d2 = fmtNum(3 * A, true);
    if (d2) ds += `${d2.sign}${Math.abs(d2.absV - 1) < 1e-6 ? '' : d2.numStr}x^2`;
    const d1 = fmtNum(2 * B, false);
    if (d1) ds += `${d1.sign}${Math.abs(d1.absV - 1) < 1e-6 ? '' : d1.numStr}x`;
    const d0 = fmtNum(C, false);
    if (d0) ds += `${d0.sign}${d0.numStr}`;

    return { fLatex: str, fpLatex: ds };
  }

  /* ---------- 2. 문제·풀이 데이터 (원본 examData 그대로) ---------- */

  function exploreFocus(s, m) {
    const base = focusFor(VIEW[m], s.dual);

    const q = 3*s.m-2*s.t, xs = [s.t, q, s.m];

        else if (m === 5) v2 = `P(${fmt(s.px, 1)}, ${fmt(s.py, 1)}) → 접선 ${cnt}개`;
        else if (m === 4) v2 = `P(${fmt(s.t)}, ${fmt(evalF(s, s.t))}) → 접선 기울기 f′(t) = ${fmt(evalFp(s, s.t))}`;
        else v2 = Math.abs(s.t - s.m) < 1e-9 ? 't=m: 변곡점에서 삼중 접촉 · 서로 다른 재교점 없음' : `|t−m|≈${fmt(Math.abs(s.t - s.m))} | |q−m|≈${fmt(Math.abs(d.q - s.m))} (1:2)`;
        v3 = `Δy = ${fmt(d.dy)} (∫|f′| = ${fmt(d.dy)})`;
      } else {
        v1 = `I(${fmt(s.m, 1)}, ${fmt(s.ym, 1)}) | 극값 없음`;
        v2 = Math.abs(s.t - s.m) < 1e-9 ? 't=m: 변곡점에서 삼중 접촉 · 0:0에 비율을 붙일 수 없음' : `2t+q = ${fmt(2 * s.t + d.q)} = 3m (거리비 1:2)`;
        v3 = 'D ≤ 0 (극값이 없는 개형)';
      }
      const v4 = `S = ${fmt(d.areaS)} (L = ${fmt(d.L)})`;
      let tape = null;
      if (s.step >= 3) {
        let title;
        if (m === 1) {
          title = d.ext
            ? `1 : 1 : 1 간격 h = ${fmt(d.h)} | 1 : √3 간격 = ${fmt(Math.sqrt(3) * d.h)} | 극값의 차 Δy = 4|a|h³ = ${fmt(d.dy)}`
            : `D ≤ 0 (δ=${fmt(s.delta)}) : 극값이 없어 간격의 비를 볼 수 없습니다`;
        } else if (m === 2) {
          title = Math.abs(s.t - s.m) < 1e-9 ? '변곡점의 접선은 f−접선=a(x−m)³: 접점만 있고 별도의 재교점은 없습니다.' : `기울어진 접선: 2t(${fmt(2 * s.t)}) + q(${fmt(d.q)}) = 3m(${fmt(3 * s.m)}) ⇒ |t−m| : |q−m| = 1 : 2`;
        } else if (m === 3) {
          title = `접선 넓이 $S=\\dfrac{|a|}{12}(\\beta-\\alpha)^4=${fmt(d.areaS, 3)}$`;
        } else if (m === 4) {
          title = d.ext
            ? `도함수 넓이 $\\int|f^{\\prime}|\\,dx$ = 극값의 차 $\\Delta y=\\dfrac{|a|}{2}(\\beta-\\alpha)^3=${fmt(d.dy)}$`
            : "δ ≤ 0 이므로 도함수 f′(x)의 부호가 바뀌지 않습니다 (극값 없음)";
        } else {
          title = `외부 점 P(${fmt(s.px)}, ${fmt(s.py)}) 에서의 접선 개수 = ${cnt}개 (곡선과 대칭의 중심에서의 접선이 경계)`;
        }
        tape = { title };
      }
      return {
        chips: [{ k: '함수', tex: f.fLatex, color: 'amber' }, { k: '도함수', tex: f.fpLatex, color: 'sky' }],
        status: d.ext ? { tone: 'ok', text: 'D > 0 (극값이 있음)' } : { tone: 'warn', text: 'D ≤ 0 (극값이 없음)' },
        alert: d.ext ? null : { tone: 'bad', text: '도함수의 판별식 D ≤ 0 이므로 극대·극소가 없어 간격의 비를 볼 수 없습니다! (조절 막대에서 δ > 0 일 때 성립)' },
        readouts: [
          { label: '대칭의 중심 I / 극값 간격 h', value: v1, color: 'violet', ref: 'I', wide: true },
          { label: '비율 관계 / 접선 개수', value: v2, color: 'amber', ref: m === 1 ? 'box' : m === 5 ? 'P' : 'T', wide: true },
          { label: "극값의 차 Δy = ∫|f′|dx", value: v3, color: 'sky', ref: 'dy', wide: true },
          { label: '접선과 곡선이 둘러싸는 넓이 S', value: v4, color: 'rose', ref: 'S', wide: true }
        ],
        tape
      };
    };
  }

  /* ---------- 5. 그리기 ---------- */
  function mainBg(b, s) {
    b.use('main');
    b.ctx.save();
    if (b.panes) b.clip();
    if (s.grid) b.grid();
    b.axes();
  }
  const done = (b) => b.ctx.restore();
  const curve = (b, s) => b.plot((x) => evalF(s, x), { color: 'ink', width: 3.2, glow: true });
  // 두 곡선 f, g 사이 영역 색칠 (x0→x1)
  function region(b, f, g, x0, x1, o) {
    const pts = [];
    const n = 80;
    for (let i = 0; i <= n; i++) { const x = x0 + ((x1 - x0) * i) / n; pts.push([x, f(x)]); }
    for (let i = n; i >= 0; i--) { const x = x0 + ((x1 - x0) * i) / n; pts.push([x, g(x)]); }
    b.poly(pts, { fill: o.fill, fillAlpha: o.alpha, stroke: false, ref: o.ref });
  }
  // 변곡점 I(끌기), 극대·극소 A·B(B는 끌어 δ 조절), 접점·탐침점 T(끌기) — 모든 모드 공통 (원본 renderMainPointsOverlay)
  function overlay(b, s, m) {
    const { m: mx, ym, delta, t } = s;
    b.handle('I', [mx, ym], { color: 'violet', ref: 'I', label: `대칭의 중심 I(${num(mx)}, ${num(ym)})`, dx: m === 3 || m === 4 ? -12 : 12, dy: m === 4 ? -14 : 20, align: m === 3 || m === 4 ? 'right' : 'left',
      drag: (w) => { s.m = clamp(+w.x.toFixed(2), -1.5, 2.5); } });
    if (delta > 0.001) {
      const h = Math.sqrt(delta);
      const xA = mx - h, xB = mx + h;
      const lblA = s.a > 0 ? '극대 A' : '극소 A';
      const lblB = s.a > 0 ? '극소 B' : '극대 B';
      b.point([xA, evalF(s, xA)], { color: 'rose', r: 6, ref: 'A', label: `${lblA}(${num(xA)}, ${num(evalF(s, xA))})`, dx: -12, dy: -12, align: 'right' });
      b.handle('B', [xB, evalF(s, xB)], { color: 'green', ref: 'B', label: `${lblB}(${num(xB)}, ${num(evalF(s, xB))})`, dx: 12, dy: m === 2 ? 30 : 20,
        drag: (w) => { const dh = clamp(Math.abs(w.x - s.m), 0.2, 1.5); s.delta = +(dh * dh).toFixed(2); } });
    }
    if ((m >= 2 && m <= 4) || s.dual) {
      const yt = evalF(s, t);
      const slope = evalFp(s, t);
      const lbl = m === 4 ? `P(${num(t)}, ${num(yt)})` : `접점 T(${num(t)}, ${num(yt)})`;
      b.handle('T', [t, yt], { color: 'amber', ref: 'T', priority: 1, label: lbl, dx: m === 4 ? -14 : 12, dy: m === 4 ? 2 : -14, align: m === 4 ? 'right' : 'left',
        drag: (w) => { s.t = clamp(w.x, -1.5, 3.2); } });
    }
  }
  // 아래 칠판: 도함수 y = f′(x), 정적분 면적 S_d = Δy (원본 renderDerivativePane)
  function derivPane(b, s, m) {
    if (!s.dual) return;
    b.use('deriv');
    const r = b.paneRect('deriv');
    const c = b.ctx;
    c.save();
    c.fillStyle = b.color('halo', 0.35);
    c.fillRect(r.x, r.y, r.w, r.h);
    c.restore();
    c.save();
    b.clip();
    if (s.grid) b.grid();
    b.axes({ yLabel: "y'" });
    const { m: mx, delta, a } = s;
    if (delta > 0.001 && s.step >= 2) {
      const hv = Math.sqrt(delta);
      const xA = mx - hv, xB = mx + hv;
      const pts = [[xA, 0]];
      for (let i = 0; i <= 60; i++) { const x = xA + ((xB - xA) * i) / 60; pts.push([x, evalFp(s, x)]); }
      pts.push([xB, 0]);
      b.poly(pts, { fill: 'sky', fillAlpha: 0.28, stroke: false, ref: 'dy' });
      const areaSd = 4 * Math.abs(a) * Math.pow(hv, 3);
      b.text([mx, 1.1], `∫|f′(x)|dx = ${num(areaSd)} (= Δy)`, { color: 'amber', size: 12.5, weight: 800, ref: 'dy' });
    }
    b.plot((x) => evalFp(s, x), { color: 'sky', width: 2.8, glow: true });
    const vFp = evalFp(s, mx);
    b.point([mx, vFp], { color: 'violet', r: 5, ref: 'I', label: `꼭짓점(${num(mx)}, ${num(vFp)})`, dx: 12, dy: 16 });
    if (delta > 0.001) {
      const hv = Math.sqrt(delta);
      b.point([mx - hv, 0], { color: 'rose', r: 5, ref: 'A', label: `α=${num(mx - hv)}`, dx: -10, dy: -12, align: 'right' });
      b.point([mx + hv, 0], { color: 'green', r: 5, ref: 'B', label: `β=${num(mx + hv)}`, dx: 10, dy: -12 });
    }
    const fpt = evalFp(s, s.t);
    b.handle('Tp', [s.t, fpt], { color: 'amber', ref: 'T', priority: 1, label: `P′(${num(s.t)}, f′=${num(fpt)})`, dx: 12, dy: -12,
      drag: (w) => { s.t = clamp(w.x, -1.5, 3.2); } });
    c.restore();
    // 나눔선 + 이름표
    c.save();
    c.strokeStyle = b.color('sky', 0.55);
    c.lineWidth = 1.5;
    c.beginPath();
    c.moveTo(r.x, r.y + 0.5);
    c.lineTo(r.x + r.w, r.y + 0.5);
    c.stroke();
    c.restore();
    b.stext(r.x + 14, r.y + 20, "도함수 y = f′(x) (f(x)의 그래프와 x좌표를 맞춤)", { color: 'sky', size: 12.5, align: 'left', weight: 800 });
    // 위·아래를 잇는 수직 동기화선 (원본 renderVerticalSyncLines)
    b.use('main');
    const r1 = b.paneRect('main');
    const line = (x, col, al, w) => {
      const sx = b.toS(x, 0).x;
      c.save();
      c.setLineDash([5, 5]);
      c.strokeStyle = b.color(col, al);
      c.lineWidth = w;
      c.beginPath();
      c.moveTo(sx, r1.y + 6);
      c.lineTo(sx, r.y + r.h - 6);
      c.stroke();
      c.restore();
    };
    if (s.step >= 1) {
      line(mx, 'violet', 0.5, 1.5);
      if (delta > 0.001) {
        const hv = Math.sqrt(delta);
        line(mx - hv, 'rose', 0.55, 1.6);
        line(mx + hv, 'green', 0.55, 1.6);
      }
    }
    if (s.step >= 3) line(s.t, 'amber', 0.8, 2);
  }

  // 모드 1: 변곡점 대칭 & 4×2 비율 격자 박스 + 수평선 y=k 스캐너
  function drawBox(b, s) {
    const { a, m, ym, delta, kLine } = s;
    let after = null;
    if (s.step >= 3 || s.playing) {
      // 끌 수 있는 수평선 손잡이는 곡선 위에 그립니다
      after = () => b.handle('k', [kHandleX(b), kLine], { color: 'violet', ref: 'k', priority: 2, label: `y = ${num(kLine)}`, dx: -14, dy: -14, align: 'right',
        drag: (w) => { s.kLine = clamp(+w.y.toFixed(2), -3.5, 3.5); } });
      b.hline(kLine, { color: 'violet', width: 2.2, glow: true, ref: 'k' });
      // a*u^3 - 3a*delta*u + (ym - kLine) = 0
      const uRoots = solveCubicRealRoots(a, 0, -3 * a * delta, ym - kLine);
      uRoots.forEach((u, idx) => {
        const rx = u + m;
        b.point([rx, kLine], { color: 'violet', r: 5, ref: 'k', label: `x${SUB[idx] || idx + 1}=${num(rx)}`, dx: 0, dy: -14, align: 'center' });
      });
    }
    if (delta <= 0.001) {
      const slopeI = evalFp(s, m);
      b.seg([m - 3, ym - slopeI * 3], [m + 3, ym + slopeI * 3], { color: 'rose', width: 2, dash: true });
      return after;
    }
    const h = Math.sqrt(delta);
    const xD = m - 2 * h, xA = m - h, xI = m, xB = m + h, xC = m + 2 * h;
    const yA = evalF(s, xA), yB = evalF(s, xB);
    const yTop = Math.max(yA, yB), yBot = Math.min(yA, yB);

    // Step 2: 4×2 비율 격자 박스
    if (s.step >= 2) {
      b.poly([[xD, yTop], [xC, yTop], [xC, yBot], [xD, yBot]], { fill: 'amber', fillAlpha: 0.07, color: 'amber', alpha: 0.78, width: 2, ref: 'box' });
      [xA, xI, xB].forEach((xv) => b.seg([xv, yTop], [xv, yBot], { color: 'amber', alpha: 0.5, width: 1.4, dash: true, ref: 'box' }));
      b.seg([xD, ym], [xC, ym], { color: 'amber', alpha: 0.5, width: 1.4, dash: true, ref: 'box' });
      const xs = [xD, xA, xI, xB, xC];
      for (let i = 0; i < 4; i++) b.text([(xs[i] + xs[i + 1]) / 2, yBot], '1', { color: 'amber', dy: -9, size: 15, weight: 850, ref: 'box' });
      b.text([xI, yTop], `한 칸 h = ${num(h)}`, { color: 'amber', dy: -28, size: 12.5, ref: 'box' });
    }
    // Step 1: 극대·극소 수평 접선 및 교점 D, C
    if (s.step >= 1) {
      b.seg([xD - 0.8, yA], [xC + 0.8, yA], { color: 'rose', width: 2, dash: true, ref: 'A' });
      b.seg([xD - 0.8, yB], [xC + 0.8, yB], { color: 'sky', width: 2, dash: true, ref: 'B' });
      b.point([xD, yB], { color: 'sky', r: 5, label: `D(${num(xD)}, ${num(yB)})`, dx: -12, dy: 20, align: 'right' });
      b.point([xC, yA], { color: 'rose', r: 5, label: `C(${num(xC)}, ${num(yA)})`, dx: 12, dy: -12 });
    }
    return after;
  }

  // 모드 2: 사선 접선의 2:1 내분 불변성
  function drawOblique(b, s) {
    const { m, ym, t } = s;
    const yt = evalF(s, t);
    const slope = evalFp(s, t);
    const q = 3 * m - 2 * t;
    const yq = evalF(s, q);
    if (s.step >= 1) {
      const x0 = Math.min(t, q) - 1.5, x1 = Math.max(t, q) + 1.5;
      b.seg([x0, yt + slope * (x0 - t)], [x1, yt + slope * (x1 - t)], { color: 'rose', width: 2.6, glow: true, ref: 'T' });
      b.point([q, yq], { color: 'sky', r: 6.5, ref: 'Q', label: Math.abs(t - m) < 1e-9 ? '변곡점에서 삼중 접촉' : s.step >= 2 ? `재교점 Q(${num(q)}, ${num(yq)})` : '재교점 Q', dx: 12, dy: 16 });
    }
    if (s.step >= 2 && Math.abs(t - m) > 1e-9) {
      const rulerY = Math.min(yt, ym, yq) - 1.4;
      b.seg([t, yt], [t, rulerY], { color: 'amber', alpha: 0.7, width: 1.6, dash: true });
      b.seg([m, ym], [m, rulerY], { color: 'violet', alpha: 0.8, width: 1.6, dash: true });
      b.seg([q, yq], [q, rulerY], { color: 'sky', alpha: 0.7, width: 1.6, dash: true });
      b.seg([t, rulerY], [m, rulerY], { color: 'amber', width: 3.2, ref: 'T' });
      b.seg([m, rulerY], [q, rulerY], { color: 'sky', width: 3.2, ref: 'Q' });
      b.text([(t + m) / 2, rulerY], '1', { color: 'amber', dy: -9, size: 15, weight: 850 });
      b.text([(m + q) / 2, rulerY], '2', { color: 'sky', dy: -9, size: 15, weight: 850 });
      b.text([t, rulerY], `x_T=${num(t)}`, { color: 'amber', dy: 18, size: 12 });
      b.text([m, rulerY], `x_I=${num(m)}`, { color: 'violet', dy: 35, size: 12 });
      b.text([q, rulerY], `x_Q=${num(q)}`, { color: 'sky', dy: 18, dx: 2, align: 'left', size: 12 });
    }
    if (s.step >= 3 && Math.abs(t - m) > 1e-9) {
      const yLineAtI = yt + slope * (m - t);
      b.point([m, yLineAtI], { color: 'violet', r: 4.5, label: '내분점 (1:2)', dx: 10, dy: -10 });
    }
  }

  // 모드 3: 접선 넓이 1/12 공식 & 변곡할선 넓이 이등분 (S₁ = S₂)
  function drawArea(b, s) {
    const { a, m, ym, delta, t } = s;
    const yt = evalF(s, t);
    const slope = evalFp(s, t);
    const q = 3 * m - 2 * t;
    const yq = evalF(s, q);
    const alpha = Math.min(t, q);
    const beta = Math.max(t, q);
    const L = beta - alpha;
    const areaS = (Math.abs(a) / 12) * Math.pow(L, 4);
    const tanY = (x) => yt + slope * (x - t);

    // Step 3: 변곡점 수평 할선에 의한 두 날개 영역 S1 = S2 (δ > 0 일 때)
    if (s.step >= 3 && delta > 0.001) {
      const d = Math.sqrt(3 * delta);
      const xL = m - d, xR = m + d;
      const wingArea = (Math.abs(a) / 4) * Math.pow(d, 4);
      region(b, (x) => evalF(s, x), () => ym, xL, m, { fill: 'sky', alpha: 0.2, ref: 'wing' });
      region(b, (x) => evalF(s, x), () => ym, m, xR, { fill: 'green', alpha: 0.2, ref: 'wing' });
      b.seg([xL, ym], [xR, ym], { color: 'violet', width: 1.8, dash: true, ref: 'wing' });
      b.text([m - d * 0.55, ym + a * Math.pow(d, 3) * 0.12], `S₁=${num(wingArea)}`, { color: 'sky', size: 12, weight: 800, ref: 'wing' });
      b.text([m + d * 0.42, ym - a * Math.pow(d, 3) * 0.26], `S₂=${num(wingArea)}`, { color: 'green', size: 12, weight: 800, ref: 'wing' });
    }
    // Step 1: 접선과 곡선 사이 색칠 영역 S
    if (s.step >= 1) {
      if (L > 0.02) region(b, (x) => evalF(s, x), tanY, alpha, beta, { fill: 'rose', alpha: 0.26, ref: 'S' });
      b.seg([alpha - 1.0, tanY(alpha - 1.0)], [beta + 1.0, tanY(beta + 1.0)], { color: 'rose', width: 2.5, glow: true, ref: 'T' });
      b.point([q, yq], { color: 'sky', r: 6, ref: 'Q', label: `Q(${num(q)}, ${num(yq)})`, dx: 12, dy: -12 });
    }
    if (s.step >= 2 && L > 0.05) {
      const midX = (alpha + beta) / 2;
      // 접선 바로 아래(색칠 영역 위쪽)에 놓아 변곡점·날개 라벨과 겹치지 않게 합니다.
      b.text([midX, tanY(midX)], `접선 넓이 S = ${num(areaS)}`, { color: 'amber', size: 14, weight: 850, dy: 20, ref: 'S' });
    }
  }

  // 모드 4 (위 칠판): 극댓값-극솟값 높이차와 탐침점 접선
  function drawSyncMain(b, s) {
    const { m, delta, t } = s;
    const yt = evalF(s, t);
    const slope = evalFp(s, t);
    if (s.step >= 3) {
      b.seg([t - 1.1, yt - slope * 1.1], [t + 1.1, yt + slope * 1.1], { color: 'amber', width: 2.5, glow: true, ref: 'T' });
    }
    if (delta > 0.001 && s.step >= 2) {
      const h = Math.sqrt(delta);
      const xA = m - h, xB = m + h;
      const yA = evalF(s, xA), yB = evalF(s, xB);
      const xr = m + 2 * h + 0.45; // 곡선의 오른쪽 가지(C)보다 바깥에 놓아 곡선과 겹치지 않게
      b.seg([xA, yA], [xr, yA], { color: 'rose', alpha: 0.65, width: 1.8, dash: true, ref: 'dy' });
      b.seg([xB, yB], [xr, yB], { color: 'sky', alpha: 0.65, width: 1.8, dash: true, ref: 'dy' });
      b.seg([xr, yA], [xr, yB], { color: 'rose', width: 3, ref: 'dy' });
      barLabel(b, xr, (yA + yB) / 2, `극값 차 Δy = ${num(Math.abs(yA - yB))}`, 'rose', 'dy');
    }
  }

  // 모드 5: 곡선 밖의 점 P(x₀, y₀)에서 그은 접선 개수 (1·2·3개 영역)
  function drawExternal(b, s) {
    const { m, ym, a } = s;
    const vb = b.viewBox();
    const minX = vb.x0 - 0.5;
    const maxX = vb.x1 + 0.5;
    const fx = (x) => evalF(s, x);
    const gx = (x) => evalInflectionTangent(s, x);
    // Step 2: 3개 영역(초록) vs 1개 영역(파랑) — 곡선과 변곡접선 사이가 '접선 3개' 영역
    if (s.step >= 2) {
      region(b, fx, gx, minX, maxX, { fill: 'green', alpha: 0.2, ref: 'region' });
      const mid = (x) => (fx(x) + gx(x)) / 2;
      // 좁은 화면에서는 양끝 라벨을 무대 안쪽으로 정렬해 문장이 잘리지 않게 합니다.

  /* ===== 변형 2 · 기울어진 접선의 2 : 1 내분 ===== */
  const CB2 = [{ a: 1, d: 2, ym: 0 }, { a: 1, d: 0, ym: 1 }, { a: 1, d: 0, ym: 0 }, { a: 1, d: 2, ym: -1 }, { a: 1 / 2, d: 3, ym: 0 }, { a: 1 / 2, d: 1, ym: 1 }, { a: 1 / 2, d: -1, ym: 0 }, { a: 1 / 2, d: 3, ym: 1 }];

      const m = cxPick([-1, 0, 1, 2]), c = cxPick(CB2), t = m + cxPick([-2, -1, 1, 2]);

  const text2 = (v) => (v.first ? examData[2].question() : `삼차함수 ${cbFx(v.F)} 위의 점 ${tex(`T(${v.t}, ${cxNum(v.yT)})`)}에서의 접선 ${tex('l')}이 곡선 ${tex('y = f(x)')}와 다시 만나는 점을 ${tex('Q(q, f(q))')}라 할 때, 점 ${tex('Q')}의 ${tex('x')}좌표 ${tex('q')}와 접선 ${tex('l')}의 기울기를 구하시오.`);
  const ans2 = (v) => (v.first ? examData[2].answerBadge() : `${tex(`q = ${v.q}, \\; Q(${v.q}, ${cxNum(v.yQ)})`)}, 기울기 ${tex(`= ${cxNum(v.slope)}`)}`);
  const std2 = (v) => {

      steps: `① 도함수 ${tex(`f'(x) = ${cxPoly([3 * v.F.a, -6 * v.F.a * v.m, 3 * v.F.a * (v.m * v.m - v.F.d)])}`)} 에 ${tex(`x = ${v.t}`)} 대입: ${tex(`f'(${v.t}) = ${cxNum(v.slope)}`)}<br/>
② 점 ${tex(`T(${v.t}, ${cxNum(v.yT)})`)}에서의 접선의 방정식 작성: ${tex(tl)}<br/>
③ 원래 삼차함수와 연립하여 이항:<br/>
&nbsp;&nbsp;${tex(`f(x)-(${tl.slice(2)})=${cbKs(v.F.a)}${cxXm(v.t)}^2${cxXm(v.q)}=0`)}<br/>
④ 중근 ${tex(`x = ${v.t}`)} 을 제외한 나머지 실근 ${tex(`q = ${v.q}`)} 을 얻습니다. (${tex('f(x)')} 와 접선의 차는 ${tex(`a(x-t)^2(x-q)`)} 꼴)`,
      warning: examData[2].textbook().warning

  };
  const quick2 = (v) => {

② 접점 ${tex('t')}는 중근이므로 <strong class="text-pink-300">${tex('2t + q = 3m')}</strong> 입니다. 즉 ${tex('m')}이 ${tex('T')}와 ${tex('Q')}의 ${tex('x')}좌표를 <strong class="text-amber-300">${tex('1 : 2')} 로 내분</strong>합니다.<br/>
③ 이 문제에서 ${tex(`m = ${v.m}`)}, 접점 ${tex(`t = ${v.t}`)} 을 대입하면 ${tex(`2(${v.t}) + q = 3(${v.m})`)} 이므로, 연립하지 않고도 <strong class="text-amber-300">${tex(`q = ${v.q}`)}</strong> 입니다. 기울기는 ${tex(`f'(${v.t})=${cxNum(v.slope)}`)}.`,

    if (st >= 2) b.point([v.m, v.yI], { color: 'violet', r: 5, ref: 'I', label: 'I', dx: 9, dy: -10 });
    if (st >= 3) b.point([v.m, v.yT + v.slope * (v.m - v.t)], { color: 'green', r: 5, label: '내분점 (1:2)', dx: v.slope > 0 ? -10 : 10, dy: v.slope > 0 ? -12 : -12, align: v.slope > 0 ? 'right' : 'left' });

  /* ===== 변형 3 · 접선과의 넓이 · 대칭의 중심을 지나는 수평선(x축)과의 넓이 ===== */
  const CB3 = [[1, 1], [1 / 2, 1], [1 / 2, 2], [1 / 3, 3], [2, 1]];
  function mk3(first, a, d, m, t) {
    const F = { a, m, d, ym: 0 }, f = cbF(F), fp = cbFp(F), q = 3 * m - 2 * t, r = Math.sqrt(3 * d);
    const yT = f(t), yQ = f(q), slope = fp(t), L = 3 * Math.abs(t - m);
    const S = Math.abs(a) * Math.pow(L, 4) / 12, W = 9 * Math.abs(a) * d * d / 4;
    const ext = 2 * Math.abs(a) * Math.pow(d, 1.5);
    const ruler = Math.min(yT, yQ, -ext) - 1.2;
    const win = cxWin([[t, yT], [q, yQ], [m - r, 0], [m + r, 0], [m, ext], [m, -ext], [Math.min(t, q), ruler - 1.0]], { mx: 1.2, my: 0.8 });
    return { first, F, f, a, d, m, t, q, r, yT, yQ, slope, L, S, W, ruler, win };
  }
  const var3 = cxVarier((prev) => {
    if (!prev) return Object.assign(mk3(true, 1, 1, 1, 0), { win: { x: [-0.9, 3.9], y: [-3.8, 3.8] } });
    for (let tr = 0; tr < 500; tr++) {
      const [a, d] = cxPick(CB3), m = cxPick([-1, 0, 1, 2]), t = m + cxPick([-2, -1, 1, 2]);
      const v = mk3(false, a, d, m, t);
      if (cbTall(v.win, 1.3) || Math.abs(v.q - v.m) > 4.1 || Math.abs(v.yQ) > 40 || !cbNice(v.F)) continue;
      if (prev && prev.a === a && prev.d === d && prev.m === m && prev.t === t) continue;
      return v;
    }
    return prev;
  });
  const text3 = (v) => (v.first ? examData[3].question() : `삼차함수 ${cbFx(v.F)} 위의 점 ${tex(`A(${v.t}, ${cxNum(v.yT)})`)}에서의 접선과 곡선으로 둘러싸인 넓이 ${tex('S')}와, 곡선과 ${tex('x')}축(대칭의 중심 ${tex(`(${v.m}, 0)`)}을 지나는 수평선)으로 둘러싸인 두 부분의 넓이의 합 ${tex('S_1 + S_2')}를 각각 구하시오.`);
  const ans3 = (v) => (v.first ? examData[3].answerBadge() : `접선과의 넓이 ${tex(`S = ${cxNum(v.S)}`)}, x축과의 넓이 ${tex(`= ${cxNum(2 * v.W)}`)}`);
  const std3 = (v) => {
    if (v.first) return examData[3].textbook();
    return {
      steps: `① 점 ${tex(`A(${v.t}, ${cxNum(v.yT)})`)}에서의 접선과 곡선의 차는 ${tex(`f(x)-(\\text{접선})=${cbKs(v.a)}${cxXm(v.t)}^2${cxXm(v.q)}`)} 이므로 접점과 다시 만나는 점의 ${tex('x')}좌표는 ${tex(`${v.t},\\; ${v.q}`)}<br/>
② ${tex(`S=\\left|\\int_{${Math.min(v.t, v.q)}}^{${Math.max(v.t, v.q)}} ${cbKs(v.a)}${cxXm(v.t)}^2${cxXm(v.q)}\\,dx\\right|=\\dfrac{|a|}{12}(${v.L})^4=${cxNum(v.S)}`)} (${tex('\\frac{(q-t)^4}{12}')} 로 계산)<br/>
③ 대칭의 중심의 ${tex('x')}좌표 ${tex(`${v.m}`)}을 기준으로 ${tex(`u=x${cxSub(v.m)}`)}이라 두면 ${tex(`f(x)=${cbKs(v.a)}u(u^2-${3 * v.d})`)}. 근은 ${tex(`u=0,\\pm\\sqrt{${3 * v.d}}`)}이고 좌우 부분은 점 ${tex(`(${v.m}, 0)`)}에 대하여 대칭이다. 한쪽 넓이는 ${tex(`\\dfrac{|a|}{4}(${3 * v.d})^2=${cxNum(v.W)}`)}이므로 ${tex(`S_1+S_2=${cxNum(2 * v.W)}`)}이다.`,
      warning: examData[3].textbook().warning
    };
  };
  const quick3 = (v) => {
    if (v.first) return examData[3].shortcut();
    return {
      steps: `① 접점과 재교점의 ${tex('x')}좌표가 ${tex(`\\alpha=${v.t},\\;\\beta=${v.q}`)}이면 (α는 접점이며 좌우 순서와 무관) 접선과 함수의 차가 ${tex('a(x-\\alpha)^2(x-\\beta)')}로 인수분해된다. 접점에서 재교점까지 방향을 따라 $x=\\alpha+(\\beta-\\alpha)u$로 치환하면 $S=|a|\\,|\\beta-\\alpha|^4\\int_0^1u^2(1-u)du$이고 적분값은 $1/12$입니다. 따라서 넓이는 <strong class="text-pink-300">${tex(`S = \\dfrac{|a|}{12}(\\beta - \\alpha)^4 = \\dfrac{${cxNum(Math.abs(v.a))}}{12} \\times ${v.L}^4 = ${cxNum(v.S)}`)}</strong> 이다.<br/>
② 이 문항은 x축과의 세 교점이 점 ${tex(`(${v.m}, 0)`)}에 대하여 대칭인 경우다. 각 교점까지의 간격은 ${tex(`d=\\sqrt{${3 * v.d}}`)}이고 한쪽 넓이는 ${tex('S_1=S_2=\\frac{|a|d^4}{4}')}이다.<br/>
③ 따라서 ${tex(`S_1 + S_2 = 2 \\times \\dfrac{${cxNum(Math.abs(v.a))}}{4}\\times ${9 * v.d * v.d} = ${cxNum(2 * v.W)}`)} 이다.`,
      highlight: examData[3].shortcut().highlight
    };
  };
  function draw3(b, s, lab) {

    cbBase(b, s, v.win, 'c3v' + v.sid);
    const al = Math.min(v.t, v.q), be = Math.max(v.t, v.q), tanY = (x) => v.yT + v.slope * (x - v.t);
    if (st >= 3) {

    }
    if (st >= 2) {
      const R = v.ruler;
      b.seg([al, tanY(al)], [al, R], { color: 'amber', alpha: 0.7, width: 1.5, dash: true, ref: 'S' });
      b.seg([be, tanY(be)], [be, R], { color: 'amber', alpha: 0.7, width: 1.5, dash: true, ref: 'S' });
      b.seg([al, R], [be, R], { color: 'amber', width: 3.2, ref: 'S' });
      cxTag(b, [(al + be) / 2, R], `L = |β − α| = ${v.L}`, { color: 'amber', dy: 20, size: 12.5, ref: 'S' });
    }
    b.plot(f, { color: 'ink', width: 3.2, glow: true });
    cxCurveTag(b, f, 'y = f(x)', 'ink', { side: 'left', dy: 14, skip: [[v.t, v.yT, 1.5], [v.q, v.yQ, 1.5]], axis: 0.7, ymin: v.ruler + 1.6 });
    b.point([v.t, v.yT], { color: 'amber', r: 6.5, ref: 'T', label: `A(${cxN(v.t)}, ${cxN(v.yT)})`, dx: v.slope > 0 ? -10 : 10, dy: -13, align: v.slope > 0 ? 'right' : 'left' });
    if (st >= 1) b.point([v.q, v.yQ], { color: 'sky', r: 6, ref: 'Q', label: `Q(${cxN(v.q)}, ${cxN(v.yQ)})`, dx: v.slope > 0 ? -10 : 10, dy: -13, align: v.slope > 0 ? 'right' : 'left' });
    if (st >= 3) {
      cxTag(b, [v.m - v.r * 0.55, 0], `S₁ = ${cxNum(v.W).replace(/\\dfrac\{(\d+)\}\{(\d+)\}/, '$1/$2')}`, { color: 'sky', size: 12, dy: v.a > 0 ? 26 : -22, ref: 'wing' });
      cxTag(b, [v.m + v.r * 0.55, 0], `S₂ = ${cxNum(v.W).replace(/\\dfrac\{(\d+)\}\{(\d+)\}/, '$1/$2')}`, { color: 'green', size: 12, dy: v.a > 0 ? -22 : 26, ref: 'wing' });
    }
    if (st >= 3) cxTag(b, [(al + be) / 2, v.ruler], `접선 넓이 S = ${cxNum(v.S).replace(/\\dfrac\{(\d+)\}\{(\d+)\}/, '$1/$2')}`, { color: 'amber', size: 13, dy: 40, ref: 'S' });

  /* ===== 변형 4 · f(x)와 f′(x)를 위아래로: 도함수의 넓이 = 극값의 차 ===== */
  const CB4 = [[1, 1], [1 / 2, 1], [1 / 4, 2]]; // 두 그래프를 위아래로 놓아도 핵심 그림이 너무 작아지지 않는 크기만
  function mk4(first, a, h, m, ym) {

② 도함수와 ${tex('x')}축 사이의 정적분 계산:<br/>
&nbsp;&nbsp;${tex(`S_d = \\displaystyle\\int_{${v.xa}}^{${v.xb}} (-f'(x))\\,dx = \\dfrac{|3a|}{6}(\\beta-\\alpha)^3 = ${cxNum(v.dy)}`)}<br/>
③ 함수 ${tex('f(x)')}의 극댓값 ${tex(`f(${v.xa}) = ${cxNum(v.ym + v.e)}`)}, 극솟값 ${tex(`f(${v.xb}) = ${cxNum(v.ym - v.e)}`)}를 따로 구해 빼면 ${tex(`${cxNum(v.ym + v.e)} - (${cxNum(v.ym - v.e)}) = ${cxNum(v.dy)}`)} 입니다.`,
      warning: examData[4].textbook().warning

  const quick4 = (v) => {
    if (v.first) return examData[4].shortcut();

      steps: `① 정적분의 정의에 의해 ${tex("\\int_{\\alpha}^{\\beta} f'(x)\\,dx = f(\\beta) - f(\\alpha)")} 이므로 <strong class="text-sky-300">【 도함수 ${tex("f'(x)")}와 ${tex('x')}축 사이의 넓이 = 함수 ${tex('f(x)')}의 극댓값과 극솟값의 차 ${tex('\\Delta y')} 】</strong> 입니다.<br/>
② 이차함수 ${tex("f'(x) = 3a(x-\\alpha)(x-\\beta)")} 와 ${tex('x')}축 사이의 넓이 공식에 의해:<br/>

③ ${tex(`a = ${cxNum(v.a)}, \\; \\beta - \\alpha = ${2 * v.h}`)} 를 대입하면 <strong class="text-emerald-300">${tex(`S_d = \\Delta y = \\dfrac{${cxNum(v.a)}}{2} \\times ${2 * v.h}^3 = ${cxNum(v.dy)}`)}</strong> 입니다.`,

  /* ===== 변형 5 · 곡선 밖의 점에서 그은 접선의 개수 ===== */
  const CB5 = [[1, 1], [1, 2], [2, 1], [1 / 2, 2]];
  const cnt5 = (F, px, py) => { // 접선의 개수: 곡선·변곡점 접선과의 위치로 (정확히 비교)
    const f = cbF(F), L = F.ym - 3 * F.a * F.d * (px - F.m);
    if (Math.abs(px - F.m) < 1e-9) return 1;
    const dF = py - f(px), dL = py - L, eps = 1e-9;
    if (Math.abs(dF) < eps || Math.abs(dL) < eps) return 2;
    return dF * dL < 0 ? 3 : 1;
  };
  function mk5(first, a, d, m, ym, px, py) {
    const F = { a, m, d, ym }, f = cbF(F), n = cnt5(F, px, py);
    const sl = -3 * a * d, g = (x) => ym + sl * (x - m);
    const cts = getTangentContactsFromPoint({ a, m, ym, delta: d }, px, py);
    const win = cxWin([[m - 2.6, ym], [m + 2.6, ym], [px, py], [m, ym - 2.3], [m, ym + 2.3], ...cts.map((tv) => [tv, f(tv)])], { mx: 1.3, my: 1.0, minW: 7, minH: 6 });
    return { first, F, f, a, d, m, ym, px, py, n, g, sl, win };
  }
  const var5 = cxVarier((prev) => {
    if (!prev) return Object.assign(mk5(true, 1, 1, 1, 0, 2, 2), { win: { x: [-1.0, 3.0], y: [-3.8, 3.8] } });
    const want = cxPick([3, 1, 3, 1, 2], prev.n === 2 ? 2 : prev.n === 3 ? 3 : 1);
    for (let tr = 0; tr < 1500; tr++) {
      const [a, d] = cxPick(CB5), m = cxPick([-1, 0, 1, 2]), ym = cxPick([0, 0, 1, -1]);
      let px = m + cxPick([-3, -2, -1, 1, 2, 3]), py = ym + cxRint(11) - 5;
      const F = { a, m, d, ym };
      if (want === 2 && tr % 2) py = cxPick([cbF(F)(px), ym - 3 * a * d * (px - m)]);
      if (!Number.isInteger(+py.toFixed(9))) continue;
      py = Math.round(py);
      if (cnt5(F, px, py) !== want) continue;
      const v = mk5(false, a, d, m, ym, px, py);
      if (cbTall(v.win, 1.35) || !cbNice(F)) continue;

    }

  const text5 = (v) => (v.first ? examData[5].question() : `좌표평면 위의 점 ${tex(`P(${v.px}, ${v.py})`)}에서 삼차함수 ${cbFx(v.F)}의 그래프에 그을 수 있는 서로 다른 접선의 개수를 구하시오.`);

  };
  const std5 = (v) => {
    if (v.first) return examData[5].textbook();
    const u0 = v.px - v.m, v0 = v.py - v.ym, C0 = 3 * v.a * v.d * u0 + v0, C1 = C0 - v.a * u0 * u0 * u0;
    return {
      steps: `① 곡선 위의 접점을 ${tex('(t, f(t))')} 로 두고 ${tex(`u=t${cxSub(v.m)}`)} 로 놓습니다. 접선의 방정식에 점 ${tex(`P(${v.px}, ${v.py})`)} 를 대입하면<br/>
&nbsp;&nbsp;${tex(`g(u)=${cxNum(2 * v.a)}u^3-${cxNum(3 * v.a * u0)}u^2+${cxNum(C0)}=0`.replace('+-', '-').replace('--', '+'))}<br/>
② ${tex(`g'(u)=${cxNum(6 * v.a)}u(u-${u0})`.replace('-(-', '+(').replace('--', '+'))} 이므로 극값은 ${tex(`g(0)=${cxNum(C0)}`)}, ${tex(`g(${u0})=${cxNum(C1)}`)}<br/>
③ 두 극값의 부호가 ${C0 * C1 < 0 ? '서로 다르면 서로 다른 실근이 3개' : (C0 === 0 || C1 === 0 || Math.abs(C0) < 1e-9 || Math.abs(C1) < 1e-9) ? '하나라도 0이면 서로 다른 실근이 2개' : '같으면 서로 다른 실근이 1개'}입니다. 따라서 접선은 <strong>${tex(String(v.n))}개</strong>입니다.`,
      warning: examData[5].textbook().warning
    };
  };
  const quick5 = (v) => {
    const w = where5(v);
    return {
      steps: `① 중심 ${tex(`I(${v.m},${v.ym})`)}에서의 접선은 ${tex('l(x)='+cxPoly([v.sl,v.ym-v.sl*v.m]))}입니다. 접점의 방정식 ${tex("G(t)=f(t)+f'(t)(x_P-t)-y_P=0")}의 도함수는 ${tex("G'(t)=f''(t)(x_P-t)")}.<br/>② ${tex('x_P\\ne m')}이면 극값의 부호는 ${tex('f(x_P)-y_P')}와 ${tex('l(x_P)-y_P')}의 부호입니다. 두 경계 사이이면 부호가 달라 3개, 경계 위이면 중근을 한 번 세어 2개, 그 밖이면 1개입니다. ${tex('x_P=m')}이면 G가 단조인 삼차식이므로 중심 I를 포함하여 1개입니다.<br/>③ 지금 두 높이는 ${tex(cxNum(w.fx))}, ${tex(cxNum(w.lx))}이고 P는 ${w.text}에 있습니다. 따라서 접선은 ${tex(String(v.n))}개입니다.`,
      highlight: '접점의 삼차방정식을 직접 풀지 않고 그 극값의 부호를 두 경계의 높이로 읽습니다. 경계 및 중심점의 예외까지 확인합니다.'
    };
  };
  function draw5(b, s, lab) {
    const v = var5.cur(), st = cbStepsOf(lab, s), f = v.f, g = v.g;
    cbBase(b, s, v.win, 'c5v' + v.sid);

    b.plot(f, { color: 'ink', width: 3.2, glow: true });
    cxCurveTag(b, f, 'y = f(x)', 'ink', { side: 'left', dy: 14, skip: [[v.px, v.py, 1.5], ...allC.map((tv) => [tv, f(tv), 1.5])], axis: 0.7 });
    if (st >= 1) {
      b.point([v.m, v.ym], { color: 'violet', r: 5, ref: 'infl', label: `I(${cxN(v.m)}, ${cxN(v.ym)})`, dx: -9, dy: -14, align: 'right' });
    }
    contacts.forEach((tv, idx) => {
      const col = ['rose', 'sky', 'amber'][idx % 3];

  const VARS = {
    1: { vary: var1, text: text1, answer: ans1, std: std1, quick: quick1, draw: draw1 },

  /* ---------- 6. 장면 정의 ---------- */
  const TICK = {

  };
  const tickT = (s, dt) => { if (!s.playing) return false; bounce(s, 't', 1.32, -0.55, 2.35, dt); return true; };

  function cbProblemSteps(m, v) {
    if (m === 1) return [
      `극점 A, B의 중점 I를 대칭의 중심으로 봅니다. $x_A=${v.xA}$, $x_B=${v.xB}$이므로 $m=${v.m}$, 한 칸의 간격은 $h=${v.h}$입니다.`,
      `극점에서 그은 접선은 수평입니다. 접점이 중근이므로 $2x_A+x_C=3m$, $2x_B+x_D=3m$. 따라서 $x_C=${v.xC}$, $x_D=${v.xD}$이고 D,A,I,B,C의 가로 간격은 모두 h입니다.`,

    ];
    if (m === 2) return [
      `T에서 접선을 그어 다른 교점 Q를 찾고, 변곡점 I의 가로좌표 $m=${v.m}$를 표시합니다. 접선과 곡선의 차에서 T는 중근입니다.`,
      `삼차식의 이차항은 직선을 빼도 그대로이므로 근과 계수의 관계가 $2t+q=3m$입니다. 이를 $q-m=-2(t-m)$으로 쓰면 I를 기준으로 두 점이 반대쪽에 있고 가로 거리비가 1:2임을 알 수 있습니다.`,
      `$t=${v.t}$를 대입하면 $q=${v.q}$, $Q=(${v.q},${cxNum(v.yQ)})$. 접선의 기울기는 $f^{\\prime}(${v.t})=${cxNum(v.slope)}$. 이 문제는 t≠m이며, t=m이면 삼중 접촉만 남아 별도의 Q가 없습니다.`
    ];
    if (m === 3) return [

      const u=clamp(Number(shown.lcuTrace)||0,0,1);
      let traced=false;
      if (!s.lessonEntry && u && !b._bbox) for (const {fn,options} of curves) {
        const box=b.viewBox(),lo=Math.max(box.x0,options.from??-Infinity),hi=Math.min(box.x1,options.to??Infinity),xs=[];
        for (let i=0;i<=120;i++) {const x=lo+(hi-lo)*i/120,y=fn(x);if(Number.isFinite(y)&&y>box.y0&&y<box.y1)xs.push(x);}
        if(xs.length>1){const x=xs[0]+(xs.at(-1)-xs[0])*u,y=fn(x);if(Number.isFinite(y)&&y>box.y0&&y<box.y1){b.point([x,y],{color:'violet',r:5,glow:false});traced=true;}break;}
      }
      const xy=p=>[p.x??p[0],p.y??p[1]];
      if(!s.lessonEntry&&u&&!traced&&!b._bbox){
        const segment=paths.find(ps=>ps.length>=2);
        if(segment){const z=Math.min(segment.length-2,Math.floor(u*(segment.length-1))),t=u*(segment.length-1)-z,p=xy(segment[z]),q=xy(segment[z+1]);b.point([p[0]+(q[0]-p[0])*t,p[1]+(q[1]-p[1])*t],{color:'violet',r:5,glow:false});}
        else if(points.length){b.point(xy(points[Math.min(points.length-1,Math.floor(u*points.length))]),{color:'violet',r:5,glow:false});}
        else if(rects.length){const [x,y,w,h]=rects[0],q=b.toW(x+u*w,y);b.point([q.x,q.y],{color:'violet',r:5,glow:false});}
      }
    };
  }
  const lessons=window.APL_CU_LESSONS?window.APL_CU_LESSONS.install(lessonScenes,lessonSource):{};

  APLab.createLab({
    stagedReveal: true,
    id: 'calc1-cubic',
    title: '삼차함수 비율관계',
    courseName: '미적분Ⅰ',
    unit: '미분 · 삼차함수 비율관계',
    courseColor: 'var(--m-orange)',
    home: '../index.html#calc1',
    legacy: '../../labs/미적분1/삼차함수 비율관계.html',
    board: { kind: 'cartesian', focus: focusFor(VIEW[1], false) },
    params: lessonParams,
    state: { dual: false, animDir: 1 },
    persist: ['dual'],
    lessons,
    scenes
  });
});
