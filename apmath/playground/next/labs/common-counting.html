<!DOCTYPE html>

<body>
<noscript>이 실험실을 보려면 브라우저에서 자바스크립트를 켜야 합니다.</noscript>
<script>
/* ==========================================================================
   공통수학 · 순열과 조합 (AP Math Lab 2.0 신규 실험실) — 경우의 수 7개 장면
   1 합의 법칙·곱의 법칙과 수형도 · 2 순열 nPr 자리 채우기 · 3 이웃하는/이웃하지 않는 순열 · 4 조합 nCr(순서를 지우면 r!개가 하나로)
   5 도형의 개수 세기(원 위의 점·평행선) · 6 표·상자에 놓는 경우의 수(경우 나누기) · 7 원순열(이전 교육과정)
   - 학생이 공식을 외우기 전에 그림에서 직접 세고 쌓아 보게 합니다. 화면에 그려진 개수와 공식 값은 항상 같게 만듭니다
     (그림에 그린 경우를 코드로 모두 나열해 센 값이 공식 값과 다르면 개발 검사에서 걸립니다).
   - 탭마다: 탐구 = 조작하는 그림 전체 · 정리 = 문제의 풀이를 단계별로(문제 그림 위에 보조 표시를 얹음) · 문제 = 주어진 것만(답·보조선은 그리지 않음)
   - 문제는 기출 유형의 숫자·상황을 바꾼 변형이며 「새 문제」로 바꿉니다(정답이 깔끔한 것만, 연속해서 같은 문제는 나오지 않음).
   ========================================================================== */
window.addEventListener('DOMContentLoaded', function () {
  const tex = APLab.tex;
  const { clamp } = APLab;

  /* ===================== 세기 도구 ===================== */
  const fact = (n) => (n <= 1 ? 1 : n * fact(n - 1));
  const nPr = (n, r) => { let p = 1; for (let i = 0; i < r; i++) p *= n - i; return p; };
  const nCr = (n, r) => (r < 0 || r > n ? 0 : nPr(n, r) / fact(r));
  const combos = (n, r) => { const out = []; (function rec(s, cur) { if (cur.length === r) { out.push(cur.slice()); return; } for (let i = s; i < n; i++) { cur.push(i); rec(i + 1, cur); cur.pop(); } })(0, []); return out; };
  const LET = 'ABCDEFGHIJ'.split('');
  const PCOL = ['sky', 'rose', 'amber', 'green', 'violet', 'orange', 'red', 'muted'];
  const rint = (n) => Math.floor(Math.random() * n);
  const pickOf = (arr, not) => { let x; do x = arr[rint(arr.length)]; while (arr.length > 1 && x === not); return x; };
  const varier = (gen) => { let cur = gen(null); return { cur: () => cur, next: () => (cur = gen(cur)) }; };
  const join = (a, sep = ', ') => a.join(sep);
  const T = (s) => '$' + s + '$';
  const ordinal = ['첫째', '둘째', '셋째', '넷째', '다섯째'];

  /* ===================== 그리기 도구 =====================
     레이아웃 좌표는 x 오른쪽, y 아래쪽(문서 방향)으로 생각하고, 무대(cartesian, y 위쪽)에 넘길 때만 뒤집습니다. */
  const P = (x, y) => ({ x, y: -y });
  const seg = (b, x1, y1, x2, y2, o) => b.seg(P(x1, y1), P(x2, y2), o);
  const poly = (b, pts, o) => b.poly(pts.map((q) => P(q[0], q[1])), o);
  const circ = (b, x, y, r, o) => b.circle(P(x, y), r, o);
  const txt = (b, x, y, s, o = {}) => b.text(P(x, y), s, { size: 14, weight: 800, align: 'center', baseline: 'middle', ...o });
  const rect = (b, x, y, w, h, o) => poly(b, [[x, y], [x + w, y], [x + w, y + h], [x, y + h]], o); // 왼쪽 위가 (x,y)
  const rrect = (b, cx, cy, w, h, o) => rect(b, cx - w / 2, cy - h / 2, w, h, o);
  // 사람·카드 토큰: 옅은 색 면 + 색 테두리 + 글자
  function token(b, x, y, r, label, color, o = {}) {
    const dim = o.dim, hot = o.hot;
    circ(b, x, y, r, { fill: color, fillAlpha: dim ? 0.07 : hot ? 0.55 : 0.26, color, alpha: dim ? 0.35 : 1, width: hot ? 3 : 2.2, dash: o.dash });
    txt(b, x, y, label, { size: o.size || 14, color: dim ? 'muted' : 'ink' });
  }
  function tile(b, cx, cy, w, h, label, color, o = {}) {
    const dim = o.dim, hot = o.hot;
    rrect(b, cx, cy, w, h, { fill: color, fillAlpha: dim ? 0.06 : hot ? 0.5 : 0.22, color, alpha: dim ? 0.35 : 1, width: hot ? 3 : 2, dash: o.dash });
    if (label != null && label !== '') txt(b, cx, cy, label, { size: o.size || 13.5, color: dim ? 'muted' : 'ink' });
  }
  // 그림이 들어오는 최대 배율로 무대를 맞춥니다(라벨 글자 상자까지 재서 잘리지 않게). 사용자의 확대·이동은 유지.
  function figure(b, body, fo) {
    HIT.length = 0;
    const bb = b.measure(body);
    if (bb) b.setFocus(b.fitBox(bb, { margin: 0.05, px: 10, ...fo }), false);
    body();
  }
  /* 무대 위 누르기: 이번 프레임에 그린 칸(hit)을 기억해 두었다가 손가락을 떼면 눌린 칸의 동작을 실행합니다. */
  const HIT = [];
  const hit = (b, x, y, w, h, fn) => { if (!b._bbox) HIT.push({ x, y, w, h, fn }); }; // 재는 중(measure)에는 기록하지 않음
  let LAB = null;
  function bindTap(canvas, b) {
    if (canvas.__tapBound) return;
    canvas.__tapBound = true;
    let d = null;
    canvas.addEventListener('pointerdown', (e) => { d = { x: e.clientX, y: e.clientY, t: performance.now() }; });
    canvas.addEventListener('pointerup', (e) => {
      if (!d) return;
      const mv = Math.hypot(e.clientX - d.x, e.clientY - d.y), dt = performance.now() - d.t;
      d = null;
      if (mv > 7 || dt > 700 || !LAB || LAB.tab !== 'explore') return;
      const r = canvas.getBoundingClientRect();
      const w = b.toW(e.clientX - r.left, e.clientY - r.top);
      const x = w.x, y = -w.y;
      for (let i = HIT.length - 1; i >= 0; i--) {
        const h = HIT[i];
        if (x >= h.x && x <= h.x + h.w && y >= h.y && y <= h.y + h.h) { h.fn(LAB.s); LAB.invalidate(true); return; }
      }
    });
  }
  // 슬라이더의 끝값이 장면 상태에 따라 바뀔 때(예: 세어야 할 개수) 막대 범위를 맞춥니다
  function setMax(lab, id, max) {
    const p = lab.params[id];
    if (!p) return;
    p.max = max;
    const c = lab._ctls && lab._ctls[id];
    if (c) c.input.max = String(max);
    if (lab.s[id] > max) lab.s[id] = max;
  }
  const probHTML = (body) => `${body}<div style="margin-top:10px"><button type="button" class="apl-btn sm" data-cn-new>새 문제</button></div>`;
  document.addEventListener('click', (ev) => {
    const hitEl = ev.target && ev.target.closest && ev.target.closest('[data-cn-new]');
    if (!hitEl) return;
    const lab = window.lab, sc = lab && lab.scene;
    if (!sc || !sc.vary) return;
    sc.vary.next();
    lab.s.revealed = false;
    lab.setStep(0);
    try { lab._buildReview(); } catch (e) { /* 키트가 바뀌어도 그림은 그대로 */ }
    lab.invalidate(true);
  });
  // 탐구의 자유조작 수치는 새 문제의 조건과 별개다. 문제·정리에는 해당 변형의 그림과 단계만 쓴다.
  const baseScene = (o) => ({
    tabs: { compact: true }, ...o,
    view: (s, lab) => {
      const v = o.view ? o.view(s, lab) : {};
      if (!lab || lab.tab === 'explore') return v;
      return { chips: v.chips || [], readouts: [], status: null, guide: '', parts: [], summary: '', rule: '', formula: '',
        notes: lab.tab === 'review' && s.step >= 3 ? v.notes : '' };
    }
  });
  const ring = (b, x, y, w, h, color = 'amber') => rrect(b, x, y, w, h, { fill: null, color, width: 3, alpha: 0.95 });
  // 후보 수를 세로로 쌓은 점(줄어드는 후보 그림): 아래에서부터 count개
  function dotsColumn(b, x, yBottom, count, color, o = {}) {
    const gap = o.gap || 0.34;
    for (let j = 0; j < count; j++) circ(b, x, yBottom - j * gap, 0.13, { fill: color, fillAlpha: o.alpha || 0.85, color, width: 1, alpha: 0.9 });
  }
  // 문제 풀이 단계에서 쓰는 지금 단계(상태 s는 problemState로 문제 탭에서는 0)
  // 문제 탭 그림: 풀이 단계·강조를 끄고 문제에 주어진 것만 보여 줍니다(정리 탭은 단계에 따라 보조 표시가 늘어남)
  const pState = (lab, s, patch = {}) => (lab && lab.tab === 'problem' ? { ...s, step: 0, part: 0, ...patch } : s);

  /* ============================================================================================
     장면 1 · 합의 법칙·곱의 법칙과 수형도
     탐구: 수형도의 가지를 슬라이더로 하나씩 펼치며 센다 · 정리/문제: 길 찾기(합+곱)와 주사위 눈의 합(합의 법칙)
     ============================================================================================ */
  const TOPS = ['A', 'B', 'C', 'D'], PANTS = ['1', '2', '3', '4'];
  const total1 = (s) => (s.mode1 === 'prod' ? s.aP * s.bP : s.aS + s.bS);
  function draw1Explore(b, s) {
    const prod = s.mode1 === 'prod';
    const a = prod ? s.aP : s.aS, c = prod ? s.bP : s.bS, k = s.k1, tot = total1(s);
    figure(b, () => {
      const dy = 0.95;
      if (prod) {
        const rows = a * c, rootY = ((rows - 1) / 2) * dy, X0 = 0, X1 = 3.4, X2 = 6.9;
        txt(b, X1, -1.2, `윗옷 ${a}가지`, { size: 13.5, color: 'sky' });
        txt(b, X2 + 0.2, -1.2, `바지 ${c}가지`, { size: 13.5, color: 'green' });
        for (let j = 0; j < a; j++) {
          const my = (j * c + (c - 1) / 2) * dy, any = j * c < k;
          seg(b, X0, rootY, X1, my, { color: 'sky', width: any ? 2.6 : 1.4, alpha: any ? 0.95 : 0.22, dash: any ? null : [4, 5] });
          for (let l = 0; l < c; l++) {
            const i = j * c + l, open = i < k, ly = i * dy;
            seg(b, X1, my, X2 - 0.8, ly, { color: 'green', width: open ? 2.4 : 1.2, alpha: open ? 0.95 : 0.2, dash: open ? null : [4, 5] });
            tile(b, X2 + 0.2, ly, 1.6, 0.74, TOPS[j] + PANTS[l], open ? 'green' : 'muted', { dim: !open, hot: i === k - 1 });
            if (open) txt(b, X2 + 1.55, ly, String(i + 1), { size: 13, color: 'amber' });
          }
          token(b, X1, my, 0.45, TOPS[j], 'sky', { hot: any });
        }
        token(b, X0, rootY, 0.58, '시작', 'ink', { size: 12.5 });
      } else {
        const rows = a + c, rootY = ((rows - 1) / 2) * dy, X0 = 0, X1 = 4.0;
        txt(b, X1, -1.2, `버스 ${a}편 또는 기차 ${c}편`, { size: 13.5, color: 'ink' });
        for (let i = 0; i < rows; i++) {
          const bus = i < a, open = i < k, col = bus ? 'sky' : 'green';
          seg(b, X0, rootY, X1 - 0.85, i * dy, { color: col, width: open ? 2.6 : 1.3, alpha: open ? 0.95 : 0.22, dash: open ? null : [4, 5] });
          tile(b, X1, i * dy, 1.7, 0.74, (bus ? '버스' + (i + 1) : '기차' + (i - a + 1)), open ? col : 'muted', { dim: !open, hot: i === k - 1 });
          if (open) txt(b, X1 + 1.7, i * dy, String(i + 1), { size: 13, color: 'amber' });
        }
        token(b, X0, rootY, 0.58, '출발', 'ink', { size: 12.5 });
        // 묶음 표시
        seg(b, X1 + 2.35, -0.3, X1 + 2.35, (a - 1) * dy + 0.3, { color: 'sky', width: 2.2 });
        txt(b, X1 + 3.5, ((a - 1) / 2) * dy, `${a}가지`, { size: 13.5, color: 'sky' });
        seg(b, X1 + 2.35, a * dy - 0.3, X1 + 2.35, (rows - 1) * dy + 0.3, { color: 'green', width: 2.2 });
        txt(b, X1 + 3.5, (a + (c - 1) / 2) * dy, `${c}가지`, { size: 13.5, color: 'green' });
      }
    });
    return tot;
  }

  /* ----- 정리·문제: 길 찾기(곱 + 합)와 두 주사위의 눈의 합 ----- */
  const ROADS = [[4, 3, 2], [3, 2, 4], [2, 4, 3], [3, 3, 1], [2, 3, 5], [4, 2, 3]];
  const var1 = varier((prev) => {
    const kind = prev ? (prev.kind === 'road' ? 'dice' : 'road') : 'road';
    if (kind === 'road') {
      const r = prev ? pickOf(ROADS, prev.kind === 'road' ? prev.r : prev.lastRoad) : ROADS[0];
      const [a, c, d] = r; // A-B 길 a개, B-C 길 c개, A-C 길 d개
      return { kind, r, lastRoad: r, lastDice: prev && prev.lastDice, a, c, d, ans: { tex: String(a * c + d), val: a * c + d } };
    }
    const m = prev ? pickOf([3, 4, 5, 6], prev.lastDice) : 4;
    const groups = [];
    for (let S = m; S <= 12; S += m) { const pr = []; for (let i = 1; i <= 6; i++) { const j = S - i; if (j >= 1 && j <= 6) pr.push([i, j]); } groups.push({ S, pr }); }
    const val = groups.reduce((t, g) => t + g.pr.length, 0);
    return { kind, m, groups, lastRoad: prev && (prev.lastRoad || prev.r), lastDice: m, ans: { tex: String(val), val } };
  });
  const text1 = (v) => (v.kind === 'road'
    ? `그림과 같이 세 지점 ${tex('A')}, ${tex('B')}, ${tex('C')}를 잇는 길이 있다. ${tex('A')}와 ${tex('B')} 사이에 ${v.a}개, ${tex('B')}와 ${tex('C')} 사이에 ${v.c}개, ${tex('A')}와 ${tex('C')} 사이에 ${v.d}개의 길이 있다. ${tex('A')}에서 출발하여 ${tex('C')}까지 가는 방법의 수를 구하시오. (단, 한 번 지나간 지점은 다시 지나지 않는다.)`
    : `서로 다른 두 개의 주사위를 동시에 던질 때, 나오는 눈의 수의 합이 ${tex(String(v.m))}의 배수가 되는 경우의 수를 구하시오.`);
  function draw1Prob(b, s, lab) {
    const v = var1.cur();
    const sp = pState(lab, s);
    const st = (i) => sp.step >= i;
    figure(b, () => {
      if (v.kind === 'road') {
        const xA = 0, xB = 4.8, xC = 9.6, GREY = 'muted';
        const arc = (x1, x2, off, o) => { const pts = []; for (let i = 0; i <= 24; i++) { const t = i / 24; pts.push(P(x1 + (x2 - x1) * t, -4 * off * t * (1 - t))); } b.path(pts, o); };
        const colAB = st(1) ? 'sky' : 'ink', colBC = st(1) ? 'green' : 'ink', colAC = st(2) ? 'amber' : 'ink';
        const w = (on) => (on ? 3 : 1.8), al = (on) => (on ? 0.95 : 0.6);
        for (let j = 0; j < v.a; j++) arc(xA, xB, (j - (v.a - 1) / 2) * 1.25, { color: colAB, width: w(st(1)), alpha: al(st(1)) });
        for (let j = 0; j < v.c; j++) arc(xB, xC, (j - (v.c - 1) / 2) * 1.25, { color: colBC, width: w(st(1)), alpha: al(st(1)) });
        for (let j = 0; j < v.d; j++) arc(xA, xC, 2.4 + j * 0.85, { color: colAC, width: w(st(2)), alpha: al(st(2)) });
        token(b, xA, 0, 0.5, 'A', 'ink'); token(b, xB, 0, 0.5, 'B', 'ink'); token(b, xC, 0, 0.5, 'C', 'ink');
        txt(b, (xA + xB) / 2, 2.2, `${v.a}개`, { size: 13.5, color: st(1) ? 'sky' : 'ink' });
        txt(b, (xB + xC) / 2, 2.2, `${v.c}개`, { size: 13.5, color: st(1) ? 'green' : 'ink' });
        txt(b, (xA + xC) / 2, -(2.4 + (v.d - 1) * 0.85 + 0.75), `${v.d}개`, { size: 13.5, color: st(2) ? 'amber' : 'ink' });
        if (st(1)) txt(b, (xA + xC) / 2, 3.6, `${v.a} × ${v.c} = ${v.a * v.c}`, { size: 14.5, color: 'green' });
        if (st(3)) txt(b, (xA + xC) / 2, 4.7, `${v.a * v.c} + ${v.d} = ${v.a * v.c + v.d}`, { size: 15, color: 'amber' });
      } else {
        const cs = 0.95, x0 = 1.0, y0 = 1.0;
        txt(b, 0.35, 0.5, '첫째', { size: 12.5, color: 'rose' });
        txt(b, x0 + 3 * cs, -0.5, '둘째 주사위의 눈', { size: 13, color: 'sky' });
        for (let i = 1; i <= 6; i++) {
          txt(b, x0 + (i - 0.5) * cs, 0.5, String(i), { size: 13.5, color: 'sky' });
          txt(b, 0.35, y0 + (i - 0.5) * cs, String(i), { size: 13.5, color: 'rose' });
        }
        for (let i = 1; i <= 6; i++) for (let j = 1; j <= 6; j++) {
          const S = i + j, gi = v.groups.findIndex((g) => g.S === S);
          const on = gi >= 0 && (st(2) || (st(1) && gi === 0));
          const cur = gi >= 0 && sp.step === 1 && gi === 0;
          rect(b, x0 + (j - 1) * cs, y0 + (i - 1) * cs, cs, cs, { fill: on ? PCOL[gi % 4] : null, fillAlpha: cur ? 0.6 : 0.3, color: 'muted', alpha: 0.55, width: 1.2 });
          if (on) txt(b, x0 + (j - 0.5) * cs, y0 + (i - 0.5) * cs, String(S), { size: 12.5, color: 'ink' });
        }
      }
    });
  }
  const steps1 = () => {
    const v = var1.cur();
    if (v.kind === 'road') return [
      `$A$에서 $B$를 거쳐 $C$로 가는 길: 잇달아 고르므로 곱의 법칙 $${v.a}\\times${v.c}=${v.a * v.c}$가지`,
      `$A$에서 $C$로 바로 가는 길: $${v.d}$가지`,
      `두 경우는 동시에 일어날 수 없으므로 합의 법칙: $${v.a * v.c}+${v.d}=${v.ans.val}$가지`

  /* ============================================================================================
     장면 7 · 원순열 [이전 교육과정] — 원탁을 돌리면 n개의 배열이 하나로 겹친다 (n!/n = (n−1)!)
     2022 개정 교육과정에서는 다루지 않지만 옛 기출을 풀다 만나는 유형이고 다시 들어올 수 있어 남겨 둡니다.
     ============================================================================================ */
  const seatXY = (n, i, R = 3.4) => { const a = -Math.PI / 2 + (2 * Math.PI * i) / n; return { x: R * Math.cos(a), y: R * Math.sin(a) }; };
  const idPerm = (n) => Array.from({ length: n }, (_, i) => i);
  const shuffle = (a) => { const r = a.slice(); for (let i = r.length - 1; i > 0; i--) { const j = rint(i + 1); [r[i], r[j]] = [r[j], r[i]]; } return r; };
  // 앉음새(cyc: 시계 방향으로 읽은 사람 번호)를 r칸 돌린 뒤 12시 자리부터 읽은 줄
  const readRot = (cyc, r) => cyc.map((_, i) => cyc[(((i - r) % cyc.length) + cyc.length) % cyc.length]);
  function drawTable7(b, n, seats, o = {}) {
    circ(b, 0, 0, 2.25, { fill: 'amber', fillAlpha: 0.07, color: 'amber', width: 1.6, alpha: 0.7 });
    txt(b, 0, 0, '원탁', { size: 13, color: 'muted' });
    for (let i = 0; i < n; i++) {
      const q = seatXY(n, i), sd = seats[i];
      if (!sd) token(b, q.x, q.y, 0.6, '', 'muted', { dim: true, dash: [4, 4] });
      else if (sd.num != null) { circ(b, q.x, q.y, 0.6, { fill: 'sky', fillAlpha: 0.14, color: 'sky', width: 2, dash: sd.dash ? [4, 4] : null }); txt(b, q.x, q.y, String(sd.num), { size: 15, color: 'sky' }); }
      else token(b, q.x, q.y, 0.6, sd.label, sd.color, { hot: sd.hot, dim: sd.dim, size: 14.5, dash: sd.dash ? [4, 4] : null });
    }
    if (o.marker !== false) { poly(b, [[-0.26, -4.7], [0.26, -4.7], [0, -4.3]], { fill: 'rose', fillAlpha: 0.85, color: 'rose', width: 1.2 }); txt(b, 2.3, -4.6, '12시부터 읽기', { size: 12.5, color: 'rose' }); }
  }
  function draw7Explore(b, s) {
    const n = s.n7, cyc = s.cyc7.length === n ? s.cyc7 : idPerm(n), fix = s.lens7 === 'fix';
    const r = fix ? ((n - cyc.indexOf(0)) % n) : s.rot7 % n;
    const read = readRot(cyc, r);
    figure(b, () => {
      drawTable7(b, n, read.map((p) => ({ label: LET[p], color: PCOL[p], hot: p === 0 && fix })));
      const rots = Array.from({ length: n }, (_, k) => readRot(cyc, k).map((p) => LET[p]).join(''));
      if (!fix) {
        txt(b, 0, 5.2, `돌려서 같아지는 ${n}개의 줄 (모두 같은 앉음새)`, { size: 12.5, color: 'muted' });
        const cols = n > 5 ? 3 : 3, cw = 0.42 * n + 1.0;
        rots.forEach((t, k) => tile(b, ((k % cols) - (cols - 1) / 2) * (cw + 0.2), 6.1 + Math.floor(k / cols) * 0.9, cw, 0.74, t, 'sky', { hot: k === r, dim: k !== r, size: 12.5 }));
      } else {
        txt(b, 0, 5.2, `A를 12시 자리에 고정하면 줄이 하나로 정해진다`, { size: 12.5, color: 'amber' });
        tile(b, 0, 6.1, 0.42 * n + 1.6, 0.8, rots[r], 'amber', { hot: true, size: 14 });
        // 나머지 n-1 자리의 후보 수
        for (let i = 0; i < n - 1; i++) { const x = (i - (n - 2) / 2) * 1.15; txt(b, x, 7.2, String(n - 1 - i), { size: 15, color: 'sky' }); if (i) txt(b, x - 0.575, 7.2, '×', { size: 13, color: 'muted' }); }
        txt(b, 0, 7.95, `나머지 ${n - 1}명을 한 줄로: ${n - 1}! = ${fact(n - 1)}`, { size: 13, color: 'sky' });
      }
    }, { margin: 0.04 });
  }
  const var7 = varier((prev) => {
    const kind = prev ? pickOf(['basic', 'adj', 'opp'], prev.kind) : 'basic';
    const bank = { basic: [4, 5, 6, 7], adj: [5, 6, 7], opp: [6, 8] };
    const n = prev ? pickOf(bank[kind], prev.kind === kind ? prev.n : null) : 5;
    const val = kind === 'basic' ? fact(n - 1) : kind === 'adj' ? 2 * fact(n - 2) : fact(n - 2);
    return { kind, n, ans: { tex: String(val), val } };
  });
  const text7 = (v) => (v.kind === 'basic' ? `${v.n}명의 학생이 원탁에 둘러앉는 경우의 수를 구하시오. (단, 회전하여 같은 것은 같은 배열로 본다.)`
    : v.kind === 'adj' ? `${v.n}명의 학생 중 특정한 두 학생 ${tex('A')}, ${tex('B')}가 이웃하도록 원탁에 둘러앉는 경우의 수를 구하시오. (단, 회전하여 같은 것은 같은 배열로 본다.)`
      : `${v.n}명의 학생 중 특정한 두 학생 ${tex('A')}, ${tex('B')}가 서로 마주 보도록 원탁에 둘러앉는 경우의 수를 구하시오. (단, 회전하여 같은 것은 같은 배열로 본다.)`);
  const steps7 = () => {

      `나머지 $${n - 1}$명을 나머지 $${n - 1}$자리에 앉힌다: $${n - 1}\\times${n - 2}\\times\\cdots\\times1$`,
      `$(${n}-1)!=${fact(n - 1)}$가지 (또는 $${n}!\\div${n}$)`

    if (v.kind === 'adj') return [
      `$A$를 12시 자리에 고정하면 $B$는 $A$의 양옆 두 자리 중 하나: $2$가지`,
      `나머지 $${n - 2}$명을 남은 $${n - 2}$자리에 앉힌다: $${n - 2}!=${fact(n - 2)}$가지`,
      `곱의 법칙: $2\\times${fact(n - 2)}=${v.ans.val}$가지`
    ];
    return [
      `$A$를 12시 자리에 고정하면 $B$는 정반대 자리 $1$곳에 앉는다: $1$가지`,
      `나머지 $${n - 2}$명을 남은 $${n - 2}$자리에 앉힌다: $${n - 2}!=${fact(n - 2)}$가지`,
      `곱의 법칙: $1\\times${fact(n - 2)}=${v.ans.val}$가지`

  };
  function draw7Prob(b, s, lab) {
    const v = var7.cur(), n = v.n, sp = pState(lab, s), st = sp.step;
    const seats = new Array(n).fill(null);
    if (st >= 1) seats[0] = { label: 'A', color: 'rose', hot: true };
    if (st >= 1 && v.kind === 'adj') {
      seats[1] = { label: 'B', color: 'sky', dash: st === 1 };
      if (st === 1) seats[n - 1] = { label: 'B', color: 'sky', dash: true };
    }
    if (st >= 1 && v.kind === 'opp') seats[n / 2] = { label: 'B', color: 'sky', hot: true };
    if (st >= 2) {
      const free = seats.map((x, i) => (x ? -1 : i)).filter((i) => i >= 0);
      free.forEach((i, q) => { seats[i] = { num: free.length - q }; });
    }
    figure(b, () => {
      drawTable7(b, n, seats, { marker: false });
      if (v.kind === 'adj' && st === 1) txt(b, 0, 5.3, 'B의 후보 두 곳 (둘 중 한 곳만 선택)', { size: 13, color: 'sky' });
      if (v.kind === 'adj' && st === 2) txt(b, 0, 5.3, `B를 한쪽에 놓은 한 경우: 남은 ${n - 2}자리`, { size: 13, color: 'sky' });
      if (st === 0) txt(b, 0, 5.3, `${n}명이 원탁에 둘러앉는다`, { size: 13, color: 'muted' });
      if (st >= 3) txt(b, 0, 5.3, v.kind === 'basic' ? `(${n}−1)! = ${v.ans.val}` : `${v.kind === 'adj' ? 2 : 1} × ${fact(n - 2)} = ${v.ans.val}`, { size: 16, color: 'amber' });
    }, { margin: 0.05 });
  }
  function scene7() {
    return baseScene({
      id: 'circ', title: '[이전 교육과정] 원순열', short: '원순열(이전)',
      question: '원탁에서는 모두 한 칸씩 돌려 앉아도 같은 앉음새로 본다. 그러면 일렬로 세우는 n!가지 중 몇 개씩 같은 앉음새로 겹칠까?',
      guide: '<span class="apl-tag" style="--c:var(--m-rose)">이전 교육과정</span> 2022 개정 교육과정에서는 빠졌지만 옛 기출과 학교 시험에 나오고 다시 들어올 수 있어 남겨 둔 내용입니다.<br><b>돌린 칸 수</b> 막대로 원탁을 돌려 보세요. 사람의 사이는 그대로이고 읽는 줄만 바뀝니다. 「A 고정」으로 바꾸면 줄이 하나로 정해집니다.',

        { group: '무엇을 볼까?', label: 'A를 12시 자리에 고정', apply: (st) => { st.lens7 = 'fix'; }, on: (st) => st.lens7 === 'fix' }

        { id: 'spin7', icon: 'next', label: '한 칸 돌리기', run: (s) => { s.rot7 = (s.rot7 + 1) % s.n7; } }

      problem: { tag: '이전 교육과정 · 원순열 기본 유형', time: '목표 시간: 20초', text: () => probHTML(text7(var7.cur())), answer: () => tex(var7.cur().ans.tex) },

        standard: () => ({ steps: steps7().map((t, i) => `${'①②③'[i]} ${t}`).join('<br>'), warning: '일렬로 세우는 것과 달리 원탁에서는 <b>기준이 없으므로</b> 한 사람을 먼저 고정해 기준을 만듭니다. 고정한 사람은 세지 않습니다.' }),

          readouts: [

            { label: `원순열 ${n}! ÷ ${n} = (${n}−1)!`, value: String(fact(n - 1)), color: 'amber', wide: true, note: 'A를 고정하고 나머지 n−1명을 세운 것과 같음' }
