<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a100e">
<title>다각형 · AP Math 실험실</title>
<meta name="description" content="중1 다각형: 대각선의 개수, 삼각형의 내각과 외각(별 모양·이등분선·이등변삼각형 연쇄), 다각형의 내각과 외각의 합(오목다각형·외각의 합 360°), 정다각형의 한 내각·한 외각과 대각선이 이루는 각을 도형을 직접 조절하며 탐구하고 정리와 5지선다 문제로 확인합니다.">
<script>try{var t=localStorage.getItem('apl:theme');t=t?JSON.parse(t):'paper';document.documentElement.setAttribute('data-theme',t==='board'?'board':'paper')}catch(e){document.documentElement.setAttribute('data-theme','paper')}</script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="../kit/vendor/katex/katex.min.css">
<link rel="stylesheet" href="../kit/apl.css">
<script defer src="../kit/vendor/katex/katex.min.js"></script>
<script defer src="../kit/vendor/qrcode.js"></script>
<script defer src="../kit/apl-core.js"></script>
<script defer src="../kit/apl-board.js"></script>
<script defer src="../kit/apl-shell.js"></script>
</head>
<body>
<noscript>이 실험실을 보려면 브라우저에서 자바스크립트를 켜야 합니다.</noscript>
<script>
/* ==========================================================================
   중1 · 다각형 (AP Math Lab 2.0) — Ⅱ-1. 다각형
   탭(order 순): ① 다각형과 대각선(10) · ② 삼각형의 내각과 외각(20) · ③ 다각형의 내각과 외각의 합(30) · ④ 정다각형(40)
   이 파일은 얇은 껍데기입니다. 공용 도구는 labs/g7-polygons/core.js, 각 탭은 t1~t4.js 모듈이
   window.APL_PG_GROUPS 에 { order, id, title, short, params, scenes } 를 등록하면 order 순으로 붙습니다.
   원칙(학생 가독성)
   - 그림은 무대 가득 · 길이와 각은 그림 안에 크게(화면 기준 14px 이상) · 모든 도형은 막대나 손잡이로 조절
   - 색의 역할: 하늘=내각 · 분홍=외각 · 노랑=구하는 각 x·끌 수 있는 점 · 초록=보조선·색칠한 면
   - 움직임은 가로로만(제자리 회전은 허용). 탐구 → 정리(교과서 해결 전략 순서) → 문제(5지선다 + 숫자 바꾸기)
   ========================================================================== */
window.addEventListener('DOMContentLoaded', function () {
'use strict';
const MODULES = ['core', 't1', 't2', 't3', 't4'];
const loadScript = (src) => new Promise((res) => {
  const el = document.createElement('script');
  el.src = src; el.async = false;
  el.onload = () => res(true);
  el.onerror = () => { el.remove(); res(false); }; // 아직 없는 모듈은 건너뜁니다
  document.head.append(el);
});

function start() {
  const mods = (window.APL_PG_GROUPS || []).filter((g) => g && Array.isArray(g.scenes) && g.scenes.length);
  const groups = mods.slice().sort((a, b) => (a.order || 0) - (b.order || 0)).map((g) => ({ id: g.id, title: g.title, short: g.short || g.title, scenes: g.scenes }));
  const params = {};
  mods.forEach((g) => Object.assign(params, g.params || {}));
  APLab.createLab({
    id: 'g7-polygons',
    stackFractions: true, // 패널 글의 슬래시·유니코드 분수를 쌓은 분수로 바꿉니다 (kit/apl-core.js APLab.stackFr)
    title: '다각형',
    courseName: '중1',
    unit: '평면도형 · 다각형',
    courseColor: 'var(--m-sky)',
    home: '../index.html#g7',
    legacy: '../../labs/g7/polygons-area.html',
    board: { kind: 'figure', pad: 0.02, minZoom: 0.5, maxZoom: 6 },
    // 장면에 들어올 때마다 화면 범위를 처음 상태로 되돌립니다(앞 장면의 확대·위치가 남지 않게). 그림 맞춤은 장면 그리기에서 매번 합니다.
    enter: (s, sc, lab) => { if (lab && lab.board && s === lab.s) { lab.board.fit(); lab.board.setPanes(null); lab.board.setInsets({ top: 0, right: 0, bottom: 0, left: 0 }); } },
    params,
    groups
  });
}
Promise.all(MODULES.map((m) => loadScript(`g7-polygons/${m}.js`))).then(start);
});
</script>
</body>
</html>
