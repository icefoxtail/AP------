<script>
/* ==========================================================================
   중1 · 평면도형 · 다각형 · 넓이 (AP Math Lab 2.0 이식본) — 4개 탐구관 × 4개 장면 = 16장면
   원본: labs/g7/polygons-area.html
   이식 방식: "호환 이식" — 원본의 내용(getSpec)과 그리기 코드(render 본문)를 글자 그대로 옮기고,
   원본이 쓰던 캔버스 호출(beginPath·moveTo·lineTo·arc·fill·stroke·translate·rotate…)만
   아래 'ctx 어댑터'가 새 무대 엔진(APLab.Board)에 연결합니다. 선 굵기·글자는 원본처럼 화면 픽셀 크기를 유지합니다.
   원본과 다른 점 (코드 안에는 모두 [2.0 수정] 주석이 있습니다)
   - 원본 도구 → 2.0 셸: 원클릭 버튼 ①·②는 조작부 칩, 이동·변형 슬라이더와 실행 버튼은 슬라이더·실행 버튼,
     3지선다는 '문제' 탭 버튼, Step 1~3 켜고 끄기는 '정리' 탭 단계 플레이어, 식 배지는 무대 위 수식 칩,
     둘레 줄자는 무대 아래 띠(v.tape), 꼭짓점·점 O 끌기는 후광 핸들로 바뀜
   - 그림 안 문제 수정
       ① 종이띠 접기: 접은 각 칩(63°·65°·70°·55°·60°) 중 70°·55°·60°를 눌러도 65°로 그려지던 문제 → 칩 값대로 그림
       ② 외각 이동 ∠A=72° 칩: 50°로 그려지던 문제 → 72°
       ③ 원본 칩 목록: 같은 값에 이름만 다른 칩은 하나로 합침. 값이 달라도 그림·식이 같아 동작이 없던 칩(평행사변형 보조선 보기,
          한 점·내부 점·전체 대각선의 보기 옵션, 외각 수축 '둘레 줄자', 정오각형 교각의 '구하는 각 위치' 등)과
          그림에 쓰이지 않던 이동·변형 슬라이더/실행 버튼(도미노·나비넥타이·이등분선 등)은 숨김
       ④ 기출 스냅: 칩에 없는 값(예: 산책로 W=8m, m=8)으로 맞춰지던 문제 → 그 장면의 유효한 칩 값으로
       ⑤ 점 O 끌기: 다각형 밖으로 나가 삼각형 n개 가정이 깨지던 문제 → 다각형 안쪽(안에 내접한 원의 85%)으로 제한
       ⑥ 꼭짓점 A 끌기: 이동 진행도가 있으면 손가락과 점이 어긋나던 문제 → 포인터를 그대로 따라가도록
       ⑦ 마법 보조선(외각 이동·부메랑)은 처음에 숨기고 '마법 보조선' 렌즈/이동 진행/정리 탭 2단계에서 나타남
          (원본은 항상 보여 렌즈 버튼이 아무 효과가 없었음). 렌즈 칩은 보조선이 달라지는 3개 장면에만 둠
       ⑧ 둘레 줄자: 칸 폭을 실제 변의 길이에 비례시키고 cm 값 표시(원본은 같은 폭)
   ========================================================================== */
window.addEventListener('DOMContentLoaded', function () {
  const tex = APLab.tex;
  const { clamp } = APLab;

  /* ===== 원본 그대로: 한글 수 이름 (원본 363행) ===== */
    const KOR_N = { 3: '삼', 4: '사', 5: '오', 6: '육', 7: '칠', 8: '팔', 9: '구', 10: '십', 12: '십이' };

  /* ===== 원본 상태 객체(이름 그대로) — 매 프레임 2.0 셸 상태에서 채웁니다 ===== */
    const state = {
      mode: 1,
      sub: { 1: 'triAlt', 2: 'railWing', 3: 'oneDiag', 4: 'stepExt' },
      lens: 'all', animProg: 0.0, showAntTape: false, p1: 8, p2: 1,
      dragXRatio: 0.35, dragYRatio: 0.45, scale: 1.0, offsetX: 0, offsetY: 0,
      steps: { 1: true, 2: true, 3: true }
    };

  /* ===== 원본 그대로: 4×4 시나리오 목록 (원본 390–415행) ===== */
    const SUB_MENUS = {
      1: [
        { id: 'triAlt', label: '📐 둔각 바깥높이·직각삼각형 h' },
        { id: 'paraMove', label: '✂️ 평행사변형 2가지 높이' },
        { id: 'trapRot', label: '🔄 사다리꼴 붙이기·2분할' },
        { id: 'boxFrame', label: '🖼️ 바깥 직사각형에서 빼기' }
      ],
      2: [
        { id: 'railWing', label: '🦋 평행선 사이 꼭짓점·양옆 삼각형(S₁=S₂)' },
        { id: 'baseRatio', label: '⚖️ 밑변의 비(m:n) = 넓이 비' },
        { id: 'roadMerge', label: '🚜 산책로(십자·사선) 밀어 합치기' },
        { id: 'stairFold', label: '🐜 계단 둘레·종이띠 접기' }
      ],
      3: [
        { id: 'oneDiag', label: '🍕 한 점 대각선(n-3)·삼각형(n-2)' },
        { id: 'inPointO', label: '🎯 내부 점 O (180°n-360°)' },
        { id: 'allDiag', label: '🕸️ 대각선의 총개수·악수' },
        { id: 'ext360', label: '🔭 외각의 합 360° (다각형을 줄여 보기)' }
      ],
      4: [
        { id: 'stepExt', label: '🚀 외각 옮기기 & 이어 붙인 이등변삼각형(4x)' },
        { id: 'boomBow', label: '🪃 오목사각형 & 🎀 X자 도형' },
        { id: 'starMaster', label: '⭐ 별 모양(☆)의 각 : 두 가지 방법·변형' },
        { id: 'bisect3', label: '📐 내·외각 이등분선 3종·대각선 교각' }
      ]
    };

  // [2.0 수정] 종이띠 접기: 접은 각 칩의 이름(63°·65°·70°·55°·60°)과 그림이 어긋나던 것을 칩 값대로 (원본: p1<=10 ? 55+p1 : 65)
  const PAPER_ANG = { 8: 63, 10: 65, 12: 70, 14: 55, 16: 60 };

  /* ===== 원본 그대로: 16대 핵심 시나리오 명세 (원본 591–1112행) ===== */
    function getSpec() {
      const m = state.mode, sub = state.sub[m], p1 = state.p1, p2 = state.p2;

      // [탭 1: 넓이 원리·바깥 직사각형 (초5~중1)]
      if (m === 1) {
        if (sub === 'triAlt') {
          const isRightH = p2 === 2;
          if (!isRightH) {
            const h = 6, area = (p1 * h) / 2;
            return {
              badge: '1-A · 직각(∟) 찾기 & 둔각삼각형의 바깥 수직높이',
              actionTxt: '🎬 꼭짓점 이동 시연',
              g1Label: '밑변 BC 길이 (a)', g1Btns: [[6,'6cm'],[8,'8cm'],[10,'10cm'],[12,'12cm'],[14,'14cm']],
              g2Label: '유형 전환', g2Btns: [[1,'📐둔각 바깥높이'],[2,'📏직각삼각형 h'],[1,'끌어 보기'],[2,'넓이 2번 식']],
              eqHTML: `<span class="tag-blue">밑변 BC(${p1})</span> × <span class="tag-emerald">수직높이 AH(6)</span> ÷ 2 = <span class="tag-rose">넓이 ${area}cm²</span>`,
              q: `둔각삼각형 ABC에서 밑변 ${tex(`\\overline{BC}=${p1}\\text{cm}`)}, 비스듬한 옆변 ${tex('\\overline{AB}=10\\text{cm}')}, 연장선에 내린 수선 ${tex('\\overline{AH}=6\\text{cm}')}일 때 <strong>삼각형 ABC의 넓이</strong>는?`,
              opts: [
                { t: `① ${area} cm² (밑변×수직높이÷2)`, ok: true, msg: `정답! 비스듬한 옆변(10cm)은 높이가 아니므로 쓰지 않습니다! 직각 기호(∟)가 만나는 밑변(${p1})과 수직높이(6)를 곱해 2로 나눕니다!` },
                { t: `② ${p1 * 5} cm² (옆변 10cm 사용)`, ok: false, msg: `직각 기호(∟)가 없는 비스듬한 옆변은 높이가 아닙니다!` },
                { t: `③ ${p1 * 6} cm² (÷2 누락)`, ok: false, msg: `삼각형 넓이는 반드시 2로 나누어야 합니다!` }
              ],
              ans: `직각(∟)을 낀 밑변(${p1})×높이(6)÷2 = <span class="tag-emerald">${area} cm²</span>`,
              stats: [`밑변 BC = ${p1} cm`, `바깥 수직높이 AH = 6 cm`, `비스듬한 옆변 = 10 cm (쓰지 않음)`, `넓이 = ${area} cm²`],
              std: `• 둔각삼각형의 높이는 꼭짓점 A에서 밑변 BC의 연장선에 수직(90°)으로 내린 선분 AH의 길이입니다.`,
              fast: `• <strong>높이를 찾는 방법</strong>: 밑변과 높이는 직각 기호(∟)가 만나는 두 선분입니다. 직각 기호와 만나지 않는 비스듬한 변의 길이는 넓이를 구할 때 쓰지 않습니다!`
            };
          } else {
            // 세 변(3k, 4k, 5k)이 모두 정수로 주어진 직각삼각형에서 넓이 2번 구하기
            const k = p1 <= 6 ? 1 : p1 <= 8 ? 2 : 3;
            const a = 3 * k, b = 4 * k, c = 5 * k;
            const area = (a * b) / 2, h = ((a * b) / c).toFixed(1);
            return {
              badge: '1-A · 세 변이 주어진 직각삼각형의 빗변 높이 h (넓이 2번 구하기)',
              actionTxt: '🎬 직사각형 복제',
              g1Label: '직각삼각형 세 변 세트', g1Btns: [[6,'(3,4,5)cm'],[8,'(6,8,10)cm'],[10,'(9,12,15)cm'],[8,'기본 세트'],[10,'확대 세트']],
              g2Label: '유형 전환', g2Btns: [[1,'📐둔각 바깥높이'],[2,'📏직각삼각형 h'],[1,'둔각 보기'],[2,'직각 보기']],
              eqHTML: `<span class="tag-blue">½ × ${a} × ${b} (넓이 ${area})</span> 🟰 <span class="tag-rose">½ × 빗변(${c}) × 높이(h)</span> ⟹ <span class="tag-emerald">h = ${h}cm</span>`,
              q: `세 변의 길이가 각각 ${tex(`${a}\\text{cm}, ${b}\\text{cm}, ${c}\\text{cm}`)}인 직각삼각형 ABC에서 <strong>① 삼각형의 넓이</strong>와 <strong>② 빗변(${c}cm)에 내린 수선의 길이 ${tex('h')}</strong>는?`,
              opts: [
                { t: `① 넓이 ${area}cm², h = ${h}cm`, ok: true, msg: `정답! 직각을 낀 두 변으로 구한 넓이(${area})와 ½×${c}×h가 같으므로 ${a}×${b} = ${c}×h에서 h = ${h}cm입니다!` },
                { t: `② 넓이 ${a*b}cm², h = ${h}cm`, ok: false, msg: `삼각형 넓이는 2로 나누어야 합니다!` },
                { t: `③ 넓이 ${area}cm², h = ${a}cm`, ok: false, msg: `빗변(${c}cm)을 밑변으로 볼 때의 높이 h는 ${a}×${b}÷${c} = ${h}cm입니다!` }
              ],
              ans: `${tex(`\\dfrac{1}{2}\\times ${a}\\times ${b} = \\dfrac{1}{2}\\times ${c}\\times h \\implies`)} <span class="tag-emerald">넓이 ${area}cm², h = ${h}cm</span>`,
              stats: [`직각 낀 두 변: ${a}cm, ${b}cm`, `빗변 길이: ${c}cm`, `삼각형 넓이 = ${area} cm²`, `빗변 위 높이 h = ${h} cm`],
              std: `• 같은 삼각형의 넓이를 두 가지 밑변·높이 쌍으로 나타내면 ${tex(`\\dfrac{1}{2}\\times ${a}\\times ${b} = \\dfrac{1}{2}\\times ${c}\\times h`)}입니다.`,
              fast: `• 하나의 삼각형 안에 <strong>직각 기호(∟)가 2개</strong> 보이면 같은 삼각형의 넓이를 두 가지로 나타낼 수 있으므로 <strong>『직각을 낀 두 변의 곱 = 빗변 × 높이 h』</strong>가 성립합니다!`
            };
          }
        }
        if (sub === 'paraMove') {
          const a = p1, h1 = 6, b = 8, area = a * h1, h2 = (area / b).toFixed(1).replace('.0', '');
          return {
            badge: '1-B · 평행사변형 잘라서 옮기기 & 2가지 높이로 넓이 나타내기 (a×h₁ = b×h₂)',
            actionTxt: '🎬 직사각형 변신',
            g1Label: '아랫변 BC 길이 (a)', g1Btns: [[6,'6cm'],[8,'8cm'],[10,'10cm'],[12,'12cm'],[14,'14cm']],
            g2Label: '보조선 보기', g2Btns: [[1,'높이 h₁만'],[2,'두 번째 높이 h₂'],[3,'잘라서 옮기기'],[4,'전체 보기']],
            eqHTML: `<span class="tag-blue">밑변(${a}) × 높이 h₁(6) = ${area}</span> 🟰 <span class="tag-rose">옆변(8) × 높이 h₂(${h2})</span>`,
            q: `평행사변형 ABCD에서 밑변 ${tex(`\\overline{BC}=${a}\\text{cm}`)}에 대한 높이가 ${tex('6\\text{cm}')}이고, 옆변 ${tex('\\overline{CD}=8\\text{cm}')}일 때 <strong>변 CD를 밑변으로 할 때의 높이 ${tex('h_2')}</strong>는?`,
            opts: [
              { t: `① 넓이 ${area}cm², h₂ = ${h2}cm`, ok: true, msg: `정답! 어느 변을 밑변으로 잡든 넓이는 ${area}cm²로 같으므로 8 × h₂ = ${area}에서 h₂ = ${h2}cm입니다!` },
              { t: `② 넓이 ${area/2}cm², h₂ = ${h2}cm`, ok: false, msg: `평행사변형 넓이는 2로 나누지 않습니다!` },
              { t: `③ 넓이 ${area}cm², h₂ = 6cm`, ok: false, msg: `밑변이 ${a}cm에서 8cm로 바뀌었으므로 높이도 ${h2}cm로 달라집니다!` }
            ],
            ans: `${tex(`${a}\\times 6 = 8\\times h_2 = ${area} \\implies`)} <span class="tag-emerald">h₂ = ${h2} cm</span>`,
            stats: [`밑변 a = ${a}cm, 높이 h₁ = 6cm`, `평행사변형 넓이 = ${area} cm²`, `옆변 b = 8 cm`, `두 번째 높이 h₂ = ${h2} cm`],
            std: `• 왼쪽 직각삼각형을 잘라 오른쪽으로 옮기면 직사각형이 되므로 넓이는 (밑변)×(높이) = ${area}cm²입니다.`,
            fast: `• 평행사변형 안에 수선(∟)이 2개 그려져 있으면 같은 평행사변형의 넓이를 두 가지로 나타낸 <strong>『밑변1 × 높이1 = 밑변2 × 높이2』</strong>를 세워 구합니다!`
          };
        }
        if (sub === 'trapRot') {
          const a = p1, b = Math.max(2, p1 - 4), h = 6;
          const area = ((a + b) * h) / 2;
          return {

  /* ======================================================================
     [2.0] ctx 어댑터: 원본의 캔버스 호출 → 새 무대 엔진
     - 좌표: 원본의 화면 좌표(cx, cy, px)를 그대로 '설계 좌표'로 씁니다. 무대 배율이 1일 때 설계 1 = 화면 1px(원본과 같음),
       확대·축소하면 도형만 따라 커지고 선 굵기·글자는 화면 픽셀 그대로입니다.
     - 색: 원본 헥사·rgba 색이 테마 의미색으로 자동 변환됩니다(칠판·종이 모두 대응).
     - 지원하는 호출: save/restore · translate/rotate/scale · beginPath/moveTo/lineTo/arc/closePath/rect ·
       fill/stroke/fillRect/strokeRect · setLineDash · fillStyle/strokeStyle/lineWidth/globalAlpha
     ====================================================================== */
  let BOARD = null; // 지금 그리는 무대
  let CUR = null; // 지금 그리는 셸 상태(핸들 끌기가 고칩니다)
  let ROOT = 1; // 원본 그림 전체의 확대 배율(원본의 px 고정값으로 그린 장면을 큰 무대에서 키울 때). 가상 화면 크기는 무대/ROOT
  const sink = {};
  const VW = 640, VH = 440; // 모든 장면 미리보기용 가상 화면 크기

  const ctx = (function () {
    let M = [1, 0, 0, 1, 0, 0];
    let stack = [];
    let path = [];
    let cur = null;
    const tp = (x, y) => ({ x: M[0] * x + M[2] * y + M[4], y: M[1] * x + M[3] * y + M[5] });
    const FILL_STAGE = '#0d241b'; // 원본이 '칠판 배경색'으로 칠하던 어두운 초록 → 테마의 무대 배경색
    const col = (c) => (String(c).toLowerCase() === FILL_STAGE ? BOARD.colors.stage : BOARD.color(c));
    const api = {
      fillStyle: '#000', strokeStyle: '#000', lineWidth: 1, globalAlpha: 1, lineDash: [],
      bind(b, root) { BOARD = b; ROOT = root || 1; M = [ROOT, 0, 0, ROOT, 0, 0]; stack = []; path = []; cur = null; api.fillStyle = '#000'; api.strokeStyle = '#000'; api.lineWidth = 1; api.globalAlpha = 1; api.lineDash = []; },
      save() { stack.push({ M: M.slice(), f: api.fillStyle, s: api.strokeStyle, w: api.lineWidth, g: api.globalAlpha, d: api.lineDash }); },
      restore() { const q = stack.pop(); if (!q) return; M = q.M; api.fillStyle = q.f; api.strokeStyle = q.s; api.lineWidth = q.w; api.globalAlpha = q.g; api.lineDash = q.d; },
      translate(x, y) { M = [M[0], M[1], M[2], M[3], M[0] * x + M[2] * y + M[4], M[1] * x + M[3] * y + M[5]]; },
      rotate(a) { const c = Math.cos(a), s = Math.sin(a); M = [M[0] * c + M[2] * s, M[1] * c + M[3] * s, -M[0] * s + M[2] * c, -M[1] * s + M[3] * c, M[4], M[5]]; },
      scale(x, y) { M = [M[0] * x, M[1] * x, M[2] * y, M[3] * y, M[4], M[5]]; },
      setLineDash(a) { api.lineDash = a || []; },
      clearRect() {},
      beginPath() { path = []; cur = null; },
      moveTo(x, y) { cur = { pts: [tp(x, y)], closed: false }; path.push(cur); },
      lineTo(x, y) {
        if (!cur) { api.moveTo(x, y); return; }
        if (cur.closed) { cur = { pts: [cur.pts[0]], closed: false }; path.push(cur); }
        cur.pts.push(tp(x, y));
      },
      closePath() { if (cur) cur.closed = true; },
      arc(x, y, r, a0, a1, ccw) {
        const T = Math.PI * 2;
        let d = a1 - a0;
        if (!ccw) d = d >= T ? T : ((d % T) + T) % T;
        else d = d <= -T ? -T : -((((-d) % T) + T) % T);
        const n = Math.max(6, Math.ceil(Math.abs(d) / (Math.PI / 36)));
        for (let i = 0; i <= n; i++) {
          const a = a0 + (d * i) / n;
          const px = x + r * Math.cos(a), py = y + r * Math.sin(a);
          if (i === 0 && !cur) api.moveTo(px, py); else api.lineTo(px, py);
        }
      },
      rect(x, y, w, h) { path.push({ pts: [tp(x, y), tp(x + w, y), tp(x + w, y + h), tp(x, y + h)], closed: true }); cur = null; },
      roundRect(x, y, w, h) { api.rect(x, y, w, h); },
      _paint(subs, doFill, doStroke) {
        const B = BOARD, c = B.ctx;
        c.save();
        c.globalAlpha *= api.globalAlpha;
        c.beginPath();
        for (const sp of subs) {
          sp.pts.forEach((p, i) => { const s = B.toS(p.x, p.y); if (i) c.lineTo(s.x, s.y); else c.moveTo(s.x, s.y); });
          if (sp.closed) c.closePath();
        }
        if (doFill) { c.fillStyle = col(api.fillStyle); c.fill(); }
        if (doStroke) {
          c.strokeStyle = col(api.strokeStyle);
          c.lineWidth = Math.max(0.8, api.lineWidth * B.lw * (B.thumb ? 0.6 : 1));
          c.lineJoin = 'round';
          c.lineCap = 'round';
          c.setLineDash(api.lineDash.map((v) => v * B.lw));
          c.stroke();
        }
        c.restore();
      },
      fill() { api._paint(path, true, false); },
      stroke() { api._paint(path, false, true); },
      fillRect(x, y, w, h) { api._paint([{ pts: [tp(x, y), tp(x + w, y), tp(x + w, y + h), tp(x, y + h)], closed: true }], true, false); },
      strokeRect(x, y, w, h) { api._paint([{ pts: [tp(x, y), tp(x + w, y), tp(x + w, y + h), tp(x, y + h)], closed: true }], false, true); }
    };
    return api;
  })();

  /* 화면 글자: 이모지는 글꼴에 따라 깨질 수 있어 뜻을 가진 것만 기호로 바꾸고 나머지는 뗍니다 */
  const arrowOnly = (s) => String(s == null ? '' : s).replace(/\s*\([☆✡]\)/g, '').replace(/🟰/g, '=').replace(/➖/g, '−').replace(/➕/g, '+').replace(/➔/g, '→').replace(/⭕/g, '○').replace(/[❌✕]/g, '×');
  const cv = (s) => APLab.stripEmoji(arrowOnly(s));
  const arrow = (v) => (typeof v === 'string' ? cv(v) : Array.isArray(v) ? v.map(arrow) : v && typeof v === 'object' ? Object.fromEntries(Object.entries(v).map(([k, x]) => [k, arrow(x)])) : v);

  /* ======================================================================
     원본의 마크 그리기 함수(원본 447–578행). 그리기 호출은 그대로이고, 글자(상자·각 이름·핸들)는 화면 픽셀로 그립니다.
     [2.0 수정] 마크는 정리 탭 1단계, 꼭짓점 이름·각 이름은 3단계에서 나타납니다(원본의 Step 1·3 켜기/끄기).
     ====================================================================== */
  function drawRightAngle(x, y, ang1, size = 12, color = '#38bdf8') {
    if (!state.steps[1]) return;
    const ang2 = ang1 + Math.PI / 2;
    const p1 = { x: x + size * Math.cos(ang1), y: y + size * Math.sin(ang1) };
    const p2 = { x: p1.x + size * Math.cos(ang2), y: p1.y + size * Math.sin(ang2) };
    const p3 = { x: x + size * Math.cos(ang2), y: y + size * Math.sin(ang2) };
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y); ctx.lineTo(p3.x, p3.y);
    ctx.strokeStyle = color; ctx.lineWidth = 2; ctx.stroke();
    ctx.lineTo(x, y); ctx.closePath();
    ctx.fillStyle = 'rgba(56, 189, 248, 0.14)'; ctx.fill();
    ctx.restore();
  }

  function drawParallelArrows(x1, y1, x2, y2, count = 2, color = '#34d399') {
    if (!state.steps[1]) return;
    const mx = (x1 + x2) / 2, my = (y1 + y2) / 2, ang = Math.atan2(y2 - y1, x2 - x1), sz = 7;
    ctx.save();
    ctx.strokeStyle = color; ctx.lineWidth = 2.2;
    for (let i = 0; i < count; i++) {
      const off = (i - (count - 1) / 2) * 7;
      const px = mx + off * Math.cos(ang), py = my + off * Math.sin(ang);
      ctx.beginPath();
      ctx.moveTo(px - sz * Math.cos(ang - 0.6), py - sz * Math.sin(ang - 0.6));
      ctx.lineTo(px, py);
      ctx.lineTo(px - sz * Math.cos(ang + 0.6), py - sz * Math.sin(ang + 0.6));
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawTickMarks(x1, y1, x2, y2, count = 2, color = '#fb7185') {
    if (!state.steps[1]) return;
    const mx = (x1 + x2) / 2, my = (y1 + y2) / 2, ang = Math.atan2(y2 - y1, x2 - x1), norm = ang + Math.PI / 2, len = 6.5;
    ctx.save();
    ctx.strokeStyle = color; ctx.lineWidth = 2.2;
    for (let i = 0; i < count; i++) {
      const off = (i - (count - 1) / 2) * 5;
      const cx = mx + off * Math.cos(ang), cy = my + off * Math.sin(ang);
      ctx.beginPath();
      ctx.moveTo(cx - len * Math.cos(norm), cy - len * Math.sin(norm));
      ctx.lineTo(cx + len * Math.cos(norm), cy + len * Math.sin(norm));
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawAngleArc(cx, cy, r, startAng, endAng, color, label = '') {
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.arc(cx, cy, r, startAng, endAng, false);
    ctx.closePath();
    ctx.fillStyle = color + '33';
    ctx.fill();
    ctx.beginPath();
    ctx.arc(cx, cy, r, startAng, endAng, false);
    ctx.strokeStyle = color;
    ctx.lineWidth = 2.4;
    ctx.stroke();
    ctx.restore();
    if (label && state.steps[3] && !BOARD.thumb) {
      const mid = (startAng + endAng) / 2;
      const s = BOARD.toS((cx + (r + 16) * Math.cos(mid)) * ROOT, (cy + (r + 16) * Math.sin(mid)) * ROOT);
      BOARD.stext(s.x, s.y, cv(label), { color: 'ink', size: 11.5, weight: 800, align: 'center', baseline: 'middle' });
    }
  }

  /* [표시 보강] 각 표시 도우미 angMark(꼭짓점 v, 반직선 방향 p1·p2, {color, rings, r, label}) — 설계 좌표(ROOT 곱하기 전)로 받음.
     꼭짓점에서 p1→p2 쪽 작은 각에 호(rings겹)를 긋고(정리 1단계 '마크'), 값·기호(label, 배열이면 여러 줄)는 호 바깥의 그 각 '부채꼴 안쪽'에
     놓습니다(3단계 '이름'). 크기는 화면 픽셀 기준이라 현재 점에서 매 프레임 다시 계산되고, 각이 좁으면 라벨을 꼭짓점에서 더 멀리 둡니다. */
  function angMark(v, p1, p2, o = {}) {
    if (!state.steps[1] || !BOARD) return;
    const b = BOARD, S = (p) => ({ x: p.x * ROOT, y: p.y * ROOT });
    const V = S(v), unit = (p) => { const q = S(p), dx = q.x - V.x, dy = q.y - V.y, l = Math.hypot(dx, dy) || 1; return { x: V.x + (dx / l) * 1e-3, y: V.y + (dy / l) * 1e-3 }; };
    const q1 = unit(p1), q2 = unit(p2);
    const s0 = b.toS(V), a = b.toS(q1), c = b.toS(q2);
    const t1 = Math.atan2(a.y - s0.y, a.x - s0.x), t2 = Math.atan2(c.y - s0.y, c.x - s0.x);
    const d = ((t2 - t1 + Math.PI * 3) % (Math.PI * 2)) - Math.PI, w = Math.abs(d), m = t1 + d / 2;
    let r = o.r || 28;
    const lines = !state.steps[3] || b.thumb || o.label == null || o.label === '' ? [] : [].concat(o.label).map(String);
    const hw = (Math.max(0, ...lines.map((x) => x.length)) * 7.2) / 2 + 3, hh = lines.length * 7 + 1;
    const half = Math.max(w / 2, 0.07);
    let D = r + 11;
    [-1, 1].forEach((sg) => { const ang = m + sg * half; D = Math.max(D, (hw * Math.abs(Math.sin(ang)) + hh * Math.abs(Math.cos(ang))) / Math.sin(half) + 2); });
    D = Math.min(D, o.max || 130);
    if (lines.length && D - 12 > r) r = Math.min(D - 12, o.rmax || 70);
    if (o.out && lines.length) { r = o.r || 28; D = r + 16; } // o.out: 각이 너무 좁은 그림에서는 라벨을 꼭짓점 바깥쪽(반대 방향)에 둠
    b.angle(V, q1, q2, { color: o.color, r, rings: o.rings || 1 });
    const mL = o.out ? m + Math.PI : m;
    lines.forEach((x, i) => b._text(s0.x + Math.cos(mL) * D, s0.y + Math.sin(mL) * D + (i - (lines.length - 1) / 2) * 13.5, x, { color: o.color, size: o.size || 12.5, align: 'center', baseline: 'middle', weight: 800 }));
  }

  // 긴 이름표는 무대 폭에 맞춰 줄바꿈(공백 기준, 공백이 없으면 글자 단위)
  function wrapText(c, text, maxW) {
    const out = [];
    let line = '';
    const push = (w) => { if (c.measureText(w).width <= maxW) return [w]; const parts = []; let a = ''; for (const ch of w) { if (c.measureText(a + ch).width > maxW && a) { parts.push(a); a = ch; } else a += ch; } parts.push(a); return parts; };
    for (const word of String(text).split(/\s+/).filter(Boolean)) {
      const cand = line ? line + ' ' + word : word;
      if (c.measureText(cand).width <= maxW) { line = cand; continue; }
      if (line) out.push(line);
      const parts = push(word);
      line = parts.pop();
      out.push(...parts);
    }
    if (line) out.push(line);
    return out;
  }

  function drawSmartLabel(px, py, centerX, centerY, text, color = '#e2e8f0', dist = 19) {
    if (!state.steps[3] || BOARD.thumb) return;
    const B = BOARD, c = B.ctx;
    const S = B.toS(px * ROOT, py * ROOT), C = B.toS(centerX * ROOT, centerY * ROOT);
    const dx = S.x - C.x, dy = S.y - C.y, len = Math.hypot(dx, dy) || 1;
    const A = B._area();
    const size = 12 * B.fs;
    c.save();
    c.font = `800 ${size}px ${B.font}`;
    const lines = wrapText(c, cv(text), Math.min(240, Math.max(110, A.w - 20)));
    const w = Math.max(...lines.map((l) => c.measureText(l).width)) + 10;
    const lh = size + 3, h = lines.length * lh + 5;
    const off = dist * 0.6 + (Math.abs(dx / len) * w) / 2 + (Math.abs(dy / len) * h) / 2;
    let lx = S.x + (dx / len) * off, ly = S.y + (dy / len) * off;
    lx = w + 6 >= A.w ? A.x + A.w / 2 : clamp(lx, A.x + 3 + w / 2, A.x + A.w - 3 - w / 2);
    ly = h + 6 >= A.h ? A.y + A.h / 2 : clamp(ly, A.y + 3 + h / 2, A.y + A.h - 3 - h / 2);
    c.beginPath();
    if (c.roundRect) c.roundRect(lx - w / 2, ly - h / 2, w, h, 4); else c.rect(lx - w / 2, ly - h / 2, w, h);
    c.fillStyle = APLab.rgba(B.colors.halo, 0.9);
    c.fill();
    c.strokeStyle = B.color('muted', 0.85);
    c.lineWidth = 1;
    c.stroke();
    c.fillStyle = B.color(color);
    c.textAlign = 'center';
    c.textBaseline = 'middle';
    lines.forEach((l, i) => c.fillText(l, lx, ly - h / 2 + 2.5 + lh * (i + 0.5)));
    c.restore();
  }

  function registerDragHandle(id, x, y, label, onDrag, extra = {}) {
    BOARD.handle(id, { x: x * ROOT, y: y * ROOT }, {
      color: 'sky', ...extra, label: BOARD.thumb ? '' : cv(label),
      drag: (w) => { onDrag(w.x / ROOT, w.y / ROOT); CUR.dragX = state.dragXRatio; CUR.dragY = state.dragYRatio; }
    });
  }

  // 원본은 캔버스 위에 띠를 덧그렸습니다 → 무대 아래 띠(v.tape)로 보냅니다. [2.0 수정] 칸 폭을 실제 변의 길이에 비례시킴
  function drawAntTape(rect, polyPts, segLabels, segColors, titleNote) {
    if (!state.showAntTape) return;
    const px = Math.min(rect.width, rect.height) * 0.032 * state.scale;
    const n = polyPts.length;
    const cm = polyPts.map((p, i) => Math.hypot(p.x - polyPts[(i + 1) % n].x, p.y - polyPts[(i + 1) % n].y) / (px * 1.1));
    sink.tape = {
      title: cv(`[테두리 줄자 펼치기] ${titleNote} (둘레 ≈ ${cm.reduce((a, b) => a + b, 0).toFixed(1)}cm)`),
      segments: segLabels.map((t, i) => ({ text: `${cv(t)} ${cm[i].toFixed(1)}`, weight: cm[i], color: segColors[i % segColors.length] }))
    };
  }

  // [2.0 수정] 점 O 끌기: 다각형 안쪽(안에 내접한 원의 85%)으로 제한 — 밖으로 나가면 "삼각형 n개" 가정이 깨짐
  const clampInPoly = (ox, oy, R, n) => { const lim = R * Math.cos(Math.PI / n) * 0.85, d = Math.hypot(ox, oy); return d > lim ? { x: (ox * lim) / d, y: (oy * lim) / d } : { x: ox, y: oy }; };

  /* ======================================================================
     원본 render() 본문 (원본 1123–1740행) — 화면 크기(rect)만 무대에서 받아 옴
     ====================================================================== */
  function renderScene(rect) {
      const m = state.mode, sub = state.sub[m], t = state.animProg;
      const p1 = state.p1, p2 = state.p2;
      const cx = rect.width / 2 + state.offsetX;
      const cy = rect.height * 0.49 + state.offsetY;
      const px = Math.min(rect.width, rect.height) * 0.032 * state.scale;

      ctx.save();

      // =======================================================================
      // [탭 1 렌더링: 넓이 원리·바깥 직사각형]
      // =======================================================================
      if (m === 1) {
        if (sub === 'triAlt') {
          if (p2 !== 2) {
            const aPx = p1 * px, hPx = 6 * px, yBot = cy + hPx / 2, yTop = cy - hPx / 2;
            const pB = { x: cx - aPx * 0.6, y: yBot }, pC = { x: cx - aPx * 0.6 + aPx, y: yBot };
            const ax = cx + (state.dragXRatio - 0.35) * aPx * 2.0 + t * aPx * 0.65;
            const pA = { x: ax, y: yTop }, pH = { x: ax, y: yBot };

            ctx.strokeStyle = '#94a3b8'; ctx.lineWidth = 2; ctx.setLineDash([5, 4]);
            ctx.beginPath(); ctx.moveTo(cx - 230, yBot); ctx.lineTo(cx + 230, yBot); ctx.stroke(); ctx.setLineDash([]);

            ctx.beginPath(); ctx.moveTo(pA.x, pA.y); ctx.lineTo(pB.x, pB.y); ctx.lineTo(pC.x, pC.y); ctx.closePath();
            ctx.fillStyle = 'rgba(56, 189, 248, 0.18)'; ctx.fill();
            ctx.strokeStyle = '#e2e8f0'; ctx.lineWidth = 2.5; ctx.stroke();

            ctx.strokeStyle = '#38bdf8'; ctx.lineWidth = 4.5;
            ctx.beginPath(); ctx.moveTo(pB.x, pB.y); ctx.lineTo(pC.x, pC.y); ctx.stroke();

            ctx.strokeStyle = '#34d399'; ctx.lineWidth = 3; ctx.setLineDash([5, 4]);
            ctx.beginPath(); ctx.moveTo(pA.x, pA.y); ctx.lineTo(pH.x, pH.y); ctx.stroke(); ctx.setLineDash([]);
            drawRightAngle(pH.x, pH.y, Math.PI, 13, '#34d399');

            drawSmartLabel(pB.x, pB.y, cx, cy, 'B'); drawSmartLabel(pC.x, pC.y, cx, cy, 'C');
            drawSmartLabel(pH.x, pH.y + 8, pH.x, pH.y - 20, 'H(수선의 발)', '#34d399', 16);
            registerDragHandle('A', pA.x, pA.y, '꼭짓점 A 끌기', (nx) => {
              state.dragXRatio = Math.max(0.05, Math.min(0.95, 0.35 + (nx - cx - t * aPx * 0.65) / (aPx * 2.0) /* [2.0 수정] 이동 진행도만큼 어긋나던 것 */));
            });
          } else {
            const k = p1 <= 6 ? 1 : p1 <= 8 ? 2 : 3;
            const a = 3 * k, b = 4 * k, c = 5 * k;
            const aPx = a * px * 1.1, bPx = b * px * 1.1, cPx = c * px * 1.1, hPx = (aPx * bPx) / cPx;
            const yBot = cy + hPx * 0.5, yTop = yBot - hPx;
            const pB = { x: cx - cPx / 2, y: yBot }, pC = { x: cx + cPx / 2, y: yBot };
            const xH = pB.x + (aPx * aPx) / cPx;
            const pA = { x: xH, y: yTop }, pH = { x: xH, y: yBot };

            ctx.beginPath(); ctx.moveTo(pA.x, pA.y); ctx.lineTo(pB.x, pB.y); ctx.lineTo(pC.x, pC.y); ctx.closePath();
            ctx.fillStyle = 'rgba(56, 189, 248, 0.18)'; ctx.fill();
            ctx.strokeStyle = '#e2e8f0'; ctx.lineWidth = 2.5; ctx.stroke();

            if (t > 0.02) {
              const piv = { x: (pA.x + pC.x) / 2, y: (pA.y + pC.y) / 2 };
              ctx.save(); ctx.translate(piv.x, piv.y); ctx.rotate(t * Math.PI); ctx.translate(-piv.x, -piv.y);
              ctx.beginPath(); ctx.moveTo(pA.x, pA.y); ctx.lineTo(pB.x, pB.y); ctx.lineTo(pC.x, pC.y); ctx.closePath();
              ctx.fillStyle = 'rgba(52, 211, 153, 0.18)'; ctx.fill();
              ctx.strokeStyle = '#34d399'; ctx.setLineDash([5, 4]); ctx.stroke(); ctx.restore();
            }

            drawRightAngle(pA.x, pA.y, Math.atan2(pB.y - pA.y, pB.x - pA.x), 12, '#38bdf8');
            drawRightAngle(pH.x, pH.y, Math.PI, 12, '#fb7185');
            ctx.strokeStyle = '#fb7185'; ctx.lineWidth = 3.5;
            ctx.beginPath(); ctx.moveTo(pA.x, pA.y); ctx.lineTo(pH.x, pH.y); ctx.stroke();

            drawSmartLabel(pA.x, pA.y, cx, cy, 'A(90°)');
            drawSmartLabel(pB.x, pB.y, cx, cy, `B`);
            drawSmartLabel(pC.x, pC.y, cx, cy, `C`);
            drawSmartLabel(pH.x, pH.y + 8, pH.x, pH.y - 20, `h=${((a*b)/c).toFixed(1)}cm`, '#fb7185', 16);
          }
        } else if (sub === 'paraMove') {
          const aPx = p1 * px, hPx = 6 * px, cutW = aPx * 0.28;
          const x0 = cx - aPx / 2, yBot = cy + hPx / 2, yTop = cy - hPx / 2;

          ctx.beginPath();
          ctx.moveTo(x0 + cutW, yBot); ctx.lineTo(x0 + aPx, yBot);
          ctx.lineTo(x0 + aPx + cutW, yTop); ctx.lineTo(x0 + cutW, yTop); ctx.closePath();
          ctx.fillStyle = 'rgba(56, 189, 248, 0.18)'; ctx.fill();
          ctx.strokeStyle = '#e2e8f0'; ctx.lineWidth = 2.5; ctx.stroke();

          const sh = t * aPx;
          ctx.beginPath();
          ctx.moveTo(x0 + sh, yBot); ctx.lineTo(x0 + cutW + sh, yBot); ctx.lineTo(x0 + cutW + sh, yTop); ctx.closePath();
          ctx.fillStyle = 'rgba(244, 63, 94, 0.22)'; ctx.fill();
          ctx.strokeStyle = '#fb7185'; ctx.lineWidth = 2.5; ctx.stroke();

          drawRightAngle(x0 + cutW + sh, yBot, Math.PI, 12, '#fb7185');
          drawParallelArrows(x0 + cutW, yTop, x0 + aPx + cutW, yTop, 2, '#34d399');
          drawParallelArrows(x0, yBot, x0 + aPx, yBot, 2, '#34d399');
        } else if (sub === 'trapRot') {
          const b = Math.max(2, p1 - 4), aPx = p1 * px, bPx = b * px, hPx = 6 * px;
          const offL = (aPx - bPx) * 0.35, x0 = cx - (aPx + bPx * t) / 2, yBot = cy + hPx / 2, yTop = cy - hPx / 2;
          const trap = [{ x: x0, y: yBot }, { x: x0 + aPx, y: yBot }, { x: x0 + offL + bPx, y: yTop }, { x: x0 + offL, y: yTop }];

          ctx.beginPath(); ctx.moveTo(trap[0].x, trap[0].y); trap.forEach((p) => ctx.lineTo(p.x, p.y)); ctx.closePath();
          ctx.fillStyle = 'rgba(56, 189, 248, 0.18)'; ctx.fill();
          ctx.strokeStyle = '#e2e8f0'; ctx.lineWidth = 2.5; ctx.stroke();

          if (p2 === 2 || p2 === 3 || state.lens === 'aux') {
            ctx.strokeStyle = '#34d399'; ctx.lineWidth = 2; ctx.setLineDash([5, 4]);
            ctx.beginPath(); ctx.moveTo(trap[3].x, trap[3].y); ctx.lineTo(trap[1].x, trap[1].y); ctx.stroke(); ctx.setLineDash([]);
          }

          if (t > 0.02) {
            const piv = { x: (trap[1].x + trap[2].x) / 2, y: (trap[1].y + trap[2].y) / 2 };
            ctx.save(); ctx.translate(piv.x, piv.y); ctx.rotate(t * Math.PI); ctx.translate(-piv.x, -piv.y);
            ctx.beginPath(); ctx.moveTo(trap[0].x, trap[0].y); trap.forEach((p) => ctx.lineTo(p.x, p.y)); ctx.closePath();
            ctx.fillStyle = 'rgba(244, 63, 94, 0.18)'; ctx.fill();
            ctx.strokeStyle = '#fb7185'; ctx.setLineDash([5, 4]); ctx.lineWidth = 2; ctx.stroke(); ctx.restore();
          }
          drawParallelArrows(trap[3].x, trap[3].y, trap[2].x, trap[2].y, 1);
          drawParallelArrows(trap[0].x, trap[0].y, trap[1].x, trap[1].y, 1);
        } else {
          // boxFrame
          const wPx = p1 * px * 1.1, hPx = 6 * px * 1.1, x0 = cx - wPx / 2, y0 = cy - hPx / 2;
          ctx.strokeStyle = '#94a3b8'; ctx.lineWidth = 2; ctx.setLineDash([5, 4]);
          ctx.strokeRect(x0, y0, wPx, hPx); ctx.setLineDash([]);

          if (p2 < 3) {
            const pA = { x: cx, y: y0 }, pB = { x: x0, y: cy }, pC = { x: cx, y: y0 + hPx }, pD = { x: x0 + wPx, y: cy };
            ctx.beginPath(); ctx.moveTo(pA.x, pA.y); ctx.lineTo(pB.x, pB.y); ctx.lineTo(pC.x, pC.y); ctx.lineTo(pD.x, pD.y); ctx.closePath();
            ctx.fillStyle = 'rgba(56, 189, 248, 0.22)'; ctx.fill();
            ctx.strokeStyle = '#e2e8f0'; ctx.lineWidth = 2.5; ctx.stroke();
            if (state.steps[1]) { // [표시 보강] 직각 표시가 가리키는 두 대각선(점선) — 가운데 ∟가 어느 두 선의 직각인지 보이게
              ctx.save(); ctx.strokeStyle = '#94a3b8'; ctx.lineWidth = 1.8; ctx.setLineDash([5, 4]);
              ctx.beginPath(); ctx.moveTo(pA.x, pA.y); ctx.lineTo(pC.x, pC.y); ctx.moveTo(pB.x, pB.y); ctx.lineTo(pD.x, pD.y); ctx.stroke(); ctx.restore();
            }
            drawRightAngle(cx, cy, 0, 12);
            if (t > 0.02) {
              [
                { c: { x: x0, y: y0 }, p1: pA, p2: pB },
                { c: { x: x0 + wPx, y: y0 }, p1: pA, p2: pD },
                { c: { x: x0, y: y0 + hPx }, p1: pC, p2: pB },
                { c: { x: x0 + wPx, y: y0 + hPx }, p1: pC, p2: pD }
              ].forEach((cn) => {
                ctx.beginPath();
                ctx.moveTo(cn.c.x + t * (cx - cn.c.x), cn.c.y + t * (cy - cn.c.y));
                ctx.lineTo(cn.p1.x, cn.p1.y); ctx.lineTo(cn.p2.x, cn.p2.y); ctx.closePath();
                ctx.fillStyle = 'rgba(244, 63, 94, 0.22)'; ctx.fill();
                ctx.strokeStyle = '#fb7185'; ctx.stroke();
              });
            }
          } else {
            const pA = { x: x0, y: y0 + hPx * 0.33 }, pB = { x: x0 + wPx * 0.38, y: y0 + hPx }, pC = { x: x0 + wPx, y: y0 };
            ctx.beginPath(); ctx.moveTo(pA.x, pA.y); ctx.lineTo(pB.x, pB.y); ctx.lineTo(pC.x, pC.y); ctx.closePath();
            ctx.fillStyle = 'rgba(56, 189, 248, 0.24)'; ctx.fill();
            ctx.strokeStyle = '#e2e8f0'; ctx.lineWidth = 2.5; ctx.stroke();
            const sep = t * 20;
            [
              { pts: [{ x: x0, y: y0 }, pA, pC], dx: -sep, dy: -sep, l: '①' },
              { pts: [{ x: x0, y: y0 + hPx }, pA, pB], dx: -sep, dy: sep, l: '②' },
              { pts: [{ x: x0 + wPx, y: y0 + hPx }, pB, pC], dx: sep, dy: sep, l: '③' }
            ].forEach((cn) => {
              ctx.save(); ctx.translate(cn.dx, cn.dy);
              ctx.beginPath(); ctx.moveTo(cn.pts[0].x, cn.pts[0].y); ctx.lineTo(cn.pts[1].x, cn.pts[1].y); ctx.lineTo(cn.pts[2].x, cn.pts[2].y); ctx.closePath();
              ctx.fillStyle = 'rgba(244, 63, 94, 0.20)'; ctx.fill();
              ctx.strokeStyle = '#fb7185'; ctx.stroke();
              ctx.restore();
            });
          }
        }
      }

      // =======================================================================
      // [탭 2 렌더링: 평행선 넓이·산책로·둘레]
      // =======================================================================
      else if (m === 2) {
        if (sub === 'railWing') {
          const aPx = p1 * px * 1.1, hPx = 6 * px * 1.1, yTop = cy - hPx / 2, yBot = cy + hPx / 2;
          if (p2 >= 3) {
            ctx.strokeStyle = '#34d399'; ctx.lineWidth = 2.2;
            ctx.beginPath(); ctx.moveTo(cx - 240, yTop); ctx.lineTo(cx + 240, yTop); ctx.moveTo(cx - 240, yBot); ctx.lineTo(cx + 240, yBot); ctx.stroke();
            drawParallelArrows(cx - 180, yTop, cx + 180, yTop, 2); drawParallelArrows(cx - 180, yBot, cx + 180, yBot, 2);

            const pB = { x: cx - aPx / 2, y: yBot }, pC = { x: cx + aPx / 2, y: yBot };
            const ax = cx + (state.dragXRatio - 0.5 + (t - 0.3) * 0.6) * 280;
            const pA = { x: ax, y: yTop };

            ctx.beginPath(); ctx.moveTo(pA.x, pA.y); ctx.lineTo(pB.x, pB.y); ctx.lineTo(pC.x, pC.y); ctx.closePath();
            ctx.fillStyle = 'rgba(56, 189, 248, 0.20)'; ctx.fill();
            ctx.strokeStyle = '#e2e8f0'; ctx.lineWidth = 2.5; ctx.stroke();
            registerDragHandle('A', pA.x, pA.y, '꼭짓점 A 끌기', (nx) => { state.dragXRatio = Math.max(0.1, Math.min(0.9, 0.5 + (nx - cx) / 280 - (t - 0.3) * 0.6 /* [2.0 수정] 이동 진행도만큼 어긋나던 것 */)); });
            drawAntTape(rect, [pA, pB, pC], ['옆변 AB', `밑변 BC(${p1})`, '옆변 CA'], ['#fb7185', '#38bdf8', '#34d399'], `넓이는 ${(p1*6)/2}cm²로 그대로, 둘레는 변함!`);
          } else {
            const pB = { x: cx - aPx / 2, y: yBot }, pC = { x: cx + aPx / 2, y: yBot };
            const pA = { x: cx - aPx / 6, y: yTop }, pD = { x: cx + aPx / 6, y: yTop };
            const denom = (pA.x - pC.x) * (pB.y - pD.y) - (pA.y - pC.y) * (pB.x - pD.x) || 1;
            const tI = ((pA.x - pB.x) * (pB.y - pD.y) - (pA.y - pB.y) * (pB.x - pD.x)) / denom;
            const pO = { x: pA.x + tI * (pC.x - pA.x), y: pA.y + tI * (pC.y - pA.y) };

            ctx.beginPath(); ctx.moveTo(pA.x, pA.y); ctx.lineTo(pB.x, pB.y); ctx.lineTo(pC.x, pC.y); ctx.lineTo(pD.x, pD.y); ctx.closePath();
            ctx.strokeStyle = '#e2e8f0'; ctx.lineWidth = 2; ctx.stroke();
            drawParallelArrows(pA.x, pA.y, pD.x, pD.y, 2); drawParallelArrows(pB.x, pB.y, pC.x, pC.y, 2);

            [[pA, pB, pO], [pD, pC, pO]].forEach((tr) => {
              ctx.beginPath(); ctx.moveTo(tr[0].x, tr[0].y); ctx.lineTo(tr[1].x, tr[1].y); ctx.lineTo(tr[2].x, tr[2].y); ctx.closePath();
              ctx.fillStyle = 'rgba(56, 189, 248, 0.25)'; ctx.fill();
              ctx.strokeStyle = '#38bdf8'; ctx.lineWidth = 2.8; ctx.stroke();
            });

            ctx.save(); ctx.translate(0, t * 42);
            ctx.beginPath(); ctx.moveTo(pO.x, pO.y); ctx.lineTo(pB.x, pB.y); ctx.lineTo(pC.x, pC.y); ctx.closePath();
            ctx.fillStyle = 'rgba(244, 63, 94, 0.22)'; ctx.fill();
            ctx.strokeStyle = '#fb7185'; ctx.lineWidth = 2.5; ctx.stroke();
            ctx.restore();

            drawSmartLabel(pA.x, pA.y, cx, cy, 'A'); drawSmartLabel(pB.x, pB.y, cx, cy, 'B');
            drawSmartLabel(pC.x, pC.y, cx, cy, 'C'); drawSmartLabel(pD.x, pD.y, cx, cy, 'D');
            if (state.steps[3] && !BOARD.thumb) { // [표시 보강] 대각선 교점 O와 같은 넓이의 두 날개 S₁(ΔAOB)·S₂(ΔDOC) 표시
              drawSmartLabel(pO.x, pO.y, pO.x, pO.y + 20, 'O', '#e2e8f0', 10);
              [[pA, pB, 'S₁'], [pD, pC, 'S₂']].forEach(([u, w2, nm]) => { const g = BOARD.toS(((u.x + w2.x + pO.x) / 3) * ROOT, ((u.y + w2.y + pO.y) / 3) * ROOT); BOARD.stext(g.x, g.y + 4, nm, { color: 'sky', size: 13, weight: 800, align: 'center', baseline: 'middle' }); });
            }
          }
        } else if (sub === 'baseRatio') {
          const mL = p1, nL = p2 + 1, totW = (mL + nL) * px * 1.15, hPx = 6 * px * 1.1;
          const x0 = cx - totW / 2, yBot = cy + hPx / 2, yTop = cy - hPx / 2;
          const pB = { x: x0, y: yBot }, pD = { x: x0 + (mL / (mL + nL)) * totW, y: yBot }, pC = { x: x0 + totW, y: yBot }, pA = { x: cx - 15, y: yTop };
          const sep = t * 14;

          ctx.save(); ctx.translate(-sep, 0);
          ctx.beginPath(); ctx.moveTo(pA.x, pA.y); ctx.lineTo(pB.x, pB.y); ctx.lineTo(pD.x, pD.y); ctx.closePath();
          ctx.fillStyle = 'rgba(56, 189, 248, 0.22)'; ctx.fill(); ctx.strokeStyle = '#38bdf8'; ctx.lineWidth = 2.5; ctx.stroke();
          ctx.restore();

          ctx.save(); ctx.translate(sep, 0);
          ctx.beginPath(); ctx.moveTo(pA.x, pA.y); ctx.lineTo(pD.x, pD.y); ctx.lineTo(pC.x, pC.y); ctx.closePath();
          ctx.fillStyle = 'rgba(244, 63, 94, 0.22)'; ctx.fill(); ctx.strokeStyle = '#fb7185'; ctx.lineWidth = 2.5; ctx.stroke();
          ctx.restore();

          drawSmartLabel(pA.x, pA.y, cx, cy, 'A(높이 공유)');
          drawSmartLabel(pB.x, pB.y, cx, cy, `B(${mL})`);
          drawSmartLabel(pD.x, pD.y, cx, cy, 'D');
          drawSmartLabel(pC.x, pC.y, cx, cy, `C(${nL})`);
        } else if (sub === 'roadMerge') {
          const W = p1, H = 8, x = p2, WPx = W * px * 0.85, HPx = H * px * 0.85, rPx = x * px * 0.85;
          const x0 = cx - WPx / 2, y0 = cy - HPx / 2, gap = (1 - t) * rPx, sl = (p2 % 2 === 0 ? 1 : 0) * (1 - t) * 24;
          const w1 = (WPx - rPx) * 0.45, w2 = (WPx - rPx) * 0.55, h1 = (HPx - rPx) * 0.45, h2 = (HPx - rPx) * 0.55;

          ctx.strokeStyle = '#94A3B8'; ctx.setLineDash([5, 4]); ctx.strokeRect(x0, y0, WPx, HPx); ctx.setLineDash([]);
          [
            [{x:x0,y:y0},{x:x0+w1+sl,y:y0},{x:x0+w1,y:y0+h1},{x:x0,y:y0+h1}],
            [{x:x0+w1+gap+sl,y:y0},{x:x0+w1+w2+gap,y:y0},{x:x0+w1+w2+gap,y:y0+h1},{x:x0+w1+gap,y:y0+h1}],
            [{x:x0,y:y0+h1+gap},{x:x0+w1,y:y0+h1+gap},{x:x0+w1-sl,y:y0+h1+h2+gap},{x:x0,y:y0+h1+h2+gap}],
            [{x:x0+w1+gap,y:y0+h1+gap},{x:x0+w1+w2+gap,y:y0+h1+gap},{x:x0+w1+w2+gap,y:y0+h1+h2+gap},{x:x0+w1+gap-sl,y:y0+h1+h2+gap}]
          ].forEach((q) => {
            ctx.beginPath(); ctx.moveTo(q[0].x, q[0].y); q.forEach((p) => ctx.lineTo(p.x, p.y)); ctx.closePath();
            ctx.fillStyle = 'rgba(52, 211, 153, 0.26)'; ctx.fill();
            ctx.strokeStyle = '#34d399'; ctx.lineWidth = 2.5; ctx.stroke();
          });
        } else {
          // stairFold
          if (p2 < 3) {
            const wPx = p1 * px * 0.78, hPx = 8 * px * 0.78, y0 = cy - hPx / 2, lx = cx - wPx - 20, cW = wPx * 0.4, cH = hPx * 0.4;
            ctx.fillStyle = 'rgba(56, 189, 248, 0.16)';
            ctx.beginPath(); ctx.moveTo(lx, y0); ctx.lineTo(lx+wPx-cW, y0); ctx.lineTo(lx+wPx-cW, y0+cH); ctx.lineTo(lx+wPx, y0+cH); ctx.lineTo(lx+wPx, y0+hPx); ctx.lineTo(lx, y0+hPx); ctx.closePath();
            ctx.fill(); ctx.strokeStyle = '#e2e8f0'; ctx.lineWidth = 2.5; ctx.stroke();

            ctx.strokeStyle = '#38bdf8'; ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(lx+wPx-cW, y0+(1-t)*cH); ctx.lineTo(lx+wPx, y0+(1-t)*cH);
            ctx.moveTo(lx+wPx-(1-t)*cW, y0); ctx.lineTo(lx+wPx-(1-t)*cW, y0+cH);
            ctx.stroke();

            const rx = cx + 20, dW = wPx * 0.36, dH = 2 * px * 0.78, dx1 = rx + (wPx - dW) / 2, dx2 = dx1 + dW;
            ctx.fillStyle = 'rgba(244, 63, 94, 0.14)';
            ctx.beginPath(); ctx.moveTo(rx, y0); ctx.lineTo(dx1, y0); ctx.lineTo(dx1, y0+dH); ctx.lineTo(dx2, y0+dH); ctx.lineTo(dx2, y0); ctx.lineTo(rx+wPx, y0); ctx.lineTo(rx+wPx, y0+hPx); ctx.lineTo(rx, y0+hPx); ctx.closePath();
            ctx.fill(); ctx.strokeStyle = '#e2e8f0'; ctx.lineWidth = 2.5; ctx.stroke();

            ctx.strokeStyle = '#38bdf8'; ctx.lineWidth = 4;
            ctx.beginPath(); ctx.moveTo(dx1, y0+(1-t)*dH); ctx.lineTo(dx2, y0+(1-t)*dH); ctx.stroke();
            ctx.strokeStyle = '#fb7185'; ctx.lineWidth = 4.5;
            ctx.beginPath(); ctx.moveTo(dx1, y0); ctx.lineTo(dx1, y0+dH); ctx.moveTo(dx2, y0); ctx.lineTo(dx2, y0+dH); ctx.stroke();
          } else {
            const ang = PAPER_ANG[p1] || 65, wPx = 5 * px * 1.25, yTop = cy - wPx / 2, yBot = cy + wPx / 2;
            ctx.fillStyle = 'rgba(148, 163, 184, 0.14)'; ctx.fillRect(cx - 200, yTop, 400, wPx);
            ctx.strokeStyle = '#94a3b8'; ctx.lineWidth = 2; ctx.strokeRect(cx - 200, yTop, 400, wPx);
            drawParallelArrows(cx - 160, yTop, cx - 80, yTop, 2); drawParallelArrows(cx - 160, yBot, cx - 80, yBot, 2);

            const rad = (ang * Math.PI) / 180, halfB = wPx / Math.tan(rad);
            const pA = { x: cx, y: yTop }, pB = { x: cx - halfB, y: yBot }, pC = { x: cx + halfB, y: yBot };
            ctx.beginPath(); ctx.moveTo(pA.x, pA.y); ctx.lineTo(pB.x, pB.y); ctx.lineTo(pC.x, pC.y); ctx.closePath();
            ctx.fillStyle = 'rgba(56, 189, 248, 0.24)'; ctx.fill();
            ctx.strokeStyle = '#38bdf8'; ctx.lineWidth = 3; ctx.stroke();
            drawTickMarks(pA.x, pA.y, pB.x, pB.y, 2); drawTickMarks(pA.x, pA.y, pC.x, pC.y, 2);

            drawSmartLabel(pA.x, pA.y, cx, cy, `A(${180 - 2*ang}°)`);
            drawSmartLabel(pB.x, pB.y, cx, cy, `B(●${ang}°)`, '#38bdf8');
            drawSmartLabel(pC.x, pC.y, cx, cy, `C(●${ang}°)`, '#fb7185');
            // [표시 보강] 같은 각 ●(접은 각 B = 엇각 C)은 같은 하늘색 1겹 호, 꼭지각 A는 분홍 2겹 호 — 값은 각 안쪽
            angMark(pB, pC, pA, { color: '#38bdf8', rings: 1, r: 30, label: `●${ang}°` });
            angMark(pC, pB, pA, { color: '#38bdf8', rings: 1, r: 30, label: `●${ang}°` });
            angMark(pA, pB, pC, { color: '#fb7185', rings: 2, r: 26, label: `${180 - 2 * ang}°` });
          }
        }
      }

      // =======================================================================
      // [탭 3 렌더링: 다각형 대각선(n-3)·내각·외각 360°]
      // =======================================================================
      else if (m === 3) {
        const n = Math.max(4, Math.min(10, p1));
        const R = Math.min(rect.width, rect.height) * 0.28 * state.scale;
        const verts = Array.from({ length: n }, (_, i) => {
          const a = -Math.PI / 2 + (i * Math.PI * 2) / n;
          return { x: cx + R * Math.cos(a), y: cy + R * Math.sin(a) };
        });

        if (sub === 'oneDiag') {
          const cols = ['rgba(56,189,248,0.20)', 'rgba(52,211,153,0.20)', 'rgba(245,158,11,0.20)', 'rgba(244,63,94,0.20)'];
          for (let i = 1; i < n - 1; i++) {
            const mx = (verts[0].x + verts[i].x + verts[i + 1].x) / 3, my = (verts[0].y + verts[i].y + verts[i + 1].y) / 3;
            ctx.save(); ctx.translate((mx - cx) * 0.14 * t, (my - cy) * 0.14 * t);
            ctx.beginPath(); ctx.moveTo(verts[0].x, verts[0].y); ctx.lineTo(verts[i].x, verts[i].y); ctx.lineTo(verts[i + 1].x, verts[i + 1].y); ctx.closePath();
            ctx.fillStyle = cols[(i - 1) % cols.length]; ctx.fill();
            ctx.strokeStyle = '#e2e8f0'; ctx.lineWidth = 2; ctx.stroke();
            ctx.restore();
          }
          for (let i = 2; i < n - 1; i++) {
            ctx.beginPath(); ctx.moveTo(verts[0].x, verts[0].y); ctx.lineTo(verts[i].x, verts[i].y);
            ctx.strokeStyle = '#38bdf8'; ctx.lineWidth = 3.5; ctx.stroke();
          }
          verts.forEach((p, i) => {
            const bad = i === 0 || i === 1 || i === n - 1;
            drawSmartLabel(p.x, p.y, cx, cy, bad ? '금지(✕)' : `대각선!`, bad ? '#fb7185' : '#38bdf8', 20);
          });
        } else if (sub === 'inPointO') {
          const pO = (() => { const q = clampInPoly((state.dragXRatio - 0.35) * 70, (state.dragYRatio - 0.45) * 70, R, n); return { x: cx + q.x, y: cy + q.y }; })(); // [2.0 수정] 점 O는 다각형 안쪽으로 제한
          for (let i = 0; i < n; i++) {
            const v1 = verts[i], v2 = verts[(i + 1) % n];
            ctx.beginPath(); ctx.moveTo(pO.x, pO.y); ctx.lineTo(v1.x, v1.y); ctx.lineTo(v2.x, v2.y); ctx.closePath();
            ctx.fillStyle = i % 2 === 0 ? 'rgba(56,189,248,0.18)' : 'rgba(52,211,153,0.18)'; ctx.fill();
            ctx.strokeStyle = '#e2e8f0'; ctx.lineWidth = 2; ctx.stroke();
          }
          ctx.beginPath(); ctx.arc(pO.x, pO.y, 26 + t * 10, 0, Math.PI * 2);
          ctx.fillStyle = 'rgba(244, 63, 94, 0.32)'; ctx.fill();
          ctx.strokeStyle = '#fb7185'; ctx.lineWidth = 2.5; ctx.stroke();
          { // [표시 보강] 점 O 둘레의 n개 각(합 360°) — 삼각형 색과 같은 색 호, 값은 각 안쪽(변이 많으면 호만)
            const ringPx = (26 + t * 10 + 6) * ROOT * BOARD.k;
            for (let i = 0; i < n; i++) {
              const v1 = verts[i], v2 = verts[(i + 1) % n];
              const ang = Math.round((((Math.atan2(v2.y - pO.y, v2.x - pO.x) - Math.atan2(v1.y - pO.y, v1.x - pO.x)) * 180) / Math.PI + 720) % 360);
              angMark(pO, v1, v2, { color: i % 2 === 0 ? '#38bdf8' : '#34d399', rings: 1, r: ringPx, rmax: ringPx + 30, label: n <= 8 ? `${ang}°` : '', max: R * 0.8 * ROOT * BOARD.k });
            }
          }
          registerDragHandle('O', pO.x, pO.y, '점 O (360° 빼기!)', (nx, ny) => { const q = clampInPoly(nx - cx, ny - cy, R, n); state.dragXRatio = 0.35 + q.x / 70; state.dragYRatio = 0.45 + q.y / 70; }, { dx: 0, dy: -((26 + t * 10 + 6) * ROOT * BOARD.k + 56), align: 'center', baseline: 'middle' }); // [표시 보강] 점 O 이름표는 각 값 라벨 위쪽으로 띄움
        } else if (sub === 'allDiag') {
          ctx.beginPath(); ctx.moveTo(verts[0].x, verts[0].y); verts.forEach((p) => ctx.lineTo(p.x, p.y)); ctx.closePath();
          ctx.strokeStyle = '#e2e8f0'; ctx.lineWidth = 3; ctx.stroke();
          const diags = [];
          for (let i = 0; i < n; i++) {
            for (let j = i + 2; j < n; j++) {
              if (i === 0 && j === n - 1) continue;
              diags.push([verts[i], verts[j]]);
            }
          }
          const cnt = t > 0.04 ? Math.ceil(t * diags.length) : diags.length;
          for (let k = 0; k < cnt; k++) {
            ctx.beginPath(); ctx.moveTo(diags[k][0].x, diags[k][0].y); ctx.lineTo(diags[k][1].x, diags[k][1].y);
            ctx.strokeStyle = k < n - 3 ? '#fb7185' : 'rgba(56,189,248,0.55)';
            ctx.lineWidth = k < n - 3 ? 3.2 : 1.8; ctx.stroke();
          }
          verts.forEach((p, i) => drawSmartLabel(p.x, p.y, cx, cy, `P${i + 1}`));
        } else {
          // ext360
          const curR = (1 - t) * R * 0.85, secR = 46 * state.scale;
          const vCur = Array.from({ length: n }, (_, i) => {
            const a = -Math.PI / 2 + (i * Math.PI * 2) / n;
            return { x: cx + curR * Math.cos(a), y: cy + curR * Math.sin(a) };
          });
          const cols = ['#38bdf8', '#fb7185', '#34d399', '#fbbf24', '#7C3AED', '#DB2777', '#0891B2', '#4F46E5'];
          for (let i = 0; i < n; i++) {
            const aPrev = -Math.PI / 2 + ((i - 1) * Math.PI * 2) / n;
            const aCurr = -Math.PI / 2 + (i * Math.PI * 2) / n;
            const aNext = -Math.PI / 2 + ((i + 1) * Math.PI * 2) / n;
            const sA = Math.atan2(Math.sin(aCurr) - Math.sin(aPrev), Math.cos(aCurr) - Math.cos(aPrev));
            const eA = Math.atan2(Math.sin(aNext) - Math.sin(aCurr), Math.cos(aNext) - Math.cos(aCurr));

            ctx.beginPath(); ctx.moveTo(vCur[i].x, vCur[i].y); ctx.arc(vCur[i].x, vCur[i].y, secR, sA, eA, false); ctx.closePath();
            ctx.fillStyle = cols[i % cols.length] + '44'; ctx.fill();
            ctx.strokeStyle = cols[i % cols.length]; ctx.lineWidth = 2; ctx.stroke();
            { // [표시 보강] 한 외각 = 360°÷n 값을 각 부채꼴 안쪽에 표시
              const dirP = { x: vCur[i].x + Math.cos(sA), y: vCur[i].y + Math.sin(sA) }, dirN = { x: vCur[i].x + Math.cos(eA), y: vCur[i].y + Math.sin(eA) };
              const secPx = secR * ROOT * BOARD.k;
              angMark(vCur[i], dirP, dirN, { color: cols[i % cols.length], rings: 1, r: secPx * 0.4, rmax: secPx * 0.5, label: `${+(360 / n).toFixed(1)}°`, max: secPx * 0.92, size: 11.5 });
            }
          }
          if (curR > 2) {
            ctx.beginPath(); ctx.moveTo(vCur[0].x, vCur[0].y); vCur.forEach((p) => ctx.lineTo(p.x, p.y)); ctx.closePath();
            ctx.fillStyle = '#0d241b'; ctx.fill();
            ctx.strokeStyle = '#e2e8f0'; ctx.lineWidth = 3; ctx.stroke();
            // [표시 보강] 한 내각 = 180° − 외각 : 맨 위 꼭짓점의 안쪽 각에 호와 값(수축하는 다각형을 그대로 따라감)
            angMark(vCur[0], vCur[1], vCur[n - 1], { color: '#e2e8f0', rings: 2, r: Math.min(30, curR * ROOT * BOARD.k * 0.5), label: `내각 ${+(180 - 360 / n).toFixed(1)}°`, max: curR * ROOT * BOARD.k * 0.9 });
          }
        }
      }

      // =======================================================================
      // [탭 4 렌더링: 별모양 & 복잡한 도형의 삼각형 외각 마스터!]
      // =======================================================================
      else if (m === 4) {
        if (sub === 'stepExt') {
          if (p2 === 1) {
            // 기본 삼각형 외각 색종이 이동
            const A = p1 <= 12 ? p1 * 6 : 50 /* [2.0 수정] 칩 72°(p1=12)가 50°로 그려지던 것 */, B = 60;
            // [표시 보강] 삼각형을 ∠A·∠B 값에서 사인법칙으로 만들어 그림의 각이 표시한 값과 같게 합니다(원본은 어떤 ∠A에서도 같은 모양). 높이가 넘치면 전체를 줄임
            const abU = Math.sin(((180 - A - B) * Math.PI) / 180) / Math.sin((A * Math.PI) / 180), bRad = (B * Math.PI) / 180;
            const Lbc = Math.min(175, 160 / (abU * Math.sin(bRad)));
            const yBot = cy + 70, pB = { x: cx - 145, y: yBot }, pC = { x: cx - 145 + Lbc, y: yBot }, pD = { x: cx - 145 + Lbc * 1.9, y: yBot }, pA = { x: cx - 145 + abU * Lbc * Math.cos(bRad), y: yBot - abU * Lbc * Math.sin(bRad) };
            ctx.beginPath(); ctx.moveTo(pA.x, pA.y); ctx.lineTo(pB.x, pB.y); ctx.lineTo(pC.x, pC.y); ctx.closePath();
            ctx.fillStyle = 'rgba(56, 189, 248, 0.16)'; ctx.fill();
            ctx.strokeStyle = '#e2e8f0'; ctx.lineWidth = 2.8; ctx.stroke();
            ctx.beginPath(); ctx.moveTo(pC.x, pC.y); ctx.lineTo(pD.x, pD.y); ctx.stroke();

            const pE = { x: pC.x + (pA.x - pB.x), y: pC.y + (pA.y - pB.y) };
            if (state.steps[2] || t > 0.05 || state.lens === 'aux') {
              ctx.strokeStyle = '#34d399'; ctx.lineWidth = 2.2; ctx.setLineDash([5, 4]);
              ctx.beginPath(); ctx.moveTo(pC.x, pC.y); ctx.lineTo(pE.x, pE.y); ctx.stroke(); ctx.setLineDash([]);
              drawParallelArrows(pB.x, pB.y, pA.x, pA.y, 2); drawParallelArrows(pC.x, pC.y, pE.x, pE.y, 2);
            }
            const angCA = Math.atan2(pA.y - pC.y, pA.x - pC.x), angCE = Math.atan2(pE.y - pC.y, pE.x - pC.x);
            // [표시 보강] 안쪽 ∠A·∠B는 삼각형 안에 항상 표시(색종이 이동 전 위치), 이동 중·후의 호는 아래 원본 호가 C 쪽으로 옮겨 그립니다
            angMark(pA, pB, pC, { color: '#38bdf8', rings: 1, r: 30, label: `∠A=${A}°` });
            angMark(pB, pC, pA, { color: '#fb7185', rings: 1, r: 30, label: `∠B=${B}°` });
            if (t > 0.05) {
            drawAngleArc(pA.x + t*(pC.x - pA.x), pA.y + t*(pC.y - pA.y), 38, angCA, angCE, '#38bdf8', `${A}°`);
            drawAngleArc(pB.x + t*(pC.x - pB.x), pB.y + t*(pC.y - pB.y), 38, angCE, 0, '#fb7185', `${B}°`);
            }
            angMark(pC, pD, pA, { color: '#34d399', rings: 2, r: 56, label: `${A + B}°` }); // [표시 보강] 바깥 외각 ∠ACD = ∠A+∠B
            drawSmartLabel(pA.x, pA.y, cx, cy, 'A'); drawSmartLabel(pB.x, pB.y, cx, cy, 'B');
            drawSmartLabel(pC.x, pC.y + 10, pC.x, pC.y - 20, `외각 = ${A+B}°`, '#34d399', 18);
          } else {
            // 등변 사슬 AB=BC=CD(=DE)로 x, 2x, 3x, 4x 외각이 실제로 성립하도록 구성
            const stepsCnt = p2 === 2 ? 3 : 4;
            const xDeg = p1 * 2 + 4;
            const xRad = xDeg * Math.PI / 180;
            const cosX = Math.cos(xRad), sinX = Math.sin(xRad);
            const cos2X = Math.cos(2 * xRad), cos3X = Math.cos(3 * xRad);
            const side = Math.min(118, (rect.width - 80) / (2 * cosX + (stepsCnt === 4 ? 2 * cos3X : 1.15)));
            const baseY = cy + 55;
            const baseSpan = 2 * side * cosX + (stepsCnt === 4 ? 2 * side * cos3X : side * 1.15);
            const pA = { x: cx - baseSpan / 2, y: baseY };
            const pB = { x: pA.x + side * cosX, y: baseY - side * sinX };
            const pC = { x: pA.x + 2 * side * cosX, y: baseY };
            const pD = {
              x: pB.x + 2 * side * cos2X * cosX,
              y: pB.y - 2 * side * cos2X * sinX
            };
            const pE = {
              x: pC.x + (stepsCnt === 4 ? 2 * side * cos3X : side * 1.15),
              y: baseY
            };
            const pBeyondD = { x: pD.x + side * 0.58 * cosX, y: pD.y - side * 0.58 * sinX };

            // 세 등변삼각형: ABC, BCD, 그리고 4단에서 CDE
            const tris = [
              { pts: [pA, pB, pC], col: 'rgba(56, 189, 248, 0.18)' },
              { pts: [pB, pC, pD], col: 'rgba(52, 211, 153, 0.18)' }
            ];
            if (stepsCnt === 4) tris.push({ pts: [pC, pD, pE], col: 'rgba(244, 63, 94, 0.18)' });
            for (const tr of tris) {
              ctx.beginPath(); ctx.moveTo(tr.pts[0].x, tr.pts[0].y); ctx.lineTo(tr.pts[1].x, tr.pts[1].y); ctx.lineTo(tr.pts[2].x, tr.pts[2].y); ctx.closePath();
              ctx.fillStyle = tr.col; ctx.fill();
            }

            // 기준선 A-C-E, 연장선 A-B-D, 그리고 등변 사슬 B-C-D-E
            ctx.strokeStyle = '#475569'; ctx.lineWidth = 2.6; ctx.setLineDash([]);
            ctx.beginPath();
            ctx.moveTo(pA.x, pA.y); ctx.lineTo(pE.x, pE.y);
            ctx.moveTo(pA.x, pA.y); ctx.lineTo(pD.x, pD.y);
            ctx.moveTo(pB.x, pB.y); ctx.lineTo(pC.x, pC.y);
            ctx.lineTo(pD.x, pD.y);
            if (stepsCnt === 4) ctx.lineTo(pE.x, pE.y);
            ctx.stroke();

            // 4x 외각은 AD의 D 바깥 연장선에서 측정
            if (stepsCnt === 4) {
              ctx.strokeStyle = '#94A3B8'; ctx.lineWidth = 2.0; ctx.setLineDash([5, 4]);
              ctx.beginPath(); ctx.moveTo(pD.x, pD.y); ctx.lineTo(pBeyondD.x, pBeyondD.y); ctx.stroke(); ctx.setLineDash([]);
            }

            // AB=BC=CD(=DE) 표식을 같은 한 개 틱으로 표시
            drawTickMarks(pA.x, pA.y, pB.x, pB.y, 1, '#fb7185');
            drawTickMarks(pB.x, pB.y, pC.x, pC.y, 1, '#fb7185');
            drawTickMarks(pC.x, pC.y, pD.x, pD.y, 1, '#fb7185');
            if (stepsCnt === 4) drawTickMarks(pD.x, pD.y, pE.x, pE.y, 1, '#fb7185');

            const aAB = Math.atan2(pB.y - pA.y, pB.x - pA.x);
            const aBD = Math.atan2(pD.y - pB.y, pD.x - pB.x);
            const aBC = Math.atan2(pC.y - pB.y, pC.x - pB.x);
            const aCD = Math.atan2(pD.y - pC.y, pD.x - pC.x);

              return { x: cx + R * Math.cos(a), y: cy + R * Math.sin(a) };
            });
            ctx.beginPath(); ctx.moveTo(verts[0].x, verts[0].y); verts.forEach((p)=>ctx.lineTo(p.x,p.y)); ctx.closePath();
            ctx.fillStyle = 'rgba(56, 189, 248, 0.14)'; ctx.fill(); ctx.strokeStyle = '#e2e8f0'; ctx.lineWidth = 2.8; ctx.stroke();

            ctx.beginPath(); ctx.moveTo(verts[0].x, verts[0].y); ctx.lineTo(verts[1].x, verts[1].y); ctx.lineTo(verts[2].x, verts[2].y); ctx.closePath();
            ctx.fillStyle = 'rgba(52, 211, 153, 0.24)'; ctx.fill();

            ctx.strokeStyle = '#fb7185'; ctx.lineWidth = 3.2;
            ctx.beginPath();
            ctx.moveTo(verts[0].x, verts[0].y); ctx.lineTo(verts[2].x, verts[2].y);
            ctx.moveTo(verts[1].x, verts[1].y); ctx.lineTo(verts[3].x, verts[3].y);
            ctx.stroke();

            ['A(36°)', 'B(108°)', 'C(36°)', 'D', 'E'].forEach((l, i) => drawSmartLabel(verts[i].x, verts[i].y, cx, cy, l, '#e2e8f0', 20));
            drawSmartLabel(cx + R * 0.2, cy - R * 0.08, cx, cy, '교점 P (예각 72° / 둔각 108°)', '#fb7185', 10);
            { // [표시 보강] ∠BAC=∠BCA=36°(같은 초록 호), ∠ABC=108°, 두 대각선 교점 P의 예각 ∠APB=72°·둔각 ∠BPC=108°
              const ln = (a0, b0, c0, d0) => { const den = (a0.x - b0.x) * (c0.y - d0.y) - (a0.y - b0.y) * (c0.x - d0.x) || 1, tt = ((a0.x - c0.x) * (c0.y - d0.y) - (a0.y - c0.y) * (c0.x - d0.x)) / den; return { x: a0.x + tt * (b0.x - a0.x), y: a0.y + tt * (b0.y - a0.y) }; };
              const pP = ln(verts[0], verts[2], verts[1], verts[3]);
              angMark(verts[0], verts[1], verts[2], { color: '#34d399', rings: 1, r: 30, label: '36°' });
              angMark(verts[2], verts[1], verts[0], { color: '#34d399', rings: 1, r: 30, label: '36°' });
              angMark(verts[1], verts[0], verts[2], { color: '#38bdf8', rings: 2, r: 26, label: '108°' });
              angMark(pP, verts[0], verts[1], { color: '#fb7185', rings: 1, r: 22, label: '72°' });
              angMark(pP, verts[1], verts[2], { color: '#fbbf24', rings: 2, r: 22, label: '108°' });
            }
          }
        }
      }

      ctx.restore();
  }

  /* ======================================================================
     2.0 셸 연결 (새로 작성한 부분)
     ====================================================================== */
  const TABS = ['넓이 원리·바깥 직사각형', '평행선 넓이·산책로·둘레', '대각선(n-3)·내각·외각 360°', '별 모양·복잡한 외각'];
  const SHORT = ['넓이·바깥 직사각형', '평행선·산책로', '대각선·내각·외각', '별 모양·외각'];
  const QUESTIONS = [
    '삼각형·평행사변형·사다리꼴·마름모는 자르고 옮겨도 넓이가 그대로일까? 어떤 높이와 밑변을 잡아야 할까?',
    '평행선 사이에서 꼭짓점을 옮기거나 길을 내도 넓이가 변하지 않는 까닭은? 그때 둘레는 어떻게 달라질까?',
    'n각형의 한 꼭짓점·내부의 점에서 선을 그어 내각의 합과 외각의 합을 어떻게 구할까?',
    '별 모양처럼 얽힌 도형의 각은 외각의 성질과 보조선으로 어떻게 풀 수 있을까?'
  ];
  const STEPS = [
    '직각(∟)·평행(≫)·같은 길이(||) 기호를 찾아 표시합니다',
    '보조선을 긋고 조각을 옮겨 봅니다',
    '꼭짓점 이름과 공식을 붙여 식을 세웁니다'
  ];
  const ANIM_CHIPS = [[0, '원래대로 0%'], [0.5, '중간 50%'], [1, '완성 100%']];
  const LABEL4 = ['조건 치수', '핵심 부분값', '보조선·외각 이동', '최종 넓이·각도'];
  const COLOR4 = ['ink', 'sky', 'rose', 'green'];

  // 원본 setMode 의 첫 p1: 탭 3(다각형)은 6, 나머지는 8
  const LEGACY_P1 = (m) => (m === 3 ? 6 : 8);
  const dedupe = (btns) => { const seen = new Set(); return btns.filter(([v]) => (seen.has(v) ? false : (seen.add(v), true))); };

  // 이 장면·유형에서 이동·변형(animProg)이 그림을 실제로 바꾸는지 — 원본 render 에서 t 를 쓰는 곳 기준
  const usesAnim = (m, id, p2) => {
    if (m === 2 && id === 'stairFold') return p2 < 3;
    if (m === 4 && id === 'stepExt') return p2 === 1;
    if (m === 4 && id === 'boomBow') return p2 < 3;
    if (m === 4 && id === 'starMaster') return p2 !== 2 && p2 !== 4;
    if (m === 4 && id === 'bisect3') return false;
    return true;
  };
  // 마법 보조선이 처음에는 숨겨져 있다가 렌즈·이동·2단계에서 나타나는 곳
  const auxHidden = (m, id, p2) => m === 4 && ((id === 'stepExt' && p2 === 1) || (id === 'boomBow' && p2 < 3));
  const hasLens = (m, id, p2) => (m === 1 && id === 'trapRot' && p2 !== 2 && p2 !== 3) || auxHidden(m, id, p2);
  const hasTape = (m, id, p2) => m === 2 && id === 'railWing' && p2 >= 3;
  // 이 장면·유형에서 g2 칩 중 그림/식이 실제로 달라지는 값만 (나머지는 이름만 다른 같은 그림)
  const P2_SHOW = {
    triAlt: [1, 2], paraMove: [], trapRot: [1, 2], boxFrame: [1, 3],
    railWing: [1, 3], baseRatio: [0, 1, 2, 4], roadMerge: [1, 2, 3, 4], stairFold: [1, 3],
    oneDiag: [], inPointO: [], allDiag: [], ext360: [1, 2, 3],
    stepExt: [1, 2, 3], boomBow: [1, 3], starMaster: [1, 2, 4], bisect3: [1, 2, 3, 4]
  };

  // 원본이 px 고정값(cx±145 같은)으로 그린 장면은 무대 크기에 따라 그림 전체를 키우거나(큰 무대) 줄입니다(짧은 휴대폰 무대)
  const ROOT_S = (m, id, p2, aw, ah) => {
    const abs = m === 4 && (id === 'stepExt' || id === 'boomBow' || (id === 'bisect3' && p2 <= 3));
    if (!abs) return 1;
    if (aw < 700) return clamp(ah / 250, 0.62, 1);
    if (id === 'stepExt') return p2 === 1 ? 1.5 : 1.35;
    if (id === 'boomBow') return 1.5;
    return 1.3;
  };

  /* 셸 상태 → 원본 state 로 옮기기 */
  function sync(s, m, id, lab, thumb) {
    const rv = !thumb && lab && lab.tab === 'review';
    state.mode = m;
    state.sub[m] = id;
    state.p1 = s.p1;
    state.p2 = s.p2;
    state.animProg = s.anim;
    state.lens = s.lens;
    state.showAntTape = !!s.tape;
    state.dragXRatio = s.dragX;
    state.dragYRatio = s.dragY;
    state.offsetX = 0;
    state.offsetY = 0;
    state.steps[1] = rv ? s.step >= 1 : true;
    state.steps[2] = rv ? s.step >= 2 : !auxHidden(m, id, s.p2);
    state.steps[3] = rv ? s.step >= 3 : true;
  }
  function specOf(s, m, id) {
    sync(s, m, id, null, true);
    const sp = getSpec();
    const out = arrow({ ...sp, g1Btns: undefined, g2Btns: undefined });
    // 정오각형 대각선 교각(bisect3 4번)은 p1 칩('구하는 각 위치')이 그림·식에 쓰이지 않아 숨김
    out.g1Btns = id === 'bisect3' && s.p2 === 4 ? [] : dedupe(sp.g1Btns).map(([v, l]) => [v, APLab.stripEmoji(l)]);
    out.g2Btns = dedupe(sp.g2Btns).filter(([v]) => (P2_SHOW[id] || []).includes(v)).map(([v, l]) => [v, APLab.stripEmoji(l)]);
    return out;
  }
  const nearest = (vals, target) => vals.reduce((a, b) => (Math.abs(b - target) < Math.abs(a - target) ? b : a), vals[0]);
  // 지금 유형의 p1 칩 값 중 target 에 가장 가까운 값
  function validP1(s, m, id, target) {
    const sp = specOf(s, m, id);
    const vals = sp.g1Btns.map(([v]) => v);
    return !vals.length || vals.includes(target) ? target : nearest(vals, target);
  }
  const DEFAULT_P1 = { baseRatio: 3 };

  function problemHTML(s, m, id) {
    const sp = specOf(s, m, id);
    const sel = s.quiz;
    const opts = sp.opts.map((o, i) => `<button type="button" class="g7-opt${sel === i ? (o.ok ? ' ok' : ' bad') : ''}" data-g7q="${i}">${o.t}</button>`).join('');
    const fb = sel == null || !sp.opts[sel] ? '' : `<div class="g7-fb ${sp.opts[sel].ok ? 'ok' : 'bad'}">${sp.opts[sel].msg}</div>`;
    return `<div>${sp.q}</div><div class="g7-opts">${opts}</div>${fb}`;
  }
  document.addEventListener('click', (e) => {
    const b = e.target.closest && e.target.closest('[data-g7q]');
    const lab = window.lab;
    if (!b || !lab || !lab.scene || lab.scene.m == null) return;
    const i = +b.dataset.g7q;
    lab.s.quiz = lab.s.quiz === i ? null : i;
    const sp = specOf(lab.s, lab.scene.m, lab.scene.id);
    if (lab.s.quiz != null && sp.opts[lab.s.quiz] && sp.opts[lab.s.quiz].ok && usesAnim(lab.scene.m, lab.scene.id, lab.s.p2)) lab.tween({ anim: 1 }, 900); // 원본: 정답을 고르면 완성(100%)으로
    lab.invalidate(true);
  });

  function hintOf(s, m, id) {
    const p2 = s.p2;
    if ((id === 'triAlt' && p2 !== 2) || (id === 'railWing' && p2 >= 3)) return '빛나는 표시가 있는 <b>꼭짓점 A</b>를 좌우로 끌어 보세요. 밑변과 높이가 그대로이면 넓이도 그대로입니다.';
    if (id === 'inPointO') return '빛나는 표시가 있는 <b>점 O</b>를 다각형 안에서 끌어 보세요. O를 어디에 두어도 삼각형은 변의 수만큼 생깁니다.';
    if (usesAnim(m, id, p2)) return '조절 막대나 <b>실행 버튼</b>으로 조각을 옮기고 합쳐 보세요. 위의 버튼으로 값과 유형을 바꿀 수 있습니다.';
    return '위의 버튼으로 값과 유형을 바꾸면서 그림과 식이 어떻게 달라지는지 비교해 보세요.';
  }

  function sceneOf(m, it) {
    const id = it.id;
    const label = arrow(it.label);
    return {
      id, m, title: label, short: label, reviewTab: true,
      question: QUESTIONS[m - 1],
      steps: STEPS,
      notesTitle: '틀리기 쉬운 부분과 직관',
      enter: (s) => {
        // 원본 setMode / setSub 의 초기화 규칙: 이동·변형 0%, 유형 1, 퀴즈 비움
        s.p2 = 1;
        s.anim = 0;
        s.lens = 'all';
        s.tape = false;
        s.quiz = null;
        s.dragX = 0.35;
        s.dragY = 0.45;
        s.p1 = validP1({ ...s, p1: LEGACY_P1(m), p2: 1 }, m, id, DEFAULT_P1[id] || LEGACY_P1(m));
      },
      controls: (s) => (usesAnim(m, id, s.p2) ? ['anim'] : []),
      presets: (s) => {
        const sp = specOf(s, m, id);
        const out = [];
        const fixP1 = (st) => { st.p1 = validP1(st, m, id, st.p1); };
        sp.g1Btns.forEach(([v, l]) => out.push({ group: sp.g1Label, label: l, apply: (st) => { st.p1 = v; st.quiz = null; }, on: (st) => st.p1 === v }));
        if (sp.g2Btns.length > 1) {
          sp.g2Btns.forEach(([v, l]) => out.push({
            group: sp.g2Label, label: l,
            apply: (st, lab) => {
              st.p2 = v;
              st.quiz = null;
              fixP1(st);
              if (id === 'ext360') lab.tween({ anim: v === 1 ? 0 : v === 2 ? 0.5 : 1 }, 700); // 원본 setP2: 수축 단계 스냅
            },
            on: (st) => st.p2 === v
          }));
        }
        if (usesAnim(m, id, s.p2) && id !== 'ext360') ANIM_CHIPS.forEach(([v, l]) => out.push({ group: '조각 이동·변형', label: l, set: { anim: v }, ms: 600, on: (st) => Math.abs(st.anim - v) < 0.01 }));
        if (hasLens(m, id, s.p2)) {
          out.push({ group: '관찰 방식', label: '전체 보기', apply: (st) => { st.lens = 'all'; }, on: (st) => st.lens === 'all' });
          out.push({ group: '관찰 방식', label: '보조선', apply: (st, lab) => { st.lens = 'aux'; lab.tween({ anim: 1 }, 700); }, on: (st) => st.lens === 'aux' });
        }
        if (hasTape(m, id, s.p2)) {
          out.push({ group: '둘레 줄자', label: '켜기', apply: (st) => { st.tape = true; }, on: (st) => !!st.tape });
          out.push({ group: '둘레 줄자', label: '끄기', apply: (st) => { st.tape = false; }, on: (st) => !st.tape });
        }
        return out;
      },
      actions: (s) => (usesAnim(m, id, s.p2) ? [{
        id: 'act', play: true, primary: true, icon: 'wand',
        label: (st) => specOf(st, m, id).actionTxt,
        run: (st, lab) => { lab.tween({ anim: st.anim > 0.5 ? 0 : 1 }, 1100); }
      }] : []),
      view: (s, lab) => {
        const sp = specOf(s, m, id);
        return {
          guide: `<div style="font-weight:800;margin-bottom:6px">${APLab.esc(sp.badge)}</div>${hintOf(s, m, id)}`,
          chips: [{ html: sp.eqHTML }],
          readouts: sp.stats.map((t, i) => ({ label: LABEL4[i], value: t, color: COLOR4[i], wide: true })),
          formula: sp.eqHTML
        };
      },
      problem: {
        tag: '핵심 문제 유형',
        text: (s) => problemHTML(s, m, id),
        answer: (s) => specOf(s, m, id).ans,
        // 원본 snapToProblem: p1 = 8 + 이동 100%. [2.0 수정] 8이 칩에 없는 장면은 가장 가까운 유효한 칩 값으로
        snap: (s) => { s.p1 = validP1(s, m, id, 8); s.quiz = null; return { anim: usesAnim(m, id, s.p2) ? 1 : s.anim }; }
      },
      solution: {
        standardTitle: '풀이 과정과 주의할 점', standardTag: '교과서 풀이',
        quickTitle: '보조선 · 외각 옮기기 · 간단한 계산', quickTag: '간단한 풀이',
        standard: (s) => ({ steps: specOf(s, m, id).std }),
        quick: (s) => ({ steps: specOf(s, m, id).fast })
      },
      draw: (b, s, v, lab) => {
        BOARD = b;
        CUR = s;
        const thumb = b.thumb;
        let aw = VW, ah = VH, S = 1;
        if (!thumb) {
          // 원본은 캔버스 전체 크기로 그렸습니다 → 무대 도형 영역(칩·도구 가장자리를 뺀 곳)을 화면 1px = 설계 1로 대응시킵니다.
          const a = b._area();
          aw = a.w;
          ah = a.h;
          b.focus = { x: [0, aw], y: [0, ah] };
          S = ROOT_S(m, id, s.p2, aw, ah);
        } else S = ROOT_S(m, id, s.p2, 1000, 800);
        // 원본은 무대의 3%를 1cm로 잡아 도형이 작았습니다 → 2.0 무대는 그림을 크게 쓰므로 크기 단위(px)를 키웁니다(원본 state.scale 자리)
        // 넓이 장면(탭 1·2)은 px 단위가 작아 도형이 작게 보이므로 무대 폭·높이에 맞춰 키웁니다. 다각형·별(R 기준)은 높이에 맞춘 1.3배.
        state.scale = thumb ? (m <= 2 ? 2 : 1.45) : m <= 2 ? clamp(Math.min(0.036 * aw, 0.085 * ah) / (Math.min(aw, ah) * 0.032), 1.3, 2.4) : 1.3;
        sync(s, m, id, lab, thumb);
        ctx.bind(b, S);
        sink.tape = null;
        if (s.grid && !thumb) b.grid({ step: 40 });
        renderScene({ width: aw / S, height: ah / S });
        v.tape = sink.tape;
      }
    };
  }

  const groups = Object.keys(SUB_MENUS).map((k) => {
    const m = +k;
    return { id: 'm' + m, title: TABS[m - 1], short: SHORT[m - 1], scenes: SUB_MENUS[m].map((it) => sceneOf(m, it)) };
  });

  APLab.createLab({
    id: 'g7-polygons',
    title: '평면도형 · 다각형 · 넓이',
    courseName: '중1',
    unit: '평면도형',
    courseColor: 'var(--m-green)',
    home: '../index.html#g7',
    legacy: '../../labs/g7/polygons-area.html',
    board: { kind: 'figure', pad: 0, thumbPad: 0.04, focus: { x: [0, VW], y: [0, VH] }, minZoom: 0.5, maxZoom: 4 },
    state: { p1: 8, p2: 1, anim: 0, lens: 'all', tape: false, quiz: null, dragX: 0.35, dragY: 0.45 },
    params: {
      anim: { value: 0, min: 0, max: 1, step: 0.01, color: 'amber', label: '조각 이동·변형 진행', hint: '0%(원래 도형)에서 100%(완성)까지 조각이 움직입니다', format: (v) => `${Math.round(v * 100)}%` }
    },
    groups
  });
});
</script>
