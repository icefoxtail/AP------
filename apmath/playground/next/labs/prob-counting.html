<script>
/* ==========================================================================
   확률과 통계 · 경우의 수 실험실 (AP Math Lab 2.0 신규 제작)
   장면: ① 중복조합(공과 칸막이) ② 중복순열·함수의 개수 ③ 같은 것이 있는 순열·도로망 최단 경로
         ④ 이웃하지 않는 배열 ⑤ 원순열(이전 교육과정)
   - 그림이 직접 세어 줍니다: 화면에 보이는 개수와 공식 값은 같은 계산(전수 열거)에서 나옵니다.
   - 문제는 기출 유형의 숫자·상황을 바꾼 변형이며 「새 문제」로 바꿉니다(정답은 모두 정수).
   - 그림은 화면 픽셀 크기에 맞춰 직접 배치합니다(확대·이동 없음). 폰과 PC에서 같은 순서로 쌓여 보입니다.
   ========================================================================== */
window.addEventListener('DOMContentLoaded', function () {
  const { tex, fmt, clamp } = APLab;

  /* ======================================================================
     1. 셈 도구 · 변형 생성기 · 그림 도우미
     ====================================================================== */
  const fact = (n) => { let r = 1; for (let i = 2; i <= n; i++) r *= i; return r; };
  const C = (n, r) => { if (n < 0 || r < 0 || r > n) return 0; r = Math.min(r, n - r); let v = 1; for (let i = 1; i <= r; i++) v = (v * (n - r + i)) / i; return Math.round(v); };
  const Pm = (n, r) => { if (r < 0 || r > n) return 0; let v = 1; for (let i = 0; i < r; i++) v *= n - i; return v; };
  const Hc = (n, r) => (r < 0 ? 0 : n === 0 ? (r === 0 ? 1 : 0) : C(n + r - 1, r)); // 중복조합 nHr
  const SUB = '₀₁₂₃₄₅₆₇₈₉';
  const sub = (n) => String(n).replace(/\d/g, (d) => SUB[+d]);
  let lessonRandom=null; // Only deterministic lesson packets use this local source.
  const rint = (n) => Math.floor((lessonRandom||Math.random)() * n);
  const pickOf = (arr, not) => { let x; do x = arr[rint(arr.length)]; while (arr.length > 1 && x === not); return x; };
  const texC = (n, r) => `{}_{${n}}\\mathrm{C}_{${r}}`;
  const texP = (n, r) => `{}_{${n}}\\mathrm{P}_{${r}}`;
  const texH = (n, r) => `{}_{${n}}\\mathrm{H}_{${r}}`;
  const texPi = (n, r) => `{}_{${n}}\\Pi_{${r}}`;
  const LET = 'ABCDEFGHIJ';
  // 변형 생성기: gen(이전 변형|null) → 새 변형(key 필수). 처음에는 기출 유형 그대로(gen(null)). 연속으로 같은 문제가 나오지 않게 합니다.
  function varier(gen) {
    let cur = gen(null);
    return { lessonSample: previous => gen(previous), cur: () => cur, next: () => { let nx, t = 0; do { nx = gen(cur); t++; } while (nx.key === cur.key && t < 60); cur = nx; return cur; } };
  }
  const probHTML = (body) => `${body}<div style="margin-top:10px"><button type="button" class="apl-btn sm" data-pc-new>새 문제</button></div>`;
  document.addEventListener('click', (ev) => {
    const hit = ev.target && ev.target.closest && ev.target.closest('[data-pc-new]');
    if (!hit) return;
    const lab = window.lab, sc = lab && lab.scene;
    if (!sc || !sc.vary) return;
    sc.vary.next();
    lab.s.revealed = false;
    lab.setStep(0);
    try { lab._buildProblem(); lab._buildReview(); } catch (e) { /* 키트가 바뀌어도 그림은 그대로 */ }
    lab.invalidate(true);
  });
  const probOf = (v) => (typeof v === 'function' ? v() : v);

  // 화면 픽셀 크기 그림판: 무대(b)의 그릴 수 있는 영역을 폭 W × 높이 H 화면 픽셀(왼쪽 위가 원점, y 아래쪽)로 쓰게 맞춥니다.
  function mkG(b) {
    const A = b._area();
    const pad = b.pad * Math.min(A.w, A.h);
    const u = clamp(Math.min((A.w - 2 * pad) / 460, (A.h - 2 * pad) / 430), 1, 1.5); // 큰 화면에서는 그림을 키웁니다(글자는 그대로)
    const W = Math.max(120, (A.w - 2 * pad) / u), H = Math.max(120, (A.h - 2 * pad) / u);
    b.focus = { x: [0, W], y: [0, H] };
    b.zoom = 1; b.panX = 0; b.panY = 0;
    const k = b.k; // 화면 픽셀 / 설계 단위 (보통 1~1.5)
    const g = {
      W, H, k, b, dy: 0,
      Y(y) { return H - y - g.dy; },
      rect(x, y, w, h, o = {}) { b.poly([[x, g.Y(y)], [x + w, g.Y(y)], [x + w, g.Y(y + h)], [x, g.Y(y + h)]], o); },
      seg(x1, y1, x2, y2, o) { b.seg([x1, g.Y(y1)], [x2, g.Y(y2)], o); },
      poly(pts, o) { b.poly(pts.map((q) => [q[0], g.Y(q[1])]), o); },
      dot(x, y, r, o = {}) { b.point([x, g.Y(y)], { r: Math.max(2.5, r * k), glow: false, ...o }); },
      txt(x, y, s, o = {}) { if (s !== '' && s != null) b.text([x, g.Y(y)], s, { baseline: 'middle', ...o }); },
      handle(id, x, y, o = {}) { const drag = o.drag; b.handle(id, [x, g.Y(y)], { ...o, drag: (w) => drag(w.x, H - w.y - g.dy) }); },
      title(y, s, o = {}) { const { x, ...rest } = o; g.txt(x != null ? x : 4, y, s, { size: 12, color: 'muted', align: 'left', weight: 800, ...rest }); }
    };
    return g;
  }
  // 문제·정리 탭 그림: 한 번 재어 본 뒤 그림을 세로 가운데로 옮겨 그립니다(큰 화면에서 위쪽에만 몰리지 않게).
  function paint(b, fn) {
    const bb = b.measure(() => fn(mkG(b)));
    const g = mkG(b);
    if (bb) {
      const top = g.H - bb.y1 - 12, bot = g.H - bb.y0 + 12, h = bot - top;
      if (h < g.H) g.dy = clamp((g.H - h) / 2 - top, 0, g.H * 0.3);
    }
    fn(g);
  }
  // 캔버스를 누른 곳(탭)을 알려 줍니다. 끌기·핸들 조작은 무대가 먼저 처리하므로 핸들을 누른 경우는 걸러 냅니다.
  const tapHooks = new WeakMap();
  function onTap(canvas, fn) {
    let d = null;
    canvas.addEventListener('pointerdown', (e) => { d = { x: e.clientX, y: e.clientY, t: performance.now(), drag: !!(lab && lab.board && lab.board.dragging) }; });
    canvas.addEventListener('pointerup', (e) => {
      if (!d) return;
      const mv = Math.hypot(e.clientX - d.x, e.clientY - d.y), dt = performance.now() - d.t, wasDrag = d.drag;
      d = null;
      if (wasDrag || mv > 9 || dt > 700) return;
      const r = canvas.getBoundingClientRect();
      fn({ x: e.clientX - r.left, y: e.clientY - r.top });
    });
  }
  let lab = null; // 만들어진 실험실(핸들 끌기 확인용)

  const BOX = ['sky', 'rose', 'green', 'violet', 'orange'];
  const ballColor = (i) => BOX[i % BOX.length];
  // 공 n개를 사각형 칸 안에 줄 바꿔 채웁니다(칸을 벗어나지 않는 가장 큰 반지름을 고름).
  function ballsIn(g, x, y, w, h, n, o = {}) {
    if (n <= 0) return 0;
    let r = o.rmax || 10;
    let cols = 1, rows = 1;
    for (; r >= 4; r -= 0.5) {
      cols = Math.max(1, Math.floor((w - 6) / (2 * r + 3)));
      rows = Math.ceil(n / cols);
      if (rows * (2 * r + 3) <= h - 4) break;
    }
    const gap = 2 * r + 3;
    const usedCols = Math.min(cols, n);
    const ox = x + (w - usedCols * gap + 3) / 2 + r, oy = y + 4 + r;
    for (let i = 0; i < n; i++) {
      const cx = ox + (i % cols) * gap, cy = oy + Math.floor(i / cols) * gap;
      g.dot(cx, cy, r, { color: o.color || 'sky', hollow: !!o.hollow });
    }
    return r;
  }
  // 한 줄 배열(공 n개 + 칸막이 k−1개): dv = 칸막이가 놓인 칸 번호(0부터, 오름차순)
  function dvToTuple(dv, n, k) { const t = []; let prev = -1; for (let i = 0; i < k - 1; i++) { t.push(dv[i] - prev - 1); prev = dv[i]; } t.push(n + k - 2 - prev); return t; }
  function tupleToDv(t) { const dv = []; let p = -1; for (let i = 0; i < t.length - 1; i++) { p += t[i] + 1; dv.push(p); } return dv; }
  function drawStrip(g, o) {
    const { x0, y0, p, n, k, dv } = o, S = n + k - 1;
    const isDiv = new Map(); dv.forEach((v, j) => isDiv.set(v, j));
    let box = 0;
    const centers = [];
    for (let i = 0; i < S; i++) {
      const x = x0 + i * p;
      if (isDiv.has(i)) {
        g.rect(x, y0, p, p, { fill: 'amber', fillAlpha: 0.1, color: 'amber', alpha: 0.35, width: 1 });
        const bw = Math.max(4, p * 0.14);
        g.rect(x + p / 2 - bw / 2, y0 - 4, bw, p + 8, { fill: 'amber', color: null });
        centers[isDiv.get(i)] = x + p / 2;
        box++;
      } else {
        const c = o.mono ? o.mono : ballColor(box);
        g.rect(x, y0, p, p, { fill: c, fillAlpha: 0.12, color: c, alpha: 0.45, width: 1 });
        g.dot(x + p / 2, y0 + p / 2, p * 0.36, { color: c, hollow: !!o.hollow });
      }
      if (o.numbers && p >= 21) g.txt(x + p / 2, y0 + p + 11, String(i + 1), { size: 12, color: 'muted', weight: 700 });
    }
    if (o.drag) {
      dv.forEach((v, j) => {
        g.handle('dv' + j, x0 + v * p + p / 2, y0 + p / 2, { color: 'amber', r: 8, step: p, ariaLabel: `칸막이 ${j + 1} (끌어서 옮기기)`,
          drag: (x) => { const i = Math.round((x - x0) / p - 0.5); const lo = j === 0 ? 0 : dv[j - 1] + 1, hi = j === k - 2 ? S - 1 : dv[j + 1] - 1; dv[j] = clamp(i, lo, hi); o.drag(j); } });
      });
    }
    return centers;
  }
  // 상자 칸: 상자 i에 든 공 t[i]개 (viol[i]이면 조건 위반 표시)
  function drawBoxes(g, o) {
    const { x, y, w, h, t, viol, names } = o, k = t.length, gap = 6, bw = (w - gap * (k - 1)) / k;
    t.forEach((cnt, i) => {
      const bx = x + i * (bw + gap), bad = viol && viol[i], c = bad ? 'red' : ballColor(i);
      g.rect(bx, y, bw, h, { fill: c, fillAlpha: 0.08, color: c, alpha: bad ? 0.95 : 0.7, width: bad ? 2.4 : 1.6 });
      g.txt(bx + 6, y + 11, names ? names[i] : `상자 ${i + 1}`, { size: 12, color: c, align: 'left', weight: 800 });
      if (!o.hideCount) g.txt(bx + bw - 6, y + 11, `${cnt}${o.unit || '개'}`, { size: 13, color: c, align: 'right', weight: 850 });
      ballsIn(g, bx, y + 22, bw, h - 24, cnt, { color: ballColor(i), rmax: o.rmax || 10 });
      if (o.sub && o.sub[i]) g.txt(bx + bw / 2, y + 22 + (h - 24) / 2, o.sub[i], { size: 13, color: o.subColor || 'ink', weight: 800 });
    });
  }

  /* ======================================================================
     장면 1 · 중복조합 — 공과 칸막이 (F)
     근거: 2026 수능 30(상한이 있는 분배) · 2025 9월 모평 30(조건이 붙은 분배) · 2024 수능 29(비감소 순서쌍) · 2022 3월/10월 학평(하한)
     ====================================================================== */
  const tupCache = {};
  function allTuples(n, k) {
    const key = n + ',' + k;
    if (tupCache[key]) return tupCache[key];
    const out = [];
    const rec = (i, left, cur) => {
      if (i === k - 1) { out.push([...cur, left]); return; }
      for (let v = 0; v <= left; v++) { cur.push(v); rec(i + 1, left - v, cur); cur.pop(); }
    };
    rec(0, n, []);
    return (tupCache[key] = out);
  }
  const okT = (t, cond) => t.every((v, i) => v >= cond.lo && v <= cond.caps[i]);
  const tkey = (t) => t.join(',');
  const subTuple = (t) => `(${t.join(', ')})`;
  const xs = (k) => Array.from({ length: k }, (_, i) => `x${sub(i + 1)}`).join(', ');

  // 격자(정수해 지도): k=2는 한 줄, k=3은 (x₁,x₂) 삼각 격자, k=4는 (x₁,x₂) 격자에 남은 (x₃,x₄) 경우의 수를 적습니다.
  // o: {x,y,w,h,n,k,cond,cur,vis,phase('neutral'|'bad'|'good'),notes,showTicks}
  const LAT = { box: null };
  function drawLattice(g, o) {
    const { x, y, w, h, n, k, cond, cur, vis } = o;
    const phase = o.phase || 'good';
    const tuples = allTuples(n, k);
    const wt = {}, tot = {};
    tuples.forEach((t) => {
      const kk = k === 2 ? t[0] : t[0] + ',' + t[1];
      tot[kk] = (tot[kk] || 0) + 1;
      if (okT(t, cond)) wt[kk] = (wt[kk] || 0) + 1;
    });
    let c, rd;
    if (k === 2) {
      c = Math.min((w - 20) / (n + 1), 46);
      rd = clamp(c * 0.34, 5, 12);
      const y0 = y + h * 0.5;
      const x0 = x + (w - c * n) / 2;
      g.seg(x0, y0, x0 + n * c, y0, { color: 'muted', alpha: 0.6, width: 1.4 });
      for (let i = 0; i <= n; i++) {
        const key = String(i), ok = !!wt[key], seen = vis && vis.has(tkey([i, n - i]));
        const px = x0 + i * c;
        if (!ok) { g.rect(px - c / 2, y0 - c * 0.7, c, c * 1.4, { fill: 'red', fillAlpha: phase === 'neutral' ? 0 : 0.16, color: null }); g.dot(px, y0, 3.5, { color: phase === 'neutral' ? 'ink' : 'red' }); }
        else g.dot(px, y0, rd, { color: phase === 'good' ? 'green' : 'ink', hollow: phase === 'good' && !seen });
        if (c >= 22 || i % 2 === 0) g.txt(px, y0 + rd + 11, String(i), { size: 12, color: 'muted', weight: 700 });
        if (cur && cur[0] === i && o.showCur !== false) g.dot(px, y0, rd + 6, { color: 'amber', hollow: true });
      }
      g.txt(x0 + n * c / 2, y0 - rd - 16, 'x₁의 값 (x₂ = ' + n + ' − x₁)', { size: 12, color: 'muted', weight: 700 });
      LAT.box = { k, x0, y0, c, n, kind: 'line' };
    } else {
      c = Math.min((w - 52) / (n + 1), (h - 44) / (n + 1), 44);
      rd = clamp(c * 0.36, 4, 12);
      const ox = x + Math.max(34, (w - (34 + (n + 0.7) * c + 18)) / 2 + 34), oy = y + h - 30;
      // 어긋나는 영역 선(점선)
      const lineV = (v) => g.seg(ox + v * c, oy + 6, ox + v * c, oy - (n + 0.6) * c, { color: 'red', alpha: 0.75, width: 1.5, dash: [5, 4] });
      const lineH = (v) => g.seg(ox - 6, oy - v * c, ox + (n + 0.6) * c, oy - v * c, { color: 'red', alpha: 0.75, width: 1.5, dash: [5, 4] });
      g.seg(ox - 6, oy, ox + (n + 0.7) * c, oy, { color: 'muted', alpha: 0.7, width: 1.4 });
      g.seg(ox, oy + 6, ox, oy - (n + 0.7) * c, { color: 'muted', alpha: 0.7, width: 1.4 });
      g.txt(ox + (n + 0.7) * c + 4, oy, 'x₁', { size: 13, color: 'ink', weight: 850, align: 'left' });
      g.txt(ox, oy - (n + 0.7) * c - 10, 'x₂', { size: 13, color: 'ink', weight: 850 });
      const stepT = c >= 20 ? 1 : 2;
      for (let i = 0; i <= n; i += stepT) { g.txt(ox + i * c, oy + 14, String(i), { size: 12, color: 'muted', weight: 700 }); if (i > 0) g.txt(ox - rd - 9, oy - i * c, String(i), { size: 12, color: 'muted', weight: 700 }); }
      if (k === 3) g.seg(ox + n * c, oy, ox, oy - n * c, { color: 'muted', alpha: 0.55, width: 1.2, dash: [3, 4] });
      if (phase !== 'neutral') {
        if (cond.lo > 0) { lineV(cond.lo - 0.5); lineH(cond.lo - 0.5); if (k === 3) g.seg(ox + (n - cond.lo + 0.5) * c, oy, ox, oy - (n - cond.lo + 0.5) * c, { color: 'red', alpha: 0.75, width: 1.5, dash: [5, 4] }); }
        if (isFinite(cond.caps[0])) lineV(cond.caps[0] + 0.5);
        if (isFinite(cond.caps[1])) lineH(cond.caps[1] + 0.5);
        if (k === 3 && isFinite(cond.caps[2]) && cond.caps[2] < n) g.seg(ox + (n - cond.caps[2] - 0.5) * c, oy, ox, oy - (n - cond.caps[2] - 0.5) * c, { color: 'red', alpha: 0.75, width: 1.5, dash: [5, 4] });
      }
      for (let i = 0; i <= n; i++) {
        for (let j = 0; i + j <= n; j++) {
          const key = i + ',' + j, ok = !!wt[key], px = ox + i * c, py = oy - j * c;
          if (!ok) {
            if (phase !== 'neutral') g.rect(px - c / 2, py - c / 2, c, c, { fill: 'red', fillAlpha: 0.17, color: null });
            g.dot(px, py, phase === 'neutral' ? rd * 0.8 : 3, { color: phase === 'neutral' ? 'ink' : 'red', hollow: phase === 'neutral' });
          } else {
            let seen = false;
            if (vis) { seen = true; for (const t of tuples) if (t[0] === i && t[1] === j && okT(t, cond) && !vis.has(tkey(t))) { seen = false; break; } }
            g.dot(px, py, rd, { color: phase === 'good' ? 'green' : 'ink', hollow: phase !== 'good' || !seen });

  /* ======================================================================

  const surj = (m, r) => { let v = 0; for (let k = 0; k <= r; k++) v += (k % 2 ? -1 : 1) * C(r, k) * Math.pow(r - k, m); return v; };
  const funcCache = {};
  function allFuncs(m, n) {
    const key = m + ',' + n;
    if (funcCache[key]) return funcCache[key];
    const out = [];
    const rec = (i, cur) => { if (i === m) { out.push(cur.slice()); return; } for (let v = 0; v < n; v++) { cur.push(v); rec(i + 1, cur); cur.pop(); } };
    rec(0, []);
    return (funcCache[key] = out);
  }
  const isInj = (f) => new Set(f).size === f.length;
  const isMono = (f) => f.every((v, i) => i === 0 || f[i - 1] <= v);
  const okF = (f, mode) => (mode === 'inj' ? isInj(f) : mode === 'mono' ? isMono(f) : true);
  const fval = (m, n, mode) => (mode === 'inj' ? Pm(n, m) : mode === 'mono' ? Hc(n, m) : Math.pow(n, m));
  const fkey = (f) => f.join('');

  const P2 = {
    fm: { value: 3, min: 2, max: 5, step: 1, color: 'rose', label: '정의역 X의 원소 수 m', format: (v) => `m = ${v}` },
    fn: { value: 3, min: 2, max: 5, step: 1, color: 'sky', label: '공역 Y의 원소 수 n', format: (v) => `n = ${v}` }
  };
  function ensure2(s) {
    if (!s.fmode) s.fmode = 'all';
    const sig = `${s.fm},${s.fn},${s.fmode}`;
    if (!s.f || s.fsig !== sig) {
      const old = s.f || [];
      s.f = Array.from({ length: s.fm }, (_, i) => clamp(old[i] != null ? old[i] : (i * 2 + 1) % s.fn, 0, s.fn - 1));

  // 화살표 대응도. o: {x,y,w,h,m,n,f,title,xNames,yNames,strike,hi,drag}

    const xX = x + 20, xY = x + w - 20, r = Math.min(18, rowH * 0.42);

    g.txt(xX, y + 21, o.xHead || 'X', { size: 12, color: 'muted', weight: 800 });

    const cnt = Array(n).fill(0);
    if (f) f.forEach((v) => { cnt[v]++; });
    for (let j = 0; j < n; j++) {
      const inRange = f && cnt[j] > 0, hi = o.hi && o.hi.includes(j), st = o.strike && o.strike.includes(j);
      g.dot(xY, yY(j), r, { color: st ? 'red' : hi ? 'amber' : inRange ? 'green' : 'muted', hollow: !(inRange || hi) });
      g.txt(xY, yY(j), o.yNames ? o.yNames[j] : String(j + 1), { size: 13, color: inRange || hi ? 'ink' : 'muted', weight: 850 });
      if (st) { g.seg(xY - r, yY(j) - r, xY + r, yY(j) + r, { color: 'red', width: 2.2 }); g.seg(xY - r, yY(j) + r, xY + r, yY(j) - r, { color: 'red', width: 2.2 }); }
    }
    for (let i = 0; i < m; i++) {
      g.dot(xX, yX(i), r, { color: BOX[i % 5] });
      g.txt(xX, yX(i), o.xNames ? o.xNames[i] : String(i + 1), { size: 13, color: 'ink', weight: 850 });
    }
    const handles = [];
    if (f) {
      for (let i = 0; i < m; i++) {
        const sx = xX + r + 2, sy = yX(i), ex = xY - r - 3, ey = yY(f[i]);
        g.seg(sx, sy, ex, ey, { color: BOX[i % 5], width: 2.4 });
        const ang = Math.atan2(ey - sy, ex - sx), ux = Math.cos(ang), uy = Math.sin(ang);
        g.poly([[ex + ux * 3, ey + uy * 3], [ex - ux * 9 - uy * 5, ey - uy * 9 + ux * 5], [ex - ux * 9 + uy * 5, ey - uy * 9 - ux * 5]], { fill: BOX[i % 5], color: null });
        if (o.drag) {
          const hx = Math.max(sx + 16, ex - 12 - i * 11), tt = (hx - sx) / Math.max(1, ex - sx), hy = sy + (ey - sy) * tt;
          handles.push([i, hx, hy]);
        }
      }
      handles.forEach(([i, hx, hy]) => g.handle('fx' + i, hx, hy, { color: BOX[i % 5], r: 7, step: rowH, ariaLabel: `${i + 1}에 대응하는 값 (위아래로 끌기)`,
        drag: (px, py) => { const j = clamp(Math.round((py - top) / rowH - 0.5 - (rows - n) / 2), 0, n - 1); o.drag(i, j); } }));
    }
    return { yX, yY, rowH };
  }

  // 함수의 그래프 격자(가로 x, 세로 f(x)). mode가 mono이면 계단을 이어 그립니다.
  const GRD = { box: null };
  function drawGrid(g, o) {
    const { x, y, w, h, m, n, f } = o;

    }

        ...base,
        chips: [{ k: '원순열', tex: glue ? `2\\times(n-2)!=2\\times ${fact(n - 2)}=${f}` : `\\dfrac{${n}!}{${n}}=(${n}-1)!=${f}`, color: 'sky', answer: true }],
        status: glue && !adjacent5(s.circ) ? { tone: 'warn', text: 'A와 B가 이웃하지 않는 배열입니다' } : s.fix5 ? { tone: 'ok', text: 'A를 12시에 고정 — 나머지 n−1명을 줄 세운 것과 같습니다' } : near ? { tone: 'ok', text: `${r}칸 돌린 모양 — 처음 배열과 같은 원순열` } : { tone: 'info', text: '정수 칸이 아니면 자리 사이에 걸쳐 있습니다' },
        readouts: [
          { label: '자리 번호가 있을 때 (줄 세우기)', value: `${n}! = ${e.lines}가지`, color: 'ink' },
          { label: '같은 배열로 겹치는 수', value: `${n}가지씩`, color: 'amber', note: '한 칸씩 돌린 n개' },
          { label: glue ? 'A·B 이웃인 원순열 (공식)' : '원순열의 수 (공식)', value: `${f}가지`, color: 'green', note: glue ? `2 × (${n}−2)! = 2 × ${fact(n - 2)}` : `${n}! ÷ ${n} = (${n}−1)!` },
          { label: '그림이 줄 세우기를 묶어 세어 낸 수', value: `${e.classes}가지`, color: 'violet', note: e.classes === f ? '공식 값과 같다' : '공식 값과 다르다!' }
        ]
      };
    },
    vary: var5,
    draw: draw5
  };
  function step5(s, l) {
    const list = classList5(s.n5, s.m5 === 'glue' ? 1 : 0);
    if (!list.length) { s.playing = false; return; }
    s.c5pi = (s.c5pi + 1) % list.length;
    if (s.c5pi === 0) s.c5vis = new Set();
    s.circ = list[s.c5pi].slice();
    s.c5vis.add(s.circ.join(''));
  }

  /* ======================================================================
     실험실 등록
     ====================================================================== */
  const PARAMS = { ...P1, ...P2, ...P3, ...P4, ...P5 };
  const SCENES = [scene1, scene2, scene3, scene4, scene5];
  SCENES.forEach((sc) => {
    const originalView = sc.view;
    sc.view = (s, lab2) => {
      const out = originalView(s, lab2);
      if (lab2.tab === 'explore') {
        out.status = { tone: 'info', ...out.status, text: '탐구 모형 · ' + (out.status?.text || '아래 조작값의 구조를 확인하세요') };
        out.notes = '<b>현재 그림은 아래 조작값의 탐구 모형입니다.</b> 선택 문제의 조건과 단계별 그림은 「문제」·「정리」에서 함께 확인합니다.<br>' + (out.notes || '');
      }
      return out;
    };
  });
  const copy=value=>JSON.parse(JSON.stringify(value));
  const typeOrders={combo:['low','cap','coef','color'],func:['mono','atleast','range','comp'],perm:['ends','adj','via','viaAvoid'],gap:['ppl','ident','seats'],circ:['plain','adj','sep','pick']};
  const textFns=[text1,text2,text3,text4,text5],stepFns=[stepsOf1,steps2,stepsOf3,steps4,steps5];
  const problemDraw=[draw1Problem,draw2Problem,draw3Problem,draw4Problem,draw5Problem],reviewDraw=[draw1Review,draw2Review,draw3Review,draw4Review,draw5Review];
  const banks={};
  SCENES.forEach((sc,index)=>{
    const first=copy(sc.vary.cur()),found={[first.kind]:first},previousRandom=lessonRandom;
    let seed=982451653+index*137,previous=first;
    lessonRandom=()=>((seed=(1664525*seed+1013904223)>>>0)/4294967296);
    try{for(let i=0;i<200&&Object.keys(found).length<typeOrders[sc.id].length;i++){
      previous=sc.vary.lessonSample(previous);if(!found[previous.kind])found[previous.kind]=copy(previous);
    }}finally{lessonRandom=previousRandom;}
    if(typeOrders[sc.id].some(kind=>!found[kind]))throw new Error('Incomplete counting lesson source '+sc.id);
    banks[sc.id]=found;
  });
  const source=window.APL_PC_SOURCE={
    scenes:SCENES,types:id=>typeOrders[id].slice(),packet:(id,kind)=>copy(banks[id][kind||typeOrders[id][0]]),
    question(id,kind){return textFns[SCENES.findIndex(sc=>sc.id===id)](this.packet(id,kind));},
    steps(id,kind){return stepFns[SCENES.findIndex(sc=>sc.id===id)](this.packet(id,kind));},
    math:{fact,C,Pm,Hc,allTuples,formula1,surj,multi},
  };
  const active=s=>!!(s.lessonOn||s.lessonEntry);
  SCENES.forEach((sc,index)=>{
    const native={question:sc.question,steps:sc.steps,view:sc.view,draw:sc.draw,tick:sc.tick};
    sc.question=(s,l)=>active(s)?s.lpcQuestion:typeof native.question==='function'?native.question(s,l):native.question;
    sc.steps=(s,l)=>active(s)?['조건','전략','계산','결론']:native.steps(s,l);
    sc.view=(s,l)=>active(s)?{}:native.view(s,l);
    sc.tick=(s,dt,l)=>active(s)?false:native.tick?.(s,dt,l);
    sc.draw=(b,s,v,l)=>{
      if(!active(s))return native.draw(b,s,v,l);
      const shown={...s,...(s.lessonEntry?s.lpcInitial:{})},I=source.packet(sc.id,shown.lpcKind);
      const step=s.lessonEntry?0:Math.max(0,Math.min(3,s.step||0)),intro=s.lessonEntry?0:shown.lpcIntro||0;
      const text=b._text,handle=b.handle;
      b._text=function(x,y,label,opts,screen){
        const str=String(label??'');
        const result=new RegExp('(?:=\\s*|답\\s*|남은 해\\s*)'+I.ans+'(?![0-9])');
        return text.call(this,x,y,!this._bbox&&!shown.lpcShowAnswer&&result.test(str)?'':label,opts,screen);
      };
      b.handle=()=>{};
      try{paint(b,g=>{if(!b._bbox)g.dy+=(1-intro)*10;(step===0?problemDraw[index]:reviewDraw[index])(g,I,step);});}
      finally{b._text=text;b.handle=handle;}
    };
  });
  const lessonSet=window.APL_PC_LESSONS?window.APL_PC_LESSONS.install(SCENES,source):{};
  APLab.createLab({
    id: 'prob-counting',
    stagedReveal: true,
    title: '경우의 수 실험실',
    courseName: '확률과 통계',
    unit: '경우의 수',
    courseColor: 'var(--m-green)',
    home: '../index.html',
    legacy: 'next/labs/prob-counting.html',
    board: { kind: 'cartesian', focus: { x: [0, 400], y: [0, 400] }, pad: 0.015 },
    params: PARAMS,
    scenes: SCENES,
    lessons:lessonSet
  });
  lab = window.lab;
  lab.board.zoomable = false;
  lab.board.pannable = false;
  lab.board.zoomAt = function () {};
  // 격자(정수해 지도)를 누르면 그 해로 칸막이를 옮깁니다.
  onTap(lab.ui.canvas, (pt) => {
    const s = lab.s;
    if (lab.scene.id === 'combo' && lab.tab === 'explore' && LAT.box && LAT.H) {
      const w = lab.board.toW(pt.x, pt.y), d = { x: w.x, y: LAT.H - w.y }, bx = LAT.box, n = s.nb, k = s.kb;
      let t = null;
      if (bx.kind === 'line') {
        const i = Math.round((d.x - bx.x0) / bx.c);
        if (i >= 0 && i <= n && Math.abs(d.y - bx.y0) < bx.c) t = [i, n - i];
      } else {
        const i = Math.round((d.x - bx.ox) / bx.c), j = Math.round((bx.oy - d.y) / bx.c);
        if (i >= 0 && j >= 0 && i + j <= n && Math.hypot(d.x - (bx.ox + i * bx.c), d.y - (bx.oy - j * bx.c)) < bx.c * 0.62) t = k === 3 ? [i, j, n - i - j] : [i, j, n - i - j, 0];
      }
      if (t) { s.dv = tupleToDv(t); s.playing = false; lab.invalidate(true); }
    }
    if (lab.scene.id === 'perm' && lab.tab === 'explore' && s.smode === 'road' && ROAD.box) {
      const q = ROAD.box, w = lab.board.toW(pt.x, pt.y), d = { x: w.x, y: q.H - w.y };
      let best = null, bd = 1e9;
      for (let i = 0; i <= q.ga; i++) for (let j = 0; j <= q.gb; j++) { const dd = Math.hypot(d.x - (q.ox + i * q.c), d.y - (q.oy - j * q.c)); if (dd < bd) { bd = dd; best = [i, j]; } }
      if (bd < q.r + 9) {
        const [i, j] = best;
        if (!((i === 0 && j === 0) || (i === q.ga && j === q.gb))) { s.via = s.via && s.via.i === i && s.via.j === j ? null : { i, j }; s.rpi = -1; lab.invalidate(true); }
      } else {
        let eb = null, ed = 1e9;
        const segd = (x1, y1, x2, y2) => { const dx = x2 - x1, dy = y2 - y1, t = clamp(((d.x - x1) * dx + (d.y - y1) * dy) / (dx * dx + dy * dy), 0, 1); return Math.hypot(d.x - (x1 + dx * t), d.y - (y1 + dy * t)); };
        for (let i = 0; i <= q.ga; i++) for (let j = 0; j <= q.gb; j++) {
          if (i < q.ga) { const dd = segd(q.ox + i * q.c, q.oy - j * q.c, q.ox + (i + 1) * q.c, q.oy - j * q.c); if (dd < ed) { ed = dd; eb = 'h' + i + ',' + j; } }
          if (j < q.gb) { const dd = segd(q.ox + i * q.c, q.oy - j * q.c, q.ox + i * q.c, q.oy - (j + 1) * q.c); if (dd < ed) { ed = dd; eb = 'v' + i + ',' + j; } }
        }
        if (eb && ed < 12) { s.blk[eb] = !s.blk[eb]; if (!s.blk[eb]) delete s.blk[eb]; s.rpi = -1; lab.invalidate(true); }
      }
    }
    if (lab.scene.id === 'circ' && lab.tab === 'explore' && CIRC.pts.length) {
      const w = lab.board.toW(pt.x, pt.y), d = { x: w.x, y: CIRC.H - w.y };
      let best = null, bd = 1e9;
      CIRC.pts.forEach((q) => { const dd = Math.hypot(d.x - q.x, d.y - q.y); if (dd < bd) { bd = dd; best = q; } });
      if (best && bd < best.pr + 8) {
        if (s.sel5 == null) s.sel5 = best.i;
        else if (s.sel5 === best.i) s.sel5 = null;
        else { const a = s.circ; [a[s.sel5], a[best.i]] = [a[best.i], a[s.sel5]]; s.sel5 = null; s.playing = false; s.c5pi = -1; }
        lab.invalidate(true);
      }
    }
    if (lab.scene.id === 'func' && lab.tab === 'explore' && GRD.box) {
      const w = lab.board.toW(pt.x, pt.y), d = { x: w.x, y: GRD.box.H - w.y }, q = GRD.box;
      const i = Math.floor((d.x - q.ox) / q.c), j = Math.floor((q.oy - d.y) / q.c);
      if (i >= 0 && i < q.m && j >= 0 && j < q.n) { setF(s, i, j); s.playing = false; lab.invalidate(true); }
    }
  });
});
</script>
