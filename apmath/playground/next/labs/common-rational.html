<script>
/* ==========================================================================
   공통수학 · 유리함수 (AP Math Lab 2.0) — 4개 장면
   근거: 고1 학평에는 유리함수가 1문항뿐이라 학교 2학기 기말·중간 기출(공통수학2 함수 단원)을 표본으로 반복 유형을 골랐습니다.
   장면 1 평행이동과 점근선(그래프에서 a+b+c · 모든 사분면) / 2 점대칭·직선대칭과 거리 /
   장면 3 정점을 지나는 직선과 교점 개수 / 4 구간의 최댓값·최솟값과 격자점
   문제는 원문을 복제하지 않고 숫자·상황을 바꾼 변형이며, 「새 문제」로 정답이 깔끔한 변형만 돌려 가며 만납니다.
   ========================================================================== */
window.addEventListener('DOMContentLoaded', function () {
  const tex = APLab.tex;
  const clamp = APLab.clamp;

  /* ---------- 공통 도우미 ---------- */
  const rint = (n) => Math.floor(Math.random() * n);
  const pickOf = (arr, prev) => { if (arr.length < 2) return arr[0]; let x; do { x = arr[rint(arr.length)]; } while (x === prev); return x; };
  const mn = (n) => String(Math.round(n * 100) / 100).replace('-', '−'); // 화면용 숫자(음수는 − 기호)
  const fraction = (n, d) => { const gcd = (a, b) => b ? gcd(b, a % b) : a; const g = gcd(Math.abs(n), Math.abs(d)); n /= g; d /= g; if (d < 0) { n = -n; d = -d; } return d === 1 ? String(n) : `${n < 0 ? '-' : ''}\\dfrac{${Math.abs(n)}}{${d}}`; };
  const lin = (a, b, v = 'x') => { // ax+b 를 TeX 로
    let s = '';
    if (a !== 0) s += a === 1 ? v : a === -1 ? '-' + v : a + v;
    if (b !== 0) s += s ? (b > 0 ? '+' + b : '-' + (-b)) : String(b);
    return s || '0';
  };
  const addT = (n) => (n > 0 ? '+' + n : n < 0 ? '-' + (-n) : ''); // 뒤에 붙는 상수항
  const sqrtSimp = (n) => { let o = 1, i = n; for (let f = 2; f * f <= i; f++) while (i % (f * f) === 0) { i /= f * f; o *= f; } return [o, i]; };
  const rootTeX = (n) => { const [o, i] = sqrtSimp(n); return i === 1 ? String(o) : (o === 1 ? '' : o) + `\\sqrt{${i}}`; };
  // y = k/(x-p) + q 의 TeX (좌변 y= 포함)
  const ratTeX = (k, p, q) => `y=${k < 0 ? '-' : ''}\\dfrac{${Math.abs(k)}}{${lin(1, -p)}}${addT(q)}`;
  // y = (ax+b)/(x+c)
  const fracTeX = (a, b, c) => `y=\\dfrac{${lin(a, b)}}{${lin(1, c)}}`;
  const ratY = (k, p, q) => (x) => k / (x - p) + q;
  function drawRat(b, k, p, q, o = {}) {
    const f = ratY(k, p, q);
    if (Math.abs(k) < 1e-9) { b.hline(q, o); b.point([p, q], { hollow: true, color: o.color || 'ink', r: 4.5 }); return; }
    b.plot(f, { ...o, to: p - 1e-3 });
    b.plot(f, { ...o, from: p + 1e-3 });
  }
  function quadrants(k, p, q) { // 곡선이 지나는 사분면
    if (k === 0) return q > 0 ? [1, 2] : q < 0 ? [3, 4] : [];
    // x=0, 분모의 영점, 분자의 영점 사이에서는 x와 y의 부호가 일정합니다.
    // 간격이 아무리 좁아도 각 열린 구간을 하나씩 판정합니다.
    const zero = q === 0 ? null : p - k / q;
    const cuts = [...new Set([0, p, ...(zero === null ? [] : [zero])])].sort((a, b) => a - b);
    const bounds = [-Infinity, ...cuts, Infinity], seen = new Set();
    for (let i = 0; i < bounds.length - 1; i++) {
      const a = bounds[i], b = bounds[i + 1];
      const x = !Number.isFinite(a) ? b - 1 : !Number.isFinite(b) ? a + 1 : (a + b) / 2;
      const sy = q === 0 ? Math.sign(k) * Math.sign(x - p) : Math.sign(q) * Math.sign(x - zero) * Math.sign(x - p);
      seen.add(x > 0 ? (sy > 0 ? 1 : 4) : (sy > 0 ? 2 : 3));
    }
    return [1, 2, 3, 4].filter((i) => seen.has(i));
  }
  const axesOf = (b) => { b.grid({ step: 1 }); b.axes({ tickStep: b.k < 32 ? 2 : 1 }); };
  // 변형 생성기: gen(이전 변형|null) → 새 변형. 처음에는 기출 유형 그대로(gen(null)).
  const lrActive = (s) => !!(s && (s.lessonOn || s.lessonEntry));
  function varier(gen) {
    let cur = gen(null); const first = cur;
    return { cur: () => lrActive(window.lab && window.lab.s) ? first : cur, first: () => first, next: () => (cur = gen(cur)) };
  }
  const probHTML = (body) => `${body}<div style="margin-top:10px"><button type="button" class="apl-btn sm" data-new-prob>새 문제</button></div>`;
  document.addEventListener('click', (ev) => {
    const hit = ev.target && ev.target.closest && ev.target.closest('[data-new-prob]');
    if (!hit) return;
    const lab = window.lab, sc = lab && lab.scene;
    if (!sc || !sc.vary) return;
    sc.vary.next();
    lab.s.revealed = false;
    lab.setStep(0);
    try { lab._buildReview(); } catch (e) { /* 키트가 바뀌어도 그림은 그대로 */ }
    lab.invalidate(true);
  });
  const stepOf = (lab, s) => (lab.tab === 'problem' ? 0 : lab.tab === 'review' ? s.step : 99); // 탐구는 99(모두), 문제 탭은 풀이 전
  const probBox = (v) => `<div class="apl-rich" style="font-size:var(--fs-sm);line-height:1.75"><small style="color:var(--text-3);font-weight:800">문제</small><br>${v}</div>`;
  // $...$ 안의 < > 는 HTML 로 오해되므로 \lt \gt 로 바꿉니다(셸이 글을 이스케이프·분해하기 때문)
  const fixLT = (t) => (typeof t === 'string' ? t.replace(/\$[^$]*\$/g, (m) => m.replace(/</g, '\\lt ').replace(/>/g, '\\gt ')) : t);
  const fixObj = (o) => (o ? { ...o, steps: fixLT(o.steps), warning: fixLT(o.warning), highlight: fixLT(o.highlight) } : o);
  const baseScene = (o) => ({
    tabs: { compact: true }, ...o,
    steps: o.steps && (() => o.steps().map(fixLT)),
    view: (s, lab) => {
      const v = o.view(s, lab);
      if (lab.tab !== 'explore' && !lab._answerOpen()) {
        if (v.chips) v.chips = v.chips.filter((c) => !c.answer);
        if (v.tape && v.tape.answer) delete v.tape;
      }
      return v;
    },
    solution: o.solution && { ...o.solution, standard: () => fixObj(o.solution.standard()), quick: () => fixObj(o.solution.quick()) }
  });
  // 1:1 무대 안에서 점 라벨 위치를 정하기 위한 짧은 도우미
  const P = (b, id, pt, label, color, dx, dy, extra = {}) => b.point(pt, { r: 5, color, label, dx, dy, size: 13, ...extra });

  /* ======================== 장면 1 · 평행이동과 점근선 ======================== */
  const geo1 = (s) => (s.m1 === 1 ? { q: s.fa, p: -s.fc, k: s.fb - s.fa * s.fc } : { k: s.rk, p: s.rp, q: s.rq });
  // 식의 모양을 바꿀 때 같은 그래프를 유지합니다. 변환된 계수를 조절 범위에서 잘라내지 않습니다.
  const shapeValue = (s, lab, key, value) => {
    s[key] = value;
    const p = lab && lab.params[key];
    if (p && (value < p.min || value > p.max)) {
      const bound = Math.max(Math.abs(p.min), Math.abs(p.max), Math.abs(value));
      p.min = -bound; p.max = bound;
      if (lab.refs && lab.refs.controls) delete lab.refs.controls.__ctlKey;
    }
  };
  // 문제 변형: T = 그래프에서 a+b+c, Q = 모든 사분면
  const T1 = [{ type: 'T', p: 2, q: -2, k: -4, pt: [0, 0] }]; // 처음 문제 = 기출 유형 그대로 (점근선 x=2, y=-2, 원점을 지남)
  for (const p of [-3, -2, -1, 1, 2, 3]) for (const q of [-3, -2, -1, 1, 2, 3]) for (const k of [-6, -4, -3, -2, 2, 3, 4, 6]) {
    for (const d of [-6, -4, -3, -2, -1, 1, 2, 3, 4, 6]) {
      if (k % d !== 0) continue;
      const x0 = p + d, y0 = q + k / d;
      if (Math.abs(x0) > 6 || Math.abs(y0) > 6 || (x0 === 0 && y0 === 0) || (x0 === p && y0 === q)) continue;
      if (Math.abs(d) < 1 || Math.abs(k / d) < 1) continue;
      T1.push({ type: 'T', p, q, k, pt: [x0, y0] });
    }
  }
  const Q1 = [];
  for (const p of [1, 2, 3, 4]) for (const q of [1, 2, 3]) Q1.push({ type: 'Q', p, q });
  const var1 = varier((prev) => {
    const item = !prev ? T1[0] : (rint(3) === 0 ? pickOf(Q1, prev.src) : pickOf(T1.slice(1), prev.src));
    if (item.type === 'Q') {
      const { p, q } = item, ans = p * q + 1;
      return { src: item, type: 'Q', p, q, ans: { tex: String(ans), val: ans } };
    }
    const { p, q, k, pt } = item, a = q, c = -p, bb = k - p * q, ans = a + bb + c;
    return { src: item, type: 'T', p, q, k, pt, a, b: bb, c, ans: { tex: String(ans), val: ans } };
  });
  const text1 = (v) => (v.type === 'T'
    ? `함수 ${tex('y=\\dfrac{ax+b}{x+c}')}의 그래프가 그림과 같이 두 직선 ${tex(`x=${v.p}`)}, ${tex(`y=${v.q}`)}를 점근선으로 하고 점 ${tex(`P(${v.pt[0]},\\,${v.pt[1]})`)}을 지난다. 상수 ${tex('a,\\,b,\\,c')}에 대하여 ${tex('a+b+c')}의 값을 구하시오.`
    : `함수 ${tex(`y=\\dfrac{k}{x${addT(-v.p)}}${addT(v.q)}`)}의 그래프가 모든 사분면을 지나도록 하는 정수 ${tex('k')}의 최솟값을 구하시오.`);
  const steps1 = () => {
    const v = var1.cur();
    if (v.type === 'T') {
      const [x0, y0] = v.pt, u = x0 - v.p, w = y0 - v.q;
      return [
        `점근선이 $x=${v.p}$, $y=${v.q}$이므로 두 점근선의 교점은 $C(${v.p},\\,${v.q})$입니다. $y=\\dfrac{ax+b}{x+c}$의 점근선은 $x=-c$, $y=a$이므로 $c=${-v.p}$, $a=${v.q}$입니다.`,
        `점근선의 교점을 새 원점으로 보면 $y=\\dfrac{k}{x}$를 $x$축으로 $${v.p}$, $y$축으로 $${v.q}$만큼 옮긴 꼴이므로 $y=\\dfrac{k}{x${addT(-v.p)}}${addT(v.q)}$, 곧 $(x${addT(-v.p)})(y${addT(-v.q)})=k$입니다.`,
        `점 $P(${x0},\\,${y0})$를 지나므로 $k=(${x0}${addT(-v.p)})(${y0}${addT(-v.q)})=(${u})(${w})=${u * w}$입니다. 두 인수는 부호가 있는 좌표 차이며, 직사각형의 실제 넓이는 $|k|=${Math.abs(v.k)}$입니다.`,
        `$y=\\dfrac{${v.k}}{x${addT(-v.p)}}${addT(v.q)}=\\dfrac{${lin(v.a, v.b)}}{${lin(1, v.c)}}$이므로 $a=${v.a},\\ b=${v.b},\\ c=${v.c}$ ⇒ $a+b+c=${v.ans.tex}$`
      ];
    }
    const pq = v.p * v.q;
    return [
      `점근선은 $x=${v.p}$, $y=${v.q}$이고 교점은 $C(${v.p},\\,${v.q})$입니다. $k>0$이면 곡선은 $C$의 오른쪽 위와 왼쪽 아래에 놓이므로 제1·2·4사분면은 지납니다.`,
      `제3사분면에 들어가려면 $y$절편 $f(0)=${v.q}-\\dfrac{k}{${v.p}}$가 음수여야 합니다. 경계는 원점을 지날 때, 곧 $${v.q}-\\dfrac{k}{${v.p}}=0$에서 $k=${pq}$입니다.`,
      `$${v.q}-\\dfrac{k}{${v.p}}<0$ 이면 $k>${pq}$입니다. ($k\\le 0$이면 곡선이 $C$의 오른쪽 아래·왼쪽 위에 놓여 제3사분면을 지나지 못합니다.)`,
      `$k>${pq}$인 정수 중 가장 작은 값은 $k=${v.ans.tex}$`
    ];
  };

  function asymLabels(b, p, q) { // 점근선 이름표는 화면 가장자리에 둡니다(눈금 숫자와 겹치지 않게)
    const vb = b.viewBox();
    b.text([p, vb.y1], `x=${mn(p)}`, { color: 'amber', size: 12, align: 'left', dx: 6, dy: 62 });
    b.text([vb.x1, q], `y=${mn(q)}`, { color: 'rose', size: 12, align: 'right', dx: -8, dy: -11 });
  }
  function drawR1(b, s, lab) {
    const tab = lab.tab;
    axesOf(b);
    if (tab === 'explore') {
      const { k, p, q } = geo1(s), shift = p !== 0 || q !== 0;
      if (shift) drawRat(b, k, 0, 0, { color: 'muted', dash: [5, 5], width: 2, alpha: 0.85, ref: 'shift' });
      if (shift) {
        b.seg([0, 0], [p, 0], { color: 'amber', dash: [3, 4], width: 2, ref: 'shift' });
        b.seg([p, 0], [p, q], { color: 'rose', dash: [3, 4], width: 2, ref: 'shift' });
        if (Math.abs(p) >= 2) b.text([p / 2, 0], `x방향 ${mn(p)}`, { color: 'amber', size: 12, dy: q >= 0 ? 15 : -11 });
        if (Math.abs(q) >= 2) b.text([p, q / 2], `y방향 ${mn(q)}`, { color: 'rose', size: 12, align: p >= 0 ? 'left' : 'right', dx: p >= 0 ? 8 : -8 });
      }
      if (k !== 0) {
        b.vline(p, { color: 'amber', dash: [6, 5], width: 1.8, alpha: 0.9, ref: 'asym' });
        b.hline(q, { color: 'rose', dash: [6, 5], width: 1.8, alpha: 0.9, ref: 'asym' });
      }
      drawRat(b, k, p, q, { color: 'sky', width: 3.4, glow: true, ref: 'curve' });
      if (shift && Math.abs(k) >= 0.5 && Math.abs(k) <= 7 && Math.abs(1 + p) < 8 && Math.abs(k + q) < 8) {
        b.seg([1, k], [1 + p, k + q], { color: 'violet', dash: [2, 4], width: 1.6, ref: 'shift' });
        b.point([1, k], { r: 4, color: 'muted', label: 'A', dx: -9, dy: -9, align: 'right', size: 12 });
        b.point([1 + p, k + q], { r: 4.5, color: 'violet', label: 'A′', dx: 9, dy: -9, size: 12 });
      }
      const cl = `C(${mn(p)}, ${mn(q)})`;
      if (k === 0) b.point([p, q], { r: 6, hollow: true, color: 'violet', label: `제외된 점 (${mn(p)}, ${mn(q)})`, dx: 10, dy: 18, size: 13 });
      else if (s.m1 === 1) b.point([p, q], { r: 6, color: 'violet', label: cl, dx: 10, dy: 16, size: 13, ref: 'asym' });
      else b.handle('C', [p, q], { color: 'violet', r: 7, label: cl, dx: 10, dy: 18, size: 13, ariaLabel: '점근선의 교점 C (끌어서 평행이동)', drag: (w) => { s.rp = clamp(Math.round(w.x), -6, 6); s.rq = clamp(Math.round(w.y), -6, 6); } });
      return;
    }
    const v = var1.cur(), st = stepOf(lab, s);
    if (v.type === 'T') {
      const [x0, y0] = v.pt;
      b.vline(v.p, { color: 'amber', dash: [6, 5], width: 1.8, alpha: 0.9 });
      b.hline(v.q, { color: 'rose', dash: [6, 5], width: 1.8, alpha: 0.9 });
      asymLabels(b, v.p, v.q);
      if (st >= 3) {
        drawRat(b, v.k, 0, 0, { color: 'muted', dash: [5, 5], width: 2, alpha: 0.8 });
        b.poly([[v.p, v.q], [x0, v.q], [x0, y0], [v.p, y0]], { color: 'green', dash: [5, 4], width: 2, fill: 'green', fillAlpha: 0.1 });
        b.text([(v.p + x0) / 2, v.q], `Δx=${mn(x0 - v.p)}`, { color: 'green', size: 13, dy: y0 > v.q ? 16 : -12 });
        b.text([x0, (v.q + y0) / 2], `Δy=${mn(y0 - v.q)}`, { color: 'green', size: 13, align: x0 > v.p ? 'left' : 'right', dx: x0 > v.p ? 8 : -8 });
      }
      drawRat(b, v.k, v.p, v.q, { color: 'sky', width: 3.4, glow: true });
      if (st >= 2) {
        b.seg([0, 0], [v.p, 0], { color: 'amber', dash: [3, 4], width: 2 });
        b.seg([v.p, 0], [v.p, v.q], { color: 'rose', dash: [3, 4], width: 2 });
      }
      b.point([x0, y0], { r: 5.5, color: 'amber', label: `P(${mn(x0)}, ${mn(y0)})`, dx: x0 >= v.p ? 10 : -10, dy: y0 >= v.q ? -12 : 14, align: x0 >= v.p ? 'left' : 'right', size: 13 });
      if (st >= 1) b.point([v.p, v.q], { r: 6, color: 'violet', label: `C(${mn(v.p)}, ${mn(v.q)})`, dx: v.pt[0] > v.p ? -10 : 10, dy: v.pt[1] > v.q ? 18 : -14, align: v.pt[0] > v.p ? 'right' : 'left', size: 13 });
    } else {
      const pq = v.p * v.q;
      b.vline(v.p, { color: 'amber', dash: [6, 5], width: 1.8, alpha: 0.9 });
      b.hline(v.q, { color: 'rose', dash: [6, 5], width: 1.8, alpha: 0.9 });
      asymLabels(b, v.p, v.q);
      drawRat(b, 1, v.p, v.q, { color: 'muted', dash: [5, 5], width: 2.2, alpha: 0.9 });
      b.text([v.p + 3.4, v.q + 1 / 3.4], 'k=1일 때', { color: 'muted', size: 12, dy: -12 });
      if (st >= 2) {
        drawRat(b, pq, v.p, v.q, { color: 'rose', width: 3 });
        b.point([0, 0], { r: 5.5, color: 'rose', label: `k=${pq}이면 원점`, dx: -10, dy: 18, align: 'right', size: 12 });
      }
      if (st >= 3) {
        drawRat(b, pq + 1, v.p, v.q, { color: 'green', width: 3.4, glow: true });
        const yy = v.q - (pq + 1) / v.p;

  const geo2 = (s) => { const k = s.s2sg * s.s2k, p = s.s2p, q = s.s2q; let u = s.s2u; if (Math.abs(u) < 0.3) u = u < 0 ? -0.3 : 0.3; return { k, p, q, u, v: k / u }; };
  const T2 = [{ type: 'A', p: 1, q: 3, k: 8 }];
  for (const p of [-2, -1, 1, 2, 3]) for (const q of [-3, -2, -1, 1, 2, 3]) for (const k of [1, 2, 3, 4, 6, 8, 9]) T2.push({ type: rint(2) ? 'A' : 'B', p, q, k });
  const var2 = varier((prev) => {
    const it = !prev ? T2[0] : pickOf(T2.slice(1), prev.src);

  });
  const text2 = (v) => (v.type === 'A'
    ? `함수 ${tex(`f(x)=\\dfrac{${v.num}}{${v.den}}`)}의 그래프가 직선 ${tex('y=mx+n')} ${tex('(m>0)')}에 대하여 대칭이다. 이 그래프와 직선의 교점을 ${tex('A')}, ${tex('B')}라 할 때, 선분 ${tex('AB')}의 길이를 구하시오.`
    : `유리함수 ${tex(`y=\\dfrac{${v.num}}{${v.den}}`)}의 그래프와 직선 ${tex('y=x+t')}가 서로 다른 두 점에서 만날 때, 두 교점 사이의 거리의 최솟값을 구하시오. (단, ${tex('t')}는 실수)`);
  const steps2 = () => {
    const v = var2.cur(), r = rootTeX(v.k), L1 = `y=${lin(1, v.q - v.p, 'x')}`;
    const s0 = v.t0;
    return v.type === 'A' ? [
      `분자를 나누면 $f(x)=\\dfrac{${v.k}}{${v.den}}${addT(v.q)}$이므로 점근선은 $x=${v.p}$, $y=${v.q}$, 교점은 $C(${v.p},\\,${v.q})$입니다. 대칭 중심은 $C$입니다.`,
      `$(x${addT(-v.p)})(y${addT(-v.q)})=${v.k}$ 에서 $x-p$와 $y-q$를 서로 바꾸어도 식이 같으므로 곡선은 $C$를 지나는 기울기 $\\pm1$인 두 직선에 대하여 대칭입니다. 기울기가 양수인 쪽은 $${L1}$입니다.`,
      `$${L1}$ 위에서는 $x-p=y-q$ 이므로 $(x${addT(-v.p)})^2=${v.k}$, $x-p=\\pm${r}$. 따라서 $A(${v.p}-${r},\\,${v.q}-${r})$, $B(${v.p}+${r},\\,${v.q}+${r})$입니다.`,
      `$AB=\\sqrt{2}\\cdot 2\\sqrt{${v.k}}=${v.ans.tex}$`
    ] : [
      `$y=\\dfrac{${v.k}}{${v.den}}${addT(v.q)}$ 이므로 점근선은 $x=${v.p}$, $y=${v.q}$, 교점은 $C(${v.p},\\,${v.q})$입니다.`,
      `점근선의 교점 기준 좌표 $u=x${addT(-v.p)}$, $w=y${addT(-v.q)}$로 보면 곡선은 $uw=${v.k}$, 직선은 $w=u+s$ 꼴($s=t${addT(v.p - v.q)}$)입니다. $u(u+s)=${v.k}$ ⇒ $u^2+su-${v.k}=0$, 두 근의 차는 $\\sqrt{s^2+${4 * v.k}}$이므로 $AB=\\sqrt2\\sqrt{s^2+${4 * v.k}}$입니다.`,

  /* ======================== 장면 3 · 직선과 교점의 개수 ======================== */
  const CUR3 = { k: 4, p: 1, q: 1 }; // 탐구 곡선: y = 4/(x-1) + 1
  const CNT_COL = ['rose', 'amber', 'green'];
  // 점 pt 를 지나는 기울기 m(무한대 = 수직선)의 직선과 y=k/(x-p)+q 의 교점 개수와 교점들
  function inter3(k, p, q, pt, m) {
    const al = pt[0] - p, be = pt[1] - q;
    if (!isFinite(m)) return { n: Math.abs(al) < 1e-9 ? 0 : 1, pts: Math.abs(al) < 1e-9 ? [] : [[pt[0], q + k / al]], D: NaN };
    const t = be - m * al;
    if (Math.abs(m) < 1e-9) return Math.abs(t) < 1e-9 ? { n: 0, pts: [], D: t * t } : { n: 1, pts: [[p + k / t, q + t]], D: t * t };

  function tanSlopes(k, al, be) {

      `직선 $y=${lin(m, 0)}+K$는 $w=${lin(m, 0, 'u')}+t$ ($t=K${addT(m * p - q)}$)입니다. $u\\cdot(${lin(m, 0, 'u')}+t)=${k}$ ⇒ $${lin(m, 0, 'u^2').replace('u^2', 'u^2')}+tu-${k}=0$, 판별식 $D=t^2${addT(4 * m * k)}$입니다.`,

  const CUR4 = { p: 1, q: 1 }; // 탐구 곡선: y = k/(x-1) + 1
  function intervalStats(k, p, q, a, b) {
    if (k === 0) return { kind: 'constant', min: q, max: q };
    const f = ratY(k, p, q);
    if (a < p && p < b) return { kind: 'split', min: null, max: null };
    if (a === p) return k > 0 ? { kind: 'right', min: f(b), minAt: b, max: null } : { kind: 'right', min: null, max: f(b), maxAt: b };
    if (b === p) return k > 0 ? { kind: 'left', min: null, max: f(a), maxAt: a } : { kind: 'left', min: f(a), minAt: a, max: null };

  const floorDiv = (n, d) => Math.floor(n / d); // 정수끼리 (d>0)

  const A4 = [{ type: 'A', p: -1, q: 3, s: 0, t: 3, e: 1, ask: 'min' }];
  for (const p of [-2, -1, 0, 1, 2]) for (const q of [-2, -1, 1, 2, 3]) for (const d1 of [1, 2]) for (const d2 of [3, 4, 5]) for (const e of [-3, -2, -1, 1, 2, 3]) for (const ask of ['min', 'max']) {

  const numK = (q) => (q === 0 ? 'k' : (q === 1 ? 'x' : q === -1 ? '-x' : `${q}x`) + '+k');
  const text4 = (v) => (v.type === 'A'
    ? `정의역이 ${tex(`\\{x\\mid ${v.s}\\le x\\le ${v.t}\\}`)}인 유리함수 ${tex(`y=\\dfrac{${numK(v.q)}}{${lin(1, -v.p)}}`)}의 ${v.ask === 'min' ? '최솟값' : '최댓값'}이 ${tex(String(v.m))}일 때, 상수 ${tex('k')}의 값을 구하시오.`
    : `곡선 ${tex(ratTeX(v.k, v.p, v.q))}와 ${tex('x')}축, 두 직선 ${tex(`x=${v.a}`)}, ${tex(`x=${v.b}`)}로 둘러싸인 영역(경계 포함)에 속하는 점 중 ${tex('x')}좌표와 ${tex('y')}좌표가 모두 정수인 점의 개수를 구하시오.`);
  const steps4 = () => {
    const v = var4.cur();

      const dec = v.e > 0, role = v.ask === 'min' ? '최솟값' : '최댓값';

          { group: 'k의 부호', label: 'k = 0 (상수)', apply: (st) => { st.s4k = 0; }, on: (st) => st.s4k === 0 }
        ])
      ],
      steps: steps4,
      reviewTop: () => probBox(text4(var4.cur())),
      problem: { tag: '22 제일고 · 25 팔마고 · 23 매산여고 기출 유형', time: '목표 시간: 20초', text: () => probHTML(text4(var4.cur())), answer: () => tex(var4.cur().ans.tex) },
      solution: {
        standardTitle: '단조성과 대입', standardTag: '기본 풀이', quickTitle: '그래프를 그려 끝점 보기', quickTag: '그림으로',
        standard: () => { const v = var4.cur(); return v.type === 'A' ? { steps: `$y=${v.q}+\\dfrac{K}{x${addT(-v.p)}}$ (K=k${addT(v.p * v.q)}). $x=${v.xe}$에서 값 ${v.m} ⇒ $K=${v.K}$ ⇒ $k=${v.ans.tex}$`, warning: '분자의 상수는 k가 아니라 K=k+pq 입니다(통분 전후의 k를 혼동하지 마세요).' } : { steps: `줄별 개수 $\\lfloor f(x)\\rfloor+1$을 더하면 ${v.cs.map((c) => c.n).join(' + ')} = ${v.ans.tex}`, warning: 'y=0인 점(x축 위)도 경계에 포함되므로 +1을 빠뜨리지 마세요.' }; },
        quick: () => { const v = var4.cur(); return { steps: v.type === 'A' ? '점근선을 건너지 않으면 함수는 증가 또는 감소 하나뿐이라, 최댓값·최솟값은 <b>구간의 양 끝</b> 값입니다. 끝 한 곳만 대입하면 됩니다.' : '그림에서 각 줄(열)의 정수 점을 직접 세고, 곡선이 x축에서 멀어질수록 줄이 길어지는 것을 확인합니다.', highlight: v.type === 'A' ? '분자 상수 K≠0이고 점근선이 구간 내부에 있으면 최대·최소가 모두 없습니다. 끝점에만 있으면 한쪽 극값은 존재할 수 있습니다.' : '곡선 위 점이 정수이면 그 점까지 포함해 센다는 점만 주의하세요.' }; }
      },
      view: (s, lab) => {
        if (lab.tab !== 'explore') { const v = var4.cur(); return { chips: [{ html: v.type === 'A' ? `<b>k=${v.ans.tex}</b>` : `총 <b>${v.ans.tex}개</b>`, color: 'amber', answer: true }] }; }
        const { p, q } = CUR4;
        if (s.s4mode === 1) {
          const cs = cols4(s.s4kl, p, q, s.s4a, s.s4b), tot = cs.reduce((z, c) => z + c.n, 0);
          return {
            chips: [{ tex: ratTeX(s.s4kl, p, q), color: 'sky' }],
            status: { tone: 'info', text: `영역 안의 격자점 ${tot}개` },
            readouts: [
              { label: '줄(x)별 정수 점의 수', value: cs.map((c) => c.n).join(' + '), color: 'green', wide: true, note: '각 줄은 ⌊f(x)⌋ + 1개' },
              { label: '모두 합하면', value: `${tot}개`, color: 'amber' },
              { label: '경계 x = a, b', value: `${s.s4a}, ${s.s4b}`, color: 'rose' }
            ]
          };
        }
        const k = s.s4k, a = s.s4a0, bb = s.s4b0, stats = intervalStats(k, p, q, a, bb);
        const at = (x) => fraction(2 * (q * (x - p) + k), 2 * (x - p));
        const value = (key) => stats[key] == null ? '없음' : `$${k === 0 ? q : at(stats[key + 'At'])}$`;
        let range;
        if (stats.kind === 'constant') range = `y=${q}`;
        else if (stats.kind === 'split') range = `y\\le ${at(k > 0 ? a : bb)}\\quad\\text{또는}\\quad y\\ge ${at(k > 0 ? bb : a)}`;
        else if (stats.min == null) range = `y\\le ${at(stats.maxAt)}`;
        else if (stats.max == null) range = `y\\ge ${at(stats.minAt)}`;
        else range = `${at(stats.minAt)}\\le y\\le ${at(stats.maxAt)}`;
        const text = stats.kind === 'constant' ? `k=0 — 최댓값과 최솟값이 모두 ${q}` : stats.kind === 'split' ? '점근선이 구간 내부 — 위아래로 끝없이 뻗어 최대·최소 없음' : stats.kind === 'closed' ? `${k > 0 ? '감소' : '증가'}함수 — 양 끝에서 최대·최소` : `점근선이 구간 끝점 — ${stats.min == null ? '최댓값만' : '최솟값만'} 존재`;
        return {
          chips: [{ tex: ratTeX(k, p, q), color: 'sky' }],
          status: { tone: stats.kind === 'split' ? 'warn' : 'key', text },
          alert: a <= p && p <= bb ? { tone: 'info', text: `<b>x=${p}</b>은 분모가 0이므로 구간에서 제외합니다. ${k === 0 ? '이 한 점을 빼도 나머지 모든 점의 함숫값은 같아 최대·최소가 모두 존재합니다.' : stats.kind === 'split' ? '양쪽 가지가 모두 포함되어 위아래로 한없이 뻗습니다.' : '한쪽 가지만 포함되어 한 방향으로만 한없이 뻗습니다.'}` } : undefined,
          readouts: [
            { label: '최댓값', value: value('max'), color: 'rose' },
            { label: '최솟값', value: value('min'), color: 'green' },
            { label: '치역', value: `$${range}$`, color: 'violet', ref: 'range', wide: true, note: k === 0 ? '상수함수의 치역은 하나의 값입니다' : '유한한 경계값은 포함하고 y=1은 포함하지 않습니다' }
          ]
        };
      },
      vary: var4,
      draw: (b, s, v, lab) => drawR4(b, s, lab)
    });
  }

  /* ======================== 실험실 ======================== */
  const fm = (v) => mn(v);
  const scenes = [sceneR1(), sceneR2(), sceneR3(), sceneR4()];
  const texts = { r1: text1, r2: text2, r3: text3, r4: text4 };
  const sourceInfo = Object.fromEntries(scenes.map((sc) => {
    const initial = {}; sc.enter(initial);
    return [sc.id, { first: sc.vary.first(), initial, question: texts[sc.id](sc.vary.first()), inquiry: sc.question, steps: sc.steps() }];
  }));
  const source = window.APL_RAT_SOURCE = {
    scenes,
    first: id => sourceInfo[id].first,
    initial: id => ({ ...sourceInfo[id].initial }),
    question: id => sourceInfo[id].question,
    inquiry: id => sourceInfo[id].inquiry,
    steps: id => sourceInfo[id].steps.slice()
  };
  const latticeFocus = { x: [-1, 9], y: [-2, 15] };
  function lessonFocus(b, s) {
    if (lrActive(s) && s.lrLattice) {
      if (b.focus !== latticeFocus) b._ratLessonView = { focus: b.focus, zoom: b.zoom, panX: b.panX, panY: b.panY };
      b.setFocus(latticeFocus, false);
      b.zoom = 1; b.panX = 0; b.panY = 0;
    } else if (b._ratLessonView) {
      // A scene change may already have installed its own focus; preserve it.
      if (b.focus === latticeFocus) Object.assign(b, b._ratLessonView);
      delete b._ratLessonView;
    }
  }
  function curveTrace(b, s, id) {
    const progress = clamp(Number(s.lrTrace) || 0, 0, 1);
    if (s.lessonEntry || !progress) return;
    let g, from, to;
    if (s.lrExplore) {
      g = id === 'r1' ? geo1(s) : id === 'r2' ? geo2(s) : id === 'r3' ? CUR3 : { ...CUR4, k: s.s4mode === 1 ? s.s4kl : s.s4k };
      from = g.p + 1.25; to = g.p + 3;
      if (id === 'r4') {
        const a = s.s4mode === 1 ? s.s4a : s.s4a0, z = s.s4mode === 1 ? s.s4b : s.s4b0;
        if (z < g.p) { from = a; to = z; }
        else { from = Math.max(a, g.p + 0.8); to = Math.max(from, z); }
      }
    } else {
      const v = source.first(id);
      g = { k: id === 'r4' ? v.K : v.k, p: v.p, q: v.q };
      from = g.p - 3; to = g.p - 1.2;
      if (id === 'r4') { from = v.s; to = v.t; }
    }
    const f = ratY(g.k, g.p, g.q), x = from + (to - from) * progress, y = f(x);
    if (!Number.isFinite(x) || !Number.isFinite(y)) return;
    b.plot(f, { from, to: x, color: 'violet', width: 4.2, alpha: 0.85 });
    b.point([x, y], { r: 4.5, color: 'violet', glow: false });
  }
  for (const sc of scenes) {
    const original = { question: sc.question, reviewTop: sc.reviewTop, steps: sc.steps, view: sc.view, draw: sc.draw };
    sc.question = (s, lab) => lrActive(s) ? s.lrQuestion || source.question(sc.id) : typeof original.question === 'function' ? original.question(s, lab) : original.question;
    sc.reviewTop = (s, lab) => lrActive(s) ? '' : original.reviewTop(s, lab);
    sc.steps = (s, lab) => lrActive(s) ? ['조건을 확인해요.', '풀이에 필요한 관계를 찾아요.', '식을 세워 계산해요.', '구하는 값을 확인해요.'] : original.steps(s, lab);
    sc.view = (s, lab) => lrActive(s) ? {} : original.view(s, lab);
    sc.draw = (b, s, v, lab) => {
      lessonFocus(b, s);
      if (!lrActive(s)) return original.draw(b, s, v, lab);
      const state = { ...s, playing: false, lrShowAnswer: !s.lessonEntry && !!s.lrShowAnswer, lrCols: s.lessonEntry ? 0 : s.lrCols, step: s.lessonEntry ? 0 : Math.min(s.step || 0, s.lrShowAnswer ? 4 : 3) };
      const shownLab = Object.create(lab); shownLab.tab = s.lrExplore ? 'explore' : 'review';
      original.draw(b, state, {}, shownLab);
      curveTrace(b, state, sc.id);
    };
  }
  const lessons = window.APL_RAT_LESSONS.install(scenes, source);
  APLab.createLab({
    id: 'common-rational',
    stagedReveal: true,
    title: '유리함수',
    courseName: '공통수학',
    unit: '함수와 그래프',
    courseColor: 'var(--m-green)',
    home: '../index.html#common',
    legacy: '../labs/common-rational.html',
    board: { kind: 'cartesian', focus: { x: [-8, 8], y: [-6.5, 7.5] }, minZoom: 0.5, maxZoom: 6 },
    state: { m1: 0 },
    params: {
      rk: { value: 4, min: -8, max: 8, step: 0.5, color: 'sky', label: 'k (곡선의 크기·방향)', hint: '양수이면 오른쪽 위·왼쪽 아래, 음수이면 반대', format: fm },
      rp: { value: 2, min: -6, max: 6, step: 1, color: 'amber', label: 'p (x방향 이동)', hint: '점근선 x = p', format: fm },
      rq: { value: 1, min: -6, max: 6, step: 1, color: 'rose', label: 'q (y방향 이동)', hint: '점근선 y = q', format: fm },
      fa: { value: 1, min: -6, max: 6, step: 1, color: 'rose', label: 'a (분자의 x 계수)', hint: '수평 점근선 y = a', format: fm },
      fb: { value: 2, min: -20, max: 20, step: 0.5, color: 'sky', label: 'b (분자의 상수항)', format: fm },
      fc: { value: -2, min: -6, max: 6, step: 1, color: 'amber', label: 'c (분모의 상수항)', hint: '수직 점근선 x = −c', format: fm },
      s2k: { value: 4, min: 1, max: 9, step: 1, color: 'sky', label: '|k| (곡선의 크기)', format: fm },
      s2p: { value: 1, min: -4, max: 4, step: 1, color: 'amber', label: 'p', format: fm },
      s2q: { value: 1, min: -4, max: 4, step: 1, color: 'rose', label: 'q', format: fm },
      s3th: { value: -25, min: -90, max: 90, step: 0.5, color: 'amber', label: '직선 l의 기울기각', hint: '손잡이 l을 끌어도 됩니다 (±90°는 수직선)', format: (v) => (Math.abs(Math.abs(v) - 90) < 1e-6 ? '수직선' : `${mn(Math.round(v * 10) / 10)}° (m = ${mn(Math.round(Math.tan((v * Math.PI) / 180) * 100) / 100)})`) },
      s3b: { value: 6, min: -9, max: 9, step: 0.25, color: 'amber', label: '직선의 y절편 b', hint: '손잡이를 위아래로 끌어도 됩니다', format: fm },
      s4k: { value: 4, min: -8, max: 8, step: 1, color: 'sky', label: 'k (곡선의 크기·방향)', hint: '양수이면 감소, 음수이면 증가', format: fm },
      s4kl: { value: 12, min: 4, max: 12, step: 2, color: 'sky', label: 'k (곡선의 높이)', format: fm },
      s2u: { value: 3, min: -7, max: 7, step: 0.1, color: 'green', label: '점 P의 위치 (x − p)', format: fm }
    },
    scenes,
    lessons
  });
});
</script>
