<script>
/* ==========================================================================
   공통수학 · 다항식과 입체 (AP Math Lab 2.0 신규 실험실) — 5개 장면
   1 (a+b)², (a−b)² 정사각형 조각 · 2 (a+b)³ 정육면체 조각 · 3 직육면체의 모서리 합·겉넓이·대각선 ↔ a+b+c, ab+bc+ca, a²+b²+c²
   4 사면체를 잘라 낸 입체(2023 11월 경기 28번 유형) · 5 삼각기둥을 잘라 낸 입체의 부피(2024 10월 경기 20번 · 2025 10월 경기 29번 유형)
   - 곱셈공식을 외우기 전에 넓이·부피 조각으로 쌓아 보며 납득하게 합니다. 그림의 수와 공식 값은 항상 같습니다.
   - 입체 그림은 중1 겨냥도 기준을 따릅니다: 숨은 모서리는 점선, 밑면이 아래, 위에서 약 20° 내려다보고 옆으로 약 28° 돌린 시점.
   - 탭마다: 탐구 = 조작하는 그림 전체 · 정리 = 문제의 풀이를 단계별로 · 문제 = 주어진 것만(답·보조 표시는 그리지 않음)
   ========================================================================== */
window.addEventListener('DOMContentLoaded', function () {
  const tex = APLab.tex;
  const { clamp } = APLab;
  const { V, add, sub, mul, cross } = APLab.vec3;
  const R2D = 180 / Math.PI;
  const rint = (n) => Math.floor(Math.random() * n);
  const pickOf = (arr, not) => { let x; do x = arr[rint(arr.length)]; while (arr.length > 1 && x === not); return x; };
  const varier = (gen) => { let cur = gen(null); return { cur: () => cur, next: () => (cur = gen(cur)) }; };
  const num = (v, d = 2) => (Math.abs(v - Math.round(v)) < 1e-9 ? String(Math.round(v)) : v.toFixed(d).replace(/0+$/, '').replace(/\.$/, ''));
  const fmtN = (v) => num(v).replace('-', '−');
  const FITO = { margin: 0.04, px: 6 };
  const camOf = (s) => ({ yaw: s.yaw / R2D, pitch: s.pitch / R2D });
  let SP = null, LAB = null;
  const probHTML = (body) => `${body}<div style="margin-top:10px"><button type="button" class="apl-btn sm" data-ps-new>새 문제</button></div>`;
  document.addEventListener('click', (ev) => {
    const hitEl = ev.target && ev.target.closest && ev.target.closest('[data-ps-new]');
    if (!hitEl) return;
    const lab = window.lab, sc = lab && lab.scene;
    if (!sc || !sc.vary) return;
    sc.vary.next();
    lab.s.revealed = false;
    lab.setStep(1);
    try { lab._buildReview(); } catch (e) { /* 키트가 바뀌어도 그림은 그대로 */ }
    lab.invalidate(true);
  });
  const baseScene = (o) => ({
    tabs: { compact: true },
    ...o
  });
  const pState = (lab, s, patch = {}) => (lab && lab.tab === 'problem' ? { ...s, step: 0, part: 0, ...patch } : s);
  const reviewTop = (getText) => () => `<div class="apl-rich" style="font-size:var(--fs-sm);line-height:1.75"><small style="color:var(--text-3);font-weight:800">문제</small><br>${getText()}</div>`;
  const spinActions = [{ id: 'spin', play: true, icon: (s) => (s.playing ? 'pause' : 'play'), label: (s) => (s.playing ? '일시 정지' : '입체 자동 회전'), on: (s) => s.playing, run: (s) => { s.playing = !s.playing; } }];
  const spinTick = (s, dt) => { if (!s.playing) return false; s.yaw += 30 * dt; if (s.yaw > 180) s.yaw -= 360; return true; };
  // 시점 버튼: 꼭짓점이 포개지는 정면·바로 위 시점은 쓰지 않고, 비스듬한 두 시점만 둡니다
  const VIEWS = (iso) => (st) => {
    const near = (t) => Math.abs(st.yaw - t.yaw) < 1 && Math.abs(st.pitch - t.pitch) < 1;
    const other = { yaw: iso.yaw + (iso.yaw > 0 ? -62 : 62), pitch: iso.pitch + 8 };
    return [
      { group: '시점', label: '입체로 보기', set: iso, ms: 600, on: () => near(iso) },
      { group: '시점', label: '다른 방향에서 보기', set: other, ms: 600, on: () => near(other) }
    ];
  };
  const setMax = (lab, id, max) => {
    const p = lab.params[id];
    if (!p) return;
    p.max = max;
    const c = lab._ctls && lab._ctls[id];
    if (c) c.input.max = String(max);
    if (lab.s[id] > max) lab.s[id] = max;
  };

  /* ===================== 평면(2D) 그리기 도구 — 입체가 아닌 장면 1용 (y 아래쪽 좌표를 뒤집어 넘김) ===================== */
  const P2 = (x, y) => ({ x, y: -y });
  const seg2 = (b, x1, y1, x2, y2, o) => b.seg(P2(x1, y1), P2(x2, y2), o);
  const rect2 = (b, x, y, w, h, o) => b.poly([P2(x, y), P2(x + w, y), P2(x + w, y + h), P2(x, y + h)], o);
  const txt2 = (b, x, y, s, o = {}) => b.text(P2(x, y), s, { size: 14, weight: 800, align: 'center', baseline: 'middle', ...o });
  function figure2(b, body, fo) {
    const bb = b.measure(body);
    if (bb) b.setFocus(b.fitBox(bb, { margin: 0.05, px: 10, ...fo }), false);
    body();
  }

  /* ============================================================================================
     장면 1 · (a+b)², (a−b)² — 정사각형 조각
     ============================================================================================ */
  function drawSquare(b, o) {
    // o: {mode:'plus'|'minus', a, b, gap, cols:{aa,ab,bb,m}, labels:{aa,ab,bb,m, ...}, dims:true, vals:true}
    const { mode, a, b: bb, gap = 0 } = o, L = o.labels || {}, C = o.cols || {};
    const col = (k, d) => C[k] || d;
    figure2(b, () => {
      if (mode === 'plus') {
        const g = gap * 0.6, s = a + bb;
        const piece = (x, y, w, h, c, label, val, hot) => {
          rect2(b, x, y, w, h, { fill: c, fillAlpha: hot === false ? 0.07 : 0.36, color: c, width: 2.2, alpha: hot === false ? 0.45 : 1 });
          if (label) txt2(b, x + w / 2, y + h / 2 - (val ? 0.2 : 0), label, { size: 15, color: hot === false ? 'muted' : 'ink' });
          if (val) txt2(b, x + w / 2, y + h / 2 + 0.28, val, { size: 12.5, color: 'muted' });
        };
        piece(0, 0, a, a, col('aa', 'sky'), L.aa, o.vals ? num(a * a) : '', o.hot && o.hot.aa);
        piece(a + g, 0, bb, a, col('ab', 'green'), L.ab1 || L.ab, o.vals ? num(a * bb) : '', o.hot && o.hot.ab);
        piece(0, a + g, a, bb, col('ab', 'green'), L.ab2 || L.ab, o.vals ? num(a * bb) : '', o.hot && o.hot.ab);
        piece(a + g, a + g, bb, bb, col('bb', 'rose'), L.bb, o.vals ? num(bb * bb) : '', o.hot && o.hot.bb);
        if (o.dims !== false) {
          // 위: a, b, a+b
          seg2(b, 0, -0.45, a, -0.45, { color: 'sky', width: 2.2 }); seg2(b, a + g, -0.45, a + g + bb, -0.45, { color: 'rose', width: 2.2 });
          txt2(b, a / 2, -0.95, o.dimTxt ? o.dimTxt.a : `a${o.vals ? ' = ' + num(a) : ''}`, { size: 14, color: 'sky' });
          txt2(b, a + g + bb / 2, -0.95, o.dimTxt ? o.dimTxt.b : `b${o.vals ? ' = ' + num(bb) : ''}`, { size: 14, color: 'rose' });
          seg2(b, 0, -1.5, s + g, -1.5, { color: 'ink', width: 2.2 });
          txt2(b, (s + g) / 2, -2.0, o.dimTxt ? o.dimTxt.s : `a + b${o.vals ? ' = ' + num(s) : ''}`, { size: 14.5, color: 'ink' });
          // 왼쪽: a, b
          seg2(b, -0.45, 0, -0.45, a, { color: 'sky', width: 2.2 }); seg2(b, -0.45, a + g, -0.45, a + g + bb, { color: 'rose', width: 2.2 });
          txt2(b, -1.0, a / 2, 'a', { size: 14, color: 'sky' }); txt2(b, -1.0, a + g + bb / 2, 'b', { size: 14, color: 'rose' });
        }
      } else {
        const piece = (x, y, w, h, c, label, val, fa, hot) => {
          rect2(b, x, y, w, h, { fill: c, fillAlpha: hot === false ? 0.07 : fa, color: c, width: 2.2, alpha: hot === false ? 0.45 : 1 });
          if (label) txt2(b, x + w / 2, y + h / 2 - (val ? 0.2 : 0), label, { size: 15, color: hot === false ? 'muted' : 'ink' });
          if (val) txt2(b, x + w / 2, y + h / 2 + 0.28, val, { size: 12.5, color: 'muted' });
        };
        const d = a - bb;
        piece(bb, bb, d, d, col('m', 'green'), L.m, o.vals ? num(d * d) : '', 0.4, o.hot && o.hot.m);                       // (a−b)²
        piece(bb, 0, d, bb, col('ab', 'amber'), L.ab1 || L.ab, o.vals ? num(d * bb) : '', 0.32, o.hot && o.hot.ab);          // 위 띠의 남는 부분 b×(a−b)
        piece(0, bb, bb, d, col('ab', 'amber'), L.ab2 || L.ab, o.vals ? num(d * bb) : '', 0.32, o.hot && o.hot.ab);          // 왼쪽 띠의 남는 부분
        piece(0, 0, bb, bb, col('bb', 'rose'), L.bb, o.vals ? num(bb * bb) : '', 0.45, o.hot && o.hot.bb);                   // 겹친 모서리 b²
        if (o.dims !== false) {
          seg2(b, 0, a + 0.45, bb, a + 0.45, { color: 'rose', width: 2.2 }); seg2(b, bb, a + 0.45, a, a + 0.45, { color: 'green', width: 2.2 });
          txt2(b, bb / 2, a + 0.95, o.dimTxt ? o.dimTxt.b : `b${o.vals ? ' = ' + num(bb) : ''}`, { size: 14, color: 'rose' });
          txt2(b, bb + d / 2, a + 0.95, o.dimTxt ? o.dimTxt.d : `a − b${o.vals ? ' = ' + num(d) : ''}`, { size: 14, color: 'green' });
          seg2(b, 0, -0.45, a, -0.45, { color: 'ink', width: 2.2 });
          txt2(b, a / 2, -0.95, o.dimTxt ? o.dimTxt.a : `a${o.vals ? ' = ' + num(a) : ''}`, { size: 14.5, color: 'ink' });
        }
      }
    });
  }
  const var1 = varier((prev) => {
    const kind = prev ? (prev.kind === 'sum' ? 'diff' : 'sum') : 'sum';
    if (kind === 'sum') {
      const q = prev ? pickOf([[5, 6], [6, 8], [7, 12], [4, 3], [8, 12]], prev.lastS) : [5, 6], [s, p] = q, v = s * s - 2 * p;
      return { kind, s, p, ans: { tex: String(v), val: v }, lastS: q, lastD: prev && prev.lastD };
    }
    const q = prev && prev.lastD ? pickOf([[1, 6], [2, 8], [3, 10], [2, 15]], prev.lastD) : [[1, 6], [2, 8], [3, 10], [2, 15]][rint(4)], [d, p] = q, v = d * d + 2 * p;
    return { kind, d, p, ans: { tex: String(v), val: v }, lastD: q, lastS: prev && prev.lastS };
  });
  const text1 = (v) => (v.kind === 'sum'
    ? `두 양수 ${tex('a')}, ${tex('b')}에 대하여 ${tex(`a+b=${v.s}`)}, ${tex(`ab=${v.p}`)}일 때, ${tex('a^2+b^2')}의 값을 구하시오.`
    : `두 양수 ${tex('a')}, ${tex('b')}에 대하여 ${tex(`a-b=${v.d}`)}, ${tex(`ab=${v.p}`)}일 때, ${tex('a^2+b^2')}의 값을 구하시오.`);
  const steps1 = () => {
    const v = var1.cur();
    if (v.kind === 'sum') return [
      `한 변이 $a+b$인 큰 정사각형의 넓이: $(a+b)^2=${v.s}^2=${v.s * v.s}$`,
      `큰 정사각형 속의 직사각형 두 개($ab$ 두 개)의 넓이: $2ab=2\\times${v.p}=${2 * v.p}$`,
      `나머지 두 정사각형의 넓이의 합: $a^2+b^2=(a+b)^2-2ab=${v.s * v.s}-${2 * v.p}=${v.ans.val}$`
    ];
    return [
      `가운데 초록 정사각형(한 변 $a-b$)의 넓이: $(a-b)^2=${v.d}^2=${v.d * v.d}$`,
      `위 띠와 왼쪽 띠(직사각형 $ab$ 두 개)의 넓이: $2ab=2\\times${v.p}=${2 * v.p}$`,
      `큰 정사각형 $a^2$과 겹친 모서리 $b^2$를 합하면 초록 정사각형과 두 띠를 합한 것과 같다: $a^2+b^2=(a-b)^2+2ab=${v.d * v.d}+${2 * v.p}=${v.ans.val}$`
    ];
  };
  function scene1() {
    return baseScene({
      id: 'sq', title: '(a+b)² · (a−b)² 정사각형 조각', short: '(a+b)²',
      question: '(a+b)² = a² + 2ab + b² 에서 2ab는 그림의 어디일까? (a−b)²일 때는 무엇이 겹쳐서 빼야 할까?',
      guide: (s) => (s.mode1 === 'plus'
        ? '<b>조각 떼어 내기</b> 막대를 밀면 한 변이 $a+b$인 큰 정사각형이 네 조각으로 떨어집니다: 파란 정사각형 $a^2$, 초록 직사각형 $ab$ 두 개, 분홍 정사각형 $b^2$.'
        : '한 변이 $a$인 정사각형에서 위 띠 $ab$와 왼쪽 띠 $ab$를 모두 빼면 겹친 모서리 $b^2$(분홍)를 <b>두 번</b> 뺀 셈이라, 한 번 되돌려 더해야 초록 정사각형 $(a-b)^2$이 남습니다.'),
      enter: (s) => { s.mode1 = 'plus'; s.a1 = 3; s.b1 = 2; s.gap1 = 0.5; },
      controls: (s) => (s.mode1 === 'plus' ? ['a1', 'b1', 'gap1'] : ['a1', 'b1']),
      presets: () => [
        { group: '무엇을 볼까?', label: '(a+b)² 합의 제곱', apply: (st) => { st.mode1 = 'plus'; }, on: (st) => st.mode1 === 'plus' },
        { group: '무엇을 볼까?', label: '(a−b)² 차의 제곱', apply: (st) => { st.mode1 = 'minus'; if (st.b1 > st.a1 - 0.5) st.b1 = st.a1 - 0.5; }, on: (st) => st.mode1 === 'minus' }
      ],
      steps: steps1,
      reviewTop: reviewTop(() => text1(var1.cur())),
      problem: { tag: () => (var1.cur().kind === 'sum' ? '곱셈공식 변형 기본 유형' : '곱셈공식 변형 기본 유형'), time: '목표 시간: 15초', text: () => probHTML(text1(var1.cur())), answer: () => tex(var1.cur().ans.tex) },
      solution: {
        standardTitle: '교과서식 풀이', standardTag: '기본 풀이', quickTitle: '10초 컷 · 그림으로 보기', quickTag: '10초 컷',
        standard: () => { const v = var1.cur(); return { steps: v.kind === 'sum' ? `① $(a+b)^2=a^2+2ab+b^2$ 이므로 $a^2+b^2=(a+b)^2-2ab$<br>② $=${v.s}^2-2\\times${v.p}=${v.ans.val}$` : `① $(a-b)^2=a^2-2ab+b^2$ 이므로 $a^2+b^2=(a-b)^2+2ab$<br>② $=${v.d}^2+2\\times${v.p}=${v.ans.val}$`, warning: '합과 곱(또는 차와 곱)이 주어지면 $a^2+b^2$은 항상 곱셈공식으로 바꾼 뒤 대입합니다. $a$, $b$를 직접 구할 필요가 없습니다.' }; },
        quick: () => { const v = var1.cur(); return { steps: v.kind === 'sum' ? `큰 정사각형에서 $ab$ 두 개를 뺀다: <strong class="text-amber-300">${v.s * v.s} − ${2 * v.p} = ${v.ans.val}</strong>` : `초록 정사각형에 $ab$ 두 개를 더한다: <strong class="text-amber-300">${v.d * v.d} + ${2 * v.p} = ${v.ans.val}</strong>`, highlight: '그림에서 $a^2+b^2$는 ‘큰 정사각형 − 2ab’ 또는 ‘작은 정사각형 + 2ab’입니다.' }; }
      },
      view: (s, lab) => {
        setMax(lab, 'b1', s.mode1 === 'minus' ? Math.min(3, s.a1 - 0.5) : 3);
        const a = s.a1, bb = s.b1, ex = lab.tab === 'explore', plus = s.mode1 === 'plus';
        const L = plus ? (a + bb) ** 2 : (a - bb) ** 2, R = plus ? a * a + 2 * a * bb + bb * bb : a * a - 2 * a * bb + bb * bb;
        return {
          chips: ex ? [{ tex: plus ? '(a+b)^2=a^2+2ab+b^2' : '(a-b)^2=a^2-2ab+b^2', color: 'amber' }] : [],
          status: ex ? { tone: 'info', text: plus ? `(${num(a)}+${num(bb)})² = ${num(L)}` : `(${num(a)}−${num(bb)})² = ${num(L)}` } : null,
          readouts: [
            { label: plus ? '큰 정사각형 (a+b)²' : '초록 정사각형 (a−b)²', value: num(L), color: 'ink' },
            { label: plus ? 'a² + 2ab + b²' : 'a² − 2ab + b²', value: plus ? `${num(a * a)} + ${num(2 * a * bb)} + ${num(bb * bb)} = ${num(R)}` : `${num(a * a)} − ${num(2 * a * bb)} + ${num(bb * bb)} = ${num(R)}`, color: 'green', note: '두 값은 언제나 같다' }
          ],
          rule: plus ? '네 조각의 넓이를 더하면 큰 정사각형' : '띠 두 개를 빼면 모서리 b²를 두 번 뺀 셈',
          formula: '$(a+b)^2=a^2+2ab+b^2$ — 한 변 $a+b$인 정사각형은 $a^2$, $ab$ 두 개, $b^2$ 네 조각입니다.<br>$(a-b)^2=a^2-2ab+b^2$ — 한 변 $a$인 정사각형에서 두 띠 $ab$를 빼면 겹친 $b^2$가 두 번 빠지므로 한 번 되돌려 더합니다.<br>곱셈 공식의 변형: $a^2+b^2=(a+b)^2-2ab=(a-b)^2+2ab$',
          notes: '$(a+b)^2=a^2+b^2$로 착각하기 쉽습니다. 그림에서 $2ab$(초록 두 개)가 빠져 있습니다. $(a-b)^2$에서 $+b^2$의 부호도 그림의 겹친 모서리로 기억하세요.'
        };
      },
      vary: var1,
      draw: (b, s0, v, lab) => {
        LAB = lab;

        if (lab.tab === 'explore') drawCut4({ a: s0.a4, b: s0.b4, c: s0.c4, cut: s0.cut4, fillCut: true });
        else {
          const st = lab.tab === 'problem' ? 0 : s0.step;
          drawCut4({ a: 2, b: 2.6, c: 3.2, cut: lab.tab === 'problem' ? 0.5 : 0.7, fillCut: true, fillRight: st === 2, legCol: st === 1 ? 'amber' : 'ink', hypCol: st >= 3 ? 'green' : 'rose' });
        }
      }
    });
  }

  /* ============================================================================================
     장면 5 · 삼각기둥을 잘라 낸 입체의 부피  (2024학년도 10월 학평(경기) 20번 · 2025학년도 10월 학평(경기) 29번 유형)
     직육면체 ABCD-EFGH에서 AB 위의 점 P, DC 위의 점 Q를 지나는 단면 PFGQ로 삼각기둥 PFB-QGC를 잘라 낸다.
     ============================================================================================ */
  const prismGeo = (L, a, ap) => ({ A: V(0, a, 0), B: V(L, a, 0), C: V(L, a, a), D: V(0, a, a), E: V(0, 0, 0), F: V(L, 0, 0), G: V(L, 0, a), H: V(0, 0, a), P: V(ap, a, 0), Q: V(ap, a, a) });
  const prismVols = (L, a, ap) => { const V1 = ((ap + L) / 2) * a * a, V2 = ((L - ap) / 2) * a * a; return { V1, V2, sum: V1 + V2, diff: V1 - V2 }; };
  function drawPrism5(o) {
    const g = prismGeo(o.L, o.a, o.ap), dv = V(o.cut * (o.L * 0.16 + o.a * 0.4), 0, 0), mv = (p) => add(p, dv), ctr = V(o.L / 2, o.a / 2, o.a / 2);
    const T = { P: mv(g.P), F: mv(g.F), B: mv(g.B), Q: mv(g.Q), G: mv(g.G), C: mv(g.C) };
    SP.solid(APLab.solidFaces.prism([g.A, g.E, g.F, g.P], [g.D, g.H, g.G, g.Q]));
    SP.solid(APLab.solidFaces.prism([T.P, T.F, T.B], [T.Q, T.G, T.C]));
    const body = () => {
      if (o.fill) {
        SP.poly([g.D, g.H, g.G, g.Q], { fill: 'sky', fillAlpha: 0.28, color: null, hide: false });
        SP.poly([T.Q, T.G, T.C], { fill: 'rose', fillAlpha: 0.34, color: null, hide: false });
      }
      [['A', 'E'], ['E', 'F'], ['P', 'A'], ['D', 'H'], ['H', 'G'], ['Q', 'D'], ['A', 'D'], ['E', 'H'], ['F', 'G'], ['G', 'Q'], ['F', 'P'], ['P', 'Q']].forEach(([p, q]) => SP.line(g[p], g[q], { color: (p + q === 'FP' || p + q === 'PQ' || p + q === 'GQ') ? 'rose' : 'ink', width: (p + q === 'FP' || p + q === 'PQ' || p + q === 'GQ') ? 3 : 2.2 }));
      [['P', 'F'], ['F', 'B'], ['B', 'P'], ['Q', 'G'], ['G', 'C'], ['C', 'Q'], ['P', 'Q'], ['B', 'C'], ['F', 'G']].forEach(([p, q]) => { if (o.cut > 0.02) SP.line(T[p], T[q], { color: (p + q === 'PF' || p + q === 'PQ' || p + q === 'QG') ? 'rose' : 'ink', width: 2.2 }); else if (p + q === 'FB' || p + q === 'BP' || p + q === 'GC' || p + q === 'CQ' || p + q === 'BC') SP.line(g[p], g[q], { color: 'ink', width: 2.2 }); });
      ['A', 'D', 'E', 'H', 'F', 'G', 'P', 'Q'].forEach((n) => vLabel(g[n], n, ctr, n === 'P' || n === 'Q' ? 'rose' : 'ink'));
      vLabel(o.cut > 0.02 ? T.B : g.B, 'B', ctr, 'ink'); vLabel(o.cut > 0.02 ? T.C : g.C, 'C', ctr, 'ink');
      if (o.tags) { lbl(add(mul(add(g.A, g.G), 0.5), V(-o.L * 0.12, 0, 0)), o.tags[0], 'sky', 0, 24, 14.5); lbl(add(mul(add(T.Q, T.B), 0.5), V(0, 0, 0)), o.tags[1], 'rose', 0, -22, 14.5); }
      if (o.under) lbl(V(o.L / 2, -0.55 - o.a * 0.2, o.a / 2), o.under[0], o.under[1], 0, 22, 14);
    };
    fits([...Object.values(g), ...Object.values(T)], body);
    body();
  }
  const POLY5 = [[2, 1, 3], [3, 1, 2], [2, 3, 1], [4, 1, 1], [3, 2, 1]]; // [a, m, n]: AB = m a² + (m+n)a + n = (a+1)(ma+n), AP = ma+n, V1−V2 = a²(ma+n)
  const var5 = varier((prev) => {
    const q = prev ? pickOf(POLY5, prev.q) : POLY5[0], [a, m, n] = q, ap = m * a + n, k = a * a * ap, poly = `${m === 1 ? '' : m}a^2+${m + n}a+${n}`;
    return { q, a, m, n, ap, k, poly, ans: { tex: String(ap), val: ap } };
  });
  const text5 = (v) => `양수 ${tex('a')}에 대하여 ${tex(`\\overline{AB}=${v.poly}`)}, ${tex('\\overline{AD}=\\overline{AE}=a')}인 직육면체 ${tex('ABCD\\text{-}EFGH')}가 있다. 선분 ${tex('AB')}를 ${tex('1:a')}로 내분하는 점을 ${tex('P')}, 선분 ${tex('DC')}를 ${tex('1:a')}로 내분하는 점을 ${tex('Q')}라 하자. 직육면체 ${tex('ABCD\\text{-}EFGH')}에서 단면 ${tex('PFGQ')}가 생기도록 삼각기둥 ${tex('PFB\\text{-}QGC')}를 잘라 내었다. 사각기둥 ${tex('AEFP\\text{-}DHGQ')}의 부피를 ${tex('V_1')}, 삼각기둥 ${tex('PFB\\text{-}QGC')}의 부피를 ${tex('V_2')}라 하자. ${tex(`V_1-V_2=${v.k}`)}일 때, 선분 ${tex('AP')}의 길이를 구하시오.`;
  const steps5 = () => {
    const v = var5.cur();
    return [
      `$V_1$은 밑면이 사다리꼴 $AEFP$, $V_2$는 밑면이 직각삼각형 $PFB$인 기둥이고 높이는 모두 $AD=a$이다: $V_1-V_2=\\dfrac12(AP+AB)a\\cdot a-\\dfrac12PB\\cdot a\\cdot a$`,
      `$AB=AP+PB$ 이므로 $AP+AB-PB=2AP$ → $V_1-V_2=a^2\\cdot AP$. 또 $AP=\\dfrac{AB}{a+1}$ 이고 $AB=(a+1)(${v.m === 1 ? '' : v.m}a+${v.n})$ 이므로 $AP=${v.m === 1 ? '' : v.m}a+${v.n}$ → $a^2(${v.m === 1 ? '' : v.m}a+${v.n})=${v.k}$`,
      `$a=${v.a}$는 이 식을 만족하고 $a\\gt 0$에서 좌변은 증가하므로 $a=${v.a}$뿐이다. 따라서 $AP=${v.m === 1 ? '' : v.m}\\times${v.a}+${v.n}=${v.ans.val}$`
    ];
  };
  function scene5() {
    return baseScene({
      id: 'prism', title: '삼각기둥을 잘라 낸 입체의 부피', short: '기둥 잘라내기',
      question: '직육면체를 비스듬한 단면으로 잘라 사각기둥과 삼각기둥으로 나누면, 두 부피의 합과 차는 각각 무엇과 같아질까?',
      guide: '<b>잘라 내기</b> 막대로 삼각기둥($V_2$, 분홍)을 떼어 내고, <b>AP의 길이</b> 막대로 단면의 위치 $P$를 옮겨 보세요. 앞면은 사다리꼴(사각기둥)과 직각삼각형(삼각기둥)이고 두 기둥의 깊이는 같습니다. 합은 직육면체의 부피, <b>차는 $a^2\\times AP$</b>입니다.',
      enter: (s) => { viewDefaults(s); s.yaw = 34; s.pitch = 28; s.L5 = 6; s.a5 = 2; s.ap5 = 2; s.cut5 = 0.6; },
      controls: () => ['cut5', 'ap5', 'L5', 'a5', 'yaw', 'pitch'],
      presets: (s) => VIEWS({ yaw: 34, pitch: 28 })(s),
      actions: spinActions, tick: spinTick,
      steps: steps5,
      reviewTop: reviewTop(() => text5(var5.cur())),
      problem: { tag: '2024학년도 10월 학평(경기) 20번 유형', time: '목표 시간: 90초', text: () => probHTML(text5(var5.cur())), answer: () => tex(var5.cur().ans.tex) },
      solution: {
        standardTitle: '교과서식 풀이', standardTag: '기본 풀이', quickTitle: '10초 컷 · V₁−V₂ = a²·AP', quickTag: '10초 컷',
        standard: () => { const v = var5.cur(); return { steps: `① 높이(깊이)가 $a$로 같은 두 기둥의 밑면: 사다리꼴 $AEFP$의 넓이 $\\dfrac12(AP+AB)\\cdot a$, 직각삼각형 $PFB$의 넓이 $\\dfrac12PB\\cdot a$<br>② $V_1-V_2=\\dfrac{a^2}{2}(AP+AB-PB)=\\dfrac{a^2}{2}\\cdot2AP=a^2\\cdot AP$<br>③ $AP=\\dfrac{AB}{a+1}=${v.m === 1 ? '' : v.m}a+${v.n}$ 이므로 $a^2(${v.m === 1 ? '' : v.m}a+${v.n})=${v.k}$ → $a=${v.a}$<br>④ $AP=${v.ans.val}$`, warning: '$V_1+V_2$는 직육면체의 부피로 쉽게 나오지만 문제에서 주어진 것은 <b>차</b>입니다. 차는 단면의 한쪽 끝(AP) 길이와 깊이의 제곱만 남습니다.' }; },
        quick: () => { const v = var5.cur(); return { steps: `<strong class="text-amber-300">V₁ − V₂ = a² · AP = ${v.k}</strong>, AP = ${v.m === 1 ? '' : v.m}a + ${v.n}`, highlight: '차를 구하면 사다리꼴과 삼각형의 겹치는 부분이 지워져 직육면체(AP 부분)만 남는다.' }; }
      },
      view: (s, lab) => {
        setMax(lab, 'ap5', Math.max(1.5, s.L5 - 1));
        const ex = lab.tab === 'explore', vv = prismVols(s.L5, s.a5, s.ap5), pv = var5.cur();
        return {
          chips: ex ? [{ tex: 'V_1-V_2=a^2\\times\\overline{AP}', color: 'amber' }] : [{ tex: `\\overline{AB}=${pv.poly},\\ V_1-V_2=${pv.k}`, color: 'ink' }],
          status: ex ? { tone: 'info', text: `AB=${num(s.L5)} · a=${num(s.a5)} · AP=${num(s.ap5)}` } : null,
          readouts: [
            { label: 'V₁ 사각기둥 ½(AP+AB)·a²', value: num(vv.V1), color: 'sky' },
            { label: 'V₂ 삼각기둥 ½·PB·a²', value: num(vv.V2), color: 'rose' },
            { label: 'V₁ + V₂ = AB · a²', value: `${num(vv.sum)} = ${num(s.L5)}×${num(s.a5 * s.a5)}`, color: 'green', wide: true, note: '두 기둥을 합치면 직육면체' },
            { label: 'V₁ − V₂ = a² · AP', value: `${num(vv.diff)} = ${num(s.a5 * s.a5)}×${num(s.ap5)}`, color: 'amber', wide: true, note: '차는 AP와 깊이의 제곱만으로 결정' }
          ],
          rule: '두 기둥의 합은 직육면체의 부피, 차는 a²·AP',
          formula: '직육면체의 단면 $PFGQ$로 나눈 두 기둥의 높이(깊이)는 같으므로 부피의 비는 밑면의 넓이의 비입니다.<br>$V_1=\\dfrac12(AP+AB)\\,a^2$, $V_2=\\dfrac12(AB-AP)\\,a^2$ → $V_1+V_2=AB\\cdot a^2$, $V_1-V_2=AP\\cdot a^2$<br>내분점 $AP:PB=1:a$ 이면 $AP=\\dfrac{AB}{a+1}$ 입니다.',
          notes: '사각기둥 $AEFP\\text{-}DHGQ$의 밑면은 사다리꼴입니다(직사각형이 아님). 합과 차 중 어느 쪽이 쉬운지 먼저 보고, $AB$가 $a$의 다항식이면 인수분해로 $a+1$을 묶어 내분점의 길이를 구합니다.'
        };
      },
      vary: var5,
      draw: (b, s0, v, lab) => {
        LAB = lab;
        const s = pState(lab, s0);
        SP = APLab.space(b, camOf(s));
        if (lab.tab === 'explore') drawPrism5({ L: s0.L5, a: s0.a5, ap: Math.min(s0.ap5, s0.L5 - 1), cut: s0.cut5, fill: true, tags: ['V₁', 'V₂'] });
        else {
          const vv = var5.cur(), st = lab.tab === 'problem' ? 0 : s0.step;
          drawPrism5({ L: 9, a: 2, ap: 2.6, cut: st >= 1 ? 0.8 : 0, fill: st >= 1, tags: st >= 1 ? ['V₁', 'V₂'] : null, under: st === 2 ? ['V₁ − V₂ = a² · AP', 'amber'] : st >= 3 ? [`AP = ${vv.m === 1 ? '' : vv.m}a + ${vv.n} = ${vv.ans.val}`, 'amber'] : null });
        }
      }
    });
  }

  APLab.createLab({
    id: 'common-poly-solid',
    title: '다항식과 입체',
    courseName: '공통수학',
    unit: '다항식',
    courseColor: 'var(--m-amber)',
    home: '../index.html#common',
    board: BOARD3,
    state: { mode1: 'plus', lens2: 'all', lens3: 'all' },
    params: {
      yaw: { value: -28, min: -180, max: 180, step: 1, color: 'muted', label: '좌우 회전', format: (v) => `${Math.round(v)}°` },
      pitch: { value: 22, min: -15, max: 85, step: 1, color: 'muted', label: '위아래 기울기', format: (v) => `${Math.round(v)}°` },
      a1: { value: 3, min: 1.5, max: 5, step: 0.5, color: 'sky', label: '변의 길이 a', format: (v) => `a = ${num(v)}` },
      b1: { value: 2, min: 0.5, max: 3, step: 0.5, color: 'rose', label: '변의 길이 b', format: (v) => `b = ${num(v)}` },
      gap1: { value: 0.5, min: 0, max: 1, step: 0.01, color: 'amber', label: '조각 떼어 내기', hint: '막대를 밀면 네 조각이 떨어집니다', format: (v) => `${Math.round(v * 100)} %` },
      a2: { value: 3, min: 1, max: 15, step: 0.5, color: 'sky', label: '변의 길이 a', format: (v) => `a = ${num(v)}` },
      b2: { value: 2, min: 0.5, max: 15, step: 0.5, color: 'rose', label: '변의 길이 b', format: (v) => `b = ${num(v)}` },
      gap2: { value: 0.6, min: 0, max: 1, step: 0.01, color: 'amber', label: '조각 펼치기', hint: '막대를 밀면 8조각이 떨어집니다', format: (v) => `${Math.round(v * 100)} %` },
      a3: { value: 2, min: 1, max: 15, step: 0.5, color: 'sky', label: 'AB = a', format: (v) => `a = ${num(v)}` },
      b3: { value: 3, min: 1, max: 15, step: 0.5, color: 'green', label: 'BC = b', format: (v) => `b = ${num(v)}` },
      c3: { value: 4, min: 1, max: 20, step: 0.5, color: 'amber', label: 'BF = c', format: (v) => `c = ${num(v)}` },
      a4: { value: 2, min: 1, max: 15, step: 0.5, color: 'sky', label: 'AB = a', format: (v) => `a = ${num(v)}` },
      b4: { value: 3, min: 1, max: 15, step: 0.5, color: 'green', label: 'BC = b', format: (v) => `b = ${num(v)}` },
      c4: { value: 4, min: 1, max: 20, step: 0.5, color: 'amber', label: 'BF = c', format: (v) => `c = ${num(v)}` },
      cut4: { value: 0.7, min: 0, max: 1, step: 0.01, color: 'rose', label: '사면체 잘라 내기', hint: '막대를 밀면 사면체 F−ABC가 떨어져 나옵니다', format: (v) => `${Math.round(v * 100)} %` },
      L5: { value: 6, min: 5, max: 15, step: 1, color: 'sky', label: 'AB의 길이', format: (v) => `AB = ${num(v)}` },
      a5: { value: 2, min: 1, max: 15, step: 0.5, color: 'green', label: 'AD = AE = a', format: (v) => `a = ${num(v)}` },
      ap5: { value: 2, min: 1, max: 14, step: 0.5, color: 'rose', label: 'AP의 길이', hint: '점 P(단면의 위치)를 옮깁니다', format: (v) => `AP = ${num(v)}` },
      cut5: { value: 0.6, min: 0, max: 1, step: 0.01, color: 'amber', label: '삼각기둥 잘라 내기', hint: '막대를 밀면 삼각기둥 V₂가 떨어져 나옵니다', format: (v) => `${Math.round(v * 100)} %` }
    },
    scenes: [scene1(), scene2(), scene3(), scene4(), scene5()]
  });
  document.querySelectorAll('.apl-icon-btn[aria-label^="격자"]').forEach((e) => { e.hidden = true; });
});
