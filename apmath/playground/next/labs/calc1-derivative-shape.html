<script>
/* ==========================================================================
   미적분Ⅰ · 도함수 ↔ 원함수 개형 추론 (AP Math Lab 2.0 이식본)
   원본: labs/미적분1/도함수 ↔ 원함수.html
   - 문제·단계·정석/빠른 풀이 문구(examData)는 원본을 그대로 옮겼습니다.
   - 수학 함수(원함수 evalTopFunc, 도함수 evalBottomFunc, 삼차방정식 실근 solveCubicRoots)는 원본과 같은 식입니다.
   - 바뀐 점: 셸·레이아웃은 공용 키트가 담당, 무대는 위(원함수)·가운데(증감표)·아래(도함수) 세 창을 모두 1:1 축척으로,
     모드마다 조절 막대를 따로 둠(원본은 param1·param2 를 모드마다 다른 뜻으로 재사용),
     도함수의 근·직선·핀을 끌 수 있는 점(후광)으로 통일, 증감표는 그림의 x 위치와 정렬된 막대로 표시.
   ========================================================================== */
window.addEventListener('DOMContentLoaded', function () {
  const { tex, fmt, clamp } = APLab;
  const asc = (v, d = 1) => fmt(v, d).replace('−', '-'); // 수식(tex)용: 유니코드 마이너스 대신 '-'
  const sg = (v, d = 1) => (v < 0 ? '-' : '+') + ' ' + asc(Math.abs(v), d); // tex용 부호 있는 수
  const quiet = (b) => { if (b.thumb) b._text = function () { return this; }; }; // '모든 장면' 썸네일에서는 글자를 빼고 그림만 보여 줍니다

  /* ---------- 1. 모드별 원함수(위)·도함수(아래) 수학 모델 (원본 evalTopFunc / evalBottomFunc) ---------- */
  // 원본의 param1·param2 는 모드마다 뜻이 달랐습니다 → 이름 있는 값으로 나눔:
  //   δ(delta): 모드 1·3·5 도함수 근 파라미터 / λ(lam): 모드 2 가운데 근 내분비
  //   C: 모드 1·3 적분상수 / C2: 모드 2 상하 이동 / k: 모드 4 직선 높이 / a: 모드 5 정적분 아래끝
  const lamOf = (s) => Math.max(0, Math.min(1, s.lam));
  const gammaOf = (s) => -1.0 + 4.0 * lamOf(s);
  // Only the two endpoints merge roots; a nearby middle root is still distinct.
  const quarticCase = (s) => lamOf(s) === 0 ? 'left' : lamOf(s) === 1 ? 'right' : 'three';
  const effDeltaOf = (m, s) => (m === 4 ? 1.0 + s.k / 3.0 : s.delta); // 도함수가 x축(또는 직선)과 만나는 정도
  const effTolerance = (m) => m === 3 ? 0 : 1e-9; // The root-count scene must distinguish either side of δ=0.
  const productText = (p) => p !== 0 && Math.abs(p) < 1e-4 ? p.toExponential(3) : fmt(p);
  function evalTop(m, s, x) {
    if (m === 1 || m === 3) {
      // f(x) = (x - 1)^3 - 3*δ*(x - 1) + C
      const u = x - 1.0;
      return u * u * u - 3 * s.delta * u + s.C;
    } else if (m === 2) {
      // 사차함수: α = -1, β = 3 (L=4), γ = -1 + 4*λ
      const u = x - (-1.0);
      const L = 4.0;
      const c = Math.max(0, Math.min(1, s.lam)) * L;
      return 0.2 * (Math.pow(u, 4) - (4 / 3) * (L + c) * Math.pow(u, 3) + 2 * c * L * u * u) + s.C2 - 1.5;
    } else if (m === 4) {
      // 차함수 h(x) = f(x) - g(x), 여기서 f'(x) = 3(x-1)^2 - 3, g'(x) = k
      // 즉 h'(x) = 3(x-1)^2 - (3 + k) => h(x) = (x-1)^3 - (3 + k)(x-1)
      const u = x - 1.0;
      const effDelta = 1.0 + s.k / 3.0;
      return u * u * u - 3 * effDelta * u;
    } else if (m === 5) {
      // 정적분으로 정의된 함수 g(x) = ∫_a^x f(t) dt, 피적분함수 f(t) = 3(t-1)^2 - 3*δ
      // 원시함수 F(x) = (x-1)^3 - 3*δ*(x-1) 이므로 g(x) = F(x) - F(a)
      const dlt = s.delta;
      const a = s.a;
      const Fx = Math.pow(x - 1, 3) - 3 * dlt * (x - 1);
      const Fa = Math.pow(a - 1, 3) - 3 * dlt * (a - 1);
      return Fx - Fa;
    }
    return 0;
  }
  function evalBottom(m, s, x) {
    if (m === 1 || m === 3 || m === 5) {
      // f'(x) = 3[(x - 1)^2 - δ]
      const u = x - 1.0;
      return 3 * (u * u - s.delta);
    } else if (m === 2) {
      // 삼차 도함수 f'(x) = 0.8 (x + 1)(x - γ)(x - 3)
      const lam = Math.max(0, Math.min(1, s.lam));
      const gamma = -1.0 + 4.0 * lam;
      return 0.8 * (x + 1.0) * (x - gamma) * (x - 3.0);
    } else if (m === 4) {
      // 하단 기본 곡선 f'(x) = 3(x-1)^2 - 3 (여기에 직선 y = g'(x) = k 가 겹쳐 그려짐)
      const u = x - 1.0;
      return 3 * (u * u - 1.0);
    }
    return 0;
  }
  // 삼차방정식 실근 솔버 (모드 3 실근 개수 판정용)
  function solveCubicRoots(c3, c2, c1, c0) {
    const A = c2 / c3;
    const B = c1 / c3;
    const C = c0 / c3;
    const p = B - (A * A) / 3;
    const q = (2 * A * A * A) / 27 - (A * B) / 3 + C;
    const disc = (q * q) / 4 + (p * p * p) / 27;
    const shift = -A / 3;
    const roots = [];

    const tol = 64 * Number.EPSILON * Math.max(Math.abs(q*q/4), Math.abs(p*p*p/27), Number.MIN_VALUE);
    if (Math.abs(disc) <= tol) {
      if (p === 0 && q === 0) roots.push(shift);
      else {
        const u1 = Math.cbrt(-q / 2);
        roots.push(2 * u1 + shift, -u1 + shift);
      }
    } else if (disc > 0) {
      const sqrtD = Math.sqrt(disc);
      roots.push(Math.cbrt(-q / 2 + sqrtD) + Math.cbrt(-q / 2 - sqrtD) + shift);
    } else {
      const r = Math.sqrt(Math.max(0, -p / 3));
      const phi = Math.acos(Math.max(-1, Math.min(1, -q / (2 * r * r * r))));
      roots.push(
        2 * r * Math.cos(phi / 3) + shift,
        2 * r * Math.cos((phi + 2 * Math.PI) / 3) + shift,
        2 * r * Math.cos((phi + 4 * Math.PI) / 3) + shift
      );
    }
    return roots.sort((x, y) => x - y);
  }

  /* ---------- 2. 문제·풀이 데이터 (원본 examData 그대로) ---------- */

  // 세 창(위: 원함수 · 가운데: 증감표 · 아래: 도함수). 세 창은 같은 축척(1:1)을 쓰므로 창 높이는 보여 줄 y 범위의 비율로 나눕니다.
  const BAND = 0.08;

  // aspect:'free' 장면(사차 개형)에서는 가로·세로 눈금 간격을 따로 정합니다(1:1 장면은 기본값 그대로).
  const niceInt = (raw) => [1, 2, 5, 10, 20, 50, 100].find((c) => c >= raw) || 200;
  function freeOpts(b) {

  // 장면 2(사차 개형)의 세로 창: γ에 따라 극값의 높이가 크게 변하므로 극대·극소가 모두 들어오도록(x축 포함) 창을 맞춥니다.
  function quarticWin(s) {
    const ys = [evalTop(2, s, -1), evalTop(2, s, gammaOf(s)), evalTop(2, s, 3)];
    const lo = Math.min(...ys, -1), hi = Math.max(...ys, 1), sp = hi - lo;
    const mb = 0.3 * sp + 0.6;
    // 휴대폰에서는 위쪽 수식 칩이 창의 윗부분을 가리므로 위 여유를 더 둡니다(극대 라벨이 칩 아래에 놓이도록).
    const narrow = window.matchMedia && window.matchMedia('(max-width: 859px)').matches;
    return [lo - mb, hi + (narrow ? 0.5 * (sp + mb) : 0.34 * sp + 0.6)];

  function quarticDWin(s) {
    let lo = 0, hi = 0;
    for (let i = 0; i <= 40; i++) { const y = evalBottom(2, s, -1 + (4 * i) / 40); lo = Math.min(lo, y); hi = Math.max(hi, y); }
    const sp = hi - lo;
    // 휴대폰에서는 아래 오른쪽의 도구 막대가 창 아래쪽을 가리므로, 도함수 창 아래에 여유를 더 둡니다.

    return [lo - (narrow ? 0.7 : 0.22) * sp - 0.4, hi + (narrow ? 0.45 : 0.22) * sp + 0.4];

  function shadeSign(b, fn, base) {

  function chartOf(m, s) {
    const sym = m === 4 ? 'h′' : m === 5 ? 'g′' : 'f′';
    const POS = { full: `${sym}(+) ↗ 증가`, short: '+ ↗', color: 'rose' };

    if (m === 2) {

      if (kind === 'left') return { roots: [{ x: -1, label: '극값 아님', color: 'violet' }, { x: 3, label: '극소', color: 'green' }], ints: [NEG, NEG, POS] };
      if (kind === 'right') return { roots: [{ x: -1, label: '극소', color: 'green' }, { x: 3, label: '극값 아님', color: 'violet' }], ints: [NEG, POS, POS] };
      return { roots: [{ x: -1, label: '극소', color: 'green' }, { x: g, label: '극대', color: 'rose' }, { x: 3, label: '극소', color: 'green' }], ints: [NEG, POS, NEG, POS] };
    }
    const eff = effDeltaOf(m, s);
    if (eff > effTolerance(m)) {

      return { roots: [{ x: 1 - h, label: '극대', color: 'rose' }, { x: 1 + h, label: '극소', color: 'green' }], ints: [POS, NEG, POS] };

    return { roots: [], ints: [{ full: `모든 실수에서 ${sym}(x) > 0  ⇒  전 구간 ↗ 증가 (극값 없음)`, short: '↗ 증가 (극값 없음)', color: 'rose' }] };

  function drawBand(b, s, m) {

    const cy = r.y + r.h / 2;

    c.beginPath(); c.moveTo(r.x, r.y + 0.5); c.lineTo(r.x + r.w, r.y + 0.5); c.stroke();

    const tw = (str) => { c.save(); c.font = `800 ${SZ * b.fs}px ${b.font}`; const w = c.measureText(str).width; c.restore(); return w; };
    if (s.step < 3) {

    const ch = chartOf(m, s);
    const P = ch.roots.map((q) => b.toS(q.x, 0).x);

    const onScreen = (px) => px >= r.x + 4 && px <= r.x + r.w - 4;
    const xs = [];
    // 정렬 배치가 가능한지: 근이 화면 안에 있는데 그 옆 구간에 부호 글자(짧은 꼴)가 들어갈 자리가 없으면 '극소극대극소'처럼 붙어 읽히므로
    // 아래의 '순서대로 늘어놓기' 배치로 바꿉니다. (x 위치와의 정렬은 위·아래 그림의 세로선이 대신 알려 줍니다.)
    let crowded = false;
    ch.ints.forEach((it, i) => {
      const lRoot = i > 0 ? P[i - 1] : null, rRoot = i < P.length ? P[i] : null;
      const left = lRoot == null ? r.x + 8 : lRoot + half[i - 1];
      const right = rRoot == null ? r.x + r.w - 8 : rRoot - half[i];
      const bothOn = (lRoot == null || onScreen(lRoot)) && (rRoot == null || onScreen(rRoot));
      if (bothOn && right - left < tw(it.short) + 6) crowded = true;
    });
    if (crowded) {
      const toks = [];
      ch.ints.forEach((it, i) => {
        toks.push({ txt: it.short, color: it.color });
        if (i < ch.roots.length) toks.push({ txt: ch.roots[i].label, color: ch.roots[i].color });
      });
      const GAP = 9;
      const total = toks.reduce((a, t) => a + tw(t.txt), 0) + GAP * (toks.length - 1);
      const on = P.filter(onScreen);
      const mid = on.length ? on.reduce((a, v) => a + v, 0) / on.length : r.x + r.w / 2;
      let x = clamp(mid - total / 2, r.x + 8, Math.max(r.x + 8, r.x + r.w - 8 - total));
      xs.push(x);
      toks.forEach((t) => {
        b.stext(x, cy, t.txt, { color: t.color, size: SZ, align: 'left', baseline: 'middle', weight: 800 });
        x += tw(t.txt) + GAP;
      });
    } else {
      ch.ints.forEach((it, i) => {
        const left = i === 0 ? r.x + 8 : P[i - 1] + half[i - 1];
        const right = i === P.length ? r.x + r.w - 8 : P[i] - half[i];
        const lo = Math.max(left, r.x + 6), hi = Math.min(right, r.x + r.w - 6);
        if (hi - lo < 14) return;
        const txt = tw(it.full) + 10 <= hi - lo ? it.full : it.short;
        const w = tw(txt);
        const cx = (lo + hi) / 2;
        b.stext(cx, cy, txt, { color: it.color, size: SZ, align: 'center', baseline: 'middle', weight: 800 });
        xs.push(cx - w / 2);
      });
      ch.roots.forEach((q, i) => {
        if (!onScreen(P[i])) return;
        b.stext(P[i], cy, q.label, { color: q.color, size: SZ, align: 'center', baseline: 'middle', weight: 800 });
        xs.push(P[i] - half[i]);
      });
    }
    if (!xs.length || Math.min(...xs) > 78) b.stext(r.x + 10, cy, '증감표', { color: 'amber', size: 11, align: 'left', baseline: 'middle', weight: 800 });
  }

  // 위·가운데·아래를 가로지르는 영점 동기화 세로선 (Step 1)
  function syncLines(b, s, m) {
    const lines = [];
    if (m === 2) [-1.0, gammaOf(s), 3.0].forEach((x) => lines.push({ x, color: 'amber', alpha: 0.5 }));
    else {
      lines.push({ x: 1.0, color: 'violet', alpha: 0.5 });
      const eff = effDeltaOf(m, s);
      if (eff > effTolerance(m)) {
        const h = Math.sqrt(eff);
        lines.push({ x: 1.0 - h, color: 'rose', alpha: 0.6 }, { x: 1.0 + h, color: 'green', alpha: 0.6 });
      }
    }
    ['main', 'band', 'deriv'].forEach((id) => {
      if (id === 'band' && !s.chart) return;
      inPane(b, id, () => lines.forEach((l) => b.vline(l.x, { color: l.color, alpha: l.alpha, width: 1.5, dash: true })));
    });
  }

  /* ---------- 4. 장면 공통 그리기 ---------- */
  const dragBeta = (s) => (w) => { const dist = Math.abs(w.x - 1.0); s.delta = dist < 0.12 ? 0.0 : Math.min(2.0, +(dist * dist).toFixed(2)); };
  const dragVertex = (s) => (w) => { let d = -w.y / 3; if (Math.abs(d) < 0.04) d = 0; s.delta = clamp(+d.toFixed(2), -0.6, 2.0); };
  const dragGamma = (s) => (w) => {
    let lam = (w.x - (-1.0)) / 4.0;
    if (Math.abs(lam) < 0.04) lam = 0.0; else if (Math.abs(lam - 0.5) < 0.04) lam = 0.5; else if (Math.abs(lam - 1.0) < 0.04) lam = 1.0;
    s.lam = clamp(+lam.toFixed(2), 0.0, 1.0);
  };
  const dragK = (s) => (w) => { let k = w.y; if (Math.abs(k - (-3.0)) < 0.18) k = -3.0; s.k = clamp(+k.toFixed(2), -4.0, 2.0); };
  const dragPin = (s) => (w) => { s.a = clamp(+w.x.toFixed(2), -1.5, 3.2); };

  // 위쪽 수식 칩(떠 있는 상자)이 가리는 영역 — drawScene 이 그릴 때마다 갱신합니다.
  let chipBox = null;
  function readChipBox(b, lab) {
    chipBox = null;
    if (b.thumb || !lab || !lab.ui) return;
    const el = lab.ui.chips.firstElementChild;
    if (!el) return;
    const cr = b.canvas.getBoundingClientRect(), r = el.getBoundingClientRect();
    chipBox = { x0: r.left - cr.left, x1: r.right - cr.left, y1: r.bottom - cr.top };
  }
  // 창 밖으로 나간 점은 그리지 않고, 라벨이 창 위·아래 가장자리나 위쪽 수식 칩에 닿으면 점의 반대쪽으로 뒤집어 잘리거나 가려지지 않게 합니다.
  function mark(b, id, x, y, o) {
    const r = b.paneRect(id), p = b.toS(x, y);
    if (p.x < r.x - 6 || p.x > r.x + r.w + 6 || p.y < r.y - 6 || p.y > r.y + r.h + 6) return;
    if (chipBox && id === 'main' && p.y < chipBox.y1 + 2 && p.x > chipBox.x0 - 6 && p.x < chipBox.x1 + 6) return; // 수식 칩 밑에 가려진 점은 그리지 않음
    if (o.label && o.dy) {
      const ly = p.y + o.dy;
      const underChip = chipBox && id === 'main' && ly < chipBox.y1 + 4 && p.x > chipBox.x0 - 70 && p.x < chipBox.x1 + 70;
      if (o.dy < 0 && (ly < r.y + 8 || underChip)) o = { ...o, dy: -o.dy };
      else if (o.dy > 0 && ly > r.y + r.h - 8) o = { ...o, dy: -o.dy };
    }
    b.point([x, y], o);
  }

  function topMarks(b, s, m) {
    b.use('main');
    const f = (x) => evalTop(m, s, x);
    if (m === 2) {
      const kind = quarticCase(s), g = gammaOf(s);
      const L = (x) => `(${fmt(x, 0)}, ${fmt(f(x), 1)})`;
      // 점끼리 가까워도 라벨이 겹치지 않게: 왼쪽 점은 왼쪽 아래, 오른쪽 점은 오른쪽 아래, 극대는 위에 둡니다.
      if (kind === 'left') {
        mark(b, 'main', -1, f(-1), { color: 'violet', r: 6.5, label: `극값 아님${L(-1)}`, dx: -10, dy: -14, align: 'right' });
        mark(b, 'main', 3, f(3), { color: 'green', r: 6.5, label: `극소${L(3)}`, dx: 10, dy: 18, align: 'left' });
      } else if (kind === 'right') {
        mark(b, 'main', -1, f(-1), { color: 'green', r: 6.5, label: `극소${L(-1)}`, dx: -10, dy: 18, align: 'right' });
        mark(b, 'main', 3, f(3), { color: 'violet', r: 6.5, label: `극값 아님${L(3)}`, dx: 10, dy: -14, align: 'left' });
      } else {
        // 극대가 어느 한쪽 극소에 가까우면 극대 라벨을 반대쪽(안쪽)으로 비껴 두어 극소 라벨과 겹치지 않게 합니다.
        const pxL = b.toS(-1, 0).x, pxG = b.toS(g, 0).x, pxR = b.toS(3, 0).x;
        const nearL = pxG - pxL < 130, nearR = pxR - pxG < 130;
        mark(b, 'main', -1, f(-1), { color: 'green', r: 6, label: `극소${L(-1)}`, dx: -10, dy: 18, align: 'right' });
        mark(b, 'main', g, f(g), { color: 'rose', r: 6.5, label: `극대 (x=γ≈${fmt(g, 4)}, y≈${fmt(f(g), 2)})`, dx: nearL ? 12 : nearR ? -12 : 0, dy: -18, align: nearL ? 'left' : nearR ? 'right' : 'center' });
        mark(b, 'main', 3, f(3), { color: 'green', r: 6, label: `극소${L(3)}`, dx: 10, dy: 18, align: 'left' });
      }
      return;
    }
    const eff = effDeltaOf(m, s);
    const rootsShown = m === 3 && s.step >= 2; // 장면 3 Step 2 에서는 변곡점 자리에 실근 x₂ 가 겹치므로 라벨을 실근 쪽에 맡김
    const rts = rootsShown ? solveCubicRoots(1, 0, -3 * s.delta, s.C) : [];
    // 극값이 x축 가까이 있고 그 근처에 실근 라벨(x축 위·아래 약 20px)이 있으면, 극값 라벨을 실근 라벨보다 바깥 줄로 밀어 겹치지 않게 합니다(극소 = 0 이면 실근 x₂ 가 극소점과 같은 자리).
    const extDy = (x, y, dy) => {
      if (!rts.some((u) => Math.abs(b.toS(u + 1.0, 0).x - b.toS(x, 0).x) < 150)) return dy;
      const p = b.toS(x, y), ay = b.toS(0, 0).y;
      return dy > 0 ? Math.max(dy, ay + 44 - p.y) : Math.min(dy, ay - 42 - p.y);
    };
    mark(b, 'main', 1, f(1), { color: 'violet', r: 5.5, label: rootsShown ? '' : `${m === 4 ? 'h′' : m === 5 ? 'g′' : 'f′'}(x)가 극소인 점(1, ${fmt(f(1), 1)})`, dx: 12, dy: -12 });
    if (eff > effTolerance(m)) {
      const h = Math.sqrt(eff);
      mark(b, 'main', 1 - h, f(1 - h), { color: 'rose', r: 6.5, label: `극대(${fmt(1 - h)}, ${fmt(f(1 - h))})`, dx: 0, dy: extDy(1 - h, f(1 - h), -18), align: 'center', ref: 'root' });
      mark(b, 'main', 1 + h, f(1 + h), { color: 'green', r: 6.5, label: `극소(${fmt(1 + h)}, ${fmt(f(1 + h))})`, dx: 0, dy: extDy(1 + h, f(1 + h), 20), align: 'center', ref: 'root' });
    }
    // 장면 3 Step 2 : 방정식 f(x) = 0 의 실근(x절편)
    if (rootsShown) {
      rts.forEach((u, idx) => {
        const rx = u + 1.0;
        const side = rts.length === 3 ? [-1, 0, 1][idx] : 0; // 왼쪽·가운데·오른쪽 근의 라벨을 서로 다른 쪽에 둡니다
        mark(b, 'main', rx, 0, { color: 'amber', r: 6, label: `x${['₁', '₂', '₃'][idx] || ''}=${fmt(rx)}`, dx: 8 * side, dy: side === 0 ? 20 : -14, align: side === 0 ? 'center' : side < 0 ? 'right' : 'left' });
      });
    }
    // 장면 5 : 정적분 아래끝 a 에 꽂힌 핀 g(a) = 0
    if (m === 5) b.handle('pin', [s.a, 0], { color: 'amber', r: 7.5, label: `g(${fmt(s.a)})=0 인 점`, dx: -12, dy: -14, align: 'right', ref: 'pin', drag: dragPin(s) });
  }

  function bottomMarks(b, s, m) {
    b.use('deriv');
    if (m === 2) {
      const g = gammaOf(s);
      mark(b, 'deriv', -1, 0, { color: 'green', r: 5.5, label: 'α=−1', dx: -8, dy: -12, align: 'right' });
      mark(b, 'deriv', 3, 0, { color: 'green', r: 5.5, label: 'β=3', dx: 8, dy: -12 });
      // γ 라벨은 보통 점 위에 두되(휴대폰의 도구 막대가 아래 오른쪽을 가림), α 가까이에서는 α 라벨과 겹치지 않게 아래에 둡니다.
      const gNearA = b.toS(g, 0).x - b.toS(-1, 0).x < 130, gNearB = b.toS(3, 0).x - b.toS(g, 0).x < 70;
      b.handle('gamma', [g, 0], { color: 'amber', r: 7.5, ref: 'root', label: `γ=${fmt(g)}`, dx: gNearB ? -12 : 0, dy: gNearA ? 22 : -22, align: gNearB ? 'right' : 'center', drag: dragGamma(s) });
      return;
    }
    const eff = effDeltaOf(m, s);
    const yRef = m === 4 ? s.k : 0;
    if (eff > effTolerance(m)) {
      const h = Math.sqrt(eff);
      mark(b, 'deriv', 1 - h, yRef, { color: 'rose', r: 6, label: `α=${fmt(1 - h)}`, dx: -8, dy: -12, align: 'right', ref: 'root' });
      if (m === 4) mark(b, 'deriv', 1 + h, yRef, { color: 'green', r: 6, label: `β=${fmt(1 + h)}`, dx: 8, dy: -12, ref: 'root' });
      else b.handle('beta', [1 + h, 0], { color: 'amber', r: 7.5, ref: 'root', label: `β=${fmt(1 + h)}`, dx: 8, dy: -12, drag: dragBeta(s) });
    } else if (Math.abs(eff) <= effTolerance(m)) {
      if (m === 4) mark(b, 'deriv', 1, yRef, { color: 'violet', r: 7.5, label: '접하는 점 x=1', dx: 0, dy: -22, align: 'center', ref: 'root' });
      else b.handle('beta', [1, 0], { color: 'violet', r: 7.5, ref: 'root', label: '중근 x=1 (x축에 접함: 부호 불변)', dx: 0, dy: 24, align: 'center', drag: dragBeta(s) });
    } else if (m !== 4) {
      b.handle('vtx', [1, -3 * eff], { color: 'amber', r: 7, label: 'x축과 만나지 않음 (허근)', dx: 0, dy: -18, align: 'center', drag: dragVertex(s) });
    }
    if (m === 4) b.handle('k', [2.5, s.k], { color: 'violet', r: 7, ref: 'k', label: `k = ${fmt(s.k)}`, dx: 12, dy: -14, drag: dragK(s) });
  }

  function drawScene(b, s, m, lab) {
    quiet(b);
    readChipBox(b, lab);
    const f = (x) => evalTop(m, s, x);
    const fd = (x) => evalBottom(m, s, x);
    // 1) 위: 원함수
    inPane(b, 'main', () => {
      const fo = freeOpts(b);
      if (s.grid) b.grid(fo.grid);
      b.axes({ ...fo.axes, yLabel: m === 5 ? 'g' : 'y' });
      b.plot(f, { color: 'ink', width: 3.2, glow: true, ref: 'F' });
    });
    // 2) 아래: 도함수
    b.use('deriv');
    const r = b.paneRect('deriv');
    const c = b.ctx;
    c.save();
    c.fillStyle = b.color('halo', 0.35);
    c.fillRect(r.x, r.y, r.w, r.h);
    c.restore();
    inPane(b, 'deriv', () => {
      const fo = freeOpts(b);
      if (s.grid) b.grid(fo.grid);
      b.axes({ ...fo.axes, yLabel: m === 5 ? 'f' : "y′" });
      if (s.step >= 2) shadeSign(b, fd, m === 4 ? s.k : 0);
      if (m === 4) b.hline(s.k, { color: 'violet', width: 2.6, glow: true, ref: 'k' });
      b.plot(fd, { color: 'sky', width: 3, glow: true, ref: 'F' });
    });
    if (!s.chart) {
      c.save();
      c.strokeStyle = b.color('sky', 0.55);
      c.lineWidth = 1.5;
      c.beginPath(); c.moveTo(r.x, r.y + 0.5); c.lineTo(r.x + r.w, r.y + 0.5); c.stroke();
      c.restore();
    }
    const dt = m === 4 ? '도함수 f′(x) 와 직선 g′(x) = k' : m === 5 ? '피적분함수 f(t) = g′(x)' : '도함수 y = f′(x)';
    b.stext(r.x + 12, r.y + (s.chart ? 16 : 18), dt, { color: 'sky', size: 12, align: 'left', weight: 800 });
    // 3) 가운데: 증감표
    drawBand(b, s, m);
    // 4) 영점 동기화 세로선
    if (s.step >= 1) syncLines(b, s, m);
    // 5) 점·손잡이·라벨
    topMarks(b, s, m);
    bottomMarks(b, s, m);
    b.use('main'); // 끌기 계산은 마지막으로 쓴 창을 기준으로 하므로 첫 창으로 되돌립니다
  }

  /* ---------- 5. 실시간 값(view) ---------- */
  function viewOf(m) {
    return (s) => {
      const v = {};
      if (m === 2) {
        const kind = quarticCase(s), g = gammaOf(s), dbl = kind !== 'three';
        v.chips = [
          { k: '함수', tex: 'y = f(x) \\; (\\text{사차함수})', color: 'ink' },
          { k: '도함수', tex: "f'(x)=0.8(x+1)(x-\\gamma)(x-3),\\quad \\gamma=-1+4\\lambda", color: 'sky' }
        ];
        v.status = dbl ? { tone: 'key', text: '도함수의 중근 (극댓값 없음)' } : { tone: 'ok', text: '서로 다른 세 실근 (극값 3개)' };
        v.alert = dbl ? { tone: 'key', text: "삼차 도함수 f'(x)가 중근을 가져 부호가 바뀌지 않으므로 사차함수의 극댓값이 사라지고 그 점은 극값이 아니게 되었습니다!" } : null;
        v.readouts = [
          { label: '도함수 부호 변화', value: kind === 'left' ? '− → 0(부호 불변) → − → 0 → +' : kind === 'right' ? '− → 0 → + → 0(부호 불변) → +' : '− → + → − → + (3번 교차)', color: 'amber', ref: 'root' },
          { label: dbl ? '양 끝 도함수 영점에서의 높이' : '양 끝 극소점의 높이', value: `f(−1)≈${fmt(evalTop(2, s, -1), 2)} | f(3)≈${fmt(evalTop(2, s, 3), 2)}`, color: 'green', ref: 'F' },
          { label: dbl ? '중근 위치 γ (극값 아님)' : '극대 위치 γ와 높이', value: `γ≈${fmt(g, 4)}, f(γ)≈${fmt(evalTop(2, s, g), 2)}`, color: dbl ? 'violet' : 'rose', ref: 'root' },
          { label: '극값 개수', value: dbl ? '극값 1개 (극소만 존재)' : '극값 3개 (극소2 · 극대1)', color: 'violet' }
        ];
        v.tape = s.step >= 3 ? { title: dbl ? `삼차 도함수가 중근을 가짐(λ=${fmt(s.lam)}) ⇒ 사차함수의 극댓값이 없음` : `삼차 도함수 서로 다른 세 실근(λ=${fmt(s.lam)}) ⇒ 사차함수의 극소 2개 · 극대 1개` } : null;
        return v;
      }
      const eff = effDeltaOf(m, s);
      const f = (x) => evalTop(m, s, x);
      v.chips = [
        { k: m === 5 ? '정적분으로 정의된 함수' : m === 4 ? '두 함수의 차' : '함수', tex: m === 5 ? `g(x) = \\int_{${asc(s.a)}}^{x} f(t)\\,dt` : m === 4 ? `h(x) = f(x) - g(x) = (x-1)^3 ${sg(-(3 + s.k))}(x-1)` : `f(x) = (x-1)^3 ${sg(-3 * s.delta)}(x-1) ${sg(s.C)}`, color: 'ink' },
        { k: '도함수', tex: m === 4 ? `f'(x) = 3(x-1)^2 - 3, \\; g'(x) = ${asc(s.k)}` : m === 5 ? `g'(x) = f(x) = 3(x-1)^2 ${sg(-3 * s.delta)}` : `f'(x) = 3(x-1)^2 ${sg(-3 * s.delta)}`, color: 'sky' }
      ];
      if (eff > effTolerance(m)) {
        const hV = Math.sqrt(eff);
        const yMax = f(1.0 - hV), yMin = f(1.0 + hV), prod = yMax * yMin;
        const rCnt = m === 3 ? solveCubicRoots(1, 0, -3 * s.delta, s.C).length : prod < -1e-9 ? 3 : (Math.abs(prod) <= 1e-9 ? 2 : 1);
        v.status = { tone: 'ok', text: '도함수가 x축과 두 점에서 만남 (극대·극소 있음)' };
        v.readouts = [
          { label: '도함수 부호 변화', value: '+ → 0 → − → 0 → +', color: 'amber', ref: 'root' },
          { label: '극댓값 / 극솟값', value: `극대=${fmt(yMax, 1)} | 극소=${fmt(yMin, 1)}`, color: 'rose', ref: 'F' },

      cxTag(b, [v.p, 0], `γ=${cxN(v.r)} → 극소 x=${cxN(v.p)}`, { color: 'green', size: 12, dx: -12, dy: 38, align: 'right', ref: 'g2' });
    }
  }

  /* ===== 변형 3 · 극댓값과 극솟값 사이에 −C 가 있을 때만 서로 다른 세 실근 ===== */
  function mkD3(first, a, x1) {
    const x2 = x1 + 2, F = (x) => a * (x * x * x - 3 * (x1 + 1) * x * x + 3 * x1 * (x1 + 2) * x), M = F(x1), m = F(x2);
    const co = [a, -3 * a * (x1 + 1), 3 * a * x1 * (x1 + 2)];
    return { first, a, x1, x2, F, M, m, co, win: { x: [x1 - 2.4, x2 + 2.4], y: [m - 0.28 * (M - m) - 1.0, M + 0.28 * (M - m) + 1.0] } };
  }
  const varD3 = cxVarier((prev) => {
    if (!prev) return Object.assign(mkD3(true, 1, 0), { win: { x: [-1.2, 3.2], y: [-5.2, 5.8] } });
    let v; do { v = mkD3(false, cxPick([1, 1, 2]), cxPick([-3, -2, -1, 0, 1, 2, 3])); } while (v.a === prev.a && v.x1 === prev.x1);
    return v;
  });
  const eq3 = (v) => `${cxPoly([v.a, v.co[1], v.co[2], 0])}+C`;
  const text3 = (v) => (v.first ? examData[3].question() : `삼차방정식 ${tex(`${eq3(v)} = 0`)} 이 서로 다른 세 실근을 갖도록 하는 상수 ${tex('C')}의 값의 범위와, 중근과 다른 한 실근(총 2개의 실근)을 갖도록 하는 ${tex('C')}의 값을 구하시오.`);
  const ans3 = (v) => (v.first ? examData[3].answerBadge() : `세 실근: ${tex(`${-v.M} < C < ${-v.m}`)} / 두 실근: ${tex(`C = ${-v.M}, \\; ${-v.m}`)}`);
  const steps3 = (v) => (v.first ? examData[3].steps : [
    `1단계 · F(x)=${dsU(cxPoly([v.a, v.co[1], v.co[2], 0]))}+C를 미분하여 극대 x=${v.x1}, 극소 x=${v.x2}를 찾습니다.`,
    '2단계 · 두 극값 F(' + v.x1 + '), F(' + v.x2 + ')를 계산하고, 삼차함수의 양 끝의 방향과 함께 x축과의 위치를 표시합니다.',
    '3단계 · 극값 사이에서 x축과 세 번 만나는 경우와, 극값에서 x축에 접하는 경계의 C를 구별합니다.']);
  const std3 = (v) => {
    if (v.first) return examData[3].textbook();
    return {
      steps: `① ${tex(`f(x) = ${eq3(v)}`)} 로 두고 미분: ${tex(`f'(x) = ${cxPoly([3 * v.a, 2 * v.co[1], v.co[2]])} = ${v.a === 1 ? '3' : '6'}${dsXt(v.x1)}${dsXt(v.x2)} = 0`)}<br/>
② 극댓값 ${tex(`f(${v.x1}) = ${v.M} + C`)}, 극솟값 ${tex(`f(${v.x2}) = ${v.m} + C`)} 계산<br/>
③ 서로 다른 세 실근을 가질 조건 ${tex(`f(${v.x1})f(${v.x2}) < 0`)} 부등식 풀이:<br/>
&nbsp;&nbsp;${tex(`(C${cxPl(v.M)})(C${cxPl(v.m)}) < 0 \\implies ${-v.M} < C < ${-v.m}`)}<br/>
④ 중근을 가질 조건 ${tex(`f(${v.x1})f(${v.x2}) = 0 \\implies C = ${-v.M}`)} 또는 ${tex(`C = ${-v.m}`)} 입니다.`,
      warning: examData[3].textbook().warning
    };
  };
  const quick3 = (v) => {
    if (v.first) return examData[3].shortcut();
    return {
      steps: `① 극댓값과 극솟값의 높이 차(= 도함수 ${tex(`${v.a === 1 ? '3' : '6'}${dsXt(v.x1)}${dsXt(v.x2)}`)} 와 ${tex('x')}축 사이의 넓이)는 <strong class="text-sky-300">${tex(`\\Delta y = ${v.M - v.m}`)}</strong> 이고, ${tex(`C = ${-v.M}`)} 일 때 극대점 ${tex(`x = ${v.x1}`)} 에서 ${tex('x')}축에 접합니다(극댓값 0, 극솟값 ${-(v.M - v.m)}).<br/>
② 따라서 그래프를 위로 ${tex(`${-v.M}`)}보다 크고 ${tex(`${-v.m}`)}보다 작게 올릴 때, 즉 ${tex('x')}축이 극댓값과 극솟값 사이에 있을 때만 세 점에서 만납니다.<br/>
③ 따라서 <strong class="text-amber-300">세 실근: ${tex(`${-v.M} < C < ${-v.m}`)}</strong>, <strong class="text-pink-300">중근(접함): ${tex(`C = ${-v.M}, \\; ${-v.m}`)}</strong> 입니다.`,
      highlight: examData[3].shortcut().highlight
    };
  };
  function draw3(b, s, lab) {
    const v = varD3.cur(), st = dsStepNow(lab, s), F = v.F;
    cxFocus(b, 'd3v' + v.sid, v.win);
    if (s.grid) b.grid();
    b.axes();
    const vb = b.viewBox();
    if (st >= 3) {
      b.poly([[vb.x0, v.m], [vb.x1, v.m], [vb.x1, v.M], [vb.x0, v.M]], { fill: 'green', fillAlpha: 0.14, color: null, ref: 'band' });
    }
    if (st >= 2) {
      [v.M, v.m].forEach((y) => b.hline(y, { color: 'violet', width: 1.8, dash: true, ref: 'ext' }));
    }
    b.plot(F, { color: 'ink', width: 3.2, glow: true });
    cxCurveTag(b, F, dsU(`y = ${cxPoly([v.a, v.co[1], v.co[2], 0])}`), 'ink', { side: 'left', dy: 14, skip: [[v.x1, v.M, 1.6], [v.x2, v.m, 1.6]], axis: 0.8 });
    if (st >= 1) {
      b.point([v.x1, v.M], { color: 'rose', r: 6, ref: 'ext', label: `x = ${cxN(v.x1)} (극대)`, dx: -10, dy: -13, align: 'right' });
      b.point([v.x2, v.m], { color: 'green', r: 6, ref: 'ext', label: `x = ${cxN(v.x2)} (극소)`, dx: 10, dy: 17 });
    }
    if (st >= 2) {
      cxTag(b, [(v.x1 + v.x2) / 2, v.M], `y = ${cxN(v.M)}`, { color: 'violet', size: 12, align: 'center', dy: -11, ref: 'ext' });
      cxTag(b, [(v.x1 + v.x2) / 2, v.m], `y = ${cxN(v.m)}`, { color: 'violet', size: 12, align: 'center', dy: 15, ref: 'ext' });
    }
    if (st >= 3) {
      b.stext(12, 18, `y = −C 가 초록 띠 안이면 세 실근: ${cxN(-v.M)} < C < ${cxN(-v.m)}`, { color: 'green', size: 12.5, align: 'left', ref: 'band' });
      b.stext(12, 36, `띠의 경계(C = ${cxN(-v.M)}, ${cxN(-v.m)})에서는 두 실근`, { color: 'violet', size: 12.5, align: 'left', ref: 'ext' });
    }
  }

  /* ===== 변형 4 · 도함수의 그래프와 직선 g′ = k 가 접할 때 ===== */
  const DS4 = [[1, -1], [1, 1], [2, -1], [1, 2], [-1, 1], [-1, -1], [2, 1], [1, -2]];
  function mkD4(first, a, c, e) {
    const fp = (x) => 3 * a * (x - c) * (x - c) + e;
    const lo = a > 0 ? e - 2.2 : e - 7, hi = a > 0 ? e + 7 : e + 2.2;
    const w = Math.sqrt(6.5 / (3 * Math.abs(a)));
    return { first, a, c, e, fp, win: { x: [c - w - 0.6, c + w + 0.6], y: [Math.min(lo, -1), Math.max(hi, 1)] } };
  }
  const varD4 = cxVarier((prev) => {
    if (!prev) return Object.assign(mkD4(true, 1, 1, -3), { win: { x: [-0.6, 2.9], y: [-4.4, 5.2] } });
    let v; do { const [a, e] = cxPick(DS4); v = mkD4(false, a, cxPick([-1, 0, 1, 2]), e); } while (v.a === prev.a && v.c === prev.c && v.e === prev.e);
    return v;
  });
  const fpTex4 = (v) => `f'(x) = ${dsKs(v.a)}${dsXt(v.c)}^2${v.e === 0 ? '' : cxPl(v.e)}`;
  const text4 = (v) => (v.first ? examData[4].question() : `삼차함수 ${tex('f(x)')}의 도함수 ${tex(fpTex4(v))} 과 일차함수 ${tex('g(x)')}의 도함수 ${tex("g'(x) = k")} 의 그래프가 오직 한 점에서 만나도록(접하도록) 하는 상수 ${tex('k')}의 값과, 그때 함수 ${tex('h(x) = f(x) - g(x)')} 의 극값의 개수를 구하시오.`);
  const ans4 = (v) => (v.first ? examData[4].answerBadge() : `${tex(`k = ${v.e}`)}, ${tex('h(x)')}의 극값은 ${tex('0')}개 (항상 ${v.a > 0 ? '증가' : '감소'})`);
  const steps4 = (v) => (v.first ? examData[4].steps : [
    '1단계 · h=f−g에서 h′=f′−g′를 세우고, 포물선 f′와 수평선 g′=k의 상대적인 위치를 봅니다.',
    '2단계 · 두 그래프가 한 점에서 접할 때 포물선의 꼭짓점의 높이를 k의 조건으로 연결합니다.',
    '3단계 · 접점 양쪽에서 h′의 부호가 바뀌는지 살펴 h의 극값의 개수를 판단합니다.']);
  const std4 = (v) => {
    if (v.first) return examData[4].textbook();
    return {
      steps: `① ${tex('h(x) = f(x) - g(x)')} 로 두면 ${tex(`h'(x) = f'(x) - g'(x) = ${dsKs(v.a)}${dsXt(v.c)}^2${v.e === 0 ? '' : cxPl(v.e)} - k`)}<br/>
② 두 도함수의 그래프가 한 점에서 접하려면 판별식 ${tex('D = 0')} 이어야 하므로 ${tex(`${v.e} - k = 0 \\implies k = ${v.e}`)}<br/>
③ 이때 ${tex(`h'(x) = ${dsKs(v.a)}${dsXt(v.c)}^2 ${v.a > 0 ? '\\ge' : '\\le'} 0`)} 이므로 모든 실수에서 ${v.a > 0 ? '증가' : '감소'}하여 극값을 갖지 않습니다.`,
      warning: examData[4].textbook().warning
    };
  };
  const quick4 = (v) => {
    if (v.first) return examData[4].shortcut();
    return {
      steps: `① ${tex("h'(x) = f'(x) - g'(x)")} 이므로, 도함수의 그래프에서 직선 ${tex("y = g'(x)")} 를 <strong class="text-purple-300">기준</strong>으로 ${tex("f'(x)")} 의 그래프를 봅니다.<br/>
② ${tex("f'(x)")}가 ${tex("g'(x)")}보다 위에 있으면 ${tex("h'(x) > 0")} (증가↗), 아래에 있으면 ${tex("h'(x) < 0")} (감소↘)입니다.<br/>
③ 꼭짓점의 높이 <strong class="text-amber-300">${tex(`k = ${v.e}`)}</strong> 에서 접하면 ${tex("h'(x)")} 의 부호가 ${v.a > 0 ? tex('(+) \\to 0 \\to (+)') : tex('(-) \\to 0 \\to (-)')} 로 바뀌지 않으므로 ${tex('h(x)')}는 <strong class="text-emerald-300">극값이 0개</strong>입니다.`,
      highlight: examData[4].shortcut().highlight
    };
  };
  function draw4(b, s, lab) {
    const v = varD4.cur(), st = dsStepNow(lab, s), fp = v.fp;
    cxFocus(b, 'd4v' + v.sid, v.win);
    if (s.grid) b.grid();
    b.axes({ yLabel: "y′" });
    const vb = b.viewBox();
    if (st >= 1) {
      const d = v.a > 0 ? 1.4 : -1.4;
      [[v.e + d, '교점 2개', 'muted'], [v.e - d, '교점 0개', 'muted']].forEach(([y, t, col]) => {
        b.hline(y, { color: col, width: 1.6, dash: true, ref: 'k0' });
        cxTag(b, [v.c + 1.3, y], t, { color: col, size: 12, align: 'center', dy: -10, ref: 'k0' });
      });
    }
    if (st >= 2) b.hline(v.e, { color: 'violet', width: 2.8, glow: true, ref: 'k' });
    b.plot(fp, { color: 'sky', width: 3, glow: true, ref: 'F' });
    cxCurveTag(b, fp, "y = f′(x)", 'sky', { side: 'left', dy: v.a > 0 ? -13 : 15, skip: [[v.c, v.e, 1.8]], axis: 0.8 });
    if (st >= 2) {
      b.point([v.c, v.e], { color: 'amber', r: 6, ref: 'k', label: `꼭짓점 (${cxN(v.c)}, ${cxN(v.e)})`, dx: 11, dy: v.a > 0 ? 17 : -14 });
      cxTag(b, [vb.x0 + 0.1, v.e], `y = k = ${cxN(v.e)}`, { color: 'violet', size: 12.5, align: 'left', dy: v.a > 0 ? 15 : -11, ref: 'k' });
    }
    if (st >= 3) b.stext(12, 18, `h′ = f′ − g′ ${v.a > 0 ? '≥' : '≤'} 0 : 부호가 바뀌지 않음 → 극값 0개`, { color: 'green', size: 12.5, align: 'left', ref: 'k' });
  }

  /* ===== 변형 5 · g(x)=∫ₐˣ f(t)dt 의 극솟값이 0 이 되는 a ===== */
  function mkD5(first, p) {
    const r = p + 2, s2 = p - 1;       // f(x)=3(x−p)(x−r): g 는 x=r 에서 극소, g(r)=0 이면 a = r 또는 a = p−1
    const F = (x) => x * x * x - 3 * (p + 1) * x * x + 3 * p * (p + 2) * x;
    const g = (x) => F(x) - F(r), fp = (x) => 3 * (x - p) * (x - r);
    const M = g(p);
    const x0 = Math.min(s2, p) - 1.7, x1 = r + 1.7;
    return { first, p, r, s2, g, fp, M, win: { x: [x0, x1], y: [-3.4, M + 1.8] }, dwin: [-3 - 1.2, 2.2 + 0.5 * 3] };
  }
  const varD5 = cxVarier((prev) => {
    if (!prev) return Object.assign(mkD5(true, 0), { win: { x: [-1.8, 3.5], y: [-3.2, 6.6] }, dwin: [-5.0, 1.8] });
    let v; do { v = mkD5(false, cxPick([-3, -2, -1, 0, 1, 2])); } while (v.p === prev.p);
    return v;
  });
  const fTex5 = (v) => `f(x) = 3${dsXt(v.p)}${dsXt(v.r)}`;
  const text5 = (v) => (v.first ? examData[5].question() : `이차함수 ${tex(fTex5(v))} 에 대하여 함수 ${tex('g(x) = \\displaystyle\\int_{a}^{x} f(t)\\,dt')} 가 극솟값 ${tex('0')}을 갖도록(즉 ${tex('x')}축에 극소점이 접하도록) 하는 모든 상수 ${tex('a')}의 값을 구하시오.`);
  const ans5 = (v) => (v.first ? examData[5].answerBadge() : `${tex(`a = ${v.r}`)} (극소점) 또는 ${tex(`a = ${v.s2}`)} (x축과 다시 만나는 점)`);
  const steps5 = (v) => (v.first ? examData[5].steps : [
    `1단계 · g(x)=∫ₐˣ3${dsXm(v.p).replace(/x/g, 't')}${dsXm(v.r).replace(/x/g, 't')}dt에서 g′(x)=3${dsXm(v.p)}${dsXm(v.r)}와 g(a)=0을 표시합니다.`,
    `2단계 · x=${v.p}, ${v.r}의 양쪽에서 피적분함수의 부호를 살펴 g의 극대·극소 위치를 찾습니다.`,
    `3단계 · g(${v.r})=0 조건을 ∫ₐ${v.r}3${dsXm(v.p).replace(/x/g, 't')}${dsXm(v.r).replace(/x/g, 't')}dt=0으로 바꾸어 아래끝 a를 구합니다.`]);
  const std5 = (v) => {
    if (v.first) return examData[5].textbook();
    const c2 = 3 * (v.p + 1), c1 = 3 * v.p * (v.p + 2), Fr = v.r * v.r * v.r - c2 * v.r * v.r + c1 * v.r, Fx = cxPoly([1, -c2, c1, 0]);
    return {
      steps: `① ${tex(`g(x) = \\displaystyle\\int_{a}^{x} (${cxPoly([3, -2 * c2, c1]).replace(/x/g, 't')})\\,dt = \\left[ ${Fx.replace(/x/g, 't')} \\right]_{a}^{x} = F(x) - F(a)`)} (${tex(`F(x) = ${Fx}`)})<br/>
② ${tex(`g'(x) = ${fTex5(v).slice(7)} = 0`)} 에서 ${tex(`x = ${v.r}`)} 일 때 극솟값을 가짐<br/>
③ 극솟값 ${tex(`g(${v.r}) = 0`)} 조건 대입:<br/>
&nbsp;&nbsp;${tex(`F(${v.r}) - F(a) = 0 \\implies ${cxPoly([1, -c2, c1, -Fr]).replace(/x/g, 'a')} = 0`)}<br/>
④ 인수분해: ${tex(`(a ${cxSub(v.r)})^2(a ${cxSub(v.s2)}) = 0 \\implies a = ${v.r}, \\; ${v.s2}`)} 입니다.`,
      warning: examData[5].textbook().warning
    };
  };
  const quick5 = (v) => {
    if (v.first) return examData[5].shortcut();
    return {
      steps: `① <strong>[정적분으로 정의된 함수의 성질]</strong> <strong class="text-pink-300">① ${tex('g(a)=0')}이므로 점 ${tex('(a,0)')}는 그래프 위에 있음</strong> (통과인지 접하는지는 도함수 부호로 따로 판단), <strong class="text-sky-300">② ${tex("g'(x)=f(x)")}</strong><br/>
② ${tex(`g'(x) = ${fTex5(v).slice(7)}`)} 이므로 ${tex('g(x)')}는 ${tex(`x=${v.p}`)} 에서 극대, ${tex(`x=${v.r}`)} 에서 극소인 삼차함수입니다.<br/>
③ 극솟값 ${tex(`g(${v.r}) = 0`)} 이란 <strong>극소점 ${tex(`x=${v.r}`)}에서 ${tex('x')}축에 접한다</strong>는 뜻입니다. 이때 ${tex('g(x)')}는 ${tex(`(x ${cxSub(v.r)})^2(x ${cxSub(v.s2)})`)} 꼴이므로 ${tex('x')}축과 만나는 점(${tex('g(a)=0')})은 <strong class="text-amber-300">${tex(`a = ${v.r}`)} 또는 ${tex(`a = ${v.s2}`)}</strong> 입니다. (접점 ${tex(`${v.r}`)} 은 중근이라 ${tex(`2\\times ${v.r} + (${v.s2}) = 3\\times ${(v.p + v.r) / 2}`)}, 대칭의 중심이 두 점을 ${tex('1:2')} 로 나눕니다.)`,
      highlight: examData[5].shortcut().highlight
    };
  };
  function draw5(b, s, lab) {
    const v = varD5.cur(), st = dsStepNow(lab, s), dual = st >= 2;
    dsFrame(b, s, 'd5v' + v.sid, v, dual, () => {
      b.plot(v.g, { color: 'ink', width: 3.2, glow: true, ref: 'G' });
      b.point([v.p, v.g(v.p)], { color: 'rose', r: 6, ref: 'A', label: `극대 ${cxN(v.M)}`, dx: -10, dy: -13, align: 'right' });
      b.point([v.r, 0], { color: 'green', r: 6, ref: 'B', label: `x=${cxN(v.r)} (g 극소 0)`, dx: 10, dy: 17 });
      if (st >= 3) {
        b.point([v.s2, 0], { color: 'amber', r: 6.5, ref: 'a', label: `a = ${cxN(v.s2)}`, dx: -10, dy: -14, align: 'right' });
        b.point([v.r, 0], { color: 'amber', hollow: true, r: 10, ref: 'a' });
      }
    }, () => {
      if (st >= 2) {
        const pts = [[v.p, 0]]; for (let i = 0; i <= 50; i++) { const x = v.p + ((v.r - v.p) * i) / 50; pts.push([x, v.fp(x)]); } pts.push([v.r, 0]);
        b.poly(pts, { fill: 'sky', fillAlpha: 0.28, color: null, ref: 'dy' });
      }

    ]
  };
  const explorationModel = (sc, s, v) => {
    if (sc.id === 'always') return tex('f(x)=x^3-4x+4,\\quad g(x)=-x,\\quad x\\ge0');
    if (sc.id === 'rootcount') return tex('f(x)=x^3-3x^2')+', '+tex(`y=k,\\;k=${s.kk}`);
    if (sc.id === 'quartic') return tex(`f'(x)=0.8(x+1)(x-(${gammaOf(s)}))(x-3)`)+', 적분상수는 현재 그림의 값을 사용합니다.';
    return v.chips && v.chips[0] ? tex(v.chips[0].tex) : '';
  };
  scenes.forEach((sc) => {
    const view = sc.view, steps = sc.steps;
    sc.startStep = 0;
    sc.notesTitle = '현재 탐구 모델과 조건';
    sc.guide = EXPLORE_STEPS[sc.id][0];
    sc.steps = (s) => window.lab && window.lab.tab === 'explore'
      ? EXPLORE_STEPS[sc.id]
      : (typeof steps === 'function' ? steps(s) : steps);
    if (sc.solution) {
      sc.solution.quickTitle = '실전 풀이 · 그림의 구조 활용';
      sc.solution.quickTag = '구조 풀이';
    }
    sc.view = (s, lab) => {
      const v = typeof view === 'function' ? view(s, lab) || {} : view || {};
      const explore = !lab || lab.tab === 'explore';
      const open = lab && lab.tab === 'problem' ? lab._answerOpen() : s.step >= 3;
      const note = explore ? '<b>자유 탐구 모델</b> '+explorationModel(sc,s,v)+'<br>이 탭의 함수와 조작값으로 구조를 실험합니다. 선택한 문항과 새 문제의 조건·도형·풀이는 문제/정리 탭에서 함께 바뀝니다.' : '';
      // The canvas reveals its own reasoning stage. Derived answer cards wait for the final stage.
      if (!open) return note ? { notes: note } : {};
      return { ...v, notes: [note, v.notes].filter(Boolean).join('<br>') || undefined };
    };
  });

  APLab.createLab({
    stagedReveal: true,
    id: 'calc1-derivative-shape',
    title: '도함수와 함수의 그래프',
    courseName: '미적분Ⅰ',
    unit: '미분 · 도함수와 함수의 그래프',
    courseColor: 'var(--m-orange)',
    home: '../index.html#calc1',
    legacy: '../../labs/미적분1/도함수 ↔ 원함수.html',
    board: { kind: 'cartesian', focus: { x: [-0.6, 2.6], y: [-3.6, 3.6] }, pad: 0.03 },
    params: {
      delta: { value: 1, min: -0.6, max: 2.0, step: 0.05, color: 'amber', label: '도함수의 근을 정하는 값 δ (δ>0 중근이 아닌 두 근 / δ=0 중근)', hint: "f′(x) = 3[(x−1)² − δ] : δ < 0 이면 x축과 만나지 않아 극값이 없습니다", format: (v) => `δ = ${fmt(v)}` },
      lam: { value: 0, min: 0.0, max: 1.0, step: 0.02, color: 'amber', label: '가운데 근의 위치 λ (0·1 = 중근 / 0.5 = 한가운데)', hint: 'γ = −1 + 4λ : 0 또는 1 이면 가운데 근이 끝 근에 포개집니다', format: (v) => `λ = ${fmt(v)} (γ = ${fmt(-1 + 4 * v)})` },
      C: { value: 0, min: -3.5, max: 3.5, step: 0.1, color: 'sky', label: '적분상수 C (위아래로 이동 · 극값의 부호 조절)', format: (v) => `C = ${fmt(v)}` },
      C2: { value: 0, min: -1.5, max: 1.5, step: 0.1, color: 'sky', label: '위아래 평행이동 C', format: (v) => `C = ${fmt(v)}` },
      k: { value: -3, min: -4.0, max: 2.0, step: 0.1, color: 'violet', label: "직선의 높이 g′(x) = k (k = −3 일 때 접함)", format: (v) => `k = ${fmt(v)}` },
      a: { value: -1, min: -1.5, max: 3.2, step: 0.05, color: 'amber', label: '정적분의 아래끝 x = a (g(a)=0 인 점)', format: (v) => `a = ${fmt(v)}` },
      al: { value: 1.2, min: -1, max: 3.6, step: 0.05, color: 'amber', label: 'g를 올린 높이 a', hint: 'g + a를 위아래로 움직이며 x ≥ 0에서 두 그래프 사이의 세로 간격을 비교하세요', format: (v) => `a = ${fmt(v)}` },
      kk: { value: -2, min: -4.8, max: 2.4, step: 0.05, color: 'sky', label: '수평선의 높이 k', hint: '극값 0, −4 와 y절편 0 근처에서 근의 개수가 바뀝니다', format: (v) => `k = ${fmt(v)}` }
    },
    state: { chart: true, animDir: -1, tgt: 'pos2' },
    persist: ['chart'],
    scenes
  });
});
</script>
