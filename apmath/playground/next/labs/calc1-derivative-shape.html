/* ==========================================================================
   미적분Ⅰ · 도함수 ↔ 원함수 개형 추론 (AP Math Lab 2.0 이식본)
   원본: labs/미적분1/도함수 ↔ 원함수.html
   - 문제·단계·정석/빠른 풀이 문구(examData)는 원본을 그대로 옮겼습니다.
   - 수학 함수(원함수 evalTopFunc, 도함수 evalBottomFunc, 삼차방정식 실근 solveCubicRoots)는 원본과 같은 식입니다.
   - 바뀐 점: 셸·레이아웃은 공용 키트가 담당, 무대는 위(원함수)·가운데(증감표)·아래(도함수) 세 창을 모두 1:1 축척으로,
     모드마다 조절 막대를 따로 둠(원본은 param1·param2 를 모드마다 다른 뜻으로 재사용),
     도함수의 근·직선·핀을 끌 수 있는 점(후광)으로 통일, 증감표는 그림의 x 위치와 정렬된 막대로 표시.
   ========================================================================== */
window.addEventListener('DOMContentLoaded', function () {
  const { tex, fmt, clamp } = APLab;
  const asc = (v, d = 1) => fmt(v, d).replace('−', '-'); // 수식(tex)용: 유니코드 마이너스 대신 '-'
  const sg = (v, d = 1) => (v < 0 ? '-' : '+') + ' ' + asc(Math.abs(v), d); // tex용 부호 있는 수
  const quiet = (b) => { if (b.thumb) b._text = function () { return this; }; }; // '모든 장면' 썸네일에서는 글자를 빼고 그림만 보여 줍니다

  /* ---------- 1. 모드별 원함수(위)·도함수(아래) 수학 모델 (원본 evalTopFunc / evalBottomFunc) ---------- */
  // 원본의 param1·param2 는 모드마다 뜻이 달랐습니다 → 이름 있는 값으로 나눔:
  //   δ(delta): 모드 1·3·5 도함수 근 파라미터 / λ(lam): 모드 2 가운데 근 내분비
  //   C: 모드 1·3 적분상수 / C2: 모드 2 상하 이동 / k: 모드 4 직선 높이 / a: 모드 5 정적분 아래끝
  const lamOf = (s) => Math.max(0, Math.min(1, s.lam));
  const gammaOf = (s) => -1.0 + 4.0 * lamOf(s);
  const effDeltaOf = (m, s) => (m === 4 ? 1.0 + s.k / 3.0 : s.delta); // 도함수가 x축(또는 직선)과 만나는 정도
  function evalTop(m, s, x) {
    if (m === 1 || m === 3) {
      // f(x) = (x - 1)^3 - 3*δ*(x - 1) + C
      const u = x - 1.0;
      return u * u * u - 3 * s.delta * u + s.C;
    } else if (m === 2) {
      // 사차함수: α = -1, β = 3 (L=4), γ = -1 + 4*λ
      const u = x - (-1.0);
      const L = 4.0;
      const c = Math.max(0, Math.min(1, s.lam)) * L;
      return 0.2 * (Math.pow(u, 4) - (4 / 3) * (L + c) * Math.pow(u, 3) + 2 * c * L * u * u) + s.C2 - 1.5;
    } else if (m === 4) {
      // 차함수 h(x) = f(x) - g(x), 여기서 f'(x) = 3(x-1)^2 - 3, g'(x) = k
      // 즉 h'(x) = 3(x-1)^2 - (3 + k) => h(x) = (x-1)^3 - (3 + k)(x-1)
      const u = x - 1.0;
      const effDelta = 1.0 + s.k / 3.0;
      return u * u * u - 3 * effDelta * u;
    } else if (m === 5) {
      // 정적분으로 정의된 함수 g(x) = ∫_a^x f(t) dt, 피적분함수 f(t) = 3(t-1)^2 - 3*δ
      // 원시함수 F(x) = (x-1)^3 - 3*δ*(x-1) 이므로 g(x) = F(x) - F(a)
      const dlt = s.delta;
      const a = s.a;
      const Fx = Math.pow(x - 1, 3) - 3 * dlt * (x - 1);
      const Fa = Math.pow(a - 1, 3) - 3 * dlt * (a - 1);
      return Fx - Fa;
    }
    return 0;
  }
  function evalBottom(m, s, x) {
    if (m === 1 || m === 3 || m === 5) {
      // f'(x) = 3[(x - 1)^2 - δ]
      const u = x - 1.0;
      return 3 * (u * u - s.delta);
    } else if (m === 2) {
      // 삼차 도함수 f'(x) = 0.8 (x + 1)(x - γ)(x - 3)
      const lam = Math.max(0, Math.min(1, s.lam));
      const gamma = -1.0 + 4.0 * lam;
      return 0.8 * (x + 1.0) * (x - gamma) * (x - 3.0);
    } else if (m === 4) {
      // 하단 기본 곡선 f'(x) = 3(x-1)^2 - 3 (여기에 직선 y = g'(x) = k 가 겹쳐 그려짐)
      const u = x - 1.0;
      return 3 * (u * u - 1.0);
    }
    return 0;
  }
  // 삼차방정식 실근 솔버 (모드 3 실근 개수 판정용)
  function solveCubicRoots(c3, c2, c1, c0) {
    const A = c2 / c3;
    const B = c1 / c3;
    const C = c0 / c3;
    const p = B - (A * A) / 3;
    const q = (2 * A * A * A) / 27 - (A * B) / 3 + C;
    const disc = (q * q) / 4 + (p * p * p) / 27;
    const shift = -A / 3;
    const roots = [];

    if (Math.abs(disc) < 1e-4) {
      if (Math.abs(q) < 1e-5) roots.push(shift);
      else {
        const u1 = Math.cbrt(-q / 2);
        roots.push(2 * u1 + shift, -u1 + shift);
      }
    } else if (disc > 0) {
      const sqrtD = Math.sqrt(disc);
      roots.push(Math.cbrt(-q / 2 + sqrtD) + Math.cbrt(-q / 2 - sqrtD) + shift);
    } else {
      const r = Math.sqrt(Math.max(0, -p / 3));
      const phi = Math.acos(Math.max(-1, Math.min(1, -q / (2 * r * r * r))));
      roots.push(
        2 * r * Math.cos(phi / 3) + shift,
        2 * r * Math.cos((phi + 2 * Math.PI) / 3) + shift,
        2 * r * Math.cos((phi + 4 * Math.PI) / 3) + shift
      );
    }
    return roots.sort((x, y) => x - y);
  }

  /* ---------- 2. 문제·풀이 데이터 (원본 examData 그대로) ---------- */

  /* ---------- 3. 공통 부품 ---------- */
  // 원본 안내 문구의 위치 표현만 새 화면에 맞춥니다(프리셋·슬라이더는 이제 패널 안에 있음).
  const guideOf = (m) => examData[m].hint.replace('좌측 상단 ', '아래 ').replace('우측 슬라이더', '조절 막대');

  function bounce(s, key, speed, lo, hi, dt) {

  const playAction = (label) => ({ id: 'play', play: true, icon: (s) => (s.playing ? 'pause' : 'play'), label: (s) => (s.playing ? '일시 정지' : label), on: (s) => s.playing, run: (s) => { s.playing = !s.playing; } });
  const chartAction = { id: 'chart', icon: 'layers', label: (s) => (s.chart ? '실시간 증감표 켜짐' : '실시간 증감표 꺼짐'), on: (s) => s.chart, run: (s) => { s.chart = !s.chart; } };

  // 세 창(위: 원함수 · 가운데: 증감표 · 아래: 도함수). 세 창은 같은 축척(1:1)을 쓰므로 창 높이는 보여 줄 y 범위의 비율로 나눕니다.
  const BAND = 0.08;
  const panes3 = (top, bot) => (s) => {
    const t = typeof top === 'function' ? top(s) : top;
    const hm = t[1] - t[0], hb = bot[1] - bot[0];
    const fb = s.chart ? BAND : 0;
    const fm = (1 - fb) * hm / (hm + hb);
    const list = [{ id: 'main', frac: fm, focusY: t }];
    if (s.chart) list.push({ id: 'band', frac: fb });
    list.push({ id: 'deriv', frac: 1 - fm - fb, focusY: bot });
    return list;
  };
  // aspect:'free' 장면(사차 개형)에서는 가로·세로 눈금 간격을 따로 정합니다(1:1 장면은 기본값 그대로).
  const niceInt = (raw) => [1, 2, 5, 10, 20, 50, 100].find((c) => c >= raw) || 200;
  function freeOpts(b) {
    if (b.aspect !== 'free') return { grid: {}, axes: {} };
    const ky = b.ky;
    return { grid: { step: 1, stepY: niceInt(30 / ky) }, axes: { tickStep: 1, tickStepY: niceInt(44 / ky) } };
  }
  // 장면 2(사차 개형)의 세로 창: γ에 따라 극값의 높이가 크게 변하므로 극대·극소가 모두 들어오도록(x축 포함) 창을 맞춥니다.
  function quarticWin(s) {
    const ys = [evalTop(2, s, -1), evalTop(2, s, gammaOf(s)), evalTop(2, s, 3)];
    const lo = Math.min(...ys, -1), hi = Math.max(...ys, 1), sp = hi - lo;
    const mb = 0.3 * sp + 0.6;
    // 휴대폰에서는 위쪽 수식 칩이 창의 윗부분을 가리므로 위 여유를 더 둡니다(극대 라벨이 칩 아래에 놓이도록).
    const narrow = window.matchMedia && window.matchMedia('(max-width: 859px)').matches;
    return [lo - mb, hi + (narrow ? 0.5 * (sp + mb) : 0.34 * sp + 0.6)];
  }
  function quarticDWin(s) {
    let lo = 0, hi = 0;
    for (let i = 0; i <= 40; i++) { const y = evalBottom(2, s, -1 + (4 * i) / 40); lo = Math.min(lo, y); hi = Math.max(hi, y); }
    const sp = hi - lo;
    // 휴대폰에서는 아래 오른쪽의 도구 막대가 창 아래쪽을 가리므로, 도함수 창 아래에 여유를 더 둡니다.
    const narrow = window.matchMedia && window.matchMedia('(max-width: 859px)').matches;
    return [lo - (narrow ? 0.7 : 0.22) * sp - 0.4, hi + 0.22 * sp + 0.4];
  }
  const panesQuartic = (s) => {
    const fb = s.chart ? BAND : 0, fm = s.chart ? 0.5 : 0.55;
    const list = [{ id: 'main', frac: fm, focusY: quarticWin(s) }];
    if (s.chart) list.push({ id: 'band', frac: fb });
    list.push({ id: 'deriv', frac: 1 - fm - fb, focusY: quarticDWin(s) });

  function inPane(b, id, fn) {
    b.use(id);

  // 도함수와 x축(모드 4에서는 직선 y=k) 사이를 부호색으로 칠합니다 (+ 분홍 / − 하늘).
  function shadeSign(b, fn, base) {
    const vb = b.viewBox();
    const c = b.ctx;
    const n = 110;
    c.save();
    c.setLineDash([]);
    c.shadowBlur = 0;
    for (let i = 0; i < n; i++) {
      const x1 = vb.x0 + ((vb.x1 - vb.x0) * i) / n;
      const x2 = vb.x0 + ((vb.x1 - vb.x0) * (i + 1)) / n;
      const y = fn((x1 + x2) / 2);
      if (!Number.isFinite(y) || Math.abs(y) > 35) continue;
      const p1 = b.toS(x1, y), p2 = b.toS(x2, base);
      c.fillStyle = y >= base ? b.color('rose', 0.17) : b.color('sky', 0.24);
      c.fillRect(p1.x, Math.min(p1.y, p2.y), p2.x - p1.x + 1, Math.abs(p2.y - p1.y));
    }
    c.restore();
  }

  // 증감표: 도함수의 부호 구간·극값 위치(그림의 x 위치와 정렬)
  function chartOf(m, s) {
    const sym = m === 4 ? 'h′' : m === 5 ? 'g′' : 'f′';
    const POS = { full: `${sym}(+) ↗ 증가`, short: '+ ↗', color: 'rose' };
    const NEG = { full: `${sym}(−) ↘ 감소`, short: '− ↘', color: 'sky' };
    if (m === 2) {
      const lam = lamOf(s), g = gammaOf(s);
      if (lam < 0.02) return { roots: [{ x: -1, label: '변곡', color: 'violet' }, { x: 3, label: '극소', color: 'green' }], ints: [NEG, NEG, POS] };
      if (lam > 0.98) return { roots: [{ x: -1, label: '극소', color: 'green' }, { x: 3, label: '변곡', color: 'violet' }], ints: [NEG, POS, POS] };
      return { roots: [{ x: -1, label: '극소', color: 'green' }, { x: g, label: '극대', color: 'rose' }, { x: 3, label: '극소', color: 'green' }], ints: [NEG, POS, NEG, POS] };
    }
    const eff = effDeltaOf(m, s);
    if (eff > 0.005) {
      const h = Math.sqrt(eff);
      return { roots: [{ x: 1 - h, label: '극대', color: 'rose' }, { x: 1 + h, label: '극소', color: 'green' }], ints: [POS, NEG, POS] };
    }
    if (Math.abs(eff) <= 0.005) return { roots: [{ x: 1, label: '변곡 (극값 아님!)', color: 'violet' }], ints: [POS, POS] };
    return { roots: [], ints: [{ full: `모든 실수에서 ${sym}(x) > 0  ⇒  전 구간 ↗ 단조증가 (극값 없음)`, short: '↗ 단조증가 (극값 없음)', color: 'rose' }] };
  }
  function drawBand(b, s, m) {
    if (!s.chart) return;
    b.use('band');
    const r = b.paneRect('band');
    const c = b.ctx;
    const cy = r.y + r.h / 2;
    c.save();
    c.fillStyle = b.color('halo', 0.92);
    c.fillRect(r.x, r.y, r.w, r.h);
    c.lineWidth = 1.8;
    c.strokeStyle = b.color('amber', 0.65);
    c.beginPath(); c.moveTo(r.x, r.y + 0.5); c.lineTo(r.x + r.w, r.y + 0.5); c.stroke();
    c.strokeStyle = b.color('sky', 0.65);
    c.beginPath(); c.moveTo(r.x, r.y + r.h - 0.5); c.lineTo(r.x + r.w, r.y + r.h - 0.5); c.stroke();
    c.restore();
    const SZ = 12;
    const tw = (str) => { c.save(); c.font = `800 ${SZ * b.fs}px ${b.font}`; const w = c.measureText(str).width; c.restore(); return w; };
    if (s.step < 3) {
      b.stext(r.x + 12, cy, '증감표 — 풀이 3단계에서 채워집니다', { color: 'muted', size: 11.5, align: 'left', baseline: 'middle', weight: 700 });
      return;
    }
    const ch = chartOf(m, s);
    const P = ch.roots.map((q) => b.toS(q.x, 0).x);
    const half = ch.roots.map((q) => tw(q.label) / 2 + 5);
    const onScreen = (px) => px >= r.x + 4 && px <= r.x + r.w - 4;
    const xs = [];
    // 정렬 배치가 가능한지: 근이 화면 안에 있는데 그 옆 구간에 부호 글자(짧은 꼴)가 들어갈 자리가 없으면 '극소극대극소'처럼 붙어 읽히므로
    // 아래의 '순서대로 늘어놓기' 배치로 바꿉니다. (x 위치와의 정렬은 위·아래 그림의 세로선이 대신 알려 줍니다.)
    let crowded = false;
    ch.ints.forEach((it, i) => {
      const lRoot = i > 0 ? P[i - 1] : null, rRoot = i < P.length ? P[i] : null;
      const left = lRoot == null ? r.x + 8 : lRoot + half[i - 1];
      const right = rRoot == null ? r.x + r.w - 8 : rRoot - half[i];
      const bothOn = (lRoot == null || onScreen(lRoot)) && (rRoot == null || onScreen(rRoot));
      if (bothOn && right - left < tw(it.short) + 6) crowded = true;
    });
    if (crowded) {
      const toks = [];
      ch.ints.forEach((it, i) => {
        toks.push({ txt: it.short, color: it.color });
        if (i < ch.roots.length) toks.push({ txt: ch.roots[i].label, color: ch.roots[i].color });
      });
      const GAP = 9;
      const total = toks.reduce((a, t) => a + tw(t.txt), 0) + GAP * (toks.length - 1);
      const on = P.filter(onScreen);
      const mid = on.length ? on.reduce((a, v) => a + v, 0) / on.length : r.x + r.w / 2;
      let x = clamp(mid - total / 2, r.x + 8, Math.max(r.x + 8, r.x + r.w - 8 - total));
      xs.push(x);
      toks.forEach((t) => {
        b.stext(x, cy, t.txt, { color: t.color, size: SZ, align: 'left', baseline: 'middle', weight: 800 });
        x += tw(t.txt) + GAP;
      });
    } else {
      ch.ints.forEach((it, i) => {
        const left = i === 0 ? r.x + 8 : P[i - 1] + half[i - 1];
        const right = i === P.length ? r.x + r.w - 8 : P[i] - half[i];
        const lo = Math.max(left, r.x + 6), hi = Math.min(right, r.x + r.w - 6);
        if (hi - lo < 14) return;
        const txt = tw(it.full) + 10 <= hi - lo ? it.full : it.short;
        const w = tw(txt);
        const cx = (lo + hi) / 2;
        b.stext(cx, cy, txt, { color: it.color, size: SZ, align: 'center', baseline: 'middle', weight: 800 });
        xs.push(cx - w / 2);
      });
      ch.roots.forEach((q, i) => {
        if (!onScreen(P[i])) return;
        b.stext(P[i], cy, q.label, { color: q.color, size: SZ, align: 'center', baseline: 'middle', weight: 800 });
        xs.push(P[i] - half[i]);
      });
    }
    if (!xs.length || Math.min(...xs) > 78) b.stext(r.x + 10, cy, '증감표', { color: 'amber', size: 11, align: 'left', baseline: 'middle', weight: 800 });
  }

  // 위·가운데·아래를 가로지르는 영점 동기화 세로선 (Step 1)
  function syncLines(b, s, m) {
    const lines = [];
    if (m === 2) [-1.0, gammaOf(s), 3.0].forEach((x) => lines.push({ x, color: 'amber', alpha: 0.5 }));
    else {
      lines.push({ x: 1.0, color: 'violet', alpha: 0.5 });
      const eff = effDeltaOf(m, s);
      if (eff > 0.005) {
        const h = Math.sqrt(eff);
        lines.push({ x: 1.0 - h, color: 'rose', alpha: 0.6 }, { x: 1.0 + h, color: 'green', alpha: 0.6 });
      }
    }
    ['main', 'band', 'deriv'].forEach((id) => {
      if (id === 'band' && !s.chart) return;
      inPane(b, id, () => lines.forEach((l) => b.vline(l.x, { color: l.color, alpha: l.alpha, width: 1.5, dash: true })));
    });
  }

  /* ---------- 4. 장면 공통 그리기 ---------- */
  const dragBeta = (s) => (w) => { const dist = Math.abs(w.x - 1.0); s.delta = dist < 0.12 ? 0.0 : Math.min(2.0, +(dist * dist).toFixed(2)); };
  const dragVertex = (s) => (w) => { let d = -w.y / 3; if (Math.abs(d) < 0.04) d = 0; s.delta = clamp(+d.toFixed(2), -0.6, 2.0); };
  const dragGamma = (s) => (w) => {
    let lam = (w.x - (-1.0)) / 4.0;
    if (Math.abs(lam) < 0.04) lam = 0.0; else if (Math.abs(lam - 0.5) < 0.04) lam = 0.5; else if (Math.abs(lam - 1.0) < 0.04) lam = 1.0;
    s.lam = clamp(+lam.toFixed(2), 0.0, 1.0);
  };
  const dragK = (s) => (w) => { let k = w.y; if (Math.abs(k - (-3.0)) < 0.18) k = -3.0; s.k = clamp(+k.toFixed(2), -4.0, 2.0); };
  const dragPin = (s) => (w) => { s.a = clamp(+w.x.toFixed(2), -1.5, 3.2); };

  // 위쪽 수식 칩(떠 있는 상자)이 가리는 영역 — drawScene 이 그릴 때마다 갱신합니다.
  let chipBox = null;
  function readChipBox(b, lab) {
    chipBox = null;
    if (b.thumb || !lab || !lab.ui) return;
    const el = lab.ui.chips.firstElementChild;
    if (!el) return;
    const cr = b.canvas.getBoundingClientRect(), r = el.getBoundingClientRect();
    chipBox = { x0: r.left - cr.left, x1: r.right - cr.left, y1: r.bottom - cr.top };
  }
  // 창 밖으로 나간 점은 그리지 않고, 라벨이 창 위·아래 가장자리나 위쪽 수식 칩에 닿으면 점의 반대쪽으로 뒤집어 잘리거나 가려지지 않게 합니다.
  function mark(b, id, x, y, o) {
    const r = b.paneRect(id), p = b.toS(x, y);
    if (p.x < r.x - 6 || p.x > r.x + r.w + 6 || p.y < r.y - 6 || p.y > r.y + r.h + 6) return;
    if (chipBox && id === 'main' && p.y < chipBox.y1 + 2 && p.x > chipBox.x0 - 6 && p.x < chipBox.x1 + 6) return; // 수식 칩 밑에 가려진 점은 그리지 않음
    if (o.label && o.dy) {
      const ly = p.y + o.dy;
      const underChip = chipBox && id === 'main' && ly < chipBox.y1 + 4 && p.x > chipBox.x0 - 70 && p.x < chipBox.x1 + 70;
      if (o.dy < 0 && (ly < r.y + 8 || underChip)) o = { ...o, dy: -o.dy };
      else if (o.dy > 0 && ly > r.y + r.h - 8) o = { ...o, dy: -o.dy };
    }
    b.point([x, y], o);
  }

  function topMarks(b, s, m) {
    b.use('main');
    const f = (x) => evalTop(m, s, x);
    if (m === 2) {
      const lam = lamOf(s), g = gammaOf(s);
      const L = (x) => `(${fmt(x, 0)}, ${fmt(f(x), 1)})`;
      // 점끼리 가까워도 라벨이 겹치지 않게: 왼쪽 점은 왼쪽 아래, 오른쪽 점은 오른쪽 아래, 극대는 위에 둡니다.
      if (lam < 0.02) {
        mark(b, 'main', -1, f(-1), { color: 'violet', r: 6.5, label: `변곡접점${L(-1)}`, dx: -10, dy: -14, align: 'right' });
        mark(b, 'main', 3, f(3), { color: 'green', r: 6.5, label: `극소${L(3)}`, dx: 10, dy: 18, align: 'left' });
      } else if (lam > 0.98) {
        mark(b, 'main', -1, f(-1), { color: 'green', r: 6.5, label: `극소${L(-1)}`, dx: -10, dy: 18, align: 'right' });
        mark(b, 'main', 3, f(3), { color: 'violet', r: 6.5, label: `변곡접점${L(3)}`, dx: 10, dy: -14, align: 'left' });
      } else {
        // 극대가 어느 한쪽 극소에 가까우면 극대 라벨을 반대쪽(안쪽)으로 비껴 두어 극소 라벨과 겹치지 않게 합니다.
        const pxL = b.toS(-1, 0).x, pxG = b.toS(g, 0).x, pxR = b.toS(3, 0).x;
        const nearL = pxG - pxL < 130, nearR = pxR - pxG < 130;
        mark(b, 'main', -1, f(-1), { color: 'green', r: 6, label: `극소${L(-1)}`, dx: -10, dy: 18, align: 'right' });
        mark(b, 'main', g, f(g), { color: 'rose', r: 6.5, label: `극대(${fmt(g, 1)}, ${fmt(f(g), 1)})`, dx: nearL ? 12 : nearR ? -12 : 0, dy: -18, align: nearL ? 'left' : nearR ? 'right' : 'center' });
        mark(b, 'main', 3, f(3), { color: 'green', r: 6, label: `극소${L(3)}`, dx: 10, dy: 18, align: 'left' });
      }
      return;
    }
    const eff = effDeltaOf(m, s);
    const rootsShown = m === 3 && s.step >= 2; // 장면 3 Step 2 에서는 변곡점 자리에 실근 x₂ 가 겹치므로 라벨을 실근 쪽에 맡김
    mark(b, 'main', 1, f(1), { color: 'violet', r: 5.5, label: rootsShown ? '' : `변곡점(1, ${fmt(f(1), 1)})`, dx: 12, dy: -12 });
    if (eff > 0.005) {
      const h = Math.sqrt(eff);
      mark(b, 'main', 1 - h, f(1 - h), { color: 'rose', r: 6.5, label: `극대(${fmt(1 - h)}, ${fmt(f(1 - h))})`, dx: 0, dy: -18, align: 'center', ref: 'root' });
      mark(b, 'main', 1 + h, f(1 + h), { color: 'green', r: 6.5, label: `극소(${fmt(1 + h)}, ${fmt(f(1 + h))})`, dx: 0, dy: 20, align: 'center', ref: 'root' });
    }
    // 장면 3 Step 2 : 방정식 f(x) = 0 의 실근(x절편)
    if (rootsShown) {
      const rts = solveCubicRoots(1, 0, -3 * s.delta, s.C);
      rts.forEach((u, idx) => {
        const rx = u + 1.0;
        const side = rts.length === 3 ? [-1, 0, 1][idx] : 0; // 왼쪽·가운데·오른쪽 근의 라벨을 서로 다른 쪽에 둡니다
        mark(b, 'main', rx, 0, { color: 'amber', r: 6, label: `x${['₁', '₂', '₃'][idx] || ''}=${fmt(rx)}`, dx: 8 * side, dy: side === 0 ? 20 : -14, align: side === 0 ? 'center' : side < 0 ? 'right' : 'left' });
      });
    }
    // 장면 5 : 정적분 아래끝 a 에 꽂힌 핀 g(a) = 0
    if (m === 5) b.handle('pin', [s.a, 0], { color: 'amber', r: 7.5, label: `핀 g(${fmt(s.a)})=0`, dx: -12, dy: -14, align: 'right', ref: 'pin', drag: dragPin(s) });
  }

  function bottomMarks(b, s, m) {
    b.use('deriv');
    if (m === 2) {
      const g = gammaOf(s);
      mark(b, 'deriv', -1, 0, { color: 'green', r: 5.5, label: 'α=−1', dx: -8, dy: -12, align: 'right' });
      mark(b, 'deriv', 3, 0, { color: 'green', r: 5.5, label: 'β=3', dx: 8, dy: -12 });
      // γ 라벨은 보통 점 위에 두되(휴대폰의 도구 막대가 아래 오른쪽을 가림), α 가까이에서는 α 라벨과 겹치지 않게 아래에 둡니다.
      const gNearA = b.toS(g, 0).x - b.toS(-1, 0).x < 130, gNearB = b.toS(3, 0).x - b.toS(g, 0).x < 70;
      b.handle('gamma', [g, 0], { color: 'amber', r: 7.5, ref: 'root', label: `γ=${fmt(g)}`, dx: gNearB ? -12 : 0, dy: gNearA ? 22 : -22, align: gNearB ? 'right' : 'center', drag: dragGamma(s) });
      return;
    }
    const eff = effDeltaOf(m, s);
    const yRef = m === 4 ? s.k : 0;
    if (eff > 0.005) {
      const h = Math.sqrt(eff);
      mark(b, 'deriv', 1 - h, yRef, { color: 'rose', r: 6, label: `α=${fmt(1 - h)}`, dx: -8, dy: -12, align: 'right', ref: 'root' });
      if (m === 4) mark(b, 'deriv', 1 + h, yRef, { color: 'green', r: 6, label: `β=${fmt(1 + h)}`, dx: 8, dy: -12, ref: 'root' });
      else b.handle('beta', [1 + h, 0], { color: 'amber', r: 7.5, ref: 'root', label: `β=${fmt(1 + h)}`, dx: 8, dy: -12, drag: dragBeta(s) });
    } else if (Math.abs(eff) <= 0.005) {
      if (m === 4) mark(b, 'deriv', 1, yRef, { color: 'violet', r: 7.5, label: '접함 x=1', dx: 0, dy: -22, align: 'center', ref: 'root' });
      else b.handle('beta', [1, 0], { color: 'violet', r: 7.5, ref: 'root', label: '중근 x=1 (접함: 부호 불변)', dx: 0, dy: 24, align: 'center', drag: dragBeta(s) });
    } else if (m !== 4) {
      b.handle('vtx', [1, -3 * eff], { color: 'amber', r: 7, label: 'x축 위에 떠 있음 (허근)', dx: 0, dy: -18, align: 'center', drag: dragVertex(s) });
    }
    if (m === 4) b.handle('k', [2.5, s.k], { color: 'violet', r: 7, ref: 'k', label: `k = ${fmt(s.k)}`, dx: 12, dy: -14, drag: dragK(s) });
  }

  function drawScene(b, s, m, lab) {
    quiet(b);
    readChipBox(b, lab);
    const f = (x) => evalTop(m, s, x);
    const fd = (x) => evalBottom(m, s, x);
    // 1) 위: 원함수
    inPane(b, 'main', () => {
      const fo = freeOpts(b);
      if (s.grid) b.grid(fo.grid);
      b.axes({ ...fo.axes, yLabel: m === 5 ? 'g' : 'y' });
      b.plot(f, { color: 'ink', width: 3.2, glow: true, ref: 'F' });
    });
    // 2) 아래: 도함수
    b.use('deriv');
    const r = b.paneRect('deriv');
    const c = b.ctx;
    c.save();
    c.fillStyle = b.color('halo', 0.35);
    c.fillRect(r.x, r.y, r.w, r.h);
    c.restore();
    inPane(b, 'deriv', () => {
      const fo = freeOpts(b);
      if (s.grid) b.grid(fo.grid);
      b.axes({ ...fo.axes, yLabel: m === 5 ? 'f' : "y′" });
      if (s.step >= 2) shadeSign(b, fd, m === 4 ? s.k : 0);
      if (m === 4) b.hline(s.k, { color: 'violet', width: 2.6, glow: true, ref: 'k' });
      b.plot(fd, { color: 'sky', width: 3, glow: true, ref: 'F' });
    });
    if (!s.chart) {
      c.save();
      c.strokeStyle = b.color('sky', 0.55);
      c.lineWidth = 1.5;
      c.beginPath(); c.moveTo(r.x, r.y + 0.5); c.lineTo(r.x + r.w, r.y + 0.5); c.stroke();
      c.restore();
    }
    const dt = m === 4 ? '도함수 f′(x) 와 직선 g′(x) = k' : m === 5 ? '피적분함수 f(t) = g′(x)' : '도함수 y = f′(x)';
    b.stext(r.x + 12, r.y + (s.chart ? 16 : 18), dt, { color: 'sky', size: 12, align: 'left', weight: 800 });
    // 3) 가운데: 증감표
    drawBand(b, s, m);
    // 4) 영점 동기화 세로선
    if (s.step >= 1) syncLines(b, s, m);
    // 5) 점·손잡이·라벨
    topMarks(b, s, m);
    bottomMarks(b, s, m);
    b.use('main'); // 끌기 계산은 마지막으로 쓴 창을 기준으로 하므로 첫 창으로 되돌립니다
  }

  /* ---------- 5. 실시간 값(view) ---------- */
  function viewOf(m) {
    return (s) => {
      const v = {};
      if (m === 2) {
        const lam = lamOf(s), g = gammaOf(s), dbl = lam < 0.02 || lam > 0.98;
        v.chips = [
          { k: '원함수', tex: 'y = f(x) \\; (\\text{사차함수})', color: 'ink' },
          { k: '도함수', tex: `f'(x) = 0.8(x+1)(x ${sg(-g)})(x-3)`, color: 'sky' }
        ];
        v.status = dbl ? { tone: 'key', text: '도함수 중근 (극댓값 소멸 · 3:1 변곡형)' } : { tone: 'ok', text: '서로 다른 세 실근 (W형 극값 3개)' };
        v.alert = dbl ? { tone: 'key', text: "삼차 도함수 f'(x)가 중근을 가져 부호가 바뀌지 않으므로 사차함수의 극댓값이 사라지고 변곡접점이 되었습니다!" } : null;
        v.readouts = [
          { label: '도함수 부호 변화', value: dbl ? '− → 0(변곡) → − → 0 → +' : '− → + → − → + (3번 교차)', color: 'amber', ref: 'root' },
          { label: '양 끝 극소점의 높이', value: `f(−1)=${fmt(evalTop(2, s, -1), 1)} | f(3)=${fmt(evalTop(2, s, 3), 1)}`, color: 'green', ref: 'F' },
          { label: '극대 f(γ)', value: `f(${fmt(g, 1)})=${fmt(evalTop(2, s, g), 1)}`, color: 'rose', ref: 'root' },
          { label: '극값 개수', value: dbl ? '극값 1개 (극소만 존재)' : '극값 3개 (극소2 · 극대1)', color: 'violet' }
        ];
        v.tape = s.step >= 3 ? { title: dbl ? `삼차 도함수가 중근을 가짐(λ=${fmt(s.lam)}) ⇒ 사차함수 극댓값 소멸 (3:1 변곡 개형!)` : `삼차 도함수 서로 다른 세 실근(λ=${fmt(s.lam)}) ⇒ 사차함수 극소 2개 · 극대 1개 (W형)` } : null;
        return v;
      }
      const eff = effDeltaOf(m, s);
      const f = (x) => evalTop(m, s, x);
      v.chips = [
        { k: m === 5 ? '정적분 함수' : m === 4 ? '차함수' : '원함수', tex: m === 5 ? `g(x) = \\int_{${asc(s.a)}}^{x} f(t)\\,dt` : m === 4 ? `h(x) = f(x) - g(x) = (x-1)^3 ${sg(-(3 + s.k))}(x-1)` : `f(x) = (x-1)^3 ${sg(-3 * s.delta)}(x-1) ${sg(s.C)}`, color: 'ink' },
        { k: '도함수', tex: m === 4 ? `f'(x) = 3(x-1)^2 - 3, \\; g'(x) = ${asc(s.k)}` : m === 5 ? `g'(x) = f(x) = 3(x-1)^2 ${sg(-3 * s.delta)}` : `f'(x) = 3(x-1)^2 ${sg(-3 * s.delta)}`, color: 'sky' }
      ];
      if (eff > 0.005) {
        const hV = Math.sqrt(eff);
        const yMax = f(1.0 - hV), yMin = f(1.0 + hV), prod = yMax * yMin;
        const rCnt = prod < -0.01 ? 3 : (Math.abs(prod) <= 0.01 ? 2 : 1);
        v.status = { tone: 'ok', text: '도함수 2회 관통 (극대·극소 활성)' };
        v.readouts = [
          { label: '도함수 부호 변화', value: '+ → 0 → − → 0 → +', color: 'amber', ref: 'root' },
          { label: '극댓값 / 극솟값', value: `극대=${fmt(yMax, 1)} | 극소=${fmt(yMin, 1)}`, color: 'rose', ref: 'F' },
          { label: '극값의 곱 f(α)·f(β)', value: `곱 = ${fmt(prod)} (${prod < 0 ? '<0' : '≥0'})`, color: 'sky' },
          { label: '방정식 실근 / 극값 개수', value: `실근 ${rCnt}개 | 극값 2개`, color: 'violet' }
        ];
      } else if (Math.abs(eff) <= 0.005) {
        v.status = { tone: 'key', text: '도함수 중근 접함 (변곡 3중근 · 극값 0개)' };
        v.alert = { tone: 'key', text: '도함수가 x축에 접하여 부호가 (+ → 0 → +)로 바뀌지 않으므로 원함수는 극값을 갖지 않고 변곡접선을 갖습니다!' };
        v.readouts = [
          { label: '도함수 부호 변화', value: '+ → 0(접함) → + (부호 불변)', color: 'amber', ref: 'root' },
          { label: '극댓값 / 극솟값', value: '극값 없음 (변곡점만 존재)', color: 'rose' },
          { label: '극값의 곱 / 넓이', value: 'Δy = 0.00', color: 'sky' },
          { label: '방정식 실근 / 극값 개수', value: '실근 1개 | 극값 0개', color: 'violet' }
        ];
      } else {
        v.status = { tone: 'warn', text: '도함수 허근 (전 구간 단조증가)' };
        v.alert = { tone: 'warn', text: "도함수 f'(x) > 0 이므로 원함수는 전 구간에서 단조증가하며 극값이 없습니다!" };
        v.readouts = [
          { label: '도함수 부호 변화', value: '전 구간 + (영점 없음)', color: 'amber' },
          { label: '극댓값 / 극솟값', value: '극값 없음 (단조증가)', color: 'rose' },
          { label: "f′(1) (최솟값)", value: `f′(1) = ${fmt(-3 * eff)} > 0`, color: 'sky' },
          { label: '방정식 실근 / 극값 개수', value: '실근 1개 | 극값 0개', color: 'violet' }
        ];
      }
      // 하단 판서 배너 (Step 3)
      if (s.step >= 3) {
        let title = '';
        if (m === 1) {
          title = s.delta > 0.005 ? `단근 관통(δ=${fmt(s.delta)} > 0) : 도함수 부호가 바뀌므로 극대·극소 2개 생성!`
            : Math.abs(s.delta) <= 0.005 ? "중근 접함(δ = 0) : f'(1)=0 이지만 부호가 (+→0→+) 불변이므로 변곡점 뚫접!"
            : '허근(δ < 0) : 도함수가 x축 위에 떠 있으므로 극값 없이 단조증가!';
        } else if (m === 3) {
          const yMax = evalTop(3, s, 1.0 - Math.sqrt(Math.max(0, s.delta)));
          const yMin = evalTop(3, s, 1.0 + Math.sqrt(Math.max(0, s.delta)));
          const prod = yMax * yMin;
          const cnt = prod < -0.01 ? 3 : (Math.abs(prod) <= 0.01 ? 2 : 1);
          title = `극댓값(${fmt(yMax, 1)}) × 극솟값(${fmt(yMin, 1)}) = ${fmt(prod)}  ⇒  방정식 f(x)=0 실근 ${cnt}개!`;
        } else if (m === 4) title = `직선 g'(x) = ${fmt(s.k)} 를 가짜 x축으로 해석 ⇒ 교차=차함수 극값 / 접함=차함수 변곡점`;
        else if (m === 5) title = `g(x) = ∫ₐˣ f(t)dt : 아래끝 a = ${fmt(s.a)} 에서 항상 g(a) = 0 & 도함수는 g'(x) = f(x)!`;
        v.tape = { title };
      }
      return v;
    };
  }

  /* ---------- 6. 장면 정의 ---------- */
  const rootPresets = [
    { label: '① 단근 관통 (부호 변화 → 극값)', color: 'green', set: { delta: 1, C: 0 }, on: (s) => s.delta > 0.005 },

      solution: solutionOf(1),

      view: viewOf(4),
      draw: (b, s, v, lab) => drawScene(b, s, 4, lab)

      id: 'integral', title: 'g(x)=∫ₐˣ f(t)dt 추론', short: '정적분 함수',

      focus: { x: [-1.8, 3.5], y: [-3.2, 6.6] },

      tick: (s, dt) => { if (!s.playing) return false; bounce(s, 'a', 1.8, -1.2, 3.0, dt); return true; },
      view: viewOf(5),
      draw: (b, s, v, lab) => drawScene(b, s, 5, lab)
    }
  ];

  /* ---------- 7. 실험실 등록 ---------- */
  APLab.createLab({
    id: 'calc1-derivative-shape',
    title: '도함수 ↔ 원함수',

      lam: { value: 0, min: 0.0, max: 1.0, step: 0.02, color: 'amber', label: '가운데 근 내분비 λ (0·1 = 중근 / 0.5 = 대칭)', hint: 'γ = −1 + 4λ : 0 또는 1 이면 가운데 근이 끝 근에 포개집니다', format: (v) => `λ = ${fmt(v)} (γ = ${fmt(-1 + 4 * v)})` },
      C: { value: 0, min: -3.5, max: 3.5, step: 0.1, color: 'sky', label: '적분상수 C (상하 이동 · 극값 부호 조절)', format: (v) => `C = ${fmt(v)}` },
      C2: { value: 0, min: -1.5, max: 1.5, step: 0.1, color: 'sky', label: '상하 평행이동 C', format: (v) => `C = ${fmt(v)}` },
      k: { value: -3, min: -4.0, max: 2.0, step: 0.1, color: 'violet', label: "직선 높이 g′(x) = k (k = −3 접함)", format: (v) => `k = ${fmt(v)}` },
      a: { value: -1, min: -1.5, max: 3.2, step: 0.05, color: 'amber', label: '정적분 아래끝 x = a (g(a)=0 고정핀)', format: (v) => `a = ${fmt(v)}` }
    },
    state: { chart: true, animDir: -1 },
    persist: ['chart'],
    scenes
  });
});
