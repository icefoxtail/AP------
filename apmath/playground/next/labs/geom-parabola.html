/* ==========================================================================
   기하 · 포물선 실전 킬러 랩 (AP Math Lab 2.0 이식본) — 4개 탐구관 × 3개 시나리오 = 12장면
   원본: labs/기하와벡터/포물선.html
   이식 방식: 원본의 문제·풀이 데이터(examData)와 초점현 계산, 모드별 그리기 코드(renderMode1~4)를 글자 그대로 옮기고
   분필 그리기 함수(drawChalkLine·drawChalkPoint·drawRightAngleMark…)의 이름만 아래 어댑터가 새 무대(APLab.Board)에 연결합니다.
   - 바뀐 점: 셸·레이아웃은 공용 키트가 담당, 무대는 1:1 축척, 점 P·A·B·정점 A는 직접 끄는 손잡이,
     하단 비율 줄자는 셸의 요약 띠로 이동, 관찰 렌즈는 조작 패널의 칩으로 이동.
   - 단계: 원본의 단계별 눈 아이콘 → 정리 탭의 단계 플레이어(1단계는 처음부터 켜짐), 조각 발광 → '관찰 포인트'.
   ========================================================================== */
window.addEventListener('DOMContentLoaded', function () {
  const tex = APLab.tex;
  const clamp = APLab.clamp;

  // 정리·문제 탭(변형 조건으로 그리는 화면)은 끌기가 없고 라벨은 정확한 값(정수·분수·근호)으로 씁니다. 탐구 탭은 원래대로 소수.
  let NODRAG = false;
  const gcdEx = (a, b) => (b ? gcdEx(b, a % b) : Math.abs(a));
  const sqEx = (n) => { let o = 1, i = n; for (let f = 2; f * f <= i; f++) while (i % (f * f) === 0) { i /= f * f; o *= f; } return [o, i]; };
  function exNum(val, digits) {
    const sg = val < -1e-7 ? '-' : '', a = Math.abs(val);
    if (a < 1e-7) return '0';
    const r = Math.round(a);
    if (Math.abs(a - r) < 1e-6) return sg + r;
    for (let d = 2; d <= 12; d++) { const n = Math.round(a * d); if (Math.abs(a * d - n) < 1e-6) { const g = gcdEx(n, d); return `${sg}${n / g}/${d / g}`; } }
    for (let d = 1; d <= 12; d++) {
      const x = a * d, m = Math.round(x * x);
      if (m > 0 && m <= 3000 && Math.abs(x * x - m) < 1e-5) {
        const [o, i] = sqEx(m); if (i === 1) continue;
        const g = gcdEx(o, d), num = o / g, den = d / g, nt = (num === 1 ? '' : num) + '√' + i;
        return den === 1 ? sg + nt : `${sg}\\frac{${nt}}{${den}}`;
      }
    }
    return val.toFixed(digits);
  }
  // 풀이에 필요한 특수각만 값을 쓰고, 그 밖의 각은 호만 그립니다
  const spAngle = (deg) => { for (const t of [30, 45, 60, 90, 120, 135, 150]) if (Math.abs(deg - t) < 1e-7) return `${t}°`; return ''; };
  const plainFr = (t) => String(t).replace(/\\frac\{([^{}]+)\}\{([^{}]+)\}/g, '$1/$2');
  function fmtNum(val, digits = 2) {
    if (NODRAG) return exNum(val, digits);
    const clean = Math.abs(val) < 1e-7 ? 0 : val;
    return clean.toFixed(digits);
  }

  /* ===== 원본 그대로: 4대 모드 × 3종 세부 시나리오 기출·솔루션 데이터 (원본 535–869행) ===== */
    const examData = {
      1: {
        badge: "장면 1 · 포물선의 정의, 정삼각형, 최단 거리",
        hint: "노란 점 P를 위아래로 끌어 보며 <span class='text-pink-300 font-bold'>PF = PH = x₁ + p</span>가 항상 성립함과, PA + PF가 가장 작을 때 <span class='text-amber-300 font-bold'>점 P가 점 A에서 준선에 내린 수선 위에 놓임</span>을 확인하세요.",
        subTitles: ["① 초점까지의 거리와 둘레", "② 정삼각형 PFH", "③ 최솟값 PA+PF"],
        subData: {
          1: {
            tag: "포물선의 정의",
            targetTime: "목표 시간: 5초",
            question: () => `포물선 ${tex('y^2 = 8x')} 의 초점을 ${tex('F')}, 준선을 ${tex('l')}이라 하자. 포물선 위의 제1사분면의 점 ${tex('P(x_1, y_1)')}에서 준선 ${tex('l')}에 내린 수선의 발을 ${tex('H')}라 할 때, 선분 ${tex('\\overline{PF} = 6')} 이다. 이때 ${tex('x_1')}의 값과 삼각형 ${tex('PFH')}의 둘레의 길이를 구하시오.`,
            answerBadge: () => `${tex('x_1 = 4')}, 둘레 ${tex('= 12 + 4\\sqrt{3}')}`,
            snap: { p: 2.0, py: Math.sqrt(32), theta: Math.PI / 3 },
            steps: [
              "준선 x = -p, 수선의 발 H(-p, y₁), 포물선의 정의에 의해 PF = PH",
              "가로 p, 세로 2p인 직사각형과, 초점을 지나고 축에 수직인 현(길이 4p)",
              "삼각형 PFH의 둘레, 점 P에서의 접선이 PF, 축에 평행한 반직선과 이루는 두 각 α는 서로 같음"
            ],
            textbook: () => ({
              steps: `① ${tex('y^2 = 8x = 4 \\cdot 2x')} 이므로 초점 ${tex('F(2, 0)')}, 준선 ${tex('x = -2')}<br/>
② 두 점 사이의 거리 공식으로 ${tex('\\overline{PF} = \\sqrt{(x_1 - 2)^2 + y_1^2} = 6')}<br/>
③ 양변을 제곱하고 ${tex('y_1^2 = 8x_1')} 대입:<br/>
&nbsp;&nbsp;${tex('(x_1 - 2)^2 + 8x_1 = 36 \\implies x_1^2 + 4x_1 - 32 = 0 \\implies x_1 = 4, \\; y_1 = 4\\sqrt{2}')}<br/>
④ ${tex('H(-2, 4\\sqrt{2})')} 와 ${tex('F(2, 0)')} 사이의 거리 ${tex('\\overline{FH} = \\sqrt{4^2 + (4\\sqrt{2})^2} = \\sqrt{48} = 4\\sqrt{3}')}<br/>
⑤ ${tex('\\therefore \\triangle PFH')} 둘레 ${tex('= \\overline{PF} + \\overline{PH} + \\overline{FH} = 6 + 6 + 4\\sqrt{3} = 12 + 4\\sqrt{3}')}`,
              warning: "주의: 초점까지의 거리를 두 점 사이의 거리 공식으로 구하면 이차방정식을 풀어야 해서 계산이 길어집니다. 포물선의 정의를 이용하면 더 간단합니다."
            }),
            shortcut: () => ({
              steps: `① 포물선의 정의에 의해 점 P에서 초점까지의 거리와 준선까지의 거리가 같으므로 <strong class="text-pink-300">${tex('\\overline{PF} = \\overline{PH} = x_1 + p')}</strong>이다.<br/>
② ${tex('p = 2')} 이고 ${tex('\\overline{PF} = x_1 + 2 = 6')} 이므로 <strong class="text-amber-300">${tex('x_1 = 4')}</strong> (${tex('y_1 = 4\\sqrt{2}')})이다.<br/>
③ 가로 4, 세로 ${tex('4\\sqrt{2}')}인 직각삼각형에서 ${tex('\\overline{FH} = \\sqrt{4^2 + 32} = 4\\sqrt{3}')} 이므로 둘레는 <strong class="text-emerald-300">${tex('12 + 4\\sqrt{3}')}</strong>이다.`,
              highlight: "포물선 y² = 4px 위의 점 P(x₁, y₁)에서 초점까지의 거리는 PF = x₁ + p 입니다."
            })
          },
          2: {
            tag: "포물선과 정삼각형 PFH",
            targetTime: "목표 시간: 5초",
            question: () => `포물선 ${tex('y^2 = 8x')} 위의 제1사분면의 점 ${tex('P(x_1, y_1)')}와 초점 ${tex('F(2, 0)')}, 점 ${tex('P')}에서 준선 ${tex('x = -2')}에 내린 수선의 발 ${tex('H')}에 대하여 삼각형 ${tex('PFH')}가 정삼각형일 때, ${tex('x_1')}의 값과 정삼각형 ${tex('PFH')}의 한 변의 길이를 구하시오.`,
            answerBadge: () => `${tex('x_1 = 6')}, 한 변 ${tex('= 8')}`,
            snap: { p: 2.0, py: Math.sqrt(48), theta: Math.PI / 3 },
            steps: [
              "정삼각형 PFH의 세 변 PF = PH = FH 및 내각 60° 표시",
              "초점 F에서 선분 PH에 내린 수선의 발 (내각이 30°, 60°, 90°인 직각삼각형)",
              "엇각에 의해 PF가 x축과 이루는 각이 60° ⇒ x₁ = 3p = 6, 한 변 = 4p = 8"
            ],
            textbook: () => ({
              steps: `① ${tex('\\overline{PF} = \\overline{PH} = x_1 + 2')} 이고 ${tex('H(-2, y_1), F(2, 0)')}<br/>
② ${tex('\\overline{FH}^2 = (2 - (-2))^2 + y_1^2 = 16 + 8x_1')}<br/>
③ ${tex('\\overline{PH}^2 = \\overline{FH}^2')} 에서 ${tex('(x_1 + 2)^2 = 16 + 8x_1 \\implies x_1^2 - 4x_1 - 12 = 0')}<br/>
④ ${tex('(x_1 - 6)(x_1 + 2) = 0 \\implies x_1 = 6')}, 한 변의 길이 ${tex('x_1 + 2 = 8')} 도출.`,
              warning: "주의: 정삼각형 조건을 변의 길이의 제곱으로 식을 세워 풀면 계산이 길어지고 실수하기 쉽습니다."
            }),
            shortcut: () => ({
              steps: `① ${tex('PH \\parallel x')}축이므로 엇각에 의해 직선 ${tex('PF')}가 ${tex('x')}축과 이루는 각도 <strong class="text-amber-300">${tex('60^\\circ')}</strong>이다.<br/>
② 점 ${tex('F')}에서 선분 ${tex('PH')}에 내린 수선의 발을 ${tex('F_1')}이라 하면 ${tex('\\overline{HF_1} = 2p = 4')}이고 ${tex('\\angle FHF_1 = 60^\\circ')}, ${tex('\\cos 60^\\circ = \\dfrac{1}{2}')}이므로 빗변 ${tex('FH')}의 길이는 ${tex('4 \\div \\dfrac{1}{2} = 8')}이다.<br/>
③ 따라서 정삼각형의 한 변의 길이는 <strong class="text-pink-300">${tex('4p = 8')}</strong>이고, ${tex('\\overline{PF} = x_1 + p = 8')}에서 ${tex('x_1 = 3p = 6')}이다.`,
              highlight: "삼각형 PFH가 정삼각형이면 x₁ = 3p, 한 변의 길이는 4p, 직선 PF가 x축과 이루는 각은 60°입니다."
            })
          },
          3: {
            tag: "최단거리 킬러",
            targetTime: "목표 시간: 3초",
            question: () => `포물선 ${tex('y^2 = 8x')} 의 초점 ${tex('F(2, 0)')}과 포물선의 안쪽에 있는 점 ${tex('A(5, 4)')}, 포물선 위를 움직이는 점 ${tex('P')}에 대하여 ${tex('\\overline{PF} + \\overline{PA}')}의 최솟값과 그때의 점 ${tex('P')}의 좌표를 구하시오.`,
            answerBadge: () => `최솟값 ${tex('= 7')}, ${tex('P(2, 4)')}`,
            snap: { p: 2.0, py: 4.0, theta: Math.PI / 3 },
            steps: [
              "포물선의 정의로 PF를 PH로 바꾸기: PF + PA = PH + PA",
              "점 A(5, 4)에서 준선 x = -2에 내린 수선의 발 H'(-2, 4)",
              "PH + PA ≥ AH' = 5 - (-2) = 7 (점 P가 선분 AH' 위에 있을 때 등호 성립)"
            ],
            textbook: () => ({
              steps: `① 점 ${tex('P\\left(\\dfrac{y^2}{8}, y\\right)')} 로 두고 두 거리의 합 ${tex('f(y) = \\overline{PF} + \\overline{PA}')}을 y에 대한 식으로 나타낸다:<br/>
&nbsp;&nbsp;${tex('f(y) = \\left(\\dfrac{y^2}{8} + 2\\right) + \\sqrt{\\left(\\dfrac{y^2}{8} - 5\\right)^2 + (y - 4)^2}')}<br/>
② 이 식의 최솟값을 직접 구하기는 복잡하므로 포물선의 정의 ${tex('\\overline{PF} = \\overline{PH}')}를 이용한다.<br/>
③ ${tex('PH+PA\\ge AH')}이며, ${tex('A=(5,4), H=(-2,y_1)')}이므로 ${tex('AH=\\sqrt{49+(y_1-4)^2}\\ge7')}. 등호에는 ${tex('y_1=4')}가 필요하고, 이때 포물선 위의 점 ${tex('P=(2,4)')}가 H와 A 사이에 놓여 실제 등호가 성립합니다.`,
              warning: "주의: 좌표로 식을 세우면 제곱근이 들어간 복잡한 식이 됩니다. 포물선의 정의로 PF를 PH(점 P에서 준선까지의 거리)로 바꾸면 꺾은선 H→P→A의 길이가 되어, 등호가 성립하는 조건까지 바로 확인할 수 있습니다."
            }),
            shortcut: () => ({
              steps: `① 포물선의 정의 ${tex('\\overline{PF} = \\overline{PH}')}를 이용하면 구하는 값은 <strong class="text-pink-300">${tex('\\overline{PH} + \\overline{PA}')}</strong>의 최솟값이다.<br/>
② 꺾인 선분 ${tex('A \\to P \\to H')}의 길이는 점 ${tex('P')}가 점 ${tex('A(5, 4)')}에서 준선 ${tex('x = -2')}에 내린 수선, 즉 <strong>수평선(${tex('y_1 = 4')}) 위에 있어 일직선이 될 때</strong> 가장 짧다.<br/>
③ 따라서 최솟값은 ${tex('x_A - (-p) = 5 - (-2) =')} <strong class="text-amber-300">${tex('7')}</strong>이고, 그때의 점은 ${tex('P(2, 4)')}이다.`,
              highlight: "포물선의 안쪽에 있는 점 A에 대하여, 포물선 위의 점 P에서 PF + PA의 최솟값은 점 A에서 준선까지의 거리 x_A + p 입니다."
            })

        }
      },

      2: {
        badge: "장면 2 · 초점을 지나는 현의 두 부분의 길이 a, b: $\\frac{1}{a}+\\frac{1}{b}=\\frac{1}{p}$ 와 cosθ",
        hint: "초점을 지나는 현의 끝점 A 또는 B를 끌어 돌려 보며(a = AF, b = BF), <span class='text-sky-300 font-bold'>$\\frac{1}{a}+\\frac{1}{b}=\\frac{1}{p}$</span>가 항상 성립함과 직각삼각형 ABE에서 <span class='text-amber-300 font-bold'>$\\cos θ=\\frac{a-b}{a+b}$</span>임을 확인하세요.",
        subTitles: ["① 초점현의 한 부분이 주어질 때", "② 초점이 현을 나누는 비", "③ 축에 수직인 현 (θ=90°)"],
        subData: {
          1: {
            tag: "초점을 지나는 현의 길이 사이의 관계 (킬러 공식)",
            targetTime: "목표 시간: 5초",
            question: () => `포물선 ${tex('y^2 = 8x')} 의 초점 ${tex('F(2, 0)')}을 지나는 직선이 포물선과 만나는 두 점을 ${tex('A, B')}라 하자. ${tex('\\overline{AF} = a, \\; \\overline{BF} = b')}라 할 때, ${tex('a = 8')} 이면 선분 ${tex('\\overline{BF} = b')}의 길이와 직선 ${tex('AB')}의 양의 기울기 ${tex('m = \\tan\\theta')}를 구하시오.`,
            answerBadge: () => `${tex('b = \\dfrac{8}{3}')}, 기울기 ${tex('m = \\sqrt{3}')}`,
            snap: { p: 2.0, py: 4.0, theta: Math.PI / 3 },
            steps: [
              "준선 x = -p 및 수선의 발 A', B' 연결 (AA' = a, BB' = b)",
              "점 B에서 AA'에 내린 수선의 발 E, 직각삼각형 ABE (한 변 a - b, 빗변 a + b)",
              "$\\frac{1}{a}+\\frac{1}{b}=\\frac{1}{p}$ 와 $\\cos θ=\\frac{a-b}{a+b}$"
            ],
            textbook: () => ({
              steps: `① ${tex('\\overline{AF} = x_A + 2 = 8 \\implies x_A = 6, \\; y_A = \\sqrt{48} = 4\\sqrt{3}')}<br/>
② 두 점 ${tex('F(2, 0), A(6, 4\\sqrt{3})')}을 지나는 직선의 기울기:<br/>
&nbsp;&nbsp;${tex('m = \\dfrac{4\\sqrt{3}}{6 - 2} = \\sqrt{3} \\implies y = \\sqrt{3}(x - 2)')}<br/>
③ 포물선 ${tex('y^2 = 8x')} 와 연립: ${tex('3(x - 2)^2 = 8x \\implies 3x^2 - 20x + 12 = 0')}<br/>
④ ${tex('(x - 6)(3x - 2) = 0 \\implies x_B = \\dfrac{2}{3} \\implies b = x_B + 2 = \\dfrac{8}{3}')} 도출.`,
              warning: "주의: 직선의 방정식을 세워 포물선의 방정식과 연립하고 이차방정식의 근을 구하면 계산이 매우 길어집니다."
            }),
            shortcut: () => ({
              steps: `① 초점을 지나는 현의 두 부분의 길이 ${tex('a, b')} 사이에는 <strong class="text-sky-300">${tex('\\dfrac{1}{a} + \\dfrac{1}{b} = \\dfrac{1}{p}')}</strong>이 성립하므로 ${tex('p = 2, a = 8')}을 대입한다:<br/>

    const lb = Math.hypot(b.x - a.x, b.y - a.y) || 1, lc = Math.hypot(c.x - a.x, c.y - a.y) || 1;
    let bx = (b.x - a.x) / lb + (c.x - a.x) / lc, by = (b.y - a.y) / lb + (c.y - a.y) / lc;

  // [표시 보강] 평행 표시(화살촉 ››): 선분 p–q의 가운데에 그립니다. 평행한 두 선분에 같은 개수를 그려 '평행'을 보입니다.
  function drawParallelMark(p, q, color = '#fde047', count = 1, lensGroup = 'all') {

        c.lineTo(t.x + d.x * 3, t.y + d.y * 3);

  /* ===== 원본 그대로: 초점현(Focal Chord) 교점 A, B 정밀 계산 (원본 918–951행) ===== */
    function getFocalChordPoints(p, theta) {
      const minAng = (18 * Math.PI) / 180;
      const maxAng = (162 * Math.PI) / 180;
      const safeTheta = Math.max(minAng, Math.min(maxAng, theta));

      const sinT = Math.sin(safeTheta);
      const cosT = Math.cos(safeTheta);

      // (t sinθ)^2 = 4p(p + t cosθ) => sin^2(θ) t^2 - 4p cos(θ) t - 4p^2 = 0
      const A_q = sinT * sinT;
      const B_q = -4 * p * cosT;
      const C_q = -4 * p * p;

      const D = B_q * B_q - 4 * A_q * C_q;
      const sqrtD = Math.sqrt(Math.max(0, D));

      const t1 = (-B_q + sqrtD) / (2 * A_q); // 양수 (점 A)
      const t2 = (-B_q - sqrtD) / (2 * A_q); // 음수 (점 B)

      const A = { x: p + t1 * cosT, y: t1 * sinT };
      const B = { x: p + t2 * cosT, y: t2 * sinT };

      // 독립적인 실제 유클리드 거리 측정 (역산 속임수 배제)
      const realAF = Math.hypot(A.x - p, A.y);
      const realBF = Math.hypot(B.x - p, B.y);

      return {
        A,
        B,
        a: realAF,
        b: realBF,
        safeTheta

        const opts = { color: '#a7f3d0', r: 6.5, label: `A(${fmtNum(A.x)}, ${fmtNum(A.y)})`, dx: 10, dy: -14,
          drag: (w) => { CUR.a0y = Math.max(-6, Math.min(6.5, w.y)); CUR.a0x = Math.max(0, Math.min(8, w.x)); } };
        if (NODRAG) BOARD.point([A.x, A.y], opts); else BOARD.handle('A0', [A.x, A.y], opts);
        if (state.steps[1]) {
          drawChalkLine(P.x, P.y, H.x, H.y, '#38bdf8', 2.6, false, true, 0, 'def');
          drawEqualTickMarks(P, H, '#38bdf8', 0, 'def'); drawEqualTickMarks(P, F, '#f472b6', 0, 'def');
          drawChalkPoint(H.x, H.y, 4.5, '#38bdf8', 'H', { x: -15, y: -10 }, 0, 'def');
        }
        if (state.steps[2]) {
          drawChalkLine(A.x, A.y, Hp.x, Hp.y, '#34d399', 2.2, true, true, 1, 'sim');
          drawRightAngleMark(Hp, { x: 0, y: 1 }, { x: 1, y: 0 }, 10, '#34d399', 1, 'sim');
          drawChalkPoint(Hp.x, Hp.y, 4.5, '#34d399', Math.abs(py-A.y)<1e-9 ? 'H = H′' : 'H′', { x: -15, y: 18 }, 1, 'sim');
        }
        if (state.steps[3]) {
          drawChalkPoint(Pstar.x, Pstar.y, 4.5, attainable ? '#34d399' : '#fb7185', attainable ? '등호 위치 P*' : '선분 밖의 교점', { x: 8, y: 18 }, 2, 'sim');
          const PA = Math.hypot(P.x-A.x, P.y-A.y);
          drawBottomTapeBanner(rect,
            attainable ? `PF + PA = PH + PA ≥ AH′ = ${fmtNum(A.x+p)} · P*가 선분 AH′ 위에 있으므로 등호 가능`
              : `PF + PA ≥ AH′ = ${fmtNum(A.x+p)}는 하한 · 교점이 선분 밖이므로 이 값은 최솟값이 아닙니다`,
            [{val:PF,label:`PF = PH (${fmtNum(PF)})`,color:'#38bdf8'},{val:PA,label:`PA (${fmtNum(PA)})`,color:'#fde047'}],2);
        }
        return;
      }
      drawChalkLine(P.x, P.y, H.x, H.y, '#38bdf8', 2.6, false, false, 0, 'def');
      drawChalkLine(F.x, F.y, H.x, H.y, '#fbbf24', 2.2, false, false, 0, 'def');
      drawChalkPoint(H.x, H.y, 4.5, '#38bdf8', 'H', { x: -15, y: -10 }, 0, 'def');
      if (state.steps[1]) {
        drawEqualTickMarks(P, H, '#38bdf8', 0, 'def'); drawEqualTickMarks(P, F, '#f472b6', 0, 'def');
      }
      if (state.steps[2]) {
        // 필요한 보조선은 F에서 PH에 내린 수선 하나: HF₁=2p.
        const F1 = { x: p, y: py };
        drawChalkLine(F.x, F.y, F1.x, F1.y, '#34d399', 2.2, true, true, 1, 'sim');
        drawChalkPoint(F1.x, F1.y, 4, '#34d399', 'F₁', { x: 8, y: -12 }, 1, 'sim');
        drawRightAngleMark(F1, {x:-1,y:0}, {x:0,y:py>=0?-1:1}, 10, '#34d399', 1, 'sim');
        BOARD.text([0,py], `HF₁ = 2p`, {color:'#34d399',size:13,align:'center',dy:-15});
        if (state.subType === 2 && Math.abs(PF-FH) < 1e-8) {
          drawEqualTickMarks(F,H,'#fbbf24',1,'sim');
          drawEqAngle(H,F1,F,'#fde047',1,26,'60°','sim');
        }
      }
      if (state.steps[3]) {
        withAlpha(lensAlpha('def'),()=>BOARD.poly([P,F,H],{fill:'#f472b6',fillAlpha:.09,stroke:false,part:2}));
        drawBottomTapeBanner(rect, state.subType===1
          ? `PF = PH = x₁+p · FH² = (2p)²+y₁² = 4p·PF · 둘레 = ${fmtNum(2*PF+FH)}`
          : Math.abs(PF-FH)<1e-8 ? `HF₁ = 2p, cos 60° = 1/2 ⇒ FH = 4p · x₁ = 3p`
          : `현재 PF ≈ ${fmtNum(PF)}, FH ≈ ${fmtNum(FH)} · 정삼각형 조건은 PF = FH일 때만 성립`,
          [{val:px,label:`x₁ (${fmtNum(px)})`,color:'#f472b6'},{val:p,label:`p (${fmtNum(p)})`,color:'#38bdf8'}],2);
      }
    }

    // =========================================================================
    // [모드 2 렌더링] 기출 1 - 초점현 역수합 ($\\frac{1}{a}+\\frac{1}{b}=\\frac{1}{p}$) & 직각삼각형 cosθ
    // =========================================================================
    function renderMode2(p, F, rect) {
      const chord = getFocalChordPoints(p, state.theta);
      const { A, B, a, b, safeTheta } = chord;
      const Ap = { x: -p, y: A.y };
      const Bp = { x: -p, y: B.y };
      const E = { x: B.x, y: A.y }; // 점 B에서 선분 AA'에 내린 수선의 발 E (AE = |a - b|)

      // 초점현 AB 본체
      drawChalkLine(A.x, A.y, B.x, B.y, '#f8fafc', 2.6, false, false, 0, 'all');

      // Step 1 (partIdx = 0): 준선 및 수선의 발 A', B'
      if (state.steps[1]) {
        drawDirectrix(p, rect.height, 0, 'def');
        drawChalkLine(A.x, A.y, Ap.x, Ap.y, '#f472b6', 2.3, false, true, 0, 'def');
        drawChalkLine(B.x, B.y, Bp.x, Bp.y, '#38bdf8', 2.3, false, true, 0, 'def');

        drawRightAngleMark(Ap, { x: 0, y: -1 }, { x: 1, y: 0 }, 10, '#f472b6', 0, 'def');
        drawRightAngleMark(Bp, { x: 0, y: 1 }, { x: 1, y: 0 }, 10, '#38bdf8', 0, 'def');

        drawEqualTickMarks(A, Ap, '#f472b6', 0, 'def');
        drawEqualTickMarks(A, F, '#f472b6', 0, 'def');
        drawEqualTickMarks(B, Bp, '#38bdf8', 0, 'def');
        drawEqualTickMarks(B, F, '#38bdf8', 0, 'def');

        drawChalkPoint(Ap.x, Ap.y, 4.5, '#f472b6', NODRAG ? "A'" : `A' (a=${fmtNum(a)})`, NODRAG ? { x: -14, y: -8 } : { x: -92, y: -8 }, 0, 'def');
        drawChalkPoint(Bp.x, Bp.y, 4.5, '#38bdf8', NODRAG ? "B'" : `B' (b=${fmtNum(b)})`, NODRAG ? { x: -14, y: 16 } : { x: -92, y: 16 }, 0, 'def');
      }

      // Step 2 (partIdx = 1): 직각사다리꼴 AA'B'B 및 직각삼각형 ABE (밑변 a-b, 빗변 a+b)
      if (state.steps[2]) {
        withAlpha(lensAlpha('sim'), () => {
          BOARD.poly([A, Ap, Bp, B], { fill: '#fbbf24', fillAlpha: 0.06, stroke: false, part: 1 });
          // 직각삼각형 ABE 내부 강조
          BOARD.poly([A, B, E], { fill: '#34d399', fillAlpha: 0.14, stroke: false, part: 1 });
        });

        // 수선 BE 및 직각 기호
        if (Math.abs(a - b) > 1e-8) {
          drawChalkLine(B.x, B.y, E.x, E.y, '#34d399', 2.0, true, false, 1, 'sim');
          drawRightAngleMark(E, { x: A.x >= E.x ? 1 : -1, y: 0 }, { x: 0, y: -1 }, 10, '#34d399', 1, 'sim');
          drawChalkPoint(E.x, E.y, 4.0, '#34d399', NODRAG ? 'E' : `E (|a-b|=${fmtNum(Math.abs(a - b))})`, NODRAG ? { x: 8, y: -12 } : { x: -45, y: -12 }, 1, 'sim');
          // [표시 보강] θ에 값(°)을 넣고, AE ∥ x축에 의한 엇각을 초점 F에도 같은 색·같은 표시로 그립니다(같은 각이 어디인지)
          const eDir = E.x >= A.x ? 1 : -1;
          const thDeg = Math.abs(Math.atan2(B.y - A.y, (B.x - A.x) * eDir)) * 180 / Math.PI;
          const thTxt = NODRAG ? (spAngle(thDeg) ? (safeTheta <= Math.PI / 2 + 1e-6 ? 'θ=' : '') + spAngle(thDeg) : 'θ') : (safeTheta <= Math.PI / 2 + 1e-6 ? 'θ=' : '') + fmtNum(thDeg, 1) + '°';
          drawEqAngle(A, { x: A.x + eDir, y: A.y }, B, '#fde047', 1, 28, thTxt, 'sim');
          drawEqAngle(F, { x: F.x - eDir, y: 0 }, A, '#fde047', 1, 28, thTxt, 'sim');
        } else {
          // [표시 보강] θ = 90° (통경): 초점 F에서 x축과 초점현이 직각
          drawRightAngleMark(F, { x: 1, y: 0 }, { x: 0, y: A.y >= 0 ? 1 : -1 }, 12, '#fde047', 1, 'sim');
          queueRightText(F, { x: F.x + 1, y: 0 }, { x: F.x, y: A.y >= 0 ? 1 : -1 }, '#fde047', 34, 'sim');
        }

        // 초점 분할선 (-p, 0) ~ (p, 0)
        drawChalkLine(-p, 0, p, 0, '#fbbf24', 2.2, true, false, 1, 'sim');
      }

      // Step 3 (partIdx = 2): 역수합 $\\frac{1}{a}+\\frac{1}{b}=\\frac{1}{p}$ 및 $\\cos θ=\\frac{a-b}{a+b}$ 비율 줄자 배너
      if (state.steps[3]) {
        withAlpha(lensAlpha('all'), () => {
          BOARD.text(NODRAG ? [F.x + 0.66 * (A.x - F.x), F.y + 0.66 * (A.y - F.y)] : [(A.x + F.x) / 2, (A.y + F.y) / 2], `a = ${fmtNum(a)}`, { color: '#f9a8d4', size: 12, align: 'left', dx: 12, part: 2 });
          BOARD.text([(B.x + F.x) / 2, (B.y + F.y) / 2], `b = ${fmtNum(b)}`, { color: '#7dd3fc', size: 12, align: 'left', dx: 12, dy: 12, part: 2 });
        });

        const invSum = 1 / a + 1 / b;
        const cosVal = Math.cos(safeTheta);

        drawBottomTapeBanner(
          rect,
          `$\\frac{1}{a}=\\frac{1}{${fmtNum(a)}}$, $\\frac{1}{b}=\\frac{1}{${fmtNum(b)}}$ → $\\frac{1}{a}+\\frac{1}{b}=\\frac{1}{p}=${fmtNum(invSum, 3)}$ | $\\cos θ=\\frac{a-b}{a+b}$ = ${fmtNum(cosVal, 3)}`,
          [
            { val: a, label: `AF = a = ${fmtNum(a)}`, color: '#f472b6', bg: 'rgba(244, 114, 182, 0.32)' },
            { val: b, label: `BF = b = ${fmtNum(b)}`, color: '#38bdf8', bg: 'rgba(56, 189, 248, 0.32)' }
          ],
          2
        );
      }
    }

    // =========================================================================
    // [모드 3 렌더링] 기출 2 - 초점현 원 & 준선 접함(d=R) & 두 접선 직교(∠AH_MB = 90°)
    // =========================================================================
    function renderMode3(p, F, rect) {
      const {A,B,a,b}=getFocalChordPoints(p,state.theta), M={x:(A.x+B.x)/2,y:(A.y+B.y)/2};
      const Ap={x:-p,y:A.y}, Bp={x:-p,y:B.y}, Q={x:-p,y:M.y}, R=(a+b)/2;
      drawDirectrix(p,rect.height,0,'def');
      drawChalkLine(A.x,A.y,B.x,B.y,'#e2e8f0',2.5,false,false,0,'all');
      drawChalkPoint(M.x,M.y,4.5,'#38bdf8','M',{x:10,y:-12},0,'def');
      if(state.subType!==2 || state.steps[2]) BOARD.circle(M,R,{color:'#38bdf8',width:2.2,fill:'#38bdf8',fillAlpha:.04});
      if(state.subType===2){
        // 接点에서의 두 접선은 문제 조건, 직각·보조원은 단계별로 공개.
        drawChalkLine(Q.x,Q.y,A.x,A.y,'#c084fc',2.2,false,true,0,'tan');
        drawChalkLine(Q.x,Q.y,B.x,B.y,'#c084fc',2.2,false,true,0,'tan');
        drawChalkPoint(Q.x,Q.y,5,'#c084fc','Q',{x:-15,y:-12},0,'tan');
      }
      if(state.steps[1]){
        drawChalkLine(A.x,A.y,Ap.x,Ap.y,'#f472b6',2.2,false,true,0,'def');
        drawChalkLine(B.x,B.y,Bp.x,Bp.y,'#38bdf8',2.2,false,true,0,'def');
        drawChalkPoint(Ap.x,Ap.y,4,'#f472b6','A′',{x:-15,y:-10},0,'def');
        drawChalkPoint(Bp.x,Bp.y,4,'#38bdf8','B′',{x:-15,y:18},0,'def');
        drawEqualTickMarks(A,Ap,'#f472b6',0,'def'); drawEqualTickMarks(A,F,'#f472b6',0,'def');
        drawEqualTickMarks(B,Bp,'#38bdf8',0,'def'); drawEqualTickMarks(B,F,'#38bdf8',0,'def');
      }
      if(state.steps[2]){
        BOARD.poly([A,Ap,Bp,B],{fill:'#34d399',fillAlpha:.07,stroke:false});
        drawChalkLine(M.x,M.y,Q.x,Q.y,'#fbbf24',2.6,true,true,1,'sim');
        drawChalkLine(Ap.x,Ap.y,Bp.x,Bp.y,'#34d399',2.0,false,false,1,'sim');
        drawEqualTickMarks(A,M,'#34d399',1,'sim'); drawEqualTickMarks(M,B,'#34d399',1,'sim');
        drawEqualTickMarks(Ap,Q,'#34d399',1,'sim'); drawEqualTickMarks(Q,Bp,'#34d399',1,'sim');
        drawRightAngleMark(Q,{x:0,y:1},{x:1,y:0},10,'#fbbf24',1,'sim');
        if(state.subType!==2)drawChalkPoint(Q.x,Q.y,4.5,'#fbbf24','H_M',{x:-15,y:-10},1,'sim');
      }
      if(state.steps[3]){
        if(state.subType===2){
          drawRightAngleMark(Q,{x:A.x-Q.x,y:A.y-Q.y},{x:B.x-Q.x,y:B.y-Q.y},18,'#e879f9',2,'tan');
          drawChalkLine(Q.x,Q.y,F.x,F.y,'#fde047',2.2,true,false,2,'tan');
          drawRightAngleMark(F,{x:A.x-F.x,y:A.y-F.y},{x:Q.x-F.x,y:Q.y-F.y},10,'#fde047',2,'tan');
        }
        drawBottomTapeBanner(rect,state.subType===2
          ? `Q는 준선 위 · y_A y_B = −4p² ⇒ 접선 기울기의 곱 −1 · QF ⊥ AB`
          : `사다리꼴의 중점 연결: MH_M = (AA′+BB′)/2 = (a+b)/2 = R (${fmtNum(R)})`,
          [{val:a,label:`AF (${fmtNum(a)})`,color:'#f472b6'},{val:b,label:`BF (${fmtNum(b)})`,color:'#38bdf8'}],2);
      }
    }

    // =========================================================================
    // [모드 4 렌더링] 기출 3 - 접선 마름모 TFPH & 꼭짓점 접선 페달 삼각형 닮음
    // =========================================================================
    function renderMode4(p, F, rect) {
      // 클램핑 없이 원본 state.py 그대로 사용하여 점 P와 마름모 꼭짓점 100% 일치 보장
      const py = state.py;
      const px = (py * py) / (4 * p);
      const P = { x: px, y: py };
      const H = { x: -p, y: py };
      const T = { x: -px, y: 0 };
      const K = { x: 0, y: py / 2 }; // 마름모 대각선 교점 겸 초점 F에서 내린 수선의 발 (항상 y축 위!)
      const O = { x: 0, y: 0 };

      const realTF = Math.hypot(T.x - F.x, T.y - F.y);
      const realFP = Math.hypot(F.x - P.x, F.y - P.y);
      const realFK = Math.hypot(F.x - K.x, F.y - K.y);

      const dirX = P.x - T.x;
      const dirY = P.y - T.y;
      const len = Math.hypot(dirX, dirY);
      const ux = len > 1e-6 ? dirX / len : 0;
      const uy = len > 1e-6 ? dirY / len : 1;
      const pedalScene = state.subType === 3;

      // Step 1 (partIdx = 0): 준선, 접선 TP, x절편 T(-x1, 0), 수선의 발 H 및 직각 마크
      if (state.steps[1]) {
        drawDirectrix(p, rect.height, 0, 'def');

        drawChalkLine(T.x - ux * 3, T.y - uy * 3, P.x + ux * 3, P.y + uy * 3, '#c084fc', 2.5, false, true, 0, 'tan');
        drawRightAngleMark(H, { x: 0, y: py >= 0 ? -1 : 1 }, { x: 1, y: 0 }, 10, '#38bdf8', 0, 'def');

        drawChalkPoint(T.x, T.y, 6, '#c084fc', NODRAG ? 'T' : `T(${fmtNum(T.x)}, 0)`, NODRAG ? { x: -14, y: 20 } : { x: -42, y: 20 }, 0, 'tan');
        drawChalkPoint(H.x, H.y, 5, '#38bdf8', NODRAG ? 'H' : `H(-${fmtNum(p, 1)}, ${fmtNum(py)})`, NODRAG ? { x: -14, y: -10 } : { x: -102, y: -8 }, 0, 'def');
      }

      // 수선의 발 장면에서는 Step 1의 중점 K를 설명과 함께 공개합니다.
      if (state.steps[pedalScene ? 1 : 3]) {
        const part = pedalScene ? 0 : 2;
        drawChalkLine(F.x, F.y, H.x, H.y, '#fbbf24', 2.2, true, false, part, 'tan');
        if (pedalScene && Math.abs(py) > 0.15) {
          drawEqualTickMarks(T, K, '#fde047', 0, 'tan');
          drawEqualTickMarks(K, P, '#fde047', 0, 'tan');
        }
        const label = NODRAG ? 'K' : `K(0, ${fmtNum(py / 2)})${state.steps[3] ? ` [FK=${fmtNum(realFK)}]` : ''}`;
        drawChalkPoint(K.x, K.y, 5, '#fde047', label, NODRAG ? { x: 12, y: 24 } : { x: 44, y: 40 }, part, 'tan');
      }

      // Step 2 (partIdx = 1): 마름모 TFPH 네 변 하이라이트 및 등변 마크
      if (state.steps[2]) {
        withAlpha(lensAlpha('def'), () => BOARD.poly([T, F, P, H], { fill: '#c084fc', fillAlpha: 0.12, stroke: false, part: 1 }));

        drawChalkLine(T.x, T.y, F.x, F.y, '#e879f9', 2.6, false, false, 1, 'def');
        drawChalkLine(F.x, F.y, P.x, P.y, '#e879f9', 2.6, false, false, 1, 'def');
        drawChalkLine(P.x, P.y, H.x, H.y, '#e879f9', 2.6, false, false, 1, 'def');
        drawChalkLine(H.x, H.y, T.x, T.y, '#e879f9', 2.6, false, false, 1, 'def');

        if (Math.abs(py) > 0.15) {
          drawEqualTickMarks(T, F, '#fde047', 1, 'def');
          drawEqualTickMarks(F, P, '#fde047', 1, 'def');
          drawEqualTickMarks(P, H, '#fde047', 1, 'def');
          drawEqualTickMarks(H, T, '#fde047', 1, 'def');
        }

        // 정사각형(x1 = p)일 때 ∠TFP = 90° 표시
        if (Math.abs(px - p) < 1e-8 && Math.abs(py) > 0.2) {
          drawRightAngleMark(F, { x: -1, y: 0 }, { x: 0, y: py >= 0 ? 1 : -1 }, 11, '#fde047', 1, 'tan');
        }
      }

      // Step 2의 마름모 대각선 설명에 맞춰 ∠FKP의 직각을 표시합니다.
      if (state.steps[pedalScene ? 2 : 3] && Math.abs(py) > 0.15) {
        const vKF = { x: F.x - K.x, y: F.y - K.y };
        const lKF = Math.hypot(vKF.x, vKF.y);
        drawRightAngleMark(K, { x: ux, y: uy }, { x: vKF.x / lKF, y: vKF.y / lKF }, 14, '#fde047', pedalScene ? 1 : 2, 'tan');
      }

      // Step 3 (partIdx = 2): 대각선 FH 수직이등분점 K(0, y1/2) & 페달 직각삼각형 △OFK ~ △KFP
      if (state.steps[3]) {
        // y축(꼭짓점 접선) 위 페달 직각삼각형 OFK 내부 강조
        withAlpha(lensAlpha('sim'), () => BOARD.poly([O, F, K], { fill: '#fbbf24', fillAlpha: 0.16, stroke: false, part: 2 }));

        drawChalkLine(O.x, O.y, K.x, K.y, '#fde047', 2.5, false, true, 2, 'sim');

        if (Math.abs(py) > 0.15) {
          drawRightAngleMark(O, { x: 1, y: 0 }, { x: 0, y: py >= 0 ? 1 : -1 }, 9, '#34d399', 2, 'sim');
          // [표시 보강] △OFK ~ △KFP 의 같은 각: 초점 F에서 ∠OFK = ∠KFP (마름모 대각선 FH가 ∠TFP를 이등분) — 같은 색·같은 표시와 각도 값
          drawEqAngle(F, T, K, '#34d399', 1, 28, null, 'sim');
          drawEqAngle(F, K, P, '#34d399', 1, 28, null, 'sim');
        }

        drawBottomTapeBanner(
          rect,
          Math.abs(py)<1e-9 ? `P가 꼭짓점이면 접선은 y축 · K=O · FK=p=${fmtNum(p)}. 사각형과 닮음 삼각형은 퇴화합니다.` : `마름모 TFPH 한 변 = ${fmtNum(realFP)} | 둘레 = ${fmtNum(4 * realFP)} | TP ⊥ FH (90°) | FK² = p(x₁+p) = ${fmtNum(realFK * realFK)}`,
          [
            { val: Math.max(0.05, px), label: `OT = x₁ = ${fmtNum(px)}`, color: '#c084fc', bg: 'rgba(192, 132, 252, 0.32)' },
            { val: p, label: `OF = p = ${fmtNum(p)}`, color: '#fde047', bg: 'rgba(250, 204, 21, 0.32)' }
          ],
          2
        );
      }
    }


  /* ======================================================================
     [2.0] 셸 연결: 셸 상태 s → 원본 state, 실시간 값(원본 updateLiveMonitor), 그리기, 장면 정의
     ====================================================================== */
  const D2R = Math.PI / 180;
  function sync(s, m, sub) {
    state.mode = m;
    state.subType = sub;
    state.conceptSwitch = s.lens;
    state.activePartIdx = s.part == null ? null : s.part;
    state.p = s.p;
    state.py = s.py;
    state.theta = s.th * D2R;
    state.pointA0 = { x: s.a0x, y: s.a0y };
    state.steps = { 1: s.step >= 1, 2: s.step >= 2, 3: s.step >= 3 };
  }

  // 원본 updateLiveMonitor: 4개 실시간 값과 실측 오차
  function statsOf(m) {
    const p = state.p, py = state.py;
    const px = (py * py) / (4 * p);
    const F = { x: p, y: 0 }, P = { x: px, y: py }, H = { x: -p, y: py };
    const realPF = Math.hypot(P.x - F.x, P.y - F.y);
    const realPH = Math.hypot(P.x - H.x, P.y - H.y);
    const realFH = Math.hypot(F.x - H.x, F.y - H.y);
    const chord = getFocalChordPoints(p, state.theta);
    const { A, B, a, b, safeTheta } = chord;
    const sumInv = 1 / a + 1 / b;
    const invP = 1 / p;
    let relErr = 0;
    let r;
    if (m === 1) {
      relErr = (Math.abs(realPF - realPH) / Math.max(1e-6, realPF)) * 100;
      r = [['초점 F(p, 0) & 점 P 좌표', `F(${fmtNum(p, 1)},0) | P(${fmtNum(px)}, ${fmtNum(py)})`], ['측정한 거리 PF와 PH', `${fmtNum(realPF)} = ${fmtNum(realPH)} (일치)`]];
      if (state.subType === 3) {
        const A0 = state.pointA0;
        const realPA = Math.hypot(P.x - A0.x, P.y - A0.y);
        const xStar=A0.y*A0.y/(4*p), attainable=xStar<=A0.x+1e-9;
        r.push(['현재 거리 합 PF + PA',`≈ ${fmtNum(realPF+realPA)}`],[attainable?'등호 가능한 최솟값':'등호가 불가능한 하한',attainable?`${fmtNum(A0.x+p)} · P*(${fmtNum(xStar)}, ${fmtNum(A0.y)})`:`AH′=${fmtNum(A0.x+p)} · 교점은 선분 AH′ 밖`]);
      } else {
        r.push(['선분 FH의 길이(측정값)', `|FH| = ${fmtNum(realFH)}`], ['삼각형 PFH의 둘레(측정값)', `둘레 = ${fmtNum(realPF + realPH + realFH)}`]);
      }
    } else if (m === 2) {
      relErr = (Math.abs(sumInv - invP) / invP) * 100;
      const cosVal = Math.cos(safeTheta);
      const ratioCos = (a - b) / (a + b);
      r = [['현의 두 부분의 길이 a(AF), b(BF)', `a = ${fmtNum(a)} | b = ${fmtNum(b)}`], ['현 AB의 길이 |AB| = a + b', `|AB| = ${fmtNum(a + b)}`],
        ['$\\frac{1}{a}+\\frac{1}{b}$ 와 $\\frac{1}{p}$', `${sumInv.toFixed(4)} = ${invP.toFixed(4)}`], ['직각삼각형 $\\cos θ=\\frac{a-b}{a+b}$', `cosθ = ${fmtNum(cosVal, 3)} (${fmtNum(ratioCos, 3)})`]];
    } else if (m === 3) {
      const M = { x: (A.x + B.x) / 2, y: (A.y + B.y) / 2 };
      const realD = Math.abs(M.x - (-p));
      const realR = 0.5 * Math.hypot(A.x - B.x, A.y - B.y);
      relErr = (Math.abs(realD - realR) / realR) * 100;
      r = [['현의 두 부분의 길이 a(AF), b(BF)', `a = ${fmtNum(a)} | b = ${fmtNum(b)}`], ['원의 중심 M(x_M, y_M) 좌표', `M(${fmtNum(M.x)}, ${fmtNum(M.y)})`],
        ['중심~준선 거리 d와 반지름 R', `d=${fmtNum(realD)} | R=${fmtNum(realR)} (접함)`], ['두 접선이 이루는 각 ∠AQB, QF ⊥ AB', '∠AQB = 90.0° | QF ⊥ AB']];
    } else {
      const T = { x: -px, y: 0 };
      const K = { x: 0, y: py / 2 };
      const realTF = Math.hypot(T.x - F.x, T.y - F.y);
      const realHT = Math.hypot(H.x - T.x, H.y - T.y);
      const realFK = Math.hypot(F.x - K.x, F.y - K.y);
      relErr = (Math.abs(realTF - realPF) / Math.max(1e-6, realPF)) * 100;
      r = [['접점 P(x₁, y₁) & x절편 T(-x₁, 0)', `P(${fmtNum(px)}, ${fmtNum(py)}) | T(${fmtNum(T.x)}, 0)`], ['마름모의 네 변 TF=FP=PH=HT', `${fmtNum(realTF)} = ${fmtNum(realPF)} = ${fmtNum(realHT)}`],
        ['사각형과 접선',Math.abs(py)<1e-9?'꼭짓점에서 사각형은 퇴화 · 접선은 y축':`둘레 = ${fmtNum(4*realPF)} | 대각선 수직 90°`], ['선분 FK의 제곱 FK² = p(x₁ + p)', `FK=${fmtNum(realFK)} | FK²=${fmtNum(realFK * realFK)}`]];
    }
    return { relErr, r };
  }

  const PART_COLORS = ['sky', 'amber', 'violet'];
  // 관찰 카드는 조작할 대상을 안내합니다. 수치 풀이와 결론은 단계별 해설에서 공개합니다.
  const OBSERVATIONS = {
    '1-1': ['초점과 준선', '점 P에서 준선에 내린 수선', '삼각형 PFH의 세 변'],
    '1-2': ['초점과 준선', '정삼각형의 세 변 비교', '직각삼각형의 길이 관계'],
    '1-3': ['움직이는 P와 고정점 A', '준선으로 바꾼 최단 경로', '등호가 가능한 위치'],
    '2-1': ['초점을 지나는 현', '준선까지의 두 수선', '두 길이의 관계식'],
    '2-2': ['초점현과 나뉜 두 부분', '같은 직선의 기울기 삼각형', '주어진 길이의 비'],
    '2-3': ['축에 수직인 초점현', '두 수선과 사각형', '대칭으로 구하는 길이와 넓이'],
    '3-1': ['초점현을 지름으로 하는 원', '준선에 내린 중심의 수선', '반지름과 중심 거리의 비교'],
    '3-2': ['초점현의 양 끝과 접선', '두 접선의 교점 Q', '접선과 초점현의 각'],
    '3-3': ['기울어진 초점현', '현의 중점과 준선', '반지름과 중심 거리의 비교'],
    '4-1': ['접점과 접선의 x절편', '사각형 TFPH의 변 길이', '대각선과 각의 비교'],
    '4-2': ['접선과 네 꼭짓점', '주어진 사각형의 조건', '필요한 길이와 넓이'],
    '4-3': ['접선과 수선의 발 K', '직각삼각형 KFP', '필요한 길이 계산']
  };
  function viewOf(m, sub) {
    return (s, lab) => {
      const ex = !lab || lab.tab === 'explore';
      NODRAG = !ex;
      // 원본 togglePartHighlight: 조각을 누르면 그 보조선이 켜집니다
      if (ex && s.part != null && s.step < s.part + 1) s.step = s.part + 1;
      if (!ex) { const V = GV[GVKEY(m, sub)].vary.cur(); s = { ...s, p: V.st.p, py: V.st.py, th: V.st.th, a0x: V.st.a0x != null ? V.st.a0x : 5, a0y: V.st.a0y != null ? V.st.a0y : 4, lens: 'all', part: null }; }
      if (!ex && m === 1 && sub === 3 && s.step < 3) s.py = -Math.max(2, GV[GVKEY(m, sub)].vary.cur().q.ay * .7);
      sync(s, m, sub);
      const p = state.p;
      const fourP = Number.isInteger(+(4 * p).toFixed(2)) ? (4 * p).toFixed(0) : (4 * p).toFixed(1);
      const pStr = Number.isInteger(+p.toFixed(2)) ? p.toFixed(0) : p.toFixed(2);
      const st = statsOf(m);
      if (m === 1 && sub === 3 && s.step < 3) st.r = st.r.slice(0, 3);
      if (s.step === 0) st.r = [['초점거리 p · 현재 조작값',`p=${fmtNum(p)} · ${m===1||m===4?'y₁≈'+fmtNum(state.py):'θ≈'+fmtNum(state.theta*180/Math.PI,1)+'°'}`]];
      const colors = ['amber', 'rose', 'sky', 'violet'];
      return {
        chips: [{ k: '포물선', tex: `y^2 = ${fourP}x \\; (p = ${pStr})`, color: 'amber' }, { k: '준선', tex: `x = -${pStr}`, color: 'red' }],
        status: ex ? { tone: 'ok', text: `측정 오차 ${st.relErr.toFixed(3)}%` } : undefined,
        readouts: st.r.map(([label, value], i) => ({ label, value: plainFr(value), color: colors[i], wide: true })),
        parts: OBSERVATIONS[`${m}-${sub}`].map((name, i) => ({ id: i, name, desc: '', value: null, color: PART_COLORS[i] }))
      };
    };
  }

  const RENDER = { 1: renderMode1, 2: renderMode2, 3: renderMode3, 4: renderMode4 };
  function drawOf(m, sub) {
    return (b, s0, v, lab) => {
      const ex = !lab || lab.tab === 'explore', vr = GV[GVKEY(m, sub)].vary, V = vr.cur();
      // 정리·문제 탭은 「새 문제」 변형의 조건(p, 점, 각)으로 그립니다(탐구 탭은 원래 상태 그대로)
      const s = ex ? s0 : { ...s0, p: V.st.p, py: V.st.py, th: V.st.th, a0x: V.st.a0x != null ? V.st.a0x : 5, a0y: V.st.a0y != null ? V.st.a0y : 4, lens: 'all', part: null, step: lab.tab === 'problem' ? 0 : s0.step };
      BOARD = b;
      CUR = s;
      NODRAG = !ex;
      const fk = ex ? 'x' : JSON.stringify(V.q);
      if (!b.thumb && b.__gpFk !== fk) { b.setFocus(ex ? FOCUS : focusOf(V), true); b.__gpFk = fk; }
      if(!ex && m===1 && sub===3 && s.step<3) s.py=-Math.max(2,V.q.ay*.7);
      sync(s, m, sub);
      sink.tape = null;
      if (s.grid) b.grid();
      b.axes();
      const p = state.p;
      const F = { x: p, y: 0 };
      const rect = { width: b.W, height: b.H };
      const hd = (id, pos, o) => (NODRAG ? b.point(pos, { color: o.color, r: o.r, label: o.label, align: o.align, dx: o.dx, dy: o.dy }) : b.handle(id, pos, o));

      LBLQ.length = 0;
      if (lab && lab.tab === 'problem') {
        drawProblemFig(m, sub, V);
        flushAngleLabels();
        v.tape = null;
        return;
      }
      RENDER[m](p, F, rect);
      drawParabolaCurve(p);
      drawChalkPoint(F.x, 0, 5.5, '#f43f5e', NODRAG ? 'F' : `F(${fmtNum(p, 1)}, 0)`, NODRAG && (m === 1 || m === 4) ? { x: 16, y: -10 } : NODRAG && m === 2 ? { x: -14, y: -10 } : { x: 8, y: 18 });

      if (m === 1 || m === 4) {
        const py = state.py;
        const px = (py * py) / (4 * p);
        // [표시 보강] 모드 1의 3단계는 점 P 오른쪽 위에 반사각 α 표시가 오므로, P 이름표를 왼쪽 위로 옮겨 겹치지 않게 합니다.
        const flipP = m === 1 && s.step >= 3 && sub !== 3;
        hd('P', [px, py], { color: 'amber', r: 7.5, label: NODRAG ? (V.Plab || 'P') : s.step===0 ? 'P' : `P ≈ (${fmtNum(px)}, ${fmtNum(py)})`, align: flipP ? 'right' : 'left', dx: flipP ? -12 : 12, dy: py >= 0 ? -16 : 16, drag: (w) => { s.py = clamp(w.y, -8, 8); } });
      } else {
        const chord = getFocalChordPoints(p, state.theta);
        // 원본 handlePointerMove: 초점 F를 중심으로 끝점을 돌려 θ를 정함(20°~160°)
        const turn = (which) => (w) => {
          const vx = which === 'A' ? w.x - s.p : s.p - w.x;
          const vy = which === 'A' ? w.y : -w.y;
          const lo = 20 * D2R, hi = 160 * D2R;
          const ang = vy <= 0.01 ? (vx >= 0 ? lo : hi) : Math.atan2(vy, vx);
          s.th = clamp(ang, lo, hi) / D2R;
        };
        hd('A', [chord.A.x, chord.A.y], { color: 'amber', r: 7.5, label: NODRAG || s.step===0 ? 'A' : `A ≈ (${fmtNum(chord.A.x)}, ${fmtNum(chord.A.y)})`, dx: 12, dy: -14, drag: turn('A') });
        hd('B', [chord.B.x, chord.B.y], { color: 'sky', r: 6.5, label: NODRAG || s.step===0 ? 'B' : `B ≈ (${fmtNum(chord.B.x)}, ${fmtNum(chord.B.y)})`, dx: 12, dy: 14, drag: turn('B') });
      }
      flushAngleLabels(); // [표시 보강] 각도 글자는 곡선·손잡이 위에(가려지지 않게)
      v.tape = sink.tape;
    };
  }

  /*@@GP-VAR-START*/
  /* ==========================================================================
     새 문제(변형) — 장면 1~12 (2026-11-02 선생님 지시: 옛 장면도 문제 탭에 「새 문제」를 붙인다)
     - 탐구 탭(위의 그림·조작·문구)은 그대로입니다. 첫 문제는 원본 그대로이고, 「새 문제」를 누르면 포물선의 p(초점거리)와 점·각을 바꾼 변형이 나옵니다.
     - 문제 탭 그림: 지문에 주어진 점·선과 값만(점의 좌표·답은 풀이 단계 전에는 없음). 정리 탭: 변형의 조건대로 원래 풀이 그림이 단계마다 나타납니다.
     ========================================================================== */
  const gcdG = (a, b) => (b ? gcdG(b, a % b) : Math.abs(a));
  const frG = (n, d) => { const g = gcdG(n, d) || 1; n /= g; d /= g; if (d < 0) { n = -n; d = -d; } return d === 1 ? String(n) : `\\dfrac{${n}}{${d}}`; };
  const frGp = (n, d) => { const g = gcdG(n, d) || 1; n /= g; d /= g; return d === 1 ? String(n) : `${n}/${d}`; };
  const sqG = (n) => { let o = 1, i = n; for (let f = 2; f * f <= i; f++) while (i % (f * f) === 0) { i /= f * f; o *= f; } return [o, i]; };
  const rtG = (n) => { const [o, i] = sqG(n); return i === 1 ? String(o) : (o === 1 ? '' : String(o)) + `\\sqrt{${i}}`; };
  const rtGp = (n) => { const [o, i] = sqG(n); return i === 1 ? String(o) : (o === 1 ? '' : String(o)) + `√${i}`; };
  const halfRt = (n) => { const [o, i] = sqG(n); if (i === 1) return frG(o, 2); return o % 2 === 0 ? (o / 2 === 1 ? '' : String(o / 2)) + `\\sqrt{${i}}` : `\\dfrac{${o}\\sqrt{${i}}}{2}`; }; // √n / 2
  const P2 = (n) => `${tex(n)}`;
  function varGP(list, build) {
    let idx = 0, cur = build(list[0], 0);
    return { cur: () => cur, idx: () => idx, count: list.length, set: (i) => { idx = i; cur = build(list[i], i); return cur; }, next: () => { let i; do { i = Math.floor(Math.random() * list.length); } while (list.length > 1 && i === idx); idx = i; cur = build(list[i], i); return cur; } };
  }
  const gpHTML = (body) => `${body}<div style="margin-top:10px"><button type="button" class="apl-btn sm" data-gp-new>새 문제 (숫자 바꾸기)</button></div>`;
  document.addEventListener('click', (ev) => {
    const hit = ev.target && ev.target.closest && ev.target.closest('[data-gp-new]');
    if (!hit) return;
    const lab = window.lab, sc = lab && lab.scene;
    if (!sc || !sc.vary) return;
    sc.vary.next();
    lab.s.revealed = false;
    lab.setStep(0);
    try { lab._buildReview(); } catch (e) { /* 키트가 바뀌어도 그림은 그대로 */ }
    lab.invalidate(true);
  });
  const GV = {};
  const degOfCos = (n, d) => (Math.acos(n / d) * 180) / Math.PI;
  const tanTex = (n, d) => { const s2 = d * d - n * n, [o, i] = sqG(s2); return i === 1 ? frG(o, n) : (n === 1 ? rtG(s2) : `\\dfrac{${rtG(s2)}}{${n}}`); }; // tanθ (cosθ = n/d)
  const origV = (m, sub) => { const sd = examData[m].subData[sub]; return { question: sd.question(), ans: sd.answerBadge(), textbook: sd.textbook(), shortcut: sd.shortcut(), steps: sd.steps.slice() }; };

  // ---- 1-1 기본 정의: PF = d ----
  GV['1-1'] = {
    list: [{ p: 2, d: 6 }, { p: 1, d: 4 }, { p: 3, d: 12 }, { p: 4, d: 9 }, { p: 1, d: 5 }],
    build(q, i) {
      const { p, d } = q, x1 = d - p, y2 = 4 * p * x1, fh2 = 4 * p * d, fhInt = Number.isInteger(Math.sqrt(fh2));
      const V = { q, st: { p, py: Math.sqrt(y2), th: 60 }, val: [x1, 2 * d + Math.sqrt(fh2)], pts: [[x1, Math.sqrt(y2)], [-p, Math.sqrt(y2)], [p, 0]] };
      if (i === 0) return Object.assign(V, origV(1, 1));
      const per = fhInt ? String(2 * d + Math.sqrt(fh2)) : `${2 * d} + ${rtG(fh2)}`, y1 = rtG(y2);
      V.question = `포물선 ${tex(`y^2 = ${4 * p}x`)} 의 초점을 ${tex('F')}, 준선을 ${tex('l')}이라 하자. 포물선 위의 제1사분면의 점 ${tex('P(x_1, y_1)')}에서 준선 ${tex('l')}에 내린 수선의 발을 ${tex('H')}라 할 때, 선분 ${tex(`\\overline{PF} = ${d}`)} 이다. 이때 ${tex('x_1')}의 값과 삼각형 ${tex('PFH')}의 둘레의 길이를 구하시오.`;
      V.ans = `${tex(`x_1 = ${x1}`)}, 둘레 ${tex(`= ${per}`)}`;
      V.steps = examData[1].subData[1].steps.slice();
      V.textbook = { steps: `① ${tex(`y^2 = ${4 * p}x = 4 \\cdot ${p}x`)} 이므로 초점 ${tex(`F(${p}, 0)`)}, 준선 ${tex(`x = -${p}`)}<br/>
② 두 점 사이의 거리 공식으로 ${tex(`\\overline{PF} = \\sqrt{(x_1 - ${p})^2 + y_1^2} = ${d}`)}<br/>
③ 양변을 제곱하고 ${tex(`y_1^2 = ${4 * p}x_1`)} 대입:<br/>
&nbsp;&nbsp;${tex(`(x_1 - ${p})^2 + ${4 * p}x_1 = ${d * d} \\implies x_1^2 + ${2 * p}x_1 - ${d * d - p * p} = 0 \\implies x_1 = ${x1}, \; y_1 = ${y1}`)}<br/>
④ ${tex(`H(-${p}, ${y1})`)} 와 ${tex(`F(${p}, 0)`)} 사이의 거리 ${tex(`\\overline{FH} = \\sqrt{${2 * p}^2 + (${y1})^2} = \\sqrt{${fh2}} = ${rtG(fh2)}`)}<br/>
⑤ ${tex('\\therefore \\triangle PFH')} 둘레 ${tex(`= \\overline{PF} + \\overline{PH} + \\overline{FH} = ${d} + ${d} + ${rtG(fh2)} = ${per}`)}`, warning: '주의: 초점까지의 거리를 두 점 사이의 거리 공식으로 구하면 이차방정식을 풀어야 해서 계산이 길어집니다. 포물선의 정의를 이용하면 더 간단합니다.' };

  // 분수 표기: 정수이면 그대로, 아니면 \dfrac

  function hyperPath(cx, a, bb, sgn, ymax, n = 160) {
