④ ${tex('(x_1 - 6)(x_1 + 2) = 0 \\implies x_1 = 6')}, 한 변의 길이 ${tex('x_1 + 2 = 8')} 도출.`,

  let BOARD = null;

  /* ===== 원본 그대로: 초점현(Focal Chord) 교점 A, B 정밀 계산 (원본 918–951행) ===== */
    function getFocalChordPoints(p, theta) {
      const minAng = (18 * Math.PI) / 180;

        drawEqualTickMarks(P, H, '#38bdf8', 0, 'def');
        drawEqualTickMarks(P, F, '#f472b6', 0, 'def');

        drawChalkPoint(H.x, H.y, 5, '#38bdf8', `H(-${fmtNum(p, 1)}, ${fmtNum(py)})`, { x: -102, y: -8 }, 0, 'def');
      }

      // Step 3 (partIdx = 2): 삼각형 PFH, 광학 반사(접선·화살표·등각), 또는 최단거리 PA 연결
      if (state.steps[3]) {
        if (state.subType === 3) {
          const A0 = state.pointA0;
          const realPA = Math.hypot(P.x - A0.x, P.y - A0.y);
          const sumDist = realPF + realPA;
          const minDist = A0.x + p;

          drawChalkLine(P.x, P.y, A0.x, A0.y, '#fde047', 2.8, false, true, 2, 'def');
          // [2.0] 원본은 점 A0를 보이지 않는 영역으로도 끌 수 있었습니다 → 보이는 손잡이로 만들어 직접 끌게 함(범위는 원본 그대로)
          withAlpha(lensAlpha('def'), () => BOARD.handle('A0', [A0.x, A0.y], {
            color: '#a7f3d0', r: 6.5, part: 2, label: `점 A(${fmtNum(A0.x, 1)}, ${fmtNum(A0.y, 1)})`, dx: 10, dy: -14,
            drag: (w) => {
              CUR.a0y = Math.max(-6.0, Math.min(6.5, w.y));
              CUR.a0x = Math.max((CUR.a0y * CUR.a0y) / (4 * CUR.p) + 0.8, Math.min(8.0, w.x));
            }
          }));

          drawBottomTapeBanner(
            rect,
            `PF(${fmtNum(realPF)}) + PA(${fmtNum(realPA)}) = ${fmtNum(sumDist)} ≥ 최솟값 AH'(${fmtNum(minDist)})`,
            [
              { val: realPH, label: `PH=PF (${fmtNum(realPF)})`, color: '#38bdf8', bg: 'rgba(56, 189, 248, 0.3)' },
              { val: realPA, label: `PA (${fmtNum(realPA)})`, color: '#fde047', bg: 'rgba(250, 204, 21, 0.3)' }
            ],
            2
          );
        } else {
          if (state.steps[1]) {
            withAlpha(lensAlpha('def'), () => BOARD.poly([P, F, H], { fill: '#f472b6', fillAlpha: 0.09, stroke: false, part: 2 }));

            drawChalkLine(F.x, F.y, H.x, H.y, '#fbbf24', 2.0, true, false, 2, 'def');
            if (Math.abs(realPF - realFH) < 0.15) {
              drawEqualTickMarks(F, H, '#fbbf24', 2, 'def');
              drawAngleArc(F, { x: P.x - F.x, y: P.y - F.y }, { x: H.x - F.x, y: H.y - F.y }, 24, '#fde047', '60°', 2, 'sim');
              // [표시 보강] 정삼각형의 세 내각을 모두 같은 표시(노랑 호 + 60°)로, PH ∥ x축에 의한 엇각 ∠PFx도 같은 60°로 표시
              drawEqAngle(P, F, H, '#fde047', 1, 40, '60°', 'sim', 34);
              drawEqAngle(H, P, F, '#fde047', 1, 24, '60°', 'sim');
              drawEqAngle(F, { x: F.x + 1, y: F.y }, P, '#fde047', 2, 34, '60°', 'sim');
              drawParallelMark(P, H, '#fde047', 1, 'sim');
              drawParallelMark({ x: F.x + 1.5, y: 0 }, { x: F.x + 2.5, y: 0 }, '#fde047', 1, 'sim');
            }
          }

          // 점 P에서의 접선 보조선 및 광학 반사 화살표 (F -> P -> 축 평행 우측 광선)
          if (Math.abs(py) > 0.25) {
            const T = { x: -px, y: 0 };
            const tVec = { x: P.x - T.x, y: P.y - T.y };
            const tLen = Math.hypot(tVec.x, tVec.y);
            const ut = { x: tVec.x / tLen, y: tVec.y / tLen };

            drawChalkLine(P.x - ut.x * 2.5, P.y - ut.y * 2.5, P.x + ut.x * 2.8, P.y + ut.y * 2.8, 'rgba(192, 132, 252, 0.75)', 1.6, true, false, 2, 'tan');
            drawChalkArrow(P.x, P.y, P.x + 3.8, P.y, '#fde047', 2.4, 2, 'tan');

            // 입사각 α = 반사각 α 호 표시
            // [표시 보강] 같은 각 α는 같은 색(노랑)·같은 기호로 표시(이전: 분홍/노랑으로 달라 같은 각임이 안 보임)
            drawAngleArc(P, { x: F.x - P.x, y: F.y - P.y }, { x: -ut.x, y: -ut.y }, 22, '#fde047', 'α', 2, 'tan');
            drawAngleArc(P, { x: 1, y: 0 }, ut, 22, '#fde047', 'α', 2, 'tan');
          }

          // 하단 비율 줄자 배너: PF = x1 + p 분할 시각화
          drawBottomTapeBanner(
            rect,
            `측정값 PF(${fmtNum(realPF)}) = PH(${fmtNum(realPH)}) = x₁(${fmtNum(px)}) + p(${fmtNum(p)}) | △PFH 둘레 = ${fmtNum(realPF + realPH + realFH)}`,
            [
              { val: Math.max(0.05, px), label: `x₁ = ${fmtNum(px)}`, color: '#f472b6', bg: 'rgba(244, 114, 182, 0.32)' },
              { val: p, label: `p = ${fmtNum(p)}`, color: '#38bdf8', bg: 'rgba(56, 189, 248, 0.32)' }
            ],
            2
          );
        }
      }
    }

    // =========================================================================
    // [모드 2 렌더링] 기출 1 - 초점현 역수합 (1/a + 1/b = 1/p) & 직각삼각형 cosθ
    // =========================================================================
    function renderMode2(p, F, rect) {
      const chord = getFocalChordPoints(p, state.theta);
      const { A, B, a, b, safeTheta } = chord;
      const Ap = { x: -p, y: A.y };
      const Bp = { x: -p, y: B.y };
      const E = { x: B.x, y: A.y }; // 점 B에서 선분 AA'에 내린 수선의 발 E (AE = |a - b|)

      // 초점현 AB 본체
      drawChalkLine(A.x, A.y, B.x, B.y, '#f8fafc', 2.6, false, false, 0, 'all');

      // Step 1 (partIdx = 0): 준선 및 수선의 발 A', B'
      if (state.steps[1]) {
        drawDirectrix(p, rect.height, 0, 'def');
        drawChalkLine(A.x, A.y, Ap.x, Ap.y, '#f472b6', 2.3, false, true, 0, 'def');
        drawChalkLine(B.x, B.y, Bp.x, Bp.y, '#38bdf8', 2.3, false, true, 0, 'def');

        drawRightAngleMark(Ap, { x: 0, y: -1 }, { x: 1, y: 0 }, 10, '#f472b6', 0, 'def');
        drawRightAngleMark(Bp, { x: 0, y: 1 }, { x: 1, y: 0 }, 10, '#38bdf8', 0, 'def');

        drawEqualTickMarks(A, Ap, '#f472b6', 0, 'def');
        drawEqualTickMarks(A, F, '#f472b6', 0, 'def');
        drawEqualTickMarks(B, Bp, '#38bdf8', 0, 'def');
        drawEqualTickMarks(B, F, '#38bdf8', 0, 'def');

        drawChalkPoint(Ap.x, Ap.y, 4.5, '#f472b6', `A' (a=${fmtNum(a)})`, { x: -92, y: -8 }, 0, 'def');
        drawChalkPoint(Bp.x, Bp.y, 4.5, '#38bdf8', `B' (b=${fmtNum(b)})`, { x: -92, y: 16 }, 0, 'def');
      }

      // Step 2 (partIdx = 1): 직각사다리꼴 AA'B'B 및 직각삼각형 ABE (밑변 a-b, 빗변 a+b)
      if (state.steps[2]) {
        withAlpha(lensAlpha('sim'), () => {
          BOARD.poly([A, Ap, Bp, B], { fill: '#fbbf24', fillAlpha: 0.06, stroke: false, part: 1 });
          // 직각삼각형 ABE 내부 강조
          BOARD.poly([A, B, E], { fill: '#34d399', fillAlpha: 0.14, stroke: false, part: 1 });
        });

        // 수선 BE 및 직각 기호
        if (Math.abs(a - b) > 0.15) {
          drawChalkLine(B.x, B.y, E.x, E.y, '#34d399', 2.0, true, false, 1, 'sim');
          drawRightAngleMark(E, { x: A.x >= E.x ? 1 : -1, y: 0 }, { x: 0, y: -1 }, 10, '#34d399', 1, 'sim');
          drawChalkPoint(E.x, E.y, 4.0, '#34d399', `E (|a-b|=${fmtNum(Math.abs(a - b))})`, { x: -45, y: -12 }, 1, 'sim');
          // [표시 보강] θ에 값(°)을 넣고, AE ∥ x축에 의한 엇각을 초점 F에도 같은 색·같은 표시로 그립니다(같은 각이 어디인지)
          const eDir = E.x >= A.x ? 1 : -1;
          const thTxt = (safeTheta <= Math.PI / 2 + 1e-6 ? 'θ=' : '') + fmtNum(Math.abs(Math.atan2(B.y - A.y, (B.x - A.x) * eDir)) * 180 / Math.PI, 1) + '°';
          drawEqAngle(A, { x: A.x + eDir, y: A.y }, B, '#fde047', 1, 28, thTxt, 'sim');
          drawEqAngle(F, { x: F.x - eDir, y: 0 }, A, '#fde047', 1, 28, thTxt, 'sim');
        } else {
          // [표시 보강] θ = 90° (통경): 초점 F에서 x축과 초점현이 직각
          drawRightAngleMark(F, { x: 1, y: 0 }, { x: 0, y: A.y >= 0 ? 1 : -1 }, 12, '#fde047', 1, 'sim');
          queueRightText(F, { x: F.x + 1, y: 0 }, { x: F.x, y: A.y >= 0 ? 1 : -1 }, '#fde047', 34, 'sim');
        }

        // 초점 분할선 (-p, 0) ~ (p, 0)
        drawChalkLine(-p, 0, p, 0, '#fbbf24', 2.2, true, false, 1, 'sim');
      }

      // Step 3 (partIdx = 2): 역수합 1/a + 1/b = 1/p 및 cosθ = (a-b)/(a+b) 비율 줄자 배너
      if (state.steps[3]) {
        withAlpha(lensAlpha('all'), () => {
          BOARD.text([(A.x + F.x) / 2, (A.y + F.y) / 2], `a = ${fmtNum(a)}`, { color: '#f9a8d4', size: 12, align: 'left', dx: 12, part: 2 });
          BOARD.text([(B.x + F.x) / 2, (B.y + F.y) / 2], `b = ${fmtNum(b)}`, { color: '#7dd3fc', size: 12, align: 'left', dx: 12, dy: 12, part: 2 });
        });

        const invSum = 1 / a + 1 / b;
        const cosVal = Math.cos(safeTheta);

        drawBottomTapeBanner(
          rect,
          `1/a(1/${fmtNum(a)}) + 1/b(1/${fmtNum(b)}) = 1/p(${fmtNum(invSum, 3)}) | cosθ = (a-b)/(a+b) = ${fmtNum(cosVal, 3)}`,
          [
            { val: a, label: `AF = a = ${fmtNum(a)}`, color: '#f472b6', bg: 'rgba(244, 114, 182, 0.32)' },
            { val: b, label: `BF = b = ${fmtNum(b)}`, color: '#38bdf8', bg: 'rgba(56, 189, 248, 0.32)' }
          ],
          2
        );
      }
    }

    // =========================================================================
    // [모드 3 렌더링] 기출 2 - 초점현 원 & 준선 접함(d=R) & 두 접선 직교(∠AH_MB = 90°)
    // =========================================================================
    function renderMode3(p, F, rect) {
      const chord = getFocalChordPoints(p, state.theta);
      const { A, B, a, b } = chord;

      const M = { x: (A.x + B.x) / 2, y: (A.y + B.y) / 2 };
      const HM = { x: -p, y: M.y }; // 준선 위 접점 겸 두 접선의 교점 Q(=H_M)
      const realR = 0.5 * Math.hypot(A.x - B.x, A.y - B.y);
      const realD = Math.abs(M.x - (-p));

      // Step 1 (partIdx = 0): 준선 및 초점현 AB를 지름으로 하는 원 C 작도
      if (state.steps[1]) {
        drawDirectrix(p, rect.height, 0, 'def');
        drawChalkLine(A.x, A.y, B.x, B.y, '#e2e8f0', 2.2, false, false, 0, 'all');

        withAlpha(lensAlpha('def'), () => BOARD.circle(M, realR, { color: '#38bdf8', fill: '#38bdf8', fillAlpha: 0.06, width: isPartHighlighted(0) ? 3.4 : 2.4, glow: true, part: 0 }));
        // [표시 보강] 원의 반지름 MA = MB 같은 길이 표시(다음 단계에서 M~H_M도 같은 표시 → d = R)
        drawEqualTickMarks(M, A, '#38bdf8', 0, 'def');
        drawEqualTickMarks(M, B, '#38bdf8', 0, 'def');
      }

      // Step 2 (partIdx = 1): 중심 M에서 준선에 내린 수선의 발 H_M 및 두 접선 QA, QB 직교(90°)
      if (state.steps[2]) {
        drawChalkLine(M.x, M.y, HM.x, HM.y, '#fbbf24', 2.6, true, true, 1, 'sim');
        drawRightAngleMark(HM, { x: 0, y: -1 }, { x: 1, y: 0 }, 10, '#fbbf24', 1, 'sim');
        drawEqualTickMarks(M, HM, '#38bdf8', 1, 'sim'); // [표시 보강] d = MH_M 이 반지름 R(MA, MB)과 같다는 같은 길이 표시

        // 양 끝점 A, B에서의 두 접선 QA, QB 연결 (항상 점 HM에서 90°로 직교!)
        drawChalkLine(HM.x, HM.y, A.x, A.y, '#c084fc', 2.0, false, true, 1, 'tan');
        drawChalkLine(HM.x, HM.y, B.x, B.y, '#c084fc', 2.0, false, true, 1, 'tan');

        const vQA = { x: A.x - HM.x, y: A.y - HM.y };
        const lQA = Math.hypot(vQA.x, vQA.y);
        const uQA = { x: vQA.x / lQA, y: vQA.y / lQA };

        const vQB = { x: B.x - HM.x, y: B.y - HM.y };
        const lQB = Math.hypot(vQB.x, vQB.y);
        const uQB = { x: vQB.x / lQB, y: vQB.y / lQB };

        drawRightAngleMark(HM, uQA, uQB, 20, '#e879f9', 1, 'tan'); // [표시 보강] ∠AQB=90° 표시를 키워 준선 직각 표시와 겹치지 않게
        queueRightText(HM, A, B, '#e879f9', 42, 'tan'); // [표시 보강] ∠AQB = 90° 값을 각 안쪽에

        drawChalkPoint(M.x, M.y, 5.5, '#fbbf24', `중심 M(${fmtNum(M.x)}, ${fmtNum(M.y)})`, { x: 10, y: -10 }, 1, 'sim');
        drawChalkPoint(HM.x, HM.y, 6.0, '#f43f5e', `접점 Q=H_M(-${fmtNum(p, 1)}, ${fmtNum(HM.y)})`, { x: -138, y: -8 }, 1, 'tan');
      }

      // Step 3 (partIdx = 2): 직선 QF ⊥ AB 직교 및 d = R = (a+b)/2 비율 줄자 배너
      if (state.steps[3]) {
        // QF 선분 및 초점 F에서의 직각 표시 (QF ⊥ AB)
        drawChalkLine(HM.x, HM.y, F.x, F.y, 'rgba(250, 204, 21, 0.7)', 1.8, true, false, 2, 'tan');
        const vFA = { x: A.x - F.x, y: A.y - F.y };
        const lFA = Math.hypot(vFA.x, vFA.y);
        const uFA = { x: vFA.x / lFA, y: vFA.y / lFA };

        const vFQ = { x: HM.x - F.x, y: HM.y - F.y };
        const lFQ = Math.hypot(vFQ.x, vFQ.y);
        const uFQ = { x: vFQ.x / lFQ, y: vFQ.y / lFQ };
        drawRightAngleMark(F, uFA, uFQ, 10, '#fde047', 2, 'tan');
        queueRightText(F, { x: F.x + uFA.x, y: F.y + uFA.y }, { x: F.x + uFQ.x, y: F.y + uFQ.y }, '#fde047', 28, 'tan'); // [표시 보강] QF ⊥ AB 의 90° 값

        withAlpha(lensAlpha('tan'), () => { // 접점 Q 둘레의 노란 고리(화면 반지름 11px)
          const sHM = BOARD.toS(HM.x, HM.y), c = BOARD.ctx;
          c.save();
          c.beginPath();
          c.arc(sHM.x, sHM.y, 11, 0, Math.PI * 2);
          c.strokeStyle = BOARD.color('#fde047');
          c.lineWidth = 2.2;
          c.stroke();
          c.restore();
        });

        drawBottomTapeBanner(
          rect,
          `중심~준선 거리 d(${fmtNum(realD)}) = 반지름 R(${fmtNum(realR)}) = (a+b)/2 | 두 접선 ∠AQB = 90° & QF ⊥ AB`,
          [
            { val: realR, label: `반지름 R = ${fmtNum(realR)}`, color: '#38bdf8', bg: 'rgba(56, 189, 248, 0.32)' },
            { val: realR, label: `반지름 R = ${fmtNum(realR)}`, color: '#fbbf24', bg: 'rgba(251, 191, 36, 0.32)' }
          ],
          2
        );
      }
    }

    // =========================================================================
    // [모드 4 렌더링] 기출 3 - 접선 마름모 TFPH & 꼭짓점 접선 페달 삼각형 닮음
    // =========================================================================
    function renderMode4(p, F, rect) {
      // 클램핑 없이 원본 state.py 그대로 사용하여 점 P와 마름모 꼭짓점 100% 일치 보장
      const py = state.py;
      const px = (py * py) / (4 * p);
      const P = { x: px, y: py };
      const H = { x: -p, y: py };
      const T = { x: -px, y: 0 };
      const K = { x: 0, y: py / 2 }; // 마름모 대각선 교점 겸 초점 F에서 내린 수선의 발 (항상 y축 위!)
      const O = { x: 0, y: 0 };

      const realTF = Math.hypot(T.x - F.x, T.y - F.y);
      const realFP = Math.hypot(F.x - P.x, F.y - P.y);
      const realFK = Math.hypot(F.x - K.x, F.y - K.y);

      const dirX = P.x - T.x;
      const dirY = P.y - T.y;
      const len = Math.hypot(dirX, dirY);
      const ux = len > 1e-6 ? dirX / len : 0;
      const uy = len > 1e-6 ? dirY / len : 1;

      // Step 1 (partIdx = 0): 준선, 접선 TP, x절편 T(-x1, 0), 수선의 발 H 및 직각 마크
      if (state.steps[1]) {
        drawDirectrix(p, rect.height, 0, 'def');

        drawChalkLine(T.x - ux * 3, T.y - uy * 3, P.x + ux * 3, P.y + uy * 3, '#c084fc', 2.5, false, true, 0, 'tan');
        drawRightAngleMark(H, { x: 0, y: py >= 0 ? -1 : 1 }, { x: 1, y: 0 }, 10, '#38bdf8', 0, 'def');

        drawChalkPoint(T.x, T.y, 6, '#c084fc', `T(${fmtNum(T.x)}, 0)`, { x: -42, y: 20 }, 0, 'tan');
        drawChalkPoint(H.x, H.y, 5, '#38bdf8', `H(-${fmtNum(p, 1)}, ${fmtNum(py)})`, { x: -102, y: -8 }, 0, 'def');
      }

      // Step 2 (partIdx = 1): 마름모 TFPH 네 변 하이라이트 및 등변 마크
      if (state.steps[2]) {
        withAlpha(lensAlpha('def'), () => BOARD.poly([T, F, P, H], { fill: '#c084fc', fillAlpha: 0.12, stroke: false, part: 1 }));

        drawChalkLine(T.x, T.y, F.x, F.y, '#e879f9', 2.6, false, false, 1, 'def');
        drawChalkLine(F.x, F.y, P.x, P.y, '#e879f9', 2.6, false, false, 1, 'def');
        drawChalkLine(P.x, P.y, H.x, H.y, '#e879f9', 2.6, false, false, 1, 'def');
        drawChalkLine(H.x, H.y, T.x, T.y, '#e879f9', 2.6, false, false, 1, 'def');

        if (Math.abs(py) > 0.15) {
          drawEqualTickMarks(T, F, '#fde047', 1, 'def');
          drawEqualTickMarks(F, P, '#fde047', 1, 'def');
          drawEqualTickMarks(P, H, '#fde047', 1, 'def');
          drawEqualTickMarks(H, T, '#fde047', 1, 'def');
        }

        // 정사각형(x1 = p)일 때 ∠TFP = 90° 표시
        if (Math.abs(px - p) < 0.08 && Math.abs(py) > 0.2) {
          drawRightAngleMark(F, { x: -1, y: 0 }, { x: 0, y: py >= 0 ? 1 : -1 }, 11, '#fde047', 1, 'tan');
        }
      }

      // Step 3 (partIdx = 2): 대각선 FH 수직이등분점 K(0, y1/2) & 페달 직각삼각형 △OFK ~ △KFP
      if (state.steps[3]) {
        // y축(꼭짓점 접선) 위 페달 직각삼각형 OFK 내부 강조
        withAlpha(lensAlpha('sim'), () => BOARD.poly([O, F, K], { fill: '#fbbf24', fillAlpha: 0.16, stroke: false, part: 2 }));

        drawChalkLine(O.x, O.y, K.x, K.y, '#fde047', 2.5, false, true, 2, 'sim');
        drawChalkLine(F.x, F.y, H.x, H.y, '#fbbf24', 2.2, true, false, 2, 'tan');

        if (Math.abs(py) > 0.15) {
          const vKF = { x: F.x - K.x, y: F.y - K.y };
          const lKF = Math.hypot(vKF.x, vKF.y);
          const uKF = { x: vKF.x / lKF, y: vKF.y / lKF };

          drawRightAngleMark(K, { x: ux, y: uy }, uKF, 14, '#fde047', 2, 'tan'); // [표시 보강] 직각 표시 확대(11→14)
          drawRightAngleMark(O, { x: 1, y: 0 }, { x: 0, y: py >= 0 ? 1 : -1 }, 9, '#34d399', 2, 'sim');
          // [표시 보강] △OFK ~ △KFP 의 같은 각: 초점 F에서 ∠OFK = ∠KFP (마름모 대각선 FH가 ∠TFP를 이등분) — 같은 색·같은 표시와 각도 값
          drawEqAngle(F, T, K, '#34d399', 1, 28, null, 'sim');
          drawEqAngle(F, K, P, '#34d399', 1, 28, null, 'sim');
        }

        drawChalkPoint(K.x, K.y, 5.0, '#fde047', `K(0, ${fmtNum(py / 2)}) [FK=${fmtNum(realFK)}]`, { x: 44, y: 40 }, 2, 'tan'); // [표시 보강] K의 직각 표시(우측)를 이름표가 가리지 않게 마름모 안쪽으로 이동

        drawBottomTapeBanner(
          rect,
          `마름모 TFPH 한 변 = ${fmtNum(realFP)} | 둘레 = ${fmtNum(4 * realFP)} | TP ⊥ FH (90°) | FK² = p(x₁+p) = ${fmtNum(realFK * realFK)}`,
          [
            { val: Math.max(0.05, px), label: `OT = x₁ = ${fmtNum(px)}`, color: '#c084fc', bg: 'rgba(192, 132, 252, 0.32)' },
            { val: p, label: `OF = p = ${fmtNum(p)}`, color: '#fde047', bg: 'rgba(250, 204, 21, 0.32)' }
          ],
          2
        );
      }
    }


  /* ======================================================================
     [2.0] 셸 연결: 셸 상태 s → 원본 state, 실시간 값(원본 updateLiveMonitor), 그리기, 장면 정의
     ====================================================================== */
  const D2R = Math.PI / 180;
  function sync(s, m, sub) {
    state.mode = m;
    state.subType = sub;
    state.conceptSwitch = s.lens;
    state.activePartIdx = s.part == null ? null : s.part;
    state.p = s.p;
    state.py = s.py;
    state.theta = s.th * D2R;
    state.pointA0 = { x: s.a0x, y: s.a0y };
    state.steps = { 1: s.step >= 1, 2: s.step >= 2, 3: s.step >= 3 };
  }

  // 원본 updateLiveMonitor: 4개 실시간 값과 실측 오차
  function statsOf(m) {
    const p = state.p, py = state.py;
    const px = (py * py) / (4 * p);
    const F = { x: p, y: 0 }, P = { x: px, y: py }, H = { x: -p, y: py };
    const realPF = Math.hypot(P.x - F.x, P.y - F.y);
    const realPH = Math.hypot(P.x - H.x, P.y - H.y);
    const realFH = Math.hypot(F.x - H.x, F.y - H.y);
    const chord = getFocalChordPoints(p, state.theta);
    const { A, B, a, b, safeTheta } = chord;
    const sumInv = 1 / a + 1 / b;
    const invP = 1 / p;
    let relErr = 0;
    let r;
    if (m === 1) {
      relErr = (Math.abs(realPF - realPH) / Math.max(1e-6, realPF)) * 100;
      r = [['초점 F(p, 0) & 점 P 좌표', `F(${fmtNum(p, 1)},0) | P(${fmtNum(px)}, ${fmtNum(py)})`], ['측정한 거리 PF와 PH', `${fmtNum(realPF)} = ${fmtNum(realPH)} (일치)`]];
      if (state.subType === 3) {
        const A0 = state.pointA0;
        const realPA = Math.hypot(P.x - A0.x, P.y - A0.y);
        r.push(['현재 거리 합 PF + PA', `${fmtNum(realPF + realPA)} (PA=${fmtNum(realPA)})`], ["최솟값 AH' = x_A + p", `최솟값 = ${fmtNum(A0.x + p)} (P(2, 4))`]);
      } else {
        r.push(['선분 FH의 길이(측정값)', `|FH| = ${fmtNum(realFH)}`], ['삼각형 PFH의 둘레(측정값)', `둘레 = ${fmtNum(realPF + realPH + realFH)}`]);
      }
    } else if (m === 2) {
      relErr = (Math.abs(sumInv - invP) / invP) * 100;
      const cosVal = Math.cos(safeTheta);
      const ratioCos = (a - b) / (a + b);
      r = [['현의 두 부분의 길이 a(AF), b(BF)', `a = ${fmtNum(a)} | b = ${fmtNum(b)}`], ['현 AB의 길이 |AB| = a + b', `|AB| = ${fmtNum(a + b)}`],
        ['1/a + 1/b 와 1/p', `${sumInv.toFixed(4)} = ${invP.toFixed(4)}`], ['직각삼각형 cosθ = (a-b)/(a+b)', `cosθ = ${fmtNum(cosVal, 3)} (${fmtNum(ratioCos, 3)})`]];
    } else if (m === 3) {
      const M = { x: (A.x + B.x) / 2, y: (A.y + B.y) / 2 };
      const realD = Math.abs(M.x - (-p));
      const realR = 0.5 * Math.hypot(A.x - B.x, A.y - B.y);
      relErr = (Math.abs(realD - realR) / realR) * 100;
      r = [['현의 두 부분의 길이 a(AF), b(BF)', `a = ${fmtNum(a)} | b = ${fmtNum(b)}`], ['원의 중심 M(x_M, y_M) 좌표', `M(${fmtNum(M.x)}, ${fmtNum(M.y)})`],
        ['중심~준선 거리 d와 반지름 R', `d=${fmtNum(realD)} | R=${fmtNum(realR)} (접함)`], ['두 접선이 이루는 각 ∠AQB, QF ⊥ AB', '∠AQB = 90.0° | QF ⊥ AB']];
    } else {
      const T = { x: -px, y: 0 };
      const K = { x: 0, y: py / 2 };
      const realTF = Math.hypot(T.x - F.x, T.y - F.y);
      const realHT = Math.hypot(H.x - T.x, H.y - T.y);
      const realFK = Math.hypot(F.x - K.x, F.y - K.y);
      relErr = (Math.abs(realTF - realPF) / Math.max(1e-6, realPF)) * 100;
      r = [['접점 P(x₁, y₁) & x절편 T(-x₁, 0)', `P(${fmtNum(px)}, ${fmtNum(py)}) | T(${fmtNum(T.x)}, 0)`], ['마름모의 네 변 TF=FP=PH=HT', `${fmtNum(realTF)} = ${fmtNum(realPF)} = ${fmtNum(realHT)}`],
        ['마름모 TFPH의 둘레, 두 대각선이 이루는 각', `둘레 = ${fmtNum(4 * realPF)} | 수직 90.0°`], ['선분 FK의 제곱 FK² = p(x₁ + p)', `FK=${fmtNum(realFK)} | FK²=${fmtNum(realFK * realFK)}`]];
    }
    return { relErr, r };
  }

  const PART_COLORS = ['sky', 'amber', 'violet'];
  function viewOf(m, sub) {
    return (s) => {
      // 원본 togglePartHighlight: 조각을 누르면 그 보조선이 켜집니다
      if (s.part != null && s.step < s.part + 1) s.step = s.part + 1;
      sync(s, m, sub);
      const p = state.p;
      const fourP = Number.isInteger(+(4 * p).toFixed(2)) ? (4 * p).toFixed(0) : (4 * p).toFixed(1);
      const pStr = Number.isInteger(+p.toFixed(2)) ? p.toFixed(0) : p.toFixed(2);
      const st = statsOf(m);
      const colors = ['amber', 'rose', 'sky', 'violet'];
      return {
        chips: [{ k: '포물선', tex: `y^2 = ${fourP}x \\; (p = ${pStr})`, color: 'amber' }, { k: '준선', tex: `x = -${pStr}`, color: 'red' }],
        status: { tone: 'ok', text: `측정 오차 ${st.relErr.toFixed(3)}%` },
        readouts: st.r.map(([label, value], i) => ({ label, value, color: colors[i], wide: true })),
        parts: examData[m].subData[sub].steps.map((t, i) => ({ id: i, name: t, desc: '', value: null, color: PART_COLORS[i] }))
      };
    };
  }

  const RENDER = { 1: renderMode1, 2: renderMode2, 3: renderMode3, 4: renderMode4 };
  function drawOf(m, sub) {
    return (b, s, v) => {
      BOARD = b;
      CUR = s;
      sync(s, m, sub);
      sink.tape = null;
      if (s.grid) b.grid();
      b.axes();
      const p = state.p;
      const F = { x: p, y: 0 };
      const rect = { width: b.W, height: b.H };

      LBLQ.length = 0;
      RENDER[m](p, F, rect);
      drawParabolaCurve(p);
      drawChalkPoint(F.x, 0, 5.5, '#f43f5e', `F(${fmtNum(p, 1)}, 0)`, { x: 8, y: 18 });

      if (m === 1 || m === 4) {
        const py = state.py;
        const px = (py * py) / (4 * p);
        // [표시 보강] 모드 1의 3단계는 점 P 오른쪽 위에 반사각 α 표시가 오므로, P 이름표를 왼쪽 위로 옮겨 겹치지 않게 합니다.
        const flipP = m === 1 && s.step >= 3 && sub !== 3;
        b.handle('P', [px, py], { color: 'amber', r: 7.5, label: `P(${fmtNum(px)}, ${fmtNum(py)})`, align: flipP ? 'right' : 'left', dx: flipP ? -12 : 12, dy: py >= 0 ? -16 : 16, drag: (w) => { s.py = clamp(w.y, -8, 8); } });
      } else {
        const chord = getFocalChordPoints(p, state.theta);
        // 원본 handlePointerMove: 초점 F를 중심으로 끝점을 돌려 θ를 정함(20°~160°)
        const turn = (which) => (w) => {
          const vx = which === 'A' ? w.x - s.p : s.p - w.x;
          const vy = which === 'A' ? w.y : -w.y;
          const lo = 20 * D2R, hi = 160 * D2R;
          const ang = vy <= 0.01 ? (vx >= 0 ? lo : hi) : Math.atan2(vy, vx);
          s.th = clamp(ang, lo, hi) / D2R;
        };
        b.handle('A', [chord.A.x, chord.A.y], { color: 'amber', r: 7.5, label: `A(${fmtNum(chord.A.x)}, ${fmtNum(chord.A.y)})`, dx: 12, dy: -14, drag: turn('A') });
        b.handle('B', [chord.B.x, chord.B.y], { color: 'sky', r: 6.5, label: `B(${fmtNum(chord.B.x)}, ${fmtNum(chord.B.y)})`, dx: 12, dy: 14, drag: turn('B') });
      }
      flushAngleLabels(); // [표시 보강] 각도 글자는 곡선·손잡이 위에(가려지지 않게)
      v.tape = sink.tape;
    };
  }

  /* ---------- 장면 정의 ---------- */
  const GROUP_SHORT = { 1: '정의·최단 거리', 2: '현의 길이 관계', 3: '현을 지름으로 하는 원', 4: '접선과 마름모' };
  const QUESTION = {
    '1-1': '포물선 위의 점 P에서 초점 F까지의 거리와 준선까지의 거리는 어떤 관계일까?',
    '1-2': '삼각형 PFH가 정삼각형이 되려면 점 P는 어디에 있어야 할까?',
    '1-3': '포물선 위의 점 P에서 점 A까지의 거리와 초점 F까지의 거리의 합 PA + PF가 가장 작아지는 점 P는 어디일까?',
    '2-1': '초점을 지나는 현이 초점을 a : b로 나눌 때 1/a + 1/b 는 무엇과 같을까?',
    '2-2': '현이 초점을 2 : 1로 나누려면 현의 기울기 각 θ의 cosθ 는 얼마여야 할까?',
    '2-3': '초점을 지나 축에 수직인 현의 길이는 얼마일까?',
    '3-1': '초점을 지나는 현 AB를 지름으로 하는 원은 준선과 어떤 위치 관계일까?',
    '3-2': '준선 위의 점 Q에서 점 A, B에서의 접선을 그으면 두 접선은 어떤 각을 이룰까?',
    '3-3': 'θ = 45°처럼 현이 기울어져도 그 현을 지름으로 하는 원은 준선에 접할까?',
    '4-1': '접선의 x절편 T와 F, P, H를 이으면 어떤 사각형이 될까?',
    '4-2': '사각형 TFPH가 정사각형이 되려면 점 P는 어디에 있어야 할까?',
    '4-3': '초점 F에서 접선에 내린 수선의 발 K는 어디에 놓일까?'
  };
  const FOCUS = { x: [-4.4, 8.8], y: [-5.6, 7.8] };
  const LENSES = [['all', '전체'], ['def', '정의(PF=PH)'], ['sim', '직각·닮음·직사각형'], ['tan', '접선·수직(90°)']];

  function bounce(s, key, speed, lo, hi, dt) {
    s[key] += speed * s.animDir * dt;
    if (s[key] > hi) { s[key] = hi; s.animDir = -1; }
    if (s[key] < lo) { s[key] = lo; s.animDir = 1; }
  }
  // 원본 animateLoop: 모드 1·4는 y₁을 ±7.2로 오가고, 모드 2·3은 θ를 0.55~2.55rad로 오갑니다(60프레임 기준 속도)
  const tickOf = (m) => (s, dt) => {
    if (!s.playing) return false;
    if (m === 1 || m === 4) bounce(s, 'py', 0.055 * 60, -7.2, 7.2, dt);
    else bounce(s, 'th', 0.008 * 60 / D2R, 0.55 / D2R, 2.55 / D2R, dt);
    return true;
  };

  function sceneOf(m, sub) {
    const d = examData[m];
    const sd = d.subData[sub];
    return {
      id: `m${m}s${sub}`,
      title: d.subTitles[sub - 1],
      short: d.subTitles[sub - 1],
      reviewTab: true,
      question: QUESTION[`${m}-${sub}`],
      guide: d.hint,
      controls: m === 1 || m === 4 ? ['p', 'py'] : ['p', 'th'],
      steps: sd.steps,
      focus: FOCUS,
      enter: (s) => {
        const sn = sd.snap;
        s.p = sn.p;
        s.py = sn.py;
        s.th = sn.theta / D2R;
        s.a0x = 5;
        s.a0y = 4;
        s.animDir = 1;
      },
      presets: () => LENSES.map(([k, lbl]) => ({ group: '강조해서 볼 요소', label: lbl, apply: (st) => { st.lens = k; }, on: (st) => st.lens === k })),
      actions: [{ id: 'play', play: true, icon: (s) => (s.playing ? 'pause' : 'play'), label: (s) => (s.playing ? '정지' : '자동으로 움직이기'), on: (s) => s.playing, run: (s) => { s.playing = !s.playing; } }],
      problem: {
        tag: sd.tag,
        time: sd.targetTime,
        text: sd.question,
        answer: sd.answerBadge,
        snap: () => ({ p: sd.snap.p, py: sd.snap.py, th: sd.snap.theta / D2R })
      },
      solution: {
        standardTitle: '교과서식 풀이 (좌표로 계산)', standardTag: '기본 풀이',
        quickTitle: '10초 컷 · 정의와 성질을 이용한 풀이', quickTag: '10초 컷',
        standard: sd.textbook,
        quick: sd.shortcut
      },
      tick: tickOf(m),
      view: viewOf(m, sub),
      draw: drawOf(m, sub)
    };
  }

  const groups = [1, 2, 3, 4].map((m) => ({
    id: 'm' + m,
    title: examData[m].badge.replace(/^장면 \d+ · /, ''),
    short: GROUP_SHORT[m],
    scenes: [1, 2, 3].map((sub) => sceneOf(m, sub))
  }));

  APLab.createLab({
    id: 'geom-parabola',
    title: '포물선 실전 킬러 랩',
    courseName: '기하',
    unit: '이차곡선 · 포물선',
    courseColor: 'var(--m-rose)',
    home: '../index.html#geom',
    legacy: '../../labs/기하와벡터/포물선.html',
    board: { kind: 'cartesian', focus: FOCUS },
    params: {
      p: { value: 2, min: 1, max: 4, step: 0.05, color: 'amber', label: '포물선 $y^2=4px$의 $p$ (준선 $x=-p$)', format: (v) => `p = ${fmtNum(v)} (4p = ${fmtNum(4 * v)})` },
      py: { value: Math.sqrt(32), min: -8, max: 8, step: 0.05, color: 'rose', label: '점 P의 $y$좌표 $y_1$', hint: '그림의 노란 점 P를 끌어도 같이 움직입니다', format: (v, s) => `y₁ = ${fmtNum(v)} (x₁ = ${fmtNum((v * v) / (4 * s.p))})` },
      th: { value: 60, min: 20, max: 160, step: 0.5, color: 'sky', label: '초점을 지나는 현이 $x$축과 이루는 각 $\\theta$', hint: '그림의 점 A 또는 B를 끌어 초점 F를 중심으로 돌릴 수도 있습니다', format: (v) => `${v.toFixed(1)}°` }
    },
    state: { lens: 'all', a0x: 5, a0y: 4, animDir: 1 },
    persist: ['lens'],
    groups
  });
});
</script>
