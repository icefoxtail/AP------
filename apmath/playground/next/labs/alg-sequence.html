  // Helper for Type 8 Backward Tree generation
function computeBackwardTree(targetA4, k) {
// Levels: level 0 = a4, level 1 = a3, level 2 = a2, level 3 = a1
const root = { val: targetA4, level: 0, valid: true, reason: '목표항', children: [] };

function expand(node) {
if (node.level >= 3 || !node.valid) return;
const y = node.val;

// Branch 1: 2 * x = y => x = y / 2 (valid if x is integer/natural AND x < k)
const xLeft = y / 2;
const isIntLeft = Math.abs(xLeft - Math.round(xLeft)) < 1e-6 && xLeft >= 1;
const condLeft = xLeft < k;
const leftNode = {
val: xLeft,
level: node.level + 1,
rule: '÷2',
valid: isIntLeft && condLeft,
reason: !isIntLeft ? '자연수 아님' : (!condLeft ? `≥${k} 범위위반` : '통과'),
children: []
};

// Branch 2: x - k = y => x = y + k (valid if x >= k and natural)
const xRight = y + k;
const rightNode = {
val: xRight,
level: node.level + 1,
rule: `+${k}`,
valid: xRight >= k && Number.isInteger(Math.round(xRight)),
reason: '통과',
children: []
};

node.children = [leftNode, rightNode];
expand(leftNode);
expand(rightNode);
}

expand(root);

const validA1 = [];
function collectLeaves(node) {
if (node.level === 3 && node.valid) validA1.push(node.val);
node.children.forEach(collectLeaves);
}
collectLeaves(root);
return { root, validA1 };
}

`$P_1 = S_n = ${P1.toFixed(1)}, \\; P_2 = S_{2n}-S_n = ${P2.toFixed(1)}, \\; P_3 = S_{3n}-S_{2n} = ${P3.toFixed(1)}$`
);
cards = [
{ title: '3구간 누적합 S_3n', val: S3n.toFixed(2), sub: `${P1.toFixed(1)} + ${P2.toFixed(1)} + ${P3.toFixed(1)}` },
{ title: '등비중항 P₂² − P₁P₃의 값', val: '0', sub: `${(P2*P2).toFixed(1)} = ${(P1*P3).toFixed(1)}` },
{ title: '2구간 누적합 S_2n', val: S2n.toFixed(2), sub: `P₁ + P₂` },
{ title: '블록 공비 R (= rⁿ)', val: `${R.toFixed(2)}배`, sub: '$\\frac{P_2}{P_1}$ = $\\frac{P_3}{P_2}$' }
];
} else if (mId === 'type6') {
const n = Math.round(p.termCountN);
const a1 = p.firstA1;
const d = p.diffD;
const anPlus1 = a1 + n * d;
const num = n;
const den = a1 * anPlus1;
eq = (
`$\\sum_{k=1}^{${n}} \\frac{1}{a_k a_{k+1}} = \\frac{1}{${d}}\\left(\\frac{1}{${a1}} - \\frac{1}{${anPlus1}}\\right) = \\frac{${num}}{${a1} \\times ${anPlus1}} = \\frac{${num}}{${den}}$`
);
cards = [
{ title: '분수 n ÷ (맨 앞 × 맨 뒤)의 값', val: `$\\frac{${num}}{${den}}$`, sub: `소수값 ${(num/den).toFixed(4)}` },
{ title: '부분분수로 나눈 식과의 차', val: '0', sub: '두 식이 같음' },

seq.push(cur < 4 ? cur + 2 : cur - 4);

let sumN = 0;
for (let i = 0; i < N; i++) sumN += seq[i];

eq = (
`$a_1=${p.startA1.toFixed(1)} \\implies [${seq[0].toFixed(1)} \\to ${seq[1].toFixed(1)} \\to ${seq[2].toFixed(1)}] \\text{ (3항마다 반복)}, \\quad \\sum_{k=1}^{${N}} a_k = ${sumN.toFixed(1)}$`
);
cards = [
{ title: '반복되는 3항(1마디)의 합', val: cycleSum.toFixed(2), sub: `${seq[0].toFixed(1)} + ${seq[1].toFixed(1)} + ${seq[2].toFixed(1)}` },
{ title: `제1항~제${N}항 총합`, val: sumN.toFixed(2), sub: `몫 ${Math.floor(N/3)}마디 + 나머지 ${N%3}개` },
{ title: '주기', val: 'p = 3', sub: 'a_(n+3) − a_n = 0' },
{ title: '한 마디에서 증가분과 감소분', val: '(+2)×2 - 4 = 0', sub: '증가한 양 + 감소한 양 = 0' }

cards = [
{ title: '생존한 자연수 a₁ 개수', val: `${validA1.length}개`, sub: `전체 8가지 중 ${8 - validA1.length}개 지워짐` },

{ title: '왼쪽 가지 통과 조건', val: `짝수이고 ${2*k} 미만`, sub: `÷2의 결과가 ${k} 미만이어야 남음` }

    // 정리는 현재 단계까지 도출한 내용만 공개합니다. 탐구와 완료 수식은 위의 값을 그대로 씁니다.
    if (step < 3) {

          ? `$a_1=${given.A},\\quad a_${given.k}+a_${given.k + 1}=0$`
          : given ? `$d=${given.d},\\quad a_${given.p}+a_${given.q}=0$` : '$a_n=a_1+(n-1)d$';

  /* ===== 원본 그대로: 쌍둥이 변형 생성기 (원본 triggerTwinProblem) — scen.problem·snapParams 를 바꿉니다 ===== */
  function runTwin(mId, scen, p) {
    if (mId === 'type1') {
const zN = [4, 5, 6, 7][Math.floor(Math.random() * 4)];
const dVal = [-3, -2, 2, 3][Math.floor(Math.random() * 4)];
p.zeroN = zN;
p.dSlope = dVal;
scen.snapParams = { ...p };
scen.problem = `**[숫자를 바꾼 문제]** 공차가 $d = ${dVal}$이고 제$${zN}$항이 $a_{${zN}} = 0$인 등차수열입니다. 대칭 성질에 의해 첫째항부터 제$${2*zN - 1}$항까지의 합은 **$\\sum_{k=1}^{${2*zN-1}} a_k = 0$**입니다.`;
} else if (mId === 'type2') {
const pairs = [[2, 6], [2, 8], [3, 9], [4, 8], [3, 11]];
const pick = pairs[Math.floor(Math.random() * pairs.length)];
const sym = (pick[0] + pick[1]) / 2;
const zeroK = pick[0] + pick[1];
p.pIdx = pick[0];
p.qIdx = pick[1];
scen.snapParams = { ...p };
scen.problem = `**[숫자를 바꾼 문제]** 등차수열에서 $S_{${pick[0]}} = S_{${pick[1]}}$일 때, 원점을 지나는 포물선의 대칭축은 **$n = \\frac{${pick[0]}+${pick[1]}}{2} = ${sym}$**이고, 합이 $0$이 되는 항은 **$S_{${zeroK}} = 0$ ($k=${zeroK}$)**입니다.`;
} else if (mId === 'type3') {
const zSum = [6, 8, 10][Math.floor(Math.random() * 3)];
const tN = zSum + 2;
const vMax = (zSum / 2) * (zSum / 2);
const sTarget = -tN * (tN - zSum);
const ans = 2 * vMax - sTarget;
p.zeroSumN = zSum;
p.targetN = tN;
scen.snapParams = { ...p };
scen.problem = `**[숫자를 바꾼 문제]** $S_n = -n^2 + ${zSum}n$일 때, 꼭짓점은 $S_{${zSum/2}} = ${vMax}$이고 $S_{${tN}} = ${sTarget}$이므로, 꼭짓점을 기준으로 접어 올리면 **$\\sum_{k=1}^{${tN}} |a_k| = 2(${vMax}) - (${sTarget}) = ${ans}$**입니다.`;
} else if (mId === 'type4') {
const pC = [1, 2, 3][Math.floor(Math.random() * 3)];
const qC = [1, 3, 5][Math.floor(Math.random() * 3)];
const cVal = [2, 4, 5][Math.floor(Math.random() * 3)];
p.pCoeff = pC;
p.qCoeff = qC;
p.constC = cVal;
scen.snapParams = { ...p };
const a1 = pC + qC + cVal;
const a5 = 2 * pC * 5 + (qC - pC);
scen.problem = `**[숫자를 바꾼 문제]** $S_n = ${pC}n^2 + ${qC}n + ${cVal}$일 때, $n\\ge 2$이면 $a_n = ${2*pC}n + (${qC-pC})$이므로 $a_5 = ${a5}$, 첫째항은 $+${cVal}$을 더해 $a_1 = ${a1}$, 합은 **$${a1 + a5}$**입니다.`;
} else if (mId === 'type5') {
const b1 = [4, 5, 8, 10][Math.floor(Math.random() * 4)];
const r = [2, 3][Math.floor(Math.random() * 2)];
const s2n = b1 + b1 * r;
const s3n = s2n + b1 * r * r;
p.block1 = b1;
p.blockRatio = r;
scen.snapParams = { ...p };
scen.problem = `**[숫자를 바꾼 문제]** 등비수열에서 $S_n = ${b1},\\; S_{2n} = ${s2n}$일 때, 구간별 합은 $[${b1}] \\to [${b1*r}] \\to [${b1*r*r}]$이므로 **$S_{3n} = ${s3n}$**입니다.`;
} else if (mId === 'type6') {
const nCnt = [5, 7, 9, 10][Math.floor(Math.random() * 4)];
const dVal = [2, 3, 4][Math.floor(Math.random() * 3)];
p.termCountN = nCnt;
p.firstA1 = 1;
p.diffD = dVal;
scen.snapParams = { ...p };
const lastA = 1 + nCnt * dVal;
scen.problem = `**[숫자를 바꾼 문제]** 첫째항 $a_1 = 1$, 공차 $d = ${dVal}$인 등차수열에서 $\\sum_{k=1}^{${nCnt}} \\frac{1}{a_k a_{k+1}}$은 부분분수로 나누어 구하면 **$\\frac{\\text{항의 개수 } ${nCnt}}{1 \\times ${lastA}} = \\frac{${nCnt}}{${lastA}}$**입니다.`;
} else if (mId === 'type7') {
const a1Val = [1, 2, 3][Math.floor(Math.random() * 3)];
const limN = [24, 27, 30, 33][Math.floor(Math.random() * 4)];
p.startA1 = a1Val;
p.limitN = limN;
scen.snapParams = { ...p };
scen.problem = `**[숫자를 바꾼 문제]** 첫째항 $a_1 = ${a1Val}$에서 출발할 때 $3$항마다 같은 값이 반복되는 것을 이용하여 제$${limN}$항까지의 합을 그래프에서 확인해 보세요.`;
} else if (mId === 'type8') {
const tA4 = [2, 4, 6][Math.floor(Math.random() * 3)];
const thK = [4, 6, 8][Math.floor(Math.random() * 3)];
p.targetA4 = tA4;
p.threshK = thK;
scen.snapParams = { ...p };
scen.problem = `**[숫자를 바꾼 문제]** 목표 항을 $a_4 = ${tA4}$, 기준값을 $k = ${thK}$로 바꾸었습니다. 그림의 나뭇가지에서 남은 $a_1$ 후보들과 그 합을 확인해 보세요.`;
}


  }

  /* ===== 원본 drawMathSegment / drawFunctionCurve / drawMathPoint 와 같은 이름·같은 인자 → 새 무대 엔진 ===== */
  function shim(b, s, sink, noDrag) {
    let hid = 0;
    return {
      drawMathSegment: (x1, y1, x2, y2, col = '#fbbf24', dash = [], w = 2.2) => b.seg([x1, y1], [x2, y2], { color: col, width: w, dash: dash.length ? dash : null }),
      drawFunctionCurve: (fn, col = '#34d399', w = 2.4, dash = [], x0 = null, x1 = null) => {
        if (!s.cont && dash.length === 0) { dash = [4, 4]; w = 1.5; } // 원본: '연속 실수함수 실선'을 끄면 점선
        b.plot((x) => { let y = fn(x); if (s.abs && !isNaN(y)) y = Math.abs(y); return Number.isFinite(y) ? y : NaN; }, { color: col, width: w, dash: dash.length ? dash : null, from: x0, to: x1 });
      },
      drawMathPoint: (x, y, lbl = '', col = '#fbbf24', rad = 6, drag = false, onDrag = null) => {
        if (drag && !noDrag) b.handle('h' + (hid++), [x, y], { color: col, r: rad, label: lbl, drag: onDrag });
        else b.point([x, y], { color: col, r: rad, label: lbl });
      },
      badge: (text, color = '#fbbf24') => sink.lines.push({ text, color })
    };
  }

  /* 도식(탐구관 5·6·8): 원본은 캔버스 픽셀 좌표(w,h, 아래쪽이 y+)로 그렸으므로, 무대 영역 크기를 그대로 설계 좌표로 씁니다 */
  function design(b) {
    const a = b._area();
    b.focus = { x: [0, a.w], y: [0, a.h] };
    const h = a.h;
    return { w: a.w, h, P: (x, y) => [x, h - y] };
  }
  // 원본 drawCanvasBadge: 둥근 상자 안의 글자 (설계 좌표 x, y)
  function chip(b, D, x, y, text, color, bg) {
    const c = b.ctx, q = D.P(x, y), sp = b.toS(q[0], q[1]), size = 12 * b.fs;
    c.save();
    c.font = `800 ${size}px ${b.font}`;
    const fractions = b._fracSplit(String(text));
    const w = (fractions ? fractions.reduce((sum, part) => sum + (part.t !== undefined ? c.measureText(part.t).width : Math.max(c.measureText(part.n).width, c.measureText(part.d).width) * 0.78 + 5), 0) : c.measureText(text).width) + 16, hh = (fractions ? 38 : 24) * b.fs;
    c.beginPath();
    c.roundRect(sp.x - w / 2, sp.y - hh / 2, w, hh, 6);
    c.fillStyle = bg || b.color('halo', 0.9);
    c.fill();
    c.strokeStyle = b.color(color);
    c.lineWidth = 1.3;
    c.setLineDash([]);
    c.stroke();
    c.fillStyle = b.color(color);
    c.textAlign = 'center';
    c.textBaseline = 'middle';
    b.stext(sp.x, sp.y, text, { size: 12, weight: 800, color, align: 'center', baseline: 'middle' });
    c.restore();
  }

  let ovLastKind = ''; // 직전에 그린 탭(탐구/그 밖): 탐구로 돌아올 때 무대 범위를 되돌리기 위해
  function draw(mo, mi, b, sReal, v, lab, si) {

        if (s.stems) drawMathSegment(n, 0, n, yPlot, 'rgba(52, 211, 153, 0.25)', [], 1.5);
        const label = isPair ? (tab === 'review' && !st(3) ? `S_${n}` : `S_${n}=${valS}`) : isZero && (tab !== 'review' || st(3)) ? `S_${n}=${valS}` : '';
        drawMathPoint(n, yPlot, label, col, isPair || isZero ? 6.5 : 4.5);
      }
      const spVal = -p.pIdx * (p.pIdx - zeroIdx), yLine = scaleY * spVal;
      drawMathSegment(p.pIdx, yLine, p.qIdx, yLine, '#fbbf24', [5, 4], 2.2);
      if (st(2)) {
        drawMathSegment(symAxis, -2, symAxis, scaleY * symAxis * symAxis + 1.2, '#fbbf24', [6, 4], 2.2);
        sink.tape = `대칭축 x = $\\dfrac{${p.pIdx} + ${p.qIdx}}{2}$ = ${symAxis.toFixed(1)} (극댓값)`;
      }
      if (st(3)) badge(`x절편: S_(${p.pIdx}+${p.qIdx}) = S_${zeroIdx} = 0`, '#fb7185');
      drawMathPoint(p.qIdx, yLine, Q ? '' : `S_${p.qIdx}`, '#fbbf24', 8, true, (w) => { p.qIdx = clamp(Math.round(w.x), Math.max(5, p.pIdx + 1), 11); });
    } else if (id === 'type3') {
      const N = p.zeroSumN, m = N / 2, sMax = m * m;
      const absProblem = !!Q && si === 1;
      const fnOrigS = (x) => -x * (x - N);
      const fnAbsS = (x) => Math.abs(fnOrigS(x));
      const fnSumAbsA = (x) => x <= m ? fnOrigS(x) : 2 * sMax - fnOrigS(x);
      drawFunctionCurve(fnOrigS, 'rgba(52, 211, 153, 0.55)', 1.8, [5, 5], 0, 12.5);
      if (st(2)) {
        drawFunctionCurve(fnAbsS, '#38bdf8', 2.6, [], 0, 12.5);
        badge(`|S_n| : n=${N}에서 x축 아래 부분을 위로 접음`, '#38bdf8');
      }
      if (!absProblem && st(3)) drawFunctionCurve(fnSumAbsA, '#fbbf24', 2.8, [], 0, 12.5);
      if (st(1)) drawMathPoint(m, sMax, `꼭짓점 S_${m}=${sMax}`, '#34d399', 6.5);
      const n = Math.round(p.targetN), sn = fnOrigS(n), sumAbsVal = fnSumAbsA(n);
      if (absProblem) {
        if (st(1)) for (const a of [Q.g.a, Q.g.b]) drawMathPoint(a, fnOrigS(a), `S_${a}=${Q.g.c}`, '#34d399', 6);
        if (st(2)) { drawMathSegment(0, Q.g.L, 12.5, Q.g.L, '#38bdf8', [5, 4], 1.5); badge(`|S_r|=${Q.g.L}, 조건 r>${N}`, '#38bdf8'); }
        if (st(3)) { drawMathPoint(n, Math.abs(sn), `r=${n}, |S_${n}|=${Math.abs(sn)}`, '#38bdf8', 8); badge(`r(r−${N})=${Q.g.L}에서 r=${n}`, '#38bdf8'); }
      } else {
        if (st(3)) badge(`∑|a_k| = 2·S_${m}(${sMax}) − S_${n}(${sn}) = ${sumAbsVal}`, '#fbbf24');
        drawMathPoint(n, st(3) ? sumAbsVal : sn, st(3) ? `n=${n} (∑|a_k|=${sumAbsVal})` : `n=${n}`, '#fbbf24', 8, true, (w) => { p.targetN = clamp(Math.round(w.x), 5, 12); });
      }
    } else if (id === 'type4') {
      const scaleY = 1;
      const fnLine = (x) => scaleY * (2 * p.pCoeff * x + (p.qCoeff - p.pCoeff));
      if (st(1)) drawFunctionCurve(fnLine, '#34d399', 2.4, [], 0.5, 8.5);
      for (let n = 2; n <= 7; n++) {
        const an = 2 * p.pCoeff * n + (p.qCoeff - p.pCoeff);
        if (s.stems) drawMathSegment(n, 0, n, scaleY * an, 'rgba(52, 211, 153, 0.4)', [], 2);
        drawMathPoint(n, scaleY * an, st(2) ? `a_${n}=${fmt(an)}` : `a_${n}`, '#34d399', 5.5);
      }
      const a1Formula = p.pCoeff + p.qCoeff, a1Actual = a1Formula + p.constC;
      if (Q) { // 문제·정리 탭: 두 점의 이름이 서로 겹치지 않게 위·아래로 나눠 둡니다
        const up = p.constC >= 0;
        b.point([1, scaleY * a1Formula], { r: 5, color: 'muted', label: `공식값(${fmt(a1Formula)})`, dx: 0, dy: up ? 18 : -16, align: 'center', size: 12.5 });
      } else drawMathPoint(1, scaleY * a1Formula, `공식값(${fmt(a1Formula)})`, 'rgba(148, 163, 184, 0.7)', 5);
      if (st(2) && Math.abs(p.constC) > 0.01) {
        drawMathSegment(1, scaleY * a1Formula, 1, scaleY * a1Actual, '#fb7185', [4, 3], 3.0);
        badge(`상수항 C=${p.constC}만큼 첫째항 a₁만 직선에서 벗어남`, '#fb7185');
      }
      if (st(3)) badge(`a_n = ${2 * p.pCoeff}n + (${p.qCoeff - p.pCoeff}) (n≥2) | a₁ = ${a1Formula} + C(${p.constC}) = ${a1Actual}`, '#fbbf24');
      if (Q && st(2)) b.point([1, scaleY * a1Actual], { r: 7, color: 'amber', label: Q.g.C == null && !st(3) ? `a₁=S₁=${fmt(a1Formula)}+C` : `a₁=S₁=${fmt(a1Actual)}`, dx: 0, dy: p.constC >= 0 ? -16 : 18, align: 'center', size: 12.5 });
      else if (!Q) drawMathPoint(1, scaleY * a1Actual, `실제 a₁=S₁=${fmt(a1Actual)}`, '#fbbf24', 8, true, (w) => {
        const rawA1 = w.y / scaleY;
        p.constC = clamp(Math.round(rawA1 - a1Formula), -3, 5);
      });
    } else if (id === 'type5') {
      const D = design(b), w = D.w, h = D.h, P = D.P;
      const P1 = p.block1, R = p.blockRatio, P2 = P1 * R, P3 = P2 * R, S3n = P1 + P2 + P3;
      const baseLineY = h * 0.78, maxVal = Q ? P3 : Math.max(P3, 60), scaleH = (h * 0.52) / maxVal; // 변형(Q)은 가장 큰 막대가 화면을 채우도록
      const blocks = [
        { l1: 'P₁ · 1~n항', l2: '= Sₙ', val: P1, cum: P1, color: '#34d399', x: w * 0.22 },
        { l1: 'P₂ · n+1~2n항', l2: '= S₂ₙ − Sₙ', val: P2, cum: P1 + P2, color: '#38bdf8', x: w * 0.50 },
        { l1: 'P₃ · 2n+1~3n항', l2: '= S₃ₙ − S₂ₙ', val: P3, cum: S3n, color: '#fbbf24', x: w * 0.78 }
      ];
      b.seg(P(w * 0.1, baseLineY), P(w * 0.9, baseLineY), { color: 'rgba(236, 253, 245, 0.4)', width: 2 });
      const barW = Math.min(96, w * 0.16);
      blocks.forEach((bk, idx) => {
        const bh = bk.val * scaleH, left = bk.x - barW / 2, top = baseLineY - bh;
        b.poly([P(left, top), P(left + barW, top), P(left + barW, baseLineY), P(left, baseLineY)], { fill: bk.color, fillAlpha: 0.2, color: bk.color, width: 2.4 });
        b.text(P(bk.x, top - 12), `구간의 합 = ${tab !== 'review' || s.step >= idx ? bk.val.toFixed(1) : '?'}`, { color: '#ffffff', size: 15, weight: 800 });
        b.text(P(bk.x, baseLineY + 20), bk.l1, { color: 'rgba(209, 250, 229, 0.85)', size: 12, weight: 800 });
        b.text(P(bk.x, baseLineY + 37), bk.l2, { color: 'rgba(209, 250, 229, 0.85)', size: 12, weight: 800 });
        b.text(P(bk.x, baseLineY + 56), `누적 S_${idx + 1}n = ${tab !== 'review' || idx < 2 || st(3) ? bk.cum.toFixed(1) : '?'}`, { color: '#fbbf24', size: 12, weight: 800 });
      });
      if (st(2)) {
        chip(b, D, w * 0.36, baseLineY - P2 * scaleH * 0.6, `× R (${R.toFixed(1)}배)`, '#fbbf24');
        chip(b, D, w * 0.64, baseLineY - P3 * scaleH * 0.6, `× R (${R.toFixed(1)}배)`, '#fbbf24');
      }
      if (st(3)) sink.tape = `구간 조각 공비 R = rⁿ = $\\dfrac{P_2\\ (${P2.toFixed(1)})}{P_1\\ (${P1.toFixed(1)})}$ = ${R.toFixed(2)} ⟹ S_3n = ${S3n.toFixed(1)}`;
      // [2.0 수정] 둘째 막대 꼭대기 점: 끌면 공비 R 이 바뀜 (원본은 끌어도 아무 일도 없었음)
      drawMathPoint(w * 0.5, h - (baseLineY - P2 * scaleH), '', '#fbbf24', 8, true, (wp) => {
        const P2n = (wp.y - (h - baseLineY)) / scaleH;
        p.blockRatio = clamp(Math.round((P2n / P1) * 2) / 2, 1.5, 3.5);
      });
    } else if (id === 'type6') {
      const D = design(b), w = D.w, h = D.h, P = D.P;
      const n = Math.round(p.termCountN), a1 = p.firstA1, d = p.diffD;
      const shown = n <= 6 ? Array.from({ length: n }, (_, i) => i + 1) : [1, 2, 3, 4, 0, n];
      const startY = h * 0.24, rowH = Math.min(42, (h * 0.56) / shown.length);
      sink.tape = `S = $\\dfrac{1}{d\\ (${d})}$ × { 항들의 합 }`;
      shown.forEach((idx, k) => {
        const cy = startY + (k + 0.5) * rowH, xLeft = w * 0.36, xRight = w * 0.62;
        if (!idx) { b.text(P(w / 2, cy), '⋮', { color: 'muted', size: 18 }); return; }
        const ak = a1 + (idx - 1) * d, ak1 = ak + d;
        chip(b, D, xLeft, cy, `+ \\frac{1}{${ak}}`, idx === 1 ? '#fbbf24' : '#34d399');
        chip(b, D, xRight, cy, `- \\frac{1}{${ak1}}`, idx === n ? '#fbbf24' : '#38bdf8');
        if (st(2) && shown[k + 1] === idx + 1) b.seg(P(xRight - 30, cy - 8), P(xLeft + 30, cy + rowH + 8), { color: '#fb7185', width: 2.6 });
      });
      if (st(3)) {
        const lastDen = a1 + n * d;
        sink.tape += ` ｜ 결과 = $\\dfrac{\\text{항의 개수 } n\\ (${n})}{\\text{맨앞}(${a1}) \\times \\text{맨뒤}(${lastDen})}$ = ${n} / ${a1 * lastDen}`;
      }
    } else if (id === 'type7') {
      drawFunctionCurve((x) => x, 'rgba(236, 253, 245, 0.45)', 1.8, [5, 5], -1, 8);
      drawFunctionCurve((x) => x + 2, '#34d399', 3.0, [], -1, 3.99);
      drawFunctionCurve((x) => x - 4, '#38bdf8', 3.0, [], 4.0, 8.5);
      drawMathSegment(4, -2, 4, 7, 'rgba(251, 113, 133, 0.4)', [4, 4], 1.5);
      const seq = [p.startA1];
      for (let i = 0; i < 8; i++) { const cur = seq[i]; seq.push(cur < 4 ? cur + 2 : cur - 4); }
      if (st(2)) {
        for (let i = 0; i < 5; i++) {
          const x = seq[i], y = seq[i + 1], col = i < 3 ? '#fbbf24' : '#fb7185';
          drawMathSegment(x, x, x, y, col, [], 2.4);
          drawMathSegment(x, y, y, y, col, [4, 3], 2.2);
          drawMathPoint(x, y, Q && i >= 3 ? '' : `P_${i + 1}(${x.toFixed(1)}, ${y.toFixed(1)})`, col, 5.5); // 4번째 점부터는 앞의 점과 같은 자리(주기 3)라 이름을 겹쳐 쓰지 않습니다(변형 그림)
        }
      }
      if (st(3)) {
        const cSum = seq[0] + seq[1] + seq[2];
        badge(`3항마다 반복: [${seq[0].toFixed(1)} → ${seq[1].toFixed(1)} → ${seq[2].toFixed(1)}] (1마디 합 = ${cSum.toFixed(1)})`, '#fbbf24');
      }
      if (Q) b.point([p.startA1, p.startA1], { r: 7, color: 'amber', label: `a₁=${p.startA1}`, dx: 0, dy: 19, align: 'center', size: 12.5 });
      else drawMathPoint(p.startA1, p.startA1, `출발 a₁=${p.startA1.toFixed(1)}`, '#fbbf24', 8, true, (w) => { p.startA1 = clamp(Math.round(w.x * 2) / 2, 0.5, 5.5); });
    } else if (id === 'type8') {
      const D = design(b), w = D.w, h = D.h, P = D.P;
      const tA4 = Math.round(p.targetA4), k = Math.round(p.threshK);
      const { root, validA1 } = computeBackwardTree(tA4, k);
      const levelY = [h * 0.18, h * 0.39, h * 0.61, h * 0.83];
      const levelNames = w < 600 ? ['a₄', 'a₃', 'a₂', 'a₁'] : ['제4항 (a₄)', '제3항 (a₃)', '제2항 (a₂)', '첫째항 (a₁ 후보)'];
      levelY.forEach((ly, idx) => {
        b.seg(P(w * 0.06, ly), P(w * 0.94, ly), { color: 'rgba(52, 211, 153, 0.14)', width: 1 });
        b.text(P(w * 0.05, ly - 10), levelNames[idx], { color: 'rgba(167, 243, 208, 0.7)', size: 12, align: 'left', weight: 800 });
      });
      const drawNodeRecursive = (node, cx, spread) => {
        const cy = levelY[node.level];
        if (node.children && node.children.length === 2 && (node.level < Math.min(s.step, 3))) {
          node.children.forEach((child, idx) => {
            const childX = idx === 0 ? cx - spread : cx + spread, childY = levelY[child.level];
            b.seg(P(cx, cy + 14), P(childX, childY - 14), { color: child.valid ? 'rgba(52, 211, 153, 0.75)' : 'rgba(251, 113, 133, 0.45)', width: child.valid ? 2.4 : 1.6, dash: child.valid ? null : [4, 4] });
            b.text(P((cx + childX) / 2, (cy + childY) / 2), child.rule, { color: child.valid ? '#a7f3d0' : '#fda4af', size: Q ? 12 : 10.5, weight: 800 });
            drawNodeRecursive(child, childX, spread * 0.5);
          });
        }
        const isLeafValid = (node.level === 3 && node.valid);
        const boxColor = !node.valid ? '#fb7185' : (isLeafValid ? '#fbbf24' : '#34d399');
        const bg = !node.valid ? 'rgba(136, 19, 55, 0.65)' : (isLeafValid ? 'rgba(120, 53, 15, 0.85)' : 'rgba(6, 78, 59, 0.85)');
        const valStr = Number.isInteger(node.val) ? `${node.val}` : node.val.toFixed(1);
        chip(b, D, cx, cy, !node.valid && st(2) ? `✕ ${valStr}` : valStr, boxColor, bg);
        if (!node.valid && st(2)) b.text(P(cx, cy + 22), node.reason, { color: '#fda4af', size: Q ? 12 : 10, weight: 700 });
      };
      drawNodeRecursive(root, w * 0.54, w * 0.21);
      if (st(3)) badge(`남은 자연수 a₁ = { ${validA1.join(', ')} } ⟹ 모든 a₁의 합 = ${validA1.reduce((a, c) => a + c, 0)}`, '#fbbf24');
    }

    if (sink.lines.length) v.card = { title: '그림 설명', lines: sink.lines.map((q) => ({ text: q.text, color: q.color })) };
    if (sink.tape) v.tape = { title: sink.tape };
  }

  const params = {};
  KILLER_MODES.forEach((mo) => {
    SLIDERS[mo.id].forEach((d) => {
      params[mo.id + '_' + d.key] = {
        value: mo.scenarios[0].params[d.key], min: d.min, max: d.max, step: d.step, color: 'amber', label: d.label,
        format: (val) => (d.step < 1 ? val.toFixed(2) : String(val)),
        onInput: (s) => {
          if (mo.id === 'type2') {
            if (d.key === 'pIdx') s.type2_pIdx = Math.min(s.type2_pIdx, s.type2_qIdx - 1);
            else s.type2_qIdx = Math.max(s.type2_qIdx, s.type2_pIdx + 1);
          }
        }
      };
    });
  });

  const STEMS = new Set([0, 1, 3]); // 기둥(Stem)이 그려지는 탐구관
  const actions = (mi) => () => {
    const out = [{ id: 'twin', icon: 'spark', label: '숫자 바꿔 보기', run: (s, lab) => twin(s, lab) }];
    if (!DESIGN.has(mi)) {
      out.push({ id: 'cont', icon: 'wand', label: '실수 전체의 그래프(실선)', on: (s) => s.cont, run: (s) => { s.cont = !s.cont; } });
      if (mi <= 1) out.push({ id: 'abs', icon: 'layers', label: '|수열|의 그래프 보기', on: (s) => s.abs, run: (s) => { s.abs = !s.abs; } });
      if (STEMS.has(mi)) out.push({ id: 'stems', icon: 'split', label: '항의 값을 막대로 표시', on: (s) => s.stems, run: (s) => { s.stems = !s.stems; } });
    }
    return out;
  };
  // 지금 장면의 쌍둥이 변형: 원본 triggerTwinProblem 을 그대로 부르고 결과를 조절값에 되돌려 줍니다
  let current = null; // { mo, scen }
  function twin(s) {
    const { mo, scen } = current;
    const p = {};
    Object.keys(scen.params).forEach((k) => { p[k] = s[mo.id + '_' + k]; });
    runTwin(mo.id, { ...scen }, p); // 탐구 탭의 조절 막대만 바꿉니다(문제 글·정답은 문제 탭의 「새 문제」가 따로 맡습니다)
    Object.keys(p).forEach((k) => { s[mo.id + '_' + k] = p[k]; });
    s.step = Math.min(s.step, 2);
    APLab.toast('숫자를 바꾼 새 문제가 만들어졌습니다');
  }

  /* ==========================================================================
     옛 장면 1~8 (문제 A·B 16개) — 「새 문제 (숫자 바꾸기)」 변형 생성기
       - 첫 문제(0번)는 원본 그대로이고, 「새 문제」를 누르면 같은 구조에서 숫자만 바뀐 변형이 나옵니다(연속 중복 없음).
       - 변형은 장면마다 원래 문제가 노린 학습 포인트(등차수열의 0항 대칭, S_p=S_q의 대칭축, 꼭짓점 접기, 상수항 함정,
         구간별 합의 공비, 부분분수 소거, 3항 순환, 나뭇가지 지우기)가 그대로 유지되는 숫자만 골랐습니다.
       - 정답·풀이 단계·문제 그림(문제 탭·정리 탭)이 모두 변형을 따라가며, 탐구 탭은 그대로입니다.
       - 계산(ENGINE)은 화면과 무관한 순수 함수라 node로 전수 검산합니다(tools/alg-sequence-old.test.mjs).
     ========================================================================== */
  /* ==OLDV-ENGINE-START== 순수 계산(화면과 무관): node로 전수 검산하는 부분 */
  const OLDV = (function () {
    const SUBD = '₀₁₂₃₄₅₆₇₈₉';
    const sub = (n) => String(n).replace(/\d/g, (d) => SUBD[+d]);
    const gcd = (a, b) => (b ? gcd(b, a % b) : Math.abs(a));
    const par = (v) => (v < 0 ? '(' + v + ')' : String(v));
    const sg = (v) => (v < 0 ? '- ' + (-v) : '+ ' + v);               // "+ 3" / "- 3"
    const frac = (n, d) => { const g = gcd(n, d); n /= g; d /= g; return d === 1 ? String(n) : `\\frac{${n}}{${d}}`; };
    const cn = (c) => (c === 1 ? '' : c === -1 ? '-' : String(c));
    const lin = (c, k) => `${cn(c)}n${k === 0 ? '' : ' ' + sg(k)}`;     // c n + k
    const quad = (p, q, C) => `${cn(p)}n^2${q === 0 ? '' : q < 0 ? ' - ' + (q === -1 ? '' : -q) + 'n' : ' + ' + (q === 1 ? '' : q) + 'n'}${C === 0 ? '' : ' ' + sg(C)}`;
    const T = (list) => list.map((x, i) => (i === 0 ? String(x) : x < 0 ? ' - ' + (-x) : ' + ' + x)).join('');

    /* ---------- 유형 1 · 항이 0이 되는 곳을 중심으로 한 대칭 ---------- */
    const T1A = {
      pool: [{ d: 2, p: 3, q: 7 }, { d: 3, p: 2, q: 8 }, { d: -2, p: 2, q: 6 }, { d: 2, p: 1, q: 5 }, { d: -3, p: 4, q: 6 }],
      solve: (it) => { const m = (it.p + it.q) / 2, a1 = -(m - 1) * it.d; return { am: 0, S: 0, a10: a1 + 9 * it.d, m, e: 2 * m - 1 }; },
      build(it) {
        const { d, p, q } = it, r = this.solve(it), m = r.m, e = r.e, a1 = -(m - 1) * d;
        const tm = (k) => (k === 0 ? 'a_1' : k === 1 ? 'a_1 + d' : `a_1 + ${k}d`);
        return {
          params: { dSlope: d, zeroN: m }, g: { d, p, q, m },
          text: `공차가 $d = ${d}$인 등차수열 $\\{a_n\\}$에서 $a_{${p}} + a_{${q}} = 0$일 때, $a_{${m}}$의 값과 $\\sum_{k=1}^{${e}} a_k$의 값, 그리고 $a_{10}$의 값을 구하시오.`,
          ans: `$a_{${m}} = 0,\\ \\sum_{k=1}^{${e}} a_k = 0,\\ a_{10} = ${r.a10}$`,
          std: [

    const T1B = {

    /* ---------- 유형 2 · 합 Sₙ의 그래프 (원점을 지나는 포물선) ---------- */

    /* ---------- 유형 3 · 절댓값을 씌운 합 ---------- */
    const S3 = (N, n) => -n * (n - N);

    /* ---------- 유형 6 · 시그마와 부분분수 ---------- */
    const T6 = (it) => { const { a1, d, n } = it, an1 = a1 + n * d; return { an1, num: n, den: a1 * an1 }; };

  // Automatic explanations bind the first original; manual new-problem choices remain separate.

  function lsqMathKey(value) {
