  // Helper for Type 8 Backward Tree generation
function computeBackwardTree(targetA4, k) {
// Levels: level 0 = a4, level 1 = a3, level 2 = a2, level 3 = a1
const root = { val: targetA4, level: 0, valid: true, reason: '목표항', children: [] };

function expand(node) {
if (node.level >= 3 || !node.valid) return;
const y = node.val;

// Branch 1: 2 * x = y => x = y / 2 (valid if x is integer/natural AND x < k)
const xLeft = y / 2;
const isIntLeft = Math.abs(xLeft - Math.round(xLeft)) < 1e-6 && xLeft >= 1;
const condLeft = xLeft < k;
const leftNode = {
val: xLeft,
level: node.level + 1,
rule: '÷2',
valid: isIntLeft && condLeft,
reason: !isIntLeft ? '자연수 아님' : (!condLeft ? `≥${k} 범위위반` : '통과'),
children: []
};

// Branch 2: x - k = y => x = y + k (valid if x >= k and natural)
const xRight = y + k;
const rightNode = {
val: xRight,
level: node.level + 1,
rule: `+${k}`,
valid: xRight >= k && Number.isInteger(Math.round(xRight)),
reason: '통과',
children: []
};

node.children = [leftNode, rightNode];
expand(leftNode);
expand(rightNode);
}

expand(root);

const validA1 = [];
function collectLeaves(node) {
if (node.level === 3 && node.valid) validA1.push(node.val);
node.children.forEach(collectLeaves);
}
collectLeaves(root);
return { root, validA1 };
}

{ title: '부분분수 전개식과 오차', val: '0.000%', sub: '통분 약분 항등식 성립' },
{ title: '맨 앞 생존 인수 a₁', val: `${a1}`, sub: '첫 항의 작은 분모' },
{ title: `맨 뒤 생존 인수 a_${n+1}`, val: `${anPlus1}`, sub: `마지막 항의 큰 분모` }
];
} else if (mId === 'type7') {
const seq = [p.startA1];
const N = Math.round(p.limitN);
for (let i = 0; i < Math.max(N, 12); i++) {
const cur = seq[i];
seq.push(cur < 4 ? cur + 2 : cur - 4);
}
let sumN = 0;
for (let i = 0; i < N; i++) sumN += seq[i];
const cycleSum = seq[0] + seq[1] + seq[2];

eq = (
`$a_1=${p.startA1.toFixed(1)} \\implies [${seq[0].toFixed(1)} \\to ${seq[1].toFixed(1)} \\to ${seq[2].toFixed(1)}] \\text{ (3주기 순환)}, \\quad \\sum_{k=1}^{${N}} a_k = ${sumN.toFixed(1)}$`
);
cards = [
{ title: '3주기 1마디 합', val: cycleSum.toFixed(2), sub: `${seq[0].toFixed(1)} + ${seq[1].toFixed(1)} + ${seq[2].toFixed(1)}` },
{ title: `제1항~제${N}항 총합`, val: sumN.toFixed(2), sub: `몫 ${Math.floor(N/3)}마디 + 나머지 ${N%3}개` },
{ title: '순환 주기 불변량', val: 'p = 3', sub: 'a_{n+3} - a_n = 0.000%' },
{ title: '거미줄 루프 균형', val: '(+2)×2 - 4 = 0', sub: '상승합 + 하강합 = 0' }
];
} else if (mId === 'type8') {
const tA4 = Math.round(p.targetA4);
const k = Math.round(p.threshK);
const { validA1 } = computeBackwardTree(tA4, k);
const sumA1 = validA1.reduce((acc, v) => acc + v, 0);

eq = (
`$a_4 = ${tA4}, \\; k = ${k} \\implies \\text{생존 자연수 } a_1 \\in \\{${validA1.join(', ')}\\}, \\quad \\sum a_1 = ${sumA1}$`
);
cards = [
{ title: '생존한 자연수 a₁ 개수', val: `${validA1.length}개`, sub: `전체 8갈래 중 ${8 - validA1.length}개 가지치기` },
{ title: '모든 가능한 a₁의 합', val: `${sumA1}`, sub: validA1.join(' + ') || '없음' },
{ title: '정방향 대입 검산 오차', val: '0.000%', sub: `모든 생존 a₁ ➔ a₄ = ${tA4}` },
{ title: '왼쪽 가지 통과 조건', val: `짝수 & < ${2*k}`, sub: `÷2 결과가 < ${k} 이어야 생존` }
];
}


    return { eq, cards };
  }

  /* ===== 원본 그대로: 쌍둥이 변형 생성기 (원본 triggerTwinProblem) — scen.problem·snapParams 를 바꿉니다 ===== */
  function runTwin(mId, scen, p) {
    if (mId === 'type1') {
const zN = [4, 5, 6, 7][Math.floor(Math.random() * 4)];
const dVal = [-3, -2, 2, 3][Math.floor(Math.random() * 4)];
p.zeroN = zN;
p.dSlope = dVal;
scen.snapParams = { ...p };
scen.problem = `**[🎲 쌍둥이 변형]** 공차가 $d = ${dVal}$이고 제$${zN}$항이 $a_{${zN}} = 0$인 등차수열입니다! 대칭 성질에 의해 첫째항부터 제$${2*zN - 1}$항까지의 합은 계산할 필요 없이 **$\\sum_{k=1}^{${2*zN-1}} a_k = 0$**입니다!`;
} else if (mId === 'type2') {
const pairs = [[2, 6], [2, 8], [3, 9], [4, 8], [3, 11]];
const pick = pairs[Math.floor(Math.random() * pairs.length)];
const sym = (pick[0] + pick[1]) / 2;
const zeroK = pick[0] + pick[1];
p.pIdx = pick[0];
p.qIdx = pick[1];
scen.snapParams = { ...p };
scen.problem = `**[🎲 쌍둥이 변형]** 등차수열에서 $S_{${pick[0]}} = S_{${pick[1]}}$일 때, 원점 통과 포물선 비기에 의해 최댓값 대칭축은 **$n = \\frac{${pick[0]}+${pick[1]}}{2} = ${sym}$**이고, 합이 $0$이 되는 항은 **$S_{${zeroK}} = 0$ ($k=${zeroK}$)**입니다!`;
} else if (mId === 'type3') {
const zSum = [6, 8, 10][Math.floor(Math.random() * 3)];
const tN = zSum + 2;
const vMax = (zSum / 2) * (zSum / 2);
const sTarget = -tN * (tN - zSum);
const ans = 2 * vMax - sTarget;
p.zeroSumN = zSum;
p.targetN = tN;
scen.snapParams = { ...p };
scen.problem = `**[🎲 쌍둥이 변형]** $S_n = -n^2 + ${zSum}n$일 때, 꼭짓점은 $S_{${zSum/2}} = ${vMax}$이고 $S_{${tN}} = ${sTarget}$이므로, 반사 공식에 의해 **$\\sum_{k=1}^{${tN}} |a_k| = 2(${vMax}) - (${sTarget}) = ${ans}$**입니다!`;
} else if (mId === 'type4') {
const pC = [1, 2, 3][Math.floor(Math.random() * 3)];
const qC = [1, 3, 5][Math.floor(Math.random() * 3)];
const cVal = [2, 4, 5][Math.floor(Math.random() * 3)];
p.pCoeff = pC;
p.qCoeff = qC;
p.constC = cVal;
scen.snapParams = { ...p };
const a1 = pC + qC + cVal;
const a5 = 2 * pC * 5 + (qC - pC);
scen.problem = `**[🎲 쌍둥이 변형]** $S_n = ${pC}n^2 + ${qC}n + ${cVal}$일 때, 1초 공식으로 $a_n = ${2*pC}n + (${qC-pC})$ ($n\\ge 2$)이므로 $a_5 = ${a5}$, 첫째항은 점프값 $+${cVal}$을 더해 $a_1 = ${a1}$, 합은 **$${a1 + a5}$**입니다!`;
} else if (mId === 'type5') {
const b1 = [4, 5, 8, 10][Math.floor(Math.random() * 4)];
const r = [2, 3][Math.floor(Math.random() * 2)];
const s2n = b1 + b1 * r;
const s3n = s2n + b1 * r * r;
p.block1 = b1;
p.blockRatio = r;
scen.snapParams = { ...p };
scen.problem = `**[🎲 쌍둥이 변형]** 등비수열에서 $S_n = ${b1},\\; S_{2n} = ${s2n}$일 때, 구간 조각 블록은 $[${b1}] \\to [${b1*r}] \\to [${b1*r*r}]$이므로 **$S_{3n} = ${s3n}$**입니다!`;
} else if (mId === 'type6') {
const nCnt = [5, 7, 9, 10][Math.floor(Math.random() * 4)];
const dVal = [2, 3, 4][Math.floor(Math.random() * 3)];
p.termCountN = nCnt;
p.firstA1 = 1;
p.diffD = dVal;
scen.snapParams = { ...p };
const lastA = 1 + nCnt * dVal;
scen.problem = `**[🎲 쌍둥이 변형]** 초항 $a_1 = 1$, 공차 $d = ${dVal}$인 등차수열에서 $\\sum_{k=1}^{${nCnt}} \\frac{1}{a_k a_{k+1}}$은 3초 공식으로 **$\\frac{\\text{항수 } ${nCnt}}{1 \\times ${lastA}} = \\frac{${nCnt}}{${lastA}}$**입니다!`;
} else if (mId === 'type7') {
const a1Val = [1, 2, 3][Math.floor(Math.random() * 3)];
const limN = [24, 27, 30, 33][Math.floor(Math.random() * 4)];
p.startA1 = a1Val;
p.limitN = limN;
scen.snapParams = { ...p };
scen.problem = `**[🎲 쌍둥이 변형]** 첫째항 $a_1 = ${a1Val}$에서 출발할 때 $3$주기 순환 루프를 따라 제$${limN}$항까지의 합을 칠판 거미줄 그래프에서 즉시 확인해보세요!`;
} else if (mId === 'type8') {
const tA4 = [2, 4, 6][Math.floor(Math.random() * 3)];
const thK = [4, 6, 8][Math.floor(Math.random() * 3)];
p.targetA4 = tA4;
p.threshK = thK;
scen.snapParams = { ...p };
scen.problem = `**[🎲 쌍둥이 변형]** 목표 항을 $a_4 = ${tA4}$, 분기 문턱값을 $k = ${thK}$로 변형했습니다! 칠판의 역추적 이진 트리에서 살아남은 골든 네온 $a_1$ 후보들과 합을 확인하세요.`;
}


  }

  /* ===== 원본 drawMathSegment / drawFunctionCurve / drawMathPoint 와 같은 이름·같은 인자 → 새 무대 엔진 ===== */
  function shim(b, s, sink) {
    let hid = 0;
    return {
      drawMathSegment: (x1, y1, x2, y2, col = '#fbbf24', dash = [], w = 2.2) => b.seg([x1, y1], [x2, y2], { color: col, width: w, dash: dash.length ? dash : null }),
      drawFunctionCurve: (fn, col = '#34d399', w = 2.4, dash = [], x0 = null, x1 = null) => {
        if (!s.cont && dash.length === 0) { dash = [4, 4]; w = 1.5; } // 원본: '연속 실수함수 실선'을 끄면 점선
        b.plot((x) => { let y = fn(x); if (s.abs && !isNaN(y)) y = Math.abs(y); return Number.isFinite(y) && Math.abs(y) <= 90 ? y : NaN; }, { color: col, width: w, dash: dash.length ? dash : null, from: x0, to: x1 });
      },
      drawMathPoint: (x, y, lbl = '', col = '#fbbf24', rad = 6, drag = false, onDrag = null) => {
        if (drag) b.handle('h' + (hid++), [x, y], { color: col, r: rad, label: lbl, drag: onDrag });
        else b.point([x, y], { color: col, r: rad, label: lbl });
      },
      badge: (text, color = '#fbbf24') => sink.lines.push({ text, color })
    };
  }

  /* 도식(탐구관 5·6·8): 원본은 캔버스 픽셀 좌표(w,h, 아래쪽이 y+)로 그렸으므로, 무대 영역 크기를 그대로 설계 좌표로 씁니다 */
  function design(b) {
    const a = b._area();
    b.focus = { x: [0, a.w], y: [0, a.h] };
    const h = a.h;
    return { w: a.w, h, P: (x, y) => [x, h - y] };
  }
  // 원본 drawCanvasBadge: 둥근 상자 안의 글자 (설계 좌표 x, y)
  function chip(b, D, x, y, text, color, bg) {
    const c = b.ctx, q = D.P(x, y), sp = b.toS(q[0], q[1]), size = 12 * b.fs;
    c.save();
    c.font = `800 ${size}px ${b.font}`;
    const w = c.measureText(text).width + 16, hh = 24 * b.fs;
    c.beginPath();
    c.roundRect(sp.x - w / 2, sp.y - hh / 2, w, hh, 6);
    c.fillStyle = bg || b.color('halo', 0.9);
    c.fill();
    c.strokeStyle = b.color(color);
    c.lineWidth = 1.3;
    c.setLineDash([]);
    c.stroke();
    c.fillStyle = b.color(color);
    c.textAlign = 'center';
    c.textBaseline = 'middle';
    c.fillText(text, sp.x, sp.y);
    c.restore();
  }

  function draw(mo, mi, b, s, v) {
    const p = pv(s, mo);
    const sink = { lines: [], tape: null };
    const { drawMathSegment, drawFunctionCurve, drawMathPoint, badge } = shim(b, s, sink);
    const st = (n) => s.step >= n; // 원본 state.steps[n] 에 해당 (셸의 단계는 누적)
    const id = mo.id;
    if (!DESIGN.has(mi)) {
      if (s.grid) b.grid();
      b.axes();
    }

    if (id === 'type1') {
      const scaleY = 0.5;
      const fn = (x) => scaleY * p.dSlope * (x - p.zeroN);
      if (st(1)) drawFunctionCurve(fn, 'rgba(52, 211, 153, 0.55)', 2.2, [], 0, 11);
      for (let n = 1; n <= 10; n++) {
        let an = p.dSlope * (n - p.zeroN);
        if (s.abs) an = Math.abs(an);
        const yPlot = scaleY * an;
        const col = an > 0.01 ? '#34d399' : (an < -0.01 ? '#fb7185' : '#fbbf24');
        if (s.stems) drawMathSegment(n, 0, n, yPlot, col, [], 2.5);
        drawMathPoint(n, yPlot, `a_${n}=${an.toFixed(0)}`, col, 5.5);
      }
      if (st(2)) {
        drawMathSegment(p.zeroN, -5, p.zeroN, 5, '#fbbf24', [5, 4], 1.8);
        badge(`영점 대칭 중심 m = ${p.zeroN.toFixed(1)} (양옆 항 부호 반대 상쇄!)`, '#fbbf24');
      }
      if (st(3)) sink.tape = `직선 기울기 = 공차 d = $\\dfrac{a_q - a_p}{q - p}$ = ${p.dSlope.toFixed(1)}`;
      drawMathPoint(p.zeroN, 0, `영점 m=${p.zeroN.toFixed(1)}`, '#fbbf24', 8, true, (w) => { p.zeroN = clamp(Math.round(w.x * 2) / 2, 2.5, 7.5); });
    } else if (id === 'type2') {
      const zeroIdx = p.pIdx + p.qIdx, symAxis = zeroIdx / 2, scaleY = 0.28;
      const fnS = (x) => scaleY * (-x * (x - zeroIdx));
      drawFunctionCurve(fnS, '#34d399', 2.8, [], -0.8, zeroIdx + 1.5);
      drawMathPoint(0, 0, '원점 S₀=0 (불변!)', '#38bdf8', 7);
      for (let n = 1; n <= zeroIdx + 1; n++) {
        const valS = -n * (n - zeroIdx);
        const yPlot = scaleY * (s.abs ? Math.abs(valS) : valS);
        const isPair = (n === p.pIdx || n === p.qIdx), isZero = (n === zeroIdx);
        const col = isZero ? '#fb7185' : (isPair ? '#fbbf24' : '#34d399');
        if (s.stems) drawMathSegment(n, 0, n, yPlot, 'rgba(52, 211, 153, 0.25)', [], 1.5);
        drawMathPoint(n, yPlot, isPair || isZero ? `S_${n}=${valS}` : '', col, isPair || isZero ? 6.5 : 4.5);
      }
      const spVal = -p.pIdx * (p.pIdx - zeroIdx), yLine = scaleY * spVal;
      drawMathSegment(p.pIdx, yLine, p.qIdx, yLine, '#fbbf24', [5, 4], 2.2);
      if (st(2)) {
        drawMathSegment(symAxis, -2, symAxis, scaleY * symAxis * symAxis + 1.2, '#fbbf24', [6, 4], 2.2);
        sink.tape = `대칭축 x = $\\dfrac{${p.pIdx} + ${p.qIdx}}{2}$ = ${symAxis.toFixed(1)} (극댓값)`;
      }
      if (st(3)) badge(`원점 대칭 절편: S_(${p.pIdx}+${p.qIdx}) = S_${zeroIdx} = 0!`, '#fb7185');
      drawMathPoint(p.qIdx, yLine, `S_${p.qIdx}`, '#fbbf24', 8, true, (w) => { p.qIdx = clamp(Math.round(w.x), Math.max(5, p.pIdx + 1), 11); });
    } else if (id === 'type3') {
      const N = p.zeroSumN, m = N / 2, sMax = m * m, scaleY = 0.22;
      const fnOrigS = (x) => scaleY * (-x * (x - N));
      const fnAbsS = (x) => scaleY * Math.abs(-x * (x - N));
      const fnSumAbsA = (x) => { const sn = -x * (x - N); return scaleY * (x <= m ? sn : 2 * sMax - sn); };
      if (st(1)) drawFunctionCurve(fnOrigS, 'rgba(52, 211, 153, 0.35)', 1.8, [5, 5], 0, 12.5);
      if (st(2)) {
        drawFunctionCurve(fnAbsS, '#38bdf8', 2.6, [], 0, 12.5);
        badge(`|S_n| : x축(n=${N})에서 꺾임`, '#38bdf8');
      }
      drawFunctionCurve(fnSumAbsA, '#fbbf24', 2.8, [], 0, 12.5);
      drawMathSegment(0, scaleY * sMax, 12, scaleY * sMax, 'rgba(251, 191, 36, 0.45)', [4, 4], 1.5);
      const n = Math.round(p.targetN), sn = -n * (n - N), sumAbsVal = n <= m ? sn : 2 * sMax - sn;
      if (st(3)) badge(`∑|a_k| = 2·S_${m}(${sMax}) − S_${n}(${sn}) = ${sumAbsVal}`, '#fbbf24');
      drawMathPoint(m, scaleY * sMax, `꼭짓점 S_${m}=${sMax}`, '#34d399', 6.5);
      drawMathPoint(n, scaleY * sumAbsVal, `n=${n} (∑|a_k|=${sumAbsVal})`, '#fbbf24', 8, true, (w) => { p.targetN = clamp(Math.round(w.x), 5, 12); });
    } else if (id === 'type4') {
      const scaleY = 0.45;
      const fnLine = (x) => scaleY * (2 * p.pCoeff * x + (p.qCoeff - p.pCoeff));
      if (st(1)) drawFunctionCurve(fnLine, '#34d399', 2.4, [], 0.5, 8.5);
      for (let n = 2; n <= 7; n++) {
        const an = 2 * p.pCoeff * n + (p.qCoeff - p.pCoeff);
        if (s.stems) drawMathSegment(n, 0, n, scaleY * an, 'rgba(52, 211, 153, 0.4)', [], 2);
        drawMathPoint(n, scaleY * an, `a_${n}=${an.toFixed(0)}`, '#34d399', 5.5);
      }
      const a1Formula = p.pCoeff + p.qCoeff, a1Actual = a1Formula + p.constC;
      drawMathPoint(1, scaleY * a1Formula, `공식값(${a1Formula.toFixed(0)})`, 'rgba(148, 163, 184, 0.7)', 5);
      if (st(2) && Math.abs(p.constC) > 0.01) {
        drawMathSegment(1, scaleY * a1Formula, 1, scaleY * a1Actual, '#fb7185', [4, 3], 3.0);
        badge(`상수항 C=${p.constC} 만큼 a₁ 단독 점프 이탈!`, '#fb7185');
      }
      if (st(3)) badge(`1초 미분형 암산: a_n = ${2 * p.pCoeff}n + (${p.qCoeff - p.pCoeff}) (n≥2) | a₁ = ${a1Formula} + C(${p.constC}) = ${a1Actual}`, '#fbbf24');
      drawMathPoint(1, scaleY * a1Actual, `실제 a₁=S₁=${a1Actual.toFixed(0)}`, '#fbbf24', 8, true, (w) => {
        const rawA1 = w.y / scaleY;
        p.constC = clamp(Math.round(rawA1 - a1Formula), -3, 5);
      });
    } else if (id === 'type5') {
      const D = design(b), w = D.w, h = D.h, P = D.P;
      const P1 = p.block1, R = p.blockRatio, P2 = P1 * R, P3 = P2 * R, S3n = P1 + P2 + P3;
      const baseLineY = h * 0.78, maxVal = Math.max(P3, 60), scaleH = (h * 0.52) / maxVal;
      const blocks = [
        { l1: 'P₁ · 1~n항', l2: '= Sₙ', val: P1, cum: P1, color: '#34d399', x: w * 0.22 },
        { l1: 'P₂ · n+1~2n항', l2: '= S₂ₙ − Sₙ', val: P2, cum: P1 + P2, color: '#38bdf8', x: w * 0.50 },
        { l1: 'P₃ · 2n+1~3n항', l2: '= S₃ₙ − S₂ₙ', val: P3, cum: S3n, color: '#fbbf24', x: w * 0.78 }
      ];
      b.seg(P(w * 0.1, baseLineY), P(w * 0.9, baseLineY), { color: 'rgba(236, 253, 245, 0.4)', width: 2 });
      const barW = Math.min(96, w * 0.16);
      blocks.forEach((bk, idx) => {
        const bh = bk.val * scaleH, left = bk.x - barW / 2, top = baseLineY - bh;
        b.poly([P(left, top), P(left + barW, top), P(left + barW, baseLineY), P(left, baseLineY)], { fill: bk.color, fillAlpha: 0.2, color: bk.color, width: 2.4 });
        b.text(P(bk.x, top - 12), `조각 = ${bk.val.toFixed(1)}`, { color: '#ffffff', size: 15, weight: 800 });
        b.text(P(bk.x, baseLineY + 20), bk.l1, { color: 'rgba(209, 250, 229, 0.85)', size: 12, weight: 800 });
        b.text(P(bk.x, baseLineY + 37), bk.l2, { color: 'rgba(209, 250, 229, 0.85)', size: 12, weight: 800 });
        b.text(P(bk.x, baseLineY + 56), `누적 S_${idx + 1}n = ${bk.cum.toFixed(1)}`, { color: '#fbbf24', size: 12, weight: 800 });
      });
      if (st(2)) {
        chip(b, D, w * 0.36, baseLineY - P2 * scaleH * 0.6, `× R (${R.toFixed(1)}배)`, '#fbbf24');
        chip(b, D, w * 0.64, baseLineY - P3 * scaleH * 0.6, `× R (${R.toFixed(1)}배)`, '#fbbf24');
      }
      if (st(3)) sink.tape = `구간 조각 공비 R = rⁿ = $\\dfrac{P_2\\ (${P2.toFixed(1)})}{P_1\\ (${P1.toFixed(1)})}$ = ${R.toFixed(2)} ⟹ S_3n = ${S3n.toFixed(1)}`;
      // [2.0 수정] 둘째 막대 꼭대기 점: 끌면 공비 R 이 바뀜 (원본은 끌어도 아무 일도 없었음)
      drawMathPoint(w * 0.5, h - (baseLineY - P2 * scaleH), '', '#fbbf24', 8, true, (wp) => {
        const P2n = (wp.y - (h - baseLineY)) / scaleH;
        p.blockRatio = clamp(Math.round((P2n / P1) * 2) / 2, 1.5, 3.5);
      });
    } else if (id === 'type6') {
      const D = design(b), w = D.w, h = D.h, P = D.P;
      const n = Math.round(p.termCountN), a1 = p.firstA1, d = p.diffD;
      const startY = h * 0.24, rowH = Math.min(42, (h * 0.56) / Math.min(n, 7)), showCount = Math.min(n, 6);
      sink.tape = `S = $\\dfrac{1}{d\\ (${d})}$ × { 항들의 합 }`;
      for (let k = 1; k <= showCount; k++) {
        const idx = (k === showCount && n > 6) ? n : k;
        const ak = a1 + (idx - 1) * d, ak1 = ak + d;
        const cy = startY + (k - 0.5) * rowH, xLeft = w * 0.36, xRight = w * 0.62;
        chip(b, D, xLeft, cy, `+ 1 / ${ak}`, idx === 1 ? '#fbbf24' : '#34d399');
        chip(b, D, xRight, cy, `- 1 / ${ak1}`, idx === n ? '#fbbf24' : '#38bdf8');
        if (st(2) && k < showCount) b.seg(P(xRight - 30, cy - 8), P(xLeft + 30, cy + rowH + 8), { color: '#fb7185', width: 2.6 });
      }
      if (st(3)) {
        const lastDen = a1 + n * d;
        sink.tape += ` ｜ 3초 공식 정답 = $\\dfrac{\\text{항의 개수 } n\\ (${n})}{\\text{맨앞}(${a1}) \\times \\text{맨뒤}(${lastDen})}$ = ${n} / ${a1 * lastDen}`;
      }
    } else if (id === 'type7') {
      drawFunctionCurve((x) => x, 'rgba(236, 253, 245, 0.45)', 1.8, [5, 5], -1, 8);
      drawFunctionCurve((x) => x + 2, '#34d399', 3.0, [], -1, 3.99);
      drawFunctionCurve((x) => x - 4, '#38bdf8', 3.0, [], 4.0, 8.5);
      drawMathSegment(4, -2, 4, 7, 'rgba(251, 113, 133, 0.4)', [4, 4], 1.5);
      const seq = [p.startA1];
      for (let i = 0; i < 8; i++) { const cur = seq[i]; seq.push(cur < 4 ? cur + 2 : cur - 4); }
      if (st(2)) {
        for (let i = 0; i < 5; i++) {
          const x = seq[i], y = seq[i + 1], col = i < 3 ? '#fbbf24' : '#fb7185';
          drawMathSegment(x, x, x, y, col, [], 2.4);
          drawMathSegment(x, y, y, y, col, [4, 3], 2.2);
          drawMathPoint(x, y, `P_${i + 1}(${x.toFixed(1)}, ${y.toFixed(1)})`, col, 5.5);
        }
      }
      if (st(3)) {
        const cSum = seq[0] + seq[1] + seq[2];
        badge(`3주기 순환 루프: [${seq[0].toFixed(1)} → ${seq[1].toFixed(1)} → ${seq[2].toFixed(1)}] (1마디 합 = ${cSum.toFixed(1)})`, '#fbbf24');
      }
      drawMathPoint(p.startA1, p.startA1, `출발 a₁=${p.startA1.toFixed(1)}`, '#fbbf24', 8, true, (w) => { p.startA1 = clamp(Math.round(w.x * 2) / 2, 0.5, 5.5); });
    } else if (id === 'type8') {
      const D = design(b), w = D.w, h = D.h, P = D.P;
      const tA4 = Math.round(p.targetA4), k = Math.round(p.threshK);
      const { root, validA1 } = computeBackwardTree(tA4, k);
      const levelY = [h * 0.18, h * 0.39, h * 0.61, h * 0.83];
      const levelNames = w < 600 ? ['a₄', 'a₃', 'a₂', 'a₁'] : ['제4항 (a₄)', '제3항 (a₃)', '제2항 (a₂)', '첫째항 (a₁ 후보)'];
      levelY.forEach((ly, idx) => {
        b.seg(P(w * 0.06, ly), P(w * 0.94, ly), { color: 'rgba(52, 211, 153, 0.14)', width: 1 });
        b.text(P(w * 0.05, ly - 10), levelNames[idx], { color: 'rgba(167, 243, 208, 0.7)', size: 12, align: 'left', weight: 800 });
      });
      const drawNodeRecursive = (node, cx, spread) => {
        const cy = levelY[node.level];
        if (node.children && node.children.length === 2 && (st(1) || node.level === 0)) {
          node.children.forEach((child, idx) => {
            const childX = idx === 0 ? cx - spread : cx + spread, childY = levelY[child.level];
            b.seg(P(cx, cy + 14), P(childX, childY - 14), { color: child.valid ? 'rgba(52, 211, 153, 0.75)' : 'rgba(251, 113, 133, 0.45)', width: child.valid ? 2.4 : 1.6, dash: child.valid ? null : [4, 4] });
            b.text(P((cx + childX) / 2, (cy + childY) / 2), child.rule, { color: child.valid ? '#a7f3d0' : '#fda4af', size: 10.5, weight: 800 });
            drawNodeRecursive(child, childX, spread * 0.5);
          });
        }
        const isLeafValid = (node.level === 3 && node.valid);
        const boxColor = !node.valid ? '#fb7185' : (isLeafValid ? '#fbbf24' : '#34d399');
        const bg = !node.valid ? 'rgba(136, 19, 55, 0.65)' : (isLeafValid ? 'rgba(120, 53, 15, 0.85)' : 'rgba(6, 78, 59, 0.85)');
        const valStr = Number.isInteger(node.val) ? `${node.val}` : node.val.toFixed(1);
        chip(b, D, cx, cy, !node.valid && st(2) ? `✕ ${valStr}` : valStr, boxColor, bg);
        if (!node.valid && st(2)) b.text(P(cx, cy + 22), node.reason, { color: '#fda4af', size: 10, weight: 700 });
      };
      drawNodeRecursive(root, w * 0.54, w * 0.21);
      if (st(3)) badge(`최종 생존 자연수 a₁ = { ${validA1.join(', ')} } ⟹ 모든 a₁의 합 = ${validA1.reduce((a, c) => a + c, 0)}`, '#fbbf24');
    }

    if (sink.lines.length) v.card = { title: '칠판 판서', lines: sink.lines.map((q) => ({ text: q.text, color: q.color })) };
    if (sink.tape) v.tape = { title: sink.tape };
  }

  const params = {};
  KILLER_MODES.forEach((mo) => {
    SLIDERS[mo.id].forEach((d) => {
      params[mo.id + '_' + d.key] = {
        value: mo.scenarios[0].params[d.key], min: d.min, max: d.max, step: d.step, color: 'amber', label: d.label,
        format: (val) => (d.step < 1 ? val.toFixed(2) : String(val))
      };
    });
  });

  const STEMS = new Set([0, 1, 3]); // 기둥(Stem)이 그려지는 탐구관
  const actions = (mi) => () => {
    const out = [{ id: 'twin', icon: 'spark', label: '쌍둥이 숫자 변형', run: (s, lab) => twin(s, lab) }];
    if (!DESIGN.has(mi)) {
      out.push({ id: 'cont', icon: 'wand', label: '연속 실수함수 실선', on: (s) => s.cont, run: (s) => { s.cont = !s.cont; } });
      out.push({ id: 'abs', icon: 'layers', label: '|수열| 절댓값 반전', on: (s) => s.abs, run: (s) => { s.abs = !s.abs; } });
      if (STEMS.has(mi)) out.push({ id: 'stems', icon: 'split', label: '자연수 항 기둥(Stem)', on: (s) => s.stems, run: (s) => { s.stems = !s.stems; } });
    }
    return out;
  };
  // 지금 장면의 쌍둥이 변형: 원본 triggerTwinProblem 을 그대로 부르고 결과를 조절값에 되돌려 줍니다
  let current = null; // { mo, scen }
  function twin(s) {
    const { mo, scen } = current;
    const p = {};
    Object.keys(scen.params).forEach((k) => { p[k] = s[mo.id + '_' + k]; });
    runTwin(mo.id, scen, p);
    Object.keys(p).forEach((k) => { s[mo.id + '_' + k] = p[k]; });
    s.step = Math.min(s.step, 2);
    APLab.toast('새로운 쌍둥이 숫자 변형 문제가 생성되었습니다');
  }

  const groups = KILLER_MODES.map((mo, mi) => ({
    id: mo.id,
    title: rich(mo.shortTitle),
    short: SHORT[mi],
    scenes: mo.scenarios.map((scen, si) => ({
      id: mo.id + '-' + si,
      title: rich(scen.chip),
      short: scen.chip.split(' (')[0],
      question: Q[mi],
      guide: GUIDE[mi],
      controls: SLIDERS[mo.id].map((d) => mo.id + '_' + d.key),
      actions: actions(mi),
      steps: mo.stepLabels.map((l, k) => `Step ${k + 1} · ${rich(l)}`),
      startStep: 2,
      notesTitle: '오답 함정 주의보',
      focus: () => FOCUS[mi],
      enter: (s) => {
        current = { mo, scen };
        Object.keys(scen.params).forEach((k) => { s[mo.id + '_' + k] = scen.params[k]; });
      },
      problem: {
        tag: scen.source,
        text: () => rich(scen.problem),
        answer: () => '풀이와 결과는 정리 탭의 「두 가지 풀이 비교」에서 확인하세요.',
        snap: () => { const o = {}; Object.keys(scen.snapParams).forEach((k) => { o[mo.id + '_' + k] = scen.snapParams[k]; }); return o; }
      },
      solution: {
        standardTitle: rich(scen.textbookTitle), standardTag: '정석 3분',
        quickTitle: rich(scen.secretTitle), quickTag: '10초 컷',
        standard: () => ({ steps: scen.textbookSteps.map((x) => `<div>${rich(x)}</div>`).join('') }),
        quick: () => ({ steps: scen.secretSteps.map((x) => `<div>${rich(x)}</div>`).join('') })
      },
      view: (s) => {
        current = { mo, scen };
        const h = hudOf(mo.id, pv(s, mo));
        return {
          chips: [{ k: mo.code, html: rich(h.eq) }],
          readouts: h.cards.map((c) => ({ label: rich(c.title), value: String(c.val), note: rich(c.sub), color: 'amber' })),
          formula: s.step >= 1 ? rich(mo.stepDescs[Math.min(s.step, 3) - 1]) : '',
          notes: rich(mo.trapWarning)
        };
      },
      draw: (b, s, v) => draw(mo, mi, b, s, v)
    }))
  }));

  APLab.createLab({
    id: 'alg-sequence',
    title: '수열의 그래프와 점화식',
    courseName: '대수',
    unit: '수열 · 수열의 함수적 해석',
    courseColor: 'var(--m-sky)',
    home: '../index.html#algebra',
    legacy: '../../labs/대수/part3.html',
    board: { kind: 'cartesian', focus: FOCUS[0] },
    params,
    state: { cont: true, abs: false, stems: true },
    groups
  });
});
</script>
