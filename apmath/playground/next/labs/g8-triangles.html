  // 이 장면에서 '변환(0→100%)'이 실제로 그림을 바꾸는 장면만 변환 조절을 보여 줍니다(원본 그리기 코드의 state.fold 사용처).
  const FOLD = new Set([
    'isoStd', 'isoRight', 'isoSide', 'isoPointP', 'counterDMH', 'counterObtuseH',
    'rhaPair', 'rhsPair', 'trapezoidRHA', 'kiteFold',
    'sss', 'sas', 'asa', 'bowtie', 'rot60',
    'angleBisect', 'angleBisectConv', 'perpBisect', 'slantedCounter',
    'incenterStd', 'incenterUnfold', 'incenterTangents', 'incenterRightSq', 'incenterAngle', 'incenterParallel'
  ]);
  // 꼭지각 ∠A·삼각형 모양 프리셋이 그림을 바꾸는 장면(꼭짓점 A·B·C 좌표를 쓰는 탐구관 1·5·6·7과 8번의 inBisect)
  const PTS_MODES = new Set([1, 5, 6, 7]);
  const usesPts = (m, id) => PTS_MODES.has(m) || id === 'inBisect';
  const ANG_PRESETS = [40, 60, 80, 120];
  const SHAPES = [['iso', '이등변'], ['right', '직각 90°'], ['scalene', '비대칭'], ['obtuse', '둔각']];
  const LENSES = [
    ['all', '🔍 전체 구조'],
    ['def', '📌 정의·중점·수선의 발(D·E·F)'],
    ['p1', '✨ 같은 거리(R·r)·합동인 삼각형·꼭짓점에서 접점까지의 거리'],
    ['p3', '🪡 ∠BOC=2∠A · ∠BIC=90°+½∠A · 외각']
  ];
  // [2.0 수정] 수직이등분선 위의 점 P: 변환은 한 바퀴 사인 곡선(P = -120 + 50·sin 2π·t)이라 0%·50%·100%가 모두 같은 자리.
  // 그림이 실제로 달라지는 25%(P 아래)·75%(P 위)를 버튼으로 둡니다.
  const FOLD_CHIPS = (id) => (id === 'perpBisect'
    ? [[0, '0% 원위치'], [0.25, '25% P 아래로'], [0.75, '75% P 위로']]
    : [[0, '0% 시작'], [0.5, '50%'], [1, '100% 완성']]);
  const lensList = (m, id) => {
    const off = (LENS_OFF[m] || []).concat(LENS_OFF[id] || []);
    const rest = ['def', 'p1', 'p3'].filter((x) => !off.includes(x));
    return rest.length ? ['all'].concat(rest) : []; // 원본 syncLensButtons: 효과 있는 렌즈가 하나도 없으면 렌즈 전체를 숨김
  };
  function sync(s, m, id) {
    state.mode = m;
    state.subType[m] = id;
    state.fold = s.fold;
    state.activePartIdx = s.part == null ? -1 : s.part;
    state.conceptSwitch = lensList(m, id).includes(s.lens) ? s.lens : 'all';
    state.pts = s.pts;
    state.shapeTag = s.shape;
    state.constraintLocked = s.locked;
    state.showTrace = !!s.showTrace;
    state.tracePoints = s.trace || [];
    state.scale = 1;
  }
  // 셸은 이모지(➔ ⭕ ❌ 포함)를 화면 표시에서 떼어 내므로, 문장 속 뜻이 사라지지 않게 → ○ × 로 미리 바꿔 넘깁니다(원문 getSpec은 그대로).
  const arrow = (v) => (typeof v === 'string' ? arrowOnly(v) : Array.isArray(v) ? v.map(arrow) : v && typeof v === 'object' ? Object.fromEntries(Object.entries(v).map(([k, x]) => [k, arrow(x)])) : v);
  const tone = (p) => (p.ok === false ? 'red' : p.color);
  // 프리셋으로 그림이 크게 바뀐 뒤에는 무대를 새 그림에 맞춥니다(원본 resetView 의 초기화와 같은 뜻)
  const refit = (lab) => { try { const f = lab._measureFocus(lab.scene); if (f) lab.board.setFocus(f, true); } catch (e) { /* 맞춤 실패해도 그림은 그대로 */ } };
  const angOf = (s) => getAngles(s.pts.A, s.pts.B, s.pts.C);

  function sceneOf(m, it) {
    const id = it.id;
    const label = arrow(it.label);
    return {
      id, title: label, short: label, reviewTab: true, autoFit: true,
      question: QUESTIONS[m - 1],
      notesTitle: '오답 함정과 참고',
      enter: (s) => {
        // 원본 setMode / setSubType 의 초기화 규칙 그대로(변환 0%, 점 위치 초기화, 렌즈가 없는 장면이면 전체 구조)
        applySubTypeGeometry(s, m, id);
        // [2.0 수정] 연꼴 접기는 완성(100%)에서 시작: 원본은 0%에도 접힌 그림을 보여 0%·100%가 같고 슬라이더를 움직이면 갑자기 펼쳐졌습니다.
        if (id === 'kiteFold') s.fold = 1;
        if (!lensList(m, id).includes(s.lens)) s.lens = 'all';
      },
      controls: () => (FOLD.has(id) ? ['fold'] : []),
      presets: (s) => {
        const out = [];
        if (FOLD.has(id)) FOLD_CHIPS(id).forEach(([v, lbl]) => out.push({ group: '변환 단계', label: lbl, set: { fold: v }, ms: 700, on: (st) => Math.abs(st.fold - v) < 0.01 }));
        if (usesPts(m, id)) {
          ANG_PRESETS.forEach((d) => out.push({ group: '꼭지각 ∠A 바로 맞추기 (이등변)', label: `${d}°`, apply: (st, lab) => { snapAngleA(st, d); st.trace = []; refit(lab); }, on: (st) => Math.abs(Math.round(angOf(st).degA) - d) <= 2 }));
          SHAPES.forEach(([k, lbl]) => out.push({ group: '삼각형 모양 전환', label: lbl, apply: (st, lab) => { snapShape(st, k); st.trace = []; refit(lab); }, on: (st) => st.shape === k }));
        }
        const lenses = lensList(m, id);
        if (lenses.length) LENSES.filter(([k]) => lenses.includes(k)).forEach(([k, lbl]) => out.push({ group: '강조해서 보기', label: lbl, apply: (st) => { st.lens = k; }, on: (st) => st.lens === k }));
        if (PTS_MODES.has(m) && s.shape !== 'side') {
          out.push({ group: '꼭짓점 끌기', label: '조건 유지 드래그', apply: (st) => { st.locked = true; }, on: (st) => st.locked });
          out.push({ group: '꼭짓점 끌기', label: '자유 변형(반례)', apply: (st) => { st.locked = false; }, on: (st) => !st.locked });
        }
        if (m === 5 || m === 7) { // 외심 O가 그려지는 탐구관에서만
          out.push({ group: '외심 O의 자취', label: '켜기', apply: (st) => { st.showTrace = true; st.trace = []; }, on: (st) => !!st.showTrace });
          out.push({ group: '외심 O의 자취', label: '끄기', apply: (st) => { st.showTrace = false; st.trace = []; }, on: (st) => !st.showTrace });
        }
        return out;
      },
      actions: () => {
        if (!FOLD.has(id)) return [];
        return [{
          id: 'act', play: true, primary: true, icon: 'wand',
          label: (st) => { sync(st, m, id); return arrow(getSpec().actionTxt); },
          run: (st, lab) => { lab.tween({ fold: st.fold > 0.5 ? 0 : 1 }, 1100); }
        }];
      },
      view: (s) => {
        sync(s, m, id);
        const spec = arrow(getSpec());
        const v = {
          guide: `<div style="font-weight:800;margin-bottom:6px">${APLab.esc(APLab.stripEmoji(spec.badge))}</div>${spec.hint}`,
          parts: spec.parts.map((p) => ({ id: p.id, name: p.name, desc: p.desc, value: p.val, color: tone(p), ok: p.ok })),
          summary: spec.totalRes,
          rule: spec.rule,
          formula: spec.formulaHTML,
          notes: spec.notes
        };
        if (usesPts(m, id)) {
          const a = angOf(s), dA = Math.round(a.degA), dB = Math.round(a.degB);
          v.readouts = [
            { label: '∠A', value: `${dA}°`, color: 'amber' },
            { label: '∠B', value: `${dB}°`, color: 'sky' },
            { label: '∠C', value: `${180 - dA - dB}°`, color: 'rose' }
          ];
        }
        return v;
      },
      draw: (b, s, v) => {
        BOARD = b;
        CUR = s;
        const paint = (st) => {
          sync(st, m, id);
          sink.card = null;
          sink.tape = null;
          if (st.grid) b.grid({ step: 40 });
          // 두 번 훑기: 1회 점 위치 수집 → 2회 그리기(이름표가 점·다른 이름표와 겹치지 않게 놓음)
          PL.obst = [];
          PL.placed = [];
          PL.pass = 1;
          paintScene();
          PL.pass = 2;
          PL.placed = [];
          paintScene();
        };
        // 자동 맞춤을 재는 중: 변환 단계 전체를 겹쳐 그려, 어느 단계에서도 그림·글자가 잘리지 않는 범위를 구합니다.
        const paintAll = () => (FOLD.has(id) ? [0, 0.25, 0.75, 1] : [s.fold]).forEach((f) => paint({ ...s, fold: f }));
        if (b._bbox) { paintAll(); return; }
        if (b.thumb) { // 모든 장면 미리보기: 장면 범위를 직접 재어 맞추고, 진입 상태(변환 시작)로 그림
          const bb = b.measure(paintAll);
          if (bb) b.focus = b.fitBox(bb, { margin: 0.08, px: 5 });
          paint({ ...s, part: null });
          return;
        }
        paint(s);
        v.card = sink.card;
        v.tape = sink.tape;
      }
    };
  }

  const groups = Object.keys(SUB_MENUS).map((k) => {
    const m = +k;
    return { id: 'm' + m, title: TABS[m - 1], short: SHORT[m - 1], scenes: SUB_MENUS[m].map((it) => sceneOf(m, it)) };
  });

  APLab.createLab({
    id: 'g8-triangles',
    title: '삼각형 경험도감',
    courseName: '중2',
    unit: '삼각형의 성질',
    courseColor: 'var(--m-sky)',
    home: '../index.html#g8',
    legacy: '../../labs/g8/triangles-atlas.html',
    board: { kind: 'figure', autoFit: true, minZoom: 0.4, maxZoom: 5 },
    state: { lens: 'all', pts: { A: { x: 0, y: -150 }, B: { x: -135, y: 100 }, C: { x: 135, y: 100 } }, shape: 'iso', locked: true, showTrace: false, trace: [] },
    persist: ['lens'],
    params: {
      fold: { value: 0, min: 0, max: 1, step: 0.005, color: 'amber', label: '변환 진행 (0% → 100%)', hint: '대칭 접기 · 합동 포개기 · 넓이 3분할 펼치기 같은 변환을 천천히 확인합니다', format: (v) => `${Math.round(v * 100)}%` }
    },
    groups
  });
});
</script>
