   - 꼭짓점 A·B·C는 후광이 있는 점(끌 수 있음)으로 표시하고 ∠A·∠B·∠C를 '지금 보이는 값'으로 보여 줌

    const GCOL = {
      cyan: '#38bdf8',
      pink: '#f472b6',
      green: '#34d399',
      gold: '#fbbf24',
      white: '#f1f5f9',
      red: '#f43f5e',

    function dist(p1, p2) { return Math.hypot(p2.x - p1.x, p2.y - p1.y); }
    function midPt(p1, p2) { return { x: (p1.x + p2.x) / 2, y: (p1.y + p2.y) / 2 }; }
    const addPt = (p, v) => ({ x: p.x + v.x, y: p.y + v.y });
    const minusPt = (a, b) => ({ x: a.x - b.x, y: a.y - b.y });
    const multiply = (v, k) => ({ x: v.x * k, y: v.y * k });
    const perp = (v) => ({ x: -v.y, y: v.x });
    const norm = (v) => { const l = Math.hypot(v.x, v.y) || 1; return { x: v.x / l, y: v.y / l }; };
    const lerp = (a, b, t) => ({ x: a.x + (b.x - a.x) * t, y: a.y + (b.y - a.y) * t });

    function getAngles(A, B, C) {
      const a = dist(B, C), b = dist(C, A), c = dist(A, B);
      function lawOfCos(opp, adj1, adj2) {
        const denom = 2 * adj1 * adj2;
        if (denom < 1e-6) return 0;
        const val = (adj1 * adj1 + adj2 * adj2 - opp * opp) / denom;
        return Math.acos(Math.max(-1, Math.min(1, val))) * (180 / Math.PI);
      }
      return {
        degA: lawOfCos(a, b, c),
        degB: lawOfCos(b, c, a),
        degC: lawOfCos(c, a, b),
        a, b, c
      };
    }

    function projectOnLine(p, p1, p2) {
      const dx = p2.x - p1.x, dy = p2.y - p1.y;
      const lenSq = dx * dx + dy * dy;
      if (lenSq < 1e-6) return { ...p1 };
      const u = ((p.x - p1.x) * dx + (p.y - p1.y) * dy) / lenSq;
      return { x: p1.x + u * dx, y: p1.y + u * dy };
    }

    function intersectTwoLines(a, b, c, d) {
      const u = minusPt(b, a), v = minusPt(d, c);
      const det = u.x * v.y - u.y * v.x;
      if (Math.abs(det) < 1e-9) return null;
      const w = minusPt(c, a);
      const t = (w.x * v.y - w.y * v.x) / det;
      return addPt(a, multiply(u, t));
    }

    function reflectAcrossLine(p, p1, p2) {
      const foot = projectOnLine(p, p1, p2);
      return { x: 2 * foot.x - p.x, y: 2 * foot.y - p.y };
    }

    function rotatePtAround(p, center, rad) {
      const dx = p.x - center.x, dy = p.y - center.y;
      const cos = Math.cos(rad), sin = Math.sin(rad);
      return {
        x: center.x + dx * cos - dy * sin,
        y: center.y + dx * sin + dy * cos
      };
    }

    function getAngleBisectorAxis(A, B, C) {
      const la = dist(A, B) || 1, lb = dist(A, C) || 1;
      const uAB = { x: (B.x - A.x) / la, y: (B.y - A.y) / la };
      const uAC = { x: (C.x - A.x) / lb, y: (C.y - A.y) / lb };
      const bisectDir = { x: uAB.x + uAC.x, y: uAB.y + uAC.y };
      const len = Math.hypot(bisectDir.x, bisectDir.y) || 1;
      const p2 = { x: A.x + (bisectDir.x / len) * 300, y: A.y + (bisectDir.y / len) * 300 };
      const D = intersectTwoLines(A, p2, B, C) || projectOnLine(A, B, C);
      return { p1: A, p2, D };
    }

    function getCircumcenter(A, B, C) {
      const d = 2 * (A.x * (B.y - C.y) + B.x * (C.y - A.y) + C.x * (A.y - B.y));
      if (Math.abs(d) < 1e-6) return null;
      const ux = ((A.x * A.x + A.y * A.y) * (B.y - C.y) + (B.x * B.x + B.y * B.y) * (C.y - A.y) + (C.x * C.x + C.y * C.y) * (A.y - B.y)) / d;
      const uy = ((A.x * A.x + A.y * A.y) * (C.x - B.x) + (B.x * B.x + B.y * B.y) * (A.x - C.x) + (C.x * C.x + C.y * C.y) * (B.x - A.x)) / d;
      const O = { x: ux, y: uy };
      const R = dist(O, A);
      return {
        O, R,
        D: midPt(B, C),
        E: midPt(C, A),
        F: midPt(A, B)
      };
    }

    function getIncenter(A, B, C) {
      const a = dist(B, C), b = dist(C, A), c = dist(A, B);
      const perim = a + b + c;
      if (perim < 1e-6) return null;
      const Ix = (a * A.x + b * B.x + c * C.x) / perim;
      const Iy = (a * A.y + b * B.y + c * C.y) / perim;
      const I = { x: Ix, y: Iy };
      const s = perim / 2;
      const S = Math.sqrt(Math.max(0, s * (s - a) * (s - b) * (s - c)));
      const r = (2 * S) / perim;
      const D = projectOnLine(I, B, C);
      const E = projectOnLine(I, C, A);
      const F = projectOnLine(I, A, B);
      return { I, r, S, perim, D, E, F };
    }

        G: { x: (A.x + B.x + C.x) / 3, y: (A.y + B.y + C.y) / 3 },
        D: midPt(B, C),
        E: midPt(C, A),
        F: midPt(A, B)
      };
    }

  // 스마트 제약 드래그 (원본 applySmartDrag: 좌표는 설계 좌표)
  function applySmartDrag(s, node, localPt) {
    const P = s.pts;
    if (s.locked && s.shape === 'iso') {
      const midX = (P.B.x + P.C.x) / 2;
      if (node === 'A') {
        P.A.x = midX;
        P.A.y = Math.max(-210, Math.min(160, localPt.y));
      } else if (node === 'B') {
        P.B.x = Math.min(midX - 25, localPt.x);
        P.B.y = localPt.y;
        P.C.x = 2 * midX - P.B.x;
        P.C.y = P.B.y;
      } else if (node === 'C') {
        P.C.x = Math.max(midX + 25, localPt.x);
        P.C.y = localPt.y;
        P.B.x = 2 * midX - P.C.x;
        P.B.y = P.C.y;
      }
    } else if (s.locked && s.shape === 'right') {
      if (node === 'A') {
        P.A.x = P.B.x;
        P.A.y = Math.min(P.B.y - 30, localPt.y);
      } else if (node === 'C') {
        P.C.x = Math.max(P.B.x + 30, localPt.x);
        P.C.y = P.B.y;
      } else if (node === 'B') {
        P.B.x = Math.min(P.C.x - 30, localPt.x);
        P.B.y = Math.max(P.A.y + 30, localPt.y);
        P.A.x = P.B.x;
        P.C.y = P.B.y;
      }
    } else if (s.shape === 'side') {
      // [2.0 수정] 옆으로 누운 이등변: 대칭축은 가로선 y = 0. 꼭짓점 A는 축 위에서만(좌우), 밑변의 두 꼭짓점 B·C는 축에 대칭으로 움직여
      // 끌어도 AB = AC, ∠B = ∠C 가 유지됩니다. (B는 축 위쪽, C는 축 아래쪽에 두고 축에서 25 이상 떨어지게)
      const baseX = P.B.x;
      if (node === 'A') {
        const dir = P.A.x >= baseX ? 1 : -1;
        const d = (localPt.x - baseX) * dir; // 밑변에서 A 쪽으로 잰 거리
        P.A.y = 0;
        P.A.x = baseX + dir * Math.max(25, Math.min(380, d));
      } else {
        const sgn = node === 'B' ? -1 : 1; // B는 y<0, C는 y>0
        const y = sgn * Math.max(25, sgn * localPt.y);
        const dir = P.A.x >= baseX ? 1 : -1;
        let x = localPt.x;
        if ((P.A.x - x) * dir < 25) x = P.A.x - dir * 25; // 꼭짓점 A와 밑변이 겹치지 않게
        P.B.x = P.C.x = x;
        P.B.y = -Math.abs(y);
        P.C.y = Math.abs(y);
      }
    } else {
      P[node].x = localPt.x;
      P[node].y = localPt.y;
    }
    if (s.showTrace) {
      const circum = getCircumcenter(P.A, P.B, P.C);
      if (circum) {
        s.trace.push({ ...circum.O });
        if (s.trace.length > 80) s.trace.shift();
      }
    }
  }

          asa: { title: 'ASA 합동 (한 쌍의 대응변과 그 양 끝각이 같을 때)', rule: 'BC = EF, 양 끝각 ∠B = ∠E, ∠C = ∠F ➔ △ABC ≡ △DEF (ASA 합동)' },
          bowtie: { title: '맞꼭지각이 끼인각인 삼각형의 합동 (숨은 끼인각 찾기!)', rule: 'OA = OC, OB = OD, 맞꼭지각 ∠AOB = ∠COD ➔ △OAB ≡ △OCD (SAS)' },
          parallelZ: { title: '평행선 Z자 엇각을 이용한 합동', rule: 'AB ∥ CD (엇각 ∠A=∠C, ∠B=∠D) + AB = CD ➔ △OAB ≡ △OCD (ASA)' },
          rot60: { title: '정삼각형 2개가 꼭짓점 A를 공유할 때 60° 회전하여 겹치는 합동', rule: 'AB = AC, AD = AE, ∠BAD = 60°+∠CAD = ∠CAE ➔ △ABD ≡ △ACE (SAS)' }
        };
        const cur = map[sub];
        return {
          badge: `탐구 3 · 일반삼각형의 합동 — ${cur.title}`,
          hint: `슬라이더를 오른쪽으로 밀어 두 삼각형이 완벽하게 포개어지는지 확인하세요! <strong class="text-amber-300">${cur.rule}</strong>`,
          actionTxt: state.fold > 0.5 ? '🎬 두 삼각형 분리하기' : '🎬 이동·회전하여 포개어 합동 확인!',
          parts: [
            { id: 0, name: `🟦 첫 번째 삼각형 (기준 도형)`, desc: `대응하는 꼭짓점 순서대로 기호 작성 필수!`, val: `기준 삼각형`, color: GCOL.cyan, ok: true },
            { id: 1, name: `🩷 두 번째 합동 삼각형 (이동·회전 포개기)`, desc: cur.rule, val: `완벽 합동(≡) ⭕`, color: GCOL.pink, ok: true }
          ],
          totalRes: cur.rule,
          rule: '그림에서 찾아야 하는 숨은 조건 세 가지: ① 공통변(S)  ② 맞꼭지각(A)  ③ 평행선의 엇각·동위각(A)!',
          formulaHTML: `• <strong>합동 기호 작성 규칙</strong>: $\\triangle ABC \\equiv \\triangle DEF$를 쓸 때는 반드시 <strong>대응하는 꼭짓점 순서</strong>를 맞춰 써야 합니다!`,
          notes: `• 문제에 안 적혀 있어도 그림에서 스스로 찾아야 하는 조건: <strong>① 겹친 선분 = 공통변, ② X자 교차 = 맞꼭지각, ③ 화살표(≫) = 평행선 엇각</strong>!`
        };
      }

      // ==================== [탭 4: 각의 이등분선 & 수직이등분선] ====================
      if (m === 4) {
        if (sub === 'perpBisect') {
          return {
            badge: `탐구 4-C · 선분 AB의 수직이등분선 성질 — 그 위의 점 P에서 양 끝점까지 PA = PB!`,
            hint: `선분 $AB$의 중점 $M(AM=BM)$에서 수직($\\perp$)으로 세운 직선 위의 점 $P$는, 슬라이더로 높이를 아무리 위아래로 바꿔도 <strong class="text-amber-300">△PAM ≡ △PBM (SAS 합동)에 의해 항상 PA = PB</strong>입니다!`,
            actionTxt: state.fold > 0.5 ? '🎬 점 P 아래로 이동' : '🎬 수직이등분선 따라 점 P 이동 실험!',
            parts: [
              { id: 0, name: `🟨 작도 조건: AM = BM (중점) & PM ⊥ AB (수직)`, desc: `PM은 두 직각삼각형의 공통변!`, val: `SAS 합동 조건`, color: GCOL.gold, ok: true },
              { id: 1, name: `🟦 결론: 양 끝점까지의 거리 일치 (PA = PB)`, desc: `선분의 수직이등분선 위의 점은 양 끝점까지의 거리가 같으므로, 세 변의 수직이등분선이 만나는 외심 O에서 OA = OB = OC가 성립합니다!`, val: `PA = PB ⭕`, color: GCOL.cyan, ok: true }
            ],
            totalRes: `AM = BM, PM ⊥ AB, PM 공통 ➔ △PAM ≡ △PBM (SAS 합동) ➔ PA = PB`,
            rule: '선분의 수직이등분선 = 두 끝점 A, B에서 같은 거리에 있는 점들의 모임 (외심의 성질의 바탕)!',
            formulaHTML: `• <strong>정방향($\\text{수직이등분선} \\implies PA=PB$)</strong>: $\\triangle PAM \\equiv \\triangle PBM$ (<strong>SAS 합동</strong>)<br/>• <strong>역방향($PA=PB \\implies \\text{수직이등분선}$)</strong>: $\\triangle PAM \\equiv \\triangle PBM$ (<strong>RHS 합동</strong>)`,
            notes: `• 외심(탭 5)이 왜 세 꼭짓점까지의 거리가 같은지 이해하는 가장 중요한 기본 정리입니다!`
          };
        }
        if (sub === 'triAreaRatio') {
          return {
            badge: `탐구 4-D · 삼각형 꼭지각 이등분선과 넓이비 (△ABD : △ACD = AB : AC)`,
            hint: `꼭지각 $\\angle A$의 이등분선이 밑변 $BC$와 만나는 점 $D$에서 두 변 $AB, AC$에 내린 수선의 길이는 <strong class="text-pink-300">DE = DF = h로 똑같습니다!</strong> 따라서 두 삼각형의 넓이비는 곧 <strong class="text-amber-300">밑변 역할을 하는 AB : AC의 길이비</strong>와 같습니다!`,
            actionTxt: state.fold > 0.5 ? '🎬 기본 보기' : '🎬 같은 높이 DE = DF 강조!',
            parts: [
              { id: 0, name: `🩷 각이등분선 위 점 D에서 내린 두 수선: DE = DF`, desc: `△ADE ≡ △ADF (RHA 합동)이므로 높이가 DE=DF로 같음!`, val: `높이 DE = DF`, color: GCOL.pink, ok: true },
              { id: 1, name: `🟦 왼쪽 삼각형 넓이: △ABD = ½ × AB × DE`, desc: `AB를 밑변, DE를 높이로 계산`, val: `비율 = AB`, color: GCOL.cyan, ok: true },
              { id: 2, name: `🟩 오른쪽 삼각형 넓이: △ACD = ½ × AC × DF`, desc: `높이가 같으므로 넓이비는 곧 AB : AC!`, val: `비율 = AC`, color: GCOL.green, ok: true }
            ],
            totalRes: `DE = DF 이므로 넓이비 △ABD : △ACD = AB : AC (= BD : CD)!`,
            rule: '각이등분선 교점 D는 두 변 AB, AC까지의 수직거리(높이 DE=DF)가 같으므로 넓이비 = AB : AC!',
            formulaHTML: `• ${tex(`\\triangle ABD : \\triangle ACD = \\left(\\dfrac{1}{2}\\cdot\\overline{AB}\\cdot\\overline{DE}\\right) : \\left(\\dfrac{1}{2}\\cdot\\overline{AC}\\cdot\\overline{DF}\\right) = \\mathbf{\\overline{AB} : \\overline{AC}}`)}`,
            notes: `• 또한 꼭짓점 $A$에서 본 높이가 같으므로 $\\triangle ABD : \\triangle ACD = BD : CD$가 되므로 <strong>$AB : AC = BD : CD$</strong>입니다. 즉 삼각형의 내각의 이등분선은 대변을 나머지 두 변의 길이의 비 $AB : AC$로 나눕니다!`
          };
        }
        const isConv = sub === 'angleBisectConv';
        const isCounter = sub === 'slantedCounter';
        return {
          badge: isCounter
            ? `탐구 4-E · 🚫 [반례] 수직(90°)이 아닌 비스듬한 선분 PQ는 PE(=PF)보다 항상 길다!`
            : `탐구 4 · 각의 이등분선의 성질 — ${isConv ? '역정리 (PE = PF ⟹ 각이등분선, RHS 합동)' : '정리 (각이등분선 ⟹ PE = PF, RHA 합동)'}`,
          hint: isCounter
            ? `점 $P$에서 변 $AB$에 $90^\\circ$ 수직으로 내린 수선의 발 $E$만이 최단거리($PE=PF$)입니다! 직각 기호가 없는 비스듬한 선분 $PQ$는 빗변이므로 <strong class="text-rose-400">PQ > PE = PF</strong>입니다!`
            : `각 $\\angle BAC$의 이등분선 위의 점 $P$에서 두 변에 내린 수선의 발을 $E, F$라 하면, <strong class="text-amber-300">△APE ≡ △APF (${isConv ? 'RHS' : 'RHA'} 합동)에 의해 항상 PE = PF이고 AE = AF</strong>입니다!`,
          actionTxt: state.fold > 0.5 ? '🎬 점 P 원위치' : '🎬 각이등분선 따라 점 P 이동 실험!',
          parts: [
            { id: 0, name: `🟦 위쪽 직각삼각형 △APE (∠AEP = 90°)`, desc: `빗변 AP 공통`, val: `AE = AF`, color: GCOL.cyan, ok: true },
            { id: 1, name: `🩷 아래쪽 직각삼각형 △APF (∠AFP = 90°)`, desc: isConv ? `PE = PF 로부터 RHS 합동!` : `∠PAE = ∠PAF 로부터 RHA 합동!`, val: `PE = PF ⭕`, color: GCOL.pink, ok: true }
          ],
          totalRes: `△APE ≡ △APF (${isConv ? 'RHS' : 'RHA'} 합동)  ➔  수직거리 PE = PF, AE = AF`,
          rule: '서술형 주의: (각이등분 ⟹ PE=PF)는 RHA 합동, (PE=PF ⟹ 각이등분)은 RHS 합동으로 증명한다!',
          formulaHTML: `• <strong>각의 이등분선</strong> = 두 변 $AB, AC$로부터 같은 수직거리에 있는 점들의 모임 (<strong>내심 $I$의 성질의 바탕!</strong>)`,
          notes: `• 각의 이등분선 위의 점에서 그 각의 두 변까지의 수직거리가 같으므로, 삼각형 세 내각의 이등분선이 만나는 <strong>내심 $I$에서 세 변까지의 수직거리($ID=IE=IF=r$)</strong>가 모두 같아집니다!`
        };
      }

      // ==================== [탭 5: 외심 O & 세 변의 수직이등분선] ====================
      if (m === 5) {
        const Rcm = circum ? (circum.R / 10).toFixed(1) : '0';
        const boc = degA <= 90 ? 2 * degA : 360 - 2 * degA;
        if (sub === 'circumRight' || sub === 'circum3060') {
          return {
            badge: `탐구 5 · 👑 직각삼각형의 외심 O는 『빗변의 중점』이다!`,
            hint: `∠B = 90°인 직각삼각형에서 세 변의 수직이등분선을 그으면 놀랍게도 <strong class="text-amber-300">빗변 AC의 중점 E에서 정확히 만납니다(O = E)!</strong> 따라서 <strong class="text-sky-300">외접원 반지름 R = OA = OB = OC = ½ × (빗변 AC)</strong>입니다!`,
            actionTxt: state.fold > 0.5 ? '🎬 기본 보기' : '🎬 OA = OB = OC = ½AC 반지름 강조!',
            parts: [
              { id: 0, name: `🟨 외심 O의 위치 = 빗변 AC의 중점 E (O = E!)`, desc: `외심이 삼각형 안에 있는 예각삼각형과 밖에 있는 둔각삼각형의 경계인 빗변 한가운데!`, val: `O = 빗변 중점`, color: GCOL.gold, ok: true },
              { id: 1, name: `🟦 세 꼭짓점까지 같은 반지름: OA = OB = OC = R`, desc: `직각 꼭짓점 B에서 빗변 중점 O를 이은 중선 BO도 반지름 R!`, val: `R = ½AC = ${Rcm}cm`, color: GCOL.cyan, ok: true },
              { id: 2, name: sub === 'circum3060' ? `🩷 30°-60°-90° 직각삼각형: △OBC는 정삼각형!` : `🩷 두 이등변삼각형으로 분할: △OAB & △OBC`, desc: sub === 'circum3060' ? `OB = OC = R 이고 ∠C = 60° 이므로 △OBC는 정삼각형!` : `OA=OB 이므로 ∠OAB=∠OBA, OB=OC 이므로 ∠OBC=∠OCB!`, val: sub === 'circum3060' ? `△OBC 정삼각형` : `이등변삼각형 2개`, color: GCOL.pink, ok: true }
            ],
            totalRes: `직각삼각형 외심 O = 빗변의 중점  ➔  OA = OB = OC = R = ½ × (빗변) = ${Rcm} cm`,
            rule: '직각삼각형의 빗변의 중점 M은 문제에 외심이라고 적혀 있지 않아도 외심이다 (MA = MB = MC)!',
            formulaHTML: `• ${tex(`\\angle B = 90^\\circ \\implies \\text{외심 } O = \\text{빗변 } AC\\text{의 중점}, \\quad R = \\overline{OA} = \\overline{OB} = \\overline{OC} = \\dfrac{1}{2}\\overline{AC}`)}`,
            notes: `• <strong>[계산 예]</strong>: 직각삼각형의 빗변 길이가 $10\\text{ cm}$일 때 외접원의 반지름 $R$은? 피타고라스 정리를 쓰지 않고도 $10 \\div 2 = \\mathbf{5\\text{ cm}}$입니다!`
          };
        }
        return {
          badge: `탐구 5 · 삼각형의 외심 O — 세 변의 수직이등분선의 교점 (OA = OB = OC = R)`,
          hint: `꼭짓점 $A$를 위아래로 드래그하거나 [꼭지각 ∠A 바로 맞추기] 버튼을 눌러 보세요! <strong class="text-sky-300">예각이면 내부</strong>, <strong class="text-amber-300">직각이면 빗변의 중점</strong>, <strong class="text-rose-400">둔각이면 외부</strong>로 외심 $O$가 이동하지만 언제나 <strong class="text-emerald-300">OA = OB = OC = R(${Rcm}cm)</strong>입니다!`,
          actionTxt: state.fold > 0.5 ? '🎬 전체 구조 보기' : '🎬 합동 삼각형 쌍 & ∠BOC(=2∠A) 강조!',
          parts: [
            { id: 0, name: `🟦 합동 쌍 ①: △OAF ≡ △OBF (변 AB 수직이등분)`, desc: `AF = BF (중점 F), OF ⊥ AB ➔ OA = OB (SAS/RHS)`, val: `OA = OB = ${Rcm}`, color: GCOL.cyan, ok: true },
            { id: 1, name: `🟩 합동 쌍 ②: △OBD ≡ △OCD (변 BC 수직이등분)`, desc: `BD = CD (중점 D), OD ⊥ BC ➔ OB = OC`, val: `OB = OC = ${Rcm}`, color: GCOL.green, ok: true },
            { id: 2, name: `🩷 합동 쌍 ③: △OCE ≡ △OAE & ∠BOC = 2∠A`, desc: degA <= 90 ? `∠A=${degA}° ➔ 중심각 ∠BOC = 2×${degA}° = ${2*degA}°!` : `둔각 ∠A=${degA}° ➔ 180°보다 큰 각은 ${2*degA}°, 안쪽 ∠BOC=${boc}°!`, val: `∠BOC = ${boc}°`, color: GCOL.pink, ok: true }
          ],
          totalRes: `OA = OB = OC = R(${Rcm}cm) | ∠x+∠y+∠z = 90° | ∠A=${degA}° ➔ ∠BOC = ${boc}°`,
          rule: '외심 O의 세 가지 성질: ① 세 변의 수직이등분선 교점(중점 D·E·F)  ② OA=OB=OC=R  ③ ∠BOC = 2∠A',
          formulaHTML: `• <strong>이등변 밑각 합</strong>: $\\triangle OAB, \\triangle OBC, \\triangle OCA$가 이등변이므로 ${tex(`2x+2y+2z=180^\\circ \\implies \\mathbf{\\angle x + \\angle y + \\angle z = 90^\\circ}`)}<br/>• <strong>외심 중심각</strong>: $AO$ 연장선의 외각 성질에 의해 ${tex(`\\mathbf{\\angle BOC = 2x + 2z = 2\\angle A}`)}!`,
          notes: `• <strong>[둔각삼각형 ∠BOC 함정]</strong>: $\\angle A = 110^\\circ$(둔각)일 때 $\\angle BOC$를 물으면 $2 \\times 110^\\circ = 220^\\circ$는 180°보다 큰 바깥쪽 각이므로, 답은 $360^\\circ - 220^\\circ = \\mathbf{140^\\circ}$입니다!`
        };
      }

      // ==================== [탭 6: 내심 I & 넓이 3분할 · 접선 · 평행선] ====================
      if (m === 6) {
        const rCm = inc ? (inc.r / 10).toFixed(1) : '0';
        const bic = Math.round(90 + ang.degA / 2);
        if (sub === 'incenterParallel') {
          return {
            badge: `탐구 6-F · 🔥 내심 I를 지나고 밑변 BC에 평행한 직선 DE — 『△ADE 둘레 = AB + AC!』`,
            hint: `내심 $I$를 지나고 $BC$에 평행한 선분 $DE$를 그으면, <strong class="text-amber-300">각이등분선 + 평행선 엇각</strong>에 의해 양쪽에 이등변삼각형 2개(<strong class="text-sky-300">DB = DI</strong>, <strong class="text-pink-300">EC = EI</strong>)가 생깁니다! 슬라이더로 $DI$와 $EI$를 양옆으로 펴보세요!`,
            actionTxt: state.fold > 0.5 ? '🎬 접어서 △ADE로 만들기' : '🎬 DI ➔ DB, EI ➔ EC로 펴서 AB+AC 확인!',
            parts: [
              { id: 0, name: `🟦 왼쪽 이등변삼각형 △DBI (DI = DB)`, desc: `∠DBI = ∠IBC(내심) = ∠DIB(엇각) ➔ DI = DB!`, val: `AD+DI = AB`, color: GCOL.cyan, ok: true },
              { id: 1, name: `🩷 오른쪽 이등변삼각형 △ECI (EI = EC)`, desc: `∠ECI = ∠ICB(내심) = ∠EIC(엇각) ➔ EI = EC!`, val: `AE+EI = AC`, color: GCOL.pink, ok: true },
              { id: 2, name: `🟨 결론: △ADE의 둘레 = AB + AC (${(parseFloat(cCm)+parseFloat(bCm)).toFixed(1)} cm)`, desc: `(AD + DI) + (AE + EI) = (AD + DB) + (AE + EC) = AB + AC!`, val: `둘레 = AB+AC`, color: GCOL.gold, ok: true }
            ],
            totalRes: `△ADE의 둘레 = AD + DE + AE = (AD+DB) + (AE+EC) = AB + AC! (밑변 BC는 안 씀!)`,
            rule: '내심 I를 지나는 평행선 DE 문제: 위쪽 작은 △ADE의 둘레 = 왼쪽 변 AB + 오른쪽 변 AC!',
            formulaHTML: `• ${tex(`(\\triangle ADE\\text{ 둘레}) = \\overline{AD} + (\\overline{DI}+\\overline{IE}) + \\overline{AE} = (\\overline{AD}+\\overline{DB}) + (\\overline{AE}+\\overline{EC}) = \\mathbf{\\overline{AB} + \\overline{AC}}`)}`,
            notes: `• 문제에서 밑변 $BC$의 길이를 함정으로 함께 알려주더라도 절대 더하지 마세요! <strong>위쪽 $\\triangle ADE$ 둘레는 오직 $AB + AC$의 합</strong>입니다.`
          };

        notes: `• 삼각형 각도 추론 문제는 $180^\\circ$에서 빼는 대신 <strong>“(삼각형의 한 외각) = (이웃하지 않는 두 내각의 합)”</strong>을 연속으로 쓰면 간단히 풀리는 경우가 많습니다!`
      };
    }

  /* ===== 원본 그대로: 장면별 그리기 (원본 1378–2446행) =====
     [2.0 수정] 연꼴 접기(kiteFold) 한 곳만 아래에서 고침 — 주석 참조. 나머지는 글자 그대로입니다. */
    // =========================================================================
    // [탭 1 렌더링] 이등변삼각형 & 4대 보조선 (D·M·H 분리 반례 포함)
    // =========================================================================
    function renderMode1Iso(rect, A, B, C, ang, G) {
      const sub = state.subType[1];
      const bisect = getAngleBisectorAxis(A, B, C);
      const D = bisect.D;
      const M = midPt(B, C);
      const H = projectOnLine(A, B, C);
      const isIso = Math.abs(ang.b - ang.c) < 2.5;
      const layer = state.conceptSwitch;

      drawTriangleFilled(A, B, C, 'rgba(56, 189, 248, 0.08)');
      drawLine(A, B, GCOL.cyan, 3.4, false, layer === 'def', 0);
      drawLine(A, C, isIso ? GCOL.cyan : GCOL.pink, 3.4, false, layer === 'def', 0);
      drawLine(B, C, GCOL.white, 3.0);

      if (isIso) {
        edgeTicks(A, B, 2, GCOL.gold, 8);
        edgeTicks(A, C, 2, GCOL.gold, 8);
      }

      if (layer !== 'def') {
        curvedAngle(B, A, C, GCOL.pink, 28, 1, `${Math.round(ang.degB)}°`);
        curvedAngle(C, B, A, isIso ? GCOL.pink : GCOL.cyan, 28, isIso ? 1 : 2, `${Math.round(ang.degC)}°`);
      }

      // [표시 보강] 이등분된 두 각은 같은 반지름·같은 ●, 꼭지각 ∠A 전체의 값은 바깥 호 안에(직각이면 직각 표시)
      curvedAngle(A, B, D, GCOL.gold, 32, 1, '●');
      curvedAngle(A, D, C, GCOL.gold, 32, 1, '●');
      if (Math.abs(ang.degA - 90) < 1.5) drawRightAngleSign(A, B, C, 44, GCOL.white);
      else curvedAngle(A, B, C, GCOL.white, 62, 1, `${Math.round(ang.degA)}°`, false, ang.degA > 44 ? 0.2 : 0);
      drawLine(A, D, GCOL.gold, 2.8, true, true, isIso ? 2 : 0);

      if (isIso) {
        drawRightAngleSign(D, A, C, 13, GCOL.gold);
        edgeTicks(B, D, 1, GCOL.green, 7.5);
        edgeTicks(D, C, 1, GCOL.green, 7.5);
        if (sub === 'isoRight') edgeTicks(A, D, 1, GCOL.green, 7.5); // [표시 보강] AD = BD = CD
        drawPoint(D, 5.5, GCOL.gold, 'D(중점·수선의 발)', null, A);

        if (sub === 'isoPointP') {
          const P = lerp(A, D, 0.52);
          drawTriangleFilled(P, B, D, 'rgba(52, 211, 153, 0.22)', 2);
          drawTriangleFilled(P, C, D, 'rgba(244, 114, 182, 0.22)', 2);
          drawLine(P, B, GCOL.green, 3.2, false, true, 2);
          drawLine(P, C, GCOL.pink, 3.2, false, true, 2);
          edgeTicks(P, B, 3, GCOL.gold, 7);
          edgeTicks(P, C, 3, GCOL.gold, 7);
          drawPoint(P, 6.5, GCOL.gold, 'P(PB = PC!)', { x: 12, y: -6 });
        }
      } else {
        drawPoint(D, 5.5, GCOL.gold, 'D(각이등분)', { x: -18, y: 22 });
        drawLine(A, M, GCOL.green, 2.4, true, false, 1);
        edgeTicks(B, M, 1, GCOL.green, 7);
        edgeTicks(M, C, 1, GCOL.green, 7);
        drawPoint(M, 5.5, GCOL.green, 'M(중점)', { x: -15, y: -14 });

        drawLine(C, H, GCOL.red, 1.8, true, false, 2);
        drawLine(A, H, GCOL.red, 2.6, true, false, 2);
        drawRightAngleSign(H, A, B, 12, GCOL.red);
        drawPoint(H, 5.5, GCOL.red, 'H(수선의 발)', { x: 8, y: 22 });
      }

      if (state.fold > 0.01) {
        const C_ref = reflectAcrossLine(C, bisect.p1, bisect.p2);
        const curC = lerp(C, C_ref, state.fold);
        drawTriangleFilled(A, D, curC, 'rgba(244, 114, 182, 0.24)');
        drawLine(A, curC, GCOL.pink, 3.0, true);
        drawLine(D, curC, GCOL.pink, 3.0, true);
        drawPoint(curC, 6, GCOL.pink, "C'(접힌 점)");

        const errDist = dist(B, C_ref);
        if (errDist > 5 && state.fold > 0.75) {
          drawLine(B, C_ref, GCOL.red, 3.5, false, true);
        }
      }

      drawPoint(A, 7.2, GCOL.gold, `A(${Math.round(ang.degA)}°)`, null, G);
      drawPoint(B, 7.2, GCOL.cyan, 'B', null, G);
      drawPoint(C, 7.2, GCOL.pink, 'C', null, G);

      const dA = Math.round(ang.degA), dB = Math.round(ang.degB), dC = 180 - dA - dB;
      drawBottomTapeBanner(
        rect,
        isIso
          ? `이등변 내각 합 180° = 꼭지각 ∠A(${dA}°) + 밑각 ∠B(${dB}°) + 밑각 ∠C(${dC}°)  |  AD ⊥ BC, BD = CD`
          : `⚠️ 일반삼각형(AB ≠ AC) 반례: 각이등분선 교점 D ≠ 변의 중점 M ≠ 수선의 발 H`,
        [
          { text: `∠A (${dA}°)`, weight: dA / 180, color: GCOL.gold },
          { text: `밑각 ∠B (${dB}°)`, weight: dB / 180, color: GCOL.cyan },
          { text: `밑각 ∠C (${dC}°)`, weight: dC / 180, color: GCOL.pink }
        ]
      );
    }

    // =========================================================================
    // [탭 2 렌더링] 직각삼각형 합동 RHA / RHS & 빗변
    // =========================================================================
    function renderMode2RightCong(rect, A, B, C, ang) {
      const sub = state.subType[2];
      const t = state.fold;

      if (sub === 'ssaCounter') {
        const pA = { x: -175, y: 75 }, pB = { x: 115, y: 75 };
        const theta = 34 * (Math.PI / 180), n = { x: Math.cos(theta), y: -Math.sin(theta) };
        const len = dist(pA, pB), r = 195;
        const foot = len * Math.cos(theta), delta = Math.sqrt(r * r - len * len * Math.sin(theta) ** 2);
        const C1 = addPt(pA, multiply(n, foot - delta));
        const C2 = addPt(pA, multiply(n, foot + delta));

        drawTriangleFilled(pA, pB, C1, 'rgba(56, 189, 248, 0.16)', 0);
        drawLine(pA, pB, GCOL.white, 3.2); drawLine(pB, C1, GCOL.cyan, 3.2, false, false, 0); drawLine(C1, pA, GCOL.gold, 3.2);
        drawTriangleFilled(pA, pB, C2, 'rgba(244, 114, 182, 0.16)', 1);
        drawLine(pB, C2, GCOL.pink, 3.2, false, false, 1); drawLine(C2, pA, GCOL.gold, 3.2);

        drawCircle(pB, r, GCOL.gold, null, 1.6, true);
        drawLine(pA, addPt(pA, multiply(n, 395)), GCOL.white, 1.6, true);

        // [표시 보강] 각 값(34°)은 호 안에, '(끼인각 아님)'은 밑변 아래 따로 — 한 줄로 붙이면 긴 글자가 변 AC 와 겹쳤음
        curvedAngle(pA, pB, C2, GCOL.gold, 42, 1, '34°');
        labelLine({ x: pA.x + 95, y: pA.y + 26 }, '∠A = 34° (끼인각 아님)', GCOL.gold, 12);
        edgeTicks(pB, C1, 2, GCOL.cyan, 8);
        edgeTicks(pB, C2, 2, GCOL.pink, 8);

        drawPoint(pA, 7, GCOL.gold, 'A', { x: -18, y: 18 });
        drawPoint(pB, 7, GCOL.white, 'B', { x: 10, y: 18 });
        drawPoint(C1, 6.5, GCOL.cyan, 'C₁(둔각삼각형)', { x: -75, y: -12 });
        drawPoint(C2, 6.5, GCOL.pink, 'C₂(예각삼각형)', { x: 12, y: -8 });
        drawBottomTapeBanner(rect, '🚫 일반 SSA 반례: 끼인각이 아닌 ∠A와 두 변(AB, BC)만 같으면 △ABC₁과 △ABC₂ 두 개가 생깁니다!');
        return;
      }

      if (sub === 'trapezoidRHA') {
        const B_pt = { x: -165, y: 82 }, C_pt = { x: -15, y: 82 }, D_pt = { x: 97, y: 82 };
        const A_pt = { x: -165, y: -30 }, E_pt = { x: 97, y: -68 };

        drawQuadFilled(A_pt, B_pt, D_pt, E_pt, 'rgba(255, 255, 255, 0.03)');
        drawTriangleFilled(A_pt, B_pt, C_pt, 'rgba(56, 189, 248, 0.22)', 0);
        drawTriangleFilled(C_pt, D_pt, E_pt, 'rgba(52, 211, 153, 0.22)', 1);

        drawLine(A_pt, E_pt, 'rgba(255,255,255,0.35)', 1.8, true);
        drawLine(A_pt, B_pt, GCOL.cyan, 3.4, false, false, 2);
        drawLine(B_pt, C_pt, GCOL.green, 3.4, false, false, 2);
        drawLine(C_pt, D_pt, GCOL.cyan, 3.4, false, false, 2);
        drawLine(D_pt, E_pt, GCOL.green, 3.4, false, false, 2);
        drawLine(A_pt, C_pt, GCOL.gold, 3.8, false, true, 0);
        drawLine(C_pt, E_pt, GCOL.gold, 3.8, false, true, 0);

        drawRightAngleSign(B_pt, A_pt, C_pt, 13, GCOL.cyan);
        drawRightAngleSign(D_pt, E_pt, C_pt, 13, GCOL.green);
        drawRightAngleSign(C_pt, A_pt, E_pt, 14, GCOL.gold);

        edgeTicks(A_pt, C_pt, 2, GCOL.gold, 8);
        edgeTicks(C_pt, E_pt, 2, GCOL.gold, 8);

        curvedAngle(A_pt, B_pt, C_pt, GCOL.pink, 26, 1, '×');
        curvedAngle(C_pt, A_pt, B_pt, GCOL.cyan, 28, 1, '●');
        curvedAngle(C_pt, D_pt, E_pt, GCOL.pink, 28, 1, '×');
        curvedAngle(E_pt, C_pt, D_pt, GCOL.cyan, 26, 1, '●');
        edgeTicks(A_pt, B_pt, 1, GCOL.cyan, 7); edgeTicks(C_pt, D_pt, 1, GCOL.cyan, 7);
        edgeTicks(B_pt, C_pt, 3, GCOL.green, 7); edgeTicks(D_pt, E_pt, 3, GCOL.green, 7);

        if (t > 0.01) {
          const rA = lerp(C_pt, A_pt, t), rB = lerp(D_pt, B_pt, t), rC = lerp(E_pt, C_pt, t);
          drawTriangleFilled(rA, rB, rC, 'rgba(251, 191, 36, 0.28)');
          drawLine(rA, rB, GCOL.gold, 2.8, true);
          drawLine(rB, rC, GCOL.gold, 2.8, true);
          drawLine(rC, rA, GCOL.gold, 2.8, true);
        }

        drawPoint(A_pt, 6.5, GCOL.gold, 'A', { x: -18, y: -8 });
        drawPoint(B_pt, 6.5, GCOL.cyan, 'B(90°)', { x: -22, y: 20 });
        drawPoint(C_pt, 6.5, GCOL.gold, 'C(90°)', { x: -10, y: 22 });
        drawPoint(D_pt, 6.5, GCOL.green, 'D(90°)', { x: 0, y: 20 });
        drawPoint(E_pt, 6.5, GCOL.gold, 'E', { x: 10, y: -8 });

        drawBottomTapeBanner(rect, '● + × = 90° 이므로 △ABC ≡ △CDE (RHA 합동) ➔ 밑변 BD = BC(16) + CD(12) = DE + AB = 28', [
          { text: 'BC = DE (16)', weight: 16 / 28, color: GCOL.green },
          { text: 'CD = AB (12)', weight: 12 / 28, color: GCOL.cyan }
        ]);
        return;
      }

      if (sub === 'lineThruA') {
        const A_pt = { x: 0, y: -32 }, B_pt = { x: -135, y: 58 }, C_pt = { x: 90, y: 103 };
        const L1 = { x: -205, y: -62 }, L2 = { x: 205, y: -2 };
        const D_pt = projectOnLine(B_pt, L1, L2);
        const E_pt = projectOnLine(C_pt, L1, L2);

        drawLine(L1, L2, 'rgba(255,255,255,0.6)', 2.2, true);
        drawTriangleFilled(A_pt, B_pt, D_pt, 'rgba(56, 189, 248, 0.24)', 0);
        drawTriangleFilled(C_pt, A_pt, E_pt, 'rgba(52, 211, 153, 0.24)', 1);

        drawLine(B_pt, C_pt, 'rgba(255,255,255,0.35)', 1.8, true);
        drawLine(B_pt, D_pt, GCOL.cyan, 3.2);
        drawLine(A_pt, D_pt, GCOL.green, 3.2);
        drawLine(C_pt, E_pt, GCOL.green, 3.2);
        drawLine(A_pt, E_pt, GCOL.cyan, 3.2);
        drawLine(A_pt, B_pt, GCOL.gold, 3.8, false, true);
        drawLine(A_pt, C_pt, GCOL.gold, 3.8, false, true);

        drawRightAngleSign(A_pt, B_pt, C_pt, 13, GCOL.gold);
        drawRightAngleSign(D_pt, B_pt, A_pt, 12, GCOL.cyan);
        drawRightAngleSign(E_pt, C_pt, A_pt, 12, GCOL.green);

        edgeTicks(A_pt, B_pt, 2, GCOL.gold, 8);
        edgeTicks(A_pt, C_pt, 2, GCOL.gold, 8);
        // [표시 보강] 합동 대응변: BD = AE (|), AD = CE (|||)
        edgeTicks(B_pt, D_pt, 1, GCOL.cyan, 7); edgeTicks(A_pt, E_pt, 1, GCOL.cyan, 7);
        edgeTicks(A_pt, D_pt, 3, GCOL.green, 7); edgeTicks(C_pt, E_pt, 3, GCOL.green, 7);
        curvedAngle(A_pt, D_pt, B_pt, GCOL.cyan, 26, 1, '●');
        curvedAngle(B_pt, A_pt, D_pt, GCOL.pink, 26, 1, '×');
        curvedAngle(A_pt, C_pt, E_pt, GCOL.pink, 26, 1, '×');
        curvedAngle(C_pt, E_pt, A_pt, GCOL.cyan, 26, 1, '●');

        drawPoint(A_pt, 7, GCOL.gold, 'A(90°)', { x: -12, y: -14 });
        drawPoint(B_pt, 6.5, GCOL.cyan, 'B', { x: -20, y: 16 });
        drawPoint(C_pt, 6.5, GCOL.pink, 'C', { x: 10, y: 16 });
        drawPoint(D_pt, 6, GCOL.cyan, 'D(수선의 발)', { x: -35, y: -12 });
        drawPoint(E_pt, 6, GCOL.green, 'E(수선의 발)', { x: 8, y: -12 });
        drawBottomTapeBanner(rect, '직각이등변 꼭짓점 A를 지나는 직선: △ABD ≡ △CAE (RHA 합동) ➔ DE = DA + AE = CE + BD');
        return;
      }

      if (sub === 'kiteFold') {
        const rA = { x: -125, y: -85 }, rB = { x: -125, y: 90 }, rC = { x: 125, y: 90 };
        drawTriangleFilled(rA, rB, rC, 'rgba(56, 189, 248, 0.16)', 0);
        drawLine(rA, rB, GCOL.cyan, 3.2);
        drawLine(rB, rC, GCOL.green, 3.2);
        drawLine(rA, rC, GCOL.gold, 4.0, false, true, 0);
        drawRightAngleSign(rB, rA, rC, 14, GCOL.gold);

        // [2.0 수정] 원본: const progK = t > 0.01 ? t : 1.0;  → 0%에서도 접힌 완성 그림이라 0%와 100%가 같고,
        // 슬라이더를 조금만 움직이면 갑자기 펼쳐졌습니다. 0% = 접기 전, 100% = 완성으로 맞추고 장면은 100%에서 시작합니다.
        const progK = t;
        const B_ref = reflectAcrossLine(rB, rA, rC);
        const curD = lerp(rB, B_ref, progK);
        drawTriangleFilled(rA, curD, rC, 'rgba(244, 114, 182, 0.18)', 1);
        drawLine(rA, curD, GCOL.cyan, 2.8, true);
        drawLine(rC, curD, GCOL.green, 2.8, true);
        if (progK > 0.85) {
          drawRightAngleSign(curD, rA, rC, 14, GCOL.pink);
          edgeTicks(rA, rB, 1, GCOL.cyan, 7.5); edgeTicks(rA, curD, 1, GCOL.cyan, 7.5);
          edgeTicks(rB, rC, 2, GCOL.green, 7.5); edgeTicks(curD, rC, 2, GCOL.green, 7.5);
          // [표시 보강] 포개지는 대응각: ∠BAC = ∠DAC(●), ∠BCA = ∠DCA(×)
          curvedAngle(rA, rB, rC, GCOL.cyan, 30, 1, '●'); curvedAngle(rA, rC, curD, GCOL.cyan, 30, 1, '●');
          curvedAngle(rC, rB, rA, GCOL.pink, 30, 1, '×'); curvedAngle(rC, rA, curD, GCOL.pink, 30, 1, '×');
        }
        drawPoint(rA, 7, GCOL.gold, 'A', { x: -18, y: -8 });
        drawPoint(rB, 7, GCOL.cyan, 'B(90°)', { x: -25, y: 18 });
        drawPoint(rC, 7, GCOL.pink, 'C', { x: 10, y: 18 });
        drawPoint(curD, 6.5, GCOL.pink, 'D(90°)', { x: 12, y: -10 });
        drawBottomTapeBanner(rect, '빗변 AC를 공유하는 두 직각삼각형: ∠B=∠D=90°(R), AC 공통(H), AB=AD(S) ➔ △ABC ≡ △ADC (RHS)');
        return;
      }

      // rhaPair & rhsPair
      const A1 = { x: -190, y: -85 }, B1 = { x: -190, y: 85 }, C1 = { x: -55, y: 85 };
      const shiftX = 235 * (1 - t);
      const A2 = { x: A1.x + shiftX, y: A1.y }, B2 = { x: B1.x + shiftX, y: B1.y }, C2 = { x: C1.x + shiftX, y: C1.y };

      drawTriangleFilled(A1, B1, C1, 'rgba(56, 189, 248, 0.16)', 0);
      drawLine(A1, B1, GCOL.cyan, 3.2); drawLine(B1, C1, GCOL.green, 3.2); drawLine(A1, C1, GCOL.gold, 3.8, false, true, 0);
      drawRightAngleSign(B1, A1, C1, 14, GCOL.gold);

      drawTriangleFilled(A2, B2, C2, 'rgba(244, 114, 182, 0.20)', 1);
      drawLine(A2, B2, GCOL.cyan, 3.2, t > 0.05); drawLine(B2, C2, GCOL.green, 3.2, t > 0.05); drawLine(A2, C2, GCOL.gold, 3.8, t > 0.05, false, 0);
      drawRightAngleSign(B2, A2, C2, 14, GCOL.gold);

      edgeTicks(A1, C1, 2, GCOL.gold, 8);
      edgeTicks(A2, C2, 2, GCOL.gold, 8);

      if (sub === 'rhaPair') {
        curvedAngle(C1, A1, B1, GCOL.pink, 28, 1, '52°');
        curvedAngle(C2, A2, B2, GCOL.pink, 28, 1, '52°');
      } else {
        edgeTicks(A1, B1, 1, GCOL.cyan, 8);
        edgeTicks(A2, B2, 1, GCOL.cyan, 8);
      }

      drawPoint(A1, 6.5, GCOL.gold, 'A', { x: -18, y: -8 });
      drawPoint(B1, 6.5, GCOL.cyan, 'B(90°)', { x: -25, y: 20 });
      drawPoint(C1, 6.5, GCOL.pink, 'C', { x: 8, y: 20 });
      drawPoint(A2, 6.5, GCOL.gold, 'D', { x: 10, y: -8 });
      drawPoint(B2, 6.5, GCOL.cyan, 'E(90°)', { x: 8, y: 20 });
      drawPoint(C2, 6.5, GCOL.pink, 'F', { x: 10, y: 20 });

      drawBottomTapeBanner(rect, sub === 'rhaPair' ? 'RHA 합동: 직각(∠B=∠E=90°) + 빗변(AC=DF) + 한 예각(∠C=∠F) 일치!' : 'RHS 합동: 직각(∠B=∠E=90°) + 빗변(AC=DF) + 다른 한 변(AB=DE) 일치!');
    }

    // =========================================================================
    // [탭 3 렌더링] 일반삼각형 합동 SSS / SAS / ASA
    // =========================================================================
    function renderMode3GeneralCong(rect, A, B, C) {
      const sub = state.subType[3];
      const t = state.fold;

      if (sub === 'sss' || sub === 'sas' || sub === 'asa') {
        const left = [{ x: -195, y: -85 }, { x: -270, y: 85 }, { x: -100, y: 85 }];
        const shiftX = 280 * (1 - t);
        const right = left.map((p) => ({ x: p.x + shiftX, y: p.y }));

        drawTriangleFilled(...left, 'rgba(56, 189, 248, 0.16)', 0);
        drawLine(left[0], left[1], GCOL.cyan, 3.2); drawLine(left[1], left[2], GCOL.green, 3.2); drawLine(left[2], left[0], GCOL.pink, 3.2);

        drawTriangleFilled(...right, 'rgba(244, 114, 182, 0.18)', 1);
        drawLine(right[0], right[1], GCOL.cyan, 3.2); drawLine(right[1], right[2], GCOL.green, 3.2); drawLine(right[2], right[0], GCOL.pink, 3.2);

        left.forEach((p, i) => drawPoint(p, 6, GCOL.cyan, ['A', 'B', 'C'][i], { x: -8, y: i === 0 ? -12 : 20 }));
        right.forEach((p, i) => drawPoint(p, 6, GCOL.pink, ['D', 'E', 'F'][i], { x: 8, y: i === 0 ? -12 : 20 }));

        if (sub === 'sss') {
          for (const v of [left, right]) {
            edgeTicks(v[0], v[1], 1, GCOL.cyan, 7.5);
            edgeTicks(v[1], v[2], 2, GCOL.green, 7.5);
            edgeTicks(v[2], v[0], 3, GCOL.pink, 7.5);
          }
        } else if (sub === 'sas') {
          for (const v of [left, right]) {
            edgeTicks(v[0], v[1], 1, GCOL.cyan, 7.5);
            edgeTicks(v[0], v[2], 2, GCOL.pink, 7.5);
            curvedAngle(v[0], v[1], v[2], GCOL.gold, 28, 1, '끼인각');
          }
        } else {
          for (const v of [left, right]) {
            edgeTicks(v[1], v[2], 1, GCOL.green, 7.5);
            curvedAngle(v[1], v[0], v[2], GCOL.cyan, 26, 1, '●');
            curvedAngle(v[2], v[1], v[0], GCOL.pink, 26, 2, '×');
          }
        }
        drawBottomTapeBanner(rect, `일반삼각형 합동: △ABC ≡ △DEF (${sub.toUpperCase()} 합동) — 슬라이더로 두 삼각형을 포개어 보세요!`);
        return;
      }

      if (sub === 'bowtie') {
        const O = { x: 0, y: 0 }, u = { x: -140, y: -80 }, v = { x: -140, y: 80 };
        const pA = addPt(O, u), pB = addPt(O, v);
        const pC = rotatePtAround(addPt(O, multiply(u, -1)), O, -t * Math.PI);
        const pD = rotatePtAround(addPt(O, multiply(v, -1)), O, -t * Math.PI);

        drawTriangleFilled(O, pA, pB, 'rgba(56, 189, 248, 0.20)', 0);
        drawLine(O, pA, GCOL.cyan, 3.2); drawLine(pA, pB, GCOL.green, 3.2); drawLine(pB, O, GCOL.pink, 3.2);
        drawTriangleFilled(O, pC, pD, 'rgba(244, 114, 182, 0.20)', 1);
        drawLine(O, pC, GCOL.cyan, 3.2); drawLine(pC, pD, GCOL.green, 3.2); drawLine(pD, O, GCOL.pink, 3.2);

        edgeTicks(O, pA, 1, GCOL.cyan, 7.5); edgeTicks(O, pC, 1, GCOL.cyan, 7.5);
        edgeTicks(O, pB, 2, GCOL.pink, 7.5); edgeTicks(O, pD, 2, GCOL.pink, 7.5);
        curvedAngle(O, pA, pB, GCOL.gold, 28, 1, '맞꼭지각');
        curvedAngle(O, pC, pD, GCOL.gold, 28, 1, '맞꼭지각');

        drawPoint(O, 6.5, GCOL.gold, 'O(교점)', { x: 0, y: -16 });
        drawPoint(pA, 6, GCOL.cyan, 'A', { x: -18, y: -8 });
        drawPoint(pB, 6, GCOL.pink, 'B', { x: -18, y: 18 });
        drawPoint(pC, 6, GCOL.cyan, 'C', { x: 10, y: 18 });
        drawPoint(pD, 6, GCOL.pink, 'D', { x: 10, y: -8 });
        drawBottomTapeBanner(rect, '맞꼭지각이 끼인각인 합동: OA = OC, OB = OD, ∠AOB = ∠COD(맞꼭지각) ➔ △OAB ≡ △OCD (SAS)');
        return;
      }

      if (sub === 'parallelZ') {
        const O = { x: 0, y: 0 }, pA = { x: -130, y: -85 }, pB = { x: 130, y: -85 }, pC = { x: 130, y: 85 }, pD = { x: -130, y: 85 };
        drawTriangleFilled(O, pA, pB, 'rgba(56, 189, 248, 0.20)', 0);
        drawLine(O, pA, GCOL.cyan, 3.0); drawLine(pA, pB, GCOL.gold, 3.4); drawLine(pB, O, GCOL.pink, 3.0);
        drawTriangleFilled(O, pC, pD, 'rgba(244, 114, 182, 0.20)', 1);
        drawLine(O, pC, GCOL.cyan, 3.0); drawLine(pC, pD, GCOL.gold, 3.4); drawLine(pD, O, GCOL.pink, 3.0);

        parallelArrows(pA, pB, 2, GCOL.gold);
        parallelArrows(pD, pC, 2, GCOL.gold);
        edgeTicks(pA, pB, 1, GCOL.gold, 8);
        edgeTicks(pC, pD, 1, GCOL.gold, 8);

        curvedAngle(pA, pC, pB, GCOL.cyan, 28, 1, '●(엇각)');
        curvedAngle(pC, pA, pD, GCOL.cyan, 28, 1, '●(엇각)');
        curvedAngle(pB, pA, pD, GCOL.pink, 28, 2, '×(엇각)');
        curvedAngle(pD, pC, pB, GCOL.pink, 28, 2, '×(엇각)');

        drawPoint(O, 6, GCOL.white, 'O', { x: 12, y: 4 });
        drawPoint(pA, 6, GCOL.cyan, 'A', { x: -18, y: -8 });
        drawPoint(pB, 6, GCOL.pink, 'B', { x: 10, y: -8 });
        drawPoint(pC, 6, GCOL.cyan, 'C', { x: 10, y: 18 });
        drawPoint(pD, 6, GCOL.pink, 'D', { x: -18, y: 18 });
        drawBottomTapeBanner(rect, '평행선(AB∥CD) Z자 엇각: ∠OAB=∠OCD(●), ∠OBA=∠ODC(×), AB=CD ➔ △OAB ≡ △OCD (ASA)');
        return;
      }

      // rot60
      const pA = { x: -35, y: -110 }, pB = { x: -150, y: 89.18 }, pC = { x: 80, y: 89.18 };
      const pD = { x: 45, y: 35 }, pE = rotatePtAround(pD, pA, -Math.PI / 3);
      drawLine(pA, pB, GCOL.cyan, 2.4); drawLine(pB, pC, 'rgba(255,255,255,0.35)', 2.0); drawLine(pC, pA, GCOL.cyan, 2.4);
      drawLine(pA, pD, GCOL.pink, 2.4); drawLine(pD, pE, 'rgba(255,255,255,0.35)', 2.0); drawLine(pE, pA, GCOL.pink, 2.4);

      const rotRad = -t * (Math.PI / 3);
      const rB = rotatePtAround(pB, pA, rotRad), rD = rotatePtAround(pD, pA, rotRad);
      drawTriangleFilled(pA, pC, pE, 'rgba(52, 211, 153, 0.24)', 0);
      drawLine(pC, pE, GCOL.green, 3.4);
      drawTriangleFilled(pA, rB, rD, 'rgba(251, 191, 36, 0.26)', 1);
      drawLine(pA, rB, GCOL.gold, 3.2); drawLine(pA, rD, GCOL.gold, 3.2); drawLine(rB, rD, GCOL.gold, 3.4);

      // [표시 보강] 정삼각형 ABC(AB=AC=BC), AD=AE, 60° 두 각, 같은 각 ∠BAD = ∠CAE(●)
      edgeTicks(pA, pB, 1, GCOL.cyan, 7.5); edgeTicks(pA, pC, 1, GCOL.cyan, 7.5); edgeTicks(pB, pC, 1, GCOL.cyan, 7.5);
      edgeTicks(pA, pD, 2, GCOL.pink, 7.5); edgeTicks(pA, pE, 2, GCOL.pink, 7.5);
      curvedAngle(pA, pB, pD, GCOL.cyan, 34, 1, '●');
      curvedAngle(pA, pC, pE, GCOL.cyan, 34, 1, '●');
      curvedAngle(pA, pB, pC, GCOL.white, 58, 1, '60°');
      curvedAngle(pA, pD, pE, GCOL.white, 58, 1, '60°');
      drawPoint(pA, 7, GCOL.gold, 'A(60° 회전축)', { x: -20, y: -12 });
      drawPoint(pB, 6, GCOL.cyan, 'B', { x: -18, y: 16 });
      drawPoint(pC, 6, GCOL.cyan, 'C', { x: 8, y: 18 });
      drawPoint(pD, 6, GCOL.pink, 'D', { x: -8, y: 20 });
      drawPoint(pE, 6, GCOL.pink, 'E', { x: 10, y: -6 });
      drawBottomTapeBanner(rect, '정삼각형을 60° 회전하여 겹치는 합동: AB=AC, AD=AE, ∠BAD = 60°+∠CAD = ∠CAE ➔ △ABD ≡ △ACE (SAS)');
    }

    // =========================================================================
    // [탭 4 렌더링] 각의 이등분선 & 선분의 수직이등분선
    // =========================================================================
    function renderMode4Bisectors(rect, A, B, C, ang) {
      const sub = state.subType[4];

      if (sub === 'perpBisect') {
        const pA = { x: -155, y: 75 }, pB = { x: 155, y: 75 };
        const M = midPt(pA, pB);
        const py = -120 + Math.sin(state.fold * Math.PI * 2) * 50;
        const P = { x: M.x, y: py };

        drawTriangleFilled(P, pA, M, 'rgba(56, 189, 248, 0.18)', 0);
        drawTriangleFilled(P, pB, M, 'rgba(244, 114, 182, 0.18)', 1);

        drawLine(pA, pB, GCOL.white, 3.4);
        drawLine({ x: M.x, y: -185 }, { x: M.x, y: 135 }, GCOL.gold, 2.6, true);
        drawRightAngleSign(M, P, pB, 14, GCOL.gold);
        edgeTicks(pA, M, 1, GCOL.green, 8);
        edgeTicks(M, pB, 1, GCOL.green, 8);

        drawLine(P, pA, GCOL.cyan, 3.4, false, true, 1);
        drawLine(P, pB, GCOL.pink, 3.4, false, true, 1);
        edgeTicks(P, pA, 2, GCOL.gold, 8);
        edgeTicks(P, pB, 2, GCOL.gold, 8);

        drawPoint(pA, 7, GCOL.cyan, 'A', { x: -18, y: 18 });
        drawPoint(pB, 7, GCOL.pink, 'B', { x: 10, y: 18 });
        drawPoint(M, 6, GCOL.gold, 'M(AB중점)', { x: 12, y: 20 });
        drawPoint(P, 7.5, GCOL.gold, 'P(수직이등분선 위)', { x: 14, y: 4 });
        drawBottomTapeBanner(rect, '선분의 수직이등분선: △PAM ≡ △PBM (SAS 합동) ➔ PA = PB (외심 O의 핵심 원리!)');
        return;
      }

      if (sub === 'triAreaRatio') {
        const pA = { x: 25, y: -135 }, pB = { x: -155, y: 90 }, pC = { x: 140, y: 90 };
        const bisect = getAngleBisectorAxis(pA, pB, pC);
        const D = bisect.D;
        const E = projectOnLine(D, pA, pB);
        const F = projectOnLine(D, pA, pC);

        drawTriangleFilled(pA, pB, D, 'rgba(56, 189, 248, 0.22)', 1);
        drawTriangleFilled(pA, pC, D, 'rgba(52, 211, 153, 0.22)', 2);
        drawLine(pA, pB, GCOL.cyan, 3.4); drawLine(pB, pC, GCOL.white, 3.2); drawLine(pC, pA, GCOL.green, 3.4);
        drawLine(pA, D, GCOL.gold, 3.0, true);

        drawLine(D, E, GCOL.pink, 3.2, false, true, 0);
        drawLine(D, F, GCOL.pink, 3.2, false, true, 0);
        drawRightAngleSign(E, D, pA, 11, GCOL.pink);
        drawRightAngleSign(F, D, pA, 11, GCOL.pink);
        edgeTicks(D, E, 1, GCOL.gold, 7);
        edgeTicks(D, F, 1, GCOL.gold, 7);

        curvedAngle(pA, pB, D, GCOL.gold, 30, 1, '●'); // [표시 보강] 같은 각은 같은 반지름
        curvedAngle(pA, D, pC, GCOL.gold, 30, 1, '●');

        drawPoint(pA, 7, GCOL.gold, 'A', { x: 0, y: -14 });
        drawPoint(pB, 6.5, GCOL.cyan, 'B', { x: -18, y: 18 });
        drawPoint(pC, 6.5, GCOL.green, 'C', { x: 10, y: 18 });
        drawPoint(D, 6.5, GCOL.gold, 'D(각이등분 교점)', { x: -20, y: 22 });
        drawPoint(E, 5.5, GCOL.pink, 'E', { x: -20, y: -6 });
        drawPoint(F, 5.5, GCOL.pink, 'F', { x: 10, y: -6 });

        drawBottomTapeBanner(rect, '각이등분선 넓이비: 높이 DE = DF 이므로 △ABD : △ACD = AB : AC (= 밑변비 BD : CD)!', [
          { text: '△ABD 넓이 ∝ AB', weight: 0.56, color: GCOL.cyan },
          { text: '△ACD 넓이 ∝ AC', weight: 0.44, color: GCOL.green }
        ]);
        return;
      }

      // angleBisect, angleBisectConv, slantedCounter
      const pA = { x: -165, y: 80 }, pB = { x: 165, y: 80 }, pC = { x: 80, y: -125 };
      const axis = getAngleBisectorAxis(pA, pB, pC);
      const dirBis = norm(minusPt(axis.p2, pA));
      const distP = 185 + state.fold * 55;
      const P = addPt(pA, multiply(dirBis, distP));
      const E = projectOnLine(P, pA, pB);
      const F = projectOnLine(P, pA, pC);

      drawTriangleFilled(pA, P, E, 'rgba(56, 189, 248, 0.20)', 0);
      drawTriangleFilled(pA, P, F, 'rgba(244, 114, 182, 0.20)', 1);

      drawExtendedLine(pA, pB, 0, 35, GCOL.cyan, 3.4, false);
      drawExtendedLine(pA, pC, 0, 35, GCOL.cyan, 3.4, false);
      drawExtendedLine(pA, P, 0, 50, GCOL.gold, 2.8, true);

      curvedAngle(pA, E, P, GCOL.gold, 36, 1, '●'); // [표시 보강] 같은 각은 같은 반지름
      curvedAngle(pA, P, F, GCOL.gold, 36, 1, '●');

      drawLine(P, E, GCOL.pink, 3.4, false, true);
      drawLine(P, F, GCOL.pink, 3.4, false, true);
      drawRightAngleSign(E, P, pA, 12, GCOL.pink);
      drawRightAngleSign(F, P, pA, 12, GCOL.pink);
      edgeTicks(P, E, 1, GCOL.gold, 7.5);
      edgeTicks(P, F, 1, GCOL.gold, 7.5);
      edgeTicks(pA, E, 2, GCOL.cyan, 7.5);
      edgeTicks(pA, F, 2, GCOL.cyan, 7.5);

      if (sub === 'slantedCounter') {
        const Q = lerp(pA, pB, 0.42);
        drawLine(P, Q, GCOL.red, 3.2, true);
        drawPoint(Q, 5.5, GCOL.red, 'Q(90° 아님!)', { x: -20, y: 22 });
        labelLine(lerp(P, Q, 0.5), '빗변 PQ > 수선 PE', GCOL.red, 12.5);
      }

      drawPoint(pA, 7, GCOL.gold, 'A(꼭짓점)', { x: -25, y: 18 });
      drawPoint(E, 6, GCOL.pink, 'E(수선의 발)', { x: 0, y: 22 });
      drawPoint(F, 6, GCOL.pink, 'F(수선의 발)', { x: -15, y: -14 });
      drawPoint(P, 7, GCOL.gold, 'P(각이등분선 위)', { x: 14, y: 5 });

      drawBottomTapeBanner(rect, '각의 이등분선 성질: △APE ≡ △APF (RHA/RHS 합동) ➔ 수직거리 PE = PF, AE = AF');
    }

    // =========================================================================
    // [탭 5 렌더링] 외심 O & 세 변의 수직이등분선
    // =========================================================================
    function renderMode5Circumcenter(rect, A, B, C, ang, circum, G) {
      const sub = state.subType[5];
      const layer = state.conceptSwitch;

      drawTriangleFilled(A, B, C, 'rgba(56, 189, 248, 0.07)');
      drawLine(A, B, GCOL.cyan, 3.2);
      drawLine(B, C, GCOL.cyan, 3.2);
      drawLine(C, A, GCOL.cyan, 3.2);

      if (circum) {
        const { O, R, D, E, F } = circum;

        // 합동인 직각삼각형 쌍 색칠 (해부 카드 클릭 연동!)
        drawTriangleFilled(O, A, F, 'rgba(56, 189, 248, 0.22)', 0);
        drawTriangleFilled(O, B, F, 'rgba(56, 189, 248, 0.22)', 0);
        drawTriangleFilled(O, B, D, 'rgba(52, 211, 153, 0.22)', 1);
        drawTriangleFilled(O, C, D, 'rgba(52, 211, 153, 0.22)', 1);
        drawTriangleFilled(O, C, E, 'rgba(244, 114, 182, 0.22)', 2);
        drawTriangleFilled(O, A, E, 'rgba(244, 114, 182, 0.22)', 2);

        if (layer === 'def' || layer === 'all') {
          const lineCol = layer === 'def' ? 'rgba(251, 191, 36, 0.85)' : 'rgba(255, 255, 255, 0.42)';
          drawTruePerpendicularBisector(B, C, D, O, lineCol, 2.0, true, 1);
          drawTruePerpendicularBisector(C, A, E, O, lineCol, 2.0, true, 2);
          drawTruePerpendicularBisector(A, B, F, O, lineCol, 2.0, true, 0);

          const pDirD = dist(O, D) > 3 ? O : addPt(D, perp(norm(minusPt(C, B))));
          const pDirE = dist(O, E) > 3 ? O : addPt(E, perp(norm(minusPt(A, C))));
          const pDirF = dist(O, F) > 3 ? O : addPt(F, perp(norm(minusPt(B, A))));
          drawRightAngleSign(D, pDirD, C, 11.5, GCOL.green);
          drawRightAngleSign(E, pDirE, A, 11.5, GCOL.pink);
          drawRightAngleSign(F, pDirF, B, 11.5, GCOL.cyan);

          edgeTicks(B, D, 1, GCOL.green, 7); edgeTicks(D, C, 1, GCOL.green, 7);
          edgeTicks(C, E, 2, GCOL.pink, 7); edgeTicks(E, A, 2, GCOL.pink, 7);
          edgeTicks(A, F, 3, GCOL.cyan, 7); edgeTicks(F, B, 3, GCOL.cyan, 7);

          const midpointTol = Math.max(ang.a, ang.b, ang.c) * 1e-4;
          drawPoint(D, 5, GCOL.green, dist(D, O) < midpointTol ? '' : 'D(BC중점)', null, G);
          drawPoint(E, 5, GCOL.pink, dist(E, O) < midpointTol ? '' : 'E(CA중점)', null, G);
          drawPoint(F, 5, GCOL.cyan, dist(F, O) < midpointTol ? '' : 'F(AB중점)', null, G);
        }

        drawCircle(O, R, GCOL.gold, 'rgba(251, 191, 36, 0.06)', 2.2);
        drawLine(O, A, GCOL.gold, 2.8, false, layer === 'p1');
        drawLine(O, B, GCOL.gold, 2.8, false, layer === 'p1');
        drawLine(O, C, GCOL.gold, 2.8, false, layer === 'p1');

        // [표시 보강] OA = OB = OC 눈금은 모든 렌즈·장면에서 그림(원본은 등거리 렌즈·직각 장면에서만 그려 표준 장면에는 반지름이 같다는 표시가 없었음)
        // 직각삼각형 장면은 O 가 빗변 위라 중점에, 그 밖의 장면은 꼭짓점 쪽 0.7 지점에(중점 D·E·F 이름표가 O–꼭짓점 눈금에 가려지지 않게)
        const tf = (sub === 'circumRight' || sub === 'circum3060') ? 0.5 : 0.7;
        tickAt(O, A, tf, 2, GCOL.gold, 8);
        tickAt(O, B, tf, 2, GCOL.gold, 8);
        tickAt(O, C, tf, 2, GCOL.gold, 8);

        // [표시 보강] 직각삼각형의 외심: OA = OB 이므로 ∠OAB = ∠OBA, OB = OC 이므로 ∠OBC = ∠OCB (같은 색·같은 값), 30-60-90 은 ∠BOC 도 표시
        if ((sub === 'circumRight' || sub === 'circum3060') && layer !== 'p3') {
          curvedAngle(A, B, O, GCOL.cyan, 30, 1, `${angDeg(A, B, O)}°`);
          curvedAngle(B, O, A, GCOL.cyan, 30, 1, `${angDeg(B, O, A)}°`);
          curvedAngle(B, C, O, GCOL.pink, 30, 1, `${angDeg(B, C, O)}°`);
          curvedAngle(C, O, B, GCOL.pink, 30, 1, `${angDeg(C, O, B)}°`);
          if (sub === 'circum3060') { const dA = Math.round(ang.degA); curvedAngle(O, B, C, GCOL.pink, 34, 1, `${dA <= 90 ? 2 * dA : 360 - 2 * dA}°`); } // 머리글(∠BOC = 2∠A)과 같은 값
        }

        if (layer === 'p3' || sub === 'circumAngle' || sub === 'circumObtuse') {
          const dirAO = norm(minusPt(O, A));
          const extPt = addPt(O, multiply(dirAO, 80));
          drawLine(A, extPt, GCOL.white, 2.0, true);
          curvedAngle(A, B, O, GCOL.cyan, 26, 1, 'x');
          curvedAngle(B, O, A, GCOL.cyan, 26, 1, 'x');
          curvedAngle(B, C, O, GCOL.green, 26, 1, 'y');
          curvedAngle(C, O, B, GCOL.green, 26, 1, 'y');
          curvedAngle(C, A, O, GCOL.gold, 30, 1, 'z');
          curvedAngle(A, O, C, GCOL.gold, 30, 1, 'z');

          const degA = Math.round(ang.degA);
          if (ang.degA <= 90) {
            curvedAngle(O, B, C, GCOL.pink, 32, 2, `2∠A=${2 * degA}°`);
          } else {
            curvedAngle(O, B, C, GCOL.gold, 36, 2, `180° 넘는 각 2∠A=${2 * degA}°`, true);
            curvedAngle(O, B, C, GCOL.pink, 24, 1, `${360 - 2 * degA}°`, false);
          }
        }

        if (Math.abs(ang.degB - 90) < 1.5) drawRightAngleSign(B, A, C, 14, GCOL.white);

        let oLoc = '내부', locColor = GCOL.green;
        if (Math.abs(ang.degA - 90) < 1.8 || Math.abs(ang.degB - 90) < 1.8 || Math.abs(ang.degC - 90) < 1.8) {
          oLoc = '빗변의 중점!';
          locColor = GCOL.gold;
        } else if (ang.degA > 90 || ang.degB > 90 || ang.degC > 90) {
          oLoc = '외부';
          locColor = GCOL.red;
        }
        drawPoint(O, 7.5, locColor, `O(외심·${oLoc})`, { x: 12, y: 16 });
      }

      drawPoint(A, 7.5, GCOL.gold, `A(${Math.round(ang.degA)}°)`, null, G);
      drawPoint(B, 7.5, GCOL.cyan, 'B', null, G);
      drawPoint(C, 7.5, GCOL.pink, 'C', null, G);

      const dA = Math.round(ang.degA);
      const boc = dA <= 90 ? 2 * dA : 360 - 2 * dA;
      drawBottomTapeBanner(rect, `외심 각 법칙: ∠x + ∠y + ∠z = 90°  |  꼭지각 ∠A = ${dA}° ➔ 중심각 ∠BOC = ${boc}°`, [
        { text: '이등변 밑각 ∠x', weight: 0.33, color: GCOL.cyan },
        { text: '이등변 밑각 ∠y', weight: 0.34, color: GCOL.green },
        { text: '이등변 밑각 ∠z (합=90°)', weight: 0.33, color: GCOL.gold }
      ]);
    }

    // =========================================================================
    // [탭 6 렌더링] 내심 I & 넓이 3분할 · 접선 · 평행선
    // =========================================================================
    function renderMode6Incenter(rect, A, B, C, ang, inc, G) {
      const sub = state.subType[6];
      const layer = state.conceptSwitch;

      if (!inc) return;
      const { I, r, D, E, F } = inc;

      // ★ 6-F: 내심 I를 지나고 밑변 BC에 평행한 선분 DE (△ADE 둘레 = AB + AC!) ★
      if (sub === 'incenterParallel') {
        const pL = { x: I.x - 250, y: I.y }, pR = { x: I.x + 250, y: I.y };
        // BC 방향 벡터와 평행하고 내심 I를 지나는 직선과 AB, AC의 교점 D_par, E_par
        const dirBC = norm(minusPt(C, B));
        const D_par = intersectTwoLines(A, B, I, addPt(I, dirBC)) || midPt(A, B);
        const E_par = intersectTwoLines(A, C, I, addPt(I, dirBC)) || midPt(A, C);

        drawTriangleFilled(A, B, C, 'rgba(255, 255, 255, 0.04)');
        drawTriangleFilled(D_par, B, I, 'rgba(56, 189, 248, 0.24)', 0);
        drawTriangleFilled(E_par, C, I, 'rgba(244, 114, 182, 0.24)', 1);
        drawTriangleFilled(A, D_par, E_par, 'rgba(251, 191, 36, 0.18)', 2);

        drawLine(A, B, GCOL.white, 3.0); drawLine(B, C, GCOL.white, 3.0); drawLine(C, A, GCOL.white, 3.0);
        drawLine(A, D_par, GCOL.cyan, 4.0, false, true, 0);
        drawLine(A, E_par, GCOL.pink, 4.0, false, true, 1);

        // 슬라이더 state.fold로 DI를 DB로, EI를 EC로 펴서 AB + AC가 됨을 시각적으로 증명!
        const curI_left = lerp(I, B, state.fold);
        const curI_right = lerp(I, C, state.fold);
        drawLine(D_par, curI_left, GCOL.cyan, 4.2, false, true, 0);
        drawLine(E_par, curI_right, GCOL.pink, 4.2, false, true, 1);
        drawLine(D_par, E_par, 'rgba(251, 191, 36, 0.5)', 2.2, true);

        parallelArrows(D_par, E_par, 1, GCOL.gold);
        parallelArrows(B, C, 1, GCOL.gold);
        drawLine(B, I, GCOL.cyan, 2.4, true);
        drawLine(C, I, GCOL.pink, 2.4, true);

        edgeTicks(D_par, B, 1, GCOL.cyan, 7.5); edgeTicks(D_par, I, 1, GCOL.cyan, 7.5);
        edgeTicks(E_par, C, 2, GCOL.pink, 7.5); edgeTicks(E_par, I, 2, GCOL.pink, 7.5);

        curvedAngle(B, D_par, I, GCOL.cyan, 26, 1, '●');
        curvedAngle(B, I, C, GCOL.cyan, 30, 1, '●');
        curvedAngle(I, D_par, B, GCOL.cyan, 26, 1, '●');

        curvedAngle(C, I, E_par, GCOL.pink, 26, 1, '×');
        curvedAngle(C, B, I, GCOL.pink, 30, 1, '×');
        curvedAngle(I, C, E_par, GCOL.pink, 26, 1, '×');

        drawPoint(A, 7, GCOL.gold, 'A', null, G);
        drawPoint(B, 7, GCOL.cyan, 'B', null, G);
        drawPoint(C, 7, GCOL.pink, 'C', null, G);
        drawPoint(I, 7, GCOL.green, 'I(내심)', { x: -10, y: 22 });
        drawPoint(D_par, 6.5, GCOL.cyan, 'D(DB=DI)', { x: -65, y: 4 });
        drawPoint(E_par, 6.5, GCOL.pink, 'E(EC=EI)', { x: 12, y: 4 });

        const abCm = (ang.c / 10).toFixed(1), acCm = (ang.b / 10).toFixed(1);
        drawBottomTapeBanner(rect, `내심 평행선(DE∥BC): △ADE 둘레 = (AD+DI) + (AE+EI) = AB(${abCm}) + AC(${acCm}) = ${(parseFloat(abCm)+parseFloat(acCm)).toFixed(1)} cm!`, [
          { text: `AD + DI = AB (${abCm}cm)`, weight: ang.c / (ang.b + ang.c), color: GCOL.cyan },
          { text: `AE + EI = AC (${acCm}cm)`, weight: ang.b / (ang.b + ang.c), color: GCOL.pink }
        ]);
        return;
      }

      // 기본 내심 & 접선 쌍 & 넓이 3분할
      if (sub === 'incenterUnfold' || layer === 'p3') {
        drawTriangleFilled(I, B, C, 'rgba(56, 189, 248, 0.22)', 1);
        drawTriangleFilled(I, C, A, 'rgba(52, 211, 153, 0.22)', 2);
        drawTriangleFilled(I, A, B, 'rgba(251, 191, 36, 0.22)', 0);
      } else {
        drawTriangleFilled(I, A, F, 'rgba(251, 191, 36, 0.22)', 0);
        drawTriangleFilled(I, A, E, 'rgba(251, 191, 36, 0.22)', 0);
        drawTriangleFilled(I, B, F, 'rgba(56, 189, 248, 0.22)', 1);
        drawTriangleFilled(I, B, D, 'rgba(56, 189, 248, 0.22)', 1);
        drawTriangleFilled(I, C, D, 'rgba(244, 114, 182, 0.22)', 2);
        drawTriangleFilled(I, C, E, 'rgba(244, 114, 182, 0.22)', 2);
      }

      if (Math.abs(ang.degB - 90) < 1.5) {
        drawQuadFilled(B, D, I, F, 'rgba(251, 191, 36, 0.35)', GCOL.gold, 0);
        drawRightAngleSign(B, A, C, 14, GCOL.gold); // [표시 보강] 직각 모퉁이 B 의 직각 표시(D·F 는 아래에서 이미 표시)
        labelLine(addPt(lerp(B, D, 0.5), { x: 4, y: 27 }), 'r×r 정사각형', GCOL.gold, 11.5); // [표시 보강] 정사각형 가운데는 네 변 눈금(휴대폰에서 글자가 눈금에 걸림) → 아랫변 바로 아래로
      }

      if (sub === 'incenterTangents' || sub === 'incenterRightSq' || layer === 'p1') {
        drawLine(A, F, GCOL.gold, 4.0, false, false, 0); drawLine(A, E, GCOL.gold, 4.0, false, false, 0);
        drawLine(B, F, GCOL.cyan, 4.0, false, false, 1); drawLine(B, D, GCOL.cyan, 4.0, false, false, 1);
        drawLine(C, D, GCOL.pink, 4.0, false, false, 2); drawLine(C, E, GCOL.pink, 4.0, false, false, 2);
        edgeTicks(A, F, 1, GCOL.gold, 7.5); edgeTicks(A, E, 1, GCOL.gold, 7.5);
        edgeTicks(B, F, 2, GCOL.cyan, 7.5); edgeTicks(B, D, 2, GCOL.cyan, 7.5);
        edgeTicks(C, D, 3, GCOL.pink, 7.5); edgeTicks(C, E, 3, GCOL.pink, 7.5);
      } else {
        drawLine(A, B, GCOL.cyan, 3.2);
        drawLine(B, C, GCOL.cyan, 3.2);
        drawLine(C, A, GCOL.cyan, 3.2);
      }

      drawLine(A, I, 'rgba(255,255,255,0.6)', 2.0, true);
      drawLine(B, I, 'rgba(255,255,255,0.6)', 2.0, true);
      drawLine(C, I, 'rgba(255,255,255,0.6)', 2.0, true);

      if (layer === 'def' || layer === 'p3' || sub === 'incenterAngle') {
        curvedAngle(A, B, I, GCOL.gold, 28, 1, 'x');
        curvedAngle(A, I, C, GCOL.gold, 32, 1, 'x');
        curvedAngle(B, C, I, GCOL.cyan, 28, 1, 'y');
        curvedAngle(B, I, A, GCOL.cyan, 32, 1, 'y');
        curvedAngle(C, A, I, GCOL.pink, 28, 1, 'z');
        curvedAngle(C, I, B, GCOL.pink, 32, 1, 'z');
      }

      // [표시 보강] 각이등분선이 나눈 두 각을 같은 표시로(A: 1겹 금색, B: 2겹 하늘색, C: 3겹 분홍). x·y·z 글자 표시가 켜진 장면(위)에서는 그 표시를 그대로 씁니다.
      if (!(layer === 'def' || layer === 'p3' || sub === 'incenterAngle') && sub !== 'incenterUnfold') {
        curvedAngle(A, B, I, GCOL.gold, 30, 1); curvedAngle(A, I, C, GCOL.gold, 30, 1);
        curvedAngle(B, C, I, GCOL.cyan, 30, 2); curvedAngle(B, I, A, GCOL.cyan, 30, 2);
        curvedAngle(C, A, I, GCOL.pink, 30, 3); curvedAngle(C, I, B, GCOL.pink, 30, 3);
      }

      drawCircle(I, r, GCOL.green, 'rgba(52, 211, 153, 0.10)', 2.4);
      drawLine(I, D, GCOL.pink, 2.8); drawRightAngleSign(D, I, C, 11.5, GCOL.pink);
      drawLine(I, E, GCOL.pink, 2.8); drawRightAngleSign(E, I, A, 11.5, GCOL.pink);
      drawLine(I, F, GCOL.pink, 2.8); drawRightAngleSign(F, I, B, 11.5, GCOL.pink);
      edgeTicks(I, D, 1, GCOL.pink, 7); edgeTicks(I, E, 1, GCOL.pink, 7); edgeTicks(I, F, 1, GCOL.pink, 7); // [표시 보강] ID = IE = IF = r

      drawPoint(D, 5, GCOL.pink, 'D(수선의 발)', null, I);
      drawPoint(E, 5, GCOL.pink, 'E(수선의 발)', null, I);
      drawPoint(F, 5, GCOL.pink, 'F(수선의 발)', null, I);

      const bic = Math.round(90 + ang.degA / 2);
      if (layer === 'p3' || sub === 'incenterAngle') {
        curvedAngle(I, B, C, GCOL.gold, 26, 2, `${bic}°`);
      }

      // ★ 슬라이더(state.fold) 연동: 피자 3조각(△IBC, △ICA, △IAB)을 아래쪽에 일렬로 펼치기! ★
      if (state.fold > 0.01) {
        const sc = 0.52;
        const a = ang.a * sc, b = ang.b * sc, c = ang.c * sc, h = r * sc;
        const totalW = a + b + c;
        const baseY = 158;
        const startX = -totalW / 2;

        const t1B = { x: startX, y: baseY }, t1C = { x: startX + a, y: baseY }, t1I = { x: startX + a / 2, y: baseY - h };
        const t2C = { x: startX + a, y: baseY }, t2A = { x: startX + a + b, y: baseY }, t2I = { x: startX + a + b / 2, y: baseY - h };
        const t3A = { x: startX + a + b, y: baseY }, t3B = { x: startX + totalW, y: baseY }, t3I = { x: startX + a + b + c / 2, y: baseY - h };

        const p1B = lerp(B, t1B, state.fold), p1C = lerp(C, t1C, state.fold), p1I = lerp(I, t1I, state.fold);
        const p2C = lerp(C, t2C, state.fold), p2A = lerp(A, t2A, state.fold), p2I = lerp(I, t2I, state.fold);
        const p3A = lerp(A, t3A, state.fold), p3B = lerp(B, t3B, state.fold), p3I = lerp(I, t3I, state.fold);

        drawTriangleFilled(p1I, p1B, p1C, 'rgba(56, 189, 248, 0.42)');
        drawLine(p1I, p1B, GCOL.cyan, 2); drawLine(p1B, p1C, GCOL.cyan, 3); drawLine(p1C, p1I, GCOL.cyan, 2);
        drawTriangleFilled(p2I, p2C, p2A, 'rgba(52, 211, 153, 0.42)');
        drawLine(p2I, p2C, GCOL.green, 2); drawLine(p2C, p2A, GCOL.green, 3); drawLine(p2A, p2I, GCOL.green, 2);
        drawTriangleFilled(p3I, p3A, p3B, 'rgba(251, 191, 36, 0.42)');
        drawLine(p3I, p3A, GCOL.gold, 2); drawLine(p3A, p3B, GCOL.gold, 3); drawLine(p3B, p3I, GCOL.gold, 2);
      }

      drawPoint(I, 7.2, GCOL.green, 'I(내심)', { x: 10, y: -8 });
      drawPoint(A, 7.5, GCOL.gold, `A(${Math.round(ang.degA)}°)`, null, G);
      drawPoint(B, 7.5, GCOL.cyan, 'B', null, G);
      drawPoint(C, 7.5, GCOL.pink, 'C', null, G);

      const totP = ang.a + ang.b + ang.c;
      drawBottomTapeBanner(rect, `내심으로 나눈 세 삼각형의 넓이: S = ½r(a + b + c)  |  ∠BIC = 90° + ½∠A = ${bic}°`, [
        { text: '△IBC (½ar)', weight: ang.a / totP, color: GCOL.cyan },
        { text: '△ICA (½br)', weight: ang.b / totP, color: GCOL.green },
        { text: '△IAB (½cr)', weight: ang.c / totP, color: GCOL.gold }
      ]);
    }

    // =========================================================================
    // [탭 7 렌더링] 외심 O · 내심 I · 무게중심 G 비교
    // =========================================================================
    function renderMode7CompareOIG(rect, A, B, C, ang, circum, inc, cent) {
      const sub = state.subType[7];
      const G = cent.G;
      const showO = state.activePartIdx === -1 || state.activePartIdx === 0;
      const showI = state.activePartIdx === -1 || state.activePartIdx === 1;
      const showG = state.activePartIdx === -1 || state.activePartIdx === 2;

      if (sub === 'centroidFocus' || state.activePartIdx === 2) {
        const { D, E, F } = cent;
        const cols = ['rgba(56,189,248,0.18)', 'rgba(56,189,248,0.10)', 'rgba(52,211,153,0.18)', 'rgba(52,211,153,0.10)', 'rgba(244,114,182,0.18)', 'rgba(244,114,182,0.10)'];
        drawTriangleFilled(A, F, G, cols[0]); drawTriangleFilled(B, F, G, cols[1]);
        drawTriangleFilled(B, D, G, cols[2]); drawTriangleFilled(C, D, G, cols[3]);
        drawTriangleFilled(C, E, G, cols[4]); drawTriangleFilled(A, E, G, cols[5]);
      } else {
        drawTriangleFilled(A, B, C, 'rgba(255, 255, 255, 0.04)');
      }

      drawLine(A, B, GCOL.white, 3.0);
      drawLine(B, C, GCOL.white, 3.0);
      drawLine(C, A, GCOL.white, 3.0);

      if (Math.abs(ang.degB - 90) < 1.5) drawRightAngleSign(B, A, C, 14, GCOL.gold);

      // [표시 보강] 정삼각형은 세 변 같은 눈금·세 각 같은 표시, 이등변삼각형은 AB = AC 눈금과 같은 두 밑각(점을 끌어 모양이 바뀌면 조건이 맞을 때만 표시)
      if (sub === 'oigEquil' && Math.abs(ang.a - ang.b) < 2.5 && Math.abs(ang.b - ang.c) < 2.5) {
        // 중점에는 중선·각이등분선·수직이등분선이 지나가 눈금이 가려지므로 꼭짓점에서 1/4 지점에
        tickAt(A, B, 0.25, 1, GCOL.gold, 8); tickAt(B, C, 0.25, 1, GCOL.gold, 8); tickAt(C, A, 0.25, 1, GCOL.gold, 8);
        curvedAngle(A, B, C, GCOL.gold, 30, 1, `${Math.round(ang.degA)}°`);
        curvedAngle(B, C, A, GCOL.gold, 30, 1, `${Math.round(ang.degB)}°`);
        curvedAngle(C, A, B, GCOL.gold, 30, 1, `${Math.round(ang.degC)}°`);
      } else if (sub === 'oigIso' && Math.abs(ang.b - ang.c) < 2.5) {
        tickAt(A, B, 0.3, 2, GCOL.gold, 8); tickAt(A, C, 0.3, 2, GCOL.gold, 8);
        curvedAngle(B, C, A, GCOL.pink, 30, 1, `${Math.round(ang.degB)}°`);
        curvedAngle(C, A, B, GCOL.pink, 30, 1, `${Math.round(ang.degC)}°`);
      }

      if (showO && circum) {
        const { O, R, D, E, F } = circum;
        drawCircle(O, R, GCOL.cyan, 'rgba(56, 189, 248, 0.04)', 2.0, true, 0);
        drawTruePerpendicularBisector(B, C, D, O, 'rgba(56, 189, 248, 0.45)', 1.5, true, 0);
        drawTruePerpendicularBisector(C, A, E, O, 'rgba(56, 189, 248, 0.45)', 1.5, true, 0);
        drawTruePerpendicularBisector(A, B, F, O, 'rgba(56, 189, 248, 0.45)', 1.5, true, 0);
        if (sub === 'defCompare' || state.activePartIdx === 0) {
          // [표시 보강] 중점 D_O: BD_O = D_O C 눈금과 수직이등분선의 직각 표시
          edgeTicks(B, D, 1, GCOL.cyan, 7); edgeTicks(D, C, 1, GCOL.cyan, 7);
          if (dist(O, D) > 3) drawRightAngleSign(D, O, C, 10, GCOL.cyan);
          drawPoint(D, 5, GCOL.cyan, 'D_O(BC중점)', { x: -35, y: 20 });
        }
        drawPoint(O, 7, GCOL.cyan, 'O(외심)', { x: -55, y: -10 });
      }

      if (showI && inc) {
        const { I, r, D } = inc;
        drawCircle(I, r, GCOL.green, 'rgba(52, 211, 153, 0.10)', 2.2, false, 1);
        drawLine(I, D, GCOL.pink, 2.4, false, false, 1);
        drawRightAngleSign(D, I, C, 10, GCOL.pink);
        if (sub === 'defCompare' || state.activePartIdx === 1) {
          drawPoint(D, 5, GCOL.pink, 'D_I(수선의 발)', { x: 15, y: 20 });
        }
        drawPoint(I, 7, GCOL.green, 'I(내심)', { x: 12, y: -8 });
      }

      if (showG) {
        const { D, E, F } = cent;
        drawLine(A, D, GCOL.purple, 2.4, true, false, 2);
        drawLine(B, E, GCOL.purple, 2.4, true, false, 2);
        drawLine(C, F, GCOL.purple, 2.4, true, false, 2);
        if (sub === 'centroidFocus' || state.activePartIdx === 2) {
          // [표시 보강] 글·해설의 중점 D·E·F 를 그림에도: 점 이름과 같은 길이 눈금(BD = DC, CE = EA, AF = FB)
          edgeTicks(B, D, 1, GCOL.gold, 7); edgeTicks(D, C, 1, GCOL.gold, 7);
          edgeTicks(C, E, 2, GCOL.gold, 7); edgeTicks(E, A, 2, GCOL.gold, 7);
          edgeTicks(A, F, 3, GCOL.gold, 7); edgeTicks(F, B, 3, GCOL.gold, 7);
          drawPoint(D, 5, GCOL.purple, 'D(BC중점)', null, G);
          drawPoint(E, 5, GCOL.purple, 'E(CA중점)', null, G);
          drawPoint(F, 5, GCOL.purple, 'F(AB중점)', null, G);
          labelLine(lerp(A, G, 0.5), '2k', GCOL.gold, 13);
          labelLine(lerp(G, D, 0.5), '1k', GCOL.gold, 13);
        }
        drawPoint(G, 7, GCOL.purple, 'G(무게중심 2:1)', { x: 12, y: 14 });
      }

      drawPoint(A, 7.5, GCOL.gold, 'A', null, G);
      drawPoint(B, 7.5, GCOL.cyan, 'B', null, G);
      drawPoint(C, 7.5, GCOL.pink, 'C', null, G);

      drawMiniOverlayBox(rect, '🧭 외심(O) · 내심(I) · 무게중심(G) 비교', [
        { txt: '🔵 외심 O: 수직이등분선 / 중점 D,E,F', col: '#38bdf8' },
        { txt: '🟢 내심 I: 각이등분선 / 수선의 발 D,E,F', col: '#34d399' },
        { txt: '🟣 무게중심 G: 세 중선 / 2:1 & 6등분', col: '#c084fc' }
      ]);

      drawBottomTapeBanner(rect, '무게중심 G 중선 내분비: 꼭짓점으로부터 AG : GD = 2 : 1 (6개 작은 삼각형 넓이 모두 ⅙S!)', [
        { text: '꼭짓점 쪽 AG (2k)', weight: 2 / 3, color: GCOL.purple },
        { text: '중점 쪽 GD (1k)', weight: 1 / 3, color: GCOL.gold }
      ]);
    }

    // =========================================================================
    // [탭 8 렌더링] 고난도 각 추론 & 보조선 해부
    // =========================================================================
    function renderMode8AngleChasing(rect, A, B, C, ang, inc) {
      const sub = state.subType[8];
      const step = state.fold < 0.33 ? 1 : state.fold < 0.67 ? 2 : 3;

      if (sub === 'domino') {
        const deg = 20 * (Math.PI / 180), L = 115;
        const pB = { x: -210, y: 78 };
        const x1 = L, pA = { x: pB.x + x1 * Math.cos(deg), y: pB.y - x1 * Math.sin(deg) };
        const x2 = 2 * L * Math.cos(deg), pC = { x: pB.x + x2, y: pB.y };
        const x3 = x1 + 2 * L * Math.cos(2 * deg), pD = { x: pB.x + x3 * Math.cos(deg), y: pB.y - x3 * Math.sin(deg) };
        const x4 = x2 + 2 * L * Math.cos(3 * deg), pE = { x: pB.x + x4, y: pB.y };
        const pF = { x: pB.x + 425 * Math.cos(deg), y: pB.y - 425 * Math.sin(deg) };
        const pG = { x: pB.x + 425, y: pB.y };

        drawLine(pB, pF, GCOL.white, 2.5);
        drawLine(pB, pG, GCOL.white, 2.5);

        drawTriangleFilled(pB, pA, pC, 'rgba(56, 189, 248, 0.20)', 0);
        drawLine(pB, pA, GCOL.cyan, 3.4); drawLine(pA, pC, GCOL.cyan, 3.4);
        edgeTicks(pB, pA, 1, GCOL.cyan, 7); edgeTicks(pA, pC, 1, GCOL.cyan, 7);
        curvedAngle(pB, pA, pC, GCOL.cyan, 34, 1, 'x');
        curvedAngle(pC, pA, pB, GCOL.cyan, 30, 1, 'x');

        drawTriangleFilled(pC, pA, pD, 'rgba(52, 211, 153, 0.20)', 1);
        drawLine(pC, pD, GCOL.green, 3.4);
        edgeTicks(pC, pD, 1, GCOL.green, 7);
        curvedAngle(pA, pD, pC, GCOL.green, 28, 1, '2x');
        curvedAngle(pD, pC, pA, GCOL.green, 28, 1, '2x');

        drawTriangleFilled(pD, pC, pE, 'rgba(244, 114, 182, 0.20)', 2);
        drawLine(pD, pE, GCOL.pink, 3.4);
        edgeTicks(pD, pE, 1, GCOL.pink, 7);
        curvedAngle(pC, pD, pE, GCOL.pink, 26, 1, '3x');
        curvedAngle(pE, pD, pC, GCOL.pink, 26, 1, '3x');
        curvedAngle(pD, pF, pE, GCOL.gold, 30, 2, '4x');

        drawPoint(pB, 6, GCOL.white, 'B', { x: -18, y: 16 });
        drawPoint(pA, 6, GCOL.cyan, 'A', { x: -10, y: -12 });
        drawPoint(pC, 6, GCOL.cyan, 'C', { x: -6, y: 20 });
        drawPoint(pD, 6, GCOL.green, 'D', { x: -6, y: -12 });
        drawPoint(pE, 6, GCOL.pink, 'E', { x: -6, y: 20 });
        drawBottomTapeBanner(rect, '이웃한 이등변삼각형의 외각: ∠B(x) ➔ ∠CAD(2x) ➔ △BCD 외각 ∠DCE(x+2x=3x) ➔ △BDE 외각 ∠EDF(x+3x=4x)!');
        return;
      }

      if (sub === 'parallelIso') {
        const U = { x: -200, y: -95 }, V = { x: 200, y: -95 }, W = { x: -200, y: 85 }, X = { x: 200, y: 85 };
        const P = { x: -60, y: -95 }, Q = { x: 100, y: 85 };
        const v1 = { x: -1, y: 0 }, v2 = norm(minusPt(Q, P)), bis = norm(addPt(v1, v2));
        const M = { x: P.x + (85 - P.y) * (bis.x / bis.y), y: 85 };

        drawTriangleFilled(P, Q, M, 'rgba(52, 211, 153, 0.22)', 2);
        drawLine(U, V, GCOL.white, 2.8); drawLine(W, X, GCOL.white, 2.8);
        parallelArrows(U, P, 1, GCOL.gold); parallelArrows(W, M, 1, GCOL.gold);

        drawLine(P, Q, GCOL.cyan, 3.6); drawLine(Q, M, GCOL.cyan, 3.6); drawLine(P, M, GCOL.gold, 3.0, true);
        curvedAngle(P, U, M, GCOL.gold, 30, 1, '●(이등분)');
        curvedAngle(P, M, Q, GCOL.gold, 34, 1, '●(이등분)');
        curvedAngle(M, P, Q, GCOL.pink, 32, 1, '●(엇각)');
        edgeTicks(Q, P, 2, GCOL.cyan, 8); edgeTicks(Q, M, 2, GCOL.cyan, 8);

        drawPoint(P, 6.5, GCOL.gold, 'P', { x: 0, y: -12 });
        drawPoint(Q, 6.5, GCOL.cyan, 'Q', { x: 10, y: 20 });
        drawPoint(M, 6.5, GCOL.pink, 'M', { x: -10, y: 20 });
        drawBottomTapeBanner(rect, '평행선 + 각이등분선(또는 종이접기): 이등분각(●) = Z자 엇각(●) ➔ △QPM은 QP = QM인 이등변삼각형!');
        return;
      }

      if (sub === 'inBisect' && inc) {
        const P = inc.I;
        drawTriangleFilled(A, B, C, 'rgba(56, 189, 248, 0.08)');
        drawLine(A, B, GCOL.cyan, 3.2); drawLine(B, C, GCOL.white, 3.2); drawLine(C, A, GCOL.cyan, 3.2);
        drawTriangleFilled(P, B, C, 'rgba(251, 191, 36, 0.18)', 2);
        drawLine(B, P, GCOL.gold, 3.0, true); drawLine(C, P, GCOL.gold, 3.0, true);

        curvedAngle(A, B, C, GCOL.cyan, 26, 1, `${Math.round(ang.degA)}°`);
        curvedAngle(B, A, P, GCOL.gold, 26, 1, '●'); curvedAngle(B, P, C, GCOL.gold, 30, 1, '●');
        curvedAngle(C, P, B, GCOL.pink, 26, 1, '×'); curvedAngle(C, A, P, GCOL.pink, 30, 1, '×');
        curvedAngle(P, B, C, GCOL.green, 28, 2, `${Math.round(90 + ang.degA / 2)}°`);

        drawPoint(A, 7, GCOL.gold, 'A', { x: 0, y: -14 });
        drawPoint(B, 7, GCOL.cyan, 'B', { x: -18, y: 18 });
        drawPoint(C, 7, GCOL.pink, 'C', { x: 10, y: 18 });
        drawPoint(P, 7.5, GCOL.green, 'P(90°+½A)', { x: 12, y: -8 });
        drawBottomTapeBanner(rect, '① 두 내각 이등분선의 교점 P: ∠BPC = 90° + ½∠A');
        return;
      }

      if (sub === 'inExBisect') {
        const pA = { x: -65, y: -110 }, pB = { x: -170, y: 85 }, pC = { x: 15, y: 85 }, pD = { x: 185, y: 85 };
        const uBA = norm(minusPt(pA, pB)), uBC = norm(minusPt(pC, pB)), dirB = norm(addPt(uBA, uBC));
        const uCA = norm(minusPt(pA, pC)), uCD = norm(minusPt(pD, pC)), dirC = norm(addPt(uCA, uCD));
        const P = intersectTwoLines(pB, addPt(pB, dirB), pC, addPt(pC, dirC)) || { x: 155, y: -95 };
        const angABC = getAngles(pA, pB, pC);

        drawTriangleFilled(pA, pB, pC, 'rgba(56, 189, 248, 0.14)', 0);
        drawLine(pA, pB, GCOL.cyan, 3.2); drawLine(pB, pC, GCOL.white, 3.2); drawLine(pC, pA, GCOL.cyan, 3.2);
        drawLine(pC, pD, GCOL.white, 2.8);

        drawTriangleFilled(P, pB, pC, 'rgba(251, 191, 36, 0.16)', 2);
        drawLine(pB, P, GCOL.gold, 3.0, true); drawLine(pC, P, GCOL.pink, 3.0, true);

        curvedAngle(pA, pB, pC, GCOL.cyan, 26, 1, `${Math.round(angABC.degA)}°`);
        curvedAngle(pB, pA, P, GCOL.gold, 30, 1, '●'); curvedAngle(pB, P, pC, GCOL.gold, 34, 1, '●');
        curvedAngle(pC, pA, P, GCOL.pink, 26, 1, '×'); curvedAngle(pC, P, pD, GCOL.pink, 30, 1, '×');
        curvedAngle(P, pB, pC, GCOL.green, 32, 2, `½∠A=${Math.round(angABC.degA / 2)}°`);

        drawPoint(pA, 7, GCOL.cyan, 'A', { x: -10, y: -14 });
        drawPoint(pB, 7, GCOL.cyan, 'B', { x: -18, y: 18 });
        drawPoint(pC, 7, GCOL.white, 'C', { x: -6, y: 22 });
        drawPoint(pD, 5.5, GCOL.white, 'D', { x: -6, y: 22 });
        drawPoint(P, 7.5, GCOL.gold, 'P(½∠A!)', { x: -65, y: -14 });
        drawBottomTapeBanner(rect, '② 한 내각(∠B) + 한 외각(∠C) 이등분선의 교점 P: ∠BPC = ½∠A (꼭지각의 절반!)');
        return;
      }

      if (sub === 'exExBisect') {
        const pA = { x: 0, y: -150 }, pB = { x: -95, y: -20 }, pC = { x: 95, y: -20 };
        const dirAB = norm(minusPt(pB, pA)), dirAC = norm(minusPt(pC, pA));
        const extB = addPt(pB, multiply(dirAB, 135)), extC = addPt(pC, multiply(dirAC, 135));
        const aa = dist(pB, pC), bb = dist(pC, pA), cc = dist(pA, pB), den = (-aa + bb + cc) || 1;
        const P = { x: (-aa * pA.x + bb * pB.x + cc * pC.x) / den, y: (-aa * pA.y + bb * pB.y + cc * pC.y) / den };
        const angABC = getAngles(pA, pB, pC);

        drawTriangleFilled(pA, pB, pC, 'rgba(56, 189, 248, 0.14)', 0);
        drawLine(pA, pB, GCOL.cyan, 3.2); drawLine(pB, pC, GCOL.white, 3.2); drawLine(pC, pA, GCOL.cyan, 3.2);
        drawLine(pB, extB, GCOL.white, 2.2, true); drawLine(pC, extC, GCOL.white, 2.2, true);

        drawTriangleFilled(P, pB, pC, 'rgba(244, 114, 182, 0.16)', 2);
        drawLine(pB, P, GCOL.pink, 3.0, true); drawLine(pC, P, GCOL.pink, 3.0, true);

        curvedAngle(pA, pB, pC, GCOL.cyan, 26, 1, `${Math.round(angABC.degA)}°`);
        curvedAngle(pB, extB, P, GCOL.gold, 26, 1, '●'); curvedAngle(pB, P, pC, GCOL.gold, 30, 1, '●');
        curvedAngle(pC, pB, P, GCOL.pink, 26, 1, '×'); curvedAngle(pC, P, extC, GCOL.pink, 30, 1, '×');
        curvedAngle(P, pB, pC, GCOL.green, 28, 2, `90°-½A=${Math.round(90 - angABC.degA / 2)}°`);

        drawPoint(pA, 7, GCOL.cyan, 'A', { x: 0, y: -14 });

        drawPoint(P, 7.5, GCOL.gold, 'P(90°-½A)', { x: 14, y: 6 });
        drawBottomTapeBanner(rect, '③ 두 외각 이등분선의 교점 P: ∠BPC = 90° - ½∠A');
        return;
      }

      if (sub === 'boomerang') {
        const pA = { x: 0, y: -140 }, pB = { x: -150, y: 90 }, pD = { x: 0, y: 15 }, pC = { x: 150, y: 90 };
        const pE = { x: 0, y: 120 };

        drawTriangleFilled(pA, pB, pD, 'rgba(56, 189, 248, 0.18)', 0);
        drawTriangleFilled(pA, pC, pD, 'rgba(244, 114, 182, 0.18)', 1);
        drawLine(pA, pB, GCOL.cyan, 3.4); drawLine(pB, pD, GCOL.cyan, 3.4);
        drawLine(pD, pC, GCOL.pink, 3.4); drawLine(pC, pA, GCOL.pink, 3.4);

        drawLine(pA, pE, GCOL.gold, 2.8, true, false, 1);
        drawPoint(pE, 5.5, GCOL.gold, 'E', { x: 12, y: 4 }); // [표시 보강] 연장선 위의 점은 'E' 로만 적음(AD 연장선은 점선으로 보임)
        curvedAngle(pD, pB, pE, GCOL.cyan, 28, 1, '∠A₁+∠B');
        curvedAngle(pD, pE, pC, GCOL.pink, 28, 1, '∠A₂+∠C');
        // [표시 보강] 설명에 나오는 ∠A₁(= ∠BAD)·∠A₂(= ∠DAC)·∠BDC 를 그림에도: A 에서 보조선 AE 가 ∠A 를 둘로 나누고, D 에서는 두 외각을 합친 ∠BDC 를 바깥 호로
        curvedAngle(pA, pB, pD, GCOL.cyan, 26, 1, '∠A₁');
        curvedAngle(pA, pD, pC, GCOL.pink, 26, 1, '∠A₂');
        curvedAngle(pA, pB, pC, GCOL.gold, 48, 1, '∠A', false, 0.3);
        curvedAngle(pD, pB, pC, GCOL.gold, 80, 1, '∠BDC', false, 0.3);
        curvedAngle(pB, pD, pA, GCOL.cyan, 26, 1, '∠B');
        curvedAngle(pC, pA, pD, GCOL.pink, 26, 1, '∠C');

        drawPoint(pA, 7, GCOL.gold, 'A', { x: 0, y: -14 });
        drawPoint(pB, 7, GCOL.cyan, 'B', { x: -18, y: 18 });
        drawPoint(pC, 7, GCOL.pink, 'C', { x: 10, y: 18 });
        drawPoint(pD, 7.5, GCOL.gold, 'D(오목한 각)', { x: 14, y: -8 });
        drawBottomTapeBanner(rect, '오목사각형: 안쪽으로 들어간 각 ∠BDC = ∠A + ∠B + ∠C (보조선 AE를 긋고 외각을 두 번 이용!)');
        return;
      }

      if (sub === 'rightAlt') {
        const pB = { x: -170, y: 78 }, pC = { x: 145, y: 78 }, pH = { x: -50, y: 78 };
        const hLen = Math.sqrt((pH.x - pB.x) * (pC.x - pH.x));
        const pA = { x: pH.x, y: pH.y - hLen };

        drawTriangleFilled(pA, pB, pH, 'rgba(56, 189, 248, 0.20)', 0);
        drawTriangleFilled(pA, pH, pC, 'rgba(52, 211, 153, 0.20)', 1);
        drawLine(pA, pB, GCOL.cyan, 3.4); drawLine(pB, pC, GCOL.white, 3.4); drawLine(pC, pA, GCOL.green, 3.4);
        drawLine(pA, pH, GCOL.pink, 3.2, true);

        drawRightAngleSign(pA, pB, pC, 14, GCOL.gold);
        drawRightAngleSign(pH, pA, pB, 12, GCOL.cyan);
        drawRightAngleSign(pH, pA, pC, 12, GCOL.green);

        curvedAngle(pB, pA, pC, GCOL.cyan, 30, 1, '●(52°)');
        curvedAngle(pC, pA, pB, GCOL.pink, 34, 2, '×(38°)');
        curvedAngle(pA, pB, pH, GCOL.pink, 32, 2, '×(38°)');
        curvedAngle(pA, pH, pC, GCOL.cyan, 36, 1, '●(52°)');

        drawPoint(pA, 7, GCOL.gold, 'A(90°)', { x: 0, y: -14 });
        drawPoint(pB, 7, GCOL.cyan, 'B', { x: -18, y: 18 });
        drawPoint(pC, 7, GCOL.green, 'C', { x: 10, y: 18 });
        drawPoint(pH, 6.5, GCOL.pink, 'H(수선의 발)', { x: -25, y: 22 });
        drawBottomTapeBanner(rect, '직각삼각형의 빗변에 내린 수선: ● + × = 90° 이므로 ∠B = ∠CAH = ●(52°), ∠C = ∠BAH = ×(38°)');
        return;
      }

      // equilRot
      const pA = { x: 0, y: -150 }, pB = { x: -140, y: 85 }, pC = { x: 140, y: 85 };
      const P = { x: -35, y: 10 }, P_rot = rotatePtAround(P, pA, -Math.PI / 3);
      drawLine(pA, pB, GCOL.cyan, 2.8); drawLine(pB, pC, GCOL.white, 2.8); drawLine(pC, pA, GCOL.cyan, 2.8);
      drawTriangleFilled(pA, pB, P, 'rgba(56, 189, 248, 0.22)', 0);
      drawLine(pA, P, GCOL.gold, 3.2); drawLine(pB, P, GCOL.cyan, 2.8);

      drawLine(pA, P_rot, GCOL.gold, 3.2); drawLine(pC, P_rot, GCOL.pink, 2.8);
      curvedAngle(pA, P, P_rot, GCOL.gold, 32, 1, '60°');
      edgeTicks(pA, P, 1, GCOL.gold, 7.5); edgeTicks(pA, P_rot, 1, GCOL.gold, 7.5);
      // [표시 보강] AB = AC(= BC), BP = CP′ 눈금과 같은 각 ∠BAP = ∠CAP′(●) — △ABP ≡ △ACP′ 의 SAS 조건이 그림에 보이게
      edgeTicks(pA, pB, 2, GCOL.cyan, 7.5); edgeTicks(pA, pC, 2, GCOL.cyan, 7.5); edgeTicks(pB, pC, 2, GCOL.cyan, 7.5);
      edgeTicks(pB, P, 3, GCOL.cyan, 7.5); edgeTicks(pC, P_rot, 3, GCOL.pink, 7.5);
      curvedAngle(pA, pB, P, GCOL.cyan, 40, 1, '●');
      curvedAngle(pA, pC, P_rot, GCOL.cyan, 40, 1, '●');

      drawTriangleFilled(pA, P, P_rot, 'rgba(251, 191, 36, 0.26)', 2);
      drawLine(P, P_rot, GCOL.gold, 3.4, true);
      edgeTicks(P, P_rot, 1, GCOL.gold, 7.5);

      drawPoint(pA, 7, GCOL.gold, 'A(60° 회전축)', { x: 0, y: -14 });
      drawPoint(pB, 6.5, GCOL.cyan, 'B', { x: -18, y: 18 });
      drawPoint(pC, 6.5, GCOL.cyan, 'C', { x: 10, y: 18 });
      drawPoint(P, 6.5, GCOL.cyan, 'P', { x: -18, y: 14 });
      drawPoint(P_rot, 6.5, GCOL.pink, "P'(회전점)", { x: 12, y: 4 });
      drawBottomTapeBanner(rect, "정삼각형 60° 회전 보조선: △ABP ≡ △ACP' (SAS) ➔ AP = AP', ∠PAP'=60° ➔ △APP'는 정삼각형!");
    }

  /* ===== 원본 render() 의 도형 계산·탐구관 분기 (원본 1337–1376행, 캔버스·UI 부분만 뺌) ===== */
  function paintScene() {
    const rect = { width: 1000, height: 700 }; // 하단 띠·미니 상자는 셸이 그리므로 크기는 쓰이지 않음
    const A = state.pts.A, B = state.pts.B, C = state.pts.C;
    const ang = getAngles(A, B, C);
    const circum = getCircumcenter(A, B, C);
    const inc = getIncenter(A, B, C);
    const cent = getCentroid(A, B, C);

    if (state.showTrace && state.tracePoints.length > 1 && PL.pass === 2 && !BOARD._bbox) {
      // [2.0 수정] 원본은 캔버스 ctx에 직접 그렸던 외심 궤적 → 무대 경로 호출로
      // [2.0 수정] 원본의 연한 점선(투명도 0.45, 2px)은 칠판·종이 모두에서 잘 안 보였습니다 → 테마 의미색(amber)을 불투명하게, 굵게, 빛나게.
      BOARD.path(state.tracePoints, { color: 'amber', width: 3.6, dash: [7, 4], glow: true });
      const tp = state.tracePoints[state.tracePoints.length - 1];
      if (tp) BOARD.point(tp, { color: 'amber', r: 4 });
    }

    const m = state.mode;
    if (m === 1) renderMode1Iso(rect, A, B, C, ang, cent.G);
    else if (m === 2) renderMode2RightCong(rect, A, B, C, ang);
    else if (m === 3) renderMode3GeneralCong(rect, A, B, C);
    else if (m === 4) renderMode4Bisectors(rect, A, B, C, ang);
    else if (m === 5) renderMode5Circumcenter(rect, A, B, C, ang, circum, cent.G);
    else if (m === 6) renderMode6Incenter(rect, A, B, C, ang, inc, cent.G);
    else if (m === 7) renderMode7CompareOIG(rect, A, B, C, ang, circum, inc, cent);
    else if (m === 8) renderMode8AngleChasing(rect, A, B, C, ang, inc);
  }
