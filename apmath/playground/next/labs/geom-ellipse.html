  function ellipseProof(id,v) {
    const a=v.a, bb=v.b, c=v.c;
    if(id==='1-A')v.quick=String.raw`정의 $PF+PF'=2a=${2*a}$에서 $PF=${v.pf}$. 세 변을 한꺼번에 묶으면 둘레 $=(PF+PF')+FF'=2a+2c=${v.per}$. 점 P의 좌표는 필요하지 않습니다.`;
    if(id==='1-B')v.quick=String.raw`지름에 대한 원주각으로 직각임을 먼저 확인합니다. $u=PF$, $v=PF'$라 놓으면 $u+v=2a$, $u^2+v^2=4c^2$. 따라서 $S=uv/2=((2a)^2-(2c)^2)/4=a^2-c^2=b^2=${bb*bb}$. 이 직각 교점은 $c\ge b$일 때 존재합니다.`;
    if(id==='1-C')v.quick=String.raw`초점 F는 타원 내부이므로 현 PQ에서 P와 Q 사이에 있습니다. $PQ=PF+FQ$로 나누면 둘레 $=(PF'+PF)+(QF'+QF)=2a+2a=${4*a}$.`;
    if(id==='2-B'){
      v.quick=String.raw`세로 배율 $b/a$의 변환과 역변환은 원·타원 위 삼각형을 일대일로 대응시킵니다. 수평 밑변으로 삼각형을 나누면 각 조각의 밑변은 그대로, 높이만 $b/a$배여서 모든 넓이가 같은 비로 바뀝니다. 원의 최댓값 $3\sqrt3a^2/4$에 $b/a$를 곱해 $3\sqrt3ab/4$입니다.`;
      v.steps[1]+=' 역변환도 가능하고 모든 삼각형의 넓이가 같은 비로 바뀌므로 최댓값의 순서도 보존됩니다.';
    }
    if(id==='2-C'){
      v.steps=[String.raw`P와 Q에서 x축에 내린 공통 수선의 발 H를 잡고 OQ를 연결합니다.`,String.raw`원의 접선 QT는 OQ와 수직입니다. 세로 축소는 접선도 접선으로 보내고 x축 위 T를 고정하므로 두 접선의 절편이 같습니다.`,String.raw`직각삼각형 OQT의 닮음으로 $OH\cdot OT=OQ^2=a^2$. $x_1=${v.x1}\gt 0$이므로 $OT=${v.chk.T}$.`];
      v.quick=String.raw`수선 QH를 그리면 $\triangle OQH\sim\triangle OTQ$이므로 $OH\cdot OT=a^2$. 세로 축소에서 x축 위 T가 고정되므로 타원 접선도 이 T를 지납니다. $x_T=a^2/x_1=${v.ans.match(/T\((.*),/)[1]}$. $x_1=0$일 때는 수평 접선이라 절편이 없습니다.`;
    }
    if(id==='3-A') {
      v.quick=String.raw`접선의 반사 성질로 F의 대칭점 F″은 F′P의 연장선 위에 놓입니다. $PF''=PF$이므로 $F'F''=PF'+PF=2a=${2*a}$. O와 H₁은 각각 F′F와 FF″의 중점이므로 $OH_1=F'F''/2=${a}$.`;
      v.standard={steps:String.raw`① 접선의 식을 $ux+vy=1$로 씁니다. $u=x_1/a^2$, $v=y_1/b^2$, $N=u^2+v^2$로 두면 타원 식에서 $b^2N=1-c^2u^2$입니다.<br>② 수선의 발은 $H_1=(c,0)+(1-cu)(u,v)/N$이므로 $OH_1^2=c^2+(1-c^2u^2)/N=c^2+b^2=a^2$. 따라서 $OH_1=${a}$.<br>③ 좌표벡터로 $F''=2H_1-F$, $F'=-F$이므로 $F'F''=2OH_1=${2*a}$.`,warning:'수선의 발 좌표와 거리 제곱을 정리해야 합니다. 반사와 중점을 보면 이 통분을 생략할 수 있습니다.'};
    }
    if(id==='3-B'){
      v.steps=['각 초점에서 접선에 내린 수선의 발 H₁,H₂를 잡습니다. 초점의 대칭과 중점연결정리로 OH₁=OH₂=a입니다.','H₁의 원점 대칭점 H₁′을 잡습니다. 중심대칭으로 F′H₁′=FH₁=d₁이며 H₁′,F′,H₂는 한 직선 위입니다.',String.raw`원 안의 F′를 지나는 두 현의 곱: $d_1d_2=(a-c)(a+c)=a^2-c^2=b^2=${bb*bb}$.`];
      v.quick=String.raw`수선의 발은 반지름 a인 원 위입니다(초점 반사와 중점연결정리). H₁을 원점에 대칭시킨 H₁′도 원 위이고 $F′H₁′=d_1$, $F′H_2=d_2$. 현 H₁′H₂와 장축 지름이 F′에서 만나므로 두 현의 곱에서 $d_1d_2=(a-c)(a+c)=b^2=${bb*bb}$.`;
      v.standard={steps:String.raw`① 접선 $ux+vy=1$에서 $u=x_1/a^2$, $v=y_1/b^2$, $N=u^2+v^2$로 두면 거리 공식으로 $d_1=|1-cu|/\sqrt N$, $d_2=|1+cu|/\sqrt N$입니다.<br>② 타원 식을 이용하면 $b^2N=b^2x_1^2/a^4+y_1^2/b^2=1-c^2u^2>0$.<br>③ 따라서 $d_1d_2=|1-c^2u^2|/N=b^2=${bb*bb}$.`,warning:'접선 계수의 제곱합을 통분하는 계산을 원 안의 두 현의 곱으로 줄일 수 있습니다.'};
    }
    if(id==='4-B'){
      v.steps=['O에서 서로 수직인 두 접선에 내린 수선의 발 K₁,K₂를 잡으면 OK₁MK₂는 직사각형입니다.',String.raw`첫 수선 방향이 θ이면 $OK_1^2=a^2\cos^2\theta+b^2\sin^2\theta$. 수직인 두 번째 방향에서는 sin,cos가 바뀝니다. (접선 조건으로 얻는 식)`,String.raw`두 식을 더하면 $OM^2=OK_1^2+OK_2^2=a^2+b^2=${v.R2}$. 모든 방향에서 성립하므로 자취는 원입니다.`];
      v.quick=String.raw`직사각형 OK₁MK₂에서 $OM^2=OK_1^2+OK_2^2$. 법선 방향 $(\cos\theta,\sin\theta)$인 접선까지의 거리 h는 $h^2=a^2\cos^2\theta+b^2\sin^2\theta$입니다. 이 식은 직선과 타원의 교점이 하나라는 판별식 조건으로 얻습니다. 수직 방향의 식을 더하면 $OM^2=a^2+b^2=${v.R2}$. 역으로 이 원은 타원 밖에 있으며, 이 원 위 점을 지나는 두 접선의 기울기 곱은 −1입니다(수직 접선이 있으면 다른 접선은 수평). 꼭짓점 (a,b)는 결과를 검산하는 한 위치입니다.`;
      v.standard={steps:String.raw`① M의 좌표를 $(X,Y)$라 놓습니다. 기울기 t인 접선의 조건 $(Y-tX)^2=a^2t^2+b^2$에서 $(X^2-a^2)t^2-2XYt+(Y^2-b^2)=0$입니다.<br>② 두 접선의 기울기 곱이 −1이므로 $(Y^2-b^2)/(X^2-a^2)=-1$, 따라서 $X^2+Y^2=a^2+b^2=${v.R2}$이고 $OM=\sqrt{${v.R2}}$.<br>③ $X^2=a^2$이면 수직 접선 $x=\pm a$와 수평 접선 $y=\pm b$의 교점이며 같은 원 위입니다. 역으로 이 원의 모든 점은 타원 밖에 있고, 일반점의 두 실접선의 기울기 곱은 −1, 네 예외점에서는 수평·수직이므로 원 전체가 자취입니다.`,warning:'기울기만으로 증명할 때는 수직 접선을 별도로 확인해야 합니다. 수선으로 만든 직사각형은 이 경우도 같은 그림으로 다룹니다.'};
    }
    return v;
  }

  const ellipseExplore = {};
  function oldEllipseUpgrade(sc, id) {

    const old = scenarioDB[id], list = OVE.POOL[id].map(q=>ellipseProof(id,OVE.B[id](q)));

    sc.problem = {

      quick: () => ({ steps: cur().quick, highlight: '보조선의 성질과 적용 조건을 확인한 뒤 값을 계산합니다.' })
    };
    sc.view = (s, lab) => (lab && lab.tab !== 'explore' ? { chips: [], formula: old.formula } : oView(s, lab));
    sc.draw = (b, s, v, lab) => {

    };
    return sc;
  }
  groups.forEach((g) => g.scenes.forEach((sc, i) => oldEllipseUpgrade(sc, sc.id)));

  const KICE_GROUPS = [

    { id: 'q6', title: '[기출 핵심] 타원과 쌍곡선이 두 초점을 공유', short: '타원+쌍곡선 2', scenes: [sceneE6()] }
  ];

  return { groups: KICE_GROUPS, params: KP, state: KS, explore: ellipseExplore, variants: { OVE, VE5, VE6 }, math: { geoE5, geoE6 } };
  })();

  for (const sc of ellipseScenes) {

  const ellipseSource = window.APL_ELLIPSE_SOURCE = {

  const ellipseLessons = window.APL_ELLIPSE_LESSONS?.install(ellipseScenes, ellipseSource) || {};
  APLab.createLab({

    params: {
      ...KICE.params,
      a: {

        format: (v) => `a = ${v.toFixed(2)} (2a = ${(2 * v).toFixed(2)})`,

        format: (v) => `${(((v * 180) / Math.PI) % 360 + 360) % 360 >= 359.95 ? '0.0' : ((((v * 180) / Math.PI) % 360 + 360) % 360).toFixed(1)}°`
      },
