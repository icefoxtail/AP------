<script>
/* ==========================================================================
   기하 · 타원 (AP Math Lab 2.0 이식본) — 4개 탭 × 10개 장면
   원본: labs/기하와벡터/타원.html ("타원 실전 킬러 랩 Pro")
   이식 방식: 원본의 시나리오 데이터(scenarioDB)와 장면별 그리기 함수(renderSub1A~4B)·수학 함수를
   글자 그대로 옮기고, 분필 그리기 함수(drawChalkLine/Point 등)와 raw 캔버스 호출만 새 무대(APLab.Board)에
   연결했습니다(캔버스 색은 테마에 맞는 의미색으로, 글자는 후광과 함께 자동 변환).
   - 원본의 4개 모드 탭 = 묶음(탭), 10개 세부 시나리오 = 장면, 단계 토글 3개 = 셸의 단계 플레이어,
     우측 실시간 모니터 4칸 = 지금 보이는 값, 기출 스냅 칩 = 프리셋 칩, 조각 해부 카드 = 관찰 포인트
   - 점 P·Q·M(몬쥬)·초점현의 두 끝점은 끌 수 있는 손잡이(후광 점)로 바꿨습니다.
   - 하단 HUD 배너 → 무대 아래 요약 띠, 모서리 안내 상자 → 무대 카드
   ========================================================================== */
window.addEventListener('DOMContentLoaded', function () {
  const TAU = Math.PI * 2;
  let B = null;            // 지금 그리고 있는 무대(APLab.Board)
  let ctx = null;          // B.ctx 를 감싼 그리기 도구(색·글자만 테마에 맞게 바꿔 줌)
  const sink = { card: null, tape: null };

  /* ===== 원본 상태 객체(이름 그대로) — 매 프레임 2.0 셸 상태에서 채웁니다 ===== */
  const state = {
    mode: 1, subType: '1-A', a: 5.0, b: 3.0, theta: Math.PI / 3, fold: 1.0,
    activePartIdx: null, steps: { 1: true, 2: false, 3: false },
    laserProgress: 0, tangentQOffset: 2.5, chordOverlay: false,
    get scale() { return B.k; }   // 원본의 '1칸 = scale 픽셀'
  };

  /* ===== 무대 연결 도구 ===== */
  // raw ctx 호출 그대로 쓰되 ① 헥사·rgba 색을 테마 의미색으로 ② 글자에 후광 ③ 글꼴을 셸 글꼴로 바꿉니다.
  function themed(v) {
    const p = APLab.parseColor(v);
    // 원본의 어두운 상자 바탕(rgba(5,28,26,.9) 등)은 테마의 바탕색으로, 나머지는 의미색으로
    if (p && Math.max(p.r, p.g, p.b) < 70) return p.a != null && p.a < 1 ? APLab.rgba(B.colors.halo, p.a) : B.colors.halo;
    return B.color(v);
  }
  function wrapCtx(real) {
    return new Proxy(real, {
      get(t, k) {
        if (k === 'fillText') {
          return (txt, x, y, mw) => {
            // 분수 라벨은 공용 보드의 위아래 분수 조판으로 그립니다.
            if (B._fracSplit(String(txt))) {
              const size = Number((t.font.match(/([\d.]+)px/) || [0, 13])[1]);
              B.stext(x, y, txt, { size, color: t.fillStyle, weight: /bold|[6-9]00/.test(t.font) ? 700 : 400, align: t.textAlign, baseline: t.textBaseline });
              return;
            }
            // 글자가 무대 밖으로 잘리지 않도록 안으로 밀어 넣고(너무 길면 줄여서) 후광과 함께 그립니다
            const right = B.W - (B.insets.right || 0) - 6;
            let w = t.measureText(txt).width;
            if (mw != null && w > mw) w = mw;
            if (w > right - 6) { mw = right - 6; w = mw; }
            const al = t.textAlign;
            const x0 = al === 'center' ? x - w / 2 : al === 'right' || al === 'end' ? x - w : x;
            if (x0 < 6) x += 6 - x0; else if (x0 + w > right) x -= x0 + w - right;
            y = Math.max(14, Math.min(B.H - (B.insets.bottom || 0) - 6, y));
            t.save();
            t.lineJoin = 'round'; t.lineWidth = 4; t.strokeStyle = B.colors.halo; t.shadowBlur = 0; t.setLineDash([]);
            mw == null ? t.strokeText(txt, x, y) : t.strokeText(txt, x, y, mw);
            t.restore();
            mw == null ? t.fillText(txt, x, y) : t.fillText(txt, x, y, mw);
          };
        }
        const v = t[k];
        return typeof v === 'function' ? v.bind(t) : v;
      },
      set(t, k, v) {
        if ((k === 'fillStyle' || k === 'strokeStyle' || k === 'shadowColor') && typeof v === 'string') v = themed(v);
        else if (k === 'font' && typeof v === 'string') v = v.replace(/(\d+(?:\.\d+)?px)\s.*$/, '$1 ' + B.font);
        t[k] = v;
        return true;
      }
    });
  }
  const toScreen = (x, y) => B.toS(x, y);
  const partOf = (p) => (p == null ? undefined : p);
  function formatNum(v) {
    return Number(v.toFixed(2)).toString();
  }
  // 조각 해부 하이라이트 알파 계산 헬퍼 (원본 그대로)
  function getPartAlpha(partIdx, baseAlpha = 1.0) {
    if (state.activePartIdx === null || partIdx === undefined || partIdx === null) return baseAlpha;
    return state.activePartIdx === partIdx ? 1.0 : 0.22;
  }
  function isPartEmphasized(partIdx) {
    return state.activePartIdx !== null && state.activePartIdx === partIdx;
  }
  // 라벨 오프셋(화면 픽셀, 왼쪽 정렬 기준). 점 왼쪽에 놓으려는 큰 음수 오프셋은 오른쪽 정렬로 바꿔 점에 붙입니다.
  function labelPos(off) {
    return off.x <= -50 ? { dx: -11, dy: off.y, align: 'right' } : { dx: off.x, dy: off.y, align: 'left' };
  }

  /* ===== 분필 프리미티브 → 무대 엔진 ===== */
  function drawChalkLine(x1, y1, x2, y2, color = '#ffffff', width = 2, dashed = false, glow = false, partIdx = null) {
    B.seg([x1, y1], [x2, y2], { color, width, dash: dashed ? [6, 5] : null, glow, part: partOf(partIdx) });
  }
  function drawChalkPoint(x, y, radius = 5.5, color = '#fbbf24', label = '', labelOffset = { x: 10, y: -10 }, partIdx = null) {
    const o = { color, r: radius * 0.92, part: partOf(partIdx) };
    if (label) {
      const narrow = B.W < 540;
      o.label = narrow && label.length > 17 ? (label.includes('(') ? label.slice(0, label.indexOf('(')).trim() : label.slice(0, 15) + '…') : label;
      o.baseline = 'alphabetic';
      Object.assign(o, labelPos(labelOffset));
    }
    B.point({ x, y }, o);
  }
  // 원본 drawBottomHUD → 무대 아래 요약 띠(주 문장 + 보조 문장 + 비율 막대)
  function drawBottomHUD(rect, mainText, subText = '', segs = null) {
    sink.tape = {
      title: subText ? mainText + '\n' + subText : mainText,
      segments: Array.isArray(segs) && segs.length ? segs.map((s) => ({ text: s.text || '', weight: s.weight, color: s.color })) : null
    };
  }
  // 원본 drawCornerMessage → 무대 카드
  function drawCornerMessage(rect, title, body, color = '#fbbf24') {
    sink.card = { title, lines: [{ text: body, color }] };
  }
  function drawEllipseCurve(a, b) {
    const pts = [];
    for (let i = 0; i <= 240; i++) { const t = (i / 240) * TAU; pts.push([a * Math.cos(t), b * Math.sin(t)]); }
    B.path(pts, { color: 'ink', width: 3, glow: true, close: true });
  }

  /* ======================================================================
     ↓↓↓ 원본에서 글자 그대로 옮긴 부분 (데이터 · 수학 함수 · 장면별 그리기)
     ====================================================================== */
    // 모드별 세부 시나리오(subType) 목록
    const modeSubTypes = {
      1: [
        { id: '1-A', label: '1-A. 정의와 둘레' },
        { id: '1-B', label: '1-B. ∠F\'PF=90°와 넓이 b²' },
        { id: '1-C', label: '1-C. 초점을 지나는 현, ΔPQF\' 둘레 4a' }
      ],
      2: [
        { id: '2-A', label: '2-A. 두 원으로 타원 위의 점 작도' },
        { id: '2-B', label: '2-B. 세로 방향 축소($\\frac{b}{a}$)와 넓이' },
        { id: '2-C', label: '2-C. 접선의 x절편 $\\frac{a^2}{x_1}$' }
      ],
      3: [
        { id: '3-A', label: '3-A. 대칭점 F\'\'과 중점연결' },
        { id: '3-B', label: '3-B. 접선까지의 거리의 곱 d₁×d₂ = b²' }
      ],
      4: [
        { id: '4-A', label: '4-A. 법선·접선과 각의 이등분선' },
        { id: '4-B', label: '4-B. 수직인 두 접선의 교점' }
      ]
    };

    // -------------------------------------------------------------------------
    // 2. 10대 실전 기출 시나리오 완벽 데이터베이스
    // -------------------------------------------------------------------------
    const scenarioDB = {
      '1-A': {
        badge: "장면 1-A · 타원의 정의(PF'+PF=2a)와 삼각형의 둘레 킬러",
        hint: "노란 점 P를 끌어도 <span class='text-pink-300 font-bold'>PF' + PF = 2a = 10</span>으로 일정함을 확인하세요. 단축 꼭짓점 B에서는 <span class='text-sky-300 font-bold'>세 변의 길이가 c, b, a인 직각삼각형 BOF</span>가 만들어집니다.",
        tag: "타원의 정의",
        targetTime: "목표 시간: 5초",
        question: `타원 <span class="font-mono text-amber-300 font-bold">$\\frac{x^2}{25}$ + $\\frac{y^2}{9}$ = 1</span> 의 두 초점을 <span class="font-mono">F, F'</span>이라 하자. 타원 위의 점 <span class="font-mono">P</span>에 대하여 선분 <span class="font-mono text-pink-300 font-bold">PF' = 7</span> 일 때, 선분 <span class="font-mono text-emerald-300 font-bold">PF</span>의 길이와 삼각형 <span class="font-mono text-amber-300 font-bold">PF'F의 둘레의 길이</span>를 구하시오.`,
        answerBadge: "PF = 3, ΔPF'F 둘레 = 18",
        presets: [
          { label: "PF'=7인 조건", a: 5.0, b: 3.0, theta: Math.PI / 3 },
          { label: "단축 꼭짓점 B(0,3): 직각삼각형 BOF", a: 5.0, b: 3.0, theta: Math.PI / 2 },
          { label: "PF':PF = 4:1 (θ=0° 근처)", a: 5.0, b: 3.0, theta: Math.acos(0.75) }
        ],
        parts: [
          { idx: 0, title: "① 초점 거리 합 (PF' + PF = 2a)", desc: "점 P의 위치에 따라 두 거리는 각각 변합니다. 거리의 합을 비교하세요.", color: "#f472b6" },
          { idx: 1, title: "② 초점삼각형 ΔPF'F 둘레 (2a + 2c)", desc: "(PF'+PF) + F'F = 10 + 8 = 18 불변", color: "#fbbf24" },
          { idx: 2, title: "③ 직각삼각형 ΔBOF (a²=b²+c²)", desc: "항상 보이는 기준 직각삼각형: OF=c, OB=b, BF=a", color: "#38bdf8" }
        ],
        steps: [
          "두 초점 F(4, 0), F'(-4, 0) 및 선분 PF, PF' 연결",
          "타원에 외접하는 직사각형(2a × 2b)과 네 꼭짓점 표시",
          "단축 꼭짓점 B에서 피타고라스 정리 a² = b² + c², 요약 띠에서 PF' + PF = 2a 확인"
        ],
        textbook: {
          steps: `① 초점 좌표: c = √(25 - 9) = 4 ⇒ F(4, 0), F'(-4, 0)<br/>
② 점 P(x₁, y₁)라 두면 √((x₁+4)² + y₁²) = 7<br/>
③ 타원 식 y₁² = 9(1 - x₁²/25) 대입 후 무리방정식 전개:<br/>
&nbsp;&nbsp;(16/25)x₁² + 8x₁ - 24 = 0 ⇒ 타원 위의 근 x₁ = 5/2, y₁²=27/4이다.<br/>④ PF²=(5/2−4)²+27/4=9이므로 PF=3. 둘레는 7+3+8=18이다.`,
          warning: "주의: 점 P의 좌표를 구하려고 근호가 들어 있는 방정식을 연립하면 계산이 길어지고 실수하기 쉽습니다. 타원의 정의를 이용하면 PF를 바로 구할 수 있습니다."
        },
        shortcut: {
          steps: `① 타원의 정의에 의해 <strong class="text-pink-300">PF' + PF = 2a = 10</strong>이다.<br/>
② <strong class="text-pink-300">PF' = 7</strong> 이므로 연립하지 않고도 <strong class="text-emerald-300">PF = 10 - 7 = 3</strong>이다.<br/>
③ ΔPF'F 둘레 = (PF' + PF) + F'F = <strong class="text-amber-300">2a + 2c = 10 + 8 = 18</strong>이다.`,
          highlight: "점 P가 단축 꼭짓점 B(0, b)에 오면 PF' = PF = a 이므로, 직각삼각형 ΔBOF의 세 변의 길이는 c, b, a입니다."
        }
      },

      '1-B': {
        badge: "장면 1-B · 직각삼각형 PF'F(∠F'PF = 90°)와 넓이 S = b²",
        hint: "<span class='text-sky-300 font-bold'>F'F를 지름으로 하는 원(x²+y²=c²)</span>과 타원의 교점 P에서 <span class='text-amber-300 font-bold'>∠F'PF = 90°</span>가 되며, 이때 ΔPF'F의 넓이는 <span class='text-amber-300 font-bold'>b² = 9</span>입니다.",
        tag: "타원과 원의 교점, 직각삼각형의 넓이 킬러",
        targetTime: "목표 시간: 5초",
        question: `타원 <span class="font-mono text-amber-300 font-bold">$\\frac{x^2}{25}$ + $\\frac{y^2}{9}$ = 1</span> 의 두 초점 <span class="font-mono">F(4,0), F'(-4,0)</span>를 지름의 양 끝으로 하는 원 <span class="font-mono text-sky-300 font-bold">x² + y² = 16</span> 과 타원의 교점을 <span class="font-mono">P</span>라 할 때, 직각삼각형 <span class="font-mono text-amber-300 font-bold">ΔPF'F의 넓이</span>를 구하시오.`,
        answerBadge: "∠F'PF = 90°, 넓이 S = b² = 9",
        // ∠F'PF = 90° 조건: x^2 + y^2 = c^2 => a^2 cos^2θ + b^2 sin^2θ = c^2 => (a^2-b^2)cos^2θ = c^2 - b^2 => cos^2θ = (c^2-b^2)/c^2
        // a=5, b=3, c=4 => cos^2θ = (16-9)/16 = 7/16 => θ = acos(√7 / 4) ≈ 48.59°
        presets: [
          { label: "∠F'PF = 90°인 교점", a: 5.0, b: 3.0, theta: Math.acos(Math.sqrt(7) / 4) },
          { label: "단축 꼭짓점 B", a: 5.0, b: 3.0, theta: Math.PI / 2 },
          { label: "c < b (∠F'PF = 90°인 점이 없는 경우)", a: 4.0, b: 3.2, theta: Math.PI / 2 }
        ],
        parts: [
          { idx: 0, title: "① 지름이 F'F인 원 (x² + y² = c²)", desc: "지름에 대한 원주각은 90°이므로 교점 P에서 ∠F'PF = 90°", color: "#38bdf8" },
          { idx: 1, title: "② 직각삼각형 ΔPF'F 넓이 (S = b²)", desc: "S = ½·PF'·PF = b² = 9.00 (a의 값과 관계없이 b²)", color: "#fbbf24" },
          { idx: 2, title: "③ 내접원 I·접점 분할 a−c", desc: "r=$\\frac{S}{a+c}$, P에서 내접원 접점까지의 길이 a−c", color: "#34d399" }
        ],
        steps: [
          "지름이 F'F(2c)인 원 x² + y² = c²을 그리고 교점 표시",
          "직각삼각형 ΔPF'F와 ∠F'PF의 크기, 직각 표시",
          "넓이 S = ½·PF'·PF = b²·tan($\\frac{α}{2}$)를 계산하여 확인"
        ],
        textbook: {
          steps: `① PF' = p, PF = q 라 두면 타원 정의에 의해 p + q = 10<br/>
② 지름 F'F에 대한 원주각 ∠F'PF = 90° 이므로 피타고라스 정리:<br/>
&nbsp;&nbsp;p² + q² = (2c)² = 8² = 64<br/>
③ 곱셈공식 (p+q)² - (p²+q²) = 2pq 대입:<br/>
&nbsp;&nbsp;100 - 64 = 36 = 2pq ⇒ pq = 18 ⇒ 넓이 S = ½pq = 9`,
          warning: "주의: 매번 p + q = 2a, p² + q² = 4c²으로 식을 세워 곱셈 공식을 쓰면 계산이 길어집니다. pq = 2b²임을 알면 간단합니다."

    };

    function drawRightAngleMark(foot, dir1, dir2, sizePx = 11, color = '#38bdf8', partIdx = null) {
      const pFoot = toScreen(foot.x, foot.y);
      const len1 = Math.hypot(dir1.x, dir1.y);
      const len2 = Math.hypot(dir2.x, dir2.y);
      if (len1 < 1e-5 || len2 < 1e-5) return;

      const u = { x: dir1.x / len1, y: -dir1.y / len1 };
      const v = { x: dir2.x / len2, y: -dir2.y / len2 };

      const p1 = { x: pFoot.x + u.x * sizePx, y: pFoot.y + u.y * sizePx };
      const p2 = { x: p1.x + v.x * sizePx, y: p1.y + v.y * sizePx };
      const p3 = { x: pFoot.x + v.x * sizePx, y: pFoot.y + v.y * sizePx };

      ctx.save();
      ctx.globalAlpha = getPartAlpha(partIdx, 1.0);
      ctx.beginPath();
      ctx.strokeStyle = color;
      ctx.lineWidth = isPartEmphasized(partIdx) ? 2.4 : 1.7;
      ctx.moveTo(p1.x, p1.y);
      ctx.lineTo(p2.x, p2.y);
      ctx.lineTo(p3.x, p3.y);
      ctx.stroke();
      ctx.restore();
    }

    // 사분면 반응형 라벨 오프셋 생성기 (라벨 겹침 원천 차단)
    function getRadialOffset(x, y, distRight = 12, distLeft = -115, distUp = -12, distDown = 22) {
      return {
        x: x >= 0 ? distRight : distLeft,
        y: y >= 0 ? distUp : distDown
      };
    }

    // 원본 분필 렌더러의 레이어/조각 인덱스를 유지하는 새 계산기하 프리미티브
    function drawPolygon(points, fill, stroke, partIdx = null, width = 1.6) {
      if (points.length < 3 || !points.every(p => Number.isFinite(p.x) && Number.isFinite(p.y))) return;
      ctx.save();
      ctx.globalAlpha = getPartAlpha(partIdx);
      ctx.beginPath();
      const q = toScreen(points[0].x, points[0].y);
      ctx.moveTo(q.x, q.y);
      for (let i = 1; i < points.length; i++) {
        const v = toScreen(points[i].x, points[i].y); ctx.lineTo(v.x, v.y);
      }
      ctx.closePath(); ctx.fillStyle = fill; ctx.fill();
      if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = isPartEmphasized(partIdx) ? width + 1.2 : width; ctx.stroke(); }
      ctx.restore();
    }
    function drawCircleGeometry(o, r, color, partIdx = null, dashed = true, width = 1.8) {
      if (!(Number.isFinite(o.x) && Number.isFinite(o.y) && Number.isFinite(r) && r > 0)) return;
      const p = toScreen(o.x, o.y);
      ctx.save(); ctx.globalAlpha = getPartAlpha(partIdx); ctx.beginPath();
      if (dashed) ctx.setLineDash([7, 5]);
      ctx.arc(p.x, p.y, r * state.scale, 0, Math.PI * 2);
      ctx.lineWidth = isPartEmphasized(partIdx) ? width + 1.5 : width;
      ctx.strokeStyle = color; ctx.stroke(); ctx.restore();
    }
    function dot(a, b) { return a.x*b.x + a.y*b.y; }
    function distance(a, b) { return Math.hypot(a.x-b.x, a.y-b.y); }
    function footOnLine(q, onLine, direction) {
      const u = dot({x:q.x-onLine.x, y:q.y-onLine.y}, direction) / dot(direction, direction);
      return {x:onLine.x + direction.x*u, y:onLine.y + direction.y*u};
    }
    function ellipseFocalChord(a,b,c,theta) {
      const u = {x:Math.cos(theta), y:Math.sin(theta)};
      const aa=b*b*u.x*u.x + a*a*u.y*u.y;
      const bb=2*b*b*c*u.x;
      const disc=Math.sqrt(Math.max(0, bb*bb + 4*aa*b**4));
      const t1=(-bb+disc)/(2*aa), t2=(-bb-disc)/(2*aa);
      return {P:{x:c+t1*u.x,y:t1*u.y}, Q:{x:c+t2*u.x,y:t2*u.y}};
    }
    function ellipseOrthogonalTangents(a,b,theta) {
      const R = Math.hypot(a,b);
      const M={x:R*Math.cos(theta),y:R*Math.sin(theta)};
      const X=M.x/a,Y=M.y/b,D=X*X+Y*Y,r=Math.sqrt(Math.max(0,D-1));
      return {M, T1:{x:a*(X-Y*r)/D,y:b*(Y+X*r)/D},
                  T2:{x:a*(X+Y*r)/D,y:b*(Y-X*r)/D}};
    }
    function ellipseTangent(P,a,b) {
      const n={x:P.x/(a*a),y:P.y/(b*b)};
      const L=Math.hypot(n.x,n.y);
      return {n, normal:{x:n.x/L,y:n.y/L}, direction:{x:-n.y/L,y:n.x/L}};
    }
    function reflectAcrossLine(Q, linePoint, unitLineDirection) {
      const H=footOnLine(Q,linePoint,unitLineDirection);
      return {H, reflection:{x:2*H.x-Q.x,y:2*H.y-Q.y}};
    }
    // [표시 보강] 각 표시 도우미: 같은 각은 같은 색·같은 호 개수로, 값(°)이나 기호는 호 바로 바깥(각의 안쪽 방향)에 씁니다.
    function degBetween(V, A, Bp) {
      const ax = A.x - V.x, ay = A.y - V.y, bx = Bp.x - V.x, by = Bp.y - V.y;
      const k = (ax * bx + ay * by) / ((Math.hypot(ax, ay) * Math.hypot(bx, by)) || 1);
      return Math.acos(Math.max(-1, Math.min(1, k))) * 180 / Math.PI;
    }
    function markAngle(V, A, Bp, color, text, r = 24, rings = 1, partIdx = null, gap = 14) {
      if (![V.x, V.y, A.x, A.y, Bp.x, Bp.y].every(Number.isFinite)) return;
      const c0 = B.ctx;
      c0.save();
      c0.globalAlpha = getPartAlpha(partIdx, 1.0);
      B.angle([V.x, V.y], [A.x, A.y], [Bp.x, Bp.y], { r, rings, color, label: text, size: 11, labelGap: gap });
      c0.restore();
    }
    function parMark(p, q, color = '#38bdf8', count = 1, partIdx = null) {
      const a = toScreen(p.x, p.y), b = toScreen(q.x, q.y);
      const l = Math.hypot(b.x - a.x, b.y - a.y) || 1, d = { x: (b.x - a.x) / l, y: (b.y - a.y) / l }, n = { x: -d.y, y: d.x };
      const m = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
      ctx.save();
      ctx.globalAlpha = getPartAlpha(partIdx, 1.0);
      ctx.strokeStyle = color;
      ctx.lineWidth = 2;
      ctx.setLineDash([]);
      for (let i = 0; i < count; i++) {
        const o = (i - (count - 1) / 2) * 7, t = { x: m.x + d.x * o, y: m.y + d.y * o };
        ctx.beginPath();
        ctx.moveTo(t.x - d.x * 4 + n.x * 5, t.y - d.y * 4 + n.y * 5);
        ctx.lineTo(t.x + d.x * 3, t.y + d.y * 3);
        ctx.lineTo(t.x - d.x * 4 - n.x * 5, t.y - d.y * 4 - n.y * 5);
        ctx.stroke();
      }
      ctx.restore();
    }
    function angleText(V, A, Bp, text, color, distPx = 30, partIdx = null) {
      const v = toScreen(V.x, V.y), a = toScreen(A.x, A.y), b = toScreen(Bp.x, Bp.y);
      const la = Math.hypot(a.x - v.x, a.y - v.y) || 1, lb = Math.hypot(b.x - v.x, b.y - v.y) || 1;
      let bx = (a.x - v.x) / la + (b.x - v.x) / lb, by = (a.y - v.y) / la + (b.y - v.y) / lb;
      const bl = Math.hypot(bx, by);
      if (bl < 1e-6) { bx = -(a.y - v.y) / la; by = (a.x - v.x) / la; } else { bx /= bl; by /= bl; }
      ctx.save();
      ctx.globalAlpha = getPartAlpha(partIdx, 1.0);
      ctx.font = 'bold 11.5px Pretendard';
      ctx.fillStyle = color;
      ctx.textAlign = 'center';
      ctx.fillText(text, v.x + bx * distPx, v.y + by * distPx + 4);
      ctx.restore();
    }
    function drawAngleArcAt(O,A,B,r,color,partIdx=null) {
      const p=toScreen(O.x,O.y), a=Math.atan2(-(A.y-O.y),A.x-O.x), b=Math.atan2(-(B.y-O.y),B.x-O.x);
      let d=((b-a+3*Math.PI)%(2*Math.PI))-Math.PI;
      ctx.save();ctx.globalAlpha=getPartAlpha(partIdx);ctx.beginPath();
      ctx.arc(p.x,p.y,r,a,a+d,d<0);ctx.strokeStyle=color;ctx.lineWidth=2.2;ctx.stroke();ctx.restore();
    }


    // =========================================================================
    // [1-A 렌더링] 기본 정의 & 둘레 2a+2c & 단축 꼭짓점 피타고라스
    // =========================================================================
    function renderSub1A(a, b, c, theta, P, F1, F2, rect) {
      // Step 2: 외접 직사각형 (partIdx = 2)
      if (state.steps[2]) {
        const tl = toScreen(-a, b);
        const br = toScreen(a, -b);
        ctx.save();
        ctx.globalAlpha = getPartAlpha(2, 1.0);
        ctx.strokeStyle = isPartEmphasized(2) ? '#38bdf8' : 'rgba(56, 189, 248, 0.5)';
        ctx.lineWidth = isPartEmphasized(2) ? 2.6 : 1.6;
        ctx.setLineDash([7, 6]);
        ctx.strokeRect(tl.x, tl.y, br.x - tl.x, br.y - tl.y);
        ctx.fillStyle = 'rgba(56, 189, 248, 0.04)';
        ctx.fillRect(tl.x, tl.y, br.x - tl.x, br.y - tl.y);
        ctx.restore();

        drawChalkPoint(a, 0, 4, '#38bdf8', `A(${formatNum(a)}, 0)`, { x: 8, y: -10 }, 2);
        drawChalkPoint(-a, 0, 4, '#38bdf8', `A'(-${formatNum(a)}, 0)`, { x: -72, y: -10 }, 2);
        drawChalkPoint(0, b, 4, '#38bdf8', `B(0, ${formatNum(b)})`, { x: 8, y: -10 }, 2);
        drawChalkPoint(0, -b, 4, '#38bdf8', `B'(0, -${formatNum(b)})`, { x: 8, y: 18 }, 2);
      }

      // Step 1: 두 초점 F, F' 및 선분 PF, PF' (partIdx = 0, 1)
      if (state.steps[1]) {
        const sP = toScreen(P.x, P.y);
        const sF1 = toScreen(F1.x, F1.y);
        const sF2 = toScreen(F2.x, F2.y);
        ctx.save();
        ctx.globalAlpha = getPartAlpha(1, 1.0);
        ctx.beginPath();
        ctx.moveTo(sP.x, sP.y);
        ctx.lineTo(sF2.x, sF2.y);
        ctx.lineTo(sF1.x, sF1.y);
        ctx.closePath();
        ctx.fillStyle = isPartEmphasized(1) ? 'rgba(251, 191, 36, 0.18)' : 'rgba(251, 191, 36, 0.07)';
        ctx.fill();
        ctx.restore();

        drawChalkLine(F2.x, F2.y, F1.x, F1.y, '#fbbf24', 2.5, false, false, 1);
        drawChalkLine(F2.x, F2.y, P.x, P.y, '#f472b6', 2.8, false, true, 0);
        drawChalkLine(F1.x, F1.y, P.x, P.y, '#34d399', 2.8, false, true, 0);

        const dPF = Math.hypot(P.x - F1.x, P.y - F1.y);
        const dPFp = Math.hypot(P.x - F2.x, P.y - F2.y);
        const mid1 = toScreen((F1.x + P.x) / 2, (F1.y + P.y) / 2);
        const mid2 = toScreen((F2.x + P.x) / 2, (F2.y + P.y) / 2);

        ctx.save();
        ctx.globalAlpha = getPartAlpha(0, 1.0);
        ctx.font = 'bold 12.5px Pretendard, monospace';
        const yOff = Math.abs(P.y) < 0.6 ? -18 : -8;
        ctx.fillStyle = '#f9a8d4';
        ctx.fillText(`PF' = ${dPFp.toFixed(2)}`, mid2.x - 68, mid2.y + yOff);
        ctx.fillStyle = '#6ee7b7';
        ctx.fillText(`PF = ${dPF.toFixed(2)}`, mid1.x + 10, mid1.y + yOff);
        ctx.restore();

        // c가 a에 가까울 때 꼭짓점 A와 라벨 겹침 방지
        const fOffY = a - c < 0.55 ? 28 : 22;
        drawChalkPoint(F1.x, 0, 5.5, '#f43f5e', `F(${formatNum(c)}, 0)`, { x: -22, y: fOffY }, 1);
        drawChalkPoint(F2.x, 0, 5.5, '#f43f5e', `F'(-${formatNum(c)}, 0)`, { x: -32, y: fOffY }, 1);
      }

      // Step 3: 단축 꼭짓점 근처일 때 직각삼각형 ΔBOF 강조 & 하단 게이지 바
      if (state.steps[3]) {
        const B={x:0,y:b}, O={x:0,y:0};
        drawPolygon([B,O,F1], 'rgba(56,189,248,0.12)', '#38bdf8',2);
        drawChalkLine(0,0,c,0,'#38bdf8',2.2,false,false,2);
        drawChalkLine(0,0,0,b,'#38bdf8',2.2,false,false,2);
        drawChalkLine(0,b,c,0,'#fbbf24',2.6,false,true,2);
        drawRightAngleMark(O,{x:c,y:0},{x:0,y:b},11,'#fbbf24',2);
        const bo=toScreen(-0.3,b/2), of=toScreen(c/2,0), bf=toScreen(c/2,b/2);
        ctx.save();ctx.fillStyle='#bae6fd';ctx.font='bold 11px Pretendard';
        ctx.fillText('b',bo.x-7,bo.y);ctx.fillText('c',of.x,of.y+18);ctx.fillText('a',bf.x+8,bf.y-8);ctx.restore();
        if (Math.abs(P.x) < 0.25 && P.y > 0) {
          drawChalkLine(0, 0, 0, b, '#38bdf8', 2.4, true, false);
          drawRightAngleMark({ x: 0, y: 0 }, { x: 1, y: 0 }, { x: 0, y: 1 }, 11, '#fbbf24');
        }
        const dPF = Math.hypot(P.x - F1.x, P.y - F1.y);
        const dPFp = Math.hypot(P.x - F2.x, P.y - F2.y);
        const total2a = 2 * a;
        const perimeter = total2a + 2 * c;

        drawBottomHUD(
          rect,
          `PF'(${dPFp.toFixed(2)}) + PF(${dPF.toFixed(2)}) = 2a(${total2a.toFixed(2)})  |  ΔPF'F 둘레 = 2a+2c = ${perimeter.toFixed(2)}`,
          '',
          [
            { weight: dPFp / total2a, color: '#ec4899', text: `PF' ${dPFp.toFixed(2)}` },
            { weight: dPF / total2a, color: '#10b981', text: `PF ${dPF.toFixed(2)}` }
          ]
        );
      }
    }

    // =========================================================================
    // [1-B 렌더링] 초점 직각삼각형 (∠F'PF = 90°) & 초점원 & 넓이 S = b^2
    // =========================================================================
    function renderSub1B(a, b, c, theta, P, F1, F2, rect) {
      const center = toScreen(0, 0);

      // Step 1: 지름이 F'F인 초점원 x^2 + y^2 = c^2 (partIdx = 0)
      if (state.steps[1]) {
        ctx.save();
        ctx.globalAlpha = getPartAlpha(0, 1.0);
        ctx.setLineDash([6, 5]);
        ctx.beginPath();
        ctx.arc(center.x, center.y, c * state.scale, 0, Math.PI * 2);
        ctx.strokeStyle = isPartEmphasized(0) ? '#38bdf8' : 'rgba(56, 189, 248, 0.75)';
        ctx.lineWidth = isPartEmphasized(0) ? 2.8 : 1.9;
        ctx.stroke();

        ctx.font = 'bold 12px Pretendard';
        ctx.fillStyle = '#38bdf8';
        ctx.fillText(
          `지름이 F'F인 원 x²+y² = c² = ${formatNum(c * c)}`,
          center.x + (c * state.scale) * 0.45,
          center.y + (c * state.scale) * 0.85 + 16
        );
        ctx.restore();

        // c >= b 일 때 4개의 직각 교점 가이드 점 표시
        if (c >= b && c > 0.01) {
          const cosT = Math.sqrt((c * c - b * b) / (c * c));
          const sinT = Math.sqrt(1 - cosT * cosT);
          const ix = a * cosT;
          const iy = b * sinT;
          [
            { x: ix, y: iy },
            { x: -ix, y: iy },
            { x: -ix, y: -iy },
            { x: ix, y: -iy }
          ].forEach((pt) => {
            drawChalkPoint(pt.x, pt.y, 3.8, '#38bdf8', '', { x: 0, y: 0 }, 0);
          });
        }
      }

      // Step 2: 삼각형 ΔPF'F 및 시야각 ∠F'PF (partIdx = 1, 2)
      const v1 = { x: F1.x - P.x, y: F1.y - P.y };
      const v2 = { x: F2.x - P.x, y: F2.y - P.y };
      const dPF = Math.hypot(v1.x, v1.y);
      const dPFp = Math.hypot(v2.x, v2.y);
      const cosAlpha = (v1.x * v2.x + v1.y * v2.y) / Math.max(1e-6, dPF * dPFp);
      const alphaRad = Math.acos(Math.min(1, Math.max(-1, cosAlpha)));
      const alphaDeg = (alphaRad * 180) / Math.PI;
      const area = 0.5 * Math.abs((F2.x - P.x) * (F1.y - P.y) - (F1.x - P.x) * (F2.y - P.y));

      if (state.steps[2]) {
        drawChalkLine(0,0,P.x,P.y,'#a78bfa',2,true,false,2);
        if (Math.abs(distance(P,{x:0,y:0})-c)<1e-8) {
          const mid=toScreen(P.x/2,P.y/2);
          ctx.save();ctx.fillStyle='#c4b5fd';ctx.font='bold 12px Pretendard';
          ctx.fillText(`OP=OF=OF'=c=${c.toFixed(2)}`,mid.x+6,mid.y+8);ctx.restore();
        }
      }
      if (state.steps[2]) {
        const sP = toScreen(P.x, P.y);
        const sF1 = toScreen(F1.x, F1.y);
        const sF2 = toScreen(F2.x, F2.y);
        ctx.save();
        ctx.globalAlpha = getPartAlpha(1, 1.0);
        ctx.beginPath();
        ctx.moveTo(sP.x, sP.y);
        ctx.lineTo(sF2.x, sF2.y);
        ctx.lineTo(sF1.x, sF1.y);
        ctx.closePath();
        ctx.fillStyle = Math.abs(alphaDeg - 90) < 1e-7 ? 'rgba(251, 191, 36, 0.22)' : 'rgba(52, 211, 153, 0.1)';
        ctx.fill();
        ctx.restore();

        drawChalkLine(F2.x, F2.y, F1.x, F1.y, '#94a3b8', 2.0, false, false, 1);
        drawChalkLine(F2.x, F2.y, P.x, P.y, '#f472b6', 2.8, false, true, 1);
        drawChalkLine(F1.x, F1.y, P.x, P.y, '#34d399', 2.8, false, true, 1);

        // ∠F'PF = 90° 근처이면 직각 네모 표시, 아니면 각도 호 표시
        if (Math.abs(alphaDeg - 90) < 1e-7) {
          drawRightAngleMark(P, v2, v1, 13, '#fbbf24', 1);
        } else if (dPF > 0.1 && dPFp > 0.1) {
          markAngle(P, F2, F1, '#fbbf24', '', 26, 1, 2); // [표시 보강] 각 호(값 ∠F'PF 는 바로 아래 글자에 표시)
        }

        ctx.save();
        ctx.globalAlpha = getPartAlpha(2, 1.0);
        ctx.font = 'bold 12.5px Pretendard';
        ctx.fillStyle = Math.abs(alphaDeg - 90) < 1e-7 ? '#fbbf24' : '#6ee7b7';
        ctx.fillText(
          `∠F'PF = ${alphaDeg.toFixed(1)}° | 넓이 S = ${area.toFixed(2)}`,
          sP.x - 65,
          sP.y + (P.y >= 0 ? 38 : -28)
        );
        ctx.restore();

        drawChalkPoint(F1.x, 0, 5.5, '#f43f5e', `F(${formatNum(c)}, 0)`, { x: -18, y: 22 }, 1);
        drawChalkPoint(F2.x, 0, 5.5, '#f43f5e', `F'(-${formatNum(c)}, 0)`, { x: -28, y: 22 }, 1);
      }

      // 내접원 I: 세 변 가중평균 / r=S/(a+c). 3변의 접점도 독립적인 수선의 발로 구한다.
      if (state.steps[3] && area > 1e-5) {
        const per=2*a+2*c;
        const I={x:(dPF*F2.x+dPFp*F1.x+2*c*P.x)/per,
                 y:(2*c*P.y)/per};
        const r=area/(a+c);
        drawCircleGeometry(I,r,'#a78bfa',2,false,2.1);
        const touchBase={x:I.x,y:0};
        const touchF1=footOnLine(I,P,{x:F1.x-P.x,y:F1.y-P.y});
        const touchF2=footOnLine(I,P,{x:F2.x-P.x,y:F2.y-P.y});
        [touchBase,touchF1,touchF2].forEach(pt=>drawChalkPoint(pt.x,pt.y,3.2,'#c4b5fd','',{x:0,y:0},2));
        drawChalkLine(I.x,I.y,touchBase.x,0,'#a78bfa',1.8,true,false,2);
        drawChalkPoint(I.x,I.y,4.1,'#a78bfa',`I (r=${r.toFixed(2)})`,{x:10,y:P.y>=0?-12:20},2);
      }
      if (state.steps[1] && c < b-1e-6) {
        drawCornerMessage(rect,'직각 교점 없음: c < b',`∠F'PF의 최댓값 ${(2*Math.atan2(c,b)*180/Math.PI).toFixed(1)}° < 90°  |  OP ≥ b > c`,'#fb7185');
      } else if (state.steps[1] && Math.abs(c-b)<1e-6) {
        drawCornerMessage(rect,'경계 c=b: 점 B, B′에서만 직각','지름이 F′F인 원과 타원이 B, B′에서 접합니다.','#fbbf24');
      }

      // Step 3: 하단 넓이 공식 증명 배너
      if (state.steps[3]) {
        const maxAngle = (2 * Math.atan2(c, b) * 180) / Math.PI;
        drawBottomHUD(
          rect,
          `∠F'PF = ${alphaDeg.toFixed(1)}° (∠F'PF의 최댓값 = ${maxAngle.toFixed(1)}°)  |  ΔPF'F 넓이 S = ½·PF'·PF·sinα ≈ ${area.toFixed(2)}`,
          `확인: S = b²·tan(∠F'PF / 2) = ${formatNum(b * b)} × tan(${(alphaDeg / 2).toFixed(1)}°) = ${area.toFixed(2)} (90°일 때 S = b² = ${formatNum(b * b)})`
        );
      }
    }

    // =========================================================================
    // [1-C 렌더링] 초점현 할선 & ΔPQF' 둘레 = 4a 불변
    // =========================================================================
    function renderSub1C(a, b, c, theta, F1, F2, rect) {
      const {P,Q}=ellipseFocalChord(a,b,c,theta);

      const dPFp = Math.hypot(P.x - F2.x, P.y - F2.y);
      const dPF = Math.hypot(P.x - F1.x, P.y - F1.y);
      const dQFp = Math.hypot(Q.x - F2.x, Q.y - F2.y);
      const dQF = Math.hypot(Q.x - F1.x, Q.y - F1.y);
      const dPQ = dPF + dQF;

      // Step 2: 삼각형 ΔPQF' 내부 색칠 및 F' 연결선
      if (state.steps[2]) {
        const sP = toScreen(P.x, P.y);
        const sQ = toScreen(Q.x, Q.y);
        const sF2 = toScreen(F2.x, F2.y);
        ctx.save();
        ctx.globalAlpha = getPartAlpha(2, 1.0);
        ctx.beginPath();
        ctx.moveTo(sF2.x, sF2.y);
        ctx.lineTo(sP.x, sP.y);
        ctx.lineTo(sQ.x, sQ.y);
        ctx.closePath();
        ctx.fillStyle = 'rgba(251, 191, 36, 0.11)';
        ctx.fill();
        ctx.restore();

        // 상단 쌍 (PF' + PF = 2a, partIdx = 0)
        drawChalkLine(F2.x, F2.y, P.x, P.y, '#f472b6', 2.8, false, true, 0);
        // 하단 쌍 (QF' + QF = 2a, partIdx = 1)
        drawChalkLine(F2.x, F2.y, Q.x, Q.y, '#38bdf8', 2.8, false, true, 1);
      }

      // Step 1: 초점 F를 지나는 할선 PQ (PF + QF)
      if (state.steps[1]) {
        drawChalkLine(F1.x, F1.y, P.x, P.y, '#f472b6', 3.0, false, true, 0);
        drawChalkLine(F1.x, F1.y, Q.x, Q.y, '#38bdf8', 3.0, false, true, 1);

        drawChalkPoint(F2.x, 0, 5.5, '#f43f5e', `F'(-${formatNum(c)}, 0)`, { x: -32, y: 22 });
        drawChalkPoint(F1.x, 0, 5.5, '#fbbf24', `F(${formatNum(c)}, 0)`, { x: 10, y: 22 });

        drawChalkPoint(P.x, P.y, 7.0, '#fbbf24', `P(${P.x.toFixed(2)}, ${P.y.toFixed(2)}) (끌어 보세요)`, getRadialOffset(P.x, P.y, 12, -140, -12, 22), 0);
        drawChalkPoint(Q.x, Q.y, 6.0, '#38bdf8', `Q(${Q.x.toFixed(2)}, ${Q.y.toFixed(2)})`, getRadialOffset(Q.x, Q.y, 12, -120, -12, 22), 1);
      }

      if(state.steps[3] && Math.abs(Math.sin(theta))>1e-4) {
        const Hp={x:P.x,y:0}, Hq={x:Q.x,y:0};
        drawPolygon([P,F1,Hp],'rgba(244,114,182,0.15)','#f472b6',2);
        drawPolygon([Q,F1,Hq],'rgba(56,189,248,0.14)','#38bdf8',2);
        drawRightAngleMark(Hp,{x:F1.x-Hp.x,y:0},{x:0,y:P.y},9,'#f472b6',2);
        drawRightAngleMark(Hq,{x:F1.x-Hq.x,y:0},{x:0,y:Q.y},9,'#38bdf8',2);
        // [표시 보강] AA 닮음의 근거인 맞꼭지각 ∠PFHₚ = ∠QFH_q 를 같은 색·같은 값으로 표시(P·F·Q는 한 직선)
        if (Math.abs(P.x - F1.x) > 0.12 && Math.abs(Q.x - F1.x) > 0.12) {
          // (좁은 화면에서는 이름표와 겹치므로 값 글자를 생략하고 같은 색·같은 호로 같은 각임을 보입니다)
          markAngle(F1, Hp, P, '#fbbf24', B.W >= 520 ? `${degBetween(F1, Hp, P).toFixed(1)}°` : '', 22, 1, 2);
          markAngle(F1, Hq, Q, '#fbbf24', B.W >= 520 ? `${degBetween(F1, Hq, Q).toFixed(1)}°` : '', 22, 1, 2);
        }
        // [표시 보강] Hₚ·H_q 이름표가 F 이름표와 겹치지 않게 F에 가까우면 한 줄 더 아래로
        drawChalkPoint(Hp.x,0,3,'#f472b6','Hₚ',{x:-12,y:Math.abs(Hp.x-F1.x)<1.1?40:22},2);
        drawChalkPoint(Hq.x,0,3,'#38bdf8','Hq',{x:-12,y:Math.abs(Hq.x-F1.x)<1.1?40:22},2);
        const ratio=distance(P,F1)/distance(Q,F1);
        const p=toScreen(0,0);ctx.save();ctx.font='bold 11px Pretendard';ctx.fillStyle='#f9a8d4';
        ctx.fillText(`AA 닮음  PF:QF = |yₚ|:|yq| = ${ratio.toFixed(3)}:1`,p.x-180,p.y+54);ctx.restore();
      }
      // Step 3: 하단 둘레 4a 불변 배너
      if (state.steps[3]) {
        const perim = dPFp + dQFp + dPQ;
        drawBottomHUD(
          rect,
          `[점 P에 대한 쌍] PF'(${dPFp.toFixed(2)})+PF(${dPF.toFixed(2)}) = ${formatNum(2 * a)}  |  [점 Q에 대한 쌍] QF'(${dQFp.toFixed(2)})+QF(${dQF.toFixed(2)}) = ${formatNum(2 * a)}`,
          `∴ ΔPQF' 둘레 = (PF'+PF) + (QF'+QF) = 4a = ${perim.toFixed(2)} (현 PQ의 길이 = ${dPQ.toFixed(2)})`
        );
      }
    }

    // =========================================================================
    // [2-A 렌더링] 동심원(보조원)과 이심각 매개변수 작도
    // =========================================================================
    function renderSub2A(a, b, c, theta, P, rect) {
      const center = toScreen(0, 0);
      const Q = { x: a * Math.cos(theta), y: a * Math.sin(theta) };
      const R = { x: b * Math.cos(theta), y: b * Math.sin(theta) };

      // Step 1: 동심원 C1(반지름 a), C2(반지름 b)
      if (state.steps[1]) {
        ctx.save();
        ctx.globalAlpha = getPartAlpha(0, 1.0);
        ctx.setLineDash([6, 5]);
        ctx.beginPath();
        ctx.arc(center.x, center.y, a * state.scale, 0, Math.PI * 2);
        ctx.strokeStyle = isPartEmphasized(0) ? '#38bdf8' : 'rgba(56, 189, 248, 0.7)';
        ctx.lineWidth = isPartEmphasized(0) ? 2.6 : 1.8;
        ctx.stroke();
        ctx.font = 'bold 11.5px Pretendard';
        ctx.fillStyle = '#38bdf8';
        ctx.fillText(
          `큰 원 x²+y²=${formatNum(a * a)} (반지름 a=${formatNum(a)})`,
          center.x + (a * state.scale) * 0.35,
          center.y + (a * state.scale) * 0.93 + 15
        );
        ctx.restore();

        ctx.save();
        ctx.globalAlpha = getPartAlpha(1, 1.0);
        ctx.setLineDash([6, 5]);
        ctx.beginPath();
        ctx.arc(center.x, center.y, b * state.scale, 0, Math.PI * 2);
        ctx.strokeStyle = isPartEmphasized(1) ? '#f472b6' : 'rgba(244, 114, 182, 0.7)';
        ctx.lineWidth = isPartEmphasized(1) ? 2.6 : 1.8;
        ctx.stroke();
        ctx.font = 'bold 11.5px Pretendard';
        ctx.fillStyle = '#f472b6';
        ctx.fillText(
          `작은 원 x²+y²=${formatNum(b * b)} (반지름 b=${formatNum(b)})`,
          center.x - (b * state.scale) * 0.85,
          center.y + (b * state.scale) * 0.85 + 15
        );
        ctx.restore();
      }

      // Step 2: 동경 각도 θ 직선 및 교점 Q, R
      if (state.steps[2]) {
        drawChalkLine(0,0,P.x,P.y,'#34d399',2.4,true,false,2);
        const phi=((Math.atan2(P.y,P.x)*180/Math.PI)+360)%360;
        const o=toScreen(0,0);
        ctx.save();ctx.fillStyle='#86efac';ctx.font='bold 11px Pretendard';
        ctx.fillText(`OP의 방향각 φ=${phi.toFixed(1)}° ≠ θ (일반적으로)`,o.x+40,o.y+55);ctx.restore();
        // [표시 보강] OP의 방향각 φ 호와 값 — 글에서 말하는 φ가 그림에 없었음(θ 호보다 바깥 반지름, 초록)
        if (phi > 1) {
          const phiR = phi * Math.PI / 180;
          ctx.save();ctx.beginPath();ctx.arc(o.x, o.y, 54, 0, -phiR, true);
          ctx.strokeStyle = '#34d399';ctx.lineWidth = 2.0;ctx.stroke();
          ctx.fillStyle = '#34d399';ctx.font = 'bold 12px Pretendard';ctx.textAlign = 'center';
          ctx.fillText(`φ=${phi.toFixed(0)}°`, o.x + Math.cos(phiR / 2) * 90, o.y - Math.sin(phiR / 2) * 90 + 4);
          ctx.restore();
        }
        drawChalkLine(0, 0, Q.x, Q.y, '#c084fc', 2.4, false, true);

        const normTheta = ((theta % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2);
        ctx.save();
        ctx.beginPath();
        ctx.arc(center.x, center.y, 30, 0, -normTheta, true);
        ctx.strokeStyle = '#facc15';
        ctx.lineWidth = 2.0;
        ctx.stroke();
        ctx.fillStyle = '#facc15';
        ctx.font = 'bold 12px Pretendard';
        const midAng = normTheta / 2;
        ctx.fillText(
          `θ=${Math.round((normTheta * 180) / Math.PI)}°`,
          center.x + Math.cos(midAng) * 42 - 14,
          center.y - Math.sin(midAng) * 42 + 4
        );
        ctx.restore();

        drawChalkPoint(
          Q.x,
          Q.y,
          5.8,
          '#38bdf8',
          `Q(${Q.x.toFixed(2)}, ${Q.y.toFixed(2)})`,
          getRadialOffset(Q.x, Q.y, 12, -122, -12, 22),
          0
        );
        drawChalkPoint(
          R.x,
          R.y,
          5.2,
          '#f472b6',
          `R(${R.x.toFixed(2)}, ${R.y.toFixed(2)})`,
          getRadialOffset(-R.x, R.y, 10, -118, -10, 20),
          1
        );
      }

      // Step 3: Q의 수직선 ∩ R의 수평선 = P(a cosθ, b sinθ)
      if (state.steps[3]) {
        drawChalkLine(Q.x, Q.y, Q.x, 0, 'rgba(56, 189, 248, 0.5)', 1.8, true, false, 0);
        drawChalkLine(R.x, R.y, 0, R.y, 'rgba(244, 114, 182, 0.5)', 1.8, true, false, 1);
        drawChalkLine(Q.x, Q.y, P.x, P.y, '#38bdf8', 2.5, false, false, 2);
        drawChalkLine(R.x, R.y, P.x, P.y, '#f472b6', 2.5, false, false, 2);

        if (Math.abs(Q.y - P.y) > 0.15 && Math.abs(P.x - R.x) > 0.15) {
          drawRightAngleMark(
            P,
            { x: R.x - P.x, y: 0 },
            { x: 0, y: Q.y - P.y },
            11,
            '#fbbf24',
            2
          );
        }

        drawBottomHUD(
          rect,
          `작도: x_P = x_Q = a·cosθ = ${P.x.toFixed(2)}  |  y_P = y_R = b·sinθ = ${P.y.toFixed(2)}`,
          `검산: ($\\frac{x_P}{a}$)² + ($\\frac{y_P}{b}$)² = cos²θ + sin²θ = 1.000`
        );
      }
    }

    // =========================================================================
    // [2-B 렌더링] 원에서 타원으로의 세로 방향 축소(b/a) & 내접삼각형 넓이 비
    // =========================================================================
    function renderSub2B(a, b, c, theta, P, rect) {
      const center = toScreen(0, 0);
      const t = state.fold; // 0: 원 상태, 1: 타원 축소 완료 상태
      const curRatio = 1 - t * (1 - b / a);

      // 원 위의 정삼각형 3꼭짓점 Q1, Q2, Q3 및 타원 대응점 P1, P2, P3
      const angles = [theta, theta + (2 * Math.PI) / 3, theta + (4 * Math.PI) / 3];
      const Qpts = angles.map((ang) => ({ x: a * Math.cos(ang), y: a * Math.sin(ang) }));
      const Ppts = angles.map((ang) => ({ x: a * Math.cos(ang), y: a * curRatio * Math.sin(ang) }));

      // Step 1: 큰 보조원 및 원 내접 정삼각형 ΔQ1Q2Q3 (partIdx = 0)
      if (state.steps[1]) {
        ctx.save();
        ctx.globalAlpha = getPartAlpha(0, 1.0);
        ctx.setLineDash([6, 5]);
        ctx.beginPath();
        ctx.arc(center.x, center.y, a * state.scale, 0, Math.PI * 2);
        ctx.strokeStyle = 'rgba(56, 189, 248, 0.65)';
        ctx.lineWidth = 1.8;
        ctx.stroke();

        const sQ = Qpts.map((pt) => toScreen(pt.x, pt.y));
        ctx.setLineDash([4, 4]);
        ctx.beginPath();
        ctx.moveTo(sQ[0].x, sQ[0].y);
        ctx.lineTo(sQ[1].x, sQ[1].y);
        ctx.lineTo(sQ[2].x, sQ[2].y);
        ctx.closePath();
        ctx.fillStyle = 'rgba(56, 189, 248, 0.08)';
        ctx.fill();
        ctx.strokeStyle = '#38bdf8';
        ctx.lineWidth = isPartEmphasized(0) ? 2.6 : 1.8;
        ctx.stroke();
        ctx.restore();

        Qpts.forEach((pt, i) => {
          drawChalkPoint(pt.x, pt.y, 4.5, '#38bdf8', `Q${i + 1}`, getRadialOffset(pt.x, pt.y, 8, -28, -8, 18), 0);
        });
      }

      // Step 2: y축 방향으로 (b/a)배 축소된 타원 내접삼각형 ΔP1P2P3 (partIdx = 1, 2)
      if (state.steps[2]) {
        const sP = Ppts.map((pt) => toScreen(pt.x, pt.y));
        ctx.save();
        ctx.globalAlpha = getPartAlpha(1, 1.0);
        ctx.beginPath();
        ctx.moveTo(sP[0].x, sP[0].y);
        ctx.lineTo(sP[1].x, sP[1].y);
        ctx.lineTo(sP[2].x, sP[2].y);
        ctx.closePath();
        ctx.fillStyle = 'rgba(251, 191, 36, 0.2)';
        ctx.fill();
        ctx.strokeStyle = '#fbbf24';
        ctx.lineWidth = isPartEmphasized(1) ? 3.2 : 2.5;
        ctx.stroke();
        ctx.restore();

        // Q_i -> P_i 수직 축소 연결선 (partIdx = 2)
        for (let i = 0; i < 3; i++) {
          drawChalkLine(Qpts[i].x, Qpts[i].y, Ppts[i].x, Ppts[i].y, '#f472b6', 2.0, true, false, 2);
          drawChalkPoint(Ppts[i].x, Ppts[i].y, 5.2, '#fbbf24', `P${i + 1}`, getRadialOffset(Ppts[i].x, Ppts[i].y, 10, -28, -10, 18), 1);
        }
      }

      if (state.steps[3]) {
        // 작은 인셋: 원판을 x축 주위로 기울였을 때 세로 높이가 cosγ배로 투영
        const w=140, h=93, x=Math.max(8,rect.width-w-12), y=Math.max(60,rect.height-h-16); // 2.0: 하단 요약 띠가 무대 밖으로 옮겨져 비워 두던 아래 여백을 줄임
        const proj=1-state.fold*(1-b/a), gamma=Math.acos(Math.min(1,proj));
        ctx.save();ctx.globalAlpha=getPartAlpha(2);ctx.fillStyle='rgba(5,28,26,.9)';
        ctx.strokeStyle='#38bdf8';ctx.beginPath();ctx.roundRect(x,y,w,h,9);ctx.fill();ctx.stroke();
        ctx.strokeStyle='#fbbf24';ctx.lineWidth=2.5;ctx.beginPath();ctx.ellipse(x+w/2,y+38,48,Math.max(1,48*proj*.62),0,0,Math.PI*2);ctx.stroke();
        ctx.fillStyle='#e0f2fe';ctx.font='bold 10.5px Pretendard';
        ctx.fillText(`기울어진 각 γ=${(gamma*180/Math.PI).toFixed(1)}°`,x+11,y+75);
        ctx.fillText(`cosγ=${proj.toFixed(3)}`,x+11,y+87);ctx.restore();
      }
      if(state.steps[3] && state.chordOverlay) {
        // 원의 현 중심-중점 수직 관계를 일차축소하여 타원 켤레지름 관계를 직접 보인다.
        const k=1-state.fold*(1-b/a),r=.48*a,phi=theta;
        const d={x:Math.cos(phi),y:Math.sin(phi)},u={x:-d.y,y:d.x};
        const half=Math.sqrt(a*a-r*r);
        const M0={x:r*d.x,y:r*d.y},E1={x:M0.x+half*u.x,y:M0.y+half*u.y},
          E2={x:M0.x-half*u.x,y:M0.y-half*u.y};
        const M={x:M0.x,y:k*M0.y},P1={x:E1.x,y:k*E1.y},P2={x:E2.x,y:k*E2.y};
        drawChalkLine(E1.x,E1.y,E2.x,E2.y,'#38bdf8',2,true,false,2);
        drawChalkLine(0,0,M0.x,M0.y,'#38bdf8',1.6,true,false,2);
        drawRightAngleMark(M0,{x:u.x,y:u.y},{x:-d.x,y:-d.y},9,'#38bdf8',2);
        drawChalkLine(P1.x,P1.y,P2.x,P2.y,'#fbbf24',3,false,true,2);
        drawChalkLine(0,0,M.x,M.y,'#f472b6',2.5,false,false,2);
        drawChalkPoint(M.x,M.y,5,'#f472b6','M (현 중점)',{x:8,y:16},2);
        const vec={x:P1.x-P2.x,y:P1.y-P2.y};
        const product=Math.abs(vec.x*M.x)>1e-8 ? (vec.y/vec.x)*(M.y/M.x) : null;
        const q=toScreen(M.x,M.y);ctx.save();ctx.fillStyle='#fcd34d';ctx.font='bold 11px Pretendard';
        ctx.fillText(`기울기의 곱 ≈ ${product===null?'축과 평행한 경우':product.toFixed(3)}  (현재 세로배율의 제곱에 −1을 곱한 값 ≈ ${(-(k*k)).toFixed(3)})`,q.x+10,q.y-26,250);
        ctx.restore();
      }

      // Step 3: 넓이 비 공식 검증 배너
      if (state.steps[3]) {
        const areaCircle = ((3 * Math.sqrt(3)) / 4) * a * a;
        const areaEllipse = areaCircle * (b / a);
        drawBottomHUD(
          rect,
          `원 내접 정삼각형 넓이 S_원 = (3√3/4)a² = ${areaCircle.toFixed(2)}  |  축소비 $\\frac{b}{a}$ = ${(b / a).toFixed(3)}`,
          `현재 세로배율 ${curRatio.toFixed(3)} → 현재 삼각형 넓이 ≈ ${(areaCircle*curRatio).toFixed(2)} · 축소 완료 때 타원 최댓값 ≈ ${areaEllipse.toFixed(2)}`
        );
      }
    }

    // =========================================================================
    // [2-C 렌더링] 보조원 접선과 타원 접선의 공용 x절편 T(a^2 / x1, 0)
    // =========================================================================
    function renderSub2C(a, b, c, theta, P, rect) {
      const center = toScreen(0, 0);
      const Q = { x: a * Math.cos(theta), y: a * Math.sin(theta) };
      const H = { x: P.x, y: 0 };

      // Step 1: 큰 보조원 및 수선의 발 H(x1, 0), Q, P 연결
      if (state.steps[1]) {
        ctx.save();
        ctx.globalAlpha = getPartAlpha(0, 1.0);
        ctx.setLineDash([6, 5]);
        ctx.beginPath();
        ctx.arc(center.x, center.y, a * state.scale, 0, Math.PI * 2);
        ctx.strokeStyle = 'rgba(56, 189, 248, 0.65)';
        ctx.lineWidth = 1.8;
        ctx.stroke();
        ctx.restore();

        drawChalkLine(0, 0, Q.x, Q.y, '#38bdf8', 2.2, false, false, 0);
        drawChalkLine(Q.x, Q.y, H.x, 0, '#f472b6', 2.2, true, false, 2);
        drawRightAngleMark(H, { x: -H.x, y: 0 }, { x: 0, y: Q.y }, 10, '#f472b6', 2);

        drawChalkPoint(Q.x, Q.y, 5.5, '#38bdf8', `Q(${Q.x.toFixed(2)}, ${Q.y.toFixed(2)})`, getRadialOffset(Q.x, Q.y, 10, -120, -12, 20), 0);
        drawChalkPoint(H.x, 0, 4.8, '#f472b6', `H(${H.x.toFixed(2)}, 0)`, { x: -28, y: P.y >= 0 ? 22 : -12 }, 2);
      }

      // Step 2: 공용 x절편 T(a^2 / x1, 0) 및 두 접선 QT, PT
      if (Math.abs(P.x) > 1e-9) {
        const xT = (a * a) / P.x;
        const T = { x: xT, y: 0 };

        if (state.steps[2]) {
          // 원 접선 QT (partIdx = 0) 및 직각 ∠OQT = 90°
          drawChalkLine(Q.x, Q.y, T.x, 0, '#38bdf8', 2.4, false, true, 0);
          drawRightAngleMark(Q, { x: -Q.x, y: -Q.y }, { x: T.x - Q.x, y: -Q.y }, 11, '#38bdf8', 0);

          // 타원 접선 PT (partIdx = 1)
          drawChalkLine(P.x, P.y, T.x, 0, '#fbbf24', 2.8, false, true, 1);

          drawChalkPoint(T.x, 0, 6.2, '#f43f5e', `x절편 T(${xT.toFixed(2)}, 0)`, { x: xT >= 0 ? -55 : -40, y: -16 }, 1);
        }

        if (state.steps[3]) {
          drawBottomHUD(
            rect,
            `직각삼각형 ΔOQT에서: OH(${Math.abs(P.x).toFixed(2)}) × OT(${Math.abs(xT).toFixed(2)}) = a²(${formatNum(a * a)})`,
            `∴ 원 접선과 타원 접선은 항상 같은 x절편 T($\\frac{a^2}{x_1}$, 0) = (${xT.toFixed(2)}, 0) 에서 만납니다!`
          );
        }
      } else {
        if (state.steps[2]) {
          drawChalkLine(-a * 1.25, Q.y, a * 1.25, Q.y, '#38bdf8', 2.4, false, true, 0);
          drawChalkLine(-a * 1.25, P.y, a * 1.25, P.y, '#fbbf24', 2.8, false, true, 1);
        }
        if (state.steps[3]) drawBottomHUD(
          rect,
          `x₁=0일 때만 두 접선이 x축과 평행합니다. x₁≠0이면 멀리 있는 공통 절편이 존재합니다.`,
          `점 P를 좌우로 조금 끌면 x절편 T($\\frac{a^2}{x_1}$, 0)가 나타납니다.`
        );
      }
    }

    // =========================================================================
    // [3-A 렌더링] 초점 대칭점 F'' 작도 & 중점연결정리 (OH1 = a)
    // =========================================================================
    function renderSub3A(a, b, c, theta, P, F1, F2, rect) {
      const nx = P.x / (a * a);
      const ny = P.y / (b * b);
      const nLen = Math.hypot(nx, ny);
      const unx = nx / nLen;
      const uny = ny / nLen;
      const utx = -uny;
      const uty = unx;

      // 초점 F1에서 접선에 내린 수선의 발 H1 및 대칭점 F''
      const evalF1 = (nx * F1.x + ny * F1.y - 1) / (nLen * nLen);
      const H1 = { x: F1.x - evalF1 * nx, y: F1.y - evalF1 * ny };
      const Fpp = { x: 2 * H1.x - F1.x, y: 2 * H1.y - F1.y }; // F''
      const d1 = Math.hypot(F1.x - H1.x, F1.y - H1.y);

      // 종이접기 회전 각도 보간 (강체 반사: H1을 중심으로 F1이 F''으로 반원 아크 회전 또는 대칭 이동)
      const fold = state.fold;
      // 3D 회전의 사영: 접선 방향으로 깊이 원근 오프셋을 주어 중간 프레임도 호로 이동한다.
      // 시작과 끝은 엄밀한 F와 F''이며, 중간은 3D 원호의 2D 투영이다.
      const normalDelta={x:F1.x-H1.x,y:F1.y-H1.y};
      const F_fold = {
        x: H1.x + normalDelta.x*Math.cos(fold*Math.PI) + utx*d1*.45*Math.sin(fold*Math.PI),
        y: H1.y + normalDelta.y*Math.cos(fold*Math.PI) + uty*d1*.45*Math.sin(fold*Math.PI)
      };

      const Q={x:P.x+utx*state.tangentQOffset, y:P.y+uty*state.tangentQOffset};
      if (state.steps[2] && fold >= 1-1e-9) {
        drawCircleGeometry(F2,2*a,'rgba(192,132,252,.70)',1,true,1.9);
        const val=distance(F2,Fpp);
        drawChalkLine(F2.x,F2.y,Fpp.x,Fpp.y,'rgba(251,191,36,.3)',1.4,true,false,1);
        const sp=toScreen(Fpp.x,Fpp.y);
        ctx.save();ctx.fillStyle='#c4b5fd';ctx.font='bold 11.5px Pretendard';
        ctx.fillText(`대칭점 F″: F'F″=${val.toFixed(2)}=2a`,sp.x-80,sp.y-24);ctx.restore();
      }
      // Step 1: 접선 l 및 수선의 발 H1 (정확한 내적 기반 직각 마크! [BUG-01 패치 완료])
      if (state.steps[1]) {
        const span = 10;
        drawChalkLine(P.x - utx * span, P.y - uty * span, P.x + utx * span, P.y + uty * span, '#94a3b8', 2.2, false, false);
        drawChalkLine(F1.x, F1.y, H1.x, H1.y, '#f472b6', 2.4, true, false, 0);
        drawChalkLine(F2.x, F2.y, F1.x, F1.y, 'rgba(251, 191, 36, 0.45)', 1.8, true, false);

        if (d1 > 0.05) {
          const dirToF1 = { x: (F1.x - H1.x) / d1, y: (F1.y - H1.y) / d1 };
          const sign1 = (P.x - H1.x) * utx + (P.y - H1.y) * uty >= 0 ? 1 : -1;
          const dirAlong1 = { x: sign1 * utx, y: sign1 * uty };
          drawRightAngleMark(H1, dirAlong1, dirToF1, 11, '#f472b6', 0);
        }

        drawChalkPoint(F2.x, 0, 5.5, '#f43f5e', `F'(-${formatNum(c)}, 0)`, { x: -32, y: 22 });
        drawChalkPoint(F1.x, 0, 5.5, '#f43f5e', `F(${formatNum(c)}, 0)`, { x: -16, y: 22 }, 0);
        drawChalkPoint(H1.x, H1.y, 5.0, '#f472b6', fold >= 1-1e-9 ? 'H₁ (중점)' : 'H₁ (수선의 발)', getRadialOffset(H1.x, H1.y, 10, -75, -10, 20), 0);
      }

      // Step 2: 대칭점 F'' 및 일직선 F' - P - F'' = 2a (partIdx = 0, 1)
      if (state.steps[2]) {
        drawPolygon([P,F1,H1],'rgba(244,114,182,.18)','#f472b6',0);
        drawPolygon([P,F_fold,H1],'rgba(192,132,252,.19)','#c084fc',0);
        // 2D로 투영된 회전 호: 접선선분 위 수축이 아니라 공간 회전 궤적
        ctx.save();ctx.beginPath();ctx.setLineDash([3,4]);
        for(let k=0;k<=30;k++){
          const t=k*Math.PI/30;
          const v=toScreen(H1.x+normalDelta.x*Math.cos(t)+utx*d1*.45*Math.sin(t),
                           H1.y+normalDelta.y*Math.cos(t)+uty*d1*.45*Math.sin(t));
          if(k===0)ctx.moveTo(v.x,v.y);else ctx.lineTo(v.x,v.y);
        }
        ctx.strokeStyle='#c084fc';ctx.lineWidth=1.4;ctx.stroke();ctx.restore();
        if(fold>=1-1e-9){
          const proof=distance(P,F1);
          // [표시 보강] 접기(대칭)로 같아진 두 각 ∠FPH₁ = ∠F″PH₁ 를 같은 색·같은 값으로, 합동의 같은 길이도 눈금으로 표시
          const eqDeg = degBetween(P, F1, H1);
          markAngle(P, F1, H1, '#f472b6', B.W >= 520 ? `${eqDeg.toFixed(1)}°` : '', 24, 1, 0);
          markAngle(P, Fpp, H1, '#f472b6', B.W >= 520 ? `${eqDeg.toFixed(1)}°` : '', 24, 1, 0);
          B.ticks([P.x, P.y], [F1.x, F1.y], { count: 3, color: '#fde047' });
          B.ticks([P.x, P.y], [Fpp.x, Fpp.y], { count: 3, color: '#fde047' });
          B.ticks([F1.x, F1.y], [H1.x, H1.y], { count: 2, color: '#f9a8d4' });
          B.ticks([H1.x, H1.y], [Fpp.x, Fpp.y], { count: 2, color: '#f9a8d4' });
        }
        // 원래의 PF (점선) & 접히는 중인 ΔPF_fold H1
        drawChalkLine(P.x, P.y, F1.x, F1.y, 'rgba(244, 114, 182, 0.45)', 2.0, true, false, 0);
        drawChalkLine(P.x, P.y, F_fold.x, F_fold.y, '#f472b6', 2.8, false, true, 0);
        drawChalkLine(H1.x, H1.y, F_fold.x, F_fold.y, '#f472b6', 2.4, false, false, 0);

        // 일직선 F' - P - F'' (partIdx = 1)
        drawChalkLine(F2.x, F2.y, P.x, P.y, '#fbbf24', 3.0, false, true, 1);
        if (fold >= 1-1e-9) {
          drawChalkLine(P.x, P.y, Fpp.x, Fpp.y, '#fbbf24', 3.0, false, true, 1);
        }

        drawChalkPoint(
          F_fold.x,
          F_fold.y,
          5.8,
          '#f472b6',
          fold >= 1-1e-9 ? `F″ (대칭점)` : `F (접기 ${Math.round(fold * 100)}%)`,
          getRadialOffset(F_fold.x, F_fold.y, 10, -135, -10, 20),
          1
        );
      }

      // Step 3: 삼각형 ΔF'FF''의 중점연결정리 OH1 = a (partIdx = 2)
      if (state.steps[3]) {
        const center = toScreen(0, 0);
        ctx.save();
        ctx.globalAlpha = getPartAlpha(2, 1.0);
        ctx.setLineDash([5, 5]);
        ctx.beginPath();
        ctx.arc(center.x, center.y, a * state.scale, 0, Math.PI * 2);
        ctx.strokeStyle = 'rgba(56, 189, 248, 0.5)';
        ctx.lineWidth = 1.6;
        ctx.stroke();
        ctx.restore();

        // 접선 위 두 번째 자유 점 Q: QF + QF' >= 2a, 접점일 때 등호.
        drawChalkLine(F2.x,F2.y,Q.x,Q.y,'#6ee7b7',2.0,true,false,1);
        drawChalkLine(F1.x,F1.y,Q.x,Q.y,'#fbbf24',2.0,true,false,1);
        drawChalkPoint(Q.x,Q.y,5.4,'#6ee7b7','Q (끌어 보세요)',{x:10,y:22},1);
        const qSum=distance(Q,F2)+distance(Q,F1);
        const qpt=toScreen(Q.x,Q.y);
        ctx.save();ctx.fillStyle='#6ee7b7';ctx.font='bold 11px Pretendard';
        ctx.fillText(`QF'+QF=${qSum.toFixed(2)} ≥ 2a=${(2*a).toFixed(2)}`,qpt.x+9,qpt.y-20);ctx.restore(); // [표시 보강] P 이름표와 겹치지 않게 Q 위쪽으로
        // 중점연결선 OH1 (길이 = a, F'F''과 평행!)
        drawChalkLine(0, 0, H1.x, H1.y, '#38bdf8', 3.4, false, true, 2);
        // [표시 보강] O는 F'F의 중점(F'O = OF), H₁은 FF″의 중점(FH₁ = H₁F″), OH₁ ∥ F'F″ 표시
        B.ticks([F2.x, F2.y], [0, 0], { count: 1, color: '#38bdf8' });
        B.ticks([0, 0], [F1.x, F1.y], { count: 1, color: '#38bdf8' });
        if (fold >= 1-1e-9) {
          B.ticks([F1.x, F1.y], [H1.x, H1.y], { count: 2, color: '#f9a8d4' });
          B.ticks([H1.x, H1.y], [Fpp.x, Fpp.y], { count: 2, color: '#f9a8d4' });
          parMark({ x: 0, y: 0 }, H1, '#38bdf8', 1);
          parMark(F2, Fpp, '#38bdf8', 1);
        }

        const midOH = toScreen(H1.x / 2, H1.y / 2);
        ctx.save();
        ctx.globalAlpha = getPartAlpha(2, 1.0);
        ctx.font = 'bold 12.5px Pretendard, monospace';
        ctx.fillStyle = '#38bdf8';
        ctx.fillText(`OH₁ = a = ${a.toFixed(2)}`, midOH.x + 8, midOH.y + 4);
        ctx.restore();

        const lenFpFpp = Math.hypot(Fpp.x - F2.x, Fpp.y - F2.y);
        const lenOH1 = Math.hypot(H1.x, H1.y);
        drawBottomHUD(
          rect,
          fold >= 1-1e-9 ? `[대칭 합동] F'P + PF = F'P + PF'' = 일직선 F'F'' = 2a = ${lenFpFpp.toFixed(2)}` : `접기 ${Math.round(fold*100)}% · 현재 표시점은 아직 대칭점 F″이 아닙니다`,
          fold >= 1-1e-9 ? `[중점연결정리] O는 F'F 중점, H₁은 FF'' 중점 ⇒ OH₁ = ½·F'F'' = a = ${lenOH1.toFixed(2)}` : '접기 100%에서 합동과 중점 표시를 확인하세요. 수선의 발 H₁은 접는 동안 고정됩니다.'
        );
      }
    }

    // =========================================================================
    // [3-B 렌더링] 접선과 두 초점 수선의 곱 (d1 * d2 = b^2) - [BUG-01 완벽 수정]
    // =========================================================================
    function renderSub3B(a, b, c, theta, P, F1, F2, rect) {
      const nx = P.x / (a * a);
      const ny = P.y / (b * b);
      const nLen = Math.hypot(nx, ny);
      const unx = nx / nLen;
      const uny = ny / nLen;
      const utx = -uny;
      const uty = unx;

      const evalF1 = (nx * F1.x + ny * F1.y - 1) / (nLen * nLen);
      const H1 = { x: F1.x - evalF1 * nx, y: F1.y - evalF1 * ny };
      const d1 = Math.hypot(F1.x - H1.x, F1.y - H1.y);

      const evalF2 = (nx * F2.x + ny * F2.y - 1) / (nLen * nLen);
      const H2 = { x: F2.x - evalF2 * nx, y: F2.y - evalF2 * ny };
      const d2 = Math.hypot(F2.x - H2.x, F2.y - H2.y);

      // Step 3: 보조원 x^2 + y^2 = a^2 및 대칭점 H1'(-H1.x, -H1.y) (partIdx = 2)
      if (state.steps[3]) {
        const center = toScreen(0, 0);
        ctx.save();
        ctx.globalAlpha = getPartAlpha(2, 1.0);
        ctx.beginPath();
        ctx.setLineDash([5, 5]);
        ctx.arc(center.x, center.y, a * state.scale, 0, Math.PI * 2);
        ctx.strokeStyle = isPartEmphasized(2) ? '#fbbf24' : 'rgba(251, 191, 36, 0.55)';
        ctx.lineWidth = 1.9;
        ctx.stroke();
        ctx.font = 'bold 11.5px Pretendard';
        ctx.fillStyle = '#fde047';
        ctx.fillText(
          `원 x²+y² = a² = ${formatNum(a * a)} (H₁, H₂가 놓인 원)`,
          center.x + (a * state.scale) * 0.3,
          center.y + (a * state.scale) * 0.92 + 15
        );
        ctx.restore();

        // H1의 원점 대칭점 H1' (지름 H1 - O - H1' => F'H1' = d1 이고 H2 - F' - H1' 일직선!)
        const H1p = { x: -H1.x, y: -H1.y };
        drawPolygon([{x:0,y:0},F1,H1],'rgba(244,114,182,.14)','#f472b6',2);
        drawPolygon([{x:0,y:0},F2,H1p],'rgba(192,132,252,.16)','#c084fc',2);
        drawChalkLine(H2.x,H2.y,H1p.x,H1p.y,'#fbbf24',2,true,false,2);
        // ∠H₁H₂H₁′=90° (지름 H₁H₁′) — 원주각 꼭짓점은 H₂
        drawRightAngleMark(H2,{x:H1.x-H2.x,y:H1.y-H2.y},
                               {x:H1p.x-H2.x,y:H1p.y-H2.y},10,'#fbbf24',2);
        drawChalkLine(-a,0,a,0,'#fbbf24',2.0,false,false,2);
        drawChalkPoint(-a,0,3.4,'#fbbf24','A′',{x:-16,y:20},2);
        drawChalkPoint(a,0,3.4,'#fbbf24','A',{x:7,y:20},2);
        drawChalkLine(H1.x, H1.y, H1p.x, H1p.y, 'rgba(251, 191, 36, 0.45)', 1.6, true, false, 2);
        drawChalkLine(F2.x, F2.y, H1p.x, H1p.y, '#fbbf24', 2.2, true, false, 2);
        drawChalkPoint(H1p.x, H1p.y, 4.2, '#fbbf24', `H₁' (F'H₁'=d₁)`, getRadialOffset(H1p.x, H1p.y, 8, -95, -8, 18), 2);
      }

      // Step 1: 접선 l 및 두 초점 F, F'
      if (state.steps[1]) {
        const span = 11;
        drawChalkLine(P.x - utx * span, P.y - uty * span, P.x + utx * span, P.y + uty * span, '#38bdf8', 2.6, false, true);
        drawChalkPoint(F1.x, 0, 5.5, '#f43f5e', `F(${formatNum(c)}, 0)`, { x: -16, y: 22 });
        drawChalkPoint(F2.x, 0, 5.5, '#f43f5e', `F'(-${formatNum(c)}, 0)`, { x: -24, y: 22 });
      }

      // Step 2: 수선의 발 H1, H2 및 수선 d1, d2 (내적 투영 부호로 직각 마크 100% 정합성 보장!)
      if (state.steps[2]) {
        drawChalkLine(F1.x, F1.y, H1.x, H1.y, '#f472b6', 2.8, false, true, 0);
        drawChalkLine(F2.x, F2.y, H2.x, H2.y, '#34d399', 2.8, false, true, 1);

        if (d1 > 0.05) {
          const dirToF1 = { x: (F1.x - H1.x) / d1, y: (F1.y - H1.y) / d1 };
          const sign1 = (P.x - H1.x) * utx + (P.y - H1.y) * uty >= 0 ? 1 : -1;
          const dirAlong1 = { x: sign1 * utx, y: sign1 * uty };
          drawRightAngleMark(H1, dirAlong1, dirToF1, 11, '#f472b6', 0);
        }
        if (d2 > 0.05) {
          const dirToF2 = { x: (F2.x - H2.x) / d2, y: (F2.y - H2.y) / d2 };
          const sign2 = (P.x - H2.x) * utx + (P.y - H2.y) * uty >= 0 ? 1 : -1;
          const dirAlong2 = { x: sign2 * utx, y: sign2 * uty };
          drawRightAngleMark(H2, dirAlong2, dirToF2, 11, '#34d399', 1);
        }

        // H1, H2가 P와 겹치지 않도록 동적 오프셋 부여
        drawChalkPoint(H1.x, H1.y, 4.8, '#f472b6', `H₁ (d₁=${d1.toFixed(2)})`, getRadialOffset(H1.x, H1.y, 10, -108, -10, 20), 0);
        drawChalkPoint(H2.x, H2.y, 4.8, '#34d399', `H₂ (d₂=${d2.toFixed(2)})`, getRadialOffset(H2.x, H2.y, 10, -108, -10, 20), 1);
      }

      if (state.steps[3]) {
        drawBottomHUD(
          rect,
          `확인: d₁(${d1.toFixed(2)}) × d₂(${d2.toFixed(2)}) = ${(d1 * d2).toFixed(3)} = b²(${formatNum(b * b)})`,
          `원리: 점 F'을 지나는 현 H₂H₁'에서 d₁·d₂ = (a-c)(a+c) = a² - c² = b²`
        );
      }
    }

    // =========================================================================
    // [4-A 렌더링] 법선(내각 이등분선 N) - [BUG-03 & BUG-05 완벽 패치]
    // =========================================================================
    function renderSub4A(a, b, c, theta, P, F1, F2, rect) {
      const nx = P.x / (a * a);
      const ny = P.y / (b * b);
      const nLen = Math.hypot(nx, ny);
      const inNx = -nx / nLen;
      const inNy = -ny / nLen;
      const utx = -inNy;
      const uty = inNx;

      // 법선의 x절편 N: x_N = (c^2 / a^2) * x_P
      const xN = ((c * c) / (a * a)) * P.x;
      const N = { x: xN, y: 0 };

      const dPFp = Math.hypot(P.x - F2.x, P.y - F2.y);
      const dPF = Math.hypot(P.x - F1.x, P.y - F1.y);
      const dFpN = Math.abs(xN - F2.x);
      const dNF = Math.abs(F1.x - xN);

      const isDegenerate = Math.abs(P.y) < 1e-9;

      // Step 1: 선분 F'P 및 FP 연결 (partIdx = 0)
      if (state.steps[1]) {
        drawChalkLine(F2.x, F2.y, P.x, P.y, '#f472b6', 2.8, false, true, 0);
        drawChalkLine(P.x, P.y, F1.x, F1.y, '#34d399', 2.8, false, true, 0);

        if (!isDegenerate) {
          const midFp = toScreen((F2.x + P.x) / 2, (F2.y + P.y) / 2);
          const midF = toScreen((F1.x + P.x) / 2, (F1.y + P.y) / 2);
          ctx.save();
          ctx.globalAlpha = getPartAlpha(0, 1.0);
          ctx.font = 'bold 12.5px Pretendard, monospace';
          ctx.fillStyle = '#f9a8d4';
          ctx.fillText(`PF' = ${dPFp.toFixed(2)}`, midFp.x - 75, midFp.y - 8);
          ctx.fillStyle = '#6ee7b7';
          ctx.fillText(`PF = ${dPF.toFixed(2)}`, midF.x + 10, midF.y - 8);
          ctx.restore();
        }

        drawChalkPoint(F2.x, 0, 6, '#ec4899', `F'(-${formatNum(c)}, 0)`, { x: -32, y: 24 }, 0);
        drawChalkPoint(F1.x, 0, 6, '#10b981', `F(${formatNum(c)}, 0)`, { x: -16, y: 24 }, 0);
      }

      // Step 2: 점 P에서의 접선 및 수직 법선 PN 표시 (partIdx = 1)
      if (state.steps[2]) {
        const span = 7.5;
        drawChalkLine(P.x - utx * span, P.y - uty * span, P.x + utx * span, P.y + uty * span, 'rgba(148, 163, 184, 0.65)', 1.8, true, false, 1);

        if (!isDegenerate) {
          drawChalkLine(P.x - inNx * 2.0, P.y - inNy * 2.0, P.x + inNx * 5.8, P.y + inNy * 5.8, 'rgba(56, 189, 248, 0.4)', 1.7, true, false, 1);
          drawChalkLine(P.x, P.y, N.x, N.y, '#38bdf8', 3.0, false, true, 1);
          drawRightAngleMark(P, { x: utx, y: uty }, { x: inNx, y: inNy }, 11, '#38bdf8', 1);

          // [BUG-05 해결] N 라벨을 P 반대편(x축 아래 또는 위)으로 배치하여 각의 이등분선 텍스트와 절대 겹치지 않게 함
          const nOffsetY = P.y >= 0 ? 24 : -14;
          drawChalkPoint(N.x, 0, 5.5, '#38bdf8', `N(${N.x.toFixed(2)}, 0)`, { x: -32, y: nOffsetY }, 1);
        }
      }

      // 외각 이등분선 T 및 F의 접선대칭점 F'' (x_P≈0에서는 평행접선: 유한한 T 없음)
      const canShowT=Math.abs(P.x)>1e-9 && !isDegenerate;
      const T=canShowT?{x:a*a/P.x,y:0}:null;
      const unit={x:utx,y:uty};
      const {H:Ht,reflection:Fpp}=reflectAcrossLine(F1,P,unit);
      if(state.steps[2] && !isDegenerate) {
        drawChalkLine(P.x,P.y,Fpp.x,Fpp.y,'#c084fc',2.0,true,false,2);
        drawChalkPoint(Fpp.x,Fpp.y,4.2,'#c084fc','F″',{x:9,y:-15},2);
        if(canShowT){
          // x 절편이 멀리 있을 때는 수학적 연결선 그대로 그리되 브라우저 경계에 캔버스가 clip한다.
          drawChalkLine(P.x,P.y,T.x,0,'#fbbf24',2.9,false,true,2);
          drawChalkPoint(T.x,0,5.2,'#fbbf24',`T(${T.x.toFixed(2)},0)`,{x:T.x<0?-83:10,y:-15},2);
          drawRightAngleMark(P,{x:T.x-P.x,y:-P.y},{x:N.x-P.x,y:-P.y},13,'#fbbf24',2);
        }
      }
      if(state.steps[3] && !isDegenerate) {
        if(canShowT){
          // 실제 접선의 양쪽 반직선 중 F 및 F''가 이루는 작은 각 각각 작도
          // [표시 보강] 외각의 이등분: ∠FPT = ∠F″PT — 같은 색·같은 이중 호와 각도 값(법선 쪽 내각과는 다른 표시)
          const extDeg = degBetween(P, F1, T);
          markAngle(P, F1, T, '#fbbf24', B.W >= 520 ? `${extDeg.toFixed(1)}°` : '', 46, 2, 2);
          markAngle(P, T, Fpp, '#fbbf24', B.W >= 520 ? `${extDeg.toFixed(1)}°` : '', 46, 2, 2);
          const extRatio=distance(F2,T)/Math.max(1e-9,distance(F1,T));
          const intRatio=dFpN/Math.max(1e-9,dNF);
          const sP=toScreen(P.x,P.y);ctx.save();ctx.fillStyle='#fcd34d';ctx.font='bold 12px Pretendard';
          ctx.fillText(`접선 F′T:TF = ${extRatio.toFixed(3)}:1`,sP.x-70,sP.y+86); // [표시 보강] 각도 값 표시와 겹치지 않게 아래로
          ctx.fillText(`법선 F′N:NF = ${intRatio.toFixed(3)}:1`,sP.x-70,sP.y+102);ctx.restore();
        }else{
          drawCornerMessage(rect,'접선이 x축과 만나지 않음', 'P가 단축 꼭짓점이면 접선은 x축과 평행합니다.','#fbbf24');
        }
      }

      // Step 3: 각의 이등분선 아크(α = α) & 밑변 내분비 독립 계산 검증 ([BUG-03 해결])
      if (state.steps[3]) {
        // 하위 스텝이 꺼져 있어도 최소 기준선을 은은하게 유지 ([BUG-09 해결])
        if (!state.steps[1]) {
          drawChalkLine(F2.x, F2.y, P.x, P.y, 'rgba(244, 114, 182, 0.3)', 1.5, true);
          drawChalkLine(P.x, P.y, F1.x, F1.y, 'rgba(52, 211, 153, 0.3)', 1.5, true);
        }

        if (!isDegenerate) {
          const pScreen = toScreen(P.x, P.y);
          const angNormal = Math.atan2(-inNy, inNx);
          const angF2 = Math.atan2(-(F2.y - P.y), F2.x - P.x);
          const angF1 = Math.atan2(-(F1.y - P.y), F1.x - P.x);

          const vF2 = { x: F2.x - P.x, y: F2.y - P.y };
          const lF2 = Math.hypot(vF2.x, vF2.y);
          const cosAlpha = (vF2.x * inNx + vF2.y * inNy) / Math.max(1e-6, lF2);
          const alphaDeg = (Math.acos(Math.min(1, Math.max(-1, cosAlpha))) * 180) / Math.PI;

          ctx.save();
          ctx.globalAlpha = getPartAlpha(1, 1.0);
          ctx.lineWidth = 2.2;
          // [표시 보강] 법선이 이등분한 두 각은 같은 색·같은 반지름의 호로 그려 '같은 각'임이 보이게 함(이전: 분홍/초록, 반지름 다름)
          ctx.strokeStyle = '#38bdf8';
          ctx.beginPath();
          ctx.arc(pScreen.x, pScreen.y, 30, angNormal, angF2, isCounterClockwise(angNormal, angF2));
          ctx.stroke();

          ctx.strokeStyle = '#38bdf8';
          ctx.beginPath();
          ctx.arc(pScreen.x, pScreen.y, 30, angNormal, angF1, isCounterClockwise(angNormal, angF1));
          ctx.stroke();

          // 각도 텍스트를 점 P의 외곽 법선 방향(위쪽)에 배치하여 점 N과 완전히 분리
          ctx.font = 'bold 12px Pretendard';
          ctx.fillStyle = '#38bdf8';
          ctx.fillText(
            `∠F'PN = ∠FPN = ${alphaDeg.toFixed(1)}° (내각 이등분)`,
            pScreen.x - 85,
            pScreen.y + (P.y >= 0 ? -28 : 38)
          );
          ctx.restore();

          // [표시 보강] 두 각의 값을 각 안쪽(호 바로 바깥)에 같은 글자로 표시
          const inN = { x: P.x + inNx, y: P.y + inNy };
          if (B.W >= 520) { // 좁은 화면(휴대폰)에서는 값 글자를 생략하고(위 글줄에 같은 값이 있음) 호의 색·크기로 같은 각임을 보입니다
            angleText(P, inN, F2, `${alphaDeg.toFixed(1)}°`, '#7dd3fc', 46, 1);
            angleText(P, inN, F1, `${alphaDeg.toFixed(1)}°`, '#7dd3fc', 46, 1);
          }

          // x축 밑변 F'N 및 NF 구간 하이라이트 (partIdx = 2)
          drawChalkLine(F2.x, 0, N.x, 0, '#f472b6', 4.2, false, false, 2);
          drawChalkLine(N.x, 0, F1.x, 0, '#34d399', 4.2, false, false, 2);

          // 광학 반사 레이저 애니메이션 포인트
          const t = state.laserProgress;
          let lx, ly;
          if (t < 0.5) {
            const u = t * 2;
            lx = F2.x + (P.x - F2.x) * u;
            ly = F2.y + (P.y - F2.y) * u;
          } else {
            const u = (t - 0.5) * 2;
            lx = P.x + (F1.x - P.x) * u;
            ly = P.y + (F1.y - P.y) * u;
          }
          drawChalkPoint(lx, ly, 5.2, '#fef08a', '', { x: 0, y: 0 });
        }

        const ratioPF = dPF > 0.01 ? (dPFp / dPF).toFixed(2) : '-';
        const ratioFN = dNF > 0.01 ? (dFpN / dNF).toFixed(2) : '-';
        drawBottomHUD(
          rect,
          `[측정값 비교] 두 초점까지의 거리의 비 PF' : PF = ${ratioPF} : 1  ===  F'N : NF = ${ratioFN} : 1`,
          `측정 길이: PF'=${dPFp.toFixed(2)}, PF=${dPF.toFixed(2)}  |  F'N=${dFpN.toFixed(2)}, NF=${dNF.toFixed(2)} (x_N = e²x₁ = ${xN.toFixed(2)})`
        );
      }
    }

    // =========================================================================
    // [4-B 렌더링] 직교하는 두 접선의 자취 — 몬쥬의 원 (준원 x^2 + y^2 = a^2 + b^2)
    // =========================================================================
    function renderSub4B(a, b, c, theta, rect) {
      const center = toScreen(0, 0);
      const R_dir = Math.sqrt(a * a + b * b);
      const M = { x: R_dir * Math.cos(theta), y: R_dir * Math.sin(theta) };

      // 아핀 변환을 통한 점 M에서 타원에 그은 두 접선의 정확한 접점 T1, T2 해석적 도출
      const X0 = M.x / a;
      const Y0 = M.y / b;
      const D2 = X0 * X0 + Y0 * Y0;
      const rootD = Math.sqrt(Math.max(0, D2 - 1));

      const T1 = {
        x: a * ((X0 - Y0 * rootD) / D2),
        y: b * ((Y0 + X0 * rootD) / D2)
      };
      const T2 = {
        x: a * ((X0 + Y0 * rootD) / D2),
        y: b * ((Y0 - X0 * rootD) / D2)
      };

      // Step 1: 외접 직사각형 (2a x 2b) 및 꼭짓점 (±a, ±b) (partIdx = 2)
      if (state.steps[1]) {
        const tl = toScreen(-a, b);
        const br = toScreen(a, -b);
        ctx.save();
        ctx.globalAlpha = getPartAlpha(2, 1.0);
        ctx.strokeStyle = 'rgba(56, 189, 248, 0.45)';
        ctx.lineWidth = 1.6;
        ctx.setLineDash([6, 5]);
        ctx.strokeRect(tl.x, tl.y, br.x - tl.x, br.y - tl.y);
        ctx.restore();

        drawChalkPoint(a, b, 4.2, '#38bdf8', `(${formatNum(a)}, ${formatNum(b)})`, { x: 8, y: -8 }, 2);
        drawChalkPoint(-a, b, 4.2, '#38bdf8', `(-${formatNum(a)}, ${formatNum(b)})`, { x: -75, y: -8 }, 2);
      }

      // Step 2: 몬쥬의 원 / 준원 x^2 + y^2 = a^2 + b^2 (partIdx = 0)
      if (state.steps[2]) {
        ctx.save();
        ctx.globalAlpha = getPartAlpha(0, 1.0);
        ctx.setLineDash([7, 5]);
        ctx.beginPath();
        ctx.arc(center.x, center.y, R_dir * state.scale, 0, Math.PI * 2);
        ctx.strokeStyle = isPartEmphasized(0) ? '#c084fc' : 'rgba(192, 132, 252, 0.8)';
        ctx.lineWidth = isPartEmphasized(0) ? 2.8 : 2.0;
        ctx.stroke();

        ctx.font = 'bold 12px Pretendard';
        ctx.fillStyle = '#c084fc';
        ctx.fillText(
          `점 M의 자취 x²+y² = a²+b² = ${formatNum(a * a + b * b)}`,
          center.x + (R_dir * state.scale) * 0.25,
          center.y + (R_dir * state.scale) * 0.93 + 16
        );
        ctx.restore();

        drawChalkLine(0, 0, M.x, M.y, 'rgba(192, 132, 252, 0.55)', 2.0, true, false, 0);
      }

      if(state.steps[1]){
        const V={x:a,y:b}, A={x:a,y:0};
        drawPolygon([{x:0,y:0},A,V],'rgba(56,189,248,.13)','#38bdf8',2);
        drawChalkLine(0,0,a,0,'#38bdf8',2,false,false,2);
        drawChalkLine(a,0,a,b,'#38bdf8',2,false,false,2);
        drawRightAngleMark(A,{x:-a,y:0},{x:0,y:b},12,'#fbbf24',2);
        const v=toScreen(a/2,b/2);ctx.save();ctx.font='bold 12px Pretendard';ctx.fillStyle='#bae6fd';
        ctx.fillText(`OV=√(a²+b²)=${R_dir.toFixed(2)}`,v.x+5,v.y-11);ctx.restore();
      }
      if(state.steps[2] && state.steps[3]){
        // 정확한 합동 직각삼각형 증명: O에서 두 직교 접선까지 수선의 발 K₁,K₂를 내린다.
        // O-K₁-M-K₂는 직사각형. 접선의 지지함수 거리 합 h₁²+h₂²=a²+b².
        const O={x:0,y:0};
        const d1={x:T1.x-M.x,y:T1.y-M.y},d2={x:T2.x-M.x,y:T2.y-M.y};
        const K1=footOnLine(O,M,d1),K2=footOnLine(O,M,d2);
        drawPolygon([O,K1,M,K2],'rgba(167,139,250,.12)','#a78bfa',1);
        drawChalkLine(0,0,K1.x,K1.y,'#c084fc',2.2,false,false,1);
        drawChalkLine(0,0,K2.x,K2.y,'#c084fc',2.2,false,false,1);
        drawRightAngleMark(K1,{x:-K1.x,y:-K1.y},{x:M.x-K1.x,y:M.y-K1.y},10,'#a78bfa',1);
        drawRightAngleMark(K2,{x:-K2.x,y:-K2.y},{x:M.x-K2.x,y:M.y-K2.y},10,'#a78bfa',1);
        drawRightAngleMark(O,{x:K1.x,y:K1.y},{x:K2.x,y:K2.y},10,'#a78bfa',1); // [표시 보강] 직사각형 OK₁MK₂ 의 네 번째 직각(O)
        drawChalkPoint(K1.x,K1.y,3.7,'#a78bfa','K₁',{x:8,y:-9},1);
        drawChalkPoint(K2.x,K2.y,3.7,'#a78bfa','K₂',{x:8,y:-9},1);
        // 추가 연결: 첫 접선에 비춘 초점 F, 그 반사점은 F′ 중심 반지름 2a의 원 위
        const F={x:c,y:0};
        const {reflection:Fpp}=reflectAcrossLine(F,T1,{x:d1.x/distance(M,T1),y:d1.y/distance(M,T1)});
        if(Number.isFinite(Fpp.x) && Number.isFinite(Fpp.y)){
          drawChalkPoint(Fpp.x,Fpp.y,3.6,'#c084fc','F″',{x:8,y:-12},1);
          drawChalkLine(-c,0,Fpp.x,Fpp.y,'rgba(192,132,252,.55)',1.3,true,false,1);
        }
        const s=toScreen(M.x,M.y);ctx.save();ctx.fillStyle='#c4b5fd';ctx.font='bold 11px Pretendard';
        ctx.fillText(`OK₁²+OK₂²=${(distance(O,K1)**2+distance(O,K2)**2).toFixed(2)}=a²+b²`,s.x-100,s.y+90);ctx.restore(); // [표시 보강] OV 라벨과 겹치지 않게 아래로
      }

      // Step 3: 점 M에서 타원에 그은 두 직교 접선 MT1, MT2 및 90° 마크 (partIdx = 1)
      if (state.steps[3]) {
        const v1 = { x: T1.x - M.x, y: T1.y - M.y };
        const v2 = { x: T2.x - M.x, y: T2.y - M.y };

        // 접선을 접점 너머까지 살짝 연장하여 시각적 완성도 향상
        drawChalkLine(M.x, M.y, T1.x + v1.x * 0.35, T1.y + v1.y * 0.35, '#fbbf24', 2.8, false, true, 1);
        drawChalkLine(M.x, M.y, T2.x + v2.x * 0.35, T2.y + v2.y * 0.35, '#34d399', 2.8, false, true, 1);

        drawRightAngleMark(M, v1, v2, 13, '#fbbf24', 1);

        drawChalkPoint(T1.x, T1.y, 5.2, '#fbbf24', `T₁`, getRadialOffset(T1.x, T1.y, 8, -24, -8, 18), 1);
        drawChalkPoint(T2.x, T2.y, 5.2, '#34d399', `T₂`, getRadialOffset(T2.x, T2.y, 8, -24, -8, 18), 1);

        // 실제 내적으로 두 접선 사이 각도 계산 (항상 90.0°)
        const dot = (v1.x * v2.x + v1.y * v2.y) / (Math.hypot(v1.x, v1.y) * Math.hypot(v2.x, v2.y));
        const angDeg = (Math.acos(Math.min(1, Math.max(-1, dot))) * 180) / Math.PI;

        drawBottomHUD(
          rect,
          `두 접선 사이 각도 ∠T₁MT₂ = ${angDeg.toFixed(1)}° (수직)  |  원점까지의 거리 OM = √(a²+b²) = √${formatNum(a * a + b * b)} ≈ ${R_dir.toFixed(2)}`,
          `점 M(${M.x.toFixed(2)}, ${M.y.toFixed(2)})  ⇒  x_M² + y_M² = ${(M.x * M.x + M.y * M.y).toFixed(2)} = a²(${formatNum(a * a)}) + b²(${formatNum(b * b)})`
        );
      }

      drawChalkPoint(
        M.x,
        M.y,
        7.5,
        '#c084fc',
        `점 M(${M.x.toFixed(2)}, ${M.y.toFixed(2)})`,
        getRadialOffset(M.x, M.y, 12, -145, -12, 22),
        0
      );
    }

    function isCounterClockwise(a1, a2) {
      let diff = a2 - a1;
      while (diff < -Math.PI) diff += Math.PI * 2;
      while (diff > Math.PI) diff -= Math.PI * 2;
      return diff < 0;
    }

  /* ======================================================================
     ↑↑↑ 원본 그대로 끝.  ↓↓↓ 2.0 셸 연결 (새로 작성한 부분)
     ====================================================================== */
  const normTheta = (t) => ((t % TAU) + TAU) % TAU;
  const cOf = (a, b) => Math.sqrt(Math.max(0, a * a - b * b));

  // 원본 monitor(updateLiveMonitor)의 수식 그대로, 화면 갱신 대신 '지금 보이는 값' 행을 돌려줍니다.
  function monitorRows(a, b, c, geometry, F1, F2) {
    const rows = [];
    const row = (label, value, color) => rows.push({ label, value, color, wide: true });
    if (geometry.kind === 'orthogonal-tangents') {
      const { M, T1, T2 } = geometry;
      const v1 = { x: T1.x - M.x, y: T1.y - M.y }, v2 = { x: T2.x - M.x, y: T2.y - M.y };
      const angle = Math.acos(Math.max(-1, Math.min(1, dot(v1, v2) / (distance(M, T1) * distance(M, T2))))) * 180 / Math.PI;
      row('점 M의 좌표', `M(${M.x.toFixed(2)}, ${M.y.toFixed(2)})`, 'amber');
      row('OM² = a²+b²', `OM²=${(M.x * M.x + M.y * M.y).toFixed(2)} = ${(a * a + b * b).toFixed(2)}`, 'rose');
      row('두 접선이 이루는 각', `∠T₁MT₂=${angle.toFixed(2)}°`, 'sky');
      row('접점 T₁ / T₂의 좌표', `T₁(${T1.x.toFixed(2)},${T1.y.toFixed(2)}) · T₂(${T2.x.toFixed(2)},${T2.y.toFixed(2)})`, 'violet');
      return rows;
    }
    const P = geometry.P;
    const dPF = distance(P, F1), dPFp = distance(P, F2);
    const n = { x: P.x / (a * a), y: P.y / (b * b) }, nLen = Math.hypot(n.x, n.y);
    const d1 = Math.abs(n.x * F1.x + n.y * F1.y - 1) / nLen;
    const d2 = Math.abs(n.x * F2.x + n.y * F2.y - 1) / nLen;
    const v1 = { x: F1.x - P.x, y: F1.y - P.y }, v2 = { x: F2.x - P.x, y: F2.y - P.y };
    const angle = Math.acos(Math.max(-1, Math.min(1, dot(v1, v2) / (dPF * dPFp)))) * 180 / Math.PI;
    const xN = (c * c / (a * a)) * P.x;
    const dFpN = Math.abs(xN - F2.x), dNF = Math.abs(F1.x - xN);
    row(geometry.kind === 'focal-chord' ? '현의 끝점 P의 좌표' : '초점의 좌표 c / 점 P', `c=${c.toFixed(2)} | P(${P.x.toFixed(2)}, ${P.y.toFixed(2)})`, 'amber');
    row("거리 합 PF' + PF = 2a", `${dPFp.toFixed(2)} + ${dPF.toFixed(2)} = ${(dPFp + dPF).toFixed(2)}`, 'rose');
    if (geometry.kind === 'focal-chord') {
      const Q = geometry.Q;
      row('비 PF:QF / 현의 길이', `PF:QF = ${(dPF / distance(Q, F1)).toFixed(3)}:1`, 'sky');
      row('현의 다른 끝점 Q / ΔPQF′의 둘레', `Q(${Q.x.toFixed(2)}, ${Q.y.toFixed(2)}) · 둘레 ${(4 * a).toFixed(2)}`, 'violet');
    } else {

  /* ---------- 그리기 도우미 (세계 좌표) ---------- */
  const T = (b, p, str, color, dx, dy, size, align) => b.text(p, str, { color, size: size || 13, weight: 800, align: align || 'center', baseline: 'middle', dx: dx || 0, dy: dy || 0 });
  const mid = (A, B) => [(A[0] + B[0]) / 2, (A[1] + B[1]) / 2];
  const dist = (A, B) => Math.hypot(A[0] - B[0], A[1] - B[1]);
  // 선분 A–B 의 가운데에서 화면 기준으로 수직 방향(side=±1)으로 off(px) 떨어진 곳에 글자를 씁니다
  function segLabel(b, A, B, str, color, off, side, size, along) {
    const s1 = b.toS(A[0], A[1]), s2 = b.toS(B[0], B[1]);
    const L = Math.hypot(s2.x - s1.x, s2.y - s1.y) || 1;
    const dx = (s2.x - s1.x) / L, dy = (s2.y - s1.y) / L;
    const m = mid(A, B);
    const a = (along || 0);
    b.text(m, str, { color, size: size || 13, weight: 800, align: 'center', baseline: 'middle', dx: -dy * off * (side || 1) + dx * a, dy: dx * off * (side || 1) + dy * a });
  }
  function ellipsePath(cx, cy, ax, by, n = 200) {
    const pts = [];
    for (let i = 0; i <= n; i++) { const t = (i / n) * 2 * Math.PI; pts.push([cx + ax * Math.cos(t), cy + by * Math.sin(t)]); }
    return pts;
  }
  // 쌍곡선 x²/a² − y²/b² = 1 의 한 가지(sgn=+1 오른쪽, −1 왼쪽), 중심 (cx, 0), |y| ≤ ymax
  function hyperPath(cx, a, bb, sgn, ymax, n = 160) {
    const U = Math.asinh(ymax / bb), pts = [];
    for (let i = 0; i <= n; i++) { const u = -U + (2 * U * i) / n; pts.push([cx + sgn * a * Math.cosh(u), bb * Math.sinh(u)]); }
    return pts;
  }
  // 위아래로 열린 쌍곡선 y²/m² − x²/n² = 1 의 한 가지(sgn=+1 위쪽), |x| ≤ xmax
  function hyperPathV(m, n, sgn, xmax, nn = 160) {
    const U = Math.asinh(xmax / n), pts = [];
    for (let i = 0; i <= nn; i++) { const u = -U + (2 * U * i) / nn; pts.push([n * Math.sinh(u), sgn * m * Math.cosh(u)]); }

  }
  // 오른쪽으로 열린 포물선 (y − vy)² = 4p(x − vx), |y − vy| ≤ ymax
  function parabPath(vx, vy, p, ymax, n = 160) {
    const pts = [];

  const seg = (b, A, B, color, w, dash) => b.seg(A, B, { color, width: w || 2.6, dash: dash || undefined });
  // 같은 길이 표시와 직각 표시

  // 좌표축: 탐구 탭은 눈금 숫자까지, 문제·풀이 탭은 눈금 숫자 없이 축과 x, y 글자만(숫자가 라벨·점 이름과 겹치지 않게)

  function autoView(b, lab, key, fitBody, explicitBox) {

  function geoE5(a, cx, c) {
    const h = cx + a, m = (cx - a) / 2, ah = h / 2, ch = c - m, bh2 = ch * ch - ah * ah;

      if(st(2)) { const Hp=[-H1[0],-H1[1]]; Cr(b,a,'green'); seg(b,H1,Hp,'green',1.5,[5,5]); seg(b,Hp,H2,'amber',2.6); seg(b,[-a,0],[a,0],'green',2); D(b,Hp,'H₁′','green',O,{r:4}); tk(b,Fo,H1,'sky',2); tk(b,Fp,Hp,'sky',2); }
      if (st(3)) T(b, [0, -bb * 1.45], `d₁ × d₂ = b² = ${bb * bb}`, 'amber', 0, 0, 14);
      D(b, Fo, 'F', 'rose', O); D(b, Fp, "F'", 'rose', O); D(b, P, 'P', 'amber', O, { r: 5.2 });
      if (st(1)) { D(b, H1, 'H₁', 'sky', Fo, { r: 3.6 }); D(b, H2, 'H₂', 'rose', Fp, { r: 3.6 }); }
    };
    F['4-A'] = (b, st, v) => {
      const { a, c, d, pf } = v, bb = Math.sqrt(a * a - c * c), Fo = [c, 0], Fp = [-c, 0], x = (d - a) * a / c, P = [x, bb * Math.sqrt(Math.max(0, 1 - x * x / (a * a)))], N = [(d - a) * c / a, 0];
      E(b, a, bb);

      if (st(1)) seg(b, P, N, 'green', 3);
      if (st(2)) { b.angle(P, Fp, N, { r: 28, color: 'amber', rings: 1 }); b.angle(P, N, Fo, { r: 28, color: 'amber', rings: 1 }); }
      if (st(3)) { const nv = [N[0] - P[0], N[1] - P[1]], L = Math.hypot(...nv), tv = [-nv[1] / L, nv[0] / L]; seg(b, [P[0] - tv[0] * a * 0.7, P[1] - tv[1] * a * 0.7], [P[0] + tv[0] * a * 0.7, P[1] + tv[1] * a * 0.7], 'violet', 1.8, [6, 5]); T(b, [0, -bb * 1.45], `F'N : NF = PF' : PF = ${v.r1 || d} : ${v.r2 || pf}`, 'amber', 0, 0, 13); }
      D(b, Fo, 'F', 'rose', O); D(b, Fp, "F'", 'rose', O); D(b, P, 'P', 'amber', O, { r: 5.2 });

    F['4-B'] = (b, st, v) => {

      const g=ellipseOrthogonalTangents(a,bb,th),M=[g.M.x,g.M.y],Ts=[g.T1,g.T2].map(p=>[p.x,p.y]);

      D(b,M,'M','violet',O,{r:5.2}); Ts.forEach((tp,i)=>D(b,tp,`T${'₁₂'[i]}`,'amber',O,{r:3.8}));
      const Ks=Ts.map(tp=>{const dx=tp[0]-M[0],dy=tp[1]-M[1],u=-(M[0]*dx+M[1]*dy)/(dx*dx+dy*dy);return [M[0]+u*dx,M[1]+u*dy]});
      if(st(1)) {
        b.poly([O,Ks[0],M,Ks[1]],{color:'green',width:2,fill:'green',fillAlpha:.07});
        Ks.forEach((K,i)=>{rt(b,K,O,M,'green',10);D(b,K,`K${'₁₂'[i]}`,'green',O,{r:3.8});segLabel(b,O,K,`h${'₁₂'[i]}`,'green',14,i?1:-1,13)});
      }
      if(st(2)) { seg(b,O,M,'violet',2,[5,5]); T(b,[0,-R*1.1],'OM² = h₁² + h₂²','green',0,0,13); }
      if(st(3)) {Cr(b,R,'violet');T(b,[0,-R*1.1],`h₁² + h₂² = a²+b² = ${R2}`,'violet',0,22,13);}
