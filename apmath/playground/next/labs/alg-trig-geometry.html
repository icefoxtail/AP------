       - 원본의 칠판(Step 카드·풀이 비교·정답 배지)은 셸의 정리 탭(단계·풀이 비교)과 문제 탭(정답은 3단계 후 공개)으로 이동
       - 실시간 측정 문구는 3단계에서 '핵심 결과'로 표시, 정답이 드러나는 스냅 버튼도 3단계부터(원본과 같음)
       - 무대 확대·이동은 셸의 기본 동작(휠·핀치·빈 곳 끌기)을 사용
       ========================================================================== */

    function gcd(a, b) {
      a = Math.abs(Math.round(a));
      b = Math.abs(Math.round(b));
      while (b) { const t = b; b = a % b; a = t; }
      return a || 1;
    }

    function fmtPi(rad) {
      if (Math.abs(rad) < 1e-3) return '0';
      const ratio = rad / Math.PI;
      const denom = 24;
      const num = Math.round(ratio * denom);
      if (Math.abs(num / denom - ratio) < 1e-7) {
        const g = gcd(num, denom);
        const n = num / g;
        const d = denom / g;
        if (d === 1) return n === 1 ? 'π' : (n === -1 ? '-π' : `${n}π`);
        return n === 1 ? `π/${d}` : (n === -1 ? `-π/${d}` : `${n}π/${d}`);
      }
      return `${rad.toFixed(2)} rad`;
    }

    function fmtSurd(val) {
      if (Math.abs(val) < 1e-4) return '0';
      const sign = val < 0 ? '-' : '';
      const v = Math.abs(val);
      const table = [
        { n: 0.2, s: '1/5' }, { n: 0.25, s: '1/4' }, { n: 0.6, s: '3/5' }, { n: 0.8, s: '4/5' },
        { n: 0.5, s: '1/2' }, { n: 1.0, s: '1' }, { n: 1.5, s: '3/2' },
        { n: 2.0, s: '2' }, { n: 3.0, s: '3' }, { n: 4.0, s: '4' },
        { n: 5.0, s: '5' }, { n: 6.0, s: '6' }, { n: 8.0, s: '8' }, { n: 12.0, s: '12' },
        { n: 1 / 3, s: '1/3' }, { n: 2 / 3, s: '2/3' }, { n: 3 / 4, s: '3/4' },
        { n: Math.SQRT2 / 2, s: '√2/2' }, { n: Math.sqrt(3) / 2, s: '√3/2' },
        { n: Math.sqrt(6) / 2, s: '√6/2' }, { n: Math.sqrt(3) / 4, s: '√3/4' },
        { n: Math.sqrt(3) / 3, s: '√3/3' }, { n: (2 * Math.sqrt(3)) / 3, s: '2√3/3' },
        { n: (4 * Math.sqrt(3)) / 3, s: '4√3/3' }, { n: Math.SQRT2, s: '√2' },
        { n: 2 * Math.SQRT2, s: '2√2' }, { n: 3 * Math.SQRT2, s: '3√2' },
        { n: 4 * Math.SQRT2, s: '4√2' }, { n: Math.sqrt(3), s: '√3' },
        { n: 2 * Math.sqrt(3), s: '2√3' }, { n: 3 * Math.sqrt(3), s: '3√3' },
        { n: 4 * Math.sqrt(3), s: '4√3' }, { n: 9 * Math.sqrt(3), s: '9√3' },
        { n: Math.sqrt(17), s: '√17' }, { n: Math.sqrt(19), s: '√19' },
        { n: Math.sqrt(7), s: '√7' }, { n: 2 * Math.sqrt(7), s: '2√7' }, { n: 3 * Math.sqrt(7), s: '3√7' }
      ];
      for (const item of table) {
        if (Math.abs(v - item.n) < 1e-6) return sign + item.s;
      }
      return sign + v.toFixed(2);
    }

    const C = {
      cyan: '#38bdf8',
      pink: '#f472b6',
      green: '#34d399',
      gold: '#fbbf24',
      red: '#fb7185',
      purple: '#c084fc',
      white: '#f8fafc'
    };

    const PROBLEMS = [

        title: '[기본 01] 둘레의 길이가 20으로 일정한 부채꼴의 넓이의 최댓값과 중심각',
        solType: '🎯 실전 최적 풀이',

        `,

        ],
        aha: `부채꼴의 둘레 $2r + l = 20$이 일정할 때, 넓이 $S = \\dfrac{1}{2}rl$이 최대가 되는 순간은 산술·기하평균의 등호 조건에 의해 **$2r = l$ (양 옆 반지름의 합 = 호의 길이)**일 때이며, 이때 중심각은 둘레의 길이와 관계없이 **$\\theta = \\dfrac{l}{r} = 2\\,(\\text{rad})$**입니다!`,
        steps: [
          {
            step: 1,
            title: 'Step 1. 둘레 조건 2r + l = 20 에서 호의 길이 l 을 r 로 나타내기',
            desc: `부채꼴의 둘레의 길이는 반지름 $2$개와 호의 길이 $1$개의 합이므로 $2r + l = 20 \\implies \\mathbf{l = 20 - 2r}$ ($0 < r < 10$이고, 중심각 $\\theta \\le 2\\pi$인 부채꼴의 경우 $r \\ge \\dfrac{20}{2+2\\pi}$)입니다.`
          },
          {
            step: 2,
            title: 'Step 2. 넓이 S(r) 이차함수의 대칭축에서 최댓값 구하기',
            desc: `부채꼴의 넓이 공식 $S = \\dfrac{1}{2}rl$에 대입하면<br/>$S(r) = \\dfrac{1}{2}r(20 - 2r) = -r^2 + 10r = -(r - 5)^2 + 25$이므로, 대칭축 **$\\mathbf{r = 5}$에서 최댓값 $\\mathbf{S_{\\max} = 25}$**를 갖습니다.`

        ],

          <div>1) <strong>이차함수 정석 풀이:</strong> $S(r) = -r^2 + 10r = -(r-5)^2 + 25$로 묶어 꼭짓점 $(5, 25)$를 찾습니다.</div>
          <div>2) <strong>산술·기하평균 구조 풀이:</strong> 합 $2r + l = 20$이 일정하므로 곱 $2r \\cdot l$은 $2r = l = 10$일 때 최대입니다. 따라서 $r = 5, l = 10, \\theta = \\dfrac{l}{r} = 2\\text{ rad}$, $S_{\\max} = \\dfrac{1}{2} \\times 5 \\times 10 = 25$를 즉시 얻을 수 있습니다.</div>
        `,
        answer: 'r = 5, l = 10, θ = 2 rad, 넓이 최댓값 = 25'
      },
      {
        id: 'bas-2',
        unit: 'Ⅱ-1. 단위원과 삼각함수의 성질(각변환)',
        badge: '🌱 기본 02 · 단위원 직각삼각형 합동과 각변환',
        tabLabel: '기본 02 · 단위원과 직각삼각형 합동을 이용한 각변환',
        title: '[기본 02] 단위원 위의 점의 회전(π/2 + θ)·대칭(π/2 - θ)과 직각삼각형 합동',

        dragMode: 'angle',
        statement: `
          <div>좌표평면에서 원점 $O$를 중심으로 하고 반지름의 길이가 $1$인 단위원 위의 제$1$사분면의 점 $P$에 대하여 동경 $OP$가 나타내는 각을 $\\theta$라 하자. 점 $P$의 $y$좌표가 $\\dfrac{3}{5}$일 때, 점 $P$를 원점 $O$를 중심으로 $\\dfrac{\\pi}{2}$만큼 회전이동한 점을 $Q$, 직선 $y = x$에 대하여 대칭이동한 점을 $R$라 하자.</div>
          <div class="mt-1.5 font-bold text-amber-300">$\\cos\\left(\\dfrac{\\pi}{2} + \\theta\\right) + \\sin\\left(\\dfrac{\\pi}{2} - \\theta\\right)$의 값을 구하시오.</div>
        `,
        sliderTitle: '제1사분면 동경 P(θ) 각도 조작:',
        defaultT: 0.41,
        snaps: [
          { t: 0.310385636806, label: 'θ = π/6 (낮은 각도)' },
          { t: 0.41, label: '🎯 sin θ = 3/5, cos θ = 4/5 (문제 조건!)' },
          { t: 0.745391182889, label: 'θ = π/3 (높은 각도)' }
        ],
        aha: `각변환 공식을 외우느라 헷갈릴 필요가 없습니다! 점 $P(\\cos\\theta, \\sin\\theta) = \\left(\\dfrac{4}{5}, \\dfrac{3}{5}\\right)$의 직각삼각형을 **$+\\dfrac{\\pi}{2}$ 회전한 점 $Q$는 $(-\\sin\\theta, \\cos\\theta)$**이고, **$y = x$에 대칭이동한 점 $R$는 $(\\sin\\theta, \\cos\\theta)$**이므로 두 직각삼각형의 밑변·높이 대응으로 즉시 읽힙니다.`,
        steps: [
          {
            step: 1,
            title: 'Step 1. 점 P 에서 x축에 수선을 내려 기준 직각삼각형(4/5, 3/5) 완성',
            desc: `단위원($x^2+y^2=1$) 위의 제$1$사분면 점 $P$에서 $y = \\sin\\theta = \\dfrac{3}{5}$이므로,<br/>피타고라스 정리에 의해 $x = \\cos\\theta = \\sqrt{1 - \\left(\\dfrac{3}{5}\\right)^2} = \\mathbf{\\dfrac{4}{5}}$입니다.`
          },
          {
            step: 2,
            title: 'Step 2. +π/2 회전이동한 점 Q(π/2 + θ)의 합동 직각삼각형',
            desc: `기준 직각삼각형을 $+\\dfrac{\\pi}{2}$만큼 회전하면 제$2$사분면에 가로·세로가 바뀐 합동 직각삼각형이 놓이므로,<br/>$Q(-\\sin\\theta, \\cos\\theta) = \\left(-\\dfrac{3}{5}, \\dfrac{4}{5}\\right) \\implies \\mathbf{\\cos\\left(\\dfrac{\\pi}{2}+\\theta\\right) = x_Q = -\\dfrac{3}{5}}$입니다.`
          },

          }

          <div>1) <strong>교과서 각변환 공식:</strong> $\\cos\\left(\\dfrac{\\pi}{2}+\\theta\\right) = -\\sin\\theta$, $\\sin\\left(\\dfrac{\\pi}{2}-\\theta\\right) = \\cos\\theta$ 공식을 적용해 $-\\dfrac{3}{5} + \\dfrac{4}{5} = \\dfrac{1}{5}$을 계산합니다.</div>
          <div>2) <strong>단위원 합동 직독:</strong> 제$2$사분면 회전점 $Q$의 $x$좌표는 음수($-y_P$), $y=x$ 대칭점 $R$의 $y$좌표는 $x_P$임을 도형에서 바로 읽어 부호 실수를 원천 차단합니다.</div>
        `,

      {

          },
          {
            step: 2,
            title: 'Step 2. 네 교점 전체의 정중앙 대칭축 S = 3π/4 와 동심원 짝짓기',
            desc: `두 봉우리 대칭축 $S_1 = \\dfrac{\\pi}{4}$와 $S_2 = \\dfrac{5\\pi}{4}$의 한가운데인 **$S = \\dfrac{3\\pi}{4}$**에 대하여,<br/>바깥쪽 두 점 $(x_1, x_4)$와 안쪽 두 점 $(x_2, x_3)$는 각각 $S$로부터 같은 거리만큼 떨어져 있습니다.`
          },

        // 2단계 이상에서 좌측 부채꼴과 우측 이차함수 그래프가 절대 겹치지 않도록 반응형 스케일 분리
        const leftCx = rect.width * (step >= 2 ? 0.23 : 0.48) + state.panX;
        const leftCy = rect.height * 0.58 + state.panY;
        const secScale = step >= 2
          ? Math.min(u * 0.64, rect.width * 0.028 * state.scale)
          : u * 0.80;

        const centerPt = { x: leftCx, y: leftCy };
        state.centerPt = centerPt;
        const rPx = r * secScale;
        const startA = -theta * 0.5 + Math.PI * 0.5;
        const endA = theta * 0.5 + Math.PI * 0.5;

        if (step >= 1) {
          const optRPx = 5 * secScale;
          dSector(centerPt, optRPx, Math.PI * 0.5 - 1.0, Math.PI * 0.5 + 1.0, 'rgba(251,191,36,0.5)', 'rgba(251,191,36,0.06)', 1.8);
        }

        const isOptimal = Math.abs(r - 5) < 0.08;
        dSector(
          centerPt,
          rPx,
          startA,
          endA,
          isOptimal && step >= 3 ? C.green : C.cyan,
          isOptimal && step >= 3 ? 'rgba(52,211,153,0.28)' : 'rgba(56,189,248,0.22)',
          3.2
        );

        const A = { x: centerPt.x + rPx * Math.cos(-startA), y: centerPt.y + rPx * Math.sin(-startA) };
        const B = { x: centerPt.x + rPx * Math.cos(-endA), y: centerPt.y + rPx * Math.sin(-endA) };
        const arcTop = { x: centerPt.x, y: centerPt.y - rPx };

        drawDimension(centerPt, B, step >= 2 ? 22 : -22, `r = ${r.toFixed(1)}`, C.gold); // [2.0 수정] 2단계부터 r 치수선을 반대쪽으로: 작아진 부채꼴에서 θ 라벨·점 A와 겹치지 않게
        drawAngleArc(centerPt, A, B, Math.min(32, rPx * 0.36), step >= 3 ? `θ = ${theta.toFixed(2)} rad` : 'θ', C.gold);

        dDot(centerPt, 'O', C.gold, { x: -16, y: 16 }, false, true);
        dDot(A, 'A [드래그]', C.white, { x: 12, y: 16 }, true, true); // [2.0 수정] 점 A 라벨을 오른쪽으로: 작은 부채꼴에서 θ 라벨과 겹치지 않게
        dDot(B, 'B', C.white, { x: -24, y: 6 }, false, true);
        if (step >= 1) {
          dDot(arcTop, `l = 20 - 2r = ${l.toFixed(1)}`, C.cyan, { x: -52, y: -12 }, false, true);
        }

        if (step >= 2) {
          const gOx = rect.width * 0.58 + state.panX;
          const gOy = rect.height * 0.78 + state.panY;
          const ux = Math.min(u * 0.40, rect.width * 0.033 * state.scale);
          const uy = u * 0.18;

          dLine({ x: gOx - 12, y: gOy }, { x: gOx + 10.6 * ux, y: gOy }, 'rgba(255,255,255,0.45)', 1.8);
          dLine({ x: gOx, y: gOy + 12 }, { x: gOx, y: gOy - 27 * uy }, 'rgba(255,255,255,0.45)', 1.8);

          const symTop = toScr(5, 25, gOx, gOy, ux, uy);
          const symBot = toScr(5, 0, gOx, gOy, ux, uy);
          dLine(symBot, symTop, C.gold, 2.0, [5, 4]);

          dCurve((rv) => -rv * rv + 10 * rv, 0, 10, gOx, gOy, ux, uy, C.pink, 3.2, [], true);

          const curGraphPt = toScr(r, area, gOx, gOy, ux, uy);
          const curGraphBase = toScr(r, 0, gOx, gOy, ux, uy);
          dLine(curGraphBase, curGraphPt, C.cyan, 1.8, [3, 3]);
          dDot(curGraphPt, `S(${r.toFixed(1)}) = ${area.toFixed(1)}`, C.cyan, { x: 8, y: 14 }, false, true);

          if (step >= 3) {
            dDot(symTop, '최댓값 (r=5, S=25)', C.green, { x: -55, y: -14 }, false, true);
          }
        }

        setMetric(`반지름 r = ${r.toFixed(2)}, 호 l = ${l.toFixed(2)}, 중심각 θ = ${theta.toFixed(2)} rad ➔ 넓이 S = ${area.toFixed(2)} (최대: r=5, θ=2 rad, S=25)`);
        return;
      }

      // -----------------------------------------------------------------------
      // 🌱 [기본 02] bas-2: 단위원과 직각삼각형 합동을 이용한 각변환
      // -----------------------------------------------------------------------
      if (id === 'bas-2') {
        const ox = rect.width * 0.46 + state.panX;
        const oy = rect.height * 0.56 + state.panY;
        const sc = u * 3.25;
        drawAxesWithTicks(rect, ox, oy, sc, true);

        const O = toScr(0, 0, ox, oy, sc);
        state.centerPt = O;
        dCircle(O, sc, 'rgba(56,189,248,0.55)', 2.4);

        const theta = 0.15 + t * 1.20366;
        const cosT = Math.cos(theta), sinT = Math.sin(theta);

        const P = toScr(cosT, sinT, ox, oy, sc);
        const Hp = toScr(cosT, 0, ox, oy, sc);
        const Q = toScr(-sinT, cosT, ox, oy, sc);
        const Hq = toScr(-sinT, 0, ox, oy, sc);
        const R = toScr(sinT, cosT, ox, oy, sc);
        const Hr = toScr(sinT, 0, ox, oy, sc);

        if (step >= 1) {
          dPoly([O, Hp, P], 'rgba(251, 191, 36, 0.22)', C.gold, 2.4, step === 1);
          drawRightAngle(Hp, O, P, 11, C.gold);
          drawDimension(O, Hp, 22, `cos θ = ${fmtSurd(cosT)}`, C.gold);
          drawDimension(Hp, P, -26, `sin θ = ${fmtSurd(sinT)}`, C.gold);
        }

        if (step >= 2) {
          dPoly([O, Hq, Q], 'rgba(56, 189, 248, 0.22)', C.cyan, 2.4, step === 2);
          drawRightAngle(Hq, O, Q, 11, C.cyan);
          drawRightAngle(O, P, Q, 12, C.green);
          drawDimension(Hq, O, 22, `|-sin θ| = ${fmtSurd(sinT)}`, C.cyan);
        }

        if (step >= 3) {
          dLine(toScr(-0.9, -0.9, ox, oy, sc), toScr(1.2, 1.2, ox, oy, sc), 'rgba(244,114,182,0.65)', 2.0, [6, 4]);
          dLine(P, R, C.pink, 1.8, [3, 3]);
          dPoly([O, Hr, R], 'rgba(244, 114, 182, 0.18)', C.pink, 2.2, true);
          drawRightAngle(Hr, O, R, 10, C.pink);
        }

        dLine(O, P, C.gold, 3.0);
        dLine(O, Q, C.cyan, 2.6);
        dLine(O, R, C.pink, 2.4, [4, 3]);

        dDot(P, step >= 1 ? `P(${fmtSurd(cosT)}, ${fmtSurd(sinT)}) [드래그]` : 'P(θ) [드래그]', C.gold, { x: 10, y: -10 }, true, true);
        dDot(Q, step >= 2 ? `Q(${fmtSurd(-sinT)}, ${fmtSurd(cosT)})` : 'Q(π/2 + θ)', C.cyan, { x: -115, y: -10 }, false, true);
        dDot(R, step >= 3 ? `R(${fmtSurd(sinT)}, ${fmtSurd(cosT)})` : 'R(π/2 - θ)', C.pink, { x: 10, y: -12 }, false, true);

        setMetric(`P(${fmtSurd(cosT)}, ${fmtSurd(sinT)}) ➔ cos(π/2+θ) = ${fmtSurd(-sinT)}, sin(π/2-θ) = ${fmtSurd(cosT)} ➔ 합 = ${fmtSurd(-sinT + cosT)}`);
        return;
      }

      // -----------------------------------------------------------------------
      // 🌱 [기본 03] bas-3: 삼각함수의 주기와 대칭축을 이용한 네 교점의 합
      // -----------------------------------------------------------------------
      if (id === 'bas-3') {
        const ox = rect.width * 0.11 + state.panX;
        const oy = rect.height * 0.56 + state.panY;
        const ux = u * 1.18;
        const uy = u * 2.35;
        drawRadianAxesWithTicks(rect, ox, oy, ux, uy, Math.PI / 4);

        const k = 0.15 + t * 0.78;
        const alpha = 0.5 * Math.asin(k);
        const xs = [alpha, Math.PI * 0.5 - alpha, Math.PI + alpha, Math.PI * 1.5 - alpha];

        if (step >= 1) {
          const s1Top = toScr(Math.PI * 0.25, 1.35, ox, oy, ux, uy);
          const s1Bot = toScr(Math.PI * 0.25, -1.25, ox, oy, ux, uy);
          const s2Top = toScr(Math.PI * 1.25, 1.35, ox, oy, ux, uy);
          const s2Bot = toScr(Math.PI * 1.25, -1.25, ox, oy, ux, uy);
          dLine(s1Bot, s1Top, C.cyan, 2.0, [5, 4]);
          dLine(s2Bot, s2Top, C.cyan, 2.0, [5, 4]);
          dDot(toScr(Math.PI * 0.25, 1.0, ox, oy, ux, uy), '대칭축 S₁ = π/4', C.cyan, { x: -38, y: -14 }, false);
          dDot(toScr(Math.PI * 1.25, 1.0, ox, oy, ux, uy), '대칭축 S₂ = 5π/4', C.cyan, { x: -42, y: -14 }, false);
        }

        if (step >= 2) {
          const sMidTop = toScr(Math.PI * 0.75, 1.45, ox, oy, ux, uy);
          const sMidBot = toScr(Math.PI * 0.75, -1.35, ox, oy, ux, uy);
          dLine(sMidBot, sMidTop, C.pink, 2.6, [6, 4], true);
          dDot(toScr(Math.PI * 0.75, -1.15, ox, oy, ux, uy), '정중앙 대칭축 S = 3π/4', C.pink, { x: -58, y: 18 }, false);

          const pX1 = toScr(xs[0], k, ox, oy, ux, uy);
          const pX2 = toScr(xs[1], k, ox, oy, ux, uy);
          const pX3 = toScr(xs[2], k, ox, oy, ux, uy);
          const pX4 = toScr(xs[3], k, ox, oy, ux, uy);
          drawDimension(pX2, pX3, -24, '안쪽 짝꿍 중점 = 3π/4 (x₂+x₃ = 3π/2)', C.green);
          drawDimension(pX1, pX4, -52, '바깥 짝꿍 중점 = 3π/4 (x₁+x₄ = 3π/2)', C.gold);
        }

        dCurve((x) => Math.sin(2 * x), 0, Math.PI * 2, ox, oy, ux, uy, C.cyan, 3.8);
        dLine(toScr(-0.2, k, ox, oy, ux, uy), toScr(Math.PI * 2 + 0.25, k, ox, oy, ux, uy), C.gold, 2.8, [], true);

        xs.forEach((xv, i) => {
          const pt = toScr(xv, k, ox, oy, ux, uy);
          const basePt = toScr(xv, 0, ox, oy, ux, uy);
          if (step >= 1) dLine(pt, basePt, 'rgba(251,191,36,0.45)', 1.5, [3, 3]);
          dDot(pt, step >= 3 ? `x_${i + 1}=${fmtPi(xv)}` : `x_${i + 1}`, i === 0 || i === 3 ? C.gold : C.green, { x: -16, y: i % 2 === 0 ? 20 : -12 }, i === 1, true);
        });

        setMetric(`직선 y = ${fmtSurd(k)} | x₁+x₄ = 3π/2, x₂+x₃ = 3π/2 ➔ x₁ + 2x₂ + 2x₃ + x₄ = 9π/2 (불변!)`);
        return;
      }

      // -----------------------------------------------------------------------
      // 🌱 [기본 04] bas-4: 절댓값 삼각함수 |3 sin x - 1| 과 직선 y = t 의 교점 개수
      // -----------------------------------------------------------------------
      if (id === 'bas-4') {
        const ox = rect.width * 0.11 + state.panX;
        const oy = rect.height * 0.72 + state.panY;
        const ux = u * 1.15;
        const uy = u * 0.92;
        drawRadianAxesWithTicks(rect, ox, oy, ux, uy, Math.PI / 2);

        const lineT = t * 4.5;

        if (step >= 1) {
          dCurve((x) => 3 * Math.sin(x) - 1, 0, Math.PI * 2, ox, oy, ux, uy, 'rgba(56,189,248,0.35)', 2.0, [5, 5]);
          dLine(toScr(0, -1, ox, oy, ux, uy), toScr(Math.PI * 2, -1, ox, oy, ux, uy), 'rgba(56,189,248,0.4)', 1.5, [4, 4]);
        }

        if (step >= 2) {
          dLine(toScr(0, 2, ox, oy, ux, uy), toScr(Math.PI * 2, 2, ox, oy, ux, uy), 'rgba(52,211,153,0.55)', 1.8, [5, 4]);
          dLine(toScr(0, 4, ox, oy, ux, uy), toScr(Math.PI * 2, 4, ox, oy, ux, uy), 'rgba(244,114,182,0.55)', 1.8, [5, 4]);
          dDot(toScr(Math.PI * 0.5, 2, ox, oy, ux, uy), '작은 봉우리 (π/2, 2)', C.green, { x: -52, y: -12 }, false);
          dDot(toScr(Math.PI * 1.5, 4, ox, oy, ux, uy), '큰 봉우리 (3π/2, 4)', C.pink, { x: -55, y: -12 }, false);
        }

        dCurve((x) => Math.abs(3 * Math.sin(x) - 1), 0, Math.PI * 2, ox, oy, ux, uy, C.cyan, 3.8);

        const roots = [];
        const addSinSol = (sVal) => {
          if (sVal < -1 - 1e-4 || sVal > 1 + 1e-4) return;
          if (Math.abs(sVal - 1) < 1e-3) {
            roots.push(Math.PI * 0.5);
          } else if (Math.abs(sVal + 1) < 1e-3) {
            roots.push(Math.PI * 1.5);
          } else {
            const cl = Math.max(-1, Math.min(1, sVal));
            const a = Math.asin(cl);
            if (cl >= 0) {
              roots.push(a, Math.PI - a);
            } else {
              roots.push(Math.PI - a, Math.PI * 2 + a);
            }
          }
        };
        if (Math.abs(lineT) < 1e-3) {
          addSinSol(1 / 3);
        } else {
          addSinSol((lineT + 1) / 3);
          addSinSol((-lineT + 1) / 3);
        }
        roots.sort((a, b) => a - b);
        const validRoots = [];
        for (const r of roots) {
          if (r >= -1e-4 && r < Math.PI * 2 - 1e-3) {
            if (!validRoots.length || Math.abs(r - validRoots[validRoots.length - 1]) > 1e-3) {
              validRoots.push(Math.max(0, r));
            }
          }
        }

        const isTargetCount = validRoots.length === 3 || validRoots.length === 1;
        dLine(
          toScr(-0.2, lineT, ox, oy, ux, uy),
          toScr(Math.PI * 2 + 0.25, lineT, ox, oy, ux, uy),
          isTargetCount ? C.green : C.gold,
          3.0,
          [],
          true
        );

        validRoots.forEach((rx) => {
          dDot(toScr(rx, lineT, ox, oy, ux, uy), '', C.gold, { x: 6, y: -8 }, false, true);
        });
        dDot(toScr(Math.PI, lineT, ox, oy, ux, uy), `y = ${lineT.toFixed(2)} [드래그]`, C.gold, { x: 10, y: -10 }, true, true);

        const openEnd = toScr(Math.PI * 2, 1, ox, oy, ux, uy);
        dCircle(openEnd, 5.5, C.red, 2.2, [], '#05100c');

        setMetric(`직선 y = ${lineT.toFixed(2)} ➔ 0 ≤ x < 2π 에서 교점 ${validRoots.length}개 (3개일 때 a = 2, 1개일 때 b = 4 ➔ a+b = 6)`);
        return;
      }

      // -----------------------------------------------------------------------
      // 🌱 [기본 05] bas-5: 치환 삼각방정식 2 cos²x - sin x - 1 = 0 의 실근의 합
      // -----------------------------------------------------------------------
      if (id === 'bas-5') {
        const ox = rect.width * 0.11 + state.panX;
        const oy = rect.height * 0.54 + state.panY;
        const ux = u * 1.16;
        const uy = u * 2.25;
        drawRadianAxesWithTicks(rect, ox, oy, ux, uy, Math.PI / 2);

        const curT = -1.0 + t * 2.0;

        if (step >= 1) {
          dLine(toScr(0, 1, ox, oy, ux, uy), toScr(Math.PI * 2, 1, ox, oy, ux, uy), 'rgba(203,213,225,0.28)', 1.5, [4, 4]);
          dLine(toScr(0, 0.5, ox, oy, ux, uy), toScr(Math.PI * 2, 0.5, ox, oy, ux, uy), C.green, 2.2, [5, 4]);
          dLine(toScr(0, -1, ox, oy, ux, uy), toScr(Math.PI * 2, -1, ox, oy, ux, uy), C.pink, 2.2, [5, 4]);
        }

        if (step >= 2) {
          dLine(toScr(Math.PI * 0.5, -1.2, ox, oy, ux, uy), toScr(Math.PI * 0.5, 1.25, ox, oy, ux, uy), C.green, 1.8, [4, 4]);
          const r1 = toScr(Math.PI / 6, 0.5, ox, oy, ux, uy);
          const r2 = toScr((5 * Math.PI) / 6, 0.5, ox, oy, ux, uy);
          dDot(r1, 'x₁ = π/6', C.green, { x: -28, y: -12 }, false);
          dDot(r2, 'x₂ = 5π/6', C.green, { x: 10, y: -12 }, false);
          drawDimension(r1, r2, -26, '대칭축 π/2 ➔ 두 근의 합 = π', C.green);
        }

        if (step >= 3) {
          const r3 = toScr(Math.PI * 1.5, -1, ox, oy, ux, uy);
          dDot(r3, 'x₃ = 3π/2 (극소 접점 1개!)', C.pink, { x: -65, y: 22 }, false);
        }

        dCurve((x) => Math.sin(x), 0, Math.PI * 2, ox, oy, ux, uy, C.cyan, 3.8);
        dLine(toScr(-0.2, curT, ox, oy, ux, uy), toScr(Math.PI * 2 + 0.2, curT, ox, oy, ux, uy), C.gold, 2.6, [], true);
        dDot(toScr(Math.PI, curT, ox, oy, ux, uy), `y = t (${fmtSurd(curT)}) [드래그]`, C.gold, { x: 12, y: -10 }, true, true);

        setMetric(`현재 t = ${fmtSurd(curT)} | 방정식의 해: t = 1/2 (π/6, 5π/6 ➔ 합 π) & t = -1 (3π/2) ➔ 총 3개, 합 = 5π/2`);
        return;
      }

      // -----------------------------------------------------------------------
      // 🌱 [기본 06] bas-6: 외접원의 지름 보조선(2R)과 사인법칙
      // -----------------------------------------------------------------------
      if (id === 'bas-6') {
        const ox = rect.width * 0.5 + state.panX;
        const oy = rect.height * 0.54 + state.panY;
        const sc = u * 0.88;
        drawAxesWithTicks(rect, ox, oy, sc, false);

        const R = 4;
        const O = toScr(0, 0, ox, oy, sc);
        state.centerPt = O;
        dCircle(O, R * sc, C.cyan, 2.6);

        const angB = -Math.PI * 0.5 - Math.PI / 3;
        const angC = -Math.PI * 0.5 + Math.PI / 3;
        const B = toScr(R * Math.cos(angB), R * Math.sin(angB), ox, oy, sc);
        const Cpt = toScr(R * Math.cos(angC), R * Math.sin(angC), ox, oy, sc);

        const angAp = angB + Math.PI;
        const Ap = toScr(R * Math.cos(angAp), R * Math.sin(angAp), ox, oy, sc);

        const angA = angAp + t * 1.35;
        const A = toScr(R * Math.cos(angA), R * Math.sin(angA), ox, oy, sc);
        const isAtDiameterEnd = t < 0.06;

        if (step >= 1) {
          dLine(B, Ap, C.gold, 2.4, [6, 4], true);
          drawDimension(B, Ap, -26, '지름 2R = 8', C.gold);
        }

        if (step >= 2) {
          dPoly([Ap, B, Cpt], 'rgba(251, 191, 36, 0.16)', C.gold, 2.2, step === 2);
          drawRightAngle(Cpt, Ap, B, 12, C.gold);
          if (!isAtDiameterEnd) {
            drawAngleArc(Ap, B, Cpt, 22, 'π/3', C.gold);
            dDot(Ap, "A'(지름 끝점)", C.gold, { x: 10, y: -10 }, false);
          }
        }

        if (step >= 3) {
          drawDimension(Ap, Cpt, 24, "A'C = 8 cos(π/3) = 4", C.green);
        }

        dPoly([A, B, Cpt], 'rgba(56, 189, 248, 0.20)', C.cyan, 2.8);
        dLine(B, Cpt, C.pink, 3.4);
        drawAngleArc(A, B, Cpt, 24, '∠A = π/3', C.cyan);
        drawDimension(B, Cpt, 26, step >= 3 ? '현 BC = 8 sin(π/3) = 4√3' : '현 BC = a', C.pink);

        dDot(O, 'O(외심)', C.gold, { x: 8, y: 15 }, false, true);
        dDot(B, 'B', C.white, { x: -22, y: 14 }, false, true);
        dDot(Cpt, 'C', C.white, { x: 10, y: 14 }, false, true);
        dDot(
          A,
          isAtDiameterEnd && step >= 2 ? "A = A'(지름 끝점) [드래그]" : 'A [호 위 드래그]',
          C.gold,
          { x: -45, y: -14 },
          true,
          true
        );

        setMetric(`외접원 R = 4 (지름 2R = 8), ∠A = π/3 ➔ 현 BC = 2R sin(π/3) = 4√3, 직각변 A'C = 4`);
        return;
      }

      // -----------------------------------------------------------------------
      // 🌱 [기본 07] bas-7: 원에 내접하는 사각형의 대각 성질과 코사인법칙
      // -----------------------------------------------------------------------
      if (id === 'bas-7') {
        const ox = rect.width * 0.5 + state.panX;
        const oy = rect.height * 0.54 + state.panY;
        const sc = u * 1.50;
        drawAxesWithTicks(rect, ox, oy, sc, false);

        const R = (3 * Math.sqrt(34)) / 8;
        const O = toScr(0, 0, ox, oy, sc);
        state.centerPt = O;
        dCircle(O, R * sc, 'rgba(56,189,248,0.55)', 2.4);

        // AB=2, BC=3, CD=4, DA=3을 만족하는 실제 현의 중심각으로 정점 구성.
        // B만 호 AC 위에서 움직이며 t=0.562에서 원래 문항 조건을 정확히 만족한다.
        const arcAB = 2 * Math.asin(2 / (2 * R));
        const arcBC = 2 * Math.asin(3 / (2 * R));
        const arcCD = 2 * Math.asin(4 / (2 * R));
        const angC = 0;
        const angBTarget = angC + arcBC;
        const angA = angBTarget + arcAB;
        const angD = angC - arcCD;
        const angB = angBTarget + (t - 0.562) * 1.0;

        const mA = { x: R * Math.cos(angA), y: R * Math.sin(angA) };
        const mB = { x: R * Math.cos(angB), y: R * Math.sin(angB) };
        const mBTarget = { x: R * Math.cos(angBTarget), y: R * Math.sin(angBTarget) };
        const mC = { x: R * Math.cos(angC), y: R * Math.sin(angC) };
        const mD = { x: R * Math.cos(angD), y: R * Math.sin(angD) };

        const A = toScr(mA.x, mA.y, ox, oy, sc);
        const B = toScr(mB.x, mB.y, ox, oy, sc);
        const BTarget = toScr(mBTarget.x, mBTarget.y, ox, oy, sc);
        const Cpt = toScr(mC.x, mC.y, ox, oy, sc);
        const D = toScr(mD.x, mD.y, ox, oy, sc);

        const lenAB = Math.hypot(mA.x - mB.x, mA.y - mB.y);
        const lenBC = Math.hypot(mB.x - mC.x, mB.y - mC.y);
        const isConditionMet = Math.abs(lenAB - 2) < 1e-5 && Math.abs(lenBC - 3) < 1e-5;

        if (step >= 1) {
          dPoly([A, B, Cpt], 'rgba(56, 189, 248, 0.20)', C.cyan, 2.2);
          dPoly([A, Cpt, D], 'rgba(244, 114, 182, 0.18)', C.pink, 2.2);
          dLine(A, Cpt, C.gold, 3.0, [6, 4], true);
          if (!isConditionMet) {
            dDot(BTarget, '조건 위치 (AB=2, BC=3)', 'rgba(251,191,36,0.65)', { x: -55, y: -14 }, false);
          }
        } else {
          dPoly([A, B, Cpt, D], 'rgba(56, 189, 248, 0.16)', C.cyan, 2.6);
        }

        if (step >= 2) {
          drawAngleArc(B, A, Cpt, 22, step >= 3 ? 'B (cos B = -1/3 불변)' : '∠B = π - D', C.cyan);
          drawAngleArc(D, Cpt, A, 24, step >= 3 ? 'π-B (cos D = +1/3)' : '∠D = π - B', C.pink);
        }

        drawDimension(A, B, -22, isConditionMet ? 'AB = 2 (조건 일치!)' : `AB = ${lenAB.toFixed(2)}`, isConditionMet ? C.green : C.cyan);
        drawDimension(B, Cpt, -22, isConditionMet ? 'BC = 3 (조건 일치!)' : `BC = ${lenBC.toFixed(2)}`, isConditionMet ? C.green : C.cyan);
        drawDimension(Cpt, D, 24, 'CD = 4', C.pink);
        drawDimension(D, A, 24, 'DA = 3', C.pink);

        if (step >= 3) {
          drawDimension(A, Cpt, 18, '공통 대각선 AC = √17', C.gold);
        }

        dDot(A, 'A', C.white, { x: -22, y: -8 }, false, true);
        dDot(B, 'B [호 위 드래그]', C.gold, { x: -35, y: -14 }, true, true);
        dDot(Cpt, 'C', C.white, { x: 10, y: -8 }, false, true);
        dDot(D, 'D', C.white, { x: -8, y: 20 }, false, true);

        setMetric(`현재 AB = ${lenAB.toFixed(2)}, BC = ${lenBC.toFixed(2)} (원주각 cos B = -1/3 불변) ➔ AB=2, BC=3 일 때 AC = √17`);
        return;
      }

      // -----------------------------------------------------------------------
      // 🌱 [기본 08] bas-8: 삼각형의 각의 이등분선 길이와 넓이 분할
      // -----------------------------------------------------------------------
      if (id === 'bas-8') {
        const ox = rect.width * 0.48 + state.panX;
        const oy = rect.height * 0.68 + state.panY;
        const sc = u * 0.92;
        drawAxesWithTicks(rect, ox, oy, sc, false);

        const c = 6, b = 3, angleA = (2 * Math.PI) / 3;
        const a = Math.sqrt(c * c + b * b - 2 * c * b * Math.cos(angleA));
        const cosB = (a * a + c * c - b * b) / (2 * a * c);
        const sinB = Math.sqrt(1 - cosB * cosB);

        const mB = { x: -a * 0.5, y: 0 };
        const mC = { x: a * 0.5, y: 0 };
        const mA = { x: mB.x + c * cosB, y: c * sinB };

        const ratioBD = 0.35 + (t - 0.5) * 0.6 + (2 / 3 - 0.35);
        const mD = { x: mB.x + a * ratioBD, y: 0 };

        const A = toScr(mA.x, mA.y, ox, oy, sc);
        const B = toScr(mB.x, mB.y, ox, oy, sc);
        const Cpt = toScr(mC.x, mC.y, ox, oy, sc);
        const D = toScr(mD.x, mD.y, ox, oy, sc);

        const lenAD = Math.hypot(mA.x - mD.x, mA.y - mD.y);
        const isBisector = Math.abs(t - 0.5) < 0.025;

        if (step >= 1) {
          dPoly([A, B, D], 'rgba(52, 211, 153, 0.22)', C.green, 2.4);
          dPoly([A, D, Cpt], 'rgba(56, 189, 248, 0.22)', C.cyan, 2.4);
        } else {
          dPoly([A, B, Cpt], 'rgba(56, 189, 248, 0.16)', C.cyan, 2.6);
        }

        if (step >= 2) {
          drawAngleArc(A, B, D, 26, isBisector ? 'π/3' : 'α', C.green);
          drawAngleArc(A, D, Cpt, 32, isBisector ? 'π/3' : '2π/3-α', C.cyan);
          drawDimension(B, D, 24, isBisector && step >= 3 ? 'BD = 2√7 (비율 2)' : `BD = ${(a * ratioBD).toFixed(2)}`, C.green);
          drawDimension(D, Cpt, 24, isBisector && step >= 3 ? 'DC = √7 (비율 1)' : `DC = ${(a * (1 - ratioBD)).toFixed(2)}`, C.cyan);
        }

        dLine(A, D, C.gold, 3.2, [], true);
        drawDimension(A, B, -24, 'AB = 6', C.green);
        drawDimension(A, Cpt, 24, 'AC = 3', C.cyan);

        dDot(A, 'A (∠A = 2π/3)', C.white, { x: -38, y: -14 }, false, true);
        dDot(B, 'B', C.white, { x: -20, y: 14 }, false, true);
        dDot(Cpt, 'C', C.white, { x: 10, y: 14 }, false, true);
        dDot(D, step >= 3 && isBisector ? 'D (AD = 2) [드래그]' : `D (AD = ${lenAD.toFixed(2)}) [드래그]`, C.gold, { x: -45, y: -14 }, true, true);

        setMetric(`현재 AD = ${fmtSurd(lenAD)} | S_ABC = 9√3/2 = S_ABD + S_ACD (각의 이등분선일 때 AD = 2)`);
        return;
      }

      // -----------------------------------------------------------------------
      // 🔥 [심화 01] adv-1: 두 동경의 y=x 대칭과 삼각형 OPQ 성립 조건
      // -----------------------------------------------------------------------
      if (id === 'adv-1') {
        const ox = rect.width * 0.5 + state.panX;
        const oy = rect.height * 0.54 + state.panY;
        const sc = u * 3.0;
        drawAxesWithTicks(rect, ox, oy, sc, true);

        const O = toScr(0, 0, ox, oy, sc);
        state.centerPt = O;

        if (step >= 2) {
          BRD.arc(O, sc, -Math.PI * 0.25, -Math.PI * 1.25, { ccw: true, stroke: false, color: null, fill: `rgba(52, 211, 153, ${0.15 * (step === 2 ? anim : 1)})` }); // [2.0] ctx 직접 그리기 → 무대 호
        }

        dCircle(O, sc, C.cyan, 2.8);

        const theta = Math.max(0.02, Math.min(0.98, t)) * Math.PI * 2;
        const theta5 = (5 * theta) % (Math.PI * 2);

        const Px = Math.cos(theta), Py = Math.sin(theta);
        const Qx = Math.cos(theta5), Qy = Math.sin(theta5);
        const P = toScr(Px, Py, ox, oy, sc);
        const Q = toScr(Qx, Qy, ox, oy, sc);

        if (step >= 1) {
          dLine(toScr(-1.35, -1.35, ox, oy, sc), toScr(1.35, 1.35, ox, oy, sc), C.gold, 2.2, [6, 4], true);
          for (let n = 0; n < 6; n++) {
            const candRad = (n * Math.PI) / 3 + Math.PI / 12;
            const cPt = toScr(Math.cos(candRad), Math.sin(candRad), ox, oy, sc);
            const inUpper = candRad > Math.PI * 0.25 && candRad < Math.PI * 1.25;
            const isDegenerate = n === 2;
            const dotCol = step >= 3
              ? (isDegenerate ? C.red : (inUpper ? C.green : 'rgba(203,213,225,0.45)'))
              : (step >= 2 ? (inUpper ? C.green : 'rgba(203,213,225,0.45)') : C.gold);
            const candLabel = step >= 3
              ? `${fmtPi(candRad)}${isDegenerate ? ' (일직선 제외!)' : (inUpper ? ' (성립)' : '')}`
              : (step >= 1 ? fmtPi(candRad) : '');
            dDot(cPt, candLabel, dotCol, { x: Math.cos(candRad) >= 0 ? 10 : -58, y: Math.sin(candRad) >= 0 ? -10 : 16 }, false);
          }
        }

        if (step >= 3) {
          dLine(toScr(-1.25, 1.25, ox, oy, sc), toScr(1.25, -1.25, ox, oy, sc), 'rgba(251, 113, 133, 0.55)', 2.0, [4, 4]);
        }

        const crossArea = 0.5 * Math.abs(Px * Qy - Py * Qx);
        const isCollinear = crossArea < 0.03;
        dPoly([O, P, Q], isCollinear ? 'rgba(251,113,133,0.18)' : 'rgba(56,189,248,0.22)', isCollinear ? C.red : C.cyan, 2.2);
        dLine(O, P, C.gold, 3.2, [], true);
        dLine(O, Q, C.pink, 2.8, []);

        if (step >= 1) {
          const M = { x: (P.x + Q.x) * 0.5, y: (P.y + Q.y) * 0.5 };
          dLine(P, Q, 'rgba(251,191,36,0.6)', 1.8, [4, 4]);
          dDot(M, '', C.gold, { x: 6, y: -6 }, false);
        }

        dDot(P, `P(θ = ${fmtPi(theta)}) [드래그]`, C.gold, { x: 12, y: -10 }, true, true);
        dDot(Q, 'Q(5θ)', C.pink, { x: 10, y: 16 }, false, true);

        setMetric(
          `현재 θ = ${fmtPi(theta)} | sinθ ${Py > Px ? '>' : '<'} cosθ | △OPQ 넓이 = ${crossArea.toFixed(2)} ${isCollinear ? '(일직선 퇴화!)' : '(삼각형 성립)'}`
        );
        return;
      }

      // -----------------------------------------------------------------------
      // 🔥 [심화 02] adv-2: 단위원과 기울기 -1 직선의 교점 및 대칭 넓이
      // -----------------------------------------------------------------------
      if (id === 'adv-2') {
        const ox = rect.width * 0.34 + state.panX;
        const oy = rect.height * 0.72 + state.panY;
        const sc = u * 4.1;
        drawAxesWithTicks(rect, ox, oy, sc, true);

        const O = toScr(0, 0, ox, oy, sc);
        state.centerPt = O;
        dCircle(O, sc, C.cyan, 2.6);

        const k = 1.02 + t * 0.379157;
        const disc = Math.max(0, 2 - k * k);
        const xP = 0.5 * (k - Math.sqrt(disc));
        const yP = 0.5 * (k + Math.sqrt(disc));
        const xQ = yP;
        const yQ = xP;

        const P = toScr(xP, yP, ox, oy, sc);
        const Q = toScr(xQ, yQ, ox, oy, sc);
        const M = toScr(k * 0.5, k * 0.5, ox, oy, sc);

        const areaOPQ = 0.5 * k * Math.sqrt(Math.max(0, 2 - k * k));
        const isEquilateral = Math.abs(k - Math.sqrt(6) / 2) < 0.015;

        dPoly([O, P, Q], isEquilateral && step >= 1 ? 'rgba(52,211,153,0.25)' : 'rgba(56,189,248,0.20)', isEquilateral && step >= 1 ? C.green : C.cyan, 2.6);
        dLine(toScr(-0.15, k + 0.15, ox, oy, sc), toScr(k + 0.15, -0.15, ox, oy, sc), C.gold, 2.8, [], true);

        if (step >= 1) {
          const angPOQ = Math.acos(Math.max(-1, Math.min(1, xP * xQ + yP * yQ)));
          drawAngleArc(O, Q, P, 34, isEquilateral ? '∠POQ = π/3' : `∠POQ = ${fmtPi(angPOQ)}`, C.green);
        }

        if (step >= 2) {
          dLine(toScr(-0.2, -0.2, ox, oy, sc), toScr(1.15, 1.15, ox, oy, sc), C.pink, 2.2, [6, 4], true);
          drawRightAngle(M, O, P, 11, C.pink);
          drawDimension(O, M, 24, isEquilateral && step >= 3 ? '높이 OM = k/√2 = √3/2' : `OM = ${(k / Math.SQRT2).toFixed(2)}`, C.pink);
          dDot(M, 'M(k/2, k/2)', C.pink, { x: 10, y: -8 }, false);
        }

        dDot(O, 'O(0,0)', C.white, { x: -42, y: 16 }, false, true);
        dDot(P, step >= 3 ? 'P(cos α, sin α) [드래그]' : 'P(α) [드래그]', C.gold, { x: -95, y: -12 }, true, true);
        dDot(Q, step >= 3 ? 'Q(cos β, sin β) = (sin α, cos α)' : 'Q(β)', C.cyan, { x: 12, y: 6 }, false, true);

        setMetric(`현재 k = ${fmtSurd(k)} | △OPQ 넓이 = ${fmtSurd(areaOPQ)} (정삼각형일 때 k = √6/2, sin α sin β = 1/4 ➔ 2k²+4sin α sin β = 4)`);
        return;
      }

      // -----------------------------------------------------------------------
      // 🔥 [심화 03] adv-3: 삼각함수 그래프의 대칭성과 평행사변형 ABDC 넓이
      // -----------------------------------------------------------------------
      if (id === 'adv-3') {
        const ox = rect.width * 0.09 + state.panX;
        const oy = rect.height * 0.54 + state.panY;
        const ux = u * 0.72;
        const uy = u * 0.92;
        drawAxesWithTicks(rect, ox, oy, u, true, 2, ux, uy);

        // x1 in [0.25, 2.75], t = 0.30 => x1 = 1.00, x2 = 5.00, k = 1.50
        const x1 = 0.25 + t * 2.5;
        const x2 = 6 - x1;
        const x3 = 6 + x1;
        const x4 = 12 - x1;
        const k = 3 * Math.sin((Math.PI / 6) * x1);

        const O = toScr(0, 0, ox, oy, ux, uy);
        const A = toScr(x1, k, ox, oy, ux, uy);
        const B = toScr(x2, k, ox, oy, ux, uy);
        const Cpt = toScr(x3, -k, ox, oy, ux, uy);
        const D = toScr(x4, -k, ox, oy, ux, uy);
        const M = toScr(6, 0, ox, oy, ux, uy);

        dPoly([A, B, D, Cpt], 'rgba(56, 189, 248, 0.20)', C.cyan, 2.4);

        if (step >= 1) {
          dLine(toScr(3, -3.4, ox, oy, ux, uy), toScr(3, 3.4, ox, oy, ux, uy), C.gold, 2.0, [5, 4]);
          dLine(O, A, C.green, 2.4, [], true);
          dLine(O, B, C.pink, 2.4, [], true);
          dDot(toScr(3, 3.0, ox, oy, ux, uy), '대칭축 x = 3 (x₁+x₂=6)', C.gold, { x: -55, y: -12 }, false);
        }

        if (step >= 2) {
          drawDimension(A, B, -24, `윗변 AB = ${(x2 - x1).toFixed(1)}`, C.gold);
        }

        if (step >= 3) {
          dLine(A, D, 'rgba(251,191,36,0.65)', 1.8, [4, 4]);
          dLine(B, Cpt, 'rgba(251,191,36,0.65)', 1.8, [4, 4]);
          dDot(M, '점대칭 중심 M(6, 0)', C.gold, { x: -52, y: -14 }, false);
          drawDimension(Cpt, D, 24, `아랫변 CD = ${(x4 - x3).toFixed(1)}`, C.cyan);
        }

        dCurve((x) => 3 * Math.sin((Math.PI / 6) * x), 0, 12, ox, oy, ux, uy, C.cyan, 3.6);
        dLine(toScr(0, k, ox, oy, ux, uy), toScr(12.3, k, ox, oy, ux, uy), C.gold, 2.0, [4, 4]);
        dLine(toScr(0, -k, ox, oy, ux, uy), toScr(12.3, -k, ox, oy, ux, uy), C.gold, 2.0, [4, 4]);

        dDot(A, `A(${x1.toFixed(1)}, ${k.toFixed(2)}) [드래그]`, C.gold, { x: -25, y: -12 }, true, true);
        dDot(B, `B(${x2.toFixed(1)}, ${k.toFixed(2)})`, C.white, { x: 8, y: -12 }, false, true);
        dDot(Cpt, `C(${x3.toFixed(1)}, -${k.toFixed(2)})`, C.white, { x: -35, y: 18 }, false, true);
        dDot(D, `D(${x4.toFixed(1)}, -${k.toFixed(2)})`, C.white, { x: 8, y: 18 }, false, true);

        const areaPara = (x2 - x1) * (2 * k);
        setMetric(`기울기 비 OA : OB = ${(x2 / x1).toFixed(2)} : 1 | k = ${fmtSurd(k)} | 사각형 ABDC 넓이 = ${areaPara.toFixed(2)} (정답: 넓이 = 12)`);
        return;
      }

      // -----------------------------------------------------------------------
      // 🔥 [심화 04] adv-4: 닫힌 구간 [0, 2π]에서 |a sin x + b| = t 의 실근이 3개인 두 경계
      // -----------------------------------------------------------------------
      if (id === 'adv-4') {
        const ox = rect.width * 0.11 + state.panX;
        const oy = rect.height * 0.78 + state.panY;
        const ux = u * 1.15;
        const uy = u * 0.82;
        drawRadianAxesWithTicks(rect, ox, oy, ux, uy, Math.PI / 2);

        const lineT = t * 5.5;
        const ampA = 3, shiftB = -2;

        if (step >= 1) {
          dCurve((x) => ampA * Math.sin(x) + shiftB, 0, Math.PI * 2, ox, oy, ux, uy, 'rgba(56,189,248,0.32)', 1.8, [5, 5]);
          [0, Math.PI, Math.PI * 2].forEach((xv) => {
            dDot(toScr(xv, 2, ox, oy, ux, uy), step >= 2 ? `(${fmtPi(xv)}, |b|=2)` : '', C.pink, { x: -24, y: -12 }, false);
          });
        }

        if (step >= 2) {
          dLine(toScr(0, 1, ox, oy, ux, uy), toScr(Math.PI * 2, 1, ox, oy, ux, uy), C.green, 2.0, [5, 4]);
          dLine(toScr(0, 2, ox, oy, ux, uy), toScr(Math.PI * 2, 2, ox, oy, ux, uy), C.pink, 2.0, [5, 4]);
          dDot(toScr(Math.PI * 0.5, 1, ox, oy, ux, uy), '작은 봉우리 (π/2, a-|b|=1)', C.green, { x: -65, y: -12 }, false);
        }

        if (step >= 3) {
          dLine(toScr(0, 5, ox, oy, ux, uy), toScr(Math.PI * 2, 5, ox, oy, ux, uy), C.gold, 1.8, [5, 4]);
          dDot(toScr(Math.PI * 1.5, 5, ox, oy, ux, uy), '큰 봉우리 최댓값 (3π/2, M=5)', C.gold, { x: -72, y: -12 }, false);
        }

        dCurve((x) => Math.abs(ampA * Math.sin(x) + shiftB), 0, Math.PI * 2, ox, oy, ux, uy, C.cyan, 3.8);

        const roots = [];
        const addSinClosed = (sVal) => {
          if (sVal < -1 - 1e-4 || sVal > 1 + 1e-4) return;
          if (Math.abs(sVal - 1) < 1e-3) {
            roots.push(Math.PI * 0.5);
          } else if (Math.abs(sVal + 1) < 1e-3) {
            roots.push(Math.PI * 1.5);
          } else if (Math.abs(sVal) < 1e-3) {
            roots.push(0, Math.PI, Math.PI * 2);
          } else {
            const cl = Math.max(-1, Math.min(1, sVal));
            const a = Math.asin(cl);
            if (cl > 0) roots.push(a, Math.PI - a);
            else roots.push(Math.PI - a, Math.PI * 2 + a);
          }
        };
        if (Math.abs(lineT) < 1e-3) {
          addSinClosed(2 / 3);
        } else {
          addSinClosed((lineT + 2) / 3);
          addSinClosed((-lineT + 2) / 3);
        }
        roots.sort((a, b) => a - b);
        const uniqueRoots = [];
        for (const r of roots) {
          if (!uniqueRoots.length || Math.abs(r - uniqueRoots[uniqueRoots.length - 1]) > 1e-3) {
            uniqueRoots.push(r);
          }
        }

        const isThree = uniqueRoots.length === 3;
        dLine(
          toScr(-0.2, lineT, ox, oy, ux, uy),
          toScr(Math.PI * 2 + 0.25, lineT, ox, oy, ux, uy),
          isThree ? C.green : C.gold,
          3.0,
          [],
          true
        );

        uniqueRoots.forEach((rx) => {
          dDot(toScr(rx, lineT, ox, oy, ux, uy), '', isThree ? C.green : C.gold, { x: 6, y: -8 }, false, true);
        });
        dDot(toScr(Math.PI * 1.15, lineT, ox, oy, ux, uy), `y = ${lineT.toFixed(2)} [드래그]`, C.gold, { x: 10, y: -10 }, true, true);

        setMetric(`직선 y = ${lineT.toFixed(2)} ➔ 닫힌 구간 [0, 2π] 실근 ${uniqueRoots.length}개 (3개인 t = 1, 2 ➔ a=3, b=-2, M=5)`);
        return;
      }

      // -----------------------------------------------------------------------
      // 🔥 [심화 05] adv-5: 삼각방정식 (2 sin x - 1)(sin x - k) = 0 의 실근 조건
      // -----------------------------------------------------------------------
      if (id === 'adv-5') {
        const ox = rect.width * 0.11 + state.panX;
        const oy = rect.height * 0.54 + state.panY;
        const ux = u * 1.16;
        const uy = u * 2.25;
        drawRadianAxesWithTicks(rect, ox, oy, ux, uy, Math.PI / 2);

        const k = -1.2 + t * 2.4;

        dLine(toScr(-0.2, 0.5, ox, oy, ux, uy), toScr(Math.PI * 2 + 0.2, 0.5, ox, oy, ux, uy), C.green, 2.2, [5, 4]);
        if (step >= 1) {
          dDot(toScr(Math.PI / 6, 0.5, ox, oy, ux, uy), 'π/6 (고정근 ①)', C.green, { x: -35, y: -12 }, false);
          dDot(toScr((5 * Math.PI) / 6, 0.5, ox, oy, ux, uy), '5π/6 (고정근 ②)', C.green, { x: 10, y: -12 }, false);
        }

        if (step >= 2) {
          dLine(toScr(0, 1, ox, oy, ux, uy), toScr(Math.PI * 2, 1, ox, oy, ux, uy), 'rgba(244,114,182,0.5)', 1.6, [4, 4]);
          dLine(toScr(0, -1, ox, oy, ux, uy), toScr(Math.PI * 2, -1, ox, oy, ux, uy), 'rgba(244,114,182,0.5)', 1.6, [4, 4]);
          dDot(toScr(Math.PI * 0.5, 1, ox, oy, ux, uy), 'k = 1 접점 (x = π/2)', C.pink, { x: -48, y: -12 }, false);
          dDot(toScr(Math.PI * 1.5, -1, ox, oy, ux, uy), 'k = -1 접점 (x = 3π/2)', C.pink, { x: -55, y: 20 }, false);
        }

        dCurve((x) => Math.sin(x), 0, Math.PI * 2, ox, oy, ux, uy, C.cyan, 3.8);

        const allRoots = [Math.PI / 6, (5 * Math.PI) / 6];
        if (k >= -1 - 1e-4 && k <= 1 + 1e-4) {
          if (Math.abs(k - 1) < 1e-3) allRoots.push(Math.PI * 0.5);
          else if (Math.abs(k + 1) < 1e-3) allRoots.push(Math.PI * 1.5);
          else if (Math.abs(k) < 1e-3) allRoots.push(0, Math.PI);
          else {
            const cl = Math.max(-1, Math.min(1, k));
            const a = Math.asin(cl);
            if (cl > 0) allRoots.push(a, Math.PI - a);
            else allRoots.push(Math.PI - a, Math.PI * 2 + a);
          }
        }
        allRoots.sort((a, b) => a - b);
        const distinct = [];
        for (const r of allRoots) {
          if (!distinct.length || Math.abs(r - distinct[distinct.length - 1]) > 1e-3) {
            distinct.push(r);
          }
        }

        const isThree = distinct.length === 3;
        dLine(toScr(-0.2, k, ox, oy, ux, uy), toScr(Math.PI * 2 + 0.2, k, ox, oy, ux, uy), isThree ? C.pink : C.gold, 2.8, [], true);
        dDot(toScr(Math.PI * 1.25, k, ox, oy, ux, uy), `y = k (${fmtSurd(k)}) [드래그]`, C.gold, { x: 10, y: -10 }, true, true);

        const sumRoots = distinct.reduce((s, v) => s + v, 0);
        setMetric(`현재 k = ${fmtSurd(k)} ➔ 서로 다른 실근 ${distinct.length}개 | 합 = ${fmtPi(sumRoots)} (k = ±1 일 때 3개, 최대 합 S = 5π/2)`);
        return;
      }

      // -----------------------------------------------------------------------
      // 🔥 [심화 06] adv-6: 외접원 위 삼각형 ABC 의 최대 넓이와 둘레
      // -----------------------------------------------------------------------
      if (id === 'adv-6') {
        const ox = rect.width * 0.5 + state.panX;
        const oy = rect.height * 0.55 + state.panY;
        const sc = u * 1.02;
        drawAxesWithTicks(rect, ox, oy, sc, false);

        const R = 2 * Math.sqrt(3);
        const O = toScr(0, 0, ox, oy, sc);
        state.centerPt = O;
        dCircle(O, R * sc, C.cyan, 2.6);

        const angB = -Math.PI * 0.5 - Math.PI / 3;
        const angC = -Math.PI * 0.5 + Math.PI / 3;
        const mB = { x: R * Math.cos(angB), y: R * Math.sin(angB) };
        const mC = { x: R * Math.cos(angC), y: R * Math.sin(angC) };

        const angA = Math.PI * 0.5 + (t - 0.5) * 1.85;
        const mA = { x: R * Math.cos(angA), y: R * Math.sin(angA) };

        const A = toScr(mA.x, mA.y, ox, oy, sc);
        const B = toScr(mB.x, mB.y, ox, oy, sc);
        const Cpt = toScr(mC.x, mC.y, ox, oy, sc);
        const H = toScr(mA.x, mB.y, ox, oy, sc);
        const M = toScr(0, mB.y, ox, oy, sc);

        const lenAB = Math.hypot(mA.x - mB.x, mA.y - mB.y);
        const lenAC = Math.hypot(mA.x - mC.x, mA.y - mC.y);
        const heightH = Math.max(0, mA.y - mB.y);
        const areaABC = 0.5 * 6 * heightH;
        const isMax = Math.abs(t - 0.5) < 0.025;

        dPoly([A, B, Cpt], isMax && step >= 2 ? 'rgba(52,211,153,0.24)' : 'rgba(56,189,248,0.18)', isMax && step >= 2 ? C.green : C.cyan, 2.8);

        if (step >= 1) {
          dLine(B, Cpt, C.pink, 3.4);
          drawDimension(B, Cpt, 26, '고정 현 BC = 2R sin(π/3) = 6', C.pink);
          drawAngleArc(A, B, Cpt, 24, '∠A = π/3', C.gold);
        }

        if (step >= 2) {
          dLine(toScr(0, -R, ox, oy, sc), toScr(0, R, ox, oy, sc), 'rgba(251,191,36,0.45)', 1.8, [5, 4]);
          dLine(A, H, C.gold, 2.4, [4, 3], true);
          drawRightAngle(H, A, Cpt, 11, C.gold);
          drawDimension(A, H, 28, isMax && step >= 3 ? '최대 높이 h = 3√3' : `높이 h = ${fmtSurd(heightH)}`, C.gold);
          dDot(M, 'M(현의 중점)', C.pink, { x: 8, y: 15 }, false);
        }

        dDot(O, 'O(외심, R=2√3)', C.gold, { x: 10, y: -6 }, false, true);
        dDot(B, 'B', C.white, { x: -22, y: 14 }, false, true);
        dDot(Cpt, 'C', C.white, { x: 10, y: 14 }, false, true);
        dDot(A, `A (AB+AC = ${(lenAB + lenAC).toFixed(2)}) [드래그]`, C.gold, { x: -65, y: -14 }, true, true);

        setMetric(`AB+AC = ${fmtSurd(lenAB + lenAC)} | 넓이 S = ${fmtSurd(areaABC)} (최대: AB=AC=6, L=12, S_max=9√3 ➔ 39)`);
        return;
      }

      // -----------------------------------------------------------------------
      // 🔥 [심화 07] adv-7: 내접사각형의 넓이 비(5:2)와 외접원의 넓이
      // -----------------------------------------------------------------------
      if (id === 'adv-7') {
        const ox = rect.width * 0.5 + state.panX;
        const oy = rect.height * 0.54 + state.panY;
        const sc = u * 1.35;
        drawAxesWithTicks(rect, ox, oy, sc, false);

        const R = Math.sqrt(19 / 3);
        const O = toScr(0, 0, ox, oy, sc);
        state.centerPt = O;
        dCircle(O, R * sc, C.cyan, 2.5);

        const angB = 1.65;
        const dAngAB = 2 * Math.asin(3 / (2 * R));
        const dAngBC = 2 * Math.asin(5 / (2 * R));
        const angA = angB + dAngAB;
        const angC = angB - dAngBC;

        // 점 D가 항상 호 ADC 내부에서만 움직이도록 제한 (t=0.62 일 때 정확히 CD = 2, DA = 3)
        const dAngCDTarget = 2 * Math.asin(2 / (2 * R));
        const angDTarget = angC - dAngCDTarget;
        const angD = angDTarget + (t - 0.62) * 0.85;

        const mA = { x: R * Math.cos(angA), y: R * Math.sin(angA) };
        const mB = { x: R * Math.cos(angB), y: R * Math.sin(angB) };
        const mC = { x: R * Math.cos(angC), y: R * Math.sin(angC) };
        const mD = { x: R * Math.cos(angD), y: R * Math.sin(angD) };
        const mDTarget = { x: R * Math.cos(angDTarget), y: R * Math.sin(angDTarget) };

        const A = toScr(mA.x, mA.y, ox, oy, sc);
        const B = toScr(mB.x, mB.y, ox, oy, sc);
        const Cpt = toScr(mC.x, mC.y, ox, oy, sc);
        const D = toScr(mD.x, mD.y, ox, oy, sc);
        const DTarget = toScr(mDTarget.x, mDTarget.y, ox, oy, sc);

        const lenCD = Math.hypot(mC.x - mD.x, mC.y - mD.y);
        const lenDA = Math.hypot(mD.x - mA.x, mD.y - mA.y);
        const isCondMet = Math.abs(t - 0.62) < 0.03;

        if (step >= 1) {
          dPoly([A, B, Cpt], 'rgba(56, 189, 248, 0.22)', C.cyan, 2.4);
          dPoly([A, Cpt, D], 'rgba(244, 114, 182, 0.22)', C.pink, 2.4);
          drawAngleArc(B, A, Cpt, 22, '∠B = π/3', C.cyan);
          drawAngleArc(D, Cpt, A, 22, '∠D = 2π/3 (불변)', C.pink);
          if (!isCondMet) {
            dDot(DTarget, '조건 위치 (CD=2, DA=3)', 'rgba(251,191,36,0.65)', { x: -55, y: 20 }, false);
          }
        } else {
          dPoly([A, B, Cpt, D], 'rgba(56, 189, 248, 0.16)', C.cyan, 2.6);
        }

        if (step >= 2) {
          dLine(A, Cpt, C.gold, 3.0, [6, 4], true);
          drawDimension(A, Cpt, -18, '대각선 AC = √19', C.gold);
        }

        if (step >= 3) {
          dLine(O, Cpt, C.green, 2.2, [4, 3]);
          dDot(O, 'O (R = √(19/3))', C.green, { x: -35, y: -10 }, false);
        }

        drawDimension(A, B, -22, 'AB = 3', C.cyan);
        drawDimension(B, Cpt, -24, 'BC = 5', C.cyan);
        drawDimension(Cpt, D, 24, isCondMet ? 'CD = 2 (조건 일치!)' : `CD = ${lenCD.toFixed(2)}`, isCondMet ? C.green : C.pink);
        drawDimension(D, A, 24, isCondMet ? 'DA = 3 (넓이 비 5:2!)' : `DA = ${lenDA.toFixed(2)}`, isCondMet ? C.green : C.pink);

        dDot(A, 'A', C.white, { x: -22, y: -8 }, false, true);
        dDot(B, 'B(π/3)', C.white, { x: -18, y: -12 }, false, true);
        dDot(Cpt, 'C', C.white, { x: 10, y: 8 }, false, true);
        dDot(D, 'D(2π/3) [호 위 드래그]', C.gold, { x: -45, y: 20 }, true, true);

        setMetric(`AB·BC = 15, CD·DA = ${(lenCD * lenDA).toFixed(2)} ➔ CD=2, DA=3 일 때 넓이 비 5:2, 외접원 넓이 = 19π/3`);
        return;
      }

      // -----------------------------------------------------------------------
      // 🔥 [심화 08] adv-8: 인접 보각(cos α + cos(π-α) = 0)과 분할 삼각형의 선분 AD
      // -----------------------------------------------------------------------
      if (id === 'adv-8') {
        const ox = rect.width * 0.48 + state.panX;
        const oy = rect.height * 0.68 + state.panY;
        const sc = u * 1.12;
        drawAxesWithTicks(rect, ox, oy, sc, false);

        const c = 5, a = 6, b = 7;
        const cosB = 0.2;
        const sinB = Math.sqrt(1 - cosB * cosB);

        const mB = { x: -3, y: 0 };
        const mC = { x: 3, y: 0 };
        const mA = { x: mB.x + c * cosB, y: c * sinB };

        const ratio = Math.max(0.12, Math.min(0.88, t));
        const lenBD = a * ratio;
        const lenCD = a * (1 - ratio);
        const mD = { x: mB.x + lenBD, y: 0 };

        const A = toScr(mA.x, mA.y, ox, oy, sc);
        const B = toScr(mB.x, mB.y, ox, oy, sc);
        const Cpt = toScr(mC.x, mC.y, ox, oy, sc);
        const D = toScr(mD.x, mD.y, ox, oy, sc);

        const lenAD = Math.hypot(mA.x - mD.x, mA.y - mD.y);
        const isTarget = Math.abs(lenBD - 2) < 0.08;

        if (step >= 1) {
          dPoly([A, B, D], 'rgba(52, 211, 153, 0.20)', C.green, 2.3);
          dPoly([A, D, Cpt], 'rgba(56, 189, 248, 0.20)', C.cyan, 2.3);
          drawDimension(B, D, 24, `BD = ${fmtSurd(lenBD)}`, C.green);
          drawDimension(D, Cpt, 24, `CD = ${fmtSurd(lenCD)}`, C.cyan);
        } else {
          dPoly([A, B, Cpt], 'rgba(56, 189, 248, 0.16)', C.cyan, 2.6);
          drawDimension(B, Cpt, 24, 'BC = 6', C.white);
        }

        if (step >= 2) {
          drawAngleArc(D, A, B, 22, 'α', C.green);
          drawAngleArc(D, Cpt, A, 28, 'π - α', C.pink);
          drawAngleArc(B, Cpt, A, 24, 'cos B = 1/5', C.gold);
        }

        dLine(A, D, C.gold, 3.4, [], true);
        drawDimension(A, B, -24, 'AB = 5', C.green);
        drawDimension(A, Cpt, 24, 'AC = 7', C.cyan);

        dDot(A, 'A', C.white, { x: -8, y: -14 }, false, true);
        dDot(B, 'B', C.white, { x: -20, y: 14 }, false, true);
        dDot(Cpt, 'C', C.white, { x: 10, y: 14 }, false, true);
        dDot(
          D,
          step >= 3 && isTarget ? 'D (1:2 내분점 ➔ AD = 5!) [드래그]' : `D (AD = ${fmtSurd(lenAD)}) [드래그]`,
          C.gold,
          { x: -55, y: -14 },
          true,
          true
        );

        setMetric(`BD = ${lenBD.toFixed(2)}, CD = ${lenCD.toFixed(2)} | cos α + cos(π-α) = 0 ➔ AD = ${fmtSurd(lenAD)} (1:2 내분일 때 AD = 5)`);
        return;
      }
    }

    /* ==========================================================================
       2.0 장면 구성 — 원본의 문항 16개를 '기본 / 심화' 두 묶음(탭) × 8장면으로 나눕니다.
       ========================================================================== */
    const tex = APLab.tex;
    const arrow = (s) => (typeof s === 'string' ? s.replace(/➔/g, '→') : s);
    PROBLEMS.forEach((p) => {
      ['unit', 'badge', 'tabLabel', 'title', 'statement', 'sliderTitle', 'aha', 'alg', 'answer'].forEach((k) => { p[k] = arrow(p[k]); });
      p.snaps.forEach((sn) => { sn.label = arrow(sn.label); });
      p.steps.forEach((st) => { st.title = arrow(st.title); st.desc = arrow(st.desc); });
    });
    // 원본 renderMathHTML: **굵게** 와 $수식$ 을 HTML로 (이모지 꼬리표는 화면에서 뺍니다)
    const rm = (str) => (str ? APLab.stripEmoji(str)
      .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
      .replace(/\$([^$]+)\$/g, (_, m) => tex(m)) : '');
    const stepName = (st) => st.title.replace(/^Step\s*\d+\.\s*/, '');

    // 슬라이더 옆에 보이는 값 (원본 syncSliderReadout)
    const READOUT = {
      'bas-1': (t) => `r=${(2 + 6 * t).toFixed(2)}`,
      'bas-2': (t) => `θ=${fmtPi(0.15 + 1.20366 * t)}`,
      'bas-3': (t) => `k=${(0.15 + 0.78 * t).toFixed(3)}`,
      'bas-4': (t) => `t=${(4.5 * t).toFixed(2)}`,
      'bas-5': (t) => `t=${(-1 + 2 * t).toFixed(2)}`,
      'adv-1': (t) => `θ=${fmtPi(Math.max(0.02, Math.min(0.98, t)) * 2 * Math.PI)}`,
      'adv-2': (t) => `k=${(1.02 + 0.379157 * t).toFixed(3)}`,
      'adv-3': (t) => `x₁=${(0.25 + 2.5 * t).toFixed(2)}`,
      'adv-4': (t) => `t=${(5.5 * t).toFixed(2)}`,
      'adv-5': (t) => `k=${(-1.2 + 2.4 * t).toFixed(2)}`,
      'adv-8': (t) => `BD=${(6 * Math.max(0.12, Math.min(0.88, t))).toFixed(2)}`
    };
    const SHORT = {
      'bas-1': '[01] 부채꼴 최대 넓이', 'bas-2': '[02] 단위원 각변환', 'bas-3': '[03] sin2x 교점의 합', 'bas-4': '[04] 절댓값 교점 개수',
      'bas-5': '[05] 삼각방정식 근', 'bas-6': '[06] 외접원 사인법칙', 'bas-7': '[07] 내접사각형', 'bas-8': '[08] 각의 이등분선',
      'adv-1': '[01] 동경 대칭', 'adv-2': '[02] 단위원과 직선', 'adv-3': '[03] 평행사변형 넓이', 'adv-4': '[04] 실근 3개 경계',
      'adv-5': '[05] 실근 조건 k', 'adv-6': '[06] 최대 넓이', 'adv-7': '[07] 내접사각형 넓이', 'adv-8': '[08] 분할 삼각형'
    };
    const TRAP = ['bas-4', 'adv-1', 'adv-4', 'adv-5'];
    const VERB = { horizontal: '좌우로 끌어', vertical: '위아래로 끌어', angle: '돌려' };
    const initialOf = (p) => (typeof initialSlider === 'function' ? initialSlider(p) : p.defaultT);

    function frame(idx, b, s, v) {
      BRD = b;
      SS = s;
      if (!s.dragging) dragPrev = null;
      state.probIdx = idx;
      state.auxStep = Math.min(3, s.step || 0);
      state.sliderT = s.t;
      state.animT = 1;
      CURRECT = layoutRect(b);
      METRIC = '';
      drawScene(CURRECT);
      if (state.auxStep >= 3 && METRIC) v.summary = METRIC.replace(/➔/g, '→');
      else if (state.auxStep >= 1) v.guide = `보조선 ${state.auxStep}단계: 도형의 대칭과 조건의 경계를 살펴보세요.`;
    }

    function sceneOf(p) {
      const idx = PROBLEMS.indexOf(p);
      const trap = TRAP.includes(p.id);
      const stepsHtml = p.steps.map((st) => `<p><strong>Step ${st.step}. ${rm(stepName(st))}</strong><br>${rm(st.desc)}</p>`).join('');
      return {
        id: p.id,
        title: p.title,
        short: SHORT[p.id],
        question: rm(p.statement),
        guide: `<b>${p.sliderTitle.replace(/[:：]\s*$/, '')}</b> — 조절 막대를 움직이거나 그림의 <b>후광이 있는 점</b>을 ${VERB[p.dragMode] || '끌어'} 보세요. <b>정리</b> 탭에서 Step을 누르면 보조선이 하나씩 나타나고, 3단계까지 보면 정답이 열립니다.`,
        startStep: 0,
        controls: ['t'],
        presets: (s) => (s.step >= 3 ? p.snaps.map((sn) => ({ label: sn.label, set: { t: sn.t }, ms: 450, on: (st) => Math.abs(st.t - sn.t) < 0.003 })) : []),
        steps: p.steps.map(stepName),
        notesTitle: '핵심 발견',
        enter: (s, lab) => {
          s.cur = p.id;
          s.t = initialOf(p);
          if (lab && s === lab.s) { // 실제 장면 입장일 때만 조절 막대의 이름·범위를 이 문항에 맞춥니다(모든 장면 미리보기에서는 건드리지 않음)
            lab.params.t.label = p.sliderTitle.replace(/[:：]\s*$/, '');
            lab.params.t.min = p.id === 'bas-1' ? 0.07 : 0;
          }
        },
        solution: {
          standardTitle: APLab.stripEmoji(p.solType), standardTag: '단계별',
          quickTitle: trap ? '오답 함정 분석' : '풀이 비교', quickTag: trap ? '함정' : '비교',
          standard: { steps: stepsHtml },
          quick: { steps: rm(p.alg) }
        },
        problem: { tag: p.badge, text: rm(p.statement), answer: p.answer, snap: () => ({ t: p.defaultT }) },
        view: (s) => {
          const step = Math.min(3, s.step || 0);
          const out = {};
          if (step >= 1) { const st = p.steps[step - 1]; out.formula = `<p><strong>Step ${st.step}. ${rm(stepName(st))}</strong><br>${rm(st.desc)}</p>`; }
          if (step >= 3) out.notes = rm(p.aha);
          return out;
        },
        draw: (b, s, v) => frame(idx, b, s, v)
      };
    }
    const isAdv = (p) => p.id.startsWith('adv-');
    const groups = [
      { id: 'bas', title: '기본 8문항', short: '기본 8', scenes: PROBLEMS.filter((p) => !isAdv(p)).map(sceneOf) },
      { id: 'adv', title: '심화 8문항', short: '심화 8', scenes: PROBLEMS.filter(isAdv).map(sceneOf) }
    ];

    APLab.createLab({
      id: 'alg-trig-geometry',
      title: '삼각함수와 도형 활용',
      courseName: '대수',
      unit: 'Ⅱ. 삼각함수',
      courseColor: 'var(--m-amber)',
      home: '../index.html#algebra',
