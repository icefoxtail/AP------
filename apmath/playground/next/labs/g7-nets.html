<script>
/* ==========================================================================
   중1 · 전개도와 입체 단면 (AP Math Lab 2.0 이식본) — 6개 탐구관 × 30개 장면
   원본: labs/g7/nets-folding.html
   이식 방식: "호환 이식" — 원본의 내용(getSpec)과 그리기 코드(renderMode1~6, 3D 투영, 면 정렬·꼭짓점 합체 표시)를
   글자 그대로 옮기고, 원본이 캔버스(ctx)에 직접 그리던 부분만 아래 '호환 캔버스'가 새 무대 엔진(APLab.Board)에 연결합니다.
   - 호환 캔버스: 원본의 ctx 호출(moveTo·lineTo·arc·fill·stroke·fillText…)을 받아 무대 좌표(확대·이동·자동 맞춤)로 바꿔 그리고,
     색은 테마(칠판/종이)에 맞는 의미색으로 바꿉니다. 선 굵기·글자 크기는 화면 픽셀 그대로입니다.
   - 원본의 떠 있는 안내 상자·하단 줄자 띠·2D 단면 상자는 무대 카드·하단 띠·단면 상자(작은 화면에서는 축소)로 옮겼습니다.
   원본과 다른 점 (코드 안에는 [2.0 수정] 주석)
   - 빈 곳을 끌면 3D 회전(원본의 마우스·터치 회전과 같은 감도), 확대·축소·이동은 무대 공통 기능
   - 그림 크기는 지금 그림에 맞춰 자동으로 맞춤(접으면 입체가 커지고, 단면 장면은 모든 단면을 담는 크기로 고정) → 휴대폰에서도 그림·이름표가 잘리지 않음
   - 효과가 없는 조작은 표시하지 않음: 반지름·높이·모선 칩은 원기둥류와 원뿔·원뿔대 장면에서만, 관찰 렌즈는 원본 LENS_OFF 표대로
   - 원본에서 그림 위에 겹쳐 그림 일부를 가리던 하단 띠(줄자)는 그림 아래 별도 줄로 분리
   ========================================================================== */
window.addEventListener('DOMContentLoaded', function () {
  const tex = APLab.tex;
  const { clamp } = APLab;
  // 셸은 이모지(➔ ⭕ ❌ 포함)를 화면 표시에서 떼어 내므로, 문장 속 뜻이 사라지지 않게 → ○ × 로 미리 바꿔 넘깁니다(원문 getSpec은 그대로).
  const arrowOnly = (s) => String(s == null ? '' : s).replace(/➔/g, '→').replace(/⭕/g, '○').replace(/❌/g, '×');
  const arrow = (v) => (typeof v === 'string' ? arrowOnly(v) : Array.isArray(v) ? v.map(arrow) : v && typeof v === 'object' ? Object.fromEntries(Object.entries(v).map(([k, x]) => [k, arrow(x)])) : v);

  /* ===== 호환 캔버스: 원본 ctx 호출 → 무대 엔진 =====
     world=true : 좌표를 무대 세계 좌표(project3D 결과)로 보고 화면 좌표로 바꿈
     world=false: 좌표를 화면 픽셀 그대로 사용(꼭짓점 이름표·단면 상자처럼 화면 기준으로 그리는 부분) */
  let B = null;       // 지금 그리는 무대
  let ctx = null;     // 세계 좌표용 호환 캔버스
  let sctx = null;    // 화면 픽셀용 호환 캔버스
  const sink = {};    // 하단 띠를 받아 둘 곳(프레임마다 비움)
  function makeCtx(world) {
    const c = B.ctx;
    const toS = (x, y) => (world ? B.toS(x, y) : { x, y });
    const COLORS = { fillStyle: 1, strokeStyle: 1, shadowColor: 1 };
    const fn = {
      moveTo: (x, y) => { const p = toS(x, y); c.moveTo(p.x, p.y); },
      lineTo: (x, y) => { const p = toS(x, y); c.lineTo(p.x, p.y); },
      arc: (x, y, r, a0, a1, ccw) => { const p = toS(x, y); c.arc(p.x, p.y, world ? r * B.k : r, a0, a1, ccw); },
      // 글자: 테마 후광과 글자 크기 배율(수업 모드)을 적용하고, 최대 너비(maxW)를 넘으면 글자를 줄입니다(원본 fillText의 maxWidth와 같은 뜻).
      fillText: (str, x, y, maxW) => {
        const p = toS(x, y);
        const m = /^(\S+)\s+([\d.]+)px\s+(.*)$/.exec(c.font);
        c.save();
        if (m) {
          let sz = parseFloat(m[2]) * B.fs;
          c.font = `${m[1]} ${sz}px ${m[3]}`;
          if (maxW) {
            const w = c.measureText(str).width;
            if (w > maxW) { sz = Math.max(8, (sz * maxW) / w); c.font = `${m[1]} ${sz}px ${m[3]}`; }
          }
        }
        c.shadowBlur = 0;
        c.lineJoin = 'round';
        c.lineWidth = 3.5;
        c.strokeStyle = B.colors.halo;
        c.strokeText(str, p.x, p.y);
        c.fillText(str, p.x, p.y);
        c.restore();
      }
    };
    return new Proxy(c, {
      get(t, k) {
        if (fn[k]) return fn[k];
        const v = t[k];
        return typeof v === 'function' ? v.bind(t) : v;
      },
      set(t, k, v) {
        if (COLORS[k] && typeof v === 'string') v = B.color(v);
        else if (k === 'lineWidth') v = v * B.lw;
        else if (k === 'shadowBlur' && !B.glowOn) v = 0;
        t[k] = v;
        return true;
      }
    });
  }

  /* ===== 원본 그대로: 상태와 6탭 × 30장면 메뉴 (원본 340–435행) ===== */
    // [2.0] 원본 state 중 화면 조작 값(fold·yaw·pitch·치수·렌즈·부분 강조)은 2.0 셸 상태(s)에서 매 프레임 채웁니다.
    const state = {
      mode: 1,
      subType: { 1: 'cross', 2: 'prism345', 3: 'pyramid4', 4: 'tetra', 5: 'halfCyl', 6: 'coneSlice' },
      conceptSwitch: 'all',
      activePartIdx: -1,
      fold: 0,
      cylR: 3, cylH: 6, coneR: 3, coneA: 6,
      yaw: Math.PI, pitch: (85 * Math.PI) / 180 // [3D 기본] 원본 초깃값(평면도). 2.0 에서는 sync() 가 셸 상태(CAM.iso 시작)로 덮어씁니다.
    };
    const SUB_MENUS = {
      1: [
        { id: 'cross', label: '➕ 1-4-1 십자형 (꼭짓점 A=G=I)' },
        { id: 'T', label: '🎲 1-4-1 ㅗ자형 (마주 보는 면의 눈의 합=7)' },
        { id: 'net231', label: '⚡ 2-3-1 계단형 (Z자 모양)' },
        { id: 'stairs', label: '🪜 2-2-2 계단형' },
        { id: 'invalid', label: '💥 정육면체가 안 되는 전개도 (면이 겹침)' },
        { id: 'shortest', label: '🧵 정육면체 겉면 위의 최단 거리' }
      ],
      2: [
        { id: 'prism345', label: '📐 직각삼각기둥 (밑면의 세 변 3·4·5)' },
        { id: 'cuboid', label: '📦 직육면체 (가로·세로·높이)' },
        { id: 'prismTrap', label: '▱ 사다리꼴기둥 (옆면의 가로 길이의 합)' },
        { id: 'prism5', label: '⬠ 정오각기둥 (7면체)' },
        { id: 'prism6', label: '⬡ 정육각기둥 (8면체)' }
      ],
      3: [
        { id: 'pyramid4', label: '⛺ 정사각뿔 (V₁~V₄가 한 점으로 모임)' },
        { id: 'pyramid3', label: '🔺 삼각뿔 전개도 (4면체)' },
        { id: 'pyramid5', label: '⭐ 정오각뿔 전개도 (6면체)' },
        { id: 'frustum4', label: '🏜️ 정사각뿔대 (옆면이 사다리꼴)' }
      ],
      4: [
        { id: 'tetra', label: '💎 정사면체 (4면 · A=E=F)' },
        { id: 'octa', label: '💠 정팔면체 (8면)' },
        { id: 'dodeca', label: '🌸 정십이면체 (정오각형 12면)' },
        { id: 'icosa', label: '🔷 정이십면체 (정삼각형 20면)' },
        { id: 'flat6', label: '🚫 정삼각형 6개로는 왜 입체가 안 될까? (360°)' }
      ],
      5: [
        { id: 'halfCyl', label: '🌓 반원기둥 (직사각형인 면 2rh를 더함)' },
        { id: 'cylinder', label: '🛢️ 원기둥 (옆면의 가로 길이 2πr)' },
        { id: 'sectorCyl', label: '🍰 부채꼴기둥 (중심각 90°)' },
        { id: 'hollowCyl', label: '🧻 구멍 뚫린 원기둥 (안쪽 옆면 포함)' }
      ],
      6: [
        { id: 'coneSlice', label: '🔪 원뿔을 자른 4가지 단면' },
        { id: 'revSlice', label: '🔪 원기둥·원뿔대·구 단면 비교' },
        { id: 'cubeSlice', label: '🔪 정육면체의 단면 (삼각형~육각형)' },
        { id: 'cone', label: '🎉 원뿔 옆면의 중심각 (θ = r/a × 360°)' },
        { id: 'coneShort', label: '🧵 원뿔 옆면을 한 바퀴 도는 최단 거리' },
        { id: 'frustumCone', label: '🥤 원뿔대 전개도 (옆면: 부채꼴 모양의 띠)' }
      ]
    };

  /* ===== 원본 그대로: 3D 벡터·경첩 회전 (원본 440–469행) ===== */
    function vecAdd(a, b) { return { x: a.x + b.x, y: a.y + b.y, z: a.z + b.z }; }
    function vecSub(a, b) { return { x: a.x - b.x, y: a.y - b.y, z: a.z - b.z }; }
    function vecScale(v, s) { return { x: v.x * s, y: v.y * s, z: v.z * s }; }
    function vecDot(a, b) { return a.x * b.x + a.y * b.y + a.z * b.z; }
    function vecCross(a, b) {
      return { x: a.y * b.z - a.z * b.y, y: a.z * b.x - a.x * b.z, z: a.x * b.y - a.y * b.x };
    }
    function vecNorm(v) {
      const len = Math.hypot(v.x, v.y, v.z) || 1;
      return { x: v.x / len, y: v.y / len, z: v.z / len };
    }
    function rotateAroundAxis(p, hingeP1, hingeP2, angle) {
      if (Math.abs(angle) < 1e-6) return { ...p };
      const k = vecNorm(vecSub(hingeP2, hingeP1));
      const v = vecSub(p, hingeP1);
      const cosA = Math.cos(angle), sinA = Math.sin(angle);
      const crossKV = vecCross(k, v), dotKV = vecDot(k, v);
      return vecAdd(hingeP1, {
        x: v.x * cosA + crossKV.x * sinA + k.x * dotKV * (1 - cosA),
        y: v.y * cosA + crossKV.y * sinA + k.y * dotKV * (1 - cosA),
        z: v.z * cosA + crossKV.z * sinA + k.z * dotKV * (1 - cosA)
      });
    }
    function applyHingeChain(pt, chain) {
      let cur = { ...pt };
      for (let i = chain.length - 1; i >= 0; i--) {
        cur = rotateAroundAxis(cur, chain[i].p1, chain[i].p2, chain[i].angle);
      }
      return cur;
    }

  /* ===== 투영 (원본 project3D 와 같은 수식) =====
     [2.0] 원본은 캔버스 크기·scale·offset 으로 화면 픽셀을 바로 구했지만, 2.0 은 '무대 세계 좌표'를 돌려주고
     확대·이동·화면 맞춤은 무대가 맡습니다. y 는 도형(figure) 좌표처럼 아래쪽이 +입니다. */
  function project3D(mathX, mathY, mathZ) {
    const vx = mathX, vy = mathZ, vz = -mathY;
    const cosY = Math.cos(state.yaw), sinY = Math.sin(state.yaw);
    const x1 = vx * cosY - vz * sinY;
    const z1 = vx * sinY + vz * cosY;
    const cosP = Math.cos(state.pitch), sinP = Math.sin(state.pitch);
    const y2 = vy * cosP - z1 * sinP;
    const z2 = vy * sinP + z1 * cosP;
    const fov = 28;
    const persp = fov / (fov + z2 * 0.14);
    return { x: x1 * persp, y: -y2 * persp, depth: z2 };
  }
  // 3D 점 → 화면 픽셀 (이름표·눈금처럼 화면 기준으로 그리는 부분용)
  function S(p) {
    const w = project3D(p.x, p.y, p.z);
    const s = B.toS(w.x, w.y);
    return { x: s.x, y: s.y, depth: w.depth };
  }
  let netFrameCapture = false;
  let netCapturedFaces = null;
  let netVisibleFaces = null;
  let trackedNetCache = { key: null, data: null };

    function draw3DLine(p1, p2, color = '#ffffff', width = 2.2, dashed = false, glow = false) {
      if (netFrameCapture) return;
      const s1 = project3D(p1.x, p1.y, p1.z);
      const s2 = project3D(p2.x, p2.y, p1.z !== undefined ? p2.z : 0);
      ctx.save();
      ctx.beginPath();
      if (dashed) ctx.setLineDash([6, 5]);
      ctx.strokeStyle = color;
      ctx.lineWidth = width;
      ctx.lineCap = 'round';
      if (glow) { ctx.shadowColor = color; ctx.shadowBlur = 12; }
      ctx.moveTo(s1.x, s1.y);
      ctx.lineTo(s2.x, s2.y);
      ctx.stroke();
      ctx.restore();
    }

    // [2.0] 눈금 길이·간격은 화면 픽셀 기준이라 화면 좌표(S)로 계산해 sctx 로 그립니다.
    function draw3DTickMarks(p1, p2, count = 1, color = '#fbbf24', size = 6.5) {
      if (netFrameCapture) return;
      if (state.conceptSwitch !== 'zipper' && state.conceptSwitch !== 'all') return;
      const s1 = S(p1);
      const s2 = S(p2);
      const mx = (s1.x + s2.x) / 2, my = (s1.y + s2.y) / 2;
      const dx = s2.x - s1.x, dy = s2.y - s1.y;
      const len = Math.hypot(dx, dy) || 1;
      if (len < 12) return;
      const ux = dx / len, uy = dy / len;
      const nx = -uy, ny = ux;
      const gap = 4.5;

      sctx.save();
      sctx.strokeStyle = color;
      sctx.lineWidth = 2.2;
      for (let i = 0; i < count; i++) {
        const offset = (i - (count - 1) / 2) * gap;
        const cx = mx + ux * offset, cy = my + uy * offset;
        sctx.beginPath();
        sctx.moveTo(cx - nx * size, cy - ny * size);
        sctx.lineTo(cx + nx * size, cy + ny * size);
        sctx.stroke();
      }
      sctx.restore();
    }

    function draw3DRightAngle(P, A, B, ratio = 0.22, color = '#38bdf8') {
      if (netFrameCapture) return;
      const vA = vecSub(A, P), vB = vecSub(B, P);
      const p1 = vecAdd(P, vecScale(vA, ratio));
      const p3 = vecAdd(P, vecScale(vB, ratio));
      const p2 = vecAdd(p1, vecScale(vB, ratio));

      const sP = project3D(P.x, P.y, P.z);
      const s1 = project3D(p1.x, p1.y, p1.z);
      const s2 = project3D(p2.x, p2.y, p2.z);
      const s3 = project3D(p3.x, p3.y, p3.z);

      ctx.save();
      ctx.beginPath();
      ctx.moveTo(s1.x, s1.y); ctx.lineTo(s2.x, s2.y); ctx.lineTo(s3.x, s3.y);
      ctx.strokeStyle = color; ctx.lineWidth = 2.2; ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(sP.x, sP.y); ctx.lineTo(s1.x, s1.y); ctx.lineTo(s2.x, s2.y); ctx.lineTo(s3.x, s3.y);
      ctx.closePath();
      ctx.fillStyle = 'rgba(56, 189, 248, 0.24)';
      ctx.fill();
      ctx.restore();
    }

    function renderMerged3DVertices(vertList, opts = {}) {
      if (netFrameCapture) return;
      if (state.conceptSwitch !== 'def' && state.conceptSwitch !== 'zipper' && state.conceptSwitch !== 'all') return;
      const groups = [];
      vertList.forEach((v) => {
        const found = groups.find((g) => Math.hypot(g.pt.x - v.pt.x, g.pt.y - v.pt.y, g.pt.z - v.pt.z) < 0.04);
        if (found) {
          if (!found.labels.includes(v.label)) found.labels.push(v.label);
          if (v.highlight) found.highlight = true;
          if (v.color && v.highlight) found.color = v.color;
        } else {
          groups.push({
            pt: v.pt,
            labels: [v.label],
            color: v.color || '#fef08a',
            highlight: !!v.highlight
          });
        }
      });

      const center2D = S({ x: 0, y: 0, z: 0.4 });
      const viewport = { width: B.W, height: B.H, left: 0, top: 0 };
      const occluders = opts.faces && state.fold > 0.52
        ? opts.faces.map(face => face.pts.map(p => S(p))) : [];
      // 면의 평균 깊이 대신 투영된 해당 픽셀에서의 삼각형 보간 깊이를 사용한다.
      // 이렇게 해야 실제 앞면의 꼭짓점까지 잘못 숨기는 현상을 막는다.
      function projectedFaceDepth(p, polygon) {
        let nearest = Infinity;
        const A = polygon[0];
        for (let i = 1; i < polygon.length - 1; i++) {
          const B=polygon[i], C=polygon[i+1];
          const d=(B.y-C.y)*(A.x-C.x)+(C.x-B.x)*(A.y-C.y);

  /* ===== 원본 그대로: 전개도 꼭짓점 추적과 6개 탐구관 그리기 (원본 1366–2536행) ===== */
    // 전개도(0%)와 완성 겨냥도(100%)를 같은 도형 생성기에서 계산한다.
    // 한 면 안의 분할점이 아닌 실제 다면체 꼭짓점만 전체 표시한다.
    // 곡면은 수학적 꼭짓점이 없으므로 이음매·밑면의 대표 경계점만 표시한다.
    function trackedNetKind() {
      const m=state.mode, sub=state.subType[m];
      if (m===2 || m===3) return 'polyhedron';
      if (m===5) return 'seam';
      if (m===6 && sub==='frustumCone') return 'seam';
      return null; // 기존 정육면체·정사면체·정팔면체 이름 보존 / 정십이·이십면체 제외
    }
    function capturedNetFrame(fold) {
      const oldFold = state.fold;
      netFrameCapture = true;
      netCapturedFaces = null;
      try {
        state.fold=fold;
        const bounds={width:800,height:600}; // [2.0] 캡처 중에는 그리지 않으므로 크기는 쓰이지 않음
        if(state.mode===2) renderMode2Prisms(bounds);
        else if(state.mode===3) renderMode3Pyramids(bounds);
        else if(state.mode===5) renderMode5Cylinders(bounds);
        else if(state.mode===6) renderMode6ConesAndSlices(bounds);
        return (netCapturedFaces||[]).map(face=>face.pts.map(p=>({...p})));
      } finally {
        state.fold=oldFold;
        netFrameCapture=false;
        netCapturedFaces=null;
      }
    }
    function distance3D(a,b) { return Math.hypot(a.x-b.x,a.y-b.y,a.z-b.z); }
    function trackedNetData() {
      const kind=trackedNetKind();
      if(!kind) return null;
      const sub=state.subType[state.mode];
      const key=[state.mode,sub,state.cylR,state.cylH,state.coneR,state.coneA].join('|');
      if(trackedNetCache.key===key) return trackedNetCache.data;
      const open=capturedNetFrame(0), closed=capturedNetFrame(1);
      const verts=[];
      open.forEach((face,fi)=>face.forEach((p,vi)=>{
        let item=verts.find(q=>distance3D(q.flat,p)<0.0001);
        if(!item){item={flat:p,refs:[]};verts.push(item);}
        item.refs.push([fi,vi]);
      }));
      const chosen = new Set();
      const choose=(fi,...indices)=>{
        if(!open[fi])return;
        indices.forEach(vi=>{
          const v=verts.findIndex(q=>q.refs.some(([i,j])=>i===fi && j===vi));
          if(v>=0)chosen.add(v);
        });
      };
      if(kind==='polyhedron') verts.forEach((v,i)=>chosen.add(i));
      else if(state.mode===5){
        if(sub==='cylinder'){choose(0,0,3);choose(27,1,2);choose(28,0);choose(29,0);}
        if(sub==='halfCyl'){choose(0,0,1,2,3);choose(1,0,3);choose(18,1,2);}
        if(sub==='sectorCyl'){choose(0,0,1,2,3);choose(1,0,1,2,3);choose(2,0,3);choose(13,1,2);}
        if(sub==='hollowCyl'){choose(0,0,3);choose(46,1,2);choose(1,0,3);choose(47,1,2);}
      } else if(sub==='frustumCone'){
        choose(0,0,3);choose(27,1,2);choose(28,0);choose(29,0);
      }
      const points=[...chosen].sort((a,b)=>a-b).map((i,order)=>{
        const v=verts[i], [fi,vi]=v.refs[0];
        return {label:order<26?String.fromCharCode(65+order):'A'+(order-25),flat:v.flat,refs:v.refs,closed:closed[fi]?.[vi]};
      }).filter(p=>p.closed);
      // 동일한 펼친 점은 여러 면에 붙어 있어도 반드시 한 글자만 쓴다.
      // 완전히 접힌 위치가 실제로 일치하는 경우에만 'A=B' 관계를 인정한다.
      const groups=[];
      points.forEach(p=>{
        let group=groups.find(g=>distance3D(g.center,p.closed)<0.025);
        if(group)group.labels.push(p.label);
        else groups.push({center:p.closed,labels:[p.label]});
      });
      const seams=groups.filter(g=>g.labels.length>1).map(g=>g.labels.join('='));
      const mismatched = points.filter(p=>p.refs.some(([fi,vi])=>!closed[fi]||distance3D(closed[fi][vi],p.closed)>0.035));
      const data={key,kind,points,seams,mismatched:mismatched.length,closedVertices:groups.length,
        flatVertices:verts.length,frameCount:open.length,closed};
      trackedNetCache={key,data};
      return data;
    }
    function renderTrackedNetVertices() {
      const data=trackedNetData();
      if(!data || data.mismatched || !netVisibleFaces)return;
      const anchors=data.points.map(v=>{
        const [fi,vi]=v.refs[0];
        return {pt:netVisibleFaces[fi]?.pts[vi]||v.flat,label:v.label,
                color:data.kind==='seam'?'#67e8f9':'#fef08a',highlight:false};
      });
      renderMerged3DVertices(anchors,{faces:data.kind==='polyhedron'?netVisibleFaces:null,avoidBanner:true});
    }

    // =========================================================================
    // [모드 1 렌더링] 정육면체 족보 + 불량 전개도 + 최단거리
    // =========================================================================
    function renderMode1CubeFamily(rect) {
      const sub = state.subType[1];
      const ang = state.fold * (Math.PI / 2);

      const cPair1 = 'rgba(251, 191, 36, 0.44)';
      const cPair2 = 'rgba(56, 189, 248, 0.44)';
      const cPair3 = 'rgba(244, 114, 182, 0.44)';
      const sPair1 = '#fbbf24', sPair2 = '#38bdf8', sPair3 = '#f472b6';

      function makeRect(x0, y0, x1, y1) {
        return [{ x: x0, y: y0, z: 0 }, { x: x1, y: y0, z: 0 }, { x: x1, y: y1, z: 0 }, { x: x0, y: y1, z: 0 }];
      }

      const L = 1.55, h = L / 2;
      const hNorth = { p1: { x: -h, y: h, z: 0 }, p2: { x: h, y: h, z: 0 }, angle: ang };
      const hSouth = { p1: { x: h, y: -h, z: 0 }, p2: { x: -h, y: -h, z: 0 }, angle: ang };
      const hWest = { p1: { x: -h, y: -h, z: 0 }, p2: { x: -h, y: h, z: 0 }, angle: ang };
      const hEast = { p1: { x: h, y: h, z: 0 }, p2: { x: h, y: -h, z: 0 }, angle: ang };
      const hEast2 = { p1: { x: h + L, y: h, z: 0 }, p2: { x: h + L, y: -h, z: 0 }, angle: ang };

      let faces = [], matchEdges = [], allVerts = [];

      if (sub === 'cross' || sub === 'T' || sub === 'shortest') {
        const xShift = sub === 'T' ? -L : 0;
        const topParentHinge = sub === 'T'
          ? [hWest, { p1: { x: -h - L, y: h, z: 0 }, p2: { x: -h, y: h, z: 0 }, angle: ang }]
          : [hNorth];

        const rawC = makeRect(-h, -h, h, h);
        const rawA = makeRect(-h + xShift, h, h + xShift, h + L).map((p) => applyHingeChain(p, topParentHinge));
        const rawF = makeRect(-h, -h - L, h, -h).map((p) => applyHingeChain(p, [hSouth]));
        const rawB = makeRect(-h - L, -h, -h, h).map((p) => applyHingeChain(p, [hWest]));
        const rawD = makeRect(h, -h, h + L, h).map((p) => applyHingeChain(p, [hEast]));
        const rawE = makeRect(h + L, -h, h + 2 * L, h).map((p) => applyHingeChain(p, [hEast, hEast2]));

        const isDice = sub === 'T';
        faces = [
          { pts: rawC, label: isDice ? '㈐ (눈 1)' : '㈐ (바닥)', fillColor: cPair3, strokeColor: sPair3, partIdx: 2 },
          { pts: rawE, label: isDice ? '㈒ (눈 6, 합 7)' : '㈒ (뚜껑)', fillColor: cPair3, strokeColor: sPair3, partIdx: 2 },
          { pts: rawA, label: isDice ? '㈎ (눈 2)' : '㈎ (뒷면)', fillColor: cPair1, strokeColor: sPair1, partIdx: 0 },
          { pts: rawF, label: isDice ? '㈓ (눈 5, 합 7)' : '㈓ (앞면)', fillColor: cPair1, strokeColor: sPair1, partIdx: 0 },
          { pts: rawB, label: isDice ? '㈏ (눈 3)' : '㈏ (왼면)', fillColor: cPair2, strokeColor: sPair2, partIdx: 1 },
          { pts: rawD, label: isDice ? '㈑ (눈 4, 합 7)' : '㈑ (오른면)', fillColor: cPair2, strokeColor: sPair2, partIdx: 1 }
        ];

        allVerts = [
          { pt: rawA[3], label: 'A', color: '#fbbf24', highlight: true },
          { pt: rawA[0], label: 'B', color: '#fef08a' },
          { pt: rawA[1], label: 'C', color: '#fef08a' },
          { pt: rawA[2], label: 'D', color: '#38bdf8', highlight: true },
          { pt: rawD[2], label: 'E', color: '#38bdf8', highlight: true },
          { pt: rawE[2], label: 'G', color: '#38bdf8', highlight: true },
          { pt: rawE[1], label: 'H', color: '#f472b6' },
          { pt: rawD[1], label: 'M', color: '#fef08a' },
          { pt: rawF[1], label: 'N', color: '#f472b6' },
          { pt: rawF[0], label: 'L', color: '#f472b6' },
          { pt: rawC[0], label: 'J', color: '#fef08a' },
          { pt: rawB[0], label: 'K', color: '#fbbf24', highlight: true },
          { pt: rawB[3], label: 'I', color: '#fbbf24', highlight: true },
          { pt: rawC[1], label: 'F', color: '#fef08a' }
        ];

        matchEdges = [
          { p1: rawA[0], p2: rawA[3], color: '#fbbf24', ticks: 1 },
          { p1: rawB[2], p2: rawB[3], color: '#fbbf24', ticks: 1 },
          { p1: rawA[1], p2: rawA[2], color: '#38bdf8', ticks: 2 },
          { p1: rawD[3], p2: rawD[2], color: '#38bdf8', ticks: 2 }
        ];

        renderSortedFaces(faces);

        if (sub === 'shortest') {
          const pStart = rawC[0];
          const pMid = { x: h, y: 0, z: 0 };
          const pEnd = rawD[2];
          draw3DLine(pStart, pMid, '#fbbf24', 5.5, false, true);
          draw3DLine(pMid, pEnd, '#fbbf24', 5.5, false, true);
          allVerts.push({ pt: pMid, label: 'M(중점)', color: '#34d399', highlight: true });
        }
      } else if (sub === 'net231') {
        const hB_North = { p1: { x: -h - L, y: h, z: 0 }, p2: { x: -h, y: h, z: 0 }, angle: ang };
        const rawC = makeRect(-h, -h, h, h);
        const rawB = makeRect(-h - L, -h, -h, h).map((p) => applyHingeChain(p, [hWest]));
        const rawA = makeRect(-h - L, h, -h, h + L).map((p) => applyHingeChain(p, [hWest, hB_North]));
        const rawF = makeRect(-h, -h - L, h, -h).map((p) => applyHingeChain(p, [hSouth]));
        const rawD = makeRect(h, -h, h + L, h).map((p) => applyHingeChain(p, [hEast]));
        const rawE = makeRect(h + L, -h, h + 2 * L, h).map((p) => applyHingeChain(p, [hEast, hEast2]));

        faces = [
          { pts: rawC, label: '㈐ (바닥)', fillColor: cPair3, strokeColor: sPair3, partIdx: 2 },
          { pts: rawE, label: '㈒ (㈐와 평행)', fillColor: cPair3, strokeColor: sPair3, partIdx: 2 },
          { pts: rawA, label: '㈎ (뒷면)', fillColor: cPair1, strokeColor: sPair1, partIdx: 0 },
          { pts: rawF, label: '㈓ (㈎와 평행)', fillColor: cPair1, strokeColor: sPair1, partIdx: 0 },
          { pts: rawB, label: '㈏ (왼면)', fillColor: cPair2, strokeColor: sPair2, partIdx: 1 },
          { pts: rawD, label: '㈑ (㈏와 평행)', fillColor: cPair2, strokeColor: sPair2, partIdx: 1 }
        ];
        allVerts = [
          { pt: rawA[3], label: 'I', color: '#fbbf24', highlight: true },
          { pt: rawA[2], label: 'A', color: '#38bdf8', highlight: true },
          { pt: rawB[2], label: 'B', color: '#fef08a' },
          { pt: rawC[2], label: 'C', color: '#fef08a' },
          { pt: rawD[2], label: 'E', color: '#38bdf8', highlight: true },
          { pt: rawE[2], label: 'G', color: '#fbbf24', highlight: true },
          { pt: rawB[0], label: 'K', color: '#fbbf24', highlight: true },
          { pt: rawF[0], label: 'L', color: '#f472b6' },
          { pt: rawF[1], label: 'N', color: '#f472b6' }
        ];
        matchEdges = [
          { p1: rawA[1], p2: rawA[2], color: '#38bdf8', ticks: 1 },
          { p1: rawC[3], p2: rawC[2], color: '#38bdf8', ticks: 1 },
          { p1: rawB[0], p2: rawB[1], color: '#f472b6', ticks: 2 },
          { p1: rawF[0], p2: rawF[3], color: '#f472b6', ticks: 2 }
        ];
        renderSortedFaces(faces);
      } else if (sub === 'stairs') {
        const hB_North = { p1: { x: -h - L, y: h, z: 0 }, p2: { x: -h, y: h, z: 0 }, angle: ang };
        const hF_East = { p1: { x: h, y: -h, z: 0 }, p2: { x: h, y: -h - L, z: 0 }, angle: ang };
        const hD_South = { p1: { x: h + L, y: -h - L, z: 0 }, p2: { x: h, y: -h - L, z: 0 }, angle: ang };

        const rawC = makeRect(-h, -h, h, h);
        const rawB = makeRect(-h - L, -h, -h, h).map((p) => applyHingeChain(p, [hWest]));
        const rawA = makeRect(-h - L, h, -h, h + L).map((p) => applyHingeChain(p, [hWest, hB_North]));
        const rawF = makeRect(-h, -h - L, h, -h).map((p) => applyHingeChain(p, [hSouth]));
        const rawD = makeRect(h, -h - L, h + L, -h).map((p) => applyHingeChain(p, [hSouth, hF_East]));
        const rawE = makeRect(h, -h - 2 * L, h + L, -h - L).map((p) => applyHingeChain(p, [hSouth, hF_East, hD_South]));

        faces = [
          { pts: rawC, label: '㈐', fillColor: cPair3, strokeColor: sPair3, partIdx: 2 },
          { pts: rawE, label: '㈒ (㈐와 평행)', fillColor: cPair3, strokeColor: sPair3, partIdx: 2 },
          { pts: rawA, label: '㈎', fillColor: cPair1, strokeColor: sPair1, partIdx: 0 },
          { pts: rawF, label: '㈓ (㈎와 평행)', fillColor: cPair1, strokeColor: sPair1, partIdx: 0 },
          { pts: rawB, label: '㈏', fillColor: cPair2, strokeColor: sPair2, partIdx: 1 },
          { pts: rawD, label: '㈑ (㈏와 평행)', fillColor: cPair2, strokeColor: sPair2, partIdx: 1 }
        ];
        allVerts = [
          { pt: rawA[3], label: 'I', color: '#fbbf24', highlight: true },
          { pt: rawA[2], label: 'A', color: '#38bdf8', highlight: true },
          { pt: rawC[2], label: 'C', color: '#38bdf8', highlight: true },
          { pt: rawD[1], label: 'D', color: '#38bdf8', highlight: true },
          { pt: rawE[1], label: 'G', color: '#fbbf24', highlight: true },
          { pt: rawE[0], label: 'H', color: '#f472b6' },
          { pt: rawB[0], label: 'K', color: '#fbbf24', highlight: true }
        ];
        matchEdges = [
          { p1: rawA[1], p2: rawA[2], color: '#38bdf8', ticks: 1 },
          { p1: rawC[3], p2: rawC[2], color: '#38bdf8', ticks: 1 },
          { p1: rawC[1], p2: rawC[2], color: '#f472b6', ticks: 2 },
          { p1: rawD[0], p2: rawD[1], color: '#f472b6', ticks: 2 }
        ];
        renderSortedFaces(faces);
      } else if (sub === 'invalid') {
        const hD_South = { p1: { x: h + L, y: -h, z: 0 }, p2: { x: h, y: -h, z: 0 }, angle: ang };
        const rawC = makeRect(-h, -h, h, h);
        const rawB = makeRect(-h - L, -h, -h, h).map((p) => applyHingeChain(p, [hWest]));
        const rawD = makeRect(h, -h, h + L, h).map((p) => applyHingeChain(p, [hEast]));
        const rawE = makeRect(h + L, -h, h + 2 * L, h).map((p) => applyHingeChain(p, [hEast, hEast2]));
        const rawA = makeRect(-h, -h - L, h, -h).map((p) => applyHingeChain(p, [hSouth]));
        const rawF = makeRect(h, -h - L, h + L, -h).map((p) => applyHingeChain(p, [hEast, hD_South]));

        const isClash = state.fold > 0.72;
        const clashFill = isClash ? 'rgba(244, 63, 94, 0.75)' : 'rgba(244, 63, 94, 0.42)';

        faces = [
          { pts: rawC, label: '㈐ (바닥)', fillColor: cPair2, strokeColor: sPair2, partIdx: 0 },
          { pts: rawB, label: '㈏ (왼면)', fillColor: cPair3, strokeColor: sPair3, partIdx: 0 },
          { pts: rawD, label: '㈑ (오른면)', fillColor: cPair3, strokeColor: sPair3, partIdx: 0 },
          { pts: rawE, label: '㈒ (뚜껑)', fillColor: cPair2, strokeColor: sPair2, partIdx: 0 },
          { pts: rawA, label: isClash ? '💥 ㈎와 ㈓가 겹침' : '㈎ (앞으로 접힘)', fillColor: clashFill, strokeColor: '#f43f5e', lineWidth: 3.2, partIdx: 1 },
          { pts: rawF, label: isClash ? '💥 ㈎와 ㈓가 겹침' : '㈓ (앞으로 접힘)', fillColor: clashFill, strokeColor: '#fbbf24', lineWidth: 3.2, partIdx: 1 }
        ];
        renderSortedFaces(faces);
      }

      if (matchEdges.length > 0) {
        matchEdges.forEach((e) => {
          draw3DLine(e.p1, e.p2, e.color, 4.2, false, true);
          if (e.ticks) draw3DTickMarks(e.p1, e.p2, e.ticks, e.color, 7);
        });
      }

      renderMerged3DVertices(allVerts);
      drawBottomTapeBanner(
        rect,
        sub === 'invalid'
          ? '❌ 4칸 한 줄의 아래쪽에만 2칸이 붙어 있으면 면 ㈎와 면 ㈓가 앞면 자리에서 겹칩니다.'
          : sub === 'shortest'
          ? '🧵 입체의 겉면 위의 최단 거리 = 지나가는 면을 한 평면에 펼쳤을 때 두 점을 곧게 이은 선분'
          : (sub === 'cross' ? '📌 기본 십자형: A=G=I, H=L=K, D=E, M=N' : '📌 평행한 면 3쌍과 접었을 때 겹치는 꼭짓점을 확인하세요')
      );
    }

    // =========================================================================
    // [모드 2 렌더링] 각기둥 패밀리
    // =========================================================================
    function renderMode2Prisms(rect) {
      const sub = state.subType[2];
      const f = state.fold;

      if (sub === 'cuboid') {
        const wx = 1.2, wy = 0.85, hz = 0.7;
        const ang = f * (Math.PI / 2);
        const makeR = (x0, y0, x1, y1) => [
          { x: x0, y: y0, z: 0 }, { x: x1, y: y0, z: 0 }, { x: x1, y: y1, z: 0 }, { x: x0, y: y1, z: 0 }
        ];
        const hNorth = { p1: { x: -wx, y: wy, z: 0 }, p2: { x: wx, y: wy, z: 0 }, angle: ang };
        const hSouth = { p1: { x: wx, y: -wy, z: 0 }, p2: { x: -wx, y: -wy, z: 0 }, angle: ang };
        const hWest = { p1: { x: -wx, y: -wy, z: 0 }, p2: { x: -wx, y: wy, z: 0 }, angle: ang };
        const hEast = { p1: { x: wx, y: wy, z: 0 }, p2: { x: wx, y: -wy, z: 0 }, angle: ang };
        const hEast2 = { p1: { x: wx + hz, y: wy, z: 0 }, p2: { x: wx + hz, y: -wy, z: 0 }, angle: ang };

        const fBase = makeR(-wx, -wy, wx, wy);
        const fBack = makeR(-wx, wy, wx, wy + hz).map((p) => applyHingeChain(p, [hNorth]));
        const fFront = makeR(-wx, -wy - hz, wx, -wy).map((p) => applyHingeChain(p, [hSouth]));
        const fLeft = makeR(-wx - hz, -wy, -wx, wy).map((p) => applyHingeChain(p, [hWest]));
        const fRight = makeR(wx, -wy, wx + hz, wy).map((p) => applyHingeChain(p, [hEast]));
        const fTop = makeR(wx + hz, -wy, wx + hz + 2 * wx, wy).map((p) => applyHingeChain(p, [hEast, hEast2]));

        renderSortedFaces([
          { pts: fBase, label: '밑면 (4×3)', fillColor: 'rgba(244, 114, 182, 0.42)', strokeColor: '#f472b6', partIdx: 0 },
          { pts: fTop, label: '밑면 (4×3)', fillColor: 'rgba(244, 114, 182, 0.42)', strokeColor: '#f472b6', partIdx: 0 },
          { pts: fBack, label: '옆면 (4×2)', fillColor: 'rgba(251, 191, 36, 0.4)', strokeColor: '#fbbf24', partIdx: 1 },
          { pts: fFront, label: '옆면 (4×2)', fillColor: 'rgba(251, 191, 36, 0.4)', strokeColor: '#fbbf24', partIdx: 1 },
          { pts: fLeft, label: '옆면 (3×2)', fillColor: 'rgba(56, 189, 248, 0.4)', strokeColor: '#38bdf8', partIdx: 1 },
          { pts: fRight, label: '옆면 (3×2)', fillColor: 'rgba(56, 189, 248, 0.4)', strokeColor: '#38bdf8', partIdx: 1 }
        ]);

        drawBottomTapeBanner(rect, '직육면체 옆면 가로 합 = 밑면 둘레 (3 + 4 + 3 + 4 = 14 cm) ⇒ 옆넓이 = 14 × 2 = 28 cm²', [
          { text: '세로 3cm', weight: 3 / 14, color: '#38bdf8' },
          { text: '가로 4cm', weight: 4 / 14, color: '#fbbf24' },
          { text: '세로 3cm', weight: 3 / 14, color: '#38bdf8' },
          { text: '가로 4cm', weight: 4 / 14, color: '#fbbf24' }
        ]);
      } else if (sub === 'prism345') {
        const k = 0.48;
        const a = 3 * k, b = 4 * k, c = 5 * k, H = 4.2 * k;
        const hb = b / 2, hh = H / 2;

        const angLeft = f * (Math.PI / 2);
        const angRight = f * (Math.PI - Math.acos(4 / 5));
        const angBase = f * (Math.PI / 2);

        const hLeft = { p1: { x: -hb, y: -hh, z: 0 }, p2: { x: -hb, y: hh, z: 0 }, angle: angLeft };
        const hRight = { p1: { x: hb, y: hh, z: 0 }, p2: { x: hb, y: -hh, z: 0 }, angle: angRight };
        const hTop = { p1: { x: -hb, y: hh, z: 0 }, p2: { x: hb, y: hh, z: 0 }, angle: angBase };
        const hBot = { p1: { x: hb, y: -hh, z: 0 }, p2: { x: -hb, y: -hh, z: 0 }, angle: angBase };

        const fCenter = [{ x: -hb, y: -hh, z: 0 }, { x: hb, y: -hh, z: 0 }, { x: hb, y: hh, z: 0 }, { x: -hb, y: hh, z: 0 }];
        const fLeft = [{ x: -hb - a, y: -hh, z: 0 }, { x: -hb, y: -hh, z: 0 }, { x: -hb, y: hh, z: 0 }, { x: -hb - a, y: hh, z: 0 }].map((p) => applyHingeChain(p, [hLeft]));
        const fRight = [{ x: hb, y: -hh, z: 0 }, { x: hb + c, y: -hh, z: 0 }, { x: hb + c, y: hh, z: 0 }, { x: hb, y: hh, z: 0 }].map((p) => applyHingeChain(p, [hRight]));
        const fTopTri = [{ x: -hb, y: hh, z: 0 }, { x: hb, y: hh, z: 0 }, { x: -hb, y: hh + a, z: 0 }].map((p) => applyHingeChain(p, [hTop]));
        const fBotTri = [{ x: -hb, y: -hh, z: 0 }, { x: hb, y: -hh, z: 0 }, { x: -hb, y: -hh - a, z: 0 }].map((p) => applyHingeChain(p, [hBot]));

        const labelSpreadT = Math.max(0, Math.min(1, f / 0.6));
        const labelSpread = labelSpreadT * labelSpreadT * (3 - 2 * labelSpreadT);
        renderSortedFaces([
          { pts: fCenter, label: '옆면② (가로 4cm)', labelOffset: { x: 12 * (1 - labelSpread), y: 24 * (1 - labelSpread) + 30 * labelSpread }, fillColor: 'rgba(56, 189, 248, 0.36)', strokeColor: '#38bdf8', partIdx: 2 },
          { pts: fLeft, label: '옆면① (가로 3cm)', labelOffset: { x: -18 * (1 - labelSpread) - 52 * labelSpread, y: -24 * (1 - labelSpread) - 8 * labelSpread }, fillColor: 'rgba(52, 211, 153, 0.38)', strokeColor: '#34d399', partIdx: 1 },
          { pts: fRight, label: '옆면③ (빗변 5cm)', labelOffset: { x: 18 * (1 - labelSpread) + 52 * labelSpread, y: -26 * (1 - labelSpread) - 2 * labelSpread }, fillColor: 'rgba(244, 114, 182, 0.36)', strokeColor: '#f472b6', partIdx: 2 },
          { pts: fTopTri, label: '밑면(3·4·5)', labelOffset: { x: -10, y: -22 * (1 - labelSpread) - 20 * labelSpread }, fillColor: 'rgba(251, 191, 36, 0.46)', strokeColor: '#fbbf24', partIdx: 0 },
          { pts: fBotTri, label: '밑면(3·4·5)', labelOffset: { x: 10, y: 30 * (1 - labelSpread) + 44 * labelSpread }, fillColor: 'rgba(251, 191, 36, 0.46)', strokeColor: '#fbbf24', partIdx: 0 }
        ]);

        draw3DRightAngle(fTopTri[0], fTopTri[1], fTopTri[2], 0.25, '#fbbf24');
        draw3DRightAngle(fBotTri[0], fBotTri[1], fBotTri[2], 0.25, '#fbbf24');

        draw3DLine(fTopTri[0], fTopTri[2], '#34d399', 4.5, false, true);
        draw3DLine(fLeft[2], fLeft[3], '#34d399', 4.5, false, true);
        draw3DTickMarks(fTopTri[0], fTopTri[2], 1, '#34d399', 7);
        draw3DTickMarks(fLeft[2], fLeft[3], 1, '#34d399', 7);

        draw3DLine(fTopTri[1], fTopTri[2], '#f472b6', 4.5, false, true);
        draw3DLine(fRight[3], fRight[2], '#f472b6', 4.5, false, true);
        draw3DTickMarks(fTopTri[1], fTopTri[2], 3, '#f472b6', 7);
        draw3DTickMarks(fRight[3], fRight[2], 3, '#f472b6', 7);

        drawBottomTapeBanner(rect, '옆면 전체 가로 = 밑면 직각삼각형 둘레 합 (3 + 4 + 5 = 12 cm)', [

          { text: '② 가로 4cm (||)', weight: 4 / 12, color: '#38bdf8' },

        const H = 3.8 * k, hb = bBot / 2, hh = H / 2;
        const baseAng = Math.acos(((bBot - bTop) / 2) / leg);
        const foldSide = f * (Math.PI - baseAng);
        const foldTopFace = f * baseAng;
        const foldBase = f * (Math.PI / 2);

        const hLeft = { p1: { x: -hb, y: -hh, z: 0 }, p2: { x: -hb, y: hh, z: 0 }, angle: foldSide };
        const hRight = { p1: { x: hb, y: hh, z: 0 }, p2: { x: hb, y: -hh, z: 0 }, angle: foldSide };
        const hRight2 = { p1: { x: hb + leg, y: hh, z: 0 }, p2: { x: hb + leg, y: -hh, z: 0 }, angle: foldTopFace };
        const hTop = { p1: { x: -hb, y: hh, z: 0 }, p2: { x: hb, y: hh, z: 0 }, angle: foldBase };
        const hBot = { p1: { x: hb, y: -hh, z: 0 }, p2: { x: -hb, y: -hh, z: 0 }, angle: foldBase };

          { x: x0, y: y0, z: 0 }, { x: x1, y: y0, z: 0 }, { x: x1, y: y1, z: 0 }, { x: x0, y: y1, z: 0 }

        const fBotTrap = [{ x: -hb, y: -hh, z: 0 }, { x: hb, y: -hh, z: 0 }, { x: bTop / 2, y: -hh - trapH, z: 0 }, { x: -bTop / 2, y: -hh - trapH, z: 0 }].map((p) => applyHingeChain(p, [hBot]));

        renderSortedFaces([
          { pts: fCenter, label: '옆면② (가로 4)', fillColor: 'rgba(56, 189, 248, 0.36)', strokeColor: '#38bdf8', partIdx: 1 },

        const n = sub === 'prism5' ? 5 : 6;

        let leftChain = [];
        for (let i = 1; i <= 2; i++) {
          const hx = -hs - (i - 1) * s;
          leftChain.push({ p1: { x: hx, y: -hh, z: 0 }, p2: { x: hx, y: hh, z: 0 }, angle: extAng });

          faces.push({ pts: makeR(hx, -hh, hx + s, hh).map((p) => applyHingeChain(p, rightChain)), label: `옆면${i + 3}`, fillColor: 'rgba(52, 211, 153, 0.35)', strokeColor: '#34d399', partIdx: 0 });
        }

        const Rpoly = s / (2 * Math.sin(Math.PI / n)), apothem = s / (2 * Math.tan(Math.PI / n));

        faces.push({ pts: botPoly.map((p) => applyHingeChain(p, [hBot])), label: `밑면(${n}각형)`, fillColor: 'rgba(251, 191, 36, 0.46)', strokeColor: '#fbbf24', partIdx: 0 });

    }

    function buildRigidPlatonicFaces(kind, foldAmount) {
      const mesh = RIGID_PLATONIC_MESHES[kind];
      const xyz = mesh.vertices.map((v) => ({ x: v[0], y: v[1], z: v[2] }));
      const byFace = new Array(mesh.faces.length);
      const transformers = new Array(mesh.faces.length);
      const flatFraction = 1 - foldAmount;
      const root = mesh.order[0];
      transformers[root] = (point) => ({ ...point });
      mesh.order.forEach((i) => {
        const node = mesh.tree[i];
        if (node.p >= 0) {
          const pa = xyz[node.edge[0]], pb = xyz[node.edge[1]];
          const inherited = transformers[node.p];
          const angle = node.angle * flatFraction;
          transformers[i] = (point) => inherited(rotateAroundAxis(point, pa, pb, angle));
        }
        const pts = mesh.faces[i].map((j) => transformers[i](xyz[j]));
        byFace[i] = {
          pts,
          label: `${i + 1}`,
          fillColor: i % 3 === 0 ? 'rgba(251,191,36,0.42)' : i % 3 === 1 ? 'rgba(56,189,248,0.38)' : 'rgba(244,114,182,0.40)',
          strokeColor: i % 3 === 0 ? '#fbbf24' : i % 3 === 1 ? '#38bdf8' : '#f472b6'
        };

        if (!entry) {
          const k = vertices.length;
          entry = { flat:pt, label:k < 26 ? String.fromCharCode(65+k) : 'A'+(k-25), positions:[] };
          vertices.push(entry);
        }
        entry.positions.push({ faceIdx, cornerIdx, modelIdx:mesh.faces[faceIdx][cornerIdx] });
      }));
      const finalVertices = new Map();
      vertices.forEach(v => {
        const k = v.positions[0].modelIdx;
        if (!finalVertices.has(k)) finalVertices.set(k, []);
        finalVertices.get(k).push(v.label);
      });
      return RIGID_NET_LABEL_CACHE[kind] = {
        vertices, pairs:[...finalVertices.values()].filter(g=>g.length>1), solidCount:finalVertices.size
      };
    }

    function renderMode4Platonic(rect) {
      const sub = state.subType[4];
      const f = state.fold;

      if (sub === 'flat6') {
        // 정삼각형 6개가 한 꼭짓점 O에 모이면 60° × 6 = 360° 평면 타일이 되어 접히지 않음을 시연!
        const R = 2.2;
        const faces = [];
        for (let i = 0; i < 6; i++) {
          const a0 = (i * Math.PI) / 3, a1 = ((i + 1) * Math.PI) / 3;
          faces.push({
            pts: [
              { x: 0, y: 0, z: 0 },
              { x: R * Math.cos(a0), y: R * Math.sin(a0), z: 0 },
              { x: R * Math.cos(a1), y: R * Math.sin(a1), z: 0 }
            ],
            label: `60° (#${i + 1})`,
            fillColor: i % 2 === 0 ? 'rgba(244, 63, 94, 0.38)' : 'rgba(251, 191, 36, 0.38)',
            strokeColor: '#fbbf24'
          });
        }
        renderSortedFaces(faces);
        renderMerged3DVertices([{ pt: { x: 0, y: 0, z: 0 }, label: '60°×6 = 360° (접을 수 없음)', color: '#f43f5e', highlight: true }]);
        drawBottomTapeBanner(rect, '🚫 정삼각형 6개가 한 점에 모이면 내각의 합이 360°가 되어 평평한 판이 됩니다.');
      } else if (sub === 'tetra') {
        const s = 2.05, R = s / Math.sqrt(3), apothem = s / (2 * Math.sqrt(3));
        const maxAng = Math.PI - Math.acos(1 / 3);
        const ang = f * maxAng;

        const pB = { x: -s / 2, y: -apothem, z: 0 };
        const pC = { x: s / 2, y: -apothem, z: 0 };
        const pD = { x: 0, y: R, z: 0 };
        const basePts = [pB, pC, pD];
        const tipNames = ['F', 'A', 'E'];
        const faces = [{ pts: basePts, label: '바닥(BCD)', fillColor: 'rgba(56, 189, 248, 0.45)', strokeColor: '#38bdf8', partIdx: 0 }];
        const allVerts = [
          { pt: pB, label: 'B', color: '#7dd3fc' },
          { pt: pC, label: 'C', color: '#7dd3fc' },
          { pt: pD, label: 'D', color: '#7dd3fc' }
        ];

        const triH = (Math.sqrt(3) / 2) * s;
        for (let i = 0; i < 3; i++) {
          const v1 = basePts[i], v2 = basePts[(i + 1) % 3];
          const mid = { x: (v1.x + v2.x) / 2, y: (v1.y + v2.y) / 2, z: 0 };
          const dx = v2.x - v1.x, dy = v2.y - v1.y, len = Math.hypot(dx, dy);
          const nx = dy / len, ny = -dx / len;
          const tip2D = { x: mid.x + nx * triH, y: mid.y + ny * triH, z: 0 };
          const tip3D = applyHingeChain(tip2D, [{ p1: v2, p2: v1, angle: ang }]);

          faces.push({
            pts: [v1, v2, tip3D],
            label: `면${i + 1}`,
            fillColor: i === 1 ? 'rgba(251, 191, 36, 0.45)' : 'rgba(244, 114, 182, 0.40)',
            strokeColor: i === 1 ? '#fbbf24' : '#f472b6',
            partIdx: 1
          });
          allVerts.push({ pt: tip3D, label: tipNames[i], color: '#fbbf24', highlight: true });
          draw3DTickMarks(v1, tip3D, i + 1, '#fbbf24', 6.5);
          draw3DTickMarks(v2, tip3D, ((i + 1) % 3) + 1, '#fbbf24', 6.5);
        }

        renderSortedFaces(faces);
        renderMerged3DVertices(allVerts);
        drawBottomTapeBanner(rect, '정사면체(정삼각형 4개): 접으면 바깥 세 꼭짓점 A = E = F가 한 점에서 만납니다 (맞붙는 변: AB↔EB, AD↔FD, CB↔CF)');
      } else {
        const names = { octa: '정팔면체', dodeca: '정십이면체', icosa: '정이십면체' };
        const topo = { octa: [6, 12, 8], dodeca: [20, 30, 12], icosa: [12, 30, 20] };
        const p = topo[sub];
        const faces = buildRigidPlatonicFaces(sub, f);
        renderSortedFaces(faces);
        const labels = getRigidNetVertexLabels(sub);
        // 정팔면체는 A~J 전부 표시한다. 복잡한 정십이/이십면체는 꼭짓점 렌즈에서만 표시한다.
        if (sub === 'octa' || state.conceptSwitch === 'def' || state.conceptSwitch === 'zipper') {
          renderMerged3DVertices(labels.vertices.map(v => {
            const p = v.positions[0];
            return {pt:faces[p.faceIdx].pts[p.cornerIdx], label:v.label, color:'#fef08a'};
          }));
        }
        const pairText = sub === 'octa' ? ' · 일치: ' + labels.pairs.map(g=>g.join('=')).join(', ') : '';
        drawBottomTapeBanner(rect, names[sub] + ': F=' + p[2] + ', E=' + p[1] + ', V=' + p[0] + pairText);
      }
    }

    // =========================================================================
    // [모드 5 렌더링] 원기둥 · 반원기둥 · 케이크기둥 · 휴지심
    // =========================================================================
    function renderMode5Cylinders(rect) {
      const sub = state.subType[5];
      const k = 0.36;
      const mathR = state.cylR, mathH = state.cylH;
      const R = mathR * k, H = mathH * k, hh = H / 2;
      const f = Math.max(0.002, state.fold);

      if (sub === 'cylinder') {
        const N = 28, totalWidth = 2 * Math.PI * R;
        const faces = [], topArcPts = [], botArcPts = [];
        const R_eff = R / f;

        for (let i = 0; i <= N; i++) {
          const u = i / N - 0.5, s = u * totalWidth, theta = s / R_eff;
          const px = R_eff * Math.sin(theta), pz = R_eff * (1 - Math.cos(theta));
          botArcPts.push({ x: px, y: -hh, z: pz });
          topArcPts.push({ x: px, y: hh, z: pz });
        }
        for (let i = 0; i < N; i++) {
          faces.push({
            pts: [botArcPts[i], botArcPts[i + 1], topArcPts[i + 1], topArcPts[i]],
            fillColor: 'rgba(56, 189, 248, 0.32)',
            strokeColor: 'rgba(56, 189, 248, 0.45)',
            lineWidth: 1.0,
            partIdx: 1,
            label: i === N / 2 ? `옆면 (가로 2πr = ${2 * mathR}π)` : ''
          });
        }

        const angDisk = state.fold * (Math.PI / 2);
        const hTopDisk = { p1: { x: -R, y: hh, z: 0 }, p2: { x: R, y: hh, z: 0 }, angle: angDisk };
        const hBotDisk = { p1: { x: R, y: -hh, z: 0 }, p2: { x: -R, y: -hh, z: 0 }, angle: angDisk };
        const diskN = 32, topDiskPts = [], botDiskPts = [];
        for (let i = 0; i < diskN; i++) {
          const phi = (i / diskN) * Math.PI * 2;
          topDiskPts.push(applyHingeChain({ x: R * Math.sin(phi), y: hh + R * (1 - Math.cos(phi)), z: 0 }, [hTopDisk]));
          botDiskPts.push(applyHingeChain({ x: R * Math.sin(phi), y: -hh - R * (1 - Math.cos(phi)), z: 0 }, [hBotDisk]));
        }
        faces.push({ pts: topDiskPts, fillColor: 'rgba(251, 191, 36, 0.46)', strokeColor: '#fbbf24', lineWidth: 2.6, partIdx: 0, label: `밑면(r=${mathR})` });
        faces.push({ pts: botDiskPts, fillColor: 'rgba(251, 191, 36, 0.46)', strokeColor: '#fbbf24', lineWidth: 2.6, partIdx: 0, label: `밑면(r=${mathR})` });

        renderSortedFaces(faces);
        for (let i = 0; i < N; i++) draw3DLine(topArcPts[i], topArcPts[i + 1], '#fbbf24', 4.5, false, true);
        for (let i = 0; i < diskN; i++) draw3DLine(topDiskPts[i], topDiskPts[(i + 1) % diskN], '#f472b6', 3.5, false, true);

        drawBottomTapeBanner(rect, `밑면 원주(2πr = ${2 * mathR}π) = 옆면 직사각형 가로 ⇒ 옆넓이 = ${2 * mathR}π × ${mathH} = ${2 * mathR * mathH}π cm²`);
      } else if (sub === 'halfCyl') {
        const faces = [];
        const flatFace = [{ x: -R, y: -hh, z: 0 }, { x: R, y: -hh, z: 0 }, { x: R, y: hh, z: 0 }, { x: -R, y: hh, z: 0 }];
        faces.push({ pts: flatFace, label: `자른 면 (2r=${2 * mathR})`, fillColor: 'rgba(244, 114, 182, 0.44)', strokeColor: '#f472b6', lineWidth: 2.6, partIdx: 2 });

        const N = 18;
        for (let i = 0; i < N; i++) {
          const u0 = i / N, u1 = (i + 1) / N;
          const roll = Math.max(0.00001, state.fold);
          const rollRadius = R / roll;
          const a0 = u0 * Math.PI * roll, a1 = u1 * Math.PI * roll;
          const t0 = (Math.PI / 2) * roll;
          const x0 = R + rollRadius * (Math.sin(t0 + a0) - Math.sin(t0));
          const z0 = rollRadius * (Math.cos(t0) - Math.cos(t0 + a0));
          const x1 = R + rollRadius * (Math.sin(t0 + a1) - Math.sin(t0));
          const z1 = rollRadius * (Math.cos(t0) - Math.cos(t0 + a1));

          faces.push({
            pts: [{ x: x0, y: -hh, z: z0 }, { x: x1, y: -hh, z: z1 }, { x: x1, y: hh, z: z1 }, { x: x0, y: hh, z: z0 }],
            fillColor: 'rgba(56, 189, 248, 0.35)',
            strokeColor: 'rgba(56, 189, 248, 0.5)',
            lineWidth: 1.2,
            partIdx: 1,
            label: i === N / 2 ? `둥근 옆면 (πr=${mathR}π)` : ''
          });
        }

        const angDisk = state.fold * (Math.PI / 2);
        const hTop = { p1: { x: -R, y: hh, z: 0 }, p2: { x: R, y: hh, z: 0 }, angle: angDisk };
        const hBot = { p1: { x: R, y: -hh, z: 0 }, p2: { x: -R, y: -hh, z: 0 }, angle: angDisk };
        const topSemi = [], botSemi = [];
        for (let i = 0; i <= 18; i++) {
          const a = (i / 18) * Math.PI;
          topSemi.push(applyHingeChain({ x: R * Math.cos(a), y: hh + R * Math.sin(a), z: 0 }, [hTop]));
          botSemi.push(applyHingeChain({ x: R * Math.cos(a), y: -hh - R * Math.sin(a), z: 0 }, [hBot]));
        }
        faces.push({ pts: topSemi, fillColor: 'rgba(251, 191, 36, 0.46)', strokeColor: '#fbbf24', label: '반원 밑면', partIdx: 0 });
        faces.push({ pts: botSemi, fillColor: 'rgba(251, 191, 36, 0.46)', strokeColor: '#fbbf24', label: '반원 밑면', partIdx: 0 });

        renderSortedFaces(faces);
        drawBottomTapeBanner(rect, `반원기둥 옆면 전체 가로 = 반원 둘레 (${mathR}π + ${2 * mathR} cm)`, [
          { text: `평평한 면 (지름 ${2 * mathR}cm)`, weight: 0.42, color: '#f472b6' },
          { text: `둥근 곡면 (${mathR}π cm)`, weight: 0.58, color: '#38bdf8' }
        ]);
      } else if (sub === 'sectorCyl') {
        const faces = [];
        const ang90 = state.fold * (Math.PI / 2);
        const hLeft = { p1: { x: 0, y: -hh, z: 0 }, p2: { x: 0, y: hh, z: 0 }, angle: ang90 };

        const fRad1 = [{ x: 0, y: -hh, z: 0 }, { x: R, y: -hh, z: 0 }, { x: R, y: hh, z: 0 }, { x: 0, y: hh, z: 0 }];
        const fRad2 = [{ x: -R, y: -hh, z: 0 }, { x: 0, y: -hh, z: 0 }, { x: 0, y: hh, z: 0 }, { x: -R, y: hh, z: 0 }].map((p) => applyHingeChain(p, [hLeft]));

        faces.push({ pts: fRad1, label: `자른 면(반지름 ${mathR})`, fillColor: 'rgba(244, 114, 182, 0.4)', strokeColor: '#f472b6', partIdx: 2 });
        faces.push({ pts: fRad2, label: `자른 면(반지름 ${mathR})`, fillColor: 'rgba(244, 114, 182, 0.4)', strokeColor: '#f472b6', partIdx: 2 });

        const N = 12;
        for (let i = 0; i < N; i++) {
          const u0 = i / N, u1 = (i + 1) / N;
          const roll = Math.max(0.00001, state.fold);
          const rollRadius = R / roll;
          const a0 = u0 * (Math.PI / 2) * roll, a1 = u1 * (Math.PI / 2) * roll;
          const t0 = (Math.PI / 2) * roll;
          const x0 = R + rollRadius * (Math.sin(t0 + a0) - Math.sin(t0));
          const z0 = rollRadius * (Math.cos(t0) - Math.cos(t0 + a0));
          const x1 = R + rollRadius * (Math.sin(t0 + a1) - Math.sin(t0));
          const z1 = rollRadius * (Math.cos(t0) - Math.cos(t0 + a1));

          faces.push({
            pts: [{ x: x0, y: -hh, z: z0 }, { x: x1, y: -hh, z: z1 }, { x: x1, y: hh, z: z1 }, { x: x0, y: hh, z: z0 }],
            fillColor: 'rgba(56, 189, 248, 0.38)',
            strokeColor: '#38bdf8',
            lineWidth: 1.2,
            partIdx: 1,
            label: i === N / 2 ? `둥근 곡면(${mathR / 2}π)` : ''
          });
        }

        const hTop = { p1: { x: 0, y: hh, z: 0 }, p2: { x: R, y: hh, z: 0 }, angle: ang90 };
        const hBot = { p1: { x: R, y: -hh, z: 0 }, p2: { x: 0, y: -hh, z: 0 }, angle: ang90 };
        const topQ = [{ x: 0, y: hh, z: 0 }], botQ = [{ x: 0, y: -hh, z: 0 }];
        for (let i = 0; i <= 12; i++) {
          const a = (i / 12) * (Math.PI / 2);
          topQ.push({ x: R * Math.cos(a), y: hh + R * Math.sin(a), z: 0 });
          botQ.push({ x: R * Math.cos(a), y: -hh - R * Math.sin(a), z: 0 });
        }
        faces.push({ pts: topQ.map((p) => applyHingeChain(p, [hTop])), fillColor: 'rgba(251, 191, 36, 0.46)', strokeColor: '#fbbf24', label: '부채꼴(90°)', partIdx: 0 });
        faces.push({ pts: botQ.map((p) => applyHingeChain(p, [hBot])), fillColor: 'rgba(251, 191, 36, 0.46)', strokeColor: '#fbbf24', label: '부채꼴(90°)', partIdx: 0 });

        renderSortedFaces(faces);
        drawBottomTapeBanner(rect, `부채꼴기둥(중심각 90°) 옆면 가로 합 = 호(${mathR / 2}π) + 반지름 2개(${2 * mathR}) cm`, [
          { text: `반지름 (${mathR})`, weight: 0.28, color: '#f472b6' },
          { text: `반지름 (${mathR})`, weight: 0.28, color: '#f472b6' },
          { text: `90° 호 (${mathR / 2}π)`, weight: 0.44, color: '#38bdf8' }
        ]);
      } else {
        const Rin = R * 0.45, N = 24, faces = [];
        const R_effOut = R / f, R_effIn = Rin / f;
        const outW = 2 * Math.PI * R, inW = 2 * Math.PI * Rin;

        for (let i = 0; i < N; i++) {
          const u0 = i / N - 0.5, u1 = (i + 1) / N - 0.5;
          const th0 = (u0 * outW) / R_effOut, th1 = (u1 * outW) / R_effOut;
          faces.push({
            pts: [
              { x: R_effOut * Math.sin(th0), y: -hh, z: R_effOut * (1 - Math.cos(th0)) },
              { x: R_effOut * Math.sin(th1), y: -hh, z: R_effOut * (1 - Math.cos(th1)) },
              { x: R_effOut * Math.sin(th1), y: hh, z: R_effOut * (1 - Math.cos(th1)) },
              { x: R_effOut * Math.sin(th0), y: hh, z: R_effOut * (1 - Math.cos(th0)) }
            ],
            fillColor: 'rgba(56, 189, 248, 0.30)',
            strokeColor: 'rgba(56, 189, 248, 0.45)',
            lineWidth: 1,
            partIdx: 1,
            label: i === N / 2 ? `바깥 옆면(${2 * mathR}πh)` : ''
          });

          const zOff = (1 - state.fold) * 1.2 + state.fold * (R - Rin);
          const ti0 = (u0 * inW) / R_effIn, ti1 = (u1 * inW) / R_effIn;
          faces.push({
            pts: [
              { x: R_effIn * Math.sin(ti0), y: -hh, z: zOff + R_effIn * (1 - Math.cos(ti0)) },
              { x: R_effIn * Math.sin(ti1), y: -hh, z: zOff + R_effIn * (1 - Math.cos(ti1)) },
              { x: R_effIn * Math.sin(ti1), y: hh, z: zOff + R_effIn * (1 - Math.cos(ti1)) },
              { x: R_effIn * Math.sin(ti0), y: hh, z: zOff + R_effIn * (1 - Math.cos(ti0)) }
            ],
            fillColor: 'rgba(244, 114, 182, 0.42)',
            strokeColor: '#f472b6',
            lineWidth: 1.2,
            partIdx: 2,
            label: i === N / 2 ? '안쪽 구멍의 옆면(더함)' : ''
          });
        }
        renderSortedFaces(faces);
        drawBottomTapeBanner(rect, '구멍 뚫린 원기둥의 겉넓이 = (고리 모양 밑면×2) + (바깥 옆면) + (안쪽 구멍의 옆면)');
      }
    }

    // =========================================================================
    // [모드 6 렌더링] 원뿔 · 원뿔대 전개도 & 🔪 원뿔/회전체/정육면체 절단 단면 스캐너!
    // =========================================================================
    function renderMode6ConesAndSlices(rect) {
      const sub = state.subType[6];
      const k = 0.42;
      const mathR = state.coneR;
      const mathA = Math.max(mathR + 1, state.coneA);
      const R = mathR * k, A = mathA * k;
      const f = state.fold;

      // ---------------------------------------------------------------------
      // [6-A] 🔪 원뿔을 자르는 4가지 각도와 단면 스캐너 (원 · 이등변삼각형 · 타원 · 종 모양 포물선)
      // ---------------------------------------------------------------------
      if (sub === 'coneSlice') {
        const sliceIdx = state.activePartIdx !== -1 ? state.activePartIdx : Math.min(3, Math.floor(f * 3.99));
        const Rc = 1.65, Hc = 2.5, z0 = -1.0;
        const apex = { x: 0, y: 0, z: z0 + Hc };
        const N = 32, faces = [];

        // 반투명 원뿔 외피
        for (let i = 0; i < N; i++) {
          const a0 = (i / N) * Math.PI * 2, a1 = ((i + 1) / N) * Math.PI * 2;
          faces.push({
            pts: [
              apex,
              { x: Rc * Math.cos(a0), y: Rc * Math.sin(a0), z: z0 },
              { x: Rc * Math.cos(a1), y: Rc * Math.sin(a1), z: z0 }
            ],
            fillColor: 'rgba(56, 189, 248, 0.16)',
            strokeColor: 'rgba(56, 189, 248, 0.35)',
            lineWidth: 1.0
          });
        }
        renderSortedFaces(faces);

        // 선택된 절단 각도에 따른 3D 단면 하이라이트!
        const secPts = [];
        if (sliceIdx === 0) {
          // ① 밑면에 평행 (회전축에 수직) -> 원
          const zCut = z0 + Hc * 0.45;
          const rCut = Rc * (1 - 0.45);
          for (let i = 0; i < N; i++) {
            const a = (i / N) * Math.PI * 2;
            secPts.push({ x: rCut * Math.cos(a), y: rCut * Math.sin(a), z: zCut });
          }
        } else if (sliceIdx === 1) {
          // ② 회전축을 포함 (꼭짓점 V 통과 수직 절단) -> 이등변삼각형
          secPts.push(apex, { x: -Rc, y: 0, z: z0 }, { x: Rc, y: 0, z: z0 });
        } else if (sliceIdx === 2) {
          // ③ 밑면에 비스듬하게 (옆면만 통과) -> 타원 (Ellipse)
          for (let i = 0; i < N; i++) {
            const a = (i / N) * Math.PI * 2;
            // 평면 z = zMid + tilt * x 와 원뿔의 교선
            const frac = 0.48 + 0.22 * Math.cos(a);
            const zPt = z0 + Hc * frac;
            const rPt = Rc * (1 - frac);
            secPts.push({ x: rPt * Math.cos(a), y: rPt * Math.sin(a), z: zPt });
          }
        } else {
          // ④ 밑면을 통과하며 모선에 평행/수직 절단 (꼭짓점 미포함) -> 종 모양 포물선/쌍곡선 곡선!
          const xCut = 0.65;
          const maxY = Math.sqrt(Math.max(0, Rc * Rc - xCut * xCut));
          for (let i = 0; i <= 24; i++) {
            const u = -1 + (2 * i) / 24;
            const yPt = u * maxY;
            const rAtPt = Math.hypot(xCut, yPt);
            const zPt = z0 + Hc * (1 - rAtPt / Rc);
            secPts.push({ x: xCut, y: yPt, z: zPt });
          }
        }

        // 3D 단면 폴리곤 네온 발광 렌더링
        renderSortedFaces([{
          pts: secPts,
          fillColor: 'rgba(251, 191, 36, 0.62)',
          strokeColor: '#fbbf24',

        }

          { pt: apex, label: `V(모선 a=${mathA})`, color: '#fbbf24', highlight: true },
          { pt: arcPts[0], label: 'A', color: '#38bdf8', highlight: true },

        ]);

        drawBottomTapeBanner(rect, `원뿔 중심각 θ = (r/a)×360° = (${mathR}/${mathA})×360° = ${thetaDeg}° | 옆넓이 = πra = ${mathR * mathA}π cm²`);
      }
    }

      // 원본 setMode / setSubType 의 초기화 규칙: 접기 0%(단면 장면은 15%)
      // [3D 기본] 원본은 전개도 장면을 위에서 내려다본 평면도로 시작했지만, 2.0 은 모든 장면을 3D 시점(CAM.iso)으로 시작합니다.
      enter: (s, lab) => {
        const cam = CAM.iso;
        s.yaw = cam.yaw; s.pitch = cam.pitch;
        s.fold = 0; s.cut = 0.15; s.nSlice = slice ? SLICES[id].length : 0;
        if (!lensList(m, id).includes(s.lens)) s.lens = 'all';
        if (lab && s === lab.s && lab.board) lab.board.fit();
      },
      controls: () => (slice ? ['cut'] : ['fold']),
      presets: (s) => {
        const out = [];
        if (!slice) [[0, '0% 전개도'], [0.5, '50%'], [1, '100% 완성']].forEach(([v, lbl]) => out.push({ group: '접는 정도', label: lbl, set: { fold: v }, ms: 700, on: (st) => Math.abs(st.fold - v) < 0.01 }));
        else SLICES[id].forEach((lbl, i, arr) => out.push({ group: '단면 고르기', label: lbl, set: { cut: (i + 0.5) / arr.length }, ms: 600, on: (st) => sliceIdxOf(st, arr.length) === i }));
        const near = (st, c) => Math.abs(wrap(st.yaw - c.yaw)) < 0.02 && Math.abs(st.pitch - c.pitch) < 0.02;
        out.push({ group: '시점', label: '입체로 보기', set: CAM.iso, ms: 600, on: (st) => near(st, CAM.iso) });
        out.push({ group: '시점', label: '위에서 보기', color: 'amber', set: CAM.top, ms: 600, on: (st) => near(st, CAM.top) });
        out.push({ group: '시점', label: '앞에서 보기', color: 'sky', set: CAM.front, ms: 600, on: (st) => near(st, CAM.front) });
        const lenses = lensList(m, id);
        if (lenses.length) LENSES.filter(([k]) => lenses.includes(k)).forEach(([k, lbl]) => out.push({ group: '표시할 내용', label: lbl, apply: (st) => { st.lens = k; }, on: (st) => st.lens === k }));
        if (usesDims(m, id)) {
          sync(s, m, id);
          const sp = getSpec();
          [2, 3, 4, 5].forEach((v) => out.push({ group: arrowOnly(sp.dim1Name) + ' (cm)', label: String(v), apply: (st) => setR(st, v), on: (st) => (m === 5 ? st.cylR : st.coneR) === v }));
          [4, 6, 8, 9].forEach((v) => out.push({ group: arrowOnly(sp.dim2Name) + ' (cm)', label: String(v), apply: (st) => setH(st, v), on: (st) => (m === 5 ? st.cylH : st.coneA) === v }));
        }
        return out;
      },
      actions: () => [
        {
          id: 'act', play: true, primary: true, icon: 'wand',
          label: (st) => { sync(st, m, id); return arrowOnly(getSpec().actionTxt); },
          run: (st, lab) => {
            if (slice) { // 원본 toggleFoldAnim: 단면 장면은 누를 때마다 다음 단면으로 순환
              // [2.0 수정] 원본은 4단계(0·0.31·0.63·0.94)로만 순환해, 단면이 3가지인 원기둥·원뿔대·구와 정육면체 장면에서는 첫 번째 클릭이 아무 변화도 주지 않았음 → 단면 가짓수대로 순환
              const n = SLICES[id].length;
              lab.tween({ cut: (((sliceIdxOf(st, n) + 1) % n) + 0.5) / n }, 700);
            } else {
              const closing = st.fold <= 0.5;
              // [3D 기본] 접을 때도 펼 때도 3D 시점을 유지(펼쳐도 평면도로 돌아가지 않음)
              lab.tween({ fold: closing ? 1 : 0, ...CAM.iso }, 1100);
            }
          }
        },
        { id: 'spin', icon: (st) => (st.playing ? 'pause' : 'play'), label: (st) => (st.playing ? '자동 회전 멈춤' : '입체 자동 회전'), on: (st) => st.playing, run: (st) => { st.playing = !st.playing; } }
      ],
      tick: (s, dt) => { if (!s.playing) return false; s.yaw = wrap(s.yaw + 0.6 * dt); return true; },
      view: (s) => {
        sync(s, m, id);
        const spec = arrow(getSpec());
        // 원본 updateUI 의 보충 설명(정다면체 겹치는 알파벳, 전개도 → 겨냥도 꼭짓점)
        const sep = 'margin-top:8px;padding-top:8px;border-top:1px solid var(--line);color:var(--m-sky)';
        const solidNet = state.mode === 4 && ['octa', 'dodeca', 'icosa'].includes(state.subType[4]);
        const pairNotes = solidNet ? getRigidNetVertexLabels(state.subType[4]).pairs : [];
        const traced = trackedNetData();
        const netNote = traced && !traced.mismatched
          ? `<div style="${sep}"><strong>${traced.kind === 'polyhedron' ? '전개도 → 겨냥도 꼭짓점' : '곡면의 경계에 있는 기준점'}</strong>: ` +
            (traced.seams.length ? traced.seams.map((x) => x.replaceAll('=', ' = ')).join(' / ') : '맞닿는 점은 각 면의 경계에 표시') +
            (traced.kind === 'polyhedron' ? ' · 펼친 점 ' + traced.flatVertices + '개 / 완성 꼭짓점 ' + traced.closedVertices + '개' : ' · 곡면을 나누는 점 전체가 아니라 경계와 맞붙는 부분만 표시') +
            '</div>' : '';
        const solidNote = solidNet ? `<div style="${sep}"><strong>접었을 때 만나는 알파벳:</strong> ` + pairNotes.map((g) => g.join(' = ')).join(' / ') + '</div>' : '';
        return {
          guide: `<div style="font-weight:800;margin-bottom:6px">${APLab.esc(APLab.stripEmoji(spec.badge))}</div>${spec.hint}<div style="margin-top:6px;opacity:.8;font-size:.92em">빈 곳을 끌면 입체를 돌려 볼 수 있습니다.</div>`,
          parts: spec.parts.map((p) => ({ id: p.id, name: p.name, desc: p.desc, value: p.val, color: tone(p), ok: p.ok })),
          summary: spec.totalRes,
          rule: spec.rule,
          formula: spec.formulaHTML,
          notes: spec.notes + netNote + solidNote
        };
      },
      draw: (b, s, v) => {
        B = b;
        ctx = makeCtx(true);
        sctx = makeCtx(false);
        const rect = { width: b.W, height: b.H };
        const paint = (st, floor) => {
          sync(st, m, id);
          sink.tape = null;
          sink.cap = null;
          netVisibleFaces = null;
          if (floor) drawFloorGrid();
          if (m === 1) renderMode1CubeFamily(rect);
          else if (m === 2) renderMode2Prisms(rect);
          else if (m === 3) renderMode3Pyramids(rect);
          else if (m === 4) renderMode4Platonic(rect);
          else if (m === 5) renderMode5Cylinders(rect);
          else renderMode6ConesAndSlices(rect);
          renderTrackedNetVertices();
        };
        // 그림 크기: 지금 그림이 무대를 가득 채우도록 맞춤(접으면 자동으로 확대). 단면 장면은 4가지 단면을 모두 담아 단면을 바꿀 때 크기가 변하지 않게 함
        const stages = slice ? [0.1, 0.4, 0.65, 0.95] : [s.fold];
        const measureAll = () => stages.forEach((f) => paint({ ...s, fold: f, cut: f, part: null }, false));
        if (b._bbox) { measureAll(); return; }
        const bb = b.measure(measureAll);
        if (bb) {
          if (b.thumb) b.focus = b.fitBox(bb, { margin: 0.08, px: 6 });
          else b.setFocus(b.fitBox(bb, { margin: 0.1, px: 28 }), false);
        }
        paint(b.thumb ? { ...s, part: null } : s, s.grid && !b.thumb);
        v.tape = sink.tape;
        if (sink.cap && b.W < 560) v.status = { tone: 'key', text: arrowOnly(sink.cap) };
      }
    };
  }

  const groups = Object.keys(SUB_MENUS).map((k) => {
    const m = +k;
    return { id: 'm' + m, title: TABS[m - 1], short: SHORT[m - 1], scenes: SUB_MENUS[m].map((it) => sceneOf(m, it)) };
  });

  APLab.createLab({
    id: 'g7-nets',
    title: '전개도와 입체 단면',
    courseName: '중1',
    unit: '입체도형 · 전개도',
    courseColor: 'var(--m-green)',
    home: '../index.html#g7',
    legacy: '../../labs/g7/nets-folding.html',
    board: {
      kind: 'figure', focus: { x: [-5, 5], y: [-4, 4] }, minZoom: 0.4, maxZoom: 6,
      // 빈 곳을 끌면 카메라 회전(원본과 같은 감도·같은 위아래 한계)
      orbit: (s, dx, dy) => {
        s.yaw = wrap(s.yaw + dx * 0.0085);
        s.pitch = clamp(s.pitch + dy * 0.0075, PITCH_MIN, PITCH_MAX);
      }
    },
    // [3D 기본] 시작 시점도 3D(CAM.iso)
    state: { lens: 'all', yaw: CAM.iso.yaw, pitch: CAM.iso.pitch, cylR: 3, cylH: 6, coneR: 3, coneA: 6 },
    persist: ['lens'],
    params: {
      fold: { value: 0, min: 0, max: 1, step: 0.005, color: 'amber', label: '전개도 펼치기(0%) ↔ 입체로 접기(100%)', hint: '손잡이를 천천히 끌며 어느 면이 어디로 접히는지 따라가 보세요', format: (v) => `${Math.round(v * 100)}%` },
      cut: { value: 0.15, min: 0, max: 1, step: 0.005, color: 'rose', label: '단면 바꾸기', hint: '막대를 움직이면 단면의 종류가 바뀝니다. ‘단면 고르기’ 버튼을 눌러도 됩니다', format: (v, st) => { const n = (st && st.nSlice) || 4; return `${Math.min(n - 1, Math.floor(v * (n - 0.01))) + 1}번 단면 (${Math.round(v * 100)}%)`; } }
    },
    groups
  });
});
</script>
