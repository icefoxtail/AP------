  const pv = (s, m) => { const o = {}; for (const k of KEYS[m]) o[k] = s[pk(m, k)]; return o; }; // 원본 state.params 모양
  const mapP = (m, obj) => { const o = {}; for (const k in obj) o[pk(m, k)] = obj[k]; return o; };
  const SL_COLORS = ['amber', 'sky', 'green'];
  const params = {};
  KILLER_MODES.forEach((md, m) => {
    const done = {};
    (SLIDERS[md.id] || []).forEach((d, i) => {
      done[d.key] = true;
      params[pk(m, d.key)] = { value: md.scenarios[0].params[d.key], min: d.min, max: d.max, step: d.step, color: SL_COLORS[i % 3], label: d.label, format: (v) => Number(v).toFixed(d.step < 1 ? 2 : 0) };
    });
    for (const k of KEYS[m]) if (!done[k]) params[pk(m, k)] = { value: md.scenarios[0].params[k], min: -1000, max: 1000, step: 0.01 };
  });

  /* ---------- 글자 다듬기: 원본 formatRichMath 의 ** 굵게 + 수식 안 부등호(<, >) 보호 ---------- */
  const safe = (t) => String(t == null ? '' : t).replace(/\$\$([^$]+)\$\$|\$([^$]+)\$/g, (m0, a, b) => {
    const body = (a != null ? a : b).replace(/</g, '\\lt ').replace(/>/g, '\\gt ');
    return a != null ? '$$' + body + '$$' : '$' + body + '$';
  });
  const rich = (t) => safe(String(t == null ? '' : t).replace(/\*\*([\s\S]+?)\*\*/g, '<strong>$1</strong>'));
  const lines = (arr) => arr.map((t) => rich(APLab.cleanLead(t))).join('<br/>');
  // 단계 문구는 셸이 HTML 이스케이프 후 수식으로 바꾸므로 수식 안의 ' 도 미리 바꿔 둡니다.
  const stepText = (t) => safe(String(t).replace(/\*\*/g, '')).replace(/\$([^$]+)\$/g, (m0, b) => '$' + b.replace(/'/g, '^{\\prime}') + '$');

  /* ---------- 2. 원본 그리기 도우미 → 공용 무대(APLab.Board) 연결층 ---------- */
  const mathToScreen = (x, y) => B.toS(x, y);
  const dashOf = (d) => (d && d.length ? d : null);
  const stageBox = () => { const i = B.insets; return { x0: i.left + 6, x1: B.W - i.right - 6, y0: i.top + 6, y1: B.H - i.bottom - 6 }; };
  const cleanLabel = (l) => String(l || '').replace(/\[드래그\s+(k=[^\]]+)\]/g, '$1').replace(/\s*\[[^\]]*드래그[^\]]*\]/g, '');

  /* 원본 solveExpLineIntersection */
  // Solve intersection of 2^(x-s)+s = -x + k using Newton's method
function solveExpLineIntersection(k, shift = 0) {
  let x = k / 2;
  for (let i = 0; i < 25; i++) {
    const f = Math.pow(2, x - shift) + shift + x - k;
    const df = Math.pow(2, x - shift) * Math.LN2 + 1;
    x -= f / df;
  }
  return x;
}

  function drawFunctionCurve(fn, color = '#34d399', lineWidth = 2.6, dash = [], xStart = null, xEnd = null) {
    const g = (x) => {
      let y = fn(x);
      // 원래 곡선·점은 보존하고 절댓값 곡선은 비교용으로 겹쳐 그립니다.
      return (isNaN(y) || !isFinite(y) || Math.abs(y) > 80) ? NaN : y;
    };
    B.plot(g, { color, width: lineWidth, dash: dashOf(dash), glow: dash.length === 0, from: xStart, to: xEnd });
    if (S.mut_abs) B.plot((x) => Math.abs(g(x)), { color: 'violet', width: 1.8, dash: [4, 4], from: xStart, to: xEnd });
  }
  function drawMathLine(slope, intercept, color = '#fbbf24', dash = [], width = 2) {
    B.line([0, intercept], slope, { color, width, dash: dashOf(dash) });
  }
  function drawMathSegment(x1, y1, x2, y2, color = '#fbbf24', dash = [], width = 2.2) {
    B.seg([x1, y1], [x2, y2], { color, width, dash: dashOf(dash) });
  }
  function drawMathPoint(x, y, label = '', color = '#fbbf24', radius = 6, isDraggable = false, onDrag = null) {
    const o = { color, r: radius };
    const lb = cleanLabel(label);
    if (lb) o.label = lb;

  // 알약 모양 설명 상자: 무대 안으로 밀어 넣고, 길면 두 줄/작은 글씨로 줄입니다(휴대폰에서 잘리지 않게).
  // 폭이 좁은 화면에서는 긴 알약을 그림 위에 겹쳐 놓지 않고 무대 위쪽에 차례로 쌓습니다(가려짐 방지).
  const PILLS = [];
  function pillBox(c, color, cx, cy, tw, bh) {
    const bx = stageBox();
    const x = clamp(cx, bx.x0 + tw / 2, Math.max(bx.x0 + tw / 2, bx.x1 - tw / 2));
    const y = clamp(cy, bx.y0 + bh / 2, Math.max(bx.y0 + bh / 2, bx.y1 - bh / 2));
    c.fillStyle = B.color('halo', 0.9);
    c.strokeStyle = B.color(color, 0.85);
    c.lineWidth = 1.4;
    c.beginPath();
    c.roundRect(x - tw / 2, y - bh / 2, tw, bh, 7);
    c.fill();
    c.stroke();
    return { x, y };
  }
  function emitPill(sp, x, y) {
    if (B.W < 600 && sp.tw > 110) PILLS.push(sp);
    else sp.paint(x, y);
  }
  function flushPills() {
    const bx = stageBox();
    let y = bx.y0;
    PILLS.forEach((sp) => { sp.paint((bx.x0 + bx.x1) / 2, y + sp.bh / 2); y += sp.bh + 5; });
    PILLS.length = 0;
  }
  function drawCanvasBadge(_c, text, x, y, color = '#34d399') {
    const c = B.ctx;
    const maxW = Math.max(120, stageBox().x1 - stageBox().x0);
    c.save();
    let fs = 12.5 * B.fs;
    const font = () => { c.font = `800 ${fs}px ${B.font}`; };
    font();
    let ls = [String(text)];
    let tw = c.measureText(ls[0]).width + 16;
    if (tw > maxW) { // 가운데에 가장 가까운 띄어쓰기에서 두 줄로
      const t = ls[0];
      let cut = -1;
      for (let i = 0; i < t.length; i++) if (t[i] === ' ' && (cut < 0 || Math.abs(i - t.length / 2) < Math.abs(cut - t.length / 2))) cut = i;
      if (cut > 0) ls = [t.slice(0, cut), t.slice(cut + 1)];
      tw = Math.max(...ls.map((l) => c.measureText(l).width)) + 16;
      if (tw > maxW) { fs = Math.max(9.5, (fs * maxW) / tw); font(); tw = Math.max(...ls.map((l) => c.measureText(l).width)) + 16; }
    }
    const lh = fs * 1.28;
    const bh = ls.length * lh + 8;
    const f = fs;
    c.restore();
    emitPill({
      tw, bh,
      paint: (px, py) => {
        c.save();
        c.setLineDash([]);
        c.shadowBlur = 0;
        c.font = `800 ${f}px ${B.font}`;
        const p = pillBox(c, color, px, py, tw, bh);
        c.fillStyle = B.color(color);
        c.textAlign = 'center';
        c.textBaseline = 'middle';
        ls.forEach((l, i) => c.fillText(l, p.x, p.y - bh / 2 + 4 + lh * (i + 0.5)));
        c.restore();
      }
    }, x, y);
  }
  // 세로 분수 알약: 앞글(prefix) + 분자/분모 + 뒷글(suffix)
  function drawCanvasFraction(_c, numStr, denStr, x, y, options = {}) {
    const { color = '#fbbf24', fontSize = 14, prefix = '', suffix = '' } = options;
    const c = B.ctx;
    const maxW = Math.max(140, stageBox().x1 - stageBox().x0);
    c.save();
    let fs = fontSize * B.fs;
    let preW, sufW, fracW, totalW;
    const meas = () => {
      c.font = `800 ${fs}px ${B.font}`;
      preW = prefix ? c.measureText(prefix).width + 4 : 0;
      sufW = suffix ? c.measureText(suffix).width + 4 : 0;
      fracW = Math.max(c.measureText(numStr).width, c.measureText(denStr).width) + 10;
      totalW = preW + fracW + sufW + 16;
    };
    meas();
    if (totalW > maxW) { fs = Math.max(9.5, (fs * maxW) / totalW); meas(); }
    const totalH = fs * 2.5;
    const f = fs, pw = preW, fw = fracW, tw = totalW;
    c.restore();
    emitPill({
      tw, bh: totalH,
      paint: (px, py) => {
        c.save();
        c.setLineDash([]);
        c.shadowBlur = 0;
        c.font = `800 ${f}px ${B.font}`;
        const p = pillBox(c, color, px, py, tw, totalH);
        c.fillStyle = B.color(color);
        c.textBaseline = 'middle';
        let curX = p.x - tw / 2 + 8;
        if (prefix) { c.textAlign = 'left'; c.fillText(prefix, curX, p.y); curX += pw; }
        const cf = curX + fw / 2;
        c.textAlign = 'center';
        c.fillText(numStr, cf, p.y - f * 0.58);
        c.fillText(denStr, cf, p.y + f * 0.62);
        c.strokeStyle = B.color(color);
        c.lineWidth = 1.6;
        c.beginPath();
        c.moveTo(cf - fw / 2 + 2, p.y);
        c.lineTo(cf + fw / 2 - 2, p.y);
        c.stroke();
        curX += fw;
        if (suffix) { c.textAlign = 'left'; c.fillText(suffix, curX + 4, p.y); }
        c.restore();
      }
    }, x, y);
  }

  /* ---------- 3. 실시간 값 (원본 updateLiveHUDAndInvariants 의 계산 그대로) ---------- */
      function hudOf(s, m, j) {
      const mode = KILLER_MODES[m];
      const mId = mode.id;
      const p = pv(s, m);
  let hudEq = '';

      let cards = [];

      if (mId === 'type1') {
        const fk = (p.k - p.r1) * (p.k - p.r2);
        const isEven = Math.round(p.n) % 2 === 0;
        const countN = !isEven ? 1 : (Math.abs(fk) < 1e-5 ? 1 : (fk > 0 ? 2 : 0));
        hudEq = (
          `$f(x)=(x-${p.r1})(x-${p.r2}), \\quad f(${p.k.toFixed(2)}) = ${fk.toFixed(2)}, \\quad x^{${Math.round(p.n)}} = f(k)$`
        );
        cards = [
          { title: '함숫값 부호 f(k)', val: fk.toFixed(2), sub: fk > 0 ? '양수' : (Math.abs(fk) < 1e-4 ? '0' : '음수') },
          { title: `실근 개수 g(k, ${Math.round(p.n)})`, val: `${countN}개`, sub: isEven ? 'n이 짝수: f(k)의 부호에 따라 달라짐' : 'n이 홀수: 항상 1개' },
          { title: '홀수 제곱근의 실근의 개수', val: '1개', sub: '항상 1개' },
          { title: '짝수 제곱근의 실근이 0개인 자연수 k의 합', val: `${((p.r1 + p.r2) / 2) * (p.r2 - p.r1 - 1)}`, sub: `${p.r1} < k < ${p.r2}인 자연수의 합` }
        ];
      } else if (mId === 'type2') {
        const lenAB = Math.hypot(p.dx, p.dy);
        const slope = p.dy / p.dx;
        const areaS = 2 * p.dx; // between y=mx+1 and y=mx+3
        hudEq = (
          `$C_1: y=2^x, \\quad C_2: y=2^{x-${p.dx.toFixed(2)}}+${p.dy.toFixed(2)}, \\quad \\text{기울기 } m = \\frac{${p.dy.toFixed(2)}}{${p.dx.toFixed(2)}} = ${slope.toFixed(2)}$`
        );
        cards = [
          { title: '선분 길이 AB', val: `${lenAB.toFixed(3)}`, sub: `√(Δx²+Δy²) = √${(p.dx*p.dx + p.dy*p.dy).toFixed(2)}` },
          { title: '선분 길이의 비 AB ÷ √(m²+n²)', val: '1.000', sub: 'AB = √(m²+n²)이므로 항상 1' },
          { title: '넓이 S', val: `${areaS.toFixed(2)}`, sub: '(두 직선의 y절편의 차 2) × Δx' },
          { title: '평행이동한 양 (Δx, Δy)', val: `(${p.dx.toFixed(2)}, ${p.dy.toFixed(2)})`, sub: `이동한 방향의 기울기 ${slope.toFixed(2)}` }
        ];
      } else if (mId === 'type3') {
        const xA = solveExpLineIntersection(p.k, p.shift);
        const yA = p.k - xA;
        const xB = yA;
        const yB = xA;
        const dx = Math.abs(xB - xA);
        const lenAB = Math.hypot(xB - xA, yB - yA);
        const areaOAB = 0.5 * Math.abs(xA * yB - xB * yA);
        hudEq = (
          `$y=2^{x-${p.shift}}+${p.shift}, \\quad y=\\log_2(x-${p.shift})+${p.shift}, \\quad y=-x+${p.k.toFixed(2)}$`
        );
        cards = [
          { title: '선분 길이 AB', val: lenAB.toFixed(3), sub: `Δx·√2 = ${dx.toFixed(2)}×√2` },
          { title: '선분 길이의 비 AB ÷ (Δx·√2)', val: (dx > 1e-4 ? (lenAB / (dx * Math.SQRT2)).toFixed(3) : '1.000'), sub: '항상 1' },
          { title: '대칭 중점 M 좌표', val: `(${(p.k/2).toFixed(2)}, ${(p.k/2).toFixed(2)})`, sub: 'x_A + x_B = k' },
          { title: '삼각형 OAB 넓이', val: areaOAB.toFixed(3), sub: '½ · k · Δx와 같음' }
        ];
      } else if (mId === 'type4') {
        const t = p.t, k = p.kAsym;
        if (j === 0) {
          const x1 = 2 ** (-t), x2 = 2 ** t;
          hudEq = `$|\\log_2 x|=t \\Rightarrow x_1=2^{-t},\\ x_2=2^t,\\ x_1x_2=1$`;
          cards = [
            { title: '두 교점의 곱', val: '1', sub: '수평선 높이가 바뀌어도 서로 역수' },
            { title: '교점의 차 x₂−x₁', val: '≈ ' + (x2-x1).toFixed(3), sub: '2ᵗ−2⁻ᵗ: t가 커지면 증가' }
          ];
        } else {
          const two = t > 0 && t < k, count = t < 0 ? 0 : t === 0 ? 1 : two ? 2 : 1;
          hudEq = two ? `$2^{x_1}=k-t,\\ 2^{x_2}=k+t \\Rightarrow 2^{x_1+x_2}=k^2-t^2$` : `$|2^x-${k}|=${t}\\text{ 의 교점은 }${count}\\text{개}$`;
          cards = [
            { title: '교점 개수', val: count + '개', sub: '0<t<k일 때만 서로 다른 두 교점' },
            { title: '두 근의 합 x₁+x₂', val: two ? '≈ ' + Math.log2(k*k-t*t).toFixed(3) : '두 근 없음', sub: two ? '정확한 값 log₂(k²−t²)' : 't=0 또는 t≥k에서는 교점 1개' }
          ];
        }
      } else if (mId === 'type5') {
        const k = p.ratioK, yP = j === 0 ? 3 : k ** (1/(k-1)), yQ = k*yP;
        const a = yP ** (1/p.tVal), b = yQ ** (1/(k*p.tVal));
        hudEq = j === 0 ? `$OP:OQ=1:k \\Rightarrow Q=kP,\\ a^t=3,\\ b^{kt}=3k$` : `$Q=kP,\\ y_Q=y_P^k=ky_P \\Rightarrow y_P^{k-1}=k$`;
        cards = [
          { title: 'P의 높이', val: '≈ ' + yP.toFixed(3), sub: j === 0 ? '주어진 높이 3을 유지하며 두 밑을 비교' : 'k^(1/(k−1)) — t와 무관' },
          { title: 'Q의 높이', val: '≈ ' + yQ.toFixed(3), sub: '원점을 중심으로 가로·세로 모두 k배' },
          { title: j === 0 ? '두 밑 a, b' : '밑 a', val: j === 0 ? `≈ ${a.toFixed(3)}, ${b.toFixed(3)}` : '≈ '+a.toFixed(3), sub: j === 0 ? 'P는 y=aˣ, Q는 y=bˣ 위' : '두 점 모두 같은 지수곡선 위' }
        ];
      } else if (mId === 'type6') {
        if (j === 0) {
          const y1=Math.log2(p.x1+1), y2=Math.log2(p.x2+1);
          const P=y1/p.x1, Q=y2/p.x2, R=(y2-y1)/(p.x2-p.x1);
          hudEq = `$Q=\\frac{x_1}{x_2}P+\\frac{x_2-x_1}{x_2}R,\\quad P>Q>R$`;
          cards = [
            {title:'기울기 P, Q, R',val:`≈ ${P.toFixed(3)}, ${Q.toFixed(3)}, ${R.toFixed(3)}`,sub:'A가 선분 OB보다 위: P>Q. Q는 P와 R의 가중평균'},
            {title:'가중치의 합',val:'1',sub:'x₁/x₂ + (x₂−x₁)/x₂ = 1, 두 가중치는 양수'}
          ];
        } else {
          const y1=2**p.x1, y2=2**p.x2, ym=Math.sqrt(y1*y2), w=p.x2-p.x1;
          hudEq = `$S_{\\rm trap}-S_{\\rm mid}=(x_2-x_1)\\left(\\frac{y_1+y_2}{2}-\\sqrt{y_1y_2}\\right)>0$`;
          cards = [
            {title:'같은 가로폭',val:w.toFixed(2),sub:'넓이는 높이만 비교하면 됩니다'},
            {title:'산술평균 높이 / 기하평균 높이',val:`≈ ${((y1+y2)/2).toFixed(3)} / ${ym.toFixed(3)}`,sub:'현의 중점은 곡선 위의 점보다 위'},
            {title:'넓이 차',val:'≈ '+(w*((y1+y2)/2-ym)).toFixed(3),sub:'(√y₂−√y₁)²/2 × 가로폭'}
          ];
        }
      } else if (mId === 'type7') {
        const maxX = Math.round(p.maxX);
        let totalDots = 0;
        for (let x = 1; x <= maxX; x++) {
          totalDots += Math.floor(Math.log2(x) + 1e-9) + 1;
        }
        const topFloor = Math.floor(Math.log2(maxX) + 1e-9) + 1;
        hudEq = (
          `$1 \\le x \\le ${maxX}, \\quad 1 \\le y \\le \\log_2 x + 1 \\implies \\text{자연수 격자점 총 } ${totalDots}\\text{개}$`
        );
        cards = [
          { title: `총 자연수 격자점 (1≤x≤${maxX})`, val: `${totalDots}개`, sub: '세로줄로 센 합 = 가로줄로 센 합' },
          { title: `x = ${maxX} 줄의 점 개수`, val: `${topFloor}개`, sub: `1 ≤ y ≤ log₂${maxX} + 1인 정수 y의 개수` },
          { title: '세로줄로 센 개수 − 가로줄로 센 개수', val: '0', sub: '두 방법으로 센 결과는 같음' },
          { title: '줄의 점 개수가 늘어나는 x', val: '1, 2, 4, 8', sub: 'x = 2ᵐ (2의 거듭제곱)인 곳' }
        ];
      } else if (mId === 'type8') {
        const D = p.sumT * p.sumT - 4 * p.prodT;
        const two = D > 1e-10 && p.sumT > 0 && p.prodT > 0;
        const alphaPlusBeta = two ? Math.log2(p.prodT) : NaN;
        const f1 = 1 - p.sumT + p.prodT;
        hudEq = (
          `$(2^x)^2 - ${p.sumT.toFixed(2)}\\cdot 2^x + ${p.prodT.toFixed(2)} = 0 \\iff t^2 - ${p.sumT.toFixed(2)}t + ${p.prodT.toFixed(2)} = 0 \\;(t>0)$`
        );
        cards = [
          { title: '두 근의 합 α + β', val: two ? '≈ ' + alphaPlusBeta.toFixed(3) : '서로 다른 두 실근 없음', sub: two ? `정확한 값 log₂(${p.prodT.toFixed(2)})` : 'D>0, t₁>0, t₂>0을 먼저 확인' },
          { title: '판별식 D', val: D.toFixed(2), sub: D > 0 ? '서로 다른 두 실근' : (D === 0 ? '중근' : '실근 없음') },
          { title: '양의 실근 경계 f(1)', val: f1.toFixed(2), sub: f1 > 0 && D > 0 && p.sumT/2 > 1 ? '두 근이 모두 1보다 큼 (x>0인 두 실근)' : '조건을 만족시키지 않음' },
          { title: '2^(α+β) − P의 값', val: two ? '0' : '적용 불가', sub: '원래 방정식에 서로 다른 두 실근이 있을 때 적용' }
        ];
      }

      return { formula: hudEq, cards };
}

  /* ---------- 4. 쌍둥이 숫자 변형 (원본 triggerTwinProblem 의 값 생성 그대로) ---------- */
  function twin(s, m) {
    const mId = MID(m);
    const q = pv(s, m);
    let problem = '';
        
      

      if (mId === 'type1') {
        const pairs = [[1, 5], [2, 8], [1, 7], [3, 9]];
        const pick = pairs[Math.floor(Math.random() * pairs.length)];
        const mid = (pick[0] + pick[1]) / 2;
        const countNat = pick[1] - pick[0] - 1;
        const sumNat = mid * countNat;
        q.r1 = pick[0];
        q.r2 = pick[1];
        q.k = mid;
        q.n = 4;
        problem = `**[숫자를 바꾼 문제]** 이차함수 $f(x) = (x-${pick[0]})(x-${pick[1]})$에 대하여, $f(k)$의 네제곱근($n=4$) 중 실수인 것의 개수 $g(k, 4) = 0$을 만족시키는 모든 자연수 $k$는 총 $${countNat}$개이며, 그 합은 (가운데 값)×(개수)이므로 $${mid} \\times ${countNat} = ${sumNat}$입니다. 칠판에서 확인해 보세요.`;
      } else if (mId === 'type2') {
        const dxList = [1, 2, 3, 4];
        const dyList = [2, 3, 4, 6];
        const dx = dxList[Math.floor(Math.random() * dxList.length)];
        const dy = dyList[Math.floor(Math.random() * dyList.length)];
        const sq = dx * dx + dy * dy;
        const slopeStr = dy % dx === 0 ? `${dy / dx}` : `\\frac{${dy}}{${dx}}`;
        q.dx = dx;
        q.dy = dy;
        problem = `**[숫자를 바꾼 문제]** 두 곡선 $y = 2^x$과 $y = 2^{x-${dx}} + ${dy}$가 기울기 $${slopeStr}$인 직선과 만나는 두 점 $A, B$는 평행이동으로 서로 겹쳐지는 점이므로, 피타고라스 정리에 의하여 선분의 길이는 $\\overline{AB} = \\sqrt{${dx}^2 + ${dy}^2} = \\sqrt{${sq}}$입니다.`;
      } else if (mId === 'type3') {
        const kVal = [4, 5, 6, 7, 8][Math.floor(Math.random() * 5)];
        q.k = kVal;
        problem = `**[숫자를 바꾼 문제]** $y = 2^x$과 $y = \\log_2 x$가 직선 $y = -x + ${kVal}$과 만나는 두 점 $A, B$의 중점은 $M\\left(\\frac{${kVal}}{2}, \\frac{${kVal}}{2}\\right)$이고, $\\overline{AB} = \\sqrt{2}(x_B - x_A)$가 성립합니다.`;
      } else if (mId === 'type4') {
        const tVal = [1, 1.5, 2, 2.5, 3][Math.floor(Math.random() * 5)];
        q.t = tVal;
        const x2 = Math.pow(2, tVal);
        const x1 = Math.pow(2, -tVal);
        problem = `**[숫자를 바꾼 문제]** $y = |\\log_2 x|$와 직선 $y = ${tVal}$의 두 교점의 $x$좌표를 $x_1, x_2$라 하면 차는 $x_2 - x_1 = ${(x2 - x1).toFixed(3)}$이지만, 두 교점의 $x$좌표의 곱은 변하지 않고 **$x_1 \\cdot x_2 = 1$**입니다.`;
      } else if (mId === 'type5') {
        const rk = [2, 3, 4][Math.floor(Math.random() * 3)];
        q.ratioK = rk;
        problem = `**[숫자를 바꾼 문제]** 원점을 지나는 직선이 $y = a^x$과 만나는 두 점 $P, Q$에 대하여 $\\overline{OP}:\\overline{OQ} = 1 : ${rk}$이면, $x$좌표의 비도 $1:${rk}$이고 $(y_P)^{${rk}} = ${rk}\\cdot y_P$가 성립합니다.`;
      } else if (mId === 'type6') {
        const x1 = [0.5, 1.0, 1.5][Math.floor(Math.random() * 3)];
        const x2 = [2.5, 3.0, 3.5][Math.floor(Math.random() * 3)];
        q.x1 = x1;
        q.x2 = x2;
        problem = `**[숫자를 바꾼 문제]** 두 점의 $x$좌표를 $x_1 = ${x1}, x_2 = ${x2}$로 바꾸었습니다. 원점과 두 점 $A, B$를 지나는 직선의 기울기 $P, Q$, 직선 $AB$의 기울기 $R$, 사다리꼴의 넓이를 칠판에서 비교해 보세요.`;
      } else if (mId === 'type7') {
        const mx = [4, 5, 6, 7, 8][Math.floor(Math.random() * 5)];
        q.maxX = mx;
        let cnt = 0;
        for (let i = 1; i <= mx; i++) cnt += Math.floor(Math.log2(i) + 1e-9) + 1;
        problem = `**[숫자를 바꾼 문제]** 자연수 $x$의 최댓값을 $k = ${mx}$로 바꾸었습니다. $1 \\le x \\le ${mx}, 1 \\le y \\le \\log_2 x + 1$을 만족시키는 자연수 순서쌍 $(x,y)$의 개수는 **${cnt}개**입니다.`;
      } else if (mId === 'type8') {
        const pairs = [[5, 6], [7, 12], [6, 8], [9, 16]];
        const pick = pairs[Math.floor(Math.random() * pairs.length)];
        q.sumT = pick[0];
        q.prodT = pick[1];
        const alphaBeta = Math.log2(pick[1]);
        problem = `**[숫자를 바꾼 문제]** 지수방정식 $(2^x)^2 - ${pick[0]}\\cdot 2^x + ${pick[1]} = 0$의 두 실근 $\\alpha, \\beta$의 합은 일차항의 계수($-${pick[0]}$)와 관계없이 $\\alpha + \\beta = \\log_2 ${pick[1]} = ${Number.isInteger(alphaBeta) ? alphaBeta : alphaBeta.toFixed(3)}$입니다.`;
      }
    Object.assign(s, mapP(m, q));
    s.twinSnap = mapP(m, q);
    s.twinText = APLab.stripEmoji(problem);
    APLab.toast('숫자를 바꾼 새 문제가 만들어졌습니다');
  }

  /* ---------- 5. 유형별 칠판 그리기 (원본 renderType1~8 그대로, 상태 s 를 인자로 받도록만 바꿈) ---------- */
      // --- TYPE 1: n-th Root Real Solutions Matrix ---
    function renderType1(ST, si) {
      const p = pv(ST, 0);
      const K = (k) => 'type1_' + k;
      const n = Math.round(p.n);
      const fk = (p.k - p.r1) * (p.k - p.r2);

      // Left curve: Quadratic f(x) = 0.5*(x-r1)*(x-r2) scaled for clarity
      drawFunctionCurve(x => (x - p.r1) * (x - p.r2), '#34d399', 2.8);

      // Right shifted curve: y = (x + 4)^n at x = -4
      const rootCenter = -4.5;
B.text([rootCenter, 0], 'u = 0', { color: 'sky', size: 11, align: 'center', dy: 31 });
B.text([rootCenter, B.viewBox().y1 - 1], 'y = uⁿ  (u = x + 4.5)', { color: 'sky', size: 11, align: 'center' });
      drawFunctionCurve(x => Math.pow(x - rootCenter, n), '#38bdf8', 2.6, [], rootCenter - 2.5, rootCenter + 2.5);
      drawMathSegment(rootCenter, -10, rootCenter, 10, 'rgba(56, 189, 248, 0.3)', [4, 4], 1.2);

      // Step 1: Zero boundaries r1, r2
      if ((ST.step >= 1)) {
        drawMathPoint(p.r1, 0, `r₁=${p.r1}`, '#34d399', 5);
        drawMathPoint(p.r2, 0, `r₂=${p.r2}`, '#34d399', 5);
        const midPt = mathToScreen((p.r1 + p.r2) / 2, -1.8);
        drawCanvasBadge(ctx, `f(k) < 0인 구간 (${p.r1} < k < ${p.r2}): 짝수 제곱근의 실근 0개`, midPt.x, midPt.y, '#fb7185');
      }

      // Horizontal level line y = 0.5 * f(k) connecting both curves
      const yScaled = fk; // 실제 함수값과 수평선 높이를 같은 좌표계에 표시
      if ((ST.step >= 2)) {
        drawMathLine(0, yScaled, '#fbbf24', [5, 5], 1.8);
        // Show intersections on the x^n curve
        const isEven = n % 2 === 0;
        if (!isEven) {
          const rx = rootCenter + Math.sign(yScaled) * Math.pow(Math.abs(yScaled), 1 / n);
          drawMathPoint(rx, yScaled, '실근 1개(홀수)', '#fbbf24', 6);
        } else {
          if (Math.abs(yScaled) < 1e-3) {
            drawMathPoint(rootCenter, 0, '중근 1개(0)', '#fbbf24', 6);
          } else if (yScaled > 0) {
            const d = Math.pow(yScaled, 1 / n);
            drawMathPoint(rootCenter - d, yScaled, '-ⁿ√f(k)', '#fbbf24', 6);
            drawMathPoint(rootCenter + d, yScaled, '+ⁿ√f(k)', '#fbbf24', 6);
          } else {
            const noPt = mathToScreen(rootCenter, yScaled - 0.8);
            drawCanvasBadge(ctx, '교점 없음 (n이 짝수이고 f(k)<0 ⟹ 0개)', noPt.x, noPt.y, '#fb7185');
          }
        }
      }

      if ((ST.step >= 3)) {
        const badgePos = mathToScreen((p.r1 + p.r2) / 2, 3.8);
        drawCanvasFraction(ctx, `${p.r1} + ${p.r2}`, '2', badgePos.x, badgePos.y, {
          prefix: '대칭축 k = ',
          suffix: ` = ${(p.r1 + p.r2) / 2}`
        });
      }

      // Draggable handle for k on f(k)
      drawMathPoint(p.k, yScaled, `P(k=${p.k.toFixed(2)}, f≈${fk.toFixed(2)})`, '#fbbf24', 7.5, true, (mPos) => {
        ST[K('k')] = Math.max(0, Math.min(8, Math.round(mPos.x * 10) / 10));
      });
    }

    // --- TYPE 2: Translation Vector & Slope Cut ---
    function renderType2(ST, si) {
      const p = pv(ST, 1);
      const K = (k) => 'type2_' + k;
      const slope = p.dy / p.dx;
      const showType2BRegion = si === 1;

      // Curve 1: y = 2^x, Curve 2: y = 2^(x - dx) + dy
      drawFunctionCurve(x => Math.pow(2, x), '#34d399', 2.8, [], -5, 4.5);
      drawFunctionCurve(x => Math.pow(2, x - p.dx) + p.dy, '#38bdf8', 2.8, [], -3, 7);

      // Anchor point A on Curve 1 and Corresponding Point B on Curve 2
      const xA = p.x0;
      const yA = Math.pow(2, xA);
      const xB = xA + p.dx;
      const yB = yA + p.dy;

      // Line passing through A and B
      const intercept = yA - slope * xA;
      if (!showType2BRegion) drawMathLine(slope, intercept, 'rgba(251, 191, 36, 0.7)', [], 2.2);

      // TYPE 02B's fixed region is bounded by the increasing branches and
      // y-x=1,3. In s=y-x coordinates, translation by (3,3) preserves s.
      if (showType2BRegion) {
        const increasingRoot = (target) => {
          let lo = Math.log2(slope/Math.LN2), hi = 20;
          for (let i = 0; i < 60; i++) {
            const mid = (lo + hi) / 2;
            if (Math.pow(2, mid) - slope*mid < target) lo = mid;
            else hi = mid;
          }
          return (lo + hi) / 2;
        };
        const t1 = increasingRoot(1), t3 = increasingRoot(3);
        drawMathLine(slope, 1, 'rgba(251, 191, 36, 0.55)', [5, 5], 1.5);
        drawMathLine(slope, 3, 'rgba(251, 191, 36, 0.55)', [5, 5], 1.5);
        const p1 = mathToScreen(t1, Math.pow(2, t1));
        const p2 = mathToScreen(t3, Math.pow(2, t3));
        const p3 = mathToScreen(t3 + p.dx, Math.pow(2, t3) + p.dy);
        if ((ST.step >= 1) || (ST.step >= 2)) {
          drawMathPoint(t3, Math.pow(2, t3), 's=3', '#fbbf24', 5.5, false);
          drawMathPoint(t3 + p.dx, Math.pow(2, t3) + p.dy, 's=3', '#38bdf8', 5.5, false);
        }
        if (ST.step >= 2) { const xm=increasingRoot(2); B.seg([xm,2**xm],[xm+p.dx,2**xm+p.dy],{color:"rose",width:3}); }
        if ((ST.step >= 3)) {
          ctx.save();
          ctx.fillStyle = col('rgba(52, 211, 153, 0.18)');
          ctx.strokeStyle = col('#34d399');
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(p1.x, p1.y);
          for (let i = 1; i <= 60; i++) {
            const x = t1 + (t3 - t1) * i / 60;
            const q = mathToScreen(x, Math.pow(2, x));
            ctx.lineTo(q.x, q.y);
          }
          ctx.lineTo(p3.x, p3.y);
          for (let i = 59; i >= 0; i--) {
            const x = t1 + (t3 - t1) * i / 60;
            const q = mathToScreen(x + p.dx, Math.pow(2, x) + p.dy);
            ctx.lineTo(q.x, q.y);
          }
          ctx.closePath();
          ctx.fill();
          ctx.stroke();
          ctx.restore();
          const mid = mathToScreen((t1 + t3 + p.dx) / 2, (Math.pow(2, t1) + Math.pow(2, t3) + p.dy) / 2);
          drawCanvasBadge(ctx, `같은 단면 길이 × 수직 폭 → S = 2Δx = ${2*p.dx}`, mid.x, mid.y, '#34d399');
        }
      }

      // Step 1 & 2: Right Triangle (dx, dy)
      if (!showType2BRegion && ((ST.step >= 1) || (ST.step >= 2))) {
        ctx.save();
        const sA = mathToScreen(xA, yA);
        const sC = mathToScreen(xB, yA);
        const sB = mathToScreen(xB, yB);
        ctx.fillStyle = col('rgba(251, 191, 36, 0.14)');
        ctx.beginPath();
        ctx.moveTo(sA.x, sA.y);
        ctx.lineTo(sC.x, sC.y);
        ctx.lineTo(sB.x, sB.y);
        ctx.closePath();
        ctx.fill();
        ctx.restore();

        drawMathSegment(xA, yA, xB, yA, '#fbbf24', [5, 4], 2);
        drawMathSegment(xB, yA, xB, yB, '#fbbf24', [5, 4], 2);

        const midBottom = mathToScreen((xA + xB) / 2, yA - 0.55);
        drawCanvasBadge(ctx, `Δx = ${p.dx.toFixed(2)}`, midBottom.x, midBottom.y, '#fbbf24');
        const midRight = mathToScreen(xB + 1.1, (yA + yB) / 2);
        drawCanvasBadge(ctx, `Δy = ${p.dy.toFixed(2)}`, midRight.x, midRight.y, '#fbbf24');
      }

      if(ST.step>=3 && !showType2BRegion){
        B.seg([xA,yA],[xB,yB],{color:'amber',width:3.5});
        OV.corner(B,0,'대응점 사이 거리 = √(Δx²+Δy²)','amber');
      }

      // Draggable Points A (controls x0) and B (controls dx, dy)
      drawMathPoint(xA, yA, `A(${xA.toFixed(1)}, ${yA.toFixed(1)})`, '#34d399', 6.5, true, (mPos) => {
        ST[K('x0')] = Math.max(-1.5, Math.min(1.5, Math.round(mPos.x * 10) / 10));
      });
      drawMathPoint(xB, yB, `B(${xB.toFixed(1)}, ${yB.toFixed(1)})`, '#fbbf24', 7.5, true, (mPos) => {
        ST[K('dx')] = Math.max(1, Math.min(4, Math.round((mPos.x - xA) * 4) / 4));
        ST[K('dy')] = Math.max(1, Math.min(5, Math.round((mPos.y - yA) * 4) / 4));
      });
    }

    // --- TYPE 3: Inverse Function Symmetry & 1:1:√2 ---
    function renderType3(ST, si) {
      const p = pv(ST, 2);
      const K = (k) => 'type3_' + k;
      const s = p.shift;

      // Exponential & Log curves
      drawFunctionCurve(x => Math.pow(2, x - s) + s, '#34d399', 2.8, [], -4, 4.5);
      drawFunctionCurve(x => Math.log2(x - s) + s, '#38bdf8', 2.8, [], s + 0.03, 9);

      // Line y = -x + k
      drawMathLine(-1, p.k, '#fbbf24', [], 2.2);

      // Intersection Points A, B & Midpoint M
      const xA = solveExpLineIntersection(p.k, s);
      const yA = p.k - xA;
      const xB = yA;
      const yB = xA;
      const mx = p.k / 2;
      const my = p.k / 2;

      // Step 1: y = x Symmetry Line & Origin Triangle OAB
      if ((ST.step >= 1)) {
        drawMathLine(1, 0, 'rgba(251, 191, 36, 0.55)', [6, 5], 1.8);
        ctx.save();
        const pO = mathToScreen(0, 0);
        const pA = mathToScreen(xA, yA);
        const pB = mathToScreen(xB, yB);
        ctx.fillStyle = col('rgba(56, 189, 248, 0.12)');
        ctx.beginPath();
        ctx.moveTo(pO.x, pO.y);
        ctx.lineTo(pA.x, pA.y);
        ctx.lineTo(pB.x, pB.y);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      }

      // Step 2: 1 : 1 : √2 Right Isosceles Triangle
      if ((ST.step >= 2)) {
        const dx = Math.abs(xB - xA);
        ctx.save();
        const pA = mathToScreen(xA, yA);
        const pB = mathToScreen(xB, yB);
        const pC = mathToScreen(xA, yB);
        ctx.fillStyle = col('rgba(251, 191, 36, 0.18)');
        ctx.beginPath();
        ctx.moveTo(pA.x, pA.y);
        ctx.lineTo(pC.x, pC.y);
        ctx.lineTo(pB.x, pB.y);
        ctx.closePath();
        ctx.fill();
        ctx.restore();

        drawMathSegment(xA, yA, xA, yB, '#fbbf24', [4, 4], 2);
        drawMathSegment(xA, yB, xB, yB, '#fbbf24', [4, 4], 2);

        const lblPos = mathToScreen((xA + xB) / 2 - 0.6, Math.min(yA, yB) - 0.5);
        drawCanvasBadge(ctx, `1:1:√2 ⟹ Δx = Δy = ${dx.toFixed(2)}`, lblPos.x, lblPos.y, '#fbbf24');
      }

      // Step 3: Midpoint Vertical Fraction Readout
      if ((ST.step >= 3)) {
        const mScreen = mathToScreen(mx + 1.4, my + 0.9);
        drawCanvasFraction(ctx, `${p.k.toFixed(2)}`, '2', mScreen.x, mScreen.y, {
          prefix: '대칭 중점 M(',
          suffix: `, ${(p.k/2).toFixed(2)})`
        });
      }

      drawMathPoint(xA, yA, `A(${xA.toFixed(2)}, ${yA.toFixed(2)})`, '#34d399', 6);
      drawMathPoint(xB, yB, `B(${xB.toFixed(2)}, ${yB.toFixed(2)})`, '#38bdf8', 6);
      drawMathPoint(mx, my, `M [드래그 k=${p.k.toFixed(2)}]`, '#fbbf24', 7.5, true, (mPos) => {
        ST[K('k')] = Math.max(2.5, Math.min(8.5, Math.round((mPos.x + mPos.y) * 10) / 10));
      });
    }

    // --- TYPE 4: Absolute Value Fold & Product Invariant ---
    function renderType4(ST, si) {
      const p=pv(ST,3), t=p.t, k=p.kAsym, vb=B.viewBox();
      drawMathLine(0,t,'#fbbf24',[],2.2);
      if (si===0) {
        drawFunctionCurve(x=>Math.abs(Math.log2(x)),'#34d399',2.8,[],0.002,vb.x1);
        const x1=2**(-t),x2=2**t;
        if(ST.step>=1) drawFunctionCurve(x=>Math.log2(x),'rgba(148,163,184,.6)',1.6,[4,4],0.002,1);
        if(ST.step>=2){ B.seg([x1,t],[x1,0],{color:'rose',dash:[4,4]}); B.seg([x2,t],[x2,0],{color:'sky',dash:[4,4]}); }
        B.point([x1,t],{color:'rose',r:6,label:'x₁ ≈ '+x1.toFixed(3),dx:-8,dy:-15,align:'right'});
        B.handle('t',[x2,t],{color:'amber',r:7,label:'x₂ ≈ '+x2.toFixed(3),dx:8,dy:-15,drag:w=>{ST.type4_t=clamp(Math.round(w.y*20)/20,0.3,3.2);}});
        if(ST.step>=3) OV.corner(B,0,'x₁=2⁻ᵗ, x₂=2ᵗ → x₁x₂=1','amber');
      } else {
        drawFunctionCurve(x=>Math.abs(2**x-k),'#34d399',2.8,[],vb.x0,vb.x1);
        if(ST.step>=1) B.hline(k,{color:'violet',dash:[6,4],width:2});
        const two=t>0&&t<k;
        if(two) B.point([Math.log2(k-t),t],{color:'rose',r:6,label:'2^x₁=k−t',dx:-8,dy:-15,align:'right'});
        B.point([Math.log2(k+t),t],{color:'sky',r:6,label:two?'2^x₂=k+t':'유일한 교점',dx:8,dy:-15});
        B.handle('t',[0,t],{color:'amber',r:7,label:'t = '+t.toFixed(2),dx:8,dy:18,drag:w=>{ST.type4_t=clamp(Math.round(w.y*20)/20,0,Math.max(5,k+1));}});
        if(ST.step>=2) OV.corner(B,1,two?'0 < t < k : 두 교점':'t=0 또는 t≥k : 교점 1개','violet');
        if(ST.step>=3&&two) OV.corner(B,0,'2^(x₁+x₂)=(k−t)(k+t)=k²−t²','amber');
      }
    }

    // --- TYPE 5: Internal/External Ratio & Similarity Projection ---
    function renderType5(ST, si) {
      const p = pv(ST, 4);
      const K = (k) => 'type5_' + k;
      const k = p.ratioK;
      const t = p.tVal;

      // Invariant yP = k^(1/(k-1)) so P(t, yP) and Q(k*t, k*yP) both lie on y = a^x and line y = mx
      const yP = si === 0 ? 3 : Math.pow(k, 1 / (k - 1));
      const yQ = k * yP;
      const baseA = Math.pow(yP, 1 / t);
      const slopeM = yP / t;
      const baseB = Math.pow(yQ, 1/(k*t));

      // Exponential curve y = a^x & Line through origin
      drawFunctionCurve(x => Math.pow(baseA, x), '#34d399', 2.8, [], -3, k * t + 1.2);
      if(si === 0) drawFunctionCurve(x => Math.pow(baseB,x), '#38bdf8',2.8,[],-3,k*t+1.2);
      drawMathLine(slopeM, 0, '#fbbf24', [], 2.0);

      // Step 1 & 2: Similar Right Triangles on x-axis
      if ((ST.step >= 1) || (ST.step >= 2)) {
        ctx.save();
        const pO = mathToScreen(0, 0);
        const pQ = mathToScreen(k * t, yQ);
        const pQx = mathToScreen(k * t, 0);
        ctx.fillStyle = col('rgba(56, 189, 248, 0.12)');
        ctx.beginPath();
        ctx.moveTo(pO.x, pO.y);
        ctx.lineTo(pQ.x, pQ.y);
        ctx.lineTo(pQx.x, pQx.y);
        ctx.closePath();
        ctx.fill();
        ctx.restore();

        drawMathSegment(t, yP, t, 0, '#fbbf24', [4, 4], 2);
        drawMathSegment(k * t, yQ, k * t, 0, '#38bdf8', [4, 4], 2);
        drawMathSegment(t, yP, 0, yP, '#fbbf24', [4, 4], 1.5);
        drawMathSegment(k * t, yQ, 0, yQ, '#38bdf8', [4, 4], 1.5);

        const xMid1 = mathToScreen(t / 2, -0.45);
        const xMid2 = mathToScreen((t + k * t) / 2, -0.45);
        drawCanvasBadge(ctx, `1배 (${t.toFixed(1)})`, xMid1.x, xMid1.y, '#fbbf24');
        drawCanvasBadge(ctx, `k=${k.toFixed(1)}배 (${(k*t).toFixed(1)})`, xMid2.x, xMid2.y, '#38bdf8');
      }

      if ((ST.step >= 3)) {
        const fPos = mathToScreen(k * t * 0.55, yQ * 0.85);
        drawCanvasFraction(ctx, `${si===0?"b":"a"}^(${(k*t).toFixed(1)})`, `a^(${t.toFixed(1)})`, fPos.x, fPos.y, {
          prefix: '닮음비 = ',
          suffix: si === 0 ? ` = ${k.toFixed(1)} (Q = kP)` : ` = ${k.toFixed(1)} ⟹ y_P ≈ ${yP.toFixed(3)}`
        });
      }

      drawMathPoint(t, yP, ST.step>=3 ? `P(${t.toFixed(1)}, ${yP.toFixed(3)})` : 'P (좌우로 드래그)', '#fbbf24', 7.5, true, (mPos) => {
        ST[K('tVal')] = Math.max(0.5, Math.min(1.8, Math.round(mPos.x * 10) / 10));
      });
      drawMathPoint(k * t, yQ, ST.step>=3 ? `Q(${(k*t).toFixed(1)}, ${yQ.toFixed(3)})` : 'Q = kP', '#38bdf8', 6.5);
    }

    // --- TYPE 6: Geometric Translation Comparison (Slopes & Areas) ---
    function renderType6(ST, si) {
      const p = pv(ST, 5);
      const K = (k) => 'type6_' + k;
      const fn = x => si === 0 ? Math.log2(x + 1) : Math.pow(2,x);

      drawFunctionCurve(fn, '#34d399', 2.8, [], -0.85, 7);

      const y1 = fn(p.x1);
      const y2 = fn(p.x2);

      if (si === 1) {
        const xm=(p.x1+p.x2)/2, ym=fn(xm), am=(y1+y2)/2;
        B.poly([[p.x1,0],[p.x2,0],[p.x2,y2],[p.x1,y1]],{fill:'sky',fillAlpha:.12,color:'sky'});
        B.seg([p.x1,y1],[p.x2,y2],{color:'sky',width:2.5});
        if(ST.step>=1){ B.seg([xm,0],[xm,am],{color:'violet',dash:[4,4]}); B.point([xm,am],{color:'sky',label:'산술평균 높이',dx:10,dy:-14}); }
        if(ST.step>=2){B.poly([[p.x1,0],[p.x2,0],[p.x2,ym],[p.x1,ym]],{fill:'amber',fillAlpha:.2,color:'amber'});B.point([xm,ym],{color:'rose',label:'기하평균 높이',dx:10,dy:16});}
        if(ST.step>=3) OV.corner(B,0,'가로폭 같음 → 높이로 넓이 비교','amber');
        B.handle('A',[p.x1,y1],{color:'sky',r:7,label:'A',drag:w=>{ST.type6_x1=clamp(Math.round(w.x*10)/10,.4,p.x2-.4);}});
        B.handle('B',[p.x2,y2],{color:'rose',r:7,label:'B',drag:w=>{ST.type6_x2=clamp(Math.round(w.x*10)/10,p.x1+.4,4.5);}});
        return;
      }

      // Step 3: Trapezoid Area under secant AB
      if ((ST.step >= 3)) {
        ctx.save();
        const pA = mathToScreen(p.x1, y1);
        const pB = mathToScreen(p.x2, y2);
        const pBx = mathToScreen(p.x2, 0);
        const pAx = mathToScreen(p.x1, 0);
        ctx.fillStyle = col('rgba(251, 191, 36, 0.16)');
        ctx.beginPath();
        ctx.moveTo(pAx.x, pAx.y);
        ctx.lineTo(pA.x, pA.y);
        ctx.lineTo(pB.x, pB.y);
        ctx.lineTo(pBx.x, pBx.y);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      }

      // Step 2: Origin slopes OA (P) and OB (Q)
      if ((ST.step >= 2)) {
        drawMathSegment(0, 0, p.x1, y1, '#fb7185', [], 2.4);
        drawMathSegment(0, 0, p.x2, y2, '#38bdf8', [], 2.4);
        const posP = mathToScreen(p.x1 * 0.6, y1 * 0.6 + 0.55);
        drawCanvasFraction(ctx, 'y₁', 'x₁', posP.x, posP.y, {
          color: '#fb7185',
          prefix: 'P = ',
          suffix: ` = ${(y1 / p.x1).toFixed(2)}`
        });
      }

      // Step 1: Secant line AB (Average rate of change R)
      if ((ST.step >= 1)) {
        drawMathSegment(p.x1, y1, p.x2, y2, '#fbbf24', [], 2.6);
        const posR = mathToScreen((p.x1 + p.x2) / 2 + 0.4, (y1 + y2) / 2 - 0.65);
        drawCanvasFraction(ctx, 'y₂ - y₁', 'x₂ - x₁', posR.x, posR.y, {
          color: '#fbbf24',
          prefix: '직선 AB의 기울기 R = ',
          suffix: ` = ${((y2 - y1) / (p.x2 - p.x1)).toFixed(2)}`
        });
      }

      drawMathPoint(p.x1, y1, `A(${p.x1.toFixed(2)}, ${y1.toFixed(2)})`, '#fb7185', 7, true, (mPos) => {
        ST[K('x1')] = Math.max(0.4, Math.min(p.x2 - 0.4, Math.round(mPos.x * 10) / 10));
      });
      drawMathPoint(p.x2, y2, `B(${p.x2.toFixed(2)}, ${y2.toFixed(2)})`, '#fbbf24', 7.5, true, (mPos) => {
        ST[K('x2')] = Math.max(p.x1 + 0.4, Math.min(4.5, Math.round(mPos.x * 10) / 10));
      });
    }

    // --- TYPE 7: Lattice Point (Integer Coordinate) Scanner ---
    function renderType7(ST, si) {
      const p = pv(ST, 6);
      const K = (k) => 'type7_' + k;
      const maxX = Math.round(p.maxX);
      const fn = x => Math.log2(x) + 1;

      // Shaded region 1 <= x <= maxX, 1 <= y <= log2(x) + 1
      ctx.save();
      ctx.fillStyle = col('rgba(52, 211, 153, 0.13)');
      ctx.beginPath();
      const startPt = mathToScreen(1, 1);
      ctx.moveTo(startPt.x, startPt.y);
      for (let x = 1; x <= maxX; x += 0.05) {
        const pt = mathToScreen(x, fn(x));
        ctx.lineTo(pt.x, pt.y);
      }
      const endBottom = mathToScreen(maxX, 1);
      ctx.lineTo(endBottom.x, endBottom.y);
      ctx.closePath();
      ctx.fill();
      ctx.restore();

      drawFunctionCurve(fn, '#34d399', 2.8, [], 0.25, 9.5);
      drawMathSegment(1, 1, maxX, 1, 'rgba(251, 191, 36, 0.6)', [4, 4], 1.6);
      drawMathSegment(maxX, 0, maxX, fn(maxX) + 0.5, '#fbbf24', [5, 4], 2.0);

      // Step 1 & 2: Vertical Slice Columns & Golden Lattice Points
      let totalCount = 0;
      for (let x = 1; x <= maxX; x++) {
        const maxY = Math.floor(fn(x) + 1e-9);
        totalCount += maxY;

        if ((ST.step >= 2)) {
          drawMathSegment(x, 1, x, maxY, 'rgba(56, 189, 248, 0.5)', [], 3);
          const colLabel = mathToScreen(x, 0.45);
          drawCanvasBadge(ctx, `${maxY}개`, colLabel.x, colLabel.y, '#38bdf8');
        }

        if ((ST.step >= 1)) {
          for (let y = 1; y <= maxY; y++) {
            drawMathPoint(x, y, '', '#fbbf24', 5.5);
          }
        }
      }

      // Step 3: Horizontal Row Scan Lines (y = 1, 2, 3, 4)
      if ((ST.step >= 3)) {
        const maxLayer = Math.floor(fn(maxX) + 1e-9);
        for (let y = 1; y <= maxLayer; y++) {
          const startX = Math.pow(2, y - 1);
          drawMathSegment(startX, y, maxX, y, '#fb7185', [], 2.2);
          const rowCnt = maxX - startX + 1;
          const rowPos = mathToScreen(maxX + 1.3, y);
          drawCanvasBadge(ctx, `y=${y}인 줄: ${rowCnt}개`, rowPos.x, rowPos.y, '#fb7185');
        }
      }

      // Handle on x = maxX boundary
      drawMathPoint(maxX, fn(maxX), `k=${maxX}${ST.step >= 3 ? ` (총 ${totalCount}개)` : ''} [드래그]`, '#fbbf24', 8, true, (mPos) => {
        ST[K('maxX')] = Math.max(1, Math.min(8, Math.round(mPos.x)));
      });
    }

    // --- TYPE 8: Substitution t = 2^x & Separation of Roots ---
    function renderType8(ST, si) {
      const p = pv(ST, 7);
      const K = (k) => 'type8_' + k;
      const S = p.sumT;
      const P = p.prodT;

      // 치환한 이차함수의 실제 함숫값: f(t)=t²−St+P
      const scaleY = 1;
      const ft = t => scaleY * (t * t - S * t + P);

      // Step 1: Shaded domain t > 1 (corresponding to x > 0)
      if ((ST.step >= 1)) {
        const boundary = si === 1 ? 1 : 0;
        const s1 = mathToScreen(boundary, 0);
        ctx.save();
        ctx.fillStyle = col('rgba(52, 211, 153, 0.08)');
        ctx.fillRect(s1.x, 0, B.W - s1.x, B.H);
        ctx.restore();
        drawMathSegment(boundary, -30, boundary, 20, '#fb7185', [5, 5], 2);
        const bPt = mathToScreen(1, 3.8);
        drawCanvasBadge(ctx, si===1?'양의 실근 경계: x > 0 ⟺ t = 2^x > 1':'치환의 정의역: t = 2^x > 0', bPt.x, bPt.y, '#fb7185');
      }

      drawFunctionCurve(ft, '#34d399', 2.8, [], -1.5, 9.5);

      const axisT = S / 2;
      const vertexY = ft(axisT);

      // Step 2: Axis of symmetry & Roots t1, t2
      const D = S * S - 4 * P;
      if ((ST.step >= 2)) {
        drawMathSegment(axisT, -6, axisT, 6, 'rgba(56, 189, 248, 0.6)', [4, 4], 1.6);
        if (D >= 0) {
          const t1 = (S - Math.sqrt(D)) / 2;
          const t2 = (S + Math.sqrt(D)) / 2;
          if(Math.abs(D)<1e-10) drawMathPoint(t1,0,`t=${t1} (중근 하나)`,'#38bdf8',6);
          else {drawMathPoint(t1,0,`t₁≈${t1.toFixed(3)}`,'#38bdf8',6);drawMathPoint(t2,0,`t₂≈${t2.toFixed(3)}`,'#38bdf8',6);}
        }
      }

      // Step 3: Product Invariant Formula Badge
      if (ST.step >= 3 && D > 1e-10 && S > 0 && P > 0) {
        const fPos = mathToScreen(axisT, vertexY - 1.3);
        const alphaBeta = Math.log2(P);
        drawCanvasFraction(ctx, `t₁·t₂ = ${P.toFixed(1)}`, `2^(α+β)`, fPos.x, fPos.y, {
          prefix: '근과 계수: ',
          suffix: ` ⟹ α+β = log₂(${P.toFixed(1)}) = ${alphaBeta.toFixed(2)}`
        });
      }

      // Draggable Vertex Handle
      drawMathPoint(axisT, vertexY, `꼭짓점 (축 t=${axisT.toFixed(1)}) [드래그]`, '#fbbf24', 7.5, true, (mPos) => {
        const newAxis = Math.max(1.5, Math.min(4.5, Math.round(mPos.x * 10) / 10));
        ST[K('sumT')] = newAxis * 2;
      });
    }
  const RENDER = [renderType1, renderType2, renderType3, renderType4, renderType5, renderType6, renderType7, renderType8];

  function drawScene(b, s, m, j) {
    B = b; ctx = b.ctx; S = s; HID = 0; PILLS.length = 0;
    // [2.0 수정] 눈금 간격 2.5·0.25 는 글자가 한 자리로 반올림되어(2.5→3) 잘못 읽히므로 2.5 단계를 뺀 간격을 직접 줍니다.
    const nice = (raw) => { const p = Math.pow(10, Math.floor(Math.log10(raw))); const f = raw / p; return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 5 ? 5 : 10) * p; };
    if (s.grid) b.grid({ step: nice(34 / b.k) });
    b.axes({ tickStep: nice(46 / b.k) });
    if (s.mut_dots) { // 원본 '격자점 스캐너'
      const vb = b.viewBox();
      ctx.save();
      ctx.fillStyle = col('rgba(192, 132, 252, 0.42)');
      for (let x = Math.floor(vb.x0) - 1; x <= Math.ceil(vb.x1) + 1; x++) {
        for (let y = Math.floor(vb.y0) - 1; y <= Math.ceil(vb.y1) + 1; y++) {
          const pt = mathToScreen(x, y);
          ctx.beginPath();
          ctx.arc(pt.x, pt.y, 2.3, 0, Math.PI * 2);
          ctx.fill();
        }
      }
      ctx.restore();
    }
    if (s.mut_diag) drawMathLine(1, 0, 'rgba(251, 191, 36, 0.55)', [6, 6], 1.8); // 원본 y = x 대칭선
    RENDER[m](s, j);
    flushPills();
  }

  /* ---------- 6. 장면 ---------- */
  const READ_COLORS = ['amber', 'sky', 'green', 'violet'];
  const MUTATORS = [
    { id: 'diag', key: 'mut_diag', icon: 'split', label: 'y = x 대칭선' },
    { id: 'abs', key: 'mut_abs', icon: 'spark', label: '|f(x)|의 그래프 보기' },
    { id: 'dots', key: 'mut_dots', icon: 'grid', label: '격자점 표시' }
  ];

  /* ======================================================================
     6a. 「새 문제」 변형 (옛 장면 살리기, 2026-11-02)
     - 탐구 탭(그림·조작·문구)은 그대로입니다. 문제 탭과 정리 탭만 장면마다 변형 생성기(OV)를 받습니다.
     - 변형 0번은 지금 문제 그대로(문장·정답·풀이는 원본 문자열), 「새 문제」를 누르면 같은 구조의 다른 수로 바뀝니다.
     - 문제 탭 그림 = 문제에 주어진 것만(답·답 보조선은 정리 탭의 풀이 단계에서 드러남). 풀이 단계·정답·그림이 변형을 따라갑니다.
     ====================================================================== */
  const OV = {};
  OV.gcd = (a, b) => (b ? OV.gcd(b, a % b) : Math.abs(a));
  OV.fr = (n, d = 1) => { const g = OV.gcd(n, d) || 1; n /= g; d /= g; if (d < 0) { n = -n; d = -d; } return d === 1 ? String(n) : (n < 0 ? '-' : '') + `\\frac{${Math.abs(n)}}{${d}}`; };
  OV.sum = (a) => a.reduce((x, y) => x + y, 0);
  OV.range = (a, b) => { const r = []; for (let i = a; i <= b; i++) r.push(i); return r; };
  OV.f2 = (v, d = 2) => { const r = Math.round(v * Math.pow(10, d)) / Math.pow(10, d); return String(Object.is(r, -0) ? 0 : r); };
  OV.sqrtOf = (n) => { let o = 1, i = n; for (let f = 2; f * f <= i; f++) while (i % (f * f) === 0) { i /= f * f; o *= f; } return [o, i]; };
  OV.rt = (a, r) => { const [o, i] = OV.sqrtOf(r); a *= o; return i === 1 ? String(a) : (a === 1 ? '' : String(a)) + `\\sqrt{${i}}`; }; // a√r 를 간단히
  OV.varier = (list) => { let cur = list[0]; return { all: list, set: (i) => { cur = list[i]; }, cur: () => cur, next: () => { const pool = list.filter((x) => x !== cur); cur = pool[Math.floor(Math.random() * pool.length)]; return cur; } }; };
  OV.newBtn = '<div style="margin-top:10px"><button type="button" class="apl-btn sm" data-ov-new>새 문제 (숫자 바꾸기)</button></div>';
  document.addEventListener('click', (ev) => {
    const hit = ev.target && ev.target.closest && ev.target.closest('[data-ov-new]');
    if (!hit) return;
    const lab = window.lab, sc = lab && lab.scene;
    if (!sc || !sc.vary) return;
    sc.vary.next();
    lab.s.revealed = false;
    lab.setStep(0);
    try { lab._buildReview(); } catch (e) { /* 셸이 바뀌어도 그림은 그대로 */ }
    lab.invalidate(true);
  });
  // 변형으로 그림의 크기가 달라지면 무대를 다시 맞춥니다(탐구용 범위 'E' 와 문제용 범위를 따로)
  OV.autoFocus = (b, key, box) => { if (b.__ovKey !== key) { b.__ovKey = key; b.setFocus(box, true); } };
  OV.txt = (b, p, str, color, o = {}) => b.text(p, str, { color, size: 13, weight: 800, align: 'center', baseline: 'middle', ...o });
  OV.mono = (x) => x; // 자리 표시(확장용)

  /* ---------- 변형 생성기: 유형마다 (문장 · 정답 · 교과서 풀이 · 10초 컷 · 그림 자료 · 검산 자료) ---------- */
  const VARS = [[], [], [], [], [], [], [], []];
  const evenOdd = (N) => { let E = 0, O = 0; for (let n = 2; n <= N; n++) (n % 2 ? O++ : E++); return { E, O }; };
  const gtex = (N, sign) => OV.range(2, N).map((n) => (n % 2 ? 1 : sign > 0 ? 2 : 0));
  const gv = (fk, n) => (n % 2 ? 1 : fk > 0 ? 2 : fk === 0 ? 1 : 0);

  /* 유형 1 · 거듭제곱근의 실근의 개수 */
  const f1 = (r1, r2, kk) => ({ x: [Math.min(-1, r1 - 1.6, kk - 1), Math.max(r2, kk) + 1.9], y: [-((r2 - r1) * (r2 - r1)) / 4 - 1.6, Math.max(4.8, (kk - r1) * (kk - r2) + 1.5)] });
  function v1a(r1, r2, k0, orig) {
    const ks = OV.range(r1 + 1, r2 - 1), S = OV.sum(ks), fv = (k0 - r1) * (k0 - r2), a = gv(fv, 3), c = gv(fv, 4);
    const sgn = fv < 0 ? '< 0' : fv === 0 ? '= 0' : '> 0';
    const why = fv < 0 ? `$g(${k0},4)=0$ ($f(k)<0$이면 짝수 $n$에서 실근이 없다)` : fv === 0 ? `$g(${k0},4)=1$ ($x=0$ 하나뿐)` : `$g(${k0},4)=2$ ($x=\\pm\\sqrt[4]{${fv}}$)`;
    return {
      orig, focus: f1(r1, r2, k0), fig: { r1, r2, ks, k0, kind: 'sum' }, chk: { t: '1a', r1, r2, k0, val: [S, a + c] },
      text: `이차함수 $f(x) = (x-${r1})(x-${r2})$에 대하여, 실수 $f(k)$의 $n$제곱근 중 실수인 것의 개수를 $g(k, n)$이라 하자. $n=4$(짝수)일 때, $g(k, 4) = 0$을 만족시키는 모든 자연수 $k$의 값의 합과, $k=${k0}$일 때 $g(${k0}, 3) + g(${k0}, 4)$의 값을 구하시오.`,
      ans: `$k$의 값의 합 $${S}$, $g(${k0},3)+g(${k0},4)=${a + c}$`,
      std: [
        `1) $x^n = f(k)$에서 $n=4$는 짝수이므로 우변 $f(k) < 0$일 때 실근이 존재하지 않는다 ($g(k,4)=0$). $f(k)<0 \\iff ${r1} < k < ${r2}$이므로 자연수 $k = ${ks.join(', ')}$의 합은 $${S}$이다.`,
        `2) $f(${k0}) = ${fv}$이므로 $f(${k0}) ${sgn}$이다. $n=3$(홀수)에서는 $g(${k0},3)=1$이고, $n=4$(짝수)에서는 ${why}이다.`,
        `3) 따라서 $g(${k0},3)+g(${k0},4) = ${a} + ${c} = ${a + c}$이다.`
      ],
      quick: [
        `**홀수 $n$이면 $f(k)$의 부호와 관계없이 실근은 항상 $1$개**, 짝수 $n$이면 $f(k)>0$, $f(k)=0$, $f(k)<0$에 따라 $2, 1, 0$개입니다.`,
        `$f(${k0}) = ${fv}$이므로 $g(${k0},3)+g(${k0},4) = ${a} + ${c} = ${a + c}$이고, $g(k,4)=0$인 자연수 $k$는 $${ks.join(', ')}$로 합이 $${S}$입니다.`
      ]
    };
  }
  VARS[0][0] = [v1a(2, 6, 4, true), v1a(1, 7, 7), v1a(3, 9, 10), v1a(2, 8, 5), v1a(1, 5, 6)];
  function v1b(r1, r2, N, orig) {
    const { E, O } = evenOdd(N), pos = gtex(N, 1), neg = gtex(N, -1);
    return {

/* PLUS-BEGIN */
  /* ======================================================================
     6b. 장면 9~11 추가 — 최근 평가원·학평 4점에 반복되는 세 유형 (원본 8유형은 그대로 두고 뒤에 붙임)
         유형 9  움직이는 수평선 y=t 와 구간별·절댓값 지수·로그 함수의 교점 개수 g(t)

         유형 11 y=x 대칭점과 최단거리
     - 새 문제는 [새 문제] 버튼으로 바꿉니다(같은 유형 안에서 숫자·식만 바뀜). 정답은 식에서 직접 계산해 구합니다.
     ====================================================================== */
  const PL = {};
  PL.nice = (raw) => { const p = Math.pow(10, Math.floor(Math.log10(raw))); const f = raw / p; return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 5 ? 5 : 10) * p; };
  PL.frame = (b, s) => { if (s.grid) b.grid({ step: PL.nice(34 / b.k) }); b.axes({ tickStep: PL.nice(46 / b.k) }); };
  PL.mode = (lab) => (lab && lab.tab === 'problem' ? 'problem' : lab && lab.tab === 'review' ? 'review' : 'explore');
  PL.stp = (mode, s, i) => mode !== 'problem' && s.step >= i;
  PL.f2 = (v, d = 2) => { const r = Math.round(v * Math.pow(10, d)) / Math.pow(10, d); return String(Object.is(r, -0) ? 0 : r); };
  PL.EPS = 1e-9;
  // 새 문제 고르기: 이전과 다른 것을 무작위로 (첫 문제는 목록의 첫 항목)
  PL.varier = (list) => {
    let cur = list[0];
    return { all: list, set: (x) => { cur = x; }, cur: () => cur, next: () => { const pool = list.filter((x) => x !== cur); cur = pool[Math.floor(Math.random() * pool.length)]; return cur; } };
  };
  document.addEventListener('click', (ev) => {
    const hit = ev.target && ev.target.closest && ev.target.closest('[data-pl-new]');
    if (!hit) return;
    const lab = window.lab, sc = lab && lab.scene;
    if (!sc || !sc.vary) return;
    sc.vary.next();
    lab.s.revealed = false;
    lab.setStep(0);
    try { lab._buildReview(); } catch (e) { /* 셸이 바뀌어도 그림은 그대로 */ }
    lab.invalidate(true);
  });
  PL.newBtn = '<div style="margin-top:10px"><button type="button" class="apl-btn sm" data-pl-new>새 문제 (숫자 바꾸기)</button></div>';
  PL.probHTML = (body) => rich(body) + PL.newBtn;
  // 새 문제로 바뀌어 그림의 크기가 달라지면 무대를 다시 맞춥니다(탐구용 범위 'E' 와 문제용 범위를 따로)
  PL.autoFocus = (b, key, box) => { if (b.__plKey !== key) { b.__plKey = key; b.setFocus(box, true); } };
  PL.sup = (t) => String(t).replace(/[x0-9+\-]/g, (c) => ({ x: 'ˣ', '-': '⁻', '+': '⁺', 0: '⁰', 1: '¹', 2: '²', 3: '³', 4: '⁴', 5: '⁵', 6: '⁶', 7: '⁷', 8: '⁸', 9: '⁹' }[c]));
  PL.xs = (a) => (a === 0 ? 'x' : a > 0 ? `x-${a}` : `x+${-a}`); // x−a 모양의 지수

  /* ---------- 수평선과 교점 개수: 단조 조각별로 세는 계산 ----------
     곡선을 한 방향으로만 움직이는 조각들로 나눕니다. 조각마다 (x0,x1) 에서 값 f(x0)..f(x1) 를 가지며,
     끝점이 열려(o0/o1) 있거나 무한대이면 그 끝의 값은 가지지 않습니다(○). */
  PL.mk = (f, x0, x1, o0, o1) => { const v0 = f(x0), v1 = f(x1); return { f, x0, x1, o0, o1, v0, v1, inc: v1 > v0 }; };
  PL.has = (p, t) => {
    const lo = Math.min(p.v0, p.v1), hi = Math.max(p.v0, p.v1);
    const c0 = Number.isFinite(p.x0) && !p.o0, c1 = Number.isFinite(p.x1) && !p.o1; // x0·x1 에서의 값을 갖는가
    const loC = p.inc ? c0 : c1, hiC = p.inc ? c1 : c0;
    if (Math.abs(t - lo) < PL.EPS) return loC;
    if (Math.abs(t - hi) < PL.EPS) return hiC;
    return t > lo && t < hi;
  };
  PL.g = (P, t) => P.filter((p) => PL.has(p, t)).length;
  PL.root = (p, t) => { // 조각 위에서 f(x)=t 인 x (이분법)
    let a = Number.isFinite(p.x0) ? p.x0 : -60, b = Number.isFinite(p.x1) ? p.x1 : 60;
    for (let i = 0; i < 90; i++) { const m = (a + b) / 2; if ((p.f(m) < t) === p.inc) a = m; else b = m; }
    return (a + b) / 2;
  };
  PL.crit = (P) => { // 개수가 실제로 바뀌는 높이(끝점·꼭짓점·점근선의 높이)
    const vs = [];
    P.forEach((p) => [p.v0, p.v1].forEach((v0) => { const v = Math.round(v0 * 1e9) / 1e9; if (Number.isFinite(v) && !vs.some((u) => Math.abs(u - v) < 1e-7)) vs.push(v); }));
    vs.sort((x, y) => x - y);
    const gi = (i) => PL.g(P, i === 0 ? vs[0] - 1 : i === vs.length ? vs[vs.length - 1] + 1 : (vs[i - 1] + vs[i]) / 2);
    return vs.filter((c, i) => { const a = gi(i), m = PL.g(P, c), z = gi(i + 1); return !(a === m && m === z); });
  };
  // g(t) 를 구간별로: [{ g, tex }]  (같은 값이 이어지면 한 구간으로 합침)
  PL.ranges = (P) => {
    const cr = PL.crit(P), n = cr.length, tok = [];
    for (let i = 0; i <= n; i++) {
      tok.push({ pt: false, i, g: PL.g(P, i === 0 ? cr[0] - 1 : i === n ? cr[n - 1] + 1 : (cr[i - 1] + cr[i]) / 2) });
      if (i < n) tok.push({ pt: true, i, g: PL.g(P, cr[i]) });
    }
    const runs = [];
    tok.forEach((t) => { const L = runs[runs.length - 1]; if (L && L.g === t.g) L.last = t; else runs.push({ g: t.g, first: t, last: t }); });
    return runs.map((r) => {
      const a = r.first, z = r.last;
      const lo = a.pt ? { v: cr[a.i], inc: true } : a.i === 0 ? null : { v: cr[a.i - 1], inc: false };
      const hi = z.pt ? { v: cr[z.i], inc: true } : z.i === n ? null : { v: cr[z.i], inc: false };
      let tex;
      if (lo && hi && lo.v === hi.v) tex = `t=${PL.f2(lo.v)}`;
      else if (!lo) tex = `t${hi.inc ? '\\le ' : '\\lt '}${PL.f2(hi.v)}`;
      else if (!hi) tex = `t${lo.inc ? '\\ge ' : '\\gt '}${PL.f2(lo.v)}`;
      else tex = `${PL.f2(lo.v)}${lo.inc ? '\\le ' : '\\lt '}t${hi.inc ? '\\le ' : '\\lt '}${PL.f2(hi.v)}`;
      return { g: r.g, tex };
    });
  };
  PL.rangesLine = (P) => PL.ranges(P).map((r) => `$${r.tex}$ 이면 ${r.g}`).join(', ');
  PL.ints = (P, k) => { const a = []; for (let t = -60; t <= 60; t++) if (PL.g(P, t) === k) a.push(t); return a; };

  // 그림: 조각 곡선·끝점(○●)
  PL.drawPieces = (b, P, o = {}) => {
    const xmax = o.xmax == null ? Infinity : o.xmax;
    P.forEach((p) => b.plot(p.f, { color: 'green', width: 2.8, glow: true, from: Number.isFinite(p.x0) ? p.x0 : null, to: Math.min(Number.isFinite(p.x1) ? p.x1 : Infinity, xmax) }));
    const ends = [];
    P.forEach((p) => [[p.x0, p.o0], [p.x1, p.o1]].forEach(([x, op]) => {
      const y = p.f(x);
      if (Number.isFinite(x) && Number.isFinite(y) && x <= xmax) ends.push({ x, y, op });
    }));
    ends.filter((e) => e.op).forEach((e) => b.point([e.x, e.y], { hollow: true, color: 'green', r: 5.2 }));
    ends.filter((e) => !e.op).forEach((e) => b.point([e.x, e.y], { color: 'green', r: 5.2 }));
  };
  // 개수가 바뀌는 높이에 점선과 값
  PL.critLines = (b, P, o) => {
    const vb = b.viewBox(), cr = PL.crit(P);
    const xr = o.XG + o.gmax * o.U;
    cr.forEach((cv) => b.seg([vb.x0 - 1, cv], [xr, cv], { color: 'rose', alpha: 0.45, width: 1.2, dash: [4, 5] }));
    let lastPx = Infinity;
    cr.slice().reverse().forEach((cv) => {
      const sy = b.toS(0, cv).y;
      if (Math.abs(sy - lastPx) < 15) return;
      lastPx = sy;
      b.stext(b.toS(o.XG - 0.55, 0).x - 4, sy, PL.f2(cv), { color: 'rose', size: 12, weight: 800, align: 'right', baseline: 'middle' });
    });
  };
  // 오른쪽에 g(t) 계단 그래프를 눕혀 그립니다. 세로축은 왼쪽 그림의 y(=t)와 같은 높이, 가로는 교점의 개수 g.
  PL.stair = (b, P, o) => {
    const { XG, U, gmax } = o;
    const c = b.ctx, vb = b.viewBox(), cr = PL.crit(P), n = cr.length;
    const X = (g) => XG + g * U;
    const yTop = Math.min(vb.y1, b.toW(0, b.insets.top + 38).y); // 머리글 아래부터 계단을 그립니다
    const pa = b.toS(XG - 0.55, vb.y1), pz = b.toS(XG + gmax * U + 0.55, vb.y0);
    c.save();
    c.fillStyle = b.color('halo', 0.78);
    c.fillRect(pa.x, pa.y, pz.x - pa.x, pz.y - pa.y);
    c.restore();
    b.seg([XG - 0.55, vb.y0], [XG - 0.55, vb.y1], { color: 'muted', alpha: 0.5, width: 1.2 });
    for (let g = 0; g <= gmax; g++) b.seg([X(g), vb.y0], [X(g), yTop], { color: 'muted', alpha: g === 0 ? 0.7 : 0.3, width: g === 0 ? 1.6 : 1, dash: g === 0 ? null : [3, 5] });
    PL.critLines(b, P, o);
    // 계단: 구간마다 세로 선분, 경계에서 ● ○
    const gv = (i) => PL.g(P, i === 0 ? cr[0] - 1 : i === n ? cr[n - 1] + 1 : (cr[i - 1] + cr[i]) / 2);
    const hi = o.hi || {};
    for (let i = 0; i <= n; i++) {
      const lo = i === 0 ? vb.y0 - 1 : cr[i - 1], up = i === n ? yTop : cr[i], g = gv(i);
      if (lo >= yTop) continue;
      const on = hi.g != null && g === hi.g;
      b.seg([X(g), lo], [X(g), Math.min(up, yTop)], { color: on ? 'amber' : 'sky', width: on ? 5 : 3.2, glow: true });
    }
    cr.forEach((cv, i) => {
      if (cv > yTop) return;
      const gc = PL.g(P, cv), gl = gv(i), gr = gv(i + 1);
      [gl, gr].forEach((g) => { if (g !== gc) b.point([X(g), cv], { hollow: true, color: 'sky', r: 4.6 }); });
      b.point([X(gc), cv], { color: hi.disc || (hi.g != null && gc === hi.g) ? 'amber' : 'rose', r: hi.disc ? 6.6 : 5 });
    });
    if (o.t != null) b.point([X(PL.g(P, o.t)), o.t], { color: 'amber', r: 6.6 }); // 지금 수평선의 높이에서 g(t)
    (hi.ts || []).forEach((tv) => { const g = PL.g(P, tv); b.seg([vb.x0 - 1, tv], [X(g), tv], { color: 'amber', alpha: 0.5, width: 1.4, dash: [2, 5] }); b.point([X(g), tv], { color: 'amber', r: 6.2 }); b.stext(b.toS(X(g), tv).x + 11, b.toS(X(g), tv).y - 11, 'g(' + tv + ')=' + g, { color: 'amber', size: 12, weight: 800, align: 'left', baseline: 'middle' }); });
    const ty = b.insets.top + 14;
    b.stext(b.toS(X(gmax / 2), 0).x, ty, 'g(t) : 교점의 개수', { color: 'sky', size: 12, weight: 800, align: 'center', baseline: 'middle' });
    for (let g = 0; g <= gmax; g++) b.stext(b.toS(X(g), 0).x, ty + 18, String(g), { color: 'ink', size: 12.5, weight: 800, align: 'center', baseline: 'middle' });
  };
  // 장면 하나를 그리는 공통 뼈대(탐구·정리·문제 모두 이 함수 하나)
  PL.draw9 = (b, s, lab, cfg) => {
    const mode = PL.mode(lab), st = (i) => PL.stp(mode, s, i), prob = mode === 'problem';
    PL.frame(b, s);
    const P = cfg.pieces;
    if (st(1)) { // 점근선은 풀이의 첫 단계(또는 탐구)에서 드러냅니다
      (cfg.asym || []).forEach((y) => b.hline(y, { color: 'violet', alpha: 0.75, width: 1.6, dash: [7, 5] }));
      (cfg.asymLabels || []).forEach((l) => b.text([l.x, l.y], l.text, { color: 'violet', size: 12.5, weight: 800, align: 'left', baseline: 'middle', dy: l.dy || 0 }));
    }
    PL.drawPieces(b, P, { xmax: cfg.XG - 0.75 });
    (cfg.labels || []).forEach((l) => b.text([l.x, l.y], l.text, { color: l.color || 'green', size: 12.5, weight: 800, align: l.align || 'left', baseline: 'middle', dx: l.dx || 0, dy: l.dy || 0 }));
    if (prob) return;
    if (mode === 'review' && st(1)) (cfg.endLabels || []).forEach((l) => b.text([l.x, l.y], l.text, { color: l.color || 'rose', size: 13, weight: 800, align: l.align || 'center', baseline: 'middle', dx: l.dx || 0, dy: l.dy || 0 }));
    if (mode === 'review' && st(2) && !st(3)) PL.critLines(b, P, cfg);
    if (st(3)) PL.stair(b, P, { XG: cfg.XG, U: cfg.U, gmax: cfg.gmax, t: mode === 'explore' ? s[cfg.tKey] : null, hi: st(4) ? cfg.hi : null });
    if (mode === 'explore') {
      const t = s[cfg.tKey];
      b.hline(t, { color: 'amber', width: 2.6 });
      P.forEach((p) => { if (PL.has(p, t)) b.point([PL.root(p, t), t], { color: 'rose', r: 5.8 }); });
      b.handle('t', [cfg.XG - 1.35, t], { color: 'amber', r: 7, label: 't = ' + PL.f2(t), dx: -12, dy: -14, align: 'right', drag: (w) => { s[cfg.tKey] = clamp(Math.round(w.y * 20) / 20, cfg.tMin, cfg.tMax); } });
    }
  };
  // 수평선 장면(9A·9B)을 만드는 틀
  PL.sceneStair = (S) => {
    const vary = PL.varier(S.combos);
    const cur = () => vary.cur();

  /* ---------- 장면 9A · 구간별 지수함수와 수평선 (점프가 있는 g(t)) ---------- */

    quick: (v,ask) => {

    formula: '<b>절댓값을 겹쳐 쓴 함수 y = | |h(x)| − b |</b><br>안쪽 |h| 로 x축 아래를 접어 올리고, b 를 빼서 아래로 내린 뒤 다시 접어 올립니다. 그래서 x축에 닿는 점이 두 개 생기고 그 사이에 봉우리(높이 b)가 생기는 <b>W 모양</b>이 됩니다.<br>개수가 바뀌는 높이: 바닥 0, 봉우리 b, (지수함수라면) 점근선.',
    notes: '지수형 f(x)=||2ˣ−a|−b| (0<b<a)에서 왼쪽 점근선의 높이는 a−b입니다. t=b의 교점은 b<a−b이면 3개, b≥a−b이면 왼쪽 바깥 가지가 없어 2개입니다. t=0에서는 2개이고, 4개가 되는 범위는 0<t<min(b,a−b)입니다. 로그형 f(x)=||log₂x|−b| (b>0)은 양끝이 모두 위로 올라가므로 t=b에서 3개, 0<t<b에서 4개입니다. 점근선 높이 자체는 왼쪽 바깥 가지의 치역에 포함하지 않습니다.'
  };

  /* ======================================================================
     유형 10 · 곡선 위 점이 이루는 삼각형 (이등변·정삼각형·직각이등변)
     ====================================================================== */
  PL.nth2 = (n) => (n === 2 ? '\\sqrt{2}' : `\\sqrt[${n}]{2}`);
  PL.ticks = (b, p, q, o = {}) => b.ticks(p, q, { color: o.color || 'amber', count: o.count || 1, size: 6.5 });
  PL.fix = (n, d = 2) => Number(n).toFixed(d);

  /* ---------- 장면 10A · AB=AC 이등변삼각형 (곡선 y=aˣ, 직선 x=t, x=2t) ---------- */
  const COMB10A = [{ v: { t0: 3 }, ask: 'at' }, { v: { t0: 4 }, ask: 'S' }, { v: { t0: 5 }, ask: 'at' }, { v: { t0: 2 }, ask: 'S' }, { v: { t0: 2 }, ask: 'at' }, { v: { t0: 3 }, ask: 'S' }];
  const vary10a = PL.varier(COMB10A);
  const ans10a = (v, ask) => (ask === 'at' ? `${v.t0}${PL.nth2(v.t0)}` : String(2 * v.t0));
  const F10A = { x: [-1.8, 12.4], y: [-1.9, 8.4] };
  function draw10a(b, s, lab) {
    const mode = PL.mode(lab), st = (i) => PL.stp(mode, s, i), ex = mode === 'explore', pr = mode === 'problem';
    const cu = vary10a.cur();
    const t = ex ? s.p10_t : cu.v.t0, m = ex ? s.p10_m : 2;
    const a = Math.pow(m, 1 / t);
    PL.autoFocus(b, ex ? 'E' : 'V' + t, ex ? F10A : { x: [-1.5, 2 * t + 2.7], y: [-1.9, 5.0] });
    PL.frame(b, s);
    const A = [t, m], Bp = [2 * t, m * m], C = [2 * t, 0], D = [2 * t, m];
    const AB = Math.hypot(t, m * m - m), AC = Math.hypot(t, m);
    const same = Math.abs(m - 2) < 1e-9;

    const lx = Math.max(0.4, t * 0.4), ly = Math.pow(a, lx); // 곡선 이름은 A 의 왼쪽 아래(비어 있는 곳)
    b.text([lx, ly], 'y = aˣ', { color: 'green', size: 13, weight: 800, align: 'center', baseline: 'middle', dy: 17 });
    b.poly([A, C, Bp], { fill: 'amber', fillAlpha: same || !ex ? 0.2 : 0.1, color: null });
    // x = t, x = 2t
    b.seg([t, 0], [t, m], { color: 'muted', width: 1.6, dash: [5, 5] });
    b.text([t, 0], 't', { color: 'amber', size: 14, weight: 800, dy: 30 });
    b.text([2 * t, 0], '2t', { color: 'amber', size: 14, weight: 800, dy: 30 });
    if (!ex && st(2)) {
      b.seg(A, D, { color: 'muted', width: 1.8, dash: [4, 4] });
      b.point(D, { hollow: true, color: 'muted', r: 4 });
      b.text([(t + 2 * t) / 2, m], 't', { color: 'amber', size: 13, weight: 800, dy: -11 });
      b.text(D, 'aᵗ', { color: 'sky', size: 13, weight: 800, align: 'left', dx: 10, dy: 22 });
      b.text(D, 'a²ᵗ−aᵗ', { color: 'rose', size: 13, weight: 800, align: 'left', dx: 10, dy: -16 });
    }
    b.seg(C, Bp, { color: 'ink', width: 3.2 });
    b.seg(A, C, { color: ex && !same ? 'sky' : 'amber', width: 3.4 });
    b.seg(A, Bp, { color: ex && !same ? 'rose' : 'amber', width: 3.4 });
    if (showEq) { PL.ticks(b, A, C, { color: 'ink' }); PL.ticks(b, A, Bp, { color: 'ink' }); }
    if (!ex && st(3)) { // 높이 2
      b.seg([0, 2], A, { color: 'amber', width: 2, dash: [6, 5] });
      b.text([0, 2], '2', { color: 'amber', size: 14, weight: 800, align: 'right', dx: -9 });
      b.text(Bp, '4', { color: 'rose', size: 13, weight: 800, align: 'left', dx: 10, dy: 12 });
    }

      const xl = 2 * t - 0.95 * Math.min(1, t / 1.6), yAB = m + (m * m - m) * (xl - t) / t, yAC = m - m * (xl - t) / t;

    else b.point(A, { color: 'amber', r: 6, label: st(1) ? 'A(t, aᵗ)' : 'A', dx: -10, dy: -12, align: 'right' });

  }
  const text10a = (v, ask) => (ask === 'at'
    ? `상수 $a\\ (a>1)$과 양수 $t$에 대하여 곡선 $y=a^{x}$이 두 직선 $x=t$, $x=2t$와 만나는 점을 각각 A, B라 하고, 점 B에서 $x$축에 내린 수선의 발을 C라 하자. $\\overline{AB}=\\overline{AC}$이고 삼각형 ACB의 넓이가 ${2 * v.t0}일 때, $a\\times t$의 값을 구하시오.`
    : `양수 $t$에 대하여 곡선 $y=2^{\\frac{x}{${v.t0}}}$이 두 직선 $x=t$, $x=2t$와 만나는 점을 각각 A, B라 하고, 점 B에서 $x$축에 내린 수선의 발을 C라 하자. $\\overline{AB}=\\overline{AC}$일 때, 삼각형 ACB의 넓이를 구하시오.`);
  const step10a = (v, ask) => [
    `$m=a^{t}$ 로 놓으면 $a^{2t}=m^{2}$ 이므로 $A(t,\\ m)$, $B(2t,\\ m^{2})$, $C(2t,\\ 0)$ 입니다.`,
    `A 에서 선분 BC 에 수선을 그어 직각삼각형을 만듭니다. 가로 $t$, 세로는 각각 $m$(A→C 쪽)과 $m^{2}-m$(A→B 쪽)이므로 $\\overline{AC}^{2}=t^{2}+m^{2}$, $\\overline{AB}^{2}=t^{2}+(m^{2}-m)^{2}$.`,
    `$\\overline{AB}=\\overline{AC}$ 이면 가로가 같으므로 세로도 같아야 합니다: $m^{2}-m=m$. $m>1$ 이므로 $m=2$, 즉 $a^{t}=2$ (t 가 얼마든 A 의 높이는 2).`,
    ask === 'at'
      ? `$\\overline{BC}=m^{2}=4$, 밑변 BC 에 대한 높이 $t$ 이므로 넓이 $\\frac{1}{2}\\cdot 4\\cdot t=2t=${2 * v.t0}$, $t=${v.t0}$. $a^{${v.t0}}=2$ 에서 $a=2^{\\frac{1}{${v.t0}}}$ 이므로 $a\\times t=${v.t0}\\cdot 2^{\\frac{1}{${v.t0}}}=${ans10a(v, ask)}$.`
      : `$a=2^{\\frac{1}{${v.t0}}}$ 이므로 $a^{t}=2$ 에서 $t=${v.t0}$. 넓이 $\\frac{1}{2}\\cdot\\overline{BC}\\cdot t=\\frac{1}{2}\\cdot 4\\cdot ${v.t0}=${2 * v.t0}$.`
  ];
  const std10a = (v, ask) => `① $A(t,\\ a^{t})$, $B(2t,\\ a^{2t})$, $C(2t,\\ 0)$ 에서 $\\overline{AC}^{2}=t^{2}+(a^{t})^{2}$, $\\overline{AB}^{2}=t^{2}+(a^{2t}-a^{t})^{2}$.<br/>② $\\overline{AB}=\\overline{AC}$ 에서 $(a^{2t}-a^{t})^{2}=(a^{t})^{2}$. $a^{2t}-a^{t}>0$ 이므로 $a^{2t}-a^{t}=a^{t}$, $a^{t}=2$.<br/>③ $\\overline{BC}=a^{2t}=4$, 삼각형 ACB 의 넓이 $=\\frac{1}{2}\\cdot 4\\cdot t=2t$.<br/>④ ${ask === 'at' ? `$2t=${2 * v.t0}$ 에서 $t=${v.t0}$, $a=2^{\\frac{1}{${v.t0}}}$ ⇒ $a\\times t=${ans10a(v, ask)}$.` : `$a=2^{\\frac{1}{${v.t0}}}$, $a^{t}=2$ 에서 $t=${v.t0}$ ⇒ 넓이 $2t=${2 * v.t0}$.`}`;
  const quick10a = (v, ask) => `두 변 AB, AC 는 가로 길이가 $t$ 로 같습니다. 그러므로 <b>세로 길이만 같으면</b> 됩니다: A 의 높이 $a^{t}$ = (B 높이 $-$ A 높이) $=a^{2t}-a^{t}$. $m=a^{t}$ 라 하면 $m=m^{2}-m$, <b>$a^{t}=2$</b> 입니다. 그러면 $a^{2t}=4$, 넓이 $=2t$ 로 바로 끝납니다. ${ask === 'at' ? `$2t=${2 * v.t0}$ 에서 $t=${v.t0}$, $a\\times t=${ans10a(v, ask)}$.` : `$t=${v.t0}$ 이므로 넓이 $=${2 * v.t0}$.`}`;
  function scene10a() {
    const cur = () => vary10a.cur();
    return {
      id: 't10a', title: '문제 A (이등변삼각형 AB = AC)', short: '이등변삼각형', tabs: { compact: true }, notesTitle: '오답 함정 주의보',
      question: '곡선 y = aˣ 위의 점 A(t, aᵗ)와 B(2t, a²ᵗ), 그리고 B의 수선의 발 C로 만든 삼각형 ACB가 AB = AC 인 이등변삼각형이 되려면 A의 높이는 얼마여야 할까?',
      guide: '금색 점 <b>A</b>를 끌어 보세요. 가로로 움직이면 <b>t</b>, 세로로 움직이면 A의 높이 <b>aᵗ</b>가 바뀌고, 곡선은 (0, 1)과 A를 지나도록 따라옵니다. <b>AB와 AC의 길이가 같아지는 순간</b>(두 변이 금색으로 바뀌고 같은 길이 표시가 생김)의 높이를 찾아보세요.',
      focus: F10A,

        { group: 't 를 바꿔 보기', label: 't = 2', apply: (s) => { s.p10_t = 2; }, on: (s) => Math.abs(s.p10_t - 2) < 0.03 },
        { group: 't 를 바꿔 보기', label: 't = 4', apply: (s) => { s.p10_t = 4; }, on: (s) => Math.abs(s.p10_t - 4) < 0.03 },
        { group: 'A 의 높이 aᵗ', label: 'aᵗ = 1.5', apply: (s) => { s.p10_m = 1.5; }, on: (s) => Math.abs(s.p10_m - 1.5) < 0.03 },
        { group: 'A 의 높이 aᵗ', label: 'aᵗ = 2', color: 'amber', apply: (s) => { s.p10_m = 2; }, on: (s) => Math.abs(s.p10_m - 2) < 0.03 }
      ],
      steps: () => step10a(cur().v, cur().ask).map(stepText),
      reviewTop: () => `<div class="apl-rich" style="font-size:var(--fs-sm);line-height:1.75"><small style="color:var(--text-3);font-weight:800">문제</small><br>${rich(text10a(cur().v, cur().ask))}</div>`,
      problem: { tag: '2026학년도 9월 모의평가 12번 유형', time: '목표 시간: 40초', text: () => PL.probHTML(text10a(cur().v, cur().ask)), answer: () => safe('$' + ans10a(cur().v, cur().ask) + '$') },
      solution: {
        standardTitle: '좌표로 AB², AC² 를 쓰고 같다고 놓기', standardTag: '교과서 풀이', quickTitle: '가로가 같으니 세로만 비교', quickTag: '10초 컷',
        standard: () => ({ steps: rich(std10a(cur().v, cur().ask)) }),
        quick: () => ({ steps: rich(quick10a(cur().v, cur().ask)), highlight: 'AB = AC 의 조건은 a 나 t 가 아니라 A 의 높이 aᵗ = 2 로만 결정됩니다.' })
      },
      view: (s, lab) => {
        if((lab&&lab.tab==='problem')||s.step<3) return {notes:'A에서 선분 BC에 내린 수선으로 두 직각삼각형을 비교하세요. 가로 길이가 같다는 조건이 핵심입니다.'};
        if (lab && lab.tab !== 'explore') return { formula: rich('<b>이등변삼각형 조건을 높이로 바꿔 읽기</b><br>A(t, aᵗ), B(2t, a²ᵗ), C(2t, 0) 에서 A 로부터 직선 x = 2t 까지의 가로 거리는 t 로 공통입니다. 따라서 AB = AC ⇔ 세로 거리 같음 ⇔ <b>aᵗ = a²ᵗ − aᵗ</b> ⇔ aᵗ = 2.'), notes: rich('A 와 B 의 x좌표 비가 1 : 2 이므로 y좌표는 m, m² (m = aᵗ) 입니다. a²ᵗ 을 2aᵗ 로 착각하지 마세요. 넓이는 ½ × BC × t 입니다(밑변이 세로선 BC).') };
        const t = s.p10_t, m = s.p10_m, a = Math.pow(m, 1 / t), AB = Math.hypot(t, m * m - m), AC = Math.hypot(t, m), same = Math.abs(m - 2) < 1e-9;
        return {

  /* ---------- 장면 10B · 두 로그 곡선과 x축이 만드는 삼각형 (정삼각형·직각이등변삼각형) ---------- */
  const COMB10B = [{ v: { p: 4, shape: 'eq' } }, { v: { p: 3, shape: 'rt' } }, { v: { p: 5, shape: 'eq' } }, { v: { p: 5, shape: 'rt' } }, { v: { p: 4, shape: 'rt' } }].map((o) => ({ v: o.v, ask: 'a' }));
  const vary10b = PL.varier(COMB10B);
  const h10b = (v) => (v.shape === 'eq' ? Math.sqrt(3) * (v.p - 1) : v.p - 1); // 삼각형이 되는 높이
  const a10b = (v) => Math.pow(v.p, 1 / h10b(v));
  const root10 = (p, n) => (n === 1 ? String(p) : n === 2 ? `\\sqrt{${p}}` : `\\sqrt[${n}]{${p}}`);
  const ans10b = (v) => (v.shape === 'eq' ? `${v.p}^{\\frac{\\sqrt{3}}{${3 * (v.p - 1)}}}` : root10(v.p, v.p - 1));
  const hTex10b = (v) => (v.shape === 'eq' ? (v.p === 2 ? '\\sqrt{3}' : `${v.p - 1}\\sqrt{3}`) : String(v.p - 1));
  const F10B = { x: [-4.7, 4.7], y: [-2.1, 6.9] };
  function draw10b(b, s, lab) {
    const mode = PL.mode(lab), st = (i) => PL.stp(mode, s, i), ex = mode === 'explore', pr = mode === 'problem';

    b.plot((x) => (x + p > 0 ? Math.log(x + p) / la : NaN), { color: 'green', width: 2.8, glow: true, from: -p + 0.004, to: p + 3 });

    const AB = Math.hypot(w, h), BC = 2 * w;
    const angB = Math.atan2(h, w) * 180 / Math.PI, angA = 180 - 2 * angB;
    const isEq = Math.abs(angB - 60) < 1e-8, isRt = Math.abs(angA - 90) < 1e-8;
    const eqShape = ex ? isEq : cu.v.shape === 'eq', rtShape = ex ? isRt : cu.v.shape === 'rt';
    b.poly([A, Bp, C], { fill: 'amber', fillAlpha: eqShape || rtShape ? 0.2 : 0.1, color: null });
    if (!ex && st(2)) {

    return `① $y=2^{x}$ 위의 점은 $y>x$ 이므로 A, B 모두 직선 $y=x$ 의 위쪽(같은 쪽)입니다.<br/>② B 의 $y=x$ 에 대한 대칭점 $B'(${Bx},\\ ${v.b})$ 에 대하여 $\\overline{BP}=\\overline{B'P}$ 이므로 $\\overline{AP}+\\overline{BP}=\\overline{AP}+\\overline{B'P}\\ge\\overline{AB'}$.<br/>③ $\\overline{AB'}=\\sqrt{(${Bx}-${v.a})^{2}+(${v.b}-${Ay})^{2}}=\\sqrt{${Math.round(G.d2)}}${PL.sq(Math.round(G.d2)) === `\\sqrt{${Math.round(G.d2)}}` ? '' : '=' + PL.sq(Math.round(G.d2))}$.<br/>④ ${ask === 'min' ? `최솟값은 $${ans11(v, ask)}$.` : `등호는 P 가 선분 $AB'$ 위에 있을 때이므로 직선 $AB'$ 와 $y=x$ 의 교점의 $x$좌표 $${px11(v).tex}$.`}`;
  };
  const quick11 = (v, ask) => {
    const G = PL.geo11(v.a, v.b);
    return `<b>같은 쪽이면 한 점을 대칭이동</b>합니다. B$(${v.b},\\ ${Math.pow(2, v.b)})$ 의 대칭점은 가로·세로를 바꾼 $B'(${Math.pow(2, v.b)},\\ ${v.b})$ — 숫자만 맞바꾸면 됩니다. 그러면 최솟값은 두 점 $A(${v.a},\\ ${Math.pow(2, v.a)})$, $B'$ 사이의 거리 $\\sqrt{${Math.round(G.d2)}}${PL.sq(Math.round(G.d2)) === `\\sqrt{${Math.round(G.d2)}}` ? '' : '=' + PL.sq(Math.round(G.d2))}$ 입니다.${ask === 'px' ? ` 직선 AB' 와 $y=x$ 의 교점의 $x$좌표는 $${px11(v).tex}$.` : ''}`;
  };
  function scene11a() {
    const cur = () => vary11.cur();
    return {
      id: 't11a', title: '문제 A (같은 쪽의 두 점과 최단거리)', short: '대칭·최단거리', tabs: { compact: true }, notesTitle: '오답 함정 주의보',
      question: '직선 y = x 위의 점 P 를 지나 A 에서 B 로 가는 경로 AP + BP 는 P 의 위치에 따라 어떻게 변할까? 가장 짧은 경로는 어떤 모양일까?',
      guide: '하늘색 점 <b>P</b>를 직선 y = x 위에서 끌어 <b>AP + BP</b>를 줄여 보세요. [B′ 보기] 를 켜면 B 를 직선 y = x 에 대해 <b>대칭이동한 점 B′</b>가 나타나고, AP + BP = AP + B′P 임을 볼 수 있습니다. A, B 도 곡선 위에서 끌 수 있습니다.',
      focus: F11,
      enter: (s) => { s.p11_a = 0; s.p11_b = 2; s.p11_x = 3; s.p11_ref = false; },
      controls: () => ['p11_x', 'p11_a', 'p11_b'],
      presets: (s) => {
        const G = PL.geo11(s.p11_a, s.p11_b);
        return [{ group: 'P 의 위치', label: 'P 를 AB′ 위로 맞추기', color: 'green', apply: (st) => { st.p11_x = G.px; st.p11_ref = true; }, on: (st) => Math.abs(st.p11_x - G.px) < 0.03 }];
      },
      actions: () => [{ id: 'ref', icon: 'split', label: 'B′ (B 의 대칭점) 보기', on: (s) => !!s.p11_ref, run: (s) => { s.p11_ref = !s.p11_ref; } }],
      steps: () => step11(cur().v, cur().ask).map(stepText),
      reviewTop: () => `<div class="apl-rich" style="font-size:var(--fs-sm);line-height:1.75"><small style="color:var(--text-3);font-weight:800">문제</small><br>${rich(text11(cur().v, cur().ask))}</div>`,
      problem: { tag: '2025학년도 9월 고2 학평(인천) 19번 유형', time: '목표 시간: 30초', text: () => PL.probHTML(text11(cur().v, cur().ask)), answer: () => safe('$' + ans11(cur().v, cur().ask) + '$') },
      solution: {
        standardTitle: '대칭이동해 AP+BP 를 선분 AB′ 로 바꾸기', standardTag: '교과서 풀이', quickTitle: '가로·세로를 맞바꾸고 두 점 사이 거리', quickTag: '10초 컷',
        standard: () => ({ steps: rich(std11(cur().v, cur().ask)) }),
        quick: () => ({ steps: rich(quick11(cur().v, cur().ask)), highlight: '두 점이 직선의 같은 쪽이면 한 점을 대칭이동, 반대쪽이면 그대로 선분 하나로 연결합니다.' })
      },
      view: (s, lab) => {
        if((lab&&lab.tab==='problem')||s.step<3) return {notes:'P를 움직여 경로를 비교하세요. 한 점을 대칭이동하면 길이를 보존하면서 경로를 펼칠 수 있습니다.'};
        const fm = '<b>최단거리는 \'펴서\' 구합니다</b><br>직선 y = x 에 대한 대칭: 점 (p, q) 의 대칭점은 <b>(q, p)</b>. 같은 쪽의 두 점 A, B 에서 B 를 대칭이동한 B′ 를 잡으면 BP = B′P 이므로 AP + BP = AP + B′P ≥ AB′ (A 와 B′ 는 직선의 반대쪽이라 선분 AB′ 가 직선과 만남).';
        const nt = '두 점이 직선의 <b>반대쪽</b>에 있으면 대칭이동 없이 선분 AB 가 그대로 최단 경로입니다. 같은 쪽인데 그대로 A, B 를 잇는 선분과 직선의 교점을 잡으면 틀립니다. 지수곡선의 대칭점은 로그곡선 위의 점입니다(2ᵇ, b).';
        if (lab && lab.tab !== 'explore') return { formula: rich(fm), notes: rich(nt) };
        const G = PL.geo11(s.p11_a, s.p11_b), P = [s.p11_x, s.p11_x];
        const AP = Math.hypot(G.A[0] - P[0], G.A[1] - P[1]), BP = Math.hypot(G.B[0] - P[0], G.B[1] - P[1]), tot = AP + BP, near = tot - G.d < 0.03;
        return {
          chips: [{ html: `$\\overline{AP}+\\overline{BP}\\approx${PL.fix(tot)}$`, color: near ? 'amber' : 'ink', answer: true }],
          readouts: [
            { label: 'AP 의 길이', value: PL.fix(AP), color: 'amber', note: 'A (' + PL.f2(G.A[0]) + ', ' + PL.f2(G.A[1]) + ') 에서 P 까지' },
            { label: 'BP 의 길이', value: PL.fix(BP), color: 'rose', note: 'B′P 와 같음 (B′ = ' + PL.f2(G.Bq[0]) + ', ' + PL.f2(G.Bq[1]) + ')' },
            { label: 'AP + BP', value: PL.fix(tot), color: 'sky', wide: true, note: Math.abs(s.p11_x-G.px)<1e-9 ? '최소: A, P, B′가 한 직선 위' : near ? '최소에 가깝습니다. 맞추기 버튼으로 정확히 확인하세요' : 'P 를 움직여 AB′ 의 길이 ' + PL.fix(G.d) + ' 에 가까이 보세요' },
            { label: '선분 AB′ 의 길이', value: PL.fix(G.d), color: 'green', note: 'AP + BP 는 이보다 작아질 수 없음' }
          ],
          formula: rich(fm), notes: rich(nt)
        };
      },
      vary: vary11,
      draw: (b, s, v, lab) => draw11a(b, s, lab)
    };
  }

  /* ---------- 장면 9~11 등록 ---------- */
  Object.assign(params, {
    p9a_t: { value: 1.5, min: -3, max: 6.4, step: 0.05, color: 'amber', label: '수평선의 높이 t', format: (v) => 't = ' + PL.f2(v) },
    p9a_R: { value: 3, min: 1, max: 6.5, step: 0.25, color: 'sky', label: '오른쪽 조각의 시작 높이 R (x = 2 에서의 값)', format: (v) => 'R = ' + PL.f2(v) },
    p9b_t: { value: 0.6, min: -1.5, max: 4.6, step: 0.05, color: 'amber', label: '수평선의 높이 t', format: (v) => 't = ' + PL.f2(v) },
    p9b_b: { value: 1, min: 0.25, max: 2.75, step: 0.25, color: 'sky', label: '안쪽 상수 b  (y = | |2ˣ − 3| − b |)', format: (v) => 'b = ' + PL.f2(v) },
    p10_t: { value: 3, min: 0.5, max: 5.5, step: 0.05, color: 'amber', label: 'A 의 x좌표 t', format: (v) => 't = ' + PL.f2(v) },
    p10_m: { value: 1.6, min: 1.2, max: 2.8, step: 0.05, color: 'sky', label: 'A 의 높이 aᵗ', format: (v) => 'aᵗ = ' + PL.f2(v) },
    p10b_a: { value: 2.2, min: 1.25, max: 3, step: 0.005, color: 'amber', label: '곡선의 밑 a', format: (v) => 'a = ' + Number(v).toFixed(3) },
    p11_x: { value: 3, min: 0.2, max: 6, step: 0.05, color: 'sky', label: '점 P 의 위치 (P = (x, x))', format: (v) => 'P(' + PL.f2(v) + ', ' + PL.f2(v) + ')' },
    p11_a: { value: 0, min: -1, max: 2, step: 0.25, color: 'amber', label: '점 A 의 x좌표', format: (v) => 'A(' + PL.f2(v) + ', ' + PL.f2(Math.pow(2, v)) + ')' },
    p11_b: { value: 2, min: 0.5, max: 3, step: 0.25, color: 'rose', label: '점 B 의 x좌표', format: (v) => 'B(' + PL.f2(v) + ', ' + PL.f2(Math.pow(2, v)) + ')' }
  });
  groups.push(
    { id: 'type9', title: '유형 9 · 수평선 y = t 와 교점의 개수 g(t)', short: '교점 개수 g(t)', scenes: [PL.sceneStair(S9A), PL.sceneStair(S9B)] },
    { id: 'type10', title: '유형 10 · 곡선 위 점이 이루는 삼각형', short: '삼각형 조건', scenes: [scene10a(), scene10b()] },
    { id: 'type11', title: '유형 11 · y = x 대칭과 최단거리', short: '대칭·최단거리', scenes: [scene11a()] }
  );

  /* PLUS-END */

  /* ---------- 7. 실험실 등록 ---------- */
  APLab.createLab({
    id: 'alg-explog',
    stagedReveal: true,
    title: '지수·로그함수 그래프 탐구',
    courseName: '대수',
    unit: 'Ⅰ. 지수함수와 로그함수',
    courseColor: 'var(--m-amber)',
    home: '../index.html#algebra',
    legacy: '../../labs/대수/part1a.html',
    board: { kind: 'cartesian', focus: FOCUS[0] },
    params,
    state: { mut_diag: false, mut_abs: false, mut_dots: false, twinText: null, twinSnap: null, p11_ref: false },
    persist: ['mut_diag', 'mut_abs', 'mut_dots'],
    groups
  });
});
