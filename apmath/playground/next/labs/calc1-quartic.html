<script>
/* ==========================================================================
   미적분Ⅰ · 사차함수 비율관계 (AP Math Lab 2.0 이식본)
   원본: labs/미적분1/사차함수 비율관계.html
   - 정리·문제 탭은 같은 학습 포인트를 유지하는 사차함수족의 숫자 변형과 연결됩니다.
   - 단계별 그림과 설명은 현재 모델의 중근·대칭 조건 및 부호에 맞추어 갱신됩니다.
   - 수학 함수(사차함수 f, 삼차 도함수, 세 극점 α·γ·β, 도함수 넓이 S₁·S₂, 식 표시 생성기)는
     원본과 같은 식입니다. 원본이 전역 state를 읽던 것을 상태 s를 첫 인자로 받도록만 바꿨습니다.
   - 바뀐 점: 셸·레이아웃은 공용 키트가 담당, 무대는 1:1 축척, 점은 직접 끌 수 있는 손잡이
     (극소 A·B, 가운데 극대 C 또는 도함수의 영점 γ, 수평선 y=k), 의미색으로 색 통일.
   ========================================================================== */
window.addEventListener('DOMContentLoaded', function () {
  const { tex, fmt, clamp } = APLab;
  const lqtActive = s => !!s && !!(s.lessonOn || s.lessonEntry);
  const NARROW = window.matchMedia('(max-width: 859px)'); // 셸의 모바일 기준과 같은 값

  /* ---------- 1. 사차함수와 삼차 도함수 ----------
     도함수: f'(x) = 4a (x - α)(x - γ)(x - β),  u = x - α, L = β - α, c = γ - α = λ·L (0 ≤ λ ≤ 1)
     사차함수: f(x) = a [ u⁴ - 4/3·(L + c)u³ + 2cL·u² ] + y0   */
  function getRoots(s) {
    const alpha = s.alpha;
    const beta = alpha + s.spanL;
    const gamma = alpha + s.lambda * s.spanL;
    return { alpha, gamma, beta };
  }

  function evalF(s, x) {
    const u = x - s.alpha;
    const L = s.spanL;
    const c = s.lambda * L;
    return s.a * (Math.pow(u, 4) - (4 / 3) * (L + c) * Math.pow(u, 3) + 2 * c * L * u * u) + s.y0;
  }

  function evalFp(s, x) {
    const { alpha, gamma, beta } = getRoots(s);
    return 4 * s.a * (x - alpha) * (x - gamma) * (x - beta);
  }

  // 도함수의 두 영역 넓이 S1 = ∫_α^γ |f'(x)|dx, S2 = ∫_γ^β |f'(x)|dx
  function getDerivativeAreas(s) {
    const { alpha, gamma, beta } = getRoots(s);
    const s1 = Math.abs(evalF(s, gamma) - evalF(s, alpha));
    const s2 = Math.abs(evalF(s, beta) - evalF(s, gamma));
    return { s1, s2 };
  }

  // 수식 표시용 LaTeX 생성기
  function getFormulaLatex(s) {
    const { alpha, gamma, beta } = getRoots(s);
    const aStr = Number.isInteger(+(s.a * 4).toFixed(2)) && s.a === 0.25 ? '\\dfrac{1}{4}' : s.a.toFixed(2);
    const fpA = Number.isInteger(+(4 * s.a).toFixed(2)) ? (4 * s.a).toFixed(0) : (4 * s.a).toFixed(2);
    const fpPrefix = Math.abs(4 * s.a - 1) < 1e-5 ? '' : fpA;

    const fmtFactor = (r) => {
      if (Math.abs(r) < 1e-4) return 'x';
      const sign = r > 0 ? '-' : '+';
      const v = Math.abs(r);
      const vStr = Number.isInteger(+v.toFixed(2)) ? v.toFixed(0) : v.toFixed(2);
      return `(x ${sign} ${vStr})`;
    };

    // 삼중근 여부 확인
    if (isLeft(s)) {
      const q = alpha + (4 / 3) * s.spanL;
      const y0Str = s.y0 === 0 ? '' : (s.y0 > 0 ? ` + ${s.y0.toFixed(1)}` : ` - ${Math.abs(s.y0).toFixed(1)}`);
      return {
        fLatex: `f(x) \\approx ${aStr}${fmtFactor(alpha)}^3${fmtFactor(q)}${y0Str}`,
        fpLatex: `f^{\\prime}(x) \\approx ${fpPrefix}${fmtFactor(alpha)}^2${fmtFactor(beta)}`
      };
    } else if (isRight(s)) {
      const q = beta - (4 / 3) * s.spanL;
      const yBeta = evalF(s, beta);
      const yBStr = Math.abs(yBeta) < 0.01 ? '' : (yBeta > 0 ? ` + ${yBeta.toFixed(1)}` : ` - ${Math.abs(yBeta).toFixed(1)}`);
      return {
        fLatex: `f(x) \\approx ${aStr}${fmtFactor(q)}${fmtFactor(beta)}^3${yBStr}`,
        fpLatex: `f^{\\prime}(x) \\approx ${fpPrefix}${fmtFactor(alpha)}${fmtFactor(beta)}^2`
      };
    } else {
      return {
        fLatex: `y = f(x) \\; (\\alpha\\approx${alpha.toFixed(2)}, \\gamma\\approx${gamma.toFixed(2)}, \\beta\\approx${beta.toFixed(2)})`,
        fpLatex: `f^{\\prime}(x) \\approx ${fpPrefix}${fmtFactor(alpha)}${fmtFactor(gamma)}${fmtFactor(beta)}`
      };
    }
  }

  /* ---------- 2. 문제·풀이 데이터 (원본 examData 그대로) ---------- */
    const examData = {

② 대칭축 ${tex('x = 1')} 대입하여 극댓값과 극솟값의 차 계산:<br/>

  /* ---------- 3. 보기 창 (원본 VIEW: 모드별로 꼭 보여야 할 세계 범위, 무대는 항상 1:1) ---------- */
  // x: 가로, y: 주 그래프 세로, dy: 동시 보기에서 아래 칠판(삼차 도함수)의 세로
  // dual: 동시 보기일 때 위 칠판이 차지하는 비율(frac)과 세로 범위(y)
  const VIEW = {
    1: { x: [-1.4, 4.6], y: [-5.8, 3.0], dy: [-4.5, 2] },
    2: { x: [-1.9, 3.9], y: [-2.8, 2.8], dy: [-3.5, 3.5], dual: { frac: 0.5 } },
    3: { x: [-1.2, 3.4], y: [-2.8, 2.8], dy: [-3.5, 3.5], dual: { frac: 0.5 } },
    4: { x: [-1.4, 3.4], y: [-8.3, 2.9], dy: [-6.2, 1.8], dual: { y: [-8.3, 4.3], frac: 0.6 } },
    5: { x: [-0.9, 4.6], y: [-5.5, 4.8], dy: [-4.5, 2], dual: { frac: 0.6 } }
  };
  const dualOf = (v) => ({ y: v.y, frac: 0.58, ...(v.dual || {}) });
  // 동시 보기에서 위 칠판은 무대 위쪽의 식 칩(수식 배지) 아래부터 그림이 시작해야 하므로, 좁은 화면(칩이 위로 더 길게 보임)에서는 위쪽 여백을 조금 더 줍니다.
  const focusFor = (v, dual) => {
    if (!dual) return { x: v.x, y: v.y };
    const y = dualOf(v).y;
    return { x: v.x, y: NARROW.matches ? [y[0], y[1] + 0.3] : y };
  };
  const defaultPanes = (m) => {
    const d = dualOf(VIEW[m]);
    return [{ id: 'main', frac: d.frac, focusY: d.y }, { id: 'deriv', frac: 1 - d.frac, focusY: VIEW[m].dy }];
  };

  /* ---------- 3-1. 자동 보기: 실제 극값 위치에 맞춰 보기 창을 다시 맞춥니다 ----------
     원본의 고정 창은 문제 조건(기본값)에서만 W 전체가 들어옵니다. λ·L·a 를 바꾸거나 끌거나 자동 실험이 돌 때
     극소 B·극대 C 가 화면 밖으로 나가지 않도록, 그림에 꼭 들어와야 할 세계 범위(극점 α·γ·β, 모드별 교점)를 구해
     그 범위가 라벨 여백까지 들어오는 가장 큰 1:1 창을 잡습니다. 내용이 창을 벗어나거나(또는 너무 작아지면) 다시 맞추고,
     끌고 있는 동안에는 창이 움직이지 않습니다. */
  const AUTO = { m: 0, win: null, panes: null };
  function mainBox(s, m) {
    const { alpha, gamma, beta } = getRoots(s);
    const ys = [evalF(s, alpha), evalF(s, gamma), evalF(s, beta), 0];
    const bx = { x0: alpha, x1: beta, y0: Math.min(...ys), y1: Math.max(...ys) };
    const addX = (x) => { bx.x0 = Math.min(bx.x0, x); bx.x1 = Math.max(bx.x1, x); };
    if ((m === 1 || m === 3) && (isLeft(s) || isRight(s))) addX(isLeft(s) ? alpha + (4 / 3) * s.spanL : beta - (4 / 3) * s.spanL);
    if (m === 2 && isSym(s)) { addX(gamma - Math.SQRT2 * (s.spanL / 2)); addX(gamma + Math.SQRT2 * (s.spanL / 2)); }
    if (m === 5) {
      findCrossings(s, s.kLine).forEach(addX);
      const folded = ys.map(y => s.kLine + Math.abs(y - s.kLine));
      bx.y0 = Math.min(bx.y0, -6, s.kLine);
      bx.y1 = Math.max(bx.y1, 4, s.kLine, ...folded);
    }
    return bx;
  }
  // 도함수가 두 극솟점 사이에서 오가는 값의 범위 (0 포함)
  function derivBox(s) {
    const { alpha, beta } = getRoots(s);
    let lo = 0, hi = 0;
    for (let i = 0; i <= 80; i++) {
      const v = evalFp(s, alpha + ((beta - alpha) * i) / 80);
      lo = Math.min(lo, v);
      hi = Math.max(hi, v);
    }
    return { y0: lo, y1: hi };
  }
  function computeFit(b, s, m) {
    const a = b._area();
    const pad = b.pad * Math.min(a.w, a.h);
    const ex = s.playing ? 0.2 : 0; // 자동 실험 중에는 넉넉히 잡아 창이 자주 바뀌지 않게
    const nb = mainBox(s, m);
    const bw = Math.max(nb.x1 - nb.x0, 0.8) * (1 + ex);
    const bh = Math.max(nb.y1 - nb.y0, 0.8) * (1 + ex);
    const cx = (nb.x0 + nb.x1) / 2, cy = (nb.y0 + nb.y1) / 2;
    const mx = 40;
    if (!s.dual) {
      const mt = 52, mb = 44;
      const k = Math.max(1e-3, Math.min((a.w - 2 * mx) / bw, (a.h - mt - mb) / bh));
      const cyw = cy + (mt - mb) / (2 * k);
      const fw = (a.w - 2 * pad) / k, fh = (a.h - 2 * pad) / k;
      return { nb, db: null, k, panes: null, focus: { x: [cx - fw / 2, cx + fw / 2], y: [cyw - fh / 2, cyw + fh / 2] } };
    }
    // 동시 보기: 위(f)·아래(f′) 칠판의 높이 비율을 두 그림이 같은 배율로 꼭 맞게 정합니다.
    const db = derivBox(s);
    const dh = Math.max(db.y1 - db.y0, 0.8) * (1 + ex);
    const mt = (b.insets.top || 0) + 24, mb = 30; // 위 칠판은 위쪽 식 칩 아래부터
    const mtd = 34, mbd = 30 + (b.insets.bottom || 0); // 아래 칠판은 이름표 아래부터, 휴대폰에서는 아래 상태 배지·도구 위까지
    const A = a.h;
    let f = (A / dh + (mt + mb) / bh - (mtd + mbd) / dh) / (A * (1 / bh + 1 / dh));
    f = clamp(f, 0.36, 0.7);
    const k = Math.max(1e-3, Math.min((a.w - 2 * mx) / bw, (f * A - mt - mb) / bh, ((1 - f) * A - mtd - mbd) / dh));
    const cyw = cy + (mt - mb) / (2 * k);
    const cyd = (db.y0 + db.y1) / 2 + (mtd - mbd) / (2 * k);
    const fw = (a.w - 2 * pad) / k, fh = (f * A - 2 * pad) / k;
    return {
      nb, db, k,
      panes: [{ id: 'main', frac: f, focusY: [cyw - 0.5, cyw + 0.5] }, { id: 'deriv', frac: 1 - f, focusY: [cyd - 0.5, cyd + 0.5] }],
      focus: { x: [cx - fw / 2, cx + fw / 2], y: [cyw - fh / 2, cyw + fh / 2] }
    };
  }
  function autoView(b, s, m) {
    const lay = [m, s.dual ? 1 : 0, b.W, b.H, Math.round((b.insets.top || 0) / 8), Math.round((b.insets.right || 0) / 8), Math.round((b.insets.bottom || 0) / 8)].join('|');
    const w = AUTO.win;
    const same = !!w && w.lay === lay;
    if (same && s.dragging) return; // 끄는 동안에는 손잡이 아래의 좌표계가 움직이지 않게
    const cand = computeFit(b, s, m);
    if (same) {
      const o = w.nb, n = cand.nb;
      const sx = 0.1 * (o.x1 - o.x0), sy = 0.1 * (o.y1 - o.y0);
      let within = n.x0 >= o.x0 - sx && n.x1 <= o.x1 + sx && n.y0 >= o.y0 - sy && n.y1 <= o.y1 + sy;
      if (within && cand.db) {
        const od = w.db, nd = cand.db, sd = 0.1 * (od.y1 - od.y0);
        within = nd.y0 >= od.y0 - sd && nd.y1 <= od.y1 + sd;
      }
      if (within && !(cand.k > 1.7 * w.k && !s.playing)) return;
    }
    AUTO.win = { lay, nb: cand.nb, db: cand.db, k: cand.k };
    AUTO.m = m;
    AUTO.panes = cand.panes;
    b.setPanes(cand.panes);
    b.setFocus(cand.focus, !same);
  }
  const panesOf = (m) => (s) => {
    if (!s.dual) return null;
    return AUTO.m === m && AUTO.panes ? AUTO.panes : defaultPanes(m);
  };

  /* ---------- 4. 공통 부품 ---------- */
  // 그림 라벨용 짧은 수: 0.00 → 0, 2.40 → 2.4 (불필요한 0을 줄여 라벨이 겹치지 않게)
  const num = (v, d = 2) => { const r = +v.toFixed(d); return String(Object.is(r, -0) ? 0 : r).replace('-', '−'); };
  const qSame = (x, y) => Math.abs(x - y) <= 1e-10 * Math.max(1, Math.abs(x), Math.abs(y));
  const isLeft = (s) => qSame(s.lambda, 0);
  const isRight = (s) => qSame(s.lambda, 1);
  const isSym = (s) => qSame(s.lambda, 0.5);
  const secs = (m) => examData[m].targetTime;
  function enterOf(m) {
    return (s) => {
      AUTO.win = null; AUTO.panes = null; AUTO.m = 0; // 장면에 들어오면 보기 창을 새로 맞춥니다
      const sn = examData[m].snap;
      s.a = sn.a; s.alpha = sn.alpha; s.spanL = sn.spanL; s.lambda = sn.lambda; s.y0 = sn.y0; s.kLine = sn.kLine; s.dual = sn.dualView;
    };
  }
  function bounce(s, key, speed, lo, hi, dt) {
    s[key] += speed * s.animDir * dt;
    if (s[key] < lo) { s[key] = lo; s.animDir = 1; }
    if (s[key] > hi) { s[key] = hi; s.animDir = -1; }
  }
  const actionsCommon = () => [
    { id: 'dual', icon: 'split', label: (s) => (s.dual ? "f(x)·f′(x) 함께 보기 켜짐" : "f(x)·f′(x) 함께 보기"), on: (s) => s.dual, run: (s) => { s.dual = !s.dual; } },
    { id: 'play', play: true, icon: (s) => (s.playing ? 'pause' : 'play'), label: (s) => (s.playing ? '일시 정지' : '자동으로 움직이기'), on: (s) => s.playing, run: (s) => { s.playing = !s.playing; } }
  ];
  // 4대 개형 원클릭 프리셋 (원본 applyQuarticPreset: a와 기준선 k도 처음 값으로 돌려놓습니다)
  const shape = (alpha, spanL, lambda, y0) => ({ a: 0.25, alpha, spanL, lambda, y0, kLine: 2 });
  const presetsCommon = [
    { group: '그래프의 개형', label: '① 삼중근 3:1 (λ=0)', color: 'amber', set: shape(0, 3, 0, 2), on: (s) => isLeft(s) },
    { group: '그래프의 개형', label: '② 좌우 대칭 1:√2 (λ=0.5)', color: 'sky', set: shape(-1, 4, 0.5, -2), on: (s) => isSym(s) },
    { group: '그래프의 개형', label: '③ 좌우 비대칭 (λ=0.3)', color: 'rose', set: shape(-1, 4, 0.3, 1), on: (s) => !isLeft(s) && !isRight(s) && !isSym(s) },
    { group: '그래프의 개형', label: '④ 오른쪽 삼중근 1:3 (λ=1)', color: 'green', set: shape(0, 3, 1, -4.75), on: (s) => isRight(s) }
  ];
  // 우측 가장자리(도구 막대 왼쪽)에 놓는 y=k 손잡이의 x좌표
  const kHandleX = (b) => b.toW(b.W - (b.panes ? 0 : b.insets.right) - 44, 0).x;
  // 막대 옆 라벨: 오른쪽에 놓되 무대 밖으로 나가면 막대 왼쪽에 놓습니다.
  function barLabel(b, x, y, str, color, ref) {
    const c = b.ctx;
    c.save();
    c.font = `800 ${12.5 * b.fs}px ${b.font}`;
    const w = c.measureText(str).width;
    c.restore();
    const right = b.toS(x, y).x + 8 + w > b.W - (b.panes ? 0 : b.insets.right) - 6;
    b.text([x, y], str, { color, dx: right ? -8 : 8, align: right ? 'right' : 'left', baseline: 'middle', size: 12.5, ref });
  }
  // 세계 좌표 x에서 화면 px만큼 오른쪽으로 떨어진 세계 x (막대·괄호를 곡선과 띄울 때)
  const offX = (b, x, px) => b.toW(b.toS(x, 0).x + px, 0).x;

  // |f(x) - k| 의 교점 탐색. 원본은 |f-k|<0.015 인 구간을 '교점'으로 훑어 삼중근 근처(예: k=2에서 x≈-0.2)를
  // 엉뚱한 곳에서 잡아 첨점으로 잘못 판정했습니다. 여기서는 ① 부호가 바뀌는 단순근(이분법)과
  // ② 도함수가 0인 점 α·γ·β 중 f=k 가 되는 점(중근·삼중근, 기울기 0)을 정확히 찾습니다.
  function findCrossings(s, k, minX = -Infinity, maxX = Infinity) {
    // 도함수의 영점으로 나눈 각 단조 구간에는 교점이 많아야 하나입니다.
    // 일정한 훑기 간격이나 넓은 병합 오차로 가까운 두 근을 놓치지 않습니다.
    const { alpha, gamma, beta } = getRoots(s);
    const critical = [alpha, gamma, beta].filter((x, i, a) => !i || !qSame(x, a[i - 1]));
    let reach = Math.max(s.spanL, 1), lo = alpha - reach, hi = beta + reach;
    for (let i = 0; i < 32 && ((evalF(s, lo) - k) * s.a <= 0 || (evalF(s, hi) - k) * s.a <= 0); i++) {
      reach *= 2; lo = alpha - reach; hi = beta + reach;
    }
    const roots = [], add = x => { if (!roots.some(r => qSame(r, x))) roots.push(x); };
    critical.forEach(x => { if (qSame(evalF(s, x), k)) add(x); });
    const cuts = [lo, ...critical, hi];
    for (let i = 1; i < cuts.length; i++) {
      let a = cuts[i - 1], b = cuts[i], fa = evalF(s, a) - k, fb = evalF(s, b) - k;
      if (qSame(evalF(s, a), k) || qSame(evalF(s, b), k) || fa * fb >= 0) continue;
      for (let j = 0; j < 64; j++) {
        const c = (a + b) / 2, fc = evalF(s, c) - k;
        if (fa * fc <= 0) { b = c; fb = fc; } else { a = c; fa = fc; }
      }
      add((a + b) / 2);
    }
    return roots.filter(x => x >= minX && x <= maxX).sort((a, b) => a - b);
  }
  const stationaryCrossing = (s, x, k) => Object.values(getRoots(s)).some(c => qSame(c, x) && qSame(evalF(s, c), k));

  // 실시간 값·상태·경고·하단 판서 (원본 updateLiveMonitor + renderBottomChalkBanner)
  function viewFor(m) {
    return (s) => {
      const { alpha, gamma, beta } = getRoots(s);
      const { s1, s2 } = getDerivativeAreas(s);
      const f = getFormulaLatex(s);
      const left = isLeft(s), right = isRight(s), sym = isSym(s);
      const lam = fmt(s.lambda);
      if (s.step === 0) return {
        chips: [{ k: '탐구 함수 · 소수 표시는 근삿값', tex: f.fLatex, color: 'amber' }],
        notes: '현재 탐구 모델은 조절한 a, α, L, λ, y₀로 정해집니다. 정리·문제 탭은 발문에 적힌 조건의 그림입니다. 보조선을 차례로 열어 접점·대칭·높이 차를 확인하세요.'
      };
      // 모드별 특수 성립 조건 판별
      let status, alert = null;
      if (m === 1 && !left && !right) {
        status = { tone: 'warn', text: `λ = ${lam} (삼중근 아님 · 3:1 비율이 성립하지 않음)` };
        alert = { tone: 'bad', text: "현재 f′(x)=0이 중근을 갖지 않으므로(λ ≠ 0, 1) 3 : 1 비율이 성립하지 않습니다!" };
      } else if (m === 2 && !sym) {
        status = { tone: 'warn', text: `λ = ${lam} ≠ 0.5 (비대칭 · 1:√2 비율이 성립하지 않음)` };
        alert = { tone: 'bad', text: '현재 좌우 비대칭인 사차함수(λ ≠ 0.5)이므로 극대점의 수평인 접선에서 1 : √2 비율이 성립하지 않습니다!' };
      } else {
        status = { tone: 'ok', text: left || right ? '삼중근 개형 (3 : 1 비율, 넓이 $\\frac{|a|}{20}$·L⁵)' : sym ? '좌우 대칭 개형 (1 : √2 비율, 넓이 $\\frac{|a|}{30}$·L⁵)' : "좌우 비대칭 개형 (도함수의 S₁, S₂ 비교)" };
      }
      let v2, v4;
      if (left || right) {
        const q = left ? alpha + (4 / 3) * s.spanL : beta - (4 / 3) * s.spanL;
        v2 = `3 : 1 성립 (교점 q=${fmt(q)})`;
        v4 = `S = $\\frac{|a|}{20}$·L⁵ = ${fmt((Math.abs(s.a) / 20) * Math.pow((4 / 3) * s.spanL, 5))}`;
      } else if (sym) {
        v2 = `1 : √2 성립 (√2h=${fmt(Math.sqrt(2) * (s.spanL / 2))})`;
        v4 = `S = $\\frac{|a|}{30}$·L⁵ = ${fmt((Math.abs(s.a) / 30) * Math.pow(s.spanL, 5))}`;
      } else {
        v2 = `좌우 비대칭 (λ=${lam})`;
        v4 = `극솟값 차 = ${fmt(Math.abs(s1 - s2))}`;
      }
      if (m === 5) {
        const cr = findCrossings(s, s.kLine);
        const cusp = cr.filter(rx => !stationaryCrossing(s, rx, s.kLine)).length;
        v4 = `미분가능하지 않은 점 ${cusp}개 · 미분가능한 접점 ${cr.length - cusp}개`;
      }
      // 하단 판서(원본 renderBottomChalkBanner)
      let tape = null;
      if (s.step >= 3) {
        let title;
        if (m === 1) {
          const hv = s.spanL / 3;
          title = left || right
            ? `삼중근 3 : 1 비율 성립! (한 칸 h=${fmt(hv)} | 극솟값 깊이 Δy = 27|a|h⁴ = ${fmt(27 * Math.abs(s.a) * Math.pow(hv, 4))})`
            : `λ = ${lam} (도함수가 중근을 갖지 않음) → 3 : 1 비율이 성립하지 않습니다!`;
        } else if (m === 2) {
          const hv = s.spanL / 2;
          title = sym
            ? `좌우 대칭 1 : √2 성립! (h=${fmt(hv)}, √2h=${fmt(Math.sqrt(2) * hv)} | 극값차 Δy = |a|h⁴ = ${fmt(Math.abs(s.a) * Math.pow(hv, 4))})`
            : `λ = ${lam} ≠ 0.5 (좌우 비대칭) → 수평인 접선에서 1 : √2 비율이 성립하지 않습니다!`;
        } else if (m === 3) {
          if (left || right) {
            title = `삼중근인 접점에서의 접선과의 넓이 $S=\\dfrac{|a|}{20}L^5=${fmt((Math.abs(s.a) / 20) * Math.pow((4 / 3) * s.spanL, 5))}$`;
          } else if (sym) {
            title = `두 점에서 접하는 직선과의 넓이 $S=\\dfrac{|a|}{30}(\\beta-\\alpha)^5=${fmt((Math.abs(s.a) / 30) * Math.pow(s.spanL, 5))}$`;
          } else {
            title = `좌우 비대칭(λ = ${lam})에서는 1/20, 1/30 넓이 공식이 성립하지 않습니다 (삼중근 λ = 0, 1 또는 좌우 대칭 λ = 0.5 에서 성립)`;
          }
        } else if (m === 4) {
          title = `도함수 넓이 S₁(${fmt(s1)}) vs S₂(${fmt(s2)})  ⇒  두 극솟값 차 f(α)-f(β) = ${fmt(evalF(s, alpha) - evalF(s, beta))}`;
        } else {
          const cr = findCrossings(s, s.kLine), cusp = cr.filter(x => !stationaryCrossing(s, x, s.kLine)).length;
          title = `현재 k=${num(s.kLine, 4)}: 꺾이는 점 ${cusp}개, 기울기 0인 교점 ${cr.length - cusp}개. ` +
            (left || right ? `이 삼중근 개형에서는 k=f(${left ? 'α' : 'β'})≈${num(evalF(s, left ? alpha : beta), 4)}일 때 꺾임이 1개입니다.` : '현재 개형에서는 각 교점의 기울기를 따로 확인합니다.');
        }
        tape = { title };
      }
      return {
        // 좁은 화면에서는 일반(비대칭) 개형의 긴 식 두 개가 두 줄로 쌓여 그림을 가리므로 도함수 식(세 근이 모두 들어 있음)만 보입니다.
        chips: NARROW.matches && !left && !right ? [{ k: '탐구 도함수 · 소수 근사', tex: f.fpLatex, color: 'sky' }] : [{ k: '탐구 함수 · 소수 근사', tex: f.fLatex, color: 'amber' }, { k: '탐구 도함수 · 소수 근사', tex: f.fpLatex, color: 'sky' }],
        status,
        alert,
        readouts: [
          { label: '도함수 세 실근 (α, γ, β)', value: `${fmt(alpha, 1)} : ${fmt(gamma)} : ${fmt(beta, 1)}`, color: 'amber', ref: 'roots', wide: true },
          ...(s.step >= 2 ? [{ label: '비율 (3:1 / 1:√2)', value: v2, color: 'rose', ref: 'box', wide: true }] : []),
          ...(s.step >= 3 ? [
            { label: '도함수 넓이 S₁ vs S₂', value: `S₁≈${fmt(s1)} | S₂≈${fmt(s2)}`, color: 'sky', ref: 'dy', wide: true },
            { label: m === 5 ? '미분가능하지 않은 점의 개수' : '정적분 넓이 / 극솟값 차', value: v4, color: 'violet', ref: m === 5 ? 'fold' : 'S', wide: true }
          ] : [])
        ],
        tape
      };
    };
  }

  /* ---------- 5. 그리기 ---------- */
  function mainBg(b, s) {
    b.use('main');
    b.ctx.save();
    if (b.panes) b.clip();
    if (s.grid) b.grid();
    b.axes();
  }
  const done = (b) => b.ctx.restore();
  const curve = (b, s) => b.plot((x) => evalF(s, x), { color: 'ink', width: 3.2, glow: true });
  // 곡선 f와 직선 y=yLine 사이 영역 색칠 (x0→x1)
  function regionLine(b, s, yLine, x0, x1, o) {
    const pts = [];
    const n = 80;
    for (let i = 0; i <= n; i++) { const x = x0 + ((x1 - x0) * i) / n; pts.push([x, evalF(s, x)]); }
    pts.push([x1, yLine], [x0, yLine]);
    b.poly(pts, { fill: o.fill, fillAlpha: o.alpha, stroke: false, ref: o.ref });
  }
  const drawLambda = (s, x) => {
    let raw = (x - s.alpha) / s.spanL;
    // 0, 0.5, 1 근처 자석 스냅(Magnetic Snap)
    if (Math.abs(raw) < 0.04) raw = 0;
    else if (Math.abs(raw - 0.5) < 0.04) raw = 0.5;
    else if (Math.abs(raw - 1.0) < 0.04) raw = 1.0;
    s.lambda = clamp(+raw.toFixed(2), 0, 1);
  };
  // 세 극점: 왼쪽 A(끌면 α 이동), 오른쪽 B(끌면 L 조절), 가운데 극대 C(끌면 λ 조절) — 모든 모드 공통 (원본 renderMainPointsOverlay)
  function overlay(b, s) {
    const { alpha, gamma, beta } = getRoots(s);
    const yA = evalF(s, alpha), yB = evalF(s, beta);
    const dragA = (w) => { s.alpha = clamp(+w.x.toFixed(2), -2.0, 1.5); };
    const dragB = (w) => { s.spanL = clamp(+(w.x - s.alpha).toFixed(2), 1.5, 4.0); };
    const label = (name, x, y) => s.step >= 3 ? `${name}(${num(x)}, ${num(y)})` : name;
    if (isLeft(s)) {
      b.handle('A', [alpha, yA], { color: 'amber', r: 7, ref: 'A', label: label('A', alpha, yA), dx: -12, dy: -12, align: 'right', drag: dragA });
      b.handle('B', [beta, yB], { color: 'green', r: 7, ref: 'B', label: label('B', beta, yB), dx: 12, dy: 20, drag: dragB });
    } else if (isRight(s)) {
      b.handle('A', [alpha, yA], { color: 'green', r: 7, ref: 'A', label: label('A', alpha, yA), dx: -12, dy: 20, align: 'right', drag: dragA });
      b.handle('B', [beta, yB], { color: 'amber', r: 7, ref: 'B', label: label('B', beta, yB), dx: 12, dy: -12, drag: dragB });
    } else {
      const yC = evalF(s, gamma);
      b.handle('A', [alpha, yA], { color: 'amber', ref: 'A', label: label('A', alpha, yA), dx: -12, dy: 20, align: 'right', drag: dragA });
      b.handle('C', [gamma, yC], { color: 'rose', r: 7.5, ref: 'C', priority: 2, label: label('C', gamma, yC), dx: 0, dy: -18, align: 'center', drag: (w) => drawLambda(s, w.x) });
      b.handle('B', [beta, yB], { color: 'green', ref: 'B', label: label('B', beta, yB), dx: 12, dy: 20, drag: dragB });
    }
  }
  // 아래 칠판: 삼차 도함수 y = f′(x) 와 두 영역 넓이 S₁ vs S₂ (원본 renderDerivativePane)
  function derivPane(b, s, m) {
    if (!s.dual) return;
    const { alpha, gamma, beta } = getRoots(s);
    const { s1, s2 } = getDerivativeAreas(s);
    b.use('deriv');
    const r = b.paneRect('deriv');
    const c = b.ctx;
    c.save();
    c.fillStyle = b.color('halo', 0.35);
    c.fillRect(r.x, r.y, r.w, r.h);
    c.restore();
    c.save();
    b.clip();
    if (s.grid) b.grid();
    b.axes({ yLabel: "y'" });
    // Step 2: S1(양수 영역) & S2(음수 영역) 색칠
    if (s.step >= 2) {
      const area = (x0, x1, col, label, val) => {
        if (Math.abs(x1 - x0) <= 0.02) return;
        const pts = [[x0, 0]];
        for (let i = 0; i <= 50; i++) { const x = x0 + ((x1 - x0) * i) / 50; pts.push([x, evalFp(s, x)]); }
        pts.push([x1, 0]);
        b.poly(pts, { fill: col, fillAlpha: 0.28, stroke: false, ref: 'dy' });
        // 영역이 글자를 담을 만큼 넓을 때만 그림 안에 표시합니다 (값은 아래 이름표에도 있습니다)
        if (Math.abs(x1 - x0) * b.k >= 80) {
          const mid = (x0 + x1) / 2;
          b.text([mid, evalFp(s, mid) * 0.5], s.step >= 3 ? `${label}≈${num(val)}` : label, { color: col, size: 12.5, weight: 800, ref: 'dy' });
        }
      };
      area(alpha, gamma, 'rose', 'S₁', s1);
      area(gamma, beta, 'sky', 'S₂', s2);
    }
    // 삼차 도함수 본체 곡선
    b.plot((x) => evalFp(s, x), { color: 'sky', width: 2.8, glow: true });
    b.point([alpha, 0], { color: 'amber', r: 5, ref: 'roots', label: `α=${num(alpha)}`, dx: -10, dy: -12, align: 'right' });
    b.handle('Cd', [gamma, 0], { color: 'rose', ref: 'roots', priority: 1, label: `γ=${num(gamma)}`, dx: 0, dy: 20, align: 'center', drag: (w) => drawLambda(s, w.x) });
    b.point([beta, 0], { color: 'green', r: 5, ref: 'roots', label: `β=${num(beta)}`, dx: 10, dy: -12 });
    c.restore();
    // 나눔선 + 이름표
    c.save();
    c.strokeStyle = b.color('sky', 0.55);
    c.lineWidth = 1.5;
    c.beginPath();
    c.moveTo(r.x, r.y + 0.5);
    c.lineTo(r.x + r.w, r.y + 0.5);
    c.stroke();
    c.restore();
    const ttl = NARROW.matches ? '도함수 y = f′(x)' : '삼차 도함수 y = f′(x) · 넓이 S₁, S₂ 비교';
    b.stext(r.x + 14, r.y + 20, ttl, { color: 'sky', size: 12.5, align: 'left', weight: 800 });
    if (s.step >= 3 && !NARROW.matches) {
      // S₁·S₂ 값을 이름표 옆에 색으로 구분해 적습니다
      c.save();
      c.font = `800 ${12.5 * b.fs}px ${b.font}`;
      let tx = r.x + 14 + c.measureText(ttl).width + 14;
      c.restore();
      b.stext(tx, r.y + 20, `S₁=${num(s1)}`, { color: 'rose', size: 12.5, align: 'left', weight: 800 });
      tx += 70 * b.fs;
      b.stext(tx, r.y + 20, `S₂=${num(s2)}`, { color: 'sky', size: 12.5, align: 'left', weight: 800 });
    }
    // 위·아래를 잇는 수직 동기화선 (원본 renderVerticalSyncLines)
    b.use('main');
    const r1 = b.paneRect('main');
    if (s.step >= 1) {
      const line = (x, col, al, w) => {
        const sx = b.toS(x, 0).x;
        c.save();
        c.setLineDash([5, 5]);
        c.strokeStyle = b.color(col, al);
        c.lineWidth = w;
        c.beginPath();
        c.moveTo(sx, r1.y + 6);
        c.lineTo(sx, r.y + r.h - 6);
        c.stroke();
        c.restore();
      };
      line(alpha, 'amber', 0.55, 1.6);
      line(gamma, 'rose', 0.6, 1.8);
      line(beta, 'green', 0.55, 1.6);
    }
  }

  // 모드 1: 삼중근 사차함수의 3 : 1 비율 격자 박스와 제2변곡점(2:1)
  function drawTriple(b, s) {
    const { alpha, beta } = getRoots(s);
    const left = isLeft(s), right = isRight(s);
    if (!left && !right) return; // 삼중근 조건이 깨지면 보조선 없이 곡선과 점만 보입니다
    const L = s.spanL;
    const h = L / 3; // 3:1 에서 한 칸 단위 h
    const xTriple = left ? alpha : beta;
    const xExtrema = left ? beta : alpha;
    const xCross = left ? alpha + 4 * h : beta - 4 * h;
    const xInf2 = left ? alpha + 2 * h : beta - 2 * h;
    const yTriple = evalF(s, xTriple);
    const yMin = evalF(s, xExtrema);
    const xLeft = Math.min(xTriple, xCross);
    const xRight = Math.max(xTriple, xCross);

    // Step 2: 3 : 1 비율 격자 박스
    if (s.step >= 2) {
      b.poly([[xLeft, yTriple], [xRight, yTriple], [xRight, yMin], [xLeft, yMin]], { fill: 'amber', fillAlpha: 0.07, color: 'amber', alpha: 0.8, width: 2, ref: 'box' });
      for (let i = 1; i <= 3; i++) b.seg([xLeft + i * h, yTriple], [xLeft + i * h, yMin], { color: 'amber', alpha: 0.5, width: 1.4, dash: true, ref: 'box' });
      // 상단 3 : 1 브래킷 라벨
      b.text([(xTriple + xExtrema) / 2, yTriple], '3', { color: 'amber', dy: -12, size: 15, weight: 850, ref: 'box' });
      b.text([(xExtrema + xCross) / 2, yTriple], '1', { color: 'sky', dy: -12, size: 15, weight: 850, ref: 'box' });
      b.text([(xLeft + xRight) / 2, yTriple], `한 칸 h = ${num(h)}`, { color: 'amber', dy: -32, size: 12.5, ref: 'box' });
    }
    // Step 1: 변곡접선 y = yTriple 및 교점 Q
    if (s.step >= 1) {
      b.seg([xLeft - 1.0, yTriple], [xRight + 1.0, yTriple], { color: 'rose', width: 2.4, dash: true, glow: true, ref: 'tan' });
      b.seg([xLeft - 1.0, yMin], [xRight + 1.0, yMin], { color: 'sky', width: 1.8, dash: true, ref: 'dy' });
      b.point([xCross, yTriple], { color: 'sky', r: 6, ref: 'box', label: `교점 Q(${num(xCross)}, ${num(yTriple)})`, dx: left ? 10 : -10, dy: -14, align: left ? 'left' : 'right' });
    }
    // Step 3: 제2변곡점 I₂(2:1 내분) 및 높이차 Δy = 27|a|h⁴
    if (s.step >= 3) {
      const yInf2 = evalF(s, xInf2);
      b.point([xInf2, yInf2], { color: 'violet', r: 5, ref: 'I2', label: 'I₂ · x좌표 사이의 비 2:1', dx: -12, dy: 22, align: 'right' });
      const xr = offX(b, xRight, 26);
      b.seg([xr, yTriple], [xr, yMin], { color: 'sky', width: 2.5, ref: 'dy' });
      barLabel(b, xr, (yTriple + yMin) / 2, `Δy = ${num(Math.abs(yTriple - yMin))}`, 'sky', 'dy');
    }
  }

  // 모드 2: 대칭 사차함수(W형)의 1 : √2 비율과 극댓값-극솟값 높이차
  function drawSym(b, s) {
    if (!isSym(s)) return;
    const { alpha, gamma, beta } = getRoots(s);
    const yA = evalF(s, alpha), yC = evalF(s, gamma), yB = evalF(s, beta);
    // Step 1: 대칭축 x = γ 및 두 극소점 보조선
    if (s.step >= 1) {
      b.vline(gamma, { color: 'amber', alpha: 0.55, width: 1.8, dash: true, ref: 'axis' });
      b.seg([alpha - 1.5, yA], [beta + 1.5, yB], { color: 'sky', width: 2.2, dash: true, ref: 'dy' });
    }
    const h = s.spanL / 2;
    const xRootL = gamma - Math.sqrt(2) * h;
    const xRootR = gamma + Math.sqrt(2) * h;
    // Step 2: 극대 수평 접선 및 1 : √2 비율 가이드 박스
    if (s.step >= 2) {
      b.poly([[xRootL, yC], [xRootR, yC], [xRootR, yA], [xRootL, yA]], { fill: 'rose', fillAlpha: 0.07, color: 'rose', alpha: 0.65, width: 1.8, ref: 'box' });
      b.seg([xRootL - 0.8, yC], [xRootR + 0.8, yC], { color: 'rose', width: 2.4, glow: true, ref: 'box' });
      b.point([xRootL, yC], { color: 'violet', r: 5.5, ref: 'box', label: `γ−√2h (${num(xRootL)})`, dx: -10, dy: -12, align: 'right' });
      b.point([xRootR, yC], { color: 'violet', r: 5.5, ref: 'box', label: `γ+√2h (${num(xRootR)})`, dx: 10, dy: -12 });
      // 1 : √2 수평 비율 자 (극대 접선 아래 두 줄: γ~β 는 1, γ~γ+√2h 는 √2)
      const yRow = (px) => b.toW(0, b.toS(0, yC).y + px).y;
      b.seg([gamma, yRow(16)], [beta, yRow(16)], { color: 'amber', width: 3.2, ref: 'box' });
      b.seg([gamma, yRow(34)], [xRootR, yRow(34)], { color: 'violet', width: 3.2, ref: 'box' });
      b.text([(gamma + beta) / 2, yRow(16)], '1', { color: 'amber', dy: -5, size: 15, weight: 850, ref: 'box' });
      b.text([(gamma + xRootR) / 2, yRow(34)], '√2', { color: 'violet', dy: 19, size: 15, weight: 850, ref: 'box' });
      b.text([gamma, yRow(34)], `h = ${num(h)} · √2h = ${num(Math.sqrt(2) * h)}`, { color: 'amber', dy: 40, size: 12, align: 'right', dx: -8, ref: 'box' });
    }
    // Step 3: 극댓값-극솟값 높이차 Δy = |a|h⁴
    if (s.step >= 3) {
      const xr = offX(b, xRootR, 26);
      b.seg([xr, yC], [xr, yA], { color: 'amber', width: 2.6, ref: 'dy' });
      barLabel(b, xr, (yC + yA) / 2, `Δy = ${num(Math.abs(yC - yA))}`, 'amber', 'dy');
    }
  }

  // 모드 3: 사차함수 2대 넓이 공식 (삼중근 1/20 vs 이중접선 1/30)
  function drawArea(b, s) {
    const { alpha, beta } = getRoots(s);
    const left = isLeft(s), right = isRight(s), sym = isSym(s);
    if (left || right) {
      const h = s.spanL / 3;
      const x1 = left ? alpha : beta - 4 * h;
      const x2 = left ? alpha + 4 * h : beta;
      const yLine = evalF(s, left ? alpha : beta);
      const L = x2 - x1;
      const area20 = (Math.abs(s.a) / 20) * Math.pow(L, 5);
      if (s.step >= 1) {
        regionLine(b, s, yLine, x1, x2, { fill: 'rose', alpha: 0.26, ref: 'S' });
        b.seg([x1 - 0.8, yLine], [x2 + 0.8, yLine], { color: 'rose', width: 2.5, glow: true, ref: 'tan' });
      }
      if (s.step >= 2) {
        b.seg([x1, yLine], [x2, yLine], { color: 'amber', width: 2, ref: 'S', dash: true });
        if (s.step >= 3) b.text([(x1 + x2) / 2, (yLine + evalF(s, left ? beta : alpha)) / 2], `S = |a|L⁵/20 ≈ ${num(area20)}`, { color: 'amber', size: 14, weight: 850, ref: 'S' });
        b.text([(x1 + x2) / 2, yLine], `L = ${num(L)}`, { color: 'amber', dy: -12, size: 12.5, ref: 'S' });
      }
    } else if (sym) {
      const yLine = evalF(s, alpha);
      const L = beta - alpha;
      const area30 = (Math.abs(s.a) / 30) * Math.pow(L, 5);
      if (s.step >= 1) {
        regionLine(b, s, yLine, alpha, beta, { fill: 'sky', alpha: 0.26, ref: 'S' });
        b.seg([alpha - 0.8, yLine], [beta + 0.8, yLine], { color: 'sky', width: 2.5, glow: true, ref: 'tan' });
      }
      if (s.step >= 2) {
        if (s.step >= 3) b.text([(alpha + beta) / 2, (yLine + evalF(s, (alpha + beta) / 2)) / 2], `S = |a|L⁵/30 ≈ ${num(area30)}`, { color: 'amber', size: 14, weight: 850, ref: 'S' });
        b.text([(alpha + beta) / 2, yLine], `L = β−α = ${num(L)}`, { color: 'amber', dy: -12, size: 12.5, ref: 'S' });
      }
    }
  }

  // 모드 4 (위 칠판): 두 극솟값 높이차 |f(α) - f(β)| = |S₁ - S₂|
  function drawSyncMain(b, s) {
    const { alpha, beta } = getRoots(s);
    const yA = evalF(s, alpha), yB = evalF(s, beta);
    if (s.step >= 2) {
      const xr = beta + 0.55;
      b.seg([alpha - 0.5, yA], [xr, yA], { color: 'rose', alpha: 0.7, width: 1.8, dash: true, ref: 'dy' });
      b.seg([alpha - 0.5, yB], [xr, yB], { color: 'sky', alpha: 0.7, width: 1.8, dash: true, ref: 'dy' });
      b.seg([xr, yA], [xr, yB], { color: 'amber', width: 3, ref: 'dy' });
      barLabel(b, xr, (yA + yB) / 2, s.step >= 3 ? `|f(α)−f(β)| ≈ ${num(Math.abs(yA - yB))}` : '|f(α)−f(β)|', 'amber', 'dy');
    }
  }

  // 모드 5: 절댓값 접어 올린 함수 |f(x) - k| 와 미분불가능 첨점 스캐너
  function drawFold(b, s) {
    const k = s.kLine;
    const vb = b.viewBox();
    // Step 1: 기준 수평선 y = k
    if (s.step >= 1 || s.playing) {
      b.hline(k, { color: 'violet', width: 2.4, dash: true, glow: true, ref: 'fold' });
    }
    // Step 2: 접어 올린 그래프 y = |f(x) - k| + k (보라색 네온 실선)
    if (s.step >= 2) {
      b.plot((x) => k + Math.abs(evalF(s, x) - k), { color: 'violet', width: 3.4, glow: true, ref: 'fold' });
      const r = b.paneRect();
      b.stext(r.x + 12, r.y + 20, '보라: g(x)+k = |f(x)−k|+k', { color: 'violet', size: 11.5, align: 'left' });
    }
    // Step 3: f(x) = k 의 교점 탐색 및 미분가능(기울기 0) vs 첨점(기울기 ≠ 0) 판별
    if (s.step >= 3) {
      const crossings = findCrossings(s, k, vb.x0 - 0.3, vb.x1 + 0.3);
      crossings.forEach((rx) => {
        const smooth = stationaryCrossing(s, rx, k);
        b.point([rx, k], { color: smooth ? 'green' : 'red', r: 6.5, ref: 'fold' });
        cxTag(b, [rx, k], `${smooth ? '미분가능' : '꺾임'} x≈${num(rx, 3)}`, { color: smooth ? 'green' : 'red', dx: smooth ? -10 : 10, dy: smooth ? 24 : -15, align: smooth ? 'right' : 'left', size: 11.5, ref: 'fold' });
      });
    }
    // 끌 수 있는 기준선 손잡이: 곡선 위에 그립니다
    return () => {
      b.handle('k', [kHandleX(b), k], { color: 'violet', ref: 'fold', priority: 2, label: `기준선 y = k (${num(k)})`, dx: -14, dy: -16, align: 'right',
        drag: (w) => { s.kLine = clamp(+w.y.toFixed(2), -6.0, 4.0); } });
    };
  }

  function drawFor(m) {
    return (b, s) => {
      autoView(b, s, m);
      mainBg(b, s);
      let after = null;
      if (m === 1) drawTriple(b, s);
      else if (m === 2) drawSym(b, s);
      else if (m === 3) drawArea(b, s);
      else if (m === 4) drawSyncMain(b, s);
      else after = drawFold(b, s);
      curve(b, s);
      overlay(b, s);
      if (after) after();
      done(b);
      derivPane(b, s, m);
    };
  }


  /* ==========================================================================
     「새 문제」 변형 문제 공용 부품 (2026-11 옛 장면 살리기)
     - 탐구 탭은 예전 그대로(끌기·슬라이더)입니다. 정리 탭은 변형 문제의 풀이를 단계마다 그림에 드러내고,
       문제 탭은 지문에 주어진 값만 그립니다(답과 보조선은 풀이 단계를 누른 뒤에만 나옵니다).
     - 첫 문제는 예전 문제 그대로이고, 「새 문제」는 같은 학습 포인트(같은 비율·같은 성질)가 성립하는
       함수족 안에서 숫자만 바꾼 변형을 만듭니다(연속해서 같은 문제가 나오지 않게 함).
     ========================================================================== */
  const cxRint = (n) => Math.floor(Math.random() * n);
  const cxPick = (arr, not) => { let x; do x = arr[cxRint(arr.length)]; while (arr.length > 1 && x === not); return x; };
  let cxSerial = 0;
  function cxVarier(gen) { let cur = gen(null); cur.sid = ++cxSerial; return { cur: () => cur, next: () => { cur = gen(cur); cur.sid = ++cxSerial; return cur; } }; }
  const cxProb = (body) => `${body}<div style="margin-top:10px"><button type="button" class="apl-btn sm" data-cx-new>새 문제</button></div>`;
  document.addEventListener('click', (ev) => {
    const hit = ev.target && ev.target.closest && ev.target.closest('[data-cx-new]');
    if (!hit) return;
    const lab = window.lab, sc = lab && lab.scene;
    if (!sc || !sc.vary) return;
    sc.vary.next();
    lab.s.revealed = false;
    lab.setStep(0);
    try { lab._buildReview(); } catch (e) { /* 키트가 바뀌어도 그림은 그대로 */ }
    lab.invalidate(true);
  });
  // 지금 탭이 탐구가 아니면(정리·문제) 변형 문제의 그림을 그립니다.
  const cxVarTab = () => { const l = window.lab; return !!l && l.tab !== 'explore'; };
  // 정리 탭에서만 단계가 그림에 드러나고, 문제 탭은 늘 0단계(풀이 전)입니다.
  const cxStep = (lab, s) => (lab && lab.tab === 'review' ? s.step : 0);
  // 변형 문제의 보이는 범위를 한 번만 맞춥니다. 사용자가 확대·이동한 뒤에는 건드리지 않습니다.
  function cxFocus(b, key, box) {
    if (b._cxKey === key) return;
    b._cxKey = key;
    b.setFocus(box, true);
  }
  // 탐구 탭으로 돌아오면 예전 보기 범위를 다시 잡습니다(변형 문제에서 바꾼 범위를 지움).
  function cxBackToExplore(b, s, lab) {
    if (b._cxKey === 'EXP') return;
    b._cxKey = 'EXP';
    b.__focusKey = null;
    const f = lab && lab.scene && lab.scene.focus;
    const box = typeof f === 'function' ? f(s) : f;
    if (box) b.setFocus(box, true);
  }
  // 점들이 모두 들어오는 창(여백 포함)
  function cxWin(pts, o = {}) {
    let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
    pts.forEach((p) => { x0 = Math.min(x0, p[0]); x1 = Math.max(x1, p[0]); y0 = Math.min(y0, p[1]); y1 = Math.max(y1, p[1]); });
    const mx = o.mx == null ? 0.9 : o.mx, my = o.my == null ? 0.9 : o.my;
    x0 -= mx; x1 += mx; y0 -= my; y1 += my;
    const minW = o.minW || 6, minH = o.minH || 4.4;
    if (x1 - x0 < minW) { const c = (x0 + x1) / 2; x0 = c - minW / 2; x1 = c + minW / 2; }
    if (y1 - y0 < minH) { const c = (y0 + y1) / 2; y0 = c - minH / 2; y1 = c + minH / 2; }
    return { x: [x0, x1], y: [y0, y1] };
  }
  const cxGcd = (a, c) => (c ? cxGcd(c, a % c) : Math.abs(a));
  // 수를 기약분수 {n, d}로 (분모 120 이하의 유리수)
  function cxRatOf(x) {
    for (let d = 1; d <= 120; d++) { const n = Math.round(x * d); if (Math.abs(x * d - n) < 1e-9) { const g = cxGcd(n, d) || 1; return { n: n / g, d: d / g }; } }
    return null;
  }
  // 수의 TeX (쌓은 분수). 부호 포함.
  function cxNum(x) {
    const r = cxRatOf(x);
    if (!r) return String(+x.toFixed(4));
    return r.d === 1 ? String(r.n) : (r.n < 0 ? '-' : '') + `\\dfrac{${Math.abs(r.n)}}{${r.d}}`;
  }
  const cxFrac = (n, d) => { const k = cxGcd(n, d) || 1; n /= k; d /= k; if (d < 0) { n = -n; d = -d; } return { tex: d === 1 ? String(n) : (n < 0 ? '-' : '') + `\\dfrac{${Math.abs(n)}}{${d}}`, val: n / d }; };
  // 다항식 TeX: 계수 배열(높은 차수부터, 유리수) 예: [1, -3, 0, 2] → x^3-3x^2+2, [0.25, 0, -3, 0] → \dfrac{1}{4}x^3-3x
  function cxPoly(co) {
    const n = co.length;
    let out = '';
    co.forEach((c, i) => {
      if (Math.abs(c) < 1e-12) return;
      const deg = n - 1 - i, a = Math.abs(c);
      const t = deg === 0 ? '' : deg === 1 ? 'x' : `x^${deg}`;
      const body = t ? (Math.abs(a - 1) < 1e-12 ? t : cxNum(a) + t) : cxNum(a);
      out += (c < 0 ? '-' : out ? '+' : '') + body;
    });
    return out || '0';
  }
  const cxPl = (n) => (n >= 0 ? `+${n}` : `-${-n}`); // 부호 있는 항
  const cxSub = (n) => (n === 0 ? '' : n > 0 ? `-${n}` : `+${-n}`); // x − n
  // (x − n) 꼴: n=0 이면 x
  const cxXm = (n) => (n === 0 ? 'x' : `(x${cxSub(n)})`);
  // 그림 라벨용 짧은 수: 0.00 → 0, 2.40 → 2.4, 음수는 유니코드 마이너스
  const cxN = (v, d = 2) => { const r = +v.toFixed(d); return String(Object.is(r, -0) ? 0 : r).replace('-', '−'); };
  // 곡선 이름표: 보이는 범위 안에서 곡선이 지나는 곳(오른쪽부터)에 붙입니다.
  function cxCurveTag(b, f, text, color, o = {}) {
    const vb = b.viewBox();
    const yl = vb.y0 + (vb.y1 - vb.y0) * 0.1, yh = vb.y1 - (vb.y1 - vb.y0) * 0.1;
    const right = o.side !== 'left';
    for (let i = 0; i <= 90; i++) {
      const x = right ? vb.x1 - (vb.x1 - vb.x0) * 0.06 - i * (vb.x1 - vb.x0) * 0.008 : vb.x0 + (vb.x1 - vb.x0) * 0.06 + i * (vb.x1 - vb.x0) * 0.008;
      const y = f(x);
      const clash = (o.skip || []).some((q) => Math.hypot(x - q[0], y - q[1]) < (q[2] || 1.2));
      const nearY = Math.abs(x) < (vb.x1 - vb.x0) * 0.1; // y축 눈금 숫자와 겹치지 않게
      if (Number.isFinite(y) && y > yl && y < yh && !clash && !nearY && !(o.ymin != null && y < o.ymin) && !(o.axis && Math.abs(y) < o.axis)) {
        b.text([x, y], text, { color, size: 13, weight: 800, align: right ? 'right' : 'left', dx: right ? -8 : 8, dy: o.dy == null ? -12 : o.dy, ref: o.ref });

    }
  }
  // 글자 라벨(가장자리에서 잘리지 않게 화면 안으로 밀어 넣음)
  function cxTag(b, p, str, o = {}) {
    const c = b.ctx;
    const size = (o.size || 12.5) * b.fs;
    c.save();
    c.font = `800 ${size}px ${b.font}`;
    const w = c.measureText(String(str)).width;
    c.restore();
    const s = b.toS(Array.isArray(p) ? { x: p[0], y: p[1] } : p);
    const al = o.align || 'center';
    const want = s.x + (o.dx || 0) - (al === 'right' ? w : al === 'left' ? 0 : w / 2);
    const right = b.W - (b.panes ? 0 : b.insets.right) - 6;
    const left = Math.max(6, Math.min(want, Math.max(6, right - w)));
    b.text(p, str, { size: o.size || 12.5, weight: 800, ...o, align: 'left', dx: left - s.x, dy: o.dy || 0 });
  }
  // 곡선 f와 g 사이(f가 위) 영역 색칠: x0→x1
  function cxRegion(b, f, g, x0, x1, o) {
    const pts = [];
    const n = 80;
    for (let i = 0; i <= n; i++) { const x = x0 + ((x1 - x0) * i) / n; pts.push([x, f(x)]); }
    for (let i = n; i >= 0; i--) { const x = x0 + ((x1 - x0) * i) / n; pts.push([x, g(x)]); }
    b.poly(pts, { fill: o.fill, fillAlpha: o.alpha, color: null, ref: o.ref });
  }


  /* ---------- 6. 변형 문제 (2026-11): 문제·정리 탭 ----------
     같은 학습 포인트가 성립하는 사차함수족 안에서만 숫자를 바꿉니다.
       · 삼중근형  f(x) = a(x−α)³(x−q) + y0 , q−α = 4 (극소·극대점이 접점에서 3 : 1)   → 장면 1·3·5
       · 좌우 대칭형 f(x) = a((x−γ)² − h²)² + c0 (극대점의 접선이 γ ± √2h 에서 다시 만남)   → 장면 2·3
       · 도함수의 근 α<γ<β (정수)에서 S₁ − S₂ = f(β) − f(α) 의 부호                      → 장면 4 */
  const qvF = (v) => (x) => evalF(v.st, x);

  const qvTall = (w, r) => (w.y[1] - w.y[0]) > r * (w.x[1] - w.x[0]);
  const qvBase = (b, s, win, key) => {
    AUTO.win = null; // 탐구 탭으로 돌아오면 보기 창을 다시 맞춥니다

  /* ===== 삼중근형: 장면 1(3:1)과 장면 5(|f−k|)가 함께 씁니다 ===== */
  const QV_TRI = [1 / 4, 1 / 3, -1 / 4, -1 / 3];
  function mkTri(first, a, al, y0) {
    const st = { a, alpha: al, spanL: 3, lambda: 0, y0 }, v = { first, a, al, y0, st, q: al + 4, be: al + 3, up: a > 0 };
    v.f = qvF(v);

    v.win = cxWin([[al, y0], [al + 4, y0], [al + 3, v.yMin]], { mx: 1.5, my: 1.2, minH: 4.6 });
    return v;
  }
  const varT1 = cxVarier((prev) => {
    if (!prev) return mkTri(true, 1 / 4, 0, 2);
    let v;
    do { v = mkTri(false, cxPick(QV_TRI), cxPick([-2, -1, 0, 1]), cxPick([-2, -1, 1, 2, 3])); } while ((v.a === prev.a && v.al === prev.al && v.y0 === prev.y0) || qvTall(v.win, 1.9));
    return v;
  });
  const triTex = (v) => `${qvA(v.a)}${cxXm(v.al)}^3${cxXm(v.q)}${v.y0 === 0 ? '' : cxPl(v.y0)}`;
  const text1 = (v) => (v.first ? examData[1].question() : `사차함수 ${tex('f(x) = ' + triTex(v))} 의 그래프가 직선 ${tex('y = ' + v.y0)} 와 ${tex('x = ' + v.al)} 에서 삼중근으로 접하는 점을 ${tex(`A(${v.al}, ${v.y0})`)}, 다시 만나는 교점을 ${tex(`Q(${v.q}, ${v.y0})`)}라 하자. 함수 ${tex('f(x)')}가 ${v.up ? '극소' : '극대'}가 되는 점 ${tex('B')}의 ${tex('x')}좌표 ${tex('\\beta')}와 ${v.up ? '극솟값' : '극댓값'} ${tex('f(\\beta)')}를 구하시오.`);
  const ans1 = (v) => (v.first ? examData[1].answerBadge() : `${tex(`\\beta = ${v.be}`)}, ${v.up ? '극솟값' : '극댓값'} ${tex(`= ${cxNum(v.yMin)}`)}`);
  const std1 = (v) => {

    return {
      steps: `① 식을 미분하면 ${tex(`f'(x) = a(x-\\alpha)^2(4x-\\alpha-3q)=${fac}`)}<br/>
② ${tex(`f'(x)=0`)} 에서 ${tex(`x = ${v.al}`)} (중근), ${tex(`x = ${v.be}`)}<br/>

④ ${tex(`f(${v.be}) = ${qvA(v.a)}(${v.be - v.al})^3(${v.be - v.q})${v.y0 === 0 ? '' : cxPl(v.y0)} = ${cxNum(v.yMin)}`)} 입니다.`,

  const quick1 = (v) => {

  function draw1(b, s, lab) {

  /* ===== 좌우 대칭형: 장면 2(1:√2)와 장면 3(1/30 넓이)이 씁니다 ===== */
  const QV_SYM = [[1 / 4, 2], [1, 1], [2, 1], [1 / 2, 2], [1 / 8, 2], [1 / 9, 3]];
  function mkSym(first, a, h, g, c0) {
    const st = { a, alpha: g - h, spanL: 2 * h, lambda: 0.5, y0: c0 }, v = { first, a, h, g, c0, st };
    v.f = qvF(v);

    v.yc = c0 + v.dy;                           // 극댓값

  const mkSymVar = (prev, fixedFirst) => {

  const rootsTx = (v) => `${v.g} \\pm ${v.h === 1 ? '' : v.h}\\sqrt{2}`;
  const ans2 = (v) => (v.first ? examData[2].answerBadge() : `교점 ${tex(rootsTx(v))}, 극값 차 ${tex(`\\Delta y = ${cxNum(v.dy)}`)}`);
  const std2 = (v) => {

    return {

② 대칭축 ${tex('x = ' + v.g)} 대입하여 극댓값과 극솟값의 차 계산:<br/>
&nbsp;&nbsp;${tex(`f(${v.g}) - f(${v.g - v.h}) = ${qvA(v.a)}(${v.h})^2(${-v.h})^2 = ${cxNum(v.dy)}`)}<br/>
③ ${tex(`u=x${cxSub(v.g)}`)}로 두면 극댓값 접선과의 교점 방정식은 ${tex(`${qvA(v.a)}(u^2-${v.h * v.h})^2=${cxNum(v.dy)}`)}이다. 이를 풀면 ${tex('u^2=0')} 또는 ${tex(`u^2=${2 * v.h * v.h}`)}이다. ${tex('u=0')}은 접점 ${tex(`x=${v.g}`)}을 다시 얻는 중근이므로 제외하고, 새로 만나는 두 점은 ${tex(`x=${rootsTx(v)}`)}이다.`,
      warning: examData[2].textbook().warning
    };
  };
  const quick2 = (v) => {
    if (v.first) return examData[2].shortcut();
    return {

② 좌우 대칭인 사차함수에서 극대점의 수평인 접선과 곡선이 다시 만나는 점은 극대점에서 <strong class="text-pink-300">${tex(`\\sqrt{2}h = ${v.h === 1 ? '' : v.h}\\sqrt{2}`)}</strong> 만큼 떨어져 있습니다. (${tex('u = x - \\gamma')} 라 하면 ${tex('f(x) - f(\\alpha) = a(u^2-h^2)^2')} 이고, 이 값이 극대점의 높이 ${tex('ah^4')} 와 같아지는 ${tex('u')}는 ${tex('u^2 = 2h^2')} 이기 때문입니다.)<br/>
&nbsp;&nbsp;따라서 두 교점은 <strong class="text-amber-300">${tex(rootsTx(v))}</strong> 입니다.<br/>
③ 극댓값과 극솟값의 높이 차는 <strong class="text-sky-300">${tex(`\\Delta y = |a|h^4 = ${cxNum(v.a)} \\times ${v.h}^4 = ${cxNum(v.dy)}`)}</strong> 입니다.`,
      highlight: examData[2].shortcut().highlight
    };
  };
  function draw2(b, s, lab) {

    qvBase(b, s, v.win, 'q2v' + v.sid);
    b.vline(g, { color: 'amber', alpha: 0.55, width: 1.8, dash: true, ref: 'axis' });
    if (st >= 1) b.seg([g - h - 1.2, c0], [g + h + 1.2, c0], { color: 'sky', width: 2.2, dash: true, ref: 'dy' });
    if (st >= 2) {
      b.poly([[g - v.r2, yc], [g + v.r2, yc], [g + v.r2, c0], [g - v.r2, c0]], { fill: 'rose', fillAlpha: 0.07, color: 'rose', alpha: 0.65, width: 1.8, ref: 'box' });

  /* ===== 장면 3 · 접선과 곡선으로 둘러싸인 넓이 (대칭형 1/30, 삼중근형 1/20) ===== */
  const varA3 = cxVarier((prev) => {
    if (!prev) return Object.assign(mkSym(true, 1 / 4, 2, 1, -2), { kind: 'sym' });
    for (let tr = 0; tr < 200; tr++) {
      const kind = cxPick(['sym', 'tri', 'sym'], prev.kind);
      const v = kind === 'sym' ? mkSym(false, ...cxPick(QV_SYM), cxPick([-1, 0, 1, 2]), cxPick([-2, -1, 0, 1, 2])) : mkTri(false, cxPick(QV_TRI), cxPick([-2, -1, 0, 1]), cxPick([-2, -1, 1, 2, 3]));
      v.kind = kind;
      if (qvTall(v.win, kind === 'sym' ? 1.4 : 1.9)) continue;
      if (prev.kind === kind && prev.a === v.a && (kind === 'sym' ? prev.h === v.h && prev.g === v.g : prev.al === v.al) && prev.c0 === v.c0) continue;

  });
  const area3 = (v) => (v.kind === 'sym' ? Math.abs(v.a) * Math.pow(2 * v.h, 5) / 30 : Math.abs(v.a) * Math.pow(4, 5) / 20);
  const text3 = (v) => {

② ${tex(`u=x${cxSub(v.g)}`)} 로 치환하면 ${tex(`f(x)${cxPl(-v.c0)}=${qvA(v.a)}(u^2-${v.h * v.h})^2`)} 이고 적분 구간은 ${tex(`[-${v.h}, ${v.h}]`)}<br/>

  /* ===== 장면 4 · 삼차 도함수의 두 넓이 S₁, S₂ 와 두 극솟값 ===== */
  // 정수 근 α<γ<β : f′(x) = (x−α)(x−γ)(x−β), f(γ)−f(α)=S₁, f(γ)−f(β)=S₂
  function mk4(first, al, ga, be, rel) {
    const L = be - al, st = { a: 1 / 4, alpha: al, spanL: L, lambda: (ga - al) / L, y0: 1 };
    const v = { first, al, ga, be, st, rel };
    v.f = qvF(v); v.fp = qvFp(v);
    v.s1 = v.f(ga) - v.f(al); v.s2 = v.f(ga) - v.f(be);
    v.cmp = Math.abs(v.s1 - v.s2) < 1e-9 ? 'eq' : v.s1 < v.s2 ? 'lt' : 'gt';  // S₁ 와 S₂ 의 크기
    const ys = [v.f(al), v.f(ga), v.f(be)];
    const dmin = Math.min(...Array.from({ length: 41 }, (_, i) => v.fp(al + (L * i) / 40)));
    const dmax = Math.max(...Array.from({ length: 41 }, (_, i) => v.fp(al + (L * i) / 40)));
    v.win = { x: [al - 1.6, be + 1.6], y: [Math.min(...ys) - 1.4, Math.max(...ys) + 1.4] };
    v.dwin = [dmin - 0.9, dmax + 0.9];
    return v;
  }
  const var4 = cxVarier((prev) => {

    for (let tr = 0; tr < 800; tr++) {
      const al = cxPick([-3, -2, -1, 0]), ga = al + cxPick([1, 2, 3]), be = ga + cxPick([1, 2, 3]);
      if (be - al > 6 || be > 4) continue;
      const v = mk4(false, al, ga, be);
      const want = cxPick(['lt', 'gt', 'lt', 'gt', 'eq'], prev.cmp);
      if (v.cmp !== want) continue;
      if ((v.win.y[1] - v.win.y[0]) + (v.dwin[1] - v.dwin[0]) > 2.4 * (v.win.x[1] - v.win.x[0])) continue;
      if (prev.al === al && prev.ga === ga && prev.be === be) continue;

    }
    return prev;
  });

  // 기본 장면의 분모 625, 1875도 보존합니다. 분수로 확인되지 않은 값은 근삿값임을 표시합니다.

  const std5 = (v) => {

    return {
      steps: `① ${tex('g(x) = |f(x) - k|')} 가 ${tex('f(x) = k')} 인 교점 ${tex('x = c')} 에서 미분가능하려면<br/>

    sourceInfo[sc.id]={first,initial,question:sc.problem.text().replace(/<div[^>]*>\s*<button[^>]*data-cx-new[\s\S]*$/,''),answer:sc.problem.answer(),steps:sc.steps(initial)};
  }
  const lessonSource=window.APL_QT_SOURCE={scenes:lessonScenes,first:id=>sourceInfo[id].first,initial:id=>({...sourceInfo[id].initial}),question:id=>sourceInfo[id].question,answer:id=>sourceInfo[id].answer,steps:id=>sourceInfo[id].steps.slice(),math:{evalF,evalFp,getRoots,getDerivativeAreas,findCrossings,stationaryCrossing,isLeft,isRight,isSym,area3}};
  function lqtMathKey(value) {
    return String(value||'').normalize('NFKC').replace(/\\(?:left|right|,|!|;|quad|qquad)/g,'')
      .replace(/\\(?:dfrac|frac)\{([^{}]*)\}\{([^{}]*)\}/g,'($1)/($2)')
      .replace(/\\sqrt\{([^{}]*)\}/g,'√($1)').replace(/\\sqrt\s*(\w)/g,'√($1)')
      .replace(/\\(?:text|mathrm|mathbf|overline)\{([^{}]*)\}/g,'$1')
      .replace(/\\leq?/g,'≤').replace(/\\geq?/g,'≥').replace(/\\lt/g,'<').replace(/\\gt/g,'>')
      .replace(/\\cdot|\\times/g,'×').replace(/−|–/g,'-').replace(/[\s{}$^_()]/g,'');
  }
  function lqtLabel(value,s) {
    const text=String(value||''), key=lqtMathKey(text), known=(s.lqtKnownMath||[]).map(lqtMathKey);
    if (s.lqtShowAnswer) return text;
    if (key && known.some(math=>math.includes(key))) return text;
    const count=text.match(/^(\d+)개$/);
    if(count&&known.some(math=>math.endsWith('='+count[1])))return text;
    if (/^(?:[A-Z][′']*|[xy]|[αβ]|[xy][₁₂]|[PQRS]|f|g|y = x)$/.test(text)) return text;
    if (/^(?:y = f[(]x[)]|y = f′[(]x[)]|[αβhO]|[xX]_[TQI]|S_d = Δy|극값의 차 Δy)$/.test(text)) return text;
    if(/^(?:[ST][₀-₉]+|[?⋮])$/.test(text))return text;
    const named=text.match(/^([A-Z][′']*)(?=[\s(=:]|$)/);
    if (named) return named[1];
    return /^(?:점근선|대칭축|산술평균|기하평균|직각|넓이|교점)/.exec(text)?.[0]||'';
  }
  for (const sc of lessonScenes) {
    const original={question:sc.question,reviewTop:sc.reviewTop,steps:sc.steps,view:sc.view,draw:sc.draw,panes:sc.panes,tick:sc.tick};
    sc.question=(s,lab)=>lqtActive(s)?s.lqtQuestion||lessonSource.question(sc.id):typeof original.question==='function'?original.question(s,lab):original.question;
    sc.reviewTop=(s,lab)=>lqtActive(s)?'':typeof original.reviewTop==='function'?original.reviewTop(s,lab):original.reviewTop;
    sc.steps=(s,lab)=>lqtActive(s)?['조건 확인','핵심 관계','식 세우기','계산과 결론']:(typeof original.steps==='function'?original.steps(s,lab):original.steps);
    sc.view=(s,lab)=>lqtActive(s)?{}:original.view(s,lab);
    sc.panes=s=>lqtActive(s)?(s.lqtExplore?panesOf(lessonScenes.indexOf(sc)+1)(s):null):original.panes(s);
    sc.tick=(s,dt,lab)=>lqtActive(s)?false:original.tick(s,dt,lab);
    sc.draw=(b,s,v,lab)=>{
      if (!lqtActive(s)) {
        if (b._qtLessonView) {
          if (b.focus===b._qtLessonView.appliedFocus) Object.assign(b,b._qtLessonView.before);
          else { b._cxKey=null; }
          Object.assign(AUTO,b._qtLessonView.beforeAuto);
          delete b._qtLessonView;
        }
        return original.draw(b,s,v,lab);
      }
      if (!b._qtLessonView) b._qtLessonView={beforeAuto:{...AUTO},before:{focus:b.focus,zoom:b.zoom,panX:b.panX,panY:b.panY,_cxKey:b._cxKey,__focusKey:b.__focusKey,aspect:b.aspect}};
      const shown={...s,...(s.lessonEntry&&s.lqtInitial?JSON.parse(JSON.stringify(s.lqtInitial)):{}),playing:false,lqtKnownMath:s.lessonEntry?[]:s.lqtKnownMath,lqtShowAnswer:!s.lessonEntry&&!!s.lqtShowAnswer,step:s.lessonEntry?0:Math.max(0,Math.min(s.step||0,s.lqtShowAnswer?4:2))};
      const shownLab=Object.create(lab);shownLab.tab=shown.lqtExplore?'explore':'review';shownLab.s=shown;
      if(shown.lqtStage>=0)shown.step=Math.max(0,Math.round(shown.lqtStage));
      if(s.lessonEntry)shown.step=0;
      const key=sc.id+'|'+!!shown.lqtExplore;
      if(shown.lqtExplore){AUTO.win=null;AUTO.panes=null;AUTO.m=0;}
      if (b._qtLessonView.key!==key) { b._cxKey=null;b.__focusKey=null;b._qtLessonView.key=key;b.zoom=1;b.panX=0;b.panY=0; }
      const plot=b.plot,text=b._text,axes=b.axes,path=b.path,point=b.point,roundRect=b.ctx.roundRect,curves=[],paths=[],points=[],rects=[];
      let axesDrawing=false;
      b.axes=function(...args){axesDrawing=true;try{return axes.apply(this,args);}finally{axesDrawing=false;}};
      b.path=function(ps,options={}){if(!axesDrawing&&!this._bbox&&(options.width||0)>=1.8)paths.push(ps);return path.call(this,ps,options);};
      b.point=function(p,options={}){if(!axesDrawing&&!this._bbox)points.push(p);return point.call(this,p,options);};
      b.ctx.roundRect=function(x,y,w,h,r){if(!axesDrawing&&!b._bbox)rects.push([x,y,w,h]);return roundRect.call(this,x,y,w,h,r);};
      b.plot=function(fn,options={}) {
        if (!this._bbox && (options.width||2.6)>=1.8) curves.push({fn,options,pane:this.paneId});
        return plot.call(this,fn,options);
      };
      b._text=function(x,y,label,options,screen) {return text.call(this,x,y,this._bbox||axesDrawing?label:lqtLabel(label,shown),options,screen);};
      try {original.draw(b,shown,{},shownLab);} finally {b.plot=plot;b._text=text;b.axes=axes;b.path=path;b.point=point;b.ctx.roundRect=roundRect;}
      b._qtLessonView.appliedFocus=b.focus;
      // Trace a point on the native plotted function, within the actual viewport.
      const u=clamp(Number(shown.lqtTrace)||0,0,1);
      let traced=false;
      if (!s.lessonEntry && u && !b._bbox) for (const {fn,options,pane} of curves) {
        if(b.panes)b.use(pane||'main');
        const box=b.viewBox(),lo=Math.max(box.x0,options.from??-Infinity),hi=Math.min(box.x1,options.to??Infinity),xs=[];
        for (let i=0;i<=120;i++) {const x=lo+(hi-lo)*i/120,y=fn(x);if(Number.isFinite(y)&&y>box.y0&&y<box.y1)xs.push(x);}
        if(xs.length>1){const x=xs[0]+(xs.at(-1)-xs[0])*u,y=fn(x);if(Number.isFinite(y)&&y>box.y0&&y<box.y1){b.point([x,y],{color:'violet',r:5,glow:false});traced=true;}break;}
      }
      const xy=p=>[p.x??p[0],p.y??p[1]];
      if(!s.lessonEntry&&u&&!traced&&!b._bbox){
        const segment=paths.find(ps=>ps.length>=2);
        if(segment){const z=Math.min(segment.length-2,Math.floor(u*(segment.length-1))),t=u*(segment.length-1)-z,p=xy(segment[z]),q=xy(segment[z+1]);b.point([p[0]+(q[0]-p[0])*t,p[1]+(q[1]-p[1])*t],{color:'violet',r:5,glow:false});}
        else if(points.length){b.point(xy(points[Math.min(points.length-1,Math.floor(u*points.length))]),{color:'violet',r:5,glow:false});}
        else if(rects.length){const [x,y,w,h]=rects[0],q=b.toW(x+u*w,y);b.point([q.x,q.y],{color:'violet',r:5,glow:false});}
      }
    };
  }
  const lessons=window.APL_QT_LESSONS?window.APL_QT_LESSONS.install(lessonScenes,lessonSource):{};


  /* ---------- 7. 실험실 등록 ---------- */
  APLab.createLab({
    id: 'calc1-quartic',
    stagedReveal: true,
    title: '사차함수 비율관계',
    courseName: '미적분Ⅰ',
    unit: '미분 · 사차함수 비율관계',
    courseColor: 'var(--m-orange)',
    home: '../index.html#calc1',
    legacy: '../../labs/미적분1/사차함수 비율관계.html',
    board: { kind: 'cartesian', focus: focusFor(VIEW[1], false) },
    params: lessonParams,
    state: { dual: false, animDir: 1 },
    persist: ['dual'],
    lessons,
    scenes
  });
});
