<script>
/* ==========================================================================

   원본: labs/미적분1/사차함수 비율관계.html
   - 문제·단계·정석/빠른 풀이 문구(examData)는 원본을 그대로 옮겼습니다.
   - 수학 함수(사차함수 f, 삼차 도함수, 세 극점 α·γ·β, 도함수 넓이 S₁·S₂, 식 표시 생성기)는
     원본과 같은 식입니다. 원본이 전역 state를 읽던 것을 상태 s를 첫 인자로 받도록만 바꿨습니다.
   - 바뀐 점: 셸·레이아웃은 공용 키트가 담당, 무대는 1:1 축척, 점은 직접 끌 수 있는 손잡이
     (극소 A·B, 가운데 극대 C 또는 도함수의 영점 γ, 수평선 y=k), 의미색으로 색 통일.
   ========================================================================== */
window.addEventListener('DOMContentLoaded', function () {
  const { tex, fmt, clamp } = APLab;
  const NARROW = window.matchMedia('(max-width: 859px)'); // 셸의 모바일 기준과 같은 값

  /* ---------- 1. 사차함수와 삼차 도함수 ----------
     도함수: f'(x) = 4a (x - α)(x - γ)(x - β),  u = x - α, L = β - α, c = γ - α = λ·L (0 ≤ λ ≤ 1)
     사차함수: f(x) = a [ u⁴ - 4/3·(L + c)u³ + 2cL·u² ] + y0   */
  function getRoots(s) {
    const alpha = s.alpha;
    const beta = alpha + s.spanL;
    const gamma = alpha + s.lambda * s.spanL;
    return { alpha, gamma, beta };
  }

  function evalF(s, x) {
    const u = x - s.alpha;
    const L = s.spanL;
    const c = s.lambda * L;
    return s.a * (Math.pow(u, 4) - (4 / 3) * (L + c) * Math.pow(u, 3) + 2 * c * L * u * u) + s.y0;
  }

  function evalFp(s, x) {
    const { alpha, gamma, beta } = getRoots(s);
    return 4 * s.a * (x - alpha) * (x - gamma) * (x - beta);
  }

  // 도함수의 두 영역 넓이 S1 = ∫_α^γ |f'(x)|dx, S2 = ∫_γ^β |f'(x)|dx
  function getDerivativeAreas(s) {
    const { alpha, gamma, beta } = getRoots(s);
    const s1 = Math.abs(evalF(s, gamma) - evalF(s, alpha));
    const s2 = Math.abs(evalF(s, beta) - evalF(s, gamma));
    return { s1, s2 };
  }

  // 수식 표시용 LaTeX 생성기
  function getFormulaLatex(s) {
    const { alpha, gamma, beta } = getRoots(s);
    const aStr = Number.isInteger(+(s.a * 4).toFixed(2)) && s.a === 0.25 ? '\\dfrac{1}{4}' : s.a.toFixed(2);
    const fpA = Number.isInteger(+(4 * s.a).toFixed(2)) ? (4 * s.a).toFixed(0) : (4 * s.a).toFixed(2);
    const fpPrefix = Math.abs(4 * s.a - 1) < 1e-5 ? '' : fpA;

    const fmtFactor = (r) => {
      if (Math.abs(r) < 1e-4) return 'x';
      const sign = r > 0 ? '-' : '+';
      const v = Math.abs(r);
      const vStr = Number.isInteger(+v.toFixed(2)) ? v.toFixed(0) : v.toFixed(2);
      return `(x ${sign} ${vStr})`;
    };

    // 삼중근 여부 확인
    if (s.lambda < 0.01) {
      const q = alpha + (4 / 3) * s.spanL;
      const y0Str = s.y0 === 0 ? '' : (s.y0 > 0 ? ` + ${s.y0.toFixed(1)}` : ` - ${Math.abs(s.y0).toFixed(1)}`);
      return {
        fLatex: `f(x) = ${aStr}${fmtFactor(alpha)}^3${fmtFactor(q)}${y0Str}`,
        fpLatex: `f'(x) = ${fpPrefix}${fmtFactor(alpha)}^2${fmtFactor(beta)}`
      };
    } else if (s.lambda > 0.99) {
      const q = beta - (4 / 3) * s.spanL;
      const yBeta = evalF(s, beta);
      const yBStr = Math.abs(yBeta) < 0.01 ? '' : (yBeta > 0 ? ` + ${yBeta.toFixed(1)}` : ` - ${Math.abs(yBeta).toFixed(1)}`);
      return {
        fLatex: `f(x) = ${aStr}${fmtFactor(q)}${fmtFactor(beta)}^3${yBStr}`,
        fpLatex: `f'(x) = ${fpPrefix}${fmtFactor(alpha)}${fmtFactor(beta)}^2`
      };
    } else {
      return {
        fLatex: `y = f(x) \\; (\\alpha=${alpha.toFixed(1)}, \\gamma=${gamma.toFixed(1)}, \\beta=${beta.toFixed(1)})`,
        fpLatex: `f'(x) = ${fpPrefix}${fmtFactor(alpha)}${fmtFactor(gamma)}${fmtFactor(beta)}`
      };
    }
  }

  /* ---------- 2. 문제·풀이 데이터 (원본 examData 그대로) ---------- */
    const examData = {

        tag: "수능·평가원 22번 최빈출 1순위 킬러 비율",

  /* ---------- 3. 보기 창 (원본 VIEW: 모드별로 꼭 보여야 할 세계 범위, 무대는 항상 1:1) ---------- */

  /* ---------- 3-1. 자동 보기: 실제 극값 위치에 맞춰 보기 창을 다시 맞춥니다 ----------
     원본의 고정 창은 문제 조건(기본값)에서만 W 전체가 들어옵니다. λ·L·a 를 바꾸거나 끌거나 자동 실험이 돌 때
     극소 B·극대 C 가 화면 밖으로 나가지 않도록, 그림에 꼭 들어와야 할 세계 범위(극점 α·γ·β, 모드별 교점)를 구해
     그 범위가 라벨 여백까지 들어오는 가장 큰 1:1 창을 잡습니다. 내용이 창을 벗어나거나(또는 너무 작아지면) 다시 맞추고,
     끌고 있는 동안에는 창이 움직이지 않습니다. */
  const AUTO = { m: 0, win: null, panes: null };
  function mainBox(s, m) {
    const { alpha, gamma, beta } = getRoots(s);
    const ys = [evalF(s, alpha), evalF(s, gamma), evalF(s, beta), 0];
    const bx = { x0: alpha, x1: beta, y0: Math.min(...ys), y1: Math.max(...ys) };
    const addX = (x) => { bx.x0 = Math.min(bx.x0, x); bx.x1 = Math.max(bx.x1, x); };
    if ((m === 1 || m === 3) && (isLeft(s) || isRight(s))) addX(isLeft(s) ? alpha + (4 / 3) * s.spanL : beta - (4 / 3) * s.spanL);
    if (m === 2 && isSym(s)) { addX(gamma - Math.SQRT2 * (s.spanL / 2)); addX(gamma + Math.SQRT2 * (s.spanL / 2)); }
    if (m === 5) { bx.y0 = Math.min(bx.y0, -6); bx.y1 = Math.max(bx.y1, 4); } // 기준선 k 를 끌 수 있는 범위
    return bx;
  }
  // 도함수가 두 극솟점 사이에서 오가는 값의 범위 (0 포함)
  function derivBox(s) {
    const { alpha, beta } = getRoots(s);
    let lo = 0, hi = 0;
    for (let i = 0; i <= 80; i++) {
      const v = evalFp(s, alpha + ((beta - alpha) * i) / 80);
      lo = Math.min(lo, v);
      hi = Math.max(hi, v);
    }
    return { y0: lo, y1: hi };
  }
  function computeFit(b, s, m) {
    const a = b._area();
    const pad = b.pad * Math.min(a.w, a.h);
    const ex = s.playing ? 0.2 : 0; // 자동 실험 중에는 넉넉히 잡아 창이 자주 바뀌지 않게
    const nb = mainBox(s, m);
    const bw = Math.max(nb.x1 - nb.x0, 0.8) * (1 + ex);
    const bh = Math.max(nb.y1 - nb.y0, 0.8) * (1 + ex);
    const cx = (nb.x0 + nb.x1) / 2, cy = (nb.y0 + nb.y1) / 2;
    const mx = 40;
    if (!s.dual) {
      const mt = 52, mb = 44;
      const k = Math.max(1e-3, Math.min((a.w - 2 * mx) / bw, (a.h - mt - mb) / bh));
      const cyw = cy + (mt - mb) / (2 * k);
      const fw = (a.w - 2 * pad) / k, fh = (a.h - 2 * pad) / k;
      return { nb, db: null, k, panes: null, focus: { x: [cx - fw / 2, cx + fw / 2], y: [cyw - fh / 2, cyw + fh / 2] } };
    }

    const db = derivBox(s);
    const dh = Math.max(db.y1 - db.y0, 0.8) * (1 + ex);
    const mt = (b.insets.top || 0) + 24, mb = 30; // 위 칠판은 위쪽 식 칩 아래부터
    const mtd = 34, mbd = 30 + (b.insets.bottom || 0); // 아래 칠판은 이름표 아래부터, 휴대폰에서는 아래 상태 배지·도구 위까지
    const A = a.h;
    let f = (A / dh + (mt + mb) / bh - (mtd + mbd) / dh) / (A * (1 / bh + 1 / dh));
    f = clamp(f, 0.36, 0.7);
    const k = Math.max(1e-3, Math.min((a.w - 2 * mx) / bw, (f * A - mt - mb) / bh, ((1 - f) * A - mtd - mbd) / dh));
    const cyw = cy + (mt - mb) / (2 * k);
    const cyd = (db.y0 + db.y1) / 2 + (mtd - mbd) / (2 * k);
    const fw = (a.w - 2 * pad) / k, fh = (f * A - 2 * pad) / k;
    return {
      nb, db, k,
      panes: [{ id: 'main', frac: f, focusY: [cyw - 0.5, cyw + 0.5] }, { id: 'deriv', frac: 1 - f, focusY: [cyd - 0.5, cyd + 0.5] }],
      focus: { x: [cx - fw / 2, cx + fw / 2], y: [cyw - fh / 2, cyw + fh / 2] }
    };
  }

    { group: '4대 개형 프리셋', label: '② 대칭 W형 1:√2 (λ=0.5)', color: 'sky', set: shape(-1, 4, 0.5, -2), on: (s) => isSym(s) },
    { group: '4대 개형 프리셋', label: '③ 비대칭 W형 (λ=0.3)', color: 'rose', set: shape(-1, 4, 0.3, 1), on: (s) => !isLeft(s) && !isRight(s) && !isSym(s) },
    { group: '4대 개형 프리셋', label: '④ 우측 삼중근 1:3형 (λ=1)', color: 'green', set: shape(0, 3, 1, -4.75), on: (s) => isRight(s) }
  ];
  // 우측 가장자리(도구 막대 왼쪽)에 놓는 y=k 손잡이의 x좌표
  const kHandleX = (b) => b.toW(b.W - (b.panes ? 0 : b.insets.right) - 44, 0).x;
  // 막대 옆 라벨: 오른쪽에 놓되 무대 밖으로 나가면 막대 왼쪽에 놓습니다.
  function barLabel(b, x, y, str, color, ref) {
    const c = b.ctx;
    c.save();
    c.font = `800 ${12.5 * b.fs}px ${b.font}`;
    const w = c.measureText(str).width;
    c.restore();
    const right = b.toS(x, y).x + 8 + w > b.W - (b.panes ? 0 : b.insets.right) - 6;
    b.text([x, y], str, { color, dx: right ? -8 : 8, align: right ? 'right' : 'left', baseline: 'middle', size: 12.5, ref });
  }
  // 세계 좌표 x에서 화면 px만큼 오른쪽으로 떨어진 세계 x (막대·괄호를 곡선과 띄울 때)
  const offX = (b, x, px) => b.toW(b.toS(x, 0).x + px, 0).x;

  // |f(x) - k| 의 교점 탐색. 원본은 |f-k|<0.015 인 구간을 '교점'으로 훑어 삼중근 근처(예: k=2에서 x≈-0.2)를
  // 엉뚱한 곳에서 잡아 첨점으로 잘못 판정했습니다. 여기서는 ① 부호가 바뀌는 단순근(이분법)과
  // ② 도함수가 0인 점 α·γ·β 중 f=k 가 되는 점(중근·삼중근, 기울기 0)을 정확히 찾습니다.
  function findCrossings(s, k, minX, maxX) {
    const crossings = [];
    const add = (rootX) => { if (!crossings.some((r) => Math.abs(r - rootX) < 0.12)) crossings.push(rootX); };
    let prevX = minX;
    let prevDiff = evalF(s, prevX) - k;
    for (let x = minX + 0.02; x <= maxX; x += 0.02) {
      const currDiff = evalF(s, x) - k;
      if (prevDiff * currDiff < 0) {
        // 이분법 정밀 탐색
        let lo = prevX;
        let hi = x;
        for (let iter = 0; iter < 12; iter++) {
          const mid = (lo + hi) / 2;
          if ((evalF(s, lo) - k) * (evalF(s, mid) - k) <= 0) hi = mid;
          else lo = mid;
        }
        add((lo + hi) / 2);
      }
      prevX = x;
      prevDiff = currDiff;
    }
    const { alpha, gamma, beta } = getRoots(s);
    [alpha, gamma, beta].forEach((c) => { if (c >= minX && c <= maxX && Math.abs(evalF(s, c) - k) < 0.02) add(c); });
    return crossings.sort((p, q) => p - q);
  }

  // 실시간 값·상태·경고·하단 판서 (원본 updateLiveMonitor + renderBottomChalkBanner)
  function viewFor(m) {
    return (s) => {
      const { alpha, gamma, beta } = getRoots(s);
      const { s1, s2 } = getDerivativeAreas(s);
      const f = getFormulaLatex(s);
      const left = isLeft(s), right = isRight(s), sym = isSym(s);
      const lam = fmt(s.lambda);
      // 모드별 특수 성립 조건 판별
      let status, alert = null;
      if (m === 1 && !left && !right) {
        status = { tone: 'warn', text: `λ = ${lam} (삼중근 아님 · 3:1 비활성)` };
        alert = { tone: 'bad', text: "현재 도함수 f′(x)=0이 중근을 갖지 않으므로(λ ≠ 0, 1) 3:1 비율 박스가 비활성화되었습니다!" };
      } else if (m === 2 && !sym) {
        status = { tone: 'warn', text: `λ = ${lam} ≠ 0.5 (비대칭 · 1:√2 비활성)` };
        alert = { tone: 'bad', text: '현재 비대칭 사차함수(λ ≠ 0.5)이므로 수평 극대 접선의 1:√2 대칭 비율이 비활성화되었습니다!' };
      } else {
        status = { tone: 'ok', text: left || right ? '삼중근 개형 (3 : 1 비율 & 1/20 넓이 활성)' : sym ? '대칭 W형 개형 (1 : √2 비율 & 1/30 넓이 활성)' : "일반 비대칭 W형 (도함수 S₁ ≠ S₂ 비교 활성)" };
      }
      let v2, v4;
      if (left || right) {
        const q = left ? alpha + (4 / 3) * s.spanL : beta - (4 / 3) * s.spanL;
        v2 = `3 : 1 성립 (교점 q=${fmt(q)})`;
        v4 = `S = |a|/20·L⁵ = ${fmt((Math.abs(s.a) / 20) * Math.pow((4 / 3) * s.spanL, 5))}`;
      } else if (sym) {
        v2 = `1 : √2 성립 (√2h=${fmt(Math.sqrt(2) * (s.spanL / 2))})`;
        v4 = `S = |a|/30·L⁵ = ${fmt((Math.abs(s.a) / 30) * Math.pow(s.spanL, 5))}`;
      } else {
        v2 = `비대칭 W형 (λ=${lam})`;
        v4 = `극솟값 차 = ${fmt(Math.abs(s1 - s2))}`;
      }
      if (m === 5) {
        const cr = findCrossings(s, s.kLine, -7, 9);
        const cusp = cr.filter((rx) => Math.abs(evalFp(s, rx)) >= 0.15).length;
        v4 = `첨점(미분불가) ${cusp}개 · 미분가능 접점 ${cr.length - cusp}개`;
      }
      // 하단 판서(원본 renderBottomChalkBanner)
      let tape = null;
      if (s.step >= 3) {
        let title;
        if (m === 1) {
          const hv = s.spanL / 3;
          title = left || right
            ? `삼중근 3 : 1 비율 성립! (한 칸 h=${fmt(hv)} | 극솟값 깊이 Δy = 27|a|h⁴ = ${fmt(27 * Math.abs(s.a) * Math.pow(hv, 4))})`
            : `λ = ${lam} (도함수 중근 아님) → 3 : 1 비율 박스가 비활성화되었습니다!`;
        } else if (m === 2) {
          const hv = s.spanL / 2;
          title = sym
            ? `대칭 W형 1 : √2 성립! (h=${fmt(hv)}, √2h=${fmt(Math.sqrt(2) * hv)} | 극값차 Δy = |a|h⁴ = ${fmt(Math.abs(s.a) * Math.pow(hv, 4))})`
            : `λ = ${lam} ≠ 0.5 (비대칭 W형) → 수평 1 : √2 비율이 성립하지 않습니다!`;
        } else if (m === 3) {
          if (left || right) {
            title = `삼중근 변곡접선 넓이 $S=\\dfrac{|a|}{20}L^5=${fmt((Math.abs(s.a) / 20) * Math.pow((4 / 3) * s.spanL, 5))}$`;
          } else if (sym) {
            title = `이중접선 둘러싸인 넓이 $S=\\dfrac{|a|}{30}(\\beta-\\alpha)^5=${fmt((Math.abs(s.a) / 30) * Math.pow(s.spanL, 5))}$`;
          } else {
            title = `비대칭 W형(λ = ${lam})에서는 1/20, 1/30 공식이 성립하지 않습니다 (삼중근 λ = 0, 1 또는 대칭 λ = 0.5 에서 성립)`;
          }
        } else if (m === 4) {
          title = `도함수 넓이 S₁(${fmt(s1)}) vs S₂(${fmt(s2)})  ⇒  두 극솟값 차 f(α)-f(β) = ${fmt(evalF(s, alpha) - evalF(s, beta))}`;
        } else {
          title = `절댓값 함수 g(x) = |f(x) - k| : 삼중근 변곡점 높이 k = ${fmt(evalF(s, alpha), 1)} 일 때만 미분불가 첨점이 1개!`;
        }
        tape = { title };
      }
      return {
        // 좁은 화면에서는 일반(비대칭) 개형의 긴 식 두 개가 두 줄로 쌓여 그림을 가리므로 도함수 식(세 근이 모두 들어 있음)만 보입니다.
        chips: NARROW.matches && !left && !right ? [{ k: '도함수', tex: f.fpLatex, color: 'sky' }] : [{ k: '원함수', tex: f.fLatex, color: 'amber' }, { k: '도함수', tex: f.fpLatex, color: 'sky' }],
        status,
        alert,
        readouts: [
          { label: '도함수 세 실근 (α, γ, β)', value: `${fmt(alpha, 1)} : ${fmt(gamma)} : ${fmt(beta, 1)}`, color: 'amber', ref: 'roots', wide: true },
          { label: '특수 비율 (3:1 / 1:√2)', value: v2, color: 'rose', ref: 'box', wide: true },
          { label: '도함수 넓이 S₁ vs S₂', value: `S₁=${fmt(s1)} | S₂=${fmt(s2)}`, color: 'sky', ref: 'dy', wide: true },
          { label: m === 5 ? '첨점 개수' : '정적분 넓이 / 극솟값 차', value: v4, color: 'violet', ref: m === 5 ? 'fold' : 'S', wide: true }
        ],
        tape
      };
    };
  }

  /* ---------- 5. 그리기 ---------- */
  function mainBg(b, s) {
    b.use('main');
    b.ctx.save();
    if (b.panes) b.clip();
    if (s.grid) b.grid();
    b.axes();
  }
  const done = (b) => b.ctx.restore();
  const curve = (b, s) => b.plot((x) => evalF(s, x), { color: 'ink', width: 3.2, glow: true });
  // 곡선 f와 직선 y=yLine 사이 영역 색칠 (x0→x1)
  function regionLine(b, s, yLine, x0, x1, o) {
    const pts = [];
    const n = 80;
    for (let i = 0; i <= n; i++) { const x = x0 + ((x1 - x0) * i) / n; pts.push([x, evalF(s, x)]); }
    pts.push([x1, yLine], [x0, yLine]);
    b.poly(pts, { fill: o.fill, fillAlpha: o.alpha, stroke: false, ref: o.ref });
  }
  const drawLambda = (s, x) => {
    let raw = (x - s.alpha) / s.spanL;
    // 0, 0.5, 1 근처 자석 스냅(Magnetic Snap)
    if (Math.abs(raw) < 0.04) raw = 0;
    else if (Math.abs(raw - 0.5) < 0.04) raw = 0.5;
    else if (Math.abs(raw - 1.0) < 0.04) raw = 1.0;
    s.lambda = clamp(+raw.toFixed(2), 0, 1);
  };
  // 세 극점: 왼쪽 A(끌면 α 이동), 오른쪽 B(끌면 L 조절), 가운데 극대 C(끌면 λ 조절) — 모든 모드 공통 (원본 renderMainPointsOverlay)
  function overlay(b, s) {
    const { alpha, gamma, beta } = getRoots(s);
    const yA = evalF(s, alpha), yB = evalF(s, beta);
    const dragA = (w) => { s.alpha = clamp(+w.x.toFixed(2), -2.0, 1.5); };
    const dragB = (w) => { s.spanL = clamp(+(w.x - s.alpha).toFixed(2), 1.5, 4.0); };
    if (isLeft(s)) {
      b.handle('A', [alpha, yA], { color: 'amber', r: 7, ref: 'A', label: `변곡접점 A(${num(alpha)}, ${num(yA)})`, dx: -12, dy: -12, align: 'right', drag: dragA });
      b.handle('B', [beta, yB], { color: 'green', r: 7, ref: 'B', label: `극소 B(${num(beta)}, ${num(yB)})`, dx: 12, dy: 20, drag: dragB });
    } else if (isRight(s)) {
      b.handle('A', [alpha, yA], { color: 'green', r: 7, ref: 'A', label: `극소 A(${num(alpha)}, ${num(yA)})`, dx: -12, dy: 20, align: 'right', drag: dragA });
      b.handle('B', [beta, yB], { color: 'amber', r: 7, ref: 'B', label: `변곡접점 B(${num(beta)}, ${num(yB)})`, dx: 12, dy: -12, drag: dragB });
    } else {
      const yC = evalF(s, gamma);
      b.handle('A', [alpha, yA], { color: 'amber', ref: 'A', label: `극소 A(${num(alpha)}, ${num(yA)})`, dx: -12, dy: 20, align: 'right', drag: dragA });
      b.handle('C', [gamma, yC], { color: 'rose', r: 7.5, ref: 'C', priority: 2, label: `극대 C(${num(gamma)}, ${num(yC)})`, dx: 0, dy: -18, align: 'center', drag: (w) => drawLambda(s, w.x) });
      b.handle('B', [beta, yB], { color: 'green', ref: 'B', label: `극소 B(${num(beta)}, ${num(yB)})`, dx: 12, dy: 20, drag: dragB });
    }
  }
  // 아래 칠판: 삼차 도함수 y = f′(x) 와 두 영역 넓이 S₁ vs S₂ (원본 renderDerivativePane)
  function derivPane(b, s, m) {
    if (!s.dual) return;
    const { alpha, gamma, beta } = getRoots(s);
    const { s1, s2 } = getDerivativeAreas(s);
    b.use('deriv');
    const r = b.paneRect('deriv');
    const c = b.ctx;
    c.save();
    c.fillStyle = b.color('halo', 0.35);
    c.fillRect(r.x, r.y, r.w, r.h);
    c.restore();
    c.save();
    b.clip();
    if (s.grid) b.grid();
    b.axes({ yLabel: "y'" });
    // Step 2: S1(양수 영역) & S2(음수 영역) 색칠
    if (s.step >= 2) {
      const area = (x0, x1, col, label, val) => {
        if (Math.abs(x1 - x0) <= 0.02) return;
        const pts = [[x0, 0]];
        for (let i = 0; i <= 50; i++) { const x = x0 + ((x1 - x0) * i) / 50; pts.push([x, evalFp(s, x)]); }
        pts.push([x1, 0]);
        b.poly(pts, { fill: col, fillAlpha: 0.28, stroke: false, ref: 'dy' });
        // 영역이 글자를 담을 만큼 넓을 때만 그림 안에 표시합니다 (값은 아래 이름표에도 있습니다)
        if (Math.abs(x1 - x0) * b.k >= 80) {
          const mid = (x0 + x1) / 2;
          b.text([mid, evalFp(s, mid) * 0.5], `${label}=${num(val)}`, { color: col, size: 12.5, weight: 800, ref: 'dy' });
        }
      };
      area(alpha, gamma, 'rose', 'S₁', s1);
      area(gamma, beta, 'sky', 'S₂', s2);
    }
    // 삼차 도함수 본체 곡선
    b.plot((x) => evalFp(s, x), { color: 'sky', width: 2.8, glow: true });
    b.point([alpha, 0], { color: 'amber', r: 5, ref: 'roots', label: `α=${num(alpha)}`, dx: -10, dy: -12, align: 'right' });
    b.handle('Cd', [gamma, 0], { color: 'rose', ref: 'roots', priority: 1, label: `γ=${num(gamma)}`, dx: 0, dy: 20, align: 'center', drag: (w) => drawLambda(s, w.x) });
    b.point([beta, 0], { color: 'green', r: 5, ref: 'roots', label: `β=${num(beta)}`, dx: 10, dy: -12 });
    c.restore();
    // 나눔선 + 이름표
    c.save();
    c.strokeStyle = b.color('sky', 0.55);
    c.lineWidth = 1.5;
    c.beginPath();
    c.moveTo(r.x, r.y + 0.5);
    c.lineTo(r.x + r.w, r.y + 0.5);
    c.stroke();
    c.restore();
    const ttl = NARROW.matches ? '도함수 y = f′(x)' : '삼차 도함수 y = f′(x) · 넓이(S₁ vs S₂) 동기화';
    b.stext(r.x + 14, r.y + 20, ttl, { color: 'sky', size: 12.5, align: 'left', weight: 800 });
    if (s.step >= 2) {
      // S₁·S₂ 값을 이름표 옆에 색으로 구분해 적습니다
      c.save();
      c.font = `800 ${12.5 * b.fs}px ${b.font}`;
      let tx = r.x + 14 + c.measureText(ttl).width + 14;
      c.restore();
      b.stext(tx, r.y + 20, `S₁=${num(s1)}`, { color: 'rose', size: 12.5, align: 'left', weight: 800 });
      tx += 70 * b.fs;
      b.stext(tx, r.y + 20, `S₂=${num(s2)}`, { color: 'sky', size: 12.5, align: 'left', weight: 800 });
    }
    // 위·아래를 잇는 수직 동기화선 (원본 renderVerticalSyncLines)
    b.use('main');
    const r1 = b.paneRect('main');
    if (s.step >= 1) {
      const line = (x, col, al, w) => {
        const sx = b.toS(x, 0).x;
        c.save();
        c.setLineDash([5, 5]);
        c.strokeStyle = b.color(col, al);
        c.lineWidth = w;
        c.beginPath();
        c.moveTo(sx, r1.y + 6);
        c.lineTo(sx, r.y + r.h - 6);
        c.stroke();
        c.restore();
      };
      line(alpha, 'amber', 0.55, 1.6);
      line(gamma, 'rose', 0.6, 1.8);
      line(beta, 'green', 0.55, 1.6);
    }
  }

  // 모드 1: 삼중근 사차함수의 3 : 1 비율 격자 박스와 제2변곡점(2:1)
  function drawTriple(b, s) {
    const { alpha, beta } = getRoots(s);
    const left = isLeft(s), right = isRight(s);
    if (!left && !right) return; // 삼중근 조건이 깨지면 보조선 없이 곡선과 점만 보입니다
    const L = s.spanL;
    const h = L / 3; // 3:1 에서 한 칸 단위 h
    const xTriple = left ? alpha : beta;
    const xExtrema = left ? beta : alpha;
    const xCross = left ? alpha + 4 * h : beta - 4 * h;
    const xInf2 = left ? alpha + 2 * h : beta - 2 * h;
    const yTriple = evalF(s, xTriple);
    const yMin = evalF(s, xExtrema);
    const xLeft = Math.min(xTriple, xCross);
    const xRight = Math.max(xTriple, xCross);

    // Step 2: 3 : 1 비율 격자 박스
    if (s.step >= 2) {
      b.poly([[xLeft, yTriple], [xRight, yTriple], [xRight, yMin], [xLeft, yMin]], { fill: 'amber', fillAlpha: 0.07, color: 'amber', alpha: 0.8, width: 2, ref: 'box' });
      for (let i = 1; i <= 3; i++) b.seg([xLeft + i * h, yTriple], [xLeft + i * h, yMin], { color: 'amber', alpha: 0.5, width: 1.4, dash: true, ref: 'box' });
      // 상단 3 : 1 브래킷 라벨
      b.text([(xTriple + xExtrema) / 2, yTriple], '3', { color: 'amber', dy: -12, size: 15, weight: 850, ref: 'box' });
      b.text([(xExtrema + xCross) / 2, yTriple], '1', { color: 'sky', dy: -12, size: 15, weight: 850, ref: 'box' });
      b.text([(xLeft + xRight) / 2, yTriple], `한 칸 h = ${num(h)}`, { color: 'amber', dy: -32, size: 12.5, ref: 'box' });
    }
    // Step 1: 변곡접선 y = yTriple 및 교점 Q
    if (s.step >= 1) {
      b.seg([xLeft - 1.0, yTriple], [xRight + 1.0, yTriple], { color: 'rose', width: 2.4, dash: true, glow: true, ref: 'tan' });
      b.seg([xLeft - 1.0, yMin], [xRight + 1.0, yMin], { color: 'sky', width: 1.8, dash: true, ref: 'dy' });
      b.point([xCross, yTriple], { color: 'sky', r: 6, ref: 'box', label: `교점 Q(${num(xCross)}, ${num(yTriple)})`, dx: left ? 10 : -10, dy: -14, align: left ? 'left' : 'right' });
    }
    // Step 3: 제2변곡점 I₂(2:1 내분) 및 높이차 Δy = 27|a|h⁴
    if (s.step >= 3) {
      const yInf2 = evalF(s, xInf2);
      b.point([xInf2, yInf2], { color: 'violet', r: 5, ref: 'I2', label: `제2변곡점 I₂(${num(xInf2)}, ${num(yInf2)}) [2:1]`, dx: -12, dy: 22, align: 'right' });
      const xr = offX(b, xRight, 26);
      b.seg([xr, yTriple], [xr, yMin], { color: 'sky', width: 2.5, ref: 'dy' });
      barLabel(b, xr, (yTriple + yMin) / 2, `Δy = ${num(Math.abs(yTriple - yMin))}`, 'sky', 'dy');
    }
  }

  // 모드 2: 대칭 사차함수(W형)의 1 : √2 비율과 극댓값-극솟값 높이차
  function drawSym(b, s) {
    const { alpha, gamma, beta } = getRoots(s);
    const yA = evalF(s, alpha), yC = evalF(s, gamma), yB = evalF(s, beta);
    // Step 1: 대칭축 x = γ 및 두 극소점 보조선
    if (s.step >= 1) {
      b.vline(gamma, { color: 'amber', alpha: 0.55, width: 1.8, dash: true, ref: 'axis' });
      b.seg([alpha - 1.5, yA], [beta + 1.5, yB], { color: 'sky', width: 2.2, dash: true, ref: 'dy' });
    }
    if (!isSym(s)) return;
    const h = s.spanL / 2;
    const xRootL = gamma - Math.sqrt(2) * h;
    const xRootR = gamma + Math.sqrt(2) * h;
    // Step 2: 극대 수평 접선 및 1 : √2 비율 가이드 박스
    if (s.step >= 2) {
      b.poly([[xRootL, yC], [xRootR, yC], [xRootR, yA], [xRootL, yA]], { fill: 'rose', fillAlpha: 0.07, color: 'rose', alpha: 0.65, width: 1.8, ref: 'box' });
      b.seg([xRootL - 0.8, yC], [xRootR + 0.8, yC], { color: 'rose', width: 2.4, glow: true, ref: 'box' });
      b.point([xRootL, yC], { color: 'violet', r: 5.5, ref: 'box', label: `γ−√2h (${num(xRootL)})`, dx: -10, dy: -12, align: 'right' });
      b.point([xRootR, yC], { color: 'violet', r: 5.5, ref: 'box', label: `γ+√2h (${num(xRootR)})`, dx: 10, dy: -12 });
      // 1 : √2 수평 비율 자 (극대 접선 아래 두 줄: γ~β 는 1, γ~γ+√2h 는 √2)
      const yRow = (px) => b.toW(0, b.toS(0, yC).y + px).y;
      b.seg([gamma, yRow(16)], [beta, yRow(16)], { color: 'amber', width: 3.2, ref: 'box' });
      b.seg([gamma, yRow(34)], [xRootR, yRow(34)], { color: 'violet', width: 3.2, ref: 'box' });
      b.text([(gamma + beta) / 2, yRow(16)], '1', { color: 'amber', dy: -5, size: 15, weight: 850, ref: 'box' });
      b.text([(gamma + xRootR) / 2, yRow(34)], '√2', { color: 'violet', dy: 19, size: 15, weight: 850, ref: 'box' });
      b.text([gamma, yRow(34)], `h = ${num(h)} · √2h = ${num(Math.sqrt(2) * h)}`, { color: 'amber', dy: 40, size: 12, align: 'right', dx: -8, ref: 'box' });
    }
    // Step 3: 극댓값-극솟값 높이차 Δy = |a|h⁴
    if (s.step >= 3) {
      const xr = offX(b, xRootR, 26);
      b.seg([xr, yC], [xr, yA], { color: 'amber', width: 2.6, ref: 'dy' });
      barLabel(b, xr, (yC + yA) / 2, `Δy = ${num(Math.abs(yC - yA))}`, 'amber', 'dy');
    }
  }

  // 모드 3: 사차함수 2대 넓이 공식 (삼중근 1/20 vs 이중접선 1/30)
  function drawArea(b, s) {
    const { alpha, beta } = getRoots(s);
    const left = isLeft(s), right = isRight(s), sym = isSym(s);
    if (left || right) {
      const h = s.spanL / 3;
      const x1 = left ? alpha : beta - 4 * h;
      const x2 = left ? alpha + 4 * h : beta;
      const yLine = evalF(s, left ? alpha : beta);
      const L = x2 - x1;
      const area20 = (Math.abs(s.a) / 20) * Math.pow(L, 5);
      if (s.step >= 1) {
        regionLine(b, s, yLine, x1, x2, { fill: 'rose', alpha: 0.26, ref: 'S' });
        b.seg([x1 - 0.8, yLine], [x2 + 0.8, yLine], { color: 'rose', width: 2.5, glow: true, ref: 'tan' });
      }
      if (s.step >= 2) {
        b.seg([x1, yLine], [x2, yLine], { color: 'amber', width: 2, ref: 'S', dash: true });
        b.text([(x1 + x2) / 2, (yLine + evalF(s, left ? beta : alpha)) / 2], `S = |a|/20 · L⁵ = ${num(area20)}`, { color: 'amber', size: 14, weight: 850, ref: 'S' });
        b.text([(x1 + x2) / 2, yLine], `L = ${num(L)}`, { color: 'amber', dy: -12, size: 12.5, ref: 'S' });
      }
    } else if (sym) {
      const yLine = evalF(s, alpha);
      const L = beta - alpha;
      const area30 = (Math.abs(s.a) / 30) * Math.pow(L, 5);
      if (s.step >= 1) {
        regionLine(b, s, yLine, alpha, beta, { fill: 'sky', alpha: 0.26, ref: 'S' });
        b.seg([alpha - 0.8, yLine], [beta + 0.8, yLine], { color: 'sky', width: 2.5, glow: true, ref: 'tan' });
      }
      if (s.step >= 2) {
        b.text([(alpha + beta) / 2, (yLine + evalF(s, (alpha + beta) / 2)) / 2], `S = |a|/30 · L⁵ = ${num(area30)}`, { color: 'amber', size: 14, weight: 850, ref: 'S' });
        b.text([(alpha + beta) / 2, yLine], `L = β−α = ${num(L)}`, { color: 'amber', dy: -12, size: 12.5, ref: 'S' });
      }
    }
  }

  // 모드 4 (위 칠판): 두 극솟값 높이차 |f(α) - f(β)| = |S₁ - S₂|
  function drawSyncMain(b, s) {
    const { alpha, beta } = getRoots(s);
    const yA = evalF(s, alpha), yB = evalF(s, beta);
    if (s.step >= 2) {
      const xr = beta + 0.55;
      b.seg([alpha - 0.5, yA], [xr, yA], { color: 'rose', alpha: 0.7, width: 1.8, dash: true, ref: 'dy' });
      b.seg([alpha - 0.5, yB], [xr, yB], { color: 'sky', alpha: 0.7, width: 1.8, dash: true, ref: 'dy' });
      b.seg([xr, yA], [xr, yB], { color: 'amber', width: 3, ref: 'dy' });
      barLabel(b, xr, (yA + yB) / 2, `|f(α)−f(β)| = ${num(Math.abs(yA - yB))}`, 'amber', 'dy');
    }
  }

  // 모드 5: 절댓값 접어 올린 함수 |f(x) - k| 와 미분불가능 첨점 스캐너
  function drawFold(b, s) {
    const k = s.kLine;
    const vb = b.viewBox();
    // Step 1: 기준 수평선 y = k
    if (s.step >= 1 || s.playing) {
      b.hline(k, { color: 'violet', width: 2.4, dash: true, glow: true, ref: 'fold' });
    }
    // Step 2: 접어 올린 그래프 y = |f(x) - k| + k (보라색 네온 실선)
    if (s.step >= 2) {
      b.plot((x) => k + Math.abs(evalF(s, x) - k), { color: 'violet', width: 3.4, glow: true, ref: 'fold' });
    }
    // Step 3: f(x) = k 의 교점 탐색 및 미분가능(기울기 0) vs 첨점(기울기 ≠ 0) 판별
    if (s.step >= 3) {
      const crossings = findCrossings(s, k, vb.x0 - 0.3, vb.x1 + 0.3);
      crossings.forEach((rx) => {
        const slope = Math.abs(evalFp(s, rx));
        if (slope < 0.15) {
          b.point([rx, k], { color: 'green', r: 6.5, ref: 'fold', label: `미분가능 (${num(rx, 1)}, f′=0)`, dx: -12, dy: 24, align: 'right' });
        } else {
          b.point([rx, k], { color: 'red', r: 7, ref: 'fold', label: `첨점 (미분불가 x=${num(rx)})`, dx: 12, dy: 24, align: 'left' });
        }
      });
    }
    // 끌 수 있는 기준선 손잡이: 곡선 위에 그립니다
    return () => {
      b.handle('k', [kHandleX(b), k], { color: 'violet', ref: 'fold', priority: 2, label: `접기 기준선 y = k (${num(k)})`, dx: -14, dy: -16, align: 'right',
        drag: (w) => { s.kLine = clamp(+w.y.toFixed(2), -6.0, 4.0); } });
    };
  }

  function drawFor(m) {
    return (b, s) => {
      autoView(b, s, m);
      mainBg(b, s);
      let after = null;
      if (m === 1) drawTriple(b, s);
      else if (m === 2) drawSym(b, s);
      else if (m === 3) drawArea(b, s);
      else if (m === 4) drawSyncMain(b, s);
      else after = drawFold(b, s);
      curve(b, s);
      overlay(b, s);
      if (after) after();
      done(b);
      derivPane(b, s, m);
    };
  }

  /* ---------- 6. 장면 정의 ---------- */
  const TICK = {
    4: (s, dt) => { if (!s.playing) return false; bounce(s, 'lambda', 0.48, 0.05, 0.95, dt); return true; },
    5: (s, dt) => { if (!s.playing) return false; bounce(s, 'kLine', 2.4, -5.0, 3.2, dt); return true; }
  };
  const tickSpan = (s, dt) => { if (!s.playing) return false; bounce(s, 'spanL', 0.9, 2.0, 3.7, dt); return true; };

  function sceneOf(m, def) {
    return {
      guide: examData[m].hint.replace('상단 프리셋에서', '조작 패널의 4대 개형 프리셋(휴대폰에서는 그림 아래)에서'),
      actions: actionsCommon(),
      presets: presetsCommon,
      steps: examData[m].steps,
      problem: problemOf(m), solution: solutionOf(m), enter: enterOf(m),
      focus: (s) => focusFor(VIEW[m], s.dual),
      panes: panesOf(m),
      tick: TICK[m] || tickSpan,
      view: viewFor(m),
      draw: drawFor(m),
      ...def
    };
  }
  const scenes = [
    sceneOf(1, {
      id: 'triple', title: '삼중근 3 : 1 비율', short: '삼중근 3:1',
      question: '변곡접점에서 그은 수평 접선이 곡선과 다시 만나는 점과 극소점은 변곡접점에서 어떤 비율로 놓일까?',
      controls: ['lambda', 'spanL', 'a']
    }),
    sceneOf(2, {
      id: 'sym', title: '대칭 W형 1 : √2 비율', short: '대칭 W 1:√2',
      question: '대칭인 W형 사차함수에서 극대점의 수평 접선이 곡선과 다시 만나는 점은 극대점에서 얼마나 떨어져 있을까?',
      controls: ['lambda', 'spanL', 'a']
    }),
    sceneOf(3, {
      id: 'area', title: '넓이 1/20 & 1/30 공식', short: '넓이 1/20·1/30',
      question: '삼중근 변곡접선과 이중접선이 곡선과 둘러싸는 넓이는 구간의 길이 L로 어떻게 나타날까?',
      controls: ['lambda', 'spanL', 'a']
    }),
    sceneOf(4, {
      id: 'sync', title: 'f(x)↔f\'(x) 넓이 동기화', short: 'f↔f′ 넓이',
      question: '삼차 도함수 그래프의 두 영역 넓이 S₁, S₂의 차는 사차함수의 두 극솟값 높이 차와 어떤 관계일까?',
      controls: ['lambda', 'spanL', 'a']
    }),
    sceneOf(5, {
      id: 'fold', title: '|f(x)-k| 미분가능성', short: '|f(x)−k| 첨점',
      question: '수평선 y = k 를 기준으로 그래프를 접어 올린 |f(x)−k| 는 k의 값에 따라 몇 군데에서 미분불가능해질까?',
      controls: ['lambda', 'spanL', 'a', 'kLine']
    })
  ];

  /* ---------- 7. 실험실 등록 ---------- */
  APLab.createLab({
    id: 'calc1-quartic',
    title: '사차함수 비율관계',
    courseName: '미적분Ⅰ',
    unit: '미분 · 사차함수 비율관계',
    courseColor: 'var(--m-orange)',
    home: '../index.html#calc1',
    legacy: '../../labs/미적분1/사차함수 비율관계.html',
    board: { kind: 'cartesian', focus: focusFor(VIEW[1], false) },
    params: {
      lambda: { value: 0, min: 0, max: 1, step: 0.02, color: 'amber', label: '가운데 극값 위치비 $\\lambda$', hint: '$\\lambda=\\dfrac{\\gamma-\\alpha}{\\beta-\\alpha}$ · 0 = 좌측 삼중근, 0.5 = 대칭 W형, 1 = 우측 삼중근 (극대 C를 끌어도 조절됩니다)',
        format: (v, s) => `λ = ${fmt(v)} (${isLeft(s) ? '좌측 삼중근 3:1' : isRight(s) ? '우측 삼중근 1:3' : isSym(s) ? '대칭 W형 1:√2' : '비대칭 W형'})` },
      spanL: { value: 3, min: 1.5, max: 4, step: 0.1, color: 'sky', label: '극값 폭 $L=\\beta-\\alpha$', hint: '오른쪽 극소 B를 끌어도 조절됩니다', format: (v) => `L = ${fmt(v)}` },
      a: { value: 0.25, min: 0.1, max: 0.8, step: 0.05, color: 'green', label: '최고차항 계수 $a$', format: (v) => `a = ${fmt(v)}` },
      kLine: { value: 2, min: -6, max: 4, step: 0.1, color: 'violet', label: '절댓값 접기 기준선 $y=k$', hint: '$|f(x)-k|$ 의 첨점을 찾습니다 · 그림의 보라색 점으로도 끌 수 있어요', format: (v) => `k = ${fmt(v)}` },
      // 그림에서 끌어 바꾸는 값 (슬라이더 없음): 왼쪽 극점 x(α)와 기준 높이 f(α)
      alpha: { value: 0, min: -2, max: 1.5, step: 0.01 },
      y0: { value: 2, min: -8, max: 6, step: 0.01 }
    },
    state: { dual: false, animDir: 1 },
    persist: ['dual'],
    scenes
  });
});
