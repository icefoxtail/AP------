  const fRight1 = (gap) => (x) => x + 1.0 + gap;             // 모드1 x>1
  const fnF2 = (x) => x * x + 2.0 * x - 3.0;                 // 모드2 f(x) = (x-1)(x+3)

  const hLeft3 = (r) => (x) => (x + 1.0) * (x - r);          // 모드3 h(x) = f(x)g(x), x<1

  const fn4 = (x) => x * x * x - 3.0 * x;                    // 모드4 f(x)
  const count4 = (t) => (Math.abs(Math.abs(t) - 2.0) < 0.06 ? 2 : Math.abs(t) < 2.0 ? 3 : 1); // 교점 개수 g(t)
  const fn5 = (x) => 0.5 * x * x * x - 1.5 * x - 0.5;        // 모드5 f(x)
  const ROOT5 = 1.879;                                       // f(x)=0 의 실근 (1, 2) 안
  // x³ − 3x = t 의 실근 (모드4의 교점 위치 표시)
  function roots4(t) {
    if (Math.abs(Math.abs(t) - 2.0) < 1e-9) return t > 0 ? [2, -1] : [-2, 1];
    if (Math.abs(t) < 2.0) {
      const th = Math.acos(t / 2) / 3;
      return [2 * Math.cos(th), 2 * Math.cos(th + (2 * Math.PI) / 3), 2 * Math.cos(th + (4 * Math.PI) / 3)];
    }
    return [Math.sign(t) * 2 * Math.cosh(Math.acosh(Math.abs(t) / 2) / 3)];
  }

  function bounce(s, key, speed, lo, hi, dt) {
    s[key] += speed * s.animDir * dt;
    if (s[key] < lo) { s[key] = lo; s.animDir = 1; }
    if (s[key] > hi) { s[key] = hi; s.animDir = -1; }
  }

  const dualAction = { id: 'dual', icon: 'split', label: (s) => (s.dual ? '하단 동기화 뷰 켜짐' : '하단 동기화 뷰 보기'), on: (s) => s.dual, run: (s) => { s.dual = !s.dual; } };

  const phoneShift = (px) => () => {
    if (!(window.matchMedia && window.matchMedia('(max-width: 859px)').matches)) return 0;
    const bd = window.lab && window.lab.board;
    return px / ((bd && bd.k) || 28);
  };
  const panesOf = (frac, fy, dy, shift) => (s) => {
    if (!s.dual) return null;
    const sh = shift ? shift() : 0;
    return [{ id: 'main', frac, focusY: sh ? [fy[0] + sh, fy[1] + sh] : fy }, { id: 'deriv', frac: 1 - frac, focusY: dy }];
  };
  function inPane(b, id, fn) {
    b.use(id);
    b.ctx.save();
    if (b.panes) b.clip();
    fn();
    b.ctx.restore();
  }
  function lowerPane(b, s, title, axes, curves, marks) {
    if (!s.dual) return;
    b.use('deriv');
    const r = b.paneRect('deriv');
    const c = b.ctx;
    c.save();
    c.fillStyle = b.color('halo', 0.35);
    c.fillRect(r.x, r.y, r.w, r.h);
    c.restore();
    c.save();
    b.clip();
    if (s.grid) b.grid();
    b.axes(axes);
    curves();
    c.restore();
    c.save();
    c.strokeStyle = b.color('sky', 0.55);

    c.moveTo(r.x, r.y + 0.5);
    c.lineTo(r.x + r.w, r.y + 0.5);
    c.stroke();
    c.restore();
    b.stext(r.x + 14, r.y + 20, title, { color: 'sky', size: 12.5, align: 'left', weight: 800 });
    marks();

      solution: solutionOf(3),
      enter: (s) => { s.r = examData[3].snap.p1; s.dual = examData[3].snap.dualView; },
      focus: { x: [-1.8, 3.4], y: [-1.0, 3.3] },
      panes: panesOf(0.44, [-1.0, 3.3], [-2.7, 2.7]),
      tick: (s, dt) => { if (!s.playing) return false; bounce(s, 'r', 1.2, 0.0, 2.2, dt); return true; },
      view: (s) => {
        const r = s.r, healed = Math.abs(r - 1.0) < 0.04, hl = 2.0 * (1.0 - r);
        return {
          chips: [
            { k: '곱함수', tex: `h(x) = f(x) \\cdot (x ${sg(-r, 2)})`, color: 'ink' },
            { k: 'g(1)', tex: `g(1) = ${asc(1 - r, 2)} ${healed ? '= 0 \\; (\\text{연속!})' : '\\ne 0 \\; (\\text{불연속})'}`, color: healed ? 'green' : 'rose' }
          ],
          status: healed ? { tone: 'ok', text: 'g(1) = 0 영점 힐링 성공 (곱함수 연속)' } : { tone: 'bad', text: 'g(1) ≠ 0 (곱함수 x=1 에서 불연속)' },
          alert: healed ? null : { tone: 'bad', text: `연속함수 g(x)의 근 r=${fmt(r)} 이 불연속점 x=1 과 일치하지 않아 곱함수 f(x)g(x)가 불연속입니다!` },
          readouts: [
            { label: 'h(1−) 좌극한', value: fmt(hl), color: 'rose', ref: 'h' },
            { label: 'h(1+) 우극한', value: fmt(0), color: 'sky', ref: 'h' },
            { label: 'g(x)의 영점 r', value: fmt(r), color: 'amber', ref: 'g' },
            { label: '판정', value: healed ? '실수 전체 연속' : 'x=1 불연속', color: healed ? 'green' : 'red' }
          ],
          tape: s.step >= 3 ? { title: healed ? 'g(1) = 0 영점 힐링 달성! 불연속점 x = 1 에서 곱함수 f(x)g(x)가 연속이 되었습니다!'
            : `g(1) = ${fmt(1 - r)} ≠ 0 : 불연속점 x = 1 에서 곱함수 f(x)g(x)가 끊어져 있습니다!` } : null
        };
      },
      draw: (b, s) => {
        quiet(b);
        const r = s.r, healed = Math.abs(r - 1.0) < 0.04, hl = 2.0 * (1.0 - r);
        inPane(b, 'main', () => {
          if (s.grid) b.grid();
          b.axes();
          b.vline(1, { color: 'red', alpha: 0.55, width: 1.6, dash: true });
          // 불연속 함수 f(x) : x<1 일 때 x+1, x≥1 일 때 x−1
          b.plot((x) => x + 1.0, { to: 1, color: 'ink', width: 3, glow: true, ref: 'f' });
          b.plot((x) => x - 1.0, { from: 1, color: 'ink', width: 3, glow: true, ref: 'f' });
          // 연속 일차함수 g(x) = x − r
          b.line([r, 0], 1, { color: 'sky', width: 2.6, glow: true, ref: 'g' });
        });
        b.point([1, 2], { hollow: true, color: 'ink', r: 6, label: 'f(1−)=2', dx: -10, dy: -10, align: 'right', ref: 'f' });
        b.point([1, 0], { color: 'ink', r: 6, label: 'f(1+)=0', dx: 10, dy: 18, ref: 'f' });
        b.handle('r', [r, 0], { color: 'amber', ref: 'g', label: `g(x) 영점 r=${fmt(r)}`, dx: -12, dy: -14, align: 'right',
          drag: (w) => { let v = w.x; if (Math.abs(v - 1.0) < 0.08) v = 1.0; s.r = clamp(+v.toFixed(2), 0.0, 2.2); } });
        lowerPane(b, s, '▼ 곱함수 h(x) = f(x) · g(x)', {},
          () => {
            b.vline(1, { color: 'red', alpha: 0.55, width: 1.6, dash: true });
            b.plot(hLeft3(r), { to: 1, color: healed ? 'green' : 'rose', width: 3, glow: true, ref: 'h' });
            b.plot(hRight3(r), { from: 1, color: healed ? 'green' : 'sky', width: 3, glow: true, ref: 'h' });
          },
          () => {
            if (healed) b.point([1, 0], { color: 'green', r: 7.5, label: '영점 힐링 성공! h(1)=0 연속 완성!', dx: 14, dy: -14, ref: 'h' });
            else {
              b.point([1, hl], { hollow: true, color: 'rose', r: 6, label: `좌극한=${fmt(hl)}`, dx: -10, dy: -10, align: 'right', ref: 'h' });
              b.point([1, 0], { color: 'sky', r: 6, label: '우극한=0.00 (끊어짐!)', dx: 12, dy: 18, ref: 'h' });
            }
          });
      }
    },

    /* ===== MODE 4 · 교점 개수 함수 g(t) ===== */
    {
      id: 'count', title: '교점 개수 함수 g(t)', short: '교점 개수 g(t)',
      question: '수평선 y = t 를 위아래로 움직이면 교점의 개수는 언제, 왜 달라질까?',
      guide: guideOf(4, ' 하단 그래프의 <b>노란 점</b>을 좌우로 끌어도 t가 바뀝니다.'),
      controls: ['t'],
      actions: [dualAction, playAction('수평선 스캔 애니메이션')],
      steps: examData[4].steps,
      problem: problemOf(4, () => ({ t: examData[4].snap.p1, dual: examData[4].snap.dualView })),
      solution: solutionOf(4),
      enter: (s) => { s.t = examData[4].snap.p1; s.dual = examData[4].snap.dualView; },
      focus: { x: [-3.0, 3.0], y: [-3.3, 3.3] },
      panes: panesOf(0.55, [-3.3, 3.3], [-1.3, 4.3], phoneShift(22)),
      tick: (s, dt) => { if (!s.playing) return false; bounce(s, 't', 1.5, -2.6, 2.6, dt); return true; },
      view: (s) => {
        const t = s.t, cnt = count4(t);
        return {
          chips: [
            { k: '함수식', tex: `f(x) = x^3 - 3x, \\; y = t \\; (${asc(t, 2)})`, color: 'ink' },
            { k: '교점 개수', tex: `g(${asc(t, 2)}) = ${cnt}\\text{개}`, color: 'amber' }
          ],
          status: cnt === 2 ? { tone: 'key', text: '접하는 순간 (g(t) 불연속점!)' } : { tone: 'info', text: `교점 개수 스캔 중 · ${cnt}개` },
          readouts: [
            { label: '수평선 높이 t', value: `t = ${fmt(t)}`, color: 'amber', ref: 't' },
            { label: '교점 개수 g(t)', value: `${cnt}개`, color: 'green', ref: 't' },
            { label: '불연속 기준', value: 't = −2, 2', color: 'rose' },
            { label: '판정', value: cnt === 2 ? '불연속 지점(접함)' : '연속 구간', color: cnt === 2 ? 'red' : 'sky' }
          ],
          tape: s.step >= 3 ? { title: '교점 개수 함수 g(t) : 직선 y = t 가 극대(t=2) · 극소(t=−2)에 접하는 순간에만 불연속!' } : null
        };
      },
      draw: (b, s) => {
        quiet(b);
        const t = s.t, cnt = count4(t);
        inPane(b, 'main', () => {
          if (s.grid) b.grid();
          b.axes();
          b.plot(fn4, { color: 'ink', width: 3, glow: true, ref: 'f' });
          b.hline(t, { color: 'amber', width: 2.6, glow: true, ref: 't' });
        });
        roots4(t).forEach((x) => b.point([x, t], { color: 'rose', r: 4.5, ref: 't' }));
        b.point([-1.0, 2.0], { color: 'rose', r: 5.5, label: '극대(−1, 2)', dx: -10, dy: -10, align: 'right' });
        b.point([1.0, -2.0], { color: 'sky', r: 5.5, label: '극소(1, −2)', dx: -10, dy: 16, align: 'right' });
        b.handle('t', [2.35, t], { color: 'amber', ref: 't', label: `t = ${fmt(t)}`, dx: 14, dy: -14,
          drag: (w) => { let v = w.y; if (Math.abs(v - 2.0) < 0.08) v = 2.0; if (Math.abs(v + 2.0) < 0.08) v = -2.0; s.t = clamp(+v.toFixed(2), -2.6, 2.6); } });
        lowerPane(b, s, '▼ 교점 개수 함수 g(t) (가로축 = t)', { xLabel: 't', yLabel: 'g(t)' },
          () => {
            const vb = b.viewBox();
            // t < −2 : 1개, −2 < t < 2 : 3개, t > 2 : 1개 (t = ±2 에서는 2개)
            b.seg([vb.x0 - 1, 1.0], [-2.0, 1.0], { color: 'sky', width: 3, glow: true });
            b.seg([-2.0, 3.0], [2.0, 3.0], { color: 'green', width: 3, glow: true });
            b.seg([2.0, 1.0], [vb.x1 + 1, 1.0], { color: 'sky', width: 3, glow: true });
          },
          () => {
            [-2.0, 2.0].forEach((x) => {
              b.point([x, 1.0], { hollow: true, color: 'sky', r: 5.5 });
              b.point([x, 3.0], { hollow: true, color: 'green', r: 5.5 });
              b.point([x, 2.0], { color: 'red', r: 6, label: `불연속 t=${x < 0 ? '−2' : '2'} (g=2)`, dx: x < 0 ? -12 : 12, dy: -12, align: x < 0 ? 'right' : 'left' });
            });
            // 현재 t 위치 마커 (좌우로 끌 수 있음)
            // t = ±2 (cnt 2)에서는 손잡이가 '불연속 t=±2 (g=2)' 점과 같은 자리이므로, 그 라벨의 반대쪽으로 g(t) 라벨을 둡니다.
            const atJump = cnt === 2;
            b.handle('tm', [t, cnt], { color: 'amber', ref: 't', label: `g(t)=${cnt}`, dx: atJump ? (t > 0 ? -12 : 12) : 0, dy: atJump ? -12 : cnt === 1 ? 20 : -18, align: atJump ? (t > 0 ? 'right' : 'left') : 'center',
              drag: (w) => { let v = w.x; if (Math.abs(v - 2.0) < 0.08) v = 2.0; if (Math.abs(v + 2.0) < 0.08) v = -2.0; s.t = clamp(+v.toFixed(2), -2.6, 2.6); } });
          });
      }
    },

    /* ===== MODE 5 · 사잇값 정리 ===== */
    {
      id: 'ivt', title: '사잇값 정리(IVT)', short: '사잇값 정리',
      question: '구간 양 끝값 f(a), f(b)의 부호가 서로 반대이면, 그 사이에서 그래프는 x축을 반드시 지날까?',
      guide: guideOf(5),
      controls: ['a', 'b'],
      actions: [playAction('구간 이동 애니메이션')],
      steps: examData[5].steps,
      problem: problemOf(5, () => ({ a: examData[5].snap.p1, b: examData[5].snap.p2 })),
      solution: solutionOf(5),
      enter: (s) => { s.a = examData[5].snap.p1; s.b = examData[5].snap.p2; s.dual = false; },
      focus: { x: [-2.0, 2.9], y: [-2.2, 2.4] },
      tick: (s, dt) => { if (!s.playing) return false; bounce(s, 'a', 1.2, -0.5, 2.2, dt); return true; },
      view: (s) => {
        const fa = fn5(s.a), fb = fn5(s.b), prod = fa * fb;
        return {
          chips: [
            { k: '함수식', tex: 'f(x) = \\dfrac{1}{2}x^3 - \\dfrac{3}{2}x - \\dfrac{1}{2}', color: 'ink' },
            { k: '부호', tex: `f(a)f(b) = ${asc(prod, 2)}`, color: prod < 0 ? 'green' : 'rose' }
          ],
          status: prod < 0 ? { tone: 'ok', text: 'f(a)f(b) < 0 (실근 존재 확정)' } : { tone: 'warn', text: '양 끝 부호 동일 · 판정 불가' },
          readouts: [
            { label: `f(a)  (a = ${fmt(s.a, 1)})`, value: fmt(fa), color: 'amber', ref: 'A' },
            { label: `f(b)  (b = ${fmt(s.b, 1)})`, value: fmt(fb), color: 'violet', ref: 'B' },
            { label: '곱 f(a)·f(b)', value: fmt(prod), color: prod < 0 ? 'green' : 'rose', ref: 'box' },
            { label: '판정', value: prod < 0 ? '실근 존재' : '판정 불가', color: prod < 0 ? 'green' : 'muted' }
          ],
          tape: s.step >= 3 ? { title: `f(a)·f(b) = ${fmt(prod)} ${prod < 0 ? '< 0  ⇒  사잇값 정리에 의해 구간 내 실근 반드시 존재!' : '≥ 0  ⇒  양 끝 부호가 같아 판정 불가'}` } : null
        };
      },
      draw: (b, s) => {
        quiet(b);
        const a = s.a, bb = s.b, fa = fn5(a), fb = fn5(bb);
        const lo = Math.min(a, bb), hi = Math.max(a, bb), hasRoot = fa * fb < 0;
        inPane(b, 'main', () => {
          if (s.grid) b.grid();
          b.axes();
          // Step 1 : 구간 [a, b] 레이더 박스와 양 끝 높이(부호색)
          if (s.step >= 1) {
            const vb = b.viewBox();
            b.poly([[lo, vb.y0], [hi, vb.y0], [hi, vb.y1], [lo, vb.y1]], { fill: hasRoot ? 'green' : 'red', fillAlpha: hasRoot ? 0.14 : 0.12, color: null, ref: 'box' });
            b.seg([a, 0], [a, fa], { color: fa >= 0 ? 'rose' : 'sky', width: 3, ref: 'A' });
            b.seg([bb, 0], [bb, fb], { color: fb >= 0 ? 'rose' : 'sky', width: 3, ref: 'B' });
          }
          b.plot(fn5, { color: 'ink', width: 3, glow: true });
        });
        // Step 2 : 실제 근 x ≈ 1.879
        if (s.step >= 2 && lo < ROOT5 && hi > ROOT5) b.point([ROOT5, 0], { color: 'green', r: 7, label: '실근 포착 c ≈ 1.88', dx: 10, dy: 20 });
        const aLeft = a <= bb; // 왼쪽 점의 라벨은 왼쪽으로, 오른쪽 점의 라벨은 오른쪽으로 (겹침 방지)
        b.handle('ha', [a, fa], { color: 'amber', r: 7, ref: 'A', label: `A(${fmt(a)}, f=${fmt(fa)})`, dx: aLeft ? -12 : 12, dy: fa >= 0 ? -12 : 20, align: aLeft ? 'right' : 'left',
          drag: (w) => { s.a = clamp(+w.x.toFixed(2), -1.6, 2.2); } });
        b.handle('hb', [bb, fb], { color: 'violet', r: 7, ref: 'B', label: `B(${fmt(bb)}, f=${fmt(fb)})`, dx: aLeft ? 12 : -12, dy: fb >= 0 ? -12 : 20, align: aLeft ? 'left' : 'right',
          drag: (w) => { s.b = clamp(+w.x.toFixed(2), -1.6, 2.2); } });
      }
    }
  ];

  /* ---------- 5. 실험실 등록 ---------- */
  APLab.createLab({
    id: 'calc1-limits',
    title: '함수의 극한 · 연속',
    courseName: '미적분Ⅰ',
    unit: '함수의 극한과 연속',
    courseColor: 'var(--m-orange)',
    home: '../index.html#calc1',
    legacy: '../../labs/미적분1/함수의 극한·연속.html',
    board: { kind: 'cartesian', focus: { x: [-1.2, 3.2], y: [-2.3, 4.7] }, pad: 0.04 },
    params: {
      gap: { value: 0, min: -2.0, max: 2.5, step: 0.05, color: 'sky', label: '우측 단차 Δh (우극한 = 2 + Δh)', hint: 'Δh = 0 이면 좌극한과 우극한이 같아집니다', format: (v) => `Δh = ${fmt(v)}` },
      k: { value: 2, min: -2.0, max: 3.0, step: 0.05, color: 'rose', label: '함숫값 f(1) = k', hint: 'k = 2 이면 극한값과 함숫값이 같아집니다', format: (v) => `f(1) = ${fmt(v)}` },
      d: { value: 0.65, min: 0.08, max: 0.95, step: 0.01, color: 'amber', label: '탐침 거리 d (x = 1 ± d)', hint: 'd를 줄이면 x → 1 로 접근합니다', format: (v) => `d = ${fmt(v)}` },
      px: { value: 1.8, min: 0.0, max: 2.0, step: 0.05, color: 'amber', label: '탐침점 x', hint: 'x = 1 에 가까이 보내 보세요 (x = 1 은 0/0 이라 피합니다)', format: (v) => `x = ${fmt(nearOne(v))}` },
      r: { value: 1, min: 0.0, max: 2.2, step: 0.05, color: 'sky', label: 'g(x) = x − r 의 영점 r', hint: 'r = 1 이면 불연속점 x = 1 에서 g(1) = 0', format: (v) => `r = ${fmt(v)}` },
      t: { value: 2, min: -2.6, max: 2.6, step: 0.1, color: 'amber', label: '수평선 높이 t', hint: 't = ±2 에서 직선이 곡선에 접합니다', format: (v) => `t = ${fmt(v)}` },
      a: { value: 1, min: -1.6, max: 2.2, step: 0.05, color: 'amber', label: '구간의 한 끝 a', hint: 'f(a)·f(b) < 0 이면 사이에 실근이 있습니다', format: (v) => `a = ${fmt(v)}` },
      b: { value: 2, min: -1.6, max: 2.2, step: 0.05, color: 'violet', label: '구간의 다른 끝 b', format: (v) => `b = ${fmt(v)}` }
    },
    state: { dual: false, animDir: -1 },
    persist: ['dual'],
    scenes
  });
});
</script>
