            desc: `$\\overline{DC} \\parallel \\overline{BE}$이고 $\\overline{BD} \\parallel \\overline{CE}$이므로 사각형 $DBEC$는 평행사변형입니다.<br/>따라서 $\\overline{BE} = \\overline{DC} = \\overline{AB} = 4$이므로 $\\mathbf{\\overline{AE} = \\overline{AB} + \\overline{BE} = 4 + 4 = 8}$입니다.`
          },
          {
            step: 2,
            title: 'Step 2. 평행선 사이의 등적변형으로 넓이 보존 확인하기',
            desc: `$\\overline{BD} \\parallel \\overline{CE}$이므로 밑변 $\\overline{BC}$가 공통인 두 삼각형에 대하여 $\\text{넓이}(\\triangle BCD) = \\text{넓이}(\\triangle BCE)$입니다.<br/>따라서 $\\mathbf{\\text{넓이}(\\triangle ACE)} = \\text{넓이}(\\triangle ABC) + \\text{넓이}(\\triangle BCE) = \\mathbf{\\text{넓이}(\\text{평행사변형 } ABCD)}$입니다.`
          },
          {
            step: 3,
            title: 'Step 3. 삼각형 ACE의 넓이 계산',
            desc: `평행사변형 $ABCD$의 넓이는 $\\overline{AB}\\cdot\\overline{AD}\\sin\\dfrac{\\pi}{3} = 4 \\times 3 \\times \\dfrac{\\sqrt{3}}{2} = 6\\sqrt{3}$이므로<br/>$\\therefore \\mathbf{\\text{넓이}(\\triangle ACE) = 6\\sqrt{3}}$입니다.`
          }
        ],
        alg: `
          <div class="font-bold text-amber-300 mb-1">🔍 삼각형 ACE의 밑변과 높이로 직접 구하는 풀이 비교</div>
          <div>1) 꼭짓점 $C$에서 직선 $AE$까지의 높이 $h$는 평행사변형 $ABCD$의 높이와 같으므로 $h = \\overline{BC}\\sin\\dfrac{\\pi}{3} = 3 \\times \\dfrac{\\sqrt{3}}{2} = \\dfrac{3\\sqrt{3}}{2}$입니다.</div>
          <div>2) 따라서 $\\text{넓이}(\\triangle ACE) = \\dfrac{1}{2} \\times \\overline{AE} \\times h = \\dfrac{1}{2} \\times 8 \\times \\dfrac{3\\sqrt{3}}{2} = 6\\sqrt{3}$으로 등적변형 결과와 정확히 일치합니다.</div>
        `,
        answer: 'AE = 8, 넓이(△ACE) = 6√3 (≈ 10.39)'
      }
    ];

    /* ==========================================================================
       2.0 연결부 — 원본의 '화면 픽셀 캔버스'를 같은 크기의 가상 캔버스로 옮겨 새 무대(APLab.Board)에 그립니다.
       원본 그리기 코드(drawScene)는 글자 그대로 두고, 아래 d* 도우미만 무대 엔진에 연결합니다.
       선 굵기·글자 크기는 화면 픽셀 그대로이고, 도형 좌표만 가상 캔버스 → 무대로 옮겨집니다.
       ========================================================================== */
    const state = { probIdx: 0, auxStep: 0, sliderT: 0.5, animT: 1, scale: 1, panX: 0, panY: 0 };
    let BRD = null;      // 지금 프레임의 무대
    let SS = null;       // 지금 프레임의 실험실 상태(lab.s)
    let METRIC = '';
    let handleN = 0;
    function curProb() { return PROBLEMS[state.probIdx]; }

    // 가상 캔버스: 무대에서 안내 칩·도구가 차지한 가장자리를 뺀 영역 전체(원본의 캔버스와 같은 역할).
    function layoutRect(b) {
      const ins = b.thumb ? { top: 0, right: 0, bottom: 0, left: 0 } : b.insets;
      const aw = Math.max(60, b.W - ins.left - ins.right), ah = Math.max(60, b.H - ins.top - ins.bottom);
      const pp = b.pad * Math.min(aw, ah);
      const uw = Math.max(40, aw - 2 * pp), uh = Math.max(40, ah - 2 * pp);
      const k0 = b.thumb ? Math.min(uw, uh) / 700 : 1; // 실제 화면: 가상 픽셀 = 화면 픽셀(원본과 같은 크기감) / 미리보기: 짧은 변 700으로 축소
      const rect = { width: uw / k0, height: uh / k0 };
      b.focus = { x: [0, rect.width], y: [0, rect.height] };
      return rect;
    }
    const scr = (p) => BRD.toS(p.x, p.y);
    const txt = (v) => String(v == null ? '' : v).replace(/➔/g, '→'); // 캔버스 글꼴에서 이모지로 그려지는 화살표를 →로
    const insets = () => (BRD.thumb ? { top: 0, right: 0, bottom: 0, left: 0 } : BRD.insets);
    function fitSize(text, size, maxW, weight = 800) {
      const c = BRD.ctx;
      c.save();
      c.font = `${weight} ${size}px ${BRD.font}`;
      const w = c.measureText(text).width;
      c.restore();
      return w + 26 > maxW ? Math.max(9.5, size * ((maxW - 26) / (w + 16))) : size;
    }

    function toScr(mx, my, ox, oy, u) {
      return { x: ox + mx * u, y: oy - my * u };
    }
    function toMath(sx, sy, ox, oy, u) {
      return { x: (sx - ox) / u, y: (oy - sy) / u };
    }
    // 원본 onSliderInput: 0~1로 맞추고, 3단계부터는 정답 위치 근처에서 달라붙습니다.
    function onSliderInput(val) {
      let num = Math.max(0, Math.min(1, parseFloat(val)));
      const p = curProb();
      if (state.auxStep >= 3) {
        for (const s of p.snaps) if (Math.abs(num - s.t) < 0.025) { num = s.t; break; }
      }
      SS.t = num;
      state.sliderT = num;
    }

    function drawSubtleGrid(rect, ox, oy, u) {
      if (!SS.grid) return;
      const c = BRD.ctx, vb = BRD.viewBox(), W = BRD.W, H = BRD.H;
      c.save();
      c.setLineDash([]);
      c.strokeStyle = BRD.colors.grid;
      c.lineWidth = 1;
      c.beginPath();
      for (let x = ox + Math.ceil((vb.x0 - ox) / u) * u; x <= vb.x1; x += u) { const sx = Math.round(BRD.toS(x, oy).x) + 0.5; c.moveTo(sx, 0); c.lineTo(sx, H); }
      for (let y = oy + Math.ceil((vb.y0 - oy) / u) * u; y <= vb.y1; y += u) { const sy = Math.round(BRD.toS(ox, y).y) + 0.5; c.moveTo(0, sy); c.lineTo(W, sy); }
      c.stroke();
      c.restore();
    }

    // ---- 도형 부품 (원본 d* → 무대 엔진) ----
    const dashOf = (d) => (Array.isArray(d) && d.length ? d : null);
    function drawRightAngle(vertex, p1, p2, size = 11, col = C.gold) {
      BRD.right(vertex, p1, p2, { size, color: col });
    }
    function drawDimension(p1, p2, offsetPx, label, col = C.gold) {
      label = txt(label);
      const c = BRD.ctx;
      const s1 = scr(p1), s2 = scr(p2);
      const dx = s2.x - s1.x, dy = s2.y - s1.y;
      const len = Math.hypot(dx, dy);
      if (len < 12) return;
      const nx = (-dy / len) * offsetPx, ny = (dx / len) * offsetPx;
      const a = { x: s1.x + nx, y: s1.y + ny }, b2 = { x: s2.x + nx, y: s2.y + ny };
      c.save();
      c.strokeStyle = BRD.color(col, 0.4);
      c.lineWidth = 1.2;
      c.setLineDash([3, 3]);
      c.beginPath();
      c.moveTo(s1.x, s1.y); c.lineTo(a.x, a.y);
      c.moveTo(s2.x, s2.y); c.lineTo(b2.x, b2.y);
      c.stroke();
      c.strokeStyle = BRD.color(col);
      c.lineWidth = 2 * BRD.lw;
      c.setLineDash([]);
      c.beginPath(); c.moveTo(a.x, a.y); c.lineTo(b2.x, b2.y); c.stroke();
      const ux = dx / len, uy = dy / len, px = -uy, py = ux, aw = 6, ah = 3.5;
      c.fillStyle = BRD.color(col);
      c.beginPath(); c.moveTo(a.x, a.y); c.lineTo(a.x + ux * aw + px * ah, a.y + uy * aw + py * ah); c.lineTo(a.x + ux * aw - px * ah, a.y + uy * aw - py * ah); c.closePath(); c.fill();
      c.beginPath(); c.moveTo(b2.x, b2.y); c.lineTo(b2.x - ux * aw + px * ah, b2.y - uy * aw + py * ah); c.lineTo(b2.x - ux * aw - px * ah, b2.y - uy * aw - py * ah); c.closePath(); c.fill();
      const ins = insets();
      const fs = fitSize(label, 12 * BRD.fs, BRD.W - ins.left - ins.right);
      c.font = `800 ${fs}px ${BRD.font}`;
      const tw = c.measureText(label).width;
      const cx = Math.max(ins.left + tw / 2 + 12, Math.min(BRD.W - ins.right - tw / 2 - 12, (a.x + b2.x) / 2));
      const cy = Math.max(ins.top + 16, Math.min(BRD.H - ins.bottom - 16, (a.y + b2.y) / 2));
      c.fillStyle = BRD.colors.halo;
      c.strokeStyle = BRD.color(col);
      c.lineWidth = 1.3;
      c.beginPath();
      c.roundRect(cx - tw / 2 - 6, cy - fs / 2 - 4, tw + 12, fs + 8, 5);
      c.fill(); c.stroke();
      c.fillStyle = BRD.color(col);
      c.textAlign = 'center';
      c.textBaseline = 'middle';
      c.fillText(label, cx, cy);
      c.restore();
    }
    function dLine(a, b, col = C.gold, w = 2.6, dash = [], glow = false) {
      BRD.seg(a, b, { color: col, width: w, dash: dashOf(dash), glow });
    }
    function dCircle(center, rPx, stroke = C.cyan, fill = null, w = 2.4, dash = []) {
      if (rPx <= 1) return;
      BRD.circle(center, rPx, { color: stroke || null, width: w, dash: dashOf(dash), fill: fill || null });
    }
    function dPoly(pts, fill = 'rgba(56,189,248,0.16)', stroke = C.cyan, w = 2.5, glow = false) {
      BRD.poly(pts, { fill: fill || null, color: stroke || null, width: w, glow });
    }
    function dArcAngle(vertex, p1, p2, label = '', col = C.cyan, radiusPx = 24, rings = 1) { // [표시 보강] rings: 같은 각은 같은 색·같은 호 개수로 표시
      BRD.angle(vertex, p1, p2, { r: radiusPx, label: txt(label), color: col, labelGap: 16, rings });
    }
    // [표시 보강] 같은 길이(눈금)·평행(›) 표시 — 모두 현재 점 좌표에서 계산하므로 도형을 끌어도 따라옵니다
    const markTick = (p, q, n = 1, col = C.white) => BRD.ticks(p, q, { count: n, color: col, size: 6.5 });
    function markPar(p, q, n = 1, col = C.white, f = 0.28) { // p→q 방향 선분 위(시작점에서 f 비율, 가운데 눈금과 겹치지 않게)에 '›' n개
      const a = BRD.toS(p), b = BRD.toS(q), c = BRD.ctx;
      const m = { x: a.x + (b.x - a.x) * f, y: a.y + (b.y - a.y) * f }, l = Math.hypot(b.x - a.x, b.y - a.y) || 1;
      const d = { x: (b.x - a.x) / l, y: (b.y - a.y) / l }, nn = { x: -d.y, y: d.x };
      c.save();
      c.strokeStyle = BRD.color(col); c.lineWidth = 2 * BRD.lw; c.setLineDash([]); c.lineCap = 'round'; c.lineJoin = 'round';
      for (let i = 0; i < n; i++) {
        const o = (i - (n - 1) / 2) * 8, x = m.x + d.x * o, y = m.y + d.y * o;
        c.beginPath();
        c.moveTo(x - d.x * 4 + nn.x * 5, y - d.y * 4 + nn.y * 5); c.lineTo(x + d.x * 3, y + d.y * 3); c.lineTo(x - d.x * 4 - nn.x * 5, y - d.y * 4 - nn.y * 5);
        c.stroke();
      }
      c.restore();
    }
    // 길이·값 배지: 가상 좌표 (x, y)를 중심으로 그리되 무대 안으로 밀어 넣습니다
    function dBadge(x, y, text, col = C.gold, bg) {
      text = txt(text);
      const c = BRD.ctx;
      const s = BRD.toS(x, y);
      const ins = insets();
      const fs = fitSize(text, 12 * BRD.fs, BRD.W - ins.left - ins.right);
      c.save();
      c.setLineDash([]);
      c.font = `800 ${fs}px ${BRD.font}`;
      const tw = c.measureText(text).width;
      const cx = Math.max(ins.left + tw / 2 + 12, Math.min(BRD.W - ins.right - tw / 2 - 12, s.x));
      const cy = Math.max(ins.top + 16, Math.min(BRD.H - ins.bottom - 16, s.y));
      c.fillStyle = BRD.colors.halo;
      c.strokeStyle = BRD.color(col);
      c.lineWidth = 1.3;
      c.beginPath();
      c.roundRect(cx - tw / 2 - 8, cy - fs / 2 - 5, tw + 16, fs + 10, 6);
      c.fill(); c.stroke();
      c.fillStyle = BRD.color(col);
      c.textAlign = 'center';
      c.textBaseline = 'middle';
      c.fillText(text, cx, cy);
      c.restore();
    }
    // 꼭짓점: 끌 수 있는 점(onDrag 있음)은 후광이 있는 핸들로, 아닌 점은 보통 점으로 그립니다
    function dVertex(p, label = '', col = C.white, off = { x: 8, y: -8 }, isHandle = false, onDrag = null) {
      const o = { label: txt(label).replace(/\s*\[[^\]]*드래그[^\]]*\]/g, ''), dx: off.x || 0, dy: off.y || 0, align: off.align || 'left', baseline: 'middle' };
      if (o.align === 'center') { // 가운데 정렬 라벨이 무대 위·아래 가장자리를 넘으면 반대쪽으로 넘깁니다
        const sy = BRD.toS(p.x, p.y).y + o.dy, ins = insets();
        if (sy < ins.top + 14 && o.dy < 0) o.dy = -o.dy;
        else if (sy > BRD.H - ins.bottom - 14 && o.dy > 0) o.dy = -o.dy;
      }
      if (isHandle && onDrag) BRD.handle('H' + handleN++, p, { ...o, color: 'amber', drag: onDrag });
      else BRD.point(p, { ...o, color: col, r: 5 });
    }

    function constructPtolemyPoint(A, B, C, D) {
      const sub = (U, V) => ({ x: U.x - V.x, y: U.y - V.y });
      const cross = (U, V) => U.x * V.y - U.y * V.x;
      const BA = sub(A, B), BD = sub(D, B), BC = sub(C, B);
      const theta = Math.atan2(cross(BA, BD), BA.x * BD.x + BA.y * BD.y);
      const co = Math.cos(-theta), si = Math.sin(-theta);
      const ray = { x: BC.x * co - BC.y * si, y: BC.x * si + BC.y * co };
      const AC = sub(C, A), AB = sub(A, B), den = cross(ray, AC);
      if (Math.abs(den) < 1e-8) return null;
      const t = cross(AB, AC) / den, u = cross(AB, ray) / den;
      if (t < 0 || u < -1e-6 || u > 1 + 1e-6) return null;
      return { x: B.x + t * ray.x, y: B.y + t * ray.y };
    }

    function solveDegAFromHeight(targetY, a, angOffset) {
      let lo = 30.0, hi = 75.0;
      const heightAt = (deg) => {
        const rad = (deg * Math.PI) / 180;
        const R = a / (2 * Math.sin(rad));
        return R * (Math.cos(rad) + Math.cos(angOffset));
      };
      if (targetY >= heightAt(lo)) return lo;
      if (targetY <= heightAt(hi)) return hi;
      for (let i = 0; i < 16; i++) {
        const mid = 0.5 * (lo + hi);
        if (heightAt(mid) > targetY) lo = mid;
        else hi = mid;
      }
      return 0.5 * (lo + hi);
    }

    // 원본 setMetric: 실시간 측정 문구는 셸의 '핵심 결과' 칸으로 보냅니다
    function setMetric(txt, livePreviewTxt) {
      if (state.auxStep >= 3) { METRIC = txt; return; }
      const preview = livePreviewTxt || txt.replace(/\s*(?:\([^)]*(?:조건|중점)[^)]*\)|➔.*$)$/, '');
      METRIC = state.auxStep === 0 ? `[실시간 측정] ${preview}` : `[보조선 ${state.auxStep}단계] ${preview}`;
    }

    // =========================================================================
    // 4. 기본 1~8 & 심화 1~8 (총 16문항) 정밀 기하 렌더러 (원본 그대로)
    // =========================================================================

    function drawScene(rect) {

      const prob = curProb();
      const id = prob.id;
      const step = state.auxStep;
      const t = state.sliderT;
      const baseU = Math.min(rect.width, rect.height) / 10.5;
      const u = baseU * state.scale;
      const ox = rect.width * 0.5 + state.panX;
      const oy = rect.height * 0.53 + state.panY;

      drawSubtleGrid(rect, ox, oy, u);

      // -----------------------------------------------------------------------
      // 🌱 [기본 1] bas-1: 꼭짓점에서 수선의 발 H 내리기 (AB=5, cosB=3/5, AC=2√5)
      // [P1-1 수리] AH = 4 배지를 수선 중앙에 깔끔하게 배치하여 왼쪽 빗변 AB와의 간섭 제거
      // -----------------------------------------------------------------------
      if (id === 'bas-1') {
        const sc = u * 1.1;
        const cx = ox - sc * 0.3;
        const cy = oy + sc * 1.3;

        const bh = 3.0, ah = 4.0;
        const ch = 0.5 + t * 4.0; // t = 0.375 -> ch = 2.0
        const ac = Math.hypot(ah, ch);
        const bc = bh + ch;
        const isTarget = Math.abs(ch - 2.0) < 0.08;

        const B = toScr(-bh, 0, cx, cy, sc);
        const H = toScr(0, 0, cx, cy, sc);
        const Cpt = toScr(ch, 0, cx, cy, sc);
        const A = toScr(0, ah, cx, cy, sc);

        dPoly([A, B, Cpt], 'rgba(56, 189, 248, 0.12)', C.cyan, 2.8);
        dArcAngle(B, Cpt, A, 'cos B = 3/5', C.green, 28);
        dBadge((A.x + B.x) / 2 - 28, (A.y + B.y) / 2 - 12, 'AB = 5', C.green);
        dBadge((A.x + Cpt.x) / 2 + 34, (A.y + Cpt.y) / 2 - 12, isTarget ? 'AC = 2√5 (≈4.47)' : `AC ≈ ${ac.toFixed(2)}`, C.cyan);

        if (step >= 1) {
          dPoly([A, B, H], 'rgba(52, 211, 153, 0.18)', C.green, 2.4);
          dLine(A, H, C.gold, 2.8, [6, 4], true);
          drawRightAngle(H, B, A, 12, C.gold);
          dVertex(H, 'H', C.gold, { x: 0, y: -15, align: 'center' });
          drawDimension(B, H, 26, 'BH = 5 × (3/5) = 3', C.green);
          dBadge(H.x, (A.y + H.y) / 2 + 8, 'AH = 4', C.gold);
        }

        if (step >= 2) {
          dPoly([A, H, Cpt], 'rgba(251, 191, 36, 0.16)', C.gold, 2.4);
          drawRightAngle(H, Cpt, A, 12, C.gold); // [표시 보강] ∠AHB = ∠AHC = 90° 양쪽 직각
          drawDimension(H, Cpt, 26, `CH = √(AC² - 4²) = ${ch.toFixed(1)}`, C.cyan);
        }

        if (step >= 3) {
          const dimTxt = isTarget
            ? '조건 만족 (AC=2√5): BC = 3 + 2 = 5  |  넓이 = 10'
            : `현재 BC = 3 + ${ch.toFixed(1)} = ${bc.toFixed(1)}, 넓이 = ${(0.5 * bc * ah).toFixed(1)} (조건 AC=2√5일 때 BC=5, 넓이=10)`;
          drawDimension(B, Cpt, 52, dimTxt, C.gold);
        }

        dVertex(B, 'B', C.white, { x: -14, y: 4, align: 'right' });
        dVertex(A, 'A', C.white, { x: 0, y: -16, align: 'center' });
        dVertex(Cpt, 'C [드래그]', C.gold, { x: 14, y: -8, align: 'left' }, true, (sPos) => {
          const m = toMath(sPos.x, sPos.y, cx, cy, sc);
          const nextCh = Math.max(0.5, Math.min(4.5, m.x));
          onSliderInput((nextCh - 0.5) / 4.0);
        });

        setMetric(
          `현재 AC ≈ ${ac.toFixed(2)} | BH = 3, AH = 4, CH = ${ch.toFixed(2)} ➔ BC = ${bc.toFixed(2)}, 넓이 = ${(0.5 * bc * ah).toFixed(1)} (조건: BC=5, 넓이=10)`,
          `현재 AC ≈ ${ac.toFixed(2)}, 밑변 BC = ${bc.toFixed(2)} (점 C를 드래그하여 AC = 2√5 ≈ 4.47 위치 탐색)`
        );
        return;
      }

      // -----------------------------------------------------------------------
      // 🌱 [기본 2] bas-2: 13-14-15 삼각형의 수선의 발 (BH=5, CH=9, AH=12)
      // [P0-2 수리] 1단계 이상에서는 수선의 발 H 기준(BH=5, CH=9)으로 치수선을 고정하여 동점 P와의 수치 모순 제거
      // -----------------------------------------------------------------------
      if (id === 'bas-2') {
        const sc = u * 0.50;
        const cx = ox - sc * 7.0;
        const cy = oy + sc * 4.6;

        const B = toScr(0, 0, cx, cy, sc);
        const Cpt = toScr(14, 0, cx, cy, sc);
        const A = toScr(5, 12, cx, cy, sc);
        const H = toScr(5, 0, cx, cy, sc);

        const bp = 2.0 + t * 10.0; // t = 0.30 -> bp = 5.0 (수선의 발 H와 일치)
        const cp = 14.0 - bp;
        const apLen = Math.hypot(bp - 5.0, 12.0);
        const angAPB = (Math.atan2(12.0, 5.0 - bp) * 180) / Math.PI;
        const isPerp = Math.abs(bp - 5.0) < 0.12;
        const P = toScr(bp, 0, cx, cy, sc);

        dPoly([A, B, Cpt], 'rgba(56, 189, 248, 0.12)', C.cyan, 2.8);
        dBadge((A.x + B.x) / 2 - 28, (A.y + B.y) / 2 - 8, 'AB = 13', C.green);
        dBadge((A.x + Cpt.x) / 2 + 30, (A.y + Cpt.y) / 2 - 8, 'AC = 15', C.cyan);

        if (step >= 1) {
          dLine(A, H, 'rgba(251, 191, 36, 0.65)', 2.6, [6, 4]);
          drawRightAngle(H, B, A, 11, C.gold);
          if (!isPerp) {
            dVertex(H, 'H(수선의 발)', C.gold, { x: -8, y: -15, align: 'right' });
          }
          drawDimension(B, H, 32, 'BH = x = 5', C.green);
          drawDimension(H, Cpt, 32, 'CH = 14 - x = 9', C.cyan);
        } else {
          drawDimension(B, Cpt, 32, 'BC = 14', C.white);
        }

        if (step >= 2) {
          dPoly([A, B, H], 'rgba(52, 211, 153, 0.18)', C.green, 2.2);
          dPoly([A, H, Cpt], 'rgba(56, 189, 248, 0.18)', C.cyan, 2.2);
          drawRightAngle(H, Cpt, A, 11, C.gold); // [표시 보강] 수선의 발 H 양쪽 직각
          dBadge(H.x, (A.y + H.y) / 2, '수선 높이 AH = 12', C.gold);
        }

        if (step >= 3) {
          drawDimension(B, Cpt, 58, 'BC = BH + CH = 5 + 9 = 14  ➔  넓이 S = ½ × 14 × 12 = 84', C.gold);
        }

        dLine(A, P, isPerp ? C.gold : C.pink, isPerp ? 3.2 : 2.6, isPerp ? [] : [5, 4], isPerp);
        if (isPerp) {
          drawRightAngle(P, B, A, 12, C.gold);
        } else {
          dBadge((A.x + P.x) / 2 + (bp > 5 ? 36 : -36), (A.y + P.y) / 2 - 12, `AP ≈ ${apLen.toFixed(2)}`, C.pink);
          dArcAngle(P, B, A, `∠APB ≈ ${angAPB.toFixed(0)}°`, C.pink, 20); // [표시 보강] 해설에 나오는 ∠APB를 P의 호 안에 값과 함께 표시
        }

        dVertex(B, 'B', C.white, { x: -14, y: 4, align: 'right' });
        dVertex(Cpt, 'C', C.white, { x: 14, y: 4, align: 'left' });
        dVertex(A, 'A', C.white, { x: 0, y: -16, align: 'center' });
        dVertex(
          P,
          isPerp ? 'P = H(수선의 발, BH=5) [드래그]' : `P (BP=${bp.toFixed(1)}, CP=${cp.toFixed(1)}) [드래그]`,
          C.gold,
          { x: 10, y: -15, align: 'left' },
          true,
          (sPos) => {
            const m = toMath(sPos.x, sPos.y, cx, cy, sc);
            const nextBp = Math.max(2.0, Math.min(12.0, m.x));
            onSliderInput((nextBp - 2.0) / 10.0);
          }
        );

        setMetric(
          `현재 BP = ${bp.toFixed(1)}, CP = ${cp.toFixed(1)}, AP = ${apLen.toFixed(2)} | 수선의 발 H(BH=5, CH=9)에서 최소 높이 AH = 12, 넓이 = 84`,
          `현재 BP = ${bp.toFixed(1)}, CP = ${cp.toFixed(1)} | 선분 AP ≈ ${apLen.toFixed(2)}, ∠APB ≈ ${angAPB.toFixed(0)}°`
        );
        return;
      }

      // -----------------------------------------------------------------------
      // 🌱 [기본 3] bas-3: 공통현 AC를 공유하는 두 외접원의 반지름 비 (R₁=4, R₂=3)
      // [P0-1 수리] 3단계 배지에서 현재 조작 중인 R₁의 사인비와 목표 조건(sinB/sinD=3/4 ➔ R₁=4)을 명확히 구분 표기
      // -----------------------------------------------------------------------
      if (id === 'bas-3') {
        const sc = u * 0.9;
        const r2 = 3.0;
        const r1 = 2.6 + t * 2.2; // t = 0.6364 -> r1 = 4.0
        const h = 2.25;           // 반현 길이 (AC = 4.5)
        const isTarget = Math.abs(r1 - 4.0) < 0.08;

        const d1 = Math.sqrt(Math.max(0.2, r1 * r1 - h * h));
        const d2 = Math.sqrt(Math.max(0.2, r2 * r2 - h * h));

        const O1 = toScr(-d1, 0, ox, oy, sc);
        const O2 = toScr(d2, 0, ox, oy, sc);
        const A = toScr(0, h, ox, oy, sc);
        const Cpt = toScr(0, -h, ox, oy, sc);
        const B = toScr(-d1 - r1 * Math.cos(0.22), r1 * Math.sin(0.22), ox, oy, sc);
        const D = toScr(d2 + r2 * Math.cos(-0.18), r2 * Math.sin(-0.18), ox, oy, sc);

        dCircle(O1, r1 * sc, 'rgba(52, 211, 153, 0.7)', 'rgba(52, 211, 153, 0.05)', 2.4);
        dCircle(O2, r2 * sc, 'rgba(56, 189, 248, 0.7)', 'rgba(56, 189, 248, 0.05)', 2.4);

        dLine(A, B, C.green, 2.5);
        dLine(Cpt, B, C.green, 2.5);
        dLine(A, D, C.cyan, 2.5);
        dLine(Cpt, D, C.cyan, 2.5);

        const ratioSin = r2 / r1;

        if (step >= 1) {
          dLine(A, Cpt, C.red, 3.6, [], true);
          dBadge(A.x, Cpt.y + 26, '공통현 AC', C.red);
        }

        if (step >= 2) {
          dArcAngle(B, Cpt, A, '∠B', C.green, 26);
          dArcAngle(D, A, Cpt, '∠D', C.cyan, 26);
          dBadge(O1.x, O1.y - r1 * sc - 16, `AC = 2R₁ sin B`, C.green);
          dBadge(O2.x, O2.y - r2 * sc - 16, `AC = 2R₂ sin D (R₂=3)`, C.cyan);
        }

        if (step >= 3) {
          const badgeTxt = isTarget
            ? '조건 만족 (sin B / sin D = 3/4): R₁ = R₂ × (4/3) = 3 × (4/3) = 4'
            : `현재 R₁ = ${r1.toFixed(2)} (sin B / sin D ≈ ${ratioSin.toFixed(2)})  |  조건 sin B / sin D = 3/4일 때 R₁ = 4`;
          dBadge(ox, Cpt.y + 54, badgeTxt, C.gold);
        }

        dVertex(O1, `O₁(R₁=${r1.toFixed(1)})`, C.green, { x: 0, y: 16, align: 'center' });
        dVertex(O2, 'O₂(R₂=3)', C.cyan, { x: 0, y: 16, align: 'center' });
        dVertex(A, 'A', C.white, { x: 0, y: -15, align: 'center' });
        dVertex(Cpt, 'C', C.white, { x: 12, y: 8, align: 'left' });
        dVertex(D, 'D', C.cyan, { x: 12, y: -6, align: 'left' });
        dVertex(B, 'B [R₁ 조절 드래그]', C.gold, { x: -12, y: -10, align: 'right' }, true, (sPos) => {
          const m = toMath(sPos.x, sPos.y, ox, oy, sc);
          const dist = Math.hypot(m.x + d1, m.y);
          const nextR1 = Math.max(2.6, Math.min(4.8, dist));
          onSliderInput((nextR1 - 2.6) / 2.2);
        });

        setMetric(
          `현재 R₁ = ${r1.toFixed(2)}, R₂ = 3.00 | sin B / sin D = R₂ / R₁ ≈ ${ratioSin.toFixed(2)} (조건: 3/4 = 0.75 ➔ R₁ = 4)`,
          `현재 R₁ = ${r1.toFixed(2)}, R₂ = 3.00 | 사인 비 sin B / sin D ≈ ${ratioSin.toFixed(2)}`
        );
        return;
      }

      // -----------------------------------------------------------------------
      // 🌱 [기본 4] bas-4: 두 외접원의 반지름 비로 원주각 사인값 구하기 (R₁=4.5, R₂=3)
      // [P0-1 수리] 3단계 배지에서 현재 조작된 공통현 AC에 대한 6 sin D = AC 식과 조건 만족값(AC=5 ➔ sin D=5/6)을 일치시켜 표기
      // -----------------------------------------------------------------------
      if (id === 'bas-4') {
        const r1 = 4.5, r2 = 3.0;
        // [표시 보강] 두 원 전체(왼쪽 B ~ 오른쪽 D)가 화면 안에 들어오도록 크기와 가운데를 맞춤(공통현 목표값 5 기준으로 고정해 끌어도 흔들리지 않음)
        const h0 = 2.5, spanL0 = Math.sqrt(r1 * r1 - h0 * h0) + r1 * Math.cos(0.2), spanR0 = Math.sqrt(r2 * r2 - h0 * h0) + r2 * Math.cos(0.18);
        const sc = Math.min(u * 0.85, (rect.width * 0.9) / (spanL0 + spanR0));
        const oxF = ox + ((spanL0 - spanR0) / 2) * sc;
        const acLen = 3.0 + t * 2.8; // t = 0.7143 -> acLen = 5.0
        const h = acLen / 2;
        const isTarget = Math.abs(acLen - 5.0) < 0.08;

        const d1 = Math.sqrt(Math.max(0.2, r1 * r1 - h * h));
        const d2 = Math.sqrt(Math.max(0.2, r2 * r2 - h * h));

        const O1 = toScr(-d1, 0, oxF, oy, sc);
        const O2 = toScr(d2, 0, oxF, oy, sc);
        const A = toScr(0, h, oxF, oy, sc);
        const Cpt = toScr(0, -h, oxF, oy, sc);
        const B = toScr(-d1 - r1 * Math.cos(0.2), r1 * Math.sin(0.2), oxF, oy, sc);
        const D = toScr(d2 + r2 * Math.cos(-0.18), r2 * Math.sin(-0.18), oxF, oy, sc);

        dCircle(O1, r1 * sc, 'rgba(52, 211, 153, 0.7)', 'rgba(52, 211, 153, 0.05)', 2.4);
        dCircle(O2, r2 * sc, 'rgba(56, 189, 248, 0.7)', 'rgba(56, 189, 248, 0.05)', 2.4);

        dLine(A, B, C.green, 2.5);
        dLine(Cpt, B, C.green, 2.5);
        dLine(A, D, C.cyan, 2.5);
        dLine(Cpt, D, C.cyan, 2.5);
        dLine(A, Cpt, C.red, 3.2);

        const sinB = acLen / (2 * r1);
        const sinD = acLen / (2 * r2);

        if (step >= 1) {
          dArcAngle(B, Cpt, A, isTarget ? 'sin B = 5/9' : `sin B ≈ ${sinB.toFixed(2)}`, C.green, 28);
          dBadge(A.x, Cpt.y + 26, `AC = 2R₁ sin B = ${acLen.toFixed(2)}`, C.red);
        }

        if (step >= 2) {
          dArcAngle(D, A, Cpt, step >= 3 && isTarget ? 'sin D = 5/6' : `sin D ≈ ${sinD.toFixed(2)}`, C.cyan, 26);
          dBadge(O2.x, O2.y - r2 * sc - 16, `AC = 2R₂ sin D = 6 sin D`, C.cyan);
        }

        if (step >= 3) {
          const badgeTxt = isTarget
            ? '조건 만족 (sin B = 5/9, AC = 5): 6 sin D = 5  ➔  sin D = 5/6 (≈ 0.833)'
            : `현재 6 sin D = ${acLen.toFixed(2)} (sin D ≈ ${sinD.toFixed(3)})  |  조건 sin B = 5/9일 때 AC = 5 ➔ sin D = 5/6`;
          dBadge(ox, Cpt.y + 54, badgeTxt, C.gold);
        }

        dVertex(O1, 'O₁(R₁=9/2)', C.green, { x: 0, y: BRD.W < 560 ? 34 : 16, align: 'center' }); // [표시 보강] 휴대폰에서는 원 중심 라벨을 아래로 내려 각 값(sin D)과 겹치지 않게
        dVertex(O2, 'O₂(R₂=3)', C.cyan, { x: 0, y: BRD.W < 560 ? 34 : 16, align: 'center' });
        dVertex(B, 'B', C.green, { x: -12, y: -8, align: 'right' });
        dVertex(D, 'D', C.cyan, { x: 12, y: BRD.W < 560 ? 12 : -8, align: 'left' }); // [표시 보강] 휴대폰에서 sin D 글자와 겹치지 않게
        dVertex(Cpt, 'C', C.white, { x: 12, y: 8, align: 'left' });
        dVertex(A, 'A [공통현 길이 드래그]', C.gold, { x: 0, y: -16, align: 'center' }, true, (sPos) => {
          const m = toMath(sPos.x, sPos.y, oxF, oy, sc);
          const nextAc = Math.max(3.0, Math.min(5.8, Math.abs(m.y) * 2));
          onSliderInput((nextAc - 3.0) / 2.8);
        });

        setMetric(
          `현재 AC = ${acLen.toFixed(2)} | sin B = ${sinB.toFixed(3)}, sin D = ${sinD.toFixed(3)} (조건: sin B = 5/9 ➔ AC = 5, sin D = 5/6)`,
          `현재 공통현 AC = ${acLen.toFixed(2)} | sin B ≈ ${sinB.toFixed(3)}, sin D ≈ ${sinD.toFixed(3)}`
        );
        return;
      }

      // -----------------------------------------------------------------------
      // 🌱 [기본 5] bas-5: 두 수선의 발 D, E와 외접원 지름 BC=6, DE = BC cos A
      // [P0-1 수리] 3단계 배지에서 현재 ∠A에 대한 DE 값과 조건(∠A = π/3 ➔ DE = 3)을 함께 명시
      // -----------------------------------------------------------------------
      if (id === 'bas-5') {
        const sc = u * 0.92;
        const cy = oy + sc * 1.3;
        const a = 6.0;
        const degA = 30 + t * 45; // t = 0.6667 -> degA = 60 (π/3)
        const radA = (degA * Math.PI) / 180;
        const cosA = Math.cos(radA);
        const isTarget = Math.abs(degA - 60) < 1.2;

        const R_abc = a / (2 * Math.sin(radA));
        const angOffset = 0.12;
        const O_y = R_abc * Math.cos(radA);
        const Ax = R_abc * Math.sin(angOffset);
        const Ay = O_y + R_abc * Math.cos(angOffset);
        const Bx = -a / 2, By = 0;
        const Cx = a / 2, Cy = 0;

        const projFoot = (Px, Py, Ux, Uy, Vx, Vy) => {
          const dx = Vx - Ux, dy = Vy - Uy;
          const k = ((Px - Ux) * dx + (Py - Uy) * dy) / (dx * dx + dy * dy);
          return { x: Ux + k * dx, y: Uy + k * dy };
        };
        const Dm = projFoot(Bx, By, Ax, Ay, Cx, Cy);
        const Em = projFoot(Cx, Cy, Ax, Ay, Bx, By);
        const deLen = Math.hypot(Dm.x - Em.x, Dm.y - Em.y);

        const A = toScr(Ax, Ay, ox, cy, sc);
        const B = toScr(Bx, By, ox, cy, sc);
        const Cpt = toScr(Cx, Cy, ox, cy, sc);
        const D = toScr(Dm.x, Dm.y, ox, cy, sc);
        const E = toScr(Em.x, Em.y, ox, cy, sc);
        const M = toScr(0, 0, ox, cy, sc);

        dPoly([A, B, Cpt], 'rgba(56, 189, 248, 0.10)', C.cyan, 2.6);
        dLine(B, D, 'rgba(251, 191, 36, 0.7)', 2.0, [5, 4]);
        dLine(Cpt, E, 'rgba(251, 191, 36, 0.7)', 2.0, [5, 4]);
        dLine(D, E, C.red, 3.0);

        const degLabel = isTarget ? 'π/3 (60°)' : Math.abs(degA - 45) < 1 ? 'π/4 (45°)' : Math.abs(degA - 30) < 1 ? 'π/6 (30°)' : `${degA.toFixed(0)}°`;
        dArcAngle(A, B, Cpt, `∠A = ${degLabel}`, C.gold, 26);
        drawDimension(B, Cpt, 30, 'BC = 6', C.cyan);

        if (step >= 1) {
          drawRightAngle(D, A, B, 11, C.gold);
          drawRightAngle(E, A, Cpt, 11, C.gold);
        }

        if (step >= 2) {
          dCircle(M, (a / 2) * sc, C.purple, 'rgba(192, 132, 252, 0.08)', 2.6, [6, 4]);
          dVertex(M, 'M(외접원 중심, R=3)', C.purple, { x: 0, y: -14, align: 'center' });
        }

        if (step >= 3) {
          dPoly([A, D, E], 'rgba(251, 191, 36, 0.22)', C.gold, 2.8, true);
          // [표시 보강] △ADE ∽ △ABC: ∠ADE = ∠ABC (청색 한 겹), ∠AED = ∠ACB (분홍 두 겹) — 같은 각은 같은 색·같은 호
          dArcAngle(D, A, E, 'x', C.cyan, 20); dArcAngle(B, A, Cpt, 'x', C.cyan, 24);
          dArcAngle(E, A, D, 'y', C.pink, 20, 2); dArcAngle(Cpt, A, B, 'y', C.pink, 24, 2);
          dBadge((D.x + E.x) / 2, (D.y + E.y) / 2 - 16, `DE = BC cos A = ${deLen.toFixed(2)}`, C.red);
          const badgeTxt = isTarget
            ? '조건 만족 (∠A = π/3): 지름 BC = 6 ➔ R = 3  |  DE = 6 cos(π/3) = 3'
            : `지름 BC = 6 ➔ R = 3 (불변)  |  현재 DE = ${deLen.toFixed(2)} (조건 ∠A = π/3일 때 DE = 3)`;
          dBadge(ox, B.y + 56, badgeTxt, C.gold);
        }

        dVertex(B, 'B', C.white, { x: -12, y: 4, align: 'right' });
        dVertex(Cpt, 'C', C.white, { x: 12, y: 4, align: 'left' });
        dVertex(D, 'D', C.red, { x: 12, y: -4, align: 'left' });
        dVertex(E, 'E', C.red, { x: -12, y: -4, align: 'right' });
        dVertex(A, 'A [상하 드래그]', C.gold, { x: 0, y: -16, align: 'center' }, true, (sPos) => {
          const m = toMath(sPos.x, sPos.y, ox, cy, sc);
          const nextDeg = solveDegAFromHeight(m.y, a, angOffset);
          onSliderInput((nextDeg - 30) / 45);
        });

        setMetric(
          `현재 ∠A = ${degLabel} | 외접원 반지름 R = 3, DE = 6 cos A = ${deLen.toFixed(2)} (조건: ∠A = π/3 ➔ DE = 3)`,
          `현재 ∠A = ${degLabel}, cos A ≈ ${cosA.toFixed(2)} | 선분 DE ≈ ${deLen.toFixed(2)}`
        );
        return;
      }

      // -----------------------------------------------------------------------
      // 🌱 [기본 6] bas-6: 삼각형의 중선의 길이 구하기 (AB=5, AC=7, BC=6, BM=CM=3)
      // [P0-1 수리] 점 D가 중점 M이 아닐 때에도 현재 AD 길이와 중점일 때의 중선 식을 구분 표기
      // -----------------------------------------------------------------------
      if (id === 'bas-6') {
        const sc = u * 1.02;
        const cy = oy + sc * 1.35;
        const c = 5.0, b = 7.0, a = 6.0;
        const cosB = (a * a + c * c - b * b) / (2 * a * c);
        const sinB = Math.sqrt(1 - cosB * cosB);
        const h = c * sinB;

        const Bx = -3.0, By = 0;
        const Cx = 3.0, Cy = 0;
        const Ax = Bx + c * cosB, Ay = h;

        const bd = 1.5 + t * 3.0; // t = 0.50 -> bd = 3.0 (중점 M)
        const cd = a - bd;
        const Dx = Bx + bd, Dy = 0;
        const adLen = Math.hypot(Ax - Dx, Ay - Dy);
        const isMid = Math.abs(bd - 3.0) < 0.08;

        const A = toScr(Ax, Ay, ox, cy, sc);
        const B = toScr(Bx, By, ox, cy, sc);
        const Cpt = toScr(Cx, Cy, ox, cy, sc);
        const D = toScr(Dx, Dy, ox, cy, sc);

        dPoly([A, B, Cpt], 'rgba(56, 189, 248, 0.12)', C.cyan, 2.6);
        dLine(A, D, C.gold, 3.2, [], true);

        dBadge((A.x + B.x) / 2 - 24, (A.y + B.y) / 2 - 8, 'AB = 5', C.green);
        dBadge((A.x + Cpt.x) / 2 + 26, (A.y + Cpt.y) / 2 - 8, 'AC = 7', C.cyan);

        if (step >= 1) {
          if (isMid) { markTick(B, D, 1, C.gold); markTick(D, Cpt, 1, C.gold); } // [표시 보강] 중점이면 BM = CM 같은 눈금
          drawDimension(B, D, 28, isMid ? 'BM = 3' : `BD = ${bd.toFixed(1)}`, C.green);
          drawDimension(D, Cpt, 28, isMid ? 'CM = 3' : `CD = ${cd.toFixed(1)}`, C.cyan);
        }

        if (step >= 2) {
          dArcAngle(D, A, B, 'θ', C.red, 24);
          dArcAngle(D, Cpt, A, 'π - θ', C.cyan, 30);
          dBadge((A.x + D.x) / 2 + 34, (A.y + D.y) / 2, isMid ? 'AM = 2√7 (≈5.29)' : `AD ≈ ${adLen.toFixed(2)}`, C.gold);
        }

        if (step >= 3) {
          const badgeTxt = isMid
            ? '중점 M 일치 (BM=CM=3): 5² + 7² = 2(AM² + 3²)  ➔  AM = √28 = 2√7'

      // -----------------------------------------------------------------------

      // -----------------------------------------------------------------------

        const O = toScr(Ox, Oy, ox, oy, sc);

      // [P0-1 수리] 3단계 배지에서 현재 슬라이더의 AC, BD 제곱합(=68 불변)과 조건 AC=7 대입 결과를 분리 표기하여 모순 제거
      // -----------------------------------------------------------------------
      if (id === 'adv-7') {
        const sc = u * 0.90;
        const cy = oy + sc * 1.05;

        // [표시 보강] 평행사변형: 마주 보는 변은 같은 눈금(AB = DC 한 줄, AD = BC 두 줄)과 평행 표시
        markTick(A, B, 1, C.white); markTick(D, Cpt, 1, C.white); markTick(A, D, 2, C.white); markTick(B, Cpt, 2, C.white);
        markPar(A, B, 1); markPar(D, Cpt, 1); markPar(B, Cpt, 2); markPar(A, D, 2);
        dBadge((A.x + B.x) / 2 - 26, (A.y + B.y) / 2, 'AB = 3', C.green);

        }

        if (step >= 2) {
          dBadge((A.x + Cpt.x) / 2 - 20, (A.y + Cpt.y) / 2 - 14, isTarget ? 'AC = 7' : `AC ≈ ${acLen.toFixed(2)}`, C.red);
          dBadge((B.x + D.x) / 2 + 28, (B.y + D.y) / 2 - 14, isTarget ? 'BD = √19 (≈4.36)' : `BD ≈ ${bdLen.toFixed(2)}`, C.cyan);
        }

        if (step >= 3) {
          const badgeTxt = isTarget
            ? '조건 만족 (AC = 7): 7² + BD² = 2(3² + 5²) = 68  ➔  BD² = 19  ➔  BD = √19 (≈4.36)'
            : `현재 ${acLen.toFixed(2)}² + ${bdLen.toFixed(2)}² = 68 = 2(3²+5²) (항상 일정)  |  조건 AC = 7일 때 BD = √19`;
          dBadge(ox, A.y + 54, badgeTxt, C.gold);
        }

        dVertex(A, 'A', C.white, { x: -12, y: 6, align: 'right' });
        dVertex(D, 'D', C.white, { x: 12, y: 6, align: 'left' });
        dVertex(Cpt, 'C', C.white, { x: 12, y: -8, align: 'left' });
        dVertex(B, 'B [각도 드래그]', C.gold, { x: -10, y: -14, align: 'right' }, true, (sPos) => {
          const m = toMath(sPos.x, sPos.y, ox, cy, sc);
          const ang = (Math.atan2(Math.max(0.5, m.y - Ay), m.x - Ax) * 180) / Math.PI;
          const clamped = Math.max(30, Math.min(135, ang));
          onSliderInput((clamped - 30) / 105);
        });

        setMetric(
          `현재 AC ≈ ${acLen.toFixed(2)}, BD ≈ ${bdLen.toFixed(2)} | AC² + BD² = ${(acLen * acLen + bdLen * bdLen).toFixed(1)} = 2(3²+5²) = 68 (항상 일정)`,
          `현재 AC ≈ ${acLen.toFixed(2)}, BD ≈ ${bdLen.toFixed(2)} | 제곱의 합 AC² + BD² = ${(acLen * acLen + bdLen * bdLen).toFixed(1)}`
        );
        return;
      }

      // -----------------------------------------------------------------------
      // 🔥 [심화 8] adv-8: 대각선 BD를 평행이동하여 합체 삼각형 △ACE와 넓이 구하기
      // [P1-2 수리] 초기 진입(t=0) 시에는 원래 대각선 BD 위에 놓여 있고, 슬라이더 조작 또는 2단계 이상 진입 시 평행이동 진행
      // -----------------------------------------------------------------------
      if (id === 'adv-8') {
        const sc = u * 0.82;
        const cx = ox - sc * 2.2;
        const cy = oy + sc * 1.1;

        const a = 4.0, b = 3.0;
        const rad = Math.PI / 3;
        const h = b * Math.sin(rad);
        const shift = b * Math.cos(rad);

        const Ax = 0, Ay = 0;
        const Bx = a, By = 0;
        const Dx = shift, Dy = h;
        const Cx = a + shift, Cy = h;
        const Ex = 2 * a, Ey = 0;

        const moveRatio = step === 2 ? state.animT * t : t;
        const mB = toScr(Bx + a * moveRatio, 0, cx, cy, sc);
        const mD = toScr(Dx + a * moveRatio, h, cx, cy, sc);

        const A = toScr(Ax, Ay, cx, cy, sc);
        const B = toScr(Bx, By, cx, cy, sc);
        const Cpt = toScr(Cx, Cy, cx, cy, sc);
        const D = toScr(Dx, Dy, cx, cy, sc);
        const E = toScr(Ex, Ey, cx, cy, sc);

        dPoly([A, B, Cpt, D], 'rgba(52, 211, 153, 0.14)', C.green, 2.6);
        // [표시 보강] 평행사변형 ABCD: 마주 보는 변은 같은 눈금(AB = DC 한 줄, AD = BC 두 줄)과 평행 표시
        markTick(A, B, 1, C.white); markTick(D, Cpt, 1, C.white); markTick(A, D, 2, C.white); markTick(B, Cpt, 2, C.white);
        markPar(A, B, 1); markPar(D, Cpt, 1); markPar(B, Cpt, 2); markPar(A, D, 2);
        dArcAngle(A, B, D, 'π/3', C.gold, 24);
        dBadge((A.x + D.x) / 2 - 24, (A.y + D.y) / 2 - 6, 'AD = 3', C.green);
        drawDimension(A, B, 26, 'AB = 4', C.green);

        if (step >= 1) {
          dLine(A, Cpt, C.red, 2.8);
          dLine(B, D, 'rgba(56, 189, 248, 0.5)', 2.2, [5, 4]);
        }

        if (moveRatio > 0.01) {
          dPoly([B, mB, mD, D], 'rgba(56, 189, 248, 0.10)', null, 0);
        }
        dLine(mB, mD, C.cyan, 3.2, [], true);
        if (moveRatio > 0.02) { markPar(B, D, 2, C.cyan); markPar(mB, mD, 2, C.cyan); } // [표시 보강] 이동한 대각선은 원래 BD와 평행(같은 '›' 두 줄)

        if (step >= 2 || moveRatio > 0.02) {
          dLine(B, E, C.gold, 2.4, [5, 4]);
          dLine(D, Cpt, C.gold, 2.0, [4, 4]);
          // [표시 보강] DBEC는 평행사변형: BE = DC (= AB) 눈금, DC ∥ BE, 동위각 ∠CBE = ∠DAB = π/3
          markTick(B, E, 1, C.white);
          dArcAngle(B, Cpt, E, 'π/3', C.gold, 24);
          drawDimension(B, E, 26, `이동 거리 = ${(a * moveRatio).toFixed(1)}`, C.cyan);
          dVertex(E, 'E', C.cyan, { x: 12, y: 4, align: 'left' });
        }

        if (step >= 3) {
          dPoly([A, Cpt, E], 'rgba(251, 191, 36, 0.20)', C.gold, 2.8, true);
          drawDimension(A, E, 52, 'AE = AB + BE = 4 + 4 = 8  |  넓이(△ACE) = 넓이(ABCD) = 6√3', C.gold);
        }

        dVertex(A, 'A', C.white, { x: -12, y: 4, align: 'right' });
        dVertex(B, 'B', C.white, { x: -10, y: -14, align: 'right' });
        dVertex(D, 'D', C.white, { x: -10, y: -12, align: 'right' });
        dVertex(Cpt, 'C', C.white, { x: 10, y: -12, align: 'left' });
        dVertex(mB, moveRatio < 0.02 ? 'BD [우측 평행이동 드래그]' : '평행이동 [드래그]', C.gold, { x: 10, y: -15, align: 'left' }, true, (sPos) => {
          const m = toMath(sPos.x, sPos.y, cx, cy, sc);
          const nextT = Math.max(0, Math.min(1, (m.x - Bx) / a));
          onSliderInput(nextT);
        });

        setMetric(
          `대각선 BD 평행이동 ${Math.round(t * 100)}% | BE = DC = 4 ➔ AE = 8, 넓이(△ACE) = 넓이(ABCD) = 6√3 (≈ 10.39)`,
          `대각선 BD 평행이동 ${Math.round(t * 100)}% (이동 거리 = ${(a * moveRatio).toFixed(2)}, 밑변 총길이 = ${(a + a * moveRatio).toFixed(2)})`
        );
        return;
      }
    }

    /* ==========================================================================
       2.0 장면 구성 — 원본의 문항 16개를 '기본 / 심화' 두 묶음(탭) × 8장면으로 나눕니다.
       ========================================================================== */
    const tex = APLab.tex;
    const arrow = (s) => (typeof s === 'string' ? s.replace(/➔/g, '→') : s);
    PROBLEMS.forEach((p) => {
      ['unit', 'badge', 'tabLabel', 'title', 'statement', 'sliderTitle', 'aha', 'alg', 'answer', 'strategyLabel'].forEach((k) => { p[k] = arrow(p[k]); });
      p.snaps.forEach((sn) => { sn.label = arrow(sn.label); });
      p.steps.forEach((st) => { st.title = arrow(st.title); st.desc = arrow(st.desc); });
      p.auxHints = p.auxHints.map(arrow);
    });
    // 원본 renderMathHTML: $수식$ 과 **굵게** 를 HTML로 (이모지 꼬리표는 화면에서 뺍니다)
    const rm = (str) => (str ? APLab.stripEmoji(str)
      .replace(/\$([^$]+)\$/g, (_, m) => tex(m))
      .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>') : '');
    const stepName = (st) => st.title.replace(/^Step\s*\d+\.\s*/, '');
    const SHORT = {
      'bas-1': '[1] 수선의 발', 'bas-2': '[2] 세 변과 높이', 'bas-3': '[3] 공통현·두 외접원', 'bas-4': '[4] 외접원 반지름 비',
      'bas-5': '[5] 두 수선의 발', 'bas-6': '[6] 중선의 길이', 'bas-7': '[7] 내접원·접선', 'bas-8': '[8] 직각삼각형의 원',
      'adv-1': '[1] 수선의 발 삼각형', 'adv-2': '[2] 내분점', 'adv-3': '[3] 접선과 할선', 'adv-4': '[4] 두 할선',
      'adv-5': '[5] 정삼각형과 원', 'adv-6': '[6] 대각선의 곱', 'adv-7': '[7] 평행사변형 대각선', 'adv-8': '[8] 대각선 평행이동'
    };
    const initialSlider = (p) => (p.initialT !== undefined ? p.initialT : p.defaultT);
    let lastStep = {};

    function frame(idx, b, s, v) {
      BRD = b;
      SS = s;
      handleN = 0;
      state.probIdx = idx;
      state.auxStep = Math.min(3, s.step || 0);
      state.sliderT = s.t;
      state.animT = 1;
      const rect = layoutRect(b);
      METRIC = '';
      drawScene(rect);
      if (METRIC) v.summary = METRIC.replace(/➔/g, '→');
    }

    function sceneOf(p) {
      const idx = PROBLEMS.indexOf(p);
      const stepsHtml = p.steps.map((st) => `<p><strong>Step ${st.step}. ${rm(stepName(st))}</strong><br>${rm(st.desc)}</p>`).join('');
      return {
        id: p.id,
        title: p.title,
        short: SHORT[p.id],
        question: rm(p.statement),
        guide: `<b>${p.sliderTitle.replace(/[:：]\s*$/, '')}</b> — ${p.auxHints[0]} <b>정리</b> 탭에서 Step을 누르면 보조선이 하나씩 나타나고, 3단계까지 보면 정답이 열립니다.`,
        startStep: 0,
        controls: ['t'],
        presets: (s) => (s.step >= 3 ? p.snaps.map((sn) => ({ label: sn.label, set: { t: sn.t }, ms: 450, on: (st) => Math.abs(st.t - sn.t) < 0.003 })) : []),
        steps: p.steps.map(stepName),
        notesTitle: '핵심 발견',
        enter: (s, lab) => {
          s.cur = p.id;
          s.t = initialSlider(p);
          lastStep[p.id] = 0;
          if (lab && s === lab.s) lab.params.t.label = p.sliderTitle.replace(/[:：]\s*$/, ''); // 실제 장면 입장일 때만 조절 막대의 이름을 바꿉니다
        },
        solution: {
          standardTitle: APLab.stripEmoji(p.strategyLabel) || '실전 풀이', standardTag: '단계별',
          quickTitle: '풀이 비교', quickTag: '비교',
          standard: { steps: stepsHtml },
          quick: { steps: rm(p.alg) }
        },
        problem: { tag: p.badge, text: rm(p.statement), answer: p.answer, snap: () => ({ t: p.defaultT }) },
        view: (s) => {
          const step = Math.min(3, s.step || 0);
          // 원본 setAuxStep의 심화 8 특수 처리: 단계를 켜면 평행이동 정도를 정답 위치로, 끄면 처음 위치로
          if (p.id === 'adv-8' && lastStep[p.id] !== step) {
            if (step >= 2 && s.t < 0.1) s.t = p.defaultT;
            else if (step === 0) s.t = 0;
          }
          lastStep[p.id] = step;
          const out = {};
          if (step >= 1) { const st = p.steps[step - 1]; out.formula = `<p><strong>Step ${st.step}. ${rm(stepName(st))}</strong><br>${rm(st.desc)}</p>`; }
          if (step >= 3) out.notes = rm(p.aha);
          return out;
        },
        draw: (b, s, v) => frame(idx, b, s, v)
      };
    }
    const isAdv = (p) => p.id.startsWith('adv-');
    const groups = [
      { id: 'bas', title: '기본 8선', short: '기본 8', scenes: PROBLEMS.filter((p) => !isAdv(p)).map(sceneOf) },
      { id: 'adv', title: '심화 8선', short: '심화 8', scenes: PROBLEMS.filter(isAdv).map(sceneOf) }
    ];

    APLab.createLab({
      id: 'alg-sine-cosine-law',
      title: '사인·코사인법칙 도형 탐구',
      courseName: '대수',
      unit: 'Ⅱ. 삼각함수',
      courseColor: 'var(--m-amber)',
      home: '../index.html#algebra',
      legacy: '../../labs/대수/part2b.html',
      board: { kind: 'figure', focus: { x: [0, 1000], y: [0, 700] }, pad: 0.045, minZoom: 0.6, maxZoom: 4 },
      params: {
        t: {
          value: 0.5, min: 0, max: 1, step: 0.005, color: 'amber', label: '도형 조작',
          hint: '그림의 후광이 있는 점을 끌어도 같은 값이 바뀝니다',
          format: (v) => `${Math.round(v * 100)}%`,
          onInput: (s) => {
            if (s.step >= 3) {
              const p = PROBLEMS.find((q) => q.id === s.cur);
              for (const sn of p.snaps) if (Math.abs(s.t - sn.t) < 0.025) { s.t = sn.t; break; }
            }
          }
        }
      },
      groups
    });

});
</script>
