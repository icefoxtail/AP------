<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a100e">
<title>회전체 · AP Math 실험실</title>
<meta name="description" content="중1 회전체: 평면도형을 회전축 둘레로 돌려 회전체 만들기(원기둥·원뿔·원뿔대·구, 회전체를 보고 평면도형 찾기), 회전체의 단면(축에 수직·축을 포함), 원기둥·원뿔의 전개도와 중심각, 원뿔 옆면 위 끈의 최단거리를 직접 조절하며 탐구하고 정리와 5지선다 문제로 확인합니다.">
<script>try{var t=localStorage.getItem('apl:theme');t=t?JSON.parse(t):'paper';document.documentElement.setAttribute('data-theme',t==='board'?'board':'paper')}catch(e){document.documentElement.setAttribute('data-theme','paper')}</script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="../kit/vendor/katex/katex.min.css">
<link rel="stylesheet" href="../kit/apl.css">
<script defer src="../kit/vendor/katex/katex.min.js"></script>
<script defer src="../kit/vendor/qrcode.js"></script>
<script defer src="../kit/apl-core.js"></script>
<script defer src="../kit/apl-board.js"></script>
<script defer src="../kit/apl-shell.js"></script>
</head>
<body>
<noscript>이 실험실을 보려면 브라우저에서 자바스크립트를 켜야 합니다.</noscript>
<script>
/* ==========================================================================
   중1 · 회전체 (AP Math Lab 2.0) — Ⅲ-1. 다면체와 회전체 중 「회전체」 부분 (다면체는 g7-polyhedra)
   탭(order 순): ① 회전체 만들기(10, 7장면) · ② 회전체의 단면(20, 6) · ③ 원기둥·원뿔의 전개도(30, 5) · ④ 원뿔 옆면의 최단거리(40, 4)
   이 파일은 얇은 껍데기입니다. 공용 도구는 labs/g7-solids/core.js(틀·문제·맞춤), 3차원 그리기는 solid3d.js,
   각 탭은 t1~t4.js 모듈이 window.APL_RV_GROUPS 에 { order, id, title, short, params, scenes } 를 등록하면 order 순으로 붙습니다.
   원칙(학생 가독성)
   - 입체는 처음부터 3차원 보기 · 그림 속에 길이·각을 크게 · 선은 최소(옆 윤곽 2줄 + 밑면 타원 + 점선) · 색은 3가지
   - 색의 역할: 하늘=회전체 · 노랑=평면도형·구하는 길이·끈 · 분홍=회전축·자르는 평면 · 초록=계산 결과
   - 평면도형이 축을 도는 것·시점 돌리기는 제자리 회전, 위치 이동은 가로로만(굴리기·밀기)
   - 조절 막대·손잡이로 도형을 바꾸면 그림 속 글자·식·보기·정답이 그 값으로 다시 계산됩니다. 탐구 → 정리(교과서 해결 전략 순서) → 문제(5지선다 + 숫자 바꾸기)
   ========================================================================== */
window.addEventListener('DOMContentLoaded', function () {
'use strict';
const MODULES = ['core', 'solid3d', 't1', 't2', 't3', 't4'];
const loadScript = (src) => new Promise((res) => {
  const el = document.createElement('script');
  el.src = src; el.async = false;
  el.onload = () => res(true);
  el.onerror = () => { el.remove(); res(false); }; // 아직 없는 모듈은 건너뜁니다
  document.head.append(el);
});

function start() {
  const mods = (window.APL_RV_GROUPS || []).filter((g) => g && Array.isArray(g.scenes) && g.scenes.length);
  const groups = mods.slice().sort((a, b) => (a.order || 0) - (b.order || 0)).map((g) => ({ id: g.id, title: g.title, short: g.short || g.title, scenes: g.scenes }));
  const params = {};
  mods.forEach((g) => Object.assign(params, g.params || {}));
  const clamp = APLab.clamp;
  APLab.createLab({
    id: 'g7-solids',
    title: '회전체',
    courseName: '중1',
    unit: '입체도형 · 회전체',
    courseColor: 'var(--m-sky)',
    home: '../index.html#g7',
    legacy: '../../labs/g7/다면체·회전체&겨냥도·전개도.html',
    board: {
      kind: 'cartesian', grid: false, pad: 0.02, minZoom: 0.5, maxZoom: 6,
      // 빈 곳을 끌면 시점이 제자리에서 돌아갑니다(좌우 회전·위아래 기울기). 눕힌 장면은 좌우로만.
      orbit: (s, dx, dy) => {
        if (s.soFix) return;
        if (s.soPO) { s.soPitch = clamp((s.soPitch == null ? 22 : s.soPitch) + dy * 0.4, 6, 80); return; } // 가로 이동이 화면 가로가 되도록 좌우 돌리기는 막아요
        if (s.soLay) { s.soYawL = clamp((s.soYawL == null ? -32 : s.soYawL) + dx * 0.4, -80, -10); return; }
        s.soYaw = (s.soYaw || 0) + dx * 0.5;
        if (s.soYaw > 180) s.soYaw -= 360;
        if (s.soYaw < -180) s.soYaw += 360;
        s.soPitch = clamp((s.soPitch == null ? 22 : s.soPitch) + dy * 0.4, 6, 80);
      }
    },
    enter: (s, sc, lab) => { if (lab && lab.board && s === lab.s) { lab.board.fit(); lab.board.setPanes(null); lab.board.setInsets({ top: 0, right: 0, bottom: 0, left: 0 }); } },
    params,
    groups
  });
}
Promise.all(MODULES.map((m) => loadScript(`g7-solids/${m}.js`))).then(start);
});
</script>
</body>
</html>
