<script>
/* ==========================================================================
   중1 · 다면체·회전체 & 겨냥도·전개도 종합 (AP Math Lab 2.0 이식본) — 4개 탐구관 × 18개 장면
   원본: labs/g7/다면체·회전체&겨냥도·전개도.html
   이식 방식: "호환 이식" — 원본의 내용(getSpec)과 3D 그리기 코드(renderTab1~4, project3D, 경첩 회전, draw3D…)를 글자 그대로 옮기고,
   원본이 캔버스에 직접 그리던 부분(ctx)만 아래 얇은 겉포장이 무대 캔버스·테마 색에 연결합니다.
   - 탐구관 → 묶음(탭), 세부 도형 → 장면. 치수(n·h) 단추, 진행 슬라이더(접기·분해·회전), 관찰 렌즈, 시점 단추, 개미 주행은 조작부로 옮겼습니다.
   - 아래쪽 "구조·각도 비율 모니터" 띠는 무대 아래 별도 줄(테이프)로, 우측 2D 단면·전개도 상자는 넓은 화면에서만 그림 오른쪽에 둡니다.
   - 빈 곳을 끌면 회전(무대 공통), 두 손가락·휠로 확대. 자동 회전은 조작부의 단추로.
   - 해설의 ➔ ❌ ⭕ 는 화면에서 → × ○ 로 바꿔 보여 줍니다(셸이 이모지를 떼어 내므로 뜻이 사라지지 않게).
   [2.0 수정] 코드 안에 같은 표시가 있습니다.
     ① 고정 배율(약 46~52px) → 도형을 감싸는 상자에 맞춘 자동 배율·중심(넓은 화면에서도 그림이 작지 않고, 돌려도 크기가 변하지 않음)
     ② 그림·해설에 아무 영향이 없던 조작(진행도 슬라이더·단계·실행 단추, 치수 단추, 관찰 렌즈)은 해당 장면에서 숨김(장면마다 값을 바꿔 그려 보고 가려냄)
     ③ 좁은 화면에서 가장자리 이름표가 잘리지 않게 무대 안쪽으로 밀어 넣음
     ④ 2D 설계도 상자는 무대 폭 640px 이상에서만 표시(원본은 520px 이상이라 상자가 그림을 가렸음)
   ========================================================================== */
window.addEventListener('DOMContentLoaded', function () {
  const tex = APLab.tex;
  const { clamp } = APLab;
  const R2D = 180 / Math.PI, D2R = Math.PI / 180;

  /* ===== 원본 상태 객체(이름 그대로) — 매 프레임 2.0 셸 상태에서 채웁니다 ===== */
    const state = {
      mode: 1,
      sub: { 1: 'prismN', 2: 'cubeCross', 3: 'spin4', 4: 'cylRoll' },
      lens: 'all',       // 'all' | 'wire' | 'section' | 'aux'
      dualView: true,
      activePartIdx: -1,
      n: 4,
      h: 5,
      animProg: 0.75,
      antActive: false,
      antProg: 0.0,
      yaw: (-32 * Math.PI) / 180,
      pitch: (28 * Math.PI) / 180
    };

  /* ===== 원본 그대로: 장면 목록 ===== */
    const SUB_MENUS = {
      1: [
        { id: 'prismN', label: '📐 n각기둥 층별 분해' },
        { id: 'pyramidN', label: '⛺ n각뿔 층별 분해' },
        { id: 'frustumN', label: '🪣 n각뿔대(평행절단)' },
        { id: 'platonic5', label: '💎 정다면체 5종 쇼케이스' },
        { id: 'vertex360', label: '🌟 정다면체 360° 한계실험' }
      ],
      2: [
        { id: 'cubeCross', label: '➕ 정육면체(1-4-1·지퍼)' },
        { id: 'cubeStairs', label: '⚡ 계단형(2-2-2·2-3-1)' },
        { id: 'badNet', label: '❌ 가짜 전개도(겹침충돌!)' },
        { id: 'diceArrow', label: '🎲 주사위 눈7·화살표 방향' },
        { id: 'octaNet', label: '✂️ 정팔면체·사각뿔 폴딩' }
      ],
      3: [
        { id: 'spin4', label: '🔄 회전체 4종 360° 스핀생성' },
        { id: 'revSection', label: '🔪 회전체 축단면 vs 수직단면' },
        { id: 'triAxis', label: '💎 직각삼각형 회전축 변경(쌍원뿔!)' },
        { id: 'cubeCut', label: '🧊 정육면체 단면(삼각~정육각형!)' }
      ],
      4: [
        { id: 'cylRoll', label: '🛢️ 원기둥 롤링(가로=2πr)' },
        { id: 'coneSector', label: '⛺ 원뿔 부채꼴(중심각 r/a)' },
        { id: 'frustumBelt', label: '🪣 원뿔대(휘어진 부채꼴띠)' },
        { id: 'antShortest', label: '🐜 기둥·원뿔 옆면 개미 최단거리' }
      ]
    };

  /* ===== 원본 그대로: 3D 벡터 · 로드리게스 경첩 회전 유틸리티 ===== */
    function vecAdd(a, b) { return { x: a.x + b.x, y: a.y + b.y, z: a.z + b.z }; }
    function vecSub(a, b) { return { x: a.x - b.x, y: a.y - b.y, z: a.z - b.z }; }
    function vecDot(a, b) { return a.x * b.x + a.y * b.y + a.z * b.z; }
    function vecCross(a, b) {
      return { x: a.y * b.z - a.z * b.y, y: a.z * b.x - a.x * b.z, z: a.x * b.y - a.y * b.x };
    }
    function vecNorm(v) {
      const len = Math.hypot(v.x, v.y, v.z) || 1;
      return { x: v.x / len, y: v.y / len, z: v.z / len };
    }
    function rotateAroundAxis(p, hingeP1, hingeP2, angle) {
      if (Math.abs(angle) < 1e-6) return { ...p };
      const k = vecNorm(vecSub(hingeP2, hingeP1));
      const v = vecSub(p, hingeP1);
      const cosA = Math.cos(angle), sinA = Math.sin(angle);
      const crossKV = vecCross(k, v), dotKV = vecDot(k, v);
      return vecAdd(hingeP1, {
        x: v.x * cosA + crossKV.x * sinA + k.x * dotKV * (1 - cosA),
        y: v.y * cosA + crossKV.y * sinA + k.y * dotKV * (1 - cosA),
        z: v.z * cosA + crossKV.z * sinA + k.z * dotKV * (1 - cosA)
      });
    }
    function applyHingeChain(pt, chain) {
      let cur = { ...pt };
      for (let i = chain.length - 1; i >= 0; i--) {
        cur = rotateAroundAxis(cur, chain[i].p1, chain[i].p2, chain[i].angle);
      }
      return cur;
    }
  /* ===== 원본 그대로: 장면별 수학 데이터 생성기 getSpec ===== */
    function getSpec() {
      const m = state.mode;
      const sub = state.sub[m];
      const n = state.n; // 3, 4, 5, 6
      const h = state.h; // 3, 4, 5, 6
      const nNames = { 3: '삼', 4: '사', 5: '오', 6: '육' };
      const korN = nNames[n] || '사';

      // ==================== [탭 1: 다면체(기둥·뿔·뿔대) & 정다면체 5종] ====================
      if (m === 1) {
        if (sub === 'prismN') {
          const F = n + 2, E = 3 * n, V = 2 * n;
          return {
            badge: `탐구 1-A · ${korN}각기둥 (${F}면체) — 면·모서리·꼭짓점 층별 분해`,
            hint: `슬라이더를 움직여 위·아래 밑면을 분리해 보세요! ${korN}각기둥은 <strong class="text-amber-300">밑면 2개 + 옆면 ${n}개 = ${F}면체</strong>이며, 모서리는 위층(${n})·기둥(${n})·아래층(${n}) 총 <strong class="text-sky-300">3×${n} = ${E}개</strong>입니다!`,
            actionTxt: state.animProg > 0.5 ? '🎬 층별로 분해해 세어보기' : '🎬 기둥으로 합체하기',
            dim1Name: '밑면 다각형 변 수 n', dim2Name: '기둥 높이 스케일',
            nPrefix: 'n = ', hPrefix: 'h = ',
            parts: [
              { id: 0, name: `🟡 면의 개수 F = n + 2 (${F}면체)`, desc: `윗밑면(1) + 아랫밑면(1) + 직사각형 옆면(${n})`, val: `면 ${F}개`, color: '#fbbf24', ok: true },
              { id: 1, name: `🔵 모서리의 개수 E = 3n`, desc: `위층(${n}개) + 세로기둥(${n}개) + 아래층(${n}개)`, val: `모서리 ${E}개`, color: '#38bdf8', ok: true },
              { id: 2, name: `🩷 꼭짓점의 개수 V = 2n`, desc: `위층 꼭짓점(${n}개) + 아래층 꼭짓점(${n}개)`, val: `꼭짓점 ${V}개`, color: '#f472b6', ok: true }
            ],
            totalRes: `${korN}각기둥 = ${F}면체 (V-E+F = ${V}-${E}+${F} = 2)`,
            rule: `n각기둥: 면(n+2), 모서리(3n), 꼭짓점(2n)`,
            formulaHTML: `• <strong>면(F)</strong>: ${tex(`n + 2 = ${n} + 2 = \\mathbf{${F}\\text{개}}`)} (그러므로 <strong>${F}면체</strong>!)<br/>• <strong>모서리(E)</strong>: ${tex(`3n = 3 \\times ${n} = \\mathbf{${E}\\text{개}}`)} &nbsp;|&nbsp; <strong>꼭짓점(V)</strong>: ${tex(`2n = 2 \\times ${n} = \\mathbf{${V}\\text{개}}`)}`,
            notes: `• <strong>[함정 1위]</strong>: “칠각기둥은 칠면체이다?” ➔ <strong>거짓(❌)</strong>! 밑면 2개를 더해야 하므로 칠각기둥은 <strong>구면체($7+2=9$)</strong>입니다!`,
            bars: [
              { label: `밑면 2개`, weight: 2 / F, color: '#fbbf24' },
              { label: `직사각형 옆면 ${n}개 (합쳐서 ${F}면체!)`, weight: n / F, color: '#38bdf8' }
            ]
          };
        }
        if (sub === 'pyramidN') {
          const F = n + 1, E = 2 * n, V = n + 1;
          return {
            badge: `탐구 1-B · ${korN}각뿔 (${F}면체) — 꼭짓점 1개로 모이는 삼각형 옆면`,
            hint: `각뿔은 밑면이 <strong class="text-amber-300">단 1개</strong>뿐이고, 옆면 삼각형 ${n}개가 맨 위 <strong class="text-pink-300">각뿔의 꼭짓점 1개</strong>에서 만납니다! 따라서 면은 <strong class="text-emerald-300">${n}+1=${F}개</strong>, 모서리는 <strong class="text-sky-300">2×${n}=${E}개</strong>입니다!`,
            actionTxt: state.animProg > 0.5 ? '🎬 밑면과 옆면 분리하기' : '🎬 각뿔로 합체하기',
            dim1Name: '밑면 다각형 변 수 n', dim2Name: '각뿔 높이 스케일',
            nPrefix: 'n = ', hPrefix: 'h = ',
            parts: [
              { id: 0, name: `🟡 면의 개수 F = n + 1 (${F}면체)`, desc: `아랫밑면(1개) + 삼각형 옆면(${n}개)`, val: `면 ${F}개`, color: '#fbbf24', ok: true },
              { id: 1, name: `🔵 모서리의 개수 E = 2n`, desc: `밑면 모서리(${n}개) + 옆면 모서리(${n}개)`, val: `모서리 ${E}개`, color: '#38bdf8', ok: true },
              { id: 2, name: `🩷 꼭짓점의 개수 V = n + 1`, desc: `밑면 꼭짓점(${n}개) + 맨 위 각뿔 꼭짓점(1개)`, val: `꼭짓점 ${V}개`, color: '#f472b6', ok: true }
            ],
            totalRes: `${korN}각뿔 = ${F}면체 (면 개수 = 꼭짓점 개수 = ${F}!)`,
            rule: `n각뿔: 면(n+1) = 꼭짓점(n+1), 모서리(2n)`,
            formulaHTML: `• <strong>면(F) = 꼭짓점(V)</strong>: ${tex(`n + 1 = ${n} + 1 = \\mathbf{${F}\\text{개}}`)} (유일하게 면과 꼭짓점 수가 같음!)<br/>• <strong>모서리(E)</strong>: ${tex(`2n = 2 \\times ${n} = \\mathbf{${E}\\text{개}}`)}`,
            notes: `• <strong>[1초 판별법]</strong>: “면의 개수와 꼭짓점의 개수가 같은 다면체는?” ➔ 무조건 <strong>각뿔($n+1$개)</strong>입니다!`,
            bars: [
              { label: `밑면 1개`, weight: 1 / F, color: '#fbbf24' },
              { label: `삼각형 옆면 ${n}개 (합쳐서 ${F}면체!)`, weight: n / F, color: '#f472b6' }
            ]
          };
        }
        if (sub === 'frustumN') {
          const F = n + 2, E = 3 * n, V = 2 * n;
          return {
            badge: `탐구 1-C · ${korN}각뿔대 (${F}면체) — 각뿔을 평행하게 잘라낸 아랫부분!`,
            hint: `슬라이더를 움직여 위쪽 작은 각뿔을 들어 올려보세요! 각뿔대는 옆면이 직사각형이 아니라 <strong class="text-amber-300">사다리꼴 ${n}개</strong>이며, 면·모서리·꼭짓점 개수는 <strong class="text-sky-300">${korN}각기둥(${F}, ${E}, ${V})과 100% 똑같습니다!</strong>`,
            actionTxt: state.animProg > 0.5 ? '🎬 위쪽 작은 각뿔 잘라 들어올리기' : '🎬 원래 큰 각뿔로 붙여보기',
            dim1Name: '밑면 다각형 변 수 n', dim2Name: '절단 높이 비율',
            nPrefix: 'n = ', hPrefix: 'H = ',
            parts: [
              { id: 0, name: `🟡 서로 평행하지만 합동이 아닌 두 밑면`, desc: `작은 윗밑면(1) + 큰 아랫밑면(1) ➔ 닮은 도형!`, val: `밑면 2개`, color: '#fbbf24', ok: true },
              { id: 1, name: `🟢 사다리꼴 모양의 옆면 ${n}개`, desc: `직사각형이 아니라 위로 좁아지는 사다리꼴!`, val: `옆면 ${n}개`, color: '#34d399', ok: true },
              { id: 2, name: `❌ 잘려 나간 위쪽 작은 ${korN}각뿔`, desc: `밑면에 평행한 평면으로 싹둑 잘라 제거`, val: `상단 분리`, color: '#f43f5e', ok: false }
            ],
            totalRes: `${korN}각뿔대: 면 ${F}개, 모서리 ${E}개, 꼭짓점 ${V}개 (=각기둥과 동일!)`,
            rule: `n각뿔대 개수 = n각기둥 개수 (단, 옆면은 사다리꼴!)`,
            formulaHTML: `• <strong>각기둥 vs 각뿔대 차이점</strong>:<br/>&nbsp;&nbsp;1) <strong>각기둥</strong>: 두 밑면이 평행하고 <strong>합동(크기 같음)</strong>, 옆면은 <strong>직사각형</strong><br/>&nbsp;&nbsp;2) <strong>각뿔대</strong>: 두 밑면이 평행하지만 <strong>크기가 다름</strong>, 옆면은 <strong>사다리꼴</strong>`,
            notes: `• <strong>[함정 주의]</strong>: “각뿔대의 두 밑면은 서로 합동이다?” ➔ <strong>거짓(❌)</strong>! 평행하기만 할 뿐 윗밑면이 아랫밑면보다 작습니다.`,
            bars: [
              { label: `크기가 다른 두 밑면(2개)`, weight: 2 / F, color: '#fbbf24' },
              { label: `사다리꼴 옆면 ${n}개 (총 ${F}면체)`, weight: n / F, color: '#34d399' }
            ]
          };
        }
        if (sub === 'platonic5') {
          // n=3: 정사면체, n=4: 정육면체, n=5: 정팔면체, n=6: 정십이면체/정이십면체(h로 구분)
          const idx = n === 3 ? 0 : n === 4 ? 1 : n === 5 ? 2 : h <= 4 ? 3 : 4;
          const pData = [
            { name: '정사면체 (4면체)', faceShape: '정삼각형', perV: 3, F: 4, E: 6, V: 4, note: '정삼각형 3개가 한 꼭짓점에 모임 (60°×3=180°)' },

  /* ======================================================================
     그리기 어댑터 (새로 작성한 부분)
     원본은 캔버스 2D 맥락(ctx)에 화면 픽셀로 직접 그렸습니다. 아래 ctx는 무대 캔버스를 그대로 쓰되
     ① 색을 테마 색(칠판/종이)으로 바꾸고 ② 선 굵기·글자 크기를 수업 모드 배율에 맞추고
     ③ 후광(그림자)을 테마에 맞게 켜고 끄는 얇은 겉포장입니다. 그리기 코드는 원본 글자 그대로입니다.
     ====================================================================== */
  let B = null;     // 지금 그리는 무대(APLab.Board)
  let ctx = null;   // 원본이 쓰던 이름 그대로
  let VIEW = { c: { x: 0, y: 0, z: 0 }, cx: 0, cy: 0, sc: 40 };
  const DUAL_W = 220;
  function makeCtx(b) {
    const c = b.ctx;
    const cache = new Map();
    let tag = '';
    let halo = false;
    const col = (v) => {
      if (typeof v !== 'string') return v;
      const t = b.colors.ink + '|' + b.colors.halo;
      if (t !== tag) { cache.clear(); tag = t; }
      let r = cache.get(v);
      if (r === undefined) { r = b.color(v); cache.set(v, r); }
      return r;
    };
    return new Proxy(c, {
      get(t, k) {
        if (k === 'fillText') {
          // 작은 미리보기에는 글자를 넣지 않습니다. [2.0 수정] 그림 가장자리의 이름표가 좁은 화면에서 잘리지 않도록 무대 안쪽으로 밀어 넣습니다.
          return (str, x, y, ...rest) => {
            if (b.thumb) return;
            const w = t.measureText(String(str)).width, al = t.textAlign, A = b._area();
            const x0 = al === 'center' ? x - w / 2 : al === 'right' || al === 'end' ? x - w : x;
            const lo = A.x + 4, hi = A.x + A.w - 4;
            if (x0 < lo) x += lo - x0;
            else if (x0 + w > hi) x -= Math.min(x0 + w - hi, x0 - lo);
            t.fillText(str, x, y, ...rest);
          };
        }
        const v = t[k];
        return typeof v === 'function' ? v.bind(t) : v;
      },
      set(t, k, v) {
        if (k === 'fillStyle' || k === 'strokeStyle') t[k] = col(v);
        else if (k === 'shadowColor') { halo = typeof v === 'string' && /rgba?\(\s*0\s*,\s*0\s*,\s*0/.test(v); t.shadowColor = col(v); }
        else if (k === 'shadowBlur') t.shadowBlur = b.glowOn || halo ? v : 0;
        else if (k === 'lineWidth') t.lineWidth = v * b.lw;
        else if (k === 'font') t.font = String(v).replace(/(\d+(?:\.\d+)?)px\s+[^`]*$/, (m, n) => `${Math.max(11.5, +n) * b.fs}px ${b.font}`);
        else t[k] = v;
        return true;
      }
    });
  }
  // 2D 설계도 상자는 폭이 넉넉한 화면에서만 (원본도 520px 미만에서는 숨겼습니다)
  function dualShown() {

          const b1 = { x: R * Math.cos(a1), y: R * Math.sin(a1), z: -lift };
          const t0 = { x: R * Math.cos(a0), y: R * Math.sin(a0), z: H + lift };
          const t1 = { x: R * Math.cos(a1), y: R * Math.sin(a1), z: H + lift };
          botPoly.push(b0);
          topPoly.push(t0);

          faces.push({
            pts: [
              { x: R * Math.cos(a0) + dx, y: R * Math.sin(a0) + dy, z: 0 },
              { x: R * Math.cos(a1) + dx, y: R * Math.sin(a1) + dy, z: 0 },
              { x: R * Math.cos(a1) + dx, y: R * Math.sin(a1) + dy, z: H },
              { x: R * Math.cos(a0) + dx, y: R * Math.sin(a0) + dy, z: H }
            ],
            fillColor: 'rgba(56, 189, 248, 0.34)',
            strokeColor: '#38bdf8',
            partIdx: 0,
            label: i === 0 ? `옆면(직사각형 ${n}개)` : ''
          });
        }
        faces.push({ pts: topPoly, fillColor: 'rgba(251, 191, 36, 0.48)', strokeColor: '#fbbf24', partIdx: 0, label: '윗밑면' });
        faces.push({ pts: botPoly, fillColor: 'rgba(251, 191, 36, 0.48)', strokeColor: '#fbbf24', partIdx: 0, label: '아랫밑면' });
        renderSortedFaces(faces);

        // 꼭짓점 2n개 구슬 강조
        if (state.activePartIdx === 2 || state.lens === 'wire') {
          topPoly.forEach((p, idx) => draw3DPoint(p, 5, '#f472b6', idx === 0 ? `위 꼭짓점 ${n}개` : ''));
          botPoly.forEach((p, idx) => draw3DPoint(p, 5, '#f472b6', idx === 0 ? `아래 꼭짓점 ${n}개` : ''));
        }
      } else if (sub === 'pyramidN') {
        const lift = (1 - f) * 1.1;
        const spread = (1 - f) * 0.5;
        const apex = { x: 0, y: 0, z: H + lift };
        const faces = [], botPoly = [];

        for (let i = 0; i < n; i++) {
          const a0 = (i * 2 * Math.PI) / n, a1 = ((i + 1) * 2 * Math.PI) / n;
          const midA = (a0 + a1) / 2;
          const dx = Math.cos(midA) * spread, dy = Math.sin(midA) * spread;

          botPoly.push({ x: R * Math.cos(a0), y: R * Math.sin(a0), z: -lift * 0.5 });
          faces.push({
            pts: [
              { x: dx, y: dy, z: H },
              { x: R * Math.cos(a0) + dx, y: R * Math.sin(a0) + dy, z: 0 },
              { x: R * Math.cos(a1) + dx, y: R * Math.sin(a1) + dy, z: 0 }
            ],
            fillColor: 'rgba(244, 114, 182, 0.36)',
            strokeColor: '#f472b6',
            partIdx: 0,
            label: i === 0 ? `삼각형 옆면(${n}개)` : ''
          });
        }
        faces.push({ pts: botPoly, fillColor: 'rgba(251, 191, 36, 0.48)', strokeColor: '#fbbf24', partIdx: 0, label: '밑면(단 1개!)' });
        renderSortedFaces(faces);
        draw3DPoint(apex, 6.5, '#fbbf24', `각뿔의 꼭짓점 (총 ${n + 1}개 꼭짓점)`);
      } else if (sub === 'frustumN') {
        const cutRatio = 0.52;
        const rTop = R * cutRatio;
        const liftSmall = (1 - f) * 1.6 + 0.15;
        const faces = [], topPoly = [], botPoly = [], cutBasePoly = [];

        for (let i = 0; i < n; i++) {
          const a0 = (i * 2 * Math.PI) / n, a1 = ((i + 1) * 2 * Math.PI) / n;
          const b0 = { x: R * Math.cos(a0), y: R * Math.sin(a0), z: 0 };
          const b1 = { x: R * Math.cos(a1), y: R * Math.sin(a1), z: 0 };
          const t0 = { x: rTop * Math.cos(a0), y: rTop * Math.sin(a0), z: H };
          const t1 = { x: rTop * Math.cos(a1), y: rTop * Math.sin(a1), z: H };
          botPoly.push(b0); topPoly.push(t0);

          // 각뿔대 옆면 (사다리꼴!)
          faces.push({
            pts: [b0, b1, t1, t0],
            fillColor: 'rgba(52, 211, 153, 0.38)',
            strokeColor: '#34d399',
            partIdx: 1,
            label: i === 0 ? '옆면 = 사다리꼴!' : ''
          });

          // 잘려나간 위쪽 작은 각뿔
          const sm0 = { x: rTop * Math.cos(a0), y: rTop * Math.sin(a0), z: H + liftSmall };
          const sm1 = { x: rTop * Math.cos(a1), y: rTop * Math.sin(a1), z: H + liftSmall };
          const smApex = { x: 0, y: 0, z: H * 1.9 + liftSmall };
          cutBasePoly.push(sm0);
          faces.push({
            pts: [smApex, sm0, sm1],
            fillColor: 'rgba(244, 63, 94, 0.25)',
            strokeColor: 'rgba(244, 63, 94, 0.7)',
            partIdx: 2
          });
        }
        faces.push({ pts: topPoly, fillColor: 'rgba(251, 191, 36, 0.48)', strokeColor: '#fbbf24', partIdx: 0, label: '작은 윗밑면' });
        faces.push({ pts: botPoly, fillColor: 'rgba(251, 191, 36, 0.48)', strokeColor: '#fbbf24', partIdx: 0, label: '큰 아랫밑면' });
        renderSortedFaces(faces);
        draw3DText({ x: 0, y: 0, z: H * 1.9 + liftSmall + 0.3 }, '✂️ 잘려나간 작은 각뿔', '#fda4af', 12);
      } else if (sub === 'platonic5') {
        const faces = [];
        const cz = 1.2;
        if (n === 3) {
          // 정사면체
          const v0 = { x: 0, y: 0, z: cz + 1.6 };
          const v1 = { x: 1.6, y: -0.9, z: cz - 0.8 };
          const v2 = { x: -1.6, y: -0.9, z: cz - 0.8 };
          const v3 = { x: 0, y: 1.8, z: cz - 0.8 };
          [
            [v0, v1, v2], [v0, v2, v3], [v0, v3, v1], [v1, v3, v2]
          ].forEach((pts, i) => {
            faces.push({ pts, fillColor: i < 3 ? 'rgba(251, 191, 36, 0.42)' : 'rgba(56, 189, 248, 0.35)', strokeColor: '#fbbf24', partIdx: 0 });
          });
          renderSortedFaces(faces);
          draw3DPoint(v0, 6.5, '#f472b6', '한 꼭짓점에 정삼각형 3개 모임!');
        } else if (n === 4) {
          // 정육면체
          const s = 1.25;
          const v = [
            { x: -s, y: -s, z: cz - s }, { x: s, y: -s, z: cz - s }, { x: s, y: s, z: cz - s }, { x: -s, y: s, z: cz - s },
            { x: -s, y: -s, z: cz + s }, { x: s, y: -s, z: cz + s }, { x: s, y: s, z: cz + s }, { x: -s, y: s, z: cz + s }
          ];
          [
            [v[4], v[5], v[6], v[7]], [v[0], v[1], v[5], v[4]], [v[1], v[2], v[6], v[5]],
            [v[2], v[3], v[7], v[6]], [v[3], v[0], v[4], v[7]], [v[0], v[3], v[2], v[1]]
          ].forEach((pts, i) => {
            faces.push({ pts, fillColor: i < 3 ? 'rgba(56, 189, 248, 0.42)' : 'rgba(52, 211, 153, 0.32)', strokeColor: '#38bdf8', partIdx: 0 });
          });
          renderSortedFaces(faces);
          draw3DPoint(v[5], 6.5, '#f472b6', '한 꼭짓점에 정사각형 3개 모임!');
        } else if (n === 5) {
          // 정팔면체 (위 사각뿔 + 아래 사각뿔)
          const topV = { x: 0, y: 0, z: cz + 1.85 }, botV = { x: 0, y: 0, z: cz - 1.85 };
          const eq = [
            { x: 1.7, y: 0, z: cz }, { x: 0, y: 1.7, z: cz }, { x: -1.7, y: 0, z: cz }, { x: 0, y: -1.7, z: cz }
          ];
          for (let i = 0; i < 4; i++) {
            const p0 = eq[i], p1 = eq[(i + 1) % 4];
            faces.push({ pts: [topV, p0, p1], fillColor: 'rgba(251, 191, 36, 0.42)', strokeColor: '#fbbf24', partIdx: 0 });
            faces.push({ pts: [botV, p1, p0], fillColor: 'rgba(56, 189, 248, 0.42)', strokeColor: '#38bdf8', partIdx: 1 });
          }
          renderSortedFaces(faces);
          draw3DPoint(topV, 6.5, '#f472b6', '한 꼭짓점에 정삼각형 4개 모임! (V=6, E=12, F=8)');
        } else {
          // 정십이면체 / 정이십면체 다면 구형 근사 메시
          const isIcosa = state.h >= 5;
          const phi = (1 + Math.sqrt(5)) / 2;
          const sc = 1.05;
          const rawV = [
            [-1, phi, 0], [1, phi, 0], [-1, -phi, 0], [1, -phi, 0],
            [0, -1, phi], [0, 1, phi], [0, -1, -phi], [0, 1, -phi],
            [phi, 0, -1], [phi, 0, 1], [-phi, 0, -1], [-phi, 0, 1]
          ].map(([x, y, z]) => ({ x: x * sc, y: y * sc, z: z * sc + cz }));
          const idxList = [
            [0, 11, 5], [0, 5, 1], [0, 1, 7], [0, 7, 10], [0, 10, 11],
            [1, 5, 9], [5, 11, 4], [11, 10, 2], [10, 7, 6], [7, 1, 8],
            [3, 9, 4], [3, 4, 2], [3, 2, 6], [3, 6, 8], [3, 8, 9],
            [4, 9, 5], [2, 4, 11], [6, 2, 10], [8, 6, 7], [9, 8, 1]
          ];
          idxList.forEach((tri, idx) => {
            faces.push({
              pts: [rawV[tri[0]], rawV[tri[1]], rawV[tri[2]]],
              fillColor: idx < 5 ? 'rgba(244, 114, 182, 0.48)' : 'rgba(52, 211, 153, 0.35)',
              strokeColor: isIcosa ? '#34d399' : '#fbbf24',
              partIdx: 0
            });
          });
          renderSortedFaces(faces);
          draw3DPoint(rawV[0], 6.5, '#fbbf24', isIcosa ? '정이십면체 (꼭짓점에 정삼각형 5개 모임!)' : '정십이면체 (꼭짓점에 정오각형 3개 모임!)');
        }
      } else {
        // vertex360: 한 꼭짓점에 모이는 정삼각형 n개 (3, 4, 5개는 입체로 오므라들고, 6개는 360도 평면 고정!)
        const kTri = n; // 3, 4, 5, 6
        const canFold = kTri < 6;
        const foldFactor = canFold ? f : 0; // 6개일 때는 절대 안 접힘!
        const R_tri = 2.1;
        const apexZ = foldFactor * (kTri === 3 ? 1.55 : kTri === 4 ? 1.25 : 0.85);
        const curRadius = Math.sqrt(Math.max(0.2, R_tri * R_tri - apexZ * apexZ));
        const totalAngle = (1 - foldFactor) * (kTri * (Math.PI / 3)) + foldFactor * (Math.PI * 2);

        const faces = [];
        const apex = { x: 0, y: 0, z: apexZ };
        for (let i = 0; i < kTri; i++) {
          const a0 = (i / kTri) * totalAngle;
          const a1 = ((i + 1) / kTri) * totalAngle;
          const p0 = { x: curRadius * Math.cos(a0), y: curRadius * Math.sin(a0), z: 0 };
          const p1 = { x: curRadius * Math.cos(a1), y: curRadius * Math.sin(a1), z: 0 };
          faces.push({
            pts: [apex, p0, p1],
            fillColor: !canFold
              ? 'rgba(244, 63, 94, 0.42)'
              : i % 2 === 0
              ? 'rgba(56, 189, 248, 0.45)'
              : 'rgba(251, 191, 36, 0.45)',
            strokeColor: '#ffffff',
            lineWidth: 2.2,
            label: `60° (#${i + 1})`
          });
        }
        renderSortedFaces(faces);
        draw3DPoint(
          apex,
          7,
          canFold ? '#34d399' : '#f43f5e',
          canFold ? `꼭짓점 각의 합 ${kTri * 60}° < 360° (입체 꼭짓점 생성 ⭕)` : `❌ 60°×6 = 360° 평면 타일 (빈틈이 없어 절대 입체로 안 접힘!)`
        );
      }
    }

    // ==================== [탭 2 렌더링: 정육면체·다면체 전개도 폴딩 5종] ====================
    function renderTab2PolyhedraFolding() {
      const sub = state.sub[2];
      const f = state.animProg;
      const ang = f * (Math.PI / 2);

      const cP1 = 'rgba(251, 191, 36, 0.42)', cP2 = 'rgba(56, 189, 248, 0.42)', cP3 = 'rgba(244, 114, 182, 0.42)';
      const sP1 = '#fbbf24', sP2 = '#38bdf8', sP3 = '#f472b6';

      function makeRect(x0, y0, x1, y1) {
        return [{ x: x0, y: y0, z: 0 }, { x: x1, y: y0, z: 0 }, { x: x1, y: y1, z: 0 }, { x: x0, y: y1, z: 0 }];
      }

      if (sub === 'cubeCross' || sub === 'cubeStairs' || sub === 'badNet' || sub === 'diceArrow') {
        const L = 1.45, h = L / 2;
        const hNorth = { p1: { x: -h, y: h, z: 0 }, p2: { x: h, y: h, z: 0 }, angle: ang };
        const hSouth = { p1: { x: h, y: -h, z: 0 }, p2: { x: -h, y: -h, z: 0 }, angle: ang };
        const hWest = { p1: { x: -h, y: -h, z: 0 }, p2: { x: -h, y: h, z: 0 }, angle: ang };
        const hEast = { p1: { x: h, y: h, z: 0 }, p2: { x: h, y: -h, z: 0 }, angle: ang };
        const hEast2 = { p1: { x: h + L, y: h, z: 0 }, p2: { x: h + L, y: -h, z: 0 }, angle: ang };

        if (sub === 'cubeCross' || sub === 'diceArrow') {
          const isDice = sub === 'diceArrow';
          const rawC = makeRect(-h, -h, h, h);
          const rawA = makeRect(-h, h, h, h + L).map((p) => applyHingeChain(p, [hNorth]));
          const rawF = makeRect(-h, -h - L, h, -h).map((p) => applyHingeChain(p, [hSouth]));
          const rawB = makeRect(-h - L, -h, -h, h).map((p) => applyHingeChain(p, [hWest]));
          const rawD = makeRect(h, -h, h + L, h).map((p) => applyHingeChain(p, [hEast]));
          const rawE = makeRect(h + L, -h, h + 2 * L, h).map((p) => applyHingeChain(p, [hEast, hEast2]));

          renderSortedFaces([
            { pts: rawC, label: isDice ? '🎲 1 (바닥)' : 'C(바닥)', fillColor: cP3, strokeColor: sP3, partIdx: isDice ? 0 : 2 },
            { pts: rawE, label: isDice ? '🎲 6 (뚜껑, 1+6=7)' : 'E(뚜껑)', fillColor: cP3, strokeColor: sP3, partIdx: isDice ? 0 : 2 },
            { pts: rawA, label: isDice ? '🎲 3 (뒤 ↑)' : 'A(뒤)', fillColor: cP1, strokeColor: sP1, partIdx: isDice ? 2 : 0 },
            { pts: rawF, label: isDice ? '🎲 4 (앞, 3+4=7)' : 'F(앞)', fillColor: cP1, strokeColor: sP1, partIdx: isDice ? 2 : 0 },
            { pts: rawB, label: isDice ? '🎲 2 (왼 →)' : 'B(왼)', fillColor: cP2, strokeColor: sP2, partIdx: 1 },
            { pts: rawD, label: isDice ? '🎲 5 (오른, 2+5=7)' : 'D(오른)', fillColor: cP2, strokeColor: sP2, partIdx: 1 }
          ]);

          // 90도 오목 모퉁이 지퍼 모서리 맞물림 표시
          if (state.lens === 'aux' || state.lens === 'all') {
            const ptCorner = { x: -h, y: h, z: 0 };
            const ptK = applyHingeChain({ x: -h, y: h + L, z: 0 }, [hNorth]);
            const ptD = applyHingeChain({ x: -h - L, y: h, z: 0 }, [hWest]);
            draw3DLine(ptCorner, ptK, '#fbbf24', 4.2, false, true);
            draw3DLine(ptCorner, ptD, '#fbbf24', 4.2, false, true);
            draw3DPoint(ptK, 5.5, '#fbbf24', f > 0.9 ? 'ㄱ=ㄷ 지퍼 결합!' : '점 ㄱ');
            if (f <= 0.9) draw3DPoint(ptD, 5.5, '#38bdf8', '점 ㄷ');
          }
        } else if (sub === 'cubeStairs') {
          const hB_North = { p1: { x: -h - L, y: h, z: 0 }, p2: { x: -h, y: h, z: 0 }, angle: ang };
          const hF_East = { p1: { x: h, y: -h, z: 0 }, p2: { x: h, y: -h - L, z: 0 }, angle: ang };
          const hD_South = { p1: { x: h + L, y: -h - L, z: 0 }, p2: { x: h, y: -h - L, z: 0 }, angle: ang };

          renderSortedFaces([
            { pts: makeRect(-h, -h, h, h), label: 'C(바닥)', fillColor: cP3, strokeColor: sP3, partIdx: 2 },
            { pts: makeRect(h, -h - 2 * L, h + L, -h - L).map((p) => applyHingeChain(p, [hSouth, hF_East, hD_South])), label: 'E(C와 평행!)', fillColor: cP3, strokeColor: sP3, partIdx: 2 },
            { pts: makeRect(-h - L, h, -h, h + L).map((p) => applyHingeChain(p, [hWest, hB_North])), label: 'A(F와 평행!)', fillColor: cP1, strokeColor: sP1, partIdx: 0 },
            { pts: makeRect(-h, -h - L, h, -h).map((p) => applyHingeChain(p, [hSouth])), label: 'F', fillColor: cP1, strokeColor: sP1, partIdx: 0 },
            { pts: makeRect(-h - L, -h, -h, h).map((p) => applyHingeChain(p, [hWest])), label: 'B(D와 평행!)', fillColor: cP2, strokeColor: sP2, partIdx: 1 },
            { pts: makeRect(h, -h - L, h + L, -h).map((p) => applyHingeChain(p, [hSouth, hF_East])), label: 'D', fillColor: cP2, strokeColor: sP2, partIdx: 1 }
          ]);
        } else {
          // badNet: 안 접히는 가짜 전개도 (면 겹침 충돌!)
          const hB_North = { p1: { x: -h - L, y: h, z: 0 }, p2: { x: -h, y: h, z: 0 }, angle: ang };
          const rawC = makeRect(-h, -h, h, h);
          const rawB = makeRect(-h - L, -h, -h, h).map((p) => applyHingeChain(p, [hWest]));
          const rawD = makeRect(h, -h, h + L, h).map((p) => applyHingeChain(p, [hEast]));
          const rawE = makeRect(h + L, -h, h + 2 * L, h).map((p) => applyHingeChain(p, [hEast, hEast2]));
          const rawConflict1 = makeRect(-h, h, h, h + L).map((p) => applyHingeChain(p, [hNorth]));
          const rawConflict2 = makeRect(-h - L, h, -h, h + L).map((p) => applyHingeChain(p, [hWest, hB_North]));

          const isColliding = f > 0.72;
          renderSortedFaces([
            { pts: rawC, label: '바닥', fillColor: cP2, strokeColor: sP2, partIdx: 0 },
            { pts: rawB, label: '왼면', fillColor: cP2, strokeColor: sP2, partIdx: 0 },
            { pts: rawD, label: '오른면', fillColor: cP2, strokeColor: sP2, partIdx: 0 },
            { pts: rawE, label: '뚜껑', fillColor: cP2, strokeColor: sP2, partIdx: 0 },
            { pts: rawConflict1, label: isColliding ? '⚠️겹침충돌!' : '날개면1', fillColor: 'rgba(244, 63, 94, 0.58)', strokeColor: '#f43f5e', partIdx: 1 },
            { pts: rawConflict2, label: isColliding ? '⚠️겹침충돌!' : '날개면2', fillColor: 'rgba(251, 191, 36, 0.58)', strokeColor: '#fbbf24', partIdx: 1 }
          ]);
          if (f > 0.5) {
            draw3DText({ x: 0, y: -h, z: h }, '❌ 이쪽 면이 비어서 뻥 뚫림!', '#fda4af', 13);
          }
        }
      } else {
        // octaNet: 정사각뿔(n=3,4) 또는 정팔면체(n=5,6) 폴딩
        const s = 1.85, hs = s / 2;
        const isOcta = state.n >= 5;
        const slant = isOcta ? (Math.sqrt(3) / 2) * s : 2.05;
        const maxAngle = Math.PI - Math.acos(hs / slant);
        const aPyr = f * maxAngle;

        const hN = { p1: { x: -hs, y: hs, z: 0 }, p2: { x: hs, y: hs, z: 0 }, angle: aPyr };
        const hS = { p1: { x: hs, y: -hs, z: 0 }, p2: { x: -hs, y: -hs, z: 0 }, angle: aPyr };
        const hW = { p1: { x: -hs, y: -hs, z: 0 }, p2: { x: -hs, y: hs, z: 0 }, angle: aPyr };
        const hE = { p1: { x: hs, y: hs, z: 0 }, p2: { x: hs, y: -hs, z: 0 }, angle: aPyr };

        const triN = [{ x: -hs, y: hs, z: 0 }, { x: hs, y: hs, z: 0 }, { x: 0, y: hs + slant, z: 0 }].map((p) => applyHingeChain(p, [hN]));
        const triS = [{ x: hs, y: -hs, z: 0 }, { x: -hs, y: -hs, z: 0 }, { x: 0, y: -hs - slant, z: 0 }].map((p) => applyHingeChain(p, [hS]));
        const triW = [{ x: -hs, y: -hs, z: 0 }, { x: -hs, y: hs, z: 0 }, { x: -hs - slant, y: 0, z: 0 }].map((p) => applyHingeChain(p, [hW]));
        const triE = [{ x: hs, y: hs, z: 0 }, { x: hs, y: -hs, z: 0 }, { x: hs + slant, y: 0, z: 0 }].map((p) => applyHingeChain(p, [hE]));

        const faces = [
          { pts: triN, label: '옆면1', fillColor: cP1, strokeColor: sP1, partIdx: isOcta ? 0 : 1 },
          { pts: triS, label: '옆면2', fillColor: cP1, strokeColor: sP1, partIdx: isOcta ? 0 : 1 },
          { pts: triW, label: '옆면3', fillColor: cP1, strokeColor: sP1, partIdx: isOcta ? 0 : 1 },
          { pts: triE, label: '옆면4', fillColor: cP1, strokeColor: sP1, partIdx: isOcta ? 0 : 1 }
        ];

        if (!isOcta) {
          faces.push({ pts: makeRect(-hs, -hs, hs, hs), label: '사각뿔 밑면(1개)', fillColor: cP2, strokeColor: sP2, partIdx: 0 });
        } else {
          // 정팔면체 하단 4개 정삼각형 동시 폴딩
          const hN2 = { p1: { x: hs, y: hs, z: 0 }, p2: { x: -hs, y: hs, z: 0 }, angle: aPyr };
          const hS2 = { p1: { x: -hs, y: -hs, z: 0 }, p2: { x: hs, y: -hs, z: 0 }, angle: aPyr };
          const hW2 = { p1: { x: -hs, y: hs, z: 0 }, p2: { x: -hs, y: -hs, z: 0 }, angle: aPyr };
          const hE2 = { p1: { x: hs, y: -hs, z: 0 }, p2: { x: hs, y: hs, z: 0 }, angle: aPyr };
          faces.push(
            { pts: [{ x: -hs, y: hs, z: 0 }, { x: hs, y: hs, z: 0 }, { x: 0, y: hs + slant, z: 0 }].map((p) => applyHingeChain(p, [hN2])), fillColor: cP2, strokeColor: sP2, partIdx: 1 },
            { pts: [{ x: hs, y: -hs, z: 0 }, { x: -hs, y: -hs, z: 0 }, { x: 0, y: -hs - slant, z: 0 }].map((p) => applyHingeChain(p, [hS2])), fillColor: cP2, strokeColor: sP2, partIdx: 1 },
            { pts: [{ x: -hs, y: -hs, z: 0 }, { x: -hs, y: hs, z: 0 }, { x: -hs - slant, y: 0, z: 0 }].map((p) => applyHingeChain(p, [hW2])), fillColor: cP2, strokeColor: sP2, partIdx: 1 },
            { pts: [{ x: hs, y: hs, z: 0 }, { x: hs, y: -hs, z: 0 }, { x: hs + slant, y: 0, z: 0 }].map((p) => applyHingeChain(p, [hE2])), fillColor: cP2, strokeColor: sP2, partIdx: 1 }
          );
        }
        renderSortedFaces(faces);
        draw3DPoint(triN[2], 6, '#34d399', f > 0.9 ? '꼭짓점 V 합체!' : '꼭짓점 이동중');
      }
    }

    // ==================== [탭 3 렌더링: 회전체 360° 생성 & 단면 슬라이서 4종] ====================
    function renderTab3RevolutionAndSections() {
      const sub = state.sub[3];
      const f = state.animProg;
      const n = state.n; // 3, 4, 5, 6

      if (sub === 'spin4' || sub === 'triAxis') {
        // 회전축 l 그리기
        draw3DLine({ x: 0, y: 0, z: -0.6 }, { x: 0, y: 0, z: 3.4 }, '#fbbf24', 3.0, true, true);
        draw3DText({ x: 0, y: 0, z: 3.65 }, '회전축 l', '#fbbf24', 13);

        // 회전시킬 2D 프로파일 정의 (x: 반지름, z: 높이)
        let profile = [];
        if (sub === 'spin4') {
          if (n === 3) profile = [{ r: 0, z: 2.6 }, { r: 1.85, z: 0 }, { r: 0, z: 0 }]; // 직각삼각형 -> 원뿔
          else if (n === 4) profile = [{ r: 0, z: 2.5 }, { r: 1.65, z: 2.5 }, { r: 1.65, z: 0 }, { r: 0, z: 0 }]; // 직사각형 -> 원기둥
          else if (n === 5) profile = [{ r: 0, z: 2.4 }, { r: 1.0, z: 2.4 }, { r: 1.9, z: 0 }, { r: 0, z: 0 }]; // 직각사다리꼴 -> 원뿔대
          else {
            // 반원 -> 구
            for (let i = 0; i <= 10; i++) {
              const th = Math.PI / 2 - (i / 10) * Math.PI;
              profile.push({ r: 1.65 * Math.cos(th), z: 1.3 + 1.65 * Math.sin(th) });
            }
          }
        } else {
          // triAxis: 회전축 변경 실험
          if (n === 3) profile = [{ r: 0, z: 2.6 }, { r: 1.85, z: 0 }, { r: 0, z: 0 }]; // 기본 원뿔
          else if (n === 4) profile = [{ r: 0, z: 2.7 }, { r: 1.75, z: 1.35 }, { r: 0, z: 0 }]; // 빗변을 축으로 회전 -> 쌍원뿔!
          else if (n === 5) profile = [{ r: 0.75, z: 2.3 }, { r: 1.85, z: 2.3 }, { r: 1.85, z: 0 }, { r: 0.75, z: 0 }]; // 축에서 떨어진 직사각형 -> 휴지!
          else profile = [{ r: 0, z: 1.0 }, { r: 1.75, z: 2.5 }, { r: 1.75, z: 0 }, { r: 0, z: 0 }]; // 안쪽이 파인 원뿔기둥
        }

        const maxSweep = Math.max(0.05, f * Math.PI * 2);
        const steps = Math.max(4, Math.round(f * 26));
        const faces = [];

        // 시작 평면도형(0도)과 현재 회전 끝 단면 강조
        const startPoly = profile.map((p) => ({ x: p.r, y: 0, z: p.z }));
        const endPoly = profile.map((p) => ({ x: p.r * Math.cos(maxSweep), y: p.r * Math.sin(maxSweep), z: p.z }));
        faces.push({ pts: startPoly, fillColor: 'rgba(251, 191, 36, 0.72)', strokeColor: '#fbbf24', lineWidth: 3, isSection: true, partIdx: 0, label: '원래 평면도형' });
        if (f > 0.08 && f < 0.98) {
          faces.push({ pts: endPoly, fillColor: 'rgba(52, 211, 153, 0.65)', strokeColor: '#34d399', lineWidth: 2.8, isSection: true, partIdx: 1 });
        }

        // 회전 궤적 곡면 생성
        for (let s = 0; s < steps; s++) {
          const a0 = (s / steps) * maxSweep, a1 = ((s + 1) / steps) * maxSweep;
          for (let j = 0; j < profile.length - 1; j++) {
            const pA = profile[j], pB = profile[j + 1];
            if (pA.r === 0 && pB.r === 0) continue;
            faces.push({
              pts: [
                { x: pA.r * Math.cos(a0), y: pA.r * Math.sin(a0), z: pA.z },
                { x: pA.r * Math.cos(a1), y: pA.r * Math.sin(a1), z: pA.z },
                { x: pB.r * Math.cos(a1), y: pB.r * Math.sin(a1), z: pB.z },
                { x: pB.r * Math.cos(a0), y: pB.r * Math.sin(a0), z: pB.z }
              ],
              fillColor: 'rgba(56, 189, 248, 0.24)',
              strokeColor: 'rgba(56, 189, 248, 0.45)',
              lineWidth: 1,
              partIdx: 1
            });
          }
        }
        renderSortedFaces(faces);
      } else if (sub === 'revSection') {
        // 회전체 세로 단면(축 포함) + 가로 단면(축 수직 슬라이서) 동시 투시
        const zCut = 0.3 + f * 1.9;
        const H = 2.6, R = 1.8;
        const faces = [];

        // 1) 회전축을 포함하는 노란색 세로 대칭 단면 (y=0 평면)
        let axialPts = [];
        let cutRadius = R;
        if (n === 3) {
          axialPts = [{ x: 0, y: 0, z: H }, { x: R, y: 0, z: 0 }, { x: -R, y: 0, z: 0 }];
          cutRadius = R * (1 - zCut / H);
        } else if (n === 4) {
          axialPts = [{ x: -R, y: 0, z: H }, { x: R, y: 0, z: H }, { x: R, y: 0, z: 0 }, { x: -R, y: 0, z: 0 }];
          cutRadius = R;
        } else if (n === 5) {
          const rTop = 0.95;
          axialPts = [{ x: -rTop, y: 0, z: H }, { x: rTop, y: 0, z: H }, { x: R, y: 0, z: 0 }, { x: -R, y: 0, z: 0 }];
          cutRadius = R - (R - rTop) * (zCut / H);
        } else {
          for (let i = 0; i < 28; i++) {
            const a = (i / 28) * Math.PI * 2;
            axialPts.push({ x: R * Math.cos(a), y: 0, z: 1.3 + R * Math.sin(a) });
          }
          const dz = zCut - 1.3;
          cutRadius = Math.sqrt(Math.max(0.1, R * R - dz * dz));
        }
        faces.push({ pts: axialPts, fillColor: 'rgba(251, 191, 36, 0.55)', strokeColor: '#fbbf24', lineWidth: 3, isSection: true, partIdx: 0, label: '축 포함 세로단면' });

        // 2) 회전축에 수직인 에메랄드 가로 원 단면 (z = zCut 평면)
        const horizCircle = [];
        for (let i = 0; i < 30; i++) {
          const a = (i / 30) * Math.PI * 2;
          horizCircle.push({ x: cutRadius * Math.cos(a), y: cutRadius * Math.sin(a), z: zCut });
        }
        faces.push({ pts: horizCircle, fillColor: 'rgba(52, 211, 153, 0.62)', strokeColor: '#34d399', lineWidth: 3, isSection: true, partIdx: 1, label: '수직 가로단면 = 항상 원!' });

        // 반투명 외곽 와이어프레임
        for (let i = 0; i < 16; i++) {
          const a0 = (i / 16) * Math.PI * 2, a1 = ((i + 1) / 16) * Math.PI * 2;
          const rTop = n === 3 ? 0 : n === 4 ? R : n === 5 ? 0.95 : 0.2;
          draw3DLine({ x: R * Math.cos(a0), y: R * Math.sin(a0), z: 0 }, { x: R * Math.cos(a1), y: R * Math.sin(a1), z: 0 }, 'rgba(148,163,184,0.45)', 1.5);
          draw3DLine({ x: rTop * Math.cos(a0), y: rTop * Math.sin(a0), z: H }, { x: rTop * Math.cos(a1), y: rTop * Math.sin(a1), z: H }, 'rgba(148,163,184,0.45)', 1.5);
        }
        renderSortedFaces(faces);
        draw3DLine({ x: 0, y: 0, z: -0.4 }, { x: 0, y: 0, z: H + 0.5 }, '#ffffff', 2, true);
      } else {
        // cubeCut: 정육면체 단면 (n=3: 정삼각형, n=4: 등변사다리꼴, n=5: 오각형, n=6: 정육각형!)
        const s = 1.45;
        const cz = s;
        const v = [
          { x: -s, y: -s, z: 0 }, { x: s, y: -s, z: 0 }, { x: s, y: s, z: 0 }, { x: -s, y: s, z: 0 },
          { x: -s, y: -s, z: 2 * s }, { x: s, y: -s, z: 2 * s }, { x: s, y: s, z: 2 * s }, { x: -s, y: s, z: 2 * s }
        ];
        // 정육면체 12개 모서리 와이어프레임
        [
          [0, 1], [1, 2], [2, 3], [3, 0],
          [4, 5], [5, 6], [6, 7], [7, 4],
          [0, 4], [1, 5], [2, 6], [3, 7]
        ].forEach(([i, j]) => draw3DLine(v[i], v[j], 'rgba(56, 189, 248, 0.65)', 2.2));

        let cutPts = [];
        const k = 0.7 + 0.3 * f;
        if (n === 3) {
          // 정삼각형 단면 (한 꼭짓점 v[5]에서 모이는 세 모서리 절단)
          cutPts = [
            { x: s - 1.5 * s * k, y: -s, z: 2 * s },
            { x: s, y: -s + 1.5 * s * k, z: 2 * s },
            { x: s, y: -s, z: 2 * s - 1.5 * s * k }
          ];
        } else if (n === 4) {
          // 등변사다리꼴 단면
          cutPts = [
            { x: -0.6 * s, y: -s, z: 2 * s },
            { x: 0.6 * s, y: -s, z: 2 * s },
            { x: s, y: 0.4 * s, z: 0 },
            { x: -s, y: 0.4 * s, z: 0 }
          ];
        } else if (n === 5) {
          // 오각형 단면 (5개 면 통과)
          cutPts = [
            { x: 0, y: -s, z: 2 * s },
            { x: s, y: -0.2 * s, z: 2 * s },
            { x: s, y: s, z: 0.9 * s },
            { x: -0.3 * s, y: s, z: 0 },
            { x: -s, y: -0.3 * s, z: 0.9 * s }
          ];
        } else {
          // ✨ 정육각형 단면 (6개 모서리의 중점을 지나는 평면!)
          cutPts = [
            { x: 0, y: -s, z: 2 * s },
            { x: s, y: 0, z: 2 * s },
            { x: s, y: s, z: s },
            { x: 0, y: s, z: 0 },
            { x: -s, y: 0, z: 0 },
            { x: -s, y: -s, z: s }
          ];
        }

        renderSortedFaces([
          {
            pts: cutPts,
            fillColor: 'rgba(251, 191, 36, 0.65)',
            strokeColor: '#fbbf24',
            lineWidth: 3.5,
            isSection: true,
            partIdx: 0,
            label: n === 6 ? '✨ 정육각형 단면 (6개 면 통과!)' : `${n}각형 단면`
          }
        ]);
        cutPts.forEach((p, idx) => draw3DPoint(p, 5, '#f43f5e', `${idx + 1}`));
      }
    }

    // ==================== [탭 4 렌더링: 회전체 전개도 & 개미 최단거리 4종] ====================
    function renderTab4RevolutionNetsAndShortest() {
      const sub = state.sub[4];
      const f = state.animProg; // 0: 완전 평면 전개도, 1: 완전 입체
      const r = state.n;
      const h = state.h;

      if (sub === 'cylRoll' || (sub === 'antShortest' && state.n <= 4)) {
        const k = 0.34;
        const R = r * k, H = h * 0.42, hh = H / 2;
        const fold = Math.max(0.001, f);
        const N = 26, totalW = 2 * Math.PI * R, R_eff = R / fold;
        const faces = [], topPts = [], botPts = [];

        for (let i = 0; i <= N; i++) {
          const u = i / N - 0.5, s = u * totalW, th = s / R_eff;
          const px = R_eff * Math.sin(th), pz = R_eff * (1 - Math.cos(th));
          botPts.push({ x: px, y: -hh, z: pz });
          topPts.push({ x: px, y: hh, z: pz });
        }
        for (let i = 0; i < N; i++) {
          faces.push({
            pts: [botPts[i], botPts[i + 1], topPts[i + 1], topPts[i]],
            fillColor: 'rgba(56, 189, 248, 0.32)',
            strokeColor: '#38bdf8',
            partIdx: 1,
            label: i === 13 ? `가로 = 2πr = ${2 * r}π` : ''
          });
        }

        const angDisk = f * (Math.PI / 2);
        const hTop = { p1: { x: -R, y: hh, z: 0 }, p2: { x: R, y: hh, z: 0 }, angle: angDisk };
        const hBot = { p1: { x: R, y: -hh, z: 0 }, p2: { x: -R, y: -hh, z: 0 }, angle: angDisk };
        const topDisk = [], botDisk = [];
        for (let i = 0; i < 26; i++) {
          const phi = (i / 26) * Math.PI * 2;
          topDisk.push(applyHingeChain({ x: R * Math.sin(phi), y: hh + R * (1 - Math.cos(phi)), z: 0 }, [hTop]));
          botDisk.push(applyHingeChain({ x: R * Math.sin(phi), y: -hh - R * (1 - Math.cos(phi)), z: 0 }, [hBot]));
        }
        faces.push({ pts: topDisk, fillColor: 'rgba(251, 191, 36, 0.45)', strokeColor: '#fbbf24', partIdx: 0, label: '윗밑면' });
        faces.push({ pts: botDisk, fillColor: 'rgba(251, 191, 36, 0.45)', strokeColor: '#fbbf24', partIdx: 0, label: '아랫밑면' });
        renderSortedFaces(faces);

        // 개미 최단거리 나선/대각선 궤적
        if (sub === 'antShortest' || state.lens === 'aux') {
          for (let i = 0; i < N; i++) {
            const u0 = i / N, u1 = (i + 1) / N;
            const p0 = { x: botPts[i].x, y: -hh + H * u0, z: botPts[i].z };
            const p1 = { x: botPts[i + 1].x, y: -hh + H * u1, z: botPts[i + 1].z };
            draw3DLine(p0, p1, '#f43f5e', 4.0, false, true);
          }
          const idxAnt = Math.min(N, Math.floor(state.antProg * N));
          const antPt = { x: botPts[idxAnt].x, y: -hh + H * state.antProg, z: botPts[idxAnt].z };
          draw3DPoint(antPt, 7, '#fbbf24', '🐜 최단거리 직선!');
        }
      } else if (sub === 'coneSector' || (sub === 'antShortest' && state.n >= 5)) {
        const k = 0.40;
        const isAntMode = sub === 'antShortest';
        const rVal = isAntMode ? (state.n === 5 ? 2 : 3) : r;
        const slant = isAntMode ? 6 : Math.max(r + 2, h + 3);
        const R = rVal * k, A = slant * k;
        const thetaRad = (rVal / slant) * Math.PI * 2;
        const curBaseR = (1 - f) * A + f * R;
        const curSpan = (1 - f) * thetaRad + f * (Math.PI * 2);
        const coneH = Math.sqrt(Math.max(0.1, A * A - R * R));
        const apex = { x: 0, y: (1 - f) * (A * 0.35), z: f * coneH };

        const N = 30, arcPts = [], faces = [];
        for (let i = 0; i <= N; i++) {
          const u = i / N - 0.5, ang = u * curSpan;
          arcPts.push({ x: curBaseR * Math.sin(ang), y: apex.y - curBaseR * Math.cos(ang), z: 0 });
        }
        for (let i = 0; i < N; i++) {
          faces.push({ pts: [apex, arcPts[i], arcPts[i + 1]], fillColor: 'rgba(244, 114, 182, 0.36)', strokeColor: '#f472b6', partIdx: 0 });
        }
        const touchPt = arcPts[15];
        const diskCy = (1 - f) * (touchPt.y - R) + f * apex.y;
        const diskPts = [];
        for (let i = 0; i < 26; i++) {
          const phi = (i / 26) * Math.PI * 2;
          diskPts.push({ x: R * Math.cos(phi), y: diskCy + R * Math.sin(phi), z: -0.02 });
        }
        faces.push({ pts: diskPts, fillColor: 'rgba(56, 189, 248, 0.42)', strokeColor: '#38bdf8', partIdx: 1, label: '밑면 원' });
        renderSortedFaces(faces);

        // 원뿔 옆면 1바퀴 개미 최단거리 궤적 (펼쳤을 때는 arcPts[0]과 arcPts[N]을 곧장 잇는 직선 현!)
        if (isAntMode || state.lens === 'aux') {
          const pStart = arcPts[0], pEnd = arcPts[N];
          draw3DLine(pStart, pEnd, '#f43f5e', 4.2, false, true);
          draw3DPoint(pStart, 5.5, '#fbbf24', '출발 A');
          draw3DPoint(pEnd, 5.5, '#fbbf24', "도착 A'");
          const u = state.antProg;
          const antPt = {
            x: pStart.x + (pEnd.x - pStart.x) * u,
            y: pStart.y + (pEnd.y - pStart.y) * u,
            z: pStart.z + (pEnd.z - pStart.z) * u
          };
          draw3DPoint(antPt, 7, '#34d399', '🐜 현(직선) 주행!');
        }
      } else {
        // frustumBelt: 원뿔대 & 원래 작은 원뿔 모선 복원
        const k = 0.46;
        const rTop = Math.max(1, Math.floor(r / 2)) * k, rBot = rTop * 2;
        const H = h * 0.42;
        const N = 26, faces = [], topDisk = [], botDisk = [];
        for (let i = 0; i < N; i++) {
          const a0 = (i / N) * Math.PI * 2, a1 = ((i + 1) / N) * Math.PI * 2;
          const b0 = { x: rBot * Math.cos(a0), y: rBot * Math.sin(a0), z: 0 };
          const b1 = { x: rBot * Math.cos(a1), y: rBot * Math.sin(a1), z: 0 };
          const t1 = { x: rTop * Math.cos(a1), y: rTop * Math.sin(a1), z: H };
          const t0 = { x: rTop * Math.cos(a0), y: rTop * Math.sin(a0), z: H };
          botDisk.push(b0); topDisk.push(t0);
          faces.push({ pts: [b0, b1, t1, t0], fillColor: 'rgba(251, 191, 36, 0.36)', strokeColor: '#fbbf24', partIdx: 1 });
        }
        faces.push({ pts: topDisk, fillColor: 'rgba(56, 189, 248, 0.45)', strokeColor: '#38bdf8', partIdx: 0, label: '윗밑면' });
        faces.push({ pts: botDisk, fillColor: 'rgba(56, 189, 248, 0.45)', strokeColor: '#38bdf8', partIdx: 1, label: '아랫밑면' });
        renderSortedFaces(faces);

        const ghostApex = { x: 0, y: 0, z: H * 2 * (1 + (1 - f) * 0.3) };
        for (let i = 0; i < N; i += 4) {
          draw3DLine(topDisk[i], ghostApex, 'rgba(244, 63, 94, 0.7)', 1.8, true);
        }
        draw3DPoint(ghostApex, 5.5, '#f43f5e', '원래 큰 원뿔 꼭짓점 복원!');
      }
    }


  /* ======================================================================
     2.0 셸 연결 (새로 작성한 부분)
     ====================================================================== */
  const arrowOnly = (s) => String(s == null ? '' : s).replace(/➔/g, '→').replace(/⭕/g, '○').replace(/❌/g, '×');
  const arrow = (v) => (typeof v === 'string' ? arrowOnly(v) : Array.isArray(v) ? v.map(arrow) : v && typeof v === 'object' ? Object.fromEntries(Object.entries(v).map(([k, x]) => [k, arrow(x)])) : v);
  const cv = (s) => APLab.stripEmoji(arrowOnly(s));
  const RENDER = { 1: renderTab1PolyhedraAndPlatonic, 2: renderTab2PolyhedraFolding, 3: renderTab3RevolutionAndSections, 4: renderTab4RevolutionNetsAndShortest };
  const TABS = ["다면체(기둥·뿔·뿔대) & 정다면체", "정육면체·다면체 전개도 폴딩", "회전체 360° 생성 & 단면 슬라이서", "회전체 전개도 & 개미 최단거리"];
  const SHORT = ["다면체", "전개도 폴딩", "회전체·단면", "회전체 전개도"];
  const QUESTIONS = [
    "기둥·뿔·뿔대의 면·모서리·꼭짓점 수는 n에 따라 어떻게 달라질까? 정다면체는 왜 5가지뿐일까?",
    "정육면체의 전개도는 어떤 모양이 되고, 어떤 배열은 접어도 입체가 되지 않을까?",
    "평면도형을 한 직선 둘레로 돌리면 어떤 회전체가 되고, 잘라 보면 단면은 어떤 모양일까?",
    "회전체를 펼치면 어떤 모양이 되고, 옆면 위의 최단거리는 어떻게 구할까?"
];
  const LENSES = [["all", "전체 입체"], ["wire", "모서리·꼭짓점 강조"], ["section", "단면·내부 투시"], ["aux", "지퍼·최단거리선"]];
  const ANIM_CHIPS = (m, id) => [[0, '0% (펼침/평면)'], [0.5, '50%'], [1, '100% (입체완성)']];
  const CAMS = { iso: { yaw: -32, pitch: 28 }, top: { yaw: 0, pitch: 86 }, front: { yaw: 0, pitch: 6 } };
  const CAM_LABELS = ["겨냥도", "위에서(평면)", "정면단면"];

  function sync(s, m, id) {
    state.mode = m;
    state.sub[m] = id;
    state.lens = s.lens;
    state.dualView = s.dual !== false;
    state.activePartIdx = s.part == null ? -1 : s.part;
    state.n = s.n;
    state.h = s.h;
    state.antActive = !!s.antActive;
    state.antProg = s.antProg || 0;
    state.animProg = s.anim;
    state.yaw = s.yaw * D2R;
    state.pitch = s.pitch * D2R;
  }

  function specView(spec, s) {
    return {
      guide: `<div style="font-weight:800;margin-bottom:6px">${APLab.esc(cv(spec.badge))}</div>${spec.hint}`,
      readouts: [{ label: '핵심 구조 불변량', value: cv(spec.totalRes), color: 'amber', wide: true }],
      parts: spec.parts.map((p) => ({ id: p.id, name: p.name, desc: p.desc, value: p.val, color: p.color, ok: p.ok })),
      rule: spec.rule,
      formula: spec.formulaHTML,
      notes: spec.notes,
      tape: spec.bars && spec.bars.length ? { title: '실시간 도형 구조·각도 비율 모니터 · ' + cv(spec.totalRes), segments: spec.bars.map((sg) => ({ text: sg.label, weight: sg.weight, color: sg.color })) } : null
    };
  }

  // [2.0 수정] 원본에서 그림·해설에 아무 영향이 없던 조작은 이 장면에서 보여 주지 않습니다(장면마다 모든 값을 바꿔 그려 보고 가려냄).
  //  · 진행도(슬라이더·단계 단추·실행 단추) / 치수 단추: 값을 바꿔도 그림과 해설이 그대로인 장면
  //  · 관찰 렌즈: '전체 입체'와 똑같은 그림이 되는 렌즈(예: 지퍼·최단거리선은 이미 전체 입체에 포함된 장면)
  const NO_ANIM = new Set(['platonic5', 'cubeCut']);
  const NO_D1 = new Set(['cubeCross', 'cubeStairs', 'badNet', 'diceArrow']);
  const NO_D2 = new Set(['platonic5', 'vertex360', 'cubeCross', 'cubeStairs', 'badNet', 'diceArrow', 'octaNet', 'spin4', 'revSection', 'triAxis', 'cubeCut']);
  const NOAUX = ['prismN', 'pyramidN', 'frustumN', 'platonic5', 'vertex360', 'cubeCross', 'cubeStairs', 'badNet', 'diceArrow', 'octaNet', 'spin4', 'revSection', 'triAxis', 'cubeCut', 'frustumBelt', 'antShortest'];
  const LENS_OFF = Object.fromEntries(NOAUX.map((k) => [k, ['aux']]));
  LENS_OFF.revSection.push('section');
  LENS_OFF.cubeCut.push('section');

  function sceneOf(m, it) {
    const id = it.id;
    const label = arrow(it.label);
    return {
      id, title: label, short: label, reviewTab: true,
      question: QUESTIONS[m - 1],
      notesTitle: '절대 속지 않는 공간지각 킬러 포인트!',
      enter: (s) => {
        s.anim = m === 2 || m === 4 ? 0.35 : 0.85;
        s.playing = false;
        s.antActive = false;
      },
      controls: () => (NO_ANIM.has(id) ? [] : ['anim']),
      presets: (s) => {
        sync(s, m, id);
        const spec = getSpec();
        const out = [];
        const cams = ['iso', 'top', 'front'];
        if (!NO_ANIM.has(id)) ANIM_CHIPS(m, id).forEach(([v, lbl]) => out.push({ group: '진행 단계', label: lbl, set: { anim: v }, ms: 650, on: (st) => Math.abs(st.anim - v) < 0.02 }));
        if (!NO_D1.has(id)) [3, 4, 5, 6].forEach((v) => out.push({ group: cv(spec.dim1Name), label: `${spec.nPrefix || ''}${v}`, color: 'sky', apply: (st) => { st.n = v; st.part = null; }, on: (st) => st.n === v }));
        if (!NO_D2.has(id)) [3, 4, 5, 6].forEach((v) => out.push({ group: cv(spec.dim2Name), label: `${spec.hPrefix || ''}${v}`, color: 'rose', apply: (st) => { st.h = v; st.part = null; }, on: (st) => st.h === v }));
        LENSES.filter(([k]) => !(LENS_OFF[id] || []).includes(k)).forEach(([k, lbl]) => out.push({ group: '관찰 렌즈', label: lbl, apply: (st) => { st.lens = k; st.part = null; }, on: (st) => st.lens === k }));
        if (!B || B._area().w >= 640) {
          out.push({ group: '2D 단면·전개도 뷰', label: '켜기', apply: (st) => { st.dual = true; }, on: (st) => st.dual !== false });
          out.push({ group: '2D 단면·전개도 뷰', label: '끄기', apply: (st) => { st.dual = false; }, on: (st) => st.dual === false });
        }
        cams.forEach((k, i) => out.push({ group: '시점', label: CAM_LABELS[i], set: { yaw: CAMS[k].yaw, pitch: CAMS[k].pitch, ...(k === 'top' && (m === 2 || m === 4) ? { anim: 0 } : {}) }, ms: 600, apply: (st) => { st.playing = false; }, on: (st) => Math.abs(st.yaw - CAMS[k].yaw) < 1 && Math.abs(st.pitch - CAMS[k].pitch) < 1 }));
        return out;
      },
      actions: () => [...(NO_ANIM.has(id) ? [] : [{
        id: 'act', play: true, primary: true, icon: 'wand',
        label: (st) => { sync(st, m, id); return arrow(getSpec().actionTxt); },
        run: (st, lab) => { lab.tween({ anim: st.anim > 0.5 ? 0 : 1 }, 1100); }
      }]), ...(id === 'antShortest' ? [{
        id: 'ant', play: true, icon: 'play', label: '최단거리 개미 주행',
        run: (st) => { st.antActive = true; st.antProg = 0; }
      }] : []), {
        id: 'spin', play: true, icon: (st) => (st.playing ? 'pause' : 'play'),
        label: (st) => (st.playing ? '일시 정지' : '3D 자동회전'),
        on: (st) => st.playing,
        run: (st) => { st.playing = !st.playing; }
      }],
      view: (s) => {
        sync(s, m, id);
        return specView(arrow(getSpec()), s);
      },
      draw: (b, s) => {
        B = b;
        ctx = b.__legacyCtx || (b.__legacyCtx = makeCtx(b));
        sync(s, m, id);
        setView(b, m, id, s);
        if (s.grid && !b.thumb) drawFloorGrid();
        RENDER[m]();
        draw2DDualOverlay();
      }
    };
  }

  const groups = Object.keys(SUB_MENUS).map((k) => {
    const m = +k;
    return { id: 'm' + m, title: TABS[m - 1], short: SHORT[m - 1], scenes: SUB_MENUS[m].map((it) => sceneOf(m, it)) };
  });

  APLab.createLab({
    id: 'g7-solids',
    title: '입체도형 종합',
    courseName: '중1',
    unit: '입체도형',
    courseColor: 'var(--m-green)',
    home: '../index.html#g7',
    legacy: '../../labs/g7/다면체·회전체&겨냥도·전개도.html',
    board: {
      kind: 'cartesian', focus: { x: [-4, 4], y: [-4, 4] }, minZoom: 0.5, maxZoom: 3,
      // 빈 곳을 끌면 카메라 회전(원본과 같은 감도, 위아래 기울기 5°~88°)
      orbit: (s, dx, dy) => {
        s.yaw += dx * 0.0085 * R2D;
        if (s.yaw > 180) s.yaw -= 360;
        if (s.yaw < -180) s.yaw += 360;
        s.pitch = clamp(s.pitch + dy * 0.0075 * R2D, 5, 88);
      }
    },
    params: {
      anim: { value: 0.85, min: 0, max: 1, step: 0.005, color: 'amber', label: '진행도 (접기 · 분해 · 360° 회전)', hint: '슬라이더로 접기·분해·회전을 직접 조작해 보세요', format: (v) => `${Math.round(v * 100)}%` },
      n: { value: 4, min: 3, max: 6, step: 1, color: 'sky', label: '치수 1', format: (v) => String(Math.round(v)) },
      h: { value: 5, min: 3, max: 6, step: 1, color: 'rose', label: '치수 2', format: (v) => String(Math.round(v)) },
      yaw: { value: -32, min: -180, max: 180, step: 1, color: 'muted', label: '좌우 회전', format: (v) => `${Math.round(v)}°` },
      pitch: { value: 28, min: 5, max: 88, step: 1, color: 'muted', label: '위아래 기울기', format: (v) => `${Math.round(v)}°` }
    },
    state: { lens: 'all', dual: true, antActive: false, antProg: 0 },
    persist: ['lens', 'dual'],
    tick: (s, dt) => {
      let again = false;
      if (s.playing) { s.yaw += 34 * dt; if (s.yaw > 180) s.yaw -= 360; again = true; }
      if (s.antActive) { s.antProg += dt * 0.42; if (s.antProg >= 1) { s.antProg = 1; s.antActive = false; } again = true; }
      return again;
    },
    groups
  });
});
</script>
</body>
