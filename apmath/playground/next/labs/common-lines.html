<script>
/* ==========================================================================
   공통수학 · 평면 · 직선 · 이동 (AP Math Lab 2.0 이식본) — 6개 탐구관 × 30개 장면
   원본: labs/공통수학/평면·직선·이동.html
   이식 방식: "호환 이식" — 원본의 내용(getSpec)과 그리기 코드(drawAnalyticMasterScene)를 글자 그대로 옮기고,
   이 실험실이 쓰던 그리기 함수 이름(aline·apoly·acircle·adot·aright·abadge·drawJumpArch·aMathLine)만
   아래 어댑터가 새 무대 엔진(APLab.Board)에 연결합니다. 원본의 화면 좌표(y 아래쪽, 1칸 = 36)를 그대로 '설계 좌표'로 씁니다.
   원본과 다른 점 (코드 안에는 [2.0 수정] 주석이 있습니다)
   - 캔버스에 덮어 그리던 하단 띠는 무대 아래 띠로 옮기고, 좌표평면(격자·축·눈금)은 무대가 직접 그림.
     그림이 자동으로 화면에 맞춰지므로 휴대폰에서도 점과 이름표가 잘리지 않음
   - 직선은 좌표 ±12에서 끊기지 않고 화면 끝까지 이어서 그림(확대·축소해도 직선으로 보임)
   - [2.0 수정] 일부 장면(내분·외분, 평행선 거리, 당구대 거울의 방, 아폴로니오스 원, 종이접기)은 그림을 줄여 그리면서
     눈금은 원래 크기라 눈금 숫자와 점 좌표가 맞지 않았음 → 눈금과 원점을 그 장면의 크기·위치에 맞춤
   - [2.0 수정] 정점 A를 지나는 직선과 원점 사이 최대 거리: 직선의 회전 각을 y축 방향(화면 아래쪽 +)으로 잘못 계산해
     OA ⊥ l 인 순간(변환 100%)에도 직선이 수직이 되지 않았음 → 부호를 바로잡음
   - 효과가 없던 조작은 표시하지 않음: 변환(0→100%) 슬라이더·시연 버튼이 그림을 바꾸지 않는 장면(13개),
     쓰이지 않는 비율·(a, b) 프리셋, 해당 장면에 없는 관찰 렌즈 버튼
   - [문제 탭 추가] 탐구 탭은 그대로 두고, 29개 장면의 정리·문제 탭에 기출 변형 문제와 「새 문제」를 얹음(문제 그림은 12px 이상 글자로 새로 그림. 평행선·수직 조건 장면의 일반형 수직 함정 장면은 제외)
   - 비율 m:n, (a, b) 값은 프리셋 칩으로 바꾸고 관찰 렌즈(전체/수직·기울기/좌표·비율/대칭·보조선)는 원본 규칙 그대로 동작
   ========================================================================== */
window.addEventListener('DOMContentLoaded', function () {
  const tex = APLab.tex;

  /* ===== 원본 그대로: 숫자 표시와 색·벡터 도우미 (원본 347–368행) ===== */
    function fmtNum(v) {
      if (Math.abs(v - Math.round(v)) < 1e-6) return String(Math.round(v));
      return Number(v.toFixed(2)).toString();
    }
    const roundedNow = (...v) => v.some(n => Math.abs(Number(fmtNum(n)) - n) > 1e-9);
    const relationNow = v => `${roundedNow(v) ? '≈' : '='} ${fmtNum(v)}`;
    const pointNow = (name, x, y) => `${name}${roundedNow(x, y) ? ' ≈ ' : ''}(${fmtNum(x)}, ${fmtNum(y)})`;
    const ACOL = {
      cyan: '#38bdf8',
      pink: '#f472b6',
      green: '#34d399',
      gold: '#fbbf24',
      white: '#f1f5f9',
      red: '#fb7185'
    };

    const apt = (x, y) => ({ x, y });
    const amid = (a, b) => ({ x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 });
    const alerp = (a, b, t) => ({ x: a.x + (b.x - a.x) * t, y: a.y + (b.y - a.y) * t });
    const adist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
    const asub = (a, b) => ({ x: a.x - b.x, y: a.y - b.y });
    const aadd = (a, b) => ({ x: a.x + b.x, y: a.y + b.y });
    const amul = (v, k) => ({ x: v.x * k, y: v.y * k });
    const anorm = (v) => { const l = Math.hypot(v.x, v.y) || 1; return { x: v.x / l, y: v.y / l }; };

  /* ===== 원본 상태 객체(이름 그대로) — 매 프레임 2.0 셸 상태에서 채웁니다 ===== */
    const state = {
      mode: 1,
      subType: { 1: 'divInternalExternal', 2: 'perpSlopeMinus1', 3: 'shoelaceArea', 4: 'compositeStepByStep', 5: 'reflectTriPerim', 6: 'trapApollonius' },
      conceptSwitch: 'all', activePartIdx: -1,
      fold: 0.0, foldTarget: null, perpK: 1.4,
      ratioIdx: 0,  // 0: 2:1 (m>n), 1: 1:2 (m<n), 2: 3:1 (m>n), 3: 1:3 (m<n)
      scaleIdx: 1,  // 0: (2,1), 1: (3,2), 2: (4,2), 3: (4,3)
      scale: 1.0, panX: 0, panY: 0
    };

  /* ===== 원본 그대로: 비율·이동량 선택지와 세부 시나리오 목록 (원본 401–458행) ===== */
    const RATIO_OPTS = [
      { m: 2, n: 1, label: '2:1(m>n)' },
      { m: 1, n: 2, label: '1:2(m<n!)' },
      { m: 3, n: 1, label: '3:1(m>n)' },
      { m: 1, n: 3, label: '1:3(m<n!)' }
    ];

    const SCALE_OPTS = [
      { a: 2, b: 1, label: '(2, 1)' },
      { a: 3, b: 2, label: '(3, 2)' },
      { a: 4, b: 2, label: '(4, 2)' },
      { a: 4, b: 3, label: '(4, 3)' }
    ];

    const SUB_MENUS = {
      1: [
        { id: 'divInternalExternal', label: '📏 내분점 P & 연장선 위의 점 Q (m>n일 때와 m<n일 때)' },
        { id: 'divExtendedLine', label: '🎯 직선 AB 위의 점 C (2AB=BC를 만족하는 두 점)' },
        { id: 'pappusMedian', label: '📐 삼각형의 꼭짓점과 대변의 중점 사이의 길이 관계 (AB²+AC²=2(AM²+BM²))' },
        { id: 'centroidParaCoord', label: '⚖️ 무게중심 G 불변 & 평행사변형 제4꼭짓점(A+C=B+D)' },
        { id: 'distMinSumSq', label: '🧲 PA+PB가 최소일 때(선분 위)와 PA²+PB²+PC²이 최소일 때(무게중심 G)' }
      ],
      2: [
        { id: 'perpSlopeMinus1', label: '📐 수직인 두 직선 기울기 곱 (mm\'=-1, 90° 회전 삼각형!)' },
        { id: 'fixedPointPencil', label: '🎡 k값에 관계없이 정점 P를 지나는 회전 직선 (l₁+k·l₂=0)' },
        { id: 'perpBisectorOrtho', label: '✂️ 선분 AB의 수직이등분선 (중점 + 수직 2단 콤보)' },
        { id: 'areaBisectLines', label: '🍕 삼각형 · 사각형 · 원의 넓이를 이등분하는 직선' },
        { id: 'threeLinesNoTri', label: '🚫 [주의] 세 직선이 삼각형을 만들지 않을 세 가지 조건' }
      ],
      3: [
        { id: 'shoelaceArea', label: '👟 한 꼭짓점을 원점으로 평행이동하여 삼각형의 넓이 구하기' },
        { id: 'pointLineDist', label: '📏 점과 직선 사이의 거리 d (수선의 길이)' },
        { id: 'parallelLineDist', label: '🛤️ 평행한 두 직선 사이의 거리 (y절편의 차와 수직거리의 차이)' },
        { id: 'angleBisectorLine', label: '💖 두 직선이 이루는 각의 이등분선 (d₁ = d₂ 자취)' },
        { id: 'maxDistFromPt', label: '🔭 [심화 킬러] 점 A를 지나는 직선과 원점 사이의 거리의 최댓값' }
      ],
      4: [
        { id: 'compositeStepByStep', label: '🧩 [킬러] f(x,y)=0 ➔ f(y+1, 2-x)=0 도형의 이동 3단계' },
        { id: 'paradoxPointVsFig', label: '🔄 왜 점은 (x+a, y+b)인데 도형은 f(x-a, y-b)=0 일까?' },
        { id: 'symmetry4Basic', label: '🪞 4대 기본 대칭이동 (x축 · y축 · 원점 · 직선 y=x)' },
        { id: 'symPointAndLine', label: '🎯 임의의 점(a,b) 대칭(2a-x) & 직선 y=mx+n 대칭' },
        { id: 'lineSlideSame', label: '📐 x축으로 a 이동 = y축으로 b 이동 일치 (기울기 $m=-\\frac{b}{a}$)' }
      ],
      5: [
        { id: 'reflectTriPerim', label: '🔺 x축과 직선 y=x 위의 점 P, Q로 만든 △APQ의 둘레의 최솟값' },
        { id: 'reflectSingleAxis', label: '✨ x축 거울 1번 튕기기 최단거리 (AP + PB = AB\'!)' },
        { id: 'reflectDoubleAxes', label: '🎱 x축 · y축 거울 2번 연속 튕기기 (AP+PQ+QB = A\'B\'!)' },
        { id: 'billiardMirrorRoom', label: '🟢 당구대 2번·3번 튕기기 (당구대를 대칭이동하여 이어 붙이기)' },
        { id: 'diffMaxLine', label: '⚡ 합(PA+PB)의 최솟값과 차(|PA-PB|)의 최댓값 비교' }
      ],
      6: [
        { id: 'trapApollonius', label: '🌕 PA : PB = 2 : 1 인 점의 자취' },
        { id: 'trapLineSegmentMeet', label: '🎯 직선이 선분 AB와 만나기 위한 기울기 m의 범위 구하기' },
        { id: 'trapInterceptZero', label: '💥 [함정 1] 절편이 같은 직선 ➔ 원점(0,0)을 지나는 직선을 빠뜨리지 않기' },
        { id: 'trapPerpDivideZero', label: '💥 [함정 2] 일반형으로 주어진 두 직선의 수직(aa\'+bb\'=0)과 평행' },
        { id: 'trapCoordFold', label: '📄 좌표평면 직사각형 종이접기 (C→원점 O, 수직이등분선 EF)' }
      ]
    };

  /* ======================================================================
     [2.0] 어댑터: 원본의 a* 그리기 함수 → 새 무대 엔진
     - 원본의 규칙을 그대로 따릅니다: partIdx(-1=없음) → 강조 조각, 관찰 렌즈(lensAlpha)에 따라 선명/흐리게
     - 좌표는 원본의 화면 좌표(y 아래쪽)를 '설계 좌표'로 쓰는 figure 무대입니다(원점 (0,0), 1칸 = UNIT)
     - 좌표평면은 무대가 직접 그리고 자동 맞춤 계산에서는 빠집니다(직선도 마찬가지)
     ====================================================================== */
  const UNIT = 36;
  let BOARD = null;
  const partOf = (p) => (p == null || p < 0 ? undefined : p);
  // 셸은 이모지(➔ ⭕ ❌ 포함)를 화면 표시에서 떼어 내므로, 문장 속 뜻이 사라지지 않게 → ○ × 로 미리 바꿔 넘깁니다(원문 getSpec은 그대로).
  const arrowOnly = (s) => String(s == null ? '' : s).replace(/➔/g, '→').replace(/⭕/g, '○').replace(/❌/g, '×');
  const cv = (s) => APLab.stripEmoji(arrowOnly(s));
  // 원본 texInline 과 같은 규칙: **굵게** → <strong>. 또 $…$ 안의 '<'(예: $m < n$)는 HTML 태그 시작으로 읽히지 않게 \lt 로 바꿉니다.
  const bold = (s) => s.replace(/\*\*([\s\S]+?)\*\*/g, '<strong>$1</strong>').replace(/\$([^$]+)\$/g, (m0, src) => '$' + src.replace(/</g, '\\lt ') + '$');
  const arrow = (v) => (typeof v === 'string' ? bold(arrowOnly(v)) : Array.isArray(v) ? v.map(arrow) : v && typeof v === 'object' ? Object.fromEntries(Object.entries(v).map(([k, x]) => [k, arrow(x)])) : v);
  const withAlpha = (a, fn) => { if (a >= 1) { fn(); return; } const c = BOARD.ctx; c.save(); c.globalAlpha = a; try { fn(); } finally { c.restore(); } };
  // 자동 맞춤 중에는 좌표에 따라 범위가 늘어나므로, 범위에 넣지 않을 계산은 등록 없이 화면 좌표만 구합니다.
  const scr = (x, y) => { const bb = BOARD._bbox; BOARD._bbox = null; const r = BOARD.toS(x, y); BOARD._bbox = bb; return r; };

  // 수학 좌표 (mx, my) -> 설계(화면) 좌표 (원본 477행)
  function toScreen(mx, my, ox, oy, unit) {
    return { x: ox + mx * unit, y: oy - my * unit };
  }

  // 관찰 렌즈: 수직·기울기 마크(aright)는 angles, 좌표·거리 배지(abadge)는 sides 그룹으로 태깅해 해당 렌즈에서만 그린다.
  // 점선·점프 아치·대칭점 등 보조 요소는 aux 그룹으로 태깅하고, 선택한 렌즈의 그룹은 선명하게, 나머지 그룹은 흐리게,
  // 그룹이 없는 기본 도형은 반쯤 흐리게 그린다. (좌표평면은 항상 선명)  (원본 527–537행)
  function lensAlpha(group) {
    const sw = state.conceptSwitch;
    return sw === 'all' || group === sw ? 1 : group ? 0.14 : 0.4;
  }

  function dotLens(text) {
    if (/직교|직각|90°|수직|수선|기울기|m=|m'/.test(text)) return 'angles';
    if (/대칭|반사|접는|이동|원본|고정점|압정|f\(|[′'″]/.test(text)) return 'aux';
    if (/\d\)|\d,|거리|내분|외분|비율|중점|중심/.test(text)) return 'sides';
    return null;
  }

  function apoly(pts, fill = 'rgba(52,211,153,0.20)', stroke = '#34d399', width = 2.8, partIdx = -1) {
    withAlpha(lensAlpha(null), () => BOARD.poly(pts, { fill: fill || null, color: stroke || null, stroke: !!stroke, width, part: partOf(partIdx) }));
  }

  function aline(a, b, color = '#fbbf24', width = 2.6, dash = [], glow = false, partIdx = -1) {
    withAlpha(lensAlpha(dash.length ? 'aux' : null), () => BOARD.seg(a, b, { color, width, dash: dash.length ? dash : null, glow, part: partOf(partIdx) }));
  }

  // 수학 직선 y = m*x + k 그리기. [2.0 수정] 원본은 x = ±12 에서 끊었지만, 직선답게 화면 끝까지 이어 그립니다(자동 맞춤에는 넣지 않음).
  function aMathLine(mSlope, yInt, ox, oy, unit, color = '#38bdf8', width = 2.6, dash = [], partIdx = -1) {
    if (BOARD._bbox) return;
    const p1 = toScreen(-60, mSlope * -60 + yInt, ox, oy, unit);
    const p2 = toScreen(60, mSlope * 60 + yInt, ox, oy, unit);
    aline(p1, p2, color, width, dash, false, partIdx);
  }

  function aGeneralLine(a, b, c, ox, oy, unit, color, width = 3.2, partIdx = -1) {
    if (BOARD._bbox) return;
    const norm2 = a * a + b * b, r = Math.sqrt(norm2), px = -a * c / norm2, py = -b * c / norm2;
    aline(toScreen(px - 80 * b / r, py + 80 * a / r, ox, oy, unit), toScreen(px + 80 * b / r, py - 80 * a / r, ox, oy, unit), color, width, [], false, partIdx);
  }

  function acircle(center, r, stroke = '#38bdf8', fill = 'rgba(56, 189, 248, 0.10)', width = 2.8, dash = [], partIdx = -1) {
    if (BOARD._bbox) { BOARD.toS(center.x - r, center.y - r); BOARD.toS(center.x + r, center.y + r); } // Board.arc 는 중심만 기록하므로 보완
    withAlpha(lensAlpha(dash.length ? 'aux' : null), () => BOARD.circle(center, Math.max(0, r), { color: stroke || null, fill: fill || null, width, dash: dash.length ? dash : null, part: partOf(partIdx) }));
  }

  // [2.0] 점 이름표가 서로 겹치면(특히 휴대폰) 원본 위치에서 위·아래로 한 줄씩 비켜 놓습니다. 원본은 고정 오프셋이라 겹쳐 읽기 어려웠습니다.
  let placedLabels = [];
  function adot(p, text = '', col = '#ffffff', ox = 10, oy = -12, align = 'left') {
    const B = BOARD, str = B.thumb ? '' : cv(text);
    let dy = oy;
    if (str && !B._bbox) {
      const s = scr(p.x, p.y), size = 12.5 * B.fs * B._ts(), c = B.ctx;
      c.save();
      c.font = `800 ${size}px ${B.font}`;
      const w = c.measureText(str).width;

  }

  // 거울(축 방향 u)에 반사되는 점 P: A쪽 각과 B쪽 각(입사각 = 반사각)을 같은 색·같은 값으로 표시

  // 평행 표시(≫): 선분 a→b의 가운데에 화살표 모양 눈금 count개
  function apar(a, b, count = 2, col = '#38bdf8') {

  // 왕복 점프 아치 곡선 화살표 (내분점·외분점 시각화용)  (원본 687–722행)

    const B = BOARD, c = B.ctx;

  /* 좌표평면(격자·축·눈금): 원본 drawCoordPlane (481행). 원점 (ox, oy)과 1칸의 크기 u 는 장면마다 정합니다.

  /* [2.0 수정] 내분점 장면: A·B·P·Q가 늘어선 폭(가장 왼쪽 점 ~ 가장 오른쪽 점)이 비율(2:1, 1:2, 3:1, 1:3)마다 달라, 원본은 가장 넓은 경우에 맞춘 작은 눈금(0.68·UNIT)으로

      return {

        actionTxt: state.fold > 0.5 ? '🎬 펼친 직사각형 보기' : '🎬 점 C(8,4)를 원점 O(0,0)으로 접어 수직이등분선 EF 작도!',

  /* ===== 원본 그대로: 모드 1 ~ 6 정밀 작도 (원본 1448–2001행) ===== */
    function drawAnalyticMasterScene(ox, oy, unit, t, spec) {
      const m = state.mode;
      const sub = state.subType[m];
      const ro = RATIO_OPTS[state.ratioIdx];
      const M = ro.m, N = ro.n;
      const so = SCALE_OPTS[state.scaleIdx];
      const A_val = so.a, B_val = so.b;

      const S = (mx, my) => toScreen(mx, my, ox, oy, unit);

      // =====================================================================
      // [모드 1] 내분·외분 줄자 & 연장선 점 C & 파푸스 중선정리 & 무게중심
      // =====================================================================
      if (m === 1) {
        if (sub === 'divInternalExternal') {
          const xA = -2, xB = 4;
          const px = (M * xB + N * xA) / (M + N);
          const qx = (M * xB - N * xA) / (M - N);
          // 비율마다 폭이 DIV_W가 되는 눈금·원점(planeOf와 같은 값)
          const L = divLayout(ro);
          const SD = (mx, my) => toScreen(mx, my, L.ox, L.oy, L.u);

          const pA = SD(xA, 0), pB = SD(xB, 0);
          const pP = SD(px, 0), pQ = SD(qx, 0);

          aline(pA, pB, ACOL.white, 4.5);
          aline(pB, pQ, 'rgba(244, 114, 182, 0.55)', 3.0, [6, 4], false, 1);

          // 내분점 아치 (위쪽): 이름표(점 위)와 겹치지 않게 아치를 높이 띄우고, 점 이름은 아치 바깥쪽 위에 둡니다
          drawJumpArch(pA, pP, -62, ACOL.green, `내분 ${M}칸`, 0, 12.5);
          drawJumpArch(pP, pB, -62, ACOL.green, `${N}칸`, 0, 12.5);

          // 외분점 왕복 점프 아치 (아래쪽)
          if (t > 0.05 || state.activePartIdx === 1 || state.activePartIdx === 2) {
            drawJumpArch(pA, pQ, 140, ACOL.pink, `A→Q (${M} 비율)`, 1, 12.5);
            drawJumpArch(pQ, pB, 100, ACOL.gold, `Q→B 복귀 (${N}비율)`, 1, 12.5);
          }

          // 점 이름: A는 왼쪽 위, B는 오른쪽 위(아치가 안쪽으로 모이므로 바깥으로), Q는 위, 내분점 P는 두 아치가 만나는 점 바로 위 높은 줄(아래쪽 외분 아치·눈금 숫자와 겹치지 않게)
          adot(pA, 'A(-2)', ACOL.white, -8, -14, 'right');
          adot(pB, 'B(4)', ACOL.white, 8, -14, 'left');
          adot(pP, `P(내분 ${fmtNum(px)})`, ACOL.green, 0, -84, 'center');
          adot(pQ, `Q(${fmtNum(qx)})`, ACOL.pink, 0, -18, 'center');
        } else if (sub === 'divExtendedLine') {
          const pA = S(0, 0), pB = S(2, 1);
          const pC1 = S(6, 3), pC2 = S(-2, -1);

          aline(S(-4, -2), S(8, 4), 'rgba(148,163,184,0.4)', 2.2, [5, 5]);
          aline(pA, pB, ACOL.green, 4.5, [], true, 0);
          aline(pB, pC1, ACOL.gold, 3.8, [], true, 1);
          aline(pA, pC2, ACOL.pink, 3.8, [], true, 2);

          drawJumpArch(pA, pB, -35, ACOL.green, '1칸 (+2,+1)', 0);
          drawJumpArch(pB, pC1, -55, ACOL.gold, '오른쪽 2칸 (+4,+2)', 1);
          drawJumpArch(pB, pC2, 55, ACOL.pink, '왼쪽 2칸 (-4,-2)', 2);

          adot(pA, 'A(0, 0)', ACOL.green, -10, 22);
          adot(pB, 'B(2, 1)', ACOL.green, 0, 22);
          adot(pC1, 'C₁(6, 3) [B 바깥]', ACOL.gold, -15, -16);
          adot(pC2, 'C₂(-2, -1) [A 바깥!]', ACOL.pink, -20, 24);
        } else if (sub === 'pappusMedian') {
          const pM = S(0, 0), pB = S(-3, 0), pC = S(3, 0), pA = S(1, 3);
          const pH = S(1, 0);

          apoly([pA, pB, pC], 'rgba(56, 189, 248, 0.16)', ACOL.cyan, 3.2, 0);
          aline(pA, pM, ACOL.pink, 3.8, [], true, 1);
          aline(pB, pM, ACOL.gold, 3.8, [], true, 1);
          if (t > 0.1 || state.conceptSwitch === 'aux') {
            aline(pA, pH, 'rgba(255,255,255,0.45)', 2.0, [4, 4]);
            aright(pH, pA, pC, 11, ACOL.white);
          }

          abadge(pA, pB, 'AB² = 25', ACOL.gold, -18, 0.5, 0);
          abadge(pA, pC, 'AC² = 13', ACOL.gold, 18, 0.5, 0);
          abadge(pA, pM, 'AM² = 10', ACOL.pink, -22, 0.55, 1);
          abadge(pB, pM, 'BM² = 9', ACOL.pink, 18, 0.5, 1);

          adot(pM, 'M(0, 0: 원점 중점!)', ACOL.pink, 8, 20);
          adot(pB, 'B(-3, 0)', ACOL.white, -20, 20);
          adot(pC, 'C(3, 0)', ACOL.white, 10, 20);
          adot(pA, 'A(1, 3)', ACOL.gold, 0, -16);
          atick(pB, pM, 1, ACOL.gold); atick(pM, pC, 1, ACOL.gold); // [표시 보강] M은 BC의 중점: BM = MC
        } else if (sub === 'centroidParaCoord') {
          const pA = S(0, 4), pB = S(-3, -1), pC = S(6, 0);
          const pG = S(1, 1);
          const u = M / (M + N);
          const pD = alerp(pA, pB, u), pE = alerp(pB, pC, u), pF = alerp(pC, pA, u);

          const showPara = t > 0.5 || state.activePartIdx === 1;
          apoly([pA, pB, pC], 'rgba(56, 189, 248, 0.14)', ACOL.cyan, 2.8, 0);
          if (showPara) {
            const qD = S(9, 5), O = amid(pA, pC);
            apoly([pA, pB, pC, qD], 'rgba(244, 114, 182, 0.14)', ACOL.pink, 2.8, 1);
            aline(pA, pC, ACOL.white, 2, [4, 4]); aline(pB, qD, ACOL.white, 2, [4, 4]);
            atick(pA, O, 1, ACOL.white); atick(O, pC, 1, ACOL.white); atick(pB, O, 2, ACOL.white); atick(O, qD, 2, ACOL.white);
            adot(qD, 'D(9,5) = A+C−B', ACOL.pink, 8, -14);
          } else {
            apoly([pD, pE, pF], 'rgba(251, 191, 36, 0.26)', ACOL.gold, 3.0, 0);
            adot(pD, 'D', ACOL.gold, -14, 0); adot(pE, 'E', ACOL.gold, 0, 18); adot(pF, 'F', ACOL.gold, 14, -8);
            adot(pG, 'G(1,1): 무게중심 불변', ACOL.pink, 12, -10);
          }
          adot(pA, 'A(0,4)', ACOL.cyan, 0, -14); adot(pB, 'B(-3,-1)', ACOL.cyan, -20, 18); adot(pC, 'C(6,0)', ACOL.cyan, 14, 14);

        } else {
          // distMinSumSq (PA²+PB²+PC² 최소 = 무게중심 G)
          const pA = S(-2, 3), pB = S(-3, -2), pC = S(5, 2);
          const pG = S(0, 1);
          const pP_start = S(3, -3);
          const pP = alerp(pP_start, pG, t);

          apoly([pA, pB, pC], 'rgba(52, 211, 153, 0.14)', ACOL.green, 2.6);
          aline(pP, pA, ACOL.gold, 3.0, [], true, 0);
          aline(pP, pB, ACOL.gold, 3.0, [], true, 0);
          aline(pP, pC, ACOL.gold, 3.0, [], true, 0);

          adot(pA, 'A(-2, 3)', ACOL.white, -16, -12);
          adot(pB, 'B(-3, -2)', ACOL.white, -20, 18);
          adot(pC, 'C(5, 2)', ACOL.white, 14, -10);
          adot(pG, 'G(0, 1: 무게중심)', ACOL.pink, 14, -12);
          aline(pP, pG, ACOL.pink, 2.4, [4, 4]);
          adot(pP, t >= 1 - 1e-9 ? 'P = G (제곱합 최소)' : pointNow('P', 3 * (1 - t), -3 + 4 * t), ACOL.gold, 14, 18);
          if (t < 1 - 1e-9) abadge(pP, pG, `PG² ${relationNow(25 * (1 - t) ** 2)}`, ACOL.pink, -18);
        }
      }

      // =====================================================================
      // [모드 2] 정점 회전 직선 & 수직(mm'=-1) & 수직이등분선 & 넓이 이등분
      // =====================================================================
      else if (m === 2) {
        if (sub === 'perpSlopeMinus1') {
          const a = A_val, b = B_val;
          const pO = S(0, 0);
          const p1 = S(a, b), p1_x = S(a, 0);

          // 직선 l (기울기 b/a)과 직선 l' (기울기 -a/b)
          aMathLine(b / a, 0, ox, oy, unit, ACOL.cyan, 3.2, [], 0);
          aMathLine(-a / b, 0, ox, oy, unit, ACOL.gold, 3.2, [], 1);

          // 원래 기울기 직각삼각형
          apoly([pO, p1_x, p1], 'rgba(56, 189, 248, 0.25)', ACOL.cyan, 2.8, 0);
          aright(p1_x, pO, p1, 10, ACOL.cyan);
          abadge(pO, p1_x, `Δx = +${a}`, ACOL.cyan, 16, 0.5, 0);
          abadge(p1_x, p1, `Δy = +${b}`, ACOL.cyan, 24, 0.5, 0);

          // 슬라이더 t에 따라 90° 반시계 회전하는 직각삼각형!
          const rotRad = (t * Math.PI) / 2;
          function rotAroundO(mx, my) {
            const rx = mx * Math.cos(rotRad) - my * Math.sin(rotRad);
            const ry = mx * Math.sin(rotRad) + my * Math.cos(rotRad);
            return S(rx, ry);
          }
          const r1_x = rotAroundO(a, 0), r1 = rotAroundO(a, b);
          apoly([pO, r1_x, r1], 'rgba(251, 191, 36, 0.34)', ACOL.gold, 3.2, 1);
          if (t > 0.85) {
            const p2_x = S(-b, 0), p2 = S(-b, a);
            aline(p2, p2_x, ACOL.pink, 2.4, [4, 4]);
            aright(p2_x, pO, p2, 10, ACOL.gold);
            abadge(pO, p2_x, `Δx = -${b}`, ACOL.gold, 16, 0.5, 1);
            abadge(p2_x, p2, `Δy = +${a}`, ACOL.gold, -26, 0.5, 1);
          }

          aright(pO, p1, S(-b, a), 14, ACOL.pink);
          adot(pO, 'O(90° 직교!)', ACOL.pink, -35, 22);
          adot(p1, `(${a}, ${b}): m=${b}/${a}`, ACOL.cyan, 12, -10);
          adot(S(-b, a), `(-${b}, ${a}): m'=-${a}/${b}`, ACOL.gold, -45, -14);
        } else if (sub === 'fixedPointPencil') {
          // l1: x - y + 1 = 0 (y = x + 1), l2: 2x + y - 4 = 0 (y = -2x + 4) -> 교점 P(1, 2)
          aMathLine(1, 1, ox, oy, unit, 'rgba(56, 189, 248, 0.5)', 2.2, [5, 4]);
          aMathLine(-2, 4, ox, oy, unit, ACOL.red, 2.6, [6, 4], 2);

          const kVal = -1.5 + 3.5 * t;
          // (1+2k)x + (k-1)y + (1-4k) = 0 -> y = ((1+2k)/(1-k)) x + (1-4k)/(1-k)
          aGeneralLine(1 + 2 * kVal, kVal - 1, 1 - 4 * kVal, ox, oy, unit, ACOL.gold, 3.8, 1);

          const pP = S(1, 2);
          acircle(pP, 11, ACOL.gold, 'rgba(251, 191, 36, 0.35)', 2.5, [], 0);
          adot(pP, '점 P(1, 2) [항상 지나는 점]', ACOL.gold, 14, -12);
        } else if (sub === 'perpBisectorOrtho') {
          const pA = S(-1, -1), pB = S(3, 3), pM = S(1, 1);
          const uP = -1.5 + 3.0 * t;
          const pP = S(1 + uP, 1 - uP);
          const atMidpoint = Math.abs(uP) < 1e-9;

          aMathLine(-1, 2, ox, oy, unit, ACOL.pink, 3.6, [], 1);
          if (!atMidpoint) apoly([pP, pA, pB], 'rgba(56, 189, 248, 0.18)', ACOL.cyan, 2.4, 2);
          aline(pA, pB, ACOL.gold, 3.6, [], false, 0);

          if (!atMidpoint) aright(pM, pA, pP, 13, ACOL.pink);
          adot(pA, 'A(-1, -1)', ACOL.gold, -20, 20);
          adot(pB, 'B(3, 3)', ACOL.gold, 12, -10);
          adot(pM, '중점 M(1, 1)', ACOL.white, 14, 14);
          adot(pP, atMidpoint ? 'P = M (PA = PB, 삼각형 아님)' : 'P(PA = PB 이등변!)', ACOL.cyan, 14, -12);
          atick(pA, pM, 1, ACOL.gold); atick(pM, pB, 1, ACOL.gold); atick(pP, pA, 2, ACOL.cyan); atick(pP, pB, 2, ACOL.cyan); // [표시 보강] AM = MB, PA = PB
        } else if (sub === 'areaBisectLines') {
          // 좌측: 삼각형 꼭짓점 A와 BC 중점 M 연결  |  우측: 직사각형 중심과 원 중심 연결
          const tA = S(-5, 3), tB = S(-7, -2), tC = S(-1, -2), tM = S(-4, -2);
          apoly([tA, tB, tM], 'rgba(251, 191, 36, 0.28)', ACOL.gold, 2.8, 0);

          aline(tA, tM, ACOL.pink, 3.6, [], true, 0);
          adot(tA, 'A(꼭짓점)', ACOL.white, 0, -14);

          atick(tB, tM, 1, ACOL.pink); atick(tM, tC, 1, ACOL.pink); // [표시 보강] BM = MC

          const rPts = [S(0, -1), S(0, -3), S(4, -3), S(4, -1)];
          const cRect = S(2, -2), cCirc = S(5, 2);
          apoly(rPts, 'rgba(56, 189, 248, 0.24)', ACOL.cyan, 2.8, 1);
          acircle(cCirc, 1.6 * unit, ACOL.green, 'rgba(52, 211, 153, 0.24)', 2.8, [], 2);
          aMathLine(4 / 3, -14 / 3, ox, oy, unit, ACOL.gold, 3.6, [], 2);
          adot(cRect, '사각형 교점(2,-2)', ACOL.cyan, 12, 18);
          adot(cCirc, '원의 중심(5,2)', ACOL.green, -10, -16);
        } else {
          // threeLinesNoTri (세 직선이 삼각형을 만들지 않을 3대 조건)
          // l1: y = x + 1, l2: y = -x + 3 -> 교점 P(1, 2)
          aMathLine(1, 1, ox, oy, unit, ACOL.cyan, 3.0, [], 0);
          aMathLine(-1, 3, ox, oy, unit, ACOL.green, 3.0, [], 1);

          const m3 = state.activePartIdx === 0 ? 1 : state.activePartIdx === 1 ? -1 : t < 0.33 ? 1 : t < 0.66 ? -1 : 2;
          aMathLine(m3, 0, ox, oy, unit, ACOL.pink, 3.8, [], 2);

          const pP = S(1, 2);
          adot(pP, '교점 P(1, 2) [a=2일 때 한 점 교차!]', ACOL.gold, 14, -12);
          adot(S(0, 0), `l₃: y = ${m3}x`, ACOL.pink, 14, 18);
        }
      }

      // =====================================================================
      // [모드 3] 점·직선 거리 & 신발끈 원점 평행이동 & 각의 이등분선 & 최대 거리
      // =====================================================================
      else if (m === 3) {
        if (sub === 'shoelaceArea') {
          const shiftX = -1 * t, shiftY = -1 * t;
          const pA = S(1 + shiftX, 1 + shiftY);
          const pB = S(5 + shiftX, 2 + shiftY);
          const pC = S(2 + shiftX, 5 + shiftY);

          // 원래 삼각형 잔상
          apoly([S(1, 1), S(5, 2), S(2, 5)], 'rgba(56, 189, 248, 0.10)', 'rgba(56, 189, 248, 0.4)', 1.8, 0);
          // 이동 중인 삼각형
          apoly([pA, pB, pC], 'rgba(251, 191, 36, 0.34)', ACOL.gold, 3.4, 2);

          if (t >= 1 - 1e-9) {
            // 원점 도착 시 4×4 외접 직사각형 보조 표시
            apoly([S(0, 0), S(4, 0), S(4, 4), S(0, 4)], null, 'rgba(244, 114, 182, 0.45)', 1.8, 1);
          }

          adot(pA, t >= 1 - 1e-9 ? "A'(0, 0: 원점)" : pointNow('A′', 1 - t, 1 - t), ACOL.cyan, -10, 22);
          adot(pB, pointNow('B′', 5 - t, 2 - t), ACOL.gold, 12, 12);
          adot(pC, `${pointNow('C′', 2 - t, 5 - t)}${t >= 1 - 1e-9 ? ' [넓이=½|16−1|=7.5]' : ''}`, ACOL.gold, 10, -12);
        } else if (sub === 'pointLineDist') {
          // 직선 3x + 4y - 5 = 0 (y = -0.75x + 1.25) 과 점 P(3, 4), 수선의 발 H(0.6, 0.8)
          aMathLine(-0.75, 1.25, ox, oy, unit, ACOL.cyan, 3.2);
          const pP = S(3, 4), pH = S(0.6, 0.8), pV = S(3, -1);

          apoly([pP, pH, pV], 'rgba(56, 189, 248, 0.18)', ACOL.cyan, 2.2, 2);
          aline(pP, pH, ACOL.gold, 4.0, [], true, 0);
          aright(pH, pP, S(-2, 2.75), 13, ACOL.pink);

          abadge(pP, pH, '수직거리 d = 4!', ACOL.gold, -22, 0.5, 0);
          adot(pP, 'P(3, 4)', ACOL.gold, 12, -12);
          adot(pH, 'H(수선의 발)', ACOL.pink, -35, 20);
        } else if (sub === 'parallelLineDist') {
          // y = 2x + 5 와 y = 2x - 5
          const uP = unit * 0.72;
          const SP = (mx, my) => toScreen(mx, my, ox, oy, uP);
          aMathLine(2, 5, ox, oy, uP, ACOL.cyan, 3.2);
          aMathLine(2, -5, ox, oy, uP, ACOL.cyan, 3.2);

          const pA = SP(0, 5), pB = SP(0, -5), pH = SP(4, 3);
          apoly([pA, pB, pH], 'rgba(251, 191, 36, 0.22)', ACOL.gold, 2.4);
          aline(pA, pB, ACOL.red, 3.2, [5, 4], false, 1);
          aline(pA, pH, ACOL.gold, 4.0, [], true, 0);
          aright(pH, pA, pB, 12, ACOL.gold);

          abadge(pA, pH, '진짜 수직거리 d = 2√5!', ACOL.gold, -18, 0.5, 0);
          abadge(pA, pB, '절편차 = 10 (빗변 ❌)', ACOL.red, -48, 0.5, 1);
          adot(pA, 'A(0, 5)', ACOL.white, -28, -8);
          adot(pB, 'B(0, -5)', ACOL.red, -32, 14);
          adot(pH, 'H(4, 3)', ACOL.gold, 14, 6);
          apar(SP(-2.3, 0.4), SP(-1.5, 2), 2, ACOL.cyan); apar(SP(2.3, -0.4), SP(3.1, 1.2), 2, ACOL.cyan); // [표시 보강] 평행한 두 직선 ≫
        } else if (sub === 'angleBisectorLine') {
          // 두 직선 y = 2x 와 y = 0.5x 의 각의 이등분선: y = x (예각) & y = -x (둔각)
          aMathLine(2, 0, ox, oy, unit, ACOL.cyan, 2.8);
          aMathLine(0.5, 0, ox, oy, unit, ACOL.cyan, 2.8);
          aMathLine(1, 0, ox, oy, unit, ACOL.gold, 3.6, [], 0);
          aMathLine(-1, 0, ox, oy, unit, ACOL.pink, 3.0, [6, 4], 1);

          const uP = 2.0 + 2.2 * t;
          const pP = S(uP, uP);
          const pH1 = S(0.6 * uP, 1.2 * uP), pH2 = S(1.2 * uP, 0.6 * uP);
          aline(pP, pH1, ACOL.green, 3.2, [], true, 0);
          aline(pP, pH2, ACOL.green, 3.2, [], true, 0);
          aright(pH1, pP, S(0, 0), 10, ACOL.green);
          aright(pH2, pP, S(0, 0), 10, ACOL.green);

          adot(pP, 'P(x, y): d₁ = d₂!', ACOL.gold, 14, -10);
          adot(S(0, 0), 'O(두 이등분선 90° 직교!)', ACOL.pink, -20, 24);
          { // [표시 보강] 이등분선이 가르는 같은 각 ●=●(노랑), 두 이등분선의 직각, 같은 거리 d₁ = d₂ 눈금
            const pO = S(0, 0);
            aang(pO, S(2, 1), S(1, 1), { color: ACOL.gold, r: 44, label: '●' });
            aang(pO, S(1, 1), S(1, 2), { color: ACOL.gold, r: 44, label: '●' });
            aright(pO, S(1, 1), S(-1, 1), 16, ACOL.pink);
            atick(pP, pH1, 2, ACOL.green); atick(pP, pH2, 2, ACOL.green);
          }
        } else {
          // maxDistFromPt (정점 A(3, 4)를 지나는 직선과 원점 O 사이 최대 거리 = OA = 5!)
          const pO = S(0, 0), pA = S(3, 4), pMid = S(1.5, 2);
          acircle(pMid, 2.5 * unit, 'rgba(244, 114, 182, 0.45)', 'rgba(244, 114, 182, 0.06)', 2.0, [5, 4], 2);

          // 슬라이더 t=1 일 때 기울기 m = -3/4 (OA ⊥ l)
          // [2.0 수정] 원본은 atan2(-3, 4): 화면 좌표는 y가 아래쪽이라 기울기 -3/4(OA ⊥ l)는 atan2(+3, 4) 입니다. 100%에서 직선이 OA와 수직이 됩니다.
          const angL = Math.atan2(3, 4) + (1 - t) * 0.85;
          const dirL = apt(Math.cos(angL), Math.sin(angL));
          const pL1 = aadd(pA, amul(dirL, -300)), pL2 = aadd(pA, amul(dirL, 300));
          aline(pL1, pL2, ACOL.cyan, 3.4, [], false, 0);

          // 원점 O에서 직선에 내린 수선의 발 H
          const vOA = asub(pO, pA);
          const proj = vOA.x * dirL.x + vOA.y * dirL.y;
          const pH = aadd(pA, amul(dirL, proj));

          apoly([pO, pH, pA], 'rgba(251, 191, 36, 0.25)', ACOL.gold, 2.6, 1);
          aline(pO, pA, ACOL.gold, 3.8, [], true, 1);
          aline(pO, pH, ACOL.pink, 3.6, [], true, 0);
          aright(pH, pO, pL2, 12, ACOL.pink);

          adot(pO, 'O(0, 0)', ACOL.white, -20, 20);
          adot(pA, '정점 A(3, 4) [최대 거리 OA = 5!]', ACOL.gold, 12, -12);
          if (adist(pH, pA) > 6) adot(pH, 'H(수선의 발: d < 5)', ACOL.pink, -45, -12);
        }

      // =====================================================================
      // [모드 4] 점 vs 도형 부호 역설 & 4대 대칭 & 복합 변환 3단계 해부기
      // =====================================================================
      else if (m === 4) {
        if (sub === 'compositeStepByStep') {
          // 원본 직각삼각형 T0: P(1, 2), Q(3, 2), R(1, 5)
          const T0 = [[1, 2], [3, 2], [1, 5]];
          // 1단계 (y=x 대칭): T1: (2, 1), (2, 3), (5, 1)
          const T1 = T0.map(([x, y]) => [y, x]);
          // 2단계 (y축 대칭 x->-x): T2: (-2, 1), (-2, 3), (-5, 1)
          const T2 = T1.map(([x, y]) => [-x, y]);
          // 3단계 ((+2, -1) 평행이동): T3: (0, 0), (0, 2), (-3, 0)
          const T3 = T2.map(([x, y]) => [x + 2, y - 1]);

          aMathLine(1, 0, ox, oy, unit, 'rgba(255,255,255,0.35)', 1.8, [5, 5]);
          apoly(T0.map(([x, y]) => S(x, y)), 'rgba(148, 163, 184, 0.16)', 'rgba(226, 232, 240, 0.6)', 2.2);
          apoly(T1.map(([x, y]) => S(x, y)), 'rgba(56, 189, 248, 0.22)', ACOL.cyan, 2.6, 0);
          apoly(T2.map(([x, y]) => S(x, y)), 'rgba(251, 191, 36, 0.22)', ACOL.gold, 2.6, 1);
          apoly(T3.map(([x, y]) => S(x, y)), 'rgba(52, 211, 153, 0.36)', ACOL.green, 3.4, 2);

          adot(S(1, 2), '원본 f(x,y)=0', ACOL.white, -10, -14);
          adot(S(2, 1), '① f(y,x)=0 [y=x대칭]', ACOL.cyan, 12, 16);
          adot(S(-2, 1), '② f(y,-x)=0 [y축대칭]', ACOL.gold, -60, -14);
          adot(S(0, 0), '③ f(y+1, 2-x)=0 완성!', ACOL.green, -50, 24);
        } else if (sub === 'paradoxPointVsFig') {
          const a = A_val, b = B_val;
          const curA = a * t, curB = b * t;
          const p0 = S(-2, -1), pMoved = S(-2 + curA, -1 + curB);

          acircle(p0, 1.5 * unit, 'rgba(56, 189, 248, 0.45)', 'rgba(56, 189, 248, 0.08)', 2.2, [5, 4], 0);
          acircle(pMoved, 1.5 * unit, ACOL.gold, 'rgba(251, 191, 36, 0.26)', 3.4, [], 1);
          drawJumpArch(p0, pMoved, -45, ACOL.cyan, `현재 이동${roundedNow(curA, curB) ? ' ≈' : ''} (+${fmtNum(curA)}, +${fmtNum(curB)})`, 0);

          adot(p0, '원본 C(-2, -1): (x+2)²+(y+1)²=r²', ACOL.cyan, -30, 24);
          adot(pMoved, pointNow('현재 C′', -2 + curA, -1 + curB), ACOL.gold, 10, -16);
        } else if (sub === 'symmetry4Basic') {

          aMathLine(1, 0, ox, oy, unit, 'rgba(52, 211, 153, 0.45)', 2.0, [5, 4], 2);

          apoly(baseT.map(([x, y]) => S(x, y)), 'rgba(255, 255, 255, 0.24)', ACOL.white, 3.0);
          apoly(baseT.map(([x, y]) => S(x, -y)), 'rgba(56, 189, 248, 0.26)', ACOL.cyan, 2.8, 0);
          apoly(baseT.map(([x, y]) => S(-x, y)), 'rgba(244, 114, 182, 0.26)', ACOL.pink, 2.8, 0);
          apoly(baseT.map(([x, y]) => S(-x, -y)), 'rgba(251, 191, 36, 0.28)', ACOL.gold, 2.8, 1);
          apoly(baseT.map(([x, y]) => S(y, x)), 'rgba(52, 211, 153, 0.28)', ACOL.green, 2.8, 2);

          adot(S(2, 1), '원본 (x, y)', ACOL.white, 12, -8);
          adot(S(2, -1), 'x축 대칭 (x, -y)', ACOL.cyan, 12, 16);
          adot(S(-2, 1), 'y축 대칭 (-x, y)', ACOL.pink, -85, -8);
          adot(S(-2, -1), '원점 대칭 (-x, -y)', ACOL.gold, -85, 16);
          adot(S(1, 2), 'y=x 대칭 (y, x)', ACOL.green, -20, -14);
        } else if (sub === 'symPointAndLine') {
          // 직선 y = x + 2 에 대한 점 P(3, 1)의 대칭점 P'(-1, 5) & 점 M(1, 1)에 대한 대칭점
          aMathLine(1, 2, ox, oy, unit, ACOL.cyan, 3.2, [], 1);
          const pP = S(3, 1), pP_line = S(-1, 5), pMid = S(1, 3);

          aright(pMid, pP, S(3, 5), 12, ACOL.pink);

          adot(pP, 'P(3, 1)', ACOL.white, 12, 14);
          adot(pMid, '중점 M(1, 3) ∈ y=x+2', ACOL.cyan, 14, 6);
          adot(pP_line, "P'(-1, 5) [선대칭!]", ACOL.pink, -35, -14);
          atick(pP, pMid, 1, ACOL.pink); atick(pMid, pP_line, 1, ACOL.pink); // [표시 보강] 중점 M: PM = MP'
        } else {
          // lineSlideSame: y = (b/a)x + 2 를 x축으로 +a 이동 = y축으로 -b 이동 일치!
          const a = A_val, b = B_val;
          const mSlope = b / a;
          aMathLine(mSlope, 2, ox, oy, unit, 'rgba(56, 189, 248, 0.55)', 2.4, [5, 4], 0);
          aMathLine(mSlope, 2 - b * t, ox, oy, unit, ACOL.gold, 3.8, [], 1);

          const pStart = S(0, 2), pRight = S(a * t, 2), pDown = S(0, 2 - b * t);
          apoly([pStart, pRight, pDown], 'rgba(251, 191, 36, 0.22)', ACOL.gold, 2.4);
          drawJumpArch(pStart, pRight, -28, ACOL.cyan, `현재 x축 이동 ${relationNow(a * t)}`, 0);
          drawJumpArch(pStart, pDown, -28, ACOL.pink, `현재 y축 이동 ${relationNow(-b * t)}`, 1);
          adot(pStart, '(0, 2)', ACOL.white, -35, -8);
          adot(pRight, pointNow('R′', a * t, 2), ACOL.cyan, 10, -8);
          adot(pDown, pointNow('S', 0, 2 - b * t), ACOL.pink, -42, 14);
        }
      }

      // =====================================================================
      // [모드 5] 빛의 반사 & 거울 대칭 최단거리 (펼침의 미학)
      // =====================================================================
      else if (m === 5) {
        if (sub === 'reflectTriPerim') {
          // 점 A(3, 1), x축 거울 대칭 A1(3, -1), y=x 거울 대칭 A2(1, 3) -> 직선 A1A2: y = -2x + 5 -> P(2.5, 0), Q(5/3, 5/3)
          aMathLine(1, 0, ox, oy, unit, ACOL.pink, 3.0, [], 1);
          aline(S(-6, 0), S(8, 0), ACOL.cyan, 3.2, [], false, 0);

          const pA = S(3, 1), pA1 = S(3, -1), pA2 = S(1, 3);
          const pP = S(2.5, 0), pQ = S(5 / 3, 5 / 3);

          apoly([pA, pP, pQ], 'rgba(251, 191, 36, 0.28)', ACOL.gold, 3.2, 2);
          aline(pA, pA1, 'rgba(56, 189, 248, 0.6)', 2.0, [4, 4], false, 0);
          aline(pA, pA2, 'rgba(244, 114, 182, 0.6)', 2.0, [4, 4], false, 1);

          // 펼쳐진 일직선 A1A2!
          aline(pP, alerp(pA, pA1, Math.max(0.25, t)), ACOL.cyan, 3.6, [], true, 0);
          aline(pQ, alerp(pA, pA2, Math.max(0.25, t)), ACOL.pink, 3.6, [], true, 1);
          aline(pA1, pA2, ACOL.gold, 3.8, [6, 4], true, 2);

          adot(pA, '고정점 A(3, 1)', ACOL.white, 12, -8);
          adot(pA1, 'A₁(3, -1) [x축 대칭]', ACOL.cyan, 12, 16);
          adot(pA2, 'A₂(1, 3) [y=x 대칭]', ACOL.pink, -30, -14);
          adot(pP, 'P(x축 위)', ACOL.cyan, -10, 22);
          adot(pQ, 'Q(y=x 위)', ACOL.pink, -45, -6);

    return {

  /* 4-E 같은 직선으로 옮기는 두 평행이동 */

      steps: [`$l$ 위의 점 $R(0,\\ ${nt(n)})$를 $x$축 방향으로 $${nt(p)}$ 옮겨 새 직선 $l'$이 지나는 점을 잡습니다(그림의 파란 화살표).`, `$l'$은 $l$과 기울기가 $${nt(m)}$로 같은 직선입니다. $l'$이 $y$축과 만나는 점 $S$는 $R$에서 위로 $q$만큼 올라간 곳입니다.`, `기울기가 $${nt(m)}$이므로 $x$축으로 $${nt(p)}$ 간 것은 직선을 따라 $y$가 $${nt(m * p)}$ 변한 만큼 ${m * p > 0 ? '아래' : '위'}로 옮긴 것과 같습니다. $q=-${pr(m)}\\cdot${pr(p)}=${nt(q)}$`, `정석 확인: $l'$은 $y=${nt(m)}(x-${pr(p)})+${nt(n)}$이고, $y$축 방향으로 $q$ 옮긴 직선 $y=${nt(m)}x+${nt(n)}+q$와 같으려면 $q=-${pr(m)}\\cdot${pr(p)}$입니다.`],

  /* ======================= 탐구관 5 · 반사와 최단거리 (대칭으로 펴기) ======================= */
  const crossAxis = (p, q, axis) => { // 선분 pq를 지나는 직선이 x축(axis='x') 또는 y축('y')과 만나는 점

  function mkTriPer(a, b) {

    return {

      text: `좌표평면 위의 점 ${tex(NT('A', A))}가 있다. ${tex('x')}축 위의 점 ${tex('P')}와 직선 ${tex('y=x')} 위의 점 ${tex('Q')}에 대하여 삼각형 ${tex('APQ')}의 둘레의 길이의 최솟값을 구하시오.`,
      steps: [`둘레는 $\\overline{AP}+\\overline{PQ}+\\overline{QA}$입니다. $A$를 $x$축에 대하여 대칭이동한 점을 $A'${pT(a, -b)}$, 직선 $y=x$에 대하여 대칭이동한 점을 $A''${pT(b, a)}$라 하면 $\\overline{AP}=\\overline{A'P}$, $\\overline{AQ}=\\overline{A''Q}$입니다.`, `둘레 $=\\overline{A'P}+\\overline{PQ}+\\overline{QA''}$입니다. 두 축과의 교점이 $A'\\to P\\to Q\\to A''$ 순서로 놓이므로 삼각형의 부등식에서 등호가 성립하고, 곧은 선분의 길이가 최솟값입니다.`, `최솟값 $=\\overline{A'A''}=\\sqrt{(${nt(a)}-${pr(b)})^2+(${nt(-b)}-${nt(a)})^2}=\\sqrt{${n2}}=${radT(n2)}$`, `정석 확인: $P(p,0)$, $Q(q,q)$로 놓고 거리의 합을 직접 최소화하는 것은 계산이 복잡하며, 대칭이동으로 펴면 위 값이 바로 나옵니다.`],

  /* 6-C 절편이 같은 직선 (원점을 지나는 경우를 빠뜨리지 않기) */

      text: `좌표평면에서 점 ${tex(NT('P', [p, q]))}를 지나고 ${tex('x')}절편과 ${tex('y')}절편이 서로 같은 직선은 두 개이다. 이 두 직선의 기울기의 합을 구하시오.`,
      steps: [`절편이 같은 직선은 두 종류입니다. ① 절편이 $0$이 아닌 경우: $x$절편과 $y$절편이 같은 양이므로 기울기가 $-1$인 직선입니다. $P$를 지나면 $x+y=${nt(t)}$ (절편 $${nt(t)}$, 그림의 파란 선).`, `② 절편이 둘 다 $0$인 경우: 원점을 지나는 직선입니다(원점에서 $x$절편과 $y$절편이 모두 $0$으로 같음). $P$와 원점을 지나는 직선, 기울기 $${frT(q, p)}$ (그림의 빨간 선).`, `두 직선의 기울기의 합 $=-1+${frT(q, p)}=${frT(q - p, p)}$`, '정석 확인: 절편이 같다 → $\\dfrac{x}{a}+\\dfrac{y}{a}=1$ 꼴로 두면 원점을 지나는 직선($a=0$)이 빠집니다. 이것이 함정입니다.'],
      std: `① 절편이 ${tex('a(\\ne 0)')}으로 같으면 ${tex('\\dfrac{x}{a}+\\dfrac{y}{a}=1')}, ${tex(`P`)}를 지나므로 ${tex(`a=${nt(t)}`)}, 기울기 ${tex('-1')}<br/>② 절편이 ${tex('0')}이면 원점과 ${tex('P')}를 지나는 직선, 기울기 ${tex(frT(q, p))}<br/>③ 합 ${tex(frT(q - p, p))}`,
      quick: `「절편이 같다」는 기울기 ${tex('-1')}인 직선과 원점을 지나는 직선, 두 가지입니다. 서술형에는 「절편이 ${tex('0')}인 경우를 따로 생각하면」이라고 반드시 적습니다.`,

      hl:'직선의 계수 (a,b)는 그 직선에 수직인 방향입니다. 두 직선의 수직 여부를 두 법선의 내적 하나로 확인합니다.',

  /* 6-E 직사각형 종이접기 (C → O, 접는 선은 대각선의 수직이등분선) */
  function mkFold(w, h) {
    const O = [0, 0], A = [w, 0], C = [w, h], B = [0, h], M = [w / 2, h / 2], mf = -w / h, nf = (h * h + w * w) / (2 * h), F = [(w * w + h * h) / (2 * w), 0], E = [(w * w - h * h) / (2 * w), h], val = mf + nf;
    const items = [Pl([O, A, C, B], { c: 'ink', fill: 'sky', fa: 0.1 }), Pt(O, 'O'), Pt(A, NP('A', A)), Pt(C, NP('C', C)), Pt(B, NP('B', B)), Sg(O, C, { c: 'sky', w: 2.6, dash: true, at: 1 }), Pt(M, 'M', { c: 'amber', at: 1 }), Tk(O, M, 1, { c: 'amber', at: 1 }), Tk(M, C, 1, { c: 'amber', at: 1 }),
      Ln(M, mf, { c: 'rose', at: 2 }), Rt(M, C, E, { c: 'amber', at: 2 }), Pt(E, 'E', { c: 'rose', at: 2 }), Pt(F, 'F', { c: 'rose', at: 2 }), Pt([0, nf], `(0, ${nm(nf)})`, { c: 'rose', at: 3 })];
    return {
      fig: { items }, par: { w, h }, val, ans: nt(val), tag: '2021학년도 11월 학평(경기) 25번 유형 · 종이접기와 수직이등분선',
      text: `좌표평면에서 ${tex(`O(0,\\ 0),\\ A${pT(w, 0)},\\ C${pT(w, h)},\\ B${pT(0, h)}`)}를 꼭짓점으로 하는 직사각형 모양의 종이를 꼭짓점 ${tex('C')}가 원점 ${tex('O')}에 겹치도록 접었다. 접은 선을 직선 ${tex('y=mx+n')}이라 할 때, ${tex('m+n')}의 값을 구하시오.`,
      steps: [`$C$가 $O$에 겹치도록 접으므로 접는 선은 선분 $OC$의 수직이등분선입니다. 먼저 $OC$의 중점 $M=${pT(M[0], M[1])}$을 잡습니다.`, `$OC$의 기울기가 $${frT(h, w)}$이므로 접는 선의 기울기는 $${frT(-w, h)}$입니다. $M$을 지나고 $OC$에 수직인 직선이 접는 선입니다(그림의 빨간 선).`, `$y-${nt(M[1])}=${frT(-w, h)}(x-${nt(M[0])})$에서 $y$절편 $n=${nt(nf)}$ → $m+n=${frT(-w, h)}+${nt(nf)}=${nt(val)}$`, `정석 확인: 접는 선 위의 점 $P(x,y)$는 $O$, $C$에서 같은 거리이므로 $x^2+y^2=(x-${w})^2+(y-${h})^2$을 정리해도 $y=${frT(-w, h)}x+${nt(nf)}$입니다.`],
      std: `① 접는 선 위의 점 ${tex('P(x,\\ y)')}는 ${tex('\\overline{PO}=\\overline{PC}')}이므로 ${tex(`x^2+y^2=(x-${w})^2+(y-${h})^2`)}<br/>② 정리하면 ${tex(`${w}x+${h}y=${(w * w + h * h) / 2}`)}, 곧 ${tex(`y=${frT(-w, h)}x+${nt(nf)}`)}`,
      quick: `접어서 겹치는 두 점을 잇는 선분의 수직이등분선이 접는 선입니다. 서술형에는 「접은 선은 선분 ${tex('OC')}의 수직이등분선이므로」라고 쓰고 중점과 수직을 이용합니다.`,
      hl: '종이접기는 대칭이동의 한 종류입니다. 겹치는 두 점의 중점을 지나고 두 점을 이은 선분에 수직인 직선이 접는 선입니다.', warn: '접는 선의 기울기는 OC의 기울기의 역수에 부호를 바꾼 것입니다. 중점을 지난다는 조건을 빠뜨리지 마세요.'

  /* 탐구의 현재 그림을 설명하는 3단계. 은행의 문항·정답·풀이와 독립입니다. */
  function exploreSteps(id, s) {
    const t = s.fold, { m, n } = RATIO_OPTS[s.ratioIdx], { a, b } = SCALE_OPTS[s.scaleIdx];
    if (id === 'divInternalExternal') return [
      `Step 1 · 같은 비, 다른 위치 — 현재 A(−2), B(4)를 ${m}:${n}으로 나눕니다. 안쪽 P와 연장선의 Q를 구별하고 $AB=6$을 기준으로 봅니다.`,
      `Step 2 · 내분은 합, 외분은 차 — $P=\\dfrac{4m-2n}{m+n}=${frT(4 * m - 2 * n, m + n)}$, $Q=\\dfrac{4m+2n}{m-n}=${frT(4 * m + 2 * n, m - n)}$입니다.`,
      `Step 3 · 방향으로 검산 — 현재 ${m > n ? 'm이 n보다 커서 Q는 B쪽' : 'm이 n보다 작아서 Q는 A쪽'} 연장선에 있습니다. $AP:PB=AQ:QB=${m}:${n}$이며, 외분에서 $m=n$이면 유한한 Q가 없습니다.`
    ];
    if (id === 'divExtendedLine') return [
      'Step 1 · 좌표 한 칸의 이동 — 현재 A(0, 0)에서 B(2, 1)로 가는 한 칸은 (2, 1)입니다. BC = 2AB인 C는 B의 양쪽에서 찾아야 합니다.',
      'Step 2 · B에서 양방향 두 칸 — $C=B+2(B-A)=(6,3)$ 또는 $C=B-2(B-A)=(-2,-1)$입니다.',
      'Step 3 · 위치와 거리 확인 — C₁은 B쪽, C₂는 A쪽 연장선입니다. 두 경우 모두 $BC=2\\sqrt5=2AB$이므로 한 방향만 세면 해를 놓칩니다.'
    ];
    if (id === 'pappusMedian') return [
      'Step 1 · 중점 M을 원점으로 — 현재 B(−3, 0), C(3, 0), A(1, 3)입니다. 대칭인 B와 C 때문에 거리의 제곱합에서 교차항이 소거됩니다.',
      'Step 2 · 제곱합을 묶기 — $AB^2=4^2+3^2=25$, $AC^2=(-2)^2+3^2=13$입니다. $AB^2+AC^2=2(AM^2+BM^2)$로 바꿔 읽습니다.',
      'Step 3 · 현재 중선 확인 — $38=2(AM^2+9)$이므로 $AM^2=10$, $AM=\\sqrt{10}$입니다. 그림의 중점 눈금이 계산을 줄이는 근거입니다.'
    ];
    if (id === 'centroidParaCoord') {
      if (t > 0.5 || s.part === 1) return [
        'Step 1 · 현재는 평행사변형 보기 — A(0, 4), B(−3, −1), C(6, 0)에 네 번째 꼭짓점 D를 붙입니다. 대각선 AC와 BD가 서로를 이등분합니다.',
        'Step 2 · 같은 중점으로 연결 — $\\frac{A+C}{2}=\\frac{B+D}{2}$이므로 $D=A+C-B=(9,5)$입니다.',
        'Step 3 · 대각선 검산 — AC와 BD의 중점이 모두 (3, 2)입니다. 따라서 두 변의 방정식을 각각 구할 필요 없이 D를 찾습니다.'
      ];
      const u = m / (m + n);
      return [
        `Step 1 · 같은 방향으로 내분 — A(0, 4), B(−3, −1), C(6, 0)의 각 변을 순환 방향으로 ${m}:${n} 내분한 D, E, F를 봅니다.`,
        `Step 2 · 세 내분점을 더하기 — $D=\\frac{nA+mB}{m+n},\ E=\\frac{nB+mC}{m+n},\ F=\\frac{nC+mA}{m+n}$입니다. 현재 ${pointNow('D', -3 * u, 4 - 5 * u)}, ${pointNow('E', -3 + 9 * u, -1 + u)}, ${pointNow('F', 6 - 6 * u, 4 * u)}입니다.`,
        'Step 3 · 무게중심 불변 — $D+E+F=A+B+C=(3,3)$이므로 두 삼각형의 무게중심은 모두 G(1, 1)입니다. 내분비를 바꾸어도 이 합은 그대로입니다.'

    if (id === 'distMinSumSq') return [

      return [
        `Step 1 · 거리비의 자취 — A(−3, 0), B(3, 0), PA:PB = 2:1이면 $(x+3)^2+y^2=4((x-3)^2+y^2)$입니다. 정리하면 중심 C(5, 0), 반지름 4인 원입니다. 현재 ${pointNow('P', x, y)}입니다.`,
        `Step 2 · 넓이는 높이 — 밑변 AB = 6이므로 $S=3|y|$입니다. 현재 넓이 ${relationNow(area)}, 최대 넓이는 원의 꼭대기 (5, 4)에서 12입니다.${Math.abs(t) < 1e-9 ? ' 지금이 넓이 최대 위치입니다.' : ''}`,
        `Step 3 · 각은 접선 방향 — 현재 각 PAB ${relationNow(angle)}°입니다. A에서 원에 접할 때 $\\sin\\angle PAB=\\frac{CT}{AC}=\\frac48$이므로 최대 30°입니다. 접점은 $T=(3,2\\sqrt3)$이며 ${Math.abs(t - 0.5) < 1e-9 ? '지금이 각 최대 위치입니다.' : '50%에서 P가 이 접점에 옵니다.'} 넓이 최대 위치와 다릅니다.`
      ];
    }
    if (id === 'trapLineSegmentMeet') return [
      'Step 1 · 선분을 보는 두 경계선 — P(0, −1)에서 A(1, 3), B(4, 1)을 보는 두 끝 방향은 각각 기울기 4와 1/2입니다. 선분 AB의 모든 점은 P의 오른쪽에 있습니다.',
      'Step 2 · 사이의 방향을 모두 포함 — P를 지나는 직선 $y=mx-1$이 선분과 만나려면 $\\frac12\\le m\\le4$입니다. 끝점에서 만나는 경우도 포함합니다.',
      `Step 3 · 현재 직선 검산 — 현재 기울기 m ${relationNow(0.5 + 3.5 * t)}입니다. ${Math.abs(t) < 1e-9 ? '지금은 B에서 만납니다.' : Math.abs(t - 1) < 1e-9 ? '지금은 A에서 만납니다.' : '지금은 선분 AB의 내부에서 만납니다.'} 선분의 x좌표가 양수이므로 기울기가 무한대가 되는 경계는 없습니다.`
    ];
    if (id === 'trapInterceptZero') return [
      'Step 1 · 같은 절편의 두 가능성 — P(2, 4)를 지나는 직선의 x절편과 y절편이 같다고 해서 그 값이 0이 아니라고 가정하면 안 됩니다.',
      'Step 2 · 0이 아닌 공통 절편 — 공통 절편을 c라 두면 $x+y=c$입니다. P를 대입하면 c = 6이어서 파란 직선 x + y = 6을 얻습니다.',
      'Step 3 · 0인 절편 별도 확인 — P와 원점을 잇는 분홍 직선 y = 2x도 두 절편이 모두 0입니다. 따라서 현재 그림의 두 직선이 모두 조건을 만족합니다.'
    ];
    if (id === 'trapPerpDivideZero') {
      const k = s.perpK, dot = 5 * k - 7, det = (k - 1) * (k - 2) - 6;
      const kind = Math.abs(dot) < 1e-9 ? '현재 두 직선은 수직입니다.' : Math.abs(det) < 1e-9 ? '현재 두 직선은 서로 다른 평행선입니다.' : '현재 두 직선은 한 점에서 만나지만 수직은 아닙니다.';
      return [
        `Step 1 · 나누기 전 일반형 유지 — 현재 k ${relationNow(k)}인 $(k-1)x+2y+1=0$, $3x+(k-2)y-2=0$입니다. ${Math.abs(k - 1) < 1e-9 ? '지금 첫 직선은 y = −1/2인 수평선입니다.' : Math.abs(k - 2) < 1e-9 ? '지금 둘째 직선은 x = 2/3인 수직선입니다.' : '두 법선 (k−1, 2), (3, k−2)는 항상 영벡터가 아닙니다.'}`,
        `Step 2 · 내적과 행렬식 — 법선 내적 $3(k-1)+2(k-2)=5k-7$은 현재 ${relationNow(dot)}입니다. 행렬식 $(k-1)(k-2)-6$은 현재 ${relationNow(det)}입니다.`,
        `Step 3 · 현재 관계와 조건 — ${kind} 수직 조건은 $5k-7=0$, 즉 $k=\\frac75$입니다. $k=1,2$에서도 일반형 검산이 가능하고, $k=-1,4$에서는 행렬식이 0인 평행 상태입니다.`
      ];
    }
    return [
      'Step 1 · 접는 선의 등거리 — 현재 직사각형은 O(0, 0), A(8, 0), C(8, 4), B(0, 4)입니다. C가 O에 겹치도록 접는 선 위의 점은 O와 C까지의 거리가 같습니다.',
      'Step 2 · 대각선의 수직이등분선 — OC의 중점 M(4, 2), 기울기 1/2를 이용하면 접는 선은 $y-2=-2(x-4)$, 즉 $y=-2x+10$입니다.',
      'Step 3 · 실제 종이의 경계와 만나기 — 윗변 y = 4에서는 E(3, 4), 아랫변 y = 0에서는 F(5, 0)입니다. 두 점 모두 직사각형의 변 위에 있고 OE = CE, OF = CF이므로 접는 선 EF가 맞습니다.'
    ];
  }

  const probPart = (PB, id) => ({
    // 수업 모드는 steps(s)만 호출하므로 기본 lab을 읽습니다. 독립 탐구 예시에 은행 숫자를 섞지 않습니다.
    steps: (s, lab = window.lab) => (lab && lab.tab === 'explore' ? exploreSteps(id, s) : PB.V.cur().steps).map((t) => t.replace(/\$([^$]+)\$/g, (m0, q) => '$' + q.replace(/''/g, "^{\\prime\\prime}").replace(/'/g, '^{\\prime}') + '$')),
    reviewTop: () => `<div class="apl-rich" style="font-size:var(--fs-sm);line-height:1.75"><small style="color:var(--text-3);font-weight:800">문제</small><br>${PB.V.cur().text}</div>`,
    vary: PB.V,
    problem: { tag: () => PB.V.cur().tag || PB.tag, time: PB.time, text: () => PB.V.pool.length > 1 ? probHTML(PB.V.cur().text) : PB.V.cur().text, answer: () => tex(PB.V.cur().ans) },
    solution: {
      standardTitle: '정석(식) 풀이', standardTag: '정석', quickTitle: PB.quickTitle, quickTag: '10초 컷',
      standard: () => ({ steps: PB.V.cur().std, warning: PB.V.cur().warn }),
      quick: () => ({ steps: PB.V.cur().quick, highlight: PB.V.cur().hl })
    }
  });

  function sceneOf(m, it) {
    const id = it.id;
    const PB = PROBS[id];
    const label = arrow(it.label);
    return {
      id, title: label, short: label, reviewTab: true, autoFit: true,
      question: QUESTIONS[m - 1],
      notesTitle: '오답 함정과 풀이 요령',
      ...(PB ? probPart(PB, id) : {}),
      enter: (s) => {
        // 원본 setMode / setSubType 의 초기화 규칙(변환 0%, 렌즈가 없는 장면이면 전체 구조)
        s.fold = 0;
        if (id === 'trapPerpDivideZero') s.perpK = 1.4;
        if (!lensList(id).includes(s.lens)) s.lens = 'all';
      },
      controls: () => id === 'trapPerpDivideZero' ? ['perpK'] : (FOLD.has(id) ? ['fold'] : []),
      presets: () => {
        const out = [];
        if (FOLD.has(id)) [0, 0.5, 1].forEach((v) => out.push({ group: '변환 단계', label: v === 0 ? '0% 시작' : v === 1 ? '100% 완성' : '50%', set: { fold: v }, ms: 700, on: (st) => Math.abs(st.fold - v) < 0.01 }));
        if (RATIO.has(id)) RATIO_OPTS.forEach((ro, idx) => out.push({ group: '분할 비율 m : n', label: ro.label, apply: (st) => { st.ratioIdx = idx; }, on: (st) => st.ratioIdx === idx }));
        if (id === 'trapApollonius') {
          out.push({ group: '서로 다른 최대', label: '넓이 최대 · 원의 꼭대기', set: { fold: 0 }, on: st => Math.abs(st.fold) < 1e-8 });
          out.push({ group: '서로 다른 최대', label: '각 최대 · A에서 그은 접선', set: { fold: 0.5 }, on: st => Math.abs(st.fold - 0.5) < 1e-8 });
        }
        if (id === 'fixedPointPencil') out.push({ group: '특수 위치', label: 'k=1 · 수직선 x=1', set: { fold: 5 / 7 }, on: st => Math.abs(st.fold - 5 / 7) < 1e-8 });
        if (id === 'trapPerpDivideZero') [-1, 1, 1.4, 2, 4].forEach(k => out.push({ group: '일반형의 경계', label: k === 1.4 ? 'k=7/5 · 수직' : `k=${k}${k === 1 ? ' · 수평선 포함' : k === 2 ? ' · 수직선 포함' : ' · 평행'}`, set: { perpK: k }, on: st => Math.abs(st.perpK - k) < 1e-8 }));
        if (SCALE.has(id)) SCALE_OPTS.forEach((so, idx) => out.push({ group: '기울기·이동량 (a, b)', label: so.label, apply: (st) => { st.scaleIdx = idx; }, on: (st) => st.scaleIdx === idx }));
        const lenses = lensList(id);
        if (lenses.length) LENSES.filter(([k]) => lenses.includes(k)).forEach(([k, lbl]) => out.push({ group: '보기 선택', label: lbl, apply: (st) => { st.lens = k; }, on: (st) => st.lens === k }));
        return out;
      },
      actions: () => {
        if (!FOLD.has(id)) return [];
        return [{
          id: 'act', play: true, primary: true, icon: 'wand',
          label: (st) => { sync(st, m, id); return arrowOnly(getSpec().actionTxt); },
          run: (st, lab) => { lab.tween({ fold: id === 'trapApollonius' ? (Math.abs(st.fold - 0.5) < 1e-8 ? 0 : 0.5) : st.fold > 0.5 ? 0 : 1 }, 1100); }
        }];
      },
      view: (s, lab) => {
        sync(s, m, id);
        const spec = arrow(getSpec());
        if (PB && lab && lab.tab !== 'explore') return { formula: '', rule: '', notes: '' }; // 현재 문제의 3단계·정석/빠른 풀이를 사용한다. 독립 탐구 예시의 다른 숫자를 섞지 않는다.
        return {
          guide: `<div style="font-weight:800;margin-bottom:6px">${APLab.esc(APLab.stripEmoji(spec.badge))}</div>${spec.hint}`,
          readouts: [
            { label: spec.dim1Name, value: spec.val1Txt, color: 'sky' },
            { label: spec.dim2Name, value: spec.val2Txt, color: 'rose' }
          ],
          parts: spec.parts.map((p) => ({ id: p.id, name: p.name, desc: p.desc, value: p.val, color: tone(p), ok: p.ok })),
          summary: spec.totalRes,
          rule: spec.rule,
          formula: spec.formulaHTML,
          notes: spec.notes,
          tape: { title: spec.tapeTitle, segments: (spec.tapeSegs || []).map((g) => ({ text: g.text, weight: g.weight, color: g.color })) }
        };
      },
      draw: (b, s, v, lab) => {
        BOARD = b;
        if (PB && !b.thumb && !b._bbox && lab.tab !== 'explore') { drawProblem(b, s, lab, id, PB); return; }
        if (!b.thumb && !b._bbox) restoreExplore(b, id);
        // 내분점 장면은 그림이 무대 폭을 거의 다 쓰므로 라벨 축소(kit _ts)를 끄고 12.5px 그대로 씁니다(휴대폰에서도 12px 이상). 다른 장면은 원래대로입니다.
        if (id === 'divInternalExternal') b._ts = () => 1; else delete b._ts;
        const paint = (st) => {
          sync(st, m, id);
          placedLabels = [];
          drawPlane(b, planeOf(m, id), st.grid);
          drawAnalyticMasterScene(0, 0, UNIT, state.fold, getSpec());
        };
        // 자동 맞춤을 재는 중: 변환 단계·비율·이동량·강조 조각을 모두 겹쳐 그려, 어느 조작에서도 그림·글자가 잘리지 않는 범위를 구합니다.
        const paintAll = () => {
          sync(s, m, id);
          const nParts = getSpec().parts.length;
          const folds = FOLD.has(id) ? [0, 0.25, 0.5, 0.75, 1] : [s.fold];
          const ratios = RATIO.has(id) ? [0, 1, 2, 3] : [s.ratioIdx];
          const scales = SCALE.has(id) ? [0, 1, 2, 3] : [s.scaleIdx];
          const parts = [null].concat(Array.from({ length: nParts }, (_, i) => i));
          parts.forEach((pt) => folds.forEach((f) => ratios.forEach((r) => scales.forEach((c) => paint({ ...s, part: pt, fold: f, ratioIdx: r, scaleIdx: c })))));
        };
        if (b._bbox) { paintAll(); return; }
        if (b.thumb) { // 모든 장면 미리보기: 장면 범위를 직접 재어 맞추고, 완성(변환 100%) 상태로 그림
          const bb = b.measure(paintAll);
          if (bb) b.focus = b.fitBox(bb, { margin: 0.08, px: 5 });
          paint({ ...s, part: null, fold: FOLD.has(id) ? 1 : 0 });
          return;
        }
        paint(s);
      }
    };
  }

  const groups = Object.keys(SUB_MENUS).map((k) => {
    const m = +k;
    return { id: 'm' + m, title: TABS[m - 1], short: SHORT[m - 1], scenes: SUB_MENUS[m].map((it) => sceneOf(m, it)) };
  });

  APLab.createLab({
    id: 'common-lines',
    stagedReveal: true,
    title: '평면 · 직선 · 이동',
    courseName: '공통수학',
    unit: '도형의 방정식',
    courseColor: 'var(--m-sky)',
    home: '../index.html#common',
    legacy: '../../labs/공통수학/평면·직선·이동.html',
    board: { kind: 'figure', autoFit: true, minZoom: 0.4, maxZoom: 6 },
    state: { lens: 'all', ratioIdx: 0, scaleIdx: 1 },
    persist: ['lens', 'ratioIdx', 'scaleIdx'],
    params: {
      perpK: { value: 1.4, min: -4, max: 6, step: 0.05, color: 'sky', label: '두 직선의 계수 k', format: v => `k ${relationNow(v)}` },
      fold: { value: 0, min: 0, max: 1, step: 0.005, color: 'amber', label: '변환 진행 (0% → 100%)', hint: '회전 · 평행이동 · 대칭 · 점 이동 같은 변환을 천천히 확인합니다', format: (v) => `${Math.round(v * 100)}%` }
    },
    groups
  });
});
</script>
