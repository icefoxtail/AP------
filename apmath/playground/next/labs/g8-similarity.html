<script>try{var t=localStorage.getItem('apl:theme');t=t?JSON.parse(t):'paper';document.documentElement.setAttribute('data-theme',t==='board'?'board':'paper')}catch(e){document.documentElement.setAttribute('data-theme','paper')}</script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="../kit/vendor/katex/katex.min.css">
<link rel="stylesheet" href="../kit/apl.css">
<link rel="stylesheet" href="../kit/apl-video.css">
<script defer src="../kit/vendor/katex/katex.min.js"></script>

<body>
<noscript>이 실험실을 보려면 브라우저에서 자바스크립트를 켜야 합니다.</noscript>
<script>
/* ==========================================================================
   중2 · 도형의 닮음 (AP Math Lab 2.0) — Ⅲ. 도형의 닮음
   탭(order 순): ① 닮은 도형(10) · ② 닮음비와 넓이·부피의 비(20) · ③ 삼각형의 닮음 조건(30) · ④ 삼각형과 평행선(40) ·
                 ⑤ 평행선 사이의 선분의 길이의 비(50) · ⑥ 직각삼각형의 수선(60) · ⑦ 닮음의 활용(70) · ⑧ 심화 · 무게중심(80)
   이 파일은 얇은 껍데기입니다. 공용 도구는 labs/g8-similarity/core.js, 각 탭은 t1~t8.js 모듈이
   window.APL_SM_GROUPS 에 { order, id, title, short, params, scenes } 를 등록하면 order 순으로 붙습니다.
   원칙(학생 가독성)
   - 그림은 무대 가득 · 길이와 각은 그림 안에 크게(화면 기준 14px 이상) · 모든 도형은 막대나 손잡이로 조절 · 길이는 정수(√ 없음)
   - 색의 역할: 하늘=작은(첫째) 도형 · 초록=큰(둘째) 도형·평행선 · 분홍=같은 각 · 노랑=구하는 값 x·끌 수 있는 점
   - 움직임은 가로로만(제자리 회전·접기는 허용). 탐구 → 정리(교과서 풀이 순서) → 문제(5지선다 + 숫자 바꾸기)
   - 옛 이식본(경험도감)은 legacy 로 남겨 두었습니다.
   ========================================================================== */
window.addEventListener('DOMContentLoaded', function () {
'use strict';
const MODULES = ['core', 't1', 't2', 't3', 't4', 't5', 't6', 't7', 't8', 'solutions', 'lesson-a', 'lesson-b', 'lesson-c'];
const loadScript = (src) => new Promise((res) => {
  const el = document.createElement('script');
  el.src = src; el.async = false;
  el.onload = () => res(true);
  el.onerror = () => { el.remove(); res(false); }; // 아직 없는 모듈은 건너뜁니다
  document.head.append(el);
});

function start() {
  const mods = (window.APL_SM_GROUPS || []).filter((g) => g && Array.isArray(g.scenes) && g.scenes.length);
  const groups = mods.slice().sort((a, b) => (a.order || 0) - (b.order || 0)).map((g) => ({ id: g.id, title: g.title, short: g.short || g.title, scenes: g.scenes }));
  const params = {};
  mods.forEach((g) => Object.assign(params, g.params || {}));
  APLab.createLab({
    id: 'g8-similarity',
    stackFractions: true, // 패널 글의 슬래시·유니코드 분수를 쌓은 분수로 바꿉니다 (kit/apl-core.js APLab.stackFr)
    title: '도형의 닮음',
    courseName: '중2',
    unit: '도형의 성질 · 도형의 닮음',
    courseColor: 'var(--m-green)',
    home: '../index.html#g8',
    legacy: '../../labs/g8/similarity-atlas.html',
    board: { kind: 'figure', pad: 0.02, minZoom: 0.5, maxZoom: 6 },
    // 장면에 들어올 때마다 화면 범위를 처음 상태로 되돌립니다(앞 장면의 확대·위치가 남지 않게). 그림 맞춤은 장면 그리기에서 매번 합니다.
    enter: (s, sc, lab) => { if (lab && lab.board && s === lab.s) { lab.board.fit(); lab.board.setPanes(null); lab.board.setInsets({ top: 0, right: 0, bottom: 0, left: 0 }); } },
    params,
    lessons: (window.APL_LESSONS || {})['g8-similarity'] || {},
    groups
  });
}
Promise.all(MODULES.map((m) => loadScript(`g8-similarity/${m}.js`))).then(start);
});
</script>
</body>
</html>
