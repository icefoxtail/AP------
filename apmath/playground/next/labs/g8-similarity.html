     ➔ ⭕ ❌ 는 → ○ × 로. 모든 장면 미리보기는 글자 없이 그림만

    function fmtNum(v) {

  /* ===== 원본 상태 객체(이름 그대로) — 매 프레임 2.0 셸 상태에서 채웁니다 ===== */

    const RATIO_PRESETS = [

  /* ===== 원본 그대로: 세부 시나리오 목록 (원본 398–442행) ===== */
    const SUB_MENUS = {

      ],

        { id: 'centroidProof', label: '⚖️ 무게중심 G가 중선을 2:1로 나누는 이유 (닮음비 1:2 ➔ 2:1)' },

        { id: 'varignonQuad', label: '💎 사각형의 네 변의 중점을 이으면 평행사변형' }
      ],

        { id: 'foldRect', label: '📄 직사각형 종이접기 (•+×=90° AA닮음)' },

        { id: 'dimTile2D', label: '🧱 평면 타일 격자 (길이 1:n ➔ 넓이 1:n²)' },
        { id: 'dimCube3D', label: '🧊 정육면체 블록 (길이 1:n ➔ 부피 1:n³)' },
        { id: 'alwaysSimilar', label: '🚫 항상 닮은 도형(⭕)과 닮음이 아닌 함정 반례(❌)' }

  /* ===== 원본 그대로: 2D 기하 도우미 (원본 450–462행, 490–517행) ===== */
    const pt = (x, y) => ({ x, y });
    const lerp = (a, b, u) => pt(a.x + (b.x - a.x) * u, a.y + (b.y - a.y) * u);
    const mid = (a, b) => lerp(a, b, 0.5);
    const dist = (a, b) => Math.hypot(b.x - a.x, b.y - a.y);
    const mix3 = (a, b, c) => pt((a.x + b.x + c.x) / 3, (a.y + b.y + c.y) / 3);
    function calcCross(a, b, c, d) {
      const ux = b.x - a.x, uy = b.y - a.y, vx = d.x - c.x, vy = d.y - c.y;
      const den = ux * vy - uy * vx;
      if (Math.abs(den) < 1e-9) return mid(a, b);
      const u = ((c.x - a.x) * vy - (c.y - a.y) * vx) / den;
      return pt(a.x + u * ux, a.y + u * uy);
    }

    // 실제 꼭짓점 순서 기반 회전·반사(거울 뒤집기)·정렬 변환기
    function computeAlignedTriangle(origTri, refTri, destCenter, targetScale = 1.0, flipH = false, prog = 1.0) {
      const cOrig = mix3(origTri[0], origTri[1], origTri[2]);
      const sx = flipH ? (1 - 2 * prog) : 1;
      const flippedOrig = origTri.map(p => pt((p.x - cOrig.x) * (-1), p.y - cOrig.y));
      const baseVecOrig = flipH
        ? pt(flippedOrig[2].x - flippedOrig[1].x, flippedOrig[2].y - flippedOrig[1].y)
        : pt(origTri[2].x - origTri[1].x, origTri[2].y - origTri[1].y);
      const baseVecRef = pt(refTri[2].x - refTri[1].x, refTri[2].y - refTri[1].y);

      let angOrig = Math.atan2(baseVecOrig.y, baseVecOrig.x);
      let angRef = Math.atan2(baseVecRef.y, baseVecRef.x);
      let dAng = angRef - angOrig;
      while (dAng <= -Math.PI) dAng += Math.PI * 2;
      while (dAng > Math.PI) dAng -= Math.PI * 2;

      const curAng = dAng * prog;
      const curScale = 1 + (targetScale - 1) * prog;
      const curCenter = lerp(cOrig, destCenter, prog);

      return origTri.map(p => {
        const dx = (p.x - cOrig.x) * sx * curScale;
        const dy = (p.y - cOrig.y) * curScale;
        const rx = dx * Math.cos(curAng) - dy * Math.sin(curAng);
        const ry = dx * Math.sin(curAng) + dy * Math.cos(curAng);
        return pt(curCenter.x + rx, curCenter.y + ry);
      });
    }

  /* ===== [2.0] 새 도우미 ===== */
  // 각의 이등분선 장면: 세 변 AB = m·k, AC = n·k, BC = B 가 삼각형을 이루도록(약 1.4B 둘레) 하는 가장 작은 정수 k
  const bisectK = (M, N, B) => Math.ceil((1.4 * B) / (M + N));
  // 단위 좌표의 점들을 지정한 상자(x0..x1, y0..y1) 안에 가운데로 맞춰 옮기고 키우는 변환
  function fitUnits(pts, x0, x1, y0, y1) {
    const xs = pts.map((p) => p.x), ys = pts.map((p) => p.y);
    const minx = Math.min(...xs), maxx = Math.max(...xs), miny = Math.min(...ys), maxy = Math.max(...ys);
    const s = Math.min((x1 - x0) / Math.max(1e-6, maxx - minx), (y1 - y0) / Math.max(1e-6, maxy - miny));
    const ox = (x0 + x1) / 2 - ((minx + maxx) / 2) * s, oy = (y0 + y1) / 2 - ((miny + maxy) / 2) * s;
    return (p) => pt(ox + p.x * s, oy + p.y * s);
  }

  /* ======================================================================
     [2.0] 어댑터: 원본의 그리기 함수 → 새 무대 엔진
     - 원본의 규칙을 그대로 따릅니다: partIdx(-1=없음) → 강조 조각, 관찰 렌즈(conceptSwitch)에 따라 표시/숨김
     - 그림 안 글자는 화면 픽셀 크기로 그려져 확대·휴대폰에서도 읽히고, 자동 맞춤 계산에 글자 상자가 들어갑니다
     - [가독성] 원본은 글자 위치를 고정 오프셋으로 찍어 화면이 작으면 이름표끼리·점과 겹쳤습니다.
       장면을 두 번 훑어(1회: 점·설명 위치 수집, 2회: 그리기) 점 이름·길이 상자·각 이름이 서로, 그리고 점과 겹치지 않도록
       원본 위치를 우선하고 겹치면 가까운 빈자리로 옮깁니다. 긴 설명 글은 화면 폭에 맞춰 줄을 바꿉니다.
     ====================================================================== */
  let BOARD = null;
  const PL = { pass: 2, obst: [], placed: [] }; // pass 1: 점·설명 수집 / pass 2: 그리기. obst=장애물 상자, placed=이미 놓은 글자 상자(화면 좌표)
  const partOf = (p) => (p == null || p < 0 ? undefined : p);
  const dashOf = (d) => (Array.isArray(d) && d.length ? d : null);
  // 그림 안 글자: 원본의 ➔ ⭕ ❌ 는 글꼴에 따라 깨질 수 있어 → ○ × 로, 이모지는 뗍니다. (♡)(✓) 같은 장식 기호는 뗍니다.
  const cv = (s) => APLab.stripEmoji(String(s == null ? '' : s).replace(/➔/g, '→').replace(/⭕/g, '○').replace(/❌/g, '×').replace(/[\u23E9-\u23FF]/g, '').replace(/\s*\((?:♡|✓)\)/g, ''));
  const lensOK = (...names) => names.includes(state.conceptSwitch);
  const green = '#34d399', blue = '#38bdf8', amber = '#fbbf24', pink = '#f472b6', red = '#fb7185', white = '#f1f5f9';

  const twCache = new Map();
  function tw(str, size, weight) { // 글자 폭(px)
    const B = BOARD, key = `${weight}|${size.toFixed(2)}|${B.font}|${str}`;
    let w = twCache.get(key);
    if (w == null) {
      const c = B.ctx;
      c.save();
      c.font = `${weight} ${size}px ${B.font}`;
      w = c.measureText(str).width;
      c.restore();
      if (twCache.size > 4000) twCache.clear();
      twCache.set(key, w);
    }
    return w;
  }
  // 글자 크기: 칸이 작으면 Board가 글자를 최대 22% 줄이지만, 휴대폰에서 읽기 어려워 92% 아래로는 줄이지 않습니다
  const ES = () => Math.max(BOARD._ts(), 0.92);

  /* ===== 원본 그대로: 장면별 그리기 (원본 1617–2628행, 위 머리말의 [2.0 수정] 위치마다 주석) ===== */

      const g = null; // [2.0] 원본 캔버스 문맥은 쓰지 않습니다. draw* 함수의 첫 인자는 원본과 같은 모양을 지키려고 남겨 둔 자리표시자이며, 좌표 변환·확대는 무대가 맡습니다.

      // 좌우 작업 영역 구분선

          // [2.0 수정] 원본은 ∠A 가 약 31°, 컴퍼스 원호 반지름이 4.5(BC = 5 에 해당하는 길이보다 짧음)여서 해설의 "AB = 8, BC = 5, ∠A = 30°"와 맞지 않았습니다 → 1cm = 33 으로 정확히 그립니다.

          drawAngleArc(g, C1, A, B, { radius: 22, color: pink, symbol: angDeg(C1, A, B) });
          drawAngleArc(g, C2, A, B, { radius: 22, color: blue, symbol: angDeg(C2, A, B) });
          drawSideBadge(g, A, B, 'AB = 8', green, -15, 0.5, 2);
          drawSideBadge(g, B, C1, 'BC₁ = 5', pink, -14, 0.5, 0);
          drawSideBadge(g, B, C2, 'BC₂ = 5', blue, 14, 0.5, 1);

          const pProg = Math.max(0.25, t);
          const t1 = computeAlignedTriangle([A, B, C1], [A, B, C1], pt(635, 185), 0.72, false, pProg);
          const t2 = computeAlignedTriangle([A, B, C2], [A, B, C2], pt(645, 325), 0.72, false, pProg);
          poly(t1, pink, 'rgba(244,114,182,0.22)', 2.5, 0);
          poly(t2, blue, 'rgba(56,189,248,0.20)', 2.5, 1);
          drawAngleArc(g, t1[0], t1[1], t1[2], { radius: 22, color: green, symbol: '30°' }); // [표시 보강] 정렬한 그림에도 ∠A = 30°
          drawAngleArc(g, t2[0], t2[1], t2[2], { radius: 22, color: green, symbol: '30°' });
          drawAngleArc(g, t1[2], t1[0], t1[1], { radius: 16, color: pink, symbol: angDeg(C1, A, B) });
          drawAngleArc(g, t2[2], t2[0], t2[1], { radius: 16, color: blue, symbol: angDeg(C2, A, B) });
          txt('① 둔각삼각형 △ABC₁', pt(645, 120), pink, 12);
          txt('② 예각삼각형 △ABC₂ (서로 닮음 아님!)', pt(645, 260), blue, 12);
        } else if (sub === 'nestedRotated') {
          // [2.0 수정] 원본은 점 B, C 를 지역 변수로 선언해 기준 길이 변수 B 를 가려 라벨이 "NaN cm"·"[object Object] cm" 로 보였습니다 → 점 이름을 B_pt, C_pt 로
          const A = pt(205, 165), B_pt = pt(95, 380), C_pt = pt(405, 380);
          const angle = 0.82;
          const rotVec = p => {
            const dx = p.x - A.x, dy = p.y - A.y;
            return pt(A.x + K * (dx * Math.cos(angle) - dy * Math.sin(angle)), A.y + K * (dx * Math.sin(angle) + dy * Math.cos(angle)));
          };
          const D = rotVec(B_pt), E = rotVec(C_pt);

          poly([A, B_pt, C_pt], green, 'rgba(52,211,153,0.08)', 2.6, 1);
          poly([A, D, E], amber, 'rgba(251,191,36,0.22)', 2.8, 0);
          label('A', A, green, 0, -18); label('B', B_pt, green, -14, 14); label('C', C_pt, green, 14, 14);
          label('D', D, amber, -14, 12); label('E', E, amber, 16, -6);

          // [표시 보강] 같은 각은 같은 표시: ∠BAC = ∠DAE (•), ∠B = ∠D (×), ∠C = ∠E (○)
          kmark(A, B_pt, C_pt, 1, 28); kmark(A, D, E, 1, 20);
          kmark(B_pt, C_pt, A, 2, 24); kmark(D, E, A, 2, 18);
          kmark(C_pt, B_pt, A, 3, 22); kmark(E, D, A, 3, 16);

          drawSideBadge(g, A, B_pt, `${B} cm`, green, -15, 0.5, 1);
          drawSideBadge(g, A, D, `${fmtNum(B * K)} cm`, amber, 15, 0.5, 0);
          drawSideBadge(g, B_pt, C_pt, '10 cm', green, 16, 0.5, 1);

          const destTri = state.isSuperimposed
            ? [A, lerp(A, B_pt, K), lerp(A, C_pt, K)]
            : computeAlignedTriangle([A, D, E], [A, B_pt, C_pt], pt(645, 245), 1.05, false, Math.max(0.15, t));
          poly(destTri, amber, 'rgba(251,191,36,0.24)', 3, 0);
          ['A\'', 'D\'(↔B)', 'E\'(↔C)'].forEach((lb, i) => label(lb, destTri[i], amber, i === 0 ? 0 : (i === 1 ? -18 : 18), i === 0 ? -16 : 16));
          kmark(destTri[0], destTri[1], destTri[2], 1, 22);
          kmark(destTri[1], destTri[2], destTri[0], 2, 20);
          kmark(destTri[2], destTri[1], destTri[0], 3, 18);
          drawCorrespondenceBridges(g, [A, B_pt, C_pt], destTri);
        } else if (sub === 'nestedMulti') {
          // [2.0 수정] 원본은 점 B, C 를 지역 변수로 선언해 기준 길이 변수 B 를 가려 라벨이 "NaN cm"·"[object Object] cm" 로 보였습니다 → 점 이름을 B_pt, C_pt 로
          const A = pt(245, 115), B_pt = pt(95, 385), C_pt = pt(405, 385);
          const D = lerp(A, B_pt, 1 / 3), E = lerp(A, C_pt, 1 / 3);
          const F = lerp(A, B_pt, 2 / 3), Gp = lerp(A, C_pt, 2 / 3);

          poly([A, B_pt, C_pt], green, 'rgba(52,211,153,0.08)', 2.5, 2);
          poly([A, F, Gp], blue, 'rgba(56,189,248,0.14)', 2.5, 1);
          poly([A, D, E], amber, 'rgba(251,191,36,0.22)', 2.8, 0);

          label('A', A, green, 0, -18); label('B', B_pt, green, -14, 14); label('C', C_pt, green, 14, 14);
          label('D', D, amber, -14, 0); label('E', E, amber, 14, 0);
          label('F', F, blue, -14, 0); label('G', Gp, blue, 14, 0);

          drawParallelMark(g, D, E, 1, amber);
          drawParallelMark(g, F, Gp, 1, blue);
          drawParallelMark(g, B_pt, C_pt, 1, green);
          drawTickMarks(g, A, D, 1, amber);
          drawTickMarks(g, D, F, 1, amber);
          drawTickMarks(g, F, B_pt, 1, amber);
          // [표시 보강] AC 위의 같은 간격(AE = EG = GC) 눈금 · 공통각 ∠A(•) · 동위각 ∠ADE = ∠AFG = ∠B (×), ∠AED = ∠AGF = ∠C (○)
          drawTickMarks(g, A, E, 2, blue); drawTickMarks(g, E, Gp, 2, blue); drawTickMarks(g, Gp, C_pt, 2, blue);
          kmark(A, B_pt, C_pt, 1, 18);
          kmark(D, E, A, 2, 13); kmark(F, Gp, A, 2, 15); kmark(B_pt, C_pt, A, 2, 19);
          kmark(E, D, A, 3, 13); kmark(Gp, F, A, 3, 15); kmark(C_pt, B_pt, A, 3, 19);

          const d1 = fmtNum(B / 3), d2 = fmtNum((2 * B) / 3);
          drawSideBadge(g, D, E, `${d1} cm`, amber, -12, 0.5, 0);
          drawSideBadge(g, F, Gp, `${d2} cm`, blue, -12, 0.5, 1);
          drawSideBadge(g, B_pt, C_pt, `${B} cm`, green, 15, 0.5, 2);

          const pProg = Math.max(0.2, t);
          const t1 = computeAlignedTriangle([A, D, E], [A, B_pt, C_pt], pt(645, 145), 0.85, false, pProg);
          const t2 = computeAlignedTriangle([A, F, Gp], [A, B_pt, C_pt], pt(645, 238), 0.72, false, pProg);
          const t3 = computeAlignedTriangle([A, B_pt, C_pt], [A, B_pt, C_pt], pt(645, 340), 0.56, false, pProg);
          poly(t1, amber, 'rgba(251,191,36,0.22)', 2.4, 0);
          poly(t2, blue, 'rgba(56,189,248,0.18)', 2.4, 1);
          poly(t3, green, 'rgba(52,211,153,0.14)', 2.4, 2);
          txt(`1단 (DE=${d1})`, pt(540, 145), amber, 11.5);
          txt(`2단 (FG=${d2})`, pt(535, 238), blue, 11.5);
          txt(`3단 (BC=${B})`, pt(530, 340), green, 11.5);
        } else if (sub === 'nestedFlip') {
          // [2.0 수정] 원본은 D 를 AC 위, E 를 AB 위에 두어 DE ∥ BC 인 평범한 포개진 그림이었고(거울 뒤집기가 필요 없음), 오른쪽 정렬 그림에서도
          //   D(↔C) 가 B 자리에 놓여 해설과 어긋났습니다. 해설의 "AD : AC = AE : AB, ∠ADE = ∠C" 대로 D 를 AB 위, E 를 AC 위에 두고(DE 는 BC 와 평행하지 않음),
          //   길이도 해설의 AB = 10, AC = B 에 맞춰 세 변 + ∠A = 62° 로 그립니다. 거울 반전의 대칭축은 ∠A 의 이등분선입니다.
          const AB = 10, AC = B, fu = 28, angA = (62 * Math.PI) / 180;
          const BC = Math.sqrt(AB * AB + AC * AC - 2 * AB * AC * Math.cos(angA));
          const xA = (AB * AB + BC * BC - AC * AC) / (2 * BC), hA = Math.sqrt(Math.max(0, AB * AB - xA * xA));
          const B_pt = pt(95, 382), C_pt = pt(95 + BC * fu, 382), A = pt(95 + xA * fu, 382 - hA * fu);
          const D = lerp(A, B_pt, (K * AC) / AB);
          const E = lerp(A, C_pt, (K * AB) / AC);

          poly([A, B_pt, C_pt], green, 'rgba(52,211,153,0.08)', 2.6, 1);
          poly([A, D, E], amber, 'rgba(251,191,36,0.22)', 3.0, 0);
          label('A', A, green, 0, -18);
          label('B', B_pt, green, -14, 14);
          label('C', C_pt, green, 14, 14);
          label('D', D, amber, -15, -2);
          label('E', E, amber, 15, -2);

          // [표시 보강] 공통각 ∠A = 62° 값 표시, ∠ADE = ∠C (×), 닮음에서 따라오는 ∠AED = ∠B (○)
          drawAngleArc(g, A, B_pt, C_pt, { radius: 26, color: pink, symbol: `${Math.round((angA * 180) / Math.PI)}°` });
          kmark(D, A, E, 2, 22); kmark(C_pt, B_pt, A, 2, 26);
          kmark(E, A, D, 3, 18); kmark(B_pt, A, C_pt, 3, 22);
          drawSideBadge(g, A, D, `${fmtNum(B * K)} cm`, amber, 15, 0.5, 0);
          drawSideBadge(g, A, B_pt, `10 cm`, blue, 15, 0.8, 1);
          drawSideBadge(g, A, E, `${fmtNum(10 * K)} cm`, amber, -15, 0.5, 0);
          drawSideBadge(g, A, C_pt, `${B} cm`, blue, -15, 0.8, 1);

          if (state.conceptSwitch === 'all' || state.conceptSwitch === 'aux') {
            const foot = lerp(B_pt, C_pt, AB / (AB + AC)); // ∠A 의 이등분선이 BC 와 만나는 점
            line(A, foot, 'rgba(244,114,182,0.55)', 2, [6, 5], 2);
            txt('뒤집는 대칭축 = ∠A 의 이등분선', pt(foot.x, foot.y + 26), pink, 11.5);
          }

          const pProg = state.isSuperimposed ? 1.0 : Math.max(0.15, t);
          const refGuide = computeAlignedTriangle([A, B_pt, C_pt], [A, B_pt, C_pt], pt(645, 260), 0.7, false, 1.0);
          // 거울 반전(prog 1)에서 D 는 C 쪽, E 는 B 쪽으로 가도록 기준 삼각형의 B·C 순서를 바꿔 맞춥니다
          const aligned = state.isSuperimposed
            ? [A, lerp(A, C_pt, K), lerp(A, B_pt, K)]
            : computeAlignedTriangle([A, D, E], [A, C_pt, B_pt], pt(645, 240), 1.05, true, pProg);

          poly(refGuide, 'rgba(52,211,153,0.45)', 'rgba(52,211,153,0.05)', 1.6, 1);
          poly(aligned, amber, 'rgba(251,191,36,0.24)', 3.0, 0);
          ['A', 'D(↔C)', 'E(↔B)'].forEach((lb, i) => label(lb, aligned[i], amber, i === 0 ? 0 : (i === 1 ? 20 : -20), i === 0 ? -16 : 16));
          drawAngleArc(g, aligned[0], aligned[1], aligned[2], { radius: 22, color: pink, symbol: `${Math.round((angA * 180) / Math.PI)}°` });
          kmark(aligned[1], aligned[2], aligned[0], 2, 18);
          kmark(aligned[2], aligned[1], aligned[0], 3, 14);
          drawCorrespondenceBridges(g, [A, D, E], aligned);
        } else {
          // nestedParallel, sasShared  ([2.0] 거울 반전 nestedFlip 은 위의 별도 그림으로 분리)
          const isSAS = sub === 'sasShared';
          const A = pt(225, 118);
          const B_pt = pt(95, 382), C_pt = pt(410, 382);
          const D = lerp(A, B_pt, K);
          const E = lerp(A, C_pt, K);

          poly([A, B_pt, C_pt], green, 'rgba(52,211,153,0.08)', 2.6, 1);
          poly([A, D, E], amber, 'rgba(251,191,36,0.22)', 3.0, 0);
          label('A', A, green, 0, -18);
          label('B', B_pt, green, -14, 14);
          label('C', C_pt, green, 14, 14);
          label('D', D, amber, -15, -2);
          label('E', E, amber, 15, -2);

          drawAngleArc(g, A, B_pt, C_pt, { radius: 24, color: pink, symbol: 'dot' });
          // [표시 보강] 같은 각은 같은 표시: ∠A 공통 (•), ∠ADE = ∠B (×), ∠AED = ∠C (○) — 동위각 2쌍
          kmark(D, E, A, 2, 20); kmark(B_pt, C_pt, A, 2, 24);
          kmark(E, D, A, 3, 18); kmark(C_pt, B_pt, A, 3, 22);

          if (isSAS) {
            drawSideBadge(g, A, D, `${fmtNum(6 * K)}`, amber, -15, 0.5, 1);
            drawSideBadge(g, A, B_pt, `6 cm`, green, -28, 0.75, 1);
            drawSideBadge(g, A, E, `${fmtNum(8 * K)}`, amber, 15, 0.5, 1);
            drawSideBadge(g, A, C_pt, `8 cm`, green, 28, 0.75, 1);
            drawSideBadge(g, D, E, `${fmtNum(B * K)} cm`, blue, -13, 0.5, 2);
            drawSideBadge(g, B_pt, C_pt, `${B} cm`, blue, 15, 0.5, 2);
          } else {
            drawParallelMark(g, D, E, 1, amber);
            drawParallelMark(g, B_pt, C_pt, 1, green);
            drawSideBadge(g, A, D, `${fmtNum(B * K)} cm`, amber, -15, 0.5, 0);
            drawSideBadge(g, D, B_pt, `DB=${fmtNum(B * (1 - K))}`, red, -15, 0.5, 2);
            drawSideBadge(g, D, E, `${fmtNum(10 * K)} cm`, amber, -13, 0.5, 0);
            drawSideBadge(g, B_pt, C_pt, '10 cm', green, 15, 0.5, 1);
          }

          const pProg = state.isSuperimposed ? 1.0 : Math.max(0.15, t);
          const refGuide = computeAlignedTriangle([A, B_pt, C_pt], [A, B_pt, C_pt], pt(645, 260), 0.7, false, 1.0);
          const aligned = state.isSuperimposed
            ? [A, lerp(A, B_pt, K), lerp(A, C_pt, K)]
            : computeAlignedTriangle([A, D, E], [A, B_pt, C_pt], pt(645, 240), 1.05, false, pProg);

          poly(refGuide, 'rgba(52,211,153,0.45)', 'rgba(52,211,153,0.05)', 1.6, 1);
          poly(aligned, amber, 'rgba(251,191,36,0.24)', 3.0, 0);
          const lbs = ['A', 'D(↔B)', 'E(↔C)'];
          aligned.forEach((p, i) => label(lbs[i], p, amber, i === 0 ? 0 : (i === 1 ? -20 : 20), i === 0 ? -16 : 16));
          drawAngleArc(g, aligned[0], aligned[1], aligned[2], { radius: 20, color: pink, symbol: 'dot' });
          kmark(aligned[1], aligned[2], aligned[0], 2, 18);
          kmark(aligned[2], aligned[1], aligned[0], 3, 14);
          drawCorrespondenceBridges(g, [A, D, E], aligned);
        }
      }

      // =====================================================================
      // [모드 2 렌더링] 모래시계 · 평행선 선분비 · 사다리꼴 EF · 내·외각 이등분선
      // =====================================================================
      else if (m === 2) {
        if (sub === 'hourglassStd' || sub === 'hourglassEF') {
          const topW = 210 * K, botW = 210; // [2.0 수정] 원본은 윗변을 190·K 로 그려 AD : BC 가 K 보다 작게 보였습니다(약 0.9K)
          const A = pt(245 - topW / 2, 125), D = pt(245 + topW / 2, 125);
          const B_pt = pt(245 - botW / 2, 375), C_pt = pt(245 + botW / 2, 375);
          const O = calcCross(A, C_pt, D, B_pt);

          if (sub === 'hourglassEF') {
            line(A, B_pt, 'rgba(148,163,184,0.45)', 2, [5, 5]);
            line(D, C_pt, 'rgba(148,163,184,0.45)', 2, [5, 5]);
          }

          poly([O, A, D], amber, 'rgba(251,191,36,0.24)', 2.8, 0);
          poly([O, C_pt, B_pt], blue, 'rgba(56,189,248,0.20)', 2.8, 1);

          label('A', A, amber, -14, -12); label('D', D, amber, 14, -12);
          label('O', O, white, 0, -18);
          label('B', B_pt, blue, -14, 14); label('C', C_pt, blue, 14, 14);

          drawParallelMark(g, A, D, 1, amber);
          drawParallelMark(g, B_pt, C_pt, 1, blue);
          // [표시 보강] 맞꼭지각 ∠AOD = ∠COB (•), 엇각 2쌍 ∠DAO = ∠BCO (×) · ∠ADO = ∠CBO (○)
          kmark(O, A, D, 1, 18); kmark(O, C_pt, B_pt, 1, 18);
          kmark(A, D, O, 2, 20); kmark(C_pt, B_pt, O, 2, 22);
          kmark(D, A, O, 3, 20); kmark(B_pt, C_pt, O, 3, 22);

          if (sub === 'hourglassEF') {
            const u = M / (M + N);
            const E = lerp(A, B_pt, u), F = lerp(D, C_pt, u);
            poly([A, E, O], pink, 'rgba(244,114,182,0.22)', 2.4, 1);
            line(E, F, pink, 3.8, [], 2);
            label('E', E, pink, -16, 0); label('F', F, pink, 16, 0);
            drawParallelMark(g, E, F, 1, pink, 0.8); // [표시 보강] EF ∥ AD ∥ BC
            drawSideBadge(g, A, D, `${M * 2} cm`, amber, -14, 0.5, 0);
            drawSideBadge(g, B_pt, C_pt, `${N * 2} cm`, blue, 15, 0.5, 0);
            drawSideBadge(g, E, O, `OE=${fmtNum((M * 2 * N * 2) / (M * 2 + N * 2))}`, pink, 16, 0.5, 1);
          } else {
            drawSideBadge(g, A, D, `${fmtNum(B * K)} cm`, amber, -14, 0.5, 0);
            drawSideBadge(g, B_pt, C_pt, `${B} cm`, blue, 15, 0.5, 1);
            if (state.conceptSwitch === 'all' || state.conceptSwitch === 'aux') {
              pathLine([D, A, C_pt, B_pt], 'rgba(52, 211, 153, 0.7)', 3.5, [6, 4]); // [2.0] 원본의 g.moveTo/lineTo 블록 → 무대 선
            }
          }

          const pProg = Math.max(0.15, t);
          const rotOAD = computeAlignedTriangle([O, A, D], [O, C_pt, B_pt], pt(645, 195), 1.15, false, pProg);
          const refOCB = computeAlignedTriangle([O, C_pt, B_pt], [O, C_pt, B_pt], pt(645, 315), 0.85, false, 1.0);
          poly(refOCB, blue, 'rgba(56,189,248,0.14)', 2.0, 1);
          poly(rotOAD, amber, 'rgba(251,191,36,0.24)', 2.8, 0);
          ['O', 'A(↔C)', 'D(↔B)'].forEach((lb, i) => label(lb, rotOAD[i], amber, i === 0 ? 0 : (i === 1 ? -22 : 22), i === 0 ? -16 : 16));
          // [표시 보강] 정렬한 그림에도 같은 각을 같은 표시로
          kmark(rotOAD[0], rotOAD[1], rotOAD[2], 1, 16); kmark(rotOAD[1], rotOAD[2], rotOAD[0], 2, 16); kmark(rotOAD[2], rotOAD[1], rotOAD[0], 3, 16);
          kmark(refOCB[0], refOCB[1], refOCB[2], 1, 16); kmark(refOCB[1], refOCB[2], refOCB[0], 2, 16); kmark(refOCB[2], refOCB[1], refOCB[0], 3, 16);
          drawCorrespondenceBridges(g, [O, A, D], rotOAD);
        } else if (sub === 'parallelProp') {
          const A = pt(245, 118), B_pt = pt(95, 382), C_pt = pt(405, 382);
          const u = M / (M + N);
          const D = lerp(A, B_pt, u), E = lerp(A, C_pt, u);
          const F = lerp(B_pt, C_pt, u);

          poly([A, B_pt, C_pt], green, 'rgba(52,211,153,0.06)', 2.4);
          poly([A, D, E], amber, 'rgba(251,191,36,0.22)', 2.8, 0);
          line(D, E, amber, 3.2);

          const curF = lerp(E, F, Math.max(0.2, t));
          if (t > 0.05 || state.conceptSwitch === 'aux') {
            poly([D, B_pt, F, E], 'rgba(52,211,153,0.35)', 'rgba(52,211,153,0.08)', 1.8, 1);

            line(E, curF, pink, 3.2, [6, 4], 1);
            label('F', F, pink, 0, 16);
            drawParallelMark(g, A, B_pt, 2, pink, 0.55);
            drawParallelMark(g, E, F, 2, pink, 0.5);
            // [표시 보강] 평행사변형 DBFE 의 같은 길이 DB = EF, 동위각 ∠FEC = ∠A (•) · ∠EFC = ∠B (×)
            drawTickMarks(g, D, B_pt, 2, pink); drawTickMarks(g, E, F, 2, pink, 0.2);
            kmark(E, F, C_pt, 1, 18); kmark(F, E, C_pt, 2, 16);
          }

          label('A', A, green, 0, -18); label('B', B_pt, green, -14, 14); label('C', C_pt, green, 14, 14);
          label('D', D, amber, -15, 0); label('E', E, amber, 15, 0);
          drawParallelMark(g, D, E, 1, amber);
          drawParallelMark(g, B_pt, C_pt, 1, green);
          kmark(A, B_pt, C_pt, 1, 20); kmark(D, E, A, 2, 16); kmark(B_pt, C_pt, A, 2, 20); // [표시 보강] 공통각 ∠A (•), 동위각 ∠ADE = ∠B (×)

          drawSideBadge(g, A, D, `${M * 2} cm`, amber, -15, 0.5, 0);
          drawSideBadge(g, D, B_pt, `${N * 2} cm`, pink, -15, 0.5, 1);
          drawSideBadge(g, A, E, `${M * 3} cm`, blue, 15, 0.5, 2);
          drawSideBadge(g, E, C_pt, `${N * 3} cm`, blue, 15, 0.5, 2);

          const pProg = Math.max(0.2, t);
          const tTop = computeAlignedTriangle([A, D, E], [A, B_pt, C_pt], pt(645, 195), 0.95, false, pProg);
          const tBot = computeAlignedTriangle([E, F, C_pt], [A, B_pt, C_pt], pt(645, 320), 0.95, false, pProg);
          poly(tTop, amber, 'rgba(251,191,36,0.22)', 2.6, 0);
          poly(tBot, pink, 'rgba(244,114,182,0.22)', 2.6, 1);
          kmark(tTop[0], tTop[1], tTop[2], 1, 16); kmark(tTop[1], tTop[2], tTop[0], 2, 14); // [표시 보강] 정렬한 두 삼각형의 같은 각
          kmark(tBot[0], tBot[1], tBot[2], 1, 16); kmark(tBot[1], tBot[2], tBot[0], 2, 14);
          txt(`△ADE (AD=${M * 2}, AE=${M * 3})`, pt(645, 130), amber, 12);
          txt(`△EFC (EF=DB=${N * 2}, EC=${N * 3})`, pt(645, 260), pink, 12);
        } else if (sub === 'trapezoidMid') {
          // [2.0 수정] 원본은 윗변 6 : 아랫변 B 를 150 : 320 으로 고정해 그려 아랫변 길이 선택(8·10·12·15)이 그림에 반영되지 않았습니다 → 1cm = 24
          const A = pt(165, 130), D = pt(165 + 6 * 24, 130);
          const B_pt = pt(95, 375), C_pt = pt(95 + B * 24, 375);
          const u = M / (M + N);
          const E = lerp(A, B_pt, u), F = lerp(D, C_pt, u);
          const H = pt(B_pt.x + (D.x - A.x), B_pt.y);
          const G = lerp(D, H, u);

          poly([A, B_pt, H, D], green, 'rgba(52,211,153,0.16)', 2.4, 0);
          poly([D, H, C_pt], amber, 'rgba(251,191,36,0.18)', 2.6, 1);
          line(E, F, pink, 3.8, [], 2);
          line(D, H, white, 2.8, [6, 4], 1);

          label('A', A, green, -12, -12); label('D', D, green, 12, -12);
          label('B', B_pt, green, -12, 14); label('C', C_pt, amber, 12, 14);
          label('E', E, pink, -15, 0); label('F', F, pink, 15, 0);
          label('G', G, white, -10, -14); label('H', H, white, 0, 16);

          const gf = fmtNum(((B - 6) * M) / (M + N));
          const ef = fmtNum((6 * N + B * M) / (M + N));
          drawSideBadge(g, A, D, '6 cm', green, -14, 0.5, 0);
          drawSideBadge(g, E, G, 'EG = 6', green, -13, 0.5, 0);
          drawSideBadge(g, G, F, `GF = ${gf}`, amber, -13, 0.5, 1);
          drawSideBadge(g, H, C_pt, `HC = ${B - 6}`, amber, 15, 0.5, 1);
          // [표시 보강] 평행 표시 (AD ∥ EF ∥ BC · AB ∥ DH), 평행사변형의 같은 길이 AD = EG = BH, △DGF ∽ △DHC 의 같은 각(∠D 공통 •, 동위각 ×)
          drawParallelMark(g, A, D, 1, green, 0.2); drawParallelMark(g, E, F, 1, pink, 0.12); drawParallelMark(g, B_pt, C_pt, 1, amber, 0.8);
          drawParallelMark(g, A, B_pt, 2, green, 0.7); drawParallelMark(g, D, H, 2, white, 0.75);
          drawTickMarks(g, A, D, 1, green); drawTickMarks(g, E, G, 1, green); drawTickMarks(g, B_pt, H, 1, green);
          kmark(D, H, C_pt, 1, 20); kmark(G, D, F, 2, 16); kmark(H, D, C_pt, 2, 18);

          const pProg = Math.max(0.2, t);
          const tSml = computeAlignedTriangle([D, G, F], [D, H, C_pt], pt(645, 200), 1.1, false, pProg);
          const tBig = computeAlignedTriangle([D, H, C_pt], [D, H, C_pt], pt(645, 325), 0.85, false, 1.0);
          poly(tBig, amber, 'rgba(251,191,36,0.14)', 2.2, 1);
          poly(tSml, pink, 'rgba(244,114,182,0.24)', 2.8, 2);
          kmark(tSml[0], tSml[1], tSml[2], 1, 16); kmark(tSml[1], tSml[2], tSml[0], 2, 14); // [표시 보강]
          kmark(tBig[0], tBig[1], tBig[2], 1, 16); kmark(tBig[1], tBig[2], tBig[0], 2, 14);
          txt(`평행사변형 EG(6) + 삼각형 GF(${gf}) = EF(${ef}cm)`, pt(645, 130), pink, 12);
        } else if (sub === 'angleBisectIn') {
          // [2.0 수정] 원본은 A·B·C 를 고정(AB ≈ AC)하고 D 만 BD : CD = m : n 으로 옮겨, 이등분선 AD 가 각을 이등분하지 않았고(∠BAD ≠ ∠DAC 인데 같은 표시)
          //   보조선 CE 도 AD 와 평행하지 않았습니다. 라벨의 길이(AB = 3m, AC = 3n, BC = B)는 삼각형 부등식도 어겼습니다(예: 3, 6, 12).
          //   → 세 변 AB = m·k, AC = n·k, BC = B 로 삼각형을 그리고 D 를 BD : DC = m : n 에 두면 AD 가 정확히 ∠A 를 이등분하며,
          //     E 는 BA 의 연장선 위에서 AE = AC 가 되게 잡아 CE ∥ AD 가 됩니다. 보조선은 변환이 진행될 때 나타납니다(해설의 "슬라이더를 당겨").
          const kb = bisectK(M, N, B), abu = M * kb, acu = N * kb;
          const Bu = pt(0, 0), Cu = pt(B, 0);
          const xAu = (abu * abu + B * B - acu * acu) / (2 * B), Au = pt(xAu, -Math.sqrt(Math.max(0, abu * abu - xAu * xAu)));
          const Du = pt((B * M) / (M + N), 0);
          const Eu = pt(Au.x + (Au.x / abu) * acu, Au.y + (Au.y / abu) * acu);
          const fit = fitUnits([Bu, Cu, Au, Du, Eu], 105, 440, 118, 375);
          const A = fit(Au), B_pt = fit(Bu), C_pt = fit(Cu), D = fit(Du), E = fit(Eu);
          const showAux = t > 0.05 || state.conceptSwitch === 'aux';

          poly([A, B_pt, C_pt], green, 'rgba(52,211,153,0.10)', 2.6, 0);
          if (showAux) {
            poly([A, C_pt, E], pink, 'rgba(244,114,182,0.18)', 2.4, 1);
            line(A, E, pink, 2.4, [5, 5], 1);
            line(C_pt, E, pink, 3.0, [], 1);
          }
          line(A, D, amber, 3.6, [], 0);

          label('A', A, amber, -14, -10); label('B', B_pt, green, -14, 14);
          label('C', C_pt, green, 14, 14); label('D', D, amber, 0, 18);
          if (showAux) label('E(연장)', E, pink, 18, -10);

          // [표시 보강] ∠BAD = ∠DAC (•) 이고, 보조선을 그으면 동위각 ∠AEC 와 엇각 ∠ACE 도 모두 같은 각이므로 같은 표시(•)
          kmark(A, B_pt, D, 1, 26);
          kmark(A, D, C_pt, 1, 26);
          if (showAux) {
            kmark(E, A, C_pt, 1, 22);
            kmark(C_pt, A, E, 1, 24);
            drawParallelMark(g, D, A, 1, amber, 0.5);
            drawParallelMark(g, C_pt, E, 1, pink, 0.5);
            drawTickMarks(g, A, C_pt, 2, pink, 0.5);
            drawTickMarks(g, A, E, 2, pink, 0.5);
          }

          const ab = M * kb, ac = N * kb;
          const bd = fmtNum((B * M) / (M + N)), cd = fmtNum((B * N) / (M + N));
          drawSideBadge(g, A, B_pt, `AB = ${ab}`, amber, -16, 0.5, 0);
          drawSideBadge(g, A, C_pt, `AC = ${ac}`, amber, -14, 0.55, 0);
          if (showAux) drawSideBadge(g, A, E, `AE = AC = ${ac}`, pink, -15, 0.5, 1);
          drawSideBadge(g, B_pt, D, `BD = ${bd}`, blue, 16, 0.5, 2);
          drawSideBadge(g, D, C_pt, `CD = ${cd}`, blue, 16, 0.5, 2);

          // 우측 하트 공식 다이어그램 ([2.0 수정] 왼쪽과 같은 삼각형을 줄여 그려 날개비·바닥비가 실제 길이와 맞게)
          const hf = fitUnits([Bu, Cu, Au], 545, 745, 150, 335);
          const hA = hf(Au), hB = hf(Bu), hC = hf(Cu), hD = hf(Du);
          poly([hA, hB, hC], 'rgba(251,191,36,0.45)', 'rgba(251,191,36,0.08)', 2.4, 0);
          line(hA, hD, amber, 3.2);
          kmark(hA, hB, hD, 1, 18); kmark(hA, hD, hC, 1, 18); // [표시 보강] 이등분선이 나눈 두 각은 같음(•)
          txt(`💖 내각의 이등분선: AB(${ab}) : AC(${ac}) = BD(${bd}) : CD(${cd})`, pt(645, 120), amber, 12);
          drawSideBadge(g, hA, hB, `AB ${M}`, amber, -14, 0.5);
          drawSideBadge(g, hA, hC, `AC ${N}`, blue, 14, 0.5);
          drawSideBadge(g, hB, hD, `BD ${M}`, amber, 15, 0.5);
          drawSideBadge(g, hD, hC, `CD ${N}`, blue, 15, 0.5);
        } else {
          // angleBisectEx (외각의 이등분선 나이키 공식)
          // [2.0 수정] 내각 장면과 같은 이유: A·B·C·D 를 고정해 두고 라벨만 바꿔(AB=6, AC=3, BC=12 는 삼각형이 아님) 외각 이등분선 AD 가 외각을 이등분하지 않았습니다.
          //   → AB = n·k, AC = m·k, BC = B 로 삼각형을 그리고, D 는 BC 연장선 위에서 CD = BC·AC/(AB−AC)(해설과 같은 값),
          //     F 는 BA 위에서 AF = AC 가 되게 잡아 FC ∥ DA 가 됩니다.
          const bigM = N, smlN = M;
          const kb = bisectK(M, N, B), abu = bigM * kb, acu = smlN * kb, bcu = B;
          const Bu = pt(0, 0), Cu = pt(bcu, 0);
          const xAu = (abu * abu + bcu * bcu - acu * acu) / (2 * bcu), Au = pt(xAu, -Math.sqrt(Math.max(0, abu * abu - xAu * xAu)));
          const Du = pt(bcu + (bcu * smlN) / (bigM - smlN), 0);
          const Fu = pt(Au.x - (Au.x / abu) * acu, Au.y - (Au.y / abu) * acu);
          const Xu = pt(Au.x + Au.x * 0.42, Au.y + Au.y * 0.42);
          const fit = fitUnits([Bu, Cu, Au, Du, Fu, Xu], 80, 466, 118, 375); // D 가 멀리 있어 가로를 넓게 씁니다
          const A = fit(Au), B_pt = fit(Bu), C_pt = fit(Cu), D = fit(Du), F = fit(Fu), A_ext = fit(Xu);
          const showAux = t > 0.05 || state.conceptSwitch === 'aux';

          poly([A, B_pt, C_pt], green, 'rgba(52,211,153,0.14)', 2.8, 0);
          poly([A, C_pt, D], 'rgba(251,191,36,0.35)', 'rgba(251,191,36,0.06)', 2.2, 0);
          line(A, A_ext, white, 2.2, [5, 4]);
          line(A, D, amber, 3.6, [], 0);
          if (showAux) line(F, C_pt, pink, 3.2, [], 1);

          label('A', A, amber, -14, -10); label('B', B_pt, green, -12, 14);
          label('C', C_pt, green, 0, 18); label('D(교점)', D, amber, 0, 18);
          if (showAux) label('F', F, pink, -15, -4);

          // [표시 보강] 외각의 이등분선: ∠CAD = ∠DAE', 보조선 FC ∥ DA 를 그으면 동위각 ∠AFC · 엇각 ∠ACF 도 같은 각(•)
          kmark(A, C_pt, D, 1, 24);
          kmark(A, D, A_ext, 1, 24);
          drawParallelMark(g, A, D, 1, amber);
          if (showAux) {
            kmark(F, A, C_pt, 1, 20);
            kmark(C_pt, A, F, 1, 20);
            drawParallelMark(g, F, C_pt, 1, pink);
            drawTickMarks(g, A, F, 2, pink);
            drawTickMarks(g, A, C_pt, 2, pink);
          }

          const ab = bigM * kb, ac = smlN * kb, bc = B;
          const cd = fmtNum((bc * smlN) / (bigM - smlN)), bd = fmtNum(bc + parseFloat(cd));
          drawSideBadge(g, A, B_pt, `AB = ${ab}`, amber, -18, 0.45, 0);
          drawSideBadge(g, A, C_pt, `AC = ${ac}`, pink, 14, 0.5, 1);
          drawSideBadge(g, B_pt, C_pt, `BC = ${bc}`, green, 16, 0.5, 2);
          drawSideBadge(g, C_pt, D, `CD = ${cd}`, blue, 16, 0.5, 2);

          // 우측 나이키 스우시 궤적 다이어그램 ([2.0 수정] 왼쪽과 같은 삼각형을 줄여 그림)
          const nf = fitUnits([Bu, Cu, Au, Du], 520, 770, 150, 320);
          const nA = nf(Au), nB = nf(Bu), nC = nf(Cu), nD = nf(Du);
          poly([nA, nB, nC], green, 'rgba(52,211,153,0.12)', 2.4);
          line(nC, nD, blue, 2.4);
          line(nA, nD, amber, 3.0);
          // 나이키 곡선 화살표
          pathLine([pt(nB.x, nB.y + 26), pt(nD.x, nD.y + 26), pt(nC.x, nC.y + 42)], amber, 3.5);
          txt(`👟 외각의 이등분선: AB(${ab}) : AC(${ac}) = 전체 BD(${bd}) : CD(${cd})`, pt(645, 125), amber, 11.5);
        }
      }

      // =====================================================================
      // [모드 3 렌더링] 직각삼각형 수선 3총사 & 소(牛)공식 마스터
      // =====================================================================
      else if (m === 3) {
        const scaleMul = B / 10;
        const ab = fmtNum(6 * scaleMul), ac = fmtNum(8 * scaleMul), bc = fmtNum(10 * scaleMul);
        const bh = fmtNum(3.6 * scaleMul), ch = fmtNum(6.4 * scaleMul), ah = fmtNum(4.8 * scaleMul);

        const B_pt = pt(85, 360), C_pt = pt(415, 360);
        const H = lerp(B_pt, C_pt, 0.36);
        const A = pt(H.x, 360 - 330 * 0.48);
        const M_mid = mid(B_pt, C_pt);

        poly([A, B_pt, C_pt], green, 'rgba(52,211,153,0.07)', 2.6, 0);
        poly([H, B_pt, A], amber, 'rgba(251,191,36,0.16)', 2.4, 1);
        poly([H, A, C_pt], blue, 'rgba(56,189,248,0.16)', 2.4, 2);
        line(A, H, pink, 3.4);

        if (sub === 'rightSoArea') {
          poly([A, H, M_mid], pink, 'rgba(244,114,182,0.26)', 2.6, 2);
          line(A, M_mid, blue, 3.2, [], 1);
          label('M(외심·중점)', M_mid, blue, 18, 18);
          drawSideBadge(g, A, M_mid, `AM=${fmtNum(5 * scaleMul)}`, blue, 18, 0.5, 1);
          drawTickMarks(g, A, M_mid, 3, blue, 0.25); drawTickMarks(g, B_pt, M_mid, 3, blue); drawTickMarks(g, M_mid, C_pt, 3, blue); // [표시 보강] 외심 M: MA = MB = MC
        }

        label('A(90°)', A, green, 0, -18);
        label('B', B_pt, amber, -14, 14);
        label('C', C_pt, blue, 14, 14);
        label('H', H, pink, -6, 18);

        drawRightAngleSquare(g, A, B_pt, C_pt, 13, green);
        drawRightAngleSquare(g, H, B_pt, A, 11, amber);
        drawRightAngleSquare(g, H, C_pt, A, 11, blue);

        // [표시 보강] 같은 각은 같은 표시·같은 값: ∠B = ∠HAC (•), ∠C = ∠BAH (×) — 그림에서 잰 각도(• + × = 90°)
        const degB = angDeg(B_pt, C_pt, A), degC = angDeg(C_pt, A, B_pt);
        drawAngleArc(g, B_pt, C_pt, A, { radius: 24, color: amber, symbol: `•${degB}` });
        drawAngleArc(g, A, H, C_pt, { radius: 22, color: amber, symbol: `•${degB}` });
        drawAngleArc(g, C_pt, A, B_pt, { radius: 26, color: blue, arcs: 2, symbol: `×${degC}` });
        drawAngleArc(g, A, B_pt, H, { radius: 22, color: blue, arcs: 2, symbol: `×${degC}` });

        drawSideBadge(g, A, B_pt, `AB = ${ab}`, amber, -16, 0.5, 0);
        drawSideBadge(g, A, C_pt, `AC = ${ac}`, blue, 16, 0.5, 0);
        drawSideBadge(g, B_pt, H, `BH = ${bh}`, amber, 16, 0.5, 1);
        drawSideBadge(g, H, C_pt, `CH = ${ch}`, blue, 16, 0.5, 1);
        drawSideBadge(g, A, H, `AH = ${ah}`, pink, -24, 0.64, 0); // [표시 보강] 꼭짓점 A 의 각도 값과 겹치지 않게 아래로

        // 소(牛)공식 강조 네온 궤적
        if (sub === 'rightLeft') {
          line(A, B_pt, amber, 5.5, [], 0);
          line(B_pt, H, pink, 5.5, [], 1);
          line(B_pt, C_pt, green, 3.2, [6, 4], 1);
        } else if (sub === 'rightRight') {
          line(A, C_pt, blue, 5.5, [], 0);
          line(C_pt, H, pink, 5.5, [], 1);
          line(C_pt, B_pt, green, 3.2, [6, 4], 1);
        } else if (sub === 'rightCenter') {
          line(A, H, pink, 5.5, [], 0);
          line(H, B_pt, amber, 5.0, [], 1);
          line(H, C_pt, blue, 5.0, [], 1);
        }

        // 우측: 실제 3총사 조각 분리·거울반전·회전 정렬
        const stdRef = [pt(530, 180), pt(530, 120), pt(610, 180)];
        const pProg = Math.max(0.25, t);
        const alignedBig = computeAlignedTriangle([A, B_pt, C_pt], stdRef, pt(635, 148), 0.48, true, pProg);
        const alignedMid = computeAlignedTriangle([H, A, C_pt], stdRef, pt(635, 250), 0.48, false, pProg);
        const alignedSml = computeAlignedTriangle([H, B_pt, A], stdRef, pt(635, 342), 0.48, false, pProg);

        poly(alignedBig, green, 'rgba(52,211,153,0.18)', 2.4, 0);
        poly(alignedMid, blue, 'rgba(56,189,248,0.20)', 2.4, 2);
        poly(alignedSml, amber, 'rgba(251,191,36,0.22)', 2.4, 1);

        drawRightAngleSquare(g, alignedBig[0], alignedBig[1], alignedBig[2], 9, green);
        drawRightAngleSquare(g, alignedMid[0], alignedMid[1], alignedMid[2], 8, blue);
        drawRightAngleSquare(g, alignedSml[0], alignedSml[1], alignedSml[2], 7, amber);
        // [표시 보강] 정렬한 세 닮은 삼각형에도 같은 각(•, ×)과 값
        const dotB = { radius: 13, color: amber, symbol: `•${degB}` }, crsC = { radius: 13, color: blue, arcs: 2, symbol: `×${degC}` };
        drawAngleArc(g, alignedBig[1], alignedBig[2], alignedBig[0], dotB); drawAngleArc(g, alignedBig[2], alignedBig[0], alignedBig[1], crsC);
        drawAngleArc(g, alignedMid[1], alignedMid[0], alignedMid[2], dotB); drawAngleArc(g, alignedMid[2], alignedMid[0], alignedMid[1], crsC);
        drawAngleArc(g, alignedSml[1], alignedSml[0], alignedSml[2], dotB); drawAngleArc(g, alignedSml[2], alignedSml[0], alignedSml[1], crsC);

        txt(`대: △ABC (빗변 ${bc})`, pt(750, 148), green, 11.5);
        txt(`중: △HAC (빗변 ${ac})`, pt(750, 250), blue, 11.5);
        txt(`소: △HBA (빗변 ${ab})`, pt(750, 342), amber, 11.5);
      }

      // =====================================================================
      // [모드 4 렌더링] 삼각형 중점연결정리 & 무게중심(2:1) & 바리뇽 사각형
      // =====================================================================
      else if (m === 4) {
        if (sub === 'varignonQuad') {
          // [2.0 수정] 원본은 두 대각선을 BD(352) > AC(334) 로 그렸는데 라벨은 AC = B(8~15) · BD = 10 이었습니다(대각선 AC 길이 선택이 그림에 반영되지 않음).
          //   원본의 두 대각선 방향과 교점(X)·내분 위치는 그대로 두고 길이만 AC = B, BD = 10 (1cm = 28)로 그립니다.

          // [2.0 수정] 해설의 "꼭지각 110°" 에 맞춰 꼭짓점을 (705, 312.5) 로(원본은 약 103°)
          poly([pt(705, 312.5), pt(630, 365), pt(780, 365)], red, 'rgba(251,113,133,0.20)', 2.6, 2);
          // [표시 보강] 이등변삼각형: 같은 길이 눈금(두 변)과 꼭지각 값(40°, 110°)
          drawTickMarks(g, pt(565, 270), pt(530, 365), 1, red); drawTickMarks(g, pt(565, 270), pt(600, 365), 1, red);
          drawTickMarks(g, pt(705, 312.5), pt(630, 365), 1, red); drawTickMarks(g, pt(705, 312.5), pt(780, 365), 1, red);
          drawAngleArc(g, pt(565, 270), pt(530, 365), pt(600, 365), { radius: 26, color: red, symbol: angDeg(pt(565, 270), pt(530, 365), pt(600, 365)) });
          drawAngleArc(g, pt(705, 312.5), pt(630, 365), pt(780, 365), { radius: 22, color: red, symbol: angDeg(pt(705, 312.5), pt(630, 365), pt(780, 365)) });
          txt('❌ 두 이등변삼각형 (꼭지각 40° vs 110° 불일치!)', pt(645, 390), red, 12);
        }
      }

      // 우측 하단 칠판 세로 분수 비례식 판서
      if (spec.fracEq && spec.fracEq.length === 4) {
        drawCanvasEquationWithFractions(
          g,
          spec.fracEq[0], spec.fracEq[1],
          spec.fracEq[2], spec.fracEq[3],
          650, 424, // [2.0 수정] 원본은 상자의 가운데를 412 에 두어 오른쪽 그림의 아래쪽(큰 삼각형 밑변·원뿔대·마지막 설명 글)을 가렸습니다 → 어댑터가 이 값을 상자의 위쪽 가장자리로 읽어 그림 아래에 둡니다
          amber,
          blue
        );
      }

      // [2.0] 원본의 g.restore(): 좌표 변환은 무대가 맡습니다
    }

  /* ===== 원본 그대로: 효과 없는 렌즈 버튼 숨김 표 (원본 2737–2741행) ===== */
    // 현재 탭·시나리오에서 효과가 없는 렌즈 버튼은 숨긴다 (LENS_OFF: 탭 번호 또는 시나리오 id ➔ 숨길 렌즈)
    const LENS_OFF = {
      trapezoidMid: ['sides'], midpointFour: ['angles', 'sides'], centroidSix: ['sides'],
      trapArea4: ['angles', 'sides', 'aux'], paraTrisect: ['sides'], dimConeCut: ['angles', 'sides', 'aux'],
      dimTile2D: ['angles', 'sides', 'aux'], dimCube3D: ['angles', 'sides', 'aux'], alwaysSimilar: ['angles']
    };

  /* ======================================================================
     2.0 셸 연결 (새로 작성한 부분)
     ====================================================================== */
  const TABS = ['포개진 삼각형 · 뒤집기 · SAS', 'X자형 닮음 · 평행선 · 각의 이등분선', '직각삼각형의 수선과 닮음', '중점을 연결한 선분 & 무게중심 (2:1)', '종이접기 & 사각형 닮음 킬러', '닮은 도형의 길이·넓이·부피의 비 & 원뿔 자르기'];
  const SHORT = ['포개진 삼각형', 'X자형·평행선', '수선과 닮음', '중점·무게중심', '종이접기', '넓이·부피의 비'];
  const LENSES = [
    ['all', '🔍 전체 구조'],
    ['angles', '📐 대응각·기호(•,×,∟)'],
    ['sides', '📏 대응변·길이 표시'],
    ['aux', '🪄 보조선·연결 선분']
  ];
  // 닮음비 칩이 그림·수치를 실제로 바꾸는 장면(원본 화면에서 장면마다 측정). 그 밖의 장면은 닮음비 칩을 숨깁니다.
  const RATIO_ON = new Set(['nestedParallel', 'nestedFlip', 'nestedRotated', 'sasShared', 'hourglassStd', 'hourglassEF', 'parallelProp', 'trapezoidMid', 'angleBisectIn', 'angleBisectEx', 'trapArea4']);
  // 차원비 장면은 닮음비 1:3 일 때만 값이 바뀌고(나머지는 모두 2배) 칩 4개 중 3개가 같은 그림이라 1:2 · 1:3 두 칩만 보여 줍니다.
  const RATIO_DIM = new Set(['dimTile2D', 'dimCube3D']);
  // 길이(기준 변) 칩이 아무것도 바꾸지 않는 장면
  const BASE_OFF = new Set(['ssaTrap', 'hourglassEF', 'parallelProp', 'foldRect', 'foldEqui', 'trapArea4', 'dimConeCut', 'dimCube3D', 'alwaysSimilar']);
  // 이 장면에서 15cm 는 삼각형을 이룰 수 없어(뒤집힌 포개진형 AD < AB 조건, SAS 의 6·8·BC) 칩을 뺍니다.
  const NO15 = new Set(['nestedFlip', 'sasShared']);
  // '꼭짓점 포개기'가 그림을 바꾸는 장면
  const SUP = new Set(['nestedParallel', 'nestedFlip', 'nestedRotated', 'sasShared']);
  // 길이 칩이 라벨뿐 아니라 그림의 모양까지 바꾸는 장면(자동 맞춤을 잴 때 모든 길이를 겹쳐 봄)
  const GEO_BASE = new Set(['nestedFlip', 'trapezoidMid', 'varignonQuad', 'angleBisectIn', 'angleBisectEx']);
  const baseChips = (id) => (BASE_OFF.has(id) ? [] : BASE_PRESETS.filter((v) => !(NO15.has(id) && v > 12)));
  // 외각의 이등분선은 닮음비가 1에 가까울수록 교점 D 가 멀리(2:3 → BC 의 3배, 3:4 → 4배) 달아나 정확히 그리면 삼각형이 점처럼 작아져 1:2 · 1:3 만 둡니다.
  const RATIO_ALLOW = { angleBisectEx: [0, 2] };
  const ratioChips = (id) => RATIO_ALLOW[id] || (RATIO_ON.has(id) ? [0, 1, 2, 3] : RATIO_DIM.has(id) ? [0, 2] : []);

  const lensList = (m, id) => {
    const off = (LENS_OFF[m] || []).concat(LENS_OFF[id] || []);
    const rest = ['angles', 'sides', 'aux'].filter((x) => !off.includes(x));
    return rest.length ? ['all'].concat(rest) : []; // 원본 syncLensButtons: 효과 있는 렌즈가 하나도 없으면 렌즈 전체를 숨김
  };
  function sync(s, m, id) {
    state.mode = m;
    state.subType[m] = id;
    state.fold = s.fold;
    let ri = Math.max(0, Math.min(RATIO_PRESETS.length - 1, Math.round(s.ratio)));
    const allow = RATIO_ALLOW[id] || (RATIO_DIM.has(id) ? [0, 2] : null);
    if (allow && !allow.includes(ri)) ri = allow[0]; // 이 장면에서 없는 칩의 값(공유 링크 등)은 첫 칩으로
    state.ratioIdx = ri;
    let base = Math.round(s.base);
    if (NO15.has(id) && base > 12) base = 12;
    state.baseScale = BASE_PRESETS.includes(base) ? base : 12;
    state.activePartIdx = s.part == null ? -1 : s.part;
    state.view = s.view === 'left' || s.view === 'right' ? s.view : 'all';
    state.isSuperimposed = !!s.sup && SUP.has(id);
    state.conceptSwitch = lensList(m, id).includes(s.lens) ? s.lens : 'all';
    state.scale = 1;
  }
  // [2.0] 보기: 그림은 '원본 기하 구조'(왼쪽 작업 영역)와 '정렬·분석'(오른쪽 작업 영역) 두 칸이라 휴대폰에서는 글자가 겹칩니다.
  //   좁은 화면의 기본 보기는 '원본 그림'이고, 칩으로 '정렬한 그림'·'전체'로 바꿉니다(PC 의 기본은 전체).
  const NARROW_Q = window.matchMedia('(max-width: 859px)');
  const VIEW_BOX = { left: { x: [64, 486], y: [62, 440] }, right: { x: [498, 796], y: [62, 472] } };
  const NARROW_ALL = new Set(['dimTile2D', 'dimCube3D']); // 작은 것 ↔ 큰 것 비교가 핵심인 단순한 그림은 좁은 화면에서도 전체 보기로 시작
  const VIEWS = [['all', '전체 보기'], ['left', '원본 그림'], ['right', '정렬한 그림']];
  let booted = false;

  function sceneOf(m, it) {
    const id = it.id;
    const label = arrow(it.label);
    return {
      id, title: label, short: label, reviewTab: true, autoFit: true,
      focus: (s) => (s.view === 'left' || s.view === 'right' ? VIEW_BOX[s.view] : null),
      notesTitle: '오답 함정과 참고',
      enter: (s, lab) => {
        // 원본 setMode / setSubType: 변환을 0%로 되돌리고 꼭짓점 포개기를 끈 뒤 100%로 자동 재생
        s.fold = 0;
        s.sup = false;
        // 보기를 직접 고르기 전까지는 장면마다 화면 크기에 맞는 기본 보기로 시작(고른 뒤에는 그 선택을 유지)
        if (s.viewAuto !== false || (s.view !== 'all' && s.view !== 'left' && s.view !== 'right')) { s.view = NARROW_Q.matches && !NARROW_ALL.has(id) ? 'left' : 'all'; s.viewAuto = true; }
        if (!lensList(m, id).includes(s.lens)) s.lens = 'all';
        const shared = !booted && /[#&]fold=/.test(location.hash); // 공유 링크의 값은 그대로 존중
        booted = true;
        if (lab && s === lab.s && !shared) lab.tween({ fold: 1 }, 1300);
      },
      controls: () => ['fold'],
      presets: (s) => {
        sync(s, m, id);
        const spec = specNow().ui, out = [];
        VIEWS.forEach(([k, lb]) => out.push({ group: '보기', label: lb, apply: (st, lab) => { st.view = k; st.viewAuto = false; if (lab) lab.board.setFocus(k === 'all' ? lab._measureFocus(lab.scene) : VIEW_BOX[k], true); }, on: (st) => st.view === k }));
        ratioChips(id).forEach((i) => out.push({ group: spec.dim1Name, label: RATIO_PRESETS[i].label, apply: (st) => { st.ratio = i; }, on: (st) => Math.round(st.ratio) === i }));
        baseChips(id).forEach((v) => out.push({ group: spec.dim2Name, label: id === 'dimTile2D' ? `${v}cm²` : `${v}cm`, apply: (st) => { st.base = v; }, on: (st) => Math.round(st.base) === v || (NO15.has(id) && v === 12 && st.base > 12) }));
        const lenses = lensList(m, id);
        if (lenses.length) LENSES.filter(([k]) => lenses.includes(k)).forEach(([k, lb]) => out.push({ group: '강조해서 보기', label: lb, apply: (st) => { st.lens = k; }, on: (st) => st.lens === k }));
        [0, 0.5, 1].forEach((v) => out.push({ group: '변환 단계', label: v === 0 ? '0% 원래 모양' : v === 1 ? '100% 분리·정렬 완료' : '50%', apply: (st) => { st.sup = false; }, set: { fold: v }, ms: 700, on: (st) => Math.abs(st.fold - v) < 0.01 }));
        return out;
      },
      actions: () => {
        const acts = [{
          id: 'act', play: true, primary: true, icon: 'wand',
          label: (st) => { sync(st, m, id); return specNow().raw.actionTxt; },
          run: (st, lab) => { st.sup = false; lab.tween({ fold: st.fold > 0.5 ? 0 : 1 }, 1100); }
        }];
        if (SUP.has(id)) {
          acts.push({
            id: 'sup', icon: 'target',
            label: (st) => (st.sup ? '꼭짓점 포개기 풀기' : '꼭짓점 포개기'),
            run: (st, lab) => { st.sup = !st.sup; lab.tween({ fold: st.sup ? 1 : 0 }, 700); }
          });
        }
        return acts;
      },
      view: (s) => {
        sync(s, m, id);
        const e = specNow(), spec = e.ui;
        const wide = (t) => String(t).length > 14;
        return {
          guide: `<div style="font-weight:800;margin-bottom:6px">${APLab.esc(APLab.stripEmoji(spec.badge))}</div>${spec.hint}`,
          readouts: [
            { label: spec.dim1Name, value: spec.val1Txt, color: 'sky', wide: wide(spec.val1Txt) },
            { label: spec.dim2Name, value: spec.val2Txt, color: 'rose', wide: wide(spec.val2Txt) }
          ],
          parts: spec.parts.map((p) => ({ id: p.id, name: p.name, desc: p.desc, value: p.val, color: p.ok === false ? 'red' : p.color, ok: p.ok })),
          summary: spec.totalRes,
          rule: spec.rule,
          formula: spec.formulaHTML,
          notes: spec.notes,
          tape: { title: spec.tapeTitle, segments: spec.tapeSegs }
        };
      },
      draw: (b, s, v) => {
        BOARD = b;
        const paint = (st) => {
          sync(st, m, id);
          if (st.grid) b.grid({ step: 38 });
          const spec = specNow().ui;
          // 두 번 훑기: 1회 점·설명 위치 수집 → 2회 그리기(이름표가 점·설명·다른 이름표와 겹치지 않게 놓음)
          PL.obst = [];
          PL.placed = [];
          PL.pass = 1;
          drawSimilarityScene(1000, 700, spec);
          PL.pass = 2;
          PL.placed = [];
          drawSimilarityScene(1000, 700, spec);
        };
        // 자동 맞춤을 재는 중: 변환 0%·100%, 모든 닮음비·(그림 모양이 달라지는) 길이 상태를 겹쳐 그려 어느 상태에서도 잘리지 않는 범위를 구합니다.
        const paintAll = () => {
          const rs = ratioChips(id).length ? ratioChips(id) : [Math.round(s.ratio)];
          const bs = GEO_BASE.has(id) ? baseChips(id) : [Math.round(s.base)];
          [0, 1].forEach((f) => rs.forEach((r) => bs.forEach((bv) => paint({ ...s, view: 'all', fold: f, ratio: r, base: bv, part: null, sup: false }))));
        };
        if (b._bbox) { paintAll(); return; }
        if (b.thumb) { // 모든 장면 미리보기: 장면 범위를 직접 재어 맞추고, 원본의 '완성'(변환 100%) 상태로 그림
          const bb = b.measure(() => paint({ ...s, view: 'all', fold: 1, part: null, sup: false }));
          if (bb) b.focus = b.fitBox(bb, { margin: 0.08, px: 5 });
          paint({ ...s, view: 'all', fold: 1, part: null, sup: false });
          return;
        }
        paint(s);
      }
    };
  }

  const groups = Object.keys(SUB_MENUS).map((k) => {
    const m = +k;
    return { id: 'm' + m, title: TABS[m - 1], short: SHORT[m - 1], scenes: SUB_MENUS[m].map((it) => sceneOf(m, it)) };
  });

  APLab.createLab({
    id: 'g8-similarity',
    title: '닮음 경험도감',
    courseName: '중2',
    unit: '도형의 닮음 · 보조선 · 넓이와 부피의 비',
    courseColor: 'var(--m-green)',
    home: '../index.html#g8',
    legacy: '../../labs/g8/similarity-atlas.html',
    board: { kind: 'figure', autoFit: true, minZoom: 0.4, maxZoom: 5 },
    state: { lens: 'all', sup: false, view: null, viewAuto: true },
    persist: ['lens', 'sup'],
    params: {
      fold: { value: 0, min: 0, max: 1, step: 0.005, color: 'amber', label: '변환 진행 (0% → 100%)', hint: '숨은 삼각형을 분리·회전·뒤집어 정렬하거나 보조선을 그어 보는 과정을 천천히 확인합니다', format: (v) => `${Math.round(v * 100)}%`, onInput: (st) => { st.sup = false; } },
      ratio: { value: 0, min: 0, max: 3, step: 1, color: 'sky', label: '닮음비·분할비 (m : n)' },
      base: { value: 12, min: 8, max: 15, step: 1, color: 'rose', label: '기준 길이' }
    },
    groups
  });
});
</script>
