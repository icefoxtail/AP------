<script>
/* ==========================================================================
   공통수학 · 도형의 이동 (AP Math Lab 2.0) — 4개 장면
   평행이동(점·도형·방정식) → 대칭이동(x축·y축·원점·y=x) → 대칭이동과 최단거리 → 평행이동·대칭이동의 합성.
   - 장면마다 탐구(끌어 보기) · 정리(단계 풀이) · 문제(기출 변형, 「새 문제」) 3탭.
   - 문제 그림에는 지문에 주어진 값만 보이고, 답과 보조선은 정리 탭의 단계를 누르면 나타납니다.
   ========================================================================== */
window.addEventListener('DOMContentLoaded', function () {
  const { tex, clamp } = APLab;

  /* ===== 좌표 도우미 ===== */
  const P = (x, y) => ({ x, y });
  const midP = (p, q) => P((p.x + q.x) / 2, (p.y + q.y) / 2);
  const lerpP = (p, q, t) => P(p.x + (q.x - p.x) * t, p.y + (q.y - p.y) * t);
  const distP = (p, q) => Math.hypot(p.x - q.x, p.y - q.y);
  const areaP = (A, B, C) => Math.abs((B.x - A.x) * (C.y - A.y) - (B.y - A.y) * (C.x - A.x)) / 2;
  const gcd = (a, b) => (b ? gcd(b, a % b) : Math.abs(a));
  const snapTo = (v, st) => Math.round(v / st) * st;
  const n2 = (v) => { let r = Math.round(v * 100) / 100; if (r === 0) r = 0; return String(r).replace('-', '−'); }; // 화면용(유니코드 마이너스)
  const nt = (v) => n2(v).replace('−', '-'); // 수식용
  const rounded = (v) => Math.abs(v - Math.round(v * 100) / 100) > 1e-9;
  const valueS = (v) => `${rounded(v) ? '≈ ' : ''}${n2(v)}`;
  const pS = (p) => `${rounded(p.x) || rounded(p.y) ? '≈ ' : ''}(${n2(p.x)}, ${n2(p.y)})`;
  const pT = (p) => `(${nt(p.x)}, ${nt(p.y)})`;
  function sqrtSimp(n) { let o = 1, i = n; for (let f = 2; f * f <= i; f++) while (i % (f * f) === 0) { i /= f * f; o *= f; } return [o, i]; }
  const radTex = (n) => { const [o, i] = sqrtSimp(Math.round(n)); return i === 1 ? String(o) : (o === 1 ? '' : o) + `\\sqrt{${i}}`; };
  const radStr = (n) => { const [o, i] = sqrtSimp(Math.round(n)); return i === 1 ? String(o) : (o === 1 ? '' : o) + '√' + i; };
  const ratio = (a, b) => { const g = gcd(Math.round(a * 1000), Math.round(b * 1000)) || 1; return [Math.round(a * 1000) / g, Math.round(b * 1000) / g]; };
  /** 선분 pq 옆에 붙이는 글자의 화면 오프셋: 선분에 수직이고 ref 점의 반대쪽 */
  function perp(p, q, ref, d = 15) {
    const vx = q.x - p.x, vy = -(q.y - p.y), l = Math.hypot(vx, vy) || 1;
    let nx = -vy / l, ny = vx / l;
    const m = midP(p, q), rx = ref.x - m.x, ry = -(ref.y - m.y);
    if (nx * rx + ny * ry > 0) { nx = -nx; ny = -ny; }
    return { dx: nx * d, dy: ny * d };
  }
  /** 점 p의 이름표를 from 점의 반대쪽으로 d(px)만큼 띄우는 오프셋(끌기 손잡이와 겹치지 않게) */
  function away(p, from, d = 24) {
    const vx = p.x - from.x, vy = -(p.y - from.y), l = Math.hypot(vx, vy) || 1, ux = vx / l, uy = vy / l;
    if (Math.abs(ux) > 0.5) return { dx: ux > 0 ? 16 : -16, dy: uy * d * 0.7, align: ux > 0 ? 'left' : 'right' };
    return { dx: 0, dy: uy >= 0 ? d : -d, align: 'center' };
  }
  /** 점들을 모두 담는 무대 범위(여백 포함) */
  function boxOf(pts, pad = 1.5) {
    const xs = pts.map((p) => p.x), ys = pts.map((p) => p.y);
    return { x: [Math.min(...xs) - pad, Math.max(...xs) + pad], y: [Math.min(...ys) - pad, Math.max(...ys) + pad] };
  }
  /** 장면·탭·문제가 바뀌면 무대 범위를 새로 맞춥니다(한 장면 안에서 변형마다 범위가 다를 수 있음). */
  function useView(b, key, box) {
    b.focus = box;
    if (b.__ccKey !== key) { b.__ccKey = key; b.fit(); }
  }

  /* ===== 변형 문제 (「새 문제」) ===== */
  // pool: 변형을 만드는 함수들. 처음에는 pool[0](기출 유형 그대로), 「새 문제」는 직전과 다른 변형.
  const lctActive = s => !!(s && (s.lessonOn || s.lessonEntry));
  function varier(pool) {
    let idx = 0, cur = pool[0]();
    const first = cur;
    return { pool, get idx() { return idx; }, cur: () => lctActive(window.lab && window.lab.s) ? first : cur, first: () => first, set(j) { idx = j; cur = pool[j](); return cur; }, next() { let j; do { j = Math.floor(Math.random() * pool.length); } while (pool.length > 1 && j === idx); idx = j; cur = pool[j](); return cur; } };
  }
  const probHTML = (body) => `${body}<div style="margin-top:10px"><button type="button" class="apl-btn sm" data-cc-new>새 문제</button></div>`;
  document.addEventListener('click', (ev) => {
    const hit = ev.target && ev.target.closest && ev.target.closest('[data-cc-new]');
    if (!hit) return;
    const lab = window.lab, sc = lab && lab.scene;
    if (!sc || !sc.vary) return;
    sc.vary.next();
    lab.s.revealed = false;
    lab.setStep(0);
    try { lab._buildReview(); } catch (e) { /* 키트가 바뀌어도 그림은 그대로 */ }
    lab.invalidate(true);
  });
  // 전체 장면 보기는 enter 전에도 다른 장면의 단계 수를 묻습니다. 활성 탐구만 현재 상태를 읽습니다.
  const stepsOf = (V, id) => (s, lab = window.lab) => (lab && lab.tab === 'explore' && lab.scene && lab.scene.id === id ? exploreSteps(id, s) : V.cur().steps).map((t) => t.replace(/<\/?b>/g, ''));
  const reviewTop = (V) => () => `<div class="apl-rich" style="font-size:var(--fs-sm);line-height:1.75"><small style="color:var(--text-3);font-weight:800">문제</small><br>${V.cur().text}</div>`;
  /** 탭에 따른 풀이 단계: 정리 탭은 s.step, 문제 탭·탐구 탭은 0 */
  const stepOf = (s, lab) => (lab && lab.tab === 'review' ? s.step : 0);
  const baseScene = (o) => ({ tabs: { compact: true }, ...o });

  /* ===== 그리기 도우미 ===== */
  function plane(b, s, ticks = true) { if (s.grid) b.grid(); b.axes({ ticks }); }
  /** 이름 붙은 고정점 */
  const dot = (b, p, label, color = 'ink', o = {}) => b.point(p, { color, r: 5, label, size: 13, ...o });
  const par = (v) => (v < 0 ? `(${nt(v)})` : nt(v)); // 수식 속 음수는 괄호로 감쌉니다
  const sgn = (v, name) => (v === 0 ? name : v > 0 ? `${name}-${nt(v)}` : `${name}+${nt(-v)}`); // x − a 꼴 문자열 (a=−2이면 x+2)
  /** 화면 왼쪽 위에 색깔 범례(선의 이름표). 그림이 좁아도 선 이름이 가려지지 않게 화면 좌표로 씁니다. */
  function legend(b, items) { const y0 = (b.insets.top || 0) + 18; items.forEach(([c, t], i) => b.stext(10, y0 + i * 17, t, { color: c, size: 12.5, align: 'left' })); }
  const plainEq = (t) => String(t).replace(/\^2/g, '²').replace(/-/g, '−').replace(/=/g, ' = ').replace(/\\/g, '');
  const REF = { x: (p) => P(p.x, -p.y), y: (p) => P(-p.x, p.y), o: (p) => P(-p.x, -p.y), d: (p) => P(p.y, p.x) };
  const RNAME = { x: 'x축', y: 'y축', o: '원점', d: '직선 y = x' };

  /* ======================= 장면 1 · 평행이동 ======================= */
  const SHAPES = {
    para: { label: '포물선 y = x²', pt: (u) => P(u, u * u), umin: -2, umax: 2, eq: (a, b) => `${sgn(b, 'y')}=(${sgn(a, 'x')})^2`, base: 'y=x^2' },
    circle: { label: '원 x² + y² = 4', pt: (u) => P(2 * Math.cos(u), 2 * Math.sin(u)), umin: -Math.PI, umax: Math.PI, eq: (a, b) => `(${sgn(a, 'x')})^2+(${sgn(b, 'y')})^2=4`, base: 'x^2+y^2=4' },
    line: { label: '직선 y = 2x', pt: (u) => P(u, 2 * u), umin: -3, umax: 3, eq: (a, b) => `${sgn(b, 'y')}=2(${sgn(a, 'x')})`, base: 'y=2x' }
  };
  /** 도형 설명자 d: {t:'para', vx, vy} | {t:'circ', cx, cy, r} 를 그립니다. */
  function drawShape(b, d, o = {}) {
    if (d.t === 'para') b.plot((x) => (x - d.vx) ** 2 + d.vy, { color: o.color || 'ink', width: o.width || 3, dash: o.dash, alpha: o.alpha, glow: o.glow, ref: o.ref });
    else b.circle(P(d.cx, d.cy), d.r, { color: o.color || 'ink', width: o.width || 3, dash: o.dash, alpha: o.alpha, glow: o.glow, ref: o.ref });
  }
  function drawShift(b, s, mode) {
    const sh = SHAPES[s.shape], a = s.a, bb = s.b;
    const orig = s.shape === 'para' ? { t: 'para', vx: 0, vy: 0 } : s.shape === 'circle' ? { t: 'circ', cx: 0, cy: 0, r: 2 } : null;
    const img = s.shape === 'para' ? { t: 'para', vx: a, vy: bb } : { t: 'circ', cx: a, cy: bb, r: 2 };
    if (s.shape === 'line') {
      b.line(P(0, 0), 2, { color: 'ink', width: 2.6, dash: true, alpha: 0.6 });
      b.line(P(a, bb), 2, { color: 'amber', width: 3.2, glow: true, ref: 'img' });
    } else {
      drawShape(b, orig, { color: 'ink', width: 2.6, dash: true, alpha: 0.6 });
      drawShape(b, img, { color: 'amber', width: 3.2, glow: true, ref: 'img' });
    }
    const Q = sh.pt(s.u), Q2 = P(Q.x + a, Q.y + bb), K = P(Q.x + a, Q.y);
    if (a !== 0 || bb !== 0) {
      if (a !== 0) b.seg(Q, K, { color: 'sky', width: 3, ref: 'a' });
      if (bb !== 0) b.seg(K, Q2, { color: 'rose', width: 3, ref: 'b' });
      if (a !== 0) b.text(midP(Q, K), `x축으로 ${n2(a)}`, { color: 'sky', size: 12.5, dy: bb >= 0 ? -13 : 17, ref: 'a' });
      if (bb !== 0) b.text(midP(K, Q2), `y축으로 ${n2(bb)}`, { color: 'rose', size: 12.5, dx: a >= 0 ? 10 : -10, align: a >= 0 ? 'left' : 'right', ref: 'b' });
    }
    b.handle('Q', Q, { color: 'ink', label: `Q${pS(Q)}`, ...away(Q, P(0, 0), 22), drag: (w) => {
      if (s.shape === 'circle') s.u = Math.atan2(w.y, w.x);
      else s.u = clamp(snapTo(w.x, 0.5), sh.umin, sh.umax);
    } });
    b.point(Q2, { color: 'amber', r: 5.5, label: `Q′${pS(Q2)}`, ...away(Q2, Q, 22), size: 13, ref: 'img' });
    b.handle('O2', P(a, bb), { color: 'amber', r: 7.5, label: `(${n2(a)}, ${n2(bb)})`, dx: 16, dy: 18, align: 'left', drag: (w) => { s.a = clamp(Math.round(w.x), -5, 5); s.b = clamp(Math.round(w.y), -4, 4); } });
  }
  function mkPara(p, q, a, bb) {
    const p2 = p - 2 * a, q2 = a * a - p * a + q + bb, v = (pp, qq) => [-pp / 2, qq - (pp * pp) / 4];
    const [vx, vy] = v(p, q), [wx, wy] = v(p2, q2), eqT = (pp, qq) => `y=x^2${pp === 0 ? '' : pp > 0 ? `+${pp === 1 ? '' : pp}x` : `-${pp === -1 ? '' : -pp}x`}${qq === 0 ? '' : qq > 0 ? `+${qq}` : `${qq}`}`;
    const vf = (x0, y0) => `y=(${sgn(x0, 'x')})^2${y0 === 0 ? '' : y0 > 0 ? `+${y0}` : `${y0}`}`;
    return {
      kind: 'find', origLab: plainEq(eqT(p, q)), imgLab: plainEq(eqT(p2, q2)), orig: { t: 'para', vx, vy }, img: { t: 'para', vx: wx, vy: wy }, a, b: bb, ans: a + bb, box: { x: [Math.min(vx, wx) - 4.5, Math.max(vx, wx) + 4.5], y: [Math.min(vy, wy) - 2.5, Math.max(vy, wy) + 7] },
      text: `이차함수 ${tex(eqT(p, q))}의 그래프를 ${tex('x')}축의 방향으로 ${tex('a')}만큼, ${tex('y')}축의 방향으로 ${tex('b')}만큼 평행이동하였더니 이차함수 ${tex(eqT(p2, q2))}의 그래프가 되었다. ${tex('a+b')}의 값을 구하시오.`,
      steps: [
        `두 포물선의 꼭짓점을 비교합니다. $${vf(vx, vy)}$ → 꼭짓점 $${pT(P(vx, vy))}$, 이동 후 $${vf(wx, wy)}$ → 꼭짓점 $${pT(P(wx, wy))}$`,
        `평행이동은 모든 점을 같은 만큼 옮기므로 꼭짓점의 이동량이 곧 $(a,\\ b)$ 입니다: $a=${nt(wx)}-${par(vx)}=${nt(a)}$, $b=${nt(wy)}-${par(vy)}=${nt(bb)}$`,
        `$a+b=${par(a)}+${par(bb)}=${nt(a + bb)}$`
      ],
      ansTex: nt(a + bb),
      std: `① 이동한 식은 ${tex(`y-b=(x-a)^2${p === 0 ? '' : `+${p}(x-a)`}+${q}`.replace('+-', '-'))}이므로 정리하면 ${tex(`y=x^2+(${nt(p)}-2a)x+(a^2-${par(p)}a+${nt(q)}+b)`)}입니다.<br/>
② ${tex('x')}의 계수 비교: ${tex(`${nt(p)}-2a=${nt(p2)}`)} → ${tex(`a=${nt(a)}`)}<br/>
③ 상수항 비교: ${tex(`a^2-${par(p)}a+${nt(q)}+b=${nt(q2)}`)} → ${tex(`b=${nt(bb)}`)}<br/>
④ ${tex(`a+b=${nt(a + bb)}`)}`,
      warn: '식이 x → x−a, y → y−b로 바뀌므로 이동량의 부호와 식 속 부호가 반대입니다. 전개한 뒤 계수를 비교할 때 이 부호를 놓치기 쉽습니다.',
      quick: `완전제곱꼴로 고치면 꼭짓점이 ${tex(`${pT(P(vx, vy))}\\to${pT(P(wx, wy))}`)}로 움직였습니다. 평행이동은 꼭짓점의 이동과 같으므로 ${tex(`(a,\\ b)=${pT(P(a, bb))}`)}, ${tex(`a+b=${nt(a + bb)}`)}.`,
      highlight: '포물선·원의 평행이동은 꼭짓점·중심 한 점이 얼마나 옮겨졌는지만 보면 됩니다. 식 전체를 전개해 비교할 필요가 없습니다.'
    };
  }
  function mkCirc(cx, cy, r, a, bb, ask) {
    const nc = P(cx + a, cy + bb), gen = `x^2+y^2${cx === 0 ? '' : cx > 0 ? `-${2 * cx}x` : `+${-2 * cx}x`}${cy === 0 ? '' : cy > 0 ? `-${2 * cy}y` : `+${-2 * cy}y`}${cx * cx + cy * cy - r * r === 0 ? '' : (cx * cx + cy * cy - r * r) > 0 ? `+${cx * cx + cy * cy - r * r}` : `${cx * cx + cy * cy - r * r}`}=0`;
    const std = `(${sgn(cx, 'x')})^2+(${sgn(cy, 'y')})^2=${r * r}`;
    const mv = `${a === 0 ? '' : `${tex('x')}축의 방향으로 ${tex(nt(a))}만큼, `}${bb === 0 ? '' : `${tex('y')}축의 방향으로 ${tex(nt(bb))}만큼 `}`;
    if (ask === 'ab') {
      const img = `(${sgn(nc.x, 'x')})^2+(${sgn(nc.y, 'y')})^2=${r * r}`;
      return {
        kind: 'find', origLab: '원 ' + plainEq(std), imgLab: '원 ' + plainEq(img), orig: { t: 'circ', cx, cy, r }, img: { t: 'circ', cx: nc.x, cy: nc.y, r }, a, b: bb, ans: a + bb, box: boxOf([P(cx, cy), nc, P(cx - r, cy - r), P(nc.x + r, nc.y + r)], 3),
        text: `원 ${tex(std)}을 ${tex('x')}축의 방향으로 ${tex('a')}만큼, ${tex('y')}축의 방향으로 ${tex('b')}만큼 평행이동하였더니 원 ${tex(img)}이 되었다. ${tex('a+b')}의 값을 구하시오.`,
        steps: [
          `두 원의 중심을 비교합니다. 이동 전 중심 $${pT(P(cx, cy))}$, 이동 후 중심 $${pT(nc)}$ (반지름 ${r}은 그대로)`,
          `중심의 이동량이 $(a,\\ b)$: $a=${nt(nc.x)}-${par(cx)}=${nt(a)}$, $b=${nt(nc.y)}-${par(cy)}=${nt(bb)}$`,
          `$a+b=${par(a)}+${par(bb)}=${nt(a + bb)}$`
        ],

    return [
      `Step 1 · 순서대로 꼭짓점 추적 — 현재 이동량은 (${a}, ${b})입니다. ${desc}입니다.${b === 0 ? ' 지금은 b = 0이므로 두 결과가 같습니다.' : ' y좌표 이동량의 부호가 달라 두 결과가 다릅니다.'}`,
      `Step 2 · 세로 차이의 최댓값 — 직선 $y=2x$와의 차이를 완전제곱하면 $\\Delta=-(x-a+1)^2+1-2a${one ? '+b' : two ? '-b' : '\\pm b'}$입니다. $x=a-1=${a - 1}$에서 차이가 최대입니다.`,
      `Step 3 · 현재 교점 수 판단 — ${one ? `①의 최대 차이 ${g1}: ${word(g1)}` : two ? `②의 최대 차이 ${g2}: ${word(g2)}` : `①의 최대 차이 ${g1}: ${word(g1)}, ②의 최대 차이 ${g2}: ${word(g2)}`}입니다. 최대 차이가 양수·0·음수일 때 각각 두 교점·한 접점·교점 없음으로 구별합니다.`
    ];
  }

  const params = {
      a: { value: 3, min: -5, max: 5, step: 1, color: 'sky', label: 'x축 방향 이동량 a', format: (v) => `a = ${v}` },
      b: { value: 2, min: -4, max: 4, step: 1, color: 'rose', label: 'y축 방향 이동량 b', format: (v) => `b = ${v}` },
      ca: { value: 1, min: -4, max: 4, step: 1, color: 'sky', label: 'x축 방향 이동량 a', format: (v) => `a = ${v}` },
      cb: { value: 2, min: -4, max: 4, step: 1, color: 'rose', label: 'y축 방향 이동량 b', format: (v) => `b = ${v}` }
    };

  const scenes = [scene7(), scene8(), scene9(), scene10()];
  const cloneLessonState = value => JSON.parse(JSON.stringify(value));
  const sourceInfo = Object.fromEntries(scenes.map(sc => {
    const initial = { ...Object.fromEntries(Object.entries(params).map(([key, p]) => [key, p.value])), grid: false };
    sc.enter?.(initial);
    return [sc.id, { initial, first: sc.vary.first(), tag: typeof sc.problem.tag === 'function' ? sc.problem.tag() : sc.problem.tag }];
  }));
  const source = window.APL_CT_SOURCE = {
    scenes, initial: id => cloneLessonState(sourceInfo[id].initial), first: id => sourceInfo[id].first,
    question: id => sourceInfo[id].first.text, answer: id => sourceInfo[id].first.ansTex,
    tag: id => sourceInfo[id].tag, steps: id => sourceInfo[id].first.steps.slice()
  };
  function restoreLessonView(b) {
    const saved = b._ctLessonView;
    if (!saved) return;
    if (b.focus === saved.appliedFocus) {
      for (const [key, value] of Object.entries(saved.original)) {
        if (saved.had[key]) b[key] = value; else delete b[key];
      }
    } else delete b.__ccKey;
    delete b._ctLessonView;
  }
  function neutralLessonLabel(value) {
    const label = String(value || '');
    if (/^(?:x축|y축|x|y|O|y ?= ?x|원점 O|원)$/.test(label)) return label;
    const named = label.match(/^([A-Z](?:[₀₁₂₃₄₅ₓ]|_[a-z])?['′″*]*)(?=[\s(=:≈]|$)/);
    if (named) return named[1];
    if (/^[①②]/.test(label)) return label[0];
    const meaning = label.match(/^(?:꼭짓점|새 중심|중심|접점|교점|이동 전|이동 후|대칭이동한 원|Δ 최댓값)/);
    return meaning ? meaning[0] : '';
  }
  function traceLessonGeometry(b, s, paths, circles, points, plots) {
    const u = APLab.clamp(Number(s.lctTrace) || 0, 0, 1);
    if (s.lessonEntry || !u) return;
    const box = b.viewBox(), margin = 5 / Math.max(b.k, 0.01);
    box.x0 += margin; box.x1 -= margin; box.y0 += margin; box.y1 -= margin;
    const inside = p => p.x >= box.x0 && p.x <= box.x1 && p.y >= box.y0 && p.y <= box.y1;
    const clip = (a, z) => {
      const dx = z.x - a.x, dy = z.y - a.y; let lo = 0, hi = 1;
      for (const [p, q] of [[-dx, a.x - box.x0], [dx, box.x1 - a.x], [-dy, a.y - box.y0], [dy, box.y1 - a.y]]) {
        if (Math.abs(p) < 1e-12) { if (q < 0) return null; }
        else { const r = q / p; if (p < 0) lo = Math.max(lo, r); else hi = Math.min(hi, r); if (lo > hi) return null; }
      }
      return [{ x: a.x + dx * lo, y: a.y + dy * lo }, { x: a.x + dx * hi, y: a.y + dy * hi }];
    };
    const choices = [];
    for (const entry of paths) {
      const points = entry.points.concat(entry.options.close ? [entry.points[0]] : []);
      let best = [], bestLength = 0, run = [], length = 0;
      const finish = () => { if (length > bestLength) { best = run; bestLength = length; } run = []; length = 0; };
      for (let i = 1; i < points.length; i++) {
        const edge = clip(points[i - 1], points[i]);
        if (!edge) { finish(); continue; }
        if (run.length && Math.hypot(run.at(-1).x - edge[0].x, run.at(-1).y - edge[0].y) > 1e-7) finish();
        if (!run.length) run.push(edge[0]); run.push(edge[1]);
        length += Math.hypot(edge[1].x - edge[0].x, edge[1].y - edge[0].y);
      }
      finish();
      if (bestLength > 1e-6) choices.push({ points: best, length: bestLength, score: entry.options.width || 2.6 });
    }
    for (const entry of plots) {
      const lo = Math.max(box.x0, entry.options.from ?? -Infinity), hi = Math.min(box.x1, entry.options.to ?? Infinity);
      let run = [], best = [];
      for (let i = 0; i <= 192; i++) {
        const x = lo + (hi - lo) * i / 192, point = { x, y: entry.fn(x) };
        if (Number.isFinite(point.y) && inside(point)) run.push(point);
        else { if (run.length > best.length) best = run; run = []; }
      }
      if (run.length > best.length) best = run;
      if (best.length > 2) {
        let length = 0;
        for (let i = 1; i < best.length; i++) length += Math.hypot(best[i].x - best[i-1].x, best[i].y - best[i-1].y);
        choices.push({ ...entry, from: best[0].x, to: best.at(-1).x, length, score: entry.options.width || 3 });
      }
    }
    for (const entry of circles) {
      let start = null, best = null;
      for (let i = 0; i <= 128; i++) {
        const angle = i * Math.PI * 2 / 128;
        const p = { x: entry.center.x + entry.radius * Math.cos(angle), y: entry.center.y + entry.radius * Math.sin(angle) };
        if (inside(p)) { if (start === null) start = angle; }
        else if (start !== null) { const end = (i - 1) * Math.PI * 2 / 128; if (!best || end - start > best[1] - best[0]) best = [start, end]; start = null; }
      }
      if (start !== null && (!best || Math.PI * 2 - start > best[1] - best[0])) best = [start, Math.PI * 2];
      if (best && best[1] > best[0]) choices.push({ ...entry, angles: best, length: entry.radius * (best[1] - best[0]), score: entry.options.width || 2.6 });
    }
    choices.sort((a, z) => z.score - a.score || z.length - a.length);
    const selected = choices[0];
    if (!selected) {
      const condition = points.find(p => inside(p));
      if (condition) b.point(condition, { color: 'violet', r: 5 + 4 * Math.sin(Math.PI * u), hollow: true, glow: false });
      return;
    }
    let p;
    if (selected.fn) {
      const x = selected.from + u * (selected.to - selected.from);
      p = { x, y: selected.fn(x) };
      b.plot(selected.fn, { from: selected.from, to: x, color: 'violet', width: 4.2, alpha: 0.85 });
    } else if (selected.angles) {
      const angle = selected.angles[0] + u * (selected.angles[1] - selected.angles[0]);
      p = { x: selected.center.x + selected.radius * Math.cos(angle), y: selected.center.y + selected.radius * Math.sin(angle) };
      b.arc(selected.center, selected.radius, selected.angles[0], angle, { color: 'violet', width: 4.2, alpha: 0.85 });
    } else {
      let remaining = selected.length * u; const drawn = [selected.points[0]];
      for (let i = 1; i < selected.points.length; i++) {
        const a = selected.points[i - 1], z = selected.points[i], length = Math.hypot(z.x - a.x, z.y - a.y);
        if (remaining <= length || i === selected.points.length - 1) {
          const f = length ? Math.min(1, remaining / length) : 0;
          p = { x: a.x + f * (z.x - a.x), y: a.y + f * (z.y - a.y) }; drawn.push(p); break;
        }
        drawn.push(z); remaining -= length;
      }
      b.path(drawn, { color: 'violet', width: 4.2, alpha: 0.85 });
    }
    if (p) b.point(p, { color: 'violet', r: 4.5, glow: false });
  }
  for (const sc of scenes) {
    const original = { question: sc.question, reviewTop: sc.reviewTop, steps: sc.steps, view: sc.view, draw: sc.draw };
    sc.question = (s, lab) => lctActive(s) ? s.lctQuestion || source.question(sc.id) : typeof original.question === 'function' ? original.question(s, lab) : original.question;
    sc.reviewTop = (s, lab) => lctActive(s) ? '' : typeof original.reviewTop === 'function' ? original.reviewTop(s, lab) : original.reviewTop;
    sc.steps = (s, lab) => lctActive(s) ? ['조건과 좌표를 확인해요.', '좌표 관계를 식으로 연결해요.', '구하는 값을 확인해요.'] : original.steps(s, lab);
    sc.view = (s, lab) => lctActive(s) ? {} : original.view(s, lab);
    sc.draw = (b, s, v, lab) => {
      if (b.thumb || b._bbox) return original.draw(b, s, v, lab);
      if (!lctActive(s)) { restoreLessonView(b); return original.draw(b, s, v, lab); }
      if (b._ctLessonView && b._ctLessonView.scene !== sc.id) restoreLessonView(b);
      if (!b._ctLessonView) {
        const keys = ['focus', 'zoom', 'panX', 'panY', '__ccKey'];
        b._ctLessonView = { scene: sc.id, original: Object.fromEntries(keys.map(key => [key, b[key]])), had: Object.fromEntries(keys.map(key => [key, Object.hasOwn(b, key)])) };
      }
      const shown = { ...s, playing: false, lctShowAnswer: !s.lessonEntry && !!s.lctShowAnswer,
        step: s.lessonEntry ? 0 : Math.max(0, Math.min(s.lctExplore && s.lctStage >= 0 ? s.lctStage : s.step || 0, s.lctShowAnswer || s.lctExplore && s.lctStage >= 0 ? 3 : 2)) };
      const shownLab = Object.create(lab); shownLab.tab = s.lctExplore ? 'explore' : 'review'; shownLab.s = shown;
      const key = sc.id + '|' + !!s.lctExplore + '|' + (s.lctMode || '') + '|' + (s.lctTarget || '');
      if (b._ctLessonView.key !== key) { b._ctLessonView.key = key; delete b.__ccKey; b.zoom = 1; b.panX = 0; b.panY = 0; }
      const paths = [], circles = [], points = [], plots = [], plot = b.plot, path = b.path, circle = b.circle, point = b.point, handle = b.handle, text = b._text, emph = b.emph;
      b.emph = { ...emph, part: shown.part };
      const eligible = options => !b._bbox && (!options.dash || Array.isArray(options.dash) && !options.dash.length) && options.color !== null && options.stroke !== false && (options.width || 2.6) >= 2.4;
      b.plot = function (fn, options = {}) {
        if (eligible(options)) plots.push({ fn, options });
        return plot.call(this, fn, options);
      };
      b.path = function (ps, options = {}) {
        if (ps.length >= 2 && eligible(options)) paths.push({ points: ps.map(p => this._P(p)), options });
        return path.call(this, ps, options);
      };
      b.circle = function (center, radius, options = {}) {
        if (radius > 0 && eligible(options)) circles.push({ center: this._P(center), radius, options });
        return circle.call(this, center, radius, options);
      };
      b.point = function (p, options = {}) {
        if (!b._bbox) points.push(this._P(p));
        return point.call(this, p, !b._bbox && !shown.lctShowAnswer && options.label ? { ...options, label: neutralLessonLabel(options.label) } : options);
      };
      b.handle = function (id, p, options = {}) {
        if (!b._bbox) points.push(this._P(p));
        return handle.call(this, id, p, !b._bbox && !shown.lctShowAnswer && options.label ? { ...options, label: neutralLessonLabel(options.label) } : options);
      };
      b._text = function (x, y, label, options = {}) { return text.call(this, x, y, !b._bbox && !shown.lctShowAnswer ? neutralLessonLabel(label) : label, options); };
      try {
        const focus = shown.lctExplore && window.APL_CT_LESSONS?.focus?.(sc.id, shown.lctMode);
        if (focus) { useView(b, 'lesson:' + sc.id + ':' + shown.lctMode, focus); plane(b, shown); }
        const custom = shown.lctExplore && window.APL_CT_LESSONS?.drawConcept?.(b, shown, sc.id);
        if (!custom) original.draw(b, shown, {}, shownLab);
      }
      finally { b.plot = plot; b.path = path; b.circle = circle; b.point = point; b.handle = handle; b._text = text; b.emph = emph; }
      b._ctLessonView.appliedFocus = b.focus;
      traceLessonGeometry(b, shown, paths, circles, points, plots);
    };
  }
  const lessons = window.APL_CT_LESSONS ? window.APL_CT_LESSONS.install(scenes, source) : {};

  /* ===== 실험실 등록 ===== */
  APLab.createLab({
    id: 'common-transform',
    stagedReveal: true,
    title: '도형의 이동',
    courseName: '공통수학',
    unit: '도형의 방정식 · 도형의 이동',
    courseColor: 'var(--m-violet)',
    home: '../index.html#common',
    board: { kind: 'cartesian', focus: { x: [-9, 9], y: [-6.5, 9] } },
    params, scenes, lessons
  });
});
</script>
