/* ==========================================================================
   중3 · 삼각비 (AP Math Lab 2.0 이식본) — 8개 탐구관 × 38개 장면
   원본: labs/g9/삼각비.html
   이식 방식: "호환층 이식" — 원본의 내용(getSpec)과 그리기 코드(renderMode1~8)를
   글자 그대로 옮기고, 그리기 함수 이름(pline·ppoly·pdot…)만 apl-compat.js가 새 무대 엔진에 연결합니다.
   원본과 다른 점
   - 원본에서 정의가 빠져 오류가 나던 addPt·projectOnLine을 정의하고(탭 5 '함정' 장면, 탭 8),
     탭 8에서 변수 sub가 벡터 함수 sub()를 가리던 문제를 변수 이름 변경으로 해결(탭 8의 3개 장면 복구)
   - 캔버스를 직접 그리던 2곳(사분원 호, 시계추 호)만 parc로 교체
   - 미니 상자·하단 띠는 그림 위가 아닌 무대 카드·요약 띠로 이동
   - 효과가 없던 조작(관찰 렌즈, 해당 장면에서 쓰이지 않는 각·길이·변환 버튼)은 표시하지 않음
   ========================================================================== */
window.addEventListener('DOMContentLoaded', function () {
  const tex = APLab.tex;

  /* ===== 원본 그대로: 색 상수와 벡터 도우미 (원본 349–371행) ===== */
    const TCOL = {
      cyan: '#38bdf8',
      pink: '#f472b6',
      green: '#34d399',
      gold: '#fbbf24',
      white: '#f1f5f9',
      red: '#f43f5e',
      purple: '#c084fc'
    };

    function pt(x, y) { return { x, y }; }
    function mid(a, b) { return { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 }; }
    function lerp(a, b, t) { return { x: a.x + (b.x - a.x) * t, y: a.y + (b.y - a.y) * t }; }
    function dist(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }
    function sub(a, b) { return { x: a.x - b.x, y: a.y - b.y }; }
    function add(a, b) { return { x: a.x + b.x, y: a.y + b.y }; }
    function mul(v, k) { return { x: v.x * k, y: v.y * k }; }
    function norm(v) { const l = Math.hypot(v.x, v.y) || 1; return { x: v.x / l, y: v.y / l }; }
    function rot(p, center, rad) {
      const dx = p.x - center.x, dy = p.y - center.y;
      const c = Math.cos(rad), s = Math.sin(rad);
      return { x: center.x + dx * c - dy * s, y: center.y + dx * s + dy * c };
    }

  /* ===== [2.0 수정] 원본에서 정의가 빠져 있던 도우미 2개 =====
     원본 탭 8의 기본 장면(quadUnfold2x)·quadDiagHalf·quadSplitSum과 탭 5 trapDontSplit60이
     ReferenceError로 그려지지 않던 원인입니다. */
  function addPt(a, b) { return add(a, b); }
  function projectOnLine(p, a, b) {
    const d = sub(b, a), l2 = d.x * d.x + d.y * d.y || 1;
    const t = ((p.x - a.x) * d.x + (p.y - a.y) * d.y) / l2;
    return { x: a.x + d.x * t, y: a.y + d.y * t };
  }

  /* ===== 원본 상태 객체(이름 그대로) — 매 프레임 2.0 셸 상태에서 채웁니다 ===== */
  const state = {
    mode: 1,
    subType: { 1: 'defSCT', 2: 'cut3060', 3: 'unitCircle', 4: 'findFromHyp', 5: 'sasAcuteLen', 6: 'heightAcute', 7: 'areaAcute', 8: 'quadUnfold2x' },
    conceptSwitch: 'all', activePartIdx: -1, fold: 0.0, foldTarget: null,
    angleDeg: 30, baseLen: 10, scale: 1.0, panX: 0, panY: 0
  };

  /* ===== 원본 그대로: 세부 시나리오 목록 (원본 407–462행) ===== */
    const SUB_MENUS = {
      1: [
        { id: 'defSCT', label: '✍️ 기본 정의 (sin·cos·tan 필기체 궤적)' },
        { id: 'refAngleSwap', label: '🔄 [오답 1위] 기준각 ∠A ↔ ∠B(90°-A) 역전!' },
        { id: 'oneToOther', label: '🔢 한 삼각비(sin A=3/5)로 나머지 구하기' },
        { id: 'simRightTri', label: '📐 수선 닮음 삼각형 (큰 삼각형 변으로 읽기!)' },
        { id: 'solid3DTrig', label: '🧊 입체도형 속 삼각비 (정육면체 대각선 ∠AGH)' }
      ],
      2: [
        { id: 'cut3060', label: '🔺 30°·60°의 탄생: 정삼각형 반 자르기 (1:√3:2)' },
        { id: 'cut45', label: '⬛ 45°의 탄생: 정사각형 대각선 자르기 (1:1:√2)' },
        { id: 'chainSpecial', label: '🪜 이어 붙인 두 특수각 삼각형 (45°+30° 연쇄)' },
        { id: 'lineSlope', label: '📈 일차함수 직선의 기울기 = tan θ!' },
        { id: 'tan15Iso', label: '🔥 [심화] 30° 외각 이등변으로 tan 15° = 2-√3 유도' }
      ],
      3: [
        { id: 'unitCircle', label: '🕹️ [핵심] 반지름 1 사분원 점 A 드래그 실험!' },
        { id: 'whyOuterTan', label: '❓ 왜 tan x는 안쪽 AB/OB 대신 바깥 CD로 읽을까?' },
        { id: 'limit04590', label: '📊 0°·45°·90° 극한 & 대소 역전 경계선(45°)' },
        { id: 'absSignJudge', label: '🔥 [내신 킬러] √(sin x - cos x)² 부호 판별기' },
        { id: 'trigTableCalc', label: '📋 삼각비의 표 읽기 & 소수점 선분 길이 변환' }
      ],
      4: [
        { id: 'findFromHyp', label: '📏 빗변 c와 각 A 알 때 (높이 c sin A, 밑변 c cos A)' },
        { id: 'findFromBase', label: '📐 밑변 b와 각 A 알 때 (높이 b tan A, 빗변 b/cos A)' },
        { id: 'pendulumSwing', label: '🕰️ [오답 1위] 흔들리는 그네·시계추 높이 h = L(1-cos θ)!' },
        { id: 'treeEyeHeight', label: '🌲 눈높이(h₀)가 있는 나무 꼭대기 높이 (b tan A + h₀)' },
        { id: 'brokenTreeCone', label: '⚡ 부러진 나무 높이 & 원뿔 모선·높이·부피' }
      ],
      5: [
        { id: 'sasAcuteLen', label: '✂️ 두 변(b,c)과 예각 A 알 때: 수선 CH 내려 풀기' },
        { id: 'sasObtuseLen', label: '🔥 두 변과 둔각(120°) 알 때: 바깥 연장선에 수선!' },
        { id: 'asaSplit75', label: '🎯 한 변과 양 끝각(45°, 60° ➔ 꼭지각 75° 쪼개기!)' },
        { id: 'trapDontSplit60', label: '🚫 [함정] 왜 특수각(60°)을 쪼개는 수선을 그으면 안 될까?' }
      ],
      6: [
        { id: 'heightAcute', label: '⛰️ [필수1] 예각삼각형 높이 h = a / (tan x + tan y)' },
        { id: 'heightObtuse', label: '🌋 [필수2] 둔각삼각형 높이 h = a / (tan x - tan y)' },
        { id: 'std4560Height', label: '⚡ (45° + 60°) 표준 예각 높이 3초 암산 (BH=h, CH=√3h)' },
        { id: 'std3060Mountain', label: '🏔️ (30° vs 60°) 둔각 산 높이 측량 (숨은 이등변 발견!)' }
      ],
      7: [
        { id: 'areaAcute', label: '🟩 예각삼각형 넓이 S = ½ bc sin A (높이 c sin A)' },
        { id: 'areaObtuse', label: '🟥 둔각삼각형 넓이 S = ½ bc sin(180°-A) (외각 높이!)' },
        { id: 'equilFormula', label: '💎 정삼각형 높이(√3/2 a)와 넓이(√3/4 a²) 공식 유도' },
        { id: 'regPolygonArea', label: '⬡ 정육각형·정팔각형·정십이각형 넓이 쪼개기' },
        { id: 'angleBisectLen', label: '🔥 [킬러 응용] 넓이 분할(S=S₁+S₂)로 각이등분선 AD 구하기!' }
      ],
      8: [
        { id: 'quadUnfold2x', label: '🎬 [핵심 증명] 왜 사각형 대각선 넓이는 ½ pq sin θ 일까? (2배 확장!)' },
        { id: 'paraArea', label: '▱ 평행사변형 넓이 S = ab sin θ (= 삼각형 2개 합)' },
        { id: 'rhombusSquare', label: '💠 마름모 넓이 (a² sin θ vs ½ pq)' },
        { id: 'quadDiagHalf', label: '❌ 두 대각선(p,q)과 교각 θ가 주어진 일반 사각형 넓이' },
        { id: 'quadSplitSum', label: '🧩 일반 사각형을 대각선으로 쪼개어 넓이 합(S₁+S₂) 구하기' }
      ]
    };

  /* ===== 호환층: 원본 그리기 함수 이름 → 새 무대 엔진 ===== */
  let BOARD = null;
  let ctx = null; // 원본 탭 8의 globalAlpha 블록이 쓰는 캔버스 문맥(무대의 문맥)
  const sink = {};
  const { pline, ppoly, pdot, pright, ptick, pangle, ptag, parc, drawMiniOverlayBox, drawBottomTapeBanner } = APLab.compat.master(() => BOARD, sink);

  /* [표시 보강] 각 값을 같은 각의 안(호 바로 바깥, 이등분선 위)에 놓는 도우미와 평행 표시.
     pmark = pangle(호·고리 수·색)과 같은 호 + 값 글자 위치만 dx/dy로 비켜 이웃 각의 글자와 겹치지 않게 합니다.
     ppar  = 선분 가운데의 '>' 표시(평행·같은 방향). 모두 현재 꼭짓점 좌표에서 계산하므로 그림이 변해도 따라옵니다. */
  function pmark(v, p1, p2, col, r, rings, label, o = {}) {
    BOARD.angle(v, p1, p2, { color: col, r, rings, size: 12 });
    if (!label) return;
    const s0 = BOARD.toS(v), s1 = BOARD.toS(p1), s2 = BOARD.toS(p2);
    const t1 = Math.atan2(s1.y - s0.y, s1.x - s0.x), t2 = Math.atan2(s2.y - s0.y, s2.x - s0.x);
    const d = ((t2 - t1 + Math.PI * 3) % (Math.PI * 2)) - Math.PI;
    const m = t1 + d / 2, lr = r + (o.gap == null ? 13 : o.gap);
    const bx = o.abs ? 0 : Math.cos(m) * lr, by = o.abs ? 0 : Math.sin(m) * lr; // abs: dx/dy를 꼭짓점 기준 화면 위치로 직접 지정
    BOARD.text(v, label, { dx: bx + (o.dx || 0), dy: by + (o.dy || 0), color: col, size: o.size || 12.5, align: 'center', baseline: 'middle', weight: 800 });
  }
  function ppar(p, q, n = 1, col = TCOL.gold) {
    const a = BOARD.toS(p), b = BOARD.toS(q), c = BOARD.ctx;
    const m = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 }, l = Math.hypot(b.x - a.x, b.y - a.y) || 1;
    const d = { x: (b.x - a.x) / l, y: (b.y - a.y) / l }, nn = { x: -d.y, y: d.x };
    c.save();
    c.strokeStyle = BOARD.color(col); c.lineWidth = 2 * BOARD.lw; c.setLineDash([]); c.lineCap = 'round'; c.lineJoin = 'round';
    for (let i = 0; i < n; i++) {
      const o = (i - (n - 1) / 2) * 8, x = m.x + d.x * o, y = m.y + d.y * o;
      c.beginPath();
      c.moveTo(x - d.x * 4 + nn.x * 5, y - d.y * 4 + nn.y * 5); c.lineTo(x + d.x * 3, y + d.y * 3); c.lineTo(x - d.x * 4 - nn.x * 5, y - d.y * 4 - nn.y * 5);
      c.stroke();
    }
    c.restore();
  }

  /* ===== 원본 그대로: 장면별 실시간 명세 getSpec (원본 743–1214행) ===== */
    function getSpec() {
      const m = state.mode;
      const sub = state.subType[m];
      const deg = state.angleDeg;
      const rad = (deg * Math.PI) / 180;
      const L = state.baseLen;

      // ==================== [탭 1: 삼각비의 뜻 & 기준각 전환] ====================
      if (m === 1) {
        if (sub === 'refAngleSwap') {
          return {
            badge: `탐구 1-B · 🔄 [오답 1위] 기준각이 ∠A ↔ ∠B(90°-A)로 바뀔 때 밑변과 높이(대변)의 역전!`,
            hint: `슬라이더를 오른쪽으로 밀어 직각삼각형을 회전시켜 보세요! 기준각이 $\\angle A$에서 위쪽 $\\angle B(=90^\\circ-A)$로 바뀌면 <strong class="text-pink-300">기준각과 마주보는 대변(높이)과 이웃한 밑변이 서로 뒤바뀌어</strong> <strong class="text-amber-300">sin B = cos A, cos B = sin A</strong>가 됩니다!`,
            actionTxt: state.fold > 0.5 ? '🎬 ∠A를 바닥 기준각으로 복원' : '🎬 회전시켜 ∠B를 바닥 기준각으로 놓기!',
            p1Title: '기준각 ∠A', p2Title: '삼각형 비례(3:4:5)',
            parts: [
              { id: 0, name: `🟦 ∠A 기준: 높이(대변) = BC(3), 밑변 = AC(4)`, desc: `sin A = 3/5, cos A = 4/5, tan A = 3/4`, val: `sin A = 3/5`, color: TCOL.cyan, ok: true },
              { id: 1, name: `🩷 ∠B(90°-A) 기준: 높이(대변) = AC(4), 밑변 = BC(3)!`, desc: `∠B의 맞은편 변 AC(4)가 높이가 됨! (역전 주의!)`, val: `sin B = 4/5`, color: TCOL.pink, ok: true },
              { id: 2, name: `🟨 여각(90°-A) 핵심 항등식 3총사`, desc: `sin(90°-A) = cos A, cos(90°-A) = sin A, tan A·tan B = 1`, val: `sin B = cos A`, color: TCOL.gold, ok: true }
            ],
            totalRes: `∠A + ∠B = 90° 일 때: sin B = cos A (4/5), cos B = sin A (3/5), tan A × tan B = 1`,
            rule: '절대 법칙: “높이(대변)”는 위쪽 세로선이 아니라 언제나 “기준각과 마주보는 맞은편 변”이다!',
            formulaHTML: `• <strong>여각 관계</strong>: ${tex(`\\sin(90^\\circ-A) = \\cos A = \\dfrac{4}{5}, \\quad \\cos(90^\\circ-A) = \\sin A = \\dfrac{3}{5}`)}<br/>• <strong>탄젠트 역수</strong>: ${tex(`\\tan A \\times \\tan B = \\dfrac{3}{4} \\times \\dfrac{4}{3} = \\mathbf{1}`)}`,
            notes: `• 시험에서 위쪽에 있는 각 $\\angle B$의 삼각비를 물으면, 고개를 돌리거나 <strong>“$\\angle B$와 마주보는 변 $AC$에 [높이]라고 한글로 먼저 적어놓고”</strong> 분수를 만드세요!`
          };
        }
        if (sub === 'oneToOther') {
          return {
            badge: `탐구 1-C · 한 삼각비 값(예: sin A = 3/5)이 주어졌을 때 나머지 삼각비 구하기`,
            hint: `$\\sin A = \\dfrac{3}{5}$이 주어지면 빗변을 $5$, 마주보는 높이를 $3$으로 놓은 뒤 <strong class="text-emerald-300">피타고라스 정리(5² - 3² = 4²)로 밑변 4를 먼저 구합니다!</strong>`,
            actionTxt: state.fold > 0.5 ? '🎬 기본 보기' : '🎬 피타고라스 밑변 4 도출 강조!',
            p1Title: '기준각 선택', p2Title: '확대 배수',
            parts: [
              { id: 0, name: `🟦 1단계: 주어진 sin A = 3/5 으로 두 변 표시`, desc: `빗변 c = 5, 대변(높이) a = 3 배치`, val: `c=5, a=3`, color: TCOL.cyan, ok: true },
              { id: 1, name: `🟩 2단계: 피타고라스 정리로 남은 밑변 b 구하기`, desc: `b = √(5² - 3²) = √16 = 4`, val: `밑변 b = 4`, color: TCOL.green, ok: true },
              { id: 2, name: `🟨 3단계: cos A 와 tan A 완성!`, desc: `cos A = 밑변/빗변 = 4/5, tan A = 높이/밑변 = 3/4`, val: `cos=4/5, tan=3/4`, color: TCOL.gold, ok: true }
            ],
            totalRes: `sin A = 3/5  ➔  피타고라스 밑변 = 4  ➔  cos A = 4/5, tan A = 3/4`,
            rule: '삼각비 1개를 알려주면 직각삼각형을 작게 그려서 피타고라스로 세 번째 변부터 채운다!',
            formulaHTML: `• <strong>보너스 법칙</strong>: 언제나 ${tex(`\\tan A = \\dfrac{\\sin A}{\\cos A} = \\dfrac{3/5}{4/5} = \\dfrac{3}{4}`)} 및 ${tex(`\\sin^2 A + \\cos^2 A = 1`)} 이 성립합니다!`,
            notes: `• 만약 $\\tan A = 2$처럼 정수로 주어지면 분모를 $1$로 보아 $\\tan A = \\dfrac{2}{1}$ (밑변 $1$, 높이 $2 \\implies$ 빗변 $\\sqrt{1^2+2^2}=\\sqrt{5}$)로 놓으면 즉시 풀립니다!`
          };
        }

          totalRes: isObt ? `둔각(120°) 넓이 S = ½ × 8 × 10 × sin(180°-120°) = 20√3 cm²` : `예각(${effDeg}°) 넓이 S = ½ × 8 × 10 × sin ${effDeg}° = ${(40*Math.sin((effDeg*Math.PI)/180)).toFixed(1)} cm²`,

          formulaHTML: `• <strong>예각($B < 90^\\circ$)</strong>: ${tex(`S = \\dfrac{1}{2}ac\\sin B`)}<br/>• <strong>둔각($B > 90^\\circ$)</strong>: ${tex(`S = \\dfrac{1}{2}ac\\sin(180^\\circ - B)`)} (외각의 사인값 사용!)`,
          notes: `• <strong>[둔각 빠른 변환]</strong>: $120^\\circ$가 나오면 $\\sin 60^\\circ$, $135^\\circ$가 나오면 $\\sin 45^\\circ$, $150^\\circ$가 나오면 $\\sin 30^\\circ$를 그대로 곱하면 됩니다!`

  /* ===== 원본 그대로: 장면별 그리기 (원본 1242–2081행, ctx.arc 2곳만 parc로 교체) ===== */
    // =========================================================================
    // [탭 1 렌더링] 삼각비의 뜻 & 기준각 전환 & 수선 닮음 & 3D 입체 삼각비
    // =========================================================================
    function renderMode1TrigDef(rect, cx, cy) {
      const sub = state.subType[1];
      const s = state.scale * 1.05;
      const t = state.fold;

      if (sub === 'solid3DTrig') {
        // 정육면체 대각선 AG와 밑면 대각선 EG가 이루는 각 ∠AGE (1 : √2 : √3)
        const w = 85 * s, d = 40 * s;
        const E = pt(cx - w - d / 2, cy + w - d / 2);
        const F = pt(cx + w - d / 2, cy + w - d / 2);
        const G = pt(cx + w + d / 2, cy + w - 1.4 * d);
        const H = pt(cx - w + d / 2, cy + w - 1.4 * d);
        const A = pt(E.x, E.y - 1.55 * w), B = pt(F.x, F.y - 1.55 * w);
        const C = pt(G.x, G.y - 1.55 * w), D = pt(H.x, H.y - 1.55 * w);

        // 정육면체 모서리
        [[A,B],[B,C],[C,D],[D,A],[E,F],[F,G],[G,H],[H,E],[A,E],[B,F],[C,G],[D,H]].forEach((e) => {
          pline(e[0], e[1], 'rgba(148,163,184,0.4)', 1.8);
        });

        // 핵심 단면 직각삼각형 △AEG (AE=1, EG=√2, AG=√3, ∠AEG=90°)
        ppoly([A, E, G], 'rgba(251, 191, 36, 0.28)', TCOL.gold, 3.2);
        pline(E, G, TCOL.cyan, 4.2, [], true, 0);
        pline(A, E, TCOL.green, 4.2, [], true, 1);
        pline(A, G, TCOL.gold, 4.4, [], true, 2);
        pright(E, A, G, 13, TCOL.gold);
        pangle(G, A, E, TCOL.pink, 32, 1, 'x');

        pdot(A, 'A', TCOL.green, null, { x: -18, y: -8 });
        pdot(E, 'E(90° 직각!)', TCOL.gold, null, { x: -35, y: 18 });
        pdot(G, 'G(기준각 x)', TCOL.pink, null, { x: 12, y: 6 });

        ptag((A.x + E.x) / 2 - 36, (A.y + E.y) / 2, '높이 AE = 1', TCOL.green);
        ptag((E.x + G.x) / 2 + 10, (E.y + G.y) / 2 + 20, '밑면 대각선 EG = √2', TCOL.cyan);
        ptag((A.x + G.x) / 2 + 15, (A.y + G.y) / 2 - 12, '입체 대각선 AG = √3', TCOL.gold, 14);

        drawMiniOverlayBox(rect, '🧊 정육면체 대각선 황금비', [
          { txt: '세로 모서리(높이) = 1', col: '#34d399' },
          { txt: '밑면 대각선(밑변) = √2', col: '#38bdf8' },
          { txt: '입체 대각선(빗변) = √3', col: '#fbbf24' },
          { txt: '∴ sin x = 1/√3, cos x = √2/√3', col: '#f472b6' }
        ]);
        drawBottomTapeBanner(rect, '정육면체 대각선 직각삼각형 △AEG (1 : √2 : √3) ➔ sin x = √3/3 · cos x = √6/3 · tan x = √2/2');
        return;
      }

      if (sub === 'simRightTri') {
        const B = pt(cx - 140 * s, cy + 68 * s), C = pt(cx + 140 * s, cy + 68 * s);
        const H = pt(cx - 140 * s + 100.8 * s, cy + 68 * s);
        const A = pt(H.x, cy + 68 * s - 134.4 * s);

        ppoly([A, B, H], 'rgba(56, 189, 248, 0.16)', TCOL.cyan, 2.4, 0);
        ppoly([A, H, C], 'rgba(244, 114, 182, 0.16)', TCOL.pink, 2.4, 1);
        pline(A, B, TCOL.cyan, 3.8, [], false, 2);
        pline(A, C, TCOL.green, 3.8, [], false, 2);
        pline(B, C, TCOL.gold, 4.0, [], false, 2);
        pline(A, H, TCOL.white, 2.6, [5, 4]);

        pright(A, B, C, 14, TCOL.gold);
        pright(H, A, B, 12, TCOL.cyan);
        pright(H, A, C, 12, TCOL.pink);

        pangle(B, A, C, TCOL.pink, 28, 1, 'y(=∠B)');
        pangle(C, A, B, TCOL.cyan, 30, 2, 'x(=∠C)');
        pangle(A, B, H, TCOL.cyan, 28, 2, 'x');
        pangle(A, H, C, TCOL.pink, 32, 1, 'y');

        pdot(A, 'A(90°)', TCOL.gold, null, { x: -10, y: -14 });
        pdot(B, 'B', TCOL.pink, null, { x: -18, y: 16 });
        pdot(C, 'C', TCOL.cyan, null, { x: 10, y: 16 });
        pdot(H, 'H', TCOL.white, null, { x: -6, y: 22 });

        ptag((A.x + B.x) / 2 - 32, (A.y + B.y) / 2 - 6, 'AB = 6', TCOL.cyan, 14);
        ptag((A.x + C.x) / 2 + 32, (A.y + C.y) / 2 - 6, 'AC = 8', TCOL.green, 14);
        ptag(cx, B.y + 38, '빗변 BC = 10 (6 : 8 : 10 = 3 : 4 : 5)', TCOL.gold, 14);

        drawBottomTapeBanner(rect, '닮음 각 복제(x = ∠C, y = ∠B): 큰 △ABC(6,8,10)에서 바로 sin x = sin C = 6/10 = 3/5, cos x = 4/5!');
        return;
      }

      // defSCT, refAngleSwap, oneToOther (3-4-5 직각삼각형 회전 & 필기체 s, c, t 궤적)
      const rotAng = sub === 'refAngleSwap' ? t * (Math.PI / 2) : 0;
      const center = pt(cx, cy + 5 * s);
      const A0 = pt(cx - 115 * s, cy + 68 * s);
      const C0 = pt(cx + 95 * s, cy + 68 * s);
      const B0 = pt(cx + 95 * s, cy - 88 * s);

      const A = rot(A0, center, rotAng);
      const B = rot(B0, center, rotAng);
      const C = rot(C0, center, rotAng);

      ppoly([A, B, C], 'rgba(56, 189, 248, 0.16)', TCOL.white, 3.0);
      pline(A, C, TCOL.cyan, 4.4, [], false, 1); // 밑변 4
      pline(C, B, TCOL.pink, 4.4, [], false, 0); // 높이 3
      pline(A, B, TCOL.gold, 4.6, [], true, 2);  // 빗변 5
      pright(C, A, B, 14, TCOL.gold);

      const isBRef = sub === 'refAngleSwap' && t > 0.5;
      pangle(A, B, C, isBRef ? 'rgba(255,255,255,0.4)' : TCOL.gold, 34, 1, 'A');
      pangle(B, A, C, isBRef ? TCOL.gold : TCOL.pink, 32, 2, 'B(90°-A)');

      pdot(A, 'A', TCOL.gold, center);
      pdot(B, 'B', TCOL.pink, center);
      pdot(C, 'C(90°)', TCOL.cyan, center);

      const mAC = mid(A, C), mBC = mid(B, C), mAB = mid(A, B);
      ptag(mAC.x, mAC.y + 22, isBRef ? '∠B의 대변(높이) = 4!' : '밑변 b = 4', TCOL.cyan, 14);
      ptag(mBC.x + 48, mBC.y, isBRef ? '∠B의 밑변 = 3!' : '대변(높이 a) = 3', TCOL.pink, 14);
      ptag(mAB.x - 28, mAB.y - 14, '빗변 c = 5', TCOL.gold, 14.5);

      drawMiniOverlayBox(rect, isBRef ? '🔄 기준각 ∠B(90°-A)일 때' : '✍️ 기준각 ∠A일 때 삼각비', [
        { txt: isBRef ? 'sin B = AC/AB = 4/5 (= cos A)' : 'sin A = BC/AB = 3/5 (높이/빗변)', col: '#f472b6' },
        { txt: isBRef ? 'cos B = BC/AB = 3/5 (= sin A)' : 'cos A = AC/AB = 4/5 (밑변/빗변)', col: '#38bdf8' },
        { txt: isBRef ? 'tan B = AC/BC = 4/3 (= 1/tan A)' : 'tan A = BC/AC = 3/4 (높이/밑변)', col: '#fbbf24' }
      ]);

      drawBottomTapeBanner(
        rect,
        isBRef
          ? '기준각 ∠B(90°-A) 역전: 맞은편 변 AC(4)가 높이가 되어 sin B = 4/5 (= cos A), cos B = 3/5 (= sin A)!'
          : '∠A 기준 삼각비: sin A = 대변/빗변(3/5) · cos A = 밑변/빗변(4/5) · tan A = 대변/밑변(3/4)',
        [
          { text: 'sin A = 3/5 (0.60)', weight: 0.3, color: TCOL.pink },
          { text: 'cos A = 4/5 (0.80)', weight: 0.4, color: TCOL.cyan },
          { text: 'tan A = 3/4 (0.75)', weight: 0.3, color: TCOL.gold }
        ]
      );
    }

    // =========================================================================
    // [탭 2 렌더링] 특수각(30°·45°·60°)의 탄생 & 기울기 & tan 15°
    // =========================================================================
    function renderMode2SpecialAngles(rect, cx, cy) {
      const sub = state.subType[2];
      const s = state.scale * 1.04;
      const t = state.fold;

      if (sub === 'cut45') {
        const L = 165 * s;
        const A = pt(cx - L / 2, cy + L / 2), B = pt(cx + L / 2, cy + L / 2);

        ppoly([A, B, C], 'rgba(56, 189, 248, 0.26)', TCOL.cyan, 3.4, 0);

        pright(B, A, C, 14, TCOL.gold);

        ptick(A, D, 1, TCOL.cyan); ptick(D, C, 1, TCOL.cyan);
        pright(D, A, C, 14, 'rgba(251,191,36,0.55)');

        pdot(A, 'A(45°)', TCOL.pink, null, { x: -24, y: 18 });
        pdot(B, 'B(90°)', TCOL.gold, null, { x: 10, y: 18 });
        pdot(C, 'C(45°)', TCOL.pink, null, { x: 10, y: -8 });
        pdot(D, 'D(정사각형)', 'rgba(255,255,255,0.5)', null, { x: -24, y: -8 });

        ptag((A.x + B.x) / 2, B.y + 22, '밑변 비 = ①', TCOL.cyan, 14);
        ptag(B.x + 42, (B.y + C.y) / 2, '높이 비 = ①', TCOL.cyan, 14);
        ptag((A.x + C.x) / 2 - 22, (A.y + C.y) / 2 - 12, '빗변(대각선) 비 = √2', TCOL.gold, 14.5);

        drawBottomTapeBanner(rect, '정사각형을 대각선으로 반 자른 45° 직각이등변삼각형 (1 : 1 : √2) ➔ sin 45° = cos 45° = √2/2, tan 45° = 1');
        return;
      }

      if (sub === 'chainSpecial') {
        const H = pt(cx - 25 * s, cy + 68 * s);
        const A = pt(H.x, cy - 62 * s); // AH = 130 (6cm)
        const B = pt(H.x - 130 * s, cy + 68 * s); // 45° -> BH = 130 (6cm)
        const C = pt(H.x + 130 * Math.sqrt(3) * s, cy + 68 * s); // 30° -> CH = 6√3

        ppoly([A, B, H], 'rgba(56, 189, 248, 0.24)', TCOL.cyan, 3.2, 0);
        ppoly([A, H, C], 'rgba(251, 191, 36, 0.22)', TCOL.gold, 3.2, 2);
        pline(A, H, TCOL.green, 4.4, [], true, 1);

        pright(H, A, B, 12, TCOL.cyan);
        pright(H, A, C, 12, TCOL.gold);
        pangle(B, A, H, TCOL.cyan, 28, 1, '45°');
        pangle(C, A, H, TCOL.gold, 34, 1, '30°');
        // [표시 보강] 꼭대기 A의 두 각(∠BAH=45°는 ∠B와 같은 청색 호, ∠HAC=60°는 다른 색 두 겹 호)과 AH=BH 눈금
        pmark(A, B, H, TCOL.cyan, 30, 1, '45°', { dx: -8 });
        pmark(A, H, C, TCOL.pink, 26, 2, '60°', { dx: 10 });
        ptick(A, H, 1, TCOL.cyan); ptick(B, H, 1, TCOL.cyan);

        pdot(A, 'A', TCOL.white, null, { x: -8, y: -14 });
        pdot(B, 'B(45°)', TCOL.cyan, null, { x: -24, y: 18 });
        pdot(C, 'C(30°)', TCOL.gold, null, { x: 10, y: 18 });
        pdot(H, 'H(공통수선)', TCOL.green, null, { x: -18, y: 22 });

        ptag((A.x + B.x) / 2 - 28, (A.y + B.y) / 2 - 8, 'AB = 6√2', TCOL.cyan, 13.5);
        ptag(H.x - 32, (A.y + H.y) / 2, 'AH = 6', TCOL.green, 14);
        ptag((B.x + H.x) / 2, B.y + 22, 'BH = 6', TCOL.cyan, 13.5);
        ptag((H.x + C.x) / 2, C.y + 22, 'CH = 6√3', TCOL.gold, 13.5);
        ptag((A.x + C.x) / 2 + 28, (A.y + C.y) / 2 - 8, 'AC = 12 (2배!)', TCOL.gold, 14);

        drawBottomTapeBanner(rect, '징검다리 특수각 연쇄: 왼쪽 45°(1:1:√2)에서 공통변 AH=6 구하기 ➔ 오른쪽 30°(1:√3:2)에서 AC=12, CH=6√3!');
        return;
      }

      if (sub === 'lineSlope') {
        const O = pt(cx + 35 * s, cy + 55 * s);
        pline(pt(cx - 210 * s, O.y), pt(cx + 185 * s, O.y), 'rgba(255,255,255,0.6)', 2.2);
        pline(pt(O.x, cy - 150 * s), pt(O.x, cy + 120 * s), 'rgba(255,255,255,0.6)', 2.2);

        const A = pt(O.x - 165 * s, O.y);
        const B = pt(O.x, O.y - (165 / Math.sqrt(3)) * s);
        const H = pt(A.x + 165 * 0.75 * s, A.y - (165 * Math.sqrt(3) * 0.25) * s);

        ppoly([O, A, B], 'rgba(56, 189, 248, 0.22)', TCOL.cyan, 3.0, 0);
        pline(pt(A.x - 35 * s, A.y + 20 * s), pt(B.x + 65 * s, B.y - 37.5 * s), TCOL.gold, 3.8, [], true, 1);
        pline(O, H, TCOL.pink, 3.2, [5, 4], true, 2);

        pright(O, B, A, 13, TCOL.cyan);
        pright(H, O, B, 11, TCOL.pink);
        pangle(A, B, O, TCOL.gold, 34, 1, 'θ=30°');

        pdot(O, 'O(0,0)', TCOL.white, null, { x: 10, y: 18 });
        pdot(A, 'A(-2√3, 0)', TCOL.cyan, null, { x: -35, y: 22 });
        pdot(B, 'B(0, 2)', TCOL.gold, null, { x: 12, y: 4 });
        pdot(H, 'H(수선의 발)', TCOL.pink, null, { x: -25, y: -12 });

        ptag((A.x + O.x) / 2, O.y + 22, 'x증가량 OA = 2√3', TCOL.cyan);
        ptag(O.x + 48, (O.y + B.y) / 2, 'y증가량 OB = 2', TCOL.gold);

        drawBottomTapeBanner(rect, '일차함수 직선의 기울기 = (y증가량 OB) / (x증가량 OA) = tan θ = tan 30° = √3/3!');
        return;
      }

      if (sub === 'tan15Iso') {
        const C = pt(cx + 155 * s, cy + 68 * s);
        const u = 68 * s;
        const A = pt(C.x, C.y - u); // 높이 AC = 1
        const D = pt(C.x - Math.sqrt(3) * u, C.y); // DC = √3, AD = 2
        const B = pt(D.x - 2 * u, C.y); // BD = AD = 2

        ppoly([A, D, C], 'rgba(56, 189, 248, 0.26)', TCOL.cyan, 3.2, 0);
        ppoly([A, B, D], 'rgba(244, 114, 182, 0.24)', TCOL.pink, 3.2, 1);
        pline(A, D, TCOL.gold, 3.8, [], true, 1);

        pright(C, A, D, 13, TCOL.cyan);
        pangle(D, A, C, TCOL.cyan, 28, 1, '30°(외각)');
        pangle(B, A, D, TCOL.pink, 36, 1, '15°');
        pangle(A, B, D, TCOL.pink, 32, 1, '15°');
        ptick(B, D, 2, TCOL.gold); ptick(A, D, 2, TCOL.gold);

        pdot(A, 'A', TCOL.gold, null, { x: 10, y: -8 });
        pdot(C, 'C(90°)', TCOL.cyan, null, { x: 10, y: 18 });
        pdot(D, 'D(30°)', TCOL.gold, null, { x: -10, y: 22 });
        pdot(B, 'B(15°!)', TCOL.pink, null, { x: -24, y: 18 });

        ptag(C.x + 34, (A.y + C.y) / 2, '높이 = 1', TCOL.cyan, 13.5);
        ptag((D.x + C.x) / 2, C.y + 22, 'DC = √3', TCOL.cyan, 13.5);
        ptag((B.x + D.x) / 2, B.y + 22, 'BD = AD = 2', TCOL.pink, 13.5);
        ptag((A.x + D.x) / 2 - 12, (A.y + D.y) / 2 - 10, 'AD = 2', TCOL.gold, 13.5);

        drawBottomTapeBanner(rect, '15° 특수비 유도: 전체 밑변 BC = 2 + √3, 높이 AC = 1  ➔  tan 15° = 1 / (2+√3) = 2 - √3!', [
          { text: '이등변 연장 BD = 2', weight: 2 / 3.732, color: TCOL.pink },
          { text: '30° 밑변 DC = √3', weight: 1.732 / 3.732, color: TCOL.cyan }
        ]);
        return;
      }

      // cut3060 기본: 정삼각형(한 변 2)을 수선으로 반 자르기 (1 : √3 : 2)
      const h = 175 * s;
      const halfBase = (h / Math.sqrt(3));
      const A = pt(cx, cy - h / 2 - 10 * s);
      const B = pt(cx - halfBase, cy + h / 2 - 10 * s);
      const C = pt(cx + halfBase, cy + h / 2 - 10 * s);
      const M = mid(B, C);

      const fadeAlpha = Math.max(0.08, 0.28 * (1 - t));
      ppoly([A, M, C], `rgba(148, 163, 184, ${fadeAlpha})`, 'rgba(148, 163, 184, 0.4)', 1.8);
      ppoly([A, B, M], 'rgba(56, 189, 248, 0.28)', TCOL.cyan, 3.4);
      pline(B, M, TCOL.cyan, 4.4, [], false, 0);
      pline(A, M, TCOL.green, 4.4, [], true, 1);
      pline(A, B, TCOL.gold, 4.6, [], true, 2);

      pright(M, A, B, 14, TCOL.gold);
      pangle(B, A, M, TCOL.gold, 30, 1, '60°');
      pmark(A, B, M, TCOL.pink, 34, 1, '30°', { dx: -10 });
      // [표시 보강] 반쪽 삼각형의 같은 각(60°=60°, 30°=30°)은 같은 색·같은 호로, 같은 길이(BM=MC)는 같은 눈금으로
      pmark(C, A, M, TCOL.gold, 30, 1, '60°');
      pmark(A, M, C, TCOL.pink, 34, 1, '30°', { dx: 10 });
      pright(M, A, C, 14, 'rgba(251,191,36,0.55)');
      ptick(B, M, 1, TCOL.cyan); ptick(M, C, 1, TCOL.cyan);

      pdot(A, 'A(30°)', TCOL.pink, null, { x: -15, y: -14 });
      pdot(B, 'B(60°)', TCOL.gold, null, { x: -24, y: 18 });
      pdot(M, 'M(90° 수선의 발)', TCOL.green, null, { x: -10, y: 22 });
      pdot(C, 'C(정삼각형)', 'rgba(255,255,255,0.5)', null, { x: 10, y: 18 });

      ptag((B.x + M.x) / 2, M.y + 22, '30° 맞은편 = ①', TCOL.cyan, 14);
      ptag(M.x + 54, (A.y + M.y) / 2, '60° 맞은편(높이) = √3', TCOL.green, 14);
      ptag((A.x + B.x) / 2 - 38, (A.y + B.y) / 2 - 8, '90° 맞은편(빗변) = ②', TCOL.gold, 14.5);

      drawMiniOverlayBox(rect, '📋 특수각(30°·45°·60°) 삼각비 표', [
        { txt: 'sin : 1/2 (30°) · √2/2 (45°) · √3/2 (60°)', col: '#f472b6' },
        { txt: 'cos : √3/2 (30°) · √2/2 (45°) · 1/2 (60°)', col: '#38bdf8' },
        { txt: 'tan : √3/3 (30°) ·  1   (45°) ·  √3  (60°)', col: '#fbbf24' }
      ]);

      drawBottomTapeBanner(rect, '정삼각형(한 변 2)을 반 자른 30°-60°-90° 직각삼각형 비: ①(30° 대변) : √3(60° 대변) : ②(빗변)');
    }

    // =========================================================================
    // [탭 3 렌더링] 반지름 1인 사분원(Unit Quarter Circle) & 대소 비교
    // =========================================================================
    function renderMode3UnitCircle(rect, cx, cy) {
      const s = state.scale * 1.02;
      const R = 175 * s;
      const O = pt(cx - 85 * s, cy + 75 * s);
      const C = pt(O.x + R, O.y);
      const topY = pt(O.x, O.y - R);

      // 좌표축 및 반지름 1인 사분원 호
      pline(pt(O.x - 25 * s, O.y), pt(O.x + R + 55 * s, O.y), 'rgba(255,255,255,0.65)', 2.2);
      pline(pt(O.x, O.y + 25 * s), pt(O.x, O.y - R - 55 * s), 'rgba(255,255,255,0.65)', 2.2);

      // [2.0] 원본의 ctx.arc 블록 → 호환 함수 parc (같은 호, 같은 색·굵기)
      parc(O, R, -Math.PI / 2, 0, 'rgba(255,255,255,0.45)', 2.4);

      // 45° 대소 역전 기준선 (점선)
      pline(O, pt(O.x + R * 0.9, O.y - R * 0.9), 'rgba(251, 191, 36, 0.3)', 1.6, [5, 5]);
      ptag(O.x + R * 0.68, O.y - R * 0.68 - 8, '45° 경계선 (sin=cos)', 'rgba(251,191,36,0.75)', 11.5);

      const deg = Math.max(5, Math.min(82, state.angleDeg));
      const rad = (deg * Math.PI) / 180;
      const A = pt(O.x + R * Math.cos(rad), O.y - R * Math.sin(rad));
      const B = pt(A.x, O.y);
      const D = pt(C.x, O.y - R * Math.tan(rad));

      // 바깥쪽 큰 직각삼각형 △OCD (tan x = CD)
      ppoly([O, C, D], 'rgba(251, 191, 36, 0.12)', 'rgba(251, 191, 36, 0.4)', 1.8, 2);
      // 안쪽 작은 직각삼각형 △OAB (sin x = AB, cos x = OB)
      ppoly([O, B, A], 'rgba(56, 189, 248, 0.18)', 'rgba(255,255,255,0.7)', 2.2);

      pright(B, A, O, 11, TCOL.pink);
      pright(C, D, O, 12, TCOL.gold);
      pangle(O, C, A, TCOL.gold, 34, 1, `x=${deg}°`);
      // [표시 보강] 반지름 OA = OC = 1 같은 길이 눈금(사분원의 반지름)
      ptick(O, A, 1, TCOL.white); ptick(O, C, 1, TCOL.white);

      // 3대 핵심 선분 강조!
      pline(O, B, TCOL.cyan, 5.0, [], true, 1); // cos x = OB
      pline(A, B, TCOL.pink, 5.0, [], true, 0); // sin x = AB
      pline(C, D, TCOL.gold, 5.0, [], true, 2); // tan x = CD
      pline(O, D, 'rgba(255,255,255,0.55)', 2.0, [4, 4]);

      pdot(O, 'O(0,0)', TCOL.white, null, { x: -25, y: 18 });
      pdot(B, 'B', TCOL.cyan, null, { x: -6, y: 20 });
      pdot(C, 'C(1, 0)', TCOL.white, null, { x: -10, y: 20 });
      pdot(topY, '(0, 1)', TCOL.white, null, { x: -38, y: 4 });
      pdot(A, 'A(드래그!)', TCOL.pink, null, { x: -32, y: -12 });
      if (D.y > cy - 220 * s) pdot(D, 'D', TCOL.gold, null, { x: 10, y: 4 });

      const sVal = Math.sin(rad).toFixed(3), cVal = Math.cos(rad).toFixed(3), tVal = Math.tan(rad).toFixed(3);
      ptag((O.x + B.x) / 2, B.y + 34, `cos ${deg}° = OB = ${cVal}`, TCOL.cyan, 13);
      ptag(B.x - 42, (A.y + B.y) / 2, `sin = AB (${sVal})`, TCOL.pink, 12.5);
      ptag(C.x + 56, Math.max(cy - 140 * s, (C.y + D.y) / 2), `tan = CD (${tVal})`, TCOL.gold, 13);

      drawMiniOverlayBox(rect, `📊 x = ${deg}° 실시간 대소 비교`, [
        { txt: `🩷 sin ${deg}° = AB = ${sVal}`, col: '#f472b6' },
        { txt: `🟦 cos ${deg}° = OB = ${cVal}`, col: '#38bdf8' },
        { txt: `🟨 tan ${deg}° = CD = ${tVal}`, col: '#fbbf24' },
        { txt: deg < 45 ? '판정: sin x < cos x (0°~45°)' : deg === 45 ? '판정: sin 45° = cos 45° < tan 45°(1)' : '판정: cos x < sin x < 1 < tan x', col: '#34d399' }
      ]);

      const tot = parseFloat(sVal) + parseFloat(cVal) + Math.min(2.0, parseFloat(tVal));
      drawBottomTapeBanner(rect, `사분원 선분 길이 비교 (x = ${deg}°): sin x = AB(${sVal}) · cos x = OB(${cVal}) · tan x = CD(${tVal})`, [
        { text: `sin = ${sVal}`, weight: parseFloat(sVal) / tot, color: TCOL.pink },
        { text: `cos = ${cVal}`, weight: parseFloat(cVal) / tot, color: TCOL.cyan },
        { text: `tan = ${tVal}`, weight: Math.min(2.0, parseFloat(tVal)) / tot, color: TCOL.gold }
      ]);
    }

    // =========================================================================
    // [탭 4 렌더링] 직각삼각형의 변의 길이 & 시계추(그네) & 나무 측량
    // =========================================================================
    function renderMode4RightLengths(rect, cx, cy) {
      const sub = state.subType[4];
      const s = state.scale * 1.04;
      const deg = state.angleDeg > 80 ? 60 : state.angleDeg;
      const rad = (deg * Math.PI) / 180;
      const L = state.baseLen;

      if (sub === 'pendulumSwing') {
        const R = 175 * s;
        const O = pt(cx - 20 * s, cy - 115 * s);
        const B = pt(O.x, O.y + R);
        const curRad = rad * (state.fold === 0 ? 1 : state.fold);
        const A = pt(O.x + R * Math.sin(curRad), O.y + R * Math.cos(curRad));
        const H = pt(O.x, A.y);

        // 추 회전 원호
        // [2.0] 원본의 ctx.arc 블록 → 호환 함수 parc (같은 호, 같은 점선)
        parc(O, R, Math.PI / 2 - rad - 0.1, Math.PI / 2 + 0.1, 'rgba(255,255,255,0.3)', 1.6, [5, 4]);

        ppoly([O, H, A], 'rgba(56, 189, 248, 0.22)', TCOL.cyan, 2.8, 1);
        pline(O, H, TCOL.cyan, 4.6, [], true, 1); // OH = L cos θ
        pline(H, B, TCOL.gold, 5.2, [], true, 2); // BH = L - L cos θ (올라간 높이 h!)
        pline(O, A, TCOL.white, 3.6, [], false, 0);
        pline(A, H, TCOL.pink, 2.6, [5, 4]);
        pline(B, pt(A.x, B.y), 'rgba(251,191,36,0.5)', 2.0, [4, 4]);

        pright(H, O, A, 12, TCOL.cyan);
        pangle(O, B, A, TCOL.gold, 36, 1, `${deg}°`);

        pdot(O, 'O(매달린 점)', TCOL.white, null, { x: -30, y: -12 });
        pdot(B, 'B(최하점)', TCOL.gold, null, { x: -25, y: 20 });
        pdot(H, 'H(수선의 발)', TCOL.cyan, null, { x: -75, y: 4 });
        pdot(A, `A(줄 길이 L=${L})`, TCOL.pink, null, { x: 14, y: 4 });

        const ohVal = (L * Math.cos(rad)).toFixed(2);
        const hVal = (L * (1 - Math.cos(rad))).toFixed(2);
        ptag(O.x - 62, (O.y + H.y) / 2, `OH = ${L} cos ${deg}° (${ohVal})`, TCOL.cyan, 13);
        ptag(O.x - 68, (H.y + B.y) / 2 + 6, `올라간 높이 h = ${hVal}`, TCOL.gold, 13.5);
        ptag((O.x + A.x) / 2 + 35, (O.y + A.y) / 2 - 6, `빗변 L = ${L}`, TCOL.white, 13.5);

        drawBottomTapeBanner(rect, `시계추·그네 공식: 전체 줄 길이 L(${L}) = 위쪽 수선 OH(L cos ${deg}°=${ohVal}) + 올라간 높이 h(${hVal})!`, [
          { text: `위쪽 OH = L cos θ (${ohVal})`, weight: Math.cos(rad), color: TCOL.cyan },
          { text: `올라간 높이 h = L(1-cos θ) (${hVal})`, weight: Math.max(0.12, 1 - Math.cos(rad)), color: TCOL.gold }
        ]);
        return;
      }

      if (sub === 'treeEyeHeight') {
        const A = pt(cx - 125 * s, cy + 35 * s);
        const C = pt(cx + 95 * s, cy + 35 * s);
        const B = pt(C.x, C.y - 125 * s);
        const E = pt(A.x, A.y + 48 * s), D = pt(C.x, C.y + 48 * s);

        ppoly([A, E, D, C], 'rgba(251, 191, 36, 0.18)', TCOL.gold, 2.4, 1);
        ppoly([A, C, B], 'rgba(244, 114, 182, 0.22)', TCOL.pink, 3.2, 0);
        pline(B, C, TCOL.pink, 4.6, [], true, 0);
        pline(C, D, TCOL.gold, 4.6, [], true, 1);
        pright(C, B, A, 13, TCOL.pink);
        pangle(A, B, C, TCOL.cyan, 34, 1, `${deg}°`);
        // [표시 보강] 눈높이 AE = CD(= h₀) 같은 눈금, 지면과의 직각
        ptick(A, E, 1, TCOL.gold); ptick(C, D, 1, TCOL.gold);
        pright(D, C, E, 11, TCOL.gold); pright(E, A, D, 11, TCOL.gold);

        pdot(A, 'A(눈 위치)', TCOL.cyan, null, { x: -65, y: -6 });
        pdot(B, 'B(나무 꼭대기)', TCOL.pink, null, { x: 12, y: -6 });
        pdot(C, 'C(90°)', TCOL.white, null, { x: 12, y: 4 });
        pdot(D, 'D(지면)', TCOL.gold, null, { x: 12, y: 16 });

        const topH = (L * Math.tan(rad)).toFixed(1);
        ptag((A.x + C.x) / 2, C.y - 10, `나무까지 거리 b = ${L} m`, TCOL.cyan, 13.5);
        ptag(C.x + 65, (B.y + C.y) / 2, `BC = ${L} tan ${deg}° (${topH}m)`, TCOL.pink, 13.5);
        ptag(C.x + 58, (C.y + D.y) / 2 + 4, `눈높이 h₀ = 1.6m`, TCOL.gold, 13);

        drawBottomTapeBanner(rect, `나무 전체 높이 BD = 위쪽 직각삼각형 높이(${L} tan ${deg}° = ${topH}m) + 관측자 눈높이(1.6m) = ${(parseFloat(topH)+1.6).toFixed(1)}m!`);
        return;
      }

      // findFromHyp & findFromBase & brokenTreeCone
      const isFromBase = sub === 'findFromBase' || sub === 'brokenTreeCone';
      const A = pt(cx - 125 * s, cy + 68 * s), C = pt(cx + 105 * s, cy + 68 * s), B = pt(C.x, cy - 82 * s);
      ppoly([A, B, C], 'rgba(56, 189, 248, 0.18)', TCOL.white, 3.0);
      pline(A, C, TCOL.cyan, 4.4, [], !isFromBase, 1);
      pline(B, C, TCOL.pink, 4.4, [], true, 0);
      pline(A, B, TCOL.gold, 4.4, [], isFromBase, 1);
      pright(C, B, A, 14, TCOL.gold);
      pangle(A, B, C, TCOL.gold, 34, 1, `A=${deg}°`);

      pdot(A, `A(${deg}°)`, TCOL.gold, null, { x: -24, y: 18 });
      pdot(B, 'B', TCOL.pink, null, { x: 10, y: -8 });
      pdot(C, 'C(90°)', TCOL.cyan, null, { x: 10, y: 18 });

      ptag((A.x + C.x) / 2, C.y + 24, isFromBase ? `주어진 밑변 b = ${L}` : `밑변 b = c cos A = ${L} cos ${deg}°`, TCOL.cyan, 14);
      ptag(C.x + 68, (B.y + C.y) / 2, isFromBase ? `높이 a = b tan A = ${L} tan ${deg}°` : `높이 a = c sin A = ${L} sin ${deg}°`, TCOL.pink, 14);
      ptag((A.x + B.x) / 2 - 38, (A.y + B.y) / 2 - 12, isFromBase ? `빗변 c = b / cos A = ${L} / cos ${deg}°` : `주어진 빗변 c = ${L}`, TCOL.gold, 14);

      drawBottomTapeBanner(rect, isFromBase ? `밑변 b(${L})와 각 A(${deg}°) 기준: 높이 a = b tan A · 빗변 c = b / cos A` : `빗변 c(${L})와 각 A(${deg}°) 기준: 높이 a = c sin A · 밑변 b = c cos A`);
    }

    // =========================================================================
    // [탭 5 렌더링] 일반삼각형의 변의 길이 (특수각 보존의 법칙!)
    // =========================================================================
    function renderMode5GeneralLengths(rect, cx, cy) {
      const sub = state.subType[5];
      const s = state.scale * 1.04;

      if (sub === 'sasObtuseLen') {
        const B = pt(cx - 25 * s, cy + 68 * s), C = pt(cx + 135 * s, cy + 68 * s);
        const H = pt(cx - 115 * s, cy + 68 * s);
        const A = pt(H.x, cy - 82 * s);

        ppoly([A, B, H], 'rgba(56, 189, 248, 0.24)', TCOL.cyan, 2.8, 0);
        ppoly([A, B, C], 'rgba(251, 191, 36, 0.20)', TCOL.gold, 3.4, 2);
        pline(A, H, TCOL.cyan, 3.8, [5, 4], true, 0);
        pline(B, H, TCOL.cyan, 3.8, [5, 4], true, 0);
        pline(A, C, TCOL.gold, 4.4, [], true, 2);

        pright(H, A, C, 13, TCOL.cyan);
        pangle(B, A, C, TCOL.pink, 28, 1, '120°');
        pangle(B, A, H, TCOL.cyan, 30, 2, '60°(외각!)');

        pdot(A, 'A', TCOL.gold, null, { x: -12, y: -14 });
        pdot(B, 'B(120°)', TCOL.pink, null, { x: -15, y: 22 });
        pdot(C, 'C', TCOL.gold, null, { x: 10, y: 18 });
        pdot(H, 'H(연장선 수선의 발)', TCOL.cyan, null, { x: -45, y: 22 });

        ptag((A.x + B.x) / 2 + 18, (A.y + B.y) / 2, 'AB = 6', TCOL.white, 13.5);
        ptag(H.x - 42, (A.y + H.y) / 2, 'AH = 3√3', TCOL.cyan, 13.5);
        ptag((H.x + B.x) / 2, B.y - 10, 'BH = 3', TCOL.cyan, 13);
        ptag((B.x + C.x) / 2, C.y - 10, 'BC = 4', TCOL.green, 13.5);
        ptag((A.x + C.x) / 2 + 32, (A.y + C.y) / 2 - 10, 'AC = √(7²+(3√3)²) = 2√19', TCOL.gold, 14);

        drawBottomTapeBanner(rect, '둔각(120°) 변의 길이: 바깥 연장선 외각 60°에서 BH=3, AH=3√3 ➔ 전체 밑변 CH=3+4=7 ➔ AC = 2√19!', [
          { text: '바깥 BH = 3', weight: 3 / 7, color: TCOL.cyan },
          { text: '원래 밑변 BC = 4 (전체 CH = 7)', weight: 4 / 7, color: TCOL.green }
        ]);
        return;
      }

      if (sub === 'asaSplit75' || sub === 'trapDontSplit60') {
        const H = pt(cx + 15 * s, cy + 68 * s);
        const A = pt(H.x, cy - 72 * s);
        const B = pt(H.x - 140 * s, cy + 68 * s);
        const C = pt(H.x + 82 * s, cy + 68 * s);

        ppoly([A, B, H], 'rgba(244, 114, 182, 0.22)', TCOL.pink, 3.2, 2);
        ppoly([A, H, C], 'rgba(56, 189, 248, 0.22)', TCOL.cyan, 3.2, 1);
        pline(A, H, TCOL.gold, 4.2, [5, 4], true, 0);

        pright(H, A, B, 12, TCOL.gold);
        pangle(B, A, H, TCOL.pink, 30, 1, '45°');
        // [표시 보강] ∠C는 60°(원래 '30°'로 적혀 있었음) — ∠B=∠BAH=45°는 같은 분홍 호, ∠HAC=30°는 청색 두 겹 호, ∠C=60°는 녹색 호로 구분
        pmark(C, A, H, TCOL.green, 28, 1, '60°');
        pmark(A, B, H, TCOL.pink, 32, 1, '45°', { dx: -8 });
        pmark(A, H, C, TCOL.cyan, 36, 2, '30°', { dx: 10 });
        pright(H, A, C, 12, TCOL.gold);

        if (sub === 'trapDontSplit60') {
          const badH = projectOnLine(C, A, B);
          pline(C, badH, TCOL.red, 2.8, [4, 4]);
          // [표시 보강] 잘못 내린 수선과 AB의 직각 표시
          pright(badH, C, A, 11, TCOL.red);
          ptag((C.x + badH.x) / 2, (C.y + badH.y) / 2, '❌ 60°를 쪼개면 망함!', TCOL.red, 12.5);
        }

        pdot(A, 'A(75° = 45°+30°!)', TCOL.gold, null, { x: -45, y: -14 });
        pdot(B, 'B(45° 보존)', TCOL.pink, null, { x: -35, y: 20 });
        pdot(C, 'C(60° 보존)', TCOL.cyan, null, { x: 10, y: 20 });
        pdot(H, 'H(수선의 발)', TCOL.gold, null, { x: -15, y: 22 });

        ptag((A.x + C.x) / 2 + 28, (A.y + C.y) / 2, 'AC = 6', TCOL.cyan, 13.5);
        ptag(H.x - 36, (A.y + H.y) / 2 + 10, 'AH = 3√3', TCOL.gold, 13.5);
        ptag((A.x + B.x) / 2 - 32, (A.y + B.y) / 2, 'AB = 3√6', TCOL.pink, 14);

        drawBottomTapeBanner(rect, '특수각 보존 법칙: 45°와 60°는 살려두고 비특수각 꼭짓점 A(75°)에서 수선 AH를 내려 45°+30°로 쪼갠다!');
        return;
      }

      // sasAcuteLen 기본
      const B = pt(cx - 140 * s, cy + 68 * s), C = pt(cx + 140 * s, cy + 68 * s);
      const H = pt(cx - 45 * s, cy + 68 * s);
      const A = pt(H.x, cy - 82 * s);

      ppoly([A, B, H], 'rgba(56, 189, 248, 0.22)', TCOL.cyan, 3.0, 0);
      ppoly([A, H, C], 'rgba(251, 191, 36, 0.22)', TCOL.gold, 3.2, 2);
      pline(A, H, TCOL.cyan, 4.0, [5, 4], true, 0);
      pline(H, C, TCOL.green, 4.2, [], false, 1);
      pline(A, C, TCOL.gold, 4.4, [], true, 2);

      pright(H, A, C, 13, TCOL.gold);
      pangle(B, A, H, TCOL.cyan, 30, 1, '60°');
      // [표시 보강] 수선 AH 양쪽 직각, 꼭대기 쪼개진 각 ∠BAH=30°
      pright(H, A, B, 13, TCOL.gold);
      pmark(A, B, H, TCOL.pink, 30, 1, '30°');

      pdot(A, 'A', TCOL.gold, null, { x: -8, y: -14 });
      pdot(B, 'B(60°)', TCOL.cyan, null, { x: -24, y: 18 });
      pdot(C, 'C', TCOL.gold, null, { x: 10, y: 18 });
      pdot(H, 'H(수선의 발)', TCOL.cyan, null, { x: -20, y: 22 });

      ptag((A.x + B.x) / 2 - 26, (A.y + B.y) / 2, 'AB = 8', TCOL.cyan, 13.5);
      ptag(H.x - 36, (A.y + H.y) / 2 + 8, 'AH = 4√3', TCOL.cyan, 13.5);
      ptag((B.x + H.x) / 2, B.y - 10, 'BH = 4', TCOL.cyan, 13);
      ptag((H.x + C.x) / 2, C.y - 10, 'CH = 10 - 4 = 6', TCOL.green, 13.5);
      ptag((A.x + C.x) / 2 + 34, (A.y + C.y) / 2 - 6, 'AC = √((4√3)²+6²) = 2√21', TCOL.gold, 14);

      drawBottomTapeBanner(rect, '두 변(8, 10)과 끼인각(60°): 수선 AH 내리기 ➔ BH=4, AH=4√3, 남은 CH=10-4=6 ➔ 피타고라스 AC = 2√21!', [
        { text: '왼쪽 BH = 8 cos 60° = 4', weight: 0.4, color: TCOL.cyan },
        { text: '남은 오른쪽 CH = 10 - 4 = 6', weight: 0.6, color: TCOL.green }
      ]);
    }

    // =========================================================================
    // [탭 6 렌더링] 삼각형의 높이 h (예각 tan x + tan y vs 둔각 tan x - tan y)
    // =========================================================================
    function renderMode6TriangleHeight(rect, cx, cy) {
      const sub = state.subType[6];
      const s = state.scale * 1.04;
      const isObtuse = sub === 'heightObtuse' || sub === 'std3060Mountain';

      if (!isObtuse) {
        const H = pt(cx + 15 * s, cy + 68 * s);
        const A = pt(H.x, cy - 75 * s);
        const B = pt(H.x - 143 * s, cy + 68 * s);
        const C = pt(H.x + 83 * s, cy + 68 * s);

        ppoly([A, B, H], 'rgba(56, 189, 248, 0.22)', TCOL.cyan, 3.0, 0);
        ppoly([A, H, C], 'rgba(244, 114, 182, 0.22)', TCOL.pink, 3.0, 1);
        pline(A, H, TCOL.gold, 4.6, [], true, 2);

        pright(H, A, B, 12, TCOL.gold);
        pright(H, A, C, 12, TCOL.gold);
        pangle(B, A, H, TCOL.cyan, 28, 1, '45°');
        pangle(C, A, H, TCOL.pink, 26, 1, '60°');
        // [표시 보강] 윗각 x(왼쪽)·y(오른쪽)의 값 글자가 서로 겹치지 않게 양옆으로 비켜 적음
        pmark(A, B, H, TCOL.cyan, 32, 2, 'x=45°', { dx: -20 });
        pmark(A, H, C, TCOL.pink, 36, 2, 'y=30°', { dx: 22 });
        if (sub === 'std4560Height') { ptick(A, H, 1, TCOL.gold); ptick(B, H, 1, TCOL.gold); } // 45°이므로 BH = AH = h

        pdot(A, 'A(윗각 x, y!)', TCOL.gold, null, { x: -30, y: -14 });
        pdot(B, 'B(45°)', TCOL.cyan, null, { x: -24, y: 18 });
        pdot(C, 'C(60°)', TCOL.pink, null, { x: 10, y: 18 });
        pdot(H, 'H', TCOL.gold, null, { x: -6, y: 22 });

        ptag(H.x - 28, (A.y + H.y) / 2 + 8, '높이 = h', TCOL.gold, 14);
        ptag((B.x + H.x) / 2, B.y - 10, 'BH = h tan x (h)', TCOL.cyan, 13.5);
        ptag((H.x + C.x) / 2 + 8, C.y - 10, 'CH = h tan y', TCOL.pink, 13.5);

        drawMiniOverlayBox(rect, '⛰️ 예각 높이 h 3단계 유도', [
          { txt: '① 윗각 x = 90°-B, y = 90°-C', col: '#fef08a' },
          { txt: '② BH = h tan x, CH = h tan y', col: '#38bdf8' },
          { txt: '③ BH + CH = h(tan x + tan y) = a', col: '#f472b6' },
          { txt: '∴ h = a / (tan x + tan y)', col: '#34d399' }
        ]);

        drawBottomTapeBanner(rect, '예각삼각형 높이 공식: 전체 밑변 a = BH(h tan x) + CH(h tan y)  ➔  h = a / (tan x + tan y)', [
          { text: '왼쪽 BH = h tan x', weight: 0.63, color: TCOL.cyan },
          { text: '오른쪽 CH = h tan y', weight: 0.37, color: TCOL.pink }
        ]);
      } else {
        const H = pt(cx + 125 * s, cy + 68 * s);
        const A = pt(H.x, cy - 75 * s);
        const C = pt(H.x - 82 * s, cy + 68 * s);
        const B = pt(H.x - 246 * s, cy + 68 * s);

        ppoly([A, B, C], 'rgba(56, 189, 248, 0.24)', TCOL.cyan, 3.2, 0);
        ppoly([A, C, H], 'rgba(244, 114, 182, 0.22)', TCOL.pink, 2.8, 1);
        pline(A, H, TCOL.gold, 4.6, [], true, 2);

        pright(H, A, B, 13, TCOL.gold);
        pangle(B, A, C, TCOL.cyan, 32, 1, '30°');
        pangle(C, A, H, TCOL.pink, 28, 1, '60°');
        // [표시 보강] 윗각 x(전체, 청색 두 겹)·y(바깥, 분홍 두 겹) 글자가 겹치지 않게: x는 호 끝 왼쪽, y는 좁은 각 안쪽 아래
        const kk = Math.max(0.55, Math.min(1, Math.abs(BOARD.toS(H).y - BOARD.toS(A).y) / 330)); // 휴대폰처럼 그림이 작을 때 호·글자 간격도 함께 줄임
        pmark(A, B, H, TCOL.cyan, 46 * kk, 2, '전체 x=60°', { abs: true, dx: -78 * kk, dy: 26 * kk });
        pmark(A, C, H, TCOL.pink, 30 * kk, 2, 'y=30°', { abs: true, dx: -22 * kk, dy: 78 * kk });

        if (sub === 'std3060Mountain') {
          ptick(B, C, 2, TCOL.gold);
          ptick(A, C, 2, TCOL.gold);
          // 숨은 이등변: ∠BAC = ∠B = 30° (같은 청색 한 겹 호)
          pmark(A, B, C, TCOL.cyan, 62 * kk, 1, '30°', { abs: true, dx: -56 * kk, dy: 62 * kk });
        }

        pdot(A, 'A(산 정상)', TCOL.gold, null, { x: -20, y: -14 });
        pdot(B, 'B(30°)', TCOL.cyan, null, { x: -24, y: 18 });
        pdot(C, 'C(외각 60°)', TCOL.pink, null, { x: -25, y: 22 });
        pdot(H, 'H(수선의 발)', TCOL.gold, null, { x: 8, y: 18 });

        ptag(H.x + 36, (A.y + H.y) / 2, '높이 = h', TCOL.gold, 14);
        ptag((B.x + C.x) / 2, B.y - 10, 'BC = a (BH - CH)', TCOL.cyan, 13.5);
        ptag((C.x + H.x) / 2, C.y - 10, 'CH = h tan y', TCOL.pink, 13);

        drawMiniOverlayBox(rect, '🌋 둔각 높이 h 3단계 유도', [
          { txt: '① 큰 윗각 x=60°, 작은 윗각 y=30°', col: '#fef08a' },
          { txt: '② 전체 BH = h tan x, 바깥 CH = h tan y', col: '#38bdf8' },
          { txt: '③ BH - CH = h(tan x - tan y) = a', col: '#f472b6' },
          { txt: '∴ h = a / (tan x - tan y)', col: '#34d399' }
        ]);

        drawBottomTapeBanner(rect, '둔각삼각형 높이 공식: 밑변 a = 전체 BH(h tan x) - 바깥 CH(h tan y)  ➔  h = a / (tan x - tan y)', [
          { text: '구하려는 밑변 BC = a', weight: 0.67, color: TCOL.cyan },
          { text: '빼야 할 바깥 -CH (-h tan y)', weight: 0.33, color: TCOL.pink }
        ]);
      }
    }

    // =========================================================================
    // [탭 7 렌더링] 삼각형의 넓이 (½bc sin A) & 정다각형 & 각의 이등분선 길이
    // =========================================================================
    function renderMode7TriangleArea(rect, cx, cy) {
      const sub = state.subType[7];
      const s = state.scale * 1.04;

      if (sub === 'angleBisectLen') {
        const A = pt(cx - 10 * s, cy - 88 * s);
        const B = pt(cx - 145 * s, cy + 72 * s);
        const C = pt(cx + 115 * s, cy + 72 * s);
        const D = lerp(B, C, 0.6); // AB:AC = 6:4 내분점 D

        const sep = state.fold * 18 * s;
        ppoly([ pt(A.x - sep, A.y), pt(B.x - sep, B.y), pt(D.x - sep, D.y) ], 'rgba(56, 189, 248, 0.26)', TCOL.cyan, 3.2, 1);
        ppoly([ pt(A.x + sep, A.y), pt(D.x + sep, D.y), pt(C.x + sep, C.y) ], 'rgba(244, 114, 182, 0.26)', TCOL.pink, 3.2, 2);
        pline(A, D, TCOL.gold, 4.4, [], true, 0);

        // [표시 보강] 이등분된 두 각은 같은 값(30°=30°)이므로 같은 금색 호·같은 한 겹, 갈라진 삼각형(sep)을 따라 호도 이동. 전체 각 60°는 바깥 호
        const As = (k) => pt(A.x + k * sep, A.y), Bs = (k) => pt(B.x + k * sep, B.y), Ds = (k) => pt(D.x + k * sep, D.y), Cs = (k) => pt(C.x + k * sep, C.y);
        pmark(As(-1), Bs(-1), Ds(-1), TCOL.gold, 34, 1, '30°', { dx: -10 });
        pmark(As(1), Ds(1), Cs(1), TCOL.gold, 34, 1, '30°', { dx: 10 });
        if (state.fold < 0.1) pmark(A, B, C, 'rgba(255,255,255,0.75)', 62, 1, '60°', { gap: 12 });

        pdot(A, 'A(60° = 30°+30°)', TCOL.gold, null, { x: -42, y: -14 });
        pdot(B, 'B', TCOL.cyan, null, { x: -18, y: 18 });
        pdot(C, 'C', TCOL.pink, null, { x: 10, y: 18 });
        pdot(D, 'D(각이등분)', TCOL.gold, null, { x: -15, y: 22 });

        ptag((A.x + B.x) / 2 - 32, (A.y + B.y) / 2, 'c = 6', TCOL.cyan, 14);
        ptag((A.x + C.x) / 2 + 28, (A.y + C.y) / 2, 'b = 4', TCOL.pink, 14);
        ptag(A.x + 18, (A.y + D.y) / 2 + 8, 'AD = x', TCOL.gold, 14.5);

        drawBottomTapeBanner(rect, '내각 이등분선 길이 x: 전체 넓이(½·6·4·sin 60° = 6√3) = 왼쪽 S₁(1.5x) + 오른쪽 S₂(x) ➔ x = 12√3 / 5!', [
          { text: '왼쪽 △ABD 넓이 S₁ = ½·6·x·sin 30°', weight: 0.6, color: TCOL.cyan },
          { text: '오른쪽 △ACD 넓이 S₂ = ½·x·4·sin 30°', weight: 0.4, color: TCOL.pink }
        ]);
        return;
      }

      if (sub === 'regPolygonArea') {
        const n = 8, R = 125 * s;
        const O = pt(cx, cy - 5 * s);
        const verts = [];
        for (let i = 0; i < n; i++) {
          const a = (i * Math.PI * 2) / n - Math.PI / 8;
          verts.push(pt(O.x + R * Math.cos(a), O.y + R * Math.sin(a)));
        }
        for (let i = 0; i < n; i++) {
          const v1 = verts[i], v2 = verts[(i + 1) % n];
          ppoly([O, v1, v2], i === 0 ? 'rgba(251, 191, 36, 0.38)' : 'rgba(56, 189, 248, 0.16)', i === 0 ? TCOL.gold : TCOL.cyan, i === 0 ? 3.2 : 1.8, i === 0 ? 1 : 0);
        }
        pangle(O, verts[0], verts[1], TCOL.gold, 34, 1, '45°');
        // [표시 보강] 나머지 7개 중심각도 같은 45°(청색 한 겹 호), 두 반지름 OA = OB = R 같은 눈금
        for (let i = 1; i < n; i++) pmark(O, verts[i], verts[(i + 1) % n], TCOL.cyan, 34, 1, '45°', { size: 11.5 });
        ptick(O, verts[0], 2, TCOL.gold); ptick(O, verts[1], 2, TCOL.gold);
        pdot(O, 'O(중심)', TCOL.gold, null, { x: -20, y: -12 });
        ptag(O.x + R / 2 + 12, O.y - 18, 'R = 6', TCOL.gold, 13.5);
        drawBottomTapeBanner(rect, '정팔각형 넓이 = 중심각(360°÷8 = 45°)인 이등변삼각형(½ × 6 × 6 × sin 45°) × 8개 = 72√2!');
        return;
      }

      // [표시 보강] 정삼각형 장면: 원래는 일반 삼각형(a=10, c=8, B=60°)이 그려졌음 → 설명대로 한 변 a인 정삼각형(세 각 60° 같은 호, 세 변 같은 눈금, 높이=수직이등분선)
      if (sub === 'equilFormula') {
        const a = 240 * s, h = (a * Math.sqrt(3)) / 2, aL = state.baseLen;
        const B = pt(cx - a / 2, cy + 100 * s), C = pt(cx + a / 2, cy + 100 * s);
        const H = pt(cx, B.y), A = pt(cx, B.y - h);
        ppoly([A, B, C], 'rgba(52, 211, 153, 0.24)', TCOL.green, 3.4, 2);
        pline(B, C, TCOL.cyan, 4.4, [], false, 0);
        pline(A, H, TCOL.pink, 4.2, [5, 4], true, 1);
        pright(H, A, C, 13, TCOL.pink); pright(H, A, B, 13, TCOL.pink);
        pmark(A, B, C, TCOL.gold, 34, 1, '60°');
        pmark(B, A, C, TCOL.gold, 34, 1, '60°');
        pmark(C, B, A, TCOL.gold, 34, 1, '60°');
        ptick(A, B, 1, TCOL.cyan); ptick(A, C, 1, TCOL.cyan); ptick(B, C, 1, TCOL.cyan);
        ptick(B, H, 2, TCOL.pink); ptick(H, C, 2, TCOL.pink);

        pdot(A, 'A', TCOL.gold, null, { x: -8, y: -14 });
        pdot(B, 'B', TCOL.gold, null, { x: -18, y: 18 });
        pdot(C, 'C', TCOL.cyan, null, { x: 10, y: 18 });
        pdot(H, 'H(중점)', TCOL.pink, null, { x: -16, y: 22 });

        ptag((A.x + B.x) / 2 - 26, (A.y + B.y) / 2 - 4, `a = ${aL}`, TCOL.cyan, 14);
        ptag((A.x + C.x) / 2 + 26, (A.y + C.y) / 2 - 4, `a = ${aL}`, TCOL.cyan, 14);
        ptag((B.x + C.x) / 2, C.y + 40, `밑변 a = ${aL}`, TCOL.cyan, 14);
        ptag(H.x - 62, (A.y + H.y) / 2 + 34, 'h = (√3/2)a', TCOL.pink, 13.5);
        drawBottomTapeBanner(rect, `한 변이 a(${aL})인 정삼각형: 높이 h = a sin 60° = (√3/2)a, 넓이 S = ½ a² sin 60° = (√3/4)a²!`);
        return;
      }

      const isObt = sub === 'areaObtuse' || state.angleDeg > 90;
      if (isObt) {
        const B = pt(cx - 25 * s, cy + 68 * s), C = pt(cx + 145 * s, cy + 68 * s);
        const H = pt(cx - 110 * s, cy + 68 * s), A = pt(H.x, cy - 78 * s);
        ppoly([A, B, C], 'rgba(251, 191, 36, 0.26)', TCOL.gold, 3.4, 2);
        pline(B, C, TCOL.cyan, 4.4, [], false, 0);
        pline(A, H, TCOL.pink, 4.2, [5, 4], true, 1);
        pline(B, H, 'rgba(255,255,255,0.45)', 2.0, [4, 4]);
        pright(H, A, C, 12, TCOL.pink);
        pangle(B, A, C, TCOL.gold, 28, 1, '120°');
        pangle(B, A, H, TCOL.pink, 30, 2, '60°');

        pdot(A, 'A', TCOL.gold, null, { x: -10, y: -14 });
        pdot(B, 'B(120°)', TCOL.gold, null, { x: -15, y: 22 });
        pdot(C, 'C', TCOL.cyan, null, { x: 10, y: 18 });
        pdot(H, 'H', TCOL.pink, null, { x: -18, y: 22 });

        ptag((B.x + C.x) / 2, C.y + 22, '밑변 a = 10', TCOL.cyan, 14);
        ptag((A.x + B.x) / 2 + 18, (A.y + B.y) / 2, 'c = 8', TCOL.white, 13.5);
        ptag(H.x - 58, (A.y + H.y) / 2, '높이 h = 8 sin(180°-120°)', TCOL.pink, 13);
        drawBottomTapeBanner(rect, '둔각삼각형 넓이 S = ½ × a × (c sin(180°-B)) = ½ ac sin(180°-120°) = 20√3 cm²!');
      } else {
        const B = pt(cx - 140 * s, cy + 68 * s), C = pt(cx + 140 * s, cy + 68 * s);
        const H = pt(cx - 45 * s, cy + 68 * s), A = pt(H.x, cy - 82 * s);
        ppoly([A, B, C], 'rgba(52, 211, 153, 0.24)', TCOL.green, 3.4, 2);
        pline(B, C, TCOL.cyan, 4.4, [], false, 0);
        pline(A, H, TCOL.pink, 4.4, [5, 4], true, 1);
        pright(H, A, C, 13, TCOL.pink);
        pangle(B, A, C, TCOL.gold, 32, 1, 'B=60°');

        pdot(A, 'A', TCOL.gold, null, { x: -8, y: -14 });
        pdot(B, 'B(60°)', TCOL.gold, null, { x: -24, y: 18 });
        pdot(C, 'C', TCOL.cyan, null, { x: 10, y: 18 });
        pdot(H, 'H', TCOL.pink, null, { x: -6, y: 22 });

        ptag((B.x + C.x) / 2, C.y + 22, '밑변 a = 10', TCOL.cyan, 14);
        ptag((A.x + B.x) / 2 - 28, (A.y + B.y) / 2, 'c = 8', TCOL.white, 14);
        ptag(H.x + 54, (A.y + H.y) / 2, '높이 h = c sin B', TCOL.pink, 13.5);
        drawBottomTapeBanner(rect, '예각삼각형 넓이 S = ½ × 밑변(a) × 높이(c sin B) = ½ ac sin B!');
      }
    }

    // =========================================================================
    // [탭 8 렌더링] 평행사변형(ab sin θ) & 일반 사각형 대각선 넓이(½ pq sin θ)
    // =========================================================================
    function renderMode8QuadArea(rect, cx, cy) {
      const subId = state.subType[8]; // [2.0 수정] 원본은 이 변수 이름(sub)이 벡터 함수 sub()를 가려 오류가 났습니다
      const s = state.scale * 1.02;
      const t = state.fold;

      if (subId === 'paraArea' || subId === 'rhombusSquare') {
        const B = pt(cx - 145 * s, cy + 68 * s), C = pt(cx + 85 * s, cy + 68 * s);
        const A = pt(cx - 75 * s, cy - 68 * s), D = pt(cx + 155 * s, cy - 68 * s);

        ppoly([A, B, C], 'rgba(56, 189, 248, 0.24)', TCOL.cyan, 3.2, 0);
        ppoly([A, C, D], 'rgba(244, 114, 182, 0.24)', TCOL.pink, 3.2, 1);
        pline(A, C, TCOL.gold, 3.2, [5, 4]);
        pangle(B, A, C, TCOL.gold, 32, 1, 'θ=60°');
        // [표시 보강] 마주 보는 각 ∠D = ∠B = θ(같은 금색 호), 마주 보는 변은 같은 눈금(AB=DC 한 줄, BC=AD 두 줄)과 평행 표시
        pmark(D, A, C, TCOL.gold, 32, 1, 'θ');
        ptick(A, B, 1, TCOL.gold); ptick(D, C, 1, TCOL.gold);
        ptick(B, C, 2, TCOL.gold); ptick(A, D, 2, TCOL.gold);
        ppar(lerp(A, B, 0.5), B, 1, TCOL.white); ppar(lerp(D, C, 0.5), C, 1, TCOL.white);
        ppar(lerp(B, C, 0.5), C, 2, TCOL.white); ppar(lerp(A, D, 0.5), D, 2, TCOL.white);

        [A, B, C, D].forEach((p, i) => pdot(p, 'ABCD'[i], TCOL.white, pt(cx, cy)));
        ptag((A.x + B.x) / 2 - 28, (A.y + B.y) / 2, 'a = 6', TCOL.cyan, 14);
        ptag((B.x + C.x) / 2, B.y + 22, 'b = 8', TCOL.cyan, 14);
        ptag(cx - 25 * s, cy + 28 * s, '½ ab sin θ', TCOL.cyan, 13);
        ptag(cx + 35 * s, cy - 22 * s, '½ ab sin θ', TCOL.pink, 13);

        drawBottomTapeBanner(rect, '평행사변형 넓이 S = (½ ab sin θ) × 2개 = ab sin θ (½이 약분되어 사라집니다!)', [
          { text: '△ABC 넓이 = ½ ab sin θ', weight: 0.5, color: TCOL.cyan },
          { text: '△CDA 넓이 = ½ ab sin θ (합 = ab sin θ)', weight: 0.5, color: TCOL.pink }
        ]);
        return;
      }

      // quadUnfold2x, quadDiagHalf, quadSplitSum: 두 대각선 p(AC), q(BD)와 교각 θ + 바깥 2배 평행사변형 펼치기!
      const O = pt(cx, cy);
      const uP = { x: Math.cos(-0.22), y: Math.sin(-0.22) };
      const uQ = { x: Math.cos(0.82), y: Math.sin(0.82) };

      const A = addPt(O, mul(uP, -110 * s)), C = addPt(O, mul(uP, 125 * s));
      const B = addPt(O, mul(uQ, 95 * s)), D = addPt(O, mul(uQ, -105 * s));

      // 바깥 2배 큰 평행사변형의 네 꼭짓점 E, F, G, H (두 대각선에 평행한 직선들의 교점!)
      const E = add(A, sub(B, O)), F = add(C, sub(B, O));
      const G = add(C, sub(D, O)), H = add(A, sub(D, O));

      const showOuter = subId === 'quadUnfold2x' ? (t === 0 ? 1.0 : t) : t;
      if (showOuter > 0.02) {
        ctx.save();
        ctx.globalAlpha = Math.min(1, showOuter);
        ppoly([E, F, G, H], 'rgba(251, 191, 36, 0.14)', TCOL.gold, 2.6, 2);
        ptag((E.x + F.x) / 2 - 15, (E.y + F.y) / 2 + 22, '바깥 가로 = 대각선 p(8)', TCOL.cyan, 12.5);
        ptag((F.x + G.x) / 2 + 52, (F.y + G.y) / 2, '바깥 세로 = q(10)', TCOL.pink, 12.5);
        // [표시 보강] 바깥 평행사변형의 변은 대각선과 평행(AC∥EF∥HG 한 겹 '>', BD∥FG∥EH 두 겹 '>'), 꼭짓점 F·H의 각도 같은 θ
        // (바깥 변의 가운데는 안쪽 꼭짓점 A·B·C·D 자리이므로 변의 3/4 지점에 표시)
        ppar(lerp(E, F, 0.5), F, 1, TCOL.cyan); ppar(lerp(H, G, 0.5), G, 1, TCOL.cyan); ppar(lerp(F, G, 0.5), G, 2, TCOL.pink); ppar(lerp(E, H, 0.5), H, 2, TCOL.pink);
        pmark(F, E, G, TCOL.gold, 26, 1, 'θ'); pmark(H, G, E, TCOL.gold, 26, 1, 'θ');
        [E, F, G, H].forEach((p, i) => pdot(p, 'EFGH'[i], TCOL.gold));
        ctx.restore();
      } else {
        [E, F, G, H].forEach((p) => BOARD.toS(p)); // [표시 보강] 접힌 상태에서도 바깥 평행사변형까지 화면에 담아, 변환을 켜도 도형·글자가 잘리지 않게(맞춤은 장면 입장 때 한 번만 계산)
      }

      ppoly([A, B, C, D], 'rgba(52, 211, 153, 0.28)', TCOL.green, 3.4, 2);
      pline(A, C, TCOL.cyan, 4.2, [], true, 0); // 대각선 p
      pline(B, D, TCOL.pink, 4.2, [], true, 1); // 대각선 q
      pangle(O, C, B, TCOL.gold, 28, 1, 'θ=60°');
      // [표시 보강] 맞꼭지각 ∠AOD = θ 도 같은 금색 호, 대각선 평행 표시(바깥 변과 같은 '>' 겹 수)
      pmark(O, A, D, TCOL.gold, 28, 1, 'θ');
      ppar(A, O, 1, TCOL.cyan); ppar(O, D, 2, TCOL.pink);

      [A, B, C, D].forEach((p, i) => pdot(p, 'ABCD'[i], TCOL.white, O));
      pdot(O, 'O', TCOL.gold, null, { x: 8, y: -10 });

      drawMiniOverlayBox(rect, '🎬 왜 대각선 넓이는 ½이 붙을까?', [
        { txt: '① 대각선 평행선으로 바깥 □EFGH 작도', col: '#fef08a' },
        { txt: '② 바깥 평행사변형 넓이 = pq sin θ', col: '#38bdf8' },
        { txt: '③ 4개 조각마다 안쪽이 딱 절반(½)!', col: '#f472b6' },
        { txt: '∴ 사각형 넓이 S = ½ pq sin θ', col: '#34d399' }
      ]);

      drawBottomTapeBanner(rect, '바깥 큰 평행사변형 넓이(pq sin θ) = 안쪽 사각형 넓이(½ pq sin θ) × 2배!', [
        { text: '안쪽 사각형 ABCD 넓이 = ½ pq sin θ', weight: 0.5, color: TCOL.green },
        { text: '바깥 귀퉁이 삼각형 4개 합 = ½ pq sin θ', weight: 0.5, color: TCOL.gold }
      ]);
    }

  /* ======================================================================
     2.0 셸 연결 (새로 작성한 부분)
     ====================================================================== */
  const RENDER = { 1: renderMode1TrigDef, 2: renderMode2SpecialAngles, 3: renderMode3UnitCircle, 4: renderMode4RightLengths, 5: renderMode5GeneralLengths, 6: renderMode6TriangleHeight, 7: renderMode7TriangleArea, 8: renderMode8QuadArea };
  const TABS = ['삼각비 뜻 & 기준각 전환', '특수각(30°·45°·60°) & 기울기', '반지름 1 사분원 & 대소비교', '직각삼각형 변 & 실생활 측량', '일반삼각형 변 (특수각 보존!)', '삼각형 높이 h (tan x ± tan y)', '삼각형 넓이 & 각이등분선', '평행사변형 & 대각선 넓이'];
  const SHORT = ['삼각비 뜻', '특수각', '사분원', '직각삼각형 변', '일반삼각형 변', '삼각형 높이', '삼각형 넓이', '사각형 넓이'];
  const QUESTIONS = [
    '기준각이 바뀌면, 같은 삼각형에서 높이(대변)와 밑변은 어떻게 바뀔까?',
    '30°·45°·60°의 삼각비는 어떤 도형을 반으로 자를 때 생겨날까?',
    '반지름이 1이면 sin·cos·tan의 값이 어떤 선분의 길이가 될까?',
    '빗변이나 밑변 하나와 각 하나만 알면 나머지 변을 어떻게 구할까?',
    '특수각을 살리려면 수선을 어느 꼭짓점에서 내려야 할까?',
    '밑변과 양 끝각만 알 때, 높이 h는 어떻게 구할까?',
    '높이를 그리지 않고도 두 변과 끼인각으로 넓이를 구할 수 있을까?',
    '사각형의 넓이에는 왜 ½이 붙기도 하고 안 붙기도 할까?'
  ];
  // 이 장면에서 '변환(0→100%)'이 실제로 그림을 바꾸는 장면만 변환 조절을 보여 줍니다.
  const FOLD = new Set(['refAngleSwap', 'cut45', 'cut3060', 'pendulumSwing', 'angleBisectLen', 'quadUnfold2x', 'quadDiagHalf', 'quadSplitSum']);
  const ANGLE_MODES = { 3: [25, 30, 45, 60], 4: [30, 45, 60], 7: [30, 45, 60, 120] };

  function sync(s, m, id) {
    state.mode = m;
    state.subType[m] = id;
    state.fold = s.fold;
    state.angleDeg = Math.round(s.deg);
    state.baseLen = s.L;
    state.activePartIdx = s.part == null ? -1 : s.part;
    state.scale = 1;
  }
  const tone = (p) => (p.ok === false ? 'red' : p.color);

  function sceneOf(m, it) {
    const id = it.id;
    return {
      id, title: it.label, short: it.label, reviewTab: true, autoFit: true,
      question: QUESTIONS[m - 1],
      notesTitle: '시험장 오답 함정 & 3초 직관',
      enter: (s) => {
        // 원본 setMode / setSubType 의 초기화 규칙 그대로
        s.fold = 0;
        if (m === 3 && s.deg > 80) s.deg = 35;
        if (id === 'areaObtuse') s.deg = 120;
        else if (id === 'areaAcute' && s.deg > 90) s.deg = 60;
        if (m === 4 && s.deg > 80) s.deg = 60;
      },
      controls: () => (m === 3 ? ['deg'] : FOLD.has(id) ? ['fold'] : []),
      presets: (s) => {
        const out = [];
        (ANGLE_MODES[m] || []).forEach((d) => out.push({ group: m === 3 ? '각 x 바로 가기' : '기준각 θ', label: `${d}°`, set: { deg: d }, on: (st) => Math.round(st.deg) === d }));
        if (m === 4) [6, 8, 10, 12].forEach((v) => out.push({ group: '빗변 / 기준변 길이', label: `${v}`, apply: (st) => { st.L = v; }, on: (st) => st.L === v }));
        if (FOLD.has(id)) [0, 0.5, 1].forEach((v) => out.push({ group: '변환 단계', label: v === 0 ? '0% 시작' : v === 1 ? '100% 완성' : '50%', set: { fold: v }, ms: 700, on: (st) => Math.abs(st.fold - v) < 0.01 }));
        return out;
      },
      actions: (s) => {
        if (!(FOLD.has(id) || m === 3)) return [];
        return [{
          id: 'act', play: true, primary: true, icon: 'wand',
          label: (st) => { sync(st, m, id); return getSpec().actionTxt; },
          run: (st, lab) => {
            if (m === 3) { // 원본 toggleFoldAnim: 25→30→45→60 순환
              const order = [25, 30, 45, 60];
              const cur = Math.round(st.deg);
              lab.tween({ deg: order[(order.indexOf(cur) + 1) % order.length] }, 600);
              return;
            }
            lab.tween({ fold: st.fold > 0.5 ? 0 : 1 }, 1100);
          }
        }];
      },
      view: (s) => {
        sync(s, m, id);
        const spec = getSpec();
        return {
          guide: spec.hint,
          parts: spec.parts.map((p) => ({ id: p.id, name: p.name, desc: p.desc, value: p.val, color: tone(p), ok: p.ok })),
          summary: spec.totalRes,
          rule: spec.rule,
          formula: spec.formulaHTML,
          notes: spec.notes
        };
      },
      draw: (b, s, v) => {
        BOARD = b;
        ctx = b.ctx;
        sync(s, m, id);
        sink.card = null;
        sink.tape = null;
        if (s.grid) b.grid({ step: 38 });
        RENDER[m]({ width: 1000, height: 700 }, 0, 0);
        if (m === 3) {
          // 사분원 위의 점 A를 직접 끌기 (원본 마우스 드래그와 같은 각 계산, 5°~82°)
          const O = { x: -85 * 1.02, y: 75 * 1.02 }, R = 175 * 1.02;
          const deg = Math.max(5, Math.min(82, state.angleDeg)), rad = (deg * Math.PI) / 180;
          b.handle('A', { x: O.x + R * Math.cos(rad), y: O.y - R * Math.sin(rad) }, {
            color: 'rose', step: 1,
            drag: (w) => { s.deg = Math.max(5, Math.min(82, Math.round((Math.atan2(O.y - w.y, w.x - O.x) * 180) / Math.PI))); }
          });
        }
        v.card = sink.card;
        v.tape = sink.tape;
      }
    };
  }

  const groups = Object.keys(SUB_MENUS).map((k) => {
    const m = +k;
    return { id: 'm' + m, title: TABS[m - 1], short: SHORT[m - 1], scenes: SUB_MENUS[m].map((it) => sceneOf(m, it)) };
  });

  APLab.createLab({
    id: 'g9-trig-ratio',
    title: '삼각비',
    courseName: '중3',
    unit: '삼각비 · 길이와 넓이',
    courseColor: 'var(--m-violet)',
    home: '../index.html#g9',
    legacy: '../../labs/g9/삼각비.html',
    board: { kind: 'figure', autoFit: true, minZoom: 0.4, maxZoom: 5 },
    params: {
      fold: { value: 0, min: 0, max: 1, step: 0.005, color: 'amber', label: '변환 진행 (0% → 100%)', hint: '기준각 회전 · 반 자르기 · 수선 · 2배 확장 같은 변환을 천천히 확인합니다', format: (v) => `${Math.round(v * 100)}%` },
      deg: { value: 30, min: 5, max: 82, step: 1, color: 'rose', label: '각 x (점 A를 끌어도 됩니다)', format: (v) => `${Math.round(v)}°` },
      L: { value: 10, min: 6, max: 12, step: 2, color: 'sky', label: '기준변 길이', format: (v) => `${v}` }
    },
    groups
  });
});
</script>
