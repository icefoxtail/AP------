<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a100e">
<title>삼각비 · AP Math 실험실</title>
<meta name="description" content="중3 삼각비 51장면: 변과 각을 직접 조절하며 탐구하고, 문제를 먼저 푼 뒤 같은 문항의 기준각·대응변·보조선과 계산을 단계별 풀이 그림으로 확인합니다. 특수각, 삼각비표, 길이와 넓이, 입체도형까지 연결합니다.">
<script>try{var t=localStorage.getItem('apl:theme');t=t?JSON.parse(t):'paper';document.documentElement.setAttribute('data-theme',t==='board'?'board':'paper')}catch(e){document.documentElement.setAttribute('data-theme','paper')}</script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="../kit/vendor/katex/katex.min.css">
<link rel="stylesheet" href="../kit/apl.css">
<script defer src="../kit/vendor/katex/katex.min.js"></script>
<script defer src="../kit/vendor/qrcode.js"></script>
<script defer src="../kit/apl-core.js"></script>
<script defer src="../kit/apl-board.js"></script>
<script defer src="../kit/apl-shell.js"></script>
</head>
<body>
<noscript>이 실험실을 보려면 브라우저에서 자바스크립트를 켜야 합니다.</noscript>
<script>
/* ==========================================================================
   중3 · 삼각비 (AP Math Lab 2.0) — 삼각비 단원 전체
   탭(order 순): ① 삼각비의 뜻(10) · ② 30°·45°·60°(20) · ③ 사분원·삼각비의 표(30) · ④ 변의 길이(40)
                 ⑤ 높이·거리(50) · ⑥ 삼각형의 넓이(60) · ⑦ 사각형의 넓이(70) · ⑧ 입체·결합도형(80)
   이 파일은 얇은 껍데기입니다. 공용 도구는 labs/g9-trig-ratio/core.js, 각 탭은 t1~t8.js 모듈이
   window.APL_TG_GROUPS 에 { order, id, title, short, params, scenes } 를 등록하면 order 순으로 붙습니다.
   원칙(학생 가독성)
   - 그림은 무대 가득 · 길이와 각은 그림 안에 크게(화면 기준 12px 이상) · 모든 도형은 막대나 손잡이로 조절
   - 색의 역할: 분홍=대변 · 하늘=이웃변·주어진 값 · 초록=빗변·결과 · 노랑=구하는 값 x·끌 수 있는 점 · 보라=보조선
   - 움직임은 가로로만(제자리 회전은 허용). 탐구 → 먼저 문제 풀기(5지선다 + 숫자 바꾸기) → 현재 문항의 단계별 풀이
   - 중3은 제곱근을 배웠으므로 √ 와 분모의 유리화를 씁니다. [심화] = 교육과정 경계 유형, [참고] = 곁가지.
   ========================================================================== */
window.addEventListener('DOMContentLoaded', function () {
'use strict';
const MODULES = ['core', 't1', 't2', 't3', 't4', 't5', 't6', 't7', 't8'];
const loadScript = (src) => new Promise((res) => {
  const el = document.createElement('script');
  el.src = src; el.async = false;
  el.onload = () => res(true);
  el.onerror = () => { el.remove(); res(false); }; // 아직 없는 모듈은 건너뜁니다
  document.head.append(el);
});

function start() {
  const mods = (window.APL_TG_GROUPS || []).filter((g) => g && Array.isArray(g.scenes) && g.scenes.length);
  const groups = mods.slice().sort((a, b) => (a.order || 0) - (b.order || 0)).map((g) => ({ id: g.id, title: g.title, short: g.short || g.title, scenes: g.scenes }));
  const params = {};
  mods.forEach((g) => Object.assign(params, g.params || {}));
  const TG = window.APL_TG;
  APLab.createLab({
    id: 'g9-trig-ratio',
    stackFractions: true, // 패널 글의 슬래시·유니코드 분수를 쌓은 분수로 바꿉니다 (kit/apl-core.js APLab.stackFr)
    title: '삼각비',
    courseName: '중3',
    unit: '삼각비 · 길이와 넓이',
    courseColor: 'var(--m-violet)',
    home: '../index.html#g9',
    legacy: '../../labs/g9/삼각비.html',
    // 빈 곳을 끌면 입체의 시점이 제자리에서 돌아갑니다(이동이 아니라 회전)
    board: { kind: 'figure', grid: false, pad: 0.02, minZoom: 0.5, maxZoom: 6, orbit: (s, dx, dy) => { if (TG && TG.orbit) TG.orbit(s, dx, dy); } },
    // 장면에 들어올 때마다 화면 범위를 처음 상태로 되돌립니다. 그림 맞춤은 장면 그리기에서 매번 합니다.
    enter: (s, sc, lab) => { if (lab && lab.board && s === lab.s) { lab.board.fit(); lab.board.setPanes(null); lab.board.setInsets({ top: 0, right: 0, bottom: 0, left: 0 }); } },
    params,
    groups
  });
}
Promise.all(MODULES.map((m) => loadScript(`g9-trig-ratio/${m}.js`))).then(start);
});
</script>
</body>
</html>
