/* ==========================================================================
   미적분Ⅰ · 합성함수·절댓값 그래프 (AP Math Lab 2.0 이식본)
   원본: labs/미적분1/합성함수·절댓값 그래프.html
   - 문제·단계·정석/빠른 풀이 문구(examData)는 원본을 그대로 옮겼습니다.
   - 수학 함수(baseCubic = x³−3x, outerF, 안쪽함수 g)는 원본과 같은 식입니다. 근 탐색기 findLevelCrossings는 같은 방법(눈금 훑기+이분법)이지만
     접점(중근)을 한 번만 세도록 고쳤습니다(원본은 t=0, k=2 에서 실근 4개가 아니라 6개로 셌습니다).
   - 바뀐 점: 셸·레이아웃은 공용 키트가 담당, 무대는 1:1 축척, 끌 수 있는 점 추가
     (장면 1: 평행이동 m · 장면 2: 접는 기준 t와 수평선 k · 장면 3: 영점 r · 장면 4·5: 꼭짓점 높이 c와 수평선 k),
     변환된 그래프는 단계와 상관없이 처음부터 보이고(단계는 원래 그래프·접힌 부분·표시점을 차례로 더함),
     절댓값 변환 선택은 탐구 탭의 버튼으로 옮겼습니다.
   - 장면 1·2의 ‘하단 동기화 뷰’는 원본에서도 속함수 그림(장면 4용)이 엉뚱하게 나오던 것이라 두지 않았습니다.
   ========================================================================== */
window.addEventListener('DOMContentLoaded', function () {
  const { tex, fmt, clamp } = APLab;
  const num = (v, d = 2) => fmt(v, d).replace('−', '-'); // 수식(TeX) 문자열용
  const round05 = (v) => Math.round(v * 20) / 20;

  /* ---------- 1. 수학 모델 & 방정식 근 탐색기 (원본 그대로) ---------- */
  // 기본 삼차함수 f(x) = x^3 - 3x (극대 (-1, 2), 극소 (1, -2))
  function baseCubic(x) {
    return x * x * x - 3.0 * x;
  }

  // Mode 4, 5의 바깥함수 f(u) = u^3 - 3u, 안쪽함수 g(x) = 0.5x^2 + c (c는 꼭짓점 높이)
  function outerF(u) {
    return u * u * u - 3.0 * u;
  }

  const innerG = (c) => (x) => 0.5 * x * x + c;
  // g(x) = u 의 실근: x² = 2(u − c). u 가 꼭짓점 높이 c 와(거의) 같으면 접하므로 근은 하나(x = 0)입니다.
  const innerRoots = (c, u) => {
    const d = u - c;
    if (Math.abs(d) < 1e-6) return [0];
    return d < 0 ? [] : [-Math.sqrt(2 * d), Math.sqrt(2 * d)];
  };

  // 구간 [minX, maxX] 에서 fn(x) = targetY 의 교점 x좌표 배열 탐색 (오름차순)
  // 원본은 ‘|차이| < 0.012’ 로 접점을 찾아 t=0, k=2 처럼 수평선이 극점에 정확히 닿을 때 한 근을 두 번 세고(6개),
  // k=2.01 처럼 닿지 않을 때도 근이 있다고 세는 오차가 있었습니다. 같은 방식(눈금 훑기 + 이분법)으로 하되,
  // 부호가 바뀌는 곳은 이분법으로, 눈금 사이에서 두 번 바뀌는 가까운 두 근과 부호가 안 바뀌는 접점(중근)은
  // 극값을 찾아 처리해 접점은 한 번만 셉니다.
  function findLevelCrossings(fn, targetY, minX = -3.8, maxX = 3.8, step = 0.015) {
    const g = (x) => fn(x) - targetY;
    const n = Math.ceil((maxX - minX) / step);
    const xs = [];
    const ds = [];
    for (let i = 0; i <= n; i++) {
      const x = minX + i * step;
      xs.push(x);
      ds.push(g(x));
    }
    const roots = [];
    const bisect = (lo, hi) => {
      let glo = g(lo);
      for (let j = 0; j < 45; j++) {
        const mid = (lo + hi) / 2;
        const gm = g(mid);
        if (glo * gm <= 0) hi = mid;
        else { lo = mid; glo = gm; }
      }
      return (lo + hi) / 2;
    };
    const extreme = (lo, hi, wantMax) => {
      for (let j = 0; j < 60; j++) {
        const m1 = lo + (hi - lo) / 3, m2 = hi - (hi - lo) / 3;
        const first = wantMax ? g(m1) > g(m2) : g(m1) < g(m2);
        if (first) hi = m2;
        else lo = m1;
      }
      return (lo + hi) / 2;
    };
    for (let i = 0; i < n; i++) {
      if (ds[i] === 0) roots.push(xs[i]);
      else if (ds[i] * ds[i + 1] < 0) roots.push(bisect(xs[i], xs[i + 1]));
    }
    for (let i = 1; i < n; i++) {
      const d0 = ds[i - 1], d1 = ds[i], d2 = ds[i + 1];
      const lowPoint = d1 > 0 && d1 < d0 && d1 <= d2;   // 0 위쪽에서 오목하게 내려온 곳(극소)
      const highPoint = d1 < 0 && d1 > d0 && d1 >= d2;  // 0 아래쪽에서 볼록하게 올라온 곳(극대)
      if (!lowPoint && !highPoint) continue;
      const xm = extreme(xs[i - 1], xs[i + 1], highPoint);
      const gm = g(xm);
      const crossed = lowPoint ? gm < -1e-12 : gm > 1e-12;
      if (crossed) { roots.push(bisect(xs[i - 1], xm)); roots.push(bisect(xm, xs[i + 1])); }
      else if (Math.abs(gm) < 1e-6) roots.push(xm); // 접점(중근)
    }
    roots.sort((p, q) => p - q);
    return roots.filter((r, i) => i === 0 || r - roots[i - 1] > 1e-7);
  }

  // 장면 1: 절댓값 변환 3종 (out: |f(x)|, in: f(|x|), both: |f(|x|)|), 원함수는 f(x) = baseCubic(x − m)
  const transOf = (type, m) => (x) => {
    const raw = (u) => baseCubic(u - m);
    if (type === 'out') return Math.abs(raw(x));
    if (type === 'in') return raw(Math.abs(x));
    return Math.abs(raw(Math.abs(x)));
  };
  const typeName = (t) => (t === 'out' ? '|f(x)|' : t === 'in' ? 'f(|x|)' : '|f(|x|)|');
  const shiftStr = (m) => (m >= 0 ? `x-${num(Math.abs(m), 1)}` : `x+${num(Math.abs(m), 1)}`);

  // 합성함수 극값 개수 (원본 배너 식 그대로)
  const extremaCount = (c) => {
    let n = 1; // x = 0
    if (c < -1.02) n += 4;
    else if (c < 0.98) n += 2;
    return n;
  };
  const stepTwoCount = (k, c) => {
    const uRoots = findLevelCrossings(outerF, k);
    let total = 0;
    uRoots.forEach((u) => { total += innerRoots(c, u).length; });
    return { uRoots, total };
  };

  /* ---------- 2. 문제·풀이 데이터 (원본 examData 그대로) ---------- */
    const examData = {
      1: {
        badge: "MODE 1 · 4대 절댓값 그래프 변환 (|f(x)|, f(|x|), |f(|x|)|)과 x=0 미분가능성",
        hint: "좌측 상단 <span class='text-amber-300 font-bold'>절댓값 변환 버튼(①~③)</span>을 눌러보거나 우측 슬라이더로 그래프를 좌우 이동(<span class='text-sky-300 font-bold'>m=1</span>)시켜 <span class='text-pink-300 font-bold'>f(|x|)가 x=0에서 미분가능해지는 순간</span>을 확인하세요!",
        tag: "내신·모의고사 절댓값 대칭 변환 필수",
        targetTime: "목표 시간: 5초",
        question: () => `삼차함수 ${tex('f(x) = (x - m)^3 - 3(x - m)')} 에 대하여 함수 ${tex('g(x) = f(|x|)')} 가 ${tex('x = 0')} 에서 미분가능하도록 하는 모든 양수 ${tex('m')}의 값과 그때 ${tex('g(0)')}의 값을 구하시오.`,
        answerBadge: () => `${tex("f'(0) = 0 \\implies m = 1, \\; g(0) = 2")}`,
        snap: { p1: 1.0, p2: 2.0, dualView: false },
        steps: [
          "Step 1 · f(|x|)에서 x≥0의 f(x), x<0의 f(−x)를 나누어 오른쪽 그래프를 y축 대칭합니다.",
          "Step 2 · x=0에서 우미분 f′(0)과 좌미분 −f′(0)을 계산해 맞춥니다.",

        textbook: () => ({
          steps: `① ${tex('g(x) = f(|x|) = \\begin{cases} f(x) & (x \\ge 0) \\\\ f(-x) & (x < 0) \\end{cases}')} 로 구간 분리<br/>
② ${tex('x = 0')} 에서 우미분계수 ${tex("g'_{+}(0) = f'(0)")}, 좌미분계수 ${tex("g'_{-}(0) = -f'(0)")}<br/>
③ 미분가능하려면 ${tex("f'(0) = -f'(0) \\implies f'(0) = 0")} 이어야 함<br/>
④ ${tex("f'(x)=3(x-m)^2-3")}이므로 ${tex("f'(0)=3m^2-3=0")}. 따라서 ${tex('m=\\pm1')}이고 양수 조건에서 ${tex('m=1')}입니다. 이때 ${tex('g(0)=f(0)=2')}입니다.`,
          warning: "⚠️ y = f(|x|) 는 x ≥ 0 부분만 남겨서 y축에 데칼코마니로 찍어내는 그래프입니다!"

② 즉 계산 없이 무조건 <strong class="text-pink-300">${tex("f'(0) = 0")} (극대 또는 극소점이 y축 위에 위치)</strong>!<br/>
③ 따라서 극대점이 ${tex('x = 0')} 이 되도록 평행이동한 <strong class="text-amber-300">${tex('m = 1')}</strong> 에서 스무스하게 미분가능!`,

      2: {

        tag: "수능 15번·22번 실근의 개수 최고난도 킬러",

        question: () => `함수 ${tex('f(x) = x^3 - 3x')} 에 대하여 방정식 ${tex('|f(x) - t| = k \\; (k > 0)')} 의 서로 다른 실근의 개수가 ${tex('4')}개가 되도록 하는 ${tex('t = 0')} 일 때의 양수 ${tex('k')}의 값과, 실근이 ${tex('6')}개가 되는 ${tex('k')}의 범위를 구하시오.`,
        answerBadge: () => `4개: ${tex('k = 2')} / 6개: ${tex('0 < k < 2')}`,
        snap: { p1: 0.0, p2: 2.0, dualView: false },
        steps: [
          "Step 1 · t=0에서 |x³−3x|=k를 x³−3x=k와 x³−3x=−k로 분리합니다.",
          "Step 2 · f′=3(x²−1)의 극점과 두 극값을 이용해 k 높이의 교점 수를 셉니다.",
          "Step 3 · k가 극값 높이에 닿을 때 중복해를 한 번만 세고 4개·6개 조건을 판정합니다."
        ],
        textbook: () => ({
          steps: `① ${tex('t = 0')} 일 때 방정식 ${tex('|x^3 - 3x| = k')} 는 ${tex('x^3 - 3x = k')} 또는 ${tex('x^3 - 3x = -k')}<br/>
② 두 방정식의 실근의 개수의 합이 ${tex('4')}가 되려면 각 방정식이 중근 1개와 단근 1개씩(총 2개씩) 가져야 함<br/>
③ ${tex('0<k<2')}에서는 두 수평선 ${tex('y=k')}와 ${tex('y=-k')}가 각각 삼차곡선과 3점에서 만나 총 6개입니다. ${tex('k=2')}이면 한 수평선이 극값에서 접해 2점, 다른 수평선은 2점이므로 총 4개입니다. ${tex('k>2')}이면 합계가 4개보다 작아집니다.`,

        hint: "상단에서 <span class='text-pink-300 font-bold'>|f(x)|는 x=2에서 뾰족한 첨점</span>을 갖습니다! 일차함수 <span class='text-sky-300 font-bold'>g(x) = x - r</span> 의 절편 <span class='text-amber-300 font-bold'>r을 2에 맞추는 순간</span> 하단 곱함수의 첨점이 스무스하게 펴집니다!",

        targetTime: "목표 시간: 3초",
        question: () => `함수 ${tex('f(x) = x - 2')} 와 일차함수 ${tex('g(x) = x - r')} 에 대하여, 곱함수 ${tex('h(x) = |f(x)|g(x)')} 가 ${tex('x = 2')} 에서 미분가능하도록 하는 상수 ${tex('r')}의 값과 그때 ${tex("h'(2)")}의 값을 구하시오.`,

        snap: { p1: 2.0, p2: 0.0, dualView: true },

② ${tex('x < 2')} 일 때 ${tex('h(x) = -(x-2)(x-r) \\implies h\'_{-}(2) = -(2 - r)')}<br/>

&nbsp;&nbsp;${tex('2 - r = -(2 - r) \\implies 2(2 - r) = 0 \\implies r = 2')}<br/>

            : `y = ${nm} : x≥0 데칼코마니  ⇒  ${smooth ? "f′(0)=0 이므로 x=0에서 미분가능!" : "f′(0)≠0 이므로 x=0에서 첨점 발생!"}` } : null
        };
      },
      draw: (b, s) => {
        const m = s.m, type = s.absType, tf = transOf(type, m), raw = (x) => baseCubic(x - m);
        const slope0 = 3 * m * m - 3, smooth = Math.abs(slope0) < 0.15;
        stage(b, s, 'main');
        const vb = b.viewBox();
        // 접어 올린 부분(원래 그래프가 x축 아래였던 곳)
        if (s.step >= 2 && type === 'out') fillBetween(b, tf, raw, vb.x0, vb.x1, { pos: 'violet', neg: 'violet', alpha: 0.14, ref: 'trans' });
        // Step 1: 원래 함수 y = f(x) 점선 가이드
        if (s.step >= 1) b.plot(raw, { color: 'ink', alpha: 0.5, width: 2.2, dash: true, ref: 'orig' });
        // 변환된 그래프
        b.plot(tf, { color: 'rose', width: 3.4, glow: true, ref: 'trans' });
        // Step 2: 두 갈래 접선(x=0에서 좌·우미분)
        if (s.step >= 2 && type !== 'out') {
          const h = 1e-4, y0 = tf(0);
          const sR = (tf(h) - y0) / h, sL = (y0 - tf(-h)) / h;
          const L = 1.9, nR = Math.hypot(1, sR), nL = Math.hypot(1, sL); // 길이가 같은(1:1) 짧은 접선 조각
          const pR = [L / nR, y0 + (L * sR) / nR], pL = [-L / nL, y0 - (L * sL) / nL];
          b.seg([0, y0], pR, { color: 'sky', width: 2.4, dash: true, glow: true, ref: 'slope' });
          b.seg(pL, [0, y0], { color: 'violet', width: 2.4, dash: true, glow: true, ref: 'slope' });
          if (seen(vb, pR[0], pR[1])) tag(b, pR, `우미분 ${fmt(sR, 1)}`, { color: 'sky', dx: 8, dy: sR > 0 ? -12 : 14, align: 'left', ref: 'slope' });
          if (seen(vb, pL[0], pL[1])) tag(b, pL, `좌미분 ${fmt(sL, 1)}`, { color: 'violet', dx: -8, dy: sL < 0 ? -12 : 14, align: 'right', ref: 'slope' });
        }
        // Step 3: 첨점·미분가능 표시
        if (s.step >= 3) {
          if (type === 'out') {
            [m - Math.sqrt(3), m, m + Math.sqrt(3)].forEach((rx) => {
              if (!seen(vb, rx, 0)) return;
              b.point([rx, 0], { color: 'red', r: 6, ref: 'trans' });
              tag(b, [rx, 0], `첨점 ${fmt(rx)}`, { color: 'red', dy: 22, ref: 'trans' });
            });
          } else if (seen(vb, 0, tf(0))) {
            b.point([0, tf(0)], { color: smooth ? 'green' : 'red', r: 7, ref: 'trans' });
            tag(b, [0, tf(0)], smooth ? "x=0 미분가능 (f′(0)=0)" : `x=0 첨점 (우미분=${fmt(slope0, 1)})`, { color: smooth ? 'green' : 'red', dx: 14, dy: -14, align: 'left', ref: 'trans' });
          }
        }
        // 직접 끄는 점: 점선 그래프의 극소점 → 좌우로 끌면 평행이동 m
        b.handle('m', [m + 1, -2], { color: 'amber', ref: 'm', label: `m = ${fmt(m)}`, dx: 12, dy: 20,
          drag: (w) => { s.m = clamp(round05(w.x - 1), -2.5, 2.5); } });
        paneEnd(b);
      }
    },

      },
      draw: (b, s) => {
        const c = s.c5, k = s.k5, g = innerG(c);
        const uRoots = findLevelCrossings(outerF, k);
        const cols = ['rose', 'amber', 'green'];
        stage(b, s, 'main', { xLabel: 'u', yLabel: 'f(u)' });
        // 상단은 바깥함수 y = f(u) = u^3 - 3u 와 수평선 y = k
        b.plot(outerF, { color: 'ink', width: 3.2, glow: true });
        b.hline(k, { color: 'sky', width: 2.6, glow: true, ref: 'k' });
        uRoots.forEach((u, i) => {
          b.point([u, k], { color: cols[i % cols.length], r: 6.5, label: b.W < 640 ? `u${i + 1}` : `u${i + 1} = ${fmt(u)}`, dx: 0, dy: k >= 0 ? -14 : 20, align: 'center', ref: 'u' });
        });
        b.handle('k', [2.5, k], { color: 'sky', ref: 'k', priority: 1, label: b.W < 640 ? 'k' : `k = ${fmt(k)}`, dx: 16, dy: 0,
          drag: (w) => { s.k5 = clamp(round05(w.y), -2.5, 2.5); } });
        paneEnd(b);
        if (s.dual) {
          stage(b, s, 'sub', { yLabel: 'y' });
          const vb = b.viewBox();
          b.plot(g, { color: 'sky', width: 3, glow: true, ref: 'g' });
          // 1단계에서 구한 u_1, u_2, u_3 를 수평선 y = u_i 로 긋고 교점 탐색
          uRoots.forEach((u, i) => {
            const col = cols[i % cols.length];
            b.seg([vb.x0 - 1, u], [vb.x1 + 1, u], { color: col, width: 2, dash: true, ref: 'x' });
            b.text([vb.x0, u], `y = u${i + 1} = ${fmt(u)}`, { color: col, dx: 8, dy: -8, align: 'left', size: 12, ref: 'x' });
            innerRoots(c, u).forEach((rx) => {
              b.point([rx, u], { color: col, r: 5.5, label: `x=${fmt(rx)}`, dx: 0, dy: -13, align: 'center', size: 12, ref: 'x' });
            });
          });
          b.handle('c', [0, c], { color: 'amber', ref: 'c', label: `g의 꼭짓점 (0, ${fmt(c, 1)})`, dx: 14, dy: -14,
            drag: (w) => { s.c5 = clamp(round05(w.y), -2.5, 2.5); } });
          paneEnd(b);
          subTitle(b, b.W < 640 ? '아래: g(x)와 수평선 y = uᵢ' : '2단계: 속함수 y = g(x) 와 수평선 y = uᵢ 교점 스캐너');
        }
        b.use('main');
      }
    }
  ];

  /* ---------- 5. 실험실 등록 ---------- */
  APLab.createLab({
    id: 'calc1-composite',
    title: '합성함수 · 절댓값 그래프',
    courseName: '미적분Ⅰ',
    unit: '함수 · 합성함수와 절댓값',
    courseColor: 'var(--m-orange)',
    home: '../index.html#calc1',
    legacy: '../../labs/미적분1/합성함수·절댓값 그래프.html',
    board: { kind: 'cartesian', focus: { x: [-3.6, 3.6], y: [-2.5, 2.6] }, pad: 0.04 },
    params: {
      m: { value: 1, min: -2.5, max: 2.5, step: 0.05, color: 'amber', label: '평행이동 m', hint: 'm = 1 에서 f(|x|)가 x = 0 에서 매끄러워집니다', format: (v) => `m = ${fmt(v)}` },
      t: { value: 0, min: -2.5, max: 2.5, step: 0.05, color: 'amber', label: '접기 기준선 t', hint: '점선 그래프 f(x) − t 의 x축 아랫부분이 접혀 올라옵니다', format: (v) => `t = ${fmt(v)}` },
      k2: { value: 2, min: 0, max: 3.8, step: 0.05, color: 'sky', label: '탐색 수평선 y = k', hint: 't = 0, k = 2 일 때 교점이 정확히 4개', format: (v) => `k = ${fmt(v)}` },
      r: { value: 2, min: -1.5, max: 2.5, step: 0.05, color: 'amber', label: 'g(x) = x − r 의 영점 r', hint: 'r = 2 에서 첨점이 펴집니다', format: (v) => `r = ${fmt(v)}` },
      c4: { value: -2, min: -2.5, max: 2.5, step: 0.05, color: 'amber', label: '속함수 꼭짓점 높이 c', hint: 'g(x) = 0.5x² + c', format: (v) => `c = ${fmt(v)}` },
      c5: { value: -1, min: -2.5, max: 2.5, step: 0.05, color: 'amber', label: 'g(x) 최솟값 c', hint: 'g(x) = 0.5x² + c', format: (v) => `c = ${fmt(v)}` },
      k5: { value: 0, min: -2.5, max: 2.5, step: 0.05, color: 'sky', label: '우변 상수 k', hint: 'f(u) = k 의 실근 u₁, u₂, u₃', format: (v) => `k = ${fmt(v)}` }
    },
    state: { absType: 'in', dual: false, animDir: -1 },
    persist: ['absType', 'dual'],
    scenes
  });
});
