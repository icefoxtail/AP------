<script>
/* ==========================================================================

   - 기본 문제의 의도와 정답을 보존하고 탐구·숫자 변형별 단계와 그림을 연결했습니다.
   - 수학 함수(baseCubic = x³−3x, outerF, 안쪽함수 g)는 같은 식을 보존합니다. 삼차식의 근은 단조구간에서 계산하고 접점은 임계 높이에서 따로 셉니다.
     접점(중근)을 한 번만 세도록 고쳤습니다(원본은 t=0, k=2 에서 실근 4개가 아니라 6개로 셌습니다).
   - 바뀐 점: 셸·레이아웃은 공용 키트가 담당, 무대는 1:1 축척, 끌 수 있는 점 추가
     (장면 1: 평행이동 m · 장면 2: 접는 기준 t와 수평선 k · 장면 3: 영점 r · 장면 4·5: 꼭짓점 높이 c와 수평선 k),
     변환된 그래프는 단계와 상관없이 처음부터 보이고(단계는 원래 그래프·접힌 부분·표시점을 차례로 더함),
     절댓값 변환 선택은 탐구 탭의 버튼으로 옮겼습니다.
   - 장면 1·2의 ‘하단 동기화 뷰’는 원본에서도 속함수 그림(장면 4용)이 엉뚱하게 나오던 것이라 두지 않았습니다.
   ========================================================================== */
window.addEventListener('DOMContentLoaded', function () {
  const { tex, fmt, clamp } = APLab;
  const num = (v, d = 2) => fmt(v, d).replace('−', '-'); // 수식(TeX) 문자열용
  const round05 = (v) => Math.round(v * 20) / 20;
  const same = (a, b) => Math.abs(a - b) <= 1e-11 * Math.max(1, Math.abs(a), Math.abs(b));

  /* ---------- 1. 수학 모델 & 방정식 근 탐색기 (원본 그대로) ---------- */
  // 기본 삼차함수 f(x) = x^3 - 3x (극대 (-1, 2), 극소 (1, -2))
  function baseCubic(x) {
    return x * x * x - 3.0 * x;
  }

  // Mode 4, 5의 바깥함수 f(u) = u^3 - 3u, 안쪽함수 g(x) = 0.5x^2 + c (c는 꼭짓점 높이)
  function outerF(u) {
    return u * u * u - 3.0 * u;
  }

  const innerG = (c) => (x) => 0.5 * x * x + c;
  // g(x) = u 의 실근: x² = 2(u − c). 실제 접점만 한 번 셉니다.
  const innerRoots = (c, u) => {
    const d = u - c;
    if (same(u, c)) return [0];
    return d < 0 ? [] : [-Math.sqrt(2 * d), Math.sqrt(2 * d)];
  };

  // x³−3x의 단조구간 세 개를 이용합니다. 접점은 정확한 극값 ±2에서만
  // 한 번 세므로 눈금 간격이나 화면 범위에 따라 근의 개수가 바뀌지 않습니다.
  function cubicLevels(y) {
    if (same(y, 2)) return [-1, 2];
    if (same(y, -2)) return [-2, 1];
    const reach = Math.max(3, Math.cbrt(Math.abs(y)) + 2), cuts = [-reach, -1, 1, reach], roots = [];
    for (let i = 0; i < 3; i++) {
      let lo = cuts[i], hi = cuts[i + 1], fl = baseCubic(lo) - y;
      if (fl * (baseCubic(hi) - y) >= 0) continue;
      for (let j = 0; j < 60; j++) {
        const mid = (lo + hi) / 2, fm = baseCubic(mid) - y;
        if (fl * fm <= 0) hi = mid; else { lo = mid; fl = fm; }
      }
      roots.push((lo + hi) / 2);
    }
    return roots;
  }
  const foldedLevels = (t, k) => k < 0 ? [] : same(k, 0) ? cubicLevels(t) : [...cubicLevels(t - k), ...cubicLevels(t + k)].sort((a, b) => a - b);

  // 장면 1: 절댓값 변환 3종 (out: |f(x)|, in: f(|x|), both: |f(|x|)|), 원함수는 f(x) = baseCubic(x − m)
  const transOf = (type, m) => (x) => {
    const raw = (u) => baseCubic(u - m);
    if (type === 'out') return Math.abs(raw(x));
    if (type === 'in') return raw(Math.abs(x));
    return Math.abs(raw(Math.abs(x)));
  };
  const typeName = (t) => (t === 'out' ? '|f(x)|' : t === 'in' ? 'f(|x|)' : '|f(|x|)|');
  const shiftStr = (m) => (m >= 0 ? `x-${num(Math.abs(m), 1)}` : `x+${num(Math.abs(m), 1)}`);
  const originSlope = (s) => {
    const f0 = baseCubic(-s.m), d0 = 3 * s.m * s.m - 3;
    return s.absType === 'in' ? d0 : same(f0, 0) ? Math.abs(d0) : Math.sign(f0) * d0;
  };

  // 합성함수 극값 개수 (원본 배너 식 그대로)
  const extremaCount = (c) => {
    let n = 1; // x = 0
    if (c < -1 && !same(c, -1)) n += 4;
    else if (c < 1 && !same(c, 1)) n += 2;
    return n;
  };
  const stepTwoCount = (k, c) => {
    const uRoots = cubicLevels(k);
    let total = 0;
    uRoots.forEach((u) => { total += innerRoots(c, u).length; });
    return { uRoots, total };
  };

  /* ---------- 2. 문제·풀이 데이터 (원본 examData 그대로) ---------- */
    const examData = {
      1: {
        badge: "장면 1 · 절댓값 기호를 포함한 함수 |f(x)|, f(|x|), |f(|x|)|의 그래프와 x=0에서의 미분가능성",
        hint: "탐구 탭의 <span class='text-amber-300 font-bold'>절댓값 변환 버튼(①~③)</span>을 눌러 보거나 조절 막대로 그래프를 좌우로 평행이동(<span class='text-sky-300 font-bold'>m=1</span>)시켜 <span class='text-pink-300 font-bold'>f(|x|)가 x=0에서 미분가능해지는 순간</span>을 확인하세요!",
        tag: "절댓값 기호를 포함한 함수의 그래프와 미분가능성",

        answerBadge: () => `${tex("f'(0) = 0 \\implies m = 1, \\; g(0) = 2")}`,

          "2단계 · x=0에서의 우미분계수 f′(0)과 좌미분계수 −f′(0)이 같아야 한다는 조건을 세웁니다.",

          warning: "⚠️ t가 바뀔 때마다 식을 ±k로 나누어 풀면 복잡합니다. 직선 y=t를 기준으로 보고, 위로 접혀 올라온 봉우리의 높이를 그래프에서 읽으면 편리합니다."

③ 수평선이 두 봉우리의 꼭대기에 동시에 닿는 <strong class="text-amber-300">${tex('k = 2')} 에서 교점은 정확히 4개</strong>입니다.`,

        tag: "절댓값 기호를 포함한 함수의 곱의 미분가능성",
        targetTime: "목표 시간: 3초",
        question: () => `함수 ${tex('f(x) = x - 2')} 와 일차함수 ${tex('g(x) = x - r')} 에 대하여, 곱함수 ${tex('h(x) = |f(x)|g(x)')} 가 ${tex('x = 2')} 에서 미분가능하도록 하는 상수 ${tex('r')}의 값과 그때 ${tex("h'(2)")}의 값을 구하시오.`,

  /* ---------- 3. 공통 부품 ---------- */
  // 원본 안내문(examData.hint)은 그대로 두고, 화면 위치를 가리키던 말만 새 배치(탐구 탭·조절 막대)에 맞게 바꿔 보여 줍니다.
  const hintOf = (n) => examData[n].hint;
  // 원본 snap의 p1·p2를 이 실험실의 값 이름으로 옮깁니다.
  const SNAP = {
    1: (d) => ({ m: d.p1, absType: 'in' }),
    2: (d) => ({ t: d.p1, k2: d.p2 }),
    3: (d) => ({ r: d.p1 }),
    4: (d) => ({ c4: d.p1 }),
    5: (d) => ({ c5: d.p1, k5: d.p2 })
  };
  function problemOf(mode) {
    const d = examData[mode];
    return {
      tag: d.tag,
      time: d.targetTime,
      text: d.question,
      answer: d.answerBadge,
      snap: () => ({ ...SNAP[mode](d.snap), dual: d.snap.dualView })
    };
  }
  function solutionOf(mode) {
    return {
      standardTitle: '교과서식 정석 풀이', standardTag: '정석 · 3분',
      quickTitle: '10초 컷 · 대칭·치환 풀이', quickTag: '10초 컷',
      standard: examData[mode].textbook,
      quick: examData[mode].shortcut
    };
  }
  function enterOf(mode) {
    return (s) => {
      const d = examData[mode];
      Object.assign(s, SNAP[mode](d.snap));
      s.dual = d.snap.dualView;
    };
  }
  // 위·아래 두 칠판. 두 칠판이 같은 축척(1:1)을 쓰도록 세로 범위에 비례해 높이를 나눕니다.
  const panesOf = (top, bot) => (s) => {
    if (!s.dual) return null;
    const h1 = top[1] - top[0], h2 = bot[1] - bot[0];
    const f = clamp(h1 / (h1 + h2), 0.4, 0.66);
    return [{ id: 'main', frac: f, focusY: top }, { id: 'sub', frac: 1 - f, focusY: bot }];
  };
  const actionsOf = (dualLabel, playLabel) => {
    const list = [];
    if (dualLabel) list.push({ id: 'dual', icon: 'split', label: (s) => (s.dual ? `${dualLabel} 켜짐` : dualLabel), on: (s) => s.dual, run: (s) => { s.dual = !s.dual; } });
    list.push({ id: 'play', play: true, icon: (s) => (s.playing ? 'pause' : 'play'), label: (s) => (s.playing ? '일시 정지' : playLabel), on: (s) => s.playing, run: (s) => { s.playing = !s.playing; } });
    return list;
  };
  function bounce(s, key, speed, lo, hi, dt) {
    s[key] += speed * s.animDir * dt;
    if (s[key] < lo) { s[key] = lo; s.animDir = 1; }
    if (s[key] > hi) { s[key] = hi; s.animDir = -1; }
  }

  // 휴대폰에서 두 칠판을 쓸 때는 수식 칩·상태 배지가 그림을 가리므로 패널의 안내 줄로 옮깁니다.
  const topInfo = (s, lab, chips, status) => (s.dual && lab && lab.board && lab.board.W < 640 ? { chips: [], status: null, alert: status } : { chips, status });

  // 한 칠판 그리기: (여러 칠판이면 색을 깔고 가장자리에서 자른 뒤) 격자와 축
  function stage(b, s, id, ax) {
    b.use(id);
    const c = b.ctx;
    c.save();
    if (b.panes) {
      if (id !== 'main') {
        const r = b.paneRect(id);
        c.fillStyle = b.color('halo', 0.35);
        c.fillRect(r.x, r.y, r.w, r.h);
      }
      b.clip();
    }
    if (s.grid) b.grid();
    b.axes(ax);
  }
  const paneEnd = (b) => b.ctx.restore();
  // 아래 칠판 이름표와 나눔선
  function subTitle(b, text) {
    const r = b.paneRect('sub');
    const c = b.ctx;
    c.save();
    c.strokeStyle = b.color('sky', 0.55);
    c.lineWidth = 1.5;
    c.beginPath();
    c.moveTo(r.x, r.y + 0.5);
    c.lineTo(r.x + r.w, r.y + 0.5);
    c.stroke();
    c.restore();
    b.stext(r.x + 12, r.y + 18, text, { color: 'sky', size: 12.5, align: 'left', weight: 800 });
  }
  // 위·아래 칠판을 같은 x로 잇는 세로 점선
  function linkX(b, x, color) {
    if (!b.panes) return;
    const top = b.paneRect('main'), bot = b.paneRect('sub');
    b.use('main');
    const sx = b.toS(x, 0).x;
    const c = b.ctx;
    c.save();
    c.setLineDash([5, 5]);
    c.strokeStyle = b.color(color || 'amber', 0.55);
    c.lineWidth = 1.5;
    c.beginPath();
    c.moveTo(sx, top.y + 6);
    c.lineTo(sx, bot.y + bot.h - 6);
    c.stroke();
    c.restore();
  }
  // 두 곡선 f, g 사이를 색칠(f가 위이면 pos 색, 아래이면 neg 색). 부호가 바뀌는 곳에서 조각을 나눕니다.
  function fillBetween(b, f, g, x0, x1, o) {
    if (!(x1 - x0 > 1e-6)) return;
    const N = 140;
    let piece = null;
    const flush = () => {
      if (piece && piece.top.length > 1 && piece.mx > 1e-3) {
        b.poly(piece.top.concat(piece.bot.slice().reverse()), { fill: piece.sign >= 0 ? o.pos : o.neg, fillAlpha: o.alpha == null ? 0.3 : o.alpha, color: null, ref: o.ref });
      }
      piece = null;
    };
    const add = (x, d) => {
      if (!piece) piece = { sign: 0, top: [], bot: [], mx: 0 };
      if (piece.sign === 0 && d !== 0) piece.sign = d > 0 ? 1 : -1;
      piece.top.push([x, f(x)]);
      piece.bot.push([x, g(x)]);
      piece.mx = Math.max(piece.mx, Math.abs(d));
    };
    let px = x0;
    let pd = f(x0) - g(x0);
    let last = pd === 0 ? 0 : pd > 0 ? 1 : -1; // 마지막으로 0이 아니었던 부호 (눈금에 0이 정확히 걸려도 놓치지 않게)
    add(px, pd);
    for (let i = 1; i <= N; i++) {
      const x = x0 + ((x1 - x0) * i) / N;
      const d = f(x) - g(x);
      if (d !== 0) {
        const sg = d > 0 ? 1 : -1;
        if (last !== 0 && sg !== last) {
          const xc = pd === 0 ? px : px + ((x - px) * Math.abs(pd)) / (Math.abs(pd) + Math.abs(d));
          if (pd !== 0) add(xc, 0);
          flush();
          add(xc, 0);
        }
        last = sg;
      }
      add(x, d);
      px = x;
      pd = d;
    }
    flush();
  }
  const R = (v) => Math.round(v * 100) / 100;
  // 가장자리에서 잘리지 않는 글자 라벨: 화면 안으로 밀어 넣습니다(점이 가장자리 근처일 때).
  function tag(b, p, str, o = {}) {
    const c = b.ctx;
    const size = (o.size || 12.5) * b.fs;
    c.save();
    c.font = `800 ${size}px ${b.font}`;
    const w = c.measureText(String(str)).width;
    c.restore();
    const s = b.toS(Array.isArray(p) ? { x: p[0], y: p[1] } : p);
    const al = o.align || 'center';
    const want = s.x + (o.dx || 0) - (al === 'right' ? w : al === 'left' ? 0 : w / 2);
    const left = clamp(want, 6, Math.max(6, b.W - 6 - w));
    b.text(p, str, { size: o.size || 12.5, weight: 800, ...o, align: 'left', dx: left - s.x, dy: o.dy || 0 });
  }
  // 점이 지금 보이는 범위 안에 있는가 (끝값에서 점이 화면 밖으로 나가면 라벨도 그리지 않습니다)
  const seen = (vb, x, y) => x > vb.x0 + 0.25 && x < vb.x1 - 0.25 && y > vb.y0 + 0.35 && y < vb.y1 - 0.35;

  /* ==========================================================================
     응용형 장면 공용 부품 (2026-11 추가: 기출 응용 유형 · 변형 문제 생성기)
     - 탐구 탭은 끌기·슬라이더로 직접 바꿔 보고, 정리 탭은 변형 문제의 풀이를 단계마다 그림에 드러내고,
       문제 탭은 지문에 주어진 값만 그립니다(답과 보조선은 풀이 단계를 누른 뒤에만 나옵니다).
     - 「새 문제」는 같은 유형의 숫자·상황만 바꾼 변형을 만듭니다(연속해서 같은 문제가 나오지 않게 함).
     ========================================================================== */
  const cxRint = (n) => Math.floor(Math.random() * n);
  const cxPick = (arr, not) => { let x; do x = arr[cxRint(arr.length)]; while (arr.length > 1 && x === not); return x; };
  let cxSerial = 0;
  function cxVarier(gen) { let cur = gen(null); cur.sid = ++cxSerial; return { cur: () => cur, next: () => { cur = gen(cur); cur.sid = ++cxSerial; return cur; } }; }
  const cxProb = (body) => `${body}<div style="margin-top:10px"><button type="button" class="apl-btn sm" data-cx-new>새 문제</button></div>`;
  document.addEventListener('click', (ev) => {
    const hit = ev.target && ev.target.closest && ev.target.closest('[data-cx-new]');
    if (!hit) return;
    const lab = window.lab, sc = lab && lab.scene;
    if (!sc || !sc.vary) return;
    sc.vary.next();
    lab.s.revealed = false;
    lab.setStep(0);
    try { lab._buildReview(); } catch (e) { /* 키트가 바뀌어도 그림은 그대로 */ }

      question: '절댓값을 바깥에 씌울 때 |f(x)|와 안에 씌울 때 f(|x|)는 그래프를 어떻게 바꾸고, x = 0에서 언제 미분가능할까?',
      guide: hintOf(1) + ' 점선 그래프의 <b>금색 점</b>을 좌우로 끌어도 평행이동 m이 바뀝니다.',
      controls: ['m'],
      presets: [
        { label: '① y = |f(x)| (x축 아랫부분을 위로 접어 올림)', color: 'amber', apply: (s) => { s.absType = 'out'; }, on: (s) => s.absType === 'out' },
        { label: '② y = f(|x|) (x≥0 부분을 y축에 대하여 대칭이동)', color: 'rose', apply: (s) => { s.absType = 'in'; }, on: (s) => s.absType === 'in' },
        { label: '③ y = |f(|x|)| (②의 그래프를 ①처럼 접어 올림)', color: 'violet', apply: (s) => { s.absType = 'both'; }, on: (s) => s.absType === 'both' }
      ],
      actions: actionsOf(null, '자동으로 m 바꾸기'),
      steps: examData[1].steps,
      problem: problemOf(1), solution: solutionOf(1), enter: enterOf(1),
      focus: { x: [-3.6, 3.6], y: [-2.5, 2.6] },
      tick: (s, dt) => { if (!s.playing) return false; bounce(s, 'm', 1.2, -2.2, 2.2, dt); return true; },
      view: (s) => {
        const m = s.m, slope0 = 3 * m * m - 3, smooth = same(slope0, 0), type = s.absType;
        const nm = typeName(type);
        let status;
        if (type === 'out') status = { tone: 'info', text: `${nm}: x축 아랫부분을 위로 접어 올림 · 미분가능하지 않은 점 3개` };
        else status = smooth ? { tone: 'ok', text: `x = 0 에서 미분가능 (f′(0) = ${fmt(slope0)})` } : { tone: 'warn', text: `x = 0 에서 꺾여 미분가능하지 않음 (f′(0) = ${fmt(slope0)} ≠ 0)` };
        return {
          chips: [
            { k: '함수', tex: `f(x) = (${shiftStr(m)})^3 - 3(${shiftStr(m)})`, color: 'ink' },
            { k: '변환', tex: `g(x) = ${nm}`, color: 'rose' }
          ],
          status,
          readouts: [
            { label: '평행이동 m', value: fmt(m), color: 'amber', ref: 'm' },
            { label: "f′(0) = 3m² − 3", value: fmt(slope0), color: 'sky', ref: 'slope' },
            { label: '미분가능하지 않은 점', value: type === 'out' ? '3개' : (smooth ? 'x=0 에서 0개' : 'x=0 에서 1개'), color: 'rose', ref: 'trans' },
            { label: '판정', value: type === 'in' && smooth ? '전 구간 미분가능' : '미분가능하지 않은 점이 있음', color: type === 'in' && smooth ? 'green' : 'red', wide: true }
          ],
          tape: s.step >= 3 ? { title: type === 'out'
            ? 'y = |f(x)| : x축 아랫부분을 위로 접어 올림 (f(x)=0 의 중근이 아닌 세 실근에서 그래프가 꺾임)'
            : `y = ${nm} : x≥0 부분을 y축에 대하여 대칭이동  ⇒  ${smooth ? "f′(0)=0 이므로 x=0에서 미분가능!" : "f′(0)≠0 이므로 x=0에서 꺾여 미분가능하지 않음!"}` } : null
        };
      },
      draw: (b, s) => {
        const m = s.m, type = s.absType, tf = transOf(type, m), raw = (x) => baseCubic(x - m);
        const slope0 = 3 * m * m - 3, smooth = same(slope0, 0);
        stage(b, s, 'main');
        const vb = b.viewBox();
        // 접어 올린 부분(원래 그래프가 x축 아래였던 곳)
        if (s.step >= 2 && type === 'out') fillBetween(b, tf, raw, vb.x0, vb.x1, { pos: 'violet', neg: 'violet', alpha: 0.14, ref: 'trans' });
        // Step 1: 원래 함수 y = f(x) 점선 가이드
        if (s.step >= 1) b.plot(raw, { color: 'ink', alpha: 0.5, width: 2.2, dash: true, ref: 'orig' });
        // 변환된 그래프
        b.plot(tf, { color: 'rose', width: 3.4, glow: true, ref: 'trans' });
        // Step 2: 두 갈래 접선(x=0에서 좌·우미분)
        if (s.step >= 2 && type !== 'out') {
          const y0 = tf(0), sR = originSlope(s), sL = -sR;
          const L = 1.9, nR = Math.hypot(1, sR), nL = Math.hypot(1, sL); // 길이가 같은(1:1) 짧은 접선 조각
          const pR = [L / nR, y0 + (L * sR) / nR], pL = [-L / nL, y0 - (L * sL) / nL];
          b.seg([0, y0], pR, { color: 'sky', width: 2.4, dash: true, glow: true, ref: 'slope' });
          b.seg(pL, [0, y0], { color: 'violet', width: 2.4, dash: true, glow: true, ref: 'slope' });
          if (seen(vb, pR[0], pR[1])) tag(b, pR, `우미분계수 ${fmt(sR, 1)}`, { color: 'sky', dx: 8, dy: sR > 0 ? -12 : 14, align: 'left', ref: 'slope' });
          if (seen(vb, pL[0], pL[1])) tag(b, pL, `좌미분계수 ${fmt(sL, 1)}`, { color: 'violet', dx: -8, dy: sL < 0 ? -12 : 14, align: 'right', ref: 'slope' });
        }
        // Step 3: 첨점·미분가능 표시
        if (s.step >= 3) {
          if (type === 'out') {
            [m - Math.sqrt(3), m, m + Math.sqrt(3)].forEach((rx) => {
              if (!seen(vb, rx, 0)) return;
              b.point([rx, 0], { color: 'red', r: 6, ref: 'trans' });
              tag(b, [rx, 0], `꺾이는 점 x=${fmt(rx)}`, { color: 'red', dy: 36, ref: 'trans' });
            });
          } else if (seen(vb, 0, tf(0))) {
            b.point([0, tf(0)], { color: smooth ? 'green' : 'red', r: 7, ref: 'trans' });
            tag(b, [0, tf(0)], smooth ? "x=0 미분가능 (f′(0)=0)" : `x=0 꺾임 · 우기울기≈${fmt(originSlope(s), 3)}`, { color: smooth ? 'green' : 'red', dx: 14, dy: -14, align: 'left', ref: 'trans' });
          }
        }
        // 직접 끄는 점: 점선 그래프의 극소점 → 좌우로 끌면 평행이동 m
        b.handle('m', [m + 1, -2], { color: 'amber', ref: 'm', label: `m = ${fmt(m)}`, dx: 12, dy: 20,
          drag: (w) => { s.m = clamp(round05(w.x - 1), -2.5, 2.5); } });
        paneEnd(b);
      }
    },

    /* ===== 장면 2 · |f(x)−t| = k 교점 스캔 ===== */
    {
      id: 'scan', title: '|f(x)−t|=k 의 교점의 개수', short: '교점 개수',
      question: 'y = |f(x) − t| 의 그래프와 수평선 y = k 가 만나는 점은 t와 k에 따라 몇 개가 될까?',
      guide: hintOf(2) + ' 점선 그래프의 <b>금색 점</b>(t)과 오른쪽 <b>하늘색 점</b>(k)을 위아래로 끌어 보세요.',
      controls: ['t', 'k2'],
      actions: actionsOf(null, '수평선 y=k 움직이기'),
      steps: examData[2].steps,
      problem: problemOf(2), solution: solutionOf(2), enter: enterOf(2),
      focus: { x: [-2.9, 3.1], y: [-2.4, 4.1] },
      tick: (s, dt) => { if (!s.playing) return false; bounce(s, 'k2', 1.5, 0.1, 3.2, dt); return true; },
      view: (s) => {
        const t = s.t, k = s.k2;
        const roots = foldedLevels(t, k);
        const cnt = roots.length;
        const cusp = Math.abs(t) < 2 && !same(Math.abs(t), 2) ? 3 : 1;
        return {
          chips: [
            { k: '함수', tex: 'f(x) = x^3 - 3x', color: 'ink' },
            { k: '현재 방정식 · 표시값은 근사', tex: `|f(x) - (${num(t, 3)})| = ${num(k, 3)}` + (s.step >= 3 ? ` \\;\\Rightarrow\\; ${cnt}\\text{개}` : ''), color: 'violet' }
          ],
          status: cnt === 4 ? { tone: 'ok', text: `서로 다른 실근 4개 (t = ${fmt(t)}, k = ${fmt(k)})` } : { tone: 'info', text: `서로 다른 실근 ${cnt}개` },
          readouts: [
            { label: '기준선 y = t', value: fmt(t), color: 'amber', ref: 't' },
            { label: '수평선 y = k', value: fmt(k), color: 'sky', ref: 'k' },
            { label: '미분가능하지 않은 점', value: `${cusp}개`, color: 'violet', ref: 'fold' },
            { label: '교점(실근)', value: `실근 ${cnt}개`, color: 'rose', ref: 'roots', note: roots.length ? `x = ${roots.map((x) => fmt(x)).join(', ')}` : '교점 없음' }
          ],
          tape: s.step >= 3 ? { title: `방정식 |f(x) - (${fmt(t, 1)})| = ${fmt(k)} 의 서로 다른 실근의 개수 = ${cnt}개!` } : null
        };
      },
      draw: (b, s) => {
        const t = s.t, k = s.k2;
        const guide = (x) => baseCubic(x) - t, fold = (x) => Math.abs(baseCubic(x) - t);
        stage(b, s, 'main');
        const vb = b.viewBox();
        // Step 2: 접혀 올라온 부분
        if (s.step >= 2) fillBetween(b, fold, guide, vb.x0, vb.x1, { pos: 'violet', neg: 'violet', alpha: 0.14, ref: 'fold' });
        // Step 1: f(x) − t 점선 가이드
        if (s.step >= 1) b.plot(guide, { color: 'ink', alpha: 0.45, width: 2, dash: true, ref: 'fold' });
        // 접어 올린 함수 |f(x) − t|
        b.plot(fold, { color: 'violet', width: 3.4, glow: true, ref: 'fold' });
        // 탐색 수평선 y = k 와 교점
        b.hline(k, { color: 'sky', width: 2.6, glow: true, ref: 'k' });
        const roots = foldedLevels(t, k);
        if (s.step >= 2) roots.forEach((rx, i) => {
          b.point([rx, k], { color: 'amber', r: 5.5, label: s.step >= 3 ? `${i + 1}` : '', dx: 0, dy: -13, align: 'center', size: 13, ref: 'roots' });
        });
        // 직접 끄는 점: t(점선 그래프 위의 x=0), k(오른쪽 끝의 수평선)
        b.handle('t', [0, -t], { color: 'amber', ref: 't', label: `t = ${fmt(t)}`, dx: 12, dy: -13,
          drag: (w) => { s.t = clamp(round05(-w.y), -2.5, 2.5); } });
        b.handle('k', [2.6, k], { color: 'sky', ref: 'k', priority: 1, label: `k = ${fmt(k)}`, dx: 16, dy: 0,
          drag: (w) => { s.k2 = clamp(round05(w.y), 0, 3.8); } });
        paneEnd(b);
      }
    },

          stage(b, s, 'sub', { yLabel: 'h' });

          paneEnd(b);
          subTitle(b, b.W < 640 ? '곱함수 h(x) = |f(x)|·g(x)' : '곱함수 h(x) = |f(x)| · g(x), x = 2 근처를 보세요');

    /* ===== 장면 4 · 합성함수 f(g(x)) 극값 ===== */
    {
      id: 'extrema', title: '합성함수 f(g(x)) 극값', short: '합성 극값',
      question: '바깥함수 f(u) = u³ − 3u 의 극값이 생기는 높이(u = ±1)를 안쪽함수 g(x)가 지나갈 때마다 f(g(x))의 극값은 어떻게 달라질까?',
      guide: hintOf(4) + ' 그림의 <b>금색 점</b>(꼭짓점)을 위아래로 끌어 보세요.',
      controls: ['c4'],
      actions: actionsOf('g(x)의 그래프 함께 보기', '꼭짓점 움직이기'),
      steps: examData[4].steps,
      problem: problemOf(4), solution: solutionOf(4), enter: enterOf(4),
      focus: { x: [-2.8, 2.8], y: [-2.5, 2.9] },

      tick: (s, dt) => { if (!s.playing) return false; bounce(s, 'c4', 1.2, -2.2, 2.2, dt); return true; },
      view: (s, lab) => {
        const c = s.c4, n = extremaCount(c);
        return {
          ...topInfo(s, lab, [
            { tex: `f(u) = u^3 - 3u, \\; g(x) = 0.5x^2 + (${num(c, 1)})`, color: 'ink' },
            ...(s.step >= 2 ? [{ tex: `h^{\\prime}(x) = 3x\\{(x^2/2+c)^2-1\\}`, color: 'rose' }] : [])
          ], { tone: n === 5 ? 'ok' : 'info', text: `합성함수 극값 ${n}개 (x=0 한 번 + 0이 아닌 g(x)=±1의 해 ${n - 1}개)` }),
          readouts: [
            { label: '꼭짓점 높이 c', value: fmt(c), color: 'amber', ref: 'c' },
            { label: '바깥함수 극값이 생기는 u', value: 'u = −1, 1', color: 'rose', ref: 'lines' },
            { label: '안쪽함수 극값', value: '1개 (x=0)', color: 'sky', ref: 'g' },

          ],
          tape: s.step >= 3 ? { title: `극값은 x=0 한 개와 0이 아닌 g(x)=±1의 해 ${n - 1}개, 총 ${n}개입니다. c=±1에서 겹치는 x=0은 한 번만 셉니다.` } : null
        };

        // 극값 위치 마커: x = 0 (g'=0) 및 g(x) = -1, g(x) = 1
        const xs = [];
        if (s.step >= 3) {
          if (seen(b.viewBox(), 0, comp(0))) b.point([0, comp(0)], { color: 'amber', r: 6.5, label: 'x=0 (안쪽함수 극값)', dx: 12, dy: -14, ref: 'h' });

                xs.push(xv);
              });

          });
        }
        paneEnd(b);
        if (s.dual) {
          stage(b, s, 'sub', { yLabel: 'y' });
          const vb = b.viewBox();
          // Step 2: 겉함수 f(u) 극값 높이의 수평 기준선 u = -1, u = 1
          if (s.step >= 2) {
            b.seg([vb.x0 - 1, 1], [vb.x1 + 1, 1], { color: 'rose', width: 2, dash: true, ref: 'lines' });

      ? `삼차함수 ${tex(`f(x) = (x - m)^3 - 3(x - m)${v.kk === 0 ? '' : ouSg(v.kk)}`)} 에 대하여 함수 ${tex('g(x) = f(|x|)')} 가 ${tex('x = 0')} 에서 미분가능하도록 하는 모든 양수 ${tex('m')}의 값과 그때 ${tex('g(0)')}의 값을 구하시오.`
      : `삼차함수 ${tex(`f(x) = x^3 + ax^2 + (a^2 - ${v.q * v.q})x ${v.d === 0 ? '' : ouSg(v.d)}`)} 에 대하여 함수 ${tex('g(x) = f(|x|)')} 가 ${tex('x = 0')} 에서 미분가능하도록 하는 양수 ${tex('a')}의 값과 그때 ${tex('g(-1)')}의 값을 구하시오.`),
    ans: (v) => (v.fam === 'A' ? tex(`m = ${v.m}, \\; g(0) = ${v.g0}`) : tex(`a = ${v.m}, \\; g(-1) = f(1) = ${v.gval}`)),
    steps: (v) => v.fam === 'A' ? [
      `$g(x)=f(|x|)$ 는 $x>0$ 에서 $f(x)$, $x<0$ 에서 $f(-x)$ 입니다. 그래서 $x=0$ 에서의 우미분계수는 $f'(0)$, 좌미분계수는 $-f'(0)$ 이고, 점선 그래프(예시)처럼 $f'(0)\\neq0$ 이면 꺾입니다.`,
      `미분가능하려면 $f'(0)=-f'(0)$, 즉 $f'(0)=0$ 이어야 합니다. $f'(x)=3(x-m)^2-3$ 이므로 $f'(0)=3m^2-3=0$, $m>0$ 에서 $m=${v.m}$.`,
      `이때 $g(0)=f(0)=(-${v.m})^3-3\\cdot(-${v.m})${v.kk === 0 ? '' : ouSg(v.kk)}=${v.g0}$ 입니다. 그림의 실선은 $m=${v.m}$ 일 때의 $g$ 로 $x=0$ 에서 매끄럽습니다.`
    ] : [
      `$g(x)=f(|x|)$ 는 $x>0$ 에서 $f(x)$, $x<0$ 에서 $f(-x)$ 입니다. 그래서 $x=0$ 에서의 우미분계수는 $f'(0)$, 좌미분계수는 $-f'(0)$ 이고, 점선 그래프(예시)처럼 $f'(0)\\neq0$ 이면 꺾입니다.`,
      `미분가능하려면 $f'(0)=0$. $f'(x)=3x^2+2ax+(a^2-${v.q * v.q})$ 이므로 $f'(0)=a^2-${v.q * v.q}=0$, $a>0$ 에서 $a=${v.m}$.`,
      `$g(-1)=f(|-1|)=f(1)$ 이므로 $a=${v.m}$ 일 때 $f(1)=1+${v.m}+0${v.d === 0 ? '' : ouSg(v.d)}=${v.gval}$ 입니다. 그림의 실선은 $a=${v.m}$ 일 때의 $g$ 입니다.`
    ],
    core: '<b>g(x) = f(|x|) 의 미분가능성</b><br>$x>0$ 에서는 $f(x)$, $x<0$ 에서는 $f(-x)$ 이므로 $x=0$ 에서 우미분계수는 $f\'(0)$, 좌미분계수는 $-f\'(0)$ 입니다. 미분가능하려면 $f\'(0)=0$ 이어야 하고, 그러면 그래프가 $y$축에 대칭이면서 $x=0$ 에서 매끄럽게 이어집니다.',
    draw: (b, s, v, st) => {
      const vb = b.viewBox(), ex = v.fam === 'A' ? `m = ${v.mex}` : `a = ${v.mex}`;
      if (st < 2) {
        b.plot(v.ge, { color: 'muted', width: 2.6, dash: true });
        ouTop(b, `점선은 예시 (${ex}): x = 0 에서 꺾입니다`, { color: 'muted', size: 12.5 });
        if (st >= 1) { const ge0 = v.ge(0), sl = (v.fe(0.01) - v.fe(0)) / 0.01; b.line([0, ge0], sl, { extent: 1.4, color: 'rose', width: 2, dash: true }); b.line([0, ge0], -sl, { extent: 1.4, color: 'sky', width: 2, dash: true }); b.point([0, ge0], { hollow: true, color: 'ink', r: 6.5, label: '꺾인 점', dx: 12, dy: -14, align: 'left' }); }
      } else {
        b.plot(v.ge, { color: 'muted', width: 1.6, dash: true, alpha: 0.5 });
        b.plot(v.g, { color: 'ink', width: 3.4, glow: true });
        ouTop(b, `실선: ${v.fam === 'A' ? 'm' : 'a'} = ${v.m} 일 때 y = g(x)`, { color: 'ink', size: 12.5 });
        b.point([0, v.g0], { color: 'rose', r: 6.5, label: st >= 3 ? `(0, ${v.g0})` : 'x=0', dx: 12, dy: -14, align: 'left' });
      }
      if (st >= 3 && v.fam === 'B') { b.point([1, v.gval], { color: 'green', r: 6.5, label: `f(1) = ${v.gval}`, dx: 10, dy: -14, align: 'left' }); b.point([-1, v.gval], { color: 'green', r: 6.5, label: `g(−1) = ${v.gval}`, dx: -10, dy: -14, align: 'right' }); }
      if (st >= 3 && v.fam === 'A') lbl(b, [0, v.g0], `g(0) = ${v.g0}`, { color: 'green', size: 13, dy: -34 });
    }
  });

  /* 장면 2 · |f(x) − t| = k 의 실근의 개수 */
  const cnt3 = (c) => (Math.abs(c) < 2 ? 3 : Math.abs(c) === 2 ? 2 : 1);
  function sets2(t) {
    const bp = [...new Set([2 - t, -2 - t, t - 2, t + 2].filter((k) => k > 0))].sort((a, b) => a - b);
    const items = [], tot = (k) => cnt3(t + k) + cnt3(t - k), edges = [0, ...bp];
    edges.forEach((e, i) => { const nxt = edges[i + 1]; const mid = nxt == null ? e + 1 : (e + nxt) / 2; items.push({ n: tot(mid), tex: nxt == null ? `k>${e}` : e === 0 ? `0<k<${nxt}` : `${e}<k<${nxt}`, kind: 'iv', lo: e, hi: nxt }); if (nxt != null) items.push({ n: tot(nxt), tex: `k=${nxt}`, kind: 'pt', lo: nxt, hi: nxt }); });
    return { bp, items };
  }
  ouUpgrade(scenes[1], {
    m: 2,
    gen: (prev) => {
      let t, N1, N2;
      if (!prev) { t = 0; N1 = 4; N2 = 6; }
      else {
        t = ouPick([0, 1, -1, 2, -2, 1, -1]);
        const S = sets2(t), ns = [...new Set(S.items.map((i) => i.n))].filter((n) => n >= 2);
        if (ns.length < 2) return null;
        N1 = ouPick(ns); do N2 = ouPick(ns); while (N2 === N1);
      }
      const S = sets2(t), pick = (N) => S.items.filter((i) => i.n === N), set1 = pick(N1), set2 = pick(N2);
      const f = (x) => x * x * x - 3 * x, fold = (x) => Math.abs(f(x) - t);
      const top = Math.max(6, ...S.bp.map((k) => k + 2.2));
      return { t, N1, N2, S, set1, set2, f, fold, win: { x: [-2.6, 2.6], y: [-3.4, top] }, key: [t, N1, N2].join(), chk: { t, N1, N2, set1: set1.map((i) => [i.kind, i.lo, i.hi]), set2: set2.map((i) => [i.kind, i.lo, i.hi]) } };
    },
    text: (v) => `함수 ${tex('f(x) = x^3 - 3x')} 에 대하여 ${tex('t = ' + v.t)} 일 때, 방정식 ${tex('|f(x) - t| = k \; (k > 0)')} 의 서로 다른 실근의 개수가 ${tex(String(v.N1))}개가 되는 ${tex('k')}의 값(범위)과, 실근이 ${tex(String(v.N2))}개가 되는 ${tex('k')}의 값(범위)을 구하시오.`,
    ans: (v) => `${v.N1}개: ${tex(v.set1.map((i) => i.tex).join(',\; '))}, ${v.N2}개: ${tex(v.set2.map((i) => i.tex).join(',\; '))}`,
    steps: (v) => [
      `$|f(x)-t|=k$ 는 $f(x)=t+k$ 또는 $f(x)=t-k$ 입니다. 그림에서 $y=|f(x)-t|$ (보라색)의 그래프와 수평선 $y=k$ 의 교점의 개수를 세는 것과 같습니다.`,
      `$f(x)=x^3-3x$ 는 $x=-1$ 에서 극댓값 $2$, $x=1$ 에서 극솟값 $-2$ 이므로, $y=|f(x)-t|$ 의 극점의 높이는 ` + (v.S.bp.length ? `$${v.S.bp.join(',\\,')}$` : '없음') + ` 입니다. 수평선 $y=k$ 가 이 높이를 지날 때 교점의 개수가 바뀝니다.`,
      v.S.items.map((i) => `$${i.tex}$ : ${i.n}개`).join(', ') + `. 따라서 ${v.N1}개가 되는 것은 $${v.set1.map((i) => i.tex).join(',\\,')}$, ${v.N2}개가 되는 것은 $${v.set2.map((i) => i.tex).join(',\\,')}$ 입니다.`
    ],
    core: '<b>|f(x) − t| = k 의 실근의 개수</b><br>$f(x)=t+k$ 와 $f(x)=t-k$ 의 근을 합친 것이므로, $y=|f(x)-t|$ 의 그래프와 수평선 $y=k$ 의 교점을 세면 됩니다. 수평선이 그래프의 극점의 높이를 지나는 $k$ 값에서 개수가 바뀌고, 접하는 순간은 따로 셉니다.',
    draw: (b, s, v, st) => {
      const vb = b.viewBox();
      b.plot(v.f, { color: 'ink', width: 2.2, alpha: 0.65 });
      b.seg([vb.x0, v.t], [vb.x1, v.t], { color: 'muted', width: 1.4, dash: true });
      lbl(b, [vb.x0 + 0.15, v.t], `y = t = ${v.t}`, { color: 'muted', size: 12, align: 'left', dy: 14 });
      b.plot(v.fold, { color: 'violet', width: 3.2, glow: true });
      ouCurveTag(b, v.f, 'y = f(x)', 'ink', { side: 'left', dy: -10, skip: [[-1, 2, 1.4], [1, -2, 1.4]] });
      ouCurveTag(b, v.fold, 'y = |f(x) − t|', 'violet', { side: 'right', dy: -12, skip: [[-1, v.fold(-1), 1.4], [1, v.fold(1), 1.4]] });
      if (st >= 1) [-1, 1].forEach((x) => b.point([x, v.fold(x)], { hollow: true, color: 'violet', r: 6, label: `높이 ${Math.round(v.fold(x))}`, dx: x < 0 ? -10 : 10, dy: -14, align: x < 0 ? 'right' : 'left' }));
      if (st >= 2) v.S.bp.forEach((k) => { b.seg([vb.x0, k], [vb.x1, k], { color: 'amber', width: 1.8, dash: true }); lbl(b, [vb.x1 - 0.15, k], `k = ${k}`, { color: 'amber', size: 12.5, align: 'right', dy: -12 }); });
      if (st >= 3) {
        const edges = [0, ...v.S.bp, v.S.bp.length ? v.S.bp[v.S.bp.length - 1] + 2 : 2];
        v.S.items.filter((i) => i.kind === 'iv').forEach((i, idx) => lbl(b, [vb.x0 + 0.2, (edges[idx] + edges[idx + 1]) / 2], `${i.n}개`, { color: 'green', size: 13, align: 'left' }));
        v.S.items.filter((i) => i.kind === 'pt').forEach((i) => lbl(b, [vb.x1 - 0.15, i.lo], `${i.n}개`, { color: 'green', size: 13, align: 'right', dy: 20 }));
      }
    }
  });

  /* 장면 3 · |f(x)|·g(x)의 미분가능성 */
  ouUpgrade(scenes[2], {
    m: 3,
    gen: (prev) => {
      let fam, c, u, p, c1, c2, k;
      if (!prev) { fam = 'lin'; c = 2; u = 1; p = 1; }
      else if (ouRint(3) === 0) { fam = 'quad'; [c1, c2] = ouPick([[-2, 2], [-1, 3], [-3, 1], [0, 2], [-2, 0], [1, 3], [-1, 1], [-3, 0]]); k = ouPick([1, 2, -1]); }
      else { fam = 'lin'; c = ouPick([2, 1, -1, 3, -2]); u = ouPick([1, 2, -1]); p = ouPick([1, 2, -1, 3]); }
      if (fam === 'lin') {
        const f = (x) => u * (x - c), g = (x) => p * (x - c), h = (x) => Math.abs(f(x)) * g(x), r = p * c;
        const win = ouWinF([(x) => Math.abs(f(x)), h], [c - 2.2, c + 2.2], { pts: [[c, 0]], mx: 0.8, my: 1.3, minW: 6.4, minH: 5 });
        if (prev && win.y[1] - win.y[0] > 12) return null;
        return { fam, c, u, p, r, f, g, h, win, key: [fam, c, u, p].join(), chk: { fam, c, u, p, r } };
      }
      const s = c1 + c2, t0 = c1 * c2, f = (x) => (x - c1) * (x - c2), g = (x) => k * (x - c1) * (x - c2), h = (x) => Math.abs(f(x)) * g(x), P = -k * s, Q = k * t0, h0 = Math.abs(t0) * Q;
      const win = ouWinF([(x) => Math.abs(f(x)), h], [c1 - 0.8, c2 + 0.8], { pts: [[c1, 0], [c2, 0], [0, h0]], mx: 1.0, my: 1.3, minW: 6.4, minH: 5 });
      if (prev && win.y[1] - win.y[0] > 14) return null;
      return { fam, c1, c2, k, s, t0, P, Q, h0, f, g, h, win, key: [fam, c1, c2, k].join(), chk: { fam, c1, c2, k, P, Q, h0 } };
    },
    text: (v) => (v.fam === 'lin'
      ? `함수 ${tex(`f(x) = ${ouPoly([v.u, -v.u * v.c])}`)} 와 일차함수 ${tex(`g(x) = ${ouTerm(v.p, 'x')} - r`)} 에 대하여, 곱함수 ${tex('h(x) = |f(x)|g(x)')} 가 ${tex('x = ' + v.c)} 에서 미분가능하도록 하는 상수 ${tex('r')}의 값과 그때 ${tex(`h'(${v.c})`)}의 값을 구하시오.`
      : `함수 ${tex(`f(x) = ${ouPoly([1, -v.s, v.t0])}`)} 와 이차함수 ${tex(`g(x) = ${ouCo(v.k)}x^2 + px + q`)} 에 대하여, 곱함수 ${tex('h(x) = |f(x)|g(x)')} 가 실수 전체의 집합에서 미분가능할 때, 상수 ${tex('p, q')}의 값과 ${tex('h(0)')}의 값을 구하시오.`),
    ans: (v) => (v.fam === 'lin' ? tex(`g(${v.c}) = 0 \\implies r = ${v.r}, \; h'(${v.c}) = 0`) : tex(`p = ${v.P}, \; q = ${v.Q}, \; h(0) = ${v.h0}`)),
    steps: (v) => v.fam === 'lin' ? [
      `$f(${v.c})=0$ 이므로 $|f(x)|$ 는 $x=${v.c}$ 에서 꺾입니다(그림의 V자). $x>${v.c}$ 에서 $h=${Math.abs(v.u)}(x-${ouPar(v.c)})g(x)$, $x<${v.c}$ 에서 $h=-${Math.abs(v.u)}(x-${ouPar(v.c)})g(x)$ 이므로 우미분계수는 $${Math.abs(v.u)}\\,g(${v.c})$, 좌미분계수는 $-${Math.abs(v.u)}\\,g(${v.c})$ 입니다.`,
      `미분가능하려면 두 값이 같아야 하므로 $g(${v.c})=0$ 이고, $g(${v.c})=${v.p}\\cdot ${ouPar(v.c)}-r=0$ 에서 $r=${v.r}$. 그림에서 $g$ 가 $x=${v.c}$ 에서 $0$ 이 됩니다.`,
      `이때 좌미분계수와 우미분계수가 모두 $\\pm${Math.abs(v.u)}\\cdot 0=0$ 이므로 $h'(${v.c})=0$ 입니다. 그림의 $h$ 는 $x=${v.c}$ 에서 수평하게 지나며 매끄럽습니다.`
    ] : [
      `$f(x)=(x-${ouPar(v.c1)})(x-${ouPar(v.c2)})$ 이므로 $|f(x)|$ 는 $x=${v.c1}$, $x=${v.c2}$ 두 곳에서 꺾입니다. 각 점 $c$ 에서 $h$ 의 우미분계수는 $|f'(c)|\\,g(c)$, 좌미분계수는 $-|f'(c)|\\,g(c)$ 입니다.`,
      `미분가능하려면 $g(${v.c1})=g(${v.c2})=0$ 이어야 하므로 $g(x)=${ouCo(v.k)}(x-${ouPar(v.c1)})(x-${ouPar(v.c2)})=${ouPoly([v.k, v.P, v.Q])}$, 즉 $p=${v.P}$, $q=${v.Q}$.`,
      `$h(0)=|f(0)|\\,g(0)=|${v.t0}|\\cdot ${ouPar(v.Q)}=${v.h0}$ 입니다.`
    ],
    core: '<b>|f(x)|·g(x) 의 미분가능성</b><br>$f(c)=0$, $f^{\\prime}(c)\\ne0$인 단순한 영점에서 $|f(x)|$가 꺾입니다. $g$가 그 점에서 미분가능할 때 $|f|\\,g$가 미분가능할 필요충분조건은 $g(c)=0$입니다. ($g(c)$ 가 곱해진 우·좌미분계수 $\\pm|f\'(c)|\\,g(c)$ 가 같아야 하기 때문)',
    draw: (b, s, v, st) => {
      const cs = v.fam === 'lin' ? [v.c] : [v.c1, v.c2], vb = b.viewBox();
      b.plot((x) => Math.abs(v.f(x)), { color: 'ink', width: 3.2, glow: true });
      ouCurveTag(b, (x) => Math.abs(v.f(x)), 'y = |f(x)|', 'ink', { side: v.fam === 'lin' ? 'left' : 'right', dy: -12, skip: cs.map((c) => [c, 0, 1.5]) });
      cs.forEach((c) => { b.seg([c, vb.y0], [c, vb.y1], { color: 'amber', width: 1.4, dash: true, alpha: 0.55 }); lbl(b, [c, vb.y0 + (vb.y1 - vb.y0) * 0.07], `x = ${c}`, { color: 'amber', dx: 6, align: 'left' }); });
      if (st >= 1) cs.forEach(c => b.point([c, 0], { color: 'amber', r: 6, ref: 'abs' }));
      if (st >= 2) { b.plot(v.g, { color: 'sky', width: 2.8, glow: true }); cs.forEach((c) => b.point([c, 0], { color: 'sky', r: 6, label: `g(${c}) = 0`, dx: 0, dy: 22, align: 'center' })); ouCurveTag(b, v.g, 'y = g(x)', 'sky', { side: 'left', dy: 18, skip: cs.map((c) => [c, 0, 1.5]), axis: 0.5 }); }
      if (st >= 3) { b.plot(v.h, { color: 'violet', width: 3.2, glow: true }); ouCurveTag(b, v.h, 'y = h(x)', 'violet', { side: 'right', dy: 16, skip: cs.map((c) => [c, 0, 1.5]) }); }
      if (st >= 3) {
        if (v.fam === 'lin') { b.seg([v.c - 1.2, 0], [v.c + 1.2, 0], { color: 'green', width: 2.4 }); ouTop(b, `r = ${v.r},  h′(${v.c}) = 0`, { color: 'green', size: 13 }); }
        else { b.point([0, v.h0], { color: 'green', r: 6.5, label: `h(0) = ${v.h0}`, dx: 12, dy: -14, align: 'left' }); ouTop(b, `p = ${v.P}, q = ${v.Q}`, { color: 'green', size: 13 }); }
      }
    }
  });

  /* 장면 4 · 합성함수 f(g(x)) 의 극값의 개수 */
  ouUpgrade(scenes[3], {
    m: 4,
    gen: (prev) => {
      let a, c;
      if (!prev) { a = ouQ(1, 2); c = -2; } else { a = ouPick([ouQ(1, 2), ouQ(1), ouQ(-1, 2), ouQ(-1), ouQ(2), ouQ(1, 2)]); c = ouPick([-3, -2, -1, 0, 1, 2, 3]); }
      const pos1 = ouQ(1 - c).div(a), neg1 = ouQ(-1 - c).div(a);
      const xs = [0];
      const roots = (q) => (q.sgn > 0 ? [-1, 1].map((sg) => ({ x: sg * Math.sqrt(q.v), q })) : []);
      const r1 = roots(pos1), r2 = roots(neg1);
      const ext = [{ x: 0 }, ...r1, ...r2], n = 1 + r1.length + r2.length;
      const gx = (x) => a.v * x * x + c, f = (u) => u * u * u - 3 * u, h = (x) => f(gx(x));
      const xr = Math.max(2.4, ...ext.map((e) => Math.abs(e.x)) ) + 1.2;
      const hv = ext.map((e) => h(e.x));
      const win = { x: [-xr, xr], y: [Math.min(-3, ...hv, c) - 1.3, Math.max(3, ...hv, c) + 1.3] };
      if (prev && win.y[1] - win.y[0] > 15) return null;
      return { a, c, pos1, neg1, r1, r2, ext, n, gx, h, win, key: [a.txt, c].join(), chk: { a: a.v, c, n } };
    },
    text: (v) => `삼차함수 ${tex('f(u) = u^3 - 3u')} (${tex('u=-1')}에서 극대, ${tex('u=1')}에서 극소)와 이차함수 ${tex(`g(x) = ${ouCoQ(v.a)}x^2${v.c === 0 ? '' : ouSg(v.c)}`)} 에 대하여, 합성함수 ${tex('h(x) = f(g(x))')} 가 극값을 갖는 모든 ${tex('x')}의 개수를 구하시오.`,
    ans: (v) => tex(String(v.n)),
    steps: (v) => {
      const desc = (q, val) => (q.sgn > 0 ? `$x^2=${q.tex}$ 에서 $x=\\pm ${ouSqrt(q.n, q.d).tex}$ (2개)` : q.n === 0 ? `$x^2=0$ 에서 $x=0$ (앞에서 센 점과 같습니다)` : `$x^2=${q.tex}\\lt 0$ 이므로 실근 없음`);
      return [
        `$h'(x)=f'(g(x))\\,g'(x)=3\\{g(x)^2-1\\}\\,g'(x)$ 이므로 $h'(x)=0$ 이 되는 곳은 $g'(x)=0$ 또는 $g(x)=\\pm1$ 입니다. 그림에서 $y=g(x)$ (보라색 점선)가 수평선 $y=1$, $y=-1$ 과 만나는 곳을 찾습니다.`,
        `$g'(x)=${ouCoQ(v.a.mul(2))}x=0$ 에서 $x=0$. $g(x)=1$: ${desc(v.pos1)}. $g(x)=-1$: ${desc(v.neg1)}.`,
        `0이 아닌 후보는 도함수의 단근입니다. $x=0$은 $c\\ne\\pm1$이면 단근, $c=\\pm1$이면 삼중근이므로 모두 부호가 바뀝니다. 겹친 $x=0$을 한 번만 세면 극값을 갖는 $x$ 는 모두 ${v.n}개입니다.`
      ];
    },
    core: '<b>합성함수의 극값</b><br>$h(x)=f(g(x))$ 의 도함수는 $h\'(x)=f\'(g(x))\\,g\'(x)$ 입니다. $g\'(x)=0$ 인 $x$ 와 $f\'(g(x))=0$ 인 $x$ (이 문항은 $g(x)=\\pm1$) 에서 $h\'$ 의 부호가 바뀌는지 확인해 극값의 개수를 셉니다.',
    draw: (b, s, v, st) => {
      const vb = b.viewBox();
      b.plot(v.h, { color: 'ink', width: 3.2, glow: true });
      ouCurveTag(b, v.h, 'y = f(g(x))', 'ink', { side: 'left', dy: -10, skip: v.ext.map((e) => [e.x, v.h(e.x), 1.6]) });
      if (st >= 1) {
        b.plot(v.gx, { color: 'violet', width: 2.4, dash: true });
        [1, -1].forEach((y) => { b.seg([vb.x0, y], [vb.x1, y], { color: 'amber', width: 1.6, dash: true }); lbl(b, [vb.x1 - 0.15, y], `y = ${y}`, { color: 'amber', size: 12.5, align: 'right', dy: y > 0 ? -12 : 16 }); });
        ouCurveTag(b, v.gx, 'y = g(x)', 'violet', { side: v.a.v > 0 ? 'right' : 'left', dy: v.a.v > 0 ? -12 : 16, skip: [[0, v.c, 1.5]] });
      }
      if (st >= 2) v.ext.forEach((e) => { b.seg([e.x, 0], [e.x, v.h(e.x)], { color: 'rose', width: 1.4, dash: true, alpha: 0.7 }); b.point([e.x, v.h(e.x)], { color: 'rose', r: 6 }); });
      if (st >= 3) lbl(b, [0, vb.y0 + (vb.y1 - vb.y0) * 0.09], `극값을 갖는 x : ${v.n}개`, { color: 'green', size: 13.5 });
    }
  });

  /* 장면 5 · f(g(x)) = 0 을 두 단계로 */
  ouUpgrade(scenes[4], {
    m: 5,
    gen: (prev) => {
      let roots, a, c;
      if (!prev) { roots = [{ val: -Math.sqrt(3), tex: '-\\sqrt{3}', txt: '−√3' }, { val: 0, tex: '0', txt: '0' }, { val: Math.sqrt(3), tex: '\\sqrt{3}', txt: '√3' }]; a = ouQ(1, 2); c = -1; }
      else {
        const rs = []; while (rs.length < 3) { const r = ouPick([-3, -2, -1, 0, 1, 2, 3]); if (!rs.includes(r)) rs.push(r); }
        rs.sort((p, q) => p - q); roots = rs.map((r) => ({ val: r, tex: String(r), txt: r < 0 ? `−${-r}` : String(r) }));
        a = ouPick([ouQ(1, 2), ouQ(1), ouQ(-1, 2), ouQ(-1), ouQ(2)]); c = ouPick([-3, -2, -1, 0, 1, 2, 3]);
      }
      const per = roots.map((r) => { const q = (r.val - c) / a.v; return { r, q, k: q > 1e-9 ? 2 : Math.abs(q) < 1e-9 ? 1 : 0 }; });
      const n = per.reduce((t, p) => t + p.k, 0);
      const gx = (x) => a.v * x * x + c, xsAll = per.filter((p) => p.k).flatMap((p) => (p.k === 2 ? [-Math.sqrt(p.q), Math.sqrt(p.q)] : [0]));
      const xr = Math.max(2.4, ...xsAll.map(Math.abs)) + 1.2, ys = [...roots.map((r) => r.val), c];
      const win = { x: [-xr, xr], y: [Math.min(...ys) - 1.4, Math.max(...ys) + 1.4] };
      if (prev && (win.y[1] - win.y[0] > 12 || (win.x[1] - win.x[0]) > 12)) return null;
      const co = ouMul(ouMul([1, -roots[0].val], [1, -roots[1].val]), [1, -roots[2].val]);
      return { roots, a, c, per, n, gx, xsAll, co, win, key: [roots.map((r) => r.txt), a.txt, c].join(), chk: { roots: roots.map((r) => r.val), a: a.v, c, n } };
    },
    text: (v) => `삼차함수 ${tex('f(u) = ' + (v.roots[0].val === -Math.sqrt(3) ? 'u^3 - 3u' : ouPoly(v.co, 'u')))} 와 이차함수 ${tex(`g(x) = ${ouCoQ(v.a)}x^2${v.c === 0 ? '' : ouSg(v.c)}`)} 에 대하여 방정식 ${tex('f(g(x)) = 0')} 의 서로 다른 실근의 개수를 구하시오.`,
    ans: (v) => tex(String(v.n)),
    steps: (v) => [
      `$f(u)=0$ 의 해는 $u=${v.roots.map((r) => r.tex).join(',\\,')}$ 입니다. 따라서 $f(g(x))=0$ 은 $g(x)$ 가 이 값 중 하나일 때입니다. 그림에서 수평선 $y=${v.roots.map((r) => r.tex).join('$, $y=')}$ 를 긋습니다.`,
      `각 값 $u$ 에 대해 $g(x)=u$ 의 실근의 개수를 셉니다. ` + v.per.map((p) => `$g(x)=${p.r.tex}$: ${p.k === 2 ? '2개' : p.k === 1 ? '1개' : '0개'}`).join(', ') + `. (그림에서 $y=g(x)$ 와 수평선의 교점의 개수)`,
      `모두 더하면 ${v.per.map((p) => p.k).join('+')} = ${v.n}개 입니다. (서로 다른 $u$ 값에서 나온 $x$ 는 서로 다릅니다.)`
    ],
    core: '<b>합성함수의 방정식은 두 단계로</b><br>$f(g(x))=0$ 은 ① $f(u)=0$ 의 해 $u=r_1,r_2,\\dots$ 를 구하고, ② 각각에 대해 $g(x)=r_i$ 의 실근의 개수를 센 뒤 더합니다. $g(x)=r$ 의 근의 개수는 $y=g(x)$ 와 수평선 $y=r$ 의 교점의 개수입니다.',
    draw: (b, s, v, st) => {
      const vb = b.viewBox();
      b.plot(v.gx, { color: 'ink', width: 3.2, glow: true });
      ouCurveTag(b, v.gx, 'y = g(x)', 'ink', { side: v.a.v > 0 ? 'right' : 'left', dy: v.a.v > 0 ? -12 : 16 });
      if (st >= 1) v.roots.forEach((r) => { b.seg([vb.x0, r.val], [vb.x1, r.val], { color: 'rose', width: 1.8, dash: true }); lbl(b, [vb.x0 + 0.15, r.val], `u = ${r.txt}`, { color: 'rose', size: 12.5, align: 'left', dy: -12 }); });
      if (st >= 2) v.per.forEach((p) => { if (p.k === 2) [-1, 1].forEach((sg) => b.point([sg * Math.sqrt(p.q), p.r.val], { color: 'violet', r: 6 })); else if (p.k === 1) b.point([0, p.r.val], { color: 'violet', r: 6 }); });
      if (st >= 3) lbl(b, [0, vb.y1 - (vb.y1 - vb.y0) * 0.08], `서로 다른 실근 ${v.n}개`, { color: 'green', size: 13.5 });
    }
  });

  })();
  /* OU-END */

  APLab.createLab({
    id: 'calc1-composite',
    stagedReveal: true,
    title: '합성함수 · 절댓값 그래프',
    courseName: '미적분Ⅰ',
    unit: '함수 · 합성함수와 절댓값',
    courseColor: 'var(--m-orange)',
    home: '../index.html#calc1',
    legacy: '../../labs/미적분1/합성함수·절댓값 그래프.html',
    board: { kind: 'cartesian', focus: { x: [-3.6, 3.6], y: [-2.5, 2.6] }, pad: 0.04 },
    params: {
      m: { value: 1, min: -2.5, max: 2.5, step: 0.05, color: 'amber', label: '평행이동 m', hint: 'm = 1 에서 f(|x|)가 x = 0 에서 미분가능합니다', format: (v) => `m = ${fmt(v)}` },
      t: { value: 0, min: -2.5, max: 2.5, step: 0.05, color: 'amber', label: '기준선 y = t', hint: '점선 그래프 y = f(x) − t 의 x축 아랫부분이 위로 접혀 올라옵니다', format: (v) => `t = ${fmt(v)}` },
      k2: { value: 2, min: 0, max: 3.8, step: 0.05, color: 'sky', label: '수평선 y = k', hint: 't = 0, k = 2 일 때 교점이 정확히 4개', format: (v) => `k = ${fmt(v)}` },
      r: { value: 2, min: -1.5, max: 2.5, step: 0.05, color: 'amber', label: 'g(x) = x − r 의 x절편 r', hint: 'r = 2 에서 x = 2 의 꺾임이 사라집니다', format: (v) => `r = ${fmt(v)}` },
      c4: { value: -2, min: -2.5, max: 2.5, step: 0.05, color: 'amber', label: '안쪽함수 꼭짓점 높이 c', hint: 'g(x) = 0.5x² + c', format: (v) => `c = ${fmt(v)}` },
      c5: { value: -1, min: -2.5, max: 2.5, step: 0.05, color: 'amber', label: 'g(x) 최솟값 c', hint: 'g(x) = 0.5x² + c', format: (v) => `c = ${fmt(v)}` },
      k5: { value: 0, min: -2.5, max: 2.5, step: 0.05, color: 'sky', label: '우변 상수 k', hint: 'f(u) = k 의 실근 u₁, u₂, u₃', format: (v) => `k = ${fmt(v)}` },
      cp: { value: 0.5, min: -1.8, max: 1.8, step: 0.05, color: 'amber', label: '접점 P의 x좌표 p', hint: 'P를 곡선 위에서 움직입니다', format: (v) => `p = ${fmt(v)}` },
      cm: { value: 1, min: -4, max: 7, step: 0.05, color: 'sky', label: '직선 g의 기울기 m', hint: 'm = f′(p) 이면 g는 P에서의 접선입니다', format: (v) => `m = ${fmt(v)}` },
      gp: { value: 1, min: 0.2, max: 3.6, step: 0.05, color: 'amber', label: '오른쪽 조각을 가져오는 위치 p', hint: 'p = 2 에서 두 기울기가 같아집니다', format: (v) => `p = ${fmt(v)}` }
    },
    state: { absType: 'in', dual: false, animDir: -1, mk: 'max' },
    persist: ['absType', 'dual'],
    scenes
  });
});
