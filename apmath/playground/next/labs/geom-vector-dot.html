    function normalizeAngleDiff(targetRad, startRad) {
      let diff = targetRad - startRad;
      while (diff > Math.PI) diff -= Math.PI * 2;
      while (diff < -Math.PI) diff += Math.PI * 2;
      return diff;
    }

    function wrapAnglePositive(rad) {
      let a = rad % (Math.PI * 2);
      if (a < 0) a += Math.PI * 2;
      return a;

  /* ===== 셸 상태(s)에서 원본 state 모양 만들기 ===== */
  function use(s) {
    state = {
      mode: +s.sid, conceptSwitch: s.lens, activePartIdx: s.part == null ? null : s.part,
      A1: { x: s.A1x, y: 0 }, B1: { x: s.B1x, y: s.B1y },
      A2: { x: s.A2x, y: s.A2y }, B2: { x: s.B2x, y: s.B2y },
      A3: { x: 3, y: 4 }, C3: { x: 2, y: 1 }, r34: s.r34, theta34: s.th34 * D2R,
      A4: { x: -2, y: -2.5 }, B4: { x: 2, y: -2.5 }, C4: { x: 3, y: 1.5 },
      steps: { 1: s.step >= 1, 2: s.step >= 2, 3: s.step >= 3 },
      scale: BD ? BD.k : 44

    return state;
  }

  /* ===== 원본의 그리기 환경 → 새 무대 엔진 연결 ===== */
  // 원본 코드가 쓰는 ctx 직접 그리기: 색은 테마 의미색으로 바꾸고(칠판·종이 모두 대응), 종이 테마에서는 번쩍임(그림자)을 끕니다.
  const ctx = new Proxy({}, {

    set(_, k, v) {

      c[k] = v;
      return true;
    }
  });
  const toScreen = (x, y) => BD.toS(x, y);
  // [2.0 수정] 글자가 무대 가장자리나 위쪽 칩·아래쪽 도구에 가려지지 않게 안으로 밀어 넣습니다.

  const clampY = (y) => clamp(y, (BD.insets.top || 0) + 14, Math.max(30, BD.H - (BD.insets.bottom || 0) - 6));
  // [2.0 수정] 먼저 놓인 글자와 겹치면 위·아래로 비켜 놓습니다(예: 동점 P가 최대점과 같은 자리일 때).
  const LBOX = [];
  function placeLabel(x0, y, w) {
    const hit = (yy) => LBOX.some((q) => x0 < q.x1 && x0 + w > q.x0 && yy - 12 < q.y1 && yy + 4 > q.y0);
    let yy = clampY(y);

  function setTape(text) { TAPE = text; } // 원본 하단 상자 → 하단 띠

  /* ===== 원본 그대로: 조각 하이라이트·관찰 렌즈 가시성 (원본 877–891행) ===== */
    function isLayerVisible(stepNum, lensGroup) {
      if (!state.steps[stepNum]) return false;
      if (state.conceptSwitch === 'all') return true;
      return state.conceptSwitch === lensGroup;
    }

    function applyPartStyle(partIdx, baseWidth = 2, baseBlur = 8) {
      if (state.activePartIdx === null || partIdx === undefined) {
        return { alpha: 1.0, width: baseWidth, blur: baseBlur };
      }
      if (state.activePartIdx === partIdx) {
        return { alpha: 1.0, width: baseWidth + 2.0, blur: Math.max(20, baseBlur * 2.5) };
      }
      return { alpha: 0.25, width: baseWidth, blur: 0 };
    }
  /* ===== 원본 그대로: 분필 그리기 도우미 (원본 896–1012행, 글자 안으로 밀어 넣기만 추가) ===== */
    function drawChalkLine(x1, y1, x2, y2, color = '#ffffff', width = 2, dashed = false, glow = false, partIdx = undefined) {
      const p1 = toScreen(x1, y1);
      const p2 = toScreen(x2, y2);
      const st = applyPartStyle(partIdx, width, glow ? 10 : 0);

      ctx.save();
      ctx.globalAlpha = st.alpha;
      ctx.beginPath();
      if (dashed) ctx.setLineDash([6, 6]);
      ctx.strokeStyle = color;
      ctx.lineWidth = st.width;
      ctx.lineCap = 'round';
      if (st.blur > 0) {
        ctx.shadowColor = color;
        ctx.shadowBlur = st.blur;
      }
      ctx.moveTo(p1.x, p1.y);
      ctx.lineTo(p2.x, p2.y);
      ctx.stroke();
      ctx.restore();
    }
    function drawVectorArrow(x1, y1, x2, y2, color = '#fbbf24', width = 3, label = '', dashed = false, labelOffset = { x: 0, y: -12 }, partIdx = undefined) {
      const p1 = toScreen(x1, y1);
      const p2 = toScreen(x2, y2);
      const dx = p2.x - p1.x;
      const dy = p2.y - p1.y;
      const len = Math.hypot(dx, dy);
      if (len < 2) return;

      const st = applyPartStyle(partIdx, width, dashed ? 4 : 10);
      const angle = Math.atan2(dy, dx);
      const headLen = Math.min(14, Math.max(9, st.width * 4.0));

      ctx.save();
      ctx.globalAlpha = st.alpha;
      ctx.strokeStyle = color;
      ctx.fillStyle = color;
      ctx.lineWidth = st.width;
      ctx.lineCap = 'round';
      ctx.shadowColor = color;
      ctx.shadowBlur = st.blur;

      if (dashed) ctx.setLineDash([6, 5]);
      ctx.beginPath();
      ctx.moveTo(p1.x, p1.y);
      ctx.lineTo(p2.x - Math.cos(angle) * (headLen * 0.5), p2.y - Math.sin(angle) * (headLen * 0.5));
      ctx.stroke();

      ctx.setLineDash([]);
      ctx.beginPath();
      ctx.moveTo(p2.x, p2.y);
      ctx.lineTo(p2.x - headLen * Math.cos(angle - Math.PI / 6.5), p2.y - headLen * Math.sin(angle - Math.PI / 6.5));
      ctx.lineTo(p2.x - headLen * 0.72 * Math.cos(angle), p2.y - headLen * 0.72 * Math.sin(angle));
      ctx.lineTo(p2.x - headLen * Math.cos(angle + Math.PI / 6.5), p2.y - headLen * Math.sin(angle + Math.PI / 6.5));
      ctx.closePath();
      ctx.fill();

      if (label) {
        const mx = (p1.x + p2.x) / 2 + labelOffset.x;
        const my = (p1.y + p2.y) / 2 + labelOffset.y;
        ctx.shadowColor = 'rgba(0,0,0,0.95)';
        ctx.shadowBlur = 6;
        ctx.font = 'bold 13px Pretendard, monospace';
        ctx.textAlign = 'center';
        const lw = ctx.measureText(label).width, lx = clampX(mx - lw / 2, lw); ctx.fillText(label, lx + lw / 2, placeLabel(lx, my, lw)); // [2.0 수정] 글자를 무대 안으로·겹치지 않게
      }
      ctx.restore();
    }
    function drawChalkPoint(x, y, radius = 5.5, color = '#fbbf24', label = '', labelOffset = { x: 10, y: -10 }, partIdx = undefined) {
      const pt = toScreen(x, y);
      const st = applyPartStyle(partIdx, 2, 12);

      ctx.save();
      ctx.globalAlpha = st.alpha;
      ctx.beginPath();
      ctx.arc(pt.x, pt.y, state.activePartIdx === partIdx && partIdx !== undefined ? radius + 2 : radius, 0, Math.PI * 2);
      ctx.fillStyle = color;
      ctx.shadowColor = color;
      ctx.shadowBlur = st.blur;
      ctx.fill();
      ctx.lineWidth = 2;
      ctx.strokeStyle = '#ffffff';
      ctx.stroke();

      if (label) {
        ctx.shadowBlur = 5;
        ctx.shadowColor = 'rgba(0,0,0,0.95)';
        ctx.font = 'bold 13px Pretendard, sans-serif';
        ctx.fillStyle = color;
        const lw = ctx.measureText(label).width, lx = clampX(pt.x + labelOffset.x, lw); ctx.fillText(label, lx, placeLabel(lx, pt.y + labelOffset.y, lw)); // [2.0 수정] 글자를 무대 안으로·겹치지 않게
      }
      ctx.restore();
    }
    function drawRightAngleMark(foot, dirAlongLine, dirToPoint, sizePx = 11, color = '#fbbf24', partIdx = undefined) {
      const pFoot = toScreen(foot.x, foot.y);
      const u = { x: dirAlongLine.x, y: -dirAlongLine.y };
      const v = { x: dirToPoint.x, y: -dirToPoint.y };

      const p1 = { x: pFoot.x + u.x * sizePx, y: pFoot.y + u.y * sizePx };
      const p2 = { x: p1.x + v.x * sizePx, y: p1.y + v.y * sizePx };
      const p3 = { x: pFoot.x + v.x * sizePx, y: pFoot.y + v.y * sizePx };
      const st = applyPartStyle(partIdx, 1.6, 6);

      ctx.save();
      ctx.globalAlpha = st.alpha;
      ctx.beginPath();
      ctx.strokeStyle = color;
      ctx.lineWidth = st.width;
      ctx.moveTo(p1.x, p1.y);
      ctx.lineTo(p2.x, p2.y);
      ctx.lineTo(p3.x, p3.y);
      ctx.stroke();
      ctx.restore();
    }
  /* [표시 보강] 각·평행·같은 길이 표시 도우미 */
    // 꼭짓점 v에서 반직선 p1→p2 사이 각을 호+각도 값(°)으로 표시(같은 각은 같은 색·같은 기호로 호출)
    function markAngle(v, p1, p2, color, label, r = 28) {
      BD.angle([v.x, v.y], [p1.x, p1.y], [p2.x, p2.y], { r, color, label, size: 11.5, labelGap: 13 });
    }
    function degBetween(v, p1, p2) {
      const ax = p1.x - v.x, ay = p1.y - v.y, bx = p2.x - v.x, by = p2.y - v.y;
      const k = (ax * bx + ay * by) / ((Math.hypot(ax, ay) * Math.hypot(bx, by)) || 1);
      return Math.acos(Math.max(-1, Math.min(1, k))) * 180 / Math.PI;
    }
    function parallelMark(p, q, color = '#fbbf24') {
      const a = toScreen(p.x, p.y), b = toScreen(q.x, q.y), L = Math.hypot(b.x - a.x, b.y - a.y) || 1;
      if (L < 40) return;
      const d = { x: (b.x - a.x) / L, y: (b.y - a.y) / L }, n = { x: -d.y, y: d.x }, t = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
      BD.ctx.save(); BD.ctx.strokeStyle = BD.color(color); BD.ctx.lineWidth = 2; BD.ctx.setLineDash([]);
      BD.ctx.beginPath(); BD.ctx.moveTo(t.x - d.x * 4 + n.x * 5, t.y - d.y * 4 + n.y * 5); BD.ctx.lineTo(t.x + d.x * 3, t.y + d.y * 3); BD.ctx.lineTo(t.x - d.x * 4 - n.x * 5, t.y - d.y * 4 - n.y * 5); BD.ctx.stroke();
      BD.ctx.restore();
    }
  /* ===== 원본 그대로: 장면 그리기 (원본 1123–1462행, 하단 상자만 setTape로) ===== */
    function renderMode1(rect) {
      const A = state.A1; // (x_A, 0)
      const B = state.B1; // (x_H, y_B)
      const H = { x: B.x, y: 0 };
      const dotVal = A.x * B.x;

      // Step 3 (partIdx = 2, lens = 'aux'): 수선 레일(x = x_H 직선) 및 하단 정사영 게이지 바
      if (isLayerVisible(3, 'aux')) {
        drawChalkLine(H.x, -9, H.x, 9, 'rgba(251, 191, 36, 0.45)', 2.0, true, false, 2);
        const sRailTop = toScreen(H.x, 4.4);
        const st3 = applyPartStyle(2, 1, 4);
        ctx.save();
        ctx.globalAlpha = st3.alpha;
        ctx.font = 'bold 12px Pretendard';
        ctx.fillStyle = '#fde047';
        ctx.textAlign = 'center';
        { const t = `등내적 수선 레일 (x = ${H.x.toFixed(1)})`, w = ctx.measureText(t).width; ctx.fillText(t, clampX(sRailTop.x - w / 2, w) + w / 2, clampY(sRailTop.y - 8)); } // [2.0 수정] 글자를 무대 안으로
        ctx.restore();

        setTape(`정사영 내적: OA · OB = 바닥(|OA|=${A.x.toFixed(1)}) × 그림자(x_H=${H.x >= 0 ? '+' : ''}${H.x.toFixed(2)}) = ${dotVal.toFixed(2)}`); // [2.0 수정] 하단 상자 → 하단 띠
      }

      // Step 2 (partIdx = 1, lens = 'proj'): 점 B에서 직선 OA에 내린 수선 BH 및 정사영 그림자 선분 OH
      if (isLayerVisible(2, 'proj')) {
        drawChalkLine(B.x, B.y, H.x, H.y, '#fbbf24', 2.4, true, false, 1);
        // [BUG-03 수정] H.x <= 0일 때는 선분 OA가 있는 오른쪽(+1)을 향하도록 직각 기호 방향 교정
        if (Math.abs(B.y) > 0.15) {

        }

        drawChalkPoint(H.x, 0, 5.5, shadowColor, `H(${H.x.toFixed(1)}, 0) [그림자]`, { x: -45, y: 46 }, 1); // [표시 보강] 바닥 OA 이름표와 겹치지 않게 아래로
      }

      if (isLayerVisible(1, 'vec')) {
        const sO = toScreen(0, 0);
        const lenBPx = Math.hypot(B.x, B.y) * state.scale;
        // [BUG-03 수정] 각도 호의 반지름이 벡터 길이보다 커지지 않도록 동적 스케일링 및 방향 일관성 확보
        const arcR = Math.min(34, Math.max(12, lenBPx * 0.45));
        const angB = Math.atan2(-B.y, B.x);
        const st1 = applyPartStyle(0, 2.2, 6);

        if (lenBPx > 16) {
          ctx.save();
          ctx.globalAlpha = st1.alpha;
          ctx.beginPath();
          ctx.arc(sO.x, sO.y, arcR, 0, angB, B.y >= 0);

          ctx.stroke();
          ctx.restore();
          // [표시 보강] 끼인각 θ 에 각도 값(°)을 각 안쪽에 표시(이전: 호만 있고 θ·값이 없었음)
          markAngle({ x: 0, y: 0 }, { x: A.x >= 0 ? 1 : -1, y: 0 }, B, H.x >= 0 ? '#34d399' : '#f43f5e', `θ=${degBetween({ x: 0, y: 0 }, { x: A.x >= 0 ? 1 : -1, y: 0 }, B).toFixed(1)}°`, arcR);
        }

        drawChalkPoint(0, 0, 5, '#f8fafc', '', { x: 0, y: 0 }, 0);
        drawChalkPoint(A.x, A.y, 7.0, '#38bdf8', `A(${A.x.toFixed(1)}, 0) [드래그]`, { x: -30, y: -12 }, 0);
        drawChalkPoint(B.x, B.y, 8.0, '#f472b6', `B(${B.x.toFixed(1)}, ${B.y.toFixed(1)})`, { x: 12, y: -10 }, 0);

    }

    // =========================================================================
    // [모드 2 렌더링] 성분 내적 & 사잇각 cos θ 및 수직(내적=0) 경계선
    // =========================================================================
    function renderMode2(rect) {

      const B = state.B2;

      const dot = A.x * B.x + A.y * B.y;

      const degT = (Math.acos(cosT) * 180) / Math.PI;

      // Step 3 (partIdx = 2, lens = 'aux'): 벡터 A에 수직(⊥)인 경계 직선 (내적 = 0)
      if (isLayerVisible(3, 'aux')) {
        const ux = -A.y / lenA;
        const uy = A.x / lenA;
        const span = 12;
        drawChalkLine(-ux * span, -uy * span, ux * span, uy * span, 'rgba(251, 191, 36, 0.55)', 2.0, true, false, 2);

        // [BUG-02 수정] 외적 부호를 판별하여 벡터 B가 있는 쪽의 수직 경계선과 직각 기호를 이루도록 동적 반전

      return val > 0 ? { ...G, text: '예각 (내적 > 0)' } : { ...R, text: '둔각 (내적 < 0)' };
    }
    if (mode === 3) {
      if (Math.abs(extraVal) < 0.15) return { ...W, text: `OA ⊥ CP (회전내적 = 0 | 전체 = ${val.toFixed(1)})` };
      return extraVal > 0 ? { ...G, text: `OA·CP > 0 (동방향 보강 | 내적 = ${val.toFixed(1)})` } : { ...R, text: `OA·CP < 0 (역방향 상쇄 | 내적 = ${val.toFixed(1)})` };
    }
    if (Math.abs(val) < 0.1) return { ...W, text: 'PM = AM (∠APB = 90°, 내적 = 0)' };
    return val > 0 ? { ...G, text: 'PM > AM (예각 ∠APB < 90°, 내적 > 0)' } : { ...R, text: 'PM < AM (둔각 ∠APB > 90°, 내적 < 0)' };
  }

  /* ===== 문제 조건 스냅 / 프리셋 (원본 examData의 snap·presets 값 그대로) ===== */
  function snapFlat(m) {
    const sn = examData[m].snap;
    if (m === 1) return { A1x: sn.Ax, B1x: sn.Bx, B1y: sn.By };
    if (m === 2) return { A2x: sn.Ax, A2y: sn.Ay, B2x: sn.Bx, B2y: sn.By };
    return { th34: mod360(sn.theta34 * R2D), r34: sn.r34 };
  }
  // 원본 BUG-05 수정: 각도는 가장 짧은 경로로 돌아갑니다. (끝나면 셸 tick에서 0~360으로 되돌림)
  function shortestTheta(s, targetRad) {
    const cur = mod360(s.th34);
    let d = mod360(targetRad * R2D - cur);
    if (d > 180) d -= 360;
    s.th34 = cur;
    return cur + d;
  }
  function snapPatch(m, s) {
    s.lens = 'all'; s.pi = 0;
    const p = snapFlat(m);
    if (m >= 3) p.th34 = shortestTheta(s, examData[m].snap.theta34);
    return p;
  }
  // 원본 applyModePreset(m, spec): 프리셋 버튼이 부르는 함수 — 현재 값에서 목표값으로 부드럽게 이동
  function applyModePreset(m, spec) {
    const s = CUR.s, lab = CUR.lab;
    s.playing = false;
    let patch;
    if (m === 1) patch = { A1x: spec.Ax !== undefined ? spec.Ax : s.A1x, B1x: spec.Bx !== undefined ? spec.Bx : s.B1x, B1y: spec.By !== undefined ? spec.By : s.B1y };
    else if (m === 2) patch = {
      A2x: spec.Ax !== undefined ? spec.Ax : s.A2x, A2y: spec.Ay !== undefined ? spec.Ay : s.A2y,
      B2x: spec.Bx !== undefined ? spec.Bx : s.B2x, B2y: spec.By !== undefined ? spec.By : s.B2y
    };
    else patch = { th34: shortestTheta(s, spec.theta34 !== undefined ? spec.theta34 : state.theta34), r34: spec.r34 !== undefined ? spec.r34 : s.r34 };
    lab.tween(patch, 520);
  }
  const LENS = [['all', '전체 보기'], ['vec', '기본 벡터·사잇각'], ['proj', '정사영·분해'], ['aux', '킬러 보조선·극값']];
  const presetChips = (m) => examData[m].presets.map((p, i) => ({
    group: '기출 프리셋', label: p.label,
    apply: (s, lab) => { s.pi = i; CUR = { s, lab }; use(s); p.action(); },
    on: (st) => st.pi === i
  })).concat(LENS.map(([k, label]) => ({ group: '관찰 렌즈', label, apply: (s) => { s.lens = k; }, on: (st) => st.lens === k })));

  /* ===== 열려 있는 풀이 문구를 값이 바뀔 때 다시 씁니다(원본 syncLiveExplanations) ===== */
  let solKey = '';
  function refreshSolutions() {
    const lab = window.lab;
    if (!lab || !lab.refs || !lab.refs.solution) return;
    const sol = lab.scene.solution, dets = lab.refs.solution.querySelectorAll('details.apl-acc');
    [sol.standard, sol.quick].forEach((src, i) => {
      const d = dets[i];
      if (d && d.open) lab._fillSolution(d.querySelector('.apl-acc-body'), src);
    });
  }

  /* ===== 끌 수 있는 점(원본 handlePointerDown / handlePointerMove 규칙 그대로) ===== */
  function drawHandles(b, s, m) {
    if (m === 1) {
      b.handle('B1', { x: s.B1x, y: s.B1y }, { color: 'rose', ariaLabel: '점 B', drag: (w) => {
        let nx = clamp(w.x, -5, 6);
        if (Math.abs(nx) < 0.12) nx = 0; // 수직(x_H=0) 마그네틱 스냅
        s.B1x = nx; s.B1y = clamp(w.y, -5.5, 5.5);
      } });
      b.handle('A1', { x: s.A1x, y: 0 }, { color: 'sky', ariaLabel: '점 A (바닥 길이)', step: 0.5, drag: (w) => { s.A1x = Math.round(clamp(w.x, 2, 8) * 2) / 2; } });
    } else if (m === 2) {
      const setVec = (kx, ky) => (w) => { const c = clampNonZeroVec(clamp(w.x, -6, 6), clamp(w.y, -6, 6), 0.3); s[kx] = c.x; s[ky] = c.y; };
      b.handle('B2', { x: s.B2x, y: s.B2y }, { color: 'rose', ariaLabel: '점 B', drag: setVec('B2x', 'B2y') });
      b.handle('A2', { x: s.A2x, y: s.A2y }, { color: 'sky', ariaLabel: '점 A', drag: setVec('A2x', 'A2y') });
    } else {
      const C = m === 3 ? state.C3 : state.C4;
      b.handle('P34', { x: C.x + s.r34 * Math.cos(s.th34 * D2R), y: C.y + s.r34 * Math.sin(s.th34 * D2R) }, { color: 'amber', ariaLabel: '동점 P', drag: (w) => {
        let raw = Math.atan2(w.y - C.y, w.x - C.x);
        if (raw < 0) raw += Math.PI * 2;
        // 원본 BUG-14: 최대/최소 극값 지점(±3.8° 이내) 도달 시 자동 자석 스냅
        const ref = Math.atan2(4, 3), minA = wrapAnglePositive(ref + Math.PI);
        if (Math.abs(normalizeAngleDiff(raw, ref)) < 0.068) raw = ref;
        else if (Math.abs(normalizeAngleDiff(raw, minA)) < 0.068) raw = minA;
        s.th34 = deg(raw);
      } });
    }
  }

  /* ===== 장면 글: 탭 이름·탐구 질문 (새로 쓴 부분) ===== */
  const TITLE = ['정사영 기하학 (바닥×그림자)', '성분 내적 & 사잇각·수직 판정', '기출1: 원 위 동점 내적 최대·최소', '기출2: 중점 제곱차 (PA·PB=PM²-L²)'];
  const SHORT = ['정사영', '성분·사잇각', '원 위 동점', '중점 제곱차'];
  const QUESTION = [
    '점 B의 높이가 바뀌어도 OA·OB의 값이 변하지 않는 이유는 무엇일까?',
    '성분만 알면 내적과 사잇각을 어떻게 구할까? 두 벡터가 수직일 때는 어떻게 될까?',
    '원 위의 점 P가 움직일 때 OA·OP는 언제 최대이고 언제 최소일까?',
    '시점 P가 움직이는 PA·PB를 어떻게 거리 PM의 문제로 바꿀 수 있을까?'
  ];

  function sceneOf(m) {
    const d = examData[m];
    return {
      id: 'm' + m, title: TITLE[m - 1], short: SHORT[m - 1],
      question: QUESTION[m - 1], guide: d.hint,
      controls: m === 1 ? ['B1y', 'B1x'] : m === 2 ? ['ang2'] : ['th34', 'r34'],
      presets: () => presetChips(m),
      actions: () => [{
        id: 'play', play: true, icon: (s) => (s.playing ? 'pause' : 'play'), label: (s) => (s.playing ? '일시 정지' : '자동 회전'), on: (s) => s.playing,
        run: (s) => { s.playing = !s.playing; }
      }],
      steps: d.steps,
      enter: (s) => { s.sid = String(m); s.lens = 'all'; s.pi = 0; s.animDir = 1; Object.assign(s, snapFlat(m)); },
      focus: m === 1 ? { x: [-2, 8.6], y: [-2.6, 6.2] } : m === 2 ? { x: [-3, 6.6], y: [-3, 5.6] } : m === 3 ? { x: [-2.6, 6.4], y: [-3.2, 5.8] } : { x: [-4.6, 7], y: [-5.2, 5.4] },
      tick: (s, dt, lab) => {
        if (!lab._tween && (s.th34 < 0 || s.th34 >= 360)) s.th34 = mod360(s.th34);
        if (!s.playing) return false;
        const f = dt * 60;
        if (m === 1) {
          s.B1y += 0.06 * s.animDir * f;
          if (s.B1y > 5.0) s.animDir = -1;
          if (s.B1y < -5.0) s.animDir = 1;
        } else if (m === 2) {
          const ang = Math.atan2(s.B2y, s.B2x) + 0.015 * f;
          const len = Math.max(0.5, Math.hypot(s.B2x, s.B2y) || Math.sqrt(10)); // 원본 BUG-01: 원점 고착 방지
          s.B2x = len * Math.cos(ang); s.B2y = len * Math.sin(ang);
        } else s.th34 = mod360(s.th34 + 0.018 * f * R2D);
        return true;
      },
      view: (s) => {
        s.sid = String(m);
        use(s);
        if (m === 2) s.ang2 = deg(Math.atan2(s.B2y, s.B2x));
        if (s.part != null && s.step < s.part + 1) s.step = s.part + 1; // 원본: 조각을 고르면 그 단계가 자동으로 켜짐
        const o = monitor();
        const key = JSON.stringify([m, s.A1x, s.B1x, s.B1y, s.r34]);
        if (key !== solKey) { solKey = key; Promise.resolve().then(refreshSolutions); }
        return {
          guide: d.hint,
          chips: [{ k: '내적 공식', tex: o.eq, color: 'amber' }],
          status: o.sign,
          readouts: o.labels.map((label, i) => ({ label: label.replace(/^[①②③④]\s*/, ''), value: o.vals[i], color: ['sky', 'amber', 'rose', 'green'][i], wide: String(o.vals[i]).length > 15 })),
          parts: d.steps.map((name, i) => ({ id: i, name, color: ['sky', 'amber', 'rose'][i] })),
          formula: '<div style="text-align:center">' + APLab.tex(o.eq, true) + '</div>'
        };
      },
      draw: (b, s, v) => {
        BD = b; s.sid = String(m); use(s);
        TAPE = null; LBOX.length = 0;
        if (s.grid) b.grid();
        b.axes();
        [null, renderMode1, renderMode2, renderMode3, renderMode4][m]({ width: b.W, height: b.H });
        drawHandles(b, s, m);
        v.tape = TAPE ? { title: TAPE } : null;
      },
      problem: {
        tag: d.tag, time: d.targetTime,
        text: (s) => { s.sid = String(m); use(s); return d.question(); },
        answer: (s) => { s.sid = String(m); use(s); return d.answerBadge(); },
        snap: (s) => snapPatch(m, s)
      },
      solution: {
        standardTitle: '교과서식 정석 풀이 (성분·제곱 전개)', standardTag: '3분 소요',
        quickTitle: '10초 컷 실전 기하 비기', quickTag: '10초 컷',
        standard: (s) => { s.sid = String(m); use(s); return d.textbook(); },
        quick: (s) => { s.sid = String(m); use(s); return d.shortcut(); }
      }
    };
  }

  APLab.createLab({
    id: 'geom-vector-dot',
    title: '벡터의 성분 · 내적',
    courseName: '기하',
    unit: '벡터 · 성분과 내적',
    courseColor: 'var(--m-rose)',
    home: '../index.html#geom',
    legacy: '../../labs/기하와벡터/벡터의 성분·내적.html',
    board: { kind: 'cartesian', focus: { x: [-2, 8.6], y: [-2.6, 6.2] }, minZoom: 0.3, maxZoom: 8 },
    params: {
      B1y: { value: 4, min: -5.5, max: 5.5, step: 0.1, color: 'rose', label: '수선 레일 이동 y_B (바꿔도 내적은 불변!)', format: (v, s) => `y_B = ${v.toFixed(2)} (내적 = ${(s.A1x * s.B1x).toFixed(1)} 고정)` },
      B1x: { value: 3, min: -5, max: 6, step: 0.1, color: 'amber', label: '정사영 수선의 발 x_H (음수면 둔각 내적 < 0)', format: (v) => `x_H = ${v >= 0 ? '+' : ''}${v.toFixed(2)}` },
      A1x: { value: 6, min: 2, max: 8, step: 0.5, color: 'sky', label: '바닥 길이 |OA|', format: (v) => v.toFixed(1) },
      ang2: {
        value: 71.6, min: 0, max: 360, step: 0.5, color: 'rose', label: '벡터 b 회전 각도 θ_B (드래그하여 90° 수직 맞추기)',
        format: (v, s) => {
          const lenA = Math.max(1e-4, Math.hypot(s.A2x, s.A2y)), lenB = Math.max(1e-4, Math.hypot(s.B2x, s.B2y));
          const t = (Math.acos(clamp((s.A2x * s.B2x + s.A2y * s.B2y) / (lenA * lenB), -1, 1)) * 180) / Math.PI;
          return `${v.toFixed(1)}° (사잇각 θ = ${t.toFixed(1)}°)`;
        },
        onInput: (s) => { const len = Math.max(0.5, Math.hypot(s.B2x, s.B2y) || Math.sqrt(10)); s.B2x = len * Math.cos(s.ang2 * D2R); s.B2y = len * Math.sin(s.ang2 * D2R); }
      },
      A2x: { value: 4, min: -6, max: 6, step: 0.1, color: 'sky', label: 'a의 x성분', format: (v) => v.toFixed(1) },
      A2y: { value: 2, min: -6, max: 6, step: 0.1, color: 'sky', label: 'a의 y성분', format: (v) => v.toFixed(1) },
      B2x: { value: 1, min: -6, max: 6, step: 0.1, color: 'rose', label: 'b의 x성분', format: (v) => v.toFixed(1) },
      B2y: { value: 3, min: -6, max: 6, step: 0.1, color: 'rose', label: 'b의 y성분', format: (v) => v.toFixed(1) },
      th34: { value: 53.13, min: 0, max: 360, step: 0.5, color: 'amber', label: '원 위 동점 회전각 θ (360° 스트레스 테스트)', format: (v) => `${mod360(v).toFixed(1)}°` },
      r34: { value: 2, min: 1, max: 3.5, step: 0.1, color: 'sky', label: '원의 반지름 r', format: (v) => `r = ${v.toFixed(2)}` }
    },
    state: { sid: '1', lens: 'all', pi: 0, animDir: 1 },
    persist: ['lens'],
    scenes: [1, 2, 3, 4].map(sceneOf)
  });
});
</script>
