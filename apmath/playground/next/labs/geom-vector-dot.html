    function normalizeAngleDiff(targetRad, startRad) {
      let diff = targetRad - startRad;
      while (diff > Math.PI) diff -= Math.PI * 2;
      while (diff < -Math.PI) diff += Math.PI * 2;
      return diff;
    }

    function wrapAnglePositive(rad) {
      let a = rad % (Math.PI * 2);
      if (a < 0) a += Math.PI * 2;

        steps: [

          "(PM + MA)·(PM − MA)로 전개: PA · PB = |PM|² - |MA|² = PM² - 2² (거리 PM의 문제로 바뀜)"

④ ${tex('x^2+y^2=PM^2')}이므로 ${tex('PA\\cdot PB=PM^2-4')}. 한편 ${tex('MC=5')}이고 원의 반지름 ${tex(`r=${state.r34.toFixed(1)}`)}은 5보다 작다. 따라서 ${tex(`5-r\\le PM\\le 5+r`)}.<br/>

          warning: "주의: 점 P가 움직이면 |PA|, |PB|와 끼인각 θ가 모두 변하므로 |PA||PB|cosθ로는 구하기 어렵습니다."
        }),
        shortcut: () => ({
          steps: `① 시점 ${tex('P')}가 움직이고 ${tex('A, B')}가 고정되어 있으면 <strong>[선분 AB의 중점 M]</strong>을 지나도록 ${tex('PA = PM + MA,\\; PB = PM + MB')}로 나눈다.<br/>
② ${tex('MB = -MA')}이므로 ${tex('(PM + MA)\\cdot(PM - MA) = |PM|^2 - |MA|^2')}이 되어 각도 ${tex('\\theta')}가 식에서 사라집니다:<br/>
&nbsp;&nbsp;<strong class="text-amber-300">${tex('\\overrightarrow{PA} \\cdot \\overrightarrow{PB} = (\\overrightarrow{PM} + \\overrightarrow{MA}) \\cdot (\\overrightarrow{PM} - \\overrightarrow{MA}) = \\overline{PM}^2 - \\overline{AM}^2')}</strong><br/>
③ ${tex('\\overline{AM}=2')}이고 ${tex(`r=${state.r34.toFixed(1)}<MC=5`)}이므로 ${tex(`5-r\\le PM\\le 5+r`)}. 따라서 ${tex('PM')}의 최솟값과 최댓값은 원의 중심을 ${tex('M')}에서 바라본 가까운 점과 먼 점에서 각각 얻는다.<br/>
④ ${tex('PM^2-4')}는 ${tex('PM\\ge0')}에서 증가하므로 내적의 최솟값은 ${tex(`(5-r)^2-4=${((5 - state.r34) ** 2 - 4).toFixed(2).replace(/\.00$/, '')}`)}, 최댓값은 ${tex(`(5+r)^2-4=${((5 + state.r34) ** 2 - 4).toFixed(2).replace(/\.00$/, '')}`)}.`,
          highlight: "PA · PB = PM² − (AB의 절반)² — 움직이는 두 벡터의 내적을 점 M과 점 P 사이의 거리 PM의 문제로 바꿀 수 있습니다."

  /* ===== 셸 상태(s)에서 원본 state 모양 만들기 ===== */
  function use(s) {
    state = {
      mode: +s.sid, conceptSwitch: s.lens, activePartIdx: s.part == null ? null : s.part,
      A1: { x: s.A1x, y: 0 }, B1: { x: s.B1x, y: s.B1y },
      A2: { x: s.A2x, y: s.A2y }, B2: { x: s.B2x, y: s.B2y },
      A3: { x: 3, y: 4 }, C3: { x: 2, y: 1 }, r34: s.r34, theta34: s.th34 * D2R,
      A4: { x: -2, y: -2.5 }, B4: { x: 2, y: -2.5 }, C4: { x: 3, y: 1.5 },
      steps: { 1: s.step >= 1, 2: s.step >= 2, 3: s.step >= 3 },
      scale: BD ? BD.k : 44
    };
    return state;
  }

  /* ===== 원본의 그리기 환경 → 새 무대 엔진 연결 ===== */
  // 원본 코드가 쓰는 ctx 직접 그리기: 색은 테마 의미색으로 바꾸고(칠판·종이 모두 대응), 종이 테마에서는 번쩍임(그림자)을 끕니다.
  const ctx = new Proxy({}, {
    get(_, k) { const c = BD.ctx, v = c[k]; return typeof v === 'function' ? v.bind(c) : v; },
    set(_, k, v) {
      const c = BD.ctx;
      if ((k === 'fillStyle' || k === 'strokeStyle' || k === 'shadowColor') && typeof v === 'string') v = BD.color(v);
      else if (k === 'shadowBlur' && !BD.glowOn) v = 0;
      c[k] = v;
      return true;
    }
  });
  const toScreen = (x, y) => BD.toS(x, y);
  // [2.0 수정] 글자가 무대 가장자리나 위쪽 칩·아래쪽 도구에 가려지지 않게 안으로 밀어 넣습니다.
  const clampX = (x0, w) => clamp(x0, 4, Math.max(4, BD.W - (BD.insets.right || 0) - 4 - w));
  const clampY = (y) => clamp(y, (BD.insets.top || 0) + 14, Math.max(30, BD.H - (BD.insets.bottom || 0) - 6));
  // [2.0 수정] 먼저 놓인 글자와 겹치면 위·아래로 비켜 놓습니다(예: 동점 P가 최대점과 같은 자리일 때).
  const LBOX = [];
  function placeLabel(x0, y, w) {
    const hit = (yy) => LBOX.some((q) => x0 < q.x1 && x0 + w > q.x0 && yy - 12 < q.y1 && yy + 4 > q.y0);
    let yy = clampY(y);
    for (const d of [0, -16, 16, -32, 32]) { const t = clampY(y + d); if (!hit(t)) { yy = t; break; } }
    LBOX.push({ x0, x1: x0 + w, y0: yy - 12, y1: yy + 4 });
    return yy;
  }
  function setTape(text) { TAPE = text; } // 원본 하단 상자 → 하단 띠

  /* ===== 원본 그대로: 조각 하이라이트·관찰 렌즈 가시성 (원본 877–891행) ===== */
    function isLayerVisible(stepNum, lensGroup) {
      if (!state.steps[stepNum]) return false;
      if (state.conceptSwitch === 'all') return true;
      return state.conceptSwitch === lensGroup;
    }

    function applyPartStyle(partIdx, baseWidth = 2, baseBlur = 8) {
      if (state.activePartIdx === null || partIdx === undefined) {
        return { alpha: 1.0, width: baseWidth, blur: baseBlur };
      }
      if (state.activePartIdx === partIdx) {
        return { alpha: 1.0, width: baseWidth + 2.0, blur: Math.max(20, baseBlur * 2.5) };
      }
      return { alpha: 0.25, width: baseWidth, blur: 0 };
    }
  /* ===== 원본 그대로: 분필 그리기 도우미 (원본 896–1012행, 글자 안으로 밀어 넣기만 추가) ===== */
    function drawChalkLine(x1, y1, x2, y2, color = '#ffffff', width = 2, dashed = false, glow = false, partIdx = undefined) {
      const p1 = toScreen(x1, y1);
      const p2 = toScreen(x2, y2);
      const st = applyPartStyle(partIdx, width, glow ? 10 : 0);

      ctx.save();
      ctx.globalAlpha = st.alpha;
      ctx.beginPath();
      if (dashed) ctx.setLineDash([6, 6]);
      ctx.strokeStyle = color;
      ctx.lineWidth = st.width;
      ctx.lineCap = 'round';
      if (st.blur > 0) {
        ctx.shadowColor = color;
        ctx.shadowBlur = st.blur;
      }
      ctx.moveTo(p1.x, p1.y);
      ctx.lineTo(p2.x, p2.y);
      ctx.stroke();
      ctx.restore();
    }
    function drawVectorArrow(x1, y1, x2, y2, color = '#fbbf24', width = 3, label = '', dashed = false, labelOffset = { x: 0, y: -12 }, partIdx = undefined) {
      const p1 = toScreen(x1, y1);
      const p2 = toScreen(x2, y2);
      const dx = p2.x - p1.x;
      const dy = p2.y - p1.y;
      const len = Math.hypot(dx, dy);
      if (len < 2) return;

      const st = applyPartStyle(partIdx, width, dashed ? 4 : 10);
      const angle = Math.atan2(dy, dx);
      const headLen = Math.min(14, Math.max(9, st.width * 4.0));

      ctx.save();
      ctx.globalAlpha = st.alpha;
      ctx.strokeStyle = color;
      ctx.fillStyle = color;
      ctx.lineWidth = st.width;
      ctx.lineCap = 'round';
      ctx.shadowColor = color;
      ctx.shadowBlur = st.blur;

      if (dashed) ctx.setLineDash([6, 5]);
      ctx.beginPath();
      ctx.moveTo(p1.x, p1.y);
      ctx.lineTo(p2.x - Math.cos(angle) * (headLen * 0.5), p2.y - Math.sin(angle) * (headLen * 0.5));
      ctx.stroke();

      ctx.setLineDash([]);
      ctx.beginPath();
      ctx.moveTo(p2.x, p2.y);
      ctx.lineTo(p2.x - headLen * Math.cos(angle - Math.PI / 6.5), p2.y - headLen * Math.sin(angle - Math.PI / 6.5));
      ctx.lineTo(p2.x - headLen * 0.72 * Math.cos(angle), p2.y - headLen * 0.72 * Math.sin(angle));
      ctx.lineTo(p2.x - headLen * Math.cos(angle + Math.PI / 6.5), p2.y - headLen * Math.sin(angle + Math.PI / 6.5));
      ctx.closePath();
      ctx.fill();

      if (label) {
        const mx = (p1.x + p2.x) / 2 + labelOffset.x;
        const my = (p1.y + p2.y) / 2 + labelOffset.y;
        ctx.shadowColor = 'rgba(0,0,0,0.95)';
        ctx.shadowBlur = 6;
        ctx.font = 'bold 13px Pretendard, monospace';
        ctx.textAlign = 'center';
        const lw = ctx.measureText(label).width, lx = clampX(mx - lw / 2, lw); ctx.fillText(label, lx + lw / 2, placeLabel(lx, my, lw)); // [2.0 수정] 글자를 무대 안으로·겹치지 않게
      }
      ctx.restore();
    }
    function drawChalkPoint(x, y, radius = 5.5, color = '#fbbf24', label = '', labelOffset = { x: 10, y: -10 }, partIdx = undefined) {
      const pt = toScreen(x, y);
      const st = applyPartStyle(partIdx, 2, 12);

      ctx.save();
      ctx.globalAlpha = st.alpha;
      ctx.beginPath();
      ctx.arc(pt.x, pt.y, state.activePartIdx === partIdx && partIdx !== undefined ? radius + 2 : radius, 0, Math.PI * 2);
      ctx.fillStyle = color;
      ctx.shadowColor = color;
      ctx.shadowBlur = st.blur;
      ctx.fill();
      ctx.lineWidth = 2;
      ctx.strokeStyle = '#ffffff';
      ctx.stroke();

      if (label) {
        ctx.shadowBlur = 5;
        ctx.shadowColor = 'rgba(0,0,0,0.95)';
        ctx.font = 'bold 13px Pretendard, sans-serif';
        ctx.fillStyle = color;
        const lw = ctx.measureText(label).width, lx = clampX(pt.x + labelOffset.x, lw); ctx.fillText(label, lx, placeLabel(lx, pt.y + labelOffset.y, lw)); // [2.0 수정] 글자를 무대 안으로·겹치지 않게
      }
      ctx.restore();
    }
    function drawRightAngleMark(foot, dirAlongLine, dirToPoint, sizePx = 11, color = '#fbbf24', partIdx = undefined) {
      const pFoot = toScreen(foot.x, foot.y);
      const u = { x: dirAlongLine.x, y: -dirAlongLine.y };
      const v = { x: dirToPoint.x, y: -dirToPoint.y };

      const p1 = { x: pFoot.x + u.x * sizePx, y: pFoot.y + u.y * sizePx };
      const p2 = { x: p1.x + v.x * sizePx, y: p1.y + v.y * sizePx };
      const p3 = { x: pFoot.x + v.x * sizePx, y: pFoot.y + v.y * sizePx };
      const st = applyPartStyle(partIdx, 1.6, 6);

      ctx.save();
      ctx.globalAlpha = st.alpha;
      ctx.beginPath();
      ctx.strokeStyle = color;
      ctx.lineWidth = st.width;
      ctx.moveTo(p1.x, p1.y);
      ctx.lineTo(p2.x, p2.y);
      ctx.lineTo(p3.x, p3.y);
      ctx.stroke();
      ctx.restore();
    }
  /* [표시 보강] 각·평행·같은 길이 표시 도우미 */
    // 꼭짓점 v에서 반직선 p1→p2 사이 각을 호+각도 값(°)으로 표시(같은 각은 같은 색·같은 기호로 호출)
    function markAngle(v, p1, p2, color, label, r = 28) {
      BD.angle([v.x, v.y], [p1.x, p1.y], [p2.x, p2.y], { r, color, label, size: 11.5, labelGap: 13 });
    }
    function degBetween(v, p1, p2) {
      const ax = p1.x - v.x, ay = p1.y - v.y, bx = p2.x - v.x, by = p2.y - v.y;
      const k = (ax * bx + ay * by) / ((Math.hypot(ax, ay) * Math.hypot(bx, by)) || 1);
      return Math.acos(Math.max(-1, Math.min(1, k))) * 180 / Math.PI;
    }
    function parallelMark(p, q, color = '#fbbf24') {
      const a = toScreen(p.x, p.y), b = toScreen(q.x, q.y), L = Math.hypot(b.x - a.x, b.y - a.y) || 1;
      if (L < 40) return;
      const d = { x: (b.x - a.x) / L, y: (b.y - a.y) / L }, n = { x: -d.y, y: d.x }, t = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
      BD.ctx.save(); BD.ctx.strokeStyle = BD.color(color); BD.ctx.lineWidth = 2; BD.ctx.setLineDash([]);
      BD.ctx.beginPath(); BD.ctx.moveTo(t.x - d.x * 4 + n.x * 5, t.y - d.y * 4 + n.y * 5); BD.ctx.lineTo(t.x + d.x * 3, t.y + d.y * 3); BD.ctx.lineTo(t.x - d.x * 4 - n.x * 5, t.y - d.y * 4 - n.y * 5); BD.ctx.stroke();
      BD.ctx.restore();
    }
  /* ===== 원본 그대로: 장면 그리기 (원본 1123–1462행, 하단 상자만 setTape로) ===== */
    function renderMode1(rect) {
      const A = state.A1; // (x_A, 0)
      const B = state.B1; // (x_H, y_B)
      const H = { x: B.x, y: 0 };
      const dotVal = A.x * B.x;

      // Step 3 (partIdx = 2, lens = 'aux'): 수선 레일(x = x_H 직선) 및 하단 정사영 게이지 바
      if (isLayerVisible(3, 'aux')) {
        drawChalkLine(H.x, -9, H.x, 9, 'rgba(251, 191, 36, 0.45)', 2.0, true, false, 2);
        const sRailTop = toScreen(H.x, 4.4);
        const st3 = applyPartStyle(2, 1, 4);
        ctx.save();
        ctx.globalAlpha = st3.alpha;
        ctx.font = 'bold 12px Pretendard';
        ctx.fillStyle = '#fde047';
        ctx.textAlign = 'center';
        { const t = `내적이 같은 점들의 직선 (x = ${H.x.toFixed(1)})`, w = ctx.measureText(t).width; ctx.fillText(t, clampX(sRailTop.x - w / 2, w) + w / 2, clampY(sRailTop.y - 8)); } // [2.0 수정] 글자를 무대 안으로
        ctx.restore();

        setTape(`정사영 내적: OA · OB = |OA|(${A.x.toFixed(1)}) × 정사영(x_H=${H.x >= 0 ? '+' : ''}${H.x.toFixed(2)}) = ${dotVal.toFixed(2)}`); // [2.0 수정] 하단 상자 → 하단 띠
      }

      // Step 2 (partIdx = 1, lens = 'proj'): 점 B에서 직선 OA에 내린 수선 BH 및 정사영 그림자 선분 OH
      if (isLayerVisible(2, 'proj')) {
        drawChalkLine(B.x, B.y, H.x, H.y, '#fbbf24', 2.4, true, false, 1);
        // [BUG-03 수정] H.x <= 0일 때는 선분 OA가 있는 오른쪽(+1)을 향하도록 직각 기호 방향 교정
        if (Math.abs(B.y) > 0.15) {
          drawRightAngleMark(H, { x: H.x > 0 ? -1 : 1, y: 0 }, { x: 0, y: B.y >= 0 ? 1 : -1 }, 11, '#fbbf24', 1);
        }

        const shadowColor = H.x >= 0 ? '#fbbf24' : '#f43f5e';
        drawChalkLine(0, -0.18, H.x, -0.18, shadowColor, 5.0, false, true, 1);
        drawChalkPoint(H.x, 0, 5.5, shadowColor, `H(${H.x.toFixed(1)}, 0) [정사영]`, { x: -45, y: 46 }, 1); // [표시 보강] 바닥 OA 이름표와 겹치지 않게 아래로
      }

      // Step 1 (partIdx = 0, lens = 'vec'): 두 위치벡터 OA, OB 및 사잇각 호
      if (isLayerVisible(1, 'vec')) {
        const sO = toScreen(0, 0);
        const lenBPx = Math.hypot(B.x, B.y) * state.scale;
        // [BUG-03 수정] 각도 호의 반지름이 벡터 길이보다 커지지 않도록 동적 스케일링 및 방향 일관성 확보
        const arcR = Math.min(34, Math.max(12, lenBPx * 0.45));
        const angB = Math.atan2(-B.y, B.x);
        const st1 = applyPartStyle(0, 2.2, 6);

        if (lenBPx > 16) {
          ctx.save();
          ctx.globalAlpha = st1.alpha;
          ctx.beginPath();
          ctx.arc(sO.x, sO.y, arcR, 0, angB, B.y >= 0);
          ctx.strokeStyle = H.x >= 0 ? '#34d399' : '#f43f5e';
          ctx.lineWidth = st1.width;
          ctx.stroke();
          ctx.restore();
          // [표시 보강] 끼인각 θ 에 각도 값(°)을 각 안쪽에 표시(이전: 호만 있고 θ·값이 없었음)
          markAngle({ x: 0, y: 0 }, { x: A.x >= 0 ? 1 : -1, y: 0 }, B, H.x >= 0 ? '#34d399' : '#f43f5e', `θ≈${degBetween({ x: 0, y: 0 }, { x: A.x >= 0 ? 1 : -1, y: 0 }, B).toFixed(1)}°`, arcR);
        }

        drawVectorArrow(0, 0, A.x, A.y, '#38bdf8', 3.4, `OA (길이 ${A.x.toFixed(1)})`, false, { x: 10, y: 22 }, 0);
        drawVectorArrow(0, 0, B.x, B.y, '#f472b6', 3.4, `OB (|OB|=${Math.hypot(B.x, B.y).toFixed(2)})`, false, { x: -45, y: -12 }, 0);
        drawChalkPoint(0, 0, 5, '#f8fafc', '', { x: 0, y: 0 }, 0);
        drawChalkPoint(A.x, A.y, 7.0, '#38bdf8', `A(${A.x.toFixed(1)}, 0) [끌기]`, { x: -30, y: -12 }, 0);
        drawChalkPoint(B.x, B.y, 8.0, '#f472b6', `B(${B.x.toFixed(1)}, ${B.y.toFixed(1)})`, { x: 12, y: -10 }, 0);
      }
    }

    // =========================================================================
    // [모드 2 렌더링] 성분 내적 & 사잇각 cos θ 및 수직(내적=0) 경계선
    // =========================================================================
    function renderMode2(rect) {
      const A = state.A2;
      const B = state.B2;
      // [BUG-01 수정] 0으로 나누기(NaN) 완벽 방어
      const lenA = Math.max(1e-4, Math.hypot(A.x, A.y));
      const lenB = Math.max(1e-4, Math.hypot(B.x, B.y));
      const dot = A.x * B.x + A.y * B.y;
      const cosT = Math.min(1, Math.max(-1, dot / (lenA * lenB)));
      const degT = (Math.acos(cosT) * 180) / Math.PI;

      // Step 3 (partIdx = 2, lens = 'aux'): 벡터 A에 수직(⊥)인 경계 직선 (내적 = 0)
      if (isLayerVisible(3, 'aux')) {
        const ux = -A.y / lenA;
        const uy = A.x / lenA;
        const span = 12;
        drawChalkLine(-ux * span, -uy * span, ux * span, uy * span, 'rgba(251, 191, 36, 0.55)', 2.0, true, false, 2);

        // [BUG-02 수정] 외적 부호를 판별하여 벡터 B가 있는 쪽의 수직 경계선과 직각 기호를 이루도록 동적 반전
        const cross = A.x * B.y - A.y * B.x;
        const signPerp = cross >= 0 ? 1 : -1;
        drawRightAngleMark({ x: 0, y: 0 }, { x: A.x / lenA, y: A.y / lenA }, { x: ux * signPerp, y: uy * signPerp }, 12, '#fbbf24', 2);

        const sPerp = toScreen(ux * 3.8, uy * 3.8);

      quick: (I) => `$\\vec u\\cdot\\overrightarrow{OP}=|\\vec u|\\times$(부호 있는 정사영 값)입니다. $\\vec u$와 수직인 직선을 $\\vec u$ 방향으로 밀어 부호 있는 정사영을 증가시킬 때 부채꼴에 <b>마지막으로 닿는 점</b>이 최대, <b>처음 닿는 점</b>이 최소입니다. 방향이 호 범위 안이면 접점은 호 위에서 $|\\vec u|R$ 또는 $-|\\vec u|R$이고, 아니면 꼭짓점입니다.`,

  /* ======================================================================
     옛 장면 1~4의 「문제」 탭과 「새 문제」 (탐구 탭은 그대로)
     - 첫 문제는 원래 문제(프리셋)와 같은 조건·정답입니다. 「새 문제」는 같은 구조에서 숫자만 바꾼 변형입니다.
     - 문제·정리 탭의 그림은 문제의 조건으로 그립니다(문제 탭은 주어진 것만, 정리 탭은 단계마다 보조선).
     ====================================================================== */
  /*OV-BEGIN*/
  const OVD = (() => {
    const T = (s) => `$${s}$`;
    const V = (n) => `\\overrightarrow{${n}}`;
    const stdOf = (steps) => steps.map((t, i) => `${['①', '②', '③', '④'][i]} ${t}`).join('<br>');
    const root = (n) => { let o = 1, i = n; for (let f = 2; f * f <= i; f++) while (i % (f * f) === 0) { i /= f * f; o *= f; } return [o, i]; };
    const sq = (n) => { const [o, i] = root(n); return i === 1 ? `${o}` : `${o === 1 ? '' : o}\\sqrt{${i}}`; };
    const par = (x) => (x < 0 ? `(${x})` : `${x}`);
    // ---- 1: 정사영과 내적
    const g1 = ([a, xh, yb]) => ({
      a, xh, yb, val: a * xh,
      text: `그림과 같이 밑변의 길이가 ${APLab.tex(`\\overline{OA}=${a}`)}인 도형에서 점 ${APLab.tex('B')}에서 직선 ${APLab.tex('OA')}에 내린 수선의 발을 ${APLab.tex('H')}라 하자. 부호 있는 그림자 위치가 ${APLab.tex(`x_H=${xh}`)}일 때, 점 ${APLab.tex('B')}의 높이 ${APLab.tex('y_B')}와 무관하게 내적 ${APLab.tex(`${V('OA')}\\cdot${V('OB')}`)}의 값을 구하시오.`,
      ans: `${V('OA')}\\cdot${V('OB')}=${a * xh}`,
      steps: [
        `두 위치벡터 $${V('OA')}$, $${V('OB')}$와 끼인각 $\\theta$를 그립니다.`,
        `$B$에서 직선 $OA$에 내린 수선의 발 $H$를 잡으면 $OH$는 $${V('OB')}$의 (부호 있는) 정사영이고 $x_H=${xh}$입니다.`,
        `$${V('OA')}\\cdot${V('OB')}=|${V('OA')}|\\,x_H=${a}\\times${par(xh)}=${a * xh}$. $B$가 직선 $BH$ 위에서 움직여도 $x_H$가 같으면 내적은 변하지 않으므로 $y_B$와 무관합니다.`
      ],
      quick: `내적은 (|OA|)×(OB의 직선 OA 위 부호 있는 정사영)입니다. $${a}\\times${par(xh)}=${a * xh}$.${xh < 0 ? ' 발 $H$가 $O$의 반대쪽에 있으므로 음수입니다.' : xh === 0 ? ' $H=O$이므로 $OA\\perp OB$입니다.' : ''}`
    });
    // ---- 2: 성분 내적과 사잇각
    const g2 = ([ax, ay, bx, by]) => {
      const d = ax * bx + ay * by, na = ax * ax + ay * ay, nb = bx * bx + by * by;
      const th = d === 0 ? 90 : d / Math.sqrt(na * nb) > 0 ? 45 : 135, cos = d === 0 ? '0' : th === 45 ? '\\dfrac{\\sqrt{2}}{2}' : '-\\dfrac{\\sqrt{2}}{2}';
      return {
        ax, ay, bx, by, d, th, val: d,
        text: `좌표평면 위의 두 벡터 ${APLab.tex(`\\vec{a}=(${ax},\\ ${ay}),\\ \\vec{b}=(${bx},\\ ${by})`)}에 대하여 내적 ${APLab.tex('\\vec{a}\\cdot\\vec{b}')}의 값과 두 벡터가 이루는 각의 크기 ${APLab.tex('\\theta')}를 구하시오. (단, ${APLab.tex('0^\\circ\\le\\theta\\le180^\\circ')})`,
        ans: `\\vec{a}\\cdot\\vec{b}=${d},\\ \\theta=${th}^\\circ`,
        steps: [
          `두 벡터 $\\vec a=(${ax},\\ ${ay})$, $\\vec b=(${bx},\\ ${by})$와 사잇각 $\\theta$를 그립니다.`,
          `성분으로 내적을 계산하면 $\\vec a\\cdot\\vec b=${ax}\\cdot${par(bx)}+${par(ay)}\\cdot${par(by)}=${d}$. $\\cos\\theta=\\dfrac{${d}}{\\sqrt{${na}}\\sqrt{${nb}}}=${cos}$이므로 $\\theta=${th}^\\circ$.`,
          `$\\vec a$에 수직인 직선(내적 $=0$)을 기준으로 $\\vec b$가 ${d > 0 ? '같은 쪽에 있으므로 예각(내적 $\\gt 0$)' : d === 0 ? '그 직선 위에 있으므로 수직(내적 $=0$)' : '반대쪽에 있으므로 둔각(내적 $\\lt 0$)'}입니다.`
        ],
        quick: `$\\vec a\\cdot\\vec b=x_1x_2+y_1y_2=${d}$. $|\\vec a|=\\sqrt{${na}}$, $|\\vec b|=\\sqrt{${nb}}$이므로 $\\cos\\theta=${cos}$ ⇒ $\\theta=${th}^\\circ$.`
      };
    };
    // ---- 3: 원 위의 점에서 OA·OP의 최대·최소
    const g3 = ([ax, ay, cx, cy, r]) => {
      const la = Math.hypot(ax, ay), k = ax * cx + ay * cy, M = k + la * r, m = k - la * r;
      return {
        ax, ay, cx, cy, r, la, k, M, m, val: M,
        text: `좌표평면에서 고정된 점 ${APLab.tex(`A(${ax},\\ ${ay})`)}와 원 ${APLab.tex(`(x${cx ? (cx > 0 ? '-' : '+') + Math.abs(cx) : ''})^2+(y${cy ? (cy > 0 ? '-' : '+') + Math.abs(cy) : ''})^2=${r * r}`)} (반지름 ${APLab.tex(`r=${r}`)}) 위를 움직이는 점 ${APLab.tex('P')}가 있다. 내적 ${APLab.tex(`${V('OA')}\\cdot${V('OP')}`)}의 최댓값 ${APLab.tex('M')}과 최솟값 ${APLab.tex('m')}을 구하시오.`,
        ans: `M=${M},\\ m=${m}`,
        steps: [
          `고정 벡터 $${V('OA')}$(길이 $${la}$)와 중심 $C(${cx},\\ ${cy})$, 반지름 $${r}$인 원을 그립니다.`,
          `중심 $C$를 지나게 분해합니다: $${V('OA')}\\cdot${V('OP')}=${V('OA')}\\cdot(${V('OC')}+${V('CP')})=${V('OA')}\\cdot${V('OC')}+${V('OA')}\\cdot${V('CP')}$, 고정항 $${V('OA')}\\cdot${V('OC')}=${k}$.`,
          `$${V('CP')}$가 $${V('OA')}$와 같은 방향일 때 최대 $+${la}\\times${r}$, 반대 방향일 때 최소 $-${la}\\times${r}$이므로 $M=${k}+${la * r}=${M}$, $m=${k}-${la * r}=${m}$.`
        ],
        quick: `$${V('OA')}\\cdot${V('OP')}=${V('OA')}\\cdot${V('OC')}+${V('OA')}\\cdot${V('CP')}=${k}+${V('OA')}\\cdot${V('CP')}$이고 $-|OA|r\\le${V('OA')}\\cdot${V('CP')}\\le|OA|r$이므로 $M=${k}+${la}\\times${r}=${M}$, $m=${k}-${la}\\times${r}=${m}$.`
      };
    };
    // ---- 4: PA·PB = PM² - L²
    const g4 = ([L, d, r]) => {
      const hi = (d + r) ** 2 - L * L, lo = (d - r) ** 2 - L * L;
      return {
        L, d, r, hi, lo, val: hi,
        text: `길이가 ${APLab.tex(String(2 * L))}인 고정된 선분 ${APLab.tex('AB')}와 그 중점 ${APLab.tex('M')}이 있다. 점 ${APLab.tex('M')}으로부터 거리가 ${APLab.tex(String(d))}인 점 ${APLab.tex('C')}를 중심으로 하고 반지름이 ${APLab.tex(`r=${r}`)}인 원 위를 움직이는 점 ${APLab.tex('P')}에 대하여, 내적 ${APLab.tex(`${V('PA')}\\cdot${V('PB')}`)}의 최댓값과 최솟값을 구하시오.`,
        ans: `\\text{최대 }${hi},\\ \\text{최소 }${lo}`,
        steps: [
          `고정 선분 $AB$(길이 $${2 * L}$), 원 $C$ 및 움직이는 두 벡터 $${V('PA')}$, $${V('PB')}$를 그립니다.`,
          `중점 $M$을 지나게 분해합니다: $${V('PA')}=${V('PM')}+${V('MA')}$, $${V('PB')}=${V('PM')}+${V('MB')}$ ($${V('MB')}=-${V('MA')}$, $MA=${L}$).`,
          `$${V('PA')}\\cdot${V('PB')}=PM^2-${L}^2$이고 $${d - r}\\le PM\\le${d + r}$이므로 최댓값 $${d + r}^2-${L * L}=${hi}$, 최솟값 $${d - r}^2-${L * L}=${lo}$.`
        ],
        quick: `$${V('PA')}\\cdot${V('PB')}=PM^2-AM^2=PM^2-${L * L}$. $PM$의 범위는 $MC\\pm r$, 곧 $${d - r}\\le PM\\le${d + r}$ ⇒ 최댓값 $${hi}$, 최솟값 $${lo}$.`
      };
    };
    const POOL = {
      1: [[6, 3, 4], [6, -2, 3], [5, 4, 2], [8, 0, 5], [4, -3, 4], [7, 3, 4]],
      2: [[4, 2, 1, 3], [3, 1, 2, 4], [2, 1, 1, 3], [4, 2, -1, 2], [3, 1, -1, -2]],
      3: [[3, 4, 2, 1, 2], [3, 4, 1, 2, 1], [4, 3, 2, 2, 2], [5, 12, 1, 1, 1], [-3, 4, 2, 1, 1], [6, 8, 1, 0, 2]],
      4: [[2, 5, 2], [3, 5, 1], [2, 6, 3], [1, 5, 3], [3, 7, 2]]
    };
    return { POOL, G: { 1: g1, 2: g2, 3: g3, 4: g4 }, stdOf };
  })();
  /*OV-END*/

  function dotOverlay(sc, m) {
    const { tex, P, add, sub, mul, len, lerp, polar } = NQ;
    const G=OVD.G[m],list=OVD.POOL[m].map(row=>{
      const I=G(row);
      if(m===1){I.steps[0]=String.raw`$OA$가 기준 방향입니다. $B$의 높이가 바뀌어도 같은 발 $H$를 가지는 점들을 비교하려고 $OA$ 위의 부호 있는 성분을 봅니다.`;I.standard=String.raw`좌표로 $\overrightarrow{OA}=(${I.a},0)$, $\overrightarrow{OB}=(${I.xh},y_B)$이므로 성분 내적은 $${I.a}\times(${I.xh})+0\times y_B=${I.val}$. 높이의 계수가 $0$이므로 일정합니다. 그림의 정사영은 이 $0\times y_B$ 계산을 먼저 없애는 방법입니다.`;}
      if(m===2){const na=I.ax**2+I.ay**2,nb=I.bx**2+I.by**2,nd=(I.bx-I.ax)**2+(I.by-I.ay)**2,co=I.d===0?'0':(I.d>0?'':'-')+String.raw`\dfrac{\sqrt2}{2}`;I.steps=[String.raw`먼저 $\vec b$의 끝에서 $\vec a$ 방향으로 수선을 내려 부호 있는 정사영을 봅니다. $\vec a$에 수직인 경계선의 어느 쪽인지 보면 내적의 부호를 예상할 수 있습니다.`,String.raw`성분 내적 $\vec a\cdot\vec b=(${I.ax})(${I.bx})+(${I.ay})(${I.by})=${I.d}$. 따라서 $\cos\theta=${I.d}/(\sqrt{${na}}\sqrt{${nb}})=${co}$.`,String.raw`$0^\circ\le\theta\le180^\circ$이므로 $\theta=${I.th}^\circ$. ${I.d===0?'정사영이 0이고 수직 경계 위에 있는 그림과 일치합니다.':I.d>0?'양의 정사영과 예각이 서로 일치합니다.':'음의 정사영과 둔각이 서로 일치합니다.'}`];I.standard=String.raw`세 변의 제곱은 $|a|^2=${na}$, $|b|^2=${nb}$, $|b-a|^2=${nd}$. 코사인법칙으로 $\cos\theta=(${na}+${nb}-${nd})/(2\sqrt{${na}}\sqrt{${nb}})=${co}$이어서 $\theta=${I.th}^\circ$. 다시 $|a||b|\cos\theta=${I.d}$. 성분 내적을 먼저 쓰면 차벡터의 길이 계산을 생략합니다.`;}
      if(m===3){I.steps[0]+=String.raw` 중심에서 재면 움직이는 벡터의 길이는 언제나 반지름이므로, 이 점을 분해의 기준으로 고릅니다.`;I.standard=String.raw`$P=(${I.cx}+${I.r}\cos t,\ ${I.cy}+${I.r}\sin t)$로 놓으면 내적은 $${I.k}+${I.r}((${I.ax})\cos t+(${I.ay})\sin t)$. 괄호의 범위가 $[-${I.la},${I.la}]$이므로 최댓값 $${I.M}$, 최솟값 $${I.m}$. 중심 분해에서는 삼각함수 합성 없이 같은 방향·반대 방향의 반지름을 읽습니다.`;}
      if(m===4){I.steps[1]+=String.raw` 길이가 같고 방향이 반대인 두 초록 화살표 때문에 전개에서 교차항이 상쇄됩니다.`;I.steps[2]=String.raw`$\overrightarrow{PA}\cdot\overrightarrow{PB}=PM^2-${I.L}^2$. 원까지의 거리는 $|${I.d}-${I.r}|\le PM\le${I.d+I.r}$이고, 제곱은 $PM\ge0$에서 증가하므로 최댓값 $${I.hi}$, 최솟값 $${I.lo}$. 중심선 위의 두 점에서 실제로 얻어집니다.`;I.standard=String.raw`$M$을 원점으로 두고 $A(-${I.L},0)$, $B(${I.L},0)$, $P(x,y)$로 놓습니다. $PA\cdot PB=(-${I.L}-x)(${I.L}-x)+(-y)^2=x^2+y^2-${I.L**2}$. $x^2+y^2=PM^2$와 원까지의 거리 범위로 최댓값 $${I.hi}$, 최솟값 $${I.lo}$를 얻습니다. 중점의 반대 벡터를 보면 이 성분 전개를 생략할 수 있습니다.`;}
      return I;
    });
    const V = (n) => `\\overrightarrow{${n}}`;
    const FIG = {
