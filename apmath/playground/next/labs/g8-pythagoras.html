  /* ===== [2.0 수정] 탭 4 경첩 장면: 장면마다 실제 변의 길이 (원본은 모든 장면을 6·8 경첩으로 계산) =====
     a = 아래 변 BC(긴 쪽), b = 변 AC(회전하는 쪽), 세 번째 변 c(=AB)는 ∠C로 정해집니다.
       hinge       a=8, b=6, ∠C = 경첩 각도(끌어서 조절)     acuteEx     (5, 6, 7) → ∠C = cos⁻¹((25+36-49)/60) ≈ 78°
       obtuseEx    (4, 5, 7) → ∠C ≈ 102°                      obtuseRange (3, 4, x), ∠C 90° → 128°
       acuteRange  (6, 8, x), ∠C 88° → 60° (원본 범위 그대로) */
  const HINGE_SIDES = { acuteEx: { a: 6, b: 5, c: 7 }, obtuseEx: { a: 5, b: 4, c: 7 }, obtuseRange: { a: 4, b: 3 }, acuteRange: { a: 8, b: 6 } };
  function hingeCalc(sub) {
    const sd = HINGE_SIDES[sub] || { a: 8, b: 6 };
    let exact;
    if (sd.c != null) exact = (Math.acos((sd.a * sd.a + sd.b * sd.b - sd.c * sd.c) / (2 * sd.a * sd.b)) * 180) / Math.PI;
    else if (sub === 'obtuseRange') exact = Math.round(90 + state.fold * 38);
    else if (sub === 'acuteRange') exact = Math.round(88 - state.fold * 28);
    else exact = state.hingeDeg;
    const base = sd.a * sd.a + sd.b * sd.b;
    return { a: sd.a, b: sd.b, exact, deg: Math.round(exact), base, cSq: Math.round(base - 2 * sd.a * sd.b * Math.cos((exact * Math.PI) / 180)) };
  }

  // 그림 안 글자: 원본의 ➔ ⭕ ❌ 는 글꼴에 따라 깨질 수 있어 → ○ × 로, 그 밖의 이모지는 뗍니다.
  const cv = (s) => APLab.stripEmoji(String(s == null ? '' : s).replace(/➔/g, '→').replace(/⭕/g, '○').replace(/❌/g, '×'));
  const txt = (s) => (BOARD.thumb ? '' : cv(s));
  // 셸은 이모지(➔ ⭕ ❌ 포함)를 화면 표시에서 떼어 내므로, 문장 속 뜻이 사라지지 않게 → ○ × 로 미리 바꿔 넘깁니다(원문 getSpec은 그대로).
  const arrow = (v) => (typeof v === 'string' ? v.replace(/➔/g, '→').replace(/⭕/g, '○').replace(/❌/g, '×') : Array.isArray(v) ? v.map(arrow) : v && typeof v === 'object' ? Object.fromEntries(Object.entries(v).map(([k, x]) => [k, arrow(x)])) : v);

  /* ===== 원본 그대로: 부분 강조·관찰 렌즈 판정 (원본 519–538행) ===== */
    function isPartDimmed(partIdx) {
      if (state.activePartIdx === -1 || partIdx === undefined) return false;
      return state.activePartIdx !== partIdx;
    }

    function isPartHighlighted(partIdx) {
      return state.activePartIdx !== -1 && state.activePartIdx === partIdx;
    }

    // 관찰 렌즈(state.conceptSwitch): 그리는 요소마다 그룹('def' · 'area' · 'aux', 여럿이면 공백으로 구분)을 붙여 두고,
    // 선택한 렌즈에 속한 요소는 굵게(hi) · 속하지 않은 요소는 흐리게(a) 그립니다. 그룹이 없는('') 바탕 요소는 항상 그대로입니다.
    //   def  직각(∟)·빗변·꼭짓점: 직각·각 표시, 꼭짓점 점, 빗변·변 길이 이름표, 핵심 선분
    //   area 넓이·제곱합 블록   : 정사각형·반원·조각 도형, 제곱·넓이 이름표, 하단 비율 띠·요약 상자
    //   aux  보조선·닮음·모눈   : 점선 보조선, 모눈 칸, 수선의 발 H 같은 보조점, 닮음 삼각형·전개도
    function lensFx(group) {
      const sw = state.conceptSwitch;
      if (sw === 'all' || !group) return { a: 1, hi: false };
      const on = group.split(' ').includes(sw);
      return { a: on ? 1 : 0.2, hi: on };

  /* ===== [2.0] 렌즈 규칙으로 감싸서 그리기 (원본의 ctx.globalAlpha *= fx.a 와 같은 효과) ===== */
  function lensRun(group, draw) {
    const fx = lensFx(group);
    const c = BOARD.ctx;
    c.save();
    c.globalAlpha *= fx.a;
    try { draw(fx); } finally { c.restore(); }
  }

  /* ===== 원본과 같은 이름·인자·기본값의 그리기 함수 (원본 540–716행) ===== */
    function pline(a, b, color = '#fbbf24', width = 2.4, dash = [], glow = false, partIdx = undefined, lens = dash.length ? 'aux' : (partIdx !== undefined || glow) ? 'def' : '') {
      lensRun(lens, (fx) => C.pline(a, b, color, fx.hi ? width + 1.6 : width, dash, glow || fx.hi, partIdx));
    }

    function ppoly(pts, fill = 'rgba(52,211,153,0.20)', stroke = '#34d399', width = 2.8, partIdx = undefined, lens = partIdx !== undefined ? 'area' : '') {
      lensRun(lens, (fx) => C.ppoly(pts, fill, stroke, fx.hi ? width + 1.4 : width, partIdx));
    }

    function pdot(p, text = '', col = '#ffffff', refCenter = null, customOff = null, lens = /드래그/.test(text) ? '' : /^[HL]\b|수선의 발|대칭점/.test(text) ? 'aux' : /^[A-Z][₀']?(\(|$)/.test(text) ? 'def' : '') {
      lensRun(lens, () => C.pdot(p, txt(text), col, refCenter, customOff));
    }

    function pright(v, p1, p2, size = 12, col = '#fbbf24', lens = 'def') {
      lensRun(lens, () => C.pright(v, p1, p2, size, col));
    }

    function ptick(p1, p2, count = 1, col = '#fbbf24', size = 6.5, lens = 'def') {
      lensRun(lens, () => C.ptick(p1, p2, count, col, size));
    }

    function pangle(v, p1, p2, col = '#fbbf24', r = 24, rings = 1, label = '', lens = 'def') {
      lensRun(lens, () => C.pangle(v, p1, p2, col, r, rings, txt(label)));
    }

    function ptag(x, y, msg, color = '#fef08a', size = 13, lens = /²|넓이/.test(msg) ? 'area' : /변|높이|거리|^\d+$|^[A-Z]{2}\s?=|^[①②] /.test(msg) ? 'def' : '') {
      if (BOARD.thumb) return;
      lensRun(lens, (fx) => C.ptag(x, y, cv(msg), color, fx.hi ? size + 1.5 : size));

  /** [2.0] ptag와 같은 글자인데, 기준점 p(설계 좌표)에서 화면 픽셀(dx, dy)만큼 떨어뜨리고 정렬(align)을 지정합니다.
   *  원본은 설계 좌표 오프셋만 있어 화면이 작아 도형이 줄어들면 변 위 글자가 그 변과 겹쳤습니다 → 변 옆(바깥쪽)에 놓을 글자에만 씁니다. */
  function ptagAt(p, msg, color = '#fef08a', size = 13, align = 'center', dx = 0, dy = 0, lens = /²|넓이/.test(msg) ? 'area' : /변|높이|거리|^\d+$|^[A-Z]{2}\s?=|^[①②] /.test(msg) ? 'def' : '') {
    if (BOARD.thumb) return;
    lensRun(lens, (fx) => BOARD.text(p, cv(msg), { color, size: fx.hi ? size + 1.5 : size, align, baseline: 'alphabetic', weight: 800, dx, dy }));
  }

  /* ===== [표시 보강] 평행 표시·선분 위 눈금 위치·각도 글자 ===== */
  /** 평행 표시(화살촉): 선분 p1→p2 위 pos 지점에 count 개. 같은 방향으로 평행한 두 선분에 같은 개수를 붙입니다. */
  function ppar(p1, p2, count = 1, col = '#fbbf24', pos = 0.5, lens = 'def') {
    if (BOARD.thumb) return;
    lensRun(lens, () => {
      const B = BOARD, c = B.ctx, S1 = B.toS(p1), S2 = B.toS(p2);
      const l = Math.hypot(S2.x - S1.x, S2.y - S1.y) || 1, ux = (S2.x - S1.x) / l, uy = (S2.y - S1.y) / l, nx = -uy, ny = ux, sz = 6.5;
      c.save();
      c.strokeStyle = B.color(col); c.lineWidth = 2.3 * B.lw; c.lineCap = 'round'; c.setLineDash([]); c.shadowBlur = 0;
      for (let i = 0; i < count; i++) {
        const off = (i - (count - 1) / 2) * 7, cx = S1.x + (S2.x - S1.x) * pos + ux * off, cy = S1.y + (S2.y - S1.y) * pos + uy * off;
        c.beginPath();
        c.moveTo(cx - ux * sz + nx * sz * 0.85, cy - uy * sz + ny * sz * 0.85);
        c.lineTo(cx + ux * sz * 0.4, cy + uy * sz * 0.4);
        c.lineTo(cx - ux * sz - nx * sz * 0.85, cy - uy * sz - ny * sz * 0.85);
        c.stroke();
      }
      c.restore();
    });
  }
  /** 같은 길이 눈금을 선분 위 pos 지점에(이름표·평행 표시와 겹치지 않게) */
  const ptickAt = (p1, p2, pos, count = 1, col = '#fbbf24') => ptick(lerp(p1, p2, pos - 0.02), lerp(p1, p2, pos + 0.02), count, col);
  /** 그림의 점으로 잰 각도 글자(그림이 바뀌어도 값이 따라옴) */
  const angDeg = (V, P1, P2) => {
    const a = Math.atan2(P1.y - V.y, P1.x - V.x), b = Math.atan2(P2.y - V.y, P2.x - V.x);
    let d = (Math.abs(a - b) * 180) / Math.PI;
    if (d > 180) d = 360 - d;
    return `${Math.round(d)}°`;
  };

  /* ===== [2.0] 도우미: 원호를 꺾은선으로(반원 도형·접힌 반원), 직각 꼭짓점 위치 ===== */
  /** 캔버스 arc(m, r, ang1, ang2, anticlockwise)와 같은 방향의 호 위의 점들(화면 각도 그대로) */
  function arcPts(m, r, ang1, ang2, anticlockwise, n = 48) {
    let d = ang2 - ang1;
    const TAU = Math.PI * 2;
    if (anticlockwise) { while (d > 1e-9) d -= TAU; while (d < -TAU) d += TAU; }
    else { while (d < -1e-9) d += TAU; while (d > TAU) d -= TAU; }
    const out = [];
    for (let i = 0; i <= n; i++) {
      const a = ang1 + (d * i) / n;
      out.push({ x: m.x + r * Math.cos(a), y: m.y + r * Math.sin(a) });
    }
    return out;
  }
  /** 빗변 BC(가로)가 정해졌을 때, 직각 꼭짓점 A를 직각삼각형 족보 f(AB : AC : BC = a : b : c) 비율대로 놓습니다. */
  function rightApex(B, C, f) {
    const W = C.x - B.x;
    return { x: B.x + W * (f.a / f.c) * (f.a / f.c), y: B.y - (W * f.a * f.b) / (f.c * f.c) };
  }

    // 선분 p1 -> p2 바깥쪽으로 정사각형(및 n×n 모눈 타일) 작도
    function drawOutwardSquare(p1, p2, fillCol, strokeCol, gridN = 0, labelText = '', outSign = 1, partIdx = undefined, lens = 'area') {
      const dx = p2.x - p1.x, dy = p2.y - p1.y;
      const nx = outSign * dy, ny = -outSign * dx;
      const p3 = { x: p2.x + nx, y: p2.y + ny };
      const p4 = { x: p1.x + nx, y: p1.y + ny };

      ppoly([p1, p2, p3, p4], fillCol, strokeCol, 2.8, partIdx, lens);

      const showGrid = !isPartDimmed(partIdx);
      if (showGrid && gridN > 0 && gridN <= 15) {
        // [2.0] 원본의 ctx 직접 그리기 → 무대 호출(같은 색·굵기·'넓이 보조' 렌즈 규칙)
        lensRun('area aux', (gfx) => {
          for (let i = 1; i < gridN; i++) {
            const r = i / gridN;
            const a1 = lerp(p1, p2, r), a2 = lerp(p4, p3, r);
            const b1 = lerp(p1, p4, r), b2 = lerp(p2, p3, r);
            BOARD.seg(a1, a2, { color: strokeCol + '40', width: gfx.hi ? 1.8 : 1.0 });
            BOARD.seg(b1, b2, { color: strokeCol + '40', width: gfx.hi ? 1.8 : 1.0 });
          }
        });
      }

      const center = mid(p1, p3);
      if (labelText && !isPartDimmed(partIdx)) ptag(center.x, center.y + 4, labelText, strokeCol, 13.5, lens);
      return { p1, p2, p3, p4, center };
    }

    function drawOutwardEquilateral(p1, p2, fillCol, strokeCol, labelText = '', outSign = 1, partIdx = undefined, lens = 'area') {
      const m = mid(p1, p2);
      const dx = p2.x - p1.x, dy = p2.y - p1.y;
      const hFactor = (Math.sqrt(3) / 2) * outSign;
      const apex = { x: m.x + dy * hFactor, y: m.y - dx * hFactor };
      ppoly([p1, p2, apex], fillCol, strokeCol, 2.8, partIdx, lens);
      const c = { x: (p1.x + p2.x + apex.x) / 3, y: (p1.y + p2.y + apex.y) / 3 };
      if (labelText && !isPartDimmed(partIdx)) ptag(c.x, c.y + 4, labelText, strokeCol, 13, lens);
      return apex;
    }

    function drawOutwardSemicircle(p1, p2, fillCol, strokeCol, labelText = '', anticlockwise = false, partIdx = undefined, lens = 'area') {
      const dimmed = isPartDimmed(partIdx);
      const m = mid(p1, p2);
      const r = dist(p1, p2) / 2;
      const ang1 = Math.atan2(p1.y - m.y, p1.x - m.x);
      const ang2 = Math.atan2(p2.y - m.y, p2.x - m.x);

      // [2.0] 원본의 ctx.arc + closePath → 같은 방향의 호 + 지름(꺾은선 도형). 강조·흐림은 무대가 partIdx로 처리합니다.
      lensRun(lens, (f) => {
        BOARD.poly(arcPts(m, r, ang1, ang2, anticlockwise), { fill: fillCol || null, color: strokeCol || null, stroke: !!strokeCol, width: f.hi ? 4.2 : 2.8, glow: f.hi, part: partIdx });
      });

      const midAng = ang1 + (anticlockwise ? -Math.PI / 2 : Math.PI / 2);
      if (labelText && !dimmed) {
        ptag(m.x + Math.cos(midAng) * r * 0.55, m.y + Math.sin(midAng) * r * 0.55 + 4, labelText, strokeCol, 13, lens);
      }
    }

          rule: '직사각형 꼭짓점 접기: ① AE=AD로 왼쪽 △ABE 풀기 ➔ ② x²=(세로-x)²+EC²으로 오른쪽 △FCE 풀기!',
          formulaHTML: `• <strong>2단계 방정식</strong>: ${tex(`x^2 = (8-x)^2 + 4^2 \\implies x^2 = 64 - 16x + x^2 + 16 \\implies 16x = 80 \\implies \\mathbf{x = 5}`)}`,

          hint: `꼭짓점 $B$가 $A$에 겹치도록 접으면 <strong class="text-amber-300">AD = BD = x</strong>가 되고 남은 조각은 <strong class="text-pink-300">CD = 8 - x</strong>입니다! 직각이 살아있는 $\\triangle ACD$에서 <strong class="text-sky-300">x² = (8 - x)² + 6²</strong>을 세우면 끝납니다!`,
          actionTxt: state.fold > 0.5 ? '🎬 펼치기' : '🎬 꼭짓점 B를 A에 포개어 접기!',
          p1Title: '삼각형 (6-8-10)', p2Title: '풀이 단계',
          parts: [
            { id: 0, name: `🟨 접혀서 같아진 변: AD = BD = x`, desc: `빗변 AB의 중점 E(AE=BE=5)에서 수직으로 접힘`, val: `AD = BD = x`, color: PCOL.gold, ok: true },
            { id: 1, name: `🩷 직각삼각형 △ACD에서 피타고라스 방정식`, desc: `AC = 6, CD = 8 - x, 빗변 AD = x`, val: `x = 25/4 (6.25)`, color: PCOL.pink, ok: true }
          ],

          rule: '종이접기 절대 법칙: 접혀서 같아진 길이를 x로 놓고, 남은 조각(전체-x)으로 직각삼각형 식을 세운다!',
          formulaHTML: `• ${tex(`x^2 = (8-x)^2 + 6^2 \\implies x^2 = 64 - 16x + x^2 + 36 \\implies 16x = 100 \\implies \\mathbf{x = \\dfrac{25}{4}}`)}`,
          notes: `• 점 $D$를 변 $BC$의 중점($x=4$)이라고 착각하면 절대 안 됩니다! $x = 25/4 = 6.25$입니다.`

      if (sub === 'reflection') {
        return {
          badge: `탐구 8-C · 직선 위 점 P를 거쳐 가는 최단거리 (AP + PB = AB' 대칭이동 & 점 P 드래그!)`,
          hint: `캔버스에서 <strong class="text-amber-300">직선 l 위의 점 P를 마우스로 좌우로 드래그</strong>해 보세요! 점 $B$를 직선 $l$에 대칭이동한 $B'$과 $A$를 곧장 이은 <strong class="text-emerald-300">일직선 AB' (직각삼각형 가로 12, 세로 3+6=9 ➔ 빗변 15)</strong>일 때가 최단거리입니다!`,
          actionTxt: state.fold > 0.5 ? '🎬 대칭선 접기' : '🎬 점 B를 직선 아래 B′으로 대칭이동!',
          p1Title: '가로 거리(12)', p2Title: '점 P 위치',
          parts: [
            { id: 0, name: `🟦 대칭이동으로 펴진 선분: PB = PB'`, desc: `직선 l이 BB'의 수직이등분선이므로 항상 PB = PB'`, val: `AP+PB = AP+PB'`, color: PCOL.cyan, ok: true },
            { id: 1, name: `🟨 큰 직각삼각형 △AKB' (가로 12, 세로 3+6 = 9)`, desc: `높이 3과 대칭 깊이 6이 더해져 세로 합 = 9!`, val: `9 - 12 - 15!`, color: PCOL.gold, ok: true },
            { id: 2, name: `🟩 최단거리 일직선 빗변 AB' = 15 (제곱 = 225)`, desc: `12² + (3+6)² = 144 + 81 = 225 = 15²`, val: `최솟값 = 15`, color: PCOL.green, ok: true }
          ],
          totalRes: `(AP + PB)의 최솟값 = AB' = √(12² + (3+6)²) = √225 = 15 cm`,
          rule: '직선 찍고 가는 최단거리: 한 점을 직선 반대편으로 대칭이동하여 큰 직각삼각형의 빗변을 구한다!',
          formulaHTML: `• ${tex(`(\\overline{AP}+\\overline{PB})_{\\min}^2 = \\overline{AB'}^2 = (\\text{가로 } 12)^2 + (\\text{세로 합 } 3+6)^2 = 144 + 81 = 225 = \\mathbf{15^2}`)}`,
          notes: `• 세로 높이를 $6 - 3 = 3$으로 빼는 실수를 조심하세요! 대칭이동을 하면 위쪽 $3$과 아래쪽 $6$이 더해져서 <strong>세로 합은 $3 + 6 = 9$</strong>가 됩니다.`
        };
      }
      const isCyl = sub === 'cylinderNet';
      return {
        badge: isCyl
          ? `탐구 8-E · 원기둥 옆면을 한 바퀴 감아 올라가는 실의 최단거리 (휴지심 펼치기!)`
          : `탐구 8-D · 직육면체 겉면을 따라 꼭짓점 A에서 G까지 가는 최단거리 (전개도 펼치기!)`,
        hint: isCyl
          ? `원기둥 옆면을 펼치면 <strong class="text-sky-300">가로가 밑면 원주(2πr = 6)</strong>이고 <strong class="text-emerald-300">세로가 높이(h = 8)</strong>인 직사각형이 됩니다! 한 바퀴 감은 실의 최단거리는 대각선 <strong class="text-amber-300">10 cm</strong>입니다!`
          : `접혀 있던 옆면을 펼친 전개도입니다! 실이 지나가는 앞면(5)과 옆면(7)을 나란히 펼치면 <strong class="text-sky-300">가로 합 5+7=12, 세로 5인 직각삼각형</strong>이 되어 최단거리(빗변)는 <strong class="text-amber-300">13</strong>입니다!`,
        actionTxt: state.fold > 0.5 ? '🎬 입체 느낌으로 접기' : '🎬 평면 전개도로 활짝 펼쳐 일직선 확인!',
        p1Title: isCyl ? '원주(6)·높이(8)' : '가로합(5+7)·높이(5)', p2Title: '전개 상태',
        parts: [
          { id: 0, name: isCyl ? `🟦 펼친 옆면의 가로 길이 (= 밑면 원주 2πr)` : `🟦 펼친 두 면의 가로 길이 합 (5 + 7 = 12)`, desc: isCyl ? `원기둥 한 바퀴 둘레 = 6 cm` : `앞면 가로(5) + 오른쪽 옆면 가로(7) = 12`, val: isCyl ? `가로 = 6` : `가로 합 = 12`, color: PCOL.cyan, ok: true },
          { id: 1, name: isCyl ? `🟩 원기둥의 세로 높이 (h = 8 cm)` : `🟩 직육면체의 세로 높이 (h = 5 cm)`, desc: `직각을 이루는 세로 직각변`, val: isCyl ? `높이 = 8` : `높이 = 5`, color: PCOL.green, ok: true },
          { id: 2, name: isCyl ? `🟨 최단거리 대각선 빗변 (6 - 8 - 10!)` : `🟨 최단거리 대각선 빗변 AG (5 - 12 - 13!)`, desc: isCyl ? `6² + 8² = 100 ➔ 최단거리 = 10 cm` : `12² + 5² = 169 ➔ 최단거리 = 13`, val: isCyl ? `최단거리 = 10` : `최단거리 = 13`, color: PCOL.gold, ok: true }
        ],
        totalRes: isCyl ? `원기둥 1바퀴 최단거리 = √(6² + 8²) = 10 cm` : `직육면체 겉면 최단거리 = √((5+7)² + 5²) = 13`,
        rule: '모든 입체 겉면 최단거리 = 실이 지나가는 면들을 평면 전개도로 펼쳐 직각삼각형 빗변 구하기!',
        formulaHTML: isCyl
          ? `• ${tex(`(\\text{최단거리})^2 = (2\\pi r)^2 + h^2 = 6^2 + 8^2 = 100 = \\mathbf{10^2}`)}`
          : `• ${tex(`\\overline{AG}^2 = (5+7)^2 + 5^2 = 12^2 + 5^2 = 169 = \\mathbf{13^2}`)}`,
        notes: isCyl
          ? `• 만약 원기둥 옆면을 <strong>두 바퀴</strong> 감아 올라갔다면, 가로 길이를 <strong>$2 \\times (\\text{밑면 원주}) = 12$</strong>로 놓고 피타고라스 정리를 쓰면 됩니다!`
          : `• 어느 모서리를 넘어가는지에 따라 펼치는 방향이 달라집니다. 가장 짧은 최단거리는 <strong>가장 긴 변을 높이(제곱 밖)로 두거나 두 짧은 변을 합쳐 제곱</strong>할 때를 비교해 찾습니다.`
      };
    }

  /* ===== 원본 그대로: 장면별 그리기 (원본 1407–2311행, [2.0] 표시한 곳만 다름) ===== */
    // =========================================================================
    // [탭 1 렌더링] 세 정사각형 넓이 (a²+b²=c²) & 격자 정사각형 & 연쇄 삼각형
    // =========================================================================
    function renderMode1ThreeSquares(rect, cx, cy) {
      const subId = state.subType[1];
      const s = state.scale * 0.98;
      const fam = getActiveTriple();
      const k = state.multK;
      const a = fam.a * k, b = fam.b * k, c = fam.c * k;

      if (subId === 'tiltedGrid') {
        const u = 36 * s;
        const half = 2.5 * u;
        const ox = cx - half, oy = cy - half;

        // [2.0] 원본의 ctx 직접 그리기 → 무대 호출(같은 색·굵기, '보조선·모눈' 렌즈 규칙)
        lensRun('aux', (gfx) => {
          for (let i = 0; i <= 5; i++) {
            BOARD.seg(pt(ox + i * u, oy), pt(ox + i * u, oy + 5 * u), { color: 'rgba(255,255,255,0.22)', width: gfx.hi ? 2.2 : 1.2 });
            BOARD.seg(pt(ox, oy + i * u), pt(ox + 5 * u, oy + i * u), { color: 'rgba(255,255,255,0.22)', width: gfx.hi ? 2.2 : 1.2 });
          }
        });

        const A = pt(ox + 3 * u, oy), B = pt(ox, oy + 2 * u), C = pt(ox + 2 * u, oy + 5 * u), D = pt(ox + 5 * u, oy + 3 * u);
        const c1 = pt(ox, oy), c2 = pt(ox, oy + 5 * u), c3 = pt(ox + 5 * u, oy + 5 * u), c4 = pt(ox + 5 * u, oy);

        const pushOut = state.fold * 18 * s;
        const shift = (pts, dx, dy) => pts.map((p) => ({ x: p.x + dx, y: p.y + dy }));

        ppoly([c1, c2, c3, c4], 'rgba(255,255,255,0.03)', PCOL.white, 1.8, 2);
        ppoly(shift([c1, B, A], -pushOut, -pushOut), 'rgba(56, 189, 248, 0.28)', PCOL.cyan, 2.2, 1);
        ppoly(shift([c2, C, B], -pushOut, pushOut), 'rgba(56, 189, 248, 0.28)', PCOL.cyan, 2.2, 1);
        ppoly(shift([c3, D, C], pushOut, pushOut), 'rgba(56, 189, 248, 0.28)', PCOL.cyan, 2.2, 1);
        ppoly(shift([c4, A, D], pushOut, -pushOut), 'rgba(56, 189, 248, 0.28)', PCOL.cyan, 2.2, 1);
        // [표시 보강] 귀퉁이 직각삼각형 4개는 합동: 직각 표시(옮겨진 삼각형을 따라감)와 같은 길이 눈금(3칸 |, 2칸 ||)
        [[c1, B, A, -pushOut, -pushOut], [c2, C, B, -pushOut, pushOut], [c3, D, C, pushOut, pushOut], [c4, A, D, pushOut, -pushOut]].forEach(([k0, p0, q0, dx, dy]) => {
          const K0 = pt(k0.x + dx, k0.y + dy), P0 = pt(p0.x + dx, p0.y + dy), Q0 = pt(q0.x + dx, q0.y + dy);
          pright(K0, P0, Q0, 11, PCOL.cyan);
          ptick(K0, P0, 2, PCOL.cyan);
          ptick(K0, Q0, 1, PCOL.cyan);
        });

        ppoly([A, B, C, D], 'rgba(251, 191, 36, 0.38)', PCOL.gold, 3.6, 0);
        pright(A, B, D, 12, PCOL.gold);
        // [표시 보강] 기울어진 정사각형: 네 직각과 네 변의 같은 길이 눈금(|||)
        pright(B, A, C, 12, PCOL.gold); pright(C, B, D, 12, PCOL.gold); pright(D, C, A, 12, PCOL.gold);
        ptick(A, B, 3, PCOL.gold); ptick(B, C, 3, PCOL.gold); ptick(C, D, 3, PCOL.gold); ptick(D, A, 3, PCOL.gold);

        ptag(cx, cy + 4, '넓이 S = 3² + 2² = 13', PCOL.gold, 14);
        ptag(ox + 1.5 * u, oy - 12, '3칸', PCOL.cyan, 12, 'aux');
        ptag(ox - 20, oy + 1 * u, '2칸', PCOL.cyan, 12, 'aux');
        [A, B, C, D].forEach((p, i) => pdot(p, 'ABCD'[i], PCOL.white, pt(cx, cy)));

        drawBottomTapeBanner(rect, '바깥 5×5 정사각형(25) = 기울어진 정사각형(3²+2²=13) + 귀퉁이 직각삼각형 4개(4×3=12)', [
          { text: '기울어진 정사각형 넓이 = 13 (3²+2²)', weight: 13 / 25, color: PCOL.gold },
          { text: '귀퉁이 삼각형 4개 = 12 (4×3)', weight: 12 / 25, color: PCOL.cyan }
        ]);
        return;
      }

      if (subId === 'chainTri') {
        const u = 14.5 * s;
        const B = pt(cx - 85 * s, cy + 75 * s);
        const A = pt(B.x, B.y - 3 * u);
        const C = pt(B.x + 4 * u, B.y);
        const v = norm(sub(C, A));
        const n = pt(v.y, -v.x);
        const D = add(C, mul(n, 12 * u));

        ppoly([A, B, C], 'rgba(56, 189, 248, 0.28)', PCOL.cyan, 3.2, 0);
        ppoly([A, C, D], 'rgba(251, 191, 36, 0.28)', PCOL.gold, 3.2, 2);
        pline(A, C, PCOL.green, 4.2, [], true, 1);
        pright(B, A, C, 12, PCOL.cyan);
        pright(C, A, D, 13, PCOL.gold);

        ptag(B.x - 22, (A.y + B.y) / 2, `${3 * k}`, PCOL.cyan);
        ptag((B.x + C.x) / 2, B.y + 20, `${4 * k}`, PCOL.cyan);
        // [2.0] 변 위 글자는 변 바깥쪽에 화면 픽셀 간격으로(ptagAt) — 휴대폰에서 변과 겹치던 것을 피함
        ptagAt(mid(A, C), `AC=${5 * k}`, PCOL.green, 13, 'left', 8, -8);
        ptag((C.x + D.x) / 2 + 22, (C.y + D.y) / 2 + 8, `${12 * k}`, PCOL.gold);
        ptagAt(mid(A, D), `빗변 AD = ${13 * k}`, PCOL.gold, 14, 'right', -6, -10);
        [A, B, C, D].forEach((p, i) => pdot(p, 'ABCD'[i], PCOL.white, mid(A, C)));

        drawBottomTapeBanner(rect, `연쇄 직각삼각형: AD²(${(13*k)**2}) = AB²(${(3*k)**2}) + BC²(${(4*k)**2}) + CD²(${(12*k)**2})`, [
          { text: `AB²(${(3*k)**2})`, weight: 9 / 169, color: PCOL.cyan },
          { text: `BC²(${(4*k)**2})`, weight: 16 / 169, color: PCOL.green },
          { text: `CD²(${(12*k)**2}) ➔ 합 AD²=${(13*k)**2}`, weight: 144 / 169, color: PCOL.gold }
        ]);
        return;
      }

      if (subId === 'rotated') {
        const rotAng = state.fold * (Math.PI * 0.25);
        const center = pt(cx, cy - 10 * s);
        const B0 = pt(cx - 82 * s, cy + 25 * s), C0 = pt(cx + 82 * s, cy + 25 * s);
        // [2.0 수정] 원본은 족보(5:12:13 등)를 골라도 그림은 늘 3:4:5 모양이었습니다 → 고른 족보의 비율로 직각 꼭짓점 A를 놓습니다(3:4:5이면 원본과 같은 위치)
        const A0 = rightApex(B0, C0, fam);
        const A = rot(A0, center, rotAng), B = rot(B0, center, rotAng), C = rot(C0, center, rotAng);

        drawOutwardSquare(B, A, 'rgba(56,189,248,0.22)', PCOL.cyan, a, `S₁ = ${a}² = ${a * a}`, 1, 0);
        drawOutwardSquare(A, C, 'rgba(52,211,153,0.22)', PCOL.green, b, `S₂ = ${b}² = ${b * b}`, 1, 1);
        drawOutwardSquare(C, B, 'rgba(251,191,36,0.26)', PCOL.gold, c, `빗변 S₃ = ${c}² = ${c * c}`, 1, 2);

        ppoly([A, B, C], 'rgba(255,255,255,0.14)', PCOL.white, 3.2);
        pline(B, C, PCOL.gold, 4.4, [], true, 2);
        pright(A, B, C, 13, PCOL.gold);
        pdot(A, 'A(90°)', PCOL.gold, center);
        pdot(B, 'B', PCOL.cyan, center);
        pdot(C, 'C', PCOL.green, center);

        drawBottomTapeBanner(rect, `∠A = 90° 맞은편 대변 BC가 빗변! BC²(${c*c}) = AB²(${a*a}) + AC²(${b*b})`, [
          { text: `AB² = ${a * a}`, weight: (a * a) / (c * c), color: PCOL.cyan },
          { text: `AC² = ${b * b}`, weight: (b * b) / (c * c), color: PCOL.green }
        ]);
        return;
      }

      // std345 & findLeg
      const isFindLeg = subId === 'findLeg';
      const maxDim = Math.max(fam.a, fam.b, fam.c);
      const u = (115 / maxDim) * s;

      const C = pt(cx - 18 * s, cy + 28 * s);
      const B = pt(C.x - fam.a * u, C.y);
      const A = pt(C.x, C.y - fam.b * u);

      // [2.0 수정] 모눈 타일 수를 이름표의 한 변(a·b·c = 족보 × k)과 같게(원본은 ×k를 눌러도 족보의 기본 타일 수 그대로였습니다)
      drawOutwardSquare(B, C, 'rgba(56, 189, 248, 0.24)', PCOL.cyan, a, `S₁ = ${a}² = ${a * a}`, -1, isFindLeg ? 1 : 0);
      drawOutwardSquare(C, A, isFindLeg ? 'rgba(244, 114, 182, 0.30)' : 'rgba(52, 211, 153, 0.24)', isFindLeg ? PCOL.pink : PCOL.green, b, `S₂ = ${b}² = ${b * b}`, -1, isFindLeg ? 2 : 1);
      drawOutwardSquare(A, B, 'rgba(251, 191, 36, 0.26)', PCOL.gold, c, `S₃ = ${c}² = ${c * c}`, -1, isFindLeg ? 0 : 2);

      ppoly([A, B, C], 'rgba(255, 255, 255, 0.15)', PCOL.white, 3.4);
      if (state.conceptSwitch === 'def') pline(A, B, PCOL.gold, 4.8, [], true);
      pright(C, A, B, 13, PCOL.gold);

      pdot(A, 'A', PCOL.green, null, { x: 10, y: -6 });
      pdot(B, 'B', PCOL.cyan, null, { x: -18, y: 16 });
      pdot(C, 'C(90°)', PCOL.gold, null, { x: 10, y: 16 });

      drawBottomTapeBanner(
        rect,
        isFindLeg
          ? `직각변 역산: S₂(${b * b}) = 빗변 S₃(${c * c}) - 작은 S₁(${a * a})  ➔  b = ${b}`
          : `피타고라스 넓이 조립: S₁(${a}²=${a * a}) + S₂(${b}²=${b * b}) = 빗변 S₃(${c}²=${c * c})`,
        [
          { text: `S₁ = ${a}² = ${a * a}`, weight: (a * a) / (c * c), color: PCOL.cyan },
          { text: `S₂ = ${b}² = ${b * b}`, weight: (b * b) / (c * c), color: isFindLeg ? PCOL.pink : PCOL.green }
        ]
      );
    }

    // =========================================================================
    // [탭 2 렌더링] 4대 시각적 증명 (유클리드 풍차 연속 시연 · 바스카라 · 가필드)
    // =========================================================================
    function renderMode2FourProofs(rect, cx, cy) {
      const sub = state.subType[2];
      const s = state.scale * 0.96;
      const t = state.fold;

      if (sub === 'euclid') {
        const es = s * 0.72;
        const oy = cy - 22 * es;
        const B = pt(cx - 100 * es, oy + 15 * es);
        const C = pt(cx + 100 * es, oy + 15 * es);
        const H = pt(cx - 28 * es, oy + 15 * es);
        const A = pt(cx - 28 * es, oy - 81 * es);
        const G = pt(cx - 124 * es, oy - 153 * es);
        const F = pt(cx - 196 * es, oy - 57 * es);
        const I = pt(cx + 68 * es, oy - 209 * es);
        const J = pt(cx + 196 * es, oy - 113 * es);
        const D = pt(cx - 100 * es, oy + 215 * es);
        const E = pt(cx + 100 * es, oy + 215 * es);
        const L = pt(cx - 28 * es, oy + 215 * es);

        ppoly([A, B, F, G], 'rgba(56, 189, 248, 0.18)', PCOL.cyan, 2.6, 0);
        ppoly([B, H, L, D], 'rgba(56, 189, 248, 0.20)', PCOL.cyan, 2.6, 0);
        ppoly([A, C, J, I], 'rgba(52, 211, 153, 0.18)', PCOL.green, 2.6, 2);
        ppoly([H, C, E, L], 'rgba(52, 211, 153, 0.20)', PCOL.green, 2.6, 2);
        ppoly([A, B, C], 'rgba(255, 255, 255, 0.15)', PCOL.white, 3.2);
        pline(A, L, PCOL.gold, 2.2, [5, 4]);
        pright(A, B, C, 11, PCOL.gold);
        pright(H, A, C, 10, PCOL.gold);
        // [표시 보강] 정사각형의 직각(점 B 에서 90° 회전하는 각 ∠ABF, ∠CBD)과 SAS 합동의 같은 길이 눈금: BF = BA (|), BD = BC (||)
        pright(B, A, F, 11, PCOL.cyan);
        pright(B, C, D, 11, PCOL.green);
        ptick(B, F, 1, PCOL.cyan); ptick(A, B, 1, PCOL.cyan);
        ptick(B, D, 2, PCOL.green); ptick(B, C, 2, PCOL.green);
        // 끼인각 ∠FBC = ∠ABD (= 90° + ∠ABC, ●) — 합동 단계(②·③)에서 보임
        if (t > 0.33) {
          pangle(B, F, C, PCOL.pink, 36, 1, '●');
          pangle(B, A, D, PCOL.pink, 26, 1, '●');
        }

        // ★ 연속 3구간 유클리드 변형 애니메이션 (t: 0 ~ 1) ★
        let activeTri = [F, A, B];
        let stepDesc = '① 출발: 정사각형 절반 △FAB (넓이 72)';
        if (t <= 0.33) {
          const u = t / 0.33;
          pline(G, C, PCOL.pink, 2.0, [5, 4]);
          ppar(G, C, 1, PCOL.pink, 0.3); ppar(F, B, 1, PCOL.pink, 0.5); // [표시 보강] GC ∥ FB
          activeTri = [F, lerp(A, C, u), B];
          stepDesc = '① 평행선(GC∥FB) 등적변형: △FAB = △FBC';
        } else if (t <= 0.67) {
          const u = (t - 0.33) / 0.34;
          const rotAng = u * (Math.PI / 2);
          activeTri = [rot(F, B, rotAng), B, rot(C, B, rotAng)];
          stepDesc = '② 점 B 중심 90° 회전 SAS 합동: △FBC ≡ △ABD';
          pdot(B, 'B(90° 회전축!)', PCOL.gold, null, { x: -42, y: 18 });
        } else {
          const u = (t - 0.67) / 0.33;
          pline(A, L, PCOL.pink, 2.4, [5, 4]);
          ppar(A, L, 1, PCOL.pink, 0.3); ppar(B, D, 1, PCOL.pink, 0.5); // [표시 보강] AL ∥ BD
          activeTri = [lerp(A, H, u), B, D];
          stepDesc = '③ 평행선(AL∥BD) 등적변형: △ABD = △HBD (완성!)';
        }

        ppoly(activeTri, 'rgba(251, 191, 36, 0.56)', PCOL.gold, 3.8, 1);

        pdot(A, 'A', PCOL.white, null, { x: -4, y: -12 });
        pdot(B, 'B', PCOL.white, null, { x: -18, y: 12 });
        pdot(C, 'C', PCOL.white, null, { x: 10, y: 12 });
        pdot(H, 'H', PCOL.gold, null, { x: 8, y: 16 });
        pdot(F, 'F', PCOL.cyan, null, { x: -16, y: 4 });
        pdot(G, 'G', PCOL.cyan, null, { x: -12, y: -10 });
        pdot(D, 'D', PCOL.cyan, null, { x: -16, y: 14 });
        pdot(E, 'E', PCOL.green, null, { x: 10, y: 14 });
        pdot(L, 'L', PCOL.gold, null, { x: -4, y: 18 });

        drawMiniOverlayBox(rect, '🌪️ 유클리드 넓이 불변 사슬', [
          { txt: '① △FAB = ½ □ABFG (72)', col: '#38bdf8' },
          { txt: '② = △FBC (GC∥FB 등적변형)', col: '#fbbf24' },
          { txt: '③ ≡ △ABD (점 B 90° 회전 SAS)', col: '#f472b6' },
          { txt: '④ = △HBD = ½ □BDLH (72)', col: '#34d399' }
        ]);

        drawBottomTapeBanner(rect, `${stepDesc}  |  □ABFG(144) + □ACJI(256) = □BCED(400)`, [
          { text: '왼쪽 □ABFG = □BDLH (144)', weight: 144 / 400, color: PCOL.cyan },
          { text: '오른쪽 □ACJI = □HCEL (256)', weight: 256 / 400, color: PCOL.green }
        ]);
        return;
      }

      if (sub === 'bhaskaraOut') {
        const a = 74 * s, b = 98 * s, L = a + b;
        const ox = cx - L / 2, oy = cy - L / 2 - 12 * s;
        const p = (x, y) => pt(ox + x, oy + y);
        const corners = [p(0, 0), p(0, L), p(L, L), p(L, 0)];
        ppoly(corners, 'rgba(251,191,36,0.18)', PCOL.gold, 3.0, 0, 'area aux');

        const parts = [
          { o: p(0, 0), u: pt(0, a), v: pt(b, 0), dst: p(a, 0), theta: 0 },
          { o: p(0, L), u: pt(a, 0), v: pt(0, -b), dst: p(0, L), theta: 0 },
          { o: p(L, L), u: pt(0, -a), v: pt(-b, 0), dst: p(a, a), theta: -Math.PI / 2 },
          { o: p(L, 0), u: pt(-a, 0), v: pt(0, b), dst: p(L, a), theta: Math.PI / 2 }
        ];
        parts.forEach((part, i) => {
          const angle = part.theta * t, ca = Math.cos(angle), sa = Math.sin(angle);
          const center = lerp(part.o, part.dst, t);
          const apply = (v) => pt(center.x + v.x * ca - v.y * sa, center.y + v.x * sa + v.y * ca);
          const tri = [center, apply(part.u), apply(part.v)];
          ppoly(
            tri,
            ['rgba(56,189,248,0.44)', 'rgba(52,211,153,0.44)', 'rgba(244,114,182,0.42)', 'rgba(56,189,248,0.44)'][i],
            [PCOL.cyan, PCOL.green, PCOL.pink, PCOL.cyan][i],
            2.4,
            1
          );
          // [표시 보강] 직각 표시는 모든 렌즈에서 보이게(원본은 '직각' 렌즈에서만), 합동 삼각형의 두 예각: ● (u쪽 끝) · × (v쪽 끝) — 해설의 '● + × = 90°'
          pright(tri[0], tri[1], tri[2], 10, PCOL.gold);
          pangle(tri[1], tri[0], tri[2], PCOL.cyan, 17, 1, '●');
          pangle(tri[2], tri[0], tri[1], PCOL.pink, 17, 2, '×');
        });
        if (t < 0.15) { // 가운데 사각형의 네 각은 180° - (● + ×) = 90°
          const qs = [p(0, a), p(b, 0), p(L, b), p(a, L)];
          qs.forEach((q0, i) => pright(q0, qs[(i + 1) % 4], qs[(i + 3) % 4], 10, PCOL.gold));
        }

        if (t < 0.15) {
          ptag(cx, oy + L / 2 + 4, '가운데 정사각형 c² = 100', PCOL.gold, 14);
        } else if (t > 0.85) {
          ptag(ox + a / 2, oy + a / 2 + 4, 'a² = 36', PCOL.gold, 13.5);
          ptag(ox + a + b / 2, oy + a + b / 2 + 4, 'b² = 64', PCOL.gold, 14);
        }

        drawBottomTapeBanner(rect, '조비산경 외접 정사각형(14²=196) = 직각삼각형 4개(96) + 빈 공간(c² = a²+b² = 100)', [
          { text: '삼각형 4개 합 (4×24 = 96)', weight: 96 / 196, color: PCOL.cyan },
          { text: '빈 공간 c² = a²(36)+b²(64) = 100', weight: 100 / 196, color: PCOL.gold }
        ]);
        return;
      }

      if (sub === 'bhaskaraIn') {
        const L = 162 * s;
        const ox = cx - L / 2, oy = cy - L / 2 - 12 * s;
        const A = pt(ox, oy), B = pt(ox, oy + L), C = pt(ox + L, oy + L), D = pt(ox + L, oy);
        const P = pt(A.x + 0.6 * L * 0.8, A.y + 0.6 * L * 0.6);
        const Q = pt(B.x + 0.6 * L * 0.6, B.y - 0.6 * L * 0.8);
        const R = pt(C.x - 0.6 * L * 0.8, C.y - 0.6 * L * 0.6);
        const S = pt(D.x - 0.6 * L * 0.6, D.y + 0.6 * L * 0.8);

        ppoly([A, B, C, D], 'rgba(251, 191, 36, 0.45)', PCOL.gold, 3.4, 1);
        ppoly([A, B, P], 'rgba(56, 189, 248, 0.36)', PCOL.cyan, 2.6, 0);
        ppoly([B, C, Q], 'rgba(52, 211, 153, 0.36)', PCOL.green, 2.6, 0);
        ppoly([C, D, R], 'rgba(56, 189, 248, 0.36)', PCOL.cyan, 2.6, 0);
        ppoly([D, A, S], 'rgba(52, 211, 153, 0.36)', PCOL.green, 2.6, 0);
        pright(P, A, B, 10, PCOL.gold);
        pright(Q, B, C, 10, PCOL.gold);
        pright(R, C, D, 10, PCOL.gold); pright(S, D, A, 10, PCOL.gold); // [표시 보강] 네 직각삼각형 모두의 직각

        [A, B, C, D].forEach((p, i) => pdot(p, 'ABCD'[i], PCOL.white, pt(cx, oy + L / 2)));
        ptag(cx, oy + L / 2 + 4, '(b-a)²=2²=4', PCOL.gold, 12.5);

        drawBottomTapeBanner(rect, '바스카라 내접 정사각형 c²(100) = 직각삼각형 4개(96) + 가운데 구멍 (8-6)²(4)', [
          { text: '직각삼각형 4개 합 (4×24 = 96)', weight: 92 / 100, color: PCOL.cyan },
          { text: '(b-a)²=4', weight: 8 / 100, color: PCOL.gold }
        ]);
        return;
      }

      if (sub === 'garfield') {
        const a = 74 * s, b = 98 * s;
        const C = pt(cx - (a + b) / 2, cy + 55 * s);
        const E = pt(C.x + b, C.y);
        const D = pt(C.x + b + a, C.y);
        const B = pt(C.x, C.y - a);
        const A = pt(D.x, D.y - b);

        ppoly([B, C, E], 'rgba(56, 189, 248, 0.32)', PCOL.cyan, 3.0, 0);
        ppoly([E, D, A], 'rgba(52, 211, 153, 0.32)', PCOL.green, 3.0, 0);
        ppoly([B, E, A], 'rgba(251, 191, 36, 0.40)', PCOL.gold, 3.4, 1);

        pright(C, B, E, 12, PCOL.cyan);
        pright(D, A, E, 12, PCOL.green);
        pright(E, B, A, 14, PCOL.gold);

        pangle(E, B, C, PCOL.cyan, 25, 1, '●');
        pangle(E, A, D, PCOL.pink, 25, 2, '×');
        // [표시 보강] 같은 각은 같은 표시: ∠BEC = ∠DAE (●), ∠AED = ∠CBE (×) — 합동인 두 직각삼각형, 그리고 같은 길이 눈금
        pangle(A, D, E, PCOL.cyan, 25, 1, '●');
        pangle(B, C, E, PCOL.pink, 25, 2, '×');
        ptick(B, C, 1, PCOL.cyan); ptick(E, D, 1, PCOL.green);
        ptick(C, E, 2, PCOL.cyan); ptick(D, A, 2, PCOL.green);
        ptick(B, E, 3, PCOL.gold); ptick(E, A, 3, PCOL.gold);

        pdot(A, 'A', PCOL.green, null, { x: 10, y: -8 });
        pdot(B, 'B', PCOL.cyan, null, { x: -16, y: -8 });
        pdot(C, 'C(90°)', PCOL.white, null, { x: -18, y: 18 });
        pdot(E, 'E(∠AEB=90°)', PCOL.gold, null, { x: -20, y: 22 });
        pdot(D, 'D(90°)', PCOL.white, null, { x: 8, y: 18 });

        ptag((B.x + A.x + E.x) / 3, (B.y + A.y + E.y) / 3 + 6, '½c² = 50', PCOL.gold, 13.5);
        drawBottomTapeBanner(rect, '가필드 사다리꼴 넓이(98) = 양옆 직각삼각형 2개(24+24=48) + 가운데 직각이등변(½c²=50)', [
          { text: '△BCE (24)', weight: 24 / 98, color: PCOL.cyan },
          { text: '△EDA (24)', weight: 24 / 98, color: PCOL.green },
          { text: '가운데 직각이등변 ½c² = 50', weight: 50 / 98, color: PCOL.gold }
        ]);
        return;
      }

      // simProof — [2.0 수정] 해설은 AB=12, AC=16, BC=20(AB²=144, AC²=256)인데 원본 그림은 15·20·25로 적혀 있었습니다 → 해설 수치(12·16·20 = 15·20·25의 0.8배)로 그림
      renderMode7CowFormulas(rect, cx, cy, true);
    }

    // =========================================================================
    // [탭 3 렌더링] 피타고라스 수 4대 족보 & (3, 4, x) 함정 반례
    // =========================================================================
    function renderMode3Triples(rect, cx, cy) {
      const sub = state.subType[3];
      const s = state.scale * 1.02;

      if (sub === 'trap34x') {
        const L_C = pt(cx - 95 * s, cy + 48 * s), L_B = pt(cx - 205 * s, cy + 48 * s), L_A = pt(cx - 95 * s, cy - 36 * s);
        ppoly([L_A, L_B, L_C], 'rgba(52, 211, 153, 0.28)', PCOL.green, 3.2, 0);
        pright(L_C, L_A, L_B, 12, PCOL.green);
        ptag((L_B.x + L_C.x) / 2, L_C.y + 20, '4', PCOL.white);
        ptag(L_C.x + 14, (L_A.y + L_C.y) / 2, '3', PCOL.white);
        ptagAt(mid(L_A, L_B), '빗변 x = 5 (x²=25)', PCOL.green, 13, 'right', -8, -8); // [2.0] 변 바깥쪽에
        ptag(cx - 150 * s, cy - 68 * s, '[경우 1] x가 빗변일 때 (x² = 25)', PCOL.green, 13);

        // [2.0 수정] 경우 2는 직각변 3과 x=√7(<3), 빗변 4 → 원본 그림은 x 쪽이 3보다 길고 빗변이 4보다 길어(100px) 해설과 어긋났습니다. 3:√7:4 비율로
        const R_C = pt(cx + 95 * s, cy + 48 * s), R_B = pt(cx + 95 * s, cy - 36 * s), R_A = pt(cx + (95 + 84 * Math.sqrt(7) / 3) * s, cy + 48 * s);
        ppoly([R_A, R_B, R_C], 'rgba(244, 63, 94, 0.28)', PCOL.red, 3.2, 1);
        pline(R_A, R_B, PCOL.gold, 4.2, [], true, 1);
        pright(R_C, R_B, R_A, 12, PCOL.red);
        ptag(R_C.x - 16, (R_B.y + R_C.y) / 2, '3', PCOL.white);
        ptag((R_C.x + R_A.x) / 2, R_C.y + 20, '직각변 x² = 4²-3² = 7!', PCOL.red, 13);
        ptagAt(mid(R_A, R_B), '빗변 = 4', PCOL.gold, 13.5, 'left', 10, -6);
        ptag(cx + 145 * s, cy - 68 * s, '[경우 2] 4가 빗변일 때! (x² = 7)', PCOL.red, 13);

        drawBottomTapeBanner(rect, '⚠️ 세 변이 (3, 4, x)일 때: ① x가 빗변이면 x²=25  |  ② 4가 빗변이면 x²=4²-3²=7 (총 2가지!)');
        return;
      }

      const fam = getActiveTriple();
      const k = state.multK;
      const a = fam.a * k, b = fam.b * k, c = fam.c * k;
      const visScale = (0.76 + 0.07 * k) * s;
      // [2.0 수정] 원본은 세로에 32px를 더해 3:4:5가 거의 직각이등변삼각형으로 보였습니다 → 짧은 변 : 긴 변 = a : b 그대로
      const wPx = 190 * visScale, hPx = (fam.a / fam.b) * 190 * visScale;

      const C = pt(cx + wPx / 2, cy + hPx / 2 - 12 * s);
      const B = pt(cx - wPx / 2, cy + hPx / 2 - 12 * s);
      const A = pt(cx + wPx / 2, cy - hPx / 2 - 12 * s);

      ppoly([A, B, C], 'rgba(56, 189, 248, 0.24)', PCOL.cyan, 3.6);
      pline(B, C, PCOL.green, 4.0, [], false, 1);
      pline(C, A, PCOL.cyan, 4.0, [], false, 0);
      pline(A, B, PCOL.gold, 4.4, [], true, 2);
      pright(C, A, B, 14, PCOL.gold);

      if (k > 1) {
        for (let i = 1; i < k; i++) {
          const r = i / k;
          pdot(lerp(B, C, r), '', PCOL.green);
          pdot(lerp(C, A, r), '', PCOL.cyan);
          pdot(lerp(B, A, r), '', PCOL.gold);
        }
      }

      pdot(A, 'A', PCOL.cyan, null, { x: 10, y: -8 });
      pdot(B, 'B', PCOL.green, null, { x: -18, y: 16 });
      pdot(C, 'C(90°)', PCOL.gold, null, { x: 10, y: 16 });

      ptag((B.x + C.x) / 2, C.y + 24, `긴 직각변 b = ${fam.b} × ${k} = ${b}`, PCOL.green, 13.5);
      // [2.0] 원본은 설계 좌표 오프셋(68·−35)이라 휴대폰에서 글자가 변과 겹침 → 변 바깥쪽에 화면 픽셀 간격으로
      ptagAt(pt(C.x, (A.y + C.y) / 2), `짧은 변 a = ${fam.a} × ${k} = ${a}`, PCOL.cyan, 13.5, 'left', 12, 4);
      ptagAt(mid(A, B), `빗변 c = ${fam.c} × ${k} = ${c}`, PCOL.gold, 14.5, 'right', -10, -8);

      drawBottomTapeBanner(rect, `[${fam.label} 가문 × ${k}배] ${a}²(${a*a}) + ${b}²(${b*b}) = ${c}²(${c*c})`, [
        { text: `a² = ${a * a}`, weight: (a * a) / (c * c), color: PCOL.cyan },
        { text: `b² = ${b * b}`, weight: (b * b) / (c * c), color: PCOL.green }
      ]);
    }

    // =========================================================================
    // [탭 4 렌더링] 예각·직각·둔각 경첩 판별기 & 삼각형 결정 조건 수직선
    // [2.0 수정] 원본은 5개 장면을 모두 6·8 경첩(∠C 76°·106° 고정)으로 그려서 '세 변 (5, 6, 7)'·'(4, 5, 7)'·'(3, 4, x)' 장면의
    //            그림이 제목·해설과 달랐습니다. 장면마다 실제 변의 길이(hingeCalc)로 그리고, 변 길이를 그림에 적습니다.
    //            (경첩 장면 6·8, 예각 범위 6·8·x 는 원본 그대로, 수직선은 둔각·예각 '범위' 장면에서만 보입니다)
    // =========================================================================
    function renderMode4AngleJudge(rect, cx, cy) {
      const sub = state.subType[4];
      const s = state.scale * 1.02;
      const hc = hingeCalc(sub);
      const degC = hc.deg;
      const radC = (hc.exact * Math.PI) / 180;
      const unit = (132 / hc.a) * s; // 아래 변 BC(a)가 132 가 되도록(원본과 같은 크기)
      const lenB = hc.a * unit, lenA = hc.b * unit;
      const C = pt(cx - 18 * s, cy + 12 * s);
      const B = pt(C.x + lenB, C.y);
      const A0 = pt(C.x, C.y - lenA);
      const A = pt(C.x + lenA * Math.cos(radC), C.y - lenA * Math.sin(radC));
      const isHinge = sub === 'hinge';
      const showBar = sub === 'obtuseRange' || sub === 'acuteRange';
      const c0 = Math.sqrt(hc.base);
      const c0Txt = Number.isInteger(c0) ? `${c0}` : `√${hc.base}`;
      const thirdName = showBar ? 'x' : 'c';

      // 직각 기준선 & 회전 궤적 원호
      pline(C, A0, 'rgba(255,255,255,0.32)', 1.8, [5, 4]);
      pline(B, A0, 'rgba(251,191,36,0.45)', 2.0, [5, 4]);
      // 직각에 가까우면 점 A가 A₀와 겹치므로 이름표는 생략합니다(두 이름이 겹쳐 읽을 수 없었음)
      // 점 A가 A₀의 오른쪽(예각)이면 이름표를 왼쪽에, 왼쪽(둔각)이면 오른쪽에 놓아 점 A와 겹치지 않게 합니다
      lensRun('def', () => {
        BOARD.point(A0, { color: 'rgba(251,191,36,0.75)', r: 5.2 });
        if (Math.abs(hc.deg - 90) >= 8 && !BOARD.thumb) BOARD.text(A0, `A₀(90° 기준 ${thirdName}=${c0Txt})`, { color: 'rgba(251,191,36,0.75)', size: 12.5, align: A.x > A0.x ? 'right' : 'left', baseline: 'alphabetic', weight: 800, dx: A.x > A0.x ? -10 : 10, dy: -12 });
      });

      // [2.0] 원본의 ctx.arc 블록 → 호환 함수 parc (같은 호·같은 점선, '보조선' 렌즈 규칙)
      lensRun('aux', () => parc(C, lenA, -Math.PI * 0.85, -Math.PI * 0.15, 'rgba(255,255,255,0.22)', 1.6, [4, 4]));

      const isRight = Math.abs(degC - 90) < 2;
      const isAcute = degC < 90;
      const triCol = isRight ? PCOL.gold : isAcute ? PCOL.cyan : PCOL.red;
      const fillCol = isRight ? 'rgba(251,191,36,0.26)' : isAcute ? 'rgba(56,189,248,0.24)' : 'rgba(244,63,94,0.24)';

      ppoly([A, B, C], fillCol, triCol, 3.6, 1);
      if (isRight) pright(C, A, B, 14, PCOL.gold);
      else pangle(C, B, A, triCol, 26, 1, `${degC}°`);

      pdot(C, `C(${degC}°)`, triCol, null, { x: -20, y: 20 });
      pdot(B, 'B', PCOL.white, null, { x: 10, y: 18 });
      if (isHinge) {
        // 점 A를 끌어 각도를 바꿉니다(원본: 점 A 근처를 마우스로 잡고 돌리기, 45°~140°)
        BOARD.handle('A', A, {
          color: isRight ? 'amber' : isAcute ? 'sky' : 'red', label: txt('A(드래그로 각도 조절!)'), dx: -15, dy: -12, align: 'left',
          drag: (w) => { S.hinge = clampN(Math.round((Math.atan2(C.y - w.y, w.x - C.x) * 180) / Math.PI), 45, 140); }
        });
      } else {
        pdot(A, 'A', triCol, null, { x: -15, y: -12 });
      }

      // [2.0 수정] 변 길이를 그림에 적습니다: a = BC, b = AC
      ptag((B.x + C.x) / 2, C.y + 22, `a = ${hc.a}`, PCOL.white, 12.5);
      {
        const mx = (A.x + C.x) / 2, my = (A.y + C.y) / 2;
        let nx = A.y - C.y, ny = C.x - A.x; // AC에 수직인 방향 중 B 반대쪽
        if (nx * (B.x - C.x) + ny * (B.y - C.y) > 0) { nx = -nx; ny = -ny; }
        const nl = Math.hypot(nx, ny) || 1;
        ptag(mx + (nx / nl) * 18, my + (ny / nl) * 18 + 4, `b = ${hc.b}`, PCOL.white, 12.5);
      }

      const cSq = hc.cSq;
      const signStr = isRight ? '=' : isAcute ? '<' : '>';
      ptagAt({ x: (A.x + B.x) / 2, y: (A.y + B.y) / 2 }, `${thirdName}² = ${cSq} ${signStr} ${hc.base}(${hc.b}²+${hc.a}²)`, triCol, 14, 'left', 10, -8);

      // 수직선 범위 시각화 (둔각·예각 '범위' 장면에서만)
      if (showBar) {
        const barY = cy + 78 * s;
        const xL = cx - 175 * s, xR = cx + 175 * s;
        pline(pt(xL, barY), pt(xR, barY), PCOL.white, 2.5);

        if (sub === 'acuteRange') {
          const pMin = cx - 95 * s, pMax = cx + 95 * s;
          ppoly([pt(pMin, barY - 18), pt(pMax, barY - 18), pt(pMax, barY), pt(pMin, barY)], 'rgba(52, 211, 153, 0.34)', PCOL.green, 2.4, 2);
          pdot(pt(pMin, barY), '√28(≈5.3)', PCOL.pink, null, { x: -20, y: 20 });
          pdot(pt(pMax, barY), '10(√100)', PCOL.cyan, null, { x: -15, y: 20 });
          ptag(cx, barY - 26, '예각 공통범위: 28 < x² < 100  ➔  자연수 x = 6, 7, 8, 9 (4개)', PCOL.green, 13);
        } else {
          const p5 = cx - 40 * s, p7 = cx + 95 * s;
          ppoly([pt(p5, barY - 18), pt(p7, barY - 18), pt(p7, barY), pt(p5, barY)], 'rgba(244, 63, 94, 0.35)', PCOL.red, 2.4, 2);
          pdot(pt(cx - 125 * s, barY), '1(4-3)', PCOL.white, null, { x: -15, y: 20 });
          pdot(pt(p5, barY), '5(직각 √25)', PCOL.gold, null, { x: -25, y: 20 });
          pdot(pt((p5 + p7) / 2, barY), 'x=6(둔각 자연수!)', PCOL.green, null, { x: -35, y: -12 });
          pdot(pt(p7, barY), '7(삼각형 한계 3+4)', PCOL.red, null, { x: -30, y: 20 });
        }
      }

      drawBottomTapeBanner(rect, `현재 ∠C = ${degC}°: ${thirdName}²(${cSq}) ${signStr} a²+b²(${hc.base})  |  둔각 필수 범위: √(a²+b²) < ${thirdName} < a+b`);
    }

    // =========================================================================
    // [탭 5 렌더링] 겹친 도형 제곱의 합 공식 3총사
    // =========================================================================
    function renderMode5SumOfSquares(rect, cx, cy) {
      const sub = state.subType[5];
      const s = state.scale * 1.04;

      if (sub === 'rightCross') {
        const A = pt(cx - 110 * s, cy - 82 * s);
        const B = pt(cx - 110 * s, cy + 82 * s);
        const C = pt(cx + 120 * s, cy - 82 * s);
        const D = lerp(A, B, 0.45 + 0.15 * Math.sin(state.fold * Math.PI));
        const E = lerp(A, C, 0.48);

        ppoly([A, B, C], 'rgba(255, 255, 255, 0.06)', PCOL.white, 2.6);
        pright(A, B, C, 14, PCOL.gold);

        pline(D, E, PCOL.cyan, 4.4, [], true, 0, 'area aux');
        pline(B, C, PCOL.cyan, 4.4, [], true, 0, 'area def');
        pline(B, E, PCOL.pink, 4.0, [6, 4], true, 1, 'area aux');
        pline(C, D, PCOL.pink, 4.0, [6, 4], true, 1, 'area aux');

        pdot(A, 'A(90°)', PCOL.gold, null, { x: -22, y: -10 });
        pdot(B, 'B', PCOL.cyan, null, { x: -18, y: 16 });
        pdot(C, 'C', PCOL.cyan, null, { x: 10, y: -8 });
        pdot(D, 'D', PCOL.pink, null, { x: -20, y: 4 });
        pdot(E, 'E', PCOL.pink, null, { x: -6, y: -12 });

        drawBottomTapeBanner(rect, '직각삼각형 X자 제곱합: DE²(16) + BC²(100) = BE²(64) + CD²(52) = 116', [
          { text: 'DE²(16) + BC²(100) = 116', weight: 0.5, color: PCOL.cyan },
          { text: 'BE²(64) + CD²(52) = 116', weight: 0.5, color: PCOL.pink }
        ]);
        return;
      }

      if (sub === 'rectPointP') {
        const rw = 140 * s, rh = 86 * s;
        const A = pt(cx - rw, cy - rh), B = pt(cx - rw, cy + rh), C = pt(cx + rw, cy + rh), D = pt(cx + rw, cy - rh);
        const P = pt(cx + state.customPOffset.dx * s, cy + state.customPOffset.dy * s);

        ppoly([A, B, C, D], 'rgba(52, 211, 153, 0.10)', PCOL.white, 3.0);
        pright(A, B, D, 11, PCOL.white);
        pright(B, C, A, 11, PCOL.white);
        pright(C, D, B, 11, PCOL.white); pright(D, A, C, 11, PCOL.white); // [표시 보강] 직사각형의 네 직각

        pline(pt(cx - rw, P.y), pt(cx + rw, P.y), 'rgba(255,255,255,0.35)', 1.8, [4, 4]);
        pline(pt(P.x, cy - rh), pt(P.x, cy + rh), 'rgba(255,255,255,0.35)', 1.8, [4, 4]);

        pline(P, A, PCOL.cyan, 4.2, [], true, 0, 'area');
        pline(P, C, PCOL.cyan, 4.2, [], true, 0, 'area');
        pline(P, B, PCOL.pink, 4.2, [], true, 1, 'area');
        pline(P, D, PCOL.pink, 4.2, [], true, 1, 'area');

        const unit = 10 * s;
        const pa2 = Math.round((dist(P, A) / unit) ** 2);
        const pb2 = Math.round((dist(P, B) / unit) ** 2);
        const pc2 = Math.round((dist(P, C) / unit) ** 2);
        const pd2 = pa2 + pc2 - pb2;

        [A, B, C, D].forEach((p, i) => pdot(p, 'ABCD'[i], PCOL.white, pt(cx, cy)));
        // [2.0] 점 P를 끌 수 있는 점(후광)으로: 보이는 화면 안 어디든(직사각형 안팎) 끌 수 있습니다
        BOARD.handle('P', P, {
          color: 'amber', label: txt('P(드래그!)'), dx: 12, dy: -10, align: 'left',
          drag: (w) => {
            const vb = BOARD.viewBox();
            S.px = clampN(w.x, vb.x0 + 12, vb.x1 - 12) / s;
            S.py = clampN(w.y, vb.y0 + 12, vb.y1 - 12) / s;
          }
        });

        drawBottomTapeBanner(rect, `실시간 측정: PA²(${pa2}) + PC²(${pc2}) = PB²(${pb2}) + PD²(${pd2}) = ${pa2 + pc2}`, [
          { text: `PA²(${pa2}) + PC²(${pc2}) = ${pa2 + pc2}`, weight: 0.5, color: PCOL.cyan },
          { text: `PB²(${pb2}) + PD²(${pd2}) = ${pa2 + pc2}`, weight: 0.5, color: PCOL.pink }
        ]);
        return;
      }

      // orthoQuad, orthoSquares, orthoSemis
      const isSq = sub === 'orthoSquares', isSemi = sub === 'orthoSemis';
      const sc = (isSq || isSemi) ? s * 0.68 : s * 0.92;
      const O = pt(cx, cy - 8 * sc);
      const unit = (isSemi ? 12.5 : 18.5) * sc;
      const A = pt(O.x, O.y - (isSemi ? 6 : 3) * unit);
      const B = pt(O.x - (isSemi ? Math.sqrt(44) : 4) * unit, O.y);
      const C = pt(O.x, O.y + (isSemi ? 10 : Math.sqrt(33)) * unit);
      const D = pt(O.x + (isSemi ? 10 : Math.sqrt(31)) * unit, O.y);

      if (isSq) {
        drawOutwardSquare(A, B, 'rgba(56,189,248,0.26)', PCOL.cyan, 0, 'S₁(25)', -1, 0);
        drawOutwardSquare(C, D, 'rgba(56,189,248,0.26)', PCOL.cyan, 0, 'S₃(64)', -1, 0);
        drawOutwardSquare(B, C, 'rgba(251,191,36,0.26)', PCOL.gold, 0, 'S₂(49)', -1, 1);
        drawOutwardSquare(D, A, 'rgba(251,191,36,0.26)', PCOL.gold, 0, 'S₄(40)', -1, 1);
      } else if (isSemi) {
        drawOutwardSemicircle(A, B, 'rgba(56,189,248,0.26)', PCOL.cyan, 'P₁(10π)', true, 0);
        drawOutwardSemicircle(C, D, 'rgba(56,189,248,0.26)', PCOL.cyan, 'P₃(25π)', true, 0);
        drawOutwardSemicircle(B, C, 'rgba(251,191,36,0.26)', PCOL.gold, 'P₂(18π)', true, 1);
        drawOutwardSemicircle(D, A, 'rgba(251,191,36,0.26)', PCOL.gold, 'P₄(17π)', true, 1);
      }

      ppoly([A, B, C, D], 'rgba(255, 255, 255, 0.08)', PCOL.white, 2.4);
      pline(A, C, PCOL.white, 2.2, [5, 4]);
      pline(B, D, PCOL.white, 2.2, [5, 4]);
      pright(O, A, D, 13, PCOL.gold);

      pline(A, B, PCOL.cyan, 4.4, [], true, 0, 'area');
      pline(C, D, PCOL.cyan, 4.4, [], true, 0, 'area');
      pline(B, C, PCOL.gold, 4.4, [], true, 1, 'area');
      pline(D, A, PCOL.gold, 4.4, [], true, 1, 'area');

      pdot(O, 'O(90°)', PCOL.gold, null, { x: 10, y: 16 });
      [A, B, C, D].forEach((p, i) => pdot(p, 'ABCD'[i], PCOL.white, O));

      drawBottomTapeBanner(
        rect,
        isSemi
          ? 'AC⊥BD 반원 넓이 합: P₁(10π) + P₃(25π) = P₂(18π) + P₄(17π) = 35π'
          : 'AC⊥BD 마주보는 변 제곱합: AB²(25) + CD²(64) = BC²(49) + DA²(40) = 89',
        [
          { text: isSemi ? 'P₁ + P₃ = 35π' : 'AB²(25) + CD²(64) = 89', weight: 0.5, color: PCOL.cyan },
          { text: isSemi ? 'P₂ + P₄ = 35π' : 'BC²(49) + DA²(40) = 89', weight: 0.5, color: PCOL.gold }
        ]
      );
    }

    // =========================================================================
    // [탭 6 렌더링] 정삼각형 · 반원 · 히포크라테스의 초승달 넓이
    // =========================================================================
    function renderMode6LunesAndShapes(rect, cx, cy) {
      const sub = state.subType[6];
      const s = state.scale * 0.94;
      const fam = getActiveTriple();
      const k = state.multK;
      const a = fam.a * k, b = fam.b * k, c = fam.c * k;

      const isIso = sub === 'isoLune';
      const B = pt(cx - 102 * s, cy + 32 * s), C = pt(cx + 102 * s, cy + 32 * s);
      // [2.0 수정] 원본은 족보를 골라도 삼각형이 늘 3:4:5 모양 → 고른 족보 비율로 직각 꼭짓점 A를 놓습니다(3:4:5이면 원본과 같은 위치)
      const A = isIso ? pt(cx, cy - 70 * s) : rightApex(B, C, fam);

      if (sub === 'equilateral') {
        drawOutwardEquilateral(B, A, 'rgba(56,189,248,0.28)', PCOL.cyan, 'S₁ = 12', 1, 0);
        drawOutwardEquilateral(A, C, 'rgba(52,211,153,0.28)', PCOL.green, 'S₂ = 20', 1, 1);
        drawOutwardEquilateral(C, B, 'rgba(251,191,36,0.28)', PCOL.gold, 'S₃ = S₁+S₂ = 32', 1, 2);
      } else if (sub === 'semicircles' || sub === 'findHypSemi') {
        drawOutwardSemicircle(B, A, 'rgba(56,189,248,0.28)', PCOL.cyan, sub === 'findHypSemi' ? 'S₁' : `S₁=${(a*a)/2}π`, false, 0);
        drawOutwardSemicircle(A, C, 'rgba(52,211,153,0.28)', PCOL.green, sub === 'findHypSemi' ? 'S₂ (S₁+S₂=18π)' : `S₂=${(b*b)/2}π`, false, 1);
        drawOutwardSemicircle(C, B, 'rgba(251,191,36,0.28)', PCOL.gold, sub === 'findHypSemi' ? 'S₃=18π ➔ r=6, 빗변 2r=12!' : `S₃=${(c*c)/2}π`, false, 2);
      } else {
        // hippoLune & isoLune
        const mBC = mid(B, C), rBC = dist(B, C) / 2;
        const folded = state.fold >= 0.35;
        // [2.0 수정] 원본은 접어 올린 큰 반원을 배경색(#0c221b)으로 덧칠해 두 작은 반원의 겹친 부분을 지웠는데, 테마(칠판·종이)가 바뀌면 덧칠이 보입니다.
        //            같은 모양을 '큰 반원 바깥만 그리기(clip)'로 만듭니다(초승달 두 개만 남음).
        const c2 = BOARD.ctx;
        c2.save();
        if (folded) {
          const bp = arcPts(mBC, rBC, Math.PI, 0, false).map((p) => BOARD.toS(p));
          c2.beginPath();
          c2.rect(0, 0, BOARD.W, BOARD.H);
          bp.forEach((p, i) => (i ? c2.lineTo(p.x, p.y) : c2.moveTo(p.x, p.y)));
          c2.closePath();
          c2.clip('evenodd');
        }
        drawOutwardSemicircle(B, A, 'rgba(251, 191, 36, 0.62)', PCOL.gold, '', false, 0);
        drawOutwardSemicircle(A, C, isIso && state.activePartIdx === 2 ? 'rgba(251, 191, 36, 0.18)' : 'rgba(251, 191, 36, 0.62)', PCOL.gold, '', false, 0);
        c2.restore();

        if (!folded) {
          drawOutwardSemicircle(C, B, 'rgba(56, 189, 248, 0.28)', PCOL.cyan, '큰 반원 S₃ (= S₁+S₂)', false, 1, 'aux');
        } else {
          // 위로 접어 올린 큰 반원: 점선 테두리만(원본의 ctx.arc 블록 → 무대 호출)
          lensRun('aux', (sfx) => BOARD.poly(arcPts(mBC, rBC, Math.PI, 0, false), { fill: null, color: PCOL.cyan, stroke: true, width: sfx.hi ? 4.2 : 2.6, dash: [5, 4], glow: sfx.hi, part: 1 }));
        }

        drawMiniOverlayBox(rect, '🌙 히포크라테스 초승달 소거식', [
          { txt: '전체 = S₁ + S₂ + △ABC', col: '#fef08a' },
          { txt: '빼기 = - S₃ (위로 접은 큰 반원)', col: '#38bdf8' },
          { txt: 'S₁ + S₂ = S₃ 이므로 반원 소멸!', col: '#f43f5e' },
          { txt: `∴ 초승달 합 = △ABC = ${isIso ? 32 : (a*b)/2}`, col: '#34d399' }
        ]);
      }

      const isLune = sub === 'hippoLune' || sub === 'isoLune';
      ppoly([A, B, C], isLune ? 'rgba(52, 211, 153, 0.44)' : 'rgba(255, 255, 255, 0.14)', PCOL.green, 3.4, 2);
      pright(A, B, C, 13, PCOL.gold);
      if (isIso) { // [표시 보강] 직각이등변삼각형: AB = AC (눈금), 두 밑각은 같은 45°
        ptick(A, B, 2, PCOL.green); ptick(A, C, 2, PCOL.green);
        pangle(B, C, A, PCOL.green, 26, 1, '45°');
        pangle(C, B, A, PCOL.green, 26, 1, '45°');
      }
      if (isLune) {
        ptag((A.x + B.x + C.x) / 3, (A.y + B.y + C.y) / 3 + 12, isIso ? '△ABC = 32 (1개=16)' : `△ABC 넓이 = ${(a * b) / 2}`, PCOL.green, 13.5, 'area');
      }

      pdot(A, 'A(90°)', PCOL.gold, null, { x: -12, y: -14 });
      pdot(B, 'B', PCOL.cyan, null, { x: -18, y: 16 });
      pdot(C, 'C', PCOL.green, null, { x: 10, y: 16 });

      drawBottomTapeBanner(
        rect,
        isLune
          ? `히포크라테스 초승달: (S₁ + S₂ + △ABC) - S₃ = △ABC 넓이(${isIso ? 32 : (a * b) / 2}) — 원주율 π가 완전히 사라집니다!`
          : '직각삼각형 세 변 위의 모든 닮은 도형(정사각형·정삼각형·반원)은 S₁ + S₂ = S₃가 성립합니다!'
      );
    }

    // =========================================================================
    // [탭 7 렌더링] 직각삼각형 빗변 수선 & 소(牛) 공식 4형제
    // =========================================================================
    // [2.0 수정] simProof=true: 탭 2 '수선 닮음 증명' 장면용. 원본은 탭 7의 수치(15·20·25 × k)와 탭 7의 마지막 장면(subType[7])을 그대로 가져와
    //            해설(AB²=144, AC²=256, BH=7.2, CH=12.8)과 다른 숫자가 적히고 이전 장면의 강조선이 새어 들어왔습니다.
    function renderMode7CowFormulas(rect, cx, cy, simProof = false) {
      const sub = simProof ? 'simProof' : state.subType[7];
      const s = state.scale * 1.05;
      const k = simProof ? 0.8 : state.multK;
      const R2 = (v) => Math.round(v * 100) / 100;
      const AB = R2(15 * k), AC = R2(20 * k), BC = R2(25 * k), BH = R2(9 * k), CH = R2(16 * k), AH = R2(12 * k);

      const B = pt(cx - 145 * s, cy + 48 * s);
      const C = pt(cx + 145 * s, cy + 48 * s);
      const H = pt(cx - 145 * s + 104.4 * s, cy + 48 * s);
      const A = pt(H.x, cy + 48 * s - 139.2 * s);

      ppoly([A, B, H], 'rgba(56, 189, 248, 0.16)', PCOL.cyan, 2.4, 0, 'area aux');
      ppoly([A, H, C], 'rgba(52, 211, 153, 0.16)', PCOL.green, 2.4, 1, 'area aux');
      pline(A, B, PCOL.white, 3.2);
      pline(A, C, PCOL.white, 3.2);
      pline(B, C, PCOL.white, 3.2);
      pline(A, H, PCOL.white, 2.8, [5, 4]);

      pright(A, B, C, 14, PCOL.gold);
      pright(H, A, B, 12, PCOL.cyan);
      pright(H, A, C, 12, PCOL.green);

      // [표시 보강] 같은 각은 같은 표시·같은 값: ∠B = ∠HAC (●), ∠C = ∠BAH (×) — 그림에서 잰 각도(● + × = 90°)
      const degB = angDeg(B, A, C), degC = angDeg(C, A, B);
      pangle(B, A, C, PCOL.cyan, 28, 1, `●${degB}`, 'def aux');
      pangle(C, A, B, PCOL.pink, 30, 2, `×${degC}`, 'def aux');
      pangle(A, B, H, PCOL.pink, 28, 2, `×${degC}`, 'def aux');
      pangle(A, H, C, PCOL.cyan, 32, 1, `●${degB}`, 'def aux');

      let focusIdx = state.activePartIdx;
      if (focusIdx === -1) {
        if (sub === 'leftWing') focusIdx = 0;
        else if (sub === 'rightWing') focusIdx = 1;
        else if (sub === 'centerPillar') focusIdx = 2;
        else if (sub === 'cowArea') focusIdx = 3;
      }

      if (focusIdx === 0) {
        pline(A, B, PCOL.gold, 5.2, [], true);
        pline(B, H, PCOL.cyan, 4.8, [], true);
        pline(pt(B.x, B.y + 18), pt(C.x, C.y + 18), PCOL.pink, 4.0, [], true);
      } else if (focusIdx === 1) {
        pline(A, C, PCOL.gold, 5.2, [], true);
        pline(H, C, PCOL.green, 4.8, [], true);
        pline(pt(B.x, B.y + 18), pt(C.x, C.y + 18), PCOL.pink, 4.0, [], true);
      } else if (focusIdx === 2) {
        pline(A, H, PCOL.gold, 5.2, [], true);
        pline(B, H, PCOL.cyan, 4.8, [], true);
        pline(H, C, PCOL.green, 4.8, [], true);
      } else if (focusIdx === 3) {
        pline(A, B, PCOL.cyan, 4.8, [], true);
        pline(A, C, PCOL.cyan, 4.8, [], true);
        pline(B, C, PCOL.gold, 4.8, [], true);
        pline(A, H, PCOL.gold, 4.8, [], true);
      }

      pdot(A, 'A(90°)', PCOL.gold, null, { x: 0, y: -14 });
      pdot(B, 'B', PCOL.cyan, null, { x: -18, y: 16 });
      pdot(C, 'C', PCOL.green, null, { x: 10, y: 16 });
      pdot(H, 'H(수선의 발)', PCOL.gold, null, { x: -20, y: 34 });

      ptag((A.x + B.x) / 2 - 28, (A.y + B.y) / 2 - 8, `AB = ${AB}`, PCOL.cyan);
      ptag((A.x + C.x) / 2 + 28, (A.y + C.y) / 2 - 8, `AC = ${AC}`, PCOL.green);
      ptag(H.x + 34, (A.y + H.y) / 2, `AH = ${AH}`, PCOL.gold);
      // [표시 보강] 밑변 B·C 의 각도 값(●53° · ×37°)과 겹치지 않게 BH·CH 이름표를 밑변 아래로
      ptag((B.x + H.x) / 2, B.y + 36, `BH = ${BH}`, PCOL.cyan);
      ptag((H.x + C.x) / 2, C.y + 36, `CH = ${CH}`, PCOL.green);

      drawMiniOverlayBox(rect, '👑 3개 AA 닮음 삼각형 (3:4:5)', [
        { txt: `큰 △ABC : (${AB}, ${AC}, ${BC})`, col: '#fef08a' },
        { txt: `왼 △HBA : (${BH}, ${AH}, ${AB})`, col: '#38bdf8' },
        { txt: `오 △HAC : (${AH}, ${CH}, ${AC})`, col: '#34d399' }
      ], 'aux');

      drawBottomTapeBanner(rect, `① AB²=BH·BC(${R2(AB*AB)}) | ② AC²=CH·CB(${R2(AC*AC)}) | ③ AH²=BH·CH(${R2(AH*AH)}) | ④ AB·AC=BC·AH(${R2(AB*AC)})`, [
        { text: `BH = ${BH} (AB²=${BH}×${BC})`, weight: 9 / 25, color: PCOL.cyan },
        { text: `CH = ${CH} (AC²=${CH}×${BC})`, weight: 16 / 25, color: PCOL.green }
      ]);
    }

    // =========================================================================
    // [탭 8 렌더링] 종이접기 & 최단거리 응용
    // =========================================================================
    function renderMode8Applied(rect, cx, cy) {
      const sub = state.subType[8];
      const s = state.scale * 1.02;

      if (sub === 'rectFold') {
        const u = 21 * s;
        const A = pt(cx - 5 * u, cy - 4 * u - 10 * s), B = pt(cx - 5 * u, cy + 4 * u - 10 * s);
        const C = pt(cx + 5 * u, cy + 4 * u - 10 * s), D = pt(cx + 5 * u, cy - 4 * u - 10 * s);
        const E = pt(B.x + 6 * u, B.y);
        const F = pt(C.x, C.y - 3 * u);

        ppoly([A, B, C, D], 'rgba(255,255,255,0.05)', 'rgba(148,163,184,0.45)', 2.0);
        ppoly([A, B, E], 'rgba(56, 189, 248, 0.28)', PCOL.cyan, 3.2, 0);
        ppoly([F, C, E], 'rgba(244, 114, 182, 0.32)', PCOL.pink, 3.2, 2);

        // [2.0 수정] 원본은 0%일 때 이미 접힌 모양(D=E)이라 '0%→접기'가 처음에 튀었습니다 → 0% = 접기 전(D), 100% = 접은 뒤(E). 장면은 접은 뒤(100%)로 시작(원본 첫 화면과 같음)
        const curD = lerp(D, E, state.fold);
        ppoly([A, curD, F], 'rgba(251, 191, 36, 0.30)', PCOL.gold, 3.4, 1);

        pline(A, F, PCOL.gold, 3.2, [5, 4]);
        pright(B, A, E, 12, PCOL.cyan);
        pright(C, F, E, 12, PCOL.pink);
        pright(E, A, F, 12, PCOL.gold);
        ptick(F, D, 1, PCOL.gold);
        ptick(F, E, 1, PCOL.gold);
        // [표시 보강] 접기: AE = AD (눈금 ||), 같은 각 ∠BAE = ∠CEF (●), ∠AEB = ∠EFC (×) — E 에서 ● + 90° + × = 180°
        ptick(A, D, 2, PCOL.gold); ptick(A, E, 2, PCOL.gold);
        pangle(A, B, E, PCOL.cyan, 28, 1, `●${angDeg(A, B, E)}`);
        pangle(E, C, F, PCOL.cyan, 26, 1, `●${angDeg(A, B, E)}`);
        pangle(E, B, A, PCOL.pink, 24, 2, `×${angDeg(E, B, A)}`);
        pangle(F, E, C, PCOL.pink, 24, 2, `×${angDeg(E, B, A)}`);

        pdot(A, 'A', PCOL.white, null, { x: -16, y: -8 });
        pdot(B, 'B(90°)', PCOL.cyan, null, { x: -22, y: 18 });
        pdot(C, 'C(90°)', PCOL.pink, null, { x: 8, y: 18 });
        pdot(D, 'D(접기 전)', PCOL.white, null, { x: 8, y: -8 });
        pdot(E, 'E(접힌 D)', PCOL.gold, null, { x: -20, y: 40 }); // [2.0] 아래 'EC = 4' 이름표와 겹치지 않게 한 줄 아래로
        pdot(F, 'F', PCOL.gold, null, { x: 10, y: 4 });

        ptag(cx, A.y - 12, 'AD = 10', PCOL.white);
        ptag(B.x - 28, (A.y + B.y) / 2, 'AB = 8', PCOL.cyan);
        ptag((A.x + E.x) / 2 + 12, (A.y + E.y) / 2 - 8, 'AE = AD = 10', PCOL.gold);
        ptag((B.x + E.x) / 2, B.y + 20, '① BE = 6', PCOL.cyan);
        ptag((E.x + C.x) / 2, C.y + 20, 'EC = 4', PCOL.pink);
        ptag(C.x + 38, (F.y + C.y) / 2, 'CF = 8-x(3)', PCOL.pink);
        ptag((E.x + F.x) / 2 - 20, (E.y + F.y) / 2 - 8, '② EF = x(5)', PCOL.gold);

        drawBottomTapeBanner(rect, '1단계 △ABE(6-8-10)에서 BE=6 ➔ EC=4  |  2단계 △FCE(3-4-5)에서 x²=(8-x)²+4² ➔ EF(x)=5!', [
          { text: '① BE = 6 (△ABE: 6-8-10)', weight: 0.6, color: PCOL.cyan },
          { text: '② EC = 4 (△FCE: 3-4-5)', weight: 0.4, color: PCOL.pink }
        ]);
        return;
      }

      if (sub === 'triFold') {
        const u = 21 * s;
        const C = pt(cx - 3 * u, cy + 3.2 * u - 10 * s);
        const B = pt(C.x + 8 * u, C.y);
        const A = pt(C.x, C.y - 6 * u);
        const D = pt(C.x + (7 / 4) * u, C.y);
        const E = mid(A, B);

        ppoly([A, C, B], 'rgba(255,255,255,0.06)', 'rgba(148,163,184,0.45)', 2.2);
        ppoly([A, C, D], 'rgba(244, 114, 182, 0.32)', PCOL.pink, 3.2, 1);
        ppoly([A, D, E], 'rgba(251, 191, 36, 0.30)', PCOL.gold, 3.0, 0);
        // [2.0 수정] 원본은 '꼭짓점 B를 A에 포개어 접기' 버튼과 슬라이더가 있었지만 그림이 움직이지 않았습니다 → 접는 선 DE를 축으로 B가 A에 포개지도록(0%: 접기 전 B, 100%: A에 포개짐)
        const Bt = pt(E.x + (B.x - E.x) * Math.cos(Math.PI * state.fold), E.y + (B.y - E.y) * Math.cos(Math.PI * state.fold));
        ppoly([Bt, D, E], 'rgba(56, 189, 248, 0.20)', PCOL.cyan, 2.4, 0);

        pright(C, A, D, 12, PCOL.pink);
        pright(E, D, B, 12, PCOL.gold);
        ptick(A, D, 1, PCOL.gold);
        ptick(Bt, D, 1, PCOL.gold);
        ptick(A, E, 2, PCOL.gold); ptick(E, B, 2, PCOL.gold); // [표시 보강] E 는 빗변의 중점: AE = EB

        pdot(A, 'A', PCOL.gold, null, { x: -16, y: -8 });
        pdot(B, 'B(접기 전)', PCOL.cyan, null, { x: 10, y: 16 });
        pdot(C, 'C(90°)', PCOL.pink, null, { x: -22, y: 18 });
        pdot(D, 'D', PCOL.gold, null, { x: -6, y: 22 });
        pdot(E, 'E(빗변 중점)', PCOL.gold, null, { x: 12, y: -8 });

        ptagAt(mid(A, C), 'AC = 6', PCOL.pink, 13, 'right', -10, 4); // [2.0] 'AD = x'와 겹치지 않게 변 바깥쪽에
        ptag((C.x + D.x) / 2 - 10, C.y + 38, 'CD = 8-x', PCOL.pink);
        ptag((D.x + B.x) / 2 + 10, B.y + 20, 'BD = x (25/4)', PCOL.cyan);
        ptagAt(mid(A, D), 'AD = x', PCOL.gold, 13, 'left', 12, 0);

        drawBottomTapeBanner(rect, '빗변 수직이등분 접기: AD = BD = x ➔ △ACD에서 x² = (8-x)² + 6² ➔ x = 25/4 (6.25)');
        return;
      }

      if (sub === 'reflection') {
        const yLine = cy + 8 * s;
        pline(pt(cx - 205 * s, yLine), pt(cx + 205 * s, yLine), PCOL.cyan, 2.8);
        const H1 = pt(cx - 115 * s, yLine), H2 = pt(cx + 115 * s, yLine);
        const A = pt(H1.x, yLine - 56 * s);
        const B = pt(H2.x, yLine - 112 * s);
        const B_ref = pt(H2.x, yLine + 112 * s);
        const K_pt = pt(H1.x, B_ref.y);

        const P = pt(lerp(H1, H2, state.reflectPx).x, yLine);

        ppoly([A, K_pt, B_ref], 'rgba(251, 191, 36, 0.16)', PCOL.gold, 2.2, 1, 'area aux');
        pright(K_pt, A, B_ref, 12, PCOL.gold);

        pline(A, H1, PCOL.white, 2.0, [4, 4]);
        pline(B, B_ref, PCOL.pink, 2.2, [5, 4]);
        pright(H2, B, H1, 11, PCOL.pink);
        pline(A, B_ref, 'rgba(52, 211, 153, 0.55)', 2.4, [5, 4], false, 2);

        pline(A, P, PCOL.gold, 4.0, [], true, 0);
        pline(P, B, PCOL.cyan, 3.6, [], false, 0);
        pline(P, B_ref, PCOL.gold, 4.0, [], true, 0);
        // [표시 보강] 대칭: BH = B'H (눈금 ||), PB = PB' (눈금 |), 점 A 에서 직선 l 에 내린 수선의 발 H₁ 의 직각
        pright(H1, A, H2, 11, PCOL.white);
        ptick(B, H2, 2, PCOL.pink); ptick(H2, B_ref, 2, PCOL.pink);
        ptick(P, B, 1, PCOL.white); ptick(P, B_ref, 1, PCOL.white);

        pdot(A, 'A(높이 3)', PCOL.white, null, { x: -20, y: -10 });
        pdot(B, 'B(높이 6)', PCOL.cyan, null, { x: 10, y: -8 });
        pdot(B_ref, "B'(대칭점, 깊이 6)", PCOL.gold, null, { x: 10, y: 14 });
        // [2.0] 점 P를 끌 수 있는 점(후광)으로: 직선 l 위에서 좌우로
        BOARD.handle('P', P, {
          color: 'amber', label: txt('P(좌우 드래그!)'), dx: -10, dy: -14, align: 'left',
          drag: (w) => { S.rp = clampN((w.x - H1.x) / (H2.x - H1.x), 0.05, 0.95); }
        });
        pdot(K_pt, 'K(90°)', PCOL.gold, null, { x: -25, y: 14 });

        const curDist = (Math.hypot(12 * state.reflectPx, 3) + Math.hypot(12 * (1 - state.reflectPx), 6)).toFixed(2);
        ptag((K_pt.x + B_ref.x) / 2, B_ref.y + 20, '가로 거리 = 12 cm', PCOL.gold, 13, 'aux');
        ptag(K_pt.x - 48, (A.y + K_pt.y) / 2, '세로 합 = 3+6 = 9', PCOL.gold, 13, 'aux');

        drawBottomTapeBanner(rect, `현재 AP + PB = ${curDist} cm  |  일직선 최솟값 AB' = √(12² + (3+6)²) = 15.00 cm!`, [
          { text: '가로 = 12 (12²=144)', weight: 144 / 225, color: PCOL.cyan },
          { text: '세로 합 = 3+6 = 9 (9²=81)', weight: 81 / 225, color: PCOL.gold }
        ]);
        return;
      }

      // boxNet & cylinderNet
      const isCyl = sub === 'cylinderNet';
      const u = (isCyl ? 17.5 : 16.5) * s;
      const w1 = (isCyl ? 6 : 5) * u;
      const w2 = isCyl ? 0 : 7 * u;
      const totalW = w1 + w2;
      const h = (isCyl ? 8 : 5) * u;
      const ox = cx - totalW / 2, oy = cy - h / 2 - 12 * s;

      const A = pt(ox, oy + h), B = pt(ox + totalW, oy + h), G = pt(ox + totalW, oy), D = pt(ox, oy);
      ppoly([D, A, B, G], 'rgba(56, 189, 248, 0.18)', PCOL.cyan, 2.8, 0, 'area aux');
      if (!isCyl) {
        pline(pt(ox + w1, oy), pt(ox + w1, oy + h), PCOL.white, 2.2, [5, 4]);
        // [2.0] 점 이름(A(출발)·C(90°))과 겹치지 않게 한 줄 아래로
        ptag(ox + w1 / 2, oy + h + 40, '앞면 가로 5', PCOL.cyan);
        ptag(ox + w1 + w2 / 2, oy + h + 40, '옆면 가로 7', PCOL.green);
      } else {
        ptag(ox + totalW / 2, oy + h + 40, '밑면 원주(2πr) = 6 cm', PCOL.cyan);
      }
      ppoly([A, B, G], 'rgba(251, 191, 36, 0.30)', PCOL.gold, 3.2, 2);
      pline(A, G, PCOL.gold, 4.4, [], true, 2);
      pright(B, A, G, 13, PCOL.gold);

      pdot(A, 'A(출발)', PCOL.gold, null, { x: -20, y: 18 });
      pdot(B, isCyl ? 'A₀(90°)' : 'C(90°)', PCOL.white, null, { x: 10, y: 18 });
      pdot(G, isCyl ? "A'(도착)" : 'G(도착)', PCOL.gold, null, { x: 10, y: -8 });
      ptag(ox + totalW + 38, oy + h / 2, isCyl ? '높이 = 8' : '높이 = 5', PCOL.green);
      ptag(cx - 15, oy + h / 2 - 10, isCyl ? '최단거리 = 10 cm' : '최단거리 AG = 13!', PCOL.gold, 14);

      drawBottomTapeBanner(
        rect,
        isCyl
          ? '원기둥 옆면 전개도: 가로(원주 6)² + 세로(높이 8)² = 100 ➔ 최단거리 = 10 cm'
          : '직육면체 겉면 전개도: 가로 합(5+7=12)² + 높이(5)² = 169 ➔ 최단거리 AG = 13!',
        [
          { text: isCyl ? '원주² (36)' : '가로 합 12² (144)', weight: isCyl ? 0.36 : 144 / 169, color: PCOL.cyan },
          { text: isCyl ? '높이² (64)' : '높이 5² (25)', weight: isCyl ? 0.64 : 25 / 169, color: PCOL.green }
        ]
      );
    }

  /* ======================================================================
     2.0 셸 연결 (새로 작성한 부분)
     ====================================================================== */
  const RENDER = { 1: renderMode1ThreeSquares, 2: renderMode2FourProofs, 3: renderMode3Triples, 4: renderMode4AngleJudge, 5: renderMode5SumOfSquares, 6: renderMode6LunesAndShapes, 7: renderMode7CowFormulas, 8: renderMode8Applied };
  const RECT = { width: 1000, height: 700 }; // 원본의 캔버스 크기 자리(하단 띠·미니 상자는 셸의 카드·띠로 옮겨 가므로 값은 쓰이지 않음)
  const TABS = ['세 정사각형 넓이 (a²+b²=c²)', '4대 증명 (유클리드·바스카라)', '피타고라스 수 & 배수 탐색', '예각·직각·둔각 판별기', '겹친 도형 제곱의 합 3총사', '정삼각형·반원·초승달 넓이', '빗변 수선 & 소(牛) 공식', '종이접기 & 최단거리 응용'];
  const SHORT = ['세 정사각형', '4대 증명', '피타고라스 수', '예각·둔각', '제곱의 합', '초승달', '빗변 수선', '종이접기'];
  const QUESTIONS = [
    '직각삼각형의 세 변 위에 정사각형을 그리면, 넓이 사이에 어떤 관계가 생길까?',
    '피타고라스 정리는 어떤 그림으로 눈에 보이게 증명할 수 있을까?',
    '자연수 세 개가 직각삼각형의 세 변이 되는 경우에는 어떤 것들이 있을까?',
    '삼각형이 예각·직각·둔각인지는 세 변의 길이만으로 어떻게 알 수 있을까?',
    '직각이 숨어 있는 도형에서 변 위의 제곱의 합은 어떻게 짝지어질까?',
    '정사각형이 아닌 정삼각형·반원을 그려도 S₁ + S₂ = S₃ 가 성립할까?',
    '빗변에 수선을 그으면 생기는 세 직각삼각형에서 어떤 곱셈식이 성립할까?',
    '접기와 대칭이동을 직각삼각형 하나로 바꾸면 길이는 어떻게 구할까?'
  ];

  // 이 장면에서 '변환(0→100%)'이 실제로 그림을 바꾸는 장면만 변환 조절을 보여 줍니다(원본 그리기 코드의 state.fold · t 사용처).
  const FOLD = new Set(['tiltedGrid', 'rotated', 'euclid', 'bhaskaraOut', 'obtuseRange', 'acuteRange', 'rightCross', 'hippoLune', 'isoLune', 'rectFold', 'triFold']);
  // 직각삼각형 족보(3:4:5 · 5:12:13 · 8:15:17 · 7:24:25) 선택이 그림·수치를 바꾸는 장면 / 배수 ×k 가 수치를 바꾸는 장면
  const FAM_SCENES = new Set(['std345', 'findLeg', 'rotated', 'hippoLune', 'semicircles']);
  const K_SCENES = new Set(['std345', 'findLeg', 'rotated', 'chainTri', 'fam345', 'fam51213', 'fam81517', 'fam72425', 'hippoLune', 'semicircles', 'allFour', 'leftWing', 'rightWing', 'centerPillar', 'cowArea']);
  // 원본 setMode/setSubType: 초승달 장면은 변환 100%(반원을 접은 상태)로 시작. [2.0 수정] 직사각형 접기도 접은 상태(100%)로 시작(아래 rectFold 설명 참조)
  const START_FOLD = new Set(['hippoLune', 'isoLune', 'rectFold']);
  const HINGE_ORDER = [65, 90, 115, 130];
  // 원본 관찰 렌즈 버튼 4개(원본 HTML 262–265행)
  const LENSES = [
    ['all', '🔍 전체 구조'],
    ['def', '📌 직각(∟)·빗변·꼭짓점'],
    ['area', '✨ 넓이·제곱합 블록'],
    ['aux', '🪡 보조선·닮음·모눈']
  ];
  // 원본 syncLensBar: 이 장면에서 효과가 없는 렌즈는 숨깁니다(LENS_OFF)
  const lensList = (id) => ['all'].concat(['def', 'area', 'aux'].filter((x) => !(LENS_OFF[x] || []).includes(id)));

  function sync(s, m, id) {
    state.mode = m;
    state.subType[m] = id;
    state.fold = s.fold;
    // 족보·배수는 그것을 쓰는 장면에서만 반영(다른 장면 값이 새어 들어오지 않게)
    state.famIdx = FAM_SCENES.has(id) ? Math.round(s.fam) : 0;
    state.multK = K_SCENES.has(id) ? Math.round(s.mult) : 1;
    state.hingeDeg = Math.round(s.hinge);
    state.customPOffset = { dx: s.px, dy: s.py };
    state.reflectPx = s.rp;
    state.activePartIdx = s.part == null ? -1 : s.part;
    state.conceptSwitch = lensList(id).includes(s.lens) ? s.lens : 'all';
    state.scale = 1;
  }

  /** 자동 맞춤을 재는 동안 겹쳐 그릴 상태들: 어느 상태(변환·각도·족보·배수)에서도 그림·글자가 잘리지 않는 범위를 구합니다. */
  function variants(id) {
    let out = [{}];
    if (FOLD.has(id)) out = [0, 0.5, 1].map((f) => ({ fold: f }));
    if (id === 'hinge') out = [45, 90, 140].map((d) => ({ hinge: d }));
    if (K_SCENES.has(id)) out = out.flatMap((o) => [1, 4].map((k) => ({ ...o, mult: k })));
    if (FAM_SCENES.has(id)) out = out.flatMap((o) => [0, 1, 2, 3].map((f) => ({ ...o, fam: f })));
    return out;
  }

  function paintScene(b, st, m, id, v) {
    BOARD = b;
    S = st;
    sync(st, m, id);
    sink.card = null;
    sink.tape = null;
    if (st.grid && !b._bbox) b.grid({ step: 38 });
    RENDER[m](RECT, 0, 0);
    if (v) {
      v.card = arrow(sink.card);
      v.tape = arrow(sink.tape);
    }
  }

  function sceneOf(m, it) {
    const id = it.id;
    const label = arrow(it.label);
    return {
      id, title: label, short: label, reviewTab: true, autoFit: true,
      question: QUESTIONS[m - 1],
      notesTitle: '시험장 오답 함정 & 3초 직관',
      enter: (s) => {
        // 원본 setMode / setSubType 의 초기화 규칙 그대로
        s.fold = START_FOLD.has(id) ? 1 : 0;
        // (원본은 탭 3 장면에 들어갈 때 족보 칩 값을 장면의 족보로 바꿔, 다른 탭의 족보까지 따라 바뀌었습니다 → 2.0에서는 탭 3의 족보는 장면이 정하고 칩 값은 건드리지 않음)
        if (!lensList(id).includes(s.lens)) s.lens = 'all';
      },
      controls: () => (FOLD.has(id) ? ['fold'] : id === 'hinge' ? ['hinge'] : []),
      presets: () => {
        const out = [];
        if (FAM_SCENES.has(id)) FAMILY_LIST.forEach((f) => out.push({ group: '직각삼각형 족보', label: f.label, apply: (st) => { st.fam = f.id; }, on: (st) => Math.round(st.fam) === f.id }));
        if (K_SCENES.has(id)) [1, 2, 3, 4].forEach((v) => out.push({ group: m === 3 ? '자연수 배수 ×k' : '배수 스케일 ×k', label: `×${v}배`, apply: (st) => { st.mult = v; }, on: (st) => Math.round(st.mult) === v }));
        if (id === 'hinge') HINGE_ORDER.forEach((d) => out.push({ group: '경첩 각도 ∠C', label: `${d}°`, set: { hinge: d }, ms: 500, on: (st) => Math.round(st.hinge) === d }));
        LENSES.filter(([k]) => lensList(id).includes(k)).forEach(([k, lb]) => out.push({ group: '관찰 렌즈', label: lb, apply: (st) => { st.lens = k; }, on: (st) => st.lens === k }));
        if (FOLD.has(id)) [0, 0.5, 1].forEach((v) => out.push({ group: '변환 단계', label: v === 0 ? '0% 시작' : v === 1 ? '100% 완성' : '50%', set: { fold: v }, ms: 700, on: (st) => Math.abs(st.fold - v) < 0.01 }));
        return out;
      },
      actions: () => {
        if (!(FOLD.has(id) || id === 'hinge')) return [];
        return [{
          id: 'act', play: true, primary: true, icon: 'wand',
          label: (st) => { sync(st, m, id); return arrow(getSpec().actionTxt); },
          run: (st, lab) => {
            if (id === 'hinge') { // 원본 toggleFoldAnim: 65° → 90° → 115° → 130° 순환
              const cur = Math.round(st.hinge);
              lab.tween({ hinge: HINGE_ORDER[(HINGE_ORDER.indexOf(cur) + 1) % HINGE_ORDER.length] }, 600);
              return;
            }
            lab.tween({ fold: st.fold > 0.5 ? 0 : 1 }, 1100);
          }
        }];
      },
      view: (s) => {
        sync(s, m, id);
        const spec = arrow(getSpec());
        return {
          guide: `<div style="font-weight:800;margin-bottom:6px">${APLab.esc(APLab.stripEmoji(spec.badge))}</div>${spec.hint}`,
          parts: spec.parts.map((p) => ({ id: p.id, name: p.name, desc: p.desc, value: p.val, color: p.ok === false ? 'red' : p.color, ok: p.ok })),
          summary: spec.totalRes,
          rule: spec.rule,
          formula: spec.formulaHTML,
          notes: spec.notes
        };
      },
      draw: (b, s, v) => {
        const paint = (st, vv) => paintScene(b, st, m, id, vv);
        // 자동 맞춤을 재는 중: 변환·각도·족보·배수 상태를 겹쳐 그려 어느 상태에서도 잘리지 않는 범위를 구합니다.
        const paintAll = () => variants(id).forEach((o) => paint({ ...s, ...o }));
        if (b._bbox) { paintAll(); return; }
        if (b.thumb) { // 모든 장면 미리보기: 장면 범위를 직접 재어 맞추고, '변환 완성' 상태로 그림
          const bb = b.measure(paintAll);
          if (bb) b.focus = b.fitBox(bb, { margin: 0.08, px: 5 });
          paint({ ...s, fold: FOLD.has(id) ? 1 : 0, part: null, lens: 'all' });
          return;
        }
        paint(s, v);
      }
    };
  }

  const groups = Object.keys(SUB_MENUS).map((k) => {
    const m = +k;
    return { id: 'm' + m, title: TABS[m - 1], short: SHORT[m - 1], scenes: SUB_MENUS[m].map((it) => sceneOf(m, it)) };
  });

  APLab.createLab({
    id: 'g8-pythagoras',
    title: '피타고라스 정리',
    courseName: '중2',
    unit: '피타고라스 정리 · 증명과 활용',
    courseColor: 'var(--m-sky)',
    home: '../index.html#g8',
    legacy: '../../labs/g8/피타고라스.html',
    board: { kind: 'figure', autoFit: true, minZoom: 0.4, maxZoom: 5 },
    state: { lens: 'all' },
    persist: ['lens'],
    params: {
      fold: { value: 0, min: 0, max: 1, step: 0.005, color: 'amber', label: '변환 진행 (0% → 100%)', hint: '등적변형 · 회전 · 이동 · 접기 같은 변환을 천천히 확인합니다', format: (v) => `${Math.round(v * 100)}%` },
      hinge: { value: 90, min: 45, max: 140, step: 1, color: 'rose', label: '경첩 각도 ∠C', format: (v) => `${Math.round(v)}°` },
      fam: { value: 0, min: 0, max: 3, step: 1, color: 'sky', label: '직각삼각형 족보' },
      mult: { value: 1, min: 1, max: 4, step: 1, color: 'green', label: '배수 ×k' },
      px: { value: -26, min: -700, max: 700, step: 1, color: 'amber', label: '점 P 가로' },
      py: { value: 18, min: -700, max: 700, step: 1, color: 'amber', label: '점 P 세로' },
      rp: { value: 0.33, min: 0.05, max: 0.95, step: 0.01, color: 'amber', label: '점 P 위치' }
    },
    groups
  });
});
</script>
