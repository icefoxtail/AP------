  /* ===== 셸 상태(s)에서 원본 state 모양 만들기 ===== */

    state = {
      mode: +s.sid, conceptSwitch: s.lens, activePartIdx: s.part == null ? null : s.part, hoverPartIdx: null,
      A1: { x: -2, y: 4 }, B1: { x: 4, y: 2 }, t1: s.t1,
      A2: { x: 3.2, y: 0.4 }, B2: { x: 0.8, y: 2.6 }, m2: s.m2, n2: s.n2, preset2: s.preset2,
      A3: { x: 1, y: 2 }, u3: { x: 3, y: 2 }, t3: s.t3,
      A4: { x: -3, y: -1 }, B4: { x: 3, y: 3 }, theta4: s.th4 * D2R,
      steps: { 1: s.step >= 1, 2: s.step >= 2, 3: s.step >= 3 },
      scale: BD ? BD.k : 42
    };
    return state;
  }

  /* ===== 원본의 그리기 환경 → 새 무대 엔진 연결 ===== */
  // 원본 코드가 쓰는 ctx 직접 그리기: 색은 테마 의미색으로 바꾸고(칠판·종이 모두 대응), 종이 테마에서는 번쩍임(그림자)을 끕니다.
  const ctx = new Proxy({}, {
    get(_, k) { const c = BD.ctx, v = c[k]; return typeof v === 'function' ? v.bind(c) : v; },
    set(_, k, v) {
      const c = BD.ctx;
      if ((k === 'fillStyle' || k === 'strokeStyle' || k === 'shadowColor') && typeof v === 'string') v = BD.color(v);
      else if (k === 'shadowBlur' && !BD.glowOn) v = 0;
      c[k] = v;
      return true;
    }
  });
  const toScreen = (x, y) => BD.toS(x, y);
  // [2.0 수정] 글자가 무대 가장자리나 위쪽 칩·아래쪽 도구에 가려지지 않게, 먼저 놓인 글자와 겹치지 않게 비켜 놓습니다.
  const clampX = (x0, w) => clamp(x0, 4, Math.max(4, BD.W - (BD.insets.right || 0) - 4 - w));
  const clampY = (y) => clamp(y, (BD.insets.top || 0) + 14, Math.max(30, BD.H - (BD.insets.bottom || 0) - 6));
  const LBOX = [];
  function placeLabel(x0, y, w) {
    const hit = (yy) => LBOX.some((q) => x0 < q.x1 && x0 + w > q.x0 && yy - 12 < q.y1 && yy + 4 > q.y0);
    let yy = clampY(y);
    for (const d of [0, -16, 16, -32, 32]) { const t = clampY(y + d); if (!hit(t)) { yy = t; break; } }
    LBOX.push({ x0, x1: x0 + w, y0: yy - 12, y1: yy + 4 });
    return yy;
  }
  // 원본 drawBottomTapeBanner(rect, 제목, 비율 줄자 칸들, 테두리색): 캔버스 위 상자 → 셸의 하단 띠(그림을 가리지 않음)
  function drawBottomTapeBanner(rect, titleText, tapeSegs) {
    TAPE = { title: titleText, segments: tapeSegs.map((sg) => ({ text: sg.label, weight: sg.weight, color: sg.color })) };
  }

  /* ===== 원본 그대로: 조각 하이라이트·관찰 렌즈 계산기, 분필 그리기 도우미 (글자 안으로 밀어 넣기만 추가) ===== */
    function getPartStyle(partIdx, lensGroup) {
      const focused = state.hoverPartIdx !== null ? state.hoverPartIdx : state.activePartIdx;
      let alpha = 1.0;
      let extraGlow = 0;

      // 관찰 렌즈 필터링
      if (state.conceptSwitch !== 'all' && lensGroup && state.conceptSwitch !== lensGroup) {
        alpha *= 0.22;
      }

      // 조각 해부 카드(partIdx) 발광 및 비선택 디밍
      if (focused !== null && partIdx !== undefined && partIdx !== null) {
        if (focused === partIdx) {
          extraGlow = 18;
          alpha = 1.0;
        } else {
          alpha *= 0.25;
        }
      }
      return { alpha, extraGlow };
    }
    function drawChalkLine(x1, y1, x2, y2, color = '#ffffff', width = 2, dashed = false, glow = false, partIdx = null, lensGroup = null) {
      const style = getPartStyle(partIdx, lensGroup);
      const p1 = toScreen(x1, y1);
      const p2 = toScreen(x2, y2);
      ctx.save();
      ctx.globalAlpha = style.alpha;
      ctx.beginPath();
      if (dashed) ctx.setLineDash([6, 6]);
      ctx.strokeStyle = color;
      ctx.lineWidth = style.extraGlow > 0 ? width + 1.2 : width;
      ctx.lineCap = 'round';
      if (glow || style.extraGlow > 0) {
        ctx.shadowColor = color;
        ctx.shadowBlur = Math.max(10, style.extraGlow);
      }
      ctx.moveTo(p1.x, p1.y);
      ctx.lineTo(p2.x, p2.y);
      ctx.stroke();
      ctx.restore();
    }
    function drawVectorArrow(x1, y1, x2, y2, color = '#fbbf24', width = 3, label = '', dashed = false, labelOffset = { x: 0, y: -12 }, partIdx = null, lensGroup = null) {
      const style = getPartStyle(partIdx, lensGroup);
      const p1 = toScreen(x1, y1);
      const p2 = toScreen(x2, y2);
      const dx = p2.x - p1.x;
      const dy = p2.y - p1.y;
      const len = Math.hypot(dx, dy);
      if (len < 2) return;

      const angle = Math.atan2(dy, dx);
      const effWidth = style.extraGlow > 0 ? width + 1.0 : width;
      const headLen = Math.min(14, Math.max(9, effWidth * 4.2));

      ctx.save();
      ctx.globalAlpha = style.alpha;
      ctx.strokeStyle = color;
      ctx.fillStyle = color;
      ctx.lineWidth = effWidth;
      ctx.lineCap = 'round';
      ctx.shadowColor = color;
      ctx.shadowBlur = style.extraGlow > 0 ? style.extraGlow : (dashed ? 4 : 10);

      if (dashed) ctx.setLineDash([6, 5]);
      ctx.beginPath();
      ctx.moveTo(p1.x, p1.y);
      ctx.lineTo(p2.x - Math.cos(angle) * (headLen * 0.5), p2.y - Math.sin(angle) * (headLen * 0.5));
      ctx.stroke();

      ctx.setLineDash([]);
      ctx.beginPath();
      ctx.moveTo(p2.x, p2.y);
      ctx.lineTo(p2.x - headLen * Math.cos(angle - Math.PI / 6.5), p2.y - headLen * Math.sin(angle - Math.PI / 6.5));
      ctx.lineTo(p2.x - headLen * 0.72 * Math.cos(angle), p2.y - headLen * 0.72 * Math.sin(angle));
      ctx.lineTo(p2.x - headLen * Math.cos(angle + Math.PI / 6.5), p2.y - headLen * Math.sin(angle + Math.PI / 6.5));
      ctx.closePath();
      ctx.fill();

      if (label) {
        const mx = (p1.x + p2.x) / 2 + labelOffset.x;
        const my = (p1.y + p2.y) / 2 + labelOffset.y;
        ctx.shadowColor = 'rgba(0,0,0,0.95)';
        ctx.shadowBlur = 6;
        ctx.font = 'bold 13px Pretendard, monospace';
        ctx.textAlign = 'center';
        const lw = ctx.measureText(label).width, lx = clampX(mx - lw / 2, lw); ctx.fillText(label, lx + lw / 2, placeLabel(lx, my, lw)); // [2.0 수정] 글자를 무대 안으로·겹치지 않게
      }
      ctx.restore();
    }
    function getSafeLabelOffset(ptMath, avoidMathPoints, defaultOffset = { x: 10, y: -14 }) {
      const sP = toScreen(ptMath.x, ptMath.y);
      let safeOffset = { x: defaultOffset.x, y: defaultOffset.y };
      for (const av of avoidMathPoints) {
        const sA = toScreen(av.x, av.y);
        const dist = Math.hypot(sP.x - sA.x, sP.y - sA.y);
        if (dist < 42) {
          safeOffset.y = defaultOffset.y < 0 ? 26 : -22;
          safeOffset.x = sP.x >= sA.x ? Math.abs(defaultOffset.x) + 6 : -Math.abs(defaultOffset.x) - 36;
          break;
        }
      }
      return safeOffset;
    }
    function drawChalkPoint(x, y, radius = 5.5, color = '#fbbf24', label = '', labelOffset = { x: 10, y: -10 }, partIdx = null, lensGroup = null) {
      const style = getPartStyle(partIdx, lensGroup);
      const pt = toScreen(x, y);
      ctx.save();
      ctx.globalAlpha = style.alpha;
      ctx.beginPath();
      ctx.arc(pt.x, pt.y, style.extraGlow > 0 ? radius + 1.5 : radius, 0, Math.PI * 2);
      ctx.fillStyle = color;
      ctx.shadowColor = color;
      ctx.shadowBlur = Math.max(12, style.extraGlow);
      ctx.fill();
      ctx.lineWidth = 2;
      ctx.strokeStyle = '#ffffff';
      ctx.stroke();

      if (label) {
        ctx.shadowBlur = 5;
        ctx.shadowColor = 'rgba(0,0,0,0.95)';
        ctx.font = 'bold 13px Pretendard, sans-serif';
        ctx.fillStyle = color;
        const lw = ctx.measureText(label).width, lx = clampX(pt.x + labelOffset.x, lw); ctx.fillText(label, lx, placeLabel(lx, pt.y + labelOffset.y, lw)); // [2.0 수정] 글자를 무대 안으로·겹치지 않게
      }
      ctx.restore();
    }
    function drawRightAngleMark(foot, dirAlongLine, dirToPoint, sizePx = 11, color = '#fbbf24', partIdx = null, lensGroup = 'aux') {
      const style = getPartStyle(partIdx, lensGroup);
      const pFoot = toScreen(foot.x, foot.y);
      const u = { x: dirAlongLine.x, y: -dirAlongLine.y };
      const v = { x: dirToPoint.x, y: -dirToPoint.y };

      const p1 = { x: pFoot.x + u.x * sizePx, y: pFoot.y + u.y * sizePx };
      const p2 = { x: p1.x + v.x * sizePx, y: p1.y + v.y * sizePx };
      const p3 = { x: pFoot.x + v.x * sizePx, y: pFoot.y + v.y * sizePx };

      ctx.save();
      ctx.globalAlpha = style.alpha;
      ctx.beginPath();
      ctx.strokeStyle = color;
      ctx.lineWidth = 1.8;
      ctx.moveTo(p1.x, p1.y);
      ctx.lineTo(p2.x, p2.y);
      ctx.lineTo(p3.x, p3.y);
      ctx.stroke();
      ctx.restore();
    }
    function drawCanvasFraction(px, py, numStr, denStr, color = '#fef08a', fontSize = 12) {
      ctx.save();
      ctx.font = `bold ${fontSize}px Pretendard, monospace`;
      ctx.fillStyle = color;
      ctx.strokeStyle = color;
      ctx.textAlign = 'center';
      ctx.shadowColor = 'rgba(0,0,0,0.9)';
      ctx.shadowBlur = 4;

      const w = Math.max(ctx.measureText(numStr).width, ctx.measureText(denStr).width) + 8;
      ctx.fillText(numStr, px, py - 4);
      ctx.lineWidth = 1.6;
      ctx.beginPath();
      ctx.moveTo(px - w / 2, py);
      ctx.lineTo(px + w / 2, py);
      ctx.stroke();
      ctx.fillText(denStr, px, py + fontSize + 1);
      ctx.restore();
      return w;
    }
  /* ===== 원본 그대로: 장면 그리기 (원본 renderMode1~4) ===== */
    function renderMode1(rect) {
      const A = state.A1;
      const B = state.B1;
      const t = state.t1;
      const m = 1 - t;
      const n = t;
      const P = { x: m * A.x + n * B.x, y: m * A.y + n * B.y };

      const dx = B.x - A.x;
      const dy = B.y - A.y;
      const isInternal = t >= -0.001 && t <= 1.001;

      // Step 3 (partIdx = 2, lens = 'locus'): 내분 구간(선분 AB 초록색) vs 외분 구간(연장선 분홍색 점선) 구분
      if (state.steps[3]) {
        drawChalkLine(A.x - dx * 1.8, A.y - dy * 1.8, A.x, A.y, '#f43f5e', 2.2, true, false, 2, 'locus');
        drawChalkLine(B.x, B.y, B.x + dx * 1.8, B.y + dy * 1.8, '#f43f5e', 2.2, true, false, 2, 'locus');
        drawChalkLine(A.x, A.y, B.x, B.y, '#34d399', 4.0, false, true, 2, 'locus');

        const wA = Math.abs(n);
        const wB = Math.abs(m);
        const sumW = wA + wB || 1;
        const statusStr = isInternal ? '선분 AB 위의 점 (0 ≤ t ≤ 1)' : '연장선 위의 점 (t < 0 또는 t > 1)';

        drawBottomTapeBanner(
          rect,
          `OP = (${m.toFixed(2)})OA + (${n.toFixed(2)})OB | 계수 합 = 1.00 | ${statusStr}`,
          [
            {
              weight: wA / sumW,
              label: `AP 비 = |t| = ${wA.toFixed(2)}`,
              bg: 'rgba(244, 114, 182, 0.28)',
              color: '#f472b6'
            },
            {
              weight: wB / sumW,
              label: `PB 비 = |1-t| = ${wB.toFixed(2)}`,
              bg: 'rgba(56, 189, 248, 0.28)',
              color: '#38bdf8'
            }
          ],
          isInternal ? 'rgba(52, 211, 153, 0.65)' : 'rgba(244, 63, 94, 0.65)'
        );
      } else if (state.steps[1]) {
        drawChalkLine(A.x - dx * 1.8, A.y - dy * 1.8, B.x + dx * 1.8, B.y + dy * 1.8, 'rgba(255,255,255,0.4)', 1.8, true, false, 0, 'base');
      }

      // Step 1 (partIdx = 0, lens = 'base'): 기준 벡터 OA, OB
      if (state.steps[1]) {
        drawVectorArrow(0, 0, A.x, A.y, '#38bdf8', 3.0, 'OA', false, { x: -24, y: 0 }, 0, 'base');
        drawVectorArrow(0, 0, B.x, B.y, '#f472b6', 3.0, 'OB', false, { x: 24, y: 14 }, 0, 'base');
      }

      // Step 2 (partIdx = 1, lens = 'aux'): 분해 벡터 (1-t)OA, t OB 및 최종 위치벡터 OP + 세로 분수 판서
      if (state.steps[2]) {
        const mA = { x: m * A.x, y: m * A.y };
        const nB = { x: n * B.x, y: n * B.y };
        drawChalkLine(mA.x, mA.y, P.x, P.y, 'rgba(244, 114, 182, 0.5)', 1.7, true, false, 1, 'aux');
        drawChalkLine(nB.x, nB.y, P.x, P.y, 'rgba(56, 189, 248, 0.5)', 1.7, true, false, 1, 'aux');

        const vecLabelOffset = Math.abs(t) < 0.15 ? { x: 28, y: 22 } : { x: 12, y: -14 };
        drawVectorArrow(0, 0, P.x, P.y, '#fbbf24', 3.6, `OP (t=${t.toFixed(2)})`, false, vecLabelOffset, 1, 'aux');

        // [BUG-09 수리] t = 0.6 근처일 때 캔버스 세로 분수(drawCanvasFraction)로 (2/5)OA + (3/5)OB 판서 표시
        if (Math.abs(t - 0.6) < 0.06) {
          const sP = toScreen(P.x, P.y);
          const fx = Math.min(sP.x + 18, BD.W - (BD.insets.right || 0) - 165); // [2.0 수정] 글자를 무대 안으로
          const fy = sP.y - 38;
          ctx.save();
          ctx.font = 'bold 12px Pretendard, monospace';
          ctx.fillStyle = '#fef08a';
          ctx.fillText('OP =', fx, fy + 4);
          drawCanvasFraction(fx + 44, fy, '2', '5', '#38bdf8', 11);
          ctx.fillStyle = '#38bdf8';
          ctx.fillText('OA +', fx + 68, fy + 4);
          drawCanvasFraction(fx + 110, fy, '3', '5', '#f472b6', 11);
          ctx.fillStyle = '#f472b6';
          ctx.fillText('OB', fx + 132, fy + 4);
          ctx.restore();
        }
      }

      const safeOffsetP = getSafeLabelOffset(P, [A, B], { x: 10, y: -14 });
      drawChalkPoint(0, 0, 5, '#f8fafc', '', { x: 0, y: 0 }, 0, 'base');
      drawChalkPoint(A.x, A.y, 7, '#38bdf8', `A(${A.x.toFixed(1)}, ${A.y.toFixed(1)})`, { x: -85, y: -10 }, 0, 'base');
      drawChalkPoint(B.x, B.y, 7, '#f472b6', `B(${B.x.toFixed(1)}, ${B.y.toFixed(1)})`, { x: 12, y: -10 }, 0, 'base');
      drawChalkPoint(P.x, P.y, 8, '#fbbf24', `P(${P.x.toFixed(2)}, ${P.y.toFixed(2)})`, safeOffsetP, 1, 'locus');
    }

    function renderMode2(rect) {
      const A = state.A2; // (3.2, 0.4) -> S = 4.00
      const B = state.B2; // (0.8, 2.6)
      const A2p = { x: 2 * A.x, y: 2 * A.y };
      const B2p = { x: 2 * B.x, y: 2 * B.y };
      const AB = { x: A.x + B.x, y: A.y + B.y };

      const m = state.m2;
      const n = state.n2;
      const P = { x: m * A.x + n * B.x, y: m * A.y + n * B.y };

      const sO = toScreen(0, 0);
      const sA = toScreen(A.x, A.y);
      const sB = toScreen(B.x, B.y);
      const sA2 = toScreen(A2p.x, A2p.y);
      const sB2 = toScreen(B2p.x, B2p.y);
      const sAB = toScreen(AB.x, AB.y);

      // Step 3 (partIdx = 2, lens = 'locus'): 선택된 프리셋에 따른 자취 영역 하이라이트
      if (state.steps[3]) {
        const style3 = getPartStyle(2, 'locus');
        ctx.save();
        ctx.globalAlpha = style3.alpha;
        if (state.preset2 === 'tri1') {
          ctx.beginPath();
          ctx.moveTo(sO.x, sO.y);
          ctx.lineTo(sA.x, sA.y);
          ctx.lineTo(sB.x, sB.y);
          ctx.closePath();
          ctx.fillStyle = 'rgba(52, 211, 153, 0.30)';
          ctx.fill();
        } else if (state.preset2 === 'trap') {
          ctx.beginPath();
          ctx.moveTo(sA.x, sA.y);
          ctx.lineTo(sA2.x, sA2.y);
          ctx.lineTo(sB2.x, sB2.y);
          ctx.lineTo(sB.x, sB.y);
          ctx.closePath();
          ctx.fillStyle = 'rgba(251, 191, 36, 0.28)';
          ctx.fill();
        } else if (state.preset2 === 'para') {
          ctx.beginPath();
          ctx.moveTo(sO.x, sO.y);
          ctx.lineTo(sA.x, sA.y);
          ctx.lineTo(sAB.x, sAB.y);
          ctx.lineTo(sB.x, sB.y);
          ctx.closePath();
          ctx.fillStyle = 'rgba(56, 189, 248, 0.26)';
          ctx.fill();
          drawChalkLine(A.x, A.y, AB.x, AB.y, '#38bdf8', 2.2, true, false, 2, 'locus');
          drawChalkLine(B.x, B.y, AB.x, AB.y, '#38bdf8', 2.2, true, false, 2, 'locus');
          drawChalkPoint(AB.x, AB.y, 5, '#38bdf8', 'A+B (m=1, n=1)', { x: 10, y: -10 }, 2, 'locus');
        }
        ctx.restore();
      }

      // Step 2 (partIdx = 1, lens = 'aux'): 2배 확장 벡터 2OA(A'), 2OB(B') 및 선분 m+n = 2 + 세로 분수 판서
      if (state.steps[2]) {
        drawChalkLine(0, 0, A2p.x, A2p.y, 'rgba(56, 189, 248, 0.5)', 2.0, true, false, 1, 'aux');
        drawChalkLine(0, 0, B2p.x, B2p.y, 'rgba(244, 114, 182, 0.5)', 2.0, true, false, 1, 'aux');
        drawChalkLine(A2p.x, A2p.y, B2p.x, B2p.y, '#fbbf24', state.preset2 === 'seg2' ? 4.8 : 2.6, false, true, 1, 'locus');

        drawChalkPoint(A2p.x, A2p.y, 5.5, '#38bdf8', "A'(2OA)", { x: 8, y: 18 }, 1, 'aux');
        drawChalkPoint(B2p.x, B2p.y, 5.5, '#f472b6', "B'(2OB)", { x: 12, y: -8 }, 1, 'aux');

        // [BUG-09 수리] 선분 A'B' 위쪽 근처에 세로 분수 (m/2)(2OA) + (n/2)(2OB) 변환식 표시
        const midA2B2 = toScreen((A2p.x + B2p.x) / 2, (A2p.y + B2p.y) / 2);
        midA2B2.x = Math.min(midA2B2.x, BD.W - (BD.insets.right || 0) - 165); // [2.0 수정] 글자를 무대 안으로
        ctx.save();
        ctx.globalAlpha = getPartStyle(1, 'aux').alpha;
        drawCanvasFraction(midA2B2.x + 28, midA2B2.y - 18, 'm', '2', '#fef08a', 11);
        ctx.font = 'bold 11px Pretendard, monospace';
        ctx.fillStyle = '#fef08a';
        ctx.fillText("(2OA) +", midA2B2.x + 56, midA2B2.y - 14);
        drawCanvasFraction(midA2B2.x + 104, midA2B2.y - 18, 'n', '2', '#fef08a', 11);
        ctx.fillText("(2OB)", midA2B2.x + 130, midA2B2.y - 14);
        ctx.restore();
      }

      // Step 1 (partIdx = 0, lens = 'base'): 기본 삼각형 ΔOAB 및 선분 AB (m+n = 1)
      if (state.steps[1]) {
        const style1 = getPartStyle(0, 'base');
        ctx.save();
        ctx.globalAlpha = style1.alpha;
        ctx.beginPath();
        ctx.moveTo(sO.x, sO.y);
        ctx.lineTo(sA.x, sA.y);
        ctx.lineTo(sB.x, sB.y);
        ctx.closePath();
        ctx.fillStyle = 'rgba(16, 185, 129, 0.12)';
        ctx.fill();
        ctx.restore();

        drawVectorArrow(0, 0, A.x, A.y, '#38bdf8', 3.2, 'OA', false, { x: 10, y: 18 }, 0, 'base');
        drawVectorArrow(0, 0, B.x, B.y, '#f472b6', 3.2, 'OB', false, { x: -24, y: 0 }, 0, 'base');
        drawChalkLine(A.x, A.y, B.x, B.y, '#34d399', state.preset2 === 'seg1' ? 4.8 : 2.8, false, true, 0, 'locus');
      }

      // 현재 동점 P(m OA + n OB) 및 평행사변형 분해선
      drawChalkLine(m * A.x, m * A.y, P.x, P.y, 'rgba(251, 191, 36, 0.45)', 1.5, true, false, 1, 'aux');

            { weight: wPB, label: `|BP|² = ${(lPB * lPB).toFixed(1)} (합=52.0)`, bg: 'rgba(244, 114, 182, 0.28)', color: '#f472b6' }
          ],

      drawChalkPoint(A.x, A.y, 7, '#38bdf8', `A(${A.x.toFixed(0)}, ${A.y.toFixed(0)})`, { x: -75, y: 20 }, 0, 'base');
      drawChalkPoint(B.x, B.y, 7, '#f472b6', `B(${B.x.toFixed(0)}, ${B.y.toFixed(0)})`, { x: 10, y: -10 }, 0, 'base');

  /* ===== 원본 그대로: 실시간 값 (원본 updateLiveMonitor — 화면에 쓰는 대신 값을 돌려줌) ===== */
    function monitor() {
      const out = { labels: [], vals: [], eq: '', sub: '' };
      if (state.mode === 1) {
        const A = state.A1;
        const B = state.B1;
        const t = state.t1;
        const m = 1 - t;
        const n = t;
        const P = { x: m * A.x + n * B.x, y: m * A.y + n * B.y };
        const isInternal = t >= -0.001 && t <= 1.001;

        out.eq = (`\\overrightarrow{OP} = (${m.toFixed(2)})\\overrightarrow{OA} + (${n.toFixed(2)})\\overrightarrow{OB}`);
        out.sub = (`m + n = 1.00`);

        out.labels[0] = '계수 m = 1-t / n = t';
        out.vals[0] = `m=${m.toFixed(2)} | n=${n.toFixed(2)}`;
        out.labels[1] = '계수 합 m + n';
        out.vals[1] = `1.000 (직선 AB 위에서 일정)`;
        out.labels[2] = '점 P(x, y) 좌표';
        out.vals[2] = `P(${P.x.toFixed(2)}, ${P.y.toFixed(2)})`;
        out.labels[3] = '점 P의 위치';
        out.vals[3] = isInternal
          ? `선분 AB 위의 점 (${Math.abs(n).toFixed(2)} : ${Math.abs(m).toFixed(2)})`
          : `연장선 위의 점 (${Math.abs(n).toFixed(2)} : ${Math.abs(m).toFixed(2)})`;

      } else if (state.mode === 2) {
        const m = state.m2;
        const n = state.n2;
        const sum = m + n;
        const P = { x: m * state.A2.x + n * state.B2.x, y: m * state.A2.y + n * state.B2.y };
        // 실제 외적 넓이 계산: 0.5 * |3.2*2.6 - 0.4*0.8| = 4.00
        const baseAreaS = 0.5 * Math.abs(state.A2.x * state.B2.y - state.A2.y * state.B2.x);

        out.eq = (`\\overrightarrow{OP} = ${m.toFixed(2)}\\overrightarrow{OA} + ${n.toFixed(2)}\\overrightarrow{OB}`);
        out.sub = (`m + n = ${sum.toFixed(2)}`);

        out.labels[0] = '계수 m, n (m, n ≥ 0)';
        out.vals[0] = `m=${m.toFixed(2)} | n=${n.toFixed(2)}`;
        out.labels[1] = '계수 합 k = m + n';
        out.vals[1] = `m + n = ${sum.toFixed(2)}`;
        out.labels[2] = '기준 ΔOAB 넓이 S';
        out.vals[2] = `S = ${baseAreaS.toFixed(2)}`;

        // [BUG-04 수리] 프리셋 5종에 따라 4번째 모니터 카드 동적 갱신
        if (state.preset2 === 'seg1') {
          out.labels[3] = '① m+n=1 자취 상태';
          out.vals[3] = `선분 AB 위 (m+n=${sum.toFixed(2)})`;
        } else if (state.preset2 === 'seg2') {
          out.labels[3] = '② m+n=2 자취 상태';
          out.vals[3] = `선분 A'B' 위 (m+n=${sum.toFixed(2)})`;
        } else if (state.preset2 === 'tri1') {
          out.labels[3] = '③ m+n≤1 영역 넓이 (S)';
          out.vals[3] = `S = ${baseAreaS.toFixed(2)} (삼각형 OAB)`;
        } else if (state.preset2 === 'para') {
          out.labels[3] = '⑤ 0≤m,n≤1 넓이 (2S)';
          out.vals[3] = `2S = ${(2 * baseAreaS).toFixed(2)} (평행사변형)`;
        } else {
          out.labels[3] = '④ 1≤m+n≤2 넓이 (3S)';
          out.vals[3] = `3S = ${(3 * baseAreaS).toFixed(2)} (사다리꼴)`;
        }

      } else if (state.mode === 3) {
        const A = state.A3;
        const u = state.u3;
        const t = state.t3;
        const P = { x: A.x + t * u.x, y: A.y + t * u.y };

        out.eq = (`\\overrightarrow{OP} = \\overrightarrow{OA} + t\\overrightarrow{u}`);
        out.sub = (`2x - 3y + 4 = 0`);

        out.labels[0] = '방향벡터 u (평행 ∥)';
        out.vals[0] = `u = (${u.x.toFixed(0)}, ${u.y.toFixed(0)})`;
        out.labels[1] = '법선벡터 n (수직 ⊥)';
        out.vals[1] = `n = (${u.y.toFixed(0)}, ${(-u.x).toFixed(0)})`;
        out.labels[2] = '점 P = A + t u';
        out.vals[2] = `P(${P.x.toFixed(2)}, ${P.y.toFixed(2)})`;
        out.labels[3] = '내적 AP · n';
        out.vals[3] = `AP · n = 0.000 (항상 수직)`;

      } else {
        const M = { x: 0, y: 1 };
        const r = Math.sqrt(13);
        const deg = ((state.theta4 * 180) / Math.PI + 360) % 360;

        out.eq = (`(\\overrightarrow{OP}-\\overrightarrow{OA})\\cdot(\\overrightarrow{OP}-\\overrightarrow{OB}) = 0`);
        out.sub = (`x^2 + (y-1)^2 = 13`);

        out.labels[0] = '지름 양 끝점 A, B';
        out.vals[0] = `A(-3,-1), B(3,3) | M(0,1)`;
        out.labels[1] = '원의 반지름 r = |AB|/2';
        out.vals[1] = `r = √13 ≈ ${r.toFixed(3)}`;
        out.labels[2] = '내적 AP · BP';
        out.vals[2] = `AP · BP = 0.000 (∠APB=90°)`;
        out.labels[3] = '원의 넓이 π r²';
        out.vals[3] = `13π ≈ ${(13 * Math.PI).toFixed(2)}`;

      }
      return out;
    }

  /* ===== 프리셋: 원본 setMode2Preset 값 그대로 ===== */
  const MODE2 = [
    { key: 'seg1', label: '① m+n=1 (선분 AB)', m: 0.5, n: 0.5 },
    { key: 'seg2', label: "② m+n=2 (선분 2A·2B)", m: 1.0, n: 1.0 },
    { key: 'tri1', label: '③ m+n≤1 (ΔOAB 넓이 S)', m: 0.35, n: 0.35 },
    { key: 'trap', label: '④ 1≤m+n≤2 (사다리꼴 3S)', m: 0.8, n: 0.7 },

  ];

  const presetChips = (m) => (m === 2 ? MODE2.map((p) => ({

  })) : []).concat(LENS.map(([k, label]) => ({ group: '강조해서 볼 요소', label, apply: (s) => { s.lens = k; }, on: (st) => st.lens === k })));
  const SNAP = { 1: { t1: 0.6 }, 2: { m2: 0.8, n2: 0.7 }, 3: { t3: 2.0 }, 4: { th4: 65 } };
  function snapPatch(m, s) { s.lens = 'all'; if (m === 2) s.preset2 = 'trap'; return { ...SNAP[m] }; } // 원본 snapToProblem: 값을 문제 조건으로 부드럽게 이동

  /* ===== 끌 수 있는 점 P (원본 handlePointerDown / handlePointerMove 규칙 그대로) ===== */
  function drawHandles(b, s, m) {
    const st = state;
    if (m === 1) {
      const A = st.A1, B = st.B1, P = { x: (1 - s.t1) * A.x + s.t1 * B.x, y: (1 - s.t1) * A.y + s.t1 * B.y };
      b.handle('P1', P, { color: 'amber', ariaLabel: '점 P', drag: (w) => {
        const vx = B.x - A.x, vy = B.y - A.y;
        s.t1 = clamp(((w.x - A.x) * vx + (w.y - A.y) * vy) / (vx * vx + vy * vy), -1, 2.4);
      } });
    } else if (m === 2) {
      const A = st.A2, B = st.B2, P = { x: s.m2 * A.x + s.n2 * B.x, y: s.m2 * A.y + s.n2 * B.y };
      b.handle('P2', P, { color: 'amber', ariaLabel: '점 P', drag: (w) => {
        const det = A.x * B.y - A.y * B.x;
        if (Math.abs(det) > 0.01) {
          let mVal = clamp((w.x * B.y - w.y * B.x) / det, 0, 2), nVal = clamp((A.x * w.y - A.y * w.x) / det, 0, 2);
          if (s.preset2 === 'seg1') { mVal = clamp(mVal, 0, 1); nVal = 1 - mVal; }
          else if (s.preset2 === 'seg2') { mVal = clamp(mVal, 0, 2); nVal = 2 - mVal; }
          s.m2 = mVal; s.n2 = nVal;
        }
      } });
    } else if (m === 3) {
      const A = st.A3, u = st.u3, P = { x: A.x + s.t3 * u.x, y: A.y + s.t3 * u.y };
      b.handle('P3', P, { color: 'amber', ariaLabel: '점 P', drag: (w) => {
        s.t3 = clamp(((w.x - A.x) * u.x + (w.y - A.y) * u.y) / (u.x * u.x + u.y * u.y), -1, 2.4); // 원본 BUG-02: 상한 2.4로 t=2.0 도달 보장
      } });
    } else {
      const r = Math.sqrt(13);
      b.handle('P4', { x: r * Math.cos(st.theta4), y: 1 + r * Math.sin(st.theta4) }, { color: 'amber', ariaLabel: '점 P', drag: (w) => { s.th4 = deg(Math.atan2(w.y - 1, w.x)); } });
    }
  }

  /* ===== 장면 글: 탭 이름·탐구 질문 (새로 쓴 부분) ===== */
  const TITLE = ['내분점과 일직선 조건 (1−t, t)', '계수 합(m+n=k)에 따른 자취와 넓이', '방향벡터와 법선벡터로 나타낸 직선', '원의 벡터방정식 (지름·접선)'];
  const SHORT = ['내분점·일직선', '계수 합 자취', '방향·법선벡터', '원의 벡터방정식'];
  const QUESTION = [
    'OP = (1−t)OA + t·OB에서 t가 바뀌면 점 P는 어디를 지날까? 선분 AB 위의 점이 되는 t의 범위는 어디일까?',
    'OP = m·OA + n·OB에서 m+n의 값이나 범위에 따라 점 P는 어떤 도형 위를 움직일까?',
    '같은 직선을 방향벡터와 법선벡터로 각각 어떻게 나타낼 수 있을까?',
    '(OP−OA)·(OP−OB) = 0이면 점 P는 어떤 도형 위를 움직일까?'
  ];
  const FOCUS = [
    { x: [-5.5, 9], y: [-2.6, 6.8] }, { x: [-2, 8.4], y: [-2, 7] }, { x: [-4.4, 9.4], y: [-3.4, 8] }, { x: [-5.6, 5.6], y: [-4.2, 6.2] }
  ];

  function sceneOf(m) {
    const d = examData[m];
    const hint = d.hint; // [2.0 수정] 프리셋 바가 더 이상 좌측 상단에 없음
    return {
      id: 'm' + m, title: TITLE[m - 1], short: SHORT[m - 1],
      question: QUESTION[m - 1], guide: hint,
      controls: m === 1 ? ['t1'] : m === 2 ? ['m2', 'n2'] : m === 3 ? ['t3'] : ['th4'],
      presets: () => presetChips(m),
      actions: () => [{
        id: 'play', play: true, icon: (s) => (s.playing ? 'pause' : 'play'), label: (s) => (s.playing ? '일시 정지' : '자동 이동'), on: (s) => s.playing,
        run: (s) => { s.playing = !s.playing; }
      }],
      steps: d.steps,
      enter: (s) => { s.sid = String(m); s.lens = 'all'; s.animDir = 1; if (m === 2) s.preset2 = 'trap'; Object.assign(s, SNAP[m]); },
      focus: FOCUS[m - 1],
      tick: (s, dt) => {
        if (!s.playing) return false;
        const f = dt * 60;
        if (m === 1) {
          s.t1 += 0.012 * s.animDir * f;
          if (s.t1 > 1.5) s.animDir = -1;
          if (s.t1 < -0.5) s.animDir = 1;
        } else if (m === 2) {
          const time = performance.now() * 0.0022;
          const u = (Math.sin(time) + 1) / 2, v = (Math.cos(1.3 * time) + 1) / 2;
          if (s.preset2 === 'seg1') { s.m2 = u; s.n2 = 1 - u; }
          else if (s.preset2 === 'seg2') { s.m2 = 2 * u; s.n2 = 2 * (1 - u); }
          else if (s.preset2 === 'tri1') { const k = 0.25 + 0.75 * v; s.m2 = k * u; s.n2 = k * (1 - u); }
          else if (s.preset2 === 'para') { s.m2 = (Math.sin(time) + 1) / 2; s.n2 = (Math.cos(1.5 * time) + 1) / 2; }
          else { const k = 1 + v; s.m2 = k * u; s.n2 = k * (1 - u); }
        } else if (m === 3) {
          s.t3 += 0.015 * s.animDir * f;
          if (s.t3 > 2.2) s.animDir = -1;
          if (s.t3 < -0.8) s.animDir = 1;
        } else s.th4 = mod360(s.th4 + 0.016 * f * R2D);
        return true;
      },
      view: (s) => {
        s.sid = String(m);
        use(s);
        if (s.part != null && s.step < s.part + 1) s.step = s.part + 1; // 원본: 조각을 고르면 그 단계가 자동으로 켜짐
        const o = monitor();
        return {
          guide: hint,
          chips: [{ k: '벡터방정식', tex: o.eq, color: 'amber' }, { k: '', tex: o.sub, color: 'sky' }],
          readouts: o.labels.map((label, i) => ({ label, value: o.vals[i], color: ['sky', 'amber', 'rose', 'green'][i], wide: String(o.vals[i]).length > 15 })),
          parts: d.steps.map((name, i) => ({ id: i, name, color: ['sky', 'amber', 'rose'][i] })),
          formula: '<div style="text-align:center">' + APLab.tex(o.eq, true) + '</div>'
        };
      },
      draw: (b, s, v) => {
        BD = b; s.sid = String(m); use(s);
        TAPE = null; LBOX.length = 0;
        if (s.grid) b.grid();
        b.axes();
        [null, renderMode1, renderMode2, renderMode3, renderMode4][m]({ width: b.W, height: b.H });
        drawHandles(b, s, m);
        v.tape = TAPE;
      },
      problem: {
        tag: d.tag, time: d.targetTime,
        text: (s) => { s.sid = String(m); use(s); return d.question(); },
        answer: (s) => { s.sid = String(m); use(s); return d.answerBadge(); },
        snap: (s) => snapPatch(m, s)
      },
      solution: {
        standardTitle: '교과서식 풀이', standardTag: '기본 풀이',
        quickTitle: '10초 컷 · 핵심 성질을 이용한 풀이', quickTag: '10초 컷',
        standard: (s) => { s.sid = String(m); use(s); return d.textbook(); },
        quick: (s) => { s.sid = String(m); use(s); return d.shortcut(); }
      }
    };
  }

  APLab.createLab({
    id: 'geom-vector-figure',
    title: '벡터로 나타낸 도형',
    courseName: '기하',
    unit: '벡터 · 벡터로 나타낸 도형',
    courseColor: 'var(--m-rose)',
    home: '../index.html#geom',
    legacy: '../../labs/기하와벡터/벡터로 나타낸 도형.html',
    board: { kind: 'cartesian', focus: FOCUS[0], minZoom: 0.3, maxZoom: 8 },
    params: {
      t1: { value: 0.6, min: -1, max: 2.4, step: 0.02, color: 'amber', label: '실수 t (선분 AB 위: 0~1 / 연장선 위: −1.0~2.4)', format: (v) => `t = ${v.toFixed(2)} (${v >= -0.001 && v <= 1.001 ? '선분 AB 위' : '연장선 위'})` },
      m2: { value: 0.8, min: 0, max: 2, step: 0.05, color: 'sky', label: 'OA 계수 m', format: (v, s) => `m=${v.toFixed(2)}, n=${s.n2.toFixed(2)} (합 m+n=${(v + s.n2).toFixed(2)})` },
      n2: { value: 0.7, min: 0, max: 2, step: 0.05, color: 'rose', label: 'OB 계수 n', format: (v, s) => `m=${s.m2.toFixed(2)}, n=${v.toFixed(2)} (합 m+n=${(s.m2 + v).toFixed(2)})` },
      t3: { value: 2, min: -1, max: 2.4, step: 0.02, color: 'amber', label: '실수 t (P = A + t·u, −1.0~2.4)', format: (v) => { const x = 1 + 3 * v, y = 2 + 2 * v; return `t = ${v.toFixed(2)} (P(${x.toFixed(1)}, ${y.toFixed(1)}))`; } },
      th4: { value: 65, min: 0, max: 360, step: 1, color: 'amber', label: '원 위의 점 P의 회전각 θ (어디에 있어도 ∠APB = 90°)', format: (v) => `${mod360(v).toFixed(1)}° (∠APB = 90.0° 고정)` }
    },
    state: { sid: '1', lens: 'all', preset2: 'trap', animDir: 1 },
    persist: ['lens', 'preset2'],
    scenes: [1, 2, 3, 4].map(sceneOf)
  });
});
</script>
