③ 따라서 점 ${tex('P')}의 자취는 <strong class="text-emerald-300">선분 ${tex('AB')}를 지름으로 하는 원</strong>이다.<br/>

          highlight: "원의 벡터방정식: ① |OP - OC| = r (중심 C, 반지름 r) ② (OP-OA)·(OP-OB) = 0 (AB가 지름인 원) ③ (OP-OA)·(OB-OA) = 0 (②의 원의 점 A에서의 접선)"
        })
      }
    };

  /* ===== 셸 상태(s)에서 원본 state 모양 만들기 ===== */
  function use(s) {
    state = {
      mode: +s.sid, conceptSwitch: s.lens, activePartIdx: s.part == null ? null : s.part, hoverPartIdx: null,
      A1: { x: -2, y: 4 }, B1: { x: 4, y: 2 }, t1: s.t1,
      A2: { x: 3.2, y: 0.4 }, B2: { x: 0.8, y: 2.6 }, m2: s.m2, n2: s.n2, preset2: s.preset2,
      A3: { x: 1, y: 2 }, u3: { x: 3, y: 2 }, t3: s.t3,
      A4: { x: -3, y: -1 }, B4: { x: 3, y: 3 }, theta4: s.th4 * D2R,
      steps: { 1: s.step >= 1, 2: s.step >= 2, 3: s.step >= 3 },
      scale: BD ? BD.k : 42
    };
    return state;
  }

  /* ===== 원본의 그리기 환경 → 새 무대 엔진 연결 ===== */
  // 원본 코드가 쓰는 ctx 직접 그리기: 색은 테마 의미색으로 바꾸고(칠판·종이 모두 대응), 종이 테마에서는 번쩍임(그림자)을 끕니다.
  const ctx = new Proxy({}, {
    get(_, k) { const c = BD.ctx, v = c[k]; return typeof v === 'function' ? v.bind(c) : v; },
    set(_, k, v) {
      const c = BD.ctx;
      if ((k === 'fillStyle' || k === 'strokeStyle' || k === 'shadowColor') && typeof v === 'string') v = BD.color(v);
      else if (k === 'shadowBlur' && !BD.glowOn) v = 0;
      c[k] = v;
      return true;
    }
  });
  const toScreen = (x, y) => BD.toS(x, y);
  // [2.0 수정] 글자가 무대 가장자리나 위쪽 칩·아래쪽 도구에 가려지지 않게, 먼저 놓인 글자와 겹치지 않게 비켜 놓습니다.
  const clampX = (x0, w) => clamp(x0, 4, Math.max(4, BD.W - (BD.insets.right || 0) - 4 - w));
  const clampY = (y) => clamp(y, (BD.insets.top || 0) + 14, Math.max(30, BD.H - (BD.insets.bottom || 0) - 6));
  const LBOX = [];
  function placeLabel(x0, y, w) {
    const hit = (yy) => LBOX.some((q) => x0 < q.x1 && x0 + w > q.x0 && yy - 12 < q.y1 && yy + 4 > q.y0);
    let yy = clampY(y);
    for (const d of [0, -16, 16, -32, 32]) { const t = clampY(y + d); if (!hit(t)) { yy = t; break; } }
    LBOX.push({ x0, x1: x0 + w, y0: yy - 12, y1: yy + 4 });
    return yy;
  }
  // 원본 drawBottomTapeBanner(rect, 제목, 비율 줄자 칸들, 테두리색): 캔버스 위 상자 → 셸의 하단 띠(그림을 가리지 않음)
  function drawBottomTapeBanner(rect, titleText, tapeSegs) {
    TAPE = { title: titleText, segments: tapeSegs.map((sg) => ({ text: sg.label, weight: sg.weight, color: sg.color })) };
  }

  /* ===== 원본 그대로: 조각 하이라이트·관찰 렌즈 계산기, 분필 그리기 도우미 (글자 안으로 밀어 넣기만 추가) ===== */
    function getPartStyle(partIdx, lensGroup) {
      const focused = state.hoverPartIdx !== null ? state.hoverPartIdx : state.activePartIdx;
      let alpha = 1.0;
      let extraGlow = 0;

      // 관찰 렌즈 필터링
      if (state.conceptSwitch !== 'all' && lensGroup && state.conceptSwitch !== lensGroup) {
        alpha *= 0.22;
      }

      // 조각 해부 카드(partIdx) 발광 및 비선택 디밍
      if (focused !== null && partIdx !== undefined && partIdx !== null) {
        if (focused === partIdx) {
          extraGlow = 18;
          alpha = 1.0;
        } else {
          alpha *= 0.25;
        }
      }
      return { alpha, extraGlow };
    }
    function drawChalkLine(x1, y1, x2, y2, color = '#ffffff', width = 2, dashed = false, glow = false, partIdx = null, lensGroup = null) {
      const style = getPartStyle(partIdx, lensGroup);
      const p1 = toScreen(x1, y1);
      const p2 = toScreen(x2, y2);
      ctx.save();
      ctx.globalAlpha = style.alpha;
      ctx.beginPath();
      if (dashed) ctx.setLineDash([6, 6]);
      ctx.strokeStyle = color;
      ctx.lineWidth = style.extraGlow > 0 ? width + 1.2 : width;
      ctx.lineCap = 'round';
      if (glow || style.extraGlow > 0) {
        ctx.shadowColor = color;
        ctx.shadowBlur = Math.max(10, style.extraGlow);
      }
      ctx.moveTo(p1.x, p1.y);
      ctx.lineTo(p2.x, p2.y);
      ctx.stroke();
      ctx.restore();
    }
    function drawVectorArrow(x1, y1, x2, y2, color = '#fbbf24', width = 3, label = '', dashed = false, labelOffset = { x: 0, y: -12 }, partIdx = null, lensGroup = null) {
      const style = getPartStyle(partIdx, lensGroup);
      const p1 = toScreen(x1, y1);
      const p2 = toScreen(x2, y2);
      const dx = p2.x - p1.x;
      const dy = p2.y - p1.y;
      const len = Math.hypot(dx, dy);
      if (len < 2) return;

      const angle = Math.atan2(dy, dx);
      const effWidth = style.extraGlow > 0 ? width + 1.0 : width;
      const headLen = Math.min(14, Math.max(9, effWidth * 4.2));

      ctx.save();
      ctx.globalAlpha = style.alpha;
      ctx.strokeStyle = color;
      ctx.fillStyle = color;
      ctx.lineWidth = effWidth;
      ctx.lineCap = 'round';
      ctx.shadowColor = color;
      ctx.shadowBlur = style.extraGlow > 0 ? style.extraGlow : (dashed ? 4 : 10);

      if (dashed) ctx.setLineDash([6, 5]);
      ctx.beginPath();
      ctx.moveTo(p1.x, p1.y);
      ctx.lineTo(p2.x - Math.cos(angle) * (headLen * 0.5), p2.y - Math.sin(angle) * (headLen * 0.5));
      ctx.stroke();

      ctx.setLineDash([]);
      ctx.beginPath();
      ctx.moveTo(p2.x, p2.y);
      ctx.lineTo(p2.x - headLen * Math.cos(angle - Math.PI / 6.5), p2.y - headLen * Math.sin(angle - Math.PI / 6.5));
      ctx.lineTo(p2.x - headLen * 0.72 * Math.cos(angle), p2.y - headLen * 0.72 * Math.sin(angle));
      ctx.lineTo(p2.x - headLen * Math.cos(angle + Math.PI / 6.5), p2.y - headLen * Math.sin(angle + Math.PI / 6.5));
      ctx.closePath();
      ctx.fill();

      if (label) {
        const mx = (p1.x + p2.x) / 2 + labelOffset.x;
        const my = (p1.y + p2.y) / 2 + labelOffset.y;
        ctx.shadowColor = 'rgba(0,0,0,0.95)';
        ctx.shadowBlur = 6;
        ctx.font = 'bold 13px Pretendard, monospace';
        ctx.textAlign = 'center';
        const lw = ctx.measureText(label).width, lx = clampX(mx - lw / 2, lw); ctx.fillText(label, lx + lw / 2, placeLabel(lx, my, lw)); // [2.0 수정] 글자를 무대 안으로·겹치지 않게
      }
      ctx.restore();
    }
    function getSafeLabelOffset(ptMath, avoidMathPoints, defaultOffset = { x: 10, y: -14 }) {
      const sP = toScreen(ptMath.x, ptMath.y);
      let safeOffset = { x: defaultOffset.x, y: defaultOffset.y };
      for (const av of avoidMathPoints) {
        const sA = toScreen(av.x, av.y);
        const dist = Math.hypot(sP.x - sA.x, sP.y - sA.y);
        if (dist < 42) {
          safeOffset.y = defaultOffset.y < 0 ? 26 : -22;
          safeOffset.x = sP.x >= sA.x ? Math.abs(defaultOffset.x) + 6 : -Math.abs(defaultOffset.x) - 36;
          break;
        }
      }
      return safeOffset;
    }
    function drawChalkPoint(x, y, radius = 5.5, color = '#fbbf24', label = '', labelOffset = { x: 10, y: -10 }, partIdx = null, lensGroup = null) {
      const style = getPartStyle(partIdx, lensGroup);
      const pt = toScreen(x, y);
      ctx.save();
      ctx.globalAlpha = style.alpha;
      ctx.beginPath();
      ctx.arc(pt.x, pt.y, style.extraGlow > 0 ? radius + 1.5 : radius, 0, Math.PI * 2);
      ctx.fillStyle = color;
      ctx.shadowColor = color;
      ctx.shadowBlur = Math.max(12, style.extraGlow);
      ctx.fill();
      ctx.lineWidth = 2;
      ctx.strokeStyle = '#ffffff';
      ctx.stroke();

      if (label) {
        ctx.shadowBlur = 5;
        ctx.shadowColor = 'rgba(0,0,0,0.95)';
        ctx.font = 'bold 13px Pretendard, sans-serif';
        ctx.fillStyle = color;
        const lw = ctx.measureText(label).width, lx = clampX(pt.x + labelOffset.x, lw); ctx.fillText(label, lx, placeLabel(lx, pt.y + labelOffset.y, lw)); // [2.0 수정] 글자를 무대 안으로·겹치지 않게
      }
      ctx.restore();
    }
    // [표시 보강] 평행 표시(화살촉 ›, 개수로 짝 구분)와 같은 길이 눈금: 선분 p–q의 가운데에 그립니다.
    function parallelMark(p, q, color = '#fde047', count = 1) {
      const a = toScreen(p.x, p.y), b = toScreen(q.x, q.y), L = Math.hypot(b.x - a.x, b.y - a.y) || 1;
      if (L < 36) return;
      const d = { x: (b.x - a.x) / L, y: (b.y - a.y) / L }, n = { x: -d.y, y: d.x }, t0 = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 }, c = BD.ctx;
      c.save(); c.strokeStyle = BD.color(color); c.lineWidth = 2; c.setLineDash([]);
      for (let i = 0; i < count; i++) {
        const o = (i - (count - 1) / 2) * 7, t = { x: t0.x + d.x * o, y: t0.y + d.y * o };
        c.beginPath(); c.moveTo(t.x - d.x * 4 + n.x * 5, t.y - d.y * 4 + n.y * 5); c.lineTo(t.x + d.x * 3, t.y + d.y * 3); c.lineTo(t.x - d.x * 4 - n.x * 5, t.y - d.y * 4 - n.y * 5); c.stroke();
      }
      c.restore();
    }
    function drawRightAngleMark(foot, dirAlongLine, dirToPoint, sizePx = 11, color = '#fbbf24', partIdx = null, lensGroup = 'aux') {
      const style = getPartStyle(partIdx, lensGroup);
      const pFoot = toScreen(foot.x, foot.y);
      const u = { x: dirAlongLine.x, y: -dirAlongLine.y };
      const v = { x: dirToPoint.x, y: -dirToPoint.y };

      const p1 = { x: pFoot.x + u.x * sizePx, y: pFoot.y + u.y * sizePx };
      const p2 = { x: p1.x + v.x * sizePx, y: p1.y + v.y * sizePx };
      const p3 = { x: pFoot.x + v.x * sizePx, y: pFoot.y + v.y * sizePx };

      ctx.save();
      ctx.globalAlpha = style.alpha;
      ctx.beginPath();
      ctx.strokeStyle = color;
      ctx.lineWidth = 1.8;
      ctx.moveTo(p1.x, p1.y);
      ctx.lineTo(p2.x, p2.y);
      ctx.lineTo(p3.x, p3.y);
      ctx.stroke();
      ctx.restore();
    }
    function drawCanvasFraction(px, py, numStr, denStr, color = '#fef08a', fontSize = 12) {
      if(lvfContext)return 0; // Lesson equations use the shared pinned math line.
      ctx.save();
      ctx.font = `bold ${fontSize}px Pretendard, monospace`;
      ctx.fillStyle = color;
      ctx.strokeStyle = color;
      ctx.textAlign = 'center';
      ctx.shadowColor = 'rgba(0,0,0,0.9)';
      ctx.shadowBlur = 4;

      const w = Math.max(ctx.measureText(numStr).width, ctx.measureText(denStr).width) + 8;
      ctx.fillText(numStr, px, py - 4);
      ctx.lineWidth = 1.6;
      ctx.beginPath();
      ctx.moveTo(px - w / 2, py);
      ctx.lineTo(px + w / 2, py);
      ctx.stroke();
      ctx.fillText(denStr, px, py + fontSize + 1);
      ctx.restore();
      return w;
    }
  /* ===== 원본 그대로: 장면 그리기 (원본 renderMode1~4) ===== */
    function renderMode1(rect) {
      const A = state.A1;
      const B = state.B1;
      const t = state.t1;
      const m = 1 - t;
      const n = t;
      const P = { x: m * A.x + n * B.x, y: m * A.y + n * B.y };

      const dx = B.x - A.x;
      const dy = B.y - A.y;
      const isInternal = t >= -1e-10 && t <= 1+1e-10;

      // Step 3 (partIdx = 2, lens = 'locus'): 내분 구간(선분 AB 초록색) vs 외분 구간(연장선 분홍색 점선) 구분
      if (state.steps[3]) {
        drawChalkLine(A.x - dx * 1.8, A.y - dy * 1.8, A.x, A.y, '#f43f5e', 2.2, true, false, 2, 'locus');
        drawChalkLine(B.x, B.y, B.x + dx * 1.8, B.y + dy * 1.8, '#f43f5e', 2.2, true, false, 2, 'locus');
        drawChalkLine(A.x, A.y, B.x, B.y, '#34d399', 4.0, false, true, 2, 'locus');

        const wA = Math.abs(n);
        const wB = Math.abs(m);
        const sumW = wA + wB || 1;
        const statusStr = isInternal ? '선분 AB 위의 점 (0 ≤ t ≤ 1)' : '연장선 위의 점 (t < 0 또는 t > 1)';

        drawBottomTapeBanner(
          rect,
          `OP = (${m.toFixed(2)})OA + (${n.toFixed(2)})OB | 계수 합 = 1.00 | ${statusStr}`,
          [
            {
              weight: wA / sumW,
              label: `AP 비 = |t| = ${wA.toFixed(2)}`,
              bg: 'rgba(244, 114, 182, 0.28)',
              color: '#f472b6'
            },
            {
              weight: wB / sumW,
              label: `PB 비 = |1-t| = ${wB.toFixed(2)}`,
              bg: 'rgba(56, 189, 248, 0.28)',
              color: '#38bdf8'
            }
          ],
          isInternal ? 'rgba(52, 211, 153, 0.65)' : 'rgba(244, 63, 94, 0.65)'
        );
      } else if (state.steps[1]) {
        drawChalkLine(A.x - dx * 1.8, A.y - dy * 1.8, B.x + dx * 1.8, B.y + dy * 1.8, 'rgba(255,255,255,0.4)', 1.8, true, false, 0, 'base');
      }

      // Step 1 (partIdx = 0, lens = 'base'): 기준 벡터 OA, OB
      if (state.steps[1]) {
        drawVectorArrow(0, 0, A.x, A.y, '#38bdf8', 3.0, 'OA', false, { x: -24, y: 0 }, 0, 'base');
        drawVectorArrow(0, 0, B.x, B.y, '#f472b6', 3.0, 'OB', false, { x: 24, y: 14 }, 0, 'base');
      }

      // Step 2 (partIdx = 1, lens = 'aux'): 분해 벡터 (1-t)OA, t OB 및 최종 위치벡터 OP + 세로 분수 판서
      if (state.steps[2]) {
        const mA = { x: m * A.x, y: m * A.y };
        const nB = { x: n * B.x, y: n * B.y };
        drawChalkLine(mA.x, mA.y, P.x, P.y, 'rgba(244, 114, 182, 0.5)', 1.7, true, false, 1, 'aux');
        drawChalkLine(nB.x, nB.y, P.x, P.y, 'rgba(56, 189, 248, 0.5)', 1.7, true, false, 1, 'aux');

        const vecLabelOffset = Math.abs(t) < 0.15 ? { x: 28, y: 22 } : { x: 12, y: -14 };
        drawVectorArrow(0, 0, P.x, P.y, '#fbbf24', 3.6, `OP (t=${t.toFixed(2)})`, false, vecLabelOffset, 1, 'aux');

        // [BUG-09 수리] t = 0.6 근처일 때 캔버스 세로 분수(drawCanvasFraction)로 (2/5)OA + (3/5)OB 판서 표시
        if (Math.abs(t - 0.6) < 1e-10) {
          const sP = toScreen(P.x, P.y);
          const fx = Math.min(sP.x + 18, BD.W - (BD.insets.right || 0) - 165); // [2.0 수정] 글자를 무대 안으로
          const fy = sP.y - 38;
          ctx.save();
          ctx.font = 'bold 12px Pretendard, monospace';
          ctx.fillStyle = '#fef08a';
          ctx.fillText('OP =', fx, fy + 4);
          drawCanvasFraction(fx + 44, fy, '2', '5', '#38bdf8', 11);
          ctx.fillStyle = '#38bdf8';
          ctx.fillText('OA +', fx + 68, fy + 4);
          drawCanvasFraction(fx + 110, fy, '3', '5', '#f472b6', 11);
          ctx.fillStyle = '#f472b6';
          ctx.fillText('OB', fx + 132, fy + 4);
          ctx.restore();
        }
      }

      const safeOffsetP = getSafeLabelOffset(P, [A, B], { x: 10, y: -14 });
      drawChalkPoint(0, 0, 5, '#f8fafc', '', { x: 0, y: 0 }, 0, 'base');
      drawChalkPoint(A.x, A.y, 7, '#38bdf8', `A(${A.x.toFixed(1)}, ${A.y.toFixed(1)})`, { x: -85, y: -10 }, 0, 'base');
      drawChalkPoint(B.x, B.y, 7, '#f472b6', `B(${B.x.toFixed(1)}, ${B.y.toFixed(1)})`, { x: 12, y: -10 }, 0, 'base');
      drawChalkPoint(P.x, P.y, 8, '#fbbf24', `P(${P.x.toFixed(2)}, ${P.y.toFixed(2)})`, safeOffsetP, 1, 'locus');
    }

    function renderMode2(rect) {
      const A = state.A2; // (3.2, 0.4) -> S = 4.00
      const B = state.B2; // (0.8, 2.6)
      const A2p = { x: 2 * A.x, y: 2 * A.y };
      const B2p = { x: 2 * B.x, y: 2 * B.y };
      const AB = { x: A.x + B.x, y: A.y + B.y };

      const m = state.m2;
      const n = state.n2;
      const P = { x: m * A.x + n * B.x, y: m * A.y + n * B.y };

      const sO = toScreen(0, 0);
      const sA = toScreen(A.x, A.y);
      const sB = toScreen(B.x, B.y);
      const sA2 = toScreen(A2p.x, A2p.y);
      const sB2 = toScreen(B2p.x, B2p.y);
      const sAB = toScreen(AB.x, AB.y);

      // Step 3 (partIdx = 2, lens = 'locus'): 선택된 프리셋에 따른 자취 영역 하이라이트
      if (state.steps[3]) {
        const style3 = getPartStyle(2, 'locus');
        ctx.save();
        ctx.globalAlpha = style3.alpha;
        if (state.preset2 === 'tri1') {
          ctx.beginPath();
          ctx.moveTo(sO.x, sO.y);
          ctx.lineTo(sA.x, sA.y);
          ctx.lineTo(sB.x, sB.y);
          ctx.closePath();
          ctx.fillStyle = 'rgba(52, 211, 153, 0.30)';
          ctx.fill();
        } else if (state.preset2 === 'trap') {
          ctx.beginPath();
          ctx.moveTo(sA.x, sA.y);
          ctx.lineTo(sA2.x, sA2.y);
          ctx.lineTo(sB2.x, sB2.y);
          ctx.lineTo(sB.x, sB.y);
          ctx.closePath();
          ctx.fillStyle = 'rgba(251, 191, 36, 0.28)';
          ctx.fill();
        } else if (state.preset2 === 'para') {
          ctx.beginPath();
          ctx.moveTo(sO.x, sO.y);
          ctx.lineTo(sA.x, sA.y);
          ctx.lineTo(sAB.x, sAB.y);
          ctx.lineTo(sB.x, sB.y);
          ctx.closePath();
          ctx.fillStyle = 'rgba(56, 189, 248, 0.26)';
          ctx.fill();
          drawChalkLine(A.x, A.y, AB.x, AB.y, '#38bdf8', 2.2, true, false, 2, 'locus');
          drawChalkLine(B.x, B.y, AB.x, AB.y, '#38bdf8', 2.2, true, false, 2, 'locus');
          drawChalkPoint(AB.x, AB.y, 5, '#38bdf8', 'A+B (m=1, n=1)', { x: 10, y: -10 }, 2, 'locus');
          // [표시 보강] 평행사변형 O–A–(A+B)–B 의 마주 보는 변: OA ∥ B(A+B) (›), OB ∥ A(A+B) (››)
          parallelMark({ x: 0, y: 0 }, A, '#38bdf8', 1); parallelMark(B, AB, '#38bdf8', 1);
          parallelMark({ x: 0, y: 0 }, B, '#f472b6', 2); parallelMark(A, AB, '#f472b6', 2);
        }
        ctx.restore();
      }

      // Step 2 (partIdx = 1, lens = 'aux'): 2배 확장 벡터 2OA(A'), 2OB(B') 및 선분 m+n = 2 + 세로 분수 판서
      if (state.steps[2] && (!lvfContext || !['para','tri1','seg1'].includes(state.preset2))) {
        drawChalkLine(0, 0, A2p.x, A2p.y, 'rgba(56, 189, 248, 0.5)', 2.0, true, false, 1, 'aux');
        drawChalkLine(0, 0, B2p.x, B2p.y, 'rgba(244, 114, 182, 0.5)', 2.0, true, false, 1, 'aux');
        drawChalkLine(A2p.x, A2p.y, B2p.x, B2p.y, '#fbbf24', state.preset2 === 'seg2' ? 4.8 : 2.6, false, true, 1, 'locus');
        // [표시 보강] 선분 AB ∥ A'B' (같은 평행 표시)
        parallelMark(A, B, '#fde047', 1);
        parallelMark(A2p, B2p, '#fde047', 1);

        drawChalkPoint(A2p.x, A2p.y, 5.5, '#38bdf8', "A'(2OA)", { x: 8, y: 18 }, 1, 'aux');
        drawChalkPoint(B2p.x, B2p.y, 5.5, '#f472b6', "B'(2OB)", { x: 12, y: -8 }, 1, 'aux');

        // [BUG-09 수리] 선분 A'B' 위쪽 근처에 세로 분수 (m/2)(2OA) + (n/2)(2OB) 변환식 표시
        const midA2B2 = toScreen((A2p.x + B2p.x) / 2, (A2p.y + B2p.y) / 2);
        midA2B2.x = Math.min(midA2B2.x, BD.W - (BD.insets.right || 0) - 165); // [2.0 수정] 글자를 무대 안으로
        ctx.save();
        ctx.globalAlpha = getPartStyle(1, 'aux').alpha;
        drawCanvasFraction(midA2B2.x + 28, midA2B2.y - 18, 'm', '2', '#fef08a', 11);
        ctx.font = 'bold 11px Pretendard, monospace';
        ctx.fillStyle = '#fef08a';
        ctx.fillText("(2OA) +", midA2B2.x + 56, midA2B2.y - 14);
        drawCanvasFraction(midA2B2.x + 104, midA2B2.y - 18, 'n', '2', '#fef08a', 11);
        ctx.fillText("(2OB)", midA2B2.x + 130, midA2B2.y - 14);
        ctx.restore();
      }

      // Step 1 (partIdx = 0, lens = 'base'): 기본 삼각형 ΔOAB 및 선분 AB (m+n = 1)
      if (state.steps[1]) {
        const style1 = getPartStyle(0, 'base');
        ctx.save();
        ctx.globalAlpha = style1.alpha;
        ctx.beginPath();
        ctx.moveTo(sO.x, sO.y);
        ctx.lineTo(sA.x, sA.y);
        ctx.lineTo(sB.x, sB.y);
        ctx.closePath();
        ctx.fillStyle = 'rgba(16, 185, 129, 0.12)';
        ctx.fill();
        ctx.restore();

        drawVectorArrow(0, 0, A.x, A.y, '#38bdf8', 3.2, 'OA', false, { x: 10, y: 18 }, 0, 'base');
        drawVectorArrow(0, 0, B.x, B.y, '#f472b6', 3.2, 'OB', false, { x: -24, y: 0 }, 0, 'base');
        drawChalkLine(A.x, A.y, B.x, B.y, '#34d399', state.preset2 === 'seg1' ? 4.8 : 2.8, false, true, 0, 'locus');
      }

      // 현재 동점 P(m OA + n OB) 및 평행사변형 분해선
      drawChalkLine(m * A.x, m * A.y, P.x, P.y, 'rgba(251, 191, 36, 0.45)', 1.5, true, false, 1, 'aux');
      drawChalkLine(n * B.x, n * B.y, P.x, P.y, 'rgba(251, 191, 36, 0.45)', 1.5, true, false, 1, 'aux');
      drawVectorArrow(0, 0, P.x, P.y, '#fbbf24', 3.2, `OP (m+n=${(m + n).toFixed(2)})`, false, { x: 25, y: -10 }, 2, 'locus');

      const safeOffsetP = getSafeLabelOffset(P, [A, B, A2p, B2p], { x: 12, y: -12 });
      drawChalkPoint(0, 0, 5, '#f8fafc', '', { x: 0, y: 0 }, 0, 'base');
      drawChalkPoint(A.x, A.y, 6.5, '#38bdf8', 'A(3.2, 0.4)', { x: 8, y: 20 }, 0, 'base');
      drawChalkPoint(B.x, B.y, 6.5, '#f472b6', 'B(0.8, 2.6)', { x: -72, y: -6 }, 0, 'base');
      drawChalkPoint(P.x, P.y, 8, '#fbbf24', `P(m=${m.toFixed(2)}, n=${n.toFixed(2)})`, safeOffsetP, 2, 'locus');

      // [BUG-04 수리] 프리셋 5종에 맞춰 하단 줄자 배너 동적 분기 렌더링
      if (state.steps[3]) {
        let bannerTitle = '';
        let tapeSegs = [];
        const sumMN = Math.max(0.01, m + n);

        if (state.preset2 === 'seg1') {
          bannerTitle = `① m + n = 1 (m,n≥0) 자취 ⇔ 선분 AB (내분점 집합, 현재 합=${(m + n).toFixed(2)})`;
          tapeSegs = [
            { weight: m / sumMN, label: `m = ${m.toFixed(2)}`, bg: 'rgba(56, 189, 248, 0.28)', color: '#38bdf8' },
            { weight: n / sumMN, label: `n = ${n.toFixed(2)}`, bg: 'rgba(244, 114, 182, 0.28)', color: '#f472b6' }
          ];
        } else if (state.preset2 === 'seg2') {
          bannerTitle = `② m + n = 2 (m,n≥0) 자취 ⇔ 2배 확장 평행선분 A'B' (현재 합=${(m + n).toFixed(2)})`;
          tapeSegs = [
            { weight: (m / 2) / (sumMN / 2), label: `m/2 = ${(m / 2).toFixed(2)}`, bg: 'rgba(56, 189, 248, 0.28)', color: '#38bdf8' },
            { weight: (n / 2) / (sumMN / 2), label: `n/2 = ${(n / 2).toFixed(2)}`, bg: 'rgba(244, 114, 182, 0.28)', color: '#f472b6' }
          ];
        } else if (state.preset2 === 'tri1') {
          bannerTitle = `③ m + n ≤ 1 (m,n≥0) 영역 넓이 = ΔOAB 넓이 S = 4.00`;
          tapeSegs = [
            { weight: 1.0, label: `ΔOAB 내부 영역 넓이 = 1² × S = 4.00 (현재 m+n=${(m + n).toFixed(2)})`, bg: 'rgba(52, 211, 153, 0.28)', color: '#34d399' }
          ];
        } else if (state.preset2 === 'para') {
          bannerTitle = `⑤ 0 ≤ m, n ≤ 1 평행사변형 넓이 = 2 × ΔOAB = 2S = 8.00`;
          tapeSegs = [
            { weight: 0.5, label: `ΔOAB (S = 4.00)`, bg: 'rgba(52, 211, 153, 0.25)', color: '#34d399' },
            { weight: 0.5, label: `대칭 삼각형 (+S = 4.00) ➡ 총 2S = 8.00`, bg: 'rgba(56, 189, 248, 0.28)', color: '#38bdf8' }
          ];
        } else {
          bannerTitle = `④ 1 ≤ m+n ≤ 2 사다리꼴 넓이 = (2² - 1²)S = 3S = 12.00`;
          tapeSegs = [
            { weight: 0.25, label: `제외 S=4`, bg: 'rgba(16, 185, 129, 0.18)', color: '#34d399' },
            { weight: 0.75, label: `사다리꼴 ABB'A' 넓이 = 3S = 12.00`, bg: 'rgba(251, 191, 36, 0.30)', color: '#fbbf24' }
          ];
        }

        drawBottomTapeBanner(rect, `선택 조건: ${bannerTitle} · 현재 P ${regionContains(state)?'조건 만족':'조건 밖'}`, tapeSegs);
      }
    }

    function renderMode3(rect) {
      const A = state.A3; // (1, 2)
      const u = state.u3; // (3, 2)
      const n = { x: u.y, y: -u.x }; // 법선벡터 (2, -3)
      const t = state.t3;
      const P = { x: A.x + t * u.x, y: A.y + t * u.y };

      const uLen = Math.hypot(u.x, u.y);
      const ux = u.x / uLen;
      const uy = u.y / uLen;
      const nx = n.x / uLen;
      const ny = n.y / uLen;

      // 직선 l 본체 렌더링
      const span = 16;
      drawChalkLine(A.x - ux * span, A.y - uy * span, A.x + ux * span, A.y + uy * span, '#e2e8f0', 2.6, false, false, 1, 'locus');

      // Step 1 (partIdx = 0, lens = 'base'): 기준점 A 및 방향벡터 u 표시
      if (state.steps[1]) {
        drawVectorArrow(0, 0, A.x, A.y, '#38bdf8', 2.8, 'OA', false, { x: -24, y: 8 }, 0, 'base');
        drawVectorArrow(
          0,
          0,
          u.x,
          u.y,
          '#34d399',
          2.8,
          `방향벡터 u(${u.x.toFixed(0)}, ${u.y.toFixed(0)})`,
          true,
          { x: 35, y: 18 },
          0,
          'base'
        );
      }

      // [표시 보강] 방향벡터 u ∥ 직선 l: 같은 평행 표시(u의 가운데, 직선 l 위 A에서 u만큼 떨어진 구간의 가운데)
      if (state.steps[1]) {
        parallelMark({ x: 0, y: 0 }, u, '#fde047', 1);
        parallelMark(A, { x: A.x + u.x, y: A.y + u.y }, '#fde047', 1);
      }

      // Step 2 (partIdx = 1, lens = 'locus'): AP = t u 매개변수 이동 화살표 및 OP
      if (state.steps[2]) {
        const opLabelOffset = Math.abs(t) < 0.15 ? { x: 42, y: 24 } : { x: 35, y: 16 };
        drawVectorArrow(0, 0, P.x, P.y, '#fbbf24', 3.2, 'OP = OA + t u', false, opLabelOffset, 1, 'locus');
        if (Math.abs(t) > 0.05) {
          drawVectorArrow(A.x, A.y, P.x, P.y, '#34d399', 3.6, `t u (t=${t.toFixed(2)})`, false, { x: -18, y: -16 }, 1, 'locus');
        }
      }

      // Step 3 (partIdx = 2, lens = 'aux'): 점 A에서의 수직 법선벡터 n = (2, -3) 및 직각 마크
      if (state.steps[3]) {
        drawVectorArrow(
          A.x,
          A.y,
          A.x + n.x,
          A.y + n.y,
          '#f472b6',
          3.4,
          `법선벡터 n(${n.x.toFixed(0)}, ${n.y.toFixed(0)})`,
          false,
          { x: 70, y: 26 },
          2,
          'aux'
        );
        drawRightAngleMark(A, { x: ux, y: uy }, { x: nx, y: ny }, 14, '#f472b6', 2, 'aux'); // [표시 보강] 직각 표시를 키움(작아서 안 보였음)

        const wBase = 1 / (1 + Math.abs(t));
        const wStep = 1 - wBase;
        drawBottomTapeBanner(
          rect,
          `직선 l: (x-1)/3 = (y-2)/2 ⇔ AP · n = 2(x-1) - 3(y-2) = 0`,
          [
            { weight: wBase, label: `점 A(1, 2)`, bg: 'rgba(56, 189, 248, 0.26)', color: '#38bdf8' },
            { weight: wStep, label: `+ t u (t=${t.toFixed(2)}) ➡ P(${P.x.toFixed(1)}, ${P.y.toFixed(1)})`, bg: 'rgba(52, 211, 153, 0.28)', color: '#34d399' }
          ],
          'rgba(52, 211, 153, 0.6)'
        );
      }

      const safeOffsetP = getSafeLabelOffset(P, [A], { x: 12, y: -14 });
      drawChalkPoint(0, 0, 5, '#f8fafc', '', { x: 0, y: 0 }, 0, 'base');
      drawChalkPoint(A.x, A.y, 6.5, '#38bdf8', `점 A(${A.x.toFixed(0)}, ${A.y.toFixed(0)})`, { x: -95, y: -10 }, 0, 'base');
      drawChalkPoint(P.x, P.y, 8, '#fbbf24', `점 P(${P.x.toFixed(1)}, ${P.y.toFixed(1)})`, safeOffsetP, 1, 'locus');
    }

    function renderMode4(rect) {
      const A = state.A4; // (-3, -1)
      const B = state.B4; // (3, 3)
      const M = { x: (A.x + B.x) / 2, y: (A.y + B.y) / 2 }; // 중심 (0, 1)
      const r = Math.hypot(B.x - A.x, B.y - A.y) / 2; // 반지름 √13 ≈ 3.6055

      const theta = state.theta4;
      const P = { x: M.x + r * Math.cos(theta), y: M.y + r * Math.sin(theta) };

      // Step 3 (partIdx = 2, lens = 'locus'): 선분 AB를 지름으로 하는 원 자취 렌더링
      if (state.steps[3]) {
        const style3 = getPartStyle(2, 'locus');
        const sM = toScreen(M.x, M.y);
        ctx.save();
        ctx.globalAlpha = style3.alpha;
        ctx.beginPath();
        ctx.arc(sM.x, sM.y, r * state.scale, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(52, 211, 153, 0.08)';
        ctx.fill();
        ctx.strokeStyle = '#34d399';
        ctx.lineWidth = style3.extraGlow > 0 ? 4.0 : 2.8;
        ctx.shadowColor = '#34d399';
        ctx.shadowBlur = Math.max(12, style3.extraGlow);
        ctx.stroke();
        ctx.restore();

      }
      if(state.steps[2]){
        drawChalkPoint(M.x,M.y,5,'#34d399',state.steps[3]?'중심 M(0,1), r=√13':'중점 M(0,1)',{x:10,y:18},1,'aux');
        drawChalkLine(M.x,M.y,P.x,P.y,'rgba(52, 211, 153, 0.6)',1.5,true,false,1,'aux');
        BD.ticks([M.x, M.y], [A.x, A.y], { count: 1, color: '#34d399' });
        BD.ticks([M.x, M.y], [B.x, B.y], { count: 1, color: '#34d399' });
        BD.ticks([M.x, M.y], [P.x, P.y], { count: 1, color: '#34d399' });
      }

      // Step 1 (partIdx = 0, lens = 'base'): 지름 양 끝점 A, B 및 선분 AB
      if (state.steps[1]) {
        drawChalkLine(A.x, A.y, B.x, B.y, '#fbbf24', 2.6, true, false, 0, 'base');
      }

      // Step 2 (partIdx = 1, lens = 'aux'): 직각을 이루는 두 현 벡터 AP, BP 및 90° 직각 기호
      const vPA = { x: A.x - P.x, y: A.y - P.y };
      const lPA = Math.hypot(vPA.x, vPA.y);
      const vPB = { x: B.x - P.x, y: B.y - P.y };
      const lPB = Math.hypot(vPB.x, vPB.y);

      if (state.steps[1]) {
        const labelAP = lPA > 1.2 ? 'AP = OP - OA' : '';
        const labelBP = lPB > 1.2 ? 'BP = OP - OB' : '';
        drawVectorArrow(A.x, A.y, P.x, P.y, '#38bdf8', 3.2, labelAP, false, { x: -35, y: -10 }, 1, 'aux');
        drawVectorArrow(B.x, B.y, P.x, P.y, '#f472b6', 3.2, labelBP, false, { x: 35, y: -10 }, 1, 'aux');

        if (state.steps[2]&&lPA > 0.25 && lPB > 0.25) {
          drawRightAngleMark(
            P,
            { x: vPA.x / lPA, y: vPA.y / lPA },
            { x: vPB.x / lPB, y: vPB.y / lPB },
            16, // [표시 보강] 직각 표시를 키움(점 P·이름표에 가려 안 보였음)
            '#fde047',
            1,
            'aux'
          );
        }
      }

      if (state.steps[3]) {
        const wPA = clamp((lPA * lPA) / 52,0,1);
        const wPB = 1 - wPA;
        drawBottomTapeBanner(
          rect,
          lPA>1e-9&&lPB>1e-9?'AP·BP = 0, ∠APB = 90° · |AP|²+|BP|²=|AB|²=52':'끝점에서도 AP·BP = 0입니다. 한 벡터가 0이므로 ∠APB는 정의되지 않습니다.',
          [
            { weight: wPA, label: `|AP|² = ${(lPA * lPA).toFixed(1)}`, bg: 'rgba(56, 189, 248, 0.28)', color: '#38bdf8' },
            { weight: wPB, label: `|BP|² = ${(lPB * lPB).toFixed(1)} (합=52.0)`, bg: 'rgba(244, 114, 182, 0.28)', color: '#f472b6' }
          ],
          'rgba(251, 191, 36, 0.6)'
        );
      }

      const defaultOff = { x: -55, y: P.y >= M.y ? -16 : 24 };
      const safeOffsetP = getSafeLabelOffset(P, [A, B], defaultOff);
      drawChalkPoint(0, 0, 4.5, '#f8fafc', '', { x: 0, y: 0 }, 0, 'base');
      drawChalkPoint(A.x, A.y, 7, '#38bdf8', `A(${A.x.toFixed(0)}, ${A.y.toFixed(0)})`, { x: -75, y: 20 }, 0, 'base');
      drawChalkPoint(B.x, B.y, 7, '#f472b6', `B(${B.x.toFixed(0)}, ${B.y.toFixed(0)})`, { x: 10, y: -10 }, 0, 'base');
      drawChalkPoint(P.x,P.y,8,'#fbbf24',state.steps[2]?(lPA>1e-9&&lPB>1e-9?'점 P (∠APB=90°)':'끝점 P (각 미정)'):'점 P',safeOffsetP,2,'locus');
    }
  /* ===== 원본 그대로: 실시간 값 (원본 updateLiveMonitor — 화면에 쓰는 대신 값을 돌려줌) ===== */
    function monitor() {
      const out = { labels: [], vals: [], eq: '', sub: '' };
      if (state.mode === 1) {
        const A = state.A1;
        const B = state.B1;
        const t = state.t1;
        const m = 1 - t;
        const n = t;
        const P = { x: m * A.x + n * B.x, y: m * A.y + n * B.y };
        const isInternal = t >= -1e-10 && t <= 1+1e-10;

        out.eq = (`\\overrightarrow{OP} = (${m.toFixed(2)})\\overrightarrow{OA} + (${n.toFixed(2)})\\overrightarrow{OB}`);
        out.sub = (`m + n = 1.00`);

        out.labels[0] = '계수 m = 1-t / n = t';
        out.vals[0] = `m=${m.toFixed(2)} | n=${n.toFixed(2)}`;
        out.labels[1] = '계수 합 m + n';
        out.vals[1] = `1.000 (직선 AB 위에서 일정)`;
        out.labels[2] = '점 P(x, y) 좌표';
        out.vals[2] = `P(${P.x.toFixed(2)}, ${P.y.toFixed(2)})`;
        out.labels[3] = '점 P의 위치';
        out.vals[3] = isInternal
          ? `선분 AB 위의 점 (${Math.abs(n).toFixed(2)} : ${Math.abs(m).toFixed(2)})`
          : `연장선 위의 점 (${Math.abs(n).toFixed(2)} : ${Math.abs(m).toFixed(2)})`;

      } else if (state.mode === 2) {
        const m = state.m2;
        const n = state.n2;
        const sum = m + n;
        const P = { x: m * state.A2.x + n * state.B2.x, y: m * state.A2.y + n * state.B2.y };
        // 실제 외적 넓이 계산: 0.5 * |3.2*2.6 - 0.4*0.8| = 4.00
        const baseAreaS = 0.5 * Math.abs(state.A2.x * state.B2.y - state.A2.y * state.B2.x);

        out.eq = (`\\overrightarrow{OP} = ${m.toFixed(2)}\\overrightarrow{OA} + ${n.toFixed(2)}\\overrightarrow{OB}`);
        out.sub = (`m + n = ${sum.toFixed(2)}`);

        out.labels[0] = '계수 m, n (m, n ≥ 0)';
        out.vals[0] = `m=${m.toFixed(2)} | n=${n.toFixed(2)}`;
        out.labels[1] = '계수 합 k = m + n';
        out.vals[1] = `m + n = ${sum.toFixed(2)}`;
        out.labels[2] = '기준 ΔOAB 넓이 S';
        out.vals[2] = `S = ${baseAreaS.toFixed(2)}`;

        // [BUG-04 수리] 프리셋 5종에 따라 4번째 모니터 카드 동적 갱신
        if (state.preset2 === 'seg1') {
          out.labels[3] = '① m+n=1 자취 상태';
          out.vals[3] = `${regionContains(state)?'선분 AB 위':'선택 조건 밖'} (m+n≈${sum.toFixed(2)})`;
        } else if (state.preset2 === 'seg2') {
          out.labels[3] = '② m+n=2 자취 상태';
          out.vals[3] = `${regionContains(state)?'선분 2A·2B 위':'선택 조건 밖'} (m+n≈${sum.toFixed(2)})`;
        } else if (state.preset2 === 'tri1') {
          out.labels[3] = '③ m+n≤1 영역 넓이 (S)';
          out.vals[3] = `S = ${baseAreaS.toFixed(2)} (삼각형 OAB)`;
        } else if (state.preset2 === 'para') {
          out.labels[3] = '⑤ 0≤m,n≤1 넓이 (2S)';
          out.vals[3] = `2S = ${(2 * baseAreaS).toFixed(2)} (평행사변형)`;
        } else {
          out.labels[3] = '④ 1≤m+n≤2 넓이 (3S)';
          out.vals[3] = `3S = ${(3 * baseAreaS).toFixed(2)} (사다리꼴)`;
        }

      } else if (state.mode === 3) {
        const A = state.A3;
        const u = state.u3;
        const t = state.t3;
        const P = { x: A.x + t * u.x, y: A.y + t * u.y };

        out.eq = (`\\overrightarrow{OP} = \\overrightarrow{OA} + t\\overrightarrow{u}`);
        out.sub = (`2x - 3y + 4 = 0`);

        out.labels[0] = '방향벡터 u (평행 ∥)';
        out.vals[0] = `u = (${u.x.toFixed(0)}, ${u.y.toFixed(0)})`;
        out.labels[1] = '법선벡터 n (수직 ⊥)';
        out.vals[1] = `n = (${u.y.toFixed(0)}, ${(-u.x).toFixed(0)})`;
        out.labels[2] = '점 P = A + t u';
        out.vals[2] = `P(${P.x.toFixed(2)}, ${P.y.toFixed(2)})`;

  /* ======================================================================

  const NQ = (() => {

    function fit(b, key, content) {

    sc.enter(initial);
    const first=sc.vary.cur(),question=sc.problem.text(initial).replace(/<div[^>]*>\s*<button[^>]*data-nq-new[\s\S]*$/,'');
    const current=sc.vary.cur;
    sc.vary.first=()=>first;
    sc.vary.cur=()=>lvfActive(lvfContext||window.lab?.s)?first:current();
    return [sc.id,{initial,first,question,inquiry:sc.question}];
  }));
  const lessonSource=window.APL_VF_SOURCE={
    scenes:lessonScenes,initial:id=>copy(info[id].initial),first:id=>copy(info[id].first),
    question:id=>info[id].question,inquiry:id=>info[id].inquiry,
    math:{regionContains,geom:CND.geom,firstConditions:CND.SETS,anglePairs:ANG.PAIRS,firstPool:OVF.POOL,generators:OVF.G,NQ},
    nativeKeys:id=>Object.keys(info[id].initial)
  };
  const vfMathKey=value=>String(value||'').normalize('NFKC').replace(/&#(?:39|x27);/g,"'")
    .replace(/^(?:점 |중점 |중심 |방향벡터 |법선벡터 )/,'').replace(/^([A-Za-z][0-9′']*)(?=\()/,'$1=')
    .replace(/\\(?:left|right|,|!|;|quad|qquad)/g,'')
    .replace(/\\(?:dfrac|tfrac|frac)\s*(?:\{([^{}]*)\}|([A-Za-z0-9]))\s*(?:\{([^{}]*)\}|([A-Za-z0-9]))/g,(_,a,b,c,d)=>(a??b)+'/'+(c??d))
    .replace(/\\sqrt\{([^{}]*)\}/g,'√$1').replace(/\\sqrt\s*(\w)/g,'√$1')
    .replace(/\\(?:text|mathrm|mathbf|overline|overrightarrow|vec)\{([^{}]*)\}/g,'$1')
    .replace(/\\(cos|sin|tan|min|max)/g,'$1')
    .replace(/\\theta/g,'θ').replace(/\\phi/g,'φ').replace(/\\pi/g,'π').replace(/\\circ/g,'°').replace(/\\angle/g,'∠').replace(/\\perp/g,'⊥').replace(/\\parallel/g,'∥')
    .replace(/\\leq?/g,'≤').replace(/\\geq?/g,'≥').replace(/\\lt/g,'<').replace(/\\gt/g,'>')
    .replace(/\\cdot|\\times/g,'×').replace(/[−–]/g,'-').replace(/[′’]/g,"'").replace(/≈/g,'=')
    .replace(/[\s{}$^_()]/g,'').replace(/-?\d+\.\d+/g,x=>String(Number(x)));
  function vfLabel(value,s){
    const str=String(value||''),key=vfMathKey(str),known=(s.lvfKnownMath||[]).map(vfMathKey);
    if(/^최소\s/.test(str))return s.lvfShowAnswer?str:'';
    if(key&&known.some(k=>k.includes(key)))return str;
    const pair=key.split('=');
    if(pair.length===2&&known.some(k=>{const parts=k.split('=');return parts.length>2&&parts.includes(pair[0])&&parts.includes(pair[1]);}))return str;
    if(/^(?:[A-Z][′'*₀₁₂]?|O[APB]|[xyunrmtθφ]|[dl][₁₂]|접선|최근접점|공통점)$/.test(str))return str;
    const name=str.match(/^(?:점 |중점 |중심 |방향벡터 |법선벡터 |끝점 )?([A-Za-z][′'*₀₁₂]*)(?=[\s(=:≈]|$)/);
    return name?name[1]:'';
  }
  const shownState=(s)=>{
    const data={...s,...(s.lessonEntry?s.lvfInitial:{})},shown={...data};
    for(const [key,value] of Object.entries(data))if(/^lvf[NS]_/.test(key))shown[key.slice(5)]=value;
    shown.step=s.lessonEntry?(s.lvfInitial?.step||0):Math.max(0,Math.min(s.step||0,3));
    shown.part=null;shown.playing=false;shown.dragging=false;
    if(s.lessonEntry){shown.lvfTrace=0;shown.lvfShowAnswer=false;}
    return shown;
  };
  const traceEnds=(id,s)=>{
    const I=info[id].first;
    if(id==='m1')return [NQ.P(...I.A),NQ.P(...I.B)];
    if(id==='m2')return [NQ.P(0,0),s.lvfExplore?NQ.P(3.2,.4):NQ.P(4,1)];
    if(id==='m3')return [NQ.P(...I.A),NQ.add(NQ.P(...I.A),NQ.P(...I.u))];
    if(id==='m4')return [NQ.P(...I.A),NQ.P(...I.B)];
    if(id==='cnd5')return s.lvfExplore?[NQ.P(s.cn_Cx,s.cn_Cy),NQ.P(s.cn_Cx+s.cn_r,s.cn_Cy)]:[NQ.P(0,0),I.B];
    const X=s.lvfExplore?NQ.P(1,1):I.X;
    const d=s.lvfExplore?(s.an_x1||s.an_y1?NQ.P(s.an_x1,s.an_y1):NQ.P(s.an_x2,s.an_y2)):I.d1;
    return [X,NQ.add(X,d)];
  };
  for(const sc of lessonScenes){
    const original={question:sc.question,reviewTop:sc.reviewTop,steps:sc.steps,view:sc.view,draw:sc.draw,tick:sc.tick};
    sc.question=(s,lab)=>lvfActive(s)?s.lvfQuestion||lessonSource.question(sc.id):typeof original.question==='function'?original.question(s,lab):original.question;
    sc.reviewTop=(s,lab)=>lvfActive(s)?'':typeof original.reviewTop==='function'?original.reviewTop(s,lab):original.reviewTop;
    sc.steps=(s,lab)=>lvfActive(s)?['조건 확인','전략과 보조선','계산','결론']:original.steps(s,lab);
    sc.view=(s,lab)=>lvfActive(s)?{}:original.view(s,lab);
    sc.tick=(s,dt,lab)=>lvfActive(s)?false:original.tick?.(s,dt,lab);
    sc.draw=(b,s,v,lab)=>{
      if(!lvfActive(s)){
        if(b._vfLessonView){
          if(b.focus===b._vfLessonView.appliedFocus)Object.assign(b,b._vfLessonView.before);
          b.__nq=b._vfLessonView.nqBefore;b.__ovk=b._vfLessonView.ovBefore;delete b._vfLessonView;
        }
        return original.draw(b,s,v,lab);
      }
      if(!b._vfLessonView)b._vfLessonView={before:{focus:b.focus,zoom:b.zoom,panX:b.panX,panY:b.panY},nqBefore:b.__nq,ovBefore:b.__ovk};
      const shown=shownState(s),shownLab=Object.create(lab);
      shownLab.s=shown;shownLab.tab=shown.lvfExplore?'explore':'review';
      const key=sc.id+'|'+!!shown.lvfExplore;
      if(b._vfLessonView.key!==key){b._vfLessonView.key=key;b._vfLessonView.nq='';b._vfLessonView.ov='';b.zoom=1;b.panX=b.panY=0;}
      b.__nq=b._vfLessonView.nq;b.__ovk=b._vfLessonView.ov;
      const text=b._text,axes=b.axes,fill=b.ctx.fillText;let isAxes=false;
      b.axes=function(...args){isAxes=true;try{return axes.apply(this,args);}finally{isAxes=false;}};
      b._text=function(x,y,label,options={},screen){return text.call(this,x,y,this._bbox||isAxes?label:vfLabel(label,shown),options,screen);};
      b.ctx.fillText=function(label,...args){return fill.call(this,b._bbox||isAxes?label:vfLabel(label,shown),...args);};
      const previous=lvfContext;lvfContext=shown;
      try{
        original.draw(b,shown,{},shownLab);
        if(sc.id==='m4'&&shown.lvfMode==='tangent'&&shown.step>=2&&!b._bbox){
          const A=NQ.P(...info.m4.first.A),B=NQ.P(...info.m4.first.B),u=NQ.sub(B,A),d=NQ.mul(NQ.P(-u.y,u.x),1/NQ.len(u));
          b.seg(NQ.add(A,NQ.mul(d,-2)),NQ.add(A,NQ.mul(d,4)),{color:'violet',width:2.7});
          b.right(A,B,NQ.add(A,d),{color:'violet',size:12});
          // 왼쪽으로 나가는 가지 대신 화면 안의 아래쪽 접선 옆에 이름을 둡니다.
          b.text(NQ.add(A,NQ.mul(d,-1.6)),'접선',{color:'violet',size:13,dx:12,align:'left'});
        }
      }finally{lvfContext=previous;b._text=text;b.axes=axes;b.ctx.fillText=fill;}
      b._vfLessonView.appliedFocus=b.focus;b._vfLessonView.nq=b.__nq;b._vfLessonView.ov=b.__ovk;
      if(!s.lessonEntry&&shown.lvfTrace>0&&!b._bbox){
        const [a,c]=traceEnds(sc.id,shown);b.point(NQ.lerp(a,c,shown.lvfTrace),{color:'violet',r:4.5});
      }
    };
  }
  labDefinition.lessons=window.APL_VF_LESSONS?window.APL_VF_LESSONS.install(lessonScenes,lessonSource):{};
  APLab.createLab(labDefinition);
});
</script>
