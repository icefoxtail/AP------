<script>
/* ==========================================================================
   확률과 통계 · 통계 실험실 (AP Math Lab 2.0 새 실험실)
   - 5개 묶음 · 7개 기본 장면: ① 이산확률변수 분포 막대(평균·분산·aX+b) ② 이항분포 → 정규곡선(정규 근사)
     ③ 정규분포(표준화 · 두 곡선의 대칭·교점 · 꺾은선 확률밀도함수) ④ 표본평균의 분포 시뮬레이션 ⑤ 신뢰구간
   - 모든 그래프는 "막대·곡선·구간 넓이"가 같은 가로·세로 눈금 위에 그려져 넓이 비교가 그대로 맞습니다
     (세로 단위가 확률·확률밀도라 board.aspect:'free'를 씁니다).
   - 문제는 평가원·교육청 기출 유형의 변형입니다(원문·그림은 복제하지 않고 숫자와 상황을 바꿈).
     「새 문제」는 정답이 정수·깔끔한 값인 변형만 고르며, 바로 앞 문제와 같은 것은 피합니다.
   - 문제 속 표준정규분포표는 P(0≤Z≤z) 소수 셋째 자리 표(0.191, 0.341, 0.433, 0.477, 0.494, 0.499)입니다.
   ========================================================================== */
/*PURE-START*/
/* ---------- 순수 수학·문제 생성기 (화면과 무관) ---------- */
const PS = (() => {
  const gcd = (a, b) => { a = Math.abs(a); b = Math.abs(b); while (b) { const t = a % b; a = b; b = t; } return a; };
  const F = (n, d = 1) => { if (d < 0) { n = -n; d = -d; } const g = gcd(n, d) || 1; return { n: n / g, d: d / g }; };
  const fadd = (a, b) => F(a.n * b.d + b.n * a.d, a.d * b.d);
  const fsub = (a, b) => F(a.n * b.d - b.n * a.d, a.d * b.d);
  const fmul = (a, b) => F(a.n * b.n, a.d * b.d);
  const fdiv = (a, b) => F(a.n * b.d, a.d * b.n);
  const fval = (a) => a.n / a.d;
  const ftex = (a) => (a.d === 1 ? String(a.n) : (a.n < 0 ? '-' : '') + '\\dfrac{' + Math.abs(a.n) + '}{' + a.d + '}');
  const SQ2PI = Math.sqrt(2 * Math.PI);
  const phi = (z) => Math.exp(-z * z / 2) / SQ2PI;
  function erfc(x) {
    const z = Math.abs(x), t = 1 / (1 + 0.5 * z);
    const r = t * Math.exp(-z * z - 1.26551223 + t * (1.00002368 + t * (0.37409196 + t * (0.09678418 + t * (-0.18628806 + t * (0.27886807 + t * (-1.13520398 + t * (1.48851587 + t * (-0.82215223 + t * 0.17087277)))))))));
    return x >= 0 ? r : 2 - r;
  }
  const Phi = (z) => 0.5 * erfc(-z / Math.SQRT2);
  // 문제에 주는 표준정규분포표(소수 셋째 자리): P(0 ≤ Z ≤ z)
  const ZT = { 0.5: 0.191, 1: 0.341, 1.5: 0.433, 2: 0.477, 2.5: 0.494, 3: 0.499 };
  const ZK = [0.5, 1, 1.5, 2, 2.5, 3];
  const T = (z) => z === 0 ? 0 : ZT[Math.abs(z)] * (z < 0 ? -1 : 1);
  const r3 = (v) => Math.round(v * 1000) / 1000;
  // 이항분포
  const LF = [0];
  for (let i = 1; i <= 400; i++) LF[i] = LF[i - 1] + Math.log(i);
  const binomPmf = (n, p, k) => {
    if (k < 0 || k > n) return 0;
    if (p <= 0) return k === 0 ? 1 : 0;
    if (p >= 1) return k === n ? 1 : 0;
    return Math.exp(LF[n] - LF[k] - LF[n - k] + k * Math.log(p) + (n - k) * Math.log(1 - p));
  };
  const C = (n, k) => { let r = 1; for (let i = 1; i <= k; i++) r = r * (n - k + i) / i; return Math.round(r); };
  // Local streams retain the original uniform/category and Box–Muller models.
  // A state snapshot now reproduces subsequent samples without touching Math.random.
  const nextSeed = seed => (Math.imul(seed >>> 0, 1664525) + 1013904223) >>> 0;
  const seeded = seed => { let state=seed>>>0; return () => ((state=nextSeed(state))+.5)/4294967296; };
  let random = Math.random;
  const withSeed = (seed, fn) => { const previous=random;random=seeded(seed);try{return fn();}finally{random=previous;} };
  const sampleUniform = (state,key) => { state[key]=nextSeed(state[key]);return (state[key]+.5)/4294967296; };
  const rint = (n) => Math.floor(random() * n);
  const pickOf = (arr, key, prevKey) => {
    if (arr.length < 2 || prevKey == null) return arr[rint(arr.length)];
    let x, i = 0;
    do { x = arr[rint(arr.length)]; i++; } while (key(x) === prevKey && i < 50);
    return x;
  };
  const dec = (v) => String(Math.round(v * 1e6) / 1e6);

  /* ===== K. 이산확률변수 (값 1~5, 마지막 막대 확률이 미지수 a) ===== */
  const KPOOL = { scale: [], aff: [] };
  for (const Tt of [10, 12, 15, 20]) {
    for (let w1 = 1; w1 < Tt; w1++) for (let w2 = 1; w1 + w2 < Tt; w2++) for (let w3 = 1; w1 + w2 + w3 < Tt; w3++) for (let w4 = 1; w1 + w2 + w3 + w4 < Tt; w4++) {
      const a = Tt - w1 - w2 - w3 - w4;
      const w = [w1, w2, w3, w4, a];
      if (Math.max(...w) > Tt * 0.45) continue;
      const S1 = w.reduce((s, x, i) => s + x * (i + 1), 0), S2 = w.reduce((s, x, i) => s + x * (i + 1) * (i + 1), 0);
      const num = Tt * S2 - S1 * S1; // V(X)·T²
      if (num % (a * a) === 0 && Tt / a <= 6 && num / (a * a) <= 150 && a !== w1 && a !== w2 && a !== w3 && a !== w4 && new Set(w).size >= 4) KPOOL.scale.push({ T: Tt, w, S1, S2, ans: num / (a * a) });
      for (const c of [2, 3, 4, -2, -3]) if ((c * c * num) % (Tt * Tt) === 0 && (c * c * num) / (Tt * Tt) <= 200 && new Set(w).size >= 4) KPOOL.aff.push({ T: Tt, w, S1, S2, c, ans: c * c * num / (Tt * Tt) });
    }
  }
  function genK(prev) {
    const kind = prev ? (prev.kind === 'scale' ? 'aff' : 'scale') : 'scale';
    const pool = KPOOL[kind];
    const it = pickOf(pool, (x) => x.T + ':' + x.w.join(',') + (x.c || ''), prev && prev.key);
    const v = { kind, ...it, key: it.T + ':' + it.w.join(',') + (it.c || '') };
    if (kind === 'aff') v.d = [-3, -2, 1, 2, 3, 5][rint(6)];
    v.a = v.w[4];
    return v;
  }

  /* ===== L. 이항분포의 정규 근사(두 단계 시행) ===== */
  const LPOOL = [];
  for (let t = 1; t <= 5; t++) for (let m1 = 1; m1 <= 4; m1++) for (let k1 = 0; k1 <= m1; k1++) for (let m2 = 1; m2 <= 4; m2++) for (let k2 = 0; k2 <= m2; k2++) {
    if (m1 === m2 && k1 === k2) continue;
    const D = 96, num = t * C(m1, k1) * Math.pow(2, 4 - m1) + (6 - t) * C(m2, k2) * Math.pow(2, 4 - m2);
    const g = gcd(num, D), pa = num / g, pb = D / g;
    if (pa === 0 || pa === pb || pb > 48 || pa / pb < 0.12 || pa / pb > 0.5) continue;
    for (const s of [12, 15, 18, 20, 24, 25, 30]) {
      const Nn = s * s * pb * pb, Nd = pa * (pb - pa);
      if (Nn % Nd) continue;
      const N = Nn / Nd, mu = N * pa / pb;
      if (N > 20000 || N < 400 || !Number.isInteger(mu)) continue;
      LPOOL.push({ t, m1, k1, m2, k2, pa, pb, N, mu, sig: s });
    }
  }
  function genL(prev) {
    const it = pickOf(LPOOL, (x) => [x.t, x.m1, x.k1, x.m2, x.k2, x.N].join(), prev && prev.key);
    const key = [it.t, it.m1, it.k1, it.m2, it.k2, it.N].join();
    const form = ['le', 'ge', 'btw'][rint(3)];
    const zs = ZK.filter((z) => z >= 1 && Number.isInteger(z * it.sig));
    const z1 = zs[rint(zs.length)], z2 = zs[rint(zs.length)];
    let val;
    if (form === 'le' || form === 'ge') val = 0.5 + T(z1); else val = T(z1) + T(z2);
    return { ...it, key, form, z1, z2, ans: Math.round(val * 1000) };
  }

  /* ===== M1. 정규분포 표준화 ===== */
  function genM1(prev) {
    const kind = prev && prev.kind === 'A' ? 'B' : 'A';
    for (let tries = 0; tries < 400; tries++) {
      const sig = [2, 3, 4, 5, 6, 8, 10][rint(7)], m = (kind === 'A' ? 20 : 10) + rint(60);
      const ok = (z) => Number.isInteger(z * sig);
      const zs = ZK.filter(ok);
      if (zs.length < 3) continue;
      const pk = (a) => a[rint(a.length)];
      if (kind === 'A') {
        // P(a ≤ X ≤ b) = Φ(z2)-Φ(z1) (부호 있는 z)
        const z1 = pk(zs) * (rint(2) ? 1 : -1), z2 = pk(zs) * (rint(2) ? 1 : -1);
        if (z1 >= z2 || (z1 === -z2 && false)) continue;
        const a = m + z1 * sig, b = m + z2 * sig, key = 'A' + [m, sig, z1, z2].join();
        if (prev && prev.key === key) continue;
        return { kind, m, sig, z1, z2, a, b, key, ans: Math.round((T(z2) - T(z1)) * 1000) };
      }
      // B: P(m ≤ X ≤ c1)=T(z1), P(X ≥ c2)=0.5+T(z2) → 구할 P(d1 ≤ X ≤ d2)
      const z1 = pk(zs), z2 = pk(zs), za = pk(zs), zb = pk(zs);
      if (z1 === z2 || za === zb) continue;
      const c1 = m + z1 * sig, c2 = m - z2 * sig, d1 = m - za * sig, d2 = m + zb * sig;
      const key = 'B' + [m, sig, z1, z2, za, zb].join();
      if (prev && prev.key === key) continue;
      return { kind, m, sig, z1, z2, za, zb, c1, c2, d1, d2, key, ans: Math.round((T(za) + T(zb)) * 1000) };
    }
    return { kind: 'A', m: 50, sig: 10, z1: -1, z2: 2, a: 40, b: 70, key: 'A-default', ans: 818 };
  }

  /* ===== M2. 두 정규곡선의 대칭·평행이동 ===== */
  function genM2(prev) {
    const kind = prev && prev.kind === 'T1' ? 'T2' : 'T1';
    for (let tries = 0; tries < 400; tries++) {
      if (kind === 'T1') {
        const z = [1, 1.5, 2, 2.5][rint(4)], sig = [2, 4, 5, 6, 8][rint(5)], d = z * sig;
        if (!Number.isInteger(d) || d % 2 !== 0 || d < 4) continue;
        const m1 = 14 + rint(40), key = 'T1' + [m1, sig, z].join();
        if (prev && prev.key === key) continue;
        return { kind, m1, sig, z, d, S: 2 * m1, a: m1 - d / 2, b: m1, key, ans: m1 + sig, T: T(z) };
      }
      const z0 = [0.5, 1, 1.5][rint(3)], sig = [2, 4, 6][rint(3)];
      if (!Number.isInteger(2 * z0 * sig)) continue;
      const m1 = 4 + rint(20), m2 = m1 + 2 * z0 * sig, key = 'T2' + [m1, m2, sig].join();
      if (prev && prev.key === key) continue;
      const a = (m1 + m2) / 2;
      return { kind, m1, m2, sig, z0, a, key, ans: Math.round((T(2 * z0) - T(z0)) * 1000) };
    }
    return { kind: 'T1', m1: 20, sig: 5, z: 2, d: 10, S: 40, a: 15, b: 20, key: 'T1-default', ans: 25, T: 0.477 };
  }

  /* ===== M3. 꺾은선 확률밀도함수 ===== */
  // f: (0,0)→(x1,h)→(x2,h)→(L,0), h = 2/(L+x2-x1). 정적분(분수)
  function pdfInfo(L, x1, x2) {
    const h = F(2, L + x2 - x1);
    // 구간 [lo,hi]에서 f 의 적분(분수). 조각: 올라가는 선분, 평평, 내려가는 선분
    const seg = (lo, hi) => {
      // [lo,hi] ∩ [0,x1]: f = h x / x1
      let s = F(0);
      const up0 = Math.max(lo, 0), up1 = Math.min(hi, x1);
      if (up1 > up0) s = fadd(s, fmul(fdiv(h, F(x1)), F(up1 * up1 - up0 * up0, 2)));
      const fl0 = Math.max(lo, x1), fl1 = Math.min(hi, x2);
      if (fl1 > fl0) s = fadd(s, fmul(h, F(fl1 - fl0)));
      const dn0 = Math.max(lo, x2), dn1 = Math.min(hi, L);
      if (dn1 > dn0) {
        // ∫ h (L-x)/(L-x2) dx = h/(L-x2) [ (L-x)^2 / 2 ] 거꾸로
        s = fadd(s, fmul(fdiv(h, F(L - x2)), F((L - dn0) * (L - dn0) - (L - dn1) * (L - dn1), 2)));
      }
      return s;
    };
    return { h, k: F(2, L), seg };
  }
  function genM3(prev) {
    for (let tries = 0; tries < 800; tries++) {
      const L = [6, 8, 10][rint(3)], x1 = 1 + rint(L - 3), x2 = x1 + 1 + rint(L - x1 - 1);
      if (x2 >= L || x2 <= x1) continue;
      const u = rint(L - 1), v = u + 1 + rint(L - u - 1 || 1);
      if (v > L || v <= u) continue;
      const info = pdfInfo(L, x1, x2);
      if (fval(info.seg(0, L)) < 0.999999 || fval(info.seg(0, L)) > 1.000001) continue; // 넓이 1 확인
      const pk = fsub(fmul(info.k, F(v - u)), info.seg(u, v)); // P(u≤Y≤v) = k(v-u) - ∫f
      const pv = fval(pk);
      if (pv <= 0.05 || pv >= 0.95 || pk.d > 120 || pk.d === 1) continue;
      const key = [L, x1, x2, u, v].join();
      if (prev && prev.key === key) continue;
      return { L, x1, x2, u, v, h: info.h, k: info.k, pk, p: pk.d, q: pk.n, key, ans: pk.d + pk.n };
    }
    // 2022학년도 수능 29번 유형 그대로
    const info = pdfInfo(6, 3, 5), pk = fsub(fmul(info.k, F(3)), info.seg(2, 5));
    return { L: 6, x1: 3, x2: 5, u: 2, v: 5, h: info.h, k: info.k, pk, p: pk.d, q: pk.n, key: 'default', ans: pk.d + pk.n };
  }

  /* ===== O. 표본평균 ===== */
  const OPOOL1 = [];
  for (const d of [1, 2, 3]) for (const n of [2, 3, 4, 5, 6, 8, 9, 10, 12]) for (const a of [2, 3, 4, 5, 6]) {
    const tv = a * a * 2 * d * d;
    if (tv % n === 0) OPOOL1.push({ d, n, a, target: tv / n });
  }
  function genO(prev) {
    const kind = prev && prev.kind === 'O1' ? 'O2' : 'O1';
    for (let tries = 0; tries < 400; tries++) {
      if (kind === 'O1') {
        const it = pickOf(OPOOL1, (x) => [x.d, x.n, x.a].join(), prev && prev.key);
        const s = [1, 2, 3, 4][rint(4)], b = [2, 3, 4, 5, 6, 7][rint(6)];
        const cards = [0, 1, 2, 3, 4].map((i) => s + i * it.d);
        return { kind, ...it, s, b, cards, mean: s + 2 * it.d, var: 2 * it.d * it.d, key: [it.d, it.n, it.a].join(), ans: it.a };
      }
      const n = [4, 9, 16, 25, 36][rint(5)], sig = [2, 3, 4, 5, 6, 8, 10, 12, 15][rint(9)], m = 20 + rint(60);
      const r = sig / Math.sqrt(n);
      const zs = ZK.filter((z) => Math.abs(z * r - Math.round(z * r)) < 1e-9);
      if (zs.length < 2) continue;
      const z1 = zs[rint(zs.length)], z2 = zs[rint(zs.length)];
      const form = ['ge', 'le', 'btw'][rint(3)];
      const key = 'O2' + [m, sig, n, z1, z2, form].join();
      if (prev && prev.key === key) continue;
      const val = form === 'btw' ? T(z1) + T(z2) : 0.5 + T(z1);
      return { kind, n, sig, m, r, z1, z2, form, key, ans: Math.round(val * 1000) };
    }
    return { kind: 'O1', d: 2, n: 3, a: 3, target: 24, s: 1, b: 2, cards: [1, 3, 5, 7, 9], mean: 5, var: 8, key: 'default', ans: 3 };
  }

  /* ===== P. 신뢰구간 ===== */
  const ZC = { 90: 1.645, 95: 1.96, 99: 2.58 };
  function genP(prev) {
    const kind = prev && prev.kind === 'P1' ? 'P2' : 'P1';
    for (let tries = 0; tries < 600; tries++) {
      const conf = [95, 99][rint(2)], z = ZC[conf];
      if (kind === 'P1') {
        const n = [4, 9, 16, 25, 36, 49, 64][rint(7)], sig = 2 + rint(14);
        const r = sig / Math.sqrt(n), w = 2 * z * r;
        if (Math.abs(w * 100 - Math.round(w * 100)) > 1e-7 || w > 14 || w < 1.5) continue;
        const lo = (10 + rint(60)) / 10, key = 'P1' + [conf, n, sig, lo].join();
        if (prev && prev.key === key) continue;
        const hi = Math.round((lo + w) * 100) / 100;
        return { kind, conf, z, n, sig, lo, hi, r, w: Math.round(w * 100) / 100, key, ans: hi };
      }
      const sig = [2, 3, 4, 5, 10][rint(5)], k = 2 + rint(14);
      const len = 2 * z * sig / k;
      if (Math.abs(len * 100 - Math.round(len * 100)) > 1e-7 || len < 0.5) continue;
      const key = 'P2' + [conf, sig, k].join();
      if (prev && prev.key === key) continue;

  /* ======================= 장면 2 · 이항분포가 종 모양으로 (정규 근사) ======================= */
  // 근거 기출: 2026 수능 29 · 2026 9월 모평 29 · 2025 9월 모평 29 (이항분포의 정규 근사, 표준정규분포표)

  function lInfo(s) {
    const n = Math.round(s.ln), p = s.lp, q = 1 - p, mu = n * p, sd = Math.sqrt(n * p * q);

  // 문제 그림: 정규 근사한 종 모양(평균·표준편차·표준화 줄은 단계에 따라)
  const lForm = (V) => {

  };
  const lSteps = (V) => {
    const fm = lForm(V), { p, q } = lP(V), cb = (m, k) => `\\dfrac{${PS.C(m, k)}}{${Math.pow(2, m)}}`;

    const zt = V.form === 'btw' ? `\\mathrm{P}(-${V.z1}\\le Z\\le ${V.z2})` : V.form === 'le' ? `\\mathrm{P}(Z\\le ${V.z1})` : `\\mathrm{P}(Z\\ge -${V.z1})`;
    return [
      `한 번의 시행에서 성공할 확률 $p=\\dfrac{${V.t}}{6}\\times ${cb(V.m1, V.k1)}+\\dfrac{${6 - V.t}}{6}\\times ${cb(V.m2, V.k2)}=${ftex(p)}$.`,
      `$X\\sim \\mathrm{B}(${V.N},\\ ${ftex(p)})$이므로 $\\mathrm{E}(X)=${V.mu}$, $\\mathrm{V}(X)=${V.N}\\times ${ftex(p)}\\times ${ftex(q)}=${V.sig * V.sig}$, $\\sigma(X)=${V.sig}$. $N$이 크므로 $X$는 근사적으로 $\\mathrm{N}(${V.mu},\\ ${V.sig}^{2})$을 따른다.`,
      `$Z=\\dfrac{X-${V.mu}}{${V.sig}}$로 표준화하면 $${fm.probTex}\\approx ${zt}$.`,

  function drawLProblem(b, s, v, lab) {

  /* ======================= 장면 3-3 · 꺾은선 확률밀도함수 (넓이 1 · f+g=k) ======================= */

  const varM3 = varier(PS.genM3, 0x50530000+5);

  const m3Question = (V) => `$0\\le X\\le ${V.L}$, $0\\le Y\\le ${V.L}$인 두 연속확률변수 $X$, $Y$의 확률밀도함수를 각각 $f(x)$, $g(x)$라 하자. 확률변수 $X$의 확률밀도함수 $f(x)$의 그래프는 그림과 같다. $0\\le x\\le ${V.L}$인 모든 $x$에 대하여 $f(x)+g(x)=k$ ($k$는 상수)를 만족시킬 때, $\\mathrm{P}(${V.u}\\le Y\\le ${V.v})=\\dfrac{q}{p}$이다. $p+q$의 값을 구하시오. (단, $p$와 $q$는 서로소인 자연수이다.)`;

  const copy=value=>JSON.parse(JSON.stringify(value));
  const lessonScenes=labDefinition.groups.flatMap(g=>g.scenes);
  const classify=(id,v)=>id==='binom'?v.form:id==='std'?(v.kind==='B'?'B':v.z1<0?(v.z2<0?'A-left':'A-cross'):'A-right'):id==='mean'?(v.kind==='O1'?'O1':'O2-'+v.form):v.kind||'pdf';
  const desired={dist:['scale','aff'],binom:['le','ge','btw'],std:['A-left','A-cross','A-right','B'],sym:['T1','T2'],pdf:['pdf'],mean:['O1','O2-ge','O2-le','O2-btw'],ci:['P1','P2']};
  const questionOf={dist:kQuestion,binom:lQuestion,std:m1Question,sym:m2Question,pdf:m3Question,mean:oQuestion,ci:pQuestion};
  const stepsOf={dist:kSteps,binom:lSteps,std:m1Steps,sym:m2Steps,pdf:m3Steps,mean:oSteps,ci:pSteps};
  const info=Object.fromEntries(lessonScenes.map(sc=>{
    const initial=Object.fromEntries(Object.entries(labDefinition.params).map(([k,v])=>[k,v.value]));sc.enter(initial);
    const first=sc.vary.first(),models={[classify(sc.id,first)]:first};
    let packet=first;
    for(let i=1;i<=512&&desired[sc.id].some(key=>!models[key]);i++){
      packet=sc.vary.at(i,packet);const key=classify(sc.id,packet);if(!models[key])models[key]=packet;
    }
    if(desired[sc.id].some(key=>!models[key]))throw new Error('Missing statistics source branch: '+sc.id);
    const manual=sc.vary.cur;
    sc.vary.cur=()=>{
      const s=lpsContext||window.lab?.s;
      return lpsActive(s)&&s.lpsScene===sc.id?(models[s.lpsKind]||first):manual();
    };
    return [sc.id,{initial,first,models,inquiry:sc.question}];
  }));
  const sampleCache=new Map();
  function sampleSnapshot(id,s,count){
    count=Math.max(0,Math.min(1000,Math.round(count)));
    const key=id==='mean'?['mean',s.opop,Math.round(s.on),s.oseed,count].join('|'):['ci',Math.round(s.pn),s.pc,s.pseed,count].join('|');
    if(!sampleCache.has(key)){
      const result=copy(s);
      if(id==='mean'){oReset(result);oDraw(result,count);}
      else {pReset(result);pSample(result,count,true);}
      if(sampleCache.size>64)sampleCache.delete(sampleCache.keys().next().value);
      sampleCache.set(key,result);
    }
    const model=sampleCache.get(key);
    return id==='mean'?{omeans:model.omeans,olast:model.olast}:{prows:model.prows,ptot:model.ptot,phit:model.phit};
  }
  const lessonSource=window.APL_PS_SOURCE={
    scenes:lessonScenes,initial:id=>copy(info[id].initial),first:id=>copy(info[id].first),
    kind:id=>classify(id,info[id].first),kinds:id=>desired[id].slice(),
    packet:(id,kind)=>copy(info[id].models[kind||classify(id,info[id].first)]),
    question:(id,kind)=>questionOf[id](info[id].models[kind||classify(id,info[id].first)]),
    steps:(id,kind)=>stepsOf[id](info[id].models[kind||classify(id,info[id].first)]),
    inquiry:id=>info[id].inquiry,nativeKeys:id=>Object.keys(info[id].initial),
    math:{PS,KX,KSHAPES,kStat,kVals,setKP,lInfo,lForm,lP,normPdf,intersections,m2Pieces,m3Shape,fPoly,fInt,OVALS,OPOP,popStat,cardMeanDistribution,PM,PSIG,PZ,mkChart,BOX1,BOX_TOP,BOX_BOT,BOX_POP,BOX_MEAN,BOX_DIST,BOX_CI},
    samples:{mean:oDraw,confidence:pSample,resetMean:oReset,resetConfidence:pReset,snapshot:sampleSnapshot}
  };
  const shownState=s=>{
    const data={...s,...(s.lessonEntry?s.lpsInitial:{})},shown={...data};
    for(const [key,value] of Object.entries(data))if(/^lps[NS]_/.test(key))shown[key.slice(5)]=value;
    shown.step=s.lessonEntry?(s.lpsInitial?.step||0):Math.max(0,Math.min(s.step||0,4));
    shown.part=null;shown.playing=false;shown.dragging=false;
    if(s.lessonEntry){shown.lpsTrace=0;shown.lpsShowAnswer=false;}
    if(shown.lpsExplore&&['mean','ci'].includes(shown.lpsScene))Object.assign(shown,sampleSnapshot(shown.lpsScene,shown,shown.lpsSamples));
    return shown;
  };
  for(const sc of lessonScenes){
    const original={question:sc.question,steps:sc.steps,reviewTop:sc.reviewTop,view:sc.view,draw:sc.draw,tick:sc.tick};
    sc.question=(s,lab)=>lpsActive(s)?s.lpsQuestion||lessonSource.question(sc.id):typeof original.question==='function'?original.question(s,lab):original.question;
    sc.steps=(s,lab)=>lpsActive(s)?['조건 확인','분포와 전략','계산','구간 비교','결론']:original.steps(s,lab);
    sc.reviewTop=(s,lab)=>lpsActive(s)?'':original.reviewTop(s,lab);
    sc.view=(s,lab)=>lpsActive(s)?{}:original.view(s,lab);
    sc.tick=(s,dt,lab)=>lpsActive(s)?false:original.tick?.(s,dt,lab);
    sc.draw=(b,s,v,lab)=>{
      if(!lpsActive(s)){
        if(b._psLessonView){if(b.focus===b._psLessonView.appliedFocus)Object.assign(b,b._psLessonView.before);delete b._psLessonView;}
        return original.draw(b,s,v,lab);
      }
      if(!b._psLessonView)b._psLessonView={before:{focus:b.focus,zoom:b.zoom,panX:b.panX,panY:b.panY}};
      const shown=shownState(s),drawLab=Object.create(lab);drawLab.s=shown;drawLab.tab=shown.lpsExplore?'explore':'review';
      const key=sc.id+'|'+shown.lpsKind+'|'+shown.lpsExplore;
      if(b._psLessonView.key!==key){b._psLessonView.key=key;b.setFocus(labDefinition.board.focus,true);}
      const previous=lpsContext,previousTrace=lpsTraceShape,path=b.path;
      lpsContext=shown;lpsTraceShape=null;
      b.path=function(points,options){
        if(!lpsTraceShape&&points.length>1)lpsTraceShape={kind:'path',a:b._P(points[0]),z:b._P(points[1])};
        return path.call(this,points,options);
      };
      try{
        original.draw(b,shown,{},drawLab);
        if(!s.lessonEntry&&shown.lpsTrace>0&&!b._bbox&&lpsTraceShape){
          const q=lpsTraceShape,t=shown.lpsTrace;
          let point;
          if(q.kind==='curve'){const x=q.from+(q.to-q.from)*t;point=[q.c.X(x),q.c.Y(q.f(x))];}
          else if(q.kind==='bar')point=[q.c.X(q.x0+(q.x1-q.x0)*t),q.c.Y(q.h)];
          else point={x:q.a.x+(q.z.x-q.a.x)*t,y:q.a.y+(q.z.y-q.a.y)*t};
          b.point(point,{color:'violet',r:4.5});
        }
      }finally{lpsContext=previous;lpsTraceShape=previousTrace;b.path=path;}
      b._psLessonView.appliedFocus=b.focus;
    };
  }
  labDefinition.lessons=window.APL_PS_LESSONS?window.APL_PS_LESSONS.install(lessonScenes,lessonSource):{};

  APLab.createLab(labDefinition);
});
</script>
