<body>
<noscript>이 실험실을 보려면 브라우저에서 자바스크립트를 켜야 합니다.</noscript>
<script>
/* ==========================================================================
   중2 · 사각형의 성질 (AP Math Lab 2.0) — Ⅱ-2. 사각형의 성질
   탭(order 순): ① 평행사변형의 성질(10) · ② 평행사변형이 되는 조건(20) · ③ 직사각형·마름모·정사각형(30) · ④ 사다리꼴(40) · ⑤ 넓이가 같은 도형(50) · ⑥ 종이접기·결합(60)
   이 파일은 얇은 껍데기입니다. 공용 도구는 labs/g8-quadrilaterals/core.js, 각 탭은 t1~t6.js 모듈이
   window.APL_QD_GROUPS 에 { order, id, title, short, params, scenes } 를 등록하면 order 순으로 붙습니다.
   원칙(학생 가독성)
   - 그림은 무대 가득 · 길이와 각은 그림 안에 크게(화면 기준 14px 이상) · 모든 도형은 막대나 손잡이로 조절
   - 사각형 이름은 A 왼쪽 위 · B 왼쪽 아래 · C 오른쪽 아래 · D 오른쪽 위. 중2는 제곱근(√)을 배우기 전이라 길이·각은 정수로만 씁니다.
   - 움직임은 가로로만(제자리 회전·접기는 허용). 탐구 → 정리(교과서 해결 전략 순서) → 문제(5지선다 + 숫자 바꾸기)
   - 중점을 이은 사각형(바리뇽)은 g8-similarity(닮음)에서 다룹니다.
   ========================================================================== */
window.addEventListener('DOMContentLoaded', function () {
'use strict';
const MODULES = ['core', 't1', 't2', 't3', 't4', 't5', 't6', 'solutions', 'lesson-a', 'lesson-b', 'lesson-c'];
const loadScript = (src) => new Promise((res) => {
  const el = document.createElement('script');
  el.src = src; el.async = false;
  el.onload = () => res(true);
  el.onerror = () => { el.remove(); res(false); }; // 아직 없는 모듈은 건너뜁니다
  document.head.append(el);
});

function start() {
  const mods = (window.APL_QD_GROUPS || []).filter((g) => g && Array.isArray(g.scenes) && g.scenes.length);
  const groups = mods.slice().sort((a, b) => (a.order || 0) - (b.order || 0)).map((g) => ({ id: g.id, title: g.title, short: g.short || g.title, scenes: g.scenes }));
  const params = {};
  mods.forEach((g) => Object.assign(params, g.params || {}));
  APLab.createLab({
    id: 'g8-quadrilaterals',
    stackFractions: true, // 패널 글의 슬래시·유니코드 분수를 쌓은 분수로 바꿉니다 (kit/apl-core.js APLab.stackFr)
    title: '사각형의 성질',
    courseName: '중2',
    unit: '도형의 성질 · 사각형',
    courseColor: 'var(--m-sky)',
    home: '../index.html#g8',
    legacy: '../../labs/g8/quadrilaterals-atlas.html',
    board: { kind: 'figure', pad: 0.02, minZoom: 0.5, maxZoom: 6 },
    // 장면에 들어올 때마다 화면 범위를 처음 상태로 되돌립니다(앞 장면의 확대·위치가 남지 않게). 그림 맞춤은 장면 그리기에서 매번 합니다.
    enter: (s, sc, lab) => { if (lab && lab.board && s === lab.s) { lab.board.fit(); lab.board.setPanes(null); lab.board.setInsets({ top: 0, right: 0, bottom: 0, left: 0 }); } },
    params,
    lessons: (window.APL_LESSONS || {})['g8-quadrilaterals'] || {},
    groups
  });
}
Promise.all(MODULES.map((m) => loadScript(`g8-quadrilaterals/${m}.js`))).then(start);
});
</script>
</body>
</html>
