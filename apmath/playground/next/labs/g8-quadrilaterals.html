    function fmtNum(v) {

    const qpt = (x, y) => ({ x, y });
    const qmid = (a, b) => ({ x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 });
    const qlerp = (a, b, t) => ({ x: a.x + (b.x - a.x) * t, y: a.y + (b.y - a.y) * t });
    const qdist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
    const qsub = (a, b) => ({ x: a.x - b.x, y: a.y - b.y });
    const qadd = (a, b) => ({ x: a.x + b.x, y: a.y + b.y });
    const qmul = (v, k) => ({ x: v.x * k, y: v.y * k });
    const qnorm = (v) => { const l = Math.hypot(v.x, v.y) || 1; return { x: v.x / l, y: v.y / l }; };

    function qproject(p, a, b) {
      const dx = b.x - a.x, dy = b.y - a.y;
      const l2 = dx * dx + dy * dy || 1;
      const u = ((p.x - a.x) * dx + (p.y - a.y) * dy) / l2;
      return { x: a.x + u * dx, y: a.y + u * dy };
    }
    function qreflect(p, a, b) {
      const f = qproject(p, a, b);
      return { x: 2 * f.x - p.x, y: 2 * f.y - p.y };
    }
    function qintersect(a, b, c, d) {
      const u = qsub(b, a), v = qsub(d, c);
      const det = u.x * v.y - u.y * v.x;
      if (Math.abs(det) < 1e-9) return qmid(a, c);
      const w = qsub(c, a);
      const t = (w.x * v.y - w.y * v.x) / det;
      return qadd(a, qmul(u, t));
    }


  /* ===== 원본 상태 객체(이름 그대로) — 매 프레임 2.0 셸 상태에서 채웁니다 ===== */

    const SUB_MENUS = {

     ====================================================================== */
  let BOARD = null;
  let CUR = null; // 지금 그리는 셸 상태(끌기 점이 값을 되돌려 쓰는 곳)
  const PL = { pass: 2, obst: [], placed: [] }; // pass 1: 점 수집 / pass 2: 그리기. obst=점 상자, placed=이미 놓은 글자 상자(화면 좌표)
  const partOf = (p) => (p == null || p < 0 ? undefined : p);

  // 그림 안 글자: 원본의 ➔ ⭕ ❌ 는 글꼴에 따라 깨질 수 있어 → ○ × 로(국내 교과서 표기), 그 밖의 이모지는 뗍니다.

  const IDENT = [1, 0, 0, 1, 0, 0];
  const XF = { m: IDENT, stack: [] }; // [a,b,c,d,e,f]: x' = a·x + c·y + e, y' = b·x + d·y + f (캔버스와 같은 방식)
  const rp = (p) => {
    if (!p) return p;
    const [a, b, c, d, e, f] = XF.m;
    return XF.m === IDENT ? p : { x: a * p.x + c * p.y + e, y: b * p.x + d * p.y + f };
  };
  const ctx = {
    fillStyle: '#fff', font: '', textAlign: 'left',
    save() { XF.stack.push(XF.m); },
    restore() { XF.m = XF.stack.pop() || IDENT; },
    translate(x, y) { const [a, b, c, d, e, f] = XF.m; XF.m = [a, b, c, d, a * x + c * y + e, b * x + d * y + f]; },
    rotate(r) { const [a, b, c, d, e, f] = XF.m, co = Math.cos(r), si = Math.sin(r); XF.m = [a * co + c * si, b * co + d * si, -a * si + c * co, -b * si + d * co, e, f]; },
    fillText(str, x, y) { qtext({ x, y }, str, this.fillStyle); }
  };

  const twCache = new Map();
  function tw(str, size, weight) { // 글자 폭(px)
    const B = BOARD, key = `${weight}|${size.toFixed(2)}|${B.font}|${str}`;
    let w = twCache.get(key);
    if (w == null) {
      const c = B.ctx;
      c.save();
      c.font = `${weight} ${size}px ${B.font}`;
      w = c.measureText(str).width;
      c.restore();
      if (twCache.size > 4000) twCache.clear();

    return w;
  }
  // 글자 크기: 칸이 작으면 Board가 글자를 최대 22% 줄이지만, 휴대폰에서 읽기 어려워 92% 아래로는 줄이지 않습니다(lsz = Board._text 에 넘길 크기)
  const ES = () => Math.max(BOARD._ts(), 0.92);
  const tsz = (base) => base * BOARD.fs * (BOARD.thumb ? 0.78 : ES());
  const lsz = (base) => base * (BOARD.thumb ? 1 : ES() / BOARD._ts());
  const hit = (a, b) => a.x0 < b.x1 && a.x1 > b.x0 && a.y0 < b.y1 && a.y1 > b.y0;
  const isFree = (r) => !PL.obst.some((q) => hit(r, q)) && !PL.placed.some((q) => hit(r, q));
  const isInside = (r) => { const a = BOARD._area(); return r.x0 >= a.x + 3 && r.x1 <= a.x + a.w - 3 && r.y0 >= a.y + 3 && r.y1 <= a.y + a.h - 3; };
  // 자동 맞춤을 재는 중에는 무대 경계를 따지지 않고(글자 상자가 맞춤 범위를 정하도록), 실제 그릴 때만 무대 안에 두려 합니다.
  const okSpot = (r) => isFree(r) && (BOARD._bbox || BOARD.thumb || isInside(r));
  const RADII = [1, 1.45, 2];
  const TURNS = [0, 0.7, -0.7, 1.4, -1.4, 2.1, -2.1, Math.PI];

  function qpoly(pts, fill = 'rgba(52,211,153,0.20)', stroke = '#34d399', width = 3.2, partIdx = -1) {
    if (PL.pass === 1) return;
    BOARD.poly(pts.map(rp), { fill: fill || null, color: stroke || null, stroke: !!stroke, width, part: partOf(partIdx) });
  }
  function qline(a, b, color = '#fbbf24', width = 2.4, dash = [], glow = false, partIdx = -1) {
    if (PL.pass === 1) return;

        tapeTitle: `⚠️ 반례 경보: "일반 사각형에서"라는 말로 시작할 때는 등변사다리꼴(AC=BD)과 연꼴(AC⊥BD)을 조심하세요!`,

  /* ===== 원본 그대로: 장면별 그리기 (원본 1368–1985행)
     [2.0 수정] 그림 코드는 아래 부분만 바꿨습니다(각각 코드 안에 [2.0 수정]·[2.0] 주석):
                화면 폭별 배율 0.82/1.08 → 1.08 · 평행사변형 기울기 계수 0.65 → 0.5 (∠B = 라벨) · 교각 θ 라벨 ∠AOB → ∠BOC ·
                꼭짓점 D 끌기 점(qhandle) 한 줄 추가 · 등적변형 3-A의 D 위치 · 등적변형 3-B의 밑변 길이 · 반례5의 꼭짓점 이름·틱 · 반례1·3의 M·N 이름표 위치.
     캔버스 직접 호출(ctx.save·translate·rotate·fillText)은 위 ctx 도우미가 받습니다. ===== */
    function drawQuadMasterScene(cx, cy, t, spec) {
      const m = state.mode;
      const sub = state.subType[m];
      const s = state.scale * 1.08; // [2.0] 원본은 화면 폭에 따라 0.82/1.08배로 그렸지만, 2.0 무대는 항상 그림 전체를 화면에 맞추므로 하나로 둡니다
      const ang = state.angPreset;
      const dRatio = state.ratioPreset;

      // =====================================================================
      // [모드 1] 평행사변형 정의 · 성질 · 5대 판정 & 내부 새로운 평행사변형
      // =====================================================================
      if (m === 1) {
        const w = 195 * s, h = 112 * s;
        // [2.0 수정] 원본의 0.65는 그림 속 ∠B가 라벨(ang°)보다 작게(70°→65°, 60°→53°) 그려지게 했습니다. 0.5로 두면 ∠B = ang° 가 정확합니다.
        const skew = Math.tan(((90 - ang) * Math.PI) / 180) * h * 0.5;

        const pA = qpt(cx - w / 2 + skew, cy - h / 2);
        const pB = qpt(cx - w / 2 - skew, cy + h / 2);
        const pC = qpt(cx + w / 2 - skew, cy + h / 2);
        const defaultD = qpt(cx + w / 2 + skew, cy - h / 2);
        const pD = sub === 'paraDiag' && state.customDOffset
          ? qpt(defaultD.x + state.customDOffset.dx * s, defaultD.y + state.customDOffset.dy * s)
          : defaultD;
        const pO = qmid(pA, pC);
        const pN = qmid(pB, pD);
        const center = qmid(pO, pN);

        if (sub === 'paraDefSides' || sub === 'paraCond5') {
          const isCond5 = sub === 'paraCond5';
          const sepPhase = Math.sin(t * Math.PI);
          const sepX = sepPhase * 120 * s, sepY = sepPhase * -22 * s;

          qpoly([pA, pB, pC], 'rgba(56, 189, 248, 0.28)', QCOL.cyan, 3.2, 0);
          if (!isCond5) {
            qarrows(pB, pC, 1, QCOL.cyan);
          }
          qarrows(pB, pA, 2, QCOL.gold);
          qticks(pA, pB, 1, QCOL.gold, 8);
          if (!isCond5) qticks(pB, pC, 2, QCOL.cyan, 8);
          qangle(pA, pB, pC, QCOL.gold, 28, 1, '•');
          if (!isCond5) qangle(pC, pA, pB, QCOL.pink, 30, 2, '×');

          ctx.save();
          const midAC = qpt(pO.x + sepX, pO.y + sepY);
          ctx.translate(midAC.x, midAC.y);
          ctx.rotate(t * Math.PI);
          ctx.translate(-midAC.x, -midAC.y);

          const sA = qpt(pA.x + sepX, pA.y + sepY);
          const sC = qpt(pC.x + sepX, pC.y + sepY);
          const sD = qpt(pD.x + sepX, pD.y + sepY);
          qpoly([sA, sC, sD], 'rgba(251, 191, 36, 0.30)', QCOL.gold, 3.2, 1);
          if (!isCond5) qarrows(sA, sD, 1, QCOL.cyan);
          qarrows(sC, sD, 2, QCOL.gold);
          qticks(sC, sD, 1, QCOL.gold, 8);
          if (!isCond5) qticks(sA, sD, 2, QCOL.cyan, 8);
          qangle(sC, sD, sA, QCOL.gold, 28, 1, '•');
          if (!isCond5) qangle(sA, sC, sD, QCOL.pink, 30, 2, '×');
          qdot(sD, t > 0.7 ? 'D(→B에 포개짐!)' : 'D', QCOL.gold, midAC);
          ctx.restore();

          qline(pA, pC, QCOL.white, 2.8, [6, 4], false, 1);
          qdot(pA, 'A', QCOL.white, center);
          qdot(pB, 'B', QCOL.cyan, center);
          qdot(pC, 'C', QCOL.white, center);
        } else if (sub === 'paraAngles') {
          qpoly([pA, pB, pC, pD], 'rgba(52, 211, 153, 0.18)', QCOL.green, 3.4, 0);
          qarrows(pA, pD, 1, QCOL.cyan); qarrows(pB, pC, 1, QCOL.cyan);

          // ∠B의 이등분선과 AD의 교점 E (AB = AE인 이등변삼각형!)
          const lenAB = qdist(pA, pB);
          const dirAD = qnorm(qsub(pD, pA));
          const pE = qadd(pA, qmul(dirAD, lenAB));
          // ∠A의 이등분선과 BE의 교점 P (수직 90°!)
          const pP = qmid(pB, pE);

          if (t > 0.05 || state.conceptSwitch === 'aux' || state.activePartIdx !== -1) {
            qpoly([pA, pB, pE], 'rgba(56, 189, 248, 0.26)', QCOL.cyan, 2.8, 2);
            qpoly([pA, pB, pP], 'rgba(244, 114, 182, 0.34)', QCOL.pink, 3.0, 1);
            qline(pB, pE, QCOL.cyan, 3.2, [], true, 2);
            qline(pA, pP, QCOL.pink, 3.2, [], true, 1);
            qright(pP, pA, pB, 13, QCOL.pink);
            qticks(pA, pB, 2, QCOL.gold, 8);
            qticks(pA, pE, 2, QCOL.gold, 8);
            qangle(pE, pB, pA, QCOL.cyan, 26, 2, '×(엇각)');
            qdot(pE, 'E(AB=AE 이등변!)', QCOL.cyan, null, { x: 0, y: -14 });
            qdot(pP, 'P(90° 직교!)', QCOL.pink, null, { x: 14, y: 8 });
          }

          qangle(pA, pB, pP, QCOL.gold, 26, 1, '•');
          qangle(pA, pP, pD, QCOL.gold, 30, 1, '•');
          qangle(pB, pC, pE, QCOL.cyan, 26, 2, '×');
          qangle(pB, pE, pA, QCOL.cyan, 30, 2, '×');
          qangle(pC, pD, pB, QCOL.gold, 28, 1, `${180 - ang}°`);
          qangle(pD, pA, pC, QCOL.cyan, 28, 2, `${ang}°`);
          // [표시 보강] 이웃각의 합 180°: ∠A = ∠C(110° 금색), ∠B = ∠D(70° 하늘색) 가 한눈에 보이게 A·B 안쪽에도 값을 적음
          qangle(pA, pB, pD, QCOL.gold, 46, 1, `${180 - ang}°`);
          qangle(pB, pC, pA, QCOL.cyan, 50, 2, `${ang}°`);

          [pA, pB, pC, pD].forEach((p, i) => qdot(p, 'ABCD'[i], QCOL.white, center));
        } else if (sub === 'paraDiag') {
          const isBroken = !!state.customDOffset && qdist(pO, pN) > 5;
          qpoly([pA, pB, pC, pD], isBroken ? 'rgba(244, 63, 94, 0.18)' : 'rgba(52, 211, 153, 0.18)', isBroken ? QCOL.red : QCOL.green, 3.4, 0);
          qline(pA, pC, QCOL.gold, 2.5, [6, 4], false, 0);
          qline(pB, pD, QCOL.cyan, 2.5, [6, 4], false, 0);

          if (!isBroken) {
            const u = 0.25 + 0.5 * t;
            const pE = qlerp(pA, pD, u), pF = qlerp(pC, pB, u);
            qpoly([pO, pA, pE], 'rgba(251, 191, 36, 0.34)', QCOL.gold, 2.8, 1);
            qpoly([pO, pC, pF], 'rgba(244, 114, 182, 0.34)', QCOL.pink, 2.8, 1);
            qline(pE, pF, QCOL.white, 3.2, [], true, 1);
            qticks(pO, pA, 1, QCOL.gold, 7); qticks(pO, pC, 1, QCOL.gold, 7);
            qticks(pO, pB, 2, QCOL.cyan, 7); qticks(pO, pD, 2, QCOL.cyan, 7);
            qticks(pO, pE, 3, QCOL.pink, 7.5); qticks(pO, pF, 3, QCOL.pink, 7.5);
            // [표시 보강] △OAE ≡ △OCF 의 같은 각: 엇각 ∠EAO = ∠FCO(●), ∠AEO = ∠CFO(×) (AD ∥ BC)
            qangle(pA, pE, pC, QCOL.gold, 26, 1, '•');
            qangle(pC, pF, pA, QCOL.gold, 26, 1, '•');
            qangle(pE, pA, pF, QCOL.pink, 24, 2, '×');
            qangle(pF, pC, pE, QCOL.pink, 24, 2, '×');
            qdot(pO, 'O(중점 일치)', QCOL.gold, null, { x: 14, y: 4 });
            qdot(pE, 'E', QCOL.gold, null, { x: 0, y: -14 });
            qdot(pF, 'F(OE=OF)', QCOL.pink, null, { x: 0, y: 20 });
          } else {
            qline(pO, pN, QCOL.red, 3.6, [], true, 2);
            qdot(pO, 'M(AC중점)', QCOL.gold, null, { x: -45, y: -10 });
            qdot(pN, 'N(BD중점)', QCOL.pink, null, { x: 14, y: 16 });
          }

          qdot(pA, 'A', QCOL.white, center);
          qdot(pB, 'B', QCOL.white, center);
          qdot(pC, 'C', QCOL.white, center);
          qdot(pD, 'D(마우스 드래그!)', QCOL.gold, center);
          qhandle('D', pD, defaultD); // [2.0] 원본의 캔버스 마우스 드래그 → 무대의 끌 수 있는 점
        } else {
          // paraHidden (대각선 수선의 발 E, F ➔ □EBFD 평행사변형!)
          const pE = qproject(pB, pA, pC);
          const pF = qproject(pD, pA, pC);

          qpoly([pA, pB, pC, pD], 'rgba(148, 163, 184, 0.10)', 'rgba(148, 163, 184, 0.5)', 2.2);
          qpoly([pA, pB, pE], 'rgba(251, 191, 36, 0.32)', QCOL.gold, 2.8, 0);
          qpoly([pC, pD, pF], 'rgba(251, 191, 36, 0.32)', QCOL.gold, 2.8, 0);
          qpoly([pE, pB, pF, pD], 'rgba(52, 211, 153, 0.34)', QCOL.green, 3.4, 2);

          qline(pA, pC, QCOL.white, 2.4, [5, 4]);
          qline(pB, pE, QCOL.pink, 3.6, [], true, 1);
          qline(pD, pF, QCOL.pink, 3.6, [], true, 1);

          qright(pE, pB, pA, 11, QCOL.pink);
          qright(pF, pD, pC, 11, QCOL.pink);
          qticks(pB, pE, 1, QCOL.pink, 7.5);
          qticks(pD, pF, 1, QCOL.pink, 7.5);
          qarrows(pB, pE, 1, QCOL.pink);
          qarrows(pF, pD, 1, QCOL.pink);

          [pA, pB, pC, pD].forEach((p, i) => qdot(p, 'ABCD'[i], QCOL.white, center));
          qdot(pE, 'E(⊥)', QCOL.pink, null, { x: -18, y: -10 });
          qdot(pF, 'F(⊥)', QCOL.pink, null, { x: 14, y: 14 });
        }
      }

      // =====================================================================
      // [모드 2] 사각형 족보 진화 & 등변사다리꼴 2대 보조선 & 대각선 조합기
      // =====================================================================
      else if (m === 2) {
        if (sub === 'isoTrapMaster') {
          const topW = 96 * s, botW = 224 * s, h = 115 * s;
          const pA = qpt(cx - topW / 2, cy - h / 2), pD = qpt(cx + topW / 2, cy - h / 2);
          const pB = qpt(cx - botW / 2, cy + h / 2), pC = qpt(cx + botW / 2, cy + h / 2);
          const center = qpt(cx, cy);

          qpoly([pA, pB, pC, pD], 'rgba(56, 189, 248, 0.14)', QCOL.cyan, 3.4);
          qarrows(pA, pD, 1, QCOL.cyan); qarrows(pB, pC, 1, QCOL.cyan);
          qticks(pA, pB, 1, QCOL.gold, 8.5); qticks(pD, pC, 1, QCOL.gold, 8.5);
          qangle(pB, pC, pA, QCOL.gold, 28, 1, '∠B');
          qangle(pC, pD, pB, QCOL.gold, 28, 1, '∠C');

          if (state.activePartIdx === 2) {
            // 대각선 AC = BD SAS 합동 강조
            qpoly([pA, pB, pC], 'rgba(244, 114, 182, 0.25)', QCOL.pink, 3.0, 2);
            qpoly([pD, pC, pB], 'rgba(251, 191, 36, 0.25)', QCOL.gold, 3.0, 2);
            qline(pA, pC, QCOL.pink, 3.8, [], true, 2);
            qline(pB, pD, QCOL.gold, 3.8, [], true, 2);
          } else if (t < 0.5 && state.activePartIdx !== 1) {
            // 보조선 ①: 점 D에서 평행선 DE ∥ AB
            const pE = qpt(pB.x + topW, pB.y);
            qpoly([pA, pB, pE, pD], 'rgba(56, 189, 248, 0.22)', QCOL.cyan, 2.6, 0);
            qpoly([pD, pE, pC], 'rgba(251, 191, 36, 0.32)', QCOL.gold, 3.2, 0);
            qarrows(pB, pA, 2, QCOL.gold); qarrows(pE, pD, 2, QCOL.gold);
            qticks(pD, pE, 1, QCOL.gold, 8.5);
            qangle(pE, pC, pD, QCOL.gold, 26, 1, '동위각');
            qdot(pE, 'E(보조선 DE∥AB: 이등변 △DEC!)', QCOL.gold, null, { x: -10, y: 22 });
          } else {
            // 보조선 ②: 점 A, D에서 밑변에 수선 AH, DK
            const pH = qpt(pA.x, pB.y), pK = qpt(pD.x, pC.y);
            qpoly([pA, pB, pH], 'rgba(52, 211, 153, 0.34)', QCOL.green, 3.0, 1);
            qpoly([pD, pK, pC], 'rgba(52, 211, 153, 0.34)', QCOL.green, 3.0, 1);
            qpoly([pA, pH, pK, pD], 'rgba(56, 189, 248, 0.18)', QCOL.cyan, 2.4, 1);
            qright(pH, pA, pB, 11, QCOL.green);
            qright(pK, pD, pC, 11, QCOL.green);
            qticks(pB, pH, 2, QCOL.green, 7.5);
            qticks(pK, pC, 2, QCOL.green, 7.5);
            qdot(pH, 'H(BH=4cm)', QCOL.green, null, { x: -20, y: 22 });
            qdot(pK, 'K(CK=4cm)', QCOL.green, null, { x: 10, y: 22 });
          }

          [pA, pB, pC, pD].forEach((p, i) => qdot(p, 'ABCD'[i], QCOL.white, center));
        } else {
          // evoRect, evoRhombus, evoSquare, diagSynthesis
          let curTheta = ang;
          let curRatio = dRatio;
          if (sub === 'evoRect') {
            curTheta = 65;
            curRatio = 0.7 + 0.3 * t; // t=1 일 때 1.0 (AC=BD 직사각형!)
          } else if (sub === 'evoRhombus') {
            curTheta = 65 + 25 * t;   // t=1 일 때 90° (AC⊥BD 마름모!)
            curRatio = 0.68;
          } else if (sub === 'evoSquare') {
            curTheta = 65 + 25 * t;   // t=1 일 때 90°
            curRatio = 0.7 + 0.3 * t; // t=1 일 때 1.0 (정사각형!)
          }

          const isEq = Math.abs(curRatio - 1.0) < 0.03;
          const isPerp = Math.abs(curTheta - 90) < 1.5;

          const pO = qpt(cx, cy);
          const phi = (30 * Math.PI) / 180;
          const rad = (curTheta * Math.PI) / 180;
          const halfAC = 148 * s, halfBD = halfAC * curRatio;
          const v1 = qpt(Math.cos(phi), Math.sin(phi));
          const v2 = qpt(Math.cos(phi + rad), Math.sin(phi + rad));

          const pA = qpt(cx - halfAC * v1.x, cy - halfAC * v1.y);
          const pC = qpt(cx + halfAC * v1.x, cy + halfAC * v1.y);
          const pB = qpt(cx + halfBD * v2.x, cy + halfBD * v2.y);
          const pD = qpt(cx - halfBD * v2.x, cy - halfBD * v2.y);

          const col = isEq && isPerp ? QCOL.green : isEq ? QCOL.cyan : isPerp ? QCOL.gold : QCOL.green;
          qpoly([pA, pB, pC, pD], col + '30', col, 3.6, 0);
          qline(pA, pC, isEq ? QCOL.gold : QCOL.cyan, 3.0, [], isEq, 1);
          qline(pB, pD, isEq ? QCOL.gold : QCOL.pink, 3.0, [], isEq, 1);

          if (isEq) {
            qright(pA, pB, pD, 13, QCOL.cyan);
            qright(pB, pC, pA, 13, QCOL.cyan);
            qright(pC, pD, pB, 13, QCOL.cyan);
            qright(pD, pA, pC, 13, QCOL.cyan);
            qticks(pO, pA, 2, QCOL.gold, 7.5);
            qticks(pO, pB, 2, QCOL.gold, 7.5);
            qticks(pO, pC, 2, QCOL.gold, 7.5);
            qticks(pO, pD, 2, QCOL.gold, 7.5);
          } else {
            qticks(pO, pA, 1, QCOL.cyan, 7); qticks(pO, pC, 1, QCOL.cyan, 7);
            qticks(pO, pB, 2, QCOL.pink, 7); qticks(pO, pD, 2, QCOL.pink, 7);
          }

          if (isPerp) {
            qright(pO, pA, pB, 14, QCOL.pink);
            qticks(pA, pB, 1, QCOL.gold, 8.5);
            qticks(pB, pC, 1, QCOL.gold, 8.5);
            qticks(pC, pD, 1, QCOL.gold, 8.5);
            qticks(pD, pA, 1, QCOL.gold, 8.5);
          } else {
            // [2.0 수정] 원본은 ∠AOB(= 180° - θ)에 θ°를 적었습니다. 두 대각선의 교각 θ는 ∠BOC 이므로 pA → pC 로 바꿉니다.
            qangle(pO, pC, pB, QCOL.pink, 24, 1, `${Math.round(curTheta)}°`);
          }

          qdot(pO, 'O', QCOL.white, null, { x: 10, y: -8 });
          [pA, pB, pC, pD].forEach((p, i) => qdot(p, 'ABCD'[i], QCOL.white, pO));
        }
      }

      // =====================================================================
      // [모드 3] 평행선 등적변형 · 사다리꼴 나비 넓이 · 내부 점 P
      // =====================================================================
      else if (m === 3) {
        if (sub === 'quadToTri') {
          const A = qpt(cx - 140 * s, cy - 82 * s);
          const B = qpt(cx - 110 * s, cy + 88 * s);
          const C = qpt(cx + 35 * s, cy + 88 * s);
          // [2.0 수정] 원본 D(70, -58)은 △ACD 를 △ABC 보다 더 크게 그려 '60 cm² + 40 cm²' 설명·띠와 어긋났습니다. D(27, -14)로 두면 넓이비가 59.9 : 40.1 로 맞습니다.
          const D = qpt(cx + 27 * s, cy - 14 * s);
          const fac = (B.y - D.y) / (C.y - A.y);
          const E = qpt(D.x + fac * (C.x - A.x), B.y);
          const Dmove = qlerp(D, E, t);

          qpoly([A, B, C], 'rgba(56, 189, 248, 0.28)', QCOL.cyan, 3.2, 0);
          qpoly([A, C, D], 'rgba(251, 191, 36, 0.14)', 'rgba(251, 191, 36, 0.55)', 2.0, 1);
          qpoly([A, C, Dmove], 'rgba(52, 211, 153, 0.36)', QCOL.green, 3.4, 2);

          qline(A, C, QCOL.gold, 3.0, [5, 4], true, 1);
          qline(D, E, QCOL.gold, 3.0, [5, 4], true, 1);
          qline(C, E, QCOL.pink, 3.0);
          qarrows(A, C, 2, QCOL.gold, 7.5);
          qarrows(D, E, 2, QCOL.gold, 7.5);

          qdot(A, 'A', QCOL.white, null, { x: -16, y: -8 });
          qdot(B, 'B', QCOL.white, null, { x: -16, y: 18 });
          qdot(C, 'C', QCOL.white, null, { x: -6, y: 20 });
          qdot(D, 'D(원래 꼭짓점)', QCOL.gold, null, { x: 10, y: -8 });
          qdot(E, 'E', QCOL.pink, null, { x: 8, y: 20 }); // [표시 보강] 연장선 위의 점은 'E' 로만 적음
          if (t > 0.02) qdot(Dmove, t > 0.92 ? 'D→E(△ABE 완성!)' : 'D\'(등적 이동 중)', QCOL.green, null, { x: 14, y: -10 });
        } else if (sub === 'equiSlide') {
          const yTop = cy - 80 * s, yBot = cy + 75 * s, wLine = 250 * s;
          qline(qpt(cx - wLine, yTop), qpt(cx + wLine, yTop), 'rgba(52, 211, 153, 0.55)', 2.2, [6, 5]);
          qline(qpt(cx - wLine, yBot), qpt(cx + wLine, yBot), 'rgba(52, 211, 153, 0.55)', 2.2, [6, 5]);
          qarrows(qpt(cx - 190 * s, yTop), qpt(cx - 150 * s, yTop), 1, QCOL.green);
          qarrows(qpt(cx - 190 * s, yBot), qpt(cx - 150 * s, yBot), 1, QCOL.green);

          // [2.0 수정] 설명은 '밑변 BC = 16, 높이 h = 10'(비 1.6)인데 원본 그림은 190 : 155 (비 1.2) 였습니다. 밑변을 248로 늘려 16 : 10 에 맞춥니다.
          const pB = qpt(cx - 130 * s, yBot), pC = qpt(cx + 118 * s, yBot);
          const pA0 = qpt(cx - 90 * s, yTop);
          const pA = qpt((1 - t) * (cx - 90 * s) + t * (cx + 135 * s), yTop);
          const pH = qpt(pA.x, yBot);
          const pM = qlerp(pB, pC, 0.25);

          qpoly([pA0, pB, pC], 'rgba(56, 189, 248, 0.16)', QCOL.cyan, 2.2, 0);
          qpoly([pA, pB, pC], 'rgba(251, 191, 36, 0.34)', QCOL.gold, 3.5, 1);
          if (state.activePartIdx === 2) {
            qpoly([pA, pB, pM], 'rgba(244, 114, 182, 0.42)', QCOL.pink, 3.0, 2);
            qdot(pM, 'M(1:3 내분)', QCOL.pink, null, { x: 0, y: 20 });
          }

          qline(pA, pH, QCOL.red, 2.6, [4, 4]);
          qright(pH, pA, pC, 11, QCOL.red);
          qdot(pA0, 'A(처음 80cm²)', QCOL.cyan, null, { x: -20, y: -14 });
          qdot(pA, "A'(80cm² 불변!)", QCOL.gold, null, { x: 0, y: -14 });
          qdot(pB, 'B', QCOL.white, null, { x: -16, y: 18 });
          qdot(pC, 'C', QCOL.white, null, { x: 10, y: 18 });
          qdot(pH, 'H(높이 h=10)', QCOL.red, null, { x: 8, y: 20 });
        } else if (sub === 'butterflyWing') {
          const topW = 96 * s, botW = 192 * s, h = 128 * s;
          const pA = qpt(cx - topW / 2 + 18 * s, cy - h / 2), pD = qpt(cx + topW / 2 + 18 * s, cy - h / 2);
          const pB = qpt(cx - botW / 2, cy + h / 2), pC = qpt(cx + botW / 2, cy + h / 2);
          const pO = qintersect(pA, pC, pB, pD);

          qpoly([pA, pB, pC, pD], 'rgba(15, 38, 29, 0.45)', QCOL.green, 2.8);
          qarrows(pA, pD, 1, QCOL.cyan); qarrows(pB, pC, 1, QCOL.cyan);

          qpoly([pO, pA, pD], 'rgba(56, 189, 248, 0.28)', QCOL.cyan, 2.4, 1);
          qpoly([pO, pB, pC], 'rgba(244, 114, 182, 0.28)', QCOL.pink, 2.4, 1);
          qpoly([pA, pB, pO], 'rgba(251, 191, 36, 0.50)', QCOL.gold, 3.2, 0);
          qpoly([pD, pC, pO], 'rgba(251, 191, 36, 0.50)', QCOL.gold, 3.2, 0);

          qdot(pO, 'O', QCOL.white, null, { x: 0, y: -14 });
          [pA, pB, pC, pD].forEach((p, i) => qdot(p, 'ABCD'[i], QCOL.white, pO));

          ctx.save();
          ctx.font = '800 12.5px Pretendard, sans-serif';
          ctx.fillStyle = '#ffffff'; ctx.textAlign = 'center';
          ctx.fillText('위 = 3cm²', pO.x, pO.y - 34 * s);
          ctx.fillText('아래 = 12cm²', pO.x, pO.y + 48 * s);
          ctx.fillStyle = '#fef08a';
          ctx.fillText('S₁ = 6cm²', pO.x - 52 * s, pO.y + 4 * s);
          ctx.fillText('S₂ = 6cm²', pO.x + 56 * s, pO.y + 4 * s);
          ctx.restore();
        } else if (sub === 'insidePointP') {
          const A = qpt(cx - 105 * s, cy - 82 * s), B = qpt(cx - 140 * s, cy + 82 * s);
          const C = qpt(cx + 105 * s, cy + 82 * s), D = qpt(cx + 140 * s, cy - 82 * s);
          const P = qpt(cx + (-32 + 64 * Math.cos(t * Math.PI * 2)) * s, cy + (16 + 26 * Math.sin(t * Math.PI * 2)) * s);

          qpoly([P, A, D], 'rgba(56, 189, 248, 0.34)', QCOL.cyan, 2.6, 0);
          qpoly([P, B, C], 'rgba(56, 189, 248, 0.34)', QCOL.cyan, 2.6, 0);
          qpoly([P, A, B], 'rgba(251, 191, 36, 0.30)', QCOL.gold, 2.6, 1);
          qpoly([P, D, C], 'rgba(251, 191, 36, 0.30)', QCOL.gold, 2.6, 1);

          const uAB = qsub(B, A), uAD = qsub(D, A);
          const E = qintersect(P, qadd(P, uAD), A, B), F = qintersect(P, qadd(P, uAD), D, C);
          const G = qintersect(P, qadd(P, uAB), A, D), H = qintersect(P, qadd(P, uAB), B, C);
          qline(E, F, QCOL.pink, 2.4, [5, 4], true, 2);
          qline(G, H, QCOL.pink, 2.4, [5, 4], true, 2);

          qdot(P, 'P(a+b+c+d = ½S!)', QCOL.gold, null, { x: 12, y: -10 });
          [A, B, C, D].forEach((p, i) => qdot(p, 'ABCD'[i], QCOL.white, P));
        } else {
          // paraHeightSplit (윗변 위 점 E 슬라이딩: △EBC = ½S)
          const A = qpt(cx - 105 * s, cy - 82 * s), B = qpt(cx - 140 * s, cy + 82 * s);
          const C = qpt(cx + 105 * s, cy + 82 * s), D = qpt(cx + 140 * s, cy - 82 * s);
          const E = qlerp(A, D, 0.2 + 0.65 * t);

          qpoly([A, B, E], 'rgba(56, 189, 248, 0.26)', QCOL.cyan, 2.4, 1);
          qpoly([D, E, C], 'rgba(56, 189, 248, 0.26)', QCOL.cyan, 2.4, 1);
          qpoly([E, B, C], 'rgba(251, 191, 36, 0.40)', QCOL.gold, 3.4, 0);

          qarrows(A, D, 1, QCOL.cyan); qarrows(B, C, 1, QCOL.cyan);
          [A, B, C, D].forEach((p, i) => qdot(p, 'ABCD'[i], QCOL.white, qpt(cx, cy)));
          qdot(E, 'E(S_△EBC = ½S 불변!)', QCOL.gold, null, { x: 0, y: -14 });
        }
      }

      // =====================================================================
      // [모드 4] 사각형 네 변의 중점연결 (바리뇽 마스터 5종 + 귀퉁이 접기 ½ 증명!)
      // =====================================================================
      else if (m === 4) {
        let pA, pB, pC, pD;
        if (sub === 'varignonRectToRhomb') {
          pA = qpt(cx - 145 * s, cy - 88 * s); pD = qpt(cx + 145 * s, cy - 88 * s);
          pB = qpt(cx - 145 * s, cy + 88 * s); pC = qpt(cx + 145 * s, cy + 88 * s);
        } else if (sub === 'varignonIsoToRhomb') {
          pA = qpt(cx - 72 * s, cy - 88 * s); pD = qpt(cx + 72 * s, cy - 88 * s);
          pB = qpt(cx - 150 * s, cy + 88 * s); pC = qpt(cx + 150 * s, cy + 88 * s);
        } else if (sub === 'varignonRhombToRect') {
          pA = qpt(cx, cy - 102 * s); pC = qpt(cx, cy + 102 * s);
          pB = qpt(cx - 138 * s, cy); pD = qpt(cx + 138 * s, cy);
        } else if (sub === 'varignonSquareToSquare') {
          const hs = 106 * s;
          pA = qpt(cx - hs, cy - hs); pD = qpt(cx + hs, cy - hs);
          pB = qpt(cx - hs, cy + hs); pC = qpt(cx + hs, cy + hs);
        } else {
          pA = qpt(cx - 115 * s, cy - 95 * s); pD = qpt(cx + 138 * s, cy - 72 * s);
          pB = qpt(cx - 148 * s, cy + 82 * s); pC = qpt(cx + 112 * s, cy + 96 * s);
        }

        const pP = qmid(pA, pB), pQ = qmid(pB, pC), pR = qmid(pC, pD), pS = qmid(pD, pA);
        const center = qmid(pP, pR);

        qpoly([pA, pB, pC, pD], 'rgba(15, 38, 29, 0.55)', 'rgba(203, 213, 225, 0.65)', 2.4);

        // 대각선 AC(시안) ↔ PQ, SR  /  대각선 BD(핑크) ↔ PS, QR 컬러 브릿지!
        qline(pA, pC, QCOL.cyan, 2.4, [5, 4], false, 0);
        qline(pB, pD, QCOL.pink, 2.4, [5, 4], false, 1);
        if (sub === 'varignonRhombToRect' || sub === 'varignonSquareToSquare') {
          const pO = qintersect(pA, pC, pB, pD);
          qright(pO, pA, pB, 12, QCOL.gold);
        }

        qpoly([pP, pQ, pR, pS], 'rgba(52, 211, 153, 0.30)', null, 0, 2);
        qline(pP, pQ, QCOL.cyan, 4.0, [], true, 0);
        qline(pS, pR, QCOL.cyan, 4.0, [], true, 0);
        qline(pP, pS, QCOL.pink, 4.0, [], true, 1);
        qline(pQ, pR, QCOL.pink, 4.0, [], true, 1);

        // [표시 보강] 네 변의 중점(AP=PB, BQ=QC, CR=RD, DS=SA 눈금)과 평행 표시: PQ ∥ SR ∥ AC(▸), PS ∥ QR ∥ BD(▸▸) — 중점연결정리가 그림에 보이게
        {
          const pOd = qintersect(pA, pC, pB, pD);
          qticks(pA, pP, 1, QCOL.white, 8); qticks(pP, pB, 1, QCOL.white, 8);
          qticks(pB, pQ, 2, QCOL.white, 8); qticks(pQ, pC, 2, QCOL.white, 8);
          qticks(pC, pR, 3, QCOL.white, 8); qticks(pR, pD, 3, QCOL.white, 8);
          qticks(pD, pS, 4, QCOL.white, 8); qticks(pS, pA, 4, QCOL.white, 8);
          qarrows(pA, pOd, 1, QCOL.cyan); qarrows(pP, qmid(pP, pQ), 1, QCOL.cyan); qarrows(pS, qmid(pS, pR), 1, QCOL.cyan);
          qarrows(pB, pOd, 2, QCOL.pink); qarrows(pP, qmid(pP, pS), 2, QCOL.pink); qarrows(pQ, qmid(pQ, pR), 2, QCOL.pink);
        }
        if (sub === 'varignonRectToRhomb' || sub === 'varignonIsoToRhomb' || sub === 'varignonSquareToSquare') {
          qticks(pP, pQ, 1, QCOL.gold, 8); qticks(pQ, pR, 1, QCOL.gold, 8);
          qticks(pR, pS, 1, QCOL.gold, 8); qticks(pS, pP, 1, QCOL.gold, 8);
        }
        if (sub === 'varignonRhombToRect' || sub === 'varignonSquareToSquare') {
          qright(pP, pQ, pS, 11, QCOL.gold); qright(pQ, pR, pP, 11, QCOL.gold);
          qright(pR, pS, pQ, 11, QCOL.gold); qright(pS, pP, pR, 11, QCOL.gold);
        }

        // 슬라이더 t > 0: 바깥 4개 귀퉁이 삼각형을 안으로 접어 넓이가 정확히 ½임을 시각 증명!
        if (t > 0.01) {
          const A_f = qlerp(pA, qreflect(pA, pP, pS), t);
          const B_f = qlerp(pB, qreflect(pB, pP, pQ), t);
          const C_f = qlerp(pC, qreflect(pC, pQ, pR), t);
          const D_f = qlerp(pD, qreflect(pD, pR, pS), t);
          qpoly([A_f, pP, pS], 'rgba(251, 191, 36, 0.42)', QCOL.gold, 2.2, 2);
          qpoly([B_f, pP, pQ], 'rgba(56, 189, 248, 0.42)', QCOL.cyan, 2.2, 2);
          qpoly([C_f, pQ, pR], 'rgba(244, 114, 182, 0.42)', QCOL.pink, 2.2, 2);
          qpoly([D_f, pR, pS], 'rgba(52, 211, 153, 0.42)', QCOL.green, 2.2, 2);
        }

        [pA, pB, pC, pD].forEach((p, i) => qdot(p, 'ABCD'[i], QCOL.white, center));
        [pP, pQ, pR, pS].forEach((p, i) => qdot(p, `${'PQRS'[i]}(중점)`, QCOL.gold, center));
      }

      // =====================================================================
      // [모드 5] 종이접기(테이프) & 정사각형 속 회전 합동 · 정삼각형 각도 킬러
      // =====================================================================
      else if (m === 5) {
        const rA = qpt(cx - 132 * s, cy - 84 * s), rB = qpt(cx - 132 * s, cy + 84 * s);
        const rC = qpt(cx + 132 * s, cy + 84 * s), rD = qpt(cx + 132 * s, cy - 84 * s);
        const center = qpt(cx, cy);

        if (sub === 'foldTape') {
          qpoly([rA, rB, rC, rD], 'rgba(56, 189, 248, 0.10)', 'rgba(148, 163, 184, 0.5)', 2.2);
          qarrows(rA, rD, 1, QCOL.cyan); qarrows(rB, rC, 1, QCOL.cyan);
          qline(rA, rC, QCOL.gold, 3.2);

          const B_ref = qreflect(rB, rA, rC);
          const B_cur = qlerp(rB, B_ref, Math.max(0.2, t));
          const E = qintersect(rA, rD, rC, B_ref);

          qpoly([rA, B_cur, rC], 'rgba(56, 189, 248, 0.22)', QCOL.cyan, 2.8, 1);
          qpoly([rA, E, rC], 'rgba(251, 191, 36, 0.42)', QCOL.gold, 3.6, 0);
          qticks(E, rA, 2, QCOL.gold, 8.5);
          qticks(E, rC, 2, QCOL.gold, 8.5);
          // [2.0 수정] 접은 각은 C 쪽 ∠ECA, A 쪽 ∠EAC 는 평행선의 엇각입니다(원본 라벨은 서로 반대).
          qangle(rA, E, rC, QCOL.gold, 30, 1, '•(엇각)');
          qangle(rC, E, rA, QCOL.gold, 30, 1, '•(접은각)');
          qangle(rC, rA, rB, QCOL.gold, 30, 1, '•(∠BCA)'); // [표시 보강] 설명의 ∠ECA = ∠BCA = ● : 접히기 전 ∠BCA 도 같은 ●

          [rA, rB, rC, rD].forEach((p, i) => qdot(p, 'ABCD'[i], QCOL.white, center));
          qdot(B_cur, "B'(접힌 점)", QCOL.cyan, center);
          qdot(E, 'E(EA=EC 이등변!)', QCOL.gold, null, { x: 0, y: 22 });
        } else if (sub === 'foldVertexToVertex') {
          const halfW = (rD.x - rA.x) / 2, halfH = (rB.y - rA.y) / 2;
          const dx = (halfH * halfH) / halfW;
          const E = qpt(cx + dx, rA.y), F = qpt(cx - dx, rB.y);
          const O = qmid(rA, rC);
          const C_fold = qlerp(rC, rA, Math.max(0.15, t));

          qpoly([rA, rB, rC, rD], 'rgba(56, 189, 248, 0.08)', 'rgba(148, 163, 184, 0.5)', 2.2);
          qpoly([rA, E, rC, F], 'rgba(251, 191, 36, 0.28)', QCOL.gold, 3.4, 0);
          qpoly([E, C_fold, F], 'rgba(244, 114, 182, 0.24)', QCOL.pink, 2.6, 1);
          qline(rA, rC, QCOL.cyan, 2.5, [5, 4], false, 1);
          qline(E, F, QCOL.pink, 3.6, [], true, 1);
          qright(O, rC, E, 13, QCOL.pink);
          qticks(rA, E, 1, QCOL.gold, 7.5); qticks(E, rC, 1, QCOL.gold, 7.5);
          qticks(rC, F, 1, QCOL.gold, 7.5); qticks(F, rA, 1, QCOL.gold, 7.5);

          [rA, rB, rC, rD].forEach((p, i) => qdot(p, 'ABCD'[i], QCOL.white, center));
          qdot(E, 'E', QCOL.pink, null, { x: 0, y: -14 });
          qdot(F, 'F', QCOL.pink, null, { x: 0, y: 22 });
          qdot(O, 'O(EF⊥AC)', QCOL.cyan, null, { x: 14, y: 14 });
        } else if (sub === 'squarePerpLines') {
          const hs = 104 * s;
          const a = qpt(cx - hs, cy - hs), b = qpt(cx - hs, cy + hs), c = qpt(cx + hs, cy + hs), d = qpt(cx + hs, cy - hs);
          const E = qlerp(b, c, 0.38), F = qlerp(c, d, 0.38);
          const P = qintersect(a, E, b, F);

          qpoly([a, b, c, d], 'rgba(100, 116, 139, 0.10)', QCOL.white, 2.6);
          qpoly([a, b, E], 'rgba(56, 189, 248, 0.32)', QCOL.cyan, 3.2, 0);
          qpoly([b, c, F], 'rgba(251, 191, 36, 0.32)', QCOL.gold, 3.2, 1);
          qright(b, a, c, 12, QCOL.cyan);
          qright(c, b, d, 12, QCOL.gold);
          qright(P, a, b, 12, QCOL.pink);
          qangle(a, b, E, QCOL.cyan, 28, 1, '•');
          qangle(b, c, F, QCOL.gold, 28, 1, '•');
          qangle(b, P, a, QCOL.pink, 24, 2, '×');
          // [표시 보강] 합동의 대응변: AB = BC(|), BE = CF(||), AE = BF(|||)
          qticks(a, b, 1, QCOL.white, 8); qticks(b, c, 1, QCOL.white, 8);
          qticks(b, E, 2, QCOL.cyan, 8); qticks(c, F, 2, QCOL.gold, 8);
          qticks(a, E, 3, QCOL.cyan, 8); qticks(b, F, 3, QCOL.gold, 8);

          if (t > 0.01) {
            ctx.save();
            ctx.translate(cx, cy);
            ctx.rotate((-t * Math.PI) / 2);
            ctx.translate(-cx, -cy);
            qpoly([a, b, E], 'rgba(244, 114, 182, 0.40)', QCOL.pink, 3.0, 0);
            ctx.restore();
          }

          [a, b, c, d].forEach((p, i) => qdot(p, 'ABCD'[i], QCOL.white, center));
          qdot(E, 'E', QCOL.cyan, null, { x: -6, y: 20 });
          qdot(F, 'F(AE=BF)', QCOL.gold, null, { x: 14, y: 4 });
          qdot(P, 'P(90°)', QCOL.pink, null, { x: 14, y: -6 });
        } else if (sub === 'squareInnerRot') {
          const hs = 92 * s, side = 1.65 * hs;
          const a = qpt(cx - hs, cy - hs), b = qpt(cx - hs, cy + hs), c = qpt(cx + hs, cy + hs), d = qpt(cx + hs, cy - hs);
          const uRatio = 0.25 + 0.45 * t;
          const E = qlerp(b, c, uRatio), F = qlerp(c, d, uRatio);
          const angRot = Math.atan2(E.y - cy, E.x - cx);
          const uVec = qpt(Math.cos(angRot), Math.sin(angRot));
          const vVec = qpt(Math.cos(angRot - Math.PI / 2), Math.sin(angRot - Math.PI / 2));
          const P1 = qadd(center, qmul(uVec, side)), P3 = qadd(center, qmul(vVec, side));
          const P2 = qadd(P1, qmul(vVec, side));

          qpoly([a, b, c, d], 'rgba(56, 189, 248, 0.12)', QCOL.cyan, 2.8);
          qpoly([center, P1, P2, P3], 'rgba(251, 191, 36, 0.08)', QCOL.gold, 2.2);
          qpoly([center, b, E], 'rgba(251, 191, 36, 0.36)', QCOL.gold, 2.8, 0);
          qpoly([center, c, F], 'rgba(56, 189, 248, 0.36)', QCOL.cyan, 2.8, 0);
          qpoly([center, E, c, F], 'rgba(52, 211, 153, 0.48)', QCOL.green, 3.4, 1);

          qline(a, c, 'rgba(255,255,255,0.35)', 1.6, [4, 4]);
          qline(b, d, 'rgba(255,255,255,0.35)', 1.6, [4, 4]);
          qright(center, E, F, 12, QCOL.green);
          // [표시 보강] △OEB ≡ △OFC: OB = OC, BE = CF 눈금, ∠OBE = ∠OCF = 45°, ∠BOE = ∠COF(●)
          qticks(center, b, 1, QCOL.white, 8); qticks(center, c, 1, QCOL.white, 8);
          qticks(b, E, 2, QCOL.gold, 8); qticks(c, F, 2, QCOL.cyan, 8);
          qangle(b, center, E, QCOL.gold, 30, 1, '45°');
          qangle(c, center, F, QCOL.cyan, 30, 1, '45°');
          qangle(center, b, E, QCOL.pink, 40, 1, '•');
          qangle(center, c, F, QCOL.pink, 40, 1, '•');

          [a, b, c, d].forEach((p, i) => qdot(p, 'ABCD'[i], QCOL.white, center));
          qdot(center, 'O(중심 90°)', QCOL.gold, null, { x: -42, y: -12 });
          qdot(E, 'E', QCOL.gold, null, { x: 0, y: 20 });
          qdot(F, 'F(넓이 ¼ 불변!)', QCOL.cyan, null, { x: 16, y: 0 });
        } else {
          // squareEquiTri (정사각형 ABCD + 정삼각형 △EBC ➔ 75° · 150° 각도 킬러!)
          const hs = 108 * s, side = 2 * hs;
          const a = qpt(cx - hs, cy - hs), b = qpt(cx - hs, cy + hs), c = qpt(cx + hs, cy + hs), d = qpt(cx + hs, cy - hs);
          const E = qpt(cx, cy + hs - (side * Math.sqrt(3)) / 2);

          qpoly([a, b, c, d], 'rgba(148, 163, 184, 0.10)', QCOL.white, 2.6);
          qpoly([E, b, c], 'rgba(52, 211, 153, 0.28)', QCOL.green, 3.2, 0);
          qpoly([a, b, E], 'rgba(251, 191, 36, 0.34)', QCOL.gold, 3.0, 1);
          qpoly([d, c, E], 'rgba(251, 191, 36, 0.34)', QCOL.gold, 3.0, 1);
          qpoly([a, E, d], 'rgba(244, 114, 182, 0.28)', QCOL.pink, 3.0, 2);

          qticks(a, b, 2, QCOL.gold, 8);
          qticks(b, c, 2, QCOL.green, 8);
          qticks(c, d, 2, QCOL.gold, 8);
          qticks(b, E, 2, QCOL.gold, 8);
          qticks(c, E, 2, QCOL.gold, 8);

          qangle(b, E, a, QCOL.gold, 34, 1, '30°');
          qangle(b, c, E, QCOL.green, 28, 1, '60°');
          qangle(a, b, E, QCOL.gold, 28, 1, '75°');
          qangle(E, a, b, QCOL.gold, 28, 1, '75°');
          qangle(E, d, a, QCOL.pink, 24, 2, '150°!');

          [a, b, c, d].forEach((p, i) => qdot(p, 'ABCD'[i], QCOL.white, center));
          qdot(E, 'E(AB=BC=BE!)', QCOL.gold, null, { x: 0, y: -16 });
        }
      }

      // =====================================================================
      // [모드 6] 가짜 조건 반례 연구소 (등변사다리꼴 · 연꼴 · 한쪽 이등분)
      // =====================================================================
      else {
        const center = qpt(cx, cy);
        if (sub === 'counterIsoTrap' || sub === 'counterDiagEqual') {
          const topW = 96 * s, botW = 220 * s, h = 115 * s;
          const pA = qpt(cx - topW / 2, cy - h / 2), pD = qpt(cx + topW / 2, cy - h / 2);
          const pB = qpt(cx - botW / 2, cy + h / 2), pC = qpt(cx + botW / 2, cy + h / 2);
          const mAC = qmid(pA, pC), mBD = qmid(pB, pD), pO = qintersect(pA, pC, pB, pD);

          qpoly([pA, pB, pC, pD], 'rgba(244, 63, 94, 0.20)', QCOL.red, 3.5, 2);
          qarrows(pA, pD, 1, QCOL.cyan, 7.5);
          qarrows(pB, pC, 1, QCOL.cyan, 7.5);
          qticks(pA, pB, 1, QCOL.gold, 8.5);
          qticks(pD, pC, 1, QCOL.gold, 8.5);

          qline(pA, pC, QCOL.gold, 2.8, [5, 4], false, 0);
          qline(pB, pD, QCOL.gold, 2.8, [5, 4], false, 0);
          qline(mAC, mBD, QCOL.red, 3.6, [], true, 1);
          if (sub === 'counterDiagEqual') { qticks(mAC, pC, 2, QCOL.gold, 8.5); qticks(mBD, pB, 2, QCOL.gold, 8.5); } // [표시 보강] AC = BD (두 대각선의 길이가 같음): 중점 M·N 점과 교점 O 에 가려지지 않게 M–C, N–B 의 중간(대각선의 3/4 지점)에

          qdot(pO, 'O(OA≠OC)', QCOL.white, null, { x: 0, y: -14 });
          // [2.0 수정] 원본 오프셋(M: -48, N: +48)은 두 이름표가 두 점 사이 가운데에서 겹쳐 어느 점의 이름인지 알기 어려웠습니다 → 각 이름표를 자기 점의 바깥 아래쪽으로
          qdot(mAC, 'M(AC중점)', QCOL.gold, null, { x: 8, y: 18 });
          qdot(mBD, 'N(BD중점)', QCOL.cyan, null, { x: -58, y: 18 });
          [pA, pB, pC, pD].forEach((p, i) => qdot(p, 'ABCD'[i], QCOL.white, center));
        } else {
          // counterKite, counterHalfBisect, counterFakeRhomb (연꼴 Kite 반례!)
          const pO = qpt(cx, cy - 18 * s);
          // [2.0 수정] 반례5(알파벳 순서 함정)는 '이웃한 변끼리 같음: AB=BC, CD=DA'를 다루는데 원본 그림은 AB=AD, CB=CD 로 틱이 찍혀 해설과 달랐습니다.
          // 이 장면만 꼭짓점 이름을 돌려 AB=BC(|), CD=DA(||) 가 되게 그리고, 그림에 맞지 않는 O의 이등분 문구는 뺍니다.
          const fake = sub === 'counterFakeRhomb';
          const pT = qpt(cx, cy - 102 * s), pBm = qpt(cx, cy + 98 * s), pL = qpt(cx - 95 * s, pO.y), pR = qpt(cx + 95 * s, pO.y);
          const [pA, pB, pC, pD] = fake ? [pL, pT, pR, pBm] : [pT, pL, pBm, pR];

          qpoly([pA, pB, pC, pD], 'rgba(244, 63, 94, 0.20)', QCOL.red, 3.5, 2);
          qline(pA, pC, QCOL.gold, 2.8, [], false, 1);
          qline(pB, pD, QCOL.cyan, 2.8, [], false, 0);
          qright(pO, pA, pD, 13, QCOL.white);

          if (fake) {
            qticks(pA, pB, 1, QCOL.gold, 8); qticks(pB, pC, 1, QCOL.gold, 8);
            qticks(pC, pD, 2, QCOL.pink, 8); qticks(pD, pA, 2, QCOL.pink, 8);
          } else {
            qticks(pA, pB, 1, QCOL.gold, 8); qticks(pA, pD, 1, QCOL.gold, 8);
            qticks(pC, pB, 2, QCOL.pink, 8); qticks(pC, pD, 2, QCOL.pink, 8);
            qticks(pB, pO, 3, QCOL.cyan, 7); qticks(pO, pD, 3, QCOL.cyan, 7);
          }

          qdot(pO, fake ? 'O' : 'O(OB=OD 이지만 OA≠OC!)', QCOL.gold, null, { x: 14, y: 18 });
          [pA, pB, pC, pD].forEach((p, i) => qdot(p, 'ABCD'[i], QCOL.white, pO));
        }
      }
    }


  /* ===== 원본 그대로: 효과 없는 렌즈 버튼 숨김 표 (원본 2094–2099행) ===== */
    const LENS_OFF = {
      paraDiag: ['sides'], quadToTri: ['angles'], equiSlide: ['angles'], butterflyWing: ['angles'],
      insidePointP: ['angles', 'sides', 'aux'], paraHeightSplit: ['angles'], varignonGen: ['angles', 'sides', 'aux'],
      varignonRectToRhomb: ['sides'], varignonIsoToRhomb: ['sides'], varignonRhombToRect: ['angles'],
      squarePerpLines: ['angles'], squareInnerRot: ['angles']
    };


  /* ======================================================================
     2.0 셸 연결 (새로 작성한 부분)
     ====================================================================== */
  const TABS = ['평행사변형 성질·5대 판정', '사각형 족보 진화 & 등변사다리꼴', '등적변형 · 나비 넓이 · 내부 점 P', '중점연결 바리뇽 (직사각↔마름모)', '종이접기 & 정사각형 회전·정삼각형', '가짜 조건 반례 연구소 (오답 1위)'];
  const SHORT = ['평행사변형', '족보 진화', '등적변형', '중점연결', '종이접기', '반례'];
  const LENSES = [
    ['all', '🔍 전체 구조'],
    ['angles', '📐 각도·평행(•,×,∟,>>)'],
    ['sides', '📏 변·대각선(|,||)'],
    ['aux', '🪄 보조선·합동추적']
  ];
  // 이 장면에서 '변환(0→100%)'이 실제로 그림을 바꾸는 장면만 변환 조절을 보여 줍니다(원본 그리기 코드의 t 사용처).
  const FOLD = new Set(['paraDefSides', 'paraAngles', 'paraDiag', 'paraCond5', 'isoTrapMaster', 'evoRect', 'evoRhombus', 'evoSquare',
    'quadToTri', 'equiSlide', 'insidePointP', 'paraHeightSplit', 'varignonGen', 'varignonRectToRhomb', 'varignonIsoToRhomb', 'varignonRhombToRect',
    'varignonSquareToSquare', 'foldTape', 'foldVertexToVertex', 'squarePerpLines', 'squareInnerRot']);
  // 각 프리셋(60·70·90·110°)이 실제로 그림을 바꾸는 장면(탐구 1의 다섯 장면 = 꼭짓점 B의 내각, 대각선 조합기 = 대각선 교각 θ)과 대각선비 프리셋이 쓰이는 장면
  const ANG_NAME = { paraDefSides: '평행사변형의 모양: ∠B', paraAngles: '평행사변형의 모양: ∠B', paraDiag: '평행사변형의 모양: ∠B', paraCond5: '평행사변형의 모양: ∠B', paraHidden: '평행사변형의 모양: ∠B', diagSynthesis: '대각선 교각 θ' };
  const RATIO_USED = new Set(['diagSynthesis']);
  const THUMB_T = (id) => (FOLD.has(id) ? 1 : 0); // 원본: 장면에 들어가면 변환이 100%로 자동 재생

  const lensList = (m, id) => {
    const off = (LENS_OFF[m] || []).concat(LENS_OFF[id] || []);
    const rest = ['angles', 'sides', 'aux'].filter((x) => !off.includes(x));
    return rest.length ? ['all'].concat(rest) : []; // 원본 syncLensButtons: 효과 있는 렌즈가 하나도 없으면 렌즈 전체를 숨김
  };
  function sync(s, m, id) {
    state.mode = m;
    state.subType[m] = id;
    state.fold = s.fold;
    state.angPreset = Math.round(s.ang);
    state.ratioPreset = s.ratio;
    state.activePartIdx = s.part == null ? -1 : s.part;
    state.conceptSwitch = lensList(m, id).includes(s.lens) ? s.lens : 'all';
    state.customDOffset = id === 'paraDiag' && (s.dx || s.dy) ? { dx: s.dx / 1.08, dy: s.dy / 1.08 } : null; // 원본은 (오프셋 × 배율)로 더함
    state.scale = 1;
  }
  // 셸은 이모지(➔ ⭕ ❌ 포함)를 화면 표시에서 떼어 내므로, 문장 속 뜻이 사라지지 않게 → ○ × 로 미리 바꿔 넘깁니다(원문 getSpec은 그대로).
  const arrow = (v) => (typeof v === 'string' ? v.replace(/➔/g, '→').replace(/⭕/g, '○').replace(/❌/g, '×') : Array.isArray(v) ? v.map(arrow) : v && typeof v === 'object' ? Object.fromEntries(Object.entries(v).map(([k, x]) => [k, arrow(x)])) : v);
  // [2.0 수정] 요약 띠의 칸 글자는 한 줄이라 휴대폰(390px)에서 길면 말줄임으로 잘렸습니다(탐구 1-D, 탐구 4의 5장면).
  // 칸 글자만 줄이고, 전체 문장은 띠 위의 제목(tapeTitle, 줄바꿈됨)에 그대로 있습니다.
  const TAPE_SHORT = {
    'AB: 평행(>>) + 길이 같음(|) 동시 만족!': 'AB: 평행(>>)·같음(|)',
    'CD: 평행(>>) + 길이 같음(|) 동시 만족!': 'CD: 평행(>>)·같음(|)',
    '안쪽 중점사각형 □PQRS (50%)': '안쪽 □PQRS (50%)',
    '바깥 4귀퉁이 삼각형 합 (50% → 접으면 완전히 포개짐!)': '바깥 귀퉁이 합 (50%)'
  };
  let booted = false;

  function sceneOf(m, it) {
    const id = it.id;
    const label = arrow(it.label).replace(/^[▭❖]\s*/, ''); // 장면 이름 앞의 ▭ ❖ 는 글꼴에 따라 깨진 네모로 보여 뗍니다
    return {
      id, title: label, short: label, reviewTab: true, autoFit: true,
      notesTitle: '시험장 오답 함정 & 3초 직관',
      enter: (s, lab) => {
        // 원본 setMode / setSubType: 변환을 0%로 되돌리고 D 끌기를 지운 뒤 100%로 자동 재생
        s.fold = 0;
        s.dx = null;
        s.dy = null;
        if (!lensList(m, id).includes(s.lens)) s.lens = 'all';
        const shared = !booted && /[#&]fold=/.test(location.hash); // 공유 링크의 값은 그대로 존중
        booted = true;
        if (lab && s === lab.s && FOLD.has(id) && !shared) lab.tween({ fold: 1 }, 1300);
      },
      controls: () => (FOLD.has(id) ? ['fold'] : []),
      presets: () => {
        const out = [];
        if (ANG_NAME[id]) ANG_PRESETS.forEach((v) => out.push({ group: ANG_NAME[id], label: id === 'diagSynthesis' && v === 90 ? '90°(⊥)' : `${v}°`, apply: (st) => { st.ang = v; }, on: (st) => Math.round(st.ang) === v }));
        if (RATIO_USED.has(id)) RATIO_PRESETS.forEach((rp0) => out.push({ group: '대각선 길이비 BD/AC', label: rp0.label, apply: (st) => { st.ratio = rp0.val; }, on: (st) => Math.abs(st.ratio - rp0.val) < 0.01 }));
        const lenses = lensList(m, id);
        if (lenses.length) LENSES.filter(([k]) => lenses.includes(k)).forEach(([k, label]) => out.push({ group: '관찰 렌즈', label, apply: (st) => { st.lens = k; }, on: (st) => st.lens === k }));
        if (FOLD.has(id)) [0, 0.5, 1].forEach((v) => out.push({ group: '변환 단계', label: v === 0 ? '0% 시작' : v === 1 ? '100% 완성' : '50%', set: { fold: v }, ms: 700, on: (st) => Math.abs(st.fold - v) < 0.01 }));
        return out;
      },
      actions: () => {
        const out = [];
        if (id === 'diagSynthesis') {
          // 원본 toggleFoldAnim: 평행사변형 → 직사각형 → 마름모 → 정사각형 → 평행사변형 순서로 조건을 바꿔 봅니다
          out.push({
            id: 'act', primary: true, icon: 'wand',
            label: (st) => { sync(st, m, id); return getSpec().actionTxt; },
            run: (st) => {
              if (st.ang !== 90 && st.ratio !== 1.0) st.ratio = 1.0;
              else if (st.ang !== 90 && st.ratio === 1.0) { st.ang = 90; st.ratio = 0.75; }
              else if (st.ang === 90 && st.ratio !== 1.0) { st.ang = 90; st.ratio = 1.0; }
              else { st.ang = 70; st.ratio = 0.75; }
            }
          });
        } else if (FOLD.has(id)) {
          out.push({
            id: 'act', play: true, primary: true, icon: 'wand',
            label: (st) => { sync(st, m, id); return getSpec().actionTxt; },
            run: (st, lab) => { lab.tween({ fold: st.fold > 0.5 ? 0 : 1 }, 1100); }
          });
        }
        if (id === 'paraDiag') out.push({ id: 'snapD', icon: 'target', label: 'D점 스냅 (평행사변형으로 되돌리기)', run: (st) => { st.dx = null; st.dy = null; } });
        return out;
      },
      view: (s) => {
        sync(s, m, id);
        const spec = arrow(getSpec());
        const wide = (t) => String(t).length > 14;
        return {
          guide: `<div style="font-weight:800;margin-bottom:6px">${APLab.esc(APLab.stripEmoji(spec.badge))}</div>${spec.hint}`,
          readouts: [
            { label: spec.dim1Name, value: spec.val1Txt, color: 'sky', wide: wide(spec.val1Txt) },
            { label: spec.dim2Name, value: spec.val2Txt, color: 'rose', wide: wide(spec.val2Txt) }
          ],
          parts: spec.parts.map((p) => ({ id: p.id, name: p.name, desc: p.desc, value: p.val, color: p.ok === false ? 'red' : p.color, ok: p.ok })),
          summary: spec.totalRes,
          rule: spec.rule,
          formula: spec.formulaHTML,
          notes: spec.notes,
          tape: { title: spec.tapeTitle, segments: spec.tapeSegs.map((sg) => ({ ...sg, text: TAPE_SHORT[sg.text] || sg.text })) }
        };
      },
      draw: (b, s, v) => {
        BOARD = b;
        CUR = s;
        const paint = (st) => {
          sync(st, m, id);
          XF.m = IDENT;
          XF.stack = [];
          if (st.grid) b.grid({ step: 38 });
          // 두 번 훑기: 1회 점 위치 수집 → 2회 그리기(이름표가 점·다른 이름표와 겹치지 않게 놓음)
          PL.obst = [];
          PL.placed = [];
          PL.pass = 1;
          drawQuadMasterScene(0, 0, state.fold, null);
          PL.pass = 2;
          PL.placed = [];
          drawQuadMasterScene(0, 0, state.fold, null);
          XF.m = IDENT;
          XF.stack = [];
        };
        // 자동 맞춤을 재는 중: 변환 진행(0·25·50·75·100%)과 모든 각·대각선비 프리셋 상태를 겹쳐 그려, 어느 상태에서도 그림·글자가 잘리지 않는 범위를 구합니다.
        const paintAll = () => {
          (FOLD.has(id) ? [0, 0.25, 0.5, 0.75, 1] : [s.fold]).forEach((f) => (ANG_NAME[id] ? ANG_PRESETS : [s.ang]).forEach((a) => (RATIO_USED.has(id) ? RATIO_PRESETS.map((r) => r.val) : [s.ratio]).forEach((r) => paint({ ...s, fold: f, ang: a, ratio: r }))));
        };
        if (b._bbox) { paintAll(); return; }
        if (b.thumb) { // 모든 장면 미리보기: 장면 범위를 직접 재어 맞추고, 원본의 '완성' 상태로 그림
          const bb = b.measure(paintAll);
          if (bb) b.focus = b.fitBox(bb, { margin: 0.08, px: 5 });
          paint({ ...s, fold: THUMB_T(id), part: null });
          return;
        }
        paint(s);
      }
    };
  }

  const groups = Object.keys(SUB_MENUS).map((k) => {
    const m = +k;
    return { id: 'm' + m, title: TABS[m - 1], short: SHORT[m - 1], scenes: SUB_MENUS[m].map((it) => sceneOf(m, it)) };
  });

  APLab.createLab({
    id: 'g8-quadrilaterals',
    title: '사각형 경험도감',
    courseName: '중2',
    unit: '사각형의 성질 · 등적변형',
    courseColor: 'var(--m-sky)',
    home: '../index.html#g8',
    legacy: '../../labs/g8/quadrilaterals-atlas.html',
    board: { kind: 'figure', autoFit: true, minZoom: 0.4, maxZoom: 5 },
    state: { lens: 'all', dx: null, dy: null },
    persist: ['lens', 'dx', 'dy'],
    params: {
      fold: { value: 0, min: 0, max: 1, step: 0.005, color: 'amber', label: '변환 진행 (0% → 100%)', hint: '회전 포개기 · 등적 이동 · 귀퉁이 접기 · 종이접기 같은 변환을 천천히 확인합니다', format: (v) => `${Math.round(v * 100)}%` },
      ang: { value: 70, min: 60, max: 110, step: 1, color: 'sky', label: '각 (∠B 또는 대각선 교각 θ)', format: (v) => `${Math.round(v)}°` },
      ratio: { value: 0.75, min: 0.65, max: 1.25, step: 0.01, color: 'rose', label: '대각선비 BD/AC', format: (v) => v.toFixed(2) }
    },
    groups
  });
});
