<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a100e">
<title>점 · 직선 · 반직선 · 선분 · 각 · AP Math 실험실</title>
<meta name="description" content="중1 기본 도형: 교점과 교선, 직선·반직선·선분의 개수, 중점과 거리, 시계의 각, 맞꼭지각, 수직과 수선을 도형을 직접 조절하며 탐구하고 5지선다 문제로 확인합니다.">
<script>try{var t=localStorage.getItem('apl:theme');t=t?JSON.parse(t):'paper';document.documentElement.setAttribute('data-theme',t==='board'?'board':'paper')}catch(e){document.documentElement.setAttribute('data-theme','paper')}</script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="../kit/vendor/katex/katex.min.css">
<link rel="stylesheet" href="../kit/apl.css">
<script defer src="../kit/vendor/katex/katex.min.js"></script>
<script defer src="../kit/vendor/qrcode.js"></script>
<script defer src="../kit/apl-core.js"></script>
<script defer src="../kit/apl-board.js"></script>
<script defer src="../kit/apl-shell.js"></script>
</head>
<body>
<noscript>이 실험실을 보려면 브라우저에서 자바스크립트를 켜야 합니다.</noscript>
<script>
/* ==========================================================================
   중1 · 기본 도형 (AP Math Lab 2.0) — 점 · 직선 · 반직선 · 선분 · 각
   이 파일은 작은 쪽입니다. 탭은 labs/g7-points-lines/*.js 모듈이 window.APL_PL_GROUPS 에
   { order, id, title, short, params?, scenes } 묶음을 등록하면 order 순으로 붙습니다. 아직 없는 모듈 파일은 건너뜁니다.
     common.js   공통 도우미(장면 틀·문제 틀·그리기 도우미)
     solids.js   ① 점·선·면, 교점·교선 (order 10)
     lines.js    ② 직선·반직선·선분 (order 20)
     mid.js      ③ 중점과 거리 (order 30)
     angles.js   ④ 시계의 각 · ⑤ 맞꼭지각 · ⑥ 수직과 수선 (order 40·50·60)
   원칙(학생 가독성)
   - 모든 도형은 막대 또는 끌 수 있는 점(후광이 있는 점)으로 조절되고, 라벨·식·정리 단계·정답이 그 값으로 다시 계산됩니다.
   - 색의 역할: 하늘=선·도형 · 노랑=끌 수 있는 점·조작 · 분홍=비교·다른 것 · 초록=구하는 값·결과
   - 길이와 각은 그림 안에 크게 씁니다. 같은 각은 같은 표시, 직각은 네모, 같은 길이는 짧은 줄 표시.
   - 움직임은 가로로만(회전은 제자리에서만).
   ========================================================================== */
window.addEventListener('DOMContentLoaded', function () {
'use strict';
window.APL_PL_GROUPS = window.APL_PL_GROUPS || [];
const MODULES = ['common', 'solids', 'lines', 'mid', 'angles'];
const CANON_VIEW = { x: [-5, 5], y: [-4, 4] }; // 장면에 들어올 때마다 같은 처음 상태에서 맞춤을 잽니다
const loadScript = (src) => new Promise((res) => {
  const el = document.createElement('script');
  el.src = src; el.async = false;
  el.onload = () => res(true);
  el.onerror = () => { el.remove(); res(false); }; // 아직 없는 모듈은 건너뜁니다
  document.head.append(el);
});

function start() {
  const mods = window.APL_PL_GROUPS.filter((g) => g && Array.isArray(g.scenes) && g.scenes.length);
  const groups = mods.slice().sort((a, b) => (a.order || 0) - (b.order || 0)).map((g) => ({ id: g.id, title: g.title, short: g.short || g.title, scenes: g.scenes }));
  const params = {};
  mods.forEach((g) => Object.assign(params, g.params || {}));
  APLab.createLab({
    id: 'g7-points-lines',
    title: '점 · 직선 · 반직선 · 선분 · 각',
    courseName: '중1',
    unit: '기본 도형',
    courseColor: 'var(--m-sky)',
    home: '../index.html#g7',
    legacy: '../../labs/g7/points-lines.html',
    board: { kind: 'figure', autoFit: true, pad: 0.02, minZoom: 0.5, maxZoom: 6, grid: false },
    // 어느 장면에서 오든 같은 맞춤이 되도록, 장면에 들어갈 때 화면 범위를 처음 상태로 되돌립니다(작은 그림 만들 때는 제외).
    enter: (s, sc, lab) => { if (lab && lab.board && s === lab.s) { lab.board.setFocus(CANON_VIEW, true); lab.board.setPanes(null); lab.board.onPanDrag = null; } },
    params,
    groups
  });
}
Promise.all(MODULES.map((m) => loadScript(`g7-points-lines/${m}.js`))).then(start);
});
</script>
</body>
</html>
