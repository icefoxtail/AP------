<body>

<script>
/* ==========================================================================
   중1 · 입체도형의 겉넓이와 부피 (AP Math Lab 2.0 이식본) — 4개 탐구관 × 18개 장면
   원본: labs/g7/입체도형의 겉넓이와 부피.html
   이식 방식: "호환 이식" — 원본의 내용(getSpec)과 3D 그리기 코드(renderTab1~4, project3D, draw3D…)를 글자 그대로 옮기고,
   원본이 캔버스에 직접 그리던 부분(ctx)만 아래 얇은 겉포장이 무대 캔버스·테마 색에 연결합니다.
   - 탐구관 → 묶음(탭), 세부 도형 → 장면. 치수 r·h 단추, 진행 슬라이더(적층·물붓기·합체), 관찰 렌즈, 시점 단추는 조작부로 옮겼습니다.
   - 아래쪽 "겉넓이/부피 조각 조립식" 띠는 무대 아래 별도 줄(테이프)로, 우측 2D 설계도 상자는 넓은 화면에서만 그림 오른쪽에 둡니다.
   - 빈 곳을 끌면 회전(무대 공통), 두 손가락·휠로 확대. 자동 회전은 조작부의 단추로.
   - 해설의 ➔ ❌ ⭕ 는 화면에서 → × ○ 로 바꿔 보여 줍니다(셸이 이모지를 떼어 내므로 뜻이 사라지지 않게).
   [2.0 수정] 코드 안에 같은 표시가 있습니다.
     ① 고정 배율(약 46~52px) → 도형을 감싸는 상자에 맞춘 자동 배율·중심(넓은 화면에서도 그림이 작지 않고, 돌려도 크기가 변하지 않음)
     ② 그림·해설에 아무 영향이 없던 조작(진행도 슬라이더·단계·실행 단추, 치수 단추, 관찰 렌즈)은 해당 장면에서 숨김(장면마다 값을 바꿔 그려 보고 가려냄)
     ③ 좁은 화면에서 가장자리 이름표가 잘리지 않게 무대 안쪽으로 밀어 넣음
     ④ 2D 설계도 상자: 무대 폭 640px 이상은 그림 오른쪽 위에(원본은 520px 이상), 그보다 좁은 화면(휴대폰)은 오른쪽 위 「2D 설계도 보기」 단추로
        상자를 무대 전체로 키워 보여 줌(원본은 상자를 숨겨 해설이 가리키는 그림을 볼 수 없었음). 해설의 '우측 상단 2D …' 문장은 휴대폰에서 단추 안내가 덧붙음
   ========================================================================== */
window.addEventListener('DOMContentLoaded', function () {
  const tex = APLab.tex;
  const { clamp } = APLab;
  const R2D = 180 / Math.PI, D2R = Math.PI / 180;

  /* ===== 원본 상태 객체(이름 그대로) — 매 프레임 2.0 셸 상태에서 채웁니다 ===== */
    const state = {
      mode: 1,
      sub: { 1: 'unitCube', 2: 'pour3to1', 3: 'archimedes', 4: 'doubleCone' },
      lens: 'all',       // 'all' | 'area' | 'vol' | 'hidden'
      dualView: true,
      activePartIdx: -1,
      r: 3,
      h: 4,
      animProg: 1.0,
      yaw: (-32 * Math.PI) / 180,
      pitch: (28 * Math.PI) / 180
    };

  /* ===== 원본 그대로: 장면 목록 ===== */
    const SUB_MENUS = {
      1: [
        { id: 'unitCube', label: '🧱 1cm³ 정육면체 쌓기와 겉넓이' },
        { id: 'layerElevator', label: '🥞 기둥의 부피(V=Sh)' },
        { id: 'cylinderFactor', label: '🛢️ 원기둥의 겉넓이 2πr(r+h)' },
        { id: 'sectorPillar', label: '🍰 부채꼴기둥의 겉넓이' }
      ],
      2: [
        { id: 'pour3to1', label: '💧 기둥과 뿔의 부피의 비 3:1(물 붓기)' },
        { id: 'coneFactor', label: '⛺ 원뿔의 겉넓이 πr(r+a)' },
        { id: 'partyHat', label: '🎩 챙 달린 고깔모자(밑면이 뚫림)' },
        { id: 'frustumCalc', label: '🪣 원뿔대의 겉넓이·부피(큰 원뿔 − 작은 원뿔)' }
      ],
      3: [
        { id: 'archimedes', label: '⚖️ 원뿔 : 구 : 원기둥의 부피의 비(1:2:3)' },
        { id: 'sphereOrange', label: '🍊 구의 겉넓이(원 4개의 넓이=4πr²)' },
        { id: 'hemisphere3', label: '🥣 반구의 겉넓이(2πr²+πr²=3πr²)' },
        { id: 'sphereCut8', label: '🍉 1/8을 잘라 낸 구(단면 3개가 드러남)' }
      ],
      4: [
        { id: 'doubleCone', label: '💎 원뿔 두 개를 붙인 입체(맞닿은 밑면 제외)' },
        { id: 'nestedCone', label: '🎪 원뿔 속을 원뿔 모양으로 판 입체(부피 −, 겉넓이 +)' },
        { id: 'rocket', label: '🚀 원뿔 + 원기둥 + 반구를 붙인 입체' },
        { id: 'drilled', label: '🧻 구멍을 뚫은 입체(안쪽 벽면 +)' },
        { id: 'cornerCut', label: '🔪 모퉁이를 잘라 낸 정육면체(겉넓이 변화 없음)' },
        { id: 'troughCut', label: '🪵 가운데에 홈을 판 정육면체(겉넓이 변화)' }
      ]
    };


  /* ===== 원본 그대로: 장면별 수학 데이터 생성기 getSpec ===== */
    function getSpec() {
      const m = state.mode;
      const sub = state.sub[m];
      const r = state.r;
      const h = state.h;

      // ==================== [탭 1: 단위큐브(1cm³) & 기둥 겉넓이·부피 4종] ====================
      if (m === 1) {
        if (sub === 'unitCube') {
          const A = r, B = Math.max(2, r - 1), H = h;
          const baseArea = A * B;
          const perim = 2 * (A + B);
          const latArea = perim * H;
          const totalS = 2 * baseArea + latArea;
          const totalV = baseArea * H;
          const curCubes = Math.max(1, Math.round(state.animProg * totalV));
          return {
            badge: `탐구 1-A · 🧱 1cm³ 단위 정육면체 층별 쌓기 (현재 ${curCubes}개 / 총 ${totalV}개)`,
            hint: `슬라이더를 움직여 가로 ${A}cm, 세로 ${B}cm인 바닥에 <strong class="text-sky-300">1cm³ 단위 정육면체</strong>를 쌓아 올려보세요! 1층에 <strong class="text-amber-300">${A}×${B}=${baseArea}개</strong>씩 <strong class="text-pink-300">${H}층</strong>이 쌓여 부피는 <strong class="text-emerald-300">${totalV}cm³</strong>가 됩니다!`,
            actionTxt: state.animProg > 0.5 ? '🎬 1개부터 다시 쌓아 올리기' : '🎬 1cm³ 정육면체로 가득 채우기',
            dim1Name: '가로 a (세로 b = a-1)', dim2Name: '쌓는 층수(높이) h',
            surfaceParts: [
              { id: 0, name: `🟡 위·아래 두 밑면 넓이 합 (2 × 밑넓이)`, desc: `(${A} × ${B}) × 2개`, val: `+${2 * baseArea} cm²`, color: '#fbbf24', included: true },
              { id: 1, name: `🔵 앞·뒤 옆면 2개 넓이`, desc: `(${A} × ${H}) × 2개`, val: `+${2 * A * H} cm²`, color: '#38bdf8', included: true },
              { id: 2, name: `🩷 왼·오른 옆면 2개 넓이`, desc: `(${B} × ${H}) × 2개`, val: `+${2 * B * H} cm²`, color: '#f472b6', included: true }
            ],
            totalS: `${totalS} cm²`,
            volRule: `V = (1층 큐브 수 ${baseArea}개) × (${H}층) = ${totalV} cm³`,
            volHTML: `• <strong>기둥의 옆넓이</strong>: 옆면 4개를 따로 더하지 말고 <strong>(밑면의 둘레 ${perim}) × (높이 ${H}) = ${latArea} cm²</strong>로 한 번에 구하세요!<br/>• <strong>겉넓이</strong>: ${tex(`2\\times ${baseArea} + ${perim}\\times ${H} = \\mathbf{${totalS}\\text{ cm}^2}`)}`,
            totalV: `${totalV} cm³ (${totalV}개)`,
            notes: `• 부피의 단위 <strong>$1\\text{ cm}^3$</strong>는 가로·세로·높이가 모두 $1\\text{ cm}$인 정육면체 1개의 크기입니다. 부피를 구한다는 것은 이 정육면체가 몇 개 들어가는지 세는 것입니다!`,
            bars: [
              { label: `두 밑면(${2 * baseArea})`, len: `${2 * baseArea}`, weight: (2 * baseArea) / totalS, color: '#fbbf24' },
              { label: `옆넓이 합 = 둘레(${perim})×높이(${H}) = ${latArea}`, len: `${latArea}`, weight: latArea / totalS, color: '#38bdf8' }
            ]
          };
        }
        if (sub === 'layerElevator') {
          const baseA = r * r, vol = baseA * h;
          const curH = +(h * state.animProg).toFixed(1);
          return {
            badge: `탐구 1-B · 🥞 기둥의 부피 — 모든 기둥의 부피는 『밑넓이(S) × 높이(h)』`,
            hint: `밑면이 다각형이든 원이든, <strong class="text-amber-300">밑면과 같은 모양의 얇은 판(넓이 S)을 높이 h만큼 층층이 쌓아 올린 것</strong>이 기둥의 부피입니다! (현재 적층 높이: ${curH}cm)`,
            actionTxt: state.animProg > 0.5 ? '🎬 바닥(0cm)에서 다시 쌓기' : '🎬 끝까지 쌓아 올리기',
            dim1Name: '밑변 / 반지름 r', dim2Name: '기둥 높이 h',
            surfaceParts: [
              { id: 0, name: `🔵 사각기둥 밑넓이 S = ${r}×${r}`, desc: `높이 ${h}cm 적층 ➔ 부피 ${vol} cm³`, val: `S = ${baseA} cm²`, color: '#38bdf8', included: true },
              { id: 1, name: `🟢 원기둥 밑넓이 S = π×${r}²`, desc: `높이 ${h}cm 적층 ➔ 부피 ${vol}π cm³`, val: `S = ${baseA}π cm²`, color: '#34d399', included: true }
            ],
            totalS: `사각기둥 ${2 * baseA + 4 * r * h} cm² / 원기둥 ${2 * baseA + 2 * r * h}π cm²`,
            volRule: '모든 기둥의 부피 V = 밑넓이(S) × 높이(h)',
            volHTML: `• <strong>사각기둥 부피</strong>: ${tex(`V = S \\times h = ${baseA} \\times ${h} = \\mathbf{${vol}\\text{ cm}^3}`)}<br/>• <strong>원기둥 부피</strong>: ${tex(`V = \\pi r^2 h = ${baseA}\\pi \\times ${h} = \\mathbf{${vol}\\pi\\text{ cm}^3}`)}`,
            totalV: `${vol} cm³ / ${vol}π cm³`,
            notes: `• 모양이 삼각기둥이든 오각기둥이든 원기둥이든, <strong>위아래 단면이 끝까지 똑같이 유지되는 기둥</strong>의 부피는 <strong>(밑넓이) × (높이)</strong>입니다!`,
            bars: [
              { label: `밑넓이 S (${baseA} 또는 ${baseA}π)`, len: `S`, weight: 0.4, color: '#38bdf8' },
              { label: `× 높이 h (${h}cm 적층)`, len: `V = Sh`, weight: 0.6, color: '#34d399' }
            ]
          };
        }
        if (sub === 'cylinderFactor') {
          const base2 = 2 * r * r;
          const lat = 2 * r * h;
          const totalS = 2 * r * (r + h);
          const totalV = r * r * h;
          return {
            badge: `탐구 1-C · 🛢️ 원기둥의 겉넓이 — 공통인 2πr로 묶어 『S = 2πr(r + h)』`,
            hint: `밑넓이 2개(${base2}π)와 옆넓이(${lat}π)를 따로 구해서 더해도 되지만, 둘 다 <strong class="text-amber-300">2πr(=${2 * r}π)</strong>이 들어 있으므로 분배법칙으로 묶으면 <strong class="text-emerald-300">2π×${r}×(${r}+${h}) = ${totalS}π cm²</strong>로 한 번에 구할 수 있습니다!`,
            actionTxt: state.animProg > 0.5 ? '🎬 밑면과 옆면 분리해 보기' : '🎬 원기둥으로 합치기',
            dim1Name: '밑면 반지름 r', dim2Name: '원기둥 높이 h',
            surfaceParts: [
              { id: 0, name: `🟡 위·아래 두 밑면 넓이 (2πr²)`, desc: `2π × ${r} × ${r}`, val: `+${base2}π cm²`, color: '#fbbf24', included: true },
              { id: 1, name: `🔵 옆면 직사각형 넓이 (2πrh)`, desc: `밑면원주(2π×${r}) × 높이(${h})`, val: `+${lat}π cm²`, color: '#38bdf8', included: true }
            ],
            totalS: `2π×${r}×(${r}+${h}) = ${totalS}π cm²`,
            volRule: 'S = 2πr(r + h)  |  V = πr²h',
            volHTML: `• <strong>겉넓이</strong>(공통인 $2\\pi r$로 묶기):<br/>&nbsp;&nbsp;${tex(`S = 2\\pi r^2 + 2\\pi r h = \\mathbf{2\\pi r(r + h)} = ${2 * r}\\pi \\times (${r} + ${h}) = \\mathbf{${totalS}\\pi\\text{ cm}^2}`)}<br/>• <strong>부피</strong>: ${tex(`V = \\pi r^2 h = \\pi \\times ${r}^2 \\times ${h} = \\mathbf{${totalV}\\pi\\text{ cm}^3}`)}`,
            totalV: `${totalV}π cm³`,
            notes: `• <strong>넓이 그림</strong>을 보세요! 가로가 $2\\pi r$로 똑같은 직사각형 2개(세로 $r$과 세로 $h$)를 이어 붙이면 세로가 $(r+h)$인 하나의 직사각형이 됩니다!`,
            bars: [
              { label: `2πr × r (${base2}π)`, len: `${base2}π`, weight: r / (r + h), color: '#fbbf24' },
              { label: `2πr × h (${lat}π) ➔ 합쳐서 2πr(r+h) = ${totalS}π!`, len: `${lat}π`, weight: h / (r + h), color: '#38bdf8' }
            ]
          };
        }
        // sectorPillar: 부채꼴기둥 (케이크 조각 모양 기둥 — 잘린 직사각형 옆면 2개 주의!)
        const deg = h === 3 ? 60 : h === 4 ? 90 : h === 5 ? 120 : 180;
        const frac = deg / 360;
        const H_cyl = 4;
        const base2 = +(2 * r * r * frac).toFixed(1);
        const curvedLat = +(2 * r * H_cyl * frac).toFixed(1);
        const flatSides = 2 * r * H_cyl; // 칼로 자른 평평한 직사각형 단면 2개 (π가 안 붙음!)
        const vol = +(r * r * H_cyl * frac).toFixed(1);
        return {
          badge: `탐구 1-D · 🍰 부채꼴기둥 (중심각 ${deg}°) — 『자른 면인 직사각형 2개(2rh)』를 빠뜨리지 않기`,
          hint: `원기둥을 중심각 ${deg}°인 부채꼴 모양으로 자르면 부피는 정확히 <strong class="text-sky-300">${deg}/360배</strong>가 되지만, 겉넓이는 둥근 면만 있는 것이 아니라 <strong class="text-amber-300">자른 자리에 평평한 직사각형 2개(r×h×2 = ${flatSides}cm²)가 새로 드러납니다</strong>!`,
          actionTxt: state.animProg > 0.5 ? '🎬 잘린 직사각형 2개 강조' : '🎬 부채꼴기둥 모아 보기',
          dim1Name: '반지름 r (높이 h=4 고정)', dim2Name: '중심각 (3:60°,4:90°,5:120°,6:180°)',
          surfaceParts: [
            { id: 0, name: `🟡 위·아래 부채꼴 밑면 2개`, desc: `2 × π×${r}² × (${deg}°/360°)`, val: `+${base2}π cm²`, color: '#fbbf24', included: true },
            { id: 1, name: `🔵 바깥쪽 둥근 곡면 옆넓이`, desc: `2π×${r}×${H_cyl} × (${deg}°/360°)`, val: `+${curvedLat}π cm²`, color: '#38bdf8', included: true },
            { id: 2, name: `✨ 잘려서 새로 드러난 직사각형 2개`, desc: `(${r} × ${H_cyl}) × 2개 (⚠️ 이 넓이에는 π가 없음)`, val: `+${flatSides} cm²`, color: '#f43f5e', included: true }
          ],
          totalS: `${+(base2 + curvedLat).toFixed(1)}π + ${flatSides} cm²`,
          volRule: `겉넓이 = (원기둥 겉넓이 × θ/360°) + 2rh`,

      x: VIEW.cx + x1 * VIEW.sc * persp,
      y: VIEW.cy - y2 * VIEW.sc * persp,

  /* ===== 원본 그대로: 3D 선·점·글자·면 그리기 ===== */
    function draw3DLine(p1, p2, color = '#ffffff', width = 2.2, dashed = false, glow = false) {
      const s1 = project3D(p1.x, p1.y, p1.z);
      const s2 = project3D(p2.x, p2.y, p2.z);
      ctx.save();
      ctx.beginPath();
      if (dashed) ctx.setLineDash([6, 5]);
      ctx.strokeStyle = color;
      ctx.lineWidth = width;
      ctx.lineCap = 'round';
      if (glow) { ctx.shadowColor = color; ctx.shadowBlur = 12; }
      ctx.moveTo(s1.x, s1.y);
      ctx.lineTo(s2.x, s2.y);
      ctx.stroke();
      ctx.restore();
    }

    function draw3DPoint(pt, radius = 5.5, color = '#fbbf24', label = '', offset = { x: 8, y: -8 }) {
      const s = project3D(pt.x, pt.y, pt.z);
      ctx.save();
      ctx.beginPath();
      ctx.arc(s.x, s.y, radius, 0, Math.PI * 2);
      ctx.fillStyle = color;
      ctx.shadowColor = color;
      ctx.shadowBlur = 10;
      ctx.fill();
      ctx.lineWidth = 1.8;
      ctx.strokeStyle = '#ffffff';
      ctx.stroke();
      if (label) {
        ctx.shadowColor = 'rgba(0,0,0,0.95)';
        ctx.shadowBlur = 6;
        ctx.font = 'bold 12.5px Pretendard, sans-serif';
        ctx.fillStyle = color;
        ctx.fillText(label, s.x + offset.x, s.y + offset.y);
      }
      ctx.restore();
    }

    function draw3DText(pt, text, color = '#ffffff', fontSize = 12.5, offset = { x: 0, y: 0 }) {
      const s = project3D(pt.x, pt.y, pt.z);
      ctx.save();
      ctx.font = `800 ${fontSize}px Pretendard, sans-serif`;
      ctx.fillStyle = color;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.shadowColor = 'rgba(0,0,0,0.95)';
      ctx.shadowBlur = 6;
      ctx.fillText(text, s.x + offset.x, s.y + offset.y);
      ctx.restore();
    }

    function renderSortedFaces(faces) {
      window.APBoardRel?.captureFaces(faces);
      const projected = faces.map((f) => {
        const sPts = f.pts.map((p) => project3D(p.x, p.y, p.z));
        const avgDepth = sPts.reduce((acc, c) => acc + c.depth, 0) / sPts.length;
        const c3 = f.pts.reduce((a, c) => ({ x: a.x + c.x / f.pts.length, y: a.y + c.y / f.pts.length, z: a.z + c.z / f.pts.length }), { x: 0, y: 0, z: 0 });
        return { ...f, sPts, avgDepth, center2D: project3D(c3.x, c3.y, c3.z) };
      });
      projected.sort((a, b) => b.avgDepth - a.avgDepth);

      projected.forEach((f) => {
        ctx.save();
        ctx.beginPath();
        ctx.moveTo(f.sPts[0].x, f.sPts[0].y);
        for (let i = 1; i < f.sPts.length; i++) ctx.lineTo(f.sPts[i].x, f.sPts[i].y);
        ctx.closePath();

        let fill = f.fillColor || 'rgba(52, 211, 153, 0.28)';
        let stroke = f.strokeColor || 'rgba(255, 255, 255, 0.85)';
        let lw = f.lineWidth || 1.8;

        if (state.lens === 'vol' && !f.isVolume) {
          fill = 'rgba(15, 23, 42, 0.06)';
          stroke = 'rgba(148, 163, 184, 0.24)';
        } else if (state.lens === 'hidden' && !f.isHiddenFace) {
          fill = 'rgba(15, 23, 42, 0.08)';
          stroke = 'rgba(148, 163, 184, 0.25)';
        }

        if (state.activePartIdx !== -1 && f.partIdx !== undefined) {
          if (f.partIdx === state.activePartIdx) {
            lw = 3.2;
            ctx.shadowColor = stroke;
            ctx.shadowBlur = 14;
          } else {
            fill = 'rgba(15, 23, 42, 0.10)';
            stroke = 'rgba(148, 163, 184, 0.20)';
            lw = 1.0;
          }
        }

        ctx.fillStyle = fill;
        ctx.fill();
        ctx.lineWidth = lw;
        ctx.strokeStyle = stroke;
        ctx.lineJoin = 'round';
        ctx.stroke();

        if (f.label && !HIDE_FACE_LABELS) {
          ctx.font = '800 12px Pretendard, sans-serif';
          ctx.fillStyle = f.labelColor || '#ffffff';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.shadowColor = 'rgba(0,0,0,0.95)';
          ctx.shadowBlur = 6;
          ctx.fillText(f.label, f.center2D.x, f.center2D.y);
        }
        ctx.restore();
      });
    }

    function drawFloorGrid() {
      const range = 4;
      for (let i = -range; i <= range; i++) {
        draw3DLine({ x: i, y: -range, z: 0 }, { x: i, y: range, z: 0 }, 'rgba(52, 211, 153, 0.07)', 1);
        draw3DLine({ x: -range, y: i, z: 0 }, { x: range, y: i, z: 0 }, 'rgba(52, 211, 153, 0.07)', 1);
      }
    }

  /* ===== 원본 그대로: 우측 상단 2D 설계도 미니뷰 (상자 자리만 무대 안쪽 영역 기준으로 바꿈) ===== */

          const p1 = { x: xCyl + R * Math.cos(a1), y: R * Math.sin(a1), z: 0 };
          const p2 = { x: xCyl + R * Math.cos(a1), y: R * Math.sin(a1), z: curH };
          const p3 = { x: xCyl + R * Math.cos(a0), y: R * Math.sin(a0), z: curH };
          topDisk.push(p3);
          faces.push({ pts: [p0, p1, p2, p3], fillColor: 'rgba(52, 211, 153, 0.38)', strokeColor: '#34d399', isVolume: true, partIdx: 1 });
        }
        faces.push({ pts: topDisk, fillColor: 'rgba(52, 211, 153, 0.68)', strokeColor: '#34d399', isVolume: true, partIdx: 1, label: `S = ${r * r}π` });
        renderSortedFaces(faces);
        draw3DText({ x: 0, y: 0, z: curH + 0.45 }, `현재 쌓인 높이 = ${(h * f).toFixed(1)} cm`, '#fbbf24', 13);
      } else if (sub === 'cylinderFactor') {
        const k = 0.50;
        const R = r * k, H = h * k;
        const lift = (1 - f) * 0.9;
        const N = 28, faces = [], topDisk = [], botDisk = [];
        for (let i = 0; i < N; i++) {
          const a0 = (i / N) * Math.PI * 2, a1 = ((i + 1) / N) * Math.PI * 2;
          topDisk.push({ x: R * Math.cos(a0), y: R * Math.sin(a0), z: H + lift });
          botDisk.push({ x: R * Math.cos(a0), y: R * Math.sin(a0), z: -lift });
          faces.push({
            pts: [
              { x: R * Math.cos(a0), y: R * Math.sin(a0), z: 0 },
              { x: R * Math.cos(a1), y: R * Math.sin(a1), z: 0 },
              { x: R * Math.cos(a1), y: R * Math.sin(a1), z: H },
              { x: R * Math.cos(a0), y: R * Math.sin(a0), z: H }
            ],
            fillColor: 'rgba(56, 189, 248, 0.36)',
            strokeColor: '#38bdf8',
            partIdx: 1,
            label: i === 6 ? `옆넓이 2πrh = ${2 * r * h}π` : ''
          });
        }
        faces.push({ pts: topDisk, fillColor: 'rgba(251, 191, 36, 0.50)', strokeColor: '#fbbf24', partIdx: 0, label: `윗밑면 (${r * r}π)` });
        faces.push({ pts: botDisk, fillColor: 'rgba(251, 191, 36, 0.50)', strokeColor: '#fbbf24', partIdx: 0, label: `아랫밑면 (${r * r}π)` });
        renderSortedFaces(faces);
        draw3DLine({ x: 0, y: 0, z: H + lift }, { x: R, y: 0, z: H + lift }, '#ffffff', 3, false, true);
        draw3DText({ x: 0, y: 0, z: H + lift + 0.45 }, `S = 2πr(r+h) = 2π×${r}×(${r}+${h}) = ${2 * r * (r + h)}π`, '#fef08a', 13);
      } else {
        // sectorPillar: 부채꼴기둥 (케이크 조각 기둥 — 칼로 자른 평평한 옆면 2개 강조!)
        const deg = h === 3 ? 60 : h === 4 ? 90 : h === 5 ? 120 : 180;
        const span = (deg * Math.PI) / 180;
        const R = r * 0.55, H_cyl = 2.2;
        const spread = (1 - f) * 0.5;
        const N = 20, faces = [];
        const topSector = [{ x: 0, y: 0, z: H_cyl }], botSector = [{ x: 0, y: 0, z: 0 }];

        for (let i = 0; i <= N; i++) {
          const a = (i / N) * span;
          topSector.push({ x: R * Math.cos(a), y: R * Math.sin(a), z: H_cyl });
          botSector.push({ x: R * Math.cos(a), y: R * Math.sin(a), z: 0 });
        }
        faces.push({ pts: topSector, fillColor: 'rgba(251, 191, 36, 0.45)', strokeColor: '#fbbf24', partIdx: 0, label: `부채꼴 밑면 (${deg}°)` });
        faces.push({ pts: botSector, fillColor: 'rgba(251, 191, 36, 0.45)', strokeColor: '#fbbf24', partIdx: 0 });

        // 둥근 곡면 옆넓이
        for (let i = 0; i < N; i++) {
          const a0 = (i / N) * span, a1 = ((i + 1) / N) * span;
          faces.push({
            pts: [
              { x: R * Math.cos(a0), y: R * Math.sin(a0), z: 0 },
              { x: R * Math.cos(a1), y: R * Math.sin(a1), z: 0 },
              { x: R * Math.cos(a1), y: R * Math.sin(a1), z: H_cyl },
              { x: R * Math.cos(a0), y: R * Math.sin(a0), z: H_cyl }
            ],
            fillColor: 'rgba(56, 189, 248, 0.35)',
            strokeColor: '#38bdf8',
            partIdx: 1
          });
        }

        // ✨ 칼로 잘려 새로 노출된 평평한 직사각형 옆면 2개 (π가 붙지 않는 면!)
        faces.push(
          {
            pts: [
              { x: 0, y: -spread, z: 0 },
              { x: R, y: -spread, z: 0 },
              { x: R, y: -spread, z: H_cyl },
              { x: 0, y: -spread, z: H_cyl }
            ],
            fillColor: 'rgba(244, 63, 94, 0.58)',
            strokeColor: '#f43f5e',
            lineWidth: 2.8,
            partIdx: 2,
            label: `✨직사각형 ① (${r}×4=${4 * r})`
          },
          {
            pts: [
              { x: 0, y: spread, z: 0 },
              { x: R * Math.cos(span), y: R * Math.sin(span) + spread, z: 0 },
              { x: R * Math.cos(span), y: R * Math.sin(span) + spread, z: H_cyl },
              { x: 0, y: spread, z: H_cyl }
            ],
            fillColor: 'rgba(244, 63, 94, 0.58)',
            strokeColor: '#f43f5e',
            lineWidth: 2.8,
            partIdx: 2,
            label: `✨직사각형 ② (+${4 * r})`
          }
        );
        renderSortedFaces(faces);
      }
    }

    // ==================== [탭 2 렌더링: 뿔·뿔대·고깔모자 & 3:1 물붓기 4종] ====================
    function renderTab2ConesAndPartyHat() {
      const sub = state.sub[2];
      const f = state.animProg;
      const r = state.r, h = state.h;

      if (sub === 'pour3to1') {
        const k = 0.52;
        const R = r * k, H = h * k;
        const xCone = -2.0, xCyl = 2.0, N = 26, faces = [];
        const apex = { x: xCone, y: 0, z: H };
        for (let i = 0; i < N; i++) {
          const a0 = (i / N) * Math.PI * 2, a1 = ((i + 1) / N) * Math.PI * 2;
          faces.push({ pts: [apex, { x: xCone + R * Math.cos(a0), y: R * Math.sin(a0), z: 0 }, { x: xCone + R * Math.cos(a1), y: R * Math.sin(a1), z: 0 }], fillColor: 'rgba(244, 114, 182, 0.38)', strokeColor: '#f472b6', partIdx: 0 });
        }
        const zWater = H * Math.max(0.03, f);
        for (let i = 0; i < N; i++) {
          const a0 = (i / N) * Math.PI * 2, a1 = ((i + 1) / N) * Math.PI * 2;
          const x0c = xCyl + R * Math.cos(a0), y0c = R * Math.sin(a0);
          const x1c = xCyl + R * Math.cos(a1), y1c = R * Math.sin(a1);
          faces.push({ pts: [{ x: x0c, y: y0c, z: 0 }, { x: x1c, y: y1c, z: 0 }, { x: x1c, y: y1c, z: zWater }, { x: x0c, y: y0c, z: zWater }], fillColor: 'rgba(56, 189, 248, 0.52)', strokeColor: '#38bdf8', isVolume: true, partIdx: 2 });
          faces.push({ pts: [{ x: x0c, y: y0c, z: 0 }, { x: x1c, y: y1c, z: 0 }, { x: x1c, y: y1c, z: H }, { x: x0c, y: y0c, z: H }], fillColor: 'rgba(255,255,255,0.05)', strokeColor: 'rgba(255,255,255,0.22)' });
        }
        renderSortedFaces(faces);
        [1 / 3, 2 / 3, 1.0].forEach((lv, idx) => {
          const zm = H * lv;
          draw3DLine({ x: xCyl - R - 0.2, y: 0, z: zm }, { x: xCyl + R + 0.3, y: 0, z: zm }, '#fbbf24', 2, true);
          draw3DText({ x: xCyl + R + 0.95, y: 0, z: zm }, `${idx + 1}/3 (${idx + 1}컵)`, '#fbbf24', 12);
        });
      } else if (sub === 'coneFactor') {
        const k = 0.52;
        const R = r * k, H = h * k;
        const slant = Math.round(Math.hypot(r, h) * 10) / 10;
        const lift = (1 - f) * 0.9;
        const apex = { x: 0, y: 0, z: H + lift };
        const N = 28, faces = [], botDisk = [];

        for (let i = 0; i < N; i++) {
          const a0 = (i / N) * Math.PI * 2, a1 = ((i + 1) / N) * Math.PI * 2;
          botDisk.push({ x: R * Math.cos(a0), y: R * Math.sin(a0), z: 0 });
          faces.push({
            pts: [apex, { x: R * Math.cos(a0), y: R * Math.sin(a0), z: lift }, { x: R * Math.cos(a1), y: R * Math.sin(a1), z: lift }],
            fillColor: 'rgba(244, 114, 182, 0.38)',
            strokeColor: '#f472b6',
            partIdx: 1,
            label: i === 6 ? `옆넓이 πra = ${(r * slant).toFixed(1)}π` : ''
          });
        }
        faces.push({ pts: botDisk, fillColor: 'rgba(56, 189, 248, 0.48)', strokeColor: '#38bdf8', partIdx: 0, label: `밑면 πr² = ${r * r}π` });
        renderSortedFaces(faces);

        // 높이 h vs 모선 a 구분 보조선
        draw3DLine({ x: 0, y: 0, z: lift }, apex, '#34d399', 3, true, true);
        draw3DLine(apex, { x: R, y: 0, z: lift }, '#fbbf24', 3.5, false, true);
        draw3DText({ x: R * 0.65, y: 0, z: H * 0.55 + lift }, `모선 a=${slant}(겉넓이에 사용)`, '#fbbf24', 12.5);
        draw3DText({ x: -0.6, y: 0, z: H * 0.45 + lift }, `높이 h=${h}(부피에 사용)`, '#34d399', 12);
      } else if (sub === 'partyHat') {
        const k = 0.42;
        const rIn = r * k, rOut = (r + 2) * k;
        const coneH = (h + 0.5) * k;
        const lift = (1 - f) * 1.6;
        const N = 30, faces = [];

        for (let i = 0; i < N; i++) {
          const a0 = (i / N) * Math.PI * 2, a1 = ((i + 1) / N) * Math.PI * 2;
          faces.push({
            pts: [
              { x: rIn * Math.cos(a0), y: rIn * Math.sin(a0), z: 0 },
              { x: rIn * Math.cos(a1), y: rIn * Math.sin(a1), z: 0 },
              { x: rOut * Math.cos(a1), y: rOut * Math.sin(a1), z: 0 },
              { x: rOut * Math.cos(a0), y: rOut * Math.sin(a0), z: 0 }
            ],
            fillColor: 'rgba(56, 189, 248, 0.42)',
            strokeColor: '#38bdf8',
            partIdx: 1,
            label: i === 0 ? `고리 모양 챙 (πR² - πr²)` : ''
          });
        }
        const apex = { x: 0, y: 0, z: lift + coneH };
        for (let i = 0; i < N; i++) {
          const a0 = (i / N) * Math.PI * 2, a1 = ((i + 1) / N) * Math.PI * 2;
          faces.push({
            pts: [apex, { x: rIn * Math.cos(a0), y: rIn * Math.sin(a0), z: lift }, { x: rIn * Math.cos(a1), y: rIn * Math.sin(a1), z: lift }],
            fillColor: 'rgba(244, 114, 182, 0.38)',
            strokeColor: '#f472b6',
            partIdx: 0,
            label: i === 8 ? `고깔 옆면 (πra)` : ''
          });
        }
        renderSortedFaces(faces);
        for (let i = 0; i < N; i++) {
          const a0 = (i / N) * Math.PI * 2, a1 = ((i + 1) / N) * Math.PI * 2;
          draw3DLine({ x: rIn * Math.cos(a0), y: rIn * Math.sin(a0), z: 0.02 }, { x: rIn * Math.cos(a1), y: rIn * Math.sin(a1), z: 0.02 }, '#f43f5e', 3.2, i % 2 === 0, true);
        }
        draw3DText({ x: 0, y: 0, z: -0.35 }, `❌ 뚫린 구멍 (-${r * r}π, 면 없음)`, '#fda4af', 12.5);
      } else {
        // frustumCalc
        const k = 0.46;
        const rTop = Math.max(1, Math.floor(r / 2)) * k, rBot = rTop * 2;
        const H = h * 0.42;
        const liftSmall = (1 - f) * 1.4 + 0.1;
        const N = 26, faces = [], topDisk = [], botDisk = [];

        for (let i = 0; i < N; i++) {
          const a0 = (i / N) * Math.PI * 2, a1 = ((i + 1) / N) * Math.PI * 2;
          const b0 = { x: rBot * Math.cos(a0), y: rBot * Math.sin(a0), z: 0 };
          const b1 = { x: rBot * Math.cos(a1), y: rBot * Math.sin(a1), z: 0 };
          const t1 = { x: rTop * Math.cos(a1), y: rTop * Math.sin(a1), z: H };
          const t0 = { x: rTop * Math.cos(a0), y: rTop * Math.sin(a0), z: H };
          botDisk.push(b0); topDisk.push(t0);
          faces.push({ pts: [b0, b1, t1, t0], fillColor: 'rgba(251, 191, 36, 0.38)', strokeColor: '#fbbf24', partIdx: 1 });

          // 잘려나간 위쪽 작은 원뿔
          const smApex = { x: 0, y: 0, z: H * 2 + liftSmall };
          const sm0 = { x: rTop * Math.cos(a0), y: rTop * Math.sin(a0), z: H + liftSmall };
          const sm1 = { x: rTop * Math.cos(a1), y: rTop * Math.sin(a1), z: H + liftSmall };
          faces.push({ pts: [smApex, sm0, sm1], fillColor: 'rgba(244, 63, 94, 0.22)', strokeColor: 'rgba(244, 63, 94, 0.65)', isHiddenFace: true, partIdx: 2 });
        }
        faces.push({ pts: topDisk, fillColor: 'rgba(56, 189, 248, 0.48)', strokeColor: '#38bdf8', partIdx: 0, label: '윗밑면 노출!' });
        faces.push({ pts: botDisk, fillColor: 'rgba(56, 189, 248, 0.48)', strokeColor: '#38bdf8', partIdx: 0, label: '아랫밑면' });
        renderSortedFaces(faces);
      }
    }

    // ==================== [탭 3 렌더링: 구(4πr²)·반구(3πr²) & 아르키메데스 1:2:3 4종] ====================
    function renderTab3SpheresAndArchimedes() {
      const sub = state.sub[3];
      const f = state.animProg;
      const r = state.r;
      const k = 0.46;
      const R = r * k, H = 2 * R;

      if (sub === 'archimedes' || sub === 'sphereOrange') {
        const spread = sub === 'archimedes' ? (1 - f) * 2.5 : 0;
        const xCone = -spread, xSph = 0, xCyl = spread;
        const N = 22, faces = [];

        if (sub === 'archimedes') {
          for (let i = 0; i < N; i++) {
            const a0 = (i / N) * Math.PI * 2, a1 = ((i + 1) / N) * Math.PI * 2;
            faces.push({ pts: [{ x: xCone, y: 0, z: H }, { x: xCone + R * Math.cos(a0), y: R * Math.sin(a0), z: 0 }, { x: xCone + R * Math.cos(a1), y: R * Math.sin(a1), z: 0 }], fillColor: 'rgba(244, 114, 182, 0.35)', strokeColor: '#f472b6', partIdx: 0 });
            faces.push({ pts: [{ x: xCyl + R * Math.cos(a0), y: R * Math.sin(a0), z: 0 }, { x: xCyl + R * Math.cos(a1), y: R * Math.sin(a1), z: 0 }, { x: xCyl + R * Math.cos(a1), y: R * Math.sin(a1), z: H }, { x: xCyl + R * Math.cos(a0), y: R * Math.sin(a0), z: H }], fillColor: 'rgba(56, 189, 248, 0.20)', strokeColor: 'rgba(56, 189, 248, 0.5)', partIdx: 2 });
          }
        }

        const latN = 10, lonN = 18;
        for (let i = 0; i < latN; i++) {
          const th0 = -Math.PI / 2 + (i / latN) * Math.PI;
          const th1 = -Math.PI / 2 + ((i + 1) / latN) * Math.PI;
          for (let j = 0; j < lonN; j++) {
            const ph0 = (j / lonN) * Math.PI * 2, ph1 = ((j + 1) / lonN) * Math.PI * 2;
            const p0 = { x: xSph + R * Math.cos(th0) * Math.cos(ph0), y: R * Math.cos(th0) * Math.sin(ph0), z: R + R * Math.sin(th0) };
            const p1 = { x: xSph + R * Math.cos(th0) * Math.cos(ph1), y: R * Math.cos(th0) * Math.sin(ph1), z: R + R * Math.sin(th0) };
            const p2 = { x: xSph + R * Math.cos(th1) * Math.cos(ph1), y: R * Math.cos(th1) * Math.sin(ph1), z: R + R * Math.sin(th1) };
            const p3 = { x: xSph + R * Math.cos(th1) * Math.cos(ph0), y: R * Math.cos(th1) * Math.sin(ph0), z: R + R * Math.sin(th1) };
            faces.push({ pts: [p0, p1, p2, p3], fillColor: i >= 5 ? 'rgba(251, 191, 36, 0.42)' : 'rgba(249, 115, 22, 0.42)', strokeColor: 'rgba(251, 191, 36, 0.65)', lineWidth: 1, partIdx: sub === 'archimedes' ? 1 : i >= 5 ? 0 : 1 });
          }
        }
        renderSortedFaces(faces);
      } else if (sub === 'hemisphere3') {
        // 🥣 반구: 둥근 껍질(2πr²) + 칼로 자른 평평한 단면 원(+πr²) = 3πr²
        const R_hemi = r * 0.55;
        const liftTop = (1 - f) * 1.4;
        const faces = [];
        const latN = 6, lonN = 20;

        // 아래쪽 반구 둥근 껍질
        for (let i = 0; i < latN; i++) {
          const th0 = (-Math.PI / 2) * (1 - i / latN);
          const th1 = (-Math.PI / 2) * (1 - (i + 1) / latN);
          for (let j = 0; j < lonN; j++) {
            const ph0 = (j / lonN) * Math.PI * 2, ph1 = ((j + 1) / lonN) * Math.PI * 2;
            faces.push({
              pts: [
                { x: R_hemi * Math.cos(th0) * Math.cos(ph0), y: R_hemi * Math.cos(th0) * Math.sin(ph0), z: 1.0 + R_hemi * Math.sin(th0) },
                { x: R_hemi * Math.cos(th0) * Math.cos(ph1), y: R_hemi * Math.cos(th0) * Math.sin(ph1), z: 1.0 + R_hemi * Math.sin(th0) },
                { x: R_hemi * Math.cos(th1) * Math.cos(ph1), y: R_hemi * Math.cos(th1) * Math.sin(ph1), z: 1.0 + R_hemi * Math.sin(th1) },
                { x: R_hemi * Math.cos(th1) * Math.cos(ph0), y: R_hemi * Math.cos(th1) * Math.sin(ph0), z: 1.0 + R_hemi * Math.sin(th1) }
              ],
              fillColor: 'rgba(251, 191, 36, 0.45)',
              strokeColor: '#fbbf24',
              lineWidth: 1,
              partIdx: 0
            });
          }
        }

        // ✨ 칼로 자른 빨간 평평한 단면 원 (+πr²)
        const flatDisk = [];
        for (let j = 0; j < 28; j++) {
          const ph = (j / 28) * Math.PI * 2;
          flatDisk.push({ x: R_hemi * Math.cos(ph), y: R_hemi * Math.sin(ph), z: 1.0 });
        }
        faces.push({
          pts: flatDisk,
          fillColor: 'rgba(244, 63, 94, 0.62)',
          strokeColor: '#f43f5e',
          lineWidth: 3,
          partIdx: 1,
          label: `✨새로 생긴 원 (+πr² = ${r * r}π) ➔ 모두 3πr²`
        });

        renderSortedFaces(faces);
      } else {
        // sphereCut8: 구의 1/8을 잘라낸 입체 (사분원 단면 3개 노출!)
        const R_sph = r * 0.56;
        const cz = 1.25;
        const faces = [];
        const latN = 8, lonN = 16;

        for (let i = 0; i < latN; i++) {
          const th0 = -Math.PI / 2 + (i / latN) * Math.PI;
          const th1 = -Math.PI / 2 + ((i + 1) / latN) * Math.PI;
          for (let j = 0; j < lonN; j++) {
            const ph0 = (j / lonN) * Math.PI * 2, ph1 = ((j + 1) / lonN) * Math.PI * 2;
            // 제1팔분공간 (th > 0 이고 -PI/2 <= ph < 0 인 앞쪽 1/8 조각 제외)
            const isCutOctant = th0 >= -0.01 && ph0 >= 1.5 * Math.PI - 0.01;
            const offset = isCutOctant ? (1 - f) * 0.85 : 0;
            if (isCutOctant && f > 0.8) continue;

            const dx = isCutOctant ? offset : 0, dy = isCutOctant ? -offset : 0, dz = isCutOctant ? offset : 0;
            faces.push({
              pts: [
                { x: R_sph * Math.cos(th0) * Math.cos(ph0) + dx, y: R_sph * Math.cos(th0) * Math.sin(ph0) + dy, z: cz + R_sph * Math.sin(th0) + dz },
                { x: R_sph * Math.cos(th0) * Math.cos(ph1) + dx, y: R_sph * Math.cos(th0) * Math.sin(ph1) + dy, z: cz + R_sph * Math.sin(th0) + dz },
                { x: R_sph * Math.cos(th1) * Math.cos(ph1) + dx, y: R_sph * Math.cos(th1) * Math.sin(ph1) + dy, z: cz + R_sph * Math.sin(th1) + dz },
                { x: R_sph * Math.cos(th1) * Math.cos(ph0) + dx, y: R_sph * Math.cos(th1) * Math.sin(ph0) + dy, z: cz + R_sph * Math.sin(th1) + dz }
              ],
              fillColor: isCutOctant ? 'rgba(244, 63, 94, 0.28)' : 'rgba(251, 191, 36, 0.42)',
              strokeColor: isCutOctant ? '#f43f5e' : '#fbbf24',
              lineWidth: 1,
              partIdx: isCutOctant ? 2 : 0
            });
          }
        }

        // 파인 자리에 새로 드러난 사분원(1/4원) 단면 3개
        const q1 = [{ x: 0, y: 0, z: cz }], q2 = [{ x: 0, y: 0, z: cz }], q3 = [{ x: 0, y: 0, z: cz }];
        for (let k = 0; k <= 12; k++) {
          const a = (k / 12) * (Math.PI / 2);

    };
  }

  // [2.0 수정] 원본에서 그림에 아무 영향이 없던 조작은 이 장면에서 보여 주지 않습니다(장면마다 모든 값을 바꿔 그려 보고 가려냄).
  //  · 진행도(슬라이더·단계 단추·실행 단추): 그림이 진행도에 따라 변하지 않는 장면
  //  · 치수 단추: 그림이 그 치수에 따라 변하지 않는 장면
  //  · 관찰 렌즈: 원본 그리기 코드에 '겉넓이(area)' 분기가 없어 모든 장면에서 효과가 없었고, '부피' 렌즈는 밑넓이 엘리베이터에서만 효과 없음
  const NO_ANIM = new Set(['sphereOrange', 'hemisphere3', 'drilled', 'troughCut']);
  const NO_D1 = new Set([]);
  const NO_D2 = new Set(['archimedes', 'sphereOrange', 'hemisphere3', 'sphereCut8', 'drilled', 'cornerCut', 'troughCut']);
  const LENS_OFF = { layerElevator: ['vol'] };
  const NO_BOX = new Set([]);   // 2D 설계도 상자를 둘 수 없는(그릴 내용이 없는) 장면
  const FIT_CUR = new Set([]);  // 지금 진행도 근처로만 크기를 맞추는 장면

  function sceneOf(m, it) {
    const id = it.id;
    const label = arrow(it.label);
    return {
      id, title: label, short: label, reviewTab: true,
      question: QUESTIONS[m - 1],
      notesTitle: '겉넓이·부피를 구할 때 주의할 점',
      enter: (s) => {
        s.view2d = false;
        s.anim = id === 'pour3to1' ? 1 / 3 : 0.85;
        s.playing = false;
      },
      controls: () => (NO_ANIM.has(id) ? [] : ['anim']),
      presets: (s) => {
        sync(s, m, id);
        const spec = getSpec();
        const out = [];
        const cams = ['iso', 'top', 'front'];
        if (!NO_ANIM.has(id)) ANIM_CHIPS(m, id).forEach(([v, lbl]) => out.push({ group: '진행 단계', label: lbl, set: { anim: v }, ms: 650, on: (st) => Math.abs(st.anim - v) < 0.02 }));
        if (!NO_D1.has(id)) [2, 3, 4, 5].forEach((v) => out.push({ group: cv(spec.dim1Name), label: String(v), color: 'sky', apply: (st) => { st.r = v; st.part = null; }, on: (st) => st.r === v }));
        if (!NO_D2.has(id)) [3, 4, 5, 6].forEach((v) => out.push({ group: cv(spec.dim2Name), label: String(v), color: 'rose', apply: (st) => { st.h = v; st.part = null; }, on: (st) => st.h === v }));
        LENSES.filter(([k]) => !(LENS_OFF[id] || []).includes(k)).forEach(([k, lbl]) => out.push({ group: '표시할 내용', label: lbl, apply: (st) => { st.lens = k; st.part = null; }, on: (st) => st.lens === k }));
        if (!NO_BOX.has(id) && !isNarrow()) {
          out.push({ group: '넓이·부피 그림', label: '켜기', apply: (st) => { st.dual = true; }, on: (st) => st.dual !== false });
          out.push({ group: '넓이·부피 그림', label: '끄기', apply: (st) => { st.dual = false; }, on: (st) => st.dual === false });
        }
        cams.forEach((k, i) => out.push({ group: '시점', label: CAM_LABELS[i], set: { yaw: CAMS[k].yaw, pitch: CAMS[k].pitch }, ms: 600, apply: (st) => { st.playing = false; }, on: (st) => Math.abs(st.yaw - CAMS[k].yaw) < 1 && Math.abs(st.pitch - CAMS[k].pitch) < 1 }));
        return out;
      },
      actions: () => [...(NO_ANIM.has(id) ? [] : [{
        id: 'act', play: true, primary: true, icon: 'wand',
        label: (st) => { sync(st, m, id); return arrow(getSpec().actionTxt); },
        run: (st, lab) => {
          // 원본 triggerAnim: 3:1 물붓기는 1/3 → 2/3 → 3/3 → 1/3 …, 그 밖에는 처음 ↔ 끝
          if (id === 'pour3to1') lab.tween({ anim: ((Math.round(st.anim * 3) % 3) + 1) / 3 }, 700);
          else lab.tween({ anim: st.anim > 0.5 ? 0.05 : 1 }, 1100);
        }
      }]), {
        id: 'spin', play: true, icon: (st) => (st.playing ? 'pause' : 'play'),
        label: (st) => (st.playing ? '일시 정지' : '입체 자동 회전'),
        on: (st) => st.playing,
        run: (st) => { st.playing = !st.playing; }
      }],
      view: (s) => {
        sync(s, m, id);
        return specView(arrow(getSpec()), s);
      },
      draw: (b, s) => {
        B = b;
        if (!b.thumb) MAINB = b;
        ctx = b.__legacyCtx || (b.__legacyCtx = makeCtx(b));
        sync(s, m, id);
        const narrow = !b.thumb && b._area().w < 640 && !NO_BOX.has(id);
        if (BTN && !b.thumb) {
          BTN.hidden = !narrow;
          BTN.textContent = s.view2d ? '입체 그림으로 돌아가기' : '넓이 그림 보기';
        }
        if (narrow && s.view2d) { draw2DDualOverlay(true); return; }
        // [2.0 수정] 개미 최단거리: 좁은 화면에서는 면 이름표(윗밑면·아랫밑면·가로=2πr)가 개미 이름표와 겹쳐 읽히지 않아 접어 둡니다(같은 내용은 아래 띠와 2D 설계도에 있음).
        HIDE_FACE_LABELS = id === 'antShortest' && !b.thumb && b._area().w < 640;
        setView(b, m, id, s);
        if (s.grid && !b.thumb) drawFloorGrid();
        RENDER[m]();
        draw2DDualOverlay();
      }
    };
  }

  const groups = Object.keys(SUB_MENUS).map((k) => {
    const m = +k;
    return { id: 'm' + m, title: TABS[m - 1], short: SHORT[m - 1], scenes: SUB_MENUS[m].map((it) => sceneOf(m, it)) };
  });

  APLab.createLab({
    id: 'g7-surface-volume',
    title: '겉넓이 · 부피',
    courseName: '중1',
    unit: '입체도형',
    courseColor: 'var(--m-green)',
    home: '../index.html#g7',
    legacy: '../../labs/g7/입체도형의 겉넓이와 부피.html',
    board: {
      kind: 'cartesian', focus: { x: [-4, 4], y: [-4, 4] }, minZoom: 0.5, maxZoom: 3,
      // 빈 곳을 끌면 카메라 회전(원본과 같은 감도, 위아래 기울기 5°~88°)
      orbit: (s, dx, dy) => {
        s.yaw += dx * 0.0085 * R2D;
        if (s.yaw > 180) s.yaw -= 360;
        if (s.yaw < -180) s.yaw += 360;
        s.pitch = clamp(s.pitch + dy * 0.0075 * R2D, 5, 88);
      }
    },
    params: {
      anim: { value: 0.85, min: 0, max: 1, step: 0.005, color: 'amber', label: '진행도 (쌓기 · 물 붓기 · 떼기/붙이기)', hint: '슬라이더로 층 쌓기·물 채우기·파내기를 직접 실험해 보세요', format: (v) => `${Math.round(v * 100)}%` },
      r: { value: 3, min: 2, max: 5, step: 1, color: 'sky', label: '치수 1', format: (v) => `${Math.round(v)} cm` },
      h: { value: 4, min: 3, max: 6, step: 1, color: 'rose', label: '치수 2', format: (v) => `${Math.round(v)} cm` },
      yaw: { value: -32, min: -180, max: 180, step: 1, color: 'muted', label: '좌우 회전', format: (v) => `${Math.round(v)}°` },
      pitch: { value: 28, min: 5, max: 88, step: 1, color: 'muted', label: '위아래 기울기', format: (v) => `${Math.round(v)}°` }
    },
    state: { lens: 'all', dual: true, view2d: false },
    persist: ['lens', 'dual'],
    tick: (s, dt) => {
      let again = false;
      if (s.playing) { s.yaw += 34 * dt; if (s.yaw > 180) s.yaw -= 360; again = true; }

      return again;
    },
    groups
  });

  // 좁은 화면 전용: 무대 오른쪽 위의 단추(넓은 화면에서는 숨김)
  const lab = window.lab;
  if (lab) {
    BTN = document.createElement('button');
    BTN.type = 'button';
    BTN.className = 'apl-btn sm g7-2d-btn';
    BTN.hidden = true;
    BTN.addEventListener('click', () => { lab.s.view2d = !lab.s.view2d; lab.invalidate(true); });
    lab.ui.canvasWrap.append(BTN);
    lab.invalidate(true);
  }
});
</script>
</body>
