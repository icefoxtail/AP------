<noscript>이 실험실을 보려면 브라우저에서 자바스크립트를 켜야 합니다.</noscript>
<script>
/* ==========================================================================
   중1 · 겉넓이 · 부피 (AP Math Lab 2.0) — Ⅲ-2. 입체도형의 겉넓이와 부피
   탭(order 순): ① 기둥(10, 5장면) · ② 뿔(20, 5) · ③ 구(30, 6) · ④ 회전체(40, 4) · ⑤ 붙이고 파낸 입체(50, 6)
   이 파일은 얇은 껍데기입니다. 3차원 도구는 labs/g7-surface-volume/solid3d.js, 길이 표시(치수선·반지름·높이)는 dims.js, 수·선택지·조각 줄·장면 틀은 core.js,
   각 탭은 t1~t5.js 모듈이 window.APL_SV_GROUPS 에 { order, id, title, short, params, scenes } 를 등록하면 order 순으로 붙습니다.
   원칙(학생 가독성)
   - 입체는 처음부터 3차원 · 빈 곳을 끌면 시점이 제자리에서 돌아갑니다(이동이 아니라 회전) · 안 보이는 모서리는 점선
   - 전개도가 겉넓이 식의 첫 단계: 입체를 펼치면(경첩 접기·펴기) 어느 조각의 넓이를 더하는지 그림 속 길이로 보입니다
   - 이동은 가로로만(조각을 가로로 늘어놓기·빼내기), 접기·돌리기는 제자리 회전
   - 색의 역할: 하늘 = 기준 입체·곡면 · 노랑 = 지금 보는 것·구하는 것 · 초록 = 결과 · 빨강 = 자른 면·함정
   - 조절 막대·시점으로 바꾸면 라벨·식·보기·정답이 그 값으로 다시 계산됩니다. 탐구 → 정리(교과서 풀이 순서) → 문제(5지선다 + 숫자 바꾸기)
   ========================================================================== */
window.addEventListener('DOMContentLoaded', function () {
'use strict';
const MODULES = ['solid3d', 'dims', 'core', 'net', 't1', 't2', 't3', 't4', 't5', 't6', 't7', 't8', 't9', 'video'];
const loadScript = (src) => new Promise((res) => {
  const el = document.createElement('script');
  el.src = src; el.async = false;
  el.onload = () => res(true);
  el.onerror = () => { el.remove(); res(false); }; // 아직 없는 모듈은 건너뜁니다
  document.head.append(el);
});

function start() {
  const mods = (window.APL_SV_GROUPS || []).filter((g) => g && Array.isArray(g.scenes) && g.scenes.length);
  // 겉넓이·부피의 학습 흐름에 맞게 정리합니다. 각 장면의 ID와 기존 코드는 유지합니다.
  const byId = new Map(mods.flatMap(g => g.scenes).map(sc => [sc.id, sc]));
  const layout = [
    ['기둥의 겉넓이와 부피', '기둥', ['sv1-1','sv1-2','sv1-3','sv1-4']],
    ['뿔의 겉넓이와 부피', '뿔', ['sv2-1','sv2-2','sv2-3','sv2-4','sv2-5','sv2-6','sv2-7','sv4-1']],
    ['구의 겉넓이와 부피', '구', ['sv3-1','sv3-2','sv3-3','sv3-4','sv3-5','sv3-6','sv3-7']],
    ['여러 가지 입체도형', '여러 가지', ['sv1-5','sv4-2','sv4-3','sv4-4','sv5-1','sv5-2','sv5-3','sv5-4','sv5-5','sv5-6','sv6-1']]
  ];
  const groups = layout.map(([title, short, ids], i) => ({ id: `sv-layout-${i+1}`, title, short, scenes: ids.map(id => byId.get(id)).filter(Boolean) }));
  // 이후 추가되는 장면도 분류표에 없다는 이유로 사라지지 않게 보존합니다.
  const assigned = new Set(layout.flatMap(([, , ids]) => ids));
  mods.flatMap(g => g.scenes).filter(sc => !assigned.has(sc.id)).forEach(sc => groups[3].scenes.push(sc));
  // 예전 공유 주소의 장면 ID를 새 그룹 번호로 옮겨 같은 장면을 계속 엽니다.
  const hash = new URLSearchParams(location.hash.slice(1));
  const selected = hash.get('s');
  if (selected) {
    const id = selected.split('@')[0], gi = groups.findIndex(group => group.scenes.some(scene => scene.id === id));
    if (gi >= 0 && selected !== `${id}@${gi}`) { hash.set('s', `${id}@${gi}`); history.replaceState(null, '', `${location.pathname}${location.search}#${hash}`); }
  }
  const params = {};
  mods.forEach((g) => Object.assign(params, g.params || {}));
  const clamp = APLab.clamp;
  APLab.createLab({
    id: 'g7-surface-volume',
    persist: ['tfMode', 'tfStarted', 'tpStarted', 'sv11Mode', 'sv11Started', 'sv23Started', 'svTri', 'svMode', 'svYaw', 'svPitch', 'svShape', 'jcKind', 'jcMode', 'jcStarted', 'remKind', 'remMode', 'tpMode'],
    stackFractions: true, // 패널 글의 슬래시·유니코드 분수를 쌓은 분수로 바꿉니다 (kit/apl-core.js APLab.stackFr)
    title: '겉넓이 · 부피',
    courseName: '중1',
    unit: '입체도형',
    courseColor: 'var(--m-green)',
    home: '../index.html#g7',
    legacy: '../../labs/g7/입체도형의 겉넓이와 부피.html',
    board: {
      kind: 'figure', grid: false, pad: 0.02, minZoom: 0.5, maxZoom: 6,
      // 빈 곳을 끌면 시점이 제자리에서 돌아갑니다(좌우 회전·위아래 기울기)
      orbit: (s, dx, dy) => {
        s.svYaw = (s.svYaw == null ? 28 : s.svYaw) + dx * 0.5;
        if (s.svYaw > 180) s.svYaw -= 360;
        if (s.svYaw < -180) s.svYaw += 360;
        s.svPitch = clamp((s.svPitch == null ? 22 : s.svPitch) + dy * 0.4, -30, 85);
      }
    },
    // 장면에 들어올 때마다 화면 범위를 처음 상태로 되돌립니다. 그림 맞춤은 장면 그리기에서 매번 합니다.
    enter: (s, sc, lab) => { if (lab && lab.board && s === lab.s) { lab.board.fit(); lab.board.setPanes(null); lab.board.setInsets({ top: 0, right: 0, bottom: 0, left: 0 }); } },
    videos: (window.APL_VIDEOS || {})['g7-surface-volume'],
    params,
    groups
  });
}
Promise.all(MODULES.map((m) => loadScript(`g7-surface-volume/${m}.js`))).then(start);
});
</script>
