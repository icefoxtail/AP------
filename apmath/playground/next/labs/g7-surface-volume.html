<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a100e">
<title>겉넓이 · 부피 · AP Math 실험실</title>
<meta name="description" content="중1 입체도형의 겉넓이와 부피: 기둥(전개도 → 옆넓이 = 밑면 둘레 × 높이, V = Sh), 뿔·뿔대(원뿔의 옆넓이 πRr, 큰 뿔 − 작은 뿔), 구와 반구(4πr², 1:2:3), 회전체, 붙이고 파낸 입체(구멍·모퉁이 절단)를 입체를 직접 돌리고 펼쳐 보며 탐구하고 정리와 5지선다 문제로 확인합니다.">
<script>try{var t=localStorage.getItem('apl:theme');t=t?JSON.parse(t):'paper';document.documentElement.setAttribute('data-theme',t==='board'?'board':'paper')}catch(e){document.documentElement.setAttribute('data-theme','paper')}</script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="../kit/vendor/katex/katex.min.css">
<link rel="stylesheet" href="../kit/apl.css">
<script defer src="../kit/vendor/katex/katex.min.js"></script>
<script defer src="../kit/vendor/qrcode.js"></script>
<script defer src="../kit/apl-core.js"></script>
<script defer src="../kit/apl-board.js"></script>
<script defer src="../kit/apl-shell.js"></script>
</head>
<body>
<noscript>이 실험실을 보려면 브라우저에서 자바스크립트를 켜야 합니다.</noscript>
<script>
/* ==========================================================================
   중1 · 겉넓이 · 부피 (AP Math Lab 2.0) — Ⅲ-2. 입체도형의 겉넓이와 부피
   탭(order 순): ① 기둥(10, 5장면) · ② 뿔(20, 5) · ③ 구(30, 6) · ④ 회전체(40, 4) · ⑤ 붙이고 파낸 입체(50, 6)
   이 파일은 얇은 껍데기입니다. 3차원 도구는 labs/g7-surface-volume/solid3d.js, 수·선택지·조각 줄·장면 틀은 core.js,
   각 탭은 t1~t5.js 모듈이 window.APL_SV_GROUPS 에 { order, id, title, short, params, scenes } 를 등록하면 order 순으로 붙습니다.
   원칙(학생 가독성)
   - 입체는 처음부터 3차원 · 빈 곳을 끌면 시점이 제자리에서 돌아갑니다(이동이 아니라 회전) · 안 보이는 모서리는 점선
   - 전개도가 겉넓이 식의 첫 단계: 입체를 펼치면(경첩 접기·펴기) 어느 조각의 넓이를 더하는지 그림 속 길이로 보입니다
   - 이동은 가로로만(조각을 가로로 늘어놓기·빼내기), 접기·돌리기는 제자리 회전
   - 색의 역할: 하늘 = 기준 입체·곡면 · 노랑 = 지금 보는 것·구하는 것 · 초록 = 결과 · 빨강 = 자른 면·함정
   - 조절 막대·시점으로 바꾸면 라벨·식·보기·정답이 그 값으로 다시 계산됩니다. 탐구 → 정리(교과서 풀이 순서) → 문제(5지선다 + 숫자 바꾸기)
   ========================================================================== */
window.addEventListener('DOMContentLoaded', function () {
'use strict';
const MODULES = ['solid3d', 'core', 'net', 't1', 't2', 't3', 't4', 't5'];
const loadScript = (src) => new Promise((res) => {
  const el = document.createElement('script');
  el.src = src; el.async = false;
  el.onload = () => res(true);
  el.onerror = () => { el.remove(); res(false); }; // 아직 없는 모듈은 건너뜁니다
  document.head.append(el);
});

function start() {
  const mods = (window.APL_SV_GROUPS || []).filter((g) => g && Array.isArray(g.scenes) && g.scenes.length);
  const groups = mods.slice().sort((a, b) => (a.order || 0) - (b.order || 0)).map((g) => ({ id: g.id, title: g.title, short: g.short || g.title, scenes: g.scenes }));
  const params = {};
  mods.forEach((g) => Object.assign(params, g.params || {}));
  const clamp = APLab.clamp;
  APLab.createLab({
    id: 'g7-surface-volume',
    stackFractions: true, // 패널 글의 슬래시·유니코드 분수를 쌓은 분수로 바꿉니다 (kit/apl-core.js APLab.stackFr)
    title: '겉넓이 · 부피',
    courseName: '중1',
    unit: '입체도형',
    courseColor: 'var(--m-green)',
    home: '../index.html#g7',
    legacy: '../../labs/g7/입체도형의 겉넓이와 부피.html',
    board: {
      kind: 'figure', grid: false, pad: 0.02, minZoom: 0.5, maxZoom: 6,
      // 빈 곳을 끌면 시점이 제자리에서 돌아갑니다(좌우 회전·위아래 기울기)
      orbit: (s, dx, dy) => {
        s.svYaw = (s.svYaw == null ? 28 : s.svYaw) + dx * 0.5;
        if (s.svYaw > 180) s.svYaw -= 360;
        if (s.svYaw < -180) s.svYaw += 360;
        s.svPitch = clamp((s.svPitch == null ? 22 : s.svPitch) + dy * 0.4, -30, 85);
      }
    },
    // 장면에 들어올 때마다 화면 범위를 처음 상태로 되돌립니다. 그림 맞춤은 장면 그리기에서 매번 합니다.
    enter: (s, sc, lab) => { if (lab && lab.board && s === lab.s) { lab.board.fit(); lab.board.setPanes(null); lab.board.setInsets({ top: 0, right: 0, bottom: 0, left: 0 }); } },
    params,
    groups
  });
}
Promise.all(MODULES.map((m) => loadScript(`g7-surface-volume/${m}.js`))).then(start);
});
</script>
</body>
</html>
