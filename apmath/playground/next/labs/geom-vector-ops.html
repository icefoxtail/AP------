<script>
/* ==========================================================================
   기하 · 벡터의 덧셈과 뺄셈 (AP Math Lab 2.0 이식본) — 4개 묶음 × 10개 장면
   원본: labs/기하와벡터/벡터의덧셈과뺄셈.html
   - 장면 정의(SUBS·PARTS·INFO), 벡터 수학 함수, 장면 그리기(renderScenario), 프리셋 값,
     실시간 값(updateSceneMonitor)과 동적 발문·정답(updateDynamicExam)은 원본 코드를 그대로 옮겼습니다.
   - 원본의 canvas 직접 그리기 도우미(seg·vec·dot·circle·fillPoly·labelAt·banner)만 같은 이름으로 새 무대 엔진에 연결했습니다.
   - 바뀐 점: 셸·레이아웃은 공용 키트가 담당, 무대는 1:1 축척, 점은 후광이 있는 손잡이로 끌기,
     원본의 떠 있는 안내 상자·하단 띠는 수식 칩·하단 띠로 이동, 장면 값은 막대(슬라이더)와 URL로 공유.
   ========================================================================== */
window.addEventListener('DOMContentLoaded', function () {
  const esc = APLab.esc;
  const R2D = 180 / Math.PI, D2R = Math.PI / 180;
  let BD = null;    // 지금 그리는 무대
  let state = null; // 지금 장면의 값(원본 state와 같은 이름·모양으로 셸 상태 s에서 만듭니다)
  const BANNER = [];

  /* ===== 원본 그대로: 장면 정의, 관찰 조각, 정보, 벡터 수학 도우미 (원본 1705–1746행) ===== */
    const SUBS = {1:['1-A','1-B'],2:['2-A','2-B','2-C'],3:['3-A','3-B','3-C'],4:['4-A','4-B']};
    const PARTS = {
      '1-A':['위치벡터 OA·OB','삼각형법 평행이동','합벡터 a+b','중점벡터 OM'],
      '1-B':['외접원과 세 반지름','현 AB의 중점·수선','무게중심 OG','수선의 교점 OH'],
      '2-A':['위치벡터·끼인각','역벡터 -a','차벡터 AB','중점·합벡터'],
      '2-B':['지름이 AB인 원','PA+PB = 2PM','PA-PB = BA','직각 APB'],
      '2-C':['두 벡터 OA, OB','α, β에 따른 OP','α+β=k인 직선과 영역의 경계','점 P와 영역의 넓이'],
      '3-A':['중심 C와 원','OC (고정된 벡터)','CP (방향이 변하는 벡터)','OP = OC + CP, 최댓값·최솟값'],
      '3-B':['원 C와 선분 AB','중점 M·PM','CP (방향이 변하는 벡터)','거리의 최댓값·최솟값'],
      '3-C':['원 C₁ 위의 점 P','원 C₂ 위의 점 Q','C₁C₂','PQ = C₁C₂ + C₂Q − C₁P'],
      '4-A':['αPA, βPB, γPC','AB의 내분점 D·직선 CD','세 삼각형의 넓이','αPA+βPB+γPC = 영벡터'],
      '4-B':['두 벡터 AB, AC','선분 BC의 내분점 E','AP를 두 번에 나누어 구하기','세 삼각형의 넓이의 비']
    };
    const INFO = {
      '1-A':{name:'벡터의 덧셈과 중점 (a+b=2OM)',steps:['점 A, B와 벡터 OA, OB','b를 평행이동하여 삼각형법으로 합 구하기','선분 AB의 중점 M: a+b=2OM'],formula:'\\overrightarrow{OA}+\\overrightarrow{OB}=2\\overrightarrow{OM}',q:'A(4,2), B(2,4)이고 M이 AB의 중점일 때 |OA+OB| 및 |OM|을 구하시오.',a:'|OA+OB|=6√2, |OM|=3√2',shortcut:'중점 M을 먼저 잡으면 a+b=2OM입니다. 벡터를 평행이동해도 길이와 방향은 바뀌지 않습니다.'},
      '1-B':{name:'외심·무게중심·세 수선의 교점',steps:['외심 O, 같은 반지름의 A,B,C','AB의 중점 M, OM ⟂ AB 확인','3OG = OH = OA+OB+OC (H: 세 수선의 교점)'],formula:'\\overrightarrow{OA}+\\overrightarrow{OB}+\\overrightarrow{OC}=3\\overrightarrow{OG}=\\overrightarrow{OH}',q:'삼각형 ABC의 외심을 O, 무게중심을 G, 세 꼭짓점에서 각각 대변에 내린 수선의 교점을 H라 할 때 벡터 합 OA+OB+OC를 나타내시오.',a:'3OG = OH',shortcut:'현 AB의 중점 M에서는 OM ⟂ AB입니다. OH=OA+OB+OC인 점 H에 대하여 CH=OA+OB=2OM이므로 CH ∥ OM, 즉 CH ⟂ AB가 되어 H는 C에서 AB에 내린 수선 위에 있습니다. 다른 두 꼭짓점에서도 같으므로 H는 세 수선의 교점입니다.'},
      '2-A':{name:'벡터의 뺄셈, 시점을 같게 하기, 끼인각',steps:['OA, OB와 끼인각 θ','시점을 원점으로 하여 −a와 b를 합성','OB−OA=AB 및 중점 비교'],formula:'\\overrightarrow{OB}-\\overrightarrow{OA}=\\overrightarrow{AB}',q:'한 변 4인 정삼각형 OAB에서 |OB−OA|와 |OA+OB|를 구하시오.',a:'4, 4√3',shortcut:'OB−OA는 A에서 B로 향하는 벡터 AB입니다. −a를 b에 더한 것도 평행이동하면 AB와 같습니다.'},
      '2-B':{name:'|PA+PB|=|PA−PB|인 점 P의 자취 (지름이 AB인 원)',steps:['선분 AB와 중점 M, 지름이 AB인 원','PA+PB=2PM','PA−PB=BA 및 ∠APB=90°'],formula:'|\\overrightarrow{PA}+\\overrightarrow{PB}|=|\\overrightarrow{PA}-\\overrightarrow{PB}|',q:'|PA+PB|=|PA−PB|인 점 P의 자취를 구하시오.',a:'선분 AB를 지름으로 하는 원',shortcut:'|2PM|=|BA| ⇒ PM=AB/2. 지름 AB인 원 위의 P에서는 ∠APB=90° (A,B 제외).'},
      '2-C':{name:'OP=αOA+βOB의 직선·삼각형·평행사변형 영역',steps:['두 벡터 OA, OB','OP=αOA+βOB 합성','α+β=k인 직선(AB와 평행)과 영역의 넓이'],formula:'\\overrightarrow{OP}=\\alpha\\overrightarrow{OA}+\\beta\\overrightarrow{OB}',q:'OP=αOA+βOB에서 α,β의 조건에 따른 P의 자취·영역을 관찰하시오.',a:'α+β=k: 평행한 직선 / α,β≥0, 합≤1: 삼각형 / 0≤α,β≤1: 평행사변형',shortcut:'α, β의 범위가 점 P의 위치 범위를 정합니다. 삼각형 OAB의 넓이를 S라 하면 삼각형 영역의 넓이는 S, 평행사변형 영역의 넓이는 2S입니다.'},
      '3-A':{name:'원의 중심을 지나는 벡터 분해 (OP=OC+CP)',steps:['원의 중심 C·반지름 r, d=|OC|','OP=OC+CP로 분해','최댓값 d+r, 최솟값 |d−r|'],formula:'\\overrightarrow{OP}=\\overrightarrow{OC}+\\overrightarrow{CP}',q:'중심 C(4,3), 반지름 2인 원 위의 P에서 |OP|의 최댓값 M과 최솟값 m 및 Mm을 구하시오.',a:'M=7, m=3, Mm=21',shortcut:'최솟값은 |d−r|이며 d<r일 때도 음수가 되지 않습니다. d=0이면 모든 점 P에서 |OP|=r입니다.'},
      '3-B':{name:'원 위의 점 P와 두 점 A, B의 중점 M',steps:['두 점 A, B와 중점 M','PA+PB=2PM','중심 C를 지나 PM=CM−CP로 분해'],formula:'\\overrightarrow{PA}+\\overrightarrow{PB}=2\\overrightarrow{PM}',q:'P가 중심 C, 반지름 r인 원을 움직일 때 |PA+PB|의 범위를 중점 M으로 나타내시오.',a:'2|CM−r| ≤ |PA+PB| ≤ 2(CM+r)',shortcut:'먼저 2PM으로 바꾸고 CM=d를 재면 최댓값 2(d+r), 최솟값 2|d−r|.'},
      '3-C':{name:'두 원 위의 점 P, Q 사이의 거리',steps:['두 원 C₁(r₁), C₂(r₂)','각 원 위의 점 P, Q와 C₁P, C₂Q','PQ=C₁C₂+C₂Q−C₁P'],formula:'\\overrightarrow{PQ}=\\overrightarrow{C_1C_2}+\\overrightarrow{C_2Q}-\\overrightarrow{C_1P}',q:'서로 다른 두 원 위 P,Q의 거리 |PQ|의 최댓값과 최솟값을 관찰하시오.',a:'최대 d+r₁+r₂, 최소 max(0, d−r₁−r₂, |r₁−r₂|−d)',shortcut:'두 원이 떨어져 있으면 최솟값 d−r₁−r₂; 한 원이 다른 원 안에 있으면 최솟값 |r₁−r₂|−d; 두 원이 만나면 0. (d는 두 중심 사이의 거리)'},
      '4-A':{name:'영벡터 합과 넓이의 비',steps:['αPA+βPB+γPC=0인 점 P','AB의 내분점 D: AD:DB=β:α','CP:PD=(α+β):γ, 세 삼각형의 넓이'],formula:'\\alpha\\overrightarrow{PA}+\\beta\\overrightarrow{PB}+\\gamma\\overrightarrow{PC}=\\vec 0',q:'2PA+3PB+5PC=0인 P에 대하여 △PBC:△PCA:△PAB를 구하시오.',a:'2:3:5 (A, B, C가 한 직선 위에 있지 않을 때)',shortcut:'꼭짓점의 좌표로 세 삼각형의 넓이를 직접 계산하여, 넓이의 비가 α:β:γ와 같은지 확인합니다.'},
      '4-B':{name:'kAP=mAB+nAC (꼭짓점 A를 시점으로 한 벡터 등식)',steps:['kAP=mAB+nAC를 준비','BE:EC=n:m인 내분점 E','AP=$\\frac{m+n}{k}$ · AE, 넓이의 비'],formula:'k\\overrightarrow{AP}=m\\overrightarrow{AB}+n\\overrightarrow{AC}',q:'10AP=3AB+5AC일 때 P와 E의 위치 및 분할 삼각형의 넓이비를 구하시오.',a:'AP=(4/5)AE, △PBC:△PCA:△PAB=2:3:5',shortcut:'E=(mB+nC)/(m+n), P=A+($\\frac{m+n}{k}$)(E−A). k>m+n이면 P는 삼각형 내부.'}
    };
    const P = (x,y)=>({x,y});
    const add=(a,b)=>P(a.x+b.x,a.y+b.y), sub=(a,b)=>P(a.x-b.x,a.y-b.y);
    const mul=(a,t)=>P(a.x*t,a.y*t), mid=(a,b)=>mul(add(a,b),.5);
    const norm=a=>Math.hypot(a.x,a.y), dist=(a,b)=>norm(sub(a,b));
    const pol=(r,t)=>P(r*Math.cos(t),r*Math.sin(t));
    const cross=(a,b)=>a.x*b.y-a.y*b.x;
    const area=(a,b,c)=>Math.abs(cross(sub(b,a),sub(c,a)))/2;
    const signedArea=(a,b,c)=>cross(sub(b,a),sub(c,a))/2;
    const bary=(a,b,c,aa,bb,cc)=>mul(add(add(mul(a,aa),mul(b,bb)),mul(c,cc)),1/(aa+bb+cc));
    const ZERO=P(0,0), deg=t=>(t*180/Math.PI+360)%360;
    const M4=()=>({A:state.T4_A,B:state.T4_B,C:state.T4_C});
    const weighted=()=>{const {A,B,C}=M4();return bary(A,B,C,state.alpha,state.beta,state.gamma)};
    const center3point=()=>add(state.C3,pol(state.r3,state.theta3));
    const double3=()=>({C1:state.circle2.C1,C2:state.circle2.C2,P:add(state.circle2.C1,pol(state.circle2.r1,state.circle2.thetaP)),Q:add(state.circle2.C2,pol(state.circle2.r2,state.circle2.thetaQ))});
    function circleMin(d,r1,r2) { return Math.max(0,d-r1-r2,Math.abs(r1-r2)-d); }
    const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
    let VM=0; // 0: 탐구, 1: 문제 탭(주어진 것만), 2: 정리 탭(풀이 단계)
    const fmt=x=>VM?String(Math.round(x*100)/100):(Math.abs(x)<0.00005?'0.00':x.toFixed(2));
    const cln=(n,p)=>VM&&state.cl?`${n}(${fmt(p.x)}, ${fmt(p.y)})`:n;
    const ccl=(C,r)=>VM&&state.cl?`C(${fmt(C.x)}, ${fmt(C.y)}), r=${fmt(r)}`:'중심 C';

  /* ===== 셸 상태(s)에서 원본 state 모양 만들기 ===== */
  function use(s) {
    state = {
      mode: +s.sid[0], subType: s.sid,
      A: P(s.Ax, s.Ay), B: P(s.Bx, s.By), slideT: s.slideT,
      C3: P(s.C3x, s.C3y), r3: s.r3, theta3: s.th3 * D2R,
      T4_A: P(s.TAx, s.TAy), T4_B: P(s.TBx, s.TBy), T4_C: P(s.TCx, s.TCy),
      alpha: s.alpha, beta: s.beta, gamma: s.gamma,
      angles1B: [s.a1 * D2R, s.a2 * D2R, s.a3 * D2R], r1B: s.r1b || 4,
      theta2B: s.th2b * D2R,
      lin: { a: s.la, b: s.lb, k: s.lk, region: s.region, seg: s.seg },
      circle2: { C1: P(s.c1x, s.c1y), C2: P(s.c2x, s.c2y), r1: s.rr1, r2: s.rr2, thetaP: s.thP * D2R, thetaQ: s.thQ * D2R },
      coeff: { k: s.ck, m: s.cm, n: s.cn },
      lens: s.lens,
      activePartIdx: s.part == null ? null : s.part,
      steps: { 1: s.step >= 1, 2: s.step >= 2, 3: s.step >= 3 }
    };
    return state;
  }

  /* ===== 원본의 그리기 도우미 → 새 무대 엔진 연결 (이름·인자는 원본과 같음) ===== */
  const canvasLabels = [];
  function labelAt(p, text, color = '#e2e8f0', offset = { x: 10, y: -15 }) {
    const s = BD.toS(p), c = BD.ctx, ins = BD.insets;
    const size = 12 * BD.fs;
    c.save(); c.font = `800 ${size}px ${BD.font}`;
    const tw = c.measureText(text).width + 10, th = Math.round(size * 1.5);
    c.restore();
    const W = BD.W - (ins.right || 0), top = (ins.top || 0) + 3, bottom = BD.H - (ins.bottom || 0) - 3;
    const opts = [[offset.x, offset.y], [offset.x, 27], [-tw - 9, -12], [-tw - 9, 25], [15, -35], [-tw - 10, -35], [15, 42]];
    const overlaps = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
    let chosen = null;
    for (const [ox, oy] of opts) {
      const box = { x: s.x + ox, y: s.y + oy - th, w: tw, h: th };
      if (box.x < 3 || box.x + tw > W - 3 || box.y < top || box.y + th > bottom) continue;
      if (canvasLabels.some((q) => overlaps(q, box))) continue;
      chosen = box; break;
    }
    if (!chosen) { // 자리가 없으면 겹치더라도 화면 안으로 밀어 넣어 보여 줍니다
      chosen = { x: clamp(s.x + offset.x, 3, Math.max(3, W - tw - 3)), y: clamp(s.y + offset.y - th, top, Math.max(top, bottom - th)), w: tw, h: th };
    }
    canvasLabels.push(chosen);
    BD.stext(chosen.x + 5, chosen.y + th / 2, text, { color, size: 12, align: 'left', baseline: 'middle', weight: 800 });
  }
  function emAlpha(part) { return BD._em({ part }) === -1 ? 0.16 : 1; }
  function seg(a, b, col = '#cbd5e1', wd = 1.8, dash = false, part = 0) {
    BD.seg(a, b, { color: col, width: wd, dash: dash ? [6, 5] : null, part });
  }
  function vec(a, b, col = '#fbbf24', text = '', part = 0, at = 0.56) {
    const p = BD.toS(a), q = BD.toS(b), dx = q.x - p.x, dy = q.y - p.y, L = Math.hypot(dx, dy);
    if (L < 1.5) return;
    seg(a, b, col, 3, false, part);
    const c = BD.ctx, k = BD.lw, al = emAlpha(part), ux = dx / L, uy = dy / L;
    c.save();
    c.fillStyle = BD.color(col, al < 1 ? al : undefined);
    if (BD.glowOn && al === 1) { c.shadowColor = BD.color(col, 0.7); c.shadowBlur = 8; }
    c.beginPath(); c.moveTo(q.x, q.y);
    c.lineTo(q.x - 13 * k * ux - 6 * k * uy, q.y - 13 * k * uy + 6 * k * ux);
    c.lineTo(q.x - 13 * k * ux + 6 * k * uy, q.y - 13 * k * uy - 6 * k * ux);
    c.closePath(); c.fill(); c.restore();
    if (text && (state.activePartIdx === null || state.activePartIdx === part)) labelAt(add(a, mul(sub(b, a), at)), text, col, { x: 12, y: -14 });
  }
  function dot(p, text = '', col = '#fbbf24', part = 0, off = { x: 10, y: -15 }) {
    BD.point(p, { color: col, r: state.activePartIdx === part ? 7 : 5.2, part });
    if (text === 'O' && state.mode !== 4) text = ''; // [2.0 수정] 무대 축이 이미 원점 O를 표시하므로 겹치는 두 번째 'O' 생략
    if (text &&(state.activePartIdx === null || state.activePartIdx === part)) labelAt(p, text, col, off);
  }
  function circle(p, r, col = '#38bdf8', part = 0, fill = false) {
    BD.circle(p, r, { color: col, width: 2, fill: fill ? 'rgba(56,189,248,.055)' : null, part });
  }
  function fillPoly(points, color, part = 0) {
    if (points.length < 3) return;
    BD.poly(points, { fill: color, color: null, part });
  }
  function arcAngle(o, a, b, r = 0.8, col = '#fef08a') {
    if (norm(sub(a, o)) < .01 || norm(sub(b, o)) < .01) return;

    '2-A': '<b>점 A, B</b>를 끌고 막대 <b>t</b>로 −a를 b에 더해 보세요. 어느 쪽으로 해도 OB−OA는 화살표 AB입니다.',
    '2-B': '<b>점 A, B</b>로 지름을, <b>점 P</b>로 원 위의 위치를 바꿔 보세요. P가 어디에 있어도 |PA+PB| = |BA|입니다.',
    '2-C': '<b>점 A, B</b>와 <b>점 P</b>를 끌고, ‘대표 조건’ 버튼으로 직선·삼각형·평행사변형 영역을 바꿔 보세요.',
    '3-A': '원 위의 <b>점 P</b>를 한 바퀴 돌려 보세요. 중심 C를 끌어 d를 바꾸면 최대 d+r, 최소 |d−r|이 따라 바뀝니다.',
    '3-B': '<b>점 A, B</b>(중점 M), <b>중심 C</b>, <b>점 P</b>를 끌어 보세요. |PA+PB| = 2|PM|의 범위가 실시간으로 나옵니다.',
    '3-C': '<b>두 점 P, Q</b>와 <b>두 중심 C₁, C₂</b>를 끌어 보세요. 원이 떨어졌을 때·교차할 때·포함될 때 최솟값이 달라집니다.',
    '4-A': '<b>삼각형의 꼭짓점</b>을 끌거나 계수 막대 <b>α, β, γ</b>를 바꿔 보세요. 측정한 넓이의 비가 α : β : γ와 같습니다.',
    '4-B': '<b>삼각형의 꼭짓점</b>을 끌거나 계수 막대 <b>m, n, k</b>를 바꿔 보세요. P는 AE를 $\\frac{m+n}{k}$ 로 줄인 점입니다.'
  };
  const PCOL = ['sky', 'rose', 'amber', 'green'];
  const RCOL = ['sky', 'rose', 'amber', 'green'];

  /* ===== 슬라이더 정렬 표시(원본 '최소/최대 정렬!') ===== */
  function alignNote(s) {
    use(s);
    const A = state.A, B = state.B, C = state.C3;
    const anchor = s.sid === '3-A' ? ZERO : mid(A, B), u = sub(anchor, C), ang = Math.atan2(u.y, u.x);
    const ad = Math.atan2(Math.sin(state.theta3 - ang), Math.cos(state.theta3 - ang));
    return Math.abs(ad) < .035 ? ' (최솟값 위치)' : Math.abs(Math.abs(ad) - Math.PI) < .035 ? ' (최댓값 위치)' : '';
  }
  const mod360 = (x) => ((x % 360) + 360) % 360;

  /* ===== 장면 만들기 ===== */
  const CONTROLS = {
    '1-A': ['slideT', 'angB'], '2-A': ['slideT', 'angB'],
    '1-B': ['a1', 'a2', 'a3'], '2-B': ['th2b'],
    '3-A': ['th3', 'r3'], '3-B': ['th3', 'r3'], '3-C': ['thP', 'thQ', 'rr1', 'rr2'],
    '4-A': ['alpha', 'beta', 'gamma'], '4-B': ['cm', 'cn', 'ck']
  };
  const LENS_CHIPS = [
    { group: '강조해서 볼 요소', label: '벡터 중심으로 보기', apply: (s) => { s.lens = 'vector'; }, on: (st) => st.lens === 'vector' },
    { group: '강조해서 볼 요소', label: '도형 중심으로 보기', apply: (s) => { s.lens = 'geometry'; }, on: (st) => st.lens === 'geometry' }
  ];
  const presetChips = (id) => PRESET_DEFS[id].map((d, i) => {
    const { num, oth } = split(d.patch);
    return {
      group: '대표 조건', label: d.name,
      apply: (s, lab) => { applyPatch(s, oth); s.pi = i; if (lab) lab.board.setFocus(focusOf({ ...s, ...d.patch }, id), true); },
      set: num,
      on: (st) => st.pi === i
    };
  });
  function snapPatch(id, s) {
    const d = PRESET_DEFS[id][0], { num, oth } = split(d.patch);
    applyPatch(s, oth); s.pi = 0;
    if (window.lab && s === window.lab.s) window.lab.board.setFocus(focusOf({ ...s, ...d.patch }, id), true);
    return num;
  }
  const ACTIONS = () => [{
    id: 'play', play: true, icon: (s) => (s.playing ? 'pause' : 'play'), label: (s) => (s.playing ? '일시 정지' : '자동 회전'), on: (s) => s.playing,
    run: (s) => { s.playing = !s.playing; if (s.playing) { s.animPhase = 0; s.animAnchor = s.TAx; } }
  }];
  function tickOf(id) {
    return (s, dt) => {
      if (!s.playing) return false;
      const f = dt * 60;
      s.animPhase += 0.015 * f;
      if (id === '1-A' || id === '2-A') {
        const L = Math.hypot(s.Bx, s.By), t = Math.atan2(s.By, s.Bx) + 0.012 * f;
        s.Bx = L * Math.cos(t); s.By = L * Math.sin(t);
      } else if (id === '1-B') s.a3 = mod360(s.a3 + 0.012 * f * R2D);
      else if (id === '2-B') s.th2b = mod360(s.th2b + 0.014 * f * R2D);
      else if (id === '2-C') {
        const line = s.region === 'line', a = line ? s.lk : 1;
        s.la = line ? s.lk / 2 + Math.sin(s.animPhase) * 1.25 : clamp(a * (.5 + .5 * Math.sin(s.animPhase)), 0, a);
        s.lb = line ? s.lk - s.la : s.region === 'triangle' ? (1 - s.la) * (.5 + .5 * Math.cos(s.animPhase * .81)) : (.5 + .5 * Math.cos(s.animPhase * .81));
      } else if (id === '3-A' || id === '3-B') s.th3 = mod360(s.th3 + 0.015 * f * R2D);
      else if (id === '3-C') { s.thP = mod360(s.thP + 0.012 * f * R2D); s.thQ = mod360(s.thQ - 0.014 * f * R2D); }
      else if (id === '4-A' || id === '4-B') s.TAx = s.animAnchor + .6 * Math.sin(s.animPhase);
      return true;
    };
  }

  /* ===== 끌 수 있는 점(원본 currentHandles / handlePointerMove 규칙 그대로) ===== */
  function drawHandles(b, s, id) {
    const st = state;
    const bound = (w) => ({ x: clamp(w.x, -20, 20), y: clamp(w.y, -16, 16) });
    const pt = (kx, ky) => (w) => { const q = bound(w); s[kx] = q.x; s[ky] = q.y; if (s.playing && kx === 'TAx') s.animAnchor = s.TAx; };
    const H = (key, p, color, drag, aria) => b.handle(key, p, { color, drag, ariaLabel: aria });
    if (['1-A', '2-A', '2-B', '2-C', '3-B'].includes(id)) { H('A', st.A, 'sky', pt('Ax', 'Ay'), '점 A'); H('B', st.B, 'rose', pt('Bx', 'By'), '점 B'); }
    if (id === '1-B') ['a1', 'a2', 'a3'].forEach((k, i) => H('ANG' + i, pol(st.r1B, st.angles1B[i]), ['sky', 'rose', 'green'][i], (w) => { s[k] = deg(Math.atan2(w.y, w.x)); }, '점 ' + 'ABC'[i]));
    if (id === '2-B') H('P2B', add(mid(st.A, st.B), pol(dist(st.A, st.B) / 2, st.theta2B)), 'amber', (w) => { const M = mid(P(s.Ax, s.Ay), P(s.Bx, s.By)); s.th2b = deg(Math.atan2(w.y - M.y, w.x - M.x)); }, '점 P');
    if (id === '2-C') H('P2C', add(mul(st.A, st.lin.a), mul(st.B, st.lin.b)), 'amber', (w) => {
      const A = P(s.Ax, s.Ay), B = P(s.Bx, s.By), det = cross(A, B), reg = s.region;
      if (Math.abs(det) > 1e-6) {
        const alpha = cross(w, B) / det, beta = cross(A, w) / det;
        if (reg === 'line') { s.la = clamp((alpha - beta + s.lk) / 2, -3, 5); s.lb = s.lk - s.la; }
        else if (reg === 'triangle') { s.la = Math.max(0, alpha); s.lb = Math.max(0, beta); const sum = s.la + s.lb; if (sum > 1) { s.la /= sum; s.lb /= sum; } }
        else { s.la = clamp(alpha, 0, 1); s.lb = clamp(beta, 0, 1); }
      }
    }, '점 P');
    if (id === '3-A' || id === '3-B') {
      H('P3', center3point(), 'amber', (w) => { s.th3 = deg(Math.atan2(w.y - s.C3y, w.x - s.C3x)); }, '점 P');
      H('C3', st.C3, 'sky', pt('C3x', 'C3y'), '원의 중심 C');
    }
    if (id === '3-C') {
      const d = double3();
      H('P2', d.P, 'sky', (w) => { s.thP = deg(Math.atan2(w.y - s.c1y, w.x - s.c1x)); }, '점 P');
      H('Q2', d.Q, 'amber', (w) => { s.thQ = deg(Math.atan2(w.y - s.c2y, w.x - s.c2x)); }, '점 Q');
      H('C1', d.C1, 'sky', pt('c1x', 'c1y'), '중심 C₁');
      H('C2', d.C2, 'rose', pt('c2x', 'c2y'), '중심 C₂');
    }
    if (id === '4-A' || id === '4-B') {
      H('T4_A', st.T4_A, 'sky', pt('TAx', 'TAy'), '꼭짓점 A');
      H('T4_B', st.T4_B, 'rose', pt('TBx', 'TBy'), '꼭짓점 B');
      H('T4_C', st.T4_C, 'green', pt('TCx', 'TCy'), '꼭짓점 C');
    }
  }

  function sceneOf(id) {
    const inf = INFO[id];
    return {
      id, title: inf.name, short: `${id} · ${inf.name}`, thumbSnap: false,
      question: QUESTION[id], guide: GUIDE[id],
      controls: id === '2-C' ? (s) => (s.region === 'line' ? ['laL', 'lbL', 'lk'] : ['la', 'lb']) : CONTROLS[id],
      presets: () => presetChips(id).concat(LENS_CHIPS),
      actions: ACTIONS,
      steps: inf.steps,
      enter: (s) => {
        s.sid = id;
        if (id === '2-C') Object.assign(s, { Ax: 4, Ay: 2, Bx: 2, By: 4 });
        applyPatch(s, PRESET_DEFS[id][0].patch);
        s.pi = 0; s.animPhase = 0; s.animAnchor = s.TAx;
      },
      focus: (s) => focusOf(s, id),
      tick: tickOf(id),
      view: (s) => {
        s.sid = id;
        if (id === '1-A' || id === '2-A') s.angB = deg(Math.atan2(s.By, s.Bx));
        if (id === '2-C' && s.region === 'line') { s.laL = s.la; s.lbL = s.lb; }
        use(s);
        const m = monitor();
        const v = {
          guide: GUIDE[id],
          chips: [{ k: '핵심 항등식', tex: m.eq, color: 'amber' }].concat(m.subtext ? [{ k: '', html: esc(m.subtext), color: 'sky' }] : []),
          readouts: m.labels.map((label, i) => ({ label, value: m.vals[i], color: RCOL[i], wide: String(m.vals[i]).length > 13 })),
          parts: PARTS[id].map((name, i) => ({ id: i, name, color: PCOL[i] })),
          formula: '<div style="text-align:center">' + APLab.tex(m.eq, true) + '</div>'
        };
        if (id === '2-B' || id === '4-A' || id === '4-B') v.status = Number.isFinite(m.error) ? { tone: 'ok', text: `오차 ${fmt(m.error)}` } : { tone: 'warn', text: '삼각형이 되지 않아 비를 계산할 수 없음' };
        return v;
      },
      draw: (b, s, v) => {
        BD = b; s.sid = id; use(s);
        canvasLabels.length = 0; BANNER.length = 0;
        if (s.grid) b.grid();
        if (state.mode !== 4) b.axes();
        renderScenario();
        drawHandles(b, s, id);
        v.tape = BANNER[0] ? { title: BANNER[0] + (BANNER[1] ? '  ·  ' + BANNER[1] : '') } : null;
      },
      problem: {
        tag: '벡터의 덧셈과 뺄셈의 활용',
        text: (s) => { s.sid = id; use(s); return esc(dynExam().question); },
        answer: (s) => { s.sid = id; use(s); return esc(dynExam().answer); },
        snap: (s) => snapPatch(id, s)
      },
      solution: {
        standardTitle: '교과서식 풀이', standardTag: '기본 풀이',
        quickTitle: '10초 컷 · 핵심 성질을 이용한 풀이', quickTag: '10초 컷',
        standard: () => ({
          steps: '<b>정의에 따른 풀이</b><br>' + inf.steps.map((t, i) => `${i + 1}. ${esc(t)}`).join('<br>'),
          warning: '벡터 성분 및 길이는 실제 점의 위치가 바뀌면 다시 계산해야 합니다. 발문·정답은 지금 그림의 값을 기준으로 합니다.'
        }),
        quick: () => ({ steps: esc(inf.shortcut), highlight: `핵심: ${inf.name} · 탐구 탭의 ‘지금 보이는 값’에서 현재 그림의 값을 확인하세요.` })
      }
    };
  }

  /* ======================================================================
     새 장면 (평가원·교육청 기출 핵심 유형) 공통 도우미 NQ
     - 기존 장면은 손대지 않고, 뒤에 새 장면을 더했습니다(실험실마다 같은 도우미 블록).
     - 탭마다 그림이 다릅니다: 탐구 = 조작하는 그림 전체 / 정리 = 풀이 단계별 강조 / 문제 = 지문에 주어진 값만(답·보조선 없음)
     - 「숫자 바꾸기」: 변형 생성기(gen)가 문제 글·그림·정답을 함께 바꿉니다(연속해서 같은 문제는 나오지 않음).
     - 원문은 싣지 않고 숫자·상황을 바꾼 변형만 싣고, problem.tag 에 출처 유형을 적습니다.
     ====================================================================== */
  const NQ = (() => {
    const clamp = APLab.clamp, tex = APLab.tex;
    const rint = (n) => Math.floor(Math.random() * n);
    const pickOf = (arr, not) => { let x; do x = arr[rint(arr.length)]; while (arr.length > 1 && x === not); return x; };
    const P = (x, y) => ({ x, y });
    const add = (a, b) => P(a.x + b.x, a.y + b.y), sub = (a, b) => P(a.x - b.x, a.y - b.y), mul = (a, t) => P(a.x * t, a.y * t);
    const dot = (a, b) => a.x * b.x + a.y * b.y, crs = (a, b) => a.x * b.y - a.y * b.x, len = (a) => Math.hypot(a.x, a.y);
    const lerp = (a, b, t) => add(a, mul(sub(b, a), t));
    const polar = (c, r, deg) => P(c.x + r * Math.cos(deg * Math.PI / 180), c.y + r * Math.sin(deg * Math.PI / 180));
    const gcd = (a, b) => (b ? gcd(b, a % b) : Math.abs(a));
    // 표시용 숫자(정수는 그대로, 아니면 소수 둘째 자리까지, 음수는 − 기호)
    const num = (x) => { const r = Math.abs(x - Math.round(x)) < 1e-9 ? String(Math.round(x)) : String(Math.round(x * 100) / 100); return (r === '-0' ? '0' : r).replace('-', '−'); };
    const sgnTex = (x) => (x < 0 ? '-' : '') + Math.abs(x);
    // 분수 n/d 를 약분해 {tex, val}
    function frac(n, d) {
      const g = gcd(n, d) || 1; n /= g; d /= g;
      if (d < 0) { n = -n; d = -d; }
      return { tex: d === 1 ? String(n) : `${n < 0 ? '-' : ''}\\dfrac{${Math.abs(n)}}{${d}}`, val: n / d };
    }
    // 변형 생성기: gen(이전 변형|null) → 새 변형. 처음에는 기출 유형 그대로(gen(null)).
    function varier(gen) { const v = { n: 0, cur: () => v._c, next: () => { v.n++; v._c = gen(v._c); return v._c; }, _c: null }; v._c = gen(null); return v; }
    const probHTML = (body) => `${body}<div style="margin-top:10px"><button type="button" class="apl-btn sm" data-nq-new>숫자 바꾸기</button></div>`;
    document.addEventListener('click', (ev) => {
      const hit = ev.target && ev.target.closest && ev.target.closest('[data-nq-new]');
      if (!hit) return;
      const lab = window.lab, sc = lab && lab.scene;
      if (!sc || !sc.vary) return;
      sc.vary.next();
      lab.s.revealed = false;
      lab.setStep(1);
      try { lab._buildReview(); } catch (e) { /* 키트가 바뀌어도 그림은 그대로 */ }
      lab.invalidate(true);
    });

    // 화면 크기·여백·탭이 바뀔 때만 그림(라벨 글자 상자까지)을 무대에 맞춥니다. 끌기 중에는 다시 맞추지 않습니다.
    function fit(b, key, content) {
      if (b.thumb) return;
      const ins = b.insets || {};
      const k = [key, b.W, b.H, Math.round(ins.top || 0), Math.round(ins.right || 0), Math.round(ins.bottom || 0)].join('|');
      if (b.__nq === k) return;
      b.__nq = k;
      // 새 장면은 휴대폰에서 핵심 도형이 무대 폭의 절반 이상이 되도록 바깥 여유(pad)를 줄여 맞춥니다(라벨 글자 상자는 그대로 지킴).
      // 라벨 자리는 배율에 따라 달라지므로 맞춘 배율에서 한 번 더 재어 다시 맞춥니다.
      const pad0 = b.pad, pad1 = 0.012;
      for (let pass = 0; pass < 2; pass++) {
        b.pad = pad1;
        const bb = b.measure(content);
        const f = bb && b.fitBox(bb, { margin: 0.02, px: 8 });
        b.pad = pad0;
        if (!f) return;
        const a = b._area(), m = Math.min(a.w, a.h), p0 = pad0 * m, p1 = pad1 * m;
        const cx = (f.x[0] + f.x[1]) / 2, cy = (f.y[0] + f.y[1]) / 2;
        const hw = ((f.x[1] - f.x[0]) / 2) * (a.w - 2 * p0) / (a.w - 2 * p1), hh = ((f.y[1] - f.y[0]) / 2) * (a.h - 2 * p0) / (a.h - 2 * p1);
        b.setFocus({ x: [cx - hw, cx + hw], y: [cy - hh, cy + hh] }, true);
      }
    }
    // 좌표축: 눈금 숫자는 그림의 선·라벨과 겹치므로 빼고(점의 좌표는 지문·라벨에 적혀 있음), 원점·축 이름만 둡니다.
    function axes(b) {
      b.axes({ ticks: false });
      const a = b._area(), o = b.toS(0, 0), st = { color: 'muted', size: 13, weight: 700, baseline: 'middle' };
      if (o.y > a.y && o.y < a.y + a.h) b.stext(a.x + a.w - 10, o.y - 12, 'x', { ...st, align: 'right' });
      if (o.x > a.x && o.x < a.x + a.w) b.stext(o.x + 10, a.y + 12, 'y', { ...st, align: 'left' });
    }
    // 화살표(벡터)
    function vec(b, p, q, o = {}) {
      const S = b.toS(p), T = b.toS(q), dx = T.x - S.x, dy = T.y - S.y, L = Math.hypot(dx, dy);
      if (L < 3) return;
      const c = b.ctx, ux = dx / L, uy = dy / L, k = b.lw || 1;
      const hl = Math.min(13 * k, L * 0.45), hw = hl * 0.46, col = o.color || 'ink';
      c.save();
      b._stroke({ color: col, width: o.width || 3, dash: o.dash, alpha: o.alpha, glow: o.glow, part: o.part, ref: o.ref }, 3);
      c.beginPath(); c.moveTo(S.x, S.y); c.lineTo(T.x - ux * hl * 0.7, T.y - uy * hl * 0.7); c.stroke();
      c.setLineDash([]); c.shadowBlur = 0;
      c.fillStyle = b.color(col, o.alpha);
      c.beginPath(); c.moveTo(T.x, T.y); c.lineTo(T.x - ux * hl - uy * hw, T.y - uy * hl + ux * hw); c.lineTo(T.x - ux * hl + uy * hw, T.y - uy * hl - ux * hw); c.closePath(); c.fill();
      c.restore();
    }

  function upgradeOld(sc, id) {
    const inf = INFO[id], pd = PRESET_DEFS[id][0];
    const CL0 = { '1-A': true, '1-B': false, '2-A': false, '2-B': true, '2-C': true, '3-A': true, '3-B': true, '3-C': true, '4-A': false, '4-B': false };
    const W0 = { '4-A': [2, 3, 5], '4-B': [2, 3, 5] };
    const v0 = {
      patch: (id === '3-A' || id === '3-B') ? { ...pd.patch, th3: (pd.patch.th3 + 200) % 360 } : { ...pd.patch }, cl: CL0[id], w: W0[id], area: W0[id] ? 10 : 0,
      text: esc(inf.q), ans: esc(inf.a), steps: inf.steps, old: true,
      chips: [{ tex: inf.formula, color: 'amber' }]
    };
    const list = [v0].concat(OV.POOL[id].map(OV.B[id]));
    const vary = NQ.varier((prev) => (prev ? NQ.pickOf(list, prev) : list[0]));
    const cur = () => vary.cur();
    vary.go = (i) => { vary.n++; vary._c = list[i]; return vary._c; }; vary.size = list.length; // 검사용
    const oldDraw = sc.draw, oldView = sc.view, oldSteps = sc.steps, oldSol = sc.solution;
    const away = () => !!(window.lab && window.lab.tab && window.lab.tab !== 'explore');
    sc.vary = vary;
    sc.steps = () => (away() ? cur().steps : oldSteps);
    sc.reviewTop = () => `<div class="apl-rich" style="font-size:var(--fs-sm);line-height:1.75"><small style="color:var(--text-3);font-weight:800">문제</small><br>${cur().text}</div>`;
    sc.problem = {
      tag: '벡터의 덧셈과 뺄셈의 활용', time: '목표 시간: 40초',
      text: () => `${cur().text}<div style="margin-top:10px"><button type="button" class="apl-btn sm" data-nq-new>새 문제</button></div>`,
      answer: () => cur().ans
    };
    sc.solution = {
      ...oldSol,
      standard: (s) => { const I = cur(); return I.old ? oldSol.standard(s) : { steps: OV.stdOf(I.steps), warning: '문제의 조건에서 먼저 어떤 벡터(또는 점)를 잡을지 정하세요. 크기를 그냥 더하거나 빼지 않도록 주의합니다.' }; },
      quick: (s) => { const I = cur(); return I.old ? oldSol.quick(s) : { steps: I.quick, highlight: `핵심: ${inf.name}` }; }
    };
    sc.view = (s, lab) => {
      if (!lab || lab.tab === 'explore') return oldView(s, lab);
      return { chips: cur().chips.map((c, i) => ({ ...c, answer: c.answer || i === 0 })), formula: '<div style="text-align:center">' + APLab.tex(inf.formula, true) + '</div>' };
    };
    sc.draw = (b, s, v, lab) => {
      const tab = lab ? lab.tab : 'explore';
      if (tab === 'explore') {
        if (b.__ovk && b.__ovk !== 'e') b.setFocus(focusOf(s, id), true);
        b.__ovk = 'e';
        return oldDraw(b, s, v, lab);
      }
      const I = cur(), s2 = { ...s, ...I.patch, sid: id, step: tab === 'problem' ? 0 : s.step, part: null, lens: 'vector', playing: false };
      const key = [id, tab === 'problem' ? 'p' : 'r', vary.n, b.W, b.H].join('|');
      if (b.__ovk !== key) { b.__ovk = key; b.setFocus(focusOf(s2, id, true), true); }
      VM = tab === 'problem' ? 1 : 2;
      try {
        BD = b; use(s2);
        state.cl = I.cl; state.area = I.area; state.areaGiven = !I.old && !!I.area; state.w = I.w;
        canvasLabels.length = 0; BANNER.length = 0;
        if (s.grid) b.grid();
        if (state.mode !== 4) b.axes();
        renderScenario();
      } finally { VM = 0; }
      v.tape = null;
    };
    return sc;
  }
