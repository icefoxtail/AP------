<script>
/* ==========================================================================
   기하 · 벡터의 덧셈과 뺄셈 (AP Math Lab 2.0 이식본) — 4개 묶음 × 10개 장면
   원본: labs/기하와벡터/벡터의덧셈과뺄셈.html
   - 장면 정의(SUBS·PARTS·INFO), 벡터 수학 함수, 장면 그리기(renderScenario), 프리셋 값,
     실시간 값(updateSceneMonitor)과 동적 발문·정답(updateDynamicExam)은 원본 코드를 그대로 옮겼습니다.
   - 원본의 canvas 직접 그리기 도우미(seg·vec·dot·circle·fillPoly·labelAt·banner)만 같은 이름으로 새 무대 엔진에 연결했습니다.
   - 바뀐 점: 셸·레이아웃은 공용 키트가 담당, 무대는 1:1 축척, 점은 후광이 있는 손잡이로 끌기,
     원본의 떠 있는 안내 상자·하단 띠는 수식 칩·하단 띠로 이동, 장면 값은 막대(슬라이더)와 URL로 공유.
   ========================================================================== */
window.addEventListener('DOMContentLoaded', function () {
  const esc = APLab.esc;
  const R2D = 180 / Math.PI, D2R = Math.PI / 180;
  let BD = null;    // 지금 그리는 무대
  let state = null; // 지금 장면의 값(원본 state와 같은 이름·모양으로 셸 상태 s에서 만듭니다)
  const BANNER = [];

  /* ===== 원본 그대로: 장면 정의, 관찰 조각, 정보, 벡터 수학 도우미 (원본 1705–1746행) ===== */
    const SUBS = {1:['1-A','1-B'],2:['2-A','2-B','2-C'],3:['3-A','3-B','3-C'],4:['4-A','4-B']};
    const PARTS = {
      '1-A':['위치벡터 OA·OB','삼각형법 평행이동','합벡터 a+b','중점벡터 OM'],
      '1-B':['외접원과 세 반지름','현 AB의 중점·수선','무게중심 OG','수심 OH'],
      '2-A':['위치벡터·끼인각','역벡터 -a','차벡터 AB','중점·합벡터'],
      '2-B':['지름 AB·자취원','PA+PB = 2PM','PA-PB = BA','직각 APB'],
      '2-C':['기저 OA·OB','계수별 위치벡터','등비선/영역 경계','점 P·영역 넓이'],
      '3-A':['중심 C와 원','고정벡터 OC','회전벡터 CP','합벡터 OP·극값'],
      '3-B':['원 C와 선분 AB','중점 M·PM','회전벡터 CP','거리 극값'],
      '3-C':['원 C₁의 동점 P','원 C₂의 동점 Q','중심벡터 C₁C₂','합성벡터 PQ'],
      '4-A':['가중 벡터 PA·PB·PC','내분점 D·직선 CD','분할 삼각형 실제 넓이','계수 합 영벡터'],
      '4-B':['기저 AB·AC','선분 BC의 내분점 E','AP의 2단 내분','3분할 넓이 비']
    };
    const INFO = {
      '1-A':{name:'덧셈·중점벡터 2배 치환',steps:['점 A, B와 벡터 OA, OB','평행사변형·삼각형법 평행이동','선분 AB 중점 M: a+b=2OM'],formula:'\\overrightarrow{OA}+\\overrightarrow{OB}=2\\overrightarrow{OM}',q:'A(4,2), B(2,4)이고 M이 AB의 중점일 때 |OA+OB| 및 |OM|을 구하시오.',a:'|OA+OB|=6√2, |OM|=3√2',shortcut:'중점 M을 먼저 찍으면 a+b=2OM. 평행이동 t는 b의 길이와 방향을 바꾸지 않습니다.'},
      '1-B':{name:'외심·무게중심·수심',steps:['외심 O, 같은 반지름의 A,B,C','AB 중점 M, OM ⟂ AB 확인','3OG = OH = OA+OB+OC'],formula:'\\overrightarrow{OA}+\\overrightarrow{OB}+\\overrightarrow{OC}=3\\overrightarrow{OG}=\\overrightarrow{OH}',q:'삼각형 ABC의 외심을 O, 무게중심을 G, 수심을 H라 할 때 벡터 합 OA+OB+OC를 나타내시오.',a:'3OG = OH',shortcut:'현 AB의 중점 M에서는 OM ⟂ AB. CH=OA+OB=2OM으로 H가 수심임을 알 수 있습니다.'},
      '2-A':{name:'뺄셈·시점 통일과 끼인각',steps:['OA, OB와 정확한 끼인각 θ','원점에서 -a와 b를 합성','OB−OA=AB 및 중점 비교'],formula:'\\overrightarrow{OB}-\\overrightarrow{OA}=\\overrightarrow{AB}',q:'한 변 4인 정삼각형 OAB에서 |OB−OA|와 |OA+OB|를 구하시오.',a:'4, 4√3',shortcut:'종점 B에서 시점 A를 빼면 화살표 AB. -a를 b에 더한 것도 평행이동하면 AB입니다.'},
      '2-B':{name:'벡터 합·차가 같은 지름원 자취',steps:['선분 AB와 중점 M·지름원','PA+PB=2PM','PA−PB=BA 및 ∠APB=90°'],formula:'|\\overrightarrow{PA}+\\overrightarrow{PB}|=|\\overrightarrow{PA}-\\overrightarrow{PB}|',q:'|PA+PB|=|PA−PB|인 점 P의 자취를 구하시오.',a:'선분 AB를 지름으로 하는 원',shortcut:'|2PM|=|BA| ⇒ PM=AB/2. 지름 AB인 원 위의 P에서는 ∠APB=90° (A,B 제외).'},
      '2-C':{name:'일차결합의 등비선·삼각형·평행사변형 영역',steps:['OA, OB 기저벡터','OP=αOA+βOB 실시간 합성','α+β=k 평행선과 영역 넓이'],formula:'\\overrightarrow{OP}=\\alpha\\overrightarrow{OA}+\\beta\\overrightarrow{OB}',q:'OP=αOA+βOB에서 α,β의 조건에 따른 P의 자취·영역을 관찰하시오.',a:'α+β=k: 평행한 직선 / α,β≥0, 합≤1: 삼각형 / 0≤α,β≤1: 평행사변형',shortcut:'계수의 범위가 바로 좌표계입니다. 삼각형의 면적 S=|OA×OB|/2, 평행사변형은 2S.'},
      '3-A':{name:'원 중심 경유 벡터 분해',steps:['원의 중심 C·반지름 r','OP=OC+CP 분해','최대 d+r, 최소 |d−r|'],formula:'\\overrightarrow{OP}=\\overrightarrow{OC}+\\overrightarrow{CP}',q:'중심 C(4,3), 반지름 2인 원 위의 P에서 |OP|의 최댓값 M과 최솟값 m 및 Mm을 구하시오.',a:'M=7, m=3, Mm=21',shortcut:'최단거리는 |d−r|이며 d<r에서도 음수가 되지 않습니다. d=0이면 모두 |OP|=r입니다.'},
      '3-B':{name:'동점 P와 두 정점의 중점·원중심 2단 분해',steps:['정점 A,B와 중점 M','PA+PB=2PM','중심 C를 거쳐 PM=CM−CP'],formula:'\\overrightarrow{PA}+\\overrightarrow{PB}=2\\overrightarrow{PM}',q:'P가 중심 C, 반지름 r인 원을 움직일 때 |PA+PB|의 범위를 중점 M으로 나타내시오.',a:'2|CM−r| ≤ |PA+PB| ≤ 2(CM+r)',shortcut:'먼저 2PM으로 바꾸고 CM=d를 재면 최댓값 2(d+r), 최솟값 2|d−r|.'},
      '3-C':{name:'두 원 위 동점의 이중 중심 분해',steps:['두 원 C₁(r₁), C₂(r₂)','각 원 위 P,Q와 회전벡터','PQ=C₁C₂+C₂Q−C₁P'],formula:'\\overrightarrow{PQ}=\\overrightarrow{C_1C_2}+\\overrightarrow{C_2Q}-\\overrightarrow{C_1P}',q:'서로 다른 두 원 위 P,Q의 거리 |PQ|의 최댓값과 최솟값을 관찰하시오.',a:'최대 d+r₁+r₂, 최소 max(0, d−r₁−r₂, |r₁−r₂|−d)',shortcut:'두 원이 떨어져 있으면 최단 d−r₁−r₂; 완전히 포함되면 최단 |r₁−r₂|−d; 교차하면 0.'},
      '4-A':{name:'영벡터 합과 실제 넓이비',steps:['αPA+βPB+γPC=0의 점 P','AB 내분점 D: AD:DB=β:α','CP:PD=(α+β):γ, 실제 외적 넓이'],formula:'\\alpha\\overrightarrow{PA}+\\beta\\overrightarrow{PB}+\\gamma\\overrightarrow{PC}=\\vec 0',q:'2PA+3PB+5PC=0인 P에 대하여 △PBC:△PCA:△PAB를 구하시오.',a:'2:3:5 (ABC가 퇴화하지 않을 때)',shortcut:'실제 꼭짓점 좌표로 세 분할 넓이를 외적 계산하며, 넓이의 비가 α:β:γ인지를 잔차로 검증합니다.'},
      '4-B':{name:'꼭짓점 시점 방정식·2단 내분',steps:['kAP=mAB+nAC를 준비','BE:EC=n:m인 내분점 E','AP=(m+n)/k · AE, 넓이비 변환'],formula:'k\\overrightarrow{AP}=m\\overrightarrow{AB}+n\\overrightarrow{AC}',q:'10AP=3AB+5AC일 때 P와 E의 위치 및 분할 삼각형의 넓이비를 구하시오.',a:'AP=(4/5)AE, △PBC:△PCA:△PAB=2:3:5',shortcut:'E=(mB+nC)/(m+n), P=A+((m+n)/k)(E−A). k>m+n이면 P는 삼각형 내부.'}
    };
    const P = (x,y)=>({x,y});
    const add=(a,b)=>P(a.x+b.x,a.y+b.y), sub=(a,b)=>P(a.x-b.x,a.y-b.y);
    const mul=(a,t)=>P(a.x*t,a.y*t), mid=(a,b)=>mul(add(a,b),.5);
    const norm=a=>Math.hypot(a.x,a.y), dist=(a,b)=>norm(sub(a,b));
    const pol=(r,t)=>P(r*Math.cos(t),r*Math.sin(t));
    const cross=(a,b)=>a.x*b.y-a.y*b.x;
    const area=(a,b,c)=>Math.abs(cross(sub(b,a),sub(c,a)))/2;
    const signedArea=(a,b,c)=>cross(sub(b,a),sub(c,a))/2;
    const bary=(a,b,c,aa,bb,cc)=>mul(add(add(mul(a,aa),mul(b,bb)),mul(c,cc)),1/(aa+bb+cc));
    const ZERO=P(0,0), deg=t=>(t*180/Math.PI+360)%360;
    const M4=()=>({A:state.T4_A,B:state.T4_B,C:state.T4_C});
    const weighted=()=>{const {A,B,C}=M4();return bary(A,B,C,state.alpha,state.beta,state.gamma)};
    const center3point=()=>add(state.C3,pol(state.r3,state.theta3));
    const double3=()=>({C1:state.circle2.C1,C2:state.circle2.C2,P:add(state.circle2.C1,pol(state.circle2.r1,state.circle2.thetaP)),Q:add(state.circle2.C2,pol(state.circle2.r2,state.circle2.thetaQ))});
    function circleMin(d,r1,r2) { return Math.max(0,d-r1-r2,Math.abs(r1-r2)-d); }
    const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
    const fmt=x=>Math.abs(x)<0.00005?'0.00':x.toFixed(2);

  /* ===== 셸 상태(s)에서 원본 state 모양 만들기 ===== */
  function use(s) {
    state = {
      mode: +s.sid[0], subType: s.sid,
      A: P(s.Ax, s.Ay), B: P(s.Bx, s.By), slideT: s.slideT,
      C3: P(s.C3x, s.C3y), r3: s.r3, theta3: s.th3 * D2R,
      T4_A: P(s.TAx, s.TAy), T4_B: P(s.TBx, s.TBy), T4_C: P(s.TCx, s.TCy),
      alpha: s.alpha, beta: s.beta, gamma: s.gamma,
      angles1B: [s.a1 * D2R, s.a2 * D2R, s.a3 * D2R], r1B: 4,
      theta2B: s.th2b * D2R,
      lin: { a: s.la, b: s.lb, k: s.lk, region: s.region },
      circle2: { C1: P(s.c1x, s.c1y), C2: P(s.c2x, s.c2y), r1: s.rr1, r2: s.rr2, thetaP: s.thP * D2R, thetaQ: s.thQ * D2R },
      coeff: { k: s.ck, m: s.cm, n: s.cn },
      lens: s.lens,
      activePartIdx: s.part == null ? null : s.part,
      steps: { 1: s.step >= 1, 2: s.step >= 2, 3: s.step >= 3 }
    };
    return state;
  }

  /* ===== 원본의 그리기 도우미 → 새 무대 엔진 연결 (이름·인자는 원본과 같음) ===== */
  const canvasLabels = [];
  function labelAt(p, text, color = '#e2e8f0', offset = { x: 10, y: -15 }) {
    const s = BD.toS(p), c = BD.ctx, ins = BD.insets;
    const size = 12 * BD.fs;
    c.save(); c.font = `800 ${size}px ${BD.font}`;
    const tw = c.measureText(text).width + 10, th = Math.round(size * 1.5);
    c.restore();
    const W = BD.W - (ins.right || 0), top = (ins.top || 0) + 3, bottom = BD.H - (ins.bottom || 0) - 3;
    const opts = [[offset.x, offset.y], [offset.x, 27], [-tw - 9, -12], [-tw - 9, 25], [15, -35], [-tw - 10, -35], [15, 42]];
    const overlaps = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
    let chosen = null;
    for (const [ox, oy] of opts) {
      const box = { x: s.x + ox, y: s.y + oy - th, w: tw, h: th };
      if (box.x < 3 || box.x + tw > W - 3 || box.y < top || box.y + th > bottom) continue;
      if (canvasLabels.some((q) => overlaps(q, box))) continue;
      chosen = box; break;
    }
    if (!chosen) { // 자리가 없으면 겹치더라도 화면 안으로 밀어 넣어 보여 줍니다
      chosen = { x: clamp(s.x + offset.x, 3, Math.max(3, W - tw - 3)), y: clamp(s.y + offset.y - th, top, Math.max(top, bottom - th)), w: tw, h: th };
    }
    canvasLabels.push(chosen);
    BD.stext(chosen.x + 5, chosen.y + th / 2, text, { color, size: 12, align: 'left', baseline: 'middle', weight: 800 });
  }
  function emAlpha(part) { return BD._em({ part }) === -1 ? 0.16 : 1; }
  function seg(a, b, col = '#cbd5e1', wd = 1.8, dash = false, part = 0) {
    BD.seg(a, b, { color: col, width: wd, dash: dash ? [6, 5] : null, part });
  }
  function vec(a, b, col = '#fbbf24', text = '', part = 0, at = 0.56) {
    const p = BD.toS(a), q = BD.toS(b), dx = q.x - p.x, dy = q.y - p.y, L = Math.hypot(dx, dy);
    if (L < 1.5) return;
    seg(a, b, col, 3, false, part);
    const c = BD.ctx, k = BD.lw, al = emAlpha(part), ux = dx / L, uy = dy / L;
    c.save();
    c.fillStyle = BD.color(col, al < 1 ? al : undefined);
    if (BD.glowOn && al === 1) { c.shadowColor = BD.color(col, 0.7); c.shadowBlur = 8; }
    c.beginPath(); c.moveTo(q.x, q.y);
    c.lineTo(q.x - 13 * k * ux - 6 * k * uy, q.y - 13 * k * uy + 6 * k * ux);
    c.lineTo(q.x - 13 * k * ux + 6 * k * uy, q.y - 13 * k * uy - 6 * k * ux);
    c.closePath(); c.fill(); c.restore();
    if (text && (state.activePartIdx === null || state.activePartIdx === part)) labelAt(add(a, mul(sub(b, a), at)), text, col, { x: 12, y: -14 });
  }
  function dot(p, text = '', col = '#fbbf24', part = 0, off = { x: 10, y: -15 }) {
    BD.point(p, { color: col, r: state.activePartIdx === part ? 7 : 5.2, part });
    if (text === 'O' && state.mode !== 4) text = ''; // [2.0 수정] 무대 축이 이미 원점 O를 표시하므로 겹치는 두 번째 'O' 생략
    if (text &&(state.activePartIdx === null || state.activePartIdx === part)) labelAt(p, text, col, off);
  }
  function circle(p, r, col = '#38bdf8', part = 0, fill = false) {
    BD.circle(p, r, { color: col, width: 2, fill: fill ? 'rgba(56,189,248,.055)' : null, part });
  }
  function fillPoly(points, color, part = 0) {
    if (points.length < 3) return;
    BD.poly(points, { fill: color, color: null, part });
  }
  function arcAngle(o, a, b, r = 0.8, col = '#fef08a') {
    if (norm(sub(a, o)) < .01 || norm(sub(b, o)) < .01) return;
    let u = Math.atan2(a.y - o.y, a.x - o.x), v = Math.atan2(b.y - o.y, b.x - o.x), dv = Math.atan2(Math.sin(v - u), Math.cos(v - u));
    let prev = add(o, pol(r, u)); for (let i = 1; i <= 32; i++) { let next = add(o, pol(r, u + dv * i / 32)); seg(prev, next, col, 2, false, 0); prev = next }
    labelAt(add(o, pol(r + 0.5, u + dv * .5)), `θ=${(Math.abs(dv) * 180 / Math.PI).toFixed(1)}°`, col);
  }
  function rightMark(p, a, b, col = '#fef08a') {
    let u = sub(a, p), v = sub(b, p), lu = norm(u), lv = norm(v); if (lu < .001 || lv < .001) return;
    const d = Math.min(.45, lu * .14, lv * .14), uu = mul(u, d / lu), vv = mul(v, d / lv);
    seg(add(p, uu), add(add(p, uu), vv), col, 1.8, false, 3); seg(add(p, vv), add(add(p, uu), vv), col, 1.8, false, 3);
  }
  // 원본 banner: 캔버스 위에 덮어 그리던 하단 상자 → 셸의 하단 띠(그림을 가리지 않음)
  function banner(line1, line2 = '') { BANNER[0] = line1; BANNER[1] = line2; }

  /* ===== 원본 그대로: 장면 점 모음(geomPoints, 원본 1756–1768행 — initExt 호출만 제거) ===== */
    function geomPoints(){
      const id=state.subType,A=state.A,B=state.B,C=state.C3,tri=M4(),r=state.r3;
      if(id==='1-A')return [ZERO,A,B,add(A,B)];

      } else if (id === '3-A' || id === '3-B') s.th3 = mod360(s.th3 + 0.015 * f * R2D);
      else if (id === '3-C') { s.thP = mod360(s.thP + 0.012 * f * R2D); s.thQ = mod360(s.thQ - 0.014 * f * R2D); }
      else if (id === '4-A' || id === '4-B') s.TAx = s.animAnchor + .6 * Math.sin(s.animPhase);
      return true;
    };
  }

  /* ===== 끌 수 있는 점(원본 currentHandles / handlePointerMove 규칙 그대로) ===== */
  function drawHandles(b, s, id) {
    const st = state;
    const bound = (w) => ({ x: clamp(w.x, -20, 20), y: clamp(w.y, -16, 16) });
    const pt = (kx, ky) => (w) => { const q = bound(w); s[kx] = q.x; s[ky] = q.y; if (s.playing && kx === 'TAx') s.animAnchor = s.TAx; };
    const H = (key, p, color, drag, aria) => b.handle(key, p, { color, drag, ariaLabel: aria });
    if (['1-A', '2-A', '2-B', '2-C', '3-B'].includes(id)) { H('A', st.A, 'sky', pt('Ax', 'Ay'), '점 A'); H('B', st.B, 'rose', pt('Bx', 'By'), '점 B'); }
    if (id === '1-B') ['a1', 'a2', 'a3'].forEach((k, i) => H('ANG' + i, pol(st.r1B, st.angles1B[i]), ['sky', 'rose', 'green'][i], (w) => { s[k] = deg(Math.atan2(w.y, w.x)); }, '점 ' + 'ABC'[i]));
    if (id === '2-B') H('P2B', add(mid(st.A, st.B), pol(dist(st.A, st.B) / 2, st.theta2B)), 'amber', (w) => { const M = mid(P(s.Ax, s.Ay), P(s.Bx, s.By)); s.th2b = deg(Math.atan2(w.y - M.y, w.x - M.x)); }, '동점 P');
    if (id === '2-C') H('P2C', add(mul(st.A, st.lin.a), mul(st.B, st.lin.b)), 'amber', (w) => {
      const A = P(s.Ax, s.Ay), B = P(s.Bx, s.By), det = cross(A, B), reg = s.region;
      if (Math.abs(det) > 1e-6) {
        const alpha = cross(w, B) / det, beta = cross(A, w) / det;
        if (reg === 'line') { s.la = clamp((alpha - beta + s.lk) / 2, -3, 5); s.lb = s.lk - s.la; }
        else if (reg === 'triangle') { s.la = Math.max(0, alpha); s.lb = Math.max(0, beta); const sum = s.la + s.lb; if (sum > 1) { s.la /= sum; s.lb /= sum; } }
        else { s.la = clamp(alpha, 0, 1); s.lb = clamp(beta, 0, 1); }
      }
    }, '점 P');
    if (id === '3-A' || id === '3-B') {
      H('P3', center3point(), 'amber', (w) => { s.th3 = deg(Math.atan2(w.y - s.C3y, w.x - s.C3x)); }, '동점 P');
      H('C3', st.C3, 'sky', pt('C3x', 'C3y'), '원의 중심 C');
    }
    if (id === '3-C') {
      const d = double3();
      H('P2', d.P, 'sky', (w) => { s.thP = deg(Math.atan2(w.y - s.c1y, w.x - s.c1x)); }, '동점 P');
      H('Q2', d.Q, 'amber', (w) => { s.thQ = deg(Math.atan2(w.y - s.c2y, w.x - s.c2x)); }, '동점 Q');
      H('C1', d.C1, 'sky', pt('c1x', 'c1y'), '중심 C₁');
      H('C2', d.C2, 'rose', pt('c2x', 'c2y'), '중심 C₂');
    }
    if (id === '4-A' || id === '4-B') {
      H('T4_A', st.T4_A, 'sky', pt('TAx', 'TAy'), '꼭짓점 A');
      H('T4_B', st.T4_B, 'rose', pt('TBx', 'TBy'), '꼭짓점 B');
      H('T4_C', st.T4_C, 'green', pt('TCx', 'TCy'), '꼭짓점 C');
    }
  }

  function sceneOf(id) {
    const inf = INFO[id];
    return {
      id, title: inf.name, short: `${id} · ${inf.name}`, thumbSnap: false,
      question: QUESTION[id], guide: GUIDE[id],
      controls: id === '2-C' ? (s) => (s.region === 'line' ? ['laL', 'lbL', 'lk'] : ['la', 'lb']) : CONTROLS[id],
      presets: () => presetChips(id).concat(LENS_CHIPS),
      actions: ACTIONS,
      steps: inf.steps,
      enter: (s) => {
        s.sid = id;
        if (id === '2-C') Object.assign(s, { Ax: 4, Ay: 2, Bx: 2, By: 4 });
        applyPatch(s, PRESET_DEFS[id][0].patch);
        s.pi = 0; s.animPhase = 0; s.animAnchor = s.TAx;
      },
      focus: (s) => focusOf(s, id),
      tick: tickOf(id),
      view: (s) => {
        s.sid = id;
        if (id === '1-A' || id === '2-A') s.angB = deg(Math.atan2(s.By, s.Bx));
        if (id === '2-C' && s.region === 'line') { s.laL = s.la; s.lbL = s.lb; }
        use(s);
        const m = monitor();
        const v = {
          guide: GUIDE[id],
          chips: [{ k: '핵심 항등식', tex: m.eq, color: 'amber' }].concat(m.subtext ? [{ k: '', html: esc(m.subtext), color: 'sky' }] : []),
          readouts: m.labels.map((label, i) => ({ label, value: m.vals[i], color: RCOL[i], wide: String(m.vals[i]).length > 13 })),
          parts: PARTS[id].map((name, i) => ({ id: i, name, color: PCOL[i] })),
          formula: '<div style="text-align:center">' + APLab.tex(m.eq, true) + '</div>'
        };
        if (id === '2-B' || id === '4-A' || id === '4-B') v.status = Number.isFinite(m.error) ? { tone: 'ok', text: `실측 잔차 ${fmt(m.error)}` } : { tone: 'warn', text: '퇴화 — 비율 계산 불가' };
        return v;
      },
      draw: (b, s, v) => {
        BD = b; s.sid = id; use(s);
        canvasLabels.length = 0; BANNER.length = 0;
        if (s.grid) b.grid();
        if (state.mode !== 4) b.axes();
        renderScenario();
        drawHandles(b, s, id);
        v.tape = BANNER[0] ? { title: BANNER[0] + (BANNER[1] ? '  ·  ' + BANNER[1] : '') } : null;
      },
      problem: {
        tag: '수능·평가원형 기출 유형 변형',
        text: (s) => { s.sid = id; use(s); return esc(dynExam().question); },
        answer: (s) => { s.sid = id; use(s); return esc(dynExam().answer); },
        snap: (s) => snapPatch(id, s)
      },
      solution: {
        standardTitle: '교과서식 정석 풀이', standardTag: '3분 소요',
        quickTitle: '10초 컷 실전 기하 비기', quickTag: '10초 컷',
        standard: () => ({
          steps: '<b>정의에 따른 풀이</b><br>' + inf.steps.map((t, i) => `${i + 1}. ${esc(t)}`).join('<br>'),
          warning: '벡터 성분 및 길이는 실제 점의 위치가 바뀌면 다시 계산해야 합니다. 발문·정답은 지금 그림의 값을 기준으로 합니다.'
        }),
        quick: () => ({ steps: esc(inf.shortcut), highlight: `핵심: ${inf.name} · 탐구 탭의 ‘지금 보이는 값’에서 현재 작도의 값을 확인하세요.` })
      }
    };
  }

  const groups = [
    { id: 'g1', title: '덧셈 (평행사변형·삼각형·중점)', short: '덧셈', scenes: SUBS[1].map(sceneOf) },
    { id: 'g2', title: '뺄셈 & 시점 통일 (종점-시점)', short: '뺄셈·시점통일', scenes: SUBS[2].map(sceneOf) },
    { id: 'g3', title: '기출1: 원의 중심 경유 분해', short: '원의 중심 경유', scenes: SUBS[3].map(sceneOf) },
    { id: 'g4', title: '기출2: 영벡터 합 & 넓이비(a:b:c)', short: '영벡터 합·넓이비', scenes: SUBS[4].map(sceneOf) }
  ];

  APLab.createLab({
    id: 'geom-vector-ops',
    title: '벡터의 덧셈과 뺄셈',
    courseName: '기하',
    unit: '벡터 · 벡터의 연산',
    courseColor: 'var(--m-rose)',
    home: '../index.html#geom',
    legacy: '../../labs/기하와벡터/벡터의덧셈과뺄셈.html',
    board: { kind: 'cartesian', focus: { x: [-1, 7], y: [-1, 7] }, minZoom: 0.3, maxZoom: 8 },
    params: {
      slideT: { value: 1, min: 0, max: 1, step: 0.02, color: 'amber', label: '삼각형법 평행이동 t (평행사변형 ↔ 삼각형법)', format: (v) => `t = ${v.toFixed(2)}${v > .98 ? ' (삼각형법 연결!)' : v < .02 ? ' (평행사변형 시점 일치!)' : ''}` },
      angB: {
        value: 63.4, min: 0, max: 360, step: 1, color: 'rose', label: '점 B 회전 각도 θ_B (점 B를 끌어도 됩니다)', format: (v) => `${v.toFixed(1)}°`,
        onInput: (s) => { const L = Math.hypot(s.Bx, s.By) || 4; s.Bx = L * Math.cos(s.angB * D2R); s.By = L * Math.sin(s.angB * D2R); }
      },
      a1: { value: 90, min: 0, max: 360, step: 1, color: 'sky', label: 'A 회전각 θA', format: (v) => `${Math.round(v)}°` },
      a2: { value: 210, min: 0, max: 360, step: 1, color: 'rose', label: 'B 회전각 θB', format: (v) => `${Math.round(v)}°` },
      a3: { value: 330, min: 0, max: 360, step: 1, color: 'green', label: 'C 회전각 θC', format: (v) => `${Math.round(v)}°` },
      th2b: { value: 57.3, min: 0, max: 360, step: 1, color: 'amber', label: '원 위 P 회전각', format: (v) => `${Math.round(v)}°` },
      laL: { value: .45, min: -3, max: 5, step: 0.01, color: 'sky', label: '계수 α', format: (v) => v.toFixed(2), onInput: (s) => { s.la = s.laL; s.lb = s.lk - s.la; } },
      lbL: { value: .55, min: -3, max: 5, step: 0.01, color: 'rose', label: '계수 β', format: (v) => v.toFixed(2), onInput: (s) => { s.lb = s.lbL; s.la = s.lk - s.lb; } },
      la: {
        value: .45, min: 0, max: 1, step: 0.01, color: 'sky', label: '계수 α', format: (v) => v.toFixed(2),
        onInput: (s) => { if (s.region === 'triangle' && s.la + s.lb > 1) s.lb = 1 - s.la; }
      },
      lb: {
        value: .55, min: 0, max: 1, step: 0.01, color: 'rose', label: '계수 β', format: (v) => v.toFixed(2),
        onInput: (s) => { if (s.region === 'triangle' && s.la + s.lb > 1) s.la = 1 - s.lb; }
      },
      lk: { value: 1, min: .2, max: 2, step: 0.05, color: 'amber', label: 'α + β = k', hint: 'k가 같은 점들은 AB와 평행한 한 직선 위에 있습니다', format: (v) => v.toFixed(2), onInput: (s) => { s.lb = s.lk - s.la; } },
      th3: { value: 36.87, min: 0, max: 360, step: 0.5, color: 'amber', label: '원 위 동점 P 회전각 θ (360° 회전)', format: (v, s) => `${v.toFixed(1)}°${alignNote(s)}` },
      r3: { value: 2, min: 1, max: 3.5, step: 0.1, color: 'sky', label: '원의 반지름 r (|CP| = r)', format: (v) => `r = ${v.toFixed(2)}` },
      thP: { value: 180, min: 0, max: 360, step: 1, color: 'sky', label: 'P 회전각', format: (v) => `${Math.round(v)}°` },
      thQ: { value: 0, min: 0, max: 360, step: 1, color: 'amber', label: 'Q 회전각', format: (v) => `${Math.round(v)}°` },
      rr1: { value: 1.5, min: .5, max: 4, step: 0.1, color: 'sky', label: '반지름 r₁', format: (v) => v.toFixed(1) },
      rr2: { value: 1.5, min: .5, max: 4, step: 0.1, color: 'rose', label: '반지름 r₂', format: (v) => v.toFixed(1) },
      alpha: { value: 2, min: 1, max: 8, step: 1, color: 'sky', label: 'α (점 A 계수)', format: (v, s) => `${s.alpha} : ${s.beta} : ${s.gamma}` },
      beta: { value: 3, min: 1, max: 8, step: 1, color: 'rose', label: 'β (점 B 계수)', format: (v, s) => `${s.alpha} : ${s.beta} : ${s.gamma}` },
      gamma: { value: 5, min: 1, max: 8, step: 1, color: 'green', label: 'γ (점 C 계수)', format: (v, s) => `${s.alpha} : ${s.beta} : ${s.gamma}` },
      cm: { value: 3, min: 1, max: 8, step: 1, color: 'sky', label: 'AB 계수 m', format: (v) => `${v}`, onInput: (s) => { s.ck = Math.max(s.ck, s.cm + s.cn + 1); } },
      cn: { value: 5, min: 1, max: 8, step: 1, color: 'rose', label: 'AC 계수 n', format: (v) => `${v}`, onInput: (s) => { s.ck = Math.max(s.ck, s.cm + s.cn + 1); } },
      ck: { value: 10, min: 3, max: 20, step: 1, color: 'amber', label: 'AP 계수 k (k > m+n)', format: (v) => `${v}`, onInput: (s) => { s.ck = Math.max(s.ck, s.cm + s.cn + 1); } }
    },
    state: {
      sid: '1-A', pi: 0, lens: 'vector', region: 'line', animPhase: 0, animAnchor: 0,
      Ax: 4, Ay: 2, Bx: 2, By: 4,
      C3x: 4, C3y: 3,
      c1x: -3, c1y: 0, c2x: 3, c2y: 0,
      TAx: 0, TAy: 4.8, TBx: -5.2, TBy: -3, TCx: 5.4, TCy: -3
    },
    persist: ['lens'],
    groups
  });
});
