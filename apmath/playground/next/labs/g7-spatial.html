<script>
/* ==========================================================================
   중1 · 위치 관계 · 반례 (AP Math Lab 2.0 이식본) — 4개 탐구관 × 20개 장면
   원본: labs/g7/spatial-relations.html
   이식 방식: 원본의 내용(getSpec·SUB_MENUS), 3D 기하(buildPolyhedronData·경첩 회전·위치 관계 판별)와
   그리기 코드(renderTab1~4, project3D yaw/pitch 투영, draw3D…)를 글자 그대로 옮기고, 원본이 캔버스에 직접 쓰던
   ctx 호출(화면 픽셀 좌표)만 아래의 호환 도우미 ctx가 새 무대 엔진에 연결합니다.
   원본과 다른 점
   - 빈 곳 끌기 = 회전(무대 공통 기능), 좌우 회전·위아래 기울기 슬라이더, 두 손가락 확대, 3D 자동 회전 버튼
   - 탭 1의 소거 필터·기준 모서리·연장선 레이저·시점 3종(입체뷰/착시/간격)은 칩으로
   - [2.0 수정] 효과가 없던 조작(탭 1의 진행도 슬라이더·0/50/100% 버튼)은 표시하지 않음
   - 하단 비율 막대는 무대 아래 띠로, 긴 캡션은 무대 너비에 맞춰 줄바꿈, 이름표가 겹치면 자동으로 비켜 놓음
   - 원본의 외부 스크립트(board-relations.js 관계 탐구 모듈) 참조는 이식본에서 쓰지 않음
   ========================================================================== */
window.addEventListener('DOMContentLoaded', function () {
  const tex = APLab.tex;

  /* ===== 호환 도우미 (이 파일 안에서만 씁니다) =====
     원본은 캔버스 문맥(ctx)에 화면 픽셀 좌표로 직접 그렸습니다. 아래 ctx는 같은 메서드 이름(beginPath·moveTo·lineTo·arc·fill·stroke·
     fillText·translate·rotate…)을 그대로 받아 무대 엔진(APLab.Board)으로 그립니다.
     - 점 좌표는 가상 캔버스 좌표 → 무대 좌표(board.toS): 확대·이동·자동 맞춤·판서가 그대로 동작합니다.
     - 선 굵기·글자 크기·작은 점(반지름 12 이하)·translate/rotate 안쪽(화살촉 등)은 원본과 같은 화면 픽셀입니다.
     - 긴 글은 무대 너비에 맞춰 줄을 나누고(위로 쌓음), 서로 겹치는 이름표는 아래로 비켜 놓습니다.
     - 이모지는 떼고 ➔ ⭕ ❌ 는 → ○ × 로 바꿉니다(셸이 화면 글자에서 이모지를 떼므로 뜻이 사라지지 않게). */
  let BOARD = null;
  const arrowOnly = (s) => String(s == null ? '' : s).replace(/➔/g, '→').replace(/⭕/g, '○').replace(/❌/g, '×');
  const cvText = (s) => APLab.stripEmoji(arrowOnly(s));
  const ctx = (function () {
    const DEF = { fillStyle: '#ffffff', strokeStyle: '#ffffff', lineWidth: 1, font: '700 13px sans-serif', textAlign: 'start', textBaseline: 'alphabetic', shadowColor: 'transparent', shadowBlur: 0, lineCap: 'butt', lineJoin: 'miter', globalAlpha: 1, _dash: [] };
    const F = { ...DEF };
    const KEYS = Object.keys(DEF);
    let path = [], stack = [], tr = null, placed = [];
    const P = (x, y) => (tr ? { x: tr.ox + x * tr.c - y * tr.s, y: tr.oy + x * tr.s + y * tr.c } : BOARD.toS(x, y));
    const rot = () => (tr ? Math.atan2(tr.s, tr.c) : 0);
    F.reset = () => { path = []; stack = []; tr = null; placed = []; Object.assign(F, DEF, { _dash: [] }); };
    F.save = () => { stack.push({ p: KEYS.map((k) => F[k]), tr: tr && { ...tr } }); };
    F.restore = () => { const t = stack.pop(); if (!t) return; KEYS.forEach((k, i) => { F[k] = t.p[i]; }); tr = t.tr; };
    F.translate = (x, y) => { const p = P(x, y); tr = { ox: p.x, oy: p.y, c: tr ? tr.c : 1, s: tr ? tr.s : 0 }; };
    F.rotate = (a) => { if (!tr) return; const ca = Math.cos(a), sa = Math.sin(a); tr = { ox: tr.ox, oy: tr.oy, c: tr.c * ca - tr.s * sa, s: tr.s * ca + tr.c * sa }; };
    F.setLineDash = (a) => { F._dash = a || []; };
    F.beginPath = () => { path = []; };
    F.closePath = () => { path.push({ t: 'Z' }); };
    F.moveTo = (x, y) => { path.push({ t: 'M', ...P(x, y) }); };
    F.lineTo = (x, y) => { path.push({ t: 'L', ...P(x, y) }); };
    F.quadraticCurveTo = (cx, cy, x, y) => { const c = P(cx, cy), p = P(x, y); path.push({ t: 'Q', cx: c.x, cy: c.y, x: p.x, y: p.y }); };
    F.arc = (x, y, r, a0, a1, ccw) => {
      const p = P(x, y);
      const px = !!tr || r <= 12; // 작은 점·화살촉은 화면 픽셀, 큰 원·호는 도형 크기(확대·축소를 따라감)
      const bb = BOARD._bbox;
      if (!px && bb) { // 자동 맞춤: 원의 바깥 범위도 그림 범위로 기록(Board.arc는 중심만 기록)
        bb.x0 = Math.min(bb.x0, x - r); bb.x1 = Math.max(bb.x1, x + r); bb.y0 = Math.min(bb.y0, y - r); bb.y1 = Math.max(bb.y1, y + r);
      }
      path.push({ t: 'A', x: p.x, y: p.y, r: px ? r : r * BOARD.k, a0: a0 + rot(), a1: a1 + rot(), ccw: !!ccw });
    };
    const run = (c) => {
      c.beginPath();
      path.forEach((o) => {
        if (o.t === 'M') c.moveTo(o.x, o.y);
        else if (o.t === 'L') c.lineTo(o.x, o.y);
        else if (o.t === 'Q') c.quadraticCurveTo(o.cx, o.cy, o.x, o.y);
        else if (o.t === 'A') c.arc(o.x, o.y, o.r, o.a0, o.a1, o.ccw);
        else c.closePath();
      });
    };
    const glow = (c) => {
      if (F.shadowBlur > 0 && BOARD.glowOn) { c.shadowColor = BOARD.color(F.shadowColor); c.shadowBlur = F.shadowBlur; } else c.shadowBlur = 0;
    };
    F.fill = () => {
      const b = BOARD, c = b.ctx;
      c.save(); c.setLineDash([]); c.globalAlpha = F.globalAlpha; c.fillStyle = b.color(F.fillStyle); glow(c); run(c); c.fill(); c.restore();
    };
    F.stroke = () => {
      const b = BOARD, c = b.ctx;
      c.save(); c.globalAlpha = F.globalAlpha; c.strokeStyle = b.color(F.strokeStyle); c.lineWidth = F.lineWidth * b.lw;
      c.lineCap = F.lineCap === 'butt' ? 'round' : F.lineCap; c.lineJoin = 'round'; c.setLineDash(F._dash.map((v) => v * b.lw));
      glow(c); run(c); c.stroke(); c.restore();
    };
    const rectPath = (x, y, w, h) => {
      const keep = path; path = [];
      F.moveTo(x, y); F.lineTo(x + w, y); F.lineTo(x + w, y + h); F.lineTo(x, y + h); F.closePath();
      const r = path; path = keep; return r;
    };
    F.fillRect = (x, y, w, h) => { const keep = path; path = rectPath(x, y, w, h); F.fill(); path = keep; };
    F.strokeRect = (x, y, w, h) => { const keep = path; path = rectPath(x, y, w, h); F.stroke(); path = keep; };
    F.clearRect = () => {};
    const wrap = (txt, maxW, wid) => {
      if (wid(txt) <= maxW) return [txt];
      const out = []; let cur = '';
      for (const w of txt.split(' ')) {
        const t = cur ? cur + ' ' + w : w;
        if (!cur || wid(t) <= maxW) cur = t; else { out.push(cur); cur = w; }
      }
      if (cur) out.push(cur);
      return out;
    };
    F.fillText = (str, x, y) => {
      const b = BOARD, txt = cvText(str);
      if (!txt) return;
      const wm = /\b([1-9]00)\b/.exec(F.font), sm = /([\d.]+)px/.exec(F.font);
      const size = sm ? parseFloat(sm[1]) : 13, weight = wm ? +wm[1] : 750;
      const align = F.textAlign === 'start' ? 'left' : F.textAlign === 'end' ? 'right' : F.textAlign;
      const base = F.textBaseline;
      const p = P(x, y);
      const eff = size * b.fs * b._ts();
      const c = b.ctx;
      c.save(); c.font = `${weight} ${eff}px ${b.font}`;
      const wid = (t) => c.measureText(t).width;
      const lines = wrap(txt, Math.max(150, b.W - b.insets.left - b.insets.right - 28), wid);
      const ws = lines.map(wid);
      c.restore();
      const lh = eff * 1.28, n = lines.length;
      const top0 = base === 'middle' ? -eff / 2 : base === 'top' || base === 'hanging' ? 0 : base === 'bottom' ? -eff : -eff * 0.8;
      const boxes = (dy) => lines.map((_, i) => {
        const x0 = p.x + (align === 'center' ? -ws[i] / 2 : align === 'right' ? -ws[i] : 0), y0 = p.y + dy - (n - 1 - i) * lh + top0;
        return { x0: x0 - 2, x1: x0 + ws[i] + 2, y0: y0 - 1, y1: y0 + eff + 1 };
      });
      const hit = (bx) => { for (const q of bx) for (const r of placed) if (q.x0 < r.x1 && q.x1 > r.x0 && q.y0 < r.y1 && q.y1 > r.y0) return r; return null; };
      // 겹치면 겹친 글자의 반대쪽(위에 있으면 위로, 아니면 아래로)으로 한 줄씩 비켜 놓습니다.
      let dy = 0;
      const first = hit(boxes(0));
      if (first) {
        const q0 = boxes(0)[0], dir = (q0.y0 + q0.y1) < (first.y0 + first.y1) ? -1 : 1;
        for (let k = 1; k <= 4; k++) { if (!hit(boxes(dir * k * lh))) { dy = dir * k * lh; break; } }
      }
      boxes(dy).forEach((q) => placed.push(q));
      lines.forEach((ln, i) => b._text(p.x, p.y + dy - (n - 1 - i) * lh, ln, { color: F.fillStyle, size, weight, align, baseline: base }));
    };
    return F;
  })();

  /* ===== 원본 그대로: 상태 (원본 340–369행; 카메라·진행도·필터 값은 셸 상태에서 받아 옴, 화면 이동·드래그 표시는 무대가 맡음) ===== */
    const state = {
      mode: 1, // 1: 다면체 꼬인 위치 스캐너(6종), 2: 전개도 접어 위치 관계(4종), 3: 직선·평면 수직 & 평면 결정조건(4종), 4: 공간 명제 3D 반례기(6종)
      sub: {
        1: 'cuboidSkew',    // 'cuboidSkew', 'prism3Skew', 'trapSkew', 'hexSkew', 'pyr4Skew', 'tetraSkew'
        2: 'foldCubeSkew',  // 'foldCubeSkew', 'foldCubeFace', 'foldPrism3', 'foldPyr4'
        3: 'linePerpPlane', // 'linePerpPlane', 'doorHinge', 'threePlanes', 'planeDet'
        4: 'prop1'          // 'prop1', 'prop2', 'prop3', 'prop4', 'prop5', 'prop6'
      },
      skewFilter: 'skewOnly', // 'all' | 'meet' | 'parallel' | 'skewOnly'
      refType: 'base',        // 'base' (밑면 모서리 AB) | 'side' (옆모서리 AE / VA)
      laserExtend: true,      // 모서리 무한 연장선 레이저 표시 여부
      activePartIdx: -1,
      animProg: 1.0,
      yaw: (-34 * Math.PI) / 180,
      pitch: (30 * Math.PI) / 180,
      scale: 46,
      offsetX: 0,
      offsetY: 8,
      lastAudit: null
    };

  /* ===== 원본 그대로: 세부 시나리오 목록 (원본 371–400행) ===== */
    const SUB_MENUS = {
      1: [
        { id: 'cuboidSkew', label: '📦 직육면체 (12모서리)' },
        { id: 'prism3Skew', label: '📐 삼각기둥 (9모서리)' },
        { id: 'trapSkew', label: '🏠 사다리꼴기둥 (연장하면 만나는 모서리 주의!)' },
        { id: 'hexSkew', label: '⬡ 정육각기둥 (18모서리, 주의!)' },
        { id: 'pyr4Skew', label: '⛺ 정사각뿔 (8모서리)' },
        { id: 'tetraSkew', label: '🔺 정사면체 (삼각뿔 6모서리)' }
      ],
      2: [
        { id: 'foldCubeSkew', label: '➕ 정육면체 접기: 꼬인 모서리 찾기' },
        { id: 'foldCubeFace', label: '🧊 정육면체 접기: 평행한 면·수직인 면' },
        { id: 'foldPrism3', label: '📐 삼각기둥 접기: 모서리 관계' },
        { id: 'foldPyr4', label: '⛺ 정사각뿔 접기: 꼬인 위치 찾기' }
      ],
      3: [
        { id: 'linePerpPlane', label: '🚩 직선⊥평면 (국기게양대 & 반례)' },
        { id: 'doorHinge', label: '🚪 두 평면 수직 (문짝·경첩 원리)' },
        { id: 'threePlanes', label: '🔪 평행한 두 평면과 교선 (l ∥ m)' },
        { id: 'planeDet', label: '✨ 평면이 정해지는 조건 4가지 vs 꼬인 위치' }
      ],
      4: [
        { id: 'prop1', label: '① l⊥m, l⊥n ⟹ m∥n? (❌거짓)' },
        { id: 'prop2', label: '② l∥P, m∥P ⟹ l∥m? (❌거짓)' },
        { id: 'prop3', label: '③ l⊥P, m⊥P ⟹ l∥m? (⭕참!)' },
        { id: 'prop4', label: '④ P⊥Q, P⊥R ⟹ Q∥R? (❌거짓)' },
        { id: 'prop5', label: '⑤ l⊥P, l⊥Q ⟹ P∥Q? (⭕참!)' },
        { id: 'prop6', label: '⑥ l⊥P, l⊥m ⟹ m∥P? (❌평면에 포함되는 경우 주의!)' }
      ]
    };

  /* ===== 원본 그대로: 3D 벡터·경첩 회전·위치 관계 판별 (원본 405–459행) ===== */
    function vecAdd(a, b) { return { x: a.x + b.x, y: a.y + b.y, z: a.z + b.z }; }
    function vecSub(a, b) { return { x: a.x - b.x, y: a.y - b.y, z: a.z - b.z }; }
    function vecDot(a, b) { return a.x * b.x + a.y * b.y + a.z * b.z; }
    function vecCross(a, b) {
      return { x: a.y * b.z - a.z * b.y, y: a.z * b.x - a.x * b.z, z: a.x * b.y - a.y * b.x };
    }
    function vecNorm(v) {
      const len = Math.hypot(v.x, v.y, v.z) || 1;
      return { x: v.x / len, y: v.y / len, z: v.z / len };
    }
    function rotateAroundAxis(p, hingeP1, hingeP2, angle) {
      if (Math.abs(angle) < 1e-6) return { ...p };
      const k = vecNorm(vecSub(hingeP2, hingeP1));
      const v = vecSub(p, hingeP1);
      const cosA = Math.cos(angle), sinA = Math.sin(angle);
      const crossKV = vecCross(k, v), dotKV = vecDot(k, v);
      return vecAdd(hingeP1, {
        x: v.x * cosA + crossKV.x * sinA + k.x * dotKV * (1 - cosA),
        y: v.y * cosA + crossKV.y * sinA + k.y * dotKV * (1 - cosA),
        z: v.z * cosA + crossKV.z * sinA + k.z * dotKV * (1 - cosA)
      });
    }
    function applyHingeChain(pt, chain) {
      let cur = { ...pt };
      for (let i = chain.length - 1; i >= 0; i--) {
        cur = rotateAroundAxis(cur, chain[i].p1, chain[i].p2, chain[i].angle);
      }
      return cur;
    }

    // 실제 3D 좌표로 기준 모서리(ref)와 다른 모서리(edge)의 위치 관계를 오차 없이 판별
    function classifyEdges3D(vertices, ref, edge) {
      if ((edge.u === ref.u && edge.v === ref.v) || (edge.u === ref.v && edge.v === ref.u)) return 'ref';
      if (edge.u === ref.u || edge.u === ref.v || edge.v === ref.u || edge.v === ref.v) return 'meet';
      const A = vertices[ref.u], B = vertices[ref.v], C = vertices[edge.u], D = vertices[edge.v];
      const u = vecSub(B, A), v = vecSub(D, C);
      const cross = vecCross(u, v);
      const crossLen = Math.hypot(cross.x, cross.y, cross.z);
      const scale = Math.hypot(u.x, u.y, u.z) * Math.hypot(v.x, v.y, v.z);
      if (crossLen < scale * 1e-6) return 'parallel';
      const w = vecSub(C, A);
      const triple = vecDot(w, cross);
      return Math.abs(triple) < Math.max(1, Math.hypot(w.x, w.y, w.z)) * crossLen * 1e-5 ? 'coplanar' : 'skew';
    }

    // 같은 평면 위에서 만나는 두 직선의 3D 교점 계산 (레이저 연장선용)
    function intersectCoplanarLines3D(A, B, C, D) {
      const u = vecSub(B, A), v = vecSub(D, C), w = vecSub(C, A);
      const crossUV = vecCross(u, v);
      const denom = vecDot(crossUV, crossUV);
      if (denom < 1e-8) return null;
      const crossWV = vecCross(w, v);
      const t = vecDot(crossWV, crossUV) / denom;
      return { x: A.x + u.x * t, y: A.y + u.y * t, z: A.z + u.z * t };
    }

  /* ===== 원본 그대로: 다면체 6종 3D 기하 (원본 464–566행) ===== */
    function buildPolyhedronData(sub, refType) {
      let verts = {}, edges = [], faces = [], shapeTitle = '';
      let refEdge = { u: 'A', v: 'B' };

      if (sub === 'cuboidSkew') {
        shapeTitle = '직육면체 ABCD-EFGH';
        const wx = 1.65, wy = 1.15, hz = 1.15;
        verts = {
          A: { x: -wx, y: -wy, z: hz }, B: { x: wx, y: -wy, z: hz }, C: { x: wx, y: wy, z: hz }, D: { x: -wx, y: wy, z: hz },
          E: { x: -wx, y: -wy, z: -hz }, F: { x: wx, y: -wy, z: -hz }, G: { x: wx, y: wy, z: -hz }, H: { x: -wx, y: wy, z: -hz }
        };
        edges = [

        ];

        refEdge = refType === 'base' ? { u: 'A', v: 'B' } : { u: 'A', v: 'E' };
      } else if (sub === 'prism3Skew') {
        shapeTitle = '삼각기둥 ABC-DEF';

        verts = {
          A: { x: -r, y: -0.9, z: hz }, B: { x: r, y: -0.9, z: hz }, C: { x: 0, y: 1.4, z: hz },

          { u: 'A', v: 'B' }, { u: 'B', v: 'C' }, { u: 'C', v: 'A' },

        ];

        for (let i = 0; i < 6; i++) {
          const a = -Math.PI / 2 - Math.PI / 6 + (i * Math.PI) / 3;
          verts[topN[i]] = { x: R * Math.cos(a), y: R * Math.sin(a), z: hz };
          verts[botN[i]] = { x: R * Math.cos(a), y: R * Math.sin(a), z: -hz };

        for (let i = 0; i < 6; i++) {
          edges.push({ u: topN[i], v: topN[(i + 1) % 6] });
          edges.push({ u: botN[i], v: botN[(i + 1) % 6] });

      let skewIdx = 0;
      edges.forEach((e) => {

        e.rel = rel;
        e.name = `${e.u}${e.v}`;
        if (rel === 'skew') e.idx = ++skewIdx;
        groups[rel].push(e);
      });

      return { shapeTitle, verts, edges, faces, refEdge, refName: `${refEdge.u}${refEdge.v}`, totalE: edges.length, groups };
    }

  /* ===== 원본 그대로: 장면별 실시간 명세 getSpec (원본 571–869행; 옛 화면 위치를 가리키는 안내 2곳만 조작부 표현으로) ===== */

  /* ===== 원본 그대로: 3D 투영과 그리기 도우미 (원본 892–1003행; 가상 캔버스 사용, 관계 탐구 모듈 호출 1줄 제거) ===== */
    function project3D(mathX, mathY, mathZ) {
      const rect = RECT;
      const cx = rect.width / 2 + state.offsetX;
      const cy = rect.height * 0.49 + state.offsetY;

      const vx = mathX, vy = mathZ, vz = -mathY;
      const cosY = Math.cos(state.yaw), sinY = Math.sin(state.yaw);
      const x1 = vx * cosY - vz * sinY;
      const z1 = vx * sinY + vz * cosY;

      const cosP = Math.cos(state.pitch), sinP = Math.sin(state.pitch);
      const y2 = vy * cosP - z1 * sinP;
      const z2 = vy * sinP + z1 * cosP;

      const fov = 26;
      const persp = fov / (fov + z2 * 0.15);

      return {
        x: cx + x1 * state.scale * persp,
        y: cy - y2 * state.scale * persp,
        depth: z2
      };
    }

    function draw3DLine(p1, p2, color = '#ffffff', width = 2.2, dashed = false, glow = false) {
      const s1 = project3D(p1.x, p1.y, p1.z);
      const s2 = project3D(p2.x, p2.y, p2.z);
      ctx.save();
      ctx.beginPath();
      if (dashed) ctx.setLineDash([6, 5]);
      ctx.strokeStyle = color;
      ctx.lineWidth = width;
      ctx.lineCap = 'round';
      if (glow) { ctx.shadowColor = color; ctx.shadowBlur = 13; }
      ctx.moveTo(s1.x, s1.y);
      ctx.lineTo(s2.x, s2.y);
      ctx.stroke();
      ctx.restore();
    }

    function draw3DPolygon(pts, fillColor = 'rgba(52, 211, 153, 0.16)', strokeColor = '#34d399', lineWidth = 2.0, dashed = false) {
      if (pts.length < 3) return;
      const sPts = pts.map((p) => project3D(p.x, p.y, p.z));
      ctx.save();
      if (dashed) ctx.setLineDash([5, 5]);
      ctx.beginPath();
      ctx.moveTo(sPts[0].x, sPts[0].y);
      for (let i = 1; i < sPts.length; i++) ctx.lineTo(sPts[i].x, sPts[i].y);
      ctx.closePath();
      if (fillColor) { ctx.fillStyle = fillColor; ctx.fill(); }
      if (strokeColor) { ctx.strokeStyle = strokeColor; ctx.lineWidth = lineWidth; ctx.lineJoin = 'round'; ctx.stroke(); }
      ctx.restore();
    }

    function draw3DRightAngle(originPt, dirA, dirB, size = 0.42, color = '#fbbf24') {
      const lenA = Math.hypot(dirA.x, dirA.y, dirA.z) || 1;
      const lenB = Math.hypot(dirB.x, dirB.y, dirB.z) || 1;
      const uA = { x: (dirA.x / lenA) * size, y: (dirA.y / lenA) * size, z: (dirA.z / lenA) * size };
      const uB = { x: (dirB.x / lenB) * size, y: (dirB.y / lenB) * size, z: (dirB.z / lenB) * size };

      const s0 = project3D(originPt.x, originPt.y, originPt.z);
      const p1 = project3D(originPt.x + uA.x, originPt.y + uA.y, originPt.z + uA.z);
      const p2 = project3D(originPt.x + uA.x + uB.x, originPt.y + uA.y + uB.y, originPt.z + uA.z + uB.z);
      const p3 = project3D(originPt.x + uB.x, originPt.y + uB.y, originPt.z + uB.z);

      ctx.save();
      ctx.beginPath();
      ctx.moveTo(s0.x, s0.y); ctx.lineTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y); ctx.lineTo(p3.x, p3.y); ctx.closePath();
      ctx.fillStyle = 'rgba(251, 191, 36, 0.25)'; ctx.fill();
      ctx.beginPath();
      ctx.strokeStyle = color;
      ctx.lineWidth = 2.4;
      ctx.moveTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y); ctx.lineTo(p3.x, p3.y);
      ctx.stroke();
      ctx.restore();
    }

    function draw3DPoint(pt, radius = 5.5, color = '#fbbf24', label = '', offset = { x: 8, y: -8 }) {
      const s = project3D(pt.x, pt.y, pt.z);
      ctx.save();
      ctx.beginPath();
      ctx.arc(s.x, s.y, radius, 0, Math.PI * 2);
      ctx.fillStyle = color;
      ctx.shadowColor = color;
      ctx.shadowBlur = 10;
      ctx.fill();
      ctx.lineWidth = 1.8;
      ctx.strokeStyle = '#ffffff';
      ctx.stroke();
      if (label) {
        ctx.shadowColor = 'rgba(0,0,0,0.95)';
        ctx.shadowBlur = 6;
        ctx.font = '800 12.5px Pretendard, sans-serif';
        ctx.fillStyle = color;
        ctx.fillText(label, s.x + offset.x, s.y + offset.y);
      }
      ctx.restore();
    }

    function draw3DText(pt, text, color = '#ffffff', fontSize = 13, offset = { x: 0, y: 0 }) {
      const s = project3D(pt.x, pt.y, pt.z);
      ctx.save();
      ctx.font = `800 ${fontSize}px Pretendard, sans-serif`;
      ctx.fillStyle = color;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.shadowColor = 'rgba(0,0,0,0.95)';
      ctx.shadowBlur = 6;
      ctx.fillText(text, s.x + offset.x, s.y + offset.y);
      ctx.restore();
    }

  /* ===== 원본 그대로: 탭별 3D 그리기 (원본 1067–1466행) ===== */
    // ==================== [탭 1 렌더링: 6종 다면체 꼬인 위치 소거 스캐너 + 무한 연장선 레이저] ====================
    function renderTab1PolyhedraSkew(rect) {
      const poly = buildPolyhedronData(state.sub[1], state.refType);
      const { verts, edges, faces, refEdge } = poly;
      const filter = state.skewFilter;

      // 1) 반투명 다면체 면
      faces.forEach((fNames) => {
        const pts = fNames.map((n) => verts[n]);
        draw3DPolygon(pts, 'rgba(52, 211, 153, 0.08)', null);
      });

      // 2) 무한 연장선 레이저 (같은 평면에서 연장하면 만나는 모서리 교점 시각화!)
      if (state.laserExtend) {
        const A = verts[refEdge.u], B = verts[refEdge.v];
        const uDir = vecNorm(vecSub(B, A));
        draw3DLine(
          { x: A.x - uDir.x * 1.4, y: A.y - uDir.y * 1.4, z: A.z - uDir.z * 1.4 },
          { x: B.x + uDir.x * 1.4, y: B.y + uDir.y * 1.4, z: B.z + uDir.z * 1.4 },
          'rgba(251, 191, 36, 0.45)', 2.0, true
        );

        poly.groups.coplanar.forEach((ce) => {
          const C = verts[ce.u], D = verts[ce.v];
          const hitPt = intersectCoplanarLines3D(A, B, C, D);
          if (hitPt) {
            draw3DLine(A, hitPt, '#c084fc', 2.4, true, true);
            draw3DLine(C, hitPt, '#c084fc', 2.4, true, true);
            // [2.0 수정] 좁은 화면(휴대폰)에서는 긴 설명 대신 짧은 이름표: 긴 이름표 두 개가 자동 맞춤을 밀어 입체가 아주 작아졌음(정육각기둥)
            draw3DPoint(hitPt, 6.5, '#c084fc', BOARD.W < 640 ? `교점(${ce.name} ×)` : `⚡ 연장선 교점! (${ce.name}는 한 평면에서 만남 ➔ 꼬인 위치 ❌)`, { x: 10, y: -10 });
          }
        });
      }

      // 3) 3단계 소거 필터 모서리 렌더링
      edges.forEach((e) => {
        const p1 = verts[e.u], p2 = verts[e.v];
        const s1 = project3D(p1.x, p1.y, p1.z), s2 = project3D(p2.x, p2.y, p2.z);
        const mx = (s1.x + s2.x) / 2, my = (s1.y + s2.y) / 2;

        let col = 'rgba(255,255,255,0.45)', lw = 2.2, glow = false, showX = false;

        // 우측 카드 클릭 하이라이트 연동
        if (state.activePartIdx !== -1) {
          const matchCard =
            (state.activePartIdx === 0 && e.rel === 'ref') ||
            (state.activePartIdx === 1 && e.rel === 'meet') ||
            (state.activePartIdx === 2 && (e.rel === 'parallel' || e.rel === 'coplanar')) ||
            (state.activePartIdx === 3 && e.rel === 'skew');
          if (matchCard) {
            col = e.rel === 'ref' ? '#fbbf24' : e.rel === 'meet' ? '#f43f5e' : e.rel === 'skew' ? '#34d399' : '#38bdf8';
            lw = 6.5; glow = true;
          } else {
            col = 'rgba(148, 163, 184, 0.16)'; lw = 1.2;
          }
        } else {
          if (e.rel === 'ref') {
            col = '#fbbf24'; lw = 6.8; glow = true;
          } else if (e.rel === 'meet') {
            if (filter === 'meet') { col = '#f43f5e'; lw = 4.5; showX = true; }
            else if (filter === 'parallel' || filter === 'skewOnly') { col = 'rgba(244, 63, 94, 0.18)'; lw = 1.4; }
            else { col = '#f43f5e'; lw = 3.2; }
          } else if (e.rel === 'parallel' || e.rel === 'coplanar') {
            if (filter === 'parallel') { col = e.rel === 'coplanar' ? '#c084fc' : '#38bdf8'; lw = 4.5; showX = true; }
            else if (filter === 'skewOnly') { col = 'rgba(56, 189, 248, 0.18)'; lw = 1.4; }
            else { col = e.rel === 'coplanar' ? '#c084fc' : '#38bdf8'; lw = 3.2; }
          } else if (e.rel === 'skew') {
            col = '#34d399'; lw = filter === 'skewOnly' ? 6.0 : 4.2; glow = filter === 'skewOnly';
          }
        }

        draw3DLine(p1, p2, col, lw, false, glow);

        if (showX) {
          ctx.save();
          ctx.fillStyle = col;
          ctx.font = '800 13px Pretendard, sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText('× 지움', mx, my);
          ctx.restore();
        }

        if (e.rel === 'ref') {
          ctx.save();
          ctx.fillStyle = '#fef08a';
          ctx.font = '800 13px Pretendard, sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText(`★ 기준 ${e.name}`, mx, my - 12);
          ctx.restore();
        }

        if (e.rel === 'skew' && (filter === 'skewOnly' || filter === 'all' || state.activePartIdx === 3)) {
          ctx.save();
          ctx.beginPath(); ctx.arc(mx, my, 10, 0, Math.PI * 2);
          ctx.fillStyle = '#07130e'; ctx.fill();
          ctx.strokeStyle = '#34d399'; ctx.lineWidth = 2; ctx.stroke();
          ctx.fillStyle = '#6ee7b7'; ctx.font = '800 11px Pretendard, monospace';
          ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
          ctx.fillText(`${e.idx}`, mx, my);
          ctx.restore();
        }
      });

      // 4) 꼭짓점 알파벳 라벨
      Object.keys(verts).forEach((k) => {
        const pt = verts[k];
        const isRefPt = k === refEdge.u || k === refEdge.v;
        draw3DPoint(pt, isRefPt ? 5.5 : 4, isRefPt ? '#fbbf24' : '#e2e8f0', k, { x: pt.x >= 0 ? 10 : -16, y: pt.z >= 0 ? -10 : 16 });
      });
    }

    // ==================== [탭 2 렌더링: 전개도 접어 위치 관계 추적 (4종)] ====================
    function renderTab2FoldingRelations(rect) {
      const sub = state.sub[2];
      const f = state.animProg;
      const ang = f * (Math.PI / 2);

      function makeRect(x0, y0, x1, y1) {
        return [{ x: x0, y: y0, z: 0 }, { x: x1, y: y0, z: 0 }, { x: x1, y: y1, z: 0 }, { x: x0, y: y1, z: 0 }];
      }

      if (sub === 'foldCubeSkew' || sub === 'foldCubeFace') {
        const L = 1.5, h = L / 2;
        const hNorth = { p1: { x: -h, y: h, z: 0 }, p2: { x: h, y: h, z: 0 }, angle: ang };
        const hSouth = { p1: { x: h, y: -h, z: 0 }, p2: { x: -h, y: -h, z: 0 }, angle: ang };
        const hWest = { p1: { x: -h, y: -h, z: 0 }, p2: { x: -h, y: h, z: 0 }, angle: ang };
        const hEast = { p1: { x: h, y: h, z: 0 }, p2: { x: h, y: -h, z: 0 }, angle: ang };
        const hEast2 = { p1: { x: h + L, y: h, z: 0 }, p2: { x: h + L, y: -h, z: 0 }, angle: ang };

        const rawC = makeRect(-h, -h, h, h);
        const rawA = makeRect(-h, h, h, h + L).map((p) => applyHingeChain(p, [hNorth]));
        const rawF = makeRect(-h, -h - L, h, -h).map((p) => applyHingeChain(p, [hSouth]));
        const rawB = makeRect(-h - L, -h, -h, h).map((p) => applyHingeChain(p, [hWest]));
        const rawD = makeRect(h, -h, h + L, h).map((p) => applyHingeChain(p, [hEast]));
        const rawE = makeRect(h + L, -h, h + 2 * L, h).map((p) => applyHingeChain(p, [hEast, hEast2]));

        const isFaceMode = sub === 'foldCubeFace';
        const faceList = [
          { pts: rawC, label: '기준 바닥 C', fill: 'rgba(251, 191, 36, 0.42)', stroke: '#fbbf24' },
          { pts: rawE, label: '평행 뚜껑 E (C∥E)', fill: isFaceMode ? 'rgba(244, 114, 182, 0.45)' : 'rgba(52, 211, 153, 0.22)', stroke: '#f472b6' },
          { pts: rawA, label: '수직 옆면 A', fill: 'rgba(56, 189, 248, 0.28)', stroke: '#38bdf8' },
          { pts: rawF, label: '수직 옆면 F', fill: 'rgba(56, 189, 248, 0.28)', stroke: '#38bdf8' },
          { pts: rawB, label: '수직 옆면 B', fill: 'rgba(56, 189, 248, 0.28)', stroke: '#38bdf8' },
          { pts: rawD, label: '수직 옆면 D', fill: 'rgba(56, 189, 248, 0.28)', stroke: '#38bdf8' }
        ];

        faceList.forEach((fl) => {
          draw3DPolygon(fl.pts, fl.fill, fl.stroke, 2.0);
          const c = fl.pts.reduce((acc, cur) => ({ x: acc.x + cur.x / 4, y: acc.y + cur.y / 4, z: acc.z + cur.z / 4 }), { x: 0, y: 0, z: 0 });
          draw3DText(c, fl.label, '#ffffff', 12);
        });

        if (!isFaceMode) {
          // 기준 모서리 AB (앞면 F의 끝변)와 꼬인 모서리들 강조!
          draw3DLine(rawF[0], rawF[1], '#fbbf24', 6.5, false, true);
          draw3DText({ x: (rawF[0].x + rawF[1].x) / 2, y: (rawF[0].y + rawF[1].y) / 2, z: rawF[0].z + 0.25 }, '★ 기준 모서리 AB', '#fbbf24', 13);

          // 꼬인 위치 모서리 4개 초록 네온 강조
          draw3DLine(rawC[1], rawC[2], '#34d399', 5.5, false, true);
          draw3DLine(rawC[3], rawC[0], '#34d399', 5.5, false, true);
          draw3DLine(rawA[1], rawA[2], '#34d399', 5.5, false, true);
          draw3DLine(rawA[3], rawA[0], '#34d399', 5.5, false, true);
        }
      } else if (sub === 'foldPrism3') {
        const s = 1.65, H = 2.1, hs = s / 2, hh = H / 2;
        const triH = (Math.sqrt(3) / 2) * s;
        const angSide = f * ((2 * Math.PI) / 3), angBase = f * (Math.PI / 2);

        const hLeft = { p1: { x: -hs, y: -hh, z: 0 }, p2: { x: -hs, y: hh, z: 0 }, angle: angSide };
        const hRight = { p1: { x: hs, y: hh, z: 0 }, p2: { x: hs, y: -hh, z: 0 }, angle: angSide };
        const hTop = { p1: { x: -hs, y: hh, z: 0 }, p2: { x: hs, y: hh, z: 0 }, angle: angBase };
        const hBot = { p1: { x: hs, y: -hh, z: 0 }, p2: { x: -hs, y: -hh, z: 0 }, angle: angBase };

        const fCenter = makeRect(-hs, -hh, hs, hh);
        const fLeft = makeRect(-hs - s, -hh, -hs, hh).map((p) => applyHingeChain(p, [hLeft]));
        const fRight = makeRect(hs, -hh, hs + s, hh).map((p) => applyHingeChain(p, [hRight]));
        const fTopTri = [{ x: -hs, y: hh, z: 0 }, { x: hs, y: hh, z: 0 }, { x: 0, y: hh + triH, z: 0 }].map((p) => applyHingeChain(p, [hTop]));
        const fBotTri = [{ x: -hs, y: -hh, z: 0 }, { x: hs, y: -hh, z: 0 }, { x: 0, y: -hh - triH, z: 0 }].map((p) => applyHingeChain(p, [hBot]));

        draw3DPolygon(fCenter, 'rgba(56, 189, 248, 0.28)', '#38bdf8', 2);
        draw3DPolygon(fLeft, 'rgba(56, 189, 248, 0.28)', '#38bdf8', 2);
        draw3DPolygon(fRight, 'rgba(56, 189, 248, 0.28)', '#38bdf8', 2);
        draw3DPolygon(fTopTri, 'rgba(251, 191, 36, 0.45)', '#fbbf24', 2.5);
        draw3DPolygon(fBotTri, 'rgba(251, 191, 36, 0.45)', '#fbbf24', 2.5);

        // 기준 모서리와 꼬인 위치 강조
        draw3DLine(fTopTri[0], fTopTri[1], '#fbbf24', 6.5, false, true);
        draw3DLine(fBotTri[1], fBotTri[2], '#34d399', 5.5, false, true);
        draw3DLine(fBotTri[2], fBotTri[0], '#34d399', 5.5, false, true);
        draw3DLine(fLeft[0], fLeft[3], '#34d399', 5.5, false, true);
      } else {
        // foldPyr4
        const s = 1.9, hs = s / 2, slant = 2.1;
        const maxAngle = Math.PI - Math.acos(hs / slant);
        const aPyr = f * maxAngle;

        const hN = { p1: { x: -hs, y: hs, z: 0 }, p2: { x: hs, y: hs, z: 0 }, angle: aPyr };
        const hS = { p1: { x: hs, y: -hs, z: 0 }, p2: { x: -hs, y: -hs, z: 0 }, angle: aPyr };
        const hW = { p1: { x: -hs, y: -hs, z: 0 }, p2: { x: -hs, y: hs, z: 0 }, angle: aPyr };
        const hE = { p1: { x: hs, y: hs, z: 0 }, p2: { x: hs, y: -hs, z: 0 }, angle: aPyr };

        const baseSq = makeRect(-hs, -hs, hs, hs);
        const triN = [{ x: -hs, y: hs, z: 0 }, { x: hs, y: hs, z: 0 }, { x: 0, y: hs + slant, z: 0 }].map((p) => applyHingeChain(p, [hN]));
        const triS = [{ x: hs, y: -hs, z: 0 }, { x: -hs, y: -hs, z: 0 }, { x: 0, y: -hs - slant, z: 0 }].map((p) => applyHingeChain(p, [hS]));
        const triW = [{ x: -hs, y: -hs, z: 0 }, { x: -hs, y: hs, z: 0 }, { x: -hs - slant, y: 0, z: 0 }].map((p) => applyHingeChain(p, [hW]));
        const triE = [{ x: hs, y: hs, z: 0 }, { x: hs, y: -hs, z: 0 }, { x: hs + slant, y: 0, z: 0 }].map((p) => applyHingeChain(p, [hE]));

        draw3DPolygon(baseSq, 'rgba(56, 189, 248, 0.35)', '#38bdf8', 2);
        [triN, triS, triW, triE].forEach((t) => draw3DPolygon(t, 'rgba(244, 114, 182, 0.32)', '#f472b6', 2));

        // 기준 모서리 AB (south edge) & 꼬인 위치 VC, VD (north side edges)
        draw3DLine(baseSq[0], baseSq[1], '#fbbf24', 6.5, false, true);
        draw3DLine(triN[0], triN[2], '#34d399', 5.5, false, true);
        draw3DLine(triN[1], triN[2], '#34d399', 5.5, false, true);
        draw3DPoint(triN[2], 6, '#fbbf24', f > 0.85 ? '꼭짓점 V에 모임!' : 'V₁');
      }
    }

    // ==================== [탭 3 렌더링: 직선·평면 수직 & 두 평면 & 평면 결정조건 (4종)] ====================
    function renderTab3LinesAndPlanes(rect) {
      const sub = state.sub[3];
      const R = 2.8;
      const zP = -0.8;

      if (sub === 'linePerpPlane') {
        draw3DPolygon([{ x: -R, y: -R, z: zP }, { x: R, y: -R, z: zP }, { x: R, y: R, z: zP }, { x: -R, y: R, z: zP }], 'rgba(16, 185, 129, 0.18)', '#34d399', 2.2);
        draw3DText({ x: -R + 0.6, y: R - 0.5, z: zP }, '바닥 평면 P', '#6ee7b7', 13);

        draw3DLine({ x: -R + 0.3, y: 0, z: zP }, { x: R - 0.3, y: 0, z: zP }, '#38bdf8', 3.0);
        draw3DLine({ x: 0, y: -R + 0.3, z: zP }, { x: 0, y: R - 0.3, z: zP }, '#f472b6', 3.0);
        draw3DText({ x: R - 0.5, y: -0.35, z: zP }, '직선 m', '#38bdf8', 13);
        draw3DText({ x: 0.45, y: R - 0.5, z: zP }, '직선 n', '#f472b6', 13);

        // animProg = 1 이면 완전 수직(tilt = 0), animProg < 1 이면 직선 m(x축)과는 90°를 유지한 채 앞쪽으로 기울어지는 반례!
        const tilt = (1 - state.animProg) * 0.65;
        const dirL = { x: 0, y: Math.sin(tilt), z: Math.cos(tilt) };
        const L = 2.6;
        const pO = { x: 0, y: 0, z: zP };
        const pTop = { x: dirL.x * L, y: dirL.y * L, z: zP + dirL.z * L };

        draw3DLine({ x: -dirL.x * 0.9, y: -dirL.y * 0.9, z: zP - dirL.z * 0.9 }, pTop, '#fbbf24', 5.5, false, true);
        draw3DPoint(pO, 6, '#ffffff', '수선의 발 O');
        draw3DRightAngle(pO, { x: 1, y: 0, z: 0 }, dirL, 0.45, '#38bdf8');

        if (tilt < 0.08) {
          draw3DRightAngle(pO, { x: 0, y: 1, z: 0 }, dirL, 0.45, '#f472b6');
          draw3DText({ x: 0, y: 0, z: pTop.z + 0.35 }, '⭕ 두 직선 m, n 모두와 90° ⟹ 평면 전체와 수직 (l ⊥ P)!', '#34d399', 13);
        } else {
          const degN = Math.round(90 - (tilt * 180) / Math.PI);
          draw3DText({ x: 0, y: 0.8, z: pTop.z + 0.35 }, `⚠️ 반례: 직선 m과는 90°이지만 직선 n과는 ${degN}° (l ⊥ P 아님!)`, '#fda4af', 13);
        }
      } else if (sub === 'doorHinge') {
        draw3DPolygon([{ x: -R, y: -R, z: zP }, { x: R, y: -R, z: zP }, { x: R, y: R, z: zP }, { x: -R, y: R, z: zP }], 'rgba(16, 185, 129, 0.18)', '#34d399', 2.2);
        draw3DText({ x: -R + 0.6, y: R - 0.5, z: zP }, '바닥 평면 P', '#6ee7b7', 13);

        // 수직 경첩 기둥 직선 l
        const hDoor = 2.4;
        draw3DLine({ x: 0, y: 0, z: zP - 0.5 }, { x: 0, y: 0, z: zP + hDoor + 0.4 }, '#38bdf8', 5.5, false, true);
        draw3DText({ x: 0, y: 0, z: zP + hDoor + 0.7 }, '경첩 수선 l (l ⊥ P)', '#38bdf8', 13);

        const doorAng = (0.15 + state.animProg * 0.7) * Math.PI;
        const wDoor = 2.3;
        const dx = wDoor * Math.cos(doorAng), dy = wDoor * Math.sin(doorAng);

        draw3DPolygon(
          [
            { x: 0, y: 0, z: zP },
            { x: dx, y: dy, z: zP },
            { x: dx, y: dy, z: zP + hDoor },
            { x: 0, y: 0, z: zP + hDoor }
          ],
          'rgba(251, 191, 36, 0.32)', '#fbbf24', 2.8
        );
        draw3DLine({ x: -dx * 0.4, y: -dy * 0.4, z: zP }, { x: dx * 1.2, y: dy * 1.2, z: zP }, '#f43f5e', 4.5, false, true);
        draw3DRightAngle({ x: 0, y: 0, z: zP }, { x: dx, y: dy, z: 0 }, { x: 0, y: 0, z: 1 }, 0.48, '#fbbf24');
        draw3DText({ x: dx * 0.6, y: dy * 0.6, z: zP + hDoor / 2 }, '문짝 평면 Q (언제나 P ⊥ Q!)', '#fef08a', 13);
      } else if (sub === 'threePlanes') {
        const z1 = -1.0, z2 = 1.0;
        draw3DPolygon([{ x: -R, y: -R, z: z1 }, { x: R, y: -R, z: z1 }, { x: R, y: R, z: z1 }, { x: -R, y: R, z: z1 }], 'rgba(52, 211, 153, 0.18)', '#34d399', 2);
        draw3DPolygon([{ x: -R, y: -R, z: z2 }, { x: R, y: -R, z: z2 }, { x: R, y: R, z: z2 }, { x: -R, y: R, z: z2 }], 'rgba(56, 189, 248, 0.18)', '#38bdf8', 2);
        draw3DText({ x: -R + 0.6, y: R - 0.4, z: z1 }, '평면 P', '#34d399', 13);
        draw3DText({ x: -R + 0.6, y: R - 0.4, z: z2 }, '평면 Q (P ∥ Q)', '#38bdf8', 13);

        const shiftX = (state.animProg - 0.5) * 1.4;
        const xBot = -0.5, xTop = 0.5 + shiftX;
        draw3DPolygon(
          [
            { x: xBot, y: -R, z: z1 - 0.3 },
            { x: xBot, y: R, z: z1 - 0.3 },
            { x: xTop, y: R, z: z2 + 0.3 },
            { x: xTop, y: -R, z: z2 + 0.3 }
          ],
          'rgba(251, 191, 36, 0.24)', '#fbbf24', 2.2
        );

        // 두 교선 l, m 강조!
        draw3DLine({ x: xBot, y: -R, z: z1 }, { x: xBot, y: R, z: z1 }, '#f43f5e', 5.5, false, true);
        draw3DLine({ x: xTop, y: -R, z: z2 }, { x: xTop, y: R, z: z2 }, '#f43f5e', 5.5, false, true);
        draw3DText({ x: xBot + 0.5, y: -R + 0.4, z: z1 }, '교선 m', '#fda4af', 13);
        draw3DText({ x: xTop + 0.5, y: -R + 0.4, z: z2 }, '교선 l (l ∥ m 평행!)', '#fda4af', 13);
      } else {
        // planeDet: 한 평면을 결정하는 4가지 조건
        const caseIdx = Math.min(3, Math.floor(state.animProg * 3.99));
        draw3DPolygon([{ x: -R, y: -R, z: 0 }, { x: R, y: -R, z: 0 }, { x: R, y: R, z: 0 }, { x: -R, y: R, z: 0 }], 'rgba(52, 211, 153, 0.22)', '#34d399', 2.5);

        if (caseIdx === 0) {
          draw3DPoint({ x: -1.4, y: -1.0, z: 0 }, 7, '#fbbf24', '점 A');
          draw3DPoint({ x: 1.5, y: -0.8, z: 0 }, 7, '#fbbf24', '점 B');
          draw3DPoint({ x: 0.2, y: 1.4, z: 0 }, 7, '#fbbf24', '점 C');
          draw3DText({ x: 0, y: 0, z: 1.4 }, '① 한 직선 위에 있지 않은 점 3개 ➔ 평면 1개 고정!', '#fef08a', 13.5);
        } else if (caseIdx === 1) {
          draw3DLine({ x: -2.2, y: -0.9, z: 0 }, { x: 2.2, y: -0.9, z: 0 }, '#38bdf8', 5, false, true);
          draw3DPoint({ x: 0.3, y: 1.3, z: 0 }, 7, '#fbbf24', '직선 밖의 한 점 A');
          draw3DText({ x: 0, y: 0, z: 1.4 }, '② 한 직선 l 과 그 밖의 한 점 A ➔ 평면 1개 고정!', '#fef08a', 13.5);
        } else if (caseIdx === 2) {
          draw3DLine({ x: -2.2, y: -1.4, z: 0 }, { x: 2.2, y: 1.4, z: 0 }, '#38bdf8', 5, false, true);
          draw3DLine({ x: -2.2, y: 1.4, z: 0 }, { x: 2.2, y: -1.4, z: 0 }, '#fbbf24', 5, false, true);
          draw3DPoint({ x: 0, y: 0, z: 0 }, 7, '#f43f5e', '교점 O');
          draw3DText({ x: 0, y: 0, z: 1.4 }, '③ 한 점에서 만나는 두 직선 ➔ 평면 1개 고정!', '#fef08a', 13.5);
        } else {
          draw3DLine({ x: -2.2, y: -0.9, z: 0 }, { x: 2.2, y: -0.9, z: 0 }, '#38bdf8', 5, false, true);
          draw3DLine({ x: -2.2, y: 0.9, z: 0 }, { x: 2.2, y: 0.9, z: 0 }, '#fbbf24', 5, false, true);
          draw3DText({ x: 0, y: 0, z: 1.4 }, '④ 서로 평행한 두 직선 (l ∥ m) ➔ 평면 1개 고정!', '#fef08a', 13.5);
        }
      }
    }

    // ==================== [탭 4 렌더링: 6대 공간 명제 참·거짓 3D 반례 시뮬레이터] ====================
    function renderTab4SpacePropositions(rect) {
      const sub = state.sub[4];
      const t = state.animProg;
      const R = 2.7, zP = -1.0;

      if (sub === 'prop1') {
        draw3DLine({ x: 0, y: 0, z: -2.0 }, { x: 0, y: 0, z: 2.2 }, '#38bdf8', 5.0, false, true);
        draw3DText({ x: 0, y: 0, z: 2.5 }, '기준 기둥 직선 l', '#38bdf8', 13.5);

        const zm = -0.6;
        draw3DLine({ x: -2.4, y: 0, z: zm }, { x: 2.4, y: 0, z: zm }, '#34d399', 4.5, false, true);
        draw3DRightAngle({ x: 0, y: 0, z: zm }, { x: 1, y: 0, z: 0 }, { x: 0, y: 0, z: 1 }, 0.42, '#34d399');
        draw3DText({ x: 2.6, y: 0, z: zm }, 'm (l⊥m)', '#34d399', 13);

        const zn = 0.7;
        const rotAng = t * (Math.PI / 2);
        const dx = 2.4 * Math.cos(rotAng), dy = 2.4 * Math.sin(rotAng);
        draw3DLine({ x: -dx, y: -dy, z: zn }, { x: dx, y: dy, z: zn }, '#fbbf24', 4.8, false, true);
        draw3DRightAngle({ x: 0, y: 0, z: zn }, { x: Math.cos(rotAng), y: Math.sin(rotAng), z: 0 }, { x: 0, y: 0, z: 1 }, 0.42, '#fbbf24');
        draw3DText({ x: dx, y: dy, z: zn + 0.35 }, t < 0.15 ? 'n (성립 사례: m∥n)' : '⚡ 반례 직선 n (l⊥n 이지만 m과 꼬인 위치!)', '#fbbf24', 13);
      } else if (sub === 'prop2') {
        draw3DPolygon([{ x: -R, y: -R, z: zP }, { x: R, y: -R, z: zP }, { x: R, y: R, z: zP }, { x: -R, y: R, z: zP }], 'rgba(16, 185, 129, 0.18)', '#34d399', 2);
        draw3DText({ x: -R + 0.6, y: R - 0.5, z: zP }, '평면 P', '#6ee7b7', 13);

        draw3DLine({ x: -2.4, y: -0.6, z: 0.3 }, { x: 2.4, y: -0.6, z: 0.3 }, '#38bdf8', 4.5, false, true);
        draw3DText({ x: 2.6, y: -0.6, z: 0.3 }, 'l (l ∥ P)', '#38bdf8', 13);

        const rotAng = t * (Math.PI / 2);
        const dx = 2.4 * Math.cos(rotAng), dy = 2.4 * Math.sin(rotAng);
        draw3DLine({ x: -dx, y: 0.5 - dy, z: 1.1 }, { x: dx, y: 0.5 + dy, z: 1.1 }, '#fbbf24', 4.8, false, true);
        draw3DText({ x: dx, y: 0.5 + dy, z: 1.45 }, t < 0.15 ? 'm (성립 사례: l ∥ m)' : '⚡ 반례 직선 m (m ∥ P 이지만 l과 꼬인 위치!)', '#fbbf24', 13);
      } else if (sub === 'prop3') {
        draw3DPolygon([{ x: -R, y: -R, z: zP }, { x: R, y: -R, z: zP }, { x: R, y: R, z: zP }, { x: -R, y: R, z: zP }], 'rgba(16, 185, 129, 0.2)', '#34d399', 2.2);
        const yShift = (t - 0.5) * 1.6;
        draw3DLine({ x: -1.3, y: 0, z: -1.8 }, { x: -1.3, y: 0, z: 2.0 }, '#38bdf8', 5.0, false, true);
        draw3DLine({ x: 1.3, y: yShift, z: -1.8 }, { x: 1.3, y: yShift, z: 2.0 }, '#fbbf24', 5.0, false, true);
        draw3DRightAngle({ x: -1.3, y: 0, z: zP }, { x: 1, y: 0, z: 0 }, { x: 0, y: 0, z: 1 }, 0.42, '#38bdf8');
        draw3DRightAngle({ x: 1.3, y: yShift, z: zP }, { x: -1, y: 0, z: 0 }, { x: 0, y: 0, z: 1 }, 0.42, '#fbbf24');
        draw3DText({ x: 0, y: 0, z: 2.3 }, '⭕ 참(O): 바닥에 수직인 두 기둥 l, m은 어디로 옮겨도 항상 평행 (l ∥ m)!', '#34d399', 13.5);
      } else if (sub === 'prop4') {
        draw3DPolygon([{ x: -R, y: -R, z: zP }, { x: R, y: -R, z: zP }, { x: R, y: R, z: zP }, { x: -R, y: R, z: zP }], 'rgba(16, 185, 129, 0.18)', '#34d399', 2);
        draw3DPolygon([{ x: -2.2, y: 1.1, z: zP }, { x: 2.2, y: 1.1, z: zP }, { x: 2.2, y: 1.1, z: 1.6 }, { x: -2.2, y: 1.1, z: 1.6 }], 'rgba(56, 189, 248, 0.28)', '#38bdf8', 2.4);
        draw3DText({ x: -1.4, y: 1.1, z: 1.3 }, '벽면 Q (P⊥Q)', '#38bdf8', 13);

        const rotAng = t * (Math.PI / 2);
        const cy = t * 1.1 - (1 - t) * 1.0;
        const dx = 2.0 * Math.cos(rotAng), dy = 2.0 * Math.sin(rotAng);
        draw3DPolygon([{ x: -dx, y: cy - dy, z: zP }, { x: dx, y: cy + dy, z: zP }, { x: dx, y: cy + dy, z: 1.6 }, { x: -dx, y: cy - dy, z: 1.6 }], 'rgba(251, 191, 36, 0.30)', '#fbbf24', 2.5);
        draw3DText({ x: dx * 0.5, y: cy + dy * 0.5, z: 1.95 }, t < 0.15 ? '벽면 R (Q ∥ R)' : '⚡ 반례 벽면 R (P⊥R 이지만 Q와 교선에서 수직 교차!)', '#fbbf24', 13);
      } else if (sub === 'prop5') {
        const z1 = -0.9, z2 = 0.2 + t * 0.9;
        draw3DPolygon([{ x: -2.2, y: -2.2, z: z1 }, { x: 2.2, y: -2.2, z: z1 }, { x: 2.2, y: 2.2, z: z1 }, { x: -2.2, y: 2.2, z: z1 }], 'rgba(52, 211, 153, 0.22)', '#34d399', 2.2);
        draw3DPolygon([{ x: -2.2, y: -2.2, z: z2 }, { x: 2.2, y: -2.2, z: z2 }, { x: 2.2, y: 2.2, z: z2 }, { x: -2.2, y: 2.2, z: z2 }], 'rgba(56, 189, 248, 0.24)', '#38bdf8', 2.2);
        draw3DLine({ x: 0, y: 0, z: -1.8 }, { x: 0, y: 0, z: 2.1 }, '#fbbf24', 5.5, false, true);
        draw3DRightAngle({ x: 0, y: 0, z: z1 }, { x: 1, y: 0, z: 0 }, { x: 0, y: 0, z: 1 }, 0.42, '#34d399');
        draw3DRightAngle({ x: 0, y: 0, z: z2 }, { x: 1, y: 0, z: 0 }, { x: 0, y: 0, z: 1 }, 0.42, '#38bdf8');
        draw3DText({ x: 0, y: 0, z: 2.4 }, '⭕ 참(O): 한 기둥 직선 l에 수직인 두 평면 P, Q는 언제나 평행 (P ∥ Q)!', '#34d399', 13.5);
      } else {
        // prop6: l ⊥ P 이고 l ⊥ m 이면 m ∥ P ? -> m이 바닥 평면 P에 포함(m ⊂ P)될 수도 있음!
        draw3DPolygon([{ x: -R, y: -R, z: zP }, { x: R, y: -R, z: zP }, { x: R, y: R, z: zP }, { x: -R, y: R, z: zP }], 'rgba(16, 185, 129, 0.2)', '#34d399', 2.2);
        draw3DLine({ x: 0, y: 0, z: zP - 0.8 }, { x: 0, y: 0, z: 2.0 }, '#fbbf24', 5.5, false, true);
        draw3DText({ x: 0, y: 0, z: 2.3 }, '수직 기둥 l (l ⊥ P)', '#fbbf24', 13.5);

        const zm = zP + (1 - t) * 1.8; // t=0이면 공중(평행), t=1이면 바닥(zP)에 완전히 착지하여 평면 P에 포함됨!
        draw3DLine({ x: -2.4, y: 0, z: zm }, { x: 2.4, y: 0, z: zm }, '#f43f5e', 5.5, false, true);
        draw3DRightAngle({ x: 0, y: 0, z: zm }, { x: 1, y: 0, z: 0 }, { x: 0, y: 0, z: 1 }, 0.45, '#f43f5e');
        draw3DText(
          { x: 0, y: -1.4, z: zm + 0.35 },
          t < 0.85 ? '공중에 떠 있을 때: m ∥ P (평행)' : '💥 반례 발생: 직선 m이 평면 P 안에 포함됨 (평행 아님!)',
          '#fda4af', 13.5
        );
      }
    }

  /* ===== 2.0 연결: 원본 state ↔ 셸 상태, 장면 목록, 조작부 ===== */
  const clamp = APLab.clamp;
  const D2R = Math.PI / 180;
  const RECT = { width: 1000, height: 700 }; // 원본 캔버스 대신 쓰는 가상 캔버스(무대가 화면 크기에 맞춰 줍니다)
  const RENDER = { 1: renderTab1PolyhedraSkew, 2: renderTab2FoldingRelations, 3: renderTab3LinesAndPlanes, 4: renderTab4SpacePropositions };
  const TABS = [
    '다면체에서 꼬인 위치 찾기 (6종)',
    '전개도 접어 위치 관계 알아보기 (4종)',
    '직선·평면의 수직과 평면이 정해지는 조건 (4종)',
    '공간에서의 설명 참·거짓과 반례 (6종)'
  ];
  const SHORT = ['꼬인 위치 찾기', '전개도 접기', '수직·평면이 정해지는 조건', '설명의 참·거짓과 반례'];
  const QUESTIONS = [
    '모서리가 많은 입체에서 기준 모서리와 꼬인 위치인 모서리를 어떻게 빠짐없이 가려낼까?',
    '전개도를 접으면 어떤 모서리와 면이 평행·수직·꼬인 위치가 될까?',
    '직선과 평면이 수직이려면, 평면이 하나로 정해지려면 어떤 조건이 필요할까?',
    '“그럴 것 같은” 공간에서의 설명 중 어떤 것이 항상 참이고, 어떤 것은 반례가 있을까?'
  ];
  const CAM = { iso: { yaw: -34, pitch: 30 }, illusion: { yaw: -48, pitch: 32 }, gap: { yaw: -90, pitch: 8 } };
  const SKEW_FILTERS = [['all', '0. 전체'], ['meet', '1단계: 만나는 선 지우기'], ['parallel', '2단계: 평행하거나 연장하면 만나는 선 지우기'], ['skewOnly', '3단계: 꼬인 위치만 남기기']];
  const near = (st, c) => Math.abs(st.yaw - c.yaw) < 1 && Math.abs(st.pitch - c.pitch) < 1;
  const tone = (p) => (p.ok === false ? 'red' : p.color);
  const arrow = (v) => (typeof v === 'string' ? arrowOnly(v) : Array.isArray(v) ? v.map(arrow) : v && typeof v === 'object' ? Object.fromEntries(Object.entries(v).map(([k, x]) => [k, arrow(x)])) : v);
  let LAST = ''; // 장면이 바뀌면 확대·이동을 처음 맞춤으로 되돌립니다

  function sync(s, m, id) {
    state.mode = m;
    state.sub[m] = id;
    state.skewFilter = s.skewFilter;
    state.refType = s.refType;
    state.laserExtend = !!s.laserExtend;
    state.activePartIdx = s.part == null ? -1 : s.part;
    state.animProg = s.anim;
    state.yaw = s.yaw * D2R;
    state.pitch = s.pitch * D2R;
  }

  function sceneOf(m, it) {
    const id = it.id;
    const label = arrow(it.label);
    return {
      id, title: label, short: label, reviewTab: true,
      question: QUESTIONS[m - 1],
      notesTitle: '헷갈리는 착시와 주의할 점',
      enter: (s) => {
        s.anim = m === 2 ? 0.35 : 1; // 원본 setMode/setSub: 진행도 초기화(탭 2는 35%)
        if (s.lastMode !== m) { s.yaw = CAM.iso.yaw; s.pitch = CAM.iso.pitch; s.lastMode = m; } // 원본 setMode: 탐구관을 바꾸면 입체뷰로
      },
      // [2.0 수정] 탭 1(다면체 소거 스캐너)에서는 진행도가 그림을 바꾸지 않으므로 슬라이더를 숨깁니다
      controls: () => (m === 1 ? [] : ['anim']).concat(['yaw', 'pitch']),
      presets: () => {
        const out = [];
        if (m === 1) {
          SKEW_FILTERS.forEach(([k, lbl]) => out.push({ group: '지우기 단계', label: lbl, apply: (st) => { st.skewFilter = k; st.part = null; }, on: (st) => st.skewFilter === k }));
          [['base', '밑면 모서리 (AB)'], ['side', '옆모서리 (AE / VA)']].forEach(([k, lbl]) => out.push({ group: '기준 모서리', label: lbl, apply: (st) => { st.refType = k; st.part = null; }, on: (st) => st.refType === k }));
          [[true, '켜기'], [false, '끄기']].forEach(([k, lbl]) => out.push({ group: '모서리의 무한 연장선', label: lbl, apply: (st) => { st.laserExtend = k; }, on: (st) => !!st.laserExtend === k }));
          [['iso', '입체 보기'], ['illusion', '착시 시점'], ['gap', '실제 간격 확인']].forEach(([k, lbl]) => out.push({ group: '시점', label: lbl, set: CAM[k], ms: 600, on: (st) => near(st, CAM[k]) }));
        } else {
          [0, 0.5, 1].forEach((v) => out.push({ group: '진행도', label: v === 0 ? '0% 평면·성립' : v === 1 ? '100% 입체·반례' : '50%', set: { anim: v }, ms: 700, on: (st) => Math.abs(st.anim - v) < 0.01 }));
          if (id === 'planeDet') ['① 점 3개', '② 직선+점', '③ 만나는 두 직선', '④ 평행한 두 직선'].forEach((lbl, i) => out.push({ group: '정해지는 조건', label: lbl, set: { anim: 0.1 + i * 0.25 }, ms: 300, on: (st) => Math.min(3, Math.floor(st.anim * 3.99)) === i }));
          [['iso', '입체 보기']].forEach(([k, lbl]) => out.push({ group: '시점', label: lbl, set: CAM[k], ms: 600, on: (st) => near(st, CAM[k]) }));
        }
        return out;
      },
      actions: () => [
        {
          id: 'act', play: true, primary: true, icon: 'wand',
          label: (st) => { sync(st, m, id); return arrow(getSpec().actionTxt); },
          // 탭 1: 원본 triggerAnim — 2D 착시 시점 ↔ 실제 간격 시점 / 그 밖: 진행도 0% ↔ 100%
          run: (st, lab) => { if (m === 1) lab.tween(Math.abs(st.yaw - CAM.illusion.yaw) < 9 ? CAM.gap : CAM.illusion, 700); else lab.tween({ anim: st.anim > 0.5 ? 0 : 1 }, 1100); }
        },
        { id: 'spin', icon: (st) => (st.playing ? 'pause' : 'play'), label: (st) => (st.playing ? '자동 회전 멈춤' : '자동 회전'), on: (st) => st.playing, run: (st) => { st.playing = !st.playing; } }
      ],
      tick: (s, dt) => { if (!s.playing) return false; s.yaw += 34 * dt; if (s.yaw > 180) s.yaw -= 360; return true; },
      view: (s) => {
        sync(s, m, id);
        const spec = arrow(getSpec());
        return {
          guide: `<div style="font-weight:800;margin-bottom:6px">${APLab.esc(APLab.stripEmoji(spec.badge))}</div>${spec.hint}`,
          status: { tone: 'info', text: `시점 ${Math.round(s.yaw)}° · ${Math.round(s.pitch)}° — 빈 곳을 끌면 회전` },
          parts: spec.parts.map((p) => ({ id: p.id, name: p.name, desc: p.desc, value: p.val, color: tone(p), ok: p.ok })),
          summary: spec.totalRes,
          rule: spec.rule,
          formula: spec.formulaHTML,
          notes: spec.notes,
          // 원본 하단 '실시간 공간 위치 관계·소거 구조' 막대 → 무대 아래 띠(그림을 가리지 않음)
          tape: { title: '공간 위치 관계·지우기 구성 · ' + spec.totalRes, segments: spec.bars.map((x) => ({ text: x.label, weight: x.weight, color: x.color })) }
        };
      },
      draw: (b, s) => {
        BOARD = b;
        const paint = (st) => { sync(st, m, id); ctx.reset(); if (st.grid) b.grid({ step: 40 }); RENDER[m](RECT); };
        if (b._bbox) { paint(s); return; } // 자동 맞춤을 재는 중
        // 회전할 때마다 도형과 라벨이 모두 화면 안에 들어오도록 맞춥니다(사용자 확대·이동은 유지)
        const bb = b.measure(() => paint(s));
        if (bb) b.setFocus(b.fitBox(bb, { margin: 0.06, px: b.thumb ? 5 : 10 }), false);
        if (!b.thumb && LAST !== m + id) { LAST = m + id; b.fit(); }
        paint(s);
      }
    };
  }

  const groups = Object.keys(SUB_MENUS).map((k) => {
    const m = +k;
    return { id: 'm' + m, title: TABS[m - 1], short: SHORT[m - 1], scenes: SUB_MENUS[m].map((it) => sceneOf(m, it)) };
  });

  APLab.createLab({
    id: 'g7-spatial',
    title: '위치 관계 · 반례',
    courseName: '중1',
    unit: '기본 도형',
    courseColor: 'var(--m-green)',
    home: '../index.html#g7',
    legacy: '../../labs/g7/spatial-relations.html',
    board: {
      kind: 'figure', grid: false, minZoom: 0.4, maxZoom: 5,
      // 빈 곳을 끌면 카메라 회전(원본과 같은 감도, 기울기 -10°~85°)
      orbit: (s, dx, dy) => {
        s.yaw += dx * 0.0085 / D2R;
        if (s.yaw > 180) s.yaw -= 360;
        if (s.yaw < -180) s.yaw += 360;
        s.pitch = clamp(s.pitch + dy * 0.0075 / D2R, -10, 85);
      }
    },
    state: { skewFilter: 'skewOnly', refType: 'base', laserExtend: true },
    persist: ['skewFilter', 'refType', 'laserExtend'],
    params: {
      anim: { value: 1, min: 0, max: 1, step: 0.005, color: 'amber', label: '진행도 (0% → 100%)', hint: '전개도 접기 · 문짝 회전 · 반례를 천천히 확인합니다', format: (v) => `${Math.round(v * 100)}%` },
      yaw: { value: -34, min: -180, max: 180, step: 1, color: 'muted', label: '좌우 회전', format: (v) => `${Math.round(v)}°` },
      pitch: { value: 30, min: -10, max: 85, step: 1, color: 'muted', label: '위아래 기울기', format: (v) => `${Math.round(v)}°` }
    },
    groups
  });
});
</script>
