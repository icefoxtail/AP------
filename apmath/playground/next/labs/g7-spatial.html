<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a100e">
<title>위치 관계 · AP Math 실험실</title>
<meta name="description" content="중1 공간 위치 관계: 꼬인 위치 찾기(만나는 모서리·평행한 모서리 지우기), 공간에서의 설명 참·거짓과 반례, 평면이 하나로 정해지는 조건, 전개도를 접어 알아보는 위치 관계, 직선과 평면의 수직·평행을 입체를 직접 돌려 보며 탐구하고 정리와 5지선다 문제로 확인합니다.">
<script>try{var t=localStorage.getItem('apl:theme');t=t?JSON.parse(t):(matchMedia('(prefers-color-scheme: light)').matches?'paper':'board');document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="../kit/vendor/katex/katex.min.css">
<link rel="stylesheet" href="../kit/apl.css">
<script defer src="../kit/vendor/katex/katex.min.js"></script>
<script defer src="../kit/vendor/qrcode.js"></script>
<script defer src="../kit/apl-core.js"></script>
<script defer src="../kit/apl-board.js"></script>
<script defer src="../kit/apl-shell.js"></script>
</head>
<body>
<noscript>이 실험실을 보려면 브라우저에서 자바스크립트를 켜야 합니다.</noscript>
<script>
/* ==========================================================================
   중1 · 위치 관계 (AP Math Lab 2.0) — Ⅰ-2. 위치 관계와 평행선의 성질 중 「공간」 부분
   탭(order 순): ① 꼬인 위치(10, 7장면) · ② 공간에서의 설명(20, 7) · ③ 평면이 정해지는 조건(30, 6) · ④ 전개도와 위치 관계(40, 4) · ⑤ 직선·평면의 수직과 평행(50, 3)
   이 파일은 얇은 껍데기입니다. 공용 도구는 labs/g7-spatial/core.js(입체·투영·라벨 배치·문제 틀), 공간 명제 그림은 stmt.js,
   각 탭은 t1~t5.js 모듈이 window.APL_SP_GROUPS 에 { order, id, title, short, params, scenes } 를 등록하면 order 순으로 붙습니다.
   원칙(학생 가독성)
   - 입체는 처음부터 3차원 보기 · 빈 곳을 끌면 시점이 제자리에서 돌아갑니다(이동이 아니라 회전) · 안 보이는 모서리는 점선
   - 색의 역할: 노랑=기준 모서리·구하는 것 · 빨강=만나는 · 파랑=평행한 · 초록=꼬인 위치·평면 · 보라=연장선
   - 조절 막대·손잡이로 도형을 바꾸면 라벨·식·보기·정답이 그 값으로 다시 계산됩니다. 탐구 → 정리(교과서 해결 전략 순서) → 문제(5지선다 + 숫자 바꾸기)
   ========================================================================== */
window.addEventListener('DOMContentLoaded', function () {
'use strict';
const MODULES = ['core', 'stmt', 't1', 't2', 't3', 't4', 't5'];
const loadScript = (src) => new Promise((res) => {
  const el = document.createElement('script');
  el.src = src; el.async = false;
  el.onload = () => res(true);
  el.onerror = () => { el.remove(); res(false); }; // 아직 없는 모듈은 건너뜁니다
  document.head.append(el);
});

function start() {
  const mods = (window.APL_SP_GROUPS || []).filter((g) => g && Array.isArray(g.scenes) && g.scenes.length);
  const groups = mods.slice().sort((a, b) => (a.order || 0) - (b.order || 0)).map((g) => ({ id: g.id, title: g.title, short: g.short || g.title, scenes: g.scenes }));
  const params = {};
  mods.forEach((g) => Object.assign(params, g.params || {}));
  const clamp = APLab.clamp;
  APLab.createLab({
    id: 'g7-spatial',
    title: '위치 관계 · 반례',
    courseName: '중1',
    unit: '기본 도형',
    courseColor: 'var(--m-green)',
    home: '../index.html#g7',
    legacy: '../../labs/g7/spatial-relations.html',
    board: {
      kind: 'figure', grid: false, pad: 0.02, minZoom: 0.5, maxZoom: 6,
      // 빈 곳을 끌면 시점이 제자리에서 돌아갑니다(좌우 회전·위아래 기울기)
      orbit: (s, dx, dy) => {
        s.spSpin = false;
        s.spYaw = (s.spYaw || 0) + dx * 0.5;
        if (s.spYaw > 180) s.spYaw -= 360;
        if (s.spYaw < -180) s.spYaw += 360;
        s.spPitch = clamp((s.spPitch == null ? 24 : s.spPitch) + dy * 0.4, -10, 80);
      }
    },
    // 장면에 들어올 때마다 화면 범위를 처음 상태로 되돌립니다. 그림 맞춤은 장면 그리기에서 매번 합니다.
    enter: (s, sc, lab) => { if (lab && lab.board && s === lab.s) { lab.board.fit(); lab.board.setPanes(null); lab.board.setInsets({ top: 0, right: 0, bottom: 0, left: 0 }); } },
    params,
    groups
  });
}
Promise.all(MODULES.map((m) => loadScript(`g7-spatial/${m}.js`))).then(start);
});
</script>
</body>
</html>
