<script>try{var t=localStorage.getItem('apl:theme');t=t?JSON.parse(t):'paper';document.documentElement.setAttribute('data-theme',t==='board'?'board':'paper')}catch(e){document.documentElement.setAttribute('data-theme','paper')}</script>

<body>

<script>
/* ==========================================================================
   공통수학 · 평면좌표 (AP Math Lab 2.0) — 6개 장면
   소단원 입문(거리·중점·내분점)에서 기출 유형(무게중심·내심 삼각형, 이등변삼각형이 되는 점,
   좌표를 잡아 증명하기)까지 이어지고, 마지막에 이전 교육과정의 외분점을 둡니다.
   - 장면마다 탐구(끌어 보기) · 정리(단계 풀이) · 문제(기출 변형, 「새 문제」) 3탭.
   - 문제 그림에는 지문에 주어진 값만 보이고, 답과 보조선은 정리 탭의 단계를 누르면 나타납니다.
   - 「새 문제」는 같은 유형의 숫자·상황만 바꾼 변형이며, 연속해서 같은 문제가 나오지 않습니다.
   ========================================================================== */
window.addEventListener('DOMContentLoaded', function () {
  const { tex, clamp } = APLab;

  /* ===== 좌표 도우미 ===== */
  const P = (x, y) => ({ x, y });
  const midP = (p, q) => P((p.x + q.x) / 2, (p.y + q.y) / 2);
  const lerpP = (p, q, t) => P(p.x + (q.x - p.x) * t, p.y + (q.y - p.y) * t);
  const distP = (p, q) => Math.hypot(p.x - q.x, p.y - q.y);
  const areaP = (A, B, C) => Math.abs((B.x - A.x) * (C.y - A.y) - (B.y - A.y) * (C.x - A.x)) / 2;
  const gcd = (a, b) => (b ? gcd(b, a % b) : Math.abs(a));
  const snapTo = (v, st) => Math.round(v / st) * st;
  const n2 = (v) => { let r = Math.round(v * 100) / 100; if (r === 0) r = 0; return String(r).replace('-', '−'); }; // 화면용(유니코드 마이너스)
  const nt = (v) => n2(v).replace('−', '-'); // 수식용
  const rounded = (v) => Math.abs(v - Math.round(v * 100) / 100) > 1e-9;
  const valueS = (v) => `${rounded(v) ? '≈ ' : ''}${n2(v)}`;
  const pS = (p) => `${rounded(p.x) || rounded(p.y) ? '≈ ' : ''}(${n2(p.x)}, ${n2(p.y)})`;
  const pT = (p) => `(${nt(p.x)}, ${nt(p.y)})`;
  function sqrtSimp(n) { let o = 1, i = n; for (let f = 2; f * f <= i; f++) while (i % (f * f) === 0) { i /= f * f; o *= f; } return [o, i]; }
  const radTex = (n) => { const [o, i] = sqrtSimp(Math.round(n)); return i === 1 ? String(o) : (o === 1 ? '' : o) + `\\sqrt{${i}}`; };
  const radStr = (n) => { const [o, i] = sqrtSimp(Math.round(n)); return i === 1 ? String(o) : (o === 1 ? '' : o) + '√' + i; };
  const ratio = (a, b) => { const g = gcd(Math.round(a * 1000), Math.round(b * 1000)) || 1; return [Math.round(a * 1000) / g, Math.round(b * 1000) / g]; };
  /** 선분 pq 옆에 붙이는 글자의 화면 오프셋: 선분에 수직이고 ref 점의 반대쪽 */
  function perp(p, q, ref, d = 15) {
    const vx = q.x - p.x, vy = -(q.y - p.y), l = Math.hypot(vx, vy) || 1;
    let nx = -vy / l, ny = vx / l;
    const m = midP(p, q), rx = ref.x - m.x, ry = -(ref.y - m.y);
    if (nx * rx + ny * ry > 0) { nx = -nx; ny = -ny; }
    return { dx: nx * d, dy: ny * d };
  }
  /** 점 p의 이름표를 from 점의 반대쪽으로 d(px)만큼 띄우는 오프셋(끌기 손잡이와 겹치지 않게) */
  function away(p, from, d = 24) {
    const vx = p.x - from.x, vy = -(p.y - from.y), l = Math.hypot(vx, vy) || 1, ux = vx / l, uy = vy / l;
    if (Math.abs(ux) > 0.5) return { dx: ux > 0 ? 16 : -16, dy: uy * d * 0.7, align: ux > 0 ? 'left' : 'right' };
    return { dx: 0, dy: uy >= 0 ? d : -d, align: 'center' };
  }
  /** 화면 왼쪽 위에 색깔 범례(선의 이름표). 그림이 좁아도 선 이름이 가려지지 않게 화면 좌표로 씁니다. */
  function legend(b, items) { const y0 = (b.insets.top || 0) + 18; items.forEach(([c, t], i) => b.stext(10, y0 + i * 17, t, { color: c, size: 12.5, align: 'left' })); }
  /** 점들을 모두 담는 무대 범위(여백 포함) */
  function boxOf(pts, pad = 1.5) {
    const xs = pts.map((p) => p.x), ys = pts.map((p) => p.y);
    return { x: [Math.min(...xs) - pad, Math.max(...xs) + pad], y: [Math.min(...ys) - pad, Math.max(...ys) + pad] };
  }
  /** 장면·탭·문제가 바뀌면 무대 범위를 새로 맞춥니다(한 장면 안에서 변형마다 범위가 다를 수 있음). */
  function useView(b, key, box) {
    b.focus = box;
    if (b.__ccKey !== key) { b.__ccKey = key; b.fit(); }
  }

  /* ===== 변형 문제 (「새 문제」) ===== */
  // pool: 변형을 만드는 함수들. 처음에는 pool[0](기출 유형 그대로), 「새 문제」는 직전과 다른 변형.
  function varier(pool) {
    let idx = 0, cur = pool[0]();
    return { pool, get idx() { return idx; }, cur: () => cur, set(j) { idx = j; cur = pool[j](); return cur; }, next() { let j; do { j = Math.floor(Math.random() * pool.length); } while (pool.length > 1 && j === idx); idx = j; cur = pool[j](); return cur; } };
  }
  const probHTML = (body) => `${body}<div style="margin-top:10px"><button type="button" class="apl-btn sm" data-cc-new>새 문제</button></div>`;
  document.addEventListener('click', (ev) => {
    const hit = ev.target && ev.target.closest && ev.target.closest('[data-cc-new]');
    if (!hit) return;
    const lab = window.lab, sc = lab && lab.scene;
    if (!sc || !sc.vary) return;
    sc.vary.next();
    lab.s.revealed = false;
    lab.setStep(0);
    try { lab._buildReview(); } catch (e) { /* 키트가 바뀌어도 그림은 그대로 */ }
    lab.invalidate(true);
  });
  // 전체 장면 보기는 enter 전에도 다른 장면의 단계 수를 묻습니다. 활성 탐구만 현재 상태를 읽습니다.
  const stepsOf = (V, id) => (s, lab = window.lab) => (lab && lab.tab === 'explore' && lab.scene && lab.scene.id === id ? exploreSteps(id, s) : V.cur().steps).map((t) => t.replace(/<\/?b>/g, ''));
  const reviewTop = (V) => () => `<div class="apl-rich" style="font-size:var(--fs-sm);line-height:1.75"><small style="color:var(--text-3);font-weight:800">문제</small><br>${V.cur().text}</div>`;
  /** 탭에 따른 풀이 단계: 정리 탭은 s.step, 문제 탭·탐구 탭은 0 */
  const stepOf = (s, lab) => (lab && lab.tab === 'review' ? s.step : 0);
  const baseScene = (o) => ({ tabs: { compact: true }, ...o });

  /* ===== 그리기 도우미 ===== */
  function plane(b, s, ticks = true) { if (s.grid) b.grid(); b.axes({ ticks }); }
  /** 이름 붙은 고정점 */
  const dot = (b, p, label, color = 'ink', o = {}) => b.point(p, { color, r: 5, label, size: 13, ...o });

  const par = (v) => (v < 0 ? `(${nt(v)})` : nt(v)); // 수식 속 음수는 괄호로 감쌉니다

  /* ======================= 장면 1 · 두 점 사이의 거리와 중점 (기본) ======================= */
  function drawDistFig(b, A, B, st, o = {}) {
    const C = P(B.x, A.y), M = midP(A, B);
    const dx = Math.abs(B.x - A.x), dy = Math.abs(B.y - A.y), l2 = dx * dx + dy * dy;
    const tri = dx > 0 && dy > 0;
    if (st >= 1 && tri) {
      b.seg(A, C, { color: 'sky', width: 2.6, dash: true, ref: 'dx' });
      b.seg(C, B, { color: 'rose', width: 2.6, dash: true, ref: 'dy' });
      b.right(C, A, B, { color: 'amber', size: 10 });
      b.text(midP(A, C), `가로 ${n2(dx)}`, { color: 'sky', size: 12.5, ref: 'dx', ...perp(A, C, B, 14) });
      b.text(midP(C, B), `세로 ${n2(dy)}`, { color: 'rose', size: 12.5, ref: 'dy', ...perp(C, B, A, 14) });
    }
    b.seg(A, B, { color: st >= 2 ? 'amber' : 'ink', width: 3.4, glow: true, ref: 'ab' });
    if (st >= 2) b.text(lerpP(A, B, 0.3), `AB = ${radStr(l2)}`, { color: 'amber', size: 13, ref: 'ab', ...perp(A, B, tri ? C : P(M.x, M.y + 5), 17) });
    if (st >= 3) {
      b.ticks(A, M, { color: 'violet' }); b.ticks(M, B, { color: 'violet' });
      const off = perp(A, B, tri ? C : P(M.x, M.y + 5), 17);
      b.point(M, { color: 'violet', r: 5.5, label: `M${pS(M)}`, dx: -off.dx * 1.1, dy: -off.dy * 1.1, align: 'center', ref: 'm' });
    }
    if (o.handles) {
      const d = o.handles;
      b.handle('A', A, { color: 'amber', label: `A${pS(A)}`, ...away(A, M), drag: (w) => d.set('a', w) });
      b.handle('B', B, { color: 'amber', label: `B${pS(B)}`, ...away(B, M), drag: (w) => d.set('b', w) });
    } else {
      b.point(A, { color: 'ink', r: 5, label: `A${pS(A)}`, toward: M, size: 13 });
      b.point(B, { color: 'ink', r: 5, label: `B${pS(B)}`, toward: M, size: 13 });
    }
  }
  function mk1(A, B) {
    const dx = Math.abs(B.x - A.x), dy = Math.abs(B.y - A.y), l = Math.hypot(dx, dy), M = midP(A, B), ans = l + M.x + M.y;
    return {
      A, B, M, dx, dy, l, ans, box: boxOf([A, B, P(0, 0)], 2.6),
      text: `두 점 ${tex('A' + pT(A))}, ${tex('B' + pT(B))}에 대하여 선분 ${tex('AB')}의 길이를 ${tex('l')}, 선분 ${tex('AB')}의 중점을 ${tex('M(p,\\ q)')}라 할 때, ${tex('l+p+q')}의 값을 구하시오.`,
      steps: [
        `가로 변화량 $|x_2-x_1|=${dx}$, 세로 변화량 $|y_2-y_1|=${dy}$를 두 변으로 하는 직각삼각형을 만듭니다.`,
        `피타고라스 정리로 $l=\\sqrt{${dx}^2+${dy}^2}=${l}$`,
        `중점 $M=\\left(\\dfrac{${par(A.x)}+${par(B.x)}}{2},\\ \\dfrac{${par(A.y)}+${par(B.y)}}{2}\\right)=${pT(M)}$ → $l+p+q=${l}+${par(M.x)}+${par(M.y)}=${ans}$`
      ],
      ansTex: String(ans),
      std: `① 가로 변화량 ${tex(`|x_2-x_1|=|${nt(B.x)}-${par(A.x)}|=${dx}`)}, 세로 변화량 ${tex(`|y_2-y_1|=|${nt(B.y)}-${par(A.y)}|=${dy}`)}<br/>
② ${tex(`l=\\overline{AB}=\\sqrt{${dx}^2+${dy}^2}=\\sqrt{${dx * dx + dy * dy}}=${l}`)}<br/>
③ 중점 ${tex(`M\\left(\\dfrac{${par(A.x)}+${par(B.x)}}{2},\\ \\dfrac{${par(A.y)}+${par(B.y)}}{2}\\right)=M${pT(M)}`)}이므로 ${tex(`p=${nt(M.x)},\\ q=${nt(M.y)}`)}<br/>
④ ${tex(`l+p+q=${l}+${par(M.x)}+${par(M.y)}=${ans}`)}`,
      warn: '거리 공식에서 근호 안은 (가로 변화량)²+(세로 변화량)²입니다. 제곱하기 전에 뺄셈의 순서나 부호는 상관없지만, 더하기 전에 각각 제곱하는 것을 빠뜨리지 마세요.',
      quick: `가로·세로 변화량이 ${tex(`${dx},\\ ${dy}`)}이면 피타고라스 수 ${tex('(3,\\ 4,\\ 5)')}의 ${dx / 3 === dy / 4 ? `${dx / 3}배` : `${dx / 4}배`}꼴이라 근호 없이 바로 ${tex(`l=${l}`)}입니다. 중점은 두 좌표를 더해 2로 나누는 평균이므로 ${tex(`M${pT(M)}`)}입니다.`,
      highlight: '변화량이 (6, 8), (5, 12), (8, 15)처럼 나오면 피타고라스 수를 떠올려 제곱근 계산을 건너뜁니다.'
    };
  }
  const V1 = varier([
    () => mk1(P(-2, 1), P(4, 9)),
    () => mk1(P(3, -2), P(-3, 6)),
    () => mk1(P(-1, -3), P(7, 3)),
    () => mk1(P(-4, 3), P(2, -5)),
    () => mk1(P(0, -3), P(8, 3))
  ]);
  function scene1() {
    const FOCUS = { x: [-8, 10], y: [-5, 10.5] };
    const set = (s) => (which, w) => {
      const d = s.d1;
      const x = clamp(Math.round(w.x), -7, 9), y = clamp(Math.round(w.y), -4, 9);
      if (which === 'a') { if (x === d.bx && y === d.by) return; d.ax = x; d.ay = y; } else { if (x === d.ax && y === d.ay) return; d.bx = x; d.by = y; }
    };
    const EX = [
      ['3-4-5 꼴', { ax: -1, ay: -1, bx: 2, by: 3 }],
      ['6-8-10 꼴', { ax: -3, ay: -1, bx: 3, by: 7 }],
      ['가로선(세로 변화량 0)', { ax: -4, ay: 2, bx: 5, by: 2 }],
      ['세로선(가로 변화량 0)', { ax: 3, ay: -3, bx: 3, by: 6 }]
    ];
    return baseScene({
      id: 'dist', title: '두 점 사이의 거리와 중점', short: '거리·중점',
      question: '두 점 사이의 거리를 구하는 식은 왜 제곱의 합에 근호를 씌울까? 중점의 좌표는 어떻게 얻을까?',
      guide: '후광이 있는 두 점 <b>A, B</b>를 끌어 보세요. 가로 변화량과 세로 변화량이 직각삼각형의 두 변이 되고, <b>선분 AB는 그 빗변</b>입니다. 중점 M은 양 끝점 좌표의 평균입니다.',
      focus: FOCUS,
      enter: (s) => { s.d1 = { ax: -3, ay: -1, bx: 3, by: 7 }; },
      presets: () => EX.map(([label, v]) => ({ group: '예시', label, apply: (st) => { st.d1 = { ...v }; }, on: (st) => ['ax', 'ay', 'bx', 'by'].every((k) => st.d1[k] === v[k]) })),
      steps: stepsOf(V1, 'dist'),
      reviewTop: reviewTop(V1),
      vary: V1,
      problem: { tag: '고1 학평 기본 유형 · 두 점 사이의 거리와 중점', time: '목표 시간: 20초', text: () => probHTML(V1.cur().text), answer: () => tex(V1.cur().ansTex) },
      solution: {
        standardTitle: '교과서식 풀이', standardTag: '기본 풀이', quickTitle: '10초 컷 · 피타고라스 수', quickTag: '10초 컷',
        standard: () => ({ steps: V1.cur().std, warning: V1.cur().warn }),
        quick: () => ({ steps: V1.cur().quick, highlight: V1.cur().highlight })
      },
      view: (s, lab) => {
        if (lab.tab !== 'explore') return {};
        const d = s.d1, A = P(d.ax, d.ay), B = P(d.bx, d.by), dx = Math.abs(B.x - A.x), dy = Math.abs(B.y - A.y), l2 = dx * dx + dy * dy, M = midP(A, B);
        return {
          chips: [
            { k: '거리', tex: 'd=\\sqrt{(x_2-x_1)^2+(y_2-y_1)^2}', color: 'amber' },
            { k: '중점', tex: 'M\\left(\\dfrac{x_1+x_2}{2},\\ \\dfrac{y_1+y_2}{2}\\right)', color: 'violet' }
          ],
          status: { tone: 'info', text: `AB² = ${dx}² + ${dy}² = ${l2}` },
          readouts: [
            { label: '가로 변화량 |x₂ − x₁|', value: String(dx), color: 'sky', ref: 'dx' },
            { label: '세로 변화량 |y₂ − y₁|', value: String(dy), color: 'rose', ref: 'dy' },
            { label: '거리 AB', value: radStr(l2) + (Number.isInteger(Math.sqrt(l2)) ? '' : ` ≈ ${n2(Math.sqrt(l2))}`), color: 'amber', ref: 'ab', note: `AB² = ${l2}` },
            { label: '중점 M', value: pS(M), color: 'violet', ref: 'm', note: '두 점 좌표의 평균' }
          ]
        };
      },
      formula: `<p>두 점 ${tex('A(x_1,\\ y_1)')}, ${tex('B(x_2,\\ y_2)')} 사이의 거리는 가로 변화량 ${tex('|x_2-x_1|')}과 세로 변화량 ${tex('|y_2-y_1|')}를 두 변으로 하는 직각삼각형의 빗변입니다.</p>
<p>${tex('\\overline{AB}=\\sqrt{(x_2-x_1)^2+(y_2-y_1)^2}', true)}</p><p>선분 ${tex('AB')}의 중점은 ${tex('M\\left(\\dfrac{x_1+x_2}{2},\\ \\dfrac{y_1+y_2}{2}\\right)', false)}입니다. 원점에서 점 ${tex('(x,\\ y)')}까지의 거리는 ${tex('\\sqrt{x^2+y^2}')}입니다.</p>`,
      notes: '<ul><li>근호 안에서 <b>각각 제곱한 뒤 더합니다.</b> (x₂−x₁+y₂−y₁)²가 아닙니다.</li><li>가로선이나 세로선이면 변화량 하나가 0이라 거리가 그냥 |x₂−x₁| 또는 |y₂−y₁|입니다.</li><li>중점은 <b>더하고 2로 나눈 것</b>이고, 거리는 <b>빼서 제곱한 것</b>입니다. 헷갈리지 마세요.</li></ul>',
      draw: (b, s, v, lab) => {
        const tab = lab.tab;
        if (tab === 'explore') {
          useView(b, 'dist:ex', FOCUS);

      if (g.S < 0.45) return [
        `Step 1 · 삼각형 조건 확인 — ${given} 세 점이 한 직선 위에 놓인 퇴화 상태입니다.`,
        'Step 2 · 성질의 전제 — 넓이가 0이므로 삼각형의 내심이나 양의 넓이비를 적용할 수 없습니다.',
        'Step 3 · 도형 다시 구성 — 꼭짓점 하나를 직선 밖으로 옮겨 삼각형이 된 뒤 중선·내분·각 이등분선의 관계를 확인합니다.'
      ];
      if (s.lens3 === 'G') return [
        `Step 1 · 중점부터 찾기 — ${given} 변 BC의 중점 M${pS(midP(B, C))}과 A를 이으면 중선입니다.`,
        'Step 2 · 중선의 공통 비 — 세 중선의 교점 G는 각 중선을 꼭짓점 쪽부터 $2:1$로 나눕니다. 따라서 $G=A+\\frac23(M-A)=\\frac{A+B+C}{3}$입니다.',
        `Step 3 · 현재 무게중심 — $G=\\left(\\dfrac{${A.x + B.x + C.x}}3,\\dfrac{${A.y + B.y + C.y}}3\\right)$, 표시 좌표는 ${pS(g.G)}입니다. 꼭짓점을 옮겨도 $AG:GM=2:1$은 유지됩니다.`
      ];
      if (s.lens3 === 'P') {
        const k = s.kP, Q = lerpP(A, B, k / 8), [m, n] = ratio(k, 8 - k), a1 = g.S * k / 8, a2 = g.S * (8 - k) / 8;
        return [
          `Step 1 · 높이가 같은 두 삼각형 — ${given} 현재 P${pS(Q)}는 AB를 ${m}:${n}으로 내분합니다. APC와 PBC의 꼭짓점 C와 밑변의 직선 AB가 같습니다.`,
          `Step 2 · 공통 높이 약분 — $\\dfrac{S(APC)}{S(PBC)}=\\dfrac{AP}{PB}=\\dfrac{${m}}{${n}}$입니다. $P=A+\\dfrac{${k}}8(B-A)$로 좌표와 넓이비가 함께 정해집니다.`,
          `Step 3 · 현재 넓이 검산 — 전체 넓이는 ${valueS(g.S)}, 두 넓이는 ${valueS(a1)}와 ${valueS(a2)}입니다.${k === 4 ? ' 지금은 P가 중점이므로 CP가 넓이를 이등분합니다.' : ' 지금은 P가 중점이 아니므로 두 넓이가 다릅니다.'}`
        ];
      }
      return [
        `Step 1 · 각 이등분선의 길이비 — ${given} $a=BC,\ b=CA,\ c=AB$로 두면 C의 각 이등분선은 AB를 $AD:DB=b:a$로 나눕니다.`,
        `Step 2 · 마주 보는 변으로 가중평균 — $I=\\dfrac{aA+bB+cC}{a+b+c}$입니다. 현재 a ${valueS(g.a)}, b ${valueS(g.b)}, c ${valueS(g.c)}를 쓰면 내심 I${pS(g.I)}입니다.`,
        `Step 3 · 같은 수선거리로 검산 — 세 변까지의 거리가 r로 같으므로 $S=\\frac12r(a+b+c)$입니다. 현재 $S=${nt(g.S)}$, 따라서 $r=\\dfrac{2S}{a+b+c}$이고 표시 반지름은 ${valueS(g.r)}입니다.`
      ];
    }
    if (id === 'isos') {
      const d = s.i4, A = P(d.ax, d.ay), B = P(d.bx, d.by), C = P(d.ct, s.k4), L = isoList(A, B, s.k4), good = L.filter(v => !v.deg);
      const ab = distP(A, B), ac = distP(A, C), bc = distP(B, C), deg = areaP(A, B, C) < 1e-9;
      const equal = [Math.abs(ab - ac) < 1e-8 && 'AB = AC', Math.abs(ab - bc) < 1e-8 && 'AB = BC', Math.abs(ac - bc) < 1e-8 && 'AC = BC'].filter(Boolean).join(' · ');
      return [
        `Step 1 · 세 자취로 나누기 — 현재 A${pS(A)}, B${pS(B)}, C${pS(C)}이고 C는 $y=${nt(s.k4)}$ 위를 움직입니다. AB = AC, AB = BC, AC = BC는 두 원과 수직이등분선에 대응합니다.`,
        `Step 2 · 교점과 퇴화 구별 — ${L.infinite ? `현재 수직이등분선이 $y=${nt(s.k4)}$와 일치합니다. 중점인 $x=${nt(L.excludedT)}$만 제외하면 가능한 C가 무한히 많습니다.` : `세 자취와 현재 직선의 교점을 모아 중복점과 한 직선 위의 점을 빼면 가능한 C는 ${good.length}개입니다.`}`,
        `Step 3 · 움직인 C를 검산 — 현재 AB ${valueS(ab)}, AC ${valueS(ac)}, BC ${valueS(bc)}입니다. ${deg ? '지금은 A, B, C가 한 직선 위이므로 길이가 같아도 삼각형이 아닙니다.' : equal ? `지금은 ${equal}이므로 이등변삼각형입니다.` : '지금은 같은 길이의 두 변이 없으므로 이등변삼각형이 아닙니다.'}`
      ];
    }
    if (id === 'proof') {
      if (s.pf === 'median') {
        const c = s.c5, { p, q } = s.m5, ab2 = (p + c) ** 2 + q * q, ac2 = (p - c) ** 2 + q * q, am2 = p * p + q * q;
        return [
          `Step 1 · 중점을 원점으로 — 현재 $M(0,0),\ B(-${c},0),\ C(${c},0),\ A(${p},${q})$입니다. B와 C의 좌표가 반대이므로 제곱을 더할 때 교차항이 사라집니다.`,
          `Step 2 · 대칭인 항 소거 — $AB^2=(p+c)^2+q^2$, $AC^2=(p-c)^2+q^2$를 더하면 $2(p^2+q^2+c^2)$입니다. 현재 두 제곱은 ${ab2}와 ${ac2}입니다.`,
          `Step 3 · 거리로 되읽기 — $AM^2=${am2}$, $BM^2=${c * c}$이므로 $AB^2+AC^2=${ab2 + ac2}=2(${am2}+${c * c})$입니다. A를 움직여도 중선정리가 유지됩니다.`
        ];
      }
      const w = s.w5, h = s.h5, { x, y } = s.r5;
      const pa = x * x + y * y, pc = (x - w) ** 2 + (y - h) ** 2, pb = (x - w) ** 2 + y * y, pd = x * x + (y - h) ** 2;
      return [
        `Step 1 · 변을 좌표축으로 — 현재 직사각형은 A(0, 0), B(${w}, 0), C(${w}, ${h}), D(0, ${h})이고 P${pS(P(x, y))}입니다. 서로 마주 보는 꼭짓점까지의 제곱합을 비교합니다.`,
        'Step 2 · 같은 네 제곱 — $PA^2+PC^2$와 $PB^2+PD^2$는 모두 $x^2+(x-w)^2+y^2+(y-h)^2$입니다. P가 직사각형 밖에 있어도 식은 같습니다.',
        `Step 3 · 현재 위치 검산 — $PA^2+PC^2=${nt(pa)}+${nt(pc)}=${nt(pa + pc)}$, $PB^2+PD^2=${nt(pb)}+${nt(pd)}=${nt(pb + pd)}$입니다.`
      ];
    }
    const t = s.tt / 4, Q = lerpP(P(-3, -1), P(3, 2), t), [m, n] = ratio(Math.abs(t), Math.abs(1 - t));
    const endpoint = t === 0 || t === 1, inside = t > 0 && t < 1;
    return [
      `Step 1 · 선분 안과 밖 구별 — 현재 A(−3, −1), B(3, 2), P${pS(Q)}입니다. $P=A+t(B-A)$에서 $t=${nt(t)}$이므로 ${endpoint ? `P는 끝점 ${t === 0 ? 'A' : 'B'}입니다.` : inside ? 'P는 내분점입니다.' : `P는 ${t > 1 ? 'B' : 'A'}쪽 연장선의 외분점입니다.`}`,
      `Step 2 · 거리비와 방향 — $AP:PB=|t|:|1-t|=${m}:${n}$입니다. ${endpoint ? '한 거리가 0인 끝점 상태이므로 내분·외분의 내부 경우와 구별합니다.' : inside ? '내분에서는 두 부분의 길이를 더하여 전체를 얻으므로 분모가 m+n입니다.' : '외분에서는 두 거리의 차가 AB이므로 분모가 m−n입니다.'}`,
      `Step 3 · 현재 좌표 검산 — $P=(-3+6t,-1+3t)=${pT(Q)}$입니다.${endpoint ? ' 끝점을 지나면 내분과 외분이 바뀝니다.' : inside ? ' t = 1/2에서는 중점입니다.' : ' 외분비 m = n이면 분모가 0이 되어 유한한 외분점이 없습니다.'}`
    ];
  }

  /* ===== 실험실 등록 ===== */
  APLab.createLab({

    title: '평면좌표',

    courseColor: 'var(--m-violet)',
    home: '../index.html#common',
    board: { kind: 'cartesian', focus: { x: [-8, 10], y: [-5, 10] } },
    params: {
      m: { value: 2, min: 1, max: 5, step: 1, color: 'sky', label: '비의 앞부분 m (AP)', format: (v) => `m = ${v}` },
      kP: { value: 4, min: 1, max: 7, step: 1, color: 'amber', label: '점 P의 위치 (AB를 8등분)', format: (v) => `AP : PB = ${ratio(v, 8 - v).join(' : ')}` },
      k4: { value: 0, min: -4, max: 5, step: 1, color: 'ink', label: '점 C가 놓인 직선 y = k', format: (v) => (v === 0 ? 'y = 0 (x축)' : `y = ${v}`) },
      c5: { value: 3, min: 2, max: 5, step: 1, color: 'green', label: '밑변의 절반 c (BM = MC = c)', format: (v) => `c = ${v} (BC = ${2 * v})` },
      w5: { value: 6, min: 3, max: 9, step: 1, color: 'sky', label: '가로 a', format: (v) => `a = ${v}` },
      h5: { value: 4, min: 2, max: 7, step: 1, color: 'rose', label: '세로 b', format: (v) => `b = ${v}` },
      tt: { value: 3, min: -2, max: 6, step: 1, color: 'amber', label: '점 P의 위치 (AB의 1/4 단위)', hint: '0이면 A, 4이면 B — 그 밖은 연장선', format: (v) => { if (v === 0) return 'P = A'; if (v === 4) return 'P = B'; const r = ratio(Math.abs(v), Math.abs(4 - v)); return `AP : PB = ${r[0]} : ${r[1]} (${v > 0 && v < 4 ? '내분' : '외분'})`; } },
      n: { value: 1, min: 1, max: 5, step: 1, color: 'rose', label: '비의 뒷부분 n (PB)', format: (v) => `n = ${v}` }
    },
    scenes: [scene1(), scene2(), scene3(), scene4(), scene5(), scene6()]
  });
