<script>
/* ==========================================================================
   공통수학 · 무리함수 (AP Math Lab 2.0) — 3개 장면
   근거: 고1 학평에는 무리함수가 1문항뿐이라 학교 2학기 기말·중간 기출(공통수학2 함수 단원)을 표본으로 반복 유형을 골랐습니다.
   장면 1 평행이동·대칭이동(사분면 · 그림에서 a+b+c) / 2 직선과 교점 개수(접할 때·끝점을 지날 때) / 3 역함수와 y=x(교점, 감소함수의 예외)
   문제는 원문을 복제하지 않고 숫자·상황을 바꾼 변형이며, 「새 문제」로 정답이 깔끔한 변형만 돌려 가며 만납니다.
   ========================================================================== */
window.addEventListener('DOMContentLoaded', function () {
  const tex = APLab.tex;
  const clamp = APLab.clamp;

  /* ---------- 공통 도우미 ---------- */
  const rint = (n) => Math.floor(Math.random() * n);
  const pickOf = (arr, prev) => { if (arr.length < 2) return arr[0]; let x; do { x = arr[rint(arr.length)]; } while (x === prev); return x; };
  const mn = (n) => String(Math.round(n * 100) / 100).replace('-', '−'); // 화면용 숫자(음수는 − 기호)
  const lin = (a, b, v = 'x') => { // ax+b 를 TeX 로
    let s = '';
    if (a !== 0) s += a === 1 ? v : a === -1 ? '-' + v : a + v;
    if (b !== 0) s += s ? (b > 0 ? '+' + b : '-' + (-b)) : String(b);
    return s || '0';
  };
  const addT = (n) => (n > 0 ? '+' + n : n < 0 ? '-' + (-n) : ''); // 뒤에 붙는 상수항
  const sqrtSimp = (n) => { let o = 1, i = n; for (let f = 2; f * f <= i; f++) while (i % (f * f) === 0) { i /= f * f; o *= f; } return [o, i]; };
  const rootTeX = (n) => { const [o, i] = sqrtSimp(n); return i === 1 ? String(o) : (o === 1 ? '' : o) + `\\sqrt{${i}}`; };
  const axesOf = (b) => { b.grid({ step: 1 }); b.axes({ tickStep: b.k < 32 ? 2 : 1 }); };
  // 변형 생성기: gen(이전 변형|null) → 새 변형. 처음에는 기출 유형 그대로(gen(null)).
  const lirActive = (s) => !!(s && (s.lessonOn || s.lessonEntry));
  function varier(gen) {
    const first = gen(null); let cur = first;
    return { cur: () => lirActive(window.lab && window.lab.s) ? first : cur, first: () => first, next: () => (cur = gen(cur)) };
  }
  const probHTML = (body) => `${body}<div style="margin-top:10px"><button type="button" class="apl-btn sm" data-new-prob>새 문제</button></div>`;
  document.addEventListener('click', (ev) => {
    const hit = ev.target && ev.target.closest && ev.target.closest('[data-new-prob]');
    if (!hit) return;
    const lab = window.lab, sc = lab && lab.scene;
    if (!sc || !sc.vary) return;
    sc.vary.next();
    lab.s.revealed = false;
    lab.setStep(0);
    try { lab._buildReview(); } catch (e) { /* 키트가 바뀌어도 그림은 그대로 */ }
    lab.invalidate(true);
  });
  const stepOf = (lab, s) => (lab.tab === 'problem' ? 0 : lab.tab === 'review' ? s.step : 99); // 탐구는 99(모두), 문제 탭은 풀이 전
  const probBox = (v) => `<div class="apl-rich" style="font-size:var(--fs-sm);line-height:1.75"><small style="color:var(--text-3);font-weight:800">문제</small><br>${v}</div>`;
  // $...$ 안의 < > 는 HTML 로 오해되므로 \lt \gt 로 바꿉니다(셸이 글을 이스케이프·분해하기 때문)
  const fixLT = (t) => (typeof t === 'string' ? t.replace(/\$[^$]*\$/g, (m) => m.replace(/</g, '\\lt ').replace(/>/g, '\\gt ')) : t);
  const fixObj = (o) => (o ? { ...o, steps: fixLT(o.steps), warning: fixLT(o.warning), highlight: fixLT(o.highlight) } : o);
  const baseScene = (o) => ({
    tabs: { compact: true }, ...o,
    steps: o.steps && (() => o.steps().map(fixLT)),
    view: (s, lab) => {
      const v = o.view(s, lab);
      if (lab.tab !== 'explore' && !lab._answerOpen()) {
        if (v.chips) v.chips = v.chips.filter((c) => !c.answer);
        if (v.tape && v.tape.answer) delete v.tape;
      }
      return v;
    },
    solution: o.solution && { ...o.solution, standard: () => fixObj(o.solution.standard()), quick: () => fixObj(o.solution.quick()) }
  });
  // 1:1 무대 안에서 점 라벨 위치를 정하기 위한 짧은 도우미
  const P = (b, id, pt, label, color, dx, dy, extra = {}) => b.point(pt, { r: 5, color, label, dx, dy, size: 13, ...extra });

  /* ---------- 무리함수 도우미 ---------- */
  const sqf = (a, s, d, p, q) => (x) => s * Math.sqrt(d * a * (x - p)) + q; // a>0, d=±1(오른쪽/왼쪽), s=±1(위/아래)
  function drawSq(b, a, s, d, p, q, o = {}) { b.plot(sqf(a, s, d, p, q), { ...o, ...(d > 0 ? { from: p } : { to: p }) }); }
  const innerTeX = (a, d, p) => { // 근호 안: a(x-p) 꼴 (d<0이면 a(-x+p))
    const A = a === 1 ? '' : String(a);
    if (p === 0) return d > 0 ? `${A}x` : (a === 1 ? '-x' : `${a}(-x)`);
    return `${A}(${d > 0 ? lin(1, -p) : lin(-1, p)})`;
  };
  const sqTeX = (a, s, d, p, q) => `y=${s < 0 ? '-' : ''}\\sqrt{${innerTeX(a, d, p)}}${addT(q)}`;
  const sqExpTeX = (a, s, d, p, q) => `y=${s < 0 ? '-' : ''}\\sqrt{${lin(d * a, -d * a * p)}}${addT(q)}`;
  function quadsSq(a, s, d, p, q) {
    const seen = new Set(), f = sqf(a, s, d, p, q);
    for (let u = 0; u <= 300; u += 0.05) { const x = p + d * u, y = f(x); if (Math.abs(x) < 1e-9 || Math.abs(y) < 1e-9) continue; seen.add(x > 0 ? (y > 0 ? 1 : 4) : (y > 0 ? 2 : 3)); }
    return [1, 2, 3, 4].filter((i) => seen.has(i));
  }

  /* ======================== 장면 1 · 평행이동과 대칭이동 ======================== */
  const DIRS = [{ s: 1, d: 1, f: 'y=√(ax)', c: 'sky' }, { s: 1, d: -1, f: 'y=√(−ax)', c: 'green' }, { s: -1, d: 1, f: 'y=−√(ax)', c: 'rose' }, { s: -1, d: -1, f: 'y=−√(−ax)', c: 'violet' }];
  const Q1 = [20, 25, 30, 36, 40, 50].map((N) => ({ type: 'Q', N }));
  const G1 = [{ type: 'G', s: 1, d: 1, a: 1, p: -2, q: 1, t: 3 }];
  for (const [s, d] of [[1, 1], [1, -1], [-1, 1], [-1, -1]]) for (const a of [1, 2, 3, 4]) for (const p of [-3, -2, -1, 0, 1, 2, 3]) for (const q of [-2, -1, 0, 1, 2]) for (const t of [1, 2, 3]) {
    if (!Number.isInteger((t * t) / a)) continue;
    const x = p + d * ((t * t) / a), y = q + s * t;
    if (Math.abs(x) > 8 || Math.abs(y) > 6 || (s === 1 && d === 1 && a === 1 && p === -2 && q === 1 && t === 3)) continue;
    G1.push({ type: 'G', s, d, a, p, q, t });
  }
  const var1 = varier((prev) => {
    const it = !prev ? G1[0] : (rint(3) === 0 ? pickOf(Q1, prev.src) : pickOf(G1.slice(1), prev.src));
    if (it.type === 'Q') {
      const { N } = it; let tot = 0; const rows = [];
      for (let bb = 1; bb * bb < N; bb++) { rows.push([bb, N - bb * bb]); tot += N - bb * bb; }
      return { src: it, type: 'Q', N, rows, ans: { tex: String(tot), val: tot } };
    }
    const { s, d, a, p, q, t } = it, A = d * a, B = -A * p, P = [p + d * ((t * t) / a), q + s * t];
    return { src: it, type: 'G', s, d, a, p, q, A, B, P, ans: { tex: String(A + B + q), val: A + B + q } };
  });
  const text1 = (v) => (v.type === 'G'
    ? `함수 ${tex(`y=${v.s < 0 ? '-' : ''}\\sqrt{ax+b}+c`)}의 그래프가 그림과 같이 점 ${tex(`S(${v.p},\\,${v.q})`)}에서 시작하여 점 ${tex(`P(${v.P[0]},\\,${v.P[1]})`)}을 지난다. 상수 ${tex('a,\\,b,\\,c')}에 대하여 ${tex('a+b+c')}의 값을 구하시오.`
    : `함수 ${tex('f(x)=\\sqrt{x+a}+b')}에 대하여 다음 조건을 만족시키는 두 정수 ${tex('a,\\,b')}의 순서쌍 ${tex('(a,\\,b)')}의 개수를 구하시오.<br>(가) ${tex(`a\\le ${v.N}`)}<br>(나) 함수 ${tex('y=f(x)')}의 그래프가 제1사분면, 제2사분면, 제3사분면을 모두 지난다.`);
  const steps1 = () => {
    const v = var1.cur();
    if (v.type === 'G') {
      const u = v.P[0] - v.p, w = v.P[1] - v.q;
      return [
        `시작점 $S(${v.p},\\,${v.q})$에서 근호 안이 $0$이므로 $ax+b=0$의 해가 $x=${v.p}$이고, $y=c$이므로 $c=${v.q}$입니다.`,
        `$ax+b=a(x${addT(-v.p)})$이므로 $y${addT(-v.q)}=${v.s < 0 ? '-' : ''}\\sqrt{a(x${addT(-v.p)})}$. 양변을 제곱하면 $(y${addT(-v.q)})^2=a(x${addT(-v.p)})$입니다.`,
        `점 $P(${v.P[0]},\\,${v.P[1]})$를 대입하면 $(${w})^2=a\\times(${u})$ ⇒ $${w * w}=${u}a$ ⇒ $a=${v.A}$ (그림의 직사각형: 세로 ${Math.abs(w)}, 가로 ${Math.abs(u)})`,
        `$b=-a\\times ${v.p}=${v.B}$ (근호 안 $=${v.A}(x${addT(-v.p)})$) ⇒ $a+b+c=${v.A}${addT(v.B)}${addT(v.q)}=${v.ans.tex}$`
      ];
    }
    const rows = v.rows.map(([b0, n]) => `$b=-${b0}$: $a>${b0 * b0}$ ⇒ $${b0 * b0 + 1}\\le a\\le ${v.N}$ ⇒ ${n}개`);
    return [
      `$f(x)=\\sqrt{x+a}+b$의 시작점은 $S(-a,\\,b)$입니다. 제1·2·3사분면을 모두 지나려면 시작점이 제3사분면에 있어야 하므로 $-a<0$, $b<0$ (곧 $a\\ge1$, $b\\le-1$)입니다.`,
      `시작점에서 오른쪽 위로 뻗으며 $y$축에 닿기 전에 $x$축을 넘어야 제2사분면을 지납니다. 곧 $f(0)=\\sqrt{a}+b>0$이어야 합니다.`,
      `$\\sqrt a>-b>0$ ⇒ $a>b^2$. ($a=b^2$이면 곡선이 원점을 지나 제2사분면을 지나지 못합니다.)`,
      `${rows.join(' / ')}. 합: $${v.rows.map((r) => r[1]).join('+')}=${v.ans.tex}$`
    ];
  };
  function drawI1(b, s, lab) {
    axesOf(b);
    const vb = b.viewBox();
    if (lab.tab === 'explore') {
      const { i1s: ss, i1d: dd, i1a: a, i1p: p, i1q: q } = s;
      if (s.i1all) {
        b.vline(p, { color: 'muted', dash: [4, 5], width: 1.4, alpha: 0.8 }); b.hline(q, { color: 'muted', dash: [4, 5], width: 1.4, alpha: 0.8 });
        DIRS.forEach((D) => { const on = D.s === ss && D.d === dd; drawSq(b, a, D.s, D.d, p, q, { color: D.c, width: on ? 3.6 : 2.4, alpha: on ? 1 : 0.8, glow: on, ref: on ? 'curve' : undefined }); const label = `y=${D.s < 0 ? '−' : ''}√(${lin(D.d * a, -D.d * a * p).replace(/-/g, '−')})${addT(q).replace(/-/g, '−')}`; b.text([p + D.d * 3.6, q + D.s * Math.sqrt(a * 3.6)], label, { color: D.c, size: 12, align: D.d > 0 ? 'left' : 'right', dx: D.d * 6, dy: D.s > 0 ? -9 : 14 }); });
      } else {
        drawSq(b, a, 1, 1, 0, 0, { color: 'muted', dash: [5, 5], width: 2, alpha: 0.8, ref: 'base' });
        b.hline(q, { color: 'muted', dash: [4, 5], width: 1.3, alpha: 0.7 });
        drawSq(b, a, ss, dd, p, q, { color: 'sky', width: 3.6, glow: true, ref: 'curve' });
      }
      b.handle('S', [p, q], { color: 'amber', r: 7, label: `S(${mn(p)}, ${mn(q)})`, dx: dd > 0 ? -10 : 10, dy: ss > 0 ? 18 : -14, align: dd > 0 ? 'right' : 'left', size: 13, ariaLabel: '시작점 S (끌어서 평행이동)', drag: (w) => { s.i1p = clamp(Math.round(w.x), -6, 6); s.i1q = clamp(Math.round(w.y), -6, 6); } });
      return;
    }
    const v = var1.cur(), st = stepOf(lab, s);
    if (v.type === 'G') {
      const f = sqf(v.a, v.s, v.d, v.p, v.q);
      drawSq(b, v.a, v.s, v.d, v.p, v.q, { color: 'sky', width: 3.6, glow: true });
      b.point(v.P, { r: 5.5, color: 'amber', label: `P(${mn(v.P[0])}, ${mn(v.P[1])})`, dx: v.d > 0 ? 10 : -10, dy: v.s > 0 ? -12 : 16, align: v.d > 0 ? 'left' : 'right', size: 13 });
      b.point([v.p, v.q], { r: 6, color: 'violet', label: `S(${mn(v.p)}, ${mn(v.q)})`, dx: v.d > 0 ? -10 : 10, dy: v.s > 0 ? 18 : -14, align: v.d > 0 ? 'right' : 'left', size: 13 });
      if (st >= 1) { b.vline(v.p, { color: 'amber', dash: [5, 4], width: 1.6 }); b.hline(v.q, { color: 'rose', dash: [5, 4], width: 1.6 }); }
      if (st >= 3) {
        b.poly([[v.p, v.q], [v.P[0], v.q], v.P, [v.p, v.P[1]]], { color: 'green', dash: [5, 4], width: 2, fill: 'green', fillAlpha: 0.1 });
        b.text([(v.p + v.P[0]) / 2, v.q], `${mn(Math.abs(v.P[0] - v.p))}`, { color: 'green', size: 13, dy: v.s > 0 ? 16 : -12 });
        b.text([v.P[0], (v.q + v.P[1]) / 2], `${mn(Math.abs(v.P[1] - v.q))}`, { color: 'green', size: 13, align: v.d > 0 ? 'left' : 'right', dx: v.d > 0 ? 8 : -8 });
      }
    } else {
      const a0 = 5, b0 = -1;
      drawSq(b, 1, 1, 1, -a0, b0, { color: 'sky', width: 3.4, glow: true });
      b.text([vb.x1, vb.y1], '예: a=5, b=−1일 때의 그래프', { color: 'muted', size: 12, align: 'right', dx: -8, dy: 70 });
      b.point([-a0, b0], { r: 5.5, color: 'violet', label: 'S(−a, b)', dx: -8, dy: 16, align: 'right', size: 13 });
      if (st >= 2) { const y0 = Math.sqrt(a0) + b0; b.point([0, y0], { r: 5, color: 'green', label: 'f(0)>0', dx: 10, dy: -8, size: 12 }); }
      if (st >= 3) {
        drawSq(b, 1, 1, 1, -1, -1, { color: 'rose', width: 2.8, dash: [6, 4] });
        b.point([0, 0], { r: 5, color: 'rose', label: 'a=b²이면 원점', dx: 10, dy: 16, size: 12 });
      }
      if (st >= 1) b.poly([[vb.x0, vb.y0], [0, vb.y0], [0, 0], [vb.x0, 0]], { color: null, fill: 'violet', fillAlpha: 0.08 });
    }
  }
  function sceneI1() {
    const reset = (s) => { s.i1s = 1; s.i1d = 1; s.i1a = 2; s.i1p = 1; s.i1q = 1; s.i1all = false; };
    return baseScene({
      id: 'i1', title: '평행이동과 대칭이동 — y=√(a(x−p))+q', short: '평행이동·대칭이동',
      question: 'a의 부호, 앞의 ±, p와 q는 그림에서 각각 무엇을 바꿀까?',
      guide: '노란 점 <b>S</b>(시작점)를 끌어 <b>p, q</b>를 바꾸고, 단추로 <b>네 방향</b>을 바꿔 보세요. <b>a</b>가 클수록 곡선이 가파르게 열립니다. 「네 방향 한꺼번에」를 켜면 S를 지나는 <b>두 직선(x=p, y=q)</b>에 대해 네 곡선이 서로 대칭임이 보입니다.',
      enter: reset,
      focus: { x: [-8, 8], y: [-6.5, 7.5] },
      controls: () => ['i1a', 'i1p', 'i1q'],
      presets: (s) => [
        ...DIRS.map((D) => ({ group: '뻗는 방향', label: D.f, color: D.c, apply: (st) => { st.i1s = D.s; st.i1d = D.d; }, on: (st) => st.i1s === D.s && st.i1d === D.d })),
        { group: '보기', label: '네 방향 한꺼번에', color: 'amber', apply: (st) => { st.i1all = !st.i1all; }, on: (st) => st.i1all }
      ],
      steps: steps1,
      reviewTop: () => probBox(text1(var1.cur())),
      problem: { tag: '19 강남여고 · 20 매산고 · 24 금당고 기출 유형', time: '목표 시간: 20초', text: () => probHTML(text1(var1.cur())), answer: () => tex(var1.cur().ans.tex) },
      solution: {
        standardTitle: '시작점과 한 점으로 식 세우기', standardTag: '기본 풀이', quickTitle: '직사각형으로 a 읽기', quickTag: '10초 컷',

  const f3Tex = (c, s, p, q) => `f(x)=${s < 0 ? '-' : ''}\\sqrt{${innerTeX(c, 1, p)}}${addT(q)}`;
  const g3Tex = (c, s, p, q) => `f^{-1}(x)=${c === 1 ? `(x${addT(-q)})^2` : `\\dfrac{(x${addT(-q)})^2}{${c}}`}${addT(p)}\\ \\ (x${s > 0 ? '\\ge' : '\\le'}${q})`;
  const T3 = [], D3 = [{ type: 'D', c: 4, q: 4 }, { type: 'D', c: 4, q: 5 }, { type: 'D', c: 4, q: 2 }, { type: 'D', c: 8, q: 7 }, { type: 'D', c: 8, q: 4 }, { type: 'D', c: 9, q: 7 }, { type: 'D', c: 9, q: 8 }, { type: 'D', c: 9, q: 10 }, { type: 'D', c: 9, q: 5 }];
  for (const c of [4, 8, 12]) for (const p of [-2, -1, 0, 1, 2, 3]) T3.push({ type: 'T', c, p });
  const var3 = varier((prev) => {
    const it = !prev ? D3[0] : (rint(2) ? pickOf(D3, prev.src) : pickOf(T3, prev.src));
    if (it.type === 'T') { const al = it.p - it.c / 4, be = it.p; return { src: it, ...it, al, be, ans: { tex: String(al + be), val: al + be } }; }
    const cr = cross3(it.c, -1, 0, it.q);
    return { src: it, ...it, cr, ans: { tex: String(cr.length), val: cr.length } };
  });
  const text3 = (v) => (v.type === 'T'
    ? `함수 ${tex(`f(x)=\\sqrt{${lin(v.c, -v.c * v.p)}}+k`)}의 그래프와 그 역함수 ${tex('y=f^{-1}(x)')}의 그래프가 서로 다른 두 점에서 만나도록 하는 실수 ${tex('k')}의 값의 범위가 ${tex('\\alpha<k\\le\\beta')}일 때, ${tex('\\alpha+\\beta')}의 값을 구하시오.`
    : `함수 ${tex(`f(x)=-\\sqrt{${v.c}x}${addT(v.q)}`)} ${tex('(x\\ge0)')}의 그래프와 그 역함수 ${tex('y=f^{-1}(x)')}의 그래프의 교점의 개수를 구하시오.`);
  const steps3 = () => {
    const v = var3.cur();
    if (v.type === 'T') {
      const { c, p } = v;
      return [
        `$f$는 증가함수이므로 $y=f(x)$와 $y=f^{-1}(x)$의 교점은 모두 직선 $y=x$ 위에 있습니다. 곧 $f(x)=x$의 서로 다른 해의 개수와 같습니다. (그림의 점선 $y=x$)`,
        `$f(x)=x$, 곧 $\\sqrt{${lin(c, -c * p)}}+k=x$의 해의 개수는 곡선 $y=\\sqrt{${lin(c, -c * p)}}+k$와 직선 $y=x$의 교점의 개수입니다. $k$가 바뀌면 곡선이 위아래로 평행이동하므로 시작점 $S(${p},\\,k)$가 $y=x$ 위에 오는 순간과 접하는 순간이 경계입니다.`,
        `시작점이 $y=x$ 위: $k=${p}$ (두 점). 접할 때: $\\sqrt{${c}(x${addT(-p)})}=x-k$를 제곱한 이차방정식의 판별식 $D=${c}(${c}+4(k${addT(-p)}))=0$ ⇒ $k=${p}-${c / 4}=${v.al}$.`,
        `서로 다른 두 점: $${v.al}<k\\le ${v.be}$ ⇒ $\\alpha+\\beta=${v.al}+${v.be}=${v.ans.tex}$`
      ];
    }
    const { c, q } = v, root = ((2 * q + c) - Math.sqrt(c * c + 4 * c * q)) / 2, off = v.cr.filter((z) => !z.on), r2 = (x) => Math.round(x * 100) / 100;
    return [
      `$f$의 역함수의 그래프는 $f$의 그래프를 직선 $y=x$에 대하여 대칭이동한 곡선 $x=-\\sqrt{${c}y}${addT(q)}$입니다. 두 곡선과 $y=x$를 함께 그립니다.`,
      `<y=x 위의 교점> $f(x)=x$ ⇒ $\\sqrt{${c}x}=${q}-x$ ⇒ $x^2-${2 * q + c}x+${q * q}=0$ 에서 $x\\le ${q}$인 해 $x\\approx ${r2(root)}$ 하나입니다.`.replace('<y=x 위의 교점> ', ''),
      `$f$는 감소함수라서 $y=x$ 밖에서도 만날 수 있습니다. $b=-\\sqrt{${c}a}+${q}$, $a=-\\sqrt{${c}b}+${q}$를 빼면 $b-a=\\sqrt{${c}}(\\sqrt b-\\sqrt a)$입니다. $a\\ne b$이므로 $\\sqrt b-\\sqrt a$로 나누어 $\\sqrt a+\\sqrt b=\\sqrt{${c}}$를 얻습니다. $t=\\sqrt a$라 하면 $t^2-\\sqrt{${c}}\\,t+${c - q}=0$이므로 판별식 $4\\cdot${q}-3\\cdot ${c}=${4 * q - 3 * c}$가 양수이고 두 근이 $0\\le t\\le\\sqrt{${c}}$에 있어야 합니다.`,
      off.length ? `이 경우에 해당하여 $y=x$ 밖의 교점 ${off.length}개(좌표는 각각 약 ${off.map((z) => `(${r2(z.x)}, ${r2(z.y)})`).join(', ')})가 더해져 교점은 모두 ${v.ans.tex}개입니다.` : `조건에 맞지 않아 $y=x$ 밖의 교점이 없으므로 교점은 ${v.ans.tex}개입니다.`
    ];
  };
  function drawI3(b, s, lab) {
    axesOf(b);
    const vb = b.viewBox();
    const showAll = lab.tab === 'explore', lesson = lirActive(s);
    let c, sg, p, q, st = 99;
    if (showAll) { c = s.i3c; sg = s.i3dec ? -1 : 1; p = s.i3p; q = s.i3q; } else {
      const v = var3.cur(); st = stepOf(lab, s);
      if (v.type === 'T') { c = v.c; sg = 1; p = v.p; q = v.p - v.c / 8; } else { c = v.c; sg = -1; p = 0; q = v.q; }
    }
    const f = f3(c, sg, p, q), g = inv3(c, sg, p, q);
    const cr = cross3(c, sg, p, q);
    if (lesson ? s.lirMirror : showAll || st >= 1) b.line([0, 0], 1, { color: 'violet', dash: [7, 5], width: 2, ref: 'mirror' });
    if (showAll && (!lesson || s.lirMirror)) b.text([Math.min(vb.x1, vb.y1) - 0.9, Math.min(vb.x1, vb.y1) - 0.9], 'y=x', { color: 'violet', size: 13, align: 'right', dy: 14 });
    b.plot(f, { color: 'sky', width: 3.6, glow: true, from: p, ref: 'f' });
    if (!lesson || s.lirInverse) b.plot(g, { color: 'green', width: 3.2, dash: [8, 4], ...(sg > 0 ? { from: q } : { to: q }), ref: 'g' });
    const symT = !showAll && var3.cur().type === 'T';
    if (symT) b.text([vb.x1, vb.y1], '그림은 범위 안의 k를 택한 예시', { color: 'muted', size: 12, align: 'right', dx: -8, dy: 66 });
    b.point([p, q], { r: 5, color: 'sky', label: symT ? `(${mn(p)}, k)` : `(${mn(p)}, ${mn(Math.round(q * 100) / 100)})`, dx: -9, dy: sg > 0 ? 16 : -12, align: 'right', size: 12 });
    if (!lesson || s.lirInverse) b.point([q, p], { r: 5, color: 'green', label: symT ? `(k, ${mn(p)})` : `(${mn(Math.round(q * 100) / 100)}, ${mn(p)})`, dx: 9, dy: 14, size: 12 });
    if (showAll && (!lesson || s.lirPair)) {
      const u = clamp(s.i3u, 0, 14), P = [p + u, f(p + u)], Q = [P[1], P[0]];
      if (Number.isFinite(Q[1]) && g(Q[0]) != null) {
        b.seg(P, Q, { color: 'muted', dash: [3, 4], width: 1.5, ref: 'mirror' });
        b.point(Q, { r: 5, color: 'green', label: lesson ? `P′(${mn(Q[0])}, ${mn(Q[1])})` : 'P′', dx: 9, dy: 14, size: 13 });
      }
      b.handle('P', P, { color: 'amber', r: 7, label: lesson ? `P(${mn(P[0])}, ${mn(P[1])})` : 'P', dx: 10, dy: -10, size: 13, ariaLabel: '곡선 위의 점 P (끌어서 이동)', drag: (w) => { s.i3u = clamp(w.x - p, 0, 14); } });
    }
    cr.forEach((z, i) => {
      if (lesson && (s.lirCross < 1 || (!z.on && s.lirCross < 2))) return;
      if (!showAll && st < 2) return;
      if (!showAll && !z.on && st < 3) return;
      const label = lesson ? `${Number.isInteger(z.x) && Number.isInteger(z.y) ? '' : '≈ '}(${mn(z.x)}, ${mn(z.y)})` : z.on ? '' : `≈ (${mn(z.x)}, ${mn(z.y)})`;
      b.point([z.x, z.y], { r: 6, color: z.on ? 'amber' : 'rose', hollow: !z.on, label, dx: z.x < z.y ? -10 : 10, dy: z.x < z.y ? -10 : 16, align: z.x < z.y ? 'right' : 'left', size: 12, ref: 'cross' });
    });
    if (!showAll && var3.cur().type === 'T') {
      const v = var3.cur();
      if (st >= 2) { b.plot(f3(c, 1, p, p), { color: 'rose', width: 2.6, from: p }); b.point([p, p], { r: 5, color: 'rose', label: `k=${p}`, dx: 10, dy: 16, size: 12 }); }
      if (st >= 3) b.plot(f3(c, 1, p, v.al), { color: 'amber', width: 2.6, from: p });
    }
  }
  function sceneI3() {
    const reset = (s) => { s.i3c = 4; s.i3p = 2; s.i3q = 2; s.i3dec = false; s.i3u = 3; };
    return baseScene({
      id: 'i3', title: '역함수와 y=x — 교점과 예외', short: '역함수·y=x',
      question: '무리함수와 그 역함수의 교점은 늘 직선 y=x 위에 있을까?',
      guide: '주황색 점 <b>P</b>를 끌면 <b>y=x에 대칭인 점 P′</b>가 역함수 위를 따라 움직입니다. <b>증가함수</b>이면 두 곡선의 교점은 <b>모두 y=x 위</b>에 있지만, <b>감소함수</b>(「감소」 단추)에서는 <b>y=x 밖</b>에서도 만나는 <b>대칭인 한 쌍</b>이 나타날 수 있습니다(분홍 속이 빈 점).',
      enter: reset,
      focus: { x: [-3, 11], y: [-3, 11] },
      controls: () => ['i3c', 'i3p', 'i3q'],
      presets: (s) => [
        { group: '함수의 모양', label: '증가 (+√)', color: 'sky', apply: (st) => { st.i3dec = false; }, on: (st) => !st.i3dec },
        { group: '함수의 모양', label: '감소 (−√)', color: 'rose', apply: (st) => { st.i3dec = true; }, on: (st) => st.i3dec },
        { group: '바로 가기', label: '두 점 (증가)', apply: (st) => { st.i3dec = false; st.i3c = 4; st.i3p = 2; st.i3q = 2; } },
        { group: '바로 가기', label: '접함 (증가)', apply: (st) => { st.i3dec = false; st.i3c = 4; st.i3p = 2; st.i3q = 1; } },
        { group: '바로 가기', label: 'y=x 밖에서도 (감소)', color: 'rose', apply: (st) => { st.i3dec = true; st.i3c = 4; st.i3p = 0; st.i3q = 4; } }
      ],
      steps: steps3,
      reviewTop: () => probBox(text3(var3.cur())),
      problem: { tag: '21 팔마고 · 22 금당고 기출 유형 (함수와 역함수의 교점)', time: '목표 시간: 25초', text: () => probHTML(text3(var3.cur())), answer: () => tex(var3.cur().ans.tex) },
      solution: {
        standardTitle: 'f(x)=x 로 바꾸기', standardTag: '기본 풀이', quickTitle: 'y=x 와의 교점으로', quickTag: '그림으로',
        standard: () => { const v = var3.cur(); return v.type === 'T' ? { steps: `증가함수의 $f$와 $f^{-1}$의 교점 = $f$와 $y=x$의 교점. 두 점이 되는 범위는 $${v.al}<k\\le ${v.be}$ ⇒ ${v.ans.tex}`, warning: '시작점이 y=x 위에 오는 k=p는 두 점으로 포함하고, 접하는 k는 한 점이므로 제외합니다.' } : { steps: `$y=x$ 위의 교점 1개 + 감소함수에서만 생기는 $y=x$ 밖의 대칭인 한 쌍(있을 때) ⇒ ${v.ans.tex}개`, warning: '감소함수에서는 f(x)=x만 풀면 교점을 놓칩니다. f(f(x))=x까지 생각해야 합니다.' }; },
        quick: () => { const v = var3.cur(); return { steps: v.type === 'T' ? '증가 ⇒ 교점은 $y=x$ 위. 시작점이 $y=x$ 위에 오는 순간과 $y=x$에 접하는 순간이 경계입니다.' : '그림에서 f와 f⁻¹이 <b>y=x 밖</b>에서 만나는 점의 쌍이 있는지 살핍니다. 있으면 y=x 위 교점 하나에 둘이 더해져 3개입니다.', highlight: '증가함수: 교점은 모두 y=x 위 · 감소함수: y=x 밖의 대칭 쌍도 가능' }; }
      },
      view: (s, lab) => {
        if (lab.tab !== 'explore') { const v = var3.cur(); return { chips: [{ html: v.type === 'T' ? `<b>${v.al}&lt;k≤${v.be}</b>` : `교점 <b>${v.ans.tex}개</b>`, color: 'amber', answer: true }] }; }
        const c = s.i3c, sg = s.i3dec ? -1 : 1, p = s.i3p, q = s.i3q, cr = cross3(c, sg, p, q), on = cr.filter((z) => z.on).length, off = cr.length - on;
        return {
          chips: [{ tex: f3Tex(c, sg, p, q), color: 'sky' }, { tex: g3Tex(c, sg, p, q), color: 'green' }],
          status: { tone: off ? 'key' : 'info', text: off ? `y=x 밖의 교점 ${off}개 — 감소함수의 예외!` : `교점 ${cr.length}개 (모두 y=x 위)` },
          readouts: [
            { label: '두 그래프의 교점', value: `${cr.length}개`, color: 'amber', ref: 'cross' },
            { label: 'y=x 위의 교점', value: `${on}개`, color: 'amber', ref: 'mirror' },
            { label: 'y=x 밖의 교점', value: `${off}개`, color: 'rose', ref: 'cross', note: sg > 0 ? '증가함수에서는 생기지 않습니다' : '대칭인 한 쌍(a,b),(b,a)로 생깁니다' },
            { label: '역함수 f⁻¹의 정의역', value: sg > 0 ? `x ≥ ${mn(q)}  (= f의 치역)` : `x ≤ ${mn(q)}  (= f의 치역)`, color: 'green', wide: true, ref: 'g' }
          ]
        };
      },
      vary: var3,
      draw: (b, s, v, lab) => drawI3(b, s, lab)
    });
  }

  /* ======================== 실험실 ======================== */
  const fm = (v) => mn(v);
  const scenes = [sceneI1(), sceneI2(), sceneI3()];
  const texts = { i1: text1, i2: text2, i3: text3 };
  const sourceInfo = Object.fromEntries(scenes.map((sc) => {
    const initial = {}; sc.enter(initial);
    return [sc.id, { first: sc.vary.first(), initial, question: texts[sc.id](sc.vary.first()), inquiry: sc.question, steps: sc.steps() }];
  }));
  const source = window.APL_IRR_SOURCE = {
    scenes,
    first: id => sourceInfo[id].first,
    initial: id => ({ ...sourceInfo[id].initial }),
    question: id => sourceInfo[id].question,
    inquiry: id => sourceInfo[id].inquiry,
    steps: id => sourceInfo[id].steps.slice(),
    intersections: inter2,
    inverseIntersections: cross3
  };
  function curveTrace(b, s, id) {
    const progress = clamp(Number(s.lirTrace) || 0, 0, 1);
    if (s.lessonEntry || !progress) return;
    let a, sg, d = 1, p, q, width = 3;
    if (s.lirExplore) {
      if (id === 'i1') { a = s.i1a; sg = s.i1s; d = s.i1d; p = s.i1p; q = s.i1q; }
      else if (id === 'i2') { a = CUR2.c; sg = 1; p = CUR2.p; q = CUR2.q; }
      else { a = s.i3c; sg = s.i3dec ? -1 : 1; p = s.i3p; q = s.i3q; }
    } else {
      const v = source.first(id);
      if (id === 'i1') { a = v.a; sg = v.s; d = v.d; p = v.p; q = v.q; width = Math.abs(v.P[0] - p); }
      else if (id === 'i2') { a = v.c; sg = 1; p = v.p; q = v.q; }
      else { a = v.c; sg = -1; p = 0; q = v.q; }
    }
    const f = sqf(a, sg, d, p, q), x = p + d * width * progress, y = f(x);
    if (!Number.isFinite(x) || !Number.isFinite(y)) return;
    b.plot(f, { from: Math.min(p, x), to: Math.max(p, x), color: 'violet', width: 4.2, alpha: 0.85 });
    b.point([x, y], { r: 4.5, color: 'violet', glow: false });
  }
  function quadrantMarkers(b, s) {
    if (s.lirTarget !== 'quadrants') return;
    const vb = b.viewBox();
    if (s.step >= 1) b.poly([[vb.x0, vb.y0], [0, vb.y0], [0, 0], [vb.x0, 0]], { color: null, fill: 'violet', fillAlpha: 0.08 });
    if (s.step >= 2) {
      const f = sqf(s.i1a, s.i1s, s.i1d, s.i1p, s.i1q), y = f(0);
      if (Number.isFinite(y)) b.point([0, y], { r: 5, color: 'green', label: `f(0)${Math.abs(y) < 1e-9 ? '=' : y > 0 ? '>' : '<'}0`, dx: 10, dy: -10, size: 12 });
      const x = s.i1p + s.i1q * s.i1q / s.i1a;
      if (Math.abs(x) > 1e-8) b.point([x, 0], { r: 5, color: 'green', label: `(${mn(x)}, 0)`, dx: -8, dy: 16, align: 'right', size: 12 });
    }
  }
  for (const sc of scenes) {
    const original = { question: sc.question, reviewTop: sc.reviewTop, steps: sc.steps, view: sc.view, draw: sc.draw };
    sc.question = (s, lab) => lirActive(s) ? s.lirQuestion || source.question(sc.id) : typeof original.question === 'function' ? original.question(s, lab) : original.question;
    sc.reviewTop = (s, lab) => lirActive(s) ? '' : original.reviewTop(s, lab);
    sc.steps = (s, lab) => lirActive(s) ? ['조건을 확인해요.', '그림에서 풀이 전략을 찾아요.', '식을 세워 계산해요.', '구하는 값을 확인해요.'] : original.steps(s, lab);
    sc.view = (s, lab) => lirActive(s) ? {} : original.view(s, lab);
    sc.draw = (b, s, v, lab) => {
      if (!lirActive(s)) return original.draw(b, s, v, lab);
      const state = { ...s, ...(s.lessonEntry ? s.lirInitial : {}), playing: false, step: s.lessonEntry ? 0 : Math.min(s.step || 0, s.lirShowAnswer ? 4 : 3) };
      if (s.lessonEntry) { state.lirTrace = 0; state.lirShowAnswer = false; }
      const shownLab = Object.create(lab); shownLab.tab = state.lirExplore ? 'explore' : 'review';
      original.draw(b, state, {}, shownLab);
      if (sc.id === 'i1') quadrantMarkers(b, state);
      curveTrace(b, state, sc.id);
    };
  }
  const lessons = window.APL_IRR_LESSONS ? window.APL_IRR_LESSONS.install(scenes, source) : {};
  APLab.createLab({
    id: 'common-irrational',
    stagedReveal: true,
    title: '무리함수',
    courseName: '공통수학',
    unit: '함수와 그래프',
    courseColor: 'var(--m-green)',
    home: '../index.html#common',
    legacy: '../labs/common-irrational.html',
    board: { kind: 'cartesian', focus: { x: [-8, 8], y: [-6.5, 7.5] }, minZoom: 0.5, maxZoom: 6 },
    params: {
      i1a: { value: 2, min: 1, max: 6, step: 1, color: 'sky', label: 'a (벌어지는 정도)', hint: 'a가 클수록 곡선이 가파르게 열립니다', format: fm },
      i1p: { value: 1, min: -6, max: 6, step: 1, color: 'amber', label: 'p (x방향 이동)', hint: '시작점의 x좌표', format: fm },
      i1q: { value: 1, min: -6, max: 6, step: 1, color: 'rose', label: 'q (y방향 이동)', hint: '시작점의 y좌표', format: fm },
      i3c: { value: 4, min: 1, max: 12, step: 1, color: 'sky', label: 'c (f(x)=±√(c(x−p))+q)', format: fm },
      i3p: { value: 2, min: -3, max: 4, step: 1, color: 'amber', label: 'p', format: fm },
      i3q: { value: 2, min: -3, max: 9, step: 1, color: 'rose', label: 'q', format: fm }
    },
    scenes,
    lessons
  });
});
