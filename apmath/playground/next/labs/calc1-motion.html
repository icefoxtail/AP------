  /* ---------- 2. 운동 모델 (원본 evalX / evalV / evalA / ...Mode4 와 같은 식) ---------- */
  const T_MAX = 3.5;
  const posX = (t, p) => { const u = t - 1.0; return u * u * u - 3.0 * p * u + (1.0 - 3.0 * p); };   // x(0)=0 에서 출발
  const velV = (t, p) => { const u = t - 1.0; return 3.0 * (u * u - p); };
  const accA = (t) => 6.0 * (t - 1.0);
  const xP4 = (t) => -t * t * t + 3.0 * t * t;
  const vP4 = (t) => -3.0 * t * t + 6.0 * t;
  const xQ4 = (t, k) => 1.5 * k * t * t;
  const vQ4 = (t, k) => 3.0 * k * t;

  /** 속도 부호가 실제로 바뀌는 시각: v = 3((t−1)² − p) = 0 → t = 1 ± √p (p>0). p=0 은 접하기만 하므로 제외. */
  const turnsOf = (p, t1) => (p > 1e-6 ? [1 - Math.sqrt(p), 1 + Math.sqrt(p)].filter((x) => x > 1e-6 && x < t1 - 1e-6) : []);
  /** 0→t 를 방향이 일정한 구간(leg)으로 쪼개 전진 넓이·후진 넓이·변위·이동거리를 구합니다(원본 evalDistance 와 같은 양). */
  function motion(t, p) {
    const cuts = [0, ...turnsOf(p, t), t];
    const legs = [];
    let fwd = 0, back = 0;
    for (let i = 0; i < cuts.length - 1; i++) {
      const a = cuts[i], b = cuts[i + 1];
      if (b - a < 1e-9) continue;
      const dir = velV((a + b) / 2, p) >= 0 ? 1 : -1;
      const x0 = posX(a, p), x1 = posX(b, p);
      legs.push({ a, b, dir, x0, x1 });
      if (dir > 0) fwd += x1 - x0; else back += x0 - x1;
    }
    return { legs, fwd, back, disp: fwd - back, dist: fwd + back };
  }
  /** 장면 4: v_P − v_Q = −3t(t − (2−k)) 의 부호가 바뀌는 t = 2−k 에서 구간을 나눕니다. */
  function gapLegs(t, k) {
    const t1 = 2 - k;
    const cuts = [0, ...(t1 > 1e-6 && t1 < t - 1e-6 ? [t1] : []), t];
    const legs = [];
    for (let i = 0; i < cuts.length - 1; i++) {
      const a = cuts[i], b = cuts[i + 1];
      if (b - a < 1e-9) continue;
      const m = (a + b) / 2;
      legs.push({ a, b, dir: vP4(m) - vQ4(m, k) >= 0 ? 1 : -1 });
    }
    return legs;
  }

  /* ---------- 3. 화면 구성: 수직선 트랙 · 위치 x(t) · 속도 v(t) 세 창 ---------- */
  const NARROW = window.matchMedia('(max-width: 859px)'); // apl.css 의 모바일 기준과 같은 값
  const X_FOCUS = [-0.5, 3.88];  // 시간축: 0~3.5초 + 왼쪽 눈금 자리 + 오른쪽 도구 막대 자리(눈금 4가 가장자리에 걸리지 않게)
  const Y_TRACK = [-1, 1.2];     // 트랙 창: 수직선이 창의 55% 높이에 오도록
  const snapT = (x, extra) => {
    let v = clamp(x, 0, T_MAX);
    for (const m of [1.0, 1.5, 2.0, 3.0, ...(extra || [])]) if (Math.abs(v - m) < 0.06) v = m;   // 원본의 자석 스냅
    return +v.toFixed(2);
  };
  const sg = (v, d = 1) => (Math.abs(v) < 0.5 * Math.pow(10, -d) ? '' : (v < 0 ? ' - ' : ' + ') + fmt(Math.abs(v), d));
  const intStep = (ky, minPx) => [1, 2, 5, 10, 20, 50].find((v) => v * ky >= minPx) || 100;
  const pick = (r) => (Array.isArray(r) ? r : NARROW.matches ? r.n : r.w);   // 세로 범위: 휴대폰은 라벨이 들어갈 아래쪽 여백을 더 둡니다
  /**
   * 창 배치. 맨 위 빈 창(head)은 수식 칩·상태 배지 자리, 맨 아래 빈 창(foot)은 모바일 도구 막대·상태 배지 자리입니다.
   * 두 자리의 높이는 셸이 잰 값(board.insets)을 그대로 씁니다 → 수식이 두 줄이 되어도 겹치지 않습니다.
   * 작은 화면에서는 두 그래프가 최소 높이를 갖도록 수직선 트랙을 작게(mini: 글자는 눈금뿐) 줄이고, 그래도 모자라면 접습니다.
   */
  const labRef = () => window.lab || null;   // 첫 장면을 만드는 동안에는 아직 없음
  const layoutOf = (s) => {
    if (!NARROW.matches) return { track: true, mini: false, deriv: !!s.dual };
    const lab = labRef();
    const stage = lab ? lab.ui.stage.clientHeight : window.innerHeight * 0.54;
    const ins = lab ? lab.board.insets : { top: 0, bottom: 0 };
    // 하단 띠(단계 3의 테이프, 약 50px)가 생겨도 배치가 흔들리지 않도록 그만큼을 미리 빼고 판단합니다.
    const free = stage - 50 - Math.max(ins.top || 0, 44) - (ins.bottom || 58);
    const need = s.dual ? 160 : 110;   // 그래프가 가져야 할 최소 높이
    if (free - 82 >= need) return { track: true, mini: false, deriv: !!s.dual };
    if (free - 58 >= need || !s.dual) return { track: true, mini: true, deriv: !!s.dual };
    return { track: false, mini: true, deriv: true };
  };
  const panesOf = (fx, fv) => (s) => {
    const lab = labRef(), lay = layoutOf(s);
    const H = (lab && lab.board.H) || 420, ins = lab ? lab.board.insets : { top: 0, bottom: 0 };
    const head = Math.max(ins.top || 0, NARROW.matches ? 44 : 46) / H;
    const foot = (ins.bottom || 0) / H;
    const track = lay.track ? (NARROW.matches ? (lay.mini ? 58 : 82) / H : 0.19) : 0;
    const rest = 1 - head - track - foot;
    const list = [{ id: 'head', frac: head }];
    if (lay.track) list.push({ id: 'track', frac: track, focusY: Y_TRACK });
    if (lay.deriv) {
      const h1 = rest * 0.47;
      list.push({ id: 'main', frac: h1, focusY: pick(fx) }, { id: 'deriv', frac: rest - h1, focusY: pick(fv) });
    } else list.push({ id: 'main', frac: rest, focusY: pick(fx) });
    if (foot > 0.001) list.push({ id: 'foot', frac: foot });
    return list;
  };

  /* ---------- 4. 그리기 도우미 ---------- */
  /** 창 바탕(어둡게)과 윗줄. 반환: 창의 화면 사각형 */
  function paneBg(b, id, tint, line) {
    b.use(id);
    const r = b.paneRect(id), c = b.ctx;
    c.save();
    if (tint) { c.fillStyle = b.color('halo', tint); c.fillRect(r.x, r.y, r.w, r.h); }
    if (line) {
      c.strokeStyle = b.color('sky', 0.5);
      c.lineWidth = 1.5;
      c.beginPath();
      c.moveTo(r.x, r.y + 0.5);
      c.lineTo(r.x + r.w, r.y + 0.5);
      c.stroke();
    }
    c.restore();
    return r;
  }
  const vis = (b, y) => { const vb = b.viewBox(), m = (vb.y1 - vb.y0) * 0.03; return y > vb.y0 + m && y < vb.y1 - m; };
  function textW(b, str, size, weight) {
    const c = b.ctx;
    c.save();
    c.font = `${weight || 800} ${size * b.fs}px ${b.font}`;
    const w = c.measureText(String(str)).width;
    c.restore();
    return w;
  }
  /** 가운데 정렬 글자(창 가장자리에서 잘리지 않도록 가로 위치를 밀어 넣음) */
  function slabel(b, x, y, str, o) {
    if (b.thumb) return;   // 모든 장면 보기의 작은 썸네일에서는 글자를 빼서 그림만 보이게 합니다
    const size = (o && o.size) || 11.5, w = textW(b, str, size) + 6, r = b.paneRect();
    b.stext(clamp(x, r.x + w / 2 + 3, r.x + r.w - w / 2 - 3), y, str, { baseline: 'middle', weight: 800, ...o, size, align: 'center' });
  }
  /** 점 옆 글자: 오른쪽에 자리가 없으면 왼쪽 */
  function sideLabel(b, x, y, str, o) {
    if (b.thumb) return;
    const size = (o && o.size) || 11.5, w = textW(b, str, size) + 6, r = b.paneRect();
    const right = x + 11 + w <= r.x + r.w - 4;
    b.stext(right ? x + 11 : x - 11, y, str, { baseline: 'middle', weight: 800, ...o, size, align: right ? 'left' : 'right' });
  }
  /** 위치/속도 그래프 바탕: 격자 · 축 · 눈금 · 이름표 */
  function graphAxes(b, s, title, color) {
    const ky = b.ky;
    if (s.grid) b.grid({ step: 0.5, majorEvery: 2, stepY: intStep(ky, 22) });
    b.axes({ tickStep: 1, tickStepY: intStep(ky, 30), xLabel: false, yLabel: false });
    const r = b.paneRect(), org = b.toS(0, 0);
    if (b.thumb) return null;
    b.stext(org.x + 9, r.y + 14, title, { color, size: 12.5, align: 'left', baseline: 'middle', weight: 800 });
    b.stext(b.toS(T_MAX, 0).x + 7, org.y + 11, 't(초)', { color: 'muted', size: 11.5, align: 'left', baseline: 'middle', weight: 700 });
    return [org.x + 7, r.y + 5, org.x + 11 + textW(b, title, 12.5), r.y + 23];   // 이름표 자리(라벨이 피하도록)
  }
  const syncLine = (b, s) => {
    const on = s.step >= 3;
    b.vline(s.t, { color: 'amber', alpha: on ? 0.85 : 0.35, width: on ? 2.2 : 1.3, dash: true, ref: 't' });
  };
  // 끌 때는 1·1.5·2·3 근처에서 자석처럼 붙지만, 화살표 키(keydown)는 붙지 않아야 스냅 점에서 한 칸씩 벗어날 수 있습니다.
  const timeHandle = (b, s, id, snaps) => b.handle(id, [s.t, 0], { color: 'amber', r: 7, ref: 't', ariaLabel: '시각 t 표시점', priority: 1, drag: (w, e) => { s.t = e && e.type === 'keydown' ? +clamp(w.x, 0, T_MAX).toFixed(2) : snapT(w.x, snaps); } });
  /**
   * b.point 래퍼(라벨 자리 찾기): 먼저 그린 라벨·점과 겹치거나 오른쪽 도구 막대(수업 모드에서는 더 큼) 밑으로 들어가면
   * 같은 점의 다른 쪽(아래·왼쪽)으로 옮깁니다. 중요한 라벨부터 먼저 부르세요. 썸네일에서는 라벨 없이 점만 그립니다.
   *   pt(점, 옵션)           라벨 있는 점   pt.text(점, 글, 옵션)  자리를 잡는 글자   pt.avoid(점, 반지름)  피할 곳 등록
   */
  function makePt(b) {
    const lab = labRef();
    const rlim = b.W - (NARROW.matches || !lab ? 0 : lab.board.insets.right) - 6;
    const rects = [];
    const over = (r) => rects.reduce((a, k) => a + Math.max(0, Math.min(r[2], k[2]) - Math.max(r[0], k[0])) * Math.max(0, Math.min(r[3], k[3]) - Math.max(r[1], k[1])), 0);   // 겹친 넓이
    const dot = (q, r) => { const c = b.toS(q[0], q[1]); rects.push([c.x - r, c.y - r, c.x + r, c.y + r]); };
    const mir = (c, fx, fy) => ({ dx: fx ? -c.dx : c.dx, dy: fy ? -c.dy : c.dy, align: fx ? ((c.align || 'left') === 'left' ? 'right' : 'left') : c.align || 'left' });
    const pt = (q, o) => {
      if (b.thumb) return b.point(q, { ...o, label: null });
      if (o.label) {
        const c0 = b.toS(q[0], q[1]), sz = o.size || 12.5, w = textW(b, o.label, sz), hgt = sz * b.fs * 1.25;
        const rectOf = (c) => { const x0 = c.align === 'left' ? c0.x + c.dx : c0.x + c.dx - w, y = c0.y + c.dy; return [x0 - 2, y - hgt / 2, x0 + w + 2, y + hgt / 2]; };
        const inside = (r) => r[0] >= 6 && r[2] <= rlim;
        const far = (c) => ({ ...c, dy: c.dy * 2 });   // 같은 쪽에서 한 칸 더 멀리
        const cands = [mir(o, 0, 0), mir(o, 0, 1), far(mir(o, 0, 0)), far(mir(o, 0, 1)), mir(o, 1, 0), mir(o, 1, 1)];
        const score = (c) => over(rectOf(c)) + cands.indexOf(c) * 40;   // 겹친 넓이 + 처음 자리에서 멀어질수록 벌점(살짝 닿는 정도는 그대로 둠)
        const okc = cands.filter((c) => inside(rectOf(c)));
        const pick = (okc.length ? okc : cands).reduce((a, c) => (score(c) < score(a) ? c : a));
        rects.push(rectOf(pick));
        o = { ...o, dx: pick.dx, dy: pick.dy, align: pick.align };
      }
      dot(q, (o.r || 5) + 3);
      return b.point(q, o);
    };
    pt.avoid = (q, r) => dot(q, r);
    pt.block = (r) => { if (r) rects.push(r); };
    pt.text = (q, str, o) => {
      if (b.thumb) return;
      const c0 = b.toS(q[0], q[1]), w = textW(b, str, (o && o.size) || 11.5), hgt = ((o && o.size) || 11.5) * b.fs * 1.25;
      rects.push([c0.x - w / 2, c0.y - hgt / 2, c0.x + w / 2, c0.y + hgt / 2]);
      b.text(q, str, o);
    };
    return pt;
  }
  /** 부호가 일정한 구간마다 v(t)와 t축 사이(또는 두 속도 사이)를 칠합니다: 전진·앞섬 = rose, 후진·뒤짐 = sky */
  function fillLeg(b, leg, top, bottom) {
    const n = Math.max(3, Math.ceil((leg.b - leg.a) / 0.025));
    const up = [], dn = [];
    for (let i = 0; i <= n; i++) {
      const t = leg.a + ((leg.b - leg.a) * i) / n;
      up.push([t, top(t)]);
      dn.push([t, bottom(t)]);
    }
    b.path(up.concat(dn.reverse()), { close: true, fill: leg.dir > 0 ? 'rose' : 'sky', fillAlpha: 0.3, color: null, ref: 'area' });
  }

  /* ---------- 5. 수직선 트랙 ---------- */
  const TRACK_X0 = -0.12, TRACK_X1 = 3.82;
  /** 트랙 창에 눈금·수직선을 그리고 위치→가로 좌표 함수를 돌려줍니다(범위 밖의 점은 끝에 붙임). mini: 작은 화면용(글자는 눈금뿐). */
  function trackBase(b, cfg, mini) {
    const c = b.ctx, r = b.paneRect('track'), F = b.fs;
    const to = (pos) => TRACK_X0 + ((clamp(pos, cfg.lo, cfg.hi) - cfg.lo) / (cfg.hi - cfg.lo)) * (TRACK_X1 - TRACK_X0);
    const pxUnit = ((TRACK_X1 - TRACK_X0) * b.k) / (cfg.hi - cfg.lo);
    const st = [1, 2, 5, 10].find((v) => v * pxUnit >= 26) || 20;
    const ticks = [];
    for (let v = Math.ceil(cfg.lo / st) * st; v <= cfg.hi; v += st) ticks.push(v);
    c.save();
    b.clip();
    const U = (px) => px / b.ky;
    b.seg([TRACK_X0 - 0.06, 0], [TRACK_X1 + 0.06, 0], { color: 'ink', alpha: 0.55, width: 2.2 });
    ticks.forEach((v) => b.seg([to(v), -U(5)], [to(v), U(5)], { color: v === 0 ? 'amber' : 'ink', alpha: v === 0 ? 1 : 0.5, width: v === 0 ? 2.6 : 1.4 }));
    c.restore();
    const D = mini ? { tick: 13, lane0: 7, laneStep: 5, arrow: 24, dot: 6.5 }
      : NARROW.matches ? { tick: 14, lane0: 10, laneStep: 6, arrow: 22, vlab: 35, name: 30, gap: 31, dot: 8 }
      : { tick: 17, lane0: 10, laneStep: 6, arrow: 27, vlab: 40, name: 35, gap: 34, dot: 8 };
    return { to, U, r, F, ticks, wideOrigin: st * pxUnit >= 44, D, mini };
  }
  function trackTicks(b, T, ly) {
    if (b.thumb) return;
    T.ticks.forEach((v) => {
      const sx = b.toS(T.to(v), 0).x;
      b.stext(sx, ly, v === 0 ? (T.wideOrigin && !T.mini ? '원점(0)' : '0') : fmt(v, 0), { color: v === 0 ? 'amber' : 'muted', size: 10.5, weight: v === 0 ? 800 : 700, baseline: 'middle' });
    });
  }
  const trackTitle = (b, str) => { if (!b.thumb && !NARROW.matches) b.stext(b.paneRect('track').x + 10, b.paneRect('track').y + 12, str, { color: 'muted', size: 11, align: 'left', baseline: 'middle', weight: 700 }); };
  function drawTrackSingle(b, s, cfg, V, mini) {
    const { x, v: vel, m } = V;
    const T = trackBase(b, cfg, mini), c = b.ctx;
    const { to, U, F, D } = T;
    const px = to(x), off = x > cfg.hi ? 1 : x < cfg.lo ? -1 : 0;
    c.save();
    b.clip();
    // 방향이 바뀔 때마다 궤적을 한 칸씩 위로 쌓습니다: 전진 = rose, 후진 = sky, 지금 구간이 가장 진하게
    m.legs.forEach((leg, i) => {
      const lane = U((D.lane0 + D.laneStep * (m.legs.length - 1 - i)) * F);
      b.seg([to(leg.x0), lane], [to(i === m.legs.length - 1 ? x : leg.x1), lane], { color: leg.dir > 0 ? 'rose' : 'sky', alpha: i === m.legs.length - 1 ? 1 : 0.7, width: mini ? 3 : 3.5, ref: 'x' });
    });
    // 속도 화살표
    const alen = clamp(vel * 10, NARROW.matches ? -45 : -65, NARROW.matches ? 45 : 65);
    if (Math.abs(vel) > 0.1) {
      const y0 = U(D.arrow * F), tip = px + alen / b.k, d = alen > 0 ? 1 : -1;
      const col = vel > 0 ? 'rose' : 'sky';
      b.seg([px, y0], [tip, y0], { color: col, width: 2.8, ref: 'v' });
      b.seg([tip, y0], [tip - (d * 7) / b.k, y0 + U(4)], { color: col, width: 2.8, ref: 'v' });
      b.seg([tip, y0], [tip - (d * 7) / b.k, y0 - U(4)], { color: col, width: 2.8, ref: 'v' });
    }
    b.point([px, 0], { color: 'amber', r: D.dot, ref: 'x' });
    c.restore();
    const ly = b.toS(0, 0).y;
    trackTicks(b, T, ly + D.tick * F);
    if (mini) return;   // 작은 화면: 값은 아래 두 그래프의 라벨과 상태 배지가 알려 줍니다
    if (Math.abs(vel) > 0.1) slabel(b, b.toS(px + alen / b.k / 2, 0).x, ly - D.vlab * F, `v=${fmt(vel, 1)} ${vel > 0 ? '→(전진)' : '←(후진)'}`, { color: vel > 0 ? 'rose' : 'sky' });
    else slabel(b, b.toS(px, 0).x, ly - (D.vlab - 2) * F, '순간 정지 (v = 0)', { color: 'amber' });
    slabel(b, b.toS(px, 0).x, ly + D.name * F, `점 P (x = ${fmt(x)})${off > 0 ? ' →' : off < 0 ? ' ←' : ''}`, { color: 'amber' });
    trackTitle(b, '수직선 위의 점 P');
  }
  function drawTrackPair(b, s, cfg, V, mini) {
    const { xp, xq } = V;
    const T = trackBase(b, cfg, mini), c = b.ctx;
    const { to, U, F, D } = T;
    const pP = to(xp), pQ = to(xq);
    const dy = mini ? 7 : 9, gy = mini ? 16 : 21, r = mini ? 5.5 : 6.5;
    c.save();
    b.clip();
    b.seg([pP, U(gy * F)], [pQ, U(gy * F)], { color: 'rose', width: 3, glow: true, ref: 'gap' });
    b.seg([pP, U((gy - 5) * F)], [pP, U((gy + 5) * F)], { color: 'rose', width: 2, ref: 'gap' });
    b.seg([pQ, U((gy - 5) * F)], [pQ, U((gy + 5) * F)], { color: 'rose', width: 2, ref: 'gap' });
    b.point([pP, U(dy * F)], { color: 'amber', r, ref: 'P' });
    b.point([pQ, -U(dy * F)], { color: 'sky', r, ref: 'Q' });
    c.restore();
    const ly = b.toS(0, 0).y;
    trackTicks(b, T, ly + (mini ? 20 : D.tick + 2) * F);
    if (mini) return;
    slabel(b, b.toS((pP + pQ) / 2, 0).x, ly - D.gap * F, `간격 |x_P − x_Q| = ${fmt(Math.abs(xp - xq))}`, { color: 'rose' });
    sideLabel(b, b.toS(pP, 0).x, ly - 9 * F, `P(${fmt(xp)})${xp > cfg.hi ? ' →' : xp < cfg.lo ? ' ←' : ''}`, { color: 'amber' });
    slabel(b, b.toS(pQ, 0).x, ly + (D.name + 1) * F, `Q(${fmt(xq)})${xq > cfg.hi ? ' →' : xq < cfg.lo ? ' ←' : ''}`, { color: 'sky' });
    trackTitle(b, '수직선 위의 두 점 P, Q');
  }

  /* ---------- 6. 장면 1·2·3·5: 점 하나 (위치 x(t), 속도 v(t)) ---------- */
  function drawSingle(b, s, V, cfg) {
    const { p, m, x, v: vv } = V;
    const t = s.t, id = cfg.id, c = b.ctx, nw = NARROW.matches;   // nw: 휴대폰에서는 라벨을 줄여 겹침을 막습니다
    const pt = makePt(b);
    const turns = turnsOf(p, T_MAX);
    const lay = layoutOf(s);
    // (1) 수직선 트랙
    if (lay.track) {
      paneBg(b, 'track', 0.3, false);
      if (s.step >= 1) drawTrackSingle(b, s, cfg, V, lay.mini);
    }
    // (2) 위치 x(t)
    paneBg(b, 'main', 0, true);
    c.save();
    b.clip();
    const tx = graphAxes(b, s, '위치 x(t)', 'ink');
    b.plot((u) => posX(u, p), { from: 0, to: T_MAX, color: 'ink', width: 3, glow: true, ref: 'x' });
    syncLine(b, s);
    c.restore();
    b.use('main');
    pt.block(tx);
    turns.forEach((tt) => {
      const xv = posX(tt, p), isMin = tt > 1;
      if (vis(b, xv)) pt([tt, xv], { color: 'red', r: 5.5, ref: 'x', label: Math.abs(t - tt) < 0.05 || (nw && turns.length > 1) ? null : nw ? `방향 전환 ${isMin ? '극소' : '극대'} (${fmt(tt, 1)}, ${fmt(xv, 1)})` : `방향 전환 ${isMin ? '극소' : '극대'}(t=${fmt(tt, 1)}, x=${fmt(xv, 1)})`, dx: 10, dy: isMin ? 16 : -16 });
    });
    if (id === 'origin' || id === 'trap') pt([3, 0], { hollow: true, color: 'green', r: 5.5, ref: 'x', label: Math.abs(t - 3) < 0.05 ? null : id === 'origin' ? '원점 복귀 (t=3)' : nw ? '원점 통과 (방향 전환 아님)' : '원점 통과일 뿐 (방향 전환 아님)', dx: -10, dy: -16, align: 'right' });
    if (id === 'turn' && Math.abs(p) < 1e-6) pt([1, posX(1, p)], { hollow: true, color: 'violet', r: 5.5, ref: 'x', label: nw ? 'v(t) 극소 · x(t)는 극값 아님' : 'v(t)가 극소(0)인 점 · x(t)는 극값 아님', dx: 10, dy: 16 });
    pt.avoid([t, 0], 9);
    if (vis(b, x)) pt([t, x], { color: 'amber', r: 6.5, ref: 'x', label: nw ? `x(${fmt(t)}) = ${fmt(x)}` : `위치 x(${fmt(t)}) = ${fmt(x)}`, dx: 12, dy: -12 });
    timeHandle(b, s, 'T');
    // (3) 속도 v(t)
    if (lay.deriv) {
      paneBg(b, 'deriv', 0.3, true);
      c.save();
      b.clip();
      const tv = graphAxes(b, s, '속도 v(t)', 'sky');
      if (s.step >= 2) m.legs.forEach((leg) => fillLeg(b, leg, (u) => velV(u, p), () => 0));
      b.plot((u) => velV(u, p), { from: 0, to: T_MAX, color: 'sky', width: 2.8, glow: true, ref: 'v' });
      syncLine(b, s);
      c.restore();
      b.use('deriv');
      pt.block(tv);
      if (s.step >= 3 && !nw && !b.thumb) {
        m.legs.forEach((leg) => {
          const len = Math.abs(leg.x1 - leg.x0);
          if (len < 0.3) return;
          const mid = (leg.a + leg.b) / 2;
          pt.text([mid, velV(mid, p) / 2], `${leg.dir > 0 ? '전진 +' : '후진 −'}${fmt(len)}`, { color: leg.dir > 0 ? 'rose' : 'sky', size: 11.5, weight: 800, baseline: 'middle', ref: 'area' });
        });
      }
      turns.forEach((tt) => pt([tt, 0], { hollow: true, color: 'red', r: 5.5, ref: 'v', label: Math.abs(t - tt) < 0.05 || (nw && turns.length > 1) ? null : turns.length > 1 ? 'v=0' : nw ? 'v=0 방향 전환' : 'v=0 · 부호 변화(방향 전환)', dx: turns.length > 1 ? -10 : 10, dy: turns.length > 1 ? -16 : 16, align: turns.length > 1 ? 'right' : 'left' }));
      const v1 = velV(1, p);
      const vertex = id === 'origin' ? (nw ? 'a(1)=0 속력 최대' : `a(1)=0 · 속력 최대 |v|=${fmt(Math.abs(v1), 0)}`) : id === 'turn' && Math.abs(p) < 1e-6 ? (nw ? 'v=0 접함 (직진)' : 't=1 : v=0 접함 (부호 불변)') : nw ? 'a(1)=0' : '가속도 a(1)=0 (꼭짓점)';
      if (vis(b, v1)) pt([1, v1], { color: 'violet', r: 5, ref: 'a', label: vertex, dx: -8, dy: 18, align: 'right' });
      pt.avoid([t, 0], 9);
      if (vis(b, vv)) pt([t, vv], { color: 'amber', r: 6.5, ref: 'v', label: nw ? `v(${fmt(t)}) = ${fmt(vv)}` : `속도 v(${fmt(t)}) = ${fmt(vv)}`, dx: 12, dy: -12 });
      timeHandle(b, s, 'Tv');
    }
    b.use('main');
  }

  /* ---------- 7. 장면 4: 두 점 P, Q 추격전 ---------- */
  function drawPair(b, s, V, cfg) {
    const { k, xp, xq, t1, t2 } = V;
    const t = s.t, c = b.ctx;
    const pt = makePt(b);
    const snaps = [t1, t2].filter((q) => q > 0.05 && q <= T_MAX);
    const lay = layoutOf(s);
    if (lay.track) {
      paneBg(b, 'track', 0.3, false);
      if (s.step >= 1) drawTrackPair(b, s, cfg, V, lay.mini);
    }
    paneBg(b, 'main', 0, true);
    c.save();
    b.clip();
    const tx = graphAxes(b, s, '위치 x(t)', 'ink');
    b.plot(xP4, { from: 0, to: T_MAX, color: 'amber', width: 2.8, glow: true, ref: 'P' });
    b.plot((u) => xQ4(u, k), { from: 0, to: T_MAX, color: 'sky', width: 2.8, glow: true, ref: 'Q' });
    b.seg([t, xp], [t, xq], { color: 'rose', width: 2.8, glow: true, ref: 'gap' });
    syncLine(b, s);
    c.restore();
    b.use('main');
    pt.block(tx);
    if (t2 > 0.05 && t2 <= T_MAX && vis(b, xQ4(t2, k))) pt([t2, xQ4(t2, k)], { hollow: true, color: 'rose', r: 6, ref: 'gap', label: Math.abs(t - t2) < 0.05 || NARROW.matches ? null : `두 점 만남 (t=${+t2.toFixed(2)})`, dx: -10, dy: -16, align: 'right' });
    pt.avoid([t, 0], 9);
    if (vis(b, xp)) pt([t, xp], { color: 'amber', r: 6.5, ref: 'P', label: `x_P(${fmt(t)})=${fmt(xp)}`, dx: 12, dy: -12 });
    if (vis(b, xq)) pt([t, xq], { color: 'sky', r: 6.5, ref: 'Q', label: `x_Q(${fmt(t)})=${fmt(xq)}`, dx: 12, dy: 18 });
    timeHandle(b, s, 'T', snaps);
    if (lay.deriv) {
      paneBg(b, 'deriv', 0.3, true);
      c.save();
      b.clip();
      const tv = graphAxes(b, s, '속도 v(t)', 'sky');
      if (s.step >= 2) gapLegs(t, k).forEach((leg) => fillLeg(b, leg, vP4, (u) => vQ4(u, k)));
      b.plot(vP4, { from: 0, to: T_MAX, color: 'amber', width: 2.8, glow: true, ref: 'P' });
      b.plot((u) => vQ4(u, k), { from: 0, to: T_MAX, color: 'sky', width: 2.8, glow: true, ref: 'Q' });
      syncLine(b, s);
      c.restore();
      b.use('deriv');
      pt.block(tv);
      if (t1 > 0.05 && t1 <= T_MAX) pt([t1, vQ4(t1, k)], { color: 'rose', r: 6, ref: 'gap', label: NARROW.matches ? 'v_P=v_Q 거리 최대' : `v_P=v_Q (t=${+t1.toFixed(2)}, 거리 최대!)`, dx: -10, dy: -16, align: 'right' });
      if (vis(b, vP4(t))) pt([t, vP4(t)], { color: 'amber', r: 5, ref: 'P' });
      if (vis(b, vQ4(t, k))) pt([t, vQ4(t, k)], { color: 'sky', r: 5, ref: 'Q' });
      timeHandle(b, s, 'Tv', snaps);
    }
    b.use('main');
  }

  /* ---------- 8. 장면 데이터 만들기 ---------- */
  const secs = (m) => examData[m].targetTime;
  const problemOf = (m, key) => {
    const d = examData[m];
    return { tag: d.tag, time: secs(m), text: d.question, answer: d.answerBadge, snap: () => ({ t: d.snap.t, ...(key ? { [key]: d.snap.param } : {}), dual: d.snap.dualView }) };
  };
  const solutionOf = (m) => ({
    standardTitle: '교과서식 정석 풀이', standardTag: '정석 · 3분',
    quickTitle: '10초 컷 · 넓이와 비율 공식', quickTag: '10초 컷',
    standard: examData[m].textbook,
    quick: examData[m].shortcut
  });
  const enterOf = (m, key) => (s) => {
    const sn = examData[m].snap;
    s.t = sn.t;
    if (key) s[key] = sn.param;
    s.dual = sn.dualView;
  };
  const actionsOf = () => [
    { id: 'dual', icon: 'split', label: (s) => (s.dual ? 'x(t)·v(t) 함께 보기 켜짐' : 'x(t)·v(t) 함께 보기'), on: (s) => s.dual, run: (s) => { s.dual = !s.dual; } },
    { id: 'play', play: true, icon: (s) => (s.playing ? 'pause' : 'play'), label: (s) => (s.playing ? '일시 정지' : '주행 재생'), on: (s) => s.playing, run: (s) => { if (!s.playing && s.t >= 3.3) s.t = 0; s.playing = !s.playing; } }
  ];
  const tick = (s, dt) => {
    if (!s.playing) return false;
    s.t += dt * 1.0;                 // 원본: 한 바퀴 약 3.4초
    if (s.t > T_MAX) s.t = 0;
    return true;
  };
  const atT = (tt) => ({ label: `t = ${tt}`, set: { t: tt }, on: (s) => Math.abs(s.t - tt) < 0.011 });
  const tPreset = (tt, text, color) => ({ ...atT(tt), label: `t = ${tt} · ${text}`, color });

  /** 점 하나 장면(1·2·3·5)의 view: 값 · 칩 · 상태 · 실시간 값 · 하단 띠 */
  function viewSingle(cfg) {
    return (s) => {
      const p = cfg.usesP ? s.p : 1;
      const t = s.t, x = posX(t, p), v = velV(t, p), a = accA(t), m = motion(t, p);
      const p1 = Math.abs(p - 1) < 1e-9;
      const chips = cfg.usesP
        ? [{ tex: p1 ? 'x(t) = t^3 - 3t^2' : `x(t) = (t-1)^3${sg(-3 * p) ? sg(-3 * p) + '(t-1)' : ''}${sg(1 - 3 * p)}`, color: 'ink' }, { tex: `v(t) = 3(t-1)^2${sg(-3 * p)}`, color: 'sky' }]
        : [{ tex: 'x(t) = t^3 - 3t^2', color: 'ink' }, { tex: 'v(t) = 3t^2 - 6t,\\; a(t) = 6t - 6', color: 'sky' }];
      const back = m.back, fwd = m.fwd;
      return {
        p, x, v, a, m, chips,
        status: cfg.status(s, { p, t, x, v, m }),
        readouts: [
          { label: '관찰 시각 t', value: `${fmt(t)} 초`, color: 'amber', ref: 't' },
          { label: '위치 x(t)', value: fmt(x), color: 'ink', ref: 'x' },
          { label: '속도 v(t)', value: fmt(v), color: 'sky', ref: 'v', note: Math.abs(v) < 0.005 ? '순간 정지' : v > 0 ? '전진' : '후진' },
          { label: '가속도 a(t) = 6(t−1)', value: fmt(a, 1), color: 'violet', ref: 'a' },
          { label: '변위 Δx = ∫v dt', value: fmt(m.disp), color: 'rose', ref: 'area', note: `전진 ${fmt(fwd)} − 후진 ${fmt(back)}` },
          { label: '이동거리 D = ∫|v| dt', value: fmt(m.dist), color: 'violet', ref: 'area', note: `전진 ${fmt(fwd)} + 후진 ${fmt(back)}` }
        ],
        tape: s.step >= 3 ? {
          title: NARROW.matches ? `변위 Δx = ${fmt(m.disp)}  |  이동거리 D = ${fmt(m.dist)}  (0 ~ ${fmt(t)}초)` : `[0 ~ ${fmt(t)}초] 위치 변화량(변위 ∫v dt) = ${fmt(m.disp)}  |  실제 움직인 거리(∫|v| dt) = ${fmt(m.dist)}`,
          segments: [fwd > 0.005 ? { text: `전진 +S ${fmt(fwd)}`, weight: fwd, color: 'rose' } : null, back > 0.005 ? { text: `후진 −S ${fmt(back)}`, weight: back, color: 'sky' } : null].filter(Boolean)
        } : null
      };
    };
  }
  const near = (t, q) => Math.abs(t - q) < 0.03;

  /* ---------- 9. 장면 ---------- */
  const cfg1 = { id: 'disp', lo: -5, hi: 7 };

  const ans3 = (v) => (v.first ? examData[3].answerBadge() : `① 최대속력 ${tex(`t=${cxNum(v.tmax)}`)}, ② 최고점 ${tex(`t=${cxNum(v.b)}`)}, ③ 원점복귀 ${tex(`t=${cxNum(v.T)}`)}`);
  const steps3 = (v) => (v.first ? examData[3].steps : [
    `1단계 · t = ${cxN(v.tmax)} : 가속도 a(${cxN(v.tmax)})=v′(${cxN(v.tmax)})=0 ⇒ 구간 [0, ${cxN(v.b)}]에서 최대 속력 |v(${cxN(v.tmax)})| = ${cxN(v.vmax)}`,
    `2단계 · t = ${cxN(v.b)} : 속도 v(${cxN(v.b)})=0 이고 부호가 바뀜 ⇒ 원점으로부터 가장 멀리 떨어진 방향 전환 지점(x = ${cxN(v.xmin)})`,
    `3단계 · t = ${cxN(v.T)} : 전진한 거리와 후진한 거리가 같아짐(S₁ = S₂) ⇒ 출발 후 원점(x = 0)으로 복귀!`]);
  const std3 = (v) => {
    if (v.first) return examData[3].textbook();
    return {
      steps: `① 속력 ${tex(`|v(t)|`)} 은 ${tex(`[0, ${cxNum(v.b)}]`)} 에서 ${tex(`-v(t)=${mvTex(-v.a, v.a * v.b)}`)} 이므로 꼭짓점 ${tex(`t = ${cxNum(v.tmax)}`)} 에서 최댓값 ${tex(cxNum(v.vmax))}<br/>
② ${tex(`x(t)=\\int_0^t v(s)ds=${cxPoly([v.a / 3, -v.a * v.b / 2, 0, 0]).replace(/x/g, 't')}`)}이다. ${tex(`x(0)=0, x(${cxNum(v.b)})=${cxNum(v.xmin)}, x(${cxNum(v.T)})=0`)}이고 ${tex('x(t)')}는 ${tex(`[0,${cxNum(v.b)}]`)}에서 감소, ${tex(`[${cxNum(v.b)},${cxNum(v.T)}]`)}에서 증가하므로 이 구간에서 원점과 가장 먼 때는 ${tex(`t=${cxNum(v.b)}`)}이다.<br/>
③ ${tex('x(t) = 0')}의 양의 해는 ${tex(`t=${cxNum(v.T)}`)}이므로 그때 다시 원점을 지난다.`,
      warning: examData[3].textbook().warning
    };
  };
  const quick3 = (v) => {
    if (v.first) return examData[3].shortcut();
    return {
      steps: `① <strong>[최대 속력]</strong> 이차 속도함수의 대칭축(가속도 ${tex('a(t)=0')})인 <strong class="text-sky-300">${tex(`t = ${cxNum(v.tmax)}`)}초</strong> (속력 ${tex(cxNum(v.vmax))})!<br/>
② <strong>[원점에서 가장 먼 시각]</strong> 한쪽으로만 끝까지 가서 방향을 바꾸는 시각 <strong class="text-pink-300">${tex(`t = ${cxNum(v.b)}`)}초</strong> (거리 ${tex(`= \\dfrac{${v.a}}{6}\\cdot ${cxNum(v.b)}^3 = ${cxNum(-v.xmin)}`)})!<br/>
③ 전진한 넓이와 후진한 넓이가 같아지는 ${tex(`t = ${cxNum(v.T)}`)}에서 ${tex('x(t) = 0')}이므로 출발 이후의 원점 복귀 시각은 ${tex(`t=${cxNum(v.T)}`)}이다. 세 결과는 이 문항의 시간구간과 속도함수에서 나온다.`,
      highlight: examData[3].shortcut().highlight
    };
  };

  /* ===== 변형 4 · 두 점 P, Q 가 쫓아가는 운동 ===== */
  const MV4 = [[3, 2, 3], [3, 3, 3], [6, 2, 6], [3, 3, 6], [6, 3, 6], [3, 4, 6]];
  function mkM4(first, a, b, c) {
    const vP = (t) => a * t * (b - t), vQ = (t) => c * t, xP = (t) => a * (b * t * t / 2 - t * t * t / 3), xQ = (t) => c * t * t / 2;
    const t1 = b - c / a, t2 = 1.5 * t1;
    return { first, a, b, c, vP, vQ, xP, xQ, t1, t2, T: t2 + 0.7, S: a * t1 * t1 * t1 / 6 };
  }
  const varM4 = cxVarier((prev) => {
    if (!prev) return mkM4(true, 3, 2, 3);
    let v; do { v = mkM4(false, ...cxPick(MV4)); } while (v.a === prev.a && v.b === prev.b && v.c === prev.c);
    return v;
  });
  const specM4 = (v, st) => ({
    T: v.T, showX: st >= 1, vr: mvRange([mvClip(v.vP, v.T), mvClip(v.vQ, v.T)], v.T, 0.2), xr: mvRange([mvClip(v.xP, v.T), mvClip(v.xQ, v.T)], v.T, 0.22),
    xTitle: 'x(t) 위치 (P 노랑 · Q 하늘)', vTitle: 'v(t) 속도 (P 노랑 · Q 하늘)', sync: st >= 2 ? [[v.t1, 'rose'], [v.t2, 'green']] : [],
    x: (b) => {
      b.plot(mvClip(v.xQ, v.T), { color: 'sky', width: 3, glow: true });
      b.plot(mvClip(v.xP, v.T), { color: 'amber', width: 3, glow: true });
      if (st >= 2) {
        b.seg([v.t1, v.xQ(v.t1)], [v.t1, v.xP(v.t1)], { color: 'rose', width: 3.4, ref: 'gap' });
        b.point([v.t1, v.xP(v.t1)], { color: 'rose', r: 5.5, label: `t₁=${cxN(v.t1)} 간격 최대`, dx: -10, dy: -14, align: 'right' });
        b.point([v.t2, v.xP(v.t2)], { color: 'green', r: 6.5, label: `t₂=${cxN(v.t2)} 다시 만남`, dx: 10, dy: 17 });
      }
    },
    v: (b) => {
      if (st >= 3) {
        const area = (t0, t1, col) => { const pts = []; for (let i = 0; i <= 40; i++) { const t = t0 + ((t1 - t0) * i) / 40; pts.push([t, v.vP(t)]); } for (let i = 40; i >= 0; i--) { const t = t0 + ((t1 - t0) * i) / 40; pts.push([t, v.vQ(t)]); } b.poly(pts, { fill: col, fillAlpha: 0.28, color: null, ref: 'area' }); };
        area(0, v.t1, 'rose'); area(v.t1, v.t2, 'sky');
      }
      b.plot(mvClip(v.vQ, v.T), { color: 'sky', width: 3, glow: true });
      b.plot(mvClip(v.vP, v.T), { color: 'amber', width: 3, glow: true });
      if (st >= 3) {
        b.point([v.t1, v.vP(v.t1)], { color: 'rose', r: 6, label: `t₁=${cxN(v.t1)}: v_P = v_Q`, dx: 10, dy: -14 });
        mvNote(b, 'deriv', 34, `두 넓이가 같아지는 t₂ = ${cxN(v.t2)} 에서 다시 만남`, 'green');
      }
    }
  });
  const text4 = (v) => (v.first ? examData[4].question() : `원점에서 동시에 출발하여 수직선 위를 움직이는 두 점 ${tex('P, Q')}의 속도가 각각 ${tex(`v_P(t) = ${mvTex(-v.a, v.a * v.b)}`)}, ${tex(`v_Q(t) = ${v.c === 1 ? '' : v.c}t`)} 이다. 출발 후 두 점 ${tex('P, Q')}가 다시 만날 때까지 두 점 사이의 거리가 최대가 되는 시각 ${tex('t_1')}과 다시 만나는 시각 ${tex('t_2')}를 구하시오.`);
  const ans4 = (v) => (v.first ? examData[4].answerBadge() : `최대 거리 시각 ${tex(`t_1 = ${cxNum(v.t1)}`)}, 다시 만나는 시각 ${tex(`t_2 = ${cxNum(v.t2)}`)}`);
  const steps4 = (v) => (v.first ? examData[4].steps : [
    '1단계 · 수직선: 두 점 P(노란색)와 Q(하늘색)가 움직이는 모습과 두 점 사이의 간격을 표시합니다.',
    '2단계 · 위치 그래프: x_P(t) 와 x_Q(t) 의 간격이 가장 큰 지점과 두 그래프의 교점을 확인합니다.',
    `3단계 · 속도 그래프: 두 속도가 같아지는 교점(t=${cxN(v.t1)})과 넓이가 같아지는 지점(t=${cxN(v.t2)})을 비교합니다.`]);
  const std4 = (v) => {
    if (v.first) return examData[4].textbook();
    const xp = cxPoly([-v.a / 3, v.a * v.b / 2, 0, 0]).replace(/x/g, 't'), xq = `${cxNum(v.c / 2)}t^2`;
    return {
      steps: `① 각각 적분하여 위치 구하기: ${tex(`x_P(t) = ${xp}`)}, ${tex(`x_Q(t) = ${xq}`)}<br/>
② 거리 함수 ${tex('f(t) = x_P(t) - x_Q(t)')} 를 다시 미분하여 극댓값 조사: ${tex(`f'(t) = v_P - v_Q = ${v.a === 1 ? '' : v.a}t(${cxNum(v.t1)} - t) = 0`)} 에서 ${tex(`t_1=${cxNum(v.t1)}`)}<br/>
③ 방정식 ${tex('x_P(t) = x_Q(t)')} 를 풀면 만나는 시각 ${tex(`t_2 = ${cxNum(v.t2)}`)} 을 얻습니다.`,
      warning: examData[4].textbook().warning
    };
  };
  const quick4 = (v) => {
    if (v.first) return examData[4].shortcut();
    return {
      steps: `① <strong>[거리 최대 시각]</strong> 앞선 점 ${tex('P')}가 더 빠르다가 뒷점 ${tex('Q')}가 더 빨라지는 경계, 즉 <strong class="text-pink-300">두 속도가 같아지는 순간(${tex('v_P = v_Q')})</strong>에 거리가 최대!<br/>
&nbsp;&nbsp;${tex(`${mvTex(-v.a, v.a * v.b)} = ${v.c}t \\implies ${v.a === 1 ? '' : v.a}t(${cxNum(v.t1)} - t) = 0 \\implies`)} <strong class="text-amber-300">${tex(`t_1 = ${cxNum(v.t1)}`)}초</strong>!<br/>
② <strong>[다시 만나는 시각]</strong> 속도의 차 ${tex(`v_P - v_Q = ${v.a === 1 ? '' : v.a}t(${cxNum(v.t1)} - t)`)} 를 ${tex('0')}부터 ${tex('t_2')}까지 정적분한 값이 ${tex('0')}이 되는 <strong class="text-emerald-300">${tex(`t_2 = \\dfrac{3}{2}t_1 = ${cxNum(v.t2)}`)}초</strong>에 다시 만납니다.`,
      highlight: examData[4].shortcut().highlight
    };
  };

  /* ===== 변형 5 · 위치 그래프와 속도 그래프의 구별 ===== */
  const MV5 = [[1, 1], [2, 1], [1, 2], [2, 2], [3, 1], [4, 1]];
  function mkM5(first, a, c) {
    const xf = (t) => a * (t * t * t - 3 * c * t * t), vf = (t) => a * (3 * t * t - 6 * c * t), tt = 2 * c, T = 3 * c + 1;
    return { first, a, c, xf, vf, tt, T, xmin: xf(tt) };
  }
  const varM5 = cxVarier((prev) => {
    if (!prev) return mkM5(true, 1, 1);
    let v; do { v = mkM5(false, ...cxPick(MV5)); } while (v.a === prev.a && v.c === prev.c);
    return v;
  });
  const specM5 = (v, st) => ({
    T: v.T, showX: true, vr: mvRange([mvClip(v.vf, v.T)], v.T, 0.2), xr: mvRange([mvClip(v.xf, v.T)], v.T, 0.22), sync: st >= 1 ? [[v.tt, 'rose']] : [],
    x: (b) => {
      b.plot(mvClip(v.xf, v.T), { color: 'ink', width: 3.2, glow: true });
      if (st >= 2) b.point([v.tt, v.xmin], { color: 'rose', r: 6.5, label: `극소 (t=${cxN(v.tt)}) = 방향 전환`, dx: 10, dy: 16 });
      if (st >= 3) b.point([3 * v.c, 0], { color: 'green', r: 6, label: `x=0 (t=${cxN(3 * v.c)}): 방향 전환 아님`, dx: -10, dy: -15, align: 'right' });
    },
    v: (b) => {
      b.plot(mvClip(v.vf, v.T), { color: 'sky', width: 3, glow: true });
      if (st >= 3) b.point([v.tt, 0], { color: 'rose', r: 6.5, label: `t=${cxN(v.tt)}: v=0, 부호가 바뀜`, dx: 10, dy: -15 });
    }
  });
  const text5 = (v) => (v.first ? examData[5].question() : `시각 ${tex('t')}에 대한 삼차 위치 그래프 ${tex(`x(t) = ${cxPoly([v.a, -3 * v.a * v.c, 0, 0]).replace(/x/g, 't')}`)} 과 이차 속도 그래프 ${tex(`v(t) = ${mvTex(3 * v.a, -6 * v.a * v.c)}`)} 를 비교할 때, ① 위치 그래프 ${tex('x(t)')}에서 운동 방향이 바뀌는 지점의 그래프상의 특징과, ② 속도 그래프 ${tex('v(t)')}에서 운동 방향이 바뀌는 지점의 특징을 각각 말하시오.`);
  const ans5 = (v) => (v.first ? examData[5].answerBadge() : `위치 ${tex('x(t)')}: 극솟값 ${tex(`t=${cxNum(v.tt)}`)} / 속도 ${tex('v(t)')}: ${tex('t')}축을 지나며 부호가 바뀜(${tex(`t=${cxNum(v.tt)}`)})`);
  const steps5 = (v) => (v.first ? examData[5].steps : [
    `1단계 · 수직선: t = ${cxN(v.tt)}초(x = ${cxN(v.xmin)})에서 실제 운동 방향이 왼쪽에서 오른쪽으로 바뀌는 순간을 봅니다.`,
    '2단계 · 위치 x(t) 그래프: 접선의 기울기가 0이 되는 극소점이 방향 전환점입니다.',
    '3단계 · 속도 v(t) 그래프: 함숫값이 0이 되면서 부호가 바뀌는 점이 방향 전환점입니다.']);
  const std5 = (v) => {
    if (v.first) return examData[5].textbook();
    return {
      steps: `① 위치와 속도는 ${tex("v(t)=x'(t)")}로 연결된다. 따라서 방향 전환은 위치 그래프의 극값 중에서도 실제로 감소에서 증가(또는 증가에서 감소)로 바뀌는 점이다.<br/>
② 여기서는 ${tex(`v(t)=${v.a === 1 ? '3' : 3 * v.a}t(t-${cxNum(v.tt)})`)}이고 ${tex(`0<t<${cxNum(v.tt)}`)}에서 음수, ${tex(`t>${cxNum(v.tt)}`)}에서 양수다. 그러므로 위치는 ${tex(`t=${cxNum(v.tt)}`)}에서 극소 ${tex(`x(${cxNum(v.tt)})=${cxNum(v.xmin)}`)}를 갖고 방향을 바꾼다. ${tex('x(t)=0')}인 ${tex(`t=${cxNum(3 * v.c)}`)}은 원점 통과일 뿐 방향 전환점이 아니다.<br/>
③ 속도 그래프에서는 ${tex(`t=${cxNum(v.tt)}`)}에서만(${tex('t>0')} 범위에서) ${tex('t')}축을 지나며 부호가 바뀐다. ${tex('t=0')}은 출발 경계다.`,
      warning: examData[5].textbook().warning
    };
  };
  const quick5 = () => examData[5].shortcut();

  const MVM = {
    1: { id: 1, vary: varM1, spec: specM1, text: text1, answer: ans1, steps: steps1, std: std1, quick: quick1 },
    2: { id: 2, vary: varM2, spec: specM2, text: text2, answer: ans2, steps: steps2, std: std2, quick: quick2 },
    3: { id: 3, vary: varM3, spec: specM3, text: text3, answer: ans3, steps: steps3, std: std3, quick: quick3 },
    4: { id: 4, vary: varM4, spec: specM4, text: text4, answer: ans4, steps: steps4, std: std4, quick: quick4 },
    5: { id: 5, vary: varM5, spec: specM5, text: text5, answer: ans5, steps: steps5, std: std5, quick: quick5 }
  };
  // 옛 장면 1~5: 탐구 탭은 그대로 두고, 정리·문제 탭에 변형 문제(「새 문제」)를 얹습니다.
  function withVary(m, sc) {
    const M = MVM[m], d = examData[m], oldDraw = sc.draw, oldPanes = sc.panes, oldView = sc.view;
    const cur = () => M.vary.cur();
    return {
      ...sc,
      steps: () => M.steps(cur()),
      reviewTop: () => `<div class="apl-rich" style="font-size:var(--fs-sm);line-height:1.75"><small style="color:var(--text-3);font-weight:800">문제</small><br>${M.text(cur())}</div>`,
      problem: { tag: d.tag, time: d.targetTime, text: () => cxProb(M.text(cur())), answer: () => M.answer(cur()) },
      vary: M.vary,
      solution: { ...sc.solution, standard: () => M.std(cur()), quick: () => M.quick(cur()) },
      panes: (s) => (cxVarTab() ? mvPanes(M)() : (typeof oldPanes === 'function' ? oldPanes(s) : oldPanes)),
      view: (s, lab) => (lab && lab.tab !== 'explore' ? {} : typeof oldView === 'function' ? oldView(s, lab) : oldView),
      draw: (b, s, v, lab) => {
        if (b.thumb || !lab || lab.tab === 'explore') { if (!b.thumb) cxBackToExplore(b, s, lab); oldDraw(b, s, v, lab); } else mvFrame(b, s, lab, M);
      }
    };
  }

  for (let i = 0; i < 5; i++) scenes[i] = withVary(i + 1, scenes[i]);

  /* ---------- 10. 실험실 등록 ---------- */
  APLab.createLab({
    id: 'calc1-motion',
    title: '속도·가속도·이동거리',
    courseName: '미적분Ⅰ',
    unit: '적분 · 속도·가속도·이동거리',
    courseColor: 'var(--m-orange)',
    home: '../index.html#calc1',
    legacy: '../../labs/미적분1/속도·가속도·이동거리.html',
    // aspect:'free' — 가로축이 시간이라 세로(위치·속도)와 단위가 다르므로 배율을 따로 둡니다(키트의 선택 옵션, 기본은 1:1).
    board: { kind: 'cartesian', aspect: 'free', pad: 0.02, focus: { x: X_FOCUS, y: [-5.2, 7.4] } },
    params: {
      t: { value: 3, min: 0, max: T_MAX, step: 0.02, color: 'amber', label: '관찰 시각 t (초)', hint: '0초 ~ 3.5초 · 두 그래프 축 위의 노란 점을 끌어도 됩니다', format: (v) => `t = ${fmt(v)} 초` },
      p: { value: 1, min: -0.5, max: 2.0, step: 0.05, color: 'sky', label: '속도를 정하는 값 p', hint: '$v(t)=3(t-1)^2-3p$ · p = 1 이면 $v=3t(t-2)$, p = 0 이면 $v=3(t-1)^2$', format: (v) => `p = ${fmt(v)}` },
      k: { value: 1, min: -0.5, max: 2.0, step: 0.05, color: 'sky', label: '점 Q의 속도 계수 k', hint: '$v_Q(t)=3kt$ · 문제의 조건은 k = 1', format: (v) => `k = ${fmt(v)}` }
    },
    state: { dual: true },
    persist: ['dual'],
    scenes
  });
});
</script>
