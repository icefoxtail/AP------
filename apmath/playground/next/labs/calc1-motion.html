      5: {

  /* ---------- 2. 운동 모델 (원본 evalX / evalV / evalA / ...Mode4 와 같은 식) ---------- */
  const T_MAX = 4; // k=-1/2인 탐구에서도 첫 재회 t=15/4까지 관찰합니다.
  const posX = (t, p) => t * (t * t - 3 * t + 3 * (1 - p)); // 같은 다항식; t≈0에서 상수항 상쇄 오차를 줄입니다.
  const velV = (t, p) => { const u = t - 1.0; return 3.0 * (u * u - p); };
  const accA = (t) => 6.0 * (t - 1.0);
  const xP4 = (t) => -t * t * t + 3.0 * t * t;
  const vP4 = (t) => -3.0 * t * t + 6.0 * t;
  const xQ4 = (t, k) => 1.5 * k * t * t;
  const vQ4 = (t, k) => 3.0 * k * t;

  /** 속도 부호가 실제로 바뀌는 시각: v = 3((t−1)² − p) = 0 → t = 1 ± √p (p>0). p=0 은 접하기만 하므로 제외. */
  const turnsOf = (p, t1) => (p > 0 ? [1 - Math.sqrt(p), 1 + Math.sqrt(p)].filter((x) => x > 0 && x < t1) : []);
  /** 0→t 를 방향이 일정한 구간(leg)으로 쪼개 전진 넓이·후진 넓이·변위·이동거리를 구합니다(원본 evalDistance 와 같은 양). */
  function motion(t, p) {
    const cuts = [0, ...turnsOf(p, t), t];
    const legs = [];
    let fwd = 0, back = 0;
    for (let i = 0; i < cuts.length - 1; i++) {
      const a = cuts[i], b = cuts[i + 1];
      if (!(b > a)) continue;
      const dir = velV((a + b) / 2, p) >= 0 ? 1 : -1;
      const x0 = posX(a, p), x1 = posX(b, p);
      legs.push({ a, b, dir, x0, x1 });
      if (dir > 0) fwd += x1 - x0; else back += x0 - x1;
    }
    return { legs, fwd, back, disp: fwd - back, dist: fwd + back };
  }
  /** 장면 4: v_P − v_Q = −3t(t − (2−k)) 의 부호가 바뀌는 t = 2−k 에서 구간을 나눕니다. */
  function gapLegs(t, k) {
    const t1 = 2 - k;
    const cuts = [0, ...(t1 > 0 && t1 < t ? [t1] : []), t];
    const legs = [];
    for (let i = 0; i < cuts.length - 1; i++) {
      const a = cuts[i], b = cuts[i + 1];
      if (!(b > a)) continue;
      const m = (a + b) / 2;
      legs.push({ a, b, dir: vP4(m) - vQ4(m, k) >= 0 ? 1 : -1 });
    }
    return legs;
  }

  /* ---------- 3. 화면 구성: 수직선 트랙 · 위치 x(t) · 속도 v(t) 세 창 ---------- */
  const NARROW = window.matchMedia('(max-width: 859px)'); // apl.css 의 모바일 기준과 같은 값
  const X_FOCUS = [-0.5, 4.4];   // 최초 범위; 조작 모델의 시간과 극값에 맞춰 다시 맞춥니다.
  const Y_TRACK = [-1, 1.2];     // 트랙 창: 수직선이 창의 55% 높이에 오도록
  const snapT = (x, extra) => {
    const v = clamp(x, 0, T_MAX);
    const candidates=[...(extra||[]),1,1.5,2,3].filter(t=>t>=0&&t<=T_MAX&&Math.abs(v-t)<.06).sort((a,b)=>Math.abs(v-a)-Math.abs(v-b));
    return candidates.length ? candidates[0] : +v.toFixed(2); // 제곱근인 경계도 정확한 모델값을 보존합니다.
  };
  const sg = (v, d = 1) => (Math.abs(v) < 0.5 * Math.pow(10, -d) ? '' : (v < 0 ? ' - ' : ' + ') + fmt(Math.abs(v), d));
  const intStep = (ky, minPx) => [1, 2, 5, 10, 20, 50].find((v) => v * ky >= minPx) || 100;
  const pick = (r) => (Array.isArray(r) ? r : NARROW.matches ? r.n : r.w);   // 세로 범위: 휴대폰은 라벨이 들어갈 아래쪽 여백을 더 둡니다
  /**
   * 창 배치. 맨 위 빈 창(head)은 수식 칩·상태 배지 자리, 맨 아래 빈 창(foot)은 모바일 도구 막대·상태 배지 자리입니다.
   * 두 자리의 높이는 셸이 잰 값(board.insets)을 그대로 씁니다 → 수식이 두 줄이 되어도 겹치지 않습니다.
   * 작은 화면에서는 두 그래프가 최소 높이를 갖도록 수직선 트랙을 작게(mini: 글자는 눈금뿐) 줄이고, 그래도 모자라면 접습니다.
   */
  const labRef = () => window.lab || null;   // 첫 장면을 만드는 동안에는 아직 없음
  const layoutOf = (s) => {
    if (!NARROW.matches) return { track: true, mini: false, deriv: !!s.dual };
    const lab = labRef();
    const stage = lab ? lab.ui.stage.clientHeight : window.innerHeight * 0.54;
    const ins = lab ? lab.board.insets : { top: 0, bottom: 0 };
    // 하단 띠(단계 3의 테이프, 약 50px)가 생겨도 배치가 흔들리지 않도록 그만큼을 미리 빼고 판단합니다.
    const free = stage - 50 - Math.max(ins.top || 0, 44) - (ins.bottom || 58);
    const need = s.dual ? 160 : 110;   // 그래프가 가져야 할 최소 높이
    if (free - 82 >= need) return { track: true, mini: false, deriv: !!s.dual };
    if (free - 58 >= need || !s.dual) return { track: true, mini: true, deriv: !!s.dual };
    return { track: false, mini: true, deriv: true };
  };
  const panesOf = (fx, fv) => (s) => {
    const lab = labRef(), lay = layoutOf(s);
    const H = (lab && lab.board.H) || 420, ins = lab ? lab.board.insets : { top: 0, bottom: 0 };
    const head = Math.max(ins.top || 0, NARROW.matches ? 44 : 46) / H;
    const foot = (ins.bottom || 0) / H;
    const track = lay.track ? (NARROW.matches ? (lay.mini ? 58 : 82) / H : 0.19) : 0;
    const rest = 1 - head - track - foot;
    const list = [{ id: 'head', frac: head }];
    if (lay.track) list.push({ id: 'track', frac: track, focusY: Y_TRACK });
    if (lay.deriv) {
      const h1 = rest * 0.47;
      list.push({ id: 'main', frac: h1, focusY: pick(fx) }, { id: 'deriv', frac: rest - h1, focusY: pick(fv) });
    } else list.push({ id: 'main', frac: rest, focusY: pick(fx) });
    if (foot > 0.001) list.push({ id: 'foot', frac: foot });
    return list;
  };

  /* ---------- 4. 그리기 도우미 ---------- */
  /** 창 바탕(어둡게)과 윗줄. 반환: 창의 화면 사각형 */
  function paneBg(b, id, tint, line) {
    b.use(id);
    const r = b.paneRect(id), c = b.ctx;
    c.save();
    if (tint) { c.fillStyle = b.color('halo', tint); c.fillRect(r.x, r.y, r.w, r.h); }
    if (line) {
      c.strokeStyle = b.color('sky', 0.5);
      c.lineWidth = 1.5;
      c.beginPath();
      c.moveTo(r.x, r.y + 0.5);
      c.lineTo(r.x + r.w, r.y + 0.5);
      c.stroke();
    }
    c.restore();
    return r;
  }
  const vis = (b, y) => { const vb = b.viewBox(), m = (vb.y1 - vb.y0) * 0.03; return y > vb.y0 + m && y < vb.y1 - m; };
  function textW(b, str, size, weight) {
    const c = b.ctx;
    c.save();
    c.font = `${weight || 800} ${size * b.fs}px ${b.font}`;
    const w = c.measureText(String(str)).width;
    c.restore();
    return w;
  }
  /** 가운데 정렬 글자(창 가장자리에서 잘리지 않도록 가로 위치를 밀어 넣음) */
  function slabel(b, x, y, str, o) {
    if (b.thumb) return;   // 모든 장면 보기의 작은 썸네일에서는 글자를 빼서 그림만 보이게 합니다
    const size = (o && o.size) || 11.5, w = textW(b, str, size) + 6, r = b.paneRect();
    b.stext(clamp(x, r.x + w / 2 + 3, r.x + r.w - w / 2 - 3), y, str, { baseline: 'middle', weight: 800, ...o, size, align: 'center' });
  }
  /** 점 옆 글자: 오른쪽에 자리가 없으면 왼쪽 */
  function sideLabel(b, x, y, str, o) {
    if (b.thumb) return;
    const size = (o && o.size) || 11.5, w = textW(b, str, size) + 6, r = b.paneRect();
    const right = x + 11 + w <= r.x + r.w - 4;
    b.stext(right ? x + 11 : x - 11, y, str, { baseline: 'middle', weight: 800, ...o, size, align: right ? 'left' : 'right' });
  }
  /** 위치/속도 그래프 바탕: 격자 · 축 · 눈금 · 이름표 */
  function graphAxes(b, s, title, color, end = T_MAX) {
    const ky = b.ky;
    if (s.grid) b.grid({ step: 0.5, majorEvery: 2, stepY: intStep(ky, 22) });
    b.axes({ tickStep: 1, tickStepY: intStep(ky, 30), xLabel: false, yLabel: false });
    const r = b.paneRect(), org = b.toS(0, 0);
    if (b.thumb) return null;
    b.stext(org.x + 9, r.y + 14, title, { color, size: 12.5, align: 'left', baseline: 'middle', weight: 800 });
    const timeLabelX = clamp(b.toS(end, 0).x + 7, r.x + 4, r.x + r.w - textW(b, 't(초)', 11.5 * b._ts(), 700) - 4);
    b.stext(timeLabelX, org.y + 11, 't(초)', { color: 'muted', size: 11.5, align: 'left', baseline: 'middle', weight: 700 });
    return [org.x + 7, r.y + 5, org.x + 11 + textW(b, title, 12.5), r.y + 23];   // 이름표 자리(라벨이 피하도록)
  }
  const syncLine = (b, s) => {
    const on = s.step >= 3;
    b.vline(s.t, { color: 'amber', alpha: on ? 0.85 : 0.35, width: on ? 2.2 : 1.3, dash: true, ref: 't' });
  };
  // 끌 때는 1·1.5·2·3 근처에서 자석처럼 붙지만, 화살표 키(keydown)는 붙지 않아야 스냅 점에서 한 칸씩 벗어날 수 있습니다.
  const timeHandle = (b, s, id, snaps) => b.handle(id, [s.t, 0], { color: 'amber', r: 7, ref: 't', ariaLabel: '시각 t 표시점', priority: 1, drag: (w, e) => { if(same(w.x,s.t))return; s.t = e && e.type === 'keydown' ? +clamp(w.x, 0, T_MAX).toFixed(2) : snapT(w.x, snaps); } });
  /**
   * b.point 래퍼(라벨 자리 찾기): 먼저 그린 라벨·점과 겹치거나 오른쪽 도구 막대(수업 모드에서는 더 큼) 밑으로 들어가면
   * 같은 점의 다른 쪽(아래·왼쪽)으로 옮깁니다. 중요한 라벨부터 먼저 부르세요. 썸네일에서는 라벨 없이 점만 그립니다.
   *   pt(점, 옵션)           라벨 있는 점   pt.text(점, 글, 옵션)  자리를 잡는 글자   pt.avoid(점, 반지름)  피할 곳 등록
   */
  function makePt(b) {
    const lab = labRef();
    const rlim = b.W - (NARROW.matches || !lab ? 0 : lab.board.insets.right) - 6;
    const rects = [];
    const over = (r) => rects.reduce((a, k) => a + Math.max(0, Math.min(r[2], k[2]) - Math.max(r[0], k[0])) * Math.max(0, Math.min(r[3], k[3]) - Math.max(r[1], k[1])), 0);   // 겹친 넓이
    const dot = (q, r) => { const c = b.toS(q[0], q[1]); rects.push([c.x - r, c.y - r, c.x + r, c.y + r]); };
    const mir = (c, fx, fy) => ({ dx: fx ? -c.dx : c.dx, dy: fy ? -c.dy : c.dy, align: fx ? ((c.align || 'left') === 'left' ? 'right' : 'left') : c.align || 'left' });
    const pt = (q, o) => {
      if (b.thumb) return b.point(q, { ...o, label: null });
      if (o.label) {
        const c0 = b.toS(q[0], q[1]), sz = o.size || 12.5, w = textW(b, o.label, sz), hgt = sz * b.fs * 1.25;
        const rectOf = (c) => { const x0 = c.align === 'left' ? c0.x + c.dx : c0.x + c.dx - w, y = c0.y + c.dy; return [x0 - 2, y - hgt / 2, x0 + w + 2, y + hgt / 2]; };
        const inside = (r) => r[0] >= 6 && r[2] <= rlim;
        const far = (c) => ({ ...c, dy: c.dy * 2 });   // 같은 쪽에서 한 칸 더 멀리
        const cands = [mir(o, 0, 0), mir(o, 0, 1), far(mir(o, 0, 0)), far(mir(o, 0, 1)), mir(o, 1, 0), mir(o, 1, 1)];
        const score = (c) => over(rectOf(c)) + cands.indexOf(c) * 40;   // 겹친 넓이 + 처음 자리에서 멀어질수록 벌점(살짝 닿는 정도는 그대로 둠)
        const okc = cands.filter((c) => inside(rectOf(c)));
        const pick = (okc.length ? okc : cands).reduce((a, c) => (score(c) < score(a) ? c : a));
        rects.push(rectOf(pick));
        o = { ...o, dx: pick.dx, dy: pick.dy, align: pick.align };
      }
      dot(q, (o.r || 5) + 3);
      return b.point(q, o);
    };
    pt.avoid = (q, r) => dot(q, r);
    pt.block = (r) => { if (r) rects.push(r); };
    pt.text = (q, str, o) => {
      if (b.thumb) return;
      const c0 = b.toS(q[0], q[1]), w = textW(b, str, (o && o.size) || 11.5), hgt = ((o && o.size) || 11.5) * b.fs * 1.25;
      rects.push([c0.x - w / 2, c0.y - hgt / 2, c0.x + w / 2, c0.y + hgt / 2]);
      b.text(q, str, o);
    };
    return pt;
  }
  /** 부호가 일정한 구간마다 v(t)와 t축 사이(또는 두 속도 사이)를 칠합니다: 전진·앞섬 = rose, 후진·뒤짐 = sky */
  function fillLeg(b, leg, top, bottom) {
    const n = Math.max(3, Math.ceil((leg.b - leg.a) / 0.025));
    const up = [], dn = [];
    for (let i = 0; i <= n; i++) {
      const t = leg.a + ((leg.b - leg.a) * i) / n;
      up.push([t, top(t)]);
      dn.push([t, bottom(t)]);
    }
    b.path(up.concat(dn.reverse()), { close: true, fill: leg.dir > 0 ? 'rose' : 'sky', fillAlpha: 0.3, color: null, ref: 'area' });
  }

  /* ---------- 5. 수직선 트랙 ---------- */
  /** 트랙 창에 눈금·수직선을 그리고 위치→가로 좌표 함수를 돌려줍니다(범위 밖의 점은 끝에 붙임). mini: 작은 화면용(글자는 눈금뿐). */
  function trackBase(b, cfg, mini) {
    const c = b.ctx, r = b.paneRect('track'), F = b.fs;
    const vb=b.viewBox(), x0=vb.x0+.08*(vb.x1-vb.x0), x1=vb.x1-.08*(vb.x1-vb.x0);
    const to = (pos) => x0 + ((clamp(pos, cfg.lo, cfg.hi) - cfg.lo) / (cfg.hi - cfg.lo)) * (x1-x0);
    const pxUnit = ((x1-x0) * b.k) / (cfg.hi - cfg.lo);
    const st = [1, 2, 5, 10].find((v) => v * pxUnit >= 26) || 20;
    const ticks = [];
    for (let v = Math.ceil(cfg.lo / st) * st; v <= cfg.hi; v += st) ticks.push(v);
    c.save();
    b.clip();
    const U = (px) => px / b.ky;
    b.seg([x0, 0], [x1, 0], { color: 'ink', alpha: 0.55, width: 2.2 });
    ticks.forEach((v) => b.seg([to(v), -U(5)], [to(v), U(5)], { color: v === 0 ? 'amber' : 'ink', alpha: v === 0 ? 1 : 0.5, width: v === 0 ? 2.6 : 1.4 }));
    c.restore();
    const D = mini ? { tick: 13, lane0: 7, laneStep: 5, arrow: 24, dot: 6.5 }
      : NARROW.matches ? { tick: 14, lane0: 10, laneStep: 6, arrow: 22, vlab: 35, name: 30, gap: 31, dot: 8 }
      : { tick: 17, lane0: 10, laneStep: 6, arrow: 27, vlab: 40, name: 35, gap: 34, dot: 8 };
    return { to, U, r, F, ticks, wideOrigin: st * pxUnit >= 44, D, mini };
  }
  function trackTicks(b, T, ly) {
    if (b.thumb) return;
    T.ticks.forEach((v) => {
      const sx = b.toS(T.to(v), 0).x;
      b.stext(sx, ly, v === 0 ? (T.wideOrigin && !T.mini ? '원점(0)' : '0') : fmt(v, 0), { color: v === 0 ? 'amber' : 'muted', size: 10.5, weight: v === 0 ? 800 : 700, baseline: 'middle' });
    });
  }
  const trackTitle = (b, str) => { if (!b.thumb && !NARROW.matches) b.stext(b.paneRect('track').x + 10, b.paneRect('track').y + 12, str, { color: 'muted', size: 11, align: 'left', baseline: 'middle', weight: 700 }); };
  function drawTrackSingle(b, s, cfg, V, mini) {
    const { x, v: vel, m } = V;
    const T = trackBase(b, cfg, mini), c = b.ctx;
    const { to, U, F, D } = T;
    const px = to(x), off = x > cfg.hi ? 1 : x < cfg.lo ? -1 : 0;
    c.save();
    b.clip();
    // 방향이 바뀔 때마다 궤적을 한 칸씩 위로 쌓습니다: 전진 = rose, 후진 = sky, 지금 구간이 가장 진하게
    m.legs.forEach((leg, i) => {
      const lane = U((D.lane0 + D.laneStep * (m.legs.length - 1 - i)) * F);
      b.seg([to(leg.x0), lane], [to(i === m.legs.length - 1 ? x : leg.x1), lane], { color: leg.dir > 0 ? 'rose' : 'sky', alpha: i === m.legs.length - 1 ? 1 : 0.7, width: mini ? 3 : 3.5, ref: 'x' });
    });
    // 속도 화살표
    const alen = clamp(vel * 10, NARROW.matches ? -45 : -65, NARROW.matches ? 45 : 65);
    if (!same(vel,0)) {
      const y0 = U(D.arrow * F), tip = px + alen / b.k, d = alen > 0 ? 1 : -1;
      const col = vel > 0 ? 'rose' : 'sky';
      b.seg([px, y0], [tip, y0], { color: col, width: 2.8, ref: 'v' });
      b.seg([tip, y0], [tip - (d * 7) / b.k, y0 + U(4)], { color: col, width: 2.8, ref: 'v' });
      b.seg([tip, y0], [tip - (d * 7) / b.k, y0 - U(4)], { color: col, width: 2.8, ref: 'v' });
    }
    b.point([px, 0], { color: 'amber', r: D.dot, ref: 'x' });
    c.restore();
    const ly = b.toS(0, 0).y;
    trackTicks(b, T, ly + D.tick * F);
    if (mini) return;   // 작은 화면: 값은 아래 두 그래프의 라벨과 상태 배지가 알려 줍니다
    if (!same(vel,0)) slabel(b, b.toS(px + alen / b.k / 2, 0).x, ly - D.vlab * F, `v≈${fmt(vel, 3)} ${vel > 0 ? '→(전진)' : '←(후진)'}`, { color: vel > 0 ? 'rose' : 'sky' });
    else slabel(b, b.toS(px, 0).x, ly - (D.vlab - 2) * F, '순간 정지 (v = 0)', { color: 'amber' });
    slabel(b, b.toS(px, 0).x, ly + D.name * F, `점 P (x ≈ ${fmt(x,3)})${off > 0 ? ' →' : off < 0 ? ' ←' : ''}`, { color: 'amber' });
    trackTitle(b, '수직선 위의 점 P');
  }
  function drawTrackPair(b, s, cfg, V, mini) {
    const { xp, xq } = V;
    const T = trackBase(b, cfg, mini), c = b.ctx;
    const { to, U, F, D } = T;
    const pP = to(xp), pQ = to(xq);
    const dy = mini ? 7 : 9, gy = mini ? 16 : 21, r = mini ? 5.5 : 6.5;
    c.save();
    b.clip();
    b.seg([pP, U(gy * F)], [pQ, U(gy * F)], { color: 'rose', width: 3, glow: true, ref: 'gap' });
    b.seg([pP, U((gy - 5) * F)], [pP, U((gy + 5) * F)], { color: 'rose', width: 2, ref: 'gap' });
    b.seg([pQ, U((gy - 5) * F)], [pQ, U((gy + 5) * F)], { color: 'rose', width: 2, ref: 'gap' });
    b.point([pP, U(dy * F)], { color: 'amber', r, ref: 'P' });
    b.point([pQ, -U(dy * F)], { color: 'sky', r, ref: 'Q' });
    c.restore();
    const ly = b.toS(0, 0).y;
    trackTicks(b, T, ly + (mini ? 20 : D.tick + 2) * F);
    if (mini) return;
    slabel(b, b.toS((pP + pQ) / 2, 0).x, ly - D.gap * F, `간격 |x_P − x_Q| ≈ ${fmt(Math.abs(xp - xq),3)}`, { color: 'rose' });
    sideLabel(b, b.toS(pP, 0).x, ly - 9 * F, `P(${fmt(xp)})${xp > cfg.hi ? ' →' : xp < cfg.lo ? ' ←' : ''}`, { color: 'amber' });
    slabel(b, b.toS(pQ, 0).x, ly + (D.name + 1) * F, `Q(${fmt(xq)})${xq > cfg.hi ? ' →' : xq < cfg.lo ? ' ←' : ''}`, { color: 'sky' });
    trackTitle(b, '수직선 위의 두 점 P, Q');
  }

  /* ---------- 6. 장면 1·2·3·5: 점 하나 (위치 x(t), 속도 v(t)) ---------- */
  function drawSingle(b, s, V, cfg) {
    const { p, m, x, v: vv } = V;
    const t = s.t, id = cfg.id, end=V.T||T_MAX, c = b.ctx, nw = NARROW.matches;   // nw: 휴대폰에서는 라벨을 줄여 겹침을 막습니다
    const pt = makePt(b);
    const turns = turnsOf(p, end), turnStage=id==='disp'?1:2;
    const lay = layoutOf(s);
    // (1) 수직선 트랙
    if (lay.track) {
      paneBg(b, 'track', 0.3, false);
      if (s.step >= 1) drawTrackSingle(b, s, {...cfg,...V.trackRange}, V, lay.mini);
    }
    // (2) 위치 x(t)
    paneBg(b, 'main', 0, true);
    c.save();
    b.clip();
    const tx = graphAxes(b, s, '위치 x(t)', 'ink',end);
    b.plot((u) => posX(u, p), { from: 0, to: end, color: 'ink', width: 3, glow: true, ref: 'x' });
    syncLine(b, s);
    c.restore();
    b.use('main');
    pt.block(tx);
    if(s.step>=turnStage) turns.forEach((tt) => {
      const xv = posX(tt, p), isMin = tt > 1;
      if (vis(b, xv)) pt([tt, xv], { color: 'red', r: 5.5, ref: 'x', label: same(t,tt) || (nw && turns.length > 1) ? null : `${isMin ? '극소' : '극대'}·방향 전환 (${timeText(tt)})`, dx: 10, dy: isMin ? 16 : -16 });
    });
    if (s.step>=3&&(id === 'origin' || id === 'trap')) pt([3, 0], { hollow: true, color: 'green', r: 5.5, ref: 'x', label: same(t,3) ? null : id === 'origin' ? '원점 복귀 (t=3)' : nw ? '원점 통과 (전환 아님)' : '원점 통과일 뿐 (방향 전환 아님)', dx: -10, dy: -16, align: 'right' });
    if (s.step>=2&&id === 'turn' && p===0) pt([1, posX(1, p)], { hollow: true, color: 'violet', r: 5.5, ref: 'x', label: nw ? '수평 접선 · 극값 아님' : 'x(t)는 계속 증가 · 극값 아님', dx: 10, dy: 16 });
    pt.avoid([t, 0], 9);
    if (vis(b, x)) pt([t, x], { color: 'amber', r: 6.5, ref: 'x', label: `현재 위치 x≈${fmt(x,3)}`, dx: 12, dy: -12 });
    timeHandle(b, s, 'T',turns);
    // (3) 속도 v(t)
    if (lay.deriv) {
      paneBg(b, 'deriv', 0.3, true);
      c.save();
      b.clip();
      const tv = graphAxes(b, s, '속도 v(t)', 'sky',end);
      if (s.step >= 2) m.legs.forEach((leg) => fillLeg(b, leg, (u) => velV(u, p), () => 0));
      b.plot((u) => velV(u, p), { from: 0, to: end, color: 'sky', width: 2.8, glow: true, ref: 'v' });
      syncLine(b, s);
      c.restore();
      b.use('deriv');
      pt.block(tv);
      if (s.step >= 3 && !nw && !b.thumb) {
        m.legs.forEach((leg) => {
          const len = Math.abs(leg.x1 - leg.x0);
          if (len < 0.3) return;
          const mid = (leg.a + leg.b) / 2;
          pt.text([mid, velV(mid, p) / 2], `${leg.dir > 0 ? '전진 +' : '후진 −'}${fmt(len)}`, { color: leg.dir > 0 ? 'rose' : 'sky', size: 11.5, weight: 800, baseline: 'middle', ref: 'area' });
        });
      }
      if(s.step>=turnStage) turns.forEach((tt) => pt([tt, 0], { hollow: true, color: 'red', r: 5.5, ref: 'v', label: same(t,tt) || (nw && turns.length > 1) ? null : turns.length > 1 ? 'v=0' : 'v=0 · 부호 변화', dx: turns.length > 1 ? -10 : 10, dy: turns.length > 1 ? -16 : 16, align: turns.length > 1 ? 'right' : 'left' }));
      const v1 = velV(1, p);
      const vertex = id === 'origin' ? '[0,2] 속력 최대 |v|=3' : id === 'turn' && p===0 ? (s.step>=2?'v=0 · 양쪽 v>0':'v=0 · 접점') : '가속도 a(1)=0';
      if (s.step>=1&&vis(b, v1)) pt([1, v1], { color: 'violet', r: 5, ref: 'a', label: vertex, dx: -8, dy: 18, align: 'right' });
      pt.avoid([t, 0], 9);
      if (vis(b, vv)) pt([t, vv], { color: 'amber', r: 6.5, ref: 'v', label: `현재 속도 v≈${fmt(vv,3)}`, dx: 12, dy: -12 });
      timeHandle(b, s, 'Tv',turns);
    }
    b.use('main');
  }

  /* ---------- 7. 장면 4: 두 점 P, Q 추격전 ---------- */
  function drawPair(b, s, V, cfg) {
    const { k, xp, xq, t1, t2 } = V;
    const t = s.t, end=V.T||T_MAX, c = b.ctx;
    const pt = makePt(b);
    const snaps = [t1, t2].filter((q) => q > 0 && q <= T_MAX);
    const lay = layoutOf(s);
    if (lay.track) {
      paneBg(b, 'track', 0.3, false);
      if (s.step >= 1) drawTrackPair(b, s, {...cfg,...V.trackRange}, V, lay.mini);
    }
    paneBg(b, 'main', 0, true);
    c.save();
    b.clip();
    const tx = graphAxes(b, s, '위치 x(t)', 'ink',end);
    b.plot(xP4, { from: 0, to: end, color: 'amber', width: 2.8, glow: true, ref: 'P' });
    b.plot((u) => xQ4(u, k), { from: 0, to: end, color: 'sky', width: 2.8, glow: true, ref: 'Q' });
    b.seg([t, xp], [t, xq], { color: 'rose', width: 2.8, glow: true, ref: 'gap' });
    syncLine(b, s);
    c.restore();
    b.use('main');
    pt.block(tx);
    if (s.step>=3&&t2 > 0 && t2 <= end && vis(b, xQ4(t2, k))) pt([t2, xQ4(t2, k)], { hollow: true, color: 'rose', r: 6, ref: 'gap', label: same(t,t2) || NARROW.matches ? null : `첫 재회 (${timeText(t2)})`, dx: -10, dy: -16, align: 'right' });
    pt.avoid([t, 0], 9);
    if (vis(b, xp)) pt([t, xp], { color: 'amber', r: 6.5, ref: 'P', label: `현재 x_P≈${fmt(xp,3)}`, dx: 12, dy: -12 });
    if (vis(b, xq)) pt([t, xq], { color: 'sky', r: 6.5, ref: 'Q', label: `현재 x_Q≈${fmt(xq,3)}`, dx: 12, dy: 18 });
    timeHandle(b, s, 'T', snaps);
    if (lay.deriv) {
      paneBg(b, 'deriv', 0.3, true);
      c.save();
      b.clip();
      const tv = graphAxes(b, s, '속도 v(t)', 'sky',end);
      if (s.step >= 2) gapLegs(t, k).forEach((leg) => fillLeg(b, leg, vP4, (u) => vQ4(u, k)));
      b.plot(vP4, { from: 0, to: end, color: 'amber', width: 2.8, glow: true, ref: 'P' });
      b.plot((u) => vQ4(u, k), { from: 0, to: end, color: 'sky', width: 2.8, glow: true, ref: 'Q' });
      syncLine(b, s);
      c.restore();
      b.use('deriv');
      pt.block(tv);
      if (s.step>=2&&t1 > 0 && t1 <= end) pt([t1, vQ4(t1, k)], { color: 'rose', r: 6, ref: 'gap', label: NARROW.matches ? '첫 재회 전 간격 최대' : `첫 재회 전 간격 최대 (${timeText(t1)})`, dx: -10, dy: -16, align: 'right' });
      if (vis(b, vP4(t))) pt([t, vP4(t)], { color: 'amber', r: 5, ref: 'P' });
      if (vis(b, vQ4(t, k))) pt([t, vQ4(t, k)], { color: 'sky', r: 5, ref: 'Q' });
      timeHandle(b, s, 'Tv', snaps);
    }
    b.use('main');
  }

  /* ---------- 8. 장면 데이터 만들기 ---------- */
  const secs = (m) => examData[m].targetTime;
  const problemOf = (m, key) => {
    const d = examData[m];
    return { tag: d.tag, time: secs(m), text: d.question, answer: d.answerBadge, snap: () => ({ t: d.snap.t, ...(key ? { [key]: d.snap.param } : {}), dual: d.snap.dualView }) };
  };
  const solutionOf = (m) => ({
    standardTitle: '식과 부호로 확인', standardTag: '정석 풀이',
    quickTitle: '그래프의 구조로 계산 줄이기', quickTag: '부호·넓이·대칭',
    standard: examData[m].textbook,
    quick: examData[m].shortcut
  });
  const enterOf = (m, key) => (s) => {
    const sn = examData[m].snap;
    s.t = sn.t;
    if (key) s[key] = sn.param;
    s.dual = sn.dualView;
  };
  const actionsOf = () => [
    { id: 'dual', icon: 'split', label: (s) => (s.dual ? 'x(t)·v(t) 함께 보기 켜짐' : 'x(t)·v(t) 함께 보기'), on: (s) => s.dual, run: (s) => { s.dual = !s.dual; } },
    { id: 'play', play: true, icon: (s) => (s.playing ? 'pause' : 'play'), label: (s) => (s.playing ? '일시 정지' : '주행 재생'), on: (s) => s.playing, run: (s) => { if (!s.playing && s.t >= T_MAX-.1) s.t = 0; s.playing = !s.playing; } }
  ];
  const tick = (s, dt) => {
    if (!s.playing) return false;
    s.t += dt * 1.0;                 // 원본: 한 바퀴 약 3.4초
    if (s.t > T_MAX) s.t = 0;
    return true;
  };
  const atT = (tt) => ({ label: `t = ${tt}`, set: { t: tt }, on: (s) => same(s.t,tt) });
  const tPreset = (tt, text, color) => ({ ...atT(tt), label: `t = ${tt} 관찰`, color });

  /** 점 하나 장면(1·2·3·5)의 view: 값 · 칩 · 상태 · 실시간 값 · 하단 띠 */
  function viewSingle(cfg) {
    return (s) => {
      const p = cfg.usesP ? s.p : 1;
      const t = s.t, x = posX(t, p), v = velV(t, p), a = accA(t), m = motion(t, p);
      const chips = cfg.usesP
        ? [{ k:'탐구 모델',tex: 'x(t)=t^3-3t^2+3(1-p)t', color: 'ink' }, { tex: 'v(t)=3(t-1)^2-3p', color: 'sky' }]
        : [{ tex: 'x(t) = t^3 - 3t^2', color: 'ink' }, { tex: 'v(t) = 3t^2 - 6t,\\; a(t) = 6t - 6', color: 'sky' }];
      const back = m.back, fwd = m.fwd;
      return {
        p, x, v, a, m, chips,
        status: cfg.status(s, { p, t, x, v, m }),
        readouts: [
          { label: '관찰 시각 t', value: `≈ ${fmt(t,4)} 초`, color: 'amber', ref: 't' },
          { label: '위치 x(t)', value: `≈ ${fmt(x,4)}`, color: 'ink', ref: 'x' },

  /* ---------- 11. 변형 문제 (2026-11): 문제·정리 탭 ----------
     같은 학습 포인트가 성립하는 운동 모델에서만 숫자를 바꿉니다. 정리·문제 탭의 그림은 위치 x(t)·속도 v(t) 그래프
     (가로가 시간이라 이 실험실만 가로·세로 배율을 따로 씁니다)이고, 문제 탭은 지문의 그래프만, 정리 탭은 단계마다 값과 보조선을 드러냅니다.
       1: v = a t(t − b), t = 0 → 3b/2  (전진 넓이 = 후진 넓이 → 변위 0, 이동거리 = 두 넓이의 합)
       2: v₁ = 3[(t − c)² − d] (부호가 바뀌는 근) / v₂ = 3(t − c)² (접하기만 하는 근)
       3: v = a t(t − b)  (가속도 0 ↔ 최대 속력, v = 0 ↔ 가장 먼 점, x = 0 ↔ 원점 복귀)
       4: v_P = a t(b − t), v_Q = c t  (v_P = v_Q ↔ 거리 최대, 넓이가 같아지면 다시 만남)
       5: x = t³ − 3c t², v = x′  (위치 그래프의 극소 = 속도 그래프의 부호 변화 = 방향 전환, x = 0 은 방향 전환이 아님) */
  const mvTs = (T) => (T <= 4 ? 1 : T <= 8 ? 2 : 5);
    const mvTex = (a, b) => cxPoly([a, b, 0]).replace(/x/g, 't');   // a t² + b t 꼴
  const mvRange = (fns, T, pad) => {
    let lo = 0, hi = 0;
    fns.forEach((f) => { for (let i = 0; i <= 120; i++) { const y = f((T * i) / 120); lo = Math.min(lo, y); hi = Math.max(hi, y); } });
    const sp = Math.max(hi - lo, 1e-6);
    return [lo - pad * sp - 0.02 * sp, hi + pad * sp + 0.02 * sp];
  };
  const mvClip = (f, T) => (t) => (t < -1e-9 || t > T + 1e-9 ? NaN : f(t));
  // 현재 변형의 화면 설명(창 개수와 세로 범위): 장면마다 spec(v, step) 을 줍니다
  const mvSpecNow = (M, state) => { const l = window.lab; return M.spec(M.vary.cur(),l?cxStep(l,state||l.s):0); };
  const mvPanes = (M) => (state) => {
    const sp = mvSpecNow(M,state), lab = labRef(), H = (lab && lab.board.H) || 420, ins = lab ? lab.board.insets : { top: 0, bottom: 0 };
    const st=lab?cxStep(lab,state||lab.s):0;
    const head = Math.max(ins.top || 0, 6) / H, foot = (ins.bottom || 0) / H;
    const track=st>=1&&M.id!==2&&(M.id!==3||st>=2)&&H*(1-head-foot)>=440?64/H:0, rest=1-head-foot-track;
    const list = [{ id: 'head', frac: head }];
    if(track)list.push({id:'track',frac:track,focusY:Y_TRACK});
    if (sp.showX) {
      const h1 = rest * 0.5;
      list.push({ id: 'main', frac: h1, focusY: sp.xr }, { id: 'deriv', frac: rest - h1, focusY: sp.vr });
    } else list.push({ id: 'main', frac: rest, focusY: sp.vr });
    if (foot > 0.001) list.push({ id: 'foot', frac: foot });
    return list;
  };
  function mvFrame(b, s, lab, M) {
    const v = M.vary.cur(), st = cxStep(lab, s), sp = M.spec(v, st), key = 'mv' + M.id + v.sid + (sp.showX ? 'X' : 'V');
    cxFocus(b, key, { x: [-0.16 * sp.T, 1.24 * sp.T], y: sp.vr });
    if(b.panes&&b.panes.some(p=>p.id==='track')) mvTrack(b,M,v,st);
    const pane = (pid, title, color, body, last) => {
      b.use(pid);
      const r = b.paneRect(pid), c = b.ctx;
      c.save();
      b.clip();
      if (s.grid) b.grid({ step: mvTs(sp.T) / 2, majorEvery: 2, stepY: intStep(b.ky, 22) });
      b.axes({ tickStep: mvTs(sp.T), tickStepY: intStep(b.ky, 30), xLabel: false, yLabel: false });
      body();
      c.restore();
      if (!b.thumb) {
        const org = b.toS(0, 0);
        b.stext(r.x + 10, r.y + 14, title, { color, size: 12.5, align: 'left', baseline: 'middle', weight: 800 });
        if (last) b.stext(b.toS(sp.T * 1.1, 0).x, org.y + 12, 't(초)', { color: 'muted', size: 12, align: 'left', baseline: 'middle', weight: 700 });
      }
      c.save(); c.strokeStyle = b.color('sky', 0.5); c.lineWidth = 1.5; c.beginPath(); c.moveTo(r.x, r.y + 0.5); c.lineTo(r.x + r.w, r.y + 0.5); c.stroke(); c.restore();
    };
    if (sp.showX) { pane('main', sp.xTitle || 'x(t) 위치', 'ink', () => sp.x(b), false); pane('deriv', sp.vTitle || 'v(t) 속도', 'sky', () => sp.v(b), true); }
    else pane('main', sp.vTitle || 'v(t) 속도', 'sky', () => sp.v(b), true);
    if (sp.showX) {   // 두 창의 같은 시각을 잇는 세로선
      (sp.sync || []).forEach(([t, col]) => {
        b.use('main'); const r1 = b.paneRect('main'); b.use('deriv'); const r2 = b.paneRect('deriv');
        const sx = b.toS(t, 0).x, c = b.ctx;
        c.save(); c.setLineDash([5, 5]); c.strokeStyle = b.color(col, 0.55); c.lineWidth = 1.5; c.beginPath(); c.moveTo(sx, r1.y + 6); c.lineTo(sx, r2.y + r2.h - 6); c.stroke(); c.restore();
      });
    }
  }
  const mvLabel = (b, p, str, o) => cxTag(b, p, str, { size: 12, ...o });
  const mvPoint = (b,p,o) => { b.point(p,{...o,label:null}); if(o.label)mvLabel(b,p,o.label,{...o,align:o.align||'left'}); };
  const mvValue = (x) => { const q=cxRatOf(x); return q ? (q.d===1?String(q.n):`${q.n}/${q.d}`) : `≈${cxN(x,4)}`; };
  const mvNote = (b, pid, y, str, color) => { b.use(pid); const r = b.paneRect(pid); b.stext(r.x + 10, r.y + y, str, { color, size: 12.5, align: 'left', baseline: 'middle', weight: 800 }); };
  function mvTrack(b,M,v,st) {
    paneBg(b,'track',.3,false);

      const t=st>=3?v.t2:st>=2?v.t1:v.t2*.4, hi=Math.max(0,v.xP(v.t2),v.xQ(v.t2),v.xP(Math.min(v.b,v.t2)));
      drawTrackPair(b,{}, {lo:-Math.max(.5,hi*.15),hi:hi+Math.max(.5,hi*.2)}, {xp:v.xP(t),xq:v.xQ(t)},true);

    }

    const t=M.id===1||st>=3?end:turn, cuts=[0,...(turn<t?[turn]:[]),t];
    const legs=cuts.slice(1).map((b,i)=>({a:cuts[i],b,dir:v.vf((cuts[i]+b)/2)>=0?1:-1,x0:v.xf(cuts[i]),x1:v.xf(b)}));
    drawTrackSingle(b,{}, {lo:-back-Math.max(.5,back*.15),hi:Math.max(.5,back*.25)}, {x:v.xf(t),v:v.vf(t),m:{legs}},true);
    mvNote(b,'track',12,`수직선 경로 · t=${mvValue(t)}`,'muted');
  }

  /* ===== 변형 1 · 변위와 이동거리 ===== */
  const MV1 = [[3, 2], [6, 1], [6, 2], [12, 1], [3, 4]];
  function mkM1(first, a, b) {
    const T = 1.5 * b, vf = (t) => a * t * (t - b), xf = (t) => a * (t * t * t / 3 - b * t * t / 2);
    return { first, a, b, T, vf, xf, S: a * b * b * b / 6 };
  }
  const varM1 = cxVarier((prev) => {
    if (!prev) return mkM1(true, 3, 2);
    let v; do { v = mkM1(false, ...cxPick(MV1)); } while (v.a === prev.a && v.b === prev.b);
    return v;
  });
  const vrM1 = [0, 0];
  const specM1 = (v, st) => (vrM1[1] = mvRange([mvClip(v.vf, v.T + 0.3)], v.T + 0.3, 0.2)[1], {
    T: v.T + 0.3, showX: st >= 1, vr: mvRange([mvClip(v.vf, v.T + 0.3)], v.T + 0.3, 0.2), xr: mvRange([mvClip(v.xf, v.T + 0.3)], v.T + 0.3, 0.22), sync: st >= 2 ? [[v.b, 'amber'], [v.T, 'green']] : [],
    x: (b) => {
      b.plot(mvClip(v.xf, v.T + 0.3), { color: 'ink', width: 3.2, glow: true });
      mvPoint(b,[v.b, v.xf(v.b)], { color: 'sky', r: 6, label: `방향 전환 (t=${cxN(v.b)}, x=${cxN(v.xf(v.b))})`, dx: 10, dy: 16 });
      mvPoint(b,[v.T, 0], { color: 'green', r: 6, label: `t=${cxN(v.T)}, x=0`, dx: -10, dy: -14, align: 'right' });
    },
    v: (b) => {
      if (st >= 2) {
        const leg = (t0, t1, col) => { const pts = [[t0, 0]]; for (let i = 0; i <= 40; i++) { const t = t0 + ((t1 - t0) * i) / 40; pts.push([t, v.vf(t)]); } pts.push([t1, 0]); b.poly(pts, { fill: col, fillAlpha: 0.3, color: null, ref: 'area' }); };
        leg(0, v.b, 'sky'); leg(v.b, v.T, 'rose');
        mvLabel(b, [v.b / 2, v.vf(v.b / 2) / 2], `후진 S₂ = ${cxN(v.S)}`, { color: 'sky' });
        mvLabel(b, [(v.b + v.T) / 2, v.vf((v.b + v.T) / 2) / 2], `전진 S₁ = ${cxN(v.S)}`, { color: 'rose' });
      }
      b.vline(v.T, { color: 'green', alpha: 0.7, width: 1.8, dash: true });
      mvLabel(b, [v.T, vrM1[1] * 0.82], `t = ${cxN(v.T)}`, { color: 'green', dx: -5, align: 'right' });
      b.plot(mvClip(v.vf, v.T + 0.3), { color: 'sky', width: 3, glow: true });
      if (st >= 1) mvPoint(b,[v.b, 0], { color: 'sky', r: 5.5, label: `t=${cxN(v.b)}`, dx: 8, dy: 16, align: 'left' });
      if (st >= 3) mvNote(b, 'deriv', 34, `Δx = S₁ − S₂ = 0   ·   D = S₁ + S₂ = ${cxN(2 * v.S)}`, 'amber');
    }
  });
  const vTex1 = (v) => `v(t) = ${mvTex(v.a, -v.a * v.b)}`;
  const text1 = (v) => (v.first ? examData[1].question() : `수직선 위를 움직이는 점 ${tex('P')}의 시각 ${tex('t \\; (t \\ge 0)')}에서의 속도가 ${tex(vTex1(v))} 이고 ${tex('t = 0')} 일 때 원점에서 출발한다. ${tex('t = 0')} 에서 ${tex('t = ' + cxNum(v.T))} 까지 점 ${tex('P')}의 위치의 변화량 ${tex('\\Delta x')}와 실제로 움직인 거리 ${tex('D')}를 각각 구하시오.`);
  const ans1 = (v) => (v.first ? examData[1].answerBadge() : `위치 변화량 ${tex('\\Delta x = 0')}, 움직인 거리 ${tex(`D = ${cxNum(2 * v.S)}`)}`);
  const steps1 = (v) => [
    `1단계 · 속도는 0<t<${v.b}에서 음수, t>${v.b}에서 양수입니다. 위치 그래프가 감소했다가 증가하는 모습과 점의 왕복 경로를 대응시킵니다.`,
    `2단계 · 속도 아래의 하늘색 후진 넓이 S₂와 분홍색 전진 넓이 S₁을 봅니다. 처음 위치로 복귀하므로 S₁=S₂이며, 포물선 넓이 S₂=ab³/6=${mvValue(v.S)}만 구하면 됩니다.`,
    `3단계 · 위치의 변화량은 부호를 살린 Δx=S₁−S₂=0이고, 실제 걸어간 길이는 D=S₁+S₂=${mvValue(2*v.S)}입니다. 적분을 두 번 계산하는 대신 같은 두 넓이를 이용합니다.`];
  const std1 = (v) => {
    if (v.first) return examData[1].textbook();
    return {
      steps: `① 위치의 변화량: ${tex(`\\Delta x = \\int_{0}^{${cxNum(v.T)}} (${mvTex(v.a, -v.a * v.b)})\\,dt = \\left[ ${cxPoly([v.a / 3, -v.a * v.b / 2, 0, 0]).replace(/x/g, 't')} \\right]_{0}^{${cxNum(v.T)}} = 0`)}<br/>
② 실제 움직인 거리는 ${tex('v(t) = 0')} 인 ${tex(`t = ${v.b}`)} 에서 구간을 쪼개어 절댓값 적분:<br/>
&nbsp;&nbsp;${tex(`D = \\int_{0}^{${v.b}} (-v(t))\\,dt + \\int_{${v.b}}^{${cxNum(v.T)}} v(t)\\,dt`)}<br/>
③ 각각 계산하면 ${tex(`${cxNum(v.S)} + ${cxNum(v.S)} = ${cxNum(2 * v.S)}`)} 입니다.`,
      warning: examData[1].textbook().warning
    };
  };
  const quick1 = (v) => {
    if (v.first) return examData[1].shortcut();
    return {
      steps: `① ${tex(`v(t) = ${v.a === 1 ? '' : v.a}t(t - ${v.b})`)} 에서 ${tex(`0 \\sim ${v.b}`)}초 동안 후진한 거리는 포물선과 ${tex('t')}축으로 둘러싸인 넓이 공식 ${tex('S = \\dfrac{|a|}{6}(\\beta - \\alpha)^3')} 으로 <strong class="text-sky-300">${tex(`S_2 = \\dfrac{${v.a}}{6}(${v.b} - 0)^3 = ${cxNum(v.S)}`)}</strong> 입니다.<br/>
② ${tex('x(t)=\\dfrac{a}{6}t^2(2t-3b)')}에서 ${tex(`t=3b/2=${cxNum(v.T)}`)}이면 ${tex('x(t)=0')}입니다. 따라서 전진한 거리도 똑같이 <strong class="text-pink-300">${tex(`S_1 = ${cxNum(v.S)}`)}</strong> 입니다.<br/>
③ 따라서 ${tex(`t = ${cxNum(v.T)}`)}초일 때 위치 변화량 <strong class="text-amber-300">${tex(`\\Delta x = -${cxNum(v.S)} + ${cxNum(v.S)} = 0`)}</strong>, 실제 움직인 거리 <strong class="text-emerald-300">${tex(`D = ${cxNum(v.S)} + ${cxNum(v.S)} = ${cxNum(2 * v.S)}`)}</strong> 입니다.`,
      highlight: examData[1].shortcut().highlight
    };
  };

  /* ===== 변형 2 · 운동 방향의 전환 판별 ===== */
  const MV2 = [[1, 1], [2, 1], [2, 4], [3, 1], [3, 4], [3, 9], [4, 4]];
  function mkM2(first, c, d) {
    const r = Math.sqrt(d), v1 = (t) => 3 * ((t - c) * (t - c) - d), v2 = (t) => 3 * (t - c) * (t - c);
    const roots = [c - r, c + r].filter((x) => x > 0);
    return { first, c, d, r, v1, v2, roots, n: roots.length, T: c + r + 1.3 };
  }
  const varM2 = cxVarier((prev) => {
    if (!prev) return mkM2(true, 1, 1);
    let v; do { v = mkM2(false, ...cxPick(MV2)); } while (v.c === prev.c && v.d === prev.d);
    return v;
  });
  const specM2 = (v, st) => ({
    T: v.T, showX: false, vr: mvRange([v.v1, v.v2], v.T, 0.18), vTitle: 'v(t) 속도 (두 경우)',
    v: (b) => {
      b.plot(mvClip(v.v2,v.T), { color: 'violet', width: 2.6, dash: true, ref: 'v2' });
      b.plot(mvClip(v.v1,v.T), { color: 'sky', width: 3.2, glow: true, ref: 'v1' });
      const vb = b.viewBox();
      cxTag(b, [v.T * 0.93, v.v1(v.T * 0.93)], 'v₁', { color: 'sky', size: 14, dx: -6, dy: -4, align: 'right' });
      cxTag(b, [v.T * 0.84, v.v2(v.T * 0.84)], 'v₂', { color: 'violet', size: 14, dx: -6, dy: -8, align: 'right' });
      if (st >= 1) {
        [v.c - v.r, v.c + v.r].forEach((x) => mvPoint(b,[x, 0], { color: 'sky', r: 5.5, ref: 'v1', label: x===0?'t=0 (출발)':`t=${cxN(x)}`, dx: x===0?8:x<v.c?-9:9, dy: 16, align: x===0?'left':x<v.c?'right':'left' }));
        mvPoint(b,[v.c, 0], { color: 'violet', r: 5.5, ref: 'v2', label: `t=${cxN(v.c)} (v₂ 접함)`, dx: 0, dy: -15, align: 'center' });
      }

        const cuts = [0, ...v.roots, v.T];
        for (let i = 0; i < cuts.length - 1; i++) sgn(cuts[i], cuts[i + 1], v.v1, v.v1((cuts[i] + cuts[i + 1]) / 2) > 0 ? 'v₁ > 0 (전진)' : 'v₁ < 0 (후진)');
        if(st===2) mvNote(b,'main',32,'v₂: + → 0 → + (양쪽 모두 전진)','violet');

        v.roots.forEach((x) => mvPoint(b,[x, 0], { color: 'green', r: 8, hollow: true, ref: 'turn' }));
        mvNote(b, 'main', 32, `v₁: 부호가 바뀌는 곳 ${v.n}번 → 방향 전환 ${v.n}번`, 'green');

  const v1Tex = (v) => `v_1(t) = 3(t${cxSub(v.c)})^2${v.d === 1 ? '-3' : '-' + 3 * v.d}`;

  const text2 = (v) => (v.first ? examData[2].question() : `수직선 위를 움직이는 점 ${tex('P')}의 속도가 ${tex(v1Tex(v))} 일 때와 ${tex(v2Tex(v))} 일 때, 출발 후(${tex('t > 0')}) 점 ${tex('P')}가 운동 방향을 바꾸는 횟수를 각각 구하시오.`);
  const ans2 = (v) => (v.first ? examData[2].answerBadge() : `${tex('v_1(t)')}는 ${tex(String(v.n))}번(${tex('t=' + v.roots.join(',\\; t='))}), ${tex('v_2(t)')}는 ${tex('0')}번 (방향 전환 없음!)`);
  const steps2 = (v) => [
    `1단계 · 두 속도 그래프가 t축과 만나는 후보를 표시합니다. v₁의 두 근은 ${v.c-v.r}, ${v.c+v.r}이고 v₂는 t=${v.c}에서 접합니다. 출발 경계 t=0은 출발 후 방향 전환에 세지 않습니다.`,

    `3단계 · t>0인 부호 변화만 세면 v₁은 ${v.n}번, v₂는 0번입니다. 속도가 0이라는 조건만 세는 계산을 부호 비교로 보완합니다.`];
  const std2 = (v) => {
    if (v.first) return examData[2].textbook();

    `2단계 · t=${v.tt}에서 위치가 감소에서 증가로 바뀌어 극소입니다. 수평 접선이라는 사실과 앞뒤 운동 방향이 바뀐다는 사실을 함께 확인합니다.`,
    `3단계 · 같은 시각의 속도는 음수에서 0을 지나 양수로 바뀝니다. t=${3*v.c}에서는 위치만 0이고 속도는 양수이므로 원점을 통과해도 방향은 바뀌지 않습니다.`];
  const std5 = (v) => {
    if (v.first) return examData[5].textbook();
    return {
      steps: `① 위치와 속도는 ${tex("v(t)=x'(t)")}로 연결된다. 따라서 방향 전환은 위치 그래프의 극값 중에서도 실제로 감소에서 증가(또는 증가에서 감소)로 바뀌는 점이다.<br/>
② 여기서는 ${tex(`v(t)=${v.a === 1 ? '3' : 3 * v.a}t(t-${cxNum(v.tt)})`)}이고 ${tex(`0<t<${cxNum(v.tt)}`)}에서 음수, ${tex(`t>${cxNum(v.tt)}`)}에서 양수다. 그러므로 위치는 ${tex(`t=${cxNum(v.tt)}`)}에서 극소 ${tex(`x(${cxNum(v.tt)})=${cxNum(v.xmin)}`)}를 갖고 방향을 바꾼다. ${tex('x(t)=0')}인 ${tex(`t=${cxNum(3 * v.c)}`)}은 원점 통과일 뿐 방향 전환점이 아니다.<br/>
③ 속도 그래프에서는 ${tex(`t=${cxNum(v.tt)}`)}에서만(${tex('t>0')} 범위에서) ${tex('t')}축을 지나며 부호가 바뀐다. ${tex('t=0')}은 출발 경계다.`,

  const quick5 = () => examData[5].shortcut();

  const MVM = {
    1: { id: 1, vary: varM1, spec: specM1, text: text1, answer: ans1, steps: steps1, std: std1, quick: quick1 },
    2: { id: 2, vary: varM2, spec: specM2, text: text2, answer: ans2, steps: steps2, std: std2, quick: quick2 },
    3: { id: 3, vary: varM3, spec: specM3, text: text3, answer: ans3, steps: steps3, std: std3, quick: quick3 },

    5: { id: 5, vary: varM5, spec: specM5, text: text5, answer: ans5, steps: steps5, std: std5, quick: quick5 }
  };
  // 실제 극값으로 조작 중인 점과 경로 전체를 담습니다. 시간·위치·속도는 각 축의 눈금으로 읽습니다.
  function exploreGeometry(m,s) {
    const T=Math.max(3.3,s.t+.15,m===4?3-1.5*s.k+.15:0), x=[],v=[];
    if(m===4){
      [0,T,...(2<T?[2]:[])].forEach(t=>x.push(xP4(t),xQ4(t,s.k)));
      [0,T,1].forEach(t=>v.push(vP4(t),vQ4(t,s.k)));
    }else{
      const p=m===2?s.p:1;
      [0,T,...turnsOf(p,T)].forEach(t=>x.push(posX(t,p)));
      [0,T,1].forEach(t=>v.push(velV(t,p)));
    }
    const padded=(values,pad,min)=>{const lo=Math.min(...values),hi=Math.max(...values),gap=Math.max(min,(hi-lo)*pad);return [lo-gap,hi+gap];};
    const xr=padded(x,.16,.7),vr=padded(v,.15,1),tr=padded(x,.12,.7);
    return {T,xr,vr,trackRange:{lo:tr[0],hi:tr[1]}};
  }
  function motionExploreSteps(m,s) {
    if(m===1)return [
      '1단계 · 현재 시각까지 위치가 감소한 구간과 증가한 구간을 봅니다. 감소는 왼쪽 이동, 증가는 오른쪽 이동입니다.',
      '2단계 · 속도가 음수인 하늘색 넓이는 후진한 거리, 양수인 분홍색 넓이는 전진한 거리입니다. 방향이 바뀌는 시각에서만 구간을 나눕니다.',
      '3단계 · 변위는 전진−후진, 이동거리는 전진+후진입니다. 현재 시각의 값으로 계산하므로 원점으로 돌아오는 때 외에는 두 부호 넓이가 같지 않습니다.'
    ];
    if(m===2)return [
      `1단계 · 현재 탐구 모델은 v(t)=3(t−1)²−3p, p=${s.p}입니다. 그래프가 t축과 만나는 후보와 출발 경계 t=0을 구별합니다.`,
      s.p>0?'2단계 · 두 단근 1−√p, 1+√p 전후에서 부호가 바뀝니다. t>0인 근만 실제 출발 후 방향 전환에 포함합니다.':s.p===0?'2단계 · p=0이면 t=1이 중근입니다. 양쪽 속도는 모두 양수여서 위치는 계속 증가하며 수평 접선을 가져도 극값이 아닙니다.':'2단계 · p<0이면 포물선 전체가 t축 위에 있습니다. 속도가 항상 양수이므로 점은 계속 전진합니다.',
      `3단계 · 현재 모델의 0<t<${T_MAX}에서 방향 전환은 ${turnsOf(s.p,T_MAX).length}번입니다. p=0과 그 양옆, p=1에서 출발 경계와 근의 중복도가 바뀌는 이유를 비교합니다.`
    ];
    if(m===3)return [
      '1단계 · 문제의 속력 비교 구간은 [0,2]입니다. 이 구간에서는 |v|=−v=3−3(t−1)²이므로 끝점의 0과 꼭짓점의 3을 비교합니다.',
      '2단계 · 문제의 원점 거리 비교 구간은 [0,3]입니다. 위치가 감소했다가 증가하고 양 끝은 원점이므로 t=2의 x=−4에서 가장 멉니다.',
      '3단계 · 위치 x=t²(t−3)의 양의 영점은 3입니다. 탐구 시간을 3 이후로 늘리면 위치와 속력이 다시 커지므로 앞의 최댓값을 더 넓은 구간에 그대로 적용하지 않습니다.'

      '1단계 · 현재 k=2에서는 출발 직후부터 Q의 속도가 P보다 큽니다. 같은 시각의 위치를 비교합니다.',
      '2단계 · 상대속도 v_P−v_Q=−3t²<0이므로 위치 차는 계속 작아집니다. 양의 시각에서 상대속도의 부호 변화가 없습니다.',
      '3단계 · 위치 차는 −t³이므로 출발 후 다시 만나지 않습니다. 따라서 첫 재회까지의 최대거리라는 기본 문제 조건을 이 모델에는 적용하지 않습니다.'
    ];
    return [
      '1단계 · 세로축 이름부터 읽고 같은 시각을 두 그래프에서 대응시킵니다. 위치 그래프의 기울기가 속도 그래프의 높이입니다.',
      '2단계 · 위치가 감소에서 증가로 바뀌는 곳에서 실제 점의 운동 방향이 바뀝니다. 수평 접선이 있다는 조건만으로는 충분하지 않습니다.',
      '3단계 · t=2에서는 속도가 음수에서 양수로 바뀌지만, t=3에서는 위치만 0이고 속도는 양수입니다. 원점 통과와 방향 전환을 구별합니다.'
    ];
  }
  // 탐구는 조작 중인 모델, 정리·문제는 선택한 변형의 조건과 단계를 사용합니다.
  function withVary(m, sc) {
    const M = MVM[m], d = examData[m], oldDraw = sc.draw, oldView = sc.view;
    const cur = () => M.vary.cur();
    return {
      ...sc,
      aspect:'free',
      aspectNote:'가로축은 시간, 세로축은 위치 또는 속도여서 축척을 따로 표시합니다. 각 그래프의 눈금으로 값을 읽으세요. 위치와 속도 그래프 사이에서 화면의 높이나 기울기 각도를 그대로 비교할 수는 없습니다.',
      guide:[null,'시각 t를 움직이며 점의 경로와 속도 그래프의 두 색 영역을 비교하세요.','p를 바꾸어 속도 그래프가 축을 지나는 경우와 접하는 경우를 비교하세요.','각 질문의 시간구간을 먼저 확인한 뒤, 속력·원점과의 거리·원점 복귀를 각각 관찰하세요.','시각 t와 계수 k를 움직이며 두 위치의 간격과 상대속도를 비교하세요.','같은 시각에서 위치의 기울기와 속도의 부호를 비교하세요.'][m],
      steps: (s,lab=window.lab) => lab&&lab.tab==='explore'?motionExploreSteps(m,s):M.steps(cur()),
      reviewTop: () => `<div class="apl-rich" style="font-size:var(--fs-sm);line-height:1.75"><small style="color:var(--text-3);font-weight:800">문제</small><br>${M.text(cur())}</div>`,
      problem: { tag: d.tag, time: d.targetTime, text: () => cxProb(M.text(cur())), answer: () => M.answer(cur()) },
      vary: M.vary,
      solution: { ...sc.solution, standard: () => M.std(cur()), quick: () => M.quick(cur()) },
      panes: (s) => { if(cxVarTab())return mvPanes(M)(); const g=exploreGeometry(m,s);return panesOf(g.xr,g.vr)(s); },
      view: (s, lab=window.lab) => {
        if(lab&&lab.tab!=='explore')return {notes:'발문의 시간구간 안에서 위치·속도·부호 있는 넓이를 비교합니다. 수직선의 위치와 그래프의 시간축은 서로 다른 축입니다.'};

          oldDraw(b,s,{...v,T:g.T,trackRange:g.trackRange},lab);
        } else mvFrame(b, s, lab, M);
      }
    };
  }

  for (let i = 0; i < 5; i++) scenes[i] = withVary(i + 1, scenes[i]);

  const lessonParams = {
      t: { value: 3, min: 0, max: T_MAX, step: 0.02, color: 'amber', label: '관찰 시각 t (초)', hint: '0초 ~ 4초 · 두 그래프 축 위의 노란 점을 끌어 경계 시각도 확인하세요', format: (v) => `t ≈ ${fmt(v,4)} 초` },
      p: { value: 1, min: -0.5, max: 2.0, step: 0.05, color: 'sky', label: '속도를 정하는 값 p', hint: '$v(t)=3(t-1)^2-3p$ · p = 1 이면 $v=3t(t-2)$, p = 0 이면 $v=3(t-1)^2$', format: (v) => `p = ${fmt(v)}` },
      k: { value: 1, min: -0.5, max: 2.0, step: 0.05, color: 'sky', label: '점 Q의 속도 계수 k', hint: '$v_Q(t)=3kt$ · 문제의 조건은 k = 1', format: (v) => `k = ${fmt(v)}` }
    };

  // Replay selects the preserved first source, leaving the manual variant untouched.
  const lessonScenes=scenes,sourceInfo={};
  for(const sc of lessonScenes){
    const current=sc.vary.cur,first=current();sc.vary.first=()=>first;
    sc.vary.cur=()=>lmoActive(window.lab&&window.lab.s)?first:current();
    const initial=Object.fromEntries(Object.entries(lessonParams).map(([k,p])=>[k,p.value]));
    Object.assign(initial,{dual:false,animDir:1});sc.enter(initial);
    sourceInfo[sc.id]={first,initial,question:sc.problem.text().replace(/<div[^>]*>\s*<button[^>]*data-cx-new[\s\S]*$/,''),answer:sc.problem.answer(),steps:sc.steps(initial)};
  }
  const lessonSource=window.APL_MO_SOURCE={scenes:lessonScenes,first:id=>sourceInfo[id].first,initial:id=>({...sourceInfo[id].initial}),question:id=>sourceInfo[id].question,answer:id=>sourceInfo[id].answer,steps:id=>sourceInfo[id].steps.slice(),math:{posX,velV,accA,xP4,vP4,xQ4,vQ4,turnsOf,motion,gapLegs}};
  function lmoMathKey(value) {
    return String(value||'').normalize('NFKC').replace(/\\(?:left|right|,|!|;|quad|qquad)/g,'')
      .replace(/\\(?:dfrac|frac)\{([^{}]*)\}\{([^{}]*)\}/g,'($1)/($2)')
      .replace(/\\sqrt\{([^{}]*)\}/g,'√($1)').replace(/\\sqrt\s*(\w)/g,'√($1)')
      .replace(/\\(?:text|mathrm|mathbf|overline)\{([^{}]*)\}/g,'$1')
      .replace(/\\leq?/g,'≤').replace(/\\geq?/g,'≥').replace(/\\lt/g,'<').replace(/\\gt/g,'>')
      .replace(/\\cdot|\\times/g,'×').replace(/−|–/g,'-').replace(/[\s{}$^_()]/g,'');
  }
  function lmoLabel(value,s) {
    const text=String(value||''), key=lmoMathKey(text), known=(s.lmoKnownMath||[]).map(lmoMathKey);
    if (s.lmoShowAnswer) return text;
    if(/^(?:[xv](?:[₁₂PQ])?[(]t[)] (?:위치|속도)|[xv][₁₂PQ]?|t[(]초[)]|위치|속도|수직선|시간|P·Q)$/.test(text))return text;
    if (key && known.some(math=>math.includes(key))) return text;
    const count=text.match(/^(\d+)개$/);
    if(count&&known.some(math=>math.endsWith('='+count[1])))return text;
    if (/^(?:[A-Z][′']*|[xy]|[αβ]|[xy][₁₂]|[PQRS]|f|g|y = x)$/.test(text)) return text;
    if (/^(?:y = f[(]x[)]|y = f′[(]x[)]|[αβhO]|[xX]_[TQI]|S_d = Δy|극값의 차 Δy)$/.test(text)) return text;
    if(/^(?:[ST][₀-₉]+|[?⋮])$/.test(text))return text;
    const named=text.match(/^([A-Z][′']*)(?=[\s(=:]|$)/);
    if (named) return named[1];
    return /^(?:점근선|대칭축|산술평균|기하평균|직각|넓이|교점)/.exec(text)?.[0]||'';
  }
  function lmoDrawingState(s){
    const shown={...s,...(s.lessonEntry&&s.lmoInitial?JSON.parse(JSON.stringify(s.lmoInitial)):{}),playing:false,lmoKnownMath:s.lessonEntry?[]:s.lmoKnownMath,lmoShowAnswer:!s.lessonEntry&&!!s.lmoShowAnswer,step:s.lessonEntry?0:Math.max(0,Math.min(s.step||0,s.lmoShowAnswer?4:2))};
    if(shown.lmoStage>=0)shown.step=Math.max(0,Math.round(shown.lmoStage));
    if(s.lessonEntry)shown.step=0;
    return shown;
  }
  for (const sc of lessonScenes) {
    const original={question:sc.question,reviewTop:sc.reviewTop,steps:sc.steps,view:sc.view,draw:sc.draw,panes:sc.panes,tick:sc.tick};
    sc.question=(s,lab)=>lmoActive(s)?s.lmoQuestion||lessonSource.question(sc.id):typeof original.question==='function'?original.question(s,lab):original.question;
    sc.reviewTop=(s,lab)=>lmoActive(s)?'':typeof original.reviewTop==='function'?original.reviewTop(s,lab):original.reviewTop;
    sc.steps=(s,lab)=>lmoActive(s)?['조건 확인','핵심 관계','식 세우기','계산과 결론']:(typeof original.steps==='function'?original.steps(s,lab):original.steps);
    sc.view=(s,lab)=>lmoActive(s)?{}:original.view(s,lab);
    sc.panes=s=>{if(!lmoActive(s))return original.panes(s);const shown=lmoDrawingState(s),m=lessonScenes.indexOf(sc)+1;if(shown.lmoExplore){const g=exploreGeometry(m,shown);return panesOf(g.xr,g.vr)(shown);}return mvPanes(MVM[m])(shown);};
    sc.tick=(s,dt,lab)=>lmoActive(s)?false:original.tick(s,dt,lab);
    sc.draw=(b,s,v,lab)=>{
      if (!lmoActive(s)) {
        if (b._moLessonView) {
          if (b.focus===b._moLessonView.appliedFocus) Object.assign(b,b._moLessonView.before);
          else { b._cxKey=null; }
          delete b._moLessonView;
        }
        return original.draw(b,s,v,lab);
      }
      if (!b._moLessonView) b._moLessonView={before:{focus:b.focus,zoom:b.zoom,panX:b.panX,panY:b.panY,_cxKey:b._cxKey,__focusKey:b.__focusKey,aspect:b.aspect}};
      const shown=lmoDrawingState(s);
      const shownLab=Object.create(lab);shownLab.tab=shown.lmoExplore?'explore':'review';shownLab.s=shown;
      const key=sc.id+'|'+!!s.lmoExplore;
      if (b._moLessonView.key!==key) { b._cxKey=null;b.__focusKey=null;b._moLessonView.key=key;b.zoom=1;b.panX=0;b.panY=0; }
      const plot=b.plot,text=b._text,axes=b.axes,path=b.path,point=b.point,roundRect=b.ctx.roundRect,curves=[],paths=[],points=[],rects=[];
      let axesDrawing=false;
      b.axes=function(...args){axesDrawing=true;try{return axes.apply(this,args);}finally{axesDrawing=false;}};
      b.path=function(ps,options={}){if(!axesDrawing&&!this._bbox&&(options.width||0)>=1.8)paths.push(ps);return path.call(this,ps,options);};
      b.point=function(p,options={}){if(!axesDrawing&&!this._bbox)points.push(p);return point.call(this,p,options);};
      b.ctx.roundRect=function(x,y,w,h,r){if(!axesDrawing&&!b._bbox)rects.push([x,y,w,h]);return roundRect.call(this,x,y,w,h,r);};
      b.plot=function(fn,options={}) {

      };
      b._text=function(x,y,label,options,screen) {return text.call(this,x,y,this._bbox||axesDrawing?label:lmoLabel(label,shown),options,screen);};
      try {original.draw(b,shown,original.view(shown,shownLab)||{},shownLab);} finally {b.plot=plot;b._text=text;b.axes=axes;b.path=path;b.point=point;b.ctx.roundRect=roundRect;}
      b._moLessonView.appliedFocus=b.focus;
      // Trace a point on the native plotted function, within the actual viewport.
      const u=clamp(Number(shown.lmoTrace)||0,0,1);
      let traced=false;
      if (!s.lessonEntry && u && !b._bbox) for (const {fn,options,pane} of curves) {
        if(b.panes)b.use(pane||'main');
        const box=b.viewBox(),lo=Math.max(box.x0,options.from??-Infinity),hi=Math.min(box.x1,options.to??Infinity),xs=[];
        for (let i=0;i<=120;i++) {const x=lo+(hi-lo)*i/120,y=fn(x);if(Number.isFinite(y)&&y>box.y0&&y<box.y1)xs.push(x);}
        if(xs.length>1){const x=xs[0]+(xs.at(-1)-xs[0])*u,y=fn(x);if(Number.isFinite(y)&&y>box.y0&&y<box.y1){b.point([x,y],{color:'violet',r:5,glow:false});traced=true;}break;}
      }
      const xy=p=>[p.x??p[0],p.y??p[1]];
      if(!s.lessonEntry&&u&&!traced&&!b._bbox){
        const segment=paths.find(ps=>ps.length>=2);
        if(segment){const z=Math.min(segment.length-2,Math.floor(u*(segment.length-1))),t=u*(segment.length-1)-z,p=xy(segment[z]),q=xy(segment[z+1]);b.point([p[0]+(q[0]-p[0])*t,p[1]+(q[1]-p[1])*t],{color:'violet',r:5,glow:false});}
        else if(points.length){b.point(xy(points[Math.min(points.length-1,Math.floor(u*points.length))]),{color:'violet',r:5,glow:false});}
        else if(rects.length){const [x,y,w,h]=rects[0],q=b.toW(x+u*w,y);b.point([q.x,q.y],{color:'violet',r:5,glow:false});}
      }
    };
  }
  const lessons=window.APL_MO_LESSONS?window.APL_MO_LESSONS.install(lessonScenes,lessonSource):{};


  /* ---------- 10. 실험실 등록 ---------- */

    home: '../index.html#calc1',
    legacy: '../../labs/미적분1/속도·가속도·이동거리.html',

    board: { kind: 'cartesian', aspect: 'free', pad: 0.02, focus: { x: X_FOCUS, y: [-5.2, 7.4] } },

  });
