<script>
/* ==========================================================================
   중3 · 원의 성질 (AP Math Lab 2.0 이식본) — 6개 탐구관 × 30개 장면

   글자 그대로 옮기고, 이 실험실이 쓰던 그리기 함수 이름(ccircle·carc·cpoly·cline·cdot·cticks·carrows·cright·cangle·cbadge)만
   아래 어댑터가 새 무대 엔진(APLab.Board)에 연결합니다. (삼각비의 pline·ppoly 계열과 이름이 달라 이 파일 안에 둡니다.)
   원본과 다른 점 (코드 안에는 모두 [2.0 수정] 주석이 있습니다)
   - 캔버스를 직접 그리던 3곳(접힌 아치, 도넛 색칠, 족보 장면 글자)을 무대 호출로 교체
   - 그림 오류 수정(원본 그림이 해설·수학과 어긋난 곳):
       ① 원 접기: 접힌 아치(2차 곡선)가 중심 O에 닿지 않음 → 세 점을 지나는 원호로(100%에서 O 통과)
       ② 삼각비 결합: 그림은 BC=R√3인데 해설은 BC=R(sin A=1/2) → 해설에 맞춰 중심각 60°
       ③ 반원을 품은 직사각형: 원의 중심이 잘못돼 접선 DE가 원을 가로지름 → 반원(중심=AB의 중점)
       ④ 내접사각형 두 대변 연장선: P, Q가 연장선 위에 있지 않음 → 호의 크기로 점을 잡고 교점을 계산(∠A=52°, ∠P=32°, ∠Q=44° 그대로 정확)
       ⑤ 외부 할선·접선과 할선: A, C가 P에서 나가는 직선 위에 있지 않음 → 직선과 원의 교점으로 잡음
       ⑥ 내접사각형 3장면·네 점이 한 원 위: θ 표시와 그려진 각이 달랐음 → 표시한 각이 그림에서도 같게 배치
   - 해설 수식의 \overparen(호 기호, KaTeX 미지원)을 \overset{\frown}{..} 로, **굵게** 표기를 굵은 글씨로
   - 관찰 렌즈(전체/각/현·접선 표시/지름·보조선)는 그대로 동작: 원본의 conceptSwitch 규칙을 어댑터가 그대로 적용하고
     원본 LENS_OFF 표로 효과 없는 렌즈 버튼은 숨김
   - 가독성: 이름표(점 이름·길이 상자·각 이름)가 서로·점과 겹치지 않게 원본 위치를 우선하되 겹치면 빈자리로 이동,
     긴 점 이름은 두 줄로, ➔ ⭕ ❌ 는 → ○ × 로, 글자는 휴대폰에서도 92% 아래로 줄이지 않음. 모든 장면 미리보기는 글자 없이 그림만
   - 효과가 없던 조작(해당 장면에서 쓰이지 않는 각·반지름·변환 버튼)은 표시하지 않음
   - 미니 상자 없음, 하단 띠(tape)는 무대 아래 요약 띠로 이동
   ========================================================================== */
window.addEventListener('DOMContentLoaded', function () {
  const tex = APLab.tex;

  /* ===== 원본 그대로: 숫자 서식, 색 상수, 벡터 도우미 (원본 341–367행) ===== */
    function fmtNum(v) {
      if (Math.abs(v - Math.round(v)) < 1e-6) return String(Math.round(v));
      return Number(v.toFixed(1)).toString();
    }

    const CCOL = {
      cyan: '#38bdf8',
      pink: '#f472b6',
      green: '#34d399',
      gold: '#fbbf24',
      white: '#f1f5f9',
      red: '#fb7185'
    };

    const cpt = (x, y) => ({ x, y });
    const cmid = (a, b) => ({ x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 });
    const clerp = (a, b, t) => ({ x: a.x + (b.x - a.x) * t, y: a.y + (b.y - a.y) * t });
    const cdist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
    const csub = (a, b) => ({ x: a.x - b.x, y: a.y - b.y });
    const cadd = (a, b) => ({ x: a.x + b.x, y: a.y + b.y });
    const cmul = (v, k) => ({ x: v.x * k, y: v.y * k });
    const cnorm = (v) => { const l = Math.hypot(v.x, v.y) || 1; return { x: v.x / l, y: v.y / l }; };
    const cpolar = (center, r, deg) => {
      const rad = (deg * Math.PI) / 180;
      return { x: center.x + r * Math.cos(rad), y: center.y + r * Math.sin(rad) };
    };



  /* ===== 원본 상태 객체(이름 그대로) — 매 프레임 2.0 셸 상태에서 채웁니다 ===== */
  const state = {
    mode: 1,
    subType: { 1: 'chordFoldArc', 2: 'tangentPerimTri', 3: 'inscribedAngle3Cases', 4: 'cyclicPentagon', 5: 'altSegmentThm', 6: 'trapArcVsChord' },
    conceptSwitch: 'all', activePartIdx: -1, fold: 0.0, foldTarget: null,
    angPreset: 45, radPreset: 10, scale: 1.0, panX: 0, panY: 0
  };
  const ANG_PRESETS = [30, 45, 60, 70];
  const RAD_PRESETS = [6, 8, 10, 12];

  /* ===== 원본 그대로: 세부 시나리오 목록 (원본 402–445행) ===== */
    const SUB_MENUS = {
      1: [
        { id: 'chordFoldArc', label: '🥟 원을 접어 호가 중심 O를 지나게 하기 (OM=½R, 1:√3:2)' },
        { id: 'chordBisect', label: '📏 현의 수직이등분 (OM⊥AB ⟺ AM=BM)' },
        { id: 'chordEqualDist', label: '⚖️ 중심에서 같은 거리의 두 현 (OM=ON ⟺ AB=CD)' },
        { id: 'chordArchRadius', label: '🌉 깨진 접시·아치의 반지름 R 구하기' },
        { id: 'chordConcentric', label: '🍩 동심원에서 작은 원에 접하는 현과 두 원 사이의 넓이 (π·AM²)' }
      ],
      2: [
        { id: 'tangentPerimTri', label: '🔺 [킬러] 접선 3개로 만든 △PCD의 둘레는 일정 (= 2·PA)' },
        { id: 'tangentLen', label: '✂️ 원 밖의 점에서 그은 두 접선 (PA=PB, ∠O+∠P=180°)' },
        { id: 'inscribedTri', label: '💠 삼각형의 내접원과 접선의 길이(x, y, z) & 직각삼각형의 내접원의 반지름 r' },
        { id: 'pitotQuad', label: '💎 원에 외접하는 사각형에서는 두 쌍의 대변의 길이의 합이 같다 (AB + CD = AD + BC)' },
        { id: 'pitotRectTrap', label: '🏛️ 반원이 접하는 직사각형과 접선의 길이 (피타고라스 정리, DE=x+y)' }
      ],
      3: [
        { id: 'inscribedAngle3Cases', label: '🎯 원주각 = ½ 중심각 (지름 PQ를 그어 설명하기)' },
        { id: 'inscribedMoveArc', label: '🌈 한 호에 대한 원주각은 모두 같다 (점 P를 움직여 보기)' },
        { id: 'thalesSemiCircle', label: '📐 반원(지름 AB)에 대한 원주각 = 90°' },
        { id: 'inscribedTrig', label: '📊 [삼각비와 원주각] 지름을 한 변으로 하는 직각삼각형으로 sin A 구하기' },
        { id: 'fourPointsCircle', label: '⭕ 네 점 A,B,C,D가 한 원 위에 있을 조건 (∠BAC=∠BDC)' }
      ],
      4: [
        { id: 'cyclicPentagon', label: '🌟 [킬러] 원에 내접하는 오각형에 보조선을 그어 나누기' },
        { id: 'cyclicQuad180', label: '🔄 내접사각형에서 마주 보는 두 각의 합 = 180°' },
        { id: 'cyclicExterior', label: '⚡ 내접사각형의 한 외각 = 이웃한 내각의 대각 (∠DCE=∠A)' },
        { id: 'cyclicCrossExt', label: '🚀 내접사각형의 두 쌍의 대변을 연장한 교점 P, Q와 각의 크기' },
        { id: 'cyclicConditions3', label: '🔍 사각형이 원에 내접하기 위한 조건' }
      ],
      5: [
        { id: 'altSegmentThm', label: '📐 접선과 현이 이루는 각 (∠BAT = ∠BCA)' },
        { id: 'altSegmentInscribed', label: '🔺 양쪽 접선과 현이 이루는 각과 내접삼각형의 각' },
        { id: 'twoCirclesExTangent', label: '🎱 [심화] 외접하는 두 원의 공통접선 ➔ 엇각이 같아 평행(AB∥CD)' },
        { id: 'twoCirclesInTangent', label: '🎯 내접하는 두 원의 공통접선 ➔ 동위각이 같아 평행(AB∥CD)' },
        { id: 'tangentDiameterExt', label: '🧭 [킬러] 지름의 연장선 위의 점 P에서 그은 접선 PT와 각의 크기' }
      ],
      6: [
        { id: 'trapArcVsChord', label: '🚫 [주의] 원주각이 2배 ➔ 호의 길이는 2배(⭕), 현의 길이는 2배가 아님(❌)' },
        { id: 'powerInside', label: '✖️ 원 안에서 만나는 두 현의 길이 관계 (PA · PB = PC · PD)' },
        { id: 'powerOutside', label: '🔭 원 밖의 점 P에서 그은 두 할선의 길이 관계 (PA · PB = PC · PD)' },
        { id: 'powerTangentSecant', label: '⚡ 원 밖의 점 P에서 그은 접선과 할선의 길이 관계 (PT² = PA · PB)' },
        { id: 'trapCyclicQuadFamily', label: '🚫 항상 원에 내접하는 사각형(⭕) vs 안 하는 사각형(❌)' }
      ]
    };


  /* ======================================================================
     [2.0] 어댑터: 원본의 c* 그리기 함수 → 새 무대 엔진
     - 원본의 규칙을 그대로 따릅니다: partIdx(-1=없음) → 강조 조각, 관찰 렌즈(conceptSwitch)에 따라 표시/숨김
     - 그림 안 글자는 화면 픽셀 크기로 그려져 확대·휴대폰에서도 읽히고, 자동 맞춤 계산에 글자 상자가 들어갑니다
     - [가독성] 원본은 글자 위치를 고정 오프셋으로 찍어 화면이 작으면 이름표끼리·점과 겹쳤습니다.
       장면을 두 번 훑어(1회: 점 위치 수집, 2회: 그리기) 점 이름·길이 상자·각 이름이 서로, 그리고 점과 겹치지 않도록
       원본 위치를 우선하고 겹치면 가까운 빈자리로 옮깁니다. 긴 이름은 '(' 앞뒤 두 줄로 나눕니다.
     ====================================================================== */
  let BOARD = null;
  const PL = { pass: 2, obst: [], placed: [], segs: [], arcs: [] }; // pass 1: 점 수집 / pass 2: 그리기. obst=점 상자, placed=이미 놓은 글자 상자(화면 좌표), segs=[표시 보강] 그려질 선분(각 값 글자가 선 위에 놓이지 않게)
  const partOf = (p) => (p == null || p < 0 ? undefined : p);
  const dashOf = (d) => (Array.isArray(d) && d.length ? d : null);
  // 그림 안 글자: 원본의 ➔ ⭕ ❌ 는 글꼴에 따라 깨질 수 있어 → ○ × 로(국내 교과서 표기), 그 밖의 이모지는 뗍니다.
  const cv = (s) => APLab.stripEmoji(String(s == null ? '' : s).replace(/➔/g, '→').replace(/⭕/g, '○').replace(/❌/g, '×'));
  const lensOK = (...names) => names.includes(state.conceptSwitch);
  // 자동 맞춤 계산 중에는 원의 바깥 범위도 그림 범위로 기록합니다(Board.arc는 중심만 기록하므로 보완)
  const regCircle = (c, r) => { if (BOARD._bbox) { BOARD.toS(c.x - r, c.y - r); BOARD.toS(c.x + r, c.y + r); } };

  const twCache = new Map();
  function tw(str, size, weight) { // 글자 폭(px)
    const B = BOARD, key = `${weight}|${size.toFixed(2)}|${B.font}|${str}`;
    let w = twCache.get(key);
    if (w == null) {
      const c = B.ctx;
      c.save();
      c.font = `${weight} ${size}px ${B.font}`;
      w = c.measureText(str).width;
      c.restore();
      if (twCache.size > 4000) twCache.clear();
      twCache.set(key, w);
    }
    return w;
  }
  // 글자 크기: 칸이 작으면 Board가 글자를 최대 22% 줄이지만, 휴대폰에서 읽기 어려워 92% 아래로는 줄이지 않습니다(lsz = Board._text 에 넘길 크기)
  const ES = () => Math.max(BOARD._ts(), 0.92);
  const tsz = (base) => base * BOARD.fs * (BOARD.thumb ? 0.78 : ES());
  const lsz = (base) => base * (BOARD.thumb ? 1 : ES() / BOARD._ts());
  const hit = (a, b) => a.x0 < b.x1 && a.x1 > b.x0 && a.y0 < b.y1 && a.y1 > b.y0;
  const isFree = (r) => !PL.obst.some((q) => hit(r, q)) && !PL.placed.some((q) => hit(r, q));
  const isInside = (r) => { const a = BOARD._area(); return r.x0 >= a.x + 3 && r.x1 <= a.x + a.w - 3 && r.y0 >= a.y + 3 && r.y1 <= a.y + a.h - 3; };
  // 자동 맞춤을 재는 중에는 무대 경계를 따지지 않고(글자 상자가 맞춤 범위를 정하도록), 실제 그릴 때만 무대 안에 두려 합니다.
  const okSpot = (r) => isFree(r) && (BOARD._bbox || BOARD.thumb || isInside(r));
  const RADII = [1, 1.45, 2];
  const TURNS = [0, 0.7, -0.7, 1.4, -1.4, 2.1, -2.1, Math.PI];

  function ccircle(center, r, stroke = '#38bdf8', fill = 'rgba(56, 189, 248, 0.06)', width = 2.8, dash = [], partIdx = -1) {
    if (PL.pass === 1) return;
    regCircle(center, r);
    BOARD.circle(center, r, { color: stroke || null, fill: fill || null, width, dash: dashOf(dash), part: partOf(partIdx) });
  }
  function carc(center, r, startDeg, endDeg, color = '#fbbf24', width = 5.0, ccw = false, partIdx = -1) {
    if (PL.pass === 1) return;
    regCircle(center, r);
    BOARD.arc(center, r, (startDeg * Math.PI) / 180, (endDeg * Math.PI) / 180, { color, width, ccw, glow: true, part: partOf(partIdx) });
  }
  function cpoly(pts, fill = 'rgba(52,211,153,0.18)', stroke = '#34d399', width = 2.8, partIdx = -1) {
    if (PL.pass === 1) { if (stroke) pts.forEach((p, i) => segNote(p, pts[(i + 1) % pts.length])); return; } // [표시 보강] 변도 기록
    BOARD.poly(pts, { fill: fill || null, color: stroke || null, stroke: !!stroke, width, part: partOf(partIdx) });
  }
  function cline(a, b, color = '#fbbf24', width = 2.5, dash = [], glow = false, partIdx = -1) {
    if (PL.pass === 1) { segNote(a, b); return; } // [표시 보강] 선분 기록
    BOARD.seg(a, b, { color, width, dash: dashOf(dash), glow, part: partOf(partIdx) });
  }
  /** 점과 이름. 원본의 위치 규칙(중심 반대쪽 refCenter / 직접 오프셋 customOff)을 첫 후보로 삼고, 겹치면 빈자리로 옮깁니다. */
  function cdot(p, text = '', col = '#ffffff', refCenter = null, customOff = null) {
    const B = BOARD, s = B.toS(p);
    if (PL.pass === 1) { PL.obst.push({ x0: s.x - 8, y0: s.y - 8, x1: s.x + 8, y1: s.y + 8 }); return; }
    B.point(p, { color: col, r: 5 });
    if (B.thumb) return; // 모든 장면 미리보기(작은 그림)에는 글자를 넣지 않습니다
    const str = cv(text);
    if (!str) return;
    // 첫 후보: 점에서 글자 기준점까지의 화면 오프셋(원본 baseline 'alphabetic' → 가운데 기준으로 환산)
    let vx, vy;
    if (customOff) { vx = customOff.x; vy = customOff.y - 4; }
    else if (refCenter) {
      const dx = p.x - refCenter.x, dy = p.y - refCenter.y, l = Math.hypot(dx, dy) || 1, ux = dx / l, uy = dy / l;
      if (Math.abs(ux) > 0.5) { vx = ux > 0 ? 11 : -11; vy = uy * 14; } else { vx = ux * 21; vy = uy * 21; }
    } else { vx = 10; vy = -14; }
    // 긴 이름은 '(' 앞뒤 두 줄로 (그림을 작게 만들지 않도록)
    const size = tsz(12.5), lh = size * 1.15, a = B._area();
    let lines = [str];
    const k = str.indexOf('(');

    const ux = (a2 * (P.y - B.y) + p2 * (B.y - A.y) + b2 * (A.y - P.y)) / dd;
    const uy = (a2 * (B.x - P.x) + p2 * (A.x - B.x) + b2 * (P.x - A.x)) / dd;
    const r = Math.hypot(A.x - ux, A.y - uy);
    const TAU = Math.PI * 2, wrap = (x) => ((x % TAU) + TAU) % TAU;
    const aA = Math.atan2(A.y - uy, A.x - ux), aP = Math.atan2(P.y - uy, P.x - ux), aB = Math.atan2(B.y - uy, B.x - ux);
    const dAB = wrap(aB - aA), dAP = wrap(aP - aA);
    const sweep = dAP <= dAB ? dAB : dAB - TAU; // A에서 B로, P를 지나는 쪽으로
    const pts = [];
    for (let i = 0; i <= n; i++) { const a = aA + (sweep * i) / n; pts.push({ x: ux + r * Math.cos(a), y: uy + r * Math.sin(a) }); }
    return pts;

  /* ===== 원본 그대로: 장면별 그리기 (원본 1503–2315행). 캔버스를 직접 쓰던 3곳과 화면 배율 1줄만 [2.0 수정] ===== */
    function drawCircleMasterScene(cx, cy, t, spec) {
      const m = state.mode;
      const sub = state.subType[m];
      const s = state.scale * 1.08; // [2.0 수정] 원본은 캔버스 너비로 0.82/1.08을 골랐으나, 무대가 도형 전체를 자동으로 맞추므로 고정
      const Rpx = 132 * s;
      const O = cpt(cx, cy);
      const ang = state.angPreset; // 30, 45, 60, 70
      const Rval = state.radPreset; // 6, 8, 10, 12

      // =====================================================================
      // [모드 1] 원과 현 · 원 접기(1:√3:2) · 아치 반지름 복원 · 동심원 도넛
      // =====================================================================
      if (m === 1) {
        if (sub === 'chordFoldArc') {
          ccircle(O, Rpx, CCOL.cyan, 'rgba(56, 189, 248, 0.07)', 2.8);
          const pA = cpolar(O, Rpx, 150), pB = cpolar(O, Rpx, 30);
          const pC = cpolar(O, Rpx, 90);
          const pM = cmid(pA, pB);

          // 접힌 호 ACB 표현 (t에 따라 C가 O로 접혀 올라감)
          cpoly([O, pA, pM], 'rgba(251, 191, 36, 0.28)', CCOL.gold, 2.8, 1);
          cpoly([O, pB, pM], 'rgba(56, 189, 248, 0.20)', CCOL.cyan, 2.4, 1);
          cline(pA, pB, CCOL.cyan, 3.8, [], true, 2);
          cline(O, pC, CCOL.pink, 2.6, [5, 4], false, 0);
          cline(O, pM, CCOL.pink, 3.6, [], true, 0);

          // 접힌 아치 곡선
          // [2.0 수정] 원본은 2차 곡선(꼭대기가 O에 닿지 않아 '호가 O를 통과'가 그림에서 안 보임)이었습니다.
          //            세 점 A·꼭대기·B를 지나는 원호로 바꿔 t=100%에서 접힌 호가 정확히 중심 O를 지납니다(t=0%는 원래 호).
          if (PL.pass === 2) BOARD.path(arcThrough(pA, cpt(cx, cy + Rpx * (1 - t)), pB), { color: CCOL.gold, fill: 'rgba(251, 191, 36, 0.16)', width: 3.2 });

          cright(pM, O, pA, 12, CCOL.pink);
          cticks(O, pM, 1, CCOL.pink, 7);
          cticks(pM, pC, 1, CCOL.pink, 7);
          cticks(pA, pM, 2, CCOL.gold, 8);
          cticks(pM, pB, 2, CCOL.gold, 8);
          cticksAt(O, pA, 0.35, 3, CCOL.white, 7); // [표시 보강] 반지름 OA = OB
          cticksAt(O, pB, 0.35, 3, CCOL.white, 7);
          cangle(O, pM, pA, CCOL.gold, 26, 1, '60°'); // [표시 보강] ∠AOM = ∠BOM = 60° (같은 각 = 같은 색·같은 호)
          cangle(O, pM, pB, CCOL.gold, 26, 1, '60°');

          cbadge(O, pA, `R = ${Rval}`, CCOL.gold, -16, 0.5, 1);
          cbadge(O, pM, `½R=${Rval / 2}`, CCOL.pink, 26, 0.5, 0);
          cbadge(pA, pM, `${Rval / 2}√3`, CCOL.cyan, 16, 0.5, 2);

          cdot(O, 'O(호가 지나는 중심)', CCOL.gold, null, { x: 0, y: -16 });
          cdot(pA, 'A', CCOL.white, O);
          cdot(pB, 'B', CCOL.white, O);
          cdot(pM, 'M', CCOL.pink, null, { x: 14, y: 14 });
          cdot(pC, 'C', CCOL.white, O);
        } else if (sub === 'chordBisect') {
          ccircle(O, Rpx, CCOL.cyan, 'rgba(56, 189, 248, 0.07)', 2.8);
          const pA = cpolar(O, Rpx, 143), pB = cpolar(O, Rpx, 37);
          const pM = cmid(pA, pB);

          cpoly([O, pA, pM], 'rgba(251, 191, 36, 0.30)', CCOL.gold, 2.8, 0);
          cpoly([O, pB, pM], 'rgba(56, 189, 248, 0.24)', CCOL.cyan, 2.6, 0);
          cline(pA, pB, CCOL.cyan, 3.8, [], true, 1);
          cline(O, pM, CCOL.pink, 3.2, [], false, 0);

          cright(pM, O, pA, 12, CCOL.pink);
          cticks(pA, pM, 2, CCOL.gold, 8);
          cticks(pM, pB, 2, CCOL.gold, 8);
          cticks(O, pA, 1, CCOL.white, 7.5);
          cticks(O, pB, 1, CCOL.white, 7.5);
          cright(pM, O, pB, 12, CCOL.pink); // [표시 보강] 두 직각삼각형 모두 직각(RHS 합동의 R)

          const d = Math.round(Rval * 0.6), am = Math.round(Rval * 0.8);
          cbadge(O, pA, `R = ${Rval}cm`, CCOL.gold, -16, 0.5, 0);
          cbadge(O, pM, `d = ${d}cm`, CCOL.pink, 26, 0.5, 0);
          cbadge(pA, pM, `AM = ${am}cm`, CCOL.cyan, 18, 0.5, 1);
          cbadge(pM, pB, `BM = ${am}cm`, CCOL.cyan, 18, 0.5, 1);

          cdot(O, 'O', CCOL.gold, null, { x: 0, y: -16 });
          cdot(pA, 'A', CCOL.white, O);
          cdot(pB, 'B', CCOL.white, O);
          cdot(pM, 'M(수직이등분)', CCOL.pink, null, { x: 0, y: 22 });
        } else if (sub === 'chordEqualDist') {

          const hA = (Math.acos(0.6) * 180) / Math.PI; // 53.13°

          cline(O, pN, CCOL.pink, 3.4, [], true, 0);

          cright(pM, O, pA, 11, CCOL.pink);
          cright(pN, O, pC, 11, CCOL.pink);
          cticks(O, pM, 1, CCOL.pink, 7.5);
          cticks(O, pN, 1, CCOL.pink, 7.5);
          cticks(pA, pB, 2, CCOL.gold, 8.5);
          cticks(pC, pD, 2, CCOL.cyan, 8.5);

          cdot(O, 'O', CCOL.gold, null, { x: 0, y: -16 });

          cdot(pC, 'C', CCOL.white, O); cdot(pD, 'D', CCOL.white, O);

        } else if (sub === 'chordArchRadius') {
          // 깨진 접시 조각(활꼴) 반지름 복원: R=10, AM=8, CM=4, OM=R-4=6

          cdot(pC, 'C(활꼴의 꼭대기)', CCOL.gold, null, { x: 0, y: -16 });
          cdot(pM, 'M', CCOL.white, null, { x: -16, y: 16 });

          cdot(pA, 'A', CCOL.white, O);
          cdot(pB, `B(현 AB=${Rval * 2}cm)`, CCOL.white, O);
          cdot(pM, 'M(접점 ⊥)', CCOL.gold, null, { x: 0, y: -16 });
        }
      }

      // =====================================================================
      // [모드 2] 원과 접선 · △PCD 둘레 불변 · 내접원 · 피토 정리
      // =====================================================================
      else if (m === 2) {
        if (sub === 'tangentPerimTri') {
          const cO = cpt(cx - 58 * s, cy);
          const rC = 92 * s;
          const pP = cpt(cx + 155 * s, cy);
          const distOP = cdist(cO, pP);
          const alpha = Math.acos(rC / distOP);
          const pA = cpt(cO.x + rC * Math.cos(-alpha), cO.y + rC * Math.sin(-alpha));
          const pB = cpt(cO.x + rC * Math.cos(alpha), cO.y + rC * Math.sin(alpha));
          const pE = cpt(cO.x + rC, cO.y);

          // 점 E에서의 접선(수직선 x = pE.x)과 PA, PB의 교점 C, D
          const uTop = (pE.x - pA.x) / (pP.x - pA.x);
          const pC = clerp(pA, pP, uTop);
          const pD = clerp(pB, pP, uTop);

          ccircle(cO, rC, CCOL.green, 'rgba(52, 211, 153, 0.08)', 2.8);
          cline(pP, pA, 'rgba(148,163,184,0.45)', 2.2, [5, 4]);
          cline(pP, pB, 'rgba(148,163,184,0.45)', 2.2, [5, 4]);

          cpoly([pP, pC, pD], 'rgba(251, 191, 36, 0.18)', null, 0, 2);
          cline(pP, pC, CCOL.cyan, 3.8, [], true, 0);
          cline(pP, pD, CCOL.pink, 3.8, [], true, 1);

          // 슬라이더 t에 따라 CE가 CA로, DE가 DB로 펼쳐지는 직관 애니메이션!
          const curE_top = clerp(pE, pA, t);
          const curE_bot = clerp(pE, pB, t);
          cline(pC, curE_top, CCOL.cyan, 4.2, [], true, 0);
          cline(pD, curE_bot, CCOL.pink, 4.2, [], true, 1);

          cticks(pC, pA, 1, CCOL.cyan, 7.5);
          cticks(pC, curE_top, 1, CCOL.cyan, 7.5);
          cticks(pD, pB, 2, CCOL.pink, 7.5);
          cticks(pD, curE_bot, 2, CCOL.pink, 7.5);

          const pa = Rval + 2;
          cbadge(pP, pA, `PA = ${pa} cm`, CCOL.cyan, -18, 0.5, 0);
          cbadge(pP, pB, `PB = ${pa} cm`, CCOL.pink, 18, 0.5, 1);

          cdot(cO, 'O', CCOL.green, null, { x: -16, y: 4 });
          cdot(pP, `P(둘레=2PA=${pa * 2}cm!)`, CCOL.gold, null, { x: 0, y: -18 });
          cdot(pA, 'A', CCOL.cyan, cO);
          cdot(pB, 'B', CCOL.pink, cO);
          cdot(pC, 'C', CCOL.cyan, null, { x: 0, y: -16 });
          cdot(pD, 'D', CCOL.pink, null, { x: 0, y: 20 });
          cdot(pE, 'E(접점)', CCOL.gold, null, { x: -24, y: 4 });
        } else if (sub === 'tangentLen') {
          const cO = cpt(cx - 52 * s, cy);
          const rC = 96 * s;
          // [2.0 수정] 원본은 P가 고정이라 θ 표시(30~70°)와 그려진 ∠APB(약 57°)가 달랐습니다 → ∠APB = θ 가 되도록 OP = r / sin(θ/2)
          const pP = cpt(cO.x + rC / Math.sin((ang * Math.PI) / 360), cy);
          const distOP = cdist(cO, pP);
          const alpha = Math.acos(rC / distOP);
          const pA = cpt(cO.x + rC * Math.cos(-alpha), cO.y + rC * Math.sin(-alpha));
          const pB = cpt(cO.x + rC * Math.cos(alpha), cO.y + rC * Math.sin(alpha));
          const pH = cmid(pA, pB);

          ccircle(cO, rC, CCOL.cyan, 'rgba(56, 189, 248, 0.08)', 2.8);
          cpoly([cO, pA, pP], 'rgba(251, 191, 36, 0.24)', CCOL.gold, 2.8, 0);
          cpoly([cO, pB, pP], 'rgba(56, 189, 248, 0.22)', CCOL.cyan, 2.8, 0);
          cline(cO, pP, CCOL.white, 2.6, [5, 4], false, 2);
          cline(pA, pB, CCOL.pink, 3.2, [], true, 2);

          cright(pA, cO, pP, 12, CCOL.gold);
          cright(pB, cO, pP, 12, CCOL.cyan);
          cright(pH, cO, pA, 11, CCOL.pink);
          cticks(pP, pA, 2, CCOL.gold, 8.5);
          cticks(pP, pB, 2, CCOL.gold, 8.5);
          cticks(pA, pH, 1, CCOL.pink, 7);
          cticks(pH, pB, 1, CCOL.pink, 7);
          cticks(cO, pA, 3, CCOL.white, 7.5); // [표시 보강] 반지름 OA = OB (RHS 의 S)
          cticks(cO, pB, 3, CCOL.white, 7.5);

          cangle(cO, pA, pB, CCOL.cyan, 28, 1, `${180 - ang}°`);
          cangle(pP, pB, pA, CCOL.gold, 34, 1, `${ang}°`);

          cdot(cO, 'O', CCOL.white, null, { x: -16, y: 4 });
          cdot(pP, 'P(PA=PB)', CCOL.gold, null, { x: 14, y: 4 });
          cdot(pA, 'A(90°)', CCOL.white, cO);
          cdot(pB, 'B(90°)', CCOL.white, cO);
          cdot(pH, 'H(수직이등분)', CCOL.pink, null, { x: -28, y: 18 });
        } else if (sub === 'inscribedTri') {
          // 6-8-10 직각삼각형과 내접원 반지름 r = 2
          const uPx = 30 * s;
          const pB = cpt(cx - 4 * uPx, cy + 3 * uPx);
          const pC = cpt(cx + 4 * uPx, cy + 3 * uPx);
          const pA = cpt(cx - 4 * uPx, cy - 3 * uPx);
          const rIn = 2 * uPx;
          const pI = cpt(pB.x + rIn, pB.y - rIn);
          const pD = cpt(pB.x, pB.y - rIn), pE = cpt(pB.x + rIn, pB.y);
          const pF = clerp(pA, pC, 4 / 10);

          cpoly([pA, pB, pC], 'rgba(56, 189, 248, 0.10)', CCOL.white, 2.8);
          cpoly([pD, pB, pE, pI], 'rgba(52, 211, 153, 0.38)', CCOL.green, 3.2, 0);
          ccircle(pI, rIn, CCOL.gold, 'rgba(251, 191, 36, 0.14)', 3.0, [], 2);

          cline(pA, pD, CCOL.gold, 4.0, [], true, 1);
          cline(pA, pF, CCOL.gold, 4.0, [], true, 1);
          cline(pC, pE, CCOL.cyan, 4.0, [], true, 1);
          cline(pC, pF, CCOL.cyan, 4.0, [], true, 1);
          cline(pI, pF, CCOL.pink, 2.4, [4, 4]);

          cright(pB, pA, pC, 12, CCOL.green);
          cright(pD, pI, pB, 10, CCOL.green);
          cright(pE, pI, pB, 10, CCOL.green);
          cright(pF, pI, pC, 10, CCOL.pink);
          cticksAt(pA, pD, 0.22, 1, CCOL.gold, 7.5); // [표시 보강] 한 점에서 그은 두 접선은 길이가 같다: AD = AF (금색 한 줄), CE = CF (하늘색 두 줄)
          cticksAt(pA, pF, 0.22, 1, CCOL.gold, 7.5);
          cticksAt(pC, pE, 0.25, 2, CCOL.cyan, 7.5);
          cticksAt(pC, pF, 0.25, 2, CCOL.cyan, 7.5);

          cbadge(pB, pE, 'r = 2', CCOL.green, 16, 0.5, 0);
          cbadge(pA, pD, '6-r = 4', CCOL.gold, -20, 0.5, 1);
          cbadge(pA, pF, '4 cm', CCOL.gold, -15, 0.5, 1);
          cbadge(pF, pC, '8-r = 6 cm', CCOL.cyan, -15, 0.5, 1);
          cbadge(pE, pC, '6 cm', CCOL.cyan, 16, 0.5, 1);

          cdot(pA, 'A', CCOL.white, pI);
          cdot(pB, 'B(한 변이 r인 정사각형)', CCOL.green, null, { x: -10, y: 22 });
          cdot(pC, 'C', CCOL.white, pI);
          cdot(pI, 'I(내심 r=2)', CCOL.gold, null, { x: 24, y: -6 });
          cdot(pD, 'D', CCOL.green, null, { x: -16, y: 0 });
          cdot(pE, 'E', CCOL.green, null, { x: 0, y: 18 });
          cdot(pF, 'F', CCOL.pink, null, { x: 12, y: -10 });
        } else if (sub === 'pitotQuad') {
          // 원에 외접하는 사각형 (피토 정리: AB + CD = AD + BC)
          const rIn = 86 * s;
          ccircle(O, rIn, CCOL.green, 'rgba(52, 211, 153, 0.12)', 2.8);

          // 4개 접점 T1(위), T2(왼), T3(아래), T4(오른)에서의 접선 교점으로 정확한 외접사각형 생성
          const angs = [-102, 168, 82, -12];
          const Tpts = angs.map(dg => cpolar(O, rIn, dg));
          function tangentIntersect(T_a, T_b) {
            const n1 = csub(T_a, O), n2 = csub(T_b, O);
            const dir1 = cpt(-n1.y, n1.x), dir2 = cpt(-n2.y, n2.x);
            const u = dir1, v = dir2;
            const det = u.x * v.y - u.y * v.x || 1;
            const w = csub(T_b, T_a);
            const k = (w.x * v.y - w.y * v.x) / det;
            return cadd(T_a, cmul(u, k));
          }
          const pA = tangentIntersect(Tpts[0], Tpts[1]);
          const pB = tangentIntersect(Tpts[1], Tpts[2]);
          const pC = tangentIntersect(Tpts[2], Tpts[3]);
          const pD = tangentIntersect(Tpts[3], Tpts[0]);

          cpoly([pA, pB, pC, pD], 'rgba(15, 38, 29, 0.35)', 'rgba(255,255,255,0.3)', 1.5);

          // 4쌍의 접선 조각 컬러 매칭 (A: 골드, B: 시안, C: 그린, D: 핑크)
          cline(pA, Tpts[0], CCOL.gold, 4.2, [], true, 0);
          cline(pA, Tpts[1], CCOL.gold, 4.2, [], true, 1);
          cline(pB, Tpts[1], CCOL.cyan, 4.2, [], true, 1);
          cline(pB, Tpts[2], CCOL.cyan, 4.2, [], true, 0);
          cline(pC, Tpts[2], CCOL.green, 4.2, [], true, 0);
          cline(pC, Tpts[3], CCOL.green, 4.2, [], true, 1);
          cline(pD, Tpts[3], CCOL.pink, 4.2, [], true, 1);
          cline(pD, Tpts[0], CCOL.pink, 4.2, [], true, 0);

          cticks(pA, Tpts[0], 1, CCOL.gold, 7); cticks(pA, Tpts[1], 1, CCOL.gold, 7);
          cticks(pB, Tpts[1], 2, CCOL.cyan, 7); cticks(pB, Tpts[2], 2, CCOL.cyan, 7);
          cticks(pC, Tpts[2], 3, CCOL.green, 7); cticks(pC, Tpts[3], 3, CCOL.green, 7);
          cticks(pD, Tpts[3], 4, CCOL.pink, 7); cticks(pD, Tpts[0], 4, CCOL.pink, 7); // [표시 보강] d 쌍(분홍)에도 눈금(네 줄)

          cbadge(pA, pD, 'AD = a+d (8cm)', CCOL.gold, -16, 0.5, 0);
          cbadge(pB, pC, 'BC = b+c (10cm)', CCOL.green, 16, 0.5, 0);
          cbadge(pA, pB, 'AB = a+b (7cm)', CCOL.cyan, -22, 0.5, 1);
          cbadge(pD, pC, 'CD = c+d (11cm)', CCOL.pink, 22, 0.5, 1);

          [pA, pB, pC, pD].forEach((p, i) => cdot(p, 'ABCD'[i], CCOL.white, O));
          cdot(O, 'O(내접원)', CCOL.white, null, { x: 0, y: 4 });
        } else {
          // pitotRectTrap (원을 품은 직사각형 접선 피타고라스: 가로 9, 세로 12, 반지름 6)
          const uPx = 19 * s;
          const pB = cpt(cx - 4.5 * uPx, cy + 6 * uPx);
          const pA = cpt(cx - 4.5 * uPx, cy - 6 * uPx);
          const pD = cpt(cx + 4.5 * uPx, cy - 6 * uPx);
          const pC = cpt(cx + 4.5 * uPx, cy + 6 * uPx);
          const cO = cpt(pB.x, cy); // [2.0 수정] 원본은 pB.x + 6 * uPx(안쪽): 접선 DE가 원을 가로질렀습니다. 반원의 중심은 변 AB의 중점입니다.
          const pE = cpt(pB.x + 4 * uPx, pB.y);
          const pP = clerp(pD, pE, 9 / 13);

          cpoly([pA, pB, pC, pD], 'rgba(56, 189, 248, 0.08)', CCOL.white, 2.4);
          cpoly([pD, pE, pC], 'rgba(56, 189, 248, 0.28)', CCOL.cyan, 3.2, 2);
          csector(cO, 6 * uPx, -90, 90, 'rgba(52, 211, 153, 0.14)', CCOL.green, 2.8); // [2.0 수정] 원 → 반원(제목 '반원을 품은 직사각형')

          cline(pD, pA, CCOL.gold, 4.0, [], true, 0);
          cline(pD, pP, CCOL.gold, 4.0, [], true, 0);
          cline(pE, pB, CCOL.pink, 4.0, [], true, 1);
          cline(pE, pP, CCOL.pink, 4.0, [], true, 1);
          cright(pC, pD, pE, 12, CCOL.cyan);
          cticksAt(pD, pA, 0.25, 1, CCOL.gold, 7.5); // [표시 보강] 접선 길이: DA = DP (금색 한 줄), EP = EB (분홍 두 줄)
          cticksAt(pD, pP, 0.25, 1, CCOL.gold, 7.5);
          cticksAt(pE, pP, 0.25, 2, CCOL.pink, 7.5);
          cticksAt(pE, pB, 0.25, 2, CCOL.pink, 7.5);

          cbadge(pA, pD, 'DA = 9 cm', CCOL.gold, -16, 0.5, 0);
          cbadge(pD, pP, 'DP = 9', CCOL.gold, -16, 0.5, 0);
          cbadge(pE, pP, 'EP = x (4)', CCOL.pink, -16, 0.5, 1);
          cbadge(pB, pE, 'BE = x (4)', CCOL.pink, 16, 0.5, 1);
          cbadge(pE, pC, 'EC = 9-x (5)', CCOL.cyan, 16, 0.5, 2);
          cbadge(pD, pC, 'DC = 12 cm', CCOL.cyan, 24, 0.5, 2);

          [pA, pB, pC, pD].forEach((p, i) => cdot(p, 'ABCD'[i], CCOL.white, cO));
          cdot(pE, 'E', CCOL.pink, null, { x: 0, y: 20 });
          cdot(pP, 'P(접점)', CCOL.gold, null, { x: -18, y: -8 });
        }
      }

      // =====================================================================
      // [모드 3] 원주각=½중심각 · 원주각 이동 · 반원의 90° · 삼각비 sin A · 네 점 한 원
      // =====================================================================
      else if (m === 3) {
        if (sub === 'inscribedAngle3Cases') {
          ccircle(O, Rpx, CCOL.cyan, 'rgba(56, 189, 248, 0.07)', 2.8);
          const pA = cpolar(O, Rpx, 90 + ang), pB = cpolar(O, Rpx, 90 - ang);
          const pP = cpolar(O, Rpx, -95);
          const pQ = cpolar(O, Rpx, 85);

          carc(O, Rpx, 90 - ang, 90 + ang, CCOL.gold, 5.5, false, 2);
          cpoly([O, pP, pA], 'rgba(251, 191, 36, 0.22)', CCOL.gold, 2.6, 0);
          cpoly([O, pP, pB], 'rgba(56, 189, 248, 0.22)', CCOL.cyan, 2.6, 1);

          cline(pP, pQ, CCOL.pink, 3.2, [6, 4], true, 2);
          cticks(O, pP, 1, CCOL.white, 7.5); // [표시 보강] 반지름 OP = OA = OB: 같은 눈금(흰색 한 줄)
          cticks(O, pA, 1, CCOL.white, 7.5);
          cticks(O, pB, 1, CCOL.white, 7.5);

          // [표시 보강] 본문의 •·× 를 그림에 표시: •(금색 한 호) = ∠APO = ∠PAO, ×(하늘색 한 호) = ∠BPO = ∠PBO (이등변삼각형 밑각)
          //            외각 ∠AOQ = 2•(금색 두 호), ∠QOB = 2×(하늘색 두 호), 원주각 ∠APB = •+×, 중심각 ∠AOB = 2•+2×
          cangle(pP, pA, O, CCOL.gold, 20, 1, '•');
          cangle(pA, O, pP, CCOL.gold, 22, 1, '•');
          cangle(pP, O, pB, CCOL.cyan, 20, 1, '×');
          cangle(pB, pP, O, CCOL.cyan, 22, 1, '×');
          cangle(O, pA, pQ, CCOL.gold, 40, 2, '2•');
          cangle(O, pQ, pB, CCOL.cyan, 40, 2, '2×');
          cangle(pP, pA, pB, CCOL.pink, 46, 1, `${ang}°`, '원주각(•+×)');
          cangle(O, pA, pB, CCOL.pink, 64, 2, `${ang * 2}°`, '중심각(2•+2×)');

          cdot(O, 'O', CCOL.white, null, { x: 18, y: -4 });
          cdot(pP, 'P(•+×)', CCOL.gold, O);
          cdot(pQ, 'Q(지름 보조선)', CCOL.pink, O);
          cdot(pA, 'A(•)', CCOL.white, O);
          cdot(pB, 'B(×)', CCOL.white, O);
        } else if (sub === 'inscribedMoveArc') {
          ccircle(O, Rpx, CCOL.cyan, 'rgba(56, 189, 248, 0.07)', 2.8);
          const pA = cpolar(O, Rpx, 90 + ang), pB = cpolar(O, Rpx, 90 - ang);
          const pP1 = cpolar(O, Rpx, -130);
          const pP_cur = cpolar(O, Rpx, -130 + t * 95);

          carc(O, Rpx, 90 - ang, 90 + ang, CCOL.gold, 5.5, false, 0);
          cline(O, pA, 'rgba(251, 191, 36, 0.45)', 2, [4, 4]);
          cline(O, pB, 'rgba(251, 191, 36, 0.45)', 2, [4, 4]);
          cline(pP1, pA, 'rgba(56, 189, 248, 0.4)', 2.0);
          cline(pP1, pB, 'rgba(56, 189, 248, 0.4)', 2.0);

          cpoly([pP_cur, pA, pB], 'rgba(56, 189, 248, 0.24)', CCOL.cyan, 3.2, 1);
          cangle(pP1, pA, pB, CCOL.gold, 26, 1, `${ang}°`); // [표시 보강] 같은 호 AB 의 원주각은 같은 각 → 같은 색(금색)·같은 호 한 개
          if (t > 0.04) cangle(pP_cur, pA, pB, CCOL.gold, 26, 1, `${ang}°`, '불변!');
          cangle(O, pA, pB, CCOL.pink, 24, 2, `${ang * 2}°`);

          cdot(O, 'O', CCOL.white, null, { x: 0, y: -14 });
          cdot(pA, 'A', CCOL.gold, O);
          cdot(pB, 'B', CCOL.gold, O);
          cdot(pP1, 'P₁', CCOL.cyan, O);
          cdot(pP_cur, 'P(어디에 있어도 같은 원주각)', CCOL.gold, O);
        } else if (sub === 'thalesSemiCircle') {
          ccircle(O, Rpx, CCOL.cyan, 'rgba(56, 189, 248, 0.07)', 2.8);
          const pA = cpt(cx - Rpx, cy), pB = cpt(cx + Rpx, cy);
          const pP = cpolar(O, Rpx, -135 + t * 90);

          cpoly([pP, pA, pB], 'rgba(244, 114, 182, 0.24)', CCOL.pink, 3.2, 1);
          cline(pA, pB, CCOL.gold, 4.0, [], true, 0);
          cright(pP, pA, pB, 14, CCOL.gold);
          cangle(O, pB, pA, CCOL.gold, 22, 1, '180°(지름)');

          cdot(O, 'O(외심)', CCOL.gold, null, { x: 0, y: 20 });
          cdot(pA, 'A', CCOL.white, O);
          cdot(pB, 'B(지름)', CCOL.white, O);
          cdot(pP, 'P(항상 90°)', CCOL.pink, O);
        } else if (sub === 'inscribedTrig') {
          ccircle(O, Rpx, CCOL.cyan, 'rgba(56, 189, 248, 0.07)', 2.8);
          // [2.0 수정] 원본 그림은 BC가 중심각 120°(BC = R√3)인데 같은 장면의 해설은 'sin A = R / 2R = 1/2'(BC = R)이라 서로 어긋났습니다.
          //            해설에 맞춰 BC의 중심각을 60°(BC = R, ∠A = 30°)로 그립니다. A를 지름 끝 A'으로 옮겨 ∠C = 90°가 되는 구성은 그대로입니다.
          const pB = cpolar(O, Rpx, 120), pC = cpolar(O, Rpx, 60);
          const pA_orig = cpolar(O, Rpx, -115);
          const pA_diam = cpolar(O, Rpx, -60); // B와 정반대 지름 끝점!
          const pA_cur = cpolar(O, Rpx, -115 + t * 55);

          carc(O, Rpx, 60, 120, CCOL.gold, 5.0, false, 2);
          cpoly([pA_orig, pB, pC], 'rgba(56, 189, 248, 0.14)', 'rgba(56, 189, 248, 0.5)', 2.0, 0);
          cpoly([pA_cur, pB, pC], 'rgba(251, 191, 36, 0.28)', CCOL.gold, 3.4, 1);
          cline(pB, pA_diam, CCOL.pink, 2.8, [5, 4], false, 1);

          if (t > 0.85) {
            cright(pC, pA_cur, pB, 13, CCOL.pink);
          }
          cangle(pA_orig, pB, pC, CCOL.gold, 26, 1, '30°', '∠A'); // [표시 보강] ∠A = ∠A' (호 BC = 중심각 60° 의 원주각 30°) → 같은 색·같은 호
          if (t > 0.04) cangle(pA_cur, pB, pC, CCOL.gold, 26, 1, '30°', "∠A'=∠A");

          cbadge(pB, pC, `BC = ${Rval}`, CCOL.gold, 16, 0.5, 2); // [2.0 수정] BC = R (위 그림 수정과 같은 이유)
          cbadge(pB, pA_diam, `지름 2R = ${2 * Rval}cm`, CCOL.pink, -18, 0.45, 1);

          cdot(O, 'O', CCOL.white, null, { x: -14, y: -10 });
          cdot(pB, 'B', CCOL.white, O);
          cdot(pC, 'C(90°!)', CCOL.pink, O);
          cdot(pA_orig, 'A(처음)', CCOL.cyan, O);
          cdot(pA_cur, "A'(지름의 끝점 ➔ 직각삼각형)", CCOL.gold, O);
        } else {
          // fourPointsCircle (네 점 A, B, C, D가 한 원 위에 있을 조건)
          ccircle(O, Rpx, CCOL.green, 'rgba(52, 211, 153, 0.07)', 2.6, [6, 4]);
          // [2.0 수정] 원본은 B, C가 고정(원주각 약 55°)이라 θ 표시(30~70°)와 그림의 각이 달랐습니다 → 호 BC의 중심각이 2θ가 되도록 배치
          const pB = cpolar(O, Rpx, 90 + ang), pC = cpolar(O, Rpx, 90 - ang);
          const pA = cpolar(O, Rpx, -125);
          const pD_on = cpolar(O, Rpx, -55);
          const pD_cur = cpolar(O, Rpx + t * 55 * s, -55);
          const isOut = t > 0.15;

          cline(pB, pC, CCOL.white, 3.6);
          cpoly([pA, pB, pC], 'rgba(251, 191, 36, 0.22)', CCOL.gold, 2.8, 0);
          cpoly([pD_cur, pB, pC], isOut ? 'rgba(244, 63, 94, 0.24)' : 'rgba(52, 211, 153, 0.24)', isOut ? CCOL.red : CCOL.green, 3.0, 1);

          const curAngD = Math.round(ang / (1 + t * 0.35));
          cangle(pA, pB, pC, CCOL.gold, 28, 1, `${ang}°`);
          cangle(pD_cur, pB, pC, isOut ? CCOL.red : CCOL.gold, 28, 1, isOut ? `${curAngD}°` : `${ang}°`, isOut ? '(≠)' : '(일치!)'); // [표시 보강] 한 원 위(일치)일 때 ∠BAC 와 같은 색·같은 호

          cdot(pA, 'A', CCOL.gold, O);
          cdot(pB, 'B', CCOL.white, O);
          cdot(pC, 'C', CCOL.white, O);
          cdot(pD_cur, isOut ? "D'(원 밖의 점 ❌)" : 'D(한 원 위 ⭕)', isOut ? CCOL.red : CCOL.green, O);
        }
      }

      // =====================================================================
      // [모드 4] 원에 내접하는 사각형(180°) · 외각=내대각 · 오각형 보조선
      // =====================================================================
      else if (m === 4) {
        const angA = ang + 35, angC = 180 - angA;
        if (sub === 'cyclicPentagon') {
          ccircle(O, Rpx, CCOL.cyan, 'rgba(56, 189, 248, 0.07)', 2.8);
          // [2.0 수정] 원본은 다섯 점이 고정이라 중심각 2θ 표시(60~140°)와 그려진 ∠AOB(75°)가 달랐습니다 → 호 AB = 2θ, 나머지 네 호는 같은 크기
          const uArc = (360 - 2 * ang) / 4;
          const pA = cpolar(O, Rpx, -155);
          const pB = cpolar(O, Rpx, -155 - 2 * ang);
          const pC = cpolar(O, Rpx, -155 - 2 * ang - uArc);
          const pD = cpolar(O, Rpx, -155 - 2 * ang - 2 * uArc);
          const pE = cpolar(O, Rpx, -155 - 2 * ang - 3 * uArc);

          cpoly([pB, pC, pD, pE], 'rgba(56, 189, 248, 0.22)', CCOL.cyan, 3.0, 1);
          cpoly([pA, pB, pE], 'rgba(251, 191, 36, 0.24)', CCOL.gold, 3.0, 2);
          cline(O, pA, CCOL.pink, 2.4, [4, 4]);
          cline(O, pB, CCOL.pink, 2.4, [4, 4]);

          // 핵심 보조선 BE!
          cline(pB, pE, CCOL.pink, 4.0, [], true, 0);

          cangle(O, pB, pA, CCOL.pink, 24, 1, `${ang * 2}°`);
          cangle(pE, pA, pB, CCOL.gold, 32, 1, `${ang}°`);
          cangle(pC, pD, pB, CCOL.cyan, 26, 2, '∠C');
          cangle(pE, pB, pD, CCOL.green, 26, 2, '180°-∠C'); // [표시 보강] ∠C 와 합이 180° 인 '다른' 각 → 다른 색

          cdot(O, 'O', CCOL.white, null, { x: 14, y: 4 });
          cdot(pA, 'A', CCOL.white, O);
          cdot(pB, 'B(보조선 BE)', CCOL.pink, O);
          cdot(pC, 'C', CCOL.cyan, O);
          cdot(pD, 'D', CCOL.white, O);
          cdot(pE, `E(합=${180 + ang}°!)`, CCOL.gold, O);
        } else if (sub === 'cyclicQuad180' || sub === 'cyclicExterior' || sub === 'cyclicConditions3') {
          ccircle(O, Rpx, CCOL.cyan, 'rgba(56, 189, 248, 0.07)', 2.8);
          // [2.0 수정] 원본은 네 점이 고정이라 ∠A 표시(65°~105°)와 그림의 ∠A(늘 90°)가 달랐습니다 → 호 BCD = 2∠A 가 되도록 배치(∠C = 180° - ∠A 는 저절로 성립)
          const pB = cpolar(O, Rpx, 145);
          const pC = cpolar(O, Rpx, 145 - angA);
          const pD = cpolar(O, Rpx, 145 - 2 * angA);
          const pA = cpolar(O, Rpx, -35 - angA);
          const dirBC = cnorm(csub(pC, pB));
          const pE_ext = cadd(pC, cmul(dirBC, 78 * s));

          cpoly([pA, pB, pC, pD], 'rgba(52, 211, 153, 0.20)', CCOL.green, 3.2, 0);
          cline(pC, pE_ext, CCOL.pink, 3.2, [7, 5], false, 1); // [표시 보강] 연장선은 점선

          if (sub === 'cyclicQuad180' && (t > 0.1 || state.conceptSwitch === 'aux')) {
            cline(O, pB, CCOL.gold, 2.4, [5, 4], false, 2);
            cline(O, pD, CCOL.gold, 2.4, [5, 4], false, 2);
            cdot(O, 'O(중심각 합 360°)', CCOL.gold, null, { x: -38, y: 4 });
            // [표시 보강] 중심각: ∠A 가 보는 호 BCD = 2∠A(금색), ∠C 가 보는 호 BAD = 2∠C(하늘색) → 합 360°
            cangle(O, pB, pD, CCOL.gold, 30, 1, `${angA * 2}°`, '', angA * 2 > 180);
            cangle(O, pB, pD, CCOL.cyan, 30, 2, `${angC * 2}°`, '', angC * 2 > 180);
          }
          if (sub === 'cyclicConditions3') {
            cline(pA, pC, CCOL.cyan, 2.2, [5, 4], false, 0);
            cline(pB, pD, CCOL.cyan, 2.2, [5, 4], false, 0);
          }

          if (sub === 'cyclicConditions3') { // [표시 보강] 판정 ①: 호 BC 를 같은 쪽에서 본 ∠BAC = ∠BDC (분홍 한 호, 값은 호 너머 각 안쪽)
            cangle(pA, pB, pC, CCOL.pink, 22, 1, `${fmtNum(angA / 2)}°`);
            cangle(pD, pB, pC, CCOL.pink, 22, 1, `${fmtNum(angA / 2)}°`);
          }
          // [표시 보강] 내대각 ∠A 와 외각 ∠DCE 는 같은 각 → 같은 색(금색)·같은 호 한 개. ∠C 는 다른 각 → 하늘색 두 호. 값은 각 안쪽에.
          cangle(pA, pB, pD, CCOL.gold, sub === 'cyclicConditions3' ? 64 : 28, 1, `${angA}°`);
          cangle(pC, pD, pB, CCOL.cyan, 28, 2, `${angC}°`);
          cangle(pC, pE_ext, pD, CCOL.gold, 28, 1, `${angA}°`, '외각');

          [pA, pB, pC, pD].forEach((p, i) => cdot(p, 'ABCD'[i], CCOL.white, O));
          cdot(pE_ext, 'E', CCOL.pink, null, { x: 10, y: 16 }); // [표시 보강] 연장선 끝점은 점 이름만
        } else {
          // cyclicCrossExt (내접사각형 두 대변 연장선 교점 P, Q 킬러)
          const cO = cpt(cx - 42 * s, cy - 28 * s);
          const rC = 92 * s;
          ccircle(cO, rC, CCOL.cyan, 'rgba(56, 189, 248, 0.08)', 2.6);

          // [2.0 수정] 원본의 P, Q는 임의의 점이라 변 AD·BC(P), AB·DC(Q)의 연장선 위에 있지 않았습니다(연장선이 꺾여 보임).
          //            호 AB=128°, BC=40°, CD=64°, DA=128° 로 네 점을 잡고 두 직선의 교점을 계산하면 ∠A = 52°, ∠P = 32°, ∠Q = 44° 가 그림에서도 정확합니다.
          const pA = cpolar(cO, rC, -145);
          const pB = cpolar(cO, rC, 87);
          const pC = cpolar(cO, rC, 47);
          const pD = cpolar(cO, rC, -17);
          const meet = (p1, p2, p3, p4) => { // 직선 p1p2 와 직선 p3p4 의 교점
            const u = csub(p2, p1), v = csub(p4, p3), w = csub(p3, p1);
            const det = u.x * v.y - u.y * v.x || 1;
            return cadd(p1, cmul(u, (w.x * v.y - w.y * v.x) / det));
          };
          const pP = meet(pA, pD, pB, pC); // 변 AD 와 BC 의 연장선의 교점
          const pQ = meet(pA, pB, pD, pC); // 변 AB 와 DC 의 연장선의 교점

          cpoly([pA, pB, pC, pD], 'rgba(52, 211, 153, 0.22)', CCOL.green, 3.2, 0);
          cpoly([pD, pC, pP], 'rgba(56, 189, 248, 0.18)', CCOL.cyan, 2.6, 1);
          cpoly([pB, pC, pQ], 'rgba(244, 114, 182, 0.18)', CCOL.pink, 2.6, 2);

          // [표시 보강] 내대각 ∠A = x 를 바깥으로 복사: 외각 ∠DCP = ∠BCQ = ∠A → 같은 색(금색)·같은 호 한 개 (좁은 각이라 먼저 자리를 잡음)
          cangle(pC, pD, pP, CCOL.gold, 24, 1, 'x');
          cangle(pC, pB, pQ, CCOL.gold, 24, 1, 'x');
          cangle(pA, pB, pD, CCOL.gold, 24, 1, 'x=52°');
          cangle(pP, pA, pB, CCOL.cyan, 30, 1, '32°');
          cangle(pQ, pA, pD, CCOL.pink, 30, 2, '44°');

          [pA, pB, pC, pD].forEach((p, i) => cdot(p, 'ABCD'[i], CCOL.white, cO));
          cdot(pP, 'P(32°)', CCOL.cyan, null, { x: 14, y: 4 });
          cdot(pQ, 'Q(44°)', CCOL.pink, null, { x: 14, y: 10 });
        }
      }

      // =====================================================================
      // [모드 5] 접선과 현이 이루는 각(접선과 현이 이루는 각) & 외접/내접 두 원의 공통접선
      // =====================================================================
      else if (m === 5) {
        if (sub === 'altSegmentThm' || sub === 'altSegmentInscribed') {
          ccircle(O, Rpx, CCOL.cyan, 'rgba(56, 189, 248, 0.07)', 2.8);
          const pA = cpt(cx, cy + Rpx); // 아래쪽 접점 A
          const pS = cpt(cx - 175 * s, cy + Rpx), pT = cpt(cx + 175 * s, cy + Rpx);
          const pB = cpolar(O, Rpx, 90 - ang * 2);
          const pC = cpolar(O, Rpx, -140);
          const pD = cpt(cx, cy - Rpx); // 위쪽 지름 끝점 D

          carc(O, Rpx, 90 - ang * 2, 90, CCOL.gold, 5.0, false, 0);
          cpoly([pA, pB, pC], 'rgba(52, 211, 153, 0.20)', CCOL.green, 3.2, 1);
          cline(pS, pT, CCOL.gold, 3.8, [], true, 0);

          if (sub === 'altSegmentThm' && (t > 0.1 || state.conceptSwitch === 'aux' || state.activePartIdx === 2)) {
            cpoly([pA, pD, pB], 'rgba(244, 114, 182, 0.20)', CCOL.pink, 2.4, 2); // [표시 보강] 직각삼각형 ABD (지름 AD 의 원주각 ∠ABD = 90°)
            cline(pA, pD, CCOL.pink, 3.2, [6, 4], true, 2);
            cright(pA, pD, pT, 13, CCOL.pink);
            cright(pB, pA, pD, 12, CCOL.pink);
            cangle(pA, pD, pB, CCOL.pink, 22, 2, `${90 - ang}°`); // [표시 보강] ∠DAB = 90° - θ (접선과 현이 이루는 각과 더해 직각 ∠DAT)
            cangle(pD, pA, pB, CCOL.gold, 30, 1, `${ang}°`); // [표시 보강] ∠ADB = θ: 접선과 현이 이루는 각 ∠BAT·원주각 ∠BCA 와 같은 각 → 같은 색(금색)·같은 호 한 개
            cdot(pD, 'D(지름의 끝점)', CCOL.pink, null, { x: 0, y: -16 });
          }

          cangle(pA, pB, pT, CCOL.gold, 34, 1, `${ang}°`, '접선과 현이 이루는 각'); // [표시 보강] 접선과 현이 이루는 각 = 원주각: 같은 색·같은 호, 값은 각 안쪽
          cangle(pC, pA, pB, CCOL.gold, 32, 1, `${ang}°`, '원주각');

          if (sub === 'altSegmentInscribed') {
            cangle(pA, pS, pC, CCOL.pink, 32, 2, '65°');
            cangle(pB, pC, pA, CCOL.pink, 30, 2, '65°!');
          }

          cdot(O, 'O', CCOL.white, null, { x: -16, y: 0 });
          cdot(pA, 'A(접점)', CCOL.gold, null, { x: 0, y: 22 });
          cdot(pB, 'B', CCOL.white, O);
          cdot(pC, 'C', CCOL.white, O);
          cdot(pS, 'S', CCOL.gold, null, { x: -14, y: 0 });
          cdot(pT, 'T(접선)', CCOL.gold, null, { x: 14, y: 0 });
        } else if (sub === 'twoCirclesExTangent') {
          const r1 = 92 * s, r2 = 68 * s;
          const pT = cpt(cx + 12 * s, cy);
          const O1 = cpt(pT.x - r1, cy), O2 = cpt(pT.x + r2, cy);

          ccircle(O1, r1, CCOL.cyan, 'rgba(56, 189, 248, 0.08)', 2.8);
          ccircle(O2, r2, CCOL.gold, 'rgba(251, 191, 36, 0.08)', 2.8);

          const pA = cpolar(O1, r1, -135), pB = cpolar(O1, r1, 125);
          const pD = cpolar(O2, r2, 45), pC = cpolar(O2, r2, -55);

          cpoly([pT, pA, pB], 'rgba(56, 189, 248, 0.24)', CCOL.cyan, 3.0, 1);
          cpoly([pT, pC, pD], 'rgba(251, 191, 36, 0.24)', CCOL.gold, 3.0, 1);
          cline(pA, pB, CCOL.green, 3.8, [], true, 2);
          cline(pC, pD, CCOL.green, 3.8, [], true, 2);
          carrows(pA, pB, 1, CCOL.green, 7.5); // [표시 보강] 평행 표시는 두 선이 같은 방향(아래쪽)을 가리켜야 함
          carrows(pC, pD, 1, CCOL.green, 7.5);

          // 접점 T를 지나는 공통내접선 PQ!
          const pP = cpt(pT.x, cy + 115 * s), pQ = cpt(pT.x, cy - 115 * s); // [표시 보강] 본문의 ∠BTP·∠CTQ 가 접선과 현이 이루는 각이 되도록 P 는 아래, Q 는 위
          cline(pP, pQ, CCOL.pink, 3.4, [6, 4], true, 0);

          // [표시 보강] ∠A = ∠BTP(접선과 현이 이루는 각) = ∠CTQ(맞꼭지각) = ∠D(접선과 현이 이루는 각): 모두 같은 색(금색)·같은 호 한 개·같은 기호 •
          cangle(pA, pB, pT, CCOL.gold, 24, 1, '•');
          cangle(pD, pC, pT, CCOL.gold, 22, 1, '•', '(엇각)');
          cangle(pT, pB, pP, CCOL.gold, 24, 1, '•');
          cangle(pT, pC, pQ, CCOL.gold, 24, 1, '•');

          cdot(pT, 'T(외접점)', CCOL.pink, null, { x: 16, y: -6 });
          cdot(pP, 'P(공통내접선)', CCOL.pink, null, { x: 0, y: 18 });
          cdot(pQ, 'Q', CCOL.pink, null, { x: 0, y: -14 });
          cdot(pA, 'A', CCOL.white, O1); cdot(pB, 'B', CCOL.white, O1);
          cdot(pC, 'C', CCOL.white, O2); cdot(pD, 'D(AB∥CD!)', CCOL.white, O2);
        } else if (sub === 'twoCirclesInTangent') {
          const rBig = 128 * s, rSml = 78 * s;
          const pT = cpt(cx, cy + rBig);
          const O_big = cpt(cx, cy), O_sml = cpt(cx, pT.y - rSml);

          ccircle(O_big, rBig, CCOL.cyan, 'rgba(56, 189, 248, 0.06)', 2.8);
          ccircle(O_sml, rSml, CCOL.gold, 'rgba(251, 191, 36, 0.12)', 2.8);

          // [2.0 수정] 원본은 C, D가 고정(밑각 67.5°)이라 세 각의 θ 표시와 그림이 달랐습니다 → 호 TD = 2θ 가 되도록 C, D를 배치(∠TCD = ∠TDC = θ)
          const pC = cpolar(O_big, rBig, 90 + 2 * ang), pD = cpolar(O_big, rBig, 90 - 2 * ang);
          const pA = clerp(pT, pC, rSml / rBig), pB = clerp(pT, pD, rSml / rBig);
          const pP = cpt(cx - 165 * s, pT.y), pQ = cpt(cx + 165 * s, pT.y);

          cpoly([pT, pC, pD], 'rgba(56, 189, 248, 0.16)', CCOL.cyan, 2.8, 1);
          cpoly([pT, pA, pB], 'rgba(251, 191, 36, 0.28)', CCOL.gold, 3.0, 1);
          cline(pA, pB, CCOL.green, 3.8, [], true, 2);
          cline(pC, pD, CCOL.green, 3.8, [], true, 2);
          cline(pP, pQ, CCOL.pink, 3.6, [], true, 0);

          carrows(pA, pB, 1, CCOL.green, 7.5);
          carrows(pC, pD, 1, CCOL.green, 7.5);
          // [표시 보강] 본문대로 ∠ATP(공통접선과 현이 이루는 각) = ∠ABT = ∠CDT: 같은 색(금색)·같은 호 한 개 (A 는 TC 위의 점이라 ∠ATP = ∠CTP)
          cangle(pT, pA, pP, CCOL.gold, 30, 1, `${ang}°`);
          cangle(pB, pA, pT, CCOL.gold, 22, 1, `${ang}°`);
          cangle(pD, pC, pT, CCOL.gold, 26, 1, `${ang}°`, '(동위각!)');

          cdot(pT, 'T(내접점)', CCOL.pink, null, { x: 0, y: 22 });
          cdot(pA, 'A', CCOL.gold, O_sml); cdot(pB, 'B', CCOL.gold, O_sml);
          cdot(pC, 'C', CCOL.cyan, O_big); cdot(pD, 'D(AB∥CD!)', CCOL.cyan, O_big);
        } else {
          // tangentDiameterExt (지름 연장선 위 점 P에서 그은 접선 PT)
          const cO = cpt(cx - 48 * s, cy + 15 * s);
          const rC = 96 * s;
          const pA = cpt(cO.x - rC, cO.y), pB = cpt(cO.x + rC, cO.y);
          const pP = cpt(cO.x + rC * 1.8, cO.y);
          const alpha = Math.acos(rC / (rC * 1.8));
          const pT = cpt(cO.x + rC * Math.cos(-alpha), cO.y + rC * Math.sin(-alpha));

          ccircle(cO, rC, CCOL.cyan, 'rgba(56, 189, 248, 0.08)', 2.8);
          cline(pA, pP, CCOL.white, 2.8);
          cpoly([cO, pT, pP], 'rgba(251, 191, 36, 0.28)', CCOL.gold, 3.2, 0);
          if (t > 0.3 || state.activePartIdx === 1) {
            cpoly([pA, pT, pB], 'rgba(56, 189, 248, 0.18)', CCOL.cyan, 2.4, 1);
            cright(pT, pA, pB, 11, CCOL.cyan);
          } else cline(pA, pT, 'rgba(56, 189, 248, 0.5)', 2, [5, 4]); // [표시 보강] 원주각 • 의 변 BT 를 보조로 표시
          cline(pB, pT, CCOL.cyan, 2.8);
          cright(pT, cO, pP, 13, CCOL.gold);

          // [표시 보강] 본문 기준 점 이름: 지름의 양 끝은 A(P 에 가까운 쪽)·B(먼 쪽). 원주각 ∠ABT = 접선과 현이 이루는 각 ∠PTA = • (28°): 같은 색(하늘색)·같은 호 한 개
          cangle(pA, pB, pT, CCOL.cyan, 28, 1, '28°', '•');
          cangle(pT, pP, pB, CCOL.cyan, 28, 1, '28°', '•');
          cangle(cO, pT, pP, CCOL.gold, 26, 2, '56°(2•)');
          cangle(pP, pT, cO, CCOL.pink, 32, 1, 'x=34°!');

          cdot(cO, 'O', CCOL.white, null, { x: 0, y: 20 });
          cdot(pA, 'B', CCOL.white, null, { x: -14, y: 16 }); // [표시 보강] 본문과 같게 P 에 가까운 끝이 A, 먼 끝이 B
          cdot(pB, 'A', CCOL.white, null, { x: 0, y: 20 });
          cdot(pP, 'P(x=34°)', CCOL.pink, null, { x: 14, y: 16 });
          cdot(pT, 'T(접점, 90°)', CCOL.gold, null, { x: 0, y: -16 });
        }
      }

      // =====================================================================
      // [모드 6] 원과 비례(할선·접선) & 시험장 착시 반례 연구소
      // =====================================================================
      else {
        if (sub === 'trapArcVsChord') {
          ccircle(O, Rpx, CCOL.cyan, 'rgba(56, 189, 248, 0.07)', 2.8);
          const pA = cpolar(O, Rpx, 150), pB = cpolar(O, Rpx, 30);
          const pC = cpolar(O, Rpx, 90);
          const pP = cpolar(O, Rpx, -90);

          carc(O, Rpx, 30, 150, CCOL.green, 5.5, false, 0);
          cpoly([pC, pA, pB], 'rgba(244, 63, 94, 0.28)', CCOL.red, 3.2, 1);
          cline(pP, pA, 'rgba(255,255,255,0.45)', 2);
          cline(pP, pB, 'rgba(255,255,255,0.45)', 2);
          cline(pP, pC, 'rgba(255,255,255,0.45)', 2, [4, 4]);
          cline(pA, pB, CCOL.red, 4.2, [], true, 1);
          cline(pA, pC, CCOL.green, 3.6, [], true, 0);
          cline(pC, pB, CCOL.green, 3.6, [], true, 0);

          cticks(pA, pC, 2, CCOL.white, 8); // [표시 보강] 호 AC = 호 CB 이므로 현 AC = CB
          cticks(pC, pB, 2, CCOL.white, 8);
          cangle(pP, pA, pC, CCOL.green, 28, 1, '30°'); // [표시 보강] 같은 호의 원주각 → 같은 색·같은 호 한 개 (값은 따로 놓음)
          cangle(pP, pC, pB, CCOL.green, 28, 1, '30°');
          cbadge(pA, pB, '큰 현 AB < 2·AC (2배 아님 ❌!)', CCOL.red, -18, 0.5, 1);

          cdot(O, 'O', CCOL.white, null, { x: 14, y: 0 });
          cdot(pP, 'P(원주각 30°+30°=60°)', CCOL.white, O);
          cdot(pA, 'A', CCOL.white, O);
          cdot(pB, 'B', CCOL.white, O);
          cdot(pC, 'C(호 이등분점: AC+CB > AB!)', CCOL.gold, null, { x: 0, y: 22 });
        } else if (sub === 'powerInside') {
          ccircle(O, Rpx, CCOL.cyan, 'rgba(56, 189, 248, 0.07)', 2.8);
          const pA = cpolar(O, Rpx, -145), pB = cpolar(O, Rpx, 25);
          const pC = cpolar(O, Rpx, 140), pD = cpolar(O, Rpx, -45);
          // 두 현의 교점 P
          const u1 = csub(pB, pA), v1 = csub(pD, pC);
          const det = u1.x * v1.y - u1.y * v1.x || 1;
          const w1 = csub(pC, pA);
          const k1 = (w1.x * v1.y - w1.y * v1.x) / det;
          const pP = cadd(pA, cmul(u1, k1));

          cpoly([pP, pA, pC], 'rgba(251, 191, 36, 0.28)', CCOL.gold, 2.8, 0);
          cpoly([pP, pD, pB], 'rgba(56, 189, 248, 0.28)', CCOL.cyan, 2.8, 1);
          cline(pA, pB, CCOL.gold, 3.8, [], true, 0);
          cline(pC, pD, CCOL.cyan, 3.8, [], true, 1);

          // [표시 보강] 맞꼭지각 ∠APC = ∠DPB(초록 한 호 •), 호 CB 의 원주각 ∠CAB = ∠CDB(분홍 두 호 ×) → △PAC ∽ △PDB
          cangle(pP, pA, pC, CCOL.green, 26, 1, '•');
          cangle(pP, pD, pB, CCOL.green, 26, 1, '•');
          cangle(pA, pP, pC, CCOL.pink, 24, 2, '×');
          cangle(pD, pB, pP, CCOL.pink, 24, 2, '×');
          cbadge(pP, pA, 'PA = 3', CCOL.gold, -15, 0.5, 0);
          cbadge(pP, pB, 'PB = 8', CCOL.gold, -15, 0.5, 0);
          cbadge(pP, pC, 'PC = 4', CCOL.cyan, 15, 0.5, 1);
          cbadge(pP, pD, 'PD = 6', CCOL.cyan, 15, 0.5, 1);

          cdot(pP, 'P(3×8 = 4×6 = 24!)', CCOL.white, null, { x: 0, y: -16 });
          [pA, pB, pC, pD].forEach((p, i) => cdot(p, 'ABCD'[i], CCOL.white, O));
        } else if (sub === 'powerOutside' || sub === 'powerTangentSecant') {
          const cO = cpt(cx - 52 * s, cy);
          const rC = 96 * s;
          ccircle(cO, rC, CCOL.cyan, 'rgba(56, 189, 248, 0.08)', 2.8);
          const pP = cpt(cx + 158 * s, cy);
          // [2.0 수정] 원본의 A, B(와 C, D)는 P에서 나가는 직선 위에 있지 않아 '할선'이 점 A를 지나지 않았습니다.
          //            P에서 나가는 직선(위쪽 22°, 아래쪽 6°)이 원과 만나는 가까운 점·먼 점으로 잡습니다.
          const secant = (deg) => {
            const a = (deg * Math.PI) / 180, d = { x: Math.cos(a), y: Math.sin(a) };
            const bq = d.x * (pP.x - cO.x) + d.y * (pP.y - cO.y), c2 = (pP.x - cO.x) ** 2 + (pP.y - cO.y) ** 2 - rC * rC;
            const q = Math.sqrt(Math.max(0, bq * bq - c2));
            return { near: cadd(pP, cmul(d, -bq - q)), far: cadd(pP, cmul(d, -bq + q)) };
          };
          const sUp = secant(202);
          const pB = sUp.far, pA = sUp.near;

          if (sub === 'powerOutside') {
            const sLow = secant(174); // [2.0 수정] 아래쪽 할선 위의 C(가까운 점), D(먼 점)
            const pD = sLow.far, pC = sLow.near;
            cpoly([pA, pB, pD, pC], 'rgba(52, 211, 153, 0.18)', CCOL.green, 2.4);
            cline(pP, pB, CCOL.gold, 3.6, [], true, 0);
            cline(pP, pD, CCOL.cyan, 3.6, [], true, 1);
            cline(pA, pD, 'rgba(255,255,255,0.5)', 2, [5, 4]); // [표시 보강] △PAD ∽ △PCB 의 변 AD, CB (닮음의 각을 표시하기 위한 보조선)
            cline(pC, pB, 'rgba(255,255,255,0.5)', 2, [5, 4]);

            // [2.0 수정] 긴 이름표 'AB = 5 (전체 PB=9!)'·'CD = 9 (전체 PD=12!)'가 휴대폰에서 원 속 할선을 거의 다 가렸습니다 → 이름표는 짧게, 전체 길이와 곱셈식은 그림 아래 글로 옮깁니다.
            // [표시 보강] 공통각 ∠P(초록 •), ∠PAD = ∠PCB(분홍 ×), ∠PDA = ∠PBC(금색 두 호 ○) → △PAD ∽ △PCB
            cangle(pP, pB, pD, CCOL.green, 30, 1, '•');
            cangle(pA, pP, pD, CCOL.pink, 24, 1, '×');
            cangle(pC, pP, pB, CCOL.pink, 24, 1, '×');
            cangle(pD, pP, pA, CCOL.gold, 24, 2, '○');
            cangle(pB, pP, pC, CCOL.gold, 24, 2, '○');
            cbadge(pP, pA, 'PA = 4', CCOL.gold, -15, 0.5, 0);
            cbadge(pA, pB, 'AB = 5', CCOL.gold, -16, 0.5, 0);
            cbadge(pP, pC, 'PC = 3', CCOL.cyan, 15, 0.5, 1);
            cbadge(pC, pD, 'CD = 9', CCOL.cyan, 16, 0.5, 1);

            [pA, pB, pC, pD].forEach((p, i) => cdot(p, 'ABCD'[i], CCOL.white, cO));
            cdot(pP, 'P', CCOL.gold, null, { x: 0, y: -16 });
            cnote(cpt(cO.x + 40 * s, cO.y + rC + 34 * s), ['전체 PB = 9, PD = 12', '4×9 = 3×12 = 36!'], '#fbbf24');
          } else {
            const alpha = Math.acos(rC / cdist(cO, pP));
            const pT = cpt(cO.x + rC * Math.cos(alpha), cO.y + rC * Math.sin(alpha));
            cpoly([pP, pB, pT], 'rgba(56, 189, 248, 0.18)', CCOL.cyan, 2.4, 1);
            cpoly([pP, pA, pT], 'rgba(251, 191, 36, 0.30)', CCOL.gold, 3.0, 0);
            cline(pP, pT, CCOL.gold, 4.0, [], true, 0);
            cline(pP, pB, CCOL.pink, 3.6, [], true, 1);

            // [2.0 수정] 위 장면과 같은 이유로 긴 이름표를 줄였습니다(전체 PB = 9 는 아래 풀이·띠에, 6² = 4×9 = 36 은 P의 이름표에 있음).
            // [표시 보강] 공통각 ∠P(초록 •), 접선과 현이 이루는 각 ∠PTA = 원주각 ∠PBT(분홍 두 호 ×) → △PAT ∽ △PTB
            cangle(pP, pT, pB, CCOL.green, 30, 1, '•');
            cangle(pT, pP, pA, CCOL.pink, 24, 2, '×');
            cangle(pB, pP, pT, CCOL.pink, 24, 2, '×');
            cbadge(pP, pT, '접선 PT = 6', CCOL.gold, 18, 0.5, 0);
            cbadge(pP, pA, 'PA = 4', CCOL.pink, -15, 0.5, 1);
            cbadge(pA, pB, 'AB = 5', CCOL.pink, -16, 0.5, 1);

            cdot(pA, 'A', CCOL.white, cO);
            cdot(pB, 'B', CCOL.white, cO);
            cdot(pT, 'T(접점)', CCOL.gold, cO);
            cdot(pP, 'P(6² = 4×9 = 36!)', CCOL.gold, null, { x: 0, y: -16 });
          }
        } else {
          // trapCyclicQuadFamily: 좌측 등변사다리꼴(항상 내접 ⭕) vs 우측 마름모/평행사변형(내접 안 함 ❌)
          const O_left = cpt(cx - 145 * s, cy), O_right = cpt(cx + 145 * s, cy);
          const rSmall = 88 * s;

          // 좌측: 등변사다리꼴 (⭕)
          ccircle(O_left, rSmall, CCOL.green, 'rgba(52, 211, 153, 0.08)', 2.6, [], 1);
          const iA = cpolar(O_left, rSmall, -125), iD = cpolar(O_left, rSmall, -55);
          const iB = cpolar(O_left, rSmall, 150), iC = cpolar(O_left, rSmall, 30);
          cpoly([iA, iB, iC, iD], 'rgba(52, 211, 153, 0.26)', CCOL.green, 3.2, 1);
          // [표시 보강] 꼭짓점 이름과 각(값은 현재 점에서 계산): 등변사다리꼴은 ∠A = ∠D(금색 한 호), ∠B = ∠C(하늘색 두 호), ∠A + ∠C = 180°
          [iA, iB, iC, iD].forEach((p, i) => cdot(p, 'ABCD'[i], CCOL.green, O_left));
          cangle(iA, iD, iB, CCOL.gold, 17, 1, `${fmtNum(cdeg(iA, iD, iB))}°`);
          cangle(iD, iC, iA, CCOL.gold, 17, 1, `${fmtNum(cdeg(iD, iC, iA))}°`);
          cangle(iB, iA, iC, CCOL.cyan, 17, 2, `${fmtNum(cdeg(iB, iA, iC))}°`);
          cangle(iC, iB, iD, CCOL.cyan, 17, 2, `${fmtNum(cdeg(iC, iB, iD))}°`);

          // 우측: 평행사변형/마름모 (❌ - 한 꼭짓점이 원 밖으로 삐져나감!)
          ccircle(O_right, rSmall, CCOL.red, 'rgba(244, 63, 94, 0.06)', 2.4, [5, 4], 2);
          const p1 = cpolar(O_right, rSmall, -130), p2 = cpolar(O_right, rSmall, 140), p3 = cpolar(O_right, rSmall, 40);
          const p4 = cadd(p1, csub(p3, p2)); // 평행사변형의 네 번째 꼭짓점 (원 밖으로 벗어남!)
          cpoly([p1, p2, p3, p4], 'rgba(244, 63, 94, 0.24)', CCOL.red, 3.2, 2);
          // [표시 보강] 평행사변형: 마주 보는 각이 같다(∠A = ∠C 빨강 한 호, ∠B = ∠D 분홍 두 호). 값은 현재 점에서 계산
          cangle(p1, p4, p2, CCOL.red, 17, 1, `${fmtNum(cdeg(p1, p4, p2))}°`);
          cangle(p3, p2, p4, CCOL.red, 17, 1, `${fmtNum(cdeg(p3, p2, p4))}°`);
          cangle(p2, p1, p3, CCOL.pink, 17, 2, `${fmtNum(cdeg(p2, p1, p3))}°`);
          cangle(p4, p3, p1, CCOL.pink, 17, 2, `${fmtNum(cdeg(p4, p3, p1))}°`);
          [p1, p2, p3].forEach((p, i) => cdot(p, 'ABC'[i], CCOL.white, O_right));
          cdot(p4, '원 밖의 점!(∠A+∠C≠180°)', CCOL.red, null, { x: 0, y: -14 });

          // [2.0 수정] 캔버스 직접 글자 → 무대 글자. 같은 문구를 두 줄로 나눠 좁은 화면에서도 두 설명이 겹치지 않게 합니다.
          cnote(cpt(O_left.x, O_left.y + rSmall + 28 * s), ['⭕ 등변사다리꼴·직사각형·정사각형', '(대각 합 180°)'], '#34d399');
          cnote(cpt(O_right.x, O_right.y + rSmall + 28 * s), ['❌ 평행사변형·마름모', '(대각 합 ≠ 180° ➔ 내접 불가!)'], '#fb7185');
        }
      }
    }

  /* ===== 원본 그대로: 효과 없는 렌즈 버튼 숨김 표 (원본 2415–2422행) ===== */
    const LENS_OFF = {
      tangentPerimTri: ['sides'], pitotQuad: ['sides'], inscribedMoveArc: ['angles'], thalesSemiCircle: ['angles'],
      fourPointsCircle: ['angles'], cyclicPentagon: ['angles'], cyclicQuad180: ['angles'], cyclicExterior: ['angles'],
      cyclicCrossExt: ['angles'], cyclicConditions3: ['angles'], altSegmentThm: ['angles'],
      altSegmentInscribed: ['angles'], twoCirclesExTangent: ['angles'], twoCirclesInTangent: ['angles'],
      tangentDiameterExt: ['angles'], powerInside: ['sides'], powerOutside: ['sides'], powerTangentSecant: ['sides'],
      trapCyclicQuadFamily: ['angles', 'sides', 'aux']
    };

  /* ======================================================================
     2.0 셸 연결 (새로 작성한 부분)
     ====================================================================== */
  const TABS = ['원과 현 · 원 접기 · 아치의 반지름', '원과 접선 · 내접원 · 원에 외접하는 사각형', '원주각=½중심각 · 반원90° · 삼각비', '내접사각형(180°) · 외각 · 오각형', '접선과 현이 이루는 각(∠BAT=∠BCA) & 두 원의 접선', '원과 비례(할선·접선) & 원에 내접하지 않는 사각형'];
  const SHORT = ['원과 현', '원과 접선', '원주각', '내접사각형', '접선과 현', '원과 비례'];
  const LENSES = [
    ['all', '🔍 전체 보기'],
    ['angles', '📐 원주각·중심각·접선과 현이 이루는 각'],
    ['sides', '📏 현·접선·길이가 같은 선분 표시(|,||)'],
    ['aux', '🪄 지름·보조선']
  ];
  // 이 장면에서 '변환(0→100%)'이 실제로 그림을 바꾸는 장면만 변환 조절을 보여 줍니다(원본 그리기 코드의 t 사용처).
  const FOLD = new Set(['chordFoldArc', 'chordEqualDist', 'chordArchRadius', 'tangentPerimTri', 'inscribedMoveArc', 'thalesSemiCircle', 'inscribedTrig', 'fourPointsCircle', 'cyclicQuad180', 'altSegmentThm', 'tangentDiameterExt']);
  // 기준각 θ(30·45·60·70°) / 반지름 R(6·8·10·12) 선택이 실제로 그림·수치를 바꾸는 장면과 그 이름(지름 반원 장면은 해설 속 예시 수치만 바뀌어 제외)
  const ANG_NAME = {
    tangentLen: '점 P의 각 ∠APB', inscribedAngle3Cases: '원주각 θ (중심각 2θ)', inscribedMoveArc: '원주각 θ', fourPointsCircle: '원주각 θ',
    cyclicPentagon: '원주각 θ (중심각 2θ)', cyclicQuad180: '∠A = θ + 35°', cyclicExterior: '∠A = θ + 35°', cyclicConditions3: '∠A = θ + 35°',
    altSegmentThm: '접선과 현이 이루는 각 θ', altSegmentInscribed: '접선과 현이 이루는 각 θ', twoCirclesExTangent: '기준각 θ', twoCirclesInTangent: '접선과 현이 이루는 각 θ'
  };
  const RAD_USED = new Set(['chordFoldArc', 'chordBisect', 'chordEqualDist', 'chordConcentric', 'tangentPerimTri', 'inscribedTrig']);
  // [2.0 수정] 현의 두 장면은 OM = 0.6R, AM = 0.8R 을 반올림해 쓰므로 R이 5의 배수일 때만 피타고라스(3-4-5)가 정확합니다 → 그 값만 제공
  const RAD_LIST = { chordBisect: [5, 10, 15, 20], chordEqualDist: [5, 10, 15, 20] };
  const radList = (id) => RAD_LIST[id] || RAD_PRESETS;
  // [2.0 수정] θ에 따라 그림의 가로 길이가 크게 달라지는 장면: θ를 바꿀 때마다 화면 맞춤을 다시 계산합니다.
  const REFIT = new Set(['tangentLen']);
  const THUMB_T = (id) => (FOLD.has(id) ? (id === 'fourPointsCircle' ? 0 : 1) : 0); // 원본: 장면에 들어가면 변환이 100%로 자동 재생(네 점 장면만 0%)

  const lensList = (m, id) => {
    const off = (LENS_OFF[m] || []).concat(LENS_OFF[id] || []);
    const rest = ['angles', 'sides', 'aux'].filter((x) => !off.includes(x));
    return rest.length ? ['all'].concat(rest) : []; // 원본 syncLensButtons: 효과 있는 렌즈가 하나도 없으면 렌즈 전체를 숨김
  };
  function sync(s, m, id) {
    state.mode = m;
    state.subType[m] = id;
    state.fold = s.fold;
    state.angPreset = Math.round(s.ang);
    state.radPreset = Math.round(s.rad);
    // [2.0 수정] 예전 공유 링크 등으로 R이 3-4-5 가 안 되는 값(6·8·12)으로 들어와도 가장 가까운 정확한 값으로 맞춥니다.
    if (RAD_LIST[id] && !RAD_LIST[id].includes(state.radPreset)) state.radPreset = RAD_LIST[id].reduce((p, v) => (Math.abs(v - state.radPreset) < Math.abs(p - state.radPreset) ? v : p));
    state.activePartIdx = s.part == null ? -1 : s.part;
    state.conceptSwitch = lensList(m, id).includes(s.lens) ? s.lens : 'all';
    state.scale = 1;
  }
  // 셸은 이모지(➔ ⭕ ❌ 포함)를 화면 표시에서 떼어 내므로, 문장 속 뜻이 사라지지 않게 → ○ × 로 미리 바꿔 넘깁니다(원문 getSpec은 그대로).
  const arrow = (v) => (typeof v === 'string' ? v.replace(/➔/g, '→').replace(/⭕/g, '○').replace(/❌/g, '×') : Array.isArray(v) ? v.map(arrow) : v && typeof v === 'object' ? Object.fromEntries(Object.entries(v).map(([k, x]) => [k, arrow(x)])) : v);
  // 원본 해설 문장 일부가 **굵게** 마크다운을 썼는데 원본 화면은 별표가 그대로 보였습니다 → 굵은 글씨로
  const md = (s) => String(s == null ? '' : s).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  let booted = false;

  function sceneOf(m, it) {
    const id = it.id;
    const label = arrow(it.label);
    return {
      id, title: label, short: label, reviewTab: true, autoFit: true,
      notesTitle: '오답 함정과 풀이 요령',
      enter: (s, lab) => {
        // 원본 setSubType: 변환을 0%로 되돌린 뒤 100%로(네 점 장면은 0%) 자동 재생
        s.fold = 0;
        if (!radList(id).includes(Math.round(s.rad))) s.rad = 10; // [2.0 수정] 현 장면은 5·10·15·20 만 사용
        if (!lensList(m, id).includes(s.lens)) s.lens = 'all';
        const shared = !booted && /[#&]fold=/.test(location.hash); // 공유 링크의 값은 그대로 존중
        booted = true;
        if (lab && s === lab.s && FOLD.has(id) && id !== 'fourPointsCircle' && !shared) lab.tween({ fold: 1 }, 1300);
      },
      controls: () => (FOLD.has(id) ? ['fold'] : []),
      presets: () => {
        const out = [];
        if (ANG_NAME[id]) ANG_PRESETS.forEach((v) => out.push({ group: ANG_NAME[id], label: `${v}°`, apply: (st) => { st.ang = v; }, on: (st) => Math.round(st.ang) === v }));
        if (RAD_USED.has(id)) radList(id).forEach((v) => out.push({ group: '반지름 / 기준 길이 R (cm)', label: `R=${v}`, apply: (st) => { st.rad = v; }, on: (st) => Math.round(st.rad) === v }));
        const lenses = lensList(m, id);
        if (lenses.length) LENSES.filter(([k]) => lenses.includes(k)).forEach(([k, label]) => out.push({ group: '보기 선택', label, apply: (st) => { st.lens = k; }, on: (st) => st.lens === k }));
        if (FOLD.has(id)) [0, 0.5, 1].forEach((v) => out.push({ group: '변환 단계', label: v === 0 ? '0% 시작' : v === 1 ? '100% 완성' : '50%', set: { fold: v }, ms: 700, on: (st) => Math.abs(st.fold - v) < 0.01 }));
        return out;
      },
      actions: () => {
        if (!FOLD.has(id)) return [];
        return [{
          id: 'act', play: true, primary: true, icon: 'wand',
          label: (st) => { sync(st, m, id); return getSpec().actionTxt; },
          run: (st, lab) => { lab.tween({ fold: st.fold > 0.5 ? 0 : 1 }, 1100); }
        }];
      },
      view: (s) => {
        sync(s, m, id);
        const spec = arrow(getSpec());
        const wide = (t) => String(t).length > 14;
        return {
          guide: `<div style="font-weight:800;margin-bottom:6px">${APLab.esc(APLab.stripEmoji(spec.badge))}</div>${md(spec.hint)}`,
          readouts: [
            { label: spec.dim1Name, value: spec.val1Txt, color: 'sky', wide: wide(spec.val1Txt) },
            { label: spec.dim2Name, value: spec.val2Txt, color: 'rose', wide: wide(spec.val2Txt) }
          ],
          parts: spec.parts.map((p) => ({ id: p.id, name: p.name, desc: p.desc, value: p.val, color: p.ok === false ? 'red' : p.color, ok: p.ok })),
          summary: spec.totalRes,
          rule: spec.rule,
          formula: md(spec.formulaHTML),
          notes: md(spec.notes),
          tape: { title: spec.tapeTitle, segments: spec.tapeSegs }
        };
      },
      draw: (b, s, v, lab) => {
        BOARD = b;
        const paint = (st) => {
          sync(st, m, id);
          if (st.grid) b.grid({ step: 38 });
          // 두 번 훑기: 1회 점 위치 수집 → 2회 그리기(이름표가 점·다른 이름표와 겹치지 않게 놓음)
          PL.obst = [];
          PL.placed = [];
          PL.segs = []; PL.arcs = []; // [표시 보강]
          PL.pass = 1;
          drawCircleMasterScene(0, 0, state.fold, null);
          PL.pass = 2;
          PL.placed = [];
          drawCircleMasterScene(0, 0, state.fold, null);
        };
        // 자동 맞춤을 재는 중: 변환 0%·100%와 모든 기준각 상태를 겹쳐 그려, 어느 상태에서도 그림·글자가 잘리지 않는 범위를 구합니다.
        const paintAll = () => {
          (FOLD.has(id) ? [0, 1] : [s.fold]).forEach((f) => (ANG_NAME[id] && !REFIT.has(id) ? ANG_PRESETS : [s.ang]).forEach((a) => paint({ ...s, fold: f, ang: a })));
        };
        if (b._bbox) { paintAll(); return; }
        if (b.thumb) { // 모든 장면 미리보기: 장면 범위를 직접 재어 맞추고, 원본의 '완성' 상태로 그림
          const bb = b.measure(paintAll);
          if (bb) b.focus = b.fitBox(bb, { margin: 0.08, px: 5 });
          paint({ ...s, fold: THUMB_T(id), part: null });
          return;
        }
        if (REFIT.has(id) && lab) { // [2.0 수정] θ가 바뀌면(칩·공유 링크) 현재 θ에 맞춰 화면 맞춤을 다시 계산
          const key = id + ':' + Math.round(s.ang);
          if (b.__fitKey !== key) { b.__fitKey = key; const f = lab._measureFocus(lab.scene); if (f) b.setFocus(f, true); }
        }
        paint(s);
      }
    };
  }

  const groups = Object.keys(SUB_MENUS).map((k) => {
    const m = +k;
    return { id: 'm' + m, title: TABS[m - 1], short: SHORT[m - 1], scenes: SUB_MENUS[m].map((it) => sceneOf(m, it)) };
  });

  APLab.createLab({
    id: 'g9-circle',
    title: '원의 성질',
    courseName: '중3',
    unit: '원의 성질 · 원주각과 접선',
    courseColor: 'var(--m-sky)',
    home: '../index.html#g9',
    legacy: '../../labs/g9/원.html',
    board: { kind: 'figure', autoFit: true, minZoom: 0.4, maxZoom: 5 },
    state: { lens: 'all' },
    persist: ['lens'],
    params: {
      fold: { value: 0, min: 0, max: 1, step: 0.005, color: 'amber', label: '변환 진행 (0% → 100%)', hint: '접기 · 점 이동 · 보조선 작도 · 접선 펼치기 같은 변환을 천천히 확인합니다', format: (v) => `${Math.round(v * 100)}%` },
      ang: { value: 45, min: 30, max: 70, step: 1, color: 'sky', label: '기준각 θ', format: (v) => `${Math.round(v)}°` },
      rad: { value: 10, min: 5, max: 20, step: 1, /* [2.0 수정] 현 장면 R=5·15·20 허용 */ color: 'rose', label: '반지름 R', format: (v) => `${Math.round(v)}` }
    },
    groups
  });
});
</script>
