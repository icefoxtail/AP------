<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a100e">
<title>원의 성질 · AP Math 실험실</title>
<meta name="description" content="중3 원의 성질 45개 장면: 도형을 직접 조절해 탐구하고, 현재 문제의 조건을 유지한 단계별 풀이 그림으로 현·접선·원주각·넓이의 원리를 이해합니다.">
<script>try{var t=localStorage.getItem('apl:theme');t=t?JSON.parse(t):'paper';document.documentElement.setAttribute('data-theme',t==='board'?'board':'paper')}catch(e){document.documentElement.setAttribute('data-theme','paper')}</script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="../kit/vendor/katex/katex.min.css">
<link rel="stylesheet" href="../kit/apl.css">
<link rel="stylesheet" href="../kit/apl-video.css">
<script defer src="../kit/vendor/katex/katex.min.js"></script>
<script defer src="../kit/vendor/qrcode.js"></script>
<script defer src="../kit/apl-core.js"></script>
<script defer src="../kit/apl-board.js"></script>
<script defer src="../kit/apl-shell.js"></script>
<script defer src="../kit/apl-video-core.js"></script>
<script defer src="../kit/apl-player.js"></script>
<script defer src="../kit/apl-toc.js"></script>
</head>
<body>
<noscript>이 실험실을 보려면 브라우저에서 자바스크립트를 켜야 합니다.</noscript>
<script>
/* ==========================================================================
   중3 · 원의 성질 (AP Math Lab 2.0) — Ⅲ. 원의 성질
   탭(order 순): ① 현(10) · ② 접선(20) · ③ 내접원·외접사각형(30) · ④ 원주각(40) · ⑤ 내접사각형(50) · ⑥ 접선과 현(60) · ⑦ 원 속 넓이(70)
   이 파일은 얇은 껍데기입니다. 공용 도구는 labs/g9-circle/core.js, 각 탭은 t1~t7.js 모듈이
   window.APL_CI_GROUPS 에 { order, id, title, short, params, scenes } 를 등록하면 order 순으로 붙습니다.
   원칙(학생 가독성)
   - 그림은 무대 가득 · 길이와 각은 그림 안에 크게(화면 기준 14px 이상) · 모든 도형은 막대나 손잡이로 조절
   - 움직임은 가로로만(제자리 회전·접기는 허용). 탐구 → 문제(5지선다 + 숫자 바꾸기) → 현재 문항의 풀이
   - 중3은 제곱근(√)을 배웠으므로 √ 표기를 씁니다. 할선·방멱, 두 원의 공통접선은 [심화]로 표시합니다.
   ========================================================================== */
window.addEventListener('DOMContentLoaded', function () {
'use strict';
const MODULES = ['core', 't1', 't2', 't3', 't4', 't5', 't6', 't7', 'solutions', 'lesson-a', 'lesson-b', 'lesson-c'];
const loadScript = (src) => new Promise((res) => {
  const el = document.createElement('script');
  el.src = src; el.async = false;
  el.onload = () => res(true);
  el.onerror = () => { el.remove(); res(false); }; // 아직 없는 모듈은 건너뜁니다
  document.head.append(el);
});

function start() {
  const mods = (window.APL_CI_GROUPS || []).filter((g) => g && Array.isArray(g.scenes) && g.scenes.length);
  const groups = mods.slice().sort((a, b) => (a.order || 0) - (b.order || 0)).map((g) => ({ id: g.id, title: g.title, short: g.short || g.title, scenes: g.scenes }));
  const params = {};
  mods.forEach((g) => Object.assign(params, g.params || {}));
  APLab.createLab({
    id: 'g9-circle',
    title: '원의 성질',
    courseName: '중3',
    unit: '원의 성질 · 원주각과 접선',
    courseColor: 'var(--m-sky)',
    home: '../index.html#g9',
    legacy: '../../labs/g9/원.html',
    board: { kind: 'figure', pad: 0.02, minZoom: 0.5, maxZoom: 6 },
    // 장면에 들어올 때마다 화면 범위를 처음 상태로 되돌립니다(앞 장면의 확대·위치가 남지 않게). 그림 맞춤은 장면 그리기에서 매번 합니다.
    enter: (s, sc, lab) => { if (lab && lab.board && s === lab.s) { lab.board.fit(); lab.board.setPanes(null); lab.board.setInsets({ top: 0, right: 0, bottom: 0, left: 0 }); } },
    params,
    lessons: (window.APL_LESSONS || {})['g9-circle'] || {},
    groups
  });
}
Promise.all(MODULES.map((m) => loadScript(`g9-circle/${m}.js`))).then(start);
});
</script>
</body>
</html>
