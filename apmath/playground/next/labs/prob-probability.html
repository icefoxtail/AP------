<script>
/* ==========================================================================
   확률과 통계 · 확률 실험실 (AP Math Lab 2.0)
   ① 표본공간 격자 색칠과 덧셈정리·여사건(넓이 사각형)  ② 조건부확률 넓이 사각형·독립·두 단계 시행(나무)
   ③ 독립시행·반복 시행 상태도(점 이동·공 옮기기·동전 뒤집기)와 수천 번 시뮬레이션
   - 목표: 확률을 "전체 넓이 중 칠한 넓이"로 보고, 조건부확률에서 분모가 바뀌는 것을 눈으로 확인합니다.
   - 문제는 평가원·교육청 기출 유형을 숫자·상황만 바꾼 변형이며, 정답은 모두 코드가 전수 열거로 계산합니다.
   - 시뮬레이션 결과는 매번 달라지지만 문제의 정답은 이론값(경로 수)입니다.
   ========================================================================== */
window.addEventListener('DOMContentLoaded', function () {
  const { tex, fmt, clamp } = APLab;

  /* ---------- 0. 순수 수학 (그림과 무관: 개수·분수·상태도 계산) ---------- */
  const gcd = (a, b) => (b ? gcd(b, a % b) : Math.abs(a));
  function fr(n, d) { if (d < 0) { n = -n; d = -d; } const g = gcd(n, d) || 1; return { n: n / g, d: d / g }; }
  const frTex = (f) => (f.d === 1 ? `${f.n}` : `\\dfrac{${f.n}}{${f.d}}`);
  const frTexS = (f) => (f.d === 1 ? `${f.n}` : `\\frac{${f.n}}{${f.d}}`);
  const frStr = (f) => (f.d === 1 ? `${f.n}` : `${f.n}/${f.d}`);
  const frVal = (f) => f.n / f.d;
  const pct = (v) => (v * 100).toFixed(1) + '%';
  const rint = (n) => Math.floor(Math.random() * n);

  /* --- 장면 1: 주사위 두 개 표본공간 (a: 첫 번째 눈 = 가로, b: 두 번째 눈 = 세로) --- */
  const CONDS = {
    sum7le: { ph: '$a+b\\le 7$', val: 'sum', f: (a, b) => a + b <= 7 },
    sum9ge: { ph: '$a+b\\ge 9$', val: 'sum', f: (a, b) => a + b >= 9 },
    sum7: { ph: '$a+b=7$', val: 'sum', f: (a, b) => a + b === 7 },
    sumEven: { ph: '$a+b$가 짝수', val: 'sum', f: (a, b) => (a + b) % 2 === 0 },
    prod4: { ph: '$ab$가 4의 배수', val: 'prod', f: (a, b) => (a * b) % 4 === 0 },
    prodOdd: { ph: '$ab$가 홀수', val: 'prod', f: (a, b) => (a * b) % 2 === 1 },
    diff1: { ph: '$|a-b|=1$', val: 'diff', f: (a, b) => Math.abs(a - b) === 1 },
    diff2: { ph: '$|a-b|=2$', val: 'diff', f: (a, b) => Math.abs(a - b) === 2 },
    same: { ph: '$a=b$', val: 'none', f: (a, b) => a === b },
    aLtB: { ph: '$a\\lt b$', val: 'none', f: (a, b) => a < b }
  };
  const COND_IDS = Object.keys(CONDS);
  // 36칸을 차례로: 가로(a) 1→6, 세로(b) 1→6 (읽는 순서: 위 줄부터 왼쪽에서 오른쪽으로)
  function gridCells(idA, idB) {
    const out = [];
    for (let b = 1; b <= 6; b++) for (let a = 1; a <= 6; a++) {
      const inA = CONDS[idA].f(a, b), inB = idB ? CONDS[idB].f(a, b) : false;
      out.push({ a, b, i: out.length, inA, inB });
    }
    return out;
  }
  function gridCounts(idA, idB) {
    const c = gridCells(idA, idB);
    const nA = c.filter((x) => x.inA).length, nB = c.filter((x) => x.inB).length, nI = c.filter((x) => x.inA && x.inB).length;
    return { nA, nB, nI, nU: nA + nB - nI, nAc: 36 - nA, only: { A: nA - nI, B: nB - nI, none: 36 - nA - nB + nI } };
  }

  /* --- 장면 3: 반복 시행 상태 추적 엔진 --- */
  // cfg.kind: 'walk' 점 이동 / 'ball' 공 옮기기 / 'coin' 동전 뒤집기
  // 한 번의 시행은 K가지(주사위 K=6, 동전 고르기 K=m)가 같은 확률로 나옵니다.
  function makeMachine(cfg) {
    const n = cfg.n;
    const M = { cfg, n };
    let next, label, given = null, target, rowLo, rowHi, K, s0 = 0, flagAt = null, facesName;
    if (cfg.kind === 'walk') {
      K = 6; facesName = '눈';
      const move = cfg.move, back = cfg.other === 'back';
      next = (x, f) => (move.includes(f) ? x + 1 : back ? x - 1 : x);
      label = (x) => String(x);
      rowLo = back ? -n : 0; rowHi = n;
      target = (p) => p[n] >= cfg.thr;
    } else if (cfg.kind === 'ball') {
      K = 6; facesName = '눈';
      const { th, wAdd, bAdd } = cfg;
      next = (w, f) => (f >= th ? w + 1 : w);
      label = (w, t) => `${wAdd * w},${bAdd * (t - w)}`;
      rowLo = 0; rowHi = n;
      flagAt = (w, t) => t >= 1 && wAdd * w === bAdd * (t - w);
      given = (p) => wAdd * p[n] + bAdd * (n - p[n]) >= cfg.T;
      target = (p) => { for (let t = 1; t <= n; t++) if (flagAt(p[t], t)) return true; return false; };
    } else {
      K = cfg.m; facesName = '동전';
      const m = cfg.m;
      s0 = cfg.h0;
      next = (h, f) => (f <= h ? h - 1 : h + 1); // 경로 수 계산용 선택지: 앞면 h개 / 뒷면 m-h개 (실제 번호별 조작은 별도 mask로 유지)
      label = (h) => String(h);
      rowLo = 0; rowHi = m;
      given = (p) => p[n] === 0 || p[n] === m;
      target = (p) => p[n] === m;
    }
    Object.assign(M, { K, s0, next, label, rowLo, rowHi, flagAt, facesName });
    // 시점 t의 상태별 경로 수(주사위 눈 순서쌍의 개수)와 간선(같은 곳으로 가는 눈들을 묶음)
    const cnt = [new Map([[s0, 1]])];
    const edges = [];
    for (let t = 0; t < n; t++) {
      const nx = new Map();
      const ed = [];
      for (const [k, c] of cnt[t]) {
        const grp = new Map();
        for (let f = 1; f <= K; f++) {
          const to = next(k, f);
          if (!grp.has(to)) grp.set(to, []);
          grp.get(to).push(f);
        }
        for (const [to, fs] of grp) {
          ed.push({ t, from: k, to, faces: fs, w: fs.length });
          nx.set(to, (nx.get(to) || 0) + c * fs.length);
        }
      }
      cnt.push(nx);
      edges.push(ed);
    }
    M.cnt = cnt; M.edges = edges; M.total = Math.pow(K, n);
    // 전체 K^n 가지를 직접 세어 사건의 경로 수를 구합니다(경로 전체를 보는 사건도 같은 방법)
    let tg = 0, gv = 0;
    const path = new Array(n + 1);
    (function rec(t, k) {
      path[t] = k;
      if (t === n) {
        const g = given ? given(path) : true;
        if (g) { gv++; if (target(path)) tg++; }
        return;
      }
      for (let f = 1; f <= K; f++) rec(t + 1, next(k, f));
    })(0, s0);
    M.tgtN = tg; M.givN = gv;
    M.P = gv ? fr(tg, gv) : { n: 0, d: 1 };
    M.noGiven = gv === 0; // 조건에 맞는 경로가 하나도 없음(예: 동전 뒤집기의 홀짝이 맞지 않음)
    M.given = given; M.target = target;
    M.hasGiven = !!given;
    // 마지막 시점에서 사건이 일어나는 칸(칠하기용): 마지막 상태만으로 정해지는 사건일 때만
    M.finalHit = cfg.kind === 'ball' ? null : (k) => target(Object.assign(new Array(n + 1).fill(0), { [n]: k }));
    M.finalGiven = cfg.kind === 'coin' ? (k) => k === 0 || k === cfg.m : null;
    M.finalKeys = [...cnt[n].keys()].sort((a, b) => a - b);
    return M;
  }
  const coinMask = (h) => (1 << h) - 1;
  const headCount = (mask) => { let h = 0; while (mask) { h += mask & 1; mask >>>= 1; } return h; };
  function resetRun(r, M) { r.faces = []; r.path = [M.s0]; r.mask = M.cfg.kind === 'coin' ? coinMask(M.s0) : null; }
  // 무작위 시행: 한 번의 경로(상태 배열)와 눈 배열
  function runOnce(M) {
    const faces = [], path = [M.s0];
    let k = M.s0, mask = M.cfg.kind === 'coin' ? coinMask(k) : null;
    for (let t = 0; t < M.n; t++) {
      const f = 1 + rint(M.K); faces.push(f);
      if (mask !== null) { mask ^= 1 << (f - 1); k = headCount(mask); }
      else k = M.next(k, f);
      path.push(k);
    }
    return { faces, path };
  }
  // 시뮬레이션 N번 추가(기록 sim 갱신, 1-2-5 간격마다 수렴 그래프 점을 찍음)
  function simulate(M, sim, N) {
    if (sim.conv.length && sim.conv[sim.conv.length - 1].tmp) sim.conv.pop();
    for (let i = 0; i < N; i++) {
      const r = runOnce(M);
      const g = M.given ? M.given(r.path) : true;
      sim.N++;
      sim.fin[r.path[M.n]] = (sim.fin[r.path[M.n]] || 0) + 1;
      if (g) { sim.giv++; if (M.target(r.path)) sim.hit++; }
      if (isCheck(sim.N)) sim.conv.push({ N: sim.N, v: sim.giv ? sim.hit / sim.giv : null });
    }
    const last = sim.conv[sim.conv.length - 1];
    if (!last || last.N !== sim.N) sim.conv.push({ N: sim.N, v: sim.giv ? sim.hit / sim.giv : null, tmp: true }); // 마지막 점(임시)은 다음 호출 때 지웁니다
  }
  function isCheck(N) { if (N < 10) return N === 1 || N === 2 || N === 5; const p = Math.pow(10, Math.floor(Math.log10(N))); return N === p || N === 2 * p || N === 5 * p; }
  const newSim = () => ({ N: 0, giv: 0, hit: 0, fin: {}, conv: [] });

  /* ---------- 1. 화면 도우미 ---------- */
  // 변형 생성기: gen(이전 변형|null) → 새 변형. 처음에는 기출 유형 그대로(gen(null)).
  function varier(gen) { let cur = gen(null); return { cur: () => cur, next: () => (cur = gen(cur)) }; }
  const probHTML = (body) => `${body}<div style="margin-top:10px"><button type="button" class="apl-btn sm" data-pb-new>새 문제</button></div>`;
  document.addEventListener('click', (ev) => {
    const hit = ev.target && ev.target.closest && ev.target.closest('[data-pb-new]');
    if (!hit) return;
    const lab = window.lab, sc = lab && lab.scene;
    if (!sc || !sc.vary) return;
    sc.vary.next();
    if (sc.vary.onNext) sc.vary.onNext(lab.s, lab);
    lab.s.revealed = false;
    lab.setStep(0);
    try { lab._buildReview(); lab._buildProblem(); } catch (e) { /* 키트가 바뀌어도 그림은 그대로 */ }
    lab.invalidate(true);
  });
  const reviewTop = (text) => () => `<div class="apl-rich" style="font-size:var(--fs-sm);line-height:1.75"><small style="color:var(--text-3);font-weight:800">문제</small><br>${text()}</div>`;
  const pick = (arr) => arr[rint(arr.length)];
  // 무대 배치: 지금 무대 영역의 가로세로 비율에 따라 PC형(가로 배치)·휴대폰형(세로 배치)을 고르고, 맞춤 범위를 그 배치에 맞춥니다.
  function wideOf(b, ratio) { const a = b._area(); return a.w / a.h > (ratio || 1.25); }
  function setFocus(b, f) {
    const c = b.focus;
    if (!c || c.x[0] !== f.x[0] || c.x[1] !== f.x[1] || c.y[0] !== f.y[0] || c.y[1] !== f.y[1]) b.focus = f;
  }
  // 배치 후보 중 무대 영역에서 가장 크게 그려지는 것을 고릅니다(PC·휴대폰 모두에서 그림이 최대한 크게). 비슷하면 첫 후보(세로 배치)를 유지해 깜박임을 막습니다.
  function pickLayout(b, cands) {
    const a = b._area();
    const kOf = (L) => Math.min(a.w / (L.focus.x[1] - L.focus.x[0]), a.h / (L.focus.y[1] - L.focus.y[0]));
    let best = cands[0], bk = kOf(best);
    for (let i = 1; i < cands.length; i++) { const k = kOf(cands[i]); if (k > bk * 1.08) { best = cands[i]; bk = k; } }
    setFocus(b, best.focus);
    return best;
  }
  const lbl = (b, p, str, o = {}) => b.text(p, str, { size: 12.5, weight: 800, align: 'center', baseline: 'middle', ...o });
  const rectPts = (x, y, w, h, g = 0) => [[x + g, y + g], [x + w - g, y + g], [x + w - g, y + h - g], [x + g, y + h - g]];
  // 가로 넓이 w인 막대가 화면에서 몇 px인지
  const pxW = (b, w) => w * b.k;

  /* ---------- 2. 장면 1 · 표본공간 격자 색칠과 확률의 덧셈정리 (G) ---------- */
  const ph1 = (id) => CONDS[id].ph;
  const valOf = (kind, a, b) => (kind === 'sum' ? a + b : kind === 'prod' ? a * b : kind === 'diff' ? Math.abs(a - b) : null);
  const valKind = (A, B) => (CONDS[A].val !== 'none' ? CONDS[A].val : B ? CONDS[B].val : 'none');
  const MODE1 = { A: 'A', B: 'B', U: 'A∪B', I: 'A∩B', Ac: 'Aᶜ' };
  const MODE1_TEX = { A: 'A', B: 'B', U: 'A\\cup B', I: 'A\\cap B', Ac: 'A^c' };
  // 칸의 색: 모드마다 "구하는 칸"(밝게)과 나머지(흐리게)
  function cellStyle(mode, inA, inB) {
    const both = inA && inB;
    if (mode === 'A') return inA ? { col: both ? 'violet' : 'sky', hi: true } : null;
    if (mode === 'B') return inB ? { col: both ? 'violet' : 'amber', hi: true } : null;
    if (mode === 'U') return inA || inB ? { col: both ? 'violet' : inA ? 'sky' : 'amber', hi: true } : null;
    if (mode === 'I') return inA || inB ? { col: both ? 'violet' : inA ? 'sky' : 'amber', hi: both } : null;
    if (mode === 'Ac') return !inA ? { col: 'rose', hi: true } : { col: 'sky', hi: false };
    return null;
  }
  function lay1(b) {
    return pickLayout(b, [
      { side: false, bx: 0, by: 7.6, bw: 6, bh: 1.5, focus: { x: [-1.4, 7.4], y: [-1.3, 10.1] } },
      { side: true, bx: 7.0, by: 0, bw: 4.2, bh: 6, focus: { x: [-1.5, 11.5], y: [-1.9, 7.6] } }
    ]);
  }
  function bracket(b, x0, x1, y, up, label, col, ref) {
    const t = up ? 0.18 : -0.18;
    b.path([[x0, y + t], [x0, y], [x1, y], [x1, y + t]], { color: col, width: 2, ref });
    lbl(b, [(x0 + x1) / 2, y], label, { color: col, dy: up ? -11 : 12, ref });
  }
  function cfg1(s, lab) {
    if (lab.tab === 'explore') return { A: s.gA, B: s.gB, mode: s.gMode, seen: Math.round(s.sweep), V: null, st: 0 };
    const V = var1.cur(), st = lab.tab === 'problem' ? 0 : s.step;
    let mode = 'none';
    if (V.kind === 'one') mode = st >= 2 ? 'A' : 'none';
    else if (V.kind === 'or') mode = st >= 3 ? 'U' : st === 2 ? 'A' : 'none';
    else mode = st >= 3 ? 'Ac' : st === 2 ? 'A' : 'none';
    return { A: V.A, B: V.kind === 'or' ? V.B : null, mode: s.lppDrawing && s.lppGridMode !== 'auto' ? s.lppGridMode : mode, seen: s.lppDrawing ? Math.round(clamp(s.lppSeen, 0, 36)) : 36, V, st };
  }
  function draw1(b, s, v, lab) {
    const c = cfg1(s, lab), L = lay1(b);
    const cells = gridCells(c.A, c.B), cnt = gridCounts(c.A, c.B), vk = valKind(c.A, c.B);
    const countShown = name => !s.lppDrawing || s.lppCounts || s.lppKnown.includes(name);
    // 위 머리글(가로 a)과 왼쪽 머리글(세로 b)
    for (let i = 1; i <= 6; i++) {
      lbl(b, [i - 0.5, -0.5], String(i), { color: 'sky', size: 13 });
      lbl(b, [-0.5, i - 0.5], String(i), { color: 'amber', size: 13 });
    }
    lbl(b, [-0.5, -0.5], 'b＼a', { color: 'muted', size: 12 });
    // 표본공간 36칸
    for (const q of cells) {
      const x = q.a - 1, y = q.b - 1, seen = q.i < c.seen;
      const st = seen ? cellStyle(c.mode, q.inA, q.inB) : null;
      const ref = [...(q.inA ? ['A', 'U'] : ['Ac']), ...(q.inB ? (q.inA ? ['B', 'I'] : ['B', 'U']) : [])];
      b.poly(rectPts(x, y, 1, 1, 0.04), st
        ? { fill: st.col, fillAlpha: st.hi ? 0.62 : 0.15, color: st.col, alpha: st.hi ? 0.9 : 0.35, width: 1.4, ref }
        : { fill: 'ink', fillAlpha: seen ? 0.04 : 0.1, color: 'ink', alpha: 0.28, width: 1, ref });
      if (seen && vk !== 'none') lbl(b, [x + 0.5, y + 0.5], String(valOf(vk, q.a, q.b)), { size: 12.5, weight: 700, color: 'ink', ref });
    }

    out.notes = '분모를 전체로 두는 실수가 가장 많습니다. $P(A\\mid B)$의 분모는 $B$의 칸 수이고, $P(B\\mid A)$의 분모는 $A$의 칸 수입니다(조건이 되는 쪽). 독립은 "겹치지 않음"(배반)이 아니라 "비율이 같음"입니다.';
    return out;
  }

  /* 문제: 조건부확률 변형 (2022학년도 6월 모평 24번 · 2022학년도 9월 모평 26번 유형) */
  const SCEN2 = [

    { head: (N) => `어느 반 학생 ${N}명의 등교 방법을 조사하였다. 모든 학생은 버스와 도보 중 하나로 등교한다.`, rowN: ['남학생', '여학생'], colN: ['버스', '도보'], rowP: ['남학생', '여학생'], colP: ['버스로 등교하는 학생', '걸어서 등교하는 학생'] },

  const comb2 = (n) => (n * (n - 1)) / 2;
  const lcm = (a, b) => (a / gcd(a, b)) * b;
  function key2(v) { return v.type + '|' + v.tb.join(',') + '|' + (v.cond || '') + '|' + (v.k || ''); }
  function mkTable2(scen, tb, cond) {
    const N = sumTb(tb), st = tbStats(tb);

  function mkBayes2(k, X, Y) {

  /* ---------- 4. 장면 3 · 독립시행·반복 시행 상태 추적 (J): 점 이동 · 공 옮기기 · 동전 뒤집기 ---------- */
  const MOVES = {

  const sigOf = (cfg) => JSON.stringify(cfg);
  // 학생이 누른 한 번의 경로(시행 1번씩)와 시뮬레이션 기록은 설정이 바뀌면 새로 시작합니다.
  function runOf(s, kind, M) {
    s.runs = s.runs || {};

    if (!r || r.sig !== sig) { r = s.runs[kind] = { sig }; resetRun(r, M); }

  }
  function simOf(s, kind, M) {
    s.sims = s.sims || {};
    const sig = sigOf(M.cfg);
    let r = s.sims[kind];
    if (!r || r.sig !== sig) r = s.sims[kind] = { sig, sim: newSim() };
    return r.sim;
  }
  function stepRun(s, kind, face) {
    const M = getM(cfgOf(kind, s)), r = runOf(s, kind, M);
    if (r.path.length - 1 >= M.n) resetRun(r, M);
    const f = face || 1 + rint(M.K);
    r.faces.push(f);
    if (kind === 'coin') { r.mask ^= 1 << (f - 1); r.path.push(headCount(r.mask)); }
    else r.path.push(M.next(r.path[r.path.length - 1], f));
  }
  function describe(M, f, from, to) {

        arr.push({ group: '그 밖의 눈', label: '−1칸(되돌아감)', apply: (st) => { st.wOther = 'back'; }, on: (st) => st.wOther === 'back' });
      }
      if (kind === 'ball') BRULES.forEach((r, i) => arr.push({ group: '넣는 규칙', label: `눈 ${r.th} 이상: 흰 ${r.wAdd} · ${r.th} 미만: 검은 ${r.bAdd}`, color: 'violet', apply: (st) => { st.bRule = i; }, on: (st) => st.bRule === i }));
      const M = getM(cfgOf(kind, s));
      for (let f = 1; f <= M.K; f++) arr.push({ group: kind === 'coin' ? '뒤집을 동전 번호를 직접 고르기' : '주사위 눈을 직접 고르기', label: kind === 'coin' ? `${f}번` : `눈 ${f}`, apply: (st) => stepRun(st, kind, f) });
      return arr;
    };
    return {
      id: `rep-${kind}`, tabs: { compact: true }, title: TITLE3[kind], short: SHORT3[kind],
      question: Q3[kind], guide: GUIDE3[kind],
      controls: kind === 'walk' ? ['nW', 'thW'] : kind === 'ball' ? ['nB', 'TB'] : ['h0', 'nC'],
      presets,
      actions: [
        { id: 'step', primary: true, icon: 'play', label: '시행 1번', run: (s) => stepRun(s, kind) },
        { id: 'full', icon: 'next', label: '끝까지 시행', run: (s) => { const M = getM(cfgOf(kind, s)), r = runOf(s, kind, M); if (r.path.length - 1 >= M.n) resetRun(r, M); while (r.path.length - 1 < M.n) stepRun(s, kind); } },
        { id: 'reset', icon: 'back', label: '처음으로', run: (s) => { const M = getM(cfgOf(kind, s)); const r = runOf(s, kind, M); resetRun(r, M); } },
        { id: 'sim1k', icon: 'spark', label: '1000번 반복', run: (s) => { const M = getM(cfgOf(kind, s)); simulate(M, simOf(s, kind, M), 1000); } },
        { id: 'sim10k', icon: 'spark', label: '10000번 반복', run: (s) => { const M = getM(cfgOf(kind, s)); simulate(M, simOf(s, kind, M), 10000); } },
        { id: 'simclr', icon: 'x', label: '기록 지우기', run: (s) => { const M = getM(cfgOf(kind, s)); s.sims = s.sims || {}; s.sims[kind] = { sig: sigOf(M.cfg), sim: newSim() }; } }
      ],
      steps: () => STEPS3[kind](vr.cur()),
      reviewTop: reviewTop(() => TEXT3[kind](vr.cur())),
      problem: { tag: TAG3[kind], time: '목표 시간: 90초', text: () => probHTML(TEXT3[kind](vr.cur())), answer: () => vr.cur().ans },
      solution: { standardTitle: '기본 풀이', standardTag: '기본 풀이', quickTitle: '상태도로 세는 풀이', quickTag: '핵심', standard: () => SOL3[kind](vr.cur()).standard(), quick: () => SOL3[kind](vr.cur()).quick() },
      vary: vr,
      view: view3(kind),
      draw: draw3(kind)
    };
  }

  function scopedScene(sc) {
    const originalView = sc.view;
    sc.view = (s, lab) => {
      const out = originalView(s, lab);
      if (lab.tab === 'explore') out.notes = '<b>현재 그림은 아래 조작값의 탐구 모형입니다.</b> 선택 문제의 조건과 단계별 그림은 「문제」·「정리」에서 확인합니다.<br>' + (out.notes || '');
      return out;
    };
    return sc;
  }

  /* ---------- 5. 실험실 조립 ---------- */
  const probabilityDefinition = {
    id: 'prob-probability',
    stagedReveal: true,
    title: '확률 실험실',
    courseName: '확률과 통계',
    unit: '확률',
    courseColor: 'var(--m-green)',
    home: '../index.html#probstat',
    board: { kind: 'figure', focus: { x: [-1.5, 14.9], y: [-1.9, 7.6] }, pad: 0.03, minZoom: 0.6, maxZoom: 4 },
    params: {
      sweep: { value: 36, min: 0, max: 36, step: 1, color: 'amber', label: '살펴본 칸 수', hint: '왼쪽 위 칸부터 차례로 살펴보며 조건에 맞는 칸을 셉니다', format: (v) => `${Math.round(v)} / 36칸` },
      cnd: { value: 0, min: 0, max: 1, step: 0.01, color: 'rose', label: '조건 걸기', hint: '오른쪽으로 갈수록 조건 영역만 남고 그 영역이 새 전체가 됩니다', format: (v) => (v < 0.02 ? '전체' : v > 0.98 ? '조건 영역만' : `${Math.round(v * 100)} %`) },
      nW: { value: 4, min: 2, max: 6, step: 1, color: 'amber', label: '시행 횟수 n', format: (v) => `${Math.round(v)}번` },
      thW: { value: 3, min: -6, max: 6, step: 1, color: 'green', label: '좌표가 몇 이상? (≥)', format: (v) => `≥ ${Math.round(v)}` },
      nB: { value: 5, min: 2, max: 5, step: 1, color: 'amber', label: '시행 횟수 n', format: (v) => `${Math.round(v)}번` },
      TB: { value: 7, min: 3, max: 15, step: 1, color: 'sky', label: '조건 a_n+b_n ≥ T', hint: '주머니 속 공의 총 개수에 대한 조건입니다', format: (v) => `T = ${Math.round(v)}` },
      h0: { value: 3, min: 0, max: 4, step: 1, color: 'amber', label: '처음 앞면의 개수', format: (v) => `${Math.round(v)}개` },
      nC: { value: 5, min: 2, max: 6, step: 1, color: 'sky', label: '뒤집는 횟수 n', format: (v) => `${Math.round(v)}번` }
    },
    state: { gA: 'sum7le', gB: 'prod4', gMode: 'U', tb: [6, 6, 3, 5], cond: 'B', view2: 'table', names2: null, cndShow: null, wMove: 'even', wOther: 'stay', bRule: 0 },
    groups: [
      { id: 'g1', title: '확률의 뜻과 덧셈정리', short: '확률의 뜻·덧셈', scenes: [scopedScene(scene1())] },
      { id: 'g2', title: '조건부확률과 독립', short: '조건부확률', scenes: [scopedScene(scene2())] },
      { id: 'g3', title: '독립시행·반복 시행', short: '반복 시행', scenes: ['walk', 'ball', 'coin'].map((kind) => scopedScene(scene3(kind))) }
    ]
  };
  // Each explanation selects a real source type. The student's chosen packet,
  // arrays, run history and simulation history remain in their native state.
  function traceFaces(M, faces) {
    const r = {}; resetRun(r, M);
    for (const f of faces.slice(0, M.n)) {
      if (!Number.isInteger(f) || f < 1 || f > M.K) throw new Error('Invalid probability trace face');
      r.faces.push(f);
      if (M.cfg.kind === 'coin') { r.mask ^= 1 << (f - 1); r.path.push(headCount(r.mask)); }
      else r.path.push(M.next(r.path.at(-1), f));
    }
    return r;
  }
  const probabilityScenes = probabilityDefinition.groups.flatMap(g => g.scenes);
  const initialProbability = { ...probabilityDefinition.state, ...Object.fromEntries(Object.entries(probabilityDefinition.params).map(([k,v]) => [k,v.value])) };
  const probabilityPackets = Object.fromEntries(probabilityScenes.map(sc => { const first = sc.vary.cur(); sc.vary.first = () => first; return [sc.id,{first}]; }));
  Object.assign(probabilityPackets.grid, {
    union: mk1({kind:'or',A:'sum7le',B:'prod4'}), complement: mk1({kind:'not',A:'prodOdd'}),
    symmetric: mk1({kind:'one',A:'sum7le'}), asymmetric: mk1({kind:'one',A:'aLtB'}), disjoint: mk1({kind:'or',A:'sum7',B:'same'})
  });
  Object.assign(probabilityPackets.cond, { tableB: mkTable2(SCEN2[0],[6,4,5,7],'B'), tableA: mkTable2(SCEN2[0],[6,4,5,7],'A') });
  probabilityPackets['rep-walk'].back = mkWalk({kind:'walk',move:MOVES.ge5.faces,other:'back',n:4,thr:2});
  const probabilitySource = window.APL_PROBABILITY_SOURCE = {
    initial: () => JSON.parse(JSON.stringify(initialProbability)),
    inquiry: id => probabilityScenes.find(sc => sc.id === id).question,
    first(id,key='first') { const v=probabilityPackets[id]?.[key]; if(!v) throw new Error('Unknown probability packet '+id+'/'+key); return v; },
    question(id,key='first') { const v=this.first(id,key); return id==='grid'?text1(v):id==='cond'?text2(v):TEXT3[id.slice(4)](v); },
    steps(id,key='first') { const v=this.first(id,key); return id==='grid'?steps1(v):id==='cond'?steps2(v):STEPS3[id.slice(4)](v); },
    answer(id,key='first') { const v=this.first(id,key); return id==='grid'||id==='cond'?frTex(v.f):id==='rep-ball'?String(v.M.P.n+v.M.P.d):frTex(v.M.P); },
    math: { fr, frTex, gridCells, gridCounts, colSums, tbStats, colsOf, tbOf, makeMachine, getM, traceFaces, simulate, newSim, mkGrid:mk1, mkTable:mkTable2, mkBayes:mkBayes2, mkWalk, mkBall, mkCoin },
    variants: { conditions:COND_IDS, moves:MOVES, ball:BALL_VARS, coin:COIN_VARS, tableScenarios:SCEN2 },
    generators: { grid:gen1, cond:gen2, walk:genWalk, ball:genBall, coin:genCoin }
  };
  probabilityDefinition.lessons = window.APL_PROBABILITY_LESSONS?.install(probabilityScenes, probabilitySource) || {};
  APLab.createLab(probabilityDefinition);

});
