<script>
/* ==========================================================================
   중1 · 원과 부채꼴 (AP Math Lab 2.0)
   탭 구성(order 순): ① 원 알아보기(10) · 중심각과 호·넓이(15, basic.js) · ③ 길이·둘레(20) · ④ 넓이 원리(30)
                      · F01~F05(61~65) · F06 굴리기(66) · 원이 지나간 자리·묶인 동물의 영역(67·68)
   이 파일이 직접 가진 탭은 ① ③ ④ 입니다(10·20·30). 나머지는 labs/g7-circle-sector/*.js 모듈이
   window.APL_CS_GROUPS 에 { order, id, title, short, params?, scenes } 묶음을 등록하면 order 순으로 붙습니다.
   원칙(학생 가독성)
   - 그림은 무대 가득(autoFit) · 정해진 조건은 정확한 π 표기, 연속 이동의 중간값은 ≈ 표시 · 라벨은 화면 기준 15px 이상
   - 색의 역할: 하늘=호(굽은 선) · 분홍=곧은 선(반지름·지름·현) · 노랑=각·점 P·지나간 자취 · 초록=색칠한 면
   - 모든 도형은 막대 또는 손잡이로 조절되고, 라벨·자취·식·정리 단계·정답이 그 값으로 다시 계산됩니다.
   - 움직임은 가로로만(굴리기·밀기). 세로 이동 없음.
   ========================================================================== */
window.addEventListener('DOMContentLoaded', function () {
'use strict';
const PI = Math.PI, TAU = 2 * PI;
const clamp = APLab.clamp;
const rad = (d) => d * PI / 180;
const ease = (x) => { x = clamp(x, 0, 1); return x * x * (3 - 2 * x); };

/* ---------- 정확한 값: π 계수 + 상수 (분수 유지, 소수 없음) ---------- */
const gcd = (a, b) => { a = Math.abs(a); b = Math.abs(b); while (b) { const t = a % b; a = b; b = t; } return a || 1; };
const frac = (n, d = 1) => { if (d < 0) { n = -n; d = -d; } const g = gcd(n, d); return [n / g, d / g]; };
const addFrac = (a, b) => frac(a[0] * b[1] + b[0] * a[1], a[1] * b[1]);
const ex = (pn = 0, pd = 1, cn = 0, cd = 1) => ({ pi: frac(pn, pd), c: frac(cn, cd) });
const plus = (a, b) => ({ pi: addFrac(a.pi, b.pi), c: addFrac(a.c, b.c) });
const scaleEx = (e, num, den) => ({ pi: frac(e.pi[0] * num, e.pi[1] * den), c: frac(e.c[0] * num, e.c[1] * den) });
const val = (e) => e.pi[0] / e.pi[1] * PI + e.c[0] / e.c[1];
const rs = ([n, d], pi) => (n === 0 ? '' : d === 1 ? (pi ? (Math.abs(n) === 1 ? (n < 0 ? '-π' : 'π') : `${n}π`) : String(n)) : (pi ? `${n}π/${d}` : `${n}/${d}`));
const plain = (e) => {
  const a = rs(e.pi, true), c = e.c[0];
  if (!a) return c === 0 ? '0' : rs(e.c, false);
  if (c === 0) return a;
  return c > 0 ? `${a} + ${rs(e.c, false)}` : `${a} − ${rs([-e.c[0], e.c[1]], false)}`;
};
const cmOf = (e) => (e ? plain(e) + ' cm' : '');
const cm2Of = (e) => (e ? plain(e) + ' cm²' : '');
const whole = (v) => Math.abs(v - Math.round(v)) < 1e-8;
const approx = (v) => String(+v.toFixed(2));
const angleText = (v) => (whole(v) ? Math.round(v) : '≈ ' + approx(v)) + '°';
const motionCm = (e, n) => e ? cmOf(e) : n == null ? '계산 안 함' : `≈ ${approx(n)} cm`;
const motionLabel = (label, e, n) => `${label} ${e ? '= ' : ''}${motionCm(e, n)}`;
const angleLength = (r, deg) => ({ exact: whole(deg) ? ex(r * Math.round(deg), 180) : null, distance: r * rad(deg) });
const rollLength = (r, percent) => ({ exact: whole(percent) ? ex(2 * r * Math.round(percent), 100) : null, distance: 2 * PI * r * percent / 100 });
const rl = ([n, d], pi) => { if (n === 0) return ''; const s = n < 0 ? '-' : '', m = Math.abs(n), nu = pi ? (m === 1 ? '\\pi' : `${m}\\pi`) : String(m); return s + (d === 1 ? nu : `\\dfrac{${nu}}{${d}}`); };
const texOf = (e) => { const a = rl(e.pi, true), b = rl(e.c, false); return (a && b ? (b[0] === '-' ? a + b : a + '+' + b) : a || b) || '0'; };
const M = (s) => APLab.renderMath(APLab.esc(s));
const RICH = (...p) => `<div class="apl-rich">${p.map((x) => `<p>${x}</p>`).join('')}</div>`;

/* ---------- 그리기 도우미 (figure 좌표: y 아래쪽, 각은 시계 방향) ---------- */
const pt = (cx, cy, R, a) => ({ x: cx + R * Math.cos(a), y: cy + R * Math.sin(a) });
const O0 = { x: 0, y: 0 };
const textW = (t, size) => { let w = 0; for (const ch of String(t)) { const c = ch.charCodeAt(0); w += c >= 0x1100 ? size * 1.0 : ch === ' ' ? size * 0.32 : size * 0.62; } return w; };
const T = (b, p, t, o = {}) => b.text(p, t, { dx: o.dx || 0, dy: o.dy || 0, color: o.color || 'ink', size: (o.size || 16) * (b.W < 560 ? 0.9 : 1), weight: 800, align: o.align || 'center', baseline: 'middle' });
// 점 p 에서 (nx,ny) 방향으로 글자 상자가 닿지 않을 만큼 비켜 놓은 라벨
function tagN(b, p, nx, ny, t, o = {}) {
  const size = o.size || 16, d = Math.abs(nx) * (textW(t, size) / 2 + 4) + Math.abs(ny) * size * 0.62 + (o.gap == null ? 8 : o.gap);
  T(b, p, t, { ...o, dx: nx * d, dy: ny * d });
}
// 같은 자리에 여러 줄을 쌓는 라벨(바깥쪽으로 나가며 아래/위로 한 줄씩)
function tagStack(b, p, nx, ny, items, o = {}) {
  const size = o.size || 16, w = Math.max(...items.map((it) => textW(it.t, size))), d = Math.abs(nx) * (w / 2 + 4) + Math.abs(ny) * size * 0.62 + (o.gap == null ? 10 : o.gap), dirY = ny < -0.35 ? -1 : 1;
  const n = items.length;
  const offsets = items.map((it, i) => ny * d + dirY * size * 1.3 * (dirY < 0 ? n - 1 - i : i));
  let lower = 0;
  if (o.keepInView && !b.thumb && !b._bbox) {
    const at = b.toS(p), actualSize = size * (b.W < 560 ? .9 : 1);
    const top = Math.min(...items.map((it, i) => at.y + offsets[i] - b.annotationSize(it.t, { size: actualSize, weight: 800 }).height / 2));
    lower = Math.max(0, b.insets.top + 8 - top);
  }
  items.forEach((it, i) => T(b, p, it.t, { dx: nx * d, dy: offsets[i] + lower, color: it.color, size })); // 위에서 아래로 주어진 순서대로
}
const arcPts = (cx, cy, R, a0, a1, n = 72) => { const o = []; for (let i = 0; i <= n; i++) o.push(pt(cx, cy, R, a0 + (a1 - a0) * i / n)); return o; };
const lerp = (A, B, f) => ({ x: A.x + (B.x - A.x) * f, y: A.y + (B.y - A.y) * f });
const ghost = (b) => b.circle(O0, 1, { color: 'muted', width: 1.8, dash: [6, 6], alpha: 0.7 });
const fillWedge = (b, a0, a1) => b.arc(O0, 1, a0, a1, { sector: true, fill: 'green', fillAlpha: 0.06, color: null });
const fillSegment = (b, a0, a1) => b.path(arcPts(0, 0, 1, a0, a1, 64), { close: true, fill: 'green', fillAlpha: 0.06, color: null });
// 중심각 표시: 부채꼴 안쪽에 노란 부채꼴 + 값(직각은 네모)
function angleMark(b, a0, a1, text, o = {}) {
  const k = b.k || 100, th = Math.abs(a1 - a0), rpx = o.r || 30, am = (a0 + a1) / 2;
  if (Math.abs(th - PI / 2) < 1e-6 && !o.noRight) b.right(O0, pt(0, 0, 1, a0), pt(0, 0, 1, a1), { size: 16, color: 'amber' });
  else b.arc(O0, rpx / k, a0, a1, { sector: true, fill: 'amber', fillAlpha: 0.24, color: 'amber', width: 2.2 });
  const need = (textW(text, 17) / 2 + 8) / Math.tan(clamp(th / 2, 0.2, 1.4));
  const dist = Math.min(Math.max(rpx + 24, need), k * 0.85);
  if (o.outside && th < PI / 2) {
    const label = { x: -.75, y: -.25 }, size = 17 * (b.W < 560 ? .9 : 1);
    b.leader(pt(0, 0, rpx / k, am), label, { ...b.annotationSize(text, { size, weight: 800 }), color: 'amber', alpha: .7 });
    T(b, label, text, { color: 'amber', size: 17 });
  } else T(b, O0, text, { dx: Math.cos(am) * dist, dy: Math.sin(am) * dist, color: 'amber', size: 17 });
}
const dot = (b, p, c = 'ink', r = 5.5) => b.point(p, { color: c, r });
// 호·원은 '중심'만 맞춤 범위에 잡히므로, 그림이 차지하는 범위를 보이지 않는 선으로 알려 줍니다.
const bbox = (b, x0, y0, x1, y1) => b.path([{ x: x0, y: y0 }, { x: x1, y: y1 }], { color: null });

/* ---------- 부채꼴·활꼴 도형 ---------- */
// type: semi | quarter | sector | segment | arc   (arc 는 호·현 장면: 도형 모양은 활꼴과 같음)
function shapeOf(type, s) {
  const deg = type === 'semi' ? 180 : type === 'quarter' ? 90 : (type === 'segment' || type === 'arc') ? s.csS : s.csA;
  const a0 = type === 'semi' ? PI : -PI / 2;
  return { type, deg, th: rad(deg), a0, a1: a0 + rad(deg) };
}
// 둘레를 이루는 선(경계 요소) 목록. exact 는 정확한 길이, len 은 같은 비율의 수치(그림·띠 폭용)
function boundary(sh, r) {
  const A = pt(0, 0, 1, sh.a0), B = pt(0, 0, 1, sh.a1);
  const arc = { kind: 'arc', color: 'sky', a0: sh.a0, a1: sh.a1, exact: ex(r * sh.deg, 180), len: r * sh.th, at: (f) => pt(0, 0, 1, sh.a0 + f * (sh.a1 - sh.a0)), deg: sh.deg };
  const line = (P, Q, name, e, len) => ({ kind: 'line', color: 'rose', P, Q, name, exact: e, len, at: (f) => lerp(P, Q, f) });
  if (sh.type === 'semi') { arc.name = '반원호'; return [arc, line(B, A, '지름', ex(0, 1, 2 * r), 2 * r)]; }
  if (sh.type === 'quarter') { arc.name = '사분원호'; return [arc, line(B, O0, '반지름', ex(0, 1, r), r), line(O0, A, '반지름', ex(0, 1, r), r)]; }
  if (sh.type === 'sector') { arc.name = '호 AB'; return [arc, line(B, O0, '반지름', ex(0, 1, r), r), line(O0, A, '반지름', ex(0, 1, r), r)]; }
  const chordEx = sh.deg === 60 ? ex(0, 1, r) : sh.deg === 180 ? ex(0, 1, 2 * r) : null;
  arc.name = '호 AB';
  return [arc, line(B, A, '현 AB', chordEx, 2 * r * Math.sin(sh.th / 2))];
}
const NUMS = ['①', '②', '③', '④'];

/* 점 P가 실제로 지나온 거리. 정수 %와 경계의 끝에서는 정확한 값을,
   연속 재생의 중간에서는 같은 위치에 대응하는 근삿값을 씁니다. */
function tracePlan(segs, f) {
  const total = segs.reduce((a, g) => a + g.len, 0);
  const progress = clamp(f, 0, 1), allKnown = segs.every((g) => g.exact);
  let dist = progress * total, e = ex(), exactParts = true, P = segs[0].at(0);
  const done = [];
  for (let i = 0; i < segs.length; i++) {
    const g = segs[i], fs = Math.min(1, dist / g.len);
    if (!(fs > 0)) break;
    done.push({ g, f: fs });
    P = g.at(fs);
    let part = null;
    if (g.exact && fs >= 1 - 1e-9) part = g.exact;
    if (part) e = plus(e, part); else exactParts = false;
    dist -= g.len;
    if (dist <= 1e-9) break;
  }
  if (allKnown && whole(progress * 100)) {
    e = scaleEx(segs.reduce((a, g) => plus(a, g.exact), ex()), Math.round(progress * 100), 100);
    exactParts = true;
  }
  return { done, P, ex: exactParts ? e : null, distance: allKnown ? progress * total : null, total };
}
const cumTarget = (segs, k) => { const total = segs.reduce((a, g) => a + g.len, 0); let acc = 0; for (let i = 0; i < k && i < segs.length; i++) acc += segs[i].len; return acc / total; };

/* ---------- 공통 조작: 재생 · 장면 상태 ---------- */
const playAction = (key, max, label) => ({
  id: 'play', play: true, primary: true, icon: (s) => (s.playing ? 'pause' : 'play'),
  label: (s) => (s.playing ? '일시 정지' : s[key] >= max - 1e-8 ? '다시 재생' : label),
  on: (s) => s.playing,
  run: (s) => { if (s.playing) s.playing = false; else { if (s[key] >= max - 1e-8) s[key] = 0; s.playing = true; } }
});
const resetAction = (key) => ({ id: 'reset', icon: 'reset', label: '처음으로', run: (s) => { s.playing = false; s[key] = 0; } });
const mkTick = (key, max, dur, reviewTarget) => (s, dt, lab) => {
  let again = false;
  if (s.playing) { s[key] = Math.min(max, s[key] + dt * max / dur); if (s[key] >= max) s.playing = false; again = true; }
  else if (reviewTarget && lab && lab.tab === 'review') {
    const tg = reviewTarget(s), d = tg - s[key];
    if (Math.abs(d) > 0.4) { s[key] += clamp(d, -dt * max * 0.35, dt * max * 0.35); again = true; } else if (d !== 0) s[key] = tg;
  }
  return again;
};
const rPresets = () => [3, 4, 5, 6].map((r, i) => ({ group: i === 0 ? '반지름 r' : '', label: `${r} cm`, apply: (s) => { s.csR = r; }, on: (s) => s.csR === r }));
const angPresets = (key, list) => list.map((a, i) => ({ group: i === 0 ? '중심각' : '', label: a + '°', apply: (s) => { s[key] = a; }, on: (s) => s[key] === a }));
// 중심각 손잡이(점 B): 끌면 중심각이 15° 단위로 바뀜
function angleHandle(b, s, key, a0, min, max) {
  const B = pt(0, 0, 1, a0 + rad(s[key]));
  b.handle('B', B, {
    color: 'amber', ariaLabel: '중심각 손잡이', drag: (w) => {
      let raw = ((Math.atan2(w.y, w.x) - a0) * 180 / PI + 720) % 360;
      if (raw > (max + 360) / 2) raw = min;
      s[key] = clamp(Math.round(raw / 15) * 15, min, max);
    }
  });
}

const Q_CIRCLE = '원의 요소(중심·반지름·지름·호·현·부채꼴·활꼴)는 각각 어떤 선이고 어떤 면일까요?';
const Q_PERI = '도형의 바깥 경계는 어떤 선들로 이루어져 있고, 길이를 어떻게 더해야 둘레가 될까요?';
const Q_AREA = '원과 부채꼴의 넓이 공식은 도형을 어떻게 나누고 다시 놓아서 만들어질까요?';
const problemOf = (tag, q, a) => ({ tag, text: () => APLab.esc(q), answer: () => APLab.esc(a) });
const Q_SECTOR = ['같은 반지름에서 중심각이 2배이면 무엇이 2배인가요?', '호의 길이와 부채꼴의 넓이가 각각 2배가 됩니다. 현의 길이는 중심각에 정비례하지 않습니다.'];
const Q_SEGMENT = ['활꼴 둘레는 어떤 선으로 만들어질까요?', '호 AB와 현 AB입니다. 점선으로 표시된 두 반지름은 활꼴의 경계가 아니므로 둘레에 포함되지 않습니다.'];

/* ======================================================================
   ① 원 알아보기
   ====================================================================== */
const sCenter = {
  id: 'z0-center', title: '중심·반지름', short: '중심·반지름', question: (s) => s.lessonOn || s.lessonEntry ? '중심 O에서 원 위의 여러 점까지 거리는 어떤 관계일까요?' : Q_CIRCLE,
  guide: '원의 중심 O에서 원 위의 모든 점까지의 거리는 <b>반지름 r</b>로 같습니다. <b>노란 점 P</b>를 끌어 한 바퀴 돌려 보세요. 점이 지나간 길이가 호의 길이이고, 한 바퀴 돌면 <b>원주</b>가 됩니다.',
  controls: ['csR', 'csQ'], presets: rPresets, actions: () => [playAction('csQ', 360, '점 P 한 바퀴'), resetAction('csQ')],
  tick: mkTick('csQ', 360, 7),
  steps: (s) => [
    `원의 중심 O와 원 위의 한 점 P를 이은 선분이 반지름입니다. r = ${s.csR} cm`,
    `중심 O에서 원 위의 어느 점까지든 거리는 ${s.csR} cm로 같습니다.`,
    `점 P가 원을 한 바퀴 돈 길이가 원주입니다. 원주 = 2πr = ${plain(ex(2 * s.csR))} cm. 지름은 중심을 사이에 둔 반지름 두 개를 이은 길이이므로 2r = ${2 * s.csR} cm, 즉 반지름의 2배입니다.`
  ],
  problem: problemOf('생각해 보기', '원의 지름은 반지름의 몇 배일까요?', '2배입니다. 지름은 원의 중심 O를 지나는 가장 긴 현이며 길이는 2r입니다.'),
  view: (s) => {
    const r = s.csR, run = angleLength(r, s.csQ);
    return {
      readouts: [{ label: '반지름 r', value: r + ' cm', color: 'rose' }, { label: '원주 2πr', value: cmOf(ex(2 * r)), color: 'sky' }, { label: '점 P가 지나간 길이', value: motionCm(run.exact, run.distance), color: 'amber', note: `중심각 ${angleText(s.csQ)}만큼` }],
      formula: RICH(M('원주 $l=2\\pi r$ , 원의 넓이 $S=\\pi r^2$'), M(`지금: $l=2\\pi\\times${r}=${texOf(ex(2 * r))}\\ \\text{cm}$`))
    };
  },
  draw: (b, s, v, lab) => {
    const guided = s.lessonOn || s.lessonEntry;
    const st = s.lessonEntry ? 0 : guided ? s.step : lab && lab.tab === 'review' ? s.step : 99, r = s.csR, ph = rad(s.csQ), a = -PI / 2 + ph, P = pt(0, 0, 1, a);
    bbox(b, -1, -1, 1, guided ? 1.5 : 1.0);
    b.circle(O0, 1, { fill: 'green', fillAlpha: 0.035, color: 'sky', width: 2.4 });
    if (st >= 2) for (let i = 1; i < 4; i++) { const Q = pt(0, 0, 1, a + i * PI / 2); b.seg(O0, Q, { color: 'rose', width: 1.4, alpha: 0.35 }); b.ticks(O0, Q, { color: 'amber' }); }
    if (!guided && ((lab && lab.tab === 'review' && s.step >= 3) || s.csQ >= 360 - 1e-8)) b.circle(O0, 1, { color: 'sky', width: 7, glow: true });
    if (!guided && s.csQ > 0) b.arc(O0, 1, -PI / 2, a, { color: 'amber', width: 4.5, alpha: 0.8 });
    if (st >= 1 || s.lessonEntry) { b.seg(O0, P, { color: 'rose', width: 2.8 }); b.ticks(O0, P, { color: 'amber' }); }
    b.handle('P', P, { color: 'amber', ariaLabel: '점 P', drag: (w) => { s.playing = false; s.csQ = clamp(Math.round((((Math.atan2(w.y, w.x) + PI / 2) * 180 / PI) + 720) % 360 / 15) * 15, 0, 360); } });
    dot(b, O0, 'ink', 6);
    T(b, O0, '중심 O', { dx: -2, dy: 24, size: 16 });
    if (guided) tagN(b, P, Math.cos(a), Math.sin(a), 'P', { size: 17 });
    let n = { x: -Math.sin(a), y: Math.cos(a) };
    if (n.y > 1e-6 || (Math.abs(n.y) <= 1e-6 && n.x < 0)) n = { x: -n.x, y: -n.y }; // 반지름 위쪽에 라벨
    tagN(b, lerp(O0, P, 0.5), n.x, n.y, `r = ${r} cm`, { color: 'rose', size: 17 });
    if (!guided) T(b, { x: 0, y: 1 }, `원주 2πr = ${cmOf(ex(2 * r))}`, { dy: 36, color: 'sky', size: 17 });
    if (!guided && s.csQ > 0) { const run = angleLength(r, s.csQ); T(b, { x: 0, y: 1 }, motionLabel('점 P가 지나간 길이', run.exact, run.distance), { dy: 64, color: 'amber', size: 16 }); }
    if (s.lessonOn && !s.lessonEntry && s.csConceptShow) T(b, { x: 0, y: 1 }, `모든 반지름은 ${r} cm로 같아요`, { dy: 36, color: 'rose', size: 17 });
  }
};

const sDiameter = {
  id: 'z0-diameter', title: '지름·원주', short: '지름·원주', question: (s) => s.lessonOn || s.lessonEntry ? '지름은 반지름과 어떤 관계이고, 원주율은 어떻게 정할까요?' : Q_CIRCLE,
  guide: '원을 <b>한 바퀴 굴리면</b> 굴러간 거리가 <b>원주</b>입니다. 막대나 노란 점을 끌어 굴려 보세요. 원주는 지름의 3배보다 조금 더 깁니다. 이 일정한 비율이 <b>원주율 π</b>입니다.',
  controls: ['csR', 'csD'], presets: rPresets, actions: () => [playAction('csD', 100, '원 굴리기'), resetAction('csD')],
  tick: mkTick('csD', 100, 8),
  steps: (s) => [
    `원의 중심 O를 지나도록 원 위의 두 점을 이은 선분이 지름입니다. 지름 = 2r = ${2 * s.csR} cm`,
    `지름은 원 안에서 그을 수 있는 가장 긴 현입니다. 길이는 ${2 * s.csR} cm입니다.`,
    `원을 한 바퀴 굴린 거리 = 원주 = ${plain(ex(2 * s.csR))} cm. 원주 ÷ 지름 = ${plain(ex(2 * s.csR))} ÷ ${2 * s.csR} = π`
  ],
  problem: problemOf('생각해 보기', '원주를 지름으로 나눈 값은 무엇일까요?', '원의 크기와 관계없이 원주율 π입니다.'),
  view: (s) => {
    const r = s.csR, run = rollLength(r, s.csD);
    return {
      readouts: [{ label: '지름 2r', value: 2 * r + ' cm', color: 'rose' }, { label: '원주 2πr', value: cmOf(ex(2 * r)), color: 'sky' }, { label: '굴러간 거리', value: motionCm(run.exact, run.distance), color: 'amber', note: `${angleText(s.csD * 3.6)}만큼 굴림` }],
      formula: RICH(M('원주율 $\\pi=\\dfrac{\\text{원주}}{\\text{지름}}$ , 원주 $l=\\pi\\times\\text{지름}=2\\pi r$'), M(`지금: $\\pi\\times${2 * r}=${texOf(ex(2 * r))}\\ \\text{cm}$`))
    };
  },
  draw: (b, s, v, lab) => {
    const guided = s.lessonOn || s.lessonEntry, read = s.lessonOn && !s.lessonEntry ? (s.csConceptRead || 0) : 0;
    if (guided && (s.lessonEntry || s.csConceptMode === 'diameter')) {
      const a = PI / 2 + s.csD / 100 * TAU, P = pt(0, 0, 1, a), Q = pt(0, 0, 1, a + PI);
      bbox(b, -1.35, -1.3, 1.35, 2.0);
      b.circle(O0, 1, { fill: 'green', fillAlpha: .035, color: 'sky', width: 2.4 });
      b.seg(P, Q, { color: 'rose', width: 3.5 });
      b.ticks(P, O0, { color: 'amber' }); b.ticks(O0, Q, { color: 'amber' });
      dot(b, O0, 'ink', 5); dot(b, P, 'amber', 6); dot(b, Q, 'rose', 6);
      T(b, O0, 'O', { dy: 23 }); tagN(b, P, Math.cos(a), Math.sin(a), 'A'); tagN(b, Q, -Math.cos(a), -Math.sin(a), 'B');
      if (read >= 1) T(b, { x: 0, y: -1 }, '중심 O를 지나는 지름 AB', { dy: -32, color: 'rose' });
      const tag = (p, side) => tagN(b, lerp(O0, p, .5), side * Math.sin(a), -side * Math.cos(a), read >= 2 ? `r = ${s.csR} cm` : 'r', { color: 'rose' });
      tag(P, 1); tag(Q, -1);
      if (read >= 3) T(b, { x: 0, y: 1 }, `지름 = ${s.csR} + ${s.csR} = ${2 * s.csR} cm`, { dy: 35, color: 'rose' });
      if (s.lessonOn && !s.lessonEntry && s.csConceptShow) T(b, { x: 0, y: 1 }, '지름 = 2r', { dy: 63, color: 'green' });
      return;
    }
    const st = lab && lab.tab === 'review' ? s.step : 99, r = s.csR, th = s.csD / 100 * TAU, C = { x: th, y: 0 }, gy = 1;
    bbox(b, -1, -1, TAU + 1, gy + 0.4);
    b.circle(O0, 1, { color: 'muted', width: 1.6, dash: [5, 6], alpha: 0.6 });
    b.seg({ x: -0.7, y: gy }, { x: TAU + 0.7, y: gy }, { color: 'ink', width: 2.6, alpha: 0.75 });
    if (th > 0) b.seg({ x: 0, y: gy }, { x: th, y: gy }, { color: 'amber', width: 4.5, alpha: 0.8 });
    b.circle(C, 1, { fill: 'green', fillAlpha: 0.035, color: 'sky', width: 2.4 });
    const ph = PI / 2 + th, P = pt(C.x, 0, 1, ph), Q = pt(C.x, 0, 1, ph + PI);
    b.seg(P, Q, { color: 'rose', width: 2.8 });
    b.ticks(P, C, { color: 'amber' }); b.ticks(C, Q, { color: 'amber' });
    dot(b, C, 'ink', 5);
    dot(b, Q, 'rose', 5.5);
    b.handle('roll', C, { color: 'amber', ariaLabel: '원 굴리기', drag: (w) => { s.playing = false; s.csD = clamp(w.x / TAU * 100, 0, 100); } });
    b.point(P, { color: 'amber', r: 7 });
    T(b, { x: C.x, y: -1 }, guided && read < 1 ? `반지름 r = ${r} cm` : `지름 2r = ${2 * r} cm`, { dy: -26, color: 'rose', size: 17 });
    const run = rollLength(r, s.csD), fullTurn = s.csD >= 100 - 1e-8, problem = lab && lab.tab === 'problem';
    const distanceLabel = guided && read < 4 ? (fullTurn && read >= 2 ? '한 바퀴 굴러간 거리 = 원주' : '노란 점이 바닥으로 돌아오는 한 바퀴') : fullTurn ? `한 바퀴 굴러간 거리 = 원주 = ${cmOf(ex(2 * r))}` : (th > 0 ? motionLabel('굴러간 거리', run.exact, run.distance) : '원을 굴려 보세요 →');
    T(b, { x: TAU / 2, y: gy }, distanceLabel, { dy: 36, color: 'amber', size: 17 });
    if (fullTurn && !problem && (!guided || read >= 3)) T(b, { x: TAU / 2, y: gy }, guided && read < 4 ? '원주 ÷ 지름 = π' : `원주 ÷ 지름 = ${plain(ex(2 * r))} ÷ ${2 * r} = π`, { dy: 66, color: 'ink', size: 16 });
  }
};

// 개념 해설의 공개 순서만 담당합니다. 직접 해 보기의 partScene 그림은 아래 원본 경로를 그대로 씁니다.
function drawConceptPart(type, b, s) {
  const read = s.lessonOn && !s.lessonEntry ? (s.csConceptRead || 0) : 0;
  const shown = s.lessonOn && !s.lessonEntry && s.csConceptShow, step = s.lessonEntry ? 0 : s.step;
  const sh = shapeOf(type, s), r = s.csR, { a0, a1 } = sh, am = (a0 + a1) / 2;
  const A = pt(0, 0, 1, a0), B = pt(0, 0, 1, a1), area = s.csConceptMode === 'sector-area';
  bbox(b, -1.35, -1.3, 1.35, type === 'arc' ? 2.35 : type === 'sector' ? 2.6 : 1.7);
  ghost(b);
  if (type === 'sector') b.arc(O0, 1, a0, a1, { sector: true, fill: 'green', fillAlpha: area && step >= 1 ? .18 : .07, color: null });
  if (type === 'segment') b.path(arcPts(0, 0, 1, a0, a1, 64), { close: true, fill: 'green', fillAlpha: .1, color: null });
  b.arc(O0, 1, a0, a1, { color: 'sky', width: step === 2 ? 5.5 : 3 });
  if (type === 'sector') {
    b.seg(O0, A, { color: 'rose', width: 2.8 }); b.seg(O0, B, { color: 'rose', width: 2.8 });
    b.ticks(O0, A, { color: 'amber' }); b.ticks(O0, B, { color: 'amber' });
    angleMark(b, a0, a1, angleText(sh.deg), { r: 18 });
    tagN(b, lerp(O0, A, .5), -1, 0, `r = ${r} cm`, { color: 'rose', size: 16 });
    tagN(b, lerp(O0, B, .5), Math.cos(a1 + PI / 2), Math.sin(a1 + PI / 2), `r = ${r} cm`, { color: 'rose', size: 16 });
  } else {
    b.seg(O0, A, { color: 'muted', width: 1.5, dash: [6, 6], alpha: read >= 3 ? .25 : .5 });
    b.seg(O0, B, { color: 'muted', width: 1.5, dash: [6, 6], alpha: read >= 3 ? .25 : .5 });
    b.seg(A, B, { color: 'rose', width: step === 3 ? 5.5 : 2.8 });
  }
  dot(b, O0, 'ink', 5); dot(b, A, 'ink', 5); dot(b, B, 'amber', 6);
  T(b, O0, 'O', { dx: -Math.cos(am) * 18 - 4, dy: -Math.sin(am) * 18 + 14 });
  tagN(b, A, Math.cos(a0), Math.sin(a0), 'A');
  tagN(b, B, Math.cos(a1), Math.sin(a1), 'B');
  if (type === 'sector') {
    if (read >= 1) {
      const f = frac(Math.round(sh.deg), 360);
      T(b, { x: 0, y: 1 }, `원 전체의 ${Math.round(sh.deg)}/360 = ${f[0]}/${f[1]}`, { dy: 28, color: 'amber' });
    }
    if (read >= 2) {
      const value = area ? cm2Of(ex(r * r * sh.deg, 360)) : cmOf(ex(r * sh.deg, 180));
      T(b, { x: 0, y: 1 }, (area ? '넓이 = ' : '호 AB = ') + value, { dy: 55, color: area ? 'green' : 'sky' });
    }
    if (read >= 3) {
      // 처음 90°인 부분을 점선으로 남겨 두 배인 180°와 비교합니다.
      b.seg(O0, pt(0, 0, 1, a0 + PI / 2), { color: 'amber', width: 2, dash: [5, 5] });
      const first = area ? plain(ex(r * r, 4)) : plain(ex(r, 2));
      const second = area ? plain(ex(r * r, 2)) : plain(ex(r));
      T(b, { x: 0, y: 1 }, `90°: ${first}  →  180°: ${second}`, { dy: 82, color: area ? 'green' : 'sky' });
    }
    if (shown) T(b, { x: 0, y: 1 }, area ? '넓이도 2배' : '호의 길이도 2배', { dy: 109, color: 'green' });
    return;
  }
  const items = [];
  if (read >= 1) items.push({ t: '호 AB', color: 'sky' });
  if (read >= 2) items.push({ t: '현 AB', color: 'rose' });
  if (items.length) tagStack(b, pt(0, 0, 1, am), Math.cos(am), Math.sin(am), items, { size: 17 });
  if (type === 'arc' && read >= 3) {
    const la = sh.th * .64, lc = 2 * Math.sin(sh.th / 2) * .64;
    T(b, { x: -1, y: 1.5 }, '호 AB', { dx: -12, align: 'right', color: 'sky' });
    T(b, { x: -1, y: 1.85 }, '현 AB', { dx: -12, align: 'right', color: 'rose' });
    b.seg({ x: -1, y: 1.5 }, { x: -1 + la, y: 1.5 }, { color: 'sky', width: 4 });
    b.seg({ x: -1, y: 1.85 }, { x: -1 + lc, y: 1.85 }, { color: 'rose', width: 4 });
  }
  if (shown) T(b, { x: 0, y: type === 'arc' ? 2.2 : 1.2 }, type === 'arc' ? '현 AB가 더 짧아요' : '호와 현으로 둘러싸인 활꼴', { color: 'green', size: 17 });
}

// 호·현 · 부채꼴 · 활꼴 (중심각 조절)
function partScene(type) {
  const meta = {
    arc: { id: 'z0-arc', title: '호·현', info: '<b>호</b>는 원 위의 굽은 곡선, <b>현</b>은 원 위의 두 점 A, B를 곧게 이은 선분입니다. 노란 점 B를 끌어 보세요. 아래 막대는 호와 현을 곧게 펴서 길이를 비교한 것입니다.', q: ['원 위의 두 점 A, B를 잇는 두 가지 선 중 가장 짧은 길은 호일까요, 현일까요?', '현 AB입니다. 두 점을 잇는 선 중 가장 짧은 것은 직선 거리인 현입니다.'] },
    sector: { id: 'z0-sector', title: '부채꼴', info: '<b>부채꼴</b>은 원에서 두 반지름(OA, OB)과 한 호(AB)로 이루어진 부채 모양의 도형입니다. 노란 점 B를 끌어 <b>중심각</b>을 바꿔 보세요.', q: Q_SECTOR },
    segment: { id: 'z0-segment', title: '활꼴', info: '호 AB와 현 AB로 둘러싸인 활 모양의 도형이 <b>활꼴</b>입니다. 부채꼴과 달리 중심 O를 꼭짓점으로 갖지 않습니다. 노란 점 B를 끌어 보세요.', q: ['활꼴은 어떤 선들로 둘러싸인 도형인가요?', '원 위의 호와 그 양 끝을 이은 현으로 둘러싸인 도형입니다.'] }
  }[type];
  const key = type === 'sector' ? 'csA' : 'csS', min = 30, max = type === 'sector' ? 300 : 180;
  const chordTxt = (sh, r) => (sh.deg === 60 ? `현 AB = ${r} cm` : sh.deg === 180 ? `현 AB = ${2 * r} cm` : '현 AB');
  return {
    id: meta.id, title: meta.title, short: meta.title, question: (s) => s.lessonOn || s.lessonEntry ? meta.q[0] : Q_CIRCLE, guide: meta.info,
    controls: ['csR', key], presets: () => [...rPresets(), ...angPresets(key, type === 'sector' ? [30, 60, 90, 120, 180] : [60, 90, 120, 180])],
    actions: type === 'sector' ? () => [
      { id: 'sector-perimeter', label: '둘레', on: (s) => s.csMeasure === 'perimeter', run: (s) => { s.csMeasure = 'perimeter'; } },
      { id: 'sector-area', label: '넓이', on: (s) => s.csMeasure === 'area', run: (s) => { s.csMeasure = 'area'; } }
    ] : undefined,
    steps: (s) => {
      const sh = shapeOf(type, s), r = s.csR, arc = ex(r * sh.deg, 180);
      if (type === 'arc') {
        const chord = sh.deg === 60 ? `현 AB는 A, B를 곧게 이은 선분입니다. 중심각이 60°이면 현의 길이는 반지름과 같은 ${r} cm입니다.` : sh.deg === 180 ? `현 AB는 지름이 됩니다. 길이는 ${2 * r} cm입니다.` : '현 AB는 A, B를 곧게 이은 선분입니다. (현의 길이는 중1에서 계산하지 않습니다.)';
        return ['원 위의 두 점 A, B를 잇는 두 가지 선, 호 AB와 현 AB를 비교합니다.', `호 AB는 원주를 따라 굽은 곡선입니다. 길이는 2π × ${r} × ${sh.deg}/360 = ${plain(arc)} cm`, `${chord} 두 점을 잇는 가장 짧은 길은 직선 거리이므로, 현 AB가 호 AB보다 짧습니다.`];
      }
      if (type === 'sector') return [`반지름 ${r} cm, 중심각 ${sh.deg}°인 부채꼴 OAB를 관찰합니다.`, `두 반지름 OA, OB의 길이는 각각 ${r} cm입니다.`, `호 AB의 길이 = 2π × ${r} × ${sh.deg}/360 = ${plain(arc)} cm. 반지름이 같은 두 부채꼴에서 호의 길이와 넓이는 각각 중심각에 정비례합니다. 따라서 한 중심각이 다른 중심각의 2배이면 호의 길이와 넓이도 각각 2배입니다. 현의 길이는 중심각에 정비례하지 않습니다.`];
      return ['활꼴은 호 AB와 현 AB로 둘러싸인 도형입니다.', '호 AB는 원 위의 굽은 선입니다.', '현 AB는 호의 양 끝 A, B를 곧게 이은 선분입니다. 그 사이의 면이 활꼴입니다.'];
    },
    problem: problemOf('생각해 보기', meta.q[0], meta.q[1]),
    view: (s) => {
      const sh = shapeOf(type, s), r = s.csR, arc = ex(r * sh.deg, 180);
      if (type === 'segment') return { readouts: [] };
      const v = { readouts: [{ label: '중심각', value: sh.deg + '°', color: 'amber' }, { label: '호 AB의 길이', value: cmOf(arc), color: 'sky', note: `2π × ${r} × ${sh.deg}/360` }] };
      if (type === 'sector') v.readouts.push({ label: '부채꼴의 넓이', value: cm2Of(ex(r * r * sh.deg, 360)), color: 'green', note: `π × ${r}² × ${sh.deg}/360` });
      if (type === 'arc' || type === 'segment') v.readouts.push({ label: '현 AB의 길이', value: sh.deg === 60 ? `${r} cm` : sh.deg === 180 ? `${2 * r} cm` : '계산 안 함', color: 'rose' });
      v.formula = RICH(M('호의 길이 $l=2\\pi r\\times\\dfrac{\\theta}{360}$ , 부채꼴의 넓이 $S=\\pi r^2\\times\\dfrac{\\theta}{360}$'), M(`지금: $l=2\\pi\\times${r}\\times\\dfrac{${sh.deg}}{360}=${texOf(arc)}\\ \\text{cm}$`));

        const Yt = wide ? (by0 + by1 - h) / 2 : by1 + 0.85, Yb = Yt + h;

        for (let i = 0; i < N; i++) {

        }

        if (!problem && (!guided || (st.lessonOn && st.csShowArc))) T(b, { x: sourceX, y: by0 }, circ ? `원주 = ${cmOf(ex(2 * r))}` : `호 l = ${cmOf(ex(r * st.csS, 180))}`, { dy: -24, dx: wide && shortStage ? -8 : 0, align: wide && shortStage ? 'right' : 'center', color: 'sky', size: 17 });
        for (let i = 0; i < N; i++) {

            if (a && z) {
              const box = { x0: Math.min(a.x0, z.x0), y0: Math.min(a.y0, z.y0), x1: Math.max(a.x1, z.x1), y1: Math.max(a.y1, z.y1), texts: [...a.texts, ...z.texts] };

    }

  if ((oldHash.get('s') || '').split('@')[0] === 'x02') {
    const r = Number(oldHash.get('bx02_r') || 6), a = Number(oldHash.get('bx02_th') || 120);
    oldHash.set('s', 'z2-sector@2');
    oldHash.set('csR', String(clamp(Number.isFinite(r) ? r : 6, 2, 12)));
    oldHash.set('csA', String(clamp(Number.isFinite(a) ? a : 120, 30, 300)));
    oldHash.set('step', '1');
    history.replaceState(null, '', location.pathname + location.search + '#' + oldHash.toString());
  }
  // 회전하면 같은 세 반원인 기존 연습 링크를 통합 화면에 연결한다.
  if ((oldHash.get('s') || '').split('@')[0] === 'y11') {
    const left = Number(oldHash.get('f02_y11_a') || 8), right = Number(oldHash.get('f02_y11_b') || 6);
    oldHash.set('s', 'sj1@5');
    oldHash.set('f02_sj1_a', String(clamp(Number.isFinite(right) ? right : 6, 1, 8)));
    oldHash.set('f02_sj1_b', String(clamp(Number.isFinite(left) ? left : 8, 1, 8)));
    if (oldHash.has('f02_y11_u')) oldHash.set('f02_sj1_u', oldHash.get('f02_y11_u'));
    oldHash.set('step', '1');
    history.replaceState(null, '', location.pathname + location.search + '#' + oldHash.toString());
  }
  // 같은 두 작은 반원 장면의 기존 공유 링크를 통합 화면으로 옮긴다.
  if ((oldHash.get('s') || '').split('@')[0] === 'f1-semis') {
    const R = Number(oldHash.get('f1_semis_R') || 6), r1 = Number(oldHash.get('f1_semis_r1') || 3);
    const big = clamp(Number.isFinite(R) ? R : 6, 4, 9), left = clamp(Number.isFinite(r1) ? r1 : 3, 1, big - 1);
    oldHash.set('s', 'y12@5');
    oldHash.set('f02_y12_p', String(left));
    oldHash.set('f02_y12_q', String(big - left));
    oldHash.set('step', '1');
    history.replaceState(null, '', location.pathname + location.search + '#' + oldHash.toString());
  }
  // 이전 서술형 고리 링크는 같은 모형의 통합 문제로 연결한다.
  if ((oldHash.get('s') || '').split('@')[0] === 'f5-ring2') {
    oldHash.set('s', 'f5-ring@8');
    if (!oldHash.has('f5A')) oldHash.set('f5A', '9');
    if (!oldHash.has('f5B')) oldHash.set('f5B', '6');
    if (!oldHash.has('f5C')) oldHash.set('f5C', '40');
    history.replaceState(null, '', location.pathname + location.search + '#' + oldHash.toString());
  }
  // 원의 요소 확인 문제는 개념 화면 묶음에 함께 둔다.
  if ((oldHash.get('s') || '').split('@')[0] === '1101') {
    oldHash.set('s', '1101@0');
    history.replaceState(null, '', location.pathname + location.search + '#' + oldHash.toString());
  }
  const advancedAngleIds = new Set(['1719', '1807', '1104', '1105', '1809', 'x01']);
  const sourceBasic = (window.APL_CS_GROUPS || []).find((g) => g.id === 'basic');
  const legacyTriLink = (oldHash.get('s') || '').split('@')[0] === 'f1-tri';
  const mods = (window.APL_CS_GROUPS || []).filter((g) => g && Array.isArray(g.scenes) && g.scenes.length)
    .map((g) => g.id === 'basic' ? { ...g, scenes: g.scenes.filter((sc) => sc.id !== 'x02' && sc.id !== '1101' && !advancedAngleIds.has(sc.id)) } : g.id === 'f01' ? { ...g, scenes: g.scenes.filter((sc) => sc.id !== 'f1-semis' && (legacyTriLink || sc.id !== 'f1-tri')) } : g);
  const elementQuiz = sourceBasic && sourceBasic.scenes.find((sc) => sc.id === '1101');
  if (elementQuiz && !mineGroups[0].scenes.some((sc) => sc.id === '1101')) mineGroups[0].scenes.push(elementQuiz);
  if (sourceBasic) mods.push({ order: 90, id: 'basic-advanced', title: '각과 호의 응용', short: '각과 호의 응용', scenes: sourceBasic.scenes.filter((sc) => advancedAngleIds.has(sc.id)) });
  // 좌표계: 이 파일의 탭(①③④)과 F03·F05·F06·중심각 탭은 도형 좌표(figure, y 아래쪽), F01·F04 모듈은 수학 좌표(cartesian, y 위쪽)로 그려져 있어 장면마다 알려 줍니다.
  const CARTESIAN = { f01: 1, f04: 1 };
  mods.forEach((g) => { if (CARTESIAN[g.id]) g.scenes.forEach((sc) => { sc.boardKind = 'cartesian'; }); });
  const groups = [...mineGroups, ...mods].sort((a, b) => (a.order || 0) - (b.order || 0)).map((g) => ({ id: g.id, title: g.title, short: g.short || g.title, scenes: g.scenes }));
  // 장면을 묶음 간 이동해도 예전 공유 링크는 동일한 장면을 연다.
  const linkedId = (oldHash.get('s') || '').split('@')[0];
  const linkedGroup = groups.findIndex((g) => g.scenes.some((sc) => sc.id === linkedId));
  if (linkedId && linkedGroup >= 0 && oldHash.get('s') !== linkedId + '@' + linkedGroup) {
    oldHash.set('s', linkedId + '@' + linkedGroup);
    history.replaceState(null, '', location.pathname + location.search + '#' + oldHash.toString());
  }
  const params = { ...PARAMS };
  mods.forEach((g) => Object.assign(params, g.params || {}));
  // 보기 선택 없이 '지금 보기'로 연 답도, 문제의 수치 조건이 바뀌면 다시 잠급니다.
  // 조각 이동·굴리기·모으기 진행은 같은 문제를 살펴보는 조작이므로 공개 상태를 유지합니다.
  const motionKeys = new Set(['csQ', 'csD', 'csP', 'csT', 'f3t', 'f5T', 'rlT', 'swT', 'gtT', 'bx01_t']);
  const motionKey = (key) => motionKeys.has(key) || /^f[14]_.+_t$/.test(key) || /^f02_.+_(u|sw)$/.test(key);
  const problemStates = new WeakMap();
  groups.forEach((group) => group.scenes.forEach((sc) => {
    const view = sc.view;
    const stagedFormula = sourceBasic && sourceBasic.scenes.includes(sc); // 중심각 모듈은 이미 현재 단계까지만 식을 만듭니다.
    // 첫 enter 뒤에 조작부·도구 막대가 배치되어 무대 크기가 바뀔 수 있습니다.
    // 이 방식으로 맞추는 원/둘레/기본 장면만 최종 유효 영역에서 다시 잽니다.
    const stageFit = stagedFormula || (FIT[sc.id] && !sc.id.startsWith('z3-'));
    let fitting = false, fitStage = '', fitBoard = null;
    if (stageFit) {
      const enter = sc.enter;
      sc.enter = (s, lab) => { if (lab && s === lab.s) fitStage = ''; if (enter) enter(s, lab); };
    }
    const fitForStage = (s, lab) => {
      if (!stageFit || fitting || !lab || s !== lab.s || !lab.board || lab.board.thumb || !lab._measureFocus) return;
      const b = lab.board, ins = b.insets;
      // A short mobile question stage shows one given angle. Reserving the
      // labels of every possible future angle makes its original figure tiny.
      const currentPart = b.W < 560 && lab.tab === 'problem' && ['z0-arc', 'z0-sector', 'z0-segment', 'z2-sector', 'z2-segment'].includes(sc.id);
      const key = [b.W, b.H, b.fs, ins.top, ins.right, ins.bottom, ins.left, currentPart ? [lab.tab, s.csR, s.csA, s.csS].join(':') : ''].join('|');
      if (fitStage === key && fitBoard === b) return;
      const keep = { ...s }, savedView = { focus: b.focus, zoom: b.zoom, panX: b.panX, panY: b.panY }, tab = lab.tab;
      let focus = null;
      fitting = true;
      try {
        b.setFocus(CANON_VIEW, true);
        if (FIT[sc.id] && !currentPart) {
          lab.tab = 'explore';
          for (const values of FIT[sc.id]) { Object.assign(s, values); const measured = lab._measureFocus(sc); if (measured) focus = unionFocus(focus, measured); }
        } else focus = lab._measureFocus(sc);
      } finally {
        Object.keys(s).forEach(k => { if (!(k in keep)) delete s[k]; });
        Object.assign(s, keep); Object.assign(b, savedView); lab.tab = tab; fitting = false;
      }
      if (focus) { sc._focus = focus; b.setFocus(focus, false); fitStage = key; fitBoard = b; }
    };
    sc.view = (s, lab) => {
      fitForStage(s, lab);
      if (!fitting && lab && lab.s === s && lab.scene && lab.scene.id === sc.id) {
        const controls = typeof sc.controls === 'function' ? sc.controls(s) : sc.controls || [];
        const key = JSON.stringify(controls.filter((id) => !motionKey(id)).map((id) => [id, s[id]]));
        const previous = problemStates.get(s);
        // 해설의 step은 타임라인이 정합니다. focus 측정의 임시 값으로 되돌리지 않습니다.
        if (!(s.lessonOn || s.lessonEntry) && previous && previous.id === sc.id && previous.key !== key) { s.revealed = false; s.step = sc.startStep || 1; }
        problemStates.set(s, { id: sc.id, key });
      }
      const value = (typeof view === 'function' ? view(s, lab) : view) || {};
      // 해설은 대본이 여는 그림·칩과 자막으로 진행합니다. 탐구용 계산표·풀이 전문은 직접 해 보기에서 엽니다.
      if (s.lessonOn || s.lessonEntry) return { ...value, readouts: [], formula: '', guide: '', summary: null, rule: null, alert: null, notes: '', parts: [], status: null, chips: s.lessonEntry ? [] : value.chips };
      const steps = typeof sc.steps === 'function' ? sc.steps(s) : sc.steps;
      // 계산식에도 최종 답이 들어 있으므로 단계별 풀이와 같은 공개 시점을 지킵니다.
      if (!stagedFormula && lab && lab.tab === 'review' && !s.revealed && steps && s.step < steps.length) return { ...value, formula: '', summary: null };
      return value;
    };
  }));
  APLab.createLab({
    id: 'g7-circle-sector',
    stackFractions: true, // 패널 글의 슬래시·유니코드 분수를 쌓은 분수로 바꿉니다 (kit/apl-core.js APLab.stackFr)
    title: '원과 부채꼴',
    courseName: '중1',
    unit: '평면도형 · 원과 부채꼴',
    courseColor: 'var(--m-sky)',
    home: '../index.html#g7',
    legacy: '../../labs/g7/원과_부채꼴_통합_마스터_스튜디오.html',
    board: { kind: 'figure', autoFit: true, pad: 0.02, minZoom: 0.5, maxZoom: 6 },
    // 어느 장면에서 오든 처음 열 때와 같은 맞춤이 되도록, 장면에 들어갈 때 화면 범위를 처음 상태로 되돌립니다(작은 그림 만들 때는 제외).
    enter: (s, sc, lab) => { if (lab && lab.board && s === lab.s) { lab.board.setFocus(CANON_VIEW, true); lab.board.setPanes(null); lab.board.setInsets({ top: 0, right: 0, bottom: 0, left: 0 }); } },
    state: { csN: 16, csConceptMode: '', csConceptRead: 0, csConceptShow: false },
    params,
    videos: (window.APL_VIDEOS || {})['g7-circle-sector'], // 장면 id → 영상 대본 (kit/apl-player.js, labs/g7-circle-sector/video.js)
    lessons: (window.APL_LESSONS || {})['g7-circle-sector'], // 장면 id → 해설 (labs/g7-circle-sector/lesson.js). 해설이 있는 장면은 영상보다 해설이 먼저
    groups
  });
  const setupLearningLevels = () => {
    const lab = window.lab;
    if (!lab || !lab.ui || !lab.ui.railWrap || lab.ui.railWrap.dataset.csLevels) return;
    const levels = [
      { id: 'concept', label: '개념', groups: ['z0', 'z3'] },
      { id: 'basic', label: '기본', groups: ['basic', 'z2'] },
      { id: 'advanced', label: '심화', first: 'basic-advanced', groups: ['basic-advanced', 'f01', 'f02', 'f03', 'f04', 'f5', 'rolling', 'f06-swept', 'f06-goat'] }
    ];
    const categoryOf = (id) => levels.find((level) => level.groups.includes(id)) || levels[2];
    const row = document.createElement('div');
    row.className = 'cs-levels';
    row.setAttribute('role', 'group');
    row.setAttribute('aria-label', '학습 수준');
    const buttons = levels.map((level) => {
      const button = document.createElement('button');
      button.type = 'button'; button.textContent = level.label;
      button.addEventListener('click', () => {
        if (categoryOf(lab.scene.group.id).id === level.id) return;
        const i = lab.list.findIndex((sc) => level.first ? sc.group.id === level.first : level.groups.includes(sc.group.id));
        if (i >= 0) lab.goScene(i);
      });
      row.append(button); return button;
    });
    const style = document.createElement('style');
    style.textContent = `.apl-railwrap.cs-has-levels{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 8px}.cs-levels{grid-column:1/-1;display:flex;gap:6px}.cs-levels button{min-height:34px;padding:0 16px;border:1px solid var(--line);border-radius:999px;background:transparent;color:var(--text-2);font:700 var(--fs-sm) var(--font-ui)}.cs-levels button[aria-pressed="true"]{background:var(--card);border-color:var(--accent);color:var(--text)}.cs-has-levels .apl-rail{grid-column:1;min-width:0}.cs-has-levels .apl-all-btn{grid-column:2}.cs-has-levels .apl-scene-tab .n{display:none}@media(max-width:560px){.cs-levels button{flex:1;min-height:38px}}`;
    document.head.append(style);
    lab.ui.railWrap.dataset.csLevels = '1';
    lab.ui.railWrap.classList.add('cs-has-levels');
    lab.ui.railWrap.prepend(row);
    const renderRail = lab._buildRail.bind(lab);
    lab._buildRail = () => {
      renderRail();
      const active = categoryOf(lab.scene.group.id);
      buttons.forEach((button, i) => button.setAttribute('aria-pressed', String(levels[i].id === active.id)));
      Array.from(lab.ui.rail.children).forEach((button, i) => {
        const visible = lab.groups[i] && categoryOf(lab.groups[i].id).id === active.id;
        button.style.display = visible ? '' : 'none';
      });
      lab._edgeFade(lab.ui.rail);
    };
    lab._buildRail();
  };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', setupLearningLevels, { once: true });
  else setupLearningLevels();
}
Promise.all(MODULES.map((m) => loadScript(`g7-circle-sector/${m}.js`))).then(start);
});
</script>
