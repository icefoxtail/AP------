<script>
/* ==========================================================================
   중1 · 원과 부채꼴 (AP Math Lab 2.0)
   탭 구성(order 순): ① 원 알아보기(10) · 중심각과 호·넓이(15, basic.js) · ③ 길이·둘레(20) · ④ 넓이 원리(30)
                      · F01~F05(61~65) · F06 굴리기(66) · 원이 지나간 자리·묶인 동물의 영역(67·68)
   이 파일이 직접 가진 탭은 ① ③ ④ 입니다(10·20·30). 나머지는 labs/g7-circle-sector/*.js 모듈이
   window.APL_CS_GROUPS 에 { order, id, title, short, params?, scenes } 묶음을 등록하면 order 순으로 붙습니다.
   원칙(학생 가독성)
   - 그림은 무대 가득(autoFit) · 숫자는 모두 정확한 π 표기(소수 근삿값 없음) · 라벨은 화면 기준 15px 이상
   - 색의 역할: 하늘=호(굽은 선) · 분홍=곧은 선(반지름·지름·현) · 노랑=각·점 P·지나간 자취 · 초록=색칠한 면
   - 모든 도형은 막대 또는 손잡이로 조절되고, 라벨·자취·식·정리 단계·정답이 그 값으로 다시 계산됩니다.
   - 움직임은 가로로만(굴리기·밀기). 세로 이동 없음.
   ========================================================================== */
window.addEventListener('DOMContentLoaded', function () {
'use strict';
const PI = Math.PI, TAU = 2 * PI;
const clamp = APLab.clamp;
const rad = (d) => d * PI / 180;
const ease = (x) => { x = clamp(x, 0, 1); return x * x * (3 - 2 * x); };

/* ---------- 정확한 값: π 계수 + 상수 (분수 유지, 소수 없음) ---------- */
const gcd = (a, b) => { a = Math.abs(a); b = Math.abs(b); while (b) { const t = a % b; a = b; b = t; } return a || 1; };
const frac = (n, d = 1) => { if (d < 0) { n = -n; d = -d; } const g = gcd(n, d); return [n / g, d / g]; };
const addFrac = (a, b) => frac(a[0] * b[1] + b[0] * a[1], a[1] * b[1]);
const ex = (pn = 0, pd = 1, cn = 0, cd = 1) => ({ pi: frac(pn, pd), c: frac(cn, cd) });
const plus = (a, b) => ({ pi: addFrac(a.pi, b.pi), c: addFrac(a.c, b.c) });
const scaleEx = (e, num, den) => ({ pi: frac(e.pi[0] * num, e.pi[1] * den), c: frac(e.c[0] * num, e.c[1] * den) });
const val = (e) => e.pi[0] / e.pi[1] * PI + e.c[0] / e.c[1];
const rs = ([n, d], pi) => (n === 0 ? '' : d === 1 ? (pi ? (Math.abs(n) === 1 ? (n < 0 ? '-π' : 'π') : `${n}π`) : String(n)) : (pi ? `${n}π/${d}` : `${n}/${d}`));
const plain = (e) => {
  const a = rs(e.pi, true), c = e.c[0];
  if (!a) return c === 0 ? '0' : rs(e.c, false);
  if (c === 0) return a;
  return c > 0 ? `${a} + ${rs(e.c, false)}` : `${a} − ${rs([-e.c[0], e.c[1]], false)}`;
};
const cmOf = (e) => (e ? plain(e) + ' cm' : '');
const cm2Of = (e) => (e ? plain(e) + ' cm²' : '');
const rl = ([n, d], pi) => { if (n === 0) return ''; const s = n < 0 ? '-' : '', m = Math.abs(n), nu = pi ? (m === 1 ? '\\pi' : `${m}\\pi`) : String(m); return s + (d === 1 ? nu : `\\dfrac{${nu}}{${d}}`); };
const texOf = (e) => { const a = rl(e.pi, true), b = rl(e.c, false); return (a && b ? (b[0] === '-' ? a + b : a + '+' + b) : a || b) || '0'; };
const M = (s) => APLab.renderMath(APLab.esc(s));
const RICH = (...p) => `<div class="apl-rich">${p.map((x) => `<p>${x}</p>`).join('')}</div>`;

/* ---------- 그리기 도우미 (figure 좌표: y 아래쪽, 각은 시계 방향) ---------- */
const pt = (cx, cy, R, a) => ({ x: cx + R * Math.cos(a), y: cy + R * Math.sin(a) });
const O0 = { x: 0, y: 0 };
const textW = (t, size) => { let w = 0; for (const ch of String(t)) { const c = ch.charCodeAt(0); w += c >= 0x1100 ? size * 1.0 : ch === ' ' ? size * 0.32 : size * 0.62; } return w; };
const T = (b, p, t, o = {}) => b.text(p, t, { dx: o.dx || 0, dy: o.dy || 0, color: o.color || 'ink', size: (o.size || 16) * (b.W < 560 ? 0.9 : 1), weight: 800, align: o.align || 'center', baseline: 'middle' });
// 점 p 에서 (nx,ny) 방향으로 글자 상자가 닿지 않을 만큼 비켜 놓은 라벨
function tagN(b, p, nx, ny, t, o = {}) {
  const size = o.size || 16, d = Math.abs(nx) * (textW(t, size) / 2 + 4) + Math.abs(ny) * size * 0.62 + (o.gap == null ? 8 : o.gap);
  T(b, p, t, { ...o, dx: nx * d, dy: ny * d });
}
// 같은 자리에 여러 줄을 쌓는 라벨(바깥쪽으로 나가며 아래/위로 한 줄씩)
function tagStack(b, p, nx, ny, items, o = {}) {
  const size = o.size || 16, w = Math.max(...items.map((it) => textW(it.t, size))), d = Math.abs(nx) * (w / 2 + 4) + Math.abs(ny) * size * 0.62 + (o.gap == null ? 10 : o.gap), dirY = ny < -0.35 ? -1 : 1;
  const n = items.length;
  items.forEach((it, i) => T(b, p, it.t, { dx: nx * d, dy: ny * d + dirY * size * 1.3 * (dirY < 0 ? n - 1 - i : i), color: it.color, size })); // 위에서 아래로 주어진 순서대로
}
const arcPts = (cx, cy, R, a0, a1, n = 72) => { const o = []; for (let i = 0; i <= n; i++) o.push(pt(cx, cy, R, a0 + (a1 - a0) * i / n)); return o; };
const lerp = (A, B, f) => ({ x: A.x + (B.x - A.x) * f, y: A.y + (B.y - A.y) * f });
const ghost = (b) => b.circle(O0, 1, { color: 'muted', width: 1.8, dash: [6, 6], alpha: 0.7 });
const fillWedge = (b, a0, a1) => b.arc(O0, 1, a0, a1, { sector: true, fill: 'green', fillAlpha: 0.26, color: null });
const fillSegment = (b, a0, a1) => b.path(arcPts(0, 0, 1, a0, a1, 64), { close: true, fill: 'green', fillAlpha: 0.26, color: null });
// 중심각 표시: 부채꼴 안쪽에 노란 부채꼴 + 값(직각은 네모)
function angleMark(b, a0, a1, text, o = {}) {
  const k = b.k || 100, th = Math.abs(a1 - a0), rpx = o.r || 30, am = (a0 + a1) / 2;
  if (Math.abs(th - PI / 2) < 1e-6 && !o.noRight) b.right(O0, pt(0, 0, 1, a0), pt(0, 0, 1, a1), { size: 16, color: 'amber' });
  else b.arc(O0, rpx / k, a0, a1, { sector: true, fill: 'amber', fillAlpha: 0.24, color: 'amber', width: 2.2 });
  const need = (textW(text, 17) / 2 + 8) / Math.tan(clamp(th / 2, 0.2, 1.4));
  const dist = Math.min(Math.max(rpx + 24, need), k * 0.85);
  T(b, O0, text, { dx: Math.cos(am) * dist, dy: Math.sin(am) * dist, color: 'amber', size: 17 });
}
const dot = (b, p, c = 'ink', r = 5.5) => b.point(p, { color: c, r });
// 호·원은 '중심'만 맞춤 범위에 잡히므로, 그림이 차지하는 범위를 보이지 않는 선으로 알려 줍니다.
const bbox = (b, x0, y0, x1, y1) => b.path([{ x: x0, y: y0 }, { x: x1, y: y1 }], { color: null });

/* ---------- 부채꼴·활꼴 도형 ---------- */
// type: semi | quarter | sector | segment | arc   (arc 는 호·현 장면: 도형 모양은 활꼴과 같음)
function shapeOf(type, s) {
  const deg = type === 'semi' ? 180 : type === 'quarter' ? 90 : (type === 'segment' || type === 'arc') ? s.csS : s.csA;
  const a0 = type === 'semi' ? PI : -PI / 2;
  return { type, deg, th: rad(deg), a0, a1: a0 + rad(deg) };
}
// 둘레를 이루는 선(경계 요소) 목록. exact 는 정확한 길이, len 은 같은 비율의 수치(그림·띠 폭용)
function boundary(sh, r) {
  const A = pt(0, 0, 1, sh.a0), B = pt(0, 0, 1, sh.a1);
  const arc = { kind: 'arc', color: 'sky', a0: sh.a0, a1: sh.a1, exact: ex(r * sh.deg, 180), len: r * sh.th, at: (f) => pt(0, 0, 1, sh.a0 + f * (sh.a1 - sh.a0)), deg: sh.deg };
  const line = (P, Q, name, e, len) => ({ kind: 'line', color: 'rose', P, Q, name, exact: e, len, at: (f) => lerp(P, Q, f) });
  if (sh.type === 'semi') { arc.name = '반원호'; return [arc, line(B, A, '지름', ex(0, 1, 2 * r), 2 * r)]; }
  if (sh.type === 'quarter') { arc.name = '사분원호'; return [arc, line(B, O0, '반지름', ex(0, 1, r), r), line(O0, A, '반지름', ex(0, 1, r), r)]; }
  if (sh.type === 'sector') { arc.name = '호 AB'; return [arc, line(B, O0, '반지름', ex(0, 1, r), r), line(O0, A, '반지름', ex(0, 1, r), r)]; }
  const chordEx = sh.deg === 60 ? ex(0, 1, r) : sh.deg === 180 ? ex(0, 1, 2 * r) : null;
  arc.name = '호 AB';
  return [arc, line(B, A, '현 AB', chordEx, 2 * r * Math.sin(sh.th / 2))];
}
const NUMS = ['①', '②', '③', '④'];

/* 점 P 가 경계를 따라 지나온 만큼(0~1) → 지나간 구간과 정확한 길이 (호는 15° 단위, 선은 1 cm 단위로 내림) */
function tracePlan(segs, f) {
  const total = segs.reduce((a, g) => a + g.len, 0);
  let dist = clamp(f, 0, 1) * total, e = ex(), known = true, P = segs[0].at(0);
  const done = [];
  for (let i = 0; i < segs.length; i++) {
    const g = segs[i], fs = Math.min(1, dist / g.len);
    if (!(fs > 0)) break;
    done.push({ g, f: fs });
    P = g.at(fs);
    let part = null;
    if (g.exact) {
      if (fs >= 0.9999) part = g.exact;
      else {
        const N = g.kind === 'arc' ? g.deg : Math.round(g.exact.c[0] / g.exact.c[1]);
        const q = g.kind === 'arc' && N % 15 === 0 ? Math.floor(fs * N / 15) * 15 : Math.floor(fs * N + 1e-9);
        part = scaleEx(g.exact, q, N);
      }
    }
    if (part) e = plus(e, part); else known = false;
    dist -= g.len;
    if (dist <= 1e-9) break;
  }
  return { done, P, ex: known ? e : null, total };
}
const cumTarget = (segs, k) => { const total = segs.reduce((a, g) => a + g.len, 0); let acc = 0; for (let i = 0; i < k && i < segs.length; i++) acc += segs[i].len; return acc / total; };

/* ---------- 공통 조작: 재생 · 장면 상태 ---------- */
const playAction = (key, max, label) => ({
  id: 'play', play: true, primary: true, icon: (s) => (s.playing ? 'pause' : 'play'),
  label: (s) => (s.playing ? '일시 정지' : s[key] >= max - 0.5 ? '다시 재생' : label),
  on: (s) => s.playing,
  run: (s) => { if (s.playing) s.playing = false; else { if (s[key] >= max - 0.5) s[key] = 0; s.playing = true; } }
});
const resetAction = (key) => ({ id: 'reset', icon: 'reset', label: '처음으로', run: (s) => { s.playing = false; s[key] = 0; } });
const mkTick = (key, max, dur, reviewTarget) => (s, dt, lab) => {
  let again = false;
  if (s.playing) { s[key] = Math.min(max, s[key] + dt * max / dur); if (s[key] >= max) s.playing = false; again = true; }
  else if (reviewTarget && lab && lab.tab === 'review') {
    const tg = reviewTarget(s), d = tg - s[key];
    if (Math.abs(d) > 0.4) { s[key] += clamp(d, -dt * max * 0.35, dt * max * 0.35); again = true; } else if (d !== 0) s[key] = tg;
  }
  return again;
};
const rPresets = () => [{ group: '반지름 r', label: '3 cm', apply: (s) => { s.csR = 3; }, on: (s) => s.csR === 3 }, { label: '6 cm', apply: (s) => { s.csR = 6; }, on: (s) => s.csR === 6 }, { label: '9 cm', apply: (s) => { s.csR = 9; }, on: (s) => s.csR === 9 }, { label: '12 cm', apply: (s) => { s.csR = 12; }, on: (s) => s.csR === 12 }];
const angPresets = (key, list) => list.map((a, i) => ({ group: i === 0 ? '중심각' : '', label: a + '°', apply: (s) => { s[key] = a; }, on: (s) => s[key] === a }));
// 중심각 손잡이(점 B): 끌면 중심각이 15° 단위로 바뀜
function angleHandle(b, s, key, a0, min, max) {
  const B = pt(0, 0, 1, a0 + rad(s[key]));
  b.handle('B', B, {
    color: 'amber', ariaLabel: '중심각 손잡이', drag: (w) => {
      let raw = ((Math.atan2(w.y, w.x) - a0) * 180 / PI + 720) % 360;
      if (raw > (max + 360) / 2) raw = min;
      s[key] = clamp(Math.round(raw / 15) * 15, min, max);
    }
  });
}

const Q_CIRCLE = '원의 요소(중심·반지름·지름·호·현·부채꼴·활꼴)는 각각 어떤 선이고 어떤 면일까요?';
const Q_PERI = '도형의 바깥 경계는 어떤 선들로 이루어져 있고, 길이를 어떻게 더해야 둘레가 될까요?';
const Q_AREA = '원과 부채꼴의 넓이 공식은 도형을 어떻게 나누고 다시 놓아서 만들어질까요?';
const problemOf = (tag, q, a) => ({ tag, text: () => APLab.esc(q), answer: () => APLab.esc(a) });
const Q_SECTOR = ['같은 반지름에서 중심각이 2배이면 무엇이 2배인가요?', '호의 길이와 부채꼴의 넓이가 각각 2배가 됩니다. 현의 길이는 중심각에 정비례하지 않습니다.'];
const Q_SEGMENT = ['활꼴 둘레는 어떤 선으로 만들어질까요?', '호 AB와 현 AB입니다. 점선으로 표시된 두 반지름은 활꼴의 경계가 아니므로 둘레에 포함되지 않습니다.'];

/* ======================================================================
   ① 원 알아보기
   ====================================================================== */
const sCenter = {
  id: 'z0-center', title: '중심·반지름', short: '중심·반지름', question: Q_CIRCLE,
  guide: '원의 중심 O에서 원 위의 모든 점까지의 거리는 <b>반지름 r</b>로 같습니다. <b>노란 점 P</b>를 끌어 한 바퀴 돌려 보세요. 점이 지나간 길이가 호의 길이이고, 한 바퀴 돌면 <b>원주</b>가 됩니다.',
  controls: ['csR', 'csQ'], presets: rPresets, actions: () => [playAction('csQ', 360, '점 P 한 바퀴'), resetAction('csQ')],
  tick: mkTick('csQ', 360, 7),
  steps: (s) => [
    `원의 중심 O와 원 위의 한 점 P를 이은 선분이 반지름입니다. r = ${s.csR} cm`,
    `중심 O에서 원 위의 어느 점까지든 거리는 ${s.csR} cm로 같습니다.`,
    `점 P가 원을 한 바퀴 돈 길이가 원주입니다. 원주 = 2πr = ${plain(ex(2 * s.csR))} cm`
  ],
  problem: problemOf('생각해 보기', '원의 지름은 반지름의 몇 배일까요?', '2배입니다. 지름은 원의 중심 O를 지나는 가장 긴 현이며 길이는 2r입니다.'),
  view: (s) => {
    const r = s.csR, deg = Math.floor(s.csQ / 15) * 15, run = ex(r * deg, 180);
    return {
      readouts: [{ label: '반지름 r', value: r + ' cm', color: 'rose' }, { label: '원주 2πr', value: cmOf(ex(2 * r)), color: 'sky' }, { label: '점 P가 지나간 길이', value: s.csQ >= 359 ? cmOf(ex(2 * r)) : cmOf(run), color: 'amber', note: `중심각 ${Math.round(s.csQ)}°만큼` }],
      formula: RICH(M('원주 $l=2\\pi r$ , 원의 넓이 $S=\\pi r^2$'), M(`지금: $l=2\\pi\\times${r}=${texOf(ex(2 * r))}\\ \\text{cm}$`))
    };
  },
  draw: (b, s, v, lab) => {
    const st = lab && lab.tab === 'review' ? s.step : 99, r = s.csR, ph = rad(s.csQ), a = -PI / 2 + ph, P = pt(0, 0, 1, a);
    bbox(b, -1, -1, 1, 1.0);
    b.circle(O0, 1, { fill: 'green', fillAlpha: 0.2, color: 'sky', width: 3.6 });
    if (st >= 2) for (let i = 1; i < 4; i++) { const Q = pt(0, 0, 1, a + i * PI / 2); b.seg(O0, Q, { color: 'rose', width: 2, alpha: 0.5 }); b.ticks(O0, Q, { color: 'amber' }); }
    if ((lab && lab.tab === 'review' && s.step >= 3) || s.csQ >= 359) b.circle(O0, 1, { color: 'sky', width: 7, glow: true });
    if (s.csQ > 0) b.arc(O0, 1, -PI / 2, a, { color: 'amber', width: 7, alpha: 0.9 });
    if (st >= 1) { b.seg(O0, P, { color: 'rose', width: 4 }); b.ticks(O0, P, { color: 'amber' }); }
    b.handle('P', P, { color: 'amber', ariaLabel: '점 P', drag: (w) => { s.playing = false; s.csQ = clamp(Math.round((((Math.atan2(w.y, w.x) + PI / 2) * 180 / PI) + 720) % 360 / 15) * 15, 0, 360); } });
    dot(b, O0, 'ink', 6);
    T(b, O0, '중심 O', { dx: -2, dy: 24, size: 16 });
    let n = { x: -Math.sin(a), y: Math.cos(a) };
    if (n.y > 1e-6 || (Math.abs(n.y) <= 1e-6 && n.x < 0)) n = { x: -n.x, y: -n.y }; // 반지름 위쪽에 라벨
    tagN(b, lerp(O0, P, 0.5), n.x, n.y, `r = ${r} cm`, { color: 'rose', size: 17 });
    T(b, { x: 0, y: 1 }, `원주 2πr = ${cmOf(ex(2 * r))}`, { dy: 36, color: 'sky', size: 17 });
    if (s.csQ > 0) T(b, { x: 0, y: 1 }, `점 P가 지나간 길이 = ${cmOf(s.csQ >= 359 ? ex(2 * r) : ex(r * Math.floor(s.csQ / 15) * 15, 180))}`, { dy: 64, color: 'amber', size: 16 });
  }
};

// 호·현 · 부채꼴 · 활꼴 (중심각 조절)
function partScene(type) {
  const meta = {
    arc: { id: 'z0-arc', title: '호·현', info: '<b>호</b>는 원 위의 굽은 곡선, <b>현</b>은 원 위의 두 점 A, B를 곧게 이은 선분입니다. 노란 점 B를 끌어 보세요. 아래 막대는 호와 현을 곧게 펴서 길이를 비교한 것입니다.', q: ['원 위의 두 점 A, B를 잇는 두 가지 선 중 가장 짧은 길은 호일까요, 현일까요?', '현 AB입니다. 두 점을 잇는 선 중 가장 짧은 것은 직선 거리인 현입니다.'] },
    sector: { id: 'z0-sector', title: '부채꼴', info: '<b>부채꼴</b>은 원에서 두 반지름(OA, OB)과 한 호(AB)로 이루어진 부채 모양의 도형입니다. 노란 점 B를 끌어 <b>중심각</b>을 바꿔 보세요.', q: Q_SECTOR },
    segment: { id: 'z0-segment', title: '활꼴', info: '호 AB와 현 AB로 둘러싸인 활 모양의 도형이 <b>활꼴</b>입니다. 부채꼴과 달리 중심 O를 꼭짓점으로 갖지 않습니다. 노란 점 B를 끌어 보세요.', q: Q_SEGMENT }
  }[type];
  const key = type === 'sector' ? 'csA' : 'csS', min = 30, max = type === 'sector' ? 300 : 180;
  const chordTxt = (sh, r) => (sh.deg === 60 ? `현 AB = ${r} cm` : sh.deg === 180 ? `현 AB = ${2 * r} cm` : '현 AB');
  return {
    id: meta.id, title: meta.title, short: meta.title, question: Q_CIRCLE, guide: meta.info,
    controls: ['csR', key], presets: () => [...rPresets(), ...angPresets(key, type === 'sector' ? [30, 60, 90, 120, 180] : [60, 90, 120, 180])],
    steps: (s) => {
      const sh = shapeOf(type, s), r = s.csR, arc = ex(r * sh.deg, 180);
      if (type === 'arc') return ['원 위의 두 점 A, B를 잇는 두 가지 선, 호 AB와 현 AB를 비교합니다.', `호 AB는 원주를 따라 굽은 곡선입니다. 길이는 2π × ${r} × ${sh.deg}/360 = ${plain(arc)} cm`, sh.deg === 60 ? `현 AB는 A, B를 곧게 이은 선분입니다. 중심각이 60°이면 현의 길이는 반지름과 같은 ${r} cm` : sh.deg === 180 ? `현 AB는 지름이 됩니다. 길이는 ${2 * r} cm` : '현 AB는 A, B를 곧게 이은 선분입니다. (현의 길이는 중1에서 계산하지 않습니다)'];
      if (type === 'sector') return [`반지름 ${r} cm, 중심각 ${sh.deg}°인 부채꼴 OAB를 관찰합니다.`, `두 반지름 OA, OB의 길이는 각각 ${r} cm입니다.`, `호 AB의 길이 = 2π × ${r} × ${sh.deg}/360 = ${plain(arc)} cm`];
      return ['활꼴은 호 AB와 현 AB로 둘러싸인 도형입니다.', `호 AB의 길이 = 2π × ${r} × ${sh.deg}/360 = ${plain(arc)} cm`, sh.deg === 60 ? `현 AB = ${r} cm` : sh.deg === 180 ? `현 AB = ${2 * r} cm (지름)` : '현 AB는 두 점을 곧게 이은 선분입니다. 점선 반지름은 경계가 아닙니다.'];
    },
    problem: problemOf('생각해 보기', meta.q[0], meta.q[1]),
    view: (s) => {
      const sh = shapeOf(type, s), r = s.csR, arc = ex(r * sh.deg, 180), v = { readouts: [{ label: '중심각', value: sh.deg + '°', color: 'amber' }, { label: '호 AB의 길이', value: cmOf(arc), color: 'sky', note: `2π × ${r} × ${sh.deg}/360` }] };
      if (type === 'sector') v.readouts.push({ label: '부채꼴의 넓이', value: cm2Of(ex(r * r * sh.deg, 360)), color: 'green', note: `π × ${r}² × ${sh.deg}/360` });
      if (type === 'arc' || type === 'segment') v.readouts.push({ label: '현 AB의 길이', value: sh.deg === 60 ? `${r} cm` : sh.deg === 180 ? `${2 * r} cm` : '계산 안 함', color: 'rose' });
      v.formula = RICH(M('호의 길이 $l=2\\pi r\\times\\dfrac{\\theta}{360}$ , 부채꼴의 넓이 $S=\\pi r^2\\times\\dfrac{\\theta}{360}$'), M(`지금: $l=2\\pi\\times${r}\\times\\dfrac{${sh.deg}}{360}=${texOf(arc)}\\ \\text{cm}$`));
      if (type === 'segment' || type === 'arc') v.alert = sh.deg === 180 ? { tone: 'info', text: '중심각이 180°이면 현 AB는 지름(2r)이 되고, 활꼴과 부채꼴은 모두 반원이 됩니다.' } : { tone: 'info', text: '일반 각도의 현의 길이와 활꼴의 넓이를 수로 구하는 것은 중1 과정이 아닙니다. 호 + 현의 구조만 구분합니다.' };
      return v;
    },
    draw: (b, s, v, lab) => {
      const sh = shapeOf(type, s), r = s.csR, th = sh.th, a0 = sh.a0, a1 = sh.a1, A = pt(0, 0, 1, a0), B = pt(0, 0, 1, a1), am = (a0 + a1) / 2;
      const st = lab && lab.tab === 'review' ? s.step : 99;
      bbox(b, -1, -1, 1, type === 'arc' ? 1.9 : 1);
      ghost(b);
      if (type === 'sector') fillWedge(b, a0, a1); else fillSegment(b, a0, a1);
      if (type !== 'sector') { b.seg(O0, A, { color: 'muted', width: 2, dash: [6, 6] }); b.seg(O0, B, { color: 'muted', width: 2, dash: [6, 6] }); }
      b.arc(O0, 1, a0, a1, { color: 'sky', width: type === 'arc' && st < 2 ? 3 : 5.2, glow: st === 2 && type !== 'sector' });
      if (type === 'sector') { b.seg(B, O0, { color: 'rose', width: 4.4 }); b.seg(O0, A, { color: 'rose', width: 4.4 }); b.ticks(O0, A, { color: 'amber' }); b.ticks(O0, B, { color: 'amber' }); }
      else { b.seg(B, A, { color: 'rose', width: 4.4, glow: st === 3 }); b.ticks(O0, A, { color: 'amber', size: 5 }); b.ticks(O0, B, { color: 'amber', size: 5 }); }
      angleMark(b, a0, a1, `${sh.deg}°`);
      angleHandle(b, s, key, a0, min, max);
      dot(b, O0, 'ink', 5.5); dot(b, A, 'ink', 5); dot(b, B, 'ink', 5);
      const bis = { x: Math.cos(am), y: Math.sin(am) };
      T(b, O0, 'O', { dx: -bis.x * 18 - 4, dy: -bis.y * 18 + 14, size: 17 });
      tagN(b, A, Math.cos(a0), Math.sin(a0), 'A', { size: 17, gap: 9 });
      tagN(b, B, Math.cos(a1), Math.sin(a1), 'B', { size: 17, gap: 9 });
      // 호 라벨 (활꼴·호·현은 현 라벨을 바로 아래에 함께 쌓음: 색으로 구분)
      const items = [{ t: `호 AB = ${cmOf(ex(r * sh.deg, 180))}`, color: 'sky' }];
      if (type !== 'sector') items.push({ t: chordTxt(sh, r), color: 'rose' });
      tagStack(b, pt(0, 0, 1, am), bis.x, bis.y, items, { size: 17, gap: sh.deg < 60 ? 24 : 10 });
      // 반지름 라벨(부채꼴만)
      if (type === 'sector') {
        const rTag = (a, out) => tagN(b, pt(0, 0, 0.5, a), Math.cos(a + out * PI / 2), Math.sin(a + out * PI / 2), `r = ${r} cm`, { color: 'rose', size: 16 });
        const fl = sh.deg >= 240 ? -1 : 1;
        rTag(a1, fl); rTag(a0, -fl);
      }
      if (type === 'arc') {
        // 호와 현을 곧게 펴서 비교 (가로 막대)
        const y1 = 1.5, y2 = 1.85, la = sh.th * 0.64, lc = 2 * Math.sin(sh.th / 2) * 0.64; // 같은 눈금(0.64배)으로 곧게 펴서 비교
        T(b, { x: -1, y: y1 }, '호', { dx: -16, color: 'sky', size: 16 }); T(b, { x: -1, y: y2 }, '현', { dx: -16, color: 'rose', size: 16 });
        b.seg({ x: -1, y: y1 }, { x: -1 + la, y: y1 }, { color: 'sky', width: 8 });
        b.seg({ x: -1, y: y2 }, { x: -1 + lc, y: y2 }, { color: 'rose', width: 8 });
        T(b, { x: -1 + la, y: y1 }, cmOf(ex(r * sh.deg, 180)), { dx: 10, align: 'left', color: 'sky', size: 15 });
        T(b, { x: -1 + lc, y: y2 }, sh.deg === 60 ? `${r} cm` : sh.deg === 180 ? `${2 * r} cm` : '현', { dx: 10, align: 'left', color: 'rose', size: 15 });
      } else if (type === 'sector') {
        const f = frac(sh.deg, 360);
        T(b, { x: 0, y: 1 }, `원 전체의 ${sh.deg}/360 = ${f[0]}/${f[1]}`, { dy: 58, size: 16 });
      }
    }
  };
}

/* ======================================================================
   ③ 길이·둘레 : 점 P 가 경계를 따라 움직이며 지나간 길이를 띠(펼친 둘레)에 쌓습니다
   ====================================================================== */
function periScene(type) {
  const meta = {
    semi: { id: 'z2-semi', title: '반원 둘레', info: '반원의 바깥 경계는 위쪽 굽은 <b>반원호(πr)</b>와 아래쪽 곧은 <b>지름(2r)</b>을 합친 길이입니다.', q: ['반원 둘레를 πr이라고 하면 무엇을 빠뜨렸나요?', '아래쪽을 막아주는 직선인 지름 2r를 빠뜨렸습니다. 반원의 둘레는 πr + 2r입니다.'] },
    quarter: { id: 'z2-quarter', title: '사분원 둘레', info: '사분원의 둘레를 따라가면 90° 호 1개와 수직으로 만나는 반지름 2개를 지납니다.', q: ['사분원의 반지름 두 개는 둘레에 포함될까요?', '네. 사분원 면을 감싸는 바깥 경계선이므로 반지름 2개(2r)를 반드시 더해야 합니다.'] },
    sector: { id: 'z2-sector', title: '부채꼴 둘레', info: '부채꼴의 둘레는 굽은 호의 길이(l)에 양쪽 반지름 2개(2r)를 더한 값입니다. 노란 점 B를 끌어 중심각을 바꿔 보세요.', q: Q_SECTOR },
    segment: { id: 'z2-segment', title: '활꼴 둘레', info: '활꼴의 둘레는 호 AB와 현 AB의 합이며, 점선으로 표시된 두 반지름은 포함되지 않습니다. 중심각이 60°이면 현은 반지름과 같고, 180°이면 지름입니다.', q: Q_SEGMENT }
  }[type];
  const key = type === 'sector' ? 'csA' : 'csS', var_ = type === 'sector' || type === 'segment';
  const target = (s) => cumTarget(boundary(shapeOf(type, s), s.csR), Math.max(0, (s.step || 1) - 1)) * 100;
  return {
    id: meta.id, title: meta.title, short: meta.title, question: Q_PERI, guide: meta.info + ' <b>점 P</b>를 띠 위에서 끌면 지나간 길이가 쌓입니다.',
    controls: var_ ? ['csR', key, 'csP'] : ['csR', 'csP'],
    presets: () => [...rPresets(), ...(var_ ? angPresets(key, type === 'sector' ? [60, 90, 120, 180, 270] : [60, 90, 120, 180]) : [])],
    actions: () => [playAction('csP', 100, '점 P가 한 바퀴'), resetAction('csP')],
    tick: mkTick('csP', 100, 8, target),
    steps: (s) => {
      const sh = shapeOf(type, s), segs = boundary(sh, s.csR), tot = segs.reduce((a, g) => plus(a, g.exact || ex()), ex());
      const known = segs.every((g) => g.exact);
      return [meta.info.replace(/<\/?b>/g, ''), ...segs.map((g, i) => `${NUMS[i]} ${g.name}: ${g.exact ? '길이 ' + plain(g.exact) + ' cm' : '길이는 중1에서 계산하지 않습니다'}${i === segs.length - 1 ? (known ? `. 모두 더하면 둘레 ${plain(tot)} cm` : '') : ''}`)];
    },
    problem: problemOf('생각해 보기', meta.q[0], meta.q[1]),
    view: (s) => {
      const sh = shapeOf(type, s), r = s.csR, segs = boundary(sh, r), tp = tracePlan(segs, s.csP / 100);
      const known = segs.every((g) => g.exact), tot = segs.reduce((a, g) => plus(a, g.exact || ex()), ex());
      const rd = [{ label: '둘레', value: known ? cmOf(tot) : '호 + 현 (현은 계산 안 함)', color: 'sky' }];
      if (type !== 'segment') rd.push({ label: '넓이', value: cm2Of(type === 'semi' ? ex(r * r, 2) : ex(r * r * sh.deg, 360)), color: 'green' });
      rd.push({ label: '점 P가 지나간 길이', value: s.csP > 0 ? (tp.ex ? cmOf(tp.ex) : '계산 안 함') : '0', color: 'amber' });
      const f = { semi: `반원 둘레 = πr + 2r = π × ${r} + 2 × ${r} = ${plain(tot)} cm`, quarter: `사분원 둘레 = πr/2 + 2r = π × ${r}/2 + 2 × ${r} = ${plain(tot)} cm`, sector: `부채꼴 둘레 = 호 AB + 2r = 2π × ${r} × ${sh.deg}/360 + 2 × ${r} = ${plain(tot)} cm`, segment: `활꼴 둘레 = 호 AB + 현 AB = 2π × ${r} × ${sh.deg}/360 + ${known ? plain(segs[1].exact) + ' = ' + plain(tot) : '현 AB'} cm` }[type];
      return { readouts: rd, formula: RICH(esc2(f), M('호의 길이 $l=2\\pi r\\times\\dfrac{\\theta}{360}$')), alert: type === 'segment' && !known ? { tone: 'info', text: '현의 길이를 수로 구하는 것은 중1 과정이 아닙니다. 중심각을 60° 또는 180°로 맞추면 둘레를 구할 수 있습니다.' } : null };
    },
    draw: (b, s) => {
      const sh = shapeOf(type, s), r = s.csR, segs = boundary(sh, r), tp = tracePlan(segs, s.csP / 100), a0 = sh.a0, a1 = sh.a1, am = (a0 + a1) / 2;

  const d = ENTER[sc.id];
  sc.enter = (s, lab) => {
    if (d) Object.assign(s, d);
    s.playing = false;
    sc._focus = null;
    if (lab && lab.board && FIT[sc.id]) {
      const keep = { ...s }, b = lab.board, view = { focus: b.focus, zoom: b.zoom, panX: b.panX, panY: b.panY };
      b.setFocus(CANON_VIEW, true); // 앞 장면의 확대·위치가 남은 채로 재면 그림이 작게 맞춰집니다 → 항상 같은 처음 상태에서 잽니다
      let uni = null;
      for (const st of FIT[sc.id]) { Object.assign(s, st); const f = lab._measureFocus(sc); if (f) uni = unionFocus(uni, f); }
      Object.assign(s, keep);
      sc._focus = uni;
      if (s !== lab.s) Object.assign(b, view); // 장면 목록의 작은 그림을 만드는 중이면 지금 보는 화면은 그대로 둡니다
    }
  };
  sc.focus = () => sc._focus;
  sc.autoFit = true;
}));

const MODULES = ['basic', 'f01', 'f02', 'f03', 'f04', 'f05', 'rolling', 'swept'];
const loadScript = (src) => new Promise((res) => {
  const el = document.createElement('script');
  el.src = src; el.async = false;
  el.onload = () => res(true);
  el.onerror = () => { el.remove(); res(false); }; // 아직 없는 모듈은 건너뜁니다
  document.head.append(el);
});

function start() {
  const mods = (window.APL_CS_GROUPS || []).filter((g) => g && Array.isArray(g.scenes) && g.scenes.length);
  // 좌표계: 이 파일의 탭(①③④)과 F03·F05·F06·중심각 탭은 도형 좌표(figure, y 아래쪽), F01·F04 모듈은 수학 좌표(cartesian, y 위쪽)로 그려져 있어 장면마다 알려 줍니다.
  const CARTESIAN = { f01: 1, f04: 1 };
  mods.forEach((g) => { if (CARTESIAN[g.id]) g.scenes.forEach((sc) => { sc.boardKind = 'cartesian'; }); });
  const groups = [...mineGroups, ...mods].sort((a, b) => (a.order || 0) - (b.order || 0)).map((g) => ({ id: g.id, title: g.title, short: g.short || g.title, scenes: g.scenes }));
  const params = { ...PARAMS };
  mods.forEach((g) => Object.assign(params, g.params || {}));
  APLab.createLab({
    id: 'g7-circle-sector',
    title: '원과 부채꼴',
    courseName: '중1',
    unit: '평면도형 · 원과 부채꼴',
    courseColor: 'var(--m-sky)',
    home: '../index.html#g7',
    legacy: '../../labs/g7/원과_부채꼴_통합_마스터_스튜디오.html',
    board: { kind: 'figure', autoFit: true, pad: 0.02, minZoom: 0.5, maxZoom: 6 },
    // 어느 장면에서 오든 처음 열 때와 같은 맞춤이 되도록, 장면에 들어갈 때 화면 범위를 처음 상태로 되돌립니다(작은 그림 만들 때는 제외).
    enter: (s, sc, lab) => { if (lab && lab.board && s === lab.s) { lab.board.setFocus(CANON_VIEW, true); lab.board.setPanes(null); lab.board.setInsets({ top: 0, right: 0, bottom: 0, left: 0 }); } },
    state: { csN: 16 },
    params,
    groups
  });
}
Promise.all(MODULES.map((m) => loadScript(`g7-circle-sector/${m}.js`))).then(start);
});
</script>
