    const examData = {

        targetTime: "목표 시간: 5초",
        question: () => `두 평면 ${tex('\\alpha, \\beta')}가 이루는 각의 크기가 ${tex('\\theta = 60^\\circ')} 이다. 평면 ${tex('\\beta')} 위에 밑변이 교선과 평행하고 길이가 ${tex('\\overline{BC} = 8')}, 높이가 ${tex('\\overline{AM} = 6')} 인 삼각형 ${tex('ABC')} (넓이 ${tex('S = 24')})가 있을 때, 이 삼각형의 평면 ${tex('\\alpha')} 위로의 정사영 ${tex("A'BC")}의 높이 ${tex("\\overline{A'M}")}과 넓이 ${tex("S'")}를 구하시오.`,
        answerBadge: () => `${tex("\\overline{A'M} = 3, \\; S' = S\\cos 60^\\circ = 12")}`,
        thetaSnap: (60 * Math.PI) / 180,
        cam: { yaw: (-25 * Math.PI) / 180, pitch: (28 * Math.PI) / 180 }, // 겨냥도 기준(옆 20~35°·위 15~30°): 교선 BC를 앞쪽 가로로 두고 삼각형이 뒤로 눕는 배치
        sectionCam: { yaw: (90 * Math.PI) / 180, pitch: 0 }, // 교선 BC 방향(BC가 한 점으로 보이는) 옆모습: θ를 그대로 잰다

② 두 평면의 각이 ${tex('60^\\circ')}이므로 단면 ${tex("AA'M")}에서 ${tex('\\angle AMA\'=60^\\circ')}; 따라서 실제 길이 ${tex("A'M=AM\\cos60^\\circ=6\\cdot\\frac12=3")}이다. 이 각은 평면 단면에서 정의되며, 투시 화면의 각도 측정값이 아니다.<br/>

      2: {
        badge: "장면 2 · 원기둥을 자른 타원 단면의 넓이 (S = S' / cos θ)",

        answerBadge: () => `단면 넓이 ${tex('S = 18\\pi')}, 장축 ${tex('= 12')}, 단축 ${tex('= 6')}`,

          "정사영의 넓이 관계: S cos 60° = 9π ⇒ 타원 단면의 넓이 S = 9π / (1/2) = 18π"

        textbook: () => ({
          steps: `① 경사 단면의 정사영은 반지름 ${tex('3')}인 밑면 원이므로 ${tex("S'=9\\pi")}. 평면과 밑면의 예각은 ${tex('60^\\circ')}이다.<br/>
② 정사영 넓이 관계 ${tex("S'=S\\cos60^\\circ")}에서 ${tex('S=\\frac{9\\pi}{\\frac{1}{2}}=18\\pi')}.<br/>
③ 단면 타원의 교선 평행 단축은 지름 그대로 ${tex('2b=6')}; 수직 방향은 ${tex('60^\\circ')} 경사만큼 확대되어 ${tex('2a=\\frac{6}{\\cos60^\\circ}=12')}. 따라서 반축은 ${tex('a=6,b=3')}이다. ${tex('\\theta=90^\\circ')}이면 정사영 넓이는 0이 되어 유한한 단면 넓이를 역산할 수 없고, 타원은 유한한 단면으로 성립하지 않는다.`,
          warning: "정사영 역산은 cos θ > 0일 때만 유한한 단면 넓이를 복원한다. θ=90°에서는 0으로 나누지 않는다."
        }),
        shortcut: () => ({
          steps: `① 경사 단면(넓이 ${tex('S')})을 바닥으로 정사영하면 <strong>반지름 ${tex('3')}인 밑면 원(넓이 ${tex("S' = 9\\pi")})</strong>이 된다.<br/>
② <strong>[정사영의 넓이 관계]</strong>: ${tex("S \\cos 60^\\circ = S' = 9\\pi")}<br/>
③ 양변을 ${tex('\\cos 60^\\circ = \\dfrac{1}{2}')}로 나누면 장축을 구하지 않아도 <strong class="text-amber-300">${tex('S = \\dfrac{9\\pi}{\\cos 60^\\circ} = 18\\pi')}</strong>이다.<br/>
&nbsp;&nbsp;(교선 방향인 단축 ${tex('2b = 6')}은 변하지 않고, 수직 방향인 장축 ${tex('2a = \\frac{6}{\\cos 60^\\circ} = 12')})`,
          highlight: "비스듬히 잘린 단면의 넓이 S는 정사영의 넓이 S'에서 S = S' / cos θ 로 구할 수 있습니다. 3초 컷!"
        })
      },

      3: {
        badge: "장면 3 · 정육면체의 단면(정삼각형 BDE)과 정사영으로 이면각 구하기",
        hint: "보조선을 그어 이면각을 구하기 어려울 때는 <span class='text-pink-300 font-bold'>원래 도형의 넓이 S</span>와 <span class='text-sky-300 font-bold'>밑면에 정사영시킨 도형의 넓이 S'</span>를 구하여 나누면 <span class='text-amber-300 font-bold'>cos θ = $\\frac{S′}{S}$ = 1/√3</span>이 됩니다.",
        tag: "정사영의 넓이로 이면각 구하기",
        targetTime: "목표 시간: 5초",
        question: () => `한 모서리의 길이가 ${tex('4')}인 정육면체 ${tex('ABCD-EFGH')}에서 세 꼭짓점 ${tex('B, D, E')}를 지나는 평면과 밑면 ${tex('EFGH')}가 이루는 예각의 크기를 ${tex('\\theta')}라 할 때, 정사영을 이용하여 ${tex('\\cos\\theta')}의 값을 구하시오.`,
        answerBadge: () => `${tex('\\cos\\theta = \\dfrac{S\'}{S} = \\dfrac{8}{8\\sqrt{3}} = \\dfrac{1}{\\sqrt{3}}')}`,
        thetaSnap: Math.acos(1 / Math.sqrt(3)), // 약 54.7356°
        cam: { yaw: (35 * Math.PI) / 180, pitch: (18 * Math.PI) / 180 }, // 기존 -36°·24°는 B·D·E가 한 직선으로 겹쳐 단면 BDE가 선으로 보였음 → 단면이 삼각형으로 보이고 꼭짓점이 모서리에 겹치지 않는 시점
        sectionCam: { yaw: (-45 * Math.PI) / 180, pitch: 0 },
        steps: [
          "정육면체의 단면 ΔBDE (한 변이 4√2인 정삼각형, S = 8√3)",
          "꼭짓점 B, D, E를 밑면 EFGH에 정사영시킨 ΔFEH (직각이등변삼각형, S' = 8)",
          "정사영의 넓이 관계에서 cos θ = $\\frac{S′}{S}$ = 8 / (8√3) = 1 / √3 (보조선이 필요 없음)"

        textbook: () => ({
          steps: `① 평면 ${tex('BDE')}와 밑면 ${tex('EFGH')}의 교선은 점 ${tex('E')}를 지나고 ${tex('BD')}와 평행한 직선이다. ${tex('FH')}의 중점을 ${tex('M')}, ${tex('BD')}의 중점을 M′이라 하면 EM, EM′은 모두 교선에 수직이므로 이면각은 ∠MEM′이다.<br/>
② 좌표의 차로 ${tex('\\overline{EM} = 2\\sqrt{2}, \\; \\overline{MM\\prime} = 4')}이고 ${tex('EM \\perp MM\\prime')}이므로 피타고라스 정리로 ${tex('\\overline{EM\\prime} = \\sqrt{8 + 16} = 2\\sqrt{6}')}.<br/>
③ 직각삼각형 EMM′에서 ${tex('\\cos\\theta = \\dfrac{\\overline{EM}}{\\overline{EM\\prime}} = \\dfrac{2\\sqrt{2}}{2\\sqrt{6}} = \\dfrac{1}{\\sqrt{3}}')}이다.`,
          warning: "주의: 교선이 보이지 않거나 단면이 대칭이 아닐 때는 수선의 발을 작도하는 데 시간이 오래 걸립니다."
        }),
        shortcut: () => ({
          steps: `① <strong>[정사영으로 이면각 구하기]</strong>: 보조선을 그리지 않고 <strong class="text-amber-300">${tex("\\cos\\theta = \\dfrac{\\text{정사영의 넓이 } S'}{\\text{원래 넓이 } S}")}</strong>를 이용한다.<br/>
② 원래 도형 ${tex('\\triangle BDE')}는 한 변이 ${tex('4\\sqrt{2}')}인 정삼각형이므로 <strong class="text-pink-300">${tex('S = \\dfrac{\\sqrt{3}}{4}(4\\sqrt{2})^2 = 8\\sqrt{3}')}</strong>.<br/>
③ 바닥 정사영 ${tex('\\triangle FEH')}는 밑변·높이가 ${tex('4')}인 직각삼각형이므로 <strong class="text-sky-300">${tex("S' = \\dfrac{1}{2} \\times 4 \\times 4 = 8")}</strong>.<br/>
④ 따라서 <strong class="text-emerald-300">${tex("\\cos\\theta = \\dfrac{8}{8\\sqrt{3}} = \\dfrac{1}{\\sqrt{3}}")}</strong> (5초 컷!)`,
          highlight: "정육면체의 세 꼭짓점 B, D, E를 지나는 단면(정삼각형 BDE)과 밑면이 이루는 각 θ에서 cos θ = 1/√3 입니다. (정사면체의 이면각 cos θ = 1/3과 비교해 보세요.)"
        })
      },

      4: {
        badge: "장면 4 · 비스듬한 태양 광선과 지면에 생기는 그림자의 넓이 킬러",
        hint: "빛이 수직으로 오지 않고 비스듬히 올 때는 <span class='text-amber-300 font-bold'>광선에 수직인 평면에 정사영시킨 넓이(S cos β)</span>를 구한 뒤 지면과 이루는 각 α의 코사인으로 나누는 <span class='text-sky-300 font-bold'>S' = $\\frac{S\\cos β}{\\cos α}$</span>를 씁니다.",
        tag: "그림자의 넓이 킬러",
        targetTime: "목표 시간: 10초",
        question: () => `지면 ${tex('\\alpha')}와 ${tex('30^\\circ')}의 각을 이루는 평면 위에 넓이가 ${tex('S = 12')} 인 원판이 놓여 있다. 태양 광선이 지면과 ${tex('60^\\circ')}의 각을 이루면서 원판의 면에 수직으로 비출 때, 지면 ${tex('\\alpha')}에 생기는 그림자의 넓이 ${tex("S'")}를 구하시오.`,
        answerBadge: () => `${tex("S' = \\dfrac{S}{\\cos 30^\\circ} = \\dfrac{12}{\\frac{\\sqrt{3}}{2}} = 8\\sqrt{3}")}`,
        boardDeg: 30,
        sunDeg: 60,
        cam: { yaw: (-25 * Math.PI) / 180, pitch: (18 * Math.PI) / 180 },
        sectionCam: { yaw: (0 * Math.PI) / 180, pitch: (4 * Math.PI) / 180 },
        steps: [
          "지면과 30°를 이루는 원판(넓이 S = 12)과 지면과 60°를 이루는 태양 광선 (원판에 수직)",
          "지면 α 위에 길게 늘어나는 타원 그림자 (넓이 S')",
          "지면의 그림자 S'를 광선에 수직인 원판 S로 정사영시키면: S' cos 30° = S ⇒ S' = $\\frac{S}{\\cos30^\\circ}$"

        textbook: () => ({

&nbsp;&nbsp;${tex('2a = \\dfrac{2r}{\\sin 60^\\circ} = \\dfrac{2r}{\\cos 30^\\circ}')}<br/>
② 교선 방향의 세로 지름 ${tex('2b = 2r')}은 불변이므로<br/>
③ 타원 그림자의 넓이 ${tex("S' = \\pi a b = \\dfrac{\\pi r^2}{\\cos 30^\\circ} = \\dfrac{12}{\\frac{\\sqrt{3}}{2}} = 8\\sqrt{3}")}을 계산한다.`,
          warning: "주의: 광선이 원판에 수직이 아닌 경우에는 도형의 길이만으로 구하기 어렵습니다."
        }),
        shortcut: () => ({

        // [표시 보강] 수선의 발: BF ⊥ 밑면(∠BFE=90°), DH ⊥ 밑면(∠DHE=90°) 직각 표시
        draw3DRightAngle(F,B,E,.34,'#fbbf24',{part:1,group:'aux'});
        draw3DRightAngle(H,D,E,.34,'#fbbf24',{part:1,group:'aux'});
        draw3DPoint(F,5,'#38bdf8','F (B의 정사영)',{x:10,y:12},{part:1,group:'projection'});
        draw3DPoint(H,5,'#38bdf8','H (D의 정사영)',{x:-100,y:12},{part:1,group:'projection'});
      }
      if(state.steps[1]){
        draw3DPolygon([B,D,E],'rgba(244,114,182,.26)','#f472b6',3,false,{part:0,group:'source'});
        draw3DPoint(B,6,'#f472b6','B',{x:12,y:-15},{part:0,group:'source'});
        draw3DPoint(D,6,'#f472b6','D',{x:12,y:-15},{part:0,group:'source'});
        draw3DPoint(E,6,'#34d399','E',{x:-25,y:-12},{part:0,group:'source'});
      }
      if(state.steps[3]){
        draw3DPolygon([E,M,Mp],'rgba(251,191,36,.18)','#fbbf24',2,false,{part:2,group:'aux'});
        draw3DLine(F,H,'#6ee7b7',2.2,true,false,{part:2,group:'aux'});
        draw3DLine(B,D,'#f9a8d4',2.2,true,false,{part:2,group:'aux'});
        draw3DRightAngle(M,E,Mp,.44,'#fde047',{part:2,group:'aux'});
        draw3DAngleArc(E,M,Mp,.7,'#fde047','θ');
        // [표시 보강] 이면각의 근거: EM ⊥ FH(교선 방향), EM′ ⊥ BD(교선 방향) 직각 표시
        draw3DRightAngle(M,E,F,.3,'#6ee7b7',{part:2,group:'aux'});
        draw3DRightAngle(Mp,E,B,.3,'#f9a8d4',{part:2,group:'aux'});
        draw3DPoint(M,5,'#fde047','M (FH 중점)',{x:10,y:14},{part:2,group:'aux',priority:1});
        draw3DPoint(Mp,5,'#fde047','M′ (BD 중점)',{x:10,y:-14},{part:2,group:'aux',priority:1});
        drawBottomTapeBanner(rect,'S′',8,'S−S′',8*Math.sqrt(3)-8,`EM=2√2 · MM′=4 · cosθ=1/√3 · θ=${deg(Math.acos(1/Math.sqrt(3))).toFixed(2)}°`);
      }
    }
    function renderMode4(rect,g){
      const {disk,shadow,center,start,ray,hinge,xH,u0}=g,b=rad(state.boardDeg),sun=rad(state.sunDeg);
      draw3DPolygon(tileCorners(g.tile),'rgba(16,185,129,.07)','#176746',1.2,false,{group:'projection'});
      if(state.steps[2]){
        draw3DPolygon(shadow,'rgba(56,189,248,.25)','#38bdf8',2.8,false,{part:1,group:'projection'});
        for(let i=0;i<80;i+=10)draw3DLine(disk[i],shadow[i],'#fbbf24',1.5,true,false,{part:1,group:'aux'});
        draw3DPoint(shadow[0],4,'#38bdf8','그림자 S′',{x:9,y:15},{part:1,group:'projection'});
      }
      if(state.steps[1]){
        draw3DPolygon(disk,'rgba(244,114,182,.26)','#f472b6',2.9,false,{part:0,group:'source'});
        draw3DLine(start,center,'#fde047',3,false,true,{part:0,group:'aux'});
        draw3DPoint(start,5,'#fde047',`태양 광선 θ₂=${state.sunDeg}°`,{x:-55,y:-10},{part:0,group:'aux',priority:1});
        draw3DPoint(center,5,'#f472b6','원판 S=12',{x:12,y:-12},{part:0,group:'source'});
      }
      if(state.steps[3]){
        const onPlane=V(xH+(u0+1)*Math.cos(b),(u0+1)*Math.sin(b),0),onGround=V(xH+(u0+1),0,0);
        draw3DAngleArc(hinge,onGround,onPlane,.72,'#fbbf24','θ₁');
        const tip=disk[0],hit=shadow[0],left=V(hit.x-1,0,hit.z);
        draw3DAngleArc(hit,left,tip,.66,'#fde047','θ₂');
        const sp=12*Math.sin(b+sun)/Math.sin(sun);
        drawBottomTapeBanner(rect,'그림자 S′',sp,'|S′−S|',Math.abs(sp-12),`S′=12 sin(${state.boardDeg}+${state.sunDeg})° / sin${state.sunDeg}° = ${sp.toFixed(2)}`);
      }
    }

  /* ======================================================================
     추가 장면 5~7 — 고등 「기출·킬러 모음」에 핵심 유형과 필수 문항을 더한 부분(기존 장면 1~4는 그대로입니다)
     5: 정사면체 면 안의 부분 삼각형 정사영(cosθ=1/3)  6: 정육면체 단면 BDN과 밑면의 각(점 N 슬라이더)
     7: 정사면체에서 비스듬한 면 ABM으로의 정사영(점 M이 CD 위를 움직임)
     좌표는 실제 길이 그대로 씁니다(맞춤 보기가 화면 크기에 맞춰 줍니다). 겨냥도: 밑면은 아래, 숨은 모서리는 점선(SP.solid).
     ====================================================================== */
  const SQ3 = Math.sqrt(3);
  const cross = (a, b) => V(a.y * b.z - a.z * b.y, a.z * b.x - a.x * b.z, a.x * b.y - a.y * b.x);
  const dotv = (a, b) => a.x * b.x + a.y * b.y + a.z * b.z;
  const area3 = (p, q, r) => norm(cross(sub(q, p), sub(r, p))) / 2;
  const lerpP = (a, b, t) => add(a, mul(sub(b, a), t));
  const centroid = (...ps) => mul(ps.reduce(add, V(0, 0, 0)), 1 / ps.length);
  const down = (p) => V(p.x, 0, p.z); // 밑면(y=0)에 수직으로 내린 발
  const coef = (n) => (n === 1 ? '' : String(n));
  const EDGE_C = 'rgba(226,232,240,.78)';
  let EXPLORE = false;

  /* 숫자 바꾸기: 정답이 깔끔하게 나오는 값만 모았습니다. 0번이 기출 원래 값입니다.
     check(m, s) 는 지금 문제의 좌표와 정답(수치·식)을 내놓습니다(자동 검사용). */
  const V5 = [{ e: 12, sub: 'GCD' }];
  [6, 12, 18, 24, 30].forEach((e) => ['GCD', 'GBC', 'GBD'].forEach((sub) => { if (!(e === 12 && sub === 'GCD')) V5.push({ e, sub }); }));
  const V6 = [
    { a: 6, cn: 3, cp: '3\\sqrt{2}', np: '3\\sqrt{3}', cos: '\\dfrac{\\sqrt{6}}{3}', mid: true },
    { a: 4, cn: 2, cp: '2\\sqrt{2}', np: '2\\sqrt{3}', cos: '\\dfrac{\\sqrt{6}}{3}', mid: true },
    { a: 10, cn: 5, cp: '5\\sqrt{2}', np: '5\\sqrt{3}', cos: '\\dfrac{\\sqrt{6}}{3}', mid: true },
    { a: 8, cn: 4, cp: '4\\sqrt{2}', np: '4\\sqrt{3}', cos: '\\dfrac{\\sqrt{6}}{3}', mid: true },
    { a: 8, cn: 2, cp: '4\\sqrt{2}', np: '6', cos: '\\dfrac{2\\sqrt{2}}{3}' },
    { a: 12, cn: 3, cp: '6\\sqrt{2}', np: '9', cos: '\\dfrac{2\\sqrt{2}}{3}' },
    { a: 7, cn: 4, cp: '\\dfrac{7\\sqrt{2}}{2}', np: '\\dfrac{9\\sqrt{2}}{2}', cos: '\\dfrac{7}{9}' },
    { a: 14, cn: 8, cp: '7\\sqrt{2}', np: '9\\sqrt{2}', cos: '\\dfrac{7}{9}' },
    { a: 7, cn: 6, cp: '\\dfrac{7\\sqrt{2}}{2}', np: '\\dfrac{11\\sqrt{2}}{2}', cos: '\\dfrac{7}{11}' }
  ];
  const V7 = [{ e: 6, face: 'ABC' }];
  [4, 6, 8, 10, 12, 14].forEach((e) => ['ABC', 'ABD'].forEach((face) => { if (!(e === 6 && face === 'ABC')) V7.push({ e, face }); }));
  const VARS = { 5: V5, 6: V6, 7: V7 };
  const SUBS = { GCD: ['G', 'C', 'D'], GBC: ['G', 'B', 'C'], GBD: ['G', 'B', 'D'] };
  const newBtn = (m) => `<div class="proj-new-row" style="margin-top:10px;display:flex;align-items:center;gap:10px;flex-wrap:wrap"><button type="button" class="apl-btn sm" data-proj-new="${m}">숫자 바꾸기</button><span style="font-size:12.5px;opacity:.7">같은 유형, 다른 숫자</span></div>`;

  /* ----- 기하 좌표 ----- */
  function geo5(prob) {
    const v = prob ? V5[state.v5] : V5[0];
    const e = v.e, h = SQ3 / 2 * e, H = e * Math.sqrt(2 / 3);
    const B = V(0, 0, -e / 2), C = V(0, 0, e / 2), A = V(h, 0, 0), D = V(h / 3, H, 0);
    const G = centroid(B, C, D), M = V(0, 0, 0), O = centroid(A, B, C), Gp = down(G);
    const pts = { A, B, C, D, G };
    const tri = SUBS[v.sub].map((n) => pts[n]);
    return { e, sub: v.sub, A, B, C, D, G, M, O, Gp, tri, triP: tri.map(down), S: area3(...tri), Sp: area3(...tri.map(down)), fit: [A, B, C, D] };
  }
  function geo6(prob) {
    const v = prob ? V6[state.v6] : { a: 6, cn: state.cn };
    const a = v.a, cn = v.cn, q = a / 2;
    const A = V(-q, 0, q), B = V(-q, 0, -q), C = V(q, 0, -q), D = V(q, 0, q); // C가 가장 먼 모서리: 단면 BDN의 윗면이 보입니다
    const E = V(-q, a, q), F = V(-q, a, -q), G = V(q, a, -q), H = V(q, a, q);
    const N = V(q, cn, -q), P = V(0, 0, 0);
    const NP = norm(sub(N, P)), CP = norm(sub(C, P));
    return { a, cn, A, B, C, D, E, F, G, H, N, P, CP, NP, cos: CP / NP, S: area3(B, D, N), Sp: area3(B, D, C), fit: [A, B, C, D, E, F, G, H] };
  }
  function geo7(prob) {
    const v = prob ? V7[state.v7] : V7[0];
    const e = v.e, h = SQ3 / 2 * e, H = e * Math.sqrt(2 / 3);
    const A = V(0, 0, -e / 2), B = V(0, 0, e / 2), C = V(h, 0, 0), D = V(h / 3, H, 0), K = V(0, 0, 0);
    const t = prob ? 0.5 : state.mt / 100;
    const M = lerpP(C, D, t);
    const u = unit(M); // K가 원점이므로 평면 ABM 위에서 KM 방향
    const Cp = mul(u, dotv(C, u)), Dp = mul(u, dotv(D, u));
    const X = v.face === 'ABC' ? C : D, Xp = v.face === 'ABC' ? Cp : Dp;
    const cos = Math.abs(dotv(X, u)) / norm(X);
    const S = area3(A, B, X);
    return { e, face: v.face, A, B, C, D, K, M, t, u, Cp, Dp, X, Xp, cos, S, Sp: S * cos, fit: [A, B, C, D] };
  }
  /* 자동 검사용: 지금 장면의 좌표와 정답 수치(좌표로 독립 계산한 값과 대조) */
  function checkData(m, s) {
    sync(s, m);
    if (m === 5) { const g = geo5(true); return { ...g, ans: SQ3 * (g.e / 6) ** 2, tex: answer5(s) }; }
    if (m === 6) { const g = geo6(true); return { ...g, ans: g.cos, tex: V6[s.v6].cos }; }
    const g = geo7(true);
    return { ...g, ans: Math.SQRT2 * g.e * g.e / 4, tex: answer7(s) };
  }

  /* ----- 그리기 도우미 ----- */
  // 꼭짓점 이름표: 입체 바깥쪽(중심 반대 방향)에 놓습니다
  function vtx(p, label, color, ctr, opt = {}) {
    styled(opt, () => SP.point(p, { r: opt.r || 5, color, label: alphaFor(opt) > .12 ? label : '', toward: SP.P(ctr), size: 13 }));
  }
  // 주어진 길이: 선분 가운데에서 입체 바깥쪽으로 띄웁니다
  function outLen(a, c, str, ctr, color = '#fde68a') {
    const pm = SP.P(mul(add(a, c), .5)), pc = SP.P(ctr);
    const dx = pm.x - pc.x, dy = -(pm.y - pc.y), l = Math.hypot(dx, dy) || 1;
    lenLabel(a, c, str, color, dx / l * 16, dy / l * 16);
  }
  // 화면에서 두 점이 거의 한 점으로 겹치는지(모서리를 정면으로 볼 때)
  const same2 = (a, b, tol) => { const pa = SP.P(a), pb = SP.P(b); return Math.hypot(pa.x - pb.x, pa.y - pb.y) < tol; };
  const tetraEdges =(A, B, C, D) => [[A, B], [B, C], [C, A], [A, D], [B, D], [C, D]];

  // 각 θ의 호와 글자: 글자는 꼭짓점에서 바깥쪽으로 띄워 선·이름표와 겹치지 않게 합니다
  function thetaArc(o, a, b, radius, color = '#fde047', opt = { part: 2, group: 'aux' }) {
    const u = unit(sub(a, o)), v = unit(sub(b, o)), c = Math.max(-1, Math.min(1, dotv(u, v))), ang = Math.acos(c);
    if (!Number.isFinite(ang) || ang < .005) return;
    const w = unit(sub(v, mul(u, c))), at = (k) => add(o, mul(add(mul(u, Math.cos(ang * k)), mul(w, Math.sin(ang * k))), radius));
    let prev = null;
    for (let i = 0; i <= 14; i++) { const pt = at(i / 14); if (prev) draw3DLine(prev, pt, color, 2.4, false, false, { ...opt, hide: false }); prev = pt; }
    const mid = at(.5), po = SP.P(o), pm = SP.P(mid), dx = pm.x - po.x, dy = -(pm.y - po.y), l = Math.hypot(dx, dy) || 1;
    // 글자는 모든 선·이름표 위에 그리도록 맨 마지막에(flushLate) 그립니다
    if (alphaFor(opt) > .12) LATE.push(() => styled(opt, () => SP.text(mid, `θ ${deg(ang).toFixed(1)}°`, { color, size: 13, weight: 800, align: 'center', baseline: 'middle', dx: dx / l * 30, dy: dy / l * 22 })));
  }
  const LATE = [];
  const flushLate = () => LATE.splice(0).forEach((f) => f());

  /* ----- 장면 5: 정사면체 면 안의 부분 삼각형 정사영 ----- */
  function renderMode5(rect, g) {
    const { A, B, C, D, G, M, O, Gp, e, tri, triP } = g, t = state.press / 100, ctr = centroid(A, B, C, D), edgeOn = same2(B, C, e * .03);
    draw3DPolygon([A, B, C], 'rgba(56,189,248,.10)', null, 1, false, { group: 'projection' });
    draw3DPolygon([B, C, D], 'rgba(244,114,182,.09)', null, 1, false, { group: 'source' });
    tetraEdges(A, B, C, D).forEach(([p, q]) => draw3DLine(p, q, EDGE_C, 1.9, false, false, { group: 'aux' }));
    [B, C, D].forEach((p) => draw3DLine(G, p, 'rgba(244,114,182,.75)', 1.5, false, false, { group: 'source' })); // 무게중심 G로 면을 3등분
    if (PROB || state.steps[1]) draw3DPolygon(tri, 'rgba(244,114,182,.34)', '#f472b6', 2.8, false, { part: 0, group: 'source', hide: false });
    if (!PROB && t > .004) { // 면을 아래로 눌러 정사영으로 만드는 중
      const mv = tri.map((p, i) => lerpP(p, triP[i], t));
      draw3DPolygon(mv, 'rgba(56,189,248,.30)', '#38bdf8', 2.4, false, { group: 'projection', hide: false });
      tri.forEach((p, i) => { if (p.y > 1e-9) draw3DLine(p, triP[i], 'rgba(253,224,71,.8)', 1.6, true, false, { group: 'aux' }); });
    }
    if (!PROB && state.steps[2]) {
      draw3DPolygon(triP, 'rgba(56,189,248,.30)', '#38bdf8', 2.6, false, { part: 1, group: 'projection', hide: false });
      tri.forEach((p, i) => { if (p.y > 1e-9) draw3DLine(p, triP[i], '#fde047', 2.2, true, false, { part: 1, group: 'aux' }); });
      const names = { G: ['G′', Gp], D: ['D′', O] };
      SUBS[g.sub].forEach((n) => { if (names[n] && (!state.steps[3] || state.partIdx === 1)) vtx(names[n][1], names[n][0], '#38bdf8', ctr, { part: 1, group: 'projection', r: 4.5 }); });
    }
    if (!PROB && state.steps[3]) {
      draw3DPolygon([D, M, O], 'rgba(251,191,36,.18)', '#fbbf24', 2.2, false, { part: 2, group: 'aux', hide: false });
      draw3DLine(A, M, '#fbbf24', 1.6, false, false, { part: 2, group: 'aux' });
      draw3DRightAngle(O, D, M, e * .07, '#fde047', { part: 2, group: 'aux' });
      draw3DRightAngle(M, C, D, e * .06, '#34d399', { part: 2, group: 'aux' });
      draw3DRightAngle(M, C, A, e * .06, '#34d399', { part: 2, group: 'aux' });
      thetaArc(M, O, D, e * .17);
      if (!edgeOn) vtx(M, 'M', '#fde047', ctr, { part: 2, group: 'aux', r: 4.5 });
      else vtx(O, 'D′', '#38bdf8', ctr, { part: 2, group: 'aux', r: 4.5 });
    }
    vtx(A, 'A', '#fde68a', ctr); vtx(D, 'D', '#fde68a', ctr);
    if (edgeOn) vtx(B, !PROB && state.steps[3] ? 'B·C·M' : 'B·C', '#fde68a', ctr); // BC를 정면으로 보면 B, C, M이 한 점에 겹치므로 이름표 하나로 합칩니다
    else { vtx(B, 'B', '#fde68a', ctr); vtx(C, 'C', '#fde68a', ctr); }
    vtx(G, 'G', '#f472b6', ctr, { r: 5.5 });
    if (PROB) outLen(B, C, String(e), ctr);
    flushLate();
  }

  /* ----- 장면 6: 정육면체 단면 BDN과 밑면 ----- */
  function renderMode6(rect, g) {
    const { a, cn, A, B, C, D, E, F, G, H, N, P } = g, ctr = centroid(A, B, C, D, E, F, G, H), edgeOn = same2(B, D, a * .03);
    draw3DPolygon([A, B, C, D], 'rgba(56,189,248,.09)', null, 1, false, { group: 'projection' });
    [[A, B], [B, C], [C, D], [D, A], [E, F], [F, G], [G, H], [H, E], [A, E], [B, F], [C, G], [D, H]].forEach(([p, q]) => draw3DLine(p, q, EDGE_C, 1.8, false, false, { group: 'aux' }));
    if (PROB || state.steps[1]) draw3DPolygon([B, D, N], 'rgba(244,114,182,.30)', '#f472b6', 2.8, false, { part: 0, group: 'source', hide: false });
    if (!PROB && (state.steps[2] || EXPLORE)) {
      draw3DPolygon([B, D, C], 'rgba(56,189,248,.26)', '#38bdf8', 2.4, false, { part: 1, group: 'projection', hide: false });
      draw3DLine(N, C, '#fde047', 2.2, true, false, { part: 1, group: 'aux' });
    }
    if (!PROB && state.steps[3]) {
      draw3DPolygon([N, C, P], 'rgba(251,191,36,.20)', '#fbbf24', 2.2, false, { part: 2, group: 'aux', hide: false });
      draw3DLine(C, P, '#34d399', 2.4, false, false, { part: 2, group: 'aux' });
      draw3DRightAngle(C, N, P, a * .07, '#fde047', { part: 2, group: 'aux' });
      draw3DRightAngle(P, C, B, a * .06, '#34d399', { part: 2, group: 'aux' });
      draw3DRightAngle(P, N, B, a * .06, '#f472b6', { part: 2, group: 'aux' });
      thetaArc(P, C, N, a * .17);
      if (!edgeOn) vtx(P, 'P', '#fde047', ctr, { part: 2, group: 'aux', r: 4.5 });
    }
    draw3DLine(C, N, '#fbbf24', 3.4, false, true, { group: 'aux', hide: false }); // 점 N이 움직이는 모서리 CG 위의 부분 CN
    // BD를 정면으로 보면 B, D, P가 한 점에 겹치므로(옆에서 본 직각삼각형) 이름표 하나로 합칩니다
    const tags = edgeOn
      ? [['A', A], ['C', C], ['E', E], ['G', G], [!PROB && state.steps[3] ? 'B·D·P' : 'B·D', B], ['F·H', F]]
      : [['A', A], ['B', B], ['C', C], ['D', D], ['E', E], ['F', F], ['G', G], ['H', H]];
    tags.forEach(([l, p]) => vtx(p, l, '#fde68a', ctr, { r: 4.5 }));
    vtx(N, 'N', '#fbbf24', ctr, { r: 5.5 });
    if (PROB) { outLen(B, C, String(a), ctr); lenLabel(C, N, String(cn), '#fbbf24', 15, 0); }
    flushLate();
  }

  /* ----- 장면 7: 정사면체에서 비스듬한 면 ABM으로의 정사영 ----- */
  function renderMode7(rect, g) {
    const { A, B, C, D, K, M, Cp, Dp, X, Xp, e, t } = g, ctr = centroid(A, B, C, D), edgeOn = same2(A, B, e * .03);
    const faceXY = g.face === 'ABC' ? [A, B, C] : [A, B, D];
