    if (m === 2) return [
      { label: '바닥 원 S′', value: 'S′ = 9π', color: 'rose' },
      { label: '절단 평면 θ', value: `${dt.toFixed(1)}° | cosθ = ${co.toFixed(5)}`, color: 'amber' },
      { label: '타원 단면 넓이 S', value: `${(9 / co).toFixed(3)}π`, color: 'sky' },
      { label: '단축 2b / 장축 2a', value: `6.00 / ${(6 / co).toFixed(3)}`, color: 'green' }
    ];
    if (m === 3) return [
      { label: '정삼각형 BDE 넓이 S', value: `8√3 ≈ ${(8 * Math.sqrt(3)).toFixed(3)}`, color: 'rose' },
      { label: '바닥 정사영 FEH 넓이 S′', value: '8.000', color: 'amber' },
      { label: 'cosθ = S′/S', value: (1 / Math.sqrt(3)).toFixed(6), color: 'sky' },
      { label: 'M′EM 직각단면', value: 'EM = 2√2, MM′ = 4', color: 'green' }
    ];
    const b = state.boardDeg, s = state.sunDeg, normal = 12 * Math.sin(rad(b + s)), area = normal / Math.sin(rad(s));
    return [
      { label: '원판 넓이 S / θ₁', value: `S = 12 | ${Math.round(b)}°`, color: 'rose' },
      { label: '태양광 지면각 θ₂', value: `${s}° | 원판-광선 각 ${Math.round(b + s)}°`, color: 'amber' },
      { label: '빛 수직 단면 S⊥', value: normal.toFixed(3), color: 'sky' },
      { label: '지면 그림자 S′', value: `${area.toFixed(3)} (현재 각 기준)`, color: 'green' }
    ];
  }
  function chips(m) {
    const t = state.planeTheta, co = Math.cos(t);
    if (m === 1) return [{ tex: String.raw`S'=S\cos\theta` }, { tex: String.raw`S'=24\times ${co.toFixed(4)}=${(24 * co).toFixed(2)}`, color: 'amber' }];
    if (m === 2) return [{ tex: String.raw`S=\dfrac{9\pi}{\cos\theta}` }, { tex: String.raw`S=${(9 / co).toFixed(3)}\pi,\quad 2a=${(6 / co).toFixed(2)}`, color: 'amber' }];
    if (m === 3) return [{ tex: String.raw`\cos\theta=\dfrac{S'}{S}=\dfrac1{\sqrt3}` }, { tex: String.raw`\theta=${deg(INV_SQRT3).toFixed(3)}^\circ`, color: 'amber' }];
    const b = state.boardDeg, s = state.sunDeg, area = 12 * Math.sin(rad(b + s)) / Math.sin(rad(s));
    const perpendicular = Math.abs(b + s - 90) < 1e-9;
    return [
      { tex: perpendicular ? String.raw`S'\cos ${b}^\circ=S\;\Rightarrow\;S'=\dfrac{S}{\cos ${b}^\circ}` : String.raw`S'\sin ${s}^\circ=S\sin(${b}+${s})^\circ` },
      { tex: String.raw`S'=${area.toFixed(3)}`, color: 'amber' }
    ];
  }

  function sceneOf(m) {
    const d = examData[m];
    return {
      id: 'mode' + m, title: TITLES[m - 1], short: SHORT[m - 1],
      question: QUESTIONS[m - 1],
      guide: d.hint,
      enter: (s) => { const c = CAMS(m).iso; s.yaw = c.yaw; s.pitch = c.pitch; s.th = 60; s.board = 30; s.sun = 60; s.lens = 'all'; s.dir = 1; },
      controls: () => (m <= 2 ? ['th', 'yaw', 'pitch'] : m === 3 ? ['yaw', 'pitch'] : ['board', 'sun', 'yaw', 'pitch']),
      presets: () => {
        const c = CAMS(m);
        const near = (st, t) => Math.abs(st.yaw - t.yaw) < 1 && Math.abs(st.pitch - t.pitch) < 1;
        return [
          { group: '시점', label: '3D 입체 뷰', set: c.iso, ms: 600, on: (st) => near(st, c.iso) },
          { group: '시점', label: '옆면 직각삼각형 뷰 (핵심)', color: 'amber', set: c.section, ms: 600, on: (st) => near(st, c.section) },
          { group: '시점', label: '위에서 내려다보기 (정사영)', set: c.top, ms: 600, on: (st) => near(st, c.top) },
          { group: '관찰 렌즈', label: '전체 보기', apply: (st) => { st.lens = 'all'; }, on: (st) => st.lens === 'all' },
          { group: '관찰 렌즈', label: '원래 도형 S', apply: (st) => { st.lens = 'source'; }, on: (st) => st.lens === 'source' },
          { group: '관찰 렌즈', label: '정사영 S′', apply: (st) => { st.lens = 'projection'; }, on: (st) => st.lens === 'projection' },
          { group: '관찰 렌즈', label: '이면각·투영선', apply: (st) => { st.lens = 'aux'; }, on: (st) => st.lens === 'aux' }
        ];
      },
      actions: [{ id: 'spin', play: true, icon: (s) => (s.playing ? 'pause' : 'play'), label: (s) => (s.playing ? '일시 정지' : m === 3 ? '3D 자동 회전' : '평면 자동 개폐'), on: (s) => s.playing, run: (s) => { s.playing = !s.playing; } }],
      tick: (s, dt) => {
        if (!s.playing) return false;
        if (m <= 2) { // 원본: 평면 기울기 5°~85° 왕복
          s.th += 31 * dt * s.dir;
          if (s.th >= 85) { s.th = 85; s.dir = -1; }
          if (s.th <= 5) { s.th = 5; s.dir = 1; }
        } else if (m === 3) {
          s.yaw += 34 * dt;
          if (s.yaw > 180) s.yaw -= 360;
        } else { // 원판 기울기 10°~60° 왕복
          s.board += 13.2 * dt * s.dir;
          if (s.board >= 60) { s.board = 60; s.dir = -1; }
          if (s.board <= 10) { s.board = 10; s.dir = 1; }
        }
        return true;
      },
      steps: d.steps,
      problem: { tag: d.tag, time: d.targetTime, text: d.question, answer: d.answerBadge, snap: () => (m === 4 ? { board: 30, sun: 60, ...CAMS(m).iso } : m === 3 ? { ...CAMS(m).iso } : { th: 60, ...CAMS(m).iso }) },
      solution: { standardTitle: '교과서식 정석 풀이', standardTag: '정석 · 3분', quickTitle: '10초 컷 · 핵심 원리', quickTag: '10초 컷', standard: d.textbook, quick: d.shortcut },
      view: (s) => {
        sync(s, m);
        const perp = m === 4 && Math.abs(state.boardDeg + state.sunDeg - 90) < 1e-9;
        const text = m === 4 && !perp
          ? `원판-광선 각 ${Math.round(state.boardDeg + state.sunDeg)}° (수직 아님) — 시점 ${Math.round(s.yaw)}° · ${Math.round(s.pitch)}°`
          : `시점 ${Math.round(s.yaw)}° · ${Math.round(s.pitch)}° — 빈 곳을 끌면 회전`;
        return {
          chips: chips(m),
          status: { tone: 'info', text },
          readouts: readouts(m),
          parts: d.steps.map((t, i) => ({ id: i + 1, name: PART_NAMES[m - 1][i], desc: t, color: (m === 2 ? ['sky', 'rose', 'amber'] : ['rose', 'sky', 'amber'])[i] }))
        };
      },
      draw: (b, s, v) => {
        BRD = b;
        sync(s, m);
        SP = APLab.space(b, cam(s));
        const g = currentGeometry();
        const rect = { width: b.W, height: b.H };
        // 회전할 때마다 점과 라벨이 모두 화면 안에 들어오도록 맞춥니다(바닥 평면은 장식이라 넘쳐도 됩니다).
        SP.fitDrawing(g.fit, () => RENDER[m](rect, g));
        sink.tape = null;
        if (s.grid) draw3DFloorGrid(g.floor);
        RENDER[m](rect, g);
        v.tape = sink.tape;
      }
    };
  }

  APLab.createLab({
    id: 'geom-projection',
    title: '정사영 3D',
    courseName: '기하',
    unit: '공간도형과 공간좌표',
    courseColor: 'var(--m-rose)',
    home: '../index.html#geom',
    legacy: '../../labs/기하와벡터/정사영 3D.html',
    board: {
      kind: 'cartesian', focus: { x: [-4, 4], y: [-4, 4] }, pad: 0.05,
      // 빈 곳을 끌면 카메라 회전(원본과 같은 감도)
      orbit: (s, dx, dy) => {
        s.yaw += dx * 0.0085 * R2D;
        if (s.yaw > 180) s.yaw -= 360;
        if (s.yaw < -180) s.yaw += 360;
        s.pitch = clamp(s.pitch + dy * 0.0075 * R2D, -12, 90);
      }
    },
    params: {
      yaw: { value: -38, min: -180, max: 180, step: 1, color: 'muted', label: '좌우 회전 (yaw)', format: (v) => `${Math.round(v)}°` },
      pitch: { value: 24, min: -12, max: 90, step: 1, color: 'muted', label: '위아래 기울기 (pitch)', format: (v) => `${Math.round(v)}°` },
      th: { value: 60, min: 0, max: 85, step: 0.5, color: 'amber', label: '경사 평면 기울기(이면각) θ', hint: '교선에 평행한 길이는 그대로, 수직인 길이만 cosθ배', format: (v) => `θ = ${v.toFixed(1)}° (cos θ = ${Math.cos(v / R2D).toFixed(3)})` },
      board: { value: 30, min: 10, max: 60, step: 1, color: 'rose', label: '원판 기울기 θ₁', format: (v, s) => `θ₁ = ${Math.round(v)}° (원판-광선 각 ${Math.round(v + s.sun)}°)` },
      sun: { value: 60, min: 30, max: 85, step: 1, color: 'amber', label: '광선-지면 경사각 θ₂', hint: 'θ₁ + θ₂ = 90°일 때 광선이 원판에 수직', format: (v, s) => `θ₂ = ${Math.round(v)}° (지면각)` }
    },
    state: { lens: 'all', dir: 1 },
    persist: ['lens'],
    scenes: [1, 2, 3, 4].map(sceneOf)
  });
});
</script>
