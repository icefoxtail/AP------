  // Helper: Solve a^(x-m)+n = -x + k using Newton's method
function solveExpLine(baseA, m, n, k) {
let x = (k + m - n) / 2;
for (let i = 0; i < 25; i++) {
const f = Math.pow(baseA, x - m) + n + x - k;
const df = Math.pow(baseA, x - m) * Math.log(baseA) + 1;
x -= f / df;
}
return x;
}

// Helper: Solve a^x on circle x^2 + y^2 = r^2 in Quadrant 1 (x < y)
function solveExpCircle(baseA, r) {
let x = 1.0;
for (let i = 0; i < 28; i++) {
const y = Math.pow(baseA, x);
const dy = y * Math.log(baseA);
const f = x * x + y * y - r * r;
const df = 2 * x + 2 * y * dy;
if (Math.abs(df) < 1e-6) break;
x -= f / df;
}
return x;
}

  function hudOf(mId, p, si) {
    let eq = '', cards = [];
    if (mId === 'type1') {
      const d=Math.log2(p.multK), w=p.xCut2-p.xCut1, S=si===1?Math.sqrt(3)*d*d/4:w*d;
      eq=`$AB=\\log_2${exact(p.multK)},\\quad ${si===1?'S=\\frac{\\sqrt3}{4}(\\log_2'+exact(p.multK)+')^2':'S='+exact(w)+'\\log_2'+exact(p.multK)}\\approx${S.toFixed(3)}$`;
      cards=[{title:'세로 간격 AB',val:approx(d),sub:'정확값: log₂k'}, {title:si===1?'정삼각형 넓이':'같은 단면을 갖는 직사각형 넓이',val:approx(S),sub:si===1?'(√3/4)(log₂k)²':'(t₂−t₁)log₂k'}];
    } else if (mId === 'type2') {
      const g=ALV.logLineGeometry(p.lineSlope,p.lineYInt), both=Math.round(p.showLeftWing)===1, n=g.right.length+(both?g.left.length:0);
      eq=`$y=${exact(p.lineSlope)}x+${exact(p.lineYInt)}$와 현재 그래프의 교점: ${n}개`;
      cards=[{title:'오른쪽 가지의 교점',val:`${g.right.length}개`,sub:'x>0'}, {title:'왼쪽 가지의 교점',val:both?`${g.left.length}개`:'표시하지 않음',sub:'x<0'}];
      if(p.lineSlope===0 && both) cards.push({title:'수평선일 때만 대칭인 두 근',val:`합 0 · 곱 ≈ ${(-(2**p.lineYInt)).toFixed(3)}`,sub:'정확한 곱은 −2ᵏ'});
      else { const q=p.lineSlope>0?g.positive:g.negative; if(q.maximum!=null) cards.push({title:'오목한 쪽의 최대 높이차 H',val:approx(q.maximum,4),sub:'H>0: 2개 · H=0: 접점 1개 · H<0: 0개'}); }
    } else if (mId === 'type3') {
      const a=2**(-p.lineT),b=2**p.lineT,M=p.shiftP+(a+b)/2;
      eq=`$(x_1-p)(x_2-p)=1,\\quad M-p-1=\\frac{(2^t-1)^2}{2\\cdot2^t}\\ge0$`;
      cards=[{title:'점근선부터 잰 두 길이의 곱',val:'1',sub:'서로 역수'}, {title:'중점의 x좌표',val:approx(M),sub:p.lineT===0?'교점 하나: 꺾인 점과 일치':`꺾인 점보다 ≈ ${(M-p.shiftP-1).toFixed(3)} 오른쪽`}];
    } else if (mId === 'type4') {
      const x=solveExpLine(p.baseA,0,0,p.lineK),d=Math.abs(p.lineK-2*x);
      eq=`$M=(${exact(p.lineK/2)},${exact(p.lineK/2)}),\\quad AB=d\\sqrt2,\\quad S=\\frac{${exact(p.lineK)}d}{2}$`;
      cards=[{title:'가로 차 d',val:approx(d),sub:'정확한 관계: AB=d√2'}, {title:'삼각형 OAB의 넓이',val:approx(p.lineK*d/2),sub:'½·k·d'}];
    } else if (mId === 'type5') {
      const C=p.logQ-p.expM;
      eq=`$C=q-m=n-p=${exact(C)},\\quad M=(${exact((p.lineK-C)/2)},${exact((p.lineK+C)/2)})$`;
      cards=[{title:'대칭축',val:`y=x${C<0?'':'+'}${exact(C)}`,sub:'p=m+n−q 유지'}, {title:'중점의 좌표',val:`(${exact((p.lineK-C)/2)}, ${exact((p.lineK+C)/2)})`,sub:'대칭축과 y=−x+k의 교점'}];
    } else if (mId === 'type6') {
      const d1=Math.abs(p.k1-2*solveExpLine(2,0,0,p.k1)),d2=Math.abs(p.k2-2*solveExpLine(2,0,0,p.k2)),dk=Math.abs(p.k2-p.k1);
      eq=`$h=\\frac{${exact(dk)}}{\\sqrt2},\\quad S=\\frac{${exact(dk)}}2(\\Delta x_1+\\Delta x_2)$`;
      cards=[{title:'두 평행선 사이의 높이',val:approx(dk/Math.SQRT2),sub:`정확값: ${exact(dk)}/√2`}, {title:'사다리꼴 넓이',val:approx(dk*(d1+d2)/2),sub:'밑변과 높이의 √2 약분'}, {title:'대칭축과 밑변의 각',val:'90°',sub:'두 밑변끼리는 평행'}];
    } else if (mId === 'type7') {
      const x=solveExpCircle(p.baseA,p.radiusR),y=p.baseA**x,d=y-x;
      eq=`$x+y=\\sqrt{2r^2-d^2},\\quad d=y-x=PQ/\\sqrt2$`;
      cards=[{title:'지수곡선 위의 P',val:`≈ (${x.toFixed(3)}, ${y.toFixed(3)})`,sub:'Q는 두 좌표를 바꾼 점'}, {title:'현의 길이 PQ',val:approx(d*Math.SQRT2),sub:'정확한 관계: PQ=(y−x)√2'}, {title:'원 위 조건 확인',val:`x²+y² ≈ ${(x*x+y*y).toFixed(3)}`,sub:`r² ≈ ${(p.radiusR*p.radiusR).toFixed(3)}`}];
    } else {
      const K=Math.round(p.maxX),rows=[]; for(let y=1;2**y<=K;y++)rows.push(K-2**y+1);
      eq=`$N=${rows.join('+')}=${rows.reduce((a,b)=>a+b,0)}$`;
      cards=[{title:'자연수 격자점',val:`${rows.reduce((a,b)=>a+b,0)}개`,sub:'양 끝 포함: K−2ᵐ+1'}, {title:'가로줄 수',val:String(rows.length),sub:'2ᵐ≤K인 자연수 m'}];
    }
    return {eq,cards};
  }

  function exploreFocus(mo,p) {
    if(mo.id!=='type2')return FOCUS[Number(mo.id.slice(4))-1];
    const g=ALV.logLineGeometry(p.lineSlope,p.lineYInt), xs=[0,...g.right,...(Math.round(p.showLeftWing)?g.left:[])];
    const lo=Math.min(-3,...xs),hi=Math.max(4,...xs),pad=Math.max(1,(hi-lo)*.1);
    return {x:[lo-pad,hi+pad],y:[-4,Math.max(6,...xs.map(x=>p.lineSlope*x+p.lineYInt))+2]};
  }

  // 원래 곡선은 보존하고, 절댓값 비교를 켜면 보라색 점선을 추가합니다.
  function draw(mo, b, s, v, si) {
    const p=pv(s,mo), st=stage(s), id=mo.id;
    const seg=(a,z,c='amber',dash=false,w=2)=>b.seg(a,z,{color:c,dash,width:w});
    const point=(z,name,c='ink',o={})=>b.point(z,{color:c,label:name,r:5.5,dx:10,dy:-10,...o});
    const handle=(key,z,name,drag)=>b.handle(key,z,{color:'amber',label:name,r:7,drag});
    const curve=(f,c,from=-9,to=20)=>{
      b.plot(f,{color:c,width:2.7,from,to});
      if(s.abs)b.plot(x=>Math.abs(f(x)),{color:'violet',width:1.5,dash:true,from,to});
    };
    if(s.grid)b.grid(); b.axes();
    if(s.diag || (st>=1 && ['type4','type6','type7'].includes(id))) b.line([0,0],1,{color:'violet',dash:true,width:1.8});
    if(id==='type1') {
      const f=x=>Math.log2(x),g=x=>Math.log2(p.multK*x),d=Math.log2(p.multK),x=p.xCut1,z=p.xCut2;
      curve(f,'green',.02);curve(g,'sky',.02);
      const A=[x,f(x)],B=[x,g(x)];
      seg([x,0],[x,g(x)+.7],'amber',true);
      if(si===1){
        const C=[x+Math.sqrt(3)*d/2,(f(x)+g(x))/2];
        b.poly([A,B,C],{color:'ink',width:1.8,...(st>=3?{fill:'amber',fillAlpha:.15}:{})});point(C,'C','rose');
      } else {
        seg([z,0],[z,g(z)+.7],'rose',true);
        const pts=[];for(let i=0;i<=80;i++){const u=x+(z-x)*i/80;pts.push([u,f(u)]);}for(let i=80;i>=0;i--){const u=x+(z-x)*i/80;pts.push([u,g(u)]);}
        b.poly(pts,{fill:'amber',fillAlpha:st>=3?.18:.06,stroke:false});
        point([z,f(z)],'C','green');
        handle('right-cut',[z,g(z)],`D · x=${exact(z)}`,w=>{p.xCut2=clamp(Math.round(w.x*4)/4,Math.max(3.5,p.xCut1),7);});
        if(st>=2)[.25,.5,.75,1].forEach(r=>{const u=x+(z-x)*r;seg([u,f(u)],[u,g(u)],'rose',false,2.7);});
        if(st>=3){b.poly([[x,-1],[z,-1],[z,-1-d],[x,-1-d]],{fill:'violet',fillAlpha:.14,color:'violet'});b.text([(x+z)/2,-1-d/2],'같은 세로 단면',{color:'violet',size:11});}
      }
      point(A,'A','green',{dx:-12,dy:12,align:'right'});
      handle('left-cut',B,`B · x=${exact(x)}`,w=>{p.xCut1=clamp(Math.round(w.x*4)/4,1,Math.min(3.5,p.xCut2));});
      if(st>=1)seg(A,B,'amber',false,st>=2?4:2);
      if(st>=2)b.text([x,(f(x)+g(x))/2],`AB = log₂${exact(p.multK)}`,{color:'amber',align:'right',dx:-12,size:12});
    } else if(id==='type2') {
      const both=Math.round(p.showLeftWing)===1,m=p.lineSlope,k=p.lineYInt,g=ALV.logLineGeometry(m,k),vb=b.viewBox();
      curve(x=>2*Math.log2(x),'green',.00001,vb.x1+.5);
      if(both)curve(x=>2*Math.log2(-x),'rose',vb.x0-.5,-.00001);
      b.line([0,k],m,{color:'amber',width:2.4});
      if(st>=1)g.right.forEach(x=>point([x,m*x+k],'','green'));
      if(st>=2 && both)g.left.forEach(x=>point([x,m*x+k],'','rose'));
      if(st>=2 && m!==0){const z=m>0?g.positive:g.negative,x=(m>0?1:-1)*z.peak;if(m>0||both){seg([x,m*x+k],[x,2*Math.log2(Math.abs(x))],'violet',false,3);b.text([x,2*Math.log2(Math.abs(x))],'최대 높이차',{color:'violet',size:11,dy:-14});}}
      handle('line-intercept',[0,k],`k=${exact(k)}`,w=>{p.lineYInt=clamp(Math.round(w.y*4)/4,.5,3.5);});
    } else if(id==='type3') {
      const q=p.shiftP,t=p.lineT,x1=q+2**(-t),x2=q+2**t,M=(x1+x2)/2;
      b.vline(q,{color:'violet',dash:true});curve(x=>-Math.log2(x-q),'rose',q+.0001,q+1);curve(x=>Math.log2(x-q),'green',q+1,30);b.hline(t,{color:'amber'});
      point([q+1,0],`(${exact(q+1)}, 0)`,'ink',{dy:20});
      if(t>0)point([x1,t],st>=2?`x₁ ≈ ${x1.toFixed(3)}`:'x₁','rose',{align:'right',dx:-10,dy:-16});
      handle('fold-height',[x2,t],st>=2?`x₂ ≈ ${x2.toFixed(3)}`:t===0?'x₁=x₂':'x₂',w=>{p.lineT=clamp(Math.round(w.y*10)/10,0,3);});
      if(st>=2){seg([x1,t],[x1,0],'rose',true);seg([x2,t],[x2,0],'green',true);seg([q,-.7],[x1,-.7],'rose',false,3);seg([q,-1.2],[x2,-1.2],'green',false,3);}
      if(st>=3){seg([M,t],[M,0],'sky',true);point([M,t],'M','sky',{dy:-20});}
    } else if(id==='type4') {
      const a=p.baseA,k=p.lineK,x=solveExpLine(a,0,0,k),y=k-x,A=[x,y],B=[y,x],M=[k/2,k/2],C=[x,x];
      curve(x=>a**x,'green',-8,10);curve(x=>Math.log(x)/Math.log(a),'sky',.001,20);b.line([0,k],-1,{color:'amber'});
      b.poly([[0,0],A,B],{color:'ink',width:1.5,...(st>=3?{fill:'amber',fillAlpha:.14}:{})});
      point([0,0],'O','ink',{dx:-12,dy:16});point(A,'A','green',{align:'right',dx:-12,dy:-12});point(B,'B','sky',{dy:16});
      handle('inverse-cut',M,st>=2?`M(${exact(k/2)}, ${exact(k/2)})`:'M',w=>{p.lineK=clamp(Math.round((w.x+w.y)*4)/4,3,7.5);});
      if(st>=1){seg(A,M,'amber');seg(M,B,'amber');b.ticks(A,M,{color:'amber'});b.ticks(M,B,{color:'amber'});}
      if(st>=2){seg(A,C,'rose',true);seg(C,B,'rose',true);b.right(C,A,B,{color:'rose',size:11});b.ticks(A,C,{color:'rose'});b.ticks(C,B,{color:'rose'});}
      if(st>=3){seg([0,0],M,'violet',true);b.right(M,[0,0],A,{color:'violet',size:11});}
    } else if(id==='type5') {
      tie(p);const C=p.logQ-p.expM,k=p.lineK,A1=[p.expM,p.expN+1],B1=[p.logP+1,p.logQ],M0=[(A1[0]+B1[0])/2,(A1[1]+B1[1])/2],M=[(k-C)/2,(k+C)/2];
      curve(x=>2**(x-p.expM)+p.expN,'green',-8,14);curve(x=>Math.log2(x-p.logP)+p.logQ,'sky',p.logP+.001,30);b.line([0,k],-1,{color:'amber'});
      handle('translated-cut',M,st>=3?`M(${exact(M[0])}, ${exact(M[1])})`:'M',w=>{p.lineK=clamp(Math.round((w.x+w.y)*2)/2,4,8);});
      if(st>=1){point(A1,`P₁(${exact(A1[0])}, ${exact(A1[1])})`,'green',{align:'right',dx:-10});point(B1,`P₂(${exact(B1[0])}, ${exact(B1[1])})`,'sky',{dy:16});seg(A1,B1,'rose',true);}
      if(st>=2){b.line([0,C],1,{color:'violet',dash:true,width:2.5});point(M0,'M₀','rose',{dy:18});b.ticks(A1,M0,{color:'rose'});b.ticks(M0,B1,{color:'rose'});b.right(M0,A1,[M0[0]+1,M0[1]+1],{color:'violet'});}
      if(st>=3){const x=solveExpLine(2,p.expM,p.expN,k),A=[x,k-x],B=[k-x-C,x+C];point(A,'A','green');point(B,'B','sky');seg(A,B,'amber',false,3);b.ticks(A,M,{color:'amber'});b.ticks(M,B,{color:'amber'});}
    } else if(id==='type6') {
      const x=solveExpLine(2,0,0,p.k1),z=solveExpLine(2,0,0,p.k2),A=[x,p.k1-x],B=[p.k1-x,x],C=[z,p.k2-z],D=[p.k2-z,z],M1=[p.k1/2,p.k1/2],M2=[p.k2/2,p.k2/2];
      curve(x=>2**x,'green',-8,10);curve(x=>Math.log2(x),'sky',.001,20);b.line([0,p.k1],-1,{color:'amber'});b.line([0,p.k2],-1,{color:'rose'});
      b.poly([A,B,D,C],{color:'ink',width:1.5,...(st>=3?{fill:'amber',fillAlpha:.15}:{})});
      [[A,'A','green'],[B,'B','sky'],[C,'C','green'],[D,'D','sky']].forEach(([z,n,c])=>point(z,n,c,{dy:n==='B'||n==='D'?16:-12}));
      handle('upper-cut',M2,`M₂ · k₂=${exact(p.k2)}`,w=>{p.k2=clamp(Math.round((w.x+w.y)*4)/4,5,7.2);});
      if(st>=1){point(M1,'M₁','violet');b.ticks(A,M1,{color:'amber'});b.ticks(M1,B,{color:'amber'});b.ticks(C,M2,{color:'rose'});b.ticks(M2,D,{color:'rose'});}
      if(st>=2){seg(M1,M2,'green',false,3);b.right(M1,M2,A,{color:'green',size:11});b.right(M2,M1,C,{color:'green',size:11});b.text([(M1[0]+M2[0])/2,(M1[1]+M2[1])/2],'h',{color:'green',dx:15,size:13});}
    } else if(id==='type7') {
      const r=p.radiusR,a=p.baseA,x=solveExpCircle(a,r),y=a**x,P=[x,y],Q=[y,x],C=[x,x];
      b.circle([0,0],r,{color:'violet',width:2.4});curve(x=>a**x,'green',-6,6);curve(x=>Math.log(x)/Math.log(a),'sky',.001,12);
      point(Q,st>=3?`Q ≈ (${y.toFixed(2)}, ${x.toFixed(2)})`:'Q','sky',{dy:16});
      handle('circle-radius',P,st>=3?`P ≈ (${x.toFixed(2)}, ${y.toFixed(2)})`:'P',w=>{p.radiusR=clamp(Math.round(Math.hypot(w.x,w.y)*10)/10,2.2,5);});
      if(st>=1)seg(P,Q,'amber',false,3);
      if(st>=2){seg(P,C,'rose',true);seg(C,Q,'rose',true);b.right(C,P,Q,{color:'rose',size:11});b.ticks(P,C,{color:'rose'});b.ticks(C,Q,{color:'rose'});}
      if(st>=3){seg([0,0],P,'violet',true);point([(x+y)/2,(x+y)/2],'M','violet',{dy:-16});}
    } else if(id==='type8') {
      const K=Math.round(p.maxX),f=x=>Math.log2(x);curve(f,'green',.02,20);seg([K,0],[K,f(K)+.5],'amber',true);
      handle('lattice-bound',[K,f(K)],`K=${K}`,w=>{p.maxX=clamp(Math.round(w.x),4,13);});
      for(let y=1;2**y<=K;y++){const x0=2**y;if(st>=1)for(let x=x0;x<=K;x++)point([x,y],'','amber',{r:4.6});if(st>=2)seg([x0,y],[K,y],'rose',false,3);if(st>=3)b.text([K,y],`${K-x0+1}개`,{color:'rose',align:'left',dx:12,size:12});}
    }
  }

  const params = {};
  KILLER_MODES.forEach((mo) => {
    SLIDERS[mo.id].forEach((d) => {
      if (mo.id === 'type5' && d.key === 'logP') return; // [2.0 수정] p 는 m 을 따라 움직임
      params[mo.id + '_' + d.key] = {
        value: mo.scenarios[0].params[d.key], min: d.min, max: d.max, step: d.step, color: 'amber', label: d.label,
        hint: mo.id === 'type5' && d.key === 'expM' ? '로그 쪽 평행이동 p는 대칭이 성립하도록 m + n − q 로 함께 움직입니다' : undefined,
        format: (val) => (d.key === 'showLeftWing' ? (Math.round(val) === 1 ? '켬 (log₂x²)' : '끔 (2log₂x)') : d.key === 'radiusR' ? `≈ ${val.toFixed(3)}` : exact(val))
      };
    });
  });

  const actions = () => [
    { id: 'twin', icon: 'spark', label: '숫자 바꿔 보기', run: (s, lab) => twin(s, lab) },
    { id: 'diag', icon: 'layers', label: (s) => (s.diag ? 'y = x 기준선 켜짐' : 'y = x 기준선'), on: (s) => s.diag, run: (s) => { s.diag = !s.diag; } },
    { id: 'abs', icon: 'wand', label: (s) => (s.abs ? '|f(x)| 비교 점선 켜짐' : '|f(x)| 비교 점선'), on: (s) => s.abs, run: (s) => { s.abs = !s.abs; } },
    ...(current && current.mo.id==='type2' ? [{id:'fit-roots',icon:'fit',label:'교점 전체보기',run:(s,lab)=>{const L=activeLab(lab);if(L&&L.board)L.board.setFocus(exploreFocus(current.mo,pv(s,current.mo)),true);}}] : [])
  ];
  let current = null;
  function twin(s, lab) {
    const {mo}=current;
    SLIDERS[mo.id].forEach(d=>{
      if(!params[mo.id+'_'+d.key])return;
      const n=Math.floor((d.max-d.min)/d.step+1e-9);
      s[mo.id+'_'+d.key]=Number((d.min+Math.floor(Math.random()*(n+1))*d.step).toFixed(10));
    });
    if(mo.id==='type5')tie(pv(s,mo));
    s.revealed=false;
    const L=activeLab(lab);if(L&&L.setStep)L.setStep(0);else s.step=0;
    APLab.toast('탐구 조절값을 바꿨습니다. 문제 탭의 새 문제는 별도로 선택합니다.');
  }
  function conditions(mo,p){
    const f=exact;
    if(mo.id==='type1')return `$y=\\log_2x,\\quad y=\\log_2(${f(p.multK)}x),\\quad x\\gt0$`;
    if(mo.id==='type2')return `$y=${Math.round(p.showLeftWing)?'\\log_2x^2':'2\\log_2x'},\\quad y=${f(p.lineSlope)}x+${f(p.lineYInt)}$`;
    if(mo.id==='type3')return `$y=|\\log_2(x-${f(p.shiftP)})|,\\quad y=${f(p.lineT)},\\quad x>${f(p.shiftP)}$`;
    if(mo.id==='type4')return `$y=${f(p.baseA)}^x,\\quad y=\\log_{${f(p.baseA)}}x,\\quad y=-x+${f(p.lineK)}$`;
    if(mo.id==='type5')return `$y=2^{x-(${f(p.expM)})}+(${f(p.expN)}),\\quad y=\\log_2(x-${f(p.logP)})+(${f(p.logQ)})$`;
    if(mo.id==='type6')return `$y=-x+${f(p.k1)},\\quad y=-x+${f(p.k2)}$`;
    if(mo.id==='type7')return `$x^2+y^2=r^2,\\quad r\\approx${p.radiusR.toFixed(3)},\\quad a=${f(p.baseA)}$`;
    return `$1\\le x\\le${Math.round(p.maxX)},\\quad1\\le y\\le\\log_2x$`;
  }

  /* 문제·정리 탭: 「새 문제」 변형 생성기. 첫 문제는 옛 문제 그대로(글·풀이 원문), 눌러서 숫자·상황이 바뀝니다. */
  const KIND = ['vert', 'wing', 'absM', 'inv', 'xlat', 'trap', 'circ', 'latt'];
  const POOLS = [
    [ALV.POOLS.vertSAB, ALV.POOLS.vertTri], [ALV.POOLS.wingProd, ALV.POOLS.wingLine], [ALV.POOLS.absTF, ALV.POOLS.absProdSum],
    [ALV.POOLS.invKS, ALV.POOLS.invM], [ALV.POOLS.xlatCM, ALV.POOLS.xlatC], [ALV.POOLS.trapA, ALV.POOLS.trapB],
    [ALV.POOLS.circPa, ALV.POOLS.circA], [ALV.POOLS.lattA, ALV.POOLS.lattB]
  ];
  const KINDS_OF = ['vert', 'wing', ['absTF', 'absM'], 'inv', 'xlat', 'trap', 'circ', 'latt'];
  const kindOf = (mi, si) => (Array.isArray(KINDS_OF[mi]) ? KINDS_OF[mi][si] : KINDS_OF[mi]);

  const groups = KILLER_MODES.map((mo, mi) => ({
    id: mo.id,
    title: rich(mo.shortTitle),
    short: SHORT[mi],
    scenes: mo.scenarios.map((scen, si) => {
      // 원래 발문·정석 풀이는 보존하되, 실제 결함이 있던 설명은 검산된 생성식으로 교체합니다.
      const original={text:scen.problem,std:scen.textbookSteps,quick:scen.secretSteps};
      if(mi===0 && si===0)original.std=[...scen.textbookSteps.slice(0,2),'3) 두 곡선 사이의 모든 세로 단면이 길이 2이므로 가로 3, 세로 2인 직사각형과 넓이가 같다. 따라서 넓이는 6이다.'];
      if((mi===0&&si===1)||mi===1||mi===2||mi===4)delete original.quick;
      if((mi===1&&si===1)||(mi===4&&si===1))delete original.std;
      if(mi===6){delete original.text;delete original.std;delete original.quick;}
      if(mi===3&&si===0){delete original.quick;original.std=[...original.std,'4) 지수곡선은 아래로 볼록하고 x=0에서는 직선 y=x+2보다 아래에 있다. 양의 구간에서는 한 번만 교차하므로 대입으로 확인한 양수해 2가 유일하다.'];}
      if(mi===3&&si===1)original.quick=['두 교점은 서로 대칭이므로 중점은 $y=x$와 $y=-x+6$의 교점 $M(3,3)$입니다. 개별 교점 $A(2,4), B(4,2)$를 구하지 않아도 두 $x$좌표의 합과 두 $y$좌표의 합은 각각 $6$입니다.'];
      const VARY=ALV.make(kindOf(mi,si),POOLS[mi][si],original);
      const presentation=ALV.ext(VARY,{tag:scen.source,standardTitle:rich(scen.textbookTitle),quickTitle:mi===6?'현의 길이에서 좌표의 합과 차로':rich(scen.secretTitle)});
      presentation.solution.quickTag='핵심 발상';

      return {
        id: mo.id + '-' + si,
        title: rich(scen.chip),
        short: scen.chip.split(' (')[0],
        question: mi===0 && si===1 ? '세로 선분 AB를 한 변으로 하는 정삼각형의 넓이를, 수직선의 위치를 구하지 않고 알 수 있을까?' : Q[mi],
        guide: mi===0 && si===1 ? '금색 점 B를 좌우로 끌어 정삼각형이 어떻게 변하는지 비교해 보세요.' : GUIDE[mi],
        aspect: mi===1 ? 'free' : undefined,
        controls: SLIDERS[mo.id].filter((d) => params[mo.id + '_' + d.key] && !(mi===0 && si===1 && d.key==='xCut2')).map((d) => mo.id + '_' + d.key),
        actions,
        notesTitle: '오답 함정 주의보',
        focus: () => FOCUS[mi],
        enter: (s) => {
          current = { mo, scen };
          Object.keys(scen.params).forEach((k) => { s[mo.id + '_' + k] = scen.params[k]; });
        },
        ...presentation,
        steps: (s, lab) => (activeLab(lab)?.tab === 'explore' ? exploreSteps(mo,pv(s,mo),si) : VARY.cur().steps).map((t,i)=>`${i+1}단계 · ${rich(t)}`),
        view: (s, lab) => {
          current={mo,scen};const L=activeLab(lab);
          if(L && L.tab!=='explore')return {notes:stage(s)>=3?'그림의 조건과 정의역을 다시 확인하세요.':''};
          const p=pv(s,mo);if(mo.id==='type5')tie(p);
          const h=hudOf(mo.id,p,si),st=stage(s),steps=exploreSteps(mo,p,si);
          return {
            chips:[{k:mo.code,html:conditions(mo,p)}],
            readouts:st>=3?h.cards.map(c=>({label:c.title,value:String(c.val),note:c.sub,color:'amber'})):[],
            formula:st?rich(steps[st-1]):'',
            notes:s.abs?'보라색 점선은 |f(x)| 비교용입니다. 원래 색의 곡선과 교점이 이 탐구의 기준입니다.':st>=3?rich(h.eq):''
          };
        },
        draw: (b, s, v, lab) => {
          lab=activeLab(lab);
          if (b.thumb || !lab || lab.tab === 'explore') {
            if (!b.thumb) ALV.focus(b, 'e' + mo.id + si, exploreFocus(mo,pv(s,mo)));
            draw(mo, b, b.thumb?{...s,step:0}:s, v, si);
            return;
          }
          const cv = VARY.cur();
          ALV.focus(b, 'v' + cv.sid, cv.win);
          ALV.gridAxes(b, s, cv);
          ALV.draw(b, cv, lab.tab === 'review' ? s.step : 0, v);
        }
      };
    })
  }));

  APLab.createLab({
    id: 'alg-log-deep',
    stagedReveal: true,
    title: '로그함수·역함수 도형 심화',
    courseName: '대수',
    unit: '지수함수와 로그함수 · 로그 도형 8대 유형',
    courseColor: 'var(--m-sky)',
    home: '../index.html#algebra',
    legacy: '../../labs/대수/part1b1.html',
    board: { kind: 'cartesian', focus: FOCUS[0] },
    params,
    state: { diag: false, abs: false },
    groups
  });
});
</script>
