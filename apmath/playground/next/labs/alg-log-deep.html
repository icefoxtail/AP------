  // Helper: Solve a^(x-m)+n = -x + k using Newton's method
function solveExpLine(baseA, m, n, k) {
let x = (k + m - n) / 2;
for (let i = 0; i < 25; i++) {
const f = Math.pow(baseA, x - m) + n + x - k;
const df = Math.pow(baseA, x - m) * Math.log(baseA) + 1;
x -= f / df;
}
return x;
}

// Helper: Solve a^x on circle x^2 + y^2 = r^2 in Quadrant 1 (x < y)
function solveExpCircle(baseA, r) {
let x = 1.0;
for (let i = 0; i < 28; i++) {
const y = Math.pow(baseA, x);
const dy = y * Math.log(baseA);
const f = x * x + y * y - r * r;
const df = 2 * x + 2 * y * dy;
if (Math.abs(df) < 1e-6) break;
x -= f / df;
}
return x;
}

{ title: '원 위의 교점 P(x₁, y₁)', val: `(${xP.toFixed(2)}, ${yP.toFixed(2)})`, sub: `대칭점 Q(${yP.toFixed(2)}, ${xP.toFixed(2)})` },
{ title: '피타고라스 x₁² + y₁²', val: (xP*xP + yP*yP).toFixed(2), sub: `r² = ${rSq.toFixed(2)} (오차 0.000%)` },
{ title: '대칭 현의 길이 PQ', val: distPQ.toFixed(3), sub: `(y₁ - x₁)√2 = ${(yP-xP).toFixed(2)}√2` },
{ title: '현 PQ의 기울기', val: '-1.000', sub: '원과 역함수 동시 대칭' }
];
} else if (mId === 'type8') {
const K = Math.round(p.maxX);
let vertSum = 0;
for (let x = 1; x <= K; x++) vertSum += Math.max(0, Math.floor(Math.log2(x) + 1e-9));
let horizSum = 0;
const layers = [];
for (let y = 1; Math.pow(2, y) <= K; y++) {
const cnt = K - Math.pow(2, y) + 1;
horizSum += cnt;
layers.push(`${cnt}`);
}

eq = (
`$1 \\le x \\le ${K}, \\; 1 \\le y \\le \\log_2 x \\iff 2^y \\le x \\le ${K} \\implies \\text{가로 합 } ${layers.join('+')} = ${horizSum}\\text{개}$`
);
cards = [
{ title: `총 자연수 격자점 (K=${K})`, val: `${horizSum}개`, sub: `가로층 합: ${layers.join(' + ')}` },
{ title: '세로합 vs 가로(역함수)합', val: '오차 0.000%', sub: `${vertSum}개 = ${horizSum}개 완벽 일치` },
{ title: '최고 층수 y_max', val: `${layers.length}층`, sub: `⌊log₂(${K})⌋ = ${layers.length}` },
{ title: 'y=1층 점 개수 (K - 2¹ + 1)', val: `${K - 1}개`, sub: `x = 2 ~ ${K} 구간` }
];
}


    return { eq, cards };
  }

  /* ===== 원본 그대로: 쌍둥이 변형 생성기 (원본 triggerTwinProblem) — scen.problem·snapParams 를 바꿉니다 ===== */
  function runTwin(mId, scen, p) {
    if (mId === 'type1') {
const kVal = [2, 4, 8, 16][Math.floor(Math.random() * 4)];
const x1 = [1, 2][Math.floor(Math.random() * 2)];
const x2 = [4, 5, 6][Math.floor(Math.random() * 3)];
const dy = Math.log2(kVal);
p.multK = kVal;
p.xCut1 = x1;
p.xCut2 = x2;
scen.snapParams = { ...p };
scen.problem = `**[🎲 쌍둥이 변형]** $y = \\log_2 x$와 $y = \\log_2(${kVal}x)$의 세로 간격 불변량은 **$\\overline{AB} = \\log_2 ${kVal} = ${dy}$**이고, $x = ${x1}, x = ${x2}$로 둘러싸인 등적 직사각형 넓이는 **$(${x2}-${x1}) \\times ${dy} = ${(x2-x1)*dy}$**입니다!`;
} else if (mId === 'type2') {
const yInt = [1, 2, 3][Math.floor(Math.random() * 3)];
p.showLeftWing = 1;
p.lineSlope = 0;
p.lineYInt = yInt;
scen.snapParams = { ...p };
const rx = Math.pow(2, yInt / 2).toFixed(2);
scen.problem = `**[🎲 쌍둥이 변형]** 방정식 $\\log_2 x^2 = ${yInt}$은 양날개 대칭에 의해 $x = \\pm ${rx}$ **2개의 실근**을 가지며 합은 $0$, 곱은 $-${Math.pow(2, yInt)}$입니다!`;
} else if (mId === 'type3') {
const pVal = [0, 1, 2, 3][Math.floor(Math.random() * 4)];
const tVal = [1, 2, 3][Math.floor(Math.random() * 3)];
p.shiftP = pVal;
p.lineT = tVal;
scen.snapParams = { ...p };
const x1 = pVal + Math.pow(2, -tVal);
const x2 = pVal + Math.pow(2, tVal);
scen.problem = `**[🎲 쌍둥이 변형]** $y = |\\log_2(x - ${pVal})| = ${tVal}$의 두 교점 $x_1 = ${x1}, x_2 = ${x2}$에 대하여 **$(x_1 - ${pVal})(x_2 - ${pVal}) = 1.000$**이고, 중점 $M = ${((x1+x2)/2).toFixed(2)} > ${pVal+1}$입니다!`;
} else if (mId === 'type4') {
const kVal = [4, 5, 6, 7][Math.floor(Math.random() * 4)];
p.lineK = kVal;
scen.snapParams = { ...p };
scen.problem = `**[🎲 쌍둥이 변형]** 직선 $y = -x + ${kVal}$과 $y=2^x, y=\\log_2 x$의 두 교점의 중점은 **$M(${kVal/2}, ${kVal/2})$**이고, 두 교점의 $x$좌표 합과 $y$좌표 합은 모두 **$${kVal}$**입니다!`;
} else if (mId === 'type5') {
const pairs = [
{ m: 1, n: 2, p: 4, q: -1 },
{ m: 0, n: 3, p: 1, q: 2 },
{ m: 2, n: 1, p: 3, q: 0 }
];
const pick = pairs[Math.floor(Math.random() * pairs.length)];
p.expM = pick.m;
p.expN = pick.n;
p.logP = pick.p;
p.logQ = pick.q;
scen.snapParams = { ...p };
const cShift = ((pick.n - pick.m) + (pick.q - pick.p)) / 2;
scen.problem = `**[🎲 쌍둥이 변형]** 지수 정점 $(${pick.m}, ${pick.n+1})$과 로그 정점 $(${pick.p+1}, ${pick.q})$의 중점을 이용해 어긋난 두 곡선의 대칭축을 구하면 **$y = x ${cShift >= 0 ? '+ ' + cShift : '- ' + Math.abs(cShift)}$**입니다!`;
} else if (mId === 'type6') {
const k1 = [3.5, 4.0][Math.floor(Math.random() * 2)];
const k2 = [5.5, 6.5][Math.floor(Math.random() * 2)];
p.k1 = k1;
p.k2 = k2;
scen.snapParams = { ...p };
scen.problem = `**[🎲 쌍둥이 변형]** 두 평행선 $y = -x + ${k1},\\; y = -x + ${k2}$ 사이의 높이는 $h = \\frac{${(k2-k1).toFixed(1)}}{\\sqrt{2}}$이며, 사다리꼴 넓이 계산 시 $\\sqrt{2}$가 자동으로 약분됩니다!`;
} else if (mId === 'type7') {
const bList = [2, 3, 4];
const b = bList[Math.floor(Math.random() * bList.length)];
const rSq = 1 + b * b;
p.baseA = b;
p.radiusR = Math.sqrt(rSq);
scen.snapParams = { ...p };
scen.problem = `**[🎲 쌍둥이 변형]** 원 $x^2 + y^2 = ${rSq}$ ($= 1^2 + ${b}^2$)과 $y = a^x, y = \\log_a x$의 교점 거리가 $\\overline{PQ} = ${(b-1)}\\sqrt{2}$일 때, 정수 제곱합 스캔으로 $P(1, ${b})$이므로 **$a = ${b}$**입니다!`;
} else if (mId === 'type8') {
const mx = [7, 8, 9, 10, 12][Math.floor(Math.random() * 5)];
p.maxX = mx;
scen.snapParams = { ...p };
let cnt = 0;
for (let y = 1; Math.pow(2, y) <= mx; y++) cnt += (mx - Math.pow(2, y) + 1);
scen.problem = `**[🎲 쌍둥이 변형]** $1 \\le x \\le ${mx},\\; 1 \\le y \\le \\log_2 x$의 자연수 격자점 개수는 가로줄 역함수 공식으로 총 **${cnt}개**입니다!`;
}


  }

  /* ===== 원본 drawMathSegment / drawFunctionCurve / drawMathPoint 와 같은 이름·같은 인자 → 새 무대 엔진 ===== */
  function shim(b, s, sink) {
    let hid = 0;
    return {
      drawMathSegment: (x1, y1, x2, y2, col = '#fbbf24', dash = [], w = 2.2) => b.seg([x1, y1], [x2, y2], { color: col, width: w, dash: dash.length ? dash : null }),
      drawFunctionCurve: (fn, col = '#34d399', w = 2.6, dash = [], x0 = -9, x1 = 14) =>
        b.plot((x) => { let y = fn(x); if (s.abs && !isNaN(y)) y = Math.abs(y); return Number.isFinite(y) && Math.abs(y) <= 60 ? y : NaN; }, { color: col, width: w, dash: dash.length ? dash : null, from: x0, to: x1 }),
      drawMathLine: (slope, icpt, col = '#fbbf24', dash = [], w = 2) => b.line([0, icpt], slope, { color: col, width: w, dash: dash.length ? dash : null }),
      drawMathCircle: (cx, cy, r, col = '#38bdf8', dash = [], w = 2.2) => b.circle([cx, cy], r, { color: col, width: w, dash: dash.length ? dash : null }),
      drawMathPoint: (x, y, lbl = '', col = '#fbbf24', rad = 6, drag = false, onDrag = null) => {
        if (drag) b.handle('h' + (hid++), [x, y], { color: col, r: rad, label: lbl, drag: onDrag });
        else b.point([x, y], { color: col, r: rad, label: lbl });
      },
      badge: (text, color = '#fbbf24') => sink.lines.push({ text, color })
    };
  }

  function draw(mo, b, s, v) {
    const p = pv(s, mo);
    const sink = { lines: [], tape: null };
    const { drawMathSegment, drawFunctionCurve, drawMathLine, drawMathCircle, drawMathPoint, badge } = shim(b, s, sink);
    const st = (n) => s.step >= n; // 원본 state.steps[n] 에 해당 (셸의 단계는 누적)
    if (s.grid) b.grid();
    b.axes();
    if (s.diag) drawMathLine(1, 0, 'rgba(251, 191, 36, 0.55)', [6, 5], 1.8);
    const id = mo.id;

    if (id === 'type1') {
      const dy = Math.log2(p.multK);
      const fn1 = (x) => Math.log2(x), fn2 = (x) => Math.log2(p.multK * x);
      if (st(3)) {
        const pts = [];
        for (let x = p.xCut1; x <= p.xCut2 + 1e-9; x += 0.05) pts.push([x, fn1(x)]);
        for (let x = p.xCut2; x >= p.xCut1 - 1e-9; x -= 0.05) pts.push([x, fn2(x)]);
        b.poly(pts, { fill: 'amber', fillAlpha: 0.16, stroke: false });
        badge(`등적 직사각형 넓이 S = Δx(${(p.xCut2 - p.xCut1).toFixed(1)}) × log₂k(${dy.toFixed(2)}) = ${((p.xCut2 - p.xCut1) * dy).toFixed(2)}`, '#fbbf24');
      }
      drawFunctionCurve(fn1, '#34d399', 2.8, [], 0.06, 9.5);
      drawFunctionCurve(fn2, '#38bdf8', 2.8, [], 0.06, 9.5);
      const y1A = fn1(p.xCut1), y1B = fn2(p.xCut1), y2A = fn1(p.xCut2), y2B = fn2(p.xCut2);
      if (st(2)) {
        drawMathSegment(p.xCut1, y1A, p.xCut1, y1B, '#fbbf24', [], 3.4);
        drawMathSegment(p.xCut2, y2A, p.xCut2, y2B, '#fb7185', [], 3.4);
      }
      drawMathPoint(p.xCut1, y1A, `A(${p.xCut1.toFixed(1)}, ${y1A.toFixed(2)})`, '#34d399', 6);
      drawMathPoint(p.xCut1, y1B, `B (AB=${dy.toFixed(2)})`, '#fbbf24', 8, true, (w) => { p.xCut1 = clamp(Math.round(w.x * 4) / 4, 1, Math.min(3.5, p.xCut2 - 0.5)); });
      drawMathPoint(p.xCut2, y2B, `D(x₂=${p.xCut2.toFixed(1)})`, '#fb7185', 7.5, true, (w) => { p.xCut2 = clamp(Math.round(w.x * 4) / 4, Math.max(3.5, p.xCut1 + 0.5), 7); });
    } else if (id === 'type2') {
      const isBoth = Math.round(p.showLeftWing) === 1;
      drawFunctionCurve((x) => 2 * Math.log2(x), '#34d399', 3.0, [], 0.05, 8.5);
      if (isBoth) drawFunctionCurve((x) => 2 * Math.log2(-x), '#fb7185', 3.0, [], -8.5, -0.05);
      else if (st(1)) drawFunctionCurve((x) => 2 * Math.log2(-x), 'rgba(251, 113, 133, 0.25)', 1.6, [5, 5], -8.5, -0.05);
      drawMathLine(p.lineSlope, p.lineYInt, '#fbbf24', [], 2.3);
      if (Math.abs(p.lineSlope) < 0.01) {
        const rx = Math.pow(2, p.lineYInt / 2);
        drawMathPoint(rx, p.lineYInt, `+2^(k/2) = ${rx.toFixed(2)}`, '#34d399', 6.5);
        if (isBoth) drawMathPoint(-rx, p.lineYInt, `−2^(k/2) = −${rx.toFixed(2)} (추가 실근!)`, '#fb7185', 7);
      }
      if (st(3)) badge(isBoth ? 'y = log₂(x²) = 2log₂|x| : 양날개 우함수 (음수 실근 존재!)' : 'y = 2log₂x : 진수 조건 x > 0 (오른쪽 날개만 존재!)', isBoth ? '#fb7185' : '#38bdf8');
      drawMathPoint(0, p.lineYInt, `절편 k=${p.lineYInt.toFixed(1)}`, '#fbbf24', 8, true, (w) => { p.lineYInt = clamp(Math.round(w.y * 4) / 4, 0.5, 3.5); });
    } else if (id === 'type3') {
      const sp = p.shiftP;
      drawMathSegment(sp, -4, sp, 5, 'rgba(192, 132, 252, 0.6)', [5, 4], 1.8);
      drawFunctionCurve((x) => -Math.log2(x - sp), '#fb7185', 2.8, [], sp + 0.04, sp + 1);
      drawFunctionCurve((x) => Math.log2(x - sp), '#34d399', 2.8, [], sp + 1, 9.5);
      b.hline(p.lineT, { color: 'amber', width: 2.2 });
      const x1 = sp + Math.pow(2, -p.lineT), x2 = sp + Math.pow(2, p.lineT), midM = (x1 + x2) / 2;
      if (st(2)) {

      }
      if (st(3)) {
        drawMathSegment(midM, p.lineT, midM, 0, '#38bdf8', [4, 3], 2.0);
        drawMathPoint(midM, 0, `중점 M=${midM.toFixed(2)} (> ${sp + 1})`, '#38bdf8', 6);
        badge(`곱 불변: (x₁−${sp})(x₂−${sp}) = 1.000 | 산술기하 중점: M(${midM.toFixed(2)}) > 꺾인점(${sp + 1})`, '#fbbf24');
      }
      drawMathPoint(sp + 1, 0, `(${sp + 1}, 0)`, '#ecfdf5', 5.5);
      drawMathPoint(x1, p.lineT, `x₁=${x1.toFixed(2)}`, '#fb7185', 6);
      drawMathPoint(x2, p.lineT, `x₂=${x2.toFixed(2)}`, '#fbbf24', 8, true, (w) => { p.lineT = clamp(Math.round(w.y * 10) / 10, 0.4, 2.8); });
    } else if (id === 'type4') {
      const a = p.baseA;
      drawFunctionCurve((x) => Math.pow(a, x), '#34d399', 2.8, [], -4, 4.5);
      drawFunctionCurve((x) => Math.log(x) / Math.log(a), '#38bdf8', 2.8, [], 0.04, 9.0);
      drawMathLine(1, 0, 'rgba(251, 191, 36, 0.55)', [6, 4], 1.8);
      drawMathLine(-1, p.lineK, '#fbbf24', [], 2.3);
      const xA = solveExpLine(a, 0, 0, p.lineK), yA = p.lineK - xA, xB = yA, yB = xA, mx = p.lineK / 2;
      if (st(2)) {
        b.poly([[xA, yA], [xA, yB], [xB, yB]], { fill: 'amber', fillAlpha: 0.18, stroke: false });
        drawMathSegment(xA, yA, xA, yB, '#fbbf24', [4, 4], 2);
        drawMathSegment(xA, yB, xB, yB, '#fbbf24', [4, 4], 2);
      }
      if (st(3)) {
        const dx = Math.abs(xB - xA);
        sink.tape = `대칭 중점 M = $\\dfrac{k\\ (${p.lineK.toFixed(1)})}{2}$ ⟹ 넓이 △OAB = ${(0.5 * p.lineK * dx).toFixed(2)}`;
      }
      drawMathPoint(xA, yA, `A(${fmt(xA)}, ${fmt(yA)})`, '#34d399', 6.5);
      drawMathPoint(xB, yB, `B(${fmt(xB)}, ${fmt(yB)})`, '#38bdf8', 6.5);
      drawMathPoint(mx, mx, `M (k=${p.lineK.toFixed(1)})`, '#fbbf24', 8, true, (w) => { p.lineK = clamp(Math.round((w.x + w.y) * 4) / 4, 3.0, 7.5); });
    } else if (id === 'type5') {

      drawFunctionCurve((x) => Math.log2(x - p.logP) + p.logQ, '#38bdf8', 2.8, [], p.logP + 0.04, 10.5);
      const P1 = { x: p.expM, y: p.expN + 1 }, P2 = { x: p.logP + 1, y: p.logQ };
      const mid0 = { x: 0.5 * (P1.x + P2.x), y: 0.5 * (P1.y + P2.y) };
      const shiftC = mid0.y - mid0.x;
      if (st(1)) {
        drawMathLine(1, 0, 'rgba(148, 163, 184, 0.3)', [4, 4], 1.4);
        drawMathSegment(P1.x, P1.y, P2.x, P2.y, 'rgba(251, 113, 133, 0.7)', [4, 3], 2.0);
        drawMathPoint(P1.x, P1.y, `지수정점(${P1.x},${P1.y})`, '#34d399', 6);
        drawMathPoint(P2.x, P2.y, `로그정점(${P2.x},${P2.y})`, '#38bdf8', 6);
        drawMathPoint(mid0.x, mid0.y, `정점중점(${mid0.x.toFixed(1)},${mid0.y.toFixed(1)})`, '#fb7185', 6);
      }
      if (st(2)) {
        drawMathLine(1, shiftC, '#c084fc', [7, 4], 2.6);

      }
      drawMathLine(-1, p.lineK, '#fbbf24', [], 2.2);

      drawMathLine(1, 0, 'rgba(251, 191, 36, 0.65)', [6, 4], 2.0);

      drawMathPoint(p.k2 / 2, p.k2 / 2, `M₂(k₂=${p.k2.toFixed(1)})`, '#fbbf24', 8, true, (w) => { p.k2 = clamp(Math.round((w.x + w.y) * 4) / 4, Math.max(5.0, p.k1 + 0.5), 7.2); });
    } else if (id === 'type7') {
      const r = p.radiusR, a = p.baseA;
      drawMathCircle(0, 0, r, 'rgba(192, 132, 252, 0.7)', [], 2.6);
      drawFunctionCurve((x) => Math.pow(a, x), '#34d399', 2.8, [], -4, 4.0);
      drawFunctionCurve((x) => Math.log(x) / Math.log(a), '#38bdf8', 2.8, [], 0.03, 7.5);
      drawMathLine(1, 0, 'rgba(251, 191, 36, 0.55)', [6, 4], 1.8);
      const xP = solveExpCircle(a, r), yP = Math.pow(a, xP), xQ = yP, yQ = xP;
      if (st(2)) {
        drawMathSegment(xP, yP, xQ, yQ, '#fbbf24', [], 2.8);
        drawMathSegment(0, 0, xP, yP, 'rgba(192, 132, 252, 0.55)', [4, 3], 1.8);
        drawMathSegment(xP, yP, xP, 0, '#34d399', [4, 3], 1.8);
      }
      if (st(3)) badge(`원+역함수 결합: x₁² + y₁² = ${(r * r).toFixed(1)} & PQ = ${(Math.SQRT2 * (yP - xP)).toFixed(2)}`, '#fbbf24');
      drawMathPoint(xQ, yQ, `Q(${xQ.toFixed(2)}, ${yQ.toFixed(2)})`, '#38bdf8', 6.5);
      drawMathPoint(xP, yP, `P(${xP.toFixed(2)}, ${yP.toFixed(2)})`, '#fbbf24', 8, true, (w) => { p.radiusR = clamp(Math.round(Math.hypot(w.x, w.y) * 10) / 10, 2.2, 5.0); });
    } else if (id === 'type8') {
      const K = Math.round(p.maxX), fn = (x) => Math.log2(x);
      drawFunctionCurve(fn, '#34d399', 2.8, [], 0.2, 14.5);
      drawMathSegment(K, 0, K, fn(K) + 0.5, '#fbbf24', [5, 4], 2.2);
      let totalCnt = 0;
      for (let y = 1; Math.pow(2, y) <= K; y++) {
        const startX = Math.pow(2, y), rowCnt = K - startX + 1;
        totalCnt += rowCnt;
        if (st(3)) {
          drawMathSegment(startX, y, K, y, '#fb7185', [], 3.2);
          badge(`y=${y}층 (x≥${startX}): ${rowCnt}개`, '#fb7185');
        }
        if (st(1)) for (let x = startX; x <= K; x++) drawMathPoint(x, y, '', '#fbbf24', 5.0);
      }
      drawMathPoint(K, fn(K), `상한 K=${K} (총 ${totalCnt}개)`, '#fbbf24', 8, true, (w) => { p.maxX = clamp(Math.round(w.x), 4, 13); });
    }

    if (sink.lines.length) v.card = { title: '칠판 판서', lines: sink.lines.map((q) => ({ text: q.text, color: q.color })) };
    if (sink.tape) v.tape = { title: sink.tape };
  }

  const params = {};
  KILLER_MODES.forEach((mo) => {
    SLIDERS[mo.id].forEach((d) => {
      if (mo.id === 'type5' && d.key === 'logP') return; // [2.0 수정] p 는 m 을 따라 움직임
      params[mo.id + '_' + d.key] = {
        value: mo.scenarios[0].params[d.key], min: d.min, max: d.max, step: d.step, color: 'amber', label: d.label,
        hint: mo.id === 'type5' && d.key === 'expM' ? '로그 쪽 평행이동 p는 대칭이 성립하도록 m + n − q 로 함께 움직입니다' : undefined,
        format: (val) => (d.key === 'showLeftWing' ? (Math.round(val) === 1 ? '켬 (log₂x²)' : '끔 (2log₂x)') : d.step < 1 ? val.toFixed(2) : String(val))
      };
    });
  });

  const actions = () => [
    { id: 'twin', icon: 'spark', label: '쌍둥이 숫자 변형', run: (s, lab) => twin(s, lab) },
    { id: 'diag', icon: 'layers', label: (s) => (s.diag ? 'y = x 기준 대칭축 켜짐' : 'y = x 기준 대칭축'), on: (s) => s.diag, run: (s) => { s.diag = !s.diag; } },
    { id: 'abs', icon: 'wand', label: (s) => (s.abs ? '|f(x)| 절댓값 꺾기 켜짐' : '|f(x)| 절댓값 꺾기'), on: (s) => s.abs, run: (s) => { s.abs = !s.abs; } }
  ];
  // 지금 장면의 쌍둥이 변형: 원본 triggerTwinProblem 을 그대로 부르고 결과를 조절값에 되돌려 줍니다
  let current = null; // { mo, scen }
  function twin(s, lab) {
    const { mo, scen } = current;
    const p = {};
    Object.keys(scen.params).forEach((k) => { p[k] = s[mo.id + '_' + k]; });
    runTwin(mo.id, scen, p);
    Object.keys(p).forEach((k) => { s[mo.id + '_' + k] = p[k]; });
    s.step = Math.min(s.step, 2);
    APLab.toast('새로운 쌍둥이 숫자 변형 문제가 생성되었습니다');
  }

  const groups = KILLER_MODES.map((mo, mi) => ({
    id: mo.id,
    title: rich(mo.shortTitle),
    short: SHORT[mi],
    scenes: mo.scenarios.map((scen, si) => ({
      id: mo.id + '-' + si,
      title: rich(scen.chip),
      short: scen.chip.split(' (')[0],
      question: Q[mi],
      guide: GUIDE[mi],
      controls: SLIDERS[mo.id].filter((d) => params[mo.id + '_' + d.key]).map((d) => mo.id + '_' + d.key),
      actions,
      steps: mo.stepLabels.map((l, k) => `Step ${k + 1} · ${rich(l)}`),
      startStep: 2,
      notesTitle: '오답 함정 주의보',
      focus: () => FOCUS[mi],
      enter: (s) => {
        current = { mo, scen };
        Object.keys(scen.params).forEach((k) => { s[mo.id + '_' + k] = scen.params[k]; });
      },
      problem: {
        tag: scen.source,
        text: () => rich(scen.problem),
        answer: () => '풀이와 결과는 정리 탭의 「두 가지 풀이 비교」에서 확인하세요.',
        snap: () => { const o = {}; Object.keys(scen.snapParams).forEach((k) => { o[mo.id + '_' + k] = scen.snapParams[k]; }); return o; }
      },
      solution: {
        standardTitle: rich(scen.textbookTitle), standardTag: '정석 3분',
        quickTitle: rich(scen.secretTitle), quickTag: '10초 컷',
        standard: () => ({ steps: scen.textbookSteps.map((x) => `<div>${rich(x)}</div>`).join('') }),
        quick: () => ({ steps: scen.secretSteps.map((x) => `<div>${rich(x)}</div>`).join('') })
      },
      view: (s) => {
        current = { mo, scen };
        const p = pv(s, mo);
        if (mo.id === 'type5') tie(p);
        const h = hudOf(mo.id, p);
        return {
          chips: [{ k: mo.code, html: rich(h.eq) }],
          readouts: h.cards.map((c) => ({ label: rich(c.title), value: String(c.val), note: rich(c.sub), color: 'amber' })),
          formula: s.step >= 1 ? rich(mo.stepDescs[Math.min(s.step, 3) - 1]) : '',
          notes: rich(mo.trapWarning)
        };
      },
      draw: (b, s, v) => draw(mo, b, s, v)
    }))
  }));

  APLab.createLab({
    id: 'alg-log-deep',
    title: '로그함수·역함수 도형 심화',
    courseName: '대수',
    unit: '지수함수와 로그함수 · 로그 도형 8대 유형',
    courseColor: 'var(--m-sky)',
    home: '../index.html#algebra',
    legacy: '../../labs/대수/part1b1.html',
    board: { kind: 'cartesian', focus: FOCUS[0] },
    params,
    state: { diag: false, abs: false },
    groups
  });
});
</script>
