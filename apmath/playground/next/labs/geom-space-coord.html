② 따라서 내분하는 비는 <strong class="text-amber-300">z좌표의 절댓값의 비 ${tex('|z_1| : |z_2| = 4 : 2 = 2 : 1')}</strong>이다.<br/>
③ ${tex('2 : 1')} 내분 공식으로 <strong class="text-emerald-300">${tex('x = \\dfrac{8 - 2}{3} = 2, \\; y = \\dfrac{-10 + 1}{3} = -3 \\implies P(2, -3, 0)')}</strong>이다.`,

          steps: `① 중심거리 <strong class="text-sky-300">${tex('d = \\overline{CP} = \\sqrt{4^2 + 3^2} = 5')}</strong>, 구 반지름 <strong class="text-pink-300">${tex('R = 3')}</strong>이다.<br/>
② 직선 PC 위에서 <strong class="text-emerald-300">최대 ${tex('M = d + R = 8')}</strong>, <strong class="text-rose-300">최소 ${tex('m = d - R = 2')}</strong> (1초 컷!)<br/>
③ 접점 ${tex('T')}에서는 ${tex('\\angle CTP = 90^\\circ')}이고 ${tex('CT = 3, \\; CP = 5')}이므로 <strong class="text-amber-300">${tex('3 : 4 : 5')} 직각삼각형 ${tex('\\triangle CTP')}</strong>가 되어 접선의 길이는 <strong class="text-amber-300">${tex('l = \\sqrt{5^2 - 3^2} = 4')}</strong>이다.<br/>
&nbsp;&nbsp;(참고: 접점들이 이루는 원의 반지름은 직각삼각형 CTP의 넓이로 구한 ${tex("r' = \\dfrac{R \\times l}{d} = \\dfrac{12}{5}")}이다.)`,
          highlight: "구 밖의 점 P (구의 중심까지의 거리 d, 구의 반지름 R): ① 구 위의 점까지 거리의 최댓값·최솟값은 d ± R ② 접선의 길이는 l = √(d² - R²) ③ 접점들이 이루는 원의 반지름은 (R × l) / d"
        })
      }
    };

  /* ===== 호환층: 원본 draw3D… 이름·인자 → 3D 무대 도우미 =====
     원본 좌표는 z가 위쪽인 수학 좌표입니다. 무대 도우미는 y가 위쪽이라 w()로 (x, y, z) → (x, z, −y) 로 바꿉니다
     (원본 project3D의 vx = x, vy = z, vz = −y 와 같은 규칙). */
  let SP = null, BRD = null, PROB = false; // PROB: 문제 탭 그림(풀이 단계·답을 그리지 않고 문제에 주어진 값만)
  const R2D = 180 / Math.PI;
  const w = (p) => ({ x: p.x, y: p.z, z: -p.y });
  /* 원본 inPart와 같은 규칙: 선택한 조각 밖은 흐리게, '작도' 렌즈에서는 3단계(결론) 조각을 흐리게 */
  function inPart(partIdx, callback) {
    const focused = state.partIdx;
    const faint = focused !== null && focused !== partIdx;
    const c = BRD.ctx;
    c.save();
    if (faint) c.globalAlpha *= state.lens === 'focus' ? .1 : .22;
    else if (state.lens === 'construction' && partIdx === 2) c.globalAlpha *= .32;
    callback();
    c.restore();
  }
  function draw3DLine(p1, p2, color = '#ffffff', width = 2.2, dashed = false, glow = false) {
    SP.line(w(p1), w(p2), { color, width, dash: dashed ? [6, 6] : null, glow });
  }
  function draw3DPolygon(pts, fillColor = 'rgba(52, 211, 153, 0.14)', strokeColor = null, lineWidth = 2.0, dashed = false) {
    if (pts.length < 3) return;
    SP.poly(pts.map(w), { fill: fillColor, color: strokeColor || null, stroke: !!strokeColor, width: lineWidth, dash: dashed ? [5, 5] : null });
  }
  /* 점 라벨: 원본처럼 겹치지 않는 자리를 찾아 놓습니다(원본 drawPointLabels의 후보 위치와 같음).
     맞춤 계산 중에는 글자 상자만 기록하고, 실제로 그릴 때는 큐에 모았다가 flushLabels()가 놓습니다. */
  let LQ = [];
  let OBST = false;       // true: 라벨이 다른 점의 마커도 피합니다(장면 5~8). 장면 1~4는 예전 배치 그대로
  function draw3DPoint(pt, radius = 5.5, color = '#fbbf24', label = '', offset = { x: 10, y: -10 }, extra = {}) {
    if (PROB && extra.answer) return; // 답·중간값이 되는 점은 문제 탭에서 그리지 않습니다
    if (PROB && extra.problemLabel !== undefined) label = extra.problemLabel; // 값이 든 이름표는 이름만 남깁니다
    const show = label && state.lens !== 'construction';
    if (BRD._bbox) { SP.point(w(pt), { r: radius, color, label: show ? label : '', dx: offset.x, dy: offset.y, align: 'left', baseline: 'alphabetic' }); return; }
    SP.point(w(pt), { r: radius, color });
    if (show) { const s = BRD.toS(SP.P(w(pt))); LQ.push({ x: s.x, y: s.y, label, color, dx: offset.x, dy: offset.y, alpha: BRD.ctx.globalAlpha, pt: true }); }
  }
  function flushLabels() {
    const c = BRD.ctx, ins = BRD.insets, placed = [];
    const right = BRD.W - ins.right - 6, top = ins.top + 4, bottom = BRD.H - ins.bottom - 4, size = 12.5 * BRD.fs;
    const hit = (a, b) => a.l < b.r + 3 && a.r > b.l - 3 && a.t < b.b + 3 && a.b > b.t - 3;
    const dots = (OBST ? LQ.filter((i) => i.pt) : []).map((i) => ({ it: i, l: i.x - 9, r: i.x + 9, t: i.y - 9, b: i.y + 9 })); // 다른 점의 표시(점 마커)도 라벨이 피합니다
    c.save();
    c.font = `800 ${size}px ${BRD.font}`;
    for (const it of LQ.filter((i) => !i.low).concat(LQ.filter((i) => i.low))) { // 축 이름(low)은 점 라벨 다음에 놓습니다
      const wd = c.measureText(it.label).width + 6, h = size + 4;
      const cands = [[it.dx, it.dy], [13, -20], [-wd - 12, -12], [12, 25], [-wd - 12, 25], [23, 1], [-wd - 15, 1], [0, -33], [0, 39]];
      let best = null, bc = Infinity;
      for (const [dx, dy] of cands) {
        const x = clamp(it.x + dx, 6, Math.max(6, right - wd)), y = clamp(it.y + dy, top + h, bottom);
        const box = { l: x, r: x + wd, t: y - h + 2, b: y + 3 };
        const cost = placed.reduce((s, p) => s + (hit(box, p) ? 3000 : 0), 0) + dots.reduce((s, p) => s + (p.it !== it && hit(box, p) ? 1500 : 0), 0) + Math.hypot(x - it.x, y - it.y) * 0.4;
        if (cost < bc) { bc = cost; best = { x, y, box }; }
        if (cost < 60) break;
      }
      placed.push(best.box);
      c.save();
      c.globalAlpha = it.alpha;
      BRD.stext(best.x, best.y, it.label, { color: it.color, size: 12.5, weight: 800, align: 'left', baseline: 'alphabetic' });
      c.restore();
    }
    c.restore();
    LQ = [];
  }
  /* 직각 표시: 원본처럼 3D 안에서 두 방향으로 그린 ㄱ자 */
  function draw3DRightAngle(originPt, ptA, ptB, sizeMath = 0.42, color = '#fbbf24') {
    const vA = { x: ptA.x - originPt.x, y: ptA.y - originPt.y, z: ptA.z - originPt.z };
    const lenA = Math.hypot(vA.x, vA.y, vA.z);
    const vB = { x: ptB.x - originPt.x, y: ptB.y - originPt.y, z: ptB.z - originPt.z };
    const lenB = Math.hypot(vB.x, vB.y, vB.z);
    if (lenA < 0.01 || lenB < 0.01) return;
    const uA = { x: (vA.x / lenA) * sizeMath, y: (vA.y / lenA) * sizeMath, z: (vA.z / lenA) * sizeMath };
    const uB = { x: (vB.x / lenB) * sizeMath, y: (vB.y / lenB) * sizeMath, z: (vB.z / lenB) * sizeMath };
    const at = (a, b) => SP.P(w({ x: originPt.x + a.x + b.x, y: originPt.y + a.y + b.y, z: originPt.z + a.z + b.z }));
    const O0 = { x: 0, y: 0, z: 0 };
    BRD.path([at(uA, O0), at(uA, uB), at(O0, uB)], { color, width: 1.8 });
  }
  /* [표시 보강] 3D 각의 호 + 각도 값: 실제 공간각을 따라 그리고(SP.arc), 값은 호 바깥 각의 안쪽 방향에 씁니다. */
  function draw3DAngleArc(originPt, ptA, ptB, radius = 0.8, color = '#fde047', label = '') {
    SP.arc(w(originPt), w(ptA), w(ptB), radius, { color, label });
  }
  /* [표시 보강] 같은 길이 눈금(3D 선분 p–q의 가운데에 같은 개수의 짧은 선) */
  function draw3DTicks(p, q, count = 1, color = '#fde047') {
    SP.ticks ? SP.ticks(w(p), w(q), { count, color }) : BRD.ticks(SP.P(w(p)), SP.P(w(q)), { count, color });
  }
  /* 구: 대원 3개(점선) + 시선에 수직인 외곽 원(직교 투영에서는 반지름 R인 원) */
  function draw3DSphereWireframe(center, R, color = 'rgba(56, 189, 248, 0.35)') {
    const N = 44;
    const eqPts = [], xzPts = [], yzPts = [];
    for (let i = 0; i < N; i++) {
      const phi = (i / N) * Math.PI * 2;
      const c = Math.cos(phi), s = Math.sin(phi);
      eqPts.push({ x: center.x + R * c, y: center.y + R * s, z: center.z });
      xzPts.push({ x: center.x + R * c, y: center.y, z: center.z + R * s });
      yzPts.push({ x: center.x, y: center.y + R * c, z: center.z + R * s });
    }
    draw3DPolygon(eqPts, null, color, 1.5, true);
    draw3DPolygon(xzPts, null, color, 1.5, true);
    draw3DPolygon(yzPts, null, color, 1.5, true);
    BRD.circle(SP.P(w(center)), R, { fill: 'rgba(56, 189, 248, 0.07)', color: 'rgba(56, 189, 248, 0.8)', width: 2.4, glow: true });
  }
  /* 원본의 캔버스 분수 → KaTeX 라벨 */
  function drawFormulaFractionNear(pt, num, den) {
    const t = (v) => String(v).replace(/×/g, '\\times ').replace(/[−–]/g, '-');
    BRD.math('frac', SP.P(w(pt)), `\\dfrac{${t(num)}}{${t(den)}}`, { color: 'amber', dx: 30, dy: 24, box: true });
  }

  /* ===== 원본 그대로: 보조 원 그리기 (원본 930–939행) ===== */
    function draw3DCircle(center,radius,u,v,color='#fbbf24',fill='rgba(251,191,36,.12)',width=2) {
      const N=96,pts=[];
      for(let i=0;i<N;i++){
        const t=2*Math.PI*i/N;
        pts.push({x:center.x+radius*(u.x*Math.cos(t)+v.x*Math.sin(t)),
                  y:center.y+radius*(u.y*Math.cos(t)+v.y*Math.sin(t)),
                  z:center.z+radius*(u.z*Math.cos(t)+v.z*Math.sin(t))});
      }
      draw3DPolygon(pts,fill,color,width);
    }

  /* ===== 원본 그대로: 좌표 직육면체 (원본 940–954행, 한 줄만 [2.0 수정]) ===== */
    function drawCoordinateBox(A) {
      const x=A.x,y=A.y,z=A.z;
      const vertices=[];
      for(const ix of [0,x])for(const iy of [0,y])for(const iz of [0,z]) vertices.push({x:ix,y:iy,z:iz});
      for(let i=0;i<8;i++)for(let j=i+1;j<8;j++){
        const n=(vertices[i].x!==vertices[j].x)+(vertices[i].y!==vertices[j].y)+(vertices[i].z!==vertices[j].z);
        if(n===1)draw3DLine(vertices[i],vertices[j],'rgba(125,211,252,.70)',1.8,true);
      }
      // [2.0 수정] 원본의 draw3DPoint({x,y:0},…,'xy 수선의 발')은 z가 없어 좌표가 NaN이라 아무것도 그려지지 않았습니다.
      // 같은 점은 1단계의 A₀(1,1,0) 라벨로 이미 그려지므로 호출을 뺐습니다.
      // [2.0 가시성 수정] 라벨 7개가 한 곳에 겹쳐 읽을 수 없었습니다. 점은 모두 찍되 이름표는 칩으로 고른 한 종류(좌표평면 위 / 좌표축 위)만 짧게 답니다.
      const showAxis = (state.feet1 | 0) === 1, ft = (n) => (showAxis ? n : '');
      draw3DPoint({x, y:0,z:0},3.4,'#7dd3fc',ft(`(${x}, 0, 0)`),{x:8,y:16});
      draw3DPoint({x:0,y,z:0},3.4,'#7dd3fc',ft(`(0, ${y}, 0)`),{x:-62,y:14});
      draw3DPoint({x:0,y:0,z},3.4,'#7dd3fc',ft(`(0, 0, ${z})`),{x:-62,y:-8});
      draw3DPoint({x,y:0,z},3.4,'#86efac',showAxis ? '' : `(${x}, 0, ${z})`,{x:8,y:16});
      draw3DPoint({x:0,y,z},3.4,'#86efac',showAxis ? '' : `(0, ${y}, ${z})`,{x:-62,y:-8});
    }

  /* ===== 원본 그대로: 모드별 장면 그리기 (원본 1079–1317행) ===== */
    // =========================================================================
    // [모드 1 렌더링] 공간좌표 수선의 발 & xy평면 대칭이동 최단거리 (AB' = 7)
    // =========================================================================
    function renderMode1(rect) {
      const A = { x: 1, y: 1, z: 2 };
      const B = { x: 3, y: 4, z: 4 };
      const Bp = { x: 3, y: 4, z: -4 }; // xy평면 대칭점 B'(3, 4, -4)

      const A0 = { x: A.x, y: A.y, z: 0 };
      const B0 = { x: B.x, y: B.y, z: 0 };

      const t = state.t12;
      const P = {
        x: A0.x + t * (B0.x - A0.x),
        y: A0.y + t * (B0.y - A0.y),
        z: 0
      };

      // Step 1: 두 점 A, B에서 xy평면에 내린 수선의 발 A0, B0 및 정사영 선분
      if (state.steps[1]) inPart(0,()=>{
        drawCoordinateBox(A);
        draw3DLine(A, A0, 'rgba(56, 189, 248, 0.7)', 2.2, true);
        draw3DLine(B, B0, 'rgba(244, 114, 182, 0.7)', 2.2, true);
        draw3DLine(A0, B0, 'rgba(255, 255, 255, 0.45)', 2.0, true);

        // [표시 보강] 수선의 발: AA₀ ⊥ xy평면, BB₀ ⊥ xy평면 — 평면 위 선분 A₀B₀와 이루는 직각을 표시
        draw3DRightAngle(A0, A, B0, 0.3, '#38bdf8');
        draw3DRightAngle(B0, B, A0, 0.3, '#f472b6');
        draw3DPoint(A0, 4.5, '#38bdf8', (state.feet1 | 0) === 1 ? '' : 'A₀(1,1,0)', { x: -65, y: 16 });
        draw3DPoint(B0, 4.5, '#f472b6', 'B₀(3,4,0)', { x: 10, y: 16 });
      });

      // Step 3: 점 B의 xy평면 대칭점 B'(3, 4, -4) 및 일직선 최단거리 AB'
      if (state.steps[3]) inPart(2,()=>{
        draw3DLine(B0, Bp, 'rgba(244, 114, 182, 0.6)', 2.2, true);
        draw3DLine(P, Bp, '#f472b6', 2.4, true);
        // [표시 보강] 대칭: BB₀ = B₀B′ (같은 길이 눈금)과 B₀에서의 직각(BB′ ⊥ xy평면)
        draw3DTicks(B, B0, 2, '#fde047');
        draw3DTicks(B0, Bp, 2, '#fde047');
        draw3DLine(A, Bp, '#fbbf24', 3.4, false, true); // 일직선 최단 경로 AB'
        draw3DPoint(Bp, 6.5, '#f43f5e', "대칭점 B'(3, 4, -4)", { x: 12, y: 14 });

        const mathPx = 1 + t * 2;
        const mathPy = 1 + t * 3;
        const curDist = Math.hypot(mathPx - 1, mathPy - 1, 2) + Math.hypot(3 - mathPx, 4 - mathPy, 4);

      // Step 2: xy평면 위의 경유점 P 및 실제 꺾인 경로 AP + PB
      inPart(1,()=>{ // 주어진 경로 AP + PB는 보조선 0단계에도 보입니다.
        draw3DLine(A, P, '#34d399', 3.4, false, true);
        draw3DLine(P, B, '#34d399', 3.4, false, true);
        draw3DPoint(P, 7.5, '#fbbf24', PROB || !state.steps[3] ? 'P' : t === 1 / 3 ? '' : `P (t≈${t.toFixed(2)})`, PROB ? { x: 11, y: 14 } : { x: -95, y: -12 }, { problemLabel: 'P' }); // 문제 그림은 짧은 이름 P라 점 바로 옆에
      });

      draw3DPoint(A, 7, '#38bdf8', 'A(1, 1, 2)', { x: -75, y: -12 });
      draw3DPoint(B, 7, '#f472b6', 'B(3, 4, 4)', { x: 12, y: -10 });
    }

    // =========================================================================
    // [모드 2 렌더링] 기출 1 - 선분 AB가 xy평면과 만나는 교점 & 내분비 (|z1| : |z2|)
    // =========================================================================
    function renderMode2(rect) {
      const A = { x: -2, y: 1, z: 4 };
      const B = { x: 4, y: -5, z: -2 };
      const A0 = { x: A.x, y: A.y, z: 0 };
      const B0 = { x: B.x, y: B.y, z: 0 };

      const t = state.t12;
      const P = {
        x: A.x + t * (B.x - A.x),
        y: A.y + t * (B.y - A.y),
        z: A.z + t * (B.z - A.z)
      };

      // 실제 xy평면 교점 P_hit (t = 2/3)
      const Phit = {
        x: A.x + (2 / 3) * (B.x - A.x),
        y: A.y + (2 / 3) * (B.y - A.y),
        z: 0
      };

      // Step 2: 수선의 발 A0, B0 및 닮음인 두 직각삼각형 ΔAA0P_hit ∽ ΔBB0P_hit
      if (state.steps[2]) inPart(1,()=>{
        draw3DPolygon([A, A0, Phit], 'rgba(56, 189, 248, 0.22)');
        draw3DPolygon([B, B0, Phit], 'rgba(244, 114, 182, 0.22)');

      });

        draw3DLine(A, B, '#e2e8f0', 3.2, false, true);
      });

      // Step 3: xy평면 관통 교점 P(2, -3, 0) 강조 및 하단 세로 분수 배너
      inPart(2,()=>{ // 교점은 처음부터 이름만, 좌표와 비는 마지막 단계에서 공개합니다.
        draw3DPoint(Phit, 7, '#34d399', state.steps[3] ? 'P(2, −3, 0)' : 'P', { x: 14, y: -12 }, { problemLabel: 'P' });

      if (t !== 2 / 3) {
        draw3DPoint(P, 6.5, '#fbbf24', `탐구점 X (t≈${t.toFixed(2)})`, { x: 10, y: -10 }, { answer: true });

    // =========================================================================
    // [모드 3 렌더링] 기출 2 - 구와 평면의 교선원 반지름 공식 (r = √(R² - d²))
    // =========================================================================
    function renderMode3(rect) {
      // 모든 렌더 좌표는 모눈과 동일한 수학 단위 (축소계수 금지).
      const mathR = 5.0;
      const mathD = state.d3;
      const mathR_sec = Math.sqrt(Math.max(0, mathR * mathR - mathD * mathD));

      const R = mathR;
      const d = mathD;
      const rSec = mathR_sec;

      const C = { x: 0, y: 0, z: d }; // 구의 중심 C(0, 0, d)
      const H = { x: 0, y: 0, z: 0 }; // xy평면 수선의 발 H(0, 0, 0)
      const P = { x: rSec, y: 0, z: 0 }; // 교선원 위의 대표점 P

      // Step 1: 3D 구 와이어프레임 및 중심 C
      inPart(0,()=>{ draw3DSphereWireframe(C, R); });

      // Step 2: xy평면과 만나서 생기는 교선원(Section Circle) 렌더링
      if (state.steps[2] && rSec > 0) inPart(1,()=>{
        const N = 48;
        const secPts = [];
        for (let i = 0; i < N; i++) {
          const phi = (i / N) * Math.PI * 2;
          secPts.push({ x: rSec * Math.cos(phi), y: rSec * Math.sin(phi), z: 0 });
        }
        draw3DPolygon(secPts, 'rgba(251, 191, 36, 0.25)', '#fbbf24', 3.2);
      });

      // Step 3: 피타고라스 직각삼각형 ΔCHP (빗변 R = 5, 높이 d, 밑변 r)
      if (state.steps[3] && mathD <= mathR) inPart(2,()=>{
        if (mathD < mathR) draw3DPolygon([C, H, P], 'rgba(244, 114, 182, 0.24)');
        draw3DLine(C, H, '#f472b6', 3.6, false, true); // 거리 d
        if (mathD < mathR) draw3DLine(H, P, '#fbbf24', 3.6, false, true); // 교선원 반지름 r
        if (mathD <= mathR) draw3DLine(C, P, '#38bdf8', 3.6, false, true); // 교선원 위 점까지의 구 반지름 R = 5

        if (d > 0.15 && rSec > 0.15) {
          draw3DRightAngle(H, C, P, 0.38, '#fbbf24');
        }

      });



      draw3DPoint(C, 6.5, '#f472b6', d === 0 && state.steps[2] ? 'C = H (0,0,0)' : `C(0,0,${String(mathD)})`, { x: 12, y: -10 });
      if (state.steps[2] && !PROB) {
        if (d > 0) draw3DPoint(H, 5.5, '#34d399', d === R ? '접점 H' : 'H(0,0,0)', { x: -80, y: 18 });
        if (d < R) draw3DPoint(P, 6.5, '#fbbf24', state.steps[3] ? `P (r≈${mathR_sec.toFixed(3)})` : 'P', { x: 12, y: 16 });
      }
    }

    // =========================================================================
    // [모드 4 렌더링] 기출 3 - 구 밖의 점 P에서 최대·최소(d±R) 및 접선장 l = √(d²-R²)
    // =========================================================================
    function renderMode4(rect) {
      // 수학적 구 중심 C(0,0,0), 반지름 R = 3, 외부 점 P(4, 0, 3) -> 중심거리 d = 5, 접선장 l = 4
      const C = { x: 0, y: 0, z: 0 };
      const R = 3;
      const P = { x: 4, y: 0, z: 3 };

      const angCP = Math.atan2(3.0, 4.0); // xz평면 위 CP의 각도
      const ux = Math.cos(angCP);
      const uz = Math.sin(angCP);

      // 최댓값 점 Q_max(d+R = 8) 및 최솟값 점 Q_min(d-R = 2)
      const Qmax = { x: -R * ux, y: 0, z: -R * uz };
      const Qmin = { x: R * ux, y: 0, z: R * uz };

      // 접점 T (∠CTP = 90°, cos(∠TCP) = R/d = 3/5)
      const alpha = Math.acos(3 / 5);
      const angT = angCP + alpha;
      const T = { x: R * Math.cos(angT), y: 0, z: R * Math.sin(angT) };

      // 동점 Q
      const phi = angCP + state.theta4;
      const Q = { x: R * Math.cos(phi), y: 0, z: R * Math.sin(phi) };

      const theta=state.theta4;
      const pq=Math.sqrt(34-30*Math.cos(theta));
      // Step 1: 구 와이어프레임 및 중심 C, 외부 점 P
      inPart(0,()=>{ draw3DSphereWireframe(C, R); });

      // Step 2: 중심 관통선 및 최대(Q_max, 8), 최소(Q_min, 2) 표시
      if (state.steps[2] && (!lscContext || lscContext.lscExtreme !== 'none')) inPart(1,()=>{
        draw3DLine(lscContext?.lscExtreme === 'min' ? C : Qmax, P, 'rgba(52, 211, 153, 0.75)', 2.4, true);
        if (!lscContext || ['both','max'].includes(lscContext.lscExtreme)) draw3DPoint(Qmax, 6, '#34d399', sameAngle(theta, Math.PI) ? 'Q = Qmax' : 'Qmax', { x: -135, y: 18 });
        if (!lscContext || ['both','min'].includes(lscContext.lscExtreme)) draw3DPoint(Qmin, 6, '#f43f5e', (sameAngle(theta, 0) || sameAngle(theta, 2 * Math.PI)) ? 'Q = Qmin' : 'Qmin', { x: 12, y: 16 });
      });

      // Step 3: 접선 PT (길이 l = 4) 및 직각삼각형 ΔCTP (∠CTP = 90°)
      if (state.steps[3] && (!lscContext || lscContext.lscTangent)) inPart(2,()=>{
        // CP의 단위벡터 n, 접점 원 중심 = (R²/d)n; 반지름 R*l/d = 12/5.
        const n={x:4/5,y:0,z:3/5};
        const circleCenter={x:(R*R/5)*n.x,y:0,z:(R*R/5)*n.z};
        const basisU={x:-3/5,y:0,z:4/5},basisV={x:0,y:1,z:0};
        draw3DCircle(circleCenter,12/5,basisU,basisV,'#fbbf24','rgba(251,191,36,.17)',2.8);
        const Tp={x:R*Math.cos(angCP-alpha),y:0,z:R*Math.sin(angCP-alpha)};
        draw3DLine(P,Tp,'rgba(251,191,36,.7)',2,true);
        draw3DPoint(Tp,5,'#fde68a',sameAngle(theta, 2 * Math.PI - alpha) ? 'Q = T′' : 'T′',{x:12,y:14});
        draw3DPolygon([C, T, P], 'rgba(251, 191, 36, 0.22)');
        draw3DLine(C, T, '#f472b6', 3.2, false, true); // 반지름 R = 3
        draw3DLine(P, T, '#fbbf24', 3.6, false, true); // 접선 l = 4
        draw3DLine(C, P, '#38bdf8', 2.8);              // 중심거리 d = 5
        draw3DRightAngle(T, C, P, 0.36, '#fbbf24');
        // [표시 보강] 접점 원 반지름 공식 R·l/d 에 쓰이는 ∠TCP(cos = R/d = 3/5)를 C에서 호와 값으로 표시
        draw3DAngleArc(C, T, P, 0.9, '#fde047', `${(Math.acos(3 / 5) * R2D).toFixed(1)}°`);

        draw3DPoint(T, 6.5, '#fbbf24', sameAngle(theta, alpha) ? 'Q = T' : 'T', { x: -65, y: -14 });

        if(state.lens==='measure')drawFormulaFractionNear(circleCenter,'12','5');
        if (lscContext?.lscTarget === '접점의원') {
          draw3DLine(C, circleCenter, '#38bdf8', 2.4, true);
          draw3DLine(circleCenter, T, '#34d399', 3.2);
          draw3DPoint(circleCenter, 5, '#34d399', 'H');
          draw3DRightAngle(circleCenter, C, T, .24, '#34d399');
        }
      });



      if (lscContext?.lscTarget === '각도와거리' && lscContext.step >= 1) {
        draw3DLine(C, P, '#38bdf8', 2.5);
        draw3DLine(C, Q, '#f472b6', 2.5);
        draw3DAngleArc(C, P, Q, .8, '#fde047', 'θ');
      }
      // 동점 Q 표시
      draw3DLine(P, Q, 'rgba(255,255,255,0.45)', 1.6, true);
      const namedQ = state.steps[2] && ((!lscContext || ['both','min'].includes(lscContext.lscExtreme)) && (sameAngle(theta, 0) || sameAngle(theta, 2 * Math.PI)) || (!lscContext || ['both','max'].includes(lscContext.lscExtreme)) && sameAngle(theta, Math.PI))
        || state.steps[3] && (!lscContext || lscContext.lscTangent) && (sameAngle(theta, alpha) || sameAngle(theta, 2 * Math.PI - alpha));
      if (!namedQ) draw3DPoint(Q, 5.5, '#e2e8f0', state.steps[3] ? `Q (PQ≈${pq.toFixed(2)})` : 'Q', { x: -18, y: -10 }, { problemLabel: 'Q' });
      draw3DPoint(C, 6, '#38bdf8', '중심 C(0,0,0)', { x: -45, y: 22 });
      draw3DPoint(P, 7.5, '#fbbf24', '외부 점 P(4, 0, 3)', { x: 12, y: -10 });
    }

  /* ===== 원본 그대로: 하단 띠 데이터 (원본 1410–1430행) ===== */
    function makeTapeData(){
      if(state.mode===1){
        const t=state.t12,x=1+2*t,y=1+3*t;
        const a=Math.hypot(x-1,y-1,2),b=Math.hypot(x-3,y-4,4);
        return {caption:`AP + PB ≈ ${(a+b).toFixed(2)} ≥ AB′ = 7 · 최단 P=(5/3,2,0)`,blocks:[{label:`AP ≈ ${a.toFixed(2)}`,value:a,color:'#34d399'},{label:`PB ≈ ${b.toFixed(2)}`,value:b,color:'#38bdf8'}],fraction:['5','3']};
      }
      if(state.mode===2){
        const t=state.t12;
        return {caption:`xy평면 교점 P(2,-3,0) · 내분비 4:2=2:1 · 현재 t≈${t.toFixed(2)}, z≈${(4-6*t).toFixed(2)}`,blocks:[{label:'AP · 2',value:2,color:'#38bdf8'},{label:'PB · 1',value:1,color:'#f472b6'}],fraction:['2×4−2','3']};
      }
      if(state.mode===3){
        const R=5,d=state.d3;
        if(d>R)return {caption:'d > R, 교점 없음',blocks:[]};
        if(d===R)return {caption:'d = R, 평면과 한 점에서 접함 (원형 단면 없음)',blocks:[{label:'d = R = 5',value:R,color:'#f472b6'}]};
        const r=Math.sqrt(R*R-d*d),exact=Math.abs(d-Math.round(d))<1e-9&&Math.abs(r-Math.round(r))<1e-9;
        const marker=exact?'=':'≈';
        return {caption:`R² = d² + r² · 25 ${marker} ${d.toFixed(1)}² + ${r.toFixed(2)}²  |  넓이 ${marker} ${(r*r).toFixed(2)}π`,blocks:[{label:`d ${d.toFixed(1)}`,value:d,color:'#f472b6'},{label:`r ${marker} ${r.toFixed(2)}`,value:r,color:'#fbbf24'}]};
      }
      const pq=Math.sqrt(34-30*Math.cos(state.theta4));
      return {caption:`현재 PQ ≈ ${pq.toFixed(2)}  ·  최소 2 / 최대 8  ·  접선 PT=4  ·  접점들이 이루는 원 r′=12/5`,blocks:[{label:`PQ ≈ ${pq.toFixed(2)}`,value:pq,color:'#38bdf8'},{label:'PT 4',value:4,color:'#fbbf24'}],fraction:['12','5']};
    }

  /* ======================================================================
     2.0 셸 연결 (새로 작성한 부분)
     ====================================================================== */
  /* 좌표축·xy평면(원본 draw3DAxesAndXYPlane과 같은 그림). ext: 장면 크기에 맞춘 축 이름 위치 */
  function draw3DAxesAndXYPlane(showGrid, ext) {
    // xy평면과 축은 장면의 점·구가 놓이는 범위(ext)까지만 그립니다. 네 모서리와 축 끝은 모두 맞춤 범위에 들어가 무대에서 잘리지 않습니다.
    const rx = Math.floor(ext.x), ry = Math.floor(ext.y);
    draw3DPolygon([{ x: -rx, y: -ry, z: 0 }, { x: rx, y: -ry, z: 0 }, { x: rx, y: ry, z: 0 }, { x: -rx, y: ry, z: 0 }], 'rgba(16, 185, 129, 0.06)', 'rgba(52, 211, 153, 0.28)', 1.2);
    if (showGrid) {
      for (let i = -rx; i <= rx; i++) draw3DLine({ x: i, y: -ry, z: 0 }, { x: i, y: ry, z: 0 }, 'rgba(16, 185, 129, 0.09)', 1);
      for (let i = -ry; i <= ry; i++) draw3DLine({ x: -rx, y: i, z: 0 }, { x: rx, y: i, z: 0 }, 'rgba(16, 185, 129, 0.09)', 1);
    }
    // X축(붉은 분필), Y축(초록 분필), Z축(하늘색 분필 - 위쪽 높이!)
    draw3DLine({ x: -rx, y: 0, z: 0 }, { x: ext.x + 0.6, y: 0, z: 0 }, 'rgba(248, 113, 113, 0.65)', 2.0);
    draw3DLine({ x: 0, y: -ry, z: 0 }, { x: 0, y: ext.y + 0.6, z: 0 }, 'rgba(52, 211, 153, 0.65)', 2.0);
    draw3DLine({ x: 0, y: 0, z: -ext.zn }, { x: 0, y: 0, z: ext.z + 0.4 }, 'rgba(56, 189, 248, 0.75)', 2.2);
    const tag = (p, str, color) => {
      if (BRD._bbox) { SP.text(w(p), str, { color, size: 12.5, weight: 800, align: 'left', baseline: 'alphabetic', dx: 5, dy: -5 }); return; }
      const s = BRD.toS(SP.P(w(p)));
      LQ.push({ x: s.x, y: s.y, label: str, color, dx: 5, dy: -5, alpha: 1, low: true });
    };
    tag({ x: ext.x, y: 0, z: 0 }, 'x축', '#fca5a5');
    tag({ x: 0, y: ext.y, z: 0 }, 'y축', '#6ee7b7');
    tag({ x: 0, y: 0, z: ext.z }, 'z축(높이)', '#7dd3fc');
  }

  /* 모드별 ‘화면에 꼭 들어와야 할 점’(원본 renderMode의 좌표와 같음)과 구 */
  const KEY = (m) => {
    const O = { x: 0, y: 0, z: 0 };
    if (m === 1) return { pts: [{ x: 1, y: 1, z: 2 }, { x: 3, y: 4, z: 4 }, { x: 3, y: 4, z: -4 }, { x: 1, y: 1, z: 0 }, { x: 3, y: 4, z: 0 }] };
    if (m === 2) return { pts: [{ x: -2, y: 1, z: 4 }, { x: 4, y: -5, z: -2 }, { x: -2, y: 1, z: 0 }, { x: 4, y: -5, z: 0 }, { x: 2, y: -3, z: 0 }] };
    if (m === 3) return { pts: [{ x: 0, y: 0, z: state.d3 }, O], sphere: { c: { x: 0, y: 0, z: state.d3 }, R: 5 } };
    return { pts: [O, { x: 4, y: 0, z: 3 }], sphere: { c: O, R: 3 } };
  };
  function extOf(k) {
    const all = k.pts.slice();
    if (k.sphere) {
      const { c, R } = k.sphere;
      all.push({ x: c.x + R, y: c.y, z: c.z }, { x: c.x - R, y: c.y, z: c.z }, { x: c.x, y: c.y + R, z: c.z }, { x: c.x, y: c.y - R, z: c.z }, { x: c.x, y: c.y, z: c.z + R }, { x: c.x, y: c.y, z: c.z - R });
    }
    return {
      x: Math.max(2, ...all.map((p) => Math.abs(p.x))) + 1,
      y: Math.max(2, ...all.map((p) => Math.abs(p.y))) + 1,
      z: Math.max(2, ...all.map((p) => p.z)) + 1,
      zn: Math.max(3, -Math.min(...all.map((p) => p.z)) + 0.6)
    };
  }
  /* 점·구·축 이름·점 라벨이 모두 화면 안에 들어오도록 무대를 맞춥니다(바닥 평면은 장식이라 넘쳐도 됩니다). */
  function fitScene(k, ext, drawFn, grid) {
    const rx = Math.floor(ext.x), ry = Math.floor(ext.y);
    const plane = grid ? [{ x: -rx, y: -ry, z: 0 }, { x: rx, y: -ry, z: 0 }, { x: rx, y: ry, z: 0 }, { x: -rx, y: ry, z: 0 }] : [{ x: -rx, y: 0, z: 0 }, { x: 0, y: -ry, z: 0 }];
    const pts = [...k.pts, ...plane, { x: 0, y: 0, z: -ext.zn }, { x: 0, y: 0, z: 0 }, { x: ext.x + 0.6, y: 0, z: 0 }, { x: 0, y: ext.y + 0.6, z: 0 }, { x: 0, y: 0, z: ext.z }].map((p) => SP.P(w(p)));
    if (k.sphere) {
      const c = SP.P(w(k.sphere.c)), R = k.sphere.R;
      pts.push({ x: c.x + R, y: c.y }, { x: c.x - R, y: c.y }, { x: c.x, y: c.y + R }, { x: c.x, y: c.y - R });
    }
    fitCoordinates(pts, drawFn, { margin: 0.04, px: 6 });
  }
  /* 원본 makeTapeData → 셸의 하단 띠 */
  function tapeOf(t) {

  const RENDER = { 1: renderMode1, 2: renderMode2, 3: renderMode3, 4: renderMode4 };
  const TH4_TANGENT = Math.acos(3 / 5) * R2D; // 접점 T가 되는 각도 ≈ 53.13°
  const th4Of = (d) => d / R2D; // 접점에 가까운 각도도 실제 값으로 계산합니다. 정확한 접점은 전용 프리셋으로 선택합니다.
  function sync(s, m) {

  }
  const cam = (s) => ({ yaw: s.yaw / R2D, pitch: s.pitch / R2D });
  const CAMS = (m) => ({

  const TITLES = ['수선의 발과 대칭이동, 최단 거리', '내분점과 좌표평면과의 교점 (|z₁|:|z₂|)', '구와 평면이 만나서 생기는 원 (R²-d²)', '구 밖의 점: 거리의 최대·최소와 접선의 길이'];
  const SHORT = ['수선의 발·대칭', '내분점·교점', '구와 평면', '구 밖의 점'];

        for (let j = 0; j < 3; j++) { const sm = (((A[j] + B[j] + C[j]) % 3) + 3) % 3; if (sm) C[j] += 3 - sm; }

        if (t.Q.some((f) => f.d !== 1) || t.d2 === 0 || t.d2 > 200) continue;

  /* ================= 장면 8: 정육면체에 좌표 얹기 ================= */
  const cubeV = (a) => ({ E: P3(0, 0, 0), F: P3(a, 0, 0), G: P3(a, a, 0), H: P3(0, a, 0), A: P3(0, 0, a), B: P3(a, 0, a), C: P3(a, a, a), D: P3(0, a, a) });

  const I8 = {};
  const C8 = [];          // 기본 시점에서 점이 포개지지 않는 (모서리 a, 위치 u) 후보. 「숫자 바꾸기」가 차례로 돌려 씁니다

  const D5 = {

    answer: (s) => { const q = NC[5](s.sd5 | 0); return texU(`\\overline{AB}=${sqTex(q.d2)}`); },
    snap: (s) => { const q = NC[5](s.sd5 | 0); return { px: q.P.x, py: q.P.y, pz: q.P.z }; },
    standard: (s) => {
      const q = NC[5](s.sd5 | 0), AX = ['x', 'y', 'z'], nf = AX[NI[q.f]], ns = AX[NI[q.s]], dv = [q.B.x - q.A.x, q.B.y - q.A.y, q.B.z - q.A.z];
      return {
        steps: `① ${texU(PLN[q.f])}평면 위의 수선의 발 ${texU('A')}는 ${texU(nf)}좌표만 ${texU('0')}으로 바꾼 점이다: ${texU(ptex('A', q.A))}<br/>② ${texU(PLN[q.s])}평면에 대한 대칭점 ${texU('B')}는 ${texU(ns)}좌표의 부호만 바꾼 점이다: ${texU(ptex('B', q.B))}<br/>③ ${texU(`\\overline{AB}=\\sqrt{(${dv[0]})^2+(${dv[1]})^2+(${dv[2]})^2}=${rootEq(q.d2)}`)}`,
        warning: `주의: 수선의 발은 그 좌표를 <b>0</b>으로, 대칭점은 그 좌표의 <b>부호</b>를 바꿉니다. 둘을 섞지 마세요. 바뀌는 좌표는 평면 이름에 <b>없는</b> 문자(${PLN[q.f]}평면이면 ${nf})입니다.`

    },
    quick: (s) => {

      return {
        steps: `① A와 B는 P에서 <b>서로 다른 문자 하나씩</b>만 달라진 점이다: A는 ${texU(nf)}를 ${texU('0')}으로, B는 ${texU(ns)}의 부호를 바꾼다.<br/>② 따라서 ${texU('\\overline{AB}^2')}은 ${texU(nf)}가 달라진 만큼 ${texU(`(${Pf})^2`)}과 ${texU(ns)}가 달라진 만큼 ${texU(`(2\\times ${par(Ps)})^2`)}의 합이다.<br/>③ ${texU(`\\overline{AB}^2=${Pf * Pf}+${4 * Ps * Ps}=${q.d2}`)} ⇒ <strong class="text-amber-300">${texU(`\\overline{AB}=${sqTex(q.d2)}`)}</strong>`,

      };
    }
  };

  /* ---- 장면 6 글 ---- */
  const D6 = {
    title: '구의 방정식: 완전제곱·좌표평면에 접함·단면', short: '구의 방정식',
    question: '상수항 k가 변하면 구의 반지름은 어떻게 바뀌고, 언제 좌표평면에 접할까?',
    guide: '상수항 <b>k</b>를 움직이면 반지름이 바뀝니다(<b>R² = 14 − k</b>). 중심에서 평면까지의 거리 <b>d</b>와 <b>R</b>이 같아지는 순간 평면에 <b>접하고</b>, R이 더 크면 반지름 <b>r = √(R² − d²)</b>인 원이 생깁니다. 자르는 평면을 바꿔 가며 확인해 보세요.',
    tag: '필수 · 기출 유형 (매산고 22 1학기 기말형)', time: '목표 시간: 90초',

    presets: () => [

      ...viewPresets(ISO)
    ],
    init: { k6: 8, sel6: 0 },
    view(s, lab) {
      const k = s.k6, R2 = 14 - k, sel = s.sel6 | 0, d = [3, 2, 1][sel], d2 = d * d;
      const rel = R2 > d2 ? 0 : R2 === d2 ? 1 : 2;
      let chips;
      if (lab.tab === 'review') {
        const q = NC[6](s.sd6 | 0);
        chips = stepChip([
          { k: '완전제곱', tex: sq6(q.c), color: 'amber' },
          { k: `${PLN[q.tp]}평면에 접함`, tex: `d=${q.dt}=R\\ \\Rightarrow\\ ${q.K0}-k=${q.R2}\\ \\Rightarrow\\ k=${q.k}`, color: 'sky' },
          { k: `${PLN[q.op]}평면 단면`, tex: `r^2=R^2-d^2=${q.R2}-${q.dO * q.dO}=${q.r2}\\ \\Rightarrow\\ ${q.r2}\\pi`, color: 'green' }
        ], s);
      } else {
        chips = [{ tex: eq6([2, -1, 3]), answer: true }, { tex: '(x-2)^2+(y+1)^2+(z-3)^2=14-k', color: 'amber', answer: true }, { tex: `R^2=14-k=${R2}`, color: 'rose', answer: true }];
      }
      return {
        chips,
        alert: R2 < 0 ? { tone: 'warn', text: 'k > 14이면 R² = 14 − k < 0 이라서 구가 아닙니다(그릴 수 있는 구가 없어요).' } : R2 === 0 ? { tone: 'info', text: 'k = 14이면 R = 0, 구가 한 점(중심 C)으로 줄어듭니다.' } : undefined,
        status: R2 < 0 ? { tone: 'bad', text: 'k > 14: 구가 아닙니다' } : R2 === 0 ? { tone: 'warn', text: 'R = 0: 구가 아니라 점입니다' } : rel === 1 ? { tone: 'key', text: `R = d: ${PLN6[sel]}에 접합니다 (k = ${k})` } : rel === 2 ? { tone: 'warn', text: `R < d: ${PLN6[sel]}과 만나지 않습니다` } : { tone: 'info', text: viewStatus(s) },
        readouts: [
          { label: '중심 C / 반지름 R', value: `C(2, −1, 3) | R² = 14 − k = ${R2} (R = ${rTxt6(R2)})`, color: 'sky' },
          { label: `${PLN6[sel]}까지의 거리 d`, value: `d = |${['z', 'x', 'y'][sel]}좌표| = ${d}`, color: 'rose' },
          { label: 'R과 d 비교', value: rel === 0 ? `R² = ${R2} > d² = ${d2} → 원이 생김` : rel === 1 ? `R² = d² = ${d2} → 접함` : `R² = ${R2} < d² = ${d2} → 만나지 않음`, color: 'amber' },
          { label: '단면 원', value: rel === 0 ? `r² = ${R2} − ${d2} = ${R2 - d2} → 넓이 ${R2 - d2}π` : rel === 1 ? '반지름 0 (접점 한 점)' : '교점 없음', color: 'green' }
        ],
        formula: `구의 방정식 ${texU('(x-a)^2+(y-b)^2+(z-c)^2=R^2')}: 중심 ${texU('(a,b,c)')}, 반지름 ${texU('R')}<br/>${texU('x^2+y^2+z^2+Ax+By+Cz+D=0')}은 <b>완전제곱식</b>으로 고쳐서 중심과 반지름을 읽는다<br/>중심에서 좌표평면까지의 거리: xy평면 ${texU('|c|')}, yz평면 ${texU('|a|')}, zx평면 ${texU('|b|')}<br/>${texU('R=d')} → 접함, ${texU('R\\gt d')} → 단면 원 ${texU('r=\\sqrt{R^2-d^2}')}`
      };
    },
    steps: (q) => [
      `완전제곱식으로 고쳐 중심 ${ctr6t(q.c)}과 R² = ${q.K0} − k 를 읽는다`,
      `${PLN[q.tp]}평면에 접한다: 중심에서 평면까지 거리 d = ${q.dt} = R → R² = ${q.R2}, k = ${q.k}`,
      `${PLN[q.op]}평면으로 자르면: d′ = ${q.dO}, r² = R² − d′² = ${q.R2} − ${q.dO * q.dO} = ${q.r2} → 넓이 ${q.r2}π`
    ],
    problemText: (s) => { const q = NC[6](s.sd6 | 0); return `구 ${texU(eq6(q.c))}이 ${texU(PLN[q.tp])}평면에 접할 때, 상수 ${texU('k')}의 값과 이 구가 ${texU(PLN[q.op])}평면과 만나서 생기는 원의 넓이를 구하시오.`; },
    answer: (s) => { const q = NC[6](s.sd6 | 0); return `${texU('k=' + q.k)}, 넓이 ${texU(q.r2 + '\\pi')}`; },
    snap: (s) => { const q = NC[6](s.sd6 | 0); return { k6: 5, sel6: q.op }; },
    standard: (s) => {
      const q = NC[6](s.sd6 | 0), c = q.c, axn = ['z', 'x', 'y'];
      return {
        steps: `① 완전제곱식으로 고친다: ${texU(sq6(c))}.<br/>&nbsp;&nbsp;중심 ${texU(ctr6(c))}, 반지름 ${texU('R=\\sqrt{' + q.K0 + '-k}')}<br/>② ${texU(PLN[q.tp])}평면에 접하면 중심에서 평면까지의 거리 ${texU('|' + axn[q.tp] + '|=' + q.dt)}가 반지름과 같다: ${texU(`${q.K0}-k=${q.dt}^2=${q.R2}`)} ⇒ ${texU('k=' + q.k)}<br/>③ ${texU('R^2=' + q.R2)}. ${texU(PLN[q.op])}평면까지의 거리는 ${texU('|' + axn[q.op] + '|=' + q.dO)}이므로 단면 원의 반지름은 ${texU(`r^2=R^2-d^2=${q.R2}-${q.dO * q.dO}=${q.r2}`)}, 넓이는 ${texU('\\pi r^2=' + q.r2 + '\\pi')}`,
        warning: `주의: 중심의 좌표는 일차항 계수의 <b>절반에 부호를 반대로</b> 쓴 값입니다(${texU(lt(-2*c[0], 'x'))} → ${texU('x='+c[0])}, ${texU(lt(-2*c[1], 'y'))} → ${texU('y='+c[1])}). 또 ${texU('R^2=' + q.K0 + '-k')}처럼 ${texU('k')}를 <b>빼야</b> 합니다.`
      };
    },
    quick: (s) => {
      const q = NC[6](s.sd6 | 0), c = q.c, axn = ['z', 'x', 'y'], Ct = [c[2], c[0], c[1]], other = [0, 1, 2].filter((j) => j !== q.tp).map((j) => Ct[j]);
      return {
        steps: `① 접하면 <b>R = (접한 평면까지의 거리) = ${q.dt}</b>이므로, 상수항은 ${texU(axn[q.tp])}를 뺀 나머지 중심 좌표의 제곱의 합이다: ${texU(`k=${other.map((v) => par(v) + '^2').join('+')}=${q.k}`)}<br/>② 단면 원: ${texU(`r^2=${q.dt}^2-${q.dO}^2=${q.r2}`)} (접한 평면까지 거리의 제곱 − 자른 평면까지 거리의 제곱) ⇒ 넓이 <strong class="text-amber-300">${texU(q.r2 + '\\pi')}</strong>`,
        highlight: '구 x²+y²+z²−2ax−2by−2cz+k=0 에서 R² = a²+b²+c²−k 입니다. xy평면에 접하면 R = |c| 이므로 k = a²+b², 다른 평면도 같은 방식입니다.'
      };
    }
  };

  /* ---- 장면 7 글 ---- */
  const D7 = {
    title: '분점: 내분점·외분점과 무게중심', short: '분점·무게중심',
    question: '선분을 m : n으로 내분·외분하는 점과 삼각형의 무게중심의 좌표는 어떻게 구할까?',
    guide: '<b>m, n</b>을 바꿔 선분 AB를 m : n으로 나누는 점 <b>X</b>를 찾아 보세요. <b>내분</b>은 A와 B 사이, <b>외분</b>은 선분의 연장선 위에 생깁니다. 아래 띠는 A, B, X를 한 줄(수직선)에 펴 놓은 모양입니다. 「무게중심 G」를 켜면 세 중선이 만나는 점이 겹쳐 그려집니다.',
    tag: '필수 · 교육과정 핵심 유형', time: '목표 시간: 60초',
    controls: () => ['m7', 'n7', 'yaw', 'pitch'],
    presets: () => [
      { group: '분점', label: '내분점', color: 'sky', apply: (st) => { st.mode7 = 0; }, on: (st) => !(st.mode7 | 0) },
      { group: '분점', label: '외분점', color: 'rose', apply: (st) => { st.mode7 = 1; }, on: (st) => (st.mode7 | 0) === 1 },
      { group: '삼각형', label: '무게중심 G 겹쳐 보기', color: 'green', apply: (st) => { st.cent = st.cent ? 0 : 1; }, on: (st) => !!st.cent },
      ...viewPresets(CAM7)
    ],
    init: { m7: 2, n7: 1, mode7: 0, cent: 0, yaw: CAM7.yaw, pitch: CAM7.pitch },
    view(s, lab) {
      const m = s.m7 | 0, n = s.n7 | 0, ext = (s.mode7 | 0) === 1, Xf = div7(A7, B7, m, n, ext);
      let chips, tape = null, status = { tone: 'info', text: viewStatus(s) };
      if (lab.tab === 'review') {
        const q = NC[7](s.sd7 | 0);
        chips = stepChip([
          { k: '무게중심', tex: `G(${q.G.map(fTex).join(',')})`, color: 'green' },
          { k: `${q.m}:${q.n} 외분점`, tex: `Q(${q.Q.map(fTex).join(',')})`, color: 'amber' },
          { k: '거리', tex: `\\overline{GQ}=${rootEq(q.d2)}`, color: 'green' }
        ], s);
      } else {
        chips = [{ tex: ext ? '\\dfrac{m\\,x_B-n\\,x_A}{m-n}' : '\\dfrac{m\\,x_B+n\\,x_A}{m+n}', k: ext ? '외분 x좌표' : '내분 x좌표', color: ext ? 'rose' : 'sky', answer: true }];
        if (Xf) chips.push({ tex: `X\\left(${Xf.map(fTex).join(',\\ ')}\\right)`, color: 'amber', answer: true });
      }
      if (ext && m === n) status = { tone: 'warn', text: 'm = n이면 외분점이 없습니다 (m ≠ n으로 바꾸세요)' };
      if (Xf && lab.tab === 'explore') {
        if (!ext) tape = tapeOfD(`선분 AB 위에서 AX : XB = ${m} : ${n} (내분)`, [{ text: `AX ${m}`, weight: m, color: 'sky' }, { text: `XB ${n}`, weight: n, color: 'rose' }]);
        else if (m > n) tape = tapeOfD(`한 줄로 펴면 A → B → X, AB : BX = ${m - n} : ${n} (AX : XB = ${m} : ${n}, 외분)`, [{ text: `AB ${m - n}`, weight: m - n, color: 'amber' }, { text: `BX ${n}`, weight: n, color: 'rose' }]);
        else tape = tapeOfD(`한 줄로 펴면 X → A → B, XA : AB = ${m} : ${n - m} (AX : XB = ${m} : ${n}, 외분)`, [{ text: `XA ${m}`, weight: m, color: 'rose' }, { text: `AB ${n - m}`, weight: n - m, color: 'amber' }]);
      }
      const sg = ext ? '−' : '+';
      const rowOf = (i, c) => `${c} = (${m}·${par(B7[i])} ${sg} ${n}·${par(A7[i])}) ÷ (${m} ${sg} ${n})`;
      const reads = [
        { label: '비 AX : XB', value: `${m} : ${n} ${ext ? '외분' : '내분'}`, color: ext ? 'rose' : 'sky' },
        ...(Xf ? ['x', 'y', 'z'].map((c, i) => ({ label: `${c}좌표`, value: fTxt(Xf[i]), note: rowOf(i, c), color: 'amber' })) : [])
      ];
      if (s.cent) reads.push({ label: '무게중심 G', value: 'G = (3, 2, 3)', note: 'G = ((1+3+5) ÷ 3, (2+(−2)+6) ÷ 3, (3+5+1) ÷ 3)', color: 'green', wide: true });
      return {
        chips, status, tape, readouts: reads,
        formula: `<b>내분점 X</b>: ${texU('x_X=\\dfrac{nx_A+mx_B}{m+n}')}<br/><b>외분점 X</b>: ${texU('x_X=\\dfrac{mx_B-nx_A}{m-n}')} (${texU('m\\ne n')})<br/>y, z좌표도 같은 가중치로 각각 계산합니다.<br/><b>무게중심</b>: ${texU('x_G=\\dfrac{x_A+x_B+x_C}{3}')}<br/>y, z좌표도 세 꼭짓점 좌표의 평균입니다.`
      };
    },
    steps: (q) => [
      `삼각형 ABC의 세 중선이 만나는 무게중심 G = (세 점의 좌표의 평균) = ${rpt('G', q.G)}`,
      `선분 AB를 ${q.m} : ${q.n}${ro(q.n)} 외분하는 점 Q = (${q.m}B − ${q.n}A) ÷ (${q.m} − ${q.n}) = ${rpt('Q', q.Q)}`,
      `두 점 G, Q 사이의 거리: GQ = √(${[0, 1, 2].map((i) => Math.abs(fVal(q.Q[i]) - fVal(q.G[i])) + '²').join(' + ')}) = ${sqTxt(q.d2)}`
    ],
    problemText: (s) => { const q = NC[7](s.sd7 | 0); return `좌표공간의 세 점 ${texU(ptex('A', vec7(q.A)))}, ${texU(ptex('B', vec7(q.B)))}, ${texU(ptex('C', vec7(q.C)))}에 대하여 삼각형 ${texU('ABC')}의 무게중심을 ${texU('G')}, 선분 ${texU('AB')}를 ${texU(q.m + ':' + q.n)}${ro(q.n)} 외분하는 점을 ${texU('Q')}라 할 때, 선분 ${texU('GQ')}의 길이를 구하시오.`; },
    answer: (s) => { const q = NC[7](s.sd7 | 0); return texU(`\\overline{GQ}=${sqTex(q.d2)}`); },
    snap: () => ({ m7: 2, n7: 1 }),
    standard: (s) => {
      const q = NC[7](s.sd7 | 0), Dv = [0, 1, 2].map((i) => fVal(q.Q[i]) - fVal(q.G[i]));
      const gx = (i) => `\\dfrac{${q.A[i]}+${par(q.B[i])}+${par(q.C[i])}}{3}`, qx = (i) => `\\dfrac{${q.m}\\cdot${par(q.B[i])}-${q.n}\\cdot${par(q.A[i])}}{${q.m}-${q.n}}`;
      return {
        steps: `① 세 좌표를 각각 평균한다:<br/>${['x','y','z'].map((c,i) => texU(`${c}_G=${gx(i)}=${fTex(q.G[i])}`)).join('<br/>')}<br/>따라서 ${texU(`G(${q.G.map(fTex).join(',')})`)}.<br/>② 외분 좌표도 같은 비로 계산한다:<br/>${['x','y','z'].map((c,i) => texU(`${c}_Q=${qx(i)}=${fTex(q.Q[i])}`)).join('<br/>')}<br/>따라서 ${texU(`Q(${q.Q.map(fTex).join(',')})`)}.<br/>③ ${texU(`\\overline{GQ}^2=(${Dv[0]})^2+(${Dv[1]})^2+(${Dv[2]})^2=${q.d2}`)}<br/>${texU(`\\overline{GQ}=${rootEq(q.d2)}`)}`,
        warning: '주의: 외분은 내분 공식에서 <b>부호가 −</b>이고 분모도 <b>m − n</b>입니다. 내분 공식(+)을 그대로 쓰면 틀립니다.'
      };
    },
    quick: (s) => {
      const q = NC[7](s.sd7 | 0), k = q.m - q.n;

      py: { value: -2, min: -6, max: 6, step: 1, color: 'green', label: '점 P의 y좌표', format: (v) => `y = ${mnum(v)}` },
      pz: { value: 5, min: -6, max: 6, step: 1, color: 'sky', label: '점 P의 z좌표', format: (v) => `z = ${mnum(v)}` },
      k6: { value: 8, min: -4, max: 16, step: 1, color: 'amber', label: '상수항 k', hint: 'R² = 14 − k와 중심에서 평면까지 거리의 제곱을 비교하세요.', format: (v) => `k = ${mnum(v)} (R² = ${14 - v}, R = ${rTxt6(14 - v)})` },
      m7: { value: 2, min: 1, max: 4, step: 1, color: 'sky', label: '비 m (AX 쪽)', format: (v) => `m = ${v}` },
      n7: { value: 1, min: 1, max: 4, step: 1, color: 'rose', label: '비 n (XB 쪽)', hint: 'AX : XB = m : n', format: (v) => `n = ${v}` },
      u8: { value: 2, min: 0, max: 6, step: 1, color: 'amber', label: '점 P의 위치 (대각선 AG 위)', hint: 'P(u, u, 6−u): u가 클수록 G에 가깝습니다', format: (v) => { const u = Math.round(v), g = gcdI(u, 6 - u) || 1; return `P(${u}, ${u}, ${6 - u}) · ${u === 0 ? 'P = A' : u === 6 ? 'P = G' : `AP : PG = ${u / g} : ${(6 - u) / g}`}`; } },
      th: { value: 90, min: 0, max: 360, step: 0.5, color: 'amber', label: '구 위의 점 Q의 각도 θ', hint: 'Q는 xz평면의 대원 위를 움직입니다. 정확한 접점은 전용 버튼으로 선택합니다.', format: (v) => { const t = th4Of(v); return `θ ≈ ${(t * R2D).toFixed(2)}° (PQ ≈ ${Math.sqrt(34 - 30 * Math.cos(t)).toFixed(2)})`; } }
    },
    state: { lens: 'all', feet1: 0, kind: 0, tgt: 0, sel6: 0, mode7: 0, cent: 0, tri: 0, coord: 0, sd5: 0, sd6: 0, sd7: 0, sd8: 0 },
    persist: ['lens', 'feet1', 'kind', 'tgt', 'sel6', 'mode7', 'cent', 'tri', 'coord', 'sd5', 'sd6', 'sd7', 'sd8'],
    scenes: [...[1, 2, 3, 4].map(sceneOf), ...[5, 6, 7, 8].map(sceneNew)]

  };

  /* One-click lessons keep the original first problem, 3D renderer and controls. */
  const lessonScenes = labDefinition.scenes;
  const copy = value => JSON.parse(JSON.stringify(value));
  const info = Object.fromEntries(lessonScenes.map(sc => {
    const m = Number(sc.id.slice(4));
    const initial = {...labDefinition.state, ...Object.fromEntries(Object.entries(labDefinition.params).map(([k,v]) => [k,v.value]))};
    sc.enter(initial);
    // Initial playback is the given geometry, not a user's previous seed/drag.
    initial.sd5 = initial.sd6 = initial.sd7 = initial.sd8 = 0;
    initial.lscOrbit = 0;
    const question = (typeof sc.problem.text === 'function' ? sc.problem.text(initial) : sc.problem.text).replace(/<div class="nc-tools">[\s\S]*$/, '');
    sync(initial, m);
    const first = m <= 4 ? copy({geometry:KEY(m), question, answer:sc.problem.answer(initial), snap:sc.problem.snap(initial)}) : copy(NC[m](0));
    return [sc.id, {initial, question, first, inquiry:sc.question}];
  }));
  const lessonSource = window.APL_SC_SOURCE = {
    scenes:lessonScenes, initial:id=>{
      const initial=copy(info[id].initial);
      // Seed selection belongs to the original problem UI, never to a lesson track.
      for(const key of ['sd5','sd6','sd7','sd8'])delete initial[key];
      return initial;
    }, first:id=>copy(info[id].first),
    question:id=>info[id].question, inquiry:id=>info[id].inquiry,
    variant:(id,seed)=>{const m=Number(id.slice(4));return m>=5?copy(NC[m](seed)):copy(info[id].first);},
    math:{derive5,div7,mk8,sec6,cubeV,dist3,w,cam,th4Of,dist1}
  };
  const scMathKey = value => String(value||'').normalize('NFKC').replace(/&gt;/g,'>').replace(/&lt;/g,'<').replace(/&#(?:39|x27);/g,"'").replace(/^(?:중심 |외부 점 |대칭점 |탐구점 |최단점 )/,'').replace(/^([A-Z][0-9′'*]*)(?=\()/,'$1=')
    .replace(/\\(?:left|right|,|!|;|quad|qquad)/g,'')
    .replace(/\\(?:dfrac|tfrac|frac)\{([^{}]*)\}\{([^{}]*)\}/g,'$1/$2')
    .replace(/\\sqrt\{([^{}]*)\}/g,'√$1').replace(/\\sqrt\s*(\w)/g,'√$1')
    .replace(/\\(?:text|mathrm|mathbf|overline)\{([^{}]*)\}/g,'$1')
    .replace(/\\theta/g,'θ').replace(/\\pi/g,'π').replace(/\\circ/g,'°').replace(/\\angle/g,'∠').replace(/\\perp/g,'⊥')
    .replace(/\\leq?/g,'≤').replace(/\\geq?/g,'≥').replace(/\\lt/g,'<').replace(/\\gt/g,'>')
    .replace(/\\cdot|\\times/g,'×').replace(/[−–]/g,'-').replace(/[′’]/g,"'").replace(/≈/g,'=')
    .replace(/[\s{}$^_()]/g,'').replace(/-?\d+\.\d+/g,x=>String(Number(x)));
  function scLessonLabel(value,s) {
    const str=String(value||''),key=scMathKey(str),known=(s.lscKnownMath||[]).map(scMathKey);
    if (key && known.some(k=>k.includes(key))) return str;
    const pair=key.split('=');
    if(pair.length===2&&known.some(k=>{const chain=k.split('=');return chain.length>2&&chain.includes(pair[0])&&chain.includes(pair[1]);}))return str;
    if (/^(?:[A-Z][′'*₀₁₂]?|[xyzRrdθ]|[xyz]축(?:\(높이\))?|[xyz]{2}평면|접점|Qmax|Qmin)$/.test(str)) return str;
    const name=str.match(/^(?:중심 |외부 점 |대칭점 |탐구점 |최단점 )?([A-Z][′'*₀₁₂]*)(?=[\s(=:≈]|$)/);
    return name ? name[1] : '';
  }
  for(const sc of lessonScenes) {
    const original={question:sc.question,steps:sc.steps,view:sc.view,draw:sc.draw,tick:sc.tick};
    sc.question=(s,lab)=>lscActive(s)?s.lscQuestion||lessonSource.question(sc.id):typeof original.question==='function'?original.question(s,lab):original.question;
    sc.steps=(s,lab)=>lscActive(s)?['조건 확인','전략과 보조선','계산','결론']:original.steps(s,lab);
    sc.view=(s,lab)=>lscActive(s)?{}:original.view(s,lab);
    sc.tick=(s,dt,lab)=>lscActive(s)?false:original.tick?.(s,dt,lab);
    sc.draw=(b,s,v,lab)=>{
      if(!lscActive(s)) {
        if(b._scLessonView) {
          Object.assign(b,b._scLessonView.before);
          delete b._scLessonView;
        }
        return original.draw(b,s,v,lab);
      }
      if(!b._scLessonView)b._scLessonView={before:{focus:b.focus,zoom:b.zoom,panX:b.panX,panY:b.panY}};
      const shown={...s,...(s.lessonEntry?s.lscInitial:{}),playing:false,dragging:false,
        step:s.lessonEntry?(s.lscInitial?.lscStartStep||0):Math.max(0,Math.min(s.step||0,3))};
      for(const [key,value] of Object.entries(lessonSource.initial(sc.id))){
        const track=(typeof value==='number'?'lscN_':'lscS_')+key;
        if(Object.hasOwn(shown,track))shown[key]=shown[track];
      }
      if(s.lessonEntry){shown.lscOrbit=0;shown.lscShowAnswer=false;}
      shown.sd5=shown.sd6=shown.sd7=shown.sd8=0;
      shown.yaw += 6*(shown.lscOrbit||0);
      const shownLab=Object.create(lab);shownLab.s=shown;shownLab.tab=shown.lscExplore?'explore':'review';
      b.zoom=1;b.panX=0;b.panY=0;
      const text=b._text,math=b.math;
      b._text=function(x,y,label,options={},screen){return text.call(this,x,y,this._bbox?label:scLessonLabel(label,shown),options,screen);};
      b.math=function(id,p,value,options){return math.call(this,id,p,this._bbox||shown.lscShowAnswer?value:'',options);};
      const previous=lscContext;lscContext=shown;
      try {original.draw(b,shown,{},shownLab);}
      finally {lscContext=previous;b._text=text;b.math=math;}
    };
  }
  labDefinition.lessons=window.APL_SC_LESSONS?window.APL_SC_LESSONS.install(lessonScenes,lessonSource):{};
  APLab.createLab(labDefinition);
});
</script>
