  /* ===== 원본 상태 객체(이름 그대로) — 매 프레임 2.0 셸 상태에서 채웁니다 ===== */
    const state = { probIdx: 0, auxStep: 0, sliderT: 0.45, animT: 1.0, scale: 1.0, panX: 0, panY: 0 };
    function curProb() {
      return PROBLEMS[state.probIdx];
    }

  /* ======================================================================
     [2.0] 어댑터: 원본의 d* 그리기 함수 → 새 무대 엔진
     - 좌표는 원본의 화면 좌표(1000×700 기준, y 아래쪽)를 '설계 좌표'로 쓰는 figure 무대입니다
     - 좌표평면(격자·축·눈금)은 무대가 직접 그리고, 곡선과 함께 자동 맞춤 계산에서는 빠집니다
     ====================================================================== */
  let BOARD = null;
  let CUR = null;        // 지금 그리는 셸 상태(핸들 끌기가 고칩니다)
  let DRAG = { obj: null, raw: 0, w: null };
  let HN = 0;
  const LIVE = { text: '' };
  // 셸은 이모지(➔ ⭕ ❌ 포함)를 화면 표시에서 떼어 내므로, 문장 속 뜻이 사라지지 않게 → ○ × 로 미리 바꿔 넘깁니다(원문은 그대로).
  const arrowOnly = (s) => String(s == null ? '' : s).replace(/➔/g, '→').replace(/⭕/g, '○').replace(/❌/g, '×');
  const cv = (s) => APLab.stripEmoji(arrowOnly(s));
  // 원본 renderMathHTML 과 같은 규칙: **굵게** → <strong>. 또 $…$ 안의 '<'(예: $0 \le k < 1$)는 HTML 태그 시작으로 읽히지 않게 \lt 로 바꿉니다.
  const bold = (s) => s.replace(/\*\*([\s\S]+?)\*\*/g, '<strong>$1</strong>').replace(/\$([^$]+)\$/g, (m0, src) => '$' + src.replace(/</g, '\\lt ') + '$');
  const arrow = (v) => (typeof v === 'string' ? bold(arrowOnly(v)) : Array.isArray(v) ? v.map(arrow) : v && typeof v === 'object' ? Object.fromEntries(Object.entries(v).map(([k, x]) => [k, arrow(x)])) : v);
  // 자동 맞춤 중에는 좌표에 따라 범위가 늘어나므로, 범위에 넣지 않을 계산은 등록 없이 화면 좌표만 구합니다.
  const scr = (x, y) => { const bb = BOARD._bbox; BOARD._bbox = null; const r = BOARD.toS(x, y); BOARD._bbox = bb; return r; };
  // 정확한 경계값은 아래 프리셋 버튼으로 선택합니다.
  // 자유 조작 중에는 근처의 값으로 자동 보정하지 않아 슬라이더와 그림이 같은 실수값을 나타냅니다.

    // TX, TY: 같은 모양을 옮겨 그리는 변형(bas-15·16)에서만 0이 아닙니다(drawBasicScene 래퍼가 정하고 돌려놓음).
    let TX = 0, TY = 0;
    function toScr(mx, my, ox, oy, u) {
      return { x: ox + (mx + TX) * u, y: oy - (my + TY) * u };
    }
    const nf = (v) => (Math.abs(v - Math.round(v)) < 1e-9 ? String(Math.round(v)) : v.toFixed(1));
    const f1 = (v) => (state.fixed ? nf(v) : v.toFixed(1));
    // 문제·정리 탭(고정 그림)에서는 휴대폰에서도 라벨이 12px 아래로 줄지 않게, 무대가 줄이는 만큼(_ts) 되돌려 키웁니다.
    const LSf = () => (state.fixed && BOARD ? 1 / BOARD._ts() : 1);

  /* 좌표평면(격자·축·눈금): 원본 drawAxesWithTicks (1398행) */
  function drawAxesWithTicks(rect, ox, oy, u) {
    const b = BOARD;
    if (b._bbox) return;
    const c = b.ctx, W = b.W, H = b.H, k = b.k;
    const org = b.toS(ox, oy);
    const step = u * k;
    c.save();
    c.beginPath();
    c.rect(0, 0, W, H);
    c.clip();
    c.setLineDash([]);
    if (CUR && CUR.grid !== false && step > 6) {
      c.strokeStyle = b.colors.grid;
      c.lineWidth = 1;
      c.beginPath();
      for (let x = ((org.x % step) + step) % step; x < W; x += step) { c.moveTo(Math.round(x) + 0.5, 0); c.lineTo(Math.round(x) + 0.5, H); }
      for (let y = ((org.y % step) + step) % step; y < H; y += step) { c.moveTo(0, Math.round(y) + 0.5); c.lineTo(W, Math.round(y) + 0.5); }
      c.stroke();
    }
    c.strokeStyle = b.colors.axis;
    c.lineWidth = 1.6 * b.lw;
    c.beginPath();
    if (org.y >= 0 && org.y <= H) { c.moveTo(0, org.y); c.lineTo(W, org.y); }
    if (org.x >= 0 && org.x <= W) { c.moveTo(org.x, 0); c.lineTo(org.x, H); }
    c.stroke();
    if (!b.thumb) {
      const every = [1, 2, 5, 10, 20].find((n) => n * step >= 30) || 20;
      c.font = `600 ${(state.fixed ? 12.5 : 11.5) * b.fs}px ${b.font}`;
      c.fillStyle = b.colors.tick;
      c.textAlign = 'center';
      c.textBaseline = 'top';
      const ty = Math.min(Math.max(org.y + 6, 4), H - 18);
      const i0 = Math.ceil((0 - org.x) / step / every) * every, i1 = Math.floor((W - org.x) / step / every) * every;
      for (let i = i0; i <= i1; i += every) {
        if (i === 0) continue;
        const sx = org.x + i * step;
        if (sx < 16 || sx > W - 16) continue;
        c.fillText(String(i).replace('-', '−'), sx, ty);
        c.fillRect(sx - 0.5, org.y - 3, 1, 6);
      }
      c.textAlign = 'right';
      c.textBaseline = 'middle';
      const tx = Math.min(Math.max(org.x - 7, 26), W - 4);
      const j0 = Math.ceil((org.y - H) / step / every) * every, j1 = Math.floor(org.y / step / every) * every;
      for (let j = j0; j <= j1; j += every) {
        if (j === 0) continue;
        const sy = org.y - j * step;
        if (sy < 16 || sy > H - 16) continue;
        c.fillText(String(j).replace('-', '−'), tx, sy);
        c.fillRect(org.x - 3, sy - 0.5, 6, 1);
      }
      c.fillStyle = b.color('amber');
      c.font = `800 ${12.5 * b.fs}px ${b.font}`;
      c.textAlign = 'right';
      c.textBaseline = 'top';
      c.fillText('O', org.x - 6, org.y + 5);
    }
    c.restore();
  }

  function drawRightAngle(vertex, p1, p2, size = 11, col = C.gold) {
    BOARD.right(vertex, p1, p2, { size, color: col });
  }

  // 길이 표시선: 두 점 사이를 offsetPx 만큼 띄워 화살표 선과 값 상자로 표시(원본 1459행). 띄우는 크기는 그림과 함께 커지고 줄어듭니다.
  function drawDimension(p1, p2, offsetPx, label, col = C.gold) {
    const B = BOARD, c = B.ctx;
    const dx = p2.x - p1.x, dy = p2.y - p1.y;
    const len = Math.hypot(dx, dy);
    if (len < 12) return;
    const nx = (-dy / len) * offsetPx;
    const ny = (dx / len) * offsetPx;
    const a = { x: p1.x + nx, y: p1.y + ny };
    const b = { x: p2.x + nx, y: p2.y + ny };
    const A = B.toS(a.x, a.y), Bb = B.toS(b.x, b.y); // 자동 맞춤에서는 길이 표시선 양 끝이 범위에 들어갑니다
    const mx = (A.x + Bb.x) / 2, my = (A.y + Bb.y) / 2;
    const str = B.thumb ? '' : cv(label);
    const dsz = state.fixed ? 12.5 * LSf() : 11.5;
    if (B._bbox) { B._text(mx, my, str, { color: col, size: dsz, weight: 800, align: 'center', baseline: 'middle', halo: false }); return; }
    const P1 = scr(p1.x, p1.y), P2 = scr(p2.x, p2.y);
    c.save();
    c.strokeStyle = B.color(col, 0.4);
    c.lineWidth = 1.2;
    c.setLineDash([3, 3]);
    c.beginPath();
    c.moveTo(P1.x, P1.y); c.lineTo(A.x, A.y);
    c.moveTo(P2.x, P2.y); c.lineTo(Bb.x, Bb.y);
    c.stroke();
    c.strokeStyle = B.color(col);
    c.lineWidth = 2.0 * B.lw;
    c.setLineDash([]);
    c.beginPath();
    c.moveTo(A.x, A.y); c.lineTo(Bb.x, Bb.y);
    c.stroke();
    const sl = Math.hypot(Bb.x - A.x, Bb.y - A.y) || 1;
    const ux = (Bb.x - A.x) / sl, uy = (Bb.y - A.y) / sl, px = -uy, py = ux;
    const aw = 6, ah = 3.5;
    c.fillStyle = B.color(col);
    c.beginPath();
    c.moveTo(A.x, A.y);
    c.lineTo(A.x + ux * aw + px * ah, A.y + uy * aw + py * ah);
    c.lineTo(A.x + ux * aw - px * ah, A.y + uy * aw - py * ah);
    c.closePath();
    c.fill();
    c.beginPath();
    c.moveTo(Bb.x, Bb.y);
    c.lineTo(Bb.x - ux * aw + px * ah, Bb.y - uy * aw + py * ah);
    c.lineTo(Bb.x - ux * aw - px * ah, Bb.y - uy * aw - py * ah);
    c.closePath();
    c.fill();
    if (str) {
      const size = dsz * B.fs * B._ts();
      c.font = `800 ${size}px ${B.font}`;
      const tw = c.measureText(str).width;
      c.fillStyle = B.colors.stage;
      c.strokeStyle = B.color(col);
      c.lineWidth = 1.3;
      c.beginPath();
      c.roundRect(mx - tw / 2 - 6, my - 9, tw + 12, 18, 5);
      c.fill();
      c.stroke();
    }
    c.restore();
    B._text(mx, my, str, { color: col, size: dsz, weight: 800, align: 'center', baseline: 'middle', halo: false });
  }

  function dLine(a, b, col = C.gold, w = 2.6, dash = [], glow = false) {
    BOARD.seg(a, b, { color: col, width: w, dash: dash.length ? dash : null, glow });
  }

  // y = f(x) 곡선(원본 1536행). 값이 없거나 |y| > 22 이면 선을 끊습니다. 자동 맞춤 범위에는 넣지 않습니다.
  function dCurve(fn, xMin, xMax, ox, oy, u, col = C.cyan, w = 3.6, dash = [], glow = false) {
    const B = BOARD;
    if (B._bbox) return;
    const steps = 170;
    let run = [];
    const flush = () => { if (run.length > 1) B.path(run, { color: col, width: w, dash: dash.length ? dash : null, glow }); run = []; };
    for (let i = 0; i <= steps; i++) {
      const x = xMin + ((xMax - xMin) * i) / steps;
      const y = fn(x);
      if (y === null || isNaN(y) || Math.abs(y) > 22) { flush(); continue; }
      run.push(toScr(x, y, ox, oy, u));
    }
    flush();
  }

  function dPoly(pts, fill = 'rgba(56,189,248,0.22)', stroke = C.cyan, w = 2.5, glow = false) {
    BOARD.poly(pts, { fill: fill || null, color: stroke || null, stroke: !!stroke, width: w, glow });
  }

  // [2.0] 원본이 캔버스에 직접 그리던 두 곳의 대체: 원 채우기, 임의의 점들로 둘러싼 영역 채우기
  function dCircle(center, r, stroke, fill, w) {
    const B = BOARD;
    if (B._bbox) { B.toS(center.x - r, center.y - r); B.toS(center.x + r, center.y + r); }
    B.circle(center, r, { color: stroke, fill, width: w });
  }
  function dFill(pts, fill) {
    BOARD.poly(pts, { fill, color: null, stroke: false });
  }

  // 점 이름표가 서로 겹치면(특히 휴대폰) 원본 위치에서 위·아래로 한 줄씩 비켜 놓습니다(원본은 휴대폰에서만 비슷한 처리).
  let placedLabels = [];
  function dDot(p, label = '', col = C.white, off = { x: 8, y: -8 }, isHandle = false) {
    const B = BOARD;
    const str = B.thumb ? '' : cv(label);
    let dy = off.y;
    if (str && !B._bbox) {
      const s = scr(p.x, p.y), size = 12.5 * B.fs * B._ts() * LSf(), c = B.ctx;
      c.save();
      c.font = `800 ${size}px ${B.font}`;
      const w = c.measureText(str).width;
      c.restore();
      const h = size * 1.15;
      const box = (d) => ({ x0: s.x + off.x, x1: s.x + off.x + w, y0: s.y + d - size * 0.85, y1: s.y + d + size * 0.3 });
      const hit = (a, b) => a.x0 < b.x1 && a.x1 > b.x0 && a.y0 < b.y1 && a.y1 > b.y0;
      for (const d of [0, h, -h, 2 * h, -2 * h]) {
        dy = off.y + d;
        if (!placedLabels.some((q) => hit(box(dy), q))) break;
      }
      placedLabels.push(box(dy));
    }
    const o = { color: col, label: str, dx: off.x, dy, align: 'left', baseline: 'alphabetic', ...(state.fixed ? { size: 12.5 * LSf() } : {}) };
    if (isHandle && !B.thumb && !state.fixed) {
      const S = CUR, id = 'h' + HN++, pos = { x: p.x, y: p.y };
      // 원본 moveDrag 와 같은 규칙: 끈 방향·거리(오른쪽·위쪽이 +)만큼 조절 막대 값 t 가 움직입니다.
      B.handle(id, p, {
        ...o, r: 6.2,
        drag: (w) => {
          const same = B.dragging && B.dragging === DRAG.obj;
          const prev = same ? DRAG.w : pos;
          if (!same) { DRAG.raw = S.t; DRAG.obj = B.dragging || null; }
          const dxp = (w.x - prev.x) * B.k, dyp = (w.y - prev.y) * B.k;
          DRAG.raw = Math.max(0, Math.min(1, DRAG.raw + (dxp - dyp * 0.65) / Math.max(200, B.W * 0.6)));
          DRAG.w = w;
          S.t = DRAG.raw;
        }
      });
    } else B.point(p, { ...o, r: 5 });
  }

  function setMetric(exploreTxt, answerHintTxt = '') {
    LIVE.text = state.auxStep >= 3 && answerHintTxt ? `${exploreTxt} | ${answerHintTxt}` : exploreTxt;
  }

  /* ===== 원본 그대로: 문제별 풀이 위치(조건 만족 슬라이더 값)와 조절 막대 읽기값 (원본 1297–1378행) ===== */
    function solutionSlider(id) {
      const values = {
        'adv-1': 0.65,
        'adv-2': 0.35,
        'adv-5': 0.45,
        'adv-6': 0.40,
        'adv-7': 1.0,
        'adv-8': 0.60,
        'bas-3': 0.5,
        'bas-10': 0.35,
        'bas-13': 0.35
      };
      return Object.prototype.hasOwnProperty.call(values, id) ? values[id] : null;
    }

    function getParamReadout(p, t) {
      const id = p.id;
      if (id === 'adv-1') {
        const a = 3.4625 - t * 2.25;
        return state.auxStep === 0 ? '간격 탐구' : `a ≈ ${a.toFixed(2)}`;
      }
      if (id === 'adv-2') {
        const pVal = 0.3 + t * 2.0;
        return `p = ${pVal.toFixed(2)}`;
      }
      if (id === 'adv-3') {
        const k = -1.0 + t * 4.0;
        return `k = ${k.toFixed(2)}`;
      }
      if (id === 'adv-5') {
        const px = 1.605 + t * 3.1;
        return `x = ${px.toFixed(2)}`;
      }
      if (id === 'adv-6') {
        const yT = t <= 0.4 ? 0.2 + 2 * t : t <= 0.75 ? 1 + (t - 0.4) / 0.35 : 2 + 0.5 * (t - 0.75) / 0.17;
        return `t = ${yT.toFixed(2)}`;
      }
      if (id === 'adv-7') {
        const shift = 4 * t;
        return `d = ${shift.toFixed(2)}`;
      }
      if (id === 'adv-8') {
        if (t < 0.15) return `탐구 시작`;
        if (t < 0.35) return `고정점 탐구`;
        if (t <= 0.75) return `y = 8/3 수평선`;
        return `f(f(x))=x 교점`;
      }
      if (id === 'bas-2') {
        const m2raw = -1.5 + t * 3.5;
        const m2 = Math.abs(m2raw) < 1e-9 ? 0 : m2raw;
        return `m₂ = ${m2.toFixed(2)}`;
      }
      if (id === 'bas-3') {
        const kVal = Math.abs(t - 0.5) < 0.04 ? 2.0 : Math.abs(t - 1.0) < 0.04 ? 4.0 : 0.4 + t * 3.6;
        return `k = ${kVal.toFixed(1)}`;
      }
      if (id === 'bas-8') {
        const kVal = t < 0.4 ? -4 : t >= 0.8 ? 8 : 4;
        return `k = ${kVal > 0 ? '+' + kVal : kVal}`;
      }
      if (id === 'bas-10') {
        const px = 1.6 + t * 4.0;
        return `x = ${px.toFixed(2)}`;
      }
      if (id === 'bas-12') {
        const m = 1 / 3 + t * (5 / 3);
        return Math.abs(t) < 1e-9 ? 'm = 1/3' : Math.abs(t - 1) < 1e-9 ? 'm = 2' : `m ≈ ${m.toFixed(2)}`;
      }
      if (id === 'bas-13') {
        const m = Math.abs(t - 0.35) < 0.08 ? -0.5 : Math.abs(t - 0.65) < 0.08 ? 0 : -1.0 + t * 2.0;
        return `m = ${m.toFixed(2)}`;
      }
      if (id === 'bas-15') {
        const k = 1.4 - t * 2.2;
        return `k = ${k.toFixed(2)}`;
      }
      if (id === 'bas-16') {
        const k = 0.4 - t * 1.8;
        return `k = ${k.toFixed(2)}`;
      }
      return `${Math.round(t * 100)}%`;
    }

  /* ===== 원본 그대로: 교점 표시와 수학 표기 도우미 (원본 1630–1690행) ===== */
    function plotIntersections(k, ox, oy, sc, rational, showGhost = false) {
      let real = 0, ghost = 0;
      const hideDots = state.fixed && state.auxStep < 1; // 문제 탭(풀이 전): 교점 개수가 답이므로 교점 점·라벨을 그리지 않음
      const eps = 1e-9;
      const d = 1 - k;
      if (d >= -eps) {
        const q = Math.sqrt(Math.max(0, d));
        const us = q < eps ? [1] : [1 - q, 1 + q];
        for (const v of us) {
          const x = 1 + v * v, y = x + k;
          const good = v >= -eps;
          if (good) {
            real++;
            if (!hideDots) dDot(toScr(x, y, ox, oy, sc), state.auxStep >= 2 && !state.fixed ? `교점 (${(x + TX).toFixed(2)}, ${(y + TY).toFixed(2)})` : '교점', C.green, { x: 8, y: -12 });
          } else {
            ghost++;
            if (showGhost) {
              dDot(toScr(x, y, ox, oy, sc), `× 무연근 (${(x + TX).toFixed(2)}, ${(y + TY).toFixed(2)})`, C.red, { x: 8, y: 17 });
            }
          }
        }
      }
      if (rational && k * k >= 4 - eps && k > 0) {
        const q = Math.sqrt(Math.max(0, k * k - 4));
        const zs = q < eps ? [-k / 2] : [(-k - q) / 2, (-k + q) / 2];
        for (const z of zs) {
          if (z < -eps) {
            const x = 1 + z, y = x + k;
            real++;
            dDot(toScr(x, y, ox, oy, sc), state.auxStep >= 2 ? `교점 (${x.toFixed(2)}, ${y.toFixed(2)})` : '교점', C.green, { x: 8, y: -12 });
          }
        }
      }
      return { real, ghost };
    }

    // 수학 표기: 짧고 정확한 유리수만 숫자로 확정하고,
    // 임의 조작 중 복잡한 실수값은 정확한 기호식 + ≈ 근삿값으로 나누어 표시한다.
    function shortRational(value, maxDenominator = 24) {
      if (!Number.isFinite(value)) return null;
      for (let den = 1; den <= maxDenominator; den++) {
        const num = Math.round(value * den);
        if (Math.abs(value - num / den) <= 1e-9 && Math.abs(num) <= 999) {
          const gcd = (a, b) => b ? gcd(b, a % b) : Math.abs(a);
          const g = gcd(num, den);
          return { num: num / g, den: den / g };
        }
      }
      return null;
    }

    function rationalText(q) {
      return q.den === 1 ? String(q.num) : `${q.num}/${q.den}`;
    }

    function radicalText(q) {
      if (q.num === 0) return '0';
      const sign = q.num < 0 ? '-' : '';
      const abs = Math.abs(q.num);
      const numerator = abs === 1 ? '√2' : `${abs}√2`;
      return sign + (q.den === 1 ? numerator : `${numerator}/${q.den}`);
    }

  /* ===== 원본 그대로: 심화 8문항 그리기 (원본 1692–2194행; 캔버스 크기 읽기만 설계 좌표 1000×700 으로 대체) ===== */
    function drawScene() {
      const rect = { width: 1000, height: 700 }; // [2.0] 원본은 캔버스 크기를 읽었음. 이제 설계 좌표 기준 1000×700 에 그리고 무대가 화면에 맞춥니다

      const prob = curProb();
      const id = prob.id;
      const VQ = state.vp || DEFP[id] || {}; // 문제·정리 탭에서는 「새 문제」 변형 값, 탐구 탭에서는 원본 값
      const step = state.auxStep;
      const t = state.sliderT;
      const anim = state.animT;
      const baseU = Math.min(rect.width, rect.height) / 11.2;
      const u = baseU * state.scale;
      if (id.startsWith('bas-')) return drawBasicScene(rect, id, step, t, u);

      // -----------------------------------------------------------------------
      // 🔥 [심화 1] adv-1: 유리함수 대칭성(y=x)과 사다리꼴 P₁PQQ₁ 넓이가 같은 도형으로 바꾸기
      // -----------------------------------------------------------------------
      if (id === 'adv-1') {
        const ox = rect.width * 0.23 + state.panX;
        const oy = rect.height * 0.8 + state.panY;
        const sc = u * 0.9;
        drawAxesWithTicks(rect, ox, oy, sc);

        const k = VQ.a * VQ.b;
        const ext = state.vp ? VQ.b + 3 : 9.5;
        dLine(toScr(2, -1, ox, oy, sc), toScr(2, ext, ox, oy, sc), 'rgba(251,191,36,0.45)', 2, [5, 4]);
        dLine(toScr(-1, 2, ox, oy, sc), toScr(ext + 1, 2, ox, oy, sc), 'rgba(251,191,36,0.45)', 2, [5, 4]);
        dCurve((x) => k / (x - 2) + 2, 2.32, ext + 0.7, ox, oy, sc, C.cyan, 3.8);

        const a = state.vp ? VQ.a : 3.4625 - t * 2.25;
        const b = k / a;
        const Cpt = toScr(2, 2, ox, oy, sc);
        const P = toScr(2 + a, 2 + b, ox, oy, sc);
        const Q = toScr(2 + b, 2 + a, ox, oy, sc);
        const P1 = toScr(2 + a, 2, ox, oy, sc);
        const Q1 = toScr(2 + b, 2, ox, oy, sc);
        const H = toScr(2 + a, 2 + a, ox, oy, sc);
        const M = toScr(2 + (a + b) / 2, 2 + (a + b) / 2, ox, oy, sc);
        const gap = b - a;
        const gapRat = shortRational(gap);
        // 길이의 정확한 구조는 언제나 √2를 유지한다.
        // 간단한 유리수 계수만 그대로 표시하고 복잡한 경우에는 기호식과 근삿값을 구분한다.
        const pqExact = gapRat ? `PQ = ${radicalText(gapRat)}` : 'PQ = (b−a)√2';
        const gapExact = gapRat ? `b−a = ${rationalText(gapRat)}` : `b−a ≈ ${gap.toFixed(2)}`;
        const aRat = shortRational(a);
        const bRat = shortRational(b);
        const aText = aRat ? `a = ${rationalText(aRat)}` : `a ≈ ${a.toFixed(2)}`;
        const bText = bRat ? `b = ${rationalText(bRat)}` : `b ≈ ${b.toFixed(2)}`;
        const pExact = aRat && bRat;
        const isIntegerPoint = Number.isInteger(Math.round(a)) && Number.isInteger(Math.round(b))
          && Math.abs(a - Math.round(a)) < 1e-9 && Math.abs(b - Math.round(b)) < 1e-9;
        const pLabel = isIntegerPoint
          ? `P(${2 + Math.round(a)}, ${2 + Math.round(b)})`
          : pExact ? `P(2+${rationalText(aRat)}, 2+${rationalText(bRat)})`
          : `P ≈ (${(2 + a).toFixed(2)}, ${(2 + b).toFixed(2)})`;
        const qLabel = isIntegerPoint
          ? `Q(${2 + Math.round(b)}, ${2 + Math.round(a)})`
          : pExact ? `Q(2+${rationalText(bRat)}, 2+${rationalText(aRat)})`
          : `Q ≈ (${(2 + b).toFixed(2)}, ${(2 + a).toFixed(2)})`;

        dPoly([Cpt, P, Q], 'rgba(56, 189, 248, 0.20)', C.cyan, 2.8, step === 0);
        if (state.fixed) { // 문제에 주어진 값(PQ 길이, 삼각형 넓이)을 그림에도 표시
          if (step !== 1 && step !== 4) drawDimension(P, Q, -26, pqExact, C.gold);
          if (step <= 1) BOARD.text({ x: (Cpt.x + P.x + Q.x) / 3, y: (Cpt.y + P.y + Q.y) / 3 }, `넓이 ${Math.round((a + b) * gap / 2)}`, { color: C.cyan, size: 12.5 * LSf(), weight: 800, align: 'center', baseline: 'middle' });
        }

        if (step === 1 || step === 4) {
          dLine(toScr(0, 0, ox, oy, sc), toScr(ext - 0.3, ext - 0.3, ox, oy, sc), C.gold, 2.4, [6, 4], true);
          dPoly([P, H, Q], 'rgba(251, 191, 36, 0.22)', C.gold, 2.4, true);
          drawRightAngle(H, P, Q, 11, C.gold);
          drawRightAngle(M, Cpt, P, 10, C.gold);
          drawDimension(P, Q, -26, pqExact, C.gold);
          drawDimension(H, Q, 22, gapExact, C.gold);
        }

        // [P1 수리] step > 2(3단계, 4단계 전체보기)에서도 치환 삼각형 Q-Q1-C 보존
        if (step >= 2) {
          dPoly([P1, P, Q, Q1], 'rgba(244, 114, 182, 0.28)', C.pink, 3.2, step === 2);
          drawRightAngle(P1, Cpt, P, 11, C.pink);
          drawRightAngle(Q1, Cpt, Q, 11, C.pink);

          const progress = step === 2 ? anim : 1.0;
          const mP = { x: P.x + (Q.x - P.x) * progress, y: P.y + (Q.y - P.y) * progress };
          const mP1 = { x: P1.x + (Q1.x - P1.x) * progress, y: P1.y };

          dPoly([Cpt, P, P1], 'rgba(52, 211, 153, 0.18)', C.green, 2.0, false);
          dPoly([Cpt, mP, mP1], 'rgba(52, 211, 153, 0.35)', C.green, 2.6, true);

          dDot(P1, 'P₁', C.pink, { x: -8, y: 18 });
          dDot(Q1, 'Q₁', C.pink, { x: -8, y: 18 });
          drawDimension(P1, Q1, 26, `높이: ${gapExact}`, C.pink);
        }

        if (step >= 3) {
          drawDimension(P1, P, -26, bText, C.green);
          drawDimension(Q1, Q, 26, aText, C.green);
        }

        dDot(Cpt, 'C(2, 2)', C.gold, { x: -48, y: 16 });
        dDot(P, step >= 1 ? pLabel : 'P', C.white, { x: 12, y: -6 }, true);
        dDot(Q, step >= 1 ? qLabel : 'Q', C.white, { x: 10, y: -8 });

        const pqLen = (Math.SQRT2 * gap).toFixed(2);
        const areaVal = ((a + b) * gap * 0.5).toFixed(2);
        const exactArea = Math.abs(a - 2) < 1e-9 ? '16' : `≈ ${areaVal}`;
        setMetric(
          `탐구: ${pqExact}${gapRat ? '' : ` ≈ ${pqLen}`} · ${gapExact} · △CPQ 넓이 ${exactArea}`,
          `조건 만족: PQ = 4√2, b−a = 4, △CPQ 넓이 = 16, k = 12`
        );
        return;
      }

      // -----------------------------------------------------------------------
      // 🔥 [심화 2] adv-2: 무리함수와 역함수 사각형 OACB와 불변 길이 AB = 2√2
      // -----------------------------------------------------------------------
      if (id === 'adv-2') {
        const ox = rect.width * 0.24 + state.panX;
        const oy = rect.height * 0.78 + state.panY;
        const sc = u * 1.02;
        drawAxesWithTicks(rect, ox, oy, sc);

        const pVal = state.vp ? VQ.p : 0.3 + t * 2.0;
        const aVal = state.vp ? 1 : pVal;
        const cVal = pVal + 2 + (aVal + Math.sqrt(aVal * aVal + 8 * aVal)) / 2;
        const O = toScr(0, 0, ox, oy, sc);
        const A = toScr(pVal, pVal + 2, ox, oy, sc);
        const B = toScr(pVal + 2, pVal, ox, oy, sc);
        const M = toScr(pVal + 1, pVal + 1, ox, oy, sc);
        const Cpt = toScr(cVal, cVal, ox, oy, sc);
        const E1 = state.vp ? cVal + 0.6 : 5.2, E2 = state.vp ? cVal + 0.8 : 6.6, X6 = state.vp ? cVal + 1.5 : 6.5;
        if (state.vp && step <= 1) BOARD.text({ x: O.x + 14, y: O.y + 26 }, `OACB 넓이 ${2 * (pVal + 4)}`, { color: C.green, size: 12.5 * LSf(), weight: 800, align: 'left', baseline: 'middle' });

        if (step === 1 || step === 4) {
          dLine(toScr(-0.5, 1.5, ox, oy, sc), toScr(E1, E1 + 2, ox, oy, sc), 'rgba(56,189,248,0.5)', 2.2, [5, 4], true);
          dLine(toScr(1.5, -0.5, ox, oy, sc), toScr(E1 + 2, E1, ox, oy, sc), 'rgba(244,114,182,0.5)', 2.2, [5, 4], true);
          if (!state.fixed) drawDimension(A, B, -26, 'AB = 2√2 (p에 무관하게 일정!)', C.gold);
          else if (step === 1) drawDimension(A, B, 46, 'AB = 2√2', C.gold);
          else BOARD.text({ x: A.x - 14, y: A.y + 24 }, 'AB = 2√2', { color: C.gold, size: 12.5 * LSf(), weight: 800, align: 'right', baseline: 'middle' }); // 4단계: 상자를 쓰면 M·OM·MC 와 겹쳐 글자만 선분 곁에
        }

        if (step >= 2) {
          dPoly([O, A, B], 'rgba(56, 189, 248, 0.26)', C.cyan, 2.5, step === 2);
          dPoly([A, Cpt, B], 'rgba(244, 114, 182, 0.26)', C.pink, 2.5, step === 2);
          dLine(toScr(-0.5, -0.5, ox, oy, sc), toScr(E2, E2, ox, oy, sc), C.gold, 2.5, [6, 4], true);
          drawRightAngle(M, O, A, 11, C.gold);
          drawRightAngle(M, Cpt, B, 11, C.gold);
          dDot(M, state.fixed && step < 3 ? 'M' : `M(${f1(pVal + 1)}, ${f1(pVal + 1)})`, C.gold, { x: 10, y: 15 });
        } else {
          dPoly([O, A, Cpt, B], 'rgba(52, 211, 153, 0.18)', C.green, 2.4);
        }

        if (step >= 3) {
          const Mx = toScr(pVal + 1, 0, ox, oy, sc);
          const Cx = toScr(cVal, pVal + 1, ox, oy, sc);
          dPoly([O, Mx, M], 'rgba(251, 191, 36, 0.22)', C.gold, 2.2, true);
          dPoly([M, Cx, Cpt], 'rgba(52, 211, 153, 0.22)', C.green, 2.2, true);
          drawRightAngle(Mx, O, M, 10, C.gold);
          drawRightAngle(Cx, M, Cpt, 10, C.green);
          drawDimension(O, M, state.fixed ? -38 : 24, state.vp ? `OM = ${pVal + 1}√2` : `OM = √2(${(pVal + 1).toFixed(1)})`, C.gold);
          drawDimension(M, Cpt, state.fixed ? -38 : 24, state.vp ? `MC = ${cVal - pVal - 1}√2` : `MC ≈ ${((cVal - pVal - 1) * Math.SQRT2).toFixed(2)}`, C.green);
        }

        dCurve((x) => Math.sqrt(Math.max(0, aVal * (x - pVal))) + pVal + 2, pVal, X6, ox, oy, sc, C.cyan, 3.8);
        dCurve((x) => (x - pVal - 2) ** 2 / aVal + pVal, pVal + 2, X6, ox, oy, sc, C.pink, 3.8);
        dLine(A, B, C.gold, 4.0, [], step === 1);

        dDot(O, 'O(0,0)', C.white, { x: -45, y: 16 });
        dDot(A, state.fixed && step < 3 ? 'A' : `A(${f1(pVal)}, ${f1(pVal + 2)})`, C.cyan, state.fixed && step < 3 ? { x: -22, y: -8 } : { x: -110, y: -10 }, true);
        dDot(B, state.fixed && step < 3 ? 'B' : `B(${f1(pVal + 2)}, ${f1(pVal)})`, C.pink, { x: 10, y: 15 });
        dDot(Cpt, step >= 3 ? `C(${f1(cVal)}, ${f1(cVal)})` : '교점 C', C.gold, { x: 10, y: -8 });

        setMetric(
          `현재 p = ${pVal.toFixed(2)} (탐구 예시 a=p) | AB = 2√2 (불변) | 사각형 넓이 ≈ ${(2 * cVal).toFixed(2)}`,
          `조건 만족: p=1, a=1, C(5,5) ➔ f(10)=6`
        );
        return;
      }

      // -----------------------------------------------------------------------
      // 🔥 [심화 3] adv-3: 유리·무리 결합 함수와 직선 y = x + k 교점 개수 경계 추론
      // -----------------------------------------------------------------------
      if (id === 'adv-3') {
        const ox = rect.width * 0.44 + state.panX;
        const oy = rect.height * 0.62 + state.panY;
        const sc = u * 1.02;
        drawAxesWithTicks(rect, ox, oy, sc);

        dLine(toScr(1, -3, ox, oy, sc), toScr(1, 6, ox, oy, sc), 'rgba(255,255,255,0.25)', 1.6, [4, 4]);
        dLine(toScr(-5, 1, ox, oy, sc), toScr(7, 1, ox, oy, sc), 'rgba(255,255,255,0.25)', 1.6, [4, 4]);

        const S = toScr(1, 1, ox, oy, sc);
        const P = toScr(2, 3, ox, oy, sc);
        const Q = toScr(0, 2, ox, oy, sc);
        const H = toScr(2, 2, ox, oy, sc);

        if (step >= 1) {
          dPoly(
            [toScr(-4, -3, ox, oy, sc), toScr(5, 6, ox, oy, sc), toScr(5, 7, ox, oy, sc), toScr(-4, -2, ox, oy, sc)],
            'rgba(244, 63, 94, 0.16)',
            null,
            0
          );
          dLine(toScr(-4, -3, ox, oy, sc), toScr(5, 6, ox, oy, sc), C.gold, 2.2, [5, 4], step === 1);
          dLine(toScr(-4, -2, ox, oy, sc), toScr(5, 7, ox, oy, sc), C.gold, 2.2, [5, 4], step === 1);
        }

        if (step === 2 || step === 4) {
          dLine(toScr(-3, 5, ox, oy, sc), toScr(4, -2, ox, oy, sc), C.pink, 2.2, [4, 4], true);
          drawRightAngle(Q, S, toScr(1, 3, ox, oy, sc), 10, C.pink);
          dPoly([Q, H, P], 'rgba(52, 211, 153, 0.24)', C.green, 2.6, true);
          drawRightAngle(H, Q, P, 10, C.green);
          drawDimension(Q, P, -22, 'PQ = √5 (PQ² = 5)', C.green);
        }

        if (step >= 3) {
          dCurve((x) => -2 * Math.sqrt(Math.max(0, x - 1)) + 1, 1, 6.5, ox, oy, sc, C.red, 2.6, [5, 4], true);
          dLine(toScr(-4, -4, ox, oy, sc), toScr(6, 6, ox, oy, sc), C.cyan, 2.2, [5, 4], true);
        }

        dCurve((x) => -1 / (x - 1) + 1, -4.8, 0.78, ox, oy, sc, C.pink, 3.8);
        dCurve((x) => 2 * Math.sqrt(Math.max(0, x - 1)) + 1, 1, 6.5, ox, oy, sc, C.cyan, 4.0);

        const k = -1.0 + t * 4.0;
        const counts = plotIntersections(k, ox, oy, sc, true, step >= 3);
        const cnt = counts.real;
        const lineCol = cnt === 0 ? C.red : cnt === 2 ? C.green : C.gold;
        dLine(toScr(-4.5, -4.5 + k, ox, oy, sc), toScr(5.8, 5.8 + k, ox, oy, sc), lineCol, 3.8, [], true);
        dDot(toScr(0, k, ox, oy, sc), `y절편 k=${k.toFixed(2)}`, lineCol, { x: -115, y: -8 }, true);

        // [P2 수리] k=0일 때도 시작점 S(1,1) 라벨 소실 방지
        if (Math.abs(k) < 1e-9) {
          dDot(S, '시작점 S(1,1) [교점]', C.green, { x: 10, y: 15 });
        } else {
          dDot(S, '시작점 S(1,1)', C.white, { x: 10, y: 15 });
        }

        if (step >= 2 && Math.abs(k - 1) > 0.04) dDot(P, '접점 P(2,3)', C.cyan, { x: 10, y: -8 });
        if (step >= 2 && Math.abs(k - 2) > 0.04) dDot(Q, '접점 Q(0,2)', C.pink, { x: -110, y: -8 });

        setMetric(
          `직선 y = x + (${k.toFixed(2)}) ➔ 실제 교점 개수 g(k) = ${cnt}개`,
          `1<k<2에서 0개, 0≤k<1에서 2개 (정수 최솟값 m=0)`
        );
        return;
      }

      // -----------------------------------------------------------------------
      // 🔥 [심화 4] adv-4: 감소하는 꺾인 함수와 역함수의 3교점 대칭삼각형
      // -----------------------------------------------------------------------
      if (id === 'adv-4') {
        const ox = rect.width * 0.48 + state.panX;
        const oy = rect.height * 0.52 + state.panY;
        const sc = u * 0.72;
        drawAxesWithTicks(rect, ox, oy, sc);

        const fPts = [toScr(-6.5, 4.3, ox, oy, sc), toScr(0, 3, ox, oy, sc), toScr(4.5, -6, ox, oy, sc)];
        const invPts = [toScr(4.3, -6.5, ox, oy, sc), toScr(3, 0, ox, oy, sc), toScr(-6, 4.5, ox, oy, sc)];

        const A = toScr(-5, 4, ox, oy, sc);
        const B = toScr(1, 1, ox, oy, sc);
        const Cpt = toScr(4, -5, ox, oy, sc);
        const M = toScr(-0.5, -0.5, ox, oy, sc);

        if (step >= 1) {
          dLine(toScr(-6, -6, ox, oy, sc), toScr(5.5, 5.5, ox, oy, sc), C.gold, 2.2, [6, 4], step === 1);
        }
        if (step >= 2) {
          dPoly([A, B, Cpt], 'rgba(251, 191, 36, 0.22)', C.gold, 2.8, step === 2);
          drawDimension(A, Cpt, -28, '밑변 AC = 9√2', C.gold);
        }
        if (step >= 3) {
          dLine(B, M, C.green, 3.4, [], true);
          drawRightAngle(M, B, A, 12, C.green);
          dDot(M, 'M(-½, -½)', C.green, { x: -85, y: 16 });
          drawDimension(M, B, 24, '높이 BM = (3/2)√2', C.green);
        }

        dLine(fPts[0], fPts[1], C.cyan, 3.8);
        dLine(fPts[1], fPts[2], C.cyan, 3.8);

        if (t > 0.03) {
          const p0 = { x: fPts[0].x + (invPts[0].x - fPts[0].x) * t, y: fPts[0].y + (invPts[0].y - fPts[0].y) * t };
          const p1 = { x: fPts[1].x + (invPts[1].x - fPts[1].x) * t, y: fPts[1].y + (invPts[1].y - fPts[1].y) * t };
          const p2 = { x: fPts[2].x + (invPts[2].x - fPts[2].x) * t, y: fPts[2].y + (invPts[2].y - fPts[2].y) * t };
          dLine(p0, p1, C.pink, 3.5, [5, 3]);
          dLine(p1, p2, C.pink, 3.5, [5, 3]);
        }

        dDot(B, step >= 1 ? '교점 B(1, 1) [y=x 위]' : '교점 B', C.gold, { x: 10, y: -8 });
        if (t > 0.85 || step >= 2) {
          dDot(A, step >= 2 ? '바깥 교점 A(-5, 4)' : '교점 A', C.red, { x: 10, y: -8 }, true);
          dDot(Cpt, step >= 2 ? '바깥 교점 C(4, -5)' : '교점 C', C.red, { x: -115, y: 16 });
        }

        setMetric(
          `대칭이동 진행률: ${Math.round(t * 100)}% | 처음 함수(청색)와 역함수(분홍 점선)의 교점 관찰`,
          `밑변 AC = 9√2, 높이 BM = (3/2)√2 ➔ 넓이 S = 27/2 (2S = 27)`
        );
        return;
      }

      // -----------------------------------------------------------------------
      // 🔥 [심화 5] adv-5: 유리함수와 원 사이의 최단거리 (기울기 +1 대칭축 정렬)
      // -----------------------------------------------------------------------
      if (id === 'adv-5') {
        const ox = rect.width * 0.36 + state.panX;
        const oy = rect.height * 0.68 + state.panY;
        const sc = u * 0.94;
        drawAxesWithTicks(rect, ox, oy, sc);

        const uu = VQ.u, kk = uu * uu, cx0 = VQ.cx, cy0 = VQ.cx + 1, rad = VQ.s * Math.SQRT2; // 곡선 kk/(x-1)+2, 원 중심 (cx0, cy0)(대칭축 y=x+1 위), 반지름 rad
        dLine(toScr(1, cy0 - 2, ox, oy, sc), toScr(1, uu + 5, ox, oy, sc), 'rgba(251,191,36,0.4)', 1.8, [5, 4]);
        dLine(toScr(cx0 - 2, 2, ox, oy, sc), toScr(uu + 6, 2, ox, oy, sc), 'rgba(251,191,36,0.4)', 1.8, [5, 4]);

        const centerA = toScr(cx0, cy0, ox, oy, sc);
        // [2.0] 캔버스에 직접 그리던 원을 무대 호출로 교체
        dCircle(centerA, rad * sc, C.pink, 'rgba(244, 114, 182, 0.20)', 3);

        dCurve((x) => kk / (x - 1) + 2, 1.45, uu + 6.2, ox, oy, sc, C.cyan, 3.8);

        if (step >= 1) {
          dLine(toScr(cx0 - 1.5, cx0 - 0.5, ox, oy, sc), toScr(uu + 4, uu + 5, ox, oy, sc), C.gold, 2.5, [6, 4], true);
        }
        if (step >= 2) {
          dPoly(
            [toScr(1, 2, ox, oy, sc), toScr(1 + uu, 2, ox, oy, sc), toScr(1 + uu, 2 + uu, ox, oy, sc), toScr(1, 2 + uu, ox, oy, sc)],
            'rgba(52, 211, 153, 0.24)',
            C.green,
            2.4,
            step === 2
          );
          drawRightAngle(toScr(1 + uu, 2, ox, oy, sc), toScr(1, 2, ox, oy, sc), toScr(1 + uu, 2 + uu, ox, oy, sc), 10, C.green);
        }

        // 문제 탭에서는 2단계(꼭짓점 찾기) 전까지 점 P 를 최소점이 아닌 임의의 위치에 둡니다(답 노출 방지).
        const px = state.vp ? (step >= 2 ? 1 + uu : 1 + 0.55 * uu) : 1.605 + t * 3.1;
        const py = kk / (px - 1) + 2;
        const P = toScr(px, py, ox, oy, sc);
        const distAP = Math.hypot(px - cx0, py - cy0);
        const qx = cx0 + ((px - cx0) / distAP) * rad;
        const qy = cy0 + ((py - cy0) / distAP) * rad;
        const Q = toScr(qx, qy, ox, oy, sc);

        dLine(P, Q, C.green, 3.8, [], true);
        if (step >= 3) {
          drawDimension(Q, P, -24, state.vp ? `PQ = ${1 + uu - cx0 - VQ.s}√2` : `현재 PQ ≈ ${(distAP - Math.SQRT2).toFixed(2)} (최솟값 3√2)`, C.green);
        }

        dDot(centerA, `원 중심 (${cx0},${cy0})`, C.pink, { x: -95, y: 18 });
        dDot(toScr(1, 2, ox, oy, sc), '점근선 교점 (1,2)', C.gold, { x: -68, y: -8 });
        dDot(Q, 'Q', C.pink, { x: 8, y: 14 });
        dDot(P, state.vp ? (step >= 2 ? `P(${nf(px)}, ${nf(py)})` : 'P') : `P(${px.toFixed(1)}, ${py.toFixed(1)})`, C.white, { x: 10, y: -8 }, true);

        setMetric(
          `현재 P(${px.toFixed(2)}, ${py.toFixed(2)}) | 선분 PQ 길이 ≈ ${(distAP - Math.SQRT2).toFixed(2)}`,
          `P(3,4)일 때 최솟값 m = 3√2 ≈ 4.24 ➔ 정답 = 10`
        );
        return;
      }

      // -----------------------------------------------------------------------
      // 🔥 [심화 6] adv-6: 절댓값 유리함수의 접혀 올라온 점근선과 현의 길이
      // -----------------------------------------------------------------------
      if (id === 'adv-6') {
        const ox = rect.width * 0.32 + state.panX;
        const oy = rect.height * 0.65 + state.panY;
        const sc = u * 0.88;
        drawAxesWithTicks(rect, ox, oy, sc);

        const ap = VQ.p, ac = VQ.c, aq = VQ.q, x0 = ap + ac / aq, xL = ap - 5, xR = x0 + 4.5; // f(x) = |ac/(x-ap) - aq|, x축과 만나는 점 x0
        dLine(toScr(ap, -aq - 1, ox, oy, sc), toScr(ap, aq + 4.5, ox, oy, sc), 'rgba(251,191,36,0.45)', 2, [5, 4]);

        if (step >= 1) {
          dLine(toScr(xL, -aq, ox, oy, sc), toScr(xR, -aq, ox, oy, sc), 'rgba(148,163,184,0.35)', 1.8, [4, 4]);
          dLine(toScr(xL, aq, ox, oy, sc), toScr(xR, aq, ox, oy, sc), C.red, 3.0, [6, 4], true);
        }

        const colFold = step >= 2 ? C.pink : C.cyan;
        dCurve((x) => Math.abs(ac / (x - ap) - aq), xL, ap - 0.7, ox, oy, sc, colFold, 3.6);
        dCurve((x) => ac / (x - ap) - aq, ap + 0.6, x0, ox, oy, sc, C.cyan, 3.8);
        dCurve((x) => -(ac / (x - ap) - aq), x0, xR, ox, oy, sc, colFold, 3.8);

        // [P0 수리] t=0.40에서 정확히 yT=1.00 및 AB=8/3 달성
        // 문제 탭에서는 3단계(AB 길이로 t 찾기) 전까지 직선 y = t 를 임의의 높이에 둡니다(답 노출 방지).
        const yT = state.vp ? (step >= 3 ? VQ.t : (VQ.t < aq / 2 ? 0.75 * aq : 0.3 * aq)) : t <= 0.4 ? 0.2 + 2 * t : t <= 0.75 ? 1 + (t - 0.4) / 0.35 : 2 + 0.5 * (t - 0.75) / 0.17;
        dLine(toScr(xL, yT, ox, oy, sc), toScr(xR, yT, ox, oy, sc), C.gold, 3.2, [], true);
        if (state.vp) BOARD.text(toScr(xL + 0.3, yT, ox, oy, sc), '직선 y = t', { color: C.gold, size: 12.5 * LSf(), weight: 800, align: 'left', dy: -10 });

        let abText = '교점 1개';
        if (Math.abs(yT - aq) > 1e-4) {
          const x1 = yT < aq ? ap + ac / (aq + yT) : ap + ac / (aq - yT);
          const x2 = yT < aq ? ap + ac / (aq - yT) : ap + ac / (aq + yT);
          const A = toScr(x1, yT, ox, oy, sc);
          const B = toScr(x2, yT, ox, oy, sc);
          const distAB = Math.abs(x2 - x1);
          abText = `교점 2개, AB ≈ ${distAB.toFixed(2)}`;
          dLine(A, B, C.green, 4.2, [], step >= 2);
          if (state.vp ? step >= 3 : step >= 2) {
            const abq = shortRational(distAB);
            drawDimension(A, B, state.vp ? 34 : -22, state.vp ? `AB = ${abq ? rationalText(abq) : distAB.toFixed(2)}` : `AB ≈ ${distAB.toFixed(2)}${Math.abs(yT - 1.0) < 1e-9 ? ' (8/3)' : ''}`, C.green);
          }
          dDot(A, 'A', C.cyan, { x: -14, y: -10 });
          dDot(B, 'B', C.pink, { x: 8, y: -10 }, true);
        } else {
          dDot(toScr(ap + ac / (2 * aq), aq, ox, oy, sc), `유일한 교점 (${nf(ap + ac / (2 * aq))},${aq})`, C.green, { x: 9, y: -12 }, true);
        }

        dDot(toScr(x0, 0, ox, oy, sc), `(${nf(x0)}, 0)`, C.white, { x: -12, y: 18 });
        setMetric(
          `가로선 y = ${yT.toFixed(2)} | ${abText}`,
          `접혀 올라온 점근선 k = 2 (교점 1개), t = 1 일 때 AB = 8/3 ➔ k+t = 3`
        );
        return;
      }

      // -----------------------------------------------------------------------
      // 🔥 [심화 7] adv-7: 평행이동한 무리함수 사이의 넓이
      // -----------------------------------------------------------------------
      if (id === 'adv-7') {
        const ox = rect.width * 0.20 + state.panX, oy = rect.height * 0.78 + state.panY, sc = u * 0.94;
        drawAxesWithTicks(rect, ox, oy, sc);
        const shift = state.vp ? VQ.d : 4 * t;
        const cc = VQ.c, ww = VQ.w, hh = cc * Math.sqrt(ww); // 곡선 y = cc√x (0≤x≤ww), 높이 hh
        const pt = (x, y) => toScr(x, y, ox, oy, sc);
        if (step >= 1) dPoly([pt(0, 0), pt(shift, 0), pt(shift + ww, hh), pt(ww, hh)], 'rgba(251,191,36,.15)', C.gold, 2);
        // [2.0] 캔버스에 직접 그리던 두 곡선 사이 영역을 무대 호출로 교체
        {
          const region = [];
          for (let i = 0; i <= 80; i++) { let y = hh * i / 80; region.push(pt(y * y / (cc * cc), y)); }
          for (let i = 80; i >= 0; i--) { let y = hh * i / 80; region.push(pt(y * y / (cc * cc) + shift, y)); }
          dFill(region, 'rgba(52,211,153,.24)');
        }
        dCurve(x => cc * Math.sqrt(x), 0, ww, ox, oy, sc, C.cyan, 4);
        dCurve(x => cc * Math.sqrt(x - shift), shift, shift + ww, ox, oy, sc, C.pink, 4);
        dLine(pt(0, 0), pt(shift, 0), C.white, 2);
        dLine(pt(ww, hh), pt(ww + shift, hh), C.white, 2);
        if (step >= 2) {
          for (let y of [hh / 4, hh / 2, 3 * hh / 4]) dLine(pt(y * y / (cc * cc), y), pt(y * y / (cc * cc) + shift, y), C.gold, 2, [5, 3]);
        }
        if (state.vp) { // 문제에 주어진 값: 평행이동 거리와 위쪽 직선
          drawDimension(pt(ww, hh), pt(ww + shift, hh), 26, `평행이동 ${shift}`, C.white);
          BOARD.text(pt(ww / 2, hh), `y = ${hh}`, { color: C.white, size: 12.5 * LSf(), weight: 800, align: 'center', dy: -12 });
        }
        dDot(pt(0, 0), '(0,0)', C.white, { x: -38, y: 16 });
        dDot(pt(ww, hh), `(${ww},${hh})`, C.cyan, { x: -35, y: -10 });
        dDot(pt(shift + ww, hh), `(${f1(shift + ww)}, ${hh})`, C.pink, { x: 8, y: -10 }, true);
        setMetric(
          `평행이동 거리 d = ${shift.toFixed(2)} | 같은 높이의 가로 간격 = ${shift.toFixed(2)}`,
          `d = 4일 때 둘러싸인 넓이 = 4 × 4 = 16`
        );
        return;
      }

      // -----------------------------------------------------------------------
      // 🔥 [심화 8] adv-8: 두 직선으로 이루어진 함수에서 f(f(x))=f(x) vs f(f(x))=x 비교
      // -----------------------------------------------------------------------
      const L8 = VQ.h / 2, H8 = VQ.h; // 원본 그림(h=2)의 L8 배 확대 모양
      const toS8 = (x, y, o1, o2, s2) => toScr(x * L8, y * L8, o1, o2, s2);
      const ox = rect.width * 0.3 + state.panX;
      const oy = rect.height * 0.78 + state.panY;
      const sc = u * 1.15;
      drawAxesWithTicks(rect, ox, oy, sc);

      const p0 = toS8(0, 0, ox, oy, sc);
      const p2 = toS8(2, 4, ox, oy, sc);
      const p4 = toS8(4, 0, ox, oy, sc);
      dLine(p0, p2, C.cyan, 4.0);
      dLine(p2, p4, C.cyan, 4.0);
      dLine(toS8(-0.4, -0.4, ox, oy, sc), toS8(4.4, 4.4, ox, oy, sc), 'rgba(255,255,255,0.45)', 2.2, [5, 4]);

      // [P1 수리] 슬라이더 t에 반응하도록 동기화
      const showStep1 = step >= 1 || t >= 0.15;
      const showStep2 = step >= 2 || (t >= 0.35 && t <= 0.85);
      const showStep3 = step >= 3 || t > 0.75;

      if (showStep1) {
        dDot(toS8(0, 0, ox, oy, sc), 't₁=0', C.gold, { x: -35, y: 16 });
        dDot(toS8(8 / 3, 8 / 3, ox, oy, sc), `t₂ = ${frV(4 * H8, 3)}`, C.gold, { x: 10, y: -8 });
      }
      if (showStep2) {
        dLine(toS8(2, -0.4, ox, oy, sc), toS8(2, 4.4, ox, oy, sc), 'rgba(251,191,36,0.55)', 2, [4, 4]);
        dLine(toS8(-0.3, 8 / 3, ox, oy, sc), toS8(4.3, 8 / 3, ox, oy, sc), C.gold, 3.0, [], true);
        const r1 = toS8(4 / 3, 8 / 3, ox, oy, sc);
        const r2 = toS8(8 / 3, 8 / 3, ox, oy, sc);
        dDot(r1, `x₁=${frV(2 * H8, 3)}`, C.gold, { x: -48, y: -10 });
        drawDimension(r1, r2, -22, `대칭축 x=${H8} 대칭 ➔ 두 근의 합 = ${2 * H8}`, C.gold);
      }
      if (showStep3) {
        const q0 = toS8(0, 0, ox, oy, sc);
        const q1 = toS8(1, 4 * anim, ox, oy, sc);
        const q2 = toS8(2, 0, ox, oy, sc);
        const q3 = toS8(3, 4 * anim, ox, oy, sc);
        const q4 = toS8(4, 0, ox, oy, sc);
        dLine(q0, q1, C.pink, 3.4, [5, 3], true);
        dLine(q1, q2, C.pink, 3.4, [5, 3], true);

  /* ===== 원본 그대로: 기본 16문항 그리기 (원본 2196–2737행) ===== */

    function drawBasicScene0(rect, id, step, t, u) {

          `왼쪽 기울기 m₁ = +2 | 오른쪽 기울기 m₂ = ${m2.toFixed(2)}`,

        );

      // -----------------------------------------------------------------------

          if (!hide9) dDot(toScr(p, q, ox, oy, sc), `C(${p}, ${q}) [처음 함수]`, C.cyan, { x: -110, y: -10 });

          if (t > 0.1 || step >= 2) {
            const pInv = VQ.a, qInv = VQ.c;
            dLine(toScr(pInv, -5, ox, oy, sc), toScr(pInv, 7, ox, oy, sc), 'rgba(244,114,182,0.4)', 2.0, [5, 4]);
            dLine(toScr(-5, qInv, ox, oy, sc), toScr(7, qInv, ox, oy, sc), 'rgba(244,114,182,0.4)', 2.0, [5, 4]);
            dCurve((x) => kVal / (x - pInv) + qInv, -5, pInv - 0.2, ox, oy, sc, C.pink, 3.6, [5, 3]);
            dCurve((x) => kVal / (x - pInv) + qInv, pInv + 0.2, 7, ox, oy, sc, C.pink, 3.6, [5, 3]);
            dDot(toScr(pInv, qInv, ox, oy, sc), `C'(${pInv}, ${qInv}) [역함수]`, C.pink, { x: 10, y: 15 });
          }

          setMetric(
            `처음 함수 f(x)[청색, 중심(1,2)] ↔ 역함수 f⁻¹(x)[분홍 점선, 중심(2,1)]`,
            `표준형: 3/(x-1)+2 | 역함수: (x+1)/(x-2)`
          );
          return;
        }

        const p = VQ.p, q = VQ.q;
        const kVal = state.fixed ? VQ.k : id === 'bas-8' ? (t < 0.4 ? -4 : t >= 0.8 ? 8 : 4) : 4;
        const Cpt = toScr(p, q, ox, oy, sc);
        const hideAs = state.fixed && id === 'bas-8' && step < 1; // 문제 탭(bas-8): 1단계(점근선) 전에는 점근선·중심을 그리지 않음

        if (!hideAs) {
          dLine(toScr(p, q - 7, ox, oy, sc), toScr(p, q + 5, ox, oy, sc), C.gold, 2.2, [5, 4]);
          dLine(toScr(p - 6, q, ox, oy, sc), toScr(p + 6, q, ox, oy, sc), C.gold, 2.2, [5, 4]);
          drawRightAngle(Cpt, toScr(p + 2, q, ox, oy, sc), toScr(p, q + 2, ox, oy, sc), 10, C.gold);
        }

        if (id === 'bas-8' && step >= 2) {
          dLine(toScr(-4, -4 - p + q, ox, oy, sc), toScr(6, 6 - p + q, ox, oy, sc), C.cyan, 2.4, [4, 4], true);
          if (step >= 3) {
            dLine(toScr(-4, 4 + p + q, ox, oy, sc), toScr(6, -6 + p + q, ox, oy, sc), C.pink, 2.4, [4, 4], true);
          }
        }

        dCurve((x) => kVal / (x - p) + q, p - 6, p - 0.2, ox, oy, sc, C.green, 3.8);
        dCurve((x) => kVal / (x - p) + q, p + 0.2, p + 6, ox, oy, sc, C.green, 3.8);
        if (!hideAs) dDot(Cpt, `점근선 교점 C(${p}, ${q})`, C.gold, { x: 10, y: 16 }, true);

        // [P2 수리] bas-11에서 step=0에서도 프리셋 선택에 따라 약수 쌍 정상 필터링
        if (id === 'bas-11') {
          const dv = [];
          for (let i = 1; i <= VQ.k; i++) if (VQ.k % i === 0) dv.push(i); // k의 양의 약수(작은 것부터)
          const pairs = [];
          dv.forEach((d) => { pairs.push([p - d, q - VQ.k / d]); pairs.push([p + d, q + VQ.k / d]); });
          const d1 = dv[0], d2 = dv[1] == null ? dv[0] : dv[1]; // 1단계: 가장 작은 약수 쌍, 2단계: 그다음 쌍
          pairs.forEach(([gx, gy]) => {
            const diff = Math.abs(gx - p);
            const showThis = step >= 3 || (step === 1 && diff === d1) || (step === 2 && diff === d2) || (!state.fixed && step === 0 && (t >= 0.8 || (t < 0.45 && diff === d1) || (t >= 0.45 && t < 0.8 && diff === d2)));
            if (!showThis) return;
            const G = toScr(gx, gy, ox, oy, sc);
            if ((step >= 2 || (!state.fixed && step === 0 && t >= 0.45)) && diff === d2) {
              dPoly([Cpt, toScr(gx, q, ox, oy, sc), G, toScr(p, gy, ox, oy, sc)], 'rgba(56,189,248,0.2)', C.cyan, 1.8);
            }
            dDot(G, `(${gx},${gy})`, C.cyan, { x: 8, y: -6 });
          });
          setMetric(
            `유리함수 $y=\\frac{4}{x-1}+2$ 위의 정수 좌표 점 탐색 (선택된 약수 쌍 표시)`,
            `분모 (x-1)이 4의 약수(±1, ±2, ±4)인 총 6개 점`
          );
          return;
        }

        setMetric(
          `현재 유리함수: $y = \\frac{${kVal}}{x-${p}} + ${q}$ | 점근선 교점 (${p}, ${q})`,
          `점대칭: (1, 2) | 선대칭: y = x + 1, y = -x + 3`
        );
        return;
      }

      if (id === 'bas-10') {
        const ox = rect.width * 0.28 + state.panX;
        const oy = rect.height * 0.74 + state.panY;
        const sc = u * 1.02;
        drawAxesWithTicks(rect, ox, oy, sc);

        const kk = VQ.k, p0 = VQ.p, q0 = VQ.q, rt = Math.sqrt(kk); // y = kk/(x−p0) + q0 (x > p0)
        dLine(toScr(p0, q0 - 3, ox, oy, sc), toScr(p0, q0 + 6.5, ox, oy, sc), C.gold, 2.2, [5, 4]);
        dLine(toScr(p0 - 3, q0, ox, oy, sc), toScr(p0 + 7.5, q0, ox, oy, sc), C.gold, 2.2, [5, 4]);
        dCurve((x) => kk / (x - p0) + q0, p0 + 0.35, p0 + 2.2 * rt + 2.8, ox, oy, sc, C.cyan, 3.8);

        // 문제 탭에서는 3단계(정사각형) 전까지 점 P 를 정사각형이 아닌 위치에 둡니다(답 노출 방지).
        const px = state.vp ? (step >= 3 ? p0 + rt : p0 + VQ.g) : p0 + 0.6 + t * 4.0;
        const py = kk / (px - p0) + q0;
        const Cpt = toScr(p0, q0, ox, oy, sc);
        const P = toScr(px, py, ox, oy, sc);
        const A = toScr(px, q0, ox, oy, sc);
        const B = toScr(p0, py, ox, oy, sc);

        dPoly([Cpt, A, P, B], 'rgba(56, 189, 248, 0.26)', C.cyan, 3.0, true);
        drawRightAngle(A, Cpt, P, 10, C.cyan);
        drawRightAngle(B, Cpt, P, 10, C.cyan);

        if (step >= 1) {
          drawDimension(Cpt, A, state.fixed ? 54 : 24, `가로 a = ${state.fixed ? nf(px - p0) : (px - p0).toFixed(2)}`, C.cyan);
          drawDimension(Cpt, B, state.fixed ? -44 : -28, `세로 b = ${state.fixed ? nf(py - q0) : (py - q0).toFixed(2)}`, C.cyan);
        }
        if (step >= 2) dLine(Cpt, P, C.cyan, 2, [4, 4]);
        if (step >= 3) {
          dLine(toScr(p0 - 1, q0 - 1, ox, oy, sc), toScr(p0 + 5.5, q0 + 5.5, ox, oy, sc), C.green, 2.4, [5, 4], true);
          dLine(Cpt, P, C.gold, 3.2, [], true);
        }

        dDot(Cpt, `C(${p0}, ${q0})`, C.gold, { x: -48, y: 16 });
        dDot(A, 'A', C.cyan, { x: -6, y: 18 });
        dDot(B, 'B', C.cyan, { x: -18, y: 4 });
        dDot(P, state.vp ? (step >= 3 ? `P(${nf(px)}, ${nf(py)})` : 'P') : `P(${px.toFixed(1)}, ${py.toFixed(1)})`, C.pink, { x: 10, y: -8 }, true);

        const perim = 2 * (px - 1 + py - 1);
        setMetric(
          `가로 = ${(px - 1).toFixed(2)}, 세로 = ${(py - 1).toFixed(2)} | 현재 둘레 ≈ ${perim.toFixed(2)}`,
          `넓이 = 4 (일정), 정사각형 P(3,3)에서 최소 둘레 = 8`
        );
        return;
      }

      // -----------------------------------------------------------------------
      // 🌱 [기본 12 & 13] bas-12, bas-13
      // -----------------------------------------------------------------------
      if (id === 'bas-12') {
        const ox = rect.width * 0.32 + state.panX;
        const oy = rect.height * 0.74 + state.panY;
        const sc = u * 0.95;
        drawAxesWithTicks(rect, ox, oy, sc);

        const { k: kc, x1: xa, x2: xb, q: qc } = VQ; // y = kc/(x−1) + qc (xa ≤ x ≤ xb), 직선 y = mx + qc
        const yA = kc / (xa - 1) + qc, yB = kc / (xb - 1) + qc;
        const mHi = kc / (xa * (xa - 1)), mLo = kc / (xb * (xb - 1));
        dCurve((x) => kc / (x - 1) + qc, 1.35, xb + 3.5, ox, oy, sc, 'rgba(56,189,248,0.32)', 2.4);
        dCurve((x) => kc / (x - 1) + qc, xa, xb, ox, oy, sc, C.gold, 5.5, [], true);

        const P0 = toScr(0, qc, ox, oy, sc);
        const A = toScr(xa, yA, ox, oy, sc);
        const B = toScr(xb, yB, ox, oy, sc);
        const A15 = toScr(1.5 * xa, qc + 1.5 * (yA - qc), ox, oy, sc); // 정점에서 끝점 A, B 를 지나 뻗은 선
        const B15 = toScr(1.5 * xb, qc + 1.5 * (yB - qc), ox, oy, sc);

        if (step >= 2) {
          dPoly([P0, A15, B15], 'rgba(251, 191, 36, 0.15)', null, 0);
          dLine(P0, A15, C.cyan, 2.4, [5, 4], true);
        }
        if (step >= 3) {
          dLine(P0, B15, C.pink, 2.4, [5, 4], true);
        }

        // 문제 탭에서는 두 끝 기울기의 한가운데 기울기로 예시 직선을 그립니다(범위의 끝을 보여 주지 않음).
        const m = state.fixed ? (mLo + mHi) / 2 : 1 / 3 + t * (5 / 3);
        dLine(toScr(-1, qc - m, ox, oy, sc), toScr(xb + 2, qc + (xb + 2) * m, ox, oy, sc), C.green, 3.8, [], true);
        const ptxt = (n, d) => frV(n, d);
        dDot(P0, `정점 P₀(0,${qc})`, C.white, { x: -95, y: -6 });
        dDot(A, state.fixed && step < 1 ? '끝점 A' : step >= 2 ? `끝점 A(${xa},${ptxt(kc + qc * (xa - 1), xa - 1)}) [최대 m=${ptxt(kc, xa * (xa - 1))}]` : `끝점 A(${xa},${ptxt(kc + qc * (xa - 1), xa - 1)})`, C.cyan, { x: 10, y: -8 }, true);
        dDot(B, state.fixed && step < 1 ? '끝점 B' : step >= 3 ? `끝점 B(${xb},${ptxt(kc + qc * (xb - 1), xb - 1)}) [최소 m=${ptxt(kc, xb * (xb - 1))}]` : `끝점 B(${xb}, ${ptxt(kc + qc * (xb - 1), xb - 1)})`, C.pink, { x: 10, y: 15 });

        setMetric(
          `현재 직선 기울기 m = ${m.toFixed(2)}`,
          `구간 [2, 4]에서 만나는 기울기 범위: 1/3 ≤ m ≤ 2`
        );
        return;
      }

      if (id === 'bas-13') {
        const ox = rect.width * 0.44 + state.panX;
        const oy = rect.height * 0.62 + state.panY;
        const sc = u * 0.92;
        drawAxesWithTicks(rect, ox, oy, sc);

        const k13 = VQ.k, q13 = VQ.q, mt13 = -(q13 * q13) / (4 * k13); // y = k13/(x−1) + q13, 접선 기울기 mt13
        const tx13 = 1 - 2 * k13 / q13, ty13 = q13 / 2, x013 = 1 - k13 / q13;
        dLine(toScr(1, -3, ox, oy, sc), toScr(1, q13 + 5, ox, oy, sc), C.gold, 1.8, [5, 4]);
        dLine(toScr(-5, q13, ox, oy, sc), toScr(7, q13, ox, oy, sc), C.gold, 1.8, [5, 4]);
        dCurve((x) => k13 / (x - 1) + q13, -5, 0.7, ox, oy, sc, C.cyan, 3.8);
        dCurve((x) => k13 / (x - 1) + q13, 1.3, 7, ox, oy, sc, C.cyan, 3.8);

        if (step >= 2) {
          if (state.fixed) dLine(toScr(tx13 - 1.5, mt13 * (tx13 - 2.5), ox, oy, sc), toScr(3.5, mt13 * 2.5, ox, oy, sc), C.gold, 2.2, [5, 4]);
          else dLine(toScr(-4, 2.5, ox, oy, sc), toScr(6, -2.5, ox, oy, sc), C.gold, 2.2, [5, 4]);
          dDot(toScr(tx13, ty13, ox, oy, sc), `접점 (${nf(tx13)},${nf(ty13)}) [m=${frV(-(q13 * q13), 4 * k13)}]`, C.gold, { x: -125, y: -10 });
        }
        if (step >= 3) {
          dLine(toScr(-5, 0, ox, oy, sc), toScr(7, 0, ox, oy, sc), C.red, 2.6, [5, 4], true);
          dDot(toScr(x013, 0, ox, oy, sc), `교점 (${nf(x013)},0) [m=0 점근선 평행]`, C.red, { x: -165, y: 18 });
        }

        const m = state.fixed ? 0.5 : Math.abs(t - 0.35) < 0.08 ? -0.5 : Math.abs(t - 0.65) < 0.08 ? 0 : -1.0 + t * 2.0; // 문제 탭: 예시 직선(m=1/2)
        const isOne = Math.abs(m + 0.5) < 1e-9 || Math.abs(m) < 1e-9;
        const cnt = isOne ? 1 : (m > -0.5 ? 2 : 0);
        if (!(state.fixed && step >= 2)) dLine(toScr(-4.5, -5.5 * m, ox, oy, sc), toScr(6.5, 5.5 * m, ox, oy, sc), isOne ? C.green : C.pink, 3.8, [], true);
        dDot(toScr(1, 0, ox, oy, sc), '정점 (1,0)', C.white, { x: 10, y: 16 });

        // [P2 수리] 회전하는 직선 위의 점에 조작 핸들을 달아 지렛대 회전 직관성 부여
        const guideX = 3.5;
        const guideY = m * (guideX - 1);
        if (!(state.fixed && step >= 2)) dDot(toScr(guideX, guideY, ox, oy, sc), state.fixed ? '직선 y = m(x − 1)' : `기울기 m=${m.toFixed(2)}`, isOne ? C.green : C.pink, { x: 10, y: -8 }, true);

        setMetric(
          `현재 기울기 m = ${m.toFixed(2)} ➔ 교점 ${cnt}개`,
          `오직 한 점에서 만날 조건: m = -1/2 (접선) 또는 m = 0 (점근선 평행)`
        );
        return;
      }

      // -----------------------------------------------------------------------
      // 🌱 [기본 14 ~ 16] bas-14 ~ bas-16: 무리함수 4방향 · 무연근 · 절댓값 무리함수
      // -----------------------------------------------------------------------
      const ox = rect.width * 0.4 + state.panX;
      const oy = rect.height * 0.62 + state.panY;
      const sc = u * 1.02;
      drawAxesWithTicks(rect, ox, oy, sc);

      if (id === 'bas-14') {
        const bp = VQ.p, bq = VQ.q, ba = VQ.a; // 시작점 S(bp, bq), 네 함수 y = ±√(±ba(x−bp)) + bq
        dCurve((x) => Math.sqrt(Math.max(0, ba * (x - bp))) + bq, bp, bp + 5.8, ox, oy, sc, C.cyan, 4.2);
        if (step >= 2 || t >= 0.5) {
          dCurve((x) => Math.sqrt(Math.max(0, -ba * (x - bp))) + bq, bp - 5.8, bp, ox, oy, sc, C.pink, 3.8);
          dCurve((x) => -Math.sqrt(Math.max(0, -ba * (x - bp))) + bq, bp - 5.8, bp, ox, oy, sc, C.green, 3.8);
          dCurve((x) => -Math.sqrt(Math.max(0, ba * (x - bp))) + bq, bp, bp + 5.8, ox, oy, sc, C.gold, 3.8);
        }
        if (step >= 3 || t >= 0.9) {
          // 네 무리함수의 합동을 설명하는 두 반사축.
          dLine(toScr(bp, bq - 5, ox, oy, sc), toScr(bp, bq + 5.5, ox, oy, sc), 'rgba(251,191,36,0.5)', 1.8, [5, 5]);
          dLine(toScr(bp - 6, bq, ox, oy, sc), toScr(bp + 6, bq, ox, oy, sc), 'rgba(251,191,36,0.5)', 1.8, [5, 5]);
          dLine(toScr(Math.min(bp, bq) - 3, Math.min(bp, bq) - 3, ox, oy, sc), toScr(Math.max(bp, bq) + 5, Math.max(bp, bq) + 5, ox, oy, sc), 'rgba(255,255,255,0.45)', 2, [5, 4]);
          dCurve((x) => (x - bq) ** 2 / ba + bp, bq, bq + 3.5, ox, oy, sc, C.purple, 3.5, [5, 3], true);
        }
        dDot(toScr(bp, bq, ox, oy, sc), `시작점 S(${bp}, ${bq})`, C.white, { x: -45, y: -12 }, true);
        setMetric(
          `시작점 S(1,1) 기준 부호쌍 (±, ±)에 따른 그래프 방향`,
          `(+,+) 우상향 · (-,+) 좌상향 · (-,-) 좌하향 · (+,-) 우하향`
        );
        return;
      }

      if (id === 'bas-16') {
        if (step >= 1) dLine(toScr(1, -3, ox, oy, sc), toScr(1, 6, ox, oy, sc), 'rgba(255,255,255,0.28)', 1.6, [4, 4]);
        if (step >= 2) dLine(toScr(-4, -5, ox, oy, sc), toScr(6, 5, ox, oy, sc), 'rgba(56,189,248,0.5)', 2, [5, 4]);
        if (step >= 3) dLine(toScr(-4, -4, ox, oy, sc), toScr(6, 6, ox, oy, sc), 'rgba(251,191,36,0.5)', 2, [5, 4]);

        dCurve((x) => 2 * Math.sqrt(Math.abs(x - 1)), -4.8, 1, ox, oy, sc, C.cyan, 3.8);
        dCurve((x) => 2 * Math.sqrt(Math.abs(x - 1)), 1, 6.8, ox, oy, sc, C.cyan, 3.8);

        const k = state.fixed ? (step >= 3 ? -0.5 : 0.6) : 0.4 - t * 1.8; // 문제 탭: 3단계 전에는 교점 1개인 예시 직선
        const isThree = k > -1.0 && k < 0.0;
        const cnt = k > 0 ? 1 : (Math.abs(k) < 1e-9 || Math.abs(k + 1) < 1e-9 ? 2 : (isThree ? 3 : 1));
        dLine(toScr(-4, -4 + k, ox, oy, sc), toScr(6, 6 + k, ox, oy, sc), isThree ? C.green : C.gold, 3.8, [], true);
        dDot(toScr(1, 0, ox, oy, sc), step >= 2 ? `점 (${VQ.p},0) [k=${-VQ.p}]` : `점 (${VQ.p},0)`, C.gold, { x: -45, y: 18 }, true);

        setMetric(
          `직선 y = x + (${k.toFixed(2)}) ➔ 교점 ${cnt}개`,
          `서로 다른 3개의 점에서 만날 조건: -1 < k < 0`
        );
        return;
      }

      // bas-15: 무리함수와 직선의 교점
      if (step >= 3) {
        dCurve((x) => -2 * Math.sqrt(Math.max(0, x - 1)) + 1, 1, 6.8, ox, oy, sc, C.red, 2.8, [6, 4], true);
      }
      if (step >= 1) dLine(toScr(-3.5, -3.5, ox, oy, sc), toScr(6, 6, ox, oy, sc), 'rgba(56,189,248,0.55)', 2, [5, 4]);
      if (step >= 2) dLine(toScr(-3.5, -2.5, ox, oy, sc), toScr(6, 7, ox, oy, sc), 'rgba(251,191,36,0.55)', 2, [5, 4]);

      dCurve((x) => 2 * Math.sqrt(Math.max(0, x - 1)) + 1, 1, 6.8, ox, oy, sc, C.cyan, 4.2);

      const k = state.fixed ? 0.5 : 1.4 - t * 2.2; // 문제 탭: 예시 직선(옮긴 그림 기준 k=0.5)
      const counts = plotIntersections(k, ox, oy, sc, false, step >= 3);
      const isTwo = counts.real === 2 && !(state.fixed && step < 1); // 풀이 전에는 교점 수를 색으로도 알리지 않음
      dLine(toScr(-3.5, -3.5 + k, ox, oy, sc), toScr(6, 6 + k, ox, oy, sc), isTwo ? C.green : C.gold, 3.8, [], true);
      const sk = VQ.q - VQ.p; // 시작점을 지나는 직선의 k
      dDot(toScr(1, 1, ox, oy, sc), step >= 1 ? `시작점 S(${VQ.p},${VQ.q}) [k=${sk}]` : `시작점 S(${VQ.p},${VQ.q})`, C.cyan, { x: 10, y: 15 });
      if (step >= 2) {
        dDot(toScr(2, 3, ox, oy, sc), `접점 (${VQ.p + 1},${VQ.q + 2}) [k=${sk + 1}]`, C.gold, { x: -105, y: -8 }, true);
      } else {
        dDot(toScr(0, k, ox, oy, sc), state.fixed ? '직선 y = x + k' : `y절편 k=${k.toFixed(2)}`, isTwo ? C.green : C.gold, { x: -110, y: -8 }, true);
      }

      setMetric(
        `직선 y = x + (${k.toFixed(2)}) ➔ 실제 교점 ${counts.real}개`,
        `무연근 ${counts.ghost}개 | 서로 다른 두 점 교차 범위: 0 ≤ k < 1`
      );
    }

  /* ==========================================================================
     「새 문제」 변형 (옛 장면 → 문제 탭·정리 탭 전용). 탐구 탭의 그림·문구·조작은 그대로입니다.

  // 장면 제목에 식이 들어 있는 장면(VSPEC.vtitle): 문제·정리 탭에서 「새 문제」 변형을 보는 동안은 제목도 그 식으로 바꿔 보여 줍니다.
  function titleV(L) {

    if (!el) return;
    if (el.dataset.orig == null) el.dataset.orig = el.innerHTML;
    const S = VSPEC[sc.id];
    try {
      if (L.tab !== 'explore' && !sc.vary.isBase() && S && S.vtitle) {

        el.innerHTML = (tt.flag ? `<span class="apl-tag" style="--c:var(--m-rose);margin-right:6px;vertical-align:3px">${APLab.esc(tt.flag)}</span>` : '') + APLab.renderMath(APLab.esc(tt.text));

  }
  document.addEventListener('click', (ev) => {
    const hit = ev.target && ev.target.closest && ev.target.closest('[data-old-new]');

    if (!sc || !sc.vary) return;

  });

  const clampStep = (s) => Math.min(Math.max(s.step || 0, 0), MAX_STEP);
  const pOf = (id) => PROBLEMS.find((p) => p.id === id) || PROBLEMS[0];
  function sync(s, idx) {
    state.probIdx = idx;
    state.auxStep = clampStep(s);
    state.sliderT = s.t;
    state.animT = s.anim == null ? 1 : s.anim;

    state.panX = 0;
    state.panY = 0;
  }
  // 원본 refreshBoardTabs 의 풀이 이름 규칙
  const geoLabel = (p) => (p.id === 'adv-3' ? '핵심 풀이' : p.id.startsWith('adv') ? '효율적인 풀이' : '단계별 풀이');
  // 문제 지문 맨 끝의 굵은 물음("…구하시오.")을 탐구 질문 자리에 둡니다.
  const askOf = (p) => {
    const m = p.statement.match(/<div class="mt-1\.5 font-bold text-amber-300">([\s\S]*?)<\/div>/g);

  };

  const params = {
    t: { value: 0.5, min: 0, max: 1, step: 0.005, color: 'amber', label: '도형 조작',
      format: (v, s) => { state.auxStep = clampStep(s); return getParamReadout(pOf(window.lab && window.lab.scene.id), v); } }
  };

  function sceneOf(p, idx) {
    const solT = solutionSlider(p.id);
    const vs = VSPEC[p.id], vary = VARY[p.id];
    const isVar = () => !!vary && !vary.isBase();
    // 「새 문제」가 있는 장면: 첫 문제는 원본 그대로, 이후는 변형(vs.*). 문제·정리 탭에서만 변형을 씁니다.

      ...stepsOf().map((x) => `🪄 [${x.title}] ${x.desc.replace(/<br\s*\/?>/g, ' ').replace(/\$[^$]*\$/g, (m) => m.replace(/</g, '\\lt ').replace(/>/g, '\\gt '))}`),
      '✨ [전체 보조선 보기] 풀이에 쓴 보조선과 길이 표시가 모두 나옵니다.'

      id: p.id, title: arrow(p.title), short: arrow(p.tabLabel), reviewTab: true, autoFit: true,

      startStep: 0,
      enter: (s, lab) => {
        s.t = p.defaultT;
        s.anim = 1;
        // 미리보기가 다른 장면의 enter 를 부를 때는 지금 장면의 조절 막대 이름을 바꾸지 않습니다.

      },
      controls: () => ['t'],
      presets: (s) => p.snaps.map((sn) => ({
        group: '바로 가기',

      },

      problem: {
        tag: cv(arrow(p.badge)),

      },
      view: (s, lab) => {

      draw: (b, s, v, lab) => {

        CUR = s;
        // 문제·정리 탭(「새 문제」가 있는 장면): 탐구 슬라이더 위치가 아니라 변형의 조건대로, 끌 점 없이 그립니다.

        const paintAll = () => {

        // 단계가 '완성' 단계(STEP_T.from) 이상이 되면 조절 막대도 완성 위치로 함께 보냅니다(되돌릴 때는 처음 위치로).
        const sp = STEP_T[p.id];

      }

  }
  const LAST = { id: null, step: null };
  // 조절 막대가 곧 '완성도'인 장면: 보조선 단계가 from 이상이면 막대를 t 로 맞춥니다. (기본 4: 합성함수 그래프 작도)

  const UNITS = [
    { roman: 'Ⅰ', title: 'Ⅰ. 합성함수와 역함수', short: '합성·역함수' },
    { roman: 'Ⅱ', title: 'Ⅱ. 유리함수의 기하학', short: '유리함수' },
    { roman: 'Ⅲ', title: 'Ⅲ. 유리함수와 직선', short: '유리함수와 직선' },
    { roman: 'Ⅳ', title: 'Ⅳ. 무리함수', short: '무리함수' }
  ];
  const unitOf = (p) => UNITS.findIndex((u) => p.unit.startsWith(u.roman));
  const rank = (p) => (p.id.startsWith('bas') ? 0 : 100) + parseInt(p.id.split('-')[1], 10); // 묶음 안에서는 기본 → 심화 순서
  const groups = UNITS.map((u, ui) => ({
    id: 'u' + (ui + 1), title: u.title, short: u.short,
    scenes: PROBLEMS.map((p, i) => ({ p, i })).filter((x) => unitOf(x.p) === ui).sort((a, b) => rank(a.p) - rank(b.p)).map((x) => sceneOf(x.p, x.i))
  }));

  /* ==========================================================================
     B9 추가 장면 5개 (합성함수 · 역함수 · 일대일대응) — 고1 학평·학교 기출(공통수학2 함수 단원)에서 반복된 유형의 기출 변형
     새로 작성한 장면입니다(원본 24문항 코드는 건드리지 않음). 수학 좌표 무대(boardKind:'cartesian')를 장면별로 씁니다.
       ① 화살표 대응에서 합성함수·역함수 값 따라가기  ② 구간별 일차함수의 일대일대응(가로선 시험)

  const B9 = (function () {
    const tex = APLab.tex, clamp = APLab.clamp;
    const rint = (n) => Math.floor(Math.random() * n);
    const pickOf = (arr, prev) => { if (arr.length < 2) return arr[0]; let x; do { x = arr[rint(arr.length)]; } while (x === prev); return x; };
    const mn = (n) => String(Math.round(n * 100) / 100).replace('-', '−');
    const addT = (n) => (n > 0 ? '+' + n : n < 0 ? '-' + (-n) : '');
    const lin = (a, b, v = 'x') => { let s = ''; if (a !== 0) s += a === 1 ? v : a === -1 ? '-' + v : a + v; if (b !== 0) s += s ? (b > 0 ? '+' + b : '-' + (-b)) : String(b); return s || '0'; };
    function varier(gen) { // 직전과 같은 문제가 연달아 나오지 않게 합니다

    }
    const probHTML = (body) => `${body}<div style="margin-top:10px"><button type="button" class="apl-btn sm" data-b9-new>새 문제</button></div>`;
    document.addEventListener('click', (ev) => {
      const hit = ev.target && ev.target.closest && ev.target.closest('[data-b9-new]');
      if (!hit) return;
      const lab = window.lab, sc = lab && lab.scene;
      if (!sc || !sc.vary) return;
      sc.vary.next();
      lab.s.revealed = false;
      lab.setStep(1);

    });
    const stepOf = (lab, s) => (lab.tab === 'problem' ? 0 : lab.tab === 'review' ? s.step : 99);
    const probBox = (v) => `<div class="apl-rich" style="font-size:var(--fs-sm);line-height:1.75"><small style="color:var(--text-3);font-weight:800">문제</small><br>${v}</div>`;
    const fixLT = (t) => (typeof t === 'string' ? t.replace(/\$[^$]*\$/g, (m) => m.replace(/</g, '\\lt ').replace(/>/g, '\\gt ')) : t);
    const fixObj = (o) => (o ? { ...o, steps: fixLT(o.steps), warning: fixLT(o.warning), highlight: fixLT(o.highlight) } : o);
    const scene = (o) => ({
      boardKind: 'cartesian', tabs: { compact: true }, ...o,
      steps: o.steps && (() => o.steps().map(fixLT)),
      solution: o.solution && { ...o.solution, standard: () => fixObj(o.solution.standard()), quick: () => fixObj(o.solution.quick()) }
    });
    const axesOf = (b) => { b.grid({ step: 1 }); b.axes({ tickStep: b.k < 32 ? 2 : 1 }); };
    function arrowTo(b, p, q, o = {}) { // p → q 화살표(끝에 화살촉)
      const dx = q[0] - p[0], dy = q[1] - p[1], L = Math.hypot(dx, dy) || 1, ux = dx / L, uy = dy / L, h = 0.3, w = 0.13;

    }

    /* ======================== ① 화살표 대응: 합성함수·역함수 값 따라가기 ======================== */
    const XS = [1, 2, 3, 4], YS = ['a', 'b', 'c', 'd'], ZS = [5, 6, 7, 8];

    const lab1 = (col, i) => (col === 0 ? XS[i] : col === 1 ? YS[i] : ZS[i]);
    const shuffle = (n) => { const a = [...Array(n).keys()]; for (let i = n - 1; i > 0; i--) { const j = rint(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };
    const F1_0 = { f: [2, 0, 3, 1], g: [2, 0, 3, 1] }; // f: 1→c 2→a 3→d 4→b, g: a→7 b→5 c→8 d→6
    const inv = (p) => { const q = []; p.forEach((v, i) => { q[v] = i; }); return q; };
    // 항: kind 'gf'(x) (g∘f)(x) · 'finv'(y) f⁻¹(y) · 'gfinv'(z) (g∘f)⁻¹(z) · 'ginv'(z) g⁻¹(z)
    const termVal = (v, t) => {

      if (t.k === 'finv') return { tex: `f^{-1}(${YS[t.i]})`, val: XS[fi[t.i]], path: [['f', fi[t.i], t.i]], num: true };

      return { tex: `g^{-1}(${ZS[t.i]})`, val: YS[gi[t.i]], path: [['g', gi[t.i], t.i]], num: false };
    };

      let f = F1_0.f, g = F1_0.g, terms = [{ k: 'gf', i: 2 }, { k: 'finv', i: 3 }]; // 처음 문제: (g∘f)(3)+f⁻¹(d)
      if (prev) {
        f = shuffle(4); g = shuffle(4);

        terms = [{ k: a, i: rint(4) }, { k: b2, i: rint(4) }];
      }
      const v = { f, g, terms }, tv = terms.map((t) => termVal(v, t)), sum = tv[0].val + tv[1].val;

    });
    const text1 = (v) => `그림은 일대일대응 ${tex('f:X\\to Y')}, ${tex('g:Y\\to Z')}의 대응을 나타낸 것이다. ${tex(`${v.tv[0].tex}+${v.tv[1].tex}`)}의 값을 구하시오.`;
    function drawF1(b, v, hl, showNums, hlColor) {
      const cols = [[colX, 'X'], [colY, 'Y'], [colZ, 'Z']];
      cols.forEach(([cx, nm]) => { b.poly([[cx - 0.95, 7.1], [cx + 0.95, 7.1], [cx + 0.95, 0.7], [cx - 0.95, 0.7]], { color: 'muted', dash: [4, 4], width: 1.4, fill: 'muted', fillAlpha: 0.07, alpha: 0.7 }); b.text([cx, 7.1], nm, { color: 'ink', size: 15, dy: -12, weight: 800 }); });
      b.text([(colX + colY) / 2, 7.1], 'f', { color: 'sky', size: 15, dy: -12 }); b.text([(colY + colZ) / 2, 7.1], 'g', { color: 'amber', size: 15, dy: -12 });
      const arrows = [];
      v.f.forEach((j, i) => arrows.push(['f', i, j, nodeXY(0, i), nodeXY(1, j), 'sky']));
      v.g.forEach((j, i) => arrows.push(['g', i, j, nodeXY(1, i), nodeXY(2, j), 'amber']));

    {
      const pool = [-3, -2, -1, 1, 2, 3, 4, 5];
      for (let t = 0; t < 400; t++) {
        const X = []; const bag = pool.slice(); while (X.length < 4) X.push(bag.splice(rint(bag.length), 1)[0]); X.sort((a, b) => a - b);
        const P = { X, al: [3, 4, 5, 6, 8][rint(5)], k: [2, 3, 4, 5][rint(4)] }, n = valid5(P).length;
        if (n >= 3 && n <= 10) P5L.push(P);
      }
    }
    const var5 = varier((prev) => { const P = !prev ? P5_0 : pickOf(P5L, prev.P), ok = valid5(P); return { P, ok, ans: { tex: String(ok.length), val: ok.length } }; });
    const text5 = (v) => `집합 ${tex(`X=\\{${v.P.X.join(',\\,')}\\}`)}에서 정의된 함수 ${tex('f')}가 각 ${tex('x\\in X')}에 대하여 ${tex(`f(x)=-x^2${addT(v.P.al)}`)} 또는 ${tex(`f(x)=-${v.P.k}x`)} 중 하나의 값을 갖는다. ${tex('f')}가 일대일함수가 되도록 하는 함수 ${tex('f')}의 개수를 구하시오.`;
    function layout5(P) {
      const vals = [...new Set(P.X.flatMap((x) => [ruleA(P, x), ruleB(P, x)]))].sort((a, b) => b - a), m = vals.length;
      const xr = P.X.map((_, i) => 6.4 - i * (5.2 / Math.max(1, P.X.length - 1))), vr = vals.map((_, i) => 7.2 - i * (6.4 / Math.max(1, m - 1)));
      return { vals, xr, vr, yOf: (v) => vr[vals.indexOf(v)] };
    }
    function drawF5(b, P, choice, opt) { // choice[i] = 0(A) / 1(B) / -1(고르지 않음)
      const L = layout5(P), xc = 2.4, vc = 7.8;
      b.poly([[xc - 0.95, 7.4], [xc + 0.95, 7.4], [xc + 0.95, 0.4], [xc - 0.95, 0.4]], { color: 'muted', dash: [4, 4], width: 1.4, fill: 'muted', fillAlpha: 0.07, alpha: 0.7 });
      b.poly([[vc - 0.95, 7.9], [vc + 0.95, 7.9], [vc + 0.95, 0.0], [vc - 0.95, 0.0]], { color: 'muted', dash: [4, 4], width: 1.4, fill: 'muted', fillAlpha: 0.07, alpha: 0.7 });
      b.text([xc, 7.4], 'X', { size: 15, dy: -12, weight: 800 }); b.text([vc, 7.9], 'f(x)의 값', { size: 14, dy: -12, weight: 800 });
      const cnt = {}; choice.forEach((c, i) => { if (c >= 0) { const v = c ? ruleB(P, P.X[i]) : ruleA(P, P.X[i]); cnt[v] = (cnt[v] || 0) + 1; } });
      P.X.forEach((x, i) => [0, 1].forEach((r) => {
        const v = r ? ruleB(P, x) : ruleA(P, x), p = [xc + 0.45, L.xr[i]], q = [vc - 0.5, L.yOf(v)], u = [q[0] - p[0], q[1] - p[1]], d = Math.hypot(u[0], u[1]);
        const picked = choice[i] === r, bad = picked && cnt[v] > 1, col = bad ? 'red' : r ? 'green' : 'sky';
        if (!opt.all && !picked) return;
        arrowTo(b, p, [q[0] - (u[0] / d) * 0.05, q[1] - (u[1] / d) * 0.05], { color: col, width: picked ? 3.4 : 1.6, alpha: picked ? 1 : 0.55, glow: picked });
      }));
      P.X.forEach((x, i) => { const p = [xc, L.xr[i]]; b.point(p, { r: 15, hollow: true, color: 'ink', glow: false }); b.text(p, String(x).replace('-', '−'), { size: 14, baseline: 'middle', halo: false, weight: 800 }); });
      L.vals.forEach((v, i) => { const p = [vc, L.vr[i]], bad = cnt[v] > 1, on = cnt[v] === 1; b.point(p, { r: 17, hollow: true, color: bad ? 'red' : on ? 'green' : 'ink', glow: false }); b.text(p, String(v).replace('-', '−'), { size: 13, baseline: 'middle', halo: false, weight: 800, color: bad ? 'red' : on ? 'green' : 'ink' }); });
      if (opt.rules) { b.text([5.1, 7.9], 'A: −x²+' + P.al, { color: 'sky', size: 13, dy: -12 }); b.text([5.1, 7.4], 'B: −' + P.k + 'x', { color: 'green', size: 13, dy: -12 }); }
    }
    const steps5 = () => {
      const v = var5.cur(), P = v.P, tbl = P.X.map((x) => `$x=${x}$: A $${ruleA(P, x)}$ / B $${ruleB(P, x)}$`).join(', ');
      const conf = []; P.X.forEach((x, i) => P.X.forEach((y, j) => { if (i < j) [[0, 0], [0, 1], [1, 0], [1, 1]].forEach(([r, s2]) => { const v1 = r ? ruleB(P, x) : ruleA(P, x), v2 = s2 ? ruleB(P, y) : ruleA(P, y); if (v1 === v2) conf.push(`($x=${x}$:${r ? 'B' : 'A'}, $x=${y}$:${s2 ? 'B' : 'A'}) 모두 ${v1}`); }); }));
      return [
        `각 원소의 두 후보값을 구합니다. ${tbl}.`,
        conf.length ? `같은 값이 되는 선택(충돌): ${conf.join(' ; ')}. 이 두 선택을 동시에 하면 일대일이 아닙니다.` : '충돌하는 선택이 없어 모든 배정이 일대일입니다.',
        `충돌을 피하는 선택을 모두 세면 ${v.ok.map((m) => mask2s(P, m)).join(', ')} (순서: ${P.X.join(',')} 의 선택) ⇒ <b>${v.ans.tex}개</b>`.replace(/<\/?b>/g, '')
      ];
    };
    function sceneF5() {
      const reset = (s) => { s.b5 = [0, 0, 0, 0]; };
      const P = P5_0;
      return scene({
        id: 'b9-5', title: '[B9] 두 식 중 하나를 골라 일대일 만들기', short: '두 식 중 하나 선택',
        question: '각 원소마다 두 식 중 하나를 고를 때, 두 화살표가 같은 값에 꽂히지 않게 하려면?',
        guide: '원소마다 <b>A(−x²+5)</b>와 <b>B(−4x)</b> 중 하나를 고르세요. 두 화살표가 <b>같은 값으로 모이면 빨강</b>이 되어 일대일이 깨집니다. 「전체 보기」로 두 후보 화살표를 모두 확인하고, 일대일이 되는 선택이 몇 가지인지 아래에서 읽으세요.',
        enter: reset, focus: { x: [0, 10], y: [0, 8.6] },
        controls: () => [],
        presets: (s) => [
          ...P.X.flatMap((x, i) => [{ group: `x = ${x}`, label: `A (${ruleA(P, x)})`, color: 'sky', apply: (st) => { st.b5 = st.b5.slice(); st.b5[i] = 0; }, on: (st) => st.b5[i] === 0 }, { group: `x = ${x}`, label: `B (${ruleB(P, x)})`, color: 'green', apply: (st) => { st.b5 = st.b5.slice(); st.b5[i] = 1; }, on: (st) => st.b5[i] === 1 }]),
          { group: '도움', label: '두 후보 모두 보기', apply: (st) => { st.b5all = !st.b5all; }, on: (st) => !!st.b5all }
        ],
        steps: steps5,
        reviewTop: () => probBox(text5(var5.cur())),
        problem: { tag: '23 고1 11월 경기 29번 유형 (두 식 중 선택하는 일대일함수)', time: '목표 시간: 40초', text: () => probHTML(text5(var5.cur())), answer: () => tex(var5.cur().ans.tex) },
        solution: {
          standardTitle: '충돌 피하기', standardTag: '기본 풀이', quickTitle: '충돌 쌍을 먼저 찾기', quickTag: '핵심',
          standard: () => { const v = var5.cur(); return { steps: `충돌하는 선택을 피하는 배정: ${v.ok.map((m) => mask2s(v.P, m)).join(', ')} ⇒ ${v.ans.tex}개`, warning: '한 원소의 A와 B가 같은 값이 되는 경우, 같은 값을 갖는 서로 다른 원소의 선택도 함께 확인하세요.' }; },
          quick: () => ({ steps: '두 후보 화살표가 <b>같은 값 칸</b>에 모이는 쌍을 먼저 표시하면, 그 쌍을 동시에 고르지 않는 경우만 세면 됩니다.', highlight: '2ⁿ가지 배정을 다 쓰지 말고 충돌 쌍으로 걸러내세요.' })
        },
        view: (s, lab) => {
          if (lab.tab !== 'explore') { const v = var5.cur(); return { chips: [{ html: `일대일인 선택 <b>${v.ans.tex}가지</b>`, color: 'amber', answer: true }] }; }
          const ch = s.b5, vals = ch.map((c, i) => (c ? ruleB(P, P.X[i]) : ruleA(P, P.X[i]))), dup = vals.some((v, i) => vals.indexOf(v) !== i), ok = valid5(P);
          return {
            chips: [{ html: `f = (${vals.map((v) => String(v).replace('-', '−')).join(', ')})`, color: dup ? 'rose' : 'green' }],
            status: { tone: dup ? 'warn' : 'ok', text: dup ? '같은 값이 두 번 — 일대일이 아닙니다' : '모든 값이 서로 다름 — 일대일입니다' },
            readouts: [
              { label: '지금 선택', value: ch.map((c) => (c ? 'B' : 'A')).join(' '), color: 'ink', note: `x = ${P.X.join(', ')}` },
              { label: '일대일인 선택의 수', value: `${ok.length}가지 (전체 ${1 << P.X.length}가지 중)`, color: 'amber', wide: true, note: ok.map((m) => mask2s(P, m)).join(' · ') }
            ]
          };
        },
        vary: var5,
        draw: (b, s, v, lab) => {
          if (lab.tab === 'explore') { drawF5(b, P, s.b5, { all: !!s.b5all, rules: true }); return; }
          const vv = var5.cur(), st = stepOf(lab, s), ch = vv.P.X.map(() => -1);
          drawF5(b, vv.P, ch, { all: true, rules: true });
          if (st >= 2) { /* 충돌 값 강조 */ const L = layout5(vv.P); const m = {}; vv.P.X.forEach((x) => [ruleA(vv.P, x), ruleB(vv.P, x)].forEach((val) => { m[val] = (m[val] || 0) + 1; })); L.vals.forEach((val, i) => { if (m[val] > 1) b.point([7.8, L.vr[i]], { r: 21, hollow: true, color: 'red', glow: false }); }); }
        }
      });
    }

    return [sceneF1(), sceneF2(), sceneF3(), sceneF4(), sceneF5()];
  })();
  Object.assign(params, {
    f2a: { value: 0, min: -5, max: 4, step: 0.5, color: 'amber', label: 'a (두 기울기를 함께 바꿈)', hint: '기울기 2−a 와 2a+5', format: (v) => (Math.round(v * 100) / 100).toString().replace('-', '−') },
    f3s: { value: 1, min: 1, max: 8, step: 0.05, color: 'amber', label: '시작 값', hint: '앞으로는 정의역 [1, 7], 거꾸로는 치역 [2, 8] 안에서', format: (v) => (Math.round(v * 100) / 100).toString() },
    f4a: { value: 1, min: -4, max: 4, step: 1, color: 'rose', label: 'a (분자의 x 계수)', hint: '수평 점근선 y = a', format: (v) => String(v).replace('-', '−') },
    f4b: { value: 2, min: -8, max: 8, step: 1, color: 'sky', label: 'b (분자의 상수항)', format: (v) => String(v).replace('-', '−') },
    f4c: { value: -2, min: -4, max: 4, step: 1, color: 'amber', label: 'c (분모의 상수항)', hint: '수직 점근선 x = −c', format: (v) => String(v).replace('-', '−') }
  });
  groups[0].scenes.push(...B9);

  APLab.createLab({
    id: 'common-functions',
    title: '합성함수 · 유리 · 무리함수',
    courseName: '공통수학',
    unit: '함수와 그래프',
    courseColor: 'var(--m-green)',
    home: '../index.html#common',
    legacy: '../../labs/공통수학/합성함수·유리함수·무리함수.html',
    board: { kind: 'figure', autoFit: true, minZoom: 0.4, maxZoom: 6 },
    state: { anim: 1 },
    params,
    groups
  });

  /* 「새 문제」가 있는 장면: 탭을 바꿀 때마다 그 탭의 그림에 장면 범위를 다시 맞춥니다(탐구 탭은 항상 원래 범위). */
  const L = window.lab;
  if (L && Object.keys(VARY).length) {
    const goScene0 = L.goScene.bind(L);
    let exploreFocus = null; // 장면에 들어올 때 정해진 탐구 탭의 범위(탐구 탭으로 돌아오면 그대로 되돌림)
    L.goScene = (i, o = {}) => {
      if (!o.keepTab) L.tab = 'explore';
      const r = goScene0(i, o);
      try { exploreFocus = L.scene.vary && L.tab === 'explore' ? JSON.parse(JSON.stringify(L.board.focus)) : null; } catch (e) { exploreFocus = null; }
      return r;
    };
    const setTab0 = L.setTab.bind(L);
    L.setTab = (id) => {
      setTab0(id);
      titleV(L);
      if (id === 'explore' && exploreFocus && L.scene.vary) { try { L.board.setFocus(JSON.parse(JSON.stringify(exploreFocus)), true); L.invalidate(true); } catch (e) { /* 그대로 */ } } else refocusV(L);
    };
  }
});
