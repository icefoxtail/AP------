  /* ===== 원본 상태 객체(이름 그대로) — 매 프레임 2.0 셸 상태에서 채웁니다 ===== */
    const state = { probIdx: 0, auxStep: 0, sliderT: 0.45, animT: 1.0, scale: 1.0, panX: 0, panY: 0 };
    function curProb() {
      return PROBLEMS[state.probIdx];

  /* ======================================================================
     [2.0] 어댑터: 원본의 d* 그리기 함수 → 새 무대 엔진
     - 좌표는 원본의 화면 좌표(1000×700 기준, y 아래쪽)를 '설계 좌표'로 쓰는 figure 무대입니다
     - 좌표평면(격자·축·눈금)은 무대가 직접 그리고, 곡선과 함께 자동 맞춤 계산에서는 빠집니다
     ====================================================================== */
  let BOARD = null;
  let CUR = null;        // 지금 그리는 셸 상태(핸들 끌기가 고칩니다)
  let DRAG = { obj: null, raw: 0, w: null };
  let HN = 0;
  const LIVE = { text: '' };
  // 셸은 이모지(➔ ⭕ ❌ 포함)를 화면 표시에서 떼어 내므로, 문장 속 뜻이 사라지지 않게 → ○ × 로 미리 바꿔 넘깁니다(원문은 그대로).
  const arrowOnly = (s) => String(s == null ? '' : s).replace(/➔/g, '→').replace(/⭕/g, '○').replace(/❌/g, '×');
  const cv = (s) => APLab.stripEmoji(arrowOnly(s));
  // 원본 renderMathHTML 과 같은 규칙: **굵게** → <strong>. 또 $…$ 안의 '<'(예: $0 \le k < 1$)는 HTML 태그 시작으로 읽히지 않게 \lt 로 바꿉니다.
  const bold = (s) => s.replace(/\*\*([\s\S]+?)\*\*/g, '<strong>$1</strong>').replace(/\$([^$]+)\$/g, (m0, src) => '$' + src.replace(/</g, '\\lt ') + '$');
  const arrow = (v) => (typeof v === 'string' ? bold(arrowOnly(v)) : Array.isArray(v) ? v.map(arrow) : v && typeof v === 'object' ? Object.fromEntries(Object.entries(v).map(([k, x]) => [k, arrow(x)])) : v);
  // 자동 맞춤 중에는 좌표에 따라 범위가 늘어나므로, 범위에 넣지 않을 계산은 등록 없이 화면 좌표만 구합니다.
  const scr = (x, y) => { const bb = BOARD._bbox; BOARD._bbox = null; const r = BOARD.toS(x, y); BOARD._bbox = bb; return r; };
  const snapT = (num) => {
    const p = curProb();
    for (const sn of p.snaps) if (Math.abs(num - sn.t) < 0.022) return sn.t;
    return num;
  };

    function toScr(mx, my, ox, oy, u) {
      return { x: ox + mx * u, y: oy - my * u };
    }

  /* 좌표평면(격자·축·눈금): 원본 drawAxesWithTicks (1398행) */
  function drawAxesWithTicks(rect, ox, oy, u) {
    const b = BOARD;
    if (b._bbox) return;
    const c = b.ctx, W = b.W, H = b.H, k = b.k;
    const org = b.toS(ox, oy);
    const step = u * k;
    c.save();
    c.beginPath();
    c.rect(0, 0, W, H);
    c.clip();
    c.setLineDash([]);
    if (CUR && CUR.grid !== false && step > 6) {
      c.strokeStyle = b.colors.grid;
      c.lineWidth = 1;
      c.beginPath();
      for (let x = ((org.x % step) + step) % step; x < W; x += step) { c.moveTo(Math.round(x) + 0.5, 0); c.lineTo(Math.round(x) + 0.5, H); }
      for (let y = ((org.y % step) + step) % step; y < H; y += step) { c.moveTo(0, Math.round(y) + 0.5); c.lineTo(W, Math.round(y) + 0.5); }
      c.stroke();
    }
    c.strokeStyle = b.colors.axis;
    c.lineWidth = 1.6 * b.lw;
    c.beginPath();
    if (org.y >= 0 && org.y <= H) { c.moveTo(0, org.y); c.lineTo(W, org.y); }
    if (org.x >= 0 && org.x <= W) { c.moveTo(org.x, 0); c.lineTo(org.x, H); }
    c.stroke();
    if (!b.thumb) {
      const every = [1, 2, 5, 10, 20].find((n) => n * step >= 30) || 20;
      c.font = `600 ${11.5 * b.fs}px ${b.font}`;
      c.fillStyle = b.colors.tick;
      c.textAlign = 'center';
      c.textBaseline = 'top';
      const ty = Math.min(Math.max(org.y + 6, 4), H - 18);
      const i0 = Math.ceil((0 - org.x) / step / every) * every, i1 = Math.floor((W - org.x) / step / every) * every;
      for (let i = i0; i <= i1; i += every) {
        if (i === 0) continue;
        const sx = org.x + i * step;
        if (sx < 16 || sx > W - 16) continue;
        c.fillText(String(i).replace('-', '−'), sx, ty);
        c.fillRect(sx - 0.5, org.y - 3, 1, 6);
      }
      c.textAlign = 'right';
      c.textBaseline = 'middle';
      const tx = Math.min(Math.max(org.x - 7, 26), W - 4);
      const j0 = Math.ceil((org.y - H) / step / every) * every, j1 = Math.floor(org.y / step / every) * every;
      for (let j = j0; j <= j1; j += every) {
        if (j === 0) continue;
        const sy = org.y - j * step;
        if (sy < 16 || sy > H - 16) continue;
        c.fillText(String(j).replace('-', '−'), tx, sy);
        c.fillRect(org.x - 3, sy - 0.5, 6, 1);
      }
      c.fillStyle = b.color('amber');
      c.font = `800 ${12.5 * b.fs}px ${b.font}`;
      c.textAlign = 'right';
      c.textBaseline = 'top';
      c.fillText('O', org.x - 6, org.y + 5);
    }
    c.restore();
  }

  function drawRightAngle(vertex, p1, p2, size = 11, col = C.gold) {

  // 치수선: 두 점 사이를 offsetPx 만큼 띄워 화살표 선과 값 상자로 표시(원본 1459행). 띄우는 크기는 그림과 함께 커지고 줄어듭니다.
  function drawDimension(p1, p2, offsetPx, label, col = C.gold) {
    const B = BOARD, c = B.ctx;
    const dx = p2.x - p1.x, dy = p2.y - p1.y;
    const len = Math.hypot(dx, dy);
    if (len < 12) return;
    const nx = (-dy / len) * offsetPx;
    const ny = (dx / len) * offsetPx;
    const a = { x: p1.x + nx, y: p1.y + ny };
    const b = { x: p2.x + nx, y: p2.y + ny };
    const A = B.toS(a.x, a.y), Bb = B.toS(b.x, b.y); // 자동 맞춤에서는 치수선 양 끝이 범위에 들어갑니다
    const mx = (A.x + Bb.x) / 2, my = (A.y + Bb.y) / 2;

    if (B._bbox) { B._text(mx, my, str, { color: col, size: 11.5, weight: 800, align: 'center', baseline: 'middle', halo: false }); return; }

    c.stroke();
    c.strokeStyle = B.color(col);
    c.lineWidth = 2.0 * B.lw;
    c.setLineDash([]);
    c.beginPath();
    c.moveTo(A.x, A.y); c.lineTo(Bb.x, Bb.y);
    c.stroke();
    const sl = Math.hypot(Bb.x - A.x, Bb.y - A.y) || 1;

    c.beginPath();
    c.moveTo(Bb.x, Bb.y);
    c.lineTo(Bb.x - ux * aw + px * ah, Bb.y - uy * aw + py * ah);
    c.lineTo(Bb.x - ux * aw - px * ah, Bb.y - uy * aw - py * ah);
    c.closePath();
    c.fill();
    if (str) {
      const size = 11.5 * B.fs * B._ts();
      c.font = `800 ${size}px ${B.font}`;
      const tw = c.measureText(str).width;
      c.fillStyle = B.colors.stage;
      c.strokeStyle = B.color(col);
      c.lineWidth = 1.3;
      c.beginPath();
      c.roundRect(mx - tw / 2 - 6, my - 9, tw + 12, 18, 5);

      c.stroke();
    }
    c.restore();
    B._text(mx, my, str, { color: col, size: 11.5, weight: 800, align: 'center', baseline: 'middle', halo: false });

  function dLine(a, b, col = C.gold, w = 2.6, dash = [], glow = false) {

  // y = f(x) 곡선(원본 1536행). 값이 없거나 |y| > 22 이면 선을 끊습니다. 자동 맞춤 범위에는 넣지 않습니다.
  function dCurve(fn, xMin, xMax, ox, oy, u, col = C.cyan, w = 3.6, dash = [], glow = false) {
    const B = BOARD;
    if (B._bbox) return;
    const steps = 170;
    let run = [];
    const flush = () => { if (run.length > 1) B.path(run, { color: col, width: w, dash: dash.length ? dash : null, glow }); run = []; };
    for (let i = 0; i <= steps; i++) {
      const x = xMin + ((xMax - xMin) * i) / steps;
      const y = fn(x);
      if (y === null || isNaN(y) || Math.abs(y) > 22) { flush(); continue; }
      run.push(toScr(x, y, ox, oy, u));
    }
    flush();
  }

  function dPoly(pts, fill = 'rgba(56,189,248,0.22)', stroke = C.cyan, w = 2.5, glow = false) {

  // 점 이름표가 서로 겹치면(특히 휴대폰) 원본 위치에서 위·아래로 한 줄씩 비켜 놓습니다(원본은 휴대폰에서만 비슷한 처리).
  let placedLabels = [];
  function dDot(p, label = '', col = C.white, off = { x: 8, y: -8 }, isHandle = false) {
    const B = BOARD;
    const str = B.thumb ? '' : cv(label);
    let dy = off.y;
    if (str && !B._bbox) {
      const s = scr(p.x, p.y), size = 12.5 * B.fs * B._ts(), c = B.ctx;
      c.save();
      c.font = `800 ${size}px ${B.font}`;
      const w = c.measureText(str).width;
      c.restore();
      const h = size * 1.15;
      const box = (d) => ({ x0: s.x + off.x, x1: s.x + off.x + w, y0: s.y + d - size * 0.85, y1: s.y + d + size * 0.3 });
      const hit = (a, b) => a.x0 < b.x1 && a.x1 > b.x0 && a.y0 < b.y1 && a.y1 > b.y0;
      for (const d of [0, h, -h, 2 * h, -2 * h]) {

          const dxp = (w.x - prev.x) * B.k, dyp = (w.y - prev.y) * B.k;

          S.t = snapT(DRAG.raw);

    function solutionSlider(id) {

    function plotIntersections(k, ox, oy, sc, rational, showGhost = false) {

      const d = 1 - k;
      if (d >= -eps) {
        const q = Math.sqrt(Math.max(0, d));
        const us = q < eps ? [1] : [1 - q, 1 + q];
        for (const v of us) {
          const x = 1 + v * v, y = x + k;
          const good = v >= -eps;
          if (good) {
            real++;
            dDot(toScr(x, y, ox, oy, sc), state.auxStep >= 2 ? `교점 (${x.toFixed(2)}, ${y.toFixed(2)})` : '교점', C.green, { x: 8, y: -12 });
          } else {
            ghost++;
            if (showGhost) {
              dDot(toScr(x, y, ox, oy, sc), `× 무연근 (${x.toFixed(2)}, ${y.toFixed(2)})`, C.red, { x: 8, y: 17 });
            }
          }
        }
      }
      if (rational && k * k >= 4 - eps && k > 0) {
        const q = Math.sqrt(Math.max(0, k * k - 4));
        const zs = q < eps ? [-k / 2] : [(-k - q) / 2, (-k + q) / 2];
        for (const z of zs) {
          if (z < -eps) {
            const x = 1 + z, y = x + k;
            real++;
            dDot(toScr(x, y, ox, oy, sc), state.auxStep >= 2 ? `교점 (${x.toFixed(2)}, ${y.toFixed(2)})` : '교점', C.green, { x: 8, y: -12 });
          }
        }
      }
      return { real, ghost };
    }

    // 수학 표기: 짧고 정확한 유리수만 숫자로 확정하고,
    // 임의 조작 중 복잡한 실수값은 정확한 기호식 + ≈ 근삿값으로 나누어 표시한다.
    function shortRational(value, maxDenominator = 24) {
      if (!Number.isFinite(value)) return null;
      for (let den = 1; den <= maxDenominator; den++) {
        const num = Math.round(value * den);
        if (Math.abs(value - num / den) <= 1e-9 && Math.abs(num) <= 999) {
          const gcd = (a, b) => b ? gcd(b, a % b) : Math.abs(a);
          const g = gcd(num, den);
          return { num: num / g, den: den / g };
        }
      }
      return null;
    }

    function rationalText(q) {
      return q.den === 1 ? String(q.num) : `${q.num}/${q.den}`;
    }

    function radicalText(q) {
      if (q.num === 0) return '0';
      const sign = q.num < 0 ? '-' : '';
      const abs = Math.abs(q.num);
      const numerator = abs === 1 ? '√2' : `${abs}√2`;
      return sign + (q.den === 1 ? numerator : `${numerator}/${q.den}`);
    }

  /* ===== 원본 그대로: 심화 8문항 그리기 (원본 1692–2194행; 캔버스 크기 읽기만 설계 좌표 1000×700 으로 대체) ===== */
    function drawScene() {
      const rect = { width: 1000, height: 700 }; // [2.0] 원본은 캔버스 크기를 읽었음. 이제 설계 좌표 기준 1000×700 에 그리고 무대가 화면에 맞춥니다

      const prob = curProb();
      const id = prob.id;
      const step = state.auxStep;
      const t = state.sliderT;
      const anim = state.animT;
      const baseU = Math.min(rect.width, rect.height) / 11.2;
      const u = baseU * state.scale;
      if (id.startsWith('bas-')) return drawBasicScene(rect, id, step, t, u);

      // -----------------------------------------------------------------------
      // 🔥 [심화 1] adv-1: 유리함수 대칭성(y=x)과 사다리꼴 P₁PQQ₁ 등적변형
      // -----------------------------------------------------------------------
      if (id === 'adv-1') {
        const ox = rect.width * 0.23 + state.panX;
        const oy = rect.height * 0.8 + state.panY;
        const sc = u * 0.9;
        drawAxesWithTicks(rect, ox, oy, sc);

        const k = 12;
        dLine(toScr(2, -1, ox, oy, sc), toScr(2, 9.5, ox, oy, sc), 'rgba(251,191,36,0.45)', 2, [5, 4]);
        dLine(toScr(-1, 2, ox, oy, sc), toScr(10.5, 2, ox, oy, sc), 'rgba(251,191,36,0.45)', 2, [5, 4]);
        dCurve((x) => k / (x - 2) + 2, 2.32, 10.2, ox, oy, sc, C.cyan, 3.8);

        const a = 3.4625 - t * 2.25;
        const b = k / a;
        const Cpt = toScr(2, 2, ox, oy, sc);
        const P = toScr(2 + a, 2 + b, ox, oy, sc);
        const Q = toScr(2 + b, 2 + a, ox, oy, sc);
        const P1 = toScr(2 + a, 2, ox, oy, sc);
        const Q1 = toScr(2 + b, 2, ox, oy, sc);
        const H = toScr(2 + a, 2 + a, ox, oy, sc);
        const M = toScr(2 + (a + b) / 2, 2 + (a + b) / 2, ox, oy, sc);
        const gap = b - a;
        const gapRat = shortRational(gap);
        // 길이의 정확한 구조는 언제나 √2를 유지한다.
        // 간단한 유리수 계수만 그대로 표시하고 복잡한 경우에는 기호식과 근삿값을 구분한다.
        const pqExact = gapRat ? `PQ = ${radicalText(gapRat)}` : 'PQ = (b−a)√2';
        const gapExact = gapRat ? `b−a = ${rationalText(gapRat)}` : `b−a ≈ ${gap.toFixed(2)}`;
        const aRat = shortRational(a);
        const bRat = shortRational(b);
        const aText = aRat ? `a = ${rationalText(aRat)}` : `a ≈ ${a.toFixed(2)}`;
        const bText = bRat ? `b = ${rationalText(bRat)}` : `b ≈ ${b.toFixed(2)}`;
        const pExact = aRat && bRat;
        const isIntegerPoint = Number.isInteger(Math.round(a)) && Number.isInteger(Math.round(b))
          && Math.abs(a - Math.round(a)) < 1e-9 && Math.abs(b - Math.round(b)) < 1e-9;
        const pLabel = isIntegerPoint
          ? `P(${2 + Math.round(a)}, ${2 + Math.round(b)})`
          : pExact ? `P(2+${rationalText(aRat)}, 2+${rationalText(bRat)})`
          : `P ≈ (${(2 + a).toFixed(2)}, ${(2 + b).toFixed(2)})`;
        const qLabel = isIntegerPoint
          ? `Q(${2 + Math.round(b)}, ${2 + Math.round(a)})`
          : pExact ? `Q(2+${rationalText(bRat)}, 2+${rationalText(aRat)})`
          : `Q ≈ (${(2 + b).toFixed(2)}, ${(2 + a).toFixed(2)})`;

        dPoly([Cpt, P, Q], 'rgba(56, 189, 248, 0.20)', C.cyan, 2.8, step === 0);

        if (step === 1 || step === 4) {
          dLine(toScr(0, 0, ox, oy, sc), toScr(9.2, 9.2, ox, oy, sc), C.gold, 2.4, [6, 4], true);
          dPoly([P, H, Q], 'rgba(251, 191, 36, 0.22)', C.gold, 2.4, true);
          drawRightAngle(H, P, Q, 11, C.gold);
          drawRightAngle(M, Cpt, P, 10, C.gold);
          drawDimension(P, Q, -26, pqExact, C.gold);
          drawDimension(H, Q, 22, gapExact, C.gold);
        }

        // [P1 수리] step > 2(3단계, 4단계 전체보기)에서도 치환 삼각형 Q-Q1-C 보존
        if (step >= 2) {
          dPoly([P1, P, Q, Q1], 'rgba(244, 114, 182, 0.28)', C.pink, 3.2, step === 2);
          drawRightAngle(P1, Cpt, P, 11, C.pink);
          drawRightAngle(Q1, Cpt, Q, 11, C.pink);

          const progress = step === 2 ? anim : 1.0;
          const mP = { x: P.x + (Q.x - P.x) * progress, y: P.y + (Q.y - P.y) * progress };
          const mP1 = { x: P1.x + (Q1.x - P1.x) * progress, y: P1.y };

          dPoly([Cpt, P, P1], 'rgba(52, 211, 153, 0.18)', C.green, 2.0, false);
          dPoly([Cpt, mP, mP1], 'rgba(52, 211, 153, 0.35)', C.green, 2.6, true);

          dDot(P1, 'P₁', C.pink, { x: -8, y: 18 });
          dDot(Q1, 'Q₁', C.pink, { x: -8, y: 18 });
          drawDimension(P1, Q1, 26, `높이: ${gapExact}`, C.pink);
        }

        if (step >= 3) {
          drawDimension(P1, P, -26, bText, C.green);
          drawDimension(Q1, Q, 26, aText, C.green);
        }

        dDot(Cpt, 'C(2, 2)', C.gold, { x: -48, y: 16 });
        dDot(P, step >= 1 ? pLabel : 'P', C.white, { x: 12, y: -6 }, true);
        dDot(Q, step >= 1 ? qLabel : 'Q', C.white, { x: 10, y: -8 });

        const pqLen = (Math.SQRT2 * gap).toFixed(2);
        const areaVal = ((a + b) * gap * 0.5).toFixed(2);
        const exactArea = Math.abs(a - 2) < 1e-9 ? '16' : `≈ ${areaVal}`;
        setMetric(
          `탐구: ${pqExact}${gapRat ? '' : ` ≈ ${pqLen}`} · ${gapExact} · △CPQ 넓이 ${exactArea}`,
          `조건 만족: PQ = 4√2, b−a = 4, △CPQ 넓이 = 16, k = 12`
        );
        return;
      }

      // -----------------------------------------------------------------------
      // 🔥 [심화 2] adv-2: 무리함수와 역함수 사각형 OACB와 불변 길이 AB = 2√2
      // -----------------------------------------------------------------------
      if (id === 'adv-2') {
        const ox = rect.width * 0.24 + state.panX;
        const oy = rect.height * 0.78 + state.panY;
        const sc = u * 1.02;
        drawAxesWithTicks(rect, ox, oy, sc);

        const pVal = 0.3 + t * 2.0;
        const aVal = pVal;
        const cVal = pVal + 2 + (aVal + Math.sqrt(aVal * aVal + 8 * aVal)) / 2;
        const O = toScr(0, 0, ox, oy, sc);
        const A = toScr(pVal, pVal + 2, ox, oy, sc);
        const B = toScr(pVal + 2, pVal, ox, oy, sc);
        const M = toScr(pVal + 1, pVal + 1, ox, oy, sc);
        const Cpt = toScr(cVal, cVal, ox, oy, sc);

        if (step === 1 || step === 4) {
          dLine(toScr(-0.5, 1.5, ox, oy, sc), toScr(5.2, 7.2, ox, oy, sc), 'rgba(56,189,248,0.5)', 2.2, [5, 4], true);
          dLine(toScr(1.5, -0.5, ox, oy, sc), toScr(7.2, 5.2, ox, oy, sc), 'rgba(244,114,182,0.5)', 2.2, [5, 4], true);
          drawDimension(A, B, -26, 'AB = 2√2 (p에 무관하게 일정!)', C.gold);
        }

        if (step >= 2) {
          dPoly([O, A, B], 'rgba(56, 189, 248, 0.26)', C.cyan, 2.5, step === 2);
          dPoly([A, Cpt, B], 'rgba(244, 114, 182, 0.26)', C.pink, 2.5, step === 2);
          dLine(toScr(-0.5, -0.5, ox, oy, sc), toScr(6.6, 6.6, ox, oy, sc), C.gold, 2.5, [6, 4], true);
          drawRightAngle(M, O, A, 11, C.gold);
          drawRightAngle(M, Cpt, B, 11, C.gold);
          dDot(M, `M(${(pVal + 1).toFixed(1)}, ${(pVal + 1).toFixed(1)})`, C.gold, { x: 10, y: 15 });
        } else {
          dPoly([O, A, Cpt, B], 'rgba(52, 211, 153, 0.18)', C.green, 2.4);
        }

        if (step >= 3) {
          const Mx = toScr(pVal + 1, 0, ox, oy, sc);
          const Cx = toScr(cVal, pVal + 1, ox, oy, sc);
          dPoly([O, Mx, M], 'rgba(251, 191, 36, 0.22)', C.gold, 2.2, true);
          dPoly([M, Cx, Cpt], 'rgba(52, 211, 153, 0.22)', C.green, 2.2, true);
          drawRightAngle(Mx, O, M, 10, C.gold);
          drawRightAngle(Cx, M, Cpt, 10, C.green);
          drawDimension(O, M, 24, `OM = √2(${(pVal + 1).toFixed(1)})`, C.gold);
          drawDimension(M, Cpt, 24, `MC ≈ ${((cVal - pVal - 1) * Math.SQRT2).toFixed(2)}`, C.green);
        }

        dCurve((x) => Math.sqrt(Math.max(0, aVal * (x - pVal))) + pVal + 2, pVal, 6.5, ox, oy, sc, C.cyan, 3.8);
        dCurve((x) => (x - pVal - 2) ** 2 / aVal + pVal, pVal + 2, 6.5, ox, oy, sc, C.pink, 3.8);
        dLine(A, B, C.gold, 4.0, [], step === 1);

        dDot(O, 'O(0,0)', C.white, { x: -45, y: 16 });
        dDot(A, `A(${pVal.toFixed(1)}, ${(pVal + 2).toFixed(1)})`, C.cyan, { x: -110, y: -10 }, true);
        dDot(B, `B(${(pVal + 2).toFixed(1)}, ${pVal.toFixed(1)})`, C.pink, { x: 10, y: 15 });
        dDot(Cpt, step >= 3 ? `C(${cVal.toFixed(1)}, ${cVal.toFixed(1)})` : '교점 C', C.gold, { x: 10, y: -8 });

        setMetric(
          `현재 p = ${pVal.toFixed(2)} (탐구 예시 a=p) | AB = 2√2 (불변) | 사각형 넓이 ≈ ${(2 * cVal).toFixed(2)}`,
          `조건 만족: p=1, a=1, C(5,5) ➔ f(10)=6`
        );
        return;
      }

      // -----------------------------------------------------------------------
      // 🔥 [심화 3] adv-3: 유리·무리 결합 함수와 직선 y = x + k 교점 개수 경계 추론
      // -----------------------------------------------------------------------
      if (id === 'adv-3') {
        const ox = rect.width * 0.44 + state.panX;
        const oy = rect.height * 0.62 + state.panY;
        const sc = u * 1.02;
        drawAxesWithTicks(rect, ox, oy, sc);

        dLine(toScr(1, -3, ox, oy, sc), toScr(1, 6, ox, oy, sc), 'rgba(255,255,255,0.25)', 1.6, [4, 4]);
        dLine(toScr(-5, 1, ox, oy, sc), toScr(7, 1, ox, oy, sc), 'rgba(255,255,255,0.25)', 1.6, [4, 4]);

        const S = toScr(1, 1, ox, oy, sc);
        const P = toScr(2, 3, ox, oy, sc);
        const Q = toScr(0, 2, ox, oy, sc);
        const H = toScr(2, 2, ox, oy, sc);

        if (step >= 1) {
          dPoly(
            [toScr(-4, -3, ox, oy, sc), toScr(5, 6, ox, oy, sc), toScr(5, 7, ox, oy, sc), toScr(-4, -2, ox, oy, sc)],
            'rgba(244, 63, 94, 0.16)',
            null,
            0
          );
          dLine(toScr(-4, -3, ox, oy, sc), toScr(5, 6, ox, oy, sc), C.gold, 2.2, [5, 4], step === 1);
          dLine(toScr(-4, -2, ox, oy, sc), toScr(5, 7, ox, oy, sc), C.gold, 2.2, [5, 4], step === 1);
        }

        if (step === 2 || step === 4) {
          dLine(toScr(-3, 5, ox, oy, sc), toScr(4, -2, ox, oy, sc), C.pink, 2.2, [4, 4], true);
          drawRightAngle(Q, S, toScr(1, 3, ox, oy, sc), 10, C.pink);
          dPoly([Q, H, P], 'rgba(52, 211, 153, 0.24)', C.green, 2.6, true);
          drawRightAngle(H, Q, P, 10, C.green);
          drawDimension(Q, P, -22, 'PQ = √5 (PQ² = 5)', C.green);
        }

        if (step >= 3) {
          dCurve((x) => -2 * Math.sqrt(Math.max(0, x - 1)) + 1, 1, 6.5, ox, oy, sc, C.red, 2.6, [5, 4], true);
          dLine(toScr(-4, -4, ox, oy, sc), toScr(6, 6, ox, oy, sc), C.cyan, 2.2, [5, 4], true);
        }

        dCurve((x) => -1 / (x - 1) + 1, -4.8, 0.78, ox, oy, sc, C.pink, 3.8);
        dCurve((x) => 2 * Math.sqrt(Math.max(0, x - 1)) + 1, 1, 6.5, ox, oy, sc, C.cyan, 4.0);

        const k = -1.0 + t * 4.0;
        const counts = plotIntersections(k, ox, oy, sc, true, step >= 3);
        const cnt = counts.real;
        const lineCol = cnt === 0 ? C.red : cnt === 2 ? C.green : C.gold;
        dLine(toScr(-4.5, -4.5 + k, ox, oy, sc), toScr(5.8, 5.8 + k, ox, oy, sc), lineCol, 3.8, [], true);
        dDot(toScr(0, k, ox, oy, sc), `y절편 k=${k.toFixed(2)}`, lineCol, { x: -115, y: -8 }, true);

        // [P2 수리] k=0일 때도 시작점 S(1,1) 라벨 소실 방지
        if (Math.abs(k) < 1e-9) {
          dDot(S, '시작점 S(1,1) [교점]', C.green, { x: 10, y: 15 });
        } else {
          dDot(S, '시작점 S(1,1)', C.white, { x: 10, y: 15 });
        }

        if (step >= 2 && Math.abs(k - 1) > 0.04) dDot(P, '접점 P(2,3)', C.cyan, { x: 10, y: -8 });
        if (step >= 2 && Math.abs(k - 2) > 0.04) dDot(Q, '접점 Q(0,2)', C.pink, { x: -110, y: -8 });

        setMetric(
          `직선 y = x + (${k.toFixed(2)}) ➔ 실제 교점 개수 g(k) = ${cnt}개`,
          `1<k<2에서 0개, 0≤k<1에서 2개 (정수 최솟값 m=0)`
        );
        return;
      }

      // -----------------------------------------------------------------------
      // 🔥 [심화 4] adv-4: 감소하는 꺾인 함수와 역함수의 3교점 대칭삼각형
      // -----------------------------------------------------------------------
      if (id === 'adv-4') {
        const ox = rect.width * 0.48 + state.panX;
        const oy = rect.height * 0.52 + state.panY;
        const sc = u * 0.72;
        drawAxesWithTicks(rect, ox, oy, sc);

        const fPts = [toScr(-6.5, 4.3, ox, oy, sc), toScr(0, 3, ox, oy, sc), toScr(4.5, -6, ox, oy, sc)];
        const invPts = [toScr(4.3, -6.5, ox, oy, sc), toScr(3, 0, ox, oy, sc), toScr(-6, 4.5, ox, oy, sc)];

        const A = toScr(-5, 4, ox, oy, sc);
        const B = toScr(1, 1, ox, oy, sc);
        const Cpt = toScr(4, -5, ox, oy, sc);
        const M = toScr(-0.5, -0.5, ox, oy, sc);

        if (step >= 1) {
          dLine(toScr(-6, -6, ox, oy, sc), toScr(5.5, 5.5, ox, oy, sc), C.gold, 2.2, [6, 4], step === 1);
        }
        if (step >= 2) {
          dPoly([A, B, Cpt], 'rgba(251, 191, 36, 0.22)', C.gold, 2.8, step === 2);
          drawDimension(A, Cpt, -28, '밑변 AC = 9√2', C.gold);
        }
        if (step >= 3) {
          dLine(B, M, C.green, 3.4, [], true);
          drawRightAngle(M, B, A, 12, C.green);
          dDot(M, 'M(-½, -½)', C.green, { x: -85, y: 16 });
          drawDimension(M, B, 24, '높이 BM = (3/2)√2', C.green);
        }

        dLine(fPts[0], fPts[1], C.cyan, 3.8);
        dLine(fPts[1], fPts[2], C.cyan, 3.8);

        if (t > 0.03) {
          const p0 = { x: fPts[0].x + (invPts[0].x - fPts[0].x) * t, y: fPts[0].y + (invPts[0].y - fPts[0].y) * t };
          const p1 = { x: fPts[1].x + (invPts[1].x - fPts[1].x) * t, y: fPts[1].y + (invPts[1].y - fPts[1].y) * t };
          const p2 = { x: fPts[2].x + (invPts[2].x - fPts[2].x) * t, y: fPts[2].y + (invPts[2].y - fPts[2].y) * t };
          dLine(p0, p1, C.pink, 3.5, [5, 3]);
          dLine(p1, p2, C.pink, 3.5, [5, 3]);
        }

        dDot(B, step >= 1 ? '교점 B(1, 1) [y=x 위]' : '교점 B', C.gold, { x: 10, y: -8 });
        if (t > 0.85 || step >= 2) {
          dDot(A, step >= 2 ? '바깥 교점 A(-5, 4)' : '교점 A', C.red, { x: 10, y: -8 }, true);
          dDot(Cpt, step >= 2 ? '바깥 교점 C(4, -5)' : '교점 C', C.red, { x: -115, y: 16 });
        }

        setMetric(
          `대칭 폴딩 진행률: ${Math.round(t * 100)}% | 원함수(청색)와 역함수(분홍 점선)의 교점 관찰`,
          `밑변 AC = 9√2, 높이 BM = (3/2)√2 ➔ 넓이 S = 27/2 (2S = 27)`
        );
        return;
      }

      // -----------------------------------------------------------------------
      // 🔥 [심화 5] adv-5: 유리함수와 원 사이의 최단거리 (기울기 +1 대칭축 정렬)
      // -----------------------------------------------------------------------
      if (id === 'adv-5') {
        const ox = rect.width * 0.36 + state.panX;
        const oy = rect.height * 0.68 + state.panY;
        const sc = u * 0.94;
        drawAxesWithTicks(rect, ox, oy, sc);

        dLine(toScr(1, -2, ox, oy, sc), toScr(1, 7, ox, oy, sc), 'rgba(251,191,36,0.4)', 1.8, [5, 4]);
        dLine(toScr(-3, 2, ox, oy, sc), toScr(8, 2, ox, oy, sc), 'rgba(251,191,36,0.4)', 1.8, [5, 4]);

        const centerA = toScr(-1, 0, ox, oy, sc);
        // [2.0] 캔버스에 직접 그리던 원을 무대 호출로 교체
        dCircle(centerA, Math.SQRT2 * sc, C.pink, 'rgba(244, 114, 182, 0.20)', 3);

        dCurve((x) => 4 / (x - 1) + 2, 1.45, 8.2, ox, oy, sc, C.cyan, 3.8);

        if (step >= 1) {
          dLine(toScr(-2.5, -1.5, ox, oy, sc), toScr(6, 7, ox, oy, sc), C.gold, 2.5, [6, 4], true);
        }
        if (step >= 2) {
          dPoly(
            [toScr(1, 2, ox, oy, sc), toScr(3, 2, ox, oy, sc), toScr(3, 4, ox, oy, sc), toScr(1, 4, ox, oy, sc)],
            'rgba(52, 211, 153, 0.24)',
            C.green,
            2.4,
            step === 2
          );
          drawRightAngle(toScr(3, 2, ox, oy, sc), toScr(1, 2, ox, oy, sc), toScr(3, 4, ox, oy, sc), 10, C.green);
        }

        const px = 1.605 + t * 3.1;
        const py = 4 / (px - 1) + 2;
        const P = toScr(px, py, ox, oy, sc);
        const distAP = Math.hypot(px + 1, py);
        const qx = -1 + ((px + 1) / distAP) * Math.SQRT2;
        const qy = (py / distAP) * Math.SQRT2;
        const Q = toScr(qx, qy, ox, oy, sc);

        dLine(P, Q, C.green, 3.8, [], true);
        if (step >= 3) {
          drawDimension(Q, P, -24, `현재 PQ ≈ ${(distAP - Math.SQRT2).toFixed(2)} (최솟값 3√2)`, C.green);
        }

        dDot(centerA, '원 중심 (-1,0)', C.pink, { x: -95, y: 18 });
        dDot(toScr(1, 2, ox, oy, sc), '점근선 교점 (1,2)', C.gold, { x: -68, y: -8 });
        dDot(Q, 'Q', C.pink, { x: 8, y: 14 });
        dDot(P, `P(${px.toFixed(1)}, ${py.toFixed(1)})`, C.white, { x: 10, y: -8 }, true);

        setMetric(
          `현재 P(${px.toFixed(2)}, ${py.toFixed(2)}) | 선분 PQ 길이 ≈ ${(distAP - Math.SQRT2).toFixed(2)}`,
          `P(3,4)일 때 최솟값 m = 3√2 ≈ 4.24 ➔ 정답 = 10`
        );
        return;
      }

      // -----------------------------------------------------------------------
      // 🔥 [심화 6] adv-6: 절댓값 유리함수의 접혀 올라온 점근선과 현의 길이
      // -----------------------------------------------------------------------
      if (id === 'adv-6') {
        const ox = rect.width * 0.32 + state.panX;
        const oy = rect.height * 0.65 + state.panY;
        const sc = u * 0.88;
        drawAxesWithTicks(rect, ox, oy, sc);

        dLine(toScr(3, -3, ox, oy, sc), toScr(3, 6.5, ox, oy, sc), 'rgba(251,191,36,0.45)', 2, [5, 4]);

        if (step >= 1) {
          dLine(toScr(-2, -2, ox, oy, sc), toScr(9.5, -2, ox, oy, sc), 'rgba(148,163,184,0.35)', 1.8, [4, 4]);
          dLine(toScr(-2, 2, ox, oy, sc), toScr(9.5, 2, ox, oy, sc), C.red, 3.0, [6, 4], true);
        }

        const colFold = step >= 2 ? C.pink : C.cyan;
        dCurve((x) => Math.abs(4 / (x - 3) - 2), -2, 2.3, ox, oy, sc, colFold, 3.6);
        dCurve((x) => 4 / (x - 3) - 2, 3.6, 5.0, ox, oy, sc, C.cyan, 3.8);
        dCurve((x) => -(4 / (x - 3) - 2), 5.0, 9.5, ox, oy, sc, colFold, 3.8);

        // [P0 수리] t=0.40에서 정확히 yT=1.00 및 AB=8/3 달성
        const yT = t <= 0.4 ? 0.2 + 2 * t : t <= 0.75 ? 1 + (t - 0.4) / 0.35 : 2 + 0.5 * (t - 0.75) / 0.17;
        dLine(toScr(-2, yT, ox, oy, sc), toScr(9.5, yT, ox, oy, sc), C.gold, 3.2, [], true);

        let abText = '교점 1개';
        if (Math.abs(yT - 2) > 1e-4) {
          const x1 = yT < 2 ? 3 + 4 / (2 + yT) : 3 + 4 / (2 - yT);
          const x2 = yT < 2 ? 3 + 4 / (2 - yT) : 3 + 4 / (2 + yT);
          const A = toScr(x1, yT, ox, oy, sc);
          const B = toScr(x2, yT, ox, oy, sc);
          const distAB = Math.abs(x2 - x1);
          abText = `교점 2개, AB ≈ ${distAB.toFixed(2)}`;
          dLine(A, B, C.green, 4.2, [], step >= 2);
          if (step >= 2) {
            drawDimension(A, B, -22, `AB ≈ ${distAB.toFixed(2)}${Math.abs(yT - 1.0) < 1e-9 ? ' (8/3)' : ''}`, C.green);
          }
          dDot(A, 'A', C.cyan, { x: -14, y: -10 });
          dDot(B, 'B', C.pink, { x: 8, y: -10 }, true);
        } else {
          dDot(toScr(4, 2, ox, oy, sc), '유일한 교점 (4,2)', C.green, { x: 9, y: -12 }, true);
        }

        dDot(toScr(5, 0, ox, oy, sc), '(5, 0)', C.white, { x: -12, y: 18 });
        setMetric(
          `가로선 y = ${yT.toFixed(2)} | ${abText}`,
          `접혀 올라온 점근선 k = 2 (교점 1개), t = 1 일 때 AB = 8/3 ➔ k+t = 3`
        );
        return;
      }

      // -----------------------------------------------------------------------
      // 🔥 [심화 7] adv-7: 평행이동한 무리함수 사이의 넓이
      // -----------------------------------------------------------------------
      if (id === 'adv-7') {
        const ox = rect.width * 0.20 + state.panX, oy = rect.height * 0.78 + state.panY, sc = u * 0.94;
        drawAxesWithTicks(rect, ox, oy, sc);
        const shift = 4 * t;
        const pt = (x, y) => toScr(x, y, ox, oy, sc);
        if (step >= 1) dPoly([pt(0, 0), pt(shift, 0), pt(shift + 4, 4), pt(4, 4)], 'rgba(251,191,36,.15)', C.gold, 2);
        // [2.0] 캔버스에 직접 그리던 두 곡선 사이 영역을 무대 호출로 교체
        {
          const region = [];
          for (let i = 0; i <= 80; i++) { let y = 4 * i / 80; region.push(pt(y * y / 4, y)); }
          for (let i = 80; i >= 0; i--) { let y = 4 * i / 80; region.push(pt(y * y / 4 + shift, y)); }
          dFill(region, 'rgba(52,211,153,.24)');
        }
        dCurve(x => 2 * Math.sqrt(x), 0, 4, ox, oy, sc, C.cyan, 4);
        dCurve(x => 2 * Math.sqrt(x - shift), shift, shift + 4, ox, oy, sc, C.pink, 4);
        dLine(pt(0, 0), pt(shift, 0), C.white, 2);
        dLine(pt(4, 4), pt(4 + shift, 4), C.white, 2);
        if (step >= 2) {
          for (let y of [1, 2, 3]) dLine(pt(y * y / 4, y), pt(y * y / 4 + shift, y), C.gold, 2, [5, 3]);
        }
        dDot(pt(0, 0), '(0,0)', C.white, { x: -38, y: 16 });
        dDot(pt(4, 4), '(4,4)', C.cyan, { x: -35, y: -10 });
        dDot(pt(shift + 4, 4), `(${(shift + 4).toFixed(1)}, 4)`, C.pink, { x: 8, y: -10 }, true);
        setMetric(
          `평행이동 거리 d = ${shift.toFixed(2)} | 같은 높이의 가로 간격 = ${shift.toFixed(2)}`,
          `d = 4일 때 둘러싸인 넓이 = 4 × 4 = 16`
        );
        return;
      }

      // -----------------------------------------------------------------------
      // 🔥 [심화 8] adv-8: 두 직선으로 이루어진 함수에서 f(f(x))=f(x) vs f(f(x))=x 비교
      // -----------------------------------------------------------------------
      const ox = rect.width * 0.3 + state.panX;
      const oy = rect.height * 0.78 + state.panY;
      const sc = u * 1.15;
      drawAxesWithTicks(rect, ox, oy, sc);

      const p0 = toScr(0, 0, ox, oy, sc);
      const p2 = toScr(2, 4, ox, oy, sc);
      const p4 = toScr(4, 0, ox, oy, sc);
      dLine(p0, p2, C.cyan, 4.0);
      dLine(p2, p4, C.cyan, 4.0);
      dLine(toScr(-0.4, -0.4, ox, oy, sc), toScr(4.4, 4.4, ox, oy, sc), 'rgba(255,255,255,0.45)', 2.2, [5, 4]);

      // [P1 수리] 슬라이더 t에 반응하도록 동기화
      const showStep1 = step >= 1 || t >= 0.15;
      const showStep2 = step >= 2 || (t >= 0.35 && t <= 0.85);
      const showStep3 = step >= 3 || t > 0.75;

      if (showStep1) {
        dDot(toScr(0, 0, ox, oy, sc), 't₁=0', C.gold, { x: -35, y: 16 });
        dDot(toScr(8 / 3, 8 / 3, ox, oy, sc), 't₂ = 8/3', C.gold, { x: 10, y: -8 });
      }
      if (showStep2) {
        dLine(toScr(2, -0.4, ox, oy, sc), toScr(2, 4.4, ox, oy, sc), 'rgba(251,191,36,0.55)', 2, [4, 4]);
        dLine(toScr(-0.3, 8 / 3, ox, oy, sc), toScr(4.3, 8 / 3, ox, oy, sc), C.gold, 3.0, [], true);
        const r1 = toScr(4 / 3, 8 / 3, ox, oy, sc);
        const r2 = toScr(8 / 3, 8 / 3, ox, oy, sc);
        dDot(r1, 'x₁=4/3', C.gold, { x: -48, y: -10 });
        drawDimension(r1, r2, -22, '대칭축 x=2 대칭 ➔ 두 근의 합 = 4', C.gold);
      }
      if (showStep3) {
        const q0 = toScr(0, 0, ox, oy, sc);
        const q1 = toScr(1, 4 * anim, ox, oy, sc);
        const q2 = toScr(2, 0, ox, oy, sc);
        const q3 = toScr(3, 4 * anim, ox, oy, sc);
        const q4 = toScr(4, 0, ox, oy, sc);
        dLine(q0, q1, C.pink, 3.4, [5, 3], true);
        dLine(q1, q2, C.pink, 3.4, [5, 3], true);
        dLine(q2, q3, C.pink, 3.4, [5, 3], true);
        dLine(q3, q4, C.pink, 3.4, [5, 3], true);
        [0, 8 / 5, 8 / 3, 16 / 5].forEach((rx, idx) => {
          dDot(toScr(rx, rx, ox, oy, sc), `교점${idx + 1}`, C.green, { x: 8, y: 14 });
        });
      }

      dDot(p2, '꼭대기 (2, 4)', C.cyan, { x: -32, y: -12 }, true);
      setMetric(
        `슬라이더 상태: ${t < 0.35 ? '1단계 f(t)=t' : t <= 0.75 ? '2단계 수평선 y=8/3' : '3단계 합성함수 y=f(f(x))'}`,
        `f(f(x))=f(x) 실근의 합 S₁ = 8 | f(f(x))=x 실근 개수 q = 4개 ➔ S₁+q = 12`
      );
    }

  /* ===== 원본 그대로: 기본 16문항 그리기 (원본 2196–2737행) ===== */
    function drawBasicScene(rect, id, step, t, u) {
      const anim = state.animT;

      // -----------------------------------------------------------------------
      // 🌱 [기본 1] bas-1: 일대일대응 직사각형 대각선 원리
      // -----------------------------------------------------------------------
      if (id === 'bas-1') {
        const ox = rect.width * 0.28 + state.panX;
        const oy = rect.height * 0.84 + state.panY;
        const sc = u * 0.78;
        drawAxesWithTicks(rect, ox, oy, sc);

        const p12 = toScr(1, 2, ox, oy, sc);
        const p42 = toScr(4, 2, ox, oy, sc);
        const p48 = toScr(4, 8, ox, oy, sc);
        const p18 = toScr(1, 8, ox, oy, sc);

        dPoly([p12, p42, p48, p18], 'rgba(255, 255, 255, 0.06)', 'rgba(251, 191, 36, 0.55)', 2.2);
        if (step >= 1) {
          drawRightAngle(p42, p12, p48, 11, C.gold);
          drawDimension(p12, p42, 24, '정의역 폭 Δx = 3', C.gold);
          drawDimension(p42, p48, -28, '공역 폭 Δy = 6', C.gold);
        }

        if (step === 0 && Math.abs(t - 0.5) < 0.15) {
          const p45 = toScr(4, 5, ox, oy, sc);
          dLine(p12, p45, C.red, 3.8, [], true);
          drawDimension(p45, p48, 26, '남는 공역 (치역 ≠ 공역)', C.red);
          dDot(p45, '(4, 5) [치역 부족]', C.red, { x: 10, y: 4 }, true);
        } else {
          if ((step === 0 && t < 0.5) || step >= 2) {
            dLine(p12, p48, C.cyan, 4.0, [], true);
          }
          if ((step === 0 && t > 0.5) || step >= 3) {
            dLine(p18, p42, C.pink, 4.0, [], true);
          }
        }

        dDot(p12, '(1, 2)', C.cyan, { x: -42, y: 16 });
        dDot(p48, step >= 2 ? '(4, 8) [a=2]' : '(4, 8)', C.cyan, { x: 10, y: -8 }, t < 0.4);
        dDot(p18, step >= 3 ? '(1, 8) [a=-2]' : '(1, 8)', C.pink, { x: -85, y: -8 }, t > 0.6);
        dDot(p42, '(4, 2)', C.pink, { x: 10, y: 16 });

        setMetric(
          `정의역 [1, 4] × 공역 [2, 8] 직사각형 영역`,
          `a > 0일 때 (2, 0) | a < 0일 때 (-2, 10)`
        );
        return;
      }

      // -----------------------------------------------------------------------
      // 🌱 [기본 2] bas-2: 구간별 꺾인 직선의 일대일대응 조건 (m₁m₂ > 0)
      // -----------------------------------------------------------------------
      if (id === 'bas-2') {
        const ox = rect.width * 0.46 + state.panX;
        const oy = rect.height * 0.6 + state.panY;
        const sc = u * 0.95;
        drawAxesWithTicks(rect, ox, oy, sc);

        const m2raw = -1.5 + t * 3.5;
        const m2 = Math.abs(m2raw) < 1e-9 ? 0 : m2raw;
        const P0 = toScr(0, 1, ox, oy, sc);
        const PLeft = toScr(-3.5, -6, ox, oy, sc);
        const PRight = toScr(3.8, 1 + 3.8 * m2, ox, oy, sc);

        dLine(PLeft, P0, C.cyan, 3.8);
        dLine(P0, PRight, m2 > 0 ? C.green : C.red, 4.0, [], true);

        if (step >= 2) {
          const yTest = m2 < 0 ? -1.5 : 2.5;
          dLine(toScr(-4.5, yTest, ox, oy, sc), toScr(4.5, yTest, ox, oy, sc), C.gold, 2.2, [5, 4], true);
          if (m2 < 0) {
            dDot(toScr((yTest - 1) / 2, yTest, ox, oy, sc), '교점1', C.red, { x: -45, y: -8 });
            dDot(toScr((yTest - 1) / m2, yTest, ox, oy, sc), '교점2 (일대일 위반!)', C.red, { x: 10, y: -8 });
          }
        }

        dDot(P0, '연결점 (0, 1)', C.gold, { x: -85, y: -8 });
        dDot(toScr(2.5, 1 + 2.5 * m2, ox, oy, sc), `기울기 m₂=${m2.toFixed(1)}`, m2 > 0 ? C.green : C.red, { x: 10, y: -8 }, true);

        setMetric(
          `왼쪽 기울기 m₁ = +2 | 오른쪽 기울기 m₂ = ${m2.toFixed(2)}`,
          `${m2 > 0 ? '⭕ m₁m₂ > 0 (일대일대응 성립: a > 1)' : '❌ m₁m₂ ≤ 0 (역함수 존재 불가)'}`
        );
        return;
      }

      // -----------------------------------------------------------------------
      // 🌱 [기본 3 & 4 & 5] bas-3, bas-4, bas-5
      // -----------------------------------------------------------------------
      if (id === 'bas-3' || id === 'bas-4' || id === 'bas-5') {
        const ox = rect.width * 0.3 + state.panX;
        const oy = rect.height * 0.78 + state.panY;
        const sc = u * 1.15;
        drawAxesWithTicks(rect, ox, oy, sc);

        const p0 = toScr(0, 0, ox, oy, sc);
        const p2 = toScr(2, 4, ox, oy, sc);
        const p4 = toScr(4, 0, ox, oy, sc);

        if (id === 'bas-5') {
          dLine(toScr(-0.4, -0.4, ox, oy, sc), toScr(4.5, 4.5, ox, oy, sc), C.gold, 2.4, [6, 4]);
          const fnCob = (x) => 2.1 * Math.sqrt(Math.max(0, x));
          dCurve(fnCob, 0, 4.5, ox, oy, sc, C.cyan, 3.8);

          const a = 0.5, b = fnCob(a), c = fnCob(b), d = fnCob(c);
          const A0 = toScr(a, 0, ox, oy, sc), P1 = toScr(a, b, ox, oy, sc), Q1 = toScr(b, b, ox, oy, sc);
          const P2 = toScr(b, c, ox, oy, sc), Q2 = toScr(c, c, ox, oy, sc), P3 = toScr(c, d, ox, oy, sc);

          dDot(A0, 'a', C.white, { x: -6, y: 18 });
          if (step >= 1 || t >= 0.2) {
            dLine(A0, P1, C.green, 3.0, [], true);
            dDot(P1, '(a, f(a))', C.green, { x: -65, y: -8 });
          }

          if (step >= 2 || t >= 0.5) {
            dLine(P1, Q1, C.gold, 3.0, [], true);
            drawRightAngle(P1, A0, Q1, 9, C.gold);
            dLine(Q1, P2, C.pink, 3.0, [], true);
            dDot(Q1, '(b, b)', C.gold, { x: 8, y: 14 });
            dDot(P2, '(b, f²(a))', C.pink, { x: -70, y: -8 });
          }
          if (step >= 3 || t >= 0.9) {
            dLine(P2, Q2, C.gold, 3.0, [], true);
            drawRightAngle(P2, Q1, Q2, 9, C.gold);
            dLine(Q2, P3, C.cyan, 3.2, [], true);
            dDot(Q2, '(c, c)', C.gold, { x: 8, y: 14 });
            dDot(P3, '(c, f³(a))', C.cyan, { x: -65, y: -10 }, true);
          }
          setMetric(
            `계단식 함숫값 추적: 수직(곡선 y=f(x)) → 수평(직선 y=x)`,
            `역방향 추적은 수평(곡선) → 수직(y=x)`
          );
          return;
        }

        dLine(p0, p2, C.cyan, 3.8);
        dLine(p2, p4, C.cyan, 3.8);
        dDot(p2, '(2, 4)', C.cyan, { x: -18, y: -10 });

        if (id === 'bas-3') {
          const kVal = Math.abs(t - 0.5) < 0.04 ? 2.0 : Math.abs(t - 1.0) < 0.04 ? 4.0 : 0.4 + t * 3.6;
          dLine(toScr(-0.4, kVal, ox, oy, sc), toScr(4.4, kVal, ox, oy, sc), C.gold, 3.2, [], true);
          dDot(toScr(0, kVal, ox, oy, sc), `y = ${kVal.toFixed(1)}`, C.gold, { x: -95, y: -6 }, true);

          const t1 = kVal / 2;
          const t2 = 4 - kVal / 2;
          if (step >= 1) {
            dDot(toScr(t1, kVal, ox, oy, sc), `t₁=${t1.toFixed(1)}`, C.gold, { x: -45, y: -10 });
            dDot(toScr(t2, kVal, ox, oy, sc), `t₂=${t2.toFixed(1)}`, C.gold, { x: 10, y: -10 });
          }
          if (step >= 2) {
            dLine(toScr(-0.4, t1, ox, oy, sc), toScr(4.4, t1, ox, oy, sc), C.green, 2.4, [5, 4], true);
            dLine(toScr(-0.4, t2, ox, oy, sc), toScr(4.4, t2, ox, oy, sc), C.pink, 2.4, [5, 4], true);
          }
          if (step >= 3) {
            dLine(toScr(2, -0.4, ox, oy, sc), toScr(2, 4.4, ox, oy, sc), 'rgba(251,191,36,0.55)', 2, [4, 4]);
            drawDimension(toScr(t1, kVal, ox, oy, sc), toScr(t2, kVal, ox, oy, sc), -24, '대칭축 x=2 대칭 (두 근의 합 = 4)', C.gold);
          }
          setMetric(
            `현재 1차 수평선 y = ${kVal.toFixed(1)} ➔ 교점 x좌표 t₁ = ${t1.toFixed(2)}, t₂ = ${t2.toFixed(2)}`,
            `k = 2일 때 실근 4개, 모든 실근의 합 = 4 + 4 = 8`
          );
          return;
        }

        // [P2 수리] bas-4에서 step >= 3 이후에도 슬라이더 조작 연동
        if (step >= 1) {
          dLine(toScr(-0.4, 2, ox, oy, sc), toScr(4.4, 2, ox, oy, sc), C.gold, 2.2, [5, 4]);
        }
        if (step >= 2) {
          [1, 2, 3].forEach((xv) => {
            dLine(toScr(xv, 0, ox, oy, sc), toScr(xv, 4, ox, oy, sc), 'rgba(52,211,153,0.45)', 1.8, [4, 4]);
          });
        }
        // 합성 진행률은 조절 막대 t 하나로 정합니다. 단계가 3 이상으로 올라가면 막대가 함께 100%로 이동하므로(STEP_T),
        // 애니메이션이 끝나도 원함수로 되돌아가지 않고, 이후에도 막대를 움직여 변환 과정을 다시 볼 수 있습니다.
        const mT = t;
        if (mT > 0.01 || step >= 3) {
          const q0 = toScr(0, 0, ox, oy, sc);
          const q1 = toScr(1, 2 + 2 * mT, ox, oy, sc);
          const q2 = toScr(2, 4 - 4 * mT, ox, oy, sc);
          const q3 = toScr(3, 2 + 2 * mT, ox, oy, sc);
          const q4 = toScr(4, 0, ox, oy, sc);
          dLine(q0, q1, C.pink, 3.8, [], true);
          dLine(q1, q2, C.pink, 3.8, [], true);
          dLine(q2, q3, C.pink, 3.8, [], true);
          dLine(q3, q4, C.pink, 3.8, [], true);
          dDot(q1, `(1, ${(2 + 2 * mT).toFixed(1)})`, C.pink, { x: -18, y: -12 }, true);
          dDot(q2, `(2, ${(4 - 4 * mT).toFixed(1)})`, C.pink, { x: -18, y: 18 });
          dDot(q3, `(3, ${(2 + 2 * mT).toFixed(1)})`, C.pink, { x: -18, y: -12 });
        }
        setMetric(
          `원함수 y = f(x) (청색) | 합성 변환 진행률 ${Math.round(mT * 100)}%`,
          `합성함수 y = f(f(x))는 x = 1, 2, 3에서 꺾이는 봉우리 2개 그래프`
        );
        return;
      }

      // -----------------------------------------------------------------------
      // 🌱 [기본 6 & 7] bas-6, bas-7: 역함수 y=x 대칭 접기 & 감소함수 바깥 교점 반례
      // -----------------------------------------------------------------------
      if (id === 'bas-6') {
        const ox = rect.width * 0.3 + state.panX;
        const oy = rect.height * 0.78 + state.panY;
        const sc = u * 1.05;
        drawAxesWithTicks(rect, ox, oy, sc);

        dLine(toScr(-0.5, -0.5, ox, oy, sc), toScr(5.2, 5.2, ox, oy, sc), C.gold, 2.4, [6, 4]);
        const A = toScr(1, 1, ox, oy, sc), B = toScr(4, 4, ox, oy, sc), H = toScr(4, 1, ox, oy, sc);

        if (step >= 2) {
          dPoly([A, H, B], 'rgba(251, 191, 36, 0.20)', C.gold, 2.2);
          drawRightAngle(H, A, B, 11, C.gold);
          drawDimension(A, B, -26, '두 교점 거리 = √2(4-1) = 3√2', C.gold);
        }

        dCurve((x) => ((x - 1) ** 2) / 3 + 1, 1, 5.0, ox, oy, sc, C.cyan, 3.8);
        if (t > 0.05 || step >= 3) {
          dCurve((x) => Math.sqrt(Math.max(0, 3 * (x - 1))) + 1, 1, 5.0, ox, oy, sc, C.pink, 3.8);
        }

        dDot(A, 'A(1, 1)', C.gold, { x: -48, y: 16 });
        dDot(B, step >= 2 ? 'B(4, 4) [AB=3√2]' : 'B(4, 4)', C.gold, { x: 10, y: -8 }, true);
        setMetric(
          `증가함수 y = f(x)와 역함수 y = f⁻¹(x) 비교`,
          `교점 A(1,1), B(4,4) | 선분 AB = 3√2, 넓이는 y=x 사이 넓이의 2배`
        );
        return;
      }

      if (id === 'bas-7') {
        const ox = rect.width * 0.48 + state.panX;
        const oy = rect.height * 0.52 + state.panY;
        const sc = u * 0.85;
        drawAxesWithTicks(rect, ox, oy, sc);

        dLine(toScr(-4.5, -4.5, ox, oy, sc), toScr(4.5, 4.5, ox, oy, sc), C.gold, 2.4, [6, 4]);
        const fPts = [toScr(-4, 3.3, ox, oy, sc), toScr(-3, 3, ox, oy, sc), toScr(1, 1, ox, oy, sc), toScr(3, -3, ox, oy, sc), toScr(3.5, -4.2, ox, oy, sc)];
        const iPts = [toScr(3.3, -4, ox, oy, sc), toScr(3, -3, ox, oy, sc), toScr(1, 1, ox, oy, sc), toScr(-3, 3, ox, oy, sc), toScr(-4.2, 3.5, ox, oy, sc)];

        for (let i = 0; i < fPts.length - 1; i++) {
          dLine(fPts[i], fPts[i + 1], C.cyan, 3.8);
          if (t > 0.2 || step >= 2) {
            dLine(iPts[i], iPts[i + 1], C.pink, 3.5, [5, 3]);
          }
        }

        const P1 = toScr(-3, 3, ox, oy, sc), P2 = toScr(3, -3, ox, oy, sc), O = toScr(0, 0, ox, oy, sc);
        if (step >= 3) {
          dLine(P1, P2, C.red, 2.4, [4, 4], true);
          drawRightAngle(O, P1, toScr(2, 2, ox, oy, sc), 11, C.gold);
          drawDimension(P1, P2, -24, '기울기 -1 대칭쌍 (-3,3) ↔ (3,-3)', C.red);
        }

        dDot(toScr(1, 1, ox, oy, sc), step >= 1 ? '교점① (1,1) [y=x 위]' : '(1, 1)', C.gold, { x: 10, y: -8 });
        if (t > 0.2 || step >= 2) {
          dDot(P1, step >= 2 ? '바깥 교점② (-3, 3)' : '(-3, 3)', C.red, { x: -125, y: -10 }, true);
          dDot(P2, step >= 2 ? '바깥 교점③ (3, -3)' : '(3, -3)', C.red, { x: 10, y: 15 });
        }
        setMetric(
          `감소하는 원함수(청색)와 역함수(분홍 점선)의 교점 관찰`,
          `명제 거짓(❌): y = x 바깥의 대칭쌍 (-3, 3), (3, -3)에서도 교점 존재`
        );
        return;
      }

      // -----------------------------------------------------------------------
      // 🌱 [기본 8 ~ 11] bas-8 ~ bas-11: 유리함수 3대 대칭 · 일반형 · 넓이 불변 · 정수 좌표 점
      // -----------------------------------------------------------------------
      if (id === 'bas-8' || id === 'bas-9' || id === 'bas-11') {
        const ox = rect.width * 0.44 + state.panX;
        const oy = rect.height * 0.58 + state.panY;
        const sc = u * 0.9;
        drawAxesWithTicks(rect, ox, oy, sc);

        // [P2 수리] bas-9에서 원함수와 역함수 동시 비교 표시
        if (id === 'bas-9') {
          const p = 1, q = 2, kVal = 3;
          dLine(toScr(-3, -3, ox, oy, sc), toScr(6, 6, ox, oy, sc), C.gold, 2.2, [6, 4]);

          dLine(toScr(p, -5, ox, oy, sc), toScr(p, 7, ox, oy, sc), 'rgba(56,189,248,0.4)', 2.0, [5, 4]);
          dLine(toScr(-5, q, ox, oy, sc), toScr(7, q, ox, oy, sc), 'rgba(56,189,248,0.4)', 2.0, [5, 4]);
          dCurve((x) => kVal / (x - p) + q, -5, p - 0.2, ox, oy, sc, C.cyan, 3.8);
          dCurve((x) => kVal / (x - p) + q, p + 0.2, 7, ox, oy, sc, C.cyan, 3.8);
          dDot(toScr(p, q, ox, oy, sc), 'C(1, 2) [원함수]', C.cyan, { x: -110, y: -10 });

          if (t > 0.1 || step >= 2) {
            const pInv = 2, qInv = 1;
            dLine(toScr(pInv, -5, ox, oy, sc), toScr(pInv, 7, ox, oy, sc), 'rgba(244,114,182,0.4)', 2.0, [5, 4]);
            dLine(toScr(-5, qInv, ox, oy, sc), toScr(7, qInv, ox, oy, sc), 'rgba(244,114,182,0.4)', 2.0, [5, 4]);
            dCurve((x) => kVal / (x - pInv) + qInv, -5, pInv - 0.2, ox, oy, sc, C.pink, 3.6, [5, 3]);
            dCurve((x) => kVal / (x - pInv) + qInv, pInv + 0.2, 7, ox, oy, sc, C.pink, 3.6, [5, 3]);
            dDot(toScr(pInv, qInv, ox, oy, sc), "C'(2, 1) [역함수]", C.pink, { x: 10, y: 15 });
          }

          setMetric(
            `원함수 f(x)[청색, 중심(1,2)] ↔ 역함수 f⁻¹(x)[분홍 점선, 중심(2,1)]`,
            `표준형: 3/(x-1)+2 | 역함수: (x+1)/(x-2)`
          );
          return;
        }

        const p = 1, q = 2;
        const kVal = id === 'bas-8' ? (t < 0.4 ? -4 : t >= 0.8 ? 8 : 4) : 4;
        const Cpt = toScr(p, q, ox, oy, sc);

        dLine(toScr(p, -5, ox, oy, sc), toScr(p, 7, ox, oy, sc), C.gold, 2.2, [5, 4]);
        dLine(toScr(-5, q, ox, oy, sc), toScr(7, q, ox, oy, sc), C.gold, 2.2, [5, 4]);
        drawRightAngle(Cpt, toScr(p + 2, q, ox, oy, sc), toScr(p, q + 2, ox, oy, sc), 10, C.gold);

        if (id === 'bas-8' && step >= 2) {
          dLine(toScr(-4, -4 - p + q, ox, oy, sc), toScr(6, 6 - p + q, ox, oy, sc), C.cyan, 2.4, [4, 4], true);
          if (step >= 3) {
            dLine(toScr(-4, 4 + p + q, ox, oy, sc), toScr(6, -6 + p + q, ox, oy, sc), C.pink, 2.4, [4, 4], true);
          }
        }

        dCurve((x) => kVal / (x - p) + q, -5, p - 0.2, ox, oy, sc, C.green, 3.8);
        dCurve((x) => kVal / (x - p) + q, p + 0.2, 7, ox, oy, sc, C.green, 3.8);
        dDot(Cpt, `점근선 교점 C(${p}, ${q})`, C.gold, { x: 10, y: 16 }, true);

        // [P2 수리] bas-11에서 step=0에서도 프리셋 선택에 따라 약수 쌍 정상 필터링
        if (id === 'bas-11') {
          const pairs = [[-3, 1], [-1, 0], [0, -2], [2, 6], [3, 4], [5, 3]];
          pairs.forEach(([gx, gy]) => {
            const diff = Math.abs(gx - 1);
            const showThis = step >= 3 || (step === 1 && diff === 1) || (step === 2 && diff === 2) || (step === 0 && (t >= 0.8 || (t < 0.45 && diff === 1) || (t >= 0.45 && t < 0.8 && diff === 2)));
            if (!showThis) return;
            const G = toScr(gx, gy, ox, oy, sc);
            if ((step >= 2 || (step === 0 && t >= 0.45)) && diff === 2) {
              dPoly([Cpt, toScr(gx, 2, ox, oy, sc), G, toScr(1, gy, ox, oy, sc)], 'rgba(56,189,248,0.2)', C.cyan, 1.8);
            }
            dDot(G, `(${gx},${gy})`, C.cyan, { x: 8, y: -6 });
          });
          setMetric(
            `유리함수 y = 4/(x-1) + 2 위의 정수 좌표 점 탐색 (선택된 약수 쌍 표시)`,
            `분모 (x-1)이 4의 약수(±1, ±2, ±4)인 총 6개 점`
          );
          return;
        }

        setMetric(
          `현재 유리함수: y = ${kVal}/(x-${p}) + ${q} | 점근선 교점 (${p}, ${q})`,
          `점대칭: (1, 2) | 선대칭: y = x + 1, y = -x + 3`
        );
        return;
      }

      if (id === 'bas-10') {
        const ox = rect.width * 0.28 + state.panX;
        const oy = rect.height * 0.74 + state.panY;
        const sc = u * 1.02;
        drawAxesWithTicks(rect, ox, oy, sc);

        dLine(toScr(1, -2, ox, oy, sc), toScr(1, 7.5, ox, oy, sc), C.gold, 2.2, [5, 4]);
        dLine(toScr(-2, 1, ox, oy, sc), toScr(8.5, 1, ox, oy, sc), C.gold, 2.2, [5, 4]);
        dCurve((x) => 4 / (x - 1) + 1, 1.35, 8.2, ox, oy, sc, C.cyan, 3.8);

        const px = 1.6 + t * 4.0;
        const py = 4 / (px - 1) + 1;
        const Cpt = toScr(1, 1, ox, oy, sc);
        const P = toScr(px, py, ox, oy, sc);
        const A = toScr(px, 1, ox, oy, sc);
        const B = toScr(1, py, ox, oy, sc);

        dPoly([Cpt, A, P, B], 'rgba(56, 189, 248, 0.26)', C.cyan, 3.0, true);
        drawRightAngle(A, Cpt, P, 10, C.cyan);
        drawRightAngle(B, Cpt, P, 10, C.cyan);

        if (step >= 1) {
          drawDimension(Cpt, A, 24, `가로 a = ${(px - 1).toFixed(2)}`, C.cyan);
          drawDimension(Cpt, B, -28, `세로 b = ${(py - 1).toFixed(2)}`, C.cyan);
        }
        if (step >= 2) dLine(Cpt, P, C.cyan, 2, [4, 4]);
        if (step >= 3) {
          dLine(toScr(0, 0, ox, oy, sc), toScr(6.5, 6.5, ox, oy, sc), C.green, 2.4, [5, 4], true);
          dLine(Cpt, P, C.gold, 3.2, [], true);
        }

        dDot(Cpt, 'C(1, 1)', C.gold, { x: -48, y: 16 });
        dDot(A, 'A', C.cyan, { x: -6, y: 18 });
        dDot(B, 'B', C.cyan, { x: -18, y: 4 });
        dDot(P, `P(${px.toFixed(1)}, ${py.toFixed(1)})`, C.pink, { x: 10, y: -8 }, true);

        const perim = 2 * (px - 1 + py - 1);
        setMetric(
          `가로 = ${(px - 1).toFixed(2)}, 세로 = ${(py - 1).toFixed(2)} | 현재 둘레 ≈ ${perim.toFixed(2)}`,
          `넓이 = 4 (일정), 정사각형 P(3,3)에서 최소 둘레 = 8`
        );
        return;
      }

      // -----------------------------------------------------------------------
      // 🌱 [기본 12 & 13] bas-12, bas-13
      // -----------------------------------------------------------------------
      if (id === 'bas-12') {
        const ox = rect.width * 0.32 + state.panX;
        const oy = rect.height * 0.74 + state.panY;
        const sc = u * 0.95;
        drawAxesWithTicks(rect, ox, oy, sc);

        dCurve((x) => 4 / (x - 1) + 1, 1.35, 7.5, ox, oy, sc, 'rgba(56,189,248,0.32)', 2.4);
        dCurve((x) => 4 / (x - 1) + 1, 2, 4, ox, oy, sc, C.gold, 5.5, [], true);

        const P0 = toScr(0, 1, ox, oy, sc);
        const A = toScr(2, 5, ox, oy, sc);
        const B = toScr(4, 7 / 3, ox, oy, sc);

        if (step >= 2) {
          dPoly([P0, toScr(3, 7, ox, oy, sc), toScr(6, 3, ox, oy, sc)], 'rgba(251, 191, 36, 0.15)', null, 0);
          dLine(P0, toScr(3, 7, ox, oy, sc), C.cyan, 2.4, [5, 4], true);
        }
        if (step >= 3) {
          dLine(P0, toScr(6, 3, ox, oy, sc), C.pink, 2.4, [5, 4], true);
        }

        const m = 1 / 3 + t * (5 / 3);
        dLine(toScr(-1, 1 - m, ox, oy, sc), toScr(6, 1 + 6 * m, ox, oy, sc), C.green, 3.8, [], true);
        dDot(P0, '정점 P₀(0,1)', C.white, { x: -95, y: -6 });
        dDot(A, step >= 2 ? '끝점 A(2,5) [최대 m=2]' : '끝점 A(2,5)', C.cyan, { x: 10, y: -8 }, true);
        dDot(B, step >= 3 ? '끝점 B(4,7/3) [최소 m=1/3]' : '끝점 B(4, 7/3)', C.pink, { x: 10, y: 15 });

        setMetric(
          `현재 직선 기울기 m = ${m.toFixed(2)}`,
          `구간 [2, 4]에서 만나는 기울기 범위: 1/3 ≤ m ≤ 2`
        );
        return;
      }

      if (id === 'bas-13') {
        const ox = rect.width * 0.44 + state.panX;
        const oy = rect.height * 0.62 + state.panY;
        const sc = u * 0.92;
        drawAxesWithTicks(rect, ox, oy, sc);

        dLine(toScr(1, -3, ox, oy, sc), toScr(1, 7, ox, oy, sc), C.gold, 1.8, [5, 4]);
        dLine(toScr(-5, 2, ox, oy, sc), toScr(7, 2, ox, oy, sc), C.gold, 1.8, [5, 4]);
        dCurve((x) => 2 / (x - 1) + 2, -5, 0.7, ox, oy, sc, C.cyan, 3.8);
        dCurve((x) => 2 / (x - 1) + 2, 1.3, 7, ox, oy, sc, C.cyan, 3.8);

        if (step >= 2) {
          dLine(toScr(-4, 2.5, ox, oy, sc), toScr(6, -2.5, ox, oy, sc), C.gold, 2.2, [5, 4]);
          dDot(toScr(-1, 1, ox, oy, sc), '접점 (-1,1) [m=-1/2]', C.gold, { x: -125, y: -10 });
        }
        if (step >= 3) {
          dLine(toScr(-5, 0, ox, oy, sc), toScr(7, 0, ox, oy, sc), C.red, 2.6, [5, 4], true);
          dDot(toScr(0, 0, ox, oy, sc), '교점 (0,0) [m=0 점근선 평행]', C.red, { x: -165, y: 18 });
        }

        const m = Math.abs(t - 0.35) < 0.08 ? -0.5 : Math.abs(t - 0.65) < 0.08 ? 0 : -1.0 + t * 2.0;
        const isOne = Math.abs(m + 0.5) < 1e-9 || Math.abs(m) < 1e-9;
        const cnt = isOne ? 1 : (m > -0.5 ? 2 : 0);
        dLine(toScr(-4.5, -5.5 * m, ox, oy, sc), toScr(6.5, 5.5 * m, ox, oy, sc), isOne ? C.green : C.pink, 3.8, [], true);
        dDot(toScr(1, 0, ox, oy, sc), '정점 (1,0)', C.white, { x: 10, y: 16 });

        // [P2 수리] 회전하는 직선 위의 점에 조작 핸들을 달아 지렛대 회전 직관성 부여
        const guideX = 3.5;
        const guideY = m * (guideX - 1);
        dDot(toScr(guideX, guideY, ox, oy, sc), `기울기 m=${m.toFixed(2)}`, isOne ? C.green : C.pink, { x: 10, y: -8 }, true);

        setMetric(
          `현재 기울기 m = ${m.toFixed(2)} ➔ 교점 ${cnt}개`,
          `오직 한 점에서 만날 조건: m = -1/2 (접선) 또는 m = 0 (점근선 평행)`
        );
        return;
      }

      // -----------------------------------------------------------------------
      // 🌱 [기본 14 ~ 16] bas-14 ~ bas-16: 무리함수 4방향 · 무연근 · 절댓값 무리함수
      // -----------------------------------------------------------------------
      const ox = rect.width * 0.4 + state.panX;
      const oy = rect.height * 0.62 + state.panY;
      const sc = u * 1.02;
      drawAxesWithTicks(rect, ox, oy, sc);

      if (id === 'bas-14') {
        dCurve((x) => Math.sqrt(Math.max(0, 2 * (x - 1))) + 1, 1, 6.8, ox, oy, sc, C.cyan, 4.2);
        if (step >= 2 || t >= 0.5) {
          dCurve((x) => Math.sqrt(Math.max(0, -2 * (x - 1))) + 1, -4.8, 1, ox, oy, sc, C.pink, 3.8);
          dCurve((x) => -Math.sqrt(Math.max(0, -2 * (x - 1))) + 1, -4.8, 1, ox, oy, sc, C.green, 3.8);
          dCurve((x) => -Math.sqrt(Math.max(0, 2 * (x - 1))) + 1, 1, 6.8, ox, oy, sc, C.gold, 3.8);
        }
        if (step >= 3 || t >= 0.9) {
          // 네 무리함수의 합동을 설명하는 두 반사축.
          dLine(toScr(1, -4, ox, oy, sc), toScr(1, 6.5, ox, oy, sc), 'rgba(251,191,36,0.5)', 1.8, [5, 5]);
          dLine(toScr(-5, 1, ox, oy, sc), toScr(7, 1, ox, oy, sc), 'rgba(251,191,36,0.5)', 1.8, [5, 5]);
          dLine(toScr(-2, -2, ox, oy, sc), toScr(6, 6, ox, oy, sc), 'rgba(255,255,255,0.45)', 2, [5, 4]);
          dCurve((x) => 0.5 * (x - 1) ** 2 + 1, 1, 4.5, ox, oy, sc, C.purple, 3.5, [5, 3], true);
        }
        dDot(toScr(1, 1, ox, oy, sc), '시작점 S(1, 1)', C.white, { x: -45, y: -12 }, true);
        setMetric(
          `시작점 S(1,1) 기준 부호쌍 (±, ±)에 따른 그래프 방향`,
          `(+,+) 우상향 · (-,+) 좌상향 · (-,-) 좌하향 · (+,-) 우하향`
        );
        return;
      }

      if (id === 'bas-16') {
        if (step >= 1) dLine(toScr(1, -3, ox, oy, sc), toScr(1, 6, ox, oy, sc), 'rgba(255,255,255,0.28)', 1.6, [4, 4]);
        if (step >= 2) dLine(toScr(-4, -5, ox, oy, sc), toScr(6, 5, ox, oy, sc), 'rgba(56,189,248,0.5)', 2, [5, 4]);
        if (step >= 3) dLine(toScr(-4, -4, ox, oy, sc), toScr(6, 6, ox, oy, sc), 'rgba(251,191,36,0.5)', 2, [5, 4]);

        dCurve((x) => 2 * Math.sqrt(Math.abs(x - 1)), -4.8, 1, ox, oy, sc, C.cyan, 3.8);
        dCurve((x) => 2 * Math.sqrt(Math.abs(x - 1)), 1, 6.8, ox, oy, sc, C.cyan, 3.8);

        const k = 0.4 - t * 1.8;
        const isThree = k > -1.0 && k < 0.0;
        const cnt = k > 0 ? 1 : (Math.abs(k) < 1e-9 || Math.abs(k + 1) < 1e-9 ? 2 : (isThree ? 3 : 1));
        dLine(toScr(-4, -4 + k, ox, oy, sc), toScr(6, 6 + k, ox, oy, sc), isThree ? C.green : C.gold, 3.8, [], true);
        dDot(toScr(1, 0, ox, oy, sc), step >= 2 ? '점 (1,0) [k=-1]' : '점 (1,0)', C.gold, { x: -45, y: 18 }, true);

        setMetric(
          `직선 y = x + (${k.toFixed(2)}) ➔ 교점 ${cnt}개`,
          `서로 다른 3개의 점에서 만날 조건: -1 < k < 0`
        );
        return;
      }

      // bas-15: 무리함수와 직선의 교점
      if (step >= 3) {
        dCurve((x) => -2 * Math.sqrt(Math.max(0, x - 1)) + 1, 1, 6.8, ox, oy, sc, C.red, 2.8, [6, 4], true);
      }
      if (step >= 1) dLine(toScr(-3.5, -3.5, ox, oy, sc), toScr(6, 6, ox, oy, sc), 'rgba(56,189,248,0.55)', 2, [5, 4]);
      if (step >= 2) dLine(toScr(-3.5, -2.5, ox, oy, sc), toScr(6, 7, ox, oy, sc), 'rgba(251,191,36,0.55)', 2, [5, 4]);

      dCurve((x) => 2 * Math.sqrt(Math.max(0, x - 1)) + 1, 1, 6.8, ox, oy, sc, C.cyan, 4.2);

      const k = 1.4 - t * 2.2;
      const counts = plotIntersections(k, ox, oy, sc, false, step >= 3);
      const isTwo = counts.real === 2;
      dLine(toScr(-3.5, -3.5 + k, ox, oy, sc), toScr(6, 6 + k, ox, oy, sc), isTwo ? C.green : C.gold, 3.8, [], true);
      dDot(toScr(1, 1, ox, oy, sc), step >= 1 ? '시작점 S(1,1) [k=0]' : '시작점 S(1,1)', C.cyan, { x: 10, y: 15 });
      if (step >= 2) {
        dDot(toScr(2, 3, ox, oy, sc), '접점 (2,3) [k=1]', C.gold, { x: -105, y: -8 }, true);
      } else {
        dDot(toScr(0, k, ox, oy, sc), `y절편 k=${k.toFixed(2)}`, isTwo ? C.green : C.gold, { x: -110, y: -8 }, true);
      }

      setMetric(
        `직선 y = x + (${k.toFixed(2)}) ➔ 실제 교점 ${counts.real}개`,
        `무연근 ${counts.ghost}개 | 서로 다른 두 점 교차 범위: 0 ≤ k < 1`
      );
    }

  /* ======================================================================
     2.0 셸 연결 (새로 작성한 부분)
     ====================================================================== */
  const MAX_STEP = 4; // 원본 보조선 단계: 0 처음 그림 · 1~3 보조선 · 4 전체 보기
  const clampStep = (s) => Math.min(Math.max(s.step || 0, 0), MAX_STEP);
  const pOf = (id) => PROBLEMS.find((p) => p.id === id) || PROBLEMS[0];
  function sync(s, idx) {
    state.probIdx = idx;
    state.auxStep = clampStep(s);
    state.sliderT = s.t;
    state.animT = s.anim == null ? 1 : s.anim;
    state.scale = 1;
    state.panX = 0;
    state.panY = 0;
  }
  // 원본 refreshBoardTabs 의 풀이 이름 규칙
  const geoLabel = (p) => (p.id === 'adv-3' ? '핵심 정석 풀이' : p.id.startsWith('adv') ? '실전 최적 풀이' : '단계별 풀이');
  // 문제 지문 맨 끝의 굵은 물음("…구하시오.")을 탐구 질문 자리에 둡니다.
  const askOf = (p) => {
    const m = p.statement.match(/<div class="mt-1\.5 font-bold text-amber-300">([\s\S]*?)<\/div>/g);
    if (!m) return p.tabLabel;
    return m[m.length - 1].replace(/<[^>]+>/g, '').trim();
  };

  const params = {
    t: { value: 0.5, min: 0, max: 1, step: 0.005, color: 'amber', label: '도형 조작',
      format: (v, s) => { state.auxStep = clampStep(s); return getParamReadout(pOf(window.lab && window.lab.scene.id), v); },
      onInput: (s) => { s.t = snapT(s.t); } }
  };

  function sceneOf(p, idx) {
    const solT = solutionSlider(p.id);
    const stepsHtml = p.steps.map((st) => `<div style="margin-bottom:10px"><b>${st.title}</b><br/>${st.desc}</div>`).join('');
    return {
      id: p.id, title: arrow(p.title), short: arrow(p.tabLabel), reviewTab: true, autoFit: true,
      question: arrow(askOf(p)),
      notesTitle: '핵심 직관 (아하!)',
      startStep: 0,
      enter: (s, lab) => {
        s.t = p.defaultT;
        s.anim = 1;
        // 미리보기가 다른 장면의 enter 를 부를 때는 지금 장면의 조절 막대 이름을 바꾸지 않습니다.
        if (!lab || !lab.scene || lab.scene.id === p.id) { params.t.label = arrowOnly(p.sliderTitle); state.probIdx = idx; }
      },
      controls: () => ['t'],
      presets: (s) => p.snaps.map((sn) => ({
        group: '바로 가기',
        label: clampStep(s) >= 3 ? sn.label : (sn.neutralLabel || sn.label),
        set: { t: sn.t }, ms: 500,
        on: (st) => Math.abs(st.t - sn.t) < 0.03
      })),
      steps: () => p.auxHints.slice(1).map((h) => cv(arrow(h))),
      solution: {
        standardTitle: p.id === 'adv-3' ? '오답 함정 분석' : '풀이 비교 (대수적 풀이)',
        standardTag: p.id === 'adv-3' ? '함정' : '대수',
        quickTitle: geoLabel(p),
        quickTag: '도형',
        standard: () => ({ steps: arrow(p.alg) }),
        quick: () => ({ steps: arrow(stepsHtml), highlight: arrow(p.aha) })
      },
      problem: {
        tag: cv(arrow(p.badge)),
        text: arrow(p.statement),
        answer: arrow(p.answer),
        ...(solT != null ? { snap: () => ({ t: solT }) } : {})
      },
      view: (s) => {
        const step = clampStep(s);
        const v = { guide: cv(arrow(p.auxHints[step] || p.auxHints[0])) };
        if (step >= 3) v.notes = arrow(p.aha); // 원본: 3단계부터 '핵심 직관'이 열림
        if (step > 0 && solT != null && Math.abs(s.t - solT) > 0.025) {
          v.alert = { tone: 'info', text: '지금 그림은 조절 막대로 움직인 자유 탐구 위치입니다. 풀이는 문제에 주어진 조건 위치를 기준으로 설명합니다.' };
        }
        return v;
      },
      draw: (b, s, v, lab) => {
        BOARD = b;
        CUR = s;
        const paint = (st) => {
          sync(st, idx);
          HN = 0;
          placedLabels = [];
          drawScene();
        };
        // 자동 맞춤을 재는 중: 조절 막대 값과 보조선 단계를 모두 겹쳐 그려, 어느 조작에서도 그림·글자가 잘리지 않는 범위를 구합니다.
        const paintAll = () => {
          for (let stp = 0; stp <= MAX_STEP; stp++) for (const tt of [0, 0.25, 0.5, 0.75, 1]) paint({ ...s, step: stp, t: tt, anim: 1 });
          paint({ ...s, anim: 1 });
        };
        if (b._bbox) { paintAll(); return; }
        if (b.thumb) { // 모든 장면 미리보기: 문제 조건 위치(step 99 → 전체 보조선)를 장면 범위에 맞춰 그림
          const bb = b.measure(paintAll);
          if (bb) b.focus = b.fitBox(bb, { margin: 0.08, px: 5 });
          paint(s);
          return;
        }
        // 원본 setAuxStep: 보조선 단계를 바꾸면 도형이 0 → 1 로 자라나는 효과(animT)가 있습니다.
        // 단계가 '완성' 단계(STEP_T.from) 이상이 되면 조절 막대도 완성 위치로 함께 보냅니다(되돌릴 때는 처음 위치로).
        const sp = STEP_T[p.id];
        if (LAST.id !== p.id) {
          LAST.id = p.id; LAST.step = s.step;
          if (sp && s.step >= sp.from && s.t < sp.t) { s.t = sp.t; if (lab) lab.invalidate(true); } // 이전 장면에서 마지막 단계로 바로 들어온 경우
        } else if (LAST.step !== s.step) {
          const prev = LAST.step;
          LAST.step = s.step;
          s.anim = 0;
          const goal = { anim: 1 };
          if (sp) {
            if (s.step >= sp.from && s.t < sp.t) goal.t = sp.t;
            else if (s.step < sp.from && prev >= sp.from && s.t > p.defaultT) goal.t = p.defaultT;
          }
          if (lab && lab.tween) lab.tween(goal, 400);
        }
        paint(s);
        v.status = LIVE.text ? { tone: 'info', text: arrowOnly(LIVE.text) } : null;
      }
    };
  }
  const LAST = { id: null, step: null };
  // 조절 막대가 곧 '완성도'인 장면: 보조선 단계가 from 이상이면 막대를 t 로 맞춥니다. (기본 4: 합성함수 그래프 작도)
  const STEP_T = { 'bas-4': { from: 3, t: 1.0 } };

  const UNITS = [
    { roman: 'Ⅰ', title: 'Ⅰ. 합성함수와 역함수', short: '합성·역함수' },
    { roman: 'Ⅱ', title: 'Ⅱ. 유리함수의 기하학', short: '유리함수' },
    { roman: 'Ⅲ', title: 'Ⅲ. 유리함수와 직선', short: '유리함수와 직선' },
    { roman: 'Ⅳ', title: 'Ⅳ. 무리함수', short: '무리함수' }
  ];
  const unitOf = (p) => UNITS.findIndex((u) => p.unit.startsWith(u.roman));
  const rank = (p) => (p.id.startsWith('bas') ? 0 : 100) + parseInt(p.id.split('-')[1], 10); // 묶음 안에서는 기본 → 심화 순서
  const groups = UNITS.map((u, ui) => ({
    id: 'u' + (ui + 1), title: u.title, short: u.short,
    scenes: PROBLEMS.map((p, i) => ({ p, i })).filter((x) => unitOf(x.p) === ui).sort((a, b) => rank(a.p) - rank(b.p)).map((x) => sceneOf(x.p, x.i))
  }));

  APLab.createLab({
    id: 'common-functions',
    title: '합성함수 · 유리 · 무리함수',
    courseName: '공통수학',
    unit: '함수와 그래프',
    courseColor: 'var(--m-green)',
    home: '../index.html#common',
    legacy: '../../labs/공통수학/합성함수·유리함수·무리함수.html',
    board: { kind: 'figure', autoFit: true, minZoom: 0.4, maxZoom: 6 },
    state: { anim: 1 },
    params,
    groups
  });
});
</script>
