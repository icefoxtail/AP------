<script>
/* ==========================================================================
   미적분Ⅰ · 접선과 미분계수 (AP Math Lab 2.0 이식본)
   원본: labs/미적분1/접선과 미분계수.html
   - 문제·단계·정석/빠른 풀이 문구(examData)는 원본을 그대로 옮겼습니다.
   - 수학 함수(f, f′, g, 평균값 정리 c, 수선의 발·거리)는 원본과 같은 식입니다.
   - 바뀐 점: 셸·레이아웃은 공용 키트가 담당, 무대는 1:1 축척(원본은 y축 0.82배),
     장면 3에 끌 수 있는 점 2개(단차 Δh, 기울기 p) 추가, 의미색으로 색 통일.
   ========================================================================== */
window.addEventListener('DOMContentLoaded', function () {
  const { tex, fmt, clamp } = APLab;
  // 원클릭 해설은 첫 원문을 읽고, 수동 새 문제의 선택은 그대로 보존합니다.
  const ctActive = (s) => !!(s && (s.lessonOn || s.lessonEntry));

  /* ---------- 1. 함수 (원본 evalF / evalFp / evalG_Mode5 / getMVTPoints) ---------- */
  const F = {
    1: (x) => 0.5 * x * x * x - 1.5 * x + 1.0,
    2: (x) => 0.5 * x * x * x - 1.5 * x + 1.0,
    4: (x) => 0.5 * x * x + 0.5,
    5: (x) => 0.5 * x * x * x - 0.5 * x + 1.0
  };
  const FP = {
    1: (x) => 1.5 * x * x - 1.5,
    2: (x) => 1.5 * x * x - 1.5,
    4: (x) => x,
    5: (x) => 1.5 * x * x - 0.5
  };
  const f3 = (s) => (x) => (x < 1.0 ? x * x : s.slopeR * (x - 1.0) + 1.0 + s.gapH);
  const g5 = (s) => (x) => { const t = s.a, u = x - t; return -0.8 * u * u + FP[5](t) * u + F[5](t); };
  function getMVTPoints(a, b) {
    const minX = Math.min(a, b), maxX = Math.max(a, b);
    if (maxX - minX <= 1e-12) return [];
    const val = (a * a + a * b + b * b) / 3;
    if (val < 0) return [];
    const cPos = Math.sqrt(val), cNeg = -cPos, res = [];
    if (cNeg > minX + 1e-12 && cNeg < maxX - 1e-12) res.push(cNeg);
    if (cPos > minX + 1e-12 && cPos < maxX - 1e-12 && Math.abs(cPos - cNeg) > 1e-12) res.push(cPos);
    return res;
  }
  const safeDx = (dx) => dx;
  const secantSlope = (a, dx) => 1.5 * a * a + 1.5 * a * dx + 0.5 * dx * dx - 1.5; // dx≠0에서 차분몫과 정확히 같고, 0에서는 그 극한
  const p2 = (x, y) => `(${fmt(x)}, ${fmt(y)})`;

  /* ---------- 2. 문제·풀이 데이터 (원본 examData 그대로) ---------- */
  const examData = {
      1: {
        badge: "장면 1 · 평균변화율(할선)에서 미분계수(접선의 기울기)로 가는 극한과 h의 계수의 차",
        hint: "하늘색 점 <span class='text-sky-300 font-bold'>B(a+Δx)</span>를 끌어서 고정된 점 <span class='text-amber-300 font-bold'>A(a)</span>에 가까이 가져가 보세요! Δx → 0 일 때 할선이 접선에 겹쳐집니다.",
        tag: "미분계수의 정의를 이용한 극한값",
        targetTime: "목표 시간: 3초",
        question: () => `다항함수 ${tex('f(x) = \\dfrac{1}{2}x^3 - \\dfrac{3}{2}x + 1')} 에 대하여 ${tex('x')}의 값이 ${tex('1')}에서 ${tex('3')}까지 변할 때의 평균변화율과, 극한값 ${tex('\\lim_{h \\to 0} \\dfrac{f(2 + 3h) - f(2 - 2h)}{h}')} 의 값을 각각 구하시오.`,
        answerBadge: () => `평균변화율 ${tex('= 5')}, 극한값 ${tex('= 5f\'(2) = 22.5')}`,
        snap: { a: 1.0, dx: 2.0, slopeR: 2.0, gapH: 0.0, dualView: false },
        steps: [
          "1단계 · 점 A(1, f(1)), B(3, f(3))를 잇는 할선 AB의 기울기, 즉 평균변화율을 구합니다.",
          "2단계 · h가 0에 가까워지면 x=2+3h와 x=2−2h가 모두 x=2에 가까워집니다. 분자를 f(2+3h)−f(2)와 f(2−2h)−f(2)로 나누어 미분계수의 정의와 연결합니다.",
          "3단계 · f′(2)의 값을 구한 뒤, h의 계수 3과 −2의 차 3−(−2)=5를 곱해 극한값을 구합니다."
        ],
        textbook: () => ({
          steps: `① 평균변화율: ${tex('\\dfrac{f(3) - f(1)}{3 - 1} = \\dfrac{10 - 0}{2} = 5')}<br/>
② 극한식을 변형하기 위해 분자에 ${tex('-f(2) + f(2)')} 를 더하고 빼서 분리:<br/>
&nbsp;&nbsp;${tex('\\lim_{h \\to 0} \\left\\{ \\dfrac{f(2+3h)-f(2)}{3h}\\cdot 3 + \\dfrac{f(2-2h)-f(2)}{-2h}\\cdot 2 \\right\\}')}<br/>
③ 미분계수의 정의에 의해 ${tex("3f'(2) + 2f'(2) = 5f'(2)")}<br/>
④ ${tex("f'(x)=\\frac32x^2-\\frac32")}이므로 ${tex("f'(2)=\\frac92")}; 따라서 극한값은 ${tex("5\\cdot\\frac92=\\frac{45}{2}")}입니다.`,
          warning: "⚠️ f(2)를 더하고 빼서 극한식을 둘로 나누는 과정을 매번 쓰면 오래 걸립니다. 아래 빠른 풀이의 공식으로 줄일 수 있습니다."
        }),
        shortcut: () => ({
          steps: `① 미분가능한 함수에서 ${tex('\\lim_{h \\to 0} \\dfrac{f(a + ph) - f(a + qh)}{h}')} 의 값은 <strong class="text-pink-300">【 ${tex('(p - q)\\times f\'(a)')} 】</strong>입니다. (분자에 ${tex('f(a)')}를 더하고 빼면 ${tex("p\\,f'(a) - q\\,f'(a)")}가 되기 때문입니다.)<br/>
② 이 문제에서는 ${tex('p = 3, \\; q = -2')} 이므로 ${tex('(3 - (-2))f\'(2) = 5f\'(2)')} 입니다.<br/>
③ ${tex("f'(2) = 4.5")} 를 대입하면 <strong class="text-amber-300">${tex('5 \\times 4.5 = 22.5 \\; (\\frac{45}{2})')}</strong> 입니다.`,
          highlight: `💡 ${tex('f')}가 ${tex('x=a')}에서 미분가능하면 ${tex('\\lim_{h \\to 0} \\dfrac{f(a + ph) - f(a + qh)}{h} = (p - q)f\'(a)')} 입니다.`
        })
      },

      2: {
        badge: "장면 2 · 평균값 정리: 할선과 평행한 접선 찾기",
        hint: "양 끝점 <span class='text-amber-300 font-bold'>A</span>와 <span class='text-sky-300 font-bold'>B</span>를 끌어 보세요! 할선 AB와 기울기가 같은 <span class='text-pink-300 font-bold'>할선 AB에 평행한 접선의 접점 c</span>가 바로 표시됩니다.",
        tag: "평균값 정리를 만족시키는 c의 값",
        targetTime: "목표 시간: 5초",
        question: () => `함수 ${tex('f(x) = \\dfrac{1}{2}x^3 - \\dfrac{3}{2}x + 1')} 에 대하여 닫힌구간 ${tex('[-1, 2]')}에서 평균값 정리를 만족시키는 상수 ${tex('c \\; (-1 < c < 2)')}의 값을 구하시오.`,
        answerBadge: () => `${tex('c = \\pm 1')} 중 열린구간 내부인 ${tex('c = 1')}`,
        snap: { a: -1.0, dx: 3.0, slopeR: 2.0, gapH: 0.0, dualView: false },
        steps: [
          "1단계 · f(x)=½x³−(3/2)x+1이 [−1, 2]에서 연속이고 (−1, 2)에서 미분가능한지 확인합니다.",
          "2단계 · 두 점 A(−1, f(−1)), B(2, f(2))를 지나는 할선의 기울기(평균변화율)와 f′(c)가 같다는 방정식을 세웁니다.",
          "3단계 · f′(c)=(평균변화율)을 풀어 얻은 c의 후보 중에서 열린구간 (−1, 2) 안에 있는 값을 고릅니다."
        ],
        textbook: () => ({
          steps: `① 구간 ${tex('[-1, 2]')}에서의 평균변화율 계산:<br/>
&nbsp;&nbsp;${tex('\\dfrac{f(2) - f(-1)}{2 - (-1)} = \\dfrac{2 - 2}{3} = 0')}<br/>
② 도함수 ${tex("f'(c) = \\dfrac{3}{2}c^2 - \\dfrac{3}{2} = 0")} 방정식 풀이:<br/>
&nbsp;&nbsp;${tex('c^2 = 1 \\implies c = -1')} 또는 ${tex('c = 1')}<br/>
③ 후보 ${tex('c=-1,1')} 중 ${tex('-1')}은 구간 끝점이라 제외합니다. 따라서 열린구간 ${tex('(-1,2)')} 안의 값은 ${tex('c=1')}뿐입니다.`,
          warning: "⚠️ f(−1)=f(2)=2이면 할선 AB가 수평선이므로 평균변화율이 0이고, f′(c)=0만 풀면 됩니다. 단, 구한 c가 구간의 끝점이면 열린구간 (−1, 2)에 속하지 않으므로 제외합니다."
        }),
        shortcut: () => ({
          steps: `① ${tex('f(-1) = 2')} 이고 ${tex('f(2) = 2')} 이므로 할선 ${tex('AB')}는 기울기가 ${tex('0')}인 수평선 ${tex('y=2')}입니다.<br/>
② ${tex('f(x)-2=\\frac12(x+1)^2(x-2)')}로 인수분해되므로, 그래프는 ${tex('x=-1')}에서 직선 ${tex('y=2')}에 접하고 ${tex('x=2')}에서 이 직선과 만납니다.<br/>
③ 접선의 기울기가 ${tex('0')}인 점의 ${tex('x')}좌표는 ${tex("f'(c)=\\frac32(c^2-1)=0")}에서 ${tex('c=\\pm1')}이고, 열린구간 ${tex('(-1,2)')} 안에 있는 값은 <strong class="text-amber-300">${tex('c=1')}</strong>입니다.`,
          highlight: `💡 이 문항의 ${tex('f(x)=\\frac12x^3-\\frac32x+1')}은 ${tex('x^2')}항이 없으므로 ${tex('f\\prime(c)=\\frac32(c^2-1)')}입니다. 양 끝값이 같아 평균 기울기가 0이므로 ${tex('c=\\pm1')}, 열린구간에서는 ${tex('c=1')}입니다.`
        })
      },

      3: {
        badge: "장면 3 · 미분가능성 판정: 불연속, 꺾인 점, 미분가능한 접합",
        hint: "탐구 탭의 <span class='text-amber-300 font-bold'>접합 상태 버튼(① 미분가능 / ② 꺾인 점 / ③ 불연속)</span>을 눌러 보거나, 조절 막대로 오른쪽 직선의 기울기 <span class='text-pink-300 font-bold'>p</span>와 경계에서의 높이 차 <span class='text-sky-300 font-bold'>Δh</span>를 바꿔 보세요!",
        tag: "구간별로 정의된 함수의 미분가능성",
        targetTime: "목표 시간: 5초",
        question: () => `실수 전체의 집합에서 정의된 함수 ${tex('f(x) = \\begin{cases} x^2 & (x < 1) \\\\ px + q & (x \\ge 1) \\end{cases}')} 이 ${tex('x = 1')} 에서 미분가능할 때, 상수 ${tex('p, q')}의 값을 구하시오.`,
        answerBadge: () => `${tex('p = 2, \\; q = -1 \\; (p + q = 1)')}`,
        snap: { a: 1.0, dx: 1.0, slopeR: 2.0, gapH: 0.0, dualView: true },
        steps: [
          "1단계 · x=1에서 왼쪽 식 x²과 오른쪽 식 px+q의 함숫값이 같아야(연속) 한다는 조건을 세웁니다.",
          "2단계 · 왼쪽 식의 x=1에서의 미분계수 2와 오른쪽 직선의 기울기 p가 같아야 한다는 조건을 세웁니다.",
          "3단계 · 연속 조건과 미분계수 조건을 함께 만족하는 p, q를 구하고 원래 식에서 확인합니다."
        ],
        textbook: () => ({
          steps: `① ${tex('x = 1')} 에서 미분가능하면 연속이므로:<br/>
&nbsp;&nbsp;${tex('\\lim_{x \\to 1-} x^2 = f(1) \\implies 1 = p + q')}<br/>
② 미분계수의 정의를 이용해 좌미분계수와 우미분계수 각각 극한 계산:<br/>
&nbsp;&nbsp;${tex('\\lim_{h \\to 0-} \\dfrac{(1+h)^2 - 1}{h} = 2')}, &nbsp;${tex('\\lim_{h \\to 0+} \\dfrac{p(1+h)+q - 1}{h} = p')}<br/>
③ 연속 조건 ${tex('p+q=1')}에 ${tex('p=2')}를 대입하면 ${tex('q=-1')}입니다. 그러면 두 식은 점 ${tex('(1,1)')}에서 만나고 양쪽 기울기도 2로 같습니다.`,
          warning: "⚠️ 구간별로 정의된 다항함수에서 매번 h → 0−, h → 0+ 의 극한으로 정의식을 세우면 오래 걸립니다. 아래 빠른 풀이를 함께 보세요."
        }),
        shortcut: () => ({
          steps: `① <strong>[1단계: 연속 조건]</strong> 두 식에 ${tex('x = 1')} 을 대입한 값이 같아야 하므로 <strong class="text-sky-300">${tex('1 = p + q')}</strong><br/>
② <strong>[2단계: 미분계수가 같을 조건]</strong> 두 식을 각각 미분(${tex('2x')} 와 ${tex('p')})하여 ${tex('x = 1')} 을 대입한 값이 같아야 하므로 <strong class="text-pink-300">${tex('p = 2')}</strong><br/>
③ 연립하면 <strong class="text-amber-300">${tex('p = 2, \\; q = -1')}</strong> 을 얻습니다.`,
          highlight: "💡 구간별로 정의된 다항함수가 경계 x=a에서 미분가능하려면 ① 두 식의 x=a에서의 함숫값이 같고(연속), ② 두 식을 각각 미분한 식의 x=a에서의 값도 같아야 합니다."
        })
      },

      4: {
        badge: "장면 4 · 법선의 방정식과 곡선·직선 사이의 최단거리",
        hint: "곡선 위의 점 <span class='text-amber-300 font-bold'>T(a, f(a))</span>를 끌어 보세요! 접선의 기울기가 <span class='text-pink-300 font-bold'>직선 y = x − 2의 기울기(1)와 같아지는 순간(a=1)</span> 접선이 직선과 평행해지고, 법선(접선에 수직인 직선)이 직선과 수직이 되며 거리가 최소가 됩니다!",
        tag: "곡선 위의 점과 직선 사이의 최단거리",
        targetTime: "목표 시간: 5초",
        question: () => `곡선 ${tex('y = \\dfrac{1}{2}x^2 + \\dfrac{1}{2}')} 위의 점 ${tex('T(a, f(a))')}와 직선 ${tex('y = x - 2')} 사이의 거리가 최소가 될 때, 점 ${tex('T')}의 좌표와 최단거리 ${tex('d_{\\min}')}을 구하시오.`,
        answerBadge: () => `접점 ${tex('T(1, 1)')}, 최단거리 ${tex('d_{\\min} = \\sqrt{2}')}`,
        snap: { a: 1.0, dx: 1.0, slopeR: 2.0, gapH: 0.0, dualView: false },
        steps: [
          "1단계 · T(a, ½a²+½)와 직선 x−y−2=0 사이의 거리를 점과 직선 사이의 거리 공식으로 나타냅니다.",
          "2단계 · 거리의 분자를 a에 대한 이차식으로 정리하고 완전제곱식으로 고쳐 최솟값과 등호가 성립하는 a를 찾습니다.",
          "3단계 · 거리가 최소일 때 접선이 직선과 평행하고, T에서 직선에 내린 수선(법선)이 직선과 수직임을 확인합니다."
        ],
        textbook: () => ({
          steps: `① 곡선 위의 임의의 점을 ${tex('T\\left(a, \\dfrac{1}{2}a^2 + \\dfrac{1}{2}\\right)')} 로 설정<br/>
② 점과 직선 ${tex('x - y - 2 = 0')} 사이의 거리 공식에 대입:<br/>
&nbsp;&nbsp;${tex('d = \\dfrac{\\left| a - \\left(\\dfrac{1}{2}a^2 + \\dfrac{1}{2}\\right) - 2 \\right|}{\\sqrt{1^2 + (-1)^2}} = \\dfrac{\\left| -\\dfrac{1}{2}a^2 + a - \\dfrac{5}{2} \\right|}{\\sqrt{2}}')}<br/>

  const cxRint = (n) => Math.floor(Math.random() * n);

  const cxStep = (lab, s) => (lab && lab.tab === 'problem' ? (lab._answerOpen && lab._answerOpen() ? 3 : 0) : s.step);
  // 장면마다(또는 문제가 바뀔 때마다) 보이는 범위를 한 번만 맞춥니다. 사용자가 확대·이동한 뒤에는 건드리지 않습니다.
  function cxFocus(b, key, box) {

  // 점들이 모두 들어오는 창(여백 포함)
  function cxWin(pts, o = {}) {
    let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
    pts.forEach((p) => { x0 = Math.min(x0, p[0]); x1 = Math.max(x1, p[0]); y0 = Math.min(y0, p[1]); y1 = Math.max(y1, p[1]); });
    const mx = o.mx == null ? 0.9 : o.mx, my = o.my == null ? 0.9 : o.my;

    if (x1 - x0 < minW) { const c = (x0 + x1) / 2; x0 = c - minW / 2; x1 = c + minW / 2; }
    if (y1 - y0 < minH) { const c = (y0 + y1) / 2; y0 = c - minH / 2; y1 = c + minH / 2; }

  // 다항식 TeX: 계수 배열(높은 차수부터, 정수) 예: [1, -3, 0, 2] → x^3-3x^2+2
  function cxPoly(co) {
    const n = co.length;
    let out = '';
    co.forEach((c, i) => {
      if (!c) return;
      const deg = n - 1 - i, a = Math.abs(c);
      const t = deg === 0 ? '' : deg === 1 ? 'x' : `x^${deg}`;
      const body = t ? (a === 1 ? t : a + t) : String(a);
      out += (c < 0 ? '-' : out ? '+' : '') + body;

  const cxFrac = (n, d) => { // 기약분수 TeX와 값

    n /= k; d /= k;
    if (d < 0) { n = -n; d = -d; }
    return { tex: d === 1 ? String(n) : (n < 0 ? '-' : '') + `\\dfrac{${Math.abs(n)}}{${d}}`, val: n / d };

  // 화살표(방향 dir, 세계 좌표 길이 len)
  function cxArrow(b, p, dir, len, color, o = {}) {
    const n = Math.hypot(dir[0], dir[1]) || 1, ux = dir[0] / n, uy = dir[1] / n;
    const q = [p[0] + ux * len, p[1] + uy * len];
    b.seg(p, q, { color, width: o.width || 3.2, glow: true, ref: o.ref });
    const hl = o.head || 0.2, ca = Math.cos(0.45), sa = Math.sin(0.45);
    const bx = -ux, by = -uy;
    b.poly([q, [q[0] + hl * (bx * ca - by * sa), q[1] + hl * (bx * sa + by * ca)], [q[0] + hl * (bx * ca + by * sa), q[1] + hl * (-bx * sa + by * ca)]], { fill: color, fillAlpha: 1, color: null, ref: o.ref });

  // f가 g보다 위인(또는 g가 f보다 위인) 구간을 색칠: top(x) > bot(x) 인 곳
  function cxShadeBetween(b, top, bot, x0, x1, col, alpha, ref) {
    const N = 200;
    let run = null;
    const flush = () => { if (run && run.t.length > 1) b.poly(run.t.concat(run.b.slice().reverse()), { fill: col, fillAlpha: alpha, color: null, ref }); run = null; };
    for (let i = 0; i <= N; i++) {

  const cxJosa = (w, a, b) => { const c = w.charCodeAt(w.length - 1); return w + (c >= 0xAC00 && c <= 0xD7A3 && (c - 0xAC00) % 28 !== 0 ? a : b); };

  /* ==========================================================================
     응용 장면 6 · 접점을 움직일 때 접선의 y절편이 만드는 함수 g(t)    — 근거: 분류표 C08
     응용 장면 7 · 할선 기울기 부등식이 허용하는 f의 범위 (평균값 정리)  — 근거: 분류표 C11

  const f8 = (x) => 0.5 * x * x * x - 1.5 * x * x + 1;
  const fp8 = (x) => 1.5 * x * x - 3 * x;

  const xint8 = (t) => { const m = fp8(t); return Math.abs(m) < 1e-10 ? null : t - f8(t) / m; };
  const R8 = (v) => Math.round(v * 100) / 100;

      `$f'(x)=${ouPoly(v.dq)}$에서 $f'(${v.a0})=${v.fpq.tex}$. 그러므로 극한값은 $(${v.p}-(${v.q}))f'(${v.a0})=${v.lim.tex}$. 평균변화율 $${v.avg.tex}$과 한 점의 미분계수를 구별해 검산합니다.`
    ],
    core: '<b>h의 계수가 곱해집니다</b><br>$f$ 가 $x=a$ 에서 미분가능하면 $\\displaystyle\\lim_{h\\to0}\\dfrac{f(a+ph)-f(a+qh)}{h}=(p-q)\\,f\'(a)$ 입니다. 평균변화율은 두 점을 잇는 할선의 기울기, $f\'(a)$ 는 점 $(a,f(a))$ 에서 접선의 기울기입니다.',
    draw: (b, s, v, st) => {
      const f = v.F, A = [v.x1, f(v.x1)], B = [v.x2, f(v.x2)], P = [v.a0, f(v.a0)];
      b.plot(f, { color: 'ink', width: 3.2, glow: true });
      ouCurveTag(b, f, 'y = f(x)', 'ink', { side: 'left', dy: 16, skip: [A, B, P].map((q) => [q[0], q[1], 1.6]) });
      if (st >= 1) {
        const corner = [B[0], A[1]];
        b.line(A, (B[1] - A[1]) / (B[0] - A[0]), { color: 'sky', width: 2.6, glow: true });
        b.seg(A, corner, { color: 'amber', width: 2, dash: true });
        b.seg(corner, B, { color: 'sky', width: 2, dash: true });
        ouTag(b, [(A[0] + B[0]) / 2, A[1]], `Δx=${v.x2 - v.x1}`, { color: 'amber', dy: 20, size: 12 });
        ouTag(b, [B[0], (A[1] + B[1]) / 2], `Δy=${v.fq(v.x2).sub(v.fq(v.x1)).txt}`, { color: 'sky', dx: 10, align: 'left', size: 12 });
      }
      if (st >= 2) {
        const h = ctActive(s) && Number.isFinite(s.ctH) ? clamp(s.ctH, 0.001, 0.12) : 0.12;
        const xp = v.a0 + v.p * h, xq = v.a0 + v.q * h;
        const U = [xp, f(xp)], V = [xq, f(xq)];
        b.seg(U, V, { color: 'violet', width: 2.2, dash: true });
        b.seg([xp, P[1]], [xq, P[1]], { color: 'amber', width: 2.2 });
        b.point(U, { color: 'violet', r: 4.5, label: 'a+ph', dx: 8, dy: -12 });
        b.point(V, { color: 'violet', r: 4.5, label: 'a+qh', dx: -8, dy: 18, align: 'right' });
        ouTag(b, [(xp+xq)/2, P[1]], '(p−q)h', { color: 'amber', dy: 22, size: 12 });
      }
      if (st >= 3) b.line(P, v.fpq.v, { color: 'rose', width: 2.4, dash: true, glow: true });
      const xs = [v.x1, v.x2, v.a0];
      b.point(A, { color: 'amber', r: 6, label: `A(x = ${v.x1})`, ...ouPlace(ouSlope(f, v.x1), ouPos(xs, v.x1)) });
      b.point(B, { color: 'sky', r: 6, label: `B(x = ${v.x2})`, ...ouPlace(ouSlope(f, v.x2), ouPos(xs, v.x2)) });
      b.point(P, { color: 'rose', r: 6, label: `P(x = ${v.a0})`, ...ouPlace(v.fpq.v, ouPos(xs, v.a0)) });
      if (st >= 1 && (!ctActive(s) || s.ctTarget !== 'average' || s.ctShowAnswer)) ouTag(b, [v.x1 + 0.3 * (v.x2 - v.x1), A[1] + 0.3 * (B[1] - A[1])], `평균변화율 ${v.avg.txt}`, { color: 'sky', dy: v.avg.v >= 0 ? 22 : -16, dx: 10, align: 'left' });
      if (st >= 3) { const lp = ouPlace(v.fpq.v, 'R'); ouTag(b, P, `f′(${v.a0}) = ${v.fpq.txt}`, { color: 'rose', dx: -lp.dx * 1.4, dy: -lp.dy * 1.9, align: lp.align === 'left' ? 'right' : 'left' }); }
    }
  });

  /* 장면 2 · 평균값 정리 */
  ouUpgrade(scenes[1], {
    m: 2,
    gen: (prev) => {
      let co, den, a, b;
      if (!prev) { co = [1, 0, -3, 2]; den = 2; a = -1; b = 2; }
      else {
        co = [ouPick([1, 1, 2]), 0, ouPick([-3, -2, -1, 0, 1, 2]), ouPick([-1, 0, 1, 2])]; den = 1;
        [a, b] = ouPick([[-1, 2], [-2, 1], [-2, 4], [-4, 2], [0, 3], [-3, 0], [-1, 1], [0, 2], [-2, 2], [-3, 3], [0, 1], [-1, 0]]);
      }
      const F = polyFn(co, den), fq = polyQ(co, den), s = a * a + a * b + b * b, c2 = ouQ(s, 3), cr = ouSqrt(c2.n, c2.d);
      const avg = fq(b).sub(fq(a)).div(b - a);
      const cand = [{ val: -cr.val, tex: '-' + cr.tex, txt: '−' + cr.txt }, { val: cr.val, tex: cr.tex, txt: cr.txt }];
      const inside = cand.filter((c) => c.val > a + 1e-9 && c.val < b - 1e-9);
      if (!inside.length) return null;
      const win = ouWinF([F], [a, b], { pts: [[a, F(a)], [b, F(b)]], mx: 1.3, my: 1.3, minW: 6, minH: 5 });
      if (prev && win.y[1] - win.y[0] > 13) return null;
      return { co, den, a, b, F, fq, s, c2, cr, avg, cand, inside, win, key: [co, den, a, b].join(), chk: { co, den, a, b, avg: avg.v, cs: inside.map((c) => c.val) } };
    },
    text: (v) => `함수 ${tex('f(x)=' + ouPoly(v.co))} 에 대하여 닫힌구간 ${tex(`[${v.a}, ${v.b}]`)}에서 평균값 정리를 만족시키는 상수 ${tex(`c \; (${v.a} < c < ${v.b})`)}의 값을 모두 구하시오.`,
    ans: (v) => `후보 ${tex('c=\\pm ' + v.cr.tex)} 중 열린구간 안의 값 ${tex('c=' + v.inside.map((c) => c.tex).join(',\;'))}`,
    steps: (v) => {
      const dq = ouDer(v.co).map((c) => c.div(v.den)), out = v.cand.filter((c) => !v.inside.includes(c));
      return [
        `$f$ 는 다항함수이므로 $[${v.a},${v.b}]$ 에서 연속이고 $(${v.a},${v.b})$ 에서 미분가능합니다. 평균변화율은 $\\dfrac{f(${v.b})-f(${v.a})}{${v.b}-${ouPar(v.a)}}=${v.avg.tex}$ 이고, 그림에서 할선 AB의 기울기입니다.`,
        `$f'(x)=${ouPoly(dq)}$ 이므로 $f'(c)=${v.avg.tex}$ 에서 $c^2=${v.c2.tex}$, 즉 $c=\\pm ${v.cr.tex}$ 입니다. 그림에서 할선 AB와 평행한 접선은 이 두 점에서 그어집니다.`,
        `열린구간 $(${v.a},${v.b})$ 안에 있는 값만 고릅니다.` + (out.length ? ` $c=${out.map((c) => c.tex).join(',\;')}$ 는 구간의 끝점이거나 구간 밖이므로 제외합니다.` : '') + ` 따라서 $c=${v.inside.map((c) => c.tex).join(',\;')}$.`
      ];
    },
    core: '<b>평균값 정리</b><br>$f$ 가 $[a,b]$ 에서 연속, $(a,b)$ 에서 미분가능하면 $\\dfrac{f(b)-f(a)}{b-a}=f\'(c)$ 인 $c$ 가 열린구간 $(a,b)$ 안에 있습니다. 그림으로는 할선 AB와 평행한 접선의 접점입니다. $f\'(c)=$ (평균변화율) 을 푼 해 중 구간 안의 것만 답입니다.',
    draw: (b, s, v, st) => {
      const f = v.F, A = [v.a, f(v.a)], B = [v.b, f(v.b)], sl = (B[1] - A[1]) / (B[0] - A[0]);
      b.plot(f, { color: 'ink', width: 3.2, glow: true });
      if (st >= 1) b.line(A, sl, { color: 'sky', width: 2.6, glow: true });
      if (st >= 2) v.cand.forEach((c) => { const ins = v.inside.includes(c); b.line([c.val, f(c.val)], sl, { extent: 2.4, color: ins ? 'rose' : 'muted', width: ins ? 2.6 : 1.8, dash: true, alpha: ins ? 1 : 0.7 }); });
      b.point(A, { color: 'amber', r: 6, label: `A(x = ${v.a})`, ...ouPlace(ouSlope(f, v.a), 'L') });
      b.point(B, { color: 'sky', r: 6, label: `B(x = ${v.b})`, ...ouPlace(ouSlope(f, v.b), 'R') });
      if (st >= 1) ouTag(b, [v.a + 0.22 * (v.b - v.a), A[1] + 0.22 * (B[1] - A[1])], `평균변화율 ${v.avg.txt}`, { color: 'sky', dy: sl >= 0 ? 24 : -16, align: 'left', dx: 8 });
      if (st >= 3) v.inside.forEach((c, i) => b.point([c.val, f(c.val)], { color: 'rose', r: 6.5, label: `c = ${c.txt}`, ...ouPlace(sl, 'M'), dy: -20 }));
    }
  });

  /* 장면 3 · 구간별 함수의 미분가능성 */
  ouUpgrade(scenes[2], {
    m: 3,
    gen: (prev) => {
      let side, c, u, w, z;
      if (!prev) { side = 'R'; c = 1; u = 1; w = 0; z = 0; }
      else { side = ouPick(['R', 'R', 'L']); c = ouPick([-1, 1, 2]); u = ouPick([1, -1, 2, -2]); w = ouPick([-3, -2, -1, 0, 1, 2, 3]); z = ouPick([-2, -1, 0, 1, 2, 3]); }
      const co = [u, w, z], g = (x) => ouEv(co, x), gc = ouEvQ(co, c), p = ouEvQ(ouDer(co), c), q = gc.sub(p.mul(c));
      if (prev && (Math.abs(p.v) > 6 || Math.abs(q.v) > 9 || p.n === 0)) return null;
      const sd = side === 'R' ? -1 : 1; // 알려진 조각이 있는 쪽 (R이면 왼쪽 x<c)
      const xs = [c + sd * 2.6, c - sd * 2.4];
      const line = (x) => p.v * x + q.v;
      const win = ouWin([[c, gc.v], [xs[0], g(xs[0])], [xs[1], line(xs[1])], [c - 2.6, 0], [c + 2.6, 0]], { mx: 0.2, my: 1.4, minW: 6.4, minH: 5 });
      if (prev && win.y[1] - win.y[0] > 11) return null;
      return { side, c, co, g, gc, p, q, line, win, sd, key: [side, c, co].join(), chk: { side, c, co, p: p.v, q: q.v } };
    },
    text: (v) => {
      const G = ouPoly(v.co), cond = (rel) => `(x ${rel} ${v.c})`;
      const body = v.side === 'R' ? `${G} & ${cond('<')} \\\\ px+q & ${cond('\\ge')}` : `px+q & ${cond('<')} \\\\ ${G} & ${cond('\\ge')}`;
      return `실수 전체의 집합에서 정의된 함수 ${tex(`f(x) = \\begin{cases} ${body} \\end{cases}`)} 이 ${tex('x = ' + v.c)} 에서 미분가능할 때, 상수 ${tex('p, q')}의 값을 구하시오.`;
    },
    ans: (v) => tex(`p = ${v.p.tex}, \; q = ${v.q.tex}`),
    steps: (v) => {
      const dq = ouDer(v.co);
      return [
        `미분가능하면 연속이므로 $x=${v.c}$ 에서 두 식의 값이 같습니다: $${v.gc.tex}=${ouTerm(v.c, 'p')}+q$.`,
        `미분계수도 같아야 합니다. 이차식 쪽은 $g'(x)=${ouPoly(dq)}$ 이므로 $g'(${v.c})=${v.p.tex}$ 이고, 직선 $px+q$ 의 기울기 $p$ 와 같으므로 $p=${v.p.tex}$.`,
        `연속 조건에 $p=${v.p.tex}$ 를 넣으면 $q=${v.gc.tex}-${v.p.ptex}\\cdot ${ouPar(v.c)}=${v.q.tex}$. 그림에서 직선은 접점 $(${v.c},${v.gc.tex})$ 에서 이차곡선의 접선이 됩니다.`
      ];
    },
    core: '<b>구간별로 정의된 함수의 미분가능성</b><br>경계 $x=a$ 에서 미분가능하려면 ① 두 식의 $x=a$ 에서의 값이 같고(연속), ② 두 식을 각각 미분한 값도 $x=a$ 에서 같아야 합니다. 그래프로는 이어 붙인 직선이 곡선의 접선이 되는 것입니다.',
    draw: (b, s, v, st) => {
      const c = v.c, sd = v.sd;
      b.plot(v.g, sd < 0 ? { to: c, color: 'ink', width: 3.2, glow: true } : { from: c, color: 'ink', width: 3.2, glow: true });
      const vb = b.viewBox();
      b.seg([c, vb.y0], [c, vb.y1], { color: 'amber', width: 1.5, dash: true, alpha: 0.6 });
      ouTag(b, [c, vb.y0 + (vb.y1 - vb.y0) * 0.07], `x = ${c}`, { color: 'amber', size: 12.5, dx: 6, align: 'left' });
      if (st < 3) ouTag(b, [c - sd * 1.9, vb.y1 - (vb.y1 - vb.y0) * 0.1], `y = px + q (${v.side === 'R' ? 'x ≥' : 'x <'} ${c})`, { color: 'sky', size: 12.5 });
      if (st >= 2) b.line([c, v.gc.v], v.p.v, { extent: 2.2, color: 'rose', width: 2.2, dash: true });
      if (st >= 3) b.plot(v.line, sd < 0 ? { from: c, color: 'sky', width: 3.2, glow: true } : { to: c, color: 'sky', width: 3.2, glow: true });
      if (st >= 1) b.point([c, v.gc.v], { color: 'amber', r: 6.5, label: `(${c}, ${v.gc.txt})`, dx: sd < 0 ? 12 : -12, dy: 22, align: sd < 0 ? 'left' : 'right' });
      if (st >= 2) ouTag(b, [c - sd * 1.8, v.line(c - sd * 1.8)], `기울기 ${ctActive(s) && !s.ctExplore && !s.ctShowAnswer ? 'p' : v.p.txt}`, { color: 'rose', dy: v.p.v >= 0 ? 24 : -14 });
      if (st >= 3) ouTag(b, [c - sd * 1.9, vb.y1 - (vb.y1 - vb.y0) * 0.1], `p = ${v.p.txt}, q = ${v.q.txt}`, { color: 'green', size: 13 });
    }
  });

  /* 장면 4 · 곡선과 직선 사이의 최단거리 */
  ouUpgrade(scenes[3], {
    m: 4,
    gen: (prev) => {
      let u, w, z, m, k;
      if (!prev) { u = ouQ(1, 2); w = 0; z = ouQ(1, 2); m = 1; k = 2; }
      else { u = ouPick([ouQ(1, 2), ouQ(1, 1)]); w = ouPick([-2, -1, 0, 1, 2]); z = ouQ(ouPick([0, 1, 2, 3])); m = ouPick([-2, -1, 1, 2]); k = ouPick([1, 2, 3, 4]); }
      const a = ouQ(m - w).div(u.mul(2)), n = z.sub(ouQ((w - m) * (w - m)).div(u.mul(4))).sub(k);
      if (!a.int || !n.int || Math.abs(a.v) > 3 || Math.abs(n.v) > 6) return null;
      const co = [u, w, z], f = (x) => ouEv(co, x), fa = ouEvQ(co, a.v), r = m * m + 1, d = ouSqrt(k * k, r);
      const T = [a.v, fa.v], vv = T[1] - (m * T[0] + n.v), H = [T[0] + (m * vv) / r, T[1] - vv / r];
      const lo = Math.min(a.v, H[0]) - 2.0, hi = Math.max(a.v, H[0]) + 2.0;
      const win = ouWinF([f], [lo, hi], { pts: [T, H], mx: 0.3, my: 1.0, minW: 6.5, minH: 5 });
      if (prev && win.y[1] - win.y[0] > 12) return null;
      return { u, w, z, m, k, n, a, co, f, fa, r, d, T, H, win, key: [u.txt, w, z.txt, m, k].join(), chk: { u: u.v, w, z: z.v, m, n: n.v, a: a.v, d: d.val } };
    },
    text: (v) => `곡선 ${tex('y=' + ouPoly(v.co))} 위의 점 ${tex('T(a, f(a))')}와 직선 ${tex('y=' + ouPoly([v.m, v.n]))} 사이의 거리가 최소가 될 때, 점 ${tex('T')}의 좌표와 최단거리 ${tex('d_{\\min}')}을 구하시오.`,
    ans: (v) => `접점 ${tex(`T(${v.a.tex}, ${v.fa.tex})`)}, 최단거리 ${tex('d_{\\min}=' + v.d.tex)}`,
    steps: (v) => [
      `직선 l을 평행이동해 포물선에 처음 닿는 위치를 찾습니다. 포물선의 최고차항 계수 $${v.u.tex}>0$이고 직선과의 세로 간격은 $f(x)-l(x)=${ouCoQ(v.u)}(x-(${v.a.tex}))^2+${v.k}>0$이므로 두 도형은 만나지 않습니다.`,
      `처음 닿는 접선은 l과 평행하므로 $f'(a)=${v.m}$입니다. $f'(x)=${ouPoly(ouDer(v.co))}$에서 $a=${v.a.tex}$, $T=(${v.a.tex},${v.fa.tex})$. T에서 l에 내린 수선 TH는 평행한 두 직선 사이의 거리입니다.`,
      `세로 간격의 최솟값은 $${v.k}$이고, 수선 길이는 세로 간격의 $1/\\sqrt{${v.r}}$배입니다. 따라서 $d_{\\min}=\\dfrac{${v.k}}{\\sqrt{${v.r}}}=${v.d.tex}$. 완전제곱항이 0인 T에서 등호가 성립하므로 전 구간의 최소입니다.`
    ],
    core: '<b>평행하게 옮겨 처음 닿는 접선</b><br>이 문제의 포물선은 직선 위에 있고 세로 간격이 양의 완전제곱식입니다. 간격을 최소로 하는 접점에서 두 기울기가 같아집니다. 직선과 곡선이 만나는 경우에는 먼저 거리 0인 교점을 확인해야 합니다.',
    draw: (b, s, v, st) => {
      b.plot(v.f, { color: 'ink', width: 3.2, glow: true });
      b.line([0, v.n.v], v.m, { color: 'sky', width: 2.6, glow: true });
      const vb = b.viewBox();
      ouTag(b, [vb.x1 - 0.2, vb.y1 - (vb.y1 - vb.y0) * 0.1], `l : y = ${ouMinus(ouPoly([v.m, v.n]))}`, { color: 'sky', size: 12.5, align: 'right' });
      if (st >= 1) {
        b.line(v.T, v.m, { extent: 2.2, color: 'rose', width: 2.3, dash: true, glow: true });
        b.point(v.T, { color: 'amber', r: 6.5, label: st >= 2 && (!ctActive(s) || s.ctTarget !== 'point' || s.ctShowAnswer) ? `T(${v.a.txt}, ${v.fa.txt})` : '평행하게 옮긴 접선의 접점 T', ...ouSide(v.m), dy: -16 });
      }
      if (st >= 2) {
        b.seg(v.T, v.H, { color: 'green', width: 2.8, glow: true });
        const nrm = Math.hypot(1, v.m);
        b.right(v.H, v.T, [v.H[0] + 1 / nrm, v.H[1] + v.m / nrm], { color: 'green', size: 10 });
        b.point(v.H, { color: 'sky', r: 5, label: 'H', dx: 10, dy: 16 });
      }
      if (st >= 3) ouTag(b, [(v.T[0] + v.H[0]) / 2, (v.T[1] + v.H[1]) / 2], `d = ${v.d.txt}`, { color: 'green', dx: v.m >= 0 ? 14 : -14, align: v.m >= 0 ? 'left' : 'right', dy: 4 });
    }
  });

  /* 장면 5 · 두 곡선의 공통접선 */
  ouUpgrade(scenes[4], {
    m: 5,
    gen: (prev) => {
      let co, den, t, u;
      if (!prev) { co = [1, 0, -1, 2]; den = 2; t = 1; u = ouQ(-4, 5); }
      else { co = [1, ouPick([-2, -1, 0, 1, 2]), ouPick([-3, -2, -1, 0, 1, 2, 3]), ouPick([-1, 0, 1, 2])]; den = 1; t = ouPick([-1, 0, 0, 1]); u = ouQ(ouPick([-3, -2, -1, 1, 2, 3])); }
      const F = polyFn(co, den), fq = polyQ(co, den), dq = ouDer(co).map((c) => c.div(den));
      const mq = ouEvQ(dq, t), ft = fq(t), n = ft.sub(mq.mul(t)), p = mq.sub(u.mul(2 * t)), q = ft.sub(u.mul(t * t)).sub(p.mul(t));
      if (prev && (Math.abs(mq.v) > 7 || Math.abs(n.v) > 8 || Math.abs(p.v) > 9 || Math.abs(q.v) > 12)) return null;
      const g = (x) => u.v * x * x + p.v * x + q.v;
      const lo = t - 1.4, hi = t + 1.4;
      const win = ouWinF([F], [lo, hi], { pts: [[t, ft.v]], mx: 0.1, my: 1.0, minW: 6, minH: 5 });
      if (prev && win.y[1] - win.y[0] > 14) return null;
      return { co, den, t, u, F, fq, dq, mq, ft, n, p, q, g, win, key: [co, den, t, u.txt].join(), chk: { co, den, t, u: u.v, m: mq.v, n: n.v, p: p.v, q: q.v } };
    },
    text: (v) => `두 곡선 ${tex('f(x)=' + ouPoly(v.co.map((c) => ouQ(c, v.den))))} 과 ${tex('g(x)=' + ouCoQ(v.u) + 'x^2+px+q')} 가 점 ${tex('x = ' + v.t)} 에서 서로 접할 때(공통접선을 가질 때), 공통접선의 방정식을 구하시오.`,
    ans: (v) => `접점 ${tex(`T(${v.t}, ${v.ft.tex})`)}, 공통접선 ${tex('y=' + ouPoly([v.mq, v.n]))}`,
    steps: (v) => [
      `접점의 $x$좌표가 $${v.t}$ 이므로 접점은 $T(${v.t},\\,f(${v.t}))=T(${v.t},\\,${v.ft.tex})$ 입니다.`,
      `두 곡선이 접하므로 $f'(${v.t})=g'(${v.t})$. $f'(x)=${ouPoly(v.dq)}$ 에서 $f'(${v.t})=${v.mq.tex}$, $g'(x)=${ouCoQ(v.u.mul(2))}x+p$ 이므로 $${v.u.mul(2 * v.t).tex}+p=${v.mq.tex}$, $p=${v.p.tex}$. 또 $f(${v.t})=g(${v.t})$ 에서 $q=${v.q.tex}$. 그림에서 $g$ 가 $T$ 에서 $f$ 에 접합니다.`,
      `공통접선은 접점 $T$ 를 지나고 기울기가 $${v.mq.tex}$ 인 직선이므로 $y-${v.ft.ptex}=${v.mq.ptex}(x${ouSg(-v.t)})$, 즉 $y=${ouPoly([v.mq, v.n])}$.`
    ],
    core: '<b>두 곡선이 한 점에서 접한다</b><br>$x=t$ 에서 접한다 ⇔ $f(t)=g(t)$ 이고 $f\'(t)=g\'(t)$ 입니다. 공통접선만 구할 때는 $p,q$ 를 몰라도 식을 아는 $f$ 의 $x=t$ 에서의 접선 $y-f(t)=f\'(t)(x-t)$ 를 구하면 됩니다.',
    draw: (b, s, v, st) => {
      b.plot(v.F, { color: 'ink', width: 3.2, glow: true });
      const vb = b.viewBox();
      b.seg([v.t, vb.y0], [v.t, vb.y1], { color: 'amber', width: 1.5, dash: true, alpha: 0.6 });
      ouTag(b, [v.t, vb.y0 + (vb.y1 - vb.y0) * 0.07], `x = ${v.t}`, { color: 'amber', dx: 6, align: 'left' });
      ouCurveTag(b, v.F, 'y = f(x)', 'ink', { side: 'left', dy: 16, skip: [[v.t, v.ft.v, 1.4]] });
      if (st >= 2) b.plot((x) => { const y = v.g(x); return Math.abs(y) > 40 ? NaN : y; }, { color: 'sky', width: 3, glow: true });
      if (st >= 2) ouCurveTag(b, v.g, 'y = g(x)', 'sky', { skip: [[v.t, v.ft.v, 1.8]] });
      if (st >= 3) b.line([v.t, v.ft.v], v.mq.v, { extent: 3.0, color: 'rose', width: 2.8, glow: true });
      if (st >= 1) b.point([v.t, v.ft.v], { color: 'amber', r: 6.5, label: `T(${v.t}, ${v.ft.txt})`, dx: 12, dy: -14, align: 'left' });
      if (st >= 3) ouTag(b, [v.t, v.ft.v], `y = ${ouMinus(ouPoly([v.mq, v.n]))}`, { color: 'rose', dx: v.mq.v >= 0 ? -14 : 14, dy: -34, align: v.mq.v >= 0 ? 'right' : 'left' });
    }
  });

  })();
  /* OU-END */

  // Free exploration keeps its own model; problem/review always use the current generated variant.
  const EXPLORE_STEPS = {
    "secant": [
      "할선 AB의 가로 변화량 Δx와 세로 변화량 Δy를 직각삼각형으로 읽습니다.",
      "A의 접선을 겹쳐 그린 뒤 B를 A로 보냅니다. 같은 Δx에서 접선의 세로 변화량과 곡선의 실제 변화량을 비교합니다.",
      "Δx≠0에서 할선 기울기를 계산하고 Δx→0의 극한과 접선 기울기를 비교합니다. Δx=0에서는 차분몫 자체가 정의되지 않습니다."
    ],
    "mvt": [
      "두 끝점을 잇는 할선의 기울기, 즉 평균변화율을 확인합니다.",
      "할선과 평행한 접선의 후보를 찾습니다. 미분계수=평균변화율이라는 식을 풉니다.",
      "접점의 가로좌표가 두 끝점 사이의 열린구간에 있는 값만 선택합니다. 끝점은 답에서 제외합니다."
    ],
    "cusp": [
      "경계에서 두 조각이 이어지는지 먼저 확인합니다. 높이에 점프가 있으면 미분가능하지 않습니다.",
      "연속일 때 두 조각의 접선 기울기를 비교합니다. 불연속일 때 조각의 기울기 극한을 실제 좌미분계수로 부르면 안 됩니다.",
      "연속이고 두 기울기가 같을 때만 미분가능합니다. 높이 차와 기울기 차를 각각 조작하여 두 조건의 역할을 확인합니다."
    ],
    "normal": [
      "곡선 위의 점에서 직선으로 내린 수선의 길이를 비교합니다.",
      "이 포물선은 직선과 만나지 않으므로 직선과 평행한 접선을 옮겨 처음 닿는 위치를 찾습니다.",
      "세로 간격이 양의 완전제곱식임을 확인하여 그 위치가 전 구간의 최소임을 증명하고 점과 직선의 거리 공식을 적용합니다."
    ],
    "common": [
      "두 곡선의 같은 접점 T를 확인합니다.",
      "두 곡선의 기울기가 T에서 같음을 비교합니다. 한 곡선의 접선을 구하면 나머지 곡선의 미정계수를 모두 구하지 않아도 됩니다.",
      "알고 있는 곡선에서 T와 접선 기울기로 직선 방정식을 씁니다. 다른 곡선에서도 같은 접선인지 검산합니다."
    ],
    "tanint": [
      "접점의 접선을 y축까지 연장해 절편을 읽습니다.",
      "g(t)=f(t)−t f′(t)에서 미분하면 g′(t)=−t f″(t)입니다. 후보 0과 변곡점의 좌표에서 부호를 확인합니다.",
      "부호가 바뀌는 후보만 극값입니다. 수평접선의 x절편은 x축과 겹치는 경우와 평행한 경우를 구별합니다."
    ],
    "mvtband": [
      "기준점 A에서 허용된 경계 기울기의 직선을 그립니다.",
      "할선의 기울기도 도함수 범위 안이어야 하므로 곡선이 지날 수 있는 영역을 봅니다. L>U이면 만족하는 함수가 없습니다.",
      "왼쪽 구간에서는 곱하는 길이가 음수이므로 부등호가 바뀝니다. 경계 기울기의 일차함수가 허용 경곗값을 실제로 만드는지 확인합니다."
    ]
  };
  const explorationModel = (sc, s, v) => {
    if (sc.id === 'tanint') return tex('f(x)=\\tfrac12x^3-\\tfrac32x^2+1')+', '+tex(`t=${s.tp}`);
    if (sc.id === 'mvtband') return tex('f(1)=1')+', '+tex(s.ub==='both' ? `${s.lo}\\le f'(x)\\le${s.hi}` : `f'(x)\\ge${s.lo}`);
    return v.chips && v.chips[0] ? tex(v.chips[0].tex) : '';
  };
  scenes.forEach((sc) => {
    const view = sc.view, steps = sc.steps;
    sc.startStep = 0;
    sc.notesTitle = '현재 탐구 모델과 조건';
    sc.guide = EXPLORE_STEPS[sc.id][0];
    sc.steps = (s) => window.lab && window.lab.tab === 'explore'
      ? EXPLORE_STEPS[sc.id]
      : (typeof steps === 'function' ? steps(s) : steps);
    if (sc.solution) {
      sc.solution.quickTitle = '실전 풀이 · 그림의 구조 활용';
      sc.solution.quickTag = '구조 풀이';
    }
    sc.view = (s, lab) => {
      const v = typeof view === 'function' ? view(s, lab) || {} : view || {};
      const explore = !lab || lab.tab === 'explore';
      const open = lab && lab.tab === 'problem' ? lab._answerOpen() : s.step >= 3;
      const note = explore ? '<b>자유 탐구 모델</b> '+explorationModel(sc,s,v)+'<br>이 탭의 함수와 조작값으로 구조를 실험합니다. 선택한 문항과 새 문제의 조건·도형·풀이는 문제/정리 탭에서 함께 바뀝니다.' : '';
      // The canvas reveals its own reasoning stage. Derived answer cards wait for the final stage.
      if (!open) return note ? { notes: note } : {};
      return { ...v, notes: [note, v.notes].filter(Boolean).join('<br>') || undefined };
    };
  });

  /* 원클릭 연결: 기존 탐구와 첫 원문 그림을 그대로 재사용합니다. */
  scenes.find(sc => sc.id === 'tanint').ctSource = { first: var8.first, question: () => text8(var8.first()), steps: () => steps8(var8.first()) };
  scenes.find(sc => sc.id === 'mvtband').ctSource = { first: var11.first, question: () => text11(var11.first()), steps: () => steps11(var11.first()) };
  const ctById = Object.fromEntries(scenes.map(sc => [sc.id, sc]));
  const ctSource = window.APL_TANGENT_SOURCE = {
    scenes,
    first: id => ctById[id].ctSource.first(),
    question: id => ctById[id].ctSource.question(),
    steps: id => ctById[id].ctSource.steps()
  };
  // 실제 표시 함수 위의 강조점입니다. 그림과 다른 별도 함수를 만들지 않습니다.
  function ctTraceSource(b, s, sc) {
    if (s.lessonEntry || !(s.ctTrace > 0)) return;
    const v = sc.ctSource.first(), exploring = !!s.ctExplore;
    const fs = exploring ? { secant: F[1], mvt: F[2], cusp: f3(s), normal: F[4], common: F[5], tanint: f8,
      mvtband: x => A11.fa + s.lo * (x - A11.a) }
      : { secant: v.F, mvt: v.F, cusp: v.g, normal: v.f, common: v.F, tanint: v.f,
        mvtband: x => v.fa + v.L * (x - v.a) };
    const f = fs[sc.id], box = b.viewBox(), points = [];
    if (typeof f !== 'function') return;
    for (let i = 0; i <= 96; i++) {
      const x = box.x0 + (box.x1 - box.x0) * (0.08 + 0.84 * i / 96), y = f(x);
      if (!exploring && sc.id === 'cusp' && (v.sd < 0 ? x > v.c : x < v.c)) continue;
      if (!exploring && sc.id === 'mvtband' && s.step === 0) {
        points.push([v.b, box.y0 + (box.y1 - box.y0) * (0.08 + 0.84 * i / 96)]);
        continue;
      }
      if (Number.isFinite(y) && y > box.y0 + 0.05 * (box.y1 - box.y0) && y < box.y1 - 0.05 * (box.y1 - box.y0)) points.push([x, y]);
    }
    if (!points.length) return;
    const k = Math.min(points.length - 1, Math.floor(clamp(s.ctTrace, 0, 1) * (points.length - 1)));
    let trail = points.slice(Math.max(0, k - 5), k + 1);
    if (exploring && sc.id === 'cusp') trail = trail.filter(p => (p[0] < 1) === (points[k][0] < 1));
    if (trail.length > 1) b.path(trail, { color: 'violet', width: 4.6, alpha: 0.7 });
    b.point(points[k], { color: 'violet', r: 4.5 });
  }
  scenes.forEach(sc => {
    const original = { draw: sc.draw, view: sc.view, panes: sc.panes, question: sc.question, reviewTop: sc.reviewTop, steps: sc.steps, tick: sc.tick };
    const call = (value, ...args) => typeof value === 'function' ? value(...args) : value;
    sc.question = (s, lab) => ctActive(s) ? (s.ctQuestion || sc.ctSource.question()) : call(original.question, s, lab);
    sc.reviewTop = (s, lab) => ctActive(s) ? '' : call(original.reviewTop, s, lab);
    sc.steps = (s, lab) => ctActive(s) ? ['주어진 조건과 구할 것', '성질을 연결하고 식 세우기', '계산과 결론'] : call(original.steps, s, lab);
    sc.view = (s, lab) => ctActive(s) ? {} : call(original.view, s, lab);
    sc.panes = s => ctActive(s) ? null : call(original.panes, s);
    if (original.tick) sc.tick = (s, dt, lab) => ctActive(s) ? false : original.tick(s, dt, lab);
    sc.draw = (b, s, value, lab) => {
      if (!ctActive(s) || b.thumb) return original.draw(b, s, value, lab);
      const drawState = { ...s, dual: false, playing: false,
        step: s.lessonEntry ? 0 : Math.min(s.step || 0, s.ctShowAnswer ? 3 : 2),
        ctShowAnswer: !s.lessonEntry && !!s.ctShowAnswer };
      const frameLab = { ...lab, s: drawState, tab: s.ctExplore ? 'explore' : 'review', _answerOpen: () => drawState.ctShowAnswer };
      original.draw(b, drawState, {}, frameLab);
      ctTraceSource(b, drawState, sc);
    };
  });
  const lessons = window.APL_TANGENT_LESSONS ? window.APL_TANGENT_LESSONS.install(scenes, ctSource) : {};

  APLab.createLab({
    stagedReveal: true,
    id: 'calc1-tangent',
    title: '접선과 미분계수',
    courseName: '미적분Ⅰ',
    unit: '미분 · 접선과 미분계수',
    courseColor: 'var(--m-orange)',
    home: '../index.html#calc1',
    legacy: '../../labs/미적분1/접선과 미분계수.html',
    board: { kind: 'cartesian', focus: { x: [-3, 4], y: [-2, 10.5] } },
    params: {
      a: { value: 1, min: -2.0, max: 2.5, step: 0.05, color: 'amber', label: '기준점·접점 x = a', format: (v) => `a = ${fmt(v)}` },
      dx: { value: 1.8, min: -2.2, max: 2.2, step: 0.02, color: 'amber', label: '증분 Δx = b − a', hint: '0에 가깝게 하면 할선이 접선에 가까워집니다', format: (v, s) => `Δx = ${fmt(v)}` },
      slopeR: { value: 2, min: -2.0, max: 4.0, step: 0.1, color: 'sky', label: '오른쪽 기울기 p = f′₊(1)', hint: '왼쪽 x²의 x = 1 기울기는 2입니다', format: (v) => `p = ${fmt(v)}` },
      gapH: { value: 0, min: -2.0, max: 2.0, step: 0.1, color: 'violet', label: '경계에서의 높이 차 Δh', hint: '연속 조건: Δh = 0', format: (v) => `Δh = ${fmt(v, 1)}${Math.abs(v) <= 0.02 ? ' (연속)' : ''}` },
      tp: { value: 1.5, min: -0.8, max: 2.2, step: 0.05, color: 'amber', label: '접점의 x좌표 t', hint: 't = 0, 1, 2 근처에서 y절편 g(t)의 모양을 보세요', format: (v) => `t = ${fmt(v)}` },
      lo: { value: 0.5, min: -1, max: 2.5, step: 0.05, color: 'violet', label: '기울기의 아래 한계 L (f′ ≥ L)', format: (v) => `L = ${fmt(v)}` },
      hi: { value: 2, min: -0.5, max: 3.5, step: 0.05, color: 'rose', label: '기울기의 위 한계 U (f′ ≤ U)', hint: '위 한계는 “L ≤ f′ ≤ U” 조건일 때만 쓰입니다', format: (v) => `U = ${fmt(v)}` }
    },
    state: { dual: false, animDir: -1, ub: 'both', bx: 3.5, by: 3.5 },
    persist: ['dual'],
    lessons,
    scenes
  });
});
</script>
