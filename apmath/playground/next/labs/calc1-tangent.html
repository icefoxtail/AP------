<script>
/* ==========================================================================
   미적분Ⅰ · 접선과 미분계수 (AP Math Lab 2.0 이식본)
   원본: labs/미적분1/접선과 미분계수.html
   - 문제·단계·정석/빠른 풀이 문구(examData)는 원본을 그대로 옮겼습니다.
   - 수학 함수(f, f′, g, 평균값 정리 c, 수선의 발·거리)는 원본과 같은 식입니다.
   - 바뀐 점: 셸·레이아웃은 공용 키트가 담당, 무대는 1:1 축척(원본은 y축 0.82배),
     장면 3에 끌 수 있는 점 2개(단차 Δh, 기울기 p) 추가, 의미색으로 색 통일.
   ========================================================================== */
window.addEventListener('DOMContentLoaded', function () {
  const { tex, fmt, clamp } = APLab;

  /* ---------- 1. 함수 (원본 evalF / evalFp / evalG_Mode5 / getMVTPoints) ---------- */
  const F = {
    1: (x) => 0.5 * x * x * x - 1.5 * x + 1.0,
    2: (x) => 0.5 * x * x * x - 1.5 * x + 1.0,
    4: (x) => 0.5 * x * x + 0.5,
    5: (x) => 0.5 * x * x * x - 0.5 * x + 1.0
  };
  const FP = {
    1: (x) => 1.5 * x * x - 1.5,
    2: (x) => 1.5 * x * x - 1.5,
    4: (x) => x,
    5: (x) => 1.5 * x * x - 0.5
  };
  const f3 = (s) => (x) => (x < 1.0 ? x * x : s.slopeR * (x - 1.0) + 1.0 + s.gapH);
  const g5 = (s) => (x) => { const t = s.a, u = x - t; return -0.8 * u * u + FP[5](t) * u + F[5](t); };
  function getMVTPoints(a, b) {
    const minX = Math.min(a, b), maxX = Math.max(a, b);
    if (maxX - minX < 0.02) return [];
    const val = (a * a + a * b + b * b) / 3;
    if (val < 0) return [];
    const cPos = Math.sqrt(val), cNeg = -cPos, res = [];
    if (cNeg > minX + 1e-4 && cNeg < maxX - 1e-4) res.push(cNeg);
    if (cPos > minX + 1e-4 && cPos < maxX - 1e-4 && Math.abs(cPos - cNeg) > 1e-4) res.push(cPos);
    return res;
  }
  const safeDx = (dx) => (Math.abs(dx) < 0.03 ? (dx >= 0 ? 0.03 : -0.03) : dx);
  const p2 = (x, y) => `(${fmt(x)}, ${fmt(y)})`;

  /* ---------- 2. 문제·풀이 데이터 (원본 examData 그대로) ---------- */
  const examData = {
      1: {
        badge: "장면 1 · 평균변화율(할선)에서 미분계수(접선의 기울기)로 가는 극한과 h의 계수의 차",
        hint: "하늘색 점 <span class='text-sky-300 font-bold'>B(a+Δx)</span>를 끌어서 고정된 점 <span class='text-amber-300 font-bold'>A(a)</span>에 가까이 가져가 보세요! Δx → 0 일 때 할선이 접선에 겹쳐집니다.",
        tag: "미분계수의 정의를 이용한 극한값",
        targetTime: "목표 시간: 3초",
        question: () => `다항함수 ${tex('f(x) = \\dfrac{1}{2}x^3 - \\dfrac{3}{2}x + 1')} 에 대하여 ${tex('x')}의 값이 ${tex('1')}에서 ${tex('3')}까지 변할 때의 평균변화율과, 극한값 ${tex('\\lim_{h \\to 0} \\dfrac{f(2 + 3h) - f(2 - 2h)}{h}')} 의 값을 각각 구하시오.`,
        answerBadge: () => `평균변화율 ${tex('= 5')}, 극한값 ${tex('= 5f\'(2) = 22.5')}`,
        snap: { a: 1.0, dx: 2.0, slopeR: 2.0, gapH: 0.0, dualView: false },
        steps: [
          "1단계 · 점 A(1, f(1)), B(3, f(3))를 잇는 할선 AB의 기울기, 즉 평균변화율을 구합니다.",
          "2단계 · h가 0에 가까워지면 x=2+3h와 x=2−2h가 모두 x=2에 가까워집니다. 분자를 f(2+3h)−f(2)와 f(2−2h)−f(2)로 나누어 미분계수의 정의와 연결합니다.",
          "3단계 · f′(2)의 값을 구한 뒤, h의 계수 3과 −2의 차 3−(−2)=5를 곱해 극한값을 구합니다."
        ],
        textbook: () => ({
          steps: `① 평균변화율: ${tex('\\dfrac{f(3) - f(1)}{3 - 1} = \\dfrac{10 - 0}{2} = 5')}<br/>
② 극한식을 변형하기 위해 분자에 ${tex('-f(2) + f(2)')} 를 더하고 빼서 분리:<br/>
&nbsp;&nbsp;${tex('\\lim_{h \\to 0} \\left\\{ \\dfrac{f(2+3h)-f(2)}{3h}\\cdot 3 + \\dfrac{f(2-2h)-f(2)}{-2h}\\cdot 2 \\right\\}')}<br/>
③ 미분계수의 정의에 의해 ${tex("3f'(2) + 2f'(2) = 5f'(2)")}<br/>
④ ${tex("f'(x)=\\frac32x^2-\\frac32")}이므로 ${tex("f'(2)=\\frac92")}; 따라서 극한값은 ${tex("5\\cdot\\frac92=\\frac{45}{2}")}입니다.`,
          warning: "⚠️ f(2)를 더하고 빼서 극한식을 둘로 나누는 과정을 매번 쓰면 오래 걸립니다. 아래 빠른 풀이의 공식으로 줄일 수 있습니다."
        }),
        shortcut: () => ({
          steps: `① 미분가능한 함수에서 ${tex('\\lim_{h \\to 0} \\dfrac{f(a + ph) - f(a + qh)}{h}')} 의 값은 <strong class="text-pink-300">【 ${tex('(p - q)\\times f\'(a)')} 】</strong>입니다. (분자에 ${tex('f(a)')}를 더하고 빼면 ${tex("p\\,f'(a) - q\\,f'(a)")}가 되기 때문입니다.)<br/>
② 이 문제에서는 ${tex('p = 3, \\; q = -2')} 이므로 ${tex('(3 - (-2))f\'(2) = 5f\'(2)')} 입니다.<br/>
③ ${tex("f'(2) = 4.5")} 를 대입하면 <strong class="text-amber-300">${tex('5 \\times 4.5 = 22.5 \\; (45/2)')}</strong> 입니다.`,
          highlight: `💡 ${tex('f')}가 ${tex('x=a')}에서 미분가능하면 ${tex('\\lim_{h \\to 0} \\dfrac{f(a + ph) - f(a + qh)}{h} = (p - q)f\'(a)')} 입니다.`
        })
      },

      2: {
        badge: "장면 2 · 평균값 정리: 할선과 평행한 접선 찾기",
        hint: "양 끝점 <span class='text-amber-300 font-bold'>A</span>와 <span class='text-sky-300 font-bold'>B</span>를 끌어 보세요! 할선 AB와 기울기가 같은 <span class='text-pink-300 font-bold'>할선 AB에 평행한 접선의 접점 c</span>가 바로 표시됩니다.",
        tag: "평균값 정리를 만족시키는 c의 값",
        targetTime: "목표 시간: 5초",
        question: () => `함수 ${tex('f(x) = \\dfrac{1}{2}x^3 - \\dfrac{3}{2}x + 1')} 에 대하여 닫힌구간 ${tex('[-1, 2]')}에서 평균값 정리를 만족시키는 상수 ${tex('c \\; (-1 < c < 2)')}의 값을 구하시오.`,
        answerBadge: () => `${tex('c = \\pm 1')} 중 열린구간 내부인 ${tex('c = 1')}`,
        snap: { a: -1.0, dx: 3.0, slopeR: 2.0, gapH: 0.0, dualView: false },
        steps: [
          "1단계 · f(x)=½x³−(3/2)x+1이 [−1, 2]에서 연속이고 (−1, 2)에서 미분가능한지 확인합니다.",
          "2단계 · 두 점 A(−1, f(−1)), B(2, f(2))를 지나는 할선의 기울기(평균변화율)와 f′(c)가 같다는 방정식을 세웁니다.",
          "3단계 · f′(c)=(평균변화율)을 풀어 얻은 c의 후보 중에서 열린구간 (−1, 2) 안에 있는 값을 고릅니다."
        ],
        textbook: () => ({
          steps: `① 구간 ${tex('[-1, 2]')}에서의 평균변화율 계산:<br/>
&nbsp;&nbsp;${tex('\\dfrac{f(2) - f(-1)}{2 - (-1)} = \\dfrac{2 - 2}{3} = 0')}<br/>
② 도함수 ${tex("f'(c) = \\dfrac{3}{2}c^2 - \\dfrac{3}{2} = 0")} 방정식 풀이:<br/>
&nbsp;&nbsp;${tex('c^2 = 1 \\implies c = -1')} 또는 ${tex('c = 1')}<br/>
③ 후보 ${tex('c=-1,1')} 중 ${tex('-1')}은 구간 끝점이라 제외합니다. 따라서 열린구간 ${tex('(-1,2)')} 안의 값은 ${tex('c=1')}뿐입니다.`,
          warning: "⚠️ f(−1)=f(2)=2이면 할선 AB가 수평선이므로 평균변화율이 0이고, f′(c)=0만 풀면 됩니다. 단, 구한 c가 구간의 끝점이면 열린구간 (−1, 2)에 속하지 않으므로 제외합니다."
        }),
        shortcut: () => ({
          steps: `① ${tex('f(-1) = 2')} 이고 ${tex('f(2) = 2')} 이므로 할선 ${tex('AB')}는 기울기가 ${tex('0')}인 수평선 ${tex('y=2')}입니다.<br/>
② ${tex('f(x)-2=\\frac12(x+1)^2(x-2)')}로 인수분해되므로, 그래프는 ${tex('x=-1')}에서 직선 ${tex('y=2')}에 접하고 ${tex('x=2')}에서 이 직선과 만납니다.<br/>
③ 접선의 기울기가 ${tex('0')}인 점의 ${tex('x')}좌표는 ${tex("f'(c)=\\frac32(c^2-1)=0")}에서 ${tex('c=\\pm1')}이고, 열린구간 ${tex('(-1,2)')} 안에 있는 값은 <strong class="text-amber-300">${tex('c=1')}</strong>입니다.`,
          highlight: `💡 이 문항의 ${tex('f(x)=\\frac12x^3-\\frac32x+1')}은 ${tex('x^2')}항이 없으므로 ${tex('f\\prime(c)=\\frac32(c^2-1)')}입니다. 양 끝값이 같아 평균 기울기가 0이므로 ${tex('c=\\pm1')}, 열린구간에서는 ${tex('c=1')}입니다.`
        })
      },

      3: {
        badge: "장면 3 · 미분가능성 판정: 불연속, 꺾인 점, 미분가능한 접합",
        hint: "탐구 탭의 <span class='text-amber-300 font-bold'>접합 상태 버튼(① 미분가능 / ② 꺾인 점 / ③ 불연속)</span>을 눌러 보거나, 조절 막대로 오른쪽 직선의 기울기 <span class='text-pink-300 font-bold'>p</span>와 경계에서의 높이 차 <span class='text-sky-300 font-bold'>Δh</span>를 바꿔 보세요!",
        tag: "구간별로 정의된 함수의 미분가능성",
        targetTime: "목표 시간: 5초",
        question: () => `실수 전체의 집합에서 정의된 함수 ${tex('f(x) = \\begin{cases} x^2 & (x < 1) \\\\ px + q & (x \\ge 1) \\end{cases}')} 이 ${tex('x = 1')} 에서 미분가능할 때, 상수 ${tex('p, q')}의 값을 구하시오.`,
        answerBadge: () => `${tex('p = 2, \\; q = -1 \\; (p + q = 1)')}`,
        snap: { a: 1.0, dx: 1.0, slopeR: 2.0, gapH: 0.0, dualView: true },
        steps: [
          "1단계 · x=1에서 왼쪽 식 x²과 오른쪽 식 px+q의 함숫값이 같아야(연속) 한다는 조건을 세웁니다.",
          "2단계 · 왼쪽 식의 x=1에서의 미분계수 2와 오른쪽 직선의 기울기 p가 같아야 한다는 조건을 세웁니다.",
          "3단계 · 연속 조건과 미분계수 조건을 함께 만족하는 p, q를 구하고 원래 식에서 확인합니다."
        ],
        textbook: () => ({
          steps: `① ${tex('x = 1')} 에서 미분가능하면 연속이므로:<br/>
&nbsp;&nbsp;${tex('\\lim_{x \\to 1-} x^2 = f(1) \\implies 1 = p + q')}<br/>
② 미분계수의 정의를 이용해 좌미분계수와 우미분계수 각각 극한 계산:<br/>
&nbsp;&nbsp;${tex('\\lim_{h \\to 0-} \\dfrac{(1+h)^2 - 1}{h} = 2')}, &nbsp;${tex('\\lim_{h \\to 0+} \\dfrac{p(1+h)+q - 1}{h} = p')}<br/>
③ 연속 조건 ${tex('p+q=1')}에 ${tex('p=2')}를 대입하면 ${tex('q=-1')}입니다. 그러면 두 식은 점 ${tex('(1,1)')}에서 만나고 양쪽 기울기도 2로 같습니다.`,
          warning: "⚠️ 구간별로 정의된 다항함수에서 매번 h → 0−, h → 0+ 의 극한으로 정의식을 세우면 오래 걸립니다. 아래 빠른 풀이를 함께 보세요."
        }),
        shortcut: () => ({
          steps: `① <strong>[1단계: 연속 조건]</strong> 두 식에 ${tex('x = 1')} 을 대입한 값이 같아야 하므로 <strong class="text-sky-300">${tex('1 = p + q')}</strong><br/>
② <strong>[2단계: 미분계수가 같을 조건]</strong> 두 식을 각각 미분(${tex('2x')} 와 ${tex('p')})하여 ${tex('x = 1')} 을 대입한 값이 같아야 하므로 <strong class="text-pink-300">${tex('p = 2')}</strong><br/>
③ 연립하면 <strong class="text-amber-300">${tex('p = 2, \\; q = -1')}</strong> 을 얻습니다.`,
          highlight: "💡 구간별로 정의된 다항함수가 경계 x=a에서 미분가능하려면 ① 두 식의 x=a에서의 함숫값이 같고(연속), ② 두 식을 각각 미분한 식의 x=a에서의 값도 같아야 합니다."
        })
      },

      4: {
        badge: "장면 4 · 법선의 방정식과 곡선·직선 사이의 최단거리",
        hint: "곡선 위의 점 <span class='text-amber-300 font-bold'>T(a, f(a))</span>를 끌어 보세요! 접선의 기울기가 <span class='text-pink-300 font-bold'>직선 y = x − 2의 기울기(1)와 같아지는 순간(a=1)</span> 접선이 직선과 평행해지고, 법선(접선에 수직인 직선)이 직선과 수직이 되며 거리가 최소가 됩니다!",
        tag: "곡선 위의 점과 직선 사이의 최단거리",
        targetTime: "목표 시간: 5초",
        question: () => `곡선 ${tex('y = \\dfrac{1}{2}x^2 + \\dfrac{1}{2}')} 위의 점 ${tex('T(a, f(a))')}와 직선 ${tex('y = x - 2')} 사이의 거리가 최소가 될 때, 점 ${tex('T')}의 좌표와 최단거리 ${tex('d_{\\min}')}을 구하시오.`,
        answerBadge: () => `접점 ${tex('T(1, 1)')}, 최단거리 ${tex('d_{\\min} = \\sqrt{2}')}`,
        snap: { a: 1.0, dx: 1.0, slopeR: 2.0, gapH: 0.0, dualView: false },
        steps: [
          "1단계 · T(a, ½a²+½)와 직선 x−y−2=0 사이의 거리를 점과 직선 사이의 거리 공식으로 나타냅니다.",
          "2단계 · 거리의 분자를 a에 대한 이차식으로 정리하고 완전제곱식으로 고쳐 최솟값과 등호가 성립하는 a를 찾습니다.",
          "3단계 · 거리가 최소일 때 접선이 직선과 평행하고, T에서 직선에 내린 수선(법선)이 직선과 수직임을 확인합니다."
        ],
        textbook: () => ({
          steps: `① 곡선 위의 임의의 점을 ${tex('T\\left(a, \\dfrac{1}{2}a^2 + \\dfrac{1}{2}\\right)')} 로 설정<br/>
② 점과 직선 ${tex('x - y - 2 = 0')} 사이의 거리 공식에 대입:<br/>
&nbsp;&nbsp;${tex('d = \\dfrac{\\left| a - \\left(\\dfrac{1}{2}a^2 + \\dfrac{1}{2}\\right) - 2 \\right|}{\\sqrt{1^2 + (-1)^2}} = \\dfrac{\\left| -\\dfrac{1}{2}a^2 + a - \\dfrac{5}{2} \\right|}{\\sqrt{2}}')}<br/>
③ 분자의 이차식을 완전제곱식으로 묶어 최솟값 계산:<br/>
&nbsp;&nbsp;${tex('\\dfrac{\\frac12(a-1)^2+2}{\\sqrt2} \\ge \\dfrac{2}{\\sqrt2}=\\sqrt2')}입니다. 등호는 ${tex('a=1')}일 때이고, 이때 ${tex('T=(1,1)')}입니다.`,
          warning: "⚠️ 삼차함수처럼 이차함수가 아닌 곡선에서는 거리식을 완전제곱식으로 묶기 어렵습니다. 이때는 접선의 기울기가 직선의 기울기와 같은 점을 찾는 방법을 씁니다."
        }),
        shortcut: () => ({
          steps: `① 곡선 위 점 ${tex('T(a,\\frac12a^2+\\frac12)')}와 직선 ${tex('x-y-2=0')}의 거리는 이 문항에서 ${tex('d(a)=\\frac{\\frac12(a-1)^2+2}{\\sqrt2}')}입니다.<br/>

  /* ---------- 3. 공통 부품 ---------- */
  const secs = (m) => examData[m].targetTime;
  function problemOf(m) {
    const d = examData[m];

      tag: d.tag,
      time: secs(m),
      text: d.question,
      answer: d.answerBadge,

  function solutionOf(m) {
    return {
      standardTitle: '교과서식 정석 풀이', standardTag: '정석 · 3분',
      quickTitle: '빠른 풀이 · 핵심 공식', quickTag: '10초 컷',
      standard: examData[m].textbook,
      quick: examData[m].shortcut
    };
  }
  function enterOf(m) {
    return (s) => {
      const sn = examData[m].snap;
      s.a = sn.a; s.dx = sn.dx; s.slopeR = sn.slopeR; s.gapH = sn.gapH; s.dual = sn.dualView;
    };
  }
  // 도함수 동시 보기(위: f, 아래: f′)
  const panesOf = (fy, dy) => (s) => (s.dual ? [{ id: 'main', frac: 0.58, focusY: fy }, { id: 'deriv', frac: 0.42, focusY: dy }] : null);
  const actionsCommon = (playLabel) => [

    { id: 'play', play: true, icon: (s) => (s.playing ? 'pause' : 'play'), label: (s) => (s.playing ? '일시 정지' : playLabel), on: (s) => s.playing, run: (s) => { s.playing = !s.playing; } }
  ];
  function bounce(s, key, speed, lo, hi, dt) {
    s[key] += speed * s.animDir * dt;
    if (s[key] < lo) { s[key] = lo; s.animDir = 1; }
    if (s[key] > hi) { s[key] = hi; s.animDir = -1; }
  }
  function curve(b, f, o = {}) {
    b.plot(f, { color: 'ink', width: 3.2, glow: true, ...o });
  }
  function derivPane(b, s, m) {
    if (!s.dual) return;
    b.use('deriv');
    const r = b._paneRect('deriv');
    const c = b.ctx;
    c.save();
    c.fillStyle = b.color('halo', 0.35);
    c.fillRect(r.x, r.y, r.w, r.h);
    c.restore();
    c.save();
    b.clip();
    if (s.grid) b.grid();
    b.axes({ yLabel: "y'" });
    if (m === 3) {
      b.plot((x) => 2 * x, { to: 1, color: 'ink', width: 2.8 });
      b.plot(() => s.slopeR, { from: 1, color: 'sky', width: 2.8 });
      b.point([1, 2], { hollow: true, color: 'rose', label: `좌미분계수 f′₋(1)=2.0`, dx: -10, dy: -12, align: 'right' });
      b.point([1, s.slopeR], { hollow: true, color: 'sky', label: `우미분계수 f′₊(1)=${fmt(s.slopeR, 1)}`, dx: 10, dy: 14 });
    } else {
      b.plot(FP[m], { color: 'sky', width: 2.8 });
      const fpa = FP[m](s.a);
      b.point([s.a, fpa], { color: 'amber', r: 5.5, label: `P′(${fmt(s.a)}, f′(a)=${fmt(fpa)})`, dx: 12, dy: -10 });
    }
    c.restore();
    // 나눔선 + 이름표
    c.save();
    c.strokeStyle = b.color('sky', 0.55);
    c.lineWidth = 1.5;
    c.beginPath();
    c.moveTo(r.x, r.y + 0.5);
    c.lineTo(r.x + r.w, r.y + 0.5);
    c.stroke();
    c.restore();
    b.stext(r.x + 14, r.y + 20, "도함수 y = f′(x)", { color: 'sky', size: 12.5, align: 'left', weight: 800 });
    b.use('main');
    // 위·아래를 잇는 같은 x 표시
    const sx = b.toS(m === 3 ? 1 : s.a, 0).x;
    c.save();
    c.setLineDash([5, 5]);
    c.strokeStyle = b.color('amber', 0.6);
    c.lineWidth = 1.6;
    c.beginPath();
    c.moveTo(sx, b._paneRect('main').y + 6);
    c.lineTo(sx, r.y + r.h - 6);
    c.stroke();
    c.restore();
  }
  function mainBg(b, s) {
    b.use('main');
    b.ctx.save();
    if (b.panes) b.clip();
    if (s.grid) b.grid();
    b.axes();
  }
  const done = (b) => b.ctx.restore();
  // A, B 손잡이 (장면 1·2)
  function handlesAB(b, s, m, labels) {
    const f = F[m];
    const a = s.a, bx = a + s.dx;
    b.handle('A', [a, f(a)], { color: 'amber', ref: 'A', label: labels.A, dx: -12, dy: -14, align: 'right',
      drag: (w) => { s.a = clamp(+w.x.toFixed(2), -2.0, 2.5); } });
    b.handle('B', [bx, f(bx)], { color: 'sky', ref: 'B', priority: 1, label: labels.B, dx: 12, dy: -12,
      drag: (w) => { let nd = w.x - s.a; if (Math.abs(nd) < 0.04) nd = nd >= 0 ? 0.04 : -0.04; s.dx = clamp(+nd.toFixed(2), -2.2, 2.2); } });
  }

          ],
          tape: s.step >= 3 ? { title: `할선 기울기 Δy/Δx = ${fmt(sec)}  →  접선 기울기 f′(a) = ${fmt(tan)}  (차이: ${fmt(err)})`,
            segments: [{ text: `할선 ${fmt(sec)}`, weight: Math.max(0.2, Math.abs(sec)), color: 'sky' }, { text: `접선 ${fmt(tan)}`, weight: Math.max(0.2, Math.abs(tan)), color: 'rose' }] } : null

          status: disc ? { tone: 'bad', text: '불연속 → 미분가능하지 않음' } : cusp ? { tone: 'warn', text: '연속이지만 꺾인 점 → 미분가능하지 않음' } : { tone: 'ok', text: '연속 · 좌미분계수 = 우미분계수 → 미분가능' },
          alert: disc ? { tone: 'bad', text: `x = 1 에서 좌극한(1)과 우극한(${fmt(1 + gap, 1)})이 달라 불연속이므로 미분가능하지 않습니다!` }
            : cusp ? { tone: 'warn', text: `x = 1 에서 연속이지만 좌미분계수(2.0) ≠ 우미분계수(${fmt(p, 1)})이므로 그래프가 꺾이고 미분가능하지 않습니다!` } : null,
          readouts: [
            { label: '경계 x = 1 · 높이 차 Δh', value: fmt(gap, 1), color: 'violet', ref: 'gap', note: disc ? '끊어짐' : '이어짐' },
            { label: "좌미분계수 f′₋(1)", value: '2.00', color: 'rose', ref: 'left' },
            { label: "우미분계수 f′₊(1) = p", value: fmt(p), color: 'sky', ref: 'right' },
            { label: '판정', value: disc ? '불연속' : cusp ? '꺾인 점' : '미분가능', color: disc ? 'red' : cusp ? 'amber' : 'green', note: `q = ${fmt(q, 1)} (p + q = ${fmt(1 + gap, 1)})` }
          ],
          tape: s.step >= 3 ? { title: disc ? `좌극한(1.0) ≠ 우극한(${fmt(1 + gap, 1)}) : x=1 에서 불연속이므로 미분가능하지 않음!` : cusp ? `연속이지만 좌미분계수(2.0) ≠ 우미분계수(${fmt(p, 1)}) : 그래프가 꺾이므로 미분가능하지 않음!` : '연속이고 좌미분계수(2.0) = 우미분계수(2.0) : x = 1 에서 미분가능!' } : null
        };
      },
      draw: (b, s) => {
        mainBg(b, s);
        const p = s.slopeR, gap = s.gapH;
        b.plot((x) => x * x, { to: 1, color: 'ink', width: 3.2, glow: true, ref: 'left' });
        b.plot((x) => p * (x - 1) + 1 + gap, { from: 1, color: 'sky', width: 3.2, glow: true, ref: 'right' });
        if (s.step >= 1) b.vline(1, { color: 'amber', alpha: 0.45, width: 1.6, dash: true });
        if (s.step >= 2) {
          b.seg([1 - 2.2, 1 - 2 * 2.2], [1 + 1.5, 1 + 2 * 1.5], { color: 'rose', width: 2.2, dash: true, glow: true, ref: 'left' });
          b.seg([1 - 1.5, 1 + gap - p * 1.5], [1 + 2.2, 1 + gap + p * 2.2], { color: 'sky', width: 2.2, dash: true, glow: true, ref: 'right' });
        }
        if (Math.abs(gap) > 0.02) {
          b.seg([1, 1], [1, 1 + gap], { color: 'violet', width: 3, ref: 'gap' });
          b.point([1, 1], { hollow: true, color: 'ink', r: 6.5, label: '좌극한(1, 1.0)', dx: -12, dy: -10, align: 'right' });
        } else {
          const smooth = Math.abs(2.0 - p) < 0.05;
          b.point([1, 1], { color: smooth ? 'green' : 'red', r: 7, label: smooth ? '미분가능한 접합점(1, 1) [기울기=2]' : `꺾인 점(1, 1) [좌미분계수=2 ≠ 우미분계수=${fmt(p, 1)}]`, dx: 14, dy: 22 });
        }
        // 직접 끄는 점: 단차 Δh (보라), 기울기 p (하늘) — 0과 2 근처에서 자석처럼 붙습니다.
        b.handle('gap', [1, 1 + gap], { color: 'violet', ref: 'gap', label: Math.abs(gap) > 0.02 ? `함숫값(1, ${fmt(1 + gap, 1)})` : '', dx: 14, dy: -14,
          drag: (w) => { let v = w.y - 1; if (Math.abs(v) < 0.15) v = 0; s.gapH = clamp(Math.round(v * 10) / 10, -2, 2); } });
        b.handle('p', [2, p + 1 + gap], { color: 'sky', ref: 'right', label: 'p 조절', dx: 12, dy: -12,
          drag: (w) => { let v = w.y - 1 - s.gapH; if (Math.abs(v - 2) < 0.15) v = 2; s.slopeR = clamp(Math.round(v * 10) / 10, -2, 4); } });
        done(b);
        derivPane(b, s, 3);
      }
    },
    {
      id: 'normal', title: '법선과 최단거리', short: '법선·최단거리',
      question: '곡선 위의 점 T가 어디에 있을 때 직선 y = x − 2까지의 거리가 가장 짧을까?',
      guide: examData[4].hint,
      controls: ['a'],
      actions: actionsCommon('자동으로 접점 옮기기'),
      steps: examData[4].steps,
      problem: problemOf(4), solution: solutionOf(4), enter: enterOf(4),
      focus: { x: [-2.6, 4.2], y: [-2.6, 4.6] },
      panes: panesOf([-2.6, 4.6], [-2.6, 2.8]),
      tick: (s, dt) => { if (!s.playing) return false; bounce(s, 'a', 1.2, -1.5, 2.2, dt); return true; },
      view: (s) => {
        const a = s.a, ya = F[4](a), val = a - ya - 2, d = Math.abs(val) / Math.SQRT2, isMin = Math.abs(a - 1.0) < 0.05;
        const nm = Math.abs(a) > 0.05 ? fmt(-1 / a) : '수직';
        return {
          chips: [{ k: '함수식', tex: 'f(x) = \\dfrac{1}{2}x^2 + \\dfrac{1}{2}, \\; l: y = x - 2', color: 'ink' }, { k: '접선', tex: `f'(a) = ${fmt(FP[4](a)).replace('−', '-')}`, color: 'rose' }],
          status: isMin ? { tone: 'ok', text: '최단거리! 접선은 직선과 평행, 법선은 직선과 수직' } : { tone: 'info', text: `거리 d = ${fmt(d, 3)}` },
          readouts: [
            { label: '접점 T의 x = a', value: fmt(a), color: 'amber', ref: 'A' },
            { label: "접선 기울기 f′(a)", value: fmt(FP[4](a)), color: 'rose', ref: 'tangent', note: '직선 l의 기울기는 1' },
            { label: '법선 기울기 −1/f′(a)', value: nm, color: 'violet', ref: 'normal', note: '접선에 수직인 직선의 기울기' },
            { label: '직선까지 거리 d', value: fmt(d, 3), color: isMin ? 'amber' : 'green', ref: 'dist', note: isMin ? '★ 최단거리 √2' : 'a = 1 에서 최소' }
          ],
          tape: s.step >= 3 ? { title: `점 T${p2(a, ya)} ~ 직선 y=x−2 거리 d = ${fmt(d, 3)} (a=1 일 때 최솟값 √2 ≈ 1.414)` } : null
        };
      },
      draw: (b, s) => {
        mainBg(b, s);
        const f = F[4], a = s.a, ya = f(a), m = FP[4](a);
        curve(b, f);
        b.line([0, -2], 1, { color: 'sky', width: 2.6, glow: true });
        const vb = b.viewBox();
        b.text([Math.min(vb.x1 - 0.8, 3.6), Math.min(vb.x1 - 0.8, 3.6) - 2], 'l : y = x − 2', { color: 'sky', dx: 10, dy: 18, align: 'left', size: 13 });
        if (s.step >= 1) b.line([a, ya], m, { extent: 2.5, color: 'rose', width: 2.3, dash: true, glow: true, ref: 'tangent' });
        if (s.step >= 2) {
          if (Math.abs(m) > 0.05) b.line([a, ya], -1 / m, { extent: 2.0, color: 'violet', width: 2, dash: true, ref: 'normal' });
          else b.seg([a, ya - 3], [a, ya + 3], { color: 'violet', width: 2, dash: true, ref: 'normal' });
        }
        if (s.step >= 3) {
          const val = a - ya - 2, hx = a - val / 2, hy = ya + val / 2, d = Math.abs(val) / Math.SQRT2;
          const isMin = Math.abs(a - 1.0) < 0.05;
          b.seg([a, ya], [hx, hy], { color: isMin ? 'amber' : 'green', width: 2.8, glow: true, ref: 'dist' });
          b.right([hx, hy], [a, ya], [hx + 1, hy + 1], { color: isMin ? 'amber' : 'green', size: 10 });
          b.point([hx, hy], { color: 'sky', r: 5, label: `수선의 발 H${p2(hx, hy)}`, dx: 10, dy: 18 });
          b.text([(a + hx) / 2, (ya + hy) / 2], `거리 d = ${fmt(d, 3)}${isMin ? ' (★최단거리 √2)' : ''}`, { color: 'amber', dx: 12, align: 'left', size: 12.5, ref: 'dist' });
        }
        b.handle('T', [a, ya], { color: 'amber', ref: 'A', label: `T${p2(a, ya)} [접선의 기울기=${fmt(m)}]`, dx: -14, dy: -14, align: 'right',
          drag: (w) => { s.a = clamp(+w.x.toFixed(2), -2.0, 2.5); } });
        done(b);
        derivPane(b, s, 4);
      }
    },
    {
      id: 'common', title: '두 곡선의 공통접선', short: '공통접선',
      question: '두 곡선이 한 점에서 ‘접한다’는 것은 무엇과 무엇이 같다는 뜻일까?',
      guide: examData[5].hint,
      controls: ['a'],
      actions: actionsCommon('자동으로 접점 옮기기'),
      steps: examData[5].steps,
      problem: problemOf(5), solution: solutionOf(5), enter: enterOf(5),
      focus: { x: [-2.2, 3.2], y: [-1.2, 4.2] },
      panes: panesOf([-1.2, 4.2], [-1.5, 6]),
      tick: (s, dt) => { if (!s.playing) return false; bounce(s, 'a', 1.2, -1.5, 2.2, dt); return true; },
      view: (s) => {
        const t = s.a, yt = F[5](t), m = FP[5](t);
        const b0 = yt - m * t;
        return {
          chips: [{ k: '함수식', tex: 'f(x) = \\dfrac{1}{2}x^3 - \\dfrac{1}{2}x + 1', color: 'ink' }, { k: '공통접선', tex: `f'(${fmt(t, 1).replace('−', '-')}) = g'(${fmt(t, 1).replace('−', '-')}) = ${fmt(m).replace('−', '-')}`, color: 'rose' }],
          status: { tone: 'ok', text: `공통접선 y = ${fmt(m)}x ${b0 >= 0 ? '+' : '−'} ${fmt(Math.abs(b0))}` },
          readouts: [
            { label: '접점 x = t', value: fmt(t), color: 'amber', ref: 'A' },
            { label: 'f(t) = g(t)', value: fmt(yt), color: 'sky', ref: 'g' },
            { label: "f′(t) = g′(t)", value: fmt(m), color: 'rose', ref: 'tangent' },
            { label: '두 함수의 차 f(x) − g(x)', value: '(x − t)²을 인수로 가짐', color: 'violet', note: '접점에서 중근' }
          ],
          tape: s.step >= 3 ? { title: `공통접선 조건: f(${fmt(t, 1)})=g(${fmt(t, 1)})=${fmt(yt)} & f′(${fmt(t, 1)})=g′(${fmt(t, 1)})=${fmt(m)}` } : null
        };
      },
      draw: (b, s) => {
        mainBg(b, s);
        const t = s.a, yt = F[5](t), m = FP[5](t);
        curve(b, F[5]);
        if (s.step >= 1) {
          const g = g5(s);
          b.plot((x) => { const y = g(x); return Math.abs(y) > 35 ? NaN : y; }, { color: 'sky', width: 3, glow: true, ref: 'g' });
        }
        if (s.step >= 2) b.line([t, yt], m, { extent: 3.0, color: 'rose', width: 2.8, glow: true, ref: 'tangent' });
        b.handle('T', [t, yt], { color: 'amber', ref: 'A', label: `공통접점 T${p2(t, yt)} [기울기=${fmt(m)}]`, dx: 12, dy: -14,
          drag: (w) => { s.a = clamp(+w.x.toFixed(2), -2.0, 2.5); } });
        done(b);
        derivPane(b, s, 5);
      }
    }
  ];

  /* ---------- 5. 실험실 등록 ---------- */
  APLab.createLab({
    id: 'calc1-tangent',
    title: '접선과 미분계수',
    courseName: '미적분Ⅰ',
    unit: '미분 · 접선과 미분계수',
    courseColor: 'var(--m-orange)',
    home: '../index.html#calc1',
    legacy: '../../labs/미적분1/접선과 미분계수.html',
    board: { kind: 'cartesian', focus: { x: [-3, 4], y: [-2, 10.5] } },
    params: {
      a: { value: 1, min: -2.0, max: 2.5, step: 0.05, color: 'amber', label: '기준점·접점 x = a', format: (v) => `a = ${fmt(v)}` },
      dx: { value: 1.8, min: -2.2, max: 2.2, step: 0.02, color: 'amber', label: '증분 Δx = b − a', hint: '0에 가깝게 하면 할선이 접선에 가까워집니다', format: (v, s) => `Δx = ${fmt(v)}` },
      slopeR: { value: 2, min: -2.0, max: 4.0, step: 0.1, color: 'sky', label: '오른쪽 기울기 p = f′₊(1)', hint: '왼쪽 x²의 x = 1 기울기는 2입니다', format: (v) => `p = ${fmt(v)}` },
      gapH: { value: 0, min: -2.0, max: 2.0, step: 0.1, color: 'violet', label: '경계에서의 높이 차 Δh', hint: '연속 조건: Δh = 0', format: (v) => `Δh = ${fmt(v, 1)}${Math.abs(v) <= 0.02 ? ' (연속)' : ''}` }
    },
    state: { dual: false, animDir: -1 },
    persist: ['dual'],
    scenes
  });
});
