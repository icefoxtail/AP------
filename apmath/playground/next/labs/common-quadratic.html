<script>
/* ==========================================================================
   공통수학 · 이차함수 (AP Math Lab 2.0 이식본) — 6개 탐구관 × 30개 장면
   원본: labs/공통수학/이차함수.html
   이식 방식: "호환층 이식" — 원본의 내용(getSpec)과 그리기 코드(drawQuadFuncMasterScene)를
   글자 그대로 옮기고, 그리기 함수 이름(drawFuncCurve·qline·qdot·drawIntervalWindow)만 새 무대 엔진에 연결합니다.
   원본과 다른 점
   - 좌표평면: 원본의 픽셀 좌표를 그대로 쓰되 무대는 수학 좌표(1:1 축척, 눈금 자동)로 그립니다
   - 절댓값 탭 3개 장면(절댓값 전체·x에만 절댓값·회전 직선)은 y축을 0.75배로 눌러 그려 눈금·좌표 라벨과 어긋났습니다 → 1:1 [2.0 수정]
   - 「y=|x²-4|와 회전 직선」 접선 기울기를 2(√5-2)≈0.47로 적었지만 D=0의 해는 6-2√5≈1.53이라 접하지 않았습니다 → 바로잡음 [2.0 수정]
   - 캔버스 직접 그리기 1곳(내접 직사각형)과 미니 상자·하단 띠는 무대 엔진/셸의 띠로 이동
   - 효과가 없던 조작은 표시하지 않음: 그림이 변하지 않는 장면의 진행 슬라이더·시연 버튼, p 프리셋(대칭축 장면 2개 밖에서는 이름만 p였음)
   ========================================================================== */
window.addEventListener('DOMContentLoaded', function () {
  const tex = APLab.tex;

  /* ===== 원본 그대로: 숫자 표시와 색 (원본 347–359행) ===== */
    function fmtNum(v) {
      if (Math.abs(v - Math.round(v)) < 1e-6) return String(Math.round(v));
      return Number(v.toFixed(2)).toString();
    }

    const QCOL = {
      cyan: '#38bdf8',
      pink: '#f472b6',
      green: '#34d399',
      gold: '#fbbf24',
      white: '#f1f5f9',
      red: '#fb7185'
    };

  /* ===== 원본 상태 객체(이름 그대로) — 매 프레임 2.0 셸 상태에서 채웁니다 ===== */
  const state = {
    mode: 1,
    subType: { 1: 'diffFuncFlatten', 2: 'movingAxisMin', 3: 'absWholeFold', 4: 'sepBothGreater', 5: 'alwaysPositiveAll', 6: 'trapLeadingZero' },
    conceptSwitch: 'all', activePartIdx: -1, fold: 0.0,
    pIdx: 1, // (원본 getSpec 이 읽는 값, 그림에는 쓰이지 않음)
    kIdx: 2  // 수평선 높이 k 프리셋 (0: k=0, 1: k=2.5, 2: k=4.0 꼭짓점 접함, 3: k=5.2)
  };

  /* ===== 원본 그대로: 프리셋과 세부 시나리오 목록 (원본 392–449행) ===== */
    const P_PRESETS = [
      { p: -1.0, label: 'p=-1(좌)' },
      { p: 0.6, label: 'p=0.6(안)' },
      { p: 1.4, label: 'p=1.4(안)' },
      { p: 3.0, label: 'p=3(우)' }
    ];

    const K_PRESETS = [
      { k: 0.0, label: 'k=0(2점)' },
      { k: 2.5, label: 'k=2.5(4점)' },
      { k: 4.0, label: 'k=4(3점!)' },
      { k: 5.2, label: 'k=5.2(2점)' }
    ];

    const SUB_MENUS = {
      1: [
        { id: 'diffFuncFlatten', label: '🔄 [킬러 원리] 교점의 x좌표 ⟺ h(x)=f(x)-g(x)=0의 실근 (직선을 x축으로 내리기)' },
        { id: 'tangentDiscriminant', label: '⚡ 직선 이동과 판별식 (D>0 2점 · D=0 접선 · D<0 0점)' },
        { id: 'chordLengthVieta', label: '📏 포물선과 직선이 잘라내는 선분 AB 길이 (√(1+m²)|α-β|)' },
        { id: 'minDistMaxArea', label: '📐 포물선과 직선 사이 최단거리 & △PAB 최대 넓이(D=0!)' },
        { id: 'symmetryRootSum', label: '⚖️ 대칭축 x=p 와 실근의 합 불변의 법칙 (α + β = 2p!)' }
      ],
      2: [
        { id: 'movingAxisMin', label: '🎛️ [킬러 1] 고정된 구간 [0,2]와 움직이는 대칭축 x=p일 때 최솟값 (3가지 경우)' },
        { id: 'movingAxisMaxJump', label: '⚖️ 최댓값을 갖는 점이 바뀌는 경계: 구간의 중점 p = (α+β)/2' },
        { id: 'movingWindowInterval', label: '🪟 고정된 포물선과 움직이는 구간 [t, t+2]' },
        { id: 'substitution2Stage', label: '🪤 [주의] 치환 t = x²-2x 를 이용한 합성함수의 두 단계 범위' },
        { id: 'inscribedRectParabola', label: '🏛️ 포물선 내접 직사각형 둘레·넓이 최댓값 (대칭축 기준!)' }
      ],
      3: [
        { id: 'absWholeFold', label: '🥟 전체 절댓값 y=|x²-2x-3| 그래프(x축 아래를 접어 올리기) & y=k 교점(0→2→4→3→2개)' },
        { id: 'absXSymmetry', label: '🪞 x에만 절댓값 y=x²-2|x|-3 (y축 데칼코마니 W자 그래프!)' },
        { id: 'absLineRotTangent', label: '📐 y=|x²-4|와 점 (-3,0)을 지나는 직선 y=m(x+3)의 교점이 3개일 조건' },
        { id: 'absPiecewiseSplit', label: '✂️ 부분 절댓값 y=x²-2x-2|x-1| (경계 x=1 좌우 이어붙이기)' },
        { id: 'maxMinEnvelope', label: '📈 두 함수 중 작은 함수 min(f, g) · 큰 함수 max(f, g) 그래프' }
      ],
      4: [
        { id: 'sepBothGreater', label: '🎯 유형 ①: 두 근이 모두 p보다 클 때 (함·판·축 3중 잠금!)' },
        { id: 'sepBetweenOneShot', label: '🌟 유형 ②: 두 근 사이에 p가 있을 때 (f(p)<0 하나만 확인)' },
        { id: 'sepInsideInterval', label: '🚧 유형 ③: 두 근이 모두 구간 (p, q) 사이에 있을 때 (4조건)' },
        { id: 'sepOneRootInInterval', label: '⚡ 유형 ④: 구간 (p, q) 사이에 오직 한 실근만 있을 때 (f(p)f(q)<0)' },
        { id: 'rootSignZero', label: '➕ 실근의 부호 판별 (두 양근 · 두 음근 · 서로 다른 부호)' }
      ],
      5: [
        { id: 'alwaysPositiveAll', label: '🎈 모든 실수에서 ax²+bx+c > 0 성립 조건 (왜 D<0 허근일까?)' },
        { id: 'restrictedIneqMinMax', label: '🔒 [킬러] 제한된 범위(0≤x≤3)에서만 f(x)≥0 이 성립할 조건' },
        { id: 'specialSol4Cases', label: '📌 판별식 D=0 (x축에 접할 때) 이차부등식의 해 4가지 비교' },
        { id: 'integerCountBoundary', label: '🔢 부등식을 만족하는 정수 x가 3개일 때 등호 포함 여부(≤, <) 판단' },
        { id: 'compIneqTransform', label: '🔍 f(x)<0 의 해가 -2<x<4 일 때 f(2x-1)<0 의 해 구하기' }
      ],
      6: [
        { id: 'trapLeadingZero', label: '💥 [함정 1] "부등식 kx²+..."과 "이차부등식 kx²+..." (k=0인 경우 확인)' },
        { id: 'trapMaxLtMin', label: '💥 [함정 2] 모든 x에 대해 f(x)≥g(x)와 임의의 x₁, x₂에 대해 f(x₁)≥g(x₂)의 차이' },
        { id: 'trapKIndepDoubleRoot', label: '🎯 "k값에 관계없이 항상 중근" 풀이 순서 함정 (① D=0 ➔ ② k에 대한 항등식)' },
        { id: 'trapIrrationalCoeffs', label: '💥 무리수·허수 계수 방정식에서 켤레근 성질 오용 반례!' },
        { id: 'trapParabolaMeetSegment', label: '📐 포물선이 끊어진 선분 AB와 한 점/두 점에서 만날 조건!' }
      ]
    };

  /* ======================================================================
     [2.0] 어댑터: 원본의 그리기 함수 → 새 무대 엔진
     - 원본은 화면 픽셀(원점 ox,oy · 한 칸 unit=40px)로 점을 만들어 그렸습니다. 장면 코드는 그대로 두고
       원점 (0,0)·한 칸 U=40으로 호출한 뒤, 그리는 순간에 수학 좌표(÷U, y 뒤집기)로 바꿔 무대에 넘깁니다.
     - 원본의 규칙을 그대로 따릅니다: partIdx(-1=없음) → 강조 조각, 관찰 렌즈(lensAlpha)에 따라 선명/흐리게
     ====================================================================== */
  const U = 40;
  const WIN_TOP = 6.4, WIN_BOT = -4; // 원본 구간 구간: 위쪽 45px ~ 원점 아래 160px
  let BOARD = null;
  const sink = {};
  const arrowOnly = (s) => String(s == null ? '' : s).replace(/➔/g, '→').replace(/⭕/g, '○').replace(/❌/g, '×');
  const cv = (s) => APLab.stripEmoji(arrowOnly(s));
  // 해설 문자열 정리: **굵게** → <strong>(원본 texInline), $…$ 수식 안의 < > 는 \lt \gt 로(셸의 수식 변환이 < 를 태그로 오해하지 않게)
  const fixText = (s) => String(s).replace(/\*\*([\s\S]+?)\*\*/g, '<strong>$1</strong>').replace(/\$([^$]+)\$/g, (m, src) => '$' + src.replace(/</g, '\\lt ').replace(/>/g, '\\gt ') + '$');
  const arrow = (v) => (typeof v === 'string' ? fixText(arrowOnly(v)) : Array.isArray(v) ? v.map(arrow) : v && typeof v === 'object' ? Object.fromEntries(Object.entries(v).map(([k, x]) => [k, arrow(x)])) : v);
  const m2 = (p) => ({ x: p.x / U, y: -p.y / U });
  const partOf = (p) => (p == null || p < 0 ? undefined : p);
  const dashOf = (d) => (Array.isArray(d) && d.length ? d : null);
  const withAlpha = (a, fn) => { if (a >= 1) { fn(); return; } const c = BOARD.ctx; c.save(); c.globalAlpha = a; try { fn(); } finally { c.restore(); } };
  function toScreen(mx, my, ox, oy, unit) {
    return { x: ox + mx * unit, y: oy - my * unit };
  }

  // 관찰 렌즈 (원본 lensAlpha)
  function lensAlpha(group) {
    const sw = state.conceptSwitch;
    return sw === 'all' || group === sw ? 1 : group ? 0.14 : 0.4;
  }

    function dotLens(text) {
      if (/반례|차함수|변환|h\(x\)/.test(text)) return 'aux';
      if (/꼭짓점|대칭|경계|축|꺾인/.test(text)) return 'axis';
      return 'roots';
    }


  // 일반 함수 y = fn(x) 연속 곡선 그리기
  function drawFuncCurve(fn, xMin, xMax, ox, oy, unit, color = '#38bdf8', width = 3.2, dash = [], partIdx = -1) {
    const pts = [];
    const steps = 160;
    for (let i = 0; i <= steps; i++) {
      const mx = xMin + ((xMax - xMin) * i) / steps;
      pts.push(m2(toScreen(mx, fn(mx), ox, oy, unit)));
    }
    withAlpha(lensAlpha(dash.length ? 'aux' : null), () => BOARD.path(pts, { color, width, dash: dashOf(dash), part: partOf(partIdx) }));
  }

  // 제한된 구간 [a, b] 반투명 구간(Window) 그리기
  function drawIntervalWindow(a, b, ox, oy, unit, labelStr = '') {
    const xa = toScreen(a, 0, ox, oy, unit).x / U, xb = toScreen(b, 0, ox, oy, unit).x / U;
    withAlpha(lensAlpha('axis'), () => {
      BOARD.poly([{ x: xa, y: WIN_TOP }, { x: xb, y: WIN_TOP }, { x: xb, y: WIN_BOT }, { x: xa, y: WIN_BOT }], { fill: 'rgba(52, 211, 153, 0.11)', color: null });
      BOARD.seg({ x: xa, y: WIN_TOP }, { x: xa, y: WIN_BOT }, { color: 'rgba(52, 211, 153, 0.65)', width: 2.0, dash: [6, 4] });
      BOARD.seg({ x: xb, y: WIN_TOP }, { x: xb, y: WIN_BOT }, { color: 'rgba(52, 211, 153, 0.65)', width: 2.0, dash: [6, 4] });
      if (labelStr && !BOARD.thumb) BOARD.text({ x: (xa + xb) / 2, y: WIN_TOP - 0.35 }, cv(labelStr), { color: '#6ee7b7', size: 11.5, weight: 800 });
    });
  }

  function qline(a, b, color = '#fbbf24', width = 2.4, dash = [], glow = false, partIdx = -1, group = null) {
    // 수직선(x = 상수)은 대칭축·경계, 수평선(y = k)은 교점 스캔, 기울어진 선은 접선·보조선
    const g = group || (Math.abs(a.x - b.x) < 0.5 ? 'axis' : Math.abs(a.y - b.y) < 0.5 ? 'roots' : 'aux');
    withAlpha(lensAlpha(g), () => BOARD.seg(m2(a), m2(b), { color, width, dash: dashOf(dash), glow, part: partOf(partIdx) }));
  }

  function qdot(p, text = '', col = '#ffffff', ox = 10, oy = -12, r = 5.4, group = null) {
    withAlpha(lensAlpha(group || dotLens(text)), () => BOARD.point(m2(p), { color: col, r, label: BOARD.thumb ? '' : cv(text), dx: ox, dy: oy, align: 'left', baseline: 'alphabetic' }));
  }

  // 「치환형 합성함수」 장면은 좌표평면이 둘(단계마다 원점·눈금이 다름)이라 공통 눈금 대신 단계별 축만 그립니다.
  function paneAxes() {
    const uSub = U * 0.72;
    [-165, 165].forEach((px) => {
      BOARD.seg({ x: (px - 3.2 * uSub) / U, y: 0 }, { x: (px + 5.2 * uSub) / U, y: 0 }, { color: 'muted', width: 1.6 });
      BOARD.seg({ x: px / U, y: -4 }, { x: px / U, y: 5.4 }, { color: 'muted', width: 1.6 });
    });
  }

  /* ===== 원본 그대로: 장면별 실시간 명세 getSpec (원본 669–1294행) ===== */
    function getSpec() {
      const m = state.mode;
      const sub = state.subType[m];
      const pVal = P_PRESETS[state.pIdx].p;
      const kVal = K_PRESETS[state.kIdx].k;

      // ==================== [탭 1: 차함수 f-g 변환 & 직선 위치관계] ====================
      if (m === 1) {
        if (sub === 'diffFuncFlatten') {
          return {
            badge: `탐구 1-A · 🔄 [핵심 원리] 곡선 f(x)와 직선 g(x)의 교점의 x좌표 ⟺ h(x)=f(x)-g(x)의 실근!`,
            hint: `슬라이더를 오른쪽으로 밀어 보세요! 기울어진 직선 $g(x) = x + 1$ 이 수평한 $x$축($y=0$)으로 내려앉으면서 이차함수 $f(x) = x^2 - x - 2$ 가 <strong>$h(x) = f(x) - g(x) = x^2 - 2x - 3 = (x+1)(x-3)$</strong> 으로 바뀝니다! 이때 <strong class="text-amber-300">두 교점의 $x$좌표($x = -1, x = 3$)는 수직 점선 위에서 그대로 유지</strong>됩니다!`,
            actionTxt: state.fold > 0.5 ? '🎬 원래 곡선 f(x)와 직선 g(x) 보기' : '🎬 직선을 x축으로 내려서 h(x)=f(x)-g(x)로 바꾸기',
            dim1Name: '교점의 x좌표 (불변!)', dim2Name: 'h(x) = f(x) - g(x)',
            val1Txt: 'α = -1, β = 3', val2Txt: 'h(x) = (x + 1)(x - 3)',
            parts: [
              { id: 0, name: `🔵 원래 상태: 포물선 f(x) = x² - x - 2 와 직선 g(x) = x + 1`, desc: `연립방정식 x² - x - 2 = x + 1 의 해가 교점의 x좌표!`, val: `교점 (-1,0), (3,4)`, color: '#38bdf8', ok: true },
              { id: 1, name: `🟡 변환 완료: h(x) = f(x) - g(x) = x² - 2x - 3 과 x축!`, desc: `기울어진 직선을 x축(y=0)으로 내려서 인수분해한 식을 세움!`, val: `h(x)=(x+1)(x-3)`, color: '#fbbf24', ok: true },
              { id: 2, name: `🩷 [접할 때의 응용] f(x)와 g(x)가 x = α 에서 접하면?`, desc: `접하면 중근이므로 f(x) - g(x) = a(x - α)² 꼴의 완전제곱식으로 바로 세운다!`, val: `f - g = a(x - α)²`, color: '#f472b6', ok: true }
            ],
            totalRes: `f(x)와 g(x)가 x = α, β 에서 만난다 ⟺ f(x) - g(x) = a(x - α)(x - β) [접하면 a(x - α)²]`,
            rule: '곡선과 직선이 만나는 두 점의 x좌표 α, β가 주어지면 f(x) - g(x) = a(x-α)(x-β) 로 식을 세운다!',

  /* ===== 원본 그대로: 장면 그리기 drawQuadFuncMasterScene (원본 1321–1693행, 아래 [2.0 수정] 표시 부분만 다름) ===== */
    function drawQuadFuncMasterScene(ox, oy, unit, t, spec) {
      const m = state.mode;
      const sub = state.subType[m];
      const pPreset = P_PRESETS[state.pIdx].p;
      const kPreset = K_PRESETS[state.kIdx].k;

      // [모드 1] 이차함수와 직선의 위치관계 & 차함수 h(x) = f(x) - g(x) 수평 변환

      if (m === 1) {
        if (sub === 'diffFuncFlatten') {
          // f(x) = x^2 - x - 2, g(x) = x + 1 -> 슬라이더 t에 따라 g(x)가 (1-t)(x+1)로 내려앉고 f(x)가 h(x)=x^2-2x-3으로 변형!
          const fnCur = (x) => x * x - x - 2 - t * (x + 1);
          const gnCur = (x) => (1 - t) * (x + 1);

          // 원래 곡선 잔상
          drawFuncCurve((x) => x * x - x - 2, -3.5, 4.5, ox, oy, unit, 'rgba(56, 189, 248, 0.30)', 2.0, [5, 4], 0);
          drawFuncCurve((x) => x + 1, -4.5, 4.5, ox, oy, unit, 'rgba(52, 211, 153, 0.30)', 2.0, [5, 4], 0);

          // 실시간 변환 곡선
          drawFuncCurve(gnCur, -4.5, 4.5, ox, oy, unit, QCOL.green, 3.2, [], 1);
          drawFuncCurve(fnCur, -3.5, 4.8, ox, oy, unit, QCOL.gold, 3.8, [], 1);

          // 교점 x = -1, x = 3 수직 불변 가이드라인!
          qline(S(-1, -4.5), S(-1, 5.5), QCOL.pink, 2.2, [5, 4], true, 2, 'roots');
          qline(S(3, -4.5), S(3, 5.5), QCOL.pink, 2.2, [5, 4], true, 2, 'roots');

          const pInt1 = S(-1, gnCur(-1)), pInt2 = S(3, gnCur(3));
          qdot(pInt1, '교점 α = -1 (불변!)', QCOL.pink, -95, -14);
          qdot(pInt2, '교점 β = 3 (불변!)', QCOL.pink, 12, -14);
          const vX = 0.5 + 0.5 * t;
          qdot(S(vX, fnCur(vX)), t > 0.8 ? 'h(x)=(x+1)(x-3)' : 'f(x) ➔ h(x) 변환 중', QCOL.gold, 12, 20);

          drawFuncCurve((x) => x * x - x, -3.2, 4.2, ox, oy, unit, QCOL.cyan, 3.4, [], 0);

          qdot(S(1, 0), '접점 (1, 0) [k=-1, D=0!]', QCOL.gold, 14, 18);
        } else if (sub === 'chordLengthVieta') {
          // y = x² - 2x - 1 과 y = x + 1: x² - 3x - 2 = 0, |α-β|=√17.
          const fn = (x) => x * x - 2 * x - 1;

          drawFuncCurve(gn, -3.2, 5.0, ox, oy, unit, QCOL.green, 2.8);

          const alpha = (3 - Math.sqrt(17)) / 2, beta = (3 + Math.sqrt(17)) / 2;
          const pA = S(alpha, alpha + 1), pB = S(beta, beta + 1), pH = S(beta, alpha + 1);

          qline(pH, pB, QCOL.cyan, 3.4, [5, 4], true, 1, 'aux');
          qline(pA, pB, QCOL.pink, 4.2, [], true, 2);

          qdot(pB, 'B(β = (3+√17)/2)', QCOL.white, 12, -12);

          qline(S(2, -4.5), S(2, 5.5), QCOL.gold, 2.8, [6, 4], true, 0);

          const curY = -1.5 + 3.8 * t;
          qline(S(-3, curY), S(7, curY), QCOL.pink, 3.2, [], false, 1);
          const d = Math.sqrt((curY + 2.5) / 0.6);
          qdot(S(2 - d, curY), 'α = 2 - d', QCOL.cyan, -55, -14);
          qdot(S(2 + d, curY), 'β = 2 + d (합 α+β = 4 불변!)', QCOL.pink, 12, -14);
          qdot(S(2, curY), '중점 x = 2', QCOL.gold, -28, 22);

      }

      // [모드 2] 제한된 범위에서 움직이는 대칭축 x = p vs 움직이는 구간 구간
      // =====================================================================
      else if (m === 2) {
        if (sub === 'movingAxisMin' || sub === 'movingAxisMaxJump') {
          drawIntervalWindow(0, 2, ox, oy, unit, '제한된 범위 [0 ≤ x ≤ 2]');

          const fn = (x) => 0.75 * (x - curP) * (x - curP) - 1.5;

          drawFuncCurve(fn, -4.5, 6.5, ox, oy, unit, 'rgba(148, 163, 184, 0.38)', 2.0, [5, 4]);

          // 대칭축 x = p 및 구간 정중앙 x = 1 표시
          qline(S(curP, -4.5), S(curP, 5.5), QCOL.gold, 2.8, [6, 4], true, 1);
          if (sub === 'movingAxisMaxJump') {
            qline(S(1, -4.5), S(1, 5.5), QCOL.pink, 2.2, [3, 3]);
          }

          const xMinPt = curP < 0 ? 0 : curP <= 2 ? curP : 2;
          const xMaxPt = curP <= 1 ? 2 : 0;
          qdot(S(xMinPt, fn(xMinPt)), `최솟값 m (x=${fmtNum(xMinPt)})`, QCOL.gold, -35, 24, 6.5);
          qdot(S(xMaxPt, fn(xMaxPt)), `최댓값 M (x=${xMaxPt}!)`, QCOL.red, 12, -14, 6.5);
          qdot(S(curP, -3.8), `대칭축 x = p(${fmtNum(curP)})`, QCOL.gold, -35, 18);
        } else if (sub === 'movingWindowInterval') {
          const tWin = -1.0 + 4.0 * t;
          drawIntervalWindow(tWin, tWin + 2, ox, oy, unit, `움직이는 구간 [${fmtNum(tWin)} ≤ x ≤ ${fmtNum(tWin + 2)}]`);
          const fn = (x) => 0.75 * (x - 2) * (x - 2) - 1.5;

          drawFuncCurve(fn, -3.5, 6.5, ox, oy, unit, 'rgba(148, 163, 184, 0.38)', 2.0, [5, 4]);
          drawFuncCurve(fn, tWin, tWin + 2, ox, oy, unit, QCOL.gold, 4.5, [], 1);
          qline(S(2, -4.5), S(2, 5.5), QCOL.cyan, 2.4, [5, 4]);

          const xMinPt = tWin + 2 < 2 ? tWin + 2 : tWin <= 2 ? 2 : tWin;
          qdot(S(xMinPt, fn(xMinPt)), `구간 안의 최솟값 (x=${fmtNum(xMinPt)})`, QCOL.gold, 12, 22, 6.5);
        } else if (sub === 'substitution2Stage') {
          // 좌측: 1단계 t = (x-1)^2 - 1 (-1<=x<=2 -> -1<=t<=3) | 우측: 2단계 y = (t-2)^2 - 1 (-1<=t<=3)
          const ox1 = ox - 165, ox2 = ox + 165, uSub = unit * 0.72;
          drawIntervalWindow(-1, 2, ox1, oy, uSub, '1단계: -1 ≤ x ≤ 2');
          drawFuncCurve((x) => 0.65 * ((x - 1) ** 2 - 1), -2.5, 3.8, ox1, oy, uSub, 'rgba(56,189,248,0.35)', 2.0, [4, 4]);
          drawFuncCurve((x) => 0.65 * ((x - 1) ** 2 - 1), -1, 2, ox1, oy, uSub, QCOL.cyan, 4.0, [], 0);
          qdot(toScreen(1, -0.65, ox1, oy, uSub), '최소 t = -1', QCOL.cyan, -25, 22);
          qdot(toScreen(-1, 1.95, ox1, oy, uSub), '최대 t = 3', QCOL.cyan, -30, -14);

          drawIntervalWindow(-1, 3, ox2, oy, uSub, '2단계 탄생 범위: -1 ≤ t ≤ 3!');
          drawFuncCurve((tv) => 0.45 * ((tv - 2) ** 2 - 1), -2.2, 4.8, ox2, oy, uSub, 'rgba(251,191,36,0.35)', 2.0, [4, 4]);
          drawFuncCurve((tv) => 0.45 * ((tv - 2) ** 2 - 1), -1, 3, ox2, oy, uSub, QCOL.gold, 4.0, [], 1);
          qdot(toScreen(2, -0.45, ox2, oy, uSub), '최솟값 m = -1 (t=2)', QCOL.gold, -30, 22);
          qdot(toScreen(-1, 3.6, ox2, oy, uSub), '최댓값 M = 8 (t=-1)', QCOL.red, -30, -14);
        } else {
          // inscribedRectParabola: y = -x^2 + 4x 내접 직사각형
          const fn = (x) => -(x - 2) * (x - 2) + 4;
          drawFuncCurve(fn, -1.2, 5.2, ox, oy, unit, QCOL.cyan, 3.4);
          qline(S(2, -3.5), S(2, 5.0), QCOL.gold, 2.4, [5, 4], false, 0);

          const tHalf = 0.5 + 0.5 * Math.sin(t * Math.PI) + (t > 0.8 ? 0.5 : 0); // t=1 일 때 tHalf=1.0
          const hRect = 4 - tHalf * tHalf;
          const pB = S(2 - tHalf, 0), pC = S(2 + tHalf, 0);
          const pA = S(2 - tHalf, hRect), pD = S(2 + tHalf, hRect);

          BOARD.poly([pA, pB, pC, pD].map(m2), { fill: 'rgba(52, 211, 153, 0.28)', color: QCOL.green, width: 3.2 }); // [2.0 수정] 캔버스 직접 그리기 → 무대 엔진

          qdot(pD, `D(2+t, 4-t²) [t=1일 때 둘레 최대 10!]`, QCOL.gold, 12, -12);
          qdot(S(2, 4), '꼭짓점 (2, 4)', QCOL.cyan, -30, -14);
        }
      }

      // =====================================================================
      // [모드 3] 절댓값 그래프 폴딩(|f|, f(|x|)) & 실근 개수 스캐너
      // =====================================================================
      else if (m === 3) {
        if (sub === 'absWholeFold') {
          const foldFactor = -1 + 2 * Math.max(0.15, t); // -1(접기 전) -> +1(접기 완료!)
          // 원래 아랫부분 점선
          drawFuncCurve((x) => (x - 1) ** 2 - 4, -1, 3, ox, oy, unit, 'rgba(148, 163, 184, 0.4)', 2.0, [5, 4]); // [2.0 수정] 0.75배 압축 제거(1:1)
          // 바깥 날개 (+f(x))
          drawFuncCurve((x) => (x - 1) ** 2 - 4, -3.2, -1, ox, oy, unit, QCOL.cyan, 3.8, [], 0);
          drawFuncCurve((x) => (x - 1) ** 2 - 4, 3, 5.2, ox, oy, unit, QCOL.cyan, 3.8, [], 0);
          // 접혀 올라오는 안쪽 봉우리 (-f(x))
          drawFuncCurve((x) => foldFactor * (4 - (x - 1) ** 2), -1, 3, ox, oy, unit, QCOL.pink, 4.0, [], 1);

          // 수평선 y = k 스캐너
          const yScreen = kPreset; // [2.0 수정] 눈금 그대로(원본은 ×0.75)
          qline(S(-5, yScreen), S(7, yScreen), QCOL.gold, 3.2, [], true, 2);
          qdot(S(1, foldFactor * 4.0), '접힌 봉우리 (1, 4): y = -(x²-2x-3)!', QCOL.pink, 14, -12);
          qdot(S(-3.5, yScreen), `y = k (${kPreset})`, QCOL.gold, 0, -12);
        } else if (sub === 'absXSymmetry') {
          // y = x^2 - 2|x| - 3 (y축 데칼코마니)
          drawFuncCurve((x) => x * x - 2 * x - 3, -1.5, 0, ox, oy, unit, 'rgba(148, 163, 184, 0.32)', 1.8, [4, 4]);
          drawFuncCurve((x) => x * x - 2 * x - 3, 0, 4.5, ox, oy, unit, QCOL.cyan, 3.8, [], 0);
          if (t > 0.05 || state.activePartIdx !== -1) {
            drawFuncCurve((x) => x * x + 2 * x - 3, -4.5 * Math.max(0.2, t), 0, ox, oy, unit, QCOL.pink, 3.8, [], 1);
          }

          qdot(S(0, -3), '꺾인 점 (0, -3) [k=-3 에서 교점 3개!]', QCOL.gold, 14, -8);
          qdot(S(1, -4), '오른쪽 꼭짓점 (1, -4)', QCOL.cyan, 12, 18);
          qdot(S(-1, -4), '왼쪽 대칭 꼭짓점 (-1, -4)', QCOL.pink, -110, 18);
        } else if (sub === 'absLineRotTangent') {
          // y = |x^2 - 4| 와 정점 (-3, 0)을 지나는 직선 y = m(x + 3)
          drawFuncCurve((x) => x * x - 4, -4.2, -2, ox, oy, unit, QCOL.cyan, 3.5, [], 1);
          drawFuncCurve((x) => x * x - 4, 2, 4.2, ox, oy, unit, QCOL.cyan, 3.5, [], 1);
          drawFuncCurve((x) => 4 - x * x, -2, 2, ox, oy, unit, QCOL.pink, 3.8, [], 0);

          const mTan = 6 - 2 * Math.sqrt(5); // [2.0 수정] D = m² - 12m + 16 = 0 의 작은 근 ≈ 1.528 (원본은 0.472로 접하지 않았음)
          const curM = 0.2 + (mTan - 0.2) * Math.max(0.2, t);
          drawFuncCurve((x) => curM * (x + 3), -4.2, 5.0, ox, oy, unit, QCOL.gold, 3.4, [], 0);

          qdot(S(-3, 0), '점 (-3, 0)', QCOL.gold, -25, 22);
          qdot(S(-2, 0), '(-2, 0)', QCOL.white, -15, 20);
          qdot(S(2, 0), '(2, 0)', QCOL.white, 10, 20);
          qdot(S(-curM / 2, 4 - (curM / 2) ** 2), '봉우리(-x²+4) 접점 (D=0 ➔ 교점 3개!)', QCOL.gold, 12, -14);
        } else if (sub === 'absPiecewiseSplit') {
          // 경계선 x = 1 기준 좌(y = x^2 - 2) + 우(y = (x-2)^2 - 2)
          qline(S(1, -4.5), S(1, 5.5), QCOL.gold, 2.4, [6, 4], false, 2);
          drawFuncCurve((x) => x * x - 2, -2.8, 1, ox, oy, unit, QCOL.pink, 3.8, [], 1);
          drawFuncCurve((x) => (x - 2) * (x - 2) - 2, 1, 4.8, ox, oy, unit, QCOL.cyan, 3.8, [], 0);

          qdot(S(1, -1), '경계점 (1, -1) [x=1 이어붙이기!]', QCOL.gold, 14, -10);
          qdot(S(0, -2), '왼쪽 꼭짓점 (0, -2)', QCOL.pink, -95, 18);
          qdot(S(2, -2), '오른쪽 꼭짓점 (2, -2)', QCOL.cyan, 12, 18);
        } else {
          // maxMinEnvelope: min(f, g) 아래쪽 테두리
          const fn = (x) => -0.6 * (x - 1) * (x - 1) + 3.5;
          const gn = (x) => 0.5 * x + 0.8;
          drawFuncCurve(fn, -3.5, 5.2, ox, oy, unit, 'rgba(56, 189, 248, 0.38)', 2.2, [5, 4]);
          drawFuncCurve(gn, -4.5, 5.5, ox, oy, unit, 'rgba(52, 211, 153, 0.38)', 2.2, [5, 4]);

          const envFn = t > 0.6 ? (x) => Math.max(fn(x), gn(x)) : (x) => Math.min(fn(x), gn(x));
          drawFuncCurve(envFn, -3.5, 5.2, ox, oy, unit, QCOL.gold, 4.5, [], 0);
          qdot(S(2.43, gn(2.43)), t > 0.6 ? 'max(f, g) 위쪽 테두리' : 'min(f, g) 최댓값 교점!', QCOL.gold, 14, -12);
        }
      }

      // =====================================================================
      // [모드 4] 실근의 위치 (근의 분리: 함 · 판 · 축 마스터)
      // =====================================================================
      else if (m === 4) {
        if (sub === 'sepBothGreater') {
          qline(S(1, -4.5), S(1, 5.5), QCOL.green, 3.0, [6, 4], true, 0);
          // 정상 곡선: 두 근이 모두 p = 1 보다 큰 포물선 (축 x = 3)
          drawFuncCurve((x) => 0.7 * (x - 2) * (x - 4), -1.0, 6.2, ox, oy, unit, QCOL.gold, 3.8, [], 0);

          // 반례 ①: f(1)>0, 축>1 이지만 D < 0 (허근!)
          if (state.activePartIdx === 1 || t > 0.2) {
            drawFuncCurve((x) => 0.7 * (x - 3) * (x - 3) + 1.2, -0.5, 6.0, ox, oy, unit, QCOL.red, 2.4, [5, 4], 1);
            qdot(S(3, 1.2), '반례 ①: D<0 이면 실근 없음 ❌', QCOL.red, 12, -10);
          }
          // 반례 ②: f(1)>0, D>0 이지만 대칭축 < 1 (두 근이 왼쪽에 치우침!)
          if (state.activePartIdx === 2 || t > 0.5) {
            drawFuncCurve((x) => 0.7 * (x + 1) * (x + 3), -4.8, 1.8, ox, oy, unit, QCOL.pink, 2.4, [5, 4], 2);
            qdot(S(-2, -0.7), '반례 ②: 축<1 이면 왼쪽에 생김 ❌', QCOL.pink, -75, 22);
          }

          qdot(S(1, 2.1), '① f(1) > 0 (경계 양수!)', QCOL.green, 12, -8);
          qdot(S(3, -0.7), '② D ≥ 0 & ③ 대칭축(3) > 1 ⭕', QCOL.gold, 12, 18);
        } else if (sub === 'sepBetweenOneShot') {
          // 두 근 사이에 p = 1 이 있을 때: 오직 f(1) < 0 하나면 끝!
          qline(S(1, -4.5), S(1, 5.5), QCOL.gold, 3.2, [6, 4], true, 0);
          const axisShift = -0.8 + 2.2 * Math.sin(t * Math.PI * 2);
          const fn = (x) => 0.55 * (x - (1 + axisShift)) ** 2 - 2.2;
          drawFuncCurve(fn, -3.8, 6.2, ox, oy, unit, QCOL.cyan, 3.8, [], 0);

          const f1 = fn(1);
          qline(S(1, 0), S(1, f1), QCOL.pink, 4.5, [], true, 0);
          qdot(S(1, f1), '오직 f(p) < 0 단 1개! (양옆 자동 관통 ⭕)', QCOL.gold, 14, 16, 6.5);
        } else if (sub === 'sepInsideInterval') {
          drawIntervalWindow(-1, 3, ox, oy, unit, '가두기 구간 (-1 < α ≤ β < 3)');
          const fn = (x) => 0.85 * (x - 0.3) * (x - 2.1);
          drawFuncCurve(fn, -2.5, 4.5, ox, oy, unit, QCOL.gold, 3.8, [], 1);

          qdot(S(-1, fn(-1)), '① f(-1) > 0', QCOL.green, -65, -10);
          qdot(S(3, fn(3)), '① f(3) > 0', QCOL.green, 12, -10);
          qdot(S(1.2, fn(1.2)), '② D ≥ 0 & ③ -1 < 축(1.2) < 3', QCOL.gold, -45, 22);
        } else if (sub === 'sepOneRootInInterval') {
          drawIntervalWindow(-1, 2, ox, oy, unit, '구간 (-1, 2) 사이에 오직 1개의 실근');
          const fn = (x) => 0.5 * (x - 0.5) * (x - 4.2);
          drawFuncCurve(fn, -2.8, 5.5, ox, oy, unit, QCOL.gold, 3.8, [], 0);

          qdot(S(-1, fn(-1)), 'f(-1) > 0 (+)', QCOL.cyan, -75, -10);
          qdot(S(2, fn(2)), 'f(2) < 0 (-) ➔ 곱 f(-1)·f(2) < 0!', QCOL.pink, 14, 18);
          qdot(S(0.5, 0), '유일한 교점 통과 ⭕', QCOL.gold, 10, -14);
        } else {
          // rootSignZero: 실근의 부호 판별 (기준점 p = 0 y축!)
          qline(S(0, -4.5), S(0, 5.5), QCOL.gold, 3.2, [], true, 0);
          drawFuncCurve((x) => 0.7 * (x - 1.2) * (x - 3.4), -1.2, 5.2, ox, oy, unit, QCOL.gold, 3.6, [], 0);
          drawFuncCurve((x) => 0.5 * (x + 2.2) * (x - 1.8), -4.0, 3.8, ox, oy, unit, QCOL.pink, 3.0, [5, 4], 2);

          qdot(S(0, 0.7 * 1.2 * 3.4), '두 양근: f(0)=c>0, D≥0, 축>0', QCOL.gold, 12, -10);
          qdot(S(0, -0.5 * 2.2 * 1.8), '다른 부호: f(0)=c<0 (αβ<0) 단 1개!', QCOL.pink, 12, 16);
        }
      }

      // =====================================================================
      // [모드 5] 항상 성립하는 절대부등식(D < 0) & 제한된 범위 부등식
      // =====================================================================
      else if (m === 5) {
        if (sub === 'alwaysPositiveAll') {
          // a > 0, D < 0 (위에 붕 떠 있음) vs D > 0 반례
          const lift = 1.5 - 3.0 * (1 - Math.max(0.25, t)); // t=1 일 때 +1.5 (공중부양 D<0!)
          drawFuncCurve((x) => 0.6 * (x - 1) * (x - 1) + 1.4, -3.2, 5.2, ox, oy, unit, QCOL.green, 4.0, [], 0);
          drawFuncCurve((x) => 0.6 * (x + 2.5) * (x + 2.5) - 1.5, -5.5, 0.5, ox, oy, unit, QCOL.red, 2.6, [5, 4], 2);

          qdot(S(1, 1.4), '항상 f(x) > 0 성립: a > 0 이고 D < 0 (교점 0개 허근!)', QCOL.green, 12, -14);
          qdot(S(-2.5, -1.5), 'D > 0 이면 음수 발생 ❌!', QCOL.red, -60, 22);
        } else if (sub === 'restrictedIneqMinMax') {
          drawIntervalWindow(0, 3, ox, oy, unit, '제한된 범위 [0 ≤ x ≤ 3] 에서만 성립하면 OK!');
          // 구간 [0, 3]에서 f(x) >= 0 (최솟값 >= 0) vs 구간 [0, 3]에서 f(x) <= 0 (양끝점 <= 0)
          drawFuncCurve((x) => 0.6 * (x - 1.5) * (x - 1.5) + 0.8, -2.5, 5.5, ox, oy, unit, QCOL.gold, 3.6, [], 0);
          drawFuncCurve((x) => 0.45 * (x + 0.8) * (x - 4.2), -2.5, 5.8, ox, oy, unit, QCOL.pink, 3.6, [], 1);

          qdot(S(1.5, 0.8), '[0,3]에서 f(x)≥0: 최솟값 ≥ 0', QCOL.gold, -45, -14);
          qdot(S(0, -1.51), 'f(0) ≤ 0', QCOL.pink, -60, 14);
          qdot(S(3, -2.16), '[0,3]에서 f(x)≤0: 양끝점 f(0)≤0 & f(3)≤0 이면 끝!', QCOL.pink, 12, 16);
        } else if (sub === 'specialSol4Cases') {
          // x = 2 에서 x축에 접하는 완전제곱 포물선 (D = 0)
          drawFuncCurve((x) => 0.75 * (x - 2) * (x - 2), -2.0, 6.0, ox, oy, unit, QCOL.gold, 4.0, [], 0);
          qdot(S(2, 0), '접점 x = 2 (D = 0) [(x-2)² ≤ 0 의 유일한 해!]', QCOL.gold, -60, 24, 7.0);
        } else if (sub === 'integerCountBoundary') {
          const curK = 3.15 + 0.7 * t;
          const fn = (x) => 0.6 * (x - 1) * (x - curK);
          drawFuncCurve(fn, -1.5, 6.0, ox, oy, unit, QCOL.cyan, 3.6, [], 0);

          [1, 2, 3].forEach((n) => qdot(S(n, 0), `${n}(포함⭕)`, QCOL.gold, -15, 24));
          qdot(S(4, 0), '4(제외❌)', QCOL.red, -10, 24);
          qdot(S(curK, 0), `경계 k (3 ≤ k < 4)`, QCOL.pink, -20, -16);
        } else {
          // compIneqTransform: f(x) < 0 (-2 < x < 4) -> f(2x - 1) < 0 (-1/2 < x < 5/2)
          drawFuncCurve((x) => 0.35 * (x + 2) * (x - 4), -3.8, 5.8, ox, oy, unit, 'rgba(56, 189, 248, 0.45)', 2.4, [5, 4], 0);
          drawFuncCurve((x) => 0.35 * (2 * x - 1 + 2) * (2 * x - 1 - 4), -2.5, 4.5, ox, oy, unit, QCOL.gold, 3.8, [], 1);

          qdot(S(-2, 0), '-2', QCOL.cyan, -10, 20);
          qdot(S(4, 0), '4 (원래 해)', QCOL.cyan, 10, 20);
          qdot(S(-0.5, 0), '-1/2', QCOL.gold, -20, -14);
          qdot(S(2.5, 0), '5/2 (-2 < 2x-1 < 4 해!)', QCOL.gold, 12, -14);
        }
      }

      // =====================================================================
      // [모드 6] 고1 1등급 결정타 함정 연구소
      // =====================================================================
      else {
        if (sub === 'trapLeadingZero') {
          // k > 0 포물선 vs k = 0 수평 직선 y = 3 > 0!
          drawFuncCurve((x) => 0.5 * (x - 1) * (x - 1) + 2.0, -3.5, 5.5, ox, oy, unit, QCOL.cyan, 3.2, [], 0);
          qline(S(-6, 3), S(7, 3), QCOL.pink, 4.2, [], true, 1);
          qdot(S(0, 3), 'k = 0 일 때: y = 3 > 0 (모든 실수에서 성립 ⭕!)', QCOL.pink, 14, -12);
        } else if (sub === 'trapMaxLtMin') {
          // 좌측: f(x) >= g(x) (같은 x 비교) | 우측: f(x1) >= g(x2) (f의 최솟값 >= g의 최댓값)
          const fn = (x) => 0.6 * (x + 2) * (x + 2) + 1.5;
          const gn = (x) => -0.6 * (x - 2.5) * (x - 2.5) + 1.0;
          drawFuncCurve(fn, -5.2, 1.2, ox, oy, unit, QCOL.cyan, 3.6, [], 0);
          drawFuncCurve(gn, -0.8, 5.8, ox, oy, unit, QCOL.pink, 3.6, [], 1);

          qline(S(-6, 1.25), S(7, 1.25), QCOL.gold, 2.8, [6, 4], true, 1);
          qdot(S(-2, 1.5), 'f의 최솟값 (1.5)', QCOL.cyan, -40, -14);
          qdot(S(2.5, 1.0), 'g의 최댓값 (1.0) [min(f) ≥ max(g)!]', QCOL.pink, -40, 22);
        } else if (sub === 'trapKIndepDoubleRoot') {
          // k값이 변해도 항상 x축에 접하며 이동하는 포물선 다발
          [-2, 0, 2].forEach((kv, idx) => {
            drawFuncCurve((x) => 0.65 * (x - (kv + 1)) ** 2, kv - 2.2, kv + 4.2, ox, oy, unit, idx === 1 ? QCOL.gold : 'rgba(56, 189, 248, 0.45)', idx === 1 ? 3.8 : 2.2);
            qdot(S(kv + 1, 0), `k=${kv} 중근`, QCOL.gold, -15, 22);
          });
        } else if (sub === 'trapIrrationalCoeffs') {
          // (x - (1+√2))(x + 1) = 0 -> 근이 x = -1 과 x = 2.414 (1-√2 가 아님!)
          const r1 = -1, r2 = 1 + Math.sqrt(2);
          drawFuncCurve((x) => 0.6 * (x - r1) * (x - r2), -3.2, 4.8, ox, oy, unit, QCOL.red, 3.6, [], 1);
          qdot(S(r2, 0), '한 근 1 + √2', QCOL.gold, 10, -14);
          qdot(S(r1, 0), '다른 근 = -1 (1-√2 아님 ❌!)', QCOL.red, -85, -14);
        } else {
          // trapParabolaMeetSegment: 선분 AB (0,1)~(3,4) 와 포물선 y = x^2 - 2x + k
          const pA = S(0, 1), pB = S(3, 4);
          qline(pA, pB, QCOL.green, 4.5, [], true, 2);
          const curK = 1.0 + 2.25 * t; // k=1 (양끝 통과) ~ k=3.25 (접함!)
          drawFuncCurve((x) => x * x - 2 * x + curK, -2.2, 4.5, ox, oy, unit, QCOL.gold, 3.6, [], 0);

          qdot(pA, '끝점 A(0, 1) [k=1]', QCOL.green, -85, 6);
          qdot(pB, '끝점 B(3, 4) [k=1]', QCOL.green, 12, -8);
          qdot(S(1.5, 2.5), '접점 (1.5, 2.5) [최대 k = 13/4!]', QCOL.gold, 14, 16);
        }
      }
    }

  /* ======================================================================
     2.0 셸 연결 (새로 작성한 부분)
     ====================================================================== */
  const TABS = ['두 함수의 차 f-g & 직선의 위치 관계', '움직이는 대칭축 x=p 최대·최소', '절댓값 그래프(|f|, f(|x|)) & 실근의 개수', '실근의 위치 (근의 분리: f(p)·판별식·축)', '항상 성립하는 부등식 & 제한된 범위의 부등식', '함정 연구소'];
  const SHORT = ['차 f-g·위치 관계', '움직이는 대칭축', '절댓값 그래프', '근의 분리', '항상 성립 조건', '함정 연구소'];
  const QUESTIONS = [
    '곡선과 직선이 만나는 점을 찾을 때, 두 식을 h(x) = f(x) − g(x) 하나로 바꾸면 무엇이 쉬워질까?',
    '구간이 고정되고 대칭축이 움직이면(또는 구간이 움직이면) 최솟값과 최댓값은 어떻게 바뀔까?',
    '절댓값이 붙으면 그래프는 어떻게 접히고, 수평선 y = k 와의 교점 개수는 어떻게 달라질까?',
    '이차방정식의 두 근이 원하는 구간에 놓이게 하려면 함숫값·판별식·대칭축을 어떻게 조합해야 할까?',
    '모든 실수(또는 제한된 구간)에서 이차부등식이 항상 성립하려면 그래프는 어떤 모양이어야 할까?',
    '시험에서 자주 틀리는 조건(k = 0, 풀이 순서, 반례)을 그래프로 보면 어디가 함정일까?'
  ];
  // 이 장면에서 진행(0→100%)이 실제로 그림을 바꾸는 장면만 슬라이더·시연 버튼을 보여 줍니다.
  const FOLD = new Set(['diffFuncFlatten', 'tangentDiscriminant', 'minDistMaxArea', 'symmetryRootSum', 'movingAxisMin', 'movingAxisMaxJump', 'movingWindowInterval', 'inscribedRectParabola', 'absWholeFold', 'absXSymmetry', 'absLineRotTangent', 'maxMinEnvelope', 'sepBothGreater', 'sepBetweenOneShot', 'integerCountBoundary', 'trapParabolaMeetSegment']);
  // 원본의 p 프리셋(대칭축 p = -1, 0.6, 1.4, 3)은 대칭축이 움직이는 두 장면에서만 p 값과 맞습니다(진행률 0.05·0.41·0.59·0.95).
  const P_SCENES = new Set(['movingAxisMin', 'movingAxisMaxJump']);
  const P_TARGET = [0.05, 0.41, 0.59, 0.95];
  const LENSES = [
    ['all', '🔍 전체 구조'],
    ['axis', '📐 대칭축·꼭짓점·경계'],
    ['roots', '📏 교점·최대최소·실근'],
    ['aux', '🪄 h(x)=f(x)-g(x)·접선·반례곡선']
  ];
  // 현재 장면에서 효과가 없는 렌즈는 숨깁니다 (원본 LENS_OFF 그대로)
  const LENS_OFF = {
    diffFuncFlatten: ['axis'], tangentDiscriminant: ['axis'], chordLengthVieta: ['axis'], minDistMaxArea: ['axis'],
    symmetryRootSum: ['aux'], inscribedRectParabola: ['aux'], absWholeFold: ['axis'], absXSymmetry: ['roots'],
    absLineRotTangent: ['axis', 'aux'], absPiecewiseSplit: ['roots', 'aux'], maxMinEnvelope: ['axis'],
    sepBothGreater: ['roots'], sepBetweenOneShot: ['aux'], sepInsideInterval: ['aux'],
    sepOneRootInInterval: ['aux'], alwaysPositiveAll: ['axis'], restrictedIneqMinMax: ['aux'],
    specialSol4Cases: ['axis', 'aux'], integerCountBoundary: ['aux'], compIneqTransform: ['axis'],
    trapLeadingZero: ['axis', 'aux'], trapMaxLtMin: ['axis', 'aux'], trapKIndepDoubleRoot: ['axis', 'aux'],
    trapIrrationalCoeffs: ['axis', 'aux'], trapParabolaMeetSegment: ['axis']
  };
  const lensList = (m, id) => {
    const off = (LENS_OFF[m] || []).concat(LENS_OFF[id] || []);
    const rest = ['axis', 'roots', 'aux'].filter((x) => !off.includes(x));
    return rest.length ? ['all'].concat(rest) : []; // 원본 syncLensButtons: 효과 있는 렌즈가 하나도 없으면 렌즈 전체를 숨김
  };

  function sync(s, m, id) {
    state.mode = m;
    state.subType[m] = id;
    state.fold = s.fold;
    state.kIdx = s.kIdx;
    state.activePartIdx = s.part == null ? -1 : s.part;
    state.conceptSwitch = lensList(m, id).includes(s.lens) ? s.lens : 'all';
  }
  const tone = (p) => (p.ok === false ? 'red' : p.color);

  function sceneOf(m, it) {
    const id = it.id;
    const label = arrow(it.label);
    return {
      id, title: label, short: label, reviewTab: true,
      question: QUESTIONS[m - 1],
      notesTitle: '오답 함정과 풀이 요령',
      enter: (s) => {
        // 원본 setMode / setSubType 의 초기화 규칙 그대로(진행 0%, 렌즈가 없는 장면이면 전체 구조)
        s.fold = 0;
        if (!lensList(m, id).includes(s.lens)) s.lens = 'all';
      },
      controls: () => (FOLD.has(id) ? ['fold'] : []),
      presets: (s) => {
        const out = [];
        if (P_SCENES.has(id)) P_PRESETS.forEach((po, i) => out.push({ group: '대칭축 위치 p', label: po.label, set: { fold: P_TARGET[i] }, ms: 700, on: (st) => Math.abs(st.fold - P_TARGET[i]) < 0.02 }));
        if (id === 'absWholeFold') K_PRESETS.forEach((ko, i) => out.push({ group: '수평선 높이 y = k', label: ko.label, apply: (st) => { st.kIdx = i; }, on: (st) => st.kIdx === i }));
        if (FOLD.has(id)) [0, 0.5, 1].forEach((v) => out.push({ group: '진행 단계', label: v === 0 ? '0% 시작' : v === 1 ? '100% 완성' : '50%', set: { fold: v }, ms: 700, on: (st) => Math.abs(st.fold - v) < 0.01 }));
        const lenses = lensList(m, id);
        if (lenses.length) LENSES.filter(([k]) => lenses.includes(k)).forEach(([k, lbl]) => out.push({ group: '보기 선택', label: lbl, apply: (st) => { st.lens = k; }, on: (st) => st.lens === k }));
        return out;
      },
      actions: () => {
        if (!FOLD.has(id)) return [];
        return [{
          id: 'act', play: true, primary: true, icon: 'wand',
          label: (st) => { sync(st, m, id); return arrow(getSpec().actionTxt); },
          run: (st, lab) => { lab.tween({ fold: st.fold > 0.5 ? 0 : 1 }, 1100); }
        }];
      },
      view: (s) => {
        sync(s, m, id);
        const spec = arrow(getSpec());
        return {
          guide: `<div style="font-weight:800;margin-bottom:6px">${APLab.esc(APLab.stripEmoji(spec.badge))}</div>${spec.hint}`,
          readouts: [
            { label: spec.dim1Name, value: spec.val1Txt, color: 'sky', wide: true },
            { label: spec.dim2Name, value: spec.val2Txt, color: 'rose', wide: true }
          ],
          parts: spec.parts.map((p) => ({ id: p.id, name: p.name, desc: p.desc, value: p.val, color: tone(p), ok: p.ok })),
          summary: spec.totalRes,
          rule: spec.rule,
          formula: spec.formulaHTML,
          notes: spec.notes,
          tape: { title: spec.tapeTitle, segments: (spec.tapeSegs || []).map((sg) => ({ text: sg.text, weight: sg.weight, color: sg.color })) }
        };
      },
      draw: (b, s) => {
        BOARD = b;
        sync(s, m, id);
        if (s.grid) b.grid({ step: 1 });
        if (id === 'substitution2Stage') paneAxes(); else b.axes({ tickStep: b.k < 32 ? 2 : 1 }); // 휴대폰처럼 칸이 작으면 눈금 숫자를 2칸마다
        drawQuadFuncMasterScene(0, 0, U, s.fold, getSpec());
      }
    };
  }

  const groups = Object.keys(SUB_MENUS).map((k) => {
    const m = +k;
    return { id: 'm' + m, title: TABS[m - 1], short: SHORT[m - 1], scenes: SUB_MENUS[m].map((it) => sceneOf(m, it)) };
  });

  APLab.createLab({
    id: 'common-quadratic',
    title: '이차함수',
    courseName: '공통수학',
    unit: '방정식과 부등식 · 이차함수',
    courseColor: 'var(--m-violet)',
    home: '../index.html#common',
    legacy: '../../labs/공통수학/이차함수.html',
    board: { kind: 'cartesian', focus: { x: [-6, 8], y: [-5.4, 6.9] }, minZoom: 0.5, maxZoom: 5 },
    state: { lens: 'all', kIdx: 2 },
    persist: ['lens'],
    params: {
      fold: { value: 0, min: 0, max: 1, step: 0.005, color: 'amber', label: '진행 (0% → 100%)', hint: '직선 내리기 · 대칭축 이동 · 절댓값 그래프 접어 올리기 같은 변화를 천천히 확인합니다', format: (v) => `${Math.round(v * 100)}%` }
    },
    groups
  });
});
</script>
