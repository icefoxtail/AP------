  /* ---------- 글자 다듬기: 원본 formatRichMath 의 ** 굵게 + 수식 안 부등호(<, >) 보호 ---------- */
  const safe = (t) => String(t == null ? '' : t).replace(/\$\$([^$]+)\$\$|\$([^$]+)\$/g, (m0, a, b) => {
    const body = (a != null ? a : b).replace(/</g, '\\lt ').replace(/>/g, '\\gt ');

  /* ---------- 2. 원본 그리기 도우미 → 공용 무대(APLab.Board) 연결층 ---------- */
  const mathToScreen = (x, y) => B.toS(x, y);
  const dashOf = (d) => (d && d.length ? d : null);
  const stageBox = () => { const i = B.insets; return { x0: i.left + 6, x1: B.W - i.right - 6, y0: i.top + 6, y1: B.H - i.bottom - 6 }; };
  const cleanLabel = (l) => String(l || '').replace(/\[드래그\s+(k=[^\]]+)\]/g, '$1').replace(/\s*\[[^\]]*드래그[^\]]*\]/g, '');

  function drawFunctionCurve(fn, color = '#34d399', lineWidth = 2.6, dash = [], xStart = null, xEnd = null) {
    const g = (x) => {
      let y = fn(x);
      if (S.mut_abs && !isNaN(y)) y = Math.abs(y);
      return (isNaN(y) || !isFinite(y) || Math.abs(y) > 60) ? NaN : y;
    };
    B.plot(g, { color, width: lineWidth, dash: dashOf(dash), glow: dash.length === 0, from: xStart, to: xEnd });
    if (S.mut_symY) { // 원본 'y축 대칭 곡선' 겹쳐 그리기
      const gs = (x) => { const y = fn(-x); return (isNaN(y) || !isFinite(y) || Math.abs(y) > 60) ? NaN : y; };
      B.plot(gs, { color: 'rgba(251, 191, 36, 0.45)', width: lineWidth, dash: [4, 4], from: xStart, to: xEnd });

  }
  function drawMathLine(slope, intercept, color = '#fbbf24', dash = [], width = 2) {
    B.line([0, intercept], slope, { color, width, dash: dashOf(dash) });
  }
  function drawMathSegment(x1, y1, x2, y2, color = '#fbbf24', dash = [], width = 2.2) {
    B.seg([x1, y1], [x2, y2], { color, width, dash: dashOf(dash) });
  }
  function drawMathPoint(x, y, label = '', color = '#fbbf24', radius = 6, isDraggable = false, onDrag = null, off = null) {
    const o = { color, r: radius };
    const lb = cleanLabel(label);
    if (lb) o.label = lb;
    if (off) Object.assign(o, off); // 라벨 위치 조정(dx, dy, align) — 겹침 방지용
    if (isDraggable) B.handle('h' + HID++, [x, y], { ...o, drag: (w) => onDrag(w) });

  // 알약 모양 설명 상자: 무대 안으로 밀어 넣고, 길면 두 줄/작은 글씨로 줄입니다(휴대폰에서 잘리지 않게).
  // 폭이 좁은 화면에서는 긴 알약을 그림 위에 겹쳐 놓지 않고 무대 위쪽에 차례로 쌓습니다(가려짐 방지).
  const PILLS = [];
  function pillBox(c, color, cx, cy, tw, bh) {
    const bx = stageBox();
    const x = clamp(cx, bx.x0 + tw / 2, Math.max(bx.x0 + tw / 2, bx.x1 - tw / 2));
    const y = clamp(cy, bx.y0 + bh / 2, Math.max(bx.y0 + bh / 2, bx.y1 - bh / 2));
    c.fillStyle = B.color('halo', 0.9);
    c.strokeStyle = B.color(color, 0.85);
    c.lineWidth = 1.4;
    c.beginPath();
    c.roundRect(x - tw / 2, y - bh / 2, tw, bh, 7);
    c.fill();
    c.stroke();
    return { x, y };
  }
  function emitPill(sp, x, y) {
    if (B.W < 600 && sp.tw > 110) PILLS.push(sp);
    else sp.paint(x, y);
  }
  function flushPills() {
    const bx = stageBox();
    let y = bx.y0;
    PILLS.forEach((sp) => { sp.paint((bx.x0 + bx.x1) / 2, y + sp.bh / 2); y += sp.bh + 5; });
    PILLS.length = 0;
  }
  function drawCanvasBadge(_c, text, x, y, color = '#34d399') {
    const c = B.ctx;
    const maxW = Math.max(120, stageBox().x1 - stageBox().x0);
    c.save();
    let fs = 12.5 * B.fs;
    const font = () => { c.font = `800 ${fs}px ${B.font}`; };
    font();
    let ls = [String(text)];
    let tw = c.measureText(ls[0]).width + 16;
    if (tw > maxW) { // 가운데에 가장 가까운 띄어쓰기에서 두 줄로
      const t = ls[0];
      let cut = -1;
      for (let i = 0; i < t.length; i++) if (t[i] === ' ' && (cut < 0 || Math.abs(i - t.length / 2) < Math.abs(cut - t.length / 2))) cut = i;
      if (cut > 0) ls = [t.slice(0, cut), t.slice(cut + 1)];
      tw = Math.max(...ls.map((l) => c.measureText(l).width)) + 16;
      if (tw > maxW) { fs = Math.max(9.5, (fs * maxW) / tw); font(); tw = Math.max(...ls.map((l) => c.measureText(l).width)) + 16; }
    }
    const lh = fs * 1.28;
    const bh = ls.length * lh + 8;
    const f = fs;
    c.restore();
    emitPill({
      tw, bh,
      paint: (px, py) => {
        c.save();
        c.setLineDash([]);
        c.shadowBlur = 0;
        c.font = `800 ${f}px ${B.font}`;
        const p = pillBox(c, color, px, py, tw, bh);
        c.fillStyle = B.color(color);
        c.textAlign = 'center';
        c.textBaseline = 'middle';
        ls.forEach((l, i) => c.fillText(l, p.x, p.y - bh / 2 + 4 + lh * (i + 0.5)));
        c.restore();
      }
    }, x, y);
  }
  // 세로 분수 알약: 앞글(prefix) + 분자/분모 + 뒷글(suffix)
  function drawCanvasFraction(_c, numStr, denStr, x, y, options = {}) {
    const { color = '#fbbf24', fontSize = 14, prefix = '', suffix = '' } = options;
    const c = B.ctx;
    const maxW = Math.max(140, stageBox().x1 - stageBox().x0);
    c.save();
    let fs = fontSize * B.fs;
    let preW, sufW, fracW, totalW;
    const meas = () => {
      c.font = `800 ${fs}px ${B.font}`;
      preW = prefix ? c.measureText(prefix).width + 4 : 0;
      sufW = suffix ? c.measureText(suffix).width + 4 : 0;
      fracW = Math.max(c.measureText(numStr).width, c.measureText(denStr).width) + 10;
      totalW = preW + fracW + sufW + 16;
    };
    meas();
    if (totalW > maxW) { fs = Math.max(9.5, (fs * maxW) / totalW); meas(); }
    const totalH = fs * 2.5;
    const f = fs, pw = preW, fw = fracW, tw = totalW;
    c.restore();
    emitPill({
      tw, bh: totalH,
      paint: (px, py) => {
        c.save();
        c.setLineDash([]);
        c.shadowBlur = 0;
        c.font = `800 ${f}px ${B.font}`;
        const p = pillBox(c, color, px, py, tw, totalH);
        c.fillStyle = B.color(color);
        c.textBaseline = 'middle';
        let curX = p.x - tw / 2 + 8;
        if (prefix) { c.textAlign = 'left'; c.fillText(prefix, curX, p.y); curX += pw; }
        const cf = curX + fw / 2;
        c.textAlign = 'center';
        c.fillText(numStr, cf, p.y - f * 0.58);
        c.fillText(denStr, cf, p.y + f * 0.62);
        c.strokeStyle = B.color(color);
        c.lineWidth = 1.6;
        c.beginPath();
        c.moveTo(cf - fw / 2 + 2, p.y);
        c.lineTo(cf + fw / 2 - 2, p.y);
        c.stroke();
        curX += fw;
        if (suffix) { c.textAlign = 'left'; c.fillText(suffix, curX + 4, p.y); }
        c.restore();
      }
    }, x, y);
  }

  /* ---------- 3. 실시간 값 (원본 updateLiveHUDAndInvariants 의 계산 그대로) ---------- */

  let hudEq = '';

if (mId === 'type1') {

hudEq = (
`$f(k) = (${p.k.toFixed(1)}-${p.r1})(${p.k.toFixed(1)}-${p.r2}) = ${fk.toFixed(2)}, \\quad x^{${n}} = f(k) \\implies \\text{실근 } ${cnt}\\text{개}$`
);

];
} else if (mId === 'type2') {
const M = Math.round(p.maxM);
const N = Math.round(p.maxN);
let total = 0;
const list = [];
for (let n = 2; n <= N; n++) {
const c = Math.floor(M / n);
total += c;
list.push(c);
}
hudEq = (
`$\\sqrt[n]{2^m} = 2^{\\frac{m}{n}} \\in \\mathbb{N} \\iff n \\mid m \\implies \\sum_{n=2}^{${N}} \\left\\lfloor \\frac{${M}}{n} \\right\\rfloor = ${list.join('+')} = ${total}\\text{개}$`
);
cards = [
{ title: '자연수 조건 총 순서쌍', val: `${total}개`, sub: `몫 합산: ${list.join(' + ')}` },
{ title: '가우스 몫 공식 오차', val: '0.000%', sub: '전수 조사와 100% 일치' },

];
} else if (mId === 'type3') {
const P = Math.round(p.multP);
const isSum = Math.round(p.modeSum) === 1;
const coeff = isSum ? P + 1 : P - 1;
// For 1 <= log x < 2, coeff * log x is in [coeff, 2*coeff)
const sols = [];
for (let m = coeff; m < 2 * coeff; m++) {
if (isSum && m === coeff) continue; // exclude log x = 1 where fractional part is 0!
sols.push(`${m}/${coeff}`);
}
hudEq = (
isSum
? `$\\{\\log x\\} + \\{${P}\\log x\\} = 1 \\iff ${coeff}\\log x \\in \\mathbb{Z} \\;(\\alpha\\neq 0) \\implies \\log x \\in \\left\\{${sols.join(', ')}\\right\\}$`
: `$\\{\\log x\\} = \\{${P}\\log x\\} \\iff ${coeff}\\log x \\in \\mathbb{Z} \\implies \\log x \\in \\left\\{${sols.join(', ')}\\right\\}$`
);
cards = [
{ title: isSum ? '소수부분 합=1 해 개수' : '소수부분 같음 해 개수', val: `${sols.length}개`, sub: isSum ? `정수점(α=0) 1개 제외됨!` : `정수점 포함 (${coeff}개)` },
{ title: '유효 log x 값들', val: sols.join(', '), sub: `등분 간격 1 / ${coeff}` },
{ title: '톱니파 기울기 계수', val: `${coeff}배`, sub: isSum ? `p + 1 = ${P} + 1` : `p - 1 = ${P} - 1` },
{ title: '소수부분 차이 불변량', val: '0.000%', sub: '정수 계단 돌파 지점 일치' }
];
} else if (mId === 'type4') {
const dx = Math.log2(p.multK);
const dy = p.yCut2 - p.yCut1;
const area = dx * dy;
hudEq = (
`$y = ${p.multK.toFixed(1)}\\cdot 2^x = 2^{x + \\log_2 ${p.multK.toFixed(1)}} \\implies \\text{가로 선분 } \\overline{AB} = \\log_2 ${p.multK.toFixed(1)} = ${dx.toFixed(3)} \\text{ (불변!)}$`
);
cards = [
{ title: '가로 선분 길이 AB', val: dx.toFixed(3), sub: `log₂(${p.multK.toFixed(1)}) 상수 불변량` },
{ title: '높이 t 변화에 따른 오차', val: '0.000%', sub: `y=${p.yCut1}과 y=${p.yCut2}에서 동일` },
{ title: '등적 직사각형 넓이 S', val: area.toFixed(3), sub: `가로(${dx.toFixed(2)}) × 세로(${dy.toFixed(2)})` },
{ title: '계수 ➔ 평행이동 번역', val: `x축 -${dx.toFixed(2)}`, sub: '앞의 곱셈 ➔ 지수 덧셈' }
];
} else if (mId === 'type5') {
const xA = Math.log(p.lineT) / Math.log(p.baseA);
const xB = Math.log(p.lineT) / Math.log(p.baseB);
const ratio = xB / xA; // = log_b(a)
hudEq = (
`$y = ${p.baseA.toFixed(1)}^x, \\; y = ${p.baseB.toFixed(2)}^x \\cap (y = ${p.lineT.toFixed(2)}) \\implies \\frac{\\overline{HB}}{\\overline{HA}} = \\log_b a = ${ratio.toFixed(3)}$`
);
cards = [
{ title: '가로 길이 비 HB / HA', val: ratio.toFixed(3), sub: `높이 t=${p.lineT.toFixed(1)}와 무관!` },
{ title: '밑 로그 비율 log_b(a)', val: (Math.log(p.baseA) / Math.log(p.baseB)).toFixed(3), sub: '오차 0.000% 항상 일치' },
{ title: '점 A / 점 B의 x좌표', val: `${xA.toFixed(2)}, ${xB.toFixed(2)}`, sub: `log_a(t), log_b(t)` },
{ title: '두 밑의 거듭제곱 관계', val: `a = b^(${ratio.toFixed(2)})`, sub: '수평 내분비 직독 공식' }
];
} else if (mId === 'type6') {
const x1 = p.xMid - p.stepD;
const x2 = p.xMid;
const x3 = p.xMid + p.stepD;
const y1 = Math.pow(2, x1), y2 = Math.pow(2, x2), y3 = Math.pow(2, x3);
const r = Math.pow(2, p.stepD);
hudEq = (
`$x = (${x1.toFixed(2)}, ${x2.toFixed(2)}, ${x3.toFixed(2)}) \\text{ [등차]} \\implies y = (${y1.toFixed(2)}, ${y2.toFixed(2)}, ${y3.toFixed(2)}) \\text{ [등비, } r=2^d=${r.toFixed(2)}\\text{]}$`
);
cards = [
{ title: '가운데 함숫값 제곱 y₂²', val: (y2 * y2).toFixed(3), sub: `y₂ = ${y2.toFixed(3)}` },
{ title: '양끝 함숫값 곱 y₁ · y₃', val: (y1 * y3).toFixed(3), sub: '등비중항 오차 0.000%' },
{ title: 'y좌표 공비 r (= 2^d)', val: r.toFixed(3), sub: `x 공차 d = ${p.stepD.toFixed(2)}` },
{ title: '세 함숫값의 합 y₁+y₂+y₃', val: (y1 + y2 + y3).toFixed(2), sub: `y₂(1/r + 1 + r) 일치` }
];
} else if (mId === 'type7') {
const t = p.lineT;
const cnt = t > 2.001 ? 2 : (Math.abs(t - 2) <= 0.001 ? 1 : 0);
const sqVal = t * t - 2;
hudEq = (
`$2^x + 2^{-x} = ${t.toFixed(2)} \\implies \\text{실근 } ${cnt}\\text{개 (합 } 0\\text{)}, \\quad 4^x + 4^{-x} = t^2 - 2 = ${sqVal.toFixed(2)}$`
);
cards = [
{ title: '실근 x의 개수', val: `${cnt}개`, sub: t > 2 ? '±α 대칭 2개' : (Math.abs(t-2)<0.01 ? '꼭짓점 x=0 단독 1개!' : 't < 2 해 없음') },
{ title: '모든 실근 x의 합', val: '0.000', sub: '우함수(y축 대칭) 불변량' },
{ title: '제곱식 4^x + 4^(-x) 값', val: sqVal.toFixed(2), sub: `t² - 2 = ${t.toFixed(1)}² - 2` },
{ title: '산술·기하 최솟값 경계', val: '2.000', sub: 'x = 0에서 등호 성립' }
];
} else if (mId === 'type8') {
const k = p.asymK;
const t = p.lineT;
const hasTwo = t > 0 && t < k;
const prod2 = k * k - t * t;
const sumX = hasTwo ? Math.log2(prod2) : NaN;

hudEq = (
hasTwo
? `$|2^x - ${k.toFixed(1)}| = ${t.toFixed(1)} \\implies 2^{x_1+x_2} = ${k.toFixed(1)}^2 - ${t.toFixed(1)}^2 = ${prod2.toFixed(2)}, \\; x_1+x_2 = ${sumX.toFixed(3)}$`
: `$|2^x - ${k.toFixed(1)}| = ${t.toFixed(1)} \\implies t \\ge k \\text{ 구간이므로 교점 1개만 존재!}$`
);
cards = [
{ title: '교점 개수', val: hasTwo ? '2개 (0 < t < k)' : '1개 (t ≥ k)', sub: `반사 점근선 높이 k = ${k}` },
{ title: '지수 곱 2^(x₁+x₂)', val: hasTwo ? prod2.toFixed(3) : '단일근', sub: '합차공식 k² - t² 일치' },
{ title: '두 실근의 합 x₁ + x₂', val: hasTwo ? sumX.toFixed(3) : '단일근', sub: hasTwo ? `log₂(${prod2.toFixed(2)})` : '-' },
{ title: '합차공식 항등식 오차', val: '0.000%', sub: '(k-t)(k+t) = k² - t²' }
];
}

return { formula: hudEq, cards };
}

  /* ---------- 4. 쌍둥이 숫자 변형 (원본 triggerTwinProblem 의 값 생성 그대로) ---------- */
  function twin(s, m) {
    const mId = MID(m);
    const q = pv(s, m);
    let problem = '';
    


if (mId === 'type1') {
const pairs = [[1, 5], [2, 8], [3, 9]];
const pick = pairs[Math.floor(Math.random() * pairs.length)];
q.r1 = pick[0];
q.r2 = pick[1];
q.k = (pick[0] + pick[1]) / 2;
const cnt = pick[1] - pick[0] - 1;
const sumK = q.k * cnt;
problem = `**[🎲 쌍둥이 변형]** $f(x) = (x-${pick[0]})(x-${pick[1]})$에서 짝수 제곱근 실근이 $0$개인 자연수 $k$는 총 $${cnt}$개이며, 그 합은 대칭축 $${q.k} \\times ${cnt} = ${sumK}$입니다!`;
} else if (mId === 'type2') {
const mVal = [10, 12, 14, 16][Math.floor(Math.random() * 4)];
const nVal = [4, 5, 6][Math.floor(Math.random() * 3)];
q.maxM = mVal;
q.maxN = nVal;
let tot = 0;
for (let n = 2; n <= nVal; n++) tot += Math.floor(mVal / n);
problem = `**[🎲 쌍둥이 변형]** $1 \\le m \\le ${mVal},\\; 2 \\le n \\le ${nVal}$에서 $\\sqrt[n]{2^m}$이 자연수가 되는 순서쌍 $(m, n)$의 총개수는 가우스 몫 공식으로 **${tot}개**입니다!`;
} else if (mId === 'type3') {
const pVal = [2, 3, 4][Math.floor(Math.random() * 3)];
const isSum = Math.random() < 0.5 ? 0 : 1;
q.multP = pVal;
q.modeSum = isSum;
const coeff = isSum ? pVal + 1 : pVal - 1;
problem = isSum
? `**[🎲 쌍둥이 변형]** $1 < \\log x < 2$에서 $\\log x$와 $\\log x^{${pVal}}$의 **소수부분의 합이 $1$**일 조건은 **$(1+${pVal})\\log x = ${coeff}\\log x = \\text{정수}$**입니다!`
: `**[🎲 쌍둥이 변형]** $1 \\le \\log x < 2$에서 $\\log x$와 $\\log x^{${pVal}}$의 **소수부분이 같을** 조건은 **$(${pVal}-1)\\log x = ${coeff}\\log x = \\text{정수}$**입니다!`;
} else if (mId === 'type4') {
const kVal = [2, 4, 8][Math.floor(Math.random() * 3)];
const dx = Math.log2(kVal);
q.multK = kVal;
problem = `**[🎲 쌍둥이 변형]** $y = 2^x$과 $y = ${kVal}\\cdot 2^x = 2^{x+${dx}}$의 가로 간격 불변량은 **$\\overline{AB} = \\log_2 ${kVal} = ${dx}$**입니다!`;
} else if (mId === 'type5') {
const r = [2, 3][Math.floor(Math.random() * 2)];
q.baseB = 2;
q.baseA = Math.pow(2, r);
problem = `**[🎲 쌍둥이 변형]** 수평선 $y=t$에서 $\\overline{HA} : \\overline{HB} = 1 : ${r}$이면 밑은 역비 거듭제곱으로 **$a = b^{${r}}$** ($\log_b a = ${r}$)입니다!`;
} else if (mId === 'type6') {
const dVal = [1, 1.5, 2][Math.floor(Math.random() * 3)];
q.stepD = dVal;
const ratioR = Math.pow(2, dVal).toFixed(2);
problem = `**[🎲 쌍둥이 변형]** $y = 2^x$ 위의 세 점의 $x$좌표가 공차 $d = ${dVal}$인 등차수열을 이루면, $y$좌표는 공비가 **$r = 2^{${dVal}} = ${ratioR}$**인 등비수열($y_2^2 = y_1 y_3$)을 이룹니다!`;
} else if (mId === 'type7') {
const tVal = [2.0, 2.5, 3.0, 4.25][Math.floor(Math.random() * 4)];
q.lineT = tVal;
problem = `**[🎲 쌍둥이 변형]** $2^x + 2^{-x} = ${tVal}$의 실근은 ${tVal === 2 ? '꼭짓점 $x=0$ **단 1개**' : '$y$축 대칭인 **2개(합 $= 0.000$)**'}입니다!`;
} else if (mId === 'type8') {
const kVal = [3, 4, 5][Math.floor(Math.random() * 3)];
const tVal = [1, 2][Math.floor(Math.random() * 2)];
q.asymK = kVal;
q.lineT = tVal;
const prod = kVal * kVal - tVal * tVal;
problem = `**[🎲 쌍둥이 변형]** $|2^x - ${kVal}| = ${tVal}$의 두 교점 $x_1, x_2$에 대하여 합차공식 불변량으로 **$2^{x_1 + x_2} = ${kVal}^2 - ${tVal}^2 = ${prod}$**입니다!`;
}
    Object.assign(s, mapP(m, q));
    s.twinSnap = mapP(m, q);
    s.twinText = APLab.stripEmoji(problem);
    APLab.toast('새로운 쌍둥이 숫자 변형 문제가 만들어졌습니다');
  }

  /* ---------- 5. 유형별 칠판 그리기 (원본 renderType1~8 그대로, 상태 s 를 인자로 받도록만 바꿈) ---------- */
  // --- EXP 01: n-th Root Real Solutions Matrix ---
function renderType1(ST, si) {
const p = pv(ST, 0);
      const K = (k) => 'type1_' + k;
const n = Math.round(p.n);
const fk = (p.k - p.r1) * (p.k - p.r2);
const yScaled = 0.5 * fk;

drawFunctionCurve(x => 0.5 * (x - p.r1) * (x - p.r2), '#34d399', 2.8);

const rootCx = -4.5;
drawFunctionCurve(x => Math.pow(x - rootCx, n), '#38bdf8', 2.6, [], rootCx - 2.5, rootCx + 2.5);
drawMathSegment(rootCx, -10, rootCx, 10, 'rgba(56, 189, 248, 0.35)', [4, 4], 1.4);

if ((ST.step >= 1)) {
drawMathPoint(p.r1, 0, `r₁=${p.r1}`, '#34d399', 5.5);
drawMathPoint(p.r2, 0, `r₂=${p.r2}`, '#34d399', 5.5);
}

if ((ST.step >= 2)) {
drawMathSegment(-8, yScaled, 9, yScaled, '#fbbf24', [5, 4], 1.8);
const isEven = n % 2 === 0;
if (!isEven) {
drawMathPoint(rootCx + Math.cbrt(yScaled), yScaled, '실근 1개(홀수)', '#fbbf24', 6);
} else if (Math.abs(yScaled) < 1e-3) {
drawMathPoint(rootCx, 0, '중근 1개(0)', '#fbbf24', 6.5);
} else if (yScaled > 0) {
const d = Math.pow(yScaled, 1 / n);
drawMathPoint(rootCx - d, yScaled, '-ⁿ√', '#fbbf24', 6);
drawMathPoint(rootCx + d, yScaled, '+ⁿ√', '#fbbf24', 6);
}
}

drawMathPoint(p.k, yScaled, `P(k=${p.k.toFixed(1)}, f=${fk.toFixed(1)}) [드래그]`, '#fbbf24', 8, true, (mPos) => {
ST[K('k')] = Math.max(0, Math.min(8, Math.round(mPos.x * 5) / 5));
});
}

// --- EXP 02: Natural Number Divisor Matrix Scanner (m, n) ---
function renderType2(ST, si) {
const p = pv(ST, 1);
      const K = (k) => 'type2_' + k;
const M = Math.round(p.maxM);
const N = Math.round(p.maxN);

let totalCnt = 0;
for (let n = 2; n <= N; n++) {
const rowCnt = Math.floor(M / n);
totalCnt += rowCnt;

if ((ST.step >= 2)) {
drawMathSegment(1, n, M, n, 'rgba(56, 189, 248, 0.28)', [], 1.8);
}

for (let m = 1; m <= M; m++) {
const isMult = (m % n === 0);
if (isMult) {
drawMathPoint(m, n, (ST.step >= 1 && B.k >= 24) ? `2^${m/n}` : '', '#fbbf24', 6); // [2.0 수정] 좁은 화면에서는 격자 라벨이 서로 겹쳐 뭉개지므로 생략
} else {
drawMathPoint(m, n, '', 'rgba(148, 163, 184, 0.25)', 3);
}
}

if ((ST.step >= 3)) {
const rPos = mathToScreen(M + 1.8, n);
drawCanvasBadge(ctx, `n=${n}층: ⌊${M}/${n}⌋ = ${rowCnt}개`, rPos.x, rPos.y, '#38bdf8');
}
}

drawMathPoint(M, N, `M=${M}, N=${N} (총 ${totalCnt}개) [드래그]`, '#fbbf24', 8, true, (mPos) => {
ST[K('maxM')] = Math.max(6, Math.min(16, Math.round(mPos.x)));
ST[K('maxN')] = Math.max(3, Math.min(6, Math.round(mPos.y)));
});
}

// --- EXP 03: Common Log Sawtooth Wave {p * log x} ---
function renderType3(ST, si) {
const p = pv(ST, 2);
      const K = (k) => 'type3_' + k;
const P = Math.round(p.multP);
const isSum = Math.round(p.modeSum) === 1;
const coeff = isSum ? P + 1 : P - 1;

// Horizontal axis u = log10(x) in [0, 3], y-axis = fractional part in [0, 1]
// Step 1: Sawtooth of {u}
for (let k = 0; k < 3; k++) {
drawMathSegment(k, 0, k + 0.99, 0.99, 'rgba(52, 211, 153, 0.45)', [4, 3], 2.0);
}

// Step 2: Sawtooth of {(p-1)u} or {1 - p*u} on interval [1, 2)
for (let m = 0; m < 3 * coeff; m++) {
const u1 = m / coeff;
const u2 = (m + 0.98) / coeff;
drawMathSegment(u1, 0, u2, 0.98, '#38bdf8', [], 2.6);
}

// Highlight valid domain 1 <= log x < 2
drawMathSegment(1, -0.3, 1, 1.4, '#fb7185', [4, 4], 2.0);
drawMathSegment(2, -0.3, 2, 1.4, '#fb7185', [4, 4], 2.0);

// Step 3: Solution Points on [1, 2)
if ((ST.step >= 3)) {
for (let m = coeff; m < 2 * coeff; m++) {
const uSol = m / coeff;
const isZeroTrap = (isSum && m === coeff);
drawMathPoint(
uSol,
0,
isZeroTrap ? `✕ α=0 제외!` : `logx=${m}/${coeff}`,
isZeroTrap ? '#fb7185' : '#fbbf24',
7
);
}
}
}

// --- EXP 04: Horizontal Distance Invariant k*2^x = 2^(x + log2(k)) ---
function renderType4(ST, si) {
const p = pv(ST, 3);
      const K = (k) => 'type4_' + k;
const dx = Math.log2(p.multK);

ctx.fillStyle = col('rgba(251, 191, 36, 0.16)');

const x2B = Math.log2(p.yCut2), x2A = x2B - dx;

drawMathPoint(x2B, p.yCut2, `t₂=${p.yCut2.toFixed(1)} [드래그]`, '#fb7185', 7.5, true, (mPos) => {

}

// --- EXP 06: Arithmetic x <-> Geometric y on Exponential Curve ---
function renderType6(ST, si) {
const p = pv(ST, 5);
      const K = (k) => 'type6_' + k;
const x1 = p.xMid - p.stepD;
const x2 = p.xMid;
const x3 = p.xMid + p.stepD;
const y1 = Math.pow(2, x1), y2 = Math.pow(2, x2), y3 = Math.pow(2, x3);

drawFunctionCurve(x => Math.pow(2, x), '#34d399', 2.8, [], -3.5, 4.0);

if ((ST.step >= 1)) {
drawMathSegment(x1, y1, x1, 0, '#38bdf8', [4, 3], 2.0);
drawMathSegment(x2, y2, x2, 0, '#fbbf24', [4, 3], 2.0);
drawMathSegment(x3, y3, x3, 0, '#fb7185', [4, 3], 2.0);
}

if ((ST.step >= 2)) {
drawMathSegment(x1, y1, x3, y3, 'rgba(251, 191, 36, 0.5)', [5, 4], 1.8);
}

drawMathPoint(x1, y1, `A(y₁=${y1.toFixed(2)})`, '#38bdf8', 6);
drawMathPoint(x3, y3, `C(y₃=${y3.toFixed(2)})`, '#fb7185', 6);
drawMathPoint(x2, y2, `B(y₂=${y2.toFixed(2)}) [좌우 드래그]`, '#fbbf24', 8, true, (mPos) => {
ST[K('xMid')] = Math.max(0.5, Math.min(2.5, Math.round(mPos.x * 4) / 4));
});
}

// --- EXP 07: Symmetric Catenary 2^x + 2^(-x) = t >= 2 ---
function renderType7(ST, si) {
const p = pv(ST, 6);
      const K = (k) => 'type7_' + k;

if ((ST.step >= 1)) {
drawFunctionCurve(x => Math.pow(2, x), 'rgba(52, 211, 153, 0.3)', 1.8, [5, 5], -4, 4);
drawFunctionCurve(x => Math.pow(2, -x), 'rgba(56, 189, 248, 0.3)', 1.8, [5, 5], -4, 4);
}

drawFunctionCurve(x => Math.pow(2, x) + Math.pow(2, -x), '#34d399', 3.2, [], -3.2, 3.2);
drawMathSegment(-4, p.lineT, 4, p.lineT, '#fbbf24', [], 2.3);

if (p.lineT > 2.02) { // [2.0 수정] t=2에서는 ±α가 꼭짓점(0, 2)과 겹쳐 라벨이 뭉개지므로 그리지 않음
const u = 0.5 * (p.lineT + Math.sqrt(Math.max(0, p.lineT * p.lineT - 4)));
const alpha = Math.log2(u);
drawMathPoint(-alpha, p.lineT, `-α=${(-alpha).toFixed(2)}`, '#38bdf8', 6.5);
drawMathPoint(alpha, p.lineT, `+α=${alpha.toFixed(2)}`, '#38bdf8', 6.5);
}

drawMathPoint(0, 2, '산술기하 최솟값 (0, 2)', '#fb7185', 6.5, false, null, { dx: 12, dy: 22 });
drawMathPoint(0, p.lineT, `y = t (${p.lineT.toFixed(2)}) [위아래 드래그]`, '#fbbf24', 8, true, (mPos) => {
ST[K('lineT')] = Math.max(1.5, Math.min(5.0, Math.round(mPos.y * 10) / 10));
}, { dx: 0, dy: -24, align: 'center' }); // [2.0 수정] 두 근 라벨(−α, +α)과 겹치지 않게 위로
}

// --- EXP 08: |2^x - k| = t Reflected Asymptote & Product k^2 - t^2 ---
function renderType8(ST, si) {
const p = pv(ST, 7);
      const K = (k) => 'type8_' + k;
const k = p.asymK;
const t = p.lineT;

// Dashed original 2^x - k below x-axis
drawFunctionCurve(x => Math.pow(2, x) - k, 'rgba(52, 211, 153, 0.25)', 1.8, [5, 5], -5, Math.log2(k));

// Reflected Asymptote y = k
if ((ST.step >= 1)) {
drawMathSegment(-5, k, 5, k, '#c084fc', [6, 4], 2.2);
const asymPos = mathToScreen(-2.2, k + 0.5);
drawCanvasBadge(ctx, `접혀 올라온 점근선 y = k = ${k}`, asymPos.x, asymPos.y, '#c084fc');
}

drawFunctionCurve(x => Math.abs(Math.pow(2, x) - k), '#34d399', 3.0, [], -5, 3.5);
drawMathSegment(-5, t, 5, t, '#fbbf24', [], 2.3);

const x2 = Math.log2(k + t);
drawMathPoint(x2, t, `x₂=${x2.toFixed(2)}`, '#34d399', 6.5);

if (t < k) {
const x1 = Math.log2(k - t);
drawMathPoint(x1, t, `x₁=${x1.toFixed(2)}`, '#fb7185', 6.5);
if ((ST.step >= 3)) {
const fPos = mathToScreen((x1 + x2) / 2, t + 1.0);
drawCanvasBadge(ctx, `⚡ 합차공식 불변량: 2^(x₁+x₂) = k² - t² = ${(k*k - t*t).toFixed(2)}`, fPos.x, fPos.y, '#fbbf24');
}
}

drawMathPoint(0, t, `t=${t.toFixed(1)} [드래그]`, '#fbbf24', 8, true, (mPos) => {
ST[K('lineT')] = Math.max(0.5, Math.min(4.5, Math.round(mPos.y * 10) / 10));
});
}

  const RENDER = [renderType1, renderType2, renderType3, renderType4, renderType5, renderType6, renderType7, renderType8];

  function drawScene(b, s, m, j) {
    B = b; ctx = b.ctx; S = s; HID = 0; PILLS.length = 0;
    // [2.0 수정] 눈금 간격 2.5·0.25 는 글자가 한 자리로 반올림되어(2.5→3) 잘못 읽히므로 2.5 단계를 뺀 간격을 직접 줍니다.
    const nice = (raw) => { const p = Math.pow(10, Math.floor(Math.log10(raw))); const f = raw / p; return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 5 ? 5 : 10) * p; };
    if (s.grid) b.grid({ step: nice(34 / b.k) });
    b.axes({ tickStep: nice(46 / b.k) });
    if (s.mut_dots) { // 원본 '격자점 스캐너'
      const vb = b.viewBox();
      ctx.save();
      ctx.fillStyle = col('rgba(192, 132, 252, 0.42)');
      for (let x = Math.floor(vb.x0) - 1; x <= Math.ceil(vb.x1) + 1; x++) {
        for (let y = Math.floor(vb.y0) - 1; y <= Math.ceil(vb.y1) + 1; y++) {
          const pt = mathToScreen(x, y);
          ctx.beginPath();
          ctx.arc(pt.x, pt.y, 2.3, 0, Math.PI * 2);
          ctx.fill();
        }
      }
      ctx.restore();
    }
    RENDER[m](s, j);
    flushPills();
  }

  /* ---------- 6. 장면 ---------- */
  const READ_COLORS = ['amber', 'sky', 'green', 'violet'];
  const MUTATORS = [
    { id: 'symY', key: 'mut_symY', icon: 'split', label: 'y축 대칭 곡선(a⁻ˣ)' },
    { id: 'abs', key: 'mut_abs', icon: 'spark', label: '|f(x)| 절댓값 반전' },
    { id: 'dots', key: 'mut_dots', icon: 'grid', label: '정수 격자 도트' }
  ];

  function sceneOf(m, j) {
    const md = KILLER_MODES[m];
    const sc = md.scenarios[j];
    return {
      id: 't' + (m + 1) + 'ab'[j],
      title: sc.chip,
      short: '기출 ' + 'AB'[j],
      question: QUESTIONS[m],
      guide: GUIDES[m],
      startStep: 2,
      notesTitle: '오답 함정 주의보',
      focus: FOCUS[m],
      enter: (s) => { Object.assign(s, mapP(m, sc.params)); s.twinText = null; s.twinSnap = null; },
      controls: (SLIDERS[md.id] || []).map((d) => pk(m, d.key)),
      actions: () => [
        ...MUTATORS.map((a) => ({ id: a.id, icon: a.icon, label: a.label, on: (s) => !!s[a.key], run: (s) => { s[a.key] = !s[a.key]; } })),
        { id: 'twin', icon: 'wand', label: '쌍둥이 숫자 변형', primary: true, run: (s) => twin(s, m) }
      ],
      steps: md.stepDescs.map((d, i) => stepText(md.stepLabels[i] + ': ' + d.replace(/^Step\s*\d+\s*:\s*/, ''))),
      problem: {
        tag: sc.source,
        text: (s) => rich(s.twinText || sc.problem),
        answer: (s) => (s.twinText ? '변형 문제의 결과는 위 문장에 적혀 있습니다. 칠판에서 확인해 보세요.' : safe(ANSWERS[m][j])),
        snap: (s) => s.twinSnap || mapP(m, sc.snapParams)
      },
      solution: {
        standardTitle: sc.textbookTitle, standardTag: '교과서 정석',
        quickTitle: sc.secretTitle, quickTag: '10초 컷 비기',
        standard: { steps: lines(sc.textbookSteps) },
        quick: { steps: lines(sc.secretSteps) }
      },
      view: (s) => {
        const { formula, cards } = hudOf(s, m);
        return {
          formula: safe(formula),
          readouts: cards.map((c, i) => ({ label: c.title, value: String(c.val), note: c.sub, color: READ_COLORS[i % 4] })),
          notes: rich(md.trapWarning)
        };
      },
      draw: (b, s) => drawScene(b, s, m, j)
    };
  }

  const groups = KILLER_MODES.map((md, m) => ({
    id: md.id,
    title: md.code + ' · ' + md.shortTitle,
    short: md.shortTitle,
    scenes: md.scenarios.map((_, j) => sceneOf(m, j))
  }));

  /* ---------- 7. 실험실 등록 ---------- */
  APLab.createLab({
    id: 'alg-exp-deep',
    title: '거듭제곱근·상용로그·지수함수',
    courseName: '대수',
    unit: 'Ⅰ. 지수함수와 로그함수',
    courseColor: 'var(--m-amber)',
    home: '../index.html#algebra',
    legacy: '../../labs/대수/part1a2.html',
    board: { kind: 'cartesian', focus: FOCUS[0] },
    params,
    state: { mut_symY: false, mut_abs: false, mut_dots: false, twinText: null, twinSnap: null },
    persist: ['mut_symY', 'mut_abs', 'mut_dots'],
    groups
  });
});
