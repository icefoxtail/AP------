  /* ---------- 매개변수: 유형마다 'typeN_키' 로 구분해 셸의 슬라이더에 연결 ---------- */
  const MID = (m) => KILLER_MODES[m].id;

  const pk = (m, k) => MID(m) + '_' + k;

  const mapP = (m, obj) => { const o = {}; for (const k in obj) o[pk(m, k)] = obj[k]; return o; };

  /* ---------- 글자 다듬기: 원본 formatRichMath 의 ** 굵게 + 수식 안 부등호(<, >) 보호 ---------- */
  const safe = (t) => String(t == null ? '' : t).replace(/\$\$([^$]+)\$\$|\$([^$]+)\$/g, (m0, a, b) => {
    const body = (a != null ? a : b).replace(/</g, '\\lt ').replace(/>/g, '\\gt ');
    return a != null ? '$$' + body + '$$' : '$' + body + '$';
  });
  const rich = (t) => safe(String(t == null ? '' : t).replace(/\*\*([\s\S]+?)\*\*/g, '<strong>$1</strong>'));
  const lines = (arr) => arr.map((t) => rich(APLab.cleanLead(t))).join('<br/>');
  // 단계 문구는 셸이 HTML 이스케이프 후 수식으로 바꾸므로 수식 안의 ' 도 미리 바꿔 둡니다.
  const stepText = (t) => safe(String(t).replace(/\*\*/g, '')).replace(/\$([^$]+)\$/g, (m0, b) => '$' + b.replace(/'/g, '^{\\prime}') + '$');

  /* ---------- 2. 원본 그리기 도우미 → 공용 무대(APLab.Board) 연결층 ---------- */
  const mathToScreen = (x, y) => B.toS(x, y);
  const dashOf = (d) => (d && d.length ? d : null);
  const stageBox = () => { const i = B.insets; return { x0: i.left + 6, x1: B.W - i.right - 6, y0: i.top + 6, y1: B.H - i.bottom - 6 }; };
  const cleanLabel = (l) => String(l || '').replace(/\[드래그\s+(k=[^\]]+)\]/g, '$1').replace(/\s*\[[^\]]*드래그[^\]]*\]/g, '');

  function drawFunctionCurve(fn, color = '#34d399', lineWidth = 2.6, dash = [], xStart = null, xEnd = null) {
    const g = (x) => {
      let y = fn(x);
      // 원래 곡선·점은 보존하고 절댓값 곡선은 비교용으로 겹쳐 그립니다.
      return (isNaN(y) || !isFinite(y) || Math.abs(y) > 60) ? NaN : y;
    };
    B.plot(g, { color, width: lineWidth, dash: dashOf(dash), glow: dash.length === 0, from: xStart, to: xEnd });
    if (S.mut_abs) B.plot((x) => Math.abs(g(x)), { color: 'violet', width: 1.8, dash: [4, 4], from: xStart, to: xEnd });
    if (S.mut_symY) { // 원본 'y축 대칭 곡선' 겹쳐 그리기
      const gs = (x) => { const y = fn(-x); return (isNaN(y) || !isFinite(y) || Math.abs(y) > 60) ? NaN : y; };
      B.plot(gs, { color: 'rgba(251, 191, 36, 0.45)', width: lineWidth, dash: [4, 4], from: xStart, to: xEnd });
    }
  }
  function drawMathLine(slope, intercept, color = '#fbbf24', dash = [], width = 2) {
    B.line([0, intercept], slope, { color, width, dash: dashOf(dash) });
  }
  function drawMathSegment(x1, y1, x2, y2, color = '#fbbf24', dash = [], width = 2.2) {
    B.seg([x1, y1], [x2, y2], { color, width, dash: dashOf(dash) });
  }
  function drawMathPoint(x, y, label = '', color = '#fbbf24', radius = 6, isDraggable = false, onDrag = null, off = null) {
    const o = { color, r: radius };
    const lb = cleanLabel(label);
    if (lb) o.label = lb;
    if (off) Object.assign(o, off); // 라벨 위치 조정(dx, dy, align) — 겹침 방지용
    if (isDraggable) B.handle('h' + HID++, [x, y], { ...o, drag: (w) => onDrag(w) });
    else B.point([x, y], o);
  }
  // 알약 모양 설명 상자: 무대 안으로 밀어 넣고, 길면 두 줄/작은 글씨로 줄입니다(휴대폰에서 잘리지 않게).
  // 폭이 좁은 화면에서는 긴 알약을 그림 위에 겹쳐 놓지 않고 무대 위쪽에 차례로 쌓습니다(가려짐 방지).
  const PILLS = [];
  function pillBox(c, color, cx, cy, tw, bh) {
    const bx = stageBox();
    const x = clamp(cx, bx.x0 + tw / 2, Math.max(bx.x0 + tw / 2, bx.x1 - tw / 2));
    const y = clamp(cy, bx.y0 + bh / 2, Math.max(bx.y0 + bh / 2, bx.y1 - bh / 2));
    c.fillStyle = B.color('halo', 0.9);
    c.strokeStyle = B.color(color, 0.85);
    c.lineWidth = 1.4;
    c.beginPath();
    c.roundRect(x - tw / 2, y - bh / 2, tw, bh, 7);
    c.fill();
    c.stroke();
    return { x, y };
  }
  function emitPill(sp, x, y) {
    if (B.W < 600 && sp.tw > 110) PILLS.push(sp);
    else sp.paint(x, y);
  }
  function flushPills() {
    const bx = stageBox();
    let y = bx.y0;
    PILLS.forEach((sp) => { sp.paint((bx.x0 + bx.x1) / 2, y + sp.bh / 2); y += sp.bh + 5; });
    PILLS.length = 0;
  }
  function drawCanvasBadge(_c, text, x, y, color = '#34d399') {
    const c = B.ctx;
    const maxW = Math.max(120, stageBox().x1 - stageBox().x0);
    c.save();
    let fs = 12.5 * B.fs;
    const font = () => { c.font = `800 ${fs}px ${B.font}`; };
    font();
    let ls = [String(text)];
    let tw = c.measureText(ls[0]).width + 16;
    if (tw > maxW) { // 가운데에 가장 가까운 띄어쓰기에서 두 줄로
      const t = ls[0];
      let cut = -1;
      for (let i = 0; i < t.length; i++) if (t[i] === ' ' && (cut < 0 || Math.abs(i - t.length / 2) < Math.abs(cut - t.length / 2))) cut = i;
      if (cut > 0) ls = [t.slice(0, cut), t.slice(cut + 1)];
      tw = Math.max(...ls.map((l) => c.measureText(l).width)) + 16;
      if (tw > maxW) { fs = Math.max(9.5, (fs * maxW) / tw); font(); tw = Math.max(...ls.map((l) => c.measureText(l).width)) + 16; }
    }
    const lh = fs * 1.28;
    const bh = ls.length * lh + 8;
    const f = fs;
    c.restore();
    emitPill({
      tw, bh,
      paint: (px, py) => {
        c.save();
        c.setLineDash([]);
        c.shadowBlur = 0;
        c.font = `800 ${f}px ${B.font}`;
        const p = pillBox(c, color, px, py, tw, bh);
        c.fillStyle = B.color(color);
        c.textAlign = 'center';
        c.textBaseline = 'middle';
        ls.forEach((l, i) => c.fillText(l, p.x, p.y - bh / 2 + 4 + lh * (i + 0.5)));
        c.restore();
      }
    }, x, y);
  }
  // 세로 분수 알약: 앞글(prefix) + 분자/분모 + 뒷글(suffix)
  function drawCanvasFraction(_c, numStr, denStr, x, y, options = {}) {
    const { color = '#fbbf24', fontSize = 14, prefix = '', suffix = '' } = options;
    const c = B.ctx;
    const maxW = Math.max(140, stageBox().x1 - stageBox().x0);
    c.save();
    let fs = fontSize * B.fs;
    let preW, sufW, fracW, totalW;
    const meas = () => {
      c.font = `800 ${fs}px ${B.font}`;
      preW = prefix ? c.measureText(prefix).width + 4 : 0;
      sufW = suffix ? c.measureText(suffix).width + 4 : 0;
      fracW = Math.max(c.measureText(numStr).width, c.measureText(denStr).width) + 10;
      totalW = preW + fracW + sufW + 16;
    };
    meas();
    if (totalW > maxW) { fs = Math.max(9.5, (fs * maxW) / totalW); meas(); }
    const totalH = fs * 2.5;
    const f = fs, pw = preW, fw = fracW, tw = totalW;
    c.restore();
    emitPill({
      tw, bh: totalH,
      paint: (px, py) => {
        c.save();
        c.setLineDash([]);
        c.shadowBlur = 0;
        c.font = `800 ${f}px ${B.font}`;
        const p = pillBox(c, color, px, py, tw, totalH);
        c.fillStyle = B.color(color);
        c.textBaseline = 'middle';
        let curX = p.x - tw / 2 + 8;
        if (prefix) { c.textAlign = 'left'; c.fillText(prefix, curX, p.y); curX += pw; }
        const cf = curX + fw / 2;
        c.textAlign = 'center';
        c.fillText(numStr, cf, p.y - f * 0.58);
        c.fillText(denStr, cf, p.y + f * 0.62);
        c.strokeStyle = B.color(color);
        c.lineWidth = 1.6;
        c.beginPath();
        c.moveTo(cf - fw / 2 + 2, p.y);
        c.lineTo(cf + fw / 2 - 2, p.y);
        c.stroke();
        curX += fw;
        if (suffix) { c.textAlign = 'left'; c.fillText(suffix, curX + 4, p.y); }
        c.restore();
      }
    }, x, y);
  }

  /* ---------- 3. 실시간 값 (원본 updateLiveHUDAndInvariants 의 계산 그대로) ---------- */
  function expAbsHeight(t) {
    // 정확한 제곱근으로 초기화한 높이는 반올림한 소수로 등식에 대입하지 않습니다.
    const n = Math.round(t * t);
    const root = t >= 0 && !Number.isInteger(t) && t === Math.sqrt(n);
    return { plain: root ? `√${n}` : String(t), tex: root ? `\\sqrt{${n}}` : String(t), square: root ? n : Number.isInteger(t) ? t * t : null };
  }
  function hudOf(s, m) {
const mode = KILLER_MODES[m];
const mId = mode.id;
const p = pv(s, m);
  let hudEq = '';

let cards = [];

if (mId === 'type1') {
const fk = (p.k - p.r1) * (p.k - p.r2);
const n = Math.round(p.n);
const isEven = n % 2 === 0;
const cnt = !isEven ? 1 : (Math.abs(fk) < 1e-4 ? 1 : (fk > 0 ? 2 : 0));
hudEq = (
`$f(k) = (${p.k.toFixed(2)}-${p.r1})(${p.k.toFixed(2)}-${p.r2}) = ${fk.toFixed(2)}, \\quad x^{${n}} = f(k) \\implies \\text{실근 } ${cnt}\\text{개}$`
);
cards = [
{ title: `실근 개수 g(k, ${n})`, val: `${cnt}개`, sub: isEven ? 'n이 짝수: f(k)의 부호에 따라 달라짐' : 'n이 홀수: 항상 1개' },
{ title: '홀수 제곱근의 실근의 개수', val: '1개', sub: 'f(k)에 관계없이 항상 1개' },
{ title: 'f(k) < 0인 자연수 k의 개수', val: `${p.r2 - p.r1 - 1}개`, sub: `${p.r1} < k < ${p.r2}` },
{ title: 'f(k) < 0인 자연수 k의 합', val: `${((p.r1 + p.r2) / 2) * (p.r2 - p.r1 - 1)}`, sub: '(가운데 값) × (개수)' }
];
} else if (mId === 'type2') {
const M = Math.round(p.maxM);
const N = Math.round(p.maxN);
let total = 0;
const list = [];
for (let n = 2; n <= N; n++) {
const c = Math.floor(M / n);
total += c;
list.push(c);
}
hudEq = (
`$\\sqrt[n]{2^m} = 2^{\\frac{m}{n}} \\in \\mathbb{N} \\iff n \\mid m \\implies \\sum_{n=2}^{${N}} \\left\\lfloor \\frac{${M}}{n} \\right\\rfloor = ${list.join('+')} = ${total}\\text{개}$`
);
cards = [
{ title: '자연수 조건 총 순서쌍', val: `${total}개`, sub: `몫의 합: ${list.join(' + ')}` },
{ title: '몫의 합 − 직접 센 개수', val: '0', sub: '두 방법으로 센 결과가 같음' },
{ title: 'n = 2일 때 배수 개수', val: `${Math.floor(M / 2)}개`, sub: `⌊${M} / 2⌋ (m은 2의 배수)` },
{ title: 'n = 3일 때 배수 개수', val: `${Math.floor(M / 3)}개`, sub: `⌊${M} / 3⌋ (m은 3의 배수)` }
];
} else if (mId === 'type3') {
const P = Math.round(p.multP);
const isSum = Math.round(p.modeSum) === 1;
const coeff = isSum ? P + 1 : P - 1;
// For 1 <= log x < 2, coeff * log x is in [coeff, 2*coeff)
const sols = [];
for (let m = coeff; m < 2 * coeff; m++) {
if (isSum && m === coeff) continue; // exclude log x = 1 where fractional part is 0!
sols.push(`${m}/${coeff}`);
}
hudEq = (
isSum
? `$\\{\\log x\\} + \\{${P}\\log x\\} = 1 \\iff ${coeff}\\log x \\in \\mathbb{Z} \\;(\\alpha\\neq 0) \\implies \\log x \\in \\left\\{${sols.join(', ')}\\right\\}$`
: `$\\{\\log x\\} = \\{${P}\\log x\\} \\iff ${coeff}\\log x \\in \\mathbb{Z} \\implies \\log x \\in \\left\\{${sols.join(', ')}\\right\\}$`
);
cards = [
{ title: isSum ? '소수부분의 합이 1인 x의 개수' : '소수부분이 같은 x의 개수', val: `${sols.length}개`, sub: isSum ? `소수부분이 0인 경우(log x가 정수) 1개 제외` : `소수부분이 0인 경우 포함 (${coeff}개)` },
{ title: '조건을 만족시키는 log x의 값', val: sols.join(', '), sub: `간격 1 / ${coeff}` },
{ title: '정수가 되는 log x의 계수', val: `${coeff}배`, sub: isSum ? `p + 1 = ${P} + 1` : `p - 1 = ${P} - 1` },
{ title: '조건 확인 (소수부분의 차, 합일 때는 합 − 1)', val: '0.000', sub: '해에서 조건이 성립함' }
];
} else if (mId === 'type4') {
const dx = Math.log2(p.multK);
const dy = p.yCut2 - p.yCut1;
const area = dx * dy;
hudEq = (
`$y = ${p.multK.toFixed(2)}\\cdot 2^x = 2^{x + \\log_2 ${p.multK.toFixed(2)}} \\implies \\text{가로 선분 } \\overline{AB} = \\log_2 ${p.multK.toFixed(2)} \\approx ${dx.toFixed(3)}$`
);
cards = [
{ title: '가로 선분 길이 AB', val: dx.toFixed(3), sub: `log₂(${p.multK.toFixed(2)})로 일정` },
{ title: '두 높이에서 가로 선분 길이의 차', val: '0.000', sub: `y=${p.yCut1}과 y=${p.yCut2}에서 같음` },
{ title: '직사각형으로 바꾼 넓이 S', val: area.toFixed(3), sub: `가로(${dx.toFixed(2)}) × 세로(${dy.toFixed(2)})` },
{ title: '계수 k를 평행이동으로 나타내기', val: `x축 -${dx.toFixed(2)}`, sub: '곱셈 k → 지수의 덧셈 x + log₂k' }
];
} else if (mId === 'type5') {
const xA = Math.log(p.lineT) / Math.log(p.baseA);
const xB = Math.log(p.lineT) / Math.log(p.baseB);
const ratio = xB / xA; // = log_b(a)
hudEq = (
`$y = ${p.baseA.toFixed(2)}^x, \\; y = ${p.baseB.toFixed(2)}^x \\cap (y = ${p.lineT.toFixed(2)}) \\implies \\frac{\\overline{HB}}{\\overline{HA}} = \\log_b a \\approx ${ratio.toFixed(3)}$`
);
cards = [
{ title: '가로 길이 비 $\\frac{HB}{HA}$', val: ratio.toFixed(3), sub: `높이 t=${p.lineT.toFixed(2)}와 관계없음` },
{ title: '로그 log_b(a)의 값', val: (Math.log(p.baseA) / Math.log(p.baseB)).toFixed(3), sub: '$\\frac{HB}{HA}$와 같음' },
{ title: '점 A / 점 B의 x좌표', val: `${xA.toFixed(2)}, ${xB.toFixed(2)}`, sub: `log_a(t), log_b(t)` },
{ title: '두 밑의 관계', val: `a = b^(${ratio.toFixed(2)})`, sub: '$a=b^{\\frac{HB}{HA}}$' }
];
} else if (mId === 'type6') {
const x1 = p.xMid - p.stepD;
const x2 = p.xMid;
const x3 = p.xMid + p.stepD;
const y1 = Math.pow(2, x1), y2 = Math.pow(2, x2), y3 = Math.pow(2, x3);
const r = Math.pow(2, p.stepD);
const heightSign = [y1,y2,y3].every(y=>Number(y.toFixed(2))===y) ? '=' : '\\approx';
const ratioSign = Number(r.toFixed(2))===r ? '=' : '\\approx';
hudEq = (
`$x = (${x1.toFixed(2)}, ${x2.toFixed(2)}, ${x3.toFixed(2)}) \\text{ [등차]} \\implies y ${heightSign} (${y1.toFixed(2)}, ${y2.toFixed(2)}, ${y3.toFixed(2)}) \\text{ [등비, } r=2^d${ratioSign}${r.toFixed(2)}\\text{]}$`
);
cards = [
{ title: '가운데 함숫값 제곱 y₂²', val: (y2 * y2).toFixed(3), sub: `y₂ = ${y2.toFixed(3)}` },
{ title: '양끝 함숫값 곱 y₁ · y₃', val: (y1 * y3).toFixed(3), sub: 'y₂² = y₁y₃ (등비중항)' },
{ title: 'y좌표 공비 r (= 2^d)', val: r.toFixed(3), sub: `x 공차 d = ${p.stepD.toFixed(2)}` },
{ title: '세 함숫값의 합 y₁+y₂+y₃', val: (y1 + y2 + y3).toFixed(2), sub: `$y_2(\\frac{1}{r}+1+r)$과 같음` }
];
} else if (mId === 'type7') {
const t = p.lineT;
const cnt = t > 2+1e-10 ? 2 : (Math.abs(t - 2) <= 1e-10 ? 1 : 0);
const sqVal = t * t - 2;
hudEq = (
 cnt === 0 ? `$2^x+2^{-x}\\ge2>${t.toFixed(2)}\\text{ 이므로 실근 없음}$` :
`$2^x + 2^{-x} = ${t.toFixed(2)} \\implies \\text{실근 } ${cnt}\\text{개 (합 } 0\\text{)}, \\quad 4^x + 4^{-x} = t^2 - 2 = ${sqVal.toFixed(2)}$`
);
cards = [
{ title: '실근 x의 개수', val: `${cnt}개`, sub: t > 2 ? '±α 대칭 2개' : (Math.abs(t-2)<0.01 ? '꼭짓점 x=0 하나뿐' : 't < 2 해 없음') },
{ title: '모든 실근 x의 합', val: cnt ? '0' : '해 없음', sub: cnt ? '두 근은 ±α, t=2에서는 x=0 하나' : '실근이 없으므로 근의 관계식을 적용하지 않음' },
{ title: '제곱식 4^x + 4^(-x) 값', val: cnt ? sqVal.toFixed(2) : '해 없음', sub: '실제로 2ˣ+2⁻ˣ=t인 x가 있을 때 t²−2'  },
{ title: '2ˣ + 2⁻ˣ의 최솟값', val: '2.000', sub: 'x = 0에서 등호 성립' }
];
} else if (mId === 'type8') {
const k = p.asymK;
const t = p.lineT;
const hasTwo = t > 0 && t < k;
const height = expAbsHeight(t);
const exactProduct = Number.isInteger(k * 2) && height.square !== null;
const prod2 = k * k - (height.square === null ? t * t : height.square);
const productTex = exactProduct ? `= ${prod2}` : `\\approx ${prod2.toFixed(3)}`;
const sumX = hasTwo ? Math.log2(prod2) : NaN;

hudEq = (
hasTwo
? `$|2^x - ${k}| = ${height.tex} \\implies 2^{x_1+x_2} = k^2 - t^2 = ${k}^2 - \\left(${height.tex}\\right)^2 ${productTex}, \\; x_1+x_2 ${exactProduct && prod2 === 1 ? '=0' : `\\approx ${sumX.toFixed(3)}`}$`
: `$|2^x - ${k}| = ${height.tex} \\implies \\text{${t===0?"꼭짓점에서":"점근선 높이 이상에서"} 교점 1개}$`
);
cards = [
{ title: '교점 개수', val: hasTwo ? '2개 (0 < t < k)' : t===0 ? '1개 (t = 0)' : '1개 (t ≥ k)', sub: `점근선 y = k = ${k}` },
{ title: '지수 곱 2^(x₁+x₂)', val: hasTwo ? exactProduct ? String(prod2) : `≈ ${prod2.toFixed(3)}` : '단일근', sub: 'k² − t²과 같음' },
{ title: '두 실근의 합 x₁ + x₂', val: hasTwo ? exactProduct && prod2 === 1 ? '0' : `≈ ${sumX.toFixed(3)}` : '단일근', sub: hasTwo ? 'log₂(k²−t²)' : '-' },
{ title: '(k−t)(k+t) − (k²−t²)의 값', val: '0', sub: '곱셈 공식' }
];
}

return { formula: hudEq, cards };
}

  /* ---------- 4. 쌍둥이 숫자 변형 (원본 triggerTwinProblem 의 값 생성 그대로) ---------- */
  function twin(s, m) {
    const mId = MID(m);
    const q = pv(s, m);
    let problem = '';
    


if (mId === 'type1') {
const pairs = [[1, 5], [2, 8], [3, 9]];
const pick = pairs[Math.floor(Math.random() * pairs.length)];
q.r1 = pick[0];
q.r2 = pick[1];
q.k = (pick[0] + pick[1]) / 2;
const cnt = pick[1] - pick[0] - 1;
const sumK = q.k * cnt;
problem = `**[숫자를 바꾼 문제]** $f(x) = (x-${pick[0]})(x-${pick[1]})$에서 짝수 제곱근의 실근이 $0$개인 자연수 $k$는 총 $${cnt}$개이며, 그 합은 (가운데 값)×(개수)이므로 $${q.k} \\times ${cnt} = ${sumK}$입니다.`;
} else if (mId === 'type2') {
const mVal = [10, 12, 14, 16][Math.floor(Math.random() * 4)];
const nVal = [4, 5, 6][Math.floor(Math.random() * 3)];
q.maxM = mVal;
q.maxN = nVal;
let tot = 0;
for (let n = 2; n <= nVal; n++) tot += Math.floor(mVal / n);
problem = `**[숫자를 바꾼 문제]** $1 \\le m \\le ${mVal},\\; 2 \\le n \\le ${nVal}$에서 $\\sqrt[n]{2^m}$이 자연수가 되는 순서쌍 $(m, n)$의 총개수는 $n$마다 $${mVal}$을 $n$으로 나눈 몫을 더하여 **${tot}개**입니다.`;
} else if (mId === 'type3') {
const pVal = [2, 3, 4][Math.floor(Math.random() * 3)];
const isSum = Math.random() < 0.5 ? 0 : 1;
q.multP = pVal;
q.modeSum = isSum;
const coeff = isSum ? pVal + 1 : pVal - 1;
problem = isSum
? `**[숫자를 바꾼 문제]** $1 < \\log x < 2$에서 $\\log x$와 $\\log x^{${pVal}}$의 **소수부분의 합이 $1$**일 조건은 **$(1+${pVal})\\log x = ${coeff}\\log x = \\text{정수}$**입니다.`
: `**[숫자를 바꾼 문제]** $1 \\le \\log x < 2$에서 $\\log x$와 $\\log x^{${pVal}}$의 **소수부분이 같을** 조건은 **$(${pVal}-1)\\log x = ${coeff}\\log x = \\text{정수}$**입니다.`;
} else if (mId === 'type4') {
const kVal = [2, 4, 8][Math.floor(Math.random() * 3)];
const dx = Math.log2(kVal);
q.multK = kVal;
problem = `**[숫자를 바꾼 문제]** $y = 2^x$과 $y = ${kVal}\\cdot 2^x = 2^{x+${dx}}$의 가로 간격은 높이에 관계없이 일정하며 **$\\overline{AB} = \\log_2 ${kVal} = ${dx}$**입니다.`;
} else if (mId === 'type5') {
const r = [2, 3][Math.floor(Math.random() * 2)];
q.baseB = 2;
q.baseA = Math.pow(2, r);
problem = `**[숫자를 바꾼 문제]** 수평선 $y=t$에서 $\\overline{HA} : \\overline{HB} = 1 : ${r}$이면 **$a = b^{${r}}$** ($\\log_b a = ${r}$)입니다.`;
} else if (mId === 'type6') {
const dVal = [1, 1.5, 2][Math.floor(Math.random() * 3)];
q.stepD = dVal;
const ratioR = Math.pow(2, dVal);
const ratioText = Number.isInteger(ratioR) ? '= '+ratioR : '\\approx '+ratioR.toFixed(2);
problem = `**[숫자를 바꾼 문제]** $y = 2^x$ 위의 세 점의 $x$좌표가 공차 $d = ${dVal}$인 등차수열을 이루면, $y$좌표는 공비가 **$r = 2^{${dVal}} ${ratioText}$**인 등비수열($y_2^2 = y_1 y_3$)을 이룹니다.`;
} else if (mId === 'type7') {
const tVal = [2.0, 2.5, 3.0, 4.25][Math.floor(Math.random() * 4)];
q.lineT = tVal;
problem = `**[숫자를 바꾼 문제]** $2^x + 2^{-x} = ${tVal}$의 실근은 ${tVal === 2 ? '$x=0$ **하나뿐**' : '$y$축에 대하여 대칭인 **2개(합 $= 0$)**'}입니다.`;
} else if (mId === 'type8') {
const kVal = [3, 4, 5][Math.floor(Math.random() * 3)];
const tVal = [1, 2][Math.floor(Math.random() * 2)];
q.asymK = kVal;
q.lineT = tVal;
const prod = kVal * kVal - tVal * tVal;
problem = `**[숫자를 바꾼 문제]** $|2^x - ${kVal}| = ${tVal}$의 두 교점 $x_1, x_2$에 대하여 **$2^{x_1 + x_2} = ${kVal}^2 - ${tVal}^2 = ${prod}$**입니다.`;
}
    Object.assign(s, mapP(m, q));
    s.twinSnap = mapP(m, q);
    s.twinText = APLab.stripEmoji(problem);
    APLab.toast('숫자를 바꾼 새 문제가 만들어졌습니다');
  }

  /* ---------- 5. 유형별 칠판 그리기 (원본 renderType1~8 그대로, 상태 s 를 인자로 받도록만 바꿈) ---------- */
  // --- EXP 01: n-th Root Real Solutions Matrix ---
function renderType1(ST, si) {
const p = pv(ST, 0);
      const K = (k) => 'type1_' + k;
const n = Math.round(p.n);
const fk = (p.k - p.r1) * (p.k - p.r2);
const yScaled = fk; // 실제 함수값과 수평선 높이를 같은 좌표계에 표시

drawFunctionCurve(x => (x - p.r1) * (x - p.r2), '#34d399', 2.8);

const rootCx = -4.5;
B.text([rootCx, 0], 'u = 0', { color: 'sky', size: 11, align: 'center', dy: 31 });
B.stext(B.toS(rootCx, 0).x, B.insets.top + 8, 'y = uⁿ  (u = x + 4.5)', { color: 'sky', size: 11, align: 'center', baseline: 'top' });
drawFunctionCurve(x => Math.pow(x - rootCx, n), '#38bdf8', 2.6, [], rootCx - 2.5, rootCx + 2.5);
drawMathSegment(rootCx, -10, rootCx, 10, 'rgba(56, 189, 248, 0.35)', [4, 4], 1.4);

if ((ST.step >= 1)) {
drawMathPoint(p.r1, 0, `r₁=${p.r1}`, '#34d399', 5.5);
drawMathPoint(p.r2, 0, `r₂=${p.r2}`, '#34d399', 5.5);
}

if ((ST.step >= 2)) {
drawMathSegment(-8, yScaled, 9, yScaled, '#fbbf24', [5, 4], 1.8);
const isEven = n % 2 === 0;
if (!isEven) {
drawMathPoint(rootCx + Math.sign(yScaled) * Math.pow(Math.abs(yScaled), 1 / n), yScaled, '실근 1개(홀수)', '#fbbf24', 6);
} else if (Math.abs(yScaled) < 1e-3) {
drawMathPoint(rootCx, 0, '중근 1개(0)', '#fbbf24', 6.5);
} else if (yScaled > 0) {
const d = Math.pow(yScaled, 1 / n);
drawMathPoint(rootCx - d, yScaled, '-ⁿ√', '#fbbf24', 6);
drawMathPoint(rootCx + d, yScaled, '+ⁿ√', '#fbbf24', 6);
}
}

drawMathPoint(p.k, yScaled, `P(k=${p.k.toFixed(2)}, f≈${fk.toFixed(2)}) [드래그]`, '#fbbf24', 8, true, (mPos) => {
ST[K('k')] = Math.max(0, Math.min(8, Math.round(mPos.x * 5) / 5));

// --- EXP 03: Common Log Sawtooth Wave {p * log x} ---
function renderType3(ST, si) {
  const p=pv(ST,2), P=Math.round(p.multP), sum=Math.round(p.modeSum)===1, c=sum?P+1:P-1;
  const ar=B._area();
  B.stext(ar.x+10,ar.y+8,'{u}',{color:'green',size:12.5,weight:800,align:'left',baseline:'top'});

  B.stext(ar.x+ar.w-10,ar.y+8,'1 ≤ u < 2',{color:'muted',size:12.5,weight:800,align:'right',baseline:'top'});
  const saw=(k,color,complement=false)=>{
    for(let j=0;j<3*k;j++){
      const a=j/k,z=(j+1)/k, y0=complement?1:0,y1=complement?0:1;
      B.seg([a,y0],[z,y1],{color,width:2.2});
      B.point([a,y0],{color,r:3,glow:false}); B.point([z,y1],{color,r:3,hollow:true,glow:false});
    }

  [1,2].forEach(u=>B.seg([u,-.2],[u,1.15],{color:'rose',dash:[4,4],width:1.5}));

  if(ST.step>=3) for(let m=c;m<2*c;m++){
    const u=m/c;

    B.point([u,u-1],{color:'amber',r:6,label:OV.fr(m,c).replace(/\\frac\{(\d+)\}\{(\d+)\}/,'$1/$2'),dx:8,dy:-14});

}

// --- EXP 04: Horizontal Distance Invariant k*2^x = 2^(x + log2(k)) ---
function renderType4(ST, si) {
const p = pv(ST, 3);
      const K = (k) => 'type4_' + k;
const dx = Math.log2(p.multK);
const fn1 = x => Math.pow(2, x);
const fn2 = x => p.multK * Math.pow(2, x);

if ((ST.step >= 3)) {
ctx.save();
ctx.fillStyle = col('rgba(251, 191, 36, 0.16)');
ctx.beginPath();
for (let y = p.yCut1; y <= p.yCut2; y += 0.1) {
const x = Math.log2(y) - dx;
const pt = mathToScreen(x, y);
if (y === p.yCut1) ctx.moveTo(pt.x, pt.y);
else ctx.lineTo(pt.x, pt.y);
}
for (let y = p.yCut2; y >= p.yCut1; y -= 0.1) {
const x = Math.log2(y);
const pt = mathToScreen(x, y);
ctx.lineTo(pt.x, pt.y);
}
ctx.closePath();
ctx.fill();
ctx.restore();
}

drawFunctionCurve(fn1, '#34d399', 2.8, [], -4, 4.0);
drawFunctionCurve(fn2, '#38bdf8', 2.8, [], -5, 3.5);

const x1B = Math.log2(p.yCut1), x1A = x1B - dx;

  /* ======================================================================
     6a. 「새 문제」 변형 (옛 장면 살리기, 2026-11-02)
     - 탐구 탭(그림·조작·문구)은 그대로입니다. 문제 탭과 정리 탭만 장면마다 변형 생성기(OV)를 받습니다.
     - 변형 0번은 지금 문제 그대로(문장·정답·풀이는 원본 문자열), 「새 문제」를 누르면 같은 구조의 다른 수로 바뀝니다.
     - 문제 탭 그림 = 문제에 주어진 것만(답·답 보조선은 정리 탭의 풀이 단계에서 드러남). 풀이 단계·정답·그림이 변형을 따라갑니다.
     ====================================================================== */
  const OV = {};
  OV.gcd = (a, b) => (b ? OV.gcd(b, a % b) : Math.abs(a));
  OV.fr = (n, d = 1) => { const g = OV.gcd(n, d) || 1; n /= g; d /= g; if (d < 0) { n = -n; d = -d; } return d === 1 ? String(n) : (n < 0 ? '-' : '') + `\\frac{${Math.abs(n)}}{${d}}`; };
  OV.sum = (a) => a.reduce((x, y) => x + y, 0);
  OV.range = (a, b) => { const r = []; for (let i = a; i <= b; i++) r.push(i); return r; };
  OV.f2 = (v, d = 2) => { const r = Math.round(v * Math.pow(10, d)) / Math.pow(10, d); return String(Object.is(r, -0) ? 0 : r); };
  OV.sqrtOf = (n) => { let o = 1, i = n; for (let f = 2; f * f <= i; f++) while (i % (f * f) === 0) { i /= f * f; o *= f; } return [o, i]; };
  OV.rt = (a, r) => { const [o, i] = OV.sqrtOf(r); a *= o; return i === 1 ? String(a) : (a === 1 ? '' : String(a)) + `\\sqrt{${i}}`; }; // a√r 를 간단히
  const ledActive = s => !!(s && (s.lessonOn || s.lessonEntry));
  OV.varier = (list) => { const first = list[0]; let cur = first; return { all: list, first: () => first, set: (i) => { cur = list[i]; }, cur: () => ledActive(window.lab && window.lab.s) ? first : cur, next: () => { const pool = list.filter((x) => x !== cur); cur = pool[Math.floor(Math.random() * pool.length)]; return cur; } }; };
  OV.newBtn = '<div style="margin-top:10px"><button type="button" class="apl-btn sm" data-ov-new>새 문제 (숫자 바꾸기)</button></div>';
  document.addEventListener('click', (ev) => {
    const hit = ev.target && ev.target.closest && ev.target.closest('[data-ov-new]');
    if (!hit) return;
    const lab = window.lab, sc = lab && lab.scene;
    if (!sc || !sc.vary) return;
    sc.vary.next();
    lab.s.revealed = false;
    lab.setStep(0);
    try { lab._buildReview(); } catch (e) { /* 셸이 바뀌어도 그림은 그대로 */ }
    lab.invalidate(true);
  });
  // 변형으로 그림의 크기가 달라지면 무대를 다시 맞춥니다(탐구용 범위 'E' 와 문제용 범위를 따로)
  OV.autoFocus = (b, key, box) => { if (b.__ovKey !== key) { b.__ovKey = key; b.setFocus(box, true); } };
  OV.txt = (b, p, str, color, o = {}) => b.text(p, str, { color, size: 13, weight: 800, align: 'center', baseline: 'middle', ...o });
  OV.mono = (x) => x; // 자리 표시(확장용)

  /* ---------- 변형 생성기: 유형마다 (문장 · 정답 · 교과서 풀이 · 10초 컷 · 그림 자료 · 검산 자료) ---------- */
  const VARS = [[], [], [], [], [], [], [], []];
  const evenOdd = (N) => { let E = 0, O = 0; for (let n = 2; n <= N; n++) (n % 2 ? O++ : E++); return { E, O }; };
  const gtex = (N, sign) => OV.range(2, N).map((n) => (n % 2 ? 1 : sign > 0 ? 2 : 0)); // f(k) 부호에 따른 g(k,n) 값들

  /* 유형 1 · 거듭제곱근의 실근의 개수 */
  const f1 = (r1, r2) => ({ x: [Math.min(-1, r1 - 1.6), r2 + 1.9], y: [-((r2 - r1) * (r2 - r1)) / 4 - 1.6, 4.8] });
  function v1a(r1, r2, N, orig) {
    const ks = OV.range(r1 + 1, r2 - 1), S = OV.sum(ks), mid = (r1 + r2) / 2;
    return {
      orig, focus: f1(r1, r2), fig: { r1, r2, ks, kind: 'sum' }, chk: { t: '1a', r1, r2, N, val: [S, N - 1] },
      text: `$f(x) = (x-${r1})(x-${r2})$에 대하여 $f(k)$의 $n$제곱근 중 실수인 것의 개수를 $g(k, n)$이라 하자. $g(k, 4) = 0$을 만족시키는 모든 자연수 $k$의 값의 합과, $k=${r1}$일 때 $\\sum_{n=2}^{${N}} g(${r1}, n)$의 값을 구하시오.`,
      ans: `$k$의 값의 합 $${S}$, $\\sum_{n=2}^{${N}} g(${r1},n)=${N - 1}$`,
      std: [
        `1) $n=4$(짝수)에서 $g(k,4)=0 \\iff f(k) < 0 \\iff ${r1} < k < ${r2}$이므로 자연수 $k = ${ks.join(', ')}$의 합은 $${S}$이다.`,
        `2) $k=${r1}$일 때 $f(${r1}) = 0$이다. $0$의 $n$제곱근 중 실수인 것은 $n$의 홀짝에 관계없이 $0$ 하나뿐이다.`,
        `3) 따라서 $\\sum_{n=2}^{${N}} g(${r1}, n) = ${Array(N - 1).fill(1).join(' + ')} = ${N - 1}$이다.`
      ],
      quick: [
        `$f(k) = 0$, 즉 $k = ${r1}, ${r2}$일 때에는 $n$이 홀수이든 짝수이든 $x^n = 0$의 실근이 $x = 0$ 하나뿐이므로 $g(k, n) = 1$입니다.`,
        `$n$이 짝수일 때 $g(k, n) = 0$인 자연수 $k$는 $f(k) < 0$, 즉 $${r1} < k < ${r2}$인 $${ks.join(', ')}$이고, 합은 (가운데 항)$\\times ${ks.length} = ${OV.fr(2 * mid, 2)} \\times ${ks.length} = ${S}$입니다.`
      ]
    };
  }
  VARS[0][0] = [v1a(2, 6, 5, true), v1a(1, 7, 6), v1a(3, 9, 5), v1a(2, 8, 7), v1a(1, 5, 4)];
  function v1b(r1, r2, N, orig) {
    const ks = [r1, r2], { E, O } = evenOdd(N), pos = gtex(N, 1), neg = gtex(N, -1);
    return {
      orig, focus: f1(r1, r2), fig: { r1, r2, ks, kind: 'zero' }, chk: { t: '1b', r1, r2, N, val: [r1 + r2] },
      text: `$f(x) = (x-${r1})(x-${r2})$에서 $\\sum_{n=2}^{${N}} g(k, n) = ${N - 1}$를 만족시키는 모든 자연수 $k$의 합을 구하시오.`,
      ans: `$k$의 합 $${r1 + r2}$ ($k=${r1},\\ ${r2}$)`,
      std: [
        `1) $f(k)>0$이면 $${pos.join(' + ')} = ${OV.sum(pos)}$, $f(k)<0$이면 $${neg.join(' + ')} = ${OV.sum(neg)}$이다.`,
        `2) $f(k)=0$이면 $${Array(N - 1).fill(1).join(' + ')} = ${N - 1}$이므로 $k=${r1}, ${r2}$이고 합은 $${r1 + r2}$이다.`
      ],
      quick: [
        `$n = 2 \\sim ${N}$ (항 $${N - 1}$개)의 합이 $${N - 1}$이 되려면, 홀수 $n$에서는 항상 $1$이고 짝수 $n$에서는 세 값($2, 1, 0$) 중 $1$이어야 합니다. 따라서 **$f(k) = 0$인 두 근 $k = ${r1}, ${r2}$**입니다.`
      ]
    };
  }
  VARS[0][1] = [v1b(1, 7, 6, true), v1b(2, 8, 5), v1b(3, 9, 7), v1b(1, 5, 4), v1b(4, 10, 6)];

  /* 유형 2 · 거듭제곱근이 자연수가 되는 순서쌍 */
  const f2 = (M, N) => ({ x: [-1, M + 8.5], y: [0.2, N + 1.4] });
  function v2(M, N, B, orig) {
    const cs = OV.range(2, N).map((n) => Math.floor(M / n)), tot = OV.sum(cs);
    const lst = OV.range(2, N).map((n, i) => `$n=${n}$일 때 $${cs[i]}$개`).join(', ');
    return {
      orig, focus: f2(M, N), fig: { M, N }, chk: { t: '2', M, N, val: [tot] },
      text: B
        ? `$1 \\le m \\le ${M},\\; 2 \\le n \\le ${N}$에서 $2^{\\frac{m}{n}}$이 자연수가 되는 순서쌍 $(m, n)$의 총개수를 $\\sum_{n=2}^{${N}} \\lfloor \\frac{${M}}{n} \\rfloor$으로 구하시오.`
        : `$1 \\le m \\le ${M},\\; 2 \\le n \\le ${N}$인 두 자연수 $m, n$에 대하여 $\\sqrt[n]{2^m}$이 자연수가 되도록 하는 모든 순서쌍 $(m, n)$의 개수를 구하시오.`,
      ans: `$${tot}$개`,
      std: [
        `1) $\\sqrt[n]{2^m} = 2^{\\frac{m}{n}}$이 자연수가 되려면 $m$이 $n$의 배수여야 한다.`,
        `2) $1 \\le m \\le ${M}$에서 $n$의 배수의 개수는 ${lst}이다.`,
        `3) 따라서 총 $${cs.join(' + ')} = ${tot}$개이다.`
      ],
      quick: [
        `$1 \\le m \\le M$에서 $n$의 배수의 개수는 $M$을 $n$으로 나눈 몫 **$\\left\\lfloor \\frac{M}{n} \\right\\rfloor$**개입니다. ($\\lfloor\\ \\rfloor$는 소수점 아래를 버리는 기호입니다.)`,
        `${OV.range(2, N).map((n) => `\\lfloor\\frac{${M}}{${n}}\\rfloor`).map((s) => `$${s}$`).join(' + ')} $= ${cs.join(' + ')} = ${tot}$개`
      ]
    };
  }
  VARS[1][0] = [v2(12, 6, false, true), v2(10, 5), v2(14, 6), v2(16, 6), v2(9, 5), v2(18, 6)];

    if(m===5) return [
      `세 점의 x좌표 간격은 같은 $d=${f.x2-f.x1}$입니다. 밑이 2인 지수곡선에서는 가로로 d만큼 갈 때 높이가 매번 $2^d$배가 됩니다.`,
      '$y_2/y_1=y_3/y_2=2^d$, 따라서 $y_2^2=y_1y_3$. 현의 중점 높이와 곡선의 높이를 혼동하지 않습니다.',
      j===0?v.std[1]+' '+v.std[2]:v.std[2]
    ];
    if(m===3) return [
      `계수 $${f.k}$를 $2^{\\log_2 ${f.k}}$로 쓰면 그래프의 가로 이동량이 보입니다. 점의 높이가 양수인지 먼저 확인합니다.`,
      f.two
        ? `어느 양의 높이에서도 가로 단면의 길이는 $\\log_2 ${f.k}$. 빨간 중간 단면들도 모두 같은 길이입니다.`
        : `두 교점 A, B는 높이가 같습니다. A의 x좌표는 $\\log_2 t-\\log_2 ${f.k}$, B의 x좌표는 $\\log_2 t$이므로 가로 간격에서 $\\log_2 t$가 소거됩니다.`,
      f.two?`모든 가로 단면을 길이를 유지하며 옮기면 직사각형과 비교할 수 있습니다. 넓이는 $( ${f.t2}-${f.t1})\\log_2 ${f.k}=${Math.log2(f.k)*(f.t2-f.t1)}$.`:`수평선의 높이 t를 구하지 않아도 $AB=\\log_2 ${f.k}$. t>0인 모든 높이에 적용됩니다.`
    ];
    return KILLER_MODES[m].stepDescs.map((d,i)=>KILLER_MODES[m].stepLabels[i]+': '+d);
  }

  const curOf = (m, j) => VARY[m][j].cur();
  function sceneOf(m, j) {
    const md = KILLER_MODES[m];
    const sc = md.scenarios[j];
    return {
      id: 't' + (m + 1) + 'ab'[j],
      title: sc.chip,
      short: '문제 ' + 'AB'[j],
      question: QUESTIONS[m],
      guide: GUIDES[m],
      startStep: 0,
      notesTitle: '오답 함정 주의보',
      focus: FOCUS[m],
      enter: (s) => { Object.assign(s, mapP(m, sc.params)); s.twinText = null; s.twinSnap = null; if (window.lab && window.lab.board) window.lab.board.__ovKey = null; },
      controls: (SLIDERS[md.id] || []).map((d) => pk(m, d.key)),
      actions: () => [
        ...MUTATORS.map((a) => ({ id: a.id, icon: a.icon, label: a.label, on: (s) => !!s[a.key], run: (s) => { s[a.key] = !s[a.key]; } })),
        { id: 'twin', icon: 'wand', label: '숫자 바꿔 보기', primary: true, run: (s) => { twin(s, m); VARY[m][j].next(); } }
      ],
      steps: () => teachingSteps(m,j,curOf(m,j)).map(stepText),
      vary: VARY[m][j],
      reviewTop: () => `<div class="apl-rich" style="font-size:var(--fs-sm);line-height:1.75"><small style="color:var(--text-3);font-weight:800">문제</small><br>${rich(curOf(m, j).text)}</div>`,
      problem: {
        tag: sc.source,
        text: () => rich(curOf(m, j).text) + OV.newBtn,
        answer: () => safe(curOf(m, j).ans)
      },
      solution: {
        standardTitle: sc.textbookTitle, standardTag: '교과서 풀이',
        quickTitle: sc.secretTitle.replace(/\s*\(\d+초 컷!?\)/g, ''), quickTag: '10초 컷',
        standard: () => ({ steps: lines(curOf(m, j).std) }),
        quick: () => ({ steps: lines(curOf(m, j).quick) })
      },
      view: (s, lab) => {
        if (lab && lab.tab !== 'explore') return { notes: rich(md.trapWarning) };
        if(s.step<3 && !s.revealed) return {
          readouts: (SLIDERS[md.id]||[]).map((d,i)=>({label:d.label,value:md.id==='type8'&&d.key==='lineT'?expAbsHeight(s[pk(m,d.key)]).plain:String(s[pk(m,d.key)]),color:READ_COLORS[i%4]})),
          notes: s.step===0 ? '현재 조작값과 기준 그래프를 비교해 보세요. 보조선을 한 단계씩 열면 관계식과 결론이 이어집니다.' : rich(md.trapWarning)
        };
        const { formula, cards } = hudOf(s, m);
        return {
          formula: safe(formula),
          readouts: cards.map((c, i) => ({ label: c.title, value: String(c.val), note: c.sub, color: READ_COLORS[i % 4] })),
          notes: rich(md.trapWarning)
        };
      },
      draw: (b, s, v, lab) => drawVar(b, s, m, j, lab)
    };
  }

  const groups = KILLER_MODES.map((md, m) => ({
    id: md.id,
    title: md.code + ' · ' + md.shortTitle,
    short: md.shortTitle,
    scenes: md.scenarios.map((_, j) => sceneOf(m, j))
  }));

  /* 탐구 칠판은 조작 중인 모델을 따르고, 미입장 전체보기·정리·문제는 기존 은행을 보존합니다. */
  function currentExploreSteps(m,s){
    const p=pv(s,m),n=x=>Number(x.toFixed(4));
    if(m===2){const P=Math.round(p.multP),sum=Math.round(p.modeSum)===1,c=sum?P+1:P-1,ms=[];for(let k=c;k<2*c;k++)if(!sum||k!==c)ms.push(k);const exponent=OV.fr(ms.reduce((a,b)=>a+b,0),c);return[
      `가로축은 u=log₁₀x이며 탐구 범위는 1≤u<2입니다. 현재 p=${P}이고 ${sum?'초록 {u}와 보라 1−{pu}의 교점을 찾습니다.':'초록 {u}와 파랑 {pu}의 교점을 찾습니다.'} 소수부분의 윗끝1은 열린 점입니다.`,
      sum?`소수부분의 합이1이므로 $(${P}+1)u=${c}u$가 정수여야 합니다. u=1에서는0+0≠1이므로 왼쪽 끝도 제외하고, 오른쪽 끝2는 원래 범위 밖입니다.`:`소수부분이 같으므로 $(${P}-1)u=${c}u$가 정수입니다. 왼쪽 끝 u=1은 포함하고 오른쪽 끝 u=2는 제외합니다.`,
      `현재 교점의 u값은 $${ms.map(k=>OV.fr(k,c)).join(',\\ ')}$로 ${ms.length}개이며 합은 $${exponent}$입니다. x들을 직접 구해 곱하지 않고, 로그값의 합에서 곱 $10^{${exponent}}$을 얻습니다.`
    ];}
    if(m===3){const k=p.multK,d=Math.log2(k),lo=p.yCut1,hi=p.yCut2;return[
      `현재 계수 k=${k}를 $2^{\\log_2 ${k}}$로 보면 y=k·2ˣ은 y=2ˣ을 왼쪽으로 log₂k만큼 옮긴 곡선입니다. 탐구의 두 높이 ${lo},${hi}는 모두 양수입니다.`,
      `2단계의 노란 아래 단면과 빨간 위 단면을 비교합니다. 어느 높이 y에서도 x좌표가 log₂y−log₂k와 log₂y이므로 가로 간격은 $\\log_2 ${k}\\approx${n(d)}$로 같습니다.`,
      `3단계의 띠 영역을 같은 길이의 가로 단면으로 보면 넓이는 $(${hi}-${lo})\\log_2 ${k}\\approx${n((hi-lo)*d)}$입니다. 한 높이만으로 길이를 구하는 문제에도 같은 간격 관계를 사용합니다.`
    ];}
    const x=p.xMid,d=p.stepD,y=2**x,y1=2**(x-d),y3=2**(x+d);return[
      `현재 세 x좌표는 ${n(x-d)},${x},${n(x+d)}이고 공차는 d=${d}입니다. 수선의 발 사이 가로 간격이 같으면 지수곡선의 높이는 매번 $2^{${d}}$배가 됩니다.`,
      '따라서 $y_2/y_1=y_3/y_2=2^d$이고 $y_2^2=y_1y_3$입니다. 2단계의 현 AC의 중점 높이는 산술평균이며, 곡선의 가운데 높이인 기하평균과 구별합니다.',
      `현재 $B=(${x},2^{${x}})$의 높이는 약 ${n(y)}이고, 양끝 높이의 곱은 약 ${n(y1*y3)}입니다. 세 높이의 합은 $y_2(2^{-d}+1+2^d)\\approx${n(y1+y+y3)}$입니다. 현재 B가 고정 문제의 (2,4)라고 가정하지 않습니다.`
    ];
  }
  for(const m of [2,3,5])for(const sc of groups[m].scenes){const fixed=sc.steps;
    sc.steps=(s,lab)=>{const active=lab||window.lab;return active?.tab==='explore'&&active.scene?.id===sc.id?currentExploreSteps(m,s).map(stepText):fixed(s,lab);};
  }

  // One-click lessons keep the first source packet without changing manual variants.
  const lessonScenes = groups.flatMap(group => group.scenes);
  const sourceInfo = Object.fromEntries(lessonScenes.map(sc => {
    const initial = Object.fromEntries(Object.entries(params).map(([key, p]) => [key, p.value]));
    Object.assign(initial, { mut_symY:false, mut_abs:false, mut_dots:false, twinText:null, twinSnap:null });
    sc.enter?.(initial);
    return [sc.id, { initial, first:sc.vary.first(), question:sc.problem.text().replace(/<div[^>]*>\s*<button[^>]*data-(?:ov|pl)-new[\s\S]*$/, ''), steps:sc.steps() }];
  }));
  const lessonSource = window.APL_ED_SOURCE = {
    scenes:lessonScenes,
    first:id=>sourceInfo[id].first,
    initial:id=>({...sourceInfo[id].initial}),
    question:id=>sourceInfo[id].question,
    steps:id=>sourceInfo[id].steps.slice()
  };
  function ledMathKey(value) {
    return String(value||'').normalize('NFKC').replace(/\\(?:left|right|,|!|;|quad|qquad)/g,'')
      .replace(/\\(?:dfrac|frac)\{([^{}]*)\}\{([^{}]*)\}/g,'($1)/($2)')
      .replace(/\\sqrt\{([^{}]*)\}/g,'√($1)').replace(/\\sqrt\s*(\w)/g,'√($1)')
      .replace(/\\(?:text|mathrm|mathbf|overline)\{([^{}]*)\}/g,'$1')
      .replace(/\\leq?/g,'≤').replace(/\\geq?/g,'≥').replace(/\\lt/g,'<').replace(/\\gt/g,'>')
      .replace(/\\cdot|\\times/g,'×').replace(/−|–/g,'-').replace(/[\s{}$^_()]/g,'');
  }
  function ledLabel(value,s) {
    const text=String(value||''), key=ledMathKey(text), known=(s.ledKnownMath||[]).map(ledMathKey);
    if (/^(?:가로 m |n=\d+(?:: \d+개)?$|u = 0$|y = uⁿ|y = \{|log x = )/.test(text)) return text;
    if (key && known.some(math=>math.includes(key))) return text;
    if (/^(?:[A-Z][′']*|[xy]|[αβ]|[xy][₁₂]|[PQRS]|f|g|y = x)$/.test(text)) return text;
    const named=text.match(/^([A-Z][′']*)(?=[\s(=:]|$)/);
    if (named) return named[1];
    return /^(?:점근선|대칭축|산술평균|기하평균|직각|넓이|교점)/.exec(text)?.[0]||'';
  }
  for (const sc of lessonScenes) {
    const original={question:sc.question,reviewTop:sc.reviewTop,steps:sc.steps,view:sc.view,draw:sc.draw};
    sc.question=(s,lab)=>ledActive(s)?s.ledQuestion||lessonSource.question(sc.id):typeof original.question==='function'?original.question(s,lab):original.question;
    sc.reviewTop=(s,lab)=>ledActive(s)?'':original.reviewTop(s,lab);
    sc.steps=(s,lab)=>ledActive(s)?['조건 확인','핵심 관계','식 세우기','계산과 결론']:original.steps(s,lab);
    sc.view=(s,lab)=>ledActive(s)?{}:original.view(s,lab);
    sc.draw=(b,s,v,lab)=>{
      if (!ledActive(s)) {
        if (b._edLessonView) {
          if (b.focus===b._edLessonView.appliedFocus) Object.assign(b,b._edLessonView.before);
          else { b.__ovKey=null;b.__plKey=null; }
          delete b._edLessonView;
        }
        return original.draw(b,s,v,lab);
      }
      if (!b._edLessonView) b._edLessonView={before:{focus:b.focus,zoom:b.zoom,panX:b.panX,panY:b.panY,__ovKey:b.__ovKey,__plKey:b.__plKey}};
      const shown={...s,...(s.lessonEntry?s.ledInitial:{}),playing:false,step:s.lessonEntry?0:Math.max(0,Math.min(s.step||0,s.ledShowAnswer?4:3))};
      if(s.lessonEntry){shown.ledTrace=0;shown.ledShowAnswer=false;}
      const shownLab=Object.create(lab);shownLab.tab=shown.ledExplore?'explore':'review';shownLab.s=shown;
      const key=sc.id+'|'+!!shown.ledExplore;
      if (b._edLessonView.key!==key) { b.__ovKey=null;b.__plKey=null;b._edLessonView.key=key;b.zoom=1;b.panX=0;b.panY=0; }
      const plot=b.plot,text=b._text,path=b.path,point=b.point,axes=b.axes,fillText=b.ctx.fillText,strokeText=b.ctx.strokeText,curves=[],paths=[],points=[];
      let axesDrawing=false;
      b.axes=function(...args){axesDrawing=true;try{return axes.apply(this,args);}finally{axesDrawing=false;}};
      b.plot=function(fn,options={}) {
        if (!this._bbox && (options.width||2.6)>=2.4 && !options.dash) curves.push({fn,options});
        return plot.call(this,fn,options);
      };
      b.path=function(ps,options={}){if(!axesDrawing&&!this._bbox&&(options.width||0)>=2.4&&!options.dash)paths.push(ps);return path.call(this,ps,options);};
      b.point=function(p,options={}){if(!axesDrawing&&!this._bbox)points.push(p);return point.call(this,p,options);};
      b._text=function(x,y,label,options,screen) {return text.call(this,x,y,this._bbox||axesDrawing?label:ledLabel(label,shown),options,screen);};
      b.ctx.fillText=function(label,...args){return fillText.call(this,axesDrawing||b._bbox?label:ledLabel(label,shown),...args);};
      b.ctx.strokeText=function(label,...args){return strokeText.call(this,axesDrawing||b._bbox?label:ledLabel(label,shown),...args);};
      try {original.draw(b,shown,{},shownLab);} finally {b.plot=plot;b._text=text;b.path=path;b.point=point;b.axes=axes;b.ctx.fillText=fillText;b.ctx.strokeText=strokeText;}
      b._edLessonView.appliedFocus=b.focus;
      // Trace a point on the native plotted function, within the actual viewport.
      const u=clamp(Number(shown.ledTrace)||0,0,1), box=b.viewBox();
      let traced=false;
      if (!s.lessonEntry && u && !b._bbox) for (const {fn,options} of curves) {
        const box=b.viewBox(),lo=Math.max(box.x0,options.from??-Infinity),hi=Math.min(box.x1,options.to??Infinity),xs=[];
        for (let i=0;i<=120;i++) {const x=lo+(hi-lo)*i/120,y=fn(x);if(Number.isFinite(y)&&y>box.y0&&y<box.y1)xs.push(x);}
        if(xs.length>1){const x=xs[0]+(xs.at(-1)-xs[0])*u,y=fn(x);if(Number.isFinite(y)&&y>box.y0&&y<box.y1){b.point([x,y],{color:'violet',r:5,glow:false});traced=true;}break;}
      }
      const xy=p=>[p.x??p[0],p.y??p[1]],inside=p=>p.every(Number.isFinite)&&p[0]>=box.x0&&p[0]<=box.x1&&p[1]>=box.y0&&p[1]<=box.y1;
      if(!s.lessonEntry&&u&&!traced&&!b._bbox){
        const segment=paths.find(ps=>ps.length===2&&inside(xy(ps[0]))&&inside(xy(ps[1])));
        if(segment){const a=xy(segment[0]),z=xy(segment[1]),t=.02+.96*u;b.point([a[0]+(z[0]-a[0])*t,a[1]+(z[1]-a[1])*t],{color:'violet',r:5,glow:false});}
        else{const visible=points.map(xy).filter(inside);if(visible.length)b.point(visible[Math.min(visible.length-1,Math.floor(u*visible.length))],{color:'violet',r:5,glow:false});}
      }
      if(shown.ledProbe){
        const f=lessonSource.first(sc.id).fig, u=shown.ledU, frac=x=>Math.max(0,x-Math.floor(x+1e-10));
        const y=frac(u),z=f.mode?1-frac(f.p*u):frac(f.p*u);
        b.seg([u,0],[u,Math.max(y,z)],{color:'amber',dash:[3,4],width:1.5});
        b.point([u,y],{color:'green',r:6,label:'P',dx:-9,dy:15,align:'right'});
        b.point([u,z],{color:f.mode?'violet':'sky',r:6,hollow:true,label:'Q',dx:9,dy:-12});
      }
    };
  }
  const lessons=window.APL_ED_LESSONS?window.APL_ED_LESSONS.install(lessonScenes,lessonSource):{};

  /* ---------- 7. 실험실 등록 ---------- */
  APLab.createLab({
    id: 'alg-exp-deep',
    stagedReveal: true,
    title: '거듭제곱근·상용로그·지수함수',
    courseName: '대수',
    unit: 'Ⅰ. 지수함수와 로그함수',
    courseColor: 'var(--m-amber)',
    home: '../index.html#algebra',
    legacy: '../../labs/대수/part1a2.html',
    board: { kind: 'cartesian', focus: FOCUS[0] },
    params,
    state: { mut_symY: false, mut_abs: false, mut_dots: false, twinText: null, twinSnap: null },
    persist: ['mut_symY', 'mut_abs', 'mut_dots'],
    groups,
    lessons
  });
});
</script>
