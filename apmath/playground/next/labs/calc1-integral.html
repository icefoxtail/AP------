/* ==========================================================================
   미적분Ⅰ · 정적분과 넓이 (AP Math Lab 2.0 이식본)
   원본: labs/미적분1/정적분과 넓이.html
   - 문제·단계·정석/빠른 풀이 문구(examData)는 원본을 그대로 옮겼습니다.
   - 수학 함수(모드별 f, g)와 수치 적분기 computeIntegralStats는 원본과 같은 식입니다.
   - 바뀐 점: 셸·레이아웃은 공용 키트가 담당, 무대는 1:1 축척, 색칠은 부호별(분홍 +, 하늘 −) 다각형으로,
     끌 수 있는 점(장면 1: 아래끝 a·위끝 b / 2: 교점 / 3: 가운데 교점 β / 4: 곡선 g 위의 점 / 5: 점 A·B).
   - 장면 1·3·5의 ‘하단 동기화 뷰’는 원본에서 위와 같은 f를 다시 그릴 뿐이라 두지 않고,
     차함수 h(x) = f(x) − g(x) 가 의미 있는 장면 2·4에만 두었습니다.
   - 장면 4의 원본 라벨은 m ≠ −0.5 에서도 ‘접점(0,1)·교점(1,1)’이라고 적었으나, 접점·교점 표시는 m = −0.5 일 때만 합니다.
   ========================================================================== */
window.addEventListener('DOMContentLoaded', function () {
  const { tex, fmt, clamp } = APLab;
  const num = (v, d = 2) => fmt(v, d).replace('−', '-'); // 수식(TeX) 문자열용
  const round05 = (v) => Math.round(v * 20) / 20;
  const R = (v) => Math.round(v * 100) / 100;

  /* ---------- 1. 모드별 수학 함수 & 수치 적분기 (원본 그대로, 모드별 함수로 나눔) ---------- */
  // 장면 1: f(x) = x^2 - 2x = x(x - 2) (0~2 음수, 2~3 양수)
  const F1 = (x) => x * (x - 2.0);
  // 장면 2: 위로 볼록 포물선 f(x) = -x^2 + 3x = x(3 - x), 원점을 지나는 직선 g(x) = m*x
  const F2 = (x) => -x * x + 3.0 * x;
  const G2 = (m) => (x) => m * x;
  // 장면 3: 삼차함수 f(x) = 0.5 (x - α)(x - β)(x - γ), α = -1, γ = 3 고정, β 가 움직임
  const F3 = (beta) => (x) => 0.5 * (x + 1.0) * (x - beta) * (x - 3.0);
  // 장면 4: 삼차함수 f(x) = 0.5x^3 - 0.5x + 1, 이차함수 g(x) = 0.5x^2 + m*x + 1 (f(x)-g(x) = 0.5x(x^2 - x - 1 - 2m))
  const F4 = (x) => 0.5 * x * x * x - 0.5 * x + 1.0;
  const G4 = (m) => (x) => 0.5 * x * x + m * x + 1.0;
  // 장면 5: 단조증가 함수 f(x) = 0.25x^3 + 0.5x (역함수 존재!)
  const F5 = (x) => 0.25 * x * x * x + 0.5 * x;
  const ZERO = () => 0;
  const MBISECT = 3.0 - 3.0 / Math.cbrt(2); // (3 - m)^3 = 27/2 인 m

  // 수치 적분기: 구간 [x1, x2]에서 정적분(signed)과 양수 넓이(posArea), 음수 넓이(negArea) 반환
  function computeIntegralStats(fn, x1, x2, N = 200) {
    const a = Math.min(x1, x2);
    const b = Math.max(x1, x2);
    const signDir = x2 >= x1 ? 1 : -1;
    if (b - a < 1e-5) return { signed: 0, posArea: 0, negArea: 0, totalArea: 0 };

    const h = (b - a) / N;
    let pos = 0;
    let neg = 0;
    for (let i = 0; i < N; i++) {
      const xm = a + (i + 0.5) * h;
      const y = fn(xm);
      if (y >= 0) pos += y * h;
      else neg += Math.abs(y) * h;
    }
    return {
      signed: signDir * (pos - neg),
      posArea: pos,
      negArea: neg,
      totalArea: pos + neg
    };
  }

  /* ---------- 3. 공통 부품 ---------- */
  // 원본 안내문(examData.hint)은 그대로 두고, 화면 위치를 가리키던 말만 새 배치(탐구 탭·조절 막대)에 맞게 바꿔 보여 줍니다.
  const hintOf = (n) => examData[n].hint.replace('좌측 상단 ', '탐구 탭의 ').replace('우측 슬라이더로', '조절 막대로');
  // 원본 snap의 p1·p2를 이 실험실의 값 이름으로 옮깁니다.
  const SNAP = {
    1: (d) => ({ a1: d.p1, b1: d.p2 }),
    2: (d) => ({ m2: d.p1 }),
    3: (d) => ({ beta3: d.p2 }),
    4: (d) => ({ m4: d.p1 }),
    5: (d) => ({ a5: d.p1, b5: d.p2 })
  };
  function problemOf(mode) {
    const d = examData[mode];
    return {
      tag: d.tag,
      time: d.targetTime,
      text: d.question,
      answer: d.answerBadge,
      snap: () => ({ ...SNAP[mode](d.snap), dual: d.snap.dualView })
    };
  }
  function solutionOf(mode) {
    return {
      standardTitle: '교과서식 정석 풀이', standardTag: '정석 · 3분',
      quickTitle: '10초 컷 · 핵심 공식', quickTag: '10초 컷',
      standard: examData[mode].textbook,
      quick: examData[mode].shortcut
    };
  }
  function enterOf(mode) {
    return (s) => {
      const d = examData[mode];
      Object.assign(s, SNAP[mode](d.snap));
      s.dual = d.snap.dualView;
    };
  }
  // 위·아래 두 칠판(같은 축척 1:1): 세로 범위에 비례해 높이를 나눕니다.
  const panesOf = (top, bot) => (s) => {
    if (!s.dual) return null;
    const h1 = top[1] - top[0], h2 = bot[1] - bot[0];
    const f = clamp(h1 / (h1 + h2), 0.4, 0.66);
    return [{ id: 'main', frac: f, focusY: top }, { id: 'sub', frac: 1 - f, focusY: bot }];
  };
  const actionsOf = (dualLabel, playLabel) => {
    const list = [];
    if (dualLabel) list.push({ id: 'dual', icon: 'split', label: (s) => (s.dual ? `${dualLabel} 켜짐` : dualLabel), on: (s) => s.dual, run: (s) => { s.dual = !s.dual; } });
    list.push({ id: 'play', play: true, icon: (s) => (s.playing ? 'pause' : 'play'), label: (s) => (s.playing ? '일시 정지' : playLabel), on: (s) => s.playing, run: (s) => { s.playing = !s.playing; } });
    return list;
  };
  function bounce(s, key, speed, lo, hi, dt) {
    s[key] += speed * s.animDir * dt;
    if (s[key] < lo) { s[key] = lo; s.animDir = 1; }
    if (s[key] > hi) { s[key] = hi; s.animDir = -1; }
  }
  // 휴대폰에서 두 칠판을 쓸 때는 수식 칩·상태 배지가 그림을 가리므로 패널의 안내 줄로 옮깁니다.
  const topInfo = (s, lab, chips, status) => (s.dual && lab && lab.board && lab.board.W < 640 ? { chips: [], status: null, alert: status } : { chips, status });

  // 한 칠판 그리기: (여러 칠판이면 색을 깔고 가장자리에서 자른 뒤) 격자와 축
  function stage(b, s, id, ax) {
    b.use(id);
    const c = b.ctx;
    c.save();
    if (b.panes) {
      if (id !== 'main') {
        const r = b.paneRect(id);
        c.fillStyle = b.color('halo', 0.35);
        c.fillRect(r.x, r.y, r.w, r.h);
      }
      b.clip();
    }
    if (s.grid) b.grid();
    b.axes(ax);
  }
  const paneEnd = (b) => b.ctx.restore();
  // 아래 칠판 이름표와 나눔선
  function subTitle(b, text) {
    const r = b.paneRect('sub');
    const c = b.ctx;
    c.save();
    c.strokeStyle = b.color('sky', 0.55);
    c.lineWidth = 1.5;
    c.beginPath();
    c.moveTo(r.x, r.y + 0.5);
    c.lineTo(r.x + r.w, r.y + 0.5);
    c.stroke();
    c.restore();
    b.stext(r.x + 12, r.y + 18, text, { color: 'sky', size: 12.5, align: 'left', weight: 800 });
  }
  // 위·아래 칠판을 같은 x로 잇는 세로 점선
  function linkX(b, x, color) {
    if (!b.panes) return;
    const top = b.paneRect('main'), bot = b.paneRect('sub');
    b.use('main');
    const sx = b.toS(x, 0).x;
    const c = b.ctx;
    c.save();
    c.setLineDash([5, 5]);
    c.strokeStyle = b.color(color || 'amber', 0.6);
    c.lineWidth = 1.6;
    c.beginPath();
    c.moveTo(sx, top.y + 6);
    c.lineTo(sx, bot.y + bot.h - 6);
    c.stroke();
    c.restore();
  }
  // 두 곡선 f, g 사이를 색칠(f가 위이면 pos 색, 아래이면 neg 색). 부호가 바뀌는 곳에서 조각을 나눕니다.
  function fillBetween(b, f, g, x0, x1, o) {
    if (!(x1 - x0 > 1e-6)) return;
    const N = 160;
    let piece = null;
    const flush = () => {
      if (piece && piece.top.length > 1 && piece.mx > 1e-4) {
        const pos = piece.sign >= 0;
        b.poly(piece.top.concat(piece.bot.slice().reverse()), { fill: pos ? o.pos : o.neg, fillAlpha: o.alpha == null ? 0.3 : o.alpha, color: null, ref: pos ? o.refPos : o.refNeg });
      }
      piece = null;
    };
    const add = (x, d) => {
      if (!piece) piece = { sign: 0, top: [], bot: [], mx: 0 };
      if (piece.sign === 0 && d !== 0) piece.sign = d > 0 ? 1 : -1;
      piece.top.push([x, f(x)]);
      piece.bot.push([x, g(x)]);
      piece.mx = Math.max(piece.mx, Math.abs(d));
    };
    let px = x0;
    let pd = f(x0) - g(x0);
    let last = pd === 0 ? 0 : pd > 0 ? 1 : -1; // 마지막으로 0이 아니었던 부호 (눈금에 0이 정확히 걸려도 놓치지 않게)
    add(px, pd);
    for (let i = 1; i <= N; i++) {
      const x = x0 + ((x1 - x0) * i) / N;
      const d = f(x) - g(x);
      if (d !== 0) {
        const sg = d > 0 ? 1 : -1;
        if (last !== 0 && sg !== last) {
          const xc = pd === 0 ? px : px + ((x - px) * Math.abs(pd)) / (Math.abs(pd) + Math.abs(d));
          if (pd !== 0) add(xc, 0);
          flush();
          add(xc, 0);
        }
        last = sg;
      }
      add(x, d);
      px = x;
      pd = d;
    }
    flush();
  }
  // 가장자리에서 잘리지 않는 글자 라벨: 화면 안으로 밀어 넣습니다.
  function tag(b, p, str, o = {}) {
    const c = b.ctx;
    const size = (o.size || 12.5) * b.fs;
    c.save();
    c.font = `800 ${size}px ${b.font}`;
    const w = c.measureText(String(str)).width;
    c.restore();
    const s = b.toS(Array.isArray(p) ? { x: p[0], y: p[1] } : p);
    const al = o.align || 'center';
    const want = s.x + (o.dx || 0) - (al === 'right' ? w : al === 'left' ? 0 : w / 2);
    const left = clamp(want, 6, Math.max(6, b.W - 6 - w));
    b.text(p, str, { size: o.size || 12.5, weight: 800, ...o, align: 'left', dx: left - s.x, dy: o.dy || 0 });
  }
  const narrow = (b) => b.W < 640;

  /* ---------- 4. 장면 정의 ---------- */
  const scenes = [
    /* ===== 장면 1 · 정적분 vs 넓이 분할 ===== */
    {
      id: 'signed', title: '정적분 vs 넓이 분할', short: '정적분 vs 넓이',
      question: '같은 구간인데 정적분은 0이 될 수 있고 넓이는 0이 아닐 수 있는 이유는 무엇일까?',
      guide: hintOf(1) + ' 그림의 <b>금색 점</b>(a)과 <b>하늘색 점</b>(b)을 직접 끌어도 됩니다.',
      controls: ['a1', 'b1'],
      actions: actionsOf(null, '위끝 b 이동'),
      steps: examData[1].steps,
      problem: problemOf(1), solution: solutionOf(1), enter: enterOf(1),
      focus: { x: [-1.3, 3.7], y: [-1.4, 3.6] },
      tick: (s, dt) => { if (!s.playing) return false; bounce(s, 'b1', 1.2, 0.5, 3.2, dt); return true; },
      view: (s) => {
        const st = computeIntegralStats(F1, s.a1, s.b1);
        const zero = Math.abs(st.signed) < 0.02 && st.totalArea > 0.1;
        return {
          chips: [
            { k: '함수', tex: 'f(x) = x^2 - 2x = x(x - 2)', color: 'ink' },
            { k: '정적분', tex: '\\int_{a}^{b} f(x)\\,dx = S_1 - S_2', color: 'sky' }
          ],
          status: zero ? { tone: 'ok', text: `정적분은 0 이지만 실제 넓이는 ${fmt(st.totalArea)}` } : { tone: 'info', text: `정적분 ${fmt(st.signed)} · 넓이 ${fmt(st.totalArea)}` },
          readouts: [
            { label: '적분 구간 [a, b]', value: `[${fmt(s.a1)}, ${fmt(s.b1)}]`, color: 'amber', ref: 'range' },
            { label: 'S₁(x축 위) | S₂(x축 아래)', value: `${fmt(st.posArea)} | ${fmt(st.negArea)}`, color: 'rose', ref: 'S1' },
            { label: '정적분 S₁ − S₂', value: fmt(st.signed), color: 'sky', ref: 'S2' },
            { label: '실제 넓이 S₁ + S₂', value: fmt(st.totalArea), color: 'green' }
          ],
          tape: s.step >= 3 ? {
            title: `정적분 $\\int f(x)dx = S_1 - S_2$ = ${fmt(st.signed)}  |  실제 넓이 $\\int |f(x)|dx = S_1 + S_2$ = ${fmt(st.totalArea)}`,
            segments: [{ text: `S₁ ${fmt(st.posArea)}`, weight: Math.max(0.06, st.posArea), color: 'rose' }, { text: `S₂ ${fmt(st.negArea)}`, weight: Math.max(0.06, st.negArea), color: 'sky' }]
          } : null
        };
      },
      draw: (b, s) => {
        const a = Math.min(s.a1, s.b1), bb = Math.max(s.a1, s.b1);
        stage(b, s, 'main');
        // Step 1: 양수 영역(분홍)과 음수 영역(하늘) 자동 분리 색칠
        if (s.step >= 1 && bb - a > 0.02) fillBetween(b, F1, ZERO, a, bb, { pos: 'rose', neg: 'sky', alpha: 0.3, refPos: 'S1', refNeg: 'S2' });
        // Step 2: 영점 x=0, 2 및 영역 이름표
        if (s.step >= 2) {
          [0, 2].forEach((z) => {
            b.point([z, 0], { color: 'violet', r: 5 });
            if (!narrow(b)) tag(b, [z, 0], `영점 (${z}, 0)`, { color: 'violet', dy: 34 });
          });
          const cuts = [a, ...[0, 2].filter((z) => z > a && z < bb), bb];
          for (let i = 0; i + 1 < cuts.length; i++) {
            const lo = cuts[i], hi = cuts[i + 1];
            if (hi - lo < 0.3) continue;
            const xm = (lo + hi) / 2, ym = F1(xm);
            if (ym >= 0) tag(b, [xm, ym * 0.5], '+S₁', { color: 'rose', size: 13.5, ref: 'S1' });
            else tag(b, [xm, ym * 0.5], '−S₂', { color: 'sky', size: 13.5, ref: 'S2' });
          }
        }
        b.plot(F1, { color: 'ink', width: 3.2, glow: true });
        b.seg([s.a1, 0], [s.a1, F1(s.a1)], { color: 'amber', width: 2.2, dash: true, ref: 'range' });
        b.seg([s.b1, 0], [s.b1, F1(s.b1)], { color: 'sky', width: 2.2, dash: true, ref: 'range' });
        b.handle('a', [s.a1, 0], { color: 'amber', ref: 'range', drag: (w) => { let v = w.x; if (Math.abs(v) < 0.08) v = 0; s.a1 = clamp(round05(v), -1, 2.5); } });
        b.handle('b', [s.b1, 0], { color: 'sky', ref: 'range', priority: 1, drag: (w) => { let v = w.x; if (Math.abs(v - 3.0) < 0.08) v = 3.0; s.b1 = clamp(round05(v), -0.5, 3.3); } });
        if (narrow(b)) {
          tag(b, [s.a1, 0], `a = ${fmt(s.a1)}`, { color: 'amber', dy: 34 });
          tag(b, [s.b1, 0], `b = ${fmt(s.b1)}`, { color: 'sky', dy: 34 });
        } else {
          tag(b, [s.a1, 0], `아래끝 a = ${fmt(s.a1)}`, { color: 'amber', dx: -14, dy: -14, align: 'right' });
          tag(b, [s.b1, 0], `위끝 b = ${fmt(s.b1)}`, { color: 'sky', dy: -18 });
        }
        paneEnd(b);
      }
    },

    /* ===== 장면 2 · 포물선 1/6 & 이등분 ===== */
    {
      id: 'sixth', title: '포물선 1/6 & 이등분', short: '1/6 & 이등분',
      question: '직선 y = mx 가 포물선과 x축 사이의 넓이를 반으로 나누려면 기울기 m은 얼마여야 할까?',
      guide: hintOf(2) + ' 그림의 <b>금색 점</b>(교점)을 좌우로 끌어도 됩니다. 이등분 값 근처에서는 점이 자석처럼 붙습니다.',
      controls: ['m2'],
      actions: actionsOf('차함수 h(x)=f(x)−g(x) 동기화 뷰', '기울기 m 이동'),
      steps: examData[2].steps,
      problem: problemOf(2), solution: solutionOf(2), enter: enterOf(2),
      focus: { x: [-0.9, 4.0], y: [-1.3, 3.0] },
      panes: panesOf([-1.3, 3.0], [-0.8, 2.6]),
      tick: (s, dt) => { if (!s.playing) return false; bounce(s, 'm2', 0.9, 0.0, 2.2, dt); return true; },
      view: (s, lab) => {
        const m = s.m2, L = Math.max(0, 3.0 - m), s1 = Math.pow(L, 3) / 6.0, ratio = s1 / 4.5;
        const half = Math.abs(ratio - 0.5) < 0.008;
        return {
          ...topInfo(s, lab, [
            { k: '함수', tex: `f(x) = -x^2 + 3x, \\; g(x) = ${num(m)}x`, color: 'ink' },
            { k: '윗부분', tex: `S_1 = \\dfrac{1}{6}(3-m)^3 = ${num(s1)}`, color: 'rose' }
          ], half ? { tone: 'ok', text: `이등분! S₁ = ${fmt(s1)} = S₀ / 2` } : { tone: 'info', text: `S₁ = ${fmt(s1)} (전체의 ${fmt(ratio * 100, 1)}%)` }),
          readouts: [
            { label: '교점 구간 [0, 3−m]', value: `[0, ${fmt(L)}]`, color: 'amber', ref: 'beta', note: `L = ${fmt(L)}` },
            { label: 'S₁(윗부분) | S₀(전체)', value: `${fmt(s1)} | 4.50`, color: 'rose', ref: 'S1' },
            { label: '비율 S₁ / S₀', value: `${fmt(ratio * 100, 1)}%`, color: 'sky', ref: 'S0' },
            { label: '(3 − m)³', value: fmt(Math.pow(L, 3)), color: 'violet', note: '이등분이면 27/2 = 13.50' }
          ],
          tape: s.step >= 3 ? { title: `포물선과 직선 넓이 $S_1 = \\dfrac{|a|}{6}(3-m)^3$ = ${fmt(s1)}  (전체 넓이 4.50)` } : null
        };
      },
      draw: (b, s) => {
        const m = s.m2, beta = Math.max(0, 3.0 - m), G = G2(m);
        stage(b, s, 'main');
        // Step 1: 전체 포물선과 x축 사이 영역 S0 연한 배경 색칠
        if (s.step >= 1) fillBetween(b, F2, ZERO, 0, 3, { pos: 'sky', neg: 'sky', alpha: 0.16, refPos: 'S0', refNeg: 'S0' });
        // Step 2: 직선 y = mx 와 포물선 사이 윗부분 영역 S1 진한 분홍 색칠
        if (s.step >= 2 && beta > 0.02) {
          fillBetween(b, F2, G, 0, beta, { pos: 'rose', neg: 'rose', alpha: 0.34, refPos: 'S1', refNeg: 'S1' });
          const areaS1 = Math.pow(beta, 3) / 6.0;
          const xm = beta * 0.42;
          tag(b, [xm, (F2(xm) + G(xm)) / 2 + 0.1], narrow(b) ? `S₁ = ${fmt(areaS1)}` : `S₁ = ${fmt(areaS1)} (${fmt((areaS1 / 4.5) * 100, 0)}%)`, { color: 'amber', size: 12.5, ref: 'S1' });
        }
        b.plot(F2, { color: 'ink', width: 3.2, glow: true });
        b.line([0, 0], m, { color: 'rose', width: 2.6, glow: true, ref: 'beta' });
        b.handle('beta', [beta, F2(beta)], { color: 'amber', ref: 'beta', label: narrow(b) ? `교점 ${fmt(beta)}` : `교점 (3−m = ${fmt(beta)})`, dx: 12, dy: -14,
          drag: (w) => { const be = clamp(w.x, 0.5, 3.0); let mm = 3.0 - be; if (Math.abs(mm - MBISECT) < 0.04) mm = MBISECT; s.m2 = clamp(R(mm), 0, 2.5); } });
        paneEnd(b);
        // 하단: 차함수 h(x) = f(x) − g(x) 와 x축 사이 (같은 넓이 S₁)
        if (s.dual) {
          const H = (x) => F2(x) - G(x);
          stage(b, s, 'sub', { yLabel: 'h' });
          if (beta > 0.02) fillBetween(b, H, ZERO, 0, beta, { pos: 'rose', neg: 'sky', alpha: 0.32, refPos: 'S1', refNeg: 'S1' });
          b.plot(H, { color: 'amber', width: 3.2, glow: true, ref: 'S1' });
          if (beta > 0.02) {
            b.point([0, 0], { color: 'violet', r: 5 });
            b.point([beta, 0], { color: 'amber', r: 6, ref: 'beta' });
          }
          paneEnd(b);
          subTitle(b, narrow(b) ? '아래: 차함수 h(x) = f(x) − g(x)' : '아래: 차함수 h(x) = f(x) − g(x) 와 x축 사이 (위와 같은 넓이 S₁)');
          linkX(b, beta, 'amber');
        }
        b.use('main');
      }
    },

    /* ===== 장면 3 · 삼차 넓이 S₁ = S₂ ===== */
    {
      id: 'cubic', title: '삼차 넓이 S₁ = S₂', short: '삼차 S₁=S₂',

          status: equal ? { tone: 'ok', text: 'β = 1 등간격(변곡점) → S₁ = S₂ 일치' } : { tone: 'warn', text: `β ≠ 1 비대칭 → S₁ ≠ S₂ (차이 ${fmt(Math.abs(st1.totalArea - st2.totalArea))})` },
          readouts: [
            { label: '교점 −1 : β : 3', value: `−1 : ${fmt(beta)} : 3`, color: 'amber', ref: 'beta' },

            { label: '정적분 ∫₋₁³ f', value: fmt(st1.totalArea - st2.totalArea), color: 'sky', ref: 'S2' },

          tape: s.step >= 3 ? {
            title: `S₁(${fmt(st1.totalArea)}) vs S₂(${fmt(st2.totalArea)})  ⇒  ${equal ? 'β=1 등간격(변곡점)이므로 S₁ = S₂ 일치!' : 'β ≠ 1 비대칭이므로 S₁ ≠ S₂'}`,
            segments: [{ text: `S₁ ${fmt(st1.totalArea)}`, weight: Math.max(0.06, st1.totalArea), color: 'rose' }, { text: `S₂ ${fmt(st2.totalArea)}`, weight: Math.max(0.06, st2.totalArea), color: 'sky' }]
          } : null
        };
      },
      draw: (b, s) => {
        const alpha = -1.0, gamma = 3.0, beta = clamp(s.beta3, -0.8, 2.8), F = F3(beta);

        const st2 = computeIntegralStats(F, beta, gamma);
        stage(b, s, 'main');
        // Step 1: S1 [-1, β] 분홍, S2 [β, 3] 하늘
        if (s.step >= 1) fillBetween(b, F, ZERO, alpha, gamma, { pos: 'rose', neg: 'sky', alpha: 0.28, refPos: 'S1', refNeg: 'S2' });
        // Step 2: 두 영역의 넓이 값
        if (s.step >= 2) {
          const xm1 = (alpha + beta) / 2, xm2 = (beta + gamma) / 2;
          tag(b, [xm1, F(xm1) * 0.45], narrow(b) ? 'S₁' : `S₁ = ${fmt(st1.totalArea)}`, { color: 'rose', size: 13.5, ref: 'S1' });
          tag(b, [xm2, F(xm2) * 0.45], narrow(b) ? 'S₂' : `S₂ = ${fmt(st2.totalArea)}`, { color: 'sky', size: 13.5, ref: 'S2' });
        }
        b.plot(F, { color: 'ink', width: 3.2, glow: true });
        b.point([alpha, 0], { color: 'green', r: 5.5 });
        b.point([gamma, 0], { color: 'green', r: 5.5 });
        tag(b, [alpha, 0], 'α = −1', { color: 'green', dy: 34 });
        tag(b, [gamma, 0], 'γ = 3', { color: 'green', dy: 34 });
        b.handle('beta', [beta, 0], { color: 'amber', ref: 'beta', drag: (w) => { let v = w.x; if (Math.abs(v - 1.0) < 0.08) v = 1.0; s.beta3 = clamp(round05(v), -0.8, 2.8); } });
        tag(b, [beta, 0], narrow(b) ? `β = ${fmt(beta)}` : `β = ${fmt(beta)} [드래그]`, { color: 'amber', dx: 14, dy: -16, align: 'left' });
        paneEnd(b);
      }
    },

    {
      id: 'diff', title: '두 곡선 ↔ 차함수 동기화', short: '차함수 동기화',
      question: '두 곡선 사이의 넓이를 차함수 h(x) = f(x) − g(x) 와 x축 사이의 넓이로 바꿔 구할 수 있는 이유는 무엇일까?',
      guide: hintOf(4) + ' 곡선 g 위의 <b>금색 점</b>을 위아래로 끌면 기울기 m이 바뀝니다(m = −0.5 가 문제 조건).',

      tick: (s, dt) => { if (!s.playing) return false; bounce(s, 'm4', 0.6, -1.4, 0.4, dt); return true; },
      view: (s, lab) => {

          ...topInfo(s, lab, [
            { k: '두 함수', tex: `f(x) = \\dfrac{1}{2}x^3 - \\dfrac{1}{2}x + 1, \\; g(x) = \\dfrac{1}{2}x^2 + (${num(m)})x + 1`, color: 'ink' },
            { k: '차함수', tex: exact ? 'h(x) = f(x) - g(x) = \\dfrac{1}{2}x^2(x-1)' : 'h(x) = f(x) - g(x) = \\dfrac{1}{2}x^3 - \\dfrac{1}{2}x^2 - \\left(\\dfrac{1}{2} + m\\right)x', color: 'amber' }
          ], exact ? { tone: 'ok', text: `m = −0.5 : x = 0 접점, x = 1 교점 → 넓이 S = 1/24 (≈ ${fmt(S, 3)})` } : { tone: 'info', text: `구간 [0, 1] 에서 두 곡선 사이 넓이 ${fmt(S, 3)} (m = −0.5 로 맞추면 접점·교점)` }),
          readouts: [
            { label: 'g 의 기울기 m', value: fmt(m), color: 'amber', ref: 'g', note: 'f 의 x=0 기울기는 −0.5' },
            { label: '두 곡선의 만남', value: exact ? 'x = 0(접점), 1(교점)' : '구간 [0, 1] 비교', color: 'rose', ref: 'pts' },
            { label: '구간 폭 L', value: '1.00', color: 'sky' },
            { label: '넓이 S', value: exact ? '1/24 (0.042)' : fmt(S, 3), color: 'green', ref: 'S' }
          ],
          tape: s.step >= 3 ? { title: '등적변환 원리: $\\int |f(x) - g(x)|dx = \\int |h(x)|dx$  (차함수 인수분해로 1/12 공식 즉시 적용!)' } : null
        };
      },
      draw: (b, s) => {

        if (s.step >= 2) tag(b, [0.5, Math.min(F4(0.5), G(0.5))], `S = ${fmt(S, 3)}`, { color: 'amber', size: 13, dy: 24, ref: 'S' });
        b.plot(F4, { color: 'ink', width: 3.2, glow: true, ref: 'f' });
        b.plot(G, { color: 'sky', width: 3, glow: true, ref: 'g' });
        if (exact) {
          b.point([0, F4(0)], { color: 'amber', r: 6.5, ref: 'pts' });
          b.point([1, F4(1)], { color: 'rose', r: 6.5, ref: 'pts' });
          tag(b, [0, F4(0)], '접점 (0, 1)', { color: 'amber', dx: -8, dy: -16, align: 'right', ref: 'pts' });

    /* ===== 장면 5 · 역함수 정적분 퍼즐 ===== */
    {
      id: 'inverse', title: '역함수 정적분 퍼즐', short: '역함수 퍼즐',
      question: '원함수의 정적분과 역함수의 정적분을 더하면 왜 두 직사각형의 차 b·f(b) − a·f(a) 가 될까?',
      guide: hintOf(5) + ' 점 A와 B는 곡선 위에서 직접 끌 수 있습니다.',
      controls: ['a5', 'b5'],
      actions: actionsOf(null, '위끝 b 이동'),
      steps: examData[5].steps,
      problem: problemOf(5), solution: solutionOf(5), enter: enterOf(5),
      focus: { x: [-0.8, 3.0], y: [-0.6, 3.9] },
      tick: (s, dt) => { if (!s.playing) return false; bounce(s, 'b5', 1.2, Math.max(0.5, s.a5 + 0.3), 2.2, dt); return true; },
      view: (s) => {
        const a = s.a5, b = s.b5, fa = F5(a), fb = F5(b);
        const stF = computeIntegralStats(F5, a, b);
        const totalL = b * fb - a * fa;
        const stInv = totalL - stF.totalArea;
        return {
          chips: [
            { k: '함수', tex: 'f(x) = \\dfrac{1}{4}x^3 + \\dfrac{1}{2}x', color: 'ink' },
            { k: '퍼즐', tex: `b f(b) - a f(a) = ${num(totalL)}`, color: 'amber' }
          ],
          status: { tone: 'info', text: `∫f = ${fmt(stF.totalArea)} + ∫f⁻¹ = ${fmt(stInv)} → 합 ${fmt(totalL)}` },
          readouts: [
            { label: '구간 a, b', value: `a=${fmt(a)}, b=${fmt(b)}`, color: 'amber', ref: 'A' },
            { label: '∫f (분홍) | ∫f⁻¹ (하늘)', value: `${fmt(stF.totalArea)} | ${fmt(stInv)}`, color: 'rose', ref: 'S1' },
            { label: 'b·f(b)', value: fmt(b * fb), color: 'sky', ref: 'B' },
            { label: '합 = b·f(b) − a·f(a)', value: fmt(totalL), color: 'green', ref: 'rect' }
          ],
          tape: s.step >= 3 ? { title: `역함수 적분 퍼즐: b·f(b)[${fmt(b * fb)}] - a·f(a)[${fmt(a * fa)}] = ${fmt(totalL)}`,
            segments: [{ text: `∫f ${fmt(stF.totalArea)}`, weight: Math.max(0.06, stF.totalArea), color: 'rose' }, { text: `∫f⁻¹ ${fmt(stInv)}`, weight: Math.max(0.06, stInv), color: 'sky' }] } : null
        };
      },
      draw: (b, s) => {
        const a = s.a5, bb = s.b5, fa = F5(a), fb = F5(bb);
        stage(b, s, 'main');
        // Step 1: x축 쪽 원함수 정적분 영역 ∫_a^b f(x)dx (분홍색)
        if (s.step >= 1) fillBetween(b, F5, ZERO, a, bb, { pos: 'rose', neg: 'rose', alpha: 0.3, refPos: 'S1', refNeg: 'S1' });
        // Step 2: y축 쪽 역함수 정적분 영역 ∫_{f(a)}^{f(b)} f⁻¹(y)dy (하늘색)
        if (s.step >= 2) {
          const pts = [[0, fa]];
          const N = 60;
          for (let i = 0; i <= N; i++) { const x = a + ((bb - a) * i) / N; pts.push([x, F5(x)]); }
          pts.push([0, fb]);
          b.poly(pts, { fill: 'sky', fillAlpha: 0.3, color: null, ref: 'S2' });
        }
        // Step 3: 큰 직사각형 b·f(b) 와 작은 직사각형 a·f(a) 테두리 강조
        if (s.step >= 3) {
          b.poly([[0, 0], [bb, 0], [bb, fb], [0, fb]], { color: 'amber', width: 2.2, dash: true, ref: 'rect' });
          b.poly([[0, 0], [a, 0], [a, fa], [0, fa]], { fill: 'halo', fillAlpha: 0.65, color: 'red', width: 2, ref: 'rect' });
          tag(b, [a / 2, fa * 0.35], narrow(b) ? 'a·f(a)' : `제외: a·f(a) = ${fmt(a * fa)}`, { color: 'red', size: 12, ref: 'rect' });
          tag(b, [0, fb], narrow(b) ? 'b·f(b)' : `b·f(b) = ${fmt(bb * fb)}`, { color: 'amber', dx: 8, dy: -10, align: 'left', ref: 'rect' });
        }
        b.plot(F5, { color: 'ink', width: 3.2, glow: true });
        b.handle('A', [a, fa], { color: 'amber', ref: 'A', label: narrow(b) ? 'A' : `A(${fmt(a)}, ${fmt(fa)})`, dx: -14, dy: -14, align: 'right',
          drag: (w) => { s.a5 = clamp(round05(w.x), 0.2, 1.6); if (s.b5 < s.a5 + 0.3) s.b5 = round05(s.a5 + 0.3); } });
        b.handle('B', [bb, fb], { color: 'sky', ref: 'B', priority: 1, label: narrow(b) ? 'B' : `B(${fmt(bb)}, ${fmt(fb)})`, dx: 12, dy: -14,
          drag: (w) => { s.b5 = clamp(round05(w.x), Math.max(0.5, s.a5 + 0.3), 2.2); } });
        paneEnd(b);
      }
    }
  ];
