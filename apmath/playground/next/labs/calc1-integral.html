window.addEventListener('DOMContentLoaded', function () {
  const { tex, fmt, clamp } = APLab;

  /* ---------- 1. 모드별 수학 함수와 원시함수 ---------- */
  // 장면 1: f(x) = x^2 - 2x = x(x - 2) (0~2 음수, 2~3 양수)
  const F1 = (x) => x * (x - 2.0);
  // 장면 2: 위로 볼록 포물선 f(x) = -x^2 + 3x = x(3 - x), 원점을 지나는 직선 g(x) = m*x
  const F2 = (x) => -x * x + 3.0 * x;
  const G2 = (m) => (x) => m * x;
  // 장면 3: 삼차함수 f(x) = 0.5 (x - α)(x - β)(x - γ), α = -1, γ = 3 고정, β 가 움직임
  const F3 = (beta) => (x) => 0.5 * (x + 1.0) * (x - beta) * (x - 3.0);
  // 장면 4: 삼차함수 f(x) = 0.5x^3 - 0.5x + 1, 이차함수 g(x) = 0.5x^2 + m*x + 1 (f(x)-g(x) = 0.5x(x^2 - x - 1 - 2m))
  const F4 = (x) => 0.5 * x * x * x - 0.5 * x + 1.0;
  const G4 = (m) => (x) => 0.5 * x * x + m * x + 1.0;
  // 장면 5: 단조증가 함수 f(x) = 0.25x^3 + 0.5x (역함수 존재!)
  const F5 = (x) => 0.25 * x * x * x + 0.5 * x;
  const ZERO = () => 0;
  const MBISECT = 3.0 - 3.0 / Math.cbrt(2); // (3 - m)^3 = 27/2 인 m

  // 다항식의 원시함수와 정확한 영점으로 부호 구간을 나눕니다.
  // 표시 소수는 근사이지만 면적을 픽셀·중점 표본으로 추정하지 않습니다.
  function polynomialStats(primitive, roots, x1, x2) {
    const a = Math.min(x1, x2), b = Math.max(x1, x2);
    const cuts = [a, ...roots.filter(x => x > a && x < b), b].sort((x,y) => x-y).filter((x,i,all) => !i || !same(x,all[i-1]));
    let pos = 0, neg = 0;
    for (let i = 1; i < cuts.length; i++) {
      const value = primitive(cuts[i]) - primitive(cuts[i-1]);
      if (value >= 0) pos += value; else neg -= value;
    }
    return { signed: primitive(x2) - primitive(x1), posArea: pos, negArea: neg, totalArea: pos + neg };
  }
  const P1 = x => x ** 3 / 3 - x * x;
  const P3 = beta => x => x ** 4 / 8 - (beta + 2) * x ** 3 / 6 + (2 * beta - 3) * x * x / 4 + 1.5 * beta * x;
  const P5 = x => x ** 4 / 16 + x * x / 4;
  function diffStats(m) {
    const D = 5 + 8 * m, roots = [0];
    if (D >= 0) roots.push((1 - Math.sqrt(D)) / 2, (1 + Math.sqrt(D)) / 2);
    return polynomialStats(x => x ** 4 / 8 - x ** 3 / 6 - (.5 + m) * x * x / 2, roots, 0, 1);
  }

    const examData = {

③ 위끝 3과 아래끝 −1을 대입해 방정식을 풀면 ${tex('\\beta = 1')} 을 얻습니다.`,

  // 두 곡선 f, g 사이를 색칠(f가 위이면 pos 색, 아래이면 neg 색). 부호가 바뀌는 곳에서 조각을 나눕니다.
  function fillBetween(b, f, g, x0, x1, o) {
    if (!(x1 - x0 > 1e-6)) return;
    const N = 160;
    let piece = null;
    const flush = () => {
      if (piece && piece.top.length > 1 && piece.mx > 1e-4) {
        const pos = piece.sign >= 0;
        b.poly(piece.top.concat(piece.bot.slice().reverse()), { fill: pos ? o.pos : o.neg, fillAlpha: o.alpha == null ? 0.3 : o.alpha, color: null, ref: pos ? o.refPos : o.refNeg });
      }
      piece = null;
    };
    const add = (x, d) => {
      if (!piece) piece = { sign: 0, top: [], bot: [], mx: 0 };
      if (piece.sign === 0 && d !== 0) piece.sign = d > 0 ? 1 : -1;
      piece.top.push([x, f(x)]);
      piece.bot.push([x, g(x)]);
      piece.mx = Math.max(piece.mx, Math.abs(d));
    };
    let px = x0;
    let pd = f(x0) - g(x0);
    let last = pd === 0 ? 0 : pd > 0 ? 1 : -1; // 마지막으로 0이 아니었던 부호 (눈금에 0이 정확히 걸려도 놓치지 않게)
    add(px, pd);
    for (let i = 1; i <= N; i++) {
      const x = x0 + ((x1 - x0) * i) / N;
      const d = f(x) - g(x);
      if (d !== 0) {
        const sg = d > 0 ? 1 : -1;
        if (last !== 0 && sg !== last) {
          const xc = pd === 0 ? px : px + ((x - px) * Math.abs(pd)) / (Math.abs(pd) + Math.abs(d));
          if (pd !== 0) add(xc, 0);
          flush();
          add(xc, 0);
        }
        last = sg;
      }
      add(x, d);
      px = x;
      pd = d;
    }
    flush();
  }

    b.text(p, str, { size: o.size || 12.5, weight: 800, ...o, align: 'left', dx: left - s.x, dy: o.dy || 0 });

      const r = kind === 'half' ? ouQ(1, 2) : ouQ(1, 8), S0 = ouQ(L * L * L, 6), cube = r.mul(L * L * L);
      const xq = kind === 'half' ? L * Math.cbrt(0.5) : L / 2, m = L - xq, mq = kind === 'eighth' ? ouQ(L, 2) : null;
      const f = (x) => -x * x + L * x;
      const win = ouWin([[0, 0], [L, 0], [L / 2, (L * L) / 4]], { mx: 1.3, my: 1.3, minW: 6, minH: 5 });
      return { L, kind, S0, cube, xq, m, mq, f, win, key: [L, kind].join(), chk: { L, kind, S0: S0.v, cube: cube.v, m: mq ? mq.v : null } };
    },
    text: (v) => `곡선 ${tex('y = -x^2 + ' + ouTerm(v.L, 'x'))} 와 ${tex('x')}축으로 둘러싸인 부분의 넓이 ${tex('S_0')}를 구하고, ` + (v.kind === 'half'
      ? `원점을 지나는 직선 ${tex('y = mx')} 가 이 넓이를 이등분할 때 상수 ${tex(`(${v.L} - m)^3`)} 의 값을 구하시오.`
      : `원점을 지나는 직선 ${tex('y = mx')} 와 곡선으로 둘러싸인 부분의 넓이가 ${tex('S_0')} 의 ${tex('\\dfrac{1}{8}')} 일 때 ${tex(`(${v.L} - m)^3`)} 의 값과 상수 ${tex('m')}의 값을 구하시오. (단, ${tex(`0 < m < ${v.L}`)})`),
    ans: (v) => `전체 넓이 ${tex('S_0 = ' + v.S0.tex)}, ` + (v.kind === 'half' ? `이등분 조건 ${tex(`(${v.L} - m)^3 = ${v.cube.tex}`)}` : `${tex(`(${v.L} - m)^3 = ${v.cube.tex}`)}, ${tex('m = ' + v.mq.tex)}`),
    standard: (v) => ({steps:`① 전체 넓이는 ${tex(`S_0=\\int_0^{${v.L}}(-x^2+${v.L}x)\\,dx=[-x^3/3+${v.L}x^2/2]_0^{${v.L}}=${v.S0.tex}`)}입니다.<br>② 두 그래프의 차는 ${tex(`-x^2+(${v.L}-m)x`)}이고 교점은 ${tex(`0,${v.L}-m`)}이므로 ${tex(`S_1=\\int_0^{${v.L}-m}(-x^2+(${v.L}-m)x)\\,dx=(${v.L}-m)^3/6`)}입니다.<br>③ ${tex(`S_1=S_0/${v.kind==='half'?2:8}`)}를 대입하면 ${tex(`(${v.L}-m)^3=${v.cube.tex}`)}${v.mq?`, ${tex('m='+v.mq.tex)}`:''}입니다.`,warning:'0<m<L인 내부 교점 조건에서 위쪽 영역을 적분합니다. 같은 이차계수를 유지하면 간격의 세제곱 비로 두 적분을 줄일 수 있습니다.'}),
    steps: (v) => [
      `곡선과 $x$축의 교점은 $x=0$, $x=${v.L}$ 이고 간격은 ${v.L} 입니다. 전체 넓이는 $S_0=\\dfrac{1}{6}\\cdot ${v.L}^3=${v.S0.tex}$.`,
      `직선 $y=mx$ 와 곡선의 교점은 $x=0$, $x=${v.L}-m$ 이므로 교점 간격은 $${v.L}-m$ 이고, 둘러싸인 부분의 넓이는 $S_1=\\dfrac{1}{6}(${v.L}-m)^3$ 입니다. (넓이는 간격의 세제곱에 비례합니다)`,
      v.kind === 'half' ? `$S_1=\\dfrac{1}{2}S_0$ 이므로 $\\dfrac{1}{6}(${v.L}-m)^3=\\dfrac{1}{2}\\cdot ${v.S0.tex}$, 즉 $(${v.L}-m)^3=${v.cube.tex}$.` : `$S_1=\\dfrac{1}{8}S_0$ 이므로 $(${v.L}-m)^3=\\dfrac{1}{8}\\cdot ${v.L}^3=${v.cube.tex}$, 따라서 $${v.L}-m=\\dfrac{${v.L}}{2}$ 에서 $m=${v.mq.tex}$.`
    ],
    core: '<b>포물선과 직선 사이의 넓이는 간격의 세제곱에 비례합니다</b><br>이차항의 계수가 $a$ 인 포물선과 직선이 $x=\\alpha,\\beta$ 에서 만나면 둘러싸인 넓이는 $\\dfrac{|a|}{6}(\\beta-\\alpha)^3$ 입니다. 넓이를 이등분하면 새 교점 간격의 세제곱이 처음 간격의 세제곱의 절반이 됩니다.',
    draw: (b, s, v, st) => {
      const f = v.f, line = (x) => v.m * x;
      ouBetween(b, f, () => 0, 0, v.L, { pos: 'amber', neg: 'amber', alpha: 0.16 });
      b.plot(f, { color: 'ink', width: 3.2, glow: true });
      ouCurveTag(b, f, `y = −x² + ${ouTerm(v.L, 'x')}`, 'ink', { side: 'left', dy: -6, skip: [] });
      if (st >= 1) {
        b.point([0, 0], { color: 'ink', r: 5, label: 'O', dx: -8, dy: 16, align: 'right' });
        b.point([v.L, 0], { color: 'ink', r: 5.5, label: `(${v.L}, 0)`, dx: 4, dy: 20, align: 'left' });
        lbl(b, [v.L * 0.78, v.f(v.L * 0.78) / 3], `S₀ = ${v.S0.txt}`, { color: 'amber', size: 13 });
      }
      if (st >= 2) {
        ouBetween(b, f, line, 0, v.xq, { pos: 'rose', neg: 'rose', alpha: 0.38 });
        b.line([0, 0], v.m, { extent: [-0.4, v.L + 0.3], color: 'sky', width: 2.6, glow: true });
        b.point([v.xq, line(v.xq)], { color: 'sky', r: 6, label: `x = ${v.L} − m`, dx: 10, dy: -14, align: 'left' });
        lbl(b, [v.xq / 2, (f(v.xq / 2) + line(v.xq / 2)) / 2], 'S₁', { color: 'rose', size: 14 });
      }
      if (st >= 3) { const vb = b.viewBox(); ouTop(b, `(${v.L} − m)³ = ${v.cube.txt}`, { color: 'green', size: 13 }); }
    }
  });

  /* 장면 3 · 삼차함수 S₁ = S₂ */
  ouUpgrade(scenes[2], {
    m: 3,
    gen: (prev) => {
      let a, al, ga;
      if (!prev) { a = ouQ(1, 2); al = -1; ga = 3; }
      else { a = ouPick([ouQ(1, 2), ouQ(1, 1), ouQ(2, 1), ouQ(-1, 1), ouQ(-1, 2), ouQ(-2, 1)]); [al, ga] = ouPick([[-1, 3], [-2, 4], [0, 4], [1, 5], [-3, 1], [-2, 2], [0, 2], [-1, 1], [-3, 3]]); }
      const be = (al + ga) / 2, d = (ga - al) / 2, S = a.mul(a.sgn).mul(d * d * d * d).div(4);
      const f = (x) => a.v * (x - al) * (x - be) * (x - ga);
      const bex = al + (ga - al) / 3, ghost = (x) => a.v * (x - al) * (x - bex) * (x - ga);
      const win = ouWinF([f, ghost], [al, ga], { pts: [[al, 0], [ga, 0]], mx: 1.2, my: 1.4, minW: 6, minH: 4.6 });
      if (prev && win.y[1] - win.y[0] > 16) return null;
      return { a, al, ga, be, d, S, f, ghost, win, key: [a.txt, al, ga].join(), chk: { a: a.v, al, ga, be, S: S.v } };
    },
    text: (v) => `삼차함수 ${tex(`f(x) = ${ouCoQ(v.a)}${ouFac(v.al)}(x - \\beta)${ouFac(v.ga)} \; (${v.al} < \\beta < ${v.ga})`)} 의 그래프와 ${tex('x')}축으로 둘러싸인 두 부분의 넓이 ${tex('S_1, S_2')}가 서로 같을 때(${tex('S_1 = S_2')}), 상수 ${tex('\\beta')}의 값과 ${tex('S_1')}의 넓이를 구하시오.`,
    ans: (v) => `${tex(`\\beta = ${v.be}`)} (${v.al}과 ${v.ga}의 한가운데), 한쪽 넓이 ${tex('S_1 = S_2 = ' + v.S.tex)}`,
    standard: (v) => {
      const coeff=v.a.mul(4*v.d**3).div(3), absA=v.a.mul(v.a.sgn);
      return {steps:`① ${tex('f(x)=a[x^3-(\\alpha+\\beta+\\gamma)x^2+(\\alpha\\beta+\\beta\\gamma+\\gamma\\alpha)x-\\alpha\\beta\\gamma]')}를 원시함수로 적분합니다.<br>② ${tex(`\\alpha=${v.al},\\gamma=${v.ga},a=${v.a.tex}`)}를 넣으면 ${tex(`\\int_{${v.al}}^{${v.ga}}f(x)\\,dx=${coeff.tex}(\\beta-(${v.be}))`)}입니다. 두 영역이 같아 이 값이 0이고 계수는 0이 아니므로 ${tex(`\\beta=${v.be}`)}입니다.<br>③ ${tex(`u=x-(${v.be})`)}로 중심을 옮기면 ${tex(`f=a(u^3-${v.d**2}u)`)}입니다. 한쪽 넓이는 ${tex(`S_1=|a|\\left|[u^4/4-${v.d**2}u^2/2]_{-${v.d}}^0\\right|=${absA.tex}\\cdot ${v.d**4}/4=${v.S.tex}`)}입니다.`,warning:'대칭인 위치가 조건을 만족한다는 확인만으로는 유일성을 증명하지 못합니다. 전체 정적분이 β에 관한 일차식임을 확인하면 필요조건도 얻습니다.'};
    },
    steps: (v) => [
      `세 교점 $x=${v.al}$, $\\beta$, $x=${v.ga}$ 에서 곡선이 $x$축과 만나고, 왼쪽 부분을 $S_1$, 오른쪽 부분을 $S_2$ 라 합니다. 두 부분은 $x$축의 위·아래에 있으므로 $S_1=S_2$ 이면 $\\int_{${v.al}}^{${v.ga}} f(x)\\,dx=0$ 입니다.`,
      `두 끝의 중점 $c=${v.be}$, 반간격 $d=${v.d}$를 쓰고 $u=x-c$로 옮기면 $f=a(u^2-d^2)(u-(\\beta-c))$입니다. 대칭 구간에서 홀수항이 상쇄되어 $\\int_{${v.al}}^{${v.ga}}f\\,dx=\\dfrac{4ad^3}{3}(\\beta-c)$입니다. $a\\ne0$, $d>0$이므로 이 값이 0일 필요충분조건은 $\\beta=c=${v.be}$입니다.`,
      `간격 $d=\\beta-(${v.al})=${v.d}$ 이므로 한쪽 넓이는 $S_1=\\dfrac{|a|}{4}d^4=\\dfrac{${v.a.abs ? '' : ''}${Math.abs(v.a.n)}${v.a.d === 1 ? '' : '/' + v.a.d}}{4}\\cdot ${v.d}^4=${v.S.tex}$.`
    ],
    core: '<b>S₁ = S₂ 이면 가운데 교점은 한가운데</b><br>삼차함수 $y=a(x-\\alpha)(x-\\beta)(x-\\gamma)$ 의 그래프와 $x$축으로 둘러싸인 두 부분의 넓이가 같으면 $\\int_\\alpha^\\gamma f\\,dx=0$ 이고 $\\beta=\\dfrac{\\alpha+\\gamma}{2}$ 입니다. 한쪽 넓이는 $\\dfrac{|a|}{4}d^4$ ($d=\\beta-\\alpha$) 입니다.',
    draw: (b, s, v, st) => {
      const top = (v.a.v > 0) ? 'rose' : 'sky';
      b.point([v.al, 0], { color: 'ink', r: 5.5, label: `(${v.al}, 0)`, dx: -6, dy: 20, align: 'right' });
      b.point([v.ga, 0], { color: 'ink', r: 5.5, label: `(${v.ga}, 0)`, dx: 6, dy: 20, align: 'left' });
      if (st === 0) {
        b.plot(v.ghost, { from: v.al, to: v.ga, color: 'muted', width: 2.4, dash: true });
        const vb = b.viewBox();
        ouTop(b, '점선은 예시입니다. β의 위치에 따라 모양이 달라집니다', { color: 'muted', size: 12.5 });
      } else {
        ouBetween(b, v.f, () => 0, v.al, v.ga, { pos: 'rose', neg: 'sky', alpha: 0.32 });
        b.plot(v.f, { color: 'ink', width: 3.2, glow: true });
        const c1 = (v.al + v.be) / 2, c2 = (v.be + v.ga) / 2;
        lbl(b, [c1, v.f(c1) / 2], 'S₁', { color: v.a.v > 0 ? 'rose' : 'sky', size: 14 });
        lbl(b, [c2, v.f(c2) / 2], 'S₂', { color: v.a.v > 0 ? 'sky' : 'rose', size: 14 });
      }
      if (st >= 2) {
        b.seg([v.be, v.win.y[0]], [v.be, v.win.y[1]], { color: 'amber', width: 1.5, dash: true, alpha: 0.7 });
        b.point([v.be, 0], { color: 'amber', r: 6.5, label: `β = ${v.be}`, dx: 0, dy: v.a.v > 0 ? 22 : -18, align: 'center' });
      }
      if (st >= 3) { const vb = b.viewBox(); ouTop(b, `S₁ = S₂ = ${v.S.txt}`, { color: 'green', size: 13 }); }
    }
  });

  /* 장면 4 · 두 곡선 사이의 넓이와 h = f − g */
  ouUpgrade(scenes[3], {
    m: 4,
    gen: (prev) => {
      let a, al, be, g;
      if (!prev) { a = ouQ(1, 2); al = 0; be = 1; g = [ouQ(1, 2), ouQ(-1, 2), ouQ(1)]; }
      else { a = ouPick([ouQ(1, 2), ouQ(1), ouQ(2), ouQ(-1), ouQ(3)]); al = ouPick([-1, 0, 1]); be = al + ouPick([1, 2, -1, -2, 3]); g = [ouPick([ouQ(1), ouQ(-1), ouQ(2), ouQ(1, 2)]), ouQ(ouPick([-2, -1, 0, 1, 2])), ouQ(ouPick([0, 1, 2, 3]))]; }
      const h = ouMul(ouMul([a], [1, -al]), ouMul([1, -al], [1, -be])).slice(-4), hco = ouMul([a], ouMul(ouMul([1, -al], [1, -al]), [1, -be]));
      const fco = ouAdd(hco, g), F = polyEv(fco), G = polyEv(g), H = polyEv(hco);
      const lo = Math.min(al, be), hi = Math.max(al, be), S = ouQ(1, 12).mul(a.sgn * a.n === a.n ? a : a.neg()).mul(Math.pow(be - al, 4));
      const win = ouWinF([F, G], [lo, hi], { mx: 0.9, my: 0.45, minW: 3.4, minH: 2.2 });
      if (prev && win.y[1] - win.y[0] > 11) return null;
      return { a, al, be, g, hco, fco, F, G, H, lo, hi, S, win, key: [a.txt, al, be, g.map((q) => q.txt)].join(), chk: { fco: fco.map((q) => q.v), g: g.map((q) => q.v), al, be, S: S.v } };
    },
    text: (v) => `삼차함수 ${tex('f(x)=' + ouPoly(v.fco))} 과 이차함수 ${tex('g(x)=' + ouPoly(v.g))} 의 그래프로 둘러싸인 부분의 넓이 ${tex('S')}를 두 함수의 차 ${tex('h(x) = f(x) - g(x)')} 를 이용하여 구하시오.`,
    ans: (v) => `접점 ${tex('x = ' + v.al)} (중근), 교점 ${tex('x = ' + v.be)} ${tex('\\implies S = ' + v.S.tex)}`,
    steps: (v) => [
      `두 함수의 차를 구하면 $h(x)=f(x)-g(x)=${ouPoly(v.hco)}=${ouCoQ(v.a)}${v.al === 0 ? 'x^2' : ouFac(v.al) + '^2'}${ouFac(v.be)}$ 입니다.`,
      `두 곡선이 만나는 곳은 $h(x)=0$ 인 $x=${v.al}$ (제곱 인수이므로 접합니다)와 $x=${v.be}$ (교점)입니다. 그림에서 두 곡선 사이의 색칠한 부분의 세로 길이가 $|h(x)|$ 이므로, 이 넓이는 $y=h(x)$ 와 $x$축 사이의 넓이와 같습니다.`,
      `$h(x)=a(x-\\alpha)^2(x-\\beta)$ 꼴의 넓이 공식 $S=\\dfrac{|a|}{12}(\\beta-\\alpha)^4$ 에서 $S=\\dfrac{${v.a.mul(v.a.sgn).tex}}{12}\\cdot ${Math.abs(v.be - v.al)}^4=${v.S.tex}$.`
    ],
    standard: (v) => {
      const P=ouPrimitive(v.hco), lo=ouEvQ(P,v.lo),hi=ouEvQ(P,v.hi);
      return {steps:`① 두 함수의 차는 ${tex('h(x)='+ouPoly(v.hco))}이고, 영점은 ${tex(`x=${v.al},${v.be}`)}입니다.<br>② 두 영점 사이에서 부호가 일정하므로 ${tex(`S=\\left|\\int_{${v.lo}}^{${v.hi}}h(x)\\,dx\\right|`)}입니다. 원시함수 ${tex('H(x)='+ouPoly(P))}를 구합니다.<br>③ ${tex(`S=|H(${v.hi})-H(${v.lo})|=|${hi.tex}-${lo.ptex}|=${v.S.tex}`)}입니다.`,warning:'넓이는 양수입니다. 접점 α가 오른쪽에 놓이거나 최고차항이 음수여도 작은 x부터 큰 x까지 적분하고 절댓값을 취합니다.'};
    },
    core: '<b>두 곡선 사이의 넓이는 h(x) = f(x) − g(x)</b><br>두 곡선 사이의 세로 길이는 $|f(x)-g(x)|$ 이므로 넓이는 $h=f-g$ 의 그래프와 $x$축 사이의 넓이와 같습니다. 두 교점 간격을 $L=|\\beta-\\alpha|$라 하면 $h=a(x-\\alpha)(x-\\beta)$일 때 $|a|L^3/6$, $h=a(x-\\alpha)^2(x-\\beta)$일 때 $|a|L^4/12$입니다.',
    draw: (b, s, v, st) => {
      b.plot(v.G, { color: 'sky', width: 3, glow: true });
      b.plot(v.F, { color: 'ink', width: 3.2, glow: true });
      ouCurveTag(b, v.F, 'y = f(x)', 'ink', { side: 'right', dy: -10, skip: [[v.al, v.F(v.al), 1.2], [v.be, v.F(v.be), 1.2]] });
      ouCurveTag(b, v.G, 'y = g(x)', 'sky', { side: 'left', dy: 16, skip: [[v.al, v.G(v.al), 1.2], [v.be, v.G(v.be), 1.2]] });
      if (st >= 1) ouBetween(b, v.F, v.G, v.lo, v.hi, { pos: 'rose', neg: 'rose', alpha: 0.34 });
      if (st >= 2) {
        b.point([v.al, v.F(v.al)], { hollow: true, color: 'violet', r: 6, label: `x = ${v.al}`, dx: -10, dy: -16, align: 'right' });
        b.point([v.be, v.F(v.be)], { color: 'violet', r: 6, label: `x = ${v.be}`, dx: 10, dy: -16, align: 'left' });
        [0.25, 0.5, 0.75].forEach((t) => { const x = v.lo + (v.hi - v.lo) * t; b.seg([x, v.F(x)], [x, v.G(x)], { color: 'violet', width: 2.2 }); });
        const xm = (v.lo + v.hi) / 2;
        lbl(b, [xm, Math.max(v.F(xm), v.G(xm))], '세로 길이 = |h(x)|', { color: 'violet', size: 12.5, dy: -14 });
      }
      if (st >= 3) ouTop(b, `S = ∫|h(x)|dx = ${v.S.txt}`, { color: 'green', size: 13 });
    }
  });

  /* 장면 5 · 역함수의 정적분과 직사각형 */
  ouUpgrade(scenes[4], {
    m: 5,
    gen: (prev) => {
      let p, q, a, bb;
      if (!prev) { p = ouQ(1, 4); q = ouQ(1, 2); a = 1; bb = 2; }
      else { p = ouPick([ouQ(1, 4), ouQ(1, 2), ouQ(1)]); q = ouPick([ouQ(1, 2), ouQ(1), ouQ(2), ouQ(3, 4)]); [a, bb] = ouPick([[1, 2], [0, 2], [0, 1], [1, 2], [0, 2]]); }
      const co = [p, 0, q, 0], f = polyEv(co), fa = ouEvQ(co, a), fb = ouEvQ(co, bb), ans = fb.mul(bb).sub(fa.mul(a));
      if (prev && fb.v > 8.5) return null;
      const win = ouWin([[0, 0], [bb, fb.v]], { mx: 1.2, my: 1.2, minW: 6, minH: 4.6 });
      return { p, q, a, bb, co, f, fa, fb, ans, win, key: [p.txt, q.txt, a, bb].join(), chk: { p: p.v, q: q.v, a, bb, ans: ans.v } };
    },
    text: (v) => `함수 ${tex('f(x)=' + ouPoly(v.co))} 의 역함수를 ${tex('f^{-1}(x)')}라 할 때, 정적분의 합 ${tex(`\\displaystyle\\int_{${v.a}}^{${v.bb}} f(x)\\,dx + \\int_{${v.fa.tex}}^{${v.fb.tex}} f^{-1}(x)\\,dx`)} 의 값을 구하시오.`,
    ans: (v) => tex(`${v.bb} \\times ${v.fb.ptex} - ${v.a} \\times ${v.fa.ptex} = ${v.ans.tex}`),
    standard: (v) => {
      const P=ouPrimitive(v.co), I=ouEvQ(P,v.bb).sub(ouEvQ(P,v.a)),J=v.ans.sub(I);
      return {steps:`① ${tex(`f^{\\prime}(x)=${ouPoly(ouDer(v.co))}>0`)}이므로 역함수가 존재합니다. ${tex('F(x)='+ouPoly(P))}에서 ${tex(`\\int_{${v.a}}^{${v.bb}}f(x)\\,dx=F(${v.bb})-F(${v.a})=${I.tex}`)}입니다.<br>② ${tex(`y=f(x)`)}의 가로 단면 길이가 ${tex('x=f^{-1}(y)')}임을 이용합니다. 곡선 왼쪽의 하늘색 영역은 큰 직사각형에서 작은 직사각형과 분홍 영역을 뺀 부분이므로 ${tex(`\\int_{${v.fa.tex}}^{${v.fb.tex}}f^{-1}(y)\\,dy=${v.bb}\\cdot${v.fb.ptex}-${v.a}\\cdot${v.fa.ptex}-${I.ptex}=${J.tex}`)}입니다.<br>③ 두 값을 더하면 ${tex(`${I.tex}+${J.ptex}=${v.ans.tex}`)}입니다.`,warning:'두 적분을 각각 구하면 첫 적분의 계산이 더해집니다. 처음부터 두 영역의 합을 보면 원시함수도 역함수의 식도 구하지 않고 끝점만 사용할 수 있습니다.'};
    },
    steps: (v) => [
      `$f$ 는 증가함수라 역함수가 있고, $f(${v.a})=${v.fa.tex}$, $f(${v.bb})=${v.fb.tex}$ 이므로 두 번째 정적분의 구간 $[${v.fa.tex},\\,${v.fb.tex}]$ 은 $f$ 의 $y$ 값의 구간입니다.`,
      `$\\int_{${v.a}}^{${v.bb}} f(x)\\,dx$ 는 곡선 아래를 세로로 자른 분홍색 넓이, $\\int_{${v.fa.tex}}^{${v.fb.tex}} f^{-1}(y)\\,dy$ 는 곡선 왼쪽을 가로로 자른 하늘색 넓이입니다. 둘을 합치면 큰 직사각형에서 작은 직사각형을 뺀 ㄱ자 모양입니다.`,
      `합은 $b\\cdot f(b)-a\\cdot f(a)=${v.bb}\\times ${v.fb.ptex}-${v.a}\\times ${v.fa.ptex}=${v.ans.tex}$ 입니다.`
    ],
    core: '<b>역함수의 정적분은 직사각형에서 뺍니다</b><br>$f$ 가 증가하는 함수일 때 $\\displaystyle\\int_a^b f(x)\\,dx+\\int_{f(a)}^{f(b)} f^{-1}(x)\\,dx=b\\,f(b)-a\\,f(a)$ 입니다. 역함수를 구하지 않고 그림의 직사각형 넓이로 끝납니다.',
    draw: (b, s, v, st) => {
      const f = v.f, pts = [];
      for (let i = 0; i <= 60; i++) { const x = v.a + ((v.bb - v.a) * i) / 60; pts.push([x, f(x)]); }
      if (st >= 1) b.poly([[v.a, 0], ...pts, [v.bb, 0]], { fill: 'rose', fillAlpha: 0.3, color: null });
      if (st >= 2) b.poly([[0, v.fa.v], ...pts, [0, v.fb.v]], { fill: 'sky', fillAlpha: 0.3, color: null });
      b.plot(f, { color: 'ink', width: 3.2, glow: true });
      [[v.a, v.fa], [v.bb, v.fb]].forEach(([x, q]) => { b.seg([x, 0], [x, q.v], { color: 'amber', width: 1.6, dash: true }); b.seg([0, q.v], [x, q.v], { color: 'amber', width: 1.6, dash: true }); });
      lbl(b, [v.a, 0], `x = ${v.a}`, { color: 'amber', dy: 20, dx: v.a === 0 ? 14 : 0, align: v.a === 0 ? 'left' : 'center' });
      lbl(b, [v.bb, 0], `x = ${v.bb}`, { color: 'amber', dy: 20 });
      if (v.fa.v > 0) lbl(b, [0, v.fa.v], `y = ${v.fa.txt}`, { color: 'amber', dx: -8, dy: 0, align: 'right' });
      lbl(b, [0, v.fb.v], `y = ${v.fb.txt}`, { color: 'amber', dx: -8, dy: 0, align: 'right' });
      if (st >= 1) { const xm = v.a + (v.bb - v.a) * 0.72; lbl(b, [xm, f(xm) * 0.4], '∫ f(x)dx', { color: 'rose', size: 12.5 }); }
      if (st >= 2) lbl(b, [Math.max(0.35, v.a * 0.5), (v.fa.v + v.fb.v) / 2 + 0.2], '∫ f⁻¹(y)dy', { color: 'sky', size: 12.5, dx: 6, align: 'left' });
      if (st >= 3) {
        b.poly([[0, 0], [v.bb, 0], [v.bb, v.fb.v], [0, v.fb.v]], { color: 'green', width: 2.2, alpha: 0.9 });
        if (v.a > 0) b.poly([[0, 0], [v.a, 0], [v.a, v.fa.v], [0, v.fa.v]], { color: 'green', width: 2.2, alpha: 0.9, dash: true });
        ouTop(b, `${v.bb}·${v.fb.txt} − ${v.a}·${v.fa.txt} = ${v.ans.txt}`, { color: 'green', size: 13 });
      }
    }
