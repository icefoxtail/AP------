<script>
/* ==========================================================================
   중1 · 다면체와 정다면체 (AP Math Lab 2.0 이식본) — 4개 탐구관 × 4개 장면 = 16장면
   원본: labs/g7/polyhedra.html
   이식 방식: "호환 이식" — 원본의 내용(getSpec), 3D 메쉬·전개도 경첩 기구학, 그리기 코드(render 본문)를 글자 그대로 옮기고
   원본의 3D 투영 project3D(yaw·pitch·scale·원근)와 면 깊이 정렬 renderSortedFaces, draw3DLine/draw3DPoint 는 그대로 두되
   그리기 호출만 새 무대 엔진(APLab.Board)에 연결합니다. 빈 곳을 끌면 회전(무대 공통 궤도 회전), 두 손가락 확대.
   원본과 다른 점 (코드 안에는 모두 [2.0 수정] 주석이 있습니다)
   - 원본 도구 → 2.0 셸: 원클릭 버튼 ①·②와 관찰 렌즈는 조작부 칩, 3D 접기·변형 슬라이더/실행 버튼은 슬라이더·실행 버튼,
     3지선다는 '문제' 탭 버튼, Step 켜고 끄기는 '정리' 탭 단계 플레이어(면 이름 → 꼭짓점 알파벳), 식 배지는 무대 위 수식 칩,
     자동 회전·시점 칩은 조작부에 둠
   - 그림 안 문제 수정
       ① 원본 칩 목록: 같은 값에 이름만 다른 칩은 하나로 합침. 값이 달라도 그림·식이 같아 동작이 없던 칩(각뿔 높이 비율·각뿔대 절단 높이,
          3총사 강조 보기, 정다면체 '핵심 보기 모드', 전개도의 중점·평행면 확인 칩과 '자동 왕복', 정팔면체 평행면 쌍 강조,
          '불가능 단면 체크', 축구공 테마·절단 진행, 귀퉁이 블록 크기 등)은 숨김. 정육면체 전개도의 접기 각도 칩은 이동·변형 칩으로
       ② 그림에 쓰이지 않던 이동·변형 슬라이더/실행 버튼(3총사 비교·단면 슬라이서, 입체가 만들어지지 않는 꼭짓점 접기)은 숨김
       ③ 기출 스냅: 칩에 없는 값으로 맞춰지던 문제 → 그 장면의 유효한 칩 값으로
       ④ 수치 카드 이름: 원본은 모든 장면에 '면의 수·모서리 수·꼭짓점 수·불변량'이라 적어 전개도·겉면 최단거리에서는
          내용과 어긋났음 → 장면별 이름
       ⑤ 정육면체 전개도: 처음부터 칩('90° 입체완성')과 그림(25%)이 어긋났음 → 45°(반쯤)로 시작, 펼친 전개도가 오른쪽으로 쏠리던 것을 가운데로
       ⑥ 꼭짓점 이름이 많은 5장면(각기둥·각뿔·각뿔대·정다면체 5종·중복 나눗셈)은 처음엔 이름을 숨기고 '꼭짓점(V) 이름' 렌즈나
          정리 탭 2단계에서 보여 줌(원본은 항상 보여 렌즈가 효과 없었고 그림이 빽빽했음)
       ⑦ 정사면체 전개도 '만나는 점(D=E=F)' 칩: 펼친 그림에서는 아무 변화가 없었음 → 접은 모양(100%)으로 이동
       ⑧ 입체 크기: 큰 화면에서도 작지 않게 단위 크기를 무대 폭·높이에 맞춤
   ========================================================================== */
window.addEventListener('DOMContentLoaded', function () {
  const tex = APLab.tex;
  const { clamp } = APLab;

  /* ===== 원본 그대로: 한글 수 이름·정다면체 표 (원본 367–375행) ===== */
    const KOR_N = { 3: '삼', 4: '사', 5: '오', 6: '육', 7: '칠', 8: '팔', 9: '구', 10: '십' };
    const PLATONIC = {
      tetra: { name: '정사면체', shape: '정삼각형', p: 3, q: 3, F: 4, E: 6, V: 4, dual: '정사면체', pairs: 0 },
      cube: { name: '정육면체', shape: '정사각형', p: 4, q: 3, F: 6, E: 12, V: 8, dual: '정팔면체', pairs: 3 },
      octa: { name: '정팔면체', shape: '정삼각형', p: 3, q: 4, F: 8, E: 12, V: 6, dual: '정육면체', pairs: 4 },
      dodeca: { name: '정십이면체', shape: '정오각형', p: 5, q: 3, F: 12, E: 30, V: 20, dual: '정이십면체', pairs: 6 },
      icosa: { name: '정이십면체', shape: '정삼각형', p: 3, q: 5, F: 20, E: 30, V: 12, dual: '정십이면체', pairs: 10 }
    };

  /* ===== 원본 상태 객체(이름 그대로) — 매 프레임 2.0 셸 상태에서 채웁니다 ===== */
    const state = {
      mode: 1,
      sub: { 1: 'prism', 2: 'foldProof', 3: 'cubeNet', 4: 'cubeSec' },
      lens: 'all', animProg: 0.65, p1: 5, p2: 3,
      yaw: -0.55, pitch: 0.42, scale: 48, offsetX: 0, offsetY: 10,
      steps: { 1: true, 2: true, 3: true }
    };

  /* ===== 원본 그대로: 4×4 시나리오 목록 (원본 403–428행) ===== */
    const SUB_MENUS = {
      1: [
        { id: 'prism', label: '🏢 n각기둥의 면·모서리·꼭짓점' },
        { id: 'pyramid', label: '⛺ n각뿔(면의 수=꼭짓점의 수)' },
        { id: 'frustum', label: '🔪 각뿔을 잘라 각뿔대 만들기' },
        { id: 'compare3', label: '🎯 면의 수가 같은 세 입체 비교' }
      ],
      2: [
        { id: 'foldProof', label: '📐 한 꼭짓점에 모인 각의 합(<360°)' },
        { id: 'counterEx', label: '⚠️ 정다면체가 아닌 예' },
        { id: 'dual5', label: '💎 정다면체 5가지와 면의 중심 잇기' },
        { id: 'divRule', label: '🧮 모서리·꼭짓점의 수 구하기와 평행한 면' }
      ],
      3: [
        { id: 'cubeNet', label: '🎲 정육면체 전개도(A~N)' },
        { id: 'tetraNet', label: '🔺 정사면체 전개도(A~F)' },
        { id: 'octaNet', label: '💎 정팔면체 전개도(A~J)' },
        { id: 'antDist', label: '📏 겉면 위의 최단 거리' }
      ],
      4: [
        { id: 'cubeSec', label: '⬢ 정육면체의 단면' },
        { id: 'cutCompare', label: '✂️ 꼭짓점 자르기: 삼등분점 vs 중점' },
        { id: 'soccer', label: '✂️ 정이십면체 꼭짓점 자르기(32면체)' },
        { id: 'cornerBlock', label: '🧱 정육면체의 한 모퉁이 잘라 내기' }
      ]
    };

  /* ===== 원본 그대로: 벡터 도우미와 Rodrigues 회전 (원본 436–455행) ===== */
    function vSub(a, b) { return { x: a.x - b.x, y: a.y - b.y, z: a.z - b.z }; }
    function vAdd(a, b) { return { x: a.x + b.x, y: a.y + b.y, z: a.z + b.z }; }
    function vScale(a, s) { return { x: a.x * s, y: a.y * s, z: a.z * s }; }
    function vUnit(a) { const l = Math.hypot(a.x, a.y, a.z) || 1; return vScale(a, 1 / l); }

    // 정확한 Rodrigues 회전: axis는 반드시 방향벡터!
    function rotateAroundAxis(pt, origin, axisVec, angleRad) {
      const px = pt.x - origin.x, py = pt.y - origin.y, pz = pt.z - origin.z;
      const u = vUnit(axisVec);
      const cosA = Math.cos(angleRad), sinA = Math.sin(angleRad);
      const dot = u.x * px + u.y * py + u.z * pz;
      const cx = u.y * pz - u.z * py;
      const cy = u.z * px - u.x * pz;
      const cz = u.x * py - u.y * px;
      return {
        x: origin.x + px * cosA + cx * sinA + u.x * dot * (1 - cosA),
        y: origin.y + py * cosA + cy * sinA + u.y * dot * (1 - cosA),
        z: origin.z + pz * cosA + cz * sinA + u.z * dot * (1 - cosA)
      };
    }

  /* ===== 원본 그대로: 정다면체 5종 3D 메쉬 생성기 (원본 605–657행) ===== */
    function getPlatonicMesh(type, scaleR = 2.3) {
      let verts = [], facesIdx = [];
      if (type === 'tetra') {
        verts = [{ x: 1, y: 1, z: 1 }, { x: 1, y: -1, z: -1 }, { x: -1, y: 1, z: -1 }, { x: -1, y: -1, z: 1 }];
        facesIdx = [[0, 1, 2], [0, 2, 3], [0, 3, 1], [1, 3, 2]];
      } else if (type === 'cube') {
        verts = [
          { x: -1, y: -1, z: -1 }, { x: 1, y: -1, z: -1 }, { x: 1, y: 1, z: -1 }, { x: -1, y: 1, z: -1 },
          { x: -1, y: -1, z: 1 }, { x: 1, y: -1, z: 1 }, { x: 1, y: 1, z: 1 }, { x: -1, y: 1, z: 1 }
        ];
        facesIdx = [[0, 1, 2, 3], [4, 5, 6, 7], [0, 1, 5, 4], [2, 3, 7, 6], [1, 2, 6, 5], [3, 0, 4, 7]];
      } else if (type === 'octa') {
        verts = [{ x: 1, y: 0, z: 0 }, { x: -1, y: 0, z: 0 }, { x: 0, y: 1, z: 0 }, { x: 0, y: -1, z: 0 }, { x: 0, y: 0, z: 1 }, { x: 0, y: 0, z: -1 }];
        facesIdx = [[4, 0, 2], [4, 2, 1], [4, 1, 3], [4, 3, 0], [5, 2, 0], [5, 1, 2], [5, 3, 1], [5, 0, 3]];
      } else {
        const phi = (1 + Math.sqrt(5)) / 2;
        const rawI = [
          { x: -1, y: phi, z: 0 }, { x: 1, y: phi, z: 0 }, { x: -1, y: -phi, z: 0 }, { x: 1, y: -phi, z: 0 },
          { x: 0, y: -1, z: phi }, { x: 0, y: 1, z: phi }, { x: 0, y: -1, z: -phi }, { x: 0, y: 1, z: -phi },
          { x: phi, y: 0, z: -1 }, { x: phi, y: 0, z: 1 }, { x: -phi, y: 0, z: -1 }, { x: -phi, y: 0, z: 1 }
        ];
        const iFaces = [
          [0, 11, 5], [0, 5, 1], [0, 1, 7], [0, 7, 10], [0, 10, 11],
          [1, 5, 9], [5, 11, 4], [11, 10, 2], [10, 7, 6], [7, 1, 8],
          [3, 9, 4], [3, 4, 2], [3, 2, 6], [3, 6, 8], [3, 8, 9],
          [4, 9, 5], [2, 4, 11], [6, 2, 10], [8, 6, 7], [9, 8, 1]
        ];
        if (type === 'icosa') {
          verts = rawI; facesIdx = iFaces;
        } else {
          verts = iFaces.map((f) => ({
            x: (rawI[f[0]].x + rawI[f[1]].x + rawI[f[2]].x) / 3,
            y: (rawI[f[0]].y + rawI[f[1]].y + rawI[f[2]].y) / 3,
            z: (rawI[f[0]].z + rawI[f[1]].z + rawI[f[2]].z) / 3
          }));
          for (let iv = 0; iv < 12; iv++) {
            const inc = [];
            iFaces.forEach((f, fi) => { if (f.includes(iv)) inc.push(fi); });
            const vc = rawI[iv], ref = verts[inc[0]];
            const uV = vSub(ref, vc);
            const wV = { x: vc.y * uV.z - vc.z * uV.y, y: vc.z * uV.x - vc.x * uV.z, z: vc.x * uV.y - vc.y * uV.x };
            inc.sort((a, b) => {
              const pa = verts[a], pb = verts[b];
              return Math.atan2((pa.x - vc.x) * wV.x + (pa.y - vc.y) * wV.y + (pa.z - vc.z) * wV.z, (pa.x - vc.x) * uV.x + (pa.y - vc.y) * uV.y + (pa.z - vc.z) * uV.z) -
                     Math.atan2((pb.x - vc.x) * wV.x + (pb.y - vc.y) * wV.y + (pb.z - vc.z) * wV.z, (pb.x - vc.x) * uV.x + (pb.y - vc.y) * uV.y + (pb.z - vc.z) * uV.z);
            });
            facesIdx.push(inc);
          }
        }
      }
      const maxR = Math.max(...verts.map((v) => Math.hypot(v.x, v.y, v.z))) || 1;
      return { verts: verts.map((v) => vScale(v, scaleR / maxR)), facesIdx };
    }

  /* ===== 원본 그대로: 16대 핵심 시나리오 명세 (원본 662–1053행) ===== */
    function getSpec() {
      const m = state.mode, sub = state.sub[m], p1 = state.p1, p2 = state.p2;

      // [탭 1: 각기둥·각뿔·각뿔대]
      if (m === 1) {
        const n = Math.max(3, Math.min(8, p1));
        const kName = KOR_N[n];
        if (sub === 'prism') {
          const F = n + 2, E = 3 * n, V = 2 * n, wire = E * p2;
          return {
            badge: `1-A · ${kName}각기둥(${KOR_N[F] || F}면체)의 면·모서리·꼭짓점의 수와 모서리 길이의 합`,
            actionTxt: '🎬 면을 떼었다 붙이기',
            g1Label: '밑면 모양 (n)', g1Btns: [[3,'삼각형'],[4,'사각형'],[5,'오각형'],[6,'육각형'],[8,'팔각형']],
            g2Label: '한 모서리 길이', g2Btns: [[3,'3cm'],[4,'4cm'],[5,'5cm'],[6,'6cm']],
            eqHTML: `<span class="tag-blue">F = ${n}+2 = ${F}</span> · <span class="tag-emerald">E = 3×${n} = ${E}</span> · <span class="tag-rose">V = 2×${n} = ${V}</span>`,
            q: `모든 모서리 길이가 ${tex(`${p2}\\text{cm}`)}인 <strong>${kName}각기둥</strong>은 <strong>몇 면체</strong>이며, 면의 수 F, 모서리의 수 E, 꼭짓점의 수 V의 <strong>합 ${tex('F+E+V')}</strong>과 <strong>모서리 길이의 합</strong>은?`,
            opts: [
              { t: `① ${F}면체, F+E+V=${F+E+V}, 모서리 길이의 합 ${wire}cm`, ok: true, msg: `정답! ${kName}각기둥은 옆면 ${n}개와 밑면 2개를 합해 ${n}+2=${F}면체이고, 모서리 길이의 합은 ${E}×${p2}=${wire}cm입니다.` },
              { t: `② ${n}면체, F+E+V=${F+E+V}, 모서리 길이의 합 ${wire}cm`, ok: false, msg: `이름이 ${kName}각기둥이어도 옆면 ${n}개에 밑면 2개를 더해 ${F}면체입니다.` },
              { t: `③ ${F}면체, F+E+V=${F+E+V}, 모서리 길이의 합 ${2*n*p2}cm`, ok: false, msg: `모서리는 윗면 ${n}개, 옆 ${n}개, 아랫면 ${n}개로 모두 3n=${E}개이므로 ${E}×${p2}=${wire}cm입니다.` }
            ],

  /* ======================================================================
     [2.0] 3D 그리기 연결: 원본의 project3D · draw3DLine · draw3DPoint · renderSortedFaces · drawMergedVertexLabels
     - project3D 는 원본 그대로(yaw·pitch·scale·원근). 돌려주는 x·y 는 '화면 1px = 설계 1'인 설계 좌표이고,
       선·면·점 그리기는 무대 엔진(APLab.Board)이 맡아 확대·테마·판서와 함께 동작합니다.
     - yaw·pitch 는 무대의 빈 곳 끌기(궤도 회전 hook)가 바꿉니다.
     ====================================================================== */
  let BOARD = null;
  const VW = 640, VH = 440; // 모든 장면 미리보기용 가상 화면 크기
  let RECT = { width: VW, height: VH };
  const SHIFT = { x: 0 }; // 장면별 모델 가로 이동(전개도 중심 맞춤)

  /* 화면 글자: 이모지는 글꼴에 따라 깨질 수 있어 뜻을 가진 것만 기호로 바꾸고 나머지는 뗍니다 */
  const arrowOnly = (s) => String(s == null ? '' : s).replace(/\s*\([☆✡]\)/g, '').replace(/🟰/g, '=').replace(/➖/g, '−').replace(/➕/g, '+').replace(/➔/g, '→').replace(/⭕/g, '○').replace(/[❌✕]/g, '×');
  const cv = (s) => APLab.stripEmoji(arrowOnly(s));
  const arrow = (v) => (typeof v === 'string' ? cv(v) : Array.isArray(v) ? v.map(arrow) : v && typeof v === 'object' ? Object.fromEntries(Object.entries(v).map(([k, x]) => [k, arrow(x)])) : v);

  function project3D(mx, my, mz) {
    const cx = RECT.width / 2 + state.offsetX;
    const cy = RECT.height * 0.50 + state.offsetY;
    const vx = mx - SHIFT.x, vy = mz, vz = -my;
    const cosY = Math.cos(state.yaw), sinY = Math.sin(state.yaw);
    const x1 = vx * cosY - vz * sinY;
    const z1 = vx * sinY + vz * cosY;
    const cosP = Math.cos(state.pitch), sinP = Math.sin(state.pitch);
    const y2 = vy * cosP - z1 * sinP;
    const z2 = vy * sinP + z1 * cosP;
    const fov = 28;
    const persp = fov / (fov + z2 * 0.14);
    return { x: cx + x1 * state.scale * persp, y: cy - y2 * state.scale * persp, depth: z2 };
  }

  // 긴 이름표는 무대 폭에 맞춰 줄바꿈(공백 기준, 공백이 없으면 글자 단위)
  function wrapText(c, text, maxW) {
    const out = [];
    let line = '';
    const split = (w) => { if (c.measureText(w).width <= maxW) return [w]; const parts = []; let a = ''; for (const ch of w) { if (c.measureText(a + ch).width > maxW && a) { parts.push(a); a = ch; } else a += ch; } parts.push(a); return parts; };
    for (const word of String(text).split(/\s+/).filter(Boolean)) {
      const cand = line ? line + ' ' + word : word;
      if (c.measureText(cand).width <= maxW) { line = cand; continue; }
      if (line) out.push(line);
      const parts = split(word);
      line = parts.pop();
      out.push(...parts);
    }
    if (line) out.push(line);
    return out;
  }

  function draw3DLine(p1, p2, color = '#e2e8f0', width = 2.4, dashed = false) {
    const s1 = project3D(p1.x, p1.y, p1.z);
    const s2 = project3D(p2.x, p2.y, p2.z);
    BOARD.seg(s1, s2, { color, width, dash: dashed ? [5, 4] : null });
  }

  function draw3DPoint(pt, r = 5, color = '#fb7185', label = '', off = { x: 0, y: -12 }) {
    const s = project3D(pt.x, pt.y, pt.z);
    BOARD.point(s, { color, r });
    if (!label || BOARD.thumb) return;
    // 이름표 상자(원본과 같은 모양: 어두운 바탕 + 점 색 테두리). 긴 이름은 줄바꿈하고 무대 안으로 밀어 넣습니다.
    const B = BOARD, c = B.ctx;
    const S = B.toS(s.x, s.y);
    const A = B._area();
    const size = 11.5 * B.fs;
    c.save();
    c.font = `800 ${size}px ${B.font}`;
    const lines = wrapText(c, cv(label), Math.min(230, Math.max(110, A.w - 20)));
    const w = Math.max(...lines.map((l) => c.measureText(l).width)) + 10;
    const lh = size + 3, h = lines.length * lh + 5;
    let lx = S.x + off.x, ly = S.y + off.y;
    lx = w + 6 >= A.w ? A.x + A.w / 2 : clamp(lx, A.x + 3 + w / 2, A.x + A.w - 3 - w / 2);
    ly = h + 6 >= A.h ? A.y + A.h / 2 : clamp(ly, A.y + 3 + h / 2, A.y + A.h - 3 - h / 2);
    c.beginPath();
    if (c.roundRect) c.roundRect(lx - w / 2, ly - h / 2, w, h, 4); else c.rect(lx - w / 2, ly - h / 2, w, h);
    c.fillStyle = APLab.rgba(B.colors.halo, 0.92);
    c.fill();
    c.strokeStyle = B.color(color);
    c.lineWidth = 1.2;
    c.stroke();
    c.fillStyle = B.color('ink');
    c.textAlign = 'center';
    c.textBaseline = 'middle';
    lines.forEach((l, i) => c.fillText(l, lx, ly - h / 2 + 2.5 + lh * (i + 0.5)));
    c.restore();
  }

  // 여러 꼭짓점이 접혀서 한 점에 모일 때 라벨을 자동으로 묶어주는 스마트 렌더러 (예: A, G, I -> A=G=I)
  function drawMergedVertexLabels(labeledPts) {
    if (!state.steps[3] && state.lens !== 'verts') return;
    const groups = [];
    labeledPts.forEach((item) => {
      const found = groups.find((g) => Math.hypot(g.pt.x - item.pt.x, g.pt.y - item.pt.y, g.pt.z - item.pt.z) < 0.22);
      if (found) {
        if (!found.names.includes(item.name)) found.names.push(item.name);
      } else {
        groups.push({ pt: item.pt, names: [item.name], color: item.color || '#fb7185' });
      }
    });
    groups.forEach((g) => {
      const txt = g.names.join('=');
      const isMerged = g.names.length > 1;
      draw3DPoint(g.pt, isMerged ? 6.2 : 4.6, g.color, txt, { x: 0, y: isMerged ? -14 : -11 });
    });
  }

  // 축구공(깎은 정이십면체)의 흰 육각형·검은 오각형은 테마색으로 바꾸지 않고 실제 색 그대로 그립니다.
  const RAW_COLOR = { 'rgba(255, 255, 255, 0.90)': 'rgba(241,245,249,0.94)', 'rgba(15, 23, 42, 0.90)': 'rgba(15,23,42,0.94)', '#0f172a': '#0f172a' };
  function renderSortedFaces(faces) {
    const B = BOARD, c = B.ctx;
    const col = (x) => RAW_COLOR[x] || B.color(x);
    const proj = faces.map((f) => {
      const sPts = f.pts.map((p) => project3D(p.x, p.y, p.z));
      const avgD = sPts.reduce((acc, q) => acc + q.depth, 0) / sPts.length;
      const c3 = f.pts.reduce((acc, q) => ({ x: acc.x + q.x / f.pts.length, y: acc.y + q.y / f.pts.length, z: acc.z + q.z / f.pts.length }), { x: 0, y: 0, z: 0 });
      return { ...f, sPts, avgD, c2: project3D(c3.x, c3.y, c3.z) };
    });
    proj.sort((a, b) => b.avgD - a.avgD);

    proj.forEach((f, idx) => {
      c.save();
      c.beginPath();
      f.sPts.forEach((p, i) => { const s = B.toS(p.x, p.y); if (i) c.lineTo(s.x, s.y); else c.moveTo(s.x, s.y); });
      c.closePath();
      if (f.fillColor && state.lens !== 'edges') {
        c.fillStyle = col(f.fillColor);
        c.fill();
      }
      c.strokeStyle = col(state.lens === 'edges' ? '#38bdf8' : (f.strokeColor || '#e2e8f0'));
      c.lineWidth = Math.max(0.8, (state.lens === 'edges' ? 3.0 : (f.lineWidth || 2.0)) * B.lw * (B.thumb ? 0.6 : 1));
      c.lineJoin = 'round';
      c.setLineDash([]);
      c.stroke();
      c.restore();

      const lbl = f.label || (state.lens === 'faces' ? `F${idx + 1}` : '');
      if ((state.steps[1] || state.lens === 'faces') && lbl && !B.thumb) {
        const s = B.toS(f.c2.x, f.c2.y);
        B.stext(s.x, s.y, cv(lbl), { color: 'ink', size: clamp(state.scale * 0.2 + 5.5, 9.5, 12), weight: 800, align: 'center', baseline: 'middle' }); // 작은 화면(휴대폰)에서는 글자를 조금 줄여 입체를 덜 가림
      }
    });
  }

  /* ======================================================================
     원본 render() 본문 (원본 1063–1542행)
     ====================================================================== */
  function renderScene(rect) {
      const m = state.mode, sub = state.sub[m], t = state.animProg;
      const p1 = state.p1, p2 = state.p2;

      // =======================================================================
      // [탭 1 렌더링: 각기둥·각뿔·각뿔대·3총사]
      // =======================================================================
      if (m === 1) {
        if (sub === 'compare3') {
          const k = Math.max(5, Math.min(9, p1));
          const nP = k - 2, nY = k - 1;
          const models = [
            { nB: nP, topS: 1.0, xOff: -3.1, title: `${KOR_N[nP]}각기둥(F=${k})` },
            { nB: nY, topS: 0.0, xOff: 0.0, title: `${KOR_N[nY]}각뿔(F=${k})` },
            { nB: nP, topS: 0.55, xOff: 3.1, title: `${KOR_N[nP]}각뿔대(F=${k})` }
          ];
          const faces = [];
          models.forEach((md) => {
            const R = 1.2, zB = -1.1, zT = 1.1;
            const bPts = [], tPts = [];
            for (let i = 0; i < md.nB; i++) {
              const a = (i * Math.PI * 2) / md.nB - Math.PI / 2;
              bPts.push({ x: md.xOff + R * Math.cos(a), y: R * Math.sin(a), z: zB });
              tPts.push({ x: md.xOff + R * Math.cos(a) * md.topS, y: R * Math.sin(a) * md.topS, z: zT });
            }
            faces.push({ pts: bPts, fillColor: 'rgba(56, 189, 248, 0.22)', strokeColor: '#38bdf8', label: md.title });
            if (md.topS > 0) faces.push({ pts: tPts, fillColor: 'rgba(244, 63, 94, 0.22)', strokeColor: '#fb7185' });
            for (let i = 0; i < md.nB; i++) {
              const j = (i + 1) % md.nB;
              faces.push({
                pts: md.topS === 0 ? [bPts[i], bPts[j], { x: md.xOff, y: 0, z: zT }] : [bPts[i], bPts[j], tPts[j], tPts[i]],
                fillColor: 'rgba(52, 211, 153, 0.16)', strokeColor: '#e2e8f0'
              });
            }
          });
          renderSortedFaces(faces);
        } else {
          const n = Math.max(3, Math.min(8, p1));
          const isPyr = sub === 'pyramid', isFrus = sub === 'frustum';
          const exp = sub === 'prism' ? t * 0.5 : 0;
          const R = 2.0, zB = -1.25, zT = 1.35, zC = 0.2;
          const topS = isFrus ? 0.52 : isPyr ? 0 : 1.0;
          const bPts = [], tPts = [], cPts = [];
          for (let i = 0; i < n; i++) {
            const a = (i * Math.PI * 2) / n - Math.PI / 2;
            const bx = R * Math.cos(a), by = R * Math.sin(a);
            bPts.push({ x: bx, y: by, z: zB - exp });
            tPts.push({ x: bx * topS, y: by * topS, z: (isFrus ? zC : zT) + exp });
            cPts.push({ x: bx * 0.52, y: by * 0.52, z: zC + t * 0.9 });
          }
          const faces = [{ pts: bPts, fillColor: 'rgba(56, 189, 248, 0.24)', strokeColor: '#38bdf8', label: '밑면(아래)' }];
          if (!isPyr) faces.push({ pts: tPts, fillColor: 'rgba(244, 63, 94, 0.24)', strokeColor: '#fb7185', label: '밑면(위)' });

          for (let i = 0; i < n; i++) {
            const j = (i + 1) % n;
            const midA = ((i + 0.5) * Math.PI * 2) / n - Math.PI / 2;
            const exX = Math.cos(midA) * exp, exY = Math.sin(midA) * exp;
            if (isPyr) {
              const foldZ = zB + (0.15 + 0.85 * t) * (zT - zB);
              const sp = (1 - t) * 1.1;
              faces.push({
                pts: [bPts[i], bPts[j], { x: Math.cos(midA) * sp, y: Math.sin(midA) * sp, z: foldZ }],
                fillColor: 'rgba(52, 211, 153, 0.22)', strokeColor: '#e2e8f0', label: `옆면${i + 1}`
              });
            } else {
              faces.push({
                pts: [
                  { x: bPts[i].x + exX, y: bPts[i].y + exY, z: zB },
                  { x: bPts[j].x + exX, y: bPts[j].y + exY, z: zB },
                  { x: tPts[j].x + exX, y: tPts[j].y + exY, z: isFrus ? zC : zT },
                  { x: tPts[i].x + exX, y: tPts[i].y + exY, z: isFrus ? zC : zT }
                ],
                fillColor: 'rgba(52, 211, 153, 0.18)', strokeColor: '#e2e8f0', label: `옆면${i + 1}`
              });
            }
          }
          if (isFrus && t > 0.03) {
            const apex = { x: 0, y: 0, z: zT + t * 0.9 };
            for (let i = 0; i < n; i++) {
              faces.push({ pts: [cPts[i], cPts[(i + 1) % n], apex], fillColor: 'rgba(245, 158, 11, 0.24)', strokeColor: '#fbbf24', label: i === 0 ? '잘린 각뿔' : '' });
            }
          }
          renderSortedFaces(faces);
          if (state.steps[3] || state.lens === 'verts') {
            bPts.forEach((p, i) => draw3DPoint(p, 4.5, '#38bdf8', `B${i + 1}`));
            if (isPyr) draw3DPoint({ x: 0, y: 0, z: zT }, 6, '#fb7185', '각뿔 꼭짓점');
            else tPts.forEach((p, i) => draw3DPoint(p, 4.5, '#fb7185', `A${i + 1}`));
          }
        }
      }

      // =======================================================================
      // [탭 2 렌더링: 정다면체 증명·반례·쌍대]
      // =======================================================================
      else if (m === 2) {
        if (sub === 'foldProof') {
          const p = [3, 4, 5, 6][Math.min(3, Math.max(0, p1 - 3))];
          const q = Math.min(6, Math.max(3, p2));
          const oneDeg = ((p - 2) * 180) / p, sumDeg = oneDeg * q;
          const isOk = sumDeg < 360;
          const L = 1.65, alpha = (oneDeg * Math.PI) / 180;
          const delta = isOk ? (1 - t) * alpha + t * ((2 * Math.PI) / q) : alpha;
          const ringR = (L * Math.sin(alpha / 2)) / Math.sin(delta / 2);
          const h = isOk ? Math.sqrt(Math.max(0, L * L - ringR * ringR)) : 0;
          const apex = { x: 0, y: 0, z: h };
          const ring = Array.from({ length: q + 1 }, (_, i) => ({ x: ringR * Math.cos(i * delta), y: ringR * Math.sin(i * delta), z: 0 }));
          const cols = ['rgba(56,189,248,0.24)', 'rgba(52,211,153,0.24)', 'rgba(245,158,11,0.24)', 'rgba(244,63,94,0.24)', 'rgba(139,92,246,0.24)', 'rgba(236,72,153,0.24)'];
          const faces = [];
          for (let k = 0; k < q; k++) {
            const U = ring[k + 1], V = ring[k];
            const eX = vUnit(vSub(U, apex)), uV = vUnit(vSub(V, apex));
            const eY = vUnit(vSub(uV, vScale(eX, Math.cos(alpha))));
            const poly = [{ ...apex }];
            let xx = 0, yy = 0;
            for (let j = 1; j < p; j++) {
              const turn = (2 * Math.PI * (j - 1)) / p;
              xx += L * Math.cos(turn); yy += L * Math.sin(turn);
              poly.push(vAdd(apex, vAdd(vScale(eX, xx), vScale(eY, yy))));
            }
            faces.push({ pts: poly, fillColor: cols[k % cols.length], strokeColor: '#e2e8f0', label: `정${KOR_N[p]}각(${oneDeg}°)` });
          }
          renderSortedFaces(faces);
          draw3DPoint(apex, 6.5, isOk ? '#34d399' : '#fb7185', isOk ? `O(${sumDeg}° < 360°, 입체 가능)` : `O(${sumDeg}° ≥ 360°, 입체 불가)`);
        } else if (sub === 'counterEx') {
          const isDipyr = p2 <= 2;
          const nB = p1 <= 4 ? 3 : 5;
          if (isDipyr) {
            const sep = (1 - t) * 0.75, R = 1.95;
            const edge = 2 * R * Math.sin(Math.PI / nB);
            const hA = Math.sqrt(Math.max(0.4, edge * edge - R * R));
            const mPts = Array.from({ length: nB }, (_, i) => {
              const a = (i * Math.PI * 2) / nB - Math.PI / 2;
              return { x: R * Math.cos(a), y: R * Math.sin(a), z: 0 };
            });
            const topA = { x: 0, y: 0, z: hA + sep }, botA = { x: 0, y: 0, z: -hA - sep };
            const faces = [];
            for (let i = 0; i < nB; i++) {
              const j = (i + 1) % nB;
              faces.push({ pts: [{ ...mPts[i], z: sep }, { ...mPts[j], z: sep }, topA], fillColor: 'rgba(56,189,248,0.22)', strokeColor: '#e2e8f0', label: '정삼각형' });
              faces.push({ pts: [{ ...mPts[j], z: -sep }, { ...mPts[i], z: -sep }, botA], fillColor: 'rgba(52,211,153,0.22)', strokeColor: '#e2e8f0', label: '정삼각형' });
            }
            renderSortedFaces(faces);
            draw3DPoint(topA, 6, '#38bdf8', `위 꼭짓점(${nB}개 모임)`);
            draw3DPoint(mPts[0], 6.5, '#fb7185', `가운데 꼭짓점(4개 모임 ≠ ${nB}개)`);
          } else {
            const R = 1.85, zB = -1.1, zT = 1.1, exp = (1 - t) * 0.5;
            const bPts = [], tPts = [];
            for (let i = 0; i < nB; i++) {
              const a = (i * Math.PI * 2) / nB - Math.PI / 2;
              bPts.push({ x: R * Math.cos(a), y: R * Math.sin(a), z: zB - exp });
              tPts.push({ x: R * Math.cos(a), y: R * Math.sin(a), z: zT + exp });
            }
            const faces = [
              { pts: bPts, fillColor: 'rgba(56,189,248,0.26)', strokeColor: '#38bdf8', label: `밑면(정${KOR_N[nB]}각형)` },
              { pts: tPts, fillColor: 'rgba(56,189,248,0.26)', strokeColor: '#38bdf8', label: `윗면(정${KOR_N[nB]}각형)` }
            ];
            for (let i = 0; i < nB; i++) {
              const j = (i + 1) % nB;
              faces.push({ pts: [bPts[i], bPts[j], tPts[j], tPts[i]], fillColor: 'rgba(244,63,94,0.18)', strokeColor: '#fb7185', label: '옆면(정사각형, 밑면과 합동이 아님)' });
            }
            renderSortedFaces(faces);
          }
        } else {
          // dual5 & divRule
          const keys = ['tetra', 'cube', 'octa', 'dodeca', 'icosa'];
          const curKey = keys[Math.min(4, Math.max(0, p1 - 3))];
          const mesh = getPlatonicMesh(curKey, 2.35);
          const exp = sub === 'divRule' ? t * 0.42 : 0;
          const faces = mesh.facesIdx.map((idxArr, fi) => {
            const fc = idxArr.reduce((acc, i) => vAdd(acc, vScale(mesh.verts[i], 1 / idxArr.length)), { x: 0, y: 0, z: 0 });
            return {
              pts: idxArr.map((i) => vAdd(mesh.verts[i], vScale(fc, exp))),
              fillColor: 'rgba(56, 189, 248, 0.18)', strokeColor: '#e2e8f0', label: `F${fi + 1}`
            };
          });
          renderSortedFaces(faces);

          if ((sub === 'dual5' || state.lens === 'magic') && t > 0.03) {
            const fCenters = mesh.facesIdx.map((idxArr) => {
              const sum = idxArr.reduce((acc, i) => vAdd(acc, mesh.verts[i]), { x: 0, y: 0, z: 0 });
              return vScale(sum, t / idxArr.length);
            });
            for (let i = 0; i < mesh.facesIdx.length; i++) {
              for (let j = i + 1; j < mesh.facesIdx.length; j++) {
                if (mesh.facesIdx[i].filter((v) => mesh.facesIdx[j].includes(v)).length === 2) {
                  draw3DLine(fCenters[i], fCenters[j], '#fb7185', 3.0);
                }
              }
            }
            fCenters.forEach((fc, i) => draw3DPoint(fc, 5, '#fb7185', i === 0 ? '면의 중심' : ''));
          }
          if (state.steps[3] || state.lens === 'verts') {
            mesh.verts.forEach((v, i) => draw3DPoint(v, 4.5, '#38bdf8', `V${i + 1}`));
          }
        }
      }

      // =======================================================================
      // [탭 3 렌더링: 전개도 3D 접기 & 꼭짓점 알파벳(A~N) 합체 추적!]
      // =======================================================================
      else if (m === 3) {
        if (sub === 'cubeNet') {
          const s = 1.25, ang = t * (Math.PI / 2), bz = -s;
          const f2 = [{ x: -s, y: -s, z: bz }, { x: s, y: -s, z: bz }, { x: s, y: s, z: bz }, { x: -s, y: s, z: bz }];
          const f1 = [{ x: -3*s, y: -s, z: bz }, { x: -s, y: -s, z: bz }, { x: -s, y: s, z: bz }, { x: -3*s, y: s, z: bz }].map((p) => rotateAroundAxis(p, { x: -s, y: 0, z: bz }, { x: 0, y: -1, z: 0 }, ang));
          const f3 = [{ x: s, y: -s, z: bz }, { x: 3*s, y: -s, z: bz }, { x: 3*s, y: s, z: bz }, { x: s, y: s, z: bz }].map((p) => rotateAroundAxis(p, { x: s, y: 0, z: bz }, { x: 0, y: 1, z: 0 }, ang));
          const f4 = [{ x: 3*s, y: -s, z: bz }, { x: 5*s, y: -s, z: bz }, { x: 5*s, y: s, z: bz }, { x: 3*s, y: s, z: bz }]
            .map((p) => rotateAroundAxis(p, { x: 3*s, y: 0, z: bz }, { x: 0, y: 1, z: 0 }, ang))
            .map((p) => rotateAroundAxis(p, { x: s, y: 0, z: bz }, { x: 0, y: 1, z: 0 }, ang));
          const f5 = [{ x: -s, y: -3*s, z: bz }, { x: s, y: -3*s, z: bz }, { x: s, y: -s, z: bz }, { x: -s, y: -s, z: bz }].map((p) => rotateAroundAxis(p, { x: 0, y: -s, z: bz }, { x: 1, y: 0, z: 0 }, ang));
          const f6 = [{ x: -s, y: s, z: bz }, { x: s, y: s, z: bz }, { x: s, y: 3*s, z: bz }, { x: -s, y: 3*s, z: bz }].map((p) => rotateAroundAxis(p, { x: 0, y: s, z: bz }, { x: -1, y: 0, z: 0 }, ang));

          renderSortedFaces([
            { pts: f1, fillColor: 'rgba(56,189,248,0.22)', strokeColor: '#38bdf8', label: '①(파란 면)' },
            { pts: f3, fillColor: 'rgba(56,189,248,0.22)', strokeColor: '#38bdf8', label: '③(파란 면)' },
            { pts: f2, fillColor: 'rgba(52,211,153,0.22)', strokeColor: '#34d399', label: '②(초록 면)' },
            { pts: f4, fillColor: 'rgba(52,211,153,0.22)', strokeColor: '#34d399', label: '④(초록 면)' },
            { pts: f5, fillColor: 'rgba(244,63,94,0.22)', strokeColor: '#fb7185', label: '⑤(분홍 면)' },
            { pts: f6, fillColor: 'rgba(244,63,94,0.22)', strokeColor: '#fb7185', label: '⑥(분홍 면)' }
          ]);

          // 전개도 14개 꼭짓점 알파벳(A~N) 및 접혔을 때 자동 합체 표시!
          drawMergedVertexLabels([
            { pt: f1[0], name: 'A', color: '#fb7185' }, { pt: f1[1], name: 'B', color: '#38bdf8' },
            { pt: f1[2], name: 'C', color: '#38bdf8' }, { pt: f1[3], name: 'D', color: '#34d399' },
            { pt: f5[0], name: 'I', color: '#fb7185' }, { pt: f5[1], name: 'J', color: '#fbbf24' },
            { pt: f6[3], name: 'G', color: '#34d399' }, { pt: f6[2], name: 'H', color: '#7C3AED' },
            { pt: f3[1], name: 'E', color: '#fbbf24' }, { pt: f3[2], name: 'F', color: '#7C3AED' },
            { pt: f4[1], name: 'K', color: '#fb7185' }, { pt: f4[2], name: 'M', color: '#34d399' }
          ]);
        } else if (sub === 'tetraNet') {
          // 정사면체 전개도 (바닥 △ABC + 날개 3개 끝점 D, E, F가 꼭대기에서 D=E=F로 합체!)
          const R = 1.65, zB = -0.6;
          const A = { x: 0, y: R, z: zB };
          const B = { x: -R * Math.sqrt(3) / 2, y: -R / 2, z: zB };
          const C = { x: R * Math.sqrt(3) / 2, y: -R / 2, z: zB };
          const foldAng = -t * Math.acos(-1 / 3); // 정사면체 이면각 보각

          const D_flat = vSub(vAdd(A, B), C);
          const E_flat = vSub(vAdd(B, C), A);
          const F_flat = vSub(vAdd(C, A), B);

          const D = rotateAroundAxis(D_flat, A, vSub(B, A), foldAng);
          const E = rotateAroundAxis(E_flat, B, vSub(C, B), foldAng);
          const F = rotateAroundAxis(F_flat, C, vSub(A, C), foldAng);

          renderSortedFaces([
            { pts: [A, B, C], fillColor: 'rgba(52,211,153,0.24)', strokeColor: '#34d399', label: '①밑면(△ABC)' },
            { pts: [A, B, D], fillColor: 'rgba(56,189,248,0.22)', strokeColor: '#38bdf8', label: '②' },
            { pts: [B, C, E], fillColor: 'rgba(245,158,11,0.22)', strokeColor: '#fbbf24', label: '③' },
            { pts: [C, A, F], fillColor: 'rgba(244,63,94,0.22)', strokeColor: '#fb7185', label: '④' }
          ]);

          if (p1 === 4 || state.lens === 'magic') {
            draw3DLine(A, B, '#38bdf8', 4.5);
            draw3DLine(C, E, '#fb7185', 4.5);
          }

          drawMergedVertexLabels([
            { pt: A, name: 'A', color: '#38bdf8' },
            { pt: B, name: 'B', color: '#38bdf8' },
            { pt: C, name: 'C', color: '#34d399' },
            { pt: D, name: 'D', color: '#fb7185' },
            { pt: E, name: 'E', color: '#fb7185' },
            { pt: F, name: 'F', color: '#fb7185' }
          ]);
        } else if (sub === 'octaNet') {
          // [핵심 버그 완벽 해결!] 정팔면체 8개 정삼각형 전개도 + 꼭짓점 알파벳(A~J) & 100% 정확한 경첩 기구학!
          const a = 1.65, h = (a * Math.sqrt(3)) / 2, z0 = -0.7;
          const phi = t * Math.acos(1 / 3); // 정팔면체 이면각의 보각 (약 70.53°)

          // 평면 전개도(z = z0) 위의 10개 꼭짓점(A ~ J) 정확한 초기 좌표
          const B0 = { x: -0.75 * a, y: -h / 2, z: z0 };
          const C0 = { x: 0.25 * a, y: -h / 2, z: z0 };
          const A0 = { x: -0.25 * a, y: h / 2, z: z0 };
          const D0 = { x: 0.75 * a, y: h / 2, z: z0 };
          const E0 = { x: 1.25 * a, y: -h / 2, z: z0 };
          const F0 = { x: -0.25 * a, y: -1.5 * h, z: z0 };
          const G0 = { x: 0.25 * a, y: 1.5 * h, z: z0 };
          const H0 = { x: 1.75 * a, y: h / 2, z: z0 };
          const I0 = { x: -1.25 * a, y: h / 2, z: z0 };
          const J0 = { x: -1.75 * a, y: -h / 2, z: z0 };

          // 경첩 회전 도우미: 오른손 법칙에 의해 directed edge (P -> Q) 기준 오른쪽에 있는 점을 +z 위로 접음
          const fold = (pt, P, Q) => rotateAroundAxis(pt, P, vSub(Q, P), -phi);

          // ①번 면 (바닥 기준면: B0, C0, A0 고정)
          const f1Pts = [B0, C0, A0];

          // ⑤번 면 (아래 날개: 경첩 B0 -> C0)
          const F_3d = fold(F0, B0, C0);
          const f5Pts = [B0, F_3d, C0];

          // ⑦번 면 (왼쪽 날개: 경첩 A0 -> B0)
          const I_step1 = fold(I0, A0, B0);
          const f7Pts = [A0, I_step1, B0];

          // ⑧번 면 (왼쪽 끝 날개: 먼저 I0->B0 경첩으로 접은 뒤, 부모 경첩 A0->B0으로 연쇄 회전!)
          const J_step1 = fold(J0, I0, B0);
          const J_3d = fold(J_step1, A0, B0);
          const f8Pts = [I_step1, J_3d, B0];

          // ②번 면 (오른쪽 이웃: 경첩 C0 -> A0)
          const D_3d = fold(D0, C0, A0);
          const f2Pts = [C0, D_3d, A0];

          // ⑥번 면 (위쪽 날개: 먼저 D0->A0 경첩으로 접은 뒤, 부모 경첩 C0->A0으로 회전)
          const G_step1 = fold(G0, D0, A0);
          const G_3d = fold(G_step1, C0, A0);
          const f6Pts = [A0, D_3d, G_3d];

          // ③번 면 (1칸 건너뛴 평행면: C0->D0 경첩 후 C0->A0 회전)
          const E_step1 = fold(E0, C0, D0);
          const E_3d = fold(E_step1, C0, A0);
          const f3Pts = [C0, E_3d, D_3d];

          // ④번 면 (오른쪽 끝: E0->D0 경첩 -> C0->D0 경첩 -> C0->A0 경첩 3단 연쇄 회전!)
          const H_step1 = fold(H0, E0, D0);
          const H_step2 = fold(H_step1, C0, D0);
          const H_3d = fold(H_step2, C0, A0);
          const f4Pts = [E_3d, H_3d, D_3d];

          renderSortedFaces([
            { pts: f1Pts, fillColor: 'rgba(56,189,248,0.26)', strokeColor: '#38bdf8', label: '①(파란 면)' },
            { pts: f3Pts, fillColor: 'rgba(56,189,248,0.26)', strokeColor: '#38bdf8', label: '③(파란 면)' },
            { pts: f2Pts, fillColor: 'rgba(52,211,153,0.24)', strokeColor: '#34d399', label: '②(초록 면)' },
            { pts: f4Pts, fillColor: 'rgba(52,211,153,0.24)', strokeColor: '#34d399', label: '④(초록 면)' },
            { pts: f5Pts, fillColor: 'rgba(244,63,94,0.24)', strokeColor: '#fb7185', label: '⑤(분홍 면)' },
            { pts: f6Pts, fillColor: 'rgba(244,63,94,0.24)', strokeColor: '#fb7185', label: '⑥(분홍 면)' },
            { pts: f7Pts, fillColor: 'rgba(245,158,11,0.24)', strokeColor: '#fbbf24', label: '⑦(노란 면)' },
            { pts: f8Pts, fillColor: 'rgba(245,158,11,0.24)', strokeColor: '#fbbf24', label: '⑧(노란 면)' }
          ]);

          // 정팔면체 전개도의 10개 꼭짓점(A ~ J) 알파벳 좌표 및 합체(A=I, B=H, C=G, D=J, E=F) 실시간 렌더링!
          drawMergedVertexLabels([
            { pt: A0, name: 'A', color: '#fb7185' },
            { pt: I_step1, name: 'I', color: '#fb7185' },
            { pt: B0, name: 'B', color: '#38bdf8' },
            { pt: H_3d, name: 'H', color: '#38bdf8' },
            { pt: C0, name: 'C', color: '#34d399' },
            { pt: G_3d, name: 'G', color: '#34d399' },
            { pt: D_3d, name: 'D', color: '#fbbf24' },
            { pt: J_3d, name: 'J', color: '#fbbf24' },
            { pt: E_3d, name: 'E', color: '#7C3AED' },
            { pt: F_3d, name: 'F', color: '#7C3AED' }
          ]);
        } else {
          // antDist: 겉면 최단거리 개미 (옆면 2개 펼치기)
          const s = 1.3, h = 2.3, zB = -h / 2, zT = h / 2;
          const openA = (1 - t) * (Math.PI / 2);
          const pA = { x: -s, y: -s, z: zT }, pE = { x: -s, y: -s, z: zB };
          const pB = { x: s, y: -s, z: zT }, pF = { x: s, y: -s, z: zB };
          const pC = rotateAroundAxis({ x: 3*s, y: -s, z: zT }, pB, { x: 0, y: 0, z: 1 }, openA);
          const pG = rotateAroundAxis({ x: 3*s, y: -s, z: zB }, pF, { x: 0, y: 0, z: 1 }, openA);

          renderSortedFaces([
            { pts: [pA, pB, pF, pE], fillColor: 'rgba(56,189,248,0.20)', strokeColor: '#38bdf8', label: '앞면(가로 a)' },
            { pts: [pB, pC, pG, pF], fillColor: 'rgba(52,211,153,0.20)', strokeColor: '#34d399', label: '오른면(가로 a)' }
          ]);
          const pM = { x: s, y: -s, z: 0 };
          draw3DLine(pA, pM, '#fb7185', 4.0);
          draw3DLine(pM, pG, '#fb7185', 4.0);
          draw3DPoint(pA, 5.5, '#38bdf8', '출발 A');
          draw3DPoint(pM, 6, '#fb7185', `중점 P(높이 ${p2}cm)`);
          draw3DPoint(pG, 5.5, '#34d399', '도착 G');
        }
      }

      // =======================================================================
      // [탭 4 렌더링: 단면 슬라이서·꼭짓점 깎기·축구공·귀퉁이 블록]
      // =======================================================================
      else if (m === 4) {
        if (sub === 'cubeSec') {
          const s = 1.8;
          const cV = [
            { x: -s, y: -s, z: -s }, { x: s, y: -s, z: -s }, { x: s, y: s, z: -s }, { x: -s, y: s, z: -s },
            { x: -s, y: -s, z: s }, { x: s, y: -s, z: s }, { x: s, y: s, z: s }, { x: -s, y: s, z: s }
          ];
          const faces = [[0,1,2,3],[4,5,6,7],[0,1,5,4],[2,3,7,6],[1,2,6,5],[3,0,4,7]].map((arr) => ({
            pts: arr.map((i) => cV[i]), fillColor: 'rgba(148,163,184,0.10)', strokeColor: '#94a3b8', lineWidth: 1.8
          }));

          let secPts = [], lbl = '정육각형 단면';
          if (p1 === 3) {
            secPts = [{ x: -s, y: -s, z: s }, { x: s, y: s, z: s }, { x: s, y: -s, z: -s }];
            lbl = '🔺 정삼각형 단면(세 꼭짓점을 지남)';
          } else if (p1 === 4) {
            secPts = [{ x: 0, y: -s, z: s }, { x: s, y: 0, z: s }, { x: s, y: -s, z: -s }];
            lbl = '📐 이등변삼각형 단면';
          } else if (p1 === 5) {
            secPts = [{ x: -s, y: -s, z: s }, { x: s, y: -s, z: s }, { x: s, y: s, z: -s }, { x: -s, y: s, z: -s }];
            lbl = '🟦 직사각형 단면';
          } else if (p1 === 6) {
            secPts = [{ x: 0, y: -s, z: s }, { x: s, y: 0, z: s }, { x: s, y: s, z: -s*0.4 }, { x: -s*0.4, y: s, z: -s }, { x: -s, y: -s*0.4, z: -s*0.2 }];
            lbl = '⬠ 오각형 단면(정오각형은 만들 수 없음)';
          } else {
            secPts = [
              { x: 0, y: -s, z: s }, { x: s, y: 0, z: s }, { x: s, y: s, z: 0 },
              { x: 0, y: s, z: -s }, { x: -s, y: 0, z: -s }, { x: -s, y: -s, z: 0 }
            ];
            lbl = '✨ 정육각형 단면(여섯 모서리의 중점을 지남)';
          }
          faces.push({ pts: secPts, fillColor: 'rgba(244, 63, 94, 0.32)', strokeColor: '#fb7185', lineWidth: 3.5, label: lbl });
          renderSortedFaces(faces);
          secPts.forEach((p, i) => draw3DPoint(p, 5, '#fb7185', `M${i + 1}`));
        } else if (sub === 'cutCompare' || sub === 'soccer') {
          const isSoccer = sub === 'soccer';
          const keys = ['tetra', 'cube', 'octa'];
          const bKey = isSoccer ? 'icosa' : keys[Math.min(2, Math.max(0, p1 - 3))];
          const isMid = !isSoccer && p2 >= 3;
          const maxCut = isMid ? 0.5 : (1 / 3);
          const cutR = 0.02 + t * (maxCut - 0.02);
          const mesh = getPlatonicMesh(bKey, 2.35);
          const faces = [];

          mesh.facesIdx.forEach((idxArr) => {
            const poly = [], len = idxArr.length;
            for (let i = 0; i < len; i++) {
              const vC = mesh.verts[idxArr[i]], vN = mesh.verts[idxArr[(i + 1) % len]];
              poly.push(vAdd(vC, vScale(vSub(vN, vC), cutR)));
              if (cutR < 0.499) poly.push(vAdd(vC, vScale(vSub(vN, vC), 1 - cutR)));
            }
            faces.push({
              pts: poly,
              fillColor: isSoccer ? 'rgba(255, 255, 255, 0.90)' : 'rgba(56, 189, 248, 0.22)',
              strokeColor: isSoccer ? '#0f172a' : '#e2e8f0', lineWidth: 2.0
            });
          });

          if (cutR > 0.04) {
            mesh.verts.forEach((vc, vi) => {
              const nbrs = new Set();
              mesh.facesIdx.forEach((f) => {
                if (f.includes(vi)) {
                  f.forEach((o) => {
                    if (o !== vi) {
                      const i1 = f.indexOf(vi), i2 = f.indexOf(o);
                      if (Math.abs(i1 - i2) === 1 || Math.abs(i1 - i2) === f.length - 1) nbrs.add(o);
                    }
                  });
                }
              });
              const cPts = Array.from(nbrs).map((ni) => vAdd(vc, vScale(vSub(mesh.verts[ni], vc), cutR)));
              if (cPts.length >= 3) {
                const ref = cPts[0], uV = vSub(ref, vc);
                const wV = { x: vc.y * uV.z - vc.z * uV.y, y: vc.z * uV.x - vc.x * uV.z, z: vc.x * uV.y - vc.y * uV.x };
                cPts.sort((pa, pb) =>
                  Math.atan2((pa.x - vc.x)*wV.x + (pa.y - vc.y)*wV.y + (pa.z - vc.z)*wV.z, (pa.x - vc.x)*uV.x + (pa.y - vc.y)*uV.y + (pa.z - vc.z)*uV.z) -
                  Math.atan2((pb.x - vc.x)*wV.x + (pb.y - vc.y)*wV.y + (pb.z - vc.z)*wV.z, (pb.x - vc.x)*uV.x + (pb.y - vc.y)*uV.y + (pb.z - vc.z)*uV.z)
                );
                faces.push({
                  pts: cPts,
                  fillColor: isSoccer ? 'rgba(15, 23, 42, 0.90)' : 'rgba(244, 63, 94, 0.34)',
                  strokeColor: '#e2e8f0', lineWidth: 2.2
                });
              }
            });
          }
          renderSortedFaces(faces);
        } else {
          // cornerBlock
          const s = 1.75, c = 0.85, sh = t * 1.05;
          const faces = [
            { pts: [{x:s-c,y:-s,z:s-c},{x:s,y:-s,z:s-c},{x:s,y:-s+c,z:s-c},{x:s-c,y:-s+c,z:s-c}], fillColor: 'rgba(244,63,94,0.35)', strokeColor: '#fb7185', label: '새 면(+1)' },
            { pts: [{x:s-c,y:-s,z:s-c},{x:s-c,y:-s+c,z:s-c},{x:s-c,y:-s+c,z:s},{x:s-c,y:-s,z:s}], fillColor: 'rgba(52,211,153,0.35)', strokeColor: '#34d399', label: '새 면(+1)' },
            { pts: [{x:s-c,y:-s+c,z:s-c},{x:s,y:-s+c,z:s-c},{x:s,y:-s+c,z:s},{x:s-c,y:-s+c,z:s}], fillColor: 'rgba(245,158,11,0.35)', strokeColor: '#fbbf24', label: '새 면(+1)' },
            { pts: [{x:-s,y:-s,z:s},{x:s-c,y:-s,z:s},{x:s-c,y:-s+c,z:s},{x:s,y:-s+c,z:s},{x:s,y:s,z:s},{x:-s,y:s,z:s}], fillColor: 'rgba(56,189,248,0.20)', strokeColor: '#e2e8f0', label: '윗면(ㄱ자)' },
            { pts: [{x:-s,y:-s,z:-s},{x:s,y:-s,z:-s},{x:s,y:-s,z:s-c},{x:s-c,y:-s,z:s-c},{x:s-c,y:-s,z:s},{x:-s,y:-s,z:s}], fillColor: 'rgba(56,189,248,0.20)', strokeColor: '#e2e8f0', label: '앞면(ㄱ자)' },
            { pts: [{x:s,y:-s,z:-s},{x:s,y:s,z:-s},{x:s,y:s,z:s},{x:s,y:-s+c,z:s},{x:s,y:-s+c,z:s-c},{x:s,y:-s,z:s-c}], fillColor: 'rgba(56,189,248,0.20)', strokeColor: '#e2e8f0', label: '오른면(ㄱ자)' }
          ];
          const bx = s - c/2 + sh, by = -s + c/2 - sh, bz = s - c/2 + sh, hs = c/2;
          const bV = [
            {x:bx-hs,y:by-hs,z:bz-hs},{x:bx+hs,y:by-hs,z:bz-hs},{x:bx+hs,y:by+hs,z:bz-hs},{x:bx-hs,y:by+hs,z:bz-hs},
            {x:bx-hs,y:by-hs,z:bz+hs},{x:bx+hs,y:by-hs,z:bz+hs},{x:bx+hs,y:by+hs,z:bz+hs},{x:bx-hs,y:by+hs,z:bz+hs}
          ];
          [[0,1,2,3],[4,5,6,7],[0,1,5,4],[2,3,7,6],[1,2,6,5],[3,0,4,7]].forEach((arr) => {
            faces.push({ pts: arr.map((i) => bV[i]), fillColor: 'rgba(244,63,94,0.16)', strokeColor: '#fb7185', lineWidth: 1.5 });
          });
          renderSortedFaces(faces);
        }
      }
  }

  /* ======================================================================
     2.0 셸 연결 (새로 작성한 부분)
     ====================================================================== */
  const TABS = ['각기둥·각뿔·각뿔대', '정다면체 5가지와 정다면체가 아닌 예', '전개도를 접어 입체 만들기', '단면과 꼭짓점 잘라 내기'];
  const SHORT = ['기둥·뿔·뿔대', '정다면체', '전개도 접기', '단면·자르기'];
  const QUESTIONS = [
    '기둥·뿔·뿔대는 밑면 모양이 같아도 면·모서리·꼭짓점의 수가 어떻게 다를까?',
    '정다면체가 5가지뿐인 까닭은? 면이 모두 정삼각형이거나 밑면이 정다각형인 입체인데도 정다면체가 아닌 것은 왜일까?',
    '전개도를 접으면 어떤 점과 어떤 점이 겹치고, 어떤 면이 서로 평행할까?',

  ];
  // 원본 Step 1(면 번호·평행)·Step 3(꼭짓점 알파벳)을 단계 플레이어로. (원본 Step 2 '모서리·단면'은 그림에 쓰이지 않아 뺌)
  const STEPS = ['면에 이름과 번호를 붙여 봅니다', '꼭짓점에 알파벳 이름을 붙여, 접었을 때 겹치는 점을 찾습니다'];
  const LABELS = {
    prism: ['면의 수 F', '모서리의 수 E', '꼭짓점의 수 V', 'V−E+F의 값'], pyramid: ['면의 수 F', '모서리의 수 E', '꼭짓점의 수 V', 'V−E+F의 값'], frustum: ['면의 수 F', '모서리의 수 E', '꼭짓점의 수 V', '옆면·밑면'],
    compare3: ['공통 면의 수', '① 기둥', '② 각뿔', '③ 각뿔대'],
    foldProof: ['한 내각', '모인 면의 수', '내각의 합', '결론'], counterEx: ['구성', '꼭짓점 조건', '정다면체가 아닌 이유', '결론'],
    dual5: ['면의 수 F', '모서리의 수 E', '꼭짓점의 수 V', '평행한 면·V−E+F'], divRule: ['면의 수 F', '모서리의 수 E', '꼭짓점의 수 V', '평행한 면·V−E+F'],
    cubeNet: ['면', '꼭짓점', '겹치는 점', '꼬인 위치'], tetraNet: ['면', '모서리', '꼭짓점', '겹치는 점'], octaNet: ['면', '모서리', '꼭짓점', '겹치는 점'], antDist: ['조건', '펼친 가로', '통과 높이', '최단 거리'],
    cubeSec: ['면', '현재 단면', '삼각형 단면', '만들 수 없는 단면'], cutCompare: ['면의 수 F′', '모서리의 수 E′', '꼭짓점의 수 V′', 'V′−E′+F′의 값'], soccer: ['면의 수 F′', '모서리의 수 E′', '꼭짓점의 수 V′', 'V′−E′+F′의 값'], cornerBlock: ['면의 수 F′', '모서리의 수 E′', '꼭짓점의 수 V′', 'V′−E′+F′·겉넓이']
  };
  const COLOR4 = ['sky', 'amber', 'rose', 'green'];
  const R2D = 180 / Math.PI;
  const CAMS = [['처음 시점', -0.55, 0.42], ['위에서 보기', -0.55, 1.4], ['옆에서 보기', -0.55, 0.05], ['반대쪽에서', 2.6, 0.42]];

  const dedupe = (btns) => { const seen = new Set(); return btns.filter(([v]) => (seen.has(v) ? false : (seen.add(v), true))); };
  const nearest = (vals, target) => vals.reduce((a, b) => (Math.abs(b - target) < Math.abs(a - target) ? b : a), vals[0]);

  // 이 장면·유형에서 이동·변형(animProg)이 그림을 실제로 바꾸는지 — 원본 render 에서 t 를 쓰는 곳 기준
  //  · 3총사 비교·단면 슬라이서는 t 를 쓰지 않음  · 꼭짓점 접기는 '입체 가능(내각의 합 < 360°)'일 때만 t 를 씀
  const usesAnim = (m, id, s) => {
    if (id === 'compare3' || id === 'cubeSec') return false;
    if (id === 'foldProof') {
      const p = [3, 4, 5, 6][Math.min(3, Math.max(0, s.p1 - 3))];
      const q = Math.min(6, Math.max(3, s.p2));
      return ((p - 2) * 180 / p) * q < 360;
    }
    return true;
  };
  const animChips = (id) => (id === 'cubeNet' ? [[0, '0° 평면'], [0.5, '45° 반쯤'], [1, '90° 입체 완성']] : [[0, '펼치기 0%'], [0.5, '중간 50%'], [1, '완성 100%']]);
  // 칩 목록 필터(null = 중복 값만 합침, [] = 숨김). 그림·식이 같아 동작이 없던 칩은 뺍니다.
  const P1_SHOW = (id) => (id === 'counterEx' ? [3, 5] : id === 'tetraNet' ? [3, 4, 5] : id === 'cubeNet' || id === 'octaNet' || id === 'soccer' ? [] : null);
  const P2_SHOW = (id) => (id === 'counterEx' || id === 'cutCompare' ? [1, 3] : ['foldProof', 'prism', 'antDist'].includes(id) ? null : []);
  const LENS_OK = (id, k) => k === 'all' || k === 'edges'
    || (k === 'faces' && ['compare3', 'cubeSec', 'cutCompare', 'soccer', 'cornerBlock'].includes(id))
    || (k === 'verts' && VERT_LATE.includes(id))
    || (k === 'magic' && id === 'divRule');
  // 꼭짓점 이름이 많은 장면은 처음엔 숨기고 '꼭짓점(V) 이름' 렌즈·정리 탭 2단계에서 보여 줌(전개도 탐구관은 알파벳 추적이 핵심이라 항상 보임)
  const VERT_LATE = ['prism', 'pyramid', 'frustum', 'dual5', 'divRule'];
  const ENTER = { cubeNet: { anim: 0.5 } };
  // 원본 setP1: 정사면체 전개도 '만나는 점(D=E=F)' 칩은 접힌 모양(100%)에서만 보이므로 접기로
  const P1_EFFECT = (id, v, st, lab) => { if (id === 'tetraNet' && v === 3) lab.tween({ anim: 1 }, 700); };

  /* 셸 상태 → 원본 state 로 옮기기 */
  function sync(s, m, id, lab, thumb) {
    const rv = !thumb && lab && lab.tab === 'review';
    state.mode = m;
    state.sub[m] = id;
    state.p1 = s.p1;
    state.p2 = s.p2;
    state.animProg = s.anim;
    state.lens = s.lens;
    state.yaw = s.yaw;
    state.pitch = s.pitch;
    state.offsetX = 0;
    SHIFT.x = id === 'cubeNet' ? 1.25 * (1 - s.anim) : 0; // [2.0 수정] 전개도의 가로 중심(x=1.25)을 무대 가운데로
    state.steps[1] = rv ? s.step >= 1 : true;
    state.steps[2] = true;
    state.steps[3] = rv ? s.step >= 2 : !VERT_LATE.includes(id); // 꼭짓점 이름: 많은 장면은 렌즈·2단계에서
  }
  function specOf(s, m, id) {
    sync(s, m, id, null, true);
    const sp = getSpec();
    const out = arrow({ ...sp, g1Btns: undefined, g2Btns: undefined });
    const pick = (btns, show) => dedupe(btns).filter(([v]) => !show || show.includes(v)).map(([v, l]) => [v, APLab.stripEmoji(l)]);
    out.g1Btns = pick(sp.g1Btns, typeof P1_SHOW(id, s) === 'object' ? P1_SHOW(id, s) : null);
    out.g2Btns = pick(sp.g2Btns, typeof P2_SHOW(id, s) === 'object' ? P2_SHOW(id, s) : null);
    return out;
  }
  function validOf(s, m, id, which, target) {
    const sp = specOf(s, m, id);
    const vals = (which === 1 ? sp.g1Btns : sp.g2Btns).map(([v]) => v);
    return !vals.length || vals.includes(target) ? target : nearest(vals, target);
  }

  function problemHTML(s, m, id) {
    const sp = specOf(s, m, id);
    const sel = s.quiz;
    const opts = sp.opts.map((o, i) => `<button type="button" class="g7-opt${sel === i ? (o.ok ? ' ok' : ' bad') : ''}" data-g7q="${i}">${o.t}</button>`).join('');
    const fb = sel == null || !sp.opts[sel] ? '' : `<div class="g7-fb ${sp.opts[sel].ok ? 'ok' : 'bad'}">${sp.opts[sel].msg}</div>`;
    return `<div>${sp.q}</div><div class="g7-opts">${opts}</div>${fb}`;
  }
  document.addEventListener('click', (e) => {
    const b = e.target.closest && e.target.closest('[data-g7q]');
    const lab = window.lab;
    if (!b || !lab || !lab.scene || lab.scene.m == null) return;
    const i = +b.dataset.g7q;
    lab.s.quiz = lab.s.quiz === i ? null : i;
    const sp = specOf(lab.s, lab.scene.m, lab.scene.id);
    if (lab.s.quiz != null && sp.opts[lab.s.quiz] && sp.opts[lab.s.quiz].ok && usesAnim(lab.scene.m, lab.scene.id, lab.s)) lab.tween({ anim: 1 }, 900); // 원본: 정답을 고르면 완성(100%)으로
    lab.invalidate(true);
  });

  function sceneOf(m, it) {
    const id = it.id;
    const label = arrow(it.label);
    return {
      id, m, title: label, short: label, reviewTab: true,
      question: QUESTIONS[m - 1],
      steps: STEPS,
      notesTitle: '오답 함정과 풀이 요령',
      enter: (s) => {
        // 원본 setMode / setSub 의 초기화(이동·변형 진행도: 전개도 탐구관 25%, 나머지 65%), 시점·렌즈 처음으로
        const d = ENTER[id] || {};
        s.anim = d.anim != null ? d.anim : m === 3 ? 0.25 : 0.65;
        s.lens = 'all';
        s.quiz = null;
        s.yaw = -0.55;
        s.pitch = 0.42;
        s.p1 = 5;
        s.p2 = 3;
        // 원본 기본값(p1=5, p2=3)이 이 장면의 칩에 없으면 가장 가까운 칩 값으로
        s.p2 = d.p2 != null ? d.p2 : s.p2;
        s.p1 = validOf(s, m, id, 1, s.p1);
        s.p2 = validOf(s, m, id, 2, s.p2);
      },
      controls: (s) => (usesAnim(m, id, s) ? ['anim'] : []),
      presets: (s) => {
        const sp = specOf(s, m, id);
        const out = [];
        const fix = (st) => { st.p1 = validOf(st, m, id, 1, st.p1); st.p2 = validOf(st, m, id, 2, st.p2); };
        sp.g1Btns.forEach(([v, l]) => out.push({ group: sp.g1Label, label: l, apply: (st, lab) => { st.p1 = v; st.quiz = null; fix(st); P1_EFFECT(id, v, st, lab); }, on: (st) => st.p1 === v }));
        sp.g2Btns.forEach(([v, l]) => out.push({ group: sp.g2Label, label: l, apply: (st) => { st.p2 = v; st.quiz = null; fix(st); }, on: (st) => st.p2 === v }));
        if (usesAnim(m, id, s)) animChips(id).forEach(([v, l]) => out.push({ group: '접기·변형', label: l, set: { anim: v }, ms: 600, on: (st) => Math.abs(st.anim - v) < 0.01 }));
        const lens = [['all', '전체'], ['faces', '면 번호'], ['edges', '모서리만'], ['verts', '꼭짓점 이름'], ['magic', '면의 중심 잇기']].filter(([k]) => LENS_OK(id, k));
        if (lens.length > 1) lens.forEach(([k, l]) => out.push({ group: '표시할 내용', label: l, apply: (st, lab) => { st.lens = k; if (k === 'magic') lab.tween({ anim: 1 }, 700); }, on: (st) => st.lens === k }));
        CAMS.forEach(([l, yaw, pitch]) => out.push({ group: '시점', label: l, set: { yaw, pitch }, ms: 600, on: (st) => Math.abs(st.yaw - yaw) < 0.03 && Math.abs(st.pitch - pitch) < 0.03 }));
        return out;
      },
      actions: (s) => {
        const list = [];
        if (usesAnim(m, id, s)) list.push({
          id: 'act', play: true, primary: true, icon: 'wand',
          label: (st) => specOf(st, m, id).actionTxt,
          run: (st, lab) => { lab.tween({ anim: st.anim > 0.5 ? 0 : 1 }, 1100); }
        });
        list.push({ id: 'spin', icon: (st) => (st.playing ? 'pause' : 'play'), label: (st) => (st.playing ? '자동 회전 멈춤' : '입체 자동 회전'), on: (st) => st.playing, run: (st) => { st.playing = !st.playing; } });
        return list;
      },
      tick: (s, dt) => { if (!s.playing) return false; s.yaw += 0.6 * dt; if (s.yaw > Math.PI) s.yaw -= 2 * Math.PI; return true; },
      view: (s) => {
        const sp = specOf(s, m, id);
        const lb = LABELS[id];
        return {
          guide: `<div style="font-weight:800;margin-bottom:6px">${APLab.esc(sp.badge)}</div>그림의 빈 곳을 끌어 입체를 <b>돌려 보세요</b>. F는 면의 수, E는 모서리의 수, V는 꼭짓점의 수입니다.${usesAnim(m, id, s) ? ' 조절 막대나 실행 버튼으로 접고 펼치며, 값과 유형을 고르는 버튼으로 값을 바꿀 수 있습니다.' : ' 값과 유형을 고르는 버튼으로 값을 바꾸면서 그림과 식이 어떻게 달라지는지 비교해 보세요.'}`,
          status: { tone: 'info', text: `시점 ${Math.round(s.yaw * R2D)}° · ${Math.round(s.pitch * R2D)}° — 빈 곳을 끌면 회전` },
          chips: [{ html: sp.eqHTML }],
          readouts: sp.stats.map((t, i) => ({ label: lb[i], value: t, color: COLOR4[i], wide: true })),
          formula: sp.eqHTML
        };
      },
      problem: {
        tag: '대표 문제',
        text: (s) => problemHTML(s, m, id),
        answer: (s) => specOf(s, m, id).ans,
        // 원본 snapToProblem: p1 = 5, p2 = 3 + 접기 100%. [2.0 수정] 이 장면의 칩에 없는 값이면 가장 가까운 칩 값으로
        snap: (s) => { s.p1 = validOf(s, m, id, 1, 5); s.p2 = validOf(s, m, id, 2, 3); s.quiz = null; return { anim: usesAnim(m, id, s) ? 1 : s.anim }; }
      },
      solution: {
        standardTitle: '풀이 과정과 주의할 점', standardTag: '교과서 방법',
        quickTitle: '핵심만 정리하기', quickTag: '10초 컷 핵심',
        standard: (s) => ({ steps: specOf(s, m, id).std }),
        quick: (s) => ({ steps: specOf(s, m, id).fast })
      },
      draw: (b, s, v, lab) => {
        BOARD = b;
        let aw = VW, ah = VH;
        if (!b.thumb) {
          // 원본은 캔버스 전체 크기로 그렸습니다 → 무대 도형 영역(칩·도구 가장자리를 뺀 곳)을 화면 1px = 설계 1로 대응시킵니다.
          const a = b._area();
          aw = a.w;
          ah = a.h;
          b.focus = { x: [0, aw], y: [0, ah] };
        }
        RECT = { width: aw, height: ah };
        // 원본: min(폭, 높이)/12.5 를 36~56 으로 제한. 2.0 무대는 그림을 크게 쓰므로 폭·높이에 맞춰 키웁니다(펼친 전개도 폭 약 10칸 기준).
        const net = id === 'cubeNet'; // 펼친 전개도는 폭·높이가 모두 커서 따로 맞춤
        state.scale = clamp(Math.min(aw / (net ? 13 : 10.5), ah / (net ? 10.5 : 7)), 20, 85);
        sync(s, m, id, lab, b.thumb);
        if (s.grid && !b.thumb) b.grid({ step: 40 });
        renderScene(RECT);
      }
    };
  }

  const groups = Object.keys(SUB_MENUS).map((k) => {
    const m = +k;
    return { id: 'm' + m, title: TABS[m - 1], short: SHORT[m - 1], scenes: SUB_MENUS[m].map((it) => sceneOf(m, it)) };
  });

  APLab.createLab({
    id: 'g7-polyhedra',
    title: '다면체와 정다면체',
    courseName: '중1',
    unit: '입체도형',
    courseColor: 'var(--m-green)',
    home: '../index.html#g7',
    legacy: '../../labs/g7/polyhedra.html',
    board: {
      kind: 'figure', pad: 0, thumbPad: 0.04, focus: { x: [0, VW], y: [0, VH] }, minZoom: 0.5, maxZoom: 4,
      // 빈 곳을 끌면 카메라 회전(원본과 같은 감도·한계)
      orbit: (s, dx, dy) => {
        s.yaw += dx * 0.0085;
        if (s.yaw > Math.PI) s.yaw -= 2 * Math.PI;
        if (s.yaw < -Math.PI) s.yaw += 2 * Math.PI;
        s.pitch = clamp(s.pitch + dy * 0.0075, -0.45, 1.45);
      }
    },
    state: { p1: 5, p2: 3, anim: 0.65, lens: 'all', quiz: null, yaw: -0.55, pitch: 0.42 },
    params: {
      anim: { value: 0.65, min: 0, max: 1, step: 0.01, color: 'amber', label: '접기·변형 진행', hint: '0%(펼친 모양)에서 100%(완성)까지 입체가 변합니다', format: (v) => `${Math.round(v * 100)}%` }
    },
    groups
  });
});
</script>
