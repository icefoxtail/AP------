<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">

<script defer src="../kit/vendor/katex/katex.min.js"></script>

<body>
<noscript>이 실험실을 보려면 브라우저에서 자바스크립트를 켜야 합니다.</noscript>
<script>
/* ==========================================================================
   중1 · 다면체와 정다면체 (AP Math Lab 2.0) — Ⅲ-1. 다면체와 회전체 중 「다면체」 부분
   탭(order 순): ① 다면체와 각기둥·각뿔·각뿔대(10, 8장면) · ② 정다면체(20, 6) · ③ 정다면체의 전개도와 꼬인 위치(30, 8) · ④ 도전: 단면·꼭짓점 자르기(40, 2)
   이 파일은 얇은 껍데기입니다. 공용 도구는 labs/g7-polyhedra/core.js(투영·라벨 배치·문제 틀)와 geo.js(입체·전개도),
   각 탭은 t1~t4.js 모듈이 window.APL_PH_GROUPS 에 { order, id, title, short, params, scenes } 를 등록하면 order 순으로 붙습니다.
   (옛 g7-nets 「전개도와 입체 단면」은 이 실험실로 합쳤습니다. 회전체는 g7-solids 로 나뉘었습니다.)
   원칙(학생 가독성)
   - 입체는 처음부터 3차원 · 빈 곳을 끌면 시점이 제자리에서 돌아갑니다(이동이 아니라 회전) · 안 보이는 모서리는 점선
   - 면을 떼어 내거나 밀어내는 움직임은 화면 가로로만 · 전개도 접기는 경첩을 축으로 제자리에서 회전
   - 색의 역할: 파랑=밑면·구하는 것 · 노랑=옆면·기준·끌 수 있는 점 · 초록=다각형인 면·결과 · 빨강=센 것·겹침 · 보라=잘려 나간 부분
   - 조절 막대·손잡이로 도형을 바꾸면 라벨·식·보기·정답이 그 값으로 다시 계산됩니다. 탐구 → 정리(교과서 해결 전략 순서) → 문제(5지선다 + 숫자 바꾸기)
   ========================================================================== */
window.addEventListener('DOMContentLoaded', function () {
'use strict';
const MODULES = ['core', 'geo', 't1', 't2', 't3', 't4'];
const loadScript = (src) => new Promise((res) => {
  const el = document.createElement('script');
  el.src = src; el.async = false;
  el.onload = () => res(true);
  el.onerror = () => { el.remove(); res(false); }; // 아직 없는 모듈은 건너뜁니다
  document.head.append(el);
});

function start() {
  const mods = (window.APL_PH_GROUPS || []).filter((g) => g && Array.isArray(g.scenes) && g.scenes.length);
  const groups = mods.slice().sort((a, b) => (a.order || 0) - (b.order || 0)).map((g) => ({ id: g.id, title: g.title, short: g.short || g.title, scenes: g.scenes }));
  const params = {};
  mods.forEach((g) => Object.assign(params, g.params || {}));
  const clamp = APLab.clamp;
  APLab.createLab({
    id: 'g7-polyhedra',
    title: '다면체와 정다면체',
    courseName: '중1',
    unit: '입체도형',
    courseColor: 'var(--m-green)',
    home: '../index.html#g7',
    legacy: '../../labs/g7/polyhedra.html',
    board: {
      kind: 'figure', grid: false, pad: 0.02, minZoom: 0.5, maxZoom: 6,
      // 빈 곳을 끌면 시점이 제자리에서 돌아갑니다(좌우 회전·위아래 기울기)
      orbit: (s, dx, dy) => {
        s.phSpin = false;
        s.phYaw = (s.phYaw || 0) + dx * 0.5;
        if (s.phYaw > 180) s.phYaw -= 360;
        if (s.phYaw < -180) s.phYaw += 360;
        s.phPitch = clamp((s.phPitch == null ? 24 : s.phPitch) + dy * 0.4, -10, 80);
      }
    },
    // 장면에 들어올 때마다 화면 범위를 처음 상태로 되돌립니다. 그림 맞춤은 장면 그리기에서 매번 합니다.
    enter: (s, sc, lab) => { if (lab && lab.board && s === lab.s) { lab.board.fit(); lab.board.setPanes(null); lab.board.setInsets({ top: 0, right: 0, bottom: 0, left: 0 }); } },
    params,
    groups
  });
}
Promise.all(MODULES.map((m) => loadScript(`g7-polyhedra/${m}.js`))).then(start);
});
</script>
</body>
</html>
