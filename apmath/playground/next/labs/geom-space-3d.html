        textbook: () => ({

&nbsp;&nbsp;${tex('\\overline{EF} = 3, \\; \\overline{FG} = 4, \\; \\overline{AE} = 5 \\implies \\overline{EG} = 5, \\; \\overline{AG} = 5\\sqrt{2}')}<br/>
② 모서리 ${tex('EF')}와 평행한 선분 ${tex('AB')}를 이용하여 삼각형 ${tex('ABG')}를 만들고, ${tex('BG = \\sqrt{4^2 + 5^2} = \\sqrt{41}')}을 구한다.<br/>
③ 삼각형 ${tex('ABG')}에서 코사인법칙으로 ${tex('\\cos\\alpha')}를 구한다.`,
          warning: "주의: 꼬인 위치에 있는 두 직선이 이루는 각 α를 코사인법칙으로 직접 구하려면 삼각형을 새로 만들어 세 변의 길이를 모두 구해야 하므로 계산이 길어집니다."
        }),
        shortcut: () => ({
          steps: `① 실제 공간 좌표에서 ${tex('EF=(3,0,0), EG=(3,4,0), AG=(3,4,-5)')}로 둘 수 있다. 길이는 ${tex('EF=3, EG=5, AG=5\\sqrt2')}. ${tex('AG')}의 밑면 정사영은 ${tex('EG')}이므로 ${tex('\\cos\\beta=\\frac{EG}{AG}=\\frac{1}{\\sqrt2}')}; 밑면에서 ${tex('EF,EG')}의 각은 ${tex('\\cos\\gamma=EF/EG=\\frac{3}{5}')}.<br/>
② 화면에 그려진 각은 실제 공간에서의 각과 다르게 보일 수 있다. 각의 크기는 EG/AG, EF/EG와 같은 길이의 비(또는 벡터의 내적)로 구한다.<br/>
③ 두 비를 곱하면 <strong>[이 직육면체에서 성립하는 세 각 α, β, γ의 관계]</strong>:<br/>
&nbsp;&nbsp;<strong class="text-amber-300">${tex('\\cos\\alpha = \\dfrac{\\overline{EF}}{\\overline{AG}} = \\underbrace{\\dfrac{\\overline{EG}}{\\overline{AG}}}_{\\cos\\beta} \\times \\underbrace{\\dfrac{\\overline{EF}}{\\overline{EG}}}_{\\cos\\gamma} = \\cos\\beta \\cdot \\cos\\gamma')}</strong><br/>
④ ${tex('\\cos\\alpha=\\dfrac{EF}{AG}=\\dfrac{3}{5\\sqrt2}=\\dfrac{EG}{AG}\\cdot\\dfrac{EF}{EG}=\\cos\\beta\\cos\\gamma')}.`,
          highlight: "이 문제에서는 AG의 성분이 (3, 4, −5)이고 EF가 한 좌표축과 평행하므로 cos α = cos β · cos γ가 성립합니다. 어떤 세 각에나 쓸 수 있는 공식은 아닙니다."
        })
      }
    };

  /* ===== 원본 상태(이름 그대로) — 매 프레임 2.0 셸 상태에서 채웁니다 ===== */
  const state = { mode: 1, h2: 4.0, theta3: Math.acos(1 / 3), box4: { a: 3.0, b: 4.0, c: 5.0 }, lens: 'all', partIdx: 0, steps: { 1: true, 2: false, 3: false } };

  /* ===== 원본 그대로: 벡터 도우미와 3D 좌표 (원본 664–686행) ===== */
    const V=(x,y,z)=>({x,y,z});
    const add=(a,b)=>V(a.x+b.x,a.y+b.y,a.z+b.z);
    const sub=(a,b)=>V(a.x-b.x,a.y-b.y,a.z-b.z);
    const mul=(v,k)=>V(v.x*k,v.y*k,v.z*k);
    const dot=(a,b)=>a.x*b.x+a.y*b.y+a.z*b.z;
    const norm=v=>Math.hypot(v.x,v.y,v.z);
    const unit=v=>mul(v,1/Math.max(norm(v),1e-12));
    const rad=d=>d*Math.PI/180;
    const deg=r=>r*180/Math.PI;
    const regularAngle=Math.acos(1/3);
    const isRegularAngle = (theta) => theta === regularAngle;
    // Coordinates are mathematical units: X width, Y height, Z depth.
    function geometry(m=state.mode){
      if(m===1){ // 한 모서리 6인 정사면체: 밑면 BCD를 아래에 두고(CD가 뒤, B가 앞) 꼭대기 A가 위. M은 CD의 중점, N은 AB의 중점
        const s=3*Math.sqrt(3),h=2*Math.sqrt(6),y0=-h/2;
        const C=V(-3,y0,0),D=V(3,y0,0),B=V(0,y0,s),A=V(0,y0+h,s/3);
        return {A,B,C,D,M:V(0,y0,0),N:mul(add(A,B),.5)};}
      if(m===2){const O=V(-1.5,-1.8,-1.9), H=add(O,V(3,0,0)),P=add(O,V(0,state.h2,0)),A=add(H,V(0,0,Math.sqrt(24)));
        return {O,H,P,A};}
      if(m===3){const L=3*Math.sqrt(3),M=V(-1.5,-1.7,0),B=add(M,V(0,0,3)),C=add(M,V(0,0,-3)),D=add(M,V(L,0,0));
        // Hinge about BC: |AM|=|DM|=3√3 invariant as θ changes.
        const A=add(M,V(L*Math.cos(state.theta3),L*Math.sin(state.theta3),0));
        return {M,B,C,D,A,G:V(A.x,M.y,A.z)};}
      const {a,b,c}=state.box4,E=V(-a/2,-c/2,-b/2),F=add(E,V(a,0,0)),G=add(F,V(0,0,b)),H=add(E,V(0,0,b));
      return {E,F,G,H,A:add(E,V(0,c,0)),B:add(F,V(0,c,0)),C:add(G,V(0,c,0)),D:add(H,V(0,c,0))};
    }

  const PLANE2 = [V(-3.2, -1.8, -4.7), V(3.2, -1.8, -4.7), V(3.2, -1.8, 4.3), V(-3.2, -1.8, 4.3)]; // 장면 2의 평면 α (O의 높이)

  /* ===== 호환층: 원본 draw3D… 이름 → 3D 무대 도우미 =====
     원본 getPartStyle과 같은 규칙으로 ‘선택한 단계/관찰 렌즈’ 밖의 요소를 흐리게 합니다. */
  let SP = null, B = null, PROB = false, GRID = false; // PROB: 문제 탭 그림(풀이 단계·답을 그리지 않고 문제에 주어진 값만)
  const sink = {};
  function getPartStyle(partIdx = 0, lensGroup = 'shape') {
    const focus = state.partIdx, lens = state.lens;
    const partMatch = !focus || !partIdx || focus === partIdx;
    const lensMatch = lens === 'all' || lens === lensGroup;
    return { alpha: (partMatch ? 1 : 0.14) * (lensMatch ? 1 : 0.15), glow: (focus === partIdx && partIdx > 0) || (lens !== 'all' && lensMatch) };
  }
  function styled(part, group, fn) {
    const st = getPartStyle(part, group);
    B.ctx.save();
    B.ctx.globalAlpha *= st.alpha;
    fn(st.glow);
    B.ctx.restore();
  }
  function draw3DLine(a, b, color = '#fff', width = 2.2, dashed = false, glow = false, part = 0, group = 'shape') {
    styled(part, group, (g) => SP.line(a, b, { color, width, dash: dashed ? [6, 6] : null, glow: glow || g }));
  }
  function draw3DPolygon(pts, fill = 'rgba(52,211,153,.12)', stroke = null, width = 1.5, part = 0, group = 'shape') {
    styled(part, group, () => SP.poly(pts, { fill, color: stroke, stroke: !!stroke, width }));
  }
  function draw3DPoint(p, radius = 5, color = '#fbbf24', label = '', offset = { x: 10, y: -10 }, part = 0, group = 'shape', extra = {}) {
    styled(part, group, () => SP.point(p, { r: radius, color, label, dx: offset.x, dy: offset.y, align: 'left', ...extra }));
  }
  // 문제에 주어진 길이(모서리·선분 가운데에 놓는 글자). dx, dy: 선에서 띄우는 화면 거리
  function lenLabel(a, c, str, color = '#fde68a', dx = 0, dy = -11) {
    styled(0, 'shape', () => SP.text(mul(add(a, c), 0.5), str, { color, size: 13, weight: 800, align: 'center', baseline: 'middle', dx, dy }));
  }
  function draw3DRightAngle(o, a, b, size = 0.48, color = '#fbbf24', part = 0, group = 'perp') {
    styled(part, group, () => SP.right(o, a, b, { color, size: 14 })); // [표시 보강] 직각 표시를 11→14px로 키움(투시 화면에서 작아 안 보였음)
  }
  function draw3DAngleArc(o, a, b, radius = 0.85, color = '#fbbf24', label = '', part = 0, group = 'perp') {
    styled(part, group, (g) => SP.arc(o, a, b, radius, { color, label, glow: true }));
  }
  // [표시 보강] 세 점이 이루는 실제 공간각(°) — 각 호의 값에 씁니다.
  function angDeg(o, a, b) {
    const u = unit(sub(a, o)), v = unit(sub(b, o));
    return deg(Math.acos(Math.max(-1, Math.min(1, dot(u, v)))));
  }
  // [표시 보강] 각 이름표: 좁은 화면(휴대폰)에서는 'β45°'처럼 짧게 써서 서로 겹치지 않게 합니다.
  function angLabel(sym, v) { return B && B.W < 520 ? `${sym}${Math.round(v)}°` : `${sym} ${v.toFixed(1)}°`; }
  const NARROW = () => !!B && B.W < 520; // 좁은 화면(휴대폰)에서는 긴 설명을 뺀 짧은 이름표로 겹침을 막습니다
  function drawBottomTapeBanner(rect, message, opts = {}) {
    const f = opts.fraction;
    sink.tape = { title: message + (f ? `   ${f.before || ''} $\\dfrac{${f.num}}{${f.den}}$ ${f.after || ''}` : '') };
  }

  /* ===== 원본 그대로: 바닥 격자와 장면 그리기 (원본 816–821, 839–915행) ===== */
    // 바닥판: 입체가 놓인 평면(밑면과 같은 높이)에 입체보다 조금 넓게만 깔고, 네 모서리를 맞춤 범위에 넣어 무대에서 잘리지 않게 합니다.
    function floorTile(m,g){
      if(m===1)return {y:g.C.y,x0:-3.4,x1:3.4,z0:-.6,z1:5.8};
      if(m===3)return {y:g.M.y,x0:-3,x1:g.D.x+1.2,z0:-4,z1:4};
      if(m===4){const a=state.box4.a/2+.5,b=state.box4.b/2+.5;return {y:g.E.y,x0:-a,x1:a,z0:-b,z1:b};}
      return null;
    }
    function tileCorners(t){return [V(t.x0,t.y,t.z0),V(t.x1,t.y,t.z0),V(t.x1,t.y,t.z1),V(t.x0,t.y,t.z1)];}
    function draw3DFloorTile(t){
      for(let x=Math.ceil(t.x0);x<=t.x1;x++)draw3DLine(V(x,t.y,t.z0),V(x,t.y,t.z1),'rgba(16,185,129,.09)',.8,false,false,0,'shape');
      for(let z=Math.ceil(t.z0);z<=t.z1;z++)draw3DLine(V(t.x0,t.y,z),V(t.x1,t.y,z),'rgba(16,185,129,.09)',.8,false,false,0,'shape');
      draw3DPolygon(tileCorners(t),'rgba(16,185,129,.05)','rgba(52,211,153,.30)',1,0,'shape');
    }
    function renderMode1(r,{A,B,C,D,M,N}){
      const edges=[[A,C],[A,D],[B,C],[B,D]];
      edges.forEach(([p,q])=>draw3DLine(p,q,'rgba(226,232,240,.56)',1.8,false,false,0,'shape'));
      if(!state.steps[1]){draw3DLine(A,B,'rgba(226,232,240,.56)',1.8,false,false,0,'shape');draw3DLine(C,D,'rgba(226,232,240,.56)',1.8,false,false,0,'shape');}
      if(PROB || !state.steps[1]){ // 문제 그림과 0단계: 주어진 한 모서리 길이 6, 중점 M·N (MN의 길이와 θ는 묻는 값이라 그리지 않습니다)
        draw3DLine(M,N,'rgba(226,232,240,.75)',1.6,true,false,0,'shape');
        draw3DPoint(M,5,'#e2e8f0','M',{x:10,y:8},0,'shape');draw3DPoint(N,5,'#e2e8f0','N',{x:-18,y:-6},0,'shape');
        lenLabel(A,C,'6','#fde68a',-9,-9);
      }
      if(state.steps[3]){
        draw3DPolygon([A,B,M],'rgba(251,191,36,.18)','#fbbf24',1.3,3,'perp');
        draw3DLine(M,N,'#fbbf24',3.4,false,true,3,'projection');
        draw3DRightAngle(N,A,M,.55,'#fbbf24',3,'perp');
        draw3DPoint(N,5,'#fbbf24',NARROW()?'N':'N (AB 중점)',NARROW()?{x:-17,y:-3}:{x:-91,y:-8},3,'projection');
        drawBottomTapeBanner(r,'CD ⟂ AM, CD ⟂ BM ⇒ CD ⟂ 평면 ABM ⇒ AB ⟂ CD (90°) | 최단 거리 MN = 3√2');
      }
      if(state.steps[2]){
        draw3DLine(A,M,'#34d399',2.8,false,true,2,'perp');draw3DLine(B,M,'#34d399',2.8,false,true,2,'perp');
        draw3DRightAngle(M,A,D,.55,'#34d399',2,'perp');draw3DRightAngle(M,B,C,.55,'#34d399',2,'perp');
        draw3DPoint(M,5,'#34d399',NARROW()?'M':'M (CD 중점)',NARROW()?{x:3,y:18}:{x:10,y:12},2,'perp');
        draw3DAngleArc(M,A,D,.85,'#fde047','90°',2,'perp');
      }
      if(state.steps[1]){draw3DLine(A,B,'#38bdf8',3.8,false,true,1,'shape');draw3DLine(C,D,'#f472b6',3.8,false,true,1,'shape');}
      [['A',A],['B',B],['C',C],['D',D]].forEach(([label,p])=>draw3DPoint(p,5,label==='A'||label==='B'?'#38bdf8':'#f472b6',label,{x:9,y:-11},1,'shape'));
    }
    function renderMode2(r,{P,O,H,A}){
      const fy=O.y;
      draw3DPolygon(PLANE2,'rgba(16,185,129,.09)','rgba(52,211,153,.42)',1,0,'shape'); // 평면 α (네 모서리 모두 맞춤 범위 안)
      if(GRID){for(let x=-3;x<=3;x++)draw3DLine(V(x,fy,PLANE2[0].z),V(x,fy,PLANE2[2].z),'rgba(16,185,129,.09)',.8,false,false,0,'shape');for(let z=-4;z<=4;z++)draw3DLine(V(PLANE2[0].x,fy,z),V(PLANE2[1].x,fy,z),'rgba(16,185,129,.09)',.8,false,false,0,'shape');}
      styled(0,'shape',()=>SP.text(V(-2.5,fy,3.5),'α',{color:'#6ee7b7',size:17,weight:800,align:'center',baseline:'middle'}));
      const lEnd=add(H,V(0,0,-2.4));
      draw3DLine(lEnd,add(A,V(0,0,.9)),'#e2e8f0',2.4,false,false,0,'shape');
      styled(0,'shape',()=>SP.text(lEnd,'ℓ',{color:'#e2e8f0',size:16,weight:800,align:'right',baseline:'middle',dx:-9,dy:-3})); // 직선 이름 l: 점 A 쪽이 아니라 먼 끝에 두어 A의 글자와 붙지 않게
      if(state.steps[1]){draw3DLine(P,O,'#f472b6',3.5,false,true,1,'perp');draw3DRightAngle(O,P,H,.5,'#f472b6',1,'perp');draw3DPoint(O,5,'#f472b6','O (수선의 발)',{x:-105,y:15},1,'perp');}
      if(state.steps[2]){draw3DLine(O,H,'#38bdf8',3.5,false,true,2,'perp');draw3DRightAngle(H,O,A,.5,'#38bdf8',2,'perp');draw3DPoint(H,5,'#38bdf8','H (OH=3)',{x:10,y:-10},2,'perp');}
      if(state.steps[3]){
        draw3DPolygon([P,O,H],'rgba(251,191,36,.14)',null,1,3,'perp');
        draw3DPolygon([P,H,A],'rgba(56,189,248,.15)',null,1,3,'projection');
        draw3DLine(P,H,'#fbbf24',3.8,false,true,3,'perp');
        draw3DLine(P,A,'#34d399',3.2,false,true,3,'projection');
        draw3DLine(H,A,'#fde047',3.3,false,false,3,'projection');
        draw3DRightAngle(H,P,A,.5,'#fbbf24',3,'perp');
        drawBottomTapeBanner(r,`PA² = PO² + OH² + AH² = ${state.h2.toFixed(1)}² + 3² + (2√6)² | PH = ${Math.hypot(state.h2,3).toFixed(2)}`);
      }
      if(PROB || !state.steps[1]){ // 문제 그림과 0단계: 주어진 PO=4, OH=3, PA=7 과 두 직각. 구하는 AH(=2√6)는 그리지 않습니다.
        draw3DLine(P,O,'#f472b6',3,false,false,0,'perp');draw3DRightAngle(O,P,H,.5,'#f472b6',0,'perp');
        draw3DLine(O,H,'#38bdf8',3,false,false,0,'perp');draw3DRightAngle(H,O,A,.5,'#38bdf8',0,'perp');
        draw3DLine(P,A,'#34d399',2.6,false,false,0,'projection');
        draw3DPoint(O,5,'#f472b6','O',{x:-22,y:14},0,'perp');draw3DPoint(H,5,'#38bdf8','H',{x:9,y:-11},0,'perp');
        lenLabel(P,O,`PO = ${state.h2.toFixed(1)}`,'#f472b6',-34,0);lenLabel(O,H,'OH = 3','#38bdf8',0,15);lenLabel(P,A,Math.abs(state.h2-4)<1e-10?'PA = 7':`PA ≈ ${Math.hypot(state.h2,Math.sqrt(33)).toFixed(2)}`,'#34d399',24,-12);
      }
      draw3DPoint(P,6,'#fbbf24',`P (PO=${state.h2.toFixed(1)})`,{x:-40,y:-15},1,'perp',{problemLabel:'P'});
      draw3DPoint(A,5,'#34d399',state.steps[3]?'A (AH=2√6)':'A',{x:10,y:12},3,'projection',{problemLabel:'A'});
    }
    function renderMode3(r,{M,B,C,D,A,G}){
      const θ=state.theta3,cos=Math.cos(θ),isRegular=isRegularAngle(θ);
      draw3DPolygon([D,B,C],'rgba(56,189,248,.14)','#38bdf8',2,0,'shape');
      draw3DPolygon([A,B,C],'rgba(244,114,182,.16)','#f472b6',2,0,'shape');
      draw3DLine(A,D,'rgba(255,255,255,.5)',1.7,false,false,0,'shape'); // 숨은 모서리는 SP.solid 가 자동으로 점선
      if(PROB || !state.steps[1]){ // 문제 그림과 0단계: 한 모서리 6, 꼭짓점 A에서 밑면 DBC에 내린 수선의 발 G (cosθ와 h는 묻는 값)
        draw3DLine(A,G,'#34d399',2.2,true,false,0,'projection');draw3DPoint(G,5,'#34d399','G',{x:10,y:16},0,'projection');
        lenLabel(B,C,'6','#fde68a',-10,0);
      }
      if(state.steps[1]){draw3DLine(B,C,'#fde047',3.8,false,true,1,'shape');draw3DPoint(M,5,'#fde047','M (BC 중점)',{x:-98,y:10},1,'shape');}
      if(state.steps[2]){
        draw3DLine(A,M,'#f472b6',3.3,false,true,2,'perp');draw3DLine(D,M,'#38bdf8',3.3,false,true,2,'perp');
        draw3DRightAngle(M,A,B,.52,'#f472b6',2,'perp');draw3DRightAngle(M,D,B,.52,'#38bdf8',2,'perp');
        draw3DAngleArc(M,D,A,.9,'#fde047',NARROW()?'θ':`θ ≈ ${deg(θ).toFixed(1)}°`,2,'perp'); // 좁은 화면: 값은 위의 칩에 있으므로 θ만
      }
      if(state.steps[3]){
        draw3DPolygon([A,G,M],'rgba(251,191,36,.20)',null,1,3,'projection');
        draw3DLine(A,G,'#34d399',3.4,true,true,3,'projection');
        if(norm(sub(G,M))>1e-10)draw3DRightAngle(G,A,M,.5,'#34d399',3,'projection');
        draw3DPoint(G,5,'#34d399',isRegular?'G (무게중심)':norm(sub(G,M))<1e-10?'G = M':'G (정사영)',{x:10,y:20},3,'projection');
        drawBottomTapeBanner(r,`θ ≈ ${deg(θ).toFixed(1)}° | h ≈ ${(3*Math.sqrt(3)*Math.sin(θ)).toFixed(3)} | ${isRegular?'정사면체 조건':'접힌 두 면의 각도 조절 중'}`,{
          fraction:{before:'cos θ =',num:isRegular?'1':(cos<0?'-GM':'GM'),den:isRegular?'3':'AM',after:isRegular?'≈ 0.333':`≈ ${cos.toFixed(3)}`}});
      }
      [['A',A],['B',B],['C',C],['D',D]].forEach(([label,p])=>draw3DPoint(p,5,label==='A'?'#f472b6':'#d1fae5',label,label==='B'?{x:9,y:12}:label==='C'?{x:-18,y:-8}:{x:8,y:-12},1,'shape'));
    }
    function renderMode4(r,{A,B,C,D,E,F,G,H}){
      [[E,F],[F,G],[G,H],[H,E],[A,B],[B,C],[C,D],[D,A],[A,E],[B,F],[C,G],[D,H]].forEach(([p,q])=>draw3DLine(p,q,'rgba(203,213,225,.5)',1.6,false,false,0,'shape'));

  const cross = APLab.vec3.cross;

  function sqrtSimp(n) { let o = 1, i = n; for (let f = 2; f * f <= i; f++) while (i % (f * f) === 0) { i /= f * f; o *= f; } return [o, i]; }

  function planePick(c, O, e1, e2, w) {

    3:['교선의 중점 찾기','교선에 수직인 단면','정사영과 높이의 비'],
    4:['공간 대각선','밑면의 정사영','연속된 길이 비의 약분']
  };
  function upgradeSpace(sc) {
    const m=Number(sc.id.slice(4)), oldSteps=sc.steps, oldView=sc.view, oldGuide=sc.guide;
    sc.guide=(s,lab=window.lab)=>lab.tab==='explore'?(typeof oldGuide==='function'?oldGuide(s,lab):oldGuide):'문제의 주어진 도형에서 출발해, 단계마다 필요한 보조선의 이유와 관계식을 확인하세요.';
    sc.steps=(s,lab=window.lab)=>lab && lab.tab==='explore' && lab.scene?.id===sc.id?exploreSteps(m,s):(typeof oldSteps==='function'?oldSteps(s,lab):oldSteps);
    sc.view=(s,lab=window.lab)=>{
      const v=oldView(s,lab), stage=s.step||0;
      if (m<=4) {
        const st=fixedState(s,m,lab);sync(st,m);
        v.parts=PART_HINTS[m].map((desc,i)=>({id:i+1,name:`${i+1}단계`,desc,color:PART_COLORS[i]}));
        if(stage<3){
          const all=readouts(st,m);
          v.readouts=m===1?all.slice(0,stage>=2?2:1):m===2?[all[0],{...all[2],note:undefined}]:m===3?[{label:'주어진 정삼각형의 한 변',value:'6',color:'sky'},...(stage>=2?[all[0]]:[]),...(lab.tab==='explore'?[{label:'현재 접은 각',value:`θ ≈ ${st.th.toFixed(3)}°`,color:'amber'}]:[])]:[{...all[0],note:undefined}];
        }
      }
      if(lab.tab!=='explore' && m>=5) v.readouts=[];
      if(stage<3){
        // Solution chips follow the same stage as their justification; inputs stay in readouts.
        if(!(m===5 && lab.tab==='explore' && s.k5==='pts' && stage>=2))
          v.chips=m===7 && lab.tab==='explore'?(v.chips||[]).filter(c=>!c.answer):[];
        if(lab.tab==='explore' && m===5 && s.k5==='cube')v.readouts=[{label:'고른 모서리',value:eName(CUBE_EDGES[s.sel5%12]),color:'ink'}];
        if(lab.tab==='explore' && m===5 && s.k5==='pts' && stage<2)v.readouts=(v.readouts||[]).slice(0,2);
        if(lab.tab==='explore' && m===5 && s.k5==='skew')v.readouts=(v.readouts||[]).slice(0,2).map(r=>({...r,note:undefined}));
        if(lab.tab==='explore' && m===6)v.readouts=[{label:'옆모서리 AB',value:`${s.lat}`,color:'rose'},{label:'밑면 한 변',value:'6',color:'sky'}];
        if(lab.tab==='explore' && m===7)v.readouts=(v.readouts||[]).slice(0,2);
        if(lab.tab==='explore' && m===8){
          v.readouts=s.st8===3?[{label:'현재 P의 높이 / 깊이',value:`${s.h8} / ${s.pz8}`,color:'rose'},...(stage>=2?(v.readouts||[]).slice(0,2):[])]: (v.readouts||[]).slice(0,stage>=2?2:1);
          v.status={tone:'info',text:s.st8===3?'PH와 OH를 l에 수직으로 둔 채 P를 움직여 보세요':s.st8===1?'주어진 조건: PO ⟂ α, OH ⟂ l':'주어진 조건: PO ⟂ α, PH ⟂ l'};
        }
        if(lab.tab==='explore' && m===9)v.readouts=(v.readouts||[]).slice(0,1);
        if(lab.tab==='explore' && m===6)v.status={tone:'info',text:`옆모서리 ${s.lat} · 입체가 가능한 길이를 비교하세요`};
        if(lab.tab==='explore' && m===9)v.status={tone:'info',text:`a = ${s.a9}°, b = ${s.b9}°`};
      }
      if(m===6 && lab.tab==='explore') {
        const g=pyrGeo(3,s.lat);
        if(!g.ok){v.status={tone:'warn',text:g.degenerate?'높이 0인 퇴화 경계':'길이 조건을 만족하는 정사각뿔 없음'};v.alert={tone:'warn',text:g.degenerate?'AB = BO이므로 A가 O와 겹칩니다. 입체의 높이는 0이며, AB < BO인 불가능 상태와 구별합니다.':'AB < BO이므로 AO² = AB² − BO²가 음수가 됩니다. 이 길이로는 입체를 만들 수 없습니다.'};v.readouts=[{label:'옆모서리 AB',value:`${s.lat}`,color:'rose'},{label:'높이 AO',value:g.degenerate?'0 (퇴화)':'정의되지 않음',color:'amber'}];}
      }
      return v;
    };
    if(m===3){const p=sc.presets;sc.presets=s=>[{group:'조건',label:'정사면체로 맞추기',apply:st=>{st.th=REG_DEG},on:st=>st.th===REG_DEG},...p(s)];}
    if(m===5)sc.notes='꼬인 모서리를 셀 때 자기 자신·만나는 모서리·평행한 모서리를 먼저 제외합니다. 직선에 수직인 면은 그 직선의 방향이 면의 법선 방향과 같은 면입니다.';
    return sc;
  }


  // Keep the original 3D renderer and first source packets under the shared player.
  const lessonParams={
      yaw: { value: -35, min: -180, max: 180, step: 1, color: 'muted', label: '좌우 회전', format: (v) => `${Math.round(v)}°` },
      pitch: { value: 24, min: -15, max: 85, step: 1, color: 'muted', label: '위아래 기울기', format: (v) => `${Math.round(v)}°` },
      h2: { value: 4, min: 1.5, max: 6, step: 0.1, color: 'rose', label: '점 P의 높이 PO', hint: 'PO가 바뀌어도 PH ⟂ l은 그대로입니다', format: (v) => `h = ${v.toFixed(2)} (PH = ${Math.hypot(v, 3).toFixed(2)})` },
      phi: { value: 20, min: 0, max: 180, step: 1, color: 'sky', label: '평면 판 돌리기', hint: '직선을 축으로 판(평면)을 문처럼 돌립니다', format: (v) => `${Math.round(v)}°` },
      lat: { value: 5, min: 3, max: 7, step: 0.1, color: 'rose', label: '옆모서리 AB의 길이', hint: '밑면 대각선의 절반 3√2 ≈ 4.24 이하이면 뿔이 서지 못합니다', format: (v) => v.toFixed(1) },
      t7: { value: 0, min: 0, max: 1, step: 0.01, color: 'rose', label: '평행이동', hint: '분홍 직선을 한 점에서 만나는 자리까지 옮깁니다', format: (v) => `${Math.round(v * 100)} %` },
      h8: { value: 2.4, min: 0.8, max: 4.2, step: 0.1, color: 'rose', label: '점 P의 높이 PO', hint: 'P를 끌어 바닥 위에서 옮기고, 높이는 이 막대로 바꿉니다', format: (v) => v.toFixed(1) },
      a9: { value: 30, min: 20, max: 70, step: 5, color: 'green', label: 'l과 PA가 이루는 각 a', hint: 'A는 바닥(α) 위에서 움직입니다', format: (v) => `${Math.round(v)}°` },
      b9: { value: 45, min: 20, max: 60, step: 5, color: 'sky', label: 'l과 PB가 이루는 각 b', hint: 'B는 벽(β) 위에서 움직입니다', format: (v) => `${Math.round(v)}°` },
      th: { value: 70.53, min: 20, max: 150, step: 0.5, color: 'amber', label: '두 면을 접은 각 θ', hint: '70.5° 부근에서 정사면체의 이면각(cos θ = 1/3)이 됩니다', format: (v) => { const t = thetaOf(v); return `${(t * R2D).toFixed(1)}° (cos θ = ${Math.cos(t).toFixed(3)})`; } }
    };
  const lessonState={ lens: 'all', k5: 'pts', ru: 0.8, rv: 1.7, sel5: 0, rel5: 'all', pair7: 'A', st8: 1, px8: 0.4, pz8: 2.2 };
  const lessonScenes=[...[1, 2, 3, 4].map(sceneOf), scene5(), scene6(), scene7(), scene8(), scene9()].map(upgradeSpace);
  const sourceInfo=Object.fromEntries(lessonScenes.map(sc=>{
    const initial={...lessonState,...Object.fromEntries(Object.entries(lessonParams).map(([k,p])=>[k,p.value]))};
    sc.enter?.(initial);
    const m=Number(sc.id.slice(4));
    return [sc.id,{initial,first:sc.vary?sc.vary.first():{mode:m},
      question:sc.problem.text().replace(/<div[^>]*>\s*<button[^>]*data-sp-new[\s\S]*$/,''),
      answer:sc.problem.answer(),inquiry:sc.question}];
  }));
  function geometryAt(m,patch={}){
    const before=JSON.parse(JSON.stringify(state));
    try{sync({...sourceInfo['mode'+m].initial,...patch},m);return geometry(m);}
    finally{Object.assign(state,before);}
  }
  const lessonSource=window.APL_GS_SOURCE={
    scenes:lessonScenes,first:id=>sourceInfo[id].first,initial:id=>({...sourceInfo[id].initial}),
    question:id=>sourceInfo[id].question,answer:id=>sourceInfo[id].answer,inquiry:id=>sourceInfo[id].inquiry,
    math:{geometryAt,pyrGeo,geo7,geo8,geo9,lists5,rel5,skewInfo,cos2of,projPt,planePick,lineMeet,
      CUBE,CUBE_EDGES,FACES5,CAMS,CAM7,REG_DEG,OZ3,sub,dot,cross,norm,angDeg,camOf}
  };
  const gsMathKey=value=>String(value||'').normalize('NFKC')
    .replace(/\\(?:left|right|,|!|;|quad|qquad)/g,'')
    .replace(/\\(?:dfrac|tfrac|frac)\{([^{}]*)\}\{([^{}]*)\}/g,'$1/$2')
    .replace(/\\sqrt\{([^{}]*)\}/g,'√$1').replace(/\\sqrt\s*(\w)/g,'√$1')
    .replace(/\\(?:text|mathrm|mathbf|overline)\{([^{}]*)\}/g,'$1')
    .replace(/\\alpha/g,'α').replace(/\\beta/g,'β').replace(/\\gamma/g,'γ').replace(/\\theta/g,'θ')
    .replace(/\\cos/g,'cos').replace(/\\sin/g,'sin').replace(/\\tan/g,'tan').replace(/\\circ/g,'°')
    .replace(/\\perp/g,'⊥').replace(/\\parallel/g,'∥').replace(/\\lt/g,'<').replace(/\\gt/g,'>')
    .replace(/\\leq?/g,'≤').replace(/\\geq?/g,'≥').replace(/−|–/g,'-').replace(/[\s{}$^_()]/g,'').replace(/[′’]/g,"'");
  function gsLessonLabel(value,s){
    const str=String(value||''),key=gsMathKey(str),known=(s.lgsKnownMath||[]).map(gsMathKey);
    if(key&&known.some(k=>k.includes(key)))return str;
    if(/^[A-Z][′']*$|^[αβγθℓl]$/.test(str))return str;
    const name=str.match(/^([A-Z][′']*|[αβγθ])(?=[\s(=:≈]|$)/);return name?name[1]:'';
  }
  for(const sc of lessonScenes){
    const original={question:sc.question,reviewTop:sc.reviewTop,steps:sc.steps,view:sc.view,draw:sc.draw,tick:sc.tick};
    sc.question=(s,lab)=>lgsActive(s)?s.lgsQuestion||lessonSource.question(sc.id):typeof original.question==='function'?original.question(s,lab):original.question;
    sc.reviewTop=(s,lab)=>lgsActive(s)?'':typeof original.reviewTop==='function'?original.reviewTop(s,lab):original.reviewTop;
    sc.steps=(s,lab)=>lgsActive(s)?['조건 확인','보조선과 관계','계산','결론']:typeof original.steps==='function'?original.steps(s,lab):original.steps;
    sc.view=(s,lab)=>lgsActive(s)?{}:original.view(s,lab);
    if(original.tick)sc.tick=(s,dt,lab)=>lgsActive(s)?false:original.tick(s,dt,lab);
    sc.draw=(b,s,v,lab)=>{
      if(!lgsActive(s)){
        if(b._gsLessonView){b.zoom=b._gsLessonView.zoom;b.panX=b._gsLessonView.panX;b.panY=b._gsLessonView.panY;delete b._gsLessonView;}
        return original.draw(b,s,v,lab);
      }
      if(!b._gsLessonView){b._gsLessonView={zoom:b.zoom,panX:b.panX,panY:b.panY};b.zoom=1;b.panX=0;b.panY=0;}
      const shown={...s,...(s.lessonEntry?s.lgsInitial:{}),playing:false,dragging:false,
        step:s.lessonEntry?0:Math.max(0,Math.min(s.step||0,3))};
      for(const [key,value] of Object.entries(sourceInfo[sc.id].initial)){
        const track=(typeof value==='number'?'lgsN_':'lgsS_')+key;
        if(Object.hasOwn(shown,track))shown[key]=shown[track];
      }
      if(shown.lgsStage>=0&&!s.lessonEntry)shown.step=Math.max(0,Math.min(shown.lgsStage,3));
      shown.yaw+=(s.lessonEntry?0:Number(shown.lgsOrbit)||0);
      if(s.lessonEntry){shown.lgsShowAnswer=false;shown.lgsKnownMath=[];}
      const shownLab=Object.create(lab);shownLab.s=shown;shownLab.tab=shown.lgsExplore?'explore':'review';
      const text=b._text,prior=lgsContext,priorLab=LAB;lgsContext=shown;
      b._text=function(x,y,label,options,screen){return text.call(this,x,y,this._bbox?label:gsLessonLabel(label,shown),options,screen);};
      try{original.draw(b,shown,{},shownLab);}finally{lgsContext=prior;LAB=priorLab;b._text=text;}
    };
  }
  const lessons=window.APL_GS_LESSONS?window.APL_GS_LESSONS.install(lessonScenes,lessonSource):{};

  APLab.createLab({
    id: 'geom-space',
    stagedReveal: true,
    title: '공간도형 3D',
    courseName: '기하',
    unit: '공간도형과 공간좌표',
    courseColor: 'var(--m-rose)',
    home: '../index.html#geom',
    legacy: '../../labs/기하와벡터/공간도형 3D.html',
    board: {
      kind: 'cartesian', focus: { x: [-4, 4], y: [-4, 4] }, pad: 0.05,
      // 빈 곳을 끌면 카메라 회전(원본과 같은 감도)
      orbit: (s, dx, dy) => {
        s.yaw += dx * 0.0085 * R2D;
        if (s.yaw > 180) s.yaw -= 360;
        if (s.yaw < -180) s.yaw += 360;
        s.pitch = clamp(s.pitch + dy * 0.0075 * R2D, -15, 85);
      }
    },
    params: lessonParams,
    state: lessonState,
    persist: ['lens', 'k5', 'sel5', 'rel5', 'pair7', 'st8'],
    lessons,
    scenes: lessonScenes
  });
});
</script>
