    const examData = {
      1: {
        badge: "장면 1 · 꼬인 위치의 두 직선이 이루는 각과 정사면체의 마주 보는 모서리",

        tag: "정사면체에서 마주 보는 두 모서리의 성질",
        targetTime: "목표 시간: 3초",
        question: () => `한 모서리의 길이가 ${tex('6')}인 정사면체 ${tex('ABCD')}에서 선분 ${tex('AB')}의 중점을 ${tex('N')}, 선분 ${tex('CD')}의 중점을 ${tex('M')}이라 하자. 꼬인 위치에 있는 두 직선 ${tex('AB')}와 ${tex('CD')}가 이루는 각의 크기 ${tex('\\theta')}와 두 모서리 사이의 최단 거리 ${tex('\\overline{MN}')}의 길이를 구하시오.`,
        answerBadge: () => `${tex('\\theta = 90^\\circ, \\; \\overline{MN} = 3\\sqrt{2}')}`,

        sectionCam: { yaw: (0 * Math.PI) / 180, pitch: (0 * Math.PI) / 180 }, // CD 축 방향 정면 뷰
        steps: [
          "꼬인 위치에 있는 마주보는 두 모서리 AB(청색)와 CD(분홍색)",
          "CD의 중점 M을 잡으면 정삼각형의 높이(중선) AM ⊥ CD, BM ⊥ CD",
          "직선 CD ⊥ 평면 ABM ⇒ AB ⊥ CD (90°), 두 모서리 사이의 최단 거리 MN = 3√2"
        ],
        textbook: () => ({
          steps: `① ${tex('M')}은 ${tex('CD')}의 중점이다. 정삼각형 ${tex('ACD, BCD')}에서 중선은 밑변을 수직이등분하므로 ${tex('AM\\perp CD, BM\\perp CD')}이다.<br/>
② ${tex('AM, BM')}은 서로 다른 두 직선으로 평면 ${tex('ABM')}에서 만나므로, 직선 ${tex('CD')}는 그 평면에 수직이다. 따라서 평면 안의 ${tex('AB')}와도 수직이다. AB ⊥ CD라는 결론은 화면에서 직각처럼 보이는지와 관계없이 성립한다.<br/>
③ 정삼각형 높이 ${tex('AM=3\\sqrt3')}; ${tex('N')}은 ${tex('AB')}의 중점이므로 이등변삼각형 ${tex('ABM')}에서 ${tex('MN\\perp AB')}이고 ${tex('MN^2=AM^2-AN^2=27-9=18')}. 따라서 각은 ${tex('90^\\circ')}, 최단거리는 ${tex('MN=3\\sqrt2')}이다.`,
          warning: "직선과 평면이 수직인지는 평면 위에서 한 점에서 만나는 두 직선과 모두 수직인지로 확인합니다. 화면에 그려진 각도만 보고 공간에서의 직각을 판정하지 않습니다."

&nbsp;&nbsp;<strong class="text-sky-300">${tex('\\overline{AM} \\perp \\overline{CD}')}</strong> 이고 <strong class="text-sky-300">${tex('\\overline{BM} \\perp \\overline{CD}')}</strong>!<br/>
② 직선 ${tex('CD')}가 점 ${tex('M')}에서 만나는 두 직선 ${tex('AM, BM')}과 모두 수직이므로 <strong class="text-amber-300">평면 ${tex('ABM')}과 수직(${tex('\\overline{CD} \\perp \\triangle ABM')})</strong>이고, 따라서 평면 위의 직선 <strong class="text-emerald-300">${tex('AB')}와도 ${tex('90^\\circ')}로 수직</strong>이다.<br/>
③ 이등변삼각형 ${tex('ABM')}에서 ${tex('\\overline{AM} = 3\\sqrt{3}, \\; \\overline{AN} = 3')} 이므로 두 모서리 사이의 최단 거리는 <strong class="text-amber-300">${tex('\\overline{MN} = \\sqrt{27 - 9} = 3\\sqrt{2}')}</strong>이다.`,

      2: {

        hint: "평면 밖의 점 P에서 바닥 평면에 내린 수선 <span class='text-pink-300 font-bold'>PO(①)</span>, 수선의 발 O에서 바닥 직선 l에 내린 수선 <span class='text-sky-300 font-bold'>OH(②)</span>를 그으면 <span class='text-amber-300 font-bold'>PH(③)도 직선 l과 수직</span>이 됩니다(삼수선의 정리).",
        tag: "삼수선의 정리",
        targetTime: "목표 시간: 5초",
        question: () => `평면 ${tex('\\alpha')} 위에 있지 않은 점 ${tex('P')}에서 평면 ${tex('\\alpha')}에 내린 수선의 발을 ${tex('O')}, 점 ${tex('O')}에서 평면 ${tex('\\alpha')} 위의 직선 ${tex('l')}에 내린 수선의 발을 ${tex('H')}라 하자. ${tex('\\overline{PO} = 4, \\; \\overline{OH} = 3')} 이고 직선 ${tex('l')} 위의 점 ${tex('A')}에 대하여 ${tex('\\overline{PA} = 7')} 일 때, 선분 ${tex('\\overline{AH}')}의 길이를 구하시오.`,
        answerBadge: () => `${tex('\\overline{PH} = 5, \\; \\overline{AH} = 2\\sqrt{6} \\approx 4.90')}`,

        sectionCam: { yaw: 0, pitch: 0 },

          "두 번째 수선: 수선의 발 O에서 바닥 직선 l에 내린 수선 OH ⊥ l (길이 3)",
          "세 번째 수선(결론): PH ⊥ l (길이 5) ⇒ 직각삼각형 PHA를 이용할 수 있다"
        ],
        textbook: () => ({
          steps: `① ${tex('\\overline{PO} \\perp \\alpha')} 이므로 ${tex('\\overline{PO} \\perp l')}, 또한 가정에 의해 ${tex('\\overline{OH} \\perp l')}<br/>
② 직선 ${tex('l')}이 평면 ${tex('POH')} 위의 두 직선 ${tex('PO, OH')}와 수직이므로 ${tex('l \\perp \\text{평면 } POH')}<br/>
③ 따라서 평면 ${tex('POH')}에 포함된 직선 ${tex('PH')}도 직선 ${tex('l')}과 수직(${tex('\\overline{PH} \\perp l')})이다.<br/>
④ 두 직각삼각형 ${tex('\\triangle POH, \\triangle PHA')}에서 피타고라스 정리를 차례로 적용하여 ${tex('\\overline{PH}')}, ${tex('\\overline{AH}')}의 길이를 구한다.`,
          warning: "주의: 어느 각이 90°인지 먼저 찾아야 직각삼각형을 이용해 길이에 대한 식을 세울 수 있습니다."
        }),
        shortcut: () => ({
          steps: `① ${tex('PO\\perp\\alpha')}이고 ${tex('l\\subset\\alpha')}이므로 ${tex('PO\\perp l')}; 가정에서 ${tex('OH\\perp l')}. 두 교차 직선 ${tex('PO,OH')}가 평면 ${tex('POH')}를 정하므로 ${tex('l\\perp(POH)')}, 특히 ${tex('PH\\perp l')}. PH ⊥ l이라는 이 결론이 삼수선의 정리이다.<br/>
② 직각삼각형 ${tex('POH')}에서 ${tex('PH^2=PO^2+OH^2=4^2+3^2=25')}, 따라서 ${tex('PH=5')}.<br/>
③ ${tex('A,H')}는 ${tex('l')} 위에 있으므로 ${tex('PH\\perp AH')}. 직각삼각형 ${tex('PHA')}에서 ${tex('AH^2=PA^2-PH^2=7^2-5^2=24')}; 길이는 양수이므로 ${tex('AH=2\\sqrt6')}이다.`,
          highlight: "먼저 수직 조건으로 직각삼각형 PHA를 정당화한 뒤 피타고라스를 적용한다. 그림의 투영 모양만으로 직각을 정하지 않는다."

      3: {
        badge: "장면 3 · 두 평면이 이루는 이면각과 정사면체의 cos θ = 1/3",
        hint: "두 평면이 만나는 <span class='text-sky-300 font-bold'>교선 BC의 중점 M</span>에서 각 평면 위에 교선과 수직인 선분 MA, MD를 그으면, ∠AMD가 이면각 <span class='text-amber-300 font-bold'>θ</span>입니다(정사면체에서는 cos θ = 1/3).",
        tag: "이면각과 정사영",
        targetTime: "목표 시간: 3초",
        question: () => `한 모서리의 길이가 ${tex('6')}인 정사면체 ${tex('ABCD')}에서 두 면 ${tex('ABC')}와 ${tex('DBC')}가 이루는 이면각의 크기를 ${tex('\\theta')}라 할 때, ${tex('\\cos\\theta')}의 값과 꼭짓점 ${tex('A')}에서 밑면 ${tex('DBC')}에 내린 수선의 발 ${tex('G')}까지의 높이 ${tex('h')}를 구하시오.`,
        answerBadge: () => `${tex('\\cos\\theta = \\dfrac{1}{3}, \\; h = 2\\sqrt{6} \\approx 4.90')}`,
        cam: { yaw: (-32 * Math.PI) / 180, pitch: (22 * Math.PI) / 180 },

        steps: [
          "두 평면이 만나는 교선 BC 및 교선의 중점 M 표시",
          "교선에 수직인 두 선분 AM ⊥ BC, DM ⊥ BC (길이 3√3)가 이루는 각이 이면각 θ",
          "A에서 밑면에 내린 수선의 발 G(무게중심, 2:1 내분) ⇒ cos θ = GM / AM = 1/3"

        textbook: () => ({
          steps: `① 교선 ${tex('BC')}의 중점 ${tex('M')}에 대하여 ${tex('\\overline{AM} = \\overline{DM} = 3\\sqrt{3}')} 이고 ${tex('\\overline{AD} = 6')}<br/>

&nbsp;&nbsp;${tex('\\cos\\theta = \\dfrac{\\overline{AM}^2 + \\overline{DM}^2 - \\overline{AD}^2}{2 \\cdot \\overline{AM} \\cdot \\overline{DM}} = \\dfrac{27 + 27 - 36}{2 \\cdot 27} = \\dfrac{18}{54} = \\dfrac{1}{3}')}<br/>
③ ${tex('\\sin\\theta = \\sqrt{1 - (1/3)^2} = \\dfrac{2\\sqrt{2}}{3}')}을 구한 뒤 ${tex('h = \\overline{AM}\\sin\\theta = 3\\sqrt{3} \\cdot \\dfrac{2\\sqrt{2}}{3} = 2\\sqrt{6}')}을 계산한다.`,
          warning: "주의: 정사면체의 이면각은 코사인법칙으로도 구할 수 있지만, 무게중심의 성질을 이용하면 계산이 더 간단해집니다."
        }),
        shortcut: () => ({
          steps: `① 정사면체의 꼭짓점 ${tex('A')}에서 밑면 ${tex('\\triangle DBC')}에 내린 수선의 발을 ${tex('G')}라 하면, ${tex('A')}에서 ${tex('B, C, D')}까지의 거리가 모두 같으므로 ${tex('G')}는 정삼각형 ${tex('DBC')}의 외심이다. 정삼각형에서는 외심과 무게중심이 같으므로 <strong class="text-emerald-300">${tex('G')}는 중선 ${tex('DM')}을 ${tex('2 : 1')}로 내분하는 점</strong>이다.<br/>
② 따라서 직각삼각형 ${tex('\\triangle AGM')}에서 밑변 ${tex('\\overline{GM}')}의 길이는 중선 ${tex('\\overline{DM}(=\\overline{AM})')}의 <strong class="text-amber-300">${tex('\\dfrac{1}{3}')}배</strong>이다.<br/>
③ 따라서 <strong class="text-sky-300">${tex('\\cos\\theta = \\dfrac{\\overline{GM}}{\\overline{AM}} = \\dfrac{1}{3}')}</strong>, <strong class="text-pink-300">${tex('\\sin\\theta = \\dfrac{2\\sqrt{2}}{3}')}</strong>이다.`,
          highlight: "정사면체의 성질: ① 마주 보는 두 모서리가 이루는 각은 90° ② 두 면이 이루는 이면각 θ에 대하여 cos θ = 1/3 ③ 한 꼭짓점에서 밑면으로 이어지는 모서리와 밑면이 이루는 각 α에 대하여 cos α = 1/√3"
        })
      },

      4: {
        badge: "장면 4 · 직육면체 대각선과 세 각의 관계 (cos α = cos β · cos γ)",
        hint: "꼬인 위치에 있는 대각선 AG와 모서리 EF가 이루는 각 <span class='text-amber-300 font-bold'>α</span>는, AG를 밑면에 정사영시킨 EG를 이용하여 <span class='text-sky-300 font-bold'>cos α = cos β × cos γ</span>로 구할 수 있습니다.",
        tag: "정사영과 직육면체의 대각선",
        targetTime: "목표 시간: 5초",
        question: () => `가로, 세로, 높이가 각각 ${tex('3, \\; 4, \\; 5')} 인 직육면체에서 대각선 ${tex('AG')}가 밑면 ${tex('EFGH')}와 이루는 각을 ${tex('\\beta')}, 밑면의 대각선 ${tex('EG')}가 모서리 ${tex('EF(3)')}와 이루는 각을 ${tex('\\gamma')}, 대각선 ${tex('AG')}가 모서리 ${tex('EF')}와 이루는 각을 ${tex('\\alpha')}라 할 때, ${tex('\\cos\\beta, \\; \\cos\\gamma, \\; \\cos\\alpha')}의 값을 구하시오.`,
        answerBadge: () => `${tex('\\cos\\beta = \\dfrac{1}{\\sqrt{2}}, \\; \\cos\\gamma = \\dfrac{3}{5}, \\; \\cos\\alpha = \\dfrac{3}{5\\sqrt{2}}')}`,
        cam: { yaw: (-35 * Math.PI) / 180, pitch: (24 * Math.PI) / 180 },
        sectionCam: { yaw: -Math.atan2(4, 3), pitch: 0 },
        steps: [
          "직육면체 외곽선 및 공간 대각선 AG (길이 √(3²+4²+5²) = 5√2)",
          "바닥 대각선 정사영 EG (길이 5) ⇒ 대각선~밑면 각 β (cos β = EG/AG)",
          "직각삼각형 AEG(∠AEG=90°) ⇒ cos α = cos β · cos γ"
        ],
        textbook: () => ({
          steps: `① 세 점 ${tex('A, E, G')}를 연결하고 공간에서 각 변의 길이를 피타고라스 정리로 계산:<br/>
&nbsp;&nbsp;${tex('\\overline{EF} = 3, \\; \\overline{FG} = 4, \\; \\overline{AE} = 5 \\implies \\overline{EG} = 5, \\; \\overline{AG} = 5\\sqrt{2}')}<br/>
② 모서리 ${tex('EF')}와 평행한 선분 ${tex('AB')}를 이용하여 삼각형 ${tex('ABG')}를 만들고, ${tex('BG = \\sqrt{4^2 + 5^2} = \\sqrt{41}')}을 구한다.<br/>
③ 삼각형 ${tex('ABG')}에서 코사인법칙으로 ${tex('\\cos\\alpha')}를 구한다.`,
          warning: "주의: 꼬인 위치에 있는 두 직선이 이루는 각 α를 코사인법칙으로 직접 구하려면 삼각형을 새로 만들어 세 변의 길이를 모두 구해야 하므로 계산이 길어집니다."
        }),
        shortcut: () => ({
          steps: `① 실제 공간 좌표에서 ${tex('EF=(3,0,0), EG=(3,4,0), AG=(3,4,5)')}로 둘 수 있다. 길이는 ${tex('EF=3, EG=5, AG=5\\sqrt2')}. ${tex('AG')}의 밑면 정사영은 ${tex('EG')}이므로 ${tex('\\cos\\beta=EG/AG=1/\\sqrt2')}; 밑면에서 ${tex('EF,EG')}의 각은 ${tex('\\cos\\gamma=EF/EG=3/5')}.<br/>
② 화면에 그려진 각은 실제 공간에서의 각과 다르게 보일 수 있다. 각의 크기는 EG/AG, EF/EG와 같은 길이의 비(또는 벡터의 내적)로 구한다.<br/>
③ 두 비를 곱하면 <strong>[이 직육면체에서 성립하는 세 각 α, β, γ의 관계]</strong>:<br/>
&nbsp;&nbsp;<strong class="text-amber-300">${tex('\\cos\\alpha = \\dfrac{\\overline{EF}}{\\overline{AG}} = \\underbrace{\\dfrac{\\overline{EG}}{\\overline{AG}}}_{\\cos\\beta} \\times \\underbrace{\\dfrac{\\overline{EF}}{\\overline{EG}}}_{\\cos\\gamma} = \\cos\\beta \\cdot \\cos\\gamma')}</strong><br/>
④ ${tex('\\cos\\alpha=\\dfrac{EF}{AG}=\\dfrac{3}{5\\sqrt2}=\\dfrac{EG}{AG}\\cdot\\dfrac{EF}{EG}=\\cos\\beta\\cos\\gamma')}.`,
          highlight: "이 문제에서는 AG의 성분이 (3, 4, 5)이고 EF가 한 좌표축과 평행하므로 cos α = cos β · cos γ가 성립합니다. 어떤 세 각에나 쓸 수 있는 공식은 아닙니다."
        })
      }
    };

  /* ===== 원본 상태(이름 그대로) — 매 프레임 2.0 셸 상태에서 채웁니다 ===== */
  const state = { mode: 1, h2: 4.0, theta3: Math.acos(1 / 3), box4: { a: 3.0, b: 4.0, c: 5.0 }, lens: 'all', partIdx: 0, steps: { 1: true, 2: false, 3: false } };

  /* ===== 원본 그대로: 벡터 도우미와 3D 좌표 (원본 664–686행) ===== */
    const V=(x,y,z)=>({x,y,z});
    const add=(a,b)=>V(a.x+b.x,a.y+b.y,a.z+b.z);
    const sub=(a,b)=>V(a.x-b.x,a.y-b.y,a.z-b.z);
    const mul=(v,k)=>V(v.x*k,v.y*k,v.z*k);
    const dot=(a,b)=>a.x*b.x+a.y*b.y+a.z*b.z;
    const norm=v=>Math.hypot(v.x,v.y,v.z);
    const unit=v=>mul(v,1/Math.max(norm(v),1e-12));
    const rad=d=>d*Math.PI/180;
    const deg=r=>r*180/Math.PI;
    const regularAngle=Math.acos(1/3);
    // Coordinates are mathematical units: X width, Y height, Z depth.
    function geometry(m=state.mode){
      if(m===1){const a=6,d=a/Math.sqrt(2),N=V(-d/2,0,0),M=V(d/2,0,0);
        return {A:add(N,V(0,a/2,0)),B:add(N,V(0,-a/2,0)),C:add(M,V(0,0,-a/2)),D:add(M,V(0,0,a/2)),M,N};}
      if(m===2){const O=V(-1.5,-1.8,-1.9), H=add(O,V(3,0,0)),P=add(O,V(0,state.h2,0)),A=add(H,V(0,0,Math.sqrt(24)));
        return {O,H,P,A};}
      if(m===3){const L=3*Math.sqrt(3),M=V(-1.5,-1.7,0),B=add(M,V(0,0,3)),C=add(M,V(0,0,-3)),D=add(M,V(L,0,0));
        // Hinge about BC: |AM|=|DM|=3√3 invariant as θ changes.
        const A=add(M,V(L*Math.cos(state.theta3),L*Math.sin(state.theta3),0));
        return {M,B,C,D,A,G:V(A.x,M.y,A.z)};}
      const {a,b,c}=state.box4,E=V(-a/2,-c/2,-b/2),F=add(E,V(a,0,0)),G=add(F,V(0,0,b)),H=add(E,V(0,0,b));
      return {E,F,G,H,A:add(E,V(0,c,0)),B:add(F,V(0,c,0)),C:add(G,V(0,c,0)),D:add(H,V(0,c,0))};
    }

  /* ===== 호환층: 원본 draw3D… 이름 → 3D 무대 도우미 =====
     원본 getPartStyle과 같은 규칙으로 ‘선택한 단계/관찰 렌즈’ 밖의 요소를 흐리게 합니다. */
  let SP = null, B = null;
  const sink = {};
  function getPartStyle(partIdx = 0, lensGroup = 'shape') {
    const focus = state.partIdx, lens = state.lens;
    const partMatch = !focus || !partIdx || focus === partIdx;
    const lensMatch = lens === 'all' || lens === lensGroup;
    return { alpha: (partMatch ? 1 : 0.14) * (lensMatch ? 1 : 0.15), glow: (focus === partIdx && partIdx > 0) || (lens !== 'all' && lensMatch) };
  }
  function styled(part, group, fn) {
    const st = getPartStyle(part, group);
    B.ctx.save();
    B.ctx.globalAlpha *= st.alpha;
    fn(st.glow);
    B.ctx.restore();
  }
  function draw3DLine(a, b, color = '#fff', width = 2.2, dashed = false, glow = false, part = 0, group = 'shape') {
    styled(part, group, (g) => SP.line(a, b, { color, width, dash: dashed ? [6, 6] : null, glow: glow || g }));
  }
  function draw3DPolygon(pts, fill = 'rgba(52,211,153,.12)', stroke = null, width = 1.5, part = 0, group = 'shape') {
    styled(part, group, () => SP.poly(pts, { fill, color: stroke, stroke: !!stroke, width }));
  }
  function draw3DPoint(p, radius = 5, color = '#fbbf24', label = '', offset = { x: 10, y: -10 }, part = 0, group = 'shape') {
    styled(part, group, () => SP.point(p, { r: radius, color, label, dx: offset.x, dy: offset.y, align: 'left' }));
  }
  function draw3DRightAngle(o, a, b, size = 0.48, color = '#fbbf24', part = 0, group = 'perp') {
    styled(part, group, () => SP.right(o, a, b, { color, size: 11 }));
  }
  function draw3DAngleArc(o, a, b, radius = 0.85, color = '#fbbf24', label = '', part = 0, group = 'perp') {
    styled(part, group, (g) => SP.arc(o, a, b, radius, { color, label, glow: true }));
  }
  function drawBottomTapeBanner(rect, message, opts = {}) {
    const f = opts.fraction;
    sink.tape = { title: message + (f ? `   ${f.before || ''} $\\dfrac{${f.num}}{${f.den}}$ ${f.after || ''}` : '') };
  }

  /* ===== 원본 그대로: 바닥 격자와 장면 그리기 (원본 816–821, 839–915행) ===== */
    function draw3DFloorGrid(y=-2.7){
      for(let i=-5;i<=5;i++){
        draw3DLine(V(i,y,-5),V(i,y,5),i===0?'rgba(52,211,153,.16)':'rgba(16,185,129,.06)',i===0?1.3:.8,false,false,0,'shape');
        draw3DLine(V(-5,y,i),V(5,y,i),i===0?'rgba(52,211,153,.16)':'rgba(16,185,129,.06)',i===0?1.3:.8,false,false,0,'shape');
      }
    }
    function renderMode1(r,{A,B,C,D,M,N}){
      const edges=[[A,C],[A,D],[B,C],[B,D]];
      edges.forEach(([p,q])=>draw3DLine(p,q,'rgba(226,232,240,.56)',1.8,false,false,0,'shape'));
      if(state.steps[3]){
        draw3DPolygon([A,B,M],'rgba(251,191,36,.18)','#fbbf24',1.3,3,'perp');
        draw3DLine(M,N,'#fbbf24',3.4,false,true,3,'projection');
        draw3DRightAngle(N,A,M,.55,'#fbbf24',3,'perp');
        draw3DPoint(N,5,'#fbbf24','N (AB 중점)',{x:-91,y:-8},3,'projection');
        drawBottomTapeBanner(r,'CD ⟂ AM, CD ⟂ BM ⇒ CD ⟂ 평면 ABM ⇒ AB ⟂ CD (90°) | 최단 거리 MN = 3√2');
      }
      if(state.steps[2]){
        draw3DLine(A,M,'#34d399',2.8,false,true,2,'perp');draw3DLine(B,M,'#34d399',2.8,false,true,2,'perp');
        draw3DRightAngle(M,A,D,.55,'#34d399',2,'perp');draw3DRightAngle(M,B,C,.55,'#34d399',2,'perp');
        draw3DPoint(M,5,'#34d399','M (CD 중점)',{x:10,y:8},2,'perp');
        draw3DAngleArc(M,A,C,.85,'#fde047','90°',2,'perp');
      }
      if(state.steps[1]){draw3DLine(A,B,'#38bdf8',3.8,false,true,1,'shape');draw3DLine(C,D,'#f472b6',3.8,false,true,1,'shape');}
      [['A',A],['B',B],['C',C],['D',D]].forEach(([label,p])=>draw3DPoint(p,5,label==='A'||label==='B'?'#38bdf8':'#f472b6',label,{x:9,y:-11},1,'shape'));
    }
    function renderMode2(r,{P,O,H,A}){
      const fy=O.y;
      draw3DPolygon([V(-4,fy,-4),V(4,fy,-4),V(4,fy,4.3),V(-4,fy,4.3)],'rgba(16,185,129,.09)','rgba(52,211,153,.42)',1,0,'shape');
      draw3DLine(add(H,V(0,0,-3.2)),add(A,V(0,0,1)),'#e2e8f0',2.4,false,false,0,'shape');
      if(state.steps[1]){draw3DLine(P,O,'#f472b6',3.5,false,true,1,'perp');draw3DRightAngle(O,P,H,.5,'#f472b6',1,'perp');draw3DPoint(O,5,'#f472b6','O (수선의 발)',{x:-105,y:15},1,'perp');}
      if(state.steps[2]){draw3DLine(O,H,'#38bdf8',3.5,false,true,2,'perp');draw3DRightAngle(H,O,A,.5,'#38bdf8',2,'perp');draw3DPoint(H,5,'#38bdf8','H (OH=3)',{x:10,y:-10},2,'perp');}
      if(state.steps[3]){
        draw3DPolygon([P,O,H],'rgba(251,191,36,.14)',null,1,3,'perp');
        draw3DPolygon([P,H,A],'rgba(56,189,248,.15)',null,1,3,'projection');
        draw3DLine(P,H,'#fbbf24',3.8,false,true,3,'perp');
        draw3DLine(P,A,'#34d399',3.2,false,true,3,'projection');
        draw3DLine(H,A,'#fde047',3.3,false,false,3,'projection');
        draw3DRightAngle(H,P,A,.5,'#fbbf24',3,'perp');
        drawBottomTapeBanner(r,`PA² = PO² + OH² + AH² = ${state.h2.toFixed(1)}² + 3² + (2√6)² | PH = ${Math.hypot(state.h2,3).toFixed(2)}`);
      }
      draw3DPoint(P,6,'#fbbf24',`P (PO=${state.h2.toFixed(1)})`,{x:-40,y:-15},1,'perp');
      draw3DPoint(A,5,'#34d399','A (AH=2√6)',{x:10,y:12},3,'projection');
    }
    function renderMode3(r,{M,B,C,D,A,G}){
      const θ=state.theta3,cos=Math.cos(θ),isRegular=Math.abs(θ-regularAngle)<1e-7;
      draw3DPolygon([D,B,C],'rgba(56,189,248,.14)','#38bdf8',2,0,'shape');
      draw3DPolygon([A,B,C],'rgba(244,114,182,.16)','#f472b6',2,0,'shape');
      draw3DLine(A,D,'rgba(255,255,255,.5)',1.7,true,false,0,'shape');
      if(state.steps[1]){draw3DLine(B,C,'#fde047',3.8,false,true,1,'shape');draw3DPoint(M,5,'#fde047','M (BC 중점)',{x:-98,y:10},1,'shape');}
      if(state.steps[2]){
        draw3DLine(A,M,'#f472b6',3.3,false,true,2,'perp');draw3DLine(D,M,'#38bdf8',3.3,false,true,2,'perp');
        draw3DRightAngle(M,A,B,.52,'#f472b6',2,'perp');draw3DRightAngle(M,D,B,.52,'#38bdf8',2,'perp');
        draw3DAngleArc(M,D,A,.9,'#fde047',`θ ${deg(θ).toFixed(1)}°`,2,'perp');
      }
      if(state.steps[3]){
        draw3DPolygon([A,G,M],'rgba(251,191,36,.20)',null,1,3,'projection');
        draw3DLine(A,G,'#34d399',3.4,true,true,3,'projection');
        draw3DRightAngle(G,A,M,.5,'#34d399',3,'projection');
        draw3DPoint(G,5,'#34d399',isRegular?'G (무게중심)':'G (정사영)',{x:10,y:20},3,'projection');
        drawBottomTapeBanner(r,`θ = ${deg(θ).toFixed(1)}° | h = ${(3*Math.sqrt(3)*Math.sin(θ)).toFixed(3)} | ${isRegular?'정사면체 조건':'접힌 두 면의 각도 조절 중'}`,{
          fraction:{before:'cos θ =',num:isRegular?'1':(cos<0?'-GM':'GM'),den:isRegular?'3':'AM',after:isRegular?'≈ 0.333':`= ${cos.toFixed(3)}`}});
      }
      [['A',A],['B',B],['C',C],['D',D]].forEach(([label,p])=>draw3DPoint(p,5,label==='A'?'#f472b6':'#d1fae5',label,{x:8,y:-12},1,'shape'));
    }
    function renderMode4(r,{A,B,C,D,E,F,G,H}){
      [[E,F],[F,G],[G,H],[H,E],[A,B],[B,C],[C,D],[D,A],[A,E],[B,F],[C,G],[D,H]].forEach(([p,q])=>draw3DLine(p,q,'rgba(203,213,225,.5)',1.6,false,false,0,'shape'));
      if(state.steps[2]){
        draw3DPolygon([E,F,G],'rgba(56,189,248,.15)',null,1,2,'projection');
        draw3DLine(E,G,'#38bdf8',3.3,false,true,2,'projection');draw3DLine(E,F,'#34d399',3.5,false,true,2,'projection');
        draw3DRightAngle(F,E,G,.46,'#34d399',2,'perp');
      }
      if(state.steps[3]){
        draw3DPolygon([A,E,G],'rgba(251,191,36,.18)',null,1,3,'perp');
        draw3DLine(A,E,'#f472b6',3.2,false,true,3,'perp');
        draw3DLine(A,F,'#34d399',2.4,true,false,3,'perp');
        draw3DRightAngle(E,A,G,.52,'#fbbf24',3,'perp');
        draw3DRightAngle(F,A,G,.52,'#34d399',3,'perp');
        drawBottomTapeBanner(r,'cos α = cos β × cos γ  |  cos β = 1/√2, cos γ = 3/5',{
          fraction:{before:'cos α =',num:'3',den:'5√2',after:'≈ 0.424'}});
      }
      if(state.steps[1])draw3DLine(A,G,'#fbbf24',4,false,true,1,'shape');
      [['A',A],['E',E],['F',F],['G',G]].forEach(([label,p])=>draw3DPoint(p,5,label==='A'?'#fbbf24':label==='E'?'#f472b6':'#38bdf8',label,{x:10,y:-9},1,'shape'));
    }

  /* ======================================================================
     2.0 셸 연결 (새로 작성한 부분)
     ====================================================================== */
  const RENDER = { 1: renderMode1, 2: renderMode2, 3: renderMode3, 4: renderMode4 };
  const R2D = 180 / Math.PI, REG_DEG = Math.acos(1 / 3) * R2D;
  const thetaOf = (d) => (Math.abs(d - REG_DEG) < 0.3 ? Math.acos(1 / 3) : d / R2D);
  function sync(s, m) {
    state.mode = m;
    state.h2 = s.h2;
    state.theta3 = thetaOf(s.th);
    state.lens = s.lens;
    state.partIdx = s.part || 0;
    for (let i = 1; i <= 3; i++) state.steps[i] = s.step >= i || state.partIdx === i;
  }
  const cam = (s) => ({ yaw: s.yaw / R2D, pitch: s.pitch / R2D });
  const CAMS = (m) => ({
    iso: { yaw: examData[m].cam.yaw * R2D, pitch: examData[m].cam.pitch * R2D },
    section: { yaw: examData[m].sectionCam.yaw * R2D, pitch: examData[m].sectionCam.pitch * R2D },
    top: { yaw: 0, pitch: 84 },
    front: { yaw: 0, pitch: 5 }
  });
  const TITLES = ['꼬인 위치와 정사면체의 마주 보는 모서리(90°)', '삼수선의 정리 킬러', '이면각과 정사면체(cos θ = 1/3)', '직육면체 대각선과 세 각의 관계'];
  const SHORT = ['꼬인 위치 90°', '삼수선의 정리', '이면각 1/3', '대각선과 세 각'];
  const QUESTIONS = [
    '꼬인 위치의 두 모서리가 수직인지, 그림의 겉모습이 아니라 무엇으로 판정할까?',
    '수선 PO, OH를 그으면 PH ⟂ l이 왜 성립할까?',
    '이면각은 교선 위의 한 점에서 어떤 두 선분이 이루는 각으로 재야 할까?',
    '꼬인 위치에 있는 두 직선이 이루는 각을 정사영을 이용해 두 각의 코사인의 곱으로 나타낼 수 있을까?'
  ];
  const PART_COLORS = ['sky', 'green', 'amber'];

  function readouts(s, m) {
    const g = geometry(m);
    if (m === 1) return [
      { label: '정사면체 모서리 길이 a', value: 'a = ' + norm(sub(g.A, g.B)).toFixed(2), color: 'sky' },
      { label: '중선 길이 AM = BM', value: '3√3 ≈ 5.20', color: 'green' },
      { label: '두 직선이 이루는 각 / 최단 거리', value: 'θ = 90.0° | MN = 3√2 ≈ ' + norm(sub(g.M, g.N)).toFixed(2), color: 'amber', wide: true }
    ];
    if (m === 2) {
      const h = state.h2, ph = Math.hypot(h, 3.0), pa = Math.hypot(ph, Math.sqrt(24));
      return [
        { label: '선분 PO의 길이 / 선분 OH의 길이', value: `PO = ${h.toFixed(2)} | OH = 3.00`, color: 'rose' },
        { label: '선분 PH의 길이', value: `PH = ${ph.toFixed(2)}`, color: 'amber', note: 'PH = √(h²+9)' },
        { label: '선분 PA의 길이', value: `PA = ${pa.toFixed(2)}`, color: 'green', note: 'AH = 2√6', wide: true }
      ];
    }
    if (m === 3) {
      const d = state.theta3 * R2D, c = Math.cos(state.theta3), h = 3 * Math.sqrt(3) * Math.sin(state.theta3);
      const reg = Math.abs(state.theta3 - regularAngle) < 1e-7;
      return [
        { label: '교선에 수직인 선분 AM = DM의 길이', value: '3√3 ≈ 5.20', color: 'rose' },
        { label: '이면각 θ와 cos θ', value: `${d.toFixed(1)}° | cosθ = ${c.toFixed(3)}`, color: 'amber' },
        { label: '꼭짓점 A의 높이 h = AM sin θ', value: `h = ${h.toFixed(3)}`, color: 'green', note: reg ? '정사면체일 때 2√6' : '이면각이 변하는 경우', wide: true }
      ];
    }
    return [
      { label: '직육면체 가로·세로·높이', value: '3 × 4 × 5', color: 'ink', note: '대각선 5√2' },
      { label: 'cos β (AG와 밑면) / cos γ (EG와 EF)', value: 'cosβ = 1/√2 | cosγ = 3/5', color: 'sky' },
      { label: 'cos α = cos β · cos γ', value: '3 / (5√2) ≈ 0.424', color: 'amber', wide: true }
    ];
  }
  function chips(m) {
    if (m === 1) return [{ tex: '\\overline{CD} \\perp \\triangle ABM \\implies \\overline{AB} \\perp \\overline{CD}' }, { tex: '\\theta = 90^\\circ', color: 'amber' }];
    if (m === 2) return [{ tex: '\\overline{PO} \\perp \\alpha, \\; \\overline{OH} \\perp l \\implies \\overline{PH} \\perp l' }, { tex: `\\overline{PA} = ${Math.hypot(Math.hypot(state.h2, 3), Math.sqrt(24)).toFixed(2)}`, color: 'green' }];
    if (m === 3) {
      const reg = Math.abs(state.theta3 - regularAngle) < 1e-7;
      return [{ tex: reg ? '\\cos\\theta = \\dfrac{1}{3}' : '\\cos\\theta = ' + Math.cos(state.theta3).toFixed(3) }, { tex: `\\theta = ${(state.theta3 * R2D).toFixed(1)}^\\circ`, color: 'amber' }];
    }
    return [{ tex: '\\cos\\alpha = \\cos\\beta \\times \\cos\\gamma' }, { tex: '\\cos\\alpha = \\dfrac{3}{5\\sqrt{2}}', color: 'amber' }];
  }

  function sceneOf(m) {
    const d = examData[m];
    return {
      id: 'mode' + m, title: TITLES[m - 1], short: SHORT[m - 1],
      question: QUESTIONS[m - 1],
      guide: d.hint,
      enter: (s) => { const c = CAMS(m).iso; s.yaw = c.yaw; s.pitch = c.pitch; s.h2 = 4.0; s.th = REG_DEG; s.lens = 'all'; },
      controls: () => (m === 2 ? ['h2', 'yaw', 'pitch'] : m === 3 ? ['th', 'yaw', 'pitch'] : ['yaw', 'pitch']),
      presets: () => {
        const c = CAMS(m);
        const near = (st, t) => Math.abs(st.yaw - t.yaw) < 1 && Math.abs(st.pitch - t.pitch) < 1;
        return [
          { group: '시점', label: '입체로 보기', set: c.iso, ms: 600, on: (st) => near(st, c.iso) },
          { group: '시점', label: '핵심 단면 정면에서 보기', color: 'amber', set: c.section, ms: 600, on: (st) => near(st, c.section) },
          { group: '시점', label: '위에서 보기(평면도)', set: c.top, ms: 600, on: (st) => near(st, c.top) },
          { group: '시점', label: '정면도', set: c.front, ms: 600, on: (st) => near(st, c.front) },
          { group: '강조해서 볼 요소', label: '전체 보기', apply: (st) => { st.lens = 'all'; }, on: (st) => st.lens === 'all' },
          { group: '강조해서 볼 요소', label: '원래 도형', apply: (st) => { st.lens = 'shape'; }, on: (st) => st.lens === 'shape' },
          { group: '강조해서 볼 요소', label: '수선·단면', apply: (st) => { st.lens = 'perp'; }, on: (st) => st.lens === 'perp' },
          { group: '강조해서 볼 요소', label: '정사영', apply: (st) => { st.lens = 'projection'; }, on: (st) => st.lens === 'projection' }
        ];
      },
      actions: [{ id: 'spin', play: true, icon: (s) => (s.playing ? 'pause' : 'play'), label: (s) => (s.playing ? '일시 정지' : '입체 자동 회전'), on: (s) => s.playing, run: (s) => { s.playing = !s.playing; } }],
      tick: (s, dt) => { if (!s.playing) return false; s.yaw += 34 * dt; if (s.yaw > 180) s.yaw -= 360; return true; },
      steps: d.steps,
      problem: { tag: d.tag, time: d.targetTime, text: d.question, answer: d.answerBadge, snap: () => ({ h2: 4.0, th: REG_DEG, ...CAMS(m).iso }) },
      solution: { standardTitle: '교과서식 풀이', standardTag: '기본 풀이', quickTitle: '10초 컷 · 핵심 성질을 이용한 풀이', quickTag: '10초 컷', standard: d.textbook, quick: d.shortcut },
      view: (s) => {
        sync(s, m);
        return {
          chips: chips(m),
          status: { tone: 'info', text: `시점 ${Math.round(s.yaw)}° · ${Math.round(s.pitch)}° — 빈 곳을 끌면 회전` },
          readouts: readouts(s, m),
          parts: d.steps.map((t, i) => ({ id: i + 1, name: `${i + 1}단계`, desc: t, color: PART_COLORS[i] }))
        };
      },
      draw: (b, s, v) => {
        B = b;
        sync(s, m);
        SP = APLab.space(b, cam(s));
        const g = geometry(m);
        // 회전할 때마다 점과 라벨이 모두 화면 안에 들어오도록 맞춥니다(바닥 평면은 장식이라 넘쳐도 됩니다).
        SP.fitDrawing(Object.values(g), () => RENDER[m]({ width: b.W, height: b.H }, g));
        sink.tape = null;
        if (s.grid) draw3DFloorGrid(-2.7);
        RENDER[m]({ width: b.W, height: b.H }, g);
        v.tape = sink.tape;
      }
    };
  }

  APLab.createLab({
    id: 'geom-space',
    title: '공간도형 3D',
    courseName: '기하',
    unit: '공간도형과 공간좌표',
    courseColor: 'var(--m-rose)',
    home: '../index.html#geom',
    legacy: '../../labs/기하와벡터/공간도형 3D.html',
    board: {
      kind: 'cartesian', focus: { x: [-4, 4], y: [-4, 4] }, pad: 0.05,
      // 빈 곳을 끌면 카메라 회전(원본과 같은 감도)
      orbit: (s, dx, dy) => {
        s.yaw += dx * 0.0085 * R2D;
        if (s.yaw > 180) s.yaw -= 360;
        if (s.yaw < -180) s.yaw += 360;
        s.pitch = clamp(s.pitch + dy * 0.0075 * R2D, -15, 85);
      }
    },
    params: {
      yaw: { value: -35, min: -180, max: 180, step: 1, color: 'muted', label: '좌우 회전', format: (v) => `${Math.round(v)}°` },
      pitch: { value: 24, min: -15, max: 85, step: 1, color: 'muted', label: '위아래 기울기', format: (v) => `${Math.round(v)}°` },
      h2: { value: 4, min: 1.5, max: 6, step: 0.1, color: 'rose', label: '점 P의 높이 PO', hint: 'PO가 바뀌어도 PH ⟂ l은 그대로입니다', format: (v) => `h = ${v.toFixed(2)} (PH = ${Math.hypot(v, 3).toFixed(2)})` },
      th: { value: 70.53, min: 20, max: 150, step: 0.5, color: 'amber', label: '두 면을 접은 각 θ', hint: '70.5° 부근에서 정사면체의 이면각(cos θ = 1/3)이 됩니다', format: (v) => { const t = thetaOf(v); return `${(t * R2D).toFixed(1)}° (cos θ = ${Math.cos(t).toFixed(3)})`; } }
    },
    state: { lens: 'all' },
    persist: ['lens'],
    scenes: [1, 2, 3, 4].map(sceneOf)
  });
});
