<script>
/* ==========================================================================
   기하 · 쌍곡선 실전 킬러 랩 (AP Math Lab 2.0 이식본) — 4개 탐구관 × 3개 시나리오 = 12장면
   원본: labs/기하와벡터/쌍곡선.html
   이식 방식: 원본의 기하 계산(geometry), 12개 시나리오(scenarios)·정석/빠른 풀이 데이터(examData·solutionBank·dynamicSolution),
   모드별 그리기 코드(plotMode1~4)를 글자 그대로 옮기고, 분필 그리기 함수(drawChalkLine·point·midLabel·drawRightAngleMark…)의
   이름만 아래 어댑터가 새 무대(APLab.Board)에 연결합니다. 이름표는 원본의 '겹침 피하기 배치'를 그대로 따릅니다.
   - 바뀐 점: 셸·레이아웃은 공용 키트가 담당, 무대는 1:1 축척, 점 P는 직접 끄는 손잡이, 하단 비율 줄자는 셸의 요약 띠로,
     가지 전환(우측/좌측)·관찰 렌즈는 조작 패널의 칩으로 이동. 단계는 정리 탭의 단계 플레이어(1단계는 처음부터 켜짐).
   - 원본의 쓰이지 않던 그리기 함수(drawOFHBox·drawRotatedCoordinates·drawOPDiameterCircle·drawVertexComparison·drawReflectionCircle)는 옮기지 않았습니다.
   ========================================================================== */
window.addEventListener('DOMContentLoaded', function () {
  const tex = APLab.tex;


  /* ===== 원본 그대로: 목표 PF 길이로부터 y1 역산 (원본 637–643행) ===== */
    // 주어진 a, b와 목표 PF 길이로부터 y1 역산 (우측 가지: PF = e*x1 - a => x1 = (PF + a)*a / c)
    function calcPyFromPF(a, b, targetPF) {
      const c = Math.hypot(a, b);
      const x1 = ((targetPF + a) * a) / c;
      const ratio = Math.max(0, (x1 * x1) / (a * a) - 1);
      return b * Math.sqrt(ratio);
    }

  /* ===== 원본 그대로: 4대 실전 기출 문제 & 3분 정석 vs 10초 컷 풀이 데이터 (원본 648–786행) ===== */
    const examData = {
      1: {
        badge: "장면 1 · 쌍곡선의 정의와 거리의 차(|PF' - PF| = 2a) 킬러",
        hint: "점 P를 끌어도 두 초점까지의 거리의 차 <span class='text-pink-300 font-bold'>|PF' - PF| = 2a = 6</span>이 변하지 않음을 확인하세요. <span class='text-amber-300 font-bold'>[문제 조건으로 그림 맞추기]</span>를 누르면 PF'=11, PF=5인 위치로 이동합니다.",
        tag: "쌍곡선의 정의",
        targetTime: "목표 시간: 5초",
        question: () => `쌍곡선 ${tex('\\dfrac{x^2}{9} - \\dfrac{y^2}{16} = 1')} 의 두 초점을 ${tex("F(c, 0), \\; F'(-c, 0)")} ${tex('(c > 0)')}이라 하자. 제1사분면에 있는 쌍곡선 위의 점 ${tex('P')}에 대하여 ${tex("\\overline{PF'} = 11")} 일 때, 선분 ${tex('\\overline{PF}')}의 길이와 삼각형 ${tex("PF'F")}의 둘레의 길이를 구하시오.`,
        answerBadge: () => `${tex('\\overline{PF} = 5')}, 둘레 ${tex('= 26')}`,
        // a=3, b=4 => c=5. PF'=11 => PF = 11 - 2a = 5.
        snap: {
          a: 3.0,
          b: 4.0,
          py: calcPyFromPF(3.0, 4.0, 5.0) // x1 = (5+3)*3/5 = 4.8, y1 = 4*sqrt((4.8/3)^2 - 1) = 4*sqrt(1.56) ≈ 4.996
        },
        steps: [
          "두 초점 F(5, 0), F'(-5, 0) 및 선분 PF', PF 연결",
          "가로 2a, 세로 2b (6 × 8)인 직사각형과 점근선(그 직사각형의 두 대각선) 표시",
          "|PF' - PF| = 2a (11 - 5 = 6)와 둘레 = 26"
        ],
        textbook: () => ({
          steps: `① ${tex('a^2 = 9, \\; b^2 = 16 \\implies c = \\sqrt{9 + 16} = 5')} 이므로 ${tex("F(5, 0), \\; F'(-5, 0)")}<br/>
② 점 ${tex('P(x_1, y_1)')}에서 ${tex("\\overline{PF'} = \\sqrt{(x_1 + 5)^2 + y_1^2} = 11")}<br/>
③ 쌍곡선 식 ${tex('y_1^2 = 16\\left(\\dfrac{x_1^2}{9} - 1\\right)')} 을 대입하여 정리:<br/>
&nbsp;&nbsp;${tex('(x_1 + 5)^2 + \\dfrac{16}{9}x_1^2 - 16 = 121 \\implies \\dfrac{25}{9}x_1^2 + 10x_1 - 112 = 0')}<br/>
④ 인수분해로 ${tex('x_1 = \\dfrac{24}{5} = 4.8')} 구한 뒤 다시 ${tex('\\overline{PF} = \\sqrt{(x_1 - 5)^2 + y_1^2} = 5')}를 계산한다.`,
          warning: "주의: 점 P의 좌표를 구하려고 두 점 사이의 거리 공식에 대입해 이차방정식을 풀면 계산이 매우 길어집니다. 쌍곡선의 정의를 이용하면 PF를 바로 구할 수 있습니다."
        }),
        shortcut: () => ({
          steps: `① 제1사분면의 점은 오른쪽 곡선 위에 있으므로 가까운 초점은 ${tex('F(5,0)')}, 먼 초점은 ${tex("F'(-5,0)")}입니다. 따라서 정의의 절댓값은 ${tex("PF'-PF")}로 풀립니다.<br/>
② 주축의 길이는 ${tex('2a = 2 \\times 3 = 6')}이므로 ${tex("PF'-PF=2a=6")}입니다.<br/>
③ ${tex("11 - \\overline{PF} = 6 \\implies")} 연립하지 않고도 <strong class="text-emerald-300">${tex('\\overline{PF} = 5')}</strong>이다.<br/>
④ ${tex("\\triangle PF'F")} 둘레 ${tex("= \\overline{PF'} + \\overline{PF} + \\overline{F'F} = 11 + 5 + 10 =")} <strong class="text-amber-300">${tex('26')}</strong>이다.`,
          highlight: "쌍곡선 위의 점 P에서 두 초점까지의 거리가 주어지면, 좌표를 구하지 않고 |PF' - PF| = 2a 를 먼저 이용합니다. (5초 컷!)"
        })
      },

      2: {
        badge: "장면 2 · 초점에서 점근선에 내린 수선의 길이 (= b)",
        hint: "초점 <span class='text-rose-400 font-bold'>F(c, 0)에서 점근선에 내린 수선의 길이는 항상 b</span>이고, 원점에서 수선의 발 H까지의 거리는 <span class='text-amber-300 font-bold'>항상 a</span>임을 확인하세요.",
        tag: "초점에서 점근선에 내린 수선",
        targetTime: "목표 시간: 3초",
        question: () => `쌍곡선 ${tex('\\dfrac{x^2}{9} - \\dfrac{y^2}{16} = 1')} 의 양의 초점 ${tex('F(5, 0)')}에서 양의 기울기를 갖는 점근선 ${tex('y = \\dfrac{4}{3}x')} 에 내린 수선의 발을 ${tex('H')}라 하자. 이때 선분 ${tex('\\overline{FH}')}의 길이와 선분 ${tex('\\overline{OH}')}의 길이, 그리고 직각삼각형 ${tex('OFH')}의 넓이를 구하시오.`,
        answerBadge: () => `${tex('\\overline{FH} = b = 4, \\; \\overline{OH} = a = 3')}, 넓이 ${tex('= 6')}`,
        snap: {
          a: 3.0,
          b: 4.0,
          py: 3.2
        },
        steps: [
          "점근선 y = ±$\\frac{b}{a}x$와 2a × 2b 직사각형(점근선은 이 직사각형의 대각선)",
          "초점 F(c, 0)에서 점근선에 내린 수선의 발 H (직각삼각형 OFH)",
          "OH = a(3), FH = b(4), OF = c(5), 점 H는 원 x²+y²=a² 위의 점"
        ],
        textbook: () => ({
          steps: `① 점근선의 방정식: ${tex('y = \\dfrac{4}{3}x \\iff 4x - 3y = 0')}<br/>
② 초점 ${tex('F(5, 0)')}에서 직선 ${tex('4x - 3y = 0')} 까지 점과 직선 사이의 거리 공식 대입:<br/>
&nbsp;&nbsp;${tex('\\overline{FH} = \\dfrac{|4 \\cdot 5 - 3 \\cdot 0|}{\\sqrt{4^2 + (-3)^2}} = \\dfrac{20}{5} = 4')}<br/>
③ 수직인 직선 ${tex('FH : y = -\\dfrac{3}{4}(x - 5)')} 와 ${tex('y = \\dfrac{4}{3}x')} 를 연립하여<br/>
&nbsp;&nbsp;교점 ${tex('H\\left(\\dfrac{9}{5}, \\dfrac{12}{5}\\right)')} 구한 뒤 ${tex('\\overline{OH} = \\sqrt{(\\frac{9}{5})^2 + (\\frac{12}{5})^2} = 3')}을 계산한다.`,
          warning: "주의: 수선의 발 H의 좌표를 구하려고 두 직선의 방정식을 연립하면 계산이 길어집니다."
        }),
        shortcut: () => ({
          steps: `① 초점 ${tex('F(c, 0)')}에서 점근선 ${tex('bx - ay = 0')} 까지의 거리는 점과 직선 사이의 거리 공식에 의해:<br/>
&nbsp;&nbsp;<strong class="text-pink-300">${tex('\\overline{FH} = \\dfrac{bc}{\\sqrt{a^2 + b^2}} = \\dfrac{bc}{c} = b = 4')}</strong>이다.<br/>
② 직각삼각형 ${tex('OFH')}에서 ${tex('\\overline{OF} = c, \\; \\overline{FH} = b')}이므로 피타고라스 정리(${tex('a^2 + b^2 = c^2')})에 의해 <strong class="text-amber-300">${tex('\\overline{OH} = a = 3')}</strong>이다.<br/>
③ 따라서 ${tex('\\triangle OFH')}는 밑변 ${tex('a=3')}, 높이 ${tex('b=4')}, 빗변 ${tex('c=5')}인 직각삼각형 ⇒ 넓이 <strong class="text-emerald-300">${tex('= \\dfrac{1}{2}ab = 6')}</strong>이다.`,
          highlight: "초점 F에서 점근선에 내린 수선의 길이는 FH = b, 원점에서 수선의 발까지의 거리는 OH = a 입니다."
        })
      },

      3: {
        badge: "장면 3 · 쌍곡선 위의 점에서 두 점근선에 내린 수선의 길이의 곱",
        hint: "쌍곡선 위의 점 P를 어디로 끌어도 두 점근선에 내린 수선의 길이의 곱 <span class='text-sky-300 font-bold'>l₁ × l₂ = a²b² / c²</span>이 일정함을 확인하세요.",
        tag: "두 점근선까지의 거리의 곱 킬러",
        targetTime: "목표 시간: 5초",
        question: () => `쌍곡선 ${tex('\\dfrac{x^2}{9} - \\dfrac{y^2}{16} = 1')} 위의 임의의 점 ${tex('P')}에서 두 점근선 ${tex('y = \\dfrac{4}{3}x, \\; y = -\\dfrac{4}{3}x')} 에 내린 수선의 발을 각각 ${tex('Q_1, Q_2')}라 하자. 두 수선의 길이의 곱 ${tex('\\overline{PQ_1} \\times \\overline{PQ_2}')}의 값을 구하시오.`,
        answerBadge: () => `${tex('\\dfrac{a^2 b^2}{c^2} = \\dfrac{144}{25} = 5.76')}`,
        snap: {
          a: 3.0,
          b: 4.0,
          py: 3.6
        },
        steps: [
          "두 점근선 bx - ay = 0, bx + ay = 0 표시",
          "점 P에서 두 점근선에 내린 수선의 발 Q₁, Q₂ 및 수선 l₁, l₂",
          "l₁ × l₂ = (a²b²) / c² = 144 / 25 = 5.76 (일정)"
        ],
        textbook: () => ({
          steps: `① 두 점근선 식: ${tex('4x - 3y = 0')}, ${tex('4x + 3y = 0')}<br/>
② 쌍곡선 위의 점 ${tex('P(x_1, y_1)')}에서 각 점근선까지의 거리 ${tex('l_1, l_2')}:<br/>
&nbsp;&nbsp;${tex('l_1 = \\dfrac{|4x_1 - 3y_1|}{\\sqrt{4^2 + (-3)^2}} = \\dfrac{|4x_1 - 3y_1|}{5}')}, &nbsp; ${tex('l_2 = \\dfrac{|4x_1 + 3y_1|}{5}')}<br/>
③ 두 거리의 곱: ${tex('l_1 \\times l_2 = \\dfrac{|16x_1^2 - 9y_1^2|}{25}')}<br/>
④ 쌍곡선 방정식 양변에 ${tex('144')}를 곱하면 ${tex('16x_1^2 - 9y_1^2 = 144')} 이므로 대입하면 ${tex('\\dfrac{144}{25}')}.`,
          warning: "주의: 점과 직선 사이의 거리 공식을 두 번 쓰고 곱셈 공식으로 전개하면 계산이 길어집니다."
        }),
        shortcut: () => ({
          steps: `① 쌍곡선 위의 임의의 점 ${tex('P')}에서 두 점근선에 내린 수선의 길이의 곱은 점 P의 위치와 관계없이 일정하다.<br/>
② 그 값은 <strong class="text-sky-300">${tex('l_1 \\times l_2 = \\dfrac{a^2 b^2}{a^2 + b^2} = \\dfrac{a^2 b^2}{c^2}')}</strong><br/>
③ 가장 간단한 점인 꼭짓점 ${tex('A(3, 0)')}에서 계산해도 같은 값이다.<br/>
&nbsp;&nbsp;${tex('a^2 = 9, \\; b^2 = 16, \\; c^2 = 25')} 이므로 <strong class="text-amber-300">${tex('\\dfrac{9 \\times 16}{25} = \\dfrac{144}{25}')}</strong>이다.`,
          highlight: "두 점근선에 내린 수선의 길이의 곱은 항상 a²b² / c² 입니다. 값이 일정하므로 점 P를 꼭짓점 (a, 0)에 두고 구해도 됩니다."
        })
      },

      4: {
        badge: "장면 4 · 쌍곡선의 접선(내각의 이등분선)과 초점에서 접선까지의 거리의 곱(b²)",
        hint: "쌍곡선 위의 점 P에서의 <span class='text-sky-300 font-bold'>접선은 ∠F'PF를 이등분</span>하며, 두 초점에서 접선에 내린 수선의 길이의 곱은 <span class='text-purple-300 font-bold'>d₁ × d₂ = b²</span>으로 일정합니다.",
        tag: "접선과 각의 이등분선 킬러",
        targetTime: "목표 시간: 5초",
        question: () => `쌍곡선 ${tex('\\dfrac{x^2}{9} - \\dfrac{y^2}{16} = 1')} 위의 점 ${tex('P')}에서의 접선 ${tex('l')}이 ${tex('x')}축과 만나는 점을 ${tex('T')}라 하자. ${tex("\\overline{PF'} = 12, \\; \\overline{PF} = 6")} 일 때, ${tex("\\overline{F'T} : \\overline{TF}")}의 비와 두 초점 ${tex("F, F'")}에서 접선 ${tex('l')}에 내린 수선의 길이의 곱 ${tex('d_1 \\times d_2')}를 구하시오.`,
        answerBadge: () => `${tex("\\overline{F'T} : \\overline{TF} = 2 : 1")}, ${tex('d_1 d_2 = b^2 = 16')}`,
        // a=3, b=4 => PF'=12, PF=6 (차=6=2a)
        snap: {
          a: 3.0,
          b: 4.0,
          py: calcPyFromPF(3.0, 4.0, 6.0) // x1 = (6+3)*3/5 = 5.4, y1 = 4*sqrt((5.4/3)^2 - 1) = 4*sqrt(2.24) ≈ 5.9866
        },
        steps: [
          "접점 P에서의 접선 l 및 x절편 T(a²/x₁, 0) 표시",
          "접선 PT가 ∠F'PF의 이등분선(α = α)이므로 F'T : TF = PF' : PF",
          "두 초점에서 접선에 내린 수선의 발 H₁, H₂ 및 곱 d₁ × d₂ = b² = 16"
        ],
        textbook: () => ({
          steps: `① ${tex('\\overline{PF} = 6')} 조건으로부터 점 ${tex('P')}의 ${tex('x')}좌표 ${tex('x_1 = \\dfrac{27}{5}')} 계산<br/>
② 접선의 방정식 ${tex('\\dfrac{x_1 x}{9} - \\dfrac{y_1 y}{16} = 1')} 에 ${tex('y = 0')} 대입하여 ${tex('x')}절편 ${tex('T')} 계산:<br/>
&nbsp;&nbsp;${tex('x_T = \\dfrac{9}{x_1} = \\dfrac{9}{\\frac{27}{5}} = \\dfrac{5}{3}')}<br/>
③ ${tex("F'(-5, 0), \\; F(5, 0)")} 과의 거리비 계산:<br/>
&nbsp;&nbsp;${tex("\\overline{F'T} = \\dfrac{5}{3} - (-5) = \\dfrac{20}{3}, \\; \\overline{TF} = 5 - \\dfrac{5}{3} = \\dfrac{10}{3} \\implies 2 : 1")}`,
          warning: "주의: 타원에서는 법선이 내각을 이등분하지만, 쌍곡선에서는 접선이 내각을 이등분합니다. 좌표를 구해 풀면 계산이 길어집니다."
        }),
        shortcut: () => ({
          steps: `① 쌍곡선 위의 점 P에서의 접선은 <strong class="text-sky-300">${tex("\\angle F'PF")}를 이등분</strong>한다.<br/>

      c.moveTo(t.x - d.x * 4 + n.x * 5, t.y - d.y * 4 + n.y * 5);
      c.lineTo(t.x + d.x * 3, t.y + d.y * 3);
      c.lineTo(t.x - d.x * 4 - n.x * 5, t.y - d.y * 4 - n.y * 5);
      c.stroke();
    }
    c.restore();
  }
  function drawSmartLabels() {
    const B = BOARD;
    if (B._bbox || B.thumb) { state._labels = []; state._blocks = []; return; }
    const c = B.ctx, r = { width: B.W, height: B.H };
    const cr = B.canvas.getBoundingClientRect();
    const blocked = [];
    document.querySelectorAll('.apl-formula-chip, .apl-status:not([hidden]), .apl-card-float:not([hidden]), .apl-tools').forEach((q) => {
      const b = q.getBoundingClientRect();
      if (b.width > 0 && b.height > 0) blocked.push({ x: b.left - cr.left - 7, y: b.top - cr.top - 7, w: b.width + 14, h: b.height + 14 });
    });
    const taken = [...blocked, ...state._blocks];
    c.save();
    c.globalAlpha = 1;
    c.setLineDash([]);
    c.shadowBlur = 0;
    c.font = `700 ${12 * B.fs}px ${B.font}`;
    for (const label of state._labels) {
      const { s, text, color, offset } = label, w = c.measureText(text).width + 12, h = 21 * B.fs;
      if (s.x < 0 || s.x > r.width || s.y < 0 || s.y > r.height) continue;
      const cand = [offset, { x: 12, y: 23 }, { x: 12, y: -28 }, { x: -w - 12, y: 22 }, { x: -w - 12, y: -27 }, { x: -w / 2, y: 37 }, { x: -w / 2, y: -40 }, { x: 25, y: -6 }, { x: -w - 25, y: -6 }];
      let best = null, sc = Infinity;
      for (const p of cand) {
        const x = clamp(s.x + p.x, 3, Math.max(3, r.width - w - 3)), y = clamp(s.y + p.y - h + 5, 3, Math.max(3, r.height - h - 3));
        let penalty = (Math.abs(x - (s.x + p.x)) + Math.abs(y - (s.y + p.y))) * 0.45 + Math.hypot(x + w / 2 - s.x, y + h / 2 - s.y) * 0.03;
        for (const q of taken) {
          const ix = Math.max(0, Math.min(x + w, q.x + q.w) - Math.max(x, q.x)), iy = Math.max(0, Math.min(y + h, q.y + q.h) - Math.max(y, q.y));
          penalty += ix * iy * 2.0;
        }
        if (penalty < sc) { sc = penalty; best = { x, y, w, h }; }
      }
      if (!best) continue;
      c.beginPath();
      c.roundRect(best.x, best.y, best.w, best.h, 6);
      c.fillStyle = B.colors.halo;
      c.fill();
      c.strokeStyle = B.color('muted', 0.4);
      c.lineWidth = 0.9;
      c.stroke();
      c.fillStyle = B.color(color);
      c.textBaseline = 'middle';
      c.textAlign = 'left';
      c.fillText(text, best.x + 6, best.y + best.h / 2 + 0.6);
      taken.push(best);
    }
    c.restore();
    state._labels = [];
    state._blocks = [];
  }

  /* ===== 원본 그대로: 보조 함수·기하 커널 (원본 849–891행) ===== */

    const fmt = (n,d=2) => Number.isFinite(n)?n.toFixed(d):'—';
    const dist=(p,q)=>Math.hypot(p.x-q.x,p.y-q.y);
    const dot=(p,q)=>p.x*q.x+p.y*q.y;
    const sub=(p,q)=>({x:p.x-q.x,y:p.y-q.y});
    const add=(p,q)=>({x:p.x+q.x,y:p.y+q.y});
    const mul=(k,p)=>({x:k*p.x,y:k*p.y});
    const det=(p,q)=>p.x*q.y-p.y*q.x;
    const clamp=(v,lo,hi)=>Math.min(hi,Math.max(lo,v));
    function currentP(){return {x:state.branch*state.a*Math.hypot(1,state.py/state.b),y:state.py};}
    function lineFoot(point, A, B, C) { const t=(A*point.x+B*point.y+C)/(A*A+B*B);return {x:point.x-t*A,y:point.y-t*B}; }
    function geometry(a,b,P){
      const c=Math.hypot(a,b), O={x:0,y:0},F={x:c,y:0},Fp={x:-c,y:0};
      const n={x:P.x/(a*a),y:-P.y/(b*b)};
      const L=Math.hypot(n.x,n.y), normal=mul(1/L,n), tangent={x:-normal.y,y:normal.x};
      const T={x:a*a/P.x,y:0};
      const H1=lineFoot(F,n.x,n.y,-1),H2=lineFoot(Fp,n.x,n.y,-1);
      const H=lineFoot(F,b,-a,0), Q1=lineFoot(P,b,-a,0),Q2=lineFoot(P,b,a,0);
      const alpha=(P.x/a+P.y/b)/2, beta=(P.x/a-P.y/b)/2;
      const R1={x:a*alpha,y:b*alpha}, R2={x:a*beta,y:-b*beta};
      const dPlus=P.x/a-P.y/b, dMinus=P.x/a+P.y/b;
      const M1={x:a/dPlus,y:b/dPlus},M2={x:a/dMinus,y:-b/dMinus};
      const Fstar=sub(mul(2,H1),F);
      const K={x:state.branch*a*Math.sqrt(a*a+2*b*b)/c,y:(state.py<0?-1:1)*b*b/c};
      const u={x:a/c,y:b/c},v={x:a/c,y:-b/c};
      const focalP=dist(P,F),focalFp=dist(P,Fp);
      const l1=dist(P,Q1),l2=dist(P,Q2),d1=dist(F,H1),d2=dist(Fp,H2);
      return {a,b,c,O,F,Fp,P,T,H1,H2,H,Q1,Q2,R1,R2,M1,M2,Fstar,K,tangent,normal,u,v,
        focalP,focalFp,l1,l2,d1,d2,
        focusDiff:Math.abs(focalFp-focalP),asymProduct:l1*l2,tanProduct:d1*d2,
        tanArea:Math.abs(det(M1,M2))/2,parArea:Math.abs(det(R1,R2)),
        OMproduct:dist(O,M1)*dist(O,M2),baseRatio:dist(Fp,T)/dist(F,T),focalRatio:focalFp/focalP,
        angle:Math.acos(clamp(Math.abs(a*a-b*b)/(c*c),-1,1))*180/Math.PI};
    }
    // 수치 불변량은 항상 좌표로 계산한 실측치와 독립 이론값을 대조한다.
    function measuredErrors(g){
      let theory=[2*g.a,g.a*g.a*g.b*g.b/(g.c*g.c),g.b*g.b,g.a*g.b,g.a*g.b/2,g.c*g.c];
      let meas=[g.focusDiff,g.asymProduct,g.tanProduct,g.tanArea,g.parArea,g.OMproduct];
      const ratioErr=Math.abs(g.baseRatio-g.focalRatio)/Math.max(1e-12,g.focalRatio);
      const maxErr=Math.max(ratioErr,...meas.map((v,i)=>Math.abs(v-theory[i])/Math.max(1e-12,theory[i])));
      return {maxErr,meas,theory,ratioErr};
    }

  /* ===== 원본 그대로: 점근선·박스, 렌즈 겹침, 접선, 초점 (원본 950–956, 982–996, 999행) ===== */
    function drawAsymptotesAndBox(a,b,box=true,subtle=false){
      const span=25,color=subtle?'rgba(56,189,248,.29)':'rgba(56,189,248,.58)';
      drawChalkLine(-span,-b/a*span,span,b/a*span,color,1.9,true);
      drawChalkLine(-span,b/a*span,span,-b/a*span,color,1.9,true);
      if(box){drawPolygon([{x:-a,y:b},{x:a,y:b},{x:a,y:-b},{x:-a,y:-b}],'rgba(251,191,36,.04)','rgba(251,191,36,.38)',1.4);}
      point({x:a,y:0},palette.blue,`A(${fmt(a,1)},0)`,{x:10,y:-17});point({x:-a,y:0},palette.blue,`A′(-${fmt(a,1)},0)`,{x:-20,y:-17});
    }
    function focus(part){return state.partIdx===part}
    function renderLensOverlay(g){

    function drawTangent(g,color=palette.blue,width=2.5){

      const projections=targets.map(x=>dot(sub(x,p),d));

    }
    function drawFoci(g){point(g.F,palette.red,`F(${fmt(g.c,1)},0)`,{x:9,y:23});point(g.Fp,palette.red,`F′(-${fmt(g.c,1)},0)`,{x:-15,y:23});}

  /* ===== 원본: 정의 차이 그림 (원본 1005–1014행, 호 방향만 수학 각도로) ===== */

      // [2.0] 화면 각도 대신 수학 각도(y 위쪽)로 호의 방향을 잡음

    }

  /* ===== 원본 그대로: 모드별 그리기 plotMode1~4 (원본 1054–1145, 1157–1194행; state.scale → 무대 배율 BOARD.k) ===== */

    // [2.0] 원본 arcBetween: 화면 각도 호 → 무대 호(반지름은 화면 32·41px 그대로, 수학 각도 사용)
    function arcBetween(g){
      if(Math.abs(g.P.y)<.11){return;} // 정점 근방 겹침 방지
      const v1=sub(g.F,g.P),v2=sub(g.Fp,g.P);
      const normalize=v=>mul(1/(Math.hypot(v.x,v.y)||1),v);
      const bis=normalize(add(normalize(v1),normalize(v2)));
      const a1=Math.atan2(v1.y,v1.x),a2=Math.atan2(v2.y,v2.x),ab=Math.atan2(bis.y,bis.x);
      // [표시 보강] 접선이 이등분한 두 각 α를 같은 색·같은 반지름·같은 기호(α)로 그려 '같은 각'임을 보이고, 값은 이등분선(접선) 위 각 안쪽에 씁니다.
      //   (이전: 청록/분홍·반지름 32/41px로 서로 달라 보였고, P 이름표 아래에 가려져 보이지 않았음)
      const tpt={x:g.P.x+Math.cos(ab),y:g.P.y+Math.sin(ab)};
      markAng(g.P,g.F,tpt,palette.gold,'α',34,1,14);
      markAng(g.P,tpt,g.Fp,palette.gold,'α',34,1,14);
      angValue(g.P,g.F,g.Fp,`α = ${fmt(degAt(g.P,g.F,g.Fp)/2,1)}°`,palette.gold,78);
    }

    function renderPartFocus(g){
      if(state.partIdx<0)return;
      const i=state.partIdx,m=state.mode,s=state.subtype;
      const pair=(p,q)=>line(p,q,palette.gold,4.2,false,true);
      let pairs=[];
      if(m===1) pairs= i===0?[[g.P,g.F],[g.P,g.Fp]]:i===1?[[g.O,g.F],[g.O,g.Fp]]:[[g.Fp,g.P],[g.P,g.F]];
      if(m===2){
        if(s===3)pairs=i===0?[[g.M1,g.M2]]:i===1?[[g.M1,g.P],[g.P,g.M2]]:[[g.O,g.M1],[g.O,g.M2]];
        else pairs=i===0?[[g.F,g.H]]:i===1?[[g.O,g.H],[g.H,g.F]]:[[g.P,g.Q1]];
      }
      if(m===3){
        if(s===2)pairs=i===0?[[g.O,g.R1],[g.O,g.R2]]:i===1?[[g.R1,g.P],[g.R2,g.P]]:[[g.O,g.R1],[g.R1,g.P],[g.P,g.R2],[g.R2,g.O]];
        else pairs=i===0?[[g.O,g.Q1],[g.O,g.Q2]]:i===1?[[g.P,g.Q1],[g.P,g.Q2]]:[[g.Q1,g.P],[g.P,g.Q2]];
      }
      if(m===4){
        if(s===1)pairs=i===0?[[g.P,g.T]]:i===1?[[g.P,g.F],[g.P,g.Fp]]:[[g.Fp,g.T],[g.T,g.F]];
        else if(s===2)pairs=i===0?[[g.F,g.Fstar]]:i===1?[[g.Fp,g.Fstar],[g.F,g.Fstar]]:[[g.O,g.H1]];
        else pairs=i===0?[[g.P,g.H1],[g.P,g.H2]]:i===1?[[g.F,g.H1],[g.Fp,g.H2]]:[[g.F,g.H1],[g.Fp,g.H2]];
      }
      pairs.forEach(([p,q])=>pair(p,q));
    }

          `${mtex(String.raw`d_1d_2=\frac{\frac{c^2x_1^2}{a^4}-1}{L^2}`)}이며, 쌍곡선 식 ${mtex(String.raw`y_1^2/b^2=x_1^2/a^2-1`)}과 ${mtex(String.raw`c^2=a^2+b^2`)}를 대입하면 ${mtex(String.raw`d_1d_2=b^2=16`)}.`,
          `수선의 발 H₁, H₂에 대해 ${mtex(String.raw`OH_1=OH_2=a`)}도 계산으로 확인한다.`
        ],
        shortcut:[
          `접선 위의 H₁,H₂는 각각 F, F′에서 내린 수선의 발이다. 두 점 모두 원 ${mtex(String.raw`x^2+y^2=a^2`)} 위를 움직인다.`,
          `접선에 대한 대칭점으로 보조선을 그으면 ${mtex(String.raw`OH_1=OH_2=a`)}가 중점연결정리로 확인된다(두 초점 각각에 적용).`,
          `H₁, H₂가 원 위에 있다는 성질만으로는 거리의 곱을 구할 수 없다. 거리의 곱은 점과 접선 사이의 거리 공식 두 개를 곱하여 ${mtex(String.raw`d_1d_2=b^2`)}로 구한다.`
        ],warning:'두 수선의 발이 원 x²+y²=a² 위에 있다는 사실과 거리의 곱이 b²라는 사실은 서로 다른 성질입니다.',insight:'수선의 발은 원 x²+y²=a² (반지름 a) 위에 있고, 두 초점에서 접선까지의 거리의 곱은 b²입니다.'
      }
    };
    function dynamicSolution(g){
      const m=state.mode,t=state.subtype,side=state.branch;
      if(t===1 && (m!==1&&m!==2&&m!==3&&m!==4))return null;
      if(m===1&&t===3&&side===-1)return {
        formal:[`왼쪽 곡선에서는 먼 초점이 F, 가까운 초점이 F′이다.`,
          `주어진 ${mtex(String.raw`PF=F'F=2c=10`)}과 정의 ${mtex(String.raw`PF-PF'=2a=6`)}에 의해 ${mtex(String.raw`PF'=4`)}.`,
          `삼각형의 둘레는 ${mtex(String.raw`10+10+4=24`)}.`],
        shortcut:[`먼 초점까지의 거리 ${mtex(String.raw`2c=10`)}에서 거리의 차 ${mtex(String.raw`2a=6`)}을 뺀다.`,
          `가까운 초점까지의 거리 ${mtex(String.raw`PF'=4`)}, 둘레 ${mtex(String.raw`24`)}.`],
        warning:'왼쪽 곡선에서는 PF=F′F가 이등변삼각형 조건입니다.',
        insight:'가까운 초점이 어느 쪽인지 먼저 판별한 뒤 2c−2a를 계산하면 됩니다.'};
      if(t===1 && (m===1||m===4) && side===-1){
        if(m===1)return {
          formal:[`왼쪽 곡선 위의 점 P는 ${mtex(String.raw`PF-PF'=2a=6`)}을 만족한다.`,
                  `${mtex(String.raw`PF=11`)}을 주었으므로 ${mtex(String.raw`PF'=11-6=5`)}.`,
                  `${mtex(String.raw`F'F=2c=10`)}이므로 둘레는 ${mtex(String.raw`11+5+10=26`)}.`],
          shortcut:[`왼쪽 곡선에서는 가까운 초점이 F′이다. 먼 초점까지의 거리에서 ${mtex(String.raw`2a=6`)}만 뺀다.`,
                    `${mtex(String.raw`PF'=11-6=5`)}이고 둘레는 ${mtex(String.raw`26`)}.`],
          warning:'오른쪽 곡선과 달리 먼 초점은 F, 가까운 초점은 F′입니다.',insight:'어느 쪽 곡선에서나 (먼 초점까지의 거리) − (가까운 초점까지의 거리) = 2a.'};
        return {
          formal:[`왼쪽 곡선에서 ${mtex(String.raw`PF=12,\;PF'=6`)}이다.`,
                  `접선과 x축 교점 ${mtex(String.raw`T=(a^2/x_1,0)`)}은 F′F 안에 놓인다.`,
                  `삼각형의 내각의 이등분선의 성질에 의해 ${mtex(String.raw`F'T/TF=PF'/PF=6/12=1/2`)}.`,
                  `두 초점에서 접선까지의 거리의 곱은 ${mtex(String.raw`d_1d_2=b^2=16`)}.`],
          shortcut:[`T에서 두 초점 F′, F까지의 거리의 비는 P에서 F′, F까지의 거리의 비와 같다.`,
                    `왼쪽 곡선에서는 ${mtex(String.raw`F'T:TF=PF':PF=6:12=1:2`)}.`,
                    `두 초점에서 접선까지의 거리의 곱 ${mtex(String.raw`b^2=16`)}도 함께 확인한다.`],
          warning:'왼쪽 곡선에서는 2:1이 아니라 1:2입니다. 같은 성질(내각의 이등분선)로 판정하세요.',insight:'접선이 삼각형 PF′F의 내각을 이등분하며, 점 P가 놓인 곡선에 따라 두 거리의 비의 순서가 바뀝니다.'};
      }
      if(t===1){
        const old=examData[m],f=old.textbook(),q=old.shortcut();
        return {formalHtml:f.steps,shortcutHtml:q.steps,warning:f.warning,insight:q.highlight};
      }
      return solutionBank[`${m}-${t}`];
    }

  /* ===== 원본 그대로: 예제 조건 판정과 탐구 한 줄 (원본 1478–1502행), 스냅 목표 (원본 1533–1540행) ===== */
    function exampleConditions(g){
      const {a,b}=snapTarget(),m=state.mode,t=state.subtype,nearfar=nearFar(g);
      const ab=Math.abs(g.a-a)<.016&&Math.abs(g.b-b)<.016;
      if(!ab)return false;
      if(m===1&&t===1)return Math.abs(dist(g.P,nearfar.far)-11)<.035;
      if(m===1&&t===3)return Math.abs(dist(g.P,nearfar.far)-2*g.c)<.035;
      if(m===3&&t===3)return Math.abs(g.P.y)<.025;
      if(m===4&&t===1)return Math.abs(dist(g.P,nearfar.near)-6)<.035;
      return true;
    }
    function explorationLine(g){
      const m=state.mode,t=state.subtype,nf=nearFar(g),near=dist(g.P,nf.near),far=dist(g.P,nf.far);
      if(m===1&&t===1)return `먼 초점 ${fmt(far)} − 가까운 초점 ${fmt(near)} = 2a ${fmt(2*g.a)} · 둘레 ${fmt(far+near+2*g.c)}`;
      if(m===1&&t===2)return `∠F′KF=90°인 점 K에서 넓이 = b² ${fmt(g.b*g.b)} · 점 P에서 ∠F′PF의 크기는 ${fmt(Math.acos(clamp(dot(sub(g.F,g.P),sub(g.Fp,g.P))/(g.focalP*g.focalFp),-1,1))*180/Math.PI,1)}°`;
      if(m===1)return `먼 초점까지의 거리 ${fmt(far)} / 두 초점 사이의 거리 2c ${fmt(2*g.c)} · 둘레 ${fmt(g.focalP+g.focalFp+2*g.c)}`;
      if(m===2&&t===1)return `OH=${fmt(dist(g.O,g.H))}, FH=${fmt(dist(g.F,g.H))}, OF=${fmt(g.c)}`;
      if(m===2&&t===2)return `두 점근선이 이루는 예각 ${fmt(g.angle,2)}° · 이심률 e=${fmt(g.c/g.a,4)} · ${Math.abs(g.a-g.b)<.012?'수직 성립':'수직 조건 해제'}`;
      if(m===2)return `△OM₁M₂ 넓이 ${fmt(g.tanArea)} (=ab ${fmt(g.a*g.b)}) · OM₁·OM₂ = ${fmt(g.OMproduct)} (=c² ${fmt(g.c*g.c)})`;
      if(m===3&&t===2)return `평행사변형의 넓이 ${fmt(g.parArea,4)} / $\\frac{ab}{2}$=${fmt(g.a*g.b/2,4)}`;
      if(m===3&&t===3)return `현재 P의 l₁=${fmt(g.l1)}, l₂=${fmt(g.l2)} · 곱 ${fmt(g.asymProduct,4)} · ${Math.abs(g.P.y)<.025?'P=꼭짓점':'P≠꼭짓점'}`;
      if(m===3)return `l₁=${fmt(g.l1)}, l₂=${fmt(g.l2)} · 곱 ${fmt(g.asymProduct,4)} / $\\frac{a^2b^2}{c^2}$ = ${fmt(g.a*g.a*g.b*g.b/g.c/g.c,4)}`;
      if(m===4&&t===1)return `F′T:TF=${fmt(g.baseRatio,3)}:1 · PF′:PF=${fmt(g.focalRatio,3)}:1 · d₁d₂=${fmt(g.tanProduct)}`;
      if(m===4&&t===2)return `F′F*=${fmt(dist(g.Fp,g.Fstar))}=2a · OH₁=${fmt(dist(g.O,g.H1))}=a`;
      return `d₁=${fmt(g.d1)}, d₂=${fmt(g.d2)}, d₁d₂=${fmt(g.tanProduct,4)} (=b² ${fmt(g.b*g.b)}) · OH₁=OH₂=a`;
    }
    function snapTarget(){
      const snap=scenarios[state.mode][state.subtype-1].snap,{a,b,kind}=snap,c=Math.hypot(a,b);
      let py=snap.value||0;
      if(kind==='right')py=b*b/c;
      if(kind==='iso')py=b*Math.sqrt(Math.max(0,Math.pow((2*c-a)/c,2)-1));
      if(kind==='pf'){let px=a*(snap.value+a)/c;py=b*Math.sqrt(Math.max(0,(px/a)**2-1));}
      return {a,b,py};
    }

  /* ======================================================================
     [2.0] 셸 연결: 셸 상태 s → 원본 state, 가지별 문제(원본 updateBranchProblem), 풀이, 실시간 값, 그리기, 장면 정의
     ====================================================================== */
  function sync(s, m, sub) {
    state.mode = m;
    state.subtype = sub;
    state.a = s.a;
    state.b = s.b;
    state.py = s.py;
    state.branch = s.branch;
    state.lens = s.lens;
    state.partIdx = s.part == null ? -1 : s.part;
    state.steps = { 1: s.step >= 1, 2: s.step >= 2, 3: s.step >= 3 };
  }

  // 원본 updateBranchProblem: 좌측 가지에서 문장·답이 달라지는 세 문제
  function branchProblem(m, sub, branch) {
    const orig = scenarios[m][sub - 1];
    let question = orig.question, answer = orig.answer;
    if (branch < 0) {
      if (m === 1 && sub === 1) { question = '왼쪽 곡선 위의 점 P에서 PF=11일 때 PF′와 △PF′F의 둘레는? (a=3,b=4)'; answer = 'PF′ = 5, 둘레 = 26'; }
      if (m === 1 && sub === 3) { question = '왼쪽 곡선 위의 점 P에서 PF=F′F=10인 이등변삼각형의 PF′와 둘레를 구하시오.'; answer = 'PF′ = 4, 둘레 = 24'; }
      if (m === 4 && sub === 1) { question = '왼쪽 곡선 위의 점 P에서 PF=12, PF′=6일 때 접선과 x축의 교점 T에 대해 F′T:TF를 구하시오.'; answer = 'F′T:TF = 1:2'; }
    }
    return { question, answer };
  }

  // 원본 renderSolutions: 풀이의 수치는 예제 스냅 조건 기준
  const CAPTION = '<div style="font-size:.9em;opacity:.8;margin-bottom:6px">※ 풀이의 수치는 문제의 조건(그림 맞추기)을 기준으로 합니다. 지금 끌어서 바꾼 값은 따로 표시됩니다.</div>';
  const olist = (items) => '<ol style="padding-left:21px;margin:5px 0;display:grid;gap:9px;line-height:1.75">' + items.map((item) => `<li>${item}</li>`).join('') + '</ol>';
  function solutionOf(m, sub) {
    const get = (s) => { sync(s, m, sub); return dynamicSolution(null) || { formal: ['풀이 연결 오류'], shortcut: ['풀이 연결 오류'], warning: '', insight: '' }; };
    return {
      standardTitle: '교과서식 풀이 (좌표로 계산)', standardTag: '기본 풀이',
      quickTitle: '10초 컷 · 정의와 성질을 이용한 풀이', quickTag: '10초 컷',
      standard: (s) => { const d = get(s); return { steps: CAPTION + (d.formalHtml || olist(d.formal)), warning: d.warning }; },
      quick: (s) => { const d = get(s); return { steps: CAPTION + (d.shortcutHtml || olist(d.shortcut)), highlight: d.insight }; }
    };
  }

  const PART_COLORS = ['sky', 'amber', 'violet'];
  function viewOf(m, sb) {
    return (s) => {
      sync(s, m, sb);
      const g = geometry(state.a, state.b, currentP());
      const { a, b, c, P } = g;
      const stable = (k) => Number(k).toFixed(2).replace(/\.00$/, '');
      const ok = exampleConditions(g);
      const err = measuredErrors(g).maxErr * 100;
      // 원본 geomLive: 장면별 한 줄 실측 설명
      let t = '';
      if (m === 1 && sb === 2) {
        const ang = Math.acos(clamp(dot(sub(g.F, g.P), sub(g.Fp, g.P)) / (g.focalP * g.focalFp), -1, 1)) * 180 / Math.PI;
        t = `지름이 F′F인 원 위의 점 K: 넓이 = b² = ${fmt(b * b)}. 현재 ∠F′PF = ${fmt(ang, 2)}°${Math.abs(ang - 90) < 0.01 ? ' (직각)' : ' (자유 이동 중)'} · 점 K는 항상 따로 표시합니다.`;
      } else if (m === 1) t = `현재 |PF′−PF|=${fmt(g.focusDiff)} / 2a=${fmt(2 * a)} · 삼각형 둘레 ${fmt(g.focalFp + g.focalP + 2 * c)}.`;
      else if (m === 2 && sb === 3) t = `P는 M₁M₂의 중점 · 삼각형의 넓이 ${fmt(g.tanArea)} / ab=${fmt(a * b)} · OM₁·OM₂=${fmt(g.OMproduct)}.`;
      else if (m === 2) t = `OH=${fmt(dist(g.O, g.H))}, FH=${fmt(dist(g.H, g.F))}; 점 P에서 점근선까지의 거리=${fmt(g.l1)} · 두 점근선이 이루는 각=${fmt(g.angle, 2)}°.`;
      else if (m === 3 && sb === 2) t = `평행사변형의 넓이 ${fmt(g.parArea, 4)} / $\\frac{ab}{2}$=${fmt(a * b / 2, 4)}.`;
      else if (m === 3) t = `l₁=${fmt(g.l1)}, l₂=${fmt(g.l2)} · 곱=${fmt(g.asymProduct, 4)}, $\\frac{a^2b^2}{c^2}$=${fmt(a * a * b * b / c / c, 4)}.`;
      else if (m === 4 && sb === 2) t = `F′F*=${fmt(dist(g.Fp, g.Fstar))}, OH₁=${fmt(dist(g.O, g.H1))} · F*는 F의 접선 대칭점.`;
      else if (m === 4 && sb === 1) t = `$\\frac{F′T}{TF}$=${fmt(g.baseRatio, 4)}, $\\frac{PF′}{PF}$=${fmt(g.focalRatio, 4)} · 두 비가 같습니다.`;
      else t = `d₁=${fmt(g.d1)}, d₂=${fmt(g.d2)}, d₁d₂=${fmt(g.tanProduct, 4)} / b²=${fmt(b * b, 4)}.`;
      return {
        chips: [
          { k: '쌍곡선', tex: `\\dfrac{x^2}{${stable(a * a)}} - \\dfrac{y^2}{${stable(b * b)}} = 1`, color: 'amber' },
          { k: '점근선', tex: `y=\\pm\\dfrac{${stable(b)}}{${stable(a)}}x`, color: 'sky' }
        ],
        status: ok ? { tone: 'ok', text: '문제의 조건과 일치' } : { tone: 'warn', text: '문제의 조건과 다름 · 정답은 원래 문제 기준' },
        alert: { tone: 'info', text: t },
        readouts: [
          { label: '초점 c = √(a²+b²) / 점 P', value: `c=${fmt(c)} | (${fmt(P.x)}, ${fmt(P.y)})`, color: 'amber', wide: true },
          { label: "거리의 차 |PF' - PF| = 2a", value: `|${fmt(g.focalFp)} − ${fmt(g.focalP)}| = ${fmt(g.focusDiff)}`, color: 'rose', wide: true },
          { label: '점근선까지의 거리의 곱 l₁×l₂ = $\\frac{a^2b^2}{c^2}$', value: `${fmt(g.l1, 3)}×${fmt(g.l2, 3)} = ${fmt(g.asymProduct, 4)}`, color: 'sky', wide: true },
          { label: '접선까지의 거리의 곱 d₁×d₂ = b²', value: `${fmt(g.d1, 3)}×${fmt(g.d2, 3)} = ${fmt(g.tanProduct, 4)}`, color: 'violet', wide: true },
          { label: '측정 오차(최대)', value: `${err < 0.0005 ? err.toExponential(1) : fmt(err, 4)}%`, color: 'green', wide: true }
        ],
        parts: scenarios[m][sb - 1].parts.map((desc, i) => ({ id: i, name: desc, desc: '', value: null, color: PART_COLORS[i] })),
        summary: explorationLine(g)
      };
    };
  }

  function plotOf(m, g) {
    if (m === 1) plotMode1(g); else if (m === 2) plotMode2(g); else if (m === 3) plotMode3(g); else plotMode4(g);
  }
  function drawOf(m, sub) {
    return (b, s, v) => {
      BOARD = b;
      CUR = s;
      sync(s, m, sub);
      state._labels = [];
      sink.tape = null;
      const g = geometry(state.a, state.b, currentP());
      if (s.grid) b.grid();
      b.axes();
      if (state.lens !== 'all') withAlpha(0.32, () => plotOf(m, g)); else plotOf(m, g);
      drawHyperbolaCurves(g.a, g.b);
      renderLensOverlay(g);
      renderPartFocus(g);
      // 점 P: 선택된 가지 위에서만 움직입니다(원본 handlePointerMove). 가지 전환은 칩으로만.
      b.handle('P', [g.P.x, g.P.y], { color: 'amber', r: 7.5, ariaLabel: '점 P', drag: (w) => { s.py = clamp(w.y, -7.5, 7.5); } });
      state._labels.push({ s: b.toS(g.P.x, g.P.y), text: `P(${fmt(g.P.x)},${fmt(g.P.y)})`, color: palette.gold, offset: { x: 12, y: -18 } });
      drawSmartLabels();
      v.tape = sink.tape;
    };
  }

  /* ---------- 장면 정의 ---------- */
  const GROUPS = [
    { title: "정의(|PF′−PF|=2a) 킬러", short: '정의·거리의 차' },
    { title: '점근선과 초점에서 점근선까지의 거리(=b)', short: '점근선·초점에서의 거리' },
    { title: '두 점근선까지의 거리의 곱', short: '점근선까지 거리의 곱' },
    { title: '접선(각의 이등분선)과 접선까지의 거리의 곱', short: '접선·각의 이등분' }
  ];
  const QUESTION = {
    '1-1': 'P가 쌍곡선 위를 움직이면 두 초점까지의 거리 PF′, PF는 어떻게 변하고, 그 차는 얼마로 유지될까?',
    '1-2': '∠F′KF = 90°가 되는 점 K는 어디에 있고, 삼각형 KF′F의 넓이는 얼마일까?',
    '1-3': 'PF′ = F′F 인 이등변삼각형이 되는 점 P에서 PF와 둘레는 얼마일까?',
    '2-1': '초점 F에서 점근선에 내린 수선의 발 H에 대해 OH와 FH는 각각 얼마일까?',
    '2-2': '두 점근선이 서로 수직이려면 a와 b는 어떤 관계여야 하고, 이때 이심률은 얼마일까?',
    '2-3': 'P에서의 접선이 두 점근선과 만나는 점 M₁, M₂와 원점이 이루는 삼각형의 넓이는 P의 위치와 무관할까?',
    '3-1': 'P에서 두 점근선에 내린 수선의 길이의 곱 l₁l₂ 는 P가 움직여도 변하지 않을까?',

  const LENSES = [['all', '전체'], ['definition', '거리의 차'], ['asymptote', '점근선·직각'], ['tangent', '접선·대칭']];

  // 원본 fitView 의 뜻: 초점과 점 P, 꼭짓점이 모두 보이도록 장면을 열 때 보기 창을 맞춥니다.

      presets: () => [
        { group: '점 P가 놓이는 곡선', label: '오른쪽 곡선 (x > 0)', apply: (st, lab) => { if (st.branch !== 1) { st.branch = 1; if (lab._buildPanel) lab._buildPanel(); } }, on: (st) => st.branch === 1 },

  }

  const groups = [1, 2, 3, 4].map((m) => ({

  /* [기출 핵심 유형 장면 시작] 평가원·교육청 기출의 핵심 유형을 숫자·상황을 바꾼 변형으로 추가한 장면(장면 5~). 기존 장면 1~4는 건드리지 않았습니다. */
  const KICE = (function () {
  /* ---------- 공통 도우미 ---------- */
  const tex = APLab.tex, clamp = APLab.clamp, esc = APLab.esc;
  const D2R = Math.PI / 180;
  const nf = (v, d = 2) => { const q = Math.pow(10, d); const r = Math.round(v * q) / q; return String(Object.is(r, -0) || r === 0 ? 0 : r).replace('-', '−'); };
  // 분수 표기: 정수이면 그대로, 아니면 \dfrac
  const frTex = (n, d) => { const g = (x, y) => (y ? g(y, x % y) : Math.abs(x)); const k = g(n, d); n /= k; d /= k; if (d < 0) { n = -n; d = -d; } return d === 1 ? String(n) : `\\dfrac{${n}}{${d}}`; };
  const frTxt = (n, d) => { const g = (x, y) => (y ? g(y, x % y) : Math.abs(x)); const k = g(n, d); n /= k; d /= k; return d === 1 ? String(n) : `${n}/${d}`; };
  // 변형 생성기: 처음에는 list[0](기출 유형 그대로), 「새 문제」를 누를 때마다 직전과 다른 것을 무작위로 고릅니다.
  function varier(list, build) {
    let idx = 0, cur = build(list[0], 0);
    return { cur: () => cur, idx: () => idx, count: list.length, set: (i) => { idx = i; cur = build(list[i], i); return cur; }, next: () => { let i; do { i = Math.floor(Math.random() * list.length); } while (list.length > 1 && i === idx); idx = i; cur = build(list[i], i); return cur; } };
  }
  const probHTML = (body) => `${body}<div style="margin-top:10px"><button type="button" class="apl-btn sm" data-cq-new>새 문제 (숫자 바꾸기)</button></div>`;
  document.addEventListener('click', (ev) => {
    const hit = ev.target && ev.target.closest && ev.target.closest('[data-cq-new]');
    if (!hit) return;
    const lab = window.lab, sc = lab && lab.scene;
    if (!sc || !sc.vary) return;
    sc.vary.next();
    lab.__cqKey = '';
    lab.s.revealed = false;
    lab.setStep(1);
    try { lab._buildReview(); } catch (e) { /* 키트가 바뀌어도 그림은 그대로 */ }

  });
  const reviewTopOf = (textFn) => () => `<div class="apl-rich" style="font-size:var(--fs-sm);line-height:1.75"><small style="color:var(--text-3);font-weight:800">문제</small><br>${textFn()}</div>`;

  /* ---------- 그리기 도우미 (세계 좌표) ---------- */
  const T = (b, p, str, color, dx, dy, size, align) => b.text(p, str, { color, size: size || 13, weight: 800, align: align || 'center', baseline: 'middle', dx: dx || 0, dy: dy || 0 });
  const mid = (A, B) => [(A[0] + B[0]) / 2, (A[1] + B[1]) / 2];
  const dist = (A, B) => Math.hypot(A[0] - B[0], A[1] - B[1]);
  // 선분 A–B 의 가운데에서 화면 기준으로 수직 방향(side=±1)으로 off(px) 떨어진 곳에 글자를 씁니다
  function segLabel(b, A, B, str, color, off, side, size, along) {
    const s1 = b.toS(A[0], A[1]), s2 = b.toS(B[0], B[1]);
    const L = Math.hypot(s2.x - s1.x, s2.y - s1.y) || 1;
    const dx = (s2.x - s1.x) / L, dy = (s2.y - s1.y) / L;
    const m = mid(A, B);
    const a = (along || 0);
    b.text(m, str, { color, size: size || 13, weight: 800, align: 'center', baseline: 'middle', dx: -dy * off * (side || 1) + dx * a, dy: dx * off * (side || 1) + dy * a });
  }
  function ellipsePath(cx, cy, ax, by, n = 200) {
    const pts = [];
    for (let i = 0; i <= n; i++) { const t = (i / n) * 2 * Math.PI; pts.push([cx + ax * Math.cos(t), cy + by * Math.sin(t)]); }
    return pts;
  }
  // 쌍곡선 x²/a² − y²/b² = 1 의 한 가지(sgn=+1 오른쪽, −1 왼쪽), 중심 (cx, 0), |y| ≤ ymax
  function hyperPath(cx, a, bb, sgn, ymax, n = 160) {
    const U = Math.asinh(ymax / bb), pts = [];
    for (let i = 0; i <= n; i++) { const u = -U + (2 * U * i) / n; pts.push([cx + sgn * a * Math.cosh(u), bb * Math.sinh(u)]); }
    return pts;
  }
  // 위아래로 열린 쌍곡선 y²/m² − x²/n² = 1 의 한 가지(sgn=+1 위쪽), |x| ≤ xmax
  function hyperPathV(m, n, sgn, xmax, nn = 160) {
    const U = Math.asinh(xmax / n), pts = [];
    for (let i = 0; i <= nn; i++) { const u = -U + (2 * U * i) / nn; pts.push([n * Math.sinh(u), sgn * m * Math.cosh(u)]); }

  }

  // 점: 고정점(name 라벨)
  const dot = (b, p, name, color, dx, dy, o) => b.point(p, { r: 4.6, color, label: name, dx, dy, size: 14, ...(o || {}) });
  // 좌표축: 탐구 탭은 눈금 숫자까지, 문제·풀이 탭은 눈금 숫자 없이 축과 x, y 글자만(숫자가 라벨·점 이름과 겹치지 않게)
  function axes2(b, fit, ticks) {
    if (fit) return;
    if (ticks) { b.axes(); return; }
    b.axes({ ticks: false });
    const o = b.toS(0, 0), r = b._drawRect(b.paneId), ins = b.insets;
    const ox = clamp(o.x, r.x + 14, r.x + r.w - ins.right - 14), oy = clamp(o.y, r.y + ins.top + 14, r.y + r.h - ins.bottom - 14);
    b.stext(r.x + r.w - ins.right - 14, oy - 13, 'x', { color: 'muted', size: 14, weight: 700, align: 'center', baseline: 'middle' });

  // 장면을 열거나 탭·새 문제로 그림이 바뀔 때 한 번, 그린 라벨까지 모두 보이도록 보기 창을 맞춥니다(끌기·확대는 그대로 둡니다).
  function autoView(b, lab, key, fitBody, explicitBox) {
    const k2 = key + '|' + b.W + 'x' + b.H + '|' + Math.round(b.insets.top / 8) + ',' + Math.round(b.insets.right / 8) + ',' + Math.round(b.insets.bottom / 8);
    if (lab.__cqKey === k2) return;

  }
  // 새 장면의 공통 틀
  const baseScene = (o) => ({ tabs: { compact: true }, reviewTab: true, ...o });
  const KP = {}; // 이 장면들이 쓰는 조절 막대
  const KS = {}; // 이 장면들의 초기 상태

  /* ======================================================================
     [기출 핵심 유형 추가 · 2026-11] 장면 5: 포물선과 쌍곡선이 초점 F를 공유 — PF = PH (준선까지) 로 바꾸기
     근거 기출: 2025학년도 9월 모평 29번 · 2027학년도 7월 학평(인천) 29번 · 2027학년도 6월 모평 29번 (복합: 포물선·쌍곡선)

  Object.assign(KP, {

  });

  // 포물선: 초점 F(c,0), 준선 x=0 → y² = 2cx − c². 쌍곡선: 초점 F, F′(−c,0)이고 P를 지남
  function geoH5(c, y) {

    return { c, P, F, Fp, H: [0, y], K: [x, 0], PF: x, PH: x, PFp, a, bh: Math.sqrt(Math.max(c * c - a * a, 1e-6)) };

  const VH5 = [{ c: 3, p: 2, q: 1 }, { c: 5, p: 3, q: 2 }, { c: 8, p: 5, q: 3 }, { c: 6, p: 2, q: 1 }];
  const varH5 = varier(VH5, (o) => {
    const d = (4 * o.c * o.q * o.q) / (o.p * o.p - o.q * o.q), a = ((o.p - o.q) * d) / (2 * o.q), b2 = o.c * o.c - a * a, y = Math.sqrt(2 * o.c * d - o.c * o.c);
    return { ...o, d, a, b2, ans: a * a * b2, g: geoH5(o.c, y), y2: 2 * o.c * d - o.c * o.c, pfp: (o.p * d) / o.q };
  });
  const textH5 = (v = varH5.cur()) => `두 점 ${tex(`F(${v.c},0),\\ F'(-${v.c},0)`)}을 초점으로 하는 쌍곡선 ${tex('\\dfrac{x^2}{a^2}-\\dfrac{y^2}{b^2}=1')}이 있다. 점 ${tex('F')}를 초점으로 하고 ${tex('y')}축을 준선으로 하는 포물선이 이 쌍곡선과 제1사분면에서 만나는 점을 ${tex('P')}, 점 ${tex('P')}에서 ${tex('y')}축에 내린 수선의 발을 ${tex('H')}라 하자. ${tex(`\\overline{PF'}:\\overline{PH}=${v.p}:${v.q}`)}일 때, ${tex('a^2b^2')}의 값을 구하시오. (단, ${tex('a>0,\\ b>0')})`;

  function sceneH5() {
    return baseScene({
      id: 'q5', title: '포물선과 쌍곡선이 초점을 공유할 때 — PH = PF, PF′ − PF = 2a', short: '포물선+쌍곡선',
      question: '포물선의 초점 F가 쌍곡선의 초점이기도 할 때, 점 P에서 준선까지의 거리 PH는 쌍곡선의 어떤 선분으로 바뀔까?',
      guide: '점 <b>P</b>를 포물선 위에서 끌어 보세요. P를 지나는 쌍곡선(초점 F, F′)은 따라서 바뀌지만, <b>PH = PF</b>(포물선)는 늘 성립하고 쌍곡선에서는 <b>PF′ − PF = 2a</b>입니다. 준선까지의 거리 PH를 초점까지의 거리 PF로 바꾸면 쌍곡선의 정의에 바로 쓸 수 있습니다.',

      steps: () => {

  // 변형: 배율 m, QB = L (Q는 제1사분면, 위쪽 가지) ⇒ c = m/2, AB = 3m, 둘레 = 2L + m
  const VH7 = [{ m: 1, L: 6 }, { m: 2, L: 13 }, { m: 3, L: 21 }, { m: 2, L: 11 }];
  const varH7 = varier(VH7, (o) => ({ ...o, c: o.m / 2, AB: 3 * o.m, QA: o.L - 2 * o.m, ans: 2 * o.L + o.m, g: geoH7(GA, o.m, 0, 1) }));
  const textH7 = (v = varH7.cur()) => `좌표평면에서 곡선 ${tex(`|y^2-${v.m * v.m}|=\\dfrac{x^2}{a^2}`)}과 네 점 ${tex(`A(0,\\ c+${v.m}),\\ B(0,\\ -c-${v.m}),\\ C(c,\\ 0),\\ D(-c,\\ 0)`)}이 있다. 곡선 위의 점 중 ${tex('y')}좌표의 절댓값이 ${tex(String(v.m))} 이하인 모든 점 ${tex('P')}에 대하여 ${tex(`\\overline{PC}+\\overline{PD}=${v.m === 1 ? '' : v.m}\\sqrt{5}`)}이다. 곡선 위의 점 ${tex('Q')}가 제1사분면에 있고 ${tex(`\\overline{QB}=${v.L}`)}일 때, 삼각형 ${tex('ABQ')}의 둘레의 길이를 구하시오. (단, ${tex('a')}와 ${tex('c')}는 양수이다.)`;

  function drawH7(b, s0, v, lab) {
    const tab = lab.tab, explore = tab === 'explore', prob = tab === 'problem';
    const st = (i) => (explore ? true : tab === 'review' ? s0.step >= i : false);
    const vr = varH7.cur();
    const m = explore ? 1 : vr.m, a = explore ? s0.q7a : GA;
    const sx = explore ? (s0.q7sx || 1) : 1;
    // 문제·풀이: Q는 위쪽 가지, 보여 줄 점 P는 타원 부분의 한 점
    const g = geoH7(a, m, explore ? s0.q7y : 0, sx);
    const base = geoH7(a, m, 0, 1);
    // 문제 탭의 점들: P(타원 부분), Q(쌍곡선 윗가지, QB = L)
    const Pe = [a * m * Math.sqrt(1 - 0.36), 0.6 * m]; // 타원 부분의 점 (y = 0.6m)
    let Qp = null;
    if (!explore) {
      const ch = base.ch, L = vr.L, QA = L - 2 * m; // 쌍곡선: QB − QA = 2m
      // Q = (x, y): QA² = x² + (y − ch)², QB² = x² + (y + ch)²  ⇒ y = (QB² − QA²)/(4ch)
      const y = (L * L - QA * QA) / (4 * ch), x2 = L * L - (y + ch) * (y + ch);
      Qp = [Math.sqrt(Math.max(0, x2)), y];
    }
    const body = (fit) => {
      if (s0.grid && explore && !fit) b.grid();
      axes2(b, fit, explore);
      const ex = ellipsePath(0, 0, a * m, m, 200);
      const hy = (sgn) => hyperPathV(m, a * m, sgn, (explore ? 3 : 2.2) * m * a * 1.0 + 1);
      const colE = !explore && !st(1) ? 'ink' : 'sky', colH = !explore && !st(1) ? 'ink' : 'violet';
      curve(b, ex, explore ? 'sky' : colE);

      dot(b, base.A, prob ? 'A(0, c+' + nf(m, 0) + ')' : 'A', 'violet', -4, -14, { align: 'right' });

      if (explore) {

        else { seg(b, P, g.A, 'violet', 2.6); seg(b, P, g.B, 'violet', 2.6); }
        b.handle('P', P, { color: 'amber', r: 7.5, label: 'P', dx: 12, dy: -12, size: 14, ariaLabel: '점 P (곡선 위에서 끌어 보세요)', drag: (w) => { lab.s.q7y = clamp(w.y, -3, 3); if (Math.abs(w.x) > 0.05) lab.s.q7sx = w.x >= 0 ? 1 : -1; } });
      } else {
        // 문제 그림: 타원 부분의 점 P, 쌍곡선 윗가지의 점 Q
        
        dot(b, Pe, 'P', 'amber', 10, -10, { r: 5 });
        seg(b, Qp, base.B, 'rose', 2.6);
        seg(b, Qp, base.A, st(2) ? 'violet' : 'muted', st(2) ? 2.8 : 1.6);
        if (st(3)) seg(b, base.A, base.B, 'green', 3);
        dot(b, Qp, 'Q', 'rose', 10, -10, { r: 5.5 });
        segLabel(b, Qp, base.B, `QB = ${nf(vr.L, 0)}`, 'rose', 14, -1, 13, -46);
        if (st(2)) segLabel(b, Qp, base.A, `QA = ${nf(vr.QA, 0)}`, 'violet', 16, 1);
        if (st(3)) T(b, [0, base.ch * 0.6], `AB = ${nf(vr.AB, 0)}`, 'green', -8, 0, 13, 'right');
        if (tab === 'review' && s0.step === 1) {
          T(b, [-a * m * 1.0, m * 0.15], '타원 부분', 'sky', -8, 0, 12, 'right');
          T(b, [-a * m * 0.9, base.ch * 1.35], '쌍곡선 부분', 'violet', 0, 0, 12, 'right');
        }
      }
    };
    autoView(b, lab, `${explore ? 'x' : 'v' + varH7.idx()}|${tab}`, () => body(true), explore ? { x: [-3.5, 3.5], y: [-2.7, 2.7] } : null);
    body(false);
  }

  const OVH = (() => {

    const eq = (a, b) => `\\dfrac{x^2}{${a * a}}-\\dfrac{y^2}{${b * b}}=1`;
    const cOf = (a, b) => Math.round(Math.sqrt(a * a + b * b));
    const B = {};
    const FFt = (c) => `F(${c},\\ 0),\\ F'(-${c},\\ 0)`;
    B['1-1'] = ([a, b, d]) => { const c = cOf(a, b), pf = d - 2 * a, per = d + pf + 2 * c; return {
      a, b, c, d, pf, per, chk: { pf, per },
      text: `쌍곡선 ${tex(eq(a, b))}의 두 초점을 ${tex(FFt(c))}이라 하자. 제1사분면에 있는 쌍곡선 위의 점 ${tex('P')}에 대하여 ${tex(`\\overline{PF'}=${d}`)}일 때, 선분 ${tex('\\overline{PF}')}의 길이와 삼각형 ${tex("PF'F")}의 둘레의 길이를 구하시오.`,
      ans: `\\overline{PF}=${pf},\\ \\text{둘레 }${per}`,
      steps: [`두 초점 $F$, $F^{\\prime}$과 쌍곡선 위의 점 $P$, 선분 $PF^{\\prime}$, $PF$를 그립니다.`, `쌍곡선의 정의 $|PF^{\\prime}-PF|=2a=${2 * a}$이고 $P$가 오른쪽 가지 위에 있으므로 $PF=${d}-${2 * a}=${pf}$.`, `$c=\\sqrt{${a * a}+${b * b}}=${c}$이므로 $FF^{\\prime}=2c=${2 * c}$. 둘레는 $${d}+${pf}+${2 * c}=${per}$.`],
      quick: `$PF^{\\prime}-PF=2a=${2 * a}$ ⇒ $PF=${pf}$. 둘레 $=PF^{\\prime}+PF+2c=${d}+${pf}+${2 * c}=${per}$.` }; };
    B['1-2'] = ([a, b]) => { const c = cOf(a, b); return {
      a, b, c, chk: { S: b * b },
      text: `쌍곡선 ${tex(eq(a, b))}의 두 초점을 ${tex(FFt(c))}이라 하자. 쌍곡선 위의 점 ${tex('K')}에서 ${tex("\\angle F'KF=90^\\circ")}일 때, 삼각형 ${tex("KF'F")}의 넓이를 구하시오.`,
      ans: `${b * b}`,
      steps: [`두 초점 $F$, $F^{\\prime}$과 점 $K$를 잡고 $\\angle F^{\\prime}KF=90^\\circ$가 되는 삼각형 $KF^{\\prime}F$를 그립니다. ($K$는 $F^{\\prime}F$를 지름으로 하는 원 위의 점)`, `$KF^{\\prime}^2+KF^2=(2c)^2=${4 * c * c}$, $(KF^{\\prime}-KF)^2=(2a)^2=${4 * a * a}$.`, `$2\\,KF^{\\prime}\\cdot KF=${4 * c * c}-${4 * a * a}=${4 * b * b}$이므로 $KF^{\\prime}\\cdot KF=${2 * b * b}$, 넓이 $S=\\dfrac12KF^{\\prime}\\cdot KF=${b * b}\\ (=b^2)$.`],
      quick: `쌍곡선에서 $\\angle F^{\\prime}KF=90^\\circ$이면 삼각형의 넓이는 $b^2=${b * b}$입니다.` }; };
    B['1-3'] = ([a, b]) => { const c = cOf(a, b), pf = 2 * c - 2 * a, per = 4 * c + pf; return {
      a, b, c, pf, per, chk: { pf, per },
      text: `${tex(`a=${a},\\ b=${b}`)}인 쌍곡선 ${tex(eq(a, b))}의 두 초점을 ${tex(FFt(c))}이라 하자. 오른쪽 가지 위의 점 ${tex('P')}에 대하여 ${tex(`\\overline{PF'}=\\overline{F'F}=2c=${2 * c}`)}이면 ${tex('\\overline{PF}')}의 길이와 삼각형 ${tex("PF'F")}의 둘레를 구하시오.`,
      ans: `\\overline{PF}=${pf},\\ \\text{둘레 }${per}`,

      quick: `$PF=PF^{\\prime}-2a=${2 * c}-${2 * a}=${pf}$. 세 변은 $${2 * c},${2 * c},${pf}$ ⇒ 둘레 $${per}$.` }; };

      steps: [`점근선 $y=\\pm x$와 쌍곡선 $x^2-y^2=${a * a}$를 그립니다.`, `두 점근선의 방향벡터 $(1,1)$, $(1,-1)$의 내적은 $0$이므로 서로 수직입니다 ($a=b$이면 항상 $90^\\circ$).`, `$c=\\sqrt{a^2+b^2}=\\sqrt{${a * a}+${a * a}}=${a}\\sqrt2$이므로 $F(${a}\\sqrt2,\\ 0)$, 이심률 $e=\\sqrt2$.`],
      quick: `$a=b$이면 점근선 $y=\\pm x$가 수직이고 $c=a\\sqrt2=${a}\\sqrt2$, 이심률 $\\sqrt2$.` }; };
    B['2-3'] = ([a, b]) => { const c = cOf(a, b); return {
      a, b, c, chk: { S: a * b, p: c * c },

      if (st(3)) T(b, [0, -v.b * 1.7], `F'T : TF = PF' : PF = ${v.r1} : ${v.r2}`, 'amber', 0, 0, 13);
      D(b, Fo, 'F', 'rose', O); D(b, Fp, "F'", 'rose', O); D(b, P, 'P', 'amber', O, { r: 5.2 }); if (st(1)) D(b, T0, 'T', 'green', [T0[0], 1], { r: 4.4 });
    };
    F['4-2'] = (b, st, v) => {
      const { a, b: bb, c } = v, Fo = [c, 0], Fp = [-c, 0], P = Pu(v, 0.8), n = [P[0] / (a * a), -P[1] / (bb * bb)], Hh = footOn(n, Fo), Fs = [2 * Hh[0] - Fo[0], 2 * Hh[1] - Fo[1]]; H(b, v, false);
      { const dir = [-n[1], n[0]], L = Math.hypot(...dir), u = [dir[0] / L, dir[1] / L]; seg(b, [P[0] - u[0] * 4, P[1] - u[1] * 4], [P[0] + u[0] * 4, P[1] + u[1] * 4], 'violet', 2.4); }
      seg(b, Fo, Hh, 'sky', 2.4); rt(b, Hh, Fo, P, 'amber', 10);
      if (st(1)) seg(b, Fo, Fs, 'sky', 1.8, [5, 5]);
      if (st(2)) { seg(b, Fp, Fs, 'rose', 3); seg(b, O, Hh, 'green', 3); }
      if (st(3)) T(b, [0, -bb * 1.8], `F'F* = 2a = ${2 * a},  OH₁ = a = ${a}`, 'amber', 0, 0, 13);
      D(b, Fo, 'F', 'rose', O); D(b, Fp, "F'", 'rose', O); D(b, P, 'P', 'amber', O, { r: 5.2 }); D(b, Hh, 'H₁', 'sky', Fo, { r: 4 }); if (st(1)) D(b, Fs, 'F*', 'sky', Fo, { r: 4 });
    };
    F['4-3'] = (b, st, v) => {
      const { a, b: bb, c } = v, Fo = [c, 0], Fp = [-c, 0], P = Pu(v, 0.8), n = [P[0] / (a * a), -P[1] / (bb * bb)], H1 = footOn(n, Fo), H2 = footOn(n, Fp); H(b, v, false);
      { const dir = [-n[1], n[0]], L = Math.hypot(...dir), u = [dir[0] / L, dir[1] / L]; seg(b, [P[0] - u[0] * 5, P[1] - u[1] * 5], [P[0] + u[0] * 5, P[1] + u[1] * 5], 'violet', 2.4); }
      if (st(1)) { seg(b, Fo, H1, 'sky', 2.8); seg(b, Fp, H2, 'rose', 2.8); rt(b, H1, Fo, P, 'amber', 9); rt(b, H2, Fp, P, 'amber', 9); segLabel(b, Fo, H1, 'd₁', 'sky', 13, 1, 13); segLabel(b, Fp, H2, 'd₂', 'rose', 13, -1, 13); D(b, H1, 'H₁', 'sky', Fo, { r: 3.6 }); D(b, H2, 'H₂', 'rose', Fp, { r: 3.6 }); }
      if (st(3)) T(b, [0, -bb * 1.8], `d₁ × d₂ = b² = ${bb * bb}`, 'amber', 0, 0, 14);
      D(b, Fo, 'F', 'rose', O); D(b, Fp, "F'", 'rose', O); D(b, P, 'P', 'amber', O, { r: 5.2 });
    };
    return F;
  })();

  function oldHyperUpgrade(sc, key, m, sub) {
    const info = scenarios[m][sub - 1], list = OVH.POOL[key].map(OVH.B[key]);
    const vr = varier(list, (x) => x);
    const away = () => !!(window.lab && window.lab.tab && window.lab.tab !== 'explore');
    const oSteps = sc.steps, oDraw = sc.draw, oView = sc.view, oSol = sc.solution, oProb = sc.problem;
    const cur = () => vr.cur(), isOld = () => vr.idx() === 0;
    const q0 = () => branchProblem(m, sub, 1);
    sc.vary = vr;
    sc.steps = (s) => (away() && !isOld() ? cur().steps : oSteps);
    sc.reviewTop = () => `<div class="apl-rich" style="font-size:var(--fs-sm);line-height:1.75"><small style="color:var(--text-3);font-weight:800">문제</small><br>${isOld() ? esc(q0().question) : cur().text}</div>`;
    sc.problem = { tag: oProb.tag, time: oProb.time, text: () => probHTML(isOld() ? esc(q0().question) : cur().text), answer: () => (isOld() ? esc(q0().answer) : tex(cur().ans)) };
    sc.solution = {
      ...oSol,
      standard: (s) => (isOld() ? oSol.standard(s) : { steps: cur().steps.map((t, i) => `${['①', '②', '③', '④'][i]} ${t}`).join('<br>'), warning: '정의와 도형의 성질로 먼저 선분의 관계를 정리한 뒤 값을 계산하세요.' }),
      quick: (s) => (isOld() ? oSol.quick(s) : { steps: cur().quick, highlight: '핵심 성질을 쓰면 좌표 계산 없이 한두 줄로 끝납니다.' })
    };
    sc.view = (s, lab) => (lab && lab.tab !== 'explore' ? { chips: [] } : oView(s, lab));
    sc.draw = (b, s, v, lab) => {
      const tab = lab ? lab.tab : 'explore';
      if (tab === 'explore') {
        if (lab && lab.__ovk && lab.__ovk !== 'e') { b.setFocus(typeof sc.focus === 'function' ? sc.focus(s) : sc.focus, true); lab.__cqKey = ''; }
        if (lab) lab.__ovk = 'e';
        return oDraw(b, s, v, lab);
      }
      lab.__ovk = 'n';
      v.tape = null; v.card = null;
      const I = cur(), prob = tab === 'problem', stFull = () => true, stNow = prob ? () => false : (i) => s.step >= i;
      const body = (fit, st) => { axes2(b, fit, false); OVH_FIG[key](b, st, I); };
      autoView(b, lab, `${key}|v${vr.idx()}|${tab}`, () => body(true, stFull));
      body(false, stNow);
    };
    return sc;
  }
  groups.forEach((g, gi) => g.scenes.forEach((sc, si) => oldHyperUpgrade(sc, `${gi + 1}-${si + 1}`, gi + 1, si + 1)));

  const KICE_GROUPS = [
    { id: 'q5', title: '[기출 핵심] 포물선과 쌍곡선이 초점을 공유 — PH = PF, PF′ − PF = 2a', short: '포물선+쌍곡선', scenes: [sceneH5()] },
    { id: 'q6', title: '[기출 핵심] 쌍곡선 위의 점 — PQ = PF 로 차를 합으로, 닮음', short: '차를 합으로', scenes: [sceneH6()] },
    { id: 'q7', title: '[기출 핵심] 타원과 쌍곡선이 합쳐진 곡선 |y²−1| = $\\frac{x^2}{a^2}$', short: '합쳐진 곡선', scenes: [sceneH7()] }
  ];

  return { groups: KICE_GROUPS, params: KP, state: KS };

    title: '쌍곡선 실전 킬러 랩',
