/* ==========================================================================
   기하 · 쌍곡선 실전 킬러 랩 (AP Math Lab 2.0 이식본) — 4개 탐구관 × 3개 시나리오 = 12장면
   원본: labs/기하와벡터/쌍곡선.html
   이식 방식: 원본의 기하 계산(geometry), 12개 시나리오(scenarios)·정석/빠른 풀이 데이터(examData·solutionBank·dynamicSolution),
   모드별 그리기 코드(plotMode1~4)를 글자 그대로 옮기고, 분필 그리기 함수(drawChalkLine·point·midLabel·drawRightAngleMark…)의
   이름만 아래 어댑터가 새 무대(APLab.Board)에 연결합니다. 이름표는 원본의 '겹침 피하기 배치'를 그대로 따릅니다.
   - 바뀐 점: 셸·레이아웃은 공용 키트가 담당, 무대는 1:1 축척, 점 P는 직접 끄는 손잡이, 하단 비율 줄자는 셸의 요약 띠로,
     가지 전환(우측/좌측)·관찰 렌즈는 조작 패널의 칩으로 이동. 단계는 정리 탭의 단계 플레이어(1단계는 처음부터 켜짐).
   - 원본의 쓰이지 않던 그리기 함수(drawOFHBox·drawRotatedCoordinates·drawOPDiameterCircle·drawVertexComparison·drawReflectionCircle)는 옮기지 않았습니다.
   ========================================================================== */
window.addEventListener('DOMContentLoaded', function () {
  const tex = APLab.tex;


  /* ===== 원본 그대로: 목표 PF 길이로부터 y1 역산 (원본 637–643행) ===== */
    // 주어진 a, b와 목표 PF 길이로부터 y1 역산 (우측 가지: PF = e*x1 - a => x1 = (PF + a)*a / c)
    function calcPyFromPF(a, b, targetPF) {
      const c = Math.hypot(a, b);
      const x1 = ((targetPF + a) * a) / c;
      const ratio = Math.max(0, (x1 * x1) / (a * a) - 1);
      return b * Math.sqrt(ratio);
    }

  /* ===== 원본 그대로: 4대 실전 기출 문제 & 3분 정석 vs 10초 컷 풀이 데이터 (원본 648–786행) ===== */
    const examData = {
      1: {
        badge: "MODE 1 · 쌍곡선의 정의와 거리 차(|PF' - PF| = 2a) 킬러",
        hint: "점 P를 드래그해도 두 초점 거리의 차 <span class='text-pink-300 font-bold'>|PF' - PF| = 2a = 6</span>이 절대 변하지 않음을 확인하세요! <span class='text-amber-300 font-bold'>[문제 조건 스냅]</span> 시 PF'=11, PF=5 지점으로 이동합니다.",
        tag: "평가원 3점·4점 필수 정의 유형",
        targetTime: "목표 시간: 5초",
        question: () => `쌍곡선 ${tex('\\dfrac{x^2}{9} - \\dfrac{y^2}{16} = 1')} 의 두 초점을 ${tex("F(c, 0), \\; F'(-c, 0)")} ${tex('(c > 0)')}이라 하자. 제1사분면에 있는 쌍곡선 위의 점 ${tex('P')}에 대하여 ${tex("\\overline{PF'} = 11")} 일 때, 선분 ${tex('\\overline{PF}')}의 길이와 삼각형 ${tex("PF'F")}의 둘레의 길이를 구하시오.`,
        answerBadge: () => `${tex('\\overline{PF} = 5')}, 둘레 ${tex('= 26')}`,
        // a=3, b=4 => c=5. PF'=11 => PF = 11 - 2a = 5.
        snap: {
          a: 3.0,
          b: 4.0,
          py: calcPyFromPF(3.0, 4.0, 5.0) // x1 = (5+3)*3/5 = 4.8, y1 = 4*sqrt((4.8/3)^2 - 1) = 4*sqrt(1.56) ≈ 4.996
        },
        steps: [
          "두 초점 F(5, 0), F'(-5, 0) 및 선분 PF', PF 연결",
          "2a × 2b (6 × 8) 직사각형 가이드 & 점근선 X자 표시",
          "|PF' - PF| = 2a (11 - 5 = 6) 불변 바 & 둘레 = 26"
        ],
        textbook: () => ({
          steps: `① ${tex('a^2 = 9, \\; b^2 = 16 \\implies c = \\sqrt{9 + 16} = 5')} 이므로 ${tex("F(5, 0), \\; F'(-5, 0)")}<br/>
② 점 ${tex('P(x_1, y_1)')}에서 ${tex("\\overline{PF'} = \\sqrt{(x_1 + 5)^2 + y_1^2} = 11")}<br/>
③ 쌍곡선 식 ${tex('y_1^2 = 16\\left(\\dfrac{x_1^2}{9} - 1\\right)')} 을 대입하여 정리:<br/>
&nbsp;&nbsp;${tex('(x_1 + 5)^2 + \\dfrac{16}{9}x_1^2 - 16 = 121 \\implies \\dfrac{25}{9}x_1^2 + 10x_1 - 112 = 0')}<br/>
④ 인수분해로 ${tex('x_1 = \\dfrac{24}{5} = 4.8')} 구한 뒤 다시 ${tex('\\overline{PF} = \\sqrt{(x_1 - 5)^2 + y_1^2} = 5')} 계산...`,
          warning: "⚠️ 시험장에서 점 P의 좌표를 구하려고 루트 거리 공식에 대입해 이차방정식을 풀면 3분이 날아갑니다!"
        }),
        shortcut: () => ({
          steps: `① 제1사분면의 점은 오른쪽 가지에 있으므로 가까운 초점은 ${tex('F(5,0)')}, 먼 초점은 ${tex("F'(-5,0)")}입니다. 따라서 정의의 절댓값은 ${tex("PF'-PF")}로 풀립니다.<br/>
② 주축의 길이는 ${tex('2a = 2 \\times 3 = 6')}이므로 ${tex("PF'-PF=2a=6")}입니다.<br/>
③ ${tex("11 - \\overline{PF} = 6 \\implies")} 연립 없이 즉시 <strong class="text-emerald-300">${tex('\\overline{PF} = 5')}</strong>!<br/>
④ ${tex("\\triangle PF'F")} 둘레 ${tex("= \\overline{PF'} + \\overline{PF} + \\overline{F'F} = 11 + 5 + 10 =")} <strong class="text-amber-300">${tex('26')}</strong>!`,
          highlight: "💡 쌍곡선 위의 점 P가 나오면 좌표 구하지 말고 무조건 【 |PF' - PF| = 2a 】 정의부터 쓰세요! 5초 컷!"
        })
      },

      2: {
        badge: "MODE 2 · 기출 1: 초점에서 점근선에 내린 수선의 길이 (= b)",
        hint: "초점 <span class='text-rose-400 font-bold'>F(c, 0)에서 점근선에 내린 수선의 길이는 무조건 b</span>이고, 원점부터 수선의 발 H까지 거리는 <span class='text-amber-300 font-bold'>무조건 a</span>가 됨을 확인하세요!",
        tag: "수능·평가원 4점 최고 빈출 도형 성질",
        targetTime: "목표 시간: 3초",
        question: () => `쌍곡선 ${tex('\\dfrac{x^2}{9} - \\dfrac{y^2}{16} = 1')} 의 양의 초점 ${tex('F(5, 0)')}에서 양의 기울기를 갖는 점근선 ${tex('y = \\dfrac{4}{3}x')} 에 내린 수선의 발을 ${tex('H')}라 하자. 이때 선분 ${tex('\\overline{FH}')}의 길이와 선분 ${tex('\\overline{OH}')}의 길이, 그리고 직각삼각형 ${tex('OFH')}의 넓이를 구하시오.`,
        answerBadge: () => `${tex('\\overline{FH} = b = 4, \\; \\overline{OH} = a = 3')}, 넓이 ${tex('= 6')}`,
        snap: {
          a: 3.0,
          b: 4.0,
          py: 3.2
        },
        steps: [
          "점근선 y = ±(b/a)x 및 2a × 2b 직사각형 대각선 박스",
          "초점 F(c, 0)에서 점근선에 내린 수선의 발 H (직각삼각형 OFH)",
          "OH = a(3), FH = b(4), OF = c(5) & 꼭짓점 원(x²+y²=a²) 위의 점 H"
        ],
        textbook: () => ({
          steps: `① 점근선의 방정식: ${tex('y = \\dfrac{4}{3}x \\iff 4x - 3y = 0')}<br/>
② 초점 ${tex('F(5, 0)')}에서 직선 ${tex('4x - 3y = 0')} 까지 점과 직선 사이의 거리 공식 대입:<br/>
&nbsp;&nbsp;${tex('\\overline{FH} = \\dfrac{|4 \\cdot 5 - 3 \\cdot 0|}{\\sqrt{4^2 + (-3)^2}} = \\dfrac{20}{5} = 4')}<br/>
③ 수직인 직선 ${tex('FH : y = -\\dfrac{3}{4}(x - 5)')} 와 ${tex('y = \\dfrac{4}{3}x')} 를 연립하여<br/>
&nbsp;&nbsp;교점 ${tex('H\\left(\\dfrac{9}{5}, \\dfrac{12}{5}\\right)')} 구한 뒤 ${tex('\\overline{OH} = \\sqrt{(9/5)^2 + (12/5)^2} = 3')} 계산...`,
          warning: "⚠️ 시험장에서 수선의 발 H 좌표를 구하려고 두 직선을 연립하고 있으면 계산 시간이 너무 오래 걸립니다!"
        }),
        shortcut: () => ({
          steps: `① 초점 ${tex('F(c, 0)')}에서 점근선 ${tex('bx - ay = 0')} 까지 거리는 공식에 의해 항상:<br/>
&nbsp;&nbsp;<strong class="text-pink-300">${tex('\\overline{FH} = \\dfrac{bc}{\\sqrt{a^2 + b^2}} = \\dfrac{bc}{c} = b = 4')}</strong>!<br/>
② 피타고라스 정리(${tex('a^2 + b^2 = c^2')})에 의해 원점부터 수선의 발 ${tex('H')}까지 거리는 무조건 <strong class="text-amber-300">${tex('\\overline{OH} = a = 3')}</strong>!<br/>
③ 따라서 ${tex('\\triangle OFH')}는 밑변 ${tex('a=3')}, 높이 ${tex('b=4')}, 빗변 ${tex('c=5')}인 직각삼각형 ⇒ 넓이 <strong class="text-emerald-300">${tex('= \\dfrac{1}{2}ab = 6')}</strong>!`,
          highlight: "💡 『초점 F에서 점근선에 내린 수선의 길이 FH = 무조건 b, 원점~수선의 발 OH = 무조건 a!』 (3초 암기 필수!)"
        })
      },

      3: {
        badge: "MODE 3 · 기출 2: 쌍곡선 위의 점에서 두 점근선에 내린 수선의 곱",
        hint: "쌍곡선 위의 점 P를 어디로 드래그해도 두 점근선에 내린 수선의 길이의 곱 <span class='text-sky-300 font-bold'>l₁ × l₂ = a²b² / c²</span>이 일정함을 확인하세요!",
        tag: "평가원·사관학교 4점 킬러 불변량",
        targetTime: "목표 시간: 5초",
        question: () => `쌍곡선 ${tex('\\dfrac{x^2}{9} - \\dfrac{y^2}{16} = 1')} 위의 임의의 점 ${tex('P')}에서 두 점근선 ${tex('y = \\dfrac{4}{3}x, \\; y = -\\dfrac{4}{3}x')} 에 내린 수선의 발을 각각 ${tex('Q_1, Q_2')}라 하자. 두 수선의 길이의 곱 ${tex('\\overline{PQ_1} \\times \\overline{PQ_2}')}의 값을 구하시오.`,
        answerBadge: () => `${tex('\\dfrac{a^2 b^2}{c^2} = \\dfrac{144}{25} = 5.76')}`,
        snap: {
          a: 3.0,
          b: 4.0,
          py: 3.6
        },
        steps: [
          "두 점근선 bx - ay = 0, bx + ay = 0 표시",
          "점 P에서 두 점근선에 내린 수선의 발 Q₁, Q₂ 및 수선 l₁, l₂",
          "불변 공식 증명: l₁ × l₂ = (a²b²) / c² = 144 / 25 = 5.76 (일정)"
        ],
        textbook: () => ({
          steps: `① 두 점근선 식: ${tex('4x - 3y = 0')}, ${tex('4x + 3y = 0')}<br/>
② 쌍곡선 위의 점 ${tex('P(x_1, y_1)')}에서 각 점근선까지의 거리 ${tex('l_1, l_2')}:<br/>
&nbsp;&nbsp;${tex('l_1 = \\dfrac{|4x_1 - 3y_1|}{\\sqrt{4^2 + (-3)^2}} = \\dfrac{|4x_1 - 3y_1|}{5}')}, &nbsp; ${tex('l_2 = \\dfrac{|4x_1 + 3y_1|}{5}')}<br/>
③ 두 거리의 곱: ${tex('l_1 \\times l_2 = \\dfrac{|16x_1^2 - 9y_1^2|}{25}')}<br/>
④ 쌍곡선 방정식 양변에 ${tex('144')}를 곱하면 ${tex('16x_1^2 - 9y_1^2 = 144')} 이므로 대입하면 ${tex('\\dfrac{144}{25}')}.`,
          warning: "⚠️ 매번 점과 직선 거리 공식을 두 번 쓰고 합차공식으로 통분 전개하면 실전에서는 시간 소모가 큽니다."
        }),
        shortcut: () => ({
          steps: `① 쌍곡선 위의 임의의 점 ${tex('P')}에서 두 점근선에 내린 수선의 길이의 곱은 위치와 무관한 불변량!<br/>
② 공식: <strong class="text-sky-300">${tex('l_1 \\times l_2 = \\dfrac{a^2 b^2}{a^2 + b^2} = \\dfrac{a^2 b^2}{c^2}')}</strong><br/>
③ 가장 쉬운 특수점인 꼭짓점 ${tex('A(3, 0)')}에서 계산해도 동일!<br/>
&nbsp;&nbsp;${tex('a^2 = 9, \\; b^2 = 16, \\; c^2 = 25')} 이므로 즉시 <strong class="text-amber-300">${tex('\\dfrac{9 \\times 16}{25} = \\dfrac{144}{25}')}</strong>!`,
          highlight: "💡 두 점근선에 내린 수선의 곱은 무조건 【 a²b² / c² 】! 공식이 헷갈리면 점 P를 꼭짓점 (a, 0)에 두고 구하면 3초 만에 나옵니다!"
        })
      },

      4: {
        badge: "MODE 4 · 기출 3: 쌍곡선의 접선(내각 이등분) & 초점 수선 곱(b²)",
        hint: "쌍곡선 위의 점 P에서의 <span class='text-sky-300 font-bold'>접선은 ∠F'PF를 정확히 이등분</span>하며, 두 초점에서 접선에 내린 수선의 곱은 <span class='text-purple-300 font-bold'>d₁ × d₂ = b²</span>으로 일정합니다!",
        tag: "수능 기하 4점 접선 & 각의 이등분선 킬러",
        targetTime: "목표 시간: 5초",
        question: () => `쌍곡선 ${tex('\\dfrac{x^2}{9} - \\dfrac{y^2}{16} = 1')} 위의 점 ${tex('P')}에서의 접선 ${tex('l')}이 ${tex('x')}축과 만나는 점을 ${tex('T')}라 하자. ${tex("\\overline{PF'} = 12, \\; \\overline{PF} = 6")} 일 때, ${tex("\\overline{F'T} : \\overline{TF}")}의 비와 두 초점 ${tex("F, F'")}에서 접선 ${tex('l')}에 내린 수선의 길이의 곱 ${tex('d_1 \\times d_2')}를 구하시오.`,
        answerBadge: () => `${tex("\\overline{F'T} : \\overline{TF} = 2 : 1")}, ${tex('d_1 d_2 = b^2 = 16')}`,
        // a=3, b=4 => PF'=12, PF=6 (차=6=2a)
        snap: {
          a: 3.0,
          b: 4.0,
          py: calcPyFromPF(3.0, 4.0, 6.0) // x1 = (6+3)*3/5 = 5.4, y1 = 4*sqrt((5.4/3)^2 - 1) = 4*sqrt(2.24) ≈ 5.9866
        },
        steps: [
          "접점 P에서의 접선 l 및 x절편 T(a²/x₁, 0) 표시",
          "접선 PT가 ∠F'PF의 내각의 이등분선(α = α)임을 증명 (F'T : TF = PF' : PF)",
          "두 초점에서 접선에 내린 수선의 발 H₁, H₂ 및 곱 d₁ × d₂ = b² = 16"
        ],
        textbook: () => ({
          steps: `① ${tex('\\overline{PF} = 6')} 조건으로부터 점 ${tex('P')}의 ${tex('x')}좌표 ${tex('x_1 = \\dfrac{27}{5}')} 계산<br/>
② 접선의 방정식 ${tex('\\dfrac{x_1 x}{9} - \\dfrac{y_1 y}{16} = 1')} 에 ${tex('y = 0')} 대입하여 ${tex('x')}절편 ${tex('T')} 계산:<br/>
&nbsp;&nbsp;${tex('x_T = \\dfrac{9}{x_1} = \\dfrac{9}{27/5} = \\dfrac{5}{3}')}<br/>
③ ${tex("F'(-5, 0), \\; F(5, 0)")} 과의 거리비 계산:<br/>
&nbsp;&nbsp;${tex("\\overline{F'T} = \\dfrac{5}{3} - (-5) = \\dfrac{20}{3}, \\; \\overline{TF} = 5 - \\dfrac{5}{3} = \\dfrac{10}{3} \\implies 2 : 1")}`,
          warning: "⚠️ 타원은 '법선'이 내각을 이등분하지만, 쌍곡선은 '접선'이 내각을 이등분합니다! 좌표를 구해 풀면 시간이 오래 걸립니다."
        }),
        shortcut: () => ({
          steps: `① 쌍곡선의 광학적 반사 성질에 의해 <strong class="text-sky-300">점 P에서의 접선 PT는 항상 ${tex("\\angle F'PF")}의 내각의 이등분선</strong>!<br/>
② 중학 도형 <strong>[내각의 이등분선 정리]</strong>에 의해:<br/>

    const taken = [...blocked, ...state._blocks];
    c.save();
    c.globalAlpha = 1;
    c.setLineDash([]);
    c.shadowBlur = 0;
    c.font = `700 ${12 * B.fs}px ${B.font}`;
    for (const label of state._labels) {
      const { s, text, color, offset } = label, w = c.measureText(text).width + 12, h = 21 * B.fs;
      if (s.x < 0 || s.x > r.width || s.y < 0 || s.y > r.height) continue;
      const cand = [offset, { x: 12, y: 23 }, { x: 12, y: -28 }, { x: -w - 12, y: 22 }, { x: -w - 12, y: -27 }, { x: -w / 2, y: 37 }, { x: -w / 2, y: -40 }, { x: 25, y: -6 }, { x: -w - 25, y: -6 }];
      let best = null, sc = Infinity;
      for (const p of cand) {
        const x = clamp(s.x + p.x, 3, Math.max(3, r.width - w - 3)), y = clamp(s.y + p.y - h + 5, 3, Math.max(3, r.height - h - 3));
        let penalty = (Math.abs(x - (s.x + p.x)) + Math.abs(y - (s.y + p.y))) * 0.45 + Math.hypot(x + w / 2 - s.x, y + h / 2 - s.y) * 0.03;
        for (const q of taken) {
          const ix = Math.max(0, Math.min(x + w, q.x + q.w) - Math.max(x, q.x)), iy = Math.max(0, Math.min(y + h, q.y + q.h) - Math.max(y, q.y));
          penalty += ix * iy * 2.0;
        }
        if (penalty < sc) { sc = penalty; best = { x, y, w, h }; }
      }
      if (!best) continue;
      c.beginPath();
      c.roundRect(best.x, best.y, best.w, best.h, 6);
      c.fillStyle = B.colors.halo;
      c.fill();
      c.strokeStyle = B.color('muted', 0.4);
      c.lineWidth = 0.9;
      c.stroke();
      c.fillStyle = B.color(color);
      c.textBaseline = 'middle';
      c.textAlign = 'left';
      c.fillText(text, best.x + 6, best.y + best.h / 2 + 0.6);
      taken.push(best);
    }
    c.restore();
    state._labels = [];
    state._blocks = [];
  }

  /* ===== 원본 그대로: 보조 함수·기하 커널 (원본 849–891행) ===== */

    const fmt = (n,d=2) => Number.isFinite(n)?n.toFixed(d):'—';
    const dist=(p,q)=>Math.hypot(p.x-q.x,p.y-q.y);
    const dot=(p,q)=>p.x*q.x+p.y*q.y;
    const sub=(p,q)=>({x:p.x-q.x,y:p.y-q.y});
    const add=(p,q)=>({x:p.x+q.x,y:p.y+q.y});
    const mul=(k,p)=>({x:k*p.x,y:k*p.y});
    const det=(p,q)=>p.x*q.y-p.y*q.x;
    const clamp=(v,lo,hi)=>Math.min(hi,Math.max(lo,v));
    function currentP(){return {x:state.branch*state.a*Math.hypot(1,state.py/state.b),y:state.py};}
    function lineFoot(point, A, B, C) { const t=(A*point.x+B*point.y+C)/(A*A+B*B);return {x:point.x-t*A,y:point.y-t*B}; }
    function geometry(a,b,P){
      const c=Math.hypot(a,b), O={x:0,y:0},F={x:c,y:0},Fp={x:-c,y:0};
      const n={x:P.x/(a*a),y:-P.y/(b*b)};
      const L=Math.hypot(n.x,n.y), normal=mul(1/L,n), tangent={x:-normal.y,y:normal.x};
      const T={x:a*a/P.x,y:0};
      const H1=lineFoot(F,n.x,n.y,-1),H2=lineFoot(Fp,n.x,n.y,-1);
      const H=lineFoot(F,b,-a,0), Q1=lineFoot(P,b,-a,0),Q2=lineFoot(P,b,a,0);
      const alpha=(P.x/a+P.y/b)/2, beta=(P.x/a-P.y/b)/2;
      const R1={x:a*alpha,y:b*alpha}, R2={x:a*beta,y:-b*beta};
      const dPlus=P.x/a-P.y/b, dMinus=P.x/a+P.y/b;
      const M1={x:a/dPlus,y:b/dPlus},M2={x:a/dMinus,y:-b/dMinus};
      const Fstar=sub(mul(2,H1),F);
      const K={x:state.branch*a*Math.sqrt(a*a+2*b*b)/c,y:(state.py<0?-1:1)*b*b/c};
      const u={x:a/c,y:b/c},v={x:a/c,y:-b/c};
      const focalP=dist(P,F),focalFp=dist(P,Fp);
      const l1=dist(P,Q1),l2=dist(P,Q2),d1=dist(F,H1),d2=dist(Fp,H2);
      return {a,b,c,O,F,Fp,P,T,H1,H2,H,Q1,Q2,R1,R2,M1,M2,Fstar,K,tangent,normal,u,v,
        focalP,focalFp,l1,l2,d1,d2,
        focusDiff:Math.abs(focalFp-focalP),asymProduct:l1*l2,tanProduct:d1*d2,
        tanArea:Math.abs(det(M1,M2))/2,parArea:Math.abs(det(R1,R2)),
        OMproduct:dist(O,M1)*dist(O,M2),baseRatio:dist(Fp,T)/dist(F,T),focalRatio:focalFp/focalP,
        angle:Math.acos(clamp(Math.abs(a*a-b*b)/(c*c),-1,1))*180/Math.PI};
    }
    // 수치 불변량은 항상 좌표로 계산한 실측치와 독립 이론값을 대조한다.
    function measuredErrors(g){
      let theory=[2*g.a,g.a*g.a*g.b*g.b/(g.c*g.c),g.b*g.b,g.a*g.b,g.a*g.b/2,g.c*g.c];
      let meas=[g.focusDiff,g.asymProduct,g.tanProduct,g.tanArea,g.parArea,g.OMproduct];
      const ratioErr=Math.abs(g.baseRatio-g.focalRatio)/Math.max(1e-12,g.focalRatio);
      const maxErr=Math.max(ratioErr,...meas.map((v,i)=>Math.abs(v-theory[i])/Math.max(1e-12,theory[i])));
      return {maxErr,meas,theory,ratioErr};
    }

  /* ===== 원본 그대로: 점근선·박스, 렌즈 겹침, 접선, 초점 (원본 950–956, 982–996, 999행) ===== */
    function drawAsymptotesAndBox(a,b,box=true,subtle=false){
      const span=25,color=subtle?'rgba(56,189,248,.29)':'rgba(56,189,248,.58)';
      drawChalkLine(-span,-b/a*span,span,b/a*span,color,1.9,true);
      drawChalkLine(-span,b/a*span,span,-b/a*span,color,1.9,true);
      if(box){drawPolygon([{x:-a,y:b},{x:a,y:b},{x:a,y:-b},{x:-a,y:-b}],'rgba(251,191,36,.04)','rgba(251,191,36,.38)',1.4);}
      point({x:a,y:0},palette.blue,`A(${fmt(a,1)},0)`,{x:10,y:-17});point({x:-a,y:0},palette.blue,`A′(-${fmt(a,1)},0)`,{x:-20,y:-17});
    }
    function focus(part){return state.partIdx===part}
    function renderLensOverlay(g){
      if(state.lens==='all')return;
      if(state.lens==='definition'){line(g.P,g.Fp,'rgba(244,114,182,.55)',2.1,true);line(g.P,g.F,'rgba(52,211,153,.55)',2.1,true);}
      if(state.lens==='asymptote'){drawAsymptotesAndBox(g.a,g.b,false,true);line(g.P,g.Q1,palette.pink,1.9,true);line(g.P,g.Q2,palette.teal,1.9,true);}
      if(state.lens==='tangent'){drawTangent(g,'rgba(192,132,252,.6)',2);drawCircle(g.O,g.a,'rgba(251,191,36,.23)');point(g.Fstar,palette.purple,'F*');}
    }
    function drawTangent(g,color=palette.blue,width=2.5){
      const p=g.P,d=g.tangent;
      const targets=[g.H1,g.H2,g.T,g.M1,g.M2];
      const projections=targets.map(x=>dot(sub(x,p),d));
      const lo=Math.min(-14,...projections)-1.5,hi=Math.max(14,...projections)+1.5;
      drawChalkLine(p.x+d.x*lo,p.y+d.y*lo,p.x+d.x*hi,p.y+d.y*hi,color,width,false,focus(0));
    }
    function drawFoci(g){point(g.F,palette.red,`F(${fmt(g.c,1)},0)`,{x:9,y:23});point(g.Fp,palette.red,`F′(-${fmt(g.c,1)},0)`,{x:-15,y:23});}
    function nearFar(g){return state.branch===1?{near:g.F,far:g.Fp}:{near:g.Fp,far:g.F};}

  /* ===== 원본: 정의 차이 그림 (원본 1005–1014행, 호 방향만 수학 각도로) ===== */
    function drawDefinitionDifference(g){
      const {near,far}=nearFar(g),short=dist(g.P,near),long=dist(g.P,far);
      if(long<1e-8)return;
      const D=add(g.P,mul(short/long,sub(far,g.P)));
      // P를 중심으로 짧은 초점거리만큼 그린 원이 먼 초점 선분과 만나는 지점 D
      // [2.0] 화면 각도 대신 수학 각도(y 위쪽)로 호의 방향을 잡음
      const theta=Math.atan2(far.y-g.P.y,far.x-g.P.x);
      drawOpenArc(g.P,short,theta,.9,'rgba(251,191,36,.65)');
      line(g.P,D,'rgba(110,231,183,.68)',3);line(D,far,palette.gold,5,false,true);
      point(D,palette.gold,'D');midLabel(D,far,`남은 거리 = 2a = ${fmt(2*g.a)}`,palette.gold,{x:14,y:-20});
    }

  /* ===== 원본 그대로: 모드별 그리기 plotMode1~4 (원본 1054–1145, 1157–1194행; state.scale → 무대 배율 BOARD.k) ===== */
    function plotMode1(g){
      const s=state.subtype;
      if(state.steps[2])drawAsymptotesAndBox(g.a,g.b,true);
      if(state.steps[1]){
        drawPolygon([g.Fp,g.P,g.F],'rgba(244,114,182,.06)',null);
        glowLine(g.P,g.Fp,palette.pink,0);glowLine(g.P,g.F,palette.teal,0);line(g.Fp,g.F,palette.gold,2);
        midLabel(g.P,g.Fp,`PF′ ${fmt(g.focalFp)}`,palette.pink);
        midLabel(g.P,g.F,`PF ${fmt(g.focalP)}`,palette.teal);drawFoci(g);
      }
      if(s===2){
        if(state.steps[1]||state.steps[2])drawCircle(g.O,g.c,'rgba(251,191,36,.56)');
        if(state.steps[2]){
          drawPolygon([g.Fp,g.K,g.F],'rgba(251,191,36,.12)',palette.gold,2.6);
          rightMark(g.K,sub(g.F,g.K),sub(g.Fp,g.K),palette.pink,14);
          blockSector(g.K,g.F,g.Fp,34); // [표시 보강] K의 직각 표시가 'K (직각 교점)' 이름표에 가려지지 않게 자리 확보
          angValue(g.K,g.F,g.Fp,'90°',palette.pink,30);
          line(g.O,g.K,'rgba(251,191,36,.75)',2.3,true);
          midLabel(g.O,g.K,`OK=c=${fmt(g.c)}`,palette.gold,{x:9,y:-12});
          point(g.K,palette.gold,'K (직각 교점)',{x:12,y:-20});
        }
        if(state.steps[3]){const sk1=dist(g.K,g.Fp),sk2=dist(g.K,g.F),area=Math.abs(det(sub(g.Fp,g.K),sub(g.F,g.K)))/2;
          drawBottomTapeBanner(`직각 교점 K: △KF′F 넓이 = ${fmt(area)} = b²(${fmt(g.b*g.b)}) · 현재 P는 자유 이동`,sk1,sk2,'KF′','KF');}
      }else if(s===3){
        if(state.steps[2]){
          const far=state.branch===1?g.Fp:g.F;
          if(Math.abs(dist(g.P,far)-2*g.c)<.025){
            drawTick(g.P,far,palette.gold,.5);drawTick(g.Fp,g.F,palette.gold,.52);
          } else {
            midLabel(g.P,far,`현재 먼초점 거리 ${fmt(dist(g.P,far))} (이등변 조건 해제)`,palette.gold);
          }
        }
        if(state.steps[3])drawBottomTapeBanner(`실측 둘레 = ${fmt(g.focalFp+g.focalP+2*g.c)} · 스냅에서 24`,g.focalFp,g.focalP,'PF′','PF');
      }else if(state.steps[3]){
        drawDefinitionDifference(g);
        drawBottomTapeBanner(`|PF′−PF| = ${fmt(g.focusDiff)} = 2a(${fmt(2*g.a)}) · 둘레 ${fmt(g.focalFp+g.focalP+2*g.c)}`,g.focalFp,g.focalP,'PF′','PF');
      }
    }
    function plotMode2(g){
      const s=state.subtype;
      if(state.steps[1]||state.steps[2]||state.steps[3])drawAsymptotesAndBox(g.a,g.b,true,!state.steps[1]);
      if(s===3){
        if(state.steps[1]||state.steps[2])drawTangent(g);
        if(state.steps[1]){point(g.M1,palette.blue,'M₁');point(g.M2,palette.pink,'M₂');}
        if(state.steps[2]){
          drawPolygon([g.O,g.M1,g.M2],'rgba(52,211,153,.13)',focus(1)?palette.gold:palette.teal,focus(1)?3.7:2.3);
          glowLine(g.M1,g.P,palette.gold,1);glowLine(g.P,g.M2,palette.gold,1);
          drawTick(g.M1,g.P,palette.gold);drawTick(g.P,g.M2,palette.gold);
          point(g.M1,palette.blue,'M₁');point(g.M2,palette.pink,'M₂');
          midLabel(g.O,g.M1,`OM₁ ${fmt(dist(g.O,g.M1))}`,palette.blue,{x:10,y:-8});
          midLabel(g.O,g.M2,`OM₂ ${fmt(dist(g.O,g.M2))}`,palette.pink,{x:10,y:19});
        }
        if(state.steps[3])drawBottomTapeBanner(`△OM₁M₂ 넓이 ${fmt(g.tanArea)} = ab · OM₁·OM₂ ${fmt(g.OMproduct)} = c²`,dist(g.O,g.M1),dist(g.O,g.M2),'OM₁','OM₂');
      } else {
        if(state.steps[2]){
          drawPolygon([g.O,g.H,g.F],'rgba(56,189,248,.13)',palette.blue,focus(1)?3.8:2.2);
          glowLine(g.O,g.H,palette.gold,1);glowLine(g.H,g.F,palette.pink,1);line(g.O,g.F,palette.teal,2.4);
          rightMark(g.H,sub(g.O,g.H),sub(g.F,g.H),palette.pink,10);point(g.H,palette.blue,'H', {x:-12,y:-19});drawFoci(g);
          midLabel(g.O,g.H,`OH=${fmt(dist(g.O,g.H))}`,palette.gold);
          midLabel(g.H,g.F,`FH=${fmt(dist(g.H,g.F))}`,palette.pink);
        }
        if(state.steps[3]){
          line(g.P,g.Q1,palette.purple,focus(2)?4:2.1,true,focus(2));point(g.Q1,palette.purple,'Q (P의 수선발)',{x:10,y:-14});
          const sz=Math.min(10,Math.max(4,g.l1*BOARD.k*.32));
          rightMark(g.Q1,g.u,sub(g.P,g.Q1),palette.purple,sz);
          drawCircle(g.O,g.a,'rgba(251,191,36,.35)');
          drawCircle(g.O,g.c,'rgba(244,114,182,.32)');
          drawBottomTapeBanner(s===2?`점근선의 각 = ${fmt(g.angle,1)}° · e=${fmt(g.c/g.a,3)} · 직교 조건 a=b`:`OH=${fmt(dist(g.O,g.H))}, FH=${fmt(dist(g.F,g.H))}, P에서 점근선까지 ${fmt(g.l1)}`,dist(g.O,g.H),dist(g.F,g.H),'OH','FH');
        }
        if(s===2&&state.steps[1]){
          if(Math.abs(g.a-g.b)<.012){
            rightMark(g.O,g.u,g.v,palette.gold,13);
            // [표시 보강] a=b: 두 점근선이 직각(90°), 각 점근선은 x축과 45°(같은 색·같은 호)
            angValue(g.O,g.u,g.v,'90°',palette.gold,30);
            markAng(g.O,{x:1,y:0},g.u,palette.teal,'45°',44,1,13);
            markAng(g.O,{x:1,y:0},g.v,palette.teal,'45°',44,1,13);
          } else {
            // [표시 보강] a≠b: 두 점근선 사이 예각을 호와 값으로 표시(아래 띠의 '점근선의 각'이 그림에도 보이게)
            const wv={x:-g.v.x,y:-g.v.y};
            const acuteUV=degAt(g.O,g.u,g.v)<=90;
            markAng(g.O,g.u,acuteUV?g.v:wv,palette.gold,`${fmt(g.angle,1)}°`,34,1,14);
          }
        }
      }
    }
    function plotMode3(g){
      const s=state.subtype;
      if(state.steps[1]||state.steps[2]||state.steps[3])drawAsymptotesAndBox(g.a,g.b,s===3,!state.steps[1]);
      if(s===2){
        if(state.steps[1]){line(g.O,g.R1,palette.blue,2.7);line(g.O,g.R2,palette.pink,2.7);}
        if(state.steps[2]){drawPolygon([g.O,g.R1,g.P,g.R2],'rgba(56,189,248,.12)',focus(1)?palette.gold:palette.blue,focus(1)?4:2.4);
          glowLine(g.R1,g.P,palette.teal,1);glowLine(g.R2,g.P,palette.teal,1);
          point(g.R1,palette.blue,'R₁');point(g.R2,palette.pink,'R₂');
          // [표시 보강] 평행사변형의 평행 표시(OR₁ ∥ R₂P: ›, OR₂ ∥ R₁P: ››)와 마주 보는 각 ∠O = ∠P(같은 색·같은 호·같은 값)
          if(dist(g.O,g.R1)>.3&&dist(g.O,g.R2)>.3){
            parMark(g.O,g.R1,palette.blue,1);parMark(g.R2,g.P,palette.blue,1);
            parMark(g.O,g.R2,palette.pink,2);parMark(g.R1,g.P,palette.pink,2);
            const thv=degAt(g.O,g.R1,g.R2);
            if(thv>6&&thv<174){
              markAng(g.O,g.R1,g.R2,palette.gold,`${fmt(thv,1)}°`,26,1,14);
              markAng(g.P,g.R1,g.R2,palette.gold,`${fmt(thv,1)}°`,26,1,14);
            }

        if(state.steps[3])drawBottomTapeBanner(`OR₁PR₂ 면적 = ${fmt(g.parArea)} = ab/2(${fmt(g.a*g.b/2)})`,dist(g.O,g.R1),dist(g.O,g.R2),'OR₁','OR₂');
      }else{
        if(state.steps[2]){
          glowLine(g.P,g.Q1,palette.pink,1);glowLine(g.P,g.Q2,palette.teal,1);
          const sz1=Math.min(11,Math.max(3,g.l1*BOARD.k*.32));
          const sz2=Math.min(11,Math.max(3,g.l2*BOARD.k*.32));
          rightMark(g.Q1,g.u,sub(g.P,g.Q1),palette.pink,sz1);rightMark(g.Q2,g.v,sub(g.P,g.Q2),palette.teal,sz2);
          point(g.Q1,palette.pink,`Q₁: l₁=${fmt(g.l1)}`,{x:14,y:24});point(g.Q2,palette.teal,`Q₂: l₂=${fmt(g.l2)}`,{x:-14,y:-20});

          if(Math.abs(g.l1-g.l2)<.02*Math.max(g.l1,g.l2,1e-6)){BOARD.ticks([g.P.x,g.P.y],[g.Q1.x,g.Q1.y],{count:1,color:palette.gold});BOARD.ticks([g.P.x,g.P.y],[g.Q2.x,g.Q2.y],{count:1,color:palette.gold});}
        }
        if(s===3&&state.steps[1]){point({x:state.branch*g.a,y:0},palette.gold,state.branch===1?'A 특수점':'A′ 특수점',{x:12,y:-19});}
        if(state.steps[3])drawBottomTapeBanner(`실측 l₁·l₂=${fmt(g.asymProduct,4)} = a²b²/c²(${fmt(g.a*g.a*g.b*g.b/g.c/g.c,4)})`,g.l1,g.l2,'l₁','l₂');
      }
    }
    function plotMode4(g){
      const s=state.subtype;
      if(state.steps[1]||state.steps[2]||state.steps[3]){
        drawTangent(g, palette.blue, state.steps[1]?2.9:1.25);
      }
      if(state.steps[1]){
        glowLine(g.P,g.Fp,palette.pink,0);glowLine(g.P,g.F,palette.teal,0);
        line(g.Fp,g.F,'rgba(251,191,36,.7)',2.2);drawFoci(g);
        if(dist(g.T,g.P)*BOARD.k>11)point(g.T,palette.blue,`T=${fmt(g.T.x)}`,{x:12,y:23});
      }
      if(s===1){

            if(dist(g.P,g.H1)>.3){const eq=fmt(degAt(g.P,g.F,g.H1),1)+'°';

    // [2.0] 원본 arcBetween: 화면 각도 호 → 무대 호(반지름은 화면 32·41px 그대로, 수학 각도 사용)
    function arcBetween(g){
      if(Math.abs(g.P.y)<.11){return;} // 정점 근방 겹침 방지
      const v1=sub(g.F,g.P),v2=sub(g.Fp,g.P);
      const normalize=v=>mul(1/(Math.hypot(v.x,v.y)||1),v);
      const bis=normalize(add(normalize(v1),normalize(v2)));
      const a1=Math.atan2(v1.y,v1.x),a2=Math.atan2(v2.y,v2.x),ab=Math.atan2(bis.y,bis.x);
      // [표시 보강] 접선이 이등분한 두 각 α를 같은 색·같은 반지름·같은 기호(α)로 그려 '같은 각'임을 보이고, 값은 이등분선(접선) 위 각 안쪽에 씁니다.
      //   (이전: 청록/분홍·반지름 32/41px로 서로 달라 보였고, P 이름표 아래에 가려져 보이지 않았음)
      const tpt={x:g.P.x+Math.cos(ab),y:g.P.y+Math.sin(ab)};
      markAng(g.P,g.F,tpt,palette.gold,'α',34,1,14);
      markAng(g.P,tpt,g.Fp,palette.gold,'α',34,1,14);
      angValue(g.P,g.F,g.Fp,`α = ${fmt(degAt(g.P,g.F,g.Fp)/2,1)}°`,palette.gold,78);
    }

    function renderPartFocus(g){
      if(state.partIdx<0)return;
      const i=state.partIdx,m=state.mode,s=state.subtype;
      const pair=(p,q)=>line(p,q,palette.gold,4.2,false,true);
      let pairs=[];
      if(m===1) pairs= i===0?[[g.P,g.F],[g.P,g.Fp]]:i===1?[[g.O,g.F],[g.O,g.Fp]]:[[g.Fp,g.P],[g.P,g.F]];
      if(m===2){
        if(s===3)pairs=i===0?[[g.M1,g.M2]]:i===1?[[g.M1,g.P],[g.P,g.M2]]:[[g.O,g.M1],[g.O,g.M2]];
        else pairs=i===0?[[g.F,g.H]]:i===1?[[g.O,g.H],[g.H,g.F]]:[[g.P,g.Q1]];
      }
      if(m===3){
        if(s===2)pairs=i===0?[[g.O,g.R1],[g.O,g.R2]]:i===1?[[g.R1,g.P],[g.R2,g.P]]:[[g.O,g.R1],[g.R1,g.P],[g.P,g.R2],[g.R2,g.O]];
        else pairs=i===0?[[g.O,g.Q1],[g.O,g.Q2]]:i===1?[[g.P,g.Q1],[g.P,g.Q2]]:[[g.Q1,g.P],[g.P,g.Q2]];
      }
      if(m===4){
        if(s===1)pairs=i===0?[[g.P,g.T]]:i===1?[[g.P,g.F],[g.P,g.Fp]]:[[g.Fp,g.T],[g.T,g.F]];
        else if(s===2)pairs=i===0?[[g.F,g.Fstar]]:i===1?[[g.Fp,g.Fstar],[g.F,g.Fstar]]:[[g.O,g.H1]];
        else pairs=i===0?[[g.P,g.H1],[g.P,g.H2]]:i===1?[[g.F,g.H1],[g.Fp,g.H2]]:[[g.F,g.H1],[g.Fp,g.H2]];
      }
      pairs.forEach(([p,q])=>pair(p,q));
    }

    function dynamicSolution(g){
      const m=state.mode,t=state.subtype,side=state.branch;
      if(t===1 && (m!==1&&m!==2&&m!==3&&m!==4))return null;
      if(m===1&&t===3&&side===-1)return {
        formal:[`좌측 가지에서 먼 초점은 F, 가까운 초점은 F′이다.`,
          `주어진 ${mtex(String.raw`PF=F'F=2c=10`)}과 정의 ${mtex(String.raw`PF-PF'=2a=6`)}에 의해 ${mtex(String.raw`PF'=4`)}.`,
          `삼각형의 둘레는 ${mtex(String.raw`10+10+4=24`)}.`],
        shortcut:[`먼 초점거리 ${mtex(String.raw`2c=10`)}에서 거리 차 ${mtex(String.raw`2a=6`)}을 뺀다.`,
          `가까운 초점거리 ${mtex(String.raw`PF'=4`)}, 둘레 ${mtex(String.raw`24`)}.`],
        warning:'좌측 가지에서는 PF=F′F가 이등변 조건입니다. 양쪽 가지 모두 참인 눈금만 표시됩니다.',
        insight:'가까운 초점을 먼저 판별한 뒤 2c−2a를 계산하면 됩니다.'};
      if(t===1 && (m===1||m===4) && side===-1){
        if(m===1)return {
          formal:[`좌측 가지의 P는 ${mtex(String.raw`PF-PF'=2a=6`)}을 만족한다.`,
                  `${mtex(String.raw`PF=11`)}을 주었으므로 ${mtex(String.raw`PF'=11-6=5`)}.`,
                  `${mtex(String.raw`F'F=2c=10`)}이므로 둘레는 ${mtex(String.raw`11+5+10=26`)}.`],
          shortcut:[`좌측 가지에서는 가까운 초점이 F′이다. 먼 초점거리에서 ${mtex(String.raw`2a=6`)}만 뺀다.`,
                    `${mtex(String.raw`PF'=11-6=5`)}이고 둘레는 ${mtex(String.raw`26`)}.`],
          warning:'우측 가지와 달리 먼 초점은 F, 가까운 초점은 F′입니다.',insight:'두 가지 모두 먼초점거리−가까운초점거리=2a.'};
        return {
          formal:[`좌측 가지에서 ${mtex(String.raw`PF=12,\;PF'=6`)}이다.`,
                  `접선과 x축 교점 ${mtex(String.raw`T=(a^2/x_1,0)`)}은 F′F 안에 놓인다.`,
                  `접선의 내각이등분선 정리에 의해 ${mtex(String.raw`F'T/TF=PF'/PF=6/12=1/2`)}.`,
                  `두 초점의 접선까지 거리 곱은 ${mtex(String.raw`d_1d_2=b^2=16`)}.`],
          shortcut:[`T에서 두 초점까지의 거리는 각각 P에서 F′, F까지 거리와 같은 비율이다.`,
                    `좌측 가지에서는 ${mtex(String.raw`F'T:TF=PF':PF=6:12=1:2`)}.`,
                    `수선의 길이곱 ${mtex(String.raw`b^2=16`)}도 함께 확인한다.`],
          warning:'가지가 바뀌면 2:1이 아니라 1:2입니다. 동일한 내각이등분선 정리로 판정하세요.',insight:'접선이 초점삼각형의 내각을 이등분하며 가지에 따라 두 거리비 순서가 바뀝니다.'};
      }
      if(t===1){
        const old=examData[m],f=old.textbook(),q=old.shortcut();
        return {formalHtml:f.steps,shortcutHtml:q.steps,warning:f.warning,insight:q.highlight};
      }
      return solutionBank[`${m}-${t}`];
    }

  /* ===== 원본 그대로: 예제 조건 판정과 탐구 한 줄 (원본 1478–1502행), 스냅 목표 (원본 1533–1540행) ===== */
    function exampleConditions(g){
      const {a,b}=snapTarget(),m=state.mode,t=state.subtype,nearfar=nearFar(g);
      const ab=Math.abs(g.a-a)<.016&&Math.abs(g.b-b)<.016;
      if(!ab)return false;
      if(m===1&&t===1)return Math.abs(dist(g.P,nearfar.far)-11)<.035;
      if(m===1&&t===3)return Math.abs(dist(g.P,nearfar.far)-2*g.c)<.035;
      if(m===3&&t===3)return Math.abs(g.P.y)<.025;
      if(m===4&&t===1)return Math.abs(dist(g.P,nearfar.near)-6)<.035;
      return true;
    }
    function explorationLine(g){
      const m=state.mode,t=state.subtype,nf=nearFar(g),near=dist(g.P,nf.near),far=dist(g.P,nf.far);
      if(m===1&&t===1)return `먼초점 ${fmt(far)} − 가까운초점 ${fmt(near)} = 2a ${fmt(2*g.a)} · 둘레 ${fmt(far+near+2*g.c)}`;
      if(m===1&&t===2)return `직각 교점 K의 넓이 = b² ${fmt(g.b*g.b)} · 자유점 P의 초점각은 ${fmt(Math.acos(clamp(dot(sub(g.F,g.P),sub(g.Fp,g.P))/(g.focalP*g.focalFp),-1,1))*180/Math.PI,1)}°`;
      if(m===1)return `먼초점거리 ${fmt(far)} / 초점 사이 2c ${fmt(2*g.c)} · 둘레 ${fmt(g.focalP+g.focalFp+2*g.c)}`;
      if(m===2&&t===1)return `OH=${fmt(dist(g.O,g.H))}, FH=${fmt(dist(g.F,g.H))}, OF=${fmt(g.c)}`;
      if(m===2&&t===2)return `점근선 예각 ${fmt(g.angle,2)}° · 이심률 e=${fmt(g.c/g.a,4)} · ${Math.abs(g.a-g.b)<.012?'직교 성립':'직교 조건 해제'}`;
      if(m===2)return `△OM₁M₂ 넓이 ${fmt(g.tanArea)} (=ab ${fmt(g.a*g.b)}) · 거리곱 ${fmt(g.OMproduct)} (=c² ${fmt(g.c*g.c)})`;
      if(m===3&&t===2)return `평행사변형 실제 넓이 ${fmt(g.parArea,4)} / 이론 ab/2=${fmt(g.a*g.b/2,4)}`;
      if(m===3&&t===3)return `현재 P의 l₁=${fmt(g.l1)}, l₂=${fmt(g.l2)} · 곱 ${fmt(g.asymProduct,4)} · ${Math.abs(g.P.y)<.025?'P=꼭짓점':'P≠꼭짓점'}`;
      if(m===3)return `l₁=${fmt(g.l1)}, l₂=${fmt(g.l2)} · 곱 ${fmt(g.asymProduct,4)} / 이론 ${fmt(g.a*g.a*g.b*g.b/g.c/g.c,4)}`;
      if(m===4&&t===1)return `F′T:TF=${fmt(g.baseRatio,3)}:1 · PF′:PF=${fmt(g.focalRatio,3)}:1 · d₁d₂=${fmt(g.tanProduct)}`;
      if(m===4&&t===2)return `F′F*=${fmt(dist(g.Fp,g.Fstar))}=2a · OH₁=${fmt(dist(g.O,g.H1))}=a`;
      return `d₁=${fmt(g.d1)}, d₂=${fmt(g.d2)}, d₁d₂=${fmt(g.tanProduct,4)} (=b² ${fmt(g.b*g.b)}) · OH₁=OH₂=a`;
    }
    function snapTarget(){
      const snap=scenarios[state.mode][state.subtype-1].snap,{a,b,kind}=snap,c=Math.hypot(a,b);
      let py=snap.value||0;
      if(kind==='right')py=b*b/c;
      if(kind==='iso')py=b*Math.sqrt(Math.max(0,Math.pow((2*c-a)/c,2)-1));
      if(kind==='pf'){let px=a*(snap.value+a)/c;py=b*Math.sqrt(Math.max(0,(px/a)**2-1));}
      return {a,b,py};
    }

  /* ======================================================================
     [2.0] 셸 연결: 셸 상태 s → 원본 state, 가지별 문제(원본 updateBranchProblem), 풀이, 실시간 값, 그리기, 장면 정의
     ====================================================================== */
  function sync(s, m, sub) {
    state.mode = m;
    state.subtype = sub;
    state.a = s.a;
    state.b = s.b;
    state.py = s.py;
    state.branch = s.branch;
    state.lens = s.lens;
    state.partIdx = s.part == null ? -1 : s.part;
    state.steps = { 1: s.step >= 1, 2: s.step >= 2, 3: s.step >= 3 };
  }

  // 원본 updateBranchProblem: 좌측 가지에서 문장·답이 달라지는 세 문제
  function branchProblem(m, sub, branch) {
    const orig = scenarios[m][sub - 1];
    let question = orig.question, answer = orig.answer;
    if (branch < 0) {
      if (m === 1 && sub === 1) { question = '좌측 가지에서 PF=11일 때 PF′와 △PF′F의 둘레는? (a=3,b=4)'; answer = 'PF′ = 5, 둘레 = 26'; }
      if (m === 1 && sub === 3) { question = '좌측 가지에서 PF=F′F=10인 이등변삼각형의 PF′와 둘레를 구하시오.'; answer = 'PF′ = 4, 둘레 = 24'; }
      if (m === 4 && sub === 1) { question = '좌측 가지에서 PF=12, PF′=6인 P에서 접선과 x축의 교점 T에 대해 F′T:TF를 구하시오.'; answer = 'F′T:TF = 1:2'; }
    }
    return { question, answer };
  }

  // 원본 renderSolutions: 풀이의 수치는 예제 스냅 조건 기준
  const CAPTION = '<div style="font-size:.9em;opacity:.8;margin-bottom:6px">※ 풀이의 수치는 예제 스냅 조건을 기준으로 합니다. 현재 드래그 실측은 별도 표시됩니다.</div>';
  const olist = (items) => '<ol style="padding-left:21px;margin:5px 0;display:grid;gap:9px;line-height:1.75">' + items.map((item) => `<li>${item}</li>`).join('') + '</ol>';
  function solutionOf(m, sub) {
    const get = (s) => { sync(s, m, sub); return dynamicSolution(null) || { formal: ['풀이 연결 오류'], shortcut: ['풀이 연결 오류'], warning: '', insight: '' }; };
    return {
      standardTitle: '교과서식 정석 풀이 (대수적 연립 전개)', standardTag: '3분 소요',
      quickTitle: '10초 컷 실전 기하 비기', quickTag: '10초 컷',
      standard: (s) => { const d = get(s); return { steps: CAPTION + (d.formalHtml || olist(d.formal)), warning: d.warning }; },
      quick: (s) => { const d = get(s); return { steps: CAPTION + (d.shortcutHtml || olist(d.shortcut)), highlight: d.insight }; }
    };
  }

  const PART_COLORS = ['sky', 'amber', 'violet'];
  function viewOf(m, sb) {
    return (s) => {
      sync(s, m, sb);
      const g = geometry(state.a, state.b, currentP());
      const { a, b, c, P } = g;
      const stable = (k) => Number(k).toFixed(2).replace(/\.00$/, '');
      const ok = exampleConditions(g);
      const err = measuredErrors(g).maxErr * 100;
      // 원본 geomLive: 장면별 한 줄 실측 설명
      let t = '';
      if (m === 1 && sb === 2) {
        const ang = Math.acos(clamp(dot(sub(g.F, g.P), sub(g.Fp, g.P)) / (g.focalP * g.focalFp), -1, 1)) * 180 / Math.PI;
        t = `초점원 교점 K: S(K) = b² = ${fmt(b * b)}. 현재 P의 각은 ${fmt(ang, 2)}°${Math.abs(ang - 90) < 0.01 ? ' (직각 스냅)' : ' (자유 이동 중)'} · K를 항상 별도로 표시합니다.`;
      } else if (m === 1) t = `현재 |PF′−PF|=${fmt(g.focusDiff)} / 2a=${fmt(2 * a)} · 삼각형 둘레 ${fmt(g.focalFp + g.focalP + 2 * c)}.`;
      else if (m === 2 && sb === 3) t = `P는 M₁M₂ 중점 · 실측 삼각형 넓이 ${fmt(g.tanArea)} / ab=${fmt(a * b)} · OM₁·OM₂=${fmt(g.OMproduct)}.`;
      else if (m === 2) t = `OH=${fmt(dist(g.O, g.H))}, FH=${fmt(dist(g.H, g.F))}; P의 점근선 거리=${fmt(g.l1)} · 점근선 사이 각=${fmt(g.angle, 2)}°.`;
      else if (m === 3 && sb === 2) t = `평행사변형 넓이 실측 ${fmt(g.parArea, 4)} / ab/2=${fmt(a * b / 2, 4)}.`;
      else if (m === 3) t = `l₁=${fmt(g.l1)}, l₂=${fmt(g.l2)} · 실측 곱=${fmt(g.asymProduct, 4)}, 이론=${fmt(a * a * b * b / c / c, 4)}.`;
      else if (m === 4 && sb === 2) t = `F′F*=${fmt(dist(g.Fp, g.Fstar))}, OH₁=${fmt(dist(g.O, g.H1))} · F*는 F의 접선 대칭점.`;
      else if (m === 4 && sb === 1) t = `F′T/TF=${fmt(g.baseRatio, 4)}, PF′/PF=${fmt(g.focalRatio, 4)} · 비율 실측 일치.`;
      else t = `d₁=${fmt(g.d1)}, d₂=${fmt(g.d2)}, d₁d₂=${fmt(g.tanProduct, 4)} / b²=${fmt(b * b, 4)}.`;
      return {
        chips: [
          { k: '쌍곡선', tex: `\\dfrac{x^2}{${stable(a * a)}} - \\dfrac{y^2}{${stable(b * b)}} = 1`, color: 'amber' },
          { k: '점근선', tex: `y=\\pm\\dfrac{${stable(b)}}{${stable(a)}}x`, color: 'sky' }
        ],
        status: ok ? { tone: 'ok', text: '예제 조건 일치' } : { tone: 'warn', text: '예제 조건 해제 · 정답은 원래 예제 기준' },
        alert: { tone: 'info', text: t },
        readouts: [
          { label: '초점 c = √(a²+b²) / 점 P', value: `c=${fmt(c)} | (${fmt(P.x)}, ${fmt(P.y)})`, color: 'amber', wide: true },
          { label: "거리 차 |PF' - PF| = 2a", value: `|${fmt(g.focalFp)} − ${fmt(g.focalP)}| = ${fmt(g.focusDiff)}`, color: 'rose', wide: true },
          { label: '점근선 수선 곱 l₁×l₂ = a²b²/c²', value: `${fmt(g.l1, 3)}×${fmt(g.l2, 3)} = ${fmt(g.asymProduct, 4)}`, color: 'sky', wide: true },
          { label: '접선 초점 수선 곱 d₁×d₂ = b²', value: `${fmt(g.d1, 3)}×${fmt(g.d2, 3)} = ${fmt(g.tanProduct, 4)}`, color: 'violet', wide: true },
          { label: '실측 최대 오차', value: `${err < 0.0005 ? err.toExponential(1) : fmt(err, 4)}%`, color: 'green', wide: true }
        ],
        parts: scenarios[m][sb - 1].parts.map((desc, i) => ({ id: i, name: desc, desc: '', value: null, color: PART_COLORS[i] })),
        summary: explorationLine(g)
      };
    };
  }

  function plotOf(m, g) {
    if (m === 1) plotMode1(g); else if (m === 2) plotMode2(g); else if (m === 3) plotMode3(g); else plotMode4(g);
  }
  function drawOf(m, sub) {
    return (b, s, v) => {
      BOARD = b;
      CUR = s;
      sync(s, m, sub);
      state._labels = [];
      sink.tape = null;
      const g = geometry(state.a, state.b, currentP());
      if (s.grid) b.grid();
      b.axes();
      if (state.lens !== 'all') withAlpha(0.32, () => plotOf(m, g)); else plotOf(m, g);
      drawHyperbolaCurves(g.a, g.b);
      renderLensOverlay(g);
      renderPartFocus(g);
      // 점 P: 선택된 가지 위에서만 움직입니다(원본 handlePointerMove). 가지 전환은 칩으로만.
      b.handle('P', [g.P.x, g.P.y], { color: 'amber', r: 7.5, ariaLabel: '점 P', drag: (w) => { s.py = clamp(w.y, -7.5, 7.5); } });
      state._labels.push({ s: b.toS(g.P.x, g.P.y), text: `P(${fmt(g.P.x)},${fmt(g.P.y)})`, color: palette.gold, offset: { x: 12, y: -18 } });
      drawSmartLabels();
      v.tape = sink.tape;
    };
  }

  /* ---------- 장면 정의 ---------- */
  const GROUPS = [
    { title: "정의(|PF′−PF|=2a) 킬러", short: '정의·거리차' },
    { title: '기출1: 점근선 & 초점 수선(=b)', short: '점근선·초점 수선' },
    { title: '기출2: 두 점근선 수선 곱', short: '점근선 수선 곱' },
    { title: '기출3: 접선(각이등분) & 수선곱', short: '접선·각이등분' }
  ];
  const QUESTION = {
    '1-1': 'P가 쌍곡선 위를 움직이면 두 초점까지의 거리 PF′, PF는 어떻게 변하고, 그 차는 얼마로 유지될까?',
    '1-2': '∠F′KF = 90°가 되는 점 K는 어디에 있고, 삼각형 KF′F의 넓이는 얼마일까?',
    '1-3': 'PF′ = F′F 인 이등변삼각형이 되는 점 P에서 PF와 둘레는 얼마일까?',
    '2-1': '초점 F에서 점근선에 내린 수선의 발 H에 대해 OH와 FH는 각각 얼마일까?',
    '2-2': '두 점근선이 서로 직교하려면 a와 b는 어떤 관계여야 하고, 이때 이심률은 얼마일까?',
    '2-3': 'P에서의 접선이 두 점근선과 만나는 점 M₁, M₂와 원점이 이루는 삼각형의 넓이는 P의 위치와 무관할까?',
    '3-1': 'P에서 두 점근선에 내린 수선의 길이의 곱 l₁l₂ 는 P가 움직여도 변하지 않을까?',
    '3-2': 'P를 지나 두 점근선에 평행한 직선이 만드는 평행사변형의 넓이는 일정할까?',
    '3-3': '꼭짓점 A에서 두 점근선까지의 거리는 얼마이고, 그 곱은 일반 점 P에서의 값과 같을까?',
    '4-1': 'P에서의 접선과 x축의 교점 T는 선분 F′F를 어떤 비로 나눌까?',
    '4-2': '초점 F를 접선에 대해 대칭이동한 점 F*는 어디에 놓이고, OH₁은 얼마일까?',
    '4-3': '두 초점에서 접선까지 거리의 곱 d₁d₂ 는 P가 움직여도 일정할까?'
  };
  const LENSES = [['all', '전체'], ['definition', '거리의 차'], ['asymptote', '점근선·직각'], ['tangent', '접선·대칭']];

  // 원본 fitView 의 뜻: 초점과 점 P, 꼭짓점이 모두 보이도록 장면을 열 때 보기 창을 맞춥니다.
  function focusOf(s) {
    const c = Math.hypot(s.a, s.b);
    const ext = Math.max(Math.abs(s.py), s.b, 4.5);
    return { x: [-(c + 3.2), c + 3.2], y: [-(ext + 1.6), ext + 1.6] };
  }
  // 원본 animateLoop: 점 P가 ±7.4 사이를 오갑니다(60프레임 기준 속도)
  const tick = (s, dt) => {
    if (!s.playing) return false;
    s.py += 0.042 * 60 * s.animDir * dt;
    if (s.py >= 7.4) { s.py = 7.4; s.animDir = -1; }
    if (s.py <= -7.4) { s.py = -7.4; s.animDir = 1; }
    return true;
  };

  function sceneOf(m, sub) {
    const sc = scenarios[m][sub - 1];
    const snapOf = (s) => { sync(s, m, sub); const t = snapTarget(); return { a: t.a, b: t.b, py: (s.py < 0 ? -1 : 1) * Math.abs(t.py) }; };
    return {
      id: `m${m}s${sub}`,
      title: sc.name,
      short: sc.short,
      reviewTab: true,
      question: QUESTION[`${m}-${sub}`],
      guide: `점 P를 드래그하거나 슬라이더·스냅을 조작하세요. <b class="text-amber-300">${sc.short}</b>를 실제 좌표로 관찰합니다.`,
      controls: ['a', 'b', 'py'],
      steps: sc.steps,
      focus: focusOf,
      enter: (s) => { Object.assign(s, snapOf(s)); s.animDir = 1; },
      presets: () => [
        { group: '쌍곡선 가지', label: '우측 가지 x > 0', apply: (st, lab) => { if (st.branch !== 1) { st.branch = 1; if (lab._buildPanel) lab._buildPanel(); } }, on: (st) => st.branch === 1 },
        { group: '쌍곡선 가지', label: '좌측 가지 x < 0', apply: (st, lab) => { if (st.branch !== -1) { st.branch = -1; if (lab._buildPanel) lab._buildPanel(); } }, on: (st) => st.branch === -1 }
      ].concat(LENSES.map(([k, lbl]) => ({ group: '관찰 렌즈', label: lbl, apply: (st) => { st.lens = k; }, on: (st) => st.lens === k }))),
      actions: [{ id: 'play', play: true, icon: (s) => (s.playing ? 'pause' : 'play'), label: (s) => (s.playing ? '일시 정지' : '자동 주행'), on: (s) => s.playing, run: (s) => { s.playing = !s.playing; } }],
      problem: {
        tag: `기하 실전 변형 · ${sc.short}`,
        time: sub === 1 ? examData[m].targetTime : undefined,
        text: (s) => APLab.esc(branchProblem(m, sub, s.branch).question),
        answer: (s) => APLab.esc(branchProblem(m, sub, s.branch).answer),
        snap: snapOf
      },
      solution: solutionOf(m, sub),
      tick,
      view: viewOf(m, sub),
      draw: drawOf(m, sub)
    };
  }

  const groups = [1, 2, 3, 4].map((m) => ({
    id: 'm' + m,
    title: GROUPS[m - 1].title,
    short: GROUPS[m - 1].short,
    scenes: [1, 2, 3].map((sub) => sceneOf(m, sub))
  }));

  APLab.createLab({
    id: 'geom-hyperbola',
    title: '쌍곡선 실전 킬러 랩',
    courseName: '기하',
    unit: '이차곡선 · 쌍곡선',
    courseColor: 'var(--m-rose)',
    home: '../index.html#geom',
    legacy: '../../labs/기하와벡터/쌍곡선.html',
    board: { kind: 'cartesian', focus: { x: [-8.2, 8.2], y: [-6.6, 6.6] } },
    params: {
      a: { value: 3, min: 2, max: 5, step: 0.05, color: 'amber', label: '주축 반지름 $a$', hint: '꼭짓점이 $(\\pm a,0)$ · 주축의 길이는 $2a$', format: (v) => `a = ${fmt(v)} (2a = ${fmt(2 * v)})` },
      b: { value: 4, min: 1.5, max: 5, step: 0.05, color: 'sky', label: '$b$ (점근선 기울기 $b/a$)', hint: '초점은 $c=\\sqrt{a^2+b^2}$', format: (v) => `b = ${fmt(v)} (b² = ${fmt(v * v)})` },
      py: { value: 5, min: -7.5, max: 7.5, step: 0.05, color: 'rose', label: '점 P의 세로 좌표 $y_1$', hint: '그림의 노란 점 P를 끌어도 같이 움직입니다', format: (v, s) => `y₁ = ${fmt(v)} (x₁ = ${fmt(s.branch * s.a * Math.hypot(1, v / s.b))})` }
    },
    state: { branch: 1, lens: 'all', animDir: 1 },
    persist: ['lens', 'branch'],
    groups
  });
});
</script>
