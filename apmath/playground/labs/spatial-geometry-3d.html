<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AP Math Playground · 구와 평면의 단면 기하 3D 실험실</title>
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style>
    :root {
      --bg: #09090D;
      --surface: #120E18;
      --card: #181220;
      --accent-gold: #D8B77E;
      --accent-emerald: #55CBA3;
      --accent-amethyst: #A78AC8;
      --text: #F5F0E9;
      --text-sub: #BDB8C2;
      --border: rgba(216, 183, 126, 0.18);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Pretendard', sans-serif;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    header {
      height: 60px;
      padding: 0 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      background: rgba(18, 14, 24, 0.9);
      backdrop-filter: blur(12px);
    }
    .header-left { display: flex; align-items: center; gap: 14px; }
    .btn-back {
      padding: 6px 14px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--accent-gold);
      font-size: 13px;
      font-weight: 750;
      text-decoration: none;
      transition: all 0.2s;
    }
    .btn-back:hover { border-color: var(--accent-emerald); color: var(--text); }
    .lab-title { font-size: 16px; font-weight: 850; }
    .lab-meta { font-size: 11px; color: var(--accent-emerald); margin-left: 6px; }
    .layout {
      flex: 1;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 340px;
      overflow: hidden;
    }
    #canvas3d {
      width: 100%;
      height: 100%;
      display: block;
      cursor: grab;
    }
    #canvas3d:active { cursor: grabbing; }
    aside {
      background: var(--surface);
      border-left: 1px solid var(--border);
      padding: 22px 20px;
      display: flex;
      flex-direction: column;
      gap: 18px;
      overflow-y: auto;
    }
    .control-block {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
    }
    .control-block label {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      font-weight: 800;
      color: var(--text);
      margin-bottom: 8px;
    }
    .val-chip { color: var(--accent-gold); font-family: monospace; font-size: 14px; }
    input[type=range] { width: 100%; accent-color: var(--accent-emerald); }
    .proof-box {
      background: rgba(9, 9, 13, 0.7);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      font-size: 13px;
      line-height: 1.6;
    }
    .proof-formula {
      font-family: 'Times New Roman', serif;
      font-style: italic;
      font-size: 15px;
      color: var(--accent-gold);
      margin-bottom: 8px;
    }
    .proof-stat {
      display: flex;
      justify-content: space-between;
      font-size: 12.5px;
      margin-bottom: 4px;
      color: var(--text-sub);
    }
    .proof-sum {
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      font-weight: 850;
      color: var(--accent-emerald);
      display: flex;
      justify-content: space-between;
      font-size: 13.5px;
    }
    @media (max-width: 820px) {
      .layout { grid-template-columns: 1fr; grid-template-rows: 1fr auto; }
      aside { height: 260px; border-left: none; border-top: 1px solid var(--border); }
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "../universe/vendor/three.module.js",
        "three/addons/": "../universe/vendor/"
      }
    }
  </script>
</head>
<body>
  <header>
    <div class="header-left">
      <a href="../teacher-hub.html" class="btn-back">← 메인 허브로</a>
      <div>
        <span class="lab-title">구와 평면의 단면 기하 3D</span>
        <span class="lab-meta">기하 · 공간도형</span>
      </div>
    </div>
  </header>

  <div class="layout">
    <canvas id="canvas3d"></canvas>
    <aside>
      <div class="control-block">
        <label>구 반지름 R <span class="val-chip" id="valR">3.0</span></label>
        <input type="range" id="sliderR" min="2.0" max="4.5" step="0.1" value="3.0">
      </div>

      <div class="control-block">
        <label>평면의 높이 (거리 d) <span class="val-chip" id="valD">1.2</span></label>
        <input type="range" id="sliderD" min="0.0" max="4.0" step="0.1" value="1.2">
      </div>

      <div class="proof-box">
        <div class="proof-formula">x² + y² + z² = R²,  z = d  ⇒  r = √(R² − d²)</div>
        <div class="proof-stat"><span>구의 반지름 (R)</span><span id="statR">3.00</span></div>
        <div class="proof-stat"><span>구 중심~평면 거리 (d)</span><span id="statD">1.20</span></div>
        <div class="proof-stat"><span>단면 원 반지름 r</span><span id="statSliceR">2.75</span></div>
        <div class="proof-sum"><span>단면 원의 넓이 (πr²)</span><span id="statArea">23.75</span></div>
      </div>

      <div class="proof-box" style="font-size: 12.5px; color: var(--text-sub);">
        <strong>공간도형의 핵심 정리:</strong><br>
        구를 임의의 평면으로 자르면 단면은 항상 원이 되며, 구의 중심에서 평면에 내린 수선의 발이 단면 원의 중심이 됩니다. <span style="color:var(--accent-gold);">d &gt; R</span>이면 교점이 존재하지 않습니다.
      </div>
    </aside>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/OrbitControls.js';

    const canvas = document.getElementById('canvas3d');
    const sliderR = document.getElementById('sliderR');
    const sliderD = document.getElementById('sliderD');
    const valR = document.getElementById('valR');
    const valD = document.getElementById('valD');
    const statR = document.getElementById('statR');
    const statD = document.getElementById('statD');
    const statSliceR = document.getElementById('statSliceR');
    const statArea = document.getElementById('statArea');

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x09090D);

    const camera = new THREE.PerspectiveCamera(45, canvas.clientWidth / canvas.clientHeight, 0.1, 100);
    camera.position.set(7, 5, 8);

    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setSize(canvas.clientWidth, canvas.clientHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;

    // Lights
    const amb = new THREE.AmbientLight(0xffffff, 0.9);
    scene.add(amb);
    const dir = new THREE.DirectionalLight(0xD8B77E, 2.0);
    dir.position.set(5, 10, 7);
    scene.add(dir);

    // Grid helper
    const grid = new THREE.GridHelper(10, 20, 0x55CBA3, 0x241727);
    grid.position.y = -3;
    scene.add(grid);

    // Objects Group
    const group = new THREE.Group();
    scene.add(group);

    let sphereMesh, planeMesh, sliceCircle;

    function build() {
      if (sphereMesh) group.remove(sphereMesh);
      if (planeMesh) group.remove(planeMesh);
      if (sliceCircle) group.remove(sliceCircle);

      const R = parseFloat(sliderR.value);
      const d = parseFloat(sliderD.value);

      valR.textContent = R.toFixed(1);
      valD.textContent = d.toFixed(1);
      statR.textContent = R.toFixed(2);
      statD.textContent = d.toFixed(2);

      // Sphere
      const sphereGeo = new THREE.SphereGeometry(R, 32, 24);
      const sphereMat = new THREE.MeshPhysicalMaterial({
        color: 0x241727,
        roughness: 0.2,
        transmission: 0.7,
        thickness: 1.0,
        transparent: true,
        opacity: 0.6,
        wireframe: false
      });
      sphereMesh = new THREE.Mesh(sphereGeo, sphereMat);
      group.add(sphereMesh);

      // Wireframe overlay for sphere
      const wireMat = new THREE.MeshBasicMaterial({ color: 0x55CBA3, wireframe: true, transparent: true, opacity: 0.15 });
      const wireMesh = new THREE.Mesh(sphereGeo, wireMat);
      sphereMesh.add(wireMesh);

      // Intersecting Plane at y = d
      const planeGeo = new THREE.PlaneGeometry(8, 8);
      const planeMat = new THREE.MeshStandardMaterial({
        color: 0xD8B77E,
        side: THREE.DoubleSide,
        transparent: true,
        opacity: 0.25,
        roughness: 0.4
      });
      planeMesh = new THREE.Mesh(planeGeo, planeMat);
      planeMesh.rotation.x = Math.PI / 2;
      planeMesh.position.y = d;
      group.add(planeMesh);

      // Section circle
      if (d <= R) {
        const sliceRadius = Math.sqrt(R * R - d * d);
        statSliceR.textContent = sliceRadius.toFixed(2);
        statArea.textContent = (Math.PI * sliceRadius * sliceRadius).toFixed(2);

        const circleGeo = new THREE.RingGeometry(Math.max(0.01, sliceRadius - 0.04), sliceRadius + 0.04, 64);
        const circleMat = new THREE.MeshBasicMaterial({ color: 0x55CBA3, side: THREE.DoubleSide });
        sliceCircle = new THREE.Mesh(circleGeo, circleMat);
        sliceCircle.rotation.x = Math.PI / 2;
        sliceCircle.position.y = d + 0.01;
        group.add(sliceCircle);
      } else {
        statSliceR.textContent = '교선 없음 (d > R)';
        statArea.textContent = '0.00';
      }
    }

    sliderR.addEventListener('input', build);
    sliderD.addEventListener('input', build);
    build();

    function onResize() {
      camera.aspect = canvas.clientWidth / canvas.clientHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(canvas.clientWidth, canvas.clientHeight);
    }
    window.addEventListener('resize', onResize);

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      group.rotation.y += 0.003;
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
