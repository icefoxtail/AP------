<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AP Math Playground · 일차함수의 기울기와 절편 실험실</title>
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style>
    :root {
      --bg: #09090D;
      --surface: #120E18;
      --card: #181220;
      --accent-gold: #D8B77E;
      --accent-emerald: #55CBA3;
      --accent-amethyst: #A78AC8;
      --text: #F5F0E9;
      --text-sub: #BDB8C2;
      --border: rgba(216, 183, 126, 0.18);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Pretendard', sans-serif;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    header {
      height: 60px;
      padding: 0 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      background: rgba(18, 14, 24, 0.9);
      backdrop-filter: blur(12px);
    }
    .header-left { display: flex; align-items: center; gap: 14px; }
    .btn-back {
      padding: 6px 14px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--accent-gold);
      font-size: 13px;
      font-weight: 750;
      text-decoration: none;
      transition: all 0.2s;
    }
    .btn-back:hover { border-color: var(--accent-emerald); color: var(--text); }
    .lab-title { font-size: 16px; font-weight: 850; }
    .lab-meta { font-size: 11px; color: var(--accent-emerald); margin-left: 6px; }
    .layout {
      flex: 1;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 340px;
      overflow: hidden;
    }
    #canvasView {
      width: 100%;
      height: 100%;
      display: block;
      background: radial-gradient(circle at center, #1b1322 0%, #09090D 80%);
    }
    aside {
      background: var(--surface);
      border-left: 1px solid var(--border);
      padding: 22px 20px;
      display: flex;
      flex-direction: column;
      gap: 18px;
      overflow-y: auto;
    }
    .control-block {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
    }
    .control-block label {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      font-weight: 800;
      color: var(--text);
      margin-bottom: 8px;
    }
    .val-chip { color: var(--accent-gold); font-family: monospace; font-size: 14px; }
    input[type=range] { width: 100%; accent-color: var(--accent-emerald); }
    .proof-box {
      background: rgba(9, 9, 13, 0.7);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      font-size: 13px;
      line-height: 1.6;
    }
    .proof-formula {
      font-family: 'Times New Roman', serif;
      font-style: italic;
      font-size: 15px;
      color: var(--accent-gold);
      margin-bottom: 8px;
    }
    .proof-stat {
      display: flex;
      justify-content: space-between;
      font-size: 12.5px;
      margin-bottom: 4px;
      color: var(--text-sub);
    }
    .proof-sum {
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      font-weight: 850;
      color: var(--accent-emerald);
      display: flex;
      justify-content: space-between;
      font-size: 13.5px;
    }
    @media (max-width: 820px) {
      .layout { grid-template-columns: 1fr; grid-template-rows: 1fr auto; }
      aside { height: 260px; border-left: none; border-top: 1px solid var(--border); }
    }
  </style>
</head>
<body>
  <header>
    <div class="header-left">
      <a href="../teacher-hub.html" class="btn-back">← 메인 허브로</a>
      <div>
        <span class="lab-title">일차함수의 기울기와 평행이동</span>
        <span class="lab-meta">중2 · 함수</span>
      </div>
    </div>
  </header>

  <div class="layout">
    <canvas id="canvasView"></canvas>
    <aside>
      <div class="control-block">
        <label>기울기 a <span class="val-chip" id="valA">1.50</span></label>
        <input type="range" id="sliderA" min="-3.0" max="3.0" step="0.1" value="1.5">
      </div>

      <div class="control-block">
        <label>y절편 b (평행이동) <span class="val-chip" id="valB">1.0</span></label>
        <input type="range" id="sliderB" min="-4.0" max="4.0" step="0.5" value="1.0">
      </div>

      <div class="proof-box">
        <div class="proof-formula" id="formulaDisplay">y = 1.5x + 1.0</div>
        <div class="proof-stat"><span>y절편 (0, b)</span><span id="statYInt">(0, 1.0)</span></div>
        <div class="proof-stat"><span>x절편 (−b/a, 0)</span><span id="statXInt">(−0.67, 0)</span></div>
        <div class="proof-stat"><span>증가율 (Δy / Δx)</span><span id="statSlope">+1.50</span></div>
        <div class="proof-sum"><span>지나는 사분면</span><span id="statQuadrants">제 1, 2, 3 사분면</span></div>
      </div>

      <div class="proof-box" style="font-size: 12.5px; color: var(--text-sub);">
        <strong>일차함수의 본질:</strong><br>
        기울기 <span style="color:var(--accent-emerald);">a</span>는 직선의 방향과 경사를 결정하고, 상수항 <span style="color:var(--accent-gold);">b</span>는 원점을 지나는 직선 <span style="color:var(--accent-gold);">y = ax</span>의 y축 방향 평행이동량을 나타냅니다.
      </div>
    </aside>
  </div>

  <script>
    const canvas = document.getElementById('canvasView');
    const ctx = canvas.getContext('2d');
    const sliderA = document.getElementById('sliderA');
    const sliderB = document.getElementById('sliderB');
    const valA = document.getElementById('valA');
    const valB = document.getElementById('valB');
    const formulaDisplay = document.getElementById('formulaDisplay');
    const statYInt = document.getElementById('statYInt');
    const statXInt = document.getElementById('statXInt');
    const statSlope = document.getElementById('statSlope');
    const statQuadrants = document.getElementById('statQuadrants');

    function resize() {
      canvas.width = canvas.clientWidth * window.devicePixelRatio;
      canvas.height = canvas.clientHeight * window.devicePixelRatio;
      draw();
    }
    window.addEventListener('resize', resize);

    function update() {
      const a = parseFloat(sliderA.value);
      const b = parseFloat(sliderB.value);

      valA.textContent = a.toFixed(2);
      valB.textContent = b >= 0 ? `+${b.toFixed(1)}` : b.toFixed(1);

      const signB = b >= 0 ? `+ ${b.toFixed(1)}` : `− ${Math.abs(b).toFixed(1)}`;
      formulaDisplay.textContent = `y = ${a.toFixed(1)}x ${b !== 0 ? signB : ''}`;

      statYInt.textContent = `(0, ${b.toFixed(1)})`;
      if (Math.abs(a) < 0.01) {
        statXInt.textContent = b === 0 ? '전체 실수' : '존재 안 함 (평행)';
      } else {
        const x0 = -b / a;
        statXInt.textContent = `(${x0.toFixed(2)}, 0)`;
      }

      statSlope.textContent = a > 0 ? `+${a.toFixed(2)} (우상향)` : a < 0 ? `${a.toFixed(2)} (우하향)` : '0.00 (수평선)';

      // Quadrant check
      let quads = [];
      if (a > 0) {
        if (b > 0) quads = [1, 2, 3];
        else if (b < 0) quads = [1, 3, 4];
        else quads = [1, 3];
      } else if (a < 0) {
        if (b > 0) quads = [1, 2, 4];
        else if (b < 0) quads = [2, 3, 4];
        else quads = [2, 4];
      } else {
        if (b > 0) quads = [1, 2];
        else if (b < 0) quads = [3, 4];
        else quads = ['축 위'];
      }
      statQuadrants.textContent = quads.map(q => typeof q === 'number' ? `제${q}` : q).join(', ') + ' 사분면';

      draw();
    }

    sliderA.addEventListener('input', update);
    sliderB.addEventListener('input', update);

    function draw() {
      const w = canvas.width;
      const h = canvas.height;
      ctx.clearRect(0, 0, w, h);

      const cx = w / 2;
      const cy = h / 2;
      const unit = Math.min(w, h) / 14;

      // Coordinate Grid
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.05)';
      ctx.lineWidth = 1 * window.devicePixelRatio;
      for (let x = -7; x <= 7; x++) {
        ctx.beginPath();
        ctx.moveTo(cx + x * unit, 0);
        ctx.lineTo(cx + x * unit, h);
        ctx.stroke();
      }
      for (let y = -7; y <= 7; y++) {
        ctx.beginPath();
        ctx.moveTo(0, cy - y * unit);
        ctx.lineTo(w, cy - y * unit);
        ctx.stroke();
      }

      // Main Axes
      ctx.strokeStyle = '#7E7887';
      ctx.lineWidth = 1.5 * window.devicePixelRatio;
      ctx.beginPath();
      ctx.moveTo(0, cy); ctx.lineTo(w, cy);
      ctx.moveTo(cx, 0); ctx.lineTo(cx, h);
      ctx.stroke();

      const a = parseFloat(sliderA.value);
      const b = parseFloat(sliderB.value);

      // Parent line y = ax (dashed gold)
      if (b !== 0) {
        ctx.save();
        ctx.setLineDash([4 * window.devicePixelRatio, 4 * window.devicePixelRatio]);
        ctx.strokeStyle = 'rgba(216, 183, 126, 0.4)';
        ctx.lineWidth = 1.8 * window.devicePixelRatio;
        ctx.beginPath();
        const x1 = -8, y1 = a * x1;
        const x2 = 8, y2 = a * x2;
        ctx.moveTo(cx + x1 * unit, cy - y1 * unit);
        ctx.lineTo(cx + x2 * unit, cy - y2 * unit);
        ctx.stroke();
        ctx.restore();
      }

      // Actual line y = ax + b (Emerald)
      ctx.strokeStyle = '#55CBA3';
      ctx.lineWidth = 3.5 * window.devicePixelRatio;
      ctx.beginPath();
      const leftX = -8, leftY = a * leftX + b;
      const rightX = 8, rightY = a * rightX + b;
      ctx.moveTo(cx + leftX * unit, cy - leftY * unit);
      ctx.lineTo(cx + rightX * unit, cy - rightY * unit);
      ctx.stroke();

      // Right triangle for slope (at x=1 to x=2)
      const xStart = 1;
      const xEnd = 2;
      const yStart = a * xStart + b;
      const yEnd = a * xEnd + b;

      ctx.beginPath();
      ctx.moveTo(cx + xStart * unit, cy - yStart * unit);
      ctx.lineTo(cx + xEnd * unit, cy - yStart * unit); // horizontal Δx
      ctx.lineTo(cx + xEnd * unit, cy - yEnd * unit);   // vertical Δy
      ctx.strokeStyle = '#D8B77E';
      ctx.lineWidth = 2 * window.devicePixelRatio;
      ctx.stroke();

      // Intercept dots
      const drawPoint = (x, y, color, label) => {
        ctx.beginPath();
        ctx.arc(cx + x * unit, cy - y * unit, 5 * window.devicePixelRatio, 0, Math.PI * 2);
        ctx.fillStyle = color;
        ctx.fill();
        ctx.font = `bold ${12 * window.devicePixelRatio}px Pretendard`;
        ctx.fillText(label, cx + x * unit + 8, cy - y * unit - 8);
      };

      drawPoint(0, b, '#D8B77E', `(0, ${b.toFixed(1)})`);
      if (Math.abs(a) > 0.05) {
        drawPoint(-b / a, 0, '#A78AC8', `(${-b / a.toFixed(1)}, 0)`);
      }
    }

    resize();
    update();
  </script>
</body>
</html>
