<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, " />
  <title>고1 유리·무리·합성·역함수 심화 기하 실험실 | AP Math</title>
  <!-- Pretendard Webfont -->
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome 6 CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <!-- KaTeX CDN -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>

  <style>
    * {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background-color: #05100c;
      color: #f1f5f9;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
    }
    .chalkboard-stage {
      background: radial-gradient(circle at 50% 45%, #122d23 0%, #091913 70%, #040d09 100%);
      box-shadow: inset 0 0 90px rgba(0, 0, 0, 0.85);
    }
    .mini-chalkboard {
      background: linear-gradient(160deg, #132e24 0%, #0b1d17 65%, #06120e 100%);
      border: 2px solid #fbbf24;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.8), inset 0 0 40px rgba(0, 0, 0, 0.55);
    }
    .katex { font-size: 1.03em !important; }

    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #05100c; }
    ::-webkit-scrollbar-thumb { background: #1e4637; border-radius: 3px; }

    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      background: #0d231b;
      height: 8px;
      border-radius: 999px;
      outline: none;
      border: 1px solid #285946;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #fbbf24;
      cursor: pointer;
      border: 2.5px solid #ffffff;
      box-shadow: 0 0 12px rgba(251, 191, 36, 0.95);
      transition: transform 0.15s ease;
    }
    input[type="range"]::-webkit-slider-thumb:hover { transform: scale(1.15); }

    .prob-tab.active {
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: #05100c;
      font-weight: 900;
      border-color: #fef08a;
      box-shadow: 0 0 14px rgba(245, 158, 11, 0.45);
    }
    .step-btn.active {
      background: linear-gradient(135deg, #fbbf24, #f59e0b);
      color: #05100c;
      font-weight: 900;
      border-color: #fef08a;
      box-shadow: 0 0 12px rgba(251, 191, 36, 0.55);
      transform: translateY(-1px);
    }
    .chalk-step-card {
      transition: all 0.2s ease;
      cursor: pointer;
    }
    .chalk-step-card:hover {
      border-color: #fbbf24;
      background: rgba(251, 191, 36, 0.08);
    }
    .chalk-step-card.active {
      border-color: #fbbf24;
      background: rgba(251, 191, 36, 0.18);
      box-shadow: 0 0 18px rgba(251, 191, 36, 0.28);
    }

    /* 데스크톱: 좌우 와이드 분할 | 모바일·태블릿: 상하 동시 비교 뷰 */
    @media (min-width: 1200px) {
      body { height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
      .workspace-layout { flex: 1; display: grid; grid-template-columns: 1fr 470px; overflow: hidden; }
      .left-stage-col { height: 100%; display: flex; flex-direction: column; overflow: hidden; }
      .right-panel-col { height: 100%; overflow-y: auto; border-left: 1px solid rgba(16, 185, 129, 0.28); }
    }
    @media (max-width: 1199px) {
      body { min-height: 100vh; overflow-y: auto; display: flex; flex-direction: column; }
      .workspace-layout { display: flex; flex-direction: column; }
      .canvas-box { height: clamp(340px, 50svh, 500px); width: 100%; transition: height 0.25s ease; }
      /* 모바일에서 소형 풀이 칠판을 열면 도형과 칠판이 한 시야에 들어오도록 높이 최적화 */
      body.mobile-chalk-open .canvas-box { height: clamp(275px, 40svh, 390px); }
    }

    .board-tabs { display:flex; gap:4px; overflow:auto; }
    .board-tabs button { white-space:nowrap; padding:6px 9px; border:1px solid #42775f; border-radius:6px; font-size:12px; }
    .board-tabs button.chosen { background:#fbbf24; color:#06130e; font-weight:800; }
    #scaffoldList, #auxHintBox {display:none!important}
    #miniChalkboard {overflow:auto; max-height:calc(100vh - 340px)}
    @media (min-width:1200px) { .workspace-layout {grid-template-columns:minmax(0, 68fr) minmax(310px,32fr)} }
    @media (min-width:768px) and (max-width:1199px) {
      .workspace-layout {display:grid; grid-template-columns:minmax(0, 60fr) minmax(270px,40fr); align-items:start;overflow:hidden} .workspace-layout > * {min-width:0} #snapChipBox {max-width:100%}
      .left-stage-col {display:contents} .left-stage-col > div:first-child {grid-column:1 / -1}
      .canvas-box {grid-column:1; grid-row:2 / span 2; height: min(65vh,700px); min-height:420px}
      .left-stage-col > div:last-child {grid-column:2;grid-row:2}
      .right-panel-col {grid-column:2;grid-row:3} #miniChalkboard {max-height:55vh}
    }
    @media(max-width:767px) { header h1, header h1 + span, #mobSnapTag {display:none} header {padding-top:4px!important;padding-bottom:4px!important} #snapChipBox {display:none} .right-panel-col {padding-top:6px!important} #mobStatement {font-size:15px;line-height:1.55} #mobTitle {font-size:14px} .canvas-box {height:40svh; min-height:260px} body.mobile-chalk-open .canvas-box {height:32svh; min-height:220px} #miniChalkboard {max-height:40vh} #snapChipBox {max-width:100%} }
    .problem-nav {display:flex;align-items:start;gap:8px;min-width:0}
    .problem-groups {display:flex;gap:4px;flex-shrink:0}
    .group-button,.number-tab {border:1px solid #266047;background:#052b1d;color:#c9f4df;border-radius:7px;min-height:34px;font-size:12px;font-weight:700;cursor:pointer}
    .group-button {padding:0 10px;white-space:nowrap}
    .group-button.selected {border-color:#fbbf24;color:#fcd34d;background:#513c0a}
    .number-tabs {display:grid;grid-template-columns:repeat(16,minmax(30px,1fr));gap:4px;flex:1;min-width:0}
    .number-tab {width:100%;padding:0 3px}
    @media(max-width:1023px) {.number-tabs {grid-template-columns:repeat(8,minmax(0,1fr))}}
    @media(max-width:767px) {.problem-nav {display:block}.problem-groups {margin-bottom:5px}.group-button {min-height:30px}.number-tab {min-height:31px}}
    .problem-picker {position:relative;flex:1;min-width:0}
    .problem-list-toggle {width:100%;display:flex;align-items:center;gap:9px;padding:7px 10px;border:1px solid #426b54;border-radius:7px;background:#0c261a;color:#f2fff6;text-align:left;cursor:pointer}
    .picker-label {color:#b7d9c3;font-size:11px;white-space:nowrap}.problem-list-toggle strong {flex:1;min-width:0;font-size:13px;line-height:1.4;overflow-wrap:anywhere}.picker-action {color:#fcd34d;font-size:12px;font-weight:700;white-space:nowrap}
    .problem-list {position:absolute;top:calc(100% + 4px);left:0;right:0;z-index:50;max-height:min(55vh,420px);overflow-y:auto;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:5px;padding:8px;background:#071b12;border:1px solid #568b6c;border-radius:8px;box-shadow:0 12px 30px #000b}
    .problem-list[hidden] {display:none}.problem-item {min-height:40px;padding:7px 9px;border:1px solid #276147;border-radius:6px;background:#0d2b1d;color:#d8f9e4;text-align:left;font-size:12px;line-height:1.35;white-space:normal;overflow-wrap:anywhere;cursor:pointer}
    @media(max-width:767px) {.problem-list {grid-template-columns:1fr;max-height:50vh}.problem-list-toggle {gap:6px}.picker-label {display:none}.picker-action {font-size:11px}}
    @media (max-width:1100px) {
      #mobStatement, #pcStatement {font-size:15px!important;line-height:1.6!important}
      #mobTitle, #pcTitle {font-size:15px!important;line-height:1.4!important}
      .problem-list-toggle strong, .problem-item, .group-button, .picker-action {font-size:14px!important;line-height:1.4!important}
      .step-btn, #btnChalkToggle, #sliderTitle, #sliderReadout, #liveMetricBar {font-size:14px!important;line-height:1.4!important}
      .step-btn, #btnChalkToggle, .group-button {min-height:38px}
      #miniChalkboard .text-xs, #miniChalkboard .text-\[11px\], #miniChalkboard .text-\[10\.5px\], #miniChalkboard .text-\[10px\] {font-size:14px!important;line-height:1.5!important}
      .board-tabs button {font-size:14px;min-height:38px}
    }
    @media (min-width:1024px) and (max-width:1100px) {#pcStatement {font-size:15px!important;line-height:1.6!important}}
    #miniChalkboard [hidden] {display:none!important}
    #pcStatement {font-size:16px!important;line-height:1.75!important}
    #pcTitle {font-size:17px!important;line-height:1.45!important}
    #miniChalkboard .text-xs {font-size:14px!important;line-height:1.65!important}
    #miniChalkboard .board-tabs button {min-height:44px;font-size:14px}
    #btnChalkToggle,.step-btn,.group-button,.problem-list-toggle,.problem-item {min-height:44px}
    #sliderTitle,#sliderReadout {font-size:14px!important}
    @media(max-width:1199px) {
      #mobStatement,#pcStatement {font-size:16px!important;line-height:1.7!important}
      #mobTitle,#pcTitle {font-size:16px!important}
      .step-btn,#btnChalkToggle,.group-button,.problem-list-toggle,.problem-item {min-height:44px!important}
    }
    @media(max-width:767px) {
      #snapChipBox {display:flex!important;width:100%;max-width:100%;overflow-x:auto;flex-wrap:nowrap;min-height:0}
      #snapChipBox:empty {display:none!important}
      #snapChipBox button {min-height:42px;font-size:12px!important;padding:7px 10px}
      .canvas-box {min-height:280px}
      #miniChalkboard {max-height:55svh}
    }
  </style>
</head>
<body>

  <!-- ===================================================================== -->
  <!-- 상단 헤더: 심화 8선 빠른 선택 탭 & 이전/다음 내비게이션 -->
  <!-- ===================================================================== -->
  <header class="bg-[#071510] border-b border-emerald-900/80 px-3 py-2 shrink-0 z-20">
    <div class="max-w-[1800px] mx-auto flex flex-col gap-2">
      <div class="flex flex-wrap items-center justify-between gap-2">
        <div class="flex items-center gap-2">
          <div class="w-7 h-7 rounded-lg bg-amber-500/20 border border-amber-400/60 flex items-center justify-center text-amber-300">
            <i class="fa-solid fa-compass-drafting text-sm"></i>
          </div>
          <h1 class="text-sm sm:text-base font-black tracking-tight text-emerald-50">고1 유리·무리·합성·역함수 기하 마스터 실험실</h1>
          <span class="text-[11px] font-extrabold px-2 py-0.5 rounded bg-amber-500/20 text-amber-300 border border-amber-400/40">심화 8선 · 기본 16선</span>
        </div>

        <div class="flex items-center gap-1.5 text-xs">
          <button onclick="stepProblem(-1)" class="px-2.5 py-1 rounded-lg bg-emerald-950 hover:bg-emerald-800 border border-emerald-700/70 text-emerald-200 font-bold transition">
            <i class="fa-solid fa-chevron-left mr-1"></i>이전 문항
          </button>
          <button onclick="stepProblem(1)" class="px-2.5 py-1 rounded-lg bg-emerald-950 hover:bg-emerald-800 border border-emerald-700/70 text-emerald-200 font-bold transition">
            다음 문항<i class="fa-solid fa-chevron-right ml-1"></i>
          </button>
        </div>
      </div>

      <!-- 8대 창작 심화문항 선택 바 -->
      <nav id="probTabBar" aria-label="문항 선택"></nav>
    </div>
  </header>

  <!-- ===================================================================== -->
  <!-- 메인 워크스페이스 (좌측/상단: 문제+도형+보조선 바 | 우측/하단: 소형 풀이 칠판) -->
  <!-- ===================================================================== -->
  <div class="workspace-layout max-w-[1800px] w-full mx-auto">

    <!-- [좌측/상단 컬럼] -->
    <div class="left-stage-col">

      <!-- 모바일·태블릿 상시 노출 문제 카드 (숨기지 않고 도형 바로 위에 선명하게 표시) -->
      <div class="lg:hidden bg-[#091b14] border-b border-emerald-800/80 px-3.5 py-2.5">
        <div class="flex items-center justify-between gap-2 mb-1">
          <div class="flex items-center gap-1.5">
            <span id="mobBadge" class="text-[10.5px] font-black px-2 py-0.5 rounded bg-amber-500/20 text-amber-300 border border-amber-400/50"></span>
            <h2 id="mobTitle" class="text-xs sm:text-sm font-extrabold text-white"></h2>
          </div>
          <span id="mobSnapTag" class="text-[10.5px] font-mono font-bold text-amber-300 bg-amber-950/70 px-2 py-0.5 rounded border border-amber-500/40 shrink-0"></span>
        </div>
        <div id="mobStatement" class="text-xs sm:text-[13px] text-emerald-50/95 leading-relaxed bg-[#05100c] p-2.5 rounded-lg border border-emerald-800/70"></div>
      </div>

      <!-- 메인 인터랙티브 그래프 캔버스 -->
      <main class="canvas-box flex-1 relative chalkboard-stage overflow-hidden flex items-center justify-center">
        <canvas id="geoCanvas" class="w-full h-full block cursor-grab active:cursor-grabbing" style="touch-action: none;"></canvas>

        <!-- 좌측 상단: 실시간 측정값 & 드래그 안내 배지 -->
        <div class="absolute top-2.5 left-2.5 pointer-events-none flex flex-col gap-1 max-w-[85%]">
          <div class="bg-[#05100c]/90 backdrop-blur-md border border-emerald-700/70 rounded-lg px-3 py-1.5 shadow-lg inline-flex items-center gap-2 w-fit">
            <span class="w-2 h-2 rounded-full bg-amber-400 animate-ping shrink-0"></span>
            <span id="liveMetricBar" class="text-[11.5px] font-bold text-amber-200"></span>
          </div>
        </div>

        <!-- 우측 하단: 확대/축소/초기화 -->
        <div class="absolute bottom-2.5 right-2.5 flex items-center gap-1 bg-[#05100c]/90 backdrop-blur-md border border-emerald-800/80 p-1 rounded-lg shadow-lg">
          <button onclick="zoomCanvas(1.15)" class="w-7 h-7 rounded hover:bg-emerald-900/70 text-emerald-200 text-xs flex items-center justify-center" title="확대"><i class="fa-solid fa-plus"></i></button>
          <button onclick="zoomCanvas(0.87)" class="w-7 h-7 rounded hover:bg-emerald-900/70 text-emerald-200 text-xs flex items-center justify-center" title="축소"><i class="fa-solid fa-minus"></i></button>
          <button onclick="resetView()" class="w-7 h-7 rounded hover:bg-emerald-900/70 text-amber-300 text-xs flex items-center justify-center" title="초기화"><i class="fa-solid fa-rotate-left"></i></button>
        </div>
      </main>

      <!-- 캔버스 직하단: 보조선 1·2·3단계 컨트롤러 + 슬라이더 + 소형 칠판 꺼내기 버튼 -->
      <div class="bg-[#081711] border-t border-emerald-800/80 px-3.5 py-2.5 shrink-0 space-y-2">
        <div class="flex flex-wrap items-center justify-between gap-2">
          <!-- 보조선 단계 버튼 -->
          <div class="flex flex-wrap items-center gap-1">
            <span class="text-[11px] font-extrabold text-amber-300 mr-1 flex items-center gap-1">
              <i class="fa-solid fa-wand-magic-sparkles"></i> 기하 보조선:
            </span>
            <button onclick="setAuxStep(0)" id="aux-0" class="step-btn text-xs px-2.5 py-1 rounded-lg border border-emerald-800 bg-emerald-950/70 text-emerald-200 transition">꺼짐</button>
            <button onclick="setAuxStep(1)" id="aux-1" class="step-btn text-xs px-2.5 py-1 rounded-lg border border-emerald-800 bg-emerald-950/70 text-emerald-200 transition">1단계</button>
            <button onclick="setAuxStep(2)" id="aux-2" class="step-btn text-xs px-2.5 py-1 rounded-lg border border-emerald-800 bg-emerald-950/70 text-emerald-200 transition">2단계</button>
            <button onclick="setAuxStep(3)" id="aux-3" class="step-btn text-xs px-2.5 py-1 rounded-lg border border-emerald-800 bg-emerald-950/70 text-emerald-200 transition">3단계</button>
            <button onclick="setAuxStep(4)" id="aux-4" class="step-btn text-xs px-2.5 py-1 rounded-lg border border-emerald-800 bg-emerald-950/70 text-emerald-200 transition">✨ 전체보기</button>
          </div>

          <!-- 소형 풀이 칠판 토글 버튼 -->
          <button onclick="toggleChalkboard()" id="btnChalkToggle" class="px-3 py-1.5 rounded-lg bg-gradient-to-r from-amber-400 to-amber-500 hover:from-amber-300 hover:to-amber-400 text-slate-950 text-xs font-black flex items-center gap-1.5 shadow-md transition">
            <i class="fa-solid fa-chalkboard-user"></i>
            <span id="txtChalkToggle">📗 소형 풀이 칠판 꺼내기</span>
          </button>
        </div>

        <!-- 현재 보조선 단계 한 줄 코칭 피드백 -->
        <div hidden id="auxHintBox" class="text-xs text-emerald-100 bg-[#040d09] px-3 py-2 rounded-lg border border-emerald-800/70 leading-snug"></div>

        <!-- 도형 직접 조작 슬라이더 & 스냅 프리셋 칩 -->
        <div class="flex flex-col sm:flex-row sm:items-center gap-2 pt-0.5">
          <div class="flex-1 flex items-center gap-2.5">
            <span id="sliderTitle" class="text-[11.5px] font-extrabold text-sky-300 shrink-0">도형 조작:</span>
            <input type="range" id="paramSlider" min="0" max="1" step="0.005" value="0.65" class="flex-1" oninput="onSliderInput(this.value)" />
            <span id="sliderReadout" class="text-xs font-mono font-black text-amber-300 w-16 text-right shrink-0"></span>
          </div>
          <div id="snapChipBox" class="flex items-center gap-1 shrink-0 overflow-x-auto"></div>
        </div>
      </div>
    </div>

    <!-- =================================================================== -->
    <!-- [우측/하단 컬럼] PC 상시 문제 카드 + 꺼내 보는 『소형 풀이 칠판』 -->
    <!-- =================================================================== -->
    <aside class="right-panel-col bg-[#06130e] p-3.5 space-y-3">

      <!-- PC 전용 상시 노출 문제 & 조건 카드 -->
      <section class="hidden lg:block bg-[#0b1f18] border border-emerald-800/80 rounded-xl p-3.5 shadow-md space-y-2">
        <div class="flex items-center justify-between gap-2">
          <span id="pcBadge" class="text-[11px] font-black px-2.5 py-0.5 rounded bg-amber-500/20 text-amber-300 border border-amber-400/50"></span>
          <span id="pcUnit" class="text-[11px] font-bold text-emerald-300"></span>
        </div>
        <h2 id="pcTitle" class="text-sm font-black text-white leading-snug"></h2>
        <div id="pcStatement" class="text-[13px] text-emerald-50/95 leading-relaxed bg-[#05100c] p-3 rounded-lg border border-emerald-800/70 space-y-1.5"></div>
      </section>

      <div id="scaffoldList" hidden></div>
      <!-- ================================================================= -->
      <!-- 📗 숨겨놨다가 꺼내 보는 『소형 비밀 칠판 (Mini Solution Chalkboard)』 -->
      <!-- ================================================================= -->
      <section id="miniChalkboard" class="hidden mini-chalkboard rounded-2xl p-3.5 space-y-3">
        <div class="flex flex-wrap items-center justify-between gap-2 pb-2 border-b border-emerald-700/70">
          <div class="flex items-center gap-1.5">
            <span class="w-6 h-6 rounded-md bg-amber-400 text-slate-950 font-black text-xs flex items-center justify-center">📗</span>
            <h3 class="text-xs sm:text-sm font-black text-amber-300">선생님의 소형 기하 풀이 칠판</h3>
          </div>

          <div class="flex items-center gap-1">
            <button onclick="setSolMode('geo')" id="tabGeo" class="px-2.5 py-1 rounded-md text-[11px] font-black bg-amber-400 text-slate-950 transition">⚡ 기하 보조선 풀이</button>
            <button onclick="setSolMode('alg')" id="tabAlg" class="px-2.5 py-1 rounded-md text-[11px] font-bold bg-emerald-950 text-emerald-200 border border-emerald-700/70 hover:bg-emerald-900 transition">🧮 일반 식 풀이 비교</button>
            <button onclick="toggleChalkboard(false)" class="ml-1 w-6 h-6 rounded-md bg-emerald-950 hover:bg-rose-900/80 text-emerald-200 text-xs flex items-center justify-center border border-emerald-700/60" title="칠판 닫기">
              <i class="fa-solid fa-xmark"></i>
            </button>
          </div>
        </div>

        <!-- 핵심 돌파구 배너 -->

    // =========================================================================
    // 2. 상태 관리 및 애니메이션 타이머
    // =========================================================================
    const state = {
      probIdx: 0,
      auxStep: 0,       // 0(꺼짐), 1, 2, 3, 4(전체보기)
      sliderT: 0.65,
      chalkOpen: false,
