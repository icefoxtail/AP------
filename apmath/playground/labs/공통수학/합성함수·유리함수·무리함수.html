      dragging: false,
      lastPt: { x: 0, y: 0 }
    };

    function curProb() {
      return PROBLEMS[state.probIdx];
    }

    // =========================================================================
    // 3. 정밀 기하 작도 부품 엔진 (Precision Geometry Primitives)
    // =========================================================================
    const canvas = document.getElementById('geoCanvas');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
      const rect = canvas.parentElement.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      canvas.width = rect.width * dpr;
      canvas.height = rect.height * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      drawScene();
    }
    window.addEventListener('resize', resizeCanvas);

    function toScr(mx, my, ox, oy, u) {
      return { x: ox + mx * u, y: oy - my * u };
    }

    // (1) 눈금이 포함된 정밀 좌표평면 작도기
    function drawAxesWithTicks(rect, ox, oy, u) {
      ctx.save();
      ctx.strokeStyle = 'rgba(52, 211, 153, 0.07)';
      ctx.lineWidth = 1;
      for (let x = ox % u; x < rect.width; x += u) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, rect.height); ctx.stroke();
      }
      for (let y = oy % u; y < rect.height; y += u) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(rect.width, y); ctx.stroke();
      }

      // x축, y축
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.36)';
      ctx.lineWidth = 1.8;
      ctx.beginPath();
      ctx.moveTo(0, oy); ctx.lineTo(rect.width, oy);
      ctx.moveTo(ox, 0); ctx.lineTo(ox, rect.height);
      ctx.stroke();

      // 정수 눈금 표시
      ctx.fillStyle = 'rgba(203, 213, 225, 0.55)';
      ctx.font = `600 ${innerWidth <= 1100 ? 12 : 10}px Pretendard, monospace`;
      ctx.textAlign = 'center';
      for (let i = -8; i <= 12; i++) {
        if (i === 0) continue;
        const sx = ox + i * u;
        if (sx > 20 && sx < rect.width - 20) {
          ctx.beginPath(); ctx.moveTo(sx, oy - 3); ctx.lineTo(sx, oy + 3); ctx.stroke();
          ctx.fillText(String(i), sx, oy + 14);
        }
        const sy = oy - i * u;
        if (sy > 20 && sy < rect.height - 20) {
          ctx.beginPath(); ctx.moveTo(ox - 3, sy); ctx.lineTo(ox + 3, sy); ctx.stroke();
          ctx.fillText(String(i), ox - 12, sy + 3);
        }
      }
      ctx.fillText('O', ox - 10, oy + 14);
      ctx.restore();
    }

    // (2) 직각 기호(∟) 정밀 작도기
    function drawRightAngle(vertex, p1, p2, size = 11, col = C.gold) {
      const v1x = p1.x - vertex.x, v1y = p1.y - vertex.y;
      const v2x = p2.x - vertex.x, v2y = p2.y - vertex.y;
      const len1 = Math.hypot(v1x, v1y) || 1;
      const len2 = Math.hypot(v2x, v2y) || 1;
      const u1x = (v1x / len1) * size, u1y = (v1y / len1) * size;
      const u2x = (v2x / len2) * size, u2y = (v2y / len2) * size;

      ctx.save();
      ctx.strokeStyle = col;
      ctx.lineWidth = 2.0;
      ctx.fillStyle = 'rgba(251, 191, 36, 0.18)';
      ctx.beginPath();
      ctx.moveTo(vertex.x, vertex.y);
      ctx.lineTo(vertex.x + u1x, vertex.y + u1y);
      ctx.lineTo(vertex.x + u1x + u2x, vertex.y + u1y + u2y);
      ctx.lineTo(vertex.x + u2x, vertex.y + u2y);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
      ctx.restore();
    }

    // (3) 양방향 화살표 치수선(Dimension Line) 작도기
    function drawDimension(p1, p2, offsetPx, label, col = C.gold) {
      const dx = p2.x - p1.x, dy = p2.y - p1.y;
      const len = Math.hypot(dx, dy);
      if (len < 12) return;
      const nx = (-dy / len) * offsetPx;
      const ny = (dx / len) * offsetPx;
      const a = { x: p1.x + nx, y: p1.y + ny };
      const b = { x: p2.x + nx, y: p2.y + ny };

      ctx.save();
      // 보조선 연장 다리
      ctx.strokeStyle = 'rgba(251, 191, 36, 0.4)';
      ctx.lineWidth = 1.2;
      ctx.setLineDash([3, 3]);
      ctx.beginPath();
      ctx.moveTo(p1.x, p1.y); ctx.lineTo(a.x, a.y);
      ctx.moveTo(p2.x, p2.y); ctx.lineTo(b.x, b.y);
      ctx.stroke();

      // 치수선 본체
      ctx.strokeStyle = col;
      ctx.lineWidth = 2.0;
      ctx.setLineDash([]);
      ctx.beginPath();
      ctx.moveTo(a.x, a.y);
      ctx.lineTo(b.x, b.y);
      ctx.stroke();

      // 양 끝 화살촉
      const ux = dx / len, uy = dy / len;
      const px = -uy, py = ux;
      const aw = 6, ah = 3.5;
      ctx.fillStyle = col;
      ctx.beginPath();
      ctx.moveTo(a.x, a.y);
      ctx.lineTo(a.x + ux * aw + px * ah, a.y + uy * aw + py * ah);
      ctx.lineTo(a.x + ux * aw - px * ah, a.y + uy * aw - py * ah);
      ctx.closePath();
      ctx.fill();

      ctx.beginPath();
      ctx.moveTo(b.x, b.y);
      ctx.lineTo(b.x - ux * aw + px * ah, b.y - uy * aw + py * ah);
      ctx.lineTo(b.x - ux * aw - px * ah, b.y - uy * aw - py * ah);
      ctx.closePath();
      ctx.fill();

      // 치수 라벨 캡슐
      const mx = (a.x + b.x) / 2;
      const my = (a.y + b.y) / 2;
      ctx.font = `800 ${innerWidth <= 1100 ? 13 : 11.5}px Pretendard, sans-serif`;
      const tw = ctx.measureText(label).width;
      ctx.fillStyle = 'rgba(5, 16, 12, 0.92)';
      ctx.strokeStyle = col;
      ctx.lineWidth = 1.3;
      ctx.beginPath();
      ctx.roundRect(mx - tw / 2 - 6, my - 9, tw + 12, 18, 5);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = col;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(label, mx, my);
      ctx.restore();
    }

    // (4) 기본 선/곡선/다각형/드래그 핸들 작도기
    function dLine(a, b, col = C.gold, w = 2.6, dash = [], glow = false) {
      ctx.save();
      ctx.strokeStyle = col;
      ctx.lineWidth = w;
      ctx.setLineDash(dash);
      ctx.lineCap = 'round';
      if (glow) { ctx.shadowColor = col; ctx.shadowBlur = 14; }
      ctx.beginPath();
      ctx.moveTo(a.x, a.y);
      ctx.lineTo(b.x, b.y);
      ctx.stroke();
      ctx.restore();
    }

    function dCurve(fn, xMin, xMax, ox, oy, u, col = C.cyan, w = 3.6, dash = [], glow = false) {
      ctx.save();
      ctx.strokeStyle = col;
      ctx.lineWidth = w;
      ctx.setLineDash(dash);
      if (glow) { ctx.shadowColor = col; ctx.shadowBlur = 14; }
      ctx.beginPath();
      const steps = 170;
      let started = false;
      for (let i = 0; i <= steps; i++) {
        const x = xMin + ((xMax - xMin) * i) / steps;
        const y = fn(x);
        if (y === null || isNaN(y) || Math.abs(y) > 22) {
          started = false;
          continue;
        }
        const s = toScr(x, y, ox, oy, u);
        if (!started) { ctx.moveTo(s.x, s.y); started = true; }
        else ctx.lineTo(s.x, s.y);
      }
      ctx.stroke();
      ctx.restore();
    }

    function dPoly(pts, fill = 'rgba(56,189,248,0.22)', stroke = C.cyan, w = 2.5, glow = false) {
      ctx.save();
      ctx.beginPath();
      pts.forEach((p, i) => (i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y)));
      ctx.closePath();
      if (fill) { ctx.fillStyle = fill; ctx.fill(); }
      if (stroke) {
        ctx.strokeStyle = stroke;
        ctx.lineWidth = w;
        if (glow) { ctx.shadowColor = stroke; ctx.shadowBlur = 15; }
        ctx.stroke();
      }
      ctx.restore();
    }

    let activeHandles = [];
    function dDot(p, label = '', col = C.white, off = { x: 8, y: -8 }, isHandle = false) {
      if (isHandle && state.auxStep > 0) activeHandles.push({x:p.x,y:p.y});
      if (state.auxStep === 0) return;
      if (state.auxStep < 3) label = '';
      ctx.save();
      if (isHandle) {
        ctx.beginPath();
        ctx.arc(p.x, p.y, 12, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(251, 191, 36, 0.22)';
        ctx.fill();
        ctx.strokeStyle = C.gold;
        ctx.lineWidth = 1.5;
        ctx.stroke();
      }
      ctx.beginPath();
      ctx.arc(p.x, p.y, isHandle ? 6.2 : 5.0, 0, Math.PI * 2);
      ctx.fillStyle = col;
      ctx.shadowColor = col;
      ctx.shadowBlur = 9;
      ctx.fill();
      ctx.lineWidth = 1.8;
      ctx.strokeStyle = '#ffffff';
      ctx.stroke();

      if (label) {
        ctx.font = `800 ${innerWidth <= 1100 ? 13 : 12}px Pretendard, sans-serif`;
        ctx.lineWidth = 3.5;
        ctx.strokeStyle = 'rgba(4, 14, 10, 0.94)';
        ctx.strokeText(label, p.x + off.x, p.y + off.y);
        ctx.fillStyle = col;
        ctx.fillText(label, p.x + off.x, p.y + off.y);
      }
      ctx.restore();
    }

    // =========================================================================
    // 4. 창작 심화 8선 고밀도 기하 렌더러
    // =========================================================================
    function setMetric(txt) {
      document.getElementById('liveMetricBar').textContent = state.auxStep >= 3 ? txt : (state.auxStep === 0 ? '문제를 먼저 읽고 보조선을 선택해 보세요.' : `보조선 ${state.auxStep}단계: 그림의 변화를 살펴보세요.`);
    }

    function plotIntersections(k, ox, oy, sc, rational) {
      let real=0, ghost=0; const eps=1e-9;
      const d=1-k;
      if(d>=-eps){const q=Math.sqrt(Math.max(0,d)); const us=q<eps?[1]:[1-q,1+q];
        for(const v of us){const x=1+v*v, y=x+k; const good=v>=-eps; if(good)real++;else ghost++;
          dDot(toScr(x,y,ox,oy,sc), `${good?'교점':'× 원래 식을 만족하지 않는 해'} (${x.toFixed(2)}, ${y.toFixed(2)})`,good?C.green:C.red,{x:8,y:good?-12:17});}}
      if(rational && k*k>=4-eps && k>0){const q=Math.sqrt(Math.max(0,k*k-4)); const zs=q<eps?[-k/2]:[(-k-q)/2,(-k+q)/2];
        for(const z of zs){if(z < -eps){const x=1+z,y=x+k;real++; dDot(toScr(x,y,ox,oy,sc),`교점 (${x.toFixed(2)}, ${y.toFixed(2)})`,C.green,{x:8,y:-12});}}}
      return {real,ghost};
    }

    function drawScene() {
      const rect = canvas.parentElement.getBoundingClientRect();
      if (!rect.width || !rect.height) return;
      ctx.clearRect(0, 0, rect.width, rect.height);
      activeHandles = [];

      const prob = curProb();
      const id = prob.id;
      const step = state.auxStep;
      const t = state.sliderT;
      const anim = state.animT;
      const baseU = Math.min(rect.width, rect.height) / 11.2;
      const u = baseU * state.scale;
      if (id.startsWith("bas-")) return drawBasicScene(rect, id, step, t, u);

      // -----------------------------------------------------------------------
      // 🔥 [심화 1] adv-1: 유리함수 대칭성(y=x)과 사다리꼴 P₁PQQ₁ 등적변형
      // -----------------------------------------------------------------------
      if (id === 'adv-1') {
        const ox = rect.width * 0.23 + state.panX;
        const oy = rect.height * 0.8 + state.panY;
        const sc = u * 0.9;
        drawAxesWithTicks(rect, ox, oy, sc);

        const k = 12;
        dLine(toScr(2, -1, ox, oy, sc), toScr(2, 9.5, ox, oy, sc), 'rgba(251,191,36,0.45)', 2, [5, 4]);
        dLine(toScr(-1, 2, ox, oy, sc), toScr(10.5, 2, ox, oy, sc), 'rgba(251,191,36,0.45)', 2, [5, 4]);
        dCurve((x) => k / (x - 2) + 2, 2.32, 10.2, ox, oy, sc, C.cyan, 3.8);

        const a = 3.4625 - t * 2.25; // t=0.65 -> a=2, b=6
        const b = k / a;
        const Cpt = toScr(2, 2, ox, oy, sc);
        const P = toScr(2 + a, 2 + b, ox, oy, sc);
        const Q = toScr(2 + b, 2 + a, ox, oy, sc);
        const P1 = toScr(2 + a, 2, ox, oy, sc);
        const Q1 = toScr(2 + b, 2, ox, oy, sc);
        const H = toScr(2 + a, 2 + a, ox, oy, sc);
        const M = toScr(2 + (a + b) / 2, 2 + (a + b) / 2, ox, oy, sc);

        // 기본 삼각형 CPQ
        dPoly([Cpt, P, Q], 'rgba(56, 189, 248, 0.20)', C.cyan, 2.8, step === 0);

        // [Step 1] 대칭축 y=x, 직각기호 M & H, 치수선 PQ = 4√2 & (b-a) = 4
        if (step === 1 || step === 4) {
          dLine(toScr(0, 0, ox, oy, sc), toScr(9.2, 9.2, ox, oy, sc), C.gold, 2.4, [6, 4], true);
          dPoly([P, H, Q], 'rgba(251, 191, 36, 0.22)', C.gold, 2.4, true);
          drawRightAngle(H, P, Q, 11, C.gold);
          drawRightAngle(M, Cpt, P, 10, C.gold);
          drawDimension(P, Q, -26, `PQ = ${(Math.SQRT2 * (b - a)).toFixed(1)} (4√2≈5.7)`, C.gold);
          drawDimension(H, Q, 22, `b - a = ${(b - a).toFixed(1)}`, C.gold);
        }

        // [Step 2] 넓이 불변(k/2) 직각삼각형 치환 & 사다리꼴 P₁PQQ₁ 등적변형!
        if (step >= 2) {
          dPoly([P1, P, Q, Q1], 'rgba(244, 114, 182, 0.28)', C.pink, 3.2, step === 2);
          drawRightAngle(P1, Cpt, P, 11, C.pink);
          drawRightAngle(Q1, Cpt, Q, 11, C.pink);

          // △CPP₁이 △CQQ₁로 미끄러져 이동하는 이동 효과!
          const mP = { x: P.x + (Q.x - P.x) * (step === 2 ? anim : 0), y: P.y + (Q.y - P.y) * (step === 2 ? anim : 0) };
          const mP1 = { x: P1.x + (Q1.x - P1.x) * (step === 2 ? anim : 0), y: P1.y };
          dPoly([Cpt, P, P1], 'rgba(52, 211, 153, 0.18)', C.green, 2.0, false);
          dPoly([Cpt, mP, mP1], 'rgba(52, 211, 153, 0.35)', C.green, 2.6, true);

          dDot(P1, 'P₁', C.pink, { x: -8, y: 18 });
          dDot(Q1, 'Q₁', C.pink, { x: -8, y: 18 });
          drawDimension(P1, Q1, 26, `사다리꼴 높이 (b-a) = ${(b - a).toFixed(1)}`, C.pink);
        }

        // [Step 3] 윗변 b, 아랫변 a 치수선 및 점근선 직사각형 넓이 k = 12
        if (step >= 3) {
          drawDimension(P1, P, -26, `윗변 b = ${b.toFixed(1)}`, C.green);
          drawDimension(Q1, Q, 26, `아랫변 a = ${a.toFixed(1)}`, C.green);
        }

        dDot(Cpt, 'C(2, 2)', C.gold, { x: -48, y: 16 });
        dDot(P, `P(${(2 + a).toFixed(1)}, ${(2 + b).toFixed(1)}) [드래그]`, C.white, { x: 12, y: -6 }, true);
        dDot(Q, `Q(${(2 + b).toFixed(1)}, ${(2 + a).toFixed(1)})`, C.white, { x: 10, y: -8 });

        setMetric(`현재 b-a = ${(b - a).toFixed(2)} | △CPQ 넓이 = 사다리꼴 넓이 = ${((a + b) * (b - a) * 0.5).toFixed(1)} (정답위치: b-a=4, 넓이=16 ➔ k=12)`);
        return;
      }

      // -----------------------------------------------------------------------
      // 🔥 [심화 2] adv-2: 무리함수와 역함수 사각형 OACB와 불변 길이 AB = 2√2
      // -----------------------------------------------------------------------
      if (id === 'adv-2') {
        const ox = rect.width * 0.24 + state.panX;
        const oy = rect.height * 0.78 + state.panY;
        const sc = u * 1.02;
        drawAxesWithTicks(rect, ox, oy, sc);

        const pVal = 0.3 + t * 2.0; // t=0.35 -> p=1.0
        const aVal = pVal; // 탐구용 가족: a=p. 원문 조건은 p=a=1에서만 성립
        const cVal = pVal + 2 + (aVal + Math.sqrt(aVal*aVal + 8*aVal))/2;
        const O = toScr(0, 0, ox, oy, sc);
        const A = toScr(pVal, pVal + 2, ox, oy, sc);
        const B = toScr(pVal + 2, pVal, ox, oy, sc);
        const M = toScr(pVal + 1, pVal + 1, ox, oy, sc);
        const Cpt = toScr(cVal, cVal, ox, oy, sc);

        // [Step 1] 평행선 레일 y = x + 2, y = x - 2 와 불변 길이 AB = 2√2 치수선
        if (step === 1 || step === 4) {
          dLine(toScr(-0.5, 1.5, ox, oy, sc), toScr(5.2, 7.2, ox, oy, sc), 'rgba(56,189,248,0.5)', 2.2, [5, 4], true);
          dLine(toScr(1.5, -0.5, ox, oy, sc), toScr(7.2, 5.2, ox, oy, sc), 'rgba(244,114,182,0.5)', 2.2, [5, 4], true);
          drawDimension(A, B, -26, 'AB = 2√2 (p에 무관하게 항상 일정!)', C.gold);
        }

        // [Step 2] 수직이등분선 y=x, 직각 기호 M, △OAB(넓이 4) & △ABC(넓이 6) 분할
        if (step >= 2) {
          dPoly([O, A, B], 'rgba(56, 189, 248, 0.26)', C.cyan, 2.5, step === 2);
          dPoly([A, Cpt, B], 'rgba(244, 114, 182, 0.26)', C.pink, 2.5, step === 2);
          dLine(toScr(-0.5, -0.5, ox, oy, sc), toScr(6.6, 6.6, ox, oy, sc), C.gold, 2.5, [6, 4], true);
          drawRightAngle(M, O, A, 11, C.gold);
          drawRightAngle(M, Cpt, B, 11, C.gold);
          dDot(M, `M(${(pVal + 1).toFixed(1)}, ${(pVal + 1).toFixed(1)})`, C.gold, { x: 10, y: 15 });
        } else {
          dPoly([O, A, Cpt, B], 'rgba(52, 211, 153, 0.18)', C.green, 2.4);
        }

        // [Step 3] 1:1:√2 계단 삼각형과 치수선 OM = 2√2, MC = 3√2
        if (step >= 3) {
          const Mx = toScr(pVal + 1, 0, ox, oy, sc);
          const Cx = toScr(cVal, pVal + 1, ox, oy, sc);
          dPoly([O, Mx, M], 'rgba(251, 191, 36, 0.22)', C.gold, 2.2, true);
          dPoly([M, Cx, Cpt], 'rgba(52, 211, 153, 0.22)', C.green, 2.2, true);
          drawRightAngle(Mx, O, M, 10, C.gold);
          drawRightAngle(Cx, M, Cpt, 10, C.green);
          drawDimension(O, M, 24, `OM = √2(${(pVal + 1).toFixed(1)})`, C.gold);
          drawDimension(M, Cpt, 24, `MC = ${((cVal-pVal-1)*Math.SQRT2).toFixed(2)}`, C.green);
        }

        dCurve((x) => Math.sqrt(Math.max(0, aVal * (x - pVal))) + pVal + 2, pVal, 6.5, ox, oy, sc, C.cyan, 3.8);
        dCurve((x) => (x - pVal - 2) ** 2 / aVal + pVal, pVal + 2, 6.5, ox, oy, sc, C.pink, 3.8);
        dLine(A, B, C.gold, 4.0, [], step === 1);

        dDot(O, 'O(0,0)', C.white, { x: -45, y: 16 });
        dDot(A, `A(${pVal.toFixed(1)}, ${(pVal + 2).toFixed(1)}) [드래그]`, C.cyan, { x: -110, y: -10 }, true);
        dDot(B, `B(${(pVal + 2).toFixed(1)}, ${pVal.toFixed(1)})`, C.pink, { x: 10, y: 15 });
        dDot(Cpt, `C(${cVal.toFixed(1)}, ${cVal.toFixed(1)})`, C.gold, { x: 10, y: -8 });

        setMetric(`현재 p = ${pVal.toFixed(2)} | AB = 2√2 (불변!) | 사각형 넓이 = ${(2 * cVal).toFixed(2)} | △ABC = ${(2*(cVal-pVal-1)).toFixed(2)} (탐구: a=p; 원문 조건은 p=1)`);
        return;
      }

      // -----------------------------------------------------------------------
      // 🔥 [심화 3] adv-3: 유리·무리 결합 함수와 직선 y = x + k 교점이 없는 범위 살펴보기
      // -----------------------------------------------------------------------
      if (id === 'adv-3') {
        const ox = rect.width * 0.44 + state.panX;
        const oy = rect.height * 0.62 + state.panY;
        const sc = u * 1.02;
        drawAxesWithTicks(rect, ox, oy, sc);
        if (step === 0) { setMetric('조건을 읽고 1단계부터 확인하세요.'); return; }

        dLine(toScr(1, -3, ox, oy, sc), toScr(1, 6, ox, oy, sc), 'rgba(255,255,255,0.25)', 1.6, [4, 4]);
        dLine(toScr(-5, 1, ox, oy, sc), toScr(7, 1, ox, oy, sc), 'rgba(255,255,255,0.25)', 1.6, [4, 4]);

        const S = toScr(1, 1, ox, oy, sc);
        const P = toScr(2, 3, ox, oy, sc);
        const Q = toScr(0, 2, ox, oy, sc);
        const H = toScr(2, 2, ox, oy, sc);

        // [Step 1] 교점이 없는 범위 1 < k < 2 해칭 영역과 두 접선 y=x+1, y=x+2
        if (step >= 1) {
          dPoly(
            [toScr(-4, -3, ox, oy, sc), toScr(5, 6, ox, oy, sc), toScr(5, 7, ox, oy, sc), toScr(-4, -2, ox, oy, sc)],
            'rgba(244, 63, 94, 0.16)',
            null,
            0
          );
          dLine(toScr(-4, -3, ox, oy, sc), toScr(5, 6, ox, oy, sc), C.gold, 2.2, [5, 4], step === 1);
          dLine(toScr(-4, -2, ox, oy, sc), toScr(5, 7, ox, oy, sc), C.gold, 2.2, [5, 4], step === 1);
        }

        // [Step 2] 점근선 대칭축 y = -x + 2 (직각 기호) & 직각삼각형 PQH (PQ² = 2² + 1² = 5)
        if (step === 2 || step === 4) {
          dLine(toScr(-3, 5, ox, oy, sc), toScr(4, -2, ox, oy, sc), C.pink, 2.2, [4, 4], true);
          drawRightAngle(Q, S, toScr(1, 3, ox, oy, sc), 10, C.pink);
          dPoly([Q, H, P], 'rgba(52, 211, 153, 0.24)', C.green, 2.6, true);
          drawRightAngle(H, Q, P, 10, C.green);
          drawDimension(Q, P, -22, 'PQ = √5 (PQ² = 5)', C.green);
        }

        // 원래 식을 만족하지 않는 해을 확인할 수 있도록 보조 곡선을 항상 표시
        if (true) {
          dCurve((x) => -2 * Math.sqrt(Math.max(0, x - 1)) + 1, 1, 6.5, ox, oy, sc, C.red, 2.6, [5, 4], true);
          dLine(toScr(-4, -4, ox, oy, sc), toScr(6, 6, ox, oy, sc), C.cyan, 2.2, [5, 4], true);
        }

        dCurve((x) => -1 / (x - 1) + 1, -4.8, 0.78, ox, oy, sc, C.pink, 3.8);
        dCurve((x) => 2 * Math.sqrt(Math.max(0, x - 1)) + 1, 1, 6.5, ox, oy, sc, C.cyan, 4.0);

        const k = -1.0 + t * 4.0;
        const counts = plotIntersections(k, ox, oy, sc, true);
        const cnt = counts.real;
        const lineCol = cnt === 0 ? C.red : cnt === 2 ? C.green : C.gold;
        dLine(toScr(-4.5, -4.5 + k, ox, oy, sc), toScr(5.8, 5.8 + k, ox, oy, sc), lineCol, 3.8, [], true);
        dDot(toScr(0, k, ox, oy, sc), `y절편 k=${k.toFixed(2)} [드래그]`, lineCol, { x: -115, y: -8 }, true);

        dDot(S, '시작점 S(1,1) [k=0]', C.white, { x: 10, y: 15 });
        dDot(P, '무리 접점 P(2,3) [k=1]', C.cyan, { x: 10, y: -8 });
        dDot(Q, '유리 접점 Q(0,2) [k=2]', C.pink, { x: -135, y: -8 });

        setMetric(`직선 y = x + (${k.toFixed(2)}) ➔ 실제 교점 개수 g(k) = ${cnt}개! (1<k<2일 때 0개, 0≤k<1일 때 2개)`);
        return;
      }

      // -----------------------------------------------------------------------
      // 🔥 [심화 4] adv-4: 감소하는 꺾인 함수와 역함수의 3교점 대칭삼각형
      // -----------------------------------------------------------------------
      if (id === 'adv-4') {
        const ox = rect.width * 0.48 + state.panX;
        const oy = rect.height * 0.52 + state.panY;
        const sc = u * 0.72;
        drawAxesWithTicks(rect, ox, oy, sc);

        const fPts = [toScr(-6.5, 4.3, ox, oy, sc), toScr(0, 3, ox, oy, sc), toScr(4.5, -6, ox, oy, sc)];
        const invPts = [toScr(4.3, -6.5, ox, oy, sc), toScr(3, 0, ox, oy, sc), toScr(-6, 4.5, ox, oy, sc)];

        const A = toScr(-5, 4, ox, oy, sc);
        const B = toScr(1, 1, ox, oy, sc);
        const Cpt = toScr(4, -5, ox, oy, sc);
        const M = toScr(-0.5, -0.5, ox, oy, sc);

        if (step >= 1) {
          dLine(toScr(-6, -6, ox, oy, sc), toScr(5.5, 5.5, ox, oy, sc), C.gold, 2.2, [6, 4], step === 1);
        }
        if (step >= 2) {
          dPoly([A, B, Cpt], 'rgba(251, 191, 36, 0.22)', C.gold, 2.8, step === 2);
          drawDimension(A, Cpt, -28, '밑변 AC = 9√2', C.gold);
        }
        if (step >= 3) {
          dLine(B, M, C.green, 3.4, [], true);
          drawRightAngle(M, B, A, 12, C.green);
          dDot(M, 'M(-½, -½)', C.green, { x: -85, y: 16 });
          drawDimension(M, B, 24, '높이 BM = (3/2)√2', C.green);
        }

        dLine(fPts[0], fPts[1], C.cyan, 3.8);
        dLine(fPts[1], fPts[2], C.cyan, 3.8);

        if (t > 0.03) {
          const p0 = { x: fPts[0].x + (invPts[0].x - fPts[0].x) * t, y: fPts[0].y + (invPts[0].y - fPts[0].y) * t };
          const p1 = { x: fPts[1].x + (invPts[1].x - fPts[1].x) * t, y: fPts[1].y + (invPts[1].y - fPts[1].y) * t };
          const p2 = { x: fPts[2].x + (invPts[2].x - fPts[2].x) * t, y: fPts[2].y + (invPts[2].y - fPts[2].y) * t };
          dLine(p0, p1, C.pink, 3.5, [5, 3]);
          dLine(p1, p2, C.pink, 3.5, [5, 3]);
        }

        dDot(B, '교점 B(1, 1) [y=x 위]', C.gold, { x: 10, y: -8 });
        dDot(A, '바깥 교점 A(-5, 4)', C.red, { x: 10, y: -8 }, true);
        dDot(Cpt, '바깥 교점 C(4, -5)', C.red, { x: -115, y: 16 });

        setMetric('감소함수와 역함수 3교점: 밑변 AC = 9√2, 수직 높이 BM = (3/2)√2 ➔ 넓이 S = 27/2 (2S = 27)');
        return;
      }

      // -----------------------------------------------------------------------
      // 🔥 [심화 5] adv-5: 유리함수와 원 사이의 최단거리 (기울기 +1 대칭축 정렬)
      // -----------------------------------------------------------------------
      if (id === 'adv-5') {
        const ox = rect.width * 0.36 + state.panX;
        const oy = rect.height * 0.68 + state.panY;
        const sc = u * 0.94;
        drawAxesWithTicks(rect, ox, oy, sc);

        dLine(toScr(1, -2, ox, oy, sc), toScr(1, 7, ox, oy, sc), 'rgba(251,191,36,0.4)', 1.8, [5, 4]);
        dLine(toScr(-3, 2, ox, oy, sc), toScr(8, 2, ox, oy, sc), 'rgba(251,191,36,0.4)', 1.8, [5, 4]);

        const centerA = toScr(-1, 0, ox, oy, sc);
        ctx.save();
        ctx.beginPath();
        ctx.arc(centerA.x, centerA.y, Math.SQRT2 * sc, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(244, 114, 182, 0.20)';
        ctx.fill();
        ctx.strokeStyle = C.pink;
        ctx.lineWidth = 3;
        ctx.stroke();
        ctx.restore();

        dCurve((x) => 4 / (x - 1) + 2, 1.45, 8.2, ox, oy, sc, C.cyan, 3.8);

        if (step >= 1) {
          dLine(toScr(-2.5, -1.5, ox, oy, sc), toScr(6, 7, ox, oy, sc), C.gold, 2.5, [6, 4], true);
        }
        if (step >= 2) {
          dPoly(
            [toScr(1, 2, ox, oy, sc), toScr(3, 2, ox, oy, sc), toScr(3, 4, ox, oy, sc), toScr(1, 4, ox, oy, sc)],
            'rgba(52, 211, 153, 0.24)',
            C.green,
            2.4,
            step === 2
          );
          drawRightAngle(toScr(3, 2, ox, oy, sc), toScr(1, 2, ox, oy, sc), toScr(3, 4, ox, oy, sc), 10, C.green);
        }

        const px = 1.605 + t * 3.1; // t=0.45 -> px=3 exactly
        const py = 4 / (px - 1) + 2;
        const P = toScr(px, py, ox, oy, sc);
        const distAP = Math.hypot(px + 1, py);
        const qx = -1 + ((px + 1) / distAP) * Math.SQRT2;
        const qy = (py / distAP) * Math.SQRT2;
        const Q = toScr(qx, qy, ox, oy, sc);

        dLine(P, Q, C.green, 3.8, [], true);
        if (step >= 3) {
          drawDimension(Q, P, -24, `현재 PQ = ${(distAP - Math.SQRT2).toFixed(2)} (최솟값 3√2)`, C.green);
        }

        dDot(centerA, '원 중심 A(-1,0)', C.pink, { x: -95, y: 18 });
        dDot(toScr(1, 2, ox, oy, sc), 'C\'(1,2)', C.gold, { x: -48, y: -8 });
        dDot(Q, 'Q', C.pink, { x: 8, y: 14 });
        dDot(P, `P(${px.toFixed(1)}, ${py.toFixed(1)}) [드래그]`, C.white, { x: 10, y: -8 }, true);

        setMetric(`현재 PQ 길이 = ${(distAP - Math.SQRT2).toFixed(2)} | P(3,4)일 때 최소 m = 3√2 ≈ 4.24 ➔ 정답 = 10`);
        return;
      }

      // -----------------------------------------------------------------------
      // 🔥 [심화 6] adv-6: 절댓값 유리함수의 절댓값 그래프의 점근선과 현의 길이
      // -----------------------------------------------------------------------
      if (id === 'adv-6') {
        const ox = rect.width * 0.32 + state.panX;
        const oy = rect.height * 0.65 + state.panY;
        const sc = u * 0.88;
        drawAxesWithTicks(rect, ox, oy, sc);

        dLine(toScr(3, -3, ox, oy, sc), toScr(3, 6.5, ox, oy, sc), 'rgba(251,191,36,0.45)', 2, [5, 4]);

        if (step >= 1) {
          dLine(toScr(-2, -2, ox, oy, sc), toScr(9.5, -2, ox, oy, sc), 'rgba(148,163,184,0.35)', 1.8, [4, 4]);
          dLine(toScr(-2, 2, ox, oy, sc), toScr(9.5, 2, ox, oy, sc), C.red, 3.0, [6, 4], true);
        }

        const colFold = step >= 2 ? C.pink : C.cyan;
        dCurve((x) => Math.abs(4 / (x - 3) - 2), -2, 2.3, ox, oy, sc, colFold, 3.6);
        dCurve((x) => 4 / (x - 3) - 2, 3.6, 5.0, ox, oy, sc, C.cyan, 3.8);
        dCurve((x) => -(4 / (x - 3) - 2), 5.0, 9.5, ox, oy, sc, colFold, 3.8);

        const yT = t <= 0.4 ? 0.2 + 2 * t : t <= 0.75 ? 1 + (t - 0.4) / 0.35 : 2 + 0.5 * (t - 0.75) / 0.17;
        dLine(toScr(-2, yT, ox, oy, sc), toScr(9.5, yT, ox, oy, sc), C.gold, 3.2, [], true);

        if (Math.abs(yT - 2) > 1e-8) {
          const x1 = yT < 2 ? 3 + 4 / (2 + yT) : 3 + 4 / (2 - yT);
          const x2 = yT < 2 ? 3 + 4 / (2 - yT) : 3 + 4 / (2 + yT);
          const A = toScr(x1, yT, ox, oy, sc);
          const B = toScr(x2, yT, ox, oy, sc);
          dLine(A, B, C.green, 4.2, [], step >= 2);
          if (step >= 2) {
            drawDimension(A, B, -22, `AB = ${Math.abs(x2 - x1).toFixed(2)} (t=1일 때 8/3≈2.67)`, C.green);
          }
          dDot(A, 'A', C.cyan, { x: -14, y: -10 });
          dDot(B, 'B [드래그]', C.pink, { x: 8, y: -10 }, true);
        } else { dDot(toScr(4, 2, ox, oy, sc), '유일한 교점 (4,2)', C.green, { x: 9, y: -12 }); }

        dDot(toScr(5, 0, ox, oy, sc), '(5, 0)', C.white, { x: -12, y: 18 });
        setMetric(`가로선 y = ${yT.toFixed(2)} | 절댓값 그래프의 점근선 k = 2 (교점 1개), t = 1 일 때 AB = 8/3 ➔ k+t = 3`);
        return;
      }

      // -----------------------------------------------------------------------
      // 🔥 [심화 7] adv-7: 무리함수와 평행이동된 역함수 곡선의 활꼴 합체 퍼즐
      // -----------------------------------------------------------------------
      if (id === 'adv-7') {
        const ox=rect.width*.20+state.panX, oy=rect.height*.78+state.panY, sc=u*.94;
        drawAxesWithTicks(rect,ox,oy,sc);
        const shift=4*t;
        const pt=(x,y)=>toScr(x,y,ox,oy,sc);
        if (step>=1) dPoly([pt(0,0),pt(shift,0),pt(shift+4,4),pt(4,4)],'rgba(251,191,36,.15)',C.gold,2);
        ctx.save();ctx.beginPath();
        for(let i=0;i<=80;i++){let y=4*i/80, q=pt(y*y/4,y); if(i===0)ctx.moveTo(q.x,q.y);else ctx.lineTo(q.x,q.y)}
        for(let i=80;i>=0;i--){let y=4*i/80,q=pt(y*y/4+shift,y);ctx.lineTo(q.x,q.y)}
        ctx.closePath();ctx.fillStyle='rgba(52,211,153,.24)';ctx.fill();ctx.restore();
        dCurve(x=>2*Math.sqrt(x),0,4,ox,oy,sc,C.cyan,4);
        dCurve(x=>2*Math.sqrt(x-shift),shift,shift+4,ox,oy,sc,C.pink,4);
        dLine(pt(0,0),pt(shift,0),C.white,2);dLine(pt(4,4),pt(4+shift,4),C.white,2);
        if(step>=2){for(let y of [1,2,3]) dLine(pt(y*y/4,y),pt(y*y/4+shift,y),C.gold,2,[5,3]);}
        dDot(pt(0,0),'(0,0)',C.white,{x:-38,y:16}); dDot(pt(4,4),'(4,4)',C.cyan,{x:-35,y:-10});
        setMetric(`이동 거리 ${shift.toFixed(2)} | 같은 높이의 가로 길이 ${shift.toFixed(2)} | 넓이 ${(4*shift).toFixed(2)} (문제 조건: 이동 거리 4)`);
        return;
      }

      // -----------------------------------------------------------------------
      // 🔥 [심화 8] adv-8: 두 직선으로 이루어진 함수에서 f(f(x))=f(x) vs f(f(x))=x 비교
      // -----------------------------------------------------------------------
      const ox = rect.width * 0.3 + state.panX;
      const oy = rect.height * 0.78 + state.panY;
      const sc = u * 1.15;
      drawAxesWithTicks(rect, ox, oy, sc);

      const p0 = toScr(0, 0, ox, oy, sc);
      const p2 = toScr(2, 4, ox, oy, sc);
      const p4 = toScr(4, 0, ox, oy, sc);
      dLine(p0, p2, C.cyan, 4.0);
      dLine(p2, p4, C.cyan, 4.0);
      dLine(toScr(-0.4, -0.4, ox, oy, sc), toScr(4.4, 4.4, ox, oy, sc), 'rgba(255,255,255,0.45)', 2.2, [5, 4]);

      if (step >= 1) {
        dDot(toScr(0, 0, ox, oy, sc), 't₁=0', C.gold, { x: -35, y: 16 });
        dDot(toScr(8 / 3, 8 / 3, ox, oy, sc), 't₂ = 8/3', C.gold, { x: 10, y: -8 });
      }
      if (step >= 2) {
        dLine(toScr(2, -0.4, ox, oy, sc), toScr(2, 4.4, ox, oy, sc), 'rgba(251,191,36,0.55)', 2, [4, 4]);
        dLine(toScr(-0.3, 8 / 3, ox, oy, sc), toScr(4.3, 8 / 3, ox, oy, sc), C.gold, 3.0, [], true);
        const r1 = toScr(4 / 3, 8 / 3, ox, oy, sc);
        const r2 = toScr(8 / 3, 8 / 3, ox, oy, sc);
        dDot(r1, 'x₁=4/3', C.gold, { x: -48, y: -10 });
        drawDimension(r1, r2, -22, '대칭축 x=2 대칭 ➔ 두 근의 합 = 4', C.gold);
      }
      if (step >= 3 || t > 0.75) {
        const q0 = toScr(0, 0, ox, oy, sc);
        const q1 = toScr(1, 4 * anim, ox, oy, sc);
        const q2 = toScr(2, 0, ox, oy, sc);
        const q3 = toScr(3, 4 * anim, ox, oy, sc);
        const q4 = toScr(4, 0, ox, oy, sc);
        dLine(q0, q1, C.pink, 3.4, [5, 3], true);
        dLine(q1, q2, C.pink, 3.4, [5, 3], true);
        dLine(q2, q3, C.pink, 3.4, [5, 3], true);
        dLine(q3, q4, C.pink, 3.4, [5, 3], true);
        [0, 8 / 5, 8 / 3, 16 / 5].forEach((rx, idx) => {
          dDot(toScr(rx, rx, ox, oy, sc), `교점${idx + 1}`, C.green, { x: 8, y: 14 });
        });
      }

      dDot(p2, '꼭대기 (2, 4)', C.cyan, { x: -32, y: -12 });
      setMetric('f(f(x))=f(x)의 모든 실근의 합 S₁ = 4 + 4 = 8 | f(f(x))=x의 실근 개수 q = 4개 ➔ S₁+q = 12');
    }

    // =========================================================================
    // 5. UI 컨트롤러 및 애니메이션 루프
    // =========================================================================
    let problemListOpen = false;
    function renderTabs() {
      const bar = document.getElementById('probTabBar');
      const advanced = state.probIdx < 8;
      const indices = advanced ? Array.from({length:8}, (_,i)=>i) : Array.from({length:16}, (_,i)=>i+8);
      bar.innerHTML = `<div class="problem-nav"><div class="problem-groups" role="group" aria-label="문항 모음 선택"><button type="button" onclick="selectProblemGroup(0)" class="group-button ${advanced?'selected':''}" aria-pressed="${advanced}">심화 8선</button><button type="button" onclick="selectProblemGroup(8)" class="group-button ${!advanced?'selected':''}" aria-pressed="${!advanced}">기본 16선</button></div><div class="problem-picker"><button type="button" class="problem-list-toggle" aria-expanded="${problemListOpen}" aria-controls="problemList" onclick="problemListOpen=!problemListOpen;renderTabs()"><span class="picker-label">현재 문제</span><strong>${PROBLEMS[state.probIdx].tabLabel}</strong><span class="picker-action">${problemListOpen?'목록 닫기 ▲':'문제 주제 보고 고르기 ▼'}</span></button><div id="problemList" class="problem-list" ${problemListOpen?'':'hidden'} role="group" aria-label="${advanced?'심화':'기본'} 문제 목록">${indices.map(idx => `<button type="button" onclick="problemListOpen=false;selectProb(${idx})" class="prob-tab problem-item ${idx===state.probIdx?'active':''}" ${idx===state.probIdx?'aria-current="true"':''}>${PROBLEMS[idx].tabLabel}</button>`).join('')}</div></div></div>`;
    }
    function selectProblemGroup(idx) { problemListOpen = true; selectProb(idx); }

    function initialSlider(p) { return ({'adv-1':0.65,'adv-2':0.35,'adv-5':0.45,'bas-4':0,'bas-7':0,'bas-10':0.35})[p.id] ?? p.defaultT; }

    function selectProb(idx) {
      state.probIdx = idx; boardPage=-1; state.solMode='geo';
      if (state.chalkOpen) toggleChalkboard(false);
      const p = curProb();
      state.sliderT = initialSlider(p);
      state.auxStep = 0;
      state.animT = 0;
      state.scale = 1.0;
      state.panX = 0;
      state.panY = 0;
      renderTabs();
      syncAllUI();
    }

    function stepProblem(dir) {
      const next = (state.probIdx + dir + PROBLEMS.length) % PROBLEMS.length;
      selectProb(next);
    }

    function setAuxStep(step) {
      state.auxStep = step;
      boardPage = step >= 1 && step <= 3 ? step - 1 : (step === 4 ? 2 : -1);
      state.solMode = 'geo';
      state.animT = 0; // 단계 전환 시 이동 애니메이션 시작!
      syncAllUI();
    }

    function onSliderInput(val) {
      let num = parseFloat(val);
      const p = curProb();
      for (const s of p.snaps) {
        if (Math.abs(num - s.t) < 0.025) {
          num = s.t;
          break;
        }
      }
      state.sliderT = num;
      document.getElementById('paramSlider').value = num;
      syncSliderReadout();
      drawScene();
    }

    function setSnapVal(t) {
      state.sliderT = t;
      document.getElementById('paramSlider').value = t;
      syncAllUI();
    }

    function syncSliderReadout() {
      const p = curProb();
      const pct = `${Math.round(state.sliderT * 100)}%`;
      document.getElementById('sliderReadout').textContent = pct;
      const matched = p.snaps.find((s) => Math.abs(s.t - state.sliderT) < 0.03);
      document.getElementById('mobSnapTag').textContent = state.auxStep >= 3 && matched ? matched.label : `조작 ${pct}`;
    }

    function toggleChalkboard(force) {
      state.chalkOpen = typeof force === 'boolean' ? force : !state.chalkOpen;
      const board = document.getElementById('miniChalkboard');
      const txt = document.getElementById('txtChalkToggle');
      board.classList.toggle('hidden', !state.chalkOpen);
      document.body.classList.toggle('mobile-chalk-open', state.chalkOpen);
      txt.textContent = state.chalkOpen ? '📕 소형 풀이 칠판 접기' : '📗 소형 풀이 칠판 꺼내기';
      if (state.chalkOpen && boardPage < 0) setAuxStep(1);

      requestAnimationFrame(() => {
        resizeCanvas();

      });
    }

    function setSolMode(mode) {
      if (mode === 'alg' && state.auxStep < 3) return;
      state.solMode = mode; boardPage = mode === 'alg' ? 3 : (state.auxStep ? Math.min(state.auxStep-1,2) : -1);
      const tabGeo = document.getElementById('tabGeo');
      const tabAlg = document.getElementById('tabAlg');
      const boxGeo = document.getElementById('chalkStepsContainer');
      const boxAlg = document.getElementById('chalkAlgContainer');

      if (mode === 'geo') {
        tabGeo.className = 'px-2.5 py-1 rounded-md text-[11px] font-black bg-amber-400 text-slate-950 transition';
        tabAlg.className = 'px-2.5 py-1 rounded-md text-[11px] font-bold bg-emerald-950 text-emerald-200 border border-emerald-700/70 hover:bg-emerald-900 transition';
        boxGeo.classList.remove('hidden');
        boxAlg.classList.add('hidden');
      } else {
        tabAlg.className = 'px-2.5 py-1 rounded-md text-[11px] font-black bg-rose-400 text-slate-950 transition';
        tabGeo.className = 'px-2.5 py-1 rounded-md text-[11px] font-bold bg-emerald-950 text-emerald-200 border border-emerald-700/70 hover:bg-emerald-900 transition';
        boxAlg.classList.remove('hidden');
        boxGeo.classList.add('hidden');
      }
      refreshBoardTabs();
    }
    function drawBasicScene(rect, id, step, t, u) {
      const anim = state.animT;
      // 🌱 [기본 1] bas-1: 일대일대응 직사각형 대각선 원리
      // -----------------------------------------------------------------------
      if (id === 'bas-1') {
        const ox = rect.width * 0.28 + state.panX;
        const oy = rect.height * 0.84 + state.panY;
        const sc = u * 0.78;
        drawAxesWithTicks(rect, ox, oy, sc);

        const p12 = toScr(1, 2, ox, oy, sc);
        const p42 = toScr(4, 2, ox, oy, sc);
        const p48 = toScr(4, 8, ox, oy, sc);
        const p18 = toScr(1, 8, ox, oy, sc);

        dPoly([p12, p42, p48, p18], 'rgba(255, 255, 255, 0.06)', 'rgba(251, 191, 36, 0.55)', 2.2);
        if (step >= 1) {
          drawRightAngle(p42, p12, p48, 11, C.gold);
          drawDimension(p12, p42, 24, '정의역 폭 Δx = 3', C.gold);
          drawDimension(p42, p48, -28, '공역 폭 Δy = 6', C.gold);
        }

        if (step === 0 && Math.abs(t - 0.5) < 0.15) {
          // 반례: 공역이 남는 직선
          const p45 = toScr(4, 5, ox, oy, sc);
          dLine(p12, p45, C.red, 3.8, [], true);
          drawDimension(p45, p48, 26, '남는 공역 (일대일대응 실패!)', C.red);
          dDot(p45, '(4, 5) [치역 부족!]', C.red, { x: 10, y: 4 }, true);
        } else {
          if ((step === 0 && t < 0.5) || step >= 2) {
            dLine(p12, p48, C.cyan, 4.0, [], true);
          }
          if ((step === 0 && t > 0.5) || step >= 3) {
            dLine(p18, p42, C.pink, 4.0, [], true);
          }
        }

        dDot(p12, '(1, 2)', C.cyan, { x: -42, y: 16 });
        dDot(p48, '(4, 8) [a=2]', C.cyan, { x: 10, y: -8 }, t < 0.4);
        dDot(p18, '(1, 8) [a=-2]', C.pink, { x: -85, y: -8 }, t > 0.6);
        dDot(p42, '(4, 2)', C.pink, { x: 10, y: 16 });

        setMetric('일대일대응 조건: 치역 = 공역 [2, 8]을 꽉 채우려면 대각선 양 끝 꼭짓점을 지나야 합니다!');
        return;
      }

      // -----------------------------------------------------------------------
      // 🌱 [기본 2] bas-2: 구간별 꺾인 직선의 일대일대응 조건 (m₁m₂ > 0)
      // -----------------------------------------------------------------------
      if (id === 'bas-2') {
        const ox = rect.width * 0.46 + state.panX;
        const oy = rect.height * 0.6 + state.panY;
        const sc = u * 0.95;
        drawAxesWithTicks(rect, ox, oy, sc);

        const m2 = -1.5 + t * 3.5; // t=0.75 -> m2 = +1.125
        const P0 = toScr(0, 1, ox, oy, sc);
        const PLeft = toScr(-3.5, -6, ox, oy, sc);
        const PRight = toScr(3.8, 1 + 3.8 * m2, ox, oy, sc);

        dLine(PLeft, P0, C.cyan, 3.8);
        dLine(P0, PRight, m2 > 0 ? C.green : C.red, 4.0, [], true);

        if (step >= 2) {
          const yTest = m2 < 0 ? -1.5 : 2.5;
          dLine(toScr(-4.5, yTest, ox, oy, sc), toScr(4.5, yTest, ox, oy, sc), C.gold, 2.2, [5, 4], true);
          if (m2 < 0) {
            dDot(toScr((yTest - 1) / 2, yTest, ox, oy, sc), '교점1', C.red, { x: -45, y: -8 });
            dDot(toScr((yTest - 1) / m2, yTest, ox, oy, sc), '교점2 (일대일 위반!)', C.red, { x: 10, y: -8 });
          }
        }

        dDot(P0, '연결점 (0, 1)', C.gold, { x: -85, y: -8 });
        dDot(toScr(2.5, 1 + 2.5 * m2, ox, oy, sc), `기울기 m₂=${m2.toFixed(1)} [드래그]`, m2 > 0 ? C.green : C.red, { x: 10, y: -8 }, true);

        setMetric(`왼쪽 기울기 m₁ = +2 | 오른쪽 기울기 m₂ = ${m2.toFixed(2)} ➔ ${m2 > 0 ? '⭕ m₁m₂ > 0 (일대일대응 성공!)' : '❌ m₁m₂ ≤ 0 (역함수 존재 불가!)'}`);
        return;
      }

      // -----------------------------------------------------------------------
      // 🌱 [기본 3 & 4 & 5] bas-3, bas-4, bas-5: 산봉우리 합성 수평선 · 작도 · 계단식 그림
      // -----------------------------------------------------------------------
      if (id === 'bas-3' || id === 'bas-4' || id === 'bas-5') {
        const ox = rect.width * 0.3 + state.panX;
        const oy = rect.height * 0.78 + state.panY;
        const sc = u * 1.15;
        drawAxesWithTicks(rect, ox, oy, sc);

        const p0 = toScr(0, 0, ox, oy, sc);
        const p2 = toScr(2, 4, ox, oy, sc);
        const p4 = toScr(4, 0, ox, oy, sc);

        if (id === 'bas-5') {
          // 계단식 그림: y = sqrt(3.2x) 스타일 증가 곡선과 y = x
          dLine(toScr(-0.4, -0.4, ox, oy, sc), toScr(4.5, 4.5, ox, oy, sc), C.gold, 2.4, [6, 4]);
          const fnCob = (x) => 2.1 * Math.sqrt(Math.max(0, x));
          dCurve(fnCob, 0, 4.5, ox, oy, sc, C.cyan, 3.8);

          const a = 0.5, b = fnCob(a), c = fnCob(b), d = fnCob(c);
          const A0 = toScr(a, 0, ox, oy, sc), P1 = toScr(a, b, ox, oy, sc), Q1 = toScr(b, b, ox, oy, sc);
          const P2 = toScr(b, c, ox, oy, sc), Q2 = toScr(c, c, ox, oy, sc), P3 = toScr(c, d, ox, oy, sc);

          dLine(A0, P1, C.green, 3.0, [], true);
          dDot(P1, '(a, f(a))', C.green, { x: -65, y: -8 });

          if (step >= 2) {
            dLine(P1, Q1, C.gold, 3.0, [], true);
            drawRightAngle(P1, A0, Q1, 9, C.gold);
            dLine(Q1, P2, C.pink, 3.0, [], true);
            dDot(Q1, '(b, b)', C.gold, { x: 8, y: 14 });
            dDot(P2, '(b, f²(a))', C.pink, { x: -70, y: -8 });
          }
          if (step >= 3) {
            dLine(P2, Q2, C.gold, 3.0, [], true);
            drawRightAngle(P2, Q1, Q2, 9, C.gold);
            dLine(Q2, P3, C.cyan, 3.2, [], true);
            dDot(Q2, '(c, c)', C.gold, { x: 8, y: 14 });
            dDot(P3, '(c, f³(a))', C.cyan, { x: -65, y: -10 }, true);
          }
          setMetric('계단식으로 함숫값 확인: 수직으로 곡선 y=f(x)에 닿고, 수평으로 직선 y=x에 닿으면 함숫값이 다음 x좌표로 옮겨집니다!');
          return;
        }

        // 산봉우리 기본 그래프
        dLine(p0, p2, C.cyan, 3.8);
        dLine(p2, p4, C.cyan, 3.8);

        if (id === 'bas-3') {
          const yK = 0.5 + t * 3.5; // t=0.5 -> yK = 2.25 -> 스냅 t=0.5일 때 yK=2.0
          const kVal = Math.abs(t - 0.5) < 0.04 ? 2.0 : Math.abs(t - 1.0) < 0.04 ? 4.0 : 0.4 + t * 3.6;
          dLine(toScr(-0.4, kVal, ox, oy, sc), toScr(4.4, kVal, ox, oy, sc), C.gold, 3.2, [], true);
          dDot(toScr(0, kVal, ox, oy, sc), `y = ${kVal.toFixed(1)} [드래그]`, C.gold, { x: -95, y: -6 }, true);

          const t1 = kVal / 2;
          const t2 = 4 - kVal / 2;
          if (step >= 1) {
            dDot(toScr(t1, kVal, ox, oy, sc), `t₁=${t1.toFixed(1)}`, C.gold, { x: -45, y: -10 });
            dDot(toScr(t2, kVal, ox, oy, sc), `t₂=${t2.toFixed(1)}`, C.gold, { x: 10, y: -10 });
          }
          if (step >= 2) {
            dLine(toScr(-0.4, t1, ox, oy, sc), toScr(4.4, t1, ox, oy, sc), C.green, 2.4, [5, 4], true);
            dLine(toScr(-0.4, t2, ox, oy, sc), toScr(4.4, t2, ox, oy, sc), C.pink, 2.4, [5, 4], true);
          }
          if (step >= 3) {
            dLine(toScr(2, -0.4, ox, oy, sc), toScr(2, 4.4, ox, oy, sc), 'rgba(251,191,36,0.55)', 2, [4, 4]);
            drawDimension(toScr(t1, kVal, ox, oy, sc), toScr(t2, kVal, ox, oy, sc), -24, '대칭축 x=2 대칭 (두 근의 합 = 4)', C.gold);
          }
          setMetric(`현재 k = ${kVal.toFixed(1)} ➔ t₁ = ${t1.toFixed(2)}, t₂ = ${t2.toFixed(2)} | 대칭축 x = 2 에 의해 한 쌍의 합 = 4`);
          return;
        }

        // 처음에는 원래 함수만 표시하고 합성함수는 단계별로 확인합니다.
        if (step === 0) { setMetric('문제를 먼저 읽어 보세요.'); return; }
        // bas-4: 합성함수 y = f(f(x)) 2단 산봉우리 이동 작도
        if (step >= 1) {
          dLine(toScr(-0.4, 2, ox, oy, sc), toScr(4.4, 2, ox, oy, sc), C.gold, 2.2, [5, 4]);
        }
        if (step >= 2) {
          [1, 2, 3].forEach((xv) => {
            dLine(toScr(xv, 0, ox, oy, sc), toScr(xv, 4, ox, oy, sc), 'rgba(52,211,153,0.45)', 1.8, [4, 4]);
          });
        }
        const mT = step >= 3 ? anim : t;
        const q0 = toScr(0, 0, ox, oy, sc);
        const q1 = toScr(1, 2 + 2 * mT, ox, oy, sc);
        const q2 = toScr(2, 4 - 4 * mT, ox, oy, sc);
        const q3 = toScr(3, 2 + 2 * mT, ox, oy, sc);
        const q4 = toScr(4, 0, ox, oy, sc);
        dLine(q0, q1, C.pink, 3.8, [], true);
        dLine(q1, q2, C.pink, 3.8, [], true);
        dLine(q2, q3, C.pink, 3.8, [], true);
        dLine(q3, q4, C.pink, 3.8, [], true);
        dDot(q1, '(1, 4)', C.pink, { x: -18, y: -12 }, true);
        dDot(q2, '(2, 0)', C.pink, { x: -18, y: 18 });
        dDot(q3, '(3, 4)', C.pink, { x: -18, y: -12 });
        setMetric('합성함수 y = f(f(x)) 작도: x = 1, 2, 3 에서 꺾여 봉우리가 2개인 M자 모양이 됩니다!');
        return;
      }

      // -----------------------------------------------------------------------
      // 🌱 [기본 6 & 7] bas-6, bas-7: 역함수 y=x 대칭 접기 & 감소함수 바깥 교점 반례
      // -----------------------------------------------------------------------
      if (id === 'bas-6') {
        const ox = rect.width * 0.3 + state.panX;
        const oy = rect.height * 0.78 + state.panY;
        const sc = u * 1.05;
        drawAxesWithTicks(rect, ox, oy, sc);

        dLine(toScr(-0.5, -0.5, ox, oy, sc), toScr(5.2, 5.2, ox, oy, sc), C.gold, 2.4, [6, 4]);
        const A = toScr(1, 1, ox, oy, sc), B = toScr(4, 4, ox, oy, sc), H = toScr(4, 1, ox, oy, sc);

        if (step >= 2) {
          dPoly([A, H, B], 'rgba(251, 191, 36, 0.20)', C.gold, 2.2);
          drawRightAngle(H, A, B, 11, C.gold);
          drawDimension(A, B, -26, '두 교점 거리 = √2(4-1) = 3√2', C.gold);
        }

        dCurve((x) => ((x - 1) ** 2) / 3 + 1, 1, 5.0, ox, oy, sc, C.cyan, 3.8);
        if (t > 0.05 || step >= 3) {
          dCurve((x) => Math.sqrt(Math.max(0, 3 * (x - 1))) + 1, 1, 5.0, ox, oy, sc, C.pink, 3.8);
        }

        dDot(A, 'A(1, 1)', C.gold, { x: -48, y: 16 });
        dDot(B, 'B(4, 4) [3√2]', C.gold, { x: 10, y: -8 }, true);
        setMetric('증가함수와 역함수: 교점은 100% y=x 위에만 생기며, 거리는 √2|β-α| = 3√2, 넓이는 2배입니다.');
        return;
      }

      if (id === 'bas-7') {
        const ox = rect.width * 0.48 + state.panX;
        const oy = rect.height * 0.52 + state.panY;
        const sc = u * 0.85;
        drawAxesWithTicks(rect, ox, oy, sc);

        dLine(toScr(-4.5, -4.5, ox, oy, sc), toScr(4.5, 4.5, ox, oy, sc), C.gold, 2.4, [6, 4]);
        const fPts = [toScr(-4, 3.3, ox, oy, sc), toScr(-3, 3, ox, oy, sc), toScr(1, 1, ox, oy, sc), toScr(3, -3, ox, oy, sc), toScr(3.5, -4.2, ox, oy, sc)];
        const iPts = [toScr(3.3, -4, ox, oy, sc), toScr(3, -3, ox, oy, sc), toScr(1, 1, ox, oy, sc), toScr(-3, 3, ox, oy, sc), toScr(-4.2, 3.5, ox, oy, sc)];

        for (let i = 0; i < fPts.length - 1; i++) {
          dLine(fPts[i], fPts[i + 1], C.cyan, 3.8);
          if (t > 0.2 || step >= 2) {
            dLine(iPts[i], iPts[i + 1], C.pink, 3.5, [5, 3]);
          }
        }

        const P1 = toScr(-3, 3, ox, oy, sc), P2 = toScr(3, -3, ox, oy, sc), O = toScr(0, 0, ox, oy, sc);
        if (step >= 3) {
          dLine(P1, P2, C.red, 2.4, [4, 4], true);
          drawRightAngle(O, P1, toScr(2, 2, ox, oy, sc), 11, C.gold);
          drawDimension(P1, P2, -24, '기울기 -1 대칭쌍 (-3,3) ↔ (3,-3)', C.red);
        }

        dDot(toScr(1, 1, ox, oy, sc), '교점① (1,1) [y=x 위]', C.gold, { x: 10, y: -8 });
        dDot(P1, '🔥 바깥 교점② (-3, 3)', C.red, { x: -125, y: -10 }, true);
        dDot(P2, '🔥 바깥 교점③ (3, -3)', C.red, { x: 10, y: 15 });
        setMetric('감소함수 반례: y = x 바깥의 기울기 -1 대칭쌍 (-3, 3)과 (3, -3)에서도 교점이 생깁니다!');
        return;
      }

      // -----------------------------------------------------------------------
      // 🌱 [기본 8 ~ 11] bas-8 ~ bas-11: 유리함수 3대 대칭 · 일반형 · 넓이 불변 · 좌표가 모두 정수인 점
      // -----------------------------------------------------------------------
      if (id === 'bas-8' || id === 'bas-9' || id === 'bas-11') {
        const ox = rect.width * 0.44 + state.panX;
        const oy = rect.height * 0.58 + state.panY;
        const sc = u * 0.9;
        drawAxesWithTicks(rect, ox, oy, sc);

        const isInv = id === 'bas-9' && t > 0.5;
        const p = isInv ? 2 : 1;
        const q = isInv ? 1 : 2;
        const kVal = id === 'bas-9' ? 3 : id === 'bas-8' ? (t < 0.4 ? -4 : t >= 0.8 ? 8 : 4) : 4;

        const Cpt = toScr(p, q, ox, oy, sc);
        dLine(toScr(p, -5, ox, oy, sc), toScr(p, 7, ox, oy, sc), C.gold, 2.2, [5, 4]);
        dLine(toScr(-5, q, ox, oy, sc), toScr(7, q, ox, oy, sc), C.gold, 2.2, [5, 4]);
        drawRightAngle(Cpt, toScr(p + 2, q, ox, oy, sc), toScr(p, q + 2, ox, oy, sc), 10, C.gold);

        if (id === 'bas-8' && step >= 2) {
          dLine(toScr(-4, -4 - p + q, ox, oy, sc), toScr(6, 6 - p + q, ox, oy, sc), C.cyan, 2.4, [4, 4], true);
          if (step >= 3) {
            dLine(toScr(-4, 4 + p + q, ox, oy, sc), toScr(6, -6 + p + q, ox, oy, sc), C.pink, 2.4, [4, 4], true);
          }
        }

        if (id === 'bas-9' && step >= 2) {
          dLine(toScr(-3, -3, ox, oy, sc), toScr(6, 6, ox, oy, sc), C.gold, 2.2, [6, 4]);
        }
        if (id === 'bas-9' && step >= 3) {
          dLine(toScr(-3, -3, ox, oy, sc), toScr(6, 6, ox, oy, sc), C.gold, 2.2, [6, 4]);
          dDot(toScr(1, 2, ox, oy, sc), '원함수 중심 (1,2)', C.cyan, { x: -110, y: -10 });
          dDot(toScr(2, 1, ox, oy, sc), '역함수 중심 (2,1)', C.pink, { x: 10, y: 15 });
        }

        dCurve((x) => kVal / (x - p) + q, -5, p - 0.2, ox, oy, sc, C.green, 3.8);
        dCurve((x) => kVal / (x - p) + q, p + 0.2, 7, ox, oy, sc, C.green, 3.8);
        dDot(Cpt, `대칭중심 C(${p}, ${q})`, C.gold, { x: 10, y: 16 }, true);

        if (id === 'bas-11') {
          const pairs = [[-3, 1], [-1, 0], [0, -2], [2, 6], [3, 4], [5, 3]];
          pairs.forEach(([gx, gy]) => {
            const G = toScr(gx, gy, ox, oy, sc);
            if (step >= 2 && Math.abs(gx - 1) === 2) {
              dPoly([Cpt, toScr(gx, 2, ox, oy, sc), G, toScr(1, gy, ox, oy, sc)], 'rgba(56,189,248,0.2)', C.cyan, 1.8);
            }
            dDot(G, `(${gx},${gy})`, C.cyan, { x: 8, y: -6 });
          });
          setMetric('좌표가 모두 정수인 점 6개: 분모 (x-1)이 분자 4의 약수(±1, ±2, ±4)가 되는 점들입니다!');
          return;
        }

        setMetric(`유리함수 y = ${kVal}/(x-${p}) + ${q} | 점대칭 중심 (${p}, ${q}) & 기울기 ±1 선대칭 직선 2개`);
        return;
      }

      if (id === 'bas-10') {
        const ox = rect.width * 0.28 + state.panX;
        const oy = rect.height * 0.74 + state.panY;
        const sc = u * 1.02;
        drawAxesWithTicks(rect, ox, oy, sc);

        dLine(toScr(1, -2, ox, oy, sc), toScr(1, 7.5, ox, oy, sc), C.gold, 2.2, [5, 4]);
        dLine(toScr(-2, 1, ox, oy, sc), toScr(8.5, 1, ox, oy, sc), C.gold, 2.2, [5, 4]);
        dCurve((x) => 4 / (x - 1) + 1, 1.35, 8.2, ox, oy, sc, C.cyan, 3.8);

        const px = 1.6 + t * 4.0; // t=0.35 -> px=3.0 (정사각형)
        const py = 4 / (px - 1) + 1;
        const Cpt = toScr(1, 1, ox, oy, sc);
        const P = toScr(px, py, ox, oy, sc);
        const A = toScr(px, 1, ox, oy, sc);
        const B = toScr(1, py, ox, oy, sc);

        dPoly([Cpt, A, P, B], 'rgba(56, 189, 248, 0.26)', C.cyan, 3.0, true);
        drawRightAngle(A, Cpt, P, 10, C.cyan);
        drawRightAngle(B, Cpt, P, 10, C.cyan);

        if (step >= 1) {
          drawDimension(Cpt, A, 24, `가로 a = ${(px - 1).toFixed(1)}`, C.cyan);
          drawDimension(Cpt, B, -28, `세로 b = ${(py - 1).toFixed(1)}`, C.cyan);
        }
        if (step >= 2) dLine(Cpt, P, C.cyan, 2, [4, 4]);
        if (step >= 3) {
          dLine(toScr(0, 0, ox, oy, sc), toScr(6.5, 6.5, ox, oy, sc), C.green, 2.4, [5, 4], true);
          dLine(Cpt, P, C.gold, 3.2, [], true);
        }

        dDot(Cpt, 'C(1, 1)', C.gold, { x: -48, y: 16 });
        dDot(P, `P(${px.toFixed(1)}, ${py.toFixed(1)}) [드래그! 넓이=4 불변]`, C.pink, { x: 10, y: -8 }, true);

        const perim = 2 * (px - 1 + py - 1);
        setMetric(`직사각형 넓이 = ${(px - 1).toFixed(2)} × ${(py - 1).toFixed(2)} = 4.00 (불변!) | 현재 둘레 = ${perim.toFixed(2)} (최소 8.00)`);
        return;
      }

      // -----------------------------------------------------------------------
      // 🌱 [기본 12 & 13] bas-12, bas-13: 구간 부채꼴 살펴보기 & D=0 / m=0 함정
      // -----------------------------------------------------------------------
      if (id === 'bas-12') {
        const ox = rect.width * 0.32 + state.panX;
        const oy = rect.height * 0.74 + state.panY;
        const sc = u * 0.95;
        drawAxesWithTicks(rect, ox, oy, sc);

        dCurve((x) => 4 / (x - 1) + 1, 1.35, 7.5, ox, oy, sc, 'rgba(56,189,248,0.32)', 2.4);
        dCurve((x) => 4 / (x - 1) + 1, 2, 4, ox, oy, sc, C.gold, 5.5, [], true);

        const P0 = toScr(0, 1, ox, oy, sc);
        const A = toScr(2, 5, ox, oy, sc);
        const B = toScr(4, 7 / 3, ox, oy, sc);

        if (step >= 2) {
          dPoly([P0, toScr(3, 7, ox, oy, sc), toScr(6, 3, ox, oy, sc)], 'rgba(251, 191, 36, 0.15)', null, 0);
          dLine(P0, toScr(3, 7, ox, oy, sc), C.cyan, 2.4, [5, 4], true);
        }
        if (step >= 3) {
          dLine(P0, toScr(6, 4, ox, oy, sc), C.pink, 2.4, [5, 4], true);
        }

        const m = 1 / 3 + t * (5 / 3);
        dLine(toScr(-1, 1 - m, ox, oy, sc), toScr(6, 1 + 6 * m, ox, oy, sc), C.green, 3.8, [], true);
        dDot(P0, '회전정점 P₀(0,1)', C.white, { x: -105, y: -6 });
        dDot(A, '끝점 A(2,5) [최대 m=2]', C.cyan, { x: 10, y: -8 }, true);
        dDot(B, '끝점 B(4,7/3) [최소 m=1/3]', C.pink, { x: 10, y: 15 });

        setMetric(`현재 기울기 m = ${m.toFixed(2)} | 구간 [2, 4]의 곡선과 만날 범위: 1/3 ≤ m ≤ 2`);
        return;
      }

      if (id === 'bas-13') {
        const ox = rect.width * 0.44 + state.panX;
        const oy = rect.height * 0.62 + state.panY;
        const sc = u * 0.92;
        drawAxesWithTicks(rect, ox, oy, sc);

        dLine(toScr(1, -3, ox, oy, sc), toScr(1, 7, ox, oy, sc), C.gold, 1.8, [5, 4]);
        dLine(toScr(-5, 2, ox, oy, sc), toScr(7, 2, ox, oy, sc), C.gold, 1.8, [5, 4]);
        dCurve((x) => 2 / (x - 1) + 2, -5, 0.7, ox, oy, sc, C.cyan, 3.8);
        dCurve((x) => 2 / (x - 1) + 2, 1.3, 7, ox, oy, sc, C.cyan, 3.8);

        if (step >= 2) {
          dLine(toScr(-4, 2.5, ox, oy, sc), toScr(6, -2.5, ox, oy, sc), C.gold, 2.2, [5, 4]);
          dDot(toScr(-1, 1, ox, oy, sc), '접점 (-1,1) [m=-1/2]', C.gold, { x: -125, y: -10 });
        }
        if (step >= 3) {
          dLine(toScr(-5, 0, ox, oy, sc), toScr(7, 0, ox, oy, sc), C.red, 2.6, [5, 4], true);
          dDot(toScr(0, 0, ox, oy, sc), '🔥 교점 (0,0) [m=0 점근선 평행!]', C.red, { x: -165, y: 18 });
        }

        const m = Math.abs(t - 0.35) < 0.08 ? -0.5 : Math.abs(t - 0.65) < 0.08 ? 0 : -1.0 + t * 2.0;
        const isOne = Math.abs(m - (-0.5)) < 0.02 || Math.abs(m) < 0.02;
        dLine(toScr(-4.5, -5.5 * m, ox, oy, sc), toScr(6.5, 5.5 * m, ox, oy, sc), isOne ? C.green : C.pink, 3.8, [], true);
        dDot(toScr(1, 0, ox, oy, sc), '회전정점 (1,0)', C.white, { x: 10, y: 16 }, true);

        setMetric(`현재 기울기 m = ${m.toFixed(2)} ➔ ${isOne ? '🎯 오직 한 점에서 만남 (m = -1/2 또는 m = 0)!' : '교점 2개 또는 0개'}`);
        return;
      }

      // -----------------------------------------------------------------------
      // 🌱 [기본 14 ~ 16] bas-14 ~ bas-16: 무리함수 4방향 · 원래 그래프에 포함되지 않는 점선 · 갈매기
      // -----------------------------------------------------------------------
      const ox = rect.width * 0.4 + state.panX;
      const oy = rect.height * 0.62 + state.panY;
      const sc = u * 1.02;
      drawAxesWithTicks(rect, ox, oy, sc);

      if (id === 'bas-14') {
        dCurve((x) => Math.sqrt(Math.max(0, 2 * (x - 1))) + 1, 1, 6.8, ox, oy, sc, C.cyan, 4.2);
        if (step >= 2) {
          dCurve((x) => Math.sqrt(Math.max(0, -2 * (x - 1))) + 1, -4.8, 1, ox, oy, sc, C.pink, 3.8);
          dCurve((x) => -Math.sqrt(Math.max(0, -2 * (x - 1))) + 1, -4.8, 1, ox, oy, sc, C.green, 3.8);
          dCurve((x) => -Math.sqrt(Math.max(0, 2 * (x - 1))) + 1, 1, 6.8, ox, oy, sc, C.gold, 3.8);
        }
        if (step >= 3) {
          dLine(toScr(-2, -2, ox, oy, sc), toScr(6, 6, ox, oy, sc), 'rgba(255,255,255,0.45)', 2, [5, 4]);
          dCurve((x) => 0.5 * (x - 1) ** 2 + 1, 1, 4.5, ox, oy, sc, C.purple, 3.5, [5, 3], true);
        }
        dDot(toScr(1, 1, ox, oy, sc), '시작점 S(1, 1)', C.white, { x: -45, y: -12 }, true);
        setMetric('시작점 S(1,1) 기준 4방향 날개: (+,+) 1사분면 · (-,+) 2사분면 · (-,-) 3사분면 · (+,-) 4사분면');
        return;
      }

      if (id === 'bas-16') {
        if (step >= 2) dLine(toScr(-4, -5, ox, oy, sc), toScr(6, 5, ox, oy, sc), 'rgba(56,189,248,0.5)', 2, [5, 4]);
        if (step >= 3) dLine(toScr(-4, -4, ox, oy, sc), toScr(6, 6, ox, oy, sc), 'rgba(251,191,36,0.5)', 2, [5, 4]);

        dCurve((x) => 2 * Math.sqrt(Math.abs(x - 1)), -4.8, 1, ox, oy, sc, C.cyan, 3.8);
        dCurve((x) => 2 * Math.sqrt(Math.abs(x - 1)), 1, 6.8, ox, oy, sc, C.cyan, 3.8);

        const k = 0.4 - t * 1.8; // t=0.25 -> k=0, t=0.55 -> k=-0.59, t=0.8 -> k=-1.04
        const isThree = k > -1.0 && k < 0.0;
        dLine(toScr(-4, -4 + k, ox, oy, sc), toScr(6, 6 + k, ox, oy, sc), isThree ? C.green : C.gold, 3.8, [], true);
        dDot(toScr(1, 0, ox, oy, sc), '뾰족점 (1,0) [k=-1]', C.gold, { x: -45, y: 18 }, true);

        setMetric(`직선 y = x + (${k.toFixed(2)}) ➔ ${isThree ? '🎯 서로 다른 3개의 점에서 만남 (-1 < k < 0)!' : '교점 2개 또는 1개'}`);
        return;
      }

      // bas-15: 원래 식을 만족하지 않는 해에 대응하는 점선 곡선
      if (true) {
        dCurve((x) => -2 * Math.sqrt(Math.max(0, x - 1)) + 1, 1, 6.8, ox, oy, sc, C.red, 2.8, [6, 4], true);
      }
      if (step >= 1) dLine(toScr(-3.5, -3.5, ox, oy, sc), toScr(6, 6, ox, oy, sc), 'rgba(56,189,248,0.55)', 2, [5, 4]);
      if (step >= 2) dLine(toScr(-3.5, -2.5, ox, oy, sc), toScr(6, 7, ox, oy, sc), 'rgba(251,191,36,0.55)', 2, [5, 4]);

      dCurve((x) => 2 * Math.sqrt(Math.max(0, x - 1)) + 1, 1, 6.8, ox, oy, sc, C.cyan, 4.2);

      const k = 1.4 - t * 2.2;
      const counts = plotIntersections(k, ox, oy, sc, false);
      const isTwo = counts.real === 2;
      dLine(toScr(-3.5, -3.5 + k, ox, oy, sc), toScr(6, 6 + k, ox, oy, sc), isTwo ? C.green : C.gold, 3.8, [], true);
      dDot(toScr(1, 1, ox, oy, sc), '시작점 S(1,1) [k=0]', C.cyan, { x: 10, y: 15 });
      dDot(toScr(2, 3, ox, oy, sc), '접점 (2,3) [k=1]', C.gold, { x: -105, y: -8 }, true);

      setMetric(`직선 y = x + (${k.toFixed(2)}) ➔ 실제 교점 ${counts.real}개 · 원래 식을 만족하지 않는 해 ${counts.ghost}개`);
    }

    // =========================================================================

    function syncAllUI() {
      const p = curProb();

      // 모바일 & PC 상시 문제 카드
      document.getElementById('mobBadge').textContent = p.badge;
      document.getElementById('mobTitle').textContent = p.title;
      document.getElementById('mobStatement').innerHTML = renderMathHTML(p.statement);

      document.getElementById('pcBadge').textContent = p.badge;
      document.getElementById('pcUnit').textContent = p.unit;
      document.getElementById('pcTitle').textContent = p.title;
      document.getElementById('pcStatement').innerHTML = renderMathHTML(p.statement);

      // 보조선 버튼 및 피드백
      for (let i = 0; i <= 4; i++) {
        document.getElementById(`aux-${i}`).classList.toggle('active', i === state.auxStep);
      }
      document.getElementById('auxHintBox').innerHTML = renderMathHTML(p.auxHints[state.auxStep] || p.auxHints[0]);

      // 슬라이더 & 스냅 칩
      document.getElementById('sliderTitle').textContent = p.sliderTitle;
      document.getElementById('paramSlider').value = state.sliderT;
      syncSliderReadout();

      document.getElementById('snapChipBox').innerHTML = (state.auxStep >= 3 ? p.snaps : [])
        .map(
          (s) =>
            `<button onclick="setSnapVal(${s.t})" class="px-2 py-1 rounded border text-[10.5px] font-bold whitespace-nowrap transition ${
              Math.abs(state.sliderT - s.t) < 0.03
                ? 'bg-amber-400 text-slate-950 border-amber-200 font-black'
                : 'bg-emerald-950/90 text-emerald-200 border-emerald-700/70 hover:bg-emerald-800'
            }">${s.label}</button>`
        )
        .join('');

      // 스캐폴딩 체크포인트
      document.getElementById('scaffoldList').innerHTML = p.steps
        .map((st) => {
          const on = state.auxStep === st.step || state.auxStep === 4;
          return `
            <div onclick="setAuxStep(${st.step})" class="chalk-step-card ${
              on ? 'active' : 'bg-[#05100c] border-emerald-800/70'
            } p-2.5 rounded-lg border flex items-center justify-between gap-2">
              <div class="flex items-center gap-2 min-w-0">
                <span class="w-5 h-5 rounded-full text-[11px] font-black flex items-center justify-center shrink-0 ${
                  on ? 'bg-amber-400 text-slate-950' : 'bg-emerald-900 text-emerald-200'
                }">${st.step}</span>
                <span class="text-xs font-bold text-emerald-50 truncate">${st.title}</span>
              </div>
              <span class="text-[10px] font-extrabold text-amber-300 shrink-0">보조선 점등 ➔</span>
            </div>
          `;
        })
        .join('');

      // 📗 소형 풀이 칠판 내용 업데이트
      document.getElementById('chalkAhaText').innerHTML = renderMathHTML(p.aha);
      document.getElementById('chalkStepsContainer').innerHTML = p.steps
        .map((st) => {
          const on = state.auxStep === st.step;
          return `
            <div onclick="setAuxStep(${st.step})" class="chalk-step-card ${
              on ? 'active' : 'bg-[#05100c]/90 border-emerald-800/80'
            } p-3 rounded-xl border space-y-1">
              <div class="flex items-center justify-between gap-2">
                <span class="text-xs font-black text-amber-300 flex items-center gap-1.5">
                  <i class="fa-solid fa-wand-magic-sparkles"></i> ${st.title}
                </span>
                <span class="text-[10px] px-1.5 py-0.5 rounded bg-amber-500/20 text-amber-200 border border-amber-400/40 font-bold">도형 연동 발광</span>
              </div>
              <div class="text-xs text-emerald-50/95 leading-relaxed pl-1">${renderMathHTML(st.desc)}</div>
            </div>
          `;
        })
        .join('');

      document.getElementById('chalkAlgContainer').innerHTML = renderMathHTML(p.alg);
      document.getElementById('chalkAnswerBadge').textContent = p.answer;
      document.getElementById('chalkAnswerBadge').parentElement.hidden = state.auxStep < 3;
      document.getElementById('chalkAhaText').parentElement.hidden = state.auxStep < 3;
      document.getElementById('tabAlg').disabled = state.auxStep < 3;
      document.getElementById('tabAlg').style.opacity = state.auxStep < 3 ? '0.5' : '1';
      refreshBoardTabs();
    }

    let boardPage=-1;
    function refreshBoardTabs(){
      const p=curProb(), label=p.id==='adv-3'?'🔍 핵심 정석 풀이':['adv-1','adv-5','adv-8'].includes(p.id)?'⚡ 실전 10초 컷':['adv-2','adv-4','adv-6','adv-7'].includes(p.id)?'🎯 실전 최적 풀이':'📖 단계별 풀이';
      document.getElementById('tabGeo').textContent=label;
      document.getElementById('tabAlg').textContent=p.id==='adv-3'?'⚠️ 오답 함정 분석':'📖 풀이 비교';
      const tabs=document.getElementById('boardTabs');
      tabs.innerHTML=[1,2,3].map((n,i)=>`<button type="button" onclick="boardPage=${i};refreshBoardTabs();setAuxStep(${n})" class="${boardPage===i?'chosen':''}">Step ${n}</button>`).join('')+`<button type="button" ${state.auxStep < 3 ? 'disabled title="3단계를 먼저 확인하세요"' : ''} onclick="boardPage=3;refreshBoardTabs()" class="${boardPage===3?'chosen':''}">풀이 비교</button>`;
      const cards=document.querySelectorAll('#chalkStepsContainer > div'); cards.forEach((el,i)=>el.style.display=(state.solMode==='geo' && boardPage===i)?'':'none');
      if(boardPage===3){document.getElementById('chalkStepsContainer').classList.add('hidden');document.getElementById('chalkAlgContainer').classList.remove('hidden');}
      else if(state.solMode==='geo'){document.getElementById('chalkStepsContainer').classList.remove('hidden');document.getElementById('chalkAlgContainer').classList.add('hidden');}
    }

    function zoomCanvas(factor) {
      state.scale = Math.max(0.65, Math.min(1.85, state.scale * factor));
      drawScene();
    }

    function resetView() {
      const p = curProb();
      state.scale = 1.0;
      state.panX = 0;
      state.panY = 0;
      state.sliderT = initialSlider(p);
      state.animT = 1.0;
      document.getElementById('paramSlider').value = state.sliderT;
      syncSliderReadout();
      drawScene();
    }

    function tickAnimation() {
      if (state.animT < 1.0) {
        state.animT = Math.min(1.0, state.animT + 0.045);
        drawScene();
      }
      requestAnimationFrame(tickAnimation);
    }

    // 캔버스 마우스/터치 직접 드래그 이벤트
    function startDrag(x, y) {
      const r = canvas.getBoundingClientRect();
      const cx = x-r.left, cy=y-r.top;
      state.dragMode = activeHandles.some(h=>Math.hypot(h.x-cx,h.y-cy)<28) ? 'handle' : 'pan';
      state.dragging = true;
      state.lastPt = { x, y };
    }

    function moveDrag(x, y) {
      if (!state.dragging) return;
      const dx = x - state.lastPt.x;
      const dy = y - state.lastPt.y;
      state.lastPt = { x, y };

      const rect = canvas.getBoundingClientRect();
      if (state.dragMode === 'pan') {
        state.panX += dx; state.panY += dy; drawScene();
      } else {
        const deltaT = (dx - dy * 0.65) / Math.max(200, rect.width * 0.6);
        const nextT = Math.max(0, Math.min(1, state.sliderT + deltaT));
        onSliderInput(nextT);
      }
    }

    function endDrag() {
      state.dragging = false;
      state.dragMode = null;
    }

    canvas.addEventListener('mousedown', (e) => startDrag(e.clientX, e.clientY));
    window.addEventListener('mousemove', (e) => moveDrag(e.clientX, e.clientY));
    window.addEventListener('mouseup', endDrag);

    canvas.addEventListener('touchstart', (e) => {
      if (e.touches.length === 1) startDrag(e.touches[0].clientX, e.touches[0].clientY);
    }, { passive: true });

    canvas.addEventListener('touchmove', (e) => {
      if (e.touches.length === 1 && state.dragging) {
        e.preventDefault();
        moveDrag(e.touches[0].clientX, e.touches[0].clientY);
      }
    }, { passive: false });

    window.addEventListener('touchend', endDrag);

    canvas.addEventListener('wheel', (e) => {
      e.preventDefault();
      zoomCanvas(e.deltaY < 0 ? 1.1 : 0.91);
    }, { passive: false });

    window.addEventListener('DOMContentLoaded', () => {
      renderTabs();
      selectProb(0);
      resizeCanvas();
      requestAnimationFrame(tickAnimation);
    });
  </script>
</body>
