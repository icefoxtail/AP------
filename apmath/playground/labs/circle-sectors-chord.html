<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AP Math Playground · 호와 현, 활꼴의 기하 실험실</title>
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style>
    :root {
      --bg: #09090D;
      --surface: #120E18;
      --card: #181220;
      --accent-gold: #D8B77E;
      --accent-emerald: #55CBA3;
      --accent-amethyst: #A78AC8;
      --text: #F5F0E9;
      --text-sub: #BDB8C2;
      --border: rgba(216, 183, 126, 0.18);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Pretendard', sans-serif;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    header {
      height: 60px;
      padding: 0 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      background: rgba(18, 14, 24, 0.9);
      backdrop-filter: blur(12px);
    }
    .header-left { display: flex; align-items: center; gap: 14px; }
    .btn-back {
      padding: 6px 14px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--accent-gold);
      font-size: 13px;
      font-weight: 750;
      text-decoration: none;
      transition: all 0.2s;
    }
    .btn-back:hover { border-color: var(--accent-emerald); color: var(--text); }
    .lab-title { font-size: 16px; font-weight: 850; }
    .lab-meta { font-size: 11px; color: var(--accent-emerald); margin-left: 6px; }
    .layout {
      flex: 1;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 340px;
      overflow: hidden;
    }
    #canvasView {
      width: 100%;
      height: 100%;
      display: block;
      background: radial-gradient(circle at center, #1b1322 0%, #09090D 80%);
    }
    aside {
      background: var(--surface);
      border-left: 1px solid var(--border);
      padding: 22px 20px;
      display: flex;
      flex-direction: column;
      gap: 18px;
      overflow-y: auto;
    }
    .control-block {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
    }
    .control-block label {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      font-weight: 800;
      color: var(--text);
      margin-bottom: 8px;
    }
    .val-chip { color: var(--accent-gold); font-family: monospace; font-size: 14px; }
    input[type=range] { width: 100%; accent-color: var(--accent-emerald); }
    .proof-box {
      background: rgba(9, 9, 13, 0.7);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      font-size: 13px;
      line-height: 1.6;
    }
    .proof-formula {
      font-family: 'Times New Roman', serif;
      font-style: italic;
      font-size: 15px;
      color: var(--accent-gold);
      margin-bottom: 8px;
    }
    .proof-stat {
      display: flex;
      justify-content: space-between;
      font-size: 12.5px;
      margin-bottom: 4px;
      color: var(--text-sub);
    }
    .proof-sum {
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      font-weight: 850;
      color: var(--accent-emerald);
      display: flex;
      justify-content: space-between;
      font-size: 13.5px;
    }
    @media (max-width: 820px) {
      .layout { grid-template-columns: 1fr; grid-template-rows: 1fr auto; }
      aside { height: 260px; border-left: none; border-top: 1px solid var(--border); }
    }
  </style>
</head>
<body>
  <header>
    <div class="header-left">
      <a href="../teacher-hub.html" class="btn-back">← 메인 허브로</a>
      <div>
        <span class="lab-title">호와 현, 활꼴의 기하</span>
        <span class="lab-meta">중1 · 평면도형</span>
      </div>
    </div>
  </header>

  <div class="layout">
    <canvas id="canvasView"></canvas>
    <aside>
      <div class="control-block">
        <label>중심각 θ <span class="val-chip" id="valAngle">60°</span></label>
        <input type="range" id="sliderAngle" min="15" max="170" step="1" value="60">
      </div>

      <div class="control-block">
        <label>반지름 r <span class="val-chip" id="valR">4.0</span></label>
        <input type="range" id="sliderR" min="2.0" max="6.0" step="0.1" value="4.0">
      </div>

      <div class="proof-box">
        <div class="proof-formula">호 l = 2πr × (θ/360°), 현 c = 2r sin(θ/2)</div>
        <div class="proof-stat"><span>호의 길이 l (정비례)</span><span id="statArc">4.19</span></div>
        <div class="proof-stat"><span>현의 길이 c (비정비례)</span><span id="statChord">4.00</span></div>
        <div class="proof-stat"><span>활꼴 넓이</span><span id="statSegmentArea">1.45</span></div>
        <div class="proof-sum"><span>호 / 현 길이 비 (l / c)</span><span id="statRatio">1.05</span></div>
      </div>

      <div class="proof-box" style="font-size: 12.5px; color: var(--text-sub);">
        <strong>핵심 기하 법칙:</strong><br>
        중심각이 2배가 되면 <strong>호의 길이는 정확히 2배</strong>가 되지만, <strong>현의 길이는 2배가 되지 않습니다</strong>(삼각형의 두 변의 합 정리: 현 &lt; 2 × 이전 현).
      </div>
    </aside>
  </div>

  <script>
    const canvas = document.getElementById('canvasView');
    const ctx = canvas.getContext('2d');
    const sliderAngle = document.getElementById('sliderAngle');
    const sliderR = document.getElementById('sliderR');
    const valAngle = document.getElementById('valAngle');
    const valR = document.getElementById('valR');
    const statArc = document.getElementById('statArc');
    const statChord = document.getElementById('statChord');
    const statSegmentArea = document.getElementById('statSegmentArea');
    const statRatio = document.getElementById('statRatio');

    function resize() {
      canvas.width = canvas.clientWidth * window.devicePixelRatio;
      canvas.height = canvas.clientHeight * window.devicePixelRatio;
      draw();
    }
    window.addEventListener('resize', resize);

    function update() {
      const deg = parseFloat(sliderAngle.value);
      const r = parseFloat(sliderR.value);
      const rad = (deg * Math.PI) / 180;

      valAngle.textContent = `${deg}°`;
      valR.textContent = r.toFixed(1);

      const arc = r * rad;
      const chord = 2 * r * Math.sin(rad / 2);
      const sectorArea = 0.5 * r * r * rad;
      const triangleArea = 0.5 * r * r * Math.sin(rad);
      const segArea = sectorArea - triangleArea;

      statArc.textContent = arc.toFixed(2);
      statChord.textContent = chord.toFixed(2);
      statSegmentArea.textContent = segArea.toFixed(2);
      statRatio.textContent = (arc / chord).toFixed(3);

      draw();
    }

    sliderAngle.addEventListener('input', update);
    sliderR.addEventListener('input', update);

    function draw() {
      const w = canvas.width;
      const h = canvas.height;
      ctx.clearRect(0, 0, w, h);

      const cx = w / 2;
      const cy = h / 2;
      const scale = Math.min(w, h) / 14;

      const deg = parseFloat(sliderAngle.value);
      const rVal = parseFloat(sliderR.value);
      const rad = (deg * Math.PI) / 180;
      const R = rVal * scale;

      const startAngle = -rad / 2;
      const endAngle = rad / 2;

      // Full circle guide
      ctx.beginPath();
      ctx.arc(cx, cy, R, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.08)';
      ctx.lineWidth = 1.2 * window.devicePixelRatio;
      ctx.stroke();

      // Segment area (활꼴) fill
      ctx.save();
      ctx.beginPath();
      ctx.arc(cx, cy, R, startAngle, endAngle);
      ctx.closePath();
      ctx.fillStyle = 'rgba(167, 138, 200, 0.25)';
      ctx.fill();
      ctx.restore();

      // Sector boundary lines
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.lineTo(cx + R * Math.cos(startAngle), cy + R * Math.sin(startAngle));
      ctx.moveTo(cx, cy);
      ctx.lineTo(cx + R * Math.cos(endAngle), cy + R * Math.sin(endAngle));
      ctx.strokeStyle = '#D8B77E';
      ctx.lineWidth = 1.5 * window.devicePixelRatio;
      ctx.stroke();

      // Arc (Emerald)
      ctx.beginPath();
      ctx.arc(cx, cy, R, startAngle, endAngle);
      ctx.strokeStyle = '#55CBA3';
      ctx.lineWidth = 3.5 * window.devicePixelRatio;
      ctx.stroke();

      // Chord (Gold)
      const p1x = cx + R * Math.cos(startAngle);
      const p1y = cy + R * Math.sin(startAngle);
      const p2x = cx + R * Math.cos(endAngle);
      const p2y = cy + R * Math.sin(endAngle);

      ctx.beginPath();
      ctx.moveTo(p1x, p1y);
      ctx.lineTo(p2x, p2y);
      ctx.strokeStyle = '#D8B77E';
      ctx.lineWidth = 2.5 * window.devicePixelRatio;
      ctx.stroke();

      // Center and vertices
      const drawDot = (x, y, color) => {
        ctx.beginPath();
        ctx.arc(x, y, 4 * window.devicePixelRatio, 0, Math.PI * 2);
        ctx.fillStyle = color;
        ctx.fill();
      };
      drawDot(cx, cy, '#F5F0E9');
      drawDot(p1x, p1y, '#55CBA3');
      drawDot(p2x, p2y, '#55CBA3');

      // Labels
      ctx.font = `bold ${12 * window.devicePixelRatio}px Pretendard`;
      ctx.fillStyle = '#55CBA3';
      ctx.fillText(`호 l = ${statArc.textContent}`, cx + R * Math.cos(0) + 12, cy);
      ctx.fillStyle = '#D8B77E';
      ctx.fillText(`현 c = ${statChord.textContent}`, (p1x + p2x) / 2 - 40, cy - 8);
    }

    resize();
    update();
  </script>
</body>
</html>
