<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>평면도형·다각형·넓이·외각 활용 통합 스튜디오</title>
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
  <style>
    * { font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, sans-serif; user-select: none; -webkit-user-select: none; }
    body { background-color: #F8FAFC; color: #0F172A; overflow: hidden; }
    .katex { font-size: 1.01em !important; }
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: #F1F5F9; }
    ::-webkit-scrollbar-thumb { background: #CBD5E1; border-radius: 3px; }
    input[type="range"] { -webkit-appearance: none; appearance: none; background: #E2E8F0; height: 5px; border-radius: 4px; outline: none; }
    input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 15px; height: 15px; border-radius: 50%; background: #2563EB; cursor: pointer; border: 2px solid #FFF; box-shadow: 0 1px 4px rgba(15,23,42,0.35); }
    .mode-tab.active { background: #0F172A; color: #FFF; border-color: #0F172A; font-weight: 800; box-shadow: 0 2px 6px rgba(15,23,42,0.18); }
    .sub-pill.active { background: #2563EB; color: #FFF; border-color: #1D4ED8; font-weight: 800; box-shadow: 0 2px 6px rgba(37,99,235,0.25); }
    .lens-btn.active { background: #EFF6FF; border-color: #2563EB; color: #1D4ED8; font-weight: 800; }
    .preset-chip.active { background: #0F172A; color: #FFF; border-color: #0F172A; font-weight: 800; }
    .step-btn.active { background: #F0FDF4; border-color: #16A34A; color: #15803D; font-weight: 800; }
    .tag-blue { display: inline-flex; align-items: center; padding: 1px 6px; border-radius: 5px; background: rgba(37,99,235,0.12); border: 1.5px solid #2563EB; color: #1D4ED8; font-weight: 800; margin: 0 1px; }
    .tag-rose { display: inline-flex; align-items: center; padding: 1px 6px; border-radius: 5px; background: rgba(225,29,72,0.12); border: 1.5px solid #E11D48; color: #BE123C; font-weight: 800; margin: 0 1px; }
    .tag-emerald { display: inline-flex; align-items: center; padding: 1px 6px; border-radius: 5px; background: rgba(5,150,105,0.12); border: 1.5px solid #059669; color: #047857; font-weight: 800; margin: 0 1px; }
    @media (max-width: 1023px) {
      html, body { height: auto !important; overflow-y: auto !important; overflow-x: hidden !important; display: block !important; }
      #workspace { display: flex !important; flex-direction: column !important; height: auto !important; }
      #canvasStage { height: clamp(420px, 58svh, 580px) !important; flex: 0 0 auto !important; }
      #rightPanel { width: 100% !important; height: auto !important; border-left: none !important; border-top: 1px solid #E2E8F0 !important; }
    }
  </style>

  <!-- 중1 칠판 테마 복구: 인접 다크 실험실과 동일한 배경·패널·강조색 구조 -->
  <style id="ap-g7-chalkboard-theme">
    body.ap-chalk-restored {
      background:#07130e!important; color:#e2e8f0!important;
      color-scheme:dark;
    }
    body.ap-chalk-restored #canvasStage {
      background:radial-gradient(circle at 50% 45%, #163329 0%, #0d211a 65%, #07140f 100%)!important;
      box-shadow:inset 0 0 100px rgba(0,0,0,.70);
    }
    body.ap-chalk-restored > header {
      background:rgba(8,21,16,.97)!important;
      border-color:#28503e!important; box-shadow:0 2px 15px rgba(0,0,0,.25);
    }
    body.ap-chalk-restored #rightPanel {
      background:#081611!important;
      border-color:#28503e!important;
    }
    body.ap-chalk-restored .bg-white { background-color:#10251c!important; }
    body.ap-chalk-restored .bg-white\/95 { background-color:rgba(7,20,15,.96)!important; }
    body.ap-chalk-restored .bg-slate-50 { background-color:#10241c!important; }
    body.ap-chalk-restored .bg-slate-100 { background-color:#173529!important; }
    body.ap-chalk-restored .bg-slate-200 { background-color:#254637!important; }
    body.ap-chalk-restored .bg-blue-50,
    body.ap-chalk-restored .bg-blue-50\/40 { background-color:#123232!important; }
    body.ap-chalk-restored .bg-rose-50 { background-color:#351e29!important; }
    body.ap-chalk-restored .bg-amber-50 { background-color:#372918!important; }
    body.ap-chalk-restored .bg-emerald-50 { background-color:#123528!important; }
    body.ap-chalk-restored .bg-slate-900 { background-color:#fbbf24!important; }
    body.ap-chalk-restored .bg-blue-600 { background-color:#b45309!important; }
    body.ap-chalk-restored .hover\:bg-slate-100:hover,
    body.ap-chalk-restored .hover\:bg-slate-200:hover { background-color:#24513e!important; }
    body.ap-chalk-restored .hover\:bg-blue-100:hover,
    body.ap-chalk-restored .hover\:bg-blue-700:hover { background-color:#d97706!important; }
    body.ap-chalk-restored .hover\:bg-rose-100:hover { background-color:#633143!important; }
    body.ap-chalk-restored .hover\:bg-amber-100:hover { background-color:#654c24!important; }
    body.ap-chalk-restored .text-slate-900,
    body.ap-chalk-restored .text-slate-800 { color:#f1f5f9!important; }
    body.ap-chalk-restored .text-slate-700 { color:#d1e6d9!important; }
    body.ap-chalk-restored .text-slate-600 { color:#b4cfbe!important; }
    body.ap-chalk-restored .text-slate-500,
    body.ap-chalk-restored .text-slate-400 { color:#a7b9b0!important; }
    body.ap-chalk-restored .text-blue-700,
    body.ap-chalk-restored .text-blue-600,
    body.ap-chalk-restored .text-blue-950 { color:#7dd3fc!important; }
    body.ap-chalk-restored .text-rose-700,
    body.ap-chalk-restored .text-rose-600 { color:#fda4af!important; }
    body.ap-chalk-restored .text-emerald-700,
    body.ap-chalk-restored .text-emerald-600 { color:#6ee7b7!important; }
    body.ap-chalk-restored .text-amber-800,
    body.ap-chalk-restored .text-amber-600 { color:#fcd34d!important; }
    body.ap-chalk-restored .border-slate-200,
    body.ap-chalk-restored .border-slate-200\/80 { border-color:#28503e!important; }
    body.ap-chalk-restored .border-slate-300 { border-color:#3a6755!important; }
    body.ap-chalk-restored .border-blue-200 { border-color:#356879!important; }
    body.ap-chalk-restored .border-rose-200 { border-color:#774658!important; }
    body.ap-chalk-restored .border-amber-300 { border-color:#90743c!important; }
    body.ap-chalk-restored .border-emerald-200 { border-color:#387452!important; }
    body.ap-chalk-restored .bg-slate-900.text-white,
    body.ap-chalk-restored .bg-slate-900 > .text-white { color:#07130e!important; }
    body.ap-chalk-restored .bg-blue-600.text-white,
    body.ap-chalk-restored .bg-blue-600 > .text-white { color:#fff9e8!important; }
    body.ap-chalk-restored .mode-tab {
      background:#10261e!important; border-color:#24513e!important;
      color:#bbebd0!important; box-shadow:none;
    }
    body.ap-chalk-restored .mode-tab.active {
      background:linear-gradient(135deg,#f59e0b,#d97706)!important;
      border-color:#fbbf24!important; color:#07130e!important;
      box-shadow:0 0 12px rgba(245,158,11,.32)!important;
    }
    body.ap-chalk-restored .sub-pill.active {
      background:rgba(52,211,153,.25)!important;
      border-color:#34d399!important; color:white!important;
    }
    body.ap-chalk-restored .lens-btn.active,
    body.ap-chalk-restored .step-btn.active {
      background:rgba(251,191,36,.15)!important;
      border-color:#fbbf24!important; color:#fef08a!important;
    }
    body.ap-chalk-restored .preset-chip.active {
      background:#fbbf24!important; border-color:#fef08a!important; color:#07130e!important;
    }
    body.ap-chalk-restored input[type=range] {
      background:#18382c!important; border:1px solid #35624d!important;
    }
    body.ap-chalk-restored input[type=range]::-webkit-slider-thumb {
      background:#fbbf24!important; border-color:#07130e!important;
      box-shadow:0 0 9px rgba(251,191,36,.55)!important;
      width:19px!important; height:19px!important;
    }
    body.ap-chalk-restored input[type=range]::-moz-range-thumb {
      background:#fbbf24!important; border:2px solid #07130e!important;
      width:19px; height:19px;
    }
    body.ap-chalk-restored .katex { color:inherit; }
    body.ap-chalk-restored #rightPanel .katex-display { max-width:100%; overflow-x:auto; }
    body.ap-chalk-restored ::-webkit-scrollbar-track { background:#07130e; }
    body.ap-chalk-restored ::-webkit-scrollbar-thumb { background:#28503e; }
    @media(max-width:1023px) {
      body.ap-chalk-restored #apMobileControls.ap-mobile-top {
        background:#0b2019!important; border-bottom-color:#28503e!important;
      }
      body.ap-chalk-restored #apMobileTools.ap-mobile-tools {
        background:#0a1b15!important; border-color:#28503e!important;
      }
      body.ap-chalk-restored #rightPanel { border-top-color:#28503e!important; }
      body.ap-chalk-restored .mode-tab { min-height:44px!important; }
    }
  </style>
</head>
<body class="h-screen w-screen flex flex-col ap-chalk-restored">

  <!-- 상단 헤더 & 4대 핵심 마스터 모드 탭 (초등~중1 과정 100% 맞춤) -->
  <header class="bg-white border-b border-slate-200 px-4 py-2 flex flex-wrap items-center justify-between gap-2 z-20 shrink-0 shadow-sm">
    <div class="flex items-center gap-2">
      <div class="w-7 h-7 rounded-lg bg-slate-900 text-white flex items-center justify-center font-black text-xs shadow-sm">
        <i class="fa-solid fa-vector-square"></i>
      </div>
      <h1 class="text-sm md:text-base font-black tracking-tight text-slate-900">평면도형 · 다각형 · 외각 활용 스튜디오</h1>
      <span class="text-[10px] font-extrabold px-2 py-0.5 rounded bg-blue-50 text-blue-700 border border-blue-200">초5 ~ 중1 올인원</span>
    </div>

    <nav class="flex items-center gap-1 overflow-x-auto py-0.5 max-w-full">
      <button onclick="setMode(1)" id="tab-1" class="mode-tab active text-xs px-3 py-1.5 rounded-lg border border-slate-200 bg-slate-50 text-slate-700 hover:bg-slate-100 transition whitespace-nowrap flex items-center gap-1.5">
        <i class="fa-solid fa-scissors"></i><span>1. 넓이 원리·바깥 액자</span>
      </button>
      <button onclick="setMode(2)" id="tab-2" class="mode-tab text-xs px-3 py-1.5 rounded-lg border border-slate-200 bg-slate-50 text-slate-700 hover:bg-slate-100 transition whitespace-nowrap flex items-center gap-1.5">
        <i class="fa-solid fa-road"></i><span>2. 평행선 넓이·산책로·둘레</span>
      </button>
      <button onclick="setMode(3)" id="tab-3" class="mode-tab text-xs px-3 py-1.5 rounded-lg border border-slate-200 bg-slate-50 text-slate-700 hover:bg-slate-100 transition whitespace-nowrap flex items-center gap-1.5">
        <i class="fa-solid fa-draw-polygon"></i><span>3. 대각선(n-3)·내각·외각 360°</span>
      </button>
      <button onclick="setMode(4)" id="tab-4" class="mode-tab text-xs px-3 py-1.5 rounded-lg border border-slate-200 bg-slate-50 text-slate-700 hover:bg-slate-100 transition whitespace-nowrap flex items-center gap-1.5">
        <i class="fa-solid fa-star"></i><span>4. 별모양·복잡한 외각 마스터</span>
      </button>
    </nav>
  </header>

  <!-- 메인 2분할 워크스페이스 -->
  <div id="workspace" class="flex-1 flex flex-col lg:flex-row overflow-hidden relative">

    <!-- 좌측: 인터랙티브 제도판 Canvas -->
    <main id="canvasStage" class="flex-1 relative bg-[#F8FAFC] overflow-hidden flex items-center justify-center">
      <canvas id="boardCanvas" class="w-full h-full block cursor-pointer"></canvas>

      <!-- 좌측 상단: 4개 도형 버튼 + 뷰 렌즈 + 핵심 등식 배지 -->
      <div class="absolute top-3 left-3 right-3 pointer-events-none flex flex-col gap-1.5 max-w-2xl z-10">
        <div id="subSelectorBar" class="pointer-events-auto bg-white/95 backdrop-blur border border-slate-200 rounded-xl p-1 shadow-sm flex flex-wrap items-center gap-1 w-fit"></div>

        <div class="pointer-events-auto bg-white/95 backdrop-blur border border-slate-200 rounded-xl px-2.5 py-1.5 shadow-sm flex flex-wrap items-center gap-2 w-fit max-w-full">
          <div class="flex items-center gap-1">
            <button onclick="setLens('all')" id="lens-all" class="lens-btn active px-2 py-0.5 rounded border border-slate-200 text-[11px] text-slate-700 transition">🔍 전체</button>
            <button onclick="setLens('mark')" id="lens-mark" class="lens-btn px-2 py-0.5 rounded border border-slate-200 text-[11px] text-slate-700 transition">📌 직각·평행·등변</button>
            <button onclick="setLens('aux')" id="lens-aux" class="lens-btn px-2 py-0.5 rounded border border-slate-200 text-[11px] text-slate-700 transition">🎯 마법 보조선</button>
            <button onclick="toggleAntTape()" id="btnAntTop" class="lens-btn px-2 py-0.5 rounded border border-slate-200 text-[11px] text-slate-700 transition">🐜 둘레 줄자</button>
          </div>
          <div id="visualEqBadge" class="text-[11.5px] font-bold text-slate-800 flex flex-wrap items-center gap-1 border-l border-slate-200 pl-2"></div>
        </div>
      </div>

      <!-- 좌측 하단: 플로팅 원클릭 작동 툴바 -->
      <div class="absolute bottom-3.5 left-3.5 flex flex-wrap items-center gap-1.5 bg-white/95 backdrop-blur border border-slate-200 p-1.5 rounded-xl shadow-md z-10">
        <button onclick="triggerAnim()" id="btnAction" class="px-3.5 py-1.5 rounded-lg bg-blue-600 hover:bg-blue-700 text-white text-xs font-extrabold flex items-center gap-1.5 transition shadow-sm">
          <i class="fa-solid fa-play" id="iconAction"></i>
          <span id="txtAction">🎬 이동·합체 실행</span>
        </button>
        <button onclick="snapToProblem()" class="px-2.5 py-1.5 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-800 border border-slate-200 text-xs font-bold flex items-center gap-1 transition">
          <i class="fa-solid fa-crosshairs text-blue-600"></i><span>기출 스냅</span>
        </button>
        <div class="h-4 w-[1px] bg-slate-200 mx-0.5"></div>
        <button onclick="zoomCanvas(1.12)" class="w-7 h-7 rounded-lg hover:bg-slate-100 text-slate-700 flex items-center justify-center text-xs transition"><i class="fa-solid fa-plus"></i></button>
        <button onclick="zoomCanvas(0.89)" class="w-7 h-7 rounded-lg hover:bg-slate-100 text-slate-700 flex items-center justify-center text-xs transition"><i class="fa-solid fa-minus"></i></button>
        <button onclick="resetView()" class="w-7 h-7 rounded-lg hover:bg-slate-100 text-slate-700 flex items-center justify-center text-xs transition"><i class="fa-solid fa-rotate-left"></i></button>
      </div>
    </main>

    <!-- 우측(440px): 컴팩트 버튼형 컨트롤러 & 핵심 요약 패널 -->
    <aside id="rightPanel" class="w-full lg:w-[440px] bg-white border-l border-slate-200 flex flex-col h-full shrink-0 z-10">
      <div class="p-3 overflow-y-auto flex-1 space-y-2.5">

        <!-- 1. 실전 기출 문제 카드 + 원클릭 3지선다 -->
        <section class="bg-white border border-slate-200 rounded-xl p-3 shadow-sm">
          <div class="flex items-center justify-between mb-1.5">
            <span id="examBadge" class="text-[11px] font-extrabold px-2 py-0.5 rounded bg-slate-900 text-white">핵심 기출 유형</span>
            <button onclick="snapToProblem()" class="text-[11px] font-extrabold px-2 py-0.5 rounded-md bg-blue-50 hover:bg-blue-100 text-blue-700 border border-blue-200 transition">
              🎯 문제 조건 스냅
            </button>
          </div>
          <div id="examQuestion" class="text-xs text-slate-800 leading-snug bg-slate-50 p-2.5 rounded-lg border border-slate-200/80 mb-2 font-medium"></div>
          <div id="quizBox" class="grid grid-cols-3 gap-1.5 mb-1.5"></div>
          <div id="quizFeedback" class="text-[11px] font-bold text-blue-700 min-h-[15px] mb-1"></div>
          <div class="bg-slate-50 px-2.5 py-1.5 rounded-lg border border-slate-200 flex items-center justify-between text-xs">
            <span class="text-slate-500 font-bold shrink-0">정답 식:</span>
            <span id="answerSummary" class="font-extrabold text-slate-900 text-right"></span>
          </div>
        </section>

        <!-- 2. 버튼식 도형·조건 선택기 & 불변량 모니터 -->
        <section class="bg-white border border-slate-200 rounded-xl p-3 shadow-sm space-y-2">
          <div class="flex items-center justify-between">
            <h2 class="text-xs font-extrabold text-slate-800 flex items-center gap-1.5">
              <i class="fa-solid fa-gamepad text-blue-600"></i>
              <span>버튼식 작동 &amp; 실시간 불변량 모니터</span>
            </h2>
            <span class="text-[10px] font-mono font-bold px-2 py-0.5 rounded bg-emerald-50 text-emerald-700 border border-emerald-200">오차 0.000%</span>
          </div>

          <!-- 원클릭 작동 버튼 + 슬라이더 -->
          <div class="bg-slate-50 p-2 rounded-lg border border-slate-200 space-y-1.5">
            <div class="flex items-center justify-between gap-1">
              <span class="text-[11px] font-extrabold text-slate-700">🎬 조각 이동·변형:</span>
              <div class="flex items-center gap-1">
                <button onclick="setAnimVal(0)" class="px-2 py-0.5 rounded border border-slate-300 bg-white hover:bg-slate-100 text-[10.5px] font-bold text-slate-700">원래대로(0%)</button>
                <button onclick="setAnimVal(0.5)" class="px-2 py-0.5 rounded border border-slate-300 bg-white hover:bg-slate-100 text-[10.5px] font-bold text-slate-700">중간(50%)</button>
                <button onclick="setAnimVal(1)" class="px-2.5 py-0.5 rounded bg-blue-600 hover:bg-blue-700 text-[10.5px] font-extrabold text-white">완성(100%)</button>
              </div>
            </div>
            <div class="flex items-center gap-2">
              <input type="range" id="sliderAnim" min="0" max="1" step="0.01" value="0" class="flex-1" oninput="onAnimSlider()" />
              <span id="valAnim" class="text-[11px] font-mono font-bold text-blue-700 w-9 text-right">0%</span>
            </div>
          </div>

          <!-- 버튼 그룹 1 & 버튼 그룹 2 -->
          <div class="grid grid-cols-1 gap-1.5">
            <div class="bg-slate-50 p-2 rounded-lg border border-slate-200">
              <div class="flex justify-between items-center text-[10.5px] mb-1">
                <span id="labelGroup1" class="font-bold text-slate-600">조건·각도·변 선택 ①</span>
                <span id="valGroup1" class="font-mono font-extrabold text-blue-700">-</span>
              </div>
              <div id="btnGroup1" class="grid grid-cols-5 gap-1"></div>
            </div>
            <div class="bg-slate-50 p-2 rounded-lg border border-slate-200">
              <div class="flex justify-between items-center text-[10.5px] mb-1">
                <span id="labelGroup2" class="font-bold text-slate-600">세부 유형·보조선 선택 ②</span>
                <span id="valGroup2" class="font-mono font-extrabold text-rose-600">-</span>
              </div>
              <div id="btnGroup2" class="grid grid-cols-4 gap-1"></div>
            </div>
          </div>

          <!-- 4대 수치 카드 -->
          <div class="grid grid-cols-2 gap-1.5 text-xs font-mono">
            <div class="bg-slate-50 px-2.5 py-1.5 rounded-lg border border-slate-200">
              <div id="statL1" class="text-[10px] text-slate-500 font-sans font-semibold">조건 치수</div>
              <div id="statV1" class="text-[11px] font-extrabold text-slate-900 mt-0.5">-</div>
            </div>
            <div class="bg-slate-50 px-2.5 py-1.5 rounded-lg border border-slate-200">
              <div id="statL2" class="text-[10px] text-blue-600 font-sans font-semibold">핵심 부분값</div>
              <div id="statV2" class="text-[11px] font-extrabold text-blue-700 mt-0.5">-</div>
            </div>
            <div class="bg-slate-50 px-2.5 py-1.5 rounded-lg border border-slate-200">
              <div id="statL3" class="text-[10px] text-rose-600 font-sans font-semibold">보조선·외각 이동</div>
              <div id="statV3" class="text-[11px] font-extrabold text-rose-700 mt-0.5">-</div>

            <div class="bg-slate-50 px-2.5 py-1.5 rounded-lg border border-slate-200">
              <div id="statL4" class="text-[10px] text-emerald-600 font-sans font-semibold">최종 넓이·각도</div>
              <div id="statV4" class="text-[11px] font-extrabold text-emerald-700 mt-0.5">-</div>

        <!-- 3. 단계별 보조선 Step 1~3 언락 버튼 -->
        <section class="bg-white border border-slate-200 rounded-xl p-2.5 shadow-sm">
          <div class="flex items-center justify-between mb-1.5">
            <h2 class="text-xs font-extrabold text-slate-800 flex items-center gap-1.5">

          <div class="grid grid-cols-3 gap-1.5">
            <button onclick="toggleStep(1)" id="stepBtn1" class="step-btn active px-2 py-1.5 rounded-lg border border-slate-200 text-[11px] text-center transition">
              Step 1. 기호(∟·≫·||)
            </button>
            <button onclick="toggleStep(2)" id="stepBtn2" class="step-btn active px-2 py-1.5 rounded-lg border border-slate-200 text-[11px] text-center transition">
              Step 2. 마법 보조선
            </button>
            <button onclick="toggleStep(3)" id="stepBtn3" class="step-btn active px-2 py-1.5 rounded-lg border border-slate-200 text-[11px] text-center transition">
              Step 3. 꼭짓점·공식

        <!-- 4. 초압축 2대 비교 아코디언 (교과서 정석 vs 10초 컷 실전 비기) -->
        <section class="space-y-1.5">
          <div class="border border-slate-200 rounded-xl bg-white overflow-hidden shadow-sm">
            <button onclick="toggleAcc('std')" class="w-full px-3 py-2 flex items-center justify-between text-left bg-slate-50 hover:bg-slate-100 transition">
              <div class="flex items-center gap-2">
                <span class="px-1.5 py-0.5 rounded bg-slate-200 text-slate-700 text-[10px] font-extrabold">교과서 3분 정석</span>
                <span class="text-xs font-extrabold text-slate-800">정석 유도 &amp; 오답 함정 주의</span>
              </div>
              <i id="accIcon-std" class="fa-solid fa-chevron-down text-slate-400 text-xs"></i>
            </button>
            <div id="accBody-std" class="hidden p-2.5 text-xs border-t border-slate-200 bg-white">
              <div id="stdText" class="text-[11.5px] text-slate-700 leading-relaxed"></div>
            </div>
          </div>

          <div class="border border-blue-200 rounded-xl bg-blue-50/40 overflow-hidden shadow-sm">
            <button onclick="toggleAcc('fast')" class="w-full px-3 py-2 flex items-center justify-between text-left bg-blue-50 hover:bg-blue-100/70 transition">
              <div class="flex items-center gap-2">
                <span class="px-1.5 py-0.5 rounded bg-blue-600 text-white text-[10px] font-extrabold">10초 컷 실전 비기</span>
                <span class="text-xs font-extrabold text-blue-950">보조선 · 외각 이사 · 암산 공식</span>
              </div>
              <i id="accIcon-fast" class="fa-solid fa-chevron-up text-blue-600 text-xs"></i>
            </button>
            <div id="accBody-fast" class="p-2.5 text-xs border-t border-blue-200 bg-white">
              <div id="fastText" class="text-[11.5px] text-slate-800 leading-relaxed font-medium"></div>

      </div>

  <!-- ===================================================================== -->
  <!-- 평면도형 · 다각형 · 복잡한 삼각형 외각 활용 인터랙티브 엔진 -->
  <!-- ===================================================================== -->
  <script>
    function tex(s) {
      return window.katex ? katex.renderToString(s, { throwOnError: false }) : s;
    }

    const KOR_N = { 3: '삼', 4: '사', 5: '오', 6: '육', 7: '칠', 8: '팔', 9: '구', 10: '십', 12: '십이' };

    const state = {
      mode: 1,
      sub: {
        1: 'triAlt',   // 'triAlt' | 'paraMove' | 'trapRot' | 'boxFrame'
        2: 'railWing', // 'railWing' | 'baseRatio' | 'roadMerge' | 'stairFold'
        3: 'oneDiag',  // 'oneDiag' | 'inPointO' | 'allDiag' | 'ext360'
        4: 'stepExt'   // 'stepExt'(외각이동&징검다리) | 'boomBow'(부메랑&나비) | 'starMaster'(오각별2해법&변형별) | 'bisect3'(이등분선3종&정오각교각)
      },
      lens: 'all',
      animProg: 0.0,
      animTarget: null,
      showAntTape: false,
      p1: 8,
      p2: 1,
      dragXRatio: 0.35,
      dragYRatio: 0.45,
      dragHandles: [],
      activeHandle: null,
      scale: 1.0,
      offsetX: 0,
      offsetY: 0,
      steps: { 1: true, 2: true, 3: true },
      selectedQuiz: null
    };

    const SUB_MENUS = {
      1: [
        { id: 'triAlt', label: '📐 둔각 바깥높이·직각삼각형 h' },
        { id: 'paraMove', label: '✂️ 평행사변형 2가지 높이' },
        { id: 'trapRot', label: '🔄 사다리꼴 합체·2분할' },
        { id: 'boxFrame', label: '🖼️ 바깥 직사각형 액자 빼기' }
      ],
      2: [
        { id: 'railWing', label: '🦋 평행선 레일·나비날개(S₁=S₂)' },
        { id: 'baseRatio', label: '⚖️ 밑변의 비(m:n) = 넓이 비' },
        { id: 'roadMerge', label: '🚜 산책로(십자·사선) 합체' },
        { id: 'stairFold', label: '🐜 계단 둘레·종이띠 접기' }
      ],
      3: [
        { id: 'oneDiag', label: '🍕 한 점 대각선(n-3)·삼각형(n-2)' },
        { id: 'inPointO', label: '🎯 내부 점 O (180°n-360°)' },
        { id: 'allDiag', label: '🕸️ 전체 대각선·역추적·악수' },
        { id: 'ext360', label: '🔭 외각의 합 360° 줌아웃 수축' }
      ],
      4: [
        { id: 'stepExt', label: '🚀 외각 이동 & 이등변 징검다리(4x)' },
        { id: 'boomBow', label: '🪃 부메랑(오목) & 🎀 나비넥타이(8자)' },
        { id: 'starMaster', label: '⭐ 별모양(☆) 외각 2대 해법·변형별' },
        { id: 'bisect3', label: '📐 내·외각 이등분선 3종·대각선 교각' }
      ]
    };

    // -------------------------------------------------------------------------
    // 1. 제도판 기하 마크 공통 렌더러 (High-Contrast Academic Light)
    // -------------------------------------------------------------------------
    const canvas = document.getElementById('boardCanvas');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
      const rect = canvas.parentElement.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      canvas.width = rect.width * dpr;
      canvas.height = rect.height * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      render();
    }
    window.addEventListener('resize', resizeCanvas);

    function drawAcademicGrid(rect) {
      const step = 20 * state.scale;
      ctx.save();
      ctx.strokeStyle = 'rgba(52, 211, 153, 0.07)';
      ctx.lineWidth = 1;
      for (let x = 0; x < rect.width; x += step) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, rect.height); ctx.stroke();
      }
      for (let y = 0; y < rect.height; y += step) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(rect.width, y); ctx.stroke();
      }
      ctx.restore();
    }

    function drawRightAngle(x, y, ang1, size = 12, color = '#38bdf8') {
      if (!state.steps[1] && state.lens !== 'mark' && state.lens !== 'all') return;
      const ang2 = ang1 + Math.PI / 2;
      const p1 = { x: x + size * Math.cos(ang1), y: y + size * Math.sin(ang1) };
      const p2 = { x: p1.x + size * Math.cos(ang2), y: p1.y + size * Math.sin(ang2) };
      const p3 = { x: x + size * Math.cos(ang2), y: y + size * Math.sin(ang2) };
      ctx.save();
      ctx.beginPath();
      ctx.moveTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y); ctx.lineTo(p3.x, p3.y);
      ctx.strokeStyle = color; ctx.lineWidth = 2; ctx.stroke();
      ctx.lineTo(x, y); ctx.closePath();
      ctx.fillStyle = 'rgba(56, 189, 248, 0.14)'; ctx.fill();
      ctx.restore();
    }

    function drawParallelArrows(x1, y1, x2, y2, count = 2, color = '#34d399') {
      if (!state.steps[1] && state.lens !== 'mark' && state.lens !== 'all') return;
      const mx = (x1 + x2) / 2, my = (y1 + y2) / 2, ang = Math.atan2(y2 - y1, x2 - x1), sz = 7;
      ctx.save();
      ctx.strokeStyle = color; ctx.lineWidth = 2.2;
      for (let i = 0; i < count; i++) {
        const off = (i - (count - 1) / 2) * 7;
        const px = mx + off * Math.cos(ang), py = my + off * Math.sin(ang);
        ctx.beginPath();
        ctx.moveTo(px - sz * Math.cos(ang - 0.6), py - sz * Math.sin(ang - 0.6));
        ctx.lineTo(px, py);
        ctx.lineTo(px - sz * Math.cos(ang + 0.6), py - sz * Math.sin(ang + 0.6));
        ctx.stroke();
      }
      ctx.restore();
    }

    function drawTickMarks(x1, y1, x2, y2, count = 2, color = '#fb7185') {
      if (!state.steps[1] && state.lens !== 'mark' && state.lens !== 'all') return;
      const mx = (x1 + x2) / 2, my = (y1 + y2) / 2, ang = Math.atan2(y2 - y1, x2 - x1), norm = ang + Math.PI / 2, len = 6.5;
      ctx.save();
      ctx.strokeStyle = color; ctx.lineWidth = 2.2;
      for (let i = 0; i < count; i++) {
        const off = (i - (count - 1) / 2) * 5;
        const cx = mx + off * Math.cos(ang), cy = my + off * Math.sin(ang);
        ctx.beginPath();
        ctx.moveTo(cx - len * Math.cos(norm), cy - len * Math.sin(norm));
        ctx.lineTo(cx + len * Math.cos(norm), cy + len * Math.sin(norm));
        ctx.stroke();
      }
      ctx.restore();
    }

    function drawAngleArc(cx, cy, r, startAng, endAng, color, label = '') {
      ctx.save();
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.arc(cx, cy, r, startAng, endAng, false);
      ctx.closePath();
      ctx.fillStyle = color + '33';
      ctx.fill();
      ctx.beginPath();
      ctx.arc(cx, cy, r, startAng, endAng, false);
      ctx.strokeStyle = color;
      ctx.lineWidth = 2.4;
      ctx.stroke();
      if (label) {
        const mid = (startAng + endAng) / 2;
        const tx = cx + (r + 16) * Math.cos(mid), ty = cy + (r + 16) * Math.sin(mid);
        ctx.fillStyle = '#e2e8f0';
        ctx.font = '800 11.5px Pretendard, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(label, tx, ty);
      }
      ctx.restore();
    }

    function drawSmartLabel(px, py, centerX, centerY, text, color = '#e2e8f0', dist = 19) {
      if (!state.steps[3] && state.lens !== 'all') return;
      const dx = px - centerX, dy = py - centerY, len = Math.hypot(dx, dy) || 1;
      const lx = px + (dx / len) * dist, ly = py + (dy / len) * dist;
      ctx.save();
      ctx.font = '800 12px Pretendard, sans-serif';
      const w = ctx.measureText(text).width + 8;
      ctx.fillStyle = 'rgba(10, 28, 21, 0.93)';
      ctx.strokeStyle = '#94A3B8';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.roundRect(lx - w / 2, ly - 8, w, 16, 4);
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle = color;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(text, lx, ly);
      ctx.restore();
    }

    function registerDragHandle(id, x, y, label, onDrag) {
      state.dragHandles.push({ id, x, y, label, onDrag });
      ctx.save();
      ctx.beginPath(); ctx.arc(x, y, 12, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(56, 189, 248, 0.16)'; ctx.fill();
      ctx.beginPath(); ctx.arc(x, y, 6.5, 0, Math.PI * 2);
      ctx.fillStyle = '#38bdf8'; ctx.fill();
      ctx.strokeStyle = '#FFFFFF'; ctx.lineWidth = 2; ctx.stroke();
      if (label) {
        ctx.font = '800 11px Pretendard, sans-serif';
        ctx.fillStyle = '#7dd3fc';
        ctx.textAlign = 'center';
        ctx.fillText(label, x, y - 15);
      }
      ctx.restore();
    }

    function drawAntTape(rect, polyPts, segLabels, segColors, titleNote) {
      if (!state.showAntTape) return;
      const barW = Math.min(rect.width - 40, 480);
      const barX = (rect.width - barW) / 2, barY = rect.height - 64;
      ctx.save();
      ctx.fillStyle = 'rgba(10, 28, 21, 0.96)';
      ctx.strokeStyle = '#94A3B8';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.roundRect(barX - 12, barY - 24, barW + 24, 46, 10);
      ctx.fill(); ctx.stroke();
      ctx.font = '800 11px Pretendard, sans-serif';
      ctx.fillStyle = '#e2e8f0';
      ctx.textAlign = 'left';
      ctx.fillText(`🐜 [테두리 줄자 펼치기] ${titleNote}`, barX, barY - 9);
      let curX = barX;
      const nSeg = segLabels.length;
      for (let i = 0; i < nSeg; i++) {
        const w = (barW / nSeg) - 4;
        ctx.fillStyle = segColors[i % segColors.length] || '#38bdf8';
        ctx.fillRect(curX, barY + 2, w, 14);
        ctx.fillStyle = '#0d241b';
        ctx.font = '800 10px Pretendard, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(segLabels[i], curX + w / 2, barY + 9);
        curX += w + 4;
      }
      ctx.restore();
    }

    // -------------------------------------------------------------------------
    // 2. 16대 핵심 시나리오 명세 (초5~중1 과정 100% 준수 & 외각 활용 강화)
    // -------------------------------------------------------------------------
    function getSpec() {
      const m = state.mode, sub = state.sub[m], p1 = state.p1, p2 = state.p2;

      // [탭 1: 넓이 원리·바깥 액자 (초5~중1)]
      if (m === 1) {
        if (sub === 'triAlt') {
          const isRightH = p2 === 2;
          if (!isRightH) {
            const h = 6, area = (p1 * h) / 2;
            return {
              badge: '1-A · 직각(∟) 레이더 & 둔각삼각형의 바깥 수직높이',
              actionTxt: '🎬 꼭짓점 이동 시연',
              g1Label: '밑변 BC 길이 (a)', g1Btns: [[6,'6cm'],[8,'8cm'],[10,'10cm'],[12,'12cm'],[14,'14cm']],
              g2Label: '유형 전환', g2Btns: [[1,'📐둔각 바깥높이'],[2,'📏직각삼각형 h'],[1,'드래그 실험'],[2,'넓이 2번 식']],
              eqHTML: `<span class="tag-blue">밑변 BC(${p1})</span> × <span class="tag-emerald">수직높이 AH(6)</span> ÷ 2 = <span class="tag-rose">넓이 ${area}cm²</span>`,
              q: `둔각삼각형 ABC에서 밑변 ${tex(`\\overline{BC}=${p1}\\text{cm}`)}, 비스듬한 옆변 ${tex('\\overline{AB}=10\\text{cm}')}, 연장선에 내린 수선 ${tex('\\overline{AH}=6\\text{cm}')}일 때 <strong>삼각형 ABC의 넓이</strong>는?`,
              opts: [
                { t: `① ${area} cm² (밑변×수직높이÷2)`, ok: true, msg: `정답! 비스듬한 옆변(10cm)은 함정입니다! 직각 기호(∟)가 만나는 밑변(${p1})과 수직높이(6)를 곱해 2로 나눕니다!` },
                { t: `② ${p1 * 5} cm² (옆변 10cm 사용)`, ok: false, msg: `직각 기호(∟)가 없는 비스듬한 옆변은 높이가 아닙니다!` },
                { t: `③ ${p1 * 6} cm² (÷2 누락)`, ok: false, msg: `삼각형 넓이는 반드시 2로 나누어야 합니다!` }
              ],
              ans: `직각(∟)을 낀 밑변(${p1})×높이(6)÷2 = <span class="tag-emerald">${area} cm²</span>`,
              stats: [`밑변 BC = ${p1} cm`, `바깥 수직높이 AH = 6 cm`, `함정 옆변 = 10 cm (제외!)`, `넓이 = ${area} cm²`],
              std: `• 둔각삼각형의 높이는 꼭짓점 A에서 밑변 BC의 연장선에 수직(90°)으로 내린 선분 AH의 길이입니다.`,
              fast: `• <strong>직각 네모(∟) 레이더 법칙</strong>: 직각 기호와 만나지 않는 비스듬한 변의 길이는 보자마자 지우세요!`
            };
          } else {
            // 세 변(3k, 4k, 5k)이 모두 정수로 주어진 직각삼각형에서 넓이 2번 구하기
            const k = p1 <= 6 ? 1 : p1 <= 8 ? 2 : 3;
            const a = 3 * k, b = 4 * k, c = 5 * k;
            const area = (a * b) / 2, h = ((a * b) / c).toFixed(1);
            return {
              badge: '1-A · 세 변이 주어진 직각삼각형의 빗변 높이 h (넓이 2번 구하기)',
              actionTxt: '🎬 직사각형 복제',
              g1Label: '직각삼각형 세 변 세트', g1Btns: [[6,'(3,4,5)cm'],[8,'(6,8,10)cm'],[10,'(9,12,15)cm'],[8,'기본 세트'],[10,'확대 세트']],
              g2Label: '유형 전환', g2Btns: [[1,'📐둔각 바깥높이'],[2,'📏직각삼각형 h'],[1,'둔각 보기'],[2,'직각 보기']],
              eqHTML: `<span class="tag-blue">½ × ${a} × ${b} (넓이 ${area})</span> 🟰 <span class="tag-rose">½ × 빗변(${c}) × 높이(h)</span> ⟹ <span class="tag-emerald">h = ${h}cm</span>`,
              q: `세 변의 길이가 각각 ${tex(`${a}\\text{cm}, ${b}\\text{cm}, ${c}\\text{cm}`)}인 직각삼각형 ABC에서 <strong>① 삼각형의 넓이</strong>와 <strong>② 빗변(${c}cm)에 내린 수선의 길이 ${tex('h')}</strong>는?`,
              opts: [
                { t: `① 넓이 ${area}cm², h = ${h}cm`, ok: true, msg: `정답! 직각을 낀 두 변으로 구한 넓이(${area})와 ½×${c}×h가 같으므로 ${a}×${b} = ${c}×h에서 h = ${h}cm입니다!` },
                { t: `② 넓이 ${a*b}cm², h = ${h}cm`, ok: false, msg: `삼각형 넓이는 2로 나누어야 합니다!` },
                { t: `③ 넓이 ${area}cm², h = ${a}cm`, ok: false, msg: `빗변(${c}cm)을 밑변으로 볼 때의 높이 h는 ${a}×${b}÷${c} = ${h}cm입니다!` }
              ],
              ans: `${tex(`\\dfrac{1}{2}\\times ${a}\\times ${b} = \\dfrac{1}{2}\\times ${c}\\times h \\implies`)} <span class="tag-emerald">넓이 ${area}cm², h = ${h}cm</span>`,

            opts: [
              { t: `① ∠x = ${curAns}°`, ok: true, msg: `정답! ●과 × 기호 방정식을 세워 양변을 2로 나누면 ${titles[p2]} 공식에 의해 ∠x = ${curAns}°입니다!` },
              { t: `② ∠x = ${p2===1?ans2:ans1}°`, ok: false, msg: `내+외(${ans1}°), 내+내(${ans2}°), 외+외(${ans3}°) 중 현재 선택된 유형(${p2}번)을 확인하세요!` },

            ],

            stats: [
              `꼭지각 ∠A = ${angA}° (½∠A = ${halfA}°)`,
              `① 내각+외각 교각 = ${ans1}°`,
              `② 내각+내각 교각 = ${ans2}°`,
              `③ 외각+외각 교각 = ${ans3}°`
            ],
            std: `• [① 내+외] 큰 삼각형 외각 ${tex('2\\times = \\angle A + 2\\bullet \\implies \\times - \\bullet = \\dfrac{1}{2}\\angle A')}. 작은 삼각형 외각 ${tex('\\times = \\angle x + \\bullet \\implies \\angle x = \\dfrac{1}{2}\\angle A')}.`,
            fast: `• <strong>3형제 1초 구별</strong>: 옆으로 나란히(내+외) = <strong>½∠A</strong> / 안쪽에서 둔각(내+내) = <strong>90°+½∠A</strong> / 바깥 멀리 예각(외+외) = <strong>90°-½∠A</strong>!`

            actionTxt: '🎬 이등변·외각 점등',

            eqHTML: `<span class="tag-blue">정오각형 한 내각 108°</span> ➔ <span class="tag-emerald">이등변 밑각 36°</span> ➔ <span class="tag-rose">대각선 교각(외각!) = 36°+36° = 72° (둔각 108°)</span>`,
            q: `정오각형 ABCDE에서 두 대각선 AC와 BD의 교점을 P라 할 때, <strong>① ${tex('\\angle BAC')}의 크기</strong>와 <strong>② 두 대각선이 이루는 예각(${tex('\\angle APB')}) 및 둔각(${tex('\\angle BPC')})</strong>은?`,
            opts: [
              { t: `① ∠BAC=36°, 예각 72°, 둔각 108°`, ok: true, msg: `정답! 한 내각이 108°인 이등변삼각형 ΔABC의 두 밑각은 36°이고, 삼각형 외각 성질에 의해 교각은 36°+36°=72° (둔각 108°)입니다!` },
              { t: `② ∠BAC=54°, 예각 72°, 둔각 108°`, ok: false, msg: `(180°-108°)÷2 = 36°이므로 밑각 ∠BAC는 36°입니다!` },
              { t: `③ ∠BAC=36°, 예각 60°, 둔각 120°`, ok: false, msg: `정오각형에서는 36°, 72°, 108°(36°의 1배·2배·3배)만 등장합니다!` }

            std: `• ${tex('\\overline{AB}=\\overline{BC}')}인 이등변삼각형에서 ${tex('\\angle BAC = \\angle BCA = (180^\\circ-108^\\circ)\\div 2 = 36^\\circ')}이고,外각 성질로 교각을 구합니다.`,
            fast: `• <strong>정오각형 황금 각도 3형제(36° · 72° · 108°)</strong>: 뾰족한 각은 무조건 <strong>36°</strong>, 중간 예각은 <strong>72°</strong>, 넓은 둔각은 무조건 <strong>108°</strong>입니다!`
