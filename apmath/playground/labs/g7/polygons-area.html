    // -------------------------------------------------------------------------
    // 3. 메인 2D 캔버스 렌더링 (탭 1 ~ 4 전체 16종)
    // -------------------------------------------------------------------------
    function render() {
      const rect = canvas.parentElement.getBoundingClientRect();
      ctx.clearRect(0, 0, rect.width, rect.height);
      drawAcademicGrid(rect);
      state.dragHandles = [];

      const m = state.mode, sub = state.sub[m], t = state.animProg;
      const p1 = state.p1, p2 = state.p2;
      const cx = rect.width / 2 + state.offsetX;
      const cy = rect.height * 0.49 + state.offsetY;
      const px = Math.min(rect.width, rect.height) * 0.032 * state.scale;

      ctx.save();

      // =======================================================================
      // [탭 1 렌더링: 넓이 원리·바깥 액자]
      // =======================================================================
      if (m === 1) {
        if (sub === 'triAlt') {
          if (p2 !== 2) {
            const aPx = p1 * px, hPx = 6 * px, yBot = cy + hPx / 2, yTop = cy - hPx / 2;
            const pB = { x: cx - aPx * 0.6, y: yBot }, pC = { x: cx - aPx * 0.6 + aPx, y: yBot };
            const ax = cx + (state.dragXRatio - 0.35) * aPx * 2.0 + t * aPx * 0.65;
            const pA = { x: ax, y: yTop }, pH = { x: ax, y: yBot };

            ctx.strokeStyle = '#94a3b8'; ctx.lineWidth = 2; ctx.setLineDash([5, 4]);
            ctx.beginPath(); ctx.moveTo(cx - 230, yBot); ctx.lineTo(cx + 230, yBot); ctx.stroke(); ctx.setLineDash([]);

            ctx.beginPath(); ctx.moveTo(pA.x, pA.y); ctx.lineTo(pB.x, pB.y); ctx.lineTo(pC.x, pC.y); ctx.closePath();
            ctx.fillStyle = 'rgba(56, 189, 248, 0.18)'; ctx.fill();
            ctx.strokeStyle = '#e2e8f0'; ctx.lineWidth = 2.5; ctx.stroke();

            ctx.strokeStyle = '#38bdf8'; ctx.lineWidth = 4.5;
            ctx.beginPath(); ctx.moveTo(pB.x, pB.y); ctx.lineTo(pC.x, pC.y); ctx.stroke();

            ctx.strokeStyle = '#34d399'; ctx.lineWidth = 3; ctx.setLineDash([5, 4]);
            ctx.beginPath(); ctx.moveTo(pA.x, pA.y); ctx.lineTo(pH.x, pH.y); ctx.stroke(); ctx.setLineDash([]);
            drawRightAngle(pH.x, pH.y, Math.PI, 13, '#34d399');

            drawSmartLabel(pB.x, pB.y, cx, cy, 'B'); drawSmartLabel(pC.x, pC.y, cx, cy, 'C');
            drawSmartLabel(pH.x, pH.y + 8, pH.x, pH.y - 20, 'H(수선의 발)', '#34d399', 16);
            registerDragHandle('A', pA.x, pA.y, '꼭짓점 A 드래그', (nx) => {
              state.dragXRatio = Math.max(0.05, Math.min(0.95, 0.35 + (nx - cx) / (aPx * 2.0)));
            });
          } else {
            const k = p1 <= 6 ? 1 : p1 <= 8 ? 2 : 3;
            const a = 3 * k, b = 4 * k, c = 5 * k;
            const aPx = a * px * 1.1, bPx = b * px * 1.1, cPx = c * px * 1.1, hPx = (aPx * bPx) / cPx;
            const yBot = cy + hPx * 0.5, yTop = yBot - hPx;
            const pB = { x: cx - cPx / 2, y: yBot }, pC = { x: cx + cPx / 2, y: yBot };
            const xH = pB.x + (aPx * aPx) / cPx;
            const pA = { x: xH, y: yTop }, pH = { x: xH, y: yBot };

            ctx.beginPath(); ctx.moveTo(pA.x, pA.y); ctx.lineTo(pB.x, pB.y); ctx.lineTo(pC.x, pC.y); ctx.closePath();
            ctx.fillStyle = 'rgba(56, 189, 248, 0.18)'; ctx.fill();
            ctx.strokeStyle = '#e2e8f0'; ctx.lineWidth = 2.5; ctx.stroke();

            if (t > 0.02) {
              const piv = { x: (pA.x + pC.x) / 2, y: (pA.y + pC.y) / 2 };
              ctx.save(); ctx.translate(piv.x, piv.y); ctx.rotate(t * Math.PI); ctx.translate(-piv.x, -piv.y);
              ctx.beginPath(); ctx.moveTo(pA.x, pA.y); ctx.lineTo(pB.x, pB.y); ctx.lineTo(pC.x, pC.y); ctx.closePath();
              ctx.fillStyle = 'rgba(52, 211, 153, 0.18)'; ctx.fill();
              ctx.strokeStyle = '#34d399'; ctx.setLineDash([5, 4]); ctx.stroke(); ctx.restore();
            }

            drawRightAngle(pA.x, pA.y, Math.atan2(pB.y - pA.y, pB.x - pA.x), 12, '#38bdf8');
            drawRightAngle(pH.x, pH.y, Math.PI, 12, '#fb7185');
            ctx.strokeStyle = '#fb7185'; ctx.lineWidth = 3.5;
            ctx.beginPath(); ctx.moveTo(pA.x, pA.y); ctx.lineTo(pH.x, pH.y); ctx.stroke();

            drawSmartLabel(pA.x, pA.y, cx, cy, 'A(90°)');
            drawSmartLabel(pB.x, pB.y, cx, cy, `B`);
            drawSmartLabel(pC.x, pC.y, cx, cy, `C`);
            drawSmartLabel(pH.x, pH.y + 8, pH.x, pH.y - 20, `h=${((a*b)/c).toFixed(1)}cm`, '#fb7185', 16);
          }
        } else if (sub === 'paraMove') {
          const aPx = p1 * px, hPx = 6 * px, cutW = aPx * 0.28;
          const x0 = cx - aPx / 2, yBot = cy + hPx / 2, yTop = cy - hPx / 2;

          ctx.beginPath();
          ctx.moveTo(x0 + cutW, yBot); ctx.lineTo(x0 + aPx, yBot);
          ctx.lineTo(x0 + aPx + cutW, yTop); ctx.lineTo(x0 + cutW, yTop); ctx.closePath();
          ctx.fillStyle = 'rgba(56, 189, 248, 0.18)'; ctx.fill();
          ctx.strokeStyle = '#e2e8f0'; ctx.lineWidth = 2.5; ctx.stroke();

          const sh = t * aPx;
          ctx.beginPath();
          ctx.moveTo(x0 + sh, yBot); ctx.lineTo(x0 + cutW + sh, yBot); ctx.lineTo(x0 + cutW + sh, yTop); ctx.closePath();
          ctx.fillStyle = 'rgba(244, 63, 94, 0.22)'; ctx.fill();
          ctx.strokeStyle = '#fb7185'; ctx.lineWidth = 2.5; ctx.stroke();

          drawRightAngle(x0 + cutW + sh, yBot, Math.PI, 12, '#fb7185');
          drawParallelArrows(x0 + cutW, yTop, x0 + aPx + cutW, yTop, 2, '#34d399');
          drawParallelArrows(x0, yBot, x0 + aPx, yBot, 2, '#34d399');
        } else if (sub === 'trapRot') {
          const b = Math.max(2, p1 - 4), aPx = p1 * px, bPx = b * px, hPx = 6 * px;
          const offL = (aPx - bPx) * 0.35, x0 = cx - (aPx + bPx * t) / 2, yBot = cy + hPx / 2, yTop = cy - hPx / 2;
          const trap = [{ x: x0, y: yBot }, { x: x0 + aPx, y: yBot }, { x: x0 + offL + bPx, y: yTop }, { x: x0 + offL, y: yTop }];

          ctx.beginPath(); ctx.moveTo(trap[0].x, trap[0].y); trap.forEach((p) => ctx.lineTo(p.x, p.y)); ctx.closePath();
          ctx.fillStyle = 'rgba(56, 189, 248, 0.18)'; ctx.fill();
          ctx.strokeStyle = '#e2e8f0'; ctx.lineWidth = 2.5; ctx.stroke();

          if (p2 === 2 || p2 === 3 || state.lens === 'aux') {
            ctx.strokeStyle = '#34d399'; ctx.lineWidth = 2; ctx.setLineDash([5, 4]);
            ctx.beginPath(); ctx.moveTo(trap[3].x, trap[3].y); ctx.lineTo(trap[1].x, trap[1].y); ctx.stroke(); ctx.setLineDash([]);
          }

          if (t > 0.02) {
            const piv = { x: (trap[1].x + trap[2].x) / 2, y: (trap[1].y + trap[2].y) / 2 };
            ctx.save(); ctx.translate(piv.x, piv.y); ctx.rotate(t * Math.PI); ctx.translate(-piv.x, -piv.y);
            ctx.beginPath(); ctx.moveTo(trap[0].x, trap[0].y); trap.forEach((p) => ctx.lineTo(p.x, p.y)); ctx.closePath();
            ctx.fillStyle = 'rgba(244, 63, 94, 0.18)'; ctx.fill();
            ctx.strokeStyle = '#fb7185'; ctx.setLineDash([5, 4]); ctx.lineWidth = 2; ctx.stroke(); ctx.restore();
          }
          drawParallelArrows(trap[3].x, trap[3].y, trap[2].x, trap[2].y, 1);
          drawParallelArrows(trap[0].x, trap[0].y, trap[1].x, trap[1].y, 1);
        } else {
          // boxFrame
          const wPx = p1 * px * 1.1, hPx = 6 * px * 1.1, x0 = cx - wPx / 2, y0 = cy - hPx / 2;
          ctx.strokeStyle = '#94a3b8'; ctx.lineWidth = 2; ctx.setLineDash([5, 4]);
          ctx.strokeRect(x0, y0, wPx, hPx); ctx.setLineDash([]);

          if (p2 < 3) {
            const pA = { x: cx, y: y0 }, pB = { x: x0, y: cy }, pC = { x: cx, y: y0 + hPx }, pD = { x: x0 + wPx, y: cy };
            ctx.beginPath(); ctx.moveTo(pA.x, pA.y); ctx.lineTo(pB.x, pB.y); ctx.lineTo(pC.x, pC.y); ctx.lineTo(pD.x, pD.y); ctx.closePath();
            ctx.fillStyle = 'rgba(56, 189, 248, 0.22)'; ctx.fill();
            ctx.strokeStyle = '#e2e8f0'; ctx.lineWidth = 2.5; ctx.stroke();
            drawRightAngle(cx, cy, 0, 12);
            if (t > 0.02) {
              [
                { c: { x: x0, y: y0 }, p1: pA, p2: pB },
                { c: { x: x0 + wPx, y: y0 }, p1: pA, p2: pD },
                { c: { x: x0, y: y0 + hPx }, p1: pC, p2: pB },
                { c: { x: x0 + wPx, y: y0 + hPx }, p1: pC, p2: pD }
              ].forEach((cn) => {
                ctx.beginPath();
                ctx.moveTo(cn.c.x + t * (cx - cn.c.x), cn.c.y + t * (cy - cn.c.y));
                ctx.lineTo(cn.p1.x, cn.p1.y); ctx.lineTo(cn.p2.x, cn.p2.y); ctx.closePath();
                ctx.fillStyle = 'rgba(244, 63, 94, 0.22)'; ctx.fill();
                ctx.strokeStyle = '#fb7185'; ctx.stroke();
              });
            }
          } else {
            const pA = { x: x0, y: y0 + hPx * 0.33 }, pB = { x: x0 + wPx * 0.38, y: y0 + hPx }, pC = { x: x0 + wPx, y: y0 };
            ctx.beginPath(); ctx.moveTo(pA.x, pA.y); ctx.lineTo(pB.x, pB.y); ctx.lineTo(pC.x, pC.y); ctx.closePath();
            ctx.fillStyle = 'rgba(56, 189, 248, 0.24)'; ctx.fill();
            ctx.strokeStyle = '#e2e8f0'; ctx.lineWidth = 2.5; ctx.stroke();
            const sep = t * 20;
            [
              { pts: [{ x: x0, y: y0 }, pA, pC], dx: -sep, dy: -sep, l: '①' },
              { pts: [{ x: x0, y: y0 + hPx }, pA, pB], dx: -sep, dy: sep, l: '②' },
              { pts: [{ x: x0 + wPx, y: y0 + hPx }, pB, pC], dx: sep, dy: sep, l: '③' }
            ].forEach((cn) => {
              ctx.save(); ctx.translate(cn.dx, cn.dy);
              ctx.beginPath(); ctx.moveTo(cn.pts[0].x, cn.pts[0].y); ctx.lineTo(cn.pts[1].x, cn.pts[1].y); ctx.lineTo(cn.pts[2].x, cn.pts[2].y); ctx.closePath();
              ctx.fillStyle = 'rgba(244, 63, 94, 0.20)'; ctx.fill();
              ctx.strokeStyle = '#fb7185'; ctx.stroke();
              ctx.restore();
            });
          }
        }
      }

      // =======================================================================
      // [탭 2 렌더링: 평행선 넓이·산책로·둘레]
      // =======================================================================
      else if (m === 2) {
        if (sub === 'railWing') {
          const aPx = p1 * px * 1.1, hPx = 6 * px * 1.1, yTop = cy - hPx / 2, yBot = cy + hPx / 2;
          if (p2 >= 3) {
            ctx.strokeStyle = '#34d399'; ctx.lineWidth = 2.2;
            ctx.beginPath(); ctx.moveTo(cx - 240, yTop); ctx.lineTo(cx + 240, yTop); ctx.moveTo(cx - 240, yBot); ctx.lineTo(cx + 240, yBot); ctx.stroke();
            drawParallelArrows(cx - 180, yTop, cx + 180, yTop, 2); drawParallelArrows(cx - 180, yBot, cx + 180, yBot, 2);

            const pB = { x: cx - aPx / 2, y: yBot }, pC = { x: cx + aPx / 2, y: yBot };
            const ax = cx + (state.dragXRatio - 0.5 + (t - 0.3) * 0.6) * 280;
            const pA = { x: ax, y: yTop };

            ctx.beginPath(); ctx.moveTo(pA.x, pA.y); ctx.lineTo(pB.x, pB.y); ctx.lineTo(pC.x, pC.y); ctx.closePath();
            ctx.fillStyle = 'rgba(56, 189, 248, 0.20)'; ctx.fill();
            ctx.strokeStyle = '#e2e8f0'; ctx.lineWidth = 2.5; ctx.stroke();
            registerDragHandle('A', pA.x, pA.y, '꼭짓점 A 드래그', (nx) => { state.dragXRatio = Math.max(0.1, Math.min(0.9, 0.5 + (nx - cx) / 280)); });
            drawAntTape(rect, [pA, pB, pC], ['옆변 AB', `밑변 BC(${p1})`, '옆변 CA'], ['#fb7185', '#38bdf8', '#34d399'], `넓이는 ${(p1*6)/2}cm² 불변, 둘레는 변화!`);
          } else {
            const pB = { x: cx - aPx / 2, y: yBot }, pC = { x: cx + aPx / 2, y: yBot };
            const pA = { x: cx - aPx / 6, y: yTop }, pD = { x: cx + aPx / 6, y: yTop };
            const denom = (pA.x - pC.x) * (pB.y - pD.y) - (pA.y - pC.y) * (pB.x - pD.x) || 1;
            const tI = ((pA.x - pB.x) * (pB.y - pD.y) - (pA.y - pB.y) * (pB.x - pD.x)) / denom;
            const pO = { x: pA.x + tI * (pC.x - pA.x), y: pA.y + tI * (pC.y - pA.y) };

            ctx.beginPath(); ctx.moveTo(pA.x, pA.y); ctx.lineTo(pB.x, pB.y); ctx.lineTo(pC.x, pC.y); ctx.lineTo(pD.x, pD.y); ctx.closePath();
            ctx.strokeStyle = '#e2e8f0'; ctx.lineWidth = 2; ctx.stroke();
            drawParallelArrows(pA.x, pA.y, pD.x, pD.y, 2); drawParallelArrows(pB.x, pB.y, pC.x, pC.y, 2);

            [[pA, pB, pO], [pD, pC, pO]].forEach((tr) => {
              ctx.beginPath(); ctx.moveTo(tr[0].x, tr[0].y); ctx.lineTo(tr[1].x, tr[1].y); ctx.lineTo(tr[2].x, tr[2].y); ctx.closePath();
              ctx.fillStyle = 'rgba(56, 189, 248, 0.25)'; ctx.fill();
              ctx.strokeStyle = '#38bdf8'; ctx.lineWidth = 2.8; ctx.stroke();
            });

            ctx.save(); ctx.translate(0, t * 42);
            ctx.beginPath(); ctx.moveTo(pO.x, pO.y); ctx.lineTo(pB.x, pB.y); ctx.lineTo(pC.x, pC.y); ctx.closePath();
            ctx.fillStyle = 'rgba(244, 63, 94, 0.22)'; ctx.fill();
            ctx.strokeStyle = '#fb7185'; ctx.lineWidth = 2.5; ctx.stroke();
            ctx.restore();

            drawSmartLabel(pA.x, pA.y, cx, cy, 'A'); drawSmartLabel(pB.x, pB.y, cx, cy, 'B');
            drawSmartLabel(pC.x, pC.y, cx, cy, 'C'); drawSmartLabel(pD.x, pD.y, cx, cy, 'D');
          }
        } else if (sub === 'baseRatio') {
          const mL = p1, nL = p2 + 1, totW = (mL + nL) * px * 1.15, hPx = 6 * px * 1.1;
          const x0 = cx - totW / 2, yBot = cy + hPx / 2, yTop = cy - hPx / 2;
          const pB = { x: x0, y: yBot }, pD = { x: x0 + (mL / (mL + nL)) * totW, y: yBot }, pC = { x: x0 + totW, y: yBot }, pA = { x: cx - 15, y: yTop };
          const sep = t * 14;

          ctx.save(); ctx.translate(-sep, 0);
          ctx.beginPath(); ctx.moveTo(pA.x, pA.y); ctx.lineTo(pB.x, pB.y); ctx.lineTo(pD.x, pD.y); ctx.closePath();
          ctx.fillStyle = 'rgba(56, 189, 248, 0.22)'; ctx.fill(); ctx.strokeStyle = '#38bdf8'; ctx.lineWidth = 2.5; ctx.stroke();
          ctx.restore();

          ctx.save(); ctx.translate(sep, 0);
          ctx.beginPath(); ctx.moveTo(pA.x, pA.y); ctx.lineTo(pD.x, pD.y); ctx.lineTo(pC.x, pC.y); ctx.closePath();
          ctx.fillStyle = 'rgba(244, 63, 94, 0.22)'; ctx.fill(); ctx.strokeStyle = '#fb7185'; ctx.lineWidth = 2.5; ctx.stroke();
          ctx.restore();

          drawSmartLabel(pA.x, pA.y, cx, cy, 'A(높이 공유)');
          drawSmartLabel(pB.x, pB.y, cx, cy, `B(${mL})`);
          drawSmartLabel(pD.x, pD.y, cx, cy, 'D');
          drawSmartLabel(pC.x, pC.y, cx, cy, `C(${nL})`);
        } else if (sub === 'roadMerge') {
          const W = p1, H = 8, x = p2, WPx = W * px * 0.85, HPx = H * px * 0.85, rPx = x * px * 0.85;
          const x0 = cx - WPx / 2, y0 = cy - HPx / 2, gap = (1 - t) * rPx, sl = (p2 % 2 === 0 ? 1 : 0) * (1 - t) * 24;
          const w1 = (WPx - rPx) * 0.45, w2 = (WPx - rPx) * 0.55, h1 = (HPx - rPx) * 0.45, h2 = (HPx - rPx) * 0.55;

          ctx.strokeStyle = '#94A3B8'; ctx.setLineDash([5, 4]); ctx.strokeRect(x0, y0, WPx, HPx); ctx.setLineDash([]);
          [
            [{x:x0,y:y0},{x:x0+w1+sl,y:y0},{x:x0+w1,y:y0+h1},{x:x0,y:y0+h1}],
            [{x:x0+w1+gap+sl,y:y0},{x:x0+w1+w2+gap,y:y0},{x:x0+w1+w2+gap,y:y0+h1},{x:x0+w1+gap,y:y0+h1}],
            [{x:x0,y:y0+h1+gap},{x:x0+w1,y:y0+h1+gap},{x:x0+w1-sl,y:y0+h1+h2+gap},{x:x0,y:y0+h1+h2+gap}],
            [{x:x0+w1+gap,y:y0+h1+gap},{x:x0+w1+w2+gap,y:y0+h1+gap},{x:x0+w1+w2+gap,y:y0+h1+h2+gap},{x:x0+w1+gap-sl,y:y0+h1+h2+gap}]
          ].forEach((q) => {
            ctx.beginPath(); ctx.moveTo(q[0].x, q[0].y); q.forEach((p) => ctx.lineTo(p.x, p.y)); ctx.closePath();
            ctx.fillStyle = 'rgba(52, 211, 153, 0.26)'; ctx.fill();
            ctx.strokeStyle = '#34d399'; ctx.lineWidth = 2.5; ctx.stroke();
          });
        } else {
          // stairFold
          if (p2 < 3) {
            const wPx = p1 * px * 0.78, hPx = 8 * px * 0.78, y0 = cy - hPx / 2, lx = cx - wPx - 20, cW = wPx * 0.4, cH = hPx * 0.4;
            ctx.fillStyle = 'rgba(56, 189, 248, 0.16)';
            ctx.beginPath(); ctx.moveTo(lx, y0); ctx.lineTo(lx+wPx-cW, y0); ctx.lineTo(lx+wPx-cW, y0+cH); ctx.lineTo(lx+wPx, y0+cH); ctx.lineTo(lx+wPx, y0+hPx); ctx.lineTo(lx, y0+hPx); ctx.closePath();
            ctx.fill(); ctx.strokeStyle = '#e2e8f0'; ctx.lineWidth = 2.5; ctx.stroke();

            ctx.strokeStyle = '#38bdf8'; ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(lx+wPx-cW, y0+(1-t)*cH); ctx.lineTo(lx+wPx, y0+(1-t)*cH);
            ctx.moveTo(lx+wPx-(1-t)*cW, y0); ctx.lineTo(lx+wPx-(1-t)*cW, y0+cH);
            ctx.stroke();

            const rx = cx + 20, dW = wPx * 0.36, dH = 2 * px * 0.78, dx1 = rx + (wPx - dW) / 2, dx2 = dx1 + dW;
            ctx.fillStyle = 'rgba(244, 63, 94, 0.14)';
            ctx.beginPath(); ctx.moveTo(rx, y0); ctx.lineTo(dx1, y0); ctx.lineTo(dx1, y0+dH); ctx.lineTo(dx2, y0+dH); ctx.lineTo(dx2, y0); ctx.lineTo(rx+wPx, y0); ctx.lineTo(rx+wPx, y0+hPx); ctx.lineTo(rx, y0+hPx); ctx.closePath();
            ctx.fill(); ctx.strokeStyle = '#e2e8f0'; ctx.lineWidth = 2.5; ctx.stroke();

            ctx.strokeStyle = '#38bdf8'; ctx.lineWidth = 4;
            ctx.beginPath(); ctx.moveTo(dx1, y0+(1-t)*dH); ctx.lineTo(dx2, y0+(1-t)*dH); ctx.stroke();
            ctx.strokeStyle = '#fb7185'; ctx.lineWidth = 4.5;
            ctx.beginPath(); ctx.moveTo(dx1, y0); ctx.lineTo(dx1, y0+dH); ctx.moveTo(dx2, y0); ctx.lineTo(dx2, y0+dH); ctx.stroke();
          } else {
            const ang = p1 <= 10 ? 55 + p1 : 65, wPx = 5 * px * 1.25, yTop = cy - wPx / 2, yBot = cy + wPx / 2;
            ctx.fillStyle = 'rgba(148, 163, 184, 0.14)'; ctx.fillRect(cx - 200, yTop, 400, wPx);
            ctx.strokeStyle = '#94a3b8'; ctx.lineWidth = 2; ctx.strokeRect(cx - 200, yTop, 400, wPx);
            drawParallelArrows(cx - 160, yTop, cx - 80, yTop, 2); drawParallelArrows(cx - 160, yBot, cx - 80, yBot, 2);

            const rad = (ang * Math.PI) / 180, halfB = wPx / Math.tan(rad);
            const pA = { x: cx, y: yTop }, pB = { x: cx - halfB, y: yBot }, pC = { x: cx + halfB, y: yBot };
            ctx.beginPath(); ctx.moveTo(pA.x, pA.y); ctx.lineTo(pB.x, pB.y); ctx.lineTo(pC.x, pC.y); ctx.closePath();
            ctx.fillStyle = 'rgba(56, 189, 248, 0.24)'; ctx.fill();
            ctx.strokeStyle = '#38bdf8'; ctx.lineWidth = 3; ctx.stroke();
            drawTickMarks(pA.x, pA.y, pB.x, pB.y, 2); drawTickMarks(pA.x, pA.y, pC.x, pC.y, 2);

            drawSmartLabel(pA.x, pA.y, cx, cy, `A(${180 - 2*ang}°)`);
            drawSmartLabel(pB.x, pB.y, cx, cy, `B(●${ang}°)`, '#38bdf8');
            drawSmartLabel(pC.x, pC.y, cx, cy, `C(●${ang}°)`, '#fb7185');
          }
        }
      }

      // =======================================================================
      // [탭 3 렌더링: 다각형 대각선(n-3)·내각·외각 360°]
      // =======================================================================
      else if (m === 3) {
        const n = Math.max(4, Math.min(10, p1));
        const R = Math.min(rect.width, rect.height) * 0.28 * state.scale;
        const verts = Array.from({ length: n }, (_, i) => {
          const a = -Math.PI / 2 + (i * Math.PI * 2) / n;
          return { x: cx + R * Math.cos(a), y: cy + R * Math.sin(a) };
        });

        if (sub === 'oneDiag') {
          const cols = ['rgba(56,189,248,0.20)', 'rgba(52,211,153,0.20)', 'rgba(245,158,11,0.20)', 'rgba(244,63,94,0.20)'];
          for (let i = 1; i < n - 1; i++) {
            const mx = (verts[0].x + verts[i].x + verts[i + 1].x) / 3, my = (verts[0].y + verts[i].y + verts[i + 1].y) / 3;
            ctx.save(); ctx.translate((mx - cx) * 0.14 * t, (my - cy) * 0.14 * t);
            ctx.beginPath(); ctx.moveTo(verts[0].x, verts[0].y); ctx.lineTo(verts[i].x, verts[i].y); ctx.lineTo(verts[i + 1].x, verts[i + 1].y); ctx.closePath();
            ctx.fillStyle = cols[(i - 1) % cols.length]; ctx.fill();
            ctx.strokeStyle = '#e2e8f0'; ctx.lineWidth = 2; ctx.stroke();
            ctx.restore();
          }
          for (let i = 2; i < n - 1; i++) {
            ctx.beginPath(); ctx.moveTo(verts[0].x, verts[0].y); ctx.lineTo(verts[i].x, verts[i].y);
            ctx.strokeStyle = '#38bdf8'; ctx.lineWidth = 3.5; ctx.stroke();
          }
          verts.forEach((p, i) => {
            const bad = i === 0 || i === 1 || i === n - 1;
            drawSmartLabel(p.x, p.y, cx, cy, bad ? '금지(✕)' : `대각선!`, bad ? '#fb7185' : '#38bdf8', 20);
          });
        } else if (sub === 'inPointO') {
          const pO = { x: cx + (state.dragXRatio - 0.35) * 70, y: cy + (state.dragYRatio - 0.45) * 70 };
          for (let i = 0; i < n; i++) {
            const v1 = verts[i], v2 = verts[(i + 1) % n];
            ctx.beginPath(); ctx.moveTo(pO.x, pO.y); ctx.lineTo(v1.x, v1.y); ctx.lineTo(v2.x, v2.y); ctx.closePath();
            ctx.fillStyle = i % 2 === 0 ? 'rgba(56,189,248,0.18)' : 'rgba(52,211,153,0.18)'; ctx.fill();
            ctx.strokeStyle = '#e2e8f0'; ctx.lineWidth = 2; ctx.stroke();
          }
          ctx.beginPath(); ctx.arc(pO.x, pO.y, 26 + t * 10, 0, Math.PI * 2);
          ctx.fillStyle = 'rgba(244, 63, 94, 0.32)'; ctx.fill();
          ctx.strokeStyle = '#fb7185'; ctx.lineWidth = 2.5; ctx.stroke();
          registerDragHandle('O', pO.x, pO.y, '점 O (360° 빼기!)', (nx, ny) => { state.dragXRatio = 0.35 + (nx - cx) / 70; state.dragYRatio = 0.45 + (ny - cy) / 70; });
        } else if (sub === 'allDiag') {
          ctx.beginPath(); ctx.moveTo(verts[0].x, verts[0].y); verts.forEach((p) => ctx.lineTo(p.x, p.y)); ctx.closePath();
          ctx.strokeStyle = '#e2e8f0'; ctx.lineWidth = 3; ctx.stroke();
          const diags = [];
          for (let i = 0; i < n; i++) {
            for (let j = i + 2; j < n; j++) {
              if (i === 0 && j === n - 1) continue;
              diags.push([verts[i], verts[j]]);
            }
          }
          const cnt = t > 0.04 ? Math.ceil(t * diags.length) : diags.length;
          for (let k = 0; k < cnt; k++) {
            ctx.beginPath(); ctx.moveTo(diags[k][0].x, diags[k][0].y); ctx.lineTo(diags[k][1].x, diags[k][1].y);
            ctx.strokeStyle = k < n - 3 ? '#fb7185' : 'rgba(56,189,248,0.55)';
            ctx.lineWidth = k < n - 3 ? 3.2 : 1.8; ctx.stroke();
          }
          verts.forEach((p, i) => drawSmartLabel(p.x, p.y, cx, cy, `P${i + 1}`));
        } else {
          // ext360
          const curR = (1 - t) * R * 0.85, secR = 46 * state.scale;
          const vCur = Array.from({ length: n }, (_, i) => {
            const a = -Math.PI / 2 + (i * Math.PI * 2) / n;
            return { x: cx + curR * Math.cos(a), y: cy + curR * Math.sin(a) };
          });
          const cols = ['#38bdf8', '#fb7185', '#34d399', '#fbbf24', '#7C3AED', '#DB2777', '#0891B2', '#4F46E5'];
          for (let i = 0; i < n; i++) {
            const aPrev = -Math.PI / 2 + ((i - 1) * Math.PI * 2) / n;
            const aCurr = -Math.PI / 2 + (i * Math.PI * 2) / n;
            const aNext = -Math.PI / 2 + ((i + 1) * Math.PI * 2) / n;
            const sA = Math.atan2(Math.sin(aCurr) - Math.sin(aPrev), Math.cos(aCurr) - Math.cos(aPrev));
            const eA = Math.atan2(Math.sin(aNext) - Math.sin(aCurr), Math.cos(aNext) - Math.cos(aCurr));

            ctx.beginPath(); ctx.moveTo(vCur[i].x, vCur[i].y); ctx.arc(vCur[i].x, vCur[i].y, secR, sA, eA, false); ctx.closePath();
            ctx.fillStyle = cols[i % cols.length] + '44'; ctx.fill();
            ctx.strokeStyle = cols[i % cols.length]; ctx.lineWidth = 2; ctx.stroke();
          }
          if (curR > 2) {
            ctx.beginPath(); ctx.moveTo(vCur[0].x, vCur[0].y); vCur.forEach((p) => ctx.lineTo(p.x, p.y)); ctx.closePath();
            ctx.fillStyle = '#0d241b'; ctx.fill();
            ctx.strokeStyle = '#e2e8f0'; ctx.lineWidth = 3; ctx.stroke();
          }
        }
      }

      // =======================================================================
      // [탭 4 렌더링: 별모양 & 복잡한 도형의 삼각형 외각 마스터!]
      // =======================================================================
      else if (m === 4) {
        if (sub === 'stepExt') {
          if (p2 === 1) {
            // 기본 삼각형 외각 색종이 이동
            const yBot = cy + 70, pB = { x: cx - 145, y: yBot }, pC = { x: cx + 30, y: yBot }, pD = { x: cx + 185, y: yBot }, pA = { x: cx - 60, y: cy - 90 };
            ctx.beginPath(); ctx.moveTo(pA.x, pA.y); ctx.lineTo(pB.x, pB.y); ctx.lineTo(pC.x, pC.y); ctx.closePath();
            ctx.fillStyle = 'rgba(56, 189, 248, 0.16)'; ctx.fill();
            ctx.strokeStyle = '#e2e8f0'; ctx.lineWidth = 2.8; ctx.stroke();
            ctx.beginPath(); ctx.moveTo(pC.x, pC.y); ctx.lineTo(pD.x, pD.y); ctx.stroke();

            const pE = { x: pC.x + (pA.x - pB.x), y: pC.y + (pA.y - pB.y) };
            if (state.steps[2] || t > 0.05 || state.lens === 'aux') {
              ctx.strokeStyle = '#34d399'; ctx.lineWidth = 2.2; ctx.setLineDash([5, 4]);
              ctx.beginPath(); ctx.moveTo(pC.x, pC.y); ctx.lineTo(pE.x, pE.y); ctx.stroke(); ctx.setLineDash([]);
              drawParallelArrows(pB.x, pB.y, pA.x, pA.y, 2); drawParallelArrows(pC.x, pC.y, pE.x, pE.y, 2);
            }
            const angCA = Math.atan2(pA.y - pC.y, pA.x - pC.x), angCE = Math.atan2(pE.y - pC.y, pE.x - pC.x);
            const A = p1 <= 10 ? p1 * 6 : 50, B = 60;
            drawAngleArc(pA.x + t*(pC.x - pA.x), pA.y + t*(pC.y - pA.y), 38, angCA, angCE, '#38bdf8', `${A}°`);
            drawAngleArc(pB.x + t*(pC.x - pB.x), pB.y + t*(pC.y - pB.y), 38, angCE, 0, '#fb7185', `${B}°`);
            drawSmartLabel(pA.x, pA.y, cx, cy, 'A'); drawSmartLabel(pB.x, pB.y, cx, cy, 'B');
            drawSmartLabel(pC.x, pC.y + 10, pC.x, pC.y - 20, `외각 = ${A+B}°`, '#34d399', 18);
          } else {
            // 등변 사슬 AB=BC=CD(=DE)로 x, 2x, 3x, 4x 외각이 실제로 성립하도록 구성
            const stepsCnt = p2 === 2 ? 3 : 4;
            const xDeg = p1 * 2 + 4;
            const xRad = xDeg * Math.PI / 180;
            const cosX = Math.cos(xRad), sinX = Math.sin(xRad);
            const cos2X = Math.cos(2 * xRad), cos3X = Math.cos(3 * xRad);
            const side = Math.min(118, (rect.width - 80) / (2 * cosX + (stepsCnt === 4 ? 2 * cos3X : 1.15)));
            const baseY = cy + 55;
            const baseSpan = 2 * side * cosX + (stepsCnt === 4 ? 2 * side * cos3X : side * 1.15);
            const pA = { x: cx - baseSpan / 2, y: baseY };
            const pB = { x: pA.x + side * cosX, y: baseY - side * sinX };
            const pC = { x: pA.x + 2 * side * cosX, y: baseY };
            const pD = {
              x: pB.x + 2 * side * cos2X * cosX,
              y: pB.y - 2 * side * cos2X * sinX
            };
            const pE = {
              x: pC.x + (stepsCnt === 4 ? 2 * side * cos3X : side * 1.15),
              y: baseY
            };
            const pBeyondD = { x: pD.x + side * 0.58 * cosX, y: pD.y - side * 0.58 * sinX };

            // 세 등변삼각형: ABC, BCD, 그리고 4단에서 CDE
            const tris = [
              { pts: [pA, pB, pC], col: 'rgba(56, 189, 248, 0.18)' },
              { pts: [pB, pC, pD], col: 'rgba(52, 211, 153, 0.18)' }
            ];
            if (stepsCnt === 4) tris.push({ pts: [pC, pD, pE], col: 'rgba(244, 63, 94, 0.18)' });
            for (const tr of tris) {
              ctx.beginPath(); ctx.moveTo(tr.pts[0].x, tr.pts[0].y); ctx.lineTo(tr.pts[1].x, tr.pts[1].y); ctx.lineTo(tr.pts[2].x, tr.pts[2].y); ctx.closePath();
              ctx.fillStyle = tr.col; ctx.fill();
            }

            // 기준선 A-C-E, 연장선 A-B-D, 그리고 등변 사슬 B-C-D-E
            ctx.strokeStyle = '#475569'; ctx.lineWidth = 2.6; ctx.setLineDash([]);
            ctx.beginPath();
            ctx.moveTo(pA.x, pA.y); ctx.lineTo(pE.x, pE.y);
            ctx.moveTo(pA.x, pA.y); ctx.lineTo(pD.x, pD.y);
            ctx.moveTo(pB.x, pB.y); ctx.lineTo(pC.x, pC.y);
            ctx.lineTo(pD.x, pD.y);
            if (stepsCnt === 4) ctx.lineTo(pE.x, pE.y);
            ctx.stroke();

            // 4x 외각은 AD의 D 바깥 연장선에서 측정
            if (stepsCnt === 4) {
              ctx.strokeStyle = '#94A3B8'; ctx.lineWidth = 2.0; ctx.setLineDash([5, 4]);
              ctx.beginPath(); ctx.moveTo(pD.x, pD.y); ctx.lineTo(pBeyondD.x, pBeyondD.y); ctx.stroke(); ctx.setLineDash([]);
            }

            // AB=BC=CD(=DE) 표식을 같은 한 개 틱으로 표시
            drawTickMarks(pA.x, pA.y, pB.x, pB.y, 1, '#fb7185');
            drawTickMarks(pB.x, pB.y, pC.x, pC.y, 1, '#fb7185');
            drawTickMarks(pC.x, pC.y, pD.x, pD.y, 1, '#fb7185');
            if (stepsCnt === 4) drawTickMarks(pD.x, pD.y, pE.x, pE.y, 1, '#fb7185');

            const aAB = Math.atan2(pB.y - pA.y, pB.x - pA.x);
            const aBD = Math.atan2(pD.y - pB.y, pD.x - pB.x);
            const aBC = Math.atan2(pC.y - pB.y, pC.x - pB.x);
            const aCD = Math.atan2(pD.y - pC.y, pD.x - pC.x);
            const aCE = Math.atan2(pE.y - pC.y, pE.x - pC.x);
            const aAD = Math.atan2(pD.y - pA.y, pD.x - pA.x);
            const aDE = Math.atan2(pE.y - pD.y, pE.x - pD.x);
            const arcR = Math.max(20, Math.min(29, side * 0.24));
            drawAngleArc(pA.x, pA.y, arcR, aAB, 0, '#38bdf8', `x=${xDeg}°`);
            drawAngleArc(pB.x, pB.y, arcR, aBD, aBC, '#34d399', `2x=${2 * xDeg}°`);
            drawAngleArc(pC.x, pC.y, arcR, aCD, aCE, '#fb7185', `3x=${3 * xDeg}°`);
            if (stepsCnt === 4) drawAngleArc(pD.x, pD.y, arcR, aAD, aDE, '#fda4af', `4x=${4 * xDeg}°`);

            drawSmartLabel(pA.x, pA.y, pA.x + 18, pA.y, 'A');
            drawSmartLabel(pB.x, pB.y, pB.x, pB.y + 18, 'B');
            drawSmartLabel(pC.x, pC.y, pC.x - 18, pC.y, 'C');
            drawSmartLabel(pD.x, pD.y, pD.x + 20, pD.y - 14, 'D', '#e2e8f0', 19);
            if (stepsCnt === 4) drawSmartLabel(pE.x, pE.y, pE.x - 18, pE.y, 'E');
          }
        } else if (sub === 'boomBow') {
          if (p2 < 3) {
            const pA = { x: cx, y: cy - 110 }, pB = { x: cx - 125, y: cy + 90 }, pC = { x: cx + 125, y: cy + 90 }, pD = { x: cx, y: cy + 12 };
            ctx.beginPath(); ctx.moveTo(pA.x, pA.y); ctx.lineTo(pB.x, pB.y); ctx.lineTo(pD.x, pD.y); ctx.lineTo(pC.x, pC.y); ctx.closePath();
            ctx.fillStyle = 'rgba(56, 189, 248, 0.18)'; ctx.fill();
            ctx.strokeStyle = '#e2e8f0'; ctx.lineWidth = 2.8; ctx.stroke();

            if (state.steps[2] || t > 0.05 || state.lens === 'aux') {
              ctx.strokeStyle = '#fb7185'; ctx.lineWidth = 2.4; ctx.setLineDash([5, 4]);
              ctx.beginPath();
              if (p2 === 1) {
                // BD 연장선과 AC의 교점 E
                ctx.moveTo(pB.x, pB.y); ctx.lineTo(cx + 52, cy - 22);
              } else {
                // AD 연장선 가르기
                ctx.moveTo(pA.x, pA.y); ctx.lineTo(cx, cy + 95);
              }
              ctx.stroke(); ctx.setLineDash([]);
            }
            const a = p1 * 4;
            drawSmartLabel(pA.x, pA.y, cx, cy, `A(∠a=${a}°)`, '#38bdf8');
            drawSmartLabel(pB.x, pB.y, cx, cy, `B(∠b=30°)`, '#fb7185');
            drawSmartLabel(pC.x, pC.y, cx, cy, `C(∠c=25°)`, '#34d399');
            drawSmartLabel(pD.x, pD.y + 22, pD.x, pD.y - 20, `🪃 ∠x = ${a}+30+25 = ${a+55}°!`, '#fda4af', 20);
          } else {
            const pO = { x: cx, y: cy }, pA = { x: cx - 145, y: cy - 80 }, pB = { x: cx - 130, y: cy + 85 }, pC = { x: cx + 140, y: cy - 85 }, pD = { x: cx + 130, y: cy + 75 };
            ctx.beginPath(); ctx.moveTo(pO.x, pO.y); ctx.lineTo(pA.x, pA.y); ctx.lineTo(pB.x, pB.y); ctx.closePath();
            ctx.fillStyle = 'rgba(56, 189, 248, 0.22)'; ctx.fill(); ctx.strokeStyle = '#38bdf8'; ctx.lineWidth = 2.8; ctx.stroke();

            ctx.beginPath(); ctx.moveTo(pO.x, pO.y); ctx.lineTo(pC.x, pC.y); ctx.lineTo(pD.x, pD.y); ctx.closePath();
            ctx.fillStyle = 'rgba(244, 63, 94, 0.22)'; ctx.fill(); ctx.strokeStyle = '#fb7185'; ctx.lineWidth = 2.8; ctx.stroke();

            const sumAB = p1 * 10;
            drawSmartLabel(pA.x, pA.y, cx, cy, 'A(∠a)', '#38bdf8');
            drawSmartLabel(pB.x, pB.y, cx, cy, `B(∠a+∠b=${sumAB}°)`, '#38bdf8');
            drawSmartLabel(pC.x, pC.y, cx, cy, 'C(∠c=42°)', '#fb7185');
            drawSmartLabel(pD.x, pD.y, cx, cy, `D(∠d=${sumAB-42}°)`, '#34d399');
          }
        } else if (sub === 'starMaster') {
          const R = Math.min(rect.width, rect.height) * 0.30 * state.scale;
          if (p2 === 4) {
            // 육각별 (삼각형 2개 겹침 = 360°)
            const t1 = [0, 2, 4].map((i) => ({ x: cx + R * Math.cos(-Math.PI/2 + i*Math.PI/3), y: cy + R * Math.sin(-Math.PI/2 + i*Math.PI/3) }));
            const t2 = [1, 3, 5].map((i) => ({ x: cx + R * Math.cos(-Math.PI/2 + i*Math.PI/3), y: cy + R * Math.sin(-Math.PI/2 + i*Math.PI/3) }));
            ctx.beginPath(); ctx.moveTo(t1[0].x, t1[0].y); t1.forEach((p)=>ctx.lineTo(p.x,p.y)); ctx.closePath();
            ctx.fillStyle = 'rgba(56, 189, 248, 0.18)'; ctx.fill(); ctx.strokeStyle = '#38bdf8'; ctx.lineWidth = 3; ctx.stroke();
            ctx.beginPath(); ctx.moveTo(t2[0].x, t2[0].y); t2.forEach((p)=>ctx.lineTo(p.x,p.y)); ctx.closePath();
            ctx.fillStyle = 'rgba(244, 63, 94, 0.18)'; ctx.fill(); ctx.strokeStyle = '#fb7185'; ctx.lineWidth = 3; ctx.stroke();
            drawSmartLabel(t1[0].x, t1[0].y, cx, cy, '✡ 육각별 = 삼각형 2개 (180°×2 = 360°!)', '#e2e8f0', 22);
          } else {
            // 오각별(☆) 해법 ①(외각 2개 이사) vs 해법 ②(아래쪽 나비넥타이 보조선 CD 연결!)
            const pts = Array.from({ length: 5 }, (_, i) => {
              const a = -Math.PI / 2 + (i * Math.PI * 2) / 5;
              return { x: cx + R * Math.cos(a), y: cy + R * Math.sin(a) };
            });
            // pts[0]=A(위), pts[1]=C(우상), pts[2]=D(우하), pts[3]=B(좌하), pts[4]=E(좌상)
            const order = [0, 2, 4, 1, 3, 0];
            ctx.beginPath(); ctx.moveTo(pts[0].x, pts[0].y); order.forEach((idx) => ctx.lineTo(pts[idx].x, pts[idx].y));
            ctx.strokeStyle = '#e2e8f0'; ctx.lineWidth = 2.6; ctx.stroke();

            const rIn = R * 0.382;
            const pF = { x: cx + rIn * Math.cos(-Math.PI/2 - Math.PI/5), y: cy + rIn * Math.sin(-Math.PI/2 - Math.PI/5) };
            const pG = { x: cx + rIn * Math.cos(-Math.PI/2 + Math.PI/5), y: cy + rIn * Math.sin(-Math.PI/2 + Math.PI/5) };

            if (p2 === 2) {
              // 해법 ②: 아래쪽 두 끝점 B(pts[3])와 D(pts[2])를 잇는 나비넥타이 보조선!
              ctx.beginPath(); ctx.moveTo(pts[0].x, pts[0].y); ctx.lineTo(pts[3].x, pts[3].y); ctx.lineTo(pts[2].x, pts[2].y); ctx.closePath();
              ctx.fillStyle = 'rgba(52, 211, 153, 0.22)'; ctx.fill();
              ctx.strokeStyle = '#fb7185'; ctx.lineWidth = 3.5; ctx.setLineDash([6, 4]);
              ctx.beginPath(); ctx.moveTo(pts[3].x, pts[3].y); ctx.lineTo(pts[2].x, pts[2].y); ctx.stroke(); ctx.setLineDash([]);
              drawSmartLabel(cx, (pts[3].y + pts[2].y) / 2 + 18, cx, cy, '🎀 나비넥타이 보조선 연결 ➔ 큰 삼각형 1개(180°) 완성!', '#fb7185', 10);
            } else {
              // 해법 ①: 위쪽 작은 삼각형 ΔAFG로 외각 2개 이사!
              ctx.beginPath(); ctx.moveTo(pts[0].x, pts[0].y); ctx.lineTo(pF.x, pF.y); ctx.lineTo(pG.x, pG.y); ctx.closePath();
              ctx.fillStyle = 'rgba(56, 189, 248, 0.24)'; ctx.fill();
              ctx.strokeStyle = '#38bdf8'; ctx.lineWidth = 3; ctx.stroke();

              const bPt = { x: pts[4].x + t*(pF.x - pts[4].x), y: pts[4].y + t*(pF.y - pts[4].y) };
              const dPt = { x: pts[2].x + t*(pF.x - pts[2].x), y: pts[2].y + t*(pF.y - pts[2].y) };
              const cPt = { x: pts[1].x + t*(pG.x - pts[1].x), y: pts[1].y + t*(pG.y - pts[1].y) };
              const ePt = { x: pts[3].x + t*(pG.x - pts[3].x), y: pts[3].y + t*(pG.y - pts[3].y) };
              [
                { p: pts[0], c: '#34d399' }, { p: bPt, c: '#38bdf8' }, { p: dPt, c: '#38bdf8' }, { p: cPt, c: '#fb7185' }, { p: ePt, c: '#fb7185' }
              ].forEach((it) => {
                ctx.beginPath(); ctx.arc(it.p.x, it.p.y, 7.5, 0, Math.PI * 2);
                ctx.fillStyle = it.c; ctx.fill(); ctx.strokeStyle = '#FFF'; ctx.lineWidth = 2; ctx.stroke();
              });
            }
            const a = p1 * 4;
            drawSmartLabel(pts[0].x, pts[0].y, cx, cy, `A(∠a=${a}°)`, '#34d399', 20);
            drawSmartLabel(pts[4].x, pts[4].y, cx, cy, 'E(∠b)', '#38bdf8', 20);
            drawSmartLabel(pts[1].x, pts[1].y, cx, cy, 'C(∠c)', '#fb7185', 20);
            drawSmartLabel(pts[2].x, pts[2].y, cx, cy, 'D(∠d)', '#38bdf8', 20);
            drawSmartLabel(pts[3].x, pts[3].y, cx, cy, 'B(∠e)', '#fb7185', 20);
          }
        } else {
          // bisect3 (내·외각 이등분선 3종 & 정오각형 대각선 교각)
          if (p2 <= 3) {
            const angA = p1 * 8, alpha = (angA * Math.PI) / 180;
            const halfB = Math.min(62, rect.height * 0.13) * state.scale;
            const beta = (Math.PI - alpha) / 2, tau = Math.tan(beta / 2), yBot = cy + 15;
            const pB = { x: cx - halfB, y: yBot }, pC = { x: cx + halfB, y: yBot };
            const pA = { x: cx, y: yBot - halfB / Math.tan(alpha / 2) };
            let pP;
            if (p2 === 1) {
              const xx = (halfB * (1 + tau * tau)) / (1 - tau * tau);
              pP = { x: cx + xx, y: yBot - tau * (xx + halfB) };
            } else if (p2 === 2) {
              pP = { x: cx, y: yBot - halfB * tau };
            } else {
              pP = { x: cx, y: yBot + halfB / tau };
            }
            ctx.beginPath(); ctx.moveTo(pA.x, pA.y); ctx.lineTo(pB.x, pB.y); ctx.lineTo(pC.x, pC.y); ctx.closePath();
            ctx.fillStyle = 'rgba(56, 189, 248, 0.18)'; ctx.fill();
            ctx.strokeStyle = '#e2e8f0'; ctx.lineWidth = 2.8; ctx.stroke();

            ctx.beginPath(); ctx.moveTo(pB.x, pB.y); ctx.lineTo(pP.x, pP.y); ctx.lineTo(pC.x, pC.y);
            ctx.strokeStyle = '#fb7185'; ctx.lineWidth = 2.8; ctx.setLineDash([6, 4]); ctx.stroke(); ctx.setLineDash([]);

            const ans = p2 === 1 ? angA / 2 : p2 === 2 ? 90 + angA / 2 : 90 - angA / 2;
            drawSmartLabel(pA.x, pA.y, cx, cy, `A(${angA}°)`, '#38bdf8');
            drawSmartLabel(pB.x, pB.y, cx, cy, 'B(●●)', '#34d399');
            drawSmartLabel(pC.x, pC.y, cx, cy, 'C(××)', '#fb7185');
            drawSmartLabel(pP.x, pP.y, cx, cy, `P(∠x=${ans}°)`, '#fda4af', 20);
          } else {
            // 정오각형 속 두 대각선 교각 (36°, 72°, 108°)
            const R = Math.min(rect.width, rect.height) * 0.28 * state.scale;
            const verts = Array.from({ length: 5 }, (_, i) => {
              const a = -Math.PI / 2 + (i * Math.PI * 2) / 5;
              return { x: cx + R * Math.cos(a), y: cy + R * Math.sin(a) };
            });
            ctx.beginPath(); ctx.moveTo(verts[0].x, verts[0].y); verts.forEach((p)=>ctx.lineTo(p.x,p.y)); ctx.closePath();
            ctx.fillStyle = 'rgba(56, 189, 248, 0.14)'; ctx.fill(); ctx.strokeStyle = '#e2e8f0'; ctx.lineWidth = 2.8; ctx.stroke();

            ctx.beginPath(); ctx.moveTo(verts[0].x, verts[0].y); ctx.lineTo(verts[1].x, verts[1].y); ctx.lineTo(verts[2].x, verts[2].y); ctx.closePath();
            ctx.fillStyle = 'rgba(52, 211, 153, 0.24)'; ctx.fill();

            ctx.strokeStyle = '#fb7185'; ctx.lineWidth = 3.2;
            ctx.beginPath();
            ctx.moveTo(verts[0].x, verts[0].y); ctx.lineTo(verts[2].x, verts[2].y);
            ctx.moveTo(verts[1].x, verts[1].y); ctx.lineTo(verts[3].x, verts[3].y);
            ctx.stroke();

            ['A(36°)', 'B(108°)', 'C(36°)', 'D', 'E'].forEach((l, i) => drawSmartLabel(verts[i].x, verts[i].y, cx, cy, l, '#e2e8f0', 20));
            drawSmartLabel(cx + R * 0.2, cy - R * 0.08, cx, cy, '교점 P (예각 72° / 둔각 108°)', '#fb7185', 10);
          }
        }
      }

      ctx.restore();
      updateUI();
    }

    // -------------------------------------------------------------------------
    // 4. UI 동기화 및 원클릭 버튼 핸들러
    // -------------------------------------------------------------------------
    function renderSubBar() {
      const m = state.mode;
      document.getElementById('subSelectorBar').innerHTML = SUB_MENUS[m]
        .map((it) => `<button onclick="setSub(${m}, '${it.id}')" class="sub-pill ${state.sub[m] === it.id ? 'active' : 'bg-slate-50 text-slate-700 hover:bg-slate-100'} px-2.5 py-1 rounded-lg border border-slate-200 text-[11px] transition">${it.label}</button>`)
        .join('');
    }

    function updateUI() {
      const spec = getSpec();
      if (!spec.badge) return;

      document.getElementById('examBadge').textContent = spec.badge;
      document.getElementById('txtAction').textContent = spec.actionTxt;
      document.getElementById('visualEqBadge').innerHTML = spec.eqHTML;
      document.getElementById('examQuestion').innerHTML = spec.q;
      document.getElementById('answerSummary').innerHTML = spec.ans;

      document.getElementById('quizBox').innerHTML = spec.opts
        .map((o, i) => {
          let cls = 'border-slate-200 bg-slate-50 text-slate-700 hover:bg-slate-100';
          if (state.selectedQuiz === i) {
            cls = o.ok ? 'border-blue-600 bg-blue-50 text-blue-800 font-extrabold' : 'border-rose-500 bg-rose-50 text-rose-700 font-bold';
          }
          return `<button onclick="checkQuiz(${i})" class="px-2 py-1.5 rounded-lg border text-[11px] transition leading-tight ${cls}">${o.t}</button>`;
        })
        .join('');

      document.getElementById('labelGroup1').textContent = spec.g1Label;
      document.getElementById('btnGroup1').innerHTML = spec.g1Btns
        .map(([val, lbl]) => `<button onclick="setP1(${val})" class="preset-chip ${state.p1 === val ? 'active' : 'bg-white text-slate-700 hover:bg-slate-100'} py-1 rounded border border-slate-200 text-[10.5px] transition">${lbl}</button>`)
        .join('');

      document.getElementById('labelGroup2').textContent = spec.g2Label;
      document.getElementById('btnGroup2').innerHTML = spec.g2Btns
        .map(([val, lbl]) => `<button onclick="setP2(${val})" class="preset-chip ${state.p2 === val ? 'active' : 'bg-white text-slate-700 hover:bg-slate-100'} py-1 rounded border border-slate-200 text-[10.5px] transition">${lbl}</button>`)
        .join('');

      for (let i = 0; i < 4; i++) {
        document.getElementById(`statV${i + 1}`).textContent = spec.stats[i];
      }

      document.getElementById('stdText').innerHTML = spec.std;
      document.getElementById('fastText').innerHTML = spec.fast;

      document.getElementById('sliderAnim').value = state.animProg;
      document.getElementById('valAnim').textContent = `${Math.round(state.animProg * 100)}%`;
    }

    function checkQuiz(idx) {
      state.selectedQuiz = idx;
      const spec = getSpec();
      const chosen = spec.opts[idx];
      const fb = document.getElementById('quizFeedback');
      fb.textContent = chosen.msg;
      fb.className = chosen.ok ? 'text-[11px] font-extrabold text-blue-700 mb-1' : 'text-[11px] font-bold text-rose-600 mb-1';
      if (chosen.ok) state.animTarget = 1.0;
      updateUI();
    }

    function setMode(m) {
      state.mode = m;
      state.selectedQuiz = null;
      state.animProg = 0.0;
      document.getElementById('quizFeedback').textContent = '';
      for (let i = 1; i <= 4; i++) document.getElementById(`tab-${i}`).classList.toggle('active', i === m);
      state.p1 = m === 3 ? 6 : 8;
      state.p2 = 1;
      renderSubBar();
      render();
    }

    function setSub(m, id) {
      state.sub[m] = id;
      state.selectedQuiz = null;
      state.animProg = 0.0;
      document.getElementById('quizFeedback').textContent = '';
      state.p2 = 1;
      renderSubBar();
      render();
    }

    function setLens(l) {
      state.lens = l;
      ['all', 'mark', 'aux'].forEach((id) => document.getElementById(`lens-${id}`).classList.toggle('active', id === l));
      if (l === 'aux') state.animTarget = 1.0;
      render();
    }

    function toggleAntTape() {
      state.showAntTape = !state.showAntTape;
      document.getElementById('btnAntTop').classList.toggle('active', state.showAntTape);
      render();
    }

    function setP1(v) { state.p1 = v; render(); }
    function setP2(v) {
      state.p2 = v;
      if (state.mode === 3 && state.sub[3] === 'ext360') {
        if (v === 1) state.animTarget = 0.0;
        else if (v === 2) state.animTarget = 0.5;
        else if (v === 3) state.animTarget = 1.0;
        else if (v === 4) state.showAntTape = true;
      }
      render();
    }

    function setAnimVal(val) { state.animTarget = val; }
    function triggerAnim() { state.animTarget = state.animProg > 0.5 ? 0.0 : 1.0; }
    function onAnimSlider() { state.animTarget = null; state.animProg = parseFloat(document.getElementById('sliderAnim').value); render(); }
    function snapToProblem() { unlockAllSteps(); state.p1 = 8; state.animTarget = 1.0; render(); }

    function toggleStep(s) {
      state.steps[s] = !state.steps[s];
      document.getElementById(`stepBtn${s}`).classList.toggle('active', state.steps[s]);
      render();
    }
    function unlockAllSteps() {
      [1, 2, 3].forEach((s) => { state.steps[s] = true; document.getElementById(`stepBtn${s}`).classList.add('active'); });
      render();
    }

    function toggleAcc(id) {
      const b = document.getElementById(`accBody-${id}`), ic = document.getElementById(`accIcon-${id}`);
      const h = b.classList.contains('hidden');
      b.classList.toggle('hidden', !h);
      ic.className = h ? ic.className.replace('fa-chevron-down', 'fa-chevron-up') : ic.className.replace('fa-chevron-up', 'fa-chevron-down');
    }

    function zoomCanvas(f) { state.scale = Math.max(0.65, Math.min(1.6, state.scale * f)); render(); }
    function resetView() { state.scale = 1.0; state.offsetX = 0; state.offsetY = 0; state.animProg = 0.0; setLens('all'); render(); }

    function animateLoop() {
      let dirty = false;
      if (state.animTarget !== null) {
        const d = state.animTarget - state.animProg;
        if (Math.abs(d) < 0.008) { state.animProg = state.animTarget; state.animTarget = null; }
        else state.animProg += d * 0.08;
        dirty = true;
      }
      if (dirty) render();
      requestAnimationFrame(animateLoop);
    }

    // -------------------------------------------------------------------------
    // 5. 캔버스 드래그 핸들러
    // -------------------------------------------------------------------------
    function getPos(e) {
      const r = canvas.getBoundingClientRect();
      return e.touches && e.touches.length ? { x: e.touches[0].clientX - r.left, y: e.touches[0].clientY - r.top } : { x: e.clientX - r.left, y: e.clientY - r.top };
    }
    canvas.addEventListener('pointerdown', (e) => {
      const p = getPos(e);
      let found = null, minD = 32;
      for (const h of state.dragHandles) {
        const d = Math.hypot(p.x - h.x, p.y - h.y);
        if (d <= minD) { minD = d; found = h; }
      }
      if (found) { state.activeHandle = found; canvas.setPointerCapture(e.pointerId); }
      else triggerAnim();
    });
    canvas.addEventListener('pointermove', (e) => {
      if (!state.activeHandle) return;
      const p = getPos(e);
      if (state.activeHandle.onDrag) { state.activeHandle.onDrag(p.x, p.y); render(); }
    });
    canvas.addEventListener('pointerup', () => { state.activeHandle = null; });

    window.addEventListener('DOMContentLoaded', () => {
      setMode(1);
      resizeCanvas();
      requestAnimationFrame(animateLoop);
    });
  </script>
</body>
</html>
