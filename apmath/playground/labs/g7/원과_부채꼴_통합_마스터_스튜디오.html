<header class="top"><div class="brand"><div class="brand-left"><a href="../../teacher-hub.html" class="ap-back-home" aria-label="전체 단원 목록으로 돌아가기">← 전체 단원</a><div><b>AP MATH <span style="color:var(--amber)">원과 부채꼴</span></b><small>개념 → 기본형 → 둘레 → 넓이 → 조각 실험 → 문제 적용</small></div></div><span class="pill">원과 부채꼴 · 26가지 움직이는 실험</span></div><nav id="tabs" class="tabs" aria-label="학습 단계"></nav></header>
<main class="layout">
<section class="left" aria-label="움직이는 수학 칠판">
<div class="toolbar"><div id="scenarios" class="scenarios"></div><span class="tiny" id="zoneLabel">원 알아보기</span></div>
<div class="board-shell"><div class="board-top"><div id="boardCaption" class="board-caption">원의 요소를 눌러보세요</div><div class="board-hint" id="boardHint">선은 길이, 면은 넓이</div></div><div class="board"><svg id="scene" viewBox="0 0 900 530" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="직접 조작하는 원과 부채꼴 도형"></svg></div><div id="legend" class="legend"></div><div class="lenses" aria-label="둘레와 넓이 관찰 렌즈"><button type="button" class="active" data-lens="both">선과 면 함께</button><button type="button" data-lens="perimeter">둘레(선)만 강조</button><button type="button" data-lens="area">넓이(면)만 강조</button></div></div>
<div class="controls">
<div class="row actions"><div class="row"><button class="button" id="prev">◀ 이전</button><button class="button primary" id="next">다음 단계 ▶</button><button class="button" id="reset">처음으로</button><button class="button" id="play">▶ 자동</button></div><div class="tiny" id="stepCounter">1 / 4</div></div>
<div class="range-line" id="morphLine"><label for="morph">조각 분리·이동</label><input id="morph" type="range" min="0" max="100" step="1" value="0"><output id="morphVal">0%</output><span id="pieceWrap" class="hidden" style="display:inline-flex;align-items:center;gap:6px;margin-left:8px"><label for="pieceCount">분할 수</label><select id="pieceCount" aria-label="원 분할 조각 수" style="background:#183a29;color:white;border:1px solid #5e886d;border-radius:8px;padding:4px 8px"><option value="8">8조각</option><option value="16" selected>16조각</option><option value="32">32조각</option><option value="64">64조각</option></select></span></div>
<div class="range-line"><label for="radius">반지름</label><input id="radius" type="range" min="2" max="12" step="1" value="6"><output id="radiusVal">6 cm</output><label for="angle" id="angleTitle">중심각</label><input id="angle" type="range" min="30" max="300" step="15" value="90"><output id="angleVal">90°</output></div>
<div id="rulerBox" class="hidden"><div class="tiny" id="rulerTitle" style="margin-bottom:6px">실제 길이 비례 경계 구간</div><div id="ruler" class="progress"></div><div id="compareBars" class="compare-bars hidden"></div><div id="rulerLegend" class="progress-legend" style="margin-top:6px"></div></div>
</div></section>
<aside class="right"><section class="card"><span class="eyebrow" id="tag">1. 개념의 시작</span><h2 id="title">원의 기본 요소</h2><p id="description"></p><div class="compare"><div class="chip"><span style="color:var(--sky)" id="periLabel">둘레 · 선 (cm)</span><strong id="periNum">—</strong></div><div class="chip"><span style="color:var(--mint)" id="areaLabel">넓이 · 면 (cm²)</span><strong id="areaNum">—</strong></div></div><div class="formula" id="formula">—</div></section><section class="card"><h3>현재 조작 · 왜 그런가?</h3><div class="step-title" id="stepTitle"></div><p class="step-explain" id="stepText"></p><div class="alert" id="warning"></div></section><section class="card"><h3>스스로 확인</h3><p id="question"></p><button class="button" id="showAnswer">정답·해설 보기</button><div class="answer" id="answer"></div></section><div class="tiny">원과 부채꼴 통합 실험실 · 각 도형의 수치와 색상은 현재 선택과 연동됩니다.</div></aside>
</main>
<script>
'use strict';
const NS='http://www.w3.org/2000/svg';
const COL={arc:'#38bdf8',arc2:'#34d399',line:'#fb7185',aux:'#94a3b8',area:'#34d399',mint:'#34d399',amber:'#fbbf24',white:'#ecf8ef'};
const PI=Math.PI;
const zones=[
 {name:'① 원 알아보기',short:'원의 요소',items:[['center','중심·반지름'],['diameter','지름·원주'],['arc','호·현'],['sector','부채꼴'],['segment','활꼴']]},
 {name:'② 기본형',short:'기본형',items:[['circle','원'],['semi','반원'],['quarter','사분원'],['sector','부채꼴'],['segment','활꼴']]},
 {name:'③ 길이·둘레',short:'외곽 경계',items:[['semi','반원 둘레'],['quarter','사분원 둘레'],['sector','부채꼴 둘레'],['segment','활꼴 둘레'],['cutout','파낸 반원'],['track','운동장 트랙']]},
 {name:'④ 넓이 원리',short:'넓이의 원리',items:[['circleProof','원을 잘게 나누기'],['sectorProof','부채꼴 넓이']]},
 {name:'⑤ 색칠한 넓이',short:'조각 실험',items:[['subtract','전체에서 빼기'],['split','보조선으로 두 조각'],['move','조각 옮겨 채우기'],['combine','면 더하고 빼기']]},
 {name:'⑥ 응용 문제',short:'구조로 풀기',items:[['leaf','나뭇잎'],['cutout','파낸 반원'],['track','운동장 트랙'],['combine','반원 합·차']]}
];
const S={zone:0,item:0,step:0,r:6,angle:90,morph:0,selected:-1,pan:{x:0,y:0},drag:null,manual:{},circleCount:16,trace:0,lens:'both'};
const $=id=>document.getElementById(id);
const round=(n,d=2)=>Number(n.toFixed(d)).toLocaleString('ko-KR',{maximumFractionDigits:d});
const fmt=n=>round(n,2);
const cm=n=>`${fmt(n)} cm`;
const cm2=n=>`${fmt(n)} cm²`;
const p=(x,y)=>({x,y});
const pt=(cx,cy,R,a)=>p(cx+R*Math.cos(a),cy+R*Math.sin(a));
const rad=d=>d*PI/180;
const shortAngle=(a0,a1,t)=>{let diff=((a1-a0+540)%360)-180;return a0+diff*t;};
const pointStr=q=>`${q.x.toFixed(3)} ${q.y.toFixed(3)}`;
const svgPath=(d,{fill='none',stroke='none',width=0,opacity=1,dash='',cls='',extra=''}={})=>`<path d="${d}" ${cls?`class="${cls}"`:''} fill="${fill}" stroke="${stroke}" stroke-width="${width}" opacity="${opacity}" ${dash?`stroke-dasharray="${dash}"`:''} stroke-linejoin="round" stroke-linecap="round" ${extra}/>`;
const circle=(x,y,R,stroke=COL.arc,fill='none',w=3,cls='')=>`<circle cx="${x}" cy="${y}" r="${R}" ${cls?`class="${cls}"`:''} stroke="${stroke}" stroke-width="${w}" fill="${fill}"/>`;
const line=(x1,y1,x2,y2,color=COL.line,w=3,dash='',cls='')=>svgPath(`M${x1} ${y1} L${x2} ${y2}`,{stroke:color,width:w,dash,cls:cls||(dash?'math-aux':'')});
const label=(x,y,t,fill='#fff',size=15)=>`<text x="${x}" y="${y}" text-anchor="middle" class="svg-label" style="fill:${fill};font-size:${size}px">${t}</text>`;
const badge=(x,y,w,h,t,bg='rgba(9,30,21,.92)',border='#3d6b52',color='#ffe8a8',size=13)=>`<g class="math-aux"><rect x="${x-w/2}" y="${y-h/2}" width="${w}" height="${h}" rx="8" fill="${bg}" stroke="${border}" stroke-width="1.3"/>${label(x,y+5,t,color,size)}</g>`;
const edgeTick=(a,b,color=COL.white,len=7)=>{
 const mx=(a.x+b.x)/2,my=(a.y+b.y)/2,dx=b.x-a.x,dy=b.y-a.y,L=Math.hypot(dx,dy)||1;
 const nx=-dy/L*len,ny=dx/L*len;
 return line(mx-nx,my-ny,mx+nx,my+ny,color,2.2,'','math-aux');
};
const dimLine=(x1,y1,x2,y2,txt,color=COL.amber,extFromY=null)=>{
 const dx=x2-x1,dy=y2-y1,L=Math.hypot(dx,dy)||1,nx=-dy/L,ny=dx/L;
 const mx=(x1+x2)/2,my=(y1+y2)/2;
 let ext='';
 if(extFromY!==null){
  ext+=line(x1,extFromY,x1,y1,'rgba(148,163,184,.45)',1.3,'3 3','math-aux')+line(x2,extFromY,x2,y2,'rgba(148,163,184,.45)',1.3,'3 3','math-aux');
 }
 return ext+line(x1,y1,x2,y2,color,1.8,'4 3','math-aux')+line(x1-nx*5,y1-ny*5,x1+nx*5,y1+ny*5,color,2.2,'','math-aux')+line(x2-nx*5,y2-ny*5,x2+nx*5,y2+ny*5,color,2.2,'','math-aux')+badge(mx,my,Math.max(88,txt.length*9.5),24,txt,'rgba(8,26,18,.94)',color,color,12.5);
};
const arcD=(cx,cy,R,a0,a1)=>{const s=pt(cx,cy,R,a0),e=pt(cx,cy,R,a1);let dif=a1-a0;return `M${pointStr(s)} A${R} ${R} 0 ${Math.abs(dif)>PI+1e-7?1:0} ${dif>=0?1:0} ${pointStr(e)}`};
const fullCircleD=(cx,cy,R)=>`M${cx-R} ${cy} A${R} ${R} 0 1 1 ${cx+R} ${cy} A${R} ${R} 0 1 1 ${cx-R} ${cy} Z`;
const wedgeD=(cx,cy,R,a0,a1)=>`M${cx} ${cy} L${pointStr(pt(cx,cy,R,a0))} A${R} ${R} 0 ${Math.abs(a1-a0)>PI+1e-7?1:0} ${a1>=a0?1:0} ${pointStr(pt(cx,cy,R,a1))} Z`;
const segD=(cx,cy,R,a0,a1)=>{let s=pt(cx,cy,R,a0);return arcD(cx,cy,R,a0,a1)+` L${pointStr(s)} Z`};
const logical=(x,y)=>p(x+S.pan.x,y+S.pan.y);
const basicCenter=()=>logical(450,S.zone===2?210:245);
const current=()=>zones[S.zone].items[S.item];
const visualScale=r=>Math.max(.8,Math.min(1.22,.72+.042*r));
const basicRadius=()=>(S.zone===2?114:132)*visualScale(S.r);
const usesAngle=()=>['arc','sector','segment','sectorProof'].includes(current()[0]);
const formatFormulaHtml=str=>String(str)
 .replace(/πr²\s*÷\s*(\d+)/g,'<span class="f-frac"><span>πr²</span><span>$1</span></span>')
 .replace(/(\d+°?)\/(\d+°?)/g,'<span class="f-frac"><span>$1</span><span>$2</span></span>')
 .replace(/πr²\/(\d+)/g,'<span class="f-frac"><span>πr²</span><span>$1</span></span>')
 .replace(/πr\/(\d+)/g,'<span class="f-frac"><span>πr</span><span>$1</span></span>')
 .replace(/1\/2/g,'<span class="f-frac"><span>1</span><span>2</span></span>')
 .replace(/1\/4/g,'<span class="f-frac"><span>1</span><span>4</span></span>')
 .replace(/3\/8/g,'<span class="f-frac"><span>3</span><span>8</span></span>')
 .replace(/π\/4/g,'<span class="f-frac"><span>π</span><span>4</span></span>')
 .replace(/π\/2/g,'<span class="f-frac"><span>π</span><span>2</span></span>');
let model=null;

function maxStep(){
 if(S.zone===4)return 4;
 if(S.zone===3)return 3;
 const segLen=model?.segs?.length||0;
 return segLen>0?segLen:2;
}
function boundaryArc(cx,cy,R,a0,a1,color=COL.arc,name='호',id=''){return {kind:'arc',cx,cy,R,a0,a1,color,name,id,lenPx:R*Math.abs(a1-a0),at:t=>pt(cx,cy,R,a0+t*(a1-a0))};}
function boundaryLine(a,b,color=COL.line,name='선분',id=''){const L=Math.hypot(b.x-a.x,b.y-a.y);return {kind:'line',a,b,color,name,id,lenPx:L,at:t=>p(a.x+(b.x-a.x)*t,a.y+(b.y-a.y)*t)};}
function markSegments(list,Rpx){const weightCm=S.r/Rpx;return list.map((s,i)=>({...s,index:i,len:s.lenPx*weightCm}));}
function paintSegment(seg,chosen=false,onlyWhenChosen=false){
 if(onlyWhenChosen&&!chosen)return '';
 const full=seg.kind==='arc'&&Math.abs(seg.a1-seg.a0)>=2*PI-.000001;
 const d=seg.kind==='arc'?(full?fullCircleD(seg.cx,seg.cy,seg.R):arcD(seg.cx,seg.cy,seg.R,seg.a0,seg.a1)):`M${pointStr(seg.a)} L${pointStr(seg.b)}`;
 return svgPath(d,{stroke:seg.color,width:chosen?7.5:4.6,opacity:chosen?1:.82,cls:'math-peri'})+svgPath(d,{stroke:'transparent',width:22,extra:`data-segment="${seg.index}" style="cursor:pointer"`});
}
function boundaryLayer(list,onlyWhenChosen=false){return list.map(s=>paintSegment(s,S.selected===s.index,onlyWhenChosen)).join('');}
function crossAt(q){return circle(q.x,q.y,5,COL.white,'#fbbf24',2);}

function getSegIndexAt(segments,t){
 if(!segments?.length)return -1;
 const total=segments.reduce((a,s)=>a+s.lenPx,0);
 let dist=Math.min(.999999,Math.max(0,t))*total;
 for(let i=0;i<segments.length;i++){
  if(dist<=segments[i].lenPx)return i;
  dist-=segments[i].lenPx;
 }
 return segments.length-1;
}

function drawAngleMarker(cx,cy,R,a0,a1,deg){
 const aMid=(a0+a1)/2;
 const mR=Math.min(25,Math.max(15,R*.2));
 let mark='';
 if(deg===90){
  const s=Math.min(18,Math.max(12,R*.15)),p1=pt(cx,cy,s,a0),p2=pt(cx,cy,s,a1),pCorner=p(p1.x+p2.x-cx,p1.y+p2.y-cy);
  mark=svgPath(`M${pointStr(p1)} L${pointStr(pCorner)} L${pointStr(p2)}`,{fill:'rgba(251,191,36,.18)',stroke:COL.amber,width:2.2,cls:'math-aux'});
 }else{
  mark=svgPath(wedgeD(cx,cy,mR,a0,a1),{fill:'rgba(251,191,36,.16)',stroke:COL.amber,width:2,cls:'math-aux'});
 }
 const lblDist=deg<=45?Math.min(R*.52,mR+24):mR+20;
 const lblPos=pt(cx,cy,lblDist,aMid);
 return mark+label(lblPos.x,lblPos.y+5,`${deg}°`,COL.amber,deg<=45?12:13);
}

function drawUnrolledTape(segs,totalCm){
 if(S.zone!==2||!segs?.length)return '';
 const barW=430,x0=215,y0=482;
 let curX=x0;
 let bg=`<rect x="68" y="454" width="764" height="66" rx="12" fill="rgba(7,22,15,.94)" stroke="#35624b" stroke-width="1.4"/>`;
 let lines='',dots='',labels='';
 segs.forEach((s,i)=>{
  const w=barW*(s.len/totalCm);
  const chosen=S.selected===i;
  const segPath=`M${curX+2} ${y0} L${curX+w-2} ${y0}`;
  lines+=svgPath(segPath,{stroke:s.color,width:chosen?8.5:5.5,opacity:chosen?1:.82,cls:'math-peri'});
  lines+=svgPath(segPath,{stroke:'transparent',width:24,extra:`data-segment="${i}" style="cursor:pointer"`});
  dots+=circle(curX,y0,4.2,COL.white,s.color,1.8);
  if(w>=34)labels+=`<g data-segment="${i}" style="cursor:pointer"><title>${s.name}: ${cm(s.len)}</title>${label(curX+w/2,y0+23,String(i+1),s.color,13)}</g>`;
  curX+=w;
 });
 dots+=circle(curX,y0,4.2,COL.white,COL.amber,1.8);
 return `<g id="unrolledHud">${bg}${label(140,y0+5,'펼친 둘레(1D)',COL.amber,12.5)}${lines}${dots}${labels}${label(x0+barW+68,y0+5,`합계 ${cm(totalCm)}`,COL.amber,13)}</g>`;
}

function buildAutoStepTexts(segs,intro,periVal,areaVal){
 if(!segs?.length)return [intro];
 const arr=[intro];
 segs.forEach((s,i)=>{
  arr.push(`${i+1}단계 [${s.name}]: 길이는 ${cm(s.len)}이며 전체 외곽 둘레(${cm(periVal)})의 ${fmt(s.len/periVal*100,1)}%를 차지합니다.${i===segs.length-1?` 모든 경계를 합하면 둘레 ${cm(periVal)}${Number.isFinite(areaVal)?`, 넓이 ${cm2(areaVal)}`:''}가 완성됩니다.`:''}`);
 });
 return arr;
}

function setManualStep(n){
 if(!model)model=buildModel();
 const mStep=maxStep();
 S.step=Math.max(0,Math.min(mStep,n));
 if(S.zone===4){
  const mapT=[0,0,0.38,0.76,1];
  S.morph=mapT[S.step]??0;
 }else{
  S.morph=mStep>0?S.step/mStep:0;
 }
 S.manual={};
 if(S.zone!==3&&S.zone!==4&&model?.segs?.length){
  S.selected=S.step===0?-1:Math.min(model.segs.length-1,S.step-1);
 }else{
  S.selected=-1;
 }
 render();
}

function svgPiece(d,color,x=0,y=0,index=0,rot=0,cx=0,cy=0){
 const tr=rot?`translate(${x} ${y}) rotate(${rot} ${cx} ${cy})`:`translate(${x} ${y})`;
 return `<g class="piece" data-piece="${index}" transform="${tr}">${svgPath(d,{fill:color,stroke:'none',cls:'math-area'})}${svgPath(d,{fill:'none',stroke:'#e2fcef',width:2.2,cls:'math-peri-piece'})}</g>`;
}

  draw+=badge(450+ox,66+oy,350,28,'오른쪽 볼록 반원을 잘라 왼쪽 빈 홈으로 평행이동');
  area=6*r*r;per=6*r+2*PI*r;
  periText=t>.9?`원본 ${cm(per)} → 변형 후 ${cm(10*r)}`:cm(per);
  formula=`넓이 = 직사각형(3r × 2r) = 6r² = ${cm2(area)} (원래 둘레 = 6r + 2πr = ${cm(per)})`;
  info='오른쪽에 볼록 튀어나온 반원 조각(반지름 r)을 왼쪽으로 3r만큼 평행이동하면 왼쪽의 오목한 반원 홈에 빈틈없이 들어맞아 직사각형이 됩니다.';
  question='곡선 조각을 옮겨 직사각형이 된 뒤, 둘레도 직사각형의 둘레와 같을까요?';
  answer='아닙니다! 조각을 옮기면 넓이(면)는 그대로 보존되지만, 곡선(2πr)이 직선(4r)으로 바뀌었으므로 원래 둘레(6r+2πr)와 직사각형 둘레(10r)는 다릅니다.';
  warn='등적변형(조각 옮기기)은 넓이를 구할 때만 사용합니다. 둘레는 반드시 이동 전 원래 도형의 바깥 경계에서 구해야 합니다.';
  title='곡선 조각으로 직사각형 만들기';
  stepTexts=[
   `1단계 [원본 관찰]: 왼쪽은 반원만큼 파여 있고 오른쪽은 반원만큼 튀어나온 도형입니다 (원래 둘레 ${cm(per)}).`,
   `2단계 [보조선 절단]: 오른쪽 반원이 시작되는 세로 보조선(점선)을 따라 볼록한 반원 조각을 구분합니다.`,
   `3단계 [조각 분리]: 오른쪽 볼록 반원 조각(반지름 ${r}cm)을 본체에서 떼어냅니다.`,
   `4단계 [평행이동]: 떼어낸 반원 조각을 왼쪽 빈 반원 홈을 향해 3r(${3*r}cm)만큼 옮깁니다.`,
   `5단계 [직사각형 완성]: 빈 홈이 완벽히 채워져 가로 ${3*r}cm, 세로 ${2*r}cm인 직사각형 넓이 ${cm2(area)}가 됩니다!`
  ];
 }
 else if(type==='combine'){
  const R=130*visualScale(r),small=R/2,cx=445+ox,cy=295+oy,left=cx-R,right=cx+R;
  refPx=R;
  segs=[
   boundaryArc(cx,cy,R,PI,2*PI,COL.arc,'큰 반원호 (πr)'),
   boundaryArc(cx+small,cy,small,0,PI,COL.arc2,'오른 아래 반원호 (πr/2)'),
   boundaryArc(cx-small,cy,small,0,-PI,COL.line,'왼 위 파낸 반원호 (πr/2)')
  ];
  const bigMinus=`M${left} ${cy} A${R} ${R} 0 0 1 ${right} ${cy} L${cx} ${cy} A${small} ${small} 0 0 0 ${left} ${cy} Z`;
  const origOutline=`M${left} ${cy} A${R} ${R} 0 0 1 ${right} ${cy} A${small} ${small} 0 0 1 ${cx} ${cy} A${small} ${small} 0 0 0 ${left} ${cy} Z`;
  const localSemi=`M${-small} 0 A${small} ${small} 0 0 0 ${small} 0 Z`;
  const man=S.manual['0']||p(0,0);
  const px=(cx+small)+(-R)*t+man.x,py=cy+(-45*Math.sin(PI*t))+man.y,rot=180*t;
  draw+=svgPath(bigMinus,{fill:'rgba(56,189,248,.32)',stroke:COL.arc,width:2.5,cls:'math-area'});
  draw+=svgPiece(localSemi,t>.02?'rgba(52,211,153,.52)':'rgba(56,189,248,.32)',px,py,0,rot,0,0);
  draw+=svgPath(origOutline,{fill:'none',stroke:COL.arc,width:t>.02?1.8:3.8,dash:t>.02?'6 6':'',cls:'math-peri'});
  if(showAux)draw+=line(left,cy,right,cy,COL.amber,2.4,'6 5','math-aux');
  if(step===4||t>.9){
   draw+=svgPath(`M${left} ${cy} A${R} ${R} 0 0 1 ${right} ${cy} Z`,{fill:'none',stroke:COL.amber,width:3.6,dash:'7 5',cls:'math-peri'});
   draw+=badge(cx,cy+38,330,28,`큰 반원 1개로 합체 완성! 넓이 = πr²/2 = ${cm2(PI*r*r/2)}`);
  }
  draw+=badge(450+ox,66+oy,360,28,'오른쪽 아래 작은 반원을 회전·이동해 왼쪽 위 빈 홈 채우기');
  area=PI*r*r/2;per=2*PI*r;
  periText=t>.9?`원본 ${cm(2*PI*r)} → 반원 ${cm(PI*r+2*r)}`:cm(2*PI*r);
  formula=`넓이 = 큰 반원(πr²/2) + 작은 반원 − 작은 반원 = πr²/2 = ${cm2(area)}`;
  info='원래 도형에서 오른쪽 아래로 볼록한 작은 반원(반지름 r/2)을 잘라 180° 회전해 왼쪽 위의 파인 반원 홈에 끼우면 반지름 r인 큰 반원 1개가 됩니다.';
  question='더하는 작은 반원과 빼는 작은 반원의 반지름이 같을 때 최종 넓이는 무엇과 같나요?';
  answer='오른쪽 아래 반원이 왼쪽 위 빈자리를 정확히 메우므로 처음 큰 반원의 넓이(πr²/2)와 같습니다.';
  title='반원의 합과 차';
  stepTexts=[
   `1단계 [원본 관찰]: 큰 반원에서 왼쪽 위 작은 반원이 파이고 오른쪽 아래에 작은 반원이 붙은 도형입니다.`,
   `2단계 [보조선 절단]: 수평 지름 보조선을 그어 오른쪽 아래로 튀어나온 작은 반원(반지름 ${r/2}cm)을 확인합니다.`,
   `3단계 [조각 분리]: 오른쪽 아래 작은 반원 조각을 떼어내어 왼쪽 위 빈 홈으로 이동하기 시작합니다.`,
   `4단계 [회전·이동]: 작은 반원 조각을 180° 회전시키며 왼쪽 위 오목한 반원 홈에 맞춥니다.`,
   `5단계 [큰 반원 완성]: 빈 홈이 완벽히 메워져 반지름 ${r}cm인 큰 반원 1개의 넓이(${cm2(area)})가 됩니다!`
  ];
 }
 return {draw,segs:markSegments(segs,refPx),area,peri:per,periText,formula,info,question,answer,warn,title,stepTexts};
}

function renderProof(type){
 const r=S.r,t=S.morph,theta=rad(S.angle);let out='',area=0,peri=0,formula='',info='',question='',answer='',stepTexts=[];
 if(type==='circleProof'){
  const N=S.circleCount,d=2*PI/N,R=90*visualScale(r),sourceX=146+S.pan.x,sourceY=262+S.pan.y;
  const startX=Math.max(365,sourceX+R+78),topY=198+S.pan.y,botY=topY+R*Math.cos(PI/N),chord=2*R*Math.sin(PI/N);
  let paths='';
  const a0=-d/2,a1=d/2,local=wedgeD(0,0,R,a0,a1),localArc=arcD(0,0,R,a0,a1);
  for(let i=0;i<N;i++){
   const j=Math.floor(i/2),down=i%2===0;
   const tarX=startX+(j+(down?.5:1))*chord,tarY=down?topY:botY;
   const startRot=i*360/N;const endRot=down?90:-90;
   const ang=shortAngle(startRot,endRot,t);
   const px=sourceX+(tarX-sourceX)*t,py=sourceY+(tarY-sourceY)*t;
   const edgeR=i===0?line(0,0,R*Math.cos(a1),R*Math.sin(a1),COL.line,2.6,'','math-peri'):i===N-1?line(0,0,R*Math.cos(a0),R*Math.sin(a0),COL.line,2.6,'','math-peri'):'';
   paths+=`<g transform="translate(${px} ${py}) rotate(${ang})">${svgPath(local,{fill:down?'rgba(56,189,248,.38)':'rgba(52,211,153,.38)',stroke:down?COL.arc:COL.arc2,width:1.1,cls:'math-area'})}${svgPath(localArc,{stroke:down?COL.arc:COL.arc2,width:3,cls:'math-peri'})}${edgeR}</g>`;
  }
  const totalW=(N/2)*chord;
  out+=circle(sourceX,sourceY,R,COL.arc,'none',2,'math-aux')+paths;
  if(t>.82){
   out+=svgPath(`M${startX} ${topY} H${startX+totalW} V${botY} H${startX} Z`,{fill:'none',stroke:COL.amber,width:2.2,dash:'5 4',cls:'math-peri'});
   out+=line(startX,topY-16,startX+totalW,topY-16,COL.amber,2.5,'','math-peri')+label(startX+totalW/2,topY-26,`가로 ≈ 원주의 절반 (πr = ${fmt(PI*r)} cm)`,COL.amber,14);
   out+=line(startX-14,topY,startX-14,botY,COL.line,2.5,'','math-peri')+label(startX-42,(topY+botY)/2+5,`세로 r`,COL.line,13.5);
  }
  out+=label(sourceX,445,'원판 → 합동 부채꼴 분할',COL.white,14)+label(startX+totalW/2,445,`조각 ${N}개 맞물림: 직사각형(πr × r)에 수렴`,COL.white,14);
  area=PI*r*r;peri=2*PI*r;
  formula=`원의 넓이 = 가로(원주의 1/2 = πr) × 세로(반지름 = r) = πr² = ${cm2(area)}`;
  info='원을 합동인 부채꼴 조각으로 잘게 나누어 위·아래로 엇갈려 맞물리면 직사각형에 가까워집니다. 분할 수(8/16/32/64)와 반지름을 바꿔 확인하세요.';
  question='원을 한없이 잘게 나누어 만든 직사각형의 가로와 세로는 각각 원의 무엇과 같나요?';
  answer='가로는 원주의 절반(πr)이고, 세로는 원의 반지름(r)입니다. 따라서 넓이는 πr × r = πr²입니다.';
  stepTexts=[
   `1단계 [원본 원]: 반지름 ${r}cm인 원을 합동인 부채꼴 ${N}조각으로 똑같이 나눕니다.`,
   `2단계 [조각 분리]: 위쪽 조각(파랑)과 아래쪽 조각(초록)을 최단 회전 경로로 이동하기 시작합니다.`,
   `3단계 [엇갈려 맞물림]: 조각들을 위·아래로 지그재그로 맞물려 평행사변형 모양으로 배열합니다.`,
   `4단계 [공식 유도]: 조각 수가 많아질수록 가로가 πr(${fmt(PI*r)}cm), 세로가 r(${r}cm)인 직사각형이 되어 넓이 πr²(${cm2(area)})이 유도됩니다!`
  ];
 }else{
  const R=72*visualScale(r),cx=135+S.pan.x,cy=262+S.pan.y,a0=-PI/2,a1=a0+theta;
  const K=Math.max(2,Math.round(S.angle/15)),d=theta/K;
  const chord=2*R*Math.sin(d/2),totalBase=K*chord;
  const startX=Math.max(302+S.pan.x,Math.min(820-totalBase+S.pan.x,565-totalBase/2+S.pan.x)),baseY=326+S.pan.y;
  out+=circle(cx,cy,R,'#819d8e','rgba(52,211,153,.07)',1.5,'math-aux');
  out+=svgPath(wedgeD(cx,cy,R,a0,a1),{fill:'rgba(52,211,153,.18)',stroke:COL.arc,width:2.2,cls:'math-aux'});
  const local=wedgeD(0,0,R,-d/2,d/2),localArc=arcD(0,0,R,-d/2,d/2);
  for(let i=0;i<K;i++){
   const midAng=a0+(i+.5)*d;
   const startRot=midAng*180/PI;
   const tarX=startX+(i+.5)*chord,tarY=baseY-R*Math.cos(d/2);
   const ang=shortAngle(startRot,90,t);
   const px=cx+(tarX-cx)*t,py=cy+(tarY-cy)*t;
   const edgeR=(i===0?line(0,0,R*Math.cos(-d/2),R*Math.sin(-d/2),COL.line,2.5,'','math-peri'):'')+(i===K-1?line(0,0,R*Math.cos(d/2),R*Math.sin(d/2),COL.line,2.5,'','math-peri'):'');
   out+=`<g transform="translate(${px} ${py}) rotate(${ang})">${svgPath(local,{fill:'rgba(52,211,153,.42)',stroke:COL.arc,width:1.3,cls:'math-area'})}${svgPath(localArc,{stroke:COL.arc,width:3,cls:'math-peri'})}${edgeR}</g>`;
  }
  const arcLen=r*theta;
  if(t>.75)out+=line(startX,baseY,startX+totalBase,baseY,COL.arc,3.5,'','math-peri')+label(startX+totalBase/2,baseY+37,`밑변(현의 합) ≈ 호의 길이 l = ${cm(arcLen)}`,COL.arc,13.5);
  if(t>.75){
   out+=line(startX-14,baseY-R*Math.cos(d/2),startX-14,baseY,COL.line,2.8,'','math-peri')+label(startX-38,baseY-R/2+5,`높이 ≈ r`,COL.line,13.5);
  }
  out+=label(cx,445,`중심각 비율: ${S.angle}° / 360°`,COL.amber,14.5)+label(startX+totalBase/2,140,`합동 부채꼴 ${K}개(크기 불변 강체 이동): S = 1/2 × r × l`,COL.white,14);
  area=PI*r*r*S.angle/360;peri=arcLen+2*r;
  formula=`부채꼴 넓이 S = πr² × (${S.angle}°/360°) = 1/2 × r × l = ${cm2(area)}`;
  info='부채꼴 조각들의 크기(반지름 r)를 그대로 유지한 채 나란히 펼치면, 밑변 합이 호의 길이(l), 높이가 반지름(r)인 삼각형들의 합(1/2 rl)이 됩니다.';
  question='부채꼴 넓이 공식 S = 1/2 rl에서 l은 무엇을 뜻하나요?';
  answer='부채꼴의 호의 길이(l = 2πr × θ/360°)입니다. 중심각을 몰라도 반지름(r)과 호의 길이(l)를 알면 넓이를 바로 구할 수 있습니다.';
  stepTexts=[
   `1단계 [원본 부채꼴]: 반지름 ${r}cm, 중심각 ${S.angle}°인 부채꼴을 합동인 ${K}개의 작은 부채꼴 조각으로 나눕니다.`,
   `2단계 [강체 이동]: 각 부채꼴 조각의 넓이와 반지름(${r}cm)을 그대로 유지한 채 오른쪽으로 펼칩니다.`,
   `3단계 [삼각형 근사]: 잘게 나뉜 각 조각은 높이가 반지름 r(${r}cm)인 이등변삼각형에 가까워집니다.`,
   `4단계 [공식 S = 1/2 rl]: 삼각형들의 밑변 합이 호의 길이 l(${cm(arcLen)})이므로 총 넓이는 1/2 × r × l = ${cm2(area)}입니다!`
  ];
 }
 return {draw:out,area,peri,formula,info,question,answer,warn:'',stepTexts};
}

function buildModel(){
 const type=current()[0],r=S.r;let m;
 if(S.zone===4)m=areaExperiment(type);
 else if(S.zone===3)m=renderProof(type);
 else if(['cutout','track','leaf','combine'].includes(type))m=compositeGeometry(type);
 else m=baseGeometry(type,{...basicCenter(),cx:basicCenter().x,cy:basicCenter().y,R:basicRadius(),r});
 m.type=type;m.name=current()[1];m.segs=m.segs||[];
 return m;
}

function traceMarker(segments){
 if(!segments.length||!S.trace)return'';
 const isCompareOnly=S.zone===0&&['center','diameter','arc'].includes(model?.type);
 if(isCompareOnly){
  const idx=S.selected>=0?S.selected:0;
  const seg=segments[idx]||segments[0];
  const point=seg.at(S.trace%1);
  return circle(point.x,point.y,8,'#fff',COL.amber,3);
 }
 const total=segments.reduce((a,s)=>a+s.lenPx,0);
 let dist=(S.trace%1)*total,point=null;
 for(const s of segments){if(dist<=s.lenPx){point=s.at(dist/s.lenPx);break}dist-=s.lenPx}
 if(!point)point=segments[segments.length-1].at(1);
 return circle(point.x,point.y,8,'#fff',COL.amber,3);
}

function showModel(m){
 const noArea=m.type==='arc';
 if(noArea&&S.lens==='area')S.lens='both';
 const arcShapes=m.segs?.length?boundaryLayer(m.segs,S.zone===4):'';
 const geometry=`<defs><pattern id="mesh" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#6e9a7c" stroke-opacity=".13" stroke-width=".7"/></pattern></defs><rect x="0" y="0" width="900" height="530" fill="url(#mesh)" data-bg="1"/>`;
 const isMob=window.innerWidth<=600;
 const vb=isMob&&(S.zone===0||S.zone===1||S.zone===5)?'130 30 640 480':isMob&&S.zone===2?'55 25 790 500':isMob&&S.zone===4?'65 35 770 475':isMob&&S.zone===3?'35 45 835 450':'0 0 900 530';
 $('scene').setAttribute('viewBox',vb);
 $('scene').setAttribute('class','lens-'+S.lens);
 $('scene').innerHTML=geometry+`<g id="geomLayer">${m.draw}</g><g id="boundaryLayer">${arcShapes}</g>`+traceMarker(m.segs)+(m.hud||'')+`<g id="handleLayer">${m.handle||''}</g>`;
 const name=current()[1];
 $('boardCaption').textContent=`${zones[S.zone].short} · ${name}`;
 $('boardHint').textContent=S.zone===4?'단계·슬라이더로 면을 분리하고 조각을 직접 끌어보세요':S.zone===2?'칠판의 선이나 펼친 둘레·하단 줄자 버튼을 누르면 해당 구간이 강조됩니다':'도형 핸들과 슬라이더를 직접 조작하세요 (배경 드래그 시 화면 이동)';
 $('tag').textContent=zones[S.zone].name;
 $('title').textContent=name;
 $('description').textContent=m.info||'그림에서 서로 다른 선과 면을 눌러 확인해 보세요.';
 const isLineConcept=S.zone===0&&['center','diameter','arc'].includes(m.type);
 $('periLabel').textContent=isLineConcept?'선 요소 길이 (cm)':'둘레 · 선 (cm)';
 $('areaLabel').textContent='넓이 · 면 (cm²)';
 $('areaNum').textContent=m.areaText||(Number.isFinite(m.area)?cm2(m.area):'구성별 확인');
 $('periNum').textContent=m.periText||(Number.isFinite(m.peri)?cm(m.peri):'조각 이동 중 변화');
 $('formula').innerHTML=formatFormulaHtml(m.formula||'도형을 선택해 보세요.');
 $('question').textContent=m.question||'색칠된 면과 바깥 경계선의 차이를 설명해 보세요.';
 $('answer').textContent=m.answer||'도형을 직접 확인해 보세요.';
 const mStep=maxStep(),n=mStep+1;
 $('stepCounter').textContent=`${S.step+1} / ${n}`;
 const titles=S.zone===4
  ?['원본 도형 관찰','보조선 및 구조 파악','조각 분리 시작','실제 조각 등적 이동','결과와 넓이 수식 연결']
  :S.zone===3
  ?['원본 도형 관찰','부채꼴 조각 분할','조각 회전·재배열','가로·세로와 넓이 공식 유도']
  :S.step===0
  ?['전체 도형과 경계 관찰']
  :[`경계 구간 ${S.step}번 (${m.segs[S.selected]?.name||'선분/호'}) 집중 관찰`];
 $('stepTitle').textContent=titles[Math.min(titles.length-1,S.step)]||titles[0];
 const defaultStepExplain=m.segs?.length&&S.selected>=0
  ?`선택된 경계: [${m.segs[S.selected].name}] 길이 = ${cm(m.segs[S.selected].len)} (전체 둘레의 ${fmt(m.segs[S.selected].len/m.peri*100,1)}%). 칠판에서 빛나는 선과 하단 줄자 비율을 확인하세요.`
  :'선은 1차원 길이(cm)이고, 색칠된 내부는 2차원 넓이(cm²)입니다. 다음 단계 버튼이나 줄자 버튼을 눌러 각 구간을 차례대로 확인하세요.';
 const selectedRulerNote=S.zone===4&&S.selected>=0&&m.segs?.[S.selected]
  ?` [선택된 원래 경계: ${m.segs[S.selected].name} = ${cm(m.segs[S.selected].len)}]`
  :'';
 $('stepText').textContent=(m.stepTexts?.[S.step]||defaultStepExplain)+selectedRulerNote;
 $('warning').classList.toggle('hidden',!m.warn);
 $('warning').textContent=m.warn||'';
 $('prev').disabled=S.step===0;
 $('next').disabled=S.step>=mStep;
 $('morphLine').classList.toggle('hidden',S.zone!==3&&S.zone!==4);
 $('pieceWrap').classList.toggle('hidden',!(S.zone===3&&S.item===0));
 $('pieceCount').value=String(S.circleCount);
 $('morph').value=Math.round(S.morph*100);
 $('morphVal').textContent=Math.round(S.morph*100)+'%';
 $('rulerBox').classList.toggle('hidden',!m.segs.length);
 renderRuler(m);
 $('legend').innerHTML=`<span><i class="bar-color" style="background:${COL.arc}"></i>호·곡선</span><span><i class="bar-color" style="background:${COL.line}"></i>외곽 선분</span><span><i class="bar-color" style="background:${COL.arc2}"></i>다른 호 / 색칠 면</span><span><i class="bar-color dashed"></i>보조선(둘레 제외)</span>`;
 $('zoneLabel').textContent=`${S.zone+1}/6 구역`;
 document.querySelectorAll('[data-lens]').forEach(b=>{
  if(b.dataset.lens==='area')b.disabled=noArea;
  b.classList.toggle('active',b.dataset.lens===S.lens);
  b.setAttribute('aria-pressed',b.dataset.lens===S.lens);
 });
 if(S.zone===3&&m.type==='circleProof')$('boardHint').textContent=`조각 ${S.circleCount}개 · 최단 회전 경로 부채꼴 맞물림`;
}

function renderRuler(m){
 const list=m.segs;
 if(!list?.length){$('ruler').innerHTML='';$('compareBars').innerHTML='';$('rulerLegend').innerHTML='';return}
 const isCompareOnly=S.zone===0&&['center','diameter','arc'].includes(m.type);
 $('ruler').classList.toggle('hidden',isCompareOnly);
 $('compareBars').classList.toggle('hidden',!isCompareOnly);
 if(isCompareOnly){
  const maxL=Math.max(...list.map(s=>s.len),1);
  $('compareBars').innerHTML=list.map((s,i)=>`<div class="compare-bar-row"><span style="min-width:78px;color:${s.color};font-weight:700">${s.name}</span><div class="compare-bar-track"><div class="compare-bar-fill" style="width:${(s.len/maxL)*100}%;background:${s.color};opacity:${S.selected<0||S.selected===i?1:.35}"></div></div><span style="min-width:62px;text-align:right;font-weight:800;color:${s.color}">${cm(s.len)}</span></div>`).join('');
  $('rulerTitle').textContent=`실제 길이 비례 선 요소 개별 비교 (합산 둘레 아님 · 버튼을 눌러 강조)`;
 }else{
  const total=list.reduce((a,s)=>a+s.len,0);
  $('ruler').innerHTML=list.map((s,i)=>`<span style="width:${(s.len/total)*100}%;background:${s.color};opacity:${S.selected<0||S.selected===i?1:.32}" title="${s.name}: ${cm(s.len)}"></span>`).join('');
  $('rulerTitle').textContent=`실제 길이 비례 둘레 줄자 · 외곽 둘레 합계 ${cm(total)} (내부 보조선 제외)`;
 }
 $('rulerLegend').innerHTML=list.map((s,i)=>`<button type="button" data-ruler="${i}" class="${S.selected===i?'active':''}" style="color:${s.color}">${i+1}. ${s.name} ${cm(s.len)}</button>`).join('');
}

function resetAnswerBox(){
 $('answer').classList.remove('visible');
 $('showAnswer').textContent='정답·해설 보기';
}

function render(){
 const z=zones[S.zone];
 $('tabs').innerHTML=zones.map((v,i)=>`<button type="button" data-zone="${i}" class="${S.zone===i?'active':''}" aria-pressed="${S.zone===i}">${v.name}</button>`).join('');
 $('scenarios').innerHTML=z.items.map((it,i)=>`<button type="button" data-item="${i}" class="${S.item===i?'active':''}" aria-pressed="${S.item===i}">${it[1]}</button>`).join('');
 $('radiusVal').textContent=S.r+' cm';
 const maxAng=current()[0]==='segment'?180:300;
 if(S.angle>maxAng)S.angle=maxAng;
 $('angleVal').textContent=S.angle+'°';
 $('radius').value=S.r;
 $('angle').max=maxAng;
 $('angle').value=S.angle;
 const showAng=usesAngle();
 $('angleTitle').classList.toggle('hidden',!showAng);
 $('angle').classList.toggle('hidden',!showAng);
 $('angleVal').classList.toggle('hidden',!showAng);
 model=buildModel();
 showModel(model);
}

function changeZone(i){
 S.zone=i;S.item=0;S.selected=-1;S.step=0;S.morph=0;S.pan=p(0,0);S.manual={};S.trace=0;S.angle=90;
 resetAnswerBox();stop();render();
}
function changeItem(i){
 S.item=i;S.step=0;S.morph=0;S.selected=-1;S.pan=p(0,0);S.manual={};S.trace=0;S.angle=90;
 resetAnswerBox();stop();render();
}

document.querySelector('.lenses').addEventListener('click',e=>{const b=e.target.closest('[data-lens]');if(b&&!b.disabled){S.lens=b.dataset.lens;render()}});
$('tabs').addEventListener('click',e=>{const b=e.target.closest('button[data-zone]');if(b)changeZone(+b.dataset.zone)});
$('scenarios').addEventListener('click',e=>{const b=e.target.closest('button[data-item]');if(b)changeItem(+b.dataset.item)});
$('rulerLegend').addEventListener('click',e=>{
 const b=e.target.closest('button[data-ruler]');
 if(b){
  const idx=+b.dataset.ruler;
  S.selected=S.selected===idx?-1:idx;
  if(S.zone!==4)S.step=S.selected>=0?S.selected+1:0;
  render();
 }
});
$('scene').addEventListener('click',e=>{
 if(e.target.closest('[data-handle],[data-piece]'))return;
 const b=e.target.closest('[data-segment]');
 if(b){
  const idx=+b.dataset.segment;
  S.selected=S.selected===idx?-1:idx;
  if(S.zone!==4)S.step=S.selected>=0?S.selected+1:0;
  render();
 }
});
$('prev').addEventListener('click',()=>setManualStep(S.step-1));
$('next').addEventListener('click',()=>setManualStep(S.step+1));
$('reset').addEventListener('click',()=>{
 S.step=0;S.morph=0;S.selected=-1;S.pan=p(0,0);S.manual={};S.trace=0;
 resetAnswerBox();stop();render();
});
$('radius').addEventListener('input',e=>{S.r=+e.target.value;render()});
$('angle').addEventListener('input',e=>{S.angle=+e.target.value;render()});
$('morph').addEventListener('input',e=>{
 S.morph=+e.target.value/100;
 if(S.zone===4){
  const m=S.morph;
  S.step=m===0?0:m<.2?1:m<.6?2:m<.95?3:4;
 }else{
  S.step=Math.min(maxStep(),Math.round(S.morph*maxStep()));
 }
 render();
});
$('pieceCount').addEventListener('change',e=>{S.circleCount=+e.target.value;render()});
$('showAnswer').addEventListener('click',()=>{
 $('answer').classList.toggle('visible');
 $('showAnswer').textContent=$('answer').classList.contains('visible')?'해설 닫기':'정답·해설 보기';
});

let animationId=null;
function stop(){
 if(animationId){cancelAnimationFrame(animationId);animationId=null}
 $('play').textContent='▶ 자동';
}
$('play').addEventListener('click',()=>{
 if(animationId){stop();return}
 S.step=0;S.morph=0;S.selected=-1;S.manual={};render();
 $('play').textContent='❚❚ 정지';
 const start=performance.now(),dur=4200;
 function tick(now){
  const t=Math.min(1,(now-start)/dur);
  const mStep=maxStep();
  S.morph=t;
  if(S.zone!==3&&S.zone!==4&&model?.segs?.length){
   const len=model.segs.length;
   const isCompareOnly=S.zone===0&&['center','diameter','arc'].includes(model?.type);
   if(t<1){
    if(isCompareOnly){
     S.selected=Math.min(len-1,Math.floor(t*len));
     S.trace=(t*len)%1;
    }else{
     S.trace=t;
     S.selected=getSegIndexAt(model.segs,t);
    }
    S.step=S.selected+1;
   }else{
    S.trace=0;
    S.selected=len-1;
    S.step=mStep;
   }
  }else if(S.zone===4){
   S.step=t===0?0:t<.2?1:t<.6?2:t<.95?3:4;
  }else{
   S.step=Math.min(mStep,Math.floor(t*(mStep+.0001)));
  }
  render();
  if(t<1)animationId=requestAnimationFrame(tick);
  else stop();
 }
 animationId=requestAnimationFrame(tick);
});

const scene=$('scene');
function coords(e){
 const pt=scene.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;
 const m=scene.getScreenCTM();if(!m)return p(0,0);
 const q=pt.matrixTransform(m.inverse());return p(q.x,q.y);
}
scene.addEventListener('pointerdown',e=>{
 const target=e.target.closest('[data-handle],[data-piece]');
 let pos=coords(e);
 if(target?.dataset.handle==='angle'){
  S.drag={kind:'angle',id:e.pointerId};
 }else if(target?.hasAttribute('data-piece')){
  S.drag={kind:'piece',id:e.pointerId,piece:target.dataset.piece,start:pos,initial:S.manual[target.dataset.piece]||p(0,0)};
 }else if(e.target.closest('[data-segment]')){
  return;
 }else{
  S.drag={kind:'pan',id:e.pointerId,start:pos,initial:p(S.pan.x,S.pan.y)};
 }
 if(S.drag){scene.setPointerCapture(e.pointerId);e.preventDefault();}
});
scene.addEventListener('pointermove',e=>{
 if(!S.drag||S.drag.id!==e.pointerId)return;
 const pos=coords(e);
 if(S.drag.kind==='piece'){
  S.manual[S.drag.piece]=p(S.drag.initial.x+pos.x-S.drag.start.x,S.drag.initial.y+pos.y-S.drag.start.y);
 }else if(S.drag.kind==='pan'){
  const maxY=S.zone===2?35:100;
  S.pan=p(Math.max(-140,Math.min(140,S.drag.initial.x+pos.x-S.drag.start.x)),Math.max(-95,Math.min(maxY,S.drag.initial.y+pos.y-S.drag.start.y)));
 }else{
  const c=basicCenter();
  const a=Math.atan2(pos.y-c.y,pos.x-c.x);
  let diff=(a+PI/2+2*PI)%(2*PI);
  const d=Math.max(30,Math.min(current()[0]==='segment'?180:300,Math.round((diff*180/PI)/15)*15));
  S.angle=d;
 }
 render();
 e.preventDefault();
});
function endDrag(e){
 if(S.drag&&S.drag.id===e.pointerId){
  S.drag=null;
  if(scene.hasPointerCapture(e.pointerId))scene.releasePointerCapture(e.pointerId);
 }
}
scene.addEventListener('pointerup',endDrag);
scene.addEventListener('pointercancel',endDrag);
window.addEventListener('keydown',e=>{
 if(e.target.matches('input,select,textarea'))return;
 if(e.key==='ArrowRight')setManualStep(S.step+1);
 if(e.key==='ArrowLeft')setManualStep(S.step-1);
});
window.addEventListener('resize',()=>render());

window.APBoardRelHost={
 getState:()=>({...S,scenario:current()[0],zoneName:zones[S.zone].name}),
 setZone:i=>changeZone(i),
 setScenario:i=>changeItem(i),
 reset:()=>$('reset').click()
};
if(new URLSearchParams(location.search).get("start")==="basic"){S.zone=1;S.item=0;}
render();
</script>
