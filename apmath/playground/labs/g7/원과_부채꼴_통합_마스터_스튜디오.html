<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>원과 부채꼴 · 통합 마스터 스튜디오</title>
  <!-- Pretendard Webfont -->
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome 6 CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <!-- KaTeX CDN -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>

  <style>
    * {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      background-color: #F8FAFC;
      color: #0F172A;
      overflow: hidden;
    }
    .math-frac {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      vertical-align: middle;
      margin: 0 3px;
      line-height: 1.05;
      font-weight: 700;
    }
    .math-frac > .num {
      border-bottom: 1.5px solid currentColor;
      padding: 0 3px 1px 3px;
      font-size: 0.88em;
      text-align: center;
      width: 100%;
    }
    .math-frac > .den {
      padding: 1px 3px 0 3px;
      font-size: 0.88em;
      text-align: center;
      width: 100%;
    }
    .katex { font-size: 1.02em !important; }
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: #F1F5F9; }
    ::-webkit-scrollbar-thumb { background: #CBD5E1; border-radius: 3px; }

    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      background: #E2E8F0;
      height: 5px;
      border-radius: 4px;
      outline: none;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 15px;
      height: 15px;
      border-radius: 50%;
      background: #2563EB;
      cursor: pointer;
      border: 2px solid #FFFFFF;
      box-shadow: 0 1px 4px rgba(15, 23, 42, 0.35);
    }

    .mode-tab.active {
      background: #0F172A;
      color: #FFFFFF;
      border-color: #0F172A;
      font-weight: 800;
      box-shadow: 0 2px 6px rgba(15, 23, 42, 0.18);
    }
    .sub-pill.active {
      background: #2563EB;
      color: #FFFFFF;
      border-color: #1D4ED8;
      font-weight: 800;
      box-shadow: 0 2px 6px rgba(37, 99, 235, 0.25);
    }
    .lens-btn.active {
      background: #EFF6FF;
      border-color: #2563EB;
      color: #1D4ED8;
      font-weight: 800;
    }
    .preset-chip.active {
      background: #0F172A;
      color: #FFFFFF;
      border-color: #0F172A;
      font-weight: 800;
    }
    .step-btn.active {
      background: #F0FDF4;
      border-color: #16A34A;
      color: #15803D;
      font-weight: 800;
    }
    .pi-tag {
      display: inline-flex;
      align-items: center;
      padding: 1px 6px;
      border-radius: 5px;
      background: rgba(37, 99, 235, 0.12);
      border: 1.5px solid #2563EB;
      color: #1D4ED8;
      font-weight: 800;
      margin: 0 1px;
    }
    .num-tag {
      display: inline-flex;
      align-items: center;
      padding: 1px 6px;
      border-radius: 5px;
      background: rgba(225, 29, 72, 0.12);
      border: 1.5px solid #E11D48;
      color: #BE123C;
      font-weight: 800;
      margin: 0 1px;
    }
    @media (max-width: 1023px) {
      html, body { height: auto !important; overflow-y: auto !important; overflow-x: hidden !important; }
      body { display: block !important; }
      #workspace { display: flex !important; flex-direction: column !important; height: auto !important; }
      #canvasStage { height: clamp(420px, 58svh, 580px) !important; flex: 0 0 auto !important; }
      #rightPanel { width: 100% !important; height: auto !important; border-left: none !important; border-top: 1px solid #E2E8F0 !important; }
    }
  </style>
</head>
<body class="h-screen w-screen flex flex-col">

  <!-- ===================================================================== -->
  <!-- 상단 헤더 & 4대 핵심 마스터 모드 탭 바 (기초 + 심화 통합) -->
  <!-- ===================================================================== -->
  <header class="bg-white border-b border-slate-200 px-4 py-2 flex flex-wrap items-center justify-between gap-2 z-20 shrink-0 shadow-sm">
    <div class="flex items-center gap-2">
      <div class="w-7 h-7 rounded-lg bg-slate-900 text-white flex items-center justify-center font-black text-xs shadow-sm">
        <i class="fa-solid fa-compass-drafting"></i>
      </div>
      <h1 class="text-sm md:text-base font-black tracking-tight text-slate-900">원과 부채꼴 마스터 스튜디오</h1>
      <span class="text-[10px] font-extrabold px-2 py-0.5 rounded bg-blue-50 text-blue-700 border border-blue-200">16대 유형 올인원</span>
    </div>

    <nav class="flex items-center gap-1 overflow-x-auto py-0.5 max-w-full">
      <button onclick="setMode(1)" id="tab-1" class="mode-tab active text-xs px-3 py-1.5 rounded-lg border border-slate-200 bg-slate-50 text-slate-700 hover:bg-slate-100 transition whitespace-nowrap flex items-center gap-1.5">
        <i class="fa-solid fa-shapes"></i>
        <span>1. 기본 원리·정비례</span>
      </button>
      <button onclick="setMode(2)" id="tab-2" class="mode-tab text-xs px-3 py-1.5 rounded-lg border border-slate-200 bg-slate-50 text-slate-700 hover:bg-slate-100 transition whitespace-nowrap flex items-center gap-1.5">
        <i class="fa-solid fa-scissors"></i>
        <span>2. 색칠 넓이·등적변형</span>
      </button>
      <button onclick="setMode(3)" id="tab-3" class="mode-tab text-xs px-3 py-1.5 rounded-lg border border-slate-200 bg-slate-50 text-slate-700 hover:bg-slate-100 transition whitespace-nowrap flex items-center gap-1.5">
        <i class="fa-solid fa-bug"></i>
        <span>3. 결합 둘레·원 안의 원</span>
      </button>
      <button onclick="setMode(4)" id="tab-4" class="mode-tab text-xs px-3 py-1.5 rounded-lg border border-slate-200 bg-slate-50 text-slate-700 hover:bg-slate-100 transition whitespace-nowrap flex items-center gap-1.5">
        <i class="fa-solid fa-wand-magic-sparkles"></i>
        <span>4. 보조선·굴리기·목줄</span>
      </button>
    </nav>
  </header>

  <!-- ===================================================================== -->
  <!-- 2분할 워크스페이스 (좌측 인터랙티브 제도판 + 우측 440px 버튼형 컨트롤러) -->
  <!-- ===================================================================== -->
  <div id="workspace" class="flex-1 flex flex-col lg:flex-row overflow-hidden relative">

    <!-- 좌측: HTML5 Canvas 2D 인터랙티브 제도판 -->
    <main id="canvasStage" class="flex-1 relative bg-[#F8FAFC] overflow-hidden flex items-center justify-center">
      <canvas id="boardCanvas" class="w-full h-full block cursor-pointer"></canvas>

      <!-- 좌측 상단: 4대 서브 도형 버튼 + 원클릭 뷰 렌즈 + 핵심 등식 배지 -->
      <div class="absolute top-3 left-3 right-3 pointer-events-none flex flex-col gap-1.5 max-w-2xl z-10">
        <!-- 4개 서브 도형 선택 버튼 -->
        <div id="subSelectorBar" class="pointer-events-auto bg-white/95 backdrop-blur border border-slate-200 rounded-xl p-1 shadow-sm flex flex-wrap items-center gap-1 w-fit"></div>

        <!-- 원클릭 렌즈 & 실시간 블록 등식 -->
        <div class="pointer-events-auto bg-white/95 backdrop-blur border border-slate-200 rounded-xl px-2.5 py-1.5 shadow-sm flex flex-wrap items-center gap-2 w-fit max-w-full">
          <div class="flex items-center gap-1">
            <button onclick="setLens('all')" id="lens-all" class="lens-btn active px-2 py-0.5 rounded border border-slate-200 text-[11px] text-slate-700 transition">🔍 전체</button>
            <button onclick="setLens('area')" id="lens-area" class="lens-btn px-2 py-0.5 rounded border border-slate-200 text-[11px] text-slate-700 transition">🎨 넓이</button>
            <button onclick="setLens('perim')" id="lens-perim" class="lens-btn px-2 py-0.5 rounded border border-slate-200 text-[11px] text-slate-700 transition">🐜 둘레</button>
            <button onclick="setLens('aux')" id="lens-aux" class="lens-btn px-2 py-0.5 rounded border border-slate-200 text-[11px] text-slate-700 transition">🎯 보조선</button>
          </div>
          <div id="visualEqBadge" class="text-[11.5px] font-bold text-slate-800 flex flex-wrap items-center gap-1 border-l border-slate-200 pl-2"></div>
        </div>
      </div>

      <!-- 좌측 하단: 플로팅 원클릭 작동 버튼 바 -->
      <div class="absolute bottom-3.5 left-3.5 flex flex-wrap items-center gap-1.5 bg-white/95 backdrop-blur border border-slate-200 p-1.5 rounded-xl shadow-md z-10">
        <button onclick="triggerAnim()" id="btnAction" class="px-3.5 py-1.5 rounded-lg bg-blue-600 hover:bg-blue-700 text-white text-xs font-extrabold flex items-center gap-1.5 transition shadow-sm">
          <i class="fa-solid fa-play" id="iconAction"></i>
          <span id="txtAction">🎬 분해·합체 실행</span>
        </button>
        <button onclick="startAntWalk()" class="px-3 py-1.5 rounded-lg bg-rose-50 hover:bg-rose-100 text-rose-700 border border-rose-200 text-xs font-extrabold flex items-center gap-1.5 transition">
          <i class="fa-solid fa-bug"></i>
          <span>🐜 개미 둘레 줄자</span>
        </button>
        <button onclick="toggleCornerGather()" id="btnCornerGather" class="hidden px-3 py-1.5 rounded-lg bg-amber-50 hover:bg-amber-100 text-amber-800 border border-amber-300 text-xs font-extrabold items-center gap-1 transition">
          <span>🧲 360° 원 합체</span>
        </button>
        <button onclick="snapToProblem()" class="px-2.5 py-1.5 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-800 border border-slate-200 text-xs font-bold flex items-center gap-1 transition" title="대표 기출 수치로 즉시 스냅">
          <i class="fa-solid fa-crosshairs text-blue-600"></i>
          <span>기출 스냅</span>
        </button>
        <div class="h-4 w-[1px] bg-slate-200 mx-0.5"></div>
        <button onclick="zoomCanvas(1.12)" class="w-7 h-7 rounded-lg hover:bg-slate-100 text-slate-700 flex items-center justify-center text-xs transition" title="확대"><i class="fa-solid fa-plus"></i></button>
        <button onclick="zoomCanvas(0.89)" class="w-7 h-7 rounded-lg hover:bg-slate-100 text-slate-700 flex items-center justify-center text-xs transition" title="축소"><i class="fa-solid fa-minus"></i></button>
        <button onclick="resetView()" class="w-7 h-7 rounded-lg hover:bg-slate-100 text-slate-700 flex items-center justify-center text-xs transition" title="초기화"><i class="fa-solid fa-rotate-left"></i></button>
      </div>
    </main>

    <!-- =================================================================== -->
    <!-- 우측(440px): 컴팩트 버튼형 컨트롤러 & 핵심 요약 패널 -->
    <!-- =================================================================== -->
    <aside id="rightPanel" class="w-full lg:w-[440px] bg-white border-l border-slate-200 flex flex-col h-full shrink-0 z-10">
      <div class="p-3 overflow-y-auto flex-1 space-y-2.5">

        <!-- 1. 실전 기출 문제 카드 + 원클릭 3지선다 -->
        <section class="bg-white border border-slate-200 rounded-xl p-3 shadow-sm">
          <div class="flex items-center justify-between mb-1.5">
            <span id="examBadge" class="text-[11px] font-extrabold px-2 py-0.5 rounded bg-slate-900 text-white">핵심 기출 유형</span>
            <button onclick="snapToProblem()" class="text-[11px] font-extrabold px-2 py-0.5 rounded-md bg-blue-50 hover:bg-blue-100 text-blue-700 border border-blue-200 transition">
              🎯 문제 조건 스냅
            </button>
          </div>

          <div id="examQuestion" class="text-xs text-slate-800 leading-snug bg-slate-50 p-2.5 rounded-lg border border-slate-200/80 mb-2 font-medium"></div>

          <!-- 3지선다 버튼 -->
          <div id="quizBox" class="grid grid-cols-3 gap-1.5 mb-1.5"></div>
          <div id="quizFeedback" class="text-[11px] font-bold text-blue-700 min-h-[15px] mb-1"></div>

          <div class="bg-slate-50 px-2.5 py-1.5 rounded-lg border border-slate-200 flex items-center justify-between text-xs">
            <span class="text-slate-500 font-bold shrink-0">정답 식:</span>
            <span id="answerSummary" class="font-extrabold text-slate-900 text-right"></span>
          </div>
        </section>

        <!-- 2. 버튼식 치수 프리셋 & 변신 컨트롤 + 불변량 모니터 -->
        <section class="bg-white border border-slate-200 rounded-xl p-3 shadow-sm space-y-2">
          <div class="flex items-center justify-between">
            <h2 class="text-xs font-extrabold text-slate-800 flex items-center gap-1.5">
              <i class="fa-solid fa-gamepad text-blue-600"></i>
              <span>원클릭 작동 &amp; 실시간 수치 모니터</span>
            </h2>
            <span class="text-[10px] font-mono font-bold px-2 py-0.5 rounded bg-emerald-50 text-emerald-700 border border-emerald-200">오차 0.000%</span>
          </div>

          <!-- 원클릭 작동 버튼 3단 & 슬라이더 겸용 -->
          <div class="bg-slate-50 p-2 rounded-lg border border-slate-200 space-y-1.5">
            <div class="flex items-center justify-between gap-1">
              <span class="text-[11px] font-extrabold text-slate-700">🎬 도형 작동:</span>
              <div class="flex items-center gap-1">
                <button onclick="setAnimVal(0)" class="px-2 py-0.5 rounded border border-slate-300 bg-white hover:bg-slate-100 text-[10.5px] font-bold text-slate-700">원래대로(0%)</button>
                <button onclick="setAnimVal(0.5)" class="px-2 py-0.5 rounded border border-slate-300 bg-white hover:bg-slate-100 text-[10.5px] font-bold text-slate-700">중간(50%)</button>
                <button onclick="setAnimVal(1)" class="px-2.5 py-0.5 rounded bg-blue-600 hover:bg-blue-700 text-[10.5px] font-extrabold text-white">완전 변신(100%)</button>
              </div>
            </div>
            <div class="flex items-center gap-2">
              <input type="range" id="sliderAnim" min="0" max="1" step="0.01" value="0" class="flex-1" oninput="onAnimSlider()" />
              <span id="valAnim" class="text-[11px] font-mono font-bold text-blue-700 w-9 text-right">0%</span>
            </div>
          </div>

          <!-- 반지름 r 버튼 + 각도/개수 프리셋 버튼 -->
          <div class="grid grid-cols-2 gap-1.5">
            <div class="bg-slate-50 p-2 rounded-lg border border-slate-200">
              <div class="flex justify-between items-center text-[10.5px] mb-1">
                <span class="font-bold text-slate-600">반지름 <strong class="text-blue-600">r</strong></span>
                <span id="valR" class="font-mono font-extrabold text-slate-900">6 cm</span>
              </div>
              <div id="rBtnGroup" class="grid grid-cols-4 gap-1"></div>
            </div>
            <div class="bg-slate-50 p-2 rounded-lg border border-slate-200">
              <div class="flex justify-between items-center text-[10.5px] mb-1">
                <span id="labelDeg" class="font-bold text-slate-600">중심각/개수</span>
                <span id="valDeg" class="font-mono font-extrabold text-slate-900">120°</span>
              </div>
              <div id="degBtnGroup" class="grid grid-cols-4 gap-1"></div>
            </div>
          </div>

          <!-- 4대 핵심 수치 카드 -->
          <div class="grid grid-cols-2 gap-1.5 text-xs font-mono">
            <div class="bg-slate-50 px-2.5 py-1.5 rounded-lg border border-slate-200">
              <div id="statL1" class="text-[10px] text-slate-500 font-sans font-semibold">조건 치수</div>
              <div id="statV1" class="text-[11px] font-extrabold text-slate-900 mt-0.5">-</div>
            </div>
            <div class="bg-slate-50 px-2.5 py-1.5 rounded-lg border border-slate-200">
              <div id="statL2" class="text-[10px] text-blue-600 font-sans font-semibold">🔵 곡선(π 상자)</div>
              <div id="statV2" class="text-[11px] font-extrabold text-blue-700 mt-0.5">-</div>
            </div>
            <div class="bg-slate-50 px-2.5 py-1.5 rounded-lg border border-slate-200">
              <div id="statL3" class="text-[10px] text-rose-600 font-sans font-semibold">🐜 전체 둘레</div>
              <div id="statV3" class="text-[11px] font-extrabold text-rose-700 mt-0.5">-</div>
            </div>
            <div class="bg-slate-50 px-2.5 py-1.5 rounded-lg border border-slate-200">
              <div id="statL4" class="text-[10px] text-emerald-600 font-sans font-semibold">🎨 색칠 넓이</div>
              <div id="statV4" class="text-[11px] font-extrabold text-emerald-700 mt-0.5">-</div>
            </div>
          </div>
        </section>

        <!-- 3. 단계별 보조선 Step 1~3 언락 버튼 -->
        <section class="bg-white border border-slate-200 rounded-xl p-2.5 shadow-sm">
          <div class="flex items-center justify-between mb-1.5">
            <h2 class="text-xs font-extrabold text-slate-800 flex items-center gap-1.5">
              <i class="fa-solid fa-layer-group text-emerald-600"></i>
              <span>단계별 보조선 레이어 (클릭 토글)</span>
            </h2>
            <button onclick="unlockAllSteps()" class="text-[10.5px] text-blue-600 hover:underline font-bold">모두 켜기</button>
          </div>
          <div class="grid grid-cols-3 gap-1.5">
            <button onclick="toggleStep(1)" id="stepBtn1" class="step-btn active px-2 py-1.5 rounded-lg border border-slate-200 text-[11px] text-center transition">
              Step 1. 기호·직각
            </button>
            <button onclick="toggleStep(2)" id="stepBtn2" class="step-btn active px-2 py-1.5 rounded-lg border border-slate-200 text-[11px] text-center transition">
              Step 2. 둘레 줄자
            </button>
            <button onclick="toggleStep(3)" id="stepBtn3" class="step-btn active px-2 py-1.5 rounded-lg border border-slate-200 text-[11px] text-center transition">
              Step 3. 마법 보조선
            </button>
          </div>
        </section>

        <!-- 4. 초압축 2대 비교 아코디언 (교과서 정석 vs 10초 컷 실전 비기) -->
        <section class="space-y-1.5">
          <div class="border border-slate-200 rounded-xl bg-white overflow-hidden shadow-sm">
            <button onclick="toggleAcc('std')" class="w-full px-3 py-2 flex items-center justify-between text-left bg-slate-50 hover:bg-slate-100 transition">
              <div class="flex items-center gap-2">
                <span class="px-1.5 py-0.5 rounded bg-slate-200 text-slate-700 text-[10px] font-extrabold">교과서 3분 정석</span>
                <span class="text-xs font-extrabold text-slate-800">공식 대입 &amp; 오답 주의</span>
              </div>
              <i id="accIcon-std" class="fa-solid fa-chevron-down text-slate-400 text-xs"></i>
            </button>
            <div id="accBody-std" class="hidden p-2.5 text-xs border-t border-slate-200 bg-white">
              <div id="stdText" class="text-[11.5px] text-slate-700 leading-relaxed"></div>
            </div>
          </div>

          <div class="border border-blue-200 rounded-xl bg-blue-50/40 overflow-hidden shadow-sm">
            <button onclick="toggleAcc('fast')" class="w-full px-3 py-2 flex items-center justify-between text-left bg-blue-50 hover:bg-blue-100/70 transition">
              <div class="flex items-center gap-2">
                <span class="px-1.5 py-0.5 rounded bg-blue-600 text-white text-[10px] font-extrabold">10초 컷 실전 비기</span>
                <span class="text-xs font-extrabold text-blue-950">보조선·합체·불변량 비법</span>
              </div>
              <i id="accIcon-fast" class="fa-solid fa-chevron-up text-blue-600 text-xs"></i>
            </button>
            <div id="accBody-fast" class="p-2.5 text-xs border-t border-blue-200 bg-white">
              <div id="fastText" class="text-[11.5px] text-slate-800 leading-relaxed font-medium"></div>
            </div>
          </div>
        </section>

      </div>
    </aside>
  </div>

  <!-- ===================================================================== -->
  <!-- 통합 물리·기하 렌더링 & 버튼 인터랙션 엔진 -->
  <!-- ===================================================================== -->
  <script>
    // -------------------------------------------------------------------------
    // 0. 수식 포맷터(KaTeX) 및 캔버스 세로 분수 렌더러
    // -------------------------------------------------------------------------
    function tex(latexStr) {
      if (window.katex) {
        return katex.renderToString(latexStr, { throwOnError: false, displayMode: false });
      }
      return latexStr;
    }

    function gcd(a, b) {
      a = Math.abs(Math.round(a));
      b = Math.abs(Math.round(b));
      while (b) { const t = b; b = a % b; a = t; }
      return a || 1;
    }

    function fmtPiTex(num, den = 1) {
      if (Math.abs(num) < 1e-6) return '0';
      const nR = Math.round(num * 100), dR = Math.round(den * 100);
      const g = gcd(nR, dR);
      const n = nR / g, d = dR / g;
      if (d === 1) return n === 1 ? '\\pi' : `${n}\\pi`;
      return `\\dfrac{${n}}{${d}}\\pi`;
    }

    function fmtPiTxt(num, den = 1) {
      if (Math.abs(num) < 1e-6) return '0';
      const nR = Math.round(num * 100), dR = Math.round(den * 100);
      const g = gcd(nR, dR);
      const n = nR / g, d = dR / g;
      if (d === 1) return n === 1 ? 'π' : `${n}π`;
      return `(${n}/${d})π`;
    }

    function drawCanvasFraction(px, py, numStr, denStr, color = '#0F172A', fontSize = 12) {
      ctx.save();
      ctx.font = `800 ${fontSize}px Pretendard, monospace`;
      ctx.fillStyle = color;
      ctx.strokeStyle = color;
      ctx.textAlign = 'center';
      const w = Math.max(ctx.measureText(numStr).width, ctx.measureText(denStr).width) + 8;
      ctx.fillText(numStr, px, py - 5);
      ctx.lineWidth = 1.8;
      ctx.beginPath();
      ctx.moveTo(px - w / 2, py);
      ctx.lineTo(px + w / 2, py);
      ctx.stroke();
      ctx.fillText(denStr, px, py + fontSize + 2);
      ctx.restore();
      return w;
    }

    function resizeCanvas() {
      const rect = canvas.parentElement.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      canvas.width = rect.width * dpr;
      canvas.height = rect.height * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    function drawAcademicGrid(rect) {
      const step = 20 * state.scale;
      ctx.save();
      ctx.strokeStyle = 'rgba(0, 0, 0, 0.035)';
      ctx.lineWidth = 1;
      for (let x = 0; x < rect.width; x += step) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, rect.height); ctx.stroke();
      }
      for (let y = 0; y < rect.height; y += step) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(rect.width, y); ctx.stroke();
      }
      ctx.restore();
    }

    function drawPointLabel(pt, txt, centerPt, dist = 19, color = '#0F172A') {
      if (!state.steps[1] && state.lens !== 'all') return;
      let dx = pt.x - (centerPt ? centerPt.x : pt.x);
      let dy = pt.y - (centerPt ? centerPt.y : pt.y - 1);
      const len = Math.hypot(dx, dy) || 1;
      dx /= len; dy /= len;

      ctx.save();
      ctx.beginPath();
      ctx.arc(pt.x, pt.y, 3.8, 0, Math.PI * 2);
      ctx.fillStyle = '#FFFFFF';
      ctx.fill();
      ctx.strokeStyle = '#0F172A';
      ctx.lineWidth = 2;
      ctx.stroke();

      ctx.font = '800 12.5px Pretendard, sans-serif';
      ctx.fillStyle = color;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(txt, pt.x + dx * dist, pt.y + dy * dist);
      ctx.restore();
    }

    function drawRightAngle(P, A, B, size = 12, color = '#2563EB') {
      if (!state.steps[1] && state.lens !== 'aux' && state.lens !== 'all') return;
      const v1x = A.x - P.x, v1y = A.y - P.y;
      const v2x = B.x - P.x, v2y = B.y - P.y;
      const l1 = Math.hypot(v1x, v1y) || 1, l2 = Math.hypot(v2x, v2y) || 1;
      const u1x = (v1x / l1) * size, u1y = (v1y / l1) * size;
      const u2x = (v2x / l2) * size, u2y = (v2y / l2) * size;

      ctx.save();
      ctx.beginPath();
      ctx.moveTo(P.x + u1x, P.y + u1y);
      ctx.lineTo(P.x + u1x + u2x, P.y + u1y + u2y);
      ctx.lineTo(P.x + u2x, P.y + u2y);
      ctx.strokeStyle = color;
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.fillStyle = 'rgba(37, 99, 235, 0.14)';
      ctx.fill();
      ctx.restore();
    }

    function drawTicks(A, B, count = 1, color = '#E11D48', size = 6.5) {
      if (!state.steps[1] && state.lens !== 'aux' && state.lens !== 'all') return;
      const mx = (A.x + B.x) / 2, my = (A.y + B.y) / 2;
      const dx = B.x - A.x, dy = B.y - A.y;
      const len = Math.hypot(dx, dy) || 1;
      const ux = dx / len, uy = dy / len;
      const nx = -uy, ny = ux;
      const gap = 4.5;

      ctx.save();
      ctx.strokeStyle = color;
      ctx.lineWidth = 2;
      for (let i = 0; i < count; i++) {
        const off = (i - (count - 1) / 2) * gap;
        const cx = mx + ux * off, cy = my + uy * off;
        ctx.beginPath();
        ctx.moveTo(cx - nx * size, cy - ny * size);
        ctx.lineTo(cx + nx * size, cy + ny * size);
        ctx.stroke();
      }
      ctx.restore();
    }

      const by = rect.height - 62;

      ctx.save();
      ctx.fillStyle = 'rgba(255, 255, 255, 0.96)';
      ctx.strokeStyle = '#CBD5E1';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.roundRect(startX - 14, by - 26, tapeW + 28, 48, 10);
      ctx.fill();
      ctx.stroke();

      ctx.font = '800 11px Pretendard, sans-serif';

      const prog = state.antActive ? state.antProg : 1.0;
      let acc = 0;
      let curPt = null;

      segments.forEach((seg, idx) => {
        const s0 = acc, s1 = acc + seg.weight;
        const x0 = startX + s0 * tapeW;
        const w = seg.weight * tapeW;
        let fill = 1.0;
        if (state.antActive) {
          if (prog <= s0) fill = 0;

          else {
            fill = (prog - s0) / seg.weight;
            curPt = seg.ptAt(fill);
          }
        }
        ctx.fillStyle = '#F1F5F9';
        ctx.fillRect(x0 + 2, by - 4, w - 4, 16);
        if (fill > 0) {
          ctx.fillStyle = seg.color;
          ctx.fillRect(x0 + 2, by - 4, (w - 4) * fill, 16);
        }
        ctx.fillStyle = '#FFFFFF';
        ctx.font = '800 10px Pretendard, monospace';
        ctx.textAlign = 'center';
        if (w > 34) ctx.fillText(`${seg.label}:${seg.len}`, x0 + w / 2, by + 7);
        if (idx < segments.length - 1) {
          ctx.fillStyle = '#0F172A';
          ctx.fillText('+', x0 + w, by + 7);
        }
        acc = s1;
      });

        ctx.strokeStyle = '#FFFFFF';

      }

      const R = Math.max(72, Math.min(136, r * pxPerCm));

      const showArea = state.lens === 'all' || state.lens === 'area';
      const showPerim = state.lens === 'all' || state.lens === 'perim';
      const showAux = state.lens === 'all' || state.lens === 'aux' || state.steps[3];

      const cx = rect.width / 2 + state.offsetX;
      const cy = rect.height * 0.45 + state.offsetY;

      ctx.save();

      // =======================================================================
      // [모드 1 렌더링]
      // =======================================================================
      if (m === 1) {
        if (sub === 'anatomy') {
          const sep = t * 52;
          const oPt = { x: cx - sep * 0.4, y: cy };
          const rad = (deg * Math.PI) / 180;
          const sA = -rad / 2, eA = rad / 2;
          const pA = { x: oPt.x + R * Math.cos(sA), y: oPt.y + R * Math.sin(sA) };
          const pB = { x: oPt.x + R * Math.cos(eA), y: oPt.y + R * Math.sin(eA) };

          ctx.beginPath(); ctx.arc(oPt.x, oPt.y, R, 0, Math.PI * 2);
          ctx.strokeStyle = '#CBD5E1'; ctx.lineWidth = 1.8; ctx.setLineDash([5, 5]); ctx.stroke(); ctx.setLineDash([]);

          if (showArea) {
            ctx.beginPath(); ctx.moveTo(oPt.x, oPt.y); ctx.arc(oPt.x, oPt.y, R, sA, eA); ctx.closePath();
            ctx.fillStyle = 'rgba(37, 99, 235, 0.16)'; ctx.fill();

            ctx.beginPath(); ctx.arc(oPt.x + sep, oPt.y, R, sA, eA); ctx.closePath();
            ctx.fillStyle = 'rgba(16, 185, 129, 0.24)'; ctx.fill();
          }

          ctx.beginPath(); ctx.moveTo(pA.x, pA.y); ctx.lineTo(oPt.x, oPt.y); ctx.lineTo(pB.x, pB.y);
          ctx.strokeStyle = '#0F172A'; ctx.lineWidth = 2.5; ctx.stroke();
          drawTicks(oPt, pA, 1, '#2563EB'); drawTicks(oPt, pB, 1, '#2563EB');

          if (showPerim) {
            ctx.beginPath(); ctx.moveTo(pA.x + sep, pA.y); ctx.lineTo(pB.x + sep, pB.y);
            ctx.strokeStyle = '#E11D48'; ctx.lineWidth = 3.5; ctx.stroke();

            ctx.beginPath(); ctx.arc(oPt.x + sep, oPt.y, R, sA, eA);
            ctx.strokeStyle = '#2563EB'; ctx.lineWidth = 4.5; ctx.stroke();
          }

          drawPointLabel(oPt, `O(${deg}°)`, { x: oPt.x + 40, y: oPt.y }, 26);

          drawPointLabel(pB, 'B', oPt, 18);
          state.handlePt = { x: pB.x, y: pB.y, center: oPt };
          drawHandle(pB, '각도 드래그');

          const lTxt = fmtPiTxt(2 * r * deg, 360);

          ], `${lTxt} + ${2 * r} cm`);
        } else if (sub === 'pizza') {
          const N = 16, halfN = 8, dAng = (Math.PI * 2) / N;

          const pR = R * 0.85;

            const slotW = rectW / halfN;
            const tx = cxR - rectW / 2 + idx * slotW + (isTop ? slotW / 2 : 0);
            const ty = cy + (isTop ? pR / 2 : -pR / 2);
            const tDir = isTop ? -Math.PI / 2 : Math.PI / 2;

            const vx = (1 - t) * cxC + t * tx;
            const vy = (1 - t) * cy + t * ty;
            let diff = tDir - cAng;
            while (diff > Math.PI) diff -= Math.PI * 2;
            while (diff < -Math.PI) diff += Math.PI * 2;
            const curA = cAng + t * diff;

            ctx.beginPath(); ctx.moveTo(vx, vy); ctx.arc(vx, vy, pR, curA - dAng / 2, curA + dAng / 2); ctx.closePath();
            if (showArea) {
              ctx.fillStyle = isTop ? 'rgba(37, 99, 235, 0.18)' : 'rgba(16, 185, 129, 0.18)';
              ctx.fill();
            }
            ctx.strokeStyle = '#64748B'; ctx.lineWidth = 1; ctx.stroke();

            if (showPerim) {
              ctx.beginPath(); ctx.arc(vx, vy, pR, curA - dAng / 2, curA + dAng / 2);
              ctx.strokeStyle = isTop ? '#2563EB' : '#059669'; ctx.lineWidth = 3.5; ctx.stroke();
            }
          }
          if (t > 0.25) {
            const rx0 = cxR - rectW / 2, rx1 = cxR + rectW / 2;
            const ry0 = cy - pR / 2, ry1 = cy + pR / 2;
            ctx.strokeStyle = '#E11D48'; ctx.lineWidth = 4;
            ctx.beginPath(); ctx.moveTo(rx0, ry0); ctx.lineTo(rx0, ry1); ctx.moveTo(rx1, ry0); ctx.lineTo(rx1, ry1); ctx.stroke();
            drawRightAngle({ x: rx0, y: ry1 }, { x: rx1, y: ry1 }, { x: rx0, y: ry0 }, 11);
            ctx.fillStyle = '#0F172A'; ctx.font = '800 12px Pretendard, sans-serif'; ctx.textAlign = 'center';
            ctx.fillText(`가로 = πr (${r}π cm)`, cxR, ry0 - 14);
            ctx.fillStyle = '#E11D48';
            ctx.fillText(`세로 = r (${r}cm) × 2개`, rx1 + 52, cy);
          }
        } else if (sub === 'sector') {
          const rad = (deg * Math.PI) / 180;
          const Rsec = Math.min(R, rect.width * 0.20, (rect.width * 0.42) / Math.max(rad, 0.2));
          const lx = rect.width * (0.45 - 0.17 * t) + state.offsetX;
          const sA = -rad / 2, eA = rad / 2;
          const pO = { x: lx, y: cy };
          const pA = { x: lx + Rsec * Math.cos(sA), y: cy + Rsec * Math.sin(sA) };
          const pB = { x: lx + Rsec * Math.cos(eA), y: cy + Rsec * Math.sin(eA) };

          ctx.beginPath(); ctx.arc(lx, cy, Rsec, 0, Math.PI * 2);
          ctx.strokeStyle = '#CBD5E1'; ctx.setLineDash([4, 4]); ctx.stroke(); ctx.setLineDash([]);

          if (showArea) {
            ctx.beginPath(); ctx.moveTo(lx, cy); ctx.arc(lx, cy, Rsec, sA, eA); ctx.closePath();
            ctx.fillStyle = 'rgba(37, 99, 235, 0.18)'; ctx.fill();
          }
          if (showPerim) {
            ctx.beginPath(); ctx.arc(lx, cy, Rsec, sA, eA);
            ctx.strokeStyle = '#2563EB'; ctx.lineWidth = 4.5; ctx.stroke();
            ctx.beginPath(); ctx.moveTo(pA.x, pA.y); ctx.lineTo(lx, cy); ctx.lineTo(pB.x, pB.y);
            ctx.strokeStyle = '#E11D48'; ctx.lineWidth = 3.5; ctx.stroke();
          }

          if (state.steps[3]) {
            const g = gcd(deg, 360);
            drawCanvasFraction(lx - Rsec * 0.45, cy - 4, `${deg}°`, '360°', '#0F172A', 11);
            ctx.fillStyle = '#2563EB'; ctx.font = '800 11.5px Pretendard, monospace';
            ctx.fillText(`= ${deg / g}/${360 / g}원`, lx - Rsec * 0.45 + 32, cy);
          }

          drawPointLabel(pO, 'O', { x: lx + 30, y: cy }, 18);
          drawPointLabel(pA, 'A', pO, 18);
          drawPointLabel(pB, 'B', pO, 18);
          state.handlePt = { x: pB.x, y: pB.y, center: pO };
          drawHandle(pB, '각도 드래그');

          if (t > 0.04) {
            const rx = rect.width * 0.72 + state.offsetX;
            const baseW = Rsec * rad;
            const topY = cy - Rsec * 0.5, botY = topY + Rsec;
            ctx.save();
            ctx.globalAlpha = t;
            ctx.beginPath(); ctx.moveTo(rx, topY); ctx.lineTo(rx + baseW / 2, botY); ctx.lineTo(rx - baseW / 2, botY); ctx.closePath();
            ctx.fillStyle = 'rgba(16, 185, 129, 0.20)'; ctx.fill();
            ctx.strokeStyle = '#0F172A'; ctx.lineWidth = 2; ctx.stroke();

            ctx.beginPath(); ctx.moveTo(rx - baseW / 2, botY); ctx.lineTo(rx + baseW / 2, botY);
            ctx.strokeStyle = '#2563EB'; ctx.lineWidth = 4; ctx.stroke();

            ctx.beginPath(); ctx.moveTo(rx, topY); ctx.lineTo(rx, botY);
            ctx.strokeStyle = '#E11D48'; ctx.setLineDash([4, 4]); ctx.lineWidth = 2; ctx.stroke(); ctx.setLineDash([]);
            drawRightAngle({ x: rx, y: botY }, { x: rx, y: topY }, { x: rx + baseW / 2, y: botY }, 10);

            ctx.fillStyle = '#0F172A'; ctx.font = '800 12px Pretendard, sans-serif'; ctx.textAlign = 'center';
            ctx.fillText(`밑변 l = ${fmtPiTxt(2 * r * deg, 360)}`, rx, botY + 18);
            ctx.fillStyle = '#E11D48';
            ctx.fillText(`높이 r = ${r}`, rx + 36, (topY + botY) / 2);
            ctx.fillStyle = '#059669';
            ctx.fillText(`S = ½rl = ${fmtPiTxt(r * r * deg, 360)} cm²`, rx, topY - 12);
            ctx.restore();
          }

          const lTxt = fmtPiTxt(2 * r * deg, 360);
          drawTapeMeasure(rect, [
            { label: '①호l', len: lTxt, weight: 0.46, color: '#2563EB', ptAt: (u) => ({ x: lx + Rsec * Math.cos(sA + u * (eA - sA)), y: cy + Rsec * Math.sin(sA + u * (eA - sA)) }) },
            { label: '②반지름r', len: `${r}`, weight: 0.27, color: '#E11D48', ptAt: (u) => ({ x: pB.x + u * (lx - pB.x), y: pB.y + u * (cy - pB.y) }) },
            { label: '③반지름r', len: `${r}`, weight: 0.27, color: '#E11D48', ptAt: (u) => ({ x: lx + u * (pA.x - lx), y: cy + u * (pA.y - cy) }) }
          ], `${lTxt} + ${2 * r} cm`);
        } else {
          // chordOx
          const bDeg = Math.round(deg / 2);
          const rad1 = (bDeg * Math.PI) / 180;
          const pO = { x: cx, y: cy };
          const pA = { x: cx + R * Math.cos(-rad1), y: cy + R * Math.sin(-rad1) };
          const pB = { x: cx + R, y: cy };
          const pC = { x: cx + R * Math.cos(rad1), y: cy + R * Math.sin(rad1) };

          ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI * 2);
          ctx.strokeStyle = '#CBD5E1'; ctx.setLineDash([4, 4]); ctx.stroke(); ctx.setLineDash([]);

          ctx.beginPath(); ctx.moveTo(cx, cy); ctx.arc(cx, cy, R, -rad1, 0); ctx.closePath();
          ctx.fillStyle = 'rgba(37, 99, 235, 0.16)'; ctx.fill(); ctx.strokeStyle = '#0F172A'; ctx.lineWidth = 2; ctx.stroke();

          ctx.beginPath(); ctx.moveTo(cx, cy); ctx.arc(cx, cy, R, -rad1 + t * rad1, t * rad1); ctx.closePath();
          ctx.fillStyle = 'rgba(16, 185, 129, 0.18)'; ctx.fill(); ctx.strokeStyle = '#0F172A'; ctx.lineWidth = 2; ctx.stroke();

          if (t > 0.2) {
            ctx.beginPath(); ctx.moveTo(pA.x, pA.y); ctx.lineTo(pB.x, pB.y); ctx.lineTo(pC.x, pC.y); ctx.closePath();
            ctx.fillStyle = `rgba(245, 158, 11, ${0.28 * t})`; ctx.fill();
          }

          ctx.beginPath(); ctx.moveTo(pA.x, pA.y); ctx.lineTo(pB.x, pB.y); ctx.lineTo(pC.x, pC.y);
          ctx.strokeStyle = '#2563EB'; ctx.lineWidth = 2.5; ctx.setLineDash([5, 4]); ctx.stroke(); ctx.setLineDash([]);
          drawTicks(pA, pB, 2, '#2563EB'); drawTicks(pB, pC, 2, '#2563EB');

          ctx.beginPath(); ctx.moveTo(pA.x, pA.y); ctx.lineTo(pC.x, pC.y);
          ctx.strokeStyle = '#E11D48'; ctx.lineWidth = 4; ctx.stroke();

          ctx.beginPath(); ctx.arc(cx, cy, R, -rad1, -rad1 + (1 + t) * rad1);
          ctx.strokeStyle = '#2563EB'; ctx.lineWidth = 4.5; ctx.stroke();

          drawPointLabel(pO, `O(${bDeg}°×2)`, { x: cx + R, y: cy }, 42);
          drawPointLabel(pA, 'A', pO, 18);
          drawPointLabel(pB, 'B', pO, 22);
          drawPointLabel(pC, 'C', pO, 18);
          state.handlePt = { x: pC.x, y: pC.y, center: pO };
          drawHandle(pC, '각도 드래그');
        }
      }

      // =======================================================================
      // [모드 2 렌더링]
      // =======================================================================
      else if (m === 2) {
        if (sub === 'leaf') {
          const x0 = cx - R / 2 - t * 38, y0 = cy - R / 2;
          ctx.strokeStyle = '#94A3B8'; ctx.lineWidth = 2; ctx.setLineDash([5, 4]);
          ctx.strokeRect(x0, y0, R, R); ctx.setLineDash([]);

          if (showArea) {
            ctx.beginPath();
            ctx.arc(x0, y0 + R, R, -Math.PI / 2, 0);
            ctx.arc(x0 + R, y0, R, Math.PI / 2, Math.PI);
            ctx.closePath();
            ctx.fillStyle = 'rgba(37, 99, 235, 0.22)';
            ctx.fill();
          }
          if (showPerim) {
            ctx.beginPath(); ctx.arc(x0, y0 + R, R, -Math.PI / 2, 0); ctx.strokeStyle = '#2563EB'; ctx.lineWidth = 4; ctx.stroke();
            ctx.beginPath(); ctx.arc(x0 + R, y0, R, Math.PI / 2, Math.PI); ctx.strokeStyle = '#E11D48'; ctx.lineWidth = 4; ctx.stroke();
          }
          if (showAux) {
            ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x0 + R, y0 + R);
            ctx.strokeStyle = '#0F172A'; ctx.lineWidth = 2; ctx.setLineDash([4, 4]); ctx.stroke(); ctx.setLineDash([]);
            drawRightAngle({ x: x0, y: y0 + R }, { x: x0, y: y0 }, { x: x0 + R, y: y0 + R }, 11);
          }

          const sqC = { x: x0 + R / 2, y: y0 + R / 2 };
          drawPointLabel({ x: x0, y: y0 }, 'A', sqC, 16);
          drawPointLabel({ x: x0, y: y0 + R }, 'B', sqC, 16);
          drawPointLabel({ x: x0 + R, y: y0 + R }, 'C', sqC, 16);
          drawPointLabel({ x: x0 + R, y: y0 }, 'D', sqC, 16);

          if (t > 0.1) {
            const bx = cx + R * 0.42;
            ctx.fillStyle = '#FFFFFF'; ctx.strokeStyle = '#CBD5E1'; ctx.lineWidth = 1.5;
            ctx.beginPath(); ctx.roundRect(bx, cy - 52, 195, 104, 10); ctx.fill(); ctx.stroke();
            ctx.fillStyle = '#0F172A'; ctx.font = '800 12px Pretendard, sans-serif'; ctx.textAlign = 'left';
            ctx.fillText(`🍃 반쪽 활꼴 × 2배`, bx + 12, cy - 28);
            ctx.fillStyle = '#2563EB';
            ctx.fillText(`• 사분원×2 = ${fmtPiTxt(r * r, 2)}`, bx + 12, cy - 4);
            ctx.fillStyle = '#E11D48';
            ctx.fillText(`• 정사각형 = -${r * r}`, bx + 12, cy + 18);
            ctx.fillStyle = '#059669';
            ctx.fillText(`⇒ 정답: ${fmtPiTxt(r * r, 2)} - ${r * r} cm²`, bx + 12, cy + 40);
          }

          const qTxt = fmtPiTxt(2 * r * 90, 360);
          drawTapeMeasure(rect, [
            { label: '①위쪽호', len: qTxt, weight: 0.5, color: '#2563EB', ptAt: (u) => ({ x: x0 + R * Math.cos(-Math.PI / 2 + u * (Math.PI / 2)), y: y0 + R + R * Math.sin(-Math.PI / 2 + u * (Math.PI / 2)) }) },
            { label: '②아래쪽호', len: qTxt, weight: 0.5, color: '#E11D48', ptAt: (u) => ({ x: x0 + R + R * Math.cos(Math.PI / 2 + u * (Math.PI / 2)), y: y0 + R * Math.sin(Math.PI / 2 + u * (Math.PI / 2)) }) }
          ], `${r}π cm`);
        } else if (sub === 'inOutSq') {
          ctx.fillStyle = 'rgba(148, 163, 184, 0.12)';
          ctx.fillRect(cx - R, cy - R, 2 * R, 2 * R);
          ctx.strokeStyle = '#64748B'; ctx.lineWidth = 2; ctx.setLineDash([5, 4]);
          ctx.strokeRect(cx - R, cy - R, 2 * R, 2 * R); ctx.setLineDash([]);

          ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI * 2);
          if (showArea) { ctx.fillStyle = 'rgba(37, 99, 235, 0.20)'; ctx.fill(); }
          ctx.strokeStyle = '#2563EB'; ctx.lineWidth = 3.5; ctx.stroke();

          const rot = (t * Math.PI) / 4;
          const pts = [0, 1, 2, 3].map((i) => {
            const a = -Math.PI / 2 + (i * Math.PI) / 2 + rot;
            return { x: cx + R * Math.cos(a), y: cy + R * Math.sin(a) };
          });

          ctx.beginPath(); ctx.moveTo(pts[0].x, pts[0].y);
          pts.slice(1).forEach((p) => ctx.lineTo(p.x, p.y));
          ctx.closePath();
          ctx.fillStyle = '#FFFFFF'; ctx.fill();
          ctx.strokeStyle = '#0F172A'; ctx.lineWidth = 3; ctx.stroke();

          if (showAux) {
            ctx.beginPath(); ctx.moveTo(pts[0].x, pts[0].y); ctx.lineTo(pts[2].x, pts[2].y);
            ctx.moveTo(pts[1].x, pts[1].y); ctx.lineTo(pts[3].x, pts[3].y);
            ctx.strokeStyle = '#E11D48'; ctx.lineWidth = 2.5; ctx.stroke();
            drawRightAngle({ x: cx, y: cy }, pts[0], pts[1], 12, '#E11D48');
          }
          ['A', 'B', 'C', 'D'].forEach((l, i) => drawPointLabel(pts[i], l, { x: cx, y: cy }, 18));
        } else if (sub === 'equalArea') {
          const x0 = cx - R * 0.6, y0 = cy + R * 0.45;
          const rw = (Math.PI / 4) * R;

          ctx.fillStyle = t > 0.5 ? 'rgba(225, 29, 72, 0.30)' : 'rgba(225, 29, 72, 0.16)';
          ctx.fillRect(x0, y0 - R, rw, R);
          ctx.strokeStyle = '#E11D48'; ctx.lineWidth = 2.5;
          ctx.strokeRect(x0, y0 - R, rw, R);

          ctx.beginPath(); ctx.moveTo(x0, y0); ctx.arc(x0, y0, R, -Math.PI / 2, 0); ctx.closePath();
          ctx.fillStyle = t > 0.5 ? 'rgba(37, 99, 235, 0.30)' : 'rgba(37, 99, 235, 0.16)';
          ctx.fill();
          ctx.strokeStyle = '#2563EB'; ctx.lineWidth = 2.5; ctx.stroke();

          drawRightAngle({ x: x0, y: y0 }, { x: x0, y: y0 - R }, { x: x0 + R, y: y0 }, 12);
          ctx.fillStyle = '#0F172A'; ctx.font = '800 13px Pretendard, sans-serif'; ctx.textAlign = 'center';
          ctx.fillText('공통 W', x0 + rw * 0.45, y0 - R * 0.35);
          ctx.fillStyle = '#1D4ED8'; ctx.fillText('S₁', x0 + rw * 0.35, y0 - R * 0.8);
          ctx.fillStyle = '#BE123C'; ctx.fillText('S₂', x0 + rw * 0.88, y0 - R * 0.18);
        } else {
          // lunule
          const a = r, b = (r * 4) / 3, c = Math.hypot(a, b);
          const cPx = R * 1.4, sc = cPx / c;
          const aPx = a * sc, bPx = b * sc;
          const yB = cy + 32;
          const pA = { x: cx - cPx / 2, y: yB }, pB = { x: cx + cPx / 2, y: yB };
          const pC = { x: pA.x + bPx * (b / c), y: pA.y - bPx * (a / c) };

          const mAC = { x: (pA.x + pC.x) / 2, y: (pA.y + pC.y) / 2 };
          const angAC = Math.atan2(pC.y - pA.y, pC.x - pA.x);
          ctx.beginPath(); ctx.arc(mAC.x, mAC.y, bPx / 2, angAC + Math.PI, angAC); ctx.closePath();
          ctx.fillStyle = 'rgba(37, 99, 235, 0.22)'; ctx.fill(); ctx.strokeStyle = '#0F172A'; ctx.lineWidth = 2; ctx.stroke();

          const mBC = { x: (pB.x + pC.x) / 2, y: (pB.y + pC.y) / 2 };
          const angCB = Math.atan2(pB.y - pC.y, pB.x - pC.x);
          ctx.beginPath(); ctx.arc(mBC.x, mBC.y, aPx / 2, angCB + Math.PI, angCB); ctx.closePath();
          ctx.fillStyle = 'rgba(37, 99, 235, 0.22)'; ctx.fill(); ctx.strokeStyle = '#0F172A'; ctx.lineWidth = 2; ctx.stroke();

          ctx.beginPath(); ctx.arc(cx, yB, cPx / 2, Math.PI, 0); ctx.closePath();
          ctx.fillStyle = t > 0.5 ? 'rgba(225, 29, 72, 0.14)' : '#F8FAFC';
          ctx.fill(); ctx.strokeStyle = '#E11D48'; ctx.lineWidth = 2; ctx.setLineDash([5, 4]); ctx.stroke(); ctx.setLineDash([]);

          ctx.beginPath(); ctx.moveTo(pA.x, pA.y); ctx.lineTo(pB.x, pB.y); ctx.lineTo(pC.x, pC.y); ctx.closePath();
          ctx.fillStyle = 'rgba(16, 185, 129, 0.24)'; ctx.fill(); ctx.strokeStyle = '#0F172A'; ctx.lineWidth = 2.5; ctx.stroke();

          drawRightAngle(pC, pA, pB, 12, '#059669');
          drawPointLabel(pA, 'A', { x: cx, y: cy }, 18);
          drawPointLabel(pB, 'B', { x: cx, y: cy }, 18);
          drawPointLabel(pC, 'C(90°)', { x: cx, y: yB }, 22);
        }
      }

      // =======================================================================
      // [모드 3 렌더링]
      // =======================================================================
      else if (m === 3) {
        const Rsm = R / 2;
        if (sub === 'bitten') {
          const pO = { x: cx, y: cy + 25 }, pA = { x: cx - R, y: cy + 25 }, pB = { x: cx + R, y: cy + 25 }, pM = { x: cx - Rsm, y: cy + 25 };

          if (showArea) {
            ctx.beginPath();
            ctx.arc(pO.x, pO.y, R, Math.PI, 0);
            ctx.lineTo(pO.x, pO.y);
            ctx.arc(pM.x, pM.y, Rsm, 0, Math.PI, true);
            ctx.closePath();
            ctx.fillStyle = 'rgba(37, 99, 235, 0.18)';
            ctx.fill();
          }

          ctx.beginPath(); ctx.moveTo(pA.x, pA.y); ctx.lineTo(pO.x, pO.y);
          ctx.strokeStyle = '#94A3B8'; ctx.setLineDash([4, 4]); ctx.stroke(); ctx.setLineDash([]);

          if (showPerim) {
            ctx.beginPath(); ctx.arc(pO.x, pO.y, R, Math.PI, 0); ctx.strokeStyle = '#2563EB'; ctx.lineWidth = 4.5; ctx.stroke();
            ctx.beginPath(); ctx.arc(pM.x, pM.y, Rsm, Math.PI, 0); ctx.strokeStyle = '#059669'; ctx.lineWidth = 4; ctx.stroke();
            ctx.beginPath(); ctx.moveTo(pO.x, pO.y); ctx.lineTo(pB.x, pB.y); ctx.strokeStyle = '#E11D48'; ctx.lineWidth = 4; ctx.stroke();
          }

          drawPointLabel(pA, 'A', pO, 18);
          drawPointLabel(pM, 'M', { x: pM.x, y: pM.y - 20 }, 16);
          drawPointLabel(pO, 'O', { x: pO.x, y: pO.y - 20 }, 16);
          drawPointLabel(pB, 'B', pO, 18);

          drawTapeMeasure(rect, [
            { label: '①큰호', len: `${r}π`, weight: 0.45, color: '#2563EB', ptAt: (u) => ({ x: pO.x + R * Math.cos(Math.PI + u * Math.PI), y: pO.y + R * Math.sin(Math.PI + u * Math.PI) }) },
            { label: '③직선OB', len: `${r}`, weight: 0.25, color: '#E11D48', ptAt: (u) => ({ x: pB.x + u * (pO.x - pB.x), y: pO.y }) },
            { label: '②작은호', len: fmtPiTxt(r, 2), weight: 0.30, color: '#059669', ptAt: (u) => ({ x: pM.x + Rsm * Math.cos(-u * Math.PI), y: pM.y + Rsm * Math.sin(-u * Math.PI) }) }
          ], `${fmtPiTxt(r + r / 2, 1)} + ${r} cm`);
        } else if (sub === 'yin') {
          if (showArea) {
            ctx.beginPath();
            ctx.arc(cx, cy, R, Math.PI, 0);
            ctx.lineTo(cx, cy);
            ctx.arc(cx - Rsm, cy, Rsm, 0, Math.PI, true);
            ctx.closePath();
            ctx.fillStyle = 'rgba(37, 99, 235, 0.18)';
            ctx.fill();

            const px = (1 - t) * (cx + Rsm) + t * (cx - Rsm);
            const sA = (1 - t) * 0 + t * Math.PI;
            const eA = (1 - t) * Math.PI + t * Math.PI * 2;
            ctx.beginPath(); ctx.arc(px, cy, Rsm, sA, eA); ctx.closePath();
            ctx.fillStyle = 'rgba(16, 185, 129, 0.28)';
            ctx.fill();
          }
          if (showPerim) {
            ctx.beginPath(); ctx.arc(cx, cy, R, Math.PI, 0); ctx.strokeStyle = '#2563EB'; ctx.lineWidth = 4.5; ctx.stroke();
            ctx.beginPath(); ctx.arc(cx - Rsm, cy, Rsm, Math.PI, 0); ctx.strokeStyle = '#059669'; ctx.lineWidth = 4; ctx.stroke();
            ctx.beginPath(); ctx.arc(cx + Rsm, cy, Rsm, 0, Math.PI); ctx.strokeStyle = '#E11D48'; ctx.lineWidth = 4; ctx.stroke();
          }
          drawPointLabel({ x: cx - R, y: cy }, 'A', { x: cx, y: cy }, 18);
          drawPointLabel({ x: cx, y: cy }, 'O', { x: cx, y: cy + 25 }, 16);
          drawPointLabel({ x: cx + R, y: cy }, 'B', { x: cx, y: cy }, 18);

          drawTapeMeasure(rect, [
            { label: '①큰호', len: `${r}π`, weight: 0.5, color: '#2563EB', ptAt: (u) => ({ x: cx + R * Math.cos(Math.PI + u * Math.PI), y: cy + R * Math.sin(Math.PI + u * Math.PI) }) },
            { label: '②오른작은호', len: `${r / 2}π`, weight: 0.25, color: '#E11D48', ptAt: (u) => ({ x: cx + Rsm + Rsm * Math.cos(u * Math.PI), y: cy + Rsm * Math.sin(u * Math.PI) }) },
            { label: '③왼작은호', len: `${r / 2}π`, weight: 0.25, color: '#059669', ptAt: (u) => ({ x: cx - Rsm + Rsm * Math.cos(-u * Math.PI), y: cy + Rsm * Math.sin(-u * Math.PI) }) }
          ], `${2 * r}π cm`);
        } else if (sub === 'babyCircle') {
          const baseCx = cx - t * R * 0.45;
          const holeX = baseCx + Rsm;
          const sepX = holeX + t * R * 1.3;

          if (showArea) {
            ctx.beginPath();
            ctx.arc(baseCx, cy, R, 0, Math.PI * 2);
            ctx.arc(holeX, cy, Rsm, 0, Math.PI * 2, true);
            ctx.fillStyle = 'rgba(37, 99, 235, 0.18)';
            ctx.fill('evenodd');
          }
          if (t > 0.03) {
            ctx.beginPath(); ctx.arc(sepX, cy, Rsm, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(225, 29, 72, 0.16)'; ctx.fill();
            ctx.strokeStyle = '#E11D48'; ctx.setLineDash([4, 4]); ctx.lineWidth = 2.5; ctx.stroke(); ctx.setLineDash([]);
          }
          if (showPerim) {
            ctx.beginPath(); ctx.arc(baseCx, cy, R, 0, Math.PI * 2); ctx.strokeStyle = '#2563EB'; ctx.lineWidth = 4.5; ctx.stroke();
            ctx.beginPath(); ctx.arc(holeX, cy, Rsm, 0, Math.PI * 2); ctx.strokeStyle = '#E11D48'; ctx.lineWidth = 4; ctx.stroke();
          }
          if (showAux) {
            ctx.beginPath(); ctx.moveTo(baseCx, cy); ctx.lineTo(baseCx + R, cy);
            ctx.strokeStyle = '#0F172A'; ctx.lineWidth = 2.5; ctx.stroke();
            drawTicks({ x: baseCx, y: cy }, { x: holeX, y: cy }, 1, '#0F172A');
            drawTicks({ x: holeX, y: cy }, { x: baseCx + R, y: cy }, 1, '#0F172A');
          }
          drawPointLabel({ x: baseCx, y: cy }, `O(R=${r})`, { x: baseCx - 30, y: cy + 25 }, 20);
          drawPointLabel({ x: holeX, y: cy }, `O'(r=${r / 2})`, { x: holeX, y: cy + 25 }, 20, '#E11D48');

          drawTapeMeasure(rect, [
            { label: '①큰원둘레', len: `${2 * r}π`, weight: 0.67, color: '#2563EB', ptAt: (u) => ({ x: baseCx + R * Math.cos(u * Math.PI * 2), y: cy + R * Math.sin(u * Math.PI * 2) }) },
            { label: '②작은원둘레', len: `${r}π`, weight: 0.33, color: '#E11D48', ptAt: (u) => ({ x: holeX + Rsm * Math.cos(u * Math.PI * 2), y: cy + Rsm * Math.sin(u * Math.PI * 2) }) }
          ], `${3 * r}π cm`);
        } else {
          // track (운동장 트랙 합체)
          const halfW = R * (1 - t * 0.78);
          const pA = { x: cx - halfW, y: cy - R }, pD = { x: cx - halfW, y: cy + R };
          const pB = { x: cx + halfW, y: cy - R }, pC = { x: cx + halfW, y: cy + R };

          if (showArea) {
            ctx.fillStyle = 'rgba(16, 185, 129, 0.18)';
            ctx.fillRect(cx - halfW, cy - R, halfW * 2, R * 2);

            ctx.beginPath(); ctx.arc(cx - halfW, cy, R, Math.PI / 2, (Math.PI * 3) / 2); ctx.closePath();
            ctx.fillStyle = 'rgba(37, 99, 235, 0.22)'; ctx.fill();

            ctx.beginPath(); ctx.arc(cx + halfW, cy, R, -Math.PI / 2, Math.PI / 2); ctx.closePath();
            ctx.fillStyle = 'rgba(37, 99, 235, 0.22)'; ctx.fill();
          }

          ctx.beginPath(); ctx.moveTo(pA.x, pA.y); ctx.lineTo(pD.x, pD.y); ctx.moveTo(pB.x, pB.y); ctx.lineTo(pC.x, pC.y);
          ctx.strokeStyle = '#94A3B8'; ctx.lineWidth = 2; ctx.setLineDash([4, 4]); ctx.stroke(); ctx.setLineDash([]);
          drawRightAngle(pD, pA, pC, 11);

          if (showPerim) {
            ctx.beginPath(); ctx.arc(cx - halfW, cy, R, Math.PI / 2, (Math.PI * 3) / 2); ctx.strokeStyle = '#2563EB'; ctx.lineWidth = 4.5; ctx.stroke();
            ctx.beginPath(); ctx.arc(cx + halfW, cy, R, -Math.PI / 2, Math.PI / 2); ctx.strokeStyle = '#2563EB'; ctx.lineWidth = 4.5; ctx.stroke();
            ctx.beginPath(); ctx.moveTo(pA.x, pA.y); ctx.lineTo(pB.x, pB.y); ctx.moveTo(pD.x, pD.y); ctx.lineTo(pC.x, pC.y);
            ctx.strokeStyle = '#E11D48'; ctx.lineWidth = 4; ctx.stroke();
          }
          drawPointLabel(pA, 'A', { x: cx, y: cy }, 16);
          drawPointLabel(pB, 'B', { x: cx, y: cy }, 16);
          drawPointLabel(pC, 'C', { x: cx, y: cy }, 16);
          drawPointLabel(pD, 'D', { x: cx, y: cy }, 16);

          drawTapeMeasure(rect, [
            { label: '①+②반원호2개', len: `${2 * r}π`, weight: 0.55, color: '#2563EB', ptAt: (u) => ({ x: cx + halfW + R * Math.cos(-Math.PI / 2 + u * Math.PI), y: cy + R * Math.sin(-Math.PI / 2 + u * Math.PI) }) },
            { label: '③+④위아래직선', len: `${4 * r}`, weight: 0.45, color: '#E11D48', ptAt: (u) => ({ x: pA.x + u * (pB.x - pA.x), y: pA.y }) }
          ], `${2 * r}π + ${4 * r} cm`);
        }
      }

      // =======================================================================
      // [모드 4 렌더링: 보조선·굴리기·목줄]
      // =======================================================================
      else if (m === 4) {
        if (sub === 'isoRadius') {
          const thetaDeg = Math.min(38, Math.max(15, Math.round(deg / 5)));
          const th = (thetaDeg * Math.PI) / 180;
          const pO = { x: cx + 15, y: cy + 25 };
          const pB = { x: pO.x - R, y: pO.y }, pD = { x: pO.x + R, y: pO.y };
          const pC = { x: pO.x - R * Math.cos(th), y: pO.y - R * Math.sin(th) };
          const pA = { x: pO.x + R * Math.cos(3 * th), y: pO.y - R * Math.sin(3 * th) };
          const pP = { x: pO.x - 2 * R * Math.cos(th), y: pO.y };

          ctx.beginPath(); ctx.arc(pO.x, pO.y, R, Math.PI, 0);
          ctx.strokeStyle = '#94A3B8'; ctx.lineWidth = 2; ctx.stroke();

          ctx.beginPath(); ctx.moveTo(pP.x - 15, pP.y); ctx.lineTo(pD.x + 15, pD.y);
          ctx.moveTo(pP.x, pP.y); ctx.lineTo(pA.x, pA.y);
          ctx.strokeStyle = '#0F172A'; ctx.lineWidth = 2.5; ctx.stroke();

          ctx.beginPath(); ctx.arc(pO.x, pO.y, R, Math.PI, Math.PI - th, true);
          ctx.strokeStyle = '#2563EB'; ctx.lineWidth = 5; ctx.stroke();

          ctx.beginPath(); ctx.arc(pO.x, pO.y, R, -3 * th, 0);
          ctx.strokeStyle = '#E11D48'; ctx.lineWidth = 5; ctx.stroke();

          if (showAux || t > 0.05) {
            ctx.beginPath(); ctx.moveTo(pO.x, pO.y); ctx.lineTo(pC.x, pC.y); ctx.moveTo(pO.x, pO.y); ctx.lineTo(pA.x, pA.y);
            ctx.strokeStyle = '#059669'; ctx.lineWidth = 3; ctx.setLineDash([5, 4]); ctx.stroke(); ctx.setLineDash([]);
            drawTicks(pP, pC, 1, '#059669'); drawTicks(pO, pC, 1, '#059669'); drawTicks(pO, pA, 1, '#059669');
          }

          ctx.font = '800 12px Pretendard, monospace';
          ctx.fillStyle = '#2563EB'; ctx.fillText(`θ=${thetaDeg}°`, pP.x + 42, pP.y - 10);
          ctx.fillStyle = '#059669'; ctx.fillText(`2θ=${2 * thetaDeg}°`, pC.x + 28, pC.y + 20);
          ctx.fillStyle = '#E11D48'; ctx.fillText(`외각 3θ=${3 * thetaDeg}° (3배!)`, pO.x + 70, pO.y - 16);

          drawPointLabel(pP, 'P', pO, 18); drawPointLabel(pB, 'B', { x: pB.x, y: pB.y - 25 }, 16);
          drawPointLabel(pO, 'O', { x: pO.x, y: pO.y - 25 }, 16); drawPointLabel(pD, 'D', pO, 18);
          drawPointLabel(pC, 'C', pO, 18); drawPointLabel(pA, 'A', pO, 18);
        } else if (sub === 'rectInQuad') {
          const Rq = R * 1.25;
          const pO = { x: cx - Rq * 0.45, y: cy + Rq * 0.45 };
          const pE = { x: pO.x, y: pO.y - Rq }, pF = { x: pO.x + Rq, y: pO.y };
          const angB = -0.64;
          const pB = { x: pO.x + Rq * Math.cos(angB), y: pO.y + Rq * Math.sin(angB) };
          const pA = { x: pB.x, y: pO.y }, pC = { x: pO.x, y: pB.y };

          ctx.beginPath(); ctx.moveTo(pO.x, pO.y); ctx.arc(pO.x, pO.y, Rq, -Math.PI / 2, 0); ctx.closePath();
          if (showArea) { ctx.fillStyle = 'rgba(37, 99, 235, 0.16)'; ctx.fill(); }
          ctx.strokeStyle = '#2563EB'; ctx.lineWidth = 4; ctx.stroke();

          ctx.fillStyle = 'rgba(16, 185, 129, 0.18)';
          ctx.fillRect(pO.x, pC.y, pA.x - pO.x, pO.y - pC.y);
          ctx.strokeStyle = '#0F172A'; ctx.lineWidth = 2.5;
          ctx.strokeRect(pO.x, pC.y, pA.x - pO.x, pO.y - pC.y);
          drawRightAngle(pO, pC, pA, 11);

          ctx.beginPath(); ctx.moveTo(pA.x, pA.y); ctx.lineTo(pC.x, pC.y);
          ctx.strokeStyle = '#2563EB'; ctx.lineWidth = 4; ctx.stroke();
          drawTicks(pA, pC, 2, '#2563EB');

          if (showAux || t > 0.05) {
            ctx.beginPath(); ctx.moveTo(pO.x, pO.y); ctx.lineTo(pB.x, pB.y);
            ctx.strokeStyle = '#E11D48'; ctx.lineWidth = 4.5; ctx.setLineDash([6, 4]); ctx.stroke(); ctx.setLineDash([]);
            drawTicks(pO, pB, 2, '#E11D48');
            ctx.fillStyle = '#BE123C'; ctx.font = '800 12.5px Pretendard, sans-serif';
            ctx.fillText(`🎯 반지름 OB = 대각선 AC = ${r}cm!`, pB.x + 12, pB.y);
          }

          drawPointLabel(pO, 'O', { x: pO.x + 25, y: pO.y - 25 }, 18);
          drawPointLabel(pA, 'A', pO, 16); drawPointLabel(pB, 'B', pO, 18, '#E11D48');
          drawPointLabel(pC, 'C', pO, 16); drawPointLabel(pE, 'E', pO, 16); drawPointLabel(pF, 'F', pO, 16);
        } else if (sub === 'rolling') {
          const n = [3, 4, 5, 6][Math.min(3, Math.max(0, Math.round((deg - 60) / 40)))];
          const baseCx = rect.width * (state.cornerGather ? 0.35 : 0.48) + state.offsetX;
          const polyR = Math.min(rect.width, rect.height) * 0.15 * state.scale;
          const coinR = Math.max(24, Math.min(44, r * 4.8 * state.scale));
          const sweepR = coinR * 2;
          const extAng = (Math.PI * 2) / n;

          const verts = [];
          for (let i = 0; i < n; i++) {
            const a = -Math.PI / 2 + (i * Math.PI * 2) / n;
            verts.push({ x: baseCx + polyR * Math.cos(a), y: cy + polyR * Math.sin(a) });
          }

          for (let i = 0; i < n; i++) {
            const v1 = verts[i], v2 = verts[(i + 1) % n];
            const dx = v2.x - v1.x, dy = v2.y - v1.y, len = Math.hypot(dx, dy);
            const nx = dy / len, ny = -dx / len, normA = Math.atan2(ny, nx);

            ctx.beginPath(); ctx.moveTo(v1.x, v1.y); ctx.lineTo(v2.x, v2.y);
            ctx.lineTo(v2.x + nx * sweepR, v2.y + ny * sweepR); ctx.lineTo(v1.x + nx * sweepR, v1.y + ny * sweepR); ctx.closePath();
            ctx.fillStyle = 'rgba(37, 99, 235, 0.16)'; ctx.fill(); ctx.strokeStyle = '#2563EB'; ctx.lineWidth = 1.5; ctx.stroke();

            ctx.beginPath(); ctx.moveTo(v1.x + nx * coinR, v1.y + ny * coinR); ctx.lineTo(v2.x + nx * coinR, v2.y + ny * coinR);
            ctx.strokeStyle = '#0F172A'; ctx.lineWidth = 3; ctx.stroke();

            ctx.beginPath(); ctx.moveTo(v2.x, v2.y); ctx.arc(v2.x, v2.y, sweepR, normA, normA + extAng); ctx.closePath();
            ctx.fillStyle = 'rgba(225, 29, 72, 0.18)'; ctx.fill(); ctx.strokeStyle = '#E11D48'; ctx.lineWidth = 1.8; ctx.stroke();

            ctx.beginPath(); ctx.arc(v2.x, v2.y, coinR, normA, normA + extAng);
            ctx.strokeStyle = '#2563EB'; ctx.lineWidth = 3.5; ctx.stroke();

            if (state.cornerGather) {
              const gx = rect.width * 0.76 + state.offsetX;
              ctx.beginPath(); ctx.moveTo(gx, cy); ctx.arc(gx, cy, sweepR * 0.85, normA, normA + extAng); ctx.closePath();
              ctx.fillStyle = 'rgba(225, 29, 72, 0.24)'; ctx.fill(); ctx.strokeStyle = '#E11D48'; ctx.lineWidth = 2; ctx.stroke();
              ctx.beginPath(); ctx.arc(gx, cy, coinR * 0.85, normA, normA + extAng);
              ctx.strokeStyle = '#2563EB'; ctx.lineWidth = 3.5; ctx.stroke();
            }
          }

          if (state.cornerGather) {
            const gx = rect.width * 0.76 + state.offsetX;
            ctx.fillStyle = '#0F172A'; ctx.font = '800 12px Pretendard, sans-serif'; ctx.textAlign = 'center';
            ctx.fillText(`🧲 모퉁이 ${n}개 합 = 360° 원 1개!`, gx, cy - sweepR - 12);
          }

          ctx.beginPath(); ctx.moveTo(verts[0].x, verts[0].y);
          verts.slice(1).forEach((v) => ctx.lineTo(v.x, v.y));
          ctx.closePath(); ctx.fillStyle = '#FFFFFF'; ctx.fill(); ctx.strokeStyle = '#0F172A'; ctx.lineWidth = 3; ctx.stroke();

          const sIdx = Math.min(n - 1, Math.floor(t * n)), locT = t * n - sIdx;
          const v1 = verts[sIdx], v2 = verts[(sIdx + 1) % n];
          const dx = v2.x - v1.x, dy = v2.y - v1.y, len = Math.hypot(dx, dy);
          const nx = dy / len, ny = -dx / len, normA = Math.atan2(ny, nx);
          const cPt = locT < 0.65
            ? { x: v1.x + (locT / 0.65) * dx + nx * coinR, y: v1.y + (locT / 0.65) * dy + ny * coinR }
            : { x: v2.x + coinR * Math.cos(normA + ((locT - 0.65) / 0.35) * extAng), y: v2.y + coinR * Math.sin(normA + ((locT - 0.65) / 0.35) * extAng) };

          ctx.beginPath(); ctx.arc(cPt.x, cPt.y, coinR, 0, Math.PI * 2);
          ctx.fillStyle = 'rgba(16, 185, 129, 0.32)'; ctx.fill(); ctx.strokeStyle = '#059669'; ctx.lineWidth = 2.5; ctx.stroke();
        } else {
          // dogRotate (울타리에 걸려 꺾이는 강아지 목줄)
          const L = r, side = Math.max(1, Math.round(r * 0.5)), rem = Math.max(0, L - side);
          const pxM = Math.min(rect.width, rect.height) * 0.034 * state.scale;
          const LPx = L * pxM, sidePx = side * pxM, remPx = rem * pxM;
          const ox = cx, oy = cy - 16;
          const pO = { x: ox, y: oy }, pA = { x: ox - sidePx, y: oy }, pB = { x: ox, y: oy + sidePx };

          ctx.beginPath(); ctx.moveTo(ox, oy); ctx.arc(ox, oy, LPx, -Math.PI, Math.PI / 2); ctx.closePath();
          ctx.fillStyle = 'rgba(37, 99, 235, 0.18)'; ctx.fill(); ctx.strokeStyle = '#2563EB'; ctx.lineWidth = 2.5; ctx.stroke();

          if (remPx > 1) {
            ctx.beginPath(); ctx.moveTo(pA.x, pA.y); ctx.arc(pA.x, pA.y, remPx, Math.PI / 2, Math.PI); ctx.closePath();
            ctx.fillStyle = 'rgba(225, 29, 72, 0.22)'; ctx.fill(); ctx.strokeStyle = '#E11D48'; ctx.lineWidth = 3; ctx.stroke();

            ctx.beginPath(); ctx.moveTo(pB.x, pB.y); ctx.arc(pB.x, pB.y, remPx, Math.PI / 2, Math.PI); ctx.closePath();
            ctx.fillStyle = 'rgba(225, 29, 72, 0.22)'; ctx.fill(); ctx.strokeStyle = '#E11D48'; ctx.lineWidth = 3; ctx.stroke();
          }

          ctx.fillStyle = '#FFFFFF'; ctx.fillRect(ox - sidePx, oy, sidePx, sidePx);
          ctx.strokeStyle = '#0F172A'; ctx.lineWidth = 3; ctx.strokeRect(ox - sidePx, oy, sidePx, sidePx);
          drawRightAngle(pA, pO, { x: pA.x, y: pA.y + sidePx }, 10);

          let dogPt;
          if (t <= 0.65) {
            const a = -Math.PI + (t / 0.65) * (Math.PI * 1.5);
            dogPt = { x: ox + LPx * Math.cos(a), y: oy + LPx * Math.sin(a) };
          } else {
            const u = (t - 0.65) / 0.35;
            const a = Math.PI / 2 + u * (Math.PI / 2);
            dogPt = { x: pB.x + remPx * Math.cos(a), y: pB.y + remPx * Math.sin(a) };
          }

          ctx.beginPath(); ctx.moveTo(pO.x, pO.y);
          if (t > 0.65) ctx.lineTo(pB.x, pB.y);
          ctx.lineTo(dogPt.x, dogPt.y);
          ctx.strokeStyle = '#E11D48'; ctx.lineWidth = 3.5; ctx.stroke();

          ctx.beginPath(); ctx.arc(dogPt.x, dogPt.y, 9, 0, Math.PI * 2);
          ctx.fillStyle = '#0F172A'; ctx.fill();
          ctx.font = '12px sans-serif'; ctx.textAlign = 'center'; ctx.fillText('🐕', dogPt.x, dogPt.y + 4);

          drawPointLabel(pO, 'O(묶인점)', { x: ox + 25, y: oy - 25 }, 20);
          drawPointLabel(pA, 'A(모퉁이)', { x: pA.x - 20, y: pA.y - 20 }, 18, '#E11D48');
          drawPointLabel(pB, 'B(모퉁이)', { x: pB.x + 25, y: pB.y + 20 }, 18, '#E11D48');
        }
      }

      ctx.restore();
      updateUI();
    }

    // -------------------------------------------------------------------------
    // 5. 버튼 UI 동기화 & 이벤트 컨트롤러
    // -------------------------------------------------------------------------
    function renderSubBar() {
      const m = state.mode;
      const bar = document.getElementById('subSelectorBar');
      bar.innerHTML = SUB_MENUS[m]
        .map(
          (it) =>
            `<button onclick="setSub(${m}, '${it.id}')" class="sub-pill ${
              state.sub[m] === it.id ? 'active' : 'bg-slate-50 text-slate-700 hover:bg-slate-100'
            } px-2.5 py-1 rounded-lg border border-slate-200 text-[11px] transition">${it.label}</button>`
        )
        .join('');

      const btnGather = document.getElementById('btnCornerGather');
      if (m === 4 && state.sub[4] === 'rolling') {
        btnGather.classList.remove('hidden');
        btnGather.classList.add('flex');
      } else {
        btnGather.classList.add('hidden');
        btnGather.classList.remove('flex');
      }
    }

    function renderPresetButtons() {
      const rVals = [4, 6, 8, 10];
      document.getElementById('rBtnGroup').innerHTML = rVals
        .map(
          (v) =>
            `<button onclick="setR(${v})" class="preset-chip ${
              state.r === v ? 'active' : 'bg-white text-slate-700 hover:bg-slate-100'
            } py-1 rounded border border-slate-200 text-[11px] transition">${v}</button>`
        )
        .join('');

      const isPoly = state.mode === 4 && state.sub[4] === 'rolling';
      const degVals = isPoly ? [60, 100, 140, 180] : [60, 90, 120, 180];
      const degLabels = isPoly ? ['3각', '4각', '5각', '6각'] : ['60°', '90°', '120°', '180°'];

      document.getElementById('degBtnGroup').innerHTML = degVals
        .map(
          (v, i) =>
            `<button onclick="setDeg(${v})" class="preset-chip ${
              state.deg === v ? 'active' : 'bg-white text-slate-700 hover:bg-slate-100'
            } py-1 rounded border border-slate-200 text-[11px] transition">${degLabels[i]}</button>`
        )
        .join('');
    }

    function updateUI() {
      const spec = getSpec();
      if (!spec.badge) return;

      document.getElementById('examBadge').textContent = spec.badge;
      document.getElementById('txtAction').textContent = spec.actionTxt || '🎬 분해·합체 실행';
      document.getElementById('visualEqBadge').innerHTML = spec.eqHTML;
      document.getElementById('examQuestion').innerHTML = spec.q;
      document.getElementById('answerSummary').innerHTML = spec.ans;

      document.getElementById('quizBox').innerHTML = spec.opts
        .map((o, idx) => {
          let cls = 'border-slate-200 bg-slate-50 text-slate-700 hover:bg-slate-100';
          if (state.selectedQuiz === idx) {
            cls = o.ok
              ? 'border-blue-600 bg-blue-50 text-blue-800 font-extrabold shadow-sm'
              : 'border-rose-500 bg-rose-50 text-rose-700 font-bold';
          }
          return `<button onclick="checkQuiz(${idx})" class="px-2 py-1.5 rounded-lg border text-[11px] transition leading-tight ${cls}">${o.t}</button>`;
        })
        .join('');

      for (let i = 0; i < 4; i++) {
        document.getElementById(`statL${i + 1}`).textContent = spec.stats[i][0];
        document.getElementById(`statV${i + 1}`).textContent = spec.stats[i][1];
      }

      document.getElementById('stdText').innerHTML = spec.std;
      document.getElementById('fastText').innerHTML = spec.fast;

      document.getElementById('sliderAnim').value = state.animProg;
      document.getElementById('valAnim').textContent = `${Math.round(state.animProg * 100)}%`;
      document.getElementById('valR').textContent = `${state.r} cm`;

      const isPoly = state.mode === 4 && state.sub[4] === 'rolling';
      if (isPoly) {
        const n = [3, 4, 5, 6][Math.min(3, Math.max(0, Math.round((state.deg - 60) / 40)))];
        document.getElementById('valDeg').textContent = `${n}각형/개`;
      } else {
        document.getElementById('valDeg').textContent = `${state.deg}°`;
      }

      renderPresetButtons();
    }

    function checkQuiz(idx) {
      state.selectedQuiz = idx;
      const spec = getSpec();
      const chosen = spec.opts[idx];
      const fb = document.getElementById('quizFeedback');
      fb.textContent = chosen.msg;
      fb.className = chosen.ok ? 'text-[11px] font-extrabold text-blue-700 mb-1' : 'text-[11px] font-bold text-rose-600 mb-1';
      if (chosen.ok) state.animTarget = 1.0;
      updateUI();
    }

    function setMode(m) {
      state.mode = m;
      state.selectedQuiz = null;
      state.antActive = false;
      state.cornerGather = false;
      state.animProg = 0.0;
      document.getElementById('quizFeedback').textContent = '';
      for (let i = 1; i <= 4; i++) {
        document.getElementById(`tab-${i}`).classList.toggle('active', i === m);
      }
      renderSubBar();
      render();
    }

    function setSub(m, id) {
      state.sub[m] = id;
      state.selectedQuiz = null;
      state.antActive = false;
      state.cornerGather = false;
      state.animProg = 0.0;
      document.getElementById('quizFeedback').textContent = '';
      renderSubBar();
      render();
    }

    function setLens(l) {
      state.lens = l;
      ['all', 'area', 'perim', 'aux'].forEach((id) => {
        document.getElementById(`lens-${id}`).classList.toggle('active', id === l);
      });
      if (l === 'perim') startAntWalk();
      else if (l === 'aux') state.animTarget = 1.0;
      render();
    }

    function setR(val) {
      state.r = val;
      render();
    }

    function setDeg(val) {
      state.deg = val;
      render();
    }

    function setAnimVal(val) {
      state.animTarget = val;
    }

    function triggerAnim() {
      if (state.mode === 3 && state.sub[3] === 'bitten') {
        startAntWalk();
        return;
      }
      state.animTarget = state.animProg > 0.5 ? 0.0 : 1.0;
    }

    function startAntWalk() {
      state.antActive = true;
      state.antProg = 0.0;
      state.steps[2] = true;
      document.getElementById('stepBtn2').classList.add('active');
    }

    function toggleCornerGather() {
      state.cornerGather = !state.cornerGather;
      render();
    }

    function snapToProblem() {
      unlockAllSteps();
      state.r = 6;
      state.deg = 120;
      state.animTarget = 1.0;
      render();
    }

    function onAnimSlider() {
      state.animTarget = null;
      state.animProg = parseFloat(document.getElementById('sliderAnim').value);
      render();
    }

    function toggleStep(s) {
      state.steps[s] = !state.steps[s];
      document.getElementById(`stepBtn${s}`).classList.toggle('active', state.steps[s]);
      render();
    }

    function unlockAllSteps() {
      [1, 2, 3].forEach((s) => {
        state.steps[s] = true;
        document.getElementById(`stepBtn${s}`).classList.add('active');
      });
      render();
    }

    function toggleAcc(id) {
      const body = document.getElementById(`accBody-${id}`);
      const icon = document.getElementById(`accIcon-${id}`);
      const isHidden = body.classList.contains('hidden');
      body.classList.toggle('hidden', !isHidden);
      icon.className = isHidden
        ? icon.className.replace('fa-chevron-down', 'fa-chevron-up')
        : icon.className.replace('fa-chevron-up', 'fa-chevron-down');
    }

    function zoomCanvas(f) {
      state.scale = Math.max(0.65, Math.min(1.6, state.scale * f));
      render();
    }

    function resetView() {
      state.scale = 1.0;
      state.offsetX = 0;
      state.offsetY = 0;
      state.animProg = 0.0;
      state.antActive = false;
      state.cornerGather = false;
      setLens('all');
      render();
    }

    function animateLoop() {
      let dirty = false;
      if (state.animTarget !== null) {
        const diff = state.animTarget - state.animProg;
        if (Math.abs(diff) < 0.008) {
          state.animProg = state.animTarget;
          state.animTarget = null;
        } else {
          state.animProg += diff * 0.08;
        }
        dirty = true;
      }
      if (state.antActive) {
        state.antProg += 0.006;
        if (state.antProg >= 1.0) {
          state.antProg = 1.0;
          state.antActive = false;
        }
        dirty = true;
      }
      if (dirty) render();
      requestAnimationFrame(animateLoop);
    }

    // -------------------------------------------------------------------------
    // 6. 캔버스 핸들 드래그 & 원클릭 인터랙션
    // -------------------------------------------------------------------------
    function getPos(e) {
      const rect = canvas.getBoundingClientRect();
      if (e.touches && e.touches.length > 0) {
        return { x: e.touches[0].clientX - rect.left, y: e.touches[0].clientY - rect.top };
      }
      return { x: e.clientX - rect.left, y: e.clientY - rect.top };
    }

    function onDown(e) {
      const pos = getPos(e);
      if (state.handlePt && Math.hypot(pos.x - state.handlePt.x, pos.y - state.handlePt.y) <= 32) {
        state.isDragging = true;
        return;
      }
      triggerAnim();
    }

    function onMove(e) {
      const pos = getPos(e);
      if (!state.isDragging || !state.handlePt) {
        if (state.handlePt) {
          canvas.style.cursor = Math.hypot(pos.x - state.handlePt.x, pos.y - state.handlePt.y) <= 32 ? 'grab' : 'pointer';
        }
        return;
      }
      canvas.style.cursor = 'grabbing';
      const c = state.handlePt.center;
      const angRad = Math.atan2(pos.y - c.y, pos.x - c.x);
      let deg = Math.round((Math.abs((angRad * 180) / Math.PI) * 2) / 15) * 15;
      state.deg = Math.max(30, Math.min(300, deg));
      render();
    }

    function onUp() {
      state.isDragging = false;
      canvas.style.cursor = 'pointer';
    }

    canvas.addEventListener('mousedown', onDown);
    window.addEventListener('mousemove', onMove);
    window.addEventListener('mouseup', onUp);
    canvas.addEventListener('touchstart', onDown, { passive: true });
    window.addEventListener('touchmove', onMove, { passive: true });
    window.addEventListener('touchend', onUp);

    window.addEventListener('DOMContentLoaded', () => {
      if (new URLSearchParams(location.search).get('start') === 'basic') state.sub[1] = 'anatomy';
      setMode(1);
      resizeCanvas();
      requestAnimationFrame(animateLoop);
    });
  </script>
</body>
</html>
