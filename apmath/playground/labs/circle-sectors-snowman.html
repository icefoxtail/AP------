<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AP Math Playground · 지름 위 작은 원들의 둘레 합 보존</title>
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style>
    :root {
      --bg: #09090D;
      --surface: #120E18;
      --card: #181220;
      --accent-gold: #D8B77E;
      --accent-emerald: #55CBA3;
      --accent-amethyst: #A78AC8;
      --text: #F5F0E9;
      --text-sub: #BDB8C2;
      --border: rgba(216, 183, 126, 0.18);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Pretendard', sans-serif;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    header {
      height: 60px;
      padding: 0 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      background: rgba(18, 14, 24, 0.9);
      backdrop-filter: blur(12px);
    }
    .header-left { display: flex; align-items: center; gap: 14px; }
    .btn-back {
      padding: 6px 14px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--accent-gold);
      font-size: 13px;
      font-weight: 750;
      text-decoration: none;
      transition: all 0.2s;
    }
    .btn-back:hover { border-color: var(--accent-emerald); color: var(--text); }
    .lab-title { font-size: 16px; font-weight: 850; }
    .lab-meta { font-size: 11px; color: var(--accent-emerald); margin-left: 6px; }
    .layout {
      flex: 1;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 340px;
      overflow: hidden;
    }
    #canvasView {
      width: 100%;
      height: 100%;
      display: block;
      background: radial-gradient(circle at center, #1b1322 0%, #09090D 80%);
    }
    aside {
      background: var(--surface);
      border-left: 1px solid var(--border);
      padding: 22px 20px;
      display: flex;
      flex-direction: column;
      gap: 18px;
      overflow-y: auto;
    }
    .control-block {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
    }
    .control-block label {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      font-weight: 800;
      color: var(--text);
      margin-bottom: 8px;
    }
    .val-chip { color: var(--accent-gold); font-family: monospace; font-size: 14px; }
    input[type=range] { width: 100%; accent-color: var(--accent-emerald); }
    .proof-box {
      background: rgba(9, 9, 13, 0.7);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      font-size: 13px;
      line-height: 1.6;
    }
    .proof-formula {
      font-family: 'Times New Roman', serif;
      font-style: italic;
      font-size: 15px;
      color: var(--accent-gold);
      margin-bottom: 8px;
    }
    .proof-stat {
      display: flex;
      justify-content: space-between;
      font-size: 12.5px;
      margin-bottom: 4px;
      color: var(--text-sub);
    }
    .proof-sum {
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      font-weight: 850;
      color: var(--accent-emerald);
      display: flex;
      justify-content: space-between;
      font-size: 13.5px;
    }
    @media (max-width: 820px) {
      .layout { grid-template-columns: 1fr; grid-template-rows: 1fr auto; }
      aside { height: 260px; border-left: none; border-top: 1px solid var(--border); }
    }
  </style>
</head>
<body>
  <header>
    <div class="header-left">
      <a href="../teacher-hub.html" class="btn-back">← 메인 허브로</a>
      <div>
        <span class="lab-title">지름 위 작은 원들의 둘레 합</span>
        <span class="lab-meta">중1 · 평면도형</span>
      </div>
    </div>
  </header>

  <div class="layout">
    <canvas id="canvasView"></canvas>
    <aside>
      <div class="control-block">
        <label>지름 분할 위치 t <span class="val-chip" id="valT">0.60</span></label>
        <input type="range" id="sliderT" min="0.1" max="0.9" step="0.02" value="0.60">
      </div>

      <div class="proof-box">
        <div class="proof-formula">l₁ + l₂ = π(d₁/2) + π(d₂/2) = π((d₁+d₂)/2) = L</div>
        <div class="proof-stat"><span>큰 반원 호 길이 (L)</span><span id="statLargeArc">31.42</span></div>
        <div class="proof-stat"><span>작은 반원 1 호 (l₁)</span><span id="statArc1">18.85</span></div>
        <div class="proof-stat"><span>작은 반원 2 호 (l₂)</span><span id="statArc2">12.57</span></div>
        <div class="proof-sum"><span>작은 반원 둘레 합 (l₁ + l₂)</span><span id="statSumArc">31.42</span></div>
      </div>

      <div class="proof-box" style="font-size: 12.5px; color: var(--text-sub);">
        <strong>둘레 보존 정리:</strong><br>
        지름을 임의의 비율로 몇 개로 나누든, 분할된 선분을 지름으로 하는 반원들의 호의 길이 합은 항상 원래 큰 반원의 호의 길이와 완전히 일치합니다.
      </div>
    </aside>
  </div>

  <script>
    const canvas = document.getElementById('canvasView');
    const ctx = canvas.getContext('2d');
    const sliderT = document.getElementById('sliderT');
    const valT = document.getElementById('valT');
    const statLargeArc = document.getElementById('statLargeArc');
    const statArc1 = document.getElementById('statArc1');
    const statArc2 = document.getElementById('statArc2');
    const statSumArc = document.getElementById('statSumArc');

    function resize() {
      canvas.width = canvas.clientWidth * window.devicePixelRatio;
      canvas.height = canvas.clientHeight * window.devicePixelRatio;
      draw();
    }
    window.addEventListener('resize', resize);

    function update() {
      const t = parseFloat(sliderT.value);
      valT.textContent = t.toFixed(2);

      const totalD = 20; // units
      const d1 = totalD * t;
      const d2 = totalD * (1 - t);

      const L = Math.PI * (totalD / 2);
      const l1 = Math.PI * (d1 / 2);
      const l2 = Math.PI * (d2 / 2);

      statLargeArc.textContent = L.toFixed(2);
      statArc1.textContent = l1.toFixed(2);
      statArc2.textContent = l2.toFixed(2);
      statSumArc.textContent = (l1 + l2).toFixed(2);

      draw();
    }

    sliderT.addEventListener('input', update);

    function draw() {
      const w = canvas.width;
      const h = canvas.height;
      ctx.clearRect(0, 0, w, h);

      const cy = h / 2 + 30 * window.devicePixelRatio;
      const span = Math.min(w * 0.75, h * 0.7);
      const leftX = (w - span) / 2;
      const rightX = leftX + span;
      const t = parseFloat(sliderT.value);
      const midX = leftX + span * t;

      // Diameter line AB
      ctx.beginPath();
      ctx.moveTo(leftX, cy);
      ctx.lineTo(rightX, cy);
      ctx.strokeStyle = '#7E7887';
      ctx.lineWidth = 1.5 * window.devicePixelRatio;
      ctx.stroke();

      // Large upper semicircle (Emerald)
      ctx.beginPath();
      ctx.arc(leftX + span / 2, cy, span / 2, Math.PI, 0, false);
      ctx.strokeStyle = '#55CBA3';
      ctx.lineWidth = 3 * window.devicePixelRatio;
      ctx.stroke();

      // Small semicircle 1 (Gold)
      const d1 = span * t;
      ctx.beginPath();
      ctx.arc(leftX + d1 / 2, cy, d1 / 2, 0, Math.PI, false); // downwards
      ctx.strokeStyle = '#D8B77E';
      ctx.lineWidth = 2.5 * window.devicePixelRatio;
      ctx.stroke();

      // Small semicircle 2 (Amethyst)
      const d2 = span * (1 - t);
      ctx.beginPath();
      ctx.arc(midX + d2 / 2, cy, d2 / 2, 0, Math.PI, false); // downwards
      ctx.strokeStyle = '#A78AC8';
      ctx.lineWidth = 2.5 * window.devicePixelRatio;
      ctx.stroke();

      // Key points
      const drawPoint = (x, y, color, label) => {
        ctx.beginPath();
        ctx.arc(x, y, 5 * window.devicePixelRatio, 0, Math.PI * 2);
        ctx.fillStyle = color;
        ctx.fill();
        ctx.font = `bold ${12 * window.devicePixelRatio}px Pretendard`;
        ctx.fillText(label, x - 5, y + 20 * window.devicePixelRatio);
      };

      drawPoint(leftX, cy, '#F5F0E9', 'A');
      drawPoint(midX, cy, '#D8B77E', 'P (분할점)');
      drawPoint(rightX, cy, '#F5F0E9', 'B');

      // Labels on arcs
      ctx.fillStyle = '#55CBA3';
      ctx.fillText(`상단 큰 반원 L = ${statLargeArc.textContent}`, leftX + span / 2 - 60, cy - span / 2 - 12);
      ctx.fillStyle = '#D8B77E';
      ctx.fillText(`l₁ = ${statArc1.textContent}`, leftX + d1 / 2 - 25, cy + d1 / 2 + 20);
      ctx.fillStyle = '#A78AC8';
      ctx.fillText(`l₂ = ${statArc2.textContent}`, midX + d2 / 2 - 25, cy + d2 / 2 + 20);
    }

    resize();
    update();
  </script>
</body>
</html>
