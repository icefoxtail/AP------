<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AP Math Playground · 쌍곡선과 점근선의 기하 실험실</title>
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style>
    :root {
      --bg: #09090D;
      --surface: #120E18;
      --card: #181220;
      --accent-gold: #D8B77E;
      --accent-emerald: #55CBA3;
      --accent-amethyst: #A78AC8;
      --text: #F5F0E9;
      --text-sub: #BDB8C2;
      --border: rgba(216, 183, 126, 0.18);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Pretendard', sans-serif;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    header {
      height: 60px;
      padding: 0 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      background: rgba(18, 14, 24, 0.9);
      backdrop-filter: blur(12px);
    }
    .header-left { display: flex; align-items: center; gap: 14px; }
    .btn-back {
      padding: 6px 14px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--accent-gold);
      font-size: 13px;
      font-weight: 750;
      text-decoration: none;
      transition: all 0.2s;
    }
    .btn-back:hover { border-color: var(--accent-emerald); color: var(--text); }
    .lab-title { font-size: 16px; font-weight: 850; }
    .lab-meta { font-size: 11px; color: var(--accent-emerald); margin-left: 6px; }
    .layout {
      flex: 1;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 340px;
      overflow: hidden;
    }
    #canvasView {
      width: 100%;
      height: 100%;
      display: block;
      background: radial-gradient(circle at center, #1b1322 0%, #09090D 80%);
    }
    aside {
      background: var(--surface);
      border-left: 1px solid var(--border);
      padding: 22px 20px;
      display: flex;
      flex-direction: column;
      gap: 18px;
      overflow-y: auto;
    }
    .control-block {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
    }
    .control-block label {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      font-weight: 800;
      color: var(--text);
      margin-bottom: 8px;
    }
    .val-chip { color: var(--accent-gold); font-family: monospace; font-size: 14px; }
    input[type=range] { width: 100%; accent-color: var(--accent-emerald); }
    .proof-box {
      background: rgba(9, 9, 13, 0.7);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      font-size: 13px;
      line-height: 1.6;
    }
    .proof-formula {
      font-family: 'Times New Roman', serif;
      font-style: italic;
      font-size: 15px;
      color: var(--accent-gold);
      margin-bottom: 8px;
    }
    .proof-stat {
      display: flex;
      justify-content: space-between;
      font-size: 12.5px;
      margin-bottom: 4px;
      color: var(--text-sub);
    }
    .proof-sum {
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      font-weight: 850;
      color: var(--accent-emerald);
      display: flex;
      justify-content: space-between;
      font-size: 13.5px;
    }
    @media (max-width: 820px) {
      .layout { grid-template-columns: 1fr; grid-template-rows: 1fr auto; }
      aside { height: 260px; border-left: none; border-top: 1px solid var(--border); }
    }
  </style>
</head>
<body>
  <header>
    <div class="header-left">
      <a href="../teacher-hub.html" class="btn-back">← 메인 허브로</a>
      <div>
        <span class="lab-title">쌍곡선과 점근선의 기하</span>
        <span class="lab-meta">기하 · 이차곡선</span>
      </div>
    </div>
  </header>

  <div class="layout">
    <canvas id="canvasView"></canvas>
    <aside>
      <div class="control-block">
        <label>실축 반경 a <span class="val-chip" id="valA">2.5</span></label>
        <input type="range" id="sliderA" min="1.5" max="4.0" step="0.1" value="2.5">
      </div>

      <div class="control-block">
        <label>허축 반경 b <span class="val-chip" id="valB">2.0</span></label>
        <input type="range" id="sliderB" min="1.0" max="3.5" step="0.1" value="2.0">
      </div>

      <div class="proof-box">
        <div class="proof-formula">x²/a² − y²/b² = 1, 점근선 y = ±(b/a)x</div>
        <div class="proof-stat"><span>초점 거리 c = √(a² + b²)</span><span id="statC">3.20</span></div>
        <div class="proof-stat"><span>점근선 기울기 (±b/a)</span><span id="statSlope">±0.80</span></div>
        <div class="proof-stat"><span>초점 1 거리 |PF₁|</span><span id="statD1">--</span></div>
        <div class="proof-stat"><span>초점 2 거리 |PF₂|</span><span id="statD2">--</span></div>
        <div class="proof-sum"><span>거리의 차 ||PF₁| − |PF₂||</span><span id="statDiff">5.00 (= 2a)</span></div>
      </div>

      <div class="proof-box" style="font-size: 12.5px; color: var(--text-sub);">
        <strong>쌍곡선의 기하학적 정의:</strong><br>
        두 초점으로부터의 <strong>거리의 차가 일정한 점들의 자취</strong>입니다. 원점에서 멀어질수록 곡선은 점근선 <span style="color:var(--accent-gold);">y = ±(b/a)x</span>에 한없이 가까워집니다.
      </div>
    </aside>
  </div>

  <script>
    const canvas = document.getElementById('canvasView');
    const ctx = canvas.getContext('2d');
    const sliderA = document.getElementById('sliderA');
    const sliderB = document.getElementById('sliderB');
    const valA = document.getElementById('valA');
    const valB = document.getElementById('valB');
    const statC = document.getElementById('statC');
    const statSlope = document.getElementById('statSlope');
    const statD1 = document.getElementById('statD1');
    const statD2 = document.getElementById('statD2');
    const statDiff = document.getElementById('statDiff');

    let animT = 0;

    function resize() {
      canvas.width = canvas.clientWidth * window.devicePixelRatio;
      canvas.height = canvas.clientHeight * window.devicePixelRatio;
      draw();
    }
    window.addEventListener('resize', resize);

    function update() {
      const a = parseFloat(sliderA.value);
      const b = parseFloat(sliderB.value);
      valA.textContent = a.toFixed(1);
      valB.textContent = b.toFixed(1);

      const c = Math.sqrt(a * a + b * b);
      statC.textContent = c.toFixed(2);
      statSlope.textContent = `±${(b / a).toFixed(2)}`;
      statDiff.textContent = `${(2 * a).toFixed(2)} (= 2a)`;

      draw();
    }

    sliderA.addEventListener('input', update);
    sliderB.addEventListener('input', update);

    function draw() {
      const w = canvas.width;
      const h = canvas.height;
      ctx.clearRect(0, 0, w, h);

      const cx = w / 2;
      const cy = h / 2;
      const unit = Math.min(w, h) / 16;

      const a = parseFloat(sliderA.value);
      const b = parseFloat(sliderB.value);
      const c = Math.sqrt(a * a + b * b);

      // Axes
      ctx.strokeStyle = '#7E7887';
      ctx.lineWidth = 1.5 * window.devicePixelRatio;
      ctx.beginPath();
      ctx.moveTo(0, cy); ctx.lineTo(w, cy);
      ctx.moveTo(cx, 0); ctx.lineTo(cx, h);
      ctx.stroke();

      // Asymptotes y = ±(b/a)x (Dashed Gold)
      ctx.save();
      ctx.setLineDash([4 * window.devicePixelRatio, 4 * window.devicePixelRatio]);
      ctx.strokeStyle = 'rgba(216, 183, 126, 0.6)';
      ctx.lineWidth = 1.6 * window.devicePixelRatio;
      const slope = b / a;
      ctx.beginPath();
      ctx.moveTo(cx - 9 * unit, cy + 9 * slope * unit);
      ctx.lineTo(cx + 9 * unit, cy - 9 * slope * unit);
      ctx.moveTo(cx - 9 * unit, cy - 9 * slope * unit);
      ctx.lineTo(cx + 9 * unit, cy + 9 * slope * unit);
      ctx.stroke();
      ctx.restore();

      // Hyperbola branches (x = ±a cosh u, y = b sinh u)
      ctx.strokeStyle = '#55CBA3';
      ctx.lineWidth = 3.5 * window.devicePixelRatio;

      // Right branch
      ctx.beginPath();
      for (let u = -2.2; u <= 2.2; u += 0.05) {
        const x = a * Math.cosh(u);
        const y = b * Math.sinh(u);
        const scrX = cx + x * unit;
        const scrY = cy - y * unit;
        if (u === -2.2) ctx.moveTo(scrX, scrY);
        else ctx.lineTo(scrX, scrY);
      }
      ctx.stroke();

      // Left branch
      ctx.beginPath();
      for (let u = -2.2; u <= 2.2; u += 0.05) {
        const x = -a * Math.cosh(u);
        const y = b * Math.sinh(u);
        const scrX = cx + x * unit;
        const scrY = cy - y * unit;
        if (u === -2.2) ctx.moveTo(scrX, scrY);
        else ctx.lineTo(scrX, scrY);
      }
      ctx.stroke();

      // Foci F1(-c, 0), F2(c, 0)
      const f1x = cx - c * unit;
      const f2x = cx + c * unit;

      const drawFocus = (x, y, label) => {
        ctx.beginPath();
        ctx.arc(x, y, 6 * window.devicePixelRatio, 0, Math.PI * 2);
        ctx.fillStyle = '#A78AC8';
        ctx.fill();
        ctx.strokeStyle = '#F5F0E9';
        ctx.lineWidth = 1.8 * window.devicePixelRatio;
        ctx.stroke();
        ctx.font = `bold ${12 * window.devicePixelRatio}px Pretendard`;
        ctx.fillStyle = '#A78AC8';
        ctx.fillText(label, x - 10, y + 20 * window.devicePixelRatio);
      };
      drawFocus(f1x, cy, 'F₁ (−c, 0)');
      drawFocus(f2x, cy, 'F₂ (c, 0)');

      // Dynamic Point P on right branch
      const uCur = Math.sin(animT) * 1.5;
      const pxVal = a * Math.cosh(uCur);
      const pyVal = b * Math.sinh(uCur);
      const px = cx + pxVal * unit;
      const py = cy - pyVal * unit;

      // Lines from F1 and F2 to P
      ctx.beginPath();
      ctx.moveTo(f1x, cy); ctx.lineTo(px, py);
      ctx.strokeStyle = '#D8B77E';
      ctx.lineWidth = 1.8 * window.devicePixelRatio;
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(f2x, cy); ctx.lineTo(px, py);
      ctx.strokeStyle = '#EAD8B6';
      ctx.lineWidth = 1.8 * window.devicePixelRatio;
      ctx.stroke();

      // Calculate distance readouts
      const d1 = Math.hypot(pxVal - (-c), pyVal);
      const d2 = Math.hypot(pxVal - c, pyVal);
      statD1.textContent = d1.toFixed(2);
      statD2.textContent = d2.toFixed(2);

      // Point P dot
      ctx.beginPath();
      ctx.arc(px, py, 6 * window.devicePixelRatio, 0, Math.PI * 2);
      ctx.fillStyle = '#F5F0E9';
      ctx.fill();
      ctx.strokeStyle = '#55CBA3';
      ctx.lineWidth = 2.5 * window.devicePixelRatio;
      ctx.stroke();
    }

    function loop() {
      animT += 0.02;
      draw();
      requestAnimationFrame(loop);
    }

    resize();
    update();
    loop();
  </script>
</body>
</html>
