<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AP Math Playground · 삼차함수와 동적 접선 실험실</title>
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style>
    :root {
      --bg: #09090D;
      --surface: #120E18;
      --card: #181220;
      --accent-gold: #D8B77E;
      --accent-emerald: #55CBA3;
      --accent-amethyst: #A78AC8;
      --text: #F5F0E9;
      --text-sub: #BDB8C2;
      --border: rgba(216, 183, 126, 0.18);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Pretendard', sans-serif;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    header {
      height: 60px;
      padding: 0 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      background: rgba(18, 14, 24, 0.9);
      backdrop-filter: blur(12px);
    }
    .header-left { display: flex; align-items: center; gap: 14px; }
    .btn-back {
      padding: 6px 14px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--accent-gold);
      font-size: 13px;
      font-weight: 750;
      text-decoration: none;
      transition: all 0.2s;
    }
    .btn-back:hover { border-color: var(--accent-emerald); color: var(--text); }
    .lab-title { font-size: 16px; font-weight: 850; }
    .lab-meta { font-size: 11px; color: var(--accent-emerald); margin-left: 6px; }
    .layout {
      flex: 1;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 340px;
      overflow: hidden;
    }
    #canvasView {
      width: 100%;
      height: 100%;
      display: block;
      background: radial-gradient(circle at center, #1b1322 0%, #09090D 80%);
    }
    aside {
      background: var(--surface);
      border-left: 1px solid var(--border);
      padding: 22px 20px;
      display: flex;
      flex-direction: column;
      gap: 18px;
      overflow-y: auto;
    }
    .control-block {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
    }
    .control-block label {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      font-weight: 800;
      color: var(--text);
      margin-bottom: 8px;
    }
    .val-chip { color: var(--accent-gold); font-family: monospace; font-size: 14px; }
    input[type=range] { width: 100%; accent-color: var(--accent-emerald); }
    .proof-box {
      background: rgba(9, 9, 13, 0.7);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      font-size: 13px;
      line-height: 1.6;
    }
    .proof-formula {
      font-family: 'Times New Roman', serif;
      font-style: italic;
      font-size: 15px;
      color: var(--accent-gold);
      margin-bottom: 8px;
    }
    .proof-stat {
      display: flex;
      justify-content: space-between;
      font-size: 12.5px;
      margin-bottom: 4px;
      color: var(--text-sub);
    }
    .proof-sum {
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      font-weight: 850;
      color: var(--accent-emerald);
      display: flex;
      justify-content: space-between;
      font-size: 13.5px;
    }
    @media (max-width: 820px) {
      .layout { grid-template-columns: 1fr; grid-template-rows: 1fr auto; }
      aside { height: 260px; border-left: none; border-top: 1px solid var(--border); }
    }
  </style>
</head>
<body>
  <header>
    <div class="header-left">
      <a href="../teacher-hub.html" class="btn-back">← 메인 허브로</a>
      <div>
        <span class="lab-title">삼차함수와 동적 접선의 방정식</span>
        <span class="lab-meta">수학II · 미분계수</span>
      </div>
    </div>
  </header>

  <div class="layout">
    <canvas id="canvasView"></canvas>
    <aside>
      <div class="control-block">
        <label>접점 위치 t <span class="val-chip" id="valT">0.50</span></label>
        <input type="range" id="sliderT" min="-2.0" max="2.0" step="0.05" value="0.5">
      </div>

      <div class="control-block">
        <label>곡선 계수 k <span class="val-chip" id="valK">1.0</span></label>
        <input type="range" id="sliderK" min="0.5" max="2.0" step="0.1" value="1.0">
      </div>

      <div class="proof-box">
        <div class="proof-formula">f(x) = k(x³ − 3x),  y = f'(t)(x − t) + f(t)</div>
        <div class="proof-stat"><span>접점 좌표 (t, f(t))</span><span id="statPoint">(0.50, −1.38)</span></div>
        <div class="proof-stat"><span>미분계수 f'(t) [접선 기울기]</span><span id="statSlope">−2.25</span></div>
        <div class="proof-stat"><span>극댓점 / 극솟점</span><span>(−1, +2k) / (1, −2k)</span></div>
        <div class="proof-sum"><span>접선의 방정식</span><span id="statLine">y = −2.25x − 0.25</span></div>
      </div>

      <div class="proof-box" style="font-size: 12.5px; color: var(--text-sub);">
        <strong>미분의 기하학적 정의:</strong><br>
        곡선 위의 한 점 <span style="color:var(--text);">P</span>에서의 접선의 기울기는 도함수 <span style="color:var(--accent-emerald);">f'(t)</span>의 함숫값과 완벽하게 일치합니다. 변곡점 <span style="color:var(--accent-gold);">(0, 0)</span>에서 접선의 기울기는 최소가 됩니다.
      </div>
    </aside>
  </div>

  <script>
    const canvas = document.getElementById('canvasView');
    const ctx = canvas.getContext('2d');
    const sliderT = document.getElementById('sliderT');
    const sliderK = document.getElementById('sliderK');
    const valT = document.getElementById('valT');
    const valK = document.getElementById('valK');
    const statPoint = document.getElementById('statPoint');
    const statSlope = document.getElementById('statSlope');
    const statLine = document.getElementById('statLine');

    function resize() {
      canvas.width = canvas.clientWidth * window.devicePixelRatio;
      canvas.height = canvas.clientHeight * window.devicePixelRatio;
      draw();
    }
    window.addEventListener('resize', resize);

    function update() {
      const t = parseFloat(sliderT.value);
      const k = parseFloat(sliderK.value);
      valT.textContent = t.toFixed(2);
      valK.textContent = k.toFixed(1);

      const ft = k * (t * t * t - 3 * t);
      const fpt = k * (3 * t * t - 3);

      statPoint.textContent = `(${t.toFixed(2)}, ${ft.toFixed(2)})`;
      statSlope.textContent = (fpt >= 0 ? '+' : '') + fpt.toFixed(2);

      const yInt = ft - fpt * t;
      const signY = yInt >= 0 ? `+ ${yInt.toFixed(2)}` : `− ${Math.abs(yInt).toFixed(2)}`;
      statLine.textContent = `y = ${fpt.toFixed(2)}x ${signY}`;

      draw();
    }

    sliderT.addEventListener('input', update);
    sliderK.addEventListener('input', update);

    function draw() {
      const w = canvas.width;
      const h = canvas.height;
      ctx.clearRect(0, 0, w, h);

      const cx = w / 2;
      const cy = h / 2;
      const unit = Math.min(w, h) / 10;

      const t = parseFloat(sliderT.value);
      const k = parseFloat(sliderK.value);

      // Axes
      ctx.strokeStyle = '#7E7887';
      ctx.lineWidth = 1.5 * window.devicePixelRatio;
      ctx.beginPath();
      ctx.moveTo(0, cy); ctx.lineTo(w, cy);
      ctx.moveTo(cx, 0); ctx.lineTo(cx, h);
      ctx.stroke();

      // Cubic curve (Emerald)
      ctx.strokeStyle = '#55CBA3';
      ctx.lineWidth = 3.5 * window.devicePixelRatio;
      ctx.beginPath();
      let first = true;
      for (let px = -3.5; px <= 3.5; px += 0.04) {
        const x = px;
        const y = k * (x * x * x - 3 * x);
        const scrX = cx + x * unit;
        const scrY = cy - y * unit;
        if (first) { ctx.moveTo(scrX, scrY); first = false; }
        else { ctx.lineTo(scrX, scrY); }
      }
      ctx.stroke();

      // Tangent point P(t, f(t))
      const ft = k * (t * t * t - 3 * t);
      const fpt = k * (3 * t * t - 3);
      const ptX = cx + t * unit;
      const ptY = cy - ft * unit;

      // Tangent line (Gold)
      ctx.strokeStyle = '#D8B77E';
      ctx.lineWidth = 2.5 * window.devicePixelRatio;
      ctx.beginPath();
      const xLeft = t - 3.5;
      const yLeft = ft + fpt * (xLeft - t);
      const xRight = t + 3.5;
      const yRight = ft + fpt * (xRight - t);
      ctx.moveTo(cx + xLeft * unit, cy - yLeft * unit);
      ctx.lineTo(cx + xRight * unit, cy - yRight * unit);
      ctx.stroke();

      // Point P dot
      ctx.beginPath();
      ctx.arc(ptX, ptY, 6 * window.devicePixelRatio, 0, Math.PI * 2);
      ctx.fillStyle = '#D8B77E';
      ctx.fill();
      ctx.strokeStyle = '#F5F0E9';
      ctx.lineWidth = 2 * window.devicePixelRatio;
      ctx.stroke();

      // Extrema dots
      const drawExtremum = (x, y, label) => {
        ctx.beginPath();
        ctx.arc(cx + x * unit, cy - y * unit, 4.5 * window.devicePixelRatio, 0, Math.PI * 2);
        ctx.fillStyle = '#A78AC8';
        ctx.fill();
        ctx.font = `bold ${11.5 * window.devicePixelRatio}px Pretendard`;
        ctx.fillText(label, cx + x * unit + 8, cy - y * unit - 8);
      };
      drawExtremum(-1, 2 * k, '극댓점 (−1, 2k)');
      drawExtremum(1, -2 * k, '극솟점 (1, −2k)');

      // Label on P
      ctx.font = `bold ${12 * window.devicePixelRatio}px Pretendard`;
      ctx.fillStyle = '#F5F0E9';
      ctx.fillText(`P (${t.toFixed(1)}, ${ft.toFixed(1)})`, ptX + 10, ptY + 18);
    }

    resize();
    update();
  </script>
</body>
</html>
