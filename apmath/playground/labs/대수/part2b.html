<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>대수 Part 2-B · 사인법칙과 코사인법칙 도형 기하 탐구 칠판</title>
  <!-- Pretendard Webfont -->
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <!-- Tailwind CSS CDN -->
  <script>window.tailwind = window.tailwind || {};</script>
  <script src="https://cdn.tailwindcss.com" onerror="document.documentElement.classList.add('no-tailwind')"></script>
  <!-- FontAwesome 6 CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <!-- KaTeX CDN -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>

  <style>
    * {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background-color: #05100c;
      color: #f1f5f9;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
    }
    button:focus-visible, input:focus-visible, canvas:focus-visible {
      outline: 2px solid #fbbf24;
      outline-offset: 2px;
    }
    .chalkboard-stage {
      background: radial-gradient(circle at 50% 45%, #122d23 0%, #091913 70%, #040d09 100%);
      box-shadow: inset 0 0 90px rgba(0, 0, 0, 0.85);
    }
    .mini-chalkboard {
      background: linear-gradient(160deg, #132e24 0%, #0b1d17 65%, #06120e 100%);
      border: 2px solid #fbbf24;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.8), inset 0 0 40px rgba(0, 0, 0, 0.55);
    }
    .katex { font-size: 1.03em !important; }

    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #05100c; }
    ::-webkit-scrollbar-thumb { background: #1e4637; border-radius: 3px; }

    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      background: #0d231b;
      height: 8px;
      border-radius: 999px;
      outline: none;
      border: 1px solid #285946;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #fbbf24;
      cursor: pointer;
      border: 2.5px solid #ffffff;
      box-shadow: 0 0 12px rgba(251, 191, 36, 0.95);
      transition: transform 0.15s ease;
    }
    input[type="range"]::-webkit-slider-thumb:hover { transform: scale(1.15); }

    .prob-tab.active {
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: #05100c;
      font-weight: 900;
      border-color: #fef08a;
      box-shadow: 0 0 14px rgba(245, 158, 11, 0.45);
    }
    .step-btn.active {
      background: linear-gradient(135deg, #fbbf24, #f59e0b);
      color: #05100c;
      font-weight: 900;
      border-color: #fef08a;
      box-shadow: 0 0 12px rgba(251, 191, 36, 0.55);
      transform: translateY(-1px);
    }
    .chalk-step-card {
      transition: all 0.2s ease;
      cursor: pointer;
    }
    .chalk-step-card:hover {
      border-color: #fbbf24;
      background: rgba(251, 191, 36, 0.08);
    }
    .chalk-step-card.active {
      border-color: #fbbf24;
      background: rgba(251, 191, 36, 0.18);
      box-shadow: 0 0 18px rgba(251, 191, 36, 0.28);
    }

    .ap-back-home {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 10px;
      border-radius: 8px;
      background: rgba(16, 40, 31, 0.9);
      border: 1px solid rgba(52, 211, 153, 0.35);
      color: #a7f3d0;
      font-size: 12px;
      font-weight: 700;
      text-decoration: none;
      transition: all 0.15s ease;
      white-space: nowrap;
    }
    .ap-back-home:hover {
      background: rgba(52, 211, 153, 0.2);
      color: #ffffff;
      border-color: #34d399;
    }

    /* 데스크톱: 좌우 와이드 분할 | 모바일·태블릿: 상하 동시 비교 뷰 */
    @media (min-width: 1024px) {
      body { height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
      .workspace-layout { flex: 1; display: grid; grid-template-columns: minmax(0, 68fr) minmax(340px, 32fr); overflow: hidden; }
      .left-stage-col { height: 100%; display: flex; flex-direction: column; overflow: hidden; }
      .right-panel-col { height: 100%; overflow-y: auto; border-left: 1px solid rgba(16, 185, 129, 0.28); }
    }
    @media (max-width: 1023px) {
      body { min-height: 100vh; overflow-y: auto; display: flex; flex-direction: column; }
      .workspace-layout { display: flex; flex-direction: column; }
      .canvas-box { height: clamp(340px, 50svh, 500px); width: 100%; transition: height 0.25s ease; }
      body.mobile-chalk-open .canvas-box { height: clamp(275px, 40svh, 390px); }
    }

    .board-tabs { display: flex; gap: 4px; overflow: auto; }
    .board-tabs button { white-space: nowrap; padding: 6px 10px; border: 1px solid #42775f; border-radius: 6px; font-size: 12.5px; background: #091d15; color: #d1fae5; }
    .board-tabs button.chosen { background: #fbbf24; color: #06130e; font-weight: 800; border-color: #fef08a; }
    .board-tabs button:disabled { opacity: 0.45; cursor: not-allowed; }
    #scaffoldList, #auxHintBox { display: none !important; }
    #miniChalkboard { overflow: auto; max-height: calc(100vh - 320px); }

    @media (min-width: 768px) and (max-width: 1023px) {
      .workspace-layout { display: grid; grid-template-columns: minmax(0, 60fr) minmax(280px, 40fr); align-items: start; overflow: hidden; }
      .workspace-layout > * { min-width: 0; }
      #snapChipBox { max-width: 100%; }
      .left-stage-col { display: contents; }
      .left-stage-col > div:first-child { grid-column: 1 / -1; }
      .canvas-box { grid-column: 1; grid-row: 2 / span 2; height: min(65vh, 700px); min-height: 420px; }
      .left-stage-col > div:last-child { grid-column: 2; grid-row: 2; }
      .right-panel-col { grid-column: 2; grid-row: 3; }
      #miniChalkboard { max-height: 55vh; }
    }
    @media (max-width: 767px) {
      header h1, header h1 + span, #mobSnapTag { display: none; }
      header { padding-top: 4px !important; padding-bottom: 4px !important; }
      #snapChipBox { display: none; }
      .right-panel-col { padding-top: 6px !important; }
      #mobStatement { font-size: 15px; line-height: 1.55; }
      #mobTitle { font-size: 14px; }
      .canvas-box { height: 42svh; min-height: 270px; }
      body.mobile-chalk-open .canvas-box { height: 34svh; min-height: 230px; }
      #miniChalkboard { max-height: 42vh; }
    }

    .problem-nav { display: flex; align-items: start; gap: 8px; min-width: 0; }
    .problem-groups { display: flex; gap: 4px; flex-shrink: 0; }
    .group-button { border: 1px solid #266047; background: #052b1d; color: #c9f4df; border-radius: 7px; min-height: 36px; padding: 0 11px; font-size: 13px; font-weight: 700; cursor: pointer; white-space: nowrap; }
    .group-button.selected { border-color: #fbbf24; color: #fcd34d; background: #513c0a; }
    @media (max-width: 767px) {
      .problem-nav { display: block; }
      .problem-groups { margin-bottom: 5px; }
      .group-button { min-height: 34px; }
    }
    .problem-picker { position: relative; flex: 1; min-width: 0; }
    .problem-list-toggle { width: 100%; display: flex; align-items: center; gap: 9px; padding: 7px 11px; border: 1px solid #426b54; border-radius: 7px; background: #0c261a; color: #f2fff6; text-align: left; cursor: pointer; min-height: 36px; }
    .picker-label { color: #b7d9c3; font-size: 12px; white-space: nowrap; }
    .problem-list-toggle strong { flex: 1; min-width: 0; font-size: 13.5px; line-height: 1.4; overflow-wrap: anywhere; }
    .picker-action { color: #fcd34d; font-size: 12.5px; font-weight: 700; white-space: nowrap; }
    .problem-list { position: absolute; top: calc(100% + 4px); left: 0; right: 0; z-index: 50; max-height: min(55vh, 420px); overflow-y: auto; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 5px; padding: 8px; background: #071b12; border: 1px solid #568b6c; border-radius: 8px; box-shadow: 0 12px 30px #000b; }
    .problem-list[hidden] { display: none; }
    .problem-item { min-height: 42px; padding: 8px 10px; border: 1px solid #276147; border-radius: 6px; background: #0d2b1d; color: #d8f9e4; text-align: left; font-size: 13px; line-height: 1.35; white-space: normal; overflow-wrap: anywhere; cursor: pointer; }
    @media (max-width: 767px) {
      .problem-list { grid-template-columns: 1fr; max-height: 50vh; }
      .problem-list-toggle { gap: 6px; }
      .picker-label { display: none; }
      .picker-action { font-size: 12px; }
    }
    @media (max-width: 1100px) {
      #mobStatement, #pcStatement { font-size: 15px !important; line-height: 1.6 !important; }
      #mobTitle, #pcTitle { font-size: 15px !important; line-height: 1.4 !important; }
      .problem-list-toggle strong, .problem-item, .group-button, .picker-action { font-size: 14px !important; line-height: 1.4 !important; }
      .step-btn, #btnChalkToggle, #sliderTitle, #sliderReadout, #liveMetricBar { font-size: 14px !important; line-height: 1.4 !important; }
      .step-btn, #btnChalkToggle, .group-button { min-height: 38px; }
      #miniChalkboard .text-xs, #miniChalkboard .text-\[11px\], #miniChalkboard .text-\[10\.5px\], #miniChalkboard .text-\[10px\] { font-size: 14px !important; line-height: 1.5 !important; }
      .board-tabs button { font-size: 14px; min-height: 38px; }
    }
    #miniChalkboard [hidden] { display: none !important; }
    @media (max-width: 767px) {
      #sliderTitle { max-width: 42%; white-space: normal; }
      #paramSlider { min-width: 40px; }
      #sliderReadout { width: 4.5em; }
    }
  </style>

  <!-- AP Math Playground Mobile Bridge -->
  <style id="ap-mobile-bridge">
    @media (max-width: 1023px) {
      body {
        height: auto !important;
        min-height: 100dvh !important;
        overflow-x: hidden !important;
        overflow-y: auto !important;
      }
    }
  </style>
</head>
<body>

  <!-- ===================================================================== -->
  <!-- 상단 헤더: 기본 8선 / 심화 8선 선택 & 이전/다음 내비게이션 -->
  <!-- ===================================================================== -->
  <header class="bg-[#071510] border-b border-emerald-900/80 px-3 py-2 shrink-0 z-20">
    <div class="max-w-[1800px] mx-auto flex flex-col gap-2">
      <div class="flex flex-wrap items-center justify-between gap-2">
        <div class="flex items-center gap-2">
          <a href="index.html" class="ap-back-home" title="전체 단원 목록으로 돌아가기">
            <i class="fa-solid fa-arrow-left text-[10px]"></i>
            <span>전체 단원</span>
          </a>
          <div class="w-7 h-7 rounded-lg bg-amber-500/20 border border-amber-400/60 flex items-center justify-center text-amber-300">
            <i class="fa-solid fa-compass-drafting text-sm"></i>
          </div>
          <h1 class="text-sm sm:text-base font-black tracking-tight text-emerald-50">Part 2-B · 사인법칙과 코사인법칙 도형 기하 탐구 실험실</h1>
          <span class="text-[11px] font-extrabold px-2 py-0.5 rounded bg-amber-500/20 text-amber-300 border border-amber-400/40">기본 8문항 · 심화 8문항</span>
        </div>

        <div class="flex items-center gap-1.5 text-xs">
          <button type="button" onclick="stepProblem(-1)" class="px-2.5 py-1.5 rounded-lg bg-emerald-950 hover:bg-emerald-800 border border-emerald-700/70 text-emerald-200 font-bold transition">
            <i class="fa-solid fa-chevron-left mr-1"></i>이전 문항
          </button>
          <button type="button" onclick="stepProblem(1)" class="px-2.5 py-1.5 rounded-lg bg-emerald-950 hover:bg-emerald-800 border border-emerald-700/70 text-emerald-200 font-bold transition">
            다음 문항<i class="fa-solid fa-chevron-right ml-1"></i>
          </button>
        </div>
      </div>

      <!-- 문항 선택 바 -->
      <nav id="probTabBar" aria-label="문항 선택"></nav>
    </div>
  </header>

  <!-- ===================================================================== -->
  <!-- 메인 워크스페이스 (좌측/상단: 문제+도형+보조선 바 | 우측/하단: 소형 풀이 칠판) -->
  <!-- ===================================================================== -->
  <div class="workspace-layout max-w-[1800px] w-full mx-auto">

    <!-- [좌측/상단 컬럼] -->
    <div class="left-stage-col">

      <!-- 모바일·태블릿 상시 노출 문제 카드 -->
      <div class="lg:hidden bg-[#091b14] border-b border-emerald-800/80 px-3.5 py-2.5">
        <div class="flex items-center justify-between gap-2 mb-1">
          <div class="flex items-center gap-1.5">
            <span id="mobBadge" class="text-[11px] font-black px-2 py-0.5 rounded bg-amber-500/20 text-amber-300 border border-amber-400/50"></span>
            <h2 id="mobTitle" class="text-xs sm:text-sm font-extrabold text-white"></h2>
          </div>
          <span id="mobSnapTag" class="text-[11px] font-mono font-bold text-amber-300 bg-amber-950/70 px-2 py-0.5 rounded border border-amber-500/40 shrink-0"></span>
        </div>
        <div id="mobStatement" class="text-xs sm:text-[13.5px] text-emerald-50/95 leading-relaxed bg-[#05100c] p-2.5 rounded-lg border border-emerald-800/70"></div>
      </div>

      <!-- 메인 인터랙티브 그래프 캔버스 -->
      <main id="canvasSection" class="canvas-box flex-1 relative chalkboard-stage overflow-hidden flex items-center justify-center">
        <canvas id="geoCanvas" tabindex="0" aria-label="도형 작도 칠판 (노란색 핸들 드래그로 도형 조작, 빈 곳 드래그로 화면 이동)" class="w-full h-full block cursor-grab active:cursor-grabbing" style="touch-action: none;"></canvas>

        <!-- 좌측 상단: 실시간 측정값 & 단계 안내 배지 -->
        <div class="absolute top-2.5 left-2.5 pointer-events-none flex flex-col gap-1 max-w-[88%]">
          <div class="bg-[#05100c]/90 backdrop-blur-md border border-emerald-700/70 rounded-lg px-3 py-1.5 shadow-lg inline-flex items-center gap-2 w-fit">
            <span class="w-2 h-2 rounded-full bg-amber-400 animate-ping shrink-0"></span>
            <span id="liveMetricBar" class="text-[12px] font-bold text-amber-200"></span>
          </div>
        </div>

        <!-- 우측 하단: 확대/축소/초기화 -->
        <div class="absolute bottom-2.5 right-2.5 flex items-center gap-1 bg-[#05100c]/90 backdrop-blur-md border border-emerald-800/80 p-1 rounded-lg shadow-lg">
          <button type="button" onclick="zoomCanvas(1.15)" class="w-8 h-8 rounded hover:bg-emerald-900/70 text-emerald-200 text-xs flex items-center justify-center" title="확대"><i class="fa-solid fa-plus"></i></button>
          <button type="button" onclick="zoomCanvas(0.87)" class="w-8 h-8 rounded hover:bg-emerald-900/70 text-emerald-200 text-xs flex items-center justify-center" title="축소"><i class="fa-solid fa-minus"></i></button>
          <button type="button" onclick="resetView()" class="w-8 h-8 rounded hover:bg-emerald-900/70 text-amber-300 text-xs flex items-center justify-center" title="초기화"><i class="fa-solid fa-rotate-left"></i></button>
        </div>
      </main>

      <!-- 캔버스 직하단: 보조선 꺼짐·1·2·3·전체보기 + 슬라이더 + 소형 칠판 꺼내기 버튼 -->
      <div class="bg-[#081711] border-t border-emerald-800/80 px-3.5 py-2.5 shrink-0 space-y-2">
        <div class="flex flex-wrap items-center justify-between gap-2">
          <!-- 보조선 단계 버튼 -->
          <div class="flex flex-wrap items-center gap-1">
            <span class="text-[12px] font-extrabold text-amber-300 mr-1 flex items-center gap-1">
              <i class="fa-solid fa-wand-magic-sparkles"></i> 기하 보조선:
            </span>
            <button type="button" onclick="setAuxStep(0)" id="aux-0" class="step-btn text-xs px-2.5 py-1 rounded-lg border border-emerald-800 bg-emerald-950/70 text-emerald-200 transition">꺼짐</button>
            <button type="button" onclick="setAuxStep(1)" id="aux-1" class="step-btn text-xs px-2.5 py-1 rounded-lg border border-emerald-800 bg-emerald-950/70 text-emerald-200 transition">1단계</button>
            <button type="button" onclick="setAuxStep(2)" id="aux-2" class="step-btn text-xs px-2.5 py-1 rounded-lg border border-emerald-800 bg-emerald-950/70 text-emerald-200 transition">2단계</button>
            <button type="button" onclick="setAuxStep(3)" id="aux-3" class="step-btn text-xs px-2.5 py-1 rounded-lg border border-emerald-800 bg-emerald-950/70 text-emerald-200 transition">3단계</button>
            <button type="button" onclick="setAuxStep(4)" id="aux-4" class="step-btn text-xs px-2.5 py-1 rounded-lg border border-emerald-800 bg-emerald-950/70 text-emerald-200 transition">✨ 전체보기</button>
          </div>

          <!-- 소형 풀이 칠판 토글 버튼 -->
          <button type="button" onclick="toggleChalkboard()" id="btnChalkToggle" class="px-3 py-1.5 rounded-lg bg-gradient-to-r from-amber-400 to-amber-500 hover:from-amber-300 hover:to-amber-400 text-slate-950 text-xs font-black flex items-center gap-1.5 shadow-md transition">
            <i class="fa-solid fa-chalkboard-user"></i>
            <span id="txtChalkToggle">📗 소형 풀이 칠판 꺼내기</span>
          </button>
        </div>

        <div hidden id="auxHintBox" class="text-xs text-emerald-100 bg-[#040d09] px-3 py-2 rounded-lg border border-emerald-800/70 leading-snug"></div>

        <!-- 도형 직접 조작 슬라이더 & 스냅 프리셋 칩 -->
        <div class="flex flex-col sm:flex-row sm:items-center gap-2 pt-0.5">
          <div class="flex-1 flex items-center gap-2.5">
            <span id="sliderTitle" class="text-[12px] font-extrabold text-sky-300 shrink-0">도형 조작:</span>
            <input type="range" id="paramSlider" min="0" max="1" step="0.005" value="0.65" class="flex-1" oninput="onSliderInput(this.value)" />
            <span id="sliderReadout" class="text-xs font-mono font-black text-amber-300 w-20 text-right shrink-0"></span>
          </div>
          <div id="snapChipBox" class="flex items-center gap-1 shrink-0 overflow-x-auto"></div>
        </div>
      </div>
    </div>

    <!-- =================================================================== -->
    <!-- [우측/하단 컬럼] PC 상시 문제 카드 + 꺼내 보는 『소형 풀이 칠판』 -->
    <!-- =================================================================== -->
    <aside id="controlAside" class="right-panel-col bg-[#06130e] p-3.5 space-y-3">

      <!-- PC 전용 상시 노출 문제 & 조건 카드 -->
      <section class="hidden lg:block bg-[#0b1f18] border border-emerald-800/80 rounded-xl p-3.5 shadow-md space-y-2">
        <div class="flex items-center justify-between gap-2">
          <span id="pcBadge" class="text-[11.5px] font-black px-2.5 py-0.5 rounded bg-amber-500/20 text-amber-300 border border-amber-400/50"></span>
          <span id="pcUnit" class="text-[11.5px] font-bold text-emerald-300"></span>
        </div>
        <h2 id="pcTitle" class="text-[15px] font-black text-white leading-snug"></h2>
        <div id="pcStatement" class="text-[13.5px] text-emerald-50/95 leading-relaxed bg-[#05100c] p-3 rounded-lg border border-emerald-800/70 space-y-1.5"></div>
      </section>

      <div id="scaffoldList" hidden></div>

      <!-- ================================================================= -->
      <!-- 📗 숨겨놨다가 꺼내 보는 『소형 풀이 칠판 (Mini Solution Chalkboard)』 -->
      <!-- ================================================================= -->
      <section id="miniChalkboard" class="hidden mini-chalkboard rounded-2xl p-3.5 space-y-3">
        <div class="flex flex-wrap items-center justify-between gap-2 pb-2 border-b border-emerald-700/70">
          <div class="flex items-center gap-1.5">
            <span class="w-6 h-6 rounded-md bg-amber-400 text-slate-950 font-black text-xs flex items-center justify-center">📗</span>
            <h3 class="text-xs sm:text-sm font-black text-amber-300">단계별 기하 풀이 칠판</h3>
          </div>

          <div class="flex items-center gap-1">
            <button type="button" onclick="setSolMode('geo')" id="tabGeo" class="px-2.5 py-1 rounded-md text-[11.5px] font-black bg-amber-400 text-slate-950 transition">🎯 실전 최적 풀이</button>
            <button type="button" onclick="setSolMode('alg')" id="tabAlg" class="px-2.5 py-1 rounded-md text-[11.5px] font-bold bg-emerald-950 text-emerald-200 border border-emerald-700/70 hover:bg-emerald-900 transition">📖 풀이 비교</button>

    function texFallback(expr) {

        .replace(/[{}]/g, '')
        .trim();
    }

        aha: `대각선 $\\overline{BD}$를 평행이동하여 점 $C$에서 시작하는 $\\overline{CE}$를 그으면 사각형 $DBEC$가 평행사변형이 되어 **$\\overline{BE} = \\overline{DC} = 4$**이고, 평행선 사이의 넓이 보존($\\triangle BCD = \\triangle BCE$)에 의해 **$\\triangle ACE$의 넓이는 평행사변형 $ABCD$의 넓이와 정확히 같습니다.**`,
        steps: [
          {
            step: 1,
            title: 'Step 1. 평행사변형 DBEC에서 선분 BE와 AE의 길이 구하기',
            desc: `$\\overline{DC} \\parallel \\overline{BE}$이고 $\\overline{BD} \\parallel \\overline{CE}$이므로 사각형 $DBEC$는 평행사변형입니다.<br/>따라서 $\\overline{BE} = \\overline{DC} = \\overline{AB} = 4$이므로 $\\mathbf{\\overline{AE} = \\overline{AB} + \\overline{BE} = 4 + 4 = 8}$입니다.`
          },
          {
            step: 2,
            title: 'Step 2. 평행선 사이의 등적변형으로 넓이 보존 확인하기',
            desc: `$\\overline{BD} \\parallel \\overline{CE}$이므로 밑변 $\\overline{BC}$가 공통인 두 삼각형에 대하여 $\\text{넓이}(\\triangle BCD) = \\text{넓이}(\\triangle BCE)$입니다.<br/>따라서 $\\mathbf{\\text{넓이}(\\triangle ACE)} = \\text{넓이}(\\triangle ABC) + \\text{넓이}(\\triangle BCE) = \\mathbf{\\text{넓이}(\\text{평행사변형 } ABCD)}$입니다.`

          {

        ],
        alg: `
          <div class="font-bold text-amber-300 mb-1">🔍 삼각형 ACE의 밑변과 높이로 직접 구하는 풀이 비교</div>
          <div>1) 꼭짓점 $C$에서 직선 $AE$까지의 높이 $h$는 평행사변형 $ABCD$의 높이와 같으므로 $h = \\overline{BC}\\sin\\dfrac{\\pi}{3} = 3 \\times \\dfrac{\\sqrt{3}}{2} = \\dfrac{3\\sqrt{3}}{2}$입니다.</div>
          <div>2) 따라서 $\\text{넓이}(\\triangle ACE) = \\dfrac{1}{2} \\times \\overline{AE} \\times h = \\dfrac{1}{2} \\times 8 \\times \\dfrac{3\\sqrt{3}}{2} = 6\\sqrt{3}$으로 등적변형 결과와 정확히 일치합니다.</div>

        answer: 'AE = 8, 넓이(△ACE) = 6√3 (≈ 10.39)'

    ];

    // =========================================================================
    // 2. 상태 관리 및 애니메이션 타이머
    // =========================================================================
    const state = {
      probIdx: 0,
      auxStep: 0,       // 0(꺼짐), 1, 2, 3, 4(전체보기)
      sliderT: 0.72,
      chalkOpen: false,
      solMode: 'geo',   // 'geo' | 'alg'
      animT: 1.0,
      scale: 1.0,
      panX: 0,
      panY: 0,
      dragging: false,
      dragMode: null,   // handle object | 'pan'
      lastPt: { x: 0, y: 0 }
    };

    let activeHandles = [];
    let problemListOpen = false;
    let boardPage = 0;

    function curProb() {
      return PROBLEMS[state.probIdx];
    }

    // =========================================================================
    // 3. 정밀 기하 작도 부품 엔진 (Precision Geometry Primitives)
    // =========================================================================
    const canvas = document.getElementById('geoCanvas');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
      const rect = canvas.parentElement.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      canvas.width = Math.max(1, Math.round(rect.width * dpr));
      canvas.height = Math.max(1, Math.round(rect.height * dpr));
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      drawScene();
    }
    window.addEventListener('resize', resizeCanvas);

    function toScr(mx, my, ox, oy, u) {
      return { x: ox + mx * u, y: oy - my * u };
    }
    function toMath(sx, sy, ox, oy, u) {
      return { x: (sx - ox) / u, y: (oy - sy) / u };
    }

    function drawSubtleGrid(rect, ox, oy, u) {
      ctx.save();
      ctx.strokeStyle = 'rgba(52, 211, 153, 0.06)';
      ctx.lineWidth = 1;
      for (let x = ((ox % u) + u) % u; x < rect.width; x += u) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, rect.height); ctx.stroke();
      }
      for (let y = ((oy % u) + u) % u; y < rect.height; y += u) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(rect.width, y); ctx.stroke();
      }
      ctx.restore();
    }

    function drawRightAngle(vertex, p1, p2, size = 11, col = C.gold) {
      const v1x = p1.x - vertex.x, v1y = p1.y - vertex.y;
      const v2x = p2.x - vertex.x, v2y = p2.y - vertex.y;
      const len1 = Math.hypot(v1x, v1y) || 1;
      const len2 = Math.hypot(v2x, v2y) || 1;
      const u1x = (v1x / len1) * size, u1y = (v1y / len1) * size;
      const u2x = (v2x / len2) * size, u2y = (v2y / len2) * size;

      ctx.save();
      ctx.strokeStyle = col;
      ctx.lineWidth = 2.0;
      ctx.fillStyle = 'rgba(251, 191, 36, 0.18)';
      ctx.beginPath();
      ctx.moveTo(vertex.x, vertex.y);
      ctx.lineTo(vertex.x + u1x, vertex.y + u1y);
      ctx.lineTo(vertex.x + u1x + u2x, vertex.y + u1y + u2y);
      ctx.lineTo(vertex.x + u2x, vertex.y + u2y);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
      ctx.restore();
    }

    function drawDimension(p1, p2, offsetPx, label, col = C.gold) {
      const dx = p2.x - p1.x, dy = p2.y - p1.y;
      const len = Math.hypot(dx, dy);
      if (len < 16) return;
      const nx = (-dy / len) * offsetPx;
      const ny = (dx / len) * offsetPx;
      const a = { x: p1.x + nx, y: p1.y + ny };
      const b = { x: p2.x + nx, y: p2.y + ny };

      ctx.save();
      ctx.strokeStyle = 'rgba(251, 191, 36, 0.35)';
      ctx.lineWidth = 1.2;
      ctx.setLineDash([3, 3]);
      ctx.beginPath();
      ctx.moveTo(p1.x, p1.y); ctx.lineTo(a.x, a.y);
      ctx.moveTo(p2.x, p2.y); ctx.lineTo(b.x, b.y);
      ctx.stroke();

      ctx.strokeStyle = col;
      ctx.lineWidth = 1.9;
      ctx.setLineDash([]);
      ctx.beginPath();
      ctx.moveTo(a.x, a.y);
      ctx.lineTo(b.x, b.y);
      ctx.stroke();

      const ux = dx / len, uy = dy / len;
      const px = -uy, py = ux;
      const aw = 6, ah = 3.5;
      ctx.fillStyle = col;
      ctx.beginPath();
      ctx.moveTo(a.x, a.y);
      ctx.lineTo(a.x + ux * aw + px * ah, a.y + uy * aw + py * ah);
      ctx.lineTo(a.x + ux * aw - px * ah, a.y + uy * aw - py * ah);
      ctx.closePath();
      ctx.fill();

      ctx.beginPath();
      ctx.moveTo(b.x, b.y);
      ctx.lineTo(b.x - ux * aw + px * ah, b.y - uy * aw + py * ah);
      ctx.lineTo(b.x - ux * aw - px * ah, b.y - uy * aw - py * ah);
      ctx.closePath();
      ctx.fill();

      const rect = canvas.parentElement.getBoundingClientRect();
      let fs = innerWidth <= 1100 ? 12.5 : 12;
      ctx.font = `800 ${fs}px Pretendard, sans-serif`;
      let tw = ctx.measureText(label).width;
      if (rect.width > 0 && tw + 24 > rect.width) {
        fs = Math.max(10, fs * ((rect.width - 24) / (tw + 14)));
        ctx.font = `800 ${fs}px Pretendard, sans-serif`;
        tw = ctx.measureText(label).width;
      }

      let mx = (a.x + b.x) / 2;
      let my = (a.y + b.y) / 2;
      if (rect.width > 0 && rect.height > 0) {
        mx = Math.max(tw / 2 + 10, Math.min(rect.width - tw / 2 - 10, mx));
        my = Math.max(48, Math.min(rect.height - 16, my));
      }

      ctx.fillStyle = 'rgba(5, 16, 12, 0.94)';
      ctx.strokeStyle = col;
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.roundRect(mx - tw / 2 - 7, my - 10, tw + 14, 20, 5);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = col;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(label, mx, my);
      ctx.restore();
    }

    function dLine(a, b, col = C.gold, w = 2.6, dash = [], glow = false) {
      ctx.save();
      ctx.strokeStyle = col;
      ctx.lineWidth = w;
      ctx.setLineDash(dash);
      ctx.lineCap = 'round';
      if (glow) { ctx.shadowColor = col; ctx.shadowBlur = 12; }
      ctx.beginPath();
      ctx.moveTo(a.x, a.y);
      ctx.lineTo(b.x, b.y);
      ctx.stroke();
      ctx.restore();
    }

    function dCircle(center, rPx, stroke = C.cyan, fill = null, w = 2.4, dash = []) {
      if (rPx <= 1) return;
      ctx.save();
      ctx.beginPath();
      ctx.arc(center.x, center.y, rPx, 0, Math.PI * 2);
      if (fill) { ctx.fillStyle = fill; ctx.fill(); }
      if (stroke) {
        ctx.strokeStyle = stroke;
        ctx.lineWidth = w;
        ctx.setLineDash(dash);
        ctx.stroke();
      }
      ctx.restore();
    }

    function dPoly(pts, fill = 'rgba(56,189,248,0.16)', stroke = C.cyan, w = 2.5, glow = false) {
      ctx.save();
      ctx.beginPath();
      pts.forEach((p, i) => (i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y)));
      ctx.closePath();
      if (fill) { ctx.fillStyle = fill; ctx.fill(); }
      if (stroke) {
        ctx.strokeStyle = stroke;
        ctx.lineWidth = w;
        if (glow) { ctx.shadowColor = stroke; ctx.shadowBlur = 14; }
        ctx.stroke();
      }
      ctx.restore();
    }

    function dArcAngle(vertex, p1, p2, label = '', col = C.cyan, radiusPx = 24) {
      let a1 = Math.atan2(p1.y - vertex.y, p1.x - vertex.x);
      let a2 = Math.atan2(p2.y - vertex.y, p2.x - vertex.x);
      let diff = a2 - a1;
      while (diff <= -Math.PI) diff += 2 * Math.PI;
      while (diff > Math.PI) diff -= 2 * Math.PI;

      ctx.save();
      ctx.fillStyle = 'rgba(56, 189, 248, 0.14)';
      ctx.strokeStyle = col;
      ctx.lineWidth = 1.7;
      ctx.beginPath();
      ctx.moveTo(vertex.x, vertex.y);
      ctx.arc(vertex.x, vertex.y, radiusPx, a1, a2, diff < 0);
      ctx.closePath();
      ctx.fill();
      ctx.beginPath();
      ctx.arc(vertex.x, vertex.y, radiusPx, a1, a2, diff < 0);
      ctx.stroke();

      if (label) {
        const mid = a1 + diff / 2;
        const lx = vertex.x + (radiusPx + 16) * Math.cos(mid);
        const ly = vertex.y + (radiusPx + 16) * Math.sin(mid);
        ctx.font = `800 ${innerWidth <= 1100 ? 12.5 : 11.5}px Pretendard, sans-serif`;
        ctx.lineWidth = 3;
        ctx.strokeStyle = 'rgba(5, 16, 12, 0.92)';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.strokeText(label, lx, ly);
        ctx.fillStyle = col;
        ctx.fillText(label, lx, ly);
      }
      ctx.restore();
    }

    function dBadge(x, y, text, col = C.gold, bg = 'rgba(5, 16, 12, 0.94)') {
      ctx.save();
      const rect = canvas.parentElement.getBoundingClientRect();
      let fs = innerWidth <= 1100 ? 12.5 : 12;
      ctx.font = `800 ${fs}px Pretendard, sans-serif`;
      let tw = ctx.measureText(text).width;
      if (rect.width > 0 && tw + 26 > rect.width) {
        fs = Math.max(9.5, fs * ((rect.width - 26) / (tw + 16)));
        ctx.font = `800 ${fs}px Pretendard, sans-serif`;
        tw = ctx.measureText(text).width;
      }

      let cx = x, cy = y;
      if (rect.width > 0 && rect.height > 0) {
        cx = Math.max(tw / 2 + 10, Math.min(rect.width - tw / 2 - 10, cx));
        cy = Math.max(48, Math.min(rect.height - 16, cy));
      }

      ctx.fillStyle = bg;
      ctx.strokeStyle = col;
      ctx.lineWidth = 1.3;
      ctx.beginPath();
      ctx.roundRect(cx - tw / 2 - 8, cy - 11, tw + 16, 22, 6);
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle = col;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(text, cx, cy);
      ctx.restore();
    }

    function dVertex(p, label = '', col = C.white, off = { x: 8, y: -8 }, isHandle = false, onDrag = null) {
      ctx.save();
      if (isHandle) {
        ctx.beginPath();
        ctx.arc(p.x, p.y, 13, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(251, 191, 36, 0.24)';
        ctx.fill();
        ctx.strokeStyle = C.gold;
        ctx.lineWidth = 1.6;
        ctx.stroke();
        activeHandles.push({ sx: p.x, sy: p.y, onDrag });
      }
      ctx.beginPath();
      ctx.arc(p.x, p.y, isHandle ? 6.5 : 5.2, 0, Math.PI * 2);
      ctx.fillStyle = col;
      ctx.shadowColor = col;
      ctx.shadowBlur = 8;
      ctx.fill();
      ctx.lineWidth = 1.8;
      ctx.strokeStyle = '#05100c';
      ctx.stroke();

      if (label) {
        ctx.font = `800 ${innerWidth <= 1100 ? 13.5 : 12.5}px Pretendard, sans-serif`;
        ctx.lineWidth = 3.5;
        ctx.strokeStyle = 'rgba(4, 14, 10, 0.95)';
        ctx.textAlign = off.align || 'left';
        ctx.textBaseline = 'middle';
        ctx.strokeText(label, p.x + (off.x || 0), p.y + (off.y || 0));
        ctx.fillStyle = col;
        ctx.fillText(label, p.x + (off.x || 0), p.y + (off.y || 0));
      }
      ctx.restore();
    }

    function constructPtolemyPoint(A, B, C, D) {
      const sub = (U, V) => ({ x: U.x - V.x, y: U.y - V.y });
      const cross = (U, V) => U.x * V.y - U.y * V.x;
      const BA = sub(A, B), BD = sub(D, B), BC = sub(C, B);
      const theta = Math.atan2(cross(BA, BD), BA.x * BD.x + BA.y * BD.y);
      const co = Math.cos(-theta), si = Math.sin(-theta);
      const ray = { x: BC.x * co - BC.y * si, y: BC.x * si + BC.y * co };
      const AC = sub(C, A), AB = sub(A, B), den = cross(ray, AC);
      if (Math.abs(den) < 1e-8) return null;
      const t = cross(AB, AC) / den, u = cross(AB, ray) / den;
      if (t < 0 || u < -1e-6 || u > 1 + 1e-6) return null;
      return { x: B.x + t * ray.x, y: B.y + t * ray.y };
    }

    function solveDegAFromHeight(targetY, a, angOffset) {
      let lo = 30.0, hi = 75.0;
      const heightAt = (deg) => {
        const rad = (deg * Math.PI) / 180;
        const R = a / (2 * Math.sin(rad));
        return R * (Math.cos(rad) + Math.cos(angOffset));
      };
      if (targetY >= heightAt(lo)) return lo;
      if (targetY <= heightAt(hi)) return hi;
      for (let i = 0; i < 16; i++) {
        const mid = 0.5 * (lo + hi);
        if (heightAt(mid) > targetY) lo = mid;
        else hi = mid;
      }
      return 0.5 * (lo + hi);
    }

    function setMetric(txt, livePreviewTxt) {
      const bar = document.getElementById('liveMetricBar');
      if (state.auxStep >= 3) {
        bar.textContent = txt;
        return;
      }
      const preview = livePreviewTxt || txt.replace(/\s*(?:\([^)]*(?:조건|중점)[^)]*\)|➔.*$)$/, '');
      if (state.auxStep === 0) {
        bar.textContent = `[실시간 측정] ${preview}`;
      } else {
        bar.textContent = `[보조선 ${state.auxStep}단계] ${preview}`;
      }
    }

    // =========================================================================
    // 4. 기본 1~8 & 심화 1~8 (총 16문항) 정밀 기하 렌더러
    // =========================================================================
    function drawScene() {
      const rect = canvas.parentElement.getBoundingClientRect();
      if (!rect.width || !rect.height) return;
      ctx.clearRect(0, 0, rect.width, rect.height);
      activeHandles = [];

      const prob = curProb();
      const id = prob.id;
      const step = state.auxStep;
      const t = state.sliderT;
      const baseU = Math.min(rect.width, rect.height) / 10.5;
      const u = baseU * state.scale;
      const ox = rect.width * 0.5 + state.panX;
      const oy = rect.height * 0.53 + state.panY;

      drawSubtleGrid(rect, ox, oy, u);

      // -----------------------------------------------------------------------
      // 🌱 [기본 1] bas-1: 꼭짓점에서 수선의 발 H 내리기 (AB=5, cosB=3/5, AC=2√5)
      // [P1-1 수리] AH = 4 배지를 수선 중앙에 깔끔하게 배치하여 왼쪽 빗변 AB와의 간섭 제거
      // -----------------------------------------------------------------------
      if (id === 'bas-1') {
        const sc = u * 1.1;
        const cx = ox - sc * 0.3;
        const cy = oy + sc * 1.3;

        const bh = 3.0, ah = 4.0;
        const ch = 0.5 + t * 4.0; // t = 0.375 -> ch = 2.0
        const ac = Math.hypot(ah, ch);
        const bc = bh + ch;
        const isTarget = Math.abs(ch - 2.0) < 0.08;

        const B = toScr(-bh, 0, cx, cy, sc);
        const H = toScr(0, 0, cx, cy, sc);
        const Cpt = toScr(ch, 0, cx, cy, sc);
        const A = toScr(0, ah, cx, cy, sc);

        dPoly([A, B, Cpt], 'rgba(56, 189, 248, 0.12)', C.cyan, 2.8);
        dArcAngle(B, Cpt, A, 'cos B = 3/5', C.green, 28);
        dBadge((A.x + B.x) / 2 - 28, (A.y + B.y) / 2 - 12, 'AB = 5', C.green);
        dBadge((A.x + Cpt.x) / 2 + 34, (A.y + Cpt.y) / 2 - 12, isTarget ? 'AC = 2√5 (≈4.47)' : `AC ≈ ${ac.toFixed(2)}`, C.cyan);

        if (step >= 1) {
          dPoly([A, B, H], 'rgba(52, 211, 153, 0.18)', C.green, 2.4);
          dLine(A, H, C.gold, 2.8, [6, 4], true);
          drawRightAngle(H, B, A, 12, C.gold);
          dVertex(H, 'H', C.gold, { x: 0, y: -15, align: 'center' });
          drawDimension(B, H, 26, 'BH = 5 × (3/5) = 3', C.green);
          dBadge(H.x, (A.y + H.y) / 2 + 8, 'AH = 4', C.gold);
        }

        if (step >= 2) {
          dPoly([A, H, Cpt], 'rgba(251, 191, 36, 0.16)', C.gold, 2.4);
          drawDimension(H, Cpt, 26, `CH = √(AC² - 4²) = ${ch.toFixed(1)}`, C.cyan);
        }

        if (step >= 3) {
          const dimTxt = isTarget
            ? '조건 만족 (AC=2√5): BC = 3 + 2 = 5  |  넓이 = 10'
            : `현재 BC = 3 + ${ch.toFixed(1)} = ${bc.toFixed(1)}, 넓이 = ${(0.5 * bc * ah).toFixed(1)} (조건 AC=2√5일 때 BC=5, 넓이=10)`;
          drawDimension(B, Cpt, 52, dimTxt, C.gold);
        }

        dVertex(B, 'B', C.white, { x: -14, y: 4, align: 'right' });
        dVertex(A, 'A', C.white, { x: 0, y: -16, align: 'center' });
        dVertex(Cpt, 'C [드래그]', C.gold, { x: 14, y: -8, align: 'left' }, true, (sPos) => {
          const m = toMath(sPos.x, sPos.y, cx, cy, sc);
          const nextCh = Math.max(0.5, Math.min(4.5, m.x));
          onSliderInput((nextCh - 0.5) / 4.0);
        });

        setMetric(
          `현재 AC ≈ ${ac.toFixed(2)} | BH = 3, AH = 4, CH = ${ch.toFixed(2)} ➔ BC = ${bc.toFixed(2)}, 넓이 = ${(0.5 * bc * ah).toFixed(1)} (조건: BC=5, 넓이=10)`,
          `현재 AC ≈ ${ac.toFixed(2)}, 밑변 BC = ${bc.toFixed(2)} (점 C를 드래그하여 AC = 2√5 ≈ 4.47 위치 탐색)`
        );
        return;
      }

      // -----------------------------------------------------------------------
      // 🌱 [기본 2] bas-2: 13-14-15 삼각형의 수선의 발 (BH=5, CH=9, AH=12)
      // [P0-2 수리] 1단계 이상에서는 수선의 발 H 기준(BH=5, CH=9)으로 치수선을 고정하여 동점 P와의 수치 모순 제거
      // -----------------------------------------------------------------------
      if (id === 'bas-2') {
        const sc = u * 0.50;
        const cx = ox - sc * 7.0;
        const cy = oy + sc * 4.6;

        const B = toScr(0, 0, cx, cy, sc);
        const Cpt = toScr(14, 0, cx, cy, sc);
        const A = toScr(5, 12, cx, cy, sc);
        const H = toScr(5, 0, cx, cy, sc);

        const bp = 2.0 + t * 10.0; // t = 0.30 -> bp = 5.0 (수선의 발 H와 일치)
        const cp = 14.0 - bp;
        const apLen = Math.hypot(bp - 5.0, 12.0);
        const angAPB = (Math.atan2(12.0, 5.0 - bp) * 180) / Math.PI;
        const isPerp = Math.abs(bp - 5.0) < 0.12;
        const P = toScr(bp, 0, cx, cy, sc);

        dPoly([A, B, Cpt], 'rgba(56, 189, 248, 0.12)', C.cyan, 2.8);
        dBadge((A.x + B.x) / 2 - 28, (A.y + B.y) / 2 - 8, 'AB = 13', C.green);
        dBadge((A.x + Cpt.x) / 2 + 30, (A.y + Cpt.y) / 2 - 8, 'AC = 15', C.cyan);

        if (step >= 1) {
          dLine(A, H, 'rgba(251, 191, 36, 0.65)', 2.6, [6, 4]);
          drawRightAngle(H, B, A, 11, C.gold);
          if (!isPerp) {
            dVertex(H, 'H(수선의 발)', C.gold, { x: -8, y: -15, align: 'right' });
          }
          drawDimension(B, H, 32, 'BH = x = 5', C.green);
          drawDimension(H, Cpt, 32, 'CH = 14 - x = 9', C.cyan);
        } else {
          drawDimension(B, Cpt, 32, 'BC = 14', C.white);
        }

        if (step >= 2) {
          dPoly([A, B, H], 'rgba(52, 211, 153, 0.18)', C.green, 2.2);
          dPoly([A, H, Cpt], 'rgba(56, 189, 248, 0.18)', C.cyan, 2.2);
          dBadge(H.x, (A.y + H.y) / 2, '수선 높이 AH = 12', C.gold);
        }

        if (step >= 3) {
          drawDimension(B, Cpt, 58, 'BC = BH + CH = 5 + 9 = 14  ➔  넓이 S = ½ × 14 × 12 = 84', C.gold);
        }

        dLine(A, P, isPerp ? C.gold : C.pink, isPerp ? 3.2 : 2.6, isPerp ? [] : [5, 4], isPerp);
        if (isPerp) {
          drawRightAngle(P, B, A, 12, C.gold);
        } else {
          dBadge((A.x + P.x) / 2 + (bp > 5 ? 36 : -36), (A.y + P.y) / 2 - 12, `AP ≈ ${apLen.toFixed(2)}`, C.pink);
        }

        dVertex(B, 'B', C.white, { x: -14, y: 4, align: 'right' });
        dVertex(Cpt, 'C', C.white, { x: 14, y: 4, align: 'left' });
        dVertex(A, 'A', C.white, { x: 0, y: -16, align: 'center' });
        dVertex(
          P,
          isPerp ? 'P = H(수선의 발, BH=5) [드래그]' : `P (BP=${bp.toFixed(1)}, CP=${cp.toFixed(1)}) [드래그]`,
          C.gold,
          { x: 10, y: -15, align: 'left' },
          true,
          (sPos) => {
            const m = toMath(sPos.x, sPos.y, cx, cy, sc);
            const nextBp = Math.max(2.0, Math.min(12.0, m.x));
            onSliderInput((nextBp - 2.0) / 10.0);
          }
        );

        setMetric(
          `현재 BP = ${bp.toFixed(1)}, CP = ${cp.toFixed(1)}, AP = ${apLen.toFixed(2)} | 수선의 발 H(BH=5, CH=9)에서 최소 높이 AH = 12, 넓이 = 84`,
          `현재 BP = ${bp.toFixed(1)}, CP = ${cp.toFixed(1)} | 선분 AP ≈ ${apLen.toFixed(2)}, ∠APB ≈ ${angAPB.toFixed(0)}°`
        );
        return;
      }

      // -----------------------------------------------------------------------
      // 🌱 [기본 3] bas-3: 공통현 AC를 공유하는 두 외접원의 반지름 비 (R₁=4, R₂=3)
      // [P0-1 수리] 3단계 배지에서 현재 조작 중인 R₁의 사인비와 목표 조건(sinB/sinD=3/4 ➔ R₁=4)을 명확히 구분 표기
      // -----------------------------------------------------------------------
      if (id === 'bas-3') {
        const sc = u * 0.9;
        const r2 = 3.0;
        const r1 = 2.6 + t * 2.2; // t = 0.6364 -> r1 = 4.0
        const h = 2.25;           // 반현 길이 (AC = 4.5)
        const isTarget = Math.abs(r1 - 4.0) < 0.08;

        const d1 = Math.sqrt(Math.max(0.2, r1 * r1 - h * h));
        const d2 = Math.sqrt(Math.max(0.2, r2 * r2 - h * h));

        const O1 = toScr(-d1, 0, ox, oy, sc);
        const O2 = toScr(d2, 0, ox, oy, sc);
        const A = toScr(0, h, ox, oy, sc);
        const Cpt = toScr(0, -h, ox, oy, sc);
        const B = toScr(-d1 - r1 * Math.cos(0.22), r1 * Math.sin(0.22), ox, oy, sc);
        const D = toScr(d2 + r2 * Math.cos(-0.18), r2 * Math.sin(-0.18), ox, oy, sc);

        dCircle(O1, r1 * sc, 'rgba(52, 211, 153, 0.7)', 'rgba(52, 211, 153, 0.05)', 2.4);
        dCircle(O2, r2 * sc, 'rgba(56, 189, 248, 0.7)', 'rgba(56, 189, 248, 0.05)', 2.4);

        dLine(A, B, C.green, 2.5);
        dLine(Cpt, B, C.green, 2.5);
        dLine(A, D, C.cyan, 2.5);
        dLine(Cpt, D, C.cyan, 2.5);

        const ratioSin = r2 / r1;

        if (step >= 1) {
          dLine(A, Cpt, C.red, 3.6, [], true);
          dBadge(A.x, Cpt.y + 26, '공통현 AC', C.red);
        }

        if (step >= 2) {
          dArcAngle(B, Cpt, A, '∠B', C.green, 26);
          dArcAngle(D, A, Cpt, '∠D', C.cyan, 26);
          dBadge(O1.x, O1.y - r1 * sc - 16, `AC = 2R₁ sin B`, C.green);
          dBadge(O2.x, O2.y - r2 * sc - 16, `AC = 2R₂ sin D (R₂=3)`, C.cyan);
        }

        if (step >= 3) {
          const badgeTxt = isTarget
            ? '조건 만족 (sin B / sin D = 3/4): R₁ = R₂ × (4/3) = 3 × (4/3) = 4'
            : `현재 R₁ = ${r1.toFixed(2)} (sin B / sin D ≈ ${ratioSin.toFixed(2)})  |  조건 sin B / sin D = 3/4일 때 R₁ = 4`;
          dBadge(ox, Cpt.y + 54, badgeTxt, C.gold);
        }

        dVertex(O1, `O₁(R₁=${r1.toFixed(1)})`, C.green, { x: 0, y: 16, align: 'center' });
        dVertex(O2, 'O₂(R₂=3)', C.cyan, { x: 0, y: 16, align: 'center' });
        dVertex(A, 'A', C.white, { x: 0, y: -15, align: 'center' });
        dVertex(Cpt, 'C', C.white, { x: 12, y: 8, align: 'left' });
        dVertex(D, 'D', C.cyan, { x: 12, y: -6, align: 'left' });
        dVertex(B, 'B [R₁ 조절 드래그]', C.gold, { x: -12, y: -10, align: 'right' }, true, (sPos) => {
          const m = toMath(sPos.x, sPos.y, ox, oy, sc);
          const dist = Math.hypot(m.x + d1, m.y);
          const nextR1 = Math.max(2.6, Math.min(4.8, dist));
          onSliderInput((nextR1 - 2.6) / 2.2);
        });

        setMetric(
          `현재 R₁ = ${r1.toFixed(2)}, R₂ = 3.00 | sin B / sin D = R₂ / R₁ ≈ ${ratioSin.toFixed(2)} (조건: 3/4 = 0.75 ➔ R₁ = 4)`,
          `현재 R₁ = ${r1.toFixed(2)}, R₂ = 3.00 | 사인 비 sin B / sin D ≈ ${ratioSin.toFixed(2)}`
        );
        return;
      }

      // -----------------------------------------------------------------------
      // 🌱 [기본 4] bas-4: 두 외접원의 반지름 비로 원주각 사인값 구하기 (R₁=4.5, R₂=3)
      // [P0-1 수리] 3단계 배지에서 현재 조작된 공통현 AC에 대한 6 sin D = AC 식과 조건 만족값(AC=5 ➔ sin D=5/6)을 일치시켜 표기
      // -----------------------------------------------------------------------
      if (id === 'bas-4') {
        const sc = u * 0.85;
        const r1 = 4.5, r2 = 3.0;
        const acLen = 3.0 + t * 2.8; // t = 0.7143 -> acLen = 5.0
        const h = acLen / 2;
        const isTarget = Math.abs(acLen - 5.0) < 0.08;

        const d1 = Math.sqrt(Math.max(0.2, r1 * r1 - h * h));
        const d2 = Math.sqrt(Math.max(0.2, r2 * r2 - h * h));

        const O1 = toScr(-d1, 0, ox, oy, sc);
        const O2 = toScr(d2, 0, ox, oy, sc);
        const A = toScr(0, h, ox, oy, sc);
        const Cpt = toScr(0, -h, ox, oy, sc);
        const B = toScr(-d1 - r1 * Math.cos(0.2), r1 * Math.sin(0.2), ox, oy, sc);
        const D = toScr(d2 + r2 * Math.cos(-0.18), r2 * Math.sin(-0.18), ox, oy, sc);

        dCircle(O1, r1 * sc, 'rgba(52, 211, 153, 0.7)', 'rgba(52, 211, 153, 0.05)', 2.4);
        dCircle(O2, r2 * sc, 'rgba(56, 189, 248, 0.7)', 'rgba(56, 189, 248, 0.05)', 2.4);

        dLine(A, B, C.green, 2.5);
        dLine(Cpt, B, C.green, 2.5);
        dLine(A, D, C.cyan, 2.5);
        dLine(Cpt, D, C.cyan, 2.5);
        dLine(A, Cpt, C.red, 3.2);

        const sinB = acLen / (2 * r1);
        const sinD = acLen / (2 * r2);

        if (step >= 1) {
          dArcAngle(B, Cpt, A, isTarget ? 'sin B = 5/9' : `sin B ≈ ${sinB.toFixed(2)}`, C.green, 28);
          dBadge(A.x, Cpt.y + 26, `AC = 2R₁ sin B = ${acLen.toFixed(2)}`, C.red);
        }

        if (step >= 2) {
          dArcAngle(D, A, Cpt, step >= 3 && isTarget ? 'sin D = 5/6' : `sin D ≈ ${sinD.toFixed(2)}`, C.cyan, 26);
          dBadge(O2.x, O2.y - r2 * sc - 16, `AC = 2R₂ sin D = 6 sin D`, C.cyan);
        }

        if (step >= 3) {
          const badgeTxt = isTarget
            ? '조건 만족 (sin B = 5/9, AC = 5): 6 sin D = 5  ➔  sin D = 5/6 (≈ 0.833)'
            : `현재 6 sin D = ${acLen.toFixed(2)} (sin D ≈ ${sinD.toFixed(3)})  |  조건 sin B = 5/9일 때 AC = 5 ➔ sin D = 5/6`;
          dBadge(ox, Cpt.y + 54, badgeTxt, C.gold);
        }

        dVertex(O1, 'O₁(R₁=9/2)', C.green, { x: 0, y: 16, align: 'center' });
        dVertex(O2, 'O₂(R₂=3)', C.cyan, { x: 0, y: 16, align: 'center' });
        dVertex(B, 'B', C.green, { x: -12, y: -8, align: 'right' });
        dVertex(D, 'D', C.cyan, { x: 12, y: -8, align: 'left' });
        dVertex(Cpt, 'C', C.white, { x: 12, y: 8, align: 'left' });
        dVertex(A, 'A [공통현 길이 드래그]', C.gold, { x: 0, y: -16, align: 'center' }, true, (sPos) => {
          const m = toMath(sPos.x, sPos.y, ox, oy, sc);
          const nextAc = Math.max(3.0, Math.min(5.8, Math.abs(m.y) * 2));
          onSliderInput((nextAc - 3.0) / 2.8);
        });

        setMetric(
          `현재 AC = ${acLen.toFixed(2)} | sin B = ${sinB.toFixed(3)}, sin D = ${sinD.toFixed(3)} (조건: sin B = 5/9 ➔ AC = 5, sin D = 5/6)`,
          `현재 공통현 AC = ${acLen.toFixed(2)} | sin B ≈ ${sinB.toFixed(3)}, sin D ≈ ${sinD.toFixed(3)}`
        );
        return;
      }

      // -----------------------------------------------------------------------
      // 🌱 [기본 5] bas-5: 두 수선의 발 D, E와 외접원 지름 BC=6, DE = BC cos A
      // [P0-1 수리] 3단계 배지에서 현재 ∠A에 대한 DE 값과 조건(∠A = π/3 ➔ DE = 3)을 함께 명시
      // -----------------------------------------------------------------------
      if (id === 'bas-5') {
        const sc = u * 0.92;
        const cy = oy + sc * 1.3;
        const a = 6.0;
        const degA = 30 + t * 45; // t = 0.6667 -> degA = 60 (π/3)
        const radA = (degA * Math.PI) / 180;
        const cosA = Math.cos(radA);
        const isTarget = Math.abs(degA - 60) < 1.2;

        const R_abc = a / (2 * Math.sin(radA));
        const angOffset = 0.12;
        const O_y = R_abc * Math.cos(radA);
        const Ax = R_abc * Math.sin(angOffset);
        const Ay = O_y + R_abc * Math.cos(angOffset);
        const Bx = -a / 2, By = 0;
        const Cx = a / 2, Cy = 0;

        const projFoot = (Px, Py, Ux, Uy, Vx, Vy) => {
          const dx = Vx - Ux, dy = Vy - Uy;
          const k = ((Px - Ux) * dx + (Py - Uy) * dy) / (dx * dx + dy * dy);
          return { x: Ux + k * dx, y: Uy + k * dy };
        };
        const Dm = projFoot(Bx, By, Ax, Ay, Cx, Cy);
        const Em = projFoot(Cx, Cy, Ax, Ay, Bx, By);
        const deLen = Math.hypot(Dm.x - Em.x, Dm.y - Em.y);

        const A = toScr(Ax, Ay, ox, cy, sc);
        const B = toScr(Bx, By, ox, cy, sc);
        const Cpt = toScr(Cx, Cy, ox, cy, sc);
        const D = toScr(Dm.x, Dm.y, ox, cy, sc);
        const E = toScr(Em.x, Em.y, ox, cy, sc);
        const M = toScr(0, 0, ox, cy, sc);

        dPoly([A, B, Cpt], 'rgba(56, 189, 248, 0.10)', C.cyan, 2.6);
        dLine(B, D, 'rgba(251, 191, 36, 0.7)', 2.0, [5, 4]);
        dLine(Cpt, E, 'rgba(251, 191, 36, 0.7)', 2.0, [5, 4]);
        dLine(D, E, C.red, 3.0);

        const degLabel = isTarget ? 'π/3 (60°)' : Math.abs(degA - 45) < 1 ? 'π/4 (45°)' : Math.abs(degA - 30) < 1 ? 'π/6 (30°)' : `${degA.toFixed(0)}°`;
        dArcAngle(A, B, Cpt, `∠A = ${degLabel}`, C.gold, 26);
        drawDimension(B, Cpt, 30, 'BC = 6', C.cyan);

        if (step >= 1) {
          drawRightAngle(D, A, B, 11, C.gold);
          drawRightAngle(E, A, Cpt, 11, C.gold);
        }

        if (step >= 2) {
          dCircle(M, (a / 2) * sc, C.purple, 'rgba(192, 132, 252, 0.08)', 2.6, [6, 4]);
          dVertex(M, 'M(외접원 중심, R=3)', C.purple, { x: 0, y: -14, align: 'center' });
        }

        if (step >= 3) {
          dPoly([A, D, E], 'rgba(251, 191, 36, 0.22)', C.gold, 2.8, true);
          dBadge((D.x + E.x) / 2, (D.y + E.y) / 2 - 16, `DE = BC cos A = ${deLen.toFixed(2)}`, C.red);
          const badgeTxt = isTarget
            ? '조건 만족 (∠A = π/3): 지름 BC = 6 ➔ R = 3  |  DE = 6 cos(π/3) = 3'
            : `지름 BC = 6 ➔ R = 3 (불변)  |  현재 DE = ${deLen.toFixed(2)} (조건 ∠A = π/3일 때 DE = 3)`;
          dBadge(ox, B.y + 56, badgeTxt, C.gold);
        }

        dVertex(B, 'B', C.white, { x: -12, y: 4, align: 'right' });
        dVertex(Cpt, 'C', C.white, { x: 12, y: 4, align: 'left' });
        dVertex(D, 'D', C.red, { x: 12, y: -4, align: 'left' });
        dVertex(E, 'E', C.red, { x: -12, y: -4, align: 'right' });
        dVertex(A, 'A [상하 드래그]', C.gold, { x: 0, y: -16, align: 'center' }, true, (sPos) => {
          const m = toMath(sPos.x, sPos.y, ox, cy, sc);
          const nextDeg = solveDegAFromHeight(m.y, a, angOffset);
          onSliderInput((nextDeg - 30) / 45);
        });

        setMetric(
          `현재 ∠A = ${degLabel} | 외접원 반지름 R = 3, DE = 6 cos A = ${deLen.toFixed(2)} (조건: ∠A = π/3 ➔ DE = 3)`,
          `현재 ∠A = ${degLabel}, cos A ≈ ${cosA.toFixed(2)} | 선분 DE ≈ ${deLen.toFixed(2)}`
        );
        return;
      }

      // -----------------------------------------------------------------------
      // 🌱 [기본 6] bas-6: 삼각형의 중선의 길이 구하기 (AB=5, AC=7, BC=6, BM=CM=3)
      // [P0-1 수리] 점 D가 중점 M이 아닐 때에도 현재 AD 길이와 중점일 때의 중선 식을 구분 표기
      // -----------------------------------------------------------------------
      if (id === 'bas-6') {
        const sc = u * 1.02;
        const cy = oy + sc * 1.35;
        const c = 5.0, b = 7.0, a = 6.0;
        const cosB = (a * a + c * c - b * b) / (2 * a * c);
        const sinB = Math.sqrt(1 - cosB * cosB);
        const h = c * sinB;

        const Bx = -3.0, By = 0;
        const Cx = 3.0, Cy = 0;
        const Ax = Bx + c * cosB, Ay = h;

        const bd = 1.5 + t * 3.0; // t = 0.50 -> bd = 3.0 (중점 M)
        const cd = a - bd;
        const Dx = Bx + bd, Dy = 0;
        const adLen = Math.hypot(Ax - Dx, Ay - Dy);
        const isMid = Math.abs(bd - 3.0) < 0.08;

        const A = toScr(Ax, Ay, ox, cy, sc);
        const B = toScr(Bx, By, ox, cy, sc);
        const Cpt = toScr(Cx, Cy, ox, cy, sc);
        const D = toScr(Dx, Dy, ox, cy, sc);

        dPoly([A, B, Cpt], 'rgba(56, 189, 248, 0.12)', C.cyan, 2.6);
        dLine(A, D, C.gold, 3.2, [], true);

        dBadge((A.x + B.x) / 2 - 24, (A.y + B.y) / 2 - 8, 'AB = 5', C.green);
        dBadge((A.x + Cpt.x) / 2 + 26, (A.y + Cpt.y) / 2 - 8, 'AC = 7', C.cyan);

        if (step >= 1) {
          drawDimension(B, D, 28, isMid ? 'BM = 3' : `BD = ${bd.toFixed(1)}`, C.green);
          drawDimension(D, Cpt, 28, isMid ? 'CM = 3' : `CD = ${cd.toFixed(1)}`, C.cyan);
        }

        if (step >= 2) {
          dArcAngle(D, A, B, 'θ', C.red, 24);
          dArcAngle(D, Cpt, A, 'π - θ', C.cyan, 30);
          dBadge((A.x + D.x) / 2 + 34, (A.y + D.y) / 2, isMid ? 'AM = 2√7 (≈5.29)' : `AD ≈ ${adLen.toFixed(2)}`, C.gold);
        }

        if (step >= 3) {
          const badgeTxt = isMid
            ? '중점 M 일치 (BM=CM=3): 5² + 7² = 2(AM² + 3²)  ➔  AM = √28 = 2√7'
            : `현재 AD ≈ ${adLen.toFixed(2)} (BD=${bd.toFixed(1)}, CD=${cd.toFixed(1)})  |  중점 M(BM=CM=3)일 때 AM = 2√7 (≈5.29)`;
          dBadge(ox, B.y + 56, badgeTxt, C.gold);
        }

        dVertex(B, 'B', C.white, { x: -12, y: 4, align: 'right' });
        dVertex(Cpt, 'C', C.white, { x: 12, y: 4, align: 'left' });
        dVertex(A, 'A', C.white, { x: 0, y: -15, align: 'center' });
        dVertex(D, isMid ? 'M(중점) [드래그]' : 'D [드래그]', C.gold, { x: 10, y: -14, align: 'left' }, true, (sPos) => {
          const m = toMath(sPos.x, sPos.y, ox, cy, sc);
          const nextBd = Math.max(1.5, Math.min(4.5, m.x - Bx));
          onSliderInput((nextBd - 1.5) / 3.0);
        });

        setMetric(
          `현재 BD = ${bd.toFixed(2)}, CD = ${cd.toFixed(2)} | 선분 길이 = ${adLen.toFixed(2)} (중점 BM=CM=3일 때 AM = 2√7 ≈ 5.29)`,
          `현재 BD = ${bd.toFixed(2)}, CD = ${cd.toFixed(2)} | 선분 AD ≈ ${adLen.toFixed(2)}`
        );
        return;
      }

      // -----------------------------------------------------------------------
      // 🌱 [기본 7] bas-7: 삼각형의 내접원 반지름 r와 접선 길이 (AB=5, BC=6, CA=7)
      // -----------------------------------------------------------------------
      if (id === 'bas-7') {
        const sc = u * 1.02;
        const cy = oy + sc * 1.35;
        const c = 5.0, b = 7.0;
        const a = 4.5 + t * 4.0; // t = 0.375 -> a = 6.0
        const s = (a + b + c) / 2;
        const isTarget = Math.abs(a - 6.0) < 0.08;

        const cosB = (a * a + c * c - b * b) / (2 * a * c);
        const sinB = Math.sqrt(Math.max(0.01, 1 - cosB * cosB));
        const h = c * sinB;

        const Bx = -a / 2, By = 0;
        const Cx = a / 2, Cy = 0;
        const Ax = Bx + c * cosB, Ay = h;

        const Ix = (a * Ax + b * Bx + c * Cx) / (2 * s);
        const Iy = (a * Ay + b * By + c * Cy) / (2 * s);
        const rIn = Iy;

        const projFoot = (Px, Py, Ux, Uy, Vx, Vy) => {
          const dx = Vx - Ux, dy = Vy - Uy;
