        dCircle(O, R * sc, 'rgba(56, 189, 248, 0.65)', 'rgba(56, 189, 248, 0.04)', 2.3);
        dLine(P, B, C.gold, 2.6);
        dLine(P, D, C.green, 2.6);

        if (step >= 1) {
          dPoly([A, B, D, Cpt], 'rgba(56, 189, 248, 0.08)', 'rgba(56, 189, 248, 0.45)', 1.6, false);
          dArcAngle(A, P, D, '∠PAD', C.gold, 20);
          dArcAngle(Cpt, P, B, '∠PCB', C.green, 20);
        }

        if (step >= 2) {
          dPoly([P, A, D], 'rgba(251, 191, 36, 0.16)', C.gold, 2.5);
          dPoly([P, Cpt, B], 'rgba(52, 211, 153, 0.16)', C.green, 2.5);
        }

        if (step >= 3) {
          dBadge(ox, O.y + R * sc + 38, `△PAD ∽ △PCB (AA 닮음)  ➔  PD = 24 / ${pc.toFixed(2)} = ${pd.toFixed(2)},  AD : BC = PA : PC = 3 : ${pc.toFixed(1)}`, C.gold);
        }

        dVertex(P, 'P', C.white, { x: -12, y: 0, align: 'right' });
        dVertex(A, 'A (PA=3)', C.gold, { x: -6, y: -15, align: 'right' });
        dVertex(B, 'B (PB=8)', C.gold, { x: 10, y: -8, align: 'left' });
        dVertex(Cpt, `C (PC=${pc.toFixed(2)})`, C.green, { x: -8, y: 16, align: 'right' });
        dVertex(D, `D (PD=${pd.toFixed(2)}) [드래그]`, C.gold, { x: 10, y: 10, align: 'left' }, true, (sPos) => {
          const m = toMath(sPos.x, sPos.y, ox, oy, sc);
          const ang = (Math.atan2(m.y - Py, m.x - Px) * 180) / Math.PI;
          const clamped = Math.max(-35.0, Math.min(-10.0, ang));
          onSliderInput((Math.abs(clamped) - 10.0) / 25.0);
        });

        setMetric(
          `PA = 3, PB = 8 | 현재 PC = ${pc.toFixed(2)}, PD = ${pd.toFixed(2)} (조건: PC = 4일 때 PD = 6, AD/BC = 3/4)`,
          `PA = 3, PB = 8 | 현재 PC = ${pc.toFixed(2)}, PD = ${pd.toFixed(2)}, AD/BC = ${(3 / pc).toFixed(2)}`
        );
        return;
      }

      // -----------------------------------------------------------------------
      // 🔥 [심화 5] adv-5: 원에 내접하는 정삼각형 ABC와 PA + PC = PB (PA=3, PC=5, AC=7, PB=8)
      // -----------------------------------------------------------------------
      if (id === 'adv-5') {
        const sc = u * 0.85;
        const R = 7 / Math.sqrt(3);
        const getCirclePt = (deg) => {
          const r = (deg * Math.PI) / 180;
          return { x: R * Math.cos(r), y: R * Math.sin(r) };
        };

        const Am = getCirclePt(210);
        const Bm = getCirclePt(90);
        const Cm = getCirclePt(330);
        const degP = -135 + t * 90; // t = 0.3174 -> degP ≈ -106.43° (PA=3, PC=5)
        const Pm = getCirclePt(degP);

        const pa = Math.hypot(Pm.x - Am.x, Pm.y - Am.y);
        const pc = Math.hypot(Pm.x - Cm.x, Pm.y - Cm.y);
        const pb = Math.hypot(Pm.x - Bm.x, Pm.y - Bm.y);

        const uPB = { x: (Bm.x - Pm.x) / pb, y: (Bm.y - Pm.y) / pb };
        const Km = { x: Pm.x + pa * uPB.x, y: Pm.y + pa * uPB.y };

        const O = toScr(0, 0, ox, oy, sc);
        const A = toScr(Am.x, Am.y, ox, oy, sc);
        const B = toScr(Bm.x, Bm.y, ox, oy, sc);
        const Cpt = toScr(Cm.x, Cm.y, ox, oy, sc);
        const P = toScr(Pm.x, Pm.y, ox, oy, sc);
        const K = toScr(Km.x, Km.y, ox, oy, sc);

        dCircle(O, R * sc, 'rgba(56, 189, 248, 0.65)', 'rgba(56, 189, 248, 0.04)', 2.3);
        dPoly([A, B, Cpt], 'rgba(52, 211, 153, 0.12)', C.green, 2.6);
        dLine(P, A, C.cyan, 2.8);
        dLine(P, Cpt, C.cyan, 2.8);
        dLine(P, B, C.gold, 3.2);

        if (step >= 1) {
          dArcAngle(P, Cpt, A, '2π/3', C.cyan, 22);
          dBadge((A.x + Cpt.x) / 2 + 52, A.y - 14, 'AC = 7 (정삼각형 한 변)', C.green);
        }

        if (step >= 2) {
          dPoly([A, P, K], 'rgba(251, 191, 36, 0.24)', C.gold, 2.4, true);
          dVertex(K, `K (PK=PA=${pa.toFixed(1)})`, C.gold, { x: 12, y: 0, align: 'left' });
        }

        if (step >= 3) {
          dPoly([A, B, K], 'rgba(244, 114, 182, 0.18)', C.pink, 2.2);
          dPoly([Cpt, B, P], 'rgba(56, 189, 248, 0.14)', C.cyan, 2.2);
          dBadge(ox, O.y + R * sc + 38, `△ABK ≡ △CBP (SAS 합동)  ➔  PB = PA + PC = ${pa.toFixed(2)} + ${pc.toFixed(2)} = ${pb.toFixed(2)}`, C.gold);
        }

        dVertex(B, 'B(정삼각형 꼭짓점)', C.green, { x: 0, y: -15, align: 'center' });
        dVertex(A, 'A', C.green, { x: -12, y: 4, align: 'right' });
        dVertex(Cpt, 'C', C.green, { x: 12, y: 4, align: 'left' });
        dVertex(P, `P (PA=${pa.toFixed(1)}, PC=${pc.toFixed(1)}) [드래그]`, C.gold, { x: 0, y: 18, align: 'center' }, true, (sPos) => {
          const m = toMath(sPos.x, sPos.y, ox, oy, sc);
          const deg = (Math.atan2(m.y, m.x) * 180) / Math.PI;
          const clamped = Math.max(-135, Math.min(-45, deg));
          onSliderInput((clamped + 135) / 90);
        });

        setMetric(
          `현재 PA = ${pa.toFixed(2)}, PC = ${pc.toFixed(2)} | PB = PA + PC = ${pb.toFixed(2)} (조건: PA=3, PC=5일 때 AC=7, PB=8)`,
          `현재 PA = ${pa.toFixed(2)}, PC = ${pc.toFixed(2)}, PB = ${pb.toFixed(2)}`
        );
        return;
      }

      // -----------------------------------------------------------------------
      // 🔥 [심화 6] adv-6: 원에 내접하는 사각형 ABCD와 보조선 BK (AB=3, BC=5, CD=8, DA=3, AC=7)
      // [P0-3 수리] 가짜 비례 상수(kNorm) 없이 실제 유클리드 외접원 반지름 R = 7/√3 위에서 100% 정확한 거리 계산
      // -----------------------------------------------------------------------
      if (id === 'adv-6') {
        const sc = u * 0.85;
        // △ABC(3, 5, 7, ∠B=2π/3)와 △ADC(8, 3, 7, ∠D=π/3)가 정확히 공유하는 외접원 반지름 R = 7 / √3
        const R = 7 / Math.sqrt(3);
        const getPt = (deg) => {
          const r = (deg * Math.PI) / 180;
          return { x: R * Math.cos(r), y: R * Math.sin(r) };
        };

        // 현 AC = 7을 수평(degA = 150°, degC = 30°)으로 놓고, AB = 3, BC = 5가 되는 정확한 각도 degB
        const degA = 150.0;
        const degC = 30.0;
        const arcAB_deg = (2 * Math.asin((3 * Math.sqrt(3)) / 14) * 180) / Math.PI; // ≈ 43.5735°
        const degB = degA - arcAB_deg; // ≈ 106.4265°

        // t = 0.65일 때 정확히 DA = 3, CD = 8이 되는 각도 degDTarget (= 150° + 43.5735° = 193.5735° ≡ -166.4265°)
        // t = 0.25일 때 대칭점(CD = 5, DA = 8, BD = 7)인 각도 degDSym (= 30° - 66.4265° = -36.4265°)가 되도록 매핑
        const degDTarget = -180.0 + (arcAB_deg - 30.0); // ≈ -166.4265°
        const degD = degDTarget + (0.65 - t) * 325.0;

        const Am = getPt(degA);
        const Bm = getPt(degB);
        const Cm = getPt(degC);
        const Dm = getPt(degD);

        // 가짜 보정 상수 없이 100% 순수 유클리드 거리 계산
        const cdLen = Math.hypot(Dm.x - Cm.x, Dm.y - Cm.y);
        const daLen = Math.hypot(Dm.x - Am.x, Dm.y - Am.y);
        const bdLen = Math.hypot(Dm.x - Bm.x, Dm.y - Bm.y);
        const isTarget = Math.abs(t - 0.65) < 0.025;

        const Km = constructPtolemyPoint(Am, Bm, Cm, Dm);

        const O = toScr(0, 0, ox, oy, sc);
        const A = toScr(Am.x, Am.y, ox, oy, sc);
        const B = toScr(Bm.x, Bm.y, ox, oy, sc);
        const Cpt = toScr(Cm.x, Cm.y, ox, oy, sc);
        const D = toScr(Dm.x, Dm.y, ox, oy, sc);

        dCircle(O, R * sc, 'rgba(56, 189, 248, 0.65)', 'rgba(56, 189, 248, 0.04)', 2.3);
        dPoly([A, B, Cpt, D], 'rgba(52, 211, 153, 0.10)', C.green, 2.5);
        dLine(A, Cpt, C.cyan, 2.6);
        dLine(B, D, C.gold, 2.8);

        dBadge((A.x + B.x) / 2 - 22, (A.y + B.y) / 2 - 10, 'AB = 3', C.green);
        dBadge((B.x + Cpt.x) / 2 + 22, (B.y + Cpt.y) / 2 - 10, 'BC = 5', C.green);
        dBadge((A.x + Cpt.x) / 2 + 32, A.y - 14, 'AC = 7', C.cyan);
        dBadge((Cpt.x + D.x) / 2 + 30, (Cpt.y + D.y) / 2 + 10, isTarget ? 'CD = 8' : `CD ≈ ${cdLen.toFixed(2)}`, C.green);
        dBadge((D.x + A.x) / 2 - 30, (D.y + A.y) / 2 + 10, isTarget ? 'DA = 3' : `DA ≈ ${daLen.toFixed(2)}`, C.green);

        if (step >= 1 && Km) {
          const K = toScr(Km.x, Km.y, ox, oy, sc);
          dLine(B, K, C.purple, 2.8, [5, 4], true);
          dArcAngle(B, A, D, '', C.gold, 22);
          dArcAngle(B, K, Cpt, '∠ABD=∠KBC', C.purple, 28);
          dVertex(K, 'K(AC 위의 점)', C.purple, { x: 0, y: 16, align: 'center' });
        }

        if (step >= 2 && Km) {
          const K = toScr(Km.x, Km.y, ox, oy, sc);
          dPoly([B, K, Cpt], 'rgba(192, 132, 252, 0.18)', C.purple, 2.2);
          dPoly([A, B, D], 'rgba(251, 191, 36, 0.14)', C.gold, 2.2);
        }

        if (step >= 3) {
          const lhsVal = 3 * cdLen + 5 * daLen;
          const bdText = isTarget ? '39/7 (≈5.57)' : bdLen.toFixed(2);
          dBadge(
            ox,
            O.y + R * sc + 38,
            `AB·CD + BC·DA = 3×${cdLen.toFixed(1)} + 5×${daLen.toFixed(1)} = ${lhsVal.toFixed(1)} = 7 × BD  ➔  BD = ${bdText}`,
            C.gold
          );
        }

        dVertex(A, 'A', C.white, { x: -12, y: -4, align: 'right' });
        dVertex(B, 'B', C.white, { x: 0, y: -15, align: 'center' });
        dVertex(Cpt, 'C', C.white, { x: 12, y: -4, align: 'left' });
        dVertex(D, `D (BD=${isTarget ? '39/7' : bdLen.toFixed(2)}) [원주 드래그]`, C.gold, { x: 0, y: 18, align: 'center' }, true, (sPos) => {
          const m = toMath(sPos.x, sPos.y, ox, oy, sc);
          let deg = (Math.atan2(m.y, m.x) * 180) / Math.PI;
          if (deg > 90) deg -= 360;
          const clamped = Math.max(-210, Math.min(15, deg));
          const nextT = 0.65 - (clamped - degDTarget) / 325.0;
          onSliderInput(Math.max(0.05, Math.min(0.95, nextT)));
        });

        setMetric(
          `현재 CD = ${cdLen.toFixed(2)}, DA = ${daLen.toFixed(2)} | 3·CD + 5·DA = ${(3 * cdLen + 5 * daLen).toFixed(1)} = 7·BD ➔ BD = ${bdLen.toFixed(2)} (조건: CD=8, DA=3일 때 BD=39/7)`,
          `AB=3, BC=5, AC=7 | 현재 CD ≈ ${cdLen.toFixed(2)}, DA ≈ ${daLen.toFixed(2)}, 대각선 BD ≈ ${bdLen.toFixed(2)}`
        );
        return;
      }

      // -----------------------------------------------------------------------
      // 🔥 [심화 7] adv-7: 평행사변형의 두 대각선 제곱합 AC² + BD² = 2(AB² + BC²)
      // [P0-1 수리] 3단계 배지에서 현재 슬라이더의 AC, BD 제곱합(=68 불변)과 조건 AC=7 대입 결과를 분리 표기하여 모순 제거
      // -----------------------------------------------------------------------
      if (id === 'adv-7') {
        const sc = u * 0.90;
        const cy = oy + sc * 1.05;
        const ab = 3.0, bc = 5.0;
        const degA = 30 + t * 105; // t = 0.2857 -> degA = 60° (π/3, AC=7, BD=√19)
        const radA = (degA * Math.PI) / 180;
        const isTarget = Math.abs(degA - 60) < 1.2;

        const h = ab * Math.sin(radA);
        const shift = ab * Math.cos(radA);

        const Ax = -2.8, Ay = 0;
        const Dx = Ax + bc, Dy = 0;
        const Bx = Ax + shift, By = h;
        const Cx = Bx + bc, Cy = h;

        const acLen = Math.hypot(Cx - Ax, Cy - Ay);
        const bdLen = Math.hypot(Dx - Bx, Dy - By);

        const A = toScr(Ax, Ay, ox, cy, sc);
        const B = toScr(Bx, By, ox, cy, sc);
        const Cpt = toScr(Cx, Cy, ox, cy, sc);
        const D = toScr(Dx, Dy, ox, cy, sc);

        dPoly([A, B, Cpt, D], 'rgba(52, 211, 153, 0.12)', C.green, 2.6);
        dBadge((A.x + B.x) / 2 - 26, (A.y + B.y) / 2, 'AB = 3', C.green);
        drawDimension(A, D, 26, 'AD = BC = 5', C.green);

        if (step >= 1) {
          dLine(A, Cpt, C.red, 3.0);
          dLine(B, D, C.cyan, 3.0);
          dArcAngle(A, D, B, '∠A = π - B', C.gold, 24);
          dArcAngle(B, A, Cpt, '∠B', C.cyan, 24);
        }

        if (step >= 2) {
          dBadge((A.x + Cpt.x) / 2 - 20, (A.y + Cpt.y) / 2 - 14, isTarget ? 'AC = 7' : `AC ≈ ${acLen.toFixed(2)}`, C.red);
          dBadge((B.x + D.x) / 2 + 28, (B.y + D.y) / 2 - 14, isTarget ? 'BD = √19 (≈4.36)' : `BD ≈ ${bdLen.toFixed(2)}`, C.cyan);
        }

        if (step >= 3) {
          const badgeTxt = isTarget
            ? '조건 만족 (AC = 7): 7² + BD² = 2(3² + 5²) = 68  ➔  BD² = 19  ➔  BD = √19 (≈4.36)'
            : `현재 ${acLen.toFixed(2)}² + ${bdLen.toFixed(2)}² = 68 = 2(3²+5²) (항상 일정)  |  조건 AC = 7일 때 BD = √19`;
          dBadge(ox, A.y + 54, badgeTxt, C.gold);
        }

        dVertex(A, 'A', C.white, { x: -12, y: 6, align: 'right' });
        dVertex(D, 'D', C.white, { x: 12, y: 6, align: 'left' });
        dVertex(Cpt, 'C', C.white, { x: 12, y: -8, align: 'left' });
        dVertex(B, 'B [각도 드래그]', C.gold, { x: -10, y: -14, align: 'right' }, true, (sPos) => {
          const m = toMath(sPos.x, sPos.y, ox, cy, sc);
          const ang = (Math.atan2(Math.max(0.5, m.y - Ay), m.x - Ax) * 180) / Math.PI;
          const clamped = Math.max(30, Math.min(135, ang));
          onSliderInput((clamped - 30) / 105);
        });

        setMetric(
          `현재 AC ≈ ${acLen.toFixed(2)}, BD ≈ ${bdLen.toFixed(2)} | AC² + BD² = ${(acLen * acLen + bdLen * bdLen).toFixed(1)} = 2(3²+5²) = 68 (항상 일정)`,
          `현재 AC ≈ ${acLen.toFixed(2)}, BD ≈ ${bdLen.toFixed(2)} | 제곱의 합 AC² + BD² = ${(acLen * acLen + bdLen * bdLen).toFixed(1)}`
        );
        return;
      }

      // -----------------------------------------------------------------------
      // 🔥 [심화 8] adv-8: 대각선 BD를 평행이동하여 합체 삼각형 △ACE와 넓이 구하기
      // [P1-2 수리] 초기 진입(t=0) 시에는 원래 대각선 BD 위에 놓여 있고, 슬라이더 조작 또는 2단계 이상 진입 시 평행이동 진행
      // -----------------------------------------------------------------------
      if (id === 'adv-8') {
        const sc = u * 0.82;
        const cx = ox - sc * 2.2;
        const cy = oy + sc * 1.1;

        const a = 4.0, b = 3.0;
        const rad = Math.PI / 3;
        const h = b * Math.sin(rad);
        const shift = b * Math.cos(rad);

        const Ax = 0, Ay = 0;
        const Bx = a, By = 0;
        const Dx = shift, Dy = h;
        const Cx = a + shift, Cy = h;
        const Ex = 2 * a, Ey = 0;

        const moveRatio = step === 2 ? state.animT * t : t;
        const mB = toScr(Bx + a * moveRatio, 0, cx, cy, sc);
        const mD = toScr(Dx + a * moveRatio, h, cx, cy, sc);

        const A = toScr(Ax, Ay, cx, cy, sc);
        const B = toScr(Bx, By, cx, cy, sc);
        const Cpt = toScr(Cx, Cy, cx, cy, sc);
        const D = toScr(Dx, Dy, cx, cy, sc);
        const E = toScr(Ex, Ey, cx, cy, sc);

        dPoly([A, B, Cpt, D], 'rgba(52, 211, 153, 0.14)', C.green, 2.6);
        dArcAngle(A, B, D, 'π/3', C.gold, 24);
        dBadge((A.x + D.x) / 2 - 24, (A.y + D.y) / 2 - 6, 'AD = 3', C.green);
        drawDimension(A, B, 26, 'AB = 4', C.green);

        if (step >= 1) {
          dLine(A, Cpt, C.red, 2.8);
          dLine(B, D, 'rgba(56, 189, 248, 0.5)', 2.2, [5, 4]);
        }

        if (moveRatio > 0.01) {
          dPoly([B, mB, mD, D], 'rgba(56, 189, 248, 0.10)', null, 0);
        }
        dLine(mB, mD, C.cyan, 3.2, [], true);

        if (step >= 2 || moveRatio > 0.02) {
          dLine(B, E, C.gold, 2.4, [5, 4]);
          dLine(D, Cpt, C.gold, 2.0, [4, 4]);
          drawDimension(B, E, 26, `이동 거리 = ${(a * moveRatio).toFixed(1)}`, C.cyan);
          dVertex(E, 'E', C.cyan, { x: 12, y: 4, align: 'left' });
        }

        if (step >= 3) {
          dPoly([A, Cpt, E], 'rgba(251, 191, 36, 0.20)', C.gold, 2.8, true);
          drawDimension(A, E, 52, 'AE = AB + BE = 4 + 4 = 8  |  넓이(△ACE) = 넓이(ABCD) = 6√3', C.gold);
        }

        dVertex(A, 'A', C.white, { x: -12, y: 4, align: 'right' });
        dVertex(B, 'B', C.white, { x: -10, y: -14, align: 'right' });
        dVertex(D, 'D', C.white, { x: -10, y: -12, align: 'right' });
        dVertex(Cpt, 'C', C.white, { x: 10, y: -12, align: 'left' });
        dVertex(mB, moveRatio < 0.02 ? 'BD [우측 평행이동 드래그]' : '평행이동 [드래그]', C.gold, { x: 10, y: -15, align: 'left' }, true, (sPos) => {
          const m = toMath(sPos.x, sPos.y, cx, cy, sc);
          const nextT = Math.max(0, Math.min(1, (m.x - Bx) / a));
          onSliderInput(nextT);
        });

        setMetric(
          `대각선 BD 평행이동 ${Math.round(t * 100)}% | BE = DC = 4 ➔ AE = 8, 넓이(△ACE) = 넓이(ABCD) = 6√3 (≈ 10.39)`,
          `대각선 BD 평행이동 ${Math.round(t * 100)}% (이동 거리 = ${(a * moveRatio).toFixed(2)}, 밑변 총길이 = ${(a + a * moveRatio).toFixed(2)})`
        );
        return;
      }
    }

    // =========================================================================
    // 5. UI 컨트롤러 및 애니메이션 루프
    // =========================================================================
    function renderTabs() {
      const bar = document.getElementById('probTabBar');
      const isAdv = curProb().id.startsWith('adv-');
      const indices = PROBLEMS.map((p, i) => ({ p, i }))
        .filter(item => (isAdv ? item.p.id.startsWith('adv-') : item.p.id.startsWith('bas-')))
        .map(item => item.i);

      bar.innerHTML = `
        <div class="problem-nav">
          <div class="problem-groups" role="group" aria-label="문항 모음 선택">
            <button type="button" onclick="selectProblemGroup('bas')" class="group-button ${!isAdv ? 'selected' : ''}" aria-pressed="${!isAdv}">기본 8선 (1~8)</button>
            <button type="button" onclick="selectProblemGroup('adv')" class="group-button ${isAdv ? 'selected' : ''}" aria-pressed="${isAdv}">심화 8선 (1~8)</button>
          </div>
          <div class="problem-picker">
            <button type="button" class="problem-list-toggle" aria-expanded="${problemListOpen}" aria-controls="problemList" onclick="problemListOpen=!problemListOpen;renderTabs()">
              <span class="picker-label">현재 문제</span>
              <strong>${PROBLEMS[state.probIdx].tabLabel}</strong>
              <span class="picker-action">${problemListOpen ? '목록 닫기 ▲' : '문제 주제 보고 고르기 ▼'}</span>
            </button>
            <div id="problemList" class="problem-list" ${problemListOpen ? '' : 'hidden'} role="group" aria-label="${isAdv ? '심화' : '기본'} 문제 목록">
              ${indices.map(idx => `
                <button type="button" onclick="problemListOpen=false;selectProb(${idx})" class="prob-tab problem-item ${idx === state.probIdx ? 'active' : ''}" ${idx === state.probIdx ? 'aria-current="true"' : ''}>
                  ${PROBLEMS[idx].tabLabel}
                </button>
              `).join('')}
            </div>
          </div>
        </div>
      `;
    }

    function selectProblemGroup(group) {
      problemListOpen = true;
      const targetIdx = group === 'adv' ? 8 : 0;
      selectProb(targetIdx);
    }

    function initialSlider(p) {
      return p.initialT !== undefined ? p.initialT : p.defaultT;
    }

    function selectProb(idx) {
      state.probIdx = idx;
      boardPage = 0;
      state.solMode = 'geo';
      if (state.chalkOpen) toggleChalkboard(false);
      const p = curProb();
      state.sliderT = initialSlider(p);
      state.auxStep = 0;
      state.animT = 0;
      state.scale = 1.0;
      state.panX = 0;
      state.panY = 0;
      renderTabs();
      syncAllUI();
    }

    function stepProblem(dir) {
      const next = (state.probIdx + dir + PROBLEMS.length) % PROBLEMS.length;
      selectProb(next);
    }

    // [P1-3 수리] 꺼짐(0단계)일 때는 첫 번째 카드(Step 1)만 대기 표시하고, 전체보기(4단계)일 때만 boardPage = -1로 3개 카드를 모두 펼침
    function setAuxStep(step) {
      state.auxStep = step;
      boardPage = step >= 1 && step <= 3 ? step - 1 : (step === 4 ? -1 : 0);
      state.solMode = 'geo';
      state.animT = 0;
      if (curProb().id === 'adv-8') {
        if (step >= 2 && state.sliderT < 0.1) {
          state.sliderT = curProb().defaultT;
        } else if (step === 0) {
          state.sliderT = 0.0;
        }
      }
      syncAllUI();
    }

    function onSliderInput(val) {
      let num = Math.max(0, Math.min(1, parseFloat(val)));
      const p = curProb();
      if (state.auxStep >= 3) {
        for (const s of p.snaps) {
          if (Math.abs(num - s.t) < 0.025) {
            num = s.t;
            break;
          }
        }
      }
      state.sliderT = num;
      document.getElementById('paramSlider').value = num;
      syncSliderReadout();
      drawScene();
    }

    function setSnapVal(t) {
      state.sliderT = t;
      document.getElementById('paramSlider').value = t;
      syncSliderReadout();
      drawScene();
    }

    function syncSliderReadout() {
      const p = curProb();
      const pct = `${Math.round(state.sliderT * 100)}%`;
      document.getElementById('sliderReadout').textContent = pct;
      const matched = p.snaps.find((s) => Math.abs(s.t - state.sliderT) < 0.03);
      document.getElementById('mobSnapTag').textContent = state.auxStep >= 3 && matched ? matched.label : `조작 ${pct}`;
    }

    function toggleChalkboard(force) {
      state.chalkOpen = typeof force === 'boolean' ? force : !state.chalkOpen;
      const board = document.getElementById('miniChalkboard');
      const txt = document.getElementById('txtChalkToggle');
      board.classList.toggle('hidden', !state.chalkOpen);
      document.body.classList.toggle('mobile-chalk-open', state.chalkOpen);
      txt.textContent = state.chalkOpen ? '📕 소형 풀이 칠판 접기' : '📗 소형 풀이 칠판 꺼내기';

      if (state.chalkOpen && state.auxStep === 0) {
        setAuxStep(1);
      }
      requestAnimationFrame(() => {
        resizeCanvas();
      });
    }

    function setSolMode(mode) {
      if (mode === 'alg' && state.auxStep < 3) return;
      state.solMode = mode;
      boardPage = mode === 'alg' ? 3 : (state.auxStep >= 1 && state.auxStep <= 3 ? state.auxStep - 1 : (state.auxStep === 4 ? -1 : 0));
      const tabGeo = document.getElementById('tabGeo');
      const tabAlg = document.getElementById('tabAlg');
      const boxGeo = document.getElementById('chalkStepsContainer');
      const boxAlg = document.getElementById('chalkAlgContainer');

      if (mode === 'geo') {
        tabGeo.className = 'px-2.5 py-1 rounded-md text-[11.5px] font-black bg-amber-400 text-slate-950 transition';
        tabAlg.className = 'px-2.5 py-1 rounded-md text-[11.5px] font-bold bg-emerald-950 text-emerald-200 border border-emerald-700/70 hover:bg-emerald-900 transition';
        boxGeo.classList.remove('hidden');
        boxAlg.classList.add('hidden');
      } else {
        tabAlg.className = 'px-2.5 py-1 rounded-md text-[11.5px] font-black bg-rose-400 text-slate-950 transition';
        tabGeo.className = 'px-2.5 py-1 rounded-md text-[11.5px] font-bold bg-emerald-950 text-emerald-200 border border-emerald-700/70 hover:bg-emerald-900 transition';
        boxAlg.classList.remove('hidden');
        boxGeo.classList.add('hidden');
      }
      refreshBoardTabs();
    }

    function syncAllUI() {
      const p = curProb();

      document.getElementById('mobBadge').textContent = p.badge;
      document.getElementById('mobTitle').textContent = p.title;
      document.getElementById('mobStatement').innerHTML = renderMathHTML(p.statement);

      document.getElementById('pcBadge').textContent = p.badge;
      document.getElementById('pcUnit').textContent = p.unit;
      document.getElementById('pcTitle').textContent = p.title;
      document.getElementById('pcStatement').innerHTML = renderMathHTML(p.statement);

      for (let i = 0; i <= 4; i++) {
        document.getElementById(`aux-${i}`).classList.toggle('active', i === state.auxStep);
      }
      document.getElementById('auxHintBox').innerHTML = renderMathHTML(p.auxHints[state.auxStep] || p.auxHints[0]);

      document.getElementById('sliderTitle').textContent = p.sliderTitle;
      document.getElementById('paramSlider').value = state.sliderT;
      syncSliderReadout();

      document.getElementById('snapChipBox').innerHTML = (state.auxStep >= 3 ? p.snaps : [])
        .map(
          (s) =>
            `<button type="button" onclick="setSnapVal(${s.t})" class="px-2.5 py-1 rounded border text-[11.5px] font-bold whitespace-nowrap transition ${
              Math.abs(state.sliderT - s.t) < 0.03
                ? 'bg-amber-400 text-slate-950 border-amber-200 font-black'
                : 'bg-emerald-950/90 text-emerald-200 border-emerald-700/70 hover:bg-emerald-800'
            }">${s.label}</button>`
        )
        .join('');

      document.getElementById('chalkAhaText').innerHTML = renderMathHTML(p.aha);
      document.getElementById('chalkStepsContainer').innerHTML = p.steps
        .map((st) => {
          const on = state.auxStep === st.step || state.auxStep === 4;
          return `
            <div onclick="setAuxStep(${st.step})" class="chalk-step-card ${
              on ? 'active' : 'bg-[#05100c]/90 border-emerald-800/80'
            } p-3 rounded-xl border space-y-1">
              <div class="flex items-center justify-between gap-2">
                <span class="text-xs font-black text-amber-300 flex items-center gap-1.5">
                  <i class="fa-solid fa-wand-magic-sparkles"></i> ${st.title}
                </span>
                <span class="text-[10.5px] px-1.5 py-0.5 rounded bg-amber-500/20 text-amber-200 border border-amber-400/40 font-bold">도형 연동</span>
              </div>
              <div class="text-xs text-emerald-50/95 leading-relaxed pl-1">${renderMathHTML(st.desc)}</div>
            </div>
          `;
        })
        .join('');

      document.getElementById('chalkAlgContainer').innerHTML = renderMathHTML(p.alg);
      document.getElementById('chalkAnswerBadge').textContent = p.answer;
      document.getElementById('chalkAnswerBadge').parentElement.hidden = state.auxStep < 3;
      document.getElementById('chalkAhaText').parentElement.hidden = state.auxStep < 3;
      document.getElementById('tabAlg').disabled = state.auxStep < 3;
      document.getElementById('tabAlg').style.opacity = state.auxStep < 3 ? '0.45' : '1';
      refreshBoardTabs();
      drawScene();
    }

    function refreshBoardTabs() {
      const p = curProb();
      document.getElementById('tabGeo').textContent = p.strategyLabel || '🎯 실전 최적 풀이';
      document.getElementById('tabAlg').textContent = '📖 풀이 비교';
      const tabs = document.getElementById('boardTabs');
      tabs.innerHTML =
        [1, 2, 3]
          .map(
            (n, i) =>
              `<button type="button" onclick="boardPage=${i};refreshBoardTabs();setAuxStep(${n})" class="${
                (state.solMode === 'geo' && (boardPage === i || boardPage === -1)) ? 'chosen' : ''
              }">Step ${n}</button>`
          )
          .join('') +
        `<button type="button" ${
          state.auxStep < 3 ? 'disabled title="3단계를 먼저 확인하세요"' : ''
        } onclick="boardPage=3;setSolMode('alg')" class="${boardPage === 3 ? 'chosen' : ''}">풀이 비교</button>`;

      const cards = document.querySelectorAll('#chalkStepsContainer > div');
      cards.forEach((el, i) => {
        el.style.display = state.solMode === 'geo' && (boardPage === i || boardPage === -1) ? '' : 'none';
      });
      if (boardPage === 3) {
        document.getElementById('chalkStepsContainer').classList.add('hidden');
        document.getElementById('chalkAlgContainer').classList.remove('hidden');
      } else if (state.solMode === 'geo') {
        document.getElementById('chalkStepsContainer').classList.remove('hidden');
        document.getElementById('chalkAlgContainer').classList.add('hidden');
      }
    }

    function zoomCanvas(factor) {
      state.scale = Math.max(0.65, Math.min(1.85, state.scale * factor));
      drawScene();
    }

    function resetView() {
      const p = curProb();
      state.scale = 1.0;
      state.panX = 0;
      state.panY = 0;
      state.sliderT = state.auxStep >= 3 ? p.defaultT : initialSlider(p);
      state.animT = 1.0;
      document.getElementById('paramSlider').value = state.sliderT;
      syncSliderReadout();
      drawScene();
    }

    function tickAnimation() {
      if (state.animT < 1.0) {
        state.animT = Math.min(1.0, state.animT + 0.045);
        drawScene();
      }
      requestAnimationFrame(tickAnimation);
    }

    function getLocalPos(clientX, clientY) {
      const rect = canvas.getBoundingClientRect();
      return { x: clientX - rect.left, y: clientY - rect.top };
    }

    function startDrag(clientX, clientY) {
      const pos = getLocalPos(clientX, clientY);
      state.dragging = true;
      state.lastPt = pos;
      for (const h of activeHandles) {
        if (Math.hypot(pos.x - h.sx, pos.y - h.sy) < 24) {
          state.dragMode = h;
          return;
        }
      }
      state.dragMode = 'pan';
    }

    function moveDrag(clientX, clientY) {
      const pos = getLocalPos(clientX, clientY);
      if (!state.dragging) {
        const near = activeHandles.some(h => Math.hypot(pos.x - h.sx, pos.y - h.sy) < 22);
        canvas.style.cursor = near ? 'pointer' : 'grab';
        return;
      }
      if (state.dragMode && state.dragMode !== 'pan' && state.dragMode.onDrag) {
        state.dragMode.onDrag(pos);
        return;
      }
      const dx = pos.x - state.lastPt.x;
      const dy = pos.y - state.lastPt.y;
      state.lastPt = pos;
      state.panX += dx;
      state.panY += dy;
      drawScene();
    }

    function endDrag() {
      state.dragging = false;
      state.dragMode = null;
    }

    canvas.addEventListener('mousedown', (e) => startDrag(e.clientX, e.clientY));
    window.addEventListener('mousemove', (e) => moveDrag(e.clientX, e.clientY));
    window.addEventListener('mouseup', endDrag);

    canvas.addEventListener('touchstart', (e) => {
      if (e.touches.length === 1) startDrag(e.touches[0].clientX, e.touches[0].clientY);
    }, { passive: true });
    canvas.addEventListener('touchmove', (e) => {
      if (e.touches.length === 1 && state.dragging) {
        e.preventDefault();
        moveDrag(e.touches[0].clientX, e.touches[0].clientY);
      }
    }, { passive: false });
    window.addEventListener('touchend', endDrag);

    canvas.addEventListener('wheel', (e) => {
      e.preventDefault();
      zoomCanvas(e.deltaY < 0 ? 1.1 : 0.91);
    }, { passive: false });

    canvas.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === 'ArrowUp') {
        e.preventDefault();
        onSliderInput(state.sliderT + 0.04);
      } else if (e.key === 'ArrowLeft' || e.key === 'ArrowDown') {
        e.preventDefault();
        onSliderInput(state.sliderT - 0.04);
      }
    });

    document.addEventListener('click', (e) => {
      if (problemListOpen && !e.target.closest('.problem-picker') && !e.target.closest('.problem-groups')) {
        problemListOpen = false;
        renderTabs();
      }
    });

    window.addEventListener('DOMContentLoaded', () => {
      renderTabs();
      selectProb(0);
      resizeCanvas();
      requestAnimationFrame(tickAnimation);
    });
  </script>

  <!-- AP Math Playground Mobile Adapter -->
  <script id="ap-mobile-adapter">
    (function () {
      window.APBoardRelHost = window.APBoardRelHost || {
        getMode: () => (typeof state !== 'undefined' ? state.probIdx : 0),
        getScenario: () => (typeof state !== 'undefined' ? state.auxStep : 0)
      };
    })();
  </script>

  <!-- AP Math Playground Touch Adapter -->
  <script id="ap-touch-adapter">
    (function () {
      const el = document.getElementById('geoCanvas');
      if (!el) return;
      el.style.touchAction = 'none';
    })();
  </script>
</body>
