<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AP Math Playground · 도넛 영역 (원환면) 실험실</title>
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style>
    :root {
      --bg: #09090D;
      --surface: #120E18;
      --card: #181220;
      --accent-gold: #D8B77E;
      --accent-emerald: #55CBA3;
      --accent-amethyst: #A78AC8;
      --text: #F5F0E9;
      --text-sub: #BDB8C2;
      --border: rgba(216, 183, 126, 0.18);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Pretendard', sans-serif;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    header {
      height: 60px;
      padding: 0 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      background: rgba(18, 14, 24, 0.9);
      backdrop-filter: blur(12px);
    }
    .header-left { display: flex; align-items: center; gap: 14px; }
    .btn-back {
      padding: 6px 14px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--accent-gold);
      font-size: 13px;
      font-weight: 750;
      text-decoration: none;
      transition: all 0.2s;
    }
    .btn-back:hover { border-color: var(--accent-emerald); color: var(--text); }
    .lab-title { font-size: 16px; font-weight: 850; }
    .lab-meta { font-size: 11px; color: var(--accent-emerald); margin-left: 6px; }
    .layout {
      flex: 1;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 340px;
      overflow: hidden;
    }
    #canvasView {
      width: 100%;
      height: 100%;
      display: block;
      background: radial-gradient(circle at center, #1b1322 0%, #09090D 80%);
    }
    aside {
      background: var(--surface);
      border-left: 1px solid var(--border);
      padding: 22px 20px;
      display: flex;
      flex-direction: column;
      gap: 18px;
      overflow-y: auto;
    }
    .control-block {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
    }
    .control-block label {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      font-weight: 800;
      color: var(--text);
      margin-bottom: 8px;
    }
    .val-chip { color: var(--accent-gold); font-family: monospace; font-size: 14px; }
    input[type=range] { width: 100%; accent-color: var(--accent-emerald); }
    .proof-box {
      background: rgba(9, 9, 13, 0.7);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      font-size: 13px;
      line-height: 1.6;
    }
    .proof-formula {
      font-family: 'Times New Roman', serif;
      font-style: italic;
      font-size: 15px;
      color: var(--accent-gold);
      margin-bottom: 8px;
    }
    .proof-stat {
      display: flex;
      justify-content: space-between;
      font-size: 12.5px;
      margin-bottom: 4px;
      color: var(--text-sub);
    }
    .proof-sum {
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      font-weight: 850;
      color: var(--accent-emerald);
      display: flex;
      justify-content: space-between;
      font-size: 13.5px;
    }
    @media (max-width: 820px) {
      .layout { grid-template-columns: 1fr; grid-template-rows: 1fr auto; }
      aside { height: 260px; border-left: none; border-top: 1px solid var(--border); }
    }
  </style>
</head>
<body>
  <header>
    <div class="header-left">
      <a href="../teacher-hub.html" class="btn-back">← 메인 허브로</a>
      <div>
        <span class="lab-title">도넛 영역 (큰 원 − 작은 원)</span>
        <span class="lab-meta">중1 · 평면도형</span>
      </div>
    </div>
  </header>

  <div class="layout">
    <canvas id="canvasView"></canvas>
    <aside>
      <div class="control-block">
        <label>큰 원 반지름 R <span class="val-chip" id="valR">4.0</span></label>
        <input type="range" id="sliderR" min="2.0" max="6.0" step="0.1" value="4.0">
      </div>

      <div class="control-block">
        <label>작은 원 반지름 r <span class="val-chip" id="valr">2.2</span></label>
        <input type="range" id="sliderSmallR" min="0.5" max="5.0" step="0.1" value="2.2">
      </div>

      <div class="proof-box">
        <div class="proof-formula">S = πR² − πr² = π(R² − r²)</div>
        <div class="proof-stat"><span>큰 원 넓이 (πR²)</span><span id="statBigArea">50.27</span></div>
        <div class="proof-stat"><span>작은 원 넓이 (πr²)</span><span id="statSmallArea">15.21</span></div>
        <div class="proof-sum"><span>도넛 영역 순수 넓이</span><span id="statNetArea">35.06</span></div>
      </div>

      <div class="proof-box" style="font-size: 12.5px; color: var(--text-sub);">
        <strong>원환면 기하의 핵심:</strong><br>
        외경과 내경의 면적 차는 두 원반의 차집합으로 완전히 보존됩니다. 둘레의 합은 <span style="color:var(--accent-gold);">2π(R + r)</span>로 주어집니다.
      </div>
    </aside>
  </div>

  <script>
    const canvas = document.getElementById('canvasView');
    const ctx = canvas.getContext('2d');
    const sliderR = document.getElementById('sliderR');
    const sliderSmallR = document.getElementById('sliderSmallR');
    const valR = document.getElementById('valR');
    const valr = document.getElementById('valr');
    const statBigArea = document.getElementById('statBigArea');
    const statSmallArea = document.getElementById('statSmallArea');
    const statNetArea = document.getElementById('statNetArea');

    function resize() {
      canvas.width = canvas.clientWidth * window.devicePixelRatio;
      canvas.height = canvas.clientHeight * window.devicePixelRatio;
      draw();
    }
    window.addEventListener('resize', resize);

    function update() {
      let R = parseFloat(sliderR.value);
      let r = parseFloat(sliderSmallR.value);
      if (r >= R - 0.2) {
        r = R - 0.2;
        sliderSmallR.value = r.toFixed(1);
      }
      valR.textContent = R.toFixed(1);
      valr.textContent = r.toFixed(1);

      const bigA = Math.PI * R * R;
      const smallA = Math.PI * r * r;
      const netA = bigA - smallA;

      statBigArea.textContent = bigA.toFixed(2);
      statSmallArea.textContent = smallA.toFixed(2);
      statNetArea.textContent = netA.toFixed(2);

      draw();
    }

    sliderR.addEventListener('input', update);
    sliderSmallR.addEventListener('input', update);

    let angle = 0;
    function draw() {
      const w = canvas.width;
      const h = canvas.height;
      ctx.clearRect(0, 0, w, h);

      const cx = w / 2;
      const cy = h / 2;
      const scale = Math.min(w, h) / 16;

      const R = parseFloat(sliderR.value) * scale;
      const r = parseFloat(sliderSmallR.value) * scale;

      // Draw outer circle
      ctx.save();
      ctx.beginPath();
      ctx.arc(cx, cy, R, 0, Math.PI * 2);
      ctx.arc(cx, cy, r, 0, Math.PI * 2, true); // counter-clockwise for cutout
      ctx.closePath();
      ctx.fillStyle = 'rgba(85, 203, 163, 0.22)';
      ctx.fill();
      ctx.restore();

      // Outer border
      ctx.beginPath();
      ctx.arc(cx, cy, R, 0, Math.PI * 2);
      ctx.strokeStyle = '#55CBA3';
      ctx.lineWidth = 2.5 * window.devicePixelRatio;
      ctx.stroke();

      // Inner border
      ctx.beginPath();
      ctx.arc(cx, cy, r, 0, Math.PI * 2);
      ctx.strokeStyle = '#D8B77E';
      ctx.lineWidth = 2 * window.devicePixelRatio;
      ctx.setLineDash([4 * window.devicePixelRatio, 4 * window.devicePixelRatio]);
      ctx.stroke();
      ctx.setLineDash([]);

      // Center mark
      ctx.beginPath();
      ctx.arc(cx, cy, 4 * window.devicePixelRatio, 0, Math.PI * 2);
      ctx.fillStyle = '#F5F0E9';
      ctx.fill();

      // Radius vectors
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.lineTo(cx + R * Math.cos(angle), cy + R * Math.sin(angle));
      ctx.strokeStyle = '#55CBA3';
      ctx.lineWidth = 1.8 * window.devicePixelRatio;
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.lineTo(cx + r * Math.cos(angle + Math.PI / 3), cy + r * Math.sin(angle + Math.PI / 3));
      ctx.strokeStyle = '#D8B77E';
      ctx.lineWidth = 1.8 * window.devicePixelRatio;
      ctx.stroke();

      // Labels
      ctx.font = `${13 * window.devicePixelRatio}px Pretendard`;
      ctx.fillStyle = '#55CBA3';
      ctx.fillText(`R = ${sliderR.value}`, cx + (R / 2) * Math.cos(angle) + 10, cy + (R / 2) * Math.sin(angle) - 10);
      ctx.fillStyle = '#D8B77E';
      ctx.fillText(`r = ${sliderSmallR.value}`, cx + (r / 2) * Math.cos(angle + Math.PI / 3) - 30, cy + (r / 2) * Math.sin(angle + Math.PI / 3) + 15);
    }

    function loop() {
      angle += 0.005;
      draw();
      requestAnimationFrame(loop);
    }

    resize();
    update();
    loop();
  </script>
</body>
</html>
