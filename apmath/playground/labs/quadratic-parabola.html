<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AP Math Playground · 이차함수와 포물선 표준형 실험실</title>
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style>
    :root {
      --bg: #09090D;
      --surface: #120E18;
      --card: #181220;
      --accent-gold: #D8B77E;
      --accent-emerald: #55CBA3;
      --accent-amethyst: #A78AC8;
      --text: #F5F0E9;
      --text-sub: #BDB8C2;
      --border: rgba(216, 183, 126, 0.18);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Pretendard', sans-serif;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    header {
      height: 60px;
      padding: 0 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      background: rgba(18, 14, 24, 0.9);
      backdrop-filter: blur(12px);
    }
    .header-left { display: flex; align-items: center; gap: 14px; }
    .btn-back {
      padding: 6px 14px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--accent-gold);
      font-size: 13px;
      font-weight: 750;
      text-decoration: none;
      transition: all 0.2s;
    }
    .btn-back:hover { border-color: var(--accent-emerald); color: var(--text); }
    .lab-title { font-size: 16px; font-weight: 850; }
    .lab-meta { font-size: 11px; color: var(--accent-emerald); margin-left: 6px; }
    .layout {
      flex: 1;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 340px;
      overflow: hidden;
    }
    #canvasView {
      width: 100%;
      height: 100%;
      display: block;
      background: radial-gradient(circle at center, #1b1322 0%, #09090D 80%);
    }
    aside {
      background: var(--surface);
      border-left: 1px solid var(--border);
      padding: 22px 20px;
      display: flex;
      flex-direction: column;
      gap: 18px;
      overflow-y: auto;
    }
    .control-block {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
    }
    .control-block label {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      font-weight: 800;
      color: var(--text);
      margin-bottom: 8px;
    }
    .val-chip { color: var(--accent-gold); font-family: monospace; font-size: 14px; }
    input[type=range] { width: 100%; accent-color: var(--accent-emerald); }
    .proof-box {
      background: rgba(9, 9, 13, 0.7);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      font-size: 13px;
      line-height: 1.6;
    }
    .proof-formula {
      font-family: 'Times New Roman', serif;
      font-style: italic;
      font-size: 15px;
      color: var(--accent-gold);
      margin-bottom: 8px;
    }
    .proof-stat {
      display: flex;
      justify-content: space-between;
      font-size: 12.5px;
      margin-bottom: 4px;
      color: var(--text-sub);
    }
    .proof-sum {
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      font-weight: 850;
      color: var(--accent-emerald);
      display: flex;
      justify-content: space-between;
      font-size: 13.5px;
    }
    @media (max-width: 820px) {
      .layout { grid-template-columns: 1fr; grid-template-rows: 1fr auto; }
      aside { height: 260px; border-left: none; border-top: 1px solid var(--border); }
    }
  </style>
</head>
<body>
  <header>
    <div class="header-left">
      <a href="../teacher-hub.html" class="btn-back">← 메인 허브로</a>
      <div>
        <span class="lab-title">이차함수와 포물선 표준형</span>
        <span class="lab-meta">중3 · 함수</span>
      </div>
    </div>
  </header>

  <div class="layout">
    <canvas id="canvasView"></canvas>
    <aside>
      <div class="control-block">
        <label>최고차항 계수 a <span class="val-chip" id="valA">0.80</span></label>
        <input type="range" id="sliderA" min="-2.0" max="2.0" step="0.1" value="0.8">
      </div>

      <div class="control-block">
        <label>꼭짓점 x좌표 p (축 이동) <span class="val-chip" id="valP">1.0</span></label>
        <input type="range" id="sliderP" min="-4.0" max="4.0" step="0.5" value="1.0">
      </div>

      <div class="control-block">
        <label>꼭짓점 y좌표 q (높이 이동) <span class="val-chip" id="valQ">-2.0</span></label>
        <input type="range" id="sliderQ" min="-4.0" max="4.0" step="0.5" value="-2.0">
      </div>

      <div class="proof-box">
        <div class="proof-formula" id="formulaDisplay">y = 0.8(x − 1.0)² − 2.0</div>
        <div class="proof-stat"><span>꼭짓점 (p, q)</span><span id="statVertex">(1.0, −2.0)</span></div>
        <div class="proof-stat"><span>대칭축 방정식</span><span id="statAxis">x = 1.0</span></div>
        <div class="proof-stat"><span>판별식 D (교점 개수)</span><span id="statDisc">D &gt; 0 (2개)</span></div>
        <div class="proof-sum"><span>최대값 / 최솟값</span><span id="statExtreme">최솟값 −2.0</span></div>
      </div>

      <div class="proof-box" style="font-size: 12.5px; color: var(--text-sub);">
        <strong>표준형의 직관:</strong><br>
        <span style="color:var(--accent-emerald);">a &gt; 0</span>이면 아래로 볼록(최솟값), <span style="color:var(--accent-amethyst);">a &lt; 0</span>이면 위로 볼록(최댓값). 점 <span style="color:var(--accent-gold);">(p, q)</span>는 곡선의 대칭의 중심이 되는 유일한 극점입니다.
      </div>
    </aside>
  </div>

  <script>
    const canvas = document.getElementById('canvasView');
    const ctx = canvas.getContext('2d');
    const sliderA = document.getElementById('sliderA');
    const sliderP = document.getElementById('sliderP');
    const sliderQ = document.getElementById('sliderQ');
    const valA = document.getElementById('valA');
    const valP = document.getElementById('valP');
    const valQ = document.getElementById('valQ');
    const formulaDisplay = document.getElementById('formulaDisplay');
    const statVertex = document.getElementById('statVertex');
    const statAxis = document.getElementById('statAxis');
    const statDisc = document.getElementById('statDisc');
    const statExtreme = document.getElementById('statExtreme');

    function resize() {
      canvas.width = canvas.clientWidth * window.devicePixelRatio;
      canvas.height = canvas.clientHeight * window.devicePixelRatio;
      draw();
    }
    window.addEventListener('resize', resize);

    function update() {
      let a = parseFloat(sliderA.value);
      if (Math.abs(a) < 0.05) { a = a < 0 ? -0.1 : 0.1; }
      const p = parseFloat(sliderP.value);
      const q = parseFloat(sliderQ.value);

      valA.textContent = a.toFixed(2);
      valP.textContent = p.toFixed(1);
      valQ.textContent = q.toFixed(1);

      const signP = p >= 0 ? `− ${p.toFixed(1)}` : `+ ${Math.abs(p).toFixed(1)}`;
      const signQ = q >= 0 ? `+ ${q.toFixed(1)}` : `− ${Math.abs(q).toFixed(1)}`;
      formulaDisplay.textContent = `y = ${a.toFixed(1)}(x ${signP})² ${signQ}`;

      statVertex.textContent = `(${p.toFixed(1)}, ${q.toFixed(1)})`;
      statAxis.textContent = `x = ${p.toFixed(1)}`;

      // D = -4aq (relative to y=0)
      const D = -4 * a * q;
      if (D > 0.01) statDisc.textContent = `D > 0 (서로 다른 두 교점)`;
      else if (Math.abs(D) <= 0.01) statDisc.textContent = `D = 0 (x축에 접함)`;
      else statDisc.textContent = `D < 0 (x축과 만나지 않음)`;

      statExtreme.textContent = a > 0 ? `최솟값 ${q.toFixed(1)} (x = ${p.toFixed(1)})` : `최댓값 ${q.toFixed(1)} (x = ${p.toFixed(1)})`;

      draw();
    }

    sliderA.addEventListener('input', update);
    sliderP.addEventListener('input', update);
    sliderQ.addEventListener('input', update);

    function draw() {
      const w = canvas.width;
      const h = canvas.height;
      ctx.clearRect(0, 0, w, h);

      const cx = w / 2;
      const cy = h / 2;
      const unit = Math.min(w, h) / 16;

      // Coordinate Grid
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.05)';
      ctx.lineWidth = 1 * window.devicePixelRatio;
      for (let x = -8; x <= 8; x++) {
        ctx.beginPath();
        ctx.moveTo(cx + x * unit, 0); ctx.lineTo(cx + x * unit, h);
        ctx.stroke();
      }
      for (let y = -8; y <= 8; y++) {
        ctx.beginPath();
        ctx.moveTo(0, cy - y * unit); ctx.lineTo(w, cy - y * unit);
        ctx.stroke();
      }

      // Main Axes
      ctx.strokeStyle = '#7E7887';
      ctx.lineWidth = 1.5 * window.devicePixelRatio;
      ctx.beginPath();
      ctx.moveTo(0, cy); ctx.lineTo(w, cy);
      ctx.moveTo(cx, 0); ctx.lineTo(cx, h);
      ctx.stroke();

      let a = parseFloat(sliderA.value);
      if (Math.abs(a) < 0.05) a = a < 0 ? -0.1 : 0.1;
      const p = parseFloat(sliderP.value);
      const q = parseFloat(sliderQ.value);

      // Axis of symmetry x = p (Dashed Gold)
      ctx.save();
      ctx.setLineDash([5 * window.devicePixelRatio, 4 * window.devicePixelRatio]);
      ctx.strokeStyle = '#D8B77E';
      ctx.lineWidth = 1.8 * window.devicePixelRatio;
      ctx.beginPath();
      ctx.moveTo(cx + p * unit, 0);
      ctx.lineTo(cx + p * unit, h);
      ctx.stroke();
      ctx.restore();

      // Parabola Curve (Emerald)
      ctx.strokeStyle = '#55CBA3';
      ctx.lineWidth = 3.5 * window.devicePixelRatio;
      ctx.beginPath();
      let first = true;
      for (let px = -9; px <= 9; px += 0.05) {
        const x = px;
        const y = a * Math.pow(x - p, 2) + q;
        const scrX = cx + x * unit;
        const scrY = cy - y * unit;
        if (first) { ctx.moveTo(scrX, scrY); first = false; }
        else { ctx.lineTo(scrX, scrY); }
      }
      ctx.stroke();

      // Vertex Point
      ctx.beginPath();
      ctx.arc(cx + p * unit, cy - q * unit, 6 * window.devicePixelRatio, 0, Math.PI * 2);
      ctx.fillStyle = '#D8B77E';
      ctx.fill();
      ctx.strokeStyle = '#F5F0E9';
      ctx.lineWidth = 2 * window.devicePixelRatio;
      ctx.stroke();

      // Label
      ctx.font = `bold ${13 * window.devicePixelRatio}px Pretendard`;
      ctx.fillStyle = '#D8B77E';
      ctx.fillText(`꼭짓점 (${p.toFixed(1)}, ${q.toFixed(1)})`, cx + p * unit + 10, cy - q * unit - 10);
    }

    resize();
    update();
  </script>
</body>
</html>
