<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AP Math Playground · 삼각함수 파동과 진폭·주기 실험실</title>
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style>
    :root {
      --bg: #09090D;
      --surface: #120E18;
      --card: #181220;
      --accent-gold: #D8B77E;
      --accent-emerald: #55CBA3;
      --accent-amethyst: #A78AC8;
      --text: #F5F0E9;
      --text-sub: #BDB8C2;
      --border: rgba(216, 183, 126, 0.18);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Pretendard', sans-serif;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    header {
      height: 60px;
      padding: 0 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      background: rgba(18, 14, 24, 0.9);
      backdrop-filter: blur(12px);
    }
    .header-left { display: flex; align-items: center; gap: 14px; }
    .btn-back {
      padding: 6px 14px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--accent-gold);
      font-size: 13px;
      font-weight: 750;
      text-decoration: none;
      transition: all 0.2s;
    }
    .btn-back:hover { border-color: var(--accent-emerald); color: var(--text); }
    .lab-title { font-size: 16px; font-weight: 850; }
    .lab-meta { font-size: 11px; color: var(--accent-emerald); margin-left: 6px; }
    .layout {
      flex: 1;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 340px;
      overflow: hidden;
    }
    #canvasView {
      width: 100%;
      height: 100%;
      display: block;
      background: radial-gradient(circle at center, #1b1322 0%, #09090D 80%);
    }
    aside {
      background: var(--surface);
      border-left: 1px solid var(--border);
      padding: 22px 20px;
      display: flex;
      flex-direction: column;
      gap: 18px;
      overflow-y: auto;
    }
    .control-block {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
    }
    .control-block label {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      font-weight: 800;
      color: var(--text);
      margin-bottom: 8px;
    }
    .val-chip { color: var(--accent-gold); font-family: monospace; font-size: 14px; }
    input[type=range] { width: 100%; accent-color: var(--accent-emerald); }
    .proof-box {
      background: rgba(9, 9, 13, 0.7);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      font-size: 13px;
      line-height: 1.6;
    }
    .proof-formula {
      font-family: 'Times New Roman', serif;
      font-style: italic;
      font-size: 15px;
      color: var(--accent-gold);
      margin-bottom: 8px;
    }
    .proof-stat {
      display: flex;
      justify-content: space-between;
      font-size: 12.5px;
      margin-bottom: 4px;
      color: var(--text-sub);
    }
    .proof-sum {
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      font-weight: 850;
      color: var(--accent-emerald);
      display: flex;
      justify-content: space-between;
      font-size: 13.5px;
    }
    @media (max-width: 820px) {
      .layout { grid-template-columns: 1fr; grid-template-rows: 1fr auto; }
      aside { height: 260px; border-left: none; border-top: 1px solid var(--border); }
    }
  </style>
</head>
<body>
  <header>
    <div class="header-left">
      <a href="../teacher-hub.html" class="btn-back">← 메인 허브로</a>
      <div>
        <span class="lab-title">삼각함수 파동과 진폭·주기·위상</span>
        <span class="lab-meta">수학I · 삼각함수의 그래프</span>
      </div>
    </div>
  </header>

  <div class="layout">
    <canvas id="canvasView"></canvas>
    <aside>
      <div class="control-block">
        <label>진폭 A <span class="val-chip" id="valA">1.50</span></label>
        <input type="range" id="sliderA" min="0.5" max="2.5" step="0.1" value="1.5">
      </div>

      <div class="control-block">
        <label>주기 결정 인자 B <span class="val-chip" id="valB">1.0</span></label>
        <input type="range" id="sliderB" min="0.5" max="3.0" step="0.25" value="1.0">
      </div>

      <div class="control-block">
        <label>위상 이동 C <span class="val-chip" id="valC">0.00</span></label>
        <input type="range" id="sliderC" min="-3.14" max="3.14" step="0.1" value="0">
      </div>

      <div class="proof-box">
        <div class="proof-formula" id="formulaDisplay">y = 1.5 sin(1.0x)</div>
        <div class="proof-stat"><span>진폭 (Amplitude)</span><span id="statAmp">1.50</span></div>
        <div class="proof-stat"><span>주기 T = 2π / B</span><span id="statPeriod">6.28 (2π)</span></div>
        <div class="proof-stat"><span>위상 이동량 (C / B)</span><span id="statPhase">0.00</span></div>
        <div class="proof-sum"><span>치역 범위 [−A, +A]</span><span id="statRange">[−1.50, +1.50]</span></div>
      </div>

      <div class="proof-box" style="font-size: 12.5px; color: var(--text-sub);">
        <strong>파동 변환의 원리:</strong><br>
        <span style="color:var(--accent-emerald);">A</span>는 파동의 수직 진폭을, <span style="color:var(--accent-gold);">B</span>는 주기를 압축/확장하며, <span style="color:var(--accent-amethyst);">C</span>는 x축 방향의 평행이동(위상 지연/선행)을 나타냅니다.
      </div>
    </aside>
  </div>

  <script>
    const canvas = document.getElementById('canvasView');
    const ctx = canvas.getContext('2d');
    const sliderA = document.getElementById('sliderA');
    const sliderB = document.getElementById('sliderB');
    const sliderC = document.getElementById('sliderC');
    const valA = document.getElementById('valA');
    const valB = document.getElementById('valB');
    const valC = document.getElementById('valC');
    const formulaDisplay = document.getElementById('formulaDisplay');
    const statAmp = document.getElementById('statAmp');
    const statPeriod = document.getElementById('statPeriod');
    const statPhase = document.getElementById('statPhase');
    const statRange = document.getElementById('statRange');

    let waveOffset = 0;

    function resize() {
      canvas.width = canvas.clientWidth * window.devicePixelRatio;
      canvas.height = canvas.clientHeight * window.devicePixelRatio;
      draw();
    }
    window.addEventListener('resize', resize);

    function update() {
      const A = parseFloat(sliderA.value);
      const B = parseFloat(sliderB.value);
      const C = parseFloat(sliderC.value);

      valA.textContent = A.toFixed(2);
      valB.textContent = B.toFixed(2);
      valC.textContent = C.toFixed(2);

      const signC = C >= 0 ? `− ${C.toFixed(2)}` : `+ ${Math.abs(C).toFixed(2)}`;
      formulaDisplay.textContent = `y = ${A.toFixed(1)} sin(${B.toFixed(1)}x ${C !== 0 ? signC : ''})`;

      statAmp.textContent = A.toFixed(2);
      const period = (2 * Math.PI) / B;
      statPeriod.textContent = `${period.toFixed(2)} (${(2/B).toFixed(2)}π)`;
      statPhase.textContent = (C / B).toFixed(2);
      statRange.textContent = `[−${A.toFixed(2)}, +${A.toFixed(2)}]`;

      draw();
    }

    [sliderA, sliderB, sliderC].forEach(s => s.addEventListener('input', update));

    function draw() {
      const w = canvas.width;
      const h = canvas.height;
      ctx.clearRect(0, 0, w, h);

      const cx = w / 2;
      const cy = h / 2;
      const unitX = w / 22;
      const unitY = h / 8;

      const A = parseFloat(sliderA.value);
      const B = parseFloat(sliderB.value);
      const C = parseFloat(sliderC.value);

      // Axes
      ctx.strokeStyle = '#7E7887';
      ctx.lineWidth = 1.5 * window.devicePixelRatio;
      ctx.beginPath();
      ctx.moveTo(0, cy); ctx.lineTo(w, cy);
      ctx.moveTo(cx, 0); ctx.lineTo(cx, h);
      ctx.stroke();

      // Amplitude boundary lines (Dashed Amethyst)
      ctx.save();
      ctx.setLineDash([4 * window.devicePixelRatio, 4 * window.devicePixelRatio]);
      ctx.strokeStyle = 'rgba(167, 138, 200, 0.4)';
      ctx.lineWidth = 1.5 * window.devicePixelRatio;
      ctx.beginPath();
      ctx.moveTo(0, cy - A * unitY); ctx.lineTo(w, cy - A * unitY);
      ctx.moveTo(0, cy + A * unitY); ctx.lineTo(w, cy + A * unitY);
      ctx.stroke();
      ctx.restore();

      // Baseline sine curve y = sin x (Dashed Gold)
      ctx.save();
      ctx.setLineDash([3 * window.devicePixelRatio, 3 * window.devicePixelRatio]);
      ctx.strokeStyle = 'rgba(216, 183, 126, 0.4)';
      ctx.lineWidth = 1.5 * window.devicePixelRatio;
      ctx.beginPath();
      let firstBase = true;
      for (let px = -11; px <= 11; px += 0.05) {
        const x = px;
        const y = Math.sin(x);
        const scrX = cx + x * unitX;
        const scrY = cy - y * unitY;
        if (firstBase) { ctx.moveTo(scrX, scrY); firstBase = false; }
        else ctx.lineTo(scrX, scrY);
      }
      ctx.stroke();
      ctx.restore();

      // Actual transformed wave y = A sin(Bx - C + waveOffset) (Emerald)
      ctx.strokeStyle = '#55CBA3';
      ctx.lineWidth = 3.5 * window.devicePixelRatio;
      ctx.beginPath();
      let first = true;
      for (let px = -11; px <= 11; px += 0.04) {
        const x = px;
        const y = A * Math.sin(B * x - C + waveOffset);
        const scrX = cx + x * unitX;
        const scrY = cy - y * unitY;
        if (first) { ctx.moveTo(scrX, scrY); first = false; }
        else ctx.lineTo(scrX, scrY);
      }
      ctx.stroke();
    }

    function loop() {
      waveOffset += 0.015;
      draw();
      requestAnimationFrame(loop);
    }

    resize();
    update();
    loop();
  </script>
</body>
</html>
