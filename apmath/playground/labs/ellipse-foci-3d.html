<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AP Math Playground · 타원의 두 초점과 궤도 실험실</title>
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style>
    :root {
      --bg: #09090D;
      --surface: #120E18;
      --card: #181220;
      --accent-gold: #D8B77E;
      --accent-emerald: #55CBA3;
      --accent-amethyst: #A78AC8;
      --text: #F5F0E9;
      --text-sub: #BDB8C2;
      --border: rgba(216, 183, 126, 0.18);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Pretendard', sans-serif;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    header {
      height: 60px;
      padding: 0 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      background: rgba(18, 14, 24, 0.9);
      backdrop-filter: blur(12px);
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .btn-back {
      padding: 6px 14px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--accent-gold);
      font-size: 13px;
      font-weight: 750;
      text-decoration: none;
      transition: all 0.2s;
    }
    .btn-back:hover {
      border-color: var(--accent-emerald);
      color: var(--text);
    }
    .lab-title {
      font-size: 16px;
      font-weight: 850;
    }
    .lab-meta {
      font-size: 11px;
      color: var(--accent-emerald);
      margin-left: 6px;
    }
    .layout {
      flex: 1;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 340px;
      overflow: hidden;
    }
    #canvas3d {
      width: 100%;
      height: 100%;
      display: block;
      cursor: grab;
    }
    #canvas3d:active { cursor: grabbing; }
    aside {
      background: var(--surface);
      border-left: 1px solid var(--border);
      padding: 22px 20px;
      display: flex;
      flex-direction: column;
      gap: 18px;
      overflow-y: auto;
    }
    .control-block {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
    }
    .control-block label {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      font-weight: 800;
      color: var(--text);
      margin-bottom: 8px;
    }
    .val-chip {
      color: var(--accent-gold);
      font-family: monospace;
    }
    input[type=range] {
      width: 100%;
      accent-color: var(--accent-emerald);
    }
    .proof-box {
      background: rgba(9, 9, 13, 0.7);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      font-size: 13px;
      line-height: 1.6;
    }
    .proof-formula {
      font-family: 'Times New Roman', serif;
      font-style: italic;
      font-size: 15px;
      color: var(--accent-gold);
      margin-bottom: 8px;
    }
    .proof-stat {
      display: flex;
      justify-content: space-between;
      font-size: 12.5px;
      margin-bottom: 4px;
      color: var(--text-sub);
    }
    .proof-sum {
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      font-weight: 850;
      color: var(--accent-emerald);
      display: flex;
      justify-content: space-between;
      font-size: 13.5px;
    }
    @media (max-width: 820px) {
      .layout { grid-template-columns: 1fr; grid-template-rows: 1fr auto; }
      aside { height: 260px; border-left: none; border-top: 1px solid var(--border); }
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "../universe/vendor/three.module.js",
      "three/addons/controls/OrbitControls.js": "../universe/vendor/OrbitControls.js"
    }
  }
  </script>
</head>
<body>
  <header>
    <div class="header-left">
      <a class="btn-back" href="../teacher-hub.html">← 실험실 허브</a>
      <div>
        <span class="lab-title">타원의 두 초점과 거리의 합</span>
        <span class="lab-meta">고등 기하 · 3D 인터랙티브</span>
      </div>
    </div>
    <div style="font-size: 12px; color: var(--accent-gold);">마우스 드래그로 360° 회전 및 휠 줌</div>
  </header>

  <div class="layout">
    <canvas id="canvas3d"></canvas>

    <aside>
      <div class="control-block">
        <label>장반경 a <span class="val-chip" id="valA">6.0</span></label>
        <input id="sliderA" type="range" min="4" max="9" step="0.5" value="6">
      </div>

      <div class="control-block">
        <label>단반경 b <span class="val-chip" id="valB">3.6</span></label>
        <input id="sliderB" type="range" min="2" max="5.5" step="0.2" value="3.6">
      </div>

      <div class="control-block">
        <label>동적 점 P 위치 (매개변수 t) <span class="val-chip" id="valT">0.8 rad</span></label>
        <input id="sliderT" type="range" min="0" max="6.28" step="0.05" value="0.8">
      </div>

      <div class="proof-box">
        <div class="proof-formula">|PF₁| + |PF₂| = 2a (일정)</div>
        <div class="proof-stat"><span>초점 거리 c = √(a² - b²)</span><span class="val-chip" id="statC">4.80</span></div>
        <div class="proof-stat"><span>이심률 e = c / a</span><span class="val-chip" id="statE">0.80</span></div>
        <div class="proof-stat"><span>|PF₁| (초점 1까지 거리)</span><span class="val-chip" id="statD1">7.52</span></div>
        <div class="proof-stat"><span>|PF₂| (초점 2까지 거리)</span><span class="val-chip" id="statD2">4.48</span></div>
        <div class="proof-sum">
          <span>거리의 합 (|PF₁| + |PF₂|)</span>
          <span id="statSum">12.00 (= 2a)</span>
        </div>
      </div>
    </aside>
  </div>

  <script type="module">
    import * as THREE from '../universe/vendor/three.module.js';
    import { OrbitControls } from '../universe/vendor/OrbitControls.js';

    const canvas = document.getElementById('canvas3d');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(canvas.clientWidth, canvas.clientHeight);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x09090D);

    const camera = new THREE.PerspectiveCamera(45, canvas.clientWidth / canvas.clientHeight, 0.1, 200);
    camera.position.set(0, 18, 22);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;

    // Lights
    scene.add(new THREE.AmbientLight(0x241727, 2.0));
    const dir = new THREE.DirectionalLight(0xF5F0E9, 2.0);
    dir.position.set(10, 20, 15);
    scene.add(dir);

    // State
    let a = 6.0;
    let b = 3.6;
    let t = 0.8;

    // Dynamic Meshes
    let tubeMesh = null;
    const fociGroup = new THREE.Group();
    scene.add(fociGroup);

    const pointP = new THREE.Mesh(new THREE.SphereGeometry(0.24, 16, 16), new THREE.MeshBasicMaterial({ color: 0xF5F0E9 }));
    scene.add(pointP);

    const stringGeo = new THREE.BufferGeometry();
    stringGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(6 * 3), 3));
    const stringLines = new THREE.LineSegments(stringGeo, new THREE.LineBasicMaterial({ color: 0xD8B77E, linewidth: 2 }));
    scene.add(stringLines);

    function rebuildEllipse() {
      if (tubeMesh) {
        scene.remove(tubeMesh);
        tubeMesh.geometry.dispose();
      }
      const pts = [];
      for (let i = 0; i <= 128; i++) {
        const theta = (i / 128) * Math.PI * 2;
        pts.push(new THREE.Vector3(a * Math.cos(theta), 0, b * Math.sin(theta)));
      }
      const curve = new THREE.CatmullRomCurve3(pts, true);
      const geo = new THREE.TubeGeometry(curve, 128, 0.08, 8, true);
      const mat = new THREE.MeshStandardMaterial({ color: 0x55CBA3, emissive: 0x1E5944, roughness: 0.2 });
      tubeMesh = new THREE.Mesh(geo, mat);
      scene.add(tubeMesh);

      // Foci
      fociGroup.clear();
      const c = Math.sqrt(Math.max(0, a * a - b * b));
      const fMat = new THREE.MeshBasicMaterial({ color: 0xA78AC8 });
      const fGeo = new THREE.SphereGeometry(0.22, 16, 16);
      const f1 = new THREE.Mesh(fGeo, fMat);
      f1.position.set(-c, 0, 0);
      const f2 = new THREE.Mesh(fGeo, fMat);
      f2.position.set(c, 0, 0);
      fociGroup.add(f1);
      fociGroup.add(f2);
    }

    function updatePointAndProof() {
      const c = Math.sqrt(Math.max(0, a * a - b * b));
      const px = a * Math.cos(t);
      const pz = b * Math.sin(t);
      pointP.position.set(px, 0, pz);

      const d1 = Math.hypot(px - (-c), pz);
      const d2 = Math.hypot(px - c, pz);

      // Update lines F1->P and F2->P
      const pos = stringGeo.attributes.position.array;
      pos[0] = -c; pos[1] = 0; pos[2] = 0;
      pos[3] = px; pos[4] = 0; pos[5] = pz;
      pos[6] = c; pos[7] = 0; pos[8] = 0;
      pos[9] = px; pos[10] = 0; pos[11] = pz;
      stringGeo.attributes.position.needsUpdate = true;

      // Update UI readouts
      document.getElementById('valA').textContent = a.toFixed(1);
      document.getElementById('valB').textContent = b.toFixed(1);
      document.getElementById('valT').textContent = t.toFixed(2) + ' rad';
      document.getElementById('statC').textContent = c.toFixed(2);
      document.getElementById('statE').textContent = (c / a).toFixed(2);
      document.getElementById('statD1').textContent = d1.toFixed(2);
      document.getElementById('statD2').textContent = d2.toFixed(2);
      document.getElementById('statSum').textContent = (d1 + d2).toFixed(2) + ` (= ${(2*a).toFixed(2)})`;
    }

    // Sliders
    document.getElementById('sliderA').addEventListener('input', (e) => {
      a = parseFloat(e.target.value);
      if (b >= a) { b = a - 0.5; document.getElementById('sliderB').value = b; }
      rebuildEllipse();
      updatePointAndProof();
    });
    document.getElementById('sliderB').addEventListener('input', (e) => {
      b = parseFloat(e.target.value);
      if (b >= a) { b = a - 0.5; e.target.value = b; }
      rebuildEllipse();
      updatePointAndProof();
    });
    document.getElementById('sliderT').addEventListener('input', (e) => {
      t = parseFloat(e.target.value);
      updatePointAndProof();
    });

    window.addEventListener('resize', () => {
      camera.aspect = canvas.clientWidth / canvas.clientHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(canvas.clientWidth, canvas.clientHeight);
    });

    rebuildEllipse();
    updatePointAndProof();

    function renderLoop() {
      requestAnimationFrame(renderLoop);
      controls.update();
      renderer.render(scene, camera);
    }
    renderLoop();
  </script>
</body>
</html>
