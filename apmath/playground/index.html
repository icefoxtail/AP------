<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#09090D">
  <title>AP MATH UNIVERSE · 수학의 우주를 탐험하다</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Cpolygon points='24,4 44,16 44,36 24,44 4,36 4,16' fill='none' stroke='%2355CBA3' stroke-width='3'/%3E%3Cellipse cx='24' cy='24' rx='16' ry='8' fill='none' stroke='%23D8B77E' stroke-width='2' stroke-dasharray='3 2'/%3E%3Ccircle cx='18' cy='24' r='2' fill='%23A78AC8'/%3E%3Ccircle cx='30' cy='24' r='2' fill='%23A78AC8'/%3E%3C/svg%3E" type="image/svg+xml">
  <link rel="stylesheet" href="./universe/universe.css">
  <script type="importmap">
  {
    "imports": {
      "three": "./universe/vendor/three.module.js",
      "three/addons/controls/OrbitControls.js": "./universe/vendor/OrbitControls.js"
    }
  }
  </script>
  <link rel="stylesheet" href="../css/student-navigation.css?v=2026.11.11.4">
  <script defer src="../js/student-navigation.js?v=2026.11.11.4" data-student-nav-active="labs" data-student-nav-context-only="true"></script>
</head>
<body>
  <!-- 3D Cosmic Space Canvas -->
  <div class="cosmic-gradient-sky"></div>
  <canvas id="space" tabindex="0" aria-label="3차원 수학 우주 공간" aria-describedby="spaceInstructions"></canvas>
  <div class="cosmic-vignette"></div>

  <!-- Warp Curtain for Cinematic Entrance -->
  <div class="warp-curtain" id="warpCurtain" aria-hidden="true"></div>

  <!-- Universe UI Overlay -->
  <div class="universe-ui" id="universeUi">
    <!-- Top Navigation Header -->
    <header class="top-nav">
      <a class="brand-sigil" href="./index.html" aria-label="AP Math Universe 홈">
        <div class="sigil-glyph">Ω</div>
        <div class="brand-text-wrap">
          <span class="brand-name">AP Math<span class="brand-universe"> Universe</span></span>
          <span class="brand-sub">도형·함수 시각화 실험실</span>
        </div>
      </a>

      <a class="universe-portal-link" href="../student/" aria-label="학생 포털로 돌아가기">
        <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 5-7 7 7 7M5 12h14"/></svg>
        <span>학생 포털</span>
      </a>

      <div class="top-controls">
        <button class="glass-btn" id="btnToggleHud" type="button" aria-label="우주 감상 모드 전환" title="화면의 글자를 숨기고 우주만 감상합니다">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          <span id="hudBtnText">우주 감상</span>
        </button>
        <button class="glass-btn" id="btnToggleMotion" type="button" aria-label="천체 움직임 일시정지·재생" title="천체의 공전 및 유영 모션을 일시정지합니다">
          <svg id="motionIcon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
          <span id="motionBtnText">모션 정지</span>
        </button>
        <button class="glass-btn nav-enter" id="btnEnterLab" type="button" aria-label="실험실 입장 — 학년·과목별 실험실 보기" title="학년·과목별 실험실로 이동">
          <svg class="nav-enter-spark" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 13.8 9.2 20 11l-6.2 1.8L12 19l-1.8-6.2L4 11l6.2-1.8L12 3Z"/><path d="m19 18 .4 1.6L21 20l-1.6.4L19 22l-.4-1.6L17 20l1.6-.4L19 18Z"/></svg>
          <span>실험실 입장</span>
          <svg class="nav-enter-arrow" width="15" height="15" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14m-7-7 7 7-7 7"/></svg>
        </button>
      </div>
    </header>

    <div class="projected-labels" id="projectedLabels" role="group" aria-label="공간의 수학 개념"></div>

    <!-- The exploration controls leave the middle of the 3D view open. -->
    <footer class="bottom-bar">
      <section class="explore-panel" id="explorePanel" aria-label="수학 우주 탐험 도구" hidden>
        <div class="explore-navigation">
          <div class="explore-heading">
            <p class="explore-breadcrumb" id="exploreBreadcrumb">전체 우주</p>
            <p class="explore-subtitle" id="exploreSubtitle"></p>
          </div>
          <div class="explore-actions">
            <button class="glass-btn" id="btnExploreBack" data-universe-action="back" type="button">
              <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 5-7 7 7 7M5 12h14"/></svg>
              <span id="exploreBackText">뒤로</span>
            </button>
            <button class="glass-btn" id="btnUniverseHome" data-universe-action="home" type="button">전체 우주</button>
          </div>
        </div>
        <div class="concept-controls" id="conceptControls" hidden>
          <button class="glass-btn" id="btnReplayConcept" data-universe-action="replay" type="button" aria-label="수학 움직임 처음부터 다시 보기">
            <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10a9 9 0 1 1 1 8M3 4v6h6"/></svg>
            <span>다시 보기</span>
          </button>
          <button class="glass-btn" id="btnPauseConcept" data-universe-action="pause" type="button" aria-label="수학 움직임 일시정지">
            <svg id="conceptPlaybackIcon" width="14" height="14" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 5v14M16 5v14"/></svg>
            <span id="conceptPlaybackText">일시정지</span>
          </button>
          <label class="concept-scrubber" for="conceptSeek">
            <span class="sr-only">수학 움직임 진행 위치</span>
            <input id="conceptSeek" type="range" min="0" max="8" step="0.05" value="0" aria-valuetext="0초 / 8초">
          </label>
          <output class="concept-time" id="conceptTime" for="conceptSeek" aria-hidden="true">0.0 / 8초</output>
        </div>
      </section>

      <div class="universe-navigation">
        <div class="bottom-hint">
          <span class="hint-dot"></span>
          <span id="exploreHint">도형을 선택해 가까이 탐험해 보세요</span>
        </div>

      <nav class="celestial-selector-pills" aria-label="수학 천체 바로가기">
        <button class="celestial-pill" type="button" data-celestial="polyhedra">💎 정다면체</button>
        <button class="celestial-pill" type="button" data-celestial="ellipse">🪐 타원</button>
        <button class="celestial-pill" type="button" data-celestial="parabola">📡 포물선</button>
        <button class="celestial-pill" type="button" data-celestial="hyperbola">⚡ 쌍곡선</button>
        <button class="celestial-pill" type="button" data-celestial="mobius">♾️ 뫼비우스</button>
        <button class="celestial-pill" type="button" data-celestial="golden-spiral">🌀 황금 나선</button>
        <button class="celestial-pill" type="button" data-celestial="hyperboloid">⏳ 일엽쌍곡면</button>
        <button class="celestial-pill" type="button" data-celestial="torus">🍩 비야르소 원</button>
        <button class="celestial-pill" type="button" data-celestial="circle-sector">🔘 원과 부채꼴</button>
        <button class="celestial-pill" type="button" data-celestial="solid">🌐 공간도형</button>
        <button class="celestial-pill" type="button" data-celestial="vector">↗️ 벡터</button>
        <button class="celestial-pill" type="button" data-celestial="calculus">📈 미적분</button>
      </nav>
      </div>
    </footer>
    <p class="sr-only" id="spaceInstructions">드래그하여 둘러보고 휠이나 두 손가락으로 확대합니다. 도형 또는 이름을 선택하면 가까이 탐험합니다. 키보드로는 아래 천체 버튼과 공간의 이름 버튼을 이용하세요. Escape 키로 한 단계 돌아옵니다.</p>
    <p class="sr-only" id="exploreStatus" role="status" aria-live="polite" aria-atomic="true"></p>
  </div>

  <button class="glass-btn restore-hud" id="btnRestoreHud" type="button" aria-label="우주 탐험 정보 다시 보기" hidden>
    <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
    <span>정보 보기</span>
  </button>

  <!-- WebGL Fallback Screen (Graceful Degradation) -->
  <noscript>
    <div class="webgl-fallback">
      <h2>3D 하드웨어 가속 필요</h2>
      <p>AP Math Universe 3D 엔진은 JavaScript 및 WebGL 2.0 지원 브라우저에서 실행됩니다.</p>
      <a class="cta-entrance" href="./next/index.html">메인 실험실 허브로 직접 입장</a>
      <a class="universe-portal-link" href="../student/">학생 포털로 돌아가기</a>
    </div>
  </noscript>

  <script type="module">
    import { createMathUniverse } from './universe/scene.js';

    const canvas = document.getElementById('space');
    const warpCurtain = document.getElementById('warpCurtain');
    const universeUi = document.getElementById('universeUi');
    const btnEnterLab = document.getElementById('btnEnterLab');
    const btnToggleHud = document.getElementById('btnToggleHud');
    const btnRestoreHud = document.getElementById('btnRestoreHud');
    const btnToggleMotion = document.getElementById('btnToggleMotion');
    const motionBtnText = document.getElementById('motionBtnText');
    const motionIcon = document.getElementById('motionIcon');
    const explorePanel = document.getElementById('explorePanel');
    const exploreBreadcrumb = document.getElementById('exploreBreadcrumb');
    const exploreSubtitle = document.getElementById('exploreSubtitle');
    const exploreStatus = document.getElementById('exploreStatus');
    const exploreHint = document.getElementById('exploreHint');
    const btnExploreBack = document.getElementById('btnExploreBack');
    const btnUniverseHome = document.getElementById('btnUniverseHome');
    const exploreBackText = document.getElementById('exploreBackText');
    const projectedLabels = document.getElementById('projectedLabels');
    const conceptControls = document.getElementById('conceptControls');
    const btnReplayConcept = document.getElementById('btnReplayConcept');
    const btnPauseConcept = document.getElementById('btnPauseConcept');
    const conceptPlaybackText = document.getElementById('conceptPlaybackText');
    const conceptPlaybackIcon = document.getElementById('conceptPlaybackIcon');
    const conceptSeek = document.getElementById('conceptSeek');
    const conceptTime = document.getElementById('conceptTime');
    const celestialPills = Array.from(document.querySelectorAll('.celestial-pill'));
    const celestialNames = new Map(celestialPills.map(pill => [pill.dataset.celestial, pill.textContent.replace(/^\S+\s/, '')]));
    const labelButtons = new Map();
    const labelSizes = new Map();
    const consumedPointers = new Set();
    let labelMeasurementFrame = null;
    let universe = null;
    let bootstrapping = true;
    let restoringHistory = false;
    let hudVisible = true;
    let seeking = false;
    let lastPlaybackState = null;
    let state = { mode: 'universe', celestialId: null, conceptId: null, concepts: [], motionPlaying: true, mathPlaying: false, mathTime: 0, mathDuration: 8 };

    // Preserve the student navigation contract independently of exploration URLs.
    try { sessionStorage.setItem('apl:viaUniverse', '1'); } catch (_) {}
    function getHubHref() {
      const hubPath = './next/index.html' + (/^#[a-z0-9]+$/.test(location.hash) ? location.hash : '');
      return window.StudentPortalNavigation?.withContext(hubPath) || hubPath;
    }
    function readRoute() {
      const params = new URLSearchParams(location.search);
      const requested = params.get('celestial');
      const id = requested === 'circle' ? 'circle-sector' : requested;
      return { celestialId: celestialNames.has(id) ? id : null, conceptId: celestialNames.has(id) ? params.get('concept') : null };
    }
    // Capture the entry route before createMathUniverse can synchronously report its initial state.
    const initialRoute = readRoute();
    const exposeTestApi = new URLSearchParams(location.search).get('universeTest') === '1';
    function routeDepth(value) { return value.mode === 'concept' ? 2 : value.mode === 'universe' ? 0 : 1; }
    function sameRoute(a, b) { return (a.celestialId || null) === (b.celestialId || null) && (a.conceptId || null) === (b.conceptId || null); }
    function writeRoute(value, requested, previous, force = false) {
      if (bootstrapping || restoringHistory || requested === 'none') return;
      if (!force && sameRoute(value, previous)) return;
      const url = new URL(location.href);
      if (value.celestialId && value.mode !== 'universe') url.searchParams.set('celestial', value.celestialId);
      else url.searchParams.delete('celestial');
      if (value.mode === 'concept' && value.conceptId) url.searchParams.set('concept', value.conceptId);
      else url.searchParams.delete('concept');
      const apu = { version: 1, mode: value.mode, celestialId: value.celestialId || null, conceptId: value.conceptId || null };
      const entry = { ...(history.state && typeof history.state === 'object' ? history.state : {}), apu };
      // A deeper visit gets a Back entry; siblings and explicit returns replace the current visit.
      const method = requested === 'replace' || force || routeDepth(value) <= routeDepth(previous) ? 'replaceState' : 'pushState';
      history[method](entry, '', url);
    }
    function applyRoute(route) {
      if (!universe) return;
      if (route.celestialId) universe.focusOnCelestial(route.celestialId, { history: 'none', conceptId: route.conceptId, animate: false });
      else universe.resetFocus({ history: 'none', animate: false });
    }

    function setHudVisible(visible, restoreFocus = false) {
      hudVisible = visible;
      universeUi.classList.toggle('hud-hidden', !visible);
      universeUi.inert = !visible;
      universeUi.setAttribute('aria-hidden', String(!visible));
      btnRestoreHud.hidden = visible;
      universe?.setUiVisible(visible);
      if (!visible) btnRestoreHud.focus({ preventScroll: true });
      else if (restoreFocus) btnToggleHud.focus({ preventScroll: true });
    }
    btnToggleHud.addEventListener('click', () => setHudVisible(false));
    btnRestoreHud.addEventListener('click', () => setHudVisible(true, true));

    // Consume the entire first gesture when restoring the HUD. It must never also pick a 3D object.
    canvas.addEventListener('pointerdown', event => {
      if (hudVisible && consumedPointers.size === 0) return;
      consumedPointers.add(event.pointerId);
      setHudVisible(true);
      canvas.setPointerCapture?.(event.pointerId);
      event.preventDefault();
      event.stopImmediatePropagation();
    }, { capture: true, passive: false });
    canvas.addEventListener('pointermove', event => {
      if (!consumedPointers.has(event.pointerId)) return;
      event.preventDefault();
      event.stopImmediatePropagation();
    }, { capture: true, passive: false });
    for (const type of ['pointerup', 'pointercancel']) {
      canvas.addEventListener(type, event => {
        if (!consumedPointers.delete(event.pointerId)) return;
        if (canvas.hasPointerCapture?.(event.pointerId)) canvas.releasePointerCapture(event.pointerId);
        event.preventDefault();
        event.stopImmediatePropagation();
      }, { capture: true, passive: false });
    }

    function scheduleLabelMeasurement() {
      if (labelMeasurementFrame !== null) return;
      labelMeasurementFrame = requestAnimationFrame(() => {
        labelMeasurementFrame = null;
        // Hidden buttons need one invisible layout pass; visible/focused buttons
        // keep their visibility. Reads are batched after all display changes.
        const hiddenButtons = Array.from(labelButtons.values()).filter(button => button.hidden);
        for (const button of hiddenButtons) button.classList.add('measuring');
        for (const [id, button] of labelButtons) {
          const box = button.getBoundingClientRect();
          if (box.width > 0 && box.height > 0) labelSizes.set(id, { width: box.width, height: box.height });
        }
        for (const button of hiddenButtons) button.classList.remove('measuring');
      });
    }
    window.addEventListener('resize', scheduleLabelMeasurement, { passive: true });
    document.fonts?.ready.then(scheduleLabelMeasurement);

    function reconcileLabels(value) {
      // Create and remove DOM only on state changes; camera frames only position existing buttons.
      const definitions = [
        ...Array.from(celestialNames, ([id, label]) => ({ id, label, kind: 'celestial' })),
        ...(value.concepts || []).map(item => ({ ...item, kind: 'concept' })),
      ];
      const liveIds = new Set(definitions.map(item => item.id));
      let needsMeasurement = false;
      for (const [id, button] of labelButtons) {
        if (!liveIds.has(id)) { button.remove(); labelButtons.delete(id); labelSizes.delete(id); }
      }
      for (const item of definitions) {
        let button = labelButtons.get(item.id);
        if (!button) {
          button = document.createElement('button');
          button.type = 'button';
          button.className = 'projected-label';
          button.hidden = true;
          const caption = document.createElement('span');
          caption.className = 'projected-label-caption';
          button.appendChild(caption);
          button.addEventListener('click', () => {
            if (!universe) return;
            if (button.dataset.concept) universe.selectConcept(button.dataset.concept);
            else universe.focusOnCelestial(button.dataset.celestial);
          });
          projectedLabels.appendChild(button);
          labelButtons.set(item.id, button);
          needsMeasurement = true;
        }
        if (item.kind === 'concept') { button.dataset.concept = item.id; delete button.dataset.celestial; }
        else { button.dataset.celestial = item.id; delete button.dataset.concept; }
        if (button.firstElementChild.textContent !== item.label) {
          button.firstElementChild.textContent = item.label;
          needsMeasurement = true;
        }
        button.setAttribute('aria-label', `${item.label} 탐험`);
        const selected = item.kind === 'concept' ? value.conceptId === item.id : value.celestialId === item.id;
        button.classList.toggle('selected', selected);
        button.setAttribute('aria-pressed', String(selected));
      }
      if (needsMeasurement) scheduleLabelMeasurement();
    }
    function renderPlayback(value) {
      const duration = Number.isFinite(value.mathDuration) && value.mathDuration > 0 ? value.mathDuration : 8;
      const time = Math.min(duration, Math.max(0, Number(value.mathTime) || 0));
      conceptSeek.max = String(duration);
      if (!seeking) conceptSeek.value = String(time);
      conceptSeek.setAttribute('aria-valuetext', `${time.toFixed(1)}초 / ${duration}초`);
      conceptTime.textContent = `${time.toFixed(1)} / ${duration}초`;
      const playing = value.mathPlaying === true;
      if (lastPlaybackState !== playing) {
        lastPlaybackState = playing;
        conceptPlaybackText.textContent = playing ? '일시정지' : '재생';
        btnPauseConcept.setAttribute('aria-label', playing ? '수학 움직임 일시정지' : '수학 움직임 재생');
        btnPauseConcept.setAttribute('aria-pressed', String(!playing));
        conceptPlaybackIcon.innerHTML = playing ? '<path d="M8 5v14M16 5v14"/>' : '<path d="m7 4 14 8-14 8Z"/>';
      }
    }
    function renderState(value, metadata = {}) {
      const previous = state;
      const activeElement = document.activeElement;
      const focusWasInLabels = projectedLabels.contains(activeElement);
      const focusWasInConcept = conceptControls.contains(activeElement);
      const focusWasInExplore = explorePanel.contains(activeElement);
      state = value;
      const exploring = value.mode !== 'universe';
      const inConcept = value.mode === 'concept';
      const family = celestialNames.get(value.celestialId) || value.title || '';
      universeUi.dataset.mode = value.mode;
      explorePanel.hidden = !exploring;
      conceptControls.hidden = !inConcept;
      exploreBreadcrumb.textContent = ['전체 우주', ...(exploring ? [family] : []), ...(inConcept ? [value.title] : [])].filter(Boolean).join('  /  ');
      exploreSubtitle.textContent = value.subtitle || '';
      exploreSubtitle.hidden = !value.subtitle;
      exploreBackText.textContent = inConcept ? '은하로' : '뒤로';
      btnExploreBack.setAttribute('aria-label', inConcept ? `${family} 은하로 돌아가기` : '이전 전체 우주 시점으로 돌아가기');
      exploreHint.textContent = value.mode === 'galaxy' ? '작은 도형이나 이름을 선택해 보세요' : inConcept ? '돌려 보며 수학적 관계를 살펴보세요' : '도형을 선택해 가까이 탐험해 보세요';
      for (const pill of celestialPills) {
        const selected = value.celestialId === pill.dataset.celestial && exploring;
        pill.classList.toggle('active', selected);
        pill.setAttribute('aria-pressed', String(selected));
      }
      motionBtnText.textContent = value.motionPlaying ? '모션 정지' : '모션 재생';
      btnToggleMotion.setAttribute('aria-label', value.motionPlaying ? '천체 움직임 일시정지' : '천체 움직임 재생');
      btnToggleMotion.setAttribute('aria-pressed', String(!value.motionPlaying));
      motionIcon.innerHTML = value.motionPlaying
        ? '<rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>'
        : '<polygon points="5,3 19,12 5,21"/>';
      reconcileLabels(value);
      renderPlayback(value);
      if (!sameRoute(value, previous)) {
        exploreStatus.textContent = exploring ? `${family}${inConcept ? `, ${value.title}` : ''}. ${value.subtitle || ''}` : '전체 우주로 돌아왔습니다.';
        // A selected projected label disappears at concept depth. Keep keyboard
        // focus on a visible control instead of leaving it in a hidden subtree.
        if (hudVisible) {
          if (inConcept && focusWasInLabels) btnPauseConcept.focus({ preventScroll: true });
          else if (exploring && !inConcept && focusWasInConcept) btnExploreBack.focus({ preventScroll: true });
          else if (!exploring && (focusWasInExplore || focusWasInLabels)) {
            celestialPills.find(pill => pill.dataset.celestial === previous.celestialId)?.focus();
          }
        }
      }
      writeRoute(value, metadata.history || 'none', previous);
    }
    function renderFrame(frame) {
      const visibleIds = new Set();
      const acceptedBoxes = [];
      const focusedButton = projectedLabels.contains(document.activeElement) ? document.activeElement : null;
      const candidates = [];
      let decluttered = false;
      for (const [index, label] of (frame.labels || []).entries()) {
        const button = labelButtons.get(label.id);
        const size = labelSizes.get(label.id);
        if (!button || !size || !label.visible || !Number.isFinite(label.x) || !Number.isFinite(label.y)) continue;
        const halfW = size.width / 2, halfH = size.height / 2;
        const x = Math.max(halfW + 4, Math.min(window.innerWidth - halfW - 4, label.x));
        const box = { left: x - halfW, right: x + halfW, top: label.y - halfH, bottom: label.y + halfH };
        // At most one caption-sized nudge horizontally; never move a caption
        // away from its physical object to manufacture a menu-like arrangement.
        if (Math.abs(x - label.x) > 12 || box.left < 0 || box.right > window.innerWidth || box.top < 0 || box.bottom > window.innerHeight) {
          decluttered = true;
          continue;
        }
        candidates.push({ label, button, box, x, index, focused: button === focusedButton, depth: Number.isFinite(label.depth) ? label.depth : 0 });
      }
      candidates.sort((a, b) => Number(b.focused) - Number(a.focused) || a.depth - b.depth || a.index - b.index);
      for (const item of candidates) {
        const box = item.box;
        if (acceptedBoxes.some(other => box.left < other.right && box.right > other.left && box.top < other.bottom && box.bottom > other.top)) {
          decluttered = true;
          continue;
        }
        acceptedBoxes.push(box);
        visibleIds.add(item.label.id);
        item.button.style.transform = `translate3d(${item.x.toFixed(1)}px, ${item.label.y.toFixed(1)}px, 0) translate(-50%, -50%)`;
      }
      for (const [id, button] of labelButtons) button.hidden = !visibleIds.has(id);
      if (focusedButton?.hidden && hudVisible && state.mode === 'galaxy') btnExploreBack.focus({ preventScroll: true });
      if (state.mode === 'galaxy') {
        const hint = decluttered ? '돌려서 다른 도형도 찾아보세요' : '작은 도형이나 이름을 선택해 보세요';
        if (exploreHint.textContent !== hint) exploreHint.textContent = hint;
      }
      if (state.mode === 'concept') renderPlayback(frame);
    }

    btnToggleMotion.addEventListener('click', () => universe?.toggleMotion());
    btnExploreBack.addEventListener('click', () => universe?.back());
    btnUniverseHome.addEventListener('click', () => universe?.resetFocus({ history: 'replace' }));
    btnReplayConcept.addEventListener('click', () => universe?.replayConcept());
    btnPauseConcept.addEventListener('click', () => universe?.toggleConceptPlayback());
    conceptSeek.addEventListener('pointerdown', () => { seeking = true; });
    for (const type of ['pointerup', 'pointercancel', 'change', 'blur']) conceptSeek.addEventListener(type, () => { seeking = false; });
    conceptSeek.addEventListener('input', () => universe?.seekConcept(Number(conceptSeek.value)));
    for (const pill of celestialPills) {
      pill.setAttribute('aria-pressed', 'false');
      pill.addEventListener('click', () => universe?.focusOnCelestial(pill.dataset.celestial));
    }
    window.addEventListener('popstate', () => {
      const route = readRoute();
      if (sameRoute(route, state)) return;
      restoringHistory = true;
      try { applyRoute(route); } finally { restoringHistory = false; }
    });
    window.addEventListener('keydown', event => {
      if (event.key !== 'Escape' || event.defaultPrevented || warpCurtain.classList.contains('active')) return;
      if (!hudVisible) setHudVisible(true, true);
      else if (state.mode !== 'universe') universe?.back();
      else return;
      event.preventDefault();
    });

    // Only this explicit lab action leaves the 3D exploration experience.
    btnEnterLab.addEventListener('click', () => {
      if (btnEnterLab.disabled) return;
      btnEnterLab.disabled = true;
      warpCurtain.classList.add('active');
      const hubHref = getHubHref();
      let navigating = false;
      let fallbackTimer;
      const navigate = () => {
        if (navigating) return;
        navigating = true;
        clearTimeout(fallbackTimer);
        location.assign(hubHref);
      };
      // An inactive tab must not strand a student while the animation frame loop is suspended.
      fallbackTimer = setTimeout(navigate, 3200);
      if (universe?.triggerLabEntranceFlight && !state.reducedMotion) {
        universe.triggerLabEntranceFlight(() => setTimeout(navigate, 450));
      } else setTimeout(navigate, state.reducedMotion ? 0 : 500);
    });

    try {
      universe = createMathUniverse({ canvas, onStateChange: renderState, onFrame: renderFrame });
      applyRoute(initialRoute);
      renderState(universe.getState(), { history: 'none' });
      bootstrapping = false;
      writeRoute(state, 'replace', state, true);
      if (exposeTestApi) window.__APMathUniverse = universe;
    } catch (error) {
      bootstrapping = false;
      console.error('Failed to initialize Math Universe 3D Engine:', error);
      universeUi.inert = true;
      universeUi.setAttribute('aria-hidden', 'true');
      btnRestoreHud.hidden = true;
      const fallback = document.createElement('section');
      fallback.className = 'webgl-fallback';
      fallback.setAttribute('aria-labelledby', 'fallbackTitle');
      const title = document.createElement('h2');
      title.id = 'fallbackTitle';
      title.textContent = '실험실에서 계속 탐험할 수 있어요';
      const description = document.createElement('p');
      description.textContent = '이 기기에서 3D 우주를 시작하지 못했습니다. 실험실 허브에서 모든 수학 실험실을 이용하실 수 있습니다.';
      const hubLink = document.createElement('a');
      hubLink.className = 'cta-entrance';
      hubLink.href = getHubHref();
      hubLink.textContent = '실험실 허브 바로가기';
      const portalLink = document.createElement('a');
      portalLink.className = 'universe-portal-link';
      portalLink.href = window.StudentPortalNavigation?.portalHref('home') || '../student/';
      portalLink.textContent = '학생 포털로 돌아가기';
      fallback.append(title, description, hubLink, portalLink);
      document.body.appendChild(fallback);
      hubLink.focus({ preventScroll: true });
    }
  </script>
</body>
</html>
