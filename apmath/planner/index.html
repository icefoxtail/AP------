<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>AP Math Planner</title>
  <!-- 글꼴은 화면을 막지 않고, 첫 화면이 그려져 한가해진 뒤에 적용한다(처음엔 시스템 글꼴, 이어서 Pretendard로 바뀜). dynamic-subset은 쓰는 글자 조각만 받는다. -->
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css" media="print" onload="var l=this,f=function(){l.media='all'};window.requestIdleCallback?requestIdleCallback(f,{timeout:2500}):setTimeout(f,400)">
  <noscript><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css"></noscript>
  <link rel="stylesheet" href="../css/apms-ui-foundation.css">
  <style>
    :root {
      --primary:#1A5CFF;
      --primary-dark:#0040D6;
      --secondary:#6B7684;
      --success:#00B894;
      --error:#E8414F;
      --warning:#F59F00;
      --bg:#F2F4F6;
      --surface:#FFFFFF;
      --surface-2:#F8FAFC;
      --surface-alpha:rgba(242,244,246,0.92);
      --primary-soft:rgba(26,92,255,0.08);
      --primary-rgb:26,92,255;
      --border:#E5E8EB;
      --text:#191F28;
      --text-soft:#333D4B;
      --shadow:0 2px 8px rgba(0,0,0,0.03);
    }
    body.dark {
      --primary:#8AB4FF;
      --primary-dark:#5B8DFF;
      --secondary:#A7B0BE;
      --success:#4ADE80;
      --error:#FB7185;
      --warning:#FBBF24;
      --bg:#111318;
      --surface:#1A1D23;
      --surface-2:#232731;
      --surface-alpha:rgba(26,29,35,0.92);
      --primary-soft:rgba(138,180,255,0.14);
      --primary-rgb:138,180,255;
      --border:rgba(255,255,255,0.12);
      --text:#F3F4F6;
      --text-soft:#D1D5DB;
      --shadow:none;
    }
    @media (prefers-color-scheme: dark) {
      body:not(.light) {
        --primary:#8AB4FF;
        --primary-dark:#5B8DFF;
        --secondary:#A7B0BE;
        --success:#4ADE80;
        --error:#FB7185;
        --warning:#FBBF24;
        --bg:#111318;
        --surface:#1A1D23;
        --surface-2:#232731;
        --surface-alpha:rgba(26,29,35,0.92);
        --primary-soft:rgba(138,180,255,0.14);
        --primary-rgb:138,180,255;
        --border:rgba(255,255,255,0.12);
        --text:#F3F4F6;
        --text-soft:#D1D5DB;
        --shadow:none;
      }
    }
    * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; outline:none; }
    body {
      margin:0;
      font-family:'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background:var(--bg);
      color:var(--text);
      line-height:1.55;
    }
    button, input, select, textarea { font-family:inherit; }
    .app {
      width:100%;
      max-width:1040px;
      margin:0 auto;
      padding:16px 14px calc(92px + env(safe-area-inset-bottom));
    }
    .top {
      position:sticky;
      top:0;
      z-index:20;
      background:var(--surface-alpha);
      backdrop-filter:blur(12px);
      -webkit-backdrop-filter:blur(12px);
      border-bottom:1px solid var(--border);
    }
    .top-inner {
      max-width:1040px;
      margin:0 auto;
      height:58px;
      padding:0 16px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
    }
    .brand {
      font-size:19px;
      font-weight:500;
      letter-spacing:-0.3px;
      color:var(--text);
      white-space:nowrap;
    }
    .student-chip {
      min-width:0;
      max-width:50%;
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
      font-size:13px;
      font-weight:500;
      color:var(--secondary);
      text-align:right;
    }
    .card {
      background:var(--surface);
      border:1px solid var(--border);
      border-radius:18px;
      box-shadow:var(--shadow);
      padding:16px;
    }
    .btn {
      min-height:44px;
      border-radius:12px;
      border:1px solid var(--border);
      background:var(--surface);
      color:var(--text);
      padding:10px 14px;
      font-size:14px;
      font-weight:500;
      cursor:pointer;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:6px;
      transition:transform .12s ease, background .12s ease;
    }
    .btn:active { transform:scale(0.98); }
    .btn-primary {
      background:var(--primary);
      border-color:var(--primary);
      color:#fff;
      box-shadow:0 4px 12px rgba(var(--primary-rgb),0.20);
    }
    .input {
      width:100%;
      min-height:46px;
      border-radius:12px;
      border:1px solid var(--border);
      background:var(--surface);
      color:var(--text);
      padding:11px 13px;
      font-size:15px;
      font-weight:500;
    }
    .muted {
      color:var(--secondary);
      font-size:12px;
      font-weight:500;
    }
    .pin-wrap {
      min-height:calc(100vh - 58px);
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px 14px;
    }
    .pin-card {
      width:100%;
      max-width:380px;
      background:var(--surface);
      border:1px solid var(--border);
      border-radius:24px;
      padding:30px 22px;
      box-shadow:var(--shadow);
    }
    .pin-logo {
      width:54px;
      height:54px;
      border-radius:16px;
      display:flex;
      align-items:center;
      justify-content:center;
      background:var(--primary);
      color:#fff;
      font-size:24px;
      font-weight:500;
      margin:0 auto 16px;
    }
    .pin-title {
      margin:0;
      text-align:center;
      font-size:20px;
      font-weight:500;
      color:var(--text);
      letter-spacing:-0.5px;
    }
    .pin-desc {
      margin:8px 0 24px;
      text-align:center;
      color:var(--secondary);
      font-size:13px;
      font-weight:500;
      line-height:1.5;
    }
    .dashboard {
      display:grid;
      grid-template-columns:320px minmax(0,1fr);
      gap:16px;
      align-items:start;
    }
    .hero {
      display:grid;
      grid-template-columns:1fr 1fr 1fr;
      gap:10px;
      margin-bottom:16px;
    }
    .stat {
      background:var(--surface);
      border:1px solid var(--border);
      border-radius:18px;
      padding:15px 12px;
    }
    .stat-label {
      font-size:11px;
      font-weight:500;
      color:var(--secondary);
      margin-bottom:5px;
    }
    .stat-value {
      font-size:22px;
      font-weight:500;
      color:var(--text);
      line-height:1.15;
      letter-spacing:-0.5px;
    }
    .progress-wrap {
      height:10px;
      background:var(--surface-2);
      border:1px solid var(--border);
      border-radius:999px;
      overflow:hidden;
      margin-top:10px;
    }
    .progress-bar {
      height:100%;
      background:var(--primary);
      border-radius:999px;
      transition:width .2s ease;
    }
    .feedback {
      margin-bottom:16px;
      border-radius:18px;
      border:1px solid rgba(var(--primary-rgb),0.18);
      background:var(--primary-soft);
      padding:14px;
    }
    .feedback-title {
      font-size:13px;
      font-weight:500;
      color:var(--primary);
      margin-bottom:5px;
    }
    .feedback-text {
      font-size:14px;
      font-weight:500;
      color:var(--text);
      line-height:1.5;
      white-space:pre-wrap;
    }
    .calendar-head {
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:12px;
    }
    .calendar-title {
      font-size:17px;
      font-weight:500;
      color:var(--text);
    }
    .calendar-grid {
      display:grid;
      grid-template-columns:repeat(7,1fr);
      gap:5px;
    }
    .weekday {
      text-align:center;
      font-size:11px;
      font-weight:500;
      color:var(--secondary);
      padding:5px 0;
    }
    .day {
      min-height:40px;
      border:1px solid transparent;
      border-radius:12px;
      background:transparent;
      color:var(--text);
      font-size:13px;
      font-weight:500;
      cursor:pointer;
      position:relative;
    }
    .day.out { color:var(--border); cursor:default; }
    .day.selected {
      border-color:var(--primary);
      background:var(--primary-soft);
      color:var(--primary);
    }
    .day.today::after {
      content:'';
      position:absolute;
      left:50%;
      bottom:5px;
      width:4px;
      height:4px;
      transform:translateX(-50%);
      border-radius:50%;
      background:var(--primary);
    }
    .day.done-full { background:rgba(0,184,148,0.10); }
    .day.done-part { background:rgba(245,159,0,0.12); }
    .plan-head {
      display:flex;
      justify-content:space-between;
      align-items:flex-start;
      gap:12px;
      margin-bottom:12px;
    }
    .plan-title {
      font-size:19px;
      font-weight:500;
      color:var(--text);
      letter-spacing:-0.4px;
      line-height:1.25;
    }
    .plan-date {
      font-size:12px;
      font-weight:500;
      color:var(--secondary);
      margin-top:4px;
    }
    .plan-list {
      display:flex;
      flex-direction:column;
      gap:9px;
    }
    .plan-item {
      min-height:54px;
      border:1px solid var(--border);
      background:var(--surface);
      border-radius:16px;
      padding:12px;
      display:flex;
      gap:10px;
      align-items:center;
    }
    .check {
      width:30px;
      height:30px;
      border-radius:10px;
      border:1px solid var(--border);
      background:var(--surface-2);
      color:var(--surface-2);
      font-size:17px;
      font-weight:500;
      flex:0 0 auto;
      cursor:pointer;
      display:flex;
      align-items:center;
      justify-content:center;
    }
    .check.done {
      background:var(--primary);
      border-color:var(--primary);
      color:#fff;
    }
    .plan-main {
      min-width:0;
      flex:1;
    }
    .plan-main.done { opacity:.5; text-decoration:line-through; }
    .plan-item-title {
      font-size:15px;
      font-weight:500;
      color:var(--text);
      line-height:1.35;
      word-break:break-word;
    }
    .plan-sub {
      margin-top:3px;
      font-size:11px;
      font-weight:500;
      color:var(--secondary);
    }
    .planner-badge-row {
      display:flex;
      flex-wrap:wrap;
      gap:6px;
      margin-top:8px;
    }
    .planner-badge {
      min-height:26px;
      display:inline-flex;
      align-items:center;
      gap:5px;
      padding:0 9px;
      border-radius:999px;
      border:1px solid var(--border);
      background:var(--surface-2);
      color:var(--secondary);
      font-size:11px;
      font-weight:500;
      line-height:1;
      white-space:nowrap;
    }
    .planner-badge svg,
    .planner-action-btn svg,
    .check svg {
      width:15px;
      height:15px;
      stroke:currentColor;
      stroke-width:2;
      fill:none;
      stroke-linecap:round;
      stroke-linejoin:round;
      flex:0 0 auto;
    }
    .planner-badge--focus {
      border-color:rgba(0,184,148,.24);
      background:rgba(0,184,148,.09);
      color:#047857;
    }
    .planner-badge--rest {
      border-color:rgba(245,159,0,.28);
      background:rgba(245,159,0,.10);
      color:#B45309;
    }
    .planner-badge--done {
      border-color:rgba(var(--primary-rgb),.26);
      background:var(--primary-soft);
      color:var(--primary);
    }
    .planner-badge--snapshot {
      border-color:rgba(51,65,85,.16);
      background:rgba(51,65,85,.06);
      color:#475569;
    }
    .planner-badge--question,
    .planner-badge--reply {
      border-color:rgba(99,102,241,.24);
      background:rgba(99,102,241,.08);
      color:#4F46E5;
    }
    .planner-badge--wake {
      border-color:rgba(249,115,22,.26);
      background:rgba(249,115,22,.10);
      color:#C2410C;
    }
    .planner-badge--seen {
      border-color:rgba(14,165,233,.24);
      background:rgba(14,165,233,.08);
      color:#0284C7;
    }
    .planner-badge--locked {
      border-color:rgba(232,65,79,.22);
      background:rgba(232,65,79,.08);
      color:var(--error);
    }
    .planner-action-row {
      display:flex;
      flex-wrap:wrap;
      gap:6px;
      margin-left:auto;
      justify-content:flex-end;
      flex:0 0 auto;
    }
    .planner-action-btn {
      min-height:34px;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:5px;
      border:1px solid var(--border);
      border-radius:999px;
      background:var(--surface-2);
      color:var(--text);
      padding:0 10px;
      font-size:12px;
      font-weight:500;
      cursor:pointer;
      white-space:nowrap;
    }
    .planner-action-btn.primary {
      border-color:rgba(var(--primary-rgb),.28);
      background:var(--primary-soft);
      color:var(--primary);
    }
    .planner-action-btn.danger {
      border-color:transparent;
      background:transparent;
      color:var(--secondary);
      padding-inline:8px;
      box-shadow:none;
      opacity:.78;
    }
    .delete {
      border:0;
      background:transparent;
      color:var(--secondary);
      font-size:12px;
      font-weight:500;
      padding:8px;
      cursor:pointer;
      flex:0 0 auto;
    }
    .empty {
      padding:34px 12px;
      text-align:center;
      color:var(--secondary);
      font-size:13px;
      font-weight:500;
      border:1px dashed var(--border);
      border-radius:16px;
      background:var(--surface-2);
    }
    .quick-form {
      display:grid;
      grid-template-columns:minmax(0,1fr) 110px 86px;
      gap:8px;
      margin-top:14px;
      padding-top:14px;
      border-top:1px solid var(--border);
    }
    .mobile-add {
      display:none;
      position:fixed;
      left:14px;
      right:14px;
      bottom:calc(14px + env(safe-area-inset-bottom));
      z-index:40;
      min-height:54px;
      border-radius:18px;
      box-shadow:0 10px 24px rgba(var(--primary-rgb),0.24);
    }
    .modal-overlay {
      position:fixed;
      inset:0;
      display:none;
      align-items:flex-end;
      justify-content:center;
      background:rgba(0,0,0,0.32);
      z-index:100;
      padding:14px;
    }
    .modal-overlay.show { display:flex; }
    .modal {
      width:100%;
      max-width:420px;
      background:var(--surface);
      border:1px solid var(--border);
      border-radius:22px;
      padding:18px;
      box-shadow:0 16px 40px rgba(0,0,0,0.16);
      color:var(--text);
    }
    .modal-title {
      font-size:18px;
      font-weight:500;
      color:var(--text);
      margin-bottom:14px;
    }
    .toast {
      position:fixed;
      left:50%;
      bottom:calc(82px + env(safe-area-inset-bottom));
      transform:translateX(-50%);
      background:#191F28;
      color:#fff;
      border-radius:999px;
      padding:10px 15px;
      font-size:13px;
      font-weight:500;
      z-index:200;
      opacity:0;
      pointer-events:none;
      transition:opacity .2s ease, transform .2s ease;
      white-space:nowrap;
    }
    .toast.show {
      opacity:1;
      transform:translateX(-50%) translateY(-4px);
    }

    .top-back {
      border:0;
      background:transparent;
      color:var(--secondary);
      font-size:13px;
      font-weight:500;
      padding:8px 8px 8px 0;
      cursor:pointer;
      flex:0 0 auto;
      white-space:nowrap;
    }
    .top-back:hover { color:var(--primary); }
    .planner-timer-mini {
      position:fixed;
      right:18px;
      bottom:18px;
      z-index:70;
      width:min(360px, calc(100vw - 36px));
      display:flex;
      align-items:center;
      gap:12px;
      padding:13px 14px;
      border:1px solid var(--border);
      border-radius:20px;
      background:var(--surface-alpha);
      box-shadow:0 14px 34px rgba(0,0,0,0.14);
      backdrop-filter:blur(10px);
    }
    .planner-timer-mini.hidden { display:none; }
    .timer-time {
      flex:0 0 auto;
      min-width:72px;
      font-size:22px;
      font-weight:500;
      color:var(--primary);
      letter-spacing:-0.4px;
      font-variant-numeric:tabular-nums;
    }
    .timer-info {
      min-width:0;
      flex:1;
    }
    .timer-label {
      font-size:11px;
      font-weight:500;
      color:var(--secondary);
      line-height:1.2;
    }
    .timer-title {
      margin-top:2px;
      font-size:13px;
      font-weight:500;
      color:var(--text);
      line-height:1.25;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .timer-actions {
      display:flex;
      align-items:center;
      gap:6px;
      flex:0 0 auto;
    }
    .timer-presets {
      display:flex;
      align-items:center;
      gap:4px;
      margin-top:7px;
      flex-wrap:wrap;
    }
    .timer-preset {
      border:1px solid var(--border);
      background:var(--surface-2);
      color:var(--secondary);
      min-height:26px;
      padding:0 8px;
      border-radius:999px;
      font-size:11px;
      font-weight:500;
      cursor:pointer;
    }
    .timer-preset.active {
      border-color:rgba(var(--primary-rgb),0.28);
      background:var(--primary-soft);
      color:var(--primary);
    }
    .timer-btn {
      border:1px solid var(--border);
      background:var(--surface-2);
      color:var(--text);
      min-height:34px;
      padding:0 10px;
      border-radius:999px;
      font-size:12px;
      font-weight:500;
      cursor:pointer;
    }
    .timer-btn.primary {
      border-color:var(--primary);
      background:var(--primary);
      color:#fff;
    }
    .timer-btn.close {
      width:34px;
      padding:0;
      color:var(--secondary);
    }
    .plan-timer {
      border:0;
      background:var(--primary-soft);
      color:var(--primary);
      font-size:12px;
      font-weight:500;
      padding:8px;
      border-radius:999px;
      cursor:pointer;
      flex:0 0 auto;
      white-space:nowrap;
    }

    @media (max-width:767px) {
      .app { padding:14px 12px calc(88px + env(safe-area-inset-bottom)); }
      .dashboard { display:block; }
      .side { margin-bottom:14px; }
      .hero { grid-template-columns:1fr 1fr; }
      .hero .stat:last-child { grid-column:span 2; }
      .calendar-card { display:none; }
      .quick-form { display:none; }
      .mobile-add { display:flex; }

      .planner-timer-mini {
        left:12px;
        right:12px;
        bottom:calc(76px + env(safe-area-inset-bottom));
        width:auto;
      }
      .timer-time { min-width:66px; font-size:20px; }
      .timer-title { max-width:118px; }
      .timer-presets { gap:3px; margin-top:6px; }
      .timer-preset { min-height:24px; padding:0 7px; font-size:10.5px; }
      .plan-item {
        flex-wrap:wrap;
        align-items:flex-start;
      }
      .plan-main {
        flex:1 1 calc(100% - 40px);
      }
      .planner-action-row {
        flex:0 0 calc(100% - 40px);
        width:auto;
        margin-left:40px;
        justify-content:flex-start;
      }

      .top-inner { height:56px; }
      .brand { font-size:18px; }
      .student-chip { max-width:48%; font-size:12px; }
    }
    /* 확대 허용(2026-11-01 결정) 후 iOS가 16px 미만 입력칸에 포커스할 때 화면을 자동 확대하는 것을 막는다. 휴대폰 폭에서만. */
    @media (max-width:767px) {
      input:not([type=checkbox]):not([type=radio]):not([type=range]):not([type=file]):not([type=button]):not([type=submit]),
      select, textarea { font-size:16px !important; }
    }
  </style>
  <link rel="stylesheet" href="../css/student-tools.css?v=2026.11.11.2">
  <link rel="stylesheet" href="../css/student-navigation.css?v=2026.11.11.3">
  <script defer src="../js/student-navigation.js?v=2026.11.11.3" data-student-nav-active="planner"></script>
</head>
<body class="student-tool-page planner-page">
  <script>
    (function () {
      const saved = localStorage.getItem('APMATH_THEME');
      const isSystemDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.body.classList.toggle('dark', saved === 'dark' || (!saved && isSystemDark));
      document.body.classList.toggle('light', saved === 'light');
      if (window.matchMedia) {
        const media = window.matchMedia('(prefers-color-scheme: dark)');
        const sync = () => {
          if (localStorage.getItem('APMATH_THEME')) return;
          document.body.classList.toggle('dark', media.matches);
        };
        if (media.addEventListener) media.addEventListener('change', sync);
        else if (media.addListener) media.addListener(sync);
      }
    })();
  </script>

  <script>
    const API_BASE = 'https://ap-math-os-v2612.js-pdf.workers.dev/api';
    let examDate = null; // 서버에서 학생별로 받아옴. null이면 D-DAY 미표시

    const params = new URLSearchParams(location.search);
    const isTeacherPreview = params.get('teacher_preview') === '1';
    const studentId = String(
      params.get('student_id') ||
      localStorage.getItem('PLANNER_SID') ||
      sessionStorage.getItem('PLANNER_SID') ||
      ''
    ).trim();

    let pin = String(
      params.get('pin') ||
      (studentId ? localStorage.getItem(`planner_pin_${studentId}`) : '') ||
      localStorage.getItem('PLANNER_PIN') ||
      sessionStorage.getItem('PLANNER_PIN') ||
      ''
    ).trim();
    let student = null;
    let plans = [];
    let feedback = [];
    let plannerIndex = null;
    let selectedDate = todayStr();
    let currentMonth = selectedDate.slice(0, 7);
    let plannerCalendarOpen = false;
    let plannerModalOpener = null;
    const PLANNER_TIMER_MINUTES_KEY = `planner_timer_minutes_${studentId || 'default'}`;
    const PLANNER_TIMER_ALLOWED_MINUTES = [30, 45, 60];
    let plannerTimerSelectedMinutes = getStoredPlannerTimerMinutes();
    let plannerTimerSeconds = plannerTimerSelectedMinutes * 60;
    let plannerTimerActive = false;
    let plannerTimerInterval = null;
    let plannerTimerTitle = '';

    function $(id) { return document.getElementById(id); }
    function todayStr() { return new Date().toLocaleDateString('sv-SE'); }
    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>"']/g, ch => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[ch]));
    }
    function escapeJsString(value) {
      return String(value ?? '').replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/\r?\n/g, ' ');
    }
    function plannerIconSvg(type) {
      const icons = {
        focus: '<path d="M12 3v3"></path><path d="M12 18v3"></path><path d="M3 12h3"></path><path d="M18 12h3"></path><circle cx="12" cy="12" r="4"></circle>',
        rest: '<path d="M17 8h1a3 3 0 0 1 0 6h-1"></path><path d="M4 8h13v5a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5Z"></path><path d="M6 2v2"></path><path d="M10 2v2"></path><path d="M14 2v2"></path>',
        done: '<path d="M20 6 9 17l-5-5"></path>',
        snapshot: '<path d="M4 7h3l2-2h6l2 2h3v12H4Z"></path><circle cx="12" cy="13" r="3"></circle>',
        question: '<path d="M9.1 9a3 3 0 1 1 5.4 1.8c-.9.6-1.5 1.1-1.5 2.2"></path><path d="M12 17h.01"></path><circle cx="12" cy="12" r="10"></circle>',
        reply: '<path d="M21 15a4 4 0 0 1-4 4H8l-5 3V7a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4Z"></path>',
        wake: '<path d="M10 2h4"></path><path d="M12 6v6l4 2"></path><circle cx="12" cy="13" r="8"></circle>',
        seen: '<path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12Z"></path><circle cx="12" cy="12" r="3"></circle>',
        locked: '<rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path>'
      };
      return `<svg viewBox="0 0 24 24" aria-hidden="true">${icons[type] || icons.focus}</svg>`;
    }
    function renderPlannerStatusBadge(type, label) {
      return `<span class="planner-badge planner-badge--${type}">${plannerIconSvg(type)}<span>${escapeHtml(label)}</span></span>`;
    }
    function renderPlannerOptionalBadge(type, label, count) {
      return Number(count || 0) > 0 ? renderPlannerStatusBadge(type, label) : '';
    }
    function getPlannerCount(plan, keys) {
      for (const key of keys) {
        const n = Number(plan && plan[key]);
        if (Number.isFinite(n) && n > 0) return n;
      }
      return 0;
    }
    function renderPlanStatusBadges(plan, done) {
      const snapshots = getPlannerCount(plan, ['snapshot_count', 'photo_count', 'photos_count', 'attachment_count']);
      const questions = getPlannerCount(plan, ['question_count', 'questions_count']);
      const replies = getPlannerCount(plan, ['reply_count', 'replies_count']);
      const status = done ? renderPlannerStatusBadge('done', '완료') : renderPlannerStatusBadge('focus', '공부 대기');
      return `
        <div class="planner-badge-row">
          ${status}
          ${renderPlannerOptionalBadge('snapshot', '스냅샷', snapshots)}
          ${renderPlannerOptionalBadge('question', `질문 ${questions}`, questions)}
          ${renderPlannerOptionalBadge('reply', `답변 ${replies}`, replies)}
        </div>
      `;
    }
    function showPlannerSoon(feature) {
      toast(`${feature} 기능은 다음 단계에서 연결합니다.`);
    }
    function getRepeatHintText() {
      return examDate
        ? `반복은 ${examDate}까지만 생성됩니다.`
        : '시험일을 설정하면 반복 계획 종료일이 자동 적용됩니다.';
    }
    function toast(message) {
      const el = $('toast');
      el.textContent = message;
      el.classList.add('show');
      clearTimeout(window.__toastTimer);
      window.__toastTimer = setTimeout(() => el.classList.remove('show'), 1800);
    }

    function vibratePlannerTimerDone() {
      if (!('vibrate' in navigator)) return;
      try {
        navigator.vibrate([180, 80, 180]);
      } catch (e) {}
    }

    function goPlannerBack() {
      if (window.StudentPortalNavigation) {
        location.href = window.StudentPortalNavigation.portalHref('home');
        return;
      }
      const sameOriginReferrer = document.referrer && document.referrer.indexOf(location.origin) === 0;
      if (sameOriginReferrer && history.length > 1) {
        history.back();
        return;
      }
      location.href = '../student/';
    }

    function getStoredPlannerTimerMinutes() {
      try {
        const saved = Number(authStore().getItem(PLANNER_TIMER_MINUTES_KEY));
        return PLANNER_TIMER_ALLOWED_MINUTES.includes(saved) ? saved : 45;
      } catch (e) {
        return 45;
      }
    }

    function setPlannerTimerMinutes(minutes) {
      const next = Number(minutes);
      if (!PLANNER_TIMER_ALLOWED_MINUTES.includes(next)) return;
      clearInterval(plannerTimerInterval);
      plannerTimerInterval = null;
      plannerTimerActive = false;
      plannerTimerSelectedMinutes = next;
      plannerTimerSeconds = next * 60;
      try { authStore().setItem(PLANNER_TIMER_MINUTES_KEY, String(next)); } catch (e) {}
      const mini = $('planner-timer-mini');
      if (mini) mini.classList.remove('hidden');
      renderPlannerTimerMini();
    }

    function getPlannerTimerPresetHtml() {
      return PLANNER_TIMER_ALLOWED_MINUTES.map(minutes => `
        <button id="timer-preset-${minutes}" class="timer-preset ${plannerTimerSelectedMinutes === minutes ? 'active' : ''}" aria-pressed="${plannerTimerSelectedMinutes === minutes}" onclick="setPlannerTimerMinutes(${minutes})">${minutes}분</button>
      `).join('');
    }

    function formatPlannerTimerTime() {
      const safe = Math.max(0, Number(plannerTimerSeconds || 0));
      const m = String(Math.floor(safe / 60)).padStart(2, '0');
      const s = String(safe % 60).padStart(2, '0');
      return `${m}:${s}`;
    }

    function renderPlannerTimerMini() {
      const mini = $('planner-timer-mini');
      if (!mini) return;
      const focusedId = mini.contains(document.activeElement) ? document.activeElement.id : '';
      mini.innerHTML = `
        <div class="timer-time" role="timer" aria-live="off">${formatPlannerTimerTime()}</div>
        <div class="timer-info">
          <div class="timer-label">집중 타이머 · ${plannerTimerSelectedMinutes}분</div>
          <div class="timer-title">${escapeHtml(plannerTimerTitle || '현재 계획')}</div>
          <div class="timer-presets">${getPlannerTimerPresetHtml()}</div>
        </div>
        <div class="timer-actions">
          <button id="timer-toggle" class="timer-btn ${plannerTimerActive ? '' : 'primary'}" onclick="togglePlannerTimer()">${plannerTimerActive ? '일시정지' : '시작'}</button>
          <button id="timer-reset" class="timer-btn" onclick="resetPlannerTimer()">초기화</button>
          <button id="timer-close" class="timer-btn close" aria-label="집중 타이머 닫기" onclick="closePlannerTimer()">×</button>
        </div>
      `;
      if (focusedId) $(focusedId)?.focus({ preventScroll: true });
    }

    function showPlannerTimer(title, resetSeconds = false) {
      plannerTimerTitle = String(title || plannerTimerTitle || '현재 계획').trim() || '현재 계획';
      if (!PLANNER_TIMER_ALLOWED_MINUTES.includes(Number(plannerTimerSelectedMinutes))) {
        plannerTimerSelectedMinutes = 45;
      }
      if (resetSeconds || !Number.isFinite(Number(plannerTimerSeconds)) || plannerTimerSeconds <= 0) {
        plannerTimerSeconds = plannerTimerSelectedMinutes * 60;
      }
      const mini = $('planner-timer-mini');
      if (mini) mini.classList.remove('hidden');
      renderPlannerTimerMini();
    }

    function startPlannerTimerForPlan(planId) {
      const plan = plans.find(p => String(p.id) === String(planId));
      clearInterval(plannerTimerInterval);
      plannerTimerInterval = null;
      plannerTimerActive = false;
      showPlannerTimer(plan?.title || '현재 계획', true);
      togglePlannerTimer();
    }

    function togglePlannerTimer() {
      const mini = $('planner-timer-mini');
      if (mini) mini.classList.remove('hidden');

      if (plannerTimerActive) {
        clearInterval(plannerTimerInterval);
        plannerTimerInterval = null;
        plannerTimerActive = false;
        renderPlannerTimerMini();
        return;
      }

      plannerTimerActive = true;
      clearInterval(plannerTimerInterval);
      plannerTimerInterval = setInterval(() => {
        plannerTimerSeconds -= 1;
        if (plannerTimerSeconds <= 0) {
          clearInterval(plannerTimerInterval);
          plannerTimerInterval = null;
          plannerTimerActive = false;
          plannerTimerSeconds = plannerTimerSelectedMinutes * 60;
          renderPlannerTimerMini();
          toast('집중 시간이 끝났습니다.');
          vibratePlannerTimerDone();
          return;
        }
        const timerReadout = document.querySelector('#planner-timer-mini .timer-time');
        if (timerReadout) timerReadout.textContent = formatPlannerTimerTime();
      }, 1000);
      renderPlannerTimerMini();
    }

    function resetPlannerTimer() {
      clearInterval(plannerTimerInterval);
      plannerTimerInterval = null;
      plannerTimerActive = false;
      plannerTimerSeconds = plannerTimerSelectedMinutes * 60;
      renderPlannerTimerMini();
      toast('타이머가 초기화되었습니다.');
    }

    function closePlannerTimer() {
      clearInterval(plannerTimerInterval);
      plannerTimerInterval = null;
      plannerTimerActive = false;
      plannerTimerSeconds = plannerTimerSelectedMinutes * 60;
      plannerTimerTitle = '';
      const mini = $('planner-timer-mini');
      if (mini) mini.classList.add('hidden');
    }

    function authStore() { return window.localStorage; }
    function authKey() { return `planner_auth_${studentId}`; }
    function pinKey() { return `planner_pin_${studentId}`; }
    function getPortalPlannerPinCandidate() {
      const portalSid = String(localStorage.getItem('PLANNER_SID') || sessionStorage.getItem('PLANNER_SID') || '').trim();
      const queryPin = String(params.get('pin') || '').trim();
      const portalPin = String(localStorage.getItem('PLANNER_PIN') || sessionStorage.getItem('PLANNER_PIN') || '').trim();
      if (queryPin) return queryPin;
      if (portalSid && portalSid !== studentId) return '';
      return portalPin;
    }
    function importPortalPlannerSession() {
      if (!studentId) return;
      const portalPin = getPortalPlannerPinCandidate();
      if (!portalPin) return;
      pin = portalPin;
      authStore().setItem(authKey(), 'true');
      authStore().setItem(pinKey(), portalPin);
      localStorage.setItem('PLANNER_SID', studentId);
      localStorage.setItem('PLANNER_PIN', portalPin);
      if (params.has('pin')) {
        params.delete('pin');
        const query = params.toString();
        history.replaceState(null, '', location.pathname + (query ? `?${query}` : '') + location.hash);
      }
    }
    function isMobile() { return window.innerWidth < 768; }
    function addDays(date, days) {
      const d = new Date(date.getFullYear(), date.getMonth(), date.getDate());
      d.setDate(d.getDate() + days);
      return d;
    }
    function formatDate(date) { return date.toLocaleDateString('sv-SE'); }
    function monthBounds(month) {
      const [y, m] = month.split('-').map(Number);
      const first = new Date(y, m - 1, 1);
      const last = new Date(y, m, 0);
      return { from: formatDate(first), to: formatDate(last), year: y, monthNo: m };
    }
    function invalidatePlannerIndex() {
      plannerIndex = null;
    }
    function setPlannerData(nextPlans, nextFeedback) {
      plans = Array.isArray(nextPlans) ? nextPlans : [];
      feedback = Array.isArray(nextFeedback) ? nextFeedback : [];
      invalidatePlannerIndex();
    }
    function upsertPlannerPlans(rows) {
      const nextRows = Array.isArray(rows) ? rows : [];
      if (!nextRows.length) return;
      const byId = new Map(plans.map(p => [String(p.id || ''), p]));
      nextRows.forEach(row => {
        const id = String(row && row.id || '');
        if (!id) return;
        byId.set(id, Object.assign({}, byId.get(id) || {}, row));
      });
      plans = Array.from(byId.values()).sort((a,b) =>
        String(a.plan_date || '').localeCompare(String(b.plan_date || '')) ||
        String(a.created_at || '').localeCompare(String(b.created_at || '')) ||
        String(a.id || '').localeCompare(String(b.id || ''))
      );
      invalidatePlannerIndex();
    }
    function patchPlannerPlan(planId, changes) {
      const id = String(planId || '');
      let changed = false;
      plans = plans.map(p => {
        if (String(p.id || '') !== id) return p;
        changed = true;
        return Object.assign({}, p, changes || {});
      });
      if (changed) invalidatePlannerIndex();
      return changed;
    }
    function removePlannerPlan(planId) {
      const id = String(planId || '');
      const before = plans.length;
      plans = plans.filter(p => String(p.id || '') !== id);
      if (plans.length !== before) invalidatePlannerIndex();
    }
    function getPlannerIndex() {
      if (plannerIndex) return plannerIndex;

      const byDate = {};
      const planDateMap = {};
      let monthTotal = 0;
      let monthDone = 0;

      plans.forEach(p => {
        const d = String(p.plan_date || '');
        if (!d) return;
        if (!byDate[d]) byDate[d] = [];
        byDate[d].push(p);
        if (!planDateMap[d]) planDateMap[d] = { total:0, done:0 };
        planDateMap[d].total++;
        if (Number(p.is_done || 0) === 1) planDateMap[d].done++;
        if (d.slice(0, 7) === currentMonth) {
          monthTotal++;
          if (Number(p.is_done || 0) === 1) monthDone++;
        }
      });

      Object.keys(byDate).forEach(date => {
        byDate[date].sort((a,b) =>
          String(a.created_at || '').localeCompare(String(b.created_at || '')) ||
          String(a.id || '').localeCompare(String(b.id || ''))
        );
      });

      const feedbackByDate = {};
      feedback.forEach(f => {
        const d = String(f && f.feedback_date || '');
        if (d) feedbackByDate[d] = f;
      });

      plannerIndex = {
        byDate,
        planDateMap,
        feedbackByDate,
        monthTotal,
        monthDone
      };
      return plannerIndex;
    }
    function getPlanDateMap() {
      return getPlannerIndex().planDateMap;
    }
    function plansForDate(date) {
      return (getPlannerIndex().byDate[String(date)] || []).slice();
    }
    function feedbackForDate(date) {
      return getPlannerIndex().feedbackByDate[String(date)] || null;
    }
    function calcDDay() {
      if (!examDate) return null;
      const today = new Date(todayStr() + 'T00:00:00');
      const exam = new Date(examDate + 'T00:00:00');
      return Math.ceil((exam - today) / 86400000);
    }

    function openExamDateEditor() {
      const existing = document.getElementById('exam-date-editor-overlay');
      if (existing) { closeExamDateEditor(); return; }

      const overlay = document.createElement('div');
      overlay.id = 'exam-date-editor-overlay';
      overlay.className = 'modal-overlay show';
      overlay.innerHTML = `
        <section class="modal exam-date-modal" role="dialog" aria-modal="true" aria-labelledby="exam-date-title">
          <div class="modal-heading"><h2 id="exam-date-title" class="modal-title">시험일 설정</h2><button class="modal-close" type="button" aria-label="시험일 설정 닫기" onclick="closeExamDateEditor()">×</button></div>
          <p class="muted modal-date">시험일까지 남은 날을 확인하고 반복 계획의 종료일로 사용해요.</p>
          <label class="field-label" for="exam-date-input">시험 날짜</label>
          <input id="exam-date-input" class="input" type="date" value="${escapeHtml(examDate || '')}">
          <div class="modal-actions">
            <button class="btn" type="button" onclick="closeExamDateEditor()">취소</button>
            <button id="exam-date-save" class="btn btn-primary" type="button" onclick="saveExamDate()">시험일 저장</button>
          </div>
        </section>`;
      overlay.addEventListener('click', e => { if (e.target === overlay) closeExamDateEditor(); });
      document.body.appendChild(overlay);
      setTimeout(() => document.getElementById('exam-date-input')?.focus(), 80);
    }

    function closeExamDateEditor() {
      document.getElementById('exam-date-editor-overlay')?.remove();
      document.querySelector('.stat-edit')?.focus({ preventScroll: true });
    }

    async function saveExamDate() {
      const input = document.getElementById('exam-date-input');
      const newDate = String(input?.value || '').trim();
      if (!newDate || !/^\d{4}-\d{2}-\d{2}$/.test(newDate)) {
        toast('날짜를 올바르게 입력하세요.');
        return;
      }
      try {
        await apiSend(`planner/settings`, 'PATCH', {
          student_id: studentId,
          pin,
          planner_exam_date: newDate
        });
        examDate = newDate;
        document.getElementById('exam-date-editor-overlay')?.remove();
        toast('시험일이 저장되었습니다.');
        renderPlanner();
        document.querySelector('.stat-edit')?.focus({ preventScroll: true });
      } catch (e) {
        toast(e.message || '저장 중 오류가 발생했습니다.');
      }
    }
    function getMonthCompletionRate() {
      const idx = getPlannerIndex();
      if (!idx.monthTotal) return 0;
      return Math.round((idx.monthDone / idx.monthTotal) * 100);
    }

    async function apiGet(path) {
      const r = await fetch(`${API_BASE}/${path}`, { headers: { 'Content-Type': 'application/json' } });
      const data = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(data.error || data.message || '요청 실패');
      return data;
    }
    async function apiSend(path, method, body) {
      if (isTeacherPreview) throw new Error('선생님 미리보기에서는 저장할 수 없습니다.');
      const r = await fetch(`${API_BASE}/${path}`, {
        method,
        headers: { 'Content-Type': 'application/json' },
        body: body ? JSON.stringify(body) : undefined
      });
      const data = await r.json().catch(() => ({}));
      if (!r.ok || data.success === false) throw new Error(data.error || data.message || '요청 실패');
      return data;
    }

    async function initPlanner() {
      if (isTeacherPreview) {
        $('mobile-add-btn').style.display = 'none';
        renderError('학습 플래너는 학생 본인의 PIN이 필요한 기능입니다. 선생님 미리보기에서는 열람·저장할 수 없습니다.');
        return;
      }
      if (!studentId) {
        renderError('학생 링크가 올바르지 않습니다.');
        return;
      }

      importPortalPlannerSession();

      const savedAuth = authStore().getItem(authKey());
      const savedPin = authStore().getItem(pinKey());

      if (savedAuth === 'true' && savedPin) {
        pin = savedPin;
        try {
          await verifyPin(true);
          return;
        } catch (e) {
          authStore().removeItem(authKey());
          authStore().removeItem(pinKey());
        }
      }

      renderPinGate();
    }

    function renderError(message) {
      $('student-chip').textContent = '';
      $('app').innerHTML = `
        <div class="pin-wrap">
          <div class="pin-card">
            <div class="pin-kicker">AP Math · 학습 플래너</div>
            <h1 class="pin-title">플래너를 열 수 없어요</h1>
            <p class="pin-desc">${escapeHtml(message)}</p><a class="btn" href="../student/">학생 포털로 돌아가기</a>
          </div>
        </div>
      `;
    }

    function renderPinGate() {
      $('student-chip').textContent = '';
      $('mobile-add-btn').style.display = 'none';
      $('app').innerHTML = `
        <div class="pin-wrap">
          <div class="pin-card">
            <div class="pin-kicker">AP Math · 학습 플래너</div>
            <h1 class="pin-title">개인 PIN 확인</h1>
            <p class="pin-desc">선생님께 받은 PIN으로<br>나의 학습 계획을 확인하세요.</p>
            <div style="display:flex; flex-direction:column; gap:10px;">
              <label class="field-label" for="pin-input">개인 PIN</label>
              <input id="pin-input" class="input" type="password" inputmode="numeric" autocomplete="current-password" placeholder="개인 PIN 입력" onkeydown="if(event.key==='Enter')verifyPin(false)">
              <button class="btn apms-button apms-button--primary btn-primary" onclick="verifyPin(false)">플래너 열기</button>
            </div>
            <div class="muted" style="margin-top:16px; text-align:center;">공용 기기에서는 사용 후 브라우저를 닫아주세요.</div>
          </div>
        </div>
      `;
      setTimeout(() => $('pin-input')?.focus(), 80);
    }

    async function verifyPin(fromSession) {
      if (!fromSession) {
        pin = String($('pin-input')?.value || '').trim();
      }
      if (!pin) {
        toast('PIN을 입력하세요.');
        return;
      }

      try {
        const data = await apiGet(`planner-auth?student_id=${encodeURIComponent(studentId)}&pin=${encodeURIComponent(pin)}`);
        if (!data?.success || !data?.student) {
          authStore().removeItem(authKey());
          authStore().removeItem(pinKey());
          if (fromSession) {
            throw new Error(data?.error || 'session expired');
          }
          const input = $('pin-input');
          if (input) {
            input.value = '';
            input.focus();
          }
          toast(data?.error || 'PIN이 올바르지 않습니다.');
          return;
        }

        student = data.student;
        window.StudentPortalNavigation?.setContext({ preview: false, studentId });
        authStore().setItem(authKey(), 'true');
        authStore().setItem(pinKey(), pin);
        $('student-chip').textContent = student.name || '';
        await loadPlannerData();
        renderPlanner();
      } catch (e) {
        authStore().removeItem(authKey());
        authStore().removeItem(pinKey());
        toast('인증 중 오류가 발생했습니다.');
      }
    }

    async function loadPlannerData() {
      const { from, to } = monthBounds(currentMonth);
      const data = await apiGet(`planner?student_id=${encodeURIComponent(studentId)}&from=${encodeURIComponent(from)}&to=${encodeURIComponent(to)}&pin=${encodeURIComponent(pin)}`);
      if (data.planner_exam_date) examDate = data.planner_exam_date;
      setPlannerData(data.plans, data.feedback);
    }

    function renderPlanner() {
      if (isMobile()) renderMobilePlanner();
      else renderPCPlanner();
      $('mobile-add-btn').style.display = isMobile() ? 'flex' : 'none';
    }

    function renderStats() {
      const dday = calcDDay();
      const rate = getMonthCompletionRate();
      const todayPlans = plansForDate(todayStr());
      const todayDone = todayPlans.filter(p => Number(p.is_done || 0) === 1).length;
      return `
        <div class="hero">
          <button class="stat stat-edit" onclick="openExamDateEditor()" title="시험일 설정" aria-label="시험일 ${dday === null ? '미설정' : escapeHtml(examDate)}. 설정 열기">
            <span class="stat-label">시험일 설정</span>
            <span class="stat-value">${dday === null ? '설정하기' : (dday >= 0 ? `D-${dday}` : `D+${Math.abs(dday)}`)}</span>
          </button>
          <div class="stat">
            <div class="stat-label">오늘 완료</div>
            <div class="stat-value">${todayDone}/${todayPlans.length}</div>
          </div>
          <div class="stat">
            <div class="stat-label">이번 달 완료율</div>
            <div class="stat-value">${rate}%</div>
            <div class="progress-wrap" role="progressbar" aria-label="이번 달 완료율" aria-valuenow="${rate}" aria-valuemin="0" aria-valuemax="100"><div class="progress-bar" style="width:${rate}%"></div></div>
          </div>
        </div>
      `;
    }

    function renderFeedbackBanner() {
      const f = feedbackForDate(selectedDate);
      if (!f) return '';
      const badge = f.badge ? `<span style="font-size:18px; margin-right:4px;">${escapeHtml(f.badge)}</span>` : '';
      const text = f.teacher_comment || '피드백이 도착했습니다.';
      return `
        <div class="feedback">
          <div class="feedback-title">${badge}담임 피드백</div>
          <div class="feedback-text">${escapeHtml(text)}</div>
        </div>
      `;
    }

    function renderPlannerIntro() {
      return `<section class="tool-intro"><p class="tool-eyebrow">학습 도구</p><h1 class="tool-title">나의 학습 계획</h1><p class="tool-description">오늘 할 일을 정하고, 하나씩 마무리해요.</p></section>`;
    }

    function renderPlannerDateNav() {
      const date = new Date(`${selectedDate}T00:00:00`);
      const previous = formatDate(addDays(date, -1));
      const next = formatDate(addDays(date, 1));
      return `<div class="planner-date-nav" aria-label="계획 날짜 이동">
        <button class="btn date-arrow" aria-label="이전 날짜" onclick="selectDate('${previous}')">‹</button>
        <label class="date-field"><span class="sr-only">계획 날짜</span><input class="input" type="date" value="${selectedDate}" onchange="if(this.value)selectDate(this.value)"></label>
        <button class="btn date-arrow" aria-label="다음 날짜" onclick="selectDate('${next}')">›</button>
        <button class="btn date-today" onclick="selectDate(todayStr())">오늘</button>
      </div>`;
    }

    function renderPCPlanner() {
      $('app').innerHTML = `
        ${renderPlannerIntro()}
        ${renderStats()}
        ${renderFeedbackBanner()}
        <div class="dashboard">
          <section class="side" aria-label="월별 계획 달력">
            <div class="card calendar-card">
              ${renderCalendar(Number(currentMonth.slice(0,4)), Number(currentMonth.slice(5,7)))}
              <p class="calendar-hint"><span class="calendar-key complete"></span>모두 완료 <span class="calendar-key pending"></span>진행 중</p>
            </div>
          </section>
          <section aria-label="선택한 날짜의 계획">
            ${renderPlannerDateNav()}
            <div class="card apms-card">
              ${renderPlanPanel()}
            </div>
          </section>
        </div>
      `;
    }

    function renderMobilePlanner() {
      $('app').innerHTML = `
        ${renderPlannerIntro()}
        ${renderStats()}
        ${renderFeedbackBanner()}
        ${renderPlannerDateNav()}
        <details class="mobile-calendar card" ${plannerCalendarOpen ? 'open' : ''} ontoggle="if(this.isConnected)plannerCalendarOpen=this.open">
          <summary>월별 달력 보기<span class="muted">${currentMonth.replace('-', '. ')}</span></summary>
          <div class="mobile-calendar-content">${renderCalendar(Number(currentMonth.slice(0,4)), Number(currentMonth.slice(5,7)))}</div>
          <p class="calendar-hint"><span class="calendar-key complete"></span>모두 완료 <span class="calendar-key pending"></span>진행 중</p>
        </details>
        <div class="card apms-card">
          ${renderPlanPanel()}
        </div>
      `;
    }

    function renderCalendar(year, monthNo) {
      const first = new Date(year, monthNo - 1, 1);
      const last = new Date(year, monthNo, 0);
      const startDay = first.getDay();
      const total = last.getDate();
      const planMap = getPlanDateMap();

      const cells = [];
      for (let i = 0; i < startDay; i++) cells.push(`<button class="day out" disabled></button>`);
      for (let d = 1; d <= total; d++) {
        const date = `${year}-${String(monthNo).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
        const p = planMap[date];
        const cls = [
          'day',
          date === selectedDate ? 'selected' : '',
          date === todayStr() ? 'today' : '',
          p && p.total > 0 && p.done === p.total ? 'done-full' : '',
          p && p.total > 0 && p.done < p.total ? 'done-part' : ''
        ].filter(Boolean).join(' ');
        cells.push(`<button class="${cls}" aria-label="${year}년 ${monthNo}월 ${d}일${p ? `, ${p.done}/${p.total}개 완료` : ''}" aria-pressed="${date === selectedDate}" ${date === todayStr() ? 'aria-current="date"' : ''} onclick="selectDate('${date}')">${d}</button>`);
      }

      const prev = new Date(year, monthNo - 2, 1);
      const next = new Date(year, monthNo, 1);

      return `
        <div class="calendar-head">
          <button class="btn apms-button apms-button--quiet calendar-arrow" aria-label="이전 달" onclick="changeMonth('${formatDate(prev).slice(0,7)}')">‹</button>
          <div class="calendar-title">${year}년 ${monthNo}월</div>
          <button class="btn apms-button apms-button--quiet calendar-arrow" aria-label="다음 달" onclick="changeMonth('${formatDate(next).slice(0,7)}')">›</button>
        </div>
        <div class="calendar-grid">
          ${['일','월','화','수','목','금','토'].map(w => `<div class="weekday">${w}</div>`).join('')}
          ${cells.join('')}
        </div>
      `;
    }

    function renderPlanPanel() {
      const datePlans = plansForDate(selectedDate);
      return `
        <div class="plan-head">
          <div>
            <h2 class="plan-title">${selectedDate === todayStr() ? '오늘 할 일' : '선택한 날의 할 일'}</h2>
            <div class="plan-date">${selectedDate}</div>
          </div>
          <button class="btn apms-button apms-button--quiet lock-planner" onclick="resetAuth()">잠금</button>
        </div>
        <div class="plan-list">
          ${datePlans.length ? datePlans.map(renderPlanItem).join('') : `<div class="empty apms-empty"><strong>아직 할 일이 없어요.</strong><br>오늘 공부할 내용을 하나 적어 보세요.</div>`}
        </div>
        <div class="quick-form">
          <label class="quick-title-field"><span class="field-label">할 일</span><input id="quick-title" class="input" placeholder="예: 이차방정식 10문제 풀기" onkeydown="if(event.key==='Enter')saveQuickPlan()"></label>
          <label><span class="field-label">과목</span><input id="quick-subject" class="input" placeholder="과목" value="수학"></label>
          <button class="btn apms-button apms-button--primary btn-primary" onclick="saveQuickPlan()">추가</button>
        </div>
      `;
    }

    function renderPlanItem(plan) {
      const done = Number(plan.is_done || 0) === 1;
      const planId = escapeJsString(plan.id);
      const updatedAt = escapeJsString(plan.updated_at || '');
      const nextDone = done ? 0 : 1;
      return `
        <div class="plan-item">
          <button class="check ${done ? 'done' : ''}" onclick="toggleDone('${planId}', ${nextDone}, '${updatedAt}')" aria-label="${escapeHtml(plan.title)} ${done ? '완료 해제' : '완료 표시'}" aria-pressed="${done}">${done ? plannerIconSvg('done') : ''}</button>
          <div class="plan-main ${done ? 'done' : ''}">
            <div class="plan-item-title">${escapeHtml(plan.title)}</div>
            <div class="plan-sub">${escapeHtml(plan.subject || '수학')}${plan.repeat_rule ? ` · ${plan.repeat_rule === 'daily' ? '매일' : '매주'}` : ''}</div>
            ${renderPlanStatusBadges(plan, done)}
          </div>
          <div class="planner-action-row">
            <button class="planner-action-btn primary" onclick="startPlannerTimerForPlan('${planId}')">${plannerIconSvg('focus')}<span>집중 시작</span></button>
            <button class="planner-action-btn" onclick="toggleDone('${planId}', ${nextDone}, '${updatedAt}')">${plannerIconSvg('done')}<span>${done ? '해제' : '완료'}</span></button>
            <button class="planner-action-btn danger" aria-label="${escapeHtml(plan.title)} 삭제" onclick="deletePlan('${planId}')">${plannerIconSvg('locked')}<span>삭제</span></button>
          </div>
        </div>
      `;
    }

    async function selectDate(date) {
      selectedDate = date;
      if (selectedDate.slice(0,7) !== currentMonth) {
        currentMonth = selectedDate.slice(0,7);
        await loadPlannerData();
      }
      renderPlanner();
    }

    async function changeMonth(month) {
      currentMonth = month;
      const bounds = monthBounds(month);
      selectedDate = bounds.from;
      await loadPlannerData();
      renderPlanner();
    }

    async function saveQuickPlan() {
      const title = String($('quick-title')?.value || '').trim();
      const subject = String($('quick-subject')?.value || '수학').trim();
      if (!title) {
        toast('할 일을 입력하세요.');
        return;
      }
      await savePlan({ title, subject, repeat_rule: null });
    }

    function openAddModal(date) {
      plannerModalOpener = document.activeElement;
      $('modal-title').textContent = '할 일 추가';
      $('modal-body').innerHTML = `
        <div style="display:flex; flex-direction:column; gap:10px;">
          <p class="muted modal-date">${escapeHtml(date)}의 계획</p>
          <label class="field-label" for="modal-title-input">할 일</label>
          <input id="modal-title-input" class="input" placeholder="예: 이차방정식 10문제 풀기">
          <label class="field-label" for="modal-subject-input">과목</label>
          <input id="modal-subject-input" class="input" placeholder="과목" value="수학">
          <label class="field-label" for="modal-repeat-input">반복</label>
          <select id="modal-repeat-input" class="input">
            <option value="">반복 없음</option>
            <option value="daily">매일 반복</option>
            <option value="weekly">매주 반복</option>
          </select>
          <div class="muted">${escapeHtml(getRepeatHintText())}</div>
          <div class="modal-actions"><button class="btn" onclick="closeModal()">취소</button><button class="btn apms-button apms-button--primary btn-primary" onclick="saveModalPlan('${date}')">계획 저장</button></div>
        </div>
      `;
      $('modal-overlay').classList.add('show');
      setTimeout(() => $('modal-title-input')?.focus(), 80);
    }

    function closeModal(force = false) {
      const title = String($('modal-title-input')?.value || '').trim();
      const subject = String($('modal-subject-input')?.value || '수학').trim();
      const repeat = String($('modal-repeat-input')?.value || '');
      if (!force && (title || subject !== '수학' || repeat) && !confirm('입력한 계획을 저장하지 않고 닫을까요?')) return;
      $('modal-overlay').classList.remove('show');
      const opener = plannerModalOpener?.isConnected && plannerModalOpener.getClientRects().length
        ? plannerModalOpener : (isMobile() ? $('mobile-add-btn') : $('quick-title'));
      opener?.focus({ preventScroll: true });
    }

    async function saveModalPlan(date) {
      const title = String($('modal-title-input')?.value || '').trim();
      const subject = String($('modal-subject-input')?.value || '수학').trim();
      const repeat_rule = String($('modal-repeat-input')?.value || '').trim() || null;
      if (!title) {
        toast('할 일을 입력하세요.');
        return;
      }
      if (await savePlan({ title, subject, repeat_rule, date })) closeModal(true);
    }

    async function savePlan(data) {
      let saved = false;
      try {
        const result = await apiSend('planner', 'POST', {
          student_id: studentId,
          pin,
          plan_date: data.date || selectedDate,
          title: data.title,
          subject: data.subject || '수학',
          repeat_rule: data.repeat_rule || null,
          exam_date: examDate
        });
        saved = true;
        toast('저장되었습니다.');
        if (Array.isArray(result.plans)) {
          upsertPlannerPlans(result.plans);
        } else {
          await loadPlannerData();
        }
        renderPlanner();
        return true;
      } catch (e) {
        toast(saved ? '계획은 저장했어요. 목록을 불러오려면 새로고침해 주세요.' : (e.message || '저장 실패'));
        return saved;
      }
    }

    async function toggleDone(planId, isDone, updatedAt) {
      try {
        const result = await apiSend(`planner/${encodeURIComponent(planId)}`, 'PATCH', {
          student_id: studentId,
          pin,
          is_done: isDone,
          updated_at: updatedAt || ''
        });
        if (result.plan) {
          upsertPlannerPlans([result.plan]);
        } else if (!patchPlannerPlan(planId, { is_done: isDone ? 1 : 0, updated_at: new Date().toISOString() })) {
          await loadPlannerData();
        }
        renderPlanner();
      } catch (e) {
        toast(e.message || '변경 실패');
      }
    }

    async function deletePlan(planId) {
      if (!confirm('삭제하시겠습니까?')) return;
      try {
        await apiSend(`planner/${encodeURIComponent(planId)}?student_id=${encodeURIComponent(studentId)}&pin=${encodeURIComponent(pin)}`, 'DELETE');
        toast('삭제되었습니다.');
        removePlannerPlan(planId);
        renderPlanner();
      } catch (e) {
        toast(e.message || '삭제 실패');
      }
    }

    function resetAuth() {
      authStore().removeItem(authKey());
      authStore().removeItem(pinKey());
      try {
        localStorage.removeItem('PLANNER_SID');
        localStorage.removeItem('PLANNER_PIN');
        sessionStorage.removeItem('PLANNER_SID');
        sessionStorage.removeItem('PLANNER_PIN');
      } catch (e) {}
      pin = '';
      student = null;
      plans = [];
      feedback = [];
      invalidatePlannerIndex();
      closePlannerTimer();
      renderPinGate();
    }

    document.addEventListener('studentportal:before-navigate', event => {
      if ($('modal-overlay')?.classList.contains('show')) {
        closeModal();
        if ($('modal-overlay').classList.contains('show')) event.preventDefault();
      }
      if (!event.defaultPrevented && plannerTimerActive && !confirm('집중 타이머를 종료하고 이동할까요?')) event.preventDefault();
    });

    document.addEventListener('keydown', event => {
      if (event.isComposing || event.keyCode === 229) return;
      const examDateOverlay = $('exam-date-editor-overlay');
      const overlay = examDateOverlay || $('modal-overlay');
      if (!overlay?.classList.contains('show')) return;
      if (event.key === 'Escape') {
        event.preventDefault();
        if (examDateOverlay) closeExamDateEditor();
        else closeModal();
      }
      if (event.key !== 'Tab') return;
      const controls = [...overlay.querySelectorAll('button, input, select, textarea, a[href]')].filter(el => !el.disabled && el.getClientRects().length);
      const first = controls[0];
      const last = controls[controls.length - 1];
      if (event.shiftKey && document.activeElement === first) { event.preventDefault(); last?.focus(); }
      else if (!event.shiftKey && document.activeElement === last) { event.preventDefault(); first?.focus(); }
    });

    window.addEventListener('resize', () => {
      clearTimeout(window.__resizeTimer);
      window.__resizeTimer = setTimeout(() => {
        if (student) renderPlanner();
      }, 150);
    });

    initPlanner();
  </script>
</body>
</html>
