<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330" role="img" aria-labelledby="title desc">
  <title id="title">문항 5 합성함수 대응도 해설</title>
  <desc id="desc">세 집합 X, Y, Z의 원소 1, 2, 3과 함수 f, g의 대응을 표시하고 f(1)=2, f(2)=3, g(1)=2를 강조한 대응도</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 z" fill="#334155"/>
    </marker>
    <marker id="focusArrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="330" rx="14" fill="#ffffff"/>
  <g fill="none" stroke="#64748b" stroke-width="2">
    <ellipse cx="140" cy="170" rx="72" ry="112"/>
    <ellipse cx="380" cy="170" rx="72" ry="112"/>
    <ellipse cx="620" cy="170" rx="72" ry="112"/>
  </g>
  <g fill="#0f172a" font-family="Arial, sans-serif" text-anchor="middle">
    <text x="140" y="40" font-size="22" font-weight="700">X</text>
    <text x="380" y="40" font-size="22" font-weight="700">Y</text>
    <text x="620" y="40" font-size="22" font-weight="700">Z</text>
    <text x="260" y="26" font-size="18" font-style="italic">f</text>
    <text x="500" y="26" font-size="18" font-style="italic">g</text>
    <text x="140" y="126" font-size="18">1</text><text x="140" y="176" font-size="18">2</text><text x="140" y="226" font-size="18">3</text>
    <text x="380" y="126" font-size="18">1</text><text x="380" y="176" font-size="18">2</text><text x="380" y="226" font-size="18">3</text>
    <text x="620" y="126" font-size="18">1</text><text x="620" y="176" font-size="18">2</text><text x="620" y="226" font-size="18">3</text>
  </g>
  <g fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)">
    <path d="M178 120 L342 170"/><path d="M178 170 L342 220"/><path d="M178 220 L342 120"/>
    <path d="M418 120 L582 170"/><path d="M418 170 L582 120"/><path d="M418 220 L582 220"/>
  </g>
  <g fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#focusArrow)">
    <path d="M178 120 L342 170"/><path d="M418 120 L582 170"/><path d="M178 170 L342 220"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="16" fill="#1e3a8a">
    <rect x="80" y="276" width="600" height="34" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
    <text x="380" y="299" text-anchor="middle">f(1)=2, f(2)=3, g(1)=2 → (f∘g)(1)=3, (f∘f)(1)=3</text>
  </g>
</svg>
