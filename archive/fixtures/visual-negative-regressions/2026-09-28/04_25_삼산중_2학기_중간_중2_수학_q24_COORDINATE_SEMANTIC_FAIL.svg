<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 460" role="img" aria-labelledby="t d"><title id="t">세 지점에서 같은 거리인 외심</title><desc id="d">학교, 은행, 병원의 삼각형에서 수직이등분선의 교점 도서관을 나타낸다.</desc><g fill="none" stroke="#111" stroke-width="3"><polygon points="100,330 500,330 300,60"/><line x1="300" y1="25" x2="300" y2="430" stroke-dasharray="9 7"/><line x1="85" y1="83" x2="455" y2="392" stroke-dasharray="9 7"/><line x1="300" y1="263" x2="100" y2="330"/><line x1="300" y1="263" x2="500" y2="330"/><line x1="300" y1="263" x2="300" y2="60"/><circle cx="300" cy="263" r="6" fill="#111"/></g><g font-family="sans-serif" font-size="20" fill="#111"><text x="55" y="357">학교</text><text x="510" y="357">은행</text><text x="275" y="42">병원</text><text x="312" y="255">도서관 O</text><text x="140" y="445">O학교=O은행=O병원 → O는 외심</text></g></svg>