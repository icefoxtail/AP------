<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>빈 풀이노트 · JS 아카이브</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<link rel="stylesheet" href="archive2-tokens.css?v=20261110-shell-1">
<link rel="stylesheet" href="archive2-standalone.css?v=20261122-header-calm-1">
<link rel="stylesheet" href="archive2-navigation.css?v=20261124-exam-vault-1">
<link rel="stylesheet" href="note-sheet-paper.css?v=20261117-note-sheet-1">
<link rel="stylesheet" href="note-sheet.css?v=20261117-note-sheet-1">
</head>
<body class="archive2-standalone archive2-shell">
<header data-archive-navigation="standalone" data-archive-view="note-sheet" data-archive-title="빈 풀이노트" class="archive-navigation"></header>
<!-- 메뉴는 작은 스크립트라 첫 화면 전에 붙인다. AP Math OS 로그인 복원(archive-session)과 로그인 판정(session)이 먼저다. -->
<script src="archive-session.js"></script>
<script src="archive2-session.js?v=20261119-small-fixes-1"></script>
<script src="archive2-navigation.js?v=20261124-exam-vault-1"></script>
<main class="sa-main ns-main">
<div class="sa-head"><div><h1>빈 풀이노트</h1><p class="sa-lead">문제는 들어 있지 않습니다. 교재·쪽·번호를 적는 줄과 풀이 칸만 있는 A4 양식이라, 어떤 문제집으로 수업해도 학생이 풀이를 이 종이에 씁니다.</p></div></div>

<section class="ns-controls" aria-labelledby="ns-kinds-title">
<h2 id="ns-kinds-title" class="ns-section-title">양식과 장수</h2>
<div class="ns-kinds">
<div class="ns-kind is-on" data-kind-row="two">
<label class="ns-pick"><input type="checkbox" checked><span class="ns-pick-text"><strong>풀이노트 2문항</strong><small>한 쪽에 2문제. 풀이 칸이 넓은 양식</small></span></label>
<div class="ns-count" data-count><span class="ns-count-label" id="ns-count-two">장수</span><button type="button" class="ns-step" data-step="-1" aria-label="풀이노트 2문항 장수 줄이기"></button><input type="number" inputmode="numeric" min="1" max="30" value="1" aria-labelledby="ns-count-two"><button type="button" class="ns-step is-plus" data-step="1" aria-label="풀이노트 2문항 장수 늘리기"></button></div>
</div>
<div class="ns-kind" data-kind-row="four">
<label class="ns-pick"><input type="checkbox"><span class="ns-pick-text"><strong>풀이노트 4문항</strong><small>한 쪽에 4문제. 문제마다 칸이 작은 양식</small></span></label>
<div class="ns-count" data-count><span class="ns-count-label" id="ns-count-four">장수</span><button type="button" class="ns-step" data-step="-1" aria-label="풀이노트 4문항 장수 줄이기" disabled></button><input type="number" inputmode="numeric" min="1" max="30" value="1" aria-labelledby="ns-count-four" disabled><button type="button" class="ns-step is-plus" data-step="1" aria-label="풀이노트 4문항 장수 늘리기" disabled></button></div>
</div>
<div class="ns-kind" data-kind-row="desc">
<label class="ns-pick"><input type="checkbox"><span class="ns-pick-text"><strong>서술형 풀이노트 2문항</strong><small>조건 찾기 · 식 세우기 · 계산 · 답 쓰기 단계로 나뉜 양식</small></span></label>
<div class="ns-count" data-count><span class="ns-count-label" id="ns-count-desc">장수</span><button type="button" class="ns-step" data-step="-1" aria-label="서술형 풀이노트 2문항 장수 줄이기" disabled></button><input type="number" inputmode="numeric" min="1" max="30" value="1" aria-labelledby="ns-count-desc" disabled><button type="button" class="ns-step is-plus" data-step="1" aria-label="서술형 풀이노트 2문항 장수 늘리기" disabled></button></div>
</div>
<div class="ns-kind" data-kind-row="back">
<label class="ns-pick"><input type="checkbox"><span class="ns-pick-text"><strong>다시 풀기 4문항</strong><small>틀린 문제를 다시 풀 칸만 있는 양식</small></span></label>
<div class="ns-count" data-count><span class="ns-count-label" id="ns-count-back">장수</span><button type="button" class="ns-step" data-step="-1" aria-label="다시 풀기 4문항 장수 줄이기" disabled></button><input type="number" inputmode="numeric" min="1" max="30" value="1" aria-labelledby="ns-count-back" disabled><button type="button" class="ns-step is-plus" data-step="1" aria-label="다시 풀기 4문항 장수 늘리기" disabled></button></div>
</div>
</div>
<div class="ns-bar">
<p id="ns-summary" class="ns-summary" aria-live="polite">양식 1가지 · 모두 1장</p>
<button type="button" id="ns-print-button" class="primary ns-print-button">인쇄</button>
</div>
<p class="ns-hint">인쇄 창에서 용지는 A4, 배율은 100%로 두세요. 양식은 장수만큼 차례로 한 장씩 나옵니다.</p>
</section>

<section class="ns-preview-wrap" aria-labelledby="ns-preview-title">
<h2 id="ns-preview-title" class="ns-section-title">미리보기</h2>
<p class="ns-hint">양식마다 한 장씩 보여 줍니다. 인쇄하면 고른 장수만큼 나옵니다.</p>
<div id="ns-preview" class="ns-preview"></div>
</section>
</main>
<div id="ns-print" class="ns-print" aria-hidden="true"></div>
<script src="note-sheet.js?v=20261117-note-sheet-2"></script>
</body>
</html>
