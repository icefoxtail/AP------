/** [PASS] renderExam - Rulebook v1.9 + Image Field Synchronized */

async function renderExam(area, data) {
    const staging = document.getElementById('staging'); staging.style.width = '83mm'; staging.innerHTML = '';
    let pNum = 1;

    const items = data.map((q, i) => {
        const box = document.createElement('div'); box.className = 'q-box';
        
        const hasImageField = !!q.image;
        const rawContent = stripInlineImagesFromContent(q.content || q.question || '', hasImageField);
        const formattedContent = sanitizeProtectedSegments(
            normalizeQuestionNotes(
                normalizeViewBlocks(
                    normalizeQuestionTables(
                        formatQuestionContent(wrapLatex(rawContent), q)
                    )
                )
            )
        );

        const imageHTML = renderQuestionImageHTML(q);
        const choicesHTML = renderChoicesHTML(q);
        
        box.innerHTML = `<div class="q-num">${i + 1}.</div>
                         <div class="q-content">${formattedContent}</div>
                         ${imageHTML}
                         ${choicesHTML}`;
        
        staging.appendChild(box); return { q, box, originalIndex: i };
    });

    await applyAutoImageSizeClasses(staging);
    await typesetMath('exam-staging', [staging]); await raf();

    for (const item of items) {
        const p = {}; p.proxyHeight_raw = item.box.scrollHeight;
        item.box.classList.add('fit-tight'); await raf();
        p.proxyHeight_tight = item.box.scrollHeight;
        item.box.classList.remove('fit-tight'); item.profile = p;
    }

    const tempPage = makePage(area, 'exam', 0);
    const usablePageHeight = tempPage.body.clientHeight;
    area.removeChild(tempPage); pageCount = 0;

    // 2up은 "별도 페이지"가 아니라 현재 문항/쪽 설정의 세로 칸을 점유한다.
    // 예: qpp=4(2행×2열)에서 subjective-2up 1개는 한 열의 2행을 쓰고,
    // 반대 열에는 일반 문항 2개가 들어가므로 실제 출력 문항 수는 3개다.
    const usesSlotLayout = items.some(item => ['subjective-2up', 'subjective-4up'].includes(item.q.layoutTag || ''));
    if (usesSlotLayout) {
        const rowCount = Math.max(1, Math.ceil(AppState.qpp / 2));
        const spanFor = item => {
            const tag = item.q.layoutTag || '';
            if (tag === 'subjective-2up') return rowCount;
            if (tag === 'subjective-4up') return Math.max(1, Math.ceil(rowCount / 2));
            return 1;
        };
        const newSlotPage = () => ({ placements: [], occupied: Array.from({ length: rowCount }, () => [false, false]) });
        const findSlot = (pageData, span) => {
            for (let row = 0; row <= rowCount - span; row += 1) {
                for (let col = 0; col < 2; col += 1) {
                    let fits = true;
                    for (let offset = 0; offset < span; offset += 1) {
                        if (pageData.occupied[row + offset][col]) { fits = false; break; }
                    }
                    if (fits) return { row, col, span };
                }
            }
            return null;
        };
        const slotPages = [];
        let slotPage = newSlotPage();
        const flushSlotPage = () => {
            if (slotPage.placements.length) slotPages.push(slotPage);
            slotPage = newSlotPage();
        };

        for (const item of items) {
            const tag = item.q.layoutTag || '';
            if (tag === 'fullwidth') {
                flushSlotPage();
                slotPages.push({ wideItem: item });
                continue;
            }
            const span = Math.min(rowCount, spanFor(item));
            let placement = findSlot(slotPage, span);
            // 앞의 일반 문항을 한 열에 모을 수 있으면 다른 열 전체를 2up에 내준다.
            if (!placement && span === rowCount) {
                const usedSpan = slotPage.placements.reduce((sum, entry) => sum + entry.span, 0);
                if (usedSpan <= rowCount) {
                    slotPage.occupied = Array.from({ length: rowCount }, () => [false, false]);
                    let packedRow = 0;
                    slotPage.placements.forEach(entry => {
                        entry.row = packedRow; entry.col = 0;
                        for (let offset = 0; offset < entry.span; offset += 1) slotPage.occupied[packedRow + offset][0] = true;
                        packedRow += entry.span;
                    });
                    placement = findSlot(slotPage, span);
                }
            }
            if (!placement) {
                flushSlotPage();
                placement = findSlot(slotPage, span);
            }
            for (let offset = 0; offset < span; offset += 1) slotPage.occupied[placement.row + offset][placement.col] = true;
            slotPage.placements.push({ item, ...placement });
        }
        flushSlotPage();

        for (const slotPageData of slotPages) {
            const page = makePage(area, 'exam', ++pageCount);
            if (slotPageData.wideItem) {
                const wideCol = document.createElement('div');
                wideCol.style.cssText = 'flex:1; display:flex; flex-direction:column; padding:0 8px; min-height:0; overflow:hidden;';
                wideCol.appendChild(slotPageData.wideItem.box.cloneNode(true));
                page.body.appendChild(wideCol);
            } else {
                const grid = document.createElement('div'); grid.className = 'grid-container'; grid.style.flex = '1 1 0';
                const columns = [0, 1].map(() => { const col = document.createElement('div'); col.className = 'grid-col'; grid.appendChild(col); return col; });
                page.body.appendChild(grid);
                const hasSpecialPlacement = slotPageData.placements.some(entry => entry.span > 1);
                if (!hasSpecialPlacement) {
                    const ordered = slotPageData.placements.map(entry => entry.item);
                    const split = Math.ceil(ordered.length / 2);
                    ordered.slice(0, split).forEach(item => columns[0].appendChild(item.box.cloneNode(true)));
                    ordered.slice(split).forEach(item => columns[1].appendChild(item.box.cloneNode(true)));
                } else {
                    for (let col = 0; col < 2; col += 1) {
                        let row = 0;
                        while (row < rowCount) {
                            const placement = slotPageData.placements.find(entry => entry.col === col && entry.row === row);
                            if (placement) {
                                const clone = placement.item.box.cloneNode(true);
                                clone.style.flex = `${placement.span} 1 0`;
                                columns[col].appendChild(clone);
                                row += placement.span;
                            } else {
                                const spacer = document.createElement('div'); spacer.style.flex = '1 1 0';
                                columns[col].appendChild(spacer);
                                row += 1;
                            }
                        }
                    }
                }
            }
            if (rendererMode() === 'legacy') await typesetMath('exam-slot-page', [page]);
            await raf();
            const allPageBoxes = page.querySelectorAll('.q-box');
            allPageBoxes.forEach(box => fitQuestionBox(box));
            if (page.body.scrollHeight > usablePageHeight + SE_PAGE_TOLERANCE) {
                allPageBoxes.forEach(box => autoCompress(box));
                await raf();
                if (rendererMode() === 'legacy') await typesetMath('exam-slot-overflow', [page]);
            }
        }
        return;
    }

    let pages = [];
    let currentPage = { blocks: [], usedHeight: 0 };
    let activeChunk = []; let currentType = null;

    const flushBlock = () => {
        if (activeChunk.length === 0) return;
        const type = currentType; const chunk = [...activeChunk];
        let hType = (type === 'normal') ? 'proxyHeight_tight' : 'proxyHeight_raw';
        let blockH;
        
        if (type === 'wide') {
            blockH = chunk[0].profile.proxyHeight_raw + SE_OVERHEAD_COL + SE_OVERHEAD_GRID;
        } else {
            const split = Math.ceil(chunk.length / 2);
            const leftH = chunk.slice(0, split).reduce((s, it) => s + it.profile[hType], 0) + SE_OVERHEAD_COL;
            const rightH = chunk.slice(split).reduce((s, it) => s + it.profile[hType], 0) + SE_OVERHEAD_COL;
            blockH = Math.max(leftH, rightH) + SE_OVERHEAD_GRID;
        }

        const isNormalForceBreak = (type === 'normal' && currentPage.blocks.length > 0);
        const gap = (currentPage.blocks.length > 0) ? SE_BLOCK_GAP : 0;
        
        if ((isNormalForceBreak || (currentPage.usedHeight + gap + blockH > usablePageHeight)) && currentPage.blocks.length > 0) {
            pages.push(currentPage); currentPage = { blocks: [], usedHeight: 0 };
        }
        currentPage.usedHeight += (currentPage.blocks.length > 0 ? SE_BLOCK_GAP : 0) + blockH;
        currentPage.blocks.push({ type, items: chunk, blockH }); activeChunk = [];
    };

    items.forEach(item => {
        const lt = item.q.layoutTag || '';
        let qType = 'normal'; let limit = AppState.qpp;
        if (lt === 'fullwidth') { qType = 'wide'; limit = 1; }
        else if (lt === 'subjective-2up') { qType = 'subj2'; limit = 2; }
        else if (lt === 'subjective-4up') { qType = 'subj4'; limit = 4; }

        const isSpecialType = (qType === 'subj2' || qType === 'subj4' || qType === 'wide');
        const prevWasSpecial = (currentType === 'subj2' || currentType === 'subj4' || currentType === 'wide');
        if ((currentType !== null && currentType !== qType) || (activeChunk.length >= limit) || ((isSpecialType || prevWasSpecial) && currentPage.blocks.length > 0)) {
            flushBlock();
            if (isSpecialType && currentPage.blocks.length > 0) { pages.push(currentPage); currentPage = { blocks: [], usedHeight: 0 }; }
            currentType = qType;
        }
        if (currentType === null) currentType = qType;
        activeChunk.push(item);
    });
    flushBlock(); if (currentPage.blocks.length > 0) pages.push(currentPage);

    for (const pageData of pages) {
        const page = makePage(area, 'exam', ++pageCount);
        pageData.blocks.forEach((block, bIdx) => {
            if (block.type === 'wide') {
                const wideCol = document.createElement('div');
                wideCol.style.cssText = 'flex:1; display:flex; flex-direction:column; padding:0 8px; min-height:0; overflow:hidden;';
                wideCol.appendChild(block.items[0].box.cloneNode(true));
                page.body.appendChild(wideCol);
            } else {
                const bGrid = document.createElement('div');
                bGrid.className = 'grid-container';
                bGrid.style.flex = (block.type === 'normal') ? '1 1 0' : 'none';
                if (bIdx < pageData.blocks.length - 1) bGrid.style.marginBottom = SE_BLOCK_GAP + 'px';

                const bLeft = document.createElement('div'); bLeft.className = 'grid-col';
                const bRight = document.createElement('div'); bRight.className = 'grid-col';
                bGrid.appendChild(bLeft);
                bGrid.appendChild(bRight);
                page.body.appendChild(bGrid);

                const split = Math.ceil(block.items.length / 2);
                block.items.slice(0, split).forEach(it => bLeft.appendChild(it.box.cloneNode(true)));
                block.items.slice(split).forEach(it => bRight.appendChild(it.box.cloneNode(true)));
            }
        });

        if (rendererMode() === 'legacy') await typesetMath('exam-page', [page]);
        await raf();

        const allPageBoxes = page.querySelectorAll('.q-box');
        allPageBoxes.forEach(b => fitQuestionBox(b));

        if (page.body.scrollHeight > usablePageHeight + SE_PAGE_TOLERANCE) {
            allPageBoxes.forEach(b => autoCompress(b));
            await raf();
            if (rendererMode() === 'legacy') await typesetMath('exam-page-overflow', [page]);
        }
    }
}

/** [성역] renderSol - 엄격한 원본 유지 (작업 범위 통제 준수) */
async function renderSol(area, data) {
    {
        const staging = document.getElementById('staging');
        staging.style.width = '83mm';
        staging.innerHTML = '';
        let pNum = 1;
        let cols;
        let colIdx = 0;
        const makeGridPage = () => {
            const p = makePage(area, 'sol', pNum++);
            const grid = document.createElement('div'); grid.className = 'grid-container';
            const l = document.createElement('div'); l.className = 'grid-col';
            const r = document.createElement('div'); r.className = 'grid-col';
            grid.appendChild(l); grid.appendChild(r); p.body.appendChild(grid);
            return { p, cols: [l, r] };
        };
        const advanceColumn = () => {
            if (colIdx === 0) colIdx = 1;
            else { ({ cols } = makeGridPage()); colIdx = 0; }
            return cols[colIdx];
        };
        const renderSplitSolutionBox = async (sourceBox, qNo) => {
            const originalExp = sourceBox.querySelector('.sol-exp');
            const chunks = makeSolutionHtmlChunks(sourceBox.dataset.solutionHtml || (originalExp ? originalExp.innerHTML : ''));
            const preparedChunks = chunks.map(chunkHtml => {
                const chunk = document.createElement('span');
                chunk.className = 'sol-chunk';
                chunk.innerHTML = chunkHtml;
                return chunk;
            });
            if (rendererMode() === 'batch') {
                const chunkStaging = document.createElement('div');
                chunkStaging.style.width = '83mm';
                preparedChunks.forEach(chunk => chunkStaging.appendChild(chunk));
                staging.appendChild(chunkStaging);
                await typesetMath('solution-split-staging', [chunkStaging]);
            }
            let shell = makeLongSolutionShell(sourceBox, qNo, false);
            let exp = shell.querySelector('.sol-exp');
            let targetCol = cols[colIdx];
            targetCol.appendChild(shell);

            for (const chunk of preparedChunks) {
                exp.appendChild(chunk);
                if (rendererMode() === 'legacy') {
                    await typesetMath('solution-split-chunk', [chunk]);
                    await raf();
                }
                if (targetCol.scrollHeight <= targetCol.clientHeight + 2) continue;

                if (exp.children.length > 1) {
                    exp.removeChild(chunk);
                    targetCol = advanceColumn();
                    shell = makeLongSolutionShell(sourceBox, qNo, true);
                    exp = shell.querySelector('.sol-exp');
                    targetCol.appendChild(shell);
                    exp.appendChild(chunk);
                    if (rendererMode() === 'legacy') await raf();
                }
                if (targetCol.scrollHeight > targetCol.clientHeight + 2) {
                    autoCompress(shell);
                    await raf();
                }
            }
        };
        const placeSolutionBox = async (box, qNo) => {
            while (true) {
                const targetCol = cols[colIdx];
                targetCol.appendChild(box);
                if (rendererMode() === 'legacy') await typesetMath('solution-box', [box]);
                await raf();
                if (targetCol.scrollHeight <= targetCol.clientHeight + 2) return;

                autoCompress(box);
                await raf();
                await raf();
                if (targetCol.scrollHeight <= targetCol.clientHeight + 2) return;

                const isOnlyBoxInColumn = targetCol.querySelectorAll('.sol-box').length === 1;
                targetCol.removeChild(box);
                if (isOnlyBoxInColumn) {
                    await renderSplitSolutionBox(box, qNo);
                    return;
                }
                advanceColumn();
            }
        };

        const solutionBoxes = data.map((q, i) => {
            const solText = q.solution || q.explanation || q.sol || '';
            const reminderRawContent = stripInlineImagesFromContent(q.content || q.question || '', !!q.image);
            const reminderContent = sanitizeProtectedSegments(
                normalizeQuestionNotes(
                    normalizeViewBlocks(
                        normalizeQuestionTables(
                            formatQuestionContent(wrapLatex(reminderRawContent), q)
                        )
                    )
                )
            );
            const solutionHtml = formatSolutionHtml(solText) + renderSolutionImageHTML(q);
            const box = document.createElement('div'); box.className = 'q-box sol-box';
            box.dataset.solutionHtml = solutionHtml;
            box.innerHTML = `<div class="q-num">${i + 1}.</div><div style="margin-bottom:8px; color:#555; font-size:8.5pt;">${reminderContent}</div><div class="sol-meta"><div class="sol-ans">[정답] ${wrapLatex(q.answer ?? '-')}</div><div class="sol-exp">${solutionHtml}</div></div>`;
            staging.appendChild(box);
            return box;
        });
        await Promise.all(Array.from(staging.querySelectorAll('img')).map(waitForQuestionImage));
        if (rendererMode() === 'batch') await typesetMath('solution-staging', [staging]);

        ({ cols } = makeGridPage());
        for (let i = 0; i < solutionBoxes.length; i++) {
            await placeSolutionBox(solutionBoxes[i], i + 1);
        }
        return;
    }
    let pNum = 1;
    function makeGridPage() {
        const p = makePage(area, 'sol', pNum++);
        const grid = document.createElement('div'); grid.className = 'grid-container';
        const l = document.createElement('div'); l.className = 'grid-col';
        const r = document.createElement('div'); r.className = 'grid-col';
        grid.appendChild(l); grid.appendChild(r); p.body.appendChild(grid);
        return { p, cols: [l, r] };
    }
    let { cols } = makeGridPage(); let colIdx = 0;

    async function placeSolutionBox(box) {
        let placed = false;
        while (!placed) {
            const targetCol = cols[colIdx];
            targetCol.appendChild(box);
            await typesetMath('solution-reminder-box', [box]);
            await raf();

            if (targetCol.scrollHeight <= targetCol.clientHeight + 2) {
                placed = true;
                break;
            }

            autoCompress(box);
            await raf();
            await raf();

            if (targetCol.scrollHeight <= targetCol.clientHeight + 2) {
                placed = true;
                break;
            }

            const isOnlyBoxInColumn = targetCol.querySelectorAll('.sol-box').length === 1;
            if (isOnlyBoxInColumn) {
                placed = true;
                break;
            }

            targetCol.removeChild(box);
            if (colIdx === 0) {
                colIdx = 1;
            } else {
                ({ cols } = makeGridPage());
                colIdx = 0;
            }
        }
    }

    for (let i = 0; i < data.length; i++) {
        const q = data[i];
        const box = document.createElement('div'); box.className = 'q-box sol-box';
        const solText = q.solution || q.explanation || q.sol || '해설이 없습니다.';

        const reminderRawContent = stripInlineImagesFromContent(q.content || q.question || '', !!q.image);
        const reminderContent = sanitizeProtectedSegments(
            normalizeQuestionNotes(
                normalizeViewBlocks(
                    normalizeQuestionTables(
                        formatQuestionContent(wrapLatex(reminderRawContent), q)
                    )
                )
            )
        );

        box.innerHTML = `<div class="q-num">${i+1}.</div>
                         <div style="margin-bottom:8px; color:#555; font-size:8.5pt;">${reminderContent}</div>
                         <div class="sol-meta"><div class="sol-ans">[정답] ${wrapLatex(q.answer ?? '–')}</div><div class="sol-exp">${formatSolutionHtml(solText)}${renderSolutionImageHTML(q)}</div></div>`;

        await placeSolutionBox(box);
    }
}

function formatGridAnswer(answer) {
    const value = String(answer ?? '–').replace(/\s+\/\s+(?=\(\d+\))/g, '<br>');
    return wrapLatex(value);
}

function renderAns(area, data, perPage = 40) {
    const PER_PAGE = perPage; // 기본 열당 20개, 실제 높이가 넘치면 renderBody에서 자동 축소한다
    let pCount = 1;

    for (let start = 0; start < data.length; start += PER_PAGE) {
        const chunk = data.slice(start, start + PER_PAGE);
        const p = makePage(area, 'ans', pCount++);
        const grid = document.createElement('div');
        grid.className = 'ans-grid';
        // 열 분할점을 4의 배수로 올려, 한 세트(4문제)가 두 열에 걸치지 않게 한다
        const splitIndex = Math.ceil(Math.ceil(chunk.length / 2) / 4) * 4;

        for (let i = 0; i < splitIndex; i++) {
            [i, splitIndex + i].forEach(idx => {
                const u = document.createElement('div');
                u.className = 'ans-cell';
                if (!chunk[idx]) {
                    u.classList.add('ans-cell-empty');
                    u.setAttribute('aria-hidden', 'true');
                    grid.appendChild(u);
                    return;
                }
                const num = start + idx + 1;
                if (num % 4 === 0) u.classList.add('group-end'); // 4문제마다 채점 구분선
                u.innerHTML = `<div class=\"ans-n\">${num}.</div><div class=\"ans-v\">${formatGridAnswer(chunk[idx].answer)}</div>`;
                grid.appendChild(u);
            });
        }

        p.body.appendChild(grid);
    }
}

function answerPagesOverflow(area) {
    return Array.from(area.querySelectorAll('.page')).some(page =>
        page.querySelector('.page-body')?.scrollHeight > page.querySelector('.page-body')?.clientHeight + 2
    );
}

async function fitAnswerPages(area, data) {
    if (!answerPagesOverflow(area)) return;
    for (const perPage of [32, 24, 16]) {
        area.innerHTML = '';
        renderAns(area, data, perPage);
        await typesetMath('answer-refit', [area]);
        if (!answerPagesOverflow(area)) return;
    }
}

// MathJax 로딩을 기다리되, 실패하거나 지연돼도 렌더를 막지 않는다.
// (여기서 예외를 흘리면 화면이 통째로 비어버리므로 반드시 삼킨다)
const AP_MATHJAX_WAIT_MS = 5000;
async function waitForMathJaxOrContinue(timeoutMs = AP_MATHJAX_WAIT_MS) {
    const deadline = ms => new Promise(resolve => setTimeout(() => resolve('timeout'), ms));
    try {
        if (window.__AP_MATHJAX_READY__) {
            const r = await Promise.race([window.__AP_MATHJAX_READY__, deadline(timeoutMs)]);
            if (r === 'timeout') console.warn('[engine] MathJax 로딩 지연 — 수식 없이 렌더를 계속합니다.');
        }
        if (window.MathJax?.startup?.promise) {
            const r = await Promise.race([window.MathJax.startup.promise, deadline(timeoutMs)]);
            if (r === 'timeout') console.warn('[engine] MathJax startup 지연 — 수식 없이 렌더를 계속합니다.');
        }
    } catch (error) {
        console.warn('[engine] MathJax 초기화 실패 — 수식 없이 렌더를 계속합니다.', error);
    }
}

// 렌더가 끝나기 전에 인쇄를 걸면 브라우저가 미완성 미리보기로 인쇄 잡을 만들어
// EMF 변환 단계에서 물릴 수 있다. 렌더 완료 시점을 safePrint가 기다릴 수 있게 노출한다.
window.__AP_RENDER_READY__ = Promise.resolve();

async function render() {
    let markRendered;
    window.__AP_RENDER_READY__ = new Promise(resolve => { markRendered = resolve; });
    window.APRenderLoop?.start({ mode: AppState.mode, questions: AppState.data.length });
    try {
        await renderBody();
    } finally {
        window.APRenderLoop?.finish(document.getElementById('print-area'));
        markRendered();
    }
}

async function renderBody() {
    await waitForMathJaxOrContinue();
    const area = document.getElementById('print-area');
    const staging = document.getElementById('staging');
    if (rendererMode() === 'batch' && window.MathJax?.typesetClear) {
        try { window.MathJax.typesetClear([area, staging]); } catch (error) { console.warn('[mixed-engine] 이전 수식 정리 실패', error); }
    }
    area.innerHTML = '';
    syncQrOutputControls();
    pageCount = 0;
    if (AppState.mode === 'ans') await measureRenderPhase('answer-layout', async () => renderAns(area, AppState.data));
    else if (AppState.mode === 'sol') await measureRenderPhase('solution-layout', () => renderSol(area, AppState.data));
    else await measureRenderPhase('exam-layout', () => renderExam(area, AppState.data));
    if (AppState.mode === 'ans' || rendererMode() === 'legacy') await typesetMath('render-final', [area]);
    if (AppState.mode === 'ans') await fitAnswerPages(area, AppState.data);
    injectQrToLastExamPage(area);
    injectSubmitQrToLastExamPage(area);
    updateScreenFitScale();
    registerBlueprintToOS(); // [3B-MIXED] 믹서 원본 문항 매핑 등록 — 비동기
    registerClassExamAssignmentToOS(); // [3H] 출제 이력 등록 — 비동기
}

const AP_PRINT_RASTER_DPI = 300;
const AP_PRINT_CSS_DPI = 96;

function waitForPrintImages(root, timeoutMs = 5000) {
    const images = Array.from(root?.querySelectorAll('img') || []);
    if (!images.length) return Promise.resolve();
    const waitOne = async image => {
        if (!image.complete) {
            await Promise.race([
                new Promise(resolve => {
                    image.addEventListener('load', resolve, { once: true });
                    image.addEventListener('error', resolve, { once: true });
                }),
                new Promise(resolve => setTimeout(resolve, timeoutMs))
            ]);
        }
        if (typeof image.decode === 'function') {
            await Promise.race([image.decode().catch(() => {}), new Promise(resolve => setTimeout(resolve, timeoutMs))]);
        }
    };
    return Promise.all(images.map(waitOne));
}

function canvasToPngBlob(canvas) {
    return new Promise((resolve, reject) => {
        canvas.toBlob(blob => blob ? resolve(blob) : reject(new Error('페이지 이미지 변환에 실패했습니다.')), 'image/png');
    });
}

function grayscaleCanvasInPlace(canvas) {
    const context = canvas.getContext('2d', { willReadFrequently: true });
    if (!context) throw new Error('그레이스케일 변환용 캔버스를 만들 수 없습니다.');
    const pixels = context.getImageData(0, 0, canvas.width, canvas.height);
    for (let index = 0; index < pixels.data.length; index += 4) {
        const gray = Math.round(
            pixels.data[index] * 0.299
            + pixels.data[index + 1] * 0.587
            + pixels.data[index + 2] * 0.114
        );
        pixels.data[index] = gray;
        pixels.data[index + 1] = gray;
        pixels.data[index + 2] = gray;
        pixels.data[index + 3] = 255;
    }
    context.putImageData(pixels, 0, 0);
}

function canvasToGrayscaleJpegBlob(canvas, quality = 0.92) {
    grayscaleCanvasInPlace(canvas);
    return new Promise((resolve, reject) => {
        canvas.toBlob(blob => blob ? resolve(blob) : reject(new Error('그레이스케일 JPEG 변환에 실패했습니다.')), 'image/jpeg', quality);
    });
}

// PS/PCL 드라이버가 페이지 안의 Type3 폰트·개별 텍스트 명령을 해석하지 않도록,
// 실제 A4 페이지 한 장을 300dpi 이미지 한 장으로 바꾼다. 원래 #print-area는 건드리지
// 않으므로 화면 열람과 일반 벡터 PDF 경로는 그대로 보존된다.
async function prepareRasterPrint() {
    const source = document.getElementById('print-area');
    const target = document.getElementById('print-raster-area');
    if (!source || !target) throw new Error('평탄화 인쇄 영역을 찾을 수 없습니다.');
    if (typeof window.html2canvas !== 'function') throw new Error('html2canvas 로컬 번들이 로드되지 않았습니다.');

    const pages = Array.from(source.querySelectorAll('.page'));
    if (!pages.length) throw new Error('평탄화할 페이지가 없습니다.');

    target.replaceChildren();
    await waitForPrintImages(source);
    if (document.fonts?.ready) await document.fonts.ready;

    const urls = [];
    const startedAt = performance.now();
    const scale = AP_PRINT_RASTER_DPI / AP_PRINT_CSS_DPI;
    const viewportWidth = Math.max(document.documentElement.clientWidth || 0, ...pages.map(page => Math.ceil(page.getBoundingClientRect().width)));
    const printParams = new URLSearchParams(window.location.search);
    const usePngFallback = printParams.get('rasterFormat') === 'png';

    try {
        for (let index = 0; index < pages.length; index += 1) {
            const page = pages[index];
            const canvas = await window.html2canvas(page, {
                backgroundColor: '#ffffff',
                scale,
                width: Math.ceil(page.offsetWidth),
                height: Math.ceil(page.offsetHeight),
                windowWidth: viewportWidth,
                windowHeight: Math.max(window.innerHeight || 0, Math.ceil(page.offsetHeight)),
                useCORS: true,
                allowTaint: false,
                imageTimeout: 10000,
                logging: false
            });
            const blob = usePngFallback
                ? await canvasToPngBlob(canvas)
                : await canvasToGrayscaleJpegBlob(canvas, 0.92);
            const url = URL.createObjectURL(blob);
            urls.push(url);

            const image = document.createElement('img');
            image.className = 'ap-print-raster-page';
            image.alt = `시험지 ${index + 1}쪽`;
            image.decoding = 'sync';
            image.src = url;
            target.appendChild(image);
            if (typeof image.decode === 'function') await image.decode().catch(() => {});

            // 다음 페이지로 넘어가기 전에 큰 캔버스의 backing store를 해제한다.
            canvas.width = 1;
            canvas.height = 1;
        }
    } catch (error) {
        urls.forEach(url => URL.revokeObjectURL(url));
        target.replaceChildren();
        throw error;
    }

    const summary = {
        mode: usePngFallback ? 'page-raster-png' : 'page-grayscale-jpeg',
        format: usePngFallback ? 'png' : 'jpeg',
        quality: usePngFallback ? null : 0.92,
        dpi: AP_PRINT_RASTER_DPI,
        pageCount: pages.length,
        elapsedMs: Number((performance.now() - startedAt).toFixed(1))
    };
    target.dataset.apPrintRasterMetrics = JSON.stringify(summary);
    document.documentElement.classList.add('ap-print-raster-active');

    let restored = false;
    return {
        summary,
        restore() {
            if (restored) return;
            restored = true;
            document.documentElement.classList.remove('ap-print-raster-active');
            target.replaceChildren();
            urls.forEach(url => URL.revokeObjectURL(url));
            delete target.dataset.apPrintRasterMetrics;
        }
    };
}

// PNG/WebP의 투명도는 제거하되 원본 해상도 전체를 복제하지 않는다. 화면의 실제 인쇄 크기를
// 300dpi로 환산한 공유 JPEG를 만들어 반복 이미지와 Chrome/PCL 스풀의 메모리 사용을 제한한다.
async function flattenPrintImagesForOpaquePrint() {
    const printParams = new URLSearchParams(window.location.search);
    if (printParams.get('printopt') === 'off') {
        return { summary: { mode: 'original', skipped: true }, restore() {} };
    }
    return await window.APPrintImageOptimizer?.prepare(document.getElementById('print-area')) || { summary: { mode: 'unavailable' }, restore() {} };
}

// 인쇄 전 준비: 렌더·폰트·이미지·수식이 모두 확정된 뒤에만 window.print()를 부른다.
// 준비 안 된 상태에서 인쇄하면 미리보기가 미완성인 채 잡이 생성돼 스풀이 멈춘다.
let printPending = false;

function setPrintButtonsBusy(busy, mode) {
    const buttons = [document.getElementById('btn-print'), document.getElementById('btn-print-gdi')].filter(Boolean);
    buttons.forEach(button => {
        if (!button.dataset.apPrintLabel) button.dataset.apPrintLabel = button.textContent;
        button.disabled = busy;
        button.style.opacity = busy ? '0.65' : '';
        button.style.cursor = busy ? 'wait' : 'pointer';
    });
    if (busy) {
        const active = mode === 'raster' ? document.getElementById('btn-print-raster') : mode === 'native' ? document.getElementById('btn-print-native') : mode === 'gdi' ? document.getElementById('btn-print-gdi') : document.getElementById('btn-print');
        if (active) active.textContent = mode === 'raster' ? '페이지 이미지 생성 중…' : mode === 'native' ? '네이티브 PCL 준비 중…' : mode === 'gdi' ? 'Windows 드라이버 준비 중…' : '인쇄 준비 중…';
    } else {
        buttons.forEach(button => { button.textContent = button.dataset.apPrintLabel || button.textContent; });
    }
}

function downloadNativePrintAgentInstaller() {
    const url = window.APNativePrint?.DEFAULT_INSTALLER_URL;
    if (!url) {
        window.alert('빠른 인쇄 도우미 설치 파일 주소를 확인할 수 없습니다.');
        return;
    }
    const link = document.createElement('a');
    link.href = url;
    link.download = 'APMath-Print-Agent-Installer.zip';
    link.rel = 'noopener';
    document.body.appendChild(link);
    link.click();
    link.remove();
}

function openFastPrintDialog() {
    if (printPending) return;
    const dialog = document.getElementById('fast-print-dialog');
    const input = document.getElementById('print-copies');
    if (!dialog || !input) return safePrint('gdi');
    dialog.hidden = false;
    dialog.style.display = 'flex';
    window.setTimeout(() => { input.focus(); input.select(); }, 0);
}

function closeFastPrintDialog() {
    const dialog = document.getElementById('fast-print-dialog');
    if (!dialog) return;
    dialog.hidden = true;
    dialog.style.display = 'none';
}

function confirmFastPrint() {
    if (printPending) return;
    getFastPrintCopies();
    closeFastPrintDialog();
    safePrint('gdi');
}

document.addEventListener('keydown', event => {
    if (event.key === 'Escape') closeFastPrintDialog();
});

function getFastPrintCopies() {
    const input = document.getElementById('print-copies');
    const copies = Math.max(1, Math.min(99, Math.trunc(Number(input?.value) || 1)));
    if (input) input.value = copies;
    return copies;
}

async function safePrint(mode = 'vector') {
    mode = mode === 'raster' || mode === 'native' || mode === 'gdi' ? mode : 'vector';
    if (printPending) return;
    printPending = true;
    setPrintButtonsBusy(true, mode);
    const printStartedAt = performance.now();
    const printCopies = mode === 'gdi' ? getFastPrintCopies() : 1;
    let optimizedImages = { summary: {}, restore() {} };
    let rasterPrint = { summary: {}, restore() {} };
    let nativePrint = { summary: {}, restore() {} };
    let gdiPrint = { summary: {}, restore() {} };
    let preparationError = null;
    try {
        const limit = ms => new Promise(resolve => setTimeout(resolve, ms));
        await Promise.race([window.__AP_RENDER_READY__, limit(20000)]);
        if (document.fonts?.ready) await Promise.race([document.fonts.ready, limit(5000)]);
        await Promise.race([waitForPrintImages(document.getElementById('print-area')), limit(5000)]);
        if (rendererMode() === 'legacy' && window.MathJax?.typesetPromise) {
            await Promise.race([typesetMath('print-preflight', undefined), limit(5000)]);
        } else if (window.APRenderLoop?.unrenderedMathCount(document.getElementById('print-area')) > 0) {
            await Promise.race([typesetMath('print-recovery', [document.getElementById('print-area')]), limit(5000)]);
        }
        if (mode === 'raster') rasterPrint = await prepareRasterPrint();
        else if (mode === 'native') {
            nativePrint = { summary: await window.APNativePrint.print(document.getElementById('print-area'), {
                printer: window.APNativePrint.DEFAULT_PRINTER,
                dpi: 300,
                threshold: 220,
                duplex: true,
                documentName: document.title,
                onProgress: progress => {
                    const button = document.getElementById('btn-print-native');
                    if (button) button.textContent = `PCL 페이지 변환 중… ${progress.index}/${progress.total}`;
                }
            }) };
        } else if (mode === 'gdi') {
            gdiPrint = { summary: await window.APNativePrint.printGdi(document.getElementById('print-area'), {
                printer: window.APNativePrint.DEFAULT_PRINTER,
                dpi: 300,
                duplex: true,
                copies: printCopies,
                documentName: document.title,
                onProgress: progress => {
                    const button = document.getElementById('btn-print-gdi');
                    if (button) button.textContent = `GDI 페이지 변환 중… ${progress.index}/${progress.total}`;
                }
            }) };
        } else optimizedImages = await flattenPrintImagesForOpaquePrint();
        // requestAnimationFrame은 탭이 백그라운드/스로틀 상태면 안 풀려 "준비 중"에서 멈출 수 있다.
        // setTimeout은 항상 발화하므로 rAF 대신 짧게 한 틱만 양보한다.
        await limit(60);
    } catch (error) {
        preparationError = error;
        console.warn('[engine] 인쇄 준비 중 경고', error);
    }

    const printParams = new URLSearchParams(window.location.search);
    const printMetrics = {
        readyToPrintMs: Number((performance.now() - printStartedAt).toFixed(1)),
        mode,
        copies: printCopies,
        imageOptimization: optimizedImages.summary || {},
        pageRasterization: rasterPrint.summary || {},
        nativePrint: nativePrint.summary || {},
        gdiPrint: gdiPrint.summary || {},
        dryRun: printParams.get('printDryRun') === '1'
    };
    document.documentElement.dataset.apPrintMetrics = JSON.stringify(printMetrics);

    if (preparationError && (mode === 'raster' || mode === 'native' || mode === 'gdi')) {
        rasterPrint.restore();
        optimizedImages.restore();
        printPending = false;
        setPrintButtonsBusy(false, mode);
        if (mode === 'gdi' && (preparationError?.code === 'AP_NATIVE_AGENT_UNAVAILABLE' || preparationError?.code === 'AP_NATIVE_AGENT_UPDATE_REQUIRED')) {
            if (window.confirm('빠른 인쇄 도우미 자동 업데이트에 실패했습니다. 수동 설치 파일을 다운로드할까요?')) {
                downloadNativePrintAgentInstaller();
            }
        }
        const message = mode === 'native'
            ? '네이티브 PCL 인쇄에 실패했습니다. 보조 프로그램이 실행 중이고 SINDOH N500 Series PCL 큐가 있는지 확인해 주세요.'
            : mode === 'gdi'
            ? preparationError?.code === 'AP_NATIVE_AGENT_UPDATE_REQUIRED'
                ? '빠른 인쇄 도우미 자동 업데이트에 실패했습니다. 다운로드된 ZIP을 압축 해제하고 설치 파일을 한 번 실행한 뒤 다시 눌러주세요.'
                : '빠른 인쇄 도우미가 실행 중인지 확인해 주세요. 처음 사용하는 컴퓨터라면 다운로드된 ZIP을 압축 해제하고 설치 파일을 한 번 실행한 뒤 다시 눌러주세요.'
            : '프린터 최적화 페이지 생성에 실패했습니다. 일반 인쇄를 다시 시도해 주세요.';
        window.alert(message + '\n\n' + (preparationError.message || preparationError));
        return;
    }

    if (printMetrics.dryRun) {
        rasterPrint.restore();
        optimizedImages.restore();
        printPending = false;
        setPrintButtonsBusy(false, mode);
        return;
    }

    if (mode === 'native') {
        const hint = document.getElementById('print-output-hint');
        if (hint && nativePrint.summary) {
            hint.textContent = `네이티브 PCL 전송 완료 · ${nativePrint.summary.pageCount}쪽 / ${Math.round(nativePrint.summary.elapsedMs)}ms`;
        }
        printPending = false;
        setPrintButtonsBusy(false, mode);
        return;
    }
    if (mode === 'gdi') {
        const hint = document.getElementById('print-output-hint');
        if (hint && gdiPrint.summary) {
            hint.textContent = `Windows 드라이버 양면 전송 완료 · ${gdiPrint.summary.pageCount}쪽 / ${Math.round(gdiPrint.summary.elapsedMs)}ms`;
        }
        printPending = false;
        setPrintButtonsBusy(false, mode);
        return;
    }

    let cleaned = false;
    let fallbackTimer = null;
    const cleanup = () => {
        if (cleaned) return;
        cleaned = true;
        if (fallbackTimer) clearTimeout(fallbackTimer);
        window.removeEventListener('afterprint', cleanup);
        rasterPrint.restore();
        optimizedImages.restore();
        printPending = false;
        setPrintButtonsBusy(false, mode);
    };
    window.addEventListener('afterprint', cleanup, { once: true });
    try {
        window.print();
        // 일부 구형 브라우저는 afterprint을 누락하므로, 대화상자가 닫힌 뒤 최대 2분 내에
        // 임시 이미지와 object URL을 정리한다. 정상 브라우저에서는 afterprint이 먼저 정리한다.
        fallbackTimer = setTimeout(cleanup, 120000);
    } catch (error) {
        cleanup();
        throw error;
    }
}
window.safePrint = safePrint;

function shouldUseScreenFit(params) {
    return params.get('fit') === 'screen' || window.matchMedia('(max-width: 900px)').matches;
}

function updateScreenFitScale() {
    if (!document.body.classList.contains('screen-fit-mode')) return;
    const area = document.getElementById('print-area');
    const page = area?.querySelector('.page');
    if (!area || !page) return;
    const pageWidth = page.offsetWidth || 794;
    const availableWidth = Math.max(280, window.innerWidth - 16);
    const scale = Math.max(0.32, Math.min(1, availableWidth / pageWidth));
    document.documentElement.style.setProperty('--screen-page-scale', String(scale));
}

if (typeof window !== 'undefined' && window.addEventListener) {
    window.addEventListener('resize', () => requestAnimationFrame(updateScreenFitScale));
}

async function init() {
    if (window.__ARCHIVE_METADATA_READY__) await window.__ARCHIVE_METADATA_READY__;
    const p = new URLSearchParams(window.location.search);
    AppState.key = p.get('key') || '';
    const rawData = localStorage.getItem('mixedQuestions_' + AppState.key) || sessionStorage.getItem('mixedQuestions');
    const rawMeta = localStorage.getItem('mixedMeta_' + AppState.key) || sessionStorage.getItem('mixedMeta');

    if (!rawData && p.get('packId')) {
        try {
            const fallback = await loadAssessmentPackFallback(p.get('packId'));
            if (fallback) {
                AppState.data = fallback.questions.map((question, index) => window.mergeArchiveQuestionMetadata
                    ? window.mergeArchiveQuestionMetadata(question, {
                        questionUid: question?.questionUid || question?.source_question_uid,
                        sourceArchiveFile: question?.sourceArchiveFile || question?._sourceFile,
                        sourceOrdinal: question?.sourceOrdinal || question?._sourceQuestionOrdinal || index + 1
                    })
                    : question);
                AppState.meta = fallback.meta;
                AppState.mode = p.get('mode') || 'exam';
                if (isQrSolutionMode()) AppState.mode = 'sol';
                applyQrSolutionLockUI();
                AppState.qpp = normalizeMixedQpp(p.get('qpp') || AppState.meta.qpp);
                AppState.printHeaderOptions = normalizePrintHeaderOptions(AppState.meta.printHeaderOptions);
                const title = getIdentityTitle();
                document.getElementById('ctrl-title').textContent = title;
                document.getElementById('qppSelect').value = String(AppState.qpp);
                document.querySelectorAll('.mode-tab').forEach(t => t.classList.toggle('active', t.id === 'btn-' + AppState.mode));
                renderPrintHeaderControls();
                await render();
                return;
            }
        } catch (e) {
            console.warn('assessment pack fallback failed:', e);
        }
    }

    if (!rawData) { alert('데이터가 없습니다.'); return; }

    try {
        const parsedData = JSON.parse(rawData);
        const parsedQuestions = Array.isArray(parsedData) ? parsedData : [];
        AppState.data = parsedQuestions.map((question, index) => window.mergeArchiveQuestionMetadata
            ? window.mergeArchiveQuestionMetadata(question, {
                questionUid: question?.questionUid || question?.source_question_uid || question?._sourceQuestionUid,
                sourceArchiveFile: question?.sourceArchiveFile || question?._sourceFile,
                sourceOrdinal: question?.sourceOrdinal || question?._sourceQuestionOrdinal || question?.source_question_ordinal || index + 1
            })
            : question);
    } catch (e) {
        console.error('mixedQuestions parse error:', e);
        alert('문항 데이터를 읽지 못했습니다.');
        return;
    }

    try {
        AppState.meta = rawMeta ? JSON.parse(rawMeta) : {};
    } catch (e) {
        console.warn('mixedMeta parse error:', e);
        AppState.meta = {};
    }

    if (!Array.isArray(AppState.data) || AppState.data.length === 0) {
        alert('출력할 문항 데이터가 없습니다.');
        return;
    }

    AppState.mode = p.get('mode') || 'exam';
    if (isQrSolutionMode()) AppState.mode = 'sol';
    applyQrSolutionLockUI();
    
    AppState.qpp = normalizeMixedQpp(p.get('qpp') || AppState.meta.qpp);

    AppState.printHeaderOptions = normalizePrintHeaderOptions(AppState.meta.printHeaderOptions);
    const title = getIdentityTitle();
    document.getElementById('ctrl-title').textContent = title;
    document.getElementById('qppSelect').value = String(AppState.qpp);
    document.querySelectorAll('.mode-tab').forEach(t => t.classList.toggle('active', t.id === 'btn-' + AppState.mode));
    renderPrintHeaderControls();

    const file = p.get('file');
    if (AppState.mode === 'pdf' && file) {
        document.body.classList.add('mode-pdf');
        document.getElementById('pdf-viewer').src = file;
        const link = document.getElementById('btn-pdf-link');
        link.style.display = 'inline-block';
        link.onclick = () => window.open(file, '_blank');
        return;
    }

    await render();
}
// 백그라운드 탭에서는 브라우저가 rAF를 아예 멈춘다. 배열 로직이 전부 await raf()로
// 이어져 있어, 새 탭이 뒤에서 열리면 헤더만 그려진 채 영구히 멈춘다(빈 화면).
// setTimeout은 스로틀만 될 뿐 계속 발화하므로 둘 중 먼저 오는 쪽으로 진행한다.
function raf() {
    return new Promise(resolve => {
        let done = false;
        const finish = () => { if (done) return; done = true; resolve(); };
        requestAnimationFrame(finish);
        setTimeout(finish, 32);
    });
}
window.onload = () => {
    restoreApmathSessionFromHash();
    const params = new URLSearchParams(window.location.search);
    if (shouldUseScreenFit(params)) document.body.classList.add('screen-fit-mode');
    init();
};
</script>
