<!doctype html>
<html lang="ko">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>공통 Meta 문항 검색 | Archive 2.0</title>
<style>
body{font-family:system-ui,'Malgun Gothic',sans-serif;background:#f4f7fb;color:#17324f;margin:0}main{max-width:1080px;margin:auto;padding:24px}a{color:#155fa8}h1{font-size:26px}.filters{display:flex;flex-wrap:wrap;gap:12px;background:white;padding:18px;border-radius:12px}label{display:grid;gap:6px}select,button{font:inherit;padding:9px;border:1px solid #b8c9dc;border-radius:7px;background:white}article{background:white;padding:16px;margin:10px 0;border-radius:10px}article p{color:#516b83}#preview{white-space:pre-wrap;background:white;padding:20px;margin-top:16px}#preview img{max-width:100%;max-height:360px}#status{min-height:24px}nav{display:flex;gap:20px}button,a{cursor:pointer}#preview[hidden]{display:none}#preview table{border-collapse:collapse;white-space:normal}#preview td,#preview th{border:1px solid #a5b2c0;padding:6px}
.pick{display:inline-flex;align-items:center;gap:6px;margin-right:12px}.pickbar{position:sticky;bottom:0;display:flex;flex-wrap:wrap;align-items:center;gap:12px;background:#fff;border-top:2px solid #155fa8;padding:12px 18px;margin-top:12px;border-radius:10px 10px 0 0;box-shadow:0 -2px 8px rgba(23,50,79,.12)}.pickbar[hidden]{display:none}.pickbar .go{background:#155fa8;color:#fff;padding:9px 14px;border-radius:7px;text-decoration:none}.pickbar .go[aria-disabled=true]{background:#9db7d3;pointer-events:none}.pickbar #picknote{flex-basis:100%;margin:0;color:#8a5200;font-size:13px}.pickbar #picknote:empty{display:none}
.kb{display:inline-block;font-size:11px;line-height:16px;padding:0 6px;border-radius:9px;margin-right:5px;border:1px solid #9db7d3;background:#eaf3fc;color:#1d4f86}.kb.ext{border-color:#e0a95b;background:#fff3df;color:#8a5200}.keys{margin:6px 0 0}.keys .key{display:inline-block;margin:0 14px 4px 0;color:#17324f}.keys .key small{color:#647c98}#keynote{min-height:20px;color:#647c98;font-size:13px}
</style>
<main>
<nav><a href="workspace.html?view=compose">문제지 만들기</a><a href="generated-bank.html">생성 문항 선택·인쇄</a></nav>
<h1>공통 Meta 문항 검색</h1>
<p>메인에 등록된 기출과 생성문제를 같은 분류·난이도로 찾습니다. 검수 상태와 미지정 정보는 문항별 기록을 따릅니다.</p>
<div class="filters">
<label>출처<select id="source"><option value="">전체</option><option value="original">기출</option><option value="generated">생성</option><option value="archive">기타 아카이브</option></select></label>
<label>과목<select id="course"><option value="">전체</option></select></label>
<label>표준단원 키<select id="standardUnitKey"><option value="">전체</option></select></label>
<label>세부분류 키<select id="subUnitKey"><option value="">전체</option></select></label>
<label>원본 대단원<select id="nativeL1"><option value="">전체</option></select></label>
<label>원본 중단원<select id="nativeL2"><option value="">전체</option></select></label>
<label>원본 개념 L3<select id="nativeL3"><option value="">전체</option></select></label>
<label>원본 유형 L4<select id="nativeL4"><option value="">전체</option></select></label>
<label>RPM L1<select id="rpmL1"><option value="">전체</option></select></label>
<label>RPM L2<select id="rpmL2"><option value="">전체</option></select></label>
<label>RPM L3<select id="rpmL3"><option value="">전체</option></select></label>
<label>RPM L4<select id="rpmL4"><option value="">전체</option></select></label>
<label>문항 개념 키<select id="problemTypeKey"><option value="">전체</option></select></label>
<label>풀이 유형 키<select id="templateKey"><option value="">전체</option></select></label>
<label>연결 개념<select id="crossConceptKey"><option value="">전체</option></select></label>
<label>조건<select id="conditionKey"><option value="">전체</option></select></label>
<label>통합 사고<select id="integrationPattern"><option value="">전체</option></select></label>
<label>개정<select id="nativeCurriculum"><option value="">전체</option></select></label>
<label>학습수준<select id="level"><option value="">전체</option><option>하</option><option>중</option><option>상</option></select></label>
<label>난이도<select id="difficulty"><option value="">전체</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option value="UNKNOWN">미지정</option></select></label>
</div>
<p id="status" role="status" aria-live="polite">문항 정보를 불러오는 중입니다.</p>
<p id="keynote" role="status" aria-live="polite"></p>
<div id="results"></div><button id="more" hidden>더 보기</button>
<section id="pickbar" class="pickbar" hidden aria-label="선택한 기출 문항">
<strong id="pickcount" role="status" aria-live="polite"></strong>
<a id="pickgo" class="go" target="_blank" rel="noopener" aria-disabled="true">선택한 문항으로 문제지 만들기</a>
<button id="pickclear" type="button">선택 비우기</button>
<p id="picknote" role="status" aria-live="polite"></p>
</section>
<section id="preview" hidden aria-label="문항 미리보기"></section>
</main>
<script src="mixer-selector.js?v=20261009-meta1"></script>
<script src="archive2-canonical.js?v=20261030-s11-1"></script>
<script src="archive2-core.js?v=20261029-s14-1"></script>
<script src="problem-bank-meta.js?v=20261029-s14-1"></script>

<script src="archive2-key-resolver.js?v=20261030-s14b-1"></script>
<script>
'use strict';
const el=id=>document.getElementById(id),shards=new Map();
let inventory=[],matching=[],limit=40,holds=[],previewRequest=0,coreMetaFilterOptions={},keyResolver=null;
// Per-item selection of ORIGINAL questions (S9). The selection survives filter changes and "더 보기".
// The compose workspace re-validates every UID, so a stale or unusable UID fails closed there.
const MAX_PICK=100,picked=new Map(),sourceRecords=new Map();let restoreCatalog=null;
const filters=()=>{
 const f={};for(const k of ['rpmL1','rpmL2','rpmL3','rpmL4'])if(el(k).value)f[k]=el(k).value;
 if(el('source').value)f.sourceKind=el('source').value;
 if(el('course').value)f.standardCourse=el('course').value;
 if(el('standardUnitKey').value)f.standardUnitKey=el('standardUnitKey').value;
 if(el('subUnitKey').value)f.subUnitKey=el('subUnitKey').value;
 for(const key of ['nativeL1','nativeL2','nativeL3','nativeL4'])if(el(key).value)f[key]=el(key).value;
 if(el('nativeCurriculum').value)f.nativeCurriculum=el('nativeCurriculum').value;
 if(el('level').value)f.level=el('level').value;
 for(const key of ['problemTypeKey','templateKey','integrationPattern'])if(el(key).value)f[key]=el(key).value;
 if(el('crossConceptKey').value)f.crossConceptKeys=[el('crossConceptKey').value];
 if(el('conditionKey').value)f.conditionKeys=[el('conditionKey').value];
 if(el('difficulty').value)f.difficultyBucket=el('difficulty').value==='UNKNOWN'?'UNKNOWN':Number(el('difficulty').value);
 return f;
};
function options(id,field,rows,authorityRows=null){
 const selected=el(id).value,values=new Map();
 for(const row of authorityRows||rows){
  const value=typeof row==='string'?row:row[field],label=typeof row==='string'?row:(row.displayLabel||value);
  if(value&&!values.has(value))values.set(value,label);
 }
 const sorted=[...values.entries()].sort((a,b)=>a[0].localeCompare(b[0],'ko'));
 el(id).replaceChildren(new Option('전체',''),...sorted.map(([value,label])=>new Option(label,value)));
 if(values.has(selected))el(id).value=selected;
}
function metaAxisOptions(id,field,rows){
 const selected=el(id).value,values=new Set();
 for(const row of rows){const value=row[field];for(const key of Array.isArray(value)?value:[value])if(typeof key==='string'&&key)values.add(key);}
 const sorted=[...values].sort((a,b)=>a.localeCompare(b,'ko'));
 el(id).replaceChildren(new Option('전체',''),...sorted.map(value=>new Option(value,value)));
 if(values.has(selected))el(id).value=selected;
}
function refreshCoreMetaKeyOptions(){
 const course=el('course').value,units=(coreMetaFilterOptions.standardUnits||[]).filter(row=>!course||(row.standardCourses||[]).includes(course));
 if(el('standardUnitKey').value&&!units.some(row=>row.standardUnitKey===el('standardUnitKey').value))el('standardUnitKey').value='';
 options('standardUnitKey','standardUnitKey',inventory,units);
 const selectedUnit=el('standardUnitKey').value,subUnits=(coreMetaFilterOptions.subUnits||[]).filter(row=>(!course||(row.standardCourses||[]).includes(course))&&(!selectedUnit||row.standardUnitKey===selectedUnit));
 if(el('subUnitKey').value&&!subUnits.some(row=>row.subUnitKey===el('subUnitKey').value))el('subUnitKey').value='';
 options('subUnitKey','subUnitKey',inventory,subUnits);
}
const KEY_CHIPS=[['pt','유형'],['tpl','풀이'],['l4','세부 유형'],['cross','연결 개념'],['cond','조건']];
// S14b: canonical (정식) and Generated-only extension (확장) keys in one read-only view. The resolver
// loads lazily after the first paint; until then (or if it fails) the cards and filters stay as before.
function keyChips(row){
 if(!keyResolver)return null;
 const view=keyResolver.describe(row),paragraph=document.createElement('p');paragraph.className='keys';
 for(const [kind,label] of KEY_CHIPS){
  for(const item of view.items.filter(entry=>entry.kind===kind&&!entry.blocked)){
   const chip=document.createElement('span');chip.className='key';
   if(item.badge){const badge=document.createElement('span');badge.className='kb'+(item.origin==='extension'?' ext':'');badge.dataset.origin=item.origin;badge.textContent=item.badge;badge.title=item.origin==='extension'?'Generated 전용 확장 키 (정식 키로 승격되기 전)':'정식 키';chip.append(badge);}
   chip.append(document.createTextNode(`${label} ${item.label}`));
   if(item.origin==='extension'&&item.parentLabel){const parent=document.createElement('small');parent.textContent=` ‹상위 ${item.parentLabel}${item.parentInferredFromItem?' (문항 기록)':''}›`;chip.append(parent);}
   chip.title=item.key+(item.tier&&item.tier!=='active'?` · ${item.tier}`:'');
   paragraph.append(chip);
  }
 }
 if(view.violations.length){const warn=document.createElement('small');warn.textContent='원본 문항에는 확장 키를 붙이지 않으므로 표시하지 않습니다.';paragraph.append(warn);}
 return paragraph.childNodes.length?paragraph:null;
}
function relabelKeyOptions(id,kind){
 const select=el(id),selected=select.value,values=[...select.options].map(option=>option.value).filter(Boolean);
 if(!values.length)return;
 const groups=new Map(),flat=[];
 for(const option of keyResolver.optionsFor(kind,values)){
  const node=new Option(`${option.label}${option.badge?` · ${option.badge}`:''}`,option.value);node.title=option.key;
  if(option.origin==='extension'&&option.groupLabel){const bucket=groups.get(option.groupLabel)||[];bucket.push(node);groups.set(option.groupLabel,bucket);}
  else flat.push(node);
 }
 const children=[new Option('전체',''),...flat];
 for(const [label,nodes] of groups){const group=document.createElement('optgroup');group.label=`확장 · ${label}`;group.append(...nodes);children.push(group);}
 select.replaceChildren(...children);
 if(values.includes(selected))select.value=selected;
}
function scheduleKeyResolver(){
 const start=()=>{
  el('keynote').textContent='분류 키의 정식·확장 표시를 불러오는 중입니다.';
  Archive2KeyResolver.load({base:''}).then(({resolver,failedSources,elapsedMs})=>{
   keyResolver=resolver;
   for(const [id,kind] of [['problemTypeKey','pt'],['templateKey','tpl'],['crossConceptKey','cross'],['conditionKey','cond'],['rpmL4','l4']])relabelKeyOptions(id,kind);
   el('keynote').textContent=`분류 키 표시: 정식 ${resolver.stats.canonicalKeys.toLocaleString()} · 확장 ${resolver.stats.extensionKeys.toLocaleString()} (상위 연결 ${resolver.stats.parentLinked.toLocaleString()})${failedSources.length?' · 일부 자료 없음':''}`;
   window.__keyResolverState={ready:true,elapsedMs,failedSources};
   render();
  }).catch(error=>{el('keynote').textContent='';window.__keyResolverState={ready:false,error:String(error?.message||error)};});
 };
 if(typeof requestIdleCallback==='function')requestIdleCallback(start,{timeout:1500});else setTimeout(start,50);
}
function render(){
 matching=ProblemBankMeta.query(inventory,filters());
 el('status').textContent=`${matching.length.toLocaleString()}문항 · 기출/아카이브 ${matching.filter(r=>r.sourceKind!=='generated').length.toLocaleString()} · 생성 ${matching.filter(r=>r.sourceKind==='generated').length.toLocaleString()} · 검증 수준은 문항별 근거를 따릅니다.`;
 el('results').replaceChildren();
 for(const row of matching.slice(0,limit)){
  const card=document.createElement('article'),title=document.createElement('strong'),info=document.createElement('p');
  title.textContent=[row.school,row.year,row.sourceQid??row.sourceQuestionNo??row.sourceOrdinal].filter(v=>v!=null).join(' · ');
  const unit=row.standardUnit?`${row.standardUnit}${row.standardUnitKey?` (${row.standardUnitKey})`:''}`:'미지정';
  const subUnit=row.subUnit?`${row.subUnit}${row.subUnitKey?` (${row.subUnitKey})`:''}`:'미지정';
  const sourceNative=Boolean(row.nativeTaxonomyAuthority?.registrationPackId);
  const rpmPath=[row.rpmL1,row.rpmL2,row.rpmL3,row.rpmL4].filter(Boolean).join(' → ');
  const rpmStatus=row.rpmMapping?.status==='NO_ITEM_RPM_PATH_IN_SOURCE_JS'?'RPM 경로 미기록':
   row.rpmMapping?.status==='NO_EQUIVALENT_PATH'?'RPM 대응 경로 없음':rpmPath?'RPM 경로 확인':'RPM 경로 확인 필요';
  const classification=sourceNative
   ?[`원본 ${row.nativeCurriculum||'개정 미지정'} 분류 ${row.nativeL1||'L1 미지정'} → ${row.nativeL2||'L2 미지정'} → ${row.nativeL3||'L3 미지정'} → ${row.nativeL4||'L4 미지정'}`,`${rpmStatus}${rpmPath?` · ${rpmPath}`:''}`]
   :[row.rpmL1||'RPM L1 미지정',row.rpmL2||'RPM L2 미지정',row.rpmL3||'RPM L3 미지정',row.rpmL4||'RPM L4 미지정'];
  info.textContent=[row.standardCourse||'과목 미지정',...classification,`표준단원 ${unit}`,`세부분류 ${subUnit}`,`학습수준 ${row.level||'미지정'}`,`난이도 ${row.difficultyBucket??'미지정'}`].join(' / ');
  card.append(title,info);
  const keyLine=keyChips(row);if(keyLine)card.append(keyLine);
  if(row.metaProjectionStatus==='SOURCE_META_STALE_OR_UNAVAILABLE'){
   const stale=document.createElement('p');stale.textContent='원본 Meta 분류가 현재 자료와 연결되지 않아 표시되지 않습니다.';card.append(stale);
  }
  if(row.metaBindingMode==='CONTENT_BOUND_SOURCE_REVISED'){const note=document.createElement('p');note.textContent='분류는 문제 본문·보기·그림 기준으로 기록되었고, 이후 정답·해설이 갱신되었습니다.';card.append(note);}
  const pendingMeta=Object.entries(row.metadataAssignmentEvidence?.fieldStatus||{}).filter(([,status])=>status==='manual_review_pending').map(([field])=>field);
  if(pendingMeta.length){const pending=document.createElement('p');pending.textContent=`메타 검토 대기: ${pendingMeta.join(', ')}`;card.append(pending);}
  if(row.rpmSemanticStatus&&row.rpmSemanticStatus!=='FINAL'){
   const rpm=document.createElement('p');rpm.textContent=`RPM 메타 ${row.rpmSemanticStatus}${row.rpmSemanticReason?` · ${row.rpmSemanticReason}`:''}`;card.append(rpm);
  }
  if(row.sourceKind==='generated'){
   const preview=document.createElement('button');preview.textContent='문제 보기';preview.onclick=()=>previewGenerated(row,preview);card.append(preview);
   const select=document.createElement('a');select.textContent=' 생성 문항 선택';select.href='generated-bank.html?uid='+encodeURIComponent(row.uid);card.append(select);
  }else{
   const uid=row.questionUid||row.uid;
   if(uid&&row.sourceKind!=='generated'){
    const pick=document.createElement('label');pick.className='pick';
    const box=document.createElement('input');box.type='checkbox';box.checked=picked.has(uid);box.dataset.uid=uid;
    box.setAttribute('aria-label','문제지에 담기: '+title.textContent);
    box.onchange=()=>togglePick(row,box);
    pick.append(box,document.createTextNode('문제지에 담기'));card.append(pick);
    if(sourceRecords.has(uid)){const view=document.createElement('button');view.textContent='문제 보기';view.onclick=()=>previewOriginal(row,view);card.append(view,document.createTextNode(' '));}
   }
   for(const [mode,label] of [['exam','시험'],['sol','해설'],['ans','정답']]){
    const link=document.createElement('a');link.textContent=label+' ';link.target='_blank';link.rel='noopener';
    link.href='engine.html?data='+encodeURIComponent('exams/'+row.sourceFile)+'&mode='+mode;card.append(link);
   }
  }
  el('results').append(card);
 }
 el('more').hidden=matching.length<=limit;
}
const pickGrade=row=>row.effectiveBrowseGrade||row.sourceGrade||row.grade||'';
function pickUrl(){
 const url=new URL('workspace.html',document.baseURI);url.searchParams.set('view','compose');
 for(const uid of picked.keys())url.searchParams.append('uid',uid);
 return url.href;
}
function renderPickBar(){
 const count=picked.size,bar=el('pickbar'),go=el('pickgo');
 bar.hidden=count===0;
 el('pickcount').textContent=`기출 ${count}문항 선택됨 (최대 ${MAX_PICK})`;
 if(count){go.href=pickUrl();go.setAttribute('aria-disabled','false');}else{go.removeAttribute('href');go.setAttribute('aria-disabled','true');}
 const grades=new Set([...picked.values()].map(item=>item.grade).filter(Boolean));
 el('picknote').textContent=grades.size>1?`선택한 문항이 ${[...grades].join('·')}에 걸쳐 있습니다. 문제지 만들기는 한 학년씩만 지원하므로 학년별로 나누어 선택해 주세요.`:'';
}
function togglePick(row,box){
 const uid=row.questionUid||row.uid;
 if(!box.checked){picked.delete(uid);renderPickBar();return;}
 if(picked.size>=MAX_PICK){box.checked=false;el('picknote').textContent=`한 번에 ${MAX_PICK}문항까지 선택할 수 있습니다.`;return;}
 picked.set(uid,{uid,grade:pickGrade(row)});renderPickBar();
}
function validOriginalImage(value){
 return typeof value==='string'&&/^assets\/images\/[^?#\\%]+\.(?:svg|png|jpe?g|webp)$/i.test(value)&&!value.split('/').some(part=>!part||part==='.'||part==='..');
}
// Per-item preview of an ORIGINAL question: the shared restore path checks the catalog source hash,
// the question fingerprint and the UID before anything is shown; any failure is shown, never hidden.
async function previewOriginal(row,button){
 const request=++previewRequest,record=sourceRecords.get(row.questionUid||row.uid);
 button.disabled=true;el('preview').hidden=false;el('preview').textContent='문항을 불러오는 중입니다.';
 try{
  if(!record||!restoreCatalog)throw Error('문항 정보를 찾을 수 없습니다.');
  const [q]=await Archive2Source.restore([record],restoreCatalog,{requireSourceHash:true});
  if(request!==previewRequest)return;
  el('preview').replaceChildren();const stem=document.createElement('div');safeStem(stem,q.content);el('preview').append(stem);
  for(const [i,value] of (q.choices||[]).entries()){const p=document.createElement('p');p.textContent='①②③④⑤'[i]+' '+value;el('preview').append(p);}
  if(q.image){if(!validOriginalImage(q.image))throw Error('문항 이미지 경로 오류');const img=document.createElement('img');img.src=q.image;img.alt='문제 그림';el('preview').append(img);}
  if(window.MathJax?.typesetPromise)await MathJax.typesetPromise([el('preview')]);
 }catch(e){if(request===previewRequest)el('preview').textContent=e.message;}finally{button.disabled=false;}
}
async function previewGenerated(row,button){
 const request=++previewRequest;
 button.disabled=true;el('preview').hidden=false;el('preview').textContent='문항을 불러오는 중입니다.';
 try{
  if(!/^data\/generated-lite-consumer\/v1\/shards\/[^?#]+\.json$/.test(row.shard)||row.shard.includes('..'))throw Error('문항 경로 오류');
  if(!shards.has(row.shard))shards.set(row.shard,fetch(row.shard,{cache:'no-cache'}).then(r=>{if(!r.ok)throw Error('문항 로드 실패');return r.json();}).catch(e=>{shards.delete(row.shard);throw e;}));
  const q=await Archive2Source.restoreGenerated(row,await shards.get(row.shard),holds);
  if(request!==previewRequest)return;
  el('preview').replaceChildren();const stem=document.createElement('div');safeStem(stem,q.content);el('preview').append(stem);
  for(const [i,value] of (q.choices||[]).entries()){const p=document.createElement('p');p.textContent='①②③④⑤'[i]+' '+value;el('preview').append(p);}
  if(q.image){if(!/^assets\/generated-lite\/[^?#]+\.svg$/.test(q.image)||q.image.includes('..'))throw Error('문항 이미지 경로 오류');const img=document.createElement('img');img.src=q.image;img.alt=q.imageAlt||'문제 그림';el('preview').append(img);}
  if(window.MathJax?.typesetPromise)await MathJax.typesetPromise([el('preview')]);
 }catch(e){if(request===previewRequest)el('preview').textContent=e.message;}finally{button.disabled=false;}
}

  if(!rows.length||rest||cells.some(c=>!c))continue;

}
