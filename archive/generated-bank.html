<main>
<div class="intro"><div><h1>모의고사 만들기</h1><p class="muted">학교와 단원을 고르면 승인된 문제로 바로 문제지를 구성합니다.</p></div><span class="pill"><span id="total">0</span>문항 검수 완료</span></div>
<section class="section" aria-labelledby="school-heading">
<div class="section-head"><span class="step">01</span><h2 id="school-heading">학교 선택</h2></div>

</section>

</div>
<div class="builder-footer"><span id="availability" class="availability">먼저 학교를 선택하세요.</span><button id="generate" class="primary" disabled>모의고사 만들기 →</button></div>

<input id="query" aria-label="문항 검색" placeholder="문항 UID · 학교 · 문항 번호 · 단원 검색">

</div></div></details>
<section id="paper"><h1>2026 선택 생성 모의고사</h1><div id="paper-items"></div></section>
</main>
<script>
"use strict";
const INDEX="data/generated-lite-consumer/v1/index.json";
// Display names follow 2022 / high / 공통수학1 RPM Primary v1.0 L1/L2 canonical.
// An unknown code is never passed through as a user-facing label or made eligible for automatic paper generation.
const UNIT_LABELS=Object.freeze({
 "H22-C-01-POLYNOMIAL_BASIC":{major:"다항식",mid:"다항식의 연산"},
 "H22-C-02-CORE":{major:"다항식",mid:"항등식과 나머지정리"},
 "H22-C-03-FACTORIZATION":{major:"다항식",mid:"인수분해"},
 "H22-C-04-COMPLEX_BASIC":{major:"방정식과 부등식",mid:"복소수"},
 "H22-C-04-COMPLEX_OPERATION":{major:"방정식과 부등식",mid:"복소수"},
 "H22-C-05-QUADRATIC_EQUATION":{major:"방정식과 부등식",mid:"이차방정식"},
 "H22-C-05-QUADRATIC_FUNCTION_GRAPH":{major:"방정식과 부등식",mid:"이차방정식과 이차함수"},
 "H22-C-05-QUADRATIC_FUNCTION_APPLICATION":{major:"방정식과 부등식",mid:"이차방정식과 이차함수"},
 "H22-C-06-HIGHER_EQUATION":{major:"방정식과 부등식",mid:"여러 가지 방정식"},
 "H22-C-06-HIGHER_INEQUALITY":{major:"방정식과 부등식",mid:"여러 가지 부등식"},
 "H22-C-08-COUNTING_PRINCIPLE":{major:"경우의 수",mid:"경우의 수와 순열"},
 "H22-C-08-COMBINATION":{major:"경우의 수",mid:"조합"},
 "H22-C-09-MATRIX_OPERATION":{major:"행렬",mid:"행렬"},
 "H22-C-09-MATRIX_APPLICATION":{major:"행렬",mid:"행렬"}
});
const unitName=row=>UNIT_LABELS[row.l2]||null;
let schoolChoice="";

let rows=[],selected=new Set(),shown=null,visible=[],showAnswer=false;
const $=id=>document.getElementById(id), positions="①②③④⑤",cache=new Map();
const status=message=>$("message").textContent=message;
const unique=items=>new Set(items).size===items.length;
async function readJson(path){
 if(typeof path!=="string"||!/^data\/generated-lite-consumer\/v1\/[a-zA-Z0-9_./-]+\.json$/.test(path)||path.includes(".."))throw Error("등록 경로 불일치");
 const response=await fetch(path,{cache:"no-cache"});
 if(!response.ok)throw Error("등록 데이터 로드 실패: "+response.status);
 return response.json();
}
function text(parent,value,tag="div",cls=""){const node=document.createElement(tag);if(cls)node.className=cls;node.textContent=String(value??"");parent.appendChild(node);return node;}
async function math(){if(window.MathJax?.typesetPromise)try{await MathJax.typesetPromise();}catch(e){console.warn("수식 표시 확인 필요",e)}}
async function questionFor(row){
 if(!cache.has(row.shard)){
  cache.set(row.shard,readJson(row.shard).catch(e=>{cache.delete(row.shard);throw e}));
 }
 const data=await cache.get(row.shard);
 if(data.schemaVersion!=="ALIVE_GENERATED_CONSUMER_SHARD_V1"||!Array.isArray(data.records))throw Error("문항 등록 스키마 오류");
 const matches=data.records.filter(r=>r.generatedUid===row.uid&&r.localOrdinal===row.localOrdinal);
 if(matches.length!==1||matches[0].sourceKind!=="generated"||!Array.isArray(matches[0].question?.choices))throw Error("문항 UID/보기 결속 오류");
 const question=matches[0].question;
 const objective=question.questionType==="객관식"&&question.choices.length===5&&positions.includes(question.answer);
 const subjective=["서술형","단답형","주관식"].includes(question.questionType)&&question.choices.length===0&&String(question.answer||"").trim()!=="";
 if(!objective&&!subjective)throw Error("문항 형식/보기/정답 결속 오류");
 return question;
}
function figure(parent,q){
 if(!q.image)return;
 if(!/^assets\/generated-lite\/ALITE-[A-Za-z0-9-]+\.svg$/.test(q.image))throw Error("승인 자산 경로 오류");
 const img=document.createElement("img");img.src=q.image;img.alt=q.imageAlt||"문항 수학 시각자료";img.className="math-figure";parent.appendChild(img);
}
function questionStem(parent,value){
 const raw=String(value??""),container=document.createElement("div");container.className="stem";
 const pattern=/<div class="question-table-wrap"><table class="question-table">([\s\S]*?)<\/table><\/div>/g;
 let cursor=0,match;
 while((match=pattern.exec(raw))!==null){
  const inside=match[1],rows=[...inside.matchAll(/<tr>([\s\S]*?)<\/tr>/g)];
  const outside=inside.replace(/<\/?(?:thead|tbody)>/g,"").replace(/<tr>[\s\S]*?<\/tr>/g,"").trim();
  if(!rows.length||outside)continue;
  const grid=rows.map(row=>{
   const cells=[...row[1].matchAll(/<(th|td)>([^<>]*)<\/\1>/g)];
   const rest=row[1].replace(/<(?:th|td)>[^<>]*<\/(?:th|td)>/g,"").trim();
   return cells.length&&!rest?cells.map(c=>({tag:c[1],label:c[2]})):null;
  });
  if(grid.some(cells=>!cells))continue;
  if(match.index>cursor)text(container,raw.slice(cursor,match.index),"span");
  const wrap=document.createElement("div");wrap.className="question-table-wrap";
  const table=document.createElement("table");table.className="question-table";
  for(const cells of grid){const tr=document.createElement("tr");for(const cell of cells)text(tr,cell.label,cell.tag);table.appendChild(tr);}
  wrap.appendChild(table);container.appendChild(wrap);cursor=pattern.lastIndex;
 }
 if(cursor<raw.length)text(container,raw.slice(cursor),"span");
 parent.appendChild(container);
}
function questionMarkup(parent,q,row,answers=false){
 text(parent,row.school+" · "+(unitName(row)?.mid||"단원 분류 확인 필요")+" · 원본 "+row.sourceQid+"번 파생","div","muted");
 questionStem(parent,q.content);figure(parent,q);
 q.choices.forEach((c,i)=>text(parent,positions[i]+" "+c,"div","choice"));
 if(answers){text(parent,"정답: "+q.answer+"\n"+(q.solution||""),"div","answer");}
}
function filtered(){
 const q=$("query").value.trim().toLowerCase(),major=$("major").value,unit=$("unit").value,school=$("school").value;
 return rows.filter(x=>{const t=unitName(x);return(!school||x.school===school)&&(!major||t?.major===major)&&(!unit||t?.mid===unit)&&(!q||[x.uid,String(x.sourceQid),x.l2,x.school,t?.major,t?.mid].join(" ").toLowerCase().includes(q));});
}
function option(parent,value,label){const el=document.createElement("option");el.value=value;el.textContent=label;parent.appendChild(el);}
function schoolRows(){return rows.filter(r=>!schoolChoice||r.school===schoolChoice);}
function syncUnits(resetMajor=false){
 const current=schoolRows().filter(x=>unitName(x));
 const majors=[...new Set(current.map(x=>unitName(x).major))];
 const major=$("major"),oldMajor=resetMajor?"":major.value;
 major.replaceChildren();option(major,"","전체 대단원");
 for(const name of majors){option(major,name,name);}
 major.value=majors.includes(oldMajor)?oldMajor:"";
 const unit=$("unit"),oldUnit=resetMajor?"":unit.value;
 const mids=[...new Set(current.filter(x=>!major.value||unitName(x).major===major.value).map(x=>unitName(x).mid))];
 unit.replaceChildren();option(unit,"","전체 중단원");
 for(const name of mids){const n=current.filter(x=>unitName(x).mid===name&&(!major.value||unitName(x).major===major.value)).length;option(unit,name,name+" · "+n+"문항");}
 unit.value=mids.includes(oldUnit)?oldUnit:"";
}
function renderSchools(){
 const host=$("school-cards");host.replaceChildren();
 for(const name of [...new Set(rows.map(r=>r.school))].sort()){
  const n=rows.filter(r=>r.school===name).length;
  const card=document.createElement("button");card.type="button";card.className="school-card"+(schoolChoice===name?" active":"");
  card.setAttribute("aria-pressed",String(schoolChoice===name));
  text(card,name,"strong");text(card,"공통수학1 · 검수 승인 "+n+"문항","small");
  card.onclick=()=>{schoolChoice=name;$("school").value=name;$("query").value="";syncUnits(true);renderSchools();list();};
  host.appendChild(card);
 }
}
function availableRows(){const major=$("major").value,unit=$("unit").value;return schoolRows().filter(r=>{const t=unitName(r);return t&&(!major||t.major===major)&&(!unit||t.mid===unit);});}
function updateAvailability(){
 const candidates=schoolChoice?availableRows():[],unmapped=schoolRows().filter(r=>!unitName(r)).length;
 $("availability").textContent=!schoolChoice?"먼저 학교를 선택하세요.":candidates.length+"문항 사용 가능"+(unmapped?" · 분류 확인 필요 "+unmapped+"문항 제외":"");
 $("generate").disabled=!schoolChoice||candidates.length===0;
}
function balancedSample(candidates,count){
 const buckets=new Map();
 for(const r of candidates){const key=r.l2+"::"+r.sourceQid;if(!buckets.has(key))buckets.set(key,[]);buckets.get(key).push(r);}
 const groups=[...buckets.values()];
 for(const group of groups){for(let i=group.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[group[i],group[j]]=[group[j],group[i]];}}
 const out=[];while(out.length<count&&groups.some(g=>g.length)){for(const group of groups){if(group.length)out.push(group.pop());if(out.length>=count)break;}}return out;
}
function makeExam(){
 if(!schoolChoice)return;
 const candidates=availableRows();
 const requested=Number($("amount").value)||candidates.length;
 const chosen=balancedSample(candidates,Math.min(requested,candidates.length));
 selected=new Set(chosen.map(r=>r.uid));
 refreshPrint();list();
 const heading=$("paper").querySelector?$("paper").querySelector("h1"):null;
 if(heading)heading.textContent="2026 "+schoolChoice+" 공통수학1 · "+($("unit").value||$("major").value||"전 범위")+" 모의고사";
 status("모의고사 "+chosen.length+"문항을 선택했습니다. 출력 화면을 엽니다.");
 $("print").click();
}
function list(){
 visible=filtered();$("count").textContent=visible.length;
 const container=$("items");container.replaceChildren();
 const frag=document.createDocumentFragment();
 for(const r of visible){
  const item=document.createElement("div");item.className="item";
  const check=document.createElement("input");check.type="checkbox";check.checked=selected.has(r.uid);check.setAttribute("aria-label",r.uid+" 선택");
  check.addEventListener("change",()=>{check.checked?selected.add(r.uid):selected.delete(r.uid);refreshPrint()});
  item.appendChild(check);
  const lab=document.createElement("label");text(lab,r.school+" · "+r.sourceQid+"번 파생 · "+(unitName(r)?.mid||"단원 분류 확인 필요"),"div");
  text(lab,r.uid,"small");item.appendChild(lab);
  const btn=document.createElement("button");btn.textContent="보기";btn.onclick=()=>preview(r);item.appendChild(btn);
  frag.appendChild(item);
 }
 container.appendChild(frag);updateAvailability();status("검수 승인 "+rows.length+"문항 중 "+visible.length+"문항 표시 · 선택 "+selected.size+"문항");
}
function refreshPrint(){$("print").disabled=selected.size===0;$("print").textContent="선택 문항 인쇄 ("+selected.size+")";}
async function preview(row){
 $("advanced").open=true;$("detail").textContent="문항을 확인하고 있습니다.";shown=row;showAnswer=false;$("toggle-answer").disabled=true;$("toggle-answer").textContent="정답·해설 보기";
 try{const q=await questionFor(row);if(shown!==row)return;
 $("detail").replaceChildren();questionMarkup($("detail"),q,row,false);$("toggle-answer").disabled=false;await math();
 }catch(e){$("detail").textContent=e.message;status(e.message)}
}
$("toggle-answer").addEventListener("click",async()=>{if(!shown)return;showAnswer=!showAnswer;const q=await questionFor(shown);$("detail").replaceChildren();questionMarkup($("detail"),q,shown,showAnswer);$("toggle-answer").textContent=showAnswer?"정답·해설 숨기기":"정답·해설 보기";await math()});
$("query").addEventListener("input",list);
$("school").addEventListener("change",()=>{schoolChoice=$("school").value;syncUnits(true);renderSchools();list();});
$("major").addEventListener("change",()=>{syncUnits();list();});
$("unit").addEventListener("change",list);
$("amount").addEventListener("change",updateAvailability);
$("generate").addEventListener("click",makeExam);
$("clear").addEventListener("click",()=>{selected.clear();refreshPrint();list()});
$("print").addEventListener("click",async()=>{
 if(!selected.size||selected.size>50){status("한 번에 1~50문항을 선택해 주세요.");return;}
 $("print").disabled=true;status("선택 문항의 출력을 준비 중입니다.");
 try{const panel=$("paper-items");panel.replaceChildren();
 for(const r of rows.filter(x=>selected.has(x.uid))){const q=await questionFor(r);const part=document.createElement("section");part.className="paper-question";questionMarkup(part,q,r,false);panel.appendChild(part)}
 await math();window.print();status("승인 문항 "+selected.size+"개 출력 화면을 열었습니다.");
 }catch(e){status("출력 준비 실패: "+e.message)}finally{refreshPrint()}
});
(async()=>{
 try{
 const data=await readJson(INDEX);
 if(data.schemaVersion!=="ALIVE_GENERATED_CONSUMER_INDEX_V1"||data.sourceKind!=="generated"||!Array.isArray(data.records)||data.records.length!==data.approvedCount||data.records.length<1)throw Error("등록 분모 불일치");
 const ids=data.records.map(r=>r.uid);if(!unique(ids)||ids.some(id=>!/^ALITE-[A-Za-z0-9-]+$/.test(id)||data.excludedHoldUids.includes(id)))throw Error("UID 중복 또는 보류 문항 혼입");
 rows=data.records;const schools=[...new Set(rows.map(r=>r.school))].sort();for(const name of schools){option($("school"),name,name)}
 $("total").textContent=rows.length;syncUnits(true);renderSchools();list();
 }catch(e){status("등록 자료를 확인할 수 없습니다: "+e.message);$("items").textContent=e.message}
})();
</script>
</body>
</html>
