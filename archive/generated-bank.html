<script>
"use strict";
const INDEX="data/generated-lite-consumer/v1/index.json";
const UNIT_LABELS=Object.freeze({});
let rows=[],selectableRows=[],searchableRows=[],userDisabledUids=new Set(),examChoice=null,busy=false,generatedBusy=false,generatedPreviewToken=0;
const selectedGenerated=new Map();
const $=id=>document.getElementById(id),positions="①②③④⑤",cache=new Map();
const status=message=>$("message").textContent=message;
const unique=items=>new Set(items).size===items.length;
const validGeneratedUid=row=>typeof row?.uid==="string"&&row.uid.trim().length>0;
const isSelectable=row=>{
 return window.ProblemBankMeta?.isGeneratedSelectable(row,[...userDisabledUids])===true;
};
function isTeacherSession(){
 try{
  const session=JSON.parse(localStorage.getItem("APMATH_SESSION")||"null");
  const role=String(session?.role||session?.user?.role||session?.auth?.role||"").replace(/\s/g,"").toLowerCase();
  const id=String(session?.id||session?.user?.id||session?.auth?.id||"").replace(/\s/g,"").toLowerCase();
  const loginId=String(session?.login_id||session?.loginId||session?.user?.login_id||session?.user?.loginId||"").replace(/\s/g,"").toLowerCase();
  return Boolean(session?.session_token)&&(["teacher","admin","owner"].includes(role)||id==="t_admin"||loginId==="admin");
 }catch{return false;}
}
const unitName=row=>UNIT_LABELS[row.l2]||null;
async function readJson(path){
 if(typeof path!=="string"||!/^data\/generated-lite-consumer\/v1\/[a-zA-Z0-9_./-]+\.json$/.test(path)||path.includes(".."))throw Error("등록 경로 불일치");
 const response=await fetch(path,{cache:"no-cache"});
 if(!response.ok)throw Error("등록 데이터 로드 실패: "+response.status);
 return response.json();
}
function text(parent,value,tag="div",cls=""){const node=document.createElement(tag);if(cls)node.className=cls;node.textContent=String(value??"");parent.appendChild(node);return node;}
async function math(){if(window.MathJax?.typesetPromise)try{await MathJax.typesetPromise();}catch(e){console.warn("수식 표시 확인 필요",e)}}
async function questionFor(row){
 if(row?.technicalStatus==="ERROR")throw Error("문항 기술 오류: "+(row.technicalIssues||[]).join(" · "));
 if(!isSelectable(row))throw Error("사용자가 비활성화했거나 사용할 수 없는 문항입니다.");
 if(!cache.has(row.shard)){
  cache.set(row.shard,readJson(row.shard).catch(e=>{cache.delete(row.shard);throw e}));
 }
 const data=await cache.get(row.shard);
 if(data.schemaVersion!=="ALIVE_GENERATED_CONSUMER_SHARD_V1"||!Array.isArray(data.records))throw Error("문항 등록 스키마 오류");
 const matches=data.records.filter(r=>r.generatedUid===row.uid&&r.localOrdinal===row.localOrdinal);
 if(matches.length!==1||matches[0].sourceKind!=="generated"||!Array.isArray(matches[0].question?.choices))throw Error("문항 UID/보기 결속 오류");
 const question=matches[0].question;
 const objective=question.questionType==="객관식"&&question.choices.length===5&&positions.includes(question.answer);
 const subjective=["서술형","단답형","주관식"].includes(question.questionType)&&question.choices.length===0&&String(question.answer||"").trim()!=="";
 if(!objective&&!subjective)throw Error("문항 형식/보기/정답 결속 오류");
 return question;
}
function figure(parent,q){
 if(!q.image)return;
 if(!/^assets\/generated-lite\/[A-Za-z0-9-]+\.svg$/.test(q.image))throw Error("문제 이미지 경로 오류");
 const img=document.createElement("img");img.src=q.image;img.alt=q.imageAlt||"문항 수학 시각자료";img.className="math-figure";parent.appendChild(img);
}
function questionStem(parent,value){
 const raw=String(value??""),container=document.createElement("div");container.className="stem";
 const pattern=/<div class="question-table-wrap"><table class="question-table">([\s\S]*?)<\/table><\/div>/g;
 let cursor=0,match;
 while((match=pattern.exec(raw))!==null){
  const inside=match[1],rows=[...inside.matchAll(/<tr>([\s\S]*?)<\/tr>/g)];
  const outside=inside.replace(/<\/?(?:thead|tbody)>/g,"").replace(/<tr>[\s\S]*?<\/tr>/g,"").trim();
  if(!rows.length||outside)continue;
  const grid=rows.map(row=>{
   const cells=[...row[1].matchAll(/<(th|td)>([^<>]*)<\/\1>/g)];
   const rest=row[1].replace(/<(?:th|td)>[^<>]*<\/(?:th|td)>/g,"").trim();
   return cells.length&&!rest?cells.map(c=>({tag:c[1],label:c[2]})):null;
  });
  if(grid.some(cells=>!cells))continue;
  if(match.index>cursor)text(container,raw.slice(cursor,match.index),"span");
  const wrap=document.createElement("div");wrap.className="question-table-wrap";
  const table=document.createElement("table");table.className="question-table";
  for(const cells of grid){const tr=document.createElement("tr");for(const cell of cells)text(tr,cell.label,cell.tag);table.appendChild(tr);}
  wrap.appendChild(table);container.appendChild(wrap);cursor=pattern.lastIndex;
 }
 if(cursor<raw.length)text(container,raw.slice(cursor),"span");
 parent.appendChild(container);
}
function questionMarkup(parent,q,row,answers=false){
 questionStem(parent,q.content);figure(parent,q);
 q.choices.forEach((c,i)=>text(parent,positions[i]+" "+c,"div","choice"));
 if(answers){text(parent,"정답: "+q.answer+"\n"+(q.solution||""),"div","answer");}
}

function examTitle(e){return e.year+" "+e.school+" "+e.grade+" "+e.semester+"학기 "+e.term;}
function examIdentity(row){
 const path=String(row.sourceExamPath||"").split("/").pop();
 const m=path.match(/^(\d{2,4})_([^_]+)_(\d+)학기_(중간|기말)_(고\d|중\d)/);
 if(!m)return null;
 const year=Number(m[1])<100?2000+Number(m[1]):Number(m[1]);
 if(row.school!==m[2]||Number(row.year)!==year||row.grade!==m[5])return null;
 return {year,school:m[2],grade:m[5],semester:Number(m[3]),term:m[4]};
}
function examRows(e){return e.rows;}
function availableExams(){
 const groups=new Map();
 for(const row of selectableRows){
  if(!/^[a-f0-9]{40}$/i.test(String(row.sourceExamBlobSha||""))||!Number.isInteger(Number(row.sourceQid))||Number(row.sourceQid)<1)continue;
  const identity=examIdentity(row);if(!identity)continue;
  const key=[row.sourceExamBlobSha,identity.school,identity.year,identity.grade,identity.semester,identity.term,row.subject].join("\n");
  if(!groups.has(key))groups.set(key,{...identity,sha:row.sourceExamBlobSha,subject:row.subject,rows:[],sourceQids:new Set()});
  const exam=groups.get(key);exam.rows.push(row);exam.sourceQids.add(Number(row.sourceQid));
 }
 return [...groups.values()].map(e=>({...e,count:e.sourceQids.size,sourceQids:[...e.sourceQids].sort((a,b)=>a-b)}))
  .filter(e=>e.count>0).sort((a,b)=>a.year-b.year||a.school.localeCompare(b.school,"ko")||a.semester-b.semester||a.term.localeCompare(b.term,"ko"));
}
function displayExams(){
 const host=$("exam-cards");host.replaceChildren();
 for(const e of availableExams()){
  const card=document.createElement("button");card.type="button";
  card.className="exam-card";card.setAttribute("aria-pressed",String(examChoice?.sha===e.sha));
  text(card,examTitle(e),"strong");
  text(card,e.count+"개 원본 문항 · "+e.rows.length+"개 등록 후보 · "+e.subject,"small");
  card.onclick=()=>{examChoice=e;displayExams();updateSelection();};
  host.appendChild(card);
 }
 if(!host.children.length)host.textContent="출력할 수 있는 시험지가 없습니다.";
}
function updateSelection(){
 $("print").disabled=!examChoice||busy;
 const el=$("selection-summary");el.replaceChildren();
 if(!examChoice){el.textContent="출력할 시험지를 선택해 주세요.";return;}
 text(el,examTitle(examChoice),"strong");
 text(el,examChoice.count+"개 원본 QID에서 등록된 Generated 문항을 하나씩 선택합니다.","div");
}
function chooseVariants(pool,count){
 // Prefer distinct source question numbers before taking additional variants.
 const groups=new Map();
 for(const r of pool){if(!groups.has(r.sourceQid))groups.set(r.sourceQid,[]);groups.get(r.sourceQid).push(r);}
 const ordered=[...groups.entries()].sort((a,b)=>a[0]-b[0]).map(([,items])=>{
  for(let i=items.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[items[i],items[j]]=[items[j],items[i]];}
  return items;
 });
 const chosen=[];
 while(chosen.length<count&&ordered.some(items=>items.length)){
  for(const items of ordered){if(items.length)chosen.push(items.pop());if(chosen.length===count)break;}
 }
 return chosen;
}
function generatedTitle(row){
 const unit=row.l2Label||unitName(row)||row.l2||"단원 정보 없음";
 return String(row.school||"")+" · "+String(row.year||"")+" · "+String(row.grade||"")+" · "+String(row.subject||"")+" · "+String(unit);
}
function generatedSearchText(row){
 return [row.school,row.year,row.grade,row.subject,row.l1,row.l2Label,unitName(row),row.l2,"q"+row.sourceQid,row.sourceQid,row.uid]
  .filter(value=>value!==undefined&&value!==null).join(" ").normalize("NFC").toLocaleLowerCase("ko-KR");
}
function renderGeneratedSearch(){
 const host=$("generated-results"),input=$("generated-search"),summary=$("generated-search-summary");
 if(!host||!input||!summary)return;
 const query=String(input.value||"").trim().normalize("NFC").toLocaleLowerCase("ko-KR");
 host.replaceChildren();
 if(!query){summary.textContent=selectableRows.length+"개 메인 등록 문항 중 검색어를 입력해 주세요.";return;}
 const terms=query.split(/\s+/).filter(Boolean);
 const matches=searchableRows.filter(item=>terms.every(term=>item.searchText.includes(term))).slice(0,50);
 summary.textContent=matches.length+"개 표시 (최대 50개) · 검색 대상 "+selectableRows.length+"개 메인 등록 문항";
 if(!matches.length){text(host,"검색 조건에 맞는 생성문제가 없습니다.","p");return;}
 for(const item of matches){
  const row=item.row,card=document.createElement("article");card.className="exam-card generated-question-card";
  text(card,generatedTitle(row),"strong");
  text(card,"원본 문항 q"+row.sourceQid+" · "+row.uid,"small");
  const provenance=document.createElement("small");
  provenance.textContent="검수 상태: "+String(row.reviewStatus||"기록 없음")+" · 기술 상태: "+String(row.technicalStatus||"확인 필요");
  card.appendChild(provenance);
  if(row.technicalStatus==="ERROR")text(card,(row.technicalIssues||[]).join(" · "),"p","technical-error");
  const actions=document.createElement("div");actions.className="generated-actions";
  const open=document.createElement("button");open.type="button";open.textContent="문항 열기";open.addEventListener("click",()=>openGeneratedPreview(row));
  const add=document.createElement("button");add.type="button";add.className="primary";add.textContent=selectedGenerated.has(row.uid)?"추가됨":"시험지에 선택";add.disabled=selectedGenerated.has(row.uid);add.addEventListener("click",()=>addGeneratedQuestion(row));
  actions.appendChild(open);actions.appendChild(add);card.appendChild(actions);host.appendChild(card);
 }
}
async function openGeneratedPreview(row){
 const host=$("generated-preview"),token=++generatedPreviewToken;host.hidden=false;host.replaceChildren();text(host,"문항을 불러오는 중입니다.","p");
 try{
  const q=await questionFor(row);if(token!==generatedPreviewToken)return;host.replaceChildren();text(host,generatedTitle(row),"h3");
  text(host,"원본 문항 q"+row.sourceQid+" · "+row.uid,"p");
  const body=document.createElement("section");body.className="paper-question";questionStem(body,q.content);figure(body,q);
  if(Array.isArray(q.choices))q.choices.forEach((choice,i)=>text(body,positions[i]+" "+choice,"div","choice"));
  host.appendChild(body);
  if(isTeacherSession()){
   const solution=document.createElement("button");solution.type="button";solution.className="solution-preview";solution.textContent="교사용 해설 미리보기";
   solution.addEventListener("click",()=>openGeneratedSolution(row));host.appendChild(solution);
  }
  const add=document.createElement("button");add.type="button";add.className="primary";add.textContent=selectedGenerated.has(row.uid)?"선택됨":"시험지에 선택";add.disabled=selectedGenerated.has(row.uid);add.addEventListener("click",()=>addGeneratedQuestion(row));host.appendChild(add);
  await math();
 }catch(error){if(token!==generatedPreviewToken)return;host.replaceChildren();text(host,error.message||"문항을 열지 못했습니다.","p");}
}
async function openGeneratedSolution(row){
 if(!isTeacherSession()){status("교사 로그인 후 해설을 확인할 수 있습니다.");return;}
 const popup=window.open("about:blank","_blank");
 if(!popup){status("팝업을 허용한 뒤 해설을 확인하세요.");return;}
 let envelope=null;
 try{
  const q=await questionFor(row);
  if(popup.closed)return;
  if(!isTeacherSession())throw Error("교사 로그인을 확인한 뒤 다시 시도하세요.");
  const output=window.Archive2Output;
  if(!output?.publishOutputEnvelope||!output?.outputEnvelopeUrl)throw Error("해설 출력 엔진을 불러오지 못했습니다.");
  const solutionQuestion={...q,solutionImageSize:"full",solutionImageLayout:"fullwidth"};
  envelope=await output.publishOutputEnvelope({
   sourceKind:"generated-bank",sourceId:row.uid,mode:"sol",questionCount:1,questionUids:[row.uid],
   meta:{title:generatedTitle(row),qpp:1,questionUids:[row.uid]},questions:[solutionQuestion]
  });
  if(popup.closed){await output.createOutputStore().cleanup(envelope.ownerId,envelope.outputRequestId);return;}
  const url=output.outputEnvelopeUrl("mixed_engine.html",location.href,envelope,{preview:true});
  popup.location.href=url.href;
  status("교사용 해설 미리보기를 열었습니다.");
 }catch(error){
  if(envelope)try{await window.Archive2Output?.createOutputStore().cleanup(envelope.ownerId,envelope.outputRequestId);}catch{}
  try{if(!popup.closed)popup.close();}catch{}
  status("해설 미리보기를 열지 못했습니다: "+(error.message||"오류"));
 }
}
function addGeneratedQuestion(row){
 if(!isSelectable(row)){status(row?.technicalIssues?.join(" · ")||"사용자가 비활성화한 문항입니다.");return;}
 if(!selectedGenerated.has(row.uid))selectedGenerated.set(row.uid,row);
 renderGeneratedSelection();renderGeneratedSearch();
}
function renderGeneratedSelection(){
 const list=$("generated-selection-list"),summary=$("generated-selection-summary"),print=$("generated-print"),clear=$("generated-clear");
 if(!list||!summary||!print||!clear)return;
 list.replaceChildren();const selected=[...selectedGenerated.values()];
 summary.textContent=selected.length?selected.length+"개 문항이 선택되었습니다.":"선택된 문항이 없습니다.";
 for(const row of selected){
  const item=document.createElement("div");item.className="generated-selection-row";
  text(item,generatedTitle(row)+" · 원본 q"+row.sourceQid+" · "+row.uid,"span");
  const remove=document.createElement("button");remove.type="button";remove.textContent="제거";remove.addEventListener("click",()=>{selectedGenerated.delete(row.uid);renderGeneratedSelection();renderGeneratedSearch();});item.appendChild(remove);list.appendChild(item);
 }
 print.disabled=!selected.length||generatedBusy;clear.disabled=!selected.length||generatedBusy;
}
async function printGeneratedSelection(){
 if(generatedBusy||!selectedGenerated.size)return;
 generatedBusy=true;renderGeneratedSelection();const selected=[...selectedGenerated.values()];let popup=null,envelope=null;
 try{
  if(!unique(selected.map(row=>row.uid))||selected.some(row=>!isSelectable(row)))throw Error("선택 문항의 기술 상태 또는 사용자 비활성화 상태를 확인하지 못했습니다.");
  popup=window.open("about:blank","_blank");if(!popup)throw Error("팝업을 허용한 뒤 선택 문항 미리보기를 여세요.");
  status("선택한 "+selected.length+"개 문항을 준비하고 있습니다.");
  const questions=await Promise.all(selected.map(questionFor));
  if(popup.closed)throw Error("미리보기 창이 닫혔습니다.");
  const output=window.Archive2Output;
  if(!output?.publishOutputEnvelope||!output?.outputEnvelopeUrl)throw Error("문항 출력 미리보기 엔진을 불러오지 못했습니다.");
  envelope=await output.publishOutputEnvelope({
   sourceKind:"generated-bank",sourceId:selected.map(row=>row.uid).join(","),mode:"exam",questionCount:selected.length,
   questionUids:selected.map(row=>row.uid),meta:{title:"생성문제 · "+selected.length+"문항",qpp:1,questionUids:selected.map(row=>row.uid)},questions
  });
  if(popup.closed){await output.createOutputStore().cleanup(envelope.ownerId,envelope.outputRequestId);return;}
  const url=output.outputEnvelopeUrl("mixed_engine.html",location.href,envelope,{preview:true});
  popup.location.href=url.href;status("선택한 "+selected.length+"개 문항의 출력 미리보기를 열었습니다.");
 }catch(error){
  if(envelope)try{await window.Archive2Output?.createOutputStore().cleanup(envelope.ownerId,envelope.outputRequestId);}catch{}
  try{if(popup&&!popup.closed)popup.close();}catch{}
  status("선택 문항 미리보기를 열지 못했습니다: "+(error.message||"오류"));
 }
 finally{generatedBusy=false;renderGeneratedSelection();updateSelection();}
}
async function printExam(){
 if(!examChoice||busy)return;
 const e=examChoice;
 const pool=examRows(e);
 if(pool.length<e.count){status("해당 시험지의 문항 수가 부족합니다.");return;}
 busy=true;updateSelection();status("모의고사 "+e.count+"문항을 준비하고 있습니다.");
 try{
  const chosen=chooseVariants(pool,e.count);
  if(chosen.length!==e.count||!unique(chosen.map(r=>r.uid)))throw Error("문항 수 또는 UID 구성 오류");
  const questions=await Promise.all(chosen.map(r=>questionFor(r)));
  const panel=$("paper-items"),fragment=document.createDocumentFragment();
  for(let i=0;i<chosen.length;i++){
   const part=document.createElement("section");part.className="paper-question";
   text(part,String(i+1)+".","div","paper-number");questionMarkup(part,questions[i],chosen[i],false);
   fragment.appendChild(part);
  }
  panel.replaceChildren(fragment);
  $("paper-title").textContent=examTitle(e)+" 모의고사";
  await math();
  status(e.count+"문항 인쇄 화면을 엽니다.");
  window.print();
 }catch(error){status("출력을 준비하지 못했습니다: "+error.message);}
 finally{busy=false;updateSelection();}
}
$("print").addEventListener("click",printExam);
$("generated-search").addEventListener("input",renderGeneratedSearch);
$("generated-print").addEventListener("click",printGeneratedSelection);
$("generated-clear").addEventListener("click",()=>{selectedGenerated.clear();renderGeneratedSelection();renderGeneratedSearch();});
(async()=>{
 try{
  const data=await readJson(INDEX);
  if(data.schemaVersion!=="ALIVE_GENERATED_CONSUMER_INDEX_V1"||data.sourceKind!=="generated"||!Array.isArray(data.records)||(data.recordCount??data.approvedCount)!==data.records.length||data.records.length<1)throw Error("문제지 데이터 확인 실패");
  const ids=data.records.map(r=>r.uid);
  if(!Array.isArray(data.userDisabledUids||[])||!unique(ids)||data.records.some(row=>typeof row.uid!=="string"||!row.uid.trim()))throw Error("문항 데이터 확인 실패");
  rows=data.records;userDisabledUids=new Set(data.userDisabledUids||[]);
  selectableRows=rows.filter(isSelectable);
  searchableRows=selectableRows.map(row=>({row,searchText:generatedSearchText(row)}));
  const requestedUid=typeof location==='object'?new URLSearchParams(location.search).get('uid'):null;
  if(requestedUid&&selectableRows.some(row=>row.uid===requestedUid))$("generated-search").value=requestedUid;
  displayExams();updateSelection();renderGeneratedSearch();renderGeneratedSelection();
  status(data.sourceSync?.errorCount?"일부 문항에서 기술 오류 "+data.sourceSync.errorCount+"건이 확인됐습니다. 문항별 오류를 확인하세요.":"");
 }catch(error){status("시험지를 불러오지 못했습니다: "+error.message);$("exam-cards").textContent="시험지 목록을 확인할 수 없습니다.";}
})();
</script>
