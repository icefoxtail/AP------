<svg xmlns="http://www.w3.org/2000/svg" width="760" height="470" viewBox="0 0 760 470"><defs><style>.bg{fill:#f8fafc}.card{fill:#fff;stroke:#cbd5e1;stroke-width:2}.title{font:700 27px 'Noto Sans KR','Malgun Gothic',sans-serif;fill:#0f172a}.label{font:600 20px 'Noto Sans KR','Malgun Gothic',sans-serif;fill:#1e293b}.small{font:500 16px 'Noto Sans KR','Malgun Gothic',sans-serif;fill:#475569}.math{font:600 22px 'Cambria Math','Times New Roman',serif;fill:#0f172a}.edge{stroke:#64748b;stroke-width:5;stroke-linecap:round}.hot{stroke:#dc2626;stroke-width:8;stroke-linecap:round}.node{fill:#fff;stroke:#334155;stroke-width:3}.hotnode{fill:#fff7ed;stroke:#dc2626;stroke-width:4}</style></defs><rect class="bg" width="760" height="470" rx="22"/><text class="title" x="34" y="48">세 변의 자리 묶음마다 남학생 한 명 이상</text><text class="small" x="36" y="82">각 변에 속한 세 자리를 한 그룹으로 봅니다.</text><rect class="card" x="28" y="104" width="360" height="330" rx="18"/><path d="M205 145 L100 360 L310 360 Z" fill="#fff" stroke="#334155" stroke-width="4"/><text class="small" x="166" y="159">변 1</text><text class="small" x="81" y="287">변 2</text><text class="small" x="260" y="287">변 3</text><circle cx="160" cy="112" r="18" fill="#bae6fd" stroke="#334155" stroke-width="2"/><circle cx="250" cy="112" r="18" fill="#bae6fd" stroke="#334155" stroke-width="2"/><circle cx="205" cy="100" r="18" fill="#bae6fd" stroke="#334155" stroke-width="2"/><circle cx="72" cy="246" r="18" fill="#bbf7d0" stroke="#334155" stroke-width="2"/><circle cx="85" cy="310" r="18" fill="#bbf7d0" stroke="#334155" stroke-width="2"/><circle cx="98" cy="374" r="18" fill="#bbf7d0" stroke="#334155" stroke-width="2"/><circle cx="312" cy="246" r="18" fill="#fde68a" stroke="#334155" stroke-width="2"/><circle cx="325" cy="310" r="18" fill="#fde68a" stroke="#334155" stroke-width="2"/><circle cx="338" cy="374" r="18" fill="#fde68a" stroke="#334155" stroke-width="2"/><rect class="card" x="412" y="104" width="320" height="330" rx="18"/><text class="label" x="438" y="148">남학생 자리 선택</text><text class="math" x="438" y="200">C(9,5) = 126</text><text class="small" x="438" y="232">한 변에 남학생이 없으면</text><text class="math" x="438" y="274">3 × C(6,5) = 18</text><text class="small" x="438" y="307">두 변이 비는 경우는 불가능</text><line x1="438" y1="326" x2="705" y2="326" stroke="#cbd5e1" stroke-width="2"/><text class="math" x="438" y="365">126 − 18 = 108</text><text class="small" x="438" y="402">세 변 모두 남학생 포함</text></svg>
