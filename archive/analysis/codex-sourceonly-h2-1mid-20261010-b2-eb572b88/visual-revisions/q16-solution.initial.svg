<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430"><defs><style>.bg{fill:#f8fafc}.card{fill:#fff;stroke:#cbd5e1;stroke-width:2}.title{font:700 27px 'Noto Sans KR','Malgun Gothic',sans-serif;fill:#0f172a}.label{font:600 20px 'Noto Sans KR','Malgun Gothic',sans-serif;fill:#1e293b}.small{font:500 16px 'Noto Sans KR','Malgun Gothic',sans-serif;fill:#475569}.math{font:600 22px 'Cambria Math','Times New Roman',serif;fill:#0f172a}.edge{stroke:#64748b;stroke-width:5;stroke-linecap:round}.hot{stroke:#dc2626;stroke-width:8;stroke-linecap:round}.node{fill:#fff;stroke:#334155;stroke-width:3}.hotnode{fill:#fff7ed;stroke:#dc2626;stroke-width:4}</style></defs><rect class="bg" width="760" height="430" rx="22"/><text class="title" x="34" y="48">네 색 모두 사용: 한 회전 궤도</text><text class="small" x="36" y="82">대표 배열 하나의 네 회전은 서로 다르며, 같은 배열로 묶입니다.</text><rect class="card" x="30" y="110" width="390" height="265" rx="18"/><text class="label" x="58" y="148">한 대표 배열의 회전</text><rect x="62" y="176" width="82" height="82" fill="#bae6fd" stroke="#334155" stroke-width="3"/><text x="103" y="226" text-anchor="middle" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="24" font-weight="700" fill="#0f172a">A</text><rect x="144" y="176" width="82" height="82" fill="#bbf7d0" stroke="#334155" stroke-width="3"/><text x="185" y="226" text-anchor="middle" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="24" font-weight="700" fill="#0f172a">B</text><rect x="62" y="258" width="82" height="82" fill="#fbcfe8" stroke="#334155" stroke-width="3"/><text x="103" y="308" text-anchor="middle" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="24" font-weight="700" fill="#0f172a">D</text><rect x="144" y="258" width="82" height="82" fill="#fde68a" stroke="#334155" stroke-width="3"/><text x="185" y="308" text-anchor="middle" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="24" font-weight="700" fill="#0f172a">C</text><text class="small" x="260" y="205">0°</text><text class="small" x="320" y="248">90°</text><text class="small" x="260" y="292">180°</text><text class="small" x="312" y="336">270°</text><path d="M250 190 C320 140 375 190 340 225" fill="none" stroke="#0f766e" stroke-width="3" marker-end="url(#arr)"/><path d="M342 255 C375 305 315 340 276 316" fill="none" stroke="#0f766e" stroke-width="3" marker-end="url(#arr)"/><path d="M245 318 C195 335 185 280 205 255" fill="none" stroke="#0f766e" stroke-width="3" marker-end="url(#arr)"/><path d="M210 220 C190 185 220 160 246 170" fill="none" stroke="#0f766e" stroke-width="3" marker-end="url(#arr)"/><rect class="card" x="444" y="110" width="286" height="265" rx="18"/><text class="label" x="472" y="150">전체 배열을 궤도로 묶기</text><text class="math" x="480" y="216">4! = 24</text><text class="small" x="480" y="252">각 궤도는 회전 4개</text><line x1="476" y1="278" x2="697" y2="278" stroke="#cbd5e1" stroke-width="2"/><text class="math" x="480" y="328">24 ÷ 4 = 6</text><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L6,3 z" fill="#0f766e"/></marker></defs></svg>
