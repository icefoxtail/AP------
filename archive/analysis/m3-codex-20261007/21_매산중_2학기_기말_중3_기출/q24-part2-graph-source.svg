<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" role="img" aria-labelledby="title desc">
<title id="title">아이폰 평점 도수 그래프</title>
<desc id="desc">평점 1, 2, 3, 4, 5의 도수는 각각 1, 2, 4, 2, 1명이며 전체는 10명이다.</desc>
<rect width="900" height="560" fill="#ffffff"/>
<text x="450" y="46" text-anchor="middle" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="26" font-weight="700" fill="#172033">아이폰 평점 도수 그래프</text>
<text x="450" y="78" text-anchor="middle" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="18" fill="#475569">어린이 10명의 평점</text>
<g stroke="#d7dee8" stroke-width="1.5">
<line x1="190" y1="130" x2="820" y2="130"/><line x1="190" y1="210" x2="820" y2="210"/>
<line x1="190" y1="290" x2="820" y2="290"/><line x1="190" y1="370" x2="820" y2="370"/>
<line x1="190" y1="450" x2="820" y2="450"/>
</g>
<g stroke="#1f2937" stroke-width="2.5" fill="none"><line x1="190" y1="125" x2="190" y2="450"/><line x1="190" y1="450" x2="825" y2="450"/></g>
<g font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="17" fill="#334155" text-anchor="end">
<text x="174" y="456">0</text><text x="174" y="376">1</text><text x="174" y="296">2</text><text x="174" y="216">3</text><text x="174" y="136">4</text>
</g>
<g fill="#4f83c2" stroke="#285b91" stroke-width="2">
<rect data-score="1" data-frequency="1" x="227" y="370" width="76" height="80"/><rect data-score="2" data-frequency="2" x="357" y="290" width="76" height="160"/>
<rect data-score="3" data-frequency="4" x="487" y="130" width="76" height="320"/><rect data-score="4" data-frequency="2" x="617" y="290" width="76" height="160"/>
<rect data-score="5" data-frequency="1" x="747" y="370" width="76" height="80"/>
</g>
<g font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="19" font-weight="700" fill="#172033" text-anchor="middle">
<text x="265" y="357">1명</text><text x="395" y="277">2명</text><text x="525" y="117">4명</text><text x="655" y="277">2명</text><text x="785" y="357">1명</text>
</g>
<g font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="19" fill="#172033" text-anchor="middle"><text x="265" y="482">1</text><text x="395" y="482">2</text><text x="525" y="482">3</text><text x="655" y="482">4</text><text x="785" y="482">5</text></g>
<text x="510" y="525" text-anchor="middle" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="19" fill="#172033">평점</text>
<text x="42" y="288" transform="rotate(-90 42 288)" text-anchor="middle" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="19" fill="#172033">도수 (명)</text>
</svg>
