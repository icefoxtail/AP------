<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 230" width="720" height="460" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc">
  <title id="title">직각삼각형 ABC와 내접원</title>
  <desc id="desc">A에서 직각인 삼각형. AB는 15cm, AC는 8cm이고 I는 내심이다. 변 BC는 구할 길이이다.</desc>
  <rect width="360" height="230" fill="#ffffff"/>
  <text x="24" y="28" font-family="'Noto Sans KR',sans-serif" font-size="15" font-weight="700" fill="#111827">△ABC와 내접원</text>
  <polygon points="80,60 260,60 80,156" fill="#f8fafc" stroke="#1f2937" stroke-width="2.2" stroke-linejoin="round"/>
  <circle cx="116" cy="96" r="36" fill="#dbeafe" fill-opacity="0.45" stroke="#2563eb" stroke-width="2"/>
  <line x1="116" y1="96" x2="80" y2="96" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="4 3"/>
  <path d="M80 60h12v12H80" fill="none" stroke="#111827" stroke-width="1.5"/>
  <circle cx="116" cy="96" r="2.8" fill="#111827"/>
  <circle cx="116" cy="60" r="1.8" fill="#2563eb"/>
  <circle cx="80" cy="96" r="1.8" fill="#2563eb"/>
  <text x="63" y="56" font-family="'STIX Two Math',serif" font-size="14" font-style="italic" fill="#111827">A</text>
  <text x="266" y="56" font-family="'STIX Two Math',serif" font-size="14" font-style="italic" fill="#111827">B</text>
  <text x="64" y="174" font-family="'STIX Two Math',serif" font-size="14" font-style="italic" fill="#111827">C</text>
  <text x="122" y="101" font-family="'STIX Two Math',serif" font-size="14" font-style="italic" fill="#111827">I</text>
  <text x="156" y="51" text-anchor="middle" font-family="'STIX Two Math','Malgun Gothic',serif" font-size="13" fill="#111827">15 cm</text>
  <text x="46" y="112" text-anchor="middle" font-family="'STIX Two Math','Malgun Gothic',serif" font-size="13" fill="#111827">8 cm</text>
  <text x="92" y="91" font-family="'STIX Two Math',serif" font-size="13" font-style="italic" fill="#1d4ed8">r</text>
</svg>
