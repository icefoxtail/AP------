<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" width="720" height="440" role="img" aria-labelledby="title desc"><title id="title">무게중심의 자취</title><desc id="desc">B가 원의 제1사분원에서 움직일 때 G는 중심 (5/3,0), 반지름 5/3인 원의 1/4호를 그린다.</desc><rect width="720" height="440" fill="#fff"/><style>text{font-family:Noto Sans KR, Pretendard, sans-serif;fill:#172033}.title{font-size:20px;font-weight:700}.label{font-size:15px}.small{font-size:12px;fill:#475569}.axis{stroke:#64748b;stroke-width:1.4}.main{stroke:#2563eb;stroke-width:3;fill:none}.aux{stroke:#64748b;stroke-width:1.8;fill:none;stroke-dasharray:7 5}.point{fill:#b91c1c;stroke:#fff;stroke-width:1.5}.fillA{fill:#fb7185;fill-opacity:.22;stroke:#be123c;stroke-width:2.5}.fillB{fill:#34d399;fill-opacity:.20;stroke:#047857;stroke-width:2.5}.overlap{fill:#60a5fa;fill-opacity:.58;stroke:#1d4ed8;stroke-width:2}</style><text x="28" y="36" class="title">무게중심의 자취</text><circle cx="285" cy="270" r="180" fill="#dbeafe" fill-opacity=".20" stroke="#2563eb" stroke-width="3"/><line x1="105" y1="270" x2="500" y2="270" class="axis"/><line x1="285" y1="80" x2="285" y2="390" class="axis"/><line x1="285" y1="270" x2="465" y2="270" class="aux"/><line x1="285" y1="270" x2="285" y2="90" class="aux"/><circle cx="465" cy="270" r="7" class="point"/><circle cx="285" cy="90" r="7" class="point"/><path d="M405 270 A60 60 0 0 0 345 210" fill="none" stroke="#be123c" stroke-width="5"/><circle cx="345" cy="270" r="6" fill="#047857"/><text x="468" y="292" class="label">A(5,0)</text><text x="290" y="84" class="label">B</text><text x="410" y="255" class="small">G의 궤적 반지름 5/3</text><text x="90" y="395" class="label">호의 길이 = 5π/6</text></svg>