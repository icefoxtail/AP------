<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" width="720" height="440" role="img" aria-labelledby="title desc"><title id="title">두 점 사이의 거리</title><desc id="desc">A(3,0), C(4,0), B(4,2)로 만든 직각삼각형에서 AB=√5이다.</desc><rect width="720" height="440" fill="#fff"/><style>text{font-family:Noto Sans KR, Pretendard, sans-serif;fill:#172033}.title{font-size:20px;font-weight:700}.label{font-size:15px}.small{font-size:12px;fill:#475569}.axis{stroke:#64748b;stroke-width:1.4}.main{stroke:#2563eb;stroke-width:3;fill:none}.aux{stroke:#64748b;stroke-width:1.8;fill:none;stroke-dasharray:7 5}.point{fill:#b91c1c;stroke:#fff;stroke-width:1.5}.fillA{fill:#fb7185;fill-opacity:.22;stroke:#be123c;stroke-width:2.5}.fillB{fill:#34d399;fill-opacity:.20;stroke:#047857;stroke-width:2.5}.overlap{fill:#60a5fa;fill-opacity:.58;stroke:#1d4ed8;stroke-width:2}</style><text x="28" y="36" class="title">두 점 사이의 거리</text><line x1="110" y1="335" x2="620" y2="335" class="axis"/><line x1="190" y1="390" x2="190" y2="70" class="axis"/><polyline points="400,335 400,195 330,335 400,335" fill="#dbeafe" fill-opacity=".5" stroke="#2563eb" stroke-width="3"/><circle cx="330" cy="335" r="7" class="point"/><circle cx="400" cy="335" r="7" fill="#047857"/><circle cx="400" cy="195" r="7" class="point"/><text x="300" y="365" class="label">A(3,0)</text><text x="405" y="190" class="label">B(4,2)</text><text x="405" y="362" class="label">C(4,0)</text><text x="235" y="215" class="small">AC=1, BC=2, AB=√5</text></svg>