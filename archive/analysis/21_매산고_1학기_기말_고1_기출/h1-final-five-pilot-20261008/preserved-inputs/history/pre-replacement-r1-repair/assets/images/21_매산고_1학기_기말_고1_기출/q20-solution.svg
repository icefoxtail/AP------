<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" role="img" aria-labelledby="title desc"><title id="title">예시 순서쌍 (3,5)에서 생기는 삼각형</title><desc id="desc">O(0,0), M(3,5), N(8,2)인 삼각형. 넓이는 17이다.</desc><rect width="720" height="460" fill="#fff"/><g stroke="#cbd5e1" stroke-width="1"><path d="M90 380H660M120 420V45"/></g><g stroke="#334155" stroke-width="2" fill="none"><path d="M160 340L310 90L560 240Z"/></g><path d="M160 340L310 90L560 240Z" fill="#dbeafe" fill-opacity=".75"/><g fill="#0f172a" font-family="Arial,sans-serif" font-size="18"><circle cx="160" cy="340" r="5"/><text x="118" y="365">O(0,0)</text><circle cx="310" cy="90" r="5"/><text x="270" y="70">M(a,b)=(3,5)</text><circle cx="560" cy="240" r="5"/><text x="570" y="245">N(a+b,b−a)=(8,2)</text></g><text x="150" y="420" fill="#334155" font-family="Arial,sans-serif" font-size="16">예: (a,b)=(3,5),  넓이 = (a²+b²)/2 = 17</text></svg>