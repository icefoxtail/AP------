<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" width="720" height="440" role="img" aria-labelledby="title desc"><title id="title">연립부등식의 공통 해</title><desc id="desc">두 부등식의 해의 교집합은 1 이상 2 미만이다.</desc><rect width="720" height="440" fill="#fff"/><style>text{font-family:Noto Sans KR, Pretendard, sans-serif;fill:#172033}.title{font-size:20px;font-weight:700}.label{font-size:15px}.small{font-size:12px;fill:#475569}.axis{stroke:#64748b;stroke-width:1.4}.main{stroke:#2563eb;stroke-width:3;fill:none}.aux{stroke:#64748b;stroke-width:1.8;fill:none;stroke-dasharray:7 5}.point{fill:#b91c1c;stroke:#fff;stroke-width:1.5}.fillA{fill:#fb7185;fill-opacity:.22;stroke:#be123c;stroke-width:2.5}.fillB{fill:#34d399;fill-opacity:.20;stroke:#047857;stroke-width:2.5}.overlap{fill:#60a5fa;fill-opacity:.58;stroke:#1d4ed8;stroke-width:2}</style><text x="28" y="36" class="title">연립부등식의 공통 해</text><line x1="100" y1="220" x2="620" y2="220" class="axis"/><line x1="240" y1="190" x2="240" y2="250" class="main"/><line x1="380" y1="190" x2="380" y2="250" class="main"/><circle cx="240" cy="220" r="8" fill="#2563eb"/><circle cx="380" cy="220" r="8" fill="#fff" stroke="#2563eb" stroke-width="3"/><text x="230" y="278" class="label">1</text><text x="370" y="278" class="label">2</text><text x="275" y="175" class="small">1 ≤ x &lt; 2</text></svg>