<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" role="img" aria-labelledby="t d"><title id="t">R을 지나는 최단 경로의 두 구간</title><desc id="d">다섯 칸 이동 중 위쪽 두 번을 골라 P에서 R로 간 뒤, 네 칸 이동 중 위쪽 두 번을 골라 R에서 Q로 간다.</desc><rect width="720" height="430" rx="24" fill="#fff"/><text x="28" y="42" font-size="24" font-family="Arial,sans-serif" font-weight="700" fill="#17324d">경로를 P→R과 R→Q로 나누기</text><g stroke="#c7d2df" stroke-width="2"><path d="M100 100H600M100 160H600M100 220H600M100 280H600M100 340H600M100 100V340M200 100V340M300 100V340M400 100V340M500 100V340M600 100V340" fill="none"/></g><polyline points="100,340 200,340 300,340 400,340 400,280 400,220 500,220 600,220 600,160 600,100" fill="none" stroke="#2f6690" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><g font-family="Arial,sans-serif" font-size="20" font-weight="700" text-anchor="middle"><circle cx="100" cy="340" r="17" fill="#f4c95d"/><text x="100" y="375" fill="#17324d">P</text><circle cx="400" cy="220" r="17" fill="#9bd0c2"/><text x="425" y="225" fill="#17324d">R</text><circle cx="600" cy="100" r="17" fill="#f4c95d"/><text x="630" y="105" fill="#17324d">Q</text></g><text x="30" y="402" font-size="20" font-family="Arial,sans-serif" fill="#17324d">P→R: ⁵C₂ = 10</text><text x="255" y="402" font-size="20" font-family="Arial,sans-serif" fill="#17324d">R→Q: ⁴C₂ = 6</text><text x="500" y="402" font-size="22" font-family="Arial,sans-serif" font-weight="700" fill="#17324d">10 × 6 = 60</text></svg>
