<!doctype html><meta charset="utf-8"><title>M3 Final SVG Inspection</title>
<style>*{box-sizing:border-box}body{font:14px system-ui,"Malgun Gothic",sans-serif;margin:0;background:#eef1f4;color:#17202a}.top{position:sticky;top:0;background:white;padding:9px 12px;display:flex;gap:12px;align-items:center;border-bottom:1px solid #ccd2d8;z-index:2}.grid{display:grid;grid-template-columns:repeat(2,minmax(300px,1fr));gap:10px;padding:10px}.card{background:white;border:1px solid #cbd2d9;border-radius:7px;padding:9px;min-width:0}.card h3{font-size:14px;margin:0 0 4px}.meta{font-size:11px;color:#52606d}.source{height:34px;overflow:hidden;font-size:10px;padding:4px;background:#f7f8fa;margin:4px 0}.images{display:grid;grid-template-columns:1fr 1fr;gap:6px}.images figure{margin:0}.images figcaption{font-size:10px}.images img{display:block;width:100%;height:190px;object-fit:contain;background:#fff;border:1px solid #e2e6ea}.controls button{padding:4px 9px}</style>
<div class="top"><strong>Final generated SVGs</strong><span id="page"></span><span id="count"></span><button id="prev">Previous</button><button id="next">Next</button></div><main class="grid" id="grid"></main>
<script>
const esc=s=>String(s??"").replace(/[&<>\"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));let rows=[],page=0;const per=4;
Promise.all([fetch("/archive/evidence/visual-upgrade-2025-m3-independent-b/build_outputs.json").then(r=>r.json()),fetch("/archive/evidence/visual-upgrade-2025-m3-independent-b/inventory.json").then(r=>r.json())]).then(([b,i])=>{const q=new Map(i.exams.flatMap(e=>e.questions.map(x=>[x.questionUid,x])));rows=b.assets.map(a=>({asset:a,q:q.get(a.questionUid)}));draw()});
function draw(){const n=Math.ceil(rows.length/per);page=Math.max(0,Math.min(page,n-1));document.querySelector("#page").textContent="page "+(page+1)+"/"+n;document.querySelector("#count").textContent=rows.length+" changed SVGs";const host=document.querySelector("#grid");host.innerHTML="";for(const x of rows.slice(page*per,(page+1)*per)){const a=x.asset,q=x.q;const card=document.createElement("article");card.className="card";card.innerHTML="<h3>"+esc(a.sourcePath.split("/").pop())+" #"+esc(a.qid)+" · "+esc(a.action)+" · "+esc(a.svgPath.split("/").pop())+"</h3><div class=\"meta\">solution SHA "+esc(a.solutionSha256)+" · expected/observed facts "+a.structuredExpectedFacts.length+"</div><div class=\"source\">"+esc(q.content)+"</div><div class=\"images\"><figure><figcaption>source problem image</figcaption>"+(q.problemImagePath?"<img src=\"/"+esc(q.problemImagePath)+"\">":"<span>none</span>")+"</figure><figure><figcaption>generated/final solution SVG</figcaption><img src=\"/"+esc(a.svgPath)+"\"></figure></div><div class=\"meta\">"+esc(q.solution.slice(0,240))+"</div>";host.appendChild(card)}document.querySelector("#prev").disabled=page===0;document.querySelector("#next").disabled=page>=n-1}
document.querySelector("#prev").onclick=()=>{page--;draw()};document.querySelector("#next").onclick=()=>{page++;draw()};
</script>
