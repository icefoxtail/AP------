<!doctype html><meta charset="utf-8"><title>M3 Visual Baseline Inspection</title>
<style>
*{box-sizing:border-box}body{font:14px system-ui,"Malgun Gothic",sans-serif;margin:0;background:#eef1f4;color:#17202a}.top{position:sticky;top:0;background:#fff;padding:10px 14px;border-bottom:1px solid #ccd3da;z-index:2;display:flex;gap:12px;align-items:center}.grid{padding:12px;display:grid;grid-template-columns:repeat(2,minmax(280px,1fr));gap:10px}.card{background:#fff;border:1px solid #cbd2d9;border-radius:7px;padding:10px;min-width:0}.card h3{margin:0 0 4px;font-size:15px}.meta{display:none}.source{height:28px;overflow:auto;margin:4px 0 6px;padding:4px;background:#f6f8fa;border:1px solid #e2e7eb;font-size:10px}.images{display:grid;grid-template-columns:1fr 1fr;gap:7px}.images figure{margin:0;min-width:0}.images figcaption{font-size:11px;color:#555}.images img{display:block;max-width:100%;max-height:155px;object-fit:contain;background:white;border:1px solid #e1e4e8}.soltxt{height:24px;overflow:auto;color:#334155;font-size:10px;margin-top:4px}.controls button{padding:4px 10px}.counts{font-variant-numeric:tabular-nums}
</style>
<div class="top"><strong>Baseline solutionImage review</strong><span id="page"></span><span class="counts" id="count"></span><span class="controls"><button id="prev">Previous</button> <button id="next">Next</button></span><label>Exam <select id="exam"></select></label></div><main id="grid" class="grid"></main>
<script>
const esc=s=>String(s??"").replace(/[&<>\"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));
let rows=[],filtered=[],page=0;const per=4;
function draw(){const n=Math.max(1,Math.ceil(filtered.length/per));page=Math.max(0,Math.min(page,n-1));document.querySelector("#page").textContent="page "+(page+1)+"/"+n;document.querySelector("#count").textContent=filtered.length+" linked SVGs";const host=document.querySelector("#grid");host.innerHTML="";for(const q of filtered.slice(page*per,(page+1)*per)){const f=q.sourcePath.split("/").pop().replace(/\.js$/,"");const card=document.createElement("article");card.className="card";const solution=String(q.solution||"");card.innerHTML="<h3>"+esc(f)+" #"+esc(q.qid)+" · "+esc(q.unitKey)+"</h3><div class=\"meta\">source SHA: "+esc(q.sourceSha256)+" · solution SHA: "+esc(q.solutionSha256)+"<br>"+esc(q.solutionImagePath||"")+"</div><div class=\"source\">"+esc(q.content)+"</div><div class=\"images\"><figure><figcaption>problem image</figcaption>"+(q.problemImagePath?"<img loading=\"lazy\" src=\"/"+esc(q.problemImagePath)+"\">":"<div class=\"meta\">none</div>")+"</figure><figure><figcaption>solution SVG</figcaption><img loading=\"lazy\" src=\"/"+esc(q.solutionImagePath)+"\"></figure></div><div class=\"soltxt\">"+esc(solution)+"</div>";host.appendChild(card)}document.querySelector("#prev").disabled=page===0;document.querySelector("#next").disabled=(page+1)>=n}
document.querySelector("#prev").onclick=()=>{page--;draw()};document.querySelector("#next").onclick=()=>{page++;draw()};document.querySelector("#exam").onchange=e=>{filtered=e.target.value==="ALL"?rows:rows.filter(q=>q.sourcePath===e.target.value);page=0;draw()};fetch("/archive/evidence/visual-upgrade-2025-m3-independent-b/inventory.json").then(r=>r.json()).then(data=>{rows=data.exams.flatMap(e=>e.questions.filter(q=>q.solutionImagePath).map(q=>Object.assign({},q,{sourcePath:e.sourcePath,sourceSha256:e.sourceSha256})));const s=document.querySelector("#exam");s.innerHTML="<option value=\"ALL\">All exams</option>"+data.exams.map(e=>"<option value=\""+esc(e.sourcePath)+"\">"+esc(e.sourcePath.split("/").pop())+"</option>").join("");filtered=rows;draw()});
</script>
