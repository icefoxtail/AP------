<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>M3 Visual Batch 2 Review</title>
<style>
*{box-sizing:border-box}body{font:15px system-ui,"Malgun Gothic",sans-serif;margin:0;background:#eef1f4;color:#17202a}.top{position:sticky;top:0;background:#fff;padding:10px 14px;border-bottom:1px solid #ccd3da;z-index:2;display:flex;gap:12px;align-items:center}.grid{padding:12px;display:grid;grid-template-columns:repeat(2,minmax(360px,1fr));gap:10px}.card{background:#fff;border:1px solid #cbd2d9;border-radius:7px;padding:10px;min-width:0}.card h3{margin:0 0 5px;font-size:15px}.source,.soltxt{overflow:auto;margin:4px 0 6px;padding:5px;background:#f6f8fa;border:1px solid #e2e7eb;font-size:12px;max-height:65px}.images{display:grid;grid-template-columns:1fr 1fr;gap:7px;min-height:140px}.images figure{margin:0;min-width:0}.images figcaption{font-size:11px;color:#555}.images img{display:block;max-width:100%;max-height:170px;object-fit:contain;background:white;border:1px solid #e1e4e8}.missing{color:#777;border:1px dashed #cbd2d9;min-height:80px;display:grid;place-items:center;font-size:11px}.meta{font-size:11px;color:#566;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.controls button{padding:4px 10px}.counts{font-variant-numeric:tabular-nums}
</style>
<div class="top"><strong>2025 M3 SVG batch 2: source / solution visual review</strong><span id="page"></span><span class="counts" id="count"></span><span class="controls"><button id="prev">Previous</button> <button id="next">Next</button></span><label>Exam <select id="exam"></select></label></div>
<main id="grid" class="grid"></main>
<script>
const esc=s=>String(s??"").replace(/[&<>\"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));
let rows=[],filtered=[],page=0;const per=4;
function img(path,label){return path?`<img loading="lazy" src="/${esc(path)}" alt="${esc(label)}">`:`<div class="missing">없음</div>`}
function draw(){const n=Math.max(1,Math.ceil(filtered.length/per));page=Math.max(0,Math.min(page,n-1));document.querySelector("#page").textContent="page "+(page+1)+"/"+n;document.querySelector("#count").textContent=filtered.length+" questions / "+filtered.filter(q=>q.solutionImagePath).length+" solution SVGs";const host=document.querySelector("#grid");host.innerHTML="";for(const q of filtered.slice(page*per,(page+1)*per)){const f=q.sourcePath.split("/").pop().replace(/\.js$/ ,"");const card=document.createElement("article");card.className="card";card.innerHTML=`<h3>${esc(f)} · q${esc(q.qid)} <span class="meta">${esc((q.tags||[]).join(" · "))}</span></h3><div class="source">${esc(q.content)}</div><div class="images"><figure><figcaption>문제 원본 그림</figcaption>${img(q.problemImagePath,"q"+q.qid+" source")}</figure><figure><figcaption>해설 SVG${q.solutionImagePath?" · "+esc(q.solutionImagePath.split("/").pop()):""}</figcaption>${img(q.solutionImagePath,"q"+q.qid+" solution")}</figure></div><div class="soltxt">${esc(q.solution)}</div>`;host.appendChild(card)}document.querySelector("#prev").disabled=page===0;document.querySelector("#next").disabled=(page+1)>=n}
document.querySelector("#prev").onclick=()=>{page--;draw()};document.querySelector("#next").onclick=()=>{page++;draw()};document.querySelector("#exam").onchange=e=>{filtered=e.target.value==="ALL"?rows:rows.filter(q=>q.sourcePath===e.target.value);page=0;draw()};fetch("/archive/evidence/visual-upgrade-2025-m3-batch2/inventory.json").then(r=>r.json()).then(data=>{rows=data.exams.flatMap(e=>e.questions.map(q=>Object.assign({},q,{sourcePath:e.sourcePath,sourceSha256:e.sourceSha256})));const s=document.querySelector("#exam");s.innerHTML="<option value=\"ALL\">ALL</option>"+data.exams.map(e=>"<option value=\""+esc(e.sourcePath)+"\">"+esc(e.sourcePath.split("/").pop())+"</option>").join("");filtered=rows;draw()});
</script>
