<svg xmlns="http://www.w3.org/2000/svg" width="760" height="380" viewBox="0 0 760 380" role="img"><title>16번 해설: P를 통과하는 경로의 마지막 유효 이동</title><desc>4칸 오른쪽과 2칸 위쪽의 격자. P=(3,2), B=(4,2). P에서 B로 향하는 마지막 오른쪽 이동만 강조한다.</desc><rect width="760" height="380" fill="white"/><text x="36" y="40" font-family="NanumSquare" font-size="22" fill="#152b43">P를 지나면 마지막 유효 이동은 P → B</text><g stroke="#8b9aa8" stroke-width="2"><line x1="90" y1="95" x2="90" y2="295"/><line x1="195" y1="95" x2="195" y2="295"/><line x1="300" y1="95" x2="300" y2="295"/><line x1="405" y1="95" x2="405" y2="295"/><line x1="510" y1="95" x2="510" y2="295"/><line x1="90" y1="95" x2="510" y2="95"/><line x1="90" y1="195" x2="510" y2="195"/><line x1="90" y1="295" x2="510" y2="295"/></g><line x1="405" y1="95" x2="510" y2="95" stroke="#d34324" stroke-width="8"/><polygon points="501,83 519,95 501,107" fill="#d34324"/><g fill="#143657"><circle cx="90" cy="295" r="7"/><circle cx="405" cy="95" r="8"/><circle cx="510" cy="95" r="8"/></g><g font-family="NanumSquare" font-size="21" fill="#152b43"><text x="65" y="326">A</text><text x="385" y="79">P</text><text x="505" y="79">B</text><text x="90" y="352" font-size="17">짝수 → 오른쪽 한 칸 / 홀수 → 위쪽 한 칸</text></g><text x="535" y="120" font-family="NanumSquare" font-size="18" fill="#b42e18">마지막 한 칸</text></svg>