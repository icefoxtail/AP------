<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470" role="img" aria-label="A에서 B로 옮긴 공의 색에 따라 B에서 흰 공이 나올 확률을 두 갈래로 분류한 가지도식">
<rect width="900" height="470" fill="#ffffff"/>
<text x="35" y="43" font-family="Noto Sans CJK KR, sans-serif" font-size="24" font-weight="700">조건부확률: B에서 흰 공이 나왔을 때</text>
<text x="35" y="74" font-family="Noto Sans CJK KR, sans-serif" font-size="16">A에서 뽑은 공을 B로 옮긴다는 학교 해석 기준</text>
<rect x="30" y="116" width="205" height="70" rx="10" fill="#f4f6f8" stroke="#485b69"/>
<text x="50" y="143" font-family="Noto Sans CJK KR, sans-serif" font-size="19">A에서 공 1개</text>
<text x="50" y="171" font-family="Noto Sans CJK KR, sans-serif" font-size="17">흰 2개, 검은 5개</text>
<path d="M235 148 L348 148 L348 122 L428 122" fill="none" stroke="#335d8b" stroke-width="3"/>
<path d="M235 154 L348 154 L348 275 L428 275" fill="none" stroke="#986d37" stroke-width="3"/>
<text x="255" y="116" font-family="Noto Sans CJK KR, sans-serif" font-size="17" fill="#335d8b">흰 공 이동 2/7</text>
<text x="250" y="245" font-family="Noto Sans CJK KR, sans-serif" font-size="17" fill="#986d37">검은 공 이동 5/7</text>
<rect x="428" y="87" width="420" height="84" rx="10" fill="#eef5ff" stroke="#335d8b"/>
<text x="450" y="119" font-family="Noto Sans CJK KR, sans-serif" font-size="19">B: 흰 4개 / 전체 8개 → 흰 공 4/8</text>
<text x="450" y="150" font-family="Noto Sans CJK KR, sans-serif" font-size="19">함께 일어날 확률: (2/7)×(4/8)=8/56</text>
<rect x="428" y="240" width="420" height="84" rx="10" fill="#fff5e9" stroke="#986d37"/>
<text x="450" y="272" font-family="Noto Sans CJK KR, sans-serif" font-size="19">B: 흰 3개 / 전체 8개 → 흰 공 3/8</text>
<text x="450" y="303" font-family="Noto Sans CJK KR, sans-serif" font-size="19">함께 일어날 확률: (5/7)×(3/8)=15/56</text>
<rect x="70" y="370" width="760" height="70" rx="12" fill="#eef8f1" stroke="#38734b" stroke-width="2"/>
<text x="95" y="398" font-family="Noto Sans CJK KR, sans-serif" font-size="20" font-weight="600">B에서 흰 공: 8/56 + 15/56 = 23/56</text>
<text x="95" y="427" font-family="Noto Sans CJK KR, sans-serif" font-size="20" font-weight="600">구하는 확률: (8/56) ÷ (23/56) = 8/23 → a+b=31</text>
</svg>