<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" width="680" height="400" role="img" aria-label="집합 (1, -4) 의 각 원소에서 f와 g가 같고 매개변수 a,b는 (-4, 3) 이며 결과 -48"><title>Q32  |  유한 정의역의 함수 일치</title><desc>집합 (1, -4) 의 각 원소에서 f와 g가 같고 매개변수 a,b는 (-4, 3) 이며 결과 -48</desc><rect x="0" y="0" width="680" height="400" rx="10" fill="#fff" stroke="#e2e8f0"/><rect x="18" y="16" width="644" height="44" rx="9" fill="#eaf1fb" stroke="#eaf1fb"/><text x="34" y="44" font-family="NanumSquare, UnDotum, sans-serif" font-size="19" font-weight="700" fill="#192f4a">Q32  |  유한 정의역의 함수 일치</text><rect x="24" y="76" width="632" height="290" rx="12" fill="#f8fafc" stroke="#d9e2ec"/><text x="44" y="112" font-family="NanumSquare, UnDotum, sans-serif" font-size="18" font-weight="700" fill="#2663c9">정의역 X = {1, -4}</text><rect x="42" y="131" width="598" height="148" rx="8" fill="#f9fbfe" stroke="#dce5f1"/><text x="95" y="159" font-family="NanumSquare, UnDotum, sans-serif" font-size="18" font-weight="700" fill="#192f4a" text-anchor="middle">x</text><text x="95" y="205" font-family="NanumSquare, UnDotum, sans-serif" font-size="18" font-weight="700" fill="#192f4a" text-anchor="middle">f(x)</text><text x="95" y="250" font-family="NanumSquare, UnDotum, sans-serif" font-size="18" font-weight="700" fill="#192f4a" text-anchor="middle">g(x)</text><line x1="160" y1="143" x2="160" y2="266" stroke="#cbd5e1" stroke-width="1.5"/><line x1="160" y1="185" x2="620" y2="185" stroke="#cbd5e1" stroke-width="1.5"/><line x1="160" y1="228" x2="620" y2="228" stroke="#cbd5e1" stroke-width="1.5"/><text x="325" y="159" font-family="NanumSquare, UnDotum, sans-serif" font-size="18" font-weight="700" fill="#192f4a" text-anchor="middle">1</text><text x="325" y="205" font-family="NanumSquare, UnDotum, sans-serif" font-size="19" font-weight="700" fill="#078b70" text-anchor="middle">5</text><text x="325" y="250" font-family="NanumSquare, UnDotum, sans-serif" font-size="19" font-weight="700" fill="#078b70" text-anchor="middle">5</text><text x="505" y="159" font-family="NanumSquare, UnDotum, sans-serif" font-size="18" font-weight="700" fill="#192f4a" text-anchor="middle">-4</text><text x="505" y="205" font-family="NanumSquare, UnDotum, sans-serif" font-size="19" font-weight="700" fill="#078b70" text-anchor="middle">20</text><text x="505" y="250" font-family="NanumSquare, UnDotum, sans-serif" font-size="19" font-weight="700" fill="#078b70" text-anchor="middle">20</text><text x="44" y="308" font-family="NanumSquare, UnDotum, sans-serif" font-size="14" font-weight="400" fill="#475569">정의역의 각 원소에서만 f(x)=g(x) 확인</text><text x="44" y="345" font-family="NanumSquare, UnDotum, sans-serif" font-size="18" font-weight="700" fill="#2663c9">a = -4     b = 3     결과 = -48</text></svg>