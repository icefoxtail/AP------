<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" width="680" height="400" role="img" aria-label="절댓값 경계 -7, 왼쪽 기울기 k - 1, 오른쪽 기울기 k + 1, 일대일대응 매개변수 Union(Interval.open(-oo, -1), Interval.open(1, oo))"><title>Q14  |  절댓값 경계의 좌우 기울기</title><desc>절댓값 경계 -7, 왼쪽 기울기 k - 1, 오른쪽 기울기 k + 1, 일대일대응 매개변수 Union(Interval.open(-oo, -1), Interval.open(1, oo))</desc><rect x="0" y="0" width="680" height="400" rx="10" fill="#fff" stroke="#e2e8f0"/><rect x="18" y="16" width="644" height="44" rx="9" fill="#eaf1fb" stroke="#eaf1fb"/><text x="34" y="44" font-family="NanumSquare, UnDotum, sans-serif" font-size="19" font-weight="700" fill="#192f4a">Q14  |  절댓값 경계의 좌우 기울기</text><rect x="24" y="78" width="632" height="160" rx="12" fill="#f8fafc" stroke="#d9e2ec"/><text x="44" y="108" font-family="NanumSquare, UnDotum, sans-serif" font-size="18" font-weight="700" fill="#2663c9">경계 x = -7</text><line x1="60" y1="157" x2="615" y2="157" stroke="#475569" stroke-width="2"/><circle cx="332" cy="157" r="7" fill="#fff" stroke="#2663c9" stroke-width="3"/><line x1="332" y1="136" x2="332" y2="185" stroke="#2663c9" stroke-width="2" stroke-dasharray="4 3"/><text x="185" y="145" font-family="NanumSquare, UnDotum, sans-serif" font-size="14" font-weight="600" fill="#475569" text-anchor="middle">왼쪽 구간</text><text x="485" y="145" font-family="NanumSquare, UnDotum, sans-serif" font-size="14" font-weight="600" fill="#475569" text-anchor="middle">오른쪽 구간</text><text x="185" y="193" font-family="NanumSquare, UnDotum, sans-serif" font-size="21" font-weight="700" fill="#192f4a" text-anchor="middle">기울기 = k - 1</text><text x="485" y="193" font-family="NanumSquare, UnDotum, sans-serif" font-size="21" font-weight="700" fill="#192f4a" text-anchor="middle">기울기 = k + 1</text><text x="44" y="271" font-family="NanumSquare, UnDotum, sans-serif" font-size="15" font-weight="400" fill="#475569">기울기 곱 &gt; 0 : 같은 부호, 0은 제외</text><line x1="70" y1="310" x2="610" y2="310" stroke="#475569" stroke-width="2"/><text x="50" 