<svg xmlns="http://www.w3.org/2000/svg" width="720" height="316" viewBox="0 0 720 316" role="img" aria-label="여집합과 합집합"><rect width="720" height="316" rx="18" fill="#ffffff"/><rect x="12" y="12" width="696" height="292" rx="14" fill="#f7fafc" stroke="#d9e3ec"/><rect x="12" y="12" width="696" height="54" rx="14" fill="#e8f1f9"/><text x="32" y="45" font-family="NanumSquare,Noto Sans CJK KR,sans-serif" font-size="19" font-weight="700" text-anchor="start" fill="#25364a">Q04  여집합과 합집합</text><rect x="48" y="91" width="624" height="151" rx="13" fill="#fff" stroke="#a5b6c7"/><circle cx="298" cy="166" r="85" fill="#8ac6e3" fill-opacity=".45" stroke="#247aa2" stroke-width="2.3"/><circle cx="422" cy="166" r="85" fill="#f4b884" fill-opacity=".43" stroke="#bc7936" stroke-width="2.3"/><text x="240" y="104" font-family="NanumSquare,Noto Sans CJK KR,sans-serif" font-size="16" font-weight="700" text-anchor="middle" fill="#25364a">A</text><text x="478" y="104" font-family="NanumSquare,Noto Sans CJK KR,sans-serif" font-size="16" font-weight="700" text-anchor="middle" fill="#25364a">B</text><text x="253" y="171" font-family="NanumSquare,Noto Sans CJK KR,sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#25364a">2</text><text x="360" y="171" font-family="NanumSquare,Noto Sans CJK KR,sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#25364a">3, 5, 7</text><text x="468" y="171" font-family="NanumSquare,Noto Sans CJK KR,sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#25364a">1</text><text x="253" y="223" font-family="NanumSquare,Noto Sans CJK KR,sans-serif" font-size="11" font-weight="400" text-anchor="middle" fill="#25364a">A - B</text><text x="360" y="223" font-family="NanumSquare,Noto Sans CJK KR,sans-serif" font-size="11" font-weight="400" text-anchor="middle" fill="#25364a">A ∩ B</text><text x="468" y="223" font-family="NanumSquare,Noto Sans CJK KR,sans-serif" font-size="11" font-weight="400" text-anchor="middle" fill="#25364a">B - A</text><text x="70" y="113" font-family="NanumSquare,Noto Sans CJK KR,sans-serif" font-size="16" font-weight="700" text-anchor="start" fill="#25364a">U</text><text x="615" y="220" font-family="NanumSquare,Noto Sans CJK KR,sans-serif" font-size="13" font-weight="400" text-anchor="end" fill="#25364a">밖: 4, 6, 8</text><rect x="30" y="264" width="660" height="34" rx="8" fill="#edf3f7"/><text x="44" y="287" font-family="NanumSquare,Noto Sans CJK KR,sans-serif" font-size="16" font-weight="700" text-anchor="start" fill="#25364a">A^c ∪ B = U - (A - B)  →  8 - 1 = 7</text><text x="690" y="253" font-family="NanumSquare,Noto Sans CJK KR,sans-serif" font-size="10" font-weight="400" text-anchor="end" fill="#738499">개념 구조도 · 면적은 원소 수에 비례하지 않음</text></svg>