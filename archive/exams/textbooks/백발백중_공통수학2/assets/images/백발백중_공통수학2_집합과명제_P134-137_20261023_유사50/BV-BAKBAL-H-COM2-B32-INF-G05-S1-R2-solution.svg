<svg xmlns="http://www.w3.org/2000/svg" width="720" height="316" viewBox="0 0 720 316" role="img" aria-label="A − B를 빼면 구하는 영역"><rect width="720" height="316" rx="18" fill="#ffffff"/><rect x="12" y="12" width="696" height="292" rx="14" fill="#f7fafc" stroke="#d9e3ec"/><rect x="12" y="12" width="696" height="54" rx="14" fill="#e8f1f9"/><text x="32" y="45" font-family="NanumSquare,Noto Sans CJK KR,sans-serif" font-size="19" font-weight="700" text-anchor="start" fill="#25364a">Q17  A - B를 빼면 구하는 영역</text><rect x="43.0" y="105" width="313.0" height="121" rx="12" fill="#dbeef7" stroke="#b5c6d4"/><text x="200.0" y="132" font-family="NanumSquare,Noto Sans CJK KR,sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#25364a">A - B (제외)</text><text x="200.0" y="168" font-family="NanumSquare,Noto Sans CJK KR,sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#25364a">1, 5</text><rect x="363.0" y="105" width="313.0" height="121" rx="12" fill="#f9e4cc" stroke="#b5c6d4"/><text x="520.0" y="132" font-family="NanumSquare,Noto Sans CJK KR,sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#25364a">나머지 원소 수</text><text x="520.0" y="168" font-family="NanumSquare,Noto Sans CJK KR,sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#25364a">20 - 2 = 18</text><rect x="30" y="264" width="660" height="34" rx="8" fill="#edf3f7"/><text x="44" y="287" font-family="NanumSquare,Noto Sans CJK KR,sans-serif" font-size="16" font-weight="700" text-anchor="start" fill="#25364a">n(A^c ∪ B) = n(U) - n(A - B) = 18</text><text x="690" y="253" font-family="NanumSquare,Noto Sans CJK KR,sans-serif" font-size="10" font-weight="400" text-anchor="end" fill="#738499">원소 분류 · 각 영역은 서로소</text></svg>