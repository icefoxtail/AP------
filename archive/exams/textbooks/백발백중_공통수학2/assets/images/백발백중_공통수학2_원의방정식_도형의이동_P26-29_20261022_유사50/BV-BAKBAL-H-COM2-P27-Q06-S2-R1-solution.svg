<svg xmlns="http://www.w3.org/2000/svg" width="440" height="300" viewBox="0 0 440 300" role="img" aria-label="접선과 할선의 관계"><title>접선과 할선의 관계</title><desc>원 밖의 점 P에서 접선 PT와 할선 PAB. PA=3, AB=9, PB=12. PT=6.0. 접선이 실제로 원에 접하도록 그린 도형.</desc><rect width="440" height="300" rx="14" fill="#ffffff"/><circle cx="201.67" cy="178" r="82" stroke="#24364b" fill="none" stroke-width="2"/><line x1="65" y1="178" x2="283.67" y2="178" stroke="#475569" stroke-width="2"/><line x1="65" y1="178" x2="152.47" y2="112.4" stroke="#2563eb" stroke-width="3.4"/><line x1="201.67" y1="178" x2="152.47" y2="112.4" stroke="#64748b" stroke-width="1.6" stroke-dasharray="4,4"/><circle cx="65" cy="178" r="3.8" stroke="#1e293b" fill="#1e293b" stroke-width="1"/><circle cx="119.67" cy="178" r="3.8" stroke="#1e293b" fill="#1e293b" stroke-width="1"/><circle cx="283.67" cy="178" r="3.8" stroke="#1e293b" fill="#1e293b" stroke-width="1"/><circle cx="201.67" cy="178" r="3.8" stroke="#64748b" fill="#64748b" stroke-width="1"/><circle cx="152.47" cy="112.4" r="3.8" stroke="#1d4ed8" fill="#1d4ed8" stroke-width="1"/><text x="65" y="200" fill="#263547" font-size="14" text-anchor="middle" font-family="Noto Sans, Arial, sans-serif">P</text><text x="119.67" y="200" fill="#263547" font-size="14" text-anchor="middle" font-family="Noto Sans, Arial, sans-serif">A</text><text x="283.67" y="200" fill="#263547" font-size="14" text-anchor="middle" font-family="Noto Sans, Arial, sans-serif">B</text><text x="201.67" y="200" fill="#263547" font-size="14" text-anchor="middle" font-family="Noto Sans, Arial, sans-serif">O</text><text x="160.47" y="99.4" fill="#263547" font-size="14" text-anchor="middle" font-family="Noto Sans, Arial, sans-serif">T</text><text x="92.33" y="168" fill="#263547" font-size="12" text-anchor="middle" font-family="Noto Sans, Arial, sans-serif">PA=3</text><text x="201.67" y="168" fill="#263547" font-size="12" text-anchor="middle" font-family="Noto Sans, Arial, sans-serif">AB=9</text><text x="220" y="283" fill="#1d4ed8" font-size="15" text-anchor="middle" font-family="Noto Sans, Arial, sans-serif">PT² = PA × PB = 3 × 12</text></svg>