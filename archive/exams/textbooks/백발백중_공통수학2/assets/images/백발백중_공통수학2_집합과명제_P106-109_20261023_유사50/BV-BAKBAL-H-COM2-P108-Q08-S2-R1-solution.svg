<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 327" width="620" height="327" role="img" aria-label="문항 24 필수 원소와 선택 원소 분리 해설 시각화"><rect width="620" height="327" rx="18" fill="white"/><rect x="10" y="10" width="600" height="307" rx="12" fill="#F4F7FB" stroke="#D9E2EF"/><text x="30" y="42" text-anchor="start" font-size="20" fill="#243858" font-weight="700" font-family="Noto Sans CJK KR,Arial,sans-serif">Q24 · 필수 원소와 선택 원소 분리</text><rect x="35" y="78" width="550" height="69" rx="12" fill="#E4F3F0" stroke="#BBE0D8"/><text x="310" y="103" text-anchor="middle" font-size="15" fill="#0E9887" font-weight="500" font-family="Noto Sans CJK KR,Arial,sans-serif">반드시 포함</text><text x="310" y="132" text-anchor="middle" font-size="20" fill="#243858" font-weight="500" font-family="Noto Sans CJK KR,Arial,sans-serif">{2, 4, 6}</text><rect x="35" y="163" width="550" height="69" rx="12" fill="#FFF0E7" stroke="#F3D2BF"/><text x="310" y="188" text-anchor="middle" font-size="15" fill="#D97738" font-weight="500" font-family="Noto Sans CJK KR,Arial,sans-serif">선택 가능</text><text x="310" y="218" text-anchor="middle" font-size="20" fill="#243858" font-weight="500" font-family="Noto Sans CJK KR,Arial,sans-serif">{1, 3, 5, 7}</text><text x="310" y="268" text-anchor="middle" font-size="22" fill="#243858" font-weight="700" font-family="Noto Sans CJK KR,Arial,sans-serif">2^4 − 1 = 15개</text><text x="310" y="299" text-anchor="middle" font-size="15" fill="#67748B" font-weight="500" font-family="Noto Sans CJK KR,Arial,sans-serif">각 선택 원소는 포함 / 제외의 2가지</text></svg>