<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400" role="img" aria-label="정삼각형 높이와 무게중심"><title>Q09 좌표기하 해설도</title><desc>정삼각형 높이와 무게중심</desc><rect width="680" height="400" rx="12" fill="white"/><rect x="15" y="12" width="650" height="42" rx="9" fill="#eaf1fb"/><text x="32" y="40" font-family="NanumSquare,UnDotum,sans-serif" font-size="18" font-weight="700" fill="#1b3049">Q09  |  정삼각형 높이와 무게중심</text><rect x="26" y="72" width="425" height="278" rx="9" fill="#f8fafc" stroke="#dce4ef"/><polygon points="293.33,118.39 156.87,208.48 303.13,281.61" fill="none" stroke="#2365c4" stroke-width="2.6"/><line x1="293.33" y1="118.39" x2="230.00" y2="245.05" stroke="#12876b" stroke-width="2.4"/><circle cx="293.33" cy="118.39" r="4" fill="white" stroke="#2365c4" stroke-width="2.4"/><text x="301.3306487894089" y="111.3873676473317" font-family="NanumSquare,UnDotum,sans-serif" font-size="15" font-weight="700" fill="#2365c4">A</text><circle cx="156.87" cy="208.48" r="4" fill="white" stroke="#2365c4" stroke-width="2.4"/><text x="164.87206574696228" y="201.48469809963058" font-family="NanumSquare,UnDotum,sans-serif" font-size="15" font-weight="700" fill="#2365c4">B</text><circle cx="303.13" cy="281.61" r="4" fill="white" stroke="#2365c4" stroke-width="2.4"/><text x="311.1279342530377" y="274.6126323526683" font-family="NanumSquare,UnDotum,sans-serif" font-size="15" font-weight="700" fill="#2365c4">C</text><circle cx="251.11" cy="202.83" r="4" fill="white" stroke="#c34f38" stroke-width="2.4"/><text x="259.1102162631363" y="195.82823269987688" font-family="NanumSquare,UnDotum,sans-serif" font-size="15" font-weight="700" fill="#c34f38">O</text><circle cx="230.00" cy="245.05" r="4" fill="white" stroke="#12876b" stroke-width="2.4"/><text x="238.0" y="238.04866522614944" font-family="NanumSquare,UnDotum,sans-serif" font-size="15" font-weight="700" fill="#12876b">M</text><text x="470" y="111" font-family="NanumSquare,UnDotum,sans-serif" font-size="15" font-weight="500" fill="#1b3049">O = (0, 0)</text><text x="470" y="155" font-family="NanumSquare,UnDotum,sans-serif" font-size="15" font-weight="700" fill="#12876b">M = -A/2</text><text x="470" y="198" font-family="NanumSquare,UnDotum,sans-serif" font-size="15" font-weight="500" fill="#1b3049">AO : OM = 2 : 1</text><text x="470" y="243" font-family="NanumSquare,UnDotum,sans-serif" font-size="15" font-weight="500" fill="#12876b">AM = (3/2) AO</text><text x="470" y="291" font-family="NanumSquare,UnDotum,sans-serif" font-size="14" font-weight="500" fill="#1b3049">AO = 2*sqrt(5)</text><text x="470" y="335" font-family="NanumSquare,UnDotum,sans-serif" font-size="18" font-weight="700" fill="#c34f38">a = 2</text></svg>