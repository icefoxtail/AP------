<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400" role="img" aria-label="정삼각형 높이와 무게중심"><title>Q07 좌표기하 해설도</title><desc>정삼각형 높이와 무게중심</desc><rect width="680" height="400" rx="12" fill="white"/><rect x="15" y="12" width="650" height="42" rx="9" fill="#eaf1fb"/><text x="32" y="40" font-family="NanumSquare,UnDotum,sans-serif" font-size="18" font-weight="700" fill="#1b3049">Q07  |  정삼각형 높이와 무게중심</text><rect x="26" y="72" width="425" height="278" rx="9" fill="#f8fafc" stroke="#dce4ef"/><polygon points="317.96,268.26 220.85,121.18 142.04,278.82" fill="none" stroke="#2365c4" stroke-width="2.6"/><line x1="317.96" y1="268.26" x2="181.45" y2="200.00" stroke="#12876b" stroke-width="2.4"/><circle cx="317.96" cy="268.26" r="4" fill="white" stroke="#2365c4" stroke-width="2.4"/><text x="325.9645713424936" y="261.2596947679537" font-family="NanumSquare,UnDotum,sans-serif" font-size="15" font-weight="700" fill="#2365c4">A</text><circle cx="220.85" cy="121.18" r="4" fill="white" stroke="#2365c4" stroke-width="2.4"/><text x="228.85493495566595" y="114.18049370184045" font-family="NanumSquare,UnDotum,sans-serif" font-size="15" font-weight="700" fill="#2365c4">B</text><circle cx="142.04" cy="278.82" r="4" fill="white" stroke="#2365c4" stroke-width="2.4"/><text x="150.03542865750637" y="271.8195062981596" font-family="NanumSquare,UnDotum,sans-serif" font-size="15" font-weight="700" fill="#2365c4">C</text><circle cx="226.95" cy="222.75" r="4" fill="white" stroke="#c34f38" stroke-width="2.4"/><text x="234.95164498522198" y="215.7532315893179" font-family="NanumSquare,UnDotum,sans-serif" font-size="15" font-weight="700" fill="#c34f38">O</text><circle cx="181.45" cy="200.00" r="4" fill="white" stroke="#12876b" stroke-width="2.4"/><text x="189.44518180658616" y="193.0" font-family="NanumSquare,UnDotum,sans-serif" font-size="15" font-weight="700" fill="#12876b">M</text><text x="470" y="111" font-family="NanumSquare,UnDotum,sans-serif" font-size="15" font-weight="500" fill="#1b3049">O = (0, 0)</text><text x="470" y="155" font-family="NanumSquare,UnDotum,sans-serif" font-size="15" font-weight="700" fill="#12876b">M = -A/2</text><text x="470" y="198" font-family="NanumSquare,UnDotum,sans-serif" font-size="15" font-weight="500" fill="#1b3049">AO : OM = 2 : 1</text><text x="470" y="243" font-family="NanumSquare,UnDotum,sans-serif" font-size="15" font-weight="500" fill="#12876b">AM = (3/2) AO</text><text x="470" y="291" font-family="NanumSquare,UnDotum,sans-serif" font-size="14" font-weight="500" fill="#1b3049">AO = 2*sqrt(5)</text><text x="470" y="335" font-family="NanumSquare,UnDotum,sans-serif" font-size="18" font-weight="700" fill="#c34f38">AM = 3*sqrt(5)</text></svg>