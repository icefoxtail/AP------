<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400" role="img" aria-label="기울기와 직선 위 점 판별"><title>Q10 좌표기하 해설도</title><desc>기울기와 직선 위 점 판별</desc><rect width="680" height="400" rx="12" fill="white"/><rect x="15" y="12" width="650" height="42" rx="9" fill="#eaf1fb"/><text x="32" y="40" font-family="NanumSquare,UnDotum,sans-serif" font-size="18" font-weight="700" fill="#1b3049">Q10  |  기울기와 직선 위 점 판별</text><rect x="26" y="72" width="425" height="278" rx="9" fill="#f8fafc" stroke="#dce4ef"/><line x1="182.73" y1="105.46" x2="277.27" y2="294.54" stroke="#2365c4" stroke-width="2.5"/><line x1="236.75" y1="200.00" x2="236.75" y2="213.51" stroke="#c34f38" stroke-width="1.7" stroke-dasharray="5 3"/><circle cx="223.25" cy="186.49" r="4" fill="white" stroke="#2365c4" stroke-width="2.4"/><text x="232.2471264367816" y="176.4942528735632" font-family="NanumSquare,UnDotum,sans-serif" font-size="13" font-weight="700" fill="#2365c4">A(2,5)</text><circle cx="236.75" cy="200.00" r="4" fill="white" stroke="#c34f38" stroke-width="2.4"/><text x="245.7528735632184" y="190.0" font-family="NanumSquare,UnDotum,sans-serif" font-size="13" font-weight="700" fill="#c34f38">보기 (3,4)</text><circle cx="236.75" cy="213.51" r="4" fill="white" stroke="#12876b" stroke-width="2.4"/><text x="245.7528735632184" y="203.50574712643677" font-family="NanumSquare,UnDotum,sans-serif" font-size="13" font-weight="700" fill="#12876b">실제 (3,3)</text><text x="470" y="114" font-family="NanumSquare,UnDotum,sans-serif" font-size="17" font-weight="700" fill="#2365c4">기울기 = -2</text><text x="470" y="164" font-family="NanumSquare,UnDotum,sans-serif" font-size="14" font-weight="500" fill="#1b3049">y - 5 = -2(x - 2)</text><text x="470" y="211" font-family="NanumSquare,UnDotum,sans-serif" font-size="18" font-weight="700" fill="#12876b">y = -2x + 9</text><text x="470" y="267" font-family="NanumSquare,UnDotum,sans-serif" font-size="15" font-weight="500" fill="#1b3049">x=3 이면 y=3</text><text x="470" y="318" font-family="NanumSquare,UnDotum,sans-serif" font-size="16" font-weight="700" fill="#c34f38">(3,4)는 직선 밖</text></svg>