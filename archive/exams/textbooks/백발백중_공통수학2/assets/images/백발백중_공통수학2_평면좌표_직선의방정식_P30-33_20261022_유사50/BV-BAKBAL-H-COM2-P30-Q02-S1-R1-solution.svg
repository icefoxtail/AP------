,sans-serif" font-size="14" font-weight="500" fill="#1b3049">M = (3.0, 4.0)</text><text x="466" y="150" font-family="NanumSquare,UnDotum,sans-serif" font-size="17" font-weight="700" fill="#12876b">PM = 3</text><text x="466" y="195" font-family="NanumSquare,UnDotum,sans-serif" font-size="16" font-weight="500" fill="#1b3049">AB² = 100</text><text x="466" y="239" font-family="NanumSquare,UnDotum,sans-serif" font-size="17" font-weight="700" fill="#1b3049">AP² + BP²</text><text x="466" y="274" font-family="NanumSquare,UnDotum,sans-serif" font-size="13" font-weight="500" fill="#1b3049">= 2 PM² + AB²/2</text><text x="466" y="312" font-family="NanumSquare,UnDotum,sans-serif" font-size="22" font-weight="700" fill="#c34f38">= 68</text></svg>