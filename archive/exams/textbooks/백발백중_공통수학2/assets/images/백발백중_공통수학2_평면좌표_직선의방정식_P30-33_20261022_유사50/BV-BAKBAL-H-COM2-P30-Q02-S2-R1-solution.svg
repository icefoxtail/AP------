<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400" role="img" aria-label="중점과 거리 제곱 항등식"><title>Q06 좌표기하 해설도</title><desc>중점과 거리 제곱 항등식</desc><rect width="680" height="400" rx="12" fill="white"/><rect x="15" y="12" width="650" height="42" rx="9" fill="#eaf1fb"/><text x="32" y="40" font-family="NanumSquare,UnDotum,sans-serif" font-size="18" font-weight="700" fill="#1b3049">Q06  |  중점과 거리 제곱 항등식</text><rect x="26" y="72" width="425" height="278" rx="9" fill="#f8fafc" stroke="#dce4ef"/><line x1="110.63" y1="246.73" x2="342.26" y2="246.73" stroke="#2365c4" stroke-width="2.7"/><line x1="110.63" y1="246.73" x2="349.37" y2="153.27" stroke="#6b7280" stroke-width="1.6"/><line x1="342.26" y1="246.73" x2="349.37" y2="153.27" stroke="#6b7280" stroke-width="1.6"/><line x1="226.44" y1="246.73" x2="349.37" y2="153.27" stroke="#12876b" stroke-width="2.3"/><circle cx="226.4419012654157" cy="246.72603067094906" r="154.41863937482185" stroke="#12876b" stroke-dasharray="5 4" stroke-width="1.2" fill="none"/><circle cx="110.63" cy="246.73" r="4" fill="white" stroke="#2365c4" stroke-width="2.4"/><text x="118.62792173429932" y="237.72603067094906" font-family="NanumSquare,UnDotum,sans-serif" font-size="15" font-weight="700" fill="#2365c4">A</text><circle cx="342.26" cy="246.73" r="4" fill="white" stroke="#2365c4" stroke-width="2.4"/><text x="350.2558807965321" y="237.72603067094906" font-family="NanumSquare,UnDotum,sans-serif" font-size="15" font-weight="700" fill="#2365c4">B</text><circle cx="226.44" cy="246.73" r="4" fill="white" stroke="#c34f38" stroke-width="2.4"/><text x="234.4419012654157" y="237.72603067094906" font-family="NanumSquare,UnDotum,sans-serif" font-size="15" font-weight="700" fill="#c34f38">M</text><circle cx="349.37" cy="153.27" r="4" fill="white" stroke="#12876b" stroke-width="2.4"/><text x="357.3720782657007" y="144.27396932905094" font-family="NanumSquare,UnDotum,sans-serif" font-size="15" font-weight="700" fill="#12876b">P</text><text x="466" y="106" font-family="NanumSquare,UnDotum,sans-serif" font-size="14" font-weight="500" fill="#1b3049">M = (0.0, 1.0)</text><text x="466" y="150" font-family="NanumSquare,UnDotum,sans-serif" font-size="17" font-weight="700" fill="#12876b">PM = 4</text><text x="466" y="195" font-family="NanumSquare,UnDotum,sans-serif" font-size="16" font-weight="500" fill="#1b3049">AB² = 36</text><text x="466" y="239" font-family="NanumSquare,UnDotum,sans-serif" font-size="17" font-weight="700" fill="#1b3049">AP² + BP²</text><text x="466" y="274" font-family="NanumSquare,UnDotum,sans-serif" font-size="13" font-weight="500" fill="#1b3049">= 2 PM² + AB²/2</text><text x="466" y="312" font-family="NanumSquare,UnDotum,sans-serif" font-size="22" font-weight="700" fill="#c34f38">= 50</text></svg>