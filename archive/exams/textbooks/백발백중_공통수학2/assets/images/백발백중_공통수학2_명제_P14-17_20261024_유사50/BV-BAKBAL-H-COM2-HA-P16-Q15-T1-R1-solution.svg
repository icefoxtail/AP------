<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" role="img" aria-label="Q39 대우 증명 — 나머지 확인 해설 도식"><rect x="1" y="1" width="718" height="298" rx="14" fill="#f8fafc" stroke="#d7e2ef" stroke-width="1.5"/><rect x="14" y="14" width="692" height="52" rx="12" fill="#e7effa" stroke="none" stroke-width="0"/><text x="32" y="48" font-family="NanumSquare, Noto Sans CJK KR, DejaVu Sans, sans-serif" font-size="21" font-weight="700" fill="#1e3a5f" text-anchor="start">Q39  대우 증명 — 나머지 확인</text><text x="40" y="100" font-family="NanumSquare, Noto Sans CJK KR, DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#475569" text-anchor="start">나머지별로 제곱의 나머지를 직접 확인 (mod 3)</text><rect x="50.0" y="128" width="194.7" height="113" rx="10" fill="#e7f2ff" stroke="#cbd5e1" stroke-width="1.5"/><text x="147.3" y="169" font-family="NanumSquare, Noto Sans CJK KR, DejaVu Sans, sans-serif" font-size="21" font-weight="700" fill="#1e3a5f" text-anchor="middle">n ≡ 0</text><text x="147.3" y="211" font-family="NanumSquare, Noto Sans CJK KR, DejaVu Sans, sans-serif" font-size="20" font-weight="700" fill="#166534" text-anchor="middle">n² ≡ 0</text><rect x="256.7" y="128" width="194.7" height="113" rx="10" fill="#e5f5ed" stroke="#cbd5e1" stroke-width="1.5"/><text x="354.0" y="169" font-family="NanumSquare, Noto Sans CJK KR, DejaVu Sans, sans-serif" font-size="21" font-weight="700" fill="#1e3a5f" text-anchor="middle">n ≡ 1</text><text x="354.0" y="211" font-family="NanumSquare, Noto Sans CJK KR, DejaVu Sans, sans-serif" font-size="20" font-weight="700" fill="#166534" text-anchor="middle">n² ≡ 1</text><rect x="463.3" y="128" width="194.7" height="113" rx="10" fill="#e5f5ed" stroke="#cbd5e1" stroke-width="1.5"/><text x="560.7" y="169" font-family="NanumSquare, Noto Sans CJK KR, DejaVu Sans, sans-serif" font-size="21" font-weight="700" fill="#1e3a5f" text-anchor="middle">n ≡ 2</text><text x="560.7" y="211" font-family="NanumSquare, Noto Sans CJK KR, DejaVu Sans, sans-serif" font-size="20" font-weight="700" fill="#166534" text-anchor="middle">n² ≡ 1</text><text x="36" y="278" font-family="NanumSquare, Noto Sans CJK KR, DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#475569" text-anchor="start">3의 배수가 아닌 n은 제곱해도 3의 배수가 아님</text></svg>