<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 328" width="680" height="328" role="img" aria-label="Q31  나머지로 확인하는 대우"><rect x="1" y="1" width="678" height="326" rx="16" fill="#ffffff" stroke="#cbd8e5"/><rect x="1" y="1" width="678" height="52" rx="16" fill="#edf4fb"/><text x="22" y="36" fill="#1a2b42" font-family="Noto Sans CJK KR,NanumSquare,sans-serif" font-size="19" font-weight="700" text-anchor="start" >Q31  나머지로 확인하는 대우</text><text x="658" y="35" fill="#506278" font-family="Noto Sans CJK KR,NanumSquare,sans-serif" font-size="13" font-weight="500" text-anchor="end" >대우 증명</text><rect x="28.0" y="98" width="306.0" height="140" rx="10" fill="#edf4fb"/><text x="181.0" y="138" fill="#1a2b42" font-family="Noto Sans CJK KR,NanumSquare,sans-serif" font-size="17" font-weight="700" text-anchor="middle" >a, b 홀수</text><text x="181.0" y="192" fill="#1664b6" font-family="Noto Sans CJK KR,NanumSquare,sans-serif" font-size="21" font-weight="700" text-anchor="middle" >a²+b² ≡ 2</text><rect x="346.0" y="98" width="306.0" height="140" rx="10" fill="#e4f6f1"/><text x="499.0" y="138" fill="#1a2b42" font-family="Noto Sans CJK KR,NanumSquare,sans-serif" font-size="17" font-weight="700" text-anchor="middle" >c 홀수</text><text x="499.0" y="192" fill="#c04a4a" font-family="Noto Sans CJK KR,NanumSquare,sans-serif" font-size="21" font-weight="700" text-anchor="middle" >c² ≡ 1</text><text x="30" y="285" fill="#087b65" font-family="Noto Sans CJK KR,NanumSquare,sans-serif" font-size="18" font-weight="700" text-anchor="start" >r1 = 2,  r2 = 1   →   |r1-r2| = 1</text></svg>