<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" width="100%" role="img" aria-label="Q25 | 중복 참가 인원 계산"><rect width="680" height="400" fill="#ffffff"/><text x="28.00" y="32.00" font-size="20" font-family="Noto Sans CJK KR, NanumGothic, sans-serif" fill="#153a59" font-weight="700" text-anchor="시작">Q25 | 중복 참가 인원 계산</text><text x="28.00" y="57.00" font-size="13" font-family="Noto Sans CJK KR, NanumGothic, sans-serif" fill="#64748b" font-weight="400" text-anchor="시작">모든 학생이 적어도 한 활동에 참가</text><rect x="32" y="105" width="615" height="92" rx="12" fill="#f1f5f9" stroke="#cbd5e1"/><text x="47.00" y="133.00" font-size="18" font-family="Noto Sans CJK KR, NanumGothic, sans-serif" fill="#153a59" font-weight="700" text-anchor="시작">1학년  (N=36)</text><text x="47.00" y="165.00" font-size="17" font-family="Noto Sans CJK KR, NanumGothic, sans-serif" fill="#2563eb" font-weight="600" text-anchor="시작">한 가지만 참가 = 18</text><text x="340.00" y="165.00" font-size="17" font-family="Noto Sans CJK KR, NanumGothic, sans-serif" fill="#15803d" font-weight="700" text-anchor="시작">둘 다 참가 = 18</text><rect x="32" y="225" width="615" height="92" rx="12" fill="#f1f5f9" stroke="#cbd5e1"/><text x="47.00" y="253.00" font-size="18" font-family="Noto Sans CJK KR, NanumGothic, sans-serif" fill="#153a59" font-weight="700" text-anchor="시작">2학년  (N=54)</text><text x="47.00" y="285.00" font-size="17" font-family="Noto Sans CJK KR, NanumGothic, sans-serif" fill="#2563eb" font-weight="600" text-anchor="시작">한 가지만 참가 = 36</text><text x="340.00" y="285.00" font-size="17" font-family="Noto Sans CJK KR, NanumGothic, sans-serif" fill="#15803d" font-weight="700" text-anchor="시작">둘 다 참가 = 18</text><text x="40.00" y="353.00" font-size="17" font-family="Noto Sans CJK KR, NanumGothic, sans-serif" fill="#153a59" font-weight="400" text-anchor="시작">중복 포함 합계: 126 = 90 + (18+18)</text><text x="40.00" y="382.00" font-size="18" font-family="Noto Sans CJK KR, NanumGothic, sans-serif" fill="#15803d" font-weight="700" text-anchor="시작">2학년 both = 18</text></svg>