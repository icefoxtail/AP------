<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 260" width="380" height="260" role="img" aria-labelledby="q11.svg-title q11.svg-desc">
  <title id="q11.svg-title">삼각형 ABC의 넓이와 변의 길이</title>
  <desc id="q11.svg-desc">AB의 길이가 6이고 각 A가 60도이며 넓이가 6루트3인 삼각형 ABC</desc>
  <rect width="100%" height="100%" fill="#ffffff"/>
  
  <!-- A=(80, 210), B=(300, 210), C=(147, 95) -->
  <polygon points="80,210 300,210 147,95" fill="none" stroke="#222222" stroke-width="2"/>
  
  <circle cx="80" cy="210" r="3" fill="#222222"/>
  <text x="64" y="216" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222222">A</text>
  
  <circle cx="300" cy="210" r="3" fill="#222222"/>
  <text x="310" y="216" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222222">B</text>
  
  <circle cx="147" cy="95" r="3" fill="#222222"/>
  <text x="145" y="82" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222222">C</text>
  
  <path d="M 108,210 A 28 28 0 0 0 94,186" fill="none" stroke="#222222" stroke-width="1.2"/>
  <text x="110" y="196" font-family="sans-serif" font-size="13" fill="#222222">60°</text>
  
  <text x="185" y="232" font-family="sans-serif" font-size="15" fill="#222222">6</text>
  <text x="160" y="165" font-family="sans-serif" font-size="14" fill="#0066cc">넓이 = 6√3</text>
</svg>
