<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" width="400" height="280" role="img" aria-labelledby="q1.svg-title q1.svg-desc">
  <title id="q1.svg-title">직각삼각형 ABC</title>
  <desc id="q1.svg-desc">각 B가 90도이고 변 AC의 길이가 13, 변 BC의 길이가 5인 직각삼각형 ABC</desc>
  <rect width="100%" height="100%" fill="#ffffff"/>
  
  <polygon points="90,70 90,220 330,220" fill="none" stroke="#222222" stroke-width="2"/>
  <rect x="90" y="205" width="15" height="15" fill="none" stroke="#222222" stroke-width="1.5"/>
  
  <circle cx="90" cy="70" r="3" fill="#222222"/>
  <text x="82" y="58" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222222">A</text>
  
  <circle cx="90" cy="220" r="3" fill="#222222"/>
  <text x="72" y="238" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222222">B</text>
  
  <circle cx="330" cy="220" r="3" fill="#222222"/>
  <text x="340" y="238" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222222">C</text>
  
  <text x="210" y="135" font-family="sans-serif" font-size="15" fill="#222222">13</text>
  <text x="210" y="240" font-family="sans-serif" font-size="15" fill="#222222">5</text>
</svg>
