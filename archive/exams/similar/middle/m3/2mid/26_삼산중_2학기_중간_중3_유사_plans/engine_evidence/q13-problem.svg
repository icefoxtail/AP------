<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 280" width="440" height="280" role="img" aria-labelledby="q13.svg-title q13.svg-desc">
  <title id="q13.svg-title">사각형 ABCD</title>
  <desc id="q13.svg-desc">AB=AD=2루트2, BC=2루트3, CD=3루트2-루트6, 각 A=120도, 각 C=135도인 사각형 ABCD</desc>
  <rect width="100%" height="100%" fill="#ffffff"/>
  
  <!-- A=(200, 190), B=(100, 140), D=(300, 140), C=(200, 70) -->
  <polygon points="200,190 100,140 200,70 300,140" fill="none" stroke="#222222" stroke-width="2"/>
  <line x1="100" y1="140" x2="300" y2="140" stroke="#666666" stroke-width="1.5" stroke-dasharray="4,3"/>
  
  <circle cx="200" cy="190" r="3" fill="#222222"/>
  <text x="195" y="210" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222222">A</text>
  
  <circle cx="100" cy="140" r="3" fill="#222222"/>
  <text x="84" y="145" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222222">B</text>
  
  <circle cx="200" cy="70" r="3" fill="#222222"/>
  <text x="195" y="58" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222222">C</text>
  
  <circle cx="300" cy="140" r="3" fill="#222222"/>
  <text x="310" y="145" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222222">D</text>
  
  <text x="135" y="180" font-family="sans-serif" font-size="13" fill="#222222">2√2</text>
  <text x="245" y="180" font-family="sans-serif" font-size="13" fill="#222222">2√2</text>
  <text x="130" y="95" font-family="sans-serif" font-size="13" fill="#222222">2√3</text>
  <text x="245" y="95" font-family="sans-serif" font-size="13" fill="#222222">3√2−√6</text>
  
  <text x="190" y="175" font-family="sans-serif" font-size="12" fill="#222222">120°</text>
  <text x="190" y="90" font-family="sans-serif" font-size="12" fill="#222222">135°</text>
</svg>
