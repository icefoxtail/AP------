  <text x="74" y="58" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222222">A</text>
  
  <circle cx="80" cy="210" r="3" fill="#222222"/>
  <text x="64" y="226" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222222">C</text>
  
