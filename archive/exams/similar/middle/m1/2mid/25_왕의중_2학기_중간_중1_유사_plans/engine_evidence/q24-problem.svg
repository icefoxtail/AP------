<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="600" height="450" role="img" aria-labelledby="q24-title q24-desc">
  <title id="q24-title">두 정삼각형 ACD와 CBE</title>
  <desc id="q24-desc">한 직선 위의 점 C를 공유하는 두 정삼각형과 선분 DB, AE의 교점 F, G, H</desc>
  <rect width="600" height="450" fill="#ffffff"/>
  <polygon points="80,360 280,360 180,187" fill="#f8fafc" stroke="#111827" stroke-width="2.5"/>
  <polygon points="280,360 520,360 400,152" fill="#f8fafc" stroke="#111827" stroke-width="2.5"/>
  <line x1="80" y1="360" x2="400" y2="152" stroke="#2563eb" stroke-width="2"/>
  <line x1="180" y1="187" x2="520" y2="360" stroke="#dc2626" stroke-width="2"/>
  <circle cx="273" cy="234" r="4.5" fill="#7c3aed"/>
  <circle cx="225" cy="265" r="4.5" fill="#111827"/>
  <circle cx="335" cy="266" r="4.5" fill="#111827"/>
  <text x="65" y="380" font-family="sans-serif" font-size="16" font-weight="bold" fill="#111827">A</text>
  <text x="275" y="385" font-family="sans-serif" font-size="16" font-weight="bold" fill="#111827">C</text>
  <text x="525" y="380" font-family="sans-serif" font-size="16" font-weight="bold" fill="#111827">B</text>
  <text x="175" y="175" font-family="sans-serif" font-size="16" font-weight="bold" fill="#111827">D</text>
  <text x="400" y="140" font-family="sans-serif" font-size="16" font-weight="bold" fill="#111827">E</text>
  <text x="273" y="222" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#7c3aed">F</text>
  <text x="345" y="265" font-family="sans-serif" font-size="15" font-weight="bold" fill="#111827">G</text>
  <text x="205" y="270" font-family="sans-serif" font-size="15" font-weight="bold" fill="#111827">H</text>
</svg>