<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500" role="img" aria-labelledby="q22-title q22-desc">
  <title id="q22-title">정비례와 반비례 그래프의 교점 A</title>
  <desc id="q22-desc">제1사분면에서 반비례 곡선과 정비례 직선이 교점 A에서 만나는 그래프</desc>
  <rect width="500" height="500" fill="#ffffff"/>
  <line x1="60" y1="420" x2="470" y2="420" stroke="#111827" stroke-width="2"/>
  <polyline points="460,415 470,420 460,425" fill="none" stroke="#111827" stroke-width="2"/>
  <line x1="80" y1="440" x2="80" y2="40" stroke="#111827" stroke-width="2"/>
  <polyline points="75,50 80,40 85,50" fill="none" stroke="#111827" stroke-width="2"/>
  <text x="475" y="425" font-family="sans-serif" font-size="16" font-style="italic" fill="#111827">x</text>
  <text x="80" y="30" font-family="sans-serif" font-size="16" font-style="italic" text-anchor="middle" fill="#111827">y</text>
  <text x="65" y="435" font-family="sans-serif" font-size="15" font-style="italic" fill="#111827">O</text>
  <path d="M 155,60 Q 200,210 280,285 T 470,350" fill="none" stroke="#2563eb" stroke-width="2.5"/>
  <text x="430" y="335" font-family="sans-serif" font-size="15" fill="#2563eb">y=b/x</text>
  <line x1="80" y1="420" x2="420" y2="190.5" stroke="#dc2626" stroke-width="2.5"/>
  <text x="390" y="175" font-family="sans-serif" font-size="15" fill="#dc2626">y=ax</text>
  <line x1="180" y1="420" x2="180" y2="150" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="80" y1="150" x2="180" y2="150" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,4"/>
  <circle cx="180" cy="150" r="5" fill="#2563eb"/>
  <text x="176" y="440" font-family="sans-serif" font-size="14" fill="#374151">2</text>
  <text x="55" y="155" font-family="sans-serif" font-size="14" fill="#374151">6</text>
  <line x1="280" y1="420" x2="280" y2="285" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="80" y1="285" x2="280" y2="285" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,4"/>
  <circle cx="280" cy="285" r="5" fill="#111827"/>
  <text x="276" y="440" font-family="sans-serif" font-size="14" fill="#374151">4</text>
  <text x="288" y="278" font-family="sans-serif" font-size="16" font-weight="bold" fill="#111827">A</text>
</svg>