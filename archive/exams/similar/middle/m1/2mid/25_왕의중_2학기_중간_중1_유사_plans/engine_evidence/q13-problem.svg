<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 350" width="500" height="350" role="img" aria-labelledby="q13-title q13-desc">
  <title id="q13-title">직각사다리꼴 ABCD</title>
  <desc id="q13-desc">AD와 BC가 평행하고 각 B가 직각인 사다리꼴 ABCD와 각 변의 길이</desc>
  <rect width="500" height="350" fill="#ffffff"/>
  <polygon points="100,70 100,270 400,270 220,70" fill="#f3f4f6" stroke="#111827" stroke-width="2.5"/>
  <path d="M 100,90 L 120,90 L 120,70" fill="none" stroke="#dc2626" stroke-width="1.5"/>
  <path d="M 100,250 L 120,250 L 120,270" fill="none" stroke="#dc2626" stroke-width="1.5"/>
  <text x="80" y="65" font-family="sans-serif" font-size="16" font-weight="bold" fill="#111827">A</text>
  <text x="80" y="285" font-family="sans-serif" font-size="16" font-weight="bold" fill="#111827">B</text>
  <text x="410" y="285" font-family="sans-serif" font-size="16" font-weight="bold" fill="#111827">C</text>
  <text x="225" y="60" font-family="sans-serif" font-size="16" font-weight="bold" fill="#111827">D</text>
  <text x="145" y="60" font-family="sans-serif" font-size="14" fill="#4b5563">4 cm</text>
  <text x="60" y="175" font-family="sans-serif" font-size="14" fill="#4b5563">6 cm</text>
  <text x="240" y="295" font-family="sans-serif" font-size="14" fill="#4b5563">10 cm</text>
  <text x="325" y="160" font-family="sans-serif" font-size="14" fill="#4b5563">8 cm</text>
</svg>