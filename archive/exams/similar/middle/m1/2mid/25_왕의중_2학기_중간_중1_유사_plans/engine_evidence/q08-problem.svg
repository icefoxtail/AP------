<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500" role="img" aria-labelledby="q08-title q08-desc">
  <title id="q08-title">정비례 관계 y=ax의 그래프</title>
  <desc id="q08-desc">원점을 지나는 직선이 점 (4, 6)과 점 (-8, b)를 지나는 모습</desc>
  <rect width="500" height="500" fill="#ffffff"/>
  <line x1="30" y1="250" x2="470" y2="250" stroke="#111827" stroke-width="2"/>
  <polyline points="460,245 470,250 460,255" fill="none" stroke="#111827" stroke-width="2"/>
  <line x1="250" y1="470" x2="250" y2="30" stroke="#111827" stroke-width="2"/>
  <polyline points="245,40 250,30 255,40" fill="none" stroke="#111827" stroke-width="2"/>
  <text x="475" y="255" font-family="sans-serif" font-size="16" font-style="italic" fill="#111827">x</text>
  <text x="250" y="22" font-family="sans-serif" font-size="16" font-style="italic" text-anchor="middle" fill="#111827">y</text>
  <text x="238" y="268" font-family="sans-serif" font-size="14" font-style="italic" fill="#111827">O</text>
  <line x1="100" y1="475" x2="370" y2="70" stroke="#2563eb" stroke-width="2.5"/>
  <line x1="310" y1="250" x2="310" y2="160" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="250" y1="160" x2="310" y2="160" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,4"/>
  <circle cx="310" cy="160" r="5" fill="#2563eb"/>
  <text x="306" y="270" font-family="sans-serif" font-size="14" fill="#374151">4</text>
  <text x="230" y="165" font-family="sans-serif" font-size="14" fill="#374151">6</text>
  <line x1="130" y1="250" x2="130" y2="430" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="250" y1="430" x2="130" y2="430" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,4"/>
  <circle cx="130" cy="430" r="5" fill="#2563eb"/>
  <text x="120" y="240" font-family="sans-serif" font-size="14" fill="#374151">-8</text>
  <text x="260" y="435" font-family="sans-serif" font-size="15" font-style="italic" fill="#dc2626">b</text>
</svg>