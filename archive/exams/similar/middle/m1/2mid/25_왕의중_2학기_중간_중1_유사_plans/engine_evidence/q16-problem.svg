<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300" width="500" height="300" role="img" aria-labelledby="q16-title q16-desc">
  <title id="q16-title">직사각형 종이테이프의 접기</title>
  <desc id="q16-desc">직사각형 모양의 종이를 선분 EF를 따라 접었을 때 생기는 각과 각 x</desc>
  <rect width="500" height="300" fill="#ffffff"/>
  <rect x="50" y="80" width="400" height="140" fill="none" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="180" y1="80" x2="240" y2="220" stroke="#dc2626" stroke-width="2.5"/>
  <polygon points="50,80 180,80 240,220 50,220" fill="#f1f5f9" stroke="#111827" stroke-width="2"/>
  <polygon points="180,80 240,220 320,220 280,140" fill="#e0e7ff" stroke="#111827" stroke-width="2"/>
  <path d="M 206,95 A 30 30 0 0 1 192,108" fill="none" stroke="#dc2626" stroke-width="1.5"/>
  <path d="M 285,220 A 35 35 0 0 1 295,195" fill="none" stroke="#2563eb" stroke-width="1.8"/>
  <text x="175" y="65" font-family="sans-serif" font-size="16" font-weight="bold" fill="#111827">E</text>
  <text x="240" y="245" font-family="sans-serif" font-size="16" font-weight="bold" fill="#111827">F</text>
  <text x="330" y="235" font-family="sans-serif" font-size="16" font-weight="bold" fill="#111827">G</text>
  <text x="290" y="130" font-family="sans-serif" font-size="16" font-weight="bold" fill="#111827">C'</text>
  <text x="205" y="115" font-family="sans-serif" font-size="13" fill="#dc2626">56°</text>
  <text x="275" y="210" font-family="sans-serif" font-size="15" font-style="italic" fill="#2563eb">x</text>
</svg>
