<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 300" width="450" height="300" role="img" aria-labelledby="q17-title q17-desc">
  <title id="q17-title">사각형의 내각과 외각</title>
  <desc id="q17-desc">사각형 ABCD와 점 C에서의 외각 x</desc>
  <rect width="450" height="300" fill="#ffffff"/>
  <!-- 사각형 ABCD: A=(120,60), B=(60,200), C=(280,200), D=(240,80) -->
  <polygon points="120,60 60,200 280,200 240,80" fill="none" stroke="#222222" stroke-width="2"/>
  <!-- BC 연장선 -->
  <line x1="280" y1="200" x2="380" y2="200" stroke="#222222" stroke-width="2" stroke-dasharray="4,4"/>
  <circle cx="120" cy="60" r="4" fill="#222222"/>
  <circle cx="60" cy="200" r="4" fill="#222222"/>
  <circle cx="280" cy="200" r="4" fill="#222222"/>
  <circle cx="240" cy="80" r="4" fill="#222222"/>
  <g font-family="sans-serif" font-size="15" font-weight="bold" fill="#111111">
    <text x="110" y="45">A</text>
    <text x="40" y="215">B</text>
    <text x="270" y="225">C</text>
    <text x="245" y="70">D</text>
    <text x="120" y="85">85°</text>
    <text x="80" y="190">130°</text>
    <text x="215" y="105">75°</text>
    <text x="310" y="190" fill="#c0392b">x</text>
  </g>
</svg>