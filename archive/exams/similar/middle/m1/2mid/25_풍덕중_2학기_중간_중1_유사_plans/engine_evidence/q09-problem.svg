<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 350" width="450" height="350" role="img" aria-labelledby="q09-title q09-desc">
  <title id="q09-title">잘린 직육면체</title>
  <desc id="q09-desc">직육면체의 한 모퉁이를 잘라낸 입체도형</desc>
  <rect width="450" height="350" fill="#ffffff"/>
  <!-- 앞면 ABFE, 윗면 ABCD, 아랫면 EFGH -->
  <polygon points="120,110 240,110 270,140 270,250 120,250" fill="none" stroke="#222222" stroke-width="2"/>
  <polygon points="120,110 240,110 320,60 190,60" fill="none" stroke="#222222" stroke-width="2"/>
  <line x1="320" y1="60" x2="350" y2="90" stroke="#222222" stroke-width="2"/>
  <line x1="350" y1="90" x2="350" y2="200" stroke="#222222" stroke-width="2"/>
  <line x1="270" y1="140" x2="350" y2="90" stroke="#222222" stroke-width="2"/>
  <line x1="270" y1="250" x2="350" y2="200" stroke="#222222" stroke-width="2"/>
  <!-- 숨은선 -->
  <line x1="190" y1="60" x2="190" y2="200" stroke="#888888" stroke-width="2" stroke-dasharray="5,5"/>
  <line x1="120" y1="250" x2="190" y2="200" stroke="#888888" stroke-width="2" stroke-dasharray="5,5"/>
  <line x1="190" y1="200" x2="350" y2="200" stroke="#888888" stroke-width="2" stroke-dasharray="5,5"/>
  <g font-family="sans-serif" font-size="15" font-weight="bold" fill="#111111">
    <text x="100" y="105">A</text>
    <text x="240" y="100">B</text>
    <text x="325" y="55">C</text>
    <text x="180" y="55">D</text>
    <text x="100" y="265">E</text>
    <text x="260" y="270">F</text>
    <text x="360" y="205">G</text>
    <text x="175" y="205">H</text>
  </g>
</svg>