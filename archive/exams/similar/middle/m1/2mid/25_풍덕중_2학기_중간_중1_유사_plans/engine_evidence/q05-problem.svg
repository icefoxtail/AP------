<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 250" width="450" height="250" role="img" aria-labelledby="q05-title q05-desc">
  <title id="q05-title">직선 AB와 교각</title>
  <desc id="q05-desc">세 점 A, O, B가 한 직선 위에 있고 교각들이 표시된 그림</desc>
  <rect width="450" height="250" fill="#ffffff"/>
  <line x1="40" y1="180" x2="410" y2="180" stroke="#222222" stroke-width="2"/>
  <!-- Ray OC -->
  <line x1="225" y1="180" x2="110" y2="50" stroke="#222222" stroke-width="2"/>
  <!-- Ray OD -->
  <line x1="225" y1="180" x2="310" y2="40" stroke="#222222" stroke-width="2"/>
  <circle cx="225" cy="180" r="4" fill="#222222"/>
  <circle cx="60" cy="180" r="3.5" fill="#222222"/>
  <circle cx="390" cy="180" r="3.5" fill="#222222"/>
  <circle cx="110" cy="50" r="3.5" fill="#222222"/>
  <circle cx="310" cy="40" r="3.5" fill="#222222"/>
  <g font-family="sans-serif" font-size="16" font-weight="bold" fill="#111111">
    <text x="50" y="205">A</text>
    <text x="220" y="205">O</text>
    <text x="390" y="205">B</text>
    <text x="95" y="45">C</text>
    <text x="315" y="35">D</text>
    <text x="120" y="150" font-size="14" fill="#1f5fa8">2x+10°</text>
    <text x="215" y="110" font-size="14" fill="#1f5fa8">x°</text>
    <text x="280" y="150" font-size="14" fill="#1f5fa8">x+50°</text>
  </g>
</svg>