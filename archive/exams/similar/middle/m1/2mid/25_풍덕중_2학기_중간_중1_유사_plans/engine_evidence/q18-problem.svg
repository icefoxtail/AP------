<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-labelledby="q18-title q18-desc">
  <title id="q18-title">8등분된 원형 케이크</title>
  <desc id="q18-desc">반지름 12cm인 원이 8조각으로 나뉘고 3조각이 색칠된 모습</desc>
  <rect width="400" height="400" fill="#ffffff"/>
  <!-- 3 조각 색칠: 0 to 135 deg (from 3 o'clock counter-clockwise to 10:30) -->
  <path d="M 200,200 L 340,200 A 140 140 0 0 0 101,101 Z" fill="#d0d0d0" stroke="#222222" stroke-width="2"/>
  <!-- 나머지 원 둘레 -->
  <circle cx="200" cy="200" r="140" fill="none" stroke="#222222" stroke-width="2"/>
  <!-- 8개 분할선 -->
  <line x1="60" y1="200" x2="340" y2="200" stroke="#222222" stroke-width="1.5"/>
  <line x1="200" y1="60" x2="200" y2="340" stroke="#222222" stroke-width="1.5"/>
  <line x1="101" y1="101" x2="299" y2="299" stroke="#222222" stroke-width="1.5"/>
  <line x1="101" y1="299" x2="299" y2="101" stroke="#222222" stroke-width="1.5"/>
  <circle cx="200" cy="200" r="4" fill="#222222"/>
  <g font-family="sans-serif" font-size="14" font-weight="bold" fill="#111111">
    <text x="240" y="190" fill="#1f5fa8">12 cm</text>
  </g>
</svg>