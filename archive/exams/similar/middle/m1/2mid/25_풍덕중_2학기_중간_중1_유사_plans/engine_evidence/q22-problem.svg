<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 250" width="450" height="250" role="img" aria-labelledby="q22-title q22-desc">
  <title id="q22-title">네 반직선과 교각</title>
  <desc id="q22-desc">한 점 O에서 뻗은 네 반직선 OA, OB, OC, OD와 각의 크기</desc>
  <rect width="450" height="250" fill="#ffffff"/>
  <!-- O=(225,125) -->
  <line x1="225" y1="125" x2="60" y2="100" stroke="#222222" stroke-width="2"/>
  <line x1="225" y1="125" x2="380" y2="160" stroke="#222222" stroke-width="2"/>
  <line x1="225" y1="125" x2="110" y2="220" stroke="#222222" stroke-width="2"/>
  <line x1="225" y1="125" x2="330" y2="40" stroke="#222222" stroke-width="2"/>
  <circle cx="225" cy="125" r="4.5" fill="#222222"/>
  <circle cx="60" cy="100" r="4" fill="#222222"/>
  <circle cx="380" cy="160" r="4" fill="#222222"/>
  <circle cx="110" cy="220" r="4" fill="#222222"/>
  <circle cx="330" cy="40" r="4" fill="#222222"/>
  <g font-family="sans-serif" font-size="16" font-weight="bold" fill="#111111">
    <text x="45" y="100">A</text>
    <text x="390" y="165">B</text>
    <text x="95" y="235">C</text>
    <text x="335" y="35">D</text>
    <text x="235" y="145">O</text>
    <text x="210" y="60" font-size="14" fill="#1f5fa8">138°</text>
    <text x="170" y="180" font-size="14" fill="#1f5fa8">46°</text>
  </g>
</svg>