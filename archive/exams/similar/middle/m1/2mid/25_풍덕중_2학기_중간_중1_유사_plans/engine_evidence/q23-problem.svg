<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 250" width="500" height="250" role="img" aria-labelledby="q23-title q23-desc">
  <title id="q23-title">평행선과 착시현상</title>
  <desc id="q23-desc">두 평행한 가로선 m, n과 가로지르는 직선 l</desc>
  <rect width="500" height="250" fill="#ffffff"/>
  <!-- 두 굵은 가로선 m, n -->
  <line x1="40" y1="80" x2="460" y2="80" stroke="#111111" stroke-width="4"/>
  <line x1="40" y1="170" x2="460" y2="170" stroke="#111111" stroke-width="4"/>
  <!-- 가로지르는 직선 l -->
  <line x1="120" y1="230" x2="380" y2="20" stroke="#1f5fa8" stroke-width="2.5"/>
  <!-- 착시 사선들 -->
  <line x1="80" y1="100" x2="110" y2="60" stroke="#888888" stroke-width="1.5"/>
  <line x1="140" y1="100" x2="170" y2="60" stroke="#888888" stroke-width="1.5"/>
  <line x1="200" y1="100" x2="230" y2="60" stroke="#888888" stroke-width="1.5"/>
  <line x1="260" y1="100" x2="290" y2="60" stroke="#888888" stroke-width="1.5"/>
  <line x1="320" y1="100" x2="350" y2="60" stroke="#888888" stroke-width="1.5"/>
  <line x1="380" y1="100" x2="410" y2="60" stroke="#888888" stroke-width="1.5"/>
  <line x1="80" y1="150" x2="110" y2="190" stroke="#888888" stroke-width="1.5"/>
  <line x1="140" y1="150" x2="170" y2="190" stroke="#888888" stroke-width="1.5"/>
  <line x1="200" y1="150" x2="230" y2="190" stroke="#888888" stroke-width="1.5"/>
  <line x1="260" y1="150" x2="290" y2="190" stroke="#888888" stroke-width="1.5"/>
  <line x1="320" y1="150" x2="350" y2="190" stroke="#888888" stroke-width="1.5"/>
  <line x1="380" y1="150" x2="410" y2="190" stroke="#888888" stroke-width="1.5"/>
  <g font-family="sans-serif" font-size="16" font-weight="bold" fill="#111111">
    <text x="470" y="85">m</text>
    <text x="470" y="175">n</text>
    <text x="390" y="30" fill="#1f5fa8">l</text>
    <text x="290" y="70" font-size="14" fill="#c0392b">45°</text>
    <text x="180" y="160" font-size="14" fill="#c0392b">45°</text>
  </g>
</svg>