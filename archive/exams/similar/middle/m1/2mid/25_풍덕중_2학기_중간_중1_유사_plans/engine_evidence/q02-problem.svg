<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 120" width="450" height="120" role="img" aria-labelledby="q02-title q02-desc">
  <title id="q02-title">직선 위의 세 점 A, B, C</title>
  <desc id="q02-desc">한 직선 위에 세 점 A, B, C가 차례로 놓인 모습</desc>
  <rect width="450" height="120" fill="#ffffff"/>
  <line x1="30" y1="60" x2="420" y2="60" stroke="#222222" stroke-width="2"/>
  <polyline points="40,54 30,60 40,66" fill="none" stroke="#222222" stroke-width="2"/>
  <polyline points="410,54 420,60 410,66" fill="none" stroke="#222222" stroke-width="2"/>
  <circle cx="100" cy="60" r="4.5" fill="#222222"/>
  <circle cx="225" cy="60" r="4.5" fill="#222222"/>
  <circle cx="350" cy="60" r="4.5" fill="#222222"/>
  <g font-family="sans-serif" font-size="16" font-weight="bold" fill="#111111" text-anchor="middle">
    <text x="100" y="42">A</text>
    <text x="225" y="42">B</text>
    <text x="350" y="42">C</text>
  </g>
</svg>