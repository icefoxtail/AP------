<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300" width="500" height="300" role="img" aria-labelledby="q11-title q11-desc">
  <title id="q11-title">평행선과 꺾은선</title>
  <desc id="q11-desc">두 평행선 l, m 사이의 꺾은선에 생기는 각</desc>
  <rect width="500" height="300" fill="#ffffff"/>
  <!-- 평행선 l, m -->
  <line x1="40" y1="60" x2="460" y2="60" stroke="#222222" stroke-width="2"/>
  <line x1="40" y1="240" x2="460" y2="240" stroke="#222222" stroke-width="2"/>
  <!-- 꺾은선: (120,60) -> (240,110) -> (170,190) -> (300,240) -->
  <polyline points="120,60 240,110 170,190 300,240" fill="none" stroke="#1f5fa8" stroke-width="2.5"/>
  <g font-family="sans-serif" font-size="15" font-weight="bold" fill="#111111">
    <text x="470" y="65">l</text>
    <text x="470" y="245">m</text>
    <text x="135" y="85">40°</text>
    <text x="245" y="115">85°</text>
    <text x="135" y="195" fill="#c0392b">x</text>
    <text x="270" y="230">25°</text>
  </g>
</svg>