<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 300" width="450" height="300" role="img" aria-labelledby="q06-title q06-desc">
  <title id="q06-title">직각삼각형 ABC와 점 D</title>
  <desc id="q06-desc">각 C가 직각인 직각삼각형 ABC와 변 BC의 중점 D</desc>
  <rect width="450" height="300" fill="#ffffff"/>
  <!-- 직각삼각형 ABC: C=(100,240), A=(100,60), B=(380,240) -->
  <polygon points="100,240 100,60 380,240" fill="none" stroke="#222222" stroke-width="2"/>
  <!-- 직각 표시 -->
  <polyline points="100,220 120,220 120,240" fill="none" stroke="#222222" stroke-width="1.8"/>
  <!-- 점 D: 중점 (240, 240) -->
  <line x1="100" y1="60" x2="240" y2="240" stroke="#888888" stroke-width="1.8" stroke-dasharray="4,4"/>
  <circle cx="100" cy="60" r="4.5" fill="#222222"/>
  <circle cx="100" cy="240" r="4.5" fill="#222222"/>
  <circle cx="240" cy="240" r="4" fill="#222222"/>
  <circle cx="380" cy="240" r="4.5" fill="#222222"/>
  <g font-family="sans-serif" font-size="16" font-weight="bold" fill="#111111">
    <text x="90" y="50">A</text>
    <text x="80" y="255">C</text>
    <text x="235" y="265">D</text>
    <text x="390" y="255">B</text>
    <text x="50" y="155" font-size="14" fill="#1f5fa8">6 cm</text>
    <text x="160" y="260" font-size="14" fill="#1f5fa8">5 cm</text>
    <text x="300" y="260" font-size="14" fill="#1f5fa8">5 cm</text>
  </g>
</svg>