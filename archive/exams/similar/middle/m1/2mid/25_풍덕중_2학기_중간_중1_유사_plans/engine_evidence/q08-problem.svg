<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 350" width="450" height="350" role="img" aria-labelledby="q08-title q08-desc">
  <title id="q08-title">정육면체의 전개도</title>
  <desc id="q08-desc">정육면체를 펼친 전개도와 모서리 AB</desc>
  <rect width="450" height="350" fill="#ffffff"/>
  <!-- 4칸 가로 줄: x=75, 150, 225, 300, y=120 to 195 (한변 75) -->
  <rect x="75" y="120" width="75" height="75" fill="none" stroke="#222222" stroke-width="2"/>
  <rect x="150" y="120" width="75" height="75" fill="none" stroke="#222222" stroke-width="2"/>
  <rect x="225" y="120" width="75" height="75" fill="none" stroke="#222222" stroke-width="2"/>
  <rect x="300" y="120" width="75" height="75" fill="none" stroke="#222222" stroke-width="2"/>
  <!-- 위 날개: x=150, y=45 -->
  <rect x="150" y="45" width="75" height="75" fill="none" stroke="#222222" stroke-width="2"/>
  <!-- 아래 날개: x=150, y=195 -->
  <rect x="150" y="195" width="75" height="75" fill="none" stroke="#222222" stroke-width="2"/>
  <!-- 강조된 모서리 AB: (150, 45) to (225, 45) -->
  <line x1="150" y1="45" x2="225" y2="45" stroke="#c0392b" stroke-width="4"/>
  <circle cx="150" cy="45" r="4.5" fill="#c0392b"/>
  <circle cx="225" cy="45" r="4.5" fill="#c0392b"/>
  <g font-family="sans-serif" font-size="16" font-weight="bold" fill="#111111">
    <text x="135" y="40" fill="#c0392b">A</text>
    <text x="235" y="40" fill="#c0392b">B</text>
  </g>
</svg>