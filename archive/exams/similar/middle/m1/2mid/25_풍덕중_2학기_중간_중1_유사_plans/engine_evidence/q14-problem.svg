<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 250" width="500" height="250" role="img" aria-labelledby="q14-title q14-desc">
  <title id="q14-title">두 직각삼각형의 합동</title>
  <desc id="q14-desc">합동인 두 직각삼각형 ABC와 DEF</desc>
  <rect width="500" height="250" fill="#ffffff"/>
  <!-- Triangle ABC: B=(60,200), A=(60,70), C=(220,200) -->
  <polygon points="60,200 60,70 220,200" fill="none" stroke="#222222" stroke-width="2"/>
  <polyline points="60,180 80,180 80,200" fill="none" stroke="#222222" stroke-width="1.8"/>
  <!-- Triangle DEF: E=(310,200), D=(310,70), F=(470,200) -->
  <polygon points="310,200 310,70 470,200" fill="none" stroke="#222222" stroke-width="2"/>
  <polyline points="310,180 330,180 330,200" fill="none" stroke="#222222" stroke-width="1.8"/>
  <g font-family="sans-serif" font-size="15" font-weight="bold" fill="#111111">
    <text x="50" y="60">A</text>
    <text x="45" y="220">B</text>
    <text x="225" y="220">C</text>
    <text x="300" y="60">D</text>
    <text x="295" y="220">E</text>
    <text x="475" y="220">F</text>
    <text x="20" y="140" fill="#1f5fa8">6 cm</text>
    <text x="130" y="225" fill="#1f5fa8">8 cm</text>
    <text x="65" y="105">50°</text>
    <text x="380" y="225" fill="#c0392b">x cm</text>
    <text x="430" y="190" fill="#c0392b">y°</text>
  </g>
</svg>