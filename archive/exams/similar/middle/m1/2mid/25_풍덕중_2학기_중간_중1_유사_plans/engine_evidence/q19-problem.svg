<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 350" width="450" height="350" role="img" aria-labelledby="q19-title q19-desc">
  <title id="q19-title">원 O에서의 중심각과 호</title>
  <desc id="q19-desc">중심각 80도인 부채꼴 AOB와 40도인 부채꼴 COD</desc>
  <rect width="450" height="350" fill="#ffffff"/>
  <circle cx="225" cy="175" r="130" fill="none" stroke="#222222" stroke-width="2"/>
  <!-- O=(225,175) -->
  <!-- AOB: 80 deg. Let A be at -20 deg (225+130*cos(-20), 175+130*sin(-20)) = (347, 130) -->
  <!-- B be at -100 deg = (202, 47) -->
  <line x1="225" y1="175" x2="347" y2="130" stroke="#222222" stroke-width="2"/>
  <line x1="225" y1="175" x2="202" y2="47" stroke="#222222" stroke-width="2"/>
  <!-- COD: 40 deg. Let C be at 140 deg = (125, 258), D be at 180 deg = (95, 175) -->
  <line x1="225" y1="175" x2="125" y2="258" stroke="#222222" stroke-width="2"/>
  <line x1="225" y1="175" x2="95" y2="175" stroke="#222222" stroke-width="2"/>
  <circle cx="225" cy="175" r="4.5" fill="#222222"/>
  <circle cx="347" cy="130" r="4" fill="#222222"/>
  <circle cx="202" cy="47" r="4" fill="#222222"/>
  <circle cx="125" cy="258" r="4" fill="#222222"/>
  <circle cx="95" cy="175" r="4" fill="#222222"/>
  <g font-family="sans-serif" font-size="16" font-weight="bold" fill="#111111">
    <text x="215" y="195">O</text>
    <text x="355" y="135">A</text>
    <text x="195" y="35">B</text>
    <text x="110" y="275">C</text>
    <text x="75" y="180">D</text>
    <text x="240" y="125" font-size="13">80°</text>
    <text x="140" y="195" font-size="13">40°</text>
  </g>
</svg>