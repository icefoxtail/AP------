<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 240" width="500" height="240" role="img" aria-labelledby="q03-title q03-desc">
  <title id="q03-title">선분의 중점과 길이 관계</title>
  <desc id="q03-desc">선분 AC 위에 점 A, M, B, N, C가 순서대로 놓여 있는 선분 다이어그램</desc>
  <rect width="500" height="240" fill="#ffffff"/>
  <!-- 기준 선분 AC -->
  <line x1="50" y1="120" x2="450" y2="120" stroke="#1e293b" stroke-width="2.5"/>
  <circle cx="50" cy="120" r="4.5" fill="#1e293b"/>
  <circle cx="210" cy="120" r="4.5" fill="#1e293b"/>
  <circle cx="370" cy="120" r="4.5" fill="#1e293b"/>
  <circle cx="410" cy="120" r="4.5" fill="#1e293b"/>
  <circle cx="450" cy="120" r="4.5" fill="#1e293b"/>
  <!-- 보조 치수선 MN -->
  <line x1="210" y1="70" x2="410" y2="70" stroke="#2563eb" stroke-width="2"/>
  <line x1="210" y1="60" x2="210" y2="80" stroke="#2563eb" stroke-width="2"/>
  <line x1="410" y1="60" x2="410" y2="80" stroke="#2563eb" stroke-width="2"/>
  <text x="310" y="55" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2563eb" text-anchor="middle">30 cm</text>
  <!-- 점 라벨 -->
  <g font-family="sans-serif" font-size="16" font-weight="bold" fill="#0f172a" text-anchor="middle">
    <text x="50" y="155">A</text>
    <text x="210" y="155">M</text>
    <text x="370" y="155">B</text>
    <text x="410" y="155">N</text>
    <text x="450" y="155">C</text>
  </g>
</svg>