<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 340" width="520" height="340" role="img" aria-labelledby="q21-title q21-desc">
  <title id="q21-title">맞꼭지각과 두 삼각형의 각 x</title>
  <desc id="q21-desc">두 선분 AD와 BC의 교점 O에서 맞꼭지각을 이루는 두 삼각형 ABO와 CDO 다이어그램</desc>
  <rect width="520" height="340" fill="#ffffff"/>
  <!-- Two crossing segments AD and BC -->
  <line x1="70" y1="80" x2="450" y2="260" stroke="#0f172a" stroke-width="2.5"/>
  <line x1="70" y1="260" x2="450" y2="80" stroke="#0f172a" stroke-width="2.5"/>
  <!-- Triangle bases AB and CD -->
  <line x1="70" y1="80" x2="70" y2="260" stroke="#2563eb" stroke-width="3"/>
  <line x1="450" y1="80" x2="450" y2="260" stroke="#2563eb" stroke-width="3"/>
  <!-- Center O -->
  <circle cx="260" cy="170" r="4.5" fill="#0f172a"/>
  <!-- Angles on left triangle ABO -->
  <text x="95" y="115" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0f172a">70°</text>
  <text x="95" y="245" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0f172a">45°</text>
  <!-- Angles on right triangle CDO -->
  <text x="410" y="115" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0f172a">57°</text>
  <text x="410" y="245" font-family="sans-serif" font-size="16" font-weight="bold" fill="#dc2626">x</text>
  <!-- Labels -->
  <g font-family="sans-serif" font-size="16" font-weight="bold" fill="#0f172a" text-anchor="middle">
    <text x="50" y="85">A</text>
    <text x="50" y="270">B</text>
    <text x="470" y="85">C</text>
    <text x="470" y="270">D</text>
    <text x="260" y="150">O</text>
  </g>
</svg>
