<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" width="480" height="320" role="img" aria-labelledby="q05-title q05-desc">
  <title id="q05-title">두 직선의 교차와 수선</title>
  <desc id="q05-desc">직선 AD와 BE가 O에서 교차하고 반직선 OC가 AD에 수직인 각도 다이어그램</desc>
  <rect width="480" height="320" fill="#ffffff"/>
  <!-- 직선 AD (수평선) -->
  <line x1="60" y1="180" x2="420" y2="180" stroke="#1e293b" stroke-width="2.5"/>
  <!-- 수선 OC (수직선 위쪽) -->
  <line x1="240" y1="180" x2="240" y2="50" stroke="#1e293b" stroke-width="2.5"/>
  <!-- 직선 BE (B는 2사분면, E는 4사분면) -->
  <line x1="120" y1="80" x2="360" y2="280" stroke="#1e293b" stroke-width="2.5"/>
  <!-- 점 O -->
  <circle cx="240" cy="180" r="4.5" fill="#1e293b"/>
  <!-- 직각 표시 (DOC) -->
  <path d="M 240,165 L 255,165 L 255,180" fill="none" stroke="#dc2626" stroke-width="2"/>
  <!-- 라벨 -->
  <g font-family="sans-serif" font-size="16" font-weight="bold" fill="#0f172a" text-anchor="middle">
    <text x="50" y="185">A</text>
    <text x="430" y="185">D</text>
    <text x="105" y="75">B</text>
    <text x="375" y="295">E</text>
    <text x="240" y="40">C</text>
    <text x="245" y="205">O</text>
  </g>
</svg>
