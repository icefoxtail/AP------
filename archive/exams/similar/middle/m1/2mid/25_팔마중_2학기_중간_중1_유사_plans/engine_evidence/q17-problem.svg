<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 400" width="540" height="400" role="img" aria-labelledby="q17-title q17-desc">
  <title id="q17-title">평행선과 이등변삼각형 ADE</title>
  <desc id="q17-desc">삼각형 ABC와 평행선 l, m, 그리고 이등변삼각형 ADE의 각 관계 다이어그램</desc>
  <rect width="540" height="400" fill="#ffffff"/>
  <!-- Line m passing through AC -->
  <line x1="50" y1="220" x2="480" y2="220" stroke="#0f172a" stroke-width="2"/>
  <text x="495" y="225" font-family="sans-serif" font-size="16" font-style="italic" fill="#0f172a">m</text>
  <!-- Line l parallel to m through D and E -->
  <line x1="50" y1="90" x2="480" y2="90" stroke="#0f172a" stroke-width="2"/>
  <text x="495" y="95" font-family="sans-serif" font-size="16" font-style="italic" fill="#0f172a">l</text>
  <!-- Line BD passing through B, A, D -->
  <line x1="100" y1="365" x2="285" y2="65" stroke="#0f172a" stroke-width="2.5"/>
  <!-- Triangle ABC side BC -->
  <line x1="110" y1="350" x2="390" y2="220" stroke="#0f172a" stroke-width="2.5"/>
  <!-- Segment AC highlighted on line m -->
  <line x1="190" y1="220" x2="390" y2="220" stroke="#0f172a" stroke-width="3"/>
  <!-- Triangle ADE sides -->
  <line x1="270" y1="90" x2="420" y2="90" stroke="#2563eb" stroke-width="3"/>
  <line x1="190" y1="220" x2="420" y2="90" stroke="#2563eb" stroke-width="2.5"/>
  <!-- Isosceles marks on DA and DE -->
  <line x1="225" y1="150" x2="235" y2="160" stroke="#dc2626" stroke-width="2"/>
  <line x1="342" y1="83" x2="348" y2="97" stroke="#dc2626" stroke-width="2"/>
  <!-- Points -->
  <circle cx="110" cy="350" r="4.5" fill="#0f172a"/>
  <circle cx="190" cy="220" r="4.5" fill="#0f172a"/>
  <circle cx="390" cy="220" r="4.5" fill="#0f172a"/>
  <circle cx="270" cy="90" r="4.5" fill="#0f172a"/>
  <circle cx="420" cy="90" r="4.5" fill="#0f172a"/>
  <!-- Angle labels in triangle ABC -->
  <text x="140" y="340" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0f172a">30°</text>
  <text x="355" y="245" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0f172a">40°</text>
  <!-- Vertex labels -->
  <g font-family="sans-serif" font-size="16" font-weight="bold" fill="#0f172a">
    <text x="85" y="365">B</text>
    <text x="170" y="240">A</text>
    <text x="405" y="240">C</text>
    <text x="260" y="75">D</text>
    <text x="425" y="75">E</text>
  </g>
</svg>