<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 280" width="540" height="280" role="img" aria-labelledby="q13-title q13-desc">
  <title id="q13-title">합동인 두 삼각형 ABC와 DEF</title>
  <desc id="q13-desc">삼각형 ABC와 DEF가 합동일 때 대응각과 대응변의 관계를 나타낸 다이어그램</desc>
  <rect width="540" height="280" fill="#ffffff"/>
  <!-- Triangle ABC -->
  <polygon points="70,210 230,210 150,80" fill="#f8fafc" stroke="#0f172a" stroke-width="2.5"/>
  <text x="150" y="115" font-family="sans-serif" font-size="14" fill="#2563eb" text-anchor="middle">65°</text>
  <text x="95" y="200" font-family="sans-serif" font-size="14" fill="#dc2626">x°</text>
  <text x="95" y="145" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0f172a">7 cm</text>
  <!-- Triangle DEF -->
  <polygon points="310,210 470,210 390,80" fill="#f8fafc" stroke="#0f172a" stroke-width="2.5"/>
  <text x="445" y="200" font-family="sans-serif" font-size="14" fill="#2563eb" text-anchor="middle">45°</text>
  <text x="390" y="235" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="middle">9 cm</text>
  <text x="335" y="145" font-family="sans-serif" font-size="14" font-weight="bold" fill="#dc2626">y cm</text>
  <!-- Vertices labels -->
  <g font-family="sans-serif" font-size="16" font-weight="bold" fill="#0f172a" text-anchor="middle">
    <text x="150" y="65">A</text>
    <text x="55" y="225">B</text>
    <text x="245" y="225">C</text>
    <text x="390" y="65">D</text>
    <text x="295" y="225">E</text>
    <text x="485" y="225">F</text>
  </g>
</svg>
