<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320" width="500" height="320" role="img" aria-labelledby="q08-title q08-desc">
  <title id="q08-title">평행선과 꺾인 선의 각 x</title>
  <desc id="q08-desc">평행한 두 직선 l과 m 사이에서 꺾인 선과 각 42도, 38도, x의 관계</desc>
  <rect width="500" height="320" fill="#ffffff"/>
  <!-- Parallel lines l and m -->
  <line x1="40" y1="70" x2="460" y2="70" stroke="#0f172a" stroke-width="2.5"/>
  <line x1="40" y1="250" x2="460" y2="250" stroke="#0f172a" stroke-width="2.5"/>
  <text x="475" y="75" font-family="sans-serif" font-size="16" font-style="italic" fill="#0f172a">l</text>
  <text x="475" y="255" font-family="sans-serif" font-size="16" font-style="italic" fill="#0f172a">m</text>
  <!-- Bent line -->
  <polyline points="120,70 280,160 180,250" fill="none" stroke="#2563eb" stroke-width="3"/>
  <!-- Angles -->
  <path d="M 160,70 A 40 40 0 0 1 148,86" fill="none" stroke="#dc2626" stroke-width="2"/>
  <text x="165" y="105" font-family="sans-serif" font-size="14" font-weight="bold" fill="#dc2626">42°</text>
  <path d="M 245,140 A 45 45 0 0 0 240,178" fill="none" stroke="#dc2626" stroke-width="2"/>
  <text x="210" y="165" font-family="sans-serif" font-size="16" font-weight="bold" fill="#dc2626">x</text>
  <path d="M 215,220 A 40 40 0 0 1 220,250" fill="none" stroke="#dc2626" stroke-width="2"/>
  <text x="225" y="235" font-family="sans-serif" font-size="14" font-weight="bold" fill="#dc2626">38°</text>
</svg>
