<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 320" width="540" height="320" role="img" aria-labelledby="q10-title q10-desc">
  <title id="q10-title">크기가 같은 각의 작도 과정</title>
  <desc id="q10-desc">각 XOY와 크기가 같은 각을 반직선 AB를 한 변으로 하여 작도하는 다이어그램</desc>
  <rect width="540" height="320" fill="#ffffff"/>
  <!-- Original angle XOY on left -->
  <line x1="80" y1="240" x2="240" y2="240" stroke="#0f172a" stroke-width="2.5"/>
  <line x1="80" y1="240" x2="200" y2="90" stroke="#0f172a" stroke-width="2.5"/>
  <text x="245" y="245" font-family="sans-serif" font-size="16" font-weight="bold" fill="#0f172a">X</text>
  <text x="205" y="85" font-family="sans-serif" font-size="16" font-weight="bold" fill="#0f172a">Y</text>
  <text x="60" y="255" font-family="sans-serif" font-size="16" font-weight="bold" fill="#0f172a">O</text>
  <!-- Arc on angle XOY -->
  <path d="M 160,240 A 80 80 0 0 0 144,160" fill="none" stroke="#2563eb" stroke-width="2" stroke-dasharray="3,3"/>
  <circle cx="160" cy="240" r="4" fill="#2563eb"/>
  <text x="160" y="265" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2563eb" text-anchor="middle">C</text>
  <circle cx="144" cy="160" r="4" fill="#2563eb"/>
  <text x="130" y="155" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2563eb">D</text>
  <!-- New angle on right: ray AB -->
  <line x1="330" y1="240" x2="490" y2="240" stroke="#0f172a" stroke-width="2.5"/>
  <line x1="330" y1="240" x2="450" y2="90" stroke="#0f172a" stroke-width="2.5"/>
  <text x="315" y="255" font-family="sans-serif" font-size="16" font-weight="bold" fill="#0f172a">A</text>
  <text x="495" y="245" font-family="sans-serif" font-size="16" font-weight="bold" fill="#0f172a">B</text>
  <!-- Arc on new ray -->
  <path d="M 410,240 A 80 80 0 0 0 394,160" fill="none" stroke="#2563eb" stroke-width="2" stroke-dasharray="3,3"/>
  <circle cx="410" cy="240" r="4" fill="#2563eb"/>
  <text x="410" y="265" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2563eb" text-anchor="middle">P</text>
  <!-- Intersecting compass mark at Q -->
  <path d="M 390,145 A 75 75 0 0 1 405,175" fill="none" stroke="#dc2626" stroke-width="2"/>
  <circle cx="394" cy="160" r="4" fill="#dc2626"/>
  <text x="380" y="155" font-family="sans-serif" font-size="14" font-weight="bold" fill="#dc2626">Q</text>
</svg>
