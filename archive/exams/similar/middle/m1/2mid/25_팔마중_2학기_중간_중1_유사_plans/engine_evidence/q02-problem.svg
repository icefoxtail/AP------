<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 200" width="480" height="200" role="img" aria-labelledby="q02-title q02-desc">
  <title id="q02-title">직선 위의 네 점</title>
  <desc id="q02-desc">직선 l 위에 순서대로 놓인 네 점 A, B, C, D</desc>
  <rect width="480" height="200" fill="#ffffff"/>
  <line x1="40" y1="100" x2="440" y2="100" stroke="#1e293b" stroke-width="2.5"/>
  <circle cx="100" cy="100" r="4.5" fill="#1e293b"/>
  <circle cx="180" cy="100" r="4.5" fill="#1e293b"/>
  <circle cx="280" cy="100" r="4.5" fill="#1e293b"/>
  <circle cx="380" cy="100" r="4.5" fill="#1e293b"/>
  <g font-family="sans-serif" font-size="16" font-weight="bold" fill="#0f172a" text-anchor="middle">
    <text x="100" y="130">A</text>
    <text x="180" y="130">B</text>
    <text x="280" y="130">C</text>
    <text x="380" y="130">D</text>
    <text x="430" y="85">l</text>
  </g>
</svg>