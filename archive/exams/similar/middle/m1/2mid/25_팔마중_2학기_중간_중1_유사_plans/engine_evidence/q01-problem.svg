<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 420" width="500" height="420" role="img" aria-labelledby="q01-title q01-desc">
  <title id="q01-title">직육면체의 한 모퉁이를 잘라낸 입체도형</title>
  <desc id="q01-desc">직육면체의 한 꼭짓점을 삼각뿔 형태로 잘라내어 꼭짓점 10개와 모서리 15개를 갖는 입체도형</desc>
  <rect width="500" height="420" fill="#ffffff"/>
  <!-- Hidden edges -->
  <line x1="120" y1="280" x2="120" y2="120" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="120" y1="280" x2="260" y2="280" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="120" y1="280" x2="60" y2="350" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4"/>
  <!-- Front and visible cut faces -->
  <polygon points="60,350 200,350 200,190 60,190" fill="none" stroke="#0f172a" stroke-width="2"/>
  <polygon points="200,350 340,280 340,120 200,190" fill="none" stroke="#0f172a" stroke-width="2"/>
  <polygon points="60,190 120,120 260,120 200,190" fill="none" stroke="#0f172a" stroke-width="2"/>
  <!-- Truncated triangle face at top-right corner -->
  <polygon points="230,120 200,155 270,155" fill="#f1f5f9" stroke="#2563eb" stroke-width="2"/>
  <!-- Visible outer outline connections -->
  <line x1="200" y1="190" x2="200" y2="155" stroke="#0f172a" stroke-width="2"/>
  <line x1="260" y1="120" x2="230" y2="120" stroke="#0f172a" stroke-width="2"/>
  <line x1="340" y1="120" x2="270" y2="155" stroke="#0f172a" stroke-width="2"/>
  <!-- Vertex circles -->
  <circle cx="60" cy="350" r="4" fill="#0f172a"/>
  <circle cx="200" cy="350" r="4" fill="#0f172a"/>
  <circle cx="340" cy="280" r="4" fill="#0f172a"/>
  <circle cx="60" cy="190" r="4" fill="#0f172a"/>
  <circle cx="120" cy="120" r="4" fill="#0f172a"/>
  <circle cx="230" cy="120" r="4" fill="#2563eb"/>
  <circle cx="200" cy="155" r="4" fill="#2563eb"/>
  <circle cx="270" cy="155" r="4" fill="#2563eb"/>
  <circle cx="340" cy="120" r="4" fill="#0f172a"/>
  <circle cx="200" cy="190" r="4" fill="#0f172a"/>
  <!-- Vertex labels -->
  <g font-family="sans-serif" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="middle">
    <text x="45" y="365">A</text>
    <text x="200" y="375">B</text>
    <text x="355" y="295">C</text>
    <text x="45" y="195">D</text>
    <text x="110" y="110">E</text>
    <text x="230" y="105">F</text>
    <text x="185" y="155">G</text>
    <text x="285" y="155">H</text>
    <text x="355" y="120">I</text>
    <text x="215" y="205">J</text>
  </g>
</svg>
