<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" width="480" height="320" role="img" aria-labelledby="q01-title q01-desc">
  <title id="q01-title">직육면체의 모퉁이를 잘라낸 입체도형</title>
  <desc id="q01-desc">직육면체의 한 모퉁이를 평면으로 잘라내어 삼각단면이 생긴 입체도형의 겨냥도</desc>
  <rect width="480" height="320" fill="#ffffff"/>
  <!-- 실선 모서리들 -->
  <line x1="120" y1="100" x2="280" y2="100" stroke="#1e293b" stroke-width="2.5"/>
  <line x1="280" y1="100" x2="380" y2="160" stroke="#1e293b" stroke-width="2.5"/>
  <line x1="120" y1="100" x2="120" y2="240" stroke="#1e293b" stroke-width="2.5"/>
  <line x1="120" y1="240" x2="280" y2="240" stroke="#1e293b" stroke-width="2.5"/>
  <line x1="280" y1="240" x2="380" y2="200" stroke="#1e293b" stroke-width="2.5"/>
  <line x1="380" y1="160" x2="380" y2="200" stroke="#1e293b" stroke-width="2.5"/>
  <!-- 잘린 모퉁이 단면 (삼각형) -->
  <line x1="220" y1="100" x2="280" y2="140" stroke="#2563eb" stroke-width="2.5"/>
  <line x1="280" y1="140" x2="240" y2="160" stroke="#2563eb" stroke-width="2.5"/>
  <line x1="240" y1="160" x2="220" y2="100" stroke="#2563eb" stroke-width="2.5"/>
  <!-- 앞쪽 기둥 및 연결선 -->
  <line x1="120" y1="100" x2="160" y2="160" stroke="#1e293b" stroke-width="2.5"/>
  <line x1="160" y1="160" x2="240" y2="160" stroke="#1e293b" stroke-width="2.5"/>
  <line x1="160" y1="160" x2="160" y2="270" stroke="#1e293b" stroke-width="2.5"/>
  <line x1="120" y1="240" x2="160" y2="270" stroke="#1e293b" stroke-width="2.5"/>
  <line x1="160" y1="270" x2="310" y2="270" stroke="#1e293b" stroke-width="2.5"/>
  <line x1="310" y1="270" x2="380" y2="200" stroke="#1e293b" stroke-width="2.5"/>
  <line x1="280" y1="140" x2="310" y2="270" stroke="#1e293b" stroke-width="2.5"/>
  <!-- 꼭짓점 점들 -->
  <circle cx="120" cy="100" r="4" fill="#0f172a"/>
  <circle cx="220" cy="100" r="4" fill="#0f172a"/>
  <circle cx="280" cy="100" r="4" fill="#0f172a"/>
  <circle cx="380" cy="160" r="4" fill="#0f172a"/>
  <circle cx="160" cy="160" r="4" fill="#0f172a"/>
  <circle cx="240" cy="160" r="4" fill="#0f172a"/>
  <circle cx="280" cy="140" r="4" fill="#0f172a"/>
  <circle cx="120" cy="240" r="4" fill="#0f172a"/>
  <circle cx="160" cy="270" r="4" fill="#0f172a"/>
  <circle cx="310" cy="270" r="4" fill="#0f172a"/>
  <circle cx="380" cy="200" r="4" fill="#0f172a"/>
  <text x="250" y="130" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2563eb">잘린 단면</text>
</svg>