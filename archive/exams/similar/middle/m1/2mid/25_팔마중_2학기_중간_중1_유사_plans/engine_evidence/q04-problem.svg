<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 360" width="500" height="360" role="img" aria-labelledby="q04-title q04-desc">
  <title id="q04-title">선분 AB의 수직이등분선 l과 점 P</title>
  <desc id="q04-desc">선분 AB의 수직이등분선 l이 선분과 만나는 점 M과 직선 l 위의 점 P의 위치 관계</desc>
  <rect width="500" height="360" fill="#ffffff"/>
  <!-- Line segment AB -->
  <line x1="80" y1="260" x2="420" y2="260" stroke="#0f172a" stroke-width="2.5"/>
  <!-- Line l (vertical bisector) -->
  <line x1="250" y1="50" x2="250" y2="320" stroke="#0f172a" stroke-width="2"/>
  <text x="265" y="65" font-family="sans-serif" font-size="16" font-style="italic" fill="#0f172a">l</text>
  <!-- Right angle mark at M -->
  <path d="M 250,240 L 270,240 L 270,260" fill="none" stroke="#dc2626" stroke-width="2"/>
  <!-- Segment PM -->
  <line x1="250" y1="110" x2="250" y2="260" stroke="#2563eb" stroke-width="3"/>
  <!-- Points -->
  <circle cx="80" cy="260" r="5" fill="#0f172a"/>
  <circle cx="420" cy="260" r="5" fill="#0f172a"/>
  <circle cx="250" cy="260" r="5" fill="#0f172a"/>
  <circle cx="250" cy="110" r="5" fill="#2563eb"/>
  <!-- Equal tick marks on AM and BM -->
  <line x1="160" y1="253" x2="160" y2="267" stroke="#0f172a" stroke-width="2"/>
  <line x1="165" y1="253" x2="165" y2="267" stroke="#0f172a" stroke-width="2"/>
  <line x1="335" y1="253" x2="335" y2="267" stroke="#0f172a" stroke-width="2"/>
  <line x1="340" y1="253" x2="340" y2="267" stroke="#0f172a" stroke-width="2"/>
  <!-- Labels -->
  <g font-family="sans-serif" font-size="16" font-weight="bold" fill="#0f172a">
    <text x="65" y="285">A</text>
    <text x="425" y="285">B</text>
    <text x="235" y="285">M</text>
    <text x="265" y="115">P</text>
  </g>
</svg>
