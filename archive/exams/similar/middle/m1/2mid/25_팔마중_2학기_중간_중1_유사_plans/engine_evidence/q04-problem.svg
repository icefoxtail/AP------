<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" width="480" height="300" role="img" aria-labelledby="q04-title q04-desc">
  <title id="q04-title">수직이등분선과 점의 위치</title>
  <desc id="q04-desc">선분 AB의 수직이등분선 l과 그 위의 점 P, 교점 M</desc>
  <rect width="480" height="300" fill="#ffffff"/>
  <!-- 선분 AB -->
  <line x1="80" y1="200" x2="400" y2="200" stroke="#1e293b" stroke-width="2.5"/>
  <!-- 수직이등분선 l -->
  <line x1="240" y1="40" x2="240" y2="260" stroke="#1e293b" stroke-width="2.5"/>
  <!-- 직각 표시 -->
  <path d="M 240,185 L 255,185 L 255,200" fill="none" stroke="#dc2626" stroke-width="2"/>
  <!-- 점 P, A, B, M -->
  <circle cx="80" cy="200" r="4.5" fill="#1e293b"/>
  <circle cx="400" cy="200" r="4.5" fill="#1e293b"/>
  <circle cx="240" cy="200" r="4.5" fill="#1e293b"/>
  <circle cx="240" cy="100" r="4.5" fill="#2563eb"/>
  <!-- 점선 PA, PB -->
  <line x1="240" y1="100" x2="80" y2="200" stroke="#64748b" stroke-width="1.8" stroke-dasharray="4,4"/>
  <line x1="240" y1="100" x2="400" y2="200" stroke="#64748b" stroke-width="1.8" stroke-dasharray="4,4"/>
  <!-- 라벨 -->
  <g font-family="sans-serif" font-size="16" font-weight="bold" fill="#0f172a" text-anchor="middle">
    <text x="65" y="215">A</text>
    <text x="415" y="215">B</text>
    <text x="255" y="220">M</text>
    <text x="255" y="100" fill="#2563eb">P</text>
    <text x="255" y="55">l</text>
  </g>
</svg>