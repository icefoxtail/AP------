<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 280" width="540" height="280" role="img" aria-labelledby="q12-title q12-desc">
  <title id="q12-title">두 삼각형 ABC와 DEF의 합동 조건</title>
  <desc id="q12-desc">변 AB=DE이고 각 B=E인 두 삼각형 ABC와 DEF의 합동 다이어그램</desc>
  <rect width="540" height="280" fill="#ffffff"/>
  <!-- Triangle ABC -->
  <polygon points="80,210 220,210 160,80" fill="#f8fafc" stroke="#0f172a" stroke-width="2.5"/>
  <line x1="80" y1="210" x2="160" y2="80" stroke="#2563eb" stroke-width="4"/>
  <!-- Angle B mark -->
  <path d="M 105,210 A 25 25 0 0 0 93,189" fill="none" stroke="#dc2626" stroke-width="2"/>
  <!-- Triangle DEF -->
  <polygon points="320,210 460,210 400,80" fill="#f8fafc" stroke="#0f172a" stroke-width="2.5"/>
  <line x1="320" y1="210" x2="400" y2="80" stroke="#2563eb" stroke-width="4"/>
  <!-- Angle E mark -->
  <path d="M 345,210 A 25 25 0 0 0 333,189" fill="none" stroke="#dc2626" stroke-width="2"/>
  <!-- Labels -->
  <g font-family="sans-serif" font-size="16" font-weight="bold" fill="#0f172a" text-anchor="middle">
    <text x="160" y="65">A</text>
    <text x="65" y="225">B</text>
    <text x="235" y="225">C</text>
    <text x="400" y="65">D</text>
    <text x="305" y="225">E</text>
    <text x="475" y="225">F</text>
  </g>
</svg>