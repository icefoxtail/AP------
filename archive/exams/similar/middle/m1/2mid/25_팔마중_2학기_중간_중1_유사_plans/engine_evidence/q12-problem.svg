<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 260" width="480" height="260" role="img" aria-labelledby="q12-title q12-desc">
  <title id="q12-title">삼각형의 합동 조건</title>
  <desc id="q12-desc">삼각형 ABC와 DEF에서 AB=DE, 각 B=각 E가 주어진 다이어그램</desc>
  <rect width="480" height="260" fill="#ffffff"/>
  <!-- 삼각형 ABC: A(100,60), B(50,200), C(210,200) -->
  <polygon points="100,60 50,200 210,200" fill="none" stroke="#1e293b" stroke-width="2.5"/>
  <!-- 변 AB 틱 마크 -->
  <line x1="70" y1="130" x2="80" y2="133" stroke="#dc2626" stroke-width="2.5"/>
  <!-- 각 B 호 -->
  <path d="M 75,190 A 30,30 0 0,0 65,160" fill="none" stroke="#2563eb" stroke-width="2.5"/>
  <!-- 삼각형 DEF: D(340,60), E(290,200), F(450,200) -->
  <polygon points="340,60 290,200 450,200" fill="none" stroke="#1e293b" stroke-width="2.5"/>
  <!-- 변 DE 틱 마크 -->
  <line x1="310" y1="130" x2="320" y2="133" stroke="#dc2626" stroke-width="2.5"/>
  <!-- 각 E 호 -->
  <path d="M 315,190 A 30,30 0 0,0 305,160" fill="none" stroke="#2563eb" stroke-width="2.5"/>
  <!-- 라벨 -->
  <g font-family="sans-serif" font-size="16" font-weight="bold" fill="#0f172a" text-anchor="middle">
    <text x="100" y="45">A</text>
    <text x="40" y="220">B</text>
    <text x="220" y="220">C</text>
    <text x="340" y="45">D</text>
    <text x="280" y="220">E</text>
    <text x="460" y="220">F</text>
  </g>
</svg>