<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 280" width="480" height="280" role="img" aria-labelledby="q15-title q15-desc">
  <title id="q15-title">맞꼭지각 형태의 다각형 각</title>
  <desc id="q15-desc">점 O에서 맞꼭지각을 이루는 두 삼각형과 각 a, b, c, d</desc>
  <rect width="480" height="280" fill="#ffffff"/>
  <!-- 모래시계 형태 선분들: (80,60) -> (400,220), (80,220) -> (400,60), 교점 O(240,140) -->
  <line x1="80" y1="60" x2="400" y2="220" stroke="#1e293b" stroke-width="2.5"/>
  <line x1="80" y1="220" x2="400" y2="60" stroke="#1e293b" stroke-width="2.5"/>
  <line x1="80" y1="60" x2="80" y2="220" stroke="#1e293b" stroke-width="2.5"/>
  <line x1="400" y1="60" x2="400" y2="220" stroke="#1e293b" stroke-width="2.5"/>
  <circle cx="240" cy="140" r="4.5" fill="#1e293b"/>
  <!-- 점 O에서의 55° 각 호 -->
  <path d="M 213,126.5 A 30,30 0 0,0 213,153.5" fill="none" stroke="#2563eb" stroke-width="1.8"/>
  <path d="M 267,126.5 A 30,30 0 0,1 267,153.5" fill="none" stroke="#2563eb" stroke-width="1.8"/>
  <text x="185" y="145" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="middle">55°</text>
  <!-- 각 표시 -->
  <text x="105" y="85" font-family="sans-serif" font-size="15" font-weight="bold" fill="#dc2626">a</text>
  <text x="105" y="205" font-family="sans-serif" font-size="15" font-weight="bold" fill="#dc2626">b</text>
  <text x="375" y="85" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2563eb">c</text>
  <text x="375" y="205" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2563eb">d</text>
  <text x="240" y="165" font-family="sans-serif" font-size="16" font-weight="bold" fill="#0f172a" text-anchor="middle">O</text>
</svg>
