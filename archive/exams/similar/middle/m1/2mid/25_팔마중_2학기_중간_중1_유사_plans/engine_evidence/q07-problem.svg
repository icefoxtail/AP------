<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" width="480" height="320" role="img" aria-labelledby="q07-title q07-desc">
  <title id="q07-title">정육면체 전개도</title>
  <desc id="q07-desc">정육면체의 십자형 전개도와 모서리 AB 표시</desc>
  <rect width="480" height="320" fill="#ffffff"/>
  <!-- 6개의 정사각형 면 -->
  <rect x="180" y="50" width="60" height="60" fill="none" stroke="#1e293b" stroke-width="2"/>
  <rect x="120" y="110" width="60" height="60" fill="none" stroke="#1e293b" stroke-width="2"/>
  <rect x="180" y="110" width="60" height="60" fill="none" stroke="#1e293b" stroke-width="2"/>
  <rect x="240" y="110" width="60" height="60" fill="none" stroke="#1e293b" stroke-width="2"/>
  <rect x="300" y="110" width="60" height="60" fill="none" stroke="#1e293b" stroke-width="2"/>
  <rect x="180" y="170" width="60" height="60" fill="none" stroke="#1e293b" stroke-width="2"/>
  <!-- 강조된 모서리 AB -->
  <line x1="180" y1="50" x2="240" y2="50" stroke="#dc2626" stroke-width="4"/>
  <circle cx="180" cy="50" r="4.5" fill="#dc2626"/>
  <circle cx="240" cy="50" r="4.5" fill="#dc2626"/>
  <g font-family="sans-serif" font-size="16" font-weight="bold" fill="#dc2626" text-anchor="middle">
    <text x="175" y="40">A</text>
    <text x="245" y="40">B</text>
  </g>
</svg>