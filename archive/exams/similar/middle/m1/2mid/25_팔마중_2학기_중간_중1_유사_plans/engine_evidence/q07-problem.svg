<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="500" height="400" role="img" aria-labelledby="q07-title q07-desc">
  <title id="q07-title">정육면체와 모서리 AB</title>
  <desc id="q07-desc">정육면체 ABCD-EFGH에서 모서리 AB와 다른 모서리들의 위치 관계 다이어그램</desc>
  <rect width="500" height="400" fill="#ffffff"/>
  <!-- Hidden dashed edges -->
  <line x1="140" y1="280" x2="140" y2="140" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="140" y1="280" x2="280" y2="280" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="140" y1="280" x2="80" y2="340" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4"/>
  <!-- Front face -->
  <polygon points="80,200 220,200 220,340 80,340" fill="none" stroke="#0f172a" stroke-width="2"/>
  <!-- Top face -->
  <polygon points="80,200 140,140 280,140 220,200" fill="none" stroke="#0f172a" stroke-width="2"/>
  <!-- Right face -->
  <polygon points="220,200 280,140 280,280 220,340" fill="none" stroke="#0f172a" stroke-width="2"/>
  <!-- Highlight segment AB -->
  <line x1="80" y1="200" x2="220" y2="200" stroke="#2563eb" stroke-width="4"/>
  <!-- Vertices -->
  <circle cx="80" cy="200" r="5" fill="#2563eb"/>
  <circle cx="220" cy="200" r="5" fill="#2563eb"/>
  <circle cx="280" cy="140" r="4" fill="#0f172a"/>
  <circle cx="140" cy="140" r="4" fill="#0f172a"/>
  <circle cx="80" cy="340" r="4" fill="#0f172a"/>
  <circle cx="220" cy="340" r="4" fill="#0f172a"/>
  <circle cx="280" cy="280" r="4" fill="#0f172a"/>
  <circle cx="140" cy="280" r="4" fill="#0f172a"/>
  <!-- Labels -->
  <g font-family="sans-serif" font-size="16" font-weight="bold" fill="#0f172a" text-anchor="middle">
    <text x="65" y="195" fill="#2563eb">A</text>
    <text x="235" y="195" fill="#2563eb">B</text>
    <text x="295" y="135">C</text>
    <text x="125" y="135">D</text>
    <text x="65" y="355">E</text>
    <text x="235" y="355">F</text>
    <text x="295" y="295">G</text>
    <text x="125" y="295">H</text>
  </g>
</svg>