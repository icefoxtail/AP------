<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 280" width="360" height="280" role="img" aria-labelledby="q23-title q23-desc">
  <title id="q23-title">정사각형 내부 삼각형의 합동</title>
  <desc id="q23-desc">정사각형 ABCD에서 BE=CF일 때 선분 AE와 BF의 교점 G</desc>
  <rect width="360" height="280" fill="#ffffff"/>
  <polygon points="60,40 260,40 260,240 60,240" fill="none" stroke="#222222" stroke-width="2"/>
  <text x="45" y="40" font-family="sans-serif" font-size="15" font-weight="bold" fill="#111111">A</text>
  <text x="45" y="250" font-family="sans-serif" font-size="15" font-weight="bold" fill="#111111">B</text>
  <text x="275" y="250" font-family="sans-serif" font-size="15" font-weight="bold" fill="#111111">C</text>
  <text x="275" y="40" font-family="sans-serif" font-size="15" font-weight="bold" fill="#111111">D</text>
  <circle cx="140" cy="240" r="3.5" fill="#222222"/>
  <text x="140" y="260" font-family="sans-serif" font-size="14" font-weight="bold" fill="#111111" text-anchor="middle">E</text>
  <circle cx="260" cy="160" r="3.5" fill="#222222"/>
  <text x="275" y="165" font-family="sans-serif" font-size="14" font-weight="bold" fill="#111111">F</text>
  <line x1="60" y1="40" x2="140" y2="240" stroke="#2563eb" stroke-width="2"/>
  <line x1="60" y1="240" x2="260" y2="160" stroke="#dc2626" stroke-width="2"/>
  <circle cx="115.4" cy="178.5" r="4" fill="#111111"/>
  <text x="100" y="175" font-family="sans-serif" font-size="14" font-weight="bold" fill="#111111">G</text>
</svg>