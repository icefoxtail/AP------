<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 220" width="380" height="220" role="img" aria-labelledby="q07-title q07-desc">
  <title id="q07-title">사다리꼴과 수선</title>
  <desc id="q07-desc">사다리꼴 ABCD에서 점 D에서 변 BC에 내린 수선 DH와 수선의 발 H</desc>
  <rect width="380" height="220" fill="#ffffff"/>
  <polygon points="100,50 220,50 300,170 100,170" fill="none" stroke="#222222" stroke-width="2"/>
  <polyline points="100,155 115,155 115,170" fill="none" stroke="#222222" stroke-width="1.5"/>
  <text x="85" y="45" font-family="sans-serif" font-size="15" font-weight="bold" fill="#111111">A</text>
  <text x="85" y="180" font-family="sans-serif" font-size="15" font-weight="bold" fill="#111111">B</text>
  <text x="315" y="180" font-family="sans-serif" font-size="15" font-weight="bold" fill="#111111">C</text>
  <text x="220" y="40" font-family="sans-serif" font-size="15" font-weight="bold" fill="#111111">D</text>
  <line x1="220" y1="50" x2="220" y2="170" stroke="#888888" stroke-width="1.5" stroke-dasharray="4,4"/>
  <polyline points="220,155 205,155 205,170" fill="none" stroke="#888888" stroke-width="1.5"/>
  <text x="220" y="190" font-family="sans-serif" font-size="13" fill="#666666" text-anchor="middle">H</text>
</svg>