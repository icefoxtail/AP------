<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 240" width="380" height="240" role="img" aria-labelledby="q17-title q17-desc">
  <title id="q17-title">세 직선이 이루는 각</title>
  <desc id="q17-desc">한 점 O에서 교차하는 세 직선과 맞꼭지각을 이용한 각 x의 계산</desc>
  <rect width="380" height="240" fill="#ffffff"/>
  <line x1="50" y1="120" x2="330" y2="120" stroke="#222222" stroke-width="2"/>
  <line x1="80" y1="50" x2="300" y2="190" stroke="#222222" stroke-width="2"/>
  <line x1="100" y1="200" x2="280" y2="40" stroke="#222222" stroke-width="2"/>
  <circle cx="190" cy="120" r="4" fill="#222222"/>
  <text x="195" y="140" font-family="sans-serif" font-size="15" font-weight="bold" fill="#111111">O</text>
  <text x="120" y="85" font-family="sans-serif" font-size="13" fill="#222222">2x+15°</text>
  <text x="185" y="175" font-family="sans-serif" font-size="13" fill="#222222">55°</text>
  <text x="240" y="95" font-family="sans-serif" font-size="13" fill="#222222">x+20°</text>
</svg>