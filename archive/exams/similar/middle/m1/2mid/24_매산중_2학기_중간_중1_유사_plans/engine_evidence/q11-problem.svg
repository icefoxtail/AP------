<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 240" width="420" height="240" role="img" aria-labelledby="q11-title q11-desc">
  <title id="q11-title">평행선과 각의 위치</title>
  <desc id="q11-desc">평행한 두 직선 l, m과 한 직선이 만날 때 생기는 8개의 각 a부터 h</desc>
  <rect width="420" height="240" fill="#ffffff"/>
  <line x1="30" y1="70" x2="380" y2="70" stroke="#222222" stroke-width="2"/>
  <text x="395" y="75" font-family="sans-serif" font-size="16" font-style="italic" fill="#111111">l</text>
  <line x1="30" y1="160" x2="380" y2="160" stroke="#222222" stroke-width="2"/>
  <text x="395" y="165" font-family="sans-serif" font-size="16" font-style="italic" fill="#111111">m</text>
  <line x1="100" y1="20" x2="280" y2="210" stroke="#222222" stroke-width="2"/>
  <text x="130" y="55" font-family="sans-serif" font-size="14" fill="#111111">a</text>
  <text x="165" y="55" font-family="sans-serif" font-size="14" fill="#111111">b</text>
  <text x="125" y="95" font-family="sans-serif" font-size="14" fill="#111111">d</text>
  <text x="160" y="95" font-family="sans-serif" font-size="14" fill="#111111">c</text>
  <text x="215" y="145" font-family="sans-serif" font-size="14" fill="#111111">e</text>
  <text x="250" y="145" font-family="sans-serif" font-size="14" fill="#111111">f</text>
  <text x="210" y="185" font-family="sans-serif" font-size="14" fill="#111111">h</text>
  <text x="245" y="185" font-family="sans-serif" font-size="14" fill="#111111">g</text>
</svg>