<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 260" width="360" height="260" role="img" aria-labelledby="q21-title q21-desc">
  <title id="q21-title">삼각기둥의 모서리 관계</title>
  <desc id="q21-desc">삼각기둥 ABC-DEF에서 모서리 BC와 만나면서 AD와 평행한 모서리 탐색</desc>
  <rect width="360" height="260" fill="#ffffff"/>
  <polygon points="120,40 260,60 180,100" fill="none" stroke="#222222" stroke-width="2"/>
  <text x="110" y="35" font-family="sans-serif" font-size="15" font-weight="bold" fill="#111111" text-anchor="middle">A</text>
  <text x="275" y="60" font-family="sans-serif" font-size="15" font-weight="bold" fill="#111111" text-anchor="middle">B</text>
  <text x="180" y="120" font-family="sans-serif" font-size="15" font-weight="bold" fill="#111111" text-anchor="middle">C</text>
  <line x1="120" y1="180" x2="260" y2="200" stroke="#888888" stroke-width="2" stroke-dasharray="4,4"/>
  <line x1="260" y1="200" x2="180" y2="240" stroke="#222222" stroke-width="2"/>
  <line x1="180" y1="240" x2="120" y2="180" stroke="#222222" stroke-width="2"/>
  <text x="110" y="185" font-family="sans-serif" font-size="15" font-weight="bold" fill="#111111" text-anchor="middle">D</text>
  <text x="275" y="205" font-family="sans-serif" font-size="15" font-weight="bold" fill="#111111" text-anchor="middle">E</text>
  <text x="180" y="258" font-family="sans-serif" font-size="15" font-weight="bold" fill="#111111" text-anchor="middle">F</text>
  <line x1="120" y1="40" x2="120" y2="180" stroke="#222222" stroke-width="2"/>
  <line x1="260" y1="60" x2="260" y2="200" stroke="#222222" stroke-width="2"/>
  <line x1="180" y1="100" x2="180" y2="240" stroke="#222222" stroke-width="2"/>
  <circle cx="120" cy="40" r="3.5" fill="#222222"/>
  <circle cx="260" cy="60" r="3.5" fill="#222222"/>
  <circle cx="180" cy="100" r="3.5" fill="#222222"/>
  <circle cx="120" cy="180" r="3.5" fill="#222222"/>
  <circle cx="260" cy="200" r="3.5" fill="#222222"/>
  <circle cx="180" cy="240" r="3.5" fill="#222222"/>
</svg>