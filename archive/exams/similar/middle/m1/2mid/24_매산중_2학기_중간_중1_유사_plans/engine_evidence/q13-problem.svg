<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 200" width="380" height="200" role="img" aria-labelledby="q13-title q13-desc">
  <title id="q13-title">삼각형 결정 조건</title>
  <desc id="q13-desc">선분 BC의 길이가 6cm로 주어진 상태에서 삼각형 ABC를 작도하는 다이어그램</desc>
  <rect width="380" height="200" fill="#ffffff"/>
  <polygon points="170,40 60,150 300,150" fill="none" stroke="#888888" stroke-width="1.8" stroke-dasharray="4,4"/>
  <line x1="60" y1="150" x2="300" y2="150" stroke="#222222" stroke-width="2.5"/>
  <circle cx="170" cy="40" r="4" fill="#888888"/>
  <text x="170" y="28" font-family="sans-serif" font-size="15" font-weight="bold" fill="#111111" text-anchor="middle">A</text>
  <circle cx="60" cy="150" r="4" fill="#222222"/>
  <text x="45" y="160" font-family="sans-serif" font-size="15" font-weight="bold" fill="#111111">B</text>
  <circle cx="300" cy="150" r="4" fill="#222222"/>
  <text x="315" y="160" font-family="sans-serif" font-size="15" font-weight="bold" fill="#111111">C</text>
  <text x="180" y="175" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">6 cm</text>
</svg>