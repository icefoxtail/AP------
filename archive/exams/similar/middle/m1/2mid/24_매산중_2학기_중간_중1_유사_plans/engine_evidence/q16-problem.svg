  <line x1="300" y1="180" x2="190" y2="70" stroke="#2563eb" stroke-width="1.8"/>
  <line x1="130" y1="174" x2="130" y2="186" stroke="#222222" stroke-width="1.5"/>
  <line x1="135" y1="174" x2="135" y2="186" stroke="#222222" stroke-width="1.5"/>
  <line x1="240" y1="174" x2="240" y2="186" stroke="#222222" stroke-width="1.5"/>
  <line x1="245" y1="174" x2="245" y2="186" stroke="#222222" stroke-width="1.5"/>
