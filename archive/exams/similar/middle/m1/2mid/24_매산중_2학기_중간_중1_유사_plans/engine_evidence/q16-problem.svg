<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 240" width="380" height="240" role="img" aria-labelledby="q16-title q16-desc">
  <title id="q16-title">선분의 수직이등분선</title>
  <desc id="q16-desc">선분 AB의 수직이등분선 l 위의 점 P와 삼각형 PAM, PBM의 합동</desc>
  <rect width="380" height="240" fill="#ffffff"/>
  <line x1="60" y1="180" x2="320" y2="180" stroke="#222222" stroke-width="2"/>
  <circle cx="80" cy="180" r="4" fill="#222222"/>
  <text x="70" y="205" font-family="sans-serif" font-size="15" font-weight="bold" fill="#111111">A</text>
  <circle cx="300" cy="180" r="4" fill="#222222"/>
  <text x="310" y="205" font-family="sans-serif" font-size="15" font-weight="bold" fill="#111111">B</text>
  <line x1="190" y1="30" x2="190" y2="210" stroke="#222222" stroke-width="2"/>
  <text x="205" y="40" font-family="sans-serif" font-size="16" font-style="italic" fill="#111111">l</text>
  <circle cx="190" cy="180" r="3.5" fill="#222222"/>
  <text x="195" y="205" font-family="sans-serif" font-size="14" font-weight="bold" fill="#111111">M</text>
  <polyline points="190,165 175,165 175,180" fill="none" stroke="#222222" stroke-width="1.5"/>
  <circle cx="190" cy="70" r="4" fill="#222222"/>
  <text x="205" y="75" font-family="sans-serif" font-size="15" font-weight="bold" fill="#111111">P</text>
