<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 200" width="420" height="200" role="img" aria-labelledby="q14-title q14-desc">
  <title id="q14-title">종이접기와 각도</title>
  <desc id="q14-desc">직사각형 테이프를 접었을 때 생기는 엇각과 각 x를 나타낸 다이어그램</desc>
  <rect width="420" height="200" fill="#ffffff"/>
  <line x1="30" y1="50" x2="390" y2="50" stroke="#222222" stroke-width="2"/>
  <line x1="30" y1="150" x2="390" y2="150" stroke="#222222" stroke-width="2"/>
  <line x1="140" y1="50" x2="230" y2="150" stroke="#2563eb" stroke-width="2"/>
  <polygon points="140,50 230,150 280,50" fill="#f1f5f9" stroke="#222222" stroke-width="1.8"/>
  <line x1="280" y1="50" x2="350" y2="150" stroke="#222222" stroke-width="1.8"/>
  <text x="180" y="80" font-family="sans-serif" font-size="13" fill="#222222">55°</text>
  <text x="255" y="75" font-family="sans-serif" font-size="15" font-weight="bold" fill="#dc2626">x</text>
</svg>