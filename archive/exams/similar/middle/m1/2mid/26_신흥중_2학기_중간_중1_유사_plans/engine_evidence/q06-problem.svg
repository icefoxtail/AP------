<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 320" width="360" height="320" role="img" aria-labelledby="q06-title q06-desc">
  <title id="q06-title">원 O와 두 부채꼴의 호의 길이</title>
  <desc id="q06-desc">원 O에서 중심각 40도에 대응하는 호 4 cm와 중심각 120도에 대응하는 호 x cm</desc>
  <rect width="360" height="320" fill="#ffffff"/>
  <circle cx="180" cy="160" r="110" fill="none" stroke="#222222" stroke-width="2"/>
  <path d="M 180 160 L 283 122 A 110 110 0 0 1 257 239 Z" fill="#e8f4fd" stroke="#0056b3" stroke-width="1.5"/>
  <path d="M 180 160 L 85 105 A 110 110 0 0 0 180 270 Z" fill="#fff3cd" stroke="#856404" stroke-width="1.5"/>
  <circle cx="180" cy="160" r="3.5" fill="#111"/>
  <g font-family="sans-serif" font-size="13" font-weight="bold" fill="#111111">
    <text x="185" y="155">O</text>
    <text x="205" y="175">40°</text>
    <text x="135" y="180">120°</text>
    <text x="285" y="190" fill="#0056b3">4 cm</text>
    <text x="100" y="225" fill="#856404">x cm</text>
  </g>
</svg>