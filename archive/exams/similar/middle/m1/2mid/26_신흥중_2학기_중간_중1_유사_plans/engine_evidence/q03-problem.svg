<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 260" width="380" height="260" role="img" aria-labelledby="q03-title q03-desc">
  <title id="q03-title">사다리꼴 ABCD와 대각선</title>
  <desc id="q03-desc">AD와 BC가 평행하고 AB와 BC가 수직인 사다리꼴 ABCD와 두 대각선 AC, BD</desc>
  <rect width="380" height="260" fill="#ffffff"/>
  <polygon points="80,70 230,70 310,200 80,200" fill="#f8f9fa" stroke="#222222" stroke-width="2"/>
  <line x1="80" y1="70" x2="310" y2="200" stroke="#0056b3" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="80" y1="200" x2="230" y2="70" stroke="#0056b3" stroke-width="1.5" stroke-dasharray="4,4"/>
  <polyline points="80,185 95,185 95,200" fill="none" stroke="#222222" stroke-width="1.5"/>
  <polyline points="80,85 95,85 95,70" fill="none" stroke="#222222" stroke-width="1.5"/>
  <g font-family="sans-serif" font-size="15" font-weight="bold" fill="#111111">
    <text x="62" y="68">A</text>
    <text x="62" y="215">B</text>
    <text x="318" y="215">C</text>
    <text x="235" y="68">D</text>
  </g>
</svg>