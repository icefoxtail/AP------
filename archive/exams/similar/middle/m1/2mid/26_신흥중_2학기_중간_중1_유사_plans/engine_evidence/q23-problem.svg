<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" width="360" height="360" role="img" aria-labelledby="q23-title q23-desc">
  <title id="q23-title">정사각형 내부 두 사분원의 색칠한 부분</title>
  <desc id="q23-desc">한 변이 6 cm인 정사각형 ABCD에서 두 사분원이 겹쳐서 만들어진 잎 모양의 색칠한 부분</desc>
  <rect width="360" height="360" fill="#ffffff"/>
  <rect x="60" y="60" width="240" height="240" fill="none" stroke="#222222" stroke-width="2"/>
  <!-- Shaded lens with non-white fill -->
  <path d="M 60 60 A 240 240 0 0 1 300 300 A 240 240 0 0 1 60 60 Z" fill="#b8daff" stroke="#0056b3" stroke-width="2.2"/>
  <g font-family="sans-serif" font-size="15" font-weight="bold" fill="#111111">
    <text x="45" y="55">A</text>
    <text x="45" y="315">B</text>
    <text x="308" y="315">C</text>
    <text x="308" y="55">D</text>
    <text x="165" y="325" fill="#333">6 cm</text>
  </g>
</svg>