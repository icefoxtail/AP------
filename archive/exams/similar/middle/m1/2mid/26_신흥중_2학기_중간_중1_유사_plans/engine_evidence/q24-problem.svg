<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 340" width="380" height="340" role="img" aria-labelledby="q24-title q24-desc">
  <title id="q24-title">정삼각형 ABC와 두 선분의 교점 P</title>
  <desc id="q24-desc">정삼각형 ABC에서 BD=CE이고 선분 AD와 BE의 교점이 P인 모습</desc>
  <rect width="380" height="340" fill="#ffffff"/>
  <polygon points="190,40 60,265 320,265" fill="#f8f9fa" stroke="#222222" stroke-width="2"/>
  <line x1="190" y1="40" x2="140" y2="265" stroke="#d9534f" stroke-width="2"/>
  <line x1="60" y1="265" x2="280" y2="190" stroke="#0056b3" stroke-width="2"/>
  <circle cx="165" cy="210" r="4.5" fill="#28a745"/>
  <circle cx="140" cy="265" r="3.5" fill="#111"/>
  <circle cx="280" cy="190" r="3.5" fill="#111"/>
  <g font-family="sans-serif" font-size="14" font-weight="bold" fill="#111111">
    <text x="185" y="30">A</text>
    <text x="45" y="275">B</text>
    <text x="328" y="275">C</text>
    <text x="135" y="285">D</text>
    <text x="290" y="195">E</text>
