<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" width="400" height="280" role="img" aria-labelledby="q16-title q16-desc">
  <title id="q16-title">반원과 이등변삼각형 ABC 및 부채꼴 DOE</title>
  <desc id="q16-desc">지름 BC가 12 cm인 반원 O에서 각 A가 40도인 이등변삼각형 ABC와 부채꼴 DOE</desc>
  <rect width="400" height="280" fill="#ffffff"/>
  <path d="M 60 230 A 140 140 0 0 1 340 230 Z" fill="#f8f9fa" stroke="#222222" stroke-width="2"/>
  <path d="M 200 230 L 93 140 A 140 140 0 0 1 307 140 Z" fill="#e8f4fd" stroke="#0275d8" stroke-width="1.8"/>
  <line x1="60" y1="230" x2="200" y2="38" stroke="#222222" stroke-width="2"/>
  <line x1="340" y1="230" x2="200" y2="38" stroke="#222222" stroke-width="2"/>
  <circle cx="200" cy="230" r="3.5" fill="#111"/>
  <circle cx="93" cy="140" r="3.5" fill="#0275d8"/>
  <circle cx="307" cy="140" r="3.5" fill="#0275d8"/>
  <g font-family="sans-serif" font-size="14" font-weight="bold" fill="#111111">
    <text x="195" y="30">A</text>
    <text x="45" y="238">B</text>
    <text x="348" y="238">C</text>
    <text x="75" y="135">D</text>
    <text x="315" y="135">E</text>
    <text x="195" y="250">O</text>
  </g>
</svg>