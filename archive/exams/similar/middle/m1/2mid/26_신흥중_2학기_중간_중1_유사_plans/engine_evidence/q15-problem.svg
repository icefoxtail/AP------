<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 240" width="420" height="240" role="img" aria-labelledby="q15-title q15-desc">
  <title id="q15-title">지름 AB인 반원 위의 점 C, D와 평행선</title>
  <desc id="q15-desc">반원 O에서 OC와 BD가 평행하고 호 AC와 BD의 비가 2대 5인 그림</desc>
  <rect width="420" height="240" fill="#ffffff"/>
  <path d="M 50 190 A 160 160 0 0 1 370 190 Z" fill="#f8f9fa" stroke="#222222" stroke-width="2"/>
  <line x1="210" y1="190" x2="87" y2="87" stroke="#0056b3" stroke-width="2"/>
  <line x1="370" y1="190" x2="238" y2="32" stroke="#0056b3" stroke-width="2"/>
  <line x1="210" y1="190" x2="238" y2="32" stroke="#888888" stroke-width="1.5" stroke-dasharray="3,3"/>
  <circle cx="210" cy="190" r="4" fill="#111"/>
  <circle cx="87" cy="87" r="4" fill="#0056b3"/>
  <circle cx="238" cy="32" r="4" fill="#0056b3"/>
  <g font-family="sans-serif" font-size="14" font-weight="bold" fill="#111111">
    <text x="35" y="200">A</text>
    <text x="205" y="210">O</text>
    <text x="375" y="200">B</text>
    <text x="75" y="80">C</text>
    <text x="240" y="25">D</text>
  </g>
</svg>