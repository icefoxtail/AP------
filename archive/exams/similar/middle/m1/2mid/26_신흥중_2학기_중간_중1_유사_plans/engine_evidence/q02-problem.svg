<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 260" width="420" height="260" role="img" aria-labelledby="q02-title q02-desc">
  <title id="q02-title">평행선과 횡단선의 각</title>
  <desc id="q02-desc">두 평행선 l, m과 두 횡단선이 만드는 각 65도, 55도, x, y를 나타낸 그림</desc>
  <rect width="420" height="260" fill="#ffffff"/>
  <line x1="30" y1="80" x2="380" y2="80" stroke="#222222" stroke-width="2"/>
  <line x1="30" y1="190" x2="380" y2="190" stroke="#222222" stroke-width="2"/>
  <line x1="160" y1="40" x2="80" y2="230" stroke="#0056b3" stroke-width="1.8"/>
  <line x1="250" y1="40" x2="330" y2="230" stroke="#0056b3" stroke-width="1.8"/>
  <path d="M 143 80 A 25 25 0 0 1 150 63" fill="none" stroke="#d9534f" stroke-width="1.5"/>
  <path d="M 115 190 A 25 25 0 0 0 105 171" fill="none" stroke="#d9534f" stroke-width="1.5"/>
  <path d="M 270 80 A 25 25 0 0 0 261 63" fill="none" stroke="#28a745" stroke-width="1.5"/>
  <path d="M 305 190 A 25 25 0 0 1 314 171" fill="none" stroke="#28a745" stroke-width="1.5"/>
  <g font-family="sans-serif" font-size="14" font-weight="bold" fill="#111111">
    <text x="390" y="85">l</text>
    <text x="390" y="195">m</text>
    <text x="165" y="65">65°</text>
    <text x="110" y="175">x</text>
    <text x="235" y="65">55°</text>
    <text x="320" y="175">y</text>
  </g>
</svg>