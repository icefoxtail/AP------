<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 260" width="460" height="260" role="img" aria-labelledby="q15-title q15-desc">
  <title id="q15-title">두 직선과 한 횡단선이 만날 때 생기는 각</title>
  <desc id="q15-desc">두 직선 l, m이 직선 n과 만날 때 생기는 교각과 각 c의 엇각</desc>
  <rect width="460" height="260" fill="#ffffff"/>
  <!-- 직선 l, m -->
  <line x1="40" y1="65" x2="420" y2="65" stroke="#0f172a" stroke-width="2.5"/>
  <line x1="40" y1="195" x2="420" y2="195" stroke="#0f172a" stroke-width="2.5"/>
  <!-- 직선 n (횡단선) -->
  <line x1="120" y1="20" x2="320" y2="240" stroke="#2563eb" stroke-width="2.5"/>
  <!-- 각 호 -->
  <path d="M 135,65 A 25,25 0 0,0 148,95" fill="none" stroke="#e11d48" stroke-width="2"/>
  <path d="M 275,165 A 25,25 0 0,1 305,195" fill="none" stroke="#e11d48" stroke-width="2"/>
  <path d="M 305,195 A 25,25 0 0,1 298,217" fill="none" stroke="#2563eb" stroke-width="1.8"/>
  <!-- 교각들 a, b, c, d, e, f, g, h -->
  <g font-family="sans-serif" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="middle">
    <text x="145" y="55">a</text>
    <text x="180" y="55">b</text>
    <text x="145" y="85" fill="#e11d48">c</text>
    <text x="180" y="85">d</text>
    <text x="260" y="185">e</text>
    <text x="298" y="185" fill="#e11d48">f</text>
    <text x="260" y="215">g</text>
    <text x="325" y="215" fill="#2563eb">65°</text>
  </g>
  <!-- 직선 라벨 l, m, n -->
  <g font-family="sans-serif" font-size="16" font-weight="bold" fill="#0f172a">
    <text x="30" y="70">l</text>
    <text x="30" y="200">m</text>
    <text x="330" y="245" fill="#2563eb">n</text>
  </g>
</svg>
