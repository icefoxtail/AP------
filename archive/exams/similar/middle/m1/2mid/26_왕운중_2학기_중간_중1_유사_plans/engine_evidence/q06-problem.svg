<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 160" width="440" height="160" role="img" aria-labelledby="q06-title q06-desc">
  <title id="q06-title">정비례 관계 표</title>
  <desc id="q06-desc">x와 y가 정비례할 때 x값에 따른 y값의 변화를 나타낸 표</desc>
  <rect width="440" height="160" fill="#ffffff"/>
  <!-- 표 외곽 및 헤더 -->
  <rect x="30" y="30" width="380" height="100" rx="6" fill="#ffffff" stroke="#334155" stroke-width="2"/>
  <line x1="30" y1="80" x2="410" y2="80" stroke="#334155" stroke-width="1.5"/>
  <!-- 세로선들 -->
  <line x1="100" y1="30" x2="100" y2="130" stroke="#334155" stroke-width="1.5"/>
  <line x1="175" y1="30" x2="175" y2="130" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="250" y1="30" x2="250" y2="130" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="325" y1="30" x2="325" y2="130" stroke="#cbd5e1" stroke-width="1"/>
  <!-- 표 헤더 배경 -->
  <rect x="31" y="31" width="68" height="48" fill="#f1f5f9"/>
  <rect x="31" y="81" width="68" height="48" fill="#f1f5f9"/>
  <!-- 텍스트 -->
  <g font-family="sans-serif" font-size="18" font-weight="bold" fill="#0f172a" text-anchor="middle">
    <text x="65" y="62">x</text>
    <text x="65" y="112">y</text>
    <text x="138" y="62">-2</text>
    <text x="138" y="112">-8</text>
    <text x="212" y="62">1</text>
    <text x="212" y="112">4</text>
    <text x="288" y="62">3</text>
    <text x="288" y="112" fill="#2563eb">a</text>
    <text x="368" y="62" fill="#2563eb">b</text>
    <text x="368" y="112">24</text>
  </g>
</svg>