<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 250" width="460" height="250" role="img" aria-labelledby="q12-title q12-desc">
  <title id="q12-title">평행선과 맞꼭지각을 이용한 삼각형의 합동</title>
  <desc id="q12-desc">두 직선 l과 m이 평행하고 두 선분 AB와 CD의 교점이 O일 때 생기는 두 삼각형 AOC와 BOD</desc>
  <rect width="460" height="250" fill="#ffffff"/>
  <!-- 평행선 l, m -->
  <line x1="40" y1="50" x2="420" y2="50" stroke="#0f172a" stroke-width="2.5"/>
  <line x1="40" y1="200" x2="420" y2="200" stroke="#0f172a" stroke-width="2.5"/>
  <!-- 선분 AB, CD 교차 -->
  <!-- A(100,50), B(360,200), C(300,50), D(160,200) -> 교점 O(230,125) -->
  <line x1="100" y1="50" x2="360" y2="200" stroke="#2563eb" stroke-width="2"/>
  <line x1="300" y1="50" x2="160" y2="200" stroke="#b91c1c" stroke-width="2"/>
  <!-- 두 삼각형 밑변 -->
  <line x1="100" y1="50" x2="300" y2="50" stroke="#0f172a" stroke-width="3.5"/>
  <line x1="160" y1="200" x2="360" y2="200" stroke="#0f172a" stroke-width="3.5"/>
  <!-- 점들 -->
  <circle cx="100" cy="50" r="4" fill="#0f172a"/>
  <circle cx="300" cy="50" r="4" fill="#0f172a"/>
  <circle cx="230" cy="125" r="4.5" fill="#111111"/>
  <circle cx="160" cy="200" r="4" fill="#0f172a"/>
  <circle cx="360" cy="200" r="4" fill="#0f172a"/>
  <!-- 레이블 l, m, O, A, B, C, D -->
  <g font-family="sans-serif" font-size="16" font-weight="bold" fill="#0f172a" text-anchor="middle">
    <text x="30" y="55">l</text>
    <text x="30" y="205">m</text>
    <text x="95" y="35">A</text>
    <text x="305" y="35">C</text>
    <text x="245" y="120">O</text>
    <text x="155" y="225">D</text>
    <text x="365" y="225">B</text>
  </g>
</svg>