<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 240" width="540" height="240" role="img" aria-labelledby="q03-title q03-desc">
  <title id="q03-title">합동인 두 삼각형 ABC와 DEF</title>
  <desc id="q03-desc">AB=6cm, BC=8cm, 각 B=65도인 삼각형 ABC와 이에 대응하여 합동인 삼각형 DEF</desc>
  <rect width="540" height="240" fill="#ffffff"/>
  <!-- 삼각형 ABC -->
  <polygon points="60,180 220,180 120,60" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2.5"/>
  <circle cx="120" cy="60" r="4" fill="#1d4ed8"/>
  <circle cx="60" cy="180" r="4" fill="#1d4ed8"/>
  <circle cx="220" cy="180" r="4" fill="#1d4ed8"/>
  <path d="M 85,180 A 25,25 0 0,0 73,155" fill="none" stroke="#e11d48" stroke-width="2"/>
  <!-- 삼각형 DEF -->
  <polygon points="320,180 480,180 380,60" fill="#fef2f2" stroke="#b91c1c" stroke-width="2.5"/>
  <circle cx="380" cy="60" r="4" fill="#b91c1c"/>
  <circle cx="320" cy="180" r="4" fill="#b91c1c"/>
  <circle cx="480" cy="180" r="4" fill="#b91c1c"/>
  <path d="M 345,180 A 25,25 0 0,0 333,155" fill="none" stroke="#e11d48" stroke-width="2"/>
  <!-- 레이블 -->
  <g font-family="sans-serif" font-size="16" font-weight="bold" fill="#111111" text-anchor="middle">
    <text x="120" y="45">A</text>
    <text x="45" y="190">B</text>
    <text x="235" y="190">C</text>
    <text x="380" y="45">D</text>
    <text x="305" y="190">E</text>
    <text x="495" y="190">F</text>
  </g>
  <g font-family="sans-serif" font-size="13" fill="#111111" text-anchor="middle">
    <text x="75" y="115">6 cm</text>
    <text x="140" y="205">8 cm</text>
    <text x="335" y="115">6 cm</text>
    <text x="400" y="205">8 cm</text>
  </g>
  <g font-family="sans-serif" font-size="12" fill="#e11d48" text-anchor="middle">
    <text x="95" y="165">65°</text>
    <text x="355" y="165">65°</text>
  </g>
</svg>