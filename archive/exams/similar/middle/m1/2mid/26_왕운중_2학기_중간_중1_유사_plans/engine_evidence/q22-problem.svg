<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320" width="500" height="320" role="img" aria-labelledby="q22-title q22-desc">
  <title id="q22-title">두 정비례 관계 그래프와 선분의 내분점</title>
  <desc id="q22-desc">두 정비례 함수 y=3/4x와 y=-3/2x의 그래프가 수평선 y=-6과 만나는 두 점 A, B 및 선분 AB 위의 점 K</desc>
  <rect width="500" height="320" fill="#ffffff"/>
  <!-- 좌표축: O(250, 100) -->
  <line x1="40" y1="100" x2="460" y2="100" stroke="#0f172a" stroke-width="2"/>
  <line x1="250" y1="290" x2="250" y2="30" stroke="#0f172a" stroke-width="2"/>
  <polygon points="460,96 470,100 460,104" fill="#0f172a"/>
  <polygon points="246,30 250,20 254,30" fill="#0f172a"/>
  <line x1="50" y1="240" x2="450" y2="240" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="40" y1="280" x2="440" y2="-20" stroke="#2563eb" stroke-width="2.5"/>
  <line x1="190" y1="10" x2="360" y2="280" stroke="#b91c1c" stroke-width="2.5"/>
  <line x1="90" y1="240" x2="330" y2="240" stroke="#0f172a" stroke-width="3.5"/>
  <line x1="170" y1="240" x2="170" y2="100" stroke="#059669" stroke-width="2" stroke-dasharray="3 3"/>
  <circle cx="170" cy="100" r="3.5" fill="#059669"/>
  <circle cx="90" cy="240" r="4.5" fill="#2563eb"/>
  <circle cx="330" cy="240" r="4.5" fill="#b91c1c"/>
  <circle cx="170" cy="240" r="4.5" fill="#059669"/>
  <circle cx="250" cy="100" r="3.5" fill="#0f172a"/>
  <g font-family="sans-serif" font-size="16" font-weight="bold" fill="#0f172a">
    <text x="465" y="120">x</text>
    <text x="230" y="35">y</text>
    <text x="235" y="120">O</text>
    <text x="80" y="260" fill="#2563eb">A</text>
    <text x="340" y="260" fill="#b91c1c">B</text>
    <text x="170" y="265" fill="#059669" text-anchor="middle">K</text>
  </g>
  <g font-family="sans-serif" font-size="14" fill="#475569">
    <text x="30" y="245">-6</text>
    <text x="380" y="45" fill="#2563eb">y=(3/4)x</text>
    <text x="130" y="25" fill="#b91c1c">y=-(3/2)x</text>
  </g>
</svg>