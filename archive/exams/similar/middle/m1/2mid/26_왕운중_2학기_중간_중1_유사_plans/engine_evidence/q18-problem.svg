<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 260" width="460" height="260" role="img" aria-labelledby="q18-title q18-desc">
  <title id="q18-title">학생들이 한 달 동안 읽은 책 수의 도수분포표</title>
  <desc id="q18-desc">30명의 학생들이 한 달 동안 읽은 책의 수와 학생 수를 나타낸 도수분포표</desc>
  <rect width="460" height="260" fill="#ffffff"/>
  <!-- 표 외곽선 -->
  <rect x="40" y="20" width="380" height="220" rx="6" fill="#ffffff" stroke="#334155" stroke-width="2"/>
  <!-- 가로줄들 -->
  <line x1="40" y1="55" x2="420" y2="55" stroke="#334155" stroke-width="2"/>
  <line x1="40" y1="88" x2="420" y2="88" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="40" y1="121" x2="420" y2="121" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="40" y1="154" x2="420" y2="154" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="40" y1="187" x2="420" y2="187" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="40" y1="215" x2="420" y2="215" stroke="#334155" stroke-width="1.5"/>
  <!-- 세로줄 분할 -->
  <line x1="230" y1="20" x2="230" y2="240" stroke="#334155" stroke-width="1.5"/>
  <!-- 헤더 배경 -->
  <rect x="41" y="21" width="188" height="33" fill="#f1f5f9"/>
  <rect x="231" y="21" width="188" height="33" fill="#f1f5f9"/>
  <!-- 텍스트 -->
  <g font-family="sans-serif" font-size="15" text-anchor="middle" fill="#0f172a">
    <text x="135" y="43" font-weight="bold">읽은 책의 수 (권)</text>
    <text x="325" y="43" font-weight="bold">학생 수 (명)</text>
    <text x="135" y="77">1</text>
    <text x="325" y="77">4</text>
    <text x="135" y="110">2</text>
    <text x="325" y="110">6</text>
    <text x="135" y="143" font-weight="bold" fill="#2563eb">3</text>
    <text x="325" y="143" font-weight="bold" fill="#2563eb">11</text>
    <text x="135" y="176">4</text>
    <text x="325" y="176">5</text>
    <text x="135" y="206">5</text>
    <text x="325" y="206">4</text>
    <text x="135" y="233" font-weight="bold">합계</text>
    <text x="325" y="233" font-weight="bold">30</text>
  </g>
</svg>