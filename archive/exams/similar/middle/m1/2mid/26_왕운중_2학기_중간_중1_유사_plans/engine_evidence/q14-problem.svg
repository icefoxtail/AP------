<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 320" width="460" height="320" role="img" aria-labelledby="q14-title q14-desc">
  <title id="q14-title">제1사분면에서 반비례 그래프 아래의 자연수 격자점</title>
  <desc id="q14-desc">원점 O와 x축, y축 및 반비례 함수 y=a/x 곡선 아래쪽에 위치한 자연수 격자점</desc>
  <rect width="460" height="320" fill="#ffffff"/>
  <!-- 좌표축 -->
  <line x1="50" y1="270" x2="420" y2="270" stroke="#0f172a" stroke-width="2"/>
  <line x1="70" y1="290" x2="70" y2="30" stroke="#0f172a" stroke-width="2"/>
  <!-- 화살표 -->
  <polygon points="420,266 430,270 420,274" fill="#0f172a"/>
  <polygon points="66,30 70,20 74,30" fill="#0f172a"/>
  <!-- 모눈 점선 -->
  <g stroke="#e2e8f0" stroke-width="1" stroke-dasharray="2 2">
    <line x1="120" y1="270" x2="120" y2="50"/>
    <line x1="170" y1="270" x2="170" y2="50"/>
    <line x1="220" y1="270" x2="220" y2="50"/>
    <line x1="270" y1="270" x2="270" y2="50"/>
    <line x1="320" y1="270" x2="320" y2="50"/>
    <line x1="70" y1="230" x2="390" y2="230"/>
    <line x1="70" y1="190" x2="390" y2="190"/>
    <line x1="70" y1="150" x2="390" y2="150"/>
    <line x1="70" y1="110" x2="390" y2="110"/>
    <line x1="70" y1="70" x2="390" y2="70"/>
  </g>
  <!-- 반비례 곡선 y = a/x -->
  <path d="M 90,50 Q 110,120 170,180 T 390,250" fill="none" stroke="#2563eb" stroke-width="2.5"/>
  <!-- 자연수 격자점 표시 (10개 점) -->
  <g fill="#e11d48">
    <circle cx="120" cy="230" r="3.5"/>
    <circle cx="120" cy="190" r="3.5"/>
    <circle cx="120" cy="150" r="3.5"/>
    <circle cx="120" cy="110" r="3.5"/>
    <circle cx="120" cy="70" r="3.5"/>
    <circle cx="170" cy="230" r="3.5"/>
    <circle cx="170" cy="190" r="3.5"/>
    <circle cx="220" cy="230" r="3.5"/>
    <circle cx="270" cy="230" r="3.5"/>
    <circle cx="320" cy="230" r="3.5"/>
  </g>
  <!-- 축 레이블 x, y, O -->
  <g font-family="sans-serif" font-size="16" font-weight="bold" fill="#0f172a">
    <text x="425" y="290">x</text>
    <text x="50" y="35">y</text>
    <text x="52" y="288">O</text>
  </g>
  <text x="280" y="80" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2563eb">y = a/x</text>
</svg>