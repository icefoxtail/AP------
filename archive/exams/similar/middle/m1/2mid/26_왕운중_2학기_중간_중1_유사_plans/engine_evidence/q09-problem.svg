<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 240" width="460" height="240" role="img" aria-labelledby="q09-title q09-desc">
  <title id="q09-title">평행선 사이의 엇각과 동위각</title>
  <desc id="q09-desc">두 직선 m과 n이 평행할 때 횡단선과 이루는 각 a와 b</desc>
  <rect width="460" height="240" fill="#ffffff"/>
  <!-- 평행선 m, n -->
  <line x1="40" y1="60" x2="420" y2="60" stroke="#0f172a" stroke-width="2.5"/>
  <line x1="40" y1="180" x2="420" y2="180" stroke="#0f172a" stroke-width="2.5"/>
  <!-- 횡단선 1 -->
  <line x1="90" y1="20" x2="240" y2="220" stroke="#2563eb" stroke-width="2"/>
  <!-- 횡단선 2 -->
  <line x1="370" y1="20" x2="220" y2="220" stroke="#b91c1c" stroke-width="2"/>
  <!-- 각 호 및 레이블 -->
  <path d="M 105,60 A 25,25 0 0,1 128,40" fill="none" stroke="#e11d48" stroke-width="1.8"/>
  <text x="140" y="35" font-family="sans-serif" font-size="14" fill="#e11d48">125°</text>
  <path d="M 140,60 A 20,20 0 0,0 128,75" fill="none" stroke="#0f172a" stroke-width="1.8"/>
  <text x="145" y="90" font-family="sans-serif" font-size="15" font-weight="bold" fill="#0f172a">a</text>
  <path d="M 235,180 A 20,20 0 0,1 250,165" fill="none" stroke="#0f172a" stroke-width="1.8"/>
  <text x="260" y="160" font-family="sans-serif" font-size="15" font-weight="bold" fill="#0f172a">b</text>
  <text x="285" y="205" font-family="sans-serif" font-size="14" fill="#2563eb">85°</text>
  <!-- 직선 이름 m, n -->
  <text x="30" y="65" font-family="sans-serif" font-size="18" font-weight="bold" fill="#0f172a">m</text>
  <text x="30" y="185" font-family="sans-serif" font-size="18" font-weight="bold" fill="#0f172a">n</text>
</svg>