<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 440" width="460" height="440" role="img" aria-labelledby="q19-title q19-desc">
  <title id="q19-title">육각별 다각형의 꼭짓점 각의 합</title>
  <desc id="q19-desc">6개의 뾰족한 꼭짓점을 가진 별 모양 다각형에서 각 a, b, c, d, e, f가 표시된 다이어그램</desc>
  <rect width="460" height="440" fill="#ffffff"/>
  <!-- 육각별: 두 삼각형 (230, 50), (370, 290), (90, 290) 와 (230, 370), (370, 130), (90, 130) -->
  <polygon points="230,50 370,290 90,290" fill="none" stroke="#1e293b" stroke-width="2.5"/>
  <polygon points="230,370 370,130 90,130" fill="none" stroke="#1e293b" stroke-width="2.5"/>
  <!-- 6개 꼭짓점 호 -->
  <path d="M 215,80 A 30,30 0 0,0 245,80" fill="none" stroke="#dc2626" stroke-width="2"/>
  <path d="M 345,145 A 30,30 0 0,1 345,115" fill="none" stroke="#dc2626" stroke-width="2"/>
  <path d="M 345,275 A 30,30 0 0,1 345,305" fill="none" stroke="#dc2626" stroke-width="2"/>
  <path d="M 215,340 A 30,30 0 0,1 245,340" fill="none" stroke="#dc2626" stroke-width="2"/>
  <path d="M 115,275 A 30,30 0 0,0 115,305" fill="none" stroke="#dc2626" stroke-width="2"/>
  <path d="M 115,145 A 30,30 0 0,0 115,115" fill="none" stroke="#dc2626" stroke-width="2"/>
  <!-- 각 문자 레이블 a, b, c, d, e, f -->
  <g font-family="sans-serif" font-size="16" font-weight="bold" fill="#dc2626" text-anchor="middle">
    <text x="230" y="35">a</text>
    <text x="395" y="130">b</text>
    <text x="395" y="305">c</text>
    <text x="230" y="405">d</text>
    <text x="65" y="305">e</text>
    <text x="65" y="130">f</text>
  </g>
</svg>