<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 280" width="520" height="280" role="img" aria-labelledby="q13-title q13-desc">
  <title id="q13-title">합동인 두 삼각형 ABC와 DEF의 대응관계</title>
  <desc id="q13-desc">삼각형 ABC와 삼각형 DEF가 합동이고 대응변 6cm, 각 B=65도, 각 F=45도가 표시된 다이어그램</desc>
  <rect width="520" height="280" fill="#ffffff"/>
  <!-- 삼각형 ABC: A=(120, 70), B=(60, 220), C=(240, 220) -->
  <polygon points="120,70 60,220 240,220" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/>
  <!-- 각 B 호 65° -->
  <path d="M 90,220 A 30,30 0 0,0 72,190" fill="none" stroke="#dc2626" stroke-width="2"/>
  <!-- 삼각형 DEF: D=(380, 70), E=(320, 220), F=(500, 220) -->
  <polygon points="380,70 320,220 500,220" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/>
  <!-- 각 F 호 45° -->
  <path d="M 470,220 A 30,30 0 0,1 480,195" fill="none" stroke="#16a34a" stroke-width="2"/>
  <!-- 점들 -->
  <circle cx="120" cy="70" r="4" fill="#1e293b"/>
  <circle cx="60" cy="220" r="4" fill="#1e293b"/>
  <circle cx="240" cy="220" r="4" fill="#1e293b"/>
  <circle cx="380" cy="70" r="4" fill="#1e293b"/>
  <circle cx="320" cy="220" r="4" fill="#1e293b"/>
  <circle cx="500" cy="220" r="4" fill="#1e293b"/>
  <!-- 레이블 -->
  <g font-family="sans-serif" font-size="16" font-weight="bold" fill="#0f172a" text-anchor="middle">
    <text x="120" y="55">A</text>
    <text x="45" y="235">B</text>
    <text x="255" y="235">C</text>
    <text x="380" y="55">D</text>
    <text x="305" y="235">E</text>
    <text x="515" y="235">F</text>
  </g>
  <g font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">
    <text x="75" y="140" fill="#2563eb">6 cm</text>
    <text x="110" y="210" fill="#dc2626">65°</text>
    <text x="455" y="210" fill="#16a34a">45°</text>
  </g>
</svg>