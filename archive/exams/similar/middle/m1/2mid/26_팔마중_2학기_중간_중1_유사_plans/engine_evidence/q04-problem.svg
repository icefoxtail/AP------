<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320" width="500" height="320" role="img" aria-labelledby="q04-title q04-desc">
  <title id="q04-title">각의 크기 계산: 점 O 주위의 각</title>
  <desc id="q04-desc">직선 AB 위의 점 O에서 반직선 OC, OD, OE가 뻗어나가는 각의 관계 다이어그램</desc>
  <rect width="500" height="320" fill="#ffffff"/>
  <!-- 직선 AB -->
  <line x1="60" y1="240" x2="440" y2="240" stroke="#1e293b" stroke-width="2.5"/>
  <!-- 교점 O -->
  <circle cx="250" cy="240" r="4.5" fill="#1e293b"/>
  <!-- 반직선 OC (직각 90도, 250, 70) -->
  <line x1="250" y1="240" x2="250" y2="70" stroke="#1e293b" stroke-width="2.5"/>
  <!-- 직각 표시 AOC -->
  <path d="M 225,240 L 225,215 L 250,215" fill="none" stroke="#2563eb" stroke-width="2"/>
  <!-- 반직선 OD (각 AOC 옆: 60도 방향) -->
  <line x1="250" y1="240" x2="340" y2="84" stroke="#1e293b" stroke-width="2.5"/>
  <!-- 반직선 OE (각 DOB 이등분선: 30도 방향) -->
  <line x1="250" y1="240" x2="390" y2="159" stroke="#1e293b" stroke-width="2.5"/>
  <!-- 각 호 -->
  <path d="M 250,185 A 55,55 0 0,1 298,212" fill="none" stroke="#dc2626" stroke-width="1.8"/>
  <path d="M 298,212 A 55,55 0 0,1 305,240" fill="none" stroke="#16a34a" stroke-width="1.8"/>
  <!-- 레이블 -->
  <g font-family="sans-serif" font-size="16" font-weight="bold" fill="#0f172a" text-anchor="middle">
    <text x="50" y="245">A</text>
    <text x="450" y="245">B</text>
    <text x="250" y="55">C</text>
    <text x="355" y="75">D</text>
    <text x="405" y="155">E</text>
    <text x="250" y="265">O</text>
  </g>
</svg>