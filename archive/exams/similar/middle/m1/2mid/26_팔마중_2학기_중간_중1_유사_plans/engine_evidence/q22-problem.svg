<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" width="480" height="320" role="img" aria-labelledby="q22-title q22-desc">
  <title id="q22-title">맞꼭지각과 수직인 두 직선의 각 관계</title>
  <desc id="q22-desc">일직선 위의 각과 수직인 선, 맞꼭지각을 이용하여 x, y를 구하는 다이어그램</desc>
  <rect width="480" height="320" fill="#ffffff"/>
  <!-- 수평선 AB -->
  <line x1="50" y1="160" x2="430" y2="160" stroke="#1e293b" stroke-width="2.5"/>
  <!-- 직선 CD (기울기 -30도/150도) -->
  <line x1="110" y1="85" x2="370" y2="235" stroke="#1e293b" stroke-width="2.5"/>
  <!-- 반직선 OE (각 COE = 90도, 기울기 60도) -->
  <line x1="240" y1="160" x2="315" y2="30" stroke="#1e293b" stroke-width="2.5"/>
  <!-- 중심점 O -->
  <circle cx="240" cy="160" r="4.5" fill="#1e293b"/>
  <!-- 직각 표시 (선분 OC와 선분 OE 사이) -->
  <path d="M 223,150 L 233,133 L 250,143" fill="none" stroke="#2563eb" stroke-width="2"/>
  <!-- 각 60° 호 (선분 OE와 수평선 오른쪽) -->
  <path d="M 285,160 A 45,45 0 0,0 263,121" fill="none" stroke="#dc2626" stroke-width="2"/>
  <!-- 각 y 호 (수평선 왼쪽과 선분 OC) -->
  <path d="M 190,160 A 50,50 0 0,1 197,135" fill="none" stroke="#16a34a" stroke-width="2"/>
  <!-- 각 (3x+30)° 호 (수평선 아래쪽 맞꼭지각) -->
  <path d="M 195,160 A 45,45 0 0,0 279,183" fill="none" stroke="#7c3aed" stroke-width="2"/>
  <!-- 각 레이블 -->
  <g font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="middle">
    <text x="300" y="145" fill="#dc2626">60°</text>
    <text x="175" y="140" fill="#16a34a">y</text>
    <text x="210" y="215" fill="#7c3aed">3x+30°</text>
  </g>
</svg>
