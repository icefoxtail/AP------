<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 320" width="520" height="320" role="img" aria-labelledby="q03-title q03-desc">
  <title id="q03-title">직각사다리꼴 ABCD의 변과 각의 관계</title>
  <desc id="q03-desc">사다리꼴 ABCD에서 선분 AD와 BC가 평행하고 각 A, B가 직각인 다이어그램</desc>
  <rect width="520" height="320" fill="#ffffff"/>
  <!-- 사다리꼴 ABCD 외곽선 -->
  <polygon points="100,80 260,80 420,250 100,250" fill="#f8fafc" stroke="#1e293b" stroke-width="2.5"/>
  <!-- 직각 표시 A (100, 80) -->
  <path d="M 100,105 L 125,105 L 125,80" fill="none" stroke="#dc2626" stroke-width="2"/>
  <!-- 직각 표시 B (100, 250) -->
  <path d="M 100,225 L 125,225 L 125,250" fill="none" stroke="#dc2626" stroke-width="2"/>
  <!-- 꼭짓점 점 -->
  <circle cx="100" cy="80" r="4.5" fill="#1e293b"/>
  <circle cx="260" cy="80" r="4.5" fill="#1e293b"/>
  <circle cx="420" cy="250" r="4.5" fill="#1e293b"/>
  <circle cx="100" cy="250" r="4.5" fill="#1e293b"/>
  <!-- 길이 치수선 및 레이블 -->
  <g font-family="sans-serif" font-size="14" fill="#475569" text-anchor="middle">
    <text x="70" y="170">6 cm</text>
    <text x="180" y="65">4 cm</text>
    <text x="260" y="275">8 cm</text>
    <text x="360" y="155">7 cm</text>
  </g>
  <!-- 꼭짓점 문자 -->
  <g font-family="sans-serif" font-size="16" font-weight="bold" fill="#0f172a" text-anchor="middle">
    <text x="90" y="65">A</text>
    <text x="90" y="275">B</text>
    <text x="435" y="270">C</text>
    <text x="270" y="65">D</text>
  </g>
</svg>