<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" width="520" height="300" role="img" aria-labelledby="q21-title q21-desc">
  <title id="q21-title">삼각형의 내각과 외각의 관계</title>
  <desc id="q21-desc">삼각형 ABC의 변 BC 위의 점 D에서 외각 125도, 내각 85도, 31도와 각 x, y가 표시된 다이어그램</desc>
  <rect width="520" height="300" fill="#ffffff"/>
  <!-- 밑변 BC 연장선: B=(60, 230), D=(260, 230), C=(400, 230), 연장선 (470, 230) -->
  <line x1="60" y1="230" x2="470" y2="230" stroke="#1e293b" stroke-width="2.5"/>
  <!-- 꼭짓점 A=(200, 70) -->
  <!-- 선분 AB, AD, AC -->
  <line x1="200" y1="70" x2="60" y2="230" stroke="#1e293b" stroke-width="2.5"/>
  <line x1="200" y1="70" x2="260" y2="230" stroke="#1e293b" stroke-width="2"/>
  <line x1="200" y1="70" x2="400" y2="230" stroke="#1e293b" stroke-width="2.5"/>
  <!-- 각 표시 호 -->
  <!-- 각 B = 31° -->
  <path d="M 100,230 A 40,40 0 0,0 87,200" fill="none" stroke="#2563eb" stroke-width="2"/>
  <!-- 각 x (BAD) -->
  <path d="M 183,105 A 40,40 0 0,1 213,105" fill="none" stroke="#dc2626" stroke-width="2"/>
  <!-- 각 y (CAD) -->
  <path d="M 213,105 A 40,40 0 0,1 230,95" fill="none" stroke="#16a34a" stroke-width="2"/>
  <!-- 각 85° (ADC) -->
  <path d="M 295,230 A 35,35 0 0,0 248,197" fill="none" stroke="#475569" stroke-width="2"/>
  <!-- 외각 125° -->
  <path d="M 430,230 A 30,30 0 0,0 422,207" fill="none" stroke="#d97706" stroke-width="2"/>
  <!-- 점들 -->
  <circle cx="200" cy="70" r="4.5" fill="#1e293b"/>
  <circle cx="60" cy="230" r="4.5" fill="#1e293b"/>
  <circle cx="260" cy="230" r="4.5" fill="#1e293b"/>
  <circle cx="400" cy="230" r="4.5" fill="#1e293b"/>
  <!-- 레이블 -->
  <g font-family="sans-serif" font-size="16" font-weight="bold" fill="#0f172a" text-anchor="middle">
    <text x="200" y="50">A</text>
    <text x="45" y="245">B</text>
    <text x="260" y="255">D</text>
    <text x="395" y="255">C</text>
  </g>
  <g font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">
    <text x="110" y="215" fill="#2563eb">31°</text>
    <text x="190" y="125" fill="#dc2626">x</text>
    <text x="235" y="115" fill="#16a34a">y</text>
    <text x="290" y="215" fill="#475569">85°</text>
    <text x="445" y="215" fill="#d97706">125°</text>
  </g>
</svg>