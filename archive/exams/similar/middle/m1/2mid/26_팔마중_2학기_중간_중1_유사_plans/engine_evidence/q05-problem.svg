<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 220" width="520" height="220" role="img" aria-labelledby="q05-title q05-desc">
  <title id="q05-title">선분의 중점과 길이 분할</title>
  <desc id="q05-desc">선분 AB 위의 중점 M, MB의 중점 N, AN의 중점 P가 표시된 선분 분할 다이어그램</desc>
  <rect width="520" height="220" fill="#ffffff"/>
  <!-- 선분 AB (길이 400px: A=60, B=460. M=260, N=360, P=210) -->
  <line x1="60" y1="120" x2="460" y2="120" stroke="#1e293b" stroke-width="3"/>
  <!-- 점들 -->
  <circle cx="60" cy="120" r="5" fill="#1e293b"/>
  <circle cx="210" cy="120" r="5" fill="#dc2626"/>
  <circle cx="260" cy="120" r="5" fill="#2563eb"/>
  <circle cx="360" cy="120" r="5" fill="#16a34a"/>
  <circle cx="460" cy="120" r="5" fill="#1e293b"/>
  <!-- 눈금 수직선 -->
  <line x1="60" y1="110" x2="60" y2="130" stroke="#1e293b" stroke-width="2"/>
  <line x1="210" y1="110" x2="210" y2="130" stroke="#dc2626" stroke-width="2"/>
  <line x1="260" y1="110" x2="260" y2="130" stroke="#2563eb" stroke-width="2"/>
  <line x1="360" y1="110" x2="360" y2="130" stroke="#16a34a" stroke-width="2"/>
  <line x1="460" y1="110" x2="460" y2="130" stroke="#1e293b" stroke-width="2"/>
  <!-- 치수선 24 cm -->
  <line x1="60" y1="60" x2="460" y2="60" stroke="#64748b" stroke-width="1.5"/>
  <line x1="60" y1="52" x2="60" y2="68" stroke="#64748b" stroke-width="1.5"/>
  <line x1="460" y1="52" x2="460" y2="68" stroke="#64748b" stroke-width="1.5"/>
  <text x="260" y="50" font-family="sans-serif" font-size="14" fill="#475569" text-anchor="middle">24 cm</text>
  <!-- 점 레이블 -->
  <g font-family="sans-serif" font-size="16" font-weight="bold" fill="#0f172a" text-anchor="middle">
    <text x="60" y="155">A</text>
    <text x="210" y="155" fill="#dc2626">P</text>
    <text x="260" y="155" fill="#2563eb">M</text>
    <text x="360" y="155" fill="#16a34a">N</text>
    <text x="460" y="155">B</text>
  </g>
</svg>