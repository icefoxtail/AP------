<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 380" width="460" height="380" role="img" aria-labelledby="q08-title q08-desc">
  <title id="q08-title">오각기둥 ABCDE-FGHIJ의 모서리 위치 관계</title>
  <desc id="q08-desc">오각기둥의 10개 꼭짓점과 15개 모서리가 표시된 입체도형 다이어그램</desc>
  <rect width="460" height="380" fill="#ffffff"/>
  <!-- 윗면 오각형 ABCDE: A=(120, 100), B=(220, 70), C=(320, 90), D=(300, 150), E=(160, 160) -->
  <!-- 밑면 오각형 FGHIJ: F=(120, 260), G=(220, 230), H=(320, 250), I=(300, 310), J=(160, 320) -->
  <!-- 숨은 모서리 B-G, B-A, B-C, G-F, G-H (점선) -->
  <line x1="220" y1="70" x2="220" y2="230" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4 3"/>
  <line x1="220" y1="70" x2="120" y2="100" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4 3"/>
  <line x1="220" y1="70" x2="320" y2="90" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4 3"/>
  <line x1="220" y1="230" x2="120" y2="260" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4 3"/>
  <line x1="220" y1="230" x2="320" y2="250" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4 3"/>
  <!-- 보이는 모서리 (실선) -->
  <!-- 윗면 나머지 -->
  <line x1="120" y1="100" x2="160" y2="160" stroke="#1e293b" stroke-width="2.5"/>
  <line x1="160" y1="160" x2="300" y2="150" stroke="#1e293b" stroke-width="2.5"/>
  <line x1="300" y1="150" x2="320" y2="90" stroke="#1e293b" stroke-width="2.5"/>
  <!-- 밑면 나머지 -->
  <line x1="120" y1="260" x2="160" y2="320" stroke="#1e293b" stroke-width="2.5"/>
  <line x1="160" y1="320" x2="300" y2="310" stroke="#1e293b" stroke-width="2.5"/>
  <line x1="300" y1="310" x2="320" y2="250" stroke="#1e293b" stroke-width="2.5"/>
  <!-- 옆모서리 -->
  <line x1="120" y1="100" x2="120" y2="260" stroke="#dc2626" stroke-width="3"/>
  <line x1="160" y1="160" x2="160" y2="320" stroke="#1e293b" stroke-width="2.5"/>
  <line x1="300" y1="150" x2="300" y2="310" stroke="#1e293b" stroke-width="2.5"/>
  <line x1="320" y1="90" x2="320" y2="250" stroke="#1e293b" stroke-width="2.5"/>
  <!-- 꼭짓점 원 -->
  <circle cx="120" cy="100" r="4.5" fill="#dc2626"/>
  <circle cx="220" cy="70" r="4.5" fill="#94a3b8"/>
  <circle cx="320" cy="90" r="4.5" fill="#1e293b"/>
  <circle cx="300" cy="150" r="4.5" fill="#1e293b"/>
  <circle cx="160" cy="160" r="4.5" fill="#1e293b"/>
  <circle cx="120" cy="260" r="4.5" fill="#dc2626"/>
  <circle cx="220" cy="230" r="4.5" fill="#94a3b8"/>
  <circle cx="320" cy="250" r="4.5" fill="#1e293b"/>
  <circle cx="300" cy="310" r="4.5" fill="#1e293b"/>
  <circle cx="160" cy="320" r="4.5" fill="#1e293b"/>
  <!-- 문자 레이블 -->
  <g font-family="sans-serif" font-size="15" font-weight="bold" fill="#0f172a" text-anchor="middle">
    <text x="100" y="95" fill="#dc2626">A</text>
    <text x="220" y="55" fill="#64748b">B</text>
    <text x="340" y="85">C</text>
    <text x="320" y="160">D</text>
    <text x="145" y="175">E</text>
    <text x="100" y="275" fill="#dc2626">F</text>
    <text x="220" y="220" fill="#64748b">G</text>
    <text x="340" y="255">H</text>
    <text x="315" y="325">I</text>
    <text x="150" y="340">J</text>
  </g>
</svg>