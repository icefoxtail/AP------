<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" width="480" height="320" role="img" aria-labelledby="q01-title q01-desc">
  <title id="q01-title">맞꼭지각과 이웃각: 두 직선의 교차</title>
  <desc id="q01-desc">두 직선 AB와 CD가 점 O에서 교차하고 130도, a, b 각이 표시된 다이어그램</desc>
  <rect width="480" height="320" fill="#ffffff"/>
  <!-- 직선 AB -->
  <line x1="50" y1="230" x2="430" y2="90" stroke="#1e293b" stroke-width="2.5"/>
  <!-- 직선 CD -->
  <line x1="120" y1="60" x2="360" y2="260" stroke="#1e293b" stroke-width="2.5"/>
  <!-- 교점 O -->
  <circle cx="240" cy="160" r="4.5" fill="#1e293b"/>
  <!-- 각 130° 호 (위쪽 각 AOC) -->
  <path d="M 197,124 A 55,55 0 0,1 262,112" fill="none" stroke="#2563eb" stroke-width="2"/>
  <!-- 각 a 호 (맞꼭지각 DOB) -->
  <path d="M 283,196 A 55,55 0 0,1 218,208" fill="none" stroke="#dc2626" stroke-width="2"/>
  <!-- 각 b 호 (이웃각 COB) -->
  <path d="M 271,139 A 45,45 0 0,1 278,191" fill="none" stroke="#16a34a" stroke-width="2"/>
  <!-- 텍스트 레이블 -->
  <g font-family="sans-serif" font-size="16" font-weight="bold" fill="#0f172a" text-anchor="middle">
    <text x="40" y="245">A</text>
    <text x="440" y="85">B</text>
    <text x="110" y="55">C</text>
    <text x="375" y="275">D</text>
    <text x="235" y="185">O</text>
  </g>
  <g font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="middle">
    <text x="230" y="105" fill="#2563eb">130°</text>
    <text x="250" y="225" fill="#dc2626">a</text>
    <text x="305" y="165" fill="#16a34a">b</text>
  </g>
</svg>