<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 260" width="460" height="260" role="img" aria-labelledby="q23-title q23-desc">
  <title id="q23-title">직사각형 종이접기와 각 다이어그램</title>
  <desc id="q23-desc">직사각형 종이테이프를 접어 각 ABC가 70도, 각 BDE가 54도일 때 삼각형 DEF의 두 각의 합을 구하는 그림</desc>
  <rect width="460" height="260" fill="#ffffff"/>
  <!-- 직사각형 원래 점선 테두리 -->
  <line x1="30" y1="50" x2="430" y2="50" stroke="#94a3b8" stroke-dasharray="4,4" stroke-width="1.5"/>
  <line x1="30" y1="210" x2="430" y2="210" stroke="#94a3b8" stroke-dasharray="4,4" stroke-width="1.5"/>
  <!-- 접힌 종이 윤곽선 -->
  <polygon points="50,50 160,50 250,210 140,210" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <polygon points="140,210 250,210 360,110 250,110" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <!-- 접는 선 CD, EF -->
  <line x1="160" y1="50" x2="250" y2="210" stroke="#ef4444" stroke-width="2"/>
  <line x1="250" y1="210" x2="360" y2="110" stroke="#ef4444" stroke-width="2"/>
  <!-- 꼭짓점 라벨 -->
  <g font-family="sans-serif" font-size="14" font-weight="bold" fill="#0f172a">
    <text x="140" y="42">A</text>
    <text x="125" y="225">B</text>
    <text x="165" y="42" fill="#ef4444">C</text>
    <text x="250" y="230" fill="#ef4444">D</text>
    <text x="235" y="105" fill="#2563eb">E</text>
    <text x="370" y="110" fill="#2563eb">F</text>
  </g>
  <!-- 주어진 각 70도 및 54도 -->
  <text x="100" y="180" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a">70°</text>
  <text x="210" y="195" font-family="sans-serif" font-size="13" font-weight="bold" fill="#ef4444">54°</text>
</svg>
