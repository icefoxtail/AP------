<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 260" width="460" height="260" role="img" aria-labelledby="q16-title q16-desc">
  <title id="q16-title">평행선과 꺾인 선 다이어그램</title>
  <desc id="q16-desc">평행한 두 직선 l, m 사이의 꺾인 선과 35도, 75도, 85도 각에서 각 x를 구하는 그림</desc>
  <rect width="460" height="260" fill="#ffffff"/>
  <!-- 평행선 l, m -->
  <line x1="30" y1="70" x2="430" y2="70" stroke="#0f172a" stroke-width="2"/>
  <text x="20" y="75" font-family="sans-serif" font-size="15" font-weight="bold" fill="#0f172a">l</text>
  <line x1="30" y1="210" x2="430" y2="210" stroke="#0f172a" stroke-width="2"/>
  <text x="20" y="215" font-family="sans-serif" font-size="15" font-weight="bold" fill="#0f172a">m</text>
  
  <!-- 아래 꺾인 선: (130,210) -> (210,150) -> (290,70) -->
  <line x1="130" y1="210" x2="210" y2="150" stroke="#2563eb" stroke-width="2.5"/>
  <line x1="210" y1="150" x2="330" y2="20" stroke="#2563eb" stroke-width="2.5"/>
  
  <!-- 위쪽 삼각형을 완성하는 선: (330,20) -> (380,70) -> (400,90) -->
  <line x1="330" y1="20" x2="400" y2="90" stroke="#0f172a" stroke-width="2"/>
  
  <!-- 각 35도 호 (아래 직선 m과 선분 사이) -->
  <path d="M 160 210 A 30 30 0 0 1 154 192" fill="none" stroke="#64748b" stroke-width="1.8"/>
  <text x="165" y="202" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a">35°</text>
  
  <!-- 각 75도 호 (꺾인 점 (210,150) 오른쪽 각) -->
  <path d="M 226 138 A 20 20 0 0 1 228 163" fill="none" stroke="#2563eb" stroke-width="2"/>
  <text x="235" y="155" font-family="sans-serif" font-size="13" font-weight="bold" fill="#2563eb">75°</text>
  
  <!-- 각 85도 호 (위쪽 꼭짓점 (330,20) 내부) -->
  <path d="M 320 32 A 20 20 0 0 0 342 32" fill="none" stroke="#0f172a" stroke-width="1.8"/>
  <text x="330" y="48" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="middle">85°</text>
  
  <!-- 각 x 호 (직선 l과의 외각) -->
  <path d="M 405 70 A 25 25 0 0 0 395 55" fill="none" stroke="#ef4444" stroke-width="2"/>
  <text x="410" y="62" font-family="sans-serif" font-size="15" font-weight="bold" fill="#ef4444">x</text>
</svg>