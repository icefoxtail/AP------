<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 320" width="440" height="320" role="img" aria-labelledby="q21-title q21-desc">
  <title id="q21-title">정비례 그래프와 직각삼각형 AOB</title>
  <desc id="q21-desc">정비례 관계 y=4/3x 그래프 위의 점 A(6,8)와 x축 위의 점 B(6,0), 원점 O로 이루어진 직각삼각형 AOB</desc>
  <rect width="440" height="320" fill="#ffffff"/>
  <!-- 축 -->
  <line x1="40" y1="260" x2="410" y2="260" stroke="#0f172a" stroke-width="2"/>
  <polygon points="410,260 400,255 400,265" fill="#0f172a"/>
  <text x="420" y="264" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0f172a">x</text>
  <line x1="80" y1="290" x2="80" y2="30" stroke="#0f172a" stroke-width="2"/>
  <polygon points="80,30 75,40 85,40" fill="#0f172a"/>
  <text x="80" y="22" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="middle">y</text>
  <text x="68" y="275" font-family="sans-serif" font-size="14" fill="#0f172a">O</text>
  <!-- 삼각형 AOB 색칠: O(80,260), B(320,260), A(320,60) -->
  <polygon points="80,260 320,260 320,60" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <!-- 정비례 직선 연장선 -->
  <line x1="40" y1="293" x2="360" y2="27" stroke="#2563eb" stroke-width="2.5"/>
  <text x="350" y="22" font-family="sans-serif" font-size="13" font-weight="bold" fill="#2563eb">y=4/3x</text>
  <!-- 점 B에서 직각 표시 -->
  <rect x="300" y="240" width="20" height="20" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <!-- 점선 y축 안내선 -->
  <line x1="80" y1="60" x2="320" y2="60" stroke="#64748b" stroke-dasharray="3,3" stroke-width="1.5"/>
  <!-- 점 표시 -->
  <circle cx="80" cy="260" r="4.5" fill="#0f172a"/>
  <circle cx="320" cy="260" r="4.5" fill="#0f172a"/>
  <circle cx="320" cy="60" r="5" fill="#ef4444"/>
  <!-- 라벨 -->
  <g font-family="sans-serif" font-size="15" font-weight="bold" fill="#0f172a">
    <text x="325" y="55" fill="#ef4444">A</text>
    <text x="320" y="282" text-anchor="middle">B(6,0)</text>
  </g>
</svg>
