<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 260" width="420" height="260" role="img" aria-labelledby="q12-title q12-desc">
  <title id="q12-title">직각사다리꼴의 위치 관계와 거리</title>
  <desc id="q12-desc">AD=4cm, AB=3cm, BC=7cm이고 각 A, B가 직각인 직각사다리꼴 ABCD</desc>
  <rect width="420" height="260" fill="#ffffff"/>
  <!-- 사다리꼴 ABCD: A(80,50), B(80,180), C(320,180), D(220,50) -->
  <polygon points="80,50 80,180 320,180 220,50" fill="#f8fafc" stroke="#0f172a" stroke-width="2.5"/>
  <!-- 직각 표시 -->
  <rect x="80" y="162" width="18" height="18" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <rect x="80" y="50" width="18" height="18" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <!-- 꼭짓점 점 표시 -->
  <circle cx="80" cy="50" r="4.5" fill="#0f172a"/>
  <circle cx="80" cy="180" r="4.5" fill="#0f172a"/>
  <circle cx="320" cy="180" r="4.5" fill="#0f172a"/>
  <circle cx="220" cy="50" r="4.5" fill="#0f172a"/>
  <!-- 꼭짓점 라벨 -->
  <g font-family="sans-serif" font-size="15" font-weight="bold" fill="#0f172a">
    <text x="65" y="45">A</text>
    <text x="65" y="195">B</text>
    <text x="330" y="195">C</text>
    <text x="225" y="45">D</text>
  </g>
  <!-- 길이 치수 라벨 -->
  <text x="60" y="120" font-family="sans-serif" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="end">3 cm</text>
  <text x="150" y="40" font-family="sans-serif" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="middle">4 cm</text>
  <text x="200" y="205" font-family="sans-serif" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="middle">7 cm</text>
</svg>
