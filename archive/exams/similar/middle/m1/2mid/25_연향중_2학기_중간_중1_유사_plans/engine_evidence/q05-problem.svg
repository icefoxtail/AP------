<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 380" width="460" height="380" role="img" aria-labelledby="q05-title q05-desc">
  <title id="q05-title">정비례 그래프와 반비례 그래프</title>
  <desc id="q05-desc">점 (-3,6)을 지나는 정비례 직선 y=ax와 점 (4,3)을 지나는 반비례 곡선 y=b/x</desc>
  <rect width="460" height="380" fill="#ffffff"/>
  <!-- 좌표축 -->
  <line x1="30" y1="190" x2="430" y2="190" stroke="#0f172a" stroke-width="2"/>
  <polygon points="430,190 420,185 420,195" fill="#0f172a"/>
  <text x="440" y="194" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0f172a">x</text>
  <line x1="230" y1="360" x2="230" y2="20" stroke="#0f172a" stroke-width="2"/>
  <polygon points="230,20 225,30 235,30" fill="#0f172a"/>
  <text x="230" y="14" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="middle">y</text>
  <text x="216" y="206" font-family="sans-serif" font-size="13" fill="#0f172a">O</text>
  <!-- 정비례 직선 y = -2x: (-3,6) -> (150, 70), (0,0) -> (230,190), (3,-6) -> (310, 310) -->
  <line x1="120" y1="25" x2="340" y2="355" stroke="#ef4444" stroke-width="2.5"/>
  <text x="110" y="25" font-family="sans-serif" font-size="13" font-weight="bold" fill="#ef4444">y=ax</text>
  <!-- 점 (-3,6) 안내선 및 점 -->
  <line x1="150" y1="190" x2="150" y2="70" stroke="#64748b" stroke-dasharray="3,3" stroke-width="1.5"/>
  <line x1="230" y1="70" x2="150" y2="70" stroke="#64748b" stroke-dasharray="3,3" stroke-width="1.5"/>
  <circle cx="150" cy="70" r="4.5" fill="#ef4444"/>
  <text x="150" y="206" font-family="sans-serif" font-size="12" fill="#0f172a" text-anchor="middle">-3</text>
  <text x="242" y="74" font-family="sans-serif" font-size="12" fill="#0f172a">6</text>
  <!-- 반비례 곡선 y = 12/x: (1,12)->(255,10), (2,6)->(280,70), (3,4)->(305,110), (4,3)->(330,130), (6,2)->(380,150) -->
  <path d="M 255 30 Q 280 100, 330 130 T 425 165" fill="none" stroke="#2563eb" stroke-width="2.5"/>
  <path d="M 205 350 Q 180 280, 130 250 T 35 215" fill="none" stroke="#2563eb" stroke-width="2.5"/>
  <text x="390" y="135" font-family="sans-serif" font-size="13" font-weight="bold" fill="#2563eb">y=b/x</text>
  <!-- 점 (4,3) 안내선 및 점 -->
  <line x1="330" y1="190" x2="330" y2="130" stroke="#64748b" stroke-dasharray="3,3" stroke-width="1.5"/>
  <line x1="230" y1="130" x2="330" y2="130" stroke="#64748b" stroke-dasharray="3,3" stroke-width="1.5"/>
  <circle cx="330" cy="130" r="4.5" fill="#2563eb"/>
  <text x="330" y="206" font-family="sans-serif" font-size="12" fill="#0f172a" text-anchor="middle">4</text>
  <text x="218" y="134" font-family="sans-serif" font-size="12" fill="#0f172a" text-anchor="end">3</text>
</svg>
