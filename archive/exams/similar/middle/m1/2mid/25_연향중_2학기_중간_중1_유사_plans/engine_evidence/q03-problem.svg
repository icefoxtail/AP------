<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 260" width="480" height="260" role="img" aria-labelledby="q03-title q03-desc">
  <title id="q03-title">온실 내부 온도 변화 그래프</title>
  <desc id="q03-desc">0시간부터 14시간까지 온도가 12도와 24도 사이를 4시간 주기로 오르내리는 꺾은선 그래프</desc>
  <rect width="480" height="260" fill="#ffffff"/>
  <!-- 축 -->
  <line x1="50" y1="210" x2="450" y2="210" stroke="#0f172a" stroke-width="2"/>
  <polygon points="450,210 440,205 440,215" fill="#0f172a"/>
  <text x="460" y="214" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a">x(시간)</text>
  <line x1="50" y1="210" x2="50" y2="30" stroke="#0f172a" stroke-width="2"/>
  <polygon points="50,30 45,40 55,40" fill="#0f172a"/>
  <text x="50" y="20" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="middle">y(°C)</text>
  <text x="38" y="222" font-family="sans-serif" font-size="13" fill="#0f172a">O</text>
  <!-- 눈금 라벨 -->
  <g font-family="sans-serif" font-size="12" fill="#64748b" text-anchor="middle">
    <text x="100" y="226">2</text>
    <text x="150" y="226">4</text>
    <text x="200" y="226">6</text>
    <text x="250" y="226">8</text>
    <text x="300" y="226">10</text>
    <text x="350" y="226">12</text>
    <text x="400" y="226">14</text>
  </g>
  <g font-family="sans-serif" font-size="12" fill="#64748b" text-anchor="end">
    <text x="42" y="145">12</text>
    <text x="42" y="75">24</text>
  </g>
  <!-- 보조 기준 점선 -->
  <line x1="50" y1="140" x2="430" y2="140" stroke="#cbd5e1" stroke-dasharray="4,4" stroke-width="1"/>
  <line x1="50" y1="70" x2="430" y2="70" stroke="#cbd5e1" stroke-dasharray="4,4" stroke-width="1"/>
  <!-- 꺾은선 그래프 -->
  <polyline points="50,140 100,70 150,140 200,70 250,140 300,70 350,140 400,70" fill="none" stroke="#2563eb" stroke-width="3"/>
  <!-- 데이터 포인트 -->
  <circle cx="50" cy="140" r="4.5" fill="#2563eb"/>
  <circle cx="100" cy="70" r="4.5" fill="#ef4444"/>
  <circle cx="150" cy="140" r="4.5" fill="#2563eb"/>
  <circle cx="200" cy="70" r="4.5" fill="#ef4444"/>
  <circle cx="250" cy="140" r="4.5" fill="#2563eb"/>
  <circle cx="300" cy="70" r="4.5" fill="#ef4444"/>
  <circle cx="350" cy="140" r="4.5" fill="#2563eb"/>
  <circle cx="400" cy="70" r="4.5" fill="#ef4444"/>
</svg>
