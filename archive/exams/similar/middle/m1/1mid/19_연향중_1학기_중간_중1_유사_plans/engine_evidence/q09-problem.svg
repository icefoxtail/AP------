<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 160" width="520" height="160" role="img" aria-labelledby="q9-title q9-desc">
  <title id="q9-title">세계 주요 도시의 시차 수직선</title>
  <desc id="q9-desc">본초자오선을 기준으로 런던 0, 카이로 +2, 서울 +9, 로스앤젤레스 -8을 나타낸 수직선</desc>
  <rect width="520" height="160" fill="#ffffff"/>
  
  <line x1="30" y1="90" x2="490" y2="90" stroke="#222222" stroke-width="2.5"/>
  <polygon points="25,90 35,85 35,95" fill="#222222"/>
  <polygon points="495,90 485,85 485,95" fill="#222222"/>
  
  <line x1="80" y1="83" x2="80" y2="97" stroke="#222222" stroke-width="2"/>
  <line x1="240" y1="80" x2="240" y2="100" stroke="#222222" stroke-width="2.5"/>
  <line x1="290" y1="83" x2="290" y2="97" stroke="#222222" stroke-width="2"/>
  <line x1="450" y1="83" x2="450" y2="97" stroke="#222222" stroke-width="2"/>
  
  <circle cx="80" cy="90" r="4.5" fill="#0066cc"/>
  <circle cx="240" cy="90" r="5" fill="#222222"/>
  <circle cx="290" cy="90" r="4.5" fill="#0066cc"/>
  <circle cx="450" cy="90" r="4.5" fill="#0066cc"/>
  
  <g font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#111111">
    <text x="80" y="55">로스앤젤레스</text>
    <text x="240" y="55">런던</text>
    <text x="290" y="55">카이로</text>
    <text x="450" y="55">서울</text>
  </g>
  
  <g font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="middle">
    <text x="80" y="125" fill="#0066cc">-8</text>
    <text x="240" y="125" fill="#222222">0</text>
    <text x="290" y="125" fill="#0066cc">+2</text>
    <text x="450" y="125" fill="#0066cc">+9</text>
  </g>
</svg>
