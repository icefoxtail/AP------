<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 340" width="380" height="340" role="img" aria-labelledby="q11-title q11-desc">
  <title id="q11-title">좌표평면 위의 다섯 점</title>
  <desc id="q11-desc">좌표평면 위에 다섯 점 A, B, C, D, E와 원점 O가 표시된 그림</desc>
  <rect width="380" height="340" fill="#ffffff"/>

  <!-- Coordinate Axes -->
  <g stroke="#333333" stroke-width="1.5">
    <!-- X axis -->
    <line x1="30" y1="170" x2="350" y2="170"/>
    <polyline points="342,165 350,170 342,175" fill="none"/>
    <!-- Y axis -->
    <line x1="190" y1="310" x2="190" y2="30"/>
    <polyline points="185,38 190,30 195,38" fill="none"/>
  </g>

  <!-- Axis and Origin Labels -->
  <g font-family="sans-serif" font-size="14" fill="#111111" font-weight="bold">
    <text x="355" y="175">x</text>
    <text x="190" y="22" text-anchor="middle">y</text>
    <text x="176" y="186">O</text>
  </g>

  <!-- Dashed Guidelines -->
  <g stroke="#777777" stroke-width="1.2" stroke-dasharray="4,4">
    <!-- Point B(3, 2) -->
    <line x1="280" y1="170" x2="280" y2="110"/>
    <line x1="190" y1="110" x2="280" y2="110"/>
    <!-- Point C(-3, 4) -->
    <line x1="100" y1="170" x2="100" y2="50"/>
    <line x1="100" y1="50" x2="190" y2="50"/>
    <!-- Point D(-4, -2) -->
    <line x1="70" y1="170" x2="70" y2="230"/>
    <line x1="70" y1="230" x2="190" y2="230"/>
    <!-- Point E(2, -3) -->
    <line x1="250" y1="170" x2="250" y2="260"/>
    <line x1="190" y1="260" x2="250" y2="260"/>
  </g>

  <!-- Axis Numbers & Ticks -->
  <g font-family="sans-serif" font-size="12" fill="#333333">
    <!-- X axis ticks -->
    <text x="280" y="186" text-anchor="middle">3</text>
    <text x="100" y="186" text-anchor="middle">-3</text>
    <text x="70" y="164" text-anchor="middle">-4</text>
    <text x="250" y="164" text-anchor="middle">2</text>
    <!-- Y axis ticks -->
    <text x="182" y="114" text-anchor="end">2</text>
    <text x="182" y="54" text-anchor="end">4</text>
    <text x="198" y="234" text-anchor="start">-2</text>
    <text x="198" y="264" text-anchor="start">-3</text>
    <text x="182" y="84" text-anchor="end">3</text>
  </g>

  <!-- Points and Labels -->
  <!-- Point A(0, 3) -->
  <circle cx="190" cy="80" r="4.5" fill="#d32f2f"/>
  <text x="174" y="82" font-family="sans-serif" font-size="15" font-weight="bold" fill="#111111">A</text>

  <!-- Point B(3, 2) -->
  <circle cx="280" cy="110" r="4.5" fill="#d32f2f"/>
  <text x="290" y="112" font-family="sans-serif" font-size="15" font-weight="bold" fill="#111111">B</text>

  <!-- Point C(-3, 4) -->
  <circle cx="100" cy="50" r="4.5" fill="#d32f2f"/>
  <text x="86" y="52" font-family="sans-serif" font-size="15" font-weight="bold" fill="#111111">C</text>

  <!-- Point D(-4, -2) -->
  <circle cx="70" cy="230" r="4.5" fill="#d32f2f"/>
  <text x="54" y="234" font-family="sans-serif" font-size="15" font-weight="bold" fill="#111111">D</text>

  <!-- Point E(2, -3) -->
  <circle cx="250" cy="260" r="4.5" fill="#d32f2f"/>
  <text x="260" y="266" font-family="sans-serif" font-size="15" font-weight="bold" fill="#111111">E</text>

  <!-- Origin Point -->
  <circle cx="190" cy="170" r="3" fill="#333333"/>
</svg>
