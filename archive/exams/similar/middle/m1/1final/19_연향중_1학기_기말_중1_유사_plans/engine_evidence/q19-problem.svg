<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 340" width="380" height="340" role="img" aria-labelledby="q19-title q19-desc">
  <title id="q19-title">정비례와 반비례 그래프의 교점</title>
  <desc id="q19-desc">좌표평면 위에 반비례 관계 y=18/x와 정비례 관계 y=ax의 그래프가 점 (3, b)에서 만나는 그림</desc>
  <rect width="380" height="340" fill="#ffffff"/>

  <!-- Coordinate Axes -->
  <g stroke="#333333" stroke-width="1.5">
    <!-- X axis -->
    <line x1="30" y1="240" x2="360" y2="240"/>
    <polyline points="352,235 360,240 352,245" fill="none"/>
    <!-- Y axis -->
    <line x1="130" y1="310" x2="130" y2="25"/>
    <polyline points="125,33 130,25 135,33" fill="none"/>
  </g>

  <!-- Axis and Origin Labels -->
  <g font-family="sans-serif" font-size="14" fill="#111111" font-weight="bold">
    <text x="365" y="245">x</text>
    <text x="130" y="18" text-anchor="middle">y</text>
    <text x="114" y="256">O</text>
  </g>

  <!-- Dashed Guidelines for Intersection Point (3, b) at (202, 96) -->
  <g stroke="#777777" stroke-width="1.2" stroke-dasharray="4,4">
    <line x1="202" y1="240" x2="202" y2="96"/>
    <line x1="130" y1="96" x2="202" y2="96"/>
  </g>

  <!-- Axis Numbers & Ticks -->
  <g font-family="sans-serif" font-size="13" fill="#333333">
    <text x="202" y="258" text-anchor="middle">3</text>
    <text x="120" y="101" text-anchor="end" font-weight="bold">b</text>
  </g>

  <!-- Inverse Proportion Curve y = 18/x -->
  <path d="M 166,35 Q 178,65 202,96 Q 238,150 274,168 Q 310,182 355,192" fill="none" stroke="#e65100" stroke-width="2.5"/>

  <!-- Curve Formula Label -->
  <g font-family="sans-serif" font-size="14" fill="#e65100" font-weight="bold">
    <text x="300" y="152">y = 18/x</text>
  </g>

  <!-- Direct Proportion Line y = ax -->
  <line x1="94" y1="312" x2="238" y2="24" stroke="#0066cc" stroke-width="2.5"/>

  <!-- Line Formula Label -->
  <g font-family="sans-serif" font-size="14" fill="#0066cc" font-weight="bold">
    <text x="245" y="35">y = ax</text>
  </g>

  <!-- Intersection Point and Origin -->
  <circle cx="130" cy="240" r="3" fill="#333333"/>
  <circle cx="202" cy="96" r="4.5" fill="#d32f2f"/>
</svg>
