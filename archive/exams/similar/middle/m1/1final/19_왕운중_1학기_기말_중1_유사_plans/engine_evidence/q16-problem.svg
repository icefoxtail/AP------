<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 340" width="380" height="340" role="img" aria-labelledby="q16-title q16-desc">
  <title id="q16-title">직사각형 ABCD와 이등분선 y=ax</title>
  <desc id="q16-desc">좌표평면 위에 꼭짓점이 A(2, 6), B(2, 2), C(4, 2), D(4, 6)인 직사각형 ABCD와 그 넓이를 이등분하는 직선 y=ax</desc>
  <rect width="380" height="340" fill="#ffffff"/>

  <!-- Coordinate Axes -->
  <g stroke="#333333" stroke-width="1.5">
    <!-- X axis -->
    <line x1="40" y1="280" x2="350" y2="280"/>
    <polyline points="342,275 350,280 342,285" fill="none"/>
    <!-- Y axis -->
    <line x1="50" y1="310" x2="50" y2="30"/>
    <polyline points="45,38 50,30 55,38" fill="none"/>
  </g>

  <!-- Axis and Origin Labels -->
  <g font-family="sans-serif" font-size="14" fill="#111111" font-weight="bold">
    <text x="355" y="285">x</text>
    <text x="50" y="22" text-anchor="middle">y</text>
    <text x="36" y="296">O</text>
  </g>

  <!-- Dashed Projection Guidelines -->
  <g stroke="#888888" stroke-width="1.2" stroke-dasharray="4,4">
    <!-- x = 2 and x = 4 -->
    <line x1="150" y1="280" x2="150" y2="210"/>
    <line x1="250" y1="280" x2="250" y2="210"/>
    <!-- y = 2 and y = 6 -->
    <line x1="50" y1="210" x2="150" y2="210"/>
    <line x1="50" y1="70" x2="150" y2="70"/>
  </g>

  <!-- Rectangle ABCD -->
  <polygon points="150,70 150,210 250,210 250,70" fill="#e8f4fd" stroke="#0275d8" stroke-width="2"/>

  <!-- Bisecting Line y = ax -->
  <line x1="50" y1="280" x2="300" y2="47" stroke="#d9534f" stroke-width="2.5"/>

  <!-- Center intersection point (3, 4) -> (200, 140) -->
  <circle cx="200" cy="140" r="4" fill="#d9534f"/>

  <!-- Axis Tick Labels -->
  <g font-family="sans-serif" font-size="12" fill="#222222">
    <text x="150" y="298" text-anchor="middle">2</text>
    <text x="250" y="298" text-anchor="middle">4</text>
    <text x="42" y="214" text-anchor="end">2</text>
    <text x="42" y="74" text-anchor="end">6</text>
  </g>

  <!-- Vertex Labels A, B, C, D -->
  <g font-family="sans-serif" font-size="14" font-weight="bold" fill="#111111">
    <text x="135" y="65">A</text>
    <text x="135" y="226">B</text>
    <text x="258" y="226">C</text>
    <text x="258" y="65">D</text>
  </g>

  <!-- Line Equation Label -->
  <text x="305" y="42" font-family="sans-serif" font-size="13" font-style="italic" fill="#d9534f" font-weight="bold">y = ax</text>
</svg>
