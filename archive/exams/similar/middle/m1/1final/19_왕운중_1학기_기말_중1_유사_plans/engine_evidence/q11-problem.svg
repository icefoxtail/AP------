<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 320" width="440" height="320" role="img" aria-labelledby="q11-title q11-desc">
  <title id="q11-title">열차의 시간과 속력 사이의 관계 그래프</title>
  <desc id="q11-desc">열차가 출발한 지 x분 후의 속력 y km/h를 나타내는 꺾은선 그래프로, 60분 동안의 속력 변화를 나타낸 그림</desc>
  <rect width="440" height="320" fill="#ffffff"/>

  <!-- Coordinate Axes -->
  <g stroke="#333333" stroke-width="1.5">
    <!-- X axis -->
    <line x1="40" y1="260" x2="410" y2="260"/>
    <polyline points="402,255 410,260 402,265" fill="none"/>
    <!-- Y axis -->
    <line x1="50" y1="270" x2="50" y2="30"/>
    <polyline points="45,38 50,30 55,38" fill="none"/>
  </g>

  <!-- Axis and Origin Labels -->
  <g font-family="sans-serif" font-size="14" fill="#111111" font-weight="bold">
    <text x="415" y="265">x</text>
    <text x="50" y="22" text-anchor="middle">y</text>
    <text x="36" y="276">O</text>
  </g>

  <!-- Unit labels -->
  <g font-family="sans-serif" font-size="12" fill="#555555">
    <text x="400" y="285" text-anchor="end">(분)</text>
    <text x="65" y="42">(시속 km)</text>
  </g>

  <!-- Dashed Guidelines -->
  <g stroke="#888888" stroke-width="1.2" stroke-dasharray="4,4">
    <line x1="100" y1="260" x2="100" y2="60"/>
    <line x1="200" y1="260" x2="200" y2="60"/>
    <line x1="50" y1="60" x2="200" y2="60"/>
    <line x1="250" y1="260" x2="250" y2="160"/>
    <line x1="300" y1="260" x2="300" y2="160"/>
    <line x1="50" y1="160" x2="300" y2="160"/>
  </g>

  <!-- Speed Polyline -->
  <polyline points="50,260 100,60 200,60 250,160 300,160 350,260" fill="none" stroke="#0275d8" stroke-width="2.5"/>

  <!-- Key points -->
  <g fill="#d9534f" stroke="#ffffff" stroke-width="1">
    <circle cx="100" cy="60" r="4"/>
    <circle cx="200" cy="60" r="4"/>
    <circle cx="250" cy="160" r="4"/>
    <circle cx="300" cy="160" r="4"/>
    <circle cx="350" cy="260" r="4"/>
  </g>

  <!-- Axis Tick Labels -->
  <g font-family="sans-serif" font-size="12" fill="#222222">
    <!-- X axis ticks -->
    <text x="100" y="278" text-anchor="middle">10</text>
    <text x="150" y="278" text-anchor="middle">20</text>
    <text x="200" y="278" text-anchor="middle">30</text>
    <text x="250" y="278" text-anchor="middle">40</text>
    <text x="300" y="278" text-anchor="middle">50</text>
    <text x="350" y="278" text-anchor="middle">60</text>
    <!-- Y axis ticks -->
    <text x="42" y="164" text-anchor="end">40</text>
    <text x="42" y="64" text-anchor="end">80</text>
  </g>
</svg>
