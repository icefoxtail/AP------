<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 320" width="380" height="320" role="img" aria-labelledby="q06-title q06-desc">
  <title id="q06-title">조깅 시간과 소모 열량 사이의 정비례 그래프</title>
  <desc id="q06-desc">조깅 시간 x분과 소모 열량 y kcal의 관계를 나타낸 직선 그래프로, 점 (15, 120)을 지나는 그림</desc>
  <rect width="380" height="320" fill="#ffffff"/>

  <!-- Coordinate Axes -->
  <g stroke="#333333" stroke-width="1.5">
    <!-- X axis -->
    <line x1="50" y1="260" x2="350" y2="260"/>
    <polyline points="342,255 350,260 342,265" fill="none"/>
    <!-- Y axis -->
    <line x1="60" y1="270" x2="60" y2="30"/>
    <polyline points="55,38 60,30 65,38" fill="none"/>
  </g>

  <!-- Axis and Origin Labels -->
  <g font-family="sans-serif" font-size="14" fill="#111111" font-weight="bold">
    <text x="355" y="265">x</text>
    <text x="60" y="22" text-anchor="middle">y</text>
    <text x="46" y="276">O</text>
  </g>

  <!-- Axis Description Labels -->
  <g font-family="sans-serif" font-size="12" fill="#555555">
    <text x="340" y="285" text-anchor="end">(분)</text>
    <text x="75" y="45">(kcal)</text>
  </g>

  <!-- Dashed Guidelines for Point (15, 120) -->
  <g stroke="#888888" stroke-width="1.2" stroke-dasharray="4,4">
    <line x1="240" y1="260" x2="240" y2="80"/>
    <line x1="60" y1="80" x2="240" y2="80"/>
  </g>

  <!-- Graph Line y = 8x -->
  <line x1="60" y1="260" x2="310" y2="10" stroke="#0275d8" stroke-width="2.5"/>

  <!-- Marked Point (15, 120) -->
  <circle cx="240" cy="80" r="4.5" fill="#d9534f" stroke="#ffffff" stroke-width="1"/>

  <!-- Tick Labels -->
  <g font-family="sans-serif" font-size="13" fill="#222222">
    <text x="240" y="280" text-anchor="middle">15</text>
    <text x="52" y="85" text-anchor="end">120</text>
  </g>
</svg>
