<title id="title">20번 해설 — 원·포물선과 직선 y = tx 위의 P, Q</title>
<desc id="desc">t=0.7인 예시에서 반지름 제곱이 2인 원과 y=x², y=0.7x를 나타낸다. P는 원과 직선의 제1사분면 교점, Q는 포물선과 직선의 원점 이외 제1사분면 교점이다. P와 Q는 같은 반직선에 있으며 원점에서의 거리는 OP=√2, OQ=t√(1+t²)이다. 해설의 극한은 t가 1의 왼쪽에서 접근할 때를 다룬다.</desc>
