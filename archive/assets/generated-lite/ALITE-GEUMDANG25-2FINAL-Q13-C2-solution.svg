<svg xmlns="http://www.w3.org/2000/svg" width="640" height="340" viewBox="0 0 640 340" role="img" aria-labelledby="title desc"><title id="title">C2 울타리 넓이가 최대인 직사각형</title><desc id="desc">울타리 조건 2x+y=24, 산술평균과 기하평균 등호 조건 2x=y=12이므로 x=6,y=12. 직사각형의 넓이 72제곱미터를 표시한다.</desc><rect width="640" height="340" fill="#fff"/><rect x="20" y="18" width="600" height="301" rx="10" fill="#f9fbfc" stroke="#e0e6ea"/><text x="38" y="53" font-size="19" font-weight="bold" fill="#183e57">세 변 울타리: 2x+y = 24 m</text><line x1="113" y1="113" x2="444" y2="113" stroke="#6b777e" stroke-width="9"/><text x="281" y="96" font-size="17" fill="#495764" text-anchor="middle">담장</text><rect x="150" y="117" width="240" height="120" fill="#d9eee8"/><path d="M150 117 V237 H390 V117" stroke="#14687a" stroke-width="3" fill="none"/><text x="132" y="187" font-size="18" fill="#174e60">6 m</text><text x="270" y="266" text-anchor="middle" font-size="18" fill="#174e60">12 m</text><text x="270" y="187" font-size="23" font-weight="bold" text-anchor="middle" fill="#155c64">72 m²</text><text x="430" y="165" font-size="17" fill="#364c5b">등호 조건</text><text x="430" y="198" font-size="18" fill="#176c6c">2x = y = 12</text><text x="430" y="227" font-size="17" fill="#364c5b">x=6</text></svg>
