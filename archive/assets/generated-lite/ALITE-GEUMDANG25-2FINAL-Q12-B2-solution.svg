<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="390" viewBox="0 0 640 390" role="img" aria-labelledby="title desc">
<title id="title">금당고 Q12 B2 혼합 부등식의 대우</title><desc id="desc">명제 결론이 거짓인 영역은 x가 2보다 작고 y가 음수 1보다 큰 부분이다. 경계점 (2,-1)은 포함되지 않는다.</desc>
<rect width="640" height="390" fill="#ffffff"/><rect x="22" y="20" width="595" height="349" rx="9" fill="#fcfdfe" stroke="#e3e8eb"/>
<line x1="46" y1="250" x2="593" y2="250" stroke="#7b8d9b" stroke-width="1.4"/>
<line x1="300" y1="45" x2="300" y2="358" stroke="#7b8d9b" stroke-width="1.4"/>
<text x="585" y="241" font-size="14" fill="#475d69">x</text><text x="307" y="60" font-size="14" fill="#475d69">y</text>
<rect x="46" y="45" width="338" height="247" fill="#dceeed"/><line x1="384" y1="45" x2="384" y2="355" stroke="#a84d35" stroke-width="2" stroke-dasharray="8 6"/><line x1="46" y1="292" x2="595" y2="292" stroke="#a84d35" stroke-width="2" stroke-dasharray="8 6"/><circle cx="384" cy="292" r="6" fill="white" stroke="#a84d35" stroke-width="2"/><text x="104" y="112" font-size="16" fill="#243949" >x&lt;2, y&gt;−1</text><text x="104" y="143" font-size="16" fill="#243949" >4x−2y &lt; 10</text><text x="391" y="65" font-size="16" fill="#243949" >x=2</text><text x="490" y="281" font-size="16" fill="#243949" >y=−1</text><text x="396" y="317" font-size="16" fill="#243949" >경계 제외</text>
</svg>
