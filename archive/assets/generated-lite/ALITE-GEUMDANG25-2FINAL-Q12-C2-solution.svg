<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="390" viewBox="0 0 640 390" role="img" aria-labelledby="title desc">
<title id="title">금당고 Q12 C2 정수 조건의 거짓 결론</title><desc id="desc">정수 조건 x+y=5에서 거짓 결론을 만드는 세 점은 (1,4), (2,3), (3,2)이며 식의 값은 각각 22,19,16이다.</desc>
<rect width="640" height="390" fill="#ffffff"/><rect x="22" y="20" width="595" height="349" rx="9" fill="#fcfdfe" stroke="#e3e8eb"/>
<line x1="46" y1="250" x2="593" y2="250" stroke="#7b8d9b" stroke-width="1.4"/>
<line x1="300" y1="45" x2="300" y2="358" stroke="#7b8d9b" stroke-width="1.4"/>
<text x="585" y="241" font-size="14" fill="#475d69">x</text><text x="307" y="60" font-size="14" fill="#475d69">y</text>
<line x1="300" y1="40" x2="510" y2="250" stroke="#8faab5" stroke-width="2.5"/><circle cx="342" cy="82" r="7" fill="#0d7164"/><text x="298" y="69" font-size="16" fill="#243949" >22</text><circle cx="384" cy="124" r="7" fill="#426a84"/><text x="394" y="111" font-size="16" fill="#243949" >19</text><circle cx="426" cy="166" r="7" fill="#426a84"/><text x="436" y="153" font-size="16" fill="#243949" >16</text><circle cx="300" cy="40" r="6" fill="white" stroke="#ad5037" stroke-width="2"/><text x="65" y="95" font-size="16" fill="#243949" >(0,5)는 결론 참</text><text x="86" y="320" font-size="16" fill="#243949" >거짓 결론에서 최대 22</text><text x="344" y="345" font-size="16" fill="#243949" >정수 k는 23부터 가능</text>
</svg>
