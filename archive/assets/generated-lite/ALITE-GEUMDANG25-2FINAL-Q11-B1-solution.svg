<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="268" viewBox="0 0 720 268" role="img" aria-labelledby="title desc">
<title id="title">Q11 B1 양의 약수 집합 포함관계 해설</title><desc id="desc">가능한 후보 2, 4, 6, 12, 18, 36 중 추가 조건을 만족하는 수 2, 4, 6, 12, 18, 36를 강조한다.</desc>
<rect width="720" height="268" fill="#fff"/><rect x="18" y="15" width="684" height="235" rx="10" fill="#fbfcfd" stroke="#dce4ea"/>
<text x="40" y="51" font-size="19" font-weight="bold" fill="#153a54">집합의 포함관계로 가능한 n 찾기</text>
<text x="40" y="87" font-size="15" fill="#344f62">기본 후보: 2, 4, 6, 12, 18, 36</text>
<text x="680" y="87" font-size="14" text-anchor="end" fill="#33645d">집합의 교집합·합집합으로 후보 결정</text>
<rect x="52.5" y="119" width="90" height="52" rx="8" fill="#dff2ee" stroke="#1a756a" stroke-width="2"/><text x="97.5" y="152" font-size="19" font-weight="bold" text-anchor="middle" fill="#0f544e">2</text>
<rect x="157.5" y="119" width="90" height="52" rx="8" fill="#dff2ee" stroke="#1a756a" stroke-width="2"/><text x="202.5" y="152" font-size="19" font-weight="bold" text-anchor="middle" fill="#0f544e">4</text>
<rect x="262.5" y="119" width="90" height="52" rx="8" fill="#dff2ee" stroke="#1a756a" stroke-width="2"/><text x="307.5" y="152" font-size="19" font-weight="bold" text-anchor="middle" fill="#0f544e">6</text>
<rect x="367.5" y="119" width="90" height="52" rx="8" fill="#dff2ee" stroke="#1a756a" stroke-width="2"/><text x="412.5" y="152" font-size="19" font-weight="bold" text-anchor="middle" fill="#0f544e">12</text>
<rect x="472.5" y="119" width="90" height="52" rx="8" fill="#dff2ee" stroke="#1a756a" stroke-width="2"/><text x="517.5" y="152" font-size="19" font-weight="bold" text-anchor="middle" fill="#0f544e">18</text>
<rect x="577.5" y="119" width="90" height="52" rx="8" fill="#dff2ee" stroke="#1a756a" stroke-width="2"/><text x="622.5" y="152" font-size="19" font-weight="bold" text-anchor="middle" fill="#0f544e">36</text>
<text x="40" y="213" font-size="15" fill="#436977">색이 진한 칸: 최종 조건까지 만족</text>
<text x="680" y="213" font-size="16" font-weight="bold" text-anchor="end" fill="#1b6256">최종 2, 4, 6, 12, 18, 36</text>
</svg>