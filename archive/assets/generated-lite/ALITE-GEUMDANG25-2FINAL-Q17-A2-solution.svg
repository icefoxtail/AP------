<svg xmlns="http://www.w3.org/2000/svg" width="780" height="470" viewBox="0 0 780 470" role="img" aria-labelledby="title desc"><title id="title">금당고 q17 A2 집합 조건의 가능한 자연수</title><desc id="desc">A는 2,3,5,7로 구성된다. 원소 합 7, C는 2의 배수, 합집합 개수 6부터 8. 만족하는 k는 7,10, 합은 17이다.</desc><rect width="780" height="470" fill="#FFFFFF"/><rect x="20" y="16" width="740" height="438" rx="13" fill="#fcfdfe" stroke="#dce6ea"/><text x="42" y="48" font-size="23" font-weight="bold" fill="#183d51">집합의 두 조건을 동시에 만족하는 k</text><rect x="42" y="77" width="215" height="93" rx="8" fill="#eaf2f5"/><rect x="268" y="77" width="216" height="93" rx="8" fill="#eaf4ef"/><rect x="495" y="77" width="239" height="93" rx="8" fill="#f5f0e9"/><text x="58" y="108" font-size="16" fill="#475f72">A ∩ B 원소의 합</text><text x="58" y="146" font-size="29" font-weight="bold" fill="#21546b">7</text><text x="285" y="108" font-size="16" fill="#475f72">n(A ∪ C) 허용 범위</text><text x="285" y="146" font-size="27" font-weight="bold" fill="#226959">6 ~ 8</text><text x="512" y="108" font-size="16" fill="#475f72">k의 탐색 범위</text><text x="512" y="146" font-size="26" font-weight="bold" fill="#855835">6 ~ 11</text><text x="44" y="202" font-size="17" fill="#526b75">A = {2, 3, 5, 7} · C는 2의 양의 배수</text><rect x="42" y="212" width="694" height="36" rx="6" fill="#dfe9ee"/><text x="69" y="236" font-size="16" font-weight="bold" fill="#23465c">k</text><text x="242" y="236" font-size="16" font-weight="bold" fill="#23465c">A ∩ B</text><text x="524" y="236" font-size="16" font-weight="bold" fill="#23465c">n(A ∪ C)</text><rect x="43" y="249" width="692" height="24" fill="#f3f8fa"/><text x="69" y="260" font-size="19" font-weight="bold" fill="#153d52">7</text><text x="242" y="260" font-size="18" fill="#1c5366">{7}</text><text x="524" y="260" font-size="18" fill="#28685f">6</text><rect x="43" y="276" width="692" height="44" fill="#fff"/><text x="69" y="307" font-size="19" font-weight="bold" fill="#153d52">10</text><text x="242" y="307" font-size="18" fill="#1c5366">{2, 5}</text><text x="524" y="307" font-size="18" fill="#28685f">8</text><text x="47" y="433" font-size="22" font-weight="bold" fill="#16645d">가능한 k의 합 = 7 + 10 = 17</text></svg>
