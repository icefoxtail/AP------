<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="268" viewBox="0 0 720 268" role="img" aria-labelledby="title desc">
<title id="title">Q11 B3 양의 약수 집합 포함관계 해설</title><desc id="desc">가능한 후보 2, 6, 10, 30 중 추가 조건을 만족하는 수 6, 30를 강조한다.</desc>
<rect width="720" height="268" fill="#fff"/><rect x="18" y="15" width="684" height="235" rx="10" fill="#fbfcfd" stroke="#dce4ea"/>
<text x="40" y="51" font-size="19" font-weight="bold" fill="#153a54">집합의 포함관계로 가능한 n 찾기</text>
<text x="40" y="87" font-size="15" fill="#344f62">기본 후보: 2, 6, 10, 30</text>
<text x="680" y="87" font-size="14" text-anchor="end" fill="#33645d">추가 조건: 3의 배수</text>
<rect x="157.5" y="119" width="90" height="52" rx="8" fill="#f2f4f6" stroke="#a8b1b9" stroke-width="1.3"/><text x="202.5" y="152" font-size="19" font-weight="normal" text-anchor="middle" fill="#65727d">2</text>
<rect x="262.5" y="119" width="90" height="52" rx="8" fill="#dff2ee" stroke="#1a756a" stroke-width="2"/><text x="307.5" y="152" font-size="19" font-weight="bold" text-anchor="middle" fill="#0f544e">6</text>
<rect x="367.5" y="119" width="90" height="52" rx="8" fill="#f2f4f6" stroke="#a8b1b9" stroke-width="1.3"/><text x="412.5" y="152" font-size="19" font-weight="normal" text-anchor="middle" fill="#65727d">10</text>
<rect x="472.5" y="119" width="90" height="52" rx="8" fill="#dff2ee" stroke="#1a756a" stroke-width="2"/><text x="517.5" y="152" font-size="19" font-weight="bold" text-anchor="middle" fill="#0f544e">30</text>
<text x="40" y="213" font-size="15" fill="#436977">색이 진한 칸: 최종 조건까지 만족</text>
<text x="680" y="213" font-size="16" font-weight="bold" text-anchor="end" fill="#1b6256">최종 6, 30</text>
</svg>