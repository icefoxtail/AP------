<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="588" height="180" viewBox="0 0 588 180" role="img"><title>두 합성함수의 순서 비교</title><desc>f와 g를 다른 순서로 합성하여 상수항을 비교한 해설 표이다.</desc>
<rect x="14" y="14" width="186.666667" height="50.666667" fill="white" stroke="#111" stroke-width="1"/><text x="107.333333" y="39.333333" text-anchor="middle" dominant-baseline="middle" font-size="13">순서</text>
<rect x="200.666667" y="14" width="186.666667" height="50.666667" fill="white" stroke="#111" stroke-width="1"/><text x="294" y="39.333333" text-anchor="middle" dominant-baseline="middle" font-size="13">f ◦ g</text>
<rect x="387.333333" y="14" width="186.666667" height="50.666667" fill="white" stroke="#111" stroke-width="1"/><text x="480.666667" y="39.333333" text-anchor="middle" dominant-baseline="middle" font-size="13">g ◦ f</text>
<rect x="14" y="64.666667" width="186.666667" height="50.666667" fill="white" stroke="#111" stroke-width="1"/><text x="107.333333" y="90" text-anchor="middle" dominant-baseline="middle" font-size="13">먼저</text>
<rect x="200.666667" y="64.666667" width="186.666667" height="50.666667" fill="white" stroke="#111" stroke-width="1"/><text x="294" y="90" text-anchor="middle" dominant-baseline="middle" font-size="13">g(x)=2x−1</text>
<rect x="387.333333" y="64.666667" width="186.666667" height="50.666667" fill="white" stroke="#111" stroke-width="1"/><text x="480.666667" y="90" text-anchor="middle" dominant-baseline="middle" font-size="13">f(x)=ax+b</text>
<rect x="14" y="115.333333" width="186.666667" height="50.666667" fill="white" stroke="#111" stroke-width="1"/><text x="107.333333" y="140.666667" text-anchor="middle" dominant-baseline="middle" font-size="13">결과</text>
<rect x="200.666667" y="115.333333" width="186.666667" height="50.666667" fill="white" stroke="#111" stroke-width="1"/><text x="294" y="140.666667" text-anchor="middle" dominant-baseline="middle" font-size="13">2ax−a+b</text>
<rect x="387.333333" y="115.333333" width="186.666667" height="50.666667" fill="white" stroke="#111" stroke-width="1"/><text x="480.666667" y="140.666667" text-anchor="middle" dominant-baseline="middle" font-size="13">2ax+2b−1</text>
</svg>
