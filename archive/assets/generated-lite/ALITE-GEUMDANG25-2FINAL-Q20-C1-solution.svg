<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 320 180" role="img" aria-labelledby="t d"><title id="t">역함수 존재를 위한 경계와 단조성 (C1)</title><desc id="d">x=r에서 두 치역이 y=L로 이어진다. 왼쪽 직선은 y&lt;L, 오른쪽 포물선은 경계에서 꼭짓점을 갖고 y≥L을 단조 증가하며 채운다. 최소 a=6.</desc><defs><clipPath id="plot-c1"><rect x="24" y="31" width="272" height="124"/></clipPath></defs><rect width="320" height="180" fill="#fff"/><text x="12" y="15" font-size="9" font-family="sans-serif">r=1, L=6, a_min=6</text><line x1="24" y1="110" x2="296" y2="110" stroke="#888" stroke-dasharray="3 3"/><line x1="160" y1="31" x2="160" y2="155" stroke="#888" stroke-dasharray="3 3"/><g clip-path="url(#plot-c1)"><line x1="30" y1="149" x2="160" y2="110" stroke="#2166ac" stroke-width="2.3"/><path d="M160 110 Q210 105 250 74 T296 34" fill="none" stroke="#b2182b" stroke-width="2.5"/></g><circle cx="160" cy="110" r="3.5" fill="#b2182b" stroke="#111" stroke-width=".7"/><text x="30" y="43" font-size="8" font-family="sans-serif">x&lt;r: (-∞, L)</text><text x="203" y="43" font-size="8" font-family="sans-serif">x≥r: [L, ∞)</text><text x="165" y="124" font-size="8" font-family="sans-serif">(r,L) 포함</text><text x="165" y="151" font-size="8" font-family="sans-serif">x=r</text><text x="27" y="106" font-size="8" font-family="sans-serif">y=L</text><text x="265" y="166" font-size="8" font-family="sans-serif">x 증가</text><text x="24" y="166" font-family="sans-serif" font-size="13" fill="#263238">역상 확인: g⁻¹(6, 5) → 1</text>
</svg>
