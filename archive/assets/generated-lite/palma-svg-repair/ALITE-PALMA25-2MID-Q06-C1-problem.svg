<svg xmlns="http://www.w3.org/2000/svg" width="640" height="340" viewBox="0 0 640 340" role="img" aria-labelledby="svg-title-0c97996997" aria-describedby="svg-desc-0c97996997"><title id="svg-title-0c97996997">원과 직선이 만드는 현의 길이 조건</title><desc id="svg-desc-0c97996997">원 x²+y²=25와 직선 3x+4y=k가 현 AB를 만든다. AB의 길이가 8 이상이 되도록 하는 정수 k의 개수를 묻는다.</desc><style>text{font-family:Arial,"Noto Sans KR",sans-serif;fill:#111;font-size:28px}.small{font-size:28px}.circle{fill:none;stroke:#176B87;stroke-width:4}.chord{stroke:#333;stroke-width:4}.center{fill:#176B87}</style><text x="24" y="42">주어진 원과 현</text><text x="370" y="100">x²+y²=25</text><text x="370" y="140">3x+4y=k</text><text x="370" y="180">AB≥8</text><circle cx="200" cy="205" r="92" class="circle"/><circle cx="200" cy="205" r="4" class="center"/><text x="212" y="230">O</text><line x1="157.720591" y1="123.290444" x2="290.279409" y2="222.709556" class="chord"/><circle cx="157.720591" cy="123.290444" r="4" class="center"/><circle cx="290.279409" cy="222.709556" r="4" class="center"/><text x="133.720591" y="115.290444">A</text><text x="298.279409" y="236.709556">B</text></svg>