<title id="svg-title-ac52965860">삼각형의 내분점과 무게중심 조건</title>
<desc id="svg-desc-ac52965860">O=(0,0), A=(12,0), B=(p,9)이다. C는 OA의 중점, AD:DB=1:2인 D, BE:EO=2:1인 E를 정한다. △CDE의 무게중심이 x+y=8 위에 있을 때 AB의 길이를 묻는다.</desc><style>text{font-family:"Noto Sans KR","Malgun Gothic",sans-serif;fill:#17212b} .axis{stroke:#536273;stroke-width:1.5} .given{stroke:#243b53;stroke-width:2.6;fill:none} .derived{stroke:#167d8d;stroke-width:2.2;fill:none} .aux{stroke:#75879a;stroke-width:1.6;stroke-dasharray:5 4;fill:none} .accent{stroke:#db7b2b;stroke-width:2.4;fill:none} .point{fill:#17212b} .derived-point{fill:#167d8d} .label{font-size:13.5px} .small{font-size:12.8px} .title{font-size:15px;font-weight:700} .card{fill:#f4f7fa;stroke:#d6dfe7;stroke-width:1} .main{fill:#e6f2f4;stroke:#167d8d;stroke-width:1.8} </style>
