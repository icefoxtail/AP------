<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420" role="img" aria-labelledby="svg-title-ab4e706e7c" aria-describedby="svg-desc-ab4e706e7c"><title id="svg-title-ab4e706e7c">두 원의 넓이를 함께 이등분하는 직선</title><desc id="svg-desc-ab4e706e7c">원 C₁: x²+(y+1)²=1을 x방향으로 p, y방향으로 6만큼 평행이동해 C₂를 만든다. 두 원의 넓이를 모두 이등분하는 직선이 y=2x−1일 때 p를 묻는다.</desc><rect width="100%" height="100%" fill="#fff"/><circle id="circle-C1" cx="185" cy="245" r="48" fill="#eff6ff" stroke="#172033" stroke-width="3"/><circle id="circle-C2" cx="278" cy="150" r="48" fill="#fff7ed" stroke="#172033" stroke-width="3"/><circle id="center-C1" cx="185" cy="245" r="5" fill="#172033"/><circle id="center-C2" cx="278" cy="150" r="5" fill="#172033"/><defs><marker id="given-translation-head" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#475569"/></marker></defs><line id="given-translation" x1="185" y1="245" x2="278" y2="150" stroke="#475569" stroke-width="3.5" marker-end="url(#given-translation-head)"/><text x="410" y="210" text-anchor="middle" font-family="'Noto Sans KR','Pretendard','Malgun Gothic',sans-serif" font-size="27px" font-weight="650" fill="#334155">(+p, +6)</text><text id="label-C1" x="185.0" y="333" text-anchor="middle" font-family="'Noto Sans KR','Pretendard','Malgun Gothic',sans-serif" font-size="27px" font-weight="650" fill="#172033">C₁</text><text id="label-C2" x="278.0" y="92.0" text-anchor="middle" font-family="'Noto Sans KR','Pretendard','Malgun Gothic',sans-serif" font-size="27px" font-weight="650" fill="#172033">C₂</text></svg>