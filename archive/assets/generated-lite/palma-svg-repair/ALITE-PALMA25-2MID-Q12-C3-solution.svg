<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="638" height="420" viewBox="0 0 638 420" role="img">
<style>text{font-family:Arial,sans-serif;fill:#111}.head{font-size:17px;font-weight:700}.body{font-size:14px}.muted{fill:#444}.rule{stroke:#bbb;stroke-width:1}</style>
<text x="18" y="28" class="head">접선의 현과 수선의 길이 관계</text>
<svg x="10" y="52" width="316" height="316" viewBox="0 0 316 316" role="img">
<style>.axis{stroke:#111;stroke-width:1.2}.shape,.curve{fill:none;stroke:#111;stroke-width:1.8}.guide{fill:none;stroke:#555;stroke-width:1;stroke-dasharray:5 4}.point{fill:#111}.radius{fill:none;stroke:#1f4e79;stroke-width:1.5}.tangent{fill:none;stroke:#111;stroke-width:2.1}.perpendicular{fill:none;stroke:#555;stroke-width:1;stroke-dasharray:3 3}.right-angle{fill:none;stroke:#111;stroke-width:1.2}.center-point{fill:#1f4e79}.element-label,.annotation{font:13px sans-serif}.annotation{font-style:italic}text{font:14px sans-serif;fill:#111}.cell{fill:#fff;stroke:#111;stroke-width:1}.cell-text{text-anchor:middle;dominant-baseline:middle;font:13px sans-serif}</style>
<line x1="149" y1="32" x2="149" y2="284" class="axis"/>
<line x1="32" y1="158" x2="284" y2="158" class="axis"/>
<line x1="293" y1="158" x2="185" y2="95.646171" class="tangent"/>
<text x="244" y="121.823085" class="element-label">ℓ</text>
<line x1="293" y1="158" x2="185" y2="220.353829" class="tangent"/>
<line x1="185" y1="95.646171" x2="185" y2="220.353829" class="shape"/>
<line x1="149" y1="158" x2="185" y2="158" class="perpendicular"/>
<text x="172" y="153" class="element-label">d</text>
<line x1="149" y1="158" x2="185" y2="95.646171" class="radius"/>
<text x="172" y="121.823085" class="element-label">r</text>
<circle cx="149" cy="158" r="3" class="point"/>
<text x="155" y="152">O</text>
<circle cx="293" cy="158" r="3" class="point"/>
<text x="240.6" y="171">A(8,0)</text>
<circle cx="185" cy="95.646171" r="3" class="point"/>
<text x="191" y="89.646171">P</text>
<circle cx="185" cy="220.353829" r="3" class="point"/>
<text x="191" y="214.353829">Q</text>
<circle cx="185" cy="158" r="3" class="point"/>
<text x="191" y="152">H</text>
<polyline points="179,106.038476 189.392305,112.038476 195.392305,101.646171" class="right-angle"/>
<circle cx="149" cy="158" r="72" class="shape"/>
<circle cx="149" cy="158" r="3.4" class="center-point"/>
<text x="46.4" y="50" class="annotation">모양은 개략</text>
<text x="46.4" y="266" class="annotation">d+ℓ=19/2</text>
</svg>

<line x1="333" y1="54" x2="333" y2="390" class="rule"/>
<text x="350" y="78" class="head">결정 관계</text>
<text x="350" y="112" class="body">PQ: 8x=r²</text>
<text x="350" y="140" class="body">OH=d=r²/8</text>
<text x="350" y="178" class="body">OP ⟂ AP, OA=8</text>
<text x="350" y="206" class="body">r²+ℓ²=64</text>
<text x="350" y="244" class="body">d+ℓ=19/2</text>
<text x="350" y="272" class="body">(64−ℓ²)/8+ℓ=19/2</text>
<text x="350" y="300" class="body">ℓ²−8ℓ+12=0</text>
<text x="350" y="328" class="body">ℓ=2 또는 6</text>
<text x="350" y="356" class="body">r²=60 또는 28</text>
<text x="350" y="388" class="head">60+28=88</text>
</svg>
