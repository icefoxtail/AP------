<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="638" height="340" viewBox="0 0 638 340" role="img" aria-labelledby="svg-title-d09da1d5c2" aria-describedby="svg-desc-d09da1d5c2">
<title id="svg-title-d09da1d5c2">원의 중심을 옮기고 대칭이동한 결과</title>
<desc id="svg-desc-d09da1d5c2">원 C의 중심은 (1,−2), 반지름은 3이다. (2,−1)만큼 평행이동하면 중심 (3,−3), y=x에 대하여 대칭이동하면 중심 (−3,3)이 된다. 반지름은 유지되어 최종 방정식은 (x+3)²+(y−3)²=9이다.</desc><style>text{font-family:"Noto Sans KR","Malgun Gothic",sans-serif;fill:#17212b} .axis{stroke:#536273;stroke-width:1.5} .given{stroke:#243b53;stroke-width:2.6;fill:none} .derived{stroke:#167d8d;stroke-width:2.2;fill:none} .aux{stroke:#75879a;stroke-width:1.6;stroke-dasharray:5 4;fill:none} .accent{stroke:#db7b2b;stroke-width:2.4;fill:none} .point{fill:#17212b} .derived-point{fill:#167d8d} .label{font-size:13.5px} .small{font-size:12.8px} .title{font-size:15px;font-weight:700} .card{fill:#f4f7fa;stroke:#d6dfe7;stroke-width:1} .main{fill:#e6f2f4;stroke:#167d8d;stroke-width:1.8} </style>
<rect x="376" y="18" width="246" height="304" rx="12" class="card"/>
<line id="q03-x-axis" x1="42.00" y1="166.00" x2="378.00" y2="166.00" class="axis"/><line id="q03-y-axis" x1="210.00" y1="292.00" x2="210.00" y2="19.00" class="axis"/><line id="q03-y-equals-x" x1="84.00" y1="292.00" x2="357.00" y2="19.00" class="aux"/>
<circle id="q03-initial-circle" cx="231.00" cy="208.00" r="63" class="given"/><circle id="q03-initial-center" cx="231.00" cy="208.00" r="3.8" class="point"/>
<circle id="q03-translated-circle" cx="273.00" cy="229.00" r="63" class="accent"/><circle id="q03-translated-center" cx="273.00" cy="229.00" r="3.8" class="point"/>
<circle id="q03-final-circle" cx="147.00" cy="103.00" r="63" class="derived"/><circle id="q03-final-center" cx="147.00" cy="103.00" r="3.8" class="point"/>
<line id="q03-radius-3" x1="231.00" y1="208.00" x2="294.00" y2="208.00" class="derived"/><text x="252.00" y="197.50" class="small">r=3</text>
<line id="q03-translate-stage-arrow" x1="238.35" y1="211.15" x2="264.60" y2="224.80" class="accent" marker-end="url(#q03Arrow)"/><line id="q03-reflect-stage-arrow" x1="267.75" y1="222.70" x2="155.40" y2="111.40" class="derived" marker-end="url(#q03Arrow2)"/><defs><marker id="q03Arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#db7b2b"/></marker><marker id="q03Arrow2" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#167d8d"/></marker></defs>
<line id="q03-initial-center-owner-leader" x1="226.00" y1="203.00" x2="229.00" y2="207.00" class="aux"/><text x="216.00" y="210.00" class="small">O</text>
<text x="281.00" y="245.00" class="small">O₁(3, -3)</text>
<text x="116.00" y="95.00" class="small">O₂(-3, 3)</text>
<text x="336.00" y="35.00" class="small">y=x</text>
<text x="395" y="48" class="title">변환 순서</text><text x="395" y="83" class="label">① 중심 (1,−2)</text><text x="414" y="106" class="label">+(2,−1) → (3,−3)</text><text x="395" y="145" class="label">② y=x 대칭</text><text x="414" y="168" class="label">(3,−3) → (−3,3)</text><line x1="395" y1="190" x2="602" y2="190" class="aux"/><text x="395" y="221" class="label">반지름은 3으로 유지</text><text x="395" y="260" class="label">최종 중심 (−3,3)</text><text x="395" y="288" class="label">(x+3)²+(y−3)²=9</text>
</svg>