<svg xmlns="http://www.w3.org/2000/svg" width="640" height="340" viewBox="0 0 640 340" role="img" aria-labelledby="svg-title-401ed9df68" aria-describedby="svg-desc-401ed9df68"><title id="svg-title-401ed9df68">원의 현의 중점과 직선 조건</title><desc id="svg-desc-401ed9df68">원 x²+y²=25와 직선 3x+4y=k가 현 AB를 만든다. 현의 중점 M은 직선 y=x+3/5 위에 있으며, 이 조건에서 현 AB의 길이를 묻는다.</desc><style>text{font-family:Arial,"Noto Sans KR",sans-serif;fill:#111;font-size:28px}.axis{stroke:#777;stroke-width:1.6}.circle{fill:none;stroke:#176B87;stroke-width:4}.chord{stroke:#333;stroke-width:4}.locus{stroke:#777;stroke-width:2.5;stroke-dasharray:8 6}.point{fill:#176B87}.small{font-size:28px}</style><text x="20" y="34">원의 현의 중점과 주어진 직선</text><line x1="220" y1="64" x2="220" y2="316" class="axis"/><line x1="62" y1="220" x2="370" y2="220" class="axis"/><circle cx="220" cy="220" r="100" class="circle"/><line x1="192" y1="124" x2="320" y2="220" class="chord"/><line x1="140" y1="288" x2="380" y2="48" class="locus"/><circle cx="220" cy="220" r="4" class="point"/><circle cx="192" cy="124" r="4" class="point"/><circle cx="320" cy="220" r="4" class="point"/><circle cx="256" cy="172" r="5" class="point"/><text x="204" y="244">O</text><text x="176" y="118">A</text><text x="326" y="236">B</text><text x="263" y="168">M</text><text x="365" y="106" class="small">y=x+3/5</text><text x="20" y="330" class="small">M은 AB의 중점</text></svg>