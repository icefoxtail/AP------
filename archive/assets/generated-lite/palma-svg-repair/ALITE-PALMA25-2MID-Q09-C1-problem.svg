<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420" role="img" aria-labelledby="svg-title-98f47d07fd" aria-describedby="svg-desc-98f47d07fd"><title id="svg-title-98f47d07fd">세 변의 내분점과 두 무게중심 사이 거리</title><desc id="svg-desc-98f47d07fd">O=(0,0), A=(12,0), B=(0,12)이다. OC:CA=1:2, AD:DB=1:2, BE:EO=2:1인 C,D,E를 두고, 삼각형 OAB와 CDE의 무게중심을 H,G라 한다. GH의 길이를 묻는다.</desc><rect width="640" height="420" fill="#fff"/><line id="side-OA" x1="80.000" y1="360.000" x2="380.000" y2="360.000" stroke="#94a3b8" stroke-width="3"/><line id="side-AB" x1="380.000" y1="360.000" x2="80.000" y2="60.000" stroke="#94a3b8" stroke-width="3"/><line id="side-BO" x1="80.000" y1="60.000" x2="80.000" y2="360.000" stroke="#94a3b8" stroke-width="3"/><line id="side-CD" x1="180.000" y1="360.000" x2="280.000" y2="260.000" stroke="#2563eb" stroke-width="3.2"/><line id="side-DE" x1="280.000" y1="260.000" x2="80.000" y2="260.000" stroke="#2563eb" stroke-width="3.2"/><line id="side-EC" x1="80.000" y1="260.000" x2="180.000" y2="360.000" stroke="#2563eb" stroke-width="3.2"/><circle id="point-O" cx="80.000" cy="360.000" r="5" fill="#172033"/><circle id="point-A" cx="380.000" cy="360.000" r="5" fill="#172033"/><circle id="point-B" cx="80.000" cy="60.000" r="5" fill="#172033"/><circle id="point-C" cx="180.000" cy="360.000" r="5" fill="#172033"/><circle id="point-D" cx="280.000" cy="260.000" r="5" fill="#172033"/><circle id="point-E" cx="80.000" cy="260.000" r="5" fill="#172033"/><text x="70.000" y="384.000" text-anchor="end" font-family="'Noto Sans KR','Pretendard','Malgun Gothic',sans-serif" font-size="34px" font-weight="650" fill="#172033">O</text><text x="390.000" y="384.000" text-anchor="start" font-family="'Noto Sans KR','Pretendard','Malgun Gothic',sans-serif" font-size="34px" font-weight="650" fill="#172033">A</text><text x="90.000" y="96.000" text-anchor="start" font-family="'Noto Sans KR','Pretendard','Malgun Gothic',sans-serif" font-size="34px" font-weight="650" fill="#172033">B</text><text x="190.000" y="349.000" text-anchor="start" font-family="'Noto Sans KR','Pretendard','Malgun Gothic',sans-serif" font-size="34px" font-weight="650" fill="#172033">C</text><text x="290.000" y="281.000" text-anchor="start" font-family="'Noto Sans KR','Pretendard','Malgun Gothic',sans-serif" font-size="34px" font-weight="650" fill="#172033">D</text><text x="71.000" y="282.000" text-anchor="end" font-family="'Noto Sans KR','Pretendard','Malgun Gothic',sans-serif" font-size="34px" font-weight="650" fill="#172033">E</text><text x="465.000" y="85.000" text-anchor="middle" font-family="'Noto Sans KR','Pretendard','Malgun Gothic',sans-serif" font-size="34px" font-weight="650" fill="#0f766e">OC:CA=1:2</text><text x="465.000" y="137.000" text-anchor="middle" font-family="'Noto Sans KR','Pretendard','Malgun Gothic',sans-serif" font-size="34px" font-weight="650" fill="#0f766e">AD:DB=1:2</text><text x="465.000" y="189.000" text-anchor="middle" font-family="'Noto Sans KR','Pretendard','Malgun Gothic',sans-serif" font-size="34px" font-weight="650" fill="#0f766e">BE:EO=2:1</text><text x="465.000" y="335.000" text-anchor="middle" font-family="'Noto Sans KR','Pretendard','Malgun Gothic',sans-serif" font-size="34px" font-weight="650" fill="#0f766e">H와 G는 무게중심</text><line id="axis-x" x1="35.000" y1="360.000" x2="610.000" y2="360.000" stroke="#cbd5e1" stroke-width="1.6"/><line id="axis-y" x1="80.000" y1="28.000" x2="80.000" y2="396.000" stroke="#cbd5e1" stroke-width="1.6"/></svg>