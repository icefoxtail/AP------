<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420" role="img" aria-labelledby="svg-title-d403dd0de9" aria-describedby="svg-desc-d403dd0de9"><title id="svg-title-d403dd0de9">내분점 삼각형의 무게중심과 넓이</title><desc id="svg-desc-d403dd0de9">O=(0,0), A=(12,0), B=(3,t), t&gt;0이다. OC:CA=1:2, D는 AB의 중점, BE:EO=2:1인 E를 두고 △CDE의 무게중심의 y좌표가 10/3일 때 넓이를 묻는다.</desc><rect width="640" height="420" fill="#fff"/><line id="side-OA" x1="70.000" y1="360.000" x2="370.000" y2="360.000" stroke="#94a3b8" stroke-width="3"/><line id="side-AB" x1="370.000" y1="360.000" x2="145.000" y2="135.000" stroke="#94a3b8" stroke-width="3"/><line id="side-BO" x1="145.000" y1="135.000" x2="70.000" y2="360.000" stroke="#94a3b8" stroke-width="3"/><line id="side-CD" x1="170.000" y1="360.000" x2="257.500" y2="247.500" stroke="#2563eb" stroke-width="3.2"/><line id="side-DE" x1="257.500" y1="247.500" x2="95.000" y2="285.000" stroke="#2563eb" stroke-width="3.2"/><line id="side-EC" x1="95.000" y1="285.000" x2="170.000" y2="360.000" stroke="#2563eb" stroke-width="3.2"/><circle id="point-O" cx="70.000" cy="360.000" r="5" fill="#172033"/><circle id="point-A" cx="370.000" cy="360.000" r="5" fill="#172033"/><circle id="point-B" cx="145.000" cy="135.000" r="5" fill="#172033"/><circle id="point-C" cx="170.000" cy="360.000" r="5" fill="#172033"/><circle id="point-D" cx="257.500" cy="247.500" r="5" fill="#172033"/><circle id="point-E" cx="95.000" cy="285.000" r="5" fill="#172033"/><text x="60.000" y="384.000" text-anchor="end" font-family="'Noto Sans KR','Pretendard','Malgun Gothic',sans-serif" font-size="34px" font-weight="650" fill="#172033">O</text><text x="380.000" y="384.000" text-anchor="start" font-family="'Noto Sans KR','Pretendard','Malgun Gothic',sans-serif" font-size="34px" font-weight="650" fill="#172033">A</text><text x="136.000" y="123.000" text-anchor="end" font-family="'Noto Sans KR','Pretendard','Malgun Gothic',sans-serif" font-size="34px" font-weight="650" fill="#172033">B(3,t)</text><text x="180.000" y="349.000" text-anchor="start" font-family="'Noto Sans KR','Pretendard','Malgun Gothic',sans-serif" font-size="34px" font-weight="650" fill="#172033">C</text><text x="267.500" y="268.500" text-anchor="start" font-family="'Noto Sans KR','Pretendard','Malgun Gothic',sans-serif" font-size="34px" font-weight="650" fill="#172033">D</text><text x="86.000" y="307.000" text-anchor="end" font-family="'Noto Sans KR','Pretendard','Malgun Gothic',sans-serif" font-size="34px" font-weight="650" fill="#172033">E</text><text x="460.000" y="85.000" text-anchor="middle" font-family="'Noto Sans KR','Pretendard','Malgun Gothic',sans-serif" font-size="34px" font-weight="650" fill="#0f766e">OC:CA=1:2</text><text x="460.000" y="137.000" text-anchor="middle" font-family="'Noto Sans KR','Pretendard','Malgun Gothic',sans-serif" font-size="34px" font-weight="650" fill="#0f766e">D는 AB의 중점</text><text x="460.000" y="189.000" text-anchor="middle" font-family="'Noto Sans KR','Pretendard','Malgun Gothic',sans-serif" font-size="34px" font-weight="650" fill="#0f766e">BE:EO=2:1</text><text x="460.000" y="241.000" text-anchor="middle" font-family="'Noto Sans KR','Pretendard','Malgun Gothic',sans-serif" font-size="34px" font-weight="650" fill="#0f766e">Gᵧ=10/3</text></svg>