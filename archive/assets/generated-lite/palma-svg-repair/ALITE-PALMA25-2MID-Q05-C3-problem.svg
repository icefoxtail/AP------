<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="svg-title-5ce3fc3fef" aria-describedby="svg-desc-5ce3fc3fef"><title id="svg-title-5ce3fc3fef">삼각형 ABC의 외심과 직선 y=2</title><desc id="svg-desc-5ce3fc3fef">A=(0,0), B=(6,0), C=(t,4)인 삼각형의 외심이 직선 y=2 위에 있다. 가능한 t를 묻는 조건을 나타낸다.</desc><style>text{font-family:Arial,"Noto Sans KR",sans-serif;fill:#111;font-size:25px}.triangle{stroke:#333;stroke-width:3;fill:none}.locus{stroke:#176B87;stroke-width:3}.point{fill:#176B87}.leader{stroke:#888;stroke-width:2;stroke-dasharray:6 4}</style><text x="24" y="38">삼각형과 외심의 주어진 자취</text><path d="M100 220 L245 220 L168 110 Z" class="triangle"/><circle cx="100" cy="220" r="5" class="point"/><circle cx="245" cy="220" r="5" class="point"/><circle cx="168" cy="110" r="5" class="point"/><text x="70" y="254">A(0,0)</text><text x="250" y="248">B(6,0)</text><text x="175" y="105">C(t,4)</text><line x1="335" y1="168" x2="596" y2="168" class="locus"/><circle cx="465" cy="168" r="5" class="point"/><text x="515" y="158">y=2</text><text x="420" y="202">외심은 자취 위</text><path d="M270 175 C300 150,310 150,330 160" class="leader" fill="none"/><text x="24" y="330" font-size="20px">중심좌표는 표시하지 않음</text></svg>