<line id="q03-reflection-line" x1="224" y1="143" x2="293" y2="74" class="aux"/><text x="263" y="61" class="small">y=x</text><circle id="q03-reflection-input-circle" cx="236" cy="85" r="10" class="aux"/><circle id="q03-reflected-circle" cx="282" cy="131" r="10" class="derived"/><line id="q03-reflection-operation" x1="243.071068" y1="92.071068" x2="274.928932" y2="123.928932" class="given" marker-end="url(#arrowBlue)"/><text x="214" y="143" class="small">직선 y=x에</text><text x="214" y="163" class="small">대하여 대칭</text>
