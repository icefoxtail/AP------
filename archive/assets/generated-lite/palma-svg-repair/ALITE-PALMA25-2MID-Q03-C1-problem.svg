<svg xmlns="http://www.w3.org/2000/svg" width="316" height="180" viewBox="0 0 316 180" role="img" aria-labelledby="svg-title-3fd8dcff76" aria-describedby="svg-desc-3fd8dcff76">
<title id="svg-title-3fd8dcff76">원에 평행이동과 대칭이동을 차례로 적용</title>
<desc id="svg-desc-3fd8dcff76">원 C:x²+y²−2x+4y−4=0을 (2,−1)만큼 평행이동한 뒤 직선 y=x에 대하여 대칭이동한다. 변환 후 원의 방정식을 묻는다.</desc><style>text{font-family:"Noto Sans KR","Malgun Gothic",sans-serif;fill:#17212b} .axis{stroke:#536273;stroke-width:1.5} .given{stroke:#243b53;stroke-width:2.6;fill:none} .derived{stroke:#167d8d;stroke-width:2.2;fill:none} .aux{stroke:#75879a;stroke-width:1.6;stroke-dasharray:5 4;fill:none} .accent{stroke:#db7b2b;stroke-width:2.4;fill:none} .point{fill:#17212b} .derived-point{fill:#167d8d} .label{font-size:13.5px} .small{font-size:12.8px} .title{font-size:15px;font-weight:700} .card{fill:#f4f7fa;stroke:#d6dfe7;stroke-width:1} .main{fill:#e6f2f4;stroke:#167d8d;stroke-width:1.8} </style>
<rect x="8" y="10" width="88" height="158" rx="9" class="card"/><rect x="108" y="10" width="88" height="158" rx="9" class="card"/><rect x="208" y="10" width="100" height="158" rx="9" class="card"/>
<text x="18" y="31" class="title">원 C</text><text x="117" y="31" class="title">평행이동</text><text x="216" y="31" class="title">대칭이동</text>
<circle id="q03-src-circle" cx="53" cy="101" r="31" class="given"/><circle id="q03-src-center" cx="53" cy="101" r="3.2" class="point"/><line id="q03-src-radius" x1="53" y1="101" x2="84" y2="101" class="derived"/><text x="47" y="121" class="small">O</text><text x="70" y="95" class="label">C</text><text x="62" y="116" class="small">r=3</text>
<line id="q03-translation-vector" x1="132" y1="80" x2="156" y2="92" class="accent" marker-end="url(#arrowOrange)"/><defs><marker id="arrowOrange" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#db7b2b"/></marker><marker id="arrowBlue" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#167d8d"/></marker></defs><text x="119" y="68" class="small">(+2,−1)</text>
