<svg xmlns="http://www.w3.org/2000/svg" width="640" height="340" viewBox="0 0 640 340" role="img" aria-labelledby="svg-title-4ffe566fbc" aria-describedby="svg-desc-4ffe566fbc"><title id="svg-title-4ffe566fbc">두 원을 동시에 가르는 평행선</title><desc id="svg-desc-4ffe566fbc">중심 O, 반지름 5인 원과 중심 (2,−1), 반지름 3인 원이 있다. 직선 3x+4y=t가 두 원 각각과 서로 다른 두 점에서 만나도록 하는 정수 t의 개수를 묻는다.</desc><style>text{font-family:Arial,"Noto Sans KR",sans-serif;fill:#111;font-size:28px}.small{font-size:28px}.circle{fill:none;stroke:#176B87;stroke-width:4}.axis{stroke:#777;stroke-width:1.5}.family{stroke:#444;stroke-width:2;stroke-dasharray:7 5;opacity:.75}</style><text x="22" y="36">두 원과 평행선의 이동</text><line x1="220" y1="66" x2="220" y2="300" class="axis"/><line x1="66" y1="190" x2="390" y2="190" class="axis"/><circle cx="220" cy="190" r="125" class="circle"/><circle cx="270" cy="215" r="75" class="circle"/><circle cx="220" cy="190" r="4" fill="#176B87"/><circle cx="270" cy="215" r="4" fill="#176B87"/><text x="226" y="214">C₁</text><text x="277" y="244">C₂</text><line x1="76" y1="120" x2="390" y2="355" class="family"/><line x1="70" y1="185" x2="300" y2="358" class="family"/><line x1="130" y1="70" x2="390" y2="265" class="family"/><text x="410" y="116">3x+4y=t</text><text x="410" y="154">t 변화</text></svg>