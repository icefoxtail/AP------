<svg xmlns="http://www.w3.org/2000/svg" width="640" height="460" viewBox="0 0 640 460" role="img" aria-labelledby="svg-title-15022e1f78" aria-describedby="svg-desc-15022e1f78"><title id="svg-title-15022e1f78">세 원 중심의 수직이등분선 관계</title><desc id="svg-desc-15022e1f78">반지름 1인 C₁의 중심은 O=(0,0), C₃의 중심은 (5,0), C₂의 중심은 (a,b)이다. C₁,C₂ 중심을 잇는 선분의 수직이등분선은 (2,1)을 지나고, C₂,C₃의 수직이등분선과 수직이다. C₂의 중심을 묻는다.</desc><rect width="100%" height="100%" fill="#fff"/><line id="given-OB" x1="150" y1="300" x2="400" y2="175" stroke="#2563eb" stroke-width="3"/><line id="given-BC" x1="400" y1="175" x2="525" y2="425" stroke="#7c3aed" stroke-width="3"/><circle id="circle-O" cx="150" cy="300" r="27" fill="#eff6ff" stroke="#172033" stroke-width="3"/><circle id="circle-B" cx="400" cy="175" r="27" fill="#fff7ed" stroke="#172033" stroke-width="3"/><circle id="circle-C" cx="525" cy="425" r="27" fill="#f0fdf4" stroke="#172033" stroke-width="3"/><circle id="point-O" cx="150" cy="300" r="5" fill="#172033"/><circle id="point-B" cx="400" cy="175" r="5" fill="#172033"/><circle id="point-C" cx="525" cy="425" r="5" fill="#172033"/><circle id="point-P" cx="250" cy="250" r="5" fill="#172033"/><polyline id="right-angle-B" points="384,183 392,199 408,191" fill="none" stroke="#b45309" stroke-width="3"/><text id="label-O" x="95" y="300" text-anchor="end" font-family="'Noto Sans KR','Pretendard','Malgun Gothic',sans-serif" font-size="38px" font-weight="650" fill="#172033">O</text><text id="label-B" x="400" y="120" text-anchor="middle" font-family="'Noto Sans KR','Pretendard','Malgun Gothic',sans-serif" font-size="38px" font-weight="650" fill="#172033">B</text><text id="label-C" x="565" y="425" text-anchor="start" font-family="'Noto Sans KR','Pretendard','Malgun Gothic',sans-serif" font-size="38px" font-weight="650" fill="#172033">C</text><text id="label-P" x="170" y="235" text-anchor="end" font-family="'Noto Sans KR','Pretendard','Malgun Gothic',sans-serif" font-size="38px" font-weight="650" fill="#172033">P(2,1)</text></svg>