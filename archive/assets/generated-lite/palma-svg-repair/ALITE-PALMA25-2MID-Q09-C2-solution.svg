<text x="383" y="72" class="label">C=(6,0), D=(10,3)</text><text x="383" y="94" class="label">E=(2,3)</text><text x="383" y="128" class="label">G=((6+10+2)/3,</text><text x="403" y="149" class="label">(0+3+3)/3)=(6,2)</text><text x="383" y="181" class="label">6+2=8</text><text x="383" y="203" class="small">따라서 G∈x+y=8</text><line x1="383" y1="218" x2="605" y2="218" class="aux"/><text x="383" y="244" class="label">Gₓ=14/3+2p/9=6</text><text x="383" y="266" class="label">p=6</text><text x="383" y="295" class="label">AB=√(6²+9²)</text><text x="383" y="316" class="label">=3√13</text>
