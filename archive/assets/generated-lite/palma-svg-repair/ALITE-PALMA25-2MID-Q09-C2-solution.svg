<svg xmlns="http://www.w3.org/2000/svg" width="638" height="340" viewBox="0 0 638 340" role="img" aria-labelledby="svg-title-c3fd33f6e3" aria-describedby="svg-desc-c3fd33f6e3">
<title id="svg-title-c3fd33f6e3">내분점과 무게중심으로 선분 AB 구하기</title>
<desc id="svg-desc-c3fd33f6e3">C=(6,0), D=(10,3), E=(2,3), G=(6,2)이다. G가 x+y=8 위에 있어 p=6이며, 선분 AB의 길이는 3√13이다.</desc><style>text{font-family:"Noto Sans KR","Malgun Gothic",sans-serif;fill:#17212b} .axis{stroke:#536273;stroke-width:1.5} .given{stroke:#243b53;stroke-width:2.6;fill:none} .derived{stroke:#167d8d;stroke-width:2.2;fill:none} .aux{stroke:#75879a;stroke-width:1.6;stroke-dasharray:5 4;fill:none} .accent{stroke:#db7b2b;stroke-width:2.4;fill:none} .point{fill:#17212b} .derived-point{fill:#167d8d} .label{font-size:13.5px} .small{font-size:12.8px} .title{font-size:15px;font-weight:700} .card{fill:#f4f7fa;stroke:#d6dfe7;stroke-width:1} .main{fill:#e6f2f4;stroke:#167d8d;stroke-width:1.8} </style>
