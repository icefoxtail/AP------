<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="svg-title-c242028451" aria-describedby="svg-desc-c242028451"><title id="svg-title-c242028451">선분 AB의 수직이등분선과 점 P</title><desc id="svg-desc-c242028451">A=(0,0), B=(t,1), t&gt;2이며, 선분 AB의 수직이등분선이 P=(2,3)을 지난다. 이 수직이등분선의 방정식을 묻는 조건이다.</desc><style>text{font-family:Arial,"Noto Sans KR",sans-serif;fill:#111;font-size:27px}.line{stroke:#333;stroke-width:4}.bis{stroke:#176B87;stroke-width:3;stroke-dasharray:8 6}.point{fill:#176B87}.leader{stroke:#555;stroke-width:2}.mark{stroke:#111;stroke-width:2}</style><text x="24" y="38">A, B와 수직이등분선</text><line x1="150" y1="250" x2="450" y2="100" class="line"/><line x1="300" y1="175" x2="315" y2="205" class="bis"/><circle cx="150" cy="250" r="5" class="point"/><circle cx="450" cy="100" r="5" class="point"/><circle cx="300" cy="175" r="5" class="point"/><circle cx="315" cy="205" r="5" class="point"/><path d="M300 175 l10 -5 l5 10" class="mark" fill="none"/><text x="90" y="282">A(0,0)</text><text x="460" y="92">B(t,1), t&gt;2</text><text x="322" y="222">P(2,3)</text><text x="250" y="165">M</text></svg>