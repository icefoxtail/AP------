<title id="svg-title-7c64a13e54">벤 다이어그램의 집합 A∩(C−B)</title><desc id="svg-desc-7c64a13e54">색칠한 집합은 A∩(C−B)이다. C에서 B를 뺀 뒤 A와의 교집합을 취한다. 진리표에서는 (A,B,C)=(1,0,1)인 경우만 색칠되어 있다.</desc><style>.axis{stroke:#111;stroke-width:1.2}.shape,.curve{fill:none;stroke:#111;stroke-width:1.8}.guide{fill:none;stroke:#555;stroke-width:1;stroke-dasharray:5 4}.point{fill:#111}.radius{fill:none;stroke:#1f4e79;stroke-width:1.5}.tangent{fill:none;stroke:#111;stroke-width:2.1}.perpendicular{fill:none;stroke:#555;stroke-width:1;stroke-dasharray:3 3}.right-angle{fill:none;stroke:#111;stroke-width:1.2}.center-point{fill:#1f4e79}.element-label,.annotation{font:13px sans-serif}.annotation{font-style:italic}text{font:14px sans-serif;fill:#111}.cell{fill:#fff;stroke:#111;stroke-width:1}.cell-text{text-anchor:middle;dominant-baseline:middle;font:13px sans-serif}</style>
