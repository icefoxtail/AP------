<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="svg-title-1eebc5aa36" aria-describedby="svg-desc-1eebc5aa36"><title id="svg-title-1eebc5aa36">제한된 반직선에서 두 거리의 최솟값</title><desc id="svg-desc-1eebc5aa36">A=(−1,3), B=(−3,1), P=(t,0), t≥0이다. 두 거리는 t=0에서 각각 √10이고, PA+PB의 최솟값은 2√10이다.</desc><defs><marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#536273"/></marker></defs><style>text{font-family:"Noto Sans KR","Malgun Gothic",sans-serif}</style><rect width="640" height="360" fill="#fff"/><circle id="pt-axis-y0" cx="172.091" cy="321.591" r="4" fill="#17212b"/><circle id="pt-axis-y1" cx="172.091" cy="33.409" r="4" fill="#17212b"/><line id="edge-y-axis" x1="172.091" y1="321.591" x2="172.091" y2="33.409" stroke="#536273" stroke-width="2.2" fill="none"/><circle id="pt-axis-x0" cx="28.000" cy="206.318" r="4" fill="#17212b"/><circle id="pt-axis-x1" cx="345.000" cy="206.318" r="4" fill="#17212b"/><line id="edge-x-axis" x1="28.0" y1="206.318" x2="345.0" y2="206.318" stroke="#536273" stroke-width="2.2" fill="none" marker-end="url(#ar)"/><circle id="pt-A" cx="143.273" cy="119.864" r="4" fill="#17212b"/><text id="txt-A-label" x="71.273" y="111.864" text-anchor="start" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="16px" fill="#17212b">A(−1,3)</text><circle id="pt-B" cx="85.636" cy="177.500" r="4" fill="#17212b"/><text id="txt-B-label" x="13.636" y="169.500" text-anchor="start" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="16px" fill="#17212b">B(−3,1)</text><circle id="pt-P" cx="172.091" cy="206.318" r="4" fill="#17212b"/><text id="txt-P-label" x="180.091" y="251.318" text-anchor="start" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="16px" fill="#17212b">P=(0,0)</text><circle id="pt-rayend" cx="345.000" cy="206.318" r="4" fill="#17212b"/><line id="edge-allowed-ray" x1="172.091" y1="206.318" x2="345.0" y2="206.318" stroke="#536273" stroke-width="2.2" fill="none" marker-end="url(#ar)"/><line id="edge-PA" x1="172.091" y1="206.318" x2="143.273" y2="119.864" stroke="#c8752b" stroke-width="2.2" fill="none"/><line id="edge-PB" x1="172.091" y1="206.318" x2="85.636" y2="177.5" stroke="#c8752b" stroke-width="2.2" fill="none"/><rect id="card-proof" x="370" y="55" width="245" height="260" rx="10" fill="#f3f7fa" stroke="#cbd7e0" stroke-width="1.3"/><text id="txt-proof-0" x="384.000" y="83.000" text-anchor="start" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="16px" fill="#17212b">t≥0일 때 t=0에서 최솟값</text><text id="txt-proof-1" x="384.000" y="113.000" text-anchor="start" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="16px" fill="#17212b">PA=√10</text><text id="txt-proof-2" x="384.000" y="143.000" text-anchor="start" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="16px" fill="#17212b">PB=√10</text><text id="txt-proof-3" x="384.000" y="173.000" text-anchor="start" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="16px" fill="#17212b">PA+PB=2√10</text></svg>