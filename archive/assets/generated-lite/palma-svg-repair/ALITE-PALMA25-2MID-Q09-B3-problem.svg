<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420" role="img" aria-labelledby="svg-title-0a72649348" aria-describedby="svg-desc-0a72649348"><title id="svg-title-0a72649348">삼각형의 중점과 무게중심</title><desc id="svg-desc-0a72649348">삼각형 OAB에서 O=(0,0), A=(9,0), B=(0,9)이다. C,D는 각각 OA, AB의 중점이고 E는 BO 위에 있으며, 삼각형 CDE의 무게중심은 (3,5/2)이다.</desc><rect width="100%" height="100%" fill="#fff"/><line id="side-OA" x1="110" y1="315" x2="380" y2="315" stroke="#2563eb" stroke-width="3"/><line id="side-OB" x1="110" y1="315" x2="110" y2="45" stroke="#475569" stroke-width="3"/><line id="side-AB" x1="380" y1="315" x2="110" y2="45" stroke="#475569" stroke-width="3"/><line id="given-median-CD" x1="245" y1="315" x2="245" y2="180" stroke="#7c3aed" stroke-width="3"/><line id="given-median-BE" x1="110" y1="45" x2="110" y2="240" stroke="#7c3aed" stroke-width="3"/><circle id="point-O" cx="110" cy="315" r="5" fill="#172033"/><circle id="point-A" cx="380" cy="315" r="5" fill="#172033"/><circle id="point-B" cx="110" cy="45" r="5" fill="#172033"/><circle id="point-C" cx="245" cy="315" r="5" fill="#172033"/><circle id="point-D" cx="245" cy="180" r="5" fill="#172033"/><circle id="point-E" cx="110" cy="240" r="5" fill="#172033"/><text id="label-O" x="80" y="315" text-anchor="end" font-family="'Noto Sans KR','Pretendard','Malgun Gothic',sans-serif" font-size="34px" font-weight="650" fill="#172033">O</text><text id="label-A" x="400" y="315" text-anchor="start" font-family="'Noto Sans KR','Pretendard','Malgun Gothic',sans-serif" font-size="34px" font-weight="650" fill="#172033">A</text><text id="label-B" x="140" y="70" text-anchor="start" font-family="'Noto Sans KR','Pretendard','Malgun Gothic',sans-serif" font-size="34px" font-weight="650" fill="#172033">B</text><text id="label-C" x="245" y="295" text-anchor="middle" font-family="'Noto Sans KR','Pretendard','Malgun Gothic',sans-serif" font-size="34px" font-weight="650" fill="#172033">C</text><text id="label-D" x="275" y="180"