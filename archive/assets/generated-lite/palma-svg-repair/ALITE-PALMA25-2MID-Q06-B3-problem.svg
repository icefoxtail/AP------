<svg xmlns="http://www.w3.org/2000/svg" width="640" height="340" viewBox="0 0 640 340" role="img" aria-labelledby="svg-title-dcba3a4c98" aria-describedby="svg-desc-dcba3a4c98"><title id="svg-title-dcba3a4c98">원과 직선의 교점 조건</title><desc id="svg-desc-dcba3a4c98">원 x²+y²=5와 직선 y=mx+5가 서로 다른 두 점에서 만나는 조건을 나타낸다.</desc><style>text{font-family:Arial,"Noto Sans KR",sans-serif;fill:#111;font-size:26px}.small{font-size:28px}.axis{stroke:#555;stroke-width:2}.circle{fill:none;stroke:#176B87;stroke-width:4}.family{stroke:#888;stroke-width:2;stroke-dasharray:8 6;opacity:.7}.member{stroke:#176B87;stroke-width:3}.center{fill:#176B87}</style><text x="24" y="42">주어진 원과 직선족</text><text x="390" y="100">y=mx+5</text><text x="390" y="138">−4≤m≤4</text><text x="390" y="176" class="small">m 변화</text><line x1="80" y1="250" x2="350" y2="250" class="axis"/><line x1="200" y1="315" x2="200" y2="62" class="axis"/><circle cx="200" cy="250" r="62.6099" class="circle"/><circle cx="200" cy="250" r="4" class="center"/><text x="211" y="270">O</text><circle cx="200" cy="110" r="4" class="center"/><line x1="80" y1="74" x2="350" y2="155" class="family"/><line x1="80" y1="110" x2="350" y2="110" class="family"/><line x1="80" y1="38" x2="350" y2="200" class="family"/><line x1="80" y1="146" x2="350" y2="65" class="family"/><line x1="80" y1="182" x2="350" y2="20" class="member"/></svg>