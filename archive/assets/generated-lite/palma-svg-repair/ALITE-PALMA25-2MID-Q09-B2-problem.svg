<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420" role="img" aria-labelledby="svg-title-f6dff5b15e" aria-describedby="svg-desc-f6dff5b15e"><title id="svg-title-f6dff5b15e">삼각형 세 점의 내분과 무게중심</title><desc id="svg-desc-f6dff5b15e">O=(0,0), A=(12,0), B=(0,12)이다. C는 OA의 중점, D는 AB의 중점, E는 BO를 BE:EO=1:3으로 내분한다. 삼각형 CDE의 무게중심을 (a,b)라 할 때 a+b를 묻는다.</desc><rect width="640" height="420" fill="#fff"/><line id="side-OA" x1="70.000" y1="360.000" x2="370.000" y2="360.000" stroke="#94a3b8" stroke-width="3"/><line id="side-AB" x1="370.000" y1="360.000" x2="70.000" y2="60.000" stroke="#94a3b8" stroke-width="3"/><line id="side-BO" x1="70.000" y1="60.000" x2="70.000" y2="360.000" stroke="#94a3b8" stroke-width="3"/><line id="side-CD" x1="220.000" y1="360.000" x2="220.000" y2="210.000" stroke="#2563eb" stroke-width="3.2"/><line id="side-DE" x1="220.000" y1="210.000" x2="70.000" y2="135.000" stroke="#2563eb" stroke-width="3.2"/><line id="side-EC" x1="70.000" y1="135.000" x2="220.000" y2="360.000" stroke="#2563eb" stroke-width="3.2"/><circle id="point-O" cx="70.000" cy="360.000" r="5" fill="#172033"/><circle id="point-A" cx="370.000" cy="360.000" r="5" fill="#172033"/><circle id="point-B" cx="70.000" cy="60.000" r="5" fill="#172033"/><circle id="point-C" cx="220.000" cy="360.000" r="5" fill="#172033"/><circle id="point-D" cx="220.000" cy="210.000" r="5" fill="#172033"/><circle id="point-E" cx="70.000" cy="135.000" r="5" fill="#172033"/><circle id="point-G" cx="170.000" cy="235.000" r="6" fill="#b45309"/><text x="60.000" y="384.000" text-anchor="end" font-family="'Noto Sans KR','Pretendard','Malgun Gothic',sans-serif" font-size="34px" font-weight="650" fill="#172033">O</text><text x="380.000" y="384.000" text-anchor="start" font-family="'Noto Sans KR','Pretendard','Malgun Gothic',sans-serif" font-size="34px" font-weight="650" fill="#172033">A</text><text x="82.000" y="96.000" text-anchor="start" font-family="'Noto Sans KR','Pretendard','Malgun Gothic',sans-serif" font-size="34px" font-weight="650" fill="#172033">B</text><text x="230.000" y="349.000" text-anchor="start" font-family="'Noto Sans KR','Pretendard','Malgun Gothic',sans-serif" font-size="34px" font-weight="650" fill="#172033">C</text><text x="230.000" y="231.000" text-anchor="start" font-family="'Noto Sans KR','Pretendard','Malgun Gothic',sans-serif" font-size="34px" font-weight="650" fill="#172033">D</text><text x="61.000" y="157.000" text-anchor="end" font-family="'Noto Sans KR','Pretendard','Malgun Gothic',sans-serif" font-size="34px" font-weight="650" fill="#172033">E</text><text x="450.000" y="85.000" text-anchor="middle" font-family="'Noto Sans KR','Pretendard','Malgun Gothic',sans-serif" font-size="34px" font-weight="650" fill="#0f766e">C는 OA의 중점</text><text x="450.000" y="140.000" text-anchor="middle" font-family="'Noto Sans KR','Pretendard','Malgun Gothic',sans-serif" font-size="34px" font-weight="650" fill="#0f766e">D는 AB의 중점</text><text x="450.000" y="195.000" text-anchor="middle" font-family="'Noto Sans KR','Pretendard','Malgun Gothic',sans-serif" font-size="34px" font-weight="650" fill="#0f766e">BE:EO=1:3</text><line id="axis-x" x1="35.000" y1="360.000" x2="610.000" y2="360.000" stroke="#cbd5e1" stroke-width="1.8"/><line id="axis-y" x1="70.000" y1="28.000" x2="70.000" y2="395.000" stroke="#cbd5e1" stroke-width="1.8"/></svg>