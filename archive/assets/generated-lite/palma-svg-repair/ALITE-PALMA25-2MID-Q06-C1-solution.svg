<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420" role="img"><style>text{font-family:Arial,"Noto Sans KR",sans-serif;fill:#111}.circle{fill:none;stroke:#176B87;stroke-width:4}.chord{stroke:#333;stroke-width:4}.radius{stroke:#176B87;stroke-width:3}.tick{stroke:#333;stroke-width:2}.interval{stroke:#176B87;stroke-width:12;stroke-linecap:round}.closed{fill:#176B87;stroke:#176B87;stroke-width:3}.label{font-size:20px}.head{font-size:25px;font-weight:700}.value{font-size:22px;font-weight:600}</style><text x="40" y="40" class="head">현의 길이 조건과 k</text><circle cx="170" cy="184" r="90" class="circle"/><line x1="98" y1="130" x2="242" y2="130" class="chord"/><line x1="170" y1="184" x2="170" y2="130" class="radius"/><path d="M170 130 h14 v14 h-14" fill="none" stroke="#111" stroke-width="2"/><text x="86" y="121" class="label">A</text><text x="246" y="121" class="label">B</text><text x="176" y="202" class="label">O</text><text x="174" y="126" class="label">H</text><text x="178" y="160" class="label">d=|k|/5</text><text x="364" y="112" class="value">(L/2)²+d²=25</text><text x="364" y="150" class="value">L≥8 ⇒ |k|≤15</text><text x="364" y="188" class="label">정수 k: −15,…,15</text><line x1="104" y1="270" x2="656" y2="270" stroke="#333" stroke-width="3"/><line x1="104" y1="258" x2="104" y2="282" class="tick"/><line x1="270" y1="258" x2="270" y2="282" class="tick"/><line x1="380" y1="258" x2="380" y2="282" class="tick"/><line x1="490" y1="258" x2="490" y2="282" class="tick"/><line x1="656" y1="258" x2="656" y2="282" class="tick"/><line x1="104" y1="270" x2="656" y2="270" class="interval"/><circle cx="104" cy="270" r="9" class="closed"/><circle cx="656" cy="270" r="9" class="closed"/><text x="104" y="310" text-anchor="middle" class="label">−15</text><text x="270" y="310" text-anchor="middle" class="label">−5</text><text x="380" y="310" text-anchor="middle" class="label">0</text><text x="490" y="310" text-anchor="middle" class="label">5</text><text x="6