<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="500" viewBox="0 0 640 500" role="img" aria-labelledby="svg-title-98e1ce16fc" aria-describedby="svg-desc-98e1ce16fc"><title id="svg-title-98e1ce16fc">대칭이동과 평행이동의 순서 비교</title><desc id="svg-desc-98e1ce16fc">원 C의 중심 (0,1)은 S(y=x 대칭) 후 T((2,−1) 평행이동)을 거치면 (3,−1)이 되어 C₁:(x−3)²+(y+1)²=1이 된다. T 후 S를 적용한 중심은 (0,2)이므로 C₂:x²+(y−2)²=1이고, 두 원은 서로 다르다.</desc><rect width="640" height="500" fill="#fff"/><circle id="circle-C_top" cx="84.000" cy="145.000" r="29.000" fill="#eff6ff" stroke="#172033" stroke-width="2.5"/><circle id="circle-C1_top" cx="548.000" cy="145.000" r="29.000" fill="#fff7ed" stroke="#172033" stroke-width="2.5"/><circle id="circle-C_bottom" cx="84.000" cy="330.000" r="29.000" fill="#eff6ff" stroke="#172033" stroke-width="2.5"/><circle id="circle-C2_bottom" cx="548.000" cy="330.000" r="29.000" fill="#fff7ed" stroke="#172033" stroke-width="2.5"/><line id="C-to-S1" x1="84.000" y1="145.000" x2="300.000" y2="145.000" stroke="#64748b" stroke-width="2.6"/><line id="S1-to-C1" x1="300.000" y1="145.000" x2="548.000" y2="145.000" stroke="#64748b" stroke-width="2.6"/><line id="C-to-T2" x1="84.000" y1="330.000" x2="300.000" y2="330.000" stroke="#64748b" stroke-width="2.6"/><line id="T2-to-C2" x1="300.000" y1="330.000" x2="548.000" y2="330.000" stroke="#64748b" stroke-width="2.6"/><text x="84.000" y="198.000" text-anchor="middle" font-family="'Noto Sans KR','Pretendard','Malgun Gothic',sans-serif" font-size="18px" font-weight="650" fill="#172033">C (0,1)</text><text x="300.000" y="198.000" text-anchor="middle" font-family="'Noto Sans KR','Pretendard','Malgun Gothic',sans-serif" font-size="18px" font-weight="650" fill="#172033">S(C) (1,0)</text><text x="548.000" y="198.000" text-anchor="middle" font-family="'Noto Sans KR','Pretendard','Malgun Gothic',sans-serif" font-size="18px" font-weight="650" fill="#172033">C₁ (3,−1)</text><text x="84.000" y="383.000" text-anchor="middle" font-family="'Noto Sans KR','Pretendard','Malgun Gothic',sans-serif" font-size="18px" font-weight="650" fill="#172033">C (0,1)</text><text x="300.000" y="383.000" text-anchor="middle" font-family="'Noto Sans KR','Pretendard','Malgun Gothic',sans-serif" font-size="18px" font-weight="650" fill="#172033">T(C) (2,0)</text><text x="548.000" y="383.000" text-anchor="middle" font-family="'Noto Sans KR','Pretendard','Malgun Gothic',sans-serif" font-size="18px" font-weight="650" fill="#172033">C₂ (0,2)</text><text x="170.000" y="85.000" text-anchor="middle" font-family="'Noto Sans KR','Pretendard','Malgun Gothic',sans-serif" font-size="18px" font-weight="650" fill="#172033">S: 좌표를 바꾼다</text><text x="470.000" y="85.000" text-anchor="middle" font-family="'Noto Sans KR','Pretendard','Malgun Gothic',sans-serif" font-size="18px" font-weight="650" fill="#172033">T: (+2,−1)만큼 평행이동한다</text><text x="170.000" y="270.000" text-anchor="middle" font-family="'Noto Sans KR','Pretendard','Malgun Gothic',sans-serif" font-size="18px" font-weight="650" fill="#172033">T: (+2,−1)만큼 평행이동한다</text><text x="470.000" y="270.000" text-anchor="middle" font-family="'Noto Sans KR','Pretendard','Malgun Gothic',sans-serif" font-size="18px" font-weight="650" fill="#172033">S: 좌표를 바꾼다</text><text x="320.000" y="465.000" text-anchor="middle" font-family="'Noto Sans KR','Pretendard','Malgun Gothic',sans-serif" font-size="18px" font-weight="650" fill="#172033">C₁ ≠ C₂</text><circle id="node-S_C1" cx="300.000" cy="145.000" r="5" fill="#b45309"/><circle id="node-T_C2" cx="300.000" cy="330.000" r="5" fill="#b45309"/></svg>