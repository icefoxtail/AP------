<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="svg-title-38b8a42474" aria-describedby="svg-desc-38b8a42474"><title id="svg-title-38b8a42474">대칭이동으로 구하는 두 거리의 최솟값</title><desc id="svg-desc-38b8a42474">A=(−1,2)를 x축 대칭한 점은 A′=(−1,−2)이다. x축 위의 P에서는 PA=PA′이므로 PA+PB=PA′+PB≥A′B=5이며, 등호는 P=A′B∩x축일 때 성립한다.</desc><defs><marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#536273"/></marker></defs><style>text{font-family:"Noto Sans KR","Malgun Gothic",sans-serif}</style><rect width="640" height="360" fill="#fff"/><circle id="pt-axis-y0" cx="172.091" cy="321.591" r="4" fill="#17212b"/><circle id="pt-axis-y1" cx="172.091" cy="33.409" r="4" fill="#17212b"/><line id="edge-y-axis" x1="172.091" y1="321.591" x2="172.091" y2="33.409" stroke="#536273" stroke-width="2.2" fill="none"/><circle id="pt-axis-x0" cx="28.000" cy="177.500" r="4" fill="#17212b"/><circle id="pt-axis-x1" cx="345.000" cy="177.500" r="4" fill="#17212b"/><line id="edge-x-axis" x1="28.0" y1="177.5" x2="345.0" y2="177.5" stroke="#536273" stroke-width="2.2" fill="none" marker-end="url(#ar)"/><circle id="pt-A" cx="143.273" cy="119.864" r="4" fill="#17212b"/><text id="txt-A-label" x="73.273" y="111.864" text-anchor="start" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="16px" fill="#17212b">A(−1,2)</text><circle id="pt-Apr" cx="143.273" cy="235.136" r="4" fill="#17212b"/><text id="txt-Apr-label" x="59.273" y="257.136" text-anchor="start" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="16px" fill="#17212b">A′(−1,−2)</text><circle id="pt-B" cx="258.545" cy="148.682" r="4" fill="#17212b"/><text id="txt-B-label" x="266.545" y="140.682" text-anchor="start" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="16px" fill="#17212b">B(3,1)</text><circle id="pt-P" cx="220.121" cy="177.500" r="4" fill="#17212b"/><text id="txt-P-label" x="232.121" y="219.500" text-anchor="start" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="16px" fill="#17212b">P</text><line id="edge-reflect-AAprime" x1="143.273" y1="119.864" x2="143.273" y2="235.136" stroke="#75879a" stroke-width="2.2" fill="none" stroke-dasharray="6 5"/><line id="edge-Apr-B" x1="143.273" y1="235.136" x2="258.545" y2="148.682" stroke="#c8752b" stroke-width="2.2" fill="none"/><line id="edge-AP" x1="143.273" y1="119.864" x2="220.121" y2="177.5" stroke="#75879a" stroke-width="2.2" fill="none" stroke-dasharray="6 5"/><line id="edge-PB" x1="220.121" y1="177.5" x2="258.545" y2="148.682" stroke="#c8752b" stroke-width="2.2" fill="none"/><rect id="card-proof" x="370" y="55" width="245" height="260" rx="10" fill="#f3f7fa" stroke="#cbd7e0" stroke-width="1.3"/><text id="txt-proof-0" x="384.000" y="83.000" text-anchor="start" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="16px" fill="#17212b">PA=PA′</text><text id="txt-proof-1" x="384.000" y="113.000" text-anchor="start" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="16px" fill="#17212b">PA+PB=PA′+PB</text><text id="txt-proof-2" x="384.000" y="143.000" text-anchor="start" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="16px" fill="#17212b">≥A′B=5</text><text id="txt-proof-3" x="384.000" y="173.000" text-anchor="start" font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="16px" fill="#17212b">P=A′B∩x축</text></svg>