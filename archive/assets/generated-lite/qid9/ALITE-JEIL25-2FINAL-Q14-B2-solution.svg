<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 410" role="img" aria-labelledby="title desc">
<title id="title">B2 점근선 직사각형 해설</title>
<desc id="desc">수직 점근선 x=4, x=8와 수평 점근선 y=1, y=6가 만드는 직사각형. 가로 4, 세로 5, 넓이 20.</desc>
<rect x="0" y="0" width="620" height="410" rx="14" fill="#fff"/>
<text x="18" y="27" font-family="sans-serif" font-weight="700" font-size="16" fill="#283c4b">B2 · 두 함수의 점근선 관계</text>
<line x1="60" y1="308" x2="400" y2="308" stroke="#666" stroke-width="1.25"/>
<line x1="94" y1="342" x2="94" y2="70" stroke="#666" stroke-width="1.25"/>
<rect x="230" y="104" width="136" height="170" fill="#e0f0f4" stroke="#137b9b" stroke-width="2"/>
<line x1="230" y1="342" x2="230" y2="70" stroke="#c06136" stroke-width="1.7" stroke-dasharray="6 4"/>
<line x1="366" y1="342" x2="366" y2="70" stroke="#c06136" stroke-width="1.7" stroke-dasharray="6 4"/>
<line x1="60" y1="104" x2="400" y2="104" stroke="#c06136" stroke-width="1.7" stroke-dasharray="6 4"/>
<line x1="60" y1="274" x2="400" y2="274" stroke="#c06136" stroke-width="1.7" stroke-dasharray="6 4"/>
<text x="230" y="358" text-anchor="middle" font-size="12" fill="#943e20">x=4</text>
<text x="366" y="358" text-anchor="middle" font-size="12" fill="#943e20">x=8</text>
<text x="64" y="97" font-size="12" fill="#943e20">y=6</text>
<text x="64" y="267" font-size="12" fill="#943e20">y=1</text>
<text x="298" y="92" text-anchor="middle" font-size="13" fill="#11627a">가로 4</text>
<text x="374" y="189" font-size="13" fill="#11627a">세로 5</text>
<rect x="13" y="366" width="594" height="32" rx="6" fill="#f0f5f9"/>
<text x="25" y="387" font-family="sans-serif" font-size="15" fill="#293d4c">가로 4 × 세로 5 = 넓이 20</text>
</svg>