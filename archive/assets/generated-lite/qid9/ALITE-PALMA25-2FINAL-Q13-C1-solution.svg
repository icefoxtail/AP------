<title id="ALITE-PALMA25-2FINAL-Q13-C1-solution-title">연속 등호 후보와 실제 자연수 최솟값의 비교</title>
<desc id="ALITE-PALMA25-2FINAL-Q13-C1-solution-desc">자연수 x,y의 합이 14일 때 실수의 등호 조건은 x=28/5이고, 실제 최솟값을 만드는 자연수 x는 6, y는 8이다. 점선은 실수 등호 후보, 검은 점은 정수 최솟값이다.</desc>


