<svg xmlns="http://www.w3.org/2000/svg" width="690" height="260" viewBox="0 0 690 260" role="img" aria-labelledby="title desc"><title id="title">C1 가법 관계에 곱의 항이 더해진 경우</title><desc id="desc">f(n+1) = f(n) + 4 + 2n</desc><rect width="690" height="260" fill="#fff"/><text x="28" y="31" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#25384c">C1 가법 관계에 곱의 항이 더해진 경우</text><text x="28" y="58" font-family="Arial,sans-serif" font-size="13" fill="#526579">f(n+1) = f(n) + 4 + 2n</text><rect data-n="1" data-f="4" x="65" y="89" width="78" height="94" rx="9" fill="#f6f9fc" stroke="#bcc8d4" stroke-width="1"/><text x="104" y="119" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#486075">n=1</text><text x="104" y="157" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#1f3854">4</text><text x="150" y="210" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#54687c">+6</text><rect data-n="2" data-f="10" x="155" y="89" width="78" height="94" rx="9" fill="#f6f9fc" stroke="#bcc8d4" stroke-width="1"/><text x="194" y="119" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#486075">n=2</text><text x="194" y="157" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#1f3854">10</text><text x="240" y="210" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#54687c">+8</text><rect data-n="3" data-f="18" x="245" y="89" width="78" height="94" rx="9" fill="#f6f9fc" stroke="#bcc8d4" stroke-width="1"/><text x="284" y="119" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#486075">n=3</text><text x="284" y="157" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#1f3854">18</text><text x="330" y="210" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#54687c">+10</text><rect data-n="4" data-f="28" x="335" y="89" width="78" height="94" rx="9" fill="#f6f9fc" stroke="#bcc8d4" stroke-width="1"/><text x="374" y="119" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#486075">n=4</text><text x="374" y="157" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#1f3854">28</text><text x="420" y="210" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#54687c">+12</text><rect data-n="5" data-f="40" x="425" y="89" width="78" height="94" rx="9" fill="#f6f9fc" stroke="#bcc8d4" stroke-width="1"/><text x="464" y="119" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#486075">n=5</text><text x="464" y="157" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#1f3854">40</text><text x="340" y="240" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#36546a">표의 값은 주어진 함수 관계를 반복하여 얻었습니다.</text></svg>