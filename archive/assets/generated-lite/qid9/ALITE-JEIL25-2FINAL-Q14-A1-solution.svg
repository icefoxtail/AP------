<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 410" role="img" aria-labelledby="title desc">
<title id="title">A1 점근선 직사각형 해설</title>
<desc id="desc">수직 점근선 x=2, x=5와 수평 점근선 y=0, y=5가 만드는 직사각형. 가로 3, 세로 5, 넓이 15.</desc>
<rect x="0" y="0" width="620" height="410" rx="14" fill="#fff"/>
<text x="18" y="27" font-family="sans-serif" font-weight="700" font-size="16" fill="#283c4b">A1 · 두 함수의 점근선 관계</text>
<line x1="60" y1="303.14" x2="332" y2="303.14" stroke="#666" stroke-width="1.25"/>
<line x1="98.86" y1="342" x2="98.86" y2="70" stroke="#666" stroke-width="1.25"/>
<rect x="176.57" y="108.86" width="116.57" height="194.29" fill="#e0f0f4" stroke="#137b9b" stroke-width="2"/>
<line x1="176.57" y1="342" x2="176.57" y2="70" stroke="#c06136" stroke-width="1.7" stroke-dasharray="6 4"/>
<line x1="293.14" y1="342" x2="293.14" y2="70" stroke="#c06136" stroke-width="1.7" stroke-dasharray="6 4"/>
<line x1="60" y1="108.86" x2="332" y2="108.86" stroke="#c06136" stroke-width="1.7" stroke-dasharray="6 4"/>
<line x1="60" y1="303.14" x2="332" y2="303.14" stroke="#c06136" stroke-width="1.7" stroke-dasharray="6 4"/>
<text x="176.57" y="358" text-anchor="middle" font-size="12" fill="#943e20">x=2</text>
<text x="293.14" y="358" text-anchor="middle" font-size="12" fill="#943e20">x=5</text>
<text x="64" y="101.86" font-size="12" fill="#943e20">y=5</text>
<text x="64" y="296.14" font-size="12" fill="#943e20">y=0</text>
<text x="234.86" y="96.86" text-anchor="middle" font-size="13" fill="#11627a">가로 3</text>
<text x="301.14" y="206" font-size="13" fill="#11627a">세로 5</text>
<rect x="13" y="366" width="594" height="32" rx="6" fill="#f0f5f9"/>
<text x="25" y="387" font-family="sans-serif" font-size="15" fill="#293d4c">가로 3 × 세로 5 = 넓이 15</text>
</svg>