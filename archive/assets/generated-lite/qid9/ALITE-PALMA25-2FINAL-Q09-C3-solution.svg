<svg xmlns="http://www.w3.org/2000/svg" width="690" height="260" viewBox="0 0 690 260" role="img" aria-labelledby="ALITE-PALMA25-2FINAL-Q09-C3-solution-title ALITE-PALMA25-2FINAL-Q09-C3-solution-desc">
<title id="ALITE-PALMA25-2FINAL-Q09-C3-solution-title">C3 함숫값의 범위 판정</title>
<desc id="ALITE-PALMA25-2FINAL-Q09-C3-solution-desc">자연수 n에 대해 25≤f(n)≤52를 만족하는 함숫값의 범위와 가능한 입력값을 비교한다.</desc><rect width="690" height="260" fill="#fff"/><text x="28" y="31" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#25384c">C3 함숫값의 범위 판정</text><text x="28" y="58" font-family="Arial,sans-serif" font-size="13" fill="#526579">25 ≤ f(n) ≤ 52  (n은 자연수)</text><rect data-n="4" data-f="18" x="65" y="89" width="78" height="94" rx="9" fill="#f6f9fc" stroke="#bcc8d4" stroke-width="1"/><text x="104" y="119" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#486075">n=4</text><text x="104" y="157" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#1f3854">18</text><rect data-n="5" data-f="25" x="155" y="89" width="78" height="94" rx="9" fill="#e6f4f7" stroke="#246e85" stroke-width="2"/><text x="194" y="119" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#486075">n=5</text><text x="194" y="157" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#1f3854">25</text><rect data-n="6" data-f="33" x="245" y="89" width="78" height="94" rx="9" fill="#e6f4f7" stroke="#246e85" stroke-width="2"/><text x="284" y="119" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#486075">n=6</text><text x="284" y="157" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#1f3854">33</text><rect data-n="7" data-f="42" x="335" y="89" width="78" height="94" rx="9" fill="#e6f4f7" stroke="#246e85" stroke-width="2"/><text x="374" y="119" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#486075">n=7</text><text x="374" y="157" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#1f3854">42</text><rect data-n="8" data-f="52" x="425" y="89" width="78" height="94" rx="9" fill="#e6f4f7" stroke="#246e85" stroke-width="2"/><text x="464" y="119" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#486075">n=8</text><text x="464" y="157" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#1f3854">52</text><rect data-n="9" data-f="63" x="515" y="89" width="78" height="94" rx="9" fill="#f6f9fc" stroke="#bcc8d4" stroke-width="1"/><text x="554" y="119" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#486075">n=9</text><text x="554" y="157" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#1f3854">63</text><text x="340" y="240" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#36546a">강조한 칸이 조건을 만족하는 후보입니다.</text></svg>