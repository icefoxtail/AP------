<svg xmlns="http://www.w3.org/2000/svg" width="660" height="270" viewBox="0 0 660 270" role="img" aria-labelledby="ALITE-PALMA25-2FINAL-Q09-C2-solution-title ALITE-PALMA25-2FINAL-Q09-C2-solution-desc">
<title id="ALITE-PALMA25-2FINAL-Q09-C2-solution-title">C2 자연수 범위의 교집합</title>
<desc id="ALITE-PALMA25-2FINAL-Q09-C2-solution-desc">두 함숫값 조건을 함께 만족하는 자연수의 범위는 5보다 크고 8 이하이므로, 가능한 수는 6,7,8이다.</desc><rect width="660" height="270" fill="#fff"/><text x="28" y="33" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#24394f">두 부등식을 동시에 만족하는 자연수</text><text x="28" y="64" font-family="Arial,sans-serif" font-size="14" fill="#52687d">n &gt; 5, n ≤ 8</text><line x1="56" y1="148" x2="616" y2="148" stroke="#435e76" stroke-width="2.4"/><path d="M616 148 L604 142 L604 154 Z" fill="#435e76"/><line x1="93" y1="142" x2="93" y2="154" stroke="#435e76" stroke-width="2"/><text x="93" y="177" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#203a56">4</text><line x1="183" y1="142" x2="183" y2="154" stroke="#435e76" stroke-width="2"/><text x="183" y="177" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#203a56">5</text><circle data-n="5" data-boundary="open" cx="183" cy="148" r="8" fill="#fff" stroke="#247c92" stroke-width="2.4"/><line x1="273" y1="142" x2="273" y2="154" stroke="#435e76" stroke-width="2"/><text x="273" y="177" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#203a56">6</text><circle data-n="6" data-valid="true" cx="273" cy="148" r="8" fill="#247c92" stroke="#fff" stroke-width="2"/><line x1="363" y1="142" x2="363" y2="154" stroke="#435e76" stroke-width="2"/><text x="363" y="177" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#203a56">7</text><circle data-n="7" data-valid="true" cx="363" cy="148" r="8" fill="#247c92" stroke="#fff" stroke-width="2"/><line x1="453" y1="142" x2="453" y2="154" stroke="#435e76" stroke-width="2"/><text x="453" y="177" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#203a56">8</text><circle data-n="8" data-valid="true" cx="453" cy="148" r="8" fill="#247c92" stroke="#fff" stroke-width="2"/><line x1="543" y1="142" x2="543" y2="154" stroke="#435e76" stroke-width="2"/><text x="543" y="177" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#203a56">9</text><line x1="193" y1="110" x2="443" y2="110" stroke="#247c92" stroke-width="3"/><text x="318" y="98" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#247c92">가능한 값: 6, 7, 8</text><text x="340" y="226" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#52687d">5는 미포함, 8은 포함 → 총 3개</text></svg>