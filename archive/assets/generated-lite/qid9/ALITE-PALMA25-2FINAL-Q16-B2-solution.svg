<svg xmlns="http://www.w3.org/2000/svg" width="600" height="224" viewBox="0 0 600 224" preserveAspectRatio="xMidYMid meet" role="img" aria-label="B2 해설 — 겹치는 증가·감소 사슬"><title>B2 해설 — 겹치는 증가·감소 사슬</title><desc>f1&lt;f2&lt;f3&gt;f4&gt;f5, f6 자유. 꼭짓점은 선택한 다섯 값 중 최대이고, 남은 네 값을 두 쌍에 나눈다.</desc><rect width="600" height="224" fill="#fff"/><text x="34" y="31" font-size="17" font-weight="bold" fill="#111">B2 해설 — 겹치는 증가·감소 사슬</text><rect x="38" y="57" width="70" height="51" rx="5" fill="white" stroke="#1c1c1c" stroke-width="1.7"/><text x="73" y="89" text-anchor="middle" font-size="15" fill="#111">f(1)</text><rect x="127" y="57" width="70" height="51" rx="5" fill="white" stroke="#1c1c1c" stroke-width="1.7"/><text x="162" y="89" text-anchor="middle" font-size="15" fill="#111">f(2)</text><rect x="216" y="57" width="70" height="51" rx="5" fill="white" stroke="#1c1c1c" stroke-width="1.7"/><text x="251" y="89" text-anchor="middle" font-size="15" fill="#111">f(3)</text><rect x="305" y="57" width="70" height="51" rx="5" fill="white" stroke="#1c1c1c" stroke-width="1.7"/><text x="340" y="89" text-anchor="middle" font-size="15" fill="#111">f(4)</text><rect x="394" y="57" width="70" height="51" rx="5" fill="white" stroke="#1c1c1c" stroke-width="1.7"/><text x="429" y="89" text-anchor="middle" font-size="15" fill="#111">f(5)</text><rect x="483" y="57" width="70" height="51" rx="5" fill="white" stroke="#1c1c1c" stroke-width="1.7"/><text x="518" y="89" text-anchor="middle" font-size="15" fill="#111">f(6)</text><text x="118" y="89" text-anchor="middle" font-size="16" font-weight="bold" fill="#111">&lt;</text><text x="207" y="89" text-anchor="middle" font-size="16" font-weight="bold" fill="#111">&lt;</text><text x="296" y="89" text-anchor="middle" font-size="16" font-weight="bold" fill="#111">&gt;</text><text x="385" y="89" text-anchor="middle" font-size="16" font-weight="bold" fill="#111">&gt;</text><line x1="34" y1="118" x2="558" y2="118" stroke="#999" stroke-width="1"/><text x="34" y="148" font-size="14" fill="#111">f(6)에 놓을 값: 6가지</text><text x="34" y="171" font-size="14" fill="#111">남은 네 값을 두 순서 사슬에 분배: C(4,2)=6가지</text><text x="34" y="194" font-size="14" fill="#111">총 6 × 6 = 36가지</text></svg>
