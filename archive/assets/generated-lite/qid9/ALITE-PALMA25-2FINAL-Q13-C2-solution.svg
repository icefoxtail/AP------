<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="620" height="205" viewBox="0 0 620 205" aria-label="C2 산술 기하 평균과 정수 최솟값 수직선" data-case="palma-25-2final-q13-C2" data-axis-xmin="1" data-axis-xmax="12" data-axis-start="46" data-axis-stop="574" role="img" aria-labelledby="ALITE-PALMA25-2FINAL-Q13-C2-solution-title ALITE-PALMA25-2FINAL-Q13-C2-solution-desc">
<title id="ALITE-PALMA25-2FINAL-Q13-C2-solution-title">연속 등호 후보와 실제 자연수 최솟값의 비교</title>
<desc id="ALITE-PALMA25-2FINAL-Q13-C2-solution-desc">자연수 x,y의 합이 13일 때 실수의 등호 조건은 x=26/5이고, 실제 최솟값을 만드는 자연수 x는 5, y는 8이다. 점선은 실수 등호 후보, 검은 점은 정수 최솟값이다.</desc>


<rect x="0" y="0" width="620" height="205" fill="#ffffff"/>
<text x="26" y="25" font-size="15" font-weight="bold">자연수 조건과 등호 성립 위치</text>
<text x="26" y="46" font-size="12" fill="#505050">연속적인 등호 후보 x=26/5; 자연수에서는 x=5에서 최솟값</text>
<line x1="46" y1="120" x2="574" y2="120" stroke="#444" stroke-width="2"/>
<line x1="46.00" x2="46.00" y1="114" y2="123" stroke="#aaa" stroke-width="1"/>
<line x1="94.00" x2="94.00" y1="114" y2="123" stroke="#aaa" stroke-width="1"/>
<line x1="142.00" x2="142.00" y1="114" y2="123" stroke="#aaa" stroke-width="1"/>
<line x1="190.00" x2="190.00" y1="114" y2="123" stroke="#aaa" stroke-width="1"/>
<line x1="238.00" x2="238.00" y1="114" y2="129" stroke="#171717" stroke-width="2.3"/>
<line x1="286.00" x2="286.00" y1="114" y2="123" stroke="#aaa" stroke-width="1"/>
<line x1="334.00" x2="334.00" y1="114" y2="123" stroke="#aaa" stroke-width="1"/>
<line x1="382.00" x2="382.00" y1="114" y2="123" stroke="#aaa" stroke-width="1"/>
<line x1="430.00" x2="430.00" y1="114" y2="123" stroke="#aaa" stroke-width="1"/>
<line x1="478.00" x2="478.00" y1="114" y2="123" stroke="#aaa" stroke-width="1"/>
<line x1="526.00" x2="526.00" y1="114" y2="123" stroke="#aaa" stroke-width="1"/>
<line x1="574.00" x2="574.00" y1="114" y2="123" stroke="#aaa" stroke-width="1"/>
<line x1="247.60" x2="247.60" y1="77" y2="120" stroke="#4670a3" stroke-width="1.6" stroke-dasharray="4 3" data-math-continuous="26/5"/>
<circle cx="247.60" cy="120" r="5" stroke="#4670a3" fill="#ffffff" stroke-width="2" data-kind="continuous-equality"/>
<circle cx="238.00" cy="120" r="6.5" fill="#111111" stroke="#ffffff" stroke-width="1.1" data-math-optimum="5"/>
<text x="238.00" y="97" font-size="12" font-weight="bold" text-anchor="middle">x=5</text>
<text x="46.00" y="150" font-size="12" text-anchor="middle">1</text>
<text x="238.00" y="150" font-size="12" text-anchor="middle">5</text>
<text x="286.00" y="150" font-size="12" text-anchor="middle">6</text>
<text x="574.00" y="150" font-size="12" text-anchor="middle">12</text>
<text x="28" y="184" font-size="12" fill="#424242">검은 점: 정수 최적해 (5,8) / 점선: 정수로는 불가능한 등호</text>
</svg>