<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 670" width="760" height="670" role="img" aria-labelledby="ALITE-PALMA25-2FINAL-Q07-C3-solution-title ALITE-PALMA25-2FINAL-Q07-C3-solution-desc">
<title id="ALITE-PALMA25-2FINAL-Q07-C3-solution-title">정수 최댓값 후보에서 최솟값 조건 걸러내기</title>
<desc id="ALITE-PALMA25-2FINAL-Q07-C3-solution-desc">정수 최댓값 후보 n=2,3,5,11 중 최솟값 조건 m≥3을 만족하는 n=2,3,5를 구분한 표이다.</desc><rect width="760" height="670" fill="white"/><text x="65" y="53" font-family="Arial,sans-serif" font-size="22" font-weight="700">정수 최댓값 후보에서 최솟값 조건 걸러내기</text><text x="65" y="82" font-family="Arial,sans-serif" font-size="16">M=2+12/(n+1), m=2+12/(n+4)</text><rect x="70" y="156" width="110" height="60" fill="#e9edf2" stroke="#777"/><text x="125" y="193" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700">n</text><rect x="180" y="156" width="110" height="60" fill="#e9edf2" stroke="#777"/><text x="235" y="193" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700">2</text><rect x="290" y="156" width="110" height="60" fill="#e9edf2" stroke="#777"/><text x="345" y="193" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700">3</text><rect x="400" y="156" width="110" height="60" fill="#e9edf2" stroke="#777"/><text x="455" y="193" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700">5</text><rect x="510" y="156" width="110" height="60" fill="#e9edf2" stroke="#777"/><text x="565" y="193" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700">11</text><rect x="70" y="216" width="110" height="62" fill="#fff" stroke="#999"/><text x="125" y="253" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" >M</text><rect x="180" y="216" width="110" height="62" fill="#eef3ee" stroke="#999"/><text x="235" y="253" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700">6</text><rect x="290" y="216" width="110" height="62" fill="#eef3ee" stroke="#999"/><text x="345" y="253" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700">5</text><rect x="400" y="216" width="110" height="62" fill="#eef3ee" stroke="#999"/><text x="455" y="253" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700">4</text><rect x="510" y="216" width="110" height="62" fill="#fff" stroke="#999"/><text x="565" y="253" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" >3</text><rect x="70" y="278" width="110" height="62" fill="#fff" stroke="#999"/><text x="125" y="315" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" >m</text><rect x="180" y="278" width="110" height="62" fill="#eef3ee" stroke="#999"/><text x="235" y="315" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700">4</text><rect x="290" y="278" width="110" height="62" fill="#eef3ee" stroke="#999"/><text x="345" y="315" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700">26/7</text><rect x="400" y="278" width="110" height="62" fill="#eef3ee" stroke="#999"/><text x="455" y="315" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700">10/3</text><rect x="510" y="278" width="110" height="62" fill="#fff" stroke="#999"/><text x="565" y="315" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" >14/5</text><rect x="70" y="340" width="110" height="62" fill="#fff" stroke="#999"/><text x="125" y="377" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" >m≥3</text><rect x="180" y="340" width="110" height="62" fill="#eef3ee" stroke="#999"/><text x="235" y="377" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700">성립</text><rect x="290" y="340" width="110" height="62" fill="#eef3ee" stroke="#999"/><text x="345" y="377" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700">성립</text><rect x="400" y="340" width="110" height="62" fill="#eef3ee" stroke="#999"/><text x="455" y="377" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700">성립</text><rect x="510" y="340" width="110" height="62" fill="#fff" stroke="#999"/><text x="565" y="377" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" >불성립</text><text x="70" y="457" font-family="Arial,sans-serif" font-size="17">남는 자연수 n = 2, 3, 5 → 총 3개</text></svg>
