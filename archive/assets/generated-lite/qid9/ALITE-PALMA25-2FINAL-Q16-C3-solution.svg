<svg xmlns="http://www.w3.org/2000/svg" width="600" height="224" viewBox="0 0 600 224" preserveAspectRatio="xMidYMid meet" aria-label="C3 해설 — 두 사슬의 최대값과 홀짝" role="img" aria-labelledby="ALITE-PALMA25-2FINAL-Q16-C3-solution-title ALITE-PALMA25-2FINAL-Q16-C3-solution-desc">
<title id="ALITE-PALMA25-2FINAL-Q16-C3-solution-title">C3 해설 — 두 사슬의 최대값과 홀짝</title>
<desc id="ALITE-PALMA25-2FINAL-Q16-C3-solution-desc">f1&lt;f2&lt;f3&gt;f4&gt;f5&gt;f6이고 f1은 홀수. f3=6, 첫 사슬의 시작값을 1 또는 3으로 나눈다.</desc><rect width="600" height="224" fill="#fff"/><text x="34" y="31" font-size="17" font-weight="bold" fill="#111">C3 해설 — 두 사슬의 최대값과 홀짝</text><rect x="38" y="57" width="70" height="51" rx="5" fill="white" stroke="#1c1c1c" stroke-width="1.7"/><text x="73" y="89" text-anchor="middle" font-size="15" fill="#111">f(1)</text><rect x="127" y="57" width="70" height="51" rx="5" fill="white" stroke="#1c1c1c" stroke-width="1.7"/><text x="162" y="89" text-anchor="middle" font-size="15" fill="#111">f(2)</text><rect x="216" y="57" width="70" height="51" rx="5" fill="white" stroke="#1c1c1c" stroke-width="1.7"/><text x="251" y="89" text-anchor="middle" font-size="15" fill="#111">f(3)</text><rect x="305" y="57" width="70" height="51" rx="5" fill="white" stroke="#1c1c1c" stroke-width="1.7"/><text x="340" y="89" text-anchor="middle" font-size="15" fill="#111">f(4)</text><rect x="394" y="57" width="70" height="51" rx="5" fill="white" stroke="#1c1c1c" stroke-width="1.7"/><text x="429" y="89" text-anchor="middle" font-size="15" fill="#111">f(5)</text><rect x="483" y="57" width="70" height="51" rx="5" fill="white" stroke="#1c1c1c" stroke-width="1.7"/><text x="518" y="89" text-anchor="middle" font-size="15" fill="#111">f(6)</text><text x="118" y="89" text-anchor="middle" font-size="16" font-weight="bold" fill="#111">&lt;</text><text x="207" y="89" text-anchor="middle" font-size="16" font-weight="bold" fill="#111">&lt;</text><text x="296" y="89" text-anchor="middle" font-size="16" font-weight="bold" fill="#111">&gt;</text><text x="385" y="89" text-anchor="middle" font-size="16" font-weight="bold" fill="#111">&gt;</text><text x="474" y="89" text-anchor="middle" font-size="16" font-weight="bold" fill="#111">&gt;</text><line x1="34" y1="118" x2="558" y2="118" stroke="#999" stroke-width="1"/><text x="34" y="148" font-size="14" fill="#111">f(3)&gt;f(4), 두 사슬 최대값 비교 → f(3)=6</text><text x="34" y="171" font-size="14" fill="#111">f(1)=1일 때 f(2): 4가지 / f(1)=3일 때: 2가지</text><text x="34" y="194" font-size="14" fill="#111">총 4 + 2 = 6가지</text></svg>
