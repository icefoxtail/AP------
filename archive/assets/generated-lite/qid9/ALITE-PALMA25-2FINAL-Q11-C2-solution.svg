<title id="ALITE-PALMA25-2FINAL-Q11-C2-solution-title">함수와 역함수의 그래프 — C2</title>
<desc id="ALITE-PALMA25-2FINAL-Q11-C2-solution-desc">a=2이면 두 교점 (2,2),(6,6); a=3은 접점 (4,4). 검은 실선은 함수, 검은 점선은 역함수, 회색 쇄선은 y=x. 두 그래프는 y=x에 대칭이다.</desc>


