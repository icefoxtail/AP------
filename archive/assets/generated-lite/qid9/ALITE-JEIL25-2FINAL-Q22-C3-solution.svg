<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="479" viewBox="0 0 1000 479" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="qt qd"><title id="qt">제일고 q22 C3 귀류법 해설</title><desc id="qd">결론의 부정 가정과 홀짝 및 제곱수 나머지의 모순을 확인하는 단계별 해설 도식.</desc><rect width="1000" height="479" fill="white"/><text x="28" y="30" font-family="sans-serif" font-size="20" font-weight="700">귀류법 증명 단계 · C3</text><rect x="28" y="50" width="944" height="85" rx="10" fill="#f7f7f7" stroke="#dddddd"/><text x="47" y="77" font-size="16" font-family="sans-serif" font-weight="700">3의 배수 귀류</text><text x="47" y="110" font-size="20" font-family="sans-serif">3 | ab : 제곱의 합 2 (mod 3)은 모순</text><path d="M500 135 v17" stroke="#999" stroke-width="2"/><rect x="28" y="154" width="944" height="85" rx="10" fill="#f7f7f7" stroke="#dddddd"/><text x="47" y="181" font-size="16" font-family="sans-serif" font-weight="700">4의 배수 귀류</text><text x="47" y="214" font-size="20" font-family="sans-serif">4 | ab : 제곱의 합과 제곱수 (mod 16) 모순</text><path d="M500 239 v17" stroke="#999" stroke-width="2"/><rect x="28" y="258" width="944" height="85" rx="10" fill="#f7f7f7" stroke="#dddddd"/><text x="47" y="285" font-size="16" font-family="sans-serif" font-weight="700">5의 배수 귀류</text><text x="47" y="318" font-size="20" font-family="sans-serif">5 | a·b·c : 합 {0,2,3} ≠ 제곱 {1,4}</text><path d="M500 343 v17" stroke="#999" stroke-width="2"/><rect x="28" y="362" width="944" height="85" rx="10" fill="#edf3f1" stroke="#8ea79e"/><text x="47" y="389" font-size="16" font-family="sans-serif" font-weight="700">결합 결론</text><text x="47" y="422" font-size="20" font-family="sans-serif">3,4,5는 서로소 → 60 | a·b·c</text><text x="28" y="471" font-size="11" font-family="sans-serif" fill="#777">수의 나머지와 제곱수의 가능한 나머지 비교</text></svg>