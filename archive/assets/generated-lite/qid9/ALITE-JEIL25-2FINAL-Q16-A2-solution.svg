<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc"><title id="title">A2 복분수 안쪽부터 정리</title><desc id="desc">가장 안쪽 분모에서 바깥 분모로 차례로 유리식을 통분하여 최종 분자 분모를 도출한다. 원래 분모가 0인 입력은 제외한다.</desc><rect width="720" height="420" fill="white"/><text x="24" y="32" font-size="19" font-family="sans-serif" font-weight="700" fill="#193a58">A2 · 유리식 단계별 정리</text><rect x="24" y="54" rx="8" width="670" height="58" fill="#f1f5fa" stroke="#ccd8e5"/><text x="38" y="78" font-size="14" font-family="sans-serif" fill="#697e94">단계 1</text><text x="132" y="91" font-size="17" font-family="monospace" fill="#183044">u=x+3</text><rect x="24" y="131" rx="8" width="670" height="58" fill="#f1f5fa" stroke="#ccd8e5"/><text x="38" y="155" font-size="14" font-family="sans-serif" fill="#697e94">단계 2</text><text x="132" y="168" font-size="17" font-family="monospace" fill="#183044">1 - 1/u = (1u-1)/u</text><rect x="24" y="208" rx="8" width="670" height="58" fill="#f1f5fa" stroke="#ccd8e5"/><text x="38" y="232" font-size="14" font-family="sans-serif" fill="#697e94">단계 3</text><text x="132" y="245" font-size="17" font-family="monospace" fill="#183044">2 - u/(1u-1) = (1u-2)/(1u-1)</text><rect x="24" y="285" rx="8" width="670" height="58" fill="#daf2e8" stroke="#268567"/><text x="38" y="309" font-size="14" font-family="sans-serif" fill="#697e94">단계 4</text><text x="132" y="322" font-size="17" font-family="monospace" fill="#183044">F(x) = (1u-1)/(1u-2)</text><text x="26" y="395" font-size="13" font-family="sans-serif" fill="#617284">동치 식은 원래 복분수가 정의되는 x에서만 적용</text></svg>