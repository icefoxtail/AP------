<svg xmlns="http://www.w3.org/2000/svg" width="600" height="224" viewBox="0 0 600 224" preserveAspectRatio="xMidYMid meet" aria-label="B3 해설 — 짝수 최대 함숫값의 분기" role="img" aria-labelledby="ALITE-PALMA25-2FINAL-Q16-B3-solution-title ALITE-PALMA25-2FINAL-Q16-B3-solution-desc">
<title id="ALITE-PALMA25-2FINAL-Q16-B3-solution-title">B3 해설 — 짝수 최대 함숫값의 분기</title>
<desc id="ALITE-PALMA25-2FINAL-Q16-B3-solution-desc">서로 다른 세 함숫값이 f1&lt;f2&lt;f3을 만족하고 최댓값 f3이 짝수인 경우를 나눈다. f3=2는 불가능하므로 f3=4인 경우를 센다.</desc><rect width="600" height="224" fill="#fff"/><text x="34" y="31" font-size="17" font-weight="bold" fill="#111">B3 해설 — 짝수 최대 함숫값의 분기</text><rect x="38" y="57" width="70" height="51" rx="5" fill="white" stroke="#1c1c1c" stroke-width="1.7"/><text x="73" y="89" text-anchor="middle" font-size="15" fill="#111">f(1)</text><rect x="127" y="57" width="70" height="51" rx="5" fill="white" stroke="#1c1c1c" stroke-width="1.7"/><text x="162" y="89" text-anchor="middle" font-size="15" fill="#111">f(2)</text><rect x="216" y="57" width="70" height="51" rx="5" fill="white" stroke="#1c1c1c" stroke-width="1.7"/><text x="251" y="89" text-anchor="middle" font-size="15" fill="#111">f(3)</text><rect x="305" y="57" width="70" height="51" rx="5" fill="white" stroke="#1c1c1c" stroke-width="1.7"/><text x="340" y="89" text-anchor="middle" font-size="15" fill="#111">f(4)</text><rect x="394" y="57" width="70" height="51" rx="5" fill="white" stroke="#1c1c1c" stroke-width="1.7"/><text x="429" y="89" text-anchor="middle" font-size="15" fill="#111">f(5)</text><text x="118" y="89" text-anchor="middle" font-size="16" font-weight="bold" fill="#111">&lt;</text><text x="207" y="89" text-anchor="middle" font-size="16" font-weight="bold" fill="#111">&lt;</text><line x1="34" y1="118" x2="558" y2="118" stroke="#999" stroke-width="1"/><text x="34" y="148" font-size="14" fill="#111">f(3)=2: 앞에 더 작은 서로 다른 두 수가 없어 불가능</text><text x="34" y="171" font-size="14" fill="#111">f(3)=4: {1,2,3} 중 2개 선택하고 나머지 2개 배열</text><text x="34" y="194" font-size="14" fill="#111">총 C(3,2) × 2! = 6가지</text></svg>
