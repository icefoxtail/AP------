<svg xmlns="http://www.w3.org/2000/svg" width="500" height="150" viewBox="0 0 500 150" role="img" aria-labelledby="title desc"><title id="title">q15 C3 정수 매개변수 범위의 해설 수직선</title><desc id="desc">−10 이상 2 이하의 정수 가운데 a&lt;−4인 것은 −10, −9, −8, −7, −6, −5의 여섯 값이다. a=−4는 제외된다.</desc><rect width="500" height="150" fill="white"/><text x="48" y="27" font-size="15" fill="#111">−10 ≤ a ≤ 2,  a &lt; −4</text><line x1="42" y1="72" x2="443" y2="72" stroke="#555" stroke-width="1.6"/><line x1="48" y1="72" x2="208" y2="72" stroke="#222" stroke-width="3.5"/><circle cx="240" cy="72" r="5" fill="white" stroke="#222" stroke-width="1.7"/><line x1="48" y1="67" x2="48" y2="77" stroke="#555" stroke-width="1"/><text x="48" y="97" text-anchor="middle" font-size="11" fill="#222">−10</text><circle cx="48" cy="72" r="5" fill="#222"/><line x1="80" y1="67" x2="80" y2="77" stroke="#555" stroke-width="1"/><text x="80" y="97" text-anchor="middle" font-size="11" fill="#222">−9</text><circle cx="80" cy="72" r="5" fill="#222"/><line x1="112" y1="67" x2="112" y2="77" stroke="#555" stroke-width="1"/><text x="112" y="97" text-anchor="middle" font-size="11" fill="#222">−8</text><circle cx="112" cy="72" r="5" fill="#222"/><line x1="144" y1="67" x2="144" y2="77" stroke="#555" stroke-width="1"/><text x="144" y="97" text-anchor="middle" font-size="11" fill="#222">−7</text><circle cx="144" cy="72" r="5" fill="#222"/><line x1="176" y1="67" x2="176" y2="77" stroke="#555" stroke-width="1"/><text x="176" y="97" text-anchor="middle" font-size="11" fill="#222">−6</text><circle cx="176" cy="72" r="5" fill="#222"/><line x1="208" y1="67" x2="208" y2="77" stroke="#555" stroke-width="1"/><text x="208" y="97" text-anchor="middle" font-size="11" fill="#222">−5</text><circle cx="208" cy="72" r="5" fill="#222"/><line x1="240" y1="67" x2="240" y2="77" stroke="#555" stroke-width="1"/><text x="240" y="97" text-anchor="middle" font-size="11" fill="#222">−4</text><line x1="272" y1="67" x2="272" y2="77" stroke="#555" stroke-width="1"/><text x="272" y="97" text-anchor="middle" font-size="11" fill="#222">−3</text><line x1="304" y1="67" x2="304" y2="77" stroke="#555" stroke-width="1"/><text x="304" y="97" text-anchor="middle" font-size="11" fill="#222">−2</text><line x1="336" y1="67" x2="336" y2="77" stroke="#555" stroke-width="1"/><text x="336" y="97" text-anchor="middle" font-size="11" fill="#222">−1</text><line x1="368" y1="67" x2="368" y2="77" stroke="#555" stroke-width="1"/><text x="368" y="97" text-anchor="middle" font-size="11" fill="#222">0</text><line x1="400" y1="67" x2="400" y2="77" stroke="#555" stroke-width="1"/><text x="400" y="97" text-anchor="middle" font-size="11" fill="#222">1</text><line x1="432" y1="67" x2="432" y2="77" stroke="#555" stroke-width="1"/><text x="432" y="97" text-anchor="middle" font-size="11" fill="#222">2</text><text x="48" y="130" font-size="12" fill="#333">검은 점 6개: a = −10, −9, −8, −7, −6, −5</text></svg>
