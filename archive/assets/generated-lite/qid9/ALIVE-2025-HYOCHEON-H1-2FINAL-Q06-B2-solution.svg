<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-labelledby="qid9-ALIVE-2025-HYOCHEON-H1-2FINAL-Q06-B2-title qid9-ALIVE-2025-HYOCHEON-H1-2FINAL-Q06-B2-desc"><title id="qid9-ALIVE-2025-HYOCHEON-H1-2FINAL-Q06-B2-title">B2 진리집합 포함관계의 논리적 추론을 나타낸 해설 도식</title><desc id="qid9-ALIVE-2025-HYOCHEON-H1-2FINAL-Q06-B2-desc">전제 집합식을 포함관계로 정리하고 항상 참인 명제를 도출한다.</desc>
<rect x="0" y="0" width="1200" height="420" fill="#FFFFFF"/>
<text x="42" y="50" font-family="NanumSquare, sans-serif" font-size="28" fill="#182b4b" font-weight="bold">B2 · 진리집합 추론</text>
<rect x="48" y="58" width="1090" height="49" rx="8" fill="#f2f5fa"/>
<text x="70" y="90" font-family="NanumSquare, sans-serif" font-size="21" fill="#335277">전제 1</text>
<text x="270" y="90" font-family="NanumSquare, sans-serif" font-size="23" fill="#132943">P ⊆ Q ∪ R</text>
<rect x="48" y="116" width="1090" height="49" rx="8" fill="#f2f5fa"/>
<text x="70" y="148" font-family="NanumSquare, sans-serif" font-size="21" fill="#335277">전제 2</text>
<text x="270" y="148" font-family="NanumSquare, sans-serif" font-size="23" fill="#132943">P ∩ Q = 공집합</text>
<text x="64" y="227" font-family="NanumSquare, sans-serif" font-size="22" fill="#33475f">P에 속하면 Q는 불가능 → R에 속함</text>
<text x="64" y="273" font-family="NanumSquare, sans-serif" font-size="29" fill="#163c73" font-weight="bold">∴ P ⊆ R  ⇒  p → r</text>
<text x="64" y="385" font-family="NanumSquare, sans-serif" font-size="17" fill="#667789">집합의 포함 방향과 여집합을 확인한다.</text>
</svg>