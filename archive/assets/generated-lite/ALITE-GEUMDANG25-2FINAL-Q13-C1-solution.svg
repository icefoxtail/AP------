<svg xmlns="http://www.w3.org/2000/svg" width="640" height="350" viewBox="0 0 640 350" role="img" aria-labelledby="title desc"><title id="title">C1 최대 넓이와 두 변의 길이</title><desc id="desc">가로 x+2와 세로 y+1의 합은 14. 등호가 성립할 때 두 변이 7로 같고 x=5,y=6이다.</desc><rect width="640" height="350" fill="#fff"/><rect x="20" y="18" width="600" height="314" rx="10" fill="#f8fbfc" stroke="#dfe6e9"/><text x="38" y="56" font-size="19" fill="#173d56" font-weight="bold">두 변의 합이 14일 때 넓이의 최댓값</text><rect x="145" y="91" width="210" height="210" fill="#e2f2f1" stroke="#166877" stroke-width="2.5"/><text x="250" y="198" text-anchor="middle" font-size="27" font-weight="bold" fill="#126e67">49</text><text x="250" y="322" text-anchor="middle" font-size="18" fill="#173d56">가로 = x+2 = 7</text><text x="127" y="201" text-anchor="middle" transform="rotate(-90 127 201)" font-size="18" fill="#173d56">세로 = y+1 = 7</text><text x="399" y="133" font-size="17" fill="#324857">등호 조건</text><text x="399" y="173" font-size="19" font-weight="bold" fill="#126e67">x+2 = y+1</text><text x="399" y="214" font-size="18" fill="#324857">x=5, y=6</text><text x="399" y="255" font-size="17" fill="#324857">넓이 7×7</text></svg>
