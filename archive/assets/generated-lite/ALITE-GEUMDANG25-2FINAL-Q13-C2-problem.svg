<svg xmlns="http://www.w3.org/2000/svg" width="640" height="340" viewBox="0 0 640 340" role="img" aria-labelledby="title" aria-describedby="desc"><title id="title">담장과 세 변에 울타리를 설치한 직사각형</title><desc id="desc">직사각형의 한 변은 담장에 붙어 있고 나머지 세 변의 울타리 길이 합은 24 m이다. 담장에 수직인 변을 x m, 평행한 변을 y m로 나타낸다.</desc><rect width="640" height="340" fill="#fff"/><rect x="18" y="18" width="604" height="300" rx="10" fill="#fafcfd" stroke="#e1e8eb"/><text x="37" y="55" font-size="19" font-weight="bold" fill="#1c4157">담장에 맞닿은 직사각형 모양의 땅</text><line x1="158" y1="107" x2="476" y2="107" stroke="#707982" stroke-width="11" stroke-linecap="round"/><text x="317" y="89" font-size="18" text-anchor="middle" fill="#3b4650">담장 (울타리 없음)</text><rect x="202" y="112" width="230" height="148" fill="#e3f1e9" stroke="none"/><path d="M202 112 V260 H432 V112" stroke="#176977" stroke-width="4" fill="none" stroke-linejoin="round"/><text x="184" y="196" font-size="19" text-anchor="middle" fill="#174e60">x</text><text x="452" y="196" font-size="19" fill="#174e60">x</text><text x="316" y="290" text-anchor="middle" font-size="19" fill="#174e60">y</text></svg>