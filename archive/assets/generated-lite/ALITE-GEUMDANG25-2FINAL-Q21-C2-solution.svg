<svg xmlns="http://www.w3.org/2000/svg" width="380" height="190" viewBox="0 0 380 190" preserveAspectRatio="xMidYMid meet"><title>q21 C2 해설: 서로소인 집합</title><desc>U={1,…,24} 안에서 예시 k=7인 4의 배수와 7의 배수이다. 공통 원소가 없는 집합들은 겹치지 않는 원으로 표시한다.</desc><rect width="380" height="190" fill="#FFFFFF"/><text x="190" y="14" text-anchor="middle" font-size="11">U={1,…,24}; 예: k=7</text><circle cx="103" cy="95" r="60" stroke="#252525" stroke-width="2.05" fill="#FFFFFF"/><text x="103" y="23" text-anchor="middle" font-size="14">A</text><text x="103" y="98" text-anchor="middle" font-size="13">4의 배수</text>
<circle cx="277" cy="95" r="60" stroke="#252525" stroke-width="2.05" fill="#FFFFFF"/><text x="277" y="23" text-anchor="middle" font-size="14">B₇</text><text x="277" y="98" text-anchor="middle" font-size="13">7의 배수</text><text x="190" y="178" text-anchor="middle" font-size="13" fill="#222222">공통 원소가 없음 → 교집합은 공집합</text></svg>
