<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="390" viewBox="0 0 640 390" role="img" aria-labelledby="title desc">
<title id="title">금당고 Q12 C1 절댓값의 열린 직사각형</title><desc id="desc">|x|이 2보다 작고 |y|가 3보다 작은 열린 직사각형. 우상단 (2,3)에 접근하면 3x+2y는 12에 가까워진다.</desc>
<rect width="640" height="390" fill="#ffffff"/><rect x="22" y="20" width="595" height="349" rx="9" fill="#fcfdfe" stroke="#e3e8eb"/>
<line x1="46" y1="250" x2="593" y2="250" stroke="#7b8d9b" stroke-width="1.4"/>
<line x1="300" y1="45" x2="300" y2="358" stroke="#7b8d9b" stroke-width="1.4"/>
<text x="585" y="241" font-size="14" fill="#475d69">x</text><text x="307" y="60" font-size="14" fill="#475d69">y</text>
<rect x="216" y="124" width="168" height="252" fill="#deeff3" stroke="#a84d35" stroke-width="2" stroke-dasharray="7 5"/><circle cx="384" cy="124" r="6" fill="white" stroke="#a84d35" stroke-width="2"/><text x="227" y="218" font-size="16" fill="#243949" >|x|&lt;2</text><text x="227" y="246" font-size="16" fill="#243949" >|y|&lt;3</text><text x="393" y="119" font-size="16" fill="#243949" >(2,3) 제외</text><text x="198" y="112" font-size="16" fill="#243949" >−2</text><text x="391" y="357" font-size="16" fill="#243949" >2</text><text x="472" y="126" font-size="16" fill="#243949" >y=3</text>
</svg>
