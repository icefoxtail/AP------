<svg xmlns="http://www.w3.org/2000/svg" width="780" height="470" viewBox="0 0 780 470" role="img"><rect width="780" height="470" fill="#FFFFFF"/><rect x="20" y="16" width="740" height="438" rx="13" fill="#fcfdfe" stroke="#dce6ea"/><text x="42" y="48" font-size="23" font-weight="bold" fill="#183d51">집합의 두 조건을 동시에 만족하는 k</text><rect x="42" y="77" width="215" height="93" rx="8" fill="#eaf2f5"/><rect x="268" y="77" width="216" height="93" rx="8" fill="#eaf4ef"/><rect x="495" y="77" width="239" height="93" rx="8" fill="#f5f0e9"/><text x="58" y="108" font-size="16">A ∩ B 원소의 합</text><text x="58" y="146" font-size="29" font-weight="bold">5</text><text x="285" y="108" font-size="16">n(A ∪ C) 허용 범위</text><text x="285" y="146" font-size="27" font-weight="bold">9 ~ 11</text><text x="512" y="108" font-size="16">k의 탐색 범위</text><text x="512" y="146" font-size="26" font-weight="bold">25 ~ 39</text><text x="44" y="202" font-size="17">A = {2, 3, 5, 7, 11} · C는 5의 양의 배수</text><rect x="42" y="212" width="694" height="36" fill="#dfe9ee"/><text x="69" y="236" font-size="16">k</text><text x="242" y="236" font-size="16">A ∩ B</text><text x="524" y="236" font-size="16">n(A ∪ C)</text><rect x="43" y="229" width="692" height="44" fill="#f3f8fa"/><text x="69" y="260" font-size="19" font-weight="bold" fill="#153d52">25</text><text x="242" y="260" font-size="18" fill="#1c5366">{5}</text><text x="524" y="260" font-size="18" fill="#28685f">9</text><rect x="43" y="276" width="692" height="44" fill="#fff"/><text x="69" y="307" font-size="19" font-weight="bold" fill="#153d52">36</text><text x="242" y="307" font-size="18" fill="#1c5366">{2, 3}</text><text x="524" y="307" font-size="18" fill="#28685f">11</text><text x="47" y="433" font-size="22" font-weight="bold" fill="#16645d">가능한 k의 합 = 25 + 36 = 61</text></svg>
