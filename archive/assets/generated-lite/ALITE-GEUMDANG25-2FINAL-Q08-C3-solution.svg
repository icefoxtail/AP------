<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="696" height="200" viewBox="0 0 696 200" role="img"><title>역함수 합성 관계의 계수 비교</title><desc>역함수 식을 원래 함수로 되돌려 두 일차식의 계수를 비교한다.</desc>
<rect x="12" y="12" width="224" height="44" fill="#fff" stroke="#111" stroke-width="1"/><text x="124" y="34" text-anchor="middle" dominant-baseline="middle" font-size="13">순서</text>
<rect x="236" y="12" width="224" height="44" fill="#fff" stroke="#111" stroke-width="1"/><text x="348" y="34" text-anchor="middle" dominant-baseline="middle" font-size="13">식</text>
<rect x="460" y="12" width="224" height="44" fill="#fff" stroke="#111" stroke-width="1"/><text x="572" y="34" text-anchor="middle" dominant-baseline="middle" font-size="13">판단 근거</text>
<rect x="12" y="56" width="224" height="44" fill="#fff" stroke="#111" stroke-width="1"/><text x="124" y="78" text-anchor="middle" dominant-baseline="middle" font-size="13">원래 조건</text>
<rect x="236" y="56" width="224" height="44" fill="#fff" stroke="#111" stroke-width="1"/><text x="348" y="78" text-anchor="middle" dominant-baseline="middle" font-size="13">f⁻¹(4x−1)=2x+3</text>
<rect x="460" y="56" width="224" height="44" fill="#fff" stroke="#111" stroke-width="1"/><text x="572" y="78" text-anchor="middle" dominant-baseline="middle" font-size="13">역함수 관계</text>
<rect x="12" y="100" width="224" height="44" fill="#fff" stroke="#111" stroke-width="1"/><text x="124" y="122" text-anchor="middle" dominant-baseline="middle" font-size="13">함수 f 적용</text>
<rect x="236" y="100" width="224" height="44" fill="#fff" stroke="#111" stroke-width="1"/><text x="348" y="122" text-anchor="middle" dominant-baseline="middle" font-size="13">4x−1=f(2x+3)</text>
<rect x="460" y="100" width="224" height="44" fill="#fff" stroke="#111" stroke-width="1"/><text x="572" y="122" text-anchor="middle" dominant-baseline="middle" font-size="13">정함수 복원</text>
<rect x="12" y="144" width="224" height="44" fill="#fff" stroke="#111" stroke-width="1"/><text x="124" y="166" text-anchor="middle" dominant-baseline="middle" font-size="13">계수 비교</text>
<rect x="236" y="144" width="224" height="44" fill="#fff" stroke="#111" stroke-width="1"/><text x="348" y="166" text-anchor="middle" dominant-baseline="middle" font-size="13">2a=4, 3a+b=−1</text>
<rect x="460" y="144" width="224" height="44" fill="#fff" stroke="#111" stroke-width="1"/><text x="572" y="166" text-anchor="middle" dominant-baseline="middle" font-size="13">항등식</text>
</svg>
