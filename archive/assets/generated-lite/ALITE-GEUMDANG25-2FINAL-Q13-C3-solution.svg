<svg xmlns="http://www.w3.org/2000/svg" width="640" height="390" viewBox="0 0 640 390" role="img" aria-labelledby="title desc"><title id="title">C3 곱셈식으로 고친 넓이와 등호 성립</title><desc id="desc">xy+x+y+1=(x+1)(y+1)=36. x+1과 y+1이 6으로 같아질 때 x=y=5이고 x제곱 더하기 y제곱은 50이다.</desc><rect width="640" height="390" fill="#fff"/><rect x="18" y="18" width="604" height="354" rx="10" fill="#f8fbfc" stroke="#e0e7ea"/><text x="38" y="53" font-size="19" font-weight="bold" fill="#173e56">xy+x+y+1 = (x+1)(y+1) = 36</text><rect x="91" y="76" width="300" height="300" fill="#fff" stroke="#1a6b78" stroke-width="2.4"/><rect x="91" y="76" width="250" height="250" fill="#d5ede6"/><rect x="341" y="76" width="50" height="250" fill="#f1e7d1"/><rect x="91" y="326" width="250" height="50" fill="#e3e9f4"/><rect x="341" y="326" width="50" height="50" fill="#f0f0f0"/><path d="M341 76 V376 M91 326 H391" stroke="#7e999f" stroke-width="1.5"/><text x="215" y="204" text-anchor="middle" font-size="28" fill="#185e65" font-weight="bold">xy=25</text><text x="365" y="204" text-anchor="middle" font-size="18" fill="#62533d">y=5</text><text x="216" y="357" text-anchor="middle" font-size="18" fill="#344d78">x=5</text><text x="365" y="357" text-anchor="middle" font-size="17" fill="#52616a">1</text><text x="419" y="119" font-size="18" fill="#324b5d">두 변의 곱 36</text><text x="419" y="156" font-size="17" fill="#324b5d">등호일 때</text><text x="419" y="190" font-size="19" fill="#17656a">x+1=y+1=6</text><text x="419" y="225" font-size="17" fill="#324b5d">x=y=5</text><text x="419" y="273" font-size="20" fill="#17576c" font-weight="bold">x²+y²=50</text></svg>
