<svg xmlns="http://www.w3.org/2000/svg" width="660" height="355" viewBox="0 0 660 355" preserveAspectRatio="xMidYMid meet">
<title>C3 해설: 2의 배수와 3의 배수의 포함 관계</title><desc>전체집합 1부터 18까지에서 A는 2의 배수, B는 3의 배수이다. A에만 속하는 수는 2,4,8,10,14,16, 교집합은 6,12,18, B에만 속하는 수는 3,9,15이다. A 교집합 B는 A와 B 각각의 진부분집합이다.</desc>
<rect x="1" y="1" width="658" height="353" rx="10" fill="#fff" stroke="#888" stroke-width="1"/>
<text x="24" y="30" font-family="Noto Sans CJK KR, sans-serif" font-size="17" fill="#222" font-weight="600">U = {1, 2, ..., 18}</text>
<circle cx="265" cy="160" r="113" fill="#eeeeee" fill-opacity="0.65" stroke="#262626" stroke-width="2"/>
<circle cx="395" cy="160" r="113" fill="#dddddd" fill-opacity="0.48" stroke="#262626" stroke-width="2"/>
<text x="184" y="70" font-family="Noto Sans CJK KR, sans-serif" font-size="16" font-weight="600" fill="#222">A</text>
<text x="469" y="70" font-family="Noto Sans CJK KR, sans-serif" font-size="16" font-weight="600" fill="#222">B</text>
<text x="220" y="135" text-anchor="middle" font-family="Noto Sans CJK KR, sans-serif" font-size="15" fill="#111">2, 4, 8</text>
<text x="220" y="160" text-anchor="middle" font-family="Noto Sans CJK KR, sans-serif" font-size="15" fill="#111">10, 14, 16</text>
<text x="330" y="148" text-anchor="middle" font-family="Noto Sans CJK KR, sans-serif" font-size="17" font-weight="600" fill="#111">6, 12, 18</text>
<text x="330" y="175" text-anchor="middle" font-family="Noto Sans CJK KR, sans-serif" font-size="13" fill="#333">A ∩ B</text>
<text x="444" y="150" text-anchor="middle" font-family="Noto Sans CJK KR, sans-serif" font-size="15" fill="#111">3, 9, 15</text>
<text x="330" y="332" text-anchor="middle" font-family="Noto Sans CJK KR, sans-serif" font-size="15" fill="#333">k = 2 → 집합 A, k = 3 → 집합 B (각각 교집합을 포함)</text>
<text x="30" y="292" font-family="Noto Sans CJK KR, sans-serif" font-size="13" fill="#555">두 원 밖: 1, 5, 7, 11, 13, 17</text>
</svg>