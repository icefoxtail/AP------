<svg xmlns="http://www.w3.org/2000/svg" width="500" height="190" viewBox="0 0 500 190" preserveAspectRatio="xMidYMid meet">
<title>금당고 Q22 B2 정확히 한 교점인 두 경우</title>
<desc>t=√(x−4)≥0, F(t)=t²−t+(k+4). 왼쪽은 k&lt;−4여서 양의 근 하나, 오른쪽은 k=−15/4여서 양의 중근 하나이다. 두 상황 모두 원래 교점은 하나다.</desc>
<rect width="500" height="190" fill="#fff"/>
<text x="12" y="18" font-size="11" font-weight="600">F(t) = t² − t + (k + 4), t ≥ 0</text>
<text x="12" y="47" font-size="10" font-weight="600">한 양의 근 (k &lt; −4)</text>
<text x="12" y="61" font-size="8">k=−5: t²−t−1=0</text>
