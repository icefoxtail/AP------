<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="600" height="180" viewBox="0 0 600 180" role="img"><title>일대일 대응을 위한 입력 선택</title><desc>0은 반드시 선택하고 1과 4는 각각 두 후보 중 하나를 선택한다.</desc><rect x="12" y="12" width="144" height="52" stroke="#111" fill="white"/><text x="84" y="38" text-anchor="middle" dominant-baseline="middle" font-size="13">함숫값</text>
<rect x="156" y="12" width="144" height="52" stroke="#111" fill="white"/><text x="228" y="38" text-anchor="middle" dominant-baseline="middle" font-size="13">0</text>
<rect x="300" y="12" width="144" height="52" stroke="#111" fill="white"/><text x="372" y="38" text-anchor="middle" dominant-baseline="middle" font-size="13">1</text>
<rect x="444" y="12" width="144" height="52" stroke="#111" fill="white"/><text x="516" y="38" text-anchor="middle" dominant-baseline="middle" font-size="13">4</text>
<rect x="12" y="64" width="144" height="52" stroke="#111" fill="white"/><text x="84" y="90" text-anchor="middle" dominant-baseline="middle" font-size="13">가능한 입력</text>
<rect x="156" y="64" width="144" height="52" stroke="#111" fill="white"/><text x="228" y="90" text-anchor="middle" dominant-baseline="middle" font-size="13">0</text>
<rect x="300" y="64" width="144" height="52" stroke="#111" fill="white"/><text x="372" y="90" text-anchor="middle" dominant-baseline="middle" font-size="13">−1, 1</text>
<rect x="444" y="64" width="144" height="52" stroke="#111" fill="white"/><text x="516" y="90" text-anchor="middle" dominant-baseline="middle" font-size="13">−2, 2</text>
<rect x="12" y="116" width="144" height="52" stroke="#111" fill="white"/><text x="84" y="142" text-anchor="middle" dominant-baseline="middle" font-size="13">선택 경우</text>
<rect x="156" y="116" width="144" height="52" stroke="#111" fill="white"/><text x="228" y="142" text-anchor="middle" dominant-baseline="middle" font-size="13">1</text>
<rect x="300" y="116" width="144" height="52" stroke="#111" fill="white"/><text x="372" y="142" text-anchor="middle" dominant-baseline="middle" font-size="13">2</text>
<rect x="444" y="116" width="144" height="52" stroke="#111" fill="white"/><text x="516" y="142" text-anchor="middle" dominant-baseline="middle" font-size="13">2</text></svg>
