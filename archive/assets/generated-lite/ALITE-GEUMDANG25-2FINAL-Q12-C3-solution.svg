<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="390" viewBox="0 0 640 390" role="img" aria-labelledby="title desc">
<title id="title">금당고 Q12 C3 연속변수 열린 구간</title><desc id="desc">직선 x+y=5에서 결론이 거짓인 부분은 (1,4)에서 (2,3) 사이 열린 선분이다. 2x+3y는 14보다 작지만 14에 가까워진다.</desc>
<rect width="640" height="390" fill="#ffffff"/><rect x="22" y="20" width="595" height="349" rx="9" fill="#fcfdfe" stroke="#e3e8eb"/>
<line x1="46" y1="250" x2="593" y2="250" stroke="#7b8d9b" stroke-width="1.4"/>
<line x1="300" y1="45" x2="300" y2="358" stroke="#7b8d9b" stroke-width="1.4"/>
<text x="585" y="241" font-size="14" fill="#475d69">x</text><text x="307" y="60" font-size="14" fill="#475d69">y</text>
<line x1="300" y1="40" x2="510" y2="250" stroke="#9daeb8" stroke-width="2" stroke-dasharray="6 5"/><line x1="342" y1="82" x2="384" y2="124" stroke="#168078" stroke-width="7" stroke-linecap="round"/><circle cx="342" cy="82" r="7" fill="white" stroke="#ad5037" stroke-width="2"/><circle cx="384" cy="124" r="7" fill="white" stroke="#ad5037" stroke-width="2"/><text x="391" y="79" font-size="16" fill="#243949" >(1,4) 제외</text><text x="398" y="153" font-size="16" fill="#243949" >(2,3) 제외</text><text x="79" y="92" font-size="16" fill="#243949" >1&lt;x&lt;2</text><text x="79" y="126" font-size="16" fill="#243949" >2x+3y = 15−x</text><text x="79" y="161" font-size="16" fill="#243949" >상한 14는 미도달</text>
</svg>
