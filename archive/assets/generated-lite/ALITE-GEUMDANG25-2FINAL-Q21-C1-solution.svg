<svg xmlns="http://www.w3.org/2000/svg" width="380" height="190" viewBox="0 0 380 190" preserveAspectRatio="xMidYMid meet"><title>q21 C1 해설: 서로소인 집합</title><desc>1,4,7 / 9,10,11 / 2,5,8는 서로소의 예시이다. 공통 원소가 없는 집합들은 겹치지 않는 원으로 표시한다.</desc><rect width="380" height="190" fill="#FFFFFF"/><circle cx="78" cy="95" r="45" stroke="#252525" stroke-width="2.05" fill="#FFFFFF"/><text x="78" y="23" text-anchor="middle" font-size="14">A</text><text x="78" y="98" text-anchor="middle" font-size="13">1,4,7</text>
<circle cx="190" cy="95" r="45" stroke="#252525" stroke-width="2.05" fill="#FFFFFF"/><text x="190" y="23" text-anchor="middle" font-size="14">B₉</text><text x="190" y="98" text-anchor="middle" font-size="13">9,10,11</text>
<circle cx="302" cy="95" r="45" stroke="#252525" stroke-width="2.05" fill="#FFFFFF"/><text x="302" y="23" text-anchor="middle" font-size="14">C</text><text x="302" y="98" text-anchor="middle" font-size="13">2,5,8</text><text x="190" y="178" text-anchor="middle" font-size="13" fill="#222222">공통 원소가 없음 → 교집합은 공집합</text></svg>
