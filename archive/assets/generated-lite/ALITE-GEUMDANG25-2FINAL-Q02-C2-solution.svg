<svg xmlns="http://www.w3.org/2000/svg" width="660" height="186" viewBox="0 0 660 186" preserveAspectRatio="xMidYMid meet"><title>C2 해설: 부분집합 조건을 만족하는 정수 k</title><desc>k는 0부터 6까지이며 k=4에서는 B4가 C의 부분집합이므로 제외한다. 남은 k는 0, 1, 2, 3, 5, 6이다.</desc><rect width="660" height="186" fill="#fff"/><text x="30" y="30" font-size="17" font-family="Noto Sans CJK KR, sans-serif" font-weight="600" fill="#222">첫 번째 포함 조건: k = 0, 1, ..., 6</text><text x="30" y="55" font-size="14" font-family="Noto Sans CJK KR, sans-serif" fill="#555">두 번째 조건에서 k = 4 제외</text><line x1="71" y1="105" x2="566" y2="105" stroke="#333" stroke-width="1.6"/><line x1="83" y1="99" x2="83" y2="111" stroke="#444" stroke-width="1.2"/><text x="83" y="136" font-size="16" font-family="Noto Sans CJK KR, sans-serif" text-anchor="middle" fill="#222">0</text><circle cx="83" cy="105" r="5.7" fill="#222"/><line x1="158" y1="99" x2="158" y2="111" stroke="#444" stroke-width="1.2"/><text x="158" y="136" font-size="16" font-family="Noto Sans CJK KR, sans-serif" text-anchor="middle" fill="#222">1</text><circle cx="158" cy="105" r="5.7" fill="#222"/><line x1="233" y1="99" x2="233" y2="111" stroke="#444" stroke-width="1.2"/><text x="233" y="136" font-size="16" font-family="Noto Sans CJK KR, sans-serif" text-anchor="middle" fill="#222">2</text><circle cx="233" cy="105" r="5.7" fill="#222"/><line x1="308" y1="99" x2="308" y2="111" stroke="#444" stroke-width="1.2"/><text x="308" y="136" font-size="16" font-family="Noto Sans CJK KR, sans-serif" text-anchor="middle" fill="#222">3</text><circle cx="308" cy="105" r="5.7" fill="#222"/><line x1="383" y1="99" x2="383" y2="111" stroke="#444" stroke-width="1.2"/><text x="383" y="136" font-size="16" font-family="Noto Sans CJK KR, sans-serif" text-anchor="middle" fill="#222">4</text><circle cx="383" cy="105" r="7" fill="#fff" stroke="#222" stroke-width="1.6"/><path d="M379.3,101.3 l7.4,7.4 m0,-7.4 l-7.4,7.4" stroke="#222" stroke-width="1.2"/><line x1="458" y1="99" x2="458" y2="111" stroke="#444" 