<svg xmlns="http://www.w3.org/2000/svg" width="620" height="260" viewBox="0 0 620 260" role="img" aria-label="세 상자의 같은 선택확률과 금화를 관측할 확률의 가지별 차이를 보여 주는 조건부확률 나무."><title>세 상자의 같은 선택확률과 금화를 관측할 확률의 가지별 차이를 보여 주는 조건부확률 나무.</title><desc>세 상자의 같은 선택확률과 금화를 관측할 확률의 가지별 차이를 보여 주는 조건부확률 나무.</desc><rect x="0" y="0" width="620" height="260" fill="#fff"/><rect x="15" y="70" width="145" height="42" fill="#fff" stroke="#333"/><text x="30" y="95" font-size="17">상자 선택 1/3</text><line x1="160" y1="91" x2="245" y2="35" stroke="#333"/><line x1="160" y1="91" x2="245" y2="112" stroke="#333"/><line x1="160" y1="91" x2="245" y2="190" stroke="#333"/><text x="253" y="40" font-size="17">금금: 금화 확률 1</text><text x="253" y="115" font-size="17">금은: 금화 확률 1/2</text><text x="253" y="193" font-size="17">은은: 금화 확률 0</text><text x="25" y="239" font-size="16">금화 관측 후 금금 상자 확률 = (1/3) / (1/2) = 2/3</text></svg>
