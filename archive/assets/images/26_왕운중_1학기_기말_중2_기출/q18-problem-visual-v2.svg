<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 737 551" width="737" height="551" role="img" aria-labelledby="title desc"><title id="title">두 기울어진 직선과 가로선이 만든 삼각형</title><desc id="desc">일차방정식 ax+y+b=0의 파란 실선과 y=−2x+9의 주황 점선이 A에서 만난다. 가로선 y=3은 두 직선과 각각 B와 C에서 만나고 B는 y축 위이다. A 아래 x축에 k를 표시했다.</desc><rect width="737" height="551" fill="white" /><line x1="73.0000" y1="409.8762" x2="666.0000" y2="409.8762" stroke="#586574" stroke-width="2.05" stroke-linecap="round" /><polygon points="679.0000,409.8762 666.0000,404.6762 666.0000,415.0762" fill="#586574" /><line x1="260.5244" y1="480.0000" x2="260.5244" y2="95.0000" stroke="#586574" stroke-width="2.05" stroke-linecap="round" /><polygon points="260.5244,82.0000 255.3244,95.0000 265.7244,95.0000" fill="#586574" /><text x="695.000" y="396.876" fill="#586574" font-size="29" font-weight="600" font-family="Malgun Gothic, Cambria Math, sans-serif" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="4.0" stroke-linejoin="round">x</text><text x="279.524" y="77.000" fill="#586574" font-size="29" font-weight="600" font-family="Malgun Gothic, Cambria Math, sans-serif" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="4.0" stroke-linejoin="round">y</text><text x="238.524" y="436.876" fill="#586574" font-size="29" font-weight="600" font-family="Malgun Gothic, Cambria Math, sans-serif" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="4.0" stroke-linejoin="round">O</text><polygon points="260.5244,296.1619 457.9186,296.1619 392.1205,220.3524" fill="#e1f1e7" /><line x1="73.0000" y1="404.1905" x2="632.2834" y2="82.0000" stroke="#205d9c" stroke-width="6.35" stroke-linecap="round" /><line x1="272.0391" y1="82.0000" x2="617.4788" y2="480.0000" stroke="#aa5411" stroke-width="6.25" stroke-linecap="round" stroke-dasharray="16 8" /><line x1="73.0000" y1="296.1619" x2="679.0000" y2="296.1619" stroke="#266f73" stroke-width="4.7" stroke-linecap="round" stroke-dasharray="8 6" /><line x1="392.1205" y1="409.8762" x2="392.1205" y2="220.3524" stroke="#586574" stroke-width="2.15" stroke-linecap="round" stroke-dasharray="7 6" /><line x1="392.1205" y1="404.8762" x2="392.1205" y2="414.8762" stroke="#586574" stroke-width="1.6" stroke-linecap="round" /><text x="392.121" y="439.876" fill="#586574" font-size="29" font-weight="600" font-family="Malgun Gothic, Cambria Math, sans-serif" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="4.0" stroke-linejoin="round">k</text><text x="107.290" y="282.162" fill="#266f73" font-size="29" font-weight="600" font-family="Malgun Gothic, Cambria Math, sans-serif" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="4.0" stroke-linejoin="round">y = 3</text><circle cx="260.5244299674267" cy="296.1619047619048" r="6" fill="#266f73" stroke="white" stroke-width="2" /><text x="246.524" y="324.162" fill="#28364b" font-size="29" font-weight="600" font-family="Malgun Gothic, Cambria Math, sans-serif" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="4.0" stroke-linejoin="round">B</text><circle cx="457.91856677524424" cy="296.1619047619048" r="6" fill="#266f73" stroke="white" stroke-width="2" /><text x="479.919" y="320.162" fill="#28364b" font-size="29" font-weight="600" font-family="Malgun Gothic, Cambria Math, sans-serif" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="4.0" stroke-linejoin="round">C</text><circle cx="392.1205211726384" cy="220.352380952381" r="6" fill="#266f73" stroke="white" stroke-width="2" /><text x="413.121" y="204.352" fill="#28364b" font-size="29" font-weight="600" font-family="Malgun Gothic, Cambria Math, sans-serif" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="4.0" stroke-linejoin="round">A</text><line x1="73.0000" y1="39.0000" x2="118.0000" y2="39.0000" stroke="#205d9c" stroke-width="5.65" stroke-linecap="round" /><text x="129.0000" y="46.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#205d9c" text-anchor="start">ax + y + b = 0</text><line x1="395.0000" y1="39.0000" x2="440.0000" y2="39.0000" stroke="#aa5411" stroke-width="5.65" stroke-linecap="round" stroke-dasharray="16 8" /><text x="451.0000" y="46.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#aa5411" text-anchor="start">y = −2x + 9</text></svg>
