<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 841" width="740" height="841" role="img" aria-labelledby="title desc"><title id="title">세 직선이 삼각형을 만들지 않는 세 경우</title><desc id="desc">모든 그림에서 기존 두 직선은 파란 실선과 주황 점선이다. 청록 짧은 점선은 세로축의 3을 지나는 세 번째 직선이다. 첫째는 파란 직선과 평행, 둘째는 주황 직선과 평행, 셋째는 세 직선이 한 점에서 만나는 경우이다.</desc><rect width="740" height="841" fill="white" /><line x1="37.0000" y1="39.0000" x2="82.0000" y2="39.0000" stroke="#205d9c" stroke-width="5.65" stroke-linecap="round" /><text x="93.0000" y="46.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#205d9c" text-anchor="start">y = x + 4</text><line x1="240.0000" y1="39.0000" x2="285.0000" y2="39.0000" stroke="#aa5411" stroke-width="5.65" stroke-linecap="round" stroke-dasharray="18 8" /><text x="296.0000" y="46.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#aa5411" text-anchor="start">y = −3x − 4</text><line x1="504.0000" y1="39.0000" x2="549.0000" y2="39.0000" stroke="#266f73" stroke-width="5.65" stroke-linecap="round" stroke-dasharray="7 6" /><text x="560.0000" y="46.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#266f73" text-anchor="start">세 번째 직선</text><rect x="33" y="82" width="674" height="235" rx="12" fill="#f8fbfd" stroke="#d6e3ee" stroke-width="1.35" /><text x="94.0000" y="118.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="start">오름직선과 평행</text><line x1="83.0000" y1="228.0233" x2="637.0000" y2="228.0233" stroke="#586574" stroke-width="2.05" stroke-linecap="round" /><polygon points="650.0000,228.0233 637.0000,222.8233 637.0000,233.2233" fill="#586574" /><line x1="394.8500" y1="289.0000" x2="394.8500" y2="164.0000" stroke="#586574" stroke-width="2.05" stroke-linecap="round" /><polygon points="394.8500,151.0000 389.6500,164.0000 400.0500,164.0000" fill="#586574" /><line x1="83.0000"