<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 710 489" width="710" height="489" role="img" aria-labelledby="title desc"><title id="title">같은 타일 11장으로 만든 직사각형</title><desc id="desc">위와 아래 줄에 각각 가로로 놓인 타일 세 장이 있다. 그 사이에는 세로로 놓인 타일 다섯 장이 있다. 모든 타일의 모양과 크기는 같다.</desc><rect width="710" height="489" fill="white" /><rect x="62" y="31" width="195" height="117" fill="#e7f1fa" stroke="#205d9c" stroke-width="3.55" /><rect x="257" y="31" width="195" height="117" fill="#e7f1fa" stroke="#205d9c" stroke-width="3.55" /><rect x="452" y="31" width="195" height="117" fill="#e7f1fa" stroke="#205d9c" stroke-width="3.55" /><rect x="62" y="148" width="117" height="195" fill="#e2f1e8" stroke="#266f73" stroke-width="3.55" /><rect x="179" y="148" width="117" height="195" fill="#e2f1e8" stroke="#266f73" stroke-width="3.55" /><rect x="296" y="148" width="117" height="195" fill="#e2f1e8" stroke="#266f73" stroke-width="3.55" /><rect x="413" y="148" width="117" height="195" fill="#e2f1e8" stroke="#266f73" stroke-width="3.55" /><rect x="530" y="148" width="117" height="195" fill="#e2f1e8" stroke="#266f73" stroke-width="3.55" /><rect x="62" y="343" width="195" height="117" fill="#e7f1fa" stroke="#205d9c" stroke-width="3.55" /><rect x="257" y="343" width="195" height="117" fill="#e7f1fa" stroke="#205d9c" stroke-width="3.55" /><rect x="452" y="343" width="195" height="117" fill="#e7f1fa" stroke="#205d9c" stroke-width="3.55" /><rect x="62" y="31" width="585" height="429" fill="none" stroke="#205d9c" stroke-width="5" /></svg>
