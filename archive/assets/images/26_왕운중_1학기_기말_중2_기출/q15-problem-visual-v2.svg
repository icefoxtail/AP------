<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 704 484" width="704" height="484" role="img" aria-labelledby="title desc"><title id="title">세로축 양의 부분을 지나는 내림직선</title><desc id="desc">점선으로 그린 y=bx−a는 오른쪽으로 갈수록 낮아진다. 이 직선은 세로축에서 원점 위를 지나고 가로축에서 원점 오른쪽을 지난다.</desc><rect width="704" height="484" fill="white" /><line x1="72.0000" y1="277.9623" x2="623.0000" y2="277.9623" stroke="#586574" stroke-width="2.05" stroke-linecap="round" /><polygon points="636.0000,277.9623 623.0000,272.7623 623.0000,283.1623" fill="#586574" /><line x1="329.0127" y1="419.0000" x2="329.0127" y2="107.0000" stroke="#586574" stroke-width="2.05" stroke-linecap="round" /><polygon points="329.0127,94.0000 323.8127,107.0000 334.2127,107.0000" fill="#586574" /><text x="652.000" y="264.962" fill="#586574" font-size="29" font-weight="600" font-family="Malgun Gothic, Cambria Math, sans-serif" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="4.0" stroke-linejoin="round">x</text><text x="348.013" y="89.000" fill="#586574" font-size="29" font-weight="600" font-family="Malgun Gothic, Cambria Math, sans-serif" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="4.0" stroke-linejoin="round">y</text><text x="306.013" y="304.962" fill="#586574" font-size="29" font-weight="600" font-family="Malgun Gothic, Cambria Math, sans-serif" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="4.0" stroke-linejoin="round">O</text><line x1="152.9114" y1="94.0000" x2="636.0000" y2="405.2028" stroke="#aa5411" stroke-width="7" stroke-linecap="round" stroke-dasharray="17 8" /><line x1="262.0000" y1="39.0000" x2="307.0000" y2="39.0000" stroke="#aa5411" stroke-width="5.65" stroke-linecap="round" stroke-dasharray="17 8" /><text x="318.0000" y="46.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#aa5411" text-anchor="start">y = bx − a</text></svg>
