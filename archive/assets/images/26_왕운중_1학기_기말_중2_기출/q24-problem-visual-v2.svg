<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 723 511" width="723" height="511" role="img" aria-labelledby="title desc"><title id="title">오르는 직선과 내리는 직선의 교점</title><desc id="desc">파란 실선 −x+y−4=0과 주황 점선 3x+y+4=0이 세로축 왼쪽에서 교차한다. 파란 선은 오른쪽 위로, 주황 선은 오른쪽 아래로 향한다.</desc><rect width="723" height="511" fill="white" /><line x1="72.0000" y1="285.7195" x2="642.0000" y2="285.7195" stroke="#586574" stroke-width="2.05" stroke-linecap="round" /><polygon points="655.0000,285.7195 642.0000,280.5195 642.0000,290.9195" fill="#586574" /><line x1="434.2524" y1="445.0000" x2="434.2524" y2="105.0000" stroke="#586574" stroke-width="2.05" stroke-linecap="round" /><polygon points="434.2524,92.0000 429.0524,105.0000 439.4524,105.0000" fill="#586574" /><text x="671.000" y="272.720" fill="#586574" font-size="29" font-weight="600" font-family="Malgun Gothic, Cambria Math, sans-serif" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="4.0" stroke-linejoin="round">x</text><text x="453.252" y="87.000" fill="#586574" font-size="29" font-weight="600" font-family="Malgun Gothic, Cambria Math, sans-serif" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="4.0" stroke-linejoin="round">y</text><text x="411.252" y="312.720" fill="#586574" font-size="29" font-weight="600" font-family="Malgun Gothic, Cambria Math, sans-serif" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="4.0" stroke-linejoin="round">O</text><line x1="72.0000" y1="337.3780" x2="655.0000" y2="115.6768" stroke="#205d9c" stroke-width="6.7" stroke-linecap="round" /><line x1="188.9773" y1="92.0000" x2="498.4013" y2="445.0000" stroke="#aa5411" stroke-width="6.7" stroke-linecap="round" stroke-dasharray="17 8" /><line x1="79.0000" y1="39.0000" x2="124.0000" y2="39.0000" stroke="#205d9c" stroke-width="5.65" stroke-linecap="round" /><text x="135.0000" y="46.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#205d9c" text-anchor="start">−x + y − 4 = 0</text><line x1="401.0000" y1="39.0000" x2="446.0000" y2="39.0000" stroke="#aa5411" stroke-width="5.65" stroke-linecap="round" stroke-dasharray="17 8" /><text x="457.0000" y="46.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#aa5411" text-anchor="start">3x + y + 4 = 0</text></svg>
