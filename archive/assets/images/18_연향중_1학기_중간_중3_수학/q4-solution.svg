<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 320" width="420" height="320" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">√2≈1.414, √3≈1.732이므로 √2&lt;√3이다. 같은 수 √7을 빼도 대소 관계는 그대로이므로 √2-√7&lt;√3-√7이다. 나머지 보기의 부등식은 모두 거짓이다. 따라서 답은 ④이다.</title><desc id="visual-desc">세로로 네 개의 가로 막대가 놓여 있고, 위의 두 막대는 0에서 오른쪽으로, 아래의 두 막대는 0에서 왼쪽으로 뻗는다. 각 막대 위에 √2, √3, √2-√7, √3-√7이 적혀 있다.</desc><rect width="420" height="320" fill="#fff"/><g data-layer="30"><line id="s1" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="190.952380952" y1="45.714285714" x2="298.685714286" y2="45.714285714"/></g><g data-layer="30"><line id="s2" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="190.952380952" y1="121.904761905" x2="322.914285714" y2="121.904761905"/></g><g data-layer="30"><line id="s3" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="190.952380952" y1="198.095238095" x2="97.085714286" y2="198.095238095"/></g><g data-layer="30"><line id="s4" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="190.952380952" y1="274.285714286" x2="121.314285714" y2="274.285714286"/></g><g data-layer="70"><circle id="O1" data-role="point" stroke="#111" stroke-width="0.8" fill="#111" cx="190.952380952" cy="45.714285714" r="3.2"/></g><g data-layer="70"><circle id="P1" data-role="point" stroke="#111" stroke-width