<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 704 456" width="704" height="456" role="img" aria-labelledby="title desc"><title id="title">넓이가 세 배씩 커지는 네 정사각형</title><desc id="desc">윗변이 한 수평선 위에 있는 네 정사각형이 왼쪽부터 (가), (나), (다), (라) 순서로 커진다. 점 P는 첫 정사각형의 왼쪽 위이고 점 Q는 끝 정사각형의 오른쪽 위이다.</desc><rect width="704" height="456" fill="white" /><rect x="58.000" y="92" width="53.623" height="53.623" stroke="#205d9c" stroke-width="4" fill="#e7eff9" /><text x="84.8114" y="127.8114" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#205d9c" text-anchor="middle">가</text><rect x="111.623" y="92" width="92.877" height="92.877" stroke="#277339" stroke-width="4" fill="#e7f4ea" /><text x="158.0614" y="147.4386" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#277339" text-anchor="middle">나</text><rect x="204.500" y="92" width="160.868" height="160.868" stroke="#aa5411" stroke-width="4" fill="#f9ead9" /><text x="284.9341" y="181.4341" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#aa5411" text-anchor="middle">다</text><rect x="365.368" y="92" width="278.632" height="278.632" stroke="#704895" stroke-width="4" fill="#ece7f6" /><text x="504.6841" y="240.3159" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#704895" text-anchor="middle">라</text><circle cx="58" cy="92" r="5" fill="#28364b" /><text x="48.0000" y="68.0000" font-size="30" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">P</text><circle cx="644" cy="92" r="5" fill="#28364b" /><text x="654.0000" y="68.0000" font-size="30" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">Q</text></svg>
