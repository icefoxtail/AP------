<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 384 360" width="384" height="360" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">(-3)²=9이고 9의 양의 제곱근은 3이므로 ②가 옳다. 0의 제곱근은 0 하나이고, 15의 제곱근은 ±√15이며, 모든 정수의 제곱근이 두 개인 것은 아니다. -10의 제곱근은 실수로 존재하지 않는다. 따라서 답은 ②이다.</title><desc id="visual-desc">한 변이 3인 정사각형이 가로와 세로로 각각 3등분되어 9개의 작은 정사각형으로 나뉘어 있다. 아래쪽 변에는 길이 3을 나타내는 치수선이 있다.</desc><rect width="384" height="360" fill="#fff"/><g data-layer="30"><line id="h00" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="72.655227606" y1="285.010917476" x2="152.218409202" y2="285.010917476"/></g><g data-layer="30"><line id="h01" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="152.218409202" y1="285.010917476" x2="231.781590798" y2="285.010917476"/></g><g data-layer="30"><line id="h02" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="231.781590798" y1="285.010917476" x2="311.344772394" y2="285.010917476"/></g><g data-layer="30"><line id="h10" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="72.655227606" y1="205.44773588" x2="152.218409202" y2="205.44773588"/></g><g data-layer="30"><line id="h11" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="152.218409202" y1="205.44773588" x2="231.781590798" y2="205.44773588"/></g><g data-layer="30"><line id="h12" data-role="line" stroke