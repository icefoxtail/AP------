<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 706 363" width="706" height="363" role="img" aria-labelledby="title desc"><title id="title">나란한 두 정사각형의 대각선과 수직선</title><desc id="desc">수직선의 A, B, C는 차례로 0, 1, 2이다. A·B 위와 B·C 위에 한 변의 길이가 1인 두 정사각형이 나란히 서 있다. B에서 왼쪽 위 D로 잇는 대각선과 오른쪽 위 E로 잇는 대각선이 있다. 같은 길이를 왼쪽 P와 오른쪽 Q를 향하는 두 원호로 옮겼다.</desc><rect width="706" height="363" fill="white" /><polygon points="185.7195,239.2993 345.3181,239.2993 345.3181,79.7007 185.7195,79.7007" fill="none" /><polygon points="345.3181,239.2993 504.9166,239.2993 504.9166,79.7007 345.3181,79.7007" fill="none" /><line x1="185.7195" y1="239.2993" x2="345.3181" y2="239.2993" stroke="#586574" stroke-width="3.6" stroke-linecap="round" /><line x1="345.3181" y1="239.2993" x2="504.9166" y2="239.2993" stroke="#586574" stroke-width="3.6" stroke-linecap="round" /><line x1="345.3181" y1="239.2993" x2="345.3181" y2="79.7007" stroke="#586574" stroke-width="3.6" stroke-linecap="round" /><line x1="185.7195" y1="239.2993" x2="185.7195" y2="79.7007" stroke="#586574" stroke-width="3.6" stroke-linecap="round" /><line x1="185.7195" y1="79.7007" x2="345.3181" y2="79.7007" stroke="#586574" stroke-width="3.6" stroke-linecap="round" /><line x1="345.3181" y1="79.7007" x2="504.9166" y2="79.7007" stroke="#586574" stroke-width="3.6" stroke-linecap="round" /><line x1="504.9166" y1="79.7007" x2="504.9166" y2="239.2993" stroke="#586574" stroke-width="3.6" stroke-linecap="round" /><line x1="345.3181" y1="239.2993" x2="185.7195" y2="79.7007" stroke="#205d9c" stroke-width="4.4" stroke-linecap="round" /><line x1="345.3181" y1="239.2993" x2="504.9166" y2="79.7007" stroke="#205d9c" stroke-width="4.4" stroke-linecap="round" /><path d="M 119.612 239.299 A 225.7064 225.7064 0 0 1 185.720 79.701" fill="none" stroke="#205d9c" stroke-width="4.5" stroke-linecap="round" /><path d="M 504.917 79.701 A 225.7064 225.7064 0 0 1 571.024 239.299" fill="none" stroke="#205d9c" stroke-width="4.5" stroke-linecap="round" /><line x1="278.4385" y1="