<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 635 490" width="635" height="490" role="img" aria-labelledby="title desc"><title id="title">직사각형 안의 두 정사각형</title><desc id="desc">왼쪽의 큰 정사각형 A가 전체 높이를 채운다. 오른쪽 좁은 띠 위에는 직사각형 B가 있고 아래에는 작은 정사각형 C가 있다. B와 C의 가로 길이는 같다.</desc><rect width="635" height="490" fill="white" /><rect x="57" y="55" width="382" height="382" fill="#e8f2fb" stroke="#266f73" stroke-width="4.4" /><text x="248.0000" y="259.0000" font-size="40" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#266f73" text-anchor="middle">A</text><rect x="439" y="55" width="109" height="273" fill="#faecdb" stroke="#aa5411" stroke-width="4.4" /><text x="493.5000" y="204.5000" font-size="40" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#aa5411" text-anchor="middle">B</text><rect x="439" y="328" width="109" height="109" fill="#e8f3e8" stroke="#277339" stroke-width="4.4" /><text x="493.5000" y="395.5000" font-size="40" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#277339" text-anchor="middle">C</text></svg>
