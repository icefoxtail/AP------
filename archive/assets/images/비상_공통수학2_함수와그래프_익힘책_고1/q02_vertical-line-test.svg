<line x1="214" y1="47" x2="214" y2="137"/><line x1="528" y1="42" x2="528" y2="144"/><line x1="196" y1="204" x2="196" y2="307"/><line x1="450" y1="205" x2="450" y2="307"/>
</g>
<g fill="#d14d42" stroke="#fff" stroke-width="1.4">
