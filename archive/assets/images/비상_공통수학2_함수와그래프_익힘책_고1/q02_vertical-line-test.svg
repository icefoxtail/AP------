<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
<title id="title">수직선 판정으로 함수의 그래프 고르기</title>
<desc id="desc">Four graph choices are tested by a vertical line. ㄱ and ㄹ have one intersection for each x. ㄴ has two y values at a positive x and ㄷ has multiple y values for x equal to one.</desc>
