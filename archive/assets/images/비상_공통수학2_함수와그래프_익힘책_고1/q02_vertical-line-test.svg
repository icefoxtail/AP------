</g>
<g stroke="#566a74" stroke-width="1.5" fill="none">
<line x1="48" y1="121" x2="276" y2="121"/><line x1="160" y1="142" x2="160" y2="38"/>
<line x1="364" y1="121" x2="592" y2="121"/><line x1="476" y1="142" x2="476" y2="38"/>
<line x1="48" y1="287" x2="276" y2="287"/><line x1="160" y1="308" x2="160" y2="204"/>
<line x1="364" y1="287" x2="592" y2="287"/><line x1="476" y1="308" x2="476" y2="204"/>
</g>
