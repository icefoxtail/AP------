<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480"><rect x="0" y="0" width="960" height="480" rx="18" fill="#ffffff"/><style>text{font-family:"Noto Sans CJK KR","Malgun Gothic",sans-serif;fill:#1d2938}.title{font-size:27px;font-weight:bold}.sub{font-size:19px}.label{font-size:22px;font-weight:bold}.f{font-size:23px;font-weight:bold;fill:#164d63}</style><text class="title" x="28" y="44">22번 수준별 2-② · 같은 넓이, 다른 모양</text><rect x="74" y="95" width="258" height="258" fill="#d9eef4" stroke="#246378" stroke-width="3"/><rect x="258" y="95" width="74" height="74" fill="#ffffff" stroke="#bd622d" stroke-width="3"/><path d="M258 95 V169 H332" fill="none" stroke="#bd622d" stroke-width="5"/><text class="label" x="180" y="227">A</text><text class="sub" x="133" y="380">한 변 2x−1</text><text class="sub" x="263" y="87">2</text><text class="sub" x="338" y="143">2</text><text class="sub" x="348" y="222">넓이 같음 →</text><rect x="565" y="153" width="324" height="180" fill="#e8f2dc" stroke="#4a6d34" stroke-width="3"/><text class="label" x="721" y="247">B</text><text class="sub" x="698" y="365">가로 2x+1</text><text class="sub" x="570" y="139">세로 2x−3</text><text class="f" x="83" y="432">A=(2x−1)²−2²=(2x−3)(2x+1)</text><text class="f" x="574" y="432">B의 가로=2x+1</text></svg>