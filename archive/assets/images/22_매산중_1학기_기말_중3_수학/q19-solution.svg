"1"/><circle cx="680" cy="169" r="9" fill="#207c92" stroke="#104b58" stroke-width="1"/><circle cx="704" cy="169" r="9" fill="#207c92" stroke="#104b58" stroke-width="1"/><circle cx="728" cy="169" r="9" fill="#207c92" stroke="#104b58" stroke-width="1"/><circle cx="752" cy="169" r="9" fill="#207c92" stroke="#104b58" stroke-width="1"/><circle cx="776" cy="169" r="9" fill="#207c92" stroke="#104b58" stroke-width="1"/><circle cx="680" cy="198" r="9" fill="#207c92" stroke="#104b58" stroke-width="1"/><circle cx="704" cy="198" r="9" fill="#207c92" stroke="#104b58" stroke-width="1"/><circle cx="728" cy="198" r="9" fill="#207c92" stroke="#104b58" stroke-width="1"/><circle cx="752" cy="198" r="9" fill="#207c92" stroke="#104b58" stroke-width="1"/><circle cx="776" cy="198" r="9" fill="#207c92" stroke="#104b58" stroke-width="1"/><text class="sub" x="660" y="280">3행 × 5열 = 15개</text><path d="M90 333 L870 333" stroke="#cad9df" stroke-width="2"/><text class="f" x="64" y="384">n단계: n행 × (n+2)열 = n(n+2)개</text><text class="f" x="64" y="429">n(n+2)=440  →  (n+22)(n−20)=0  →  n=20</text></svg>