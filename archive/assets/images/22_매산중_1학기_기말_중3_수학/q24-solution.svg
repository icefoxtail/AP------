<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480"><rect x="0" y="0" width="960" height="480" rx="18" fill="#ffffff"/><style>text{font-family:"Noto Sans CJK KR","Malgun Gothic",sans-serif;fill:#1d2938}.title{font-size:27px;font-weight:bold}.sub{font-size:19px}.label{font-size:22px;font-weight:bold}.f{font-size:23px;font-weight:bold;fill:#164d63}</style><text class="title" x="28" y="42">24번 수준별 4-② · 카드 6장과 남은 직사각형</text><text class="sub" x="74" y="82">한 카드: 짧은 변 s=5 cm, 긴 변 l=8 cm</text><rect x="80" y="121" width="110" height="176" fill="#d9eef4" stroke="#246378" stroke-width="2"/><text class="sub" x="115" y="215">5×8</text><rect x="190" y="121" width="110" height="176" fill="#d9eef4" stroke="#246378" stroke-width="2"/><text class="sub" x="225" y="215">5×8</text><rect x="300" y="121" width="110" height="176" fill="#d9eef4" stroke="#246378" stroke-width="2"/><text class="sub" x="335" y="215">5×8</text><rect x="410" y="121" width="110" height="176" fill="#d9eef4" stroke="#246378" stroke-width="2"/><text class="sub" x="445" y="215">5×8</text><rect x="80" y="297" width="176" height="110" fill="#e4f1dc" stroke="#4a6d34" stroke-width="2"/><text class="sub" x="142" y="359">8×5</text><rect x="256" y="297" width="176" height="110" fill="#e4f1dc" stroke="#4a6d34" stroke-width="2"/><text class="sub" x="318" y="359">8×5</text><rect x="432" y="297" width="88" height="110" fill="#ffe9dd" stroke="#be6b3a" stroke-width="2"/><text class="sub" x="451" y="342">남음</text><text class="sub" x="457" y="372">4cm</text><text class="label" x="230" y="437">전체 가로 4s=20cm</text><text class="sub" x="535" y="231">전체 세로</text><text class="sub" x="535" y="266">s+l=13cm</text><text class="f" x="650" y="310">4s = 2l+4</text><text class="f" x="650" y="347">4s(s+l)=260</text><text class="f" x="650" y="385">s=5, l=8</text><text class="f" x="650" y="426">둘레 2(20+13)=66cm</text></svg>