<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 704 429" width="704" height="429" role="img" aria-labelledby="title desc"><title id="title">직사각형의 이웃한 두 변에서 움직이는 점</title><desc id="desc">P는 왼쪽 변 AB에, Q는 아래쪽 변 BC에 놓인다. 가로 AD는 30 cm, 세로 CD는 20 cm이며, 주황 삼각형은 PBQ이다.</desc><rect width="704" height="429" fill="white" /><polygon points="90.0000,60.0000 90.0000,360.0000 540.0000,360.0000 540.0000,60.0000" fill="#f4f8fc" /><polygon points="90.0000,360.0000 90.0000,180.0000 270.0000,360.0000" fill="#f8dabb" /><line x1="90.0000" y1="60.0000" x2="90.0000" y2="360.0000" stroke="#205d9c" stroke-width="3.8" stroke-linecap="round" /><line x1="90.0000" y1="360.0000" x2="540.0000" y2="360.0000" stroke="#277339" stroke-width="3.8" stroke-linecap="round" /><line x1="540.0000" y1="360.0000" x2="540.0000" y2="60.0000" stroke="#28364b" stroke-width="3.8" stroke-linecap="round" /><line x1="540.0000" y1="60.0000" x2="90.0000" y2="60.0000" stroke="#28364b" stroke-width="3.8" stroke-linecap="round" /><line x1="90.0000" y1="180.0000" x2="270.0000" y2="360.0000" stroke="#aa5411" stroke-width="3.8" stroke-linecap="round" /><circle cx="90" cy="60" r="5" fill="#28364b" /><text x="71.0000" y="61.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">A</text><circle cx="90" cy="360" r="5" fill="#28364b" /><text x="70.0000" y="378.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">B</text><circle cx="540" cy="360" r="5" fill="#28364b" /><text x="556.0000" y="386.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">C</text><circle cx="540" cy="60" r="5" fill="#28364b" /><text x="557.0000" y="61.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">D</text><circle cx="90" cy="180" r="5" fill="#205d9c" /><text x="69.0000" y="187.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#205d9c" text-anchor="middle">P</text><circle cx="270" cy="360" r="5" fill="#277339" /><text x="269.0000" y="393.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#277339" text-anchor="middle">Q</text><line x1="90.0000" y1="40.0000" x2="540.0000" y2="40.0000" stroke="#28364b" stroke-width="1.6" stroke-linecap="round" /><line x1="90.0000" y1="33.0000" x2="90.0000" y2="47.0000" stroke="#28364b" stroke-width="1.6" stroke-linecap="round" /><line x1="540.0000" y1="33.0000" x2="540.0000" y2="47.0000" stroke="#28364b" stroke-width="1.6" stroke-linecap="round" /><text x="316.0000" y="30.0000" font-size="27" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">30 cm</text><line x1="588.0000" y1="60.0000" x2="588.0000" y2="360.0000" stroke="#28364b" stroke-width="1.6" stroke-linecap="round" /><line x1="579.0000" y1="60.0000" x2="597.0000" y2="60.0000" stroke="#28364b" stroke-width="1.6" stroke-linecap="round" /><line x1="579.0000" y1="360.0000" x2="597.0000" y2="360.0000" stroke="#28364b" stroke-width="1.6" stroke-linecap="round" /><text x="636.0000" y="219.0000" font-size="27" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">20 cm</text></svg>
