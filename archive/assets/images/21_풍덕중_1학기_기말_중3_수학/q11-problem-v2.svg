<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 395" width="680" height="395" role="img" aria-labelledby="title desc"><title id="title">세 반원 사이의 색칠한 부분</title><desc id="desc">지름 AB가 10 cm인 큰 반원 안에서 작은 반원 두 개가 C에서 만난다. 세 반원 사이의 주황 영역이 색칠한 부분이다.</desc><rect width="680" height="395" fill="white" /><path d="M 70 290 A 270.0000 270.0000 0 0 1 610.0000 290 A 78.3000 78.3000 0 0 0 453.4000 290 A 191.7000 191.7000 0 0 0 70.0000 290 Z" fill="#f7ceaa" stroke="none" /><path d="M 70.0000 290 A 270.0000 270.0000 0 0 1 610.0000 290" stroke="#205d9c" stroke-width="4" fill="none" stroke-linecap="round" /><path d="M 70.0000 290 A 191.7000 191.7000 0 0 1 453.4000 290" stroke="#277339" stroke-width="4" fill="none" stroke-linecap="round" /><path d="M 453.4000 290 A 78.3000 78.3000 0 0 1 610.0000 290" stroke="#7952a0" stroke-width="4" fill="none" stroke-linecap="round" /><line x1="70.0000" y1="290.0000" x2="610.0000" y2="290.0000" stroke="#28364b" stroke-width="2.3" stroke-linecap="round" /><circle cx="70.0000" cy="290" r="4.6" fill="#28364b" /><text x="70.0000" y="322.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">A</text><circle cx="453.4000" cy="290" r="4.6" fill="#28364b" /><text x="453.4000" y="322.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">C</text><circle cx="610.0000" cy="290" r="4.6" fill="#28364b" /><text x="610.0000" y="322.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">B</text><line x1="70.0000" y1="345.0000" x2="610.0000" y2="345.0000" stroke="#28364b" stroke-width="1.5" stroke-linecap="round" /><line x1="70.0000" y1="338.0000" x2="70.0000" y2="352.0000" stroke="#28364b" stroke-width="1.5" stroke-linecap="round" /><line x1="610.0000" y1="338.0000" x2="610.0000" y2="352.0000" stroke="#28364b" stroke-width="1.5" stroke-linecap="round" /><text x="340.0000" y="381.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">10 cm</text><circle cx="261.7000" cy="290" r="3" fill="#546274" /><circle cx="340.0000" cy="290" r="3" fill="#546274" /><circle cx="531.7000" cy="290" r="3" fill="#546274" /></svg>
