<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 430" width="660" height="430" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">닮음비가 3:2인 두 원뿔을 나란히 나타낸 그림이다. 큰 원뿔의 밑면의 넓이는 36π cm², 작은 원뿔의 높이는 6 cm로 주어져 있다.</title><desc id="visual-desc">왼쪽에 밑면이 더 큰 원뿔, 오른쪽에 작은 원뿔이 있고, 각 원뿔의 꼭짓점에서 밑면의 중심까지 점선 높이가 그려져 있다. 왼쪽 밑면에는 36π, 오른쪽 높이에는 6 cm가 적혀 있다.</desc><rect width="660" height="430" fill="#fff"/><g data-layer="10"><path id="base1" data-role="region" stroke="none" stroke-width="1.6" fill="#e4e7ec" data-owner-points="L1 O1 R1" data-mark="region" data-mark-id="base1" fill-rule="evenodd" d="M67.417218543 245.298013245 A121.19205298 121.19205298 0 0 0 309.801324503 245.298013245 L67.417218543 245.298013245 Z"/></g><g data-layer="30"><line id="s1L" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="188.609271523" y1="63.509933775" x2="67.417218543" y2="245.298013245"/></g><g data-layer="30"><line id="s1R" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="188.609271523" y1="63.509933775" x2="309.801324503" y2="245.298013245"/></g><g data-layer="30"><line id="h1" data-role="line" stroke="#111" stroke-width="1.6" fill="none" stroke-dasharray="6 4" x1="188.609271523" y1="63.509933775" x2="188.609271523" y2="245.298013245"/></g><g data-layer="30"><line id="b1" data-role="line" stroke="#111" stroke-width="1.6" fill="none"