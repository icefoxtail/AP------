<title id="q15-title">함수와 역함수의 대칭 및 두 교점</title>
<desc id="q15-desc">a=12일 때 y=f(x)=1/2(x−4)^2+4의 x≥4 부분과 역함수 y=f⁻¹(x)=4+√(2(x−4)). 두 그래프는 y=x를 기준으로 대칭이고 (4,4), (6,6)에서 만난다. 가로와 세로의 눈금 간격이 같다.</desc>
