<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" width="480" height="360" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">나무와 민준이가 햇빛을 받아 생긴 그림자를 보여 준다. 나무와 민준이 사이의 거리, 민준이의 키와 그림자 길이가 주어져 있고 나무의 높이는 h로 표시되어 있다.</title><desc id="visual-desc">왼쪽에 수직으로 선 나무, 오른쪽에 서 있는 민준이, 두 그림자의 끝이 한 점에서 만나는 그림이다. 나무 높이는 h, 민준이 키는 1.6미터, 나무에서 민준이까지 거리는 7.2미터, 민준이 그림자는 2.4미터로 표시되어 있다.</desc><rect width="480" height="360" fill="#fff"/><g data-layer="31"><line id="sTU" data-role="line" stroke="#1f5fa8" stroke-width="2.4" fill="none" x1="65.909355844" y1="285.011736173" x2="65.909355844" y2="52.890877299"/></g><g data-layer="31"><line id="sPH" data-role="line" stroke="#1f5fa8" stroke-width="2.4" fill="none" x1="327.045322078" y1="285.011736173" x2="327.045322078" y2="226.981521455"/></g><g data-layer="31"><line id="sTP" data-role="line" stroke="#b85c00" stroke-width="2.4" fill="none" x1="65.909355844" y1="285.011736173" x2="327.045322078" y2="285.011736173"/></g><g data-layer="31"><line id="sPS" data-role="line" stroke="#b85c00" stroke-width="2.4" fill="none" x1="327.045322078" y1="285.011736173" x2="414.090644156" y2="285.011736173"/></g><g data-layer="31"><line id="sUH" data-role="line" stroke="#2e7d32" stroke-width="2.4" fill="none" x1="65.909355844" y1="52.890877299" x2="327.045322078" y2="226.981521455"/></g><g data-layer="31"><line id="sHS"