<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 380" width="420" height="380" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">직사각형 ABCD를 선분 BQ를 접는 선으로 하여 꼭짓점 C가 변 AD 위의 점 P에 오도록 접은 그림이다.</title><desc id="visual-desc">직사각형 ABCD에서 점 C를 점 P로 접어 올린 모습으로 선분 BP, PQ, BQ가 그어져 있다. 선분 AB의 길이는 16, 선분 BP의 길이는 x, 선분 QD의 길이는 6, 선분 PD의 길이는 8로 표시되어 있고 점 P에서 직각 표시가 있다.</desc><rect width="420" height="380" fill="#fff"/><g data-layer="30"><line id="sAB" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="51.273706146" y1="74.990774571" x2="51.273706146" y2="328.952844738"/></g><g data-layer="30"><line id="sBC" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="51.273706146" y1="328.952844738" x2="368.726293854" y2="328.952844738"/></g><g data-layer="30"><line id="sCQ" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="368.726293854" y1="328.952844738" x2="368.726293854" y2="170.226550884"/></g><g data-layer="30"><line id="sQD" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="368.726293854" y1="170.226550884" x2="368.726293854" y2="74.990774571"/></g><g data-layer="30"><line id="sDA" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="368.726293854" y1="74.990774571" x2="51.273706146" y2="74.990774571"/></g><g data-layer="30"><line id="sBP" data-role="line" stroke="#111" str