<svg xmlns="http://www.w3.org/2000/svg" width="440" height="300" viewBox="0 0 440 300" role="img" aria-labelledby="title desc">
  <title id="title">삼각형 내부의 정수 좌표점 30개</title>
  <desc id="desc">y축과 두 직선 y=루트3 x-8, y=-루트3 x+8로 둘러싸인 삼각형 안의 격자점을 x=1,2,3,4별로 표시한 그림</desc>
  <rect width="440" height="300" rx="14" fill="#f8fafc"/>
  <text x="20" y="25" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#0f172a">x별 내부 격자점: 13 + 9 + 5 + 3 = 30</text>
  <g stroke="#cbd5e1" stroke-width="1">
