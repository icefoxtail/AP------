<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc" data-visual-type="geometry" data-axis-scale-mode="EQUAL_UNIT" data-visual-provenance="gpt-scheduled-math-facts">
<title id="title">문항 18 해설 도형 · 직각이등변삼각형</title>
<desc id="desc">b=c=1, a=루트2가 되는 직각이등변삼각형 ABC</desc>
<rect width="640" height="400" fill="white"/>
<g stroke="#111" stroke-width="3" fill="none">
  <path d="M150 315 L150 95 L370 315 Z"/>
  <path d="M150 285 L180 285 L180 315"/>
</g>
<g font-family="Noto Sans KR, Pretendard, Malgun Gothic, sans-serif" fill="#111">
  <text x="132" y="82" font-size="22" font-weight="700">B</text>
  <text x="125" y="345" font-size="22" font-weight="700">A</text>
  <text x="380" y="345" font-size="22" font-weight="700">C</text>
  <text x="85" y="210" font-size="20">c = 1</text>
  <text x="245" y="350" font-size="20">b = 1</text>
  <text x="278" y="190" font-size="20">a = √2</text>
  <text x="405" y="120" font-size="18">a² = b² + c²</text>
  <text x="405" y="155" font-size="18">b = c = 1</text>
  <text x="405" y="200" font-size="18">넓이 = 1/2</text>
