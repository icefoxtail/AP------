<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 420" role="img" aria-labelledby="t d"><title id="t">여덟 점에서 직사각형을 세는 방법</title><desc id="d">마주 보는 점 네 쌍이 만드는 지름 네 개 중 두 개를 고르면 원에 내접하는 직사각형 하나가 정해진다.</desc><rect width="620" height="420" rx="24" fill="#fff"/><text x="26" y="42" font-size="23" font-family="Arial,sans-serif" font-weight="700" fill="#17324d">직사각형의 두 대각선은 지름</text><circle cx="250" cy="220" r="145" fill="#f7fafc" stroke="#52677d" stroke-width="3"/><g stroke="#9aaabd" stroke-width="2" stroke-dasharray="7 6"><line x1="250" y1="75" x2="250" y2="365"/><line x1="352.530483272" y1="117.469516728" x2="147.469516728" y2="322.530483272"/><line x1="395" y1="220" x2="105" y2="220"/><line x1="352.530483272" y1="322.530483272" x2="147.469516728" y2="117.469516728"/></g><polygon points="250,75 395,220 250,365 105,220" fill="#e8f0f7" fill-opacity="0.75" stroke="#2f6690" stroke-width="5"/><g fill="#d97706" stroke="#fff" stroke-width="3"><circle cx="250" cy="75" r="9"/><circle cx="352.530483272" cy="117.469516728" r="9"/><circle cx="395" cy="220" r="9"/><circle cx="352.530483272" cy="322.530483272" r="9"/><circle cx="250" cy="365" r="9"/><circle cx="147.469516728" cy="322.530483272" r="9"/><circle cx="105" cy="220" r="9"/><circle cx="147.469516728" cy="117.469516728" r="9"/></g><g font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#17324d"><text x="424" y="124">A 여덟 점 중 네 점</text><text x="424" y="168">B 마주 보는 네 쌍</text><text x="424" y="212">C 지름 두 개 선택</text><text x="424" y="256">전체: ⁸C₄ = 70</text><text x="424" y="300">직사각형: ⁴C₂ = 6</text><text x="26" y="404" font-size="18">직사각형은 서로 다른 두 지름의 끝점 네 개로 정해진다.</text></g></svg>
