<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 350" role="img" aria-labelledby="t d"><title id="t">다섯 영역의 이웃 관계</title><desc id="d">아래 영역 하나가 위쪽 네 영역과 각각 맞닿고, 위쪽 네 영역은 이웃한 순서로 연결된다.</desc><rect width="720" height="350" rx="24" fill="#fff"/><text x="36" y="45" font-size="26" font-family="Arial,sans-serif" font-weight="700" fill="#17324d">색칠할 때 확인할 이웃 관계</text><text x="36" y="80" font-size="19" font-family="Arial,sans-serif" fill="#52677d">맞닿은 두 영역은 서로 다른 색을 써야 한다</text><g stroke="#52677d" stroke-width="4" stroke-linecap="round"><line x1="130" y1="170" x2="290" y2="170"/><line x1="290" y1="170" x2="450" y2="170"/><line x1="450" y1="170" x2="610" y2="170"/><line x1="130" y1="170" x2="370" y2="275"/><line x1="290" y1="170" x2="370" y2="275"/><line x1="450" y1="170" x2="370" y2="275"/><line x1="610" y1="170" x2="370" y2="275"/></g><g font-family="Arial,sans-serif" font-weight="700" font-size="22" text-anchor="middle"><circle cx="130" cy="170" r="34" fill="#e8f0f7" stroke="#2f6690" stroke-width="3"/><text x="130" y="178" fill="#17324d">위1</text><circle cx="290" cy="170" r="34" fill="#e8f0f7" stroke="#2f6690" stroke-width="3"/><text x="290" y="178" fill="#17324d">위2</text><circle cx="450" cy="170" r="34" fill="#e8f0f7" stroke="#2f6690" stroke-width="3"/><text x="450" y="178" fill="#17324d">위3</text><circle cx="610" cy="170" r="34" fill="#e8f0f7" stroke="#2f6690" stroke-width="3"/><text x="610" y="178" fill="#17324d">위4</text><circle cx="370" cy="275" r="38" fill="#9bd0c2"/><text x="370" y="283" fill="#17324d">아래</text></g><text x="36" y="330" font-size="22" font-family="Arial,sans-serif" font-weight="700" fill="#17324d">5 × 4 × 3 × 3 × 3 = 540</text></svg>
