<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 390" role="img" aria-labelledby="t d"><title id="t">직사각형 탁자의 회전 대칭</title><desc id="d">여섯 자리 배치를 180도 돌리면 서로 마주 보는 세 쌍이 바뀌어 같은 배치가 된다.</desc><rect width="600" height="390" rx="24" fill="#fff"/><text x="30" y="44" font-size="25" font-family="Arial,sans-serif" font-weight="700" fill="#17324d">180° 회전으로 같은 배치를 묶기</text><rect x="150" y="95" width="300" height="200" rx="8" fill="#f7fafc" stroke="#52677d" stroke-width="3"/><g fill="#e8f0f7" stroke="#2f6690" stroke-width="3"><circle cx="225" cy="78" r="25"/><circle cx="375" cy="78" r="25"/><circle cx="475" cy="195" r="25"/><circle cx="375" cy="312" r="25"/><circle cx="225" cy="312" r="25"/><circle cx="125" cy="195" r="25"/></g><g font-family="Arial,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#17324d"><text x="225" y="84">1</text><text x="375" y="84">2</text><text x="475" y="201">3</text><text x="375" y="318">4</text><text x="225" y="318">5</text><text x="125" y="201">6</text></g><circle cx="300" cy="195" r="6" fill="#d97706"/><g stroke="#d97706" stroke-width="3" stroke-dasharray="8 7" fill="none"><line x1="225" y1="110" x2="375" y2="280"/><line x1="375" y1="110" x2="225" y2="280"/><line x1="150" y1="195" x2="450" y2="195"/></g><text x="30" y="360" font-size="23" font-family="Arial,sans-serif" font-weight="700" fill="#17324d">6! ÷ 2 = 360</text><text x="300" y="360" font-size="18" font-family="Arial,sans-serif" fill="#52677d">회전으로 2개씩 중복</text></svg>
