<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 420" width="480" height="420" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">반지름이 4 cm인 원기둥 모양의 캔 세 개를 서로 맞닿게 놓고, 그 둘레를 한 바퀴 감은 테이프의 모양을 나타낸 그림이다.</title><desc id="visual-desc">같은 크기의 원 세 개가 정삼각형 모양으로 서로 맞닿아 있고, 세 원의 바깥을 감싸는 테이프가 원호 세 개와 직선 세 개로 이루어진 윤곽을 이룬다. 한 원의 중심에서 원둘레까지 점선이 그어져 있고 그 옆에 4 cm가 적혀 있다.</desc><rect width="480" height="420" fill="#fff"/><g data-layer="30"><line id="sAB" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="164.508328776" y1="347.861582378" x2="320.620811302" y2="347.861582378"/></g><g data-layer="30"><line id="sBC" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="253.022123444" y1="308.833461747" x2="251.518234975" y2="212.148978318"/></g><g data-layer="30"><line id="sCA" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="305.240224593" y1="88.08335765" x2="96.909640919" y2="230.777220484"/></g><g data-layer="30"><line id="sRad" data-role="line" stroke="#111" stroke-width="1.6" fill="none" stroke-dasharray="6 4" x1="164.508328776" y1="269.805341116" x2="164.508328776" y2="347.861582378"/></g><g data-layer="40"><circle id="cA" data-role="circle" stroke="#111" stroke-width="2.05" fill="none" cx="164.508328776" cy="269.805341116" r="78.056241263"/></g><g data-layer="40"><circle id="cB" data-role="circle" str