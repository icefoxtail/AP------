<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 384 320" width="384" height="320" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">한 변의 길이가 8 cm인 정사각형의 네 모서리에서 반지름이 4 cm인 사분원을 잘라 낸 모양을 나타낸 그림이다. 네 사분원의 호로 둘러싸인 가운데 부분이 색칠되어 있다.</title><desc id="visual-desc">정사각형이 있고, 네 꼭짓점을 중심으로 하는 네 개의 사분원 호가 정사각형 안쪽으로 그려져 있다. 그 네 호로 둘러싸인 가운데 부분이 회색으로 칠해져 있으며, 정사각형의 아래 변 옆에 8 cm가 적혀 있다.</desc><rect width="384" height="320" fill="#fff"/><g data-layer="10"><path id="rgMid" data-role="region" stroke="none" stroke-width="1.6" fill="#c7ccd5" data-owner-points="A B C D E F G H" data-mark="region" data-mark-id="rgMid" fill-rule="evenodd" d="M192 274.285714286 A114.285714286 114.285714286 0 0 1 306.285714286 160 A114.285714286 114.285714286 0 0 1 192 45.714285714 A114.285714286 114.285714286 0 0 1 77.714285714 160 A114.285714286 114.285714286 0 0 1 192 274.285714286 Z"/></g><g data-layer="30"><line id="sAB" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="77.714285714" y1="274.285714286" x2="306.285714286" y2="274.285714286"/></g><g data-layer="30"><line id="sBC" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="306.285714286" y1="274.285714286" x2="306.285714286" y2="45.714285714"/></g><g data-layer="30"><line id="sCD" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="306.285714286" y1="45.714285714" x2="77.7