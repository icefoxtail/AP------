<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 420" width="460" height="420" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">회전축 l과 그로부터 1 cm 떨어진 가로 4 cm, 세로 5 cm인 직사각형이 그려져 있다. 직사각형의 가로와 세로, 축까지의 거리가 각각 표시되어 있다.</title><desc id="visual-desc">세로로 뻗은 직선 l이 있고 그 왼쪽에 직사각형이 놓여 있다. 직사각형의 밑변 옆에 가로 4, 왼쪽 변 옆에 세로 5, 축과 직사각형 사이에 거리 1이 치수선과 함께 적혀 있으며 직선 옆에 l이 표시되어 있다.</desc><rect width="460" height="420" fill="#fff"/><g data-layer="30"><line id="sAB" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="116.479591837" y1="96.479591837" x2="298.112244898" y2="96.479591837"/></g><g data-layer="30"><line id="sBC" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="298.112244898" y1="96.479591837" x2="298.112244898" y2="323.520408163"/></g><g data-layer="30"><line id="sCD" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="298.112244898" y1="323.520408163" x2="116.479591837" y2="323.520408163"/></g><g data-layer="30"><line id="sDA" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="116.479591837" y1="323.520408163" x2="116.479591837" y2="96.479591837"/></g><g data-layer="30"><line id="sEF" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="343.520408163" y1="51.071428571" x2="343.520408163" y2="368.928571429"/></g><g data-layer="52"><line id="dGap-ext-from" data-role="ind