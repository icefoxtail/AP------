<svg xmlns="http://www.w3.org/2000/svg" width="776" height="482" viewBox="0 0 776 482" role="img" aria-labelledby="visual-title visual-desc" data-composite="composite-panels-v1"><title id="visual-title">왼쪽에는 원기둥 모양의 통이, 오른쪽에는 이 통에 꼭 맞게 들어가는 같은 크기의 공 3개가 그려져 있다. 통의 부피는 주어져 있고 공의 크기는 구하는 값이므로 표시하지 않았다.</title><desc id="visual-desc">왼쪽 패널에는 길쭉한 원기둥 모양의 통이 있고, 오른쪽 패널에는 같은 크기의 공 세 개가 위에서 아래로 맞닿아 있다.</desc><g id="p1-caption" data-role="caption" data-panel="1" data-font-px="30.7"><g id="p1-p1-caption-text" transform="translate(157.32434999999998 34.2732)" data-label-kind="CAPTION" data-owner="panel-1" data-fragment-sha="sha256:3da8a13d804cdd6824371f7670d2afd64815356859e6c4d57adc4e56ef10ea4f"><svg xmlns="http://www.w3.org/2000/svg" width="69.35130000000001" height="44.4536" viewBox="0 0 69.35130000000001 44.4536" data-outline-width="69.35130000000001" data-outline-height="44.4536" id="lb-ee78bae3510186c8f0fe1096c2bf7b183741afda27a351aab1bb551d18451a81" data-owner="panel-1" data-fact-role="GIVEN"><path d="M8.13550 41.07660L7.49080 41.47570Q5.43390 38.12940 4.23660 34.39935Q3.03930 30.66930 3.03930 26.21780L3.03930 26.21780Q3.03930 21.76630 4.23660 18.02090Q5.43390 14.27550 7.49080 10.92920L7.49080 10.92920L8.13550 11.35900Q6.10930 14.55180 5.08085 18.35860Q4.05240 22.16540 4.05240 26.21780L4.05240 26.21780Q4.05240 30.27020 5.08085 34.07700Q6.10930 37.88380 8.13550 41.07660L8.13550 41.07660ZM23.08640 35.61200L12.09580 35.61200L12.09580 34.59890L17.22270 34.59890L17.22270 15.41140L13.32380 15.41140L13.32380 14.61320Q14.61320 14.39830 15.62630 14.06060Q16.63940 13.72290 17.34550 13.32380L17.34550 13.32380L18.29720 13.32380L18.29720 34.59890L23.08640 34.59890L23.08640 35.61200ZM26.86250 41.47570L26.86250 41.47570L26.18710 41.07660Q28.21330 37.88380 29.25710 34.07700Q30.30090 30.27020 30.30090 26.21780L30.30090 26.21780Q30.30090 22.16540 29.25710 18.35860Q28.21330 14.55180 26.18710 11.35900L26.18710 11.35900L26.86250 10.92920Q28.95010 14.27550 30.13205 18.02090Q31.31400 21.76630 