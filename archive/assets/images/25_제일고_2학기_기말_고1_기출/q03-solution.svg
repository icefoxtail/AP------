<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" width="640" height="280" role="img" aria-labelledby="title desc" data-scale-policy="SCHEMATIC_ALLOWED">
  <title id="title">원의 접선 공식과 접점</title>
  <desc id="desc">원점 중심, 반지름 5인 원 위의 점 T(3,4)와 그 점에서의 접선 3x+4y=25를 나타낸 그림이다.</desc>
  <rect width="640" height="280" fill="#fff"/>
  <text x="320" y="28" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="23" font-weight="700" fill="#1e3a5f">원 x² + y² = 25,  접점 T(3, 4)</text>
  <rect x="18" y="45" width="320" height="205" rx="8" fill="#f8fafc" stroke="#dbe3ef"/>
  <g stroke="#e2e8f0" stroke-width="1"><line x1="74" y1="65" x2="74" y2="228"/><line x1="110" y1="65" x2="110" y2="228"/><line x1="146" y1="65" x2="146" y2="228"/><line x1="182" y1="65" x2="182" y2="228"/><line x1="218" y1="65" x2="218" y2="228"/><line x1="254" y1="65" x2="254" y2="228"/><line x1="290" y1="65" x2="290" y2="228"/><line x1="326" y1="65" x2="326" y2="228"/><line x1="40" y1="101" x2="328" y2="101"/><line x1="40" y1="137" x2="328" y2="137"/><line x1="40" y1="173" x2="328" y2="173"/><line x1="40" y1="209" x2="328" y2="209"/></g>
  <line x1="38" y1="173" x2="330" y2="173" stroke="#0f172a" stroke-width="1.5"/><line x1="182" y1="232" x2="182" y2="60" stroke="#0f172a" stroke-width="1.5"/>
  <circle cx="182" cy="173" r="90" fill="#dbeafe" fill-opacity=".62" stroke="#2563eb" stroke-width="2.6"/>
  <line x1="182" y1="173" x2="236" y2="101" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 4"/>
  <line x1="73" y1="183" x2="327" y2="13" stroke="#0f766e" stroke-width="2.4"/>
  <circle cx="182" cy="173" r="4" fill="#1d4ed8"/><circle cx="236" cy="101" r="5" fill="#dc2626"/>
  <text x="191" y="168" font-family="Arial, sans-serif" font-size="16" fill="#1d4ed8">O</text><text x="245" y="98" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#b91c1c">T(3,4)</text>
  <text x="248" y="120" font-family="Arial, sans-serif" font-size="15" fill="#b91c1c">OT ⟂ 접선</text>
  <text x="56" y="224" font-family="Arial, sans-serif" font-size="16" fill="#0f766e">3x+4y=25</text>
  <rect x="360" y="45" width="262" height="205" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="380" y="76" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="19" font-weight="700" fill="#1e3a5f">접선 공식</text>
  <text x="380" y="113" font-family="Arial, sans-serif" font-size="20">x₁x + y₁y = r²</text>
  <text x="380" y="150" font-family="Arial, sans-serif" font-size="20">3x + 4y = 25</text>
  <line x1="380" y1="169" x2="600" y2="169" stroke="#cbd5e1"/>
  <text x="380" y="199" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="17" fill="#475569">T를 지나고 OT에 수직</text>
  <text x="380" y="229" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="18" font-weight="700" fill="#b91c1c">정답 ③</text>
</svg>
