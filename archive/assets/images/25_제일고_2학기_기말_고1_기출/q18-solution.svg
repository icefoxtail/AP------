<svg xmlns="http://www.w3.org/2000/svg" width="660" height="480" viewBox="0 0 660 480" role="img" aria-labelledby="title desc" data-axis-scale-mode="EQUAL_UNIT">
<title id="title">합성함수의 그래프와 넓이</title><desc id="desc">구간 0부터 1까지 y=2−x, 1부터 3/2까지 y=2x−1, 3/2부터 2까지 y=−4x+8. 각 넓이 3/2, 3/4, 1/2의 합은 11/4이다.</desc>
<rect width="660" height="480" fill="white"/><rect x="44" y="48" width="361" height="391" rx="10" fill="white" stroke="#cbd5e1"/><rect x="420" y="48" width="223" height="391" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
<g stroke="#e5e7eb" stroke-width="0.9"><line x1="220" y1="70" x2="220" y2="416"/><line x1="293" y1="70" x2="293" y2="416"/><line x1="50" y1="270" x2="399" y2="270"/><line x1="50" y1="124" x2="399" y2="124"/></g>
<polygon points="74,416 220,416 220,270 74,124" fill="#dbeafe"/><polygon points="220,416 293,416 293,124 220,270" fill="#dcfce7"/><polygon points="293,416 366,416 293,124" fill="#ffedd5"/>
<g stroke="#111827" stroke-width="1.6"><line x1="74" y1="60" x2="74" y2="430"/><line x1="50" y1="416" x2="400" y2="416"/></g>
<polyline points="74,124 220,270 293,124 366,416" fill="none" stroke="#111827" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<g fill="#111827"><circle cx="74" cy="124" r="3.8"/><circle cx="220" cy="270" r="3.8"/><circle cx="293" cy="124" r="3.8"/><circle cx="366" cy="416" r="3.8"/></g>
<g font-family="Noto Sans CJK KR, sans-serif" font-size="16" fill="#111827"><text x="55" y="441">O</text><text x="401" y="420">x</text><text x="81" y="60">y</text><text x="214" y="441">1</text><text x="275" y="441">3/2</text><text x="360" y="441">2</text><text x="51" y="275">1</text><text x="51" y="129">2</text><text x="129.48" y="324.02">①</text><text x="255.04" y="324.02">②</text><text x="313.44" y="357.6">③</text></g>
<g font-family="Noto Sans CJK KR, sans-serif" fill="#111827"><text x="437" y="84" font-size="18" font-weight="bold">함숫값이 바뀌는 구간</text><text x="437" y="134" font-size="16">① 0≤x&lt;1</text><text x="449" y="164" font-size="17">y=2−x</text><text x="437" y="212" font-size="16">② 1≤x&lt;3/2</text><text x="449" y="242" font-size="17">y=2x−1</text><text x="437" y="290" font-size="16">③ 3/2≤x≤2</text><text x="449" y="320" font-size="17">y=−4x+8</text><text x="437" y="390" font-size="20" font-weight="bold">넓이=11/4</text></g>
</svg>