<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" width="640" height="280" role="img" aria-labelledby="title desc" data-scale-policy="SCHEMATIC_ALLOWED">
  <title id="title">외부점에서 원에 그은 두 접선</title>
  <desc id="desc">점 P(-1,2)에서 중심 C(3,-2), 반지름 2인 원에 그은 두 접선과 두 접선의 기울기를 나타낸 그림이다.</desc>
  <rect width="640" height="280" fill="#fff"/>
  <text x="320" y="28" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="22" font-weight="700" fill="#1e3a5f">두 접선의 기울기 m₁, m₂</text>
  <rect x="18" y="45" width="335" height="205" rx="8" fill="#f8fafc" stroke="#dbe3ef"/>
  <g stroke="#e2e8f0" stroke-width="1"><line x1="55" y1="65" x2="55" y2="230"/><line x1="100" y1="65" x2="100" y2="230"/><line x1="145" y1="65" x2="145" y2="230"/><line x1="190" y1="65" x2="190" y2="230"/><line x1="235" y1="65" x2="235" y2="230"/><line x1="280" y1="65" x2="280" y2="230"/><line x1="325" y1="65" x2="325" y2="230"/><line x1="35" y1="105" x2="338" y2="105"/><line x1="35" y1="150" x2="338" y2="150"/><line x1="35" y1="195" x2="338" y2="195"/></g>
  <line x1="35" y1="150" x2="340" y2="150" stroke="#0f172a" stroke-width="1.4"/><line x1="190" y1="233" x2="190" y2="60" stroke="#0f172a" stroke-width="1.4"/>
  <circle cx="235" cy="170" r="42" fill="#dbeafe" fill-opacity=".65" stroke="#2563eb" stroke-width="2.5"/>
  <line x1="100" y1="90" x2="241" y2="127" stroke="#0f766e" stroke-width="2.3"/><line x1="100" y1="90" x2="205" y2="185" stroke="#f97316" stroke-width="2.3"/>
  <line x1="235" y1="170" x2="241" y2="127" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="5 4"/><line x1="235" y1="170" x2="205" y2="185" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="5 4"/>
  <circle cx="100" cy="90" r="5" fill="#0f766e"/><circle cx="235" cy="170" r="4" fill="#1d4ed8"/><circle cx="241" cy="127" r="4" fill="#dc2626"/><circle cx="205" cy="185" r="4" fill="#dc2626"/>
  <text x="52" y="86" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#0f766e">P(−1,2)</text><text x="246" y="175" font-family="Arial, sans-serif" font-size="16" fill="#1d4ed8">C(3,−2)</text>
  <text x="247" y="124" font-family="Arial, sans-serif" font-size="16" fill="#0f766e">m₁</text><text x="208" y="204" font-family="Arial, sans-serif" font-size="16" fill="#c2410c">m₂</text>
  <rect x="375" y="45" width="247" height="205" rx="8" fill="#fff7ed" stroke="#fed7aa"/>
  <text x="395" y="76" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="18" font-weight="700" fill="#9a3412">거리 조건</text>
  <text x="395" y="111" font-family="Arial, sans-serif" font-size="17">y−2 = m(x+1)</text>
  <text x="395" y="143" font-family="Arial, sans-serif" font-size="17">mx−y+m+2=0</text>
  <text x="395" y="177" font-family="Arial, sans-serif" font-size="17">3m²+8m+3=0</text>
  <text x="395" y="213" font-family="Arial, sans-serif" font-size="18" fill="#b91c1c">m₁m₂ = 1</text>
  <text x="395" y="238" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="16" fill="#475569">두 근 = 두 접선의 기울기</text>
</svg>
