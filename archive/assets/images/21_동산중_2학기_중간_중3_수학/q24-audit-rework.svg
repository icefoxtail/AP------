<svg xmlns="http://www.w3.org/2000/svg" width="420" height="300" viewBox="0 0 420 300" role="img" aria-labelledby="student-title student-desc"><title id="student-title">직각삼각형 ABC에서 선분 BC 위의 점 D</title><desc id="student-desc">C가 직각인 삼각형에 빗변 AB와 선분 AD를 그리고, CD의 길이와 두 선분에 주어진 길이가 표시되어 있다.</desc><rect width="420" height="300" fill="white"/><g stroke="#222" stroke-width="3" fill="none"><path d="M75 81L271 220L75 220Z"/><path d="M75 204h16v16" stroke-width="2"/><path d="M75 81L155 220" stroke-dasharray="6 4"/></g><g font-family="sans-serif" font-size="18" fill="#111"><text x="57" y="54">A</text><text x="278" y="240">B</text><text x="55" y="244">C</text><text x="148" y="241">D</text><text x="174" y="129">AB=6</text><text x="35" y="148">AC</text><path d="M132 220 L163 211" fill="none" stroke="#555" stroke-width="1.4"/><text x="166" y="210" paint-order="stroke" stroke="white" stroke-width="4">CD=2</text><text x="64" y="280">AD=4; D는 선분 BC 위</text></g></svg>