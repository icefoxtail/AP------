<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" width="560" height="380" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">왼쪽은 A회사의 원기둥 모양 통조림 캔을 옆에서 본 단면이고, 오른쪽은 B회사의 원기둥 모양 통조림 캔을 옆에서 본 단면이다. A회사 캔의 밑면 반지름은 2a, 높이는 b이고, B회사 캔의 밑면 반지름은 b, 높이는 2a이다.</title><desc id="visual-desc">두 개의 직사각형 단면이 나란히 보인다. 왼쪽 사각형에는 반지름 2a와 높이 b, 오른쪽 사각형에는 반지름 b와 높이 2a가 적혀 있다.</desc><rect width="560" height="380" fill="#fff"/><g data-layer="30"><line id="b1" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="62.999999984" y1="305.043870741" x2="257.96855345" y2="305.043870741"/></g><g data-layer="30"><line id="t1" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="62.999999984" y1="61.333178908" x2="257.96855345" y2="61.333178908"/></g><g data-layer="30"><line id="l1" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="62.999999984" y1="305.043870741" x2="62.999999984" y2="61.333178908"/></g><g data-layer="30"><line id="r1" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="257.96855345" y1="305.043870741" x2="257.96855345" y2="61.333178908"/></g><g data-layer="30"><line id="b2" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="404.194968549" y1="305.043870741" x2="501.679245282" y2="305.043870741"/></g><g data-layer="30"><line id="t2" data-role="line" stroke="#111" stroke-w