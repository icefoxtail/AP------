<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" width="720" height="480" role="img" aria-labelledby="title desc">
  <title id="title">직각삼각형 ABC에 내접하는 정사각형</title>
  <desc id="desc">AB와 BC가 수직인 직각삼각형 ABC. 꼭짓점 B를 공유하는 정사각형의 두 변은 각각 AB와 BC 위에 있으며, 반대쪽 꼭짓점은 빗변 AC 위에 있다.</desc>
  <rect width="720" height="480" fill="#ffffff"/>
  <path d="M120 70 L120 390 L600 390 Z" fill="#fbfcfd" stroke="#17283f" stroke-width="3" stroke-linejoin="round"/>
  <rect x="120" y="198" width="192" height="192" fill="#e9f2fb" stroke="#3c6495" stroke-width="2.6"/>
  <path d="M120 374 H136 V390" fill="none" stroke="#17283f" stroke-width="2"/>
  <circle cx="120" cy="70" r="3.2" fill="#17283f"/>
  <circle cx="120" cy="390" r="3.2" fill="#17283f"/>
  <circle cx="600" cy="390" r="3.2" fill="#17283f"/>
  <text x="98" y="64" font-family="sans-serif" font-size="22" font-weight="600" fill="#17283f">A</text>
  <text x="94" y="414" font-family="sans-serif" font-size="22" font-weight="600" fill="#17283f">B</text>
  <text x="608" y="412" font-family="sans-serif" font-size="22" font-weight="600" fill="#17283f">C</text>
  <text x="74" y="245" font-family="serif" font-size="23" font-style="italic" fill="#334155">α</text>
  <text x="380" y="425" font-family="serif" font-size="23" font-style="italic" fill="#334155">β</text>
</svg>
