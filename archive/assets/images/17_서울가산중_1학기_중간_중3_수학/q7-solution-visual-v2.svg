<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 710 536" width="710" height="536" role="img" aria-labelledby="title desc"><title id="title">모눈에서 수직선으로 옮긴 한 변의 길이</title><desc id="desc">수직선의 A는 0에서 오른쪽으로 네 칸, 정사각형의 이웃한 B는 A에서 왼쪽으로 한 칸과 위쪽으로 세 칸이다. A를 중심으로 B를 지나가는 원호가 오른쪽 수직선에서 Q와 만난다. 모눈의 가로 칸과 세로 칸으로 반지름을 구하는 두 직각변을 표시했다.</desc><rect width="710" height="536" fill="white" /><line x1="91.6510" y1="416.1570" x2="91.6510" y2="119.8430" stroke="#b9c8d9" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="5 5" /><line x1="165.7295" y1="416.1570" x2="165.7295" y2="119.8430" stroke="#b9c8d9" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="5 5" /><line x1="239.8080" y1="416.1570" x2="239.8080" y2="119.8430" stroke="#b9c8d9" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="5 5" /><line x1="313.8864" y1="416.1570" x2="313.8864" y2="119.8430" stroke="#b9c8d9" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="5 5" /><line x1="387.9649" y1="416.1570" x2="387.9649" y2="119.8430" stroke="#b9c8d9" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="5 5" /><line x1="91.6510" y1="416.1570" x2="387.9649" y2="416.1570" stroke="#b9c8d9" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="5 5" /><line x1="91.6510" y1="342.0785" x2="387.9649" y2="342.0785" stroke="#b9c8d9" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="5 5" /><line x1="91.6510" y1="268.0000" x2="387.9649" y2="268.0000" stroke="#b9c8d9" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="5 5" /><line x1="91.6510" y1="193.9215" x2="387.9649" y2="193.9215" stroke="#b9c8d9" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="5 5" /><line x1="91.6510" y1="119.8430" x2="387.9649" y2="119.8430" stroke="#b9c8d9" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="5 5" /><polygon points="387.9649,342.0785 313.8864,119.8430 91.6510,193.9215 165.7295,416.1570" fill="none" /><line x1="91.6510" y1="416.1570" x2="91.6510" y2="119.8430" str