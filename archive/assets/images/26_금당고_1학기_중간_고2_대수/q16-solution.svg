<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" width="600" height="420" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">점 P가 제1사분면에 있으므로 cosθ &gt; 0, sinθ &gt; 0이다. sin²θ = 1 − cos²θ를 대입하면 4cos²θ = 3이므로 cosθ = √3/2, sinθ = 1/2이고 tanθ = 1/√3이다. P = (x, √x)에서 tanθ = √x/x = 1/√x이므로 1/√x = 1/√3에서 x = 3, y = √3이다. 따라서 답은 ④이다.</title><desc id="visual-desc">좌표축 위에 원점 O와, x축 위의 점에서 수선을 세운 자리에 점 P가 있고, O에서 P로 가는 동경과 x축이 이루는 각 θ, 수선과 x축 사이의 직각이 표시되어 있다.</desc><rect width="600" height="420" fill="#fff"/><g data-layer="30"><line id="x-axis" data-role="axis" stroke="#111" stroke-width="1.2" fill="none" data-axis="x" x1="63.103349724" y1="290.454320475" x2="536.896650276" y2="290.454320475"/></g><g data-layer="30"><line id="y-axis" data-role="axis" stroke="#111" stroke-width="1.2" fill="none" data-axis="y" x1="160.649029249" y1="388" x2="160.649029249" y2="32"/></g><g data-layer="30"><line id="model-x-unit" data-role="tick" stroke="#111" stroke-width="0.8" fill="none" data-axis="x" data-value="1" x1="253.549676416" y1="290.454320475" x2="253.549676416" y2="294.454320475"/></g><g data-layer="30"><line id="model-y-unit" data-role="tick" stroke="#111" stroke-width="0.8" fill="none" data-axis="y" data-value="1" data-required-label-id="tick-y-1-label" x1="160.649029249" y1="197.553673308" x2="156.649029249" y2="197.553673308"/></g><g data-la