<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" role="img" data-visual-provenance="M2_REVIEW2_20260929|LANE_2" aria-labelledby="svg-title-a3c4121182" aria-describedby="svg-desc-a3c4121182"><title id="svg-title-a3c4121182">정오각형 꼭짓점 이동과 나머지</title><desc id="svg-desc-a3c4121182">정오각형은 5칸마다 처음 꼭짓점으로 돌아온다. A에서 D까지 3칸이므로 두 주사위 합은 5로 나눈 나머지가 3인 3 또는 8이고, 유리한 경우 7/36이다.</desc><style>.m{fill:none;stroke:#111;stroke-width:2.2}.s{fill:none;stroke:#333;stroke-width:2}.t{font:15px system-ui,sans-serif;fill:#111}.n{font:12.5px system-ui,sans-serif;fill:#222}.h{font:13px system-ui,sans-serif;fill:#111;font-weight:600}</style><path class="m" d="M300 50L147.831 160.557L205.954 339.443H394.046L452.169 160.557Z"/><path class="s" d="M300 50L147.831 160.557L205.954 339.443L394.046 339.443"/><text class="t" x="294" y="37">A</text><text class="t" x="127" y="160">B</text><text class="t" x="190" y="360">C</text><text class="t" x="401" y="360">D</text><text class="t" x="461" y="160">E</text><text class="h" x="408" y="78">주기=5</text><text class="n" x="172" y="383">A→B→C→D는 세 단계</text><text class="n" x="118" y="407">합 ≡3 (mod 5): 3 또는 8 → 2+5=7 → 7/36</text></svg>