<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 724 572" width="724" height="572" role="img" aria-labelledby="title desc"><title id="title">한 중선 위에서 위아래로 놓인 두 무게중심</title><desc id="desc">삼각형 ABC의 무게중심은 G, 삼각형 GBC의 무게중심은 G′이다. 두 점은 중선 AD 위에 있다. 위쪽 A에서 G까지의 길이는 4이다. 큰 삼각형과 작은 삼각형의 중선을 구별했다.</desc><rect width="724" height="572" fill="white" /><polygon points="362.0000,119.8000 85.0000,452.2000 639.0000,452.2000" fill="none" /><polygon points="362.0000,341.4000 85.0000,452.2000 639.0000,452.2000" fill="none" /><line x1="362.0000" y1="119.8000" x2="85.0000" y2="452.2000" stroke="#205d9c" stroke-width="4.5" stroke-linecap="round" /><line x1="85.0000" y1="452.2000" x2="639.0000" y2="452.2000" stroke="#205d9c" stroke-width="4.5" stroke-linecap="round" /><line x1="639.0000" y1="452.2000" x2="362.0000" y2="119.8000" stroke="#205d9c" stroke-width="4.5" stroke-linecap="round" /><line x1="362.0000" y1="119.8000" x2="362.0000" y2="452.2000" stroke="#704895" stroke-width="3.8" stroke-linecap="round" /><line x1="85.0000" y1="452.2000" x2="500.5000" y2="286.0000" stroke="#704895" stroke-width="3.8" stroke-linecap="round" /><line x1="639.0000" y1="452.2000" x2="223.5000" y2="286.0000" stroke="#704895" stroke-width="3.8" stroke-linecap="round" /><line x1="85.0000" y1="452.2000" x2="500.5000" y2="396.8000" stroke="#266f73" stroke-width="3.6" stroke-linecap="round" stroke-dasharray="8 5" /><line x1="639.0000" y1="452.2000" x2="223.5000" y2="396.8000" stroke="#266f73" stroke-width="3.6" stroke-linecap="round" stroke-dasharray="8 5" /><text x="400.0000" y="228.7360" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#704895" text-anchor="middle">4</text><circle cx="362.0" cy="119.80000000000001" r="4.9" fill="#28364b" /><text x="362.0000" y="102.8000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">A</text><circle cx="85.0" cy="452.2" r="4.9" fill="#28364b" /><text x="