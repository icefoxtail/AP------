<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 711 247" width="711" height="247" role="img" aria-labelledby="title desc"><title id="title">수직선의 원점에 놓인 점 P</title><desc id="desc">왼쪽 −4에서 오른쪽 4까지 1 단위의 숫자가 같은 간격으로 놓인다. 원점인 0 위에 청록색 점 P가 있다.</desc><rect width="711" height="247" fill="white" /><line x1="44.8000" y1="119.0000" x2="650.2000" y2="119.0000" stroke="#586574" stroke-width="3.6" stroke-linecap="round" /><polygon points="665.2000,119.0000 650.2000,113.0000 650.2000,125.0000" fill="#586574" /><polygon points="44.8000,119.0000 59.8000,113.0000 59.8000,125.0000" fill="#586574" /><line x1="91.0000" y1="111.0000" x2="91.0000" y2="127.0000" stroke="#586574" stroke-width="2.6" stroke-linecap="round" /><text x="91.0000" y="157.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#586574" text-anchor="middle">−4</text><line x1="157.0000" y1="111.0000" x2="157.0000" y2="127.0000" stroke="#586574" stroke-width="2.6" stroke-linecap="round" /><text x="157.0000" y="157.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#586574" text-anchor="middle">−3</text><line x1="223.0000" y1="111.0000" x2="223.0000" y2="127.0000" stroke="#586574" stroke-width="2.6" stroke-linecap="round" /><text x="223.0000" y="157.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#586574" text-anchor="middle">−2</text><line x1="289.0000" y1="111.0000" x2="289.0000" y2="127.0000" stroke="#586574" stroke-width="2.6" stroke-linecap="round" /><text x="289.0000" y="157.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#586574" text-anchor="middle">−1</text><line x1="355.0000" y1="111.0000" x2="355.0000" y2="127.0000" stroke="#586574" stroke-width="2.6" stroke-linecap="round" /><text x="355.0000" y="157.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#586574" text