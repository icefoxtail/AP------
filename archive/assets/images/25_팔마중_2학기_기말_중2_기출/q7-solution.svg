<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" role="img" data-visual-provenance="M2_PRIORITY4_R1_20260928|LANE_D" aria-labelledby="svg-title-9f4a523bb3" aria-describedby="svg-desc-9f4a523bb3"><title id="svg-title-9f4a523bb3">두 정사각형의 변과 대각선 AE</title><desc id="svg-desc-9f4a523bb3">넓이가 121,49인 두 정사각형의 변 길이는 11,7이다. A와 E 사이 가로·세로 길이는 18,11이므로 AE²=18²+11²=445이다.</desc><style>.m{fill:none;stroke:#111;stroke-width:2.2}.t{font:15px system-ui,sans-serif;fill:#111}.n{font:12.5px system-ui,sans-serif;fill:#222}</style><path class="m" d="M75 70H295V290H75Z"/><path class="m" d="M295 150H435V290H295Z"/><path class="m" d="M75 70L435 290"/><text class="t" x="58" y="66">A</text><text class="t" x="57" y="309">B</text><text class="t" x="286" y="311">C</text><text class="t" x="300" y="66">D</text><text class="t" x="442" y="309">E</text><text class="t" x="442" y="149">F</text><text class="t" x="301" y="146">G</text><text class="n" x="160" y="182">변의 길이 11</text><text class="n" x="332" y="222">변의 길이 7</text><text class="n" x="172" y="330">가로=18, 세로=11</text><text class="n" x="175" y="402">AE²=18²+11²=445</text></svg>