<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 390" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-visual-provenance="SOURCE_SOLUTION_DERIVED">
  <title id="title">2번 해설 도형</title>
  <desc id="desc">AB=6, DB=2, EC=3, FE=2, DE가 BC와 평행하고 AG가 각 BAC의 이등분선인 실제 길이비 모형. 닮음과 각의 이등분선 정리로 GC=3을 확인한다.</desc>
  <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
    <path d="M330 40 L330 250 L495 308.333 Z" stroke-width="2.2"/>
    <path d="M330 180 L440 218.889" stroke-width="1.8"/>
    <path d="M330 40 L396 273.333" stroke-width="1.8"/>
  </g>
  <g fill="currentColor" font-family="Arial, sans-serif" font-size="15">
    <text x="321" y="26">A</text><text x="313" y="269">B</text><text x="501" y="326">C</text>
    <text x="312" y="176">D</text><text x="448" y="219">E</text><text x="379" y="202">F</text><text x="401" y="291">G</text>
  </g>
  <g fill="currentColor" font-family="Arial, sans-serif" font-size="14">
    <text x="276" y="111">AD=4</text><text x="282" y="220">DB=2</text>
    <text x="455" y="269">EC=3</text><text x="404" y="194">FE=2</text><text x="428" y="291">GC=x</text>
    <text x="470" y="190">DE ∥ BC</text><text x="360" y="88">∠BAG=∠GAC</text>
  </g>
  <g fill="currentColor" font-family="Arial, sans-serif" font-size="13">
    <text x="85" y="352">△ADE ∼ △ABC → BC=5</text>
    <text x="385" y="352">BG:GC=AB:AC=2:3 → GC=3</text>
  </g>
</svg>
