<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 390" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-visual-provenance="SOURCE_SOLUTION_DERIVED">
  <title id="title">2번 해설 도형</title>
  <desc id="desc">DE가 BC와 평행이고 AG가 각 BAC의 이등분선인 삼각형. AB=6, DB=2, EC=3, FE=2에서 GC=3임을 보이는 모식도</desc>
  <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
    <path d="M300 40 L120 280 L660 310 Z" stroke-width="2.1"/>
    <path d="M180 200 L540 220" stroke-width="1.7"/>
    <path d="M300 40 L336 292" stroke-width="1.7"/>
  </g>
  <g fill="currentColor" font-family="Arial, sans-serif" font-size="14">
    <text x="292" y="27">A</text><text x="101" y="299">B</text><text x="666" y="329">C</text>
    <text x="160" y="195">D</text><text x="547" y="217">E</text><text x="317" y="202">F</text><text x="329" y="313">G</text>
  </g>
  <g fill="currentColor" font-family="Arial, sans-serif" font-size="13">
    <text x="147" y="120">AD=4</text><text x="117" y="220">DB=2</text><text x="560" y="270">EC=3</text>
    <text x="418" y="202">FE=2</text><text x="487" y="317">GC=x</text><text x="275" y="355">DE ∥ BC</text>
  </g>
  <g fill="currentColor" font-family="Arial, sans-serif" font-size="12">
    <text x="38" y="342">△ADE ∼ △ABC → BC=5</text><text x="390" y="342">BG:GC=AB:AC=2:3 → GC=3</text>
  </g>
</svg>
