    <path d="M442.308 41.538 L442.308 180" stroke-width="1.7" stroke-dasharray="7 6"/>
    <path d="M110 180 L442.308 41.538 L110 570 Z" stroke-width="1.6"/>
    <path d="M430 180 L430 168 L442 168" stroke-width="1.4"/>
  </g>
  <g fill="currentColor" font-family="Arial, sans-serif" font-size="16">
    <text x="92" y="176">A</text><text x="507" y="186">B</text><text x="446" y="34">C</text>
    <text x="91" y="589">D</text><text x="448" y="199">H</text>
  </g>
  <g fill="currentColor" font-family="Arial, sans-serif" font-size="14">
    <text x="280" y="202">AB=13</text><text x="475" y="105">BC=5</text><text x="270" y="92">AC=12</text>
    <text x="56" y="382">AD=13</text><text x="330" y="160">AH=144/13</text>
  </g>
  <text x="135" y="548" fill="currentColor" font-family="Arial, sans-serif" font-size="14">[△CAD]=1/2×13×144/13=72</text>
