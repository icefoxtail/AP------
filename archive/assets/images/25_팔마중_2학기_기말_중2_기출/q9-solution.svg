<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 600" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-visual-provenance="SOURCE_SOLUTION_DERIVED">
  <title id="title">9번 해설 도형</title>
  <desc id="desc">직각삼각형 ABC에서 AB=13, BC=5, AC=12. AB를 한 변으로 한 정사각형의 변 AD와 C에서 AB에 내린 수선 CH를 표시하여 삼각형 CAD의 높이를 확인한다.</desc>
  <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
