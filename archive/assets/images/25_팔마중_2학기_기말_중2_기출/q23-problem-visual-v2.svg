<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 728 482" width="728" height="482" role="img" aria-labelledby="title desc"><title id="title">여덟 조각 원판과 세 조각 원판</title><desc id="desc">왼쪽 원판은 같은 크기의 여덟 조각이고 맨 위 오른쪽부터 시계 방향으로 7, 6, 5, 4, 3, 2, 1, 8을 적었다. 오른쪽 원판은 같은 크기의 세 조각으로 나뉘며 왼쪽은 1, 아래 오른쪽은 2, 위 오른쪽은 3이다. 두 원판 위에 바늘이 있다.</desc><rect width="728" height="482" fill="white" /><circle cx="182" cy="251" r="132" fill="none" stroke="#205d9c" stroke-width="4.45" /><line x1="182.0000" y1="251.0000" x2="182.0000" y2="119.0000" stroke="#205d9c" stroke-width="3.0" stroke-linecap="round" /><text x="214.3291" y="183.9507" font-size="33" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">7</text><line x1="182.0000" y1="251.0000" x2="275.3381" y2="157.6619" stroke="#205d9c" stroke-width="3.0" stroke-linecap="round" /><text x="260.0493" y="229.6709" font-size="33" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">6</text><line x1="182.0000" y1="251.0000" x2="314.0000" y2="251.0000" stroke="#205d9c" stroke-width="3.0" stroke-linecap="round" /><text x="260.0493" y="294.3291" font-size="33" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">5</text><line x1="182.0000" y1="251.0000" x2="275.3381" y2="344.3381" stroke="#205d9c" stroke-width="3.0" stroke-linecap="round" /><text x="214.3291" y="340.0493" font-size="33" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">4</text><line x1="182.0000" y1="251.0000" x2="182.0000" y2="383.0000" stroke="#205d9c" stroke-width="3.0" stroke-linecap="round" /><text x="149.6709" y="340.0493" font-size="33" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">3</text><line x1="182.0000" y1="251.0000" x2="88.6619" y2="344.3381" stroke="#205d9c" stroke-width="3.0" stroke-li