<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 384 320" width="384" height="320" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">중심이 같은 세 원으로 이루어진 원형 표적을 나타낸 그림이다. 세 원의 반지름은 각각 1, 2, 3이고, 반지름 1인 원의 바깥쪽과 반지름 2인 원의 안쪽 사이의 고리 모양 영역이 색칠되어 있다.</title><desc id="visual-desc">크기가 다른 세 동심원이 겹쳐 그려져 있고, 가장 작은 원과 가운데 원 사이의 고리 모양 영역이 색칠되어 있다. 오른쪽, 위쪽, 왼쪽으로 뻗은 세 반지름 옆에 각각 1, 2, 3이 적혀 있다.</desc><rect width="384" height="320" fill="#fff"/><g data-layer="10"><path id="annulus" data-role="region" stroke="none" stroke-width="1.6" fill="#c7ccd5" data-owner-points="O P Q" data-mark="region" data-mark-id="annulus" fill-rule="evenodd" d="M192 83.80952381 A76.19047619 76.19047619 0 0 0 192 236.19047619 A76.19047619 76.19047619 0 0 0 192 83.80952381 Z M230.095238095 160 A38.095238095 38.095238095 0 0 0 153.904761905 160 A38.095238095 38.095238095 0 0 0 230.095238095 160 Z"/></g><g data-layer="30"><line id="OP" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="192" y1="160" x2="230.095238095" y2="160"/></g><g data-layer="30"><line id="OQ" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="192" y1="160" x2="192" y2="83.80952381"/></g><g data-layer="30"><line id="OR" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="192" y1="160" x2="77.714285714" y2="160"/></g><g data-layer="40"><circle id="c1" data-role="circle