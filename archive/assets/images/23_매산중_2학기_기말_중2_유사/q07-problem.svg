<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 384 320" width="384" height="320" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">꼭짓점이 아래를 향한 원뿔 모양 그릇의 단면을 나타낸 그림이다. 그릇 전체 높이를 h라 할 때 물의 높이가 h의 절반인 h/2임을 보여 주고, 물이 채워진 아래쪽 부분을 색칠하였다.</title><desc id="visual-desc">위쪽에 밑면이 있고 꼭짓점이 아래에 있는 이등변삼각형 모양의 원뿔 단면이 그려져 있다. 가운데 세로선 위에 전체 높이 h와 물의 높이 h/2가 적혀 있고, 물의 수면을 나타내는 가로선 아래쪽이 색칠되어 있다.</desc><rect width="384" height="320" fill="#fff"/><g data-layer="10"><path id="water" data-role="region" stroke="none" stroke-width="1.6" fill="#e4e7ec" data-owner-points="C D O" data-mark="region" data-mark-id="water" fill-rule="evenodd" d="M192 274.285714286 L153.904761905 160 L230.095238095 160 L192 274.285714286 Z"/></g><g data-layer="30"><line id="OA" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="192" y1="274.285714286" x2="115.80952381" y2="45.714285714"/></g><g data-layer="30"><line id="OB" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="192" y1="274.285714286" x2="268.19047619" y2="45.714285714"/></g><g data-layer="30"><line id="AB" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="115.80952381" y1="45.714285714" x2="268.19047619" y2="45.714285714"/></g><g data-layer="30"><line id="CD" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="153.904761905" y1="160" x2="230.095238095" y2="160