<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 497 448" width="497" height="448" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-ellipse-figure="ellipse-figure-v1" data-conic="PARABOLA" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="6" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round"><title id="visual-title">폭 6미터, 높이 9미터인 포물선 모양 조형물과 지면, 조형물이 지면과 만나는 두 점 A, B, 그리고 B의 오른쪽 2미터 지점 C에서 조형물에 접하도록 쏘아 올린 레이저를 나타낸 그림</title><desc id="visual-desc">포물선 조형물의 두 끝 A와 B가 지면에 닿아 있다. 지면 위 B의 오른쪽 2미터 지점 C에서 출발한 레이저가 조형물에 한 점에서 접하고, 그 접점에서 지면까지 내린 수선의 길이가 h로 표시되어 있다. 조형물의 폭 6미터와 높이 9미터도 함께 적혀 있다.</desc><rect width="497" height="448" fill="#fff"/><g data-layer="25"><path id="curve" data-role="curve" data-curve="PARABOLA" d="M94 368.29 L95.29 360.62 L96.57 353.05 L97.86 345.58 L99.14 338.2 L100.43 330.92 L101.71 323.74 L103 316.65 L104.29 309.66 L105.57 302.76 L106.86 295.96 L108.14 289.26 L109.43 282.66 L110.71 276.15 L112 269.74 L113.29 263.42 L114.57 257.2 L115.86 251.08 L117.14 245.05 L118.43 239.12 L119.71 233.29 L121 227.55 L122.29 221.91 L123.57 216.36 L124.86 210.91 L126.14 205.56 L127.43 200.31 L128.71 195.15 L130 190.09 L131.29 185.12 L132.57 180.25 L133.86 175.48 L135.14 170.8 L136.43 166.22 L137.71 161.74 L139 157.35 L140.29 153.06 L141.57 148.86 L142.86 144.76 L144.14 140.76 L145.43 136.86 L146.71 133.05 L148 129.34 L149.29 125.72 L150.57 122.2 L151.86 118.78 L153.14 115.45 L154.43 112.22 L155.71 109.09 L157 106.05 L158.29 103.11 L159.57 100.26 L160.86 97.51 L162.14 94.86 L163.43 92.31 L164.71 89.85 L166 87.49 L167.29 85.22 L168.57 83.05 L169.86 80.98 L171.14 79 L172.43 77.12 L173.71 75.34 L175 73.65 L176.29 72.06 L177.57 70.56 L178.86 69.16 L180.14 67.86 L181.43 66.66 L182.71 65.55 L184 64.54 L185.29 63.62 L186.57 62.8 L187.86 62.08 L189.14 61.45 L190.43 60.92 L191.71 60.49 L193 60.15 L194.29 59.91 L195.57 59.76 L196.86 59.71 L198.14 59.76 L199.43 59.91 L200.71 6