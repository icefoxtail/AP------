<text x="526" y="98" class="sidehead">해설 핵심</text>
<text x="526" y="124" class="sidebody">D=(d,0)</text>
<text x="526" y="145" class="sidebody">E=((d−1)/2, 2(d+1)/3)</text>
<text x="526" y="166" class="sidebody">[ABC]=12</text>
<text x="526" y="187" class="sidebody">[ADE]=(d+1)²/3</text>
<text x="526" y="208" class="sidebody">넓이비 9:1</text>
<text x="526" y="229" class="sidebody">(d+1)²=4</text>
<text x="526" y="250" class="sidebody">d=1 또는 −3</text>
<text x="526" y="271" class="sidebody">x좌표의 곱 = −3</text>
