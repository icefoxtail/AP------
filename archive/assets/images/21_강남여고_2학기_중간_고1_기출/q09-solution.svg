<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="title desc"><title id="title">집합 해설 보강 · 문항 9</title><desc id="desc">A와 B의 구간 끝점 포함 여부</desc><rect width="720" height="300" rx="18" fill="#f8fafc"/><text x="32" y="38" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#0f172a">집합 해설 보강 · 문항 9</text><text x="32" y="68" font-family="Arial,sans-serif" font-size="14" fill="#475569">A=[1,3), B=(a-3,a+3)</text><rect x="32" y="88" width="656" height="156" rx="12" fill="#fff" stroke="#cbd5e1"/><text x="72" y="125" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#1d4ed8">A=[1,3)</text><line x1="180" y1="125" x2="590" y2="125" stroke="#94a3b8" stroke-width="2"/><line x1="270" y1="125" x2="450" y2="125" stroke="#2563eb" stroke-width="8"/><circle cx="270" cy="125" r="8" fill="#2563eb"/><circle cx="450" cy="125" r="8" fill="#fff" stroke="#2563eb" stroke-width="3"/><text x="262" y="151" font-family="Arial,sans-serif" font-size="13" fill="#334155">1 포함</text><text x="435" y="151" font-family="Arial,sans-serif" font-size="13" fill="#334155">3 불포함</text><text x="72" y="188" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#c2410c">B=(a-3,a+3)</text><line x1="180" y1="188" x2="590" y2="188" stroke="#94a3b8" stroke-width="2"/><line x1="235" y1="188" x2="530" y2="188" stroke="#ea580c" stroke-width="8"/><circle cx="235" cy="188" r="8" fill="#fff" stroke="#ea580c" stroke-width="3"/><circle cx="530" cy="188" r="8" fill="#fff" stroke="#ea580c" stroke-width="3"/><text x="198" y="214" font-family="Arial,sans-serif" font-size="13" fill="#334155">양 끝점 불포함</text><text x="32" y="274" font-family="Arial,sans-serif" font-size="13" fill="#64748b">A⊆B가 되려면 0≤a&lt;4이다.</text></svg>
