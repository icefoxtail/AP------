<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 590" preserveAspectRatio="xMidYMid meet">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#64748b"/>
    </marker>
    <style>
      .title{font-family:"Malgun Gothic",Arial,sans-serif;font-size:30px;font-weight:700;fill:#0f172a}
      .state{font-family:"Malgun Gothic",Arial,sans-serif;font-size:21px;font-weight:700;fill:#0f172a}
      .path{font-family:"Malgun Gothic",Arial,sans-serif;font-size:17px;fill:#334155}
      .branch{font-family:"Malgun Gothic",Arial,sans-serif;font-size:19px;font-weight:700;fill:#1e293b}
      .final{font-family:"Malgun Gothic",Arial,sans-serif;font-size:22px;font-weight:700;fill:#14532d}
      .result{font-family:"Malgun Gothic",Arial,sans-serif;font-size:23px;font-weight:700;fill:#14532d}
      .edge{fill:none;stroke:#64748b;stroke-width:3;marker-end:url(#arrow)}
      .rainNode{fill:#eff6ff;stroke:#2563eb;stroke-width:2.5}
      .dryNode{fill:#f8fafc;stroke:#64748b;stroke-width:2.5}
      .rootNode{fill:#f1f5f9;stroke:#334155;stroke-width:2.5}
      .good{fill:#ecfdf5;stroke:#15803d;stroke-width:2.5}
      .other{fill:#f8fafc;stroke:#94a3b8;stroke-width:2}
      .labelbg{fill:#ffffff;stroke:#e2e8f0;stroke-width:1}
    </style>
  </defs>
  <rect width="1120" height="590" fill="#ffffff"/>
  <text x="48" y="50" class="title">이틀 동안 비가 올 확률</text>

  <path d="M240 240 C285 240 310 165 355 155" class="edge"/>
  <path d="M240 250 C285 260 310 345 355 350" class="edge"/>
  <path d="M595 155 C650 145 680 112 755 105" class="edge"/>
  <path d="M595 160 C650 170 680 205 755 205" class="edge"/>
  <path d="M595 345 C650 330 680 305 755 305" class="edge"/>
  <path d="M595 355 C650 370 680 405 755 405" class="edge"/>

  <rect x="276" y="176" width="58" height="34" rx="8" class="labelbg"/>
  <text x="305" y="200" text-anchor="middle" class="branch">2/3</text>
  <rect x="276" y="284" width="58" height="34" rx="8" class="labelbg"/>
  <text x="305" y="308" text-anchor="middle" class="branch">1/3</text>

  <rect x="655" y="93" width="58" height="34" rx="8" class="labelbg"/>
  <text x="684" y="117" text-anchor="middle" class="branch">2/3</text>
  <rect x="655" y="174" width="58" height="34" rx="8" class="labelbg"/>
  <text x="684" y="198" text-anchor="middle" class="branch">1/3</text>
  <rect x="655" y="282" width="58" height="34" rx="8" class="labelbg"/>
  <text x="684" y="306" text-anchor="middle" class="branch">1/4</text>
  <rect x="655" y="390" width="58" height="34" rx="8" class="labelbg"/>
  <text x="684" y="414" text-anchor="middle" class="branch">3/4</text>

  <rect x="60" y="205" width="180" height="80" rx="16" class="rootNode"/>
  <text x="150" y="252" text-anchor="middle" class="state">금요일 비</text>

  <rect x="355" y="115" width="240" height="80" rx="16" class="rainNode"/>
  <text x="475" y="161" text-anchor="middle" class="state">토요일 비</text>
  <rect x="355" y="310" width="240" height="80" rx="16" class="dryNode"/>
  <text x="475" y="356" text-anchor="middle" class="state">토요일 비 안 옴</text>

  <rect x="755" y="70" width="300" height="70" rx="14" class="good"/>
  <text x="905" y="100" text-anchor="middle" class="final">일요일 비</text>
  <text x="905" y="125" text-anchor="middle" class="path">경로 확률 4/9</text>

  <rect x="755" y="170" width="300" height="70" rx="14" class="other"/>
  <text x="905" y="200" text-anchor="middle" class="state">일요일 비 안 옴</text>
  <text x="905" y="225" text-anchor="middle" class="path">경로 확률 2/9</text>

  <rect x="755" y="270" width="300" height="70" rx="14" class="good"/>
  <text x="905" y="300" text-anchor="middle" class="final">일요일 비</text>
  <text x="905" y="325" text-anchor="middle" class="path">경로 확률 1/12</text>

  <rect x="755" y="370" width="300" height="70" rx="14" class="other"/>
  <text x="905" y="400" text-anchor="middle" class="state">일요일 비 안 옴</text>
  <text x="905" y="425" text-anchor="middle" class="path">경로 확률 1/4</text>

  <rect x="260" y="485" width="600" height="72" rx="18" fill="#f0fdf4" stroke="#15803d" stroke-width="2.5"/>
  <text x="560" y="531" text-anchor="middle" class="result">일요일 비: 4/9 + 1/12 = 19/36</text>
</svg>