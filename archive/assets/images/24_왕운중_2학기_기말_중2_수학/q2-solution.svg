<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 384 320" width="384" height="320" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">가장 긴 변을 빗변으로 보고 두 짧은 변의 제곱의 합이 가장 긴 변의 제곱과 같은지 확인한다. 6²+8²=36+64=100=10²이므로 6, 8, 10인 ③만 직각삼각형이다. 따라서 답은 ③이다.</title><desc id="visual-desc">직각이 표시된 직각삼각형의 세 변에 길이가 적혀 있고, 빗변과 두 직각변이 구분되어 있다.</desc><rect width="384" height="320" fill="#fff"/><g data-layer="30"><line id="AB" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="106.285714286" y1="274.285714286" x2="277.714285714" y2="274.285714286"/></g><g data-layer="30"><line id="BC" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="277.714285714" y1="274.285714286" x2="106.285714286" y2="45.714285714"/></g><g data-layer="30"><line id="CA" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="106.285714286" y1="45.714285714" x2="106.285714286" y2="274.285714286"/></g><g data-layer="60"><polyline id="right" data-role="indicator" stroke="#111" stroke-width="0.8" fill="none" points="116.285714286,274.285714286 116.285714286,264.285714286 106.285714286,264.285714286"/></g><g data-layer="85"><line id="lenBC-owner-leader" data-role="leader" data-owner-label="lenBC" data-owner="BC" x1="192" y1="160" x2="214.321428571" y2="140" stroke="#666" stroke-width="0.8" fill="none"/></g><g data-layer="90"><g id="lenAB" data-label-kin