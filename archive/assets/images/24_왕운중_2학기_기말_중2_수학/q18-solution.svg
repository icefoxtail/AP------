<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">삼등분점이 만든 평행사변형과 두 중선</title>
  <desc id="desc">AFGC는 평행사변형이고 Q와 H는 각각 AC와 GC의 중점이다. P는 삼각형 AGC의 두 중선 교점이다. 넓이비 APQ 대 ABCD는 1 대 18이다.</desc>
  <rect width="1280" height="720" fill="#ffffff"/>
  <text x="44" y="52" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="30" font-weight="700" fill="#172554">삼등분점으로 넓이비 찾기</text>
  <text x="44" y="84" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="18" fill="#475569">평행사변형 AFGC와 삼각형 AGC의 두 중선을 이용한다.</text>

  <!-- AFGC is the shaded parallelogram; AGC is the pale triangle used in the area proof. -->
  <polygon points="160,120 506.67,120 620,480 273.33,480" fill="#c7d2fe" fill-opacity="0.45" stroke="none"/>
  <polygon points="160,120 273.33,480 620,480" fill="#fef3c7" fill-opacity="0.55" stroke="none"/>

  <!-- Original parallelogram ABCD. -->
  <path d="M160 120 L680 120 L620 480 L100 480 Z" fill="none" stroke="#1e293b" stroke-width="4" stroke-linejoin="round"/>
  <!-- Original trisection/diagonal geometry. -->
  <path d="M506.67 120 L273.33 480" fill="none" stroke="#6d28d9" stroke-width="4"/>
  <path d="M160 120 L620 480" fill="none" stroke="#0f766e" stroke-width="4"/>
  <path d="M160 120 L446.67 480" fill="none" stroke="#ea580c" stroke-width="4"/>
  <path d="M273.33 480 L620 480" fill="none" stroke="#2563eb" stroke-width="5"/>

  <!-- Equal trisection ticks on AD and BC. -->
  <g stroke="#334155" stroke-width="3">
    <path d="M326.67 112 L326.67 128 M333.33 112 L333.33 128"/>
    <path d="M500 112 L500 128 M506.67 112 L506.67 128"/>
    <path d="M266.67 472 L266.67 488 M273.33 472 L273.33 488"/>
    <path d="M440 472 L440 488 M446.67 472 L446.67 488"/>
  </g>

  <!-- Vertices and intersections: Q is midpoint of AC, H midpoint of GC, P centroid of AGC. -->
  <g fill="#0f172a" stroke="#ffffff" stroke-width="2">
    <circle cx="160" cy="120" r="6"/><circle cx="680" cy="120" r="6"/>
    <circle cx="100" cy="480" r="6"/><circle cx="620" cy="480" r="6"/>
    <circle cx="333.33" cy="120" r="5"/><circle cx="506.67" cy="120" r="5"/>
    <circle cx="273.33" cy="480" r="5"/><circle cx="446.67" cy="480" r="5"/>
    <circle cx="351.11" cy="360" r="8" fill="#dc2626"/>
    <circle cx="390" cy="300" r="8" fill="#7c3aed"/>
  </g>
  <g font-family="Arial, 'Noto Sans KR', sans-serif" font-size="23" font-weight="600" fill="#0f172a">
    <text x="137" y="112">A</text><text x="691" y="112">D</text>
    <text x="78" y="507">B</text><text x="628" y="507">C</text>
    <text x="319" y="111">E</text><text x="512" y="111">F</text>
    <text x="254" y="511">G</text><text x="450" y="511">H</text>
    <text x="316" y="377" fill="#b91c1c">P</text><text x="400" y="295" fill="#6d28d9">Q</text>
  </g>

  <rect x="760" y="112" width="474" height="548" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="790" y="154" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="23" font-weight="700" fill="#172554">관계 정리</text>
  <g font-family="Arial, 'Noto Sans KR', sans-serif" font-size="20" fill="#1e293b">
    <text x="790" y="202">AF = GC, AF ∥ GC</text>
    <text x="790" y="232">따라서 AFGC는 평행사변형이다.</text>
    <text x="790" y="278">Q는 AC의 중점, H는 GC의 중점.</text>
    <text x="790" y="308">삼각형 AGC에서 AH와 GQ는 중선,</text>
    <text x="790" y="338">교점 P는 무게중심이다.</text>
    <text x="790" y="384">AP/AH = 2/3,   AQ/AC = 1/2</text>
    <text x="790" y="430">[APQ]/[AHC] = (2/3)(1/2) = 1/3</text>
    <text x="790" y="476">HC/BC = 1/3 이므로 [AHC] = S/6</text>
  </g>
  <rect x="790" y="520" width="414" height="104" rx="12" fill="#ecfdf5" stroke="#86efac" stroke-width="2"/>
  <text x="814" y="560" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="22" font-weight="700" fill="#166534">[APQ]/[ABCD] = 1/18</text>
  <text x="814" y="596" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="20" fill="#166534">[APQ] = 2 이므로 [ABCD] = 36</text>
</svg>