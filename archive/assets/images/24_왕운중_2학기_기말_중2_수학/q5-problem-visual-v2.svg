<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 696 563" width="696" height="563" role="img" aria-labelledby="title desc"><title id="title">삼각형의 두 중선과 교점 G</title><desc id="desc">삼각형 ABC에서 AB 위의 D와 AC 위의 E를 연결했다. B에서 E, C에서 D로 이은 두 선이 G에서 만난다. BG는 6이고 GE는 x이다.</desc><rect width="696" height="563" fill="white" /><polygon points="357.6175,77.5000 135.5000,485.5000 560.5000,485.5000" fill="none" /><line x1="357.6175" y1="77.5000" x2="135.5000" y2="485.5000" stroke="#23649a" stroke-width="4.75" stroke-linecap="round" /><line x1="135.5000" y1="485.5000" x2="560.5000" y2="485.5000" stroke="#23649a" stroke-width="4.75" stroke-linecap="round" /><line x1="560.5000" y1="485.5000" x2="357.6175" y2="77.5000" stroke="#23649a" stroke-width="4.75" stroke-linecap="round" /><line x1="246.5587" y1="281.5000" x2="459.0587" y2="281.5000" stroke="#637687" stroke-width="3.6" stroke-linecap="round" /><line x1="560.5000" y1="485.5000" x2="246.5587" y2="281.5000" stroke="#784797" stroke-width="4.4" stroke-linecap="round" /><line x1="135.5000" y1="485.5000" x2="351.2058" y2="349.5000" stroke="#217363" stroke-width="4.6" stroke-linecap="round" /><line x1="351.2058" y1="349.5000" x2="459.0587" y2="281.5000" stroke="#217363" stroke-width="4.6" stroke-linecap="round" /><line x1="232.5676" y1="424.3000" x2="224.5676" y2="395.3000" stroke="#217363" stroke-width="1.75" stroke-linecap="round" /><text x="221.5676" y="386.3000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#217363" text-anchor="middle">6</text><line x1="416.9961" y1="308.0200" x2="408.9961" y2="279.0200" stroke="#217363" stroke-width="1.75" stroke-linecap="round" /><text x="405.9961" y="270.0200" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#217363" text-anchor="middle">x</text><circle cx="357.61745456292556" cy="77.5" r="4.9" fill="#28364b" /><text x="357.6175" y="60.5000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">A</text><circle cx="135.5" cy="485.5" r="4.9" fill="#28364b" /><text x="120.5000" y="509.5000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">B</text><circle cx="560.5" cy="485.5" r="4.9" fill="#28364b" /><text x="576.5000" y="510.5000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">C</text><circle cx="246.55872728146278" cy="281.5" r="4.9" fill="#28364b" /><text x="227.5587" y="273.5000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">D</text><circle cx="459.0587272814628" cy="281.5" r="4.9" fill="#28364b" /><text x="481.0587" y="277.5000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">E</text><circle cx="351.20581818764185" cy="349.5" r="4.9" fill="#28364b" /><text x="351.2058" y="379.5000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">G</text></svg>
