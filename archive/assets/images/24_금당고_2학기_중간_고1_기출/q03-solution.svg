<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img" aria-labelledby="title" data-scale-policy="SCHEMATIC_ALLOWED" width="720" height="360" aria-describedby="desc">
  <title id="title">문항 3 해설: 집합 A는 집합 B의 부분집합</title>
  <desc id="desc">전체집합 U 안에 집합 B가 있고, 그 안에 집합 A가 완전히 들어 있는 포함관계를 나타낸 벤다이어그램이다.</desc>
  <style>
    text{font-family:"Noto Sans KR","Malgun Gothic",Arial,sans-serif;fill:#172033}.muted{fill:#56657a}.math{font-family:Georgia,"Times New Roman",serif}
  </style>
  <rect width="760" height="360" rx="18" fill="#f8fafc"/>
  <text x="30" y="38" font-size="22" font-weight="700">도형에서 포함관계 읽기</text>
  <text x="30" y="67" class="muted" font-size="15">A의 모든 원소가 B 안에 있으므로 A⊂B</text>
  <rect x="35" y="98" width="410" height="205" rx="12" fill="#fff" stroke="#cbd5e1"/>
  <rect x="55" y="118" width="370" height="165" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <text x="68" y="141" font-size="15" font-weight="700" class="muted">U</text>
  <ellipse cx="245" cy="205" rx="150" ry="68" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.5"/>
  <text x="245" y="159" text-anchor="middle" font-size="17" font-weight="700" fill="#15803d">B</text>
  <ellipse cx="245" cy="203" rx="70" ry="38" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
  <text x="245" y="211" text-anchor="middle" font-size="21" font-weight="700" fill="#1d4ed8">A</text>
  <rect x="485" y="108" width="240" height="190" rx="14" fill="#fff" stroke="#cbd5e1"/>
  <text x="510" y="143" font-size="16" font-weight="700">선택지 확인</text>
  <text x="510" y="180" font-size="20" font-weight="700" fill="#2563eb">✓ ① A⊂B</text>
  <text x="510" y="212" class="muted" font-size="14">항상 참: A∩B=A, A∩Bᶜ=∅</text>
  <text x="510" y="239" class="muted" font-size="14">항상 아님: ②③④⑤</text>
  <text x="35" y="333" class="muted" font-size="14">A를 나타내는 곡선 전체가 B 안에 들어가 있는지 확인한다.</text>
</svg>
