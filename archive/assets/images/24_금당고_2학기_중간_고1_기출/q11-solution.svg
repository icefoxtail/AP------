<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" role="img" aria-labelledby="title desc" width="760" height="300"><title id="title">문항 11 해설: B의 포함관계</title><desc id="desc">B가 A 안에 들어가 B-A가 공집합인 관계를 나타낸 Venn diagram</desc><style>text{font-family:"Noto Sans KR",Arial,sans-serif;fill:#172033}.m{fill:#56657a}</style><rect width="760" height="300" rx="18" fill="#f8fafc"/><text x="28" y="38" font-size="22" font-weight="700">B가 A 안에 완전히 들어가는 관계</text><text x="28" y="66" class="m" font-size="15">A∪B=A라는 것은 A 밖의 B 영역이 없다는 뜻이다.</text><rect x="28" y="80" width="430" height="150" rx="14" fill="#fff" stroke="#cbd5e1"/><ellipse cx="243" cy="154" rx="135" ry="62" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><ellipse cx="243" cy="154" rx="78" ry="42" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text x="350" y="112" font-size="20" fill="#1d4ed8">A</text><text x="243" y="160" text-anchor="middle" font-size="20" fill="#15803d">B</text><text x="58" y="208" font-size="16" fill="#b91c1c">B−A=∅</text><rect x="490" y="92" width="238" height="120" rx="14" fill="#fff" stroke="#cbd5e1"/><text x="514" y="128" font-size="17">A∪(Aᶜ∩B)=A</text><text x="514" y="164" font-size="17">A∪B=A</text><text x="514" y="200" font-size="17" fill="#15803d">B⊆A</text><text x="28" y="270" class="m" font-size="14">합집합이 그대로라는 식을 B−A가 비어 있다는 영역으로 읽는다.</text></svg>
