<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img">
<title>사각형 넓이 최소 · 24 금당고 16번</title>
<desc>최솟값이 성립하는 x=y=12의 실제 넓이 비율 예시로 네 삼각형 16,12,9,12를 표시</desc>
<style>
.bg{fill:#ffffff}.panel{fill:#ffffff;stroke:#cbd5e1;stroke-width:1.2}.side{fill:#f8fafc;stroke:#dbe3ef;stroke-width:1.2}
.title{font:700 19px Arial,'Malgun Gothic','Noto Sans KR',sans-serif;fill:#0f172a}.subtitle{font:12px Arial,'Malgun Gothic','Noto Sans KR',sans-serif;fill:#475569}
.shape{stroke:#2563eb;stroke-width:2.4;fill:none}.guide{stroke:#64748b;stroke-width:1.5;stroke-dasharray:5 4;fill:none}
.point{fill:#111827;stroke:#fff;stroke-width:1.5}.point2{fill:#b91c1c;stroke:#fff;stroke-width:1.5}
.label{font:600 12px Arial,'Malgun Gothic','Noto Sans KR',sans-serif;fill:#111827}.small{font:11px Arial,'Malgun Gothic','Noto Sans KR',sans-serif;fill:#334155}
.sidehead{font:700 14px Arial,'Malgun Gothic','Noto Sans KR',sans-serif;fill:#0f172a}.sidebody{font:11.5px Arial,'Malgun Gothic','Noto Sans KR',sans-serif;fill:#334155}
.area1{fill:#2563eb;fill-opacity:.11;stroke:#2563eb;stroke-width:1.8}
.area2{fill:#d97706;fill-opacity:.11;stroke:#d97706;stroke-width:1.8}
</style>
<rect class="bg" width="720" height="420"/>
<text x="24" y="31" class="title">사각형 넓이 최소 · 24 금당고 16번</text>
<text x="24" y="52" class="subtitle">xy=144에서 x=y=12일 때 실제로 넓이 16, 12, 9, 12가 되는 최솟값 달성 예시</text>
<rect x="24" y="70" width="470" height="320" rx="10" class="panel"/>
<rect x="510" y="70" width="186" height="320" rx="10" class="side"/>

<!-- Exact equality case: O=(0,0), OA=4, OC=3, OB=8, OD=6.
     Areas: OAB=16, OBC=12, OCD=9, ODA=12. -->
<polygon points="90,220 250,92 370,220 250,316" class="shape"/>
<line x1="90" y1="220" x2="370" y2="220" class="guide"/>
<line x1="250" y1="92" x2="250" y2="316" class="guide"/>
<polygon points="250,220 90,220 250,92" class="area1"/>
<polygon points="250,220 250,92 370,220" class="area2"/>
<polygon points="250,220 370,220 250,316" class="area1"/>
<polygon points="250,220 250,316 90,220" class="area2"/>

<circle cx="90" cy="220" r="4.4" class="point"/><text x="98" y="212" class="label">A</text>
<circle cx="250" cy="92" r="4.4" class="point"/><text x="258" y="84" class="label">B</text>
<circle cx="370" cy="220" r="4.4" class="point"/><text x="378" y="212" class="label">C</text>
<circle cx="250" cy="316" r="4.4" class="point"/><text x="258" y="308" class="label">D</text>
<circle cx="250" cy="220" r="4.4" class="point2"/><text x="258" y="212" class="label">O</text>

<text x="165" y="150" class="label">16</text>
<text x="311" y="150" class="label">x=12</text>
<text x="311" y="275" class="label">9</text>
<text x="160" y="275" class="label">y=12</text>
<text x="66" y="365" class="small">최솟값 달성 예: [OAB]=16, [OBC]=12, [OCD]=9, [ODA]=12 → 전체 49</text>

<text x="526" y="98" class="sidehead">해설 핵심</text>
<text x="526" y="124" class="sidebody">[OBC]=x, [ODA]=y</text>
<text x="526" y="146" class="sidebody">x/16 = 9/y</text>
<text x="526" y="168" class="sidebody">따라서 xy=144</text>
<text x="526" y="190" class="sidebody">전체 넓이=25+x+y</text>
<text x="526" y="212" class="sidebody">x+y ≥ 24</text>
<text x="526" y="234" class="sidebody">등호: x=y=12</text>
<text x="526" y="256" class="sidebody">최솟값 = 49</text>
</svg>