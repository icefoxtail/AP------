<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420"><rect width="900" height="420" fill="white"/><text x="28" y="43" font-family="NanumGothic" font-size="24" font-weight="bold">06. 두 선분을 수직선 위에 옮겨 표시하기</text><g transform="translate(0 47)"><line x1="72" y1="256" x2="817" y2="256" stroke="#333" stroke-width="3"/><path d="M340 256 L275 61" stroke="#2369a8" stroke-width="3" fill="none"/><path d="M405 256 L600 126" stroke="#b36b20" stroke-width="3" fill="none"/><path d="M275 61 Q115 103 134 256" stroke="#2369a8" stroke-width="3" stroke-dasharray="9 7" fill="none"/><path d="M600 126 Q672 165 640 256" stroke="#b36b20" stroke-width="3" stroke-dasharray="9 7" fill="none"/><g font-family="NanumGothic" font-size="20" fill="#222"><text x="270" y="53">B</text><text x="601" y="118">D</text><text x="329" y="238">A</text><text x="400" y="238">C</text><text x="99" y="291">P=-√10</text><text x="316" y="291">A=0</text><text x="394" y="291">C=1</text><text x="631" y="291">Q=1+√13</text><text x="210" y="165" fill="#2369a8">AB=√10</text><text x="488" y="188" fill="#b36b20">CD=√13</text><text x="28" y="345">P는 A의 왼쪽이므로 음수이다. ‘P=+√10’이라고 한 ④가 옳지 않다.</text></g></g></svg>