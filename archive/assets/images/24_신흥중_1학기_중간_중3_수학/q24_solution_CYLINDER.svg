<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="700" viewBox="0 0 1100 700">
  <rect width="1100" height="700" fill="#ffffff"/>
  <text x="34" y="45" font-family="NanumGothic, sans-serif" font-size="25" font-weight="bold" fill="#222">24. 원기둥 전개도와 부피</text>
  <text x="34" y="76" font-family="NanumGothic, sans-serif" font-size="17" fill="#444">원둘레, 높이, 원의 지름을 같은 축척으로 나타낸 모식도</text>
  <!-- Scale: 32 px per cm. Width=2πr=4√2π cm; rectangle height=3√3 cm; circle radius=2√2 cm. -->
  <circle cx="384.35" cy="221.49" r="90.51" fill="#f9e1c2" stroke="#b56a24" stroke-width="3"/>
  <circle cx="384.35" cy="576.79" r="90.51" fill="#f9e1c2" stroke="#b56a24" stroke-width="3"/>
  <rect x="100" y="316" width="568.69" height="166.28" fill="#e0efff" stroke="#2369a8" stroke-width="3"/>
  <line x1="100" y1="100" x2="668.69" y2="100" stroke="#333" stroke-width="2"/>
  <path d="M100 93v14 M668.69 93v14" stroke="#333" stroke-width="2"/>
  <line x1="384.35" y1="221.49" x2="474.86" y2="221.49" stroke="#8a531f" stroke-width="3"/>
  <circle cx="384.35" cy="221.49" r="3" fill="#8a531f"/>
  <line x1="684" y1="316" x2="684" y2="482.28" stroke="#333" stroke-width="2"/>
  <path d="M677 316h14 M677 482.28h14" stroke="#333" stroke-width="2"/>
  <text x="214" y="124" font-family="NanumGothic, sans-serif" font-size="20" fill="#222">옆면 가로 = 4√2π cm</text>
  <text x="350" y="205" font-family="NanumGothic, sans-serif" font-size="17" fill="#7a4518">r = 2√2 cm</text>
  <text x="278" y="406" font-family="NanumGothic, sans-serif" font-size="19" fill="#2369a8">높이 3√3 cm</text>
  <text x="705" y="330" font-family="NanumGothic, sans-serif" font-size="18" fill="#222">높이 = 3√3 cm</text>
  <text x="754" y="394" font-family="NanumGothic, sans-serif" font-size="21" font-weight="bold" fill="#222">계산</text>
  <text x="754" y="431" font-family="NanumGothic, sans-serif" font-size="18" fill="#222">2πr = 4√2π</text>
  <text x="754" y="465" font-family="NanumGothic, sans-serif" font-size="18" fill="#222">r = 2√2 cm</text>
  <text x="754" y="499" font-family="NanumGothic, sans-serif" font-size="18" fill="#222">밑넓이 = πr² = 8π cm²</text>
  <text x="754" y="545" font-family="NanumGothic, sans-serif" font-size="19" font-weight="bold" fill="#163f67">V = 8π × 3√3</text>
  <text x="754" y="579" font-family="NanumGothic, sans-serif" font-size="19" font-weight="bold" fill="#163f67">= 24√3π cm³</text>
  <text x="34" y="686" font-family="NanumGothic, sans-serif" font-size="14" fill="#555">도형은 같은 축척의 비례 모식도이며, 답은 24√3π cm³입니다.</text>
</svg>
