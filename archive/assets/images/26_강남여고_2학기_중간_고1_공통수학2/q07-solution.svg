<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="700" height="470" viewBox="0 0 700 470" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="q07-title q07-desc">
<title id="q07-title">원의 평행이동과 점의 평행이동</title>
<desc id="q07-desc">중심이 (4,1)인 반지름 3의 원이 (0,0)으로 옮겨질 때 점 (5,3)도 (1,2)로 옮겨진다. 두 이동은 모두 x 방향 −4, y 방향 −1이다.</desc>
<style>.axis{stroke:#888;stroke-width:1.4}.original{stroke:#666;stroke-width:3;fill:none}.derived{stroke:#111;stroke-width:3.5;fill:none}.guide{stroke:#888;stroke-width:1.6;stroke-dasharray:6 5;fill:none}.prior{stroke:#666;stroke-width:3;stroke-dasharray:8 6;fill:none}.point{fill:#111}.point-open{fill:white;stroke:#111;stroke-width:3}.label{font-family:Arial,'Noto Sans KR',sans-serif;font-size:27px;fill:#111}.note{font-family:Arial,'Noto Sans KR',sans-serif;font-size:25px;fill:#222}</style>
<line class="axis" x1="45" y1="270" x2="662" y2="270"/><line class="axis" x1="280" y1="419" x2="280" y2="32"/>
<text class="label" x="668" y="264">x</text><text class="label" x="289" y="34">y</text>
<circle class="prior" cx="436" cy="231" r="117" data-center-x="4" data-center-y="1" data-math-radius="3" data-role="before"/><circle class="derived" cx="280" cy="270" r="117" data-center-x="0" data-center-y="0" data-math-radius="3" data-role="after"/>
<line class="guide" x1="436" y1="231" x2="280" y2="270"/><line class="guide" x1="475" y1="153" x2="319" y2="192"/>
<circle class="point" cx="436" cy="231" r="5" data-math-x="4" data-math-y="1" /><circle class="point-open" cx="280" cy="270" r="5" data-math-x="0" data-math-y="0" /><circle class="point" cx="475" cy="153" r="5" data-math-x="5" data-math-y="3" /><circle class="point-open" cx="319" cy="192" r="5" data-math-x="1" data-math-y="2" />
<text class="label" x="459" y="262">C(4, 1)</text>
<text class="label" x="151" y="314">C'(0, 0)</text>
<text class="label" x="492" y="147">P(5, 3)</text>
<text class="label" x="191" y="185">P'(1, 2)</text>
<text class="note" x="151" y="448">x방향 -4, y방향 -1만큼 이동</text>
</svg>
