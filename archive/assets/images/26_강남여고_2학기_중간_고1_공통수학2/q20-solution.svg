<title>대칭이동과 두 삼각형의 외접반지름</title>
<desc>점 A(a,2), B(2,a), C(2,-a)는 원점에서 같은 거리에 있다. 원점 O는 삼각형 ABC의 외심이고 OA와 OC가 수직이므로 삼각형 AOC의 외접원 지름은 AC이다. 주어진 곱에서 a²=34를 얻는다.</desc>
