<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="560" viewBox="0 0 640 560" role="img">
<title>같은 넓이의 두 삼각형과 평행선</title>
<desc>삼각형 ABC와 ACD가 밑변 AC를 공유하고 같은 넓이이므로 점 B와 D를 이은 직선 BD는 AC와 평행하다. D는 (3/2,0)이고 AD의 기울기는 8/9이다.</desc>
