<svg xmlns="http://www.w3.org/2000/svg" width="820" height="790" viewBox="0 0 820 790" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="q23title q23desc">
<title id="q23title">y축에 접하고 같은 점을 지나는 두 원</title>
<desc id="q23desc">중심 A(2,3), 반지름 2인 원과 중심 B(10,11), 반지름 10인 원이 모두 y축에 접하고 점 P(4,3)을 지난다. 중심 사이의 거리는 8√2이다.</desc>
<style>.axis{fill:none;stroke:#888;stroke-width:1.5}.small{fill:#f1f8fb;stroke:#1c6486;stroke-width:3}.large{fill:#f9fcfe;stroke:#2f4958;stroke-width:3}.helper{fill:none;stroke:#888;stroke-width:1.8;stroke-dasharray:6 5}.center{fill:#111}.point{fill:#1b6894;stroke:#fff;stroke-width:2}.label{font:24px Arial,'Noto Sans KR',sans-serif;fill:#111}.value{font:26px Arial,'Noto Sans KR',sans-serif;fill:#223e53}</style>
