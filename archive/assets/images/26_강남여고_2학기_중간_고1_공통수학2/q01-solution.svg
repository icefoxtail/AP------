<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="360" height="280" viewBox="0 0 360 280" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="svg-title-01 svg-desc-01">
<title id="svg-title-01">선분 AB의 내분점</title>
<desc id="svg-desc-01">A(-2, 1)에서 B(4, -2)까지의 선분 위에 P(2, -1)가 있으며 AP:PB=2:1이다.</desc>
<style>
.axis{stroke:#777;stroke-width:1.2;fill:none}.helper{stroke:#999;stroke-width:1.3;fill:none;stroke-dasharray:5 4}.main{stroke:#111;stroke-width:2.9;fill:none;stroke-linecap:round}.secondary{stroke:#555;stroke-width:2;fill:none}.radius{stroke:#111;stroke-width:2.1;fill:none}.given{fill:#222}.derived{fill:#fff;stroke:#111;stroke-width:2.6}.label{font-family:Arial,sans-serif;font-size:18px;fill:#111}.note{font-family:Arial,sans-serif;font-size:18px;fill:#111}
</style>
<line class="axis" x1="30" y1="140" x2="329" y2="140"/><line class="axis" x1="140" y1="246" x2="140" y2="28"/>
<text class="label" x="330" y="134">x</text><text class="label" x="149" y="33">y</text><text class="label" x="145" y="156">O</text>
<line class="main" x1="70" y1="105" x2="280" y2="210"/>
<circle class="given" data-math-x="-2" data-math-y="1" cx="70" cy="105" r="3.7"/><circle class="given" data-math-x="4" data-math-y="-2" cx="280" cy="210" r="3.7"/><circle class="derived" data-math-x="2" data-math-y="-1" cx="210" cy="175" r="4.4"/>
<text class="label" x="28" y="95">A(-2, 1)</text><text class="label" x="240" y="234">B(4, -2)</text><text class="label" x="218" y="170">P(2, -1)</text><text class="note" x="48" y="264">AP : PB = 2 : 1</text>
</svg>
