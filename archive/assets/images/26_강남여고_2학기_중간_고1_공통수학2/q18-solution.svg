<svg xmlns="http://www.w3.org/2000/svg" width="740" height="650" viewBox="0 0 740 650" role="img">
<title>평행사변형과 세 삼각형의 무게중심</title>
<desc>평행사변형의 두 대각선은 서로를 이등분한다. 삼각형 ABC의 무게중심은 G1(4,4), ACD의 무게중심은 G2(5,3)이고 OAC의 무게중심은 G(3,7/3)이다. 좌표평면은 조건을 만족하는 한 가지 배치를 보여 준다.</desc>
