<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="340" height="330" viewBox="0 0 340 330" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="svg-title-02 svg-desc-02">
<title id="svg-title-02">원의 중심과 반지름</title>
<desc id="svg-desc-02">원의 중심 C는 (-3, 4), 반지름은 3이고 원은 y축과 (0, 4)에서 만난다.</desc>
<style>
.axis{stroke:#777;stroke-width:1.2;fill:none}.helper{stroke:#999;stroke-width:1.3;fill:none;stroke-dasharray:5 4}.main{stroke:#111;stroke-width:2.9;fill:none;stroke-linecap:round}.secondary{stroke:#555;stroke-width:2;fill:none}.radius{stroke:#111;stroke-width:2.1;fill:none}.given{fill:#222}.derived{fill:#fff;stroke:#111;stroke-width:2.6}.label{font-family:Arial,sans-serif;font-size:18px;fill:#111}.note{font-family:Arial,sans-serif;font-size:18px;fill:#111}
</style>
<line class="axis" x1="30" y1="272" x2="316" y2="272"/><line class="axis" x1="258" y1="308" x2="258" y2="26"/>
<text class="label" x="318" y="267">x</text><text class="label" x="264" y="27">y</text><text class="label" x="264" y="293">O</text>
<circle class="main" data-center-x="-3" data-center-y="4" data-radius="3" cx="162" cy="144" r="96"/>
<line class="radius" x1="162" y1="144" x2="258" y2="144"/><circle class="given" cx="162" cy="144" r="4"/><circle class="given" cx="258" cy="144" r="3"/>
<text class="label" x="93" y="162">C(-3, 4)</text><text class="note" x="193" y="133">r = 3</text>
</svg>
