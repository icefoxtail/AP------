<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="744" height="310" viewBox="0 0 744 310" role="img" aria-labelledby="title12 desc12">
<title id="title12">삼각형의 넓이를 이등분하는 직선</title>
<desc id="desc12">삼각형의 꼭짓점은 (0,0), (1,1), (9,1)이다. x=a=3인 직선의 오른쪽 삼각형은 밑변 9-a, 높이 1-a/9이며 넓이는 2이다.</desc>
<style>.axis{stroke:#888;stroke-width:1.4;fill:none}.edge{stroke:#161616;stroke-width:2.8;fill:none;stroke-linecap:round}.cut{stroke:#1b4f72;stroke-width:3.5;fill:none}.region{fill:#e5f1f8;stroke:none}.dot{fill:#111}.label{fill:#111;font:24px Arial,'Noto Sans KR',sans-serif}.note{fill:#152b3c;font:24px Arial,'Noto Sans KR',sans-serif}</style>
<polygon class="region" points="270,112 630,112 270,205.333333" />
<line class="axis" x1="31" y1="252" x2="707" y2="252"/>
<line class="axis" x1="90" y1="290" x2="90" y2="32"/>
<line class="edge" x1="90" y1="252" x2="150" y2="112"/>
<line class="edge" x1="150" y1="112" x2="630" y2="112"/>
<line class="edge" x1="630" y1="112" x2="90" y2="252"/>
<line class="cut" x1="270" y1="112" x2="270" y2="205.333333" data-cut-x="3"/>
<circle class="dot" cx="90" cy="252" r="4" data-math-x="0" data-math-y="0"/>
<circle class="dot" cx="150" cy="112" r="4" data-math-x="1" data-math-y="1"/>
<circle class="dot" cx="630" cy="112" r="4" data-math-x="9" data-math-y="1"/>
<circle class="dot" cx="270" cy="112" r="4" data-math-x="3" data-math-y="1"/>
<circle class="dot" cx="270" cy="205.333333" r="4" data-math-x="3" data-math-y="0.333333"/>
<text class="label" x="95" y="281">(0,0)</text>
<text class="label" x="113" y="95">(1,1)</text>
<text class="label" x="631" y="97">(9,1)</text>
<text class="label" x="266" y="94">E</text>
<text class="label" x="279" y="218">F</text>
<text class="label" x="281" y="249">x = a = 3</text>
<text class="note" x="424" y="295">오른쪽 삼각형의 넓이 = 2</text>
</svg>
