<title id="q09-title">평행한 세 직선의 거리</title>
<desc id="q09-desc">3x−4y+2=0을 중심으로 거리가 3인 직선은 양쪽에 각각 하나씩 있으며 k는 17 또는 −13이다.</desc>
<style>.axis{stroke:#888;stroke-width:1.4}.original{stroke:#666;stroke-width:3;fill:none}.derived{stroke:#111;stroke-width:3.5;fill:none}.guide{stroke:#888;stroke-width:1.6;stroke-dasharray:6 5;fill:none}.prior{stroke:#666;stroke-width:3;stroke-dasharray:8 6;fill:none}.point{fill:#111}.point-open{fill:white;stroke:#111;stroke-width:3}.label{font-family:Arial,'Noto Sans KR',sans-serif;font-size:27px;fill:#111}.note{font-family:Arial,'Noto Sans KR',sans-serif;font-size:25px;fill:#222}</style>
<line class="derived" x1="151.76" y1="171.68" x2="325.84" y2="41.12" data-line-k="17"/>
<line class="original" x1="212.96" y1="253.28" x2="387.04" y2="122.72" data-line-k="2"/>
<line class="derived" x1="274.16" y1="334.88" x2="448.24" y2="204.32" data-line-k="-13"/>
<line class="guide" x1="238.8" y1="106.4" x2="361.2" y2="269.6"/>
<text class="label" x="338" y="49">k = 17</text>
<text class="label" x="425" y="125">k = 2</text>
<text class="label" x="463" y="245">k = -13</text>
<text class="note" x="245" y="158">3</text>
<text class="note" x="332" y="246">3</text>
<text class="note" x="79" y="383">기준 직선의 양쪽에서 각각 한 개</text>
</svg>
