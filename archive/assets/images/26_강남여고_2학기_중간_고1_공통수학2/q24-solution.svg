<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="504" height="614" viewBox="0 0 504 614" role="img">
<title>포물선과 직선이 만드는 삼각형의 최대 넓이</title>
<desc>포물선 위 C(2,2), A(1,0), B(3,2)와 직선 AB를 표시한다. 점 C에서 AB까지의 수직 높이 CH는 세로 거리 1을 √2로 나눈 값이며 최대 넓이는 1이다.</desc>
