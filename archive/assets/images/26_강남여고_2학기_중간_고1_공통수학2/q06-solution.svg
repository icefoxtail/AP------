<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="q06-title q06-desc">
<title id="q06-title">원점 대칭에 의한 직선의 이동</title>
<desc id="q06-desc">3x−4y+5=0이 원점 대칭으로 3x−4y−5=0이 되고 두 직선은 원점을 기준으로 마주 놓인 평행선이다.</desc>
<style>.axis{stroke:#888;stroke-width:1.4}.original{stroke:#666;stroke-width:3;fill:none}.derived{stroke:#111;stroke-width:3.5;fill:none}.guide{stroke:#888;stroke-width:1.6;stroke-dasharray:6 5;fill:none}.prior{stroke:#666;stroke-width:3;stroke-dasharray:8 6;fill:none}.point{fill:#111}.point-open{fill:white;stroke:#111;stroke-width:3}.label{font-family:Arial,'Noto Sans KR',sans-serif;font-size:27px;fill:#111}.note{font-family:Arial,'Noto Sans KR',sans-serif;font-size:25px;fill:#222}</style>
<line class="axis" x1="40" y1="212" x2="601" y2="212"/><line class="axis" x1="320" y1="402" x2="320" y2="22"/>
<text class="label" x="603" y="209">x</text><text class="label" x="330" y="30">y</text><text class="label" x="330" y="240">O</text>
<line class="original" x1="194" y1="254" x2="446" y2="65" data-k="5"/>
<line class="derived" x1="194" y1="359" x2="446" y2="170" data-k="-5"/>
<circle class="point" cx="320" cy="159.5" r="5" data-math-x="0" data-math-y="1.25"/><circle class="point-open" cx="320" cy="264.5" r="5" data-math-x="0" data-math-y="-1.25"/>
<text class="note" x="457" y="64">원래 직선</text>
<text class="note" x="45" y="374">옮긴 직선</text>
</svg>
