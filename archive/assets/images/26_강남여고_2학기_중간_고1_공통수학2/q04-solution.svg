<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="360" height="286" viewBox="0 0 360 286" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="svg-title-04 svg-desc-04">
<title id="svg-title-04">같은 길이의 두 선분</title>
<desc id="svg-desc-04">좌표 A(-1, 2), B(2, 3), C(1, 1)에서 선분 AC와 BC는 길이가 √5로 같고 C는 선분 AB의 수직이등분선 위에 있다.</desc>
<style>
.axis{stroke:#777;stroke-width:1.2;fill:none}.helper{stroke:#999;stroke-width:1.3;fill:none;stroke-dasharray:5 4}.main{stroke:#111;stroke-width:2.9;fill:none;stroke-linecap:round}.secondary{stroke:#555;stroke-width:2;fill:none}.radius{stroke:#111;stroke-width:2.1;fill:none}.given{fill:#222}.derived{fill:#fff;stroke:#111;stroke-width:2.6}.label{font-family:Arial,sans-serif;font-size:18px;fill:#111}.note{font-family:Arial,sans-serif;font-size:18px;fill:#111}
</style>
<line class="axis" x1="28" y1="246" x2="330" y2="246"/><line class="axis" x1="128" y1="261" x2="128" y2="30"/>
<text class="label" x="332" y="242">x</text><text class="label" x="133" y="31">y</text><text class="label" x="135" y="264">O</text>
<line class="helper" x1="133" y1="61" x2="188" y2="226"/>
<line class="secondary" x1="78" y1="146" x2="228" y2="96"/><line class="main" x1="78" y1="146" x2="178" y2="196"/><line class="main" x1="228" y1="96" x2="178" y2="196"/>
<circle class="given" cx="78" cy="146" r="3.8" data-math-x="-1" data-math-y="2"/><circle class="given" cx="228" cy="96" r="3.8" data-math-x="2" data-math-y="3"/><circle class="derived" cx="178" cy="196" r="4.2" data-math-x="1" data-math-y="1"/>
<circle cx="153" cy="121" r="2.7" fill="#555" data-math-x="0.5" data-math-y="2.5"/>
<text class="label" x="17" y="136">A(-1, 2)</text><text class="label" x="231" y="84">B(2, 3)</text><text class="label" x="186" y="210">C(1, 1)</text><text class="note" x="212" y="271">AC = BC</text>
</svg>
