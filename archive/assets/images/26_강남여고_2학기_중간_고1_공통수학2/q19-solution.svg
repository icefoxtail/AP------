<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="454" viewBox="0 0 900 454" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="s19-title s19-desc">
<title id="s19-title">원의 중심에서 직선까지의 거리와 교점 개수</title>
<desc id="s19-desc">중심 (5,5), 반지름 √5인 원과 원점을 지나는 직선을 나타낸 세 사례. k=2이면 접하고 k=4이면 두 점에서 만나며 k=10이면 만나지 않는다. 표에는 k=2,4,6,8,10의 교점 개수 1,2,2,1,0이 표시된다.</desc>
<style>.axis{fill:none;stroke:#bbb;stroke-width:1.4}.circle{fill:#f7fbfd;stroke:#2c4455;stroke-width:2.6}.secant{fill:none;stroke:#1671ac;stroke-width:3;stroke-linecap:round}.center{fill:#111}.touch{fill:#1473af;stroke:#fff;stroke-width:1}.heading{fill:#111;font:24px Arial,'Noto Sans KR',sans-serif}.label{fill:#333;font:22px Arial,'Noto Sans KR',sans-serif}.cell{stroke:#d5d9de;stroke-width:1;fill:#fff}.cellHead{stroke:#d5d9de;stroke-width:1;fill:#f0f3f6}.cellText{font:23px Arial,'Noto Sans KR',sans-serif;fill:#111;text-anchor:middle;dominant-baseline:middle}</style>
<text class="heading" x="18" y="37">접함 (k=2)</text>
<line class="axis" x1="40" y1="260" x2="267" y2="260"/><line class="axis" x1="52" y1="275" x2="52" y2="53"/>
<circle class="circle" cx="152" cy="160" r="44.72136" data-center="5,5" data-radius2="5"/>
<line class="secant" x1="52" y1="260" x2="152" y2="60" data-k="2"/>
<circle class="center" cx="152" cy="160" r="3.2"/><text class="label" x="159" y="153">C</text>
<text class="label" x="36" y="286">O</text>
<circle class="touch" cx="112" cy="140" r="4.5" data-intersection="true"/>
<text class="heading" x="318" y="37">두 점에서 만남 (k=4)</text>
<line class="axis" x1="340" y1="260" x2="567" y2="260"/><line class="axis" x1="352" y1="275" x2="352" y2="53"/>
<circle class="circle" cx="452" cy="160" r="44.72136" data-center="5,5" data-radius2="5"/>
<line class="secant" x1="352" y1="260" x2="552" y2="60" data-k="4"/>
<circle class="center" cx="452" cy="160" r="3.2"/><text class="label" x="459" y="153">C</text>
<text class="label" x="336" y="286">O</text>
<circle class="touch" cx="420.37722" cy="191.62278" r="4.5" data-intersection="true"/>
<circle class="touch" cx="483.62278" cy="128.37722" r="4.5" data-intersection="true"/>
<text class="heading" x="618" y="37">만나지 않음 (k=10)</text>
<line class="axis" x1="640" y1="260" x2="867" y2="260"/><line class="axis" x1="652" y1="275" x2="652" y2="53"/>
<circle class="circle" cx="752" cy="160" r="44.72136" data-center="5,5" data-radius2="5"/>
<line class="secant" x1="652" y1="260" x2="852" y2="180" data-k="10"/>
<circle class="center" cx="752" cy="160" r="3.2"/><text class="label" x="759" y="153">C</text>
<text class="label" x="636" y="286">O</text>
<text class="label" x="19" y="314">나머지 k값도 같은 거리 조건으로 판정한다.</text>
<rect class="cellHead" x="12" y="337" width="146" height="54"/><text class="cellText" x="85" y="364">k</text>
<rect class="cellHead" x="158" y="337" width="146" height="54"/><text class="cellText" x="231" y="364">2</text>
<rect class="cellHead" x="304" y="337" width="146" height="54"/><text class="cellText" x="377" y="364">4</text>
<rect class="cellHead" x="450" y="337" width="146" height="54"/><text class="cellText" x="523" y="364">6</text>
<rect class="cellHead" x="596" y="337" width="146" height="54"/><text class="cellText" x="669" y="364">8</text>
<rect class="cellHead" x="742" y="337" width="146" height="54"/><text class="cellText" x="815" y="364">10</text>
<rect class="cellHead" x="12" y="391" width="146" height="54"/><text class="cellText" x="85" y="418">f(k)</text>
<rect class="cell" x="158" y="391" width="146" height="54"/><text class="cellText" x="231" y="418">1</text>
<rect class="cell" x="304" y="391" width="146" height="54"/><text class="cellText" x="377" y="418">2</text>
<rect class="cell" x="450" y="391" width="146" height="54"/><text class="cellText" x="523" y="418">2</text>
<rect class="cell" x="596" y="391" width="146" height="54"/><text class="cellText" x="669" y="418">1</text>
<rect class="cell" x="742" y="391" width="146" height="54"/><text class="cellText" x="815" y="418">0</text>
</svg>
