<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 384 320" width="384" height="320" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">서로 평행한 네 직선 l, m, n, o를 두 직선이 가로지르며, 왼쪽 직선에서 위부터 잘린 세 선분의 길이가 x, 4, 8이고 오른쪽 직선에서 대응하는 세 선분의 길이가 9, y, 6으로 표시되어 있다.</title><desc id="visual-desc">네 개의 평행한 직선 l, m, n, o를 두 개의 기울어진 직선이 차례로 지난다. 왼쪽 직선의 세 선분 옆에 위에서부터 x, 4, 8이, 오른쪽 직선의 대응하는 세 선분 옆에 위에서부터 9, y, 6이 적혀 있다.</desc><rect width="384" height="320" fill="#fff"/><g data-layer="30"><line id="s1" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="251.018624535" y1="101.723485677" x2="150.080740839" y2="160"/></g><g data-layer="30"><line id="s2" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="150.080740839" y1="160" x2="116.434779607" y2="179.425504774"/></g><g data-layer="30"><line id="s3" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="116.434779607" y1="179.425504774" x2="49.142857143" y2="218.276514323"/></g><g data-layer="30"><line id="s4" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="334.857142857" y1="101.723485677" x2="269.702019098" y2="160"/></g><g data-layer="30"><line id="s5" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="269.702019098" y1="160" x2="247.983644511" y2="179.425504774"/></g><g data-layer="30"><line id="s6" data-role="line" stroke="#111" strok