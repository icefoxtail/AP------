<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 601" width="650" height="601" role="img" aria-labelledby="title desc"><title id="title">두 직선과 세로축 사이의 삼각형</title><desc id="desc">x−y+4=0과 2x+y+2=0이 (−2, 2)에서 만난다. 두 직선이 세로축과 만나는 점은 (0, 4)와 (0, −2)이다. 그 사이의 삼각형을 청록으로 칠하고 길이 2의 수평 보조선을 그었다.</desc><rect width="650" height="601" fill="white" /><polygon points="346.1675,150.6310 346.1675,468.4881 240.1990,256.5833" fill="#daeee7" /><line x1="68.0000" y1="362.5357" x2="561.0000" y2="362.5357" stroke="#586574" stroke-width="2.05" stroke-linecap="round" /><polygon points="574.0000,362.5357 561.0000,357.3357 561.0000,367.7357" fill="#586574" /><line x1="346.1675" y1="531.0000" x2="346.1675" y2="99.0000" stroke="#586574" stroke-width="2.05" stroke-linecap="round" /><polygon points="346.1675,86.0000 340.9675,99.0000 351.3675,99.0000" fill="#586574" /><line x1="72.1137" y1="424.6429" x2="406.6947" y2="90.1131" stroke="#21629a" stroke-width="6.9" stroke-linecap="round" /><line x1="157.5646" y1="91.3400" x2="374.7579" y2="525.6600" stroke="#a34d1a" stroke-width="6.75" stroke-linecap="round" stroke-dasharray="11 7" /><line x1="346.1675" y1="468.4881" x2="346.1675" y2="150.6310" stroke="#226f66" stroke-width="6.25" stroke-linecap="round" /><line x1="240.1990" y1="256.5833" x2="346.1675" y2="256.5833" stroke="#49796d" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="7 5" /><circle cx="346.1675392670157" cy="150.6309523809524" r="7" fill="#21629a" stroke="white" stroke-width="2" /><circle cx="346.1675392670157" cy="468.48809523809524" r="7" fill="#a34d1a" stroke="white" stroke-width="2" /><circle cx="240.19895287958113" cy="256.58333333333337" r="7" fill="#226f66" stroke="white" stroke-width="2" /><line x1="49.0000" y1="39.0000" x2="94.0000" y2="39.0000" stroke="#21629a" stroke-width="5.65" stroke-linecap="round" /><text x="105.0000" y="46.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#21629a" text-anchor="start">x − y + 4 = 0</text><line x1="324.0000" y1="39.0000" x2="369.0000" y2="39.0000" stroke="#a34d1a" stroke-width="5.65" stroke-linecap="round" stroke-dasharray="11 7" /><text x="380.0000" y="46.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#a34d1a" text-anchor="start">2x + y + 2 = 0</text><text x="590.000" y="349.536" fill="#586574" font-size="29" font-weight="600" font-family="Malgun Gothic, Cambria Math, sans-serif" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="4.0" stroke-linejoin="round">x</text><text x="365.168" y="81.000" fill="#586574" font-size="29" font-weight="600" font-family="Malgun Gothic, Cambria Math, sans-serif" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="4.0" stroke-linejoin="round">y</text><text x="366.168" y="390.536" fill="#586574" font-size="29" font-weight="600" font-family="Malgun Gothic, Cambria Math, sans-serif" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="4.0" stroke-linejoin="round">O</text><text x="415.168" y="159.631" fill="#21629a" font-size="29" font-weight="600" font-family="Malgun Gothic, Cambria Math, sans-serif" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="4.0" stroke-linejoin="round">(0, 4)</text><text x="419.168" y="477.488" fill="#a34d1a" font-size="29" font-weight="600" font-family="Malgun Gothic, Cambria Math, sans-serif" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="4.0" stroke-linejoin="round">(0, −2)</text><text x="171.199" y="260.583" fill="#226f66" font-size="29" font-weight="600" font-family="Malgun Gothic, Cambria Math, sans-serif" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="4.0" stroke-linejoin="round">(−2, 2)</text><text x="293.183" y="243.583" fill="#226f66" font-size="29" font-weight="600" font-family="Malgun Gothic, Cambria Math, sans-serif" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="4.