<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 728 501" width="728" height="501" role="img" aria-labelledby="title desc"><title id="title">삼각형의 외심을 중심으로 비교하는 세 각</title><desc id="desc">O는 삼각형 ABC의 외심이고 세 꼭짓점까지 선이 이어진다. B의 OBC는 30도, C의 ACO는 50도이다. A의 BAO가 x도이다.</desc><rect width="728" height="501" fill="white" /><polygon points="539.6688,77.5000 127.3221,423.5000 600.6779,423.5000" fill="none" /><line x1="539.6688" y1="77.5000" x2="127.3221" y2="423.5000" stroke="#21629a" stroke-width="4.7" stroke-linecap="round" /><line x1="127.3221" y1="423.5000" x2="600.6779" y2="423.5000" stroke="#21629a" stroke-width="4.7" stroke-linecap="round" /><line x1="600.6779" y1="423.5000" x2="539.6688" y2="77.5000" stroke="#21629a" stroke-width="4.7" stroke-linecap="round" /><line x1="539.6688" y1="77.5000" x2="364.0000" y2="286.8539" stroke="#266f73" stroke-width="4.45" stroke-linecap="round" /><line x1="127.3221" y1="423.5000" x2="364.0000" y2="286.8539" stroke="#266f73" stroke-width="4.45" stroke-linecap="round" /><line x1="600.6779" y1="423.5000" x2="364.0000" y2="286.8539" stroke="#266f73" stroke-width="4.45" stroke-linecap="round" /><path d="M 198.3221 423.5000 A 71 71 0 0 0 188.8099 388.0000" stroke="#21629a" stroke-width="2.25" fill="none" /><text x="239.3695" y="401.4770" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#21629a" text-anchor="middle">30°</text><path d="M 556.5106 398.0000 A 51 51 0 0 1 591.8219 373.2748" stroke="#21629a" stroke-width="2.25" fill="none" /><text x="551.3504" y="361.0529" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#21629a" text-anchor="middle">50°</text><path d="M 494.6737 131.1231 A 70 70 0 0 1 486.0457 122.4951" stroke="#704895" stroke-width="2.25" fill="none" /><line x1="491.3165" y1="124.3571" x2="455.3165" y2="87.3571" stroke="#704895" stroke-width="1.8" stroke-linecap="round" /><text x="440.3165" y="78.3571" font-size="31" font-family="Malgun G