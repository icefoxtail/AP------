<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 698 619" width="698" height="619" role="img" aria-labelledby="title desc"><title id="title">위로 평행이동하면 겹치는 두 직선</title><desc id="desc">파란 첫째 직선의 기울기는 4/3이고 세로축 절편은 2이다. 주황 점선의 기울기도 4/3이고 절편은 −1/3이다. 화살표는 두 세로축 절편 사이의 이동을 나타낸다.</desc><rect width="698" height="619" fill="white" /><line x1="74.0000" y1="324.3796" x2="612.0000" y2="324.3796" stroke="#586574" stroke-width="2.05" stroke-linecap="round" /><polygon points="625.0000,324.3796 612.0000,319.1796 612.0000,329.5796" fill="#586574" /><line x1="359.2235" y1="548.0000" x2="359.2235" y2="117.0000" stroke="#586574" stroke-width="2.05" stroke-linecap="round" /><polygon points="359.2235,104.0000 354.0235,117.0000 364.4235,117.0000" fill="#586574" /><line x1="100.2519" y1="540.0080" x2="421.2937" y2="111.9920" stroke="#21629a" stroke-width="6.9" stroke-linecap="round" /><line x1="213.6931" y1="540.0080" x2="534.7349" y2="111.9920" stroke="#a34d1a" stroke-width="6.9" stroke-linecap="round" stroke-dasharray="12 7" /><circle cx="359.22352941176473" cy="194.74452554744522" r="7" fill="#21629a" stroke="white" stroke-width="2" /><line x1="331.3494" y1="194.7445" x2="355.3341" y2="194.7445" stroke="#226f66" stroke-width="1.95" stroke-linecap="round" stroke-dasharray="5 4" /><circle cx="359.22352941176473" cy="345.985401459854" r="7" fill="#a34d1a" stroke="white" stroke-width="2" /><line x1="331.3494" y1="345.9854" x2="355.3341" y2="345.9854" stroke="#226f66" stroke-width="1.95" stroke-linecap="round" stroke-dasharray="5 4" /><line x1="328.7565" y1="345.9854" x2="328.7565" y2="207.7445" stroke="#226f66" stroke-width="3.1" stroke-linecap="round" /><polygon points="328.7565,194.7445 323.5565,207.7445 333.9565,207.7445" fill="#226f66" /><line x1="54.0000" y1="39.0000" x2="99.0000" y2="39.0000" stroke="#21629a" stroke-width="5.65" stroke-linecap="round" /><text x="110.0000" y="46.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#21629a" text-anchor="start">y = (4/3)x + 2</text><line x1="352.0000" y1="39.0000" x2="397.0000" y2="39.0000" stroke="#a34d1a" stroke-width="5.65" stroke-linecap="round" stroke-dasharray="12 7" /><text x="408.0000" y="46.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#a34d1a" text-anchor="start">y = (4/3)x − 1/3</text><text x="641.000" y="311.380" fill="#586574" font-size="29" font-weight="600" font-family="Malgun Gothic, Cambria Math, sans-serif" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="4.0" stroke-linejoin="round">x</text><text x="378.224" y="99.000" fill="#586574" font-size="29" font-weight="600" font-family="Malgun Gothic, Cambria Math, sans-serif" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="4.0" stroke-linejoin="round">y</text><text x="380.224" y="353.380" fill="#586574" font-size="29" font-weight="600" font-family="Malgun Gothic, Cambria Math, sans-serif" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="4.0" stroke-linejoin="round">O</text><text x="384.224" y="203.745" fill="#21629a" font-size="30" font-weight="600" font-family="Malgun Gothic, Cambria Math, sans-serif" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="4.0" stroke-linejoin="round">2</text><text x="400.224" y="372.985" fill="#a34d1a" font-size="29" font-weight="600" font-family="Malgun Gothic, Cambria Math, sans-serif" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="4.0" stroke-linejoin="round">−1/3</text></svg>
