<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 400" width="580" height="400" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">n=1을 대입한 대표 그림. 원의 중심 O=(3,-2), 반지름 3, 이등분 직선 y=x-5는 중심을 지난다. 일반 n에서는 중심 (3n,n²-3n)을 대입해 a_n=n²-6n.</title><desc id="visual-desc">반지름 3인 원의 중심 O=(3,-2)를 대각선 직선 y=x-5가 통과한다. 중심에서 오른쪽 원주까지 점선 반지름이 있고 길이 3을 표시한다. 원 내부의 불필요한 면 채움은 없다.</desc><rect width="580" height="400" fill="#fff"/><g data-layer="30"><line id="radiusOR" data-role="line" stroke="#111" stroke-width="1.6" fill="none" stroke-dasharray="6 4" x1="290" y1="200" x2="440" y2="200"/></g><g data-layer="38"><line id="diameterLine" data-role="line" stroke="#c0392b" stroke-width="3.2" fill="none" x1="140" y1="350" x2="440" y2="50"/></g><g data-layer="40"><circle id="k" data-role="circle" stroke="#111" stroke-width="2.05" fill="none" cx="290" cy="200" r="150"/></g><g data-layer="70"><circle id="O" data-role="point" stroke="#111" stroke-width="0.8" fill="#111" cx="290" cy="200" r="3.2"/></g><g data-layer="85"><line id="equation-owner-leader" data-role="leader" data-owner-label="equation" data-owner="diameterLine" x1="350" y1="140" x2="303.114201177" y2="120" stroke="#666" stroke-width="0.8" fill="none"/></g><g data-layer="90"><g id="O-name" data-label-kind="POINT_NAME" data-priority="1" data-font-px="25.9" data-owner="O" data-fragment-sha="sha256:a67d3665c