<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 460" width="680" height="460" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">n=3에서 새 직선 l₄을 추가한 예. 기존 직선 l₁,l₂,l₃과 만나는 서로 다른 점 P,Q,R 세 개가 새로 생긴다. 따라서 a_(n+1)=a_n+n.</title><desc id="visual-desc">기존 세 직선과 강조된 네 번째 직선이 있다. 강조선 위에 서로 다른 세 교점 P, Q, R을 점과 글자로 모두 표시한다.</desc><rect width="680" height="460" fill="#fff"/><g data-layer="30"><line id="sL1" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="137.368421053" y1="287.894736842" x2="542.631578947" y2="287.894736842"/></g><g data-layer="30"><line id="sL2" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="311.052631579" y1="403.684210526" x2="311.052631579" y2="56.315789474"/></g><g data-layer="30"><line id="sL3" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="195.263157895" y1="345.789473684" x2="484.736842105" y2="56.315789474"/></g><g data-layer="38"><line id="sL4" data-role="line" stroke="#c0392b" stroke-width="3.2" fill="none" x1="195.263157895" y1="56.315789474" x2="542.631578947" y2="403.684210526"/></g><g data-layer="70"><circle id="P" data-role="point" stroke="#111" stroke-width="0.8" fill="#111" cx="426.842105263" cy="287.894736842" r="3.2"/></g><g data-layer="70"><circle id="Q" data-role="point" stroke="#111" stroke-width="0.8" fill="#111" cx="311.052631579" cy="172.1052631