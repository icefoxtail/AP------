<line x1="60" y1="390" x2="420" y2="30" stroke="#777" stroke-width="2"/>
<text x="390" y="52" font-size="19">y=x</text>
<line x1="140" y1="190" x2="260" y2="190" stroke="#333" stroke-width="3"/>
<line x1="260" y1="190" x2="260" y2="30" stroke="#333" stroke-width="3"/>
