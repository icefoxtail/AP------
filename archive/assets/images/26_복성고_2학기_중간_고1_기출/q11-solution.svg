<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420">
<rect width="640" height="420" fill="white"/>
<line x1="70" y1="350" x2="560" y2="55" stroke="#777" stroke-width="2"/>
<text x="485" y="85" font-size="20">y=x</text>
<line x1="360" y1="315" x2="360" y2="85" stroke="#222" stroke-width="3"/>
<circle cx="180" cy="130" r="6"/><text x="120" y="120" font-size="20">A(1,4)</text>
<circle cx="360" cy="315" r="6"/><text x="370" y="330" font-size="20">A'(4,1)</text>
<circle cx="360" cy="85" r="6"/><text x="370" y="80" font-size="20">B(4,8)</text>
<circle cx="360" cy="175" r="6"/><text x="375" y="175" font-size="20">P(4,4)</text>
<line x1="180" y1="130" x2="360" y2="175" stroke="#555" stroke-width="2" stroke-dasharray="8 6"/>
<text x="55" y="390" font-size="19">A를 y=x에 대칭이동하면 AP=A'P, A'–P–B가 일직선일 때 최솟값.</text>
</svg>