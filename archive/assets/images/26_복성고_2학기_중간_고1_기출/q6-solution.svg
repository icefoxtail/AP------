<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="평행과 수직 조건"><rect width="640" height="400" fill="white"/><line x1="320" y1="35" x2="320" y2="365" stroke="#bbb"/><g stroke="#222" fill="none" stroke-width="2.2"><line x1="45" y1="275" x2="285" y2="195"/><line x1="45" y1="240" x2="285" y2="160"/><line x1="355" y1="125" x2="585" y2="263"/><line x1="395" y1="340" x2="520" y2="132"/></g><text x="65" y="62" font-family="Arial,sans-serif" font-size="17" fill="#111">a=2: 두 직선의 기울기 1/3</text><text x="65" y="90" font-family="Arial,sans-serif" font-size="17" fill="#111">→ 서로 평행</text><text x="350" y="62" font-family="Arial,sans-serif" font-size="17" fill="#111">b=9: 기울기 −3/5, 5/3</text><text x="350" y="90" font-family="Arial,sans-serif" font-size="17" fill="#111">곱 = −1 → 서로 수직</text><text x="70" y="315" font-family="Arial,sans-serif" font-size="16" fill="#111">x−3y+2=0</text><text x="70" y="345" font-family="Arial,sans-serif" font-size="16" fill="#111">2x−6y+9=0</text><text x="360" y="305" font-family="Arial,sans-serif" font-size="16" fill="#111">3x+5y−4=0</text><text x="440" y="355" font-family="Arial,sans-serif" font-size="16" fill="#111">15x−9y+11=0</text></svg>
