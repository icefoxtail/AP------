<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 560" width="720" height="560" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">원 O 밖의 점 P에서 원 O에 그은 두 접선의 접점이 A, B이고, 원 위의 점 C에 대하여 각 OAC가 35도, 점 B에서의 접선과 현 BC가 이루는 각이 50도인 그림이다.</title><desc id="visual-desc">원 O와 원 밖의 점 P가 있고 P에서 두 접점 A, B로 접선을 그었다. 중심 O에서 A, B, C로 반지름을 그었고, 점 B를 지나는 접선이 한쪽으로 더 뻗어 현 BC와 50도를 이룬다. 각 OAC는 35도로 표시되어 있다.</desc><rect width="720" height="560" fill="#fff"/><g data-layer="12"><polygon id="g35-sector" data-role="angleSector" stroke="none" stroke-width="1.6" fill="#7fa6e8" data-owner-points="O A C" data-mark="angle" data-mark-id="g35" data-mark-index="0" data-mark-count="1" data-mark-side="INNER" fill-opacity="0.32" points="446.985972017,147.015493814 463.046112235,169.951751054 463.909881106,169.322024274 464.748983974,168.659786508 465.562197875,167.966002946 466.348337579,167.241684752 467.106257315,166.487887594 467.834852441,165.705710106 468.533061056,164.896292284 469.199865545,164.060813826 469.834294064,163.200492412 470.435421956,162.316581931 471.002373097,161.410370651 471.534321177,160.483179344 472.0304909,159.536359357 472.490159115,158.571290648 472.912655873,157.589379772 473.297365399,156.592057827"/></g><g data-layer="12"><polygon id="g50-sector" data-role="angleSector" stroke="none" stroke-width="1.6" fill="#6fcf97" data-owner-points="C B