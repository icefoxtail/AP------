<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 430" width="700" height="430" role="img" aria-labelledby="title desc" data-axis-scale-mode="SCHEMATIC_NOT_TO_SCALE" data-visual-provenance="deterministic-constraint-coherent">
<title id="title">문항 17 해설: 내심을 지나는 평행선과 닮음</title>
<desc id="desc">삼각형 ABC의 실제 화면 기하에서 I가 세 변까지 같은 거리에 있고 내접원이 세 변에 접한다. I를 지나는 DE는 BC와 평행하며 높이비가 7:10이다.</desc>
<rect width="700" height="430" fill="white"/>
<g stroke="#111827" stroke-width="2.4" fill="none">
  <path d="M 350.00 50.00 L 207.70 350.00 L 492.30 350.00 Z"/>
  <line x1="250.39" y1="260.00" x2="449.61" y2="260.00"/>
  <circle cx="350.00" cy="260.00" r="90.00" stroke="#64748b" stroke-width="1.8"/>
  <line x1="350.00" y1="50.00" x2="350.00" y2="350.00" stroke="#94a3b8" stroke-dasharray="5 5"/>
  <line x1="350.00" y1="260.00" x2="350.00" y2="350.00" stroke="#111827" stroke-dasharray="6 5"/>
</g>
<g fill="#111827" font-family="Arial, sans-serif" font-size="16">
  <circle cx="350.00" cy="260.00" r="4"/>
  <text x="342.00" y="38.00" font-weight="700">A</text>
  <text x="185.70" y="375.00">B</text>
  <text x="500.30" y="375.00">C</text>
  <text x="226.39" y="252.00">D</text>
  <text x="457.61" y="252.00">E</text>
  <text x="360.00" y="250.00">I</text>
  <text x="469.61" y="278.00">DE ∥ BC</text>
  <text x="368.00" y="305.00">I에서 BC까지 = 1</text>
  <text x="368.00" y="155.00">A에서 DE까지 = 7/3</text>
  <text x="42" y="86">A에서 BC까지 높이 = 10/3</text>
  <text x="236" y="408">닮음비 7/10 → 넓이비 49/100</text>
</g>
</svg>