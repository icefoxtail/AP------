<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img" aria-labelledby="title desc">
  <title id="title">문항 1 해설: A는 B의 부분집합</title>
  <desc id="desc">A와 B의 포함관계에서 A 바깥의 B 여집합 영역이 비어 있음을 나타낸 Venn diagram</desc>
  <style>
    text{font-family:"Noto Sans KR","Malgun Gothic",Arial,sans-serif;fill:#172033}
    .muted{fill:#56657a}.formula{font-family:Georgia,"Times New Roman",serif}
  </style>
  <rect width="760" height="360" rx="18" fill="#f8fafc"/>
  <text x="30" y="38" font-size="22" font-weight="700">식의 조건을 포함관계로 바꾸기</text>
  <text x="30" y="67" class="muted" font-size="15">주어진 식 = A∩Bᶜ = ∅  →  A⊆B</text>
  <rect x="30" y="98" width="270" height="205" rx="14" fill="#fff" stroke="#cbd5e1"/>
  <text x="52" y="132" font-size="16" font-weight="700">정리의 핵심</text>
  <text x="52" y="171" class="formula" font-size="21">A∩Bᶜ = ∅</text>
  <text x="52" y="206" class="muted" font-size="15">A 안에서 B 밖에 있는</text>
  <text x="52" y="231" class="muted" font-size="15">원소가 하나도 없다.</text>
  <path d="M210 260h56" stroke="#2563eb" stroke-width="3"/>
  <path d="m256 252 12 8-12 8" fill="none" stroke="#2563eb" stroke-width="3"/>
  <text x="52" y="282" font-size="18" font-weight="700" fill="#2563eb">A⊆B</text>
  <rect x="330" y="98" width="400" height="205" rx="14" fill="#fff" stroke="#cbd5e1"/>
  <rect x="350" y="118" width="360" height="165" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="370" y="143" font-size="16" font-weight="700" fill="#15803d">전체집합 U</text>
  <ellipse cx="535" cy="202" rx="145" ry="67" fill="#dcfce7" fill-opacity=".82" stroke="#16a34a" stroke-width="3"/>
  <ellipse cx="535" cy="202" rx="70" ry="40" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
  <text x="650" y="170" font-size="20" font-weight="700" fill="#15803d">B</text>
  <text x="535" y="208" text-anchor="middle" font-size="20" font-weight="700" fill="#1d4ed8">A</text>
  <text x="380" y="326" text-anchor="middle" class="muted" font-size="14">A∩Bᶜ=∅ : A 안에 B 밖 원소가 없다.</text>
</svg>
