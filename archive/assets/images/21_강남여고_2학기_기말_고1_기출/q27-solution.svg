<title id="svg-title-c3ff40de7d">무리함수 그래프가 지나는 사분면</title>
<desc id="svg-desc-c3ff40de7d">유리함수의 점근선과 y절편 조건에서 a=−2,b=−1,c=−1이다. 따라서 g(x)=√(−2x−1)−1, x≤−1/2이며 그래프는 제2사분면과 제3사분면을 지난다.</desc>
