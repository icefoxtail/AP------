<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 722 797" width="722" height="797" role="img" aria-labelledby="title desc"><title id="title">내심이 표시된 삼각형과 원의 색칠 부분</title><desc id="desc">① 내심 I와 세 꼭짓점이 연결되어 있다. B는 25도, C는 30도의 반각이 표시되고 A에 x가 있다. ② 원 위 A, B, C에서 O로 선을 그었다. BAO는 27도, BCO는 18도이고 OC는 8이다. A와 C를 잇는 현과 윗쪽 원호 사이를 칠했다.</desc><rect width="722" height="797" fill="white" /><rect x="23" y="20" width="676" height="365" rx="16" fill="#f8fafc" stroke="#d9e3ec" stroke-width="1.85" /><text x="59.0000" y="62.0000" font-size="34" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#263b4b" text-anchor="middle">①</text><polygon points="394.7657,80.5000 178.2780,338.5000 543.7220,338.5000" fill="#eaf3fa" /><line x1="394.7657" y1="80.5000" x2="178.2780" y2="338.5000" stroke="#23649a" stroke-width="4.7" stroke-linecap="round" /><line x1="178.2780" y1="338.5000" x2="543.7220" y2="338.5000" stroke="#23649a" stroke-width="4.7" stroke-linecap="round" /><line x1="543.7220" y1="338.5000" x2="394.7657" y2="80.5000" stroke="#23649a" stroke-width="4.7" stroke-linecap="round" /><line x1="380.4412" y1="244.2297" x2="394.7657" y2="80.5000" stroke="#217060" stroke-width="4.5" stroke-linecap="round" /><line x1="380.4412" y1="244.2297" x2="178.2780" y2="338.5000" stroke="#217060" stroke-width="4.5" stroke-linecap="round" /><line x1="380.4412" y1="244.2297" x2="543.7220" y2="338.5000" stroke="#217060" stroke-width="4.5" stroke-linecap="round" /><path d="M 364.555 116.504 A 47 47 0 0 0 390.669 127.321" stroke="#217060" stroke-width="2.6" fill="none" /><text x="366.169" y="155.710" fill="#217060" font-size="30" font-weight="600" font-family="Malgun Gothic, Cambria Math, sans-serif" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="4.0" stroke-linejoin="round">x</text><path d="M 248.278 338.500 A 70 70 0 0 0 241.720 308.917" stroke="#774698" stroke-width="2.6" fill="none" /><text x="275.026" y="322.938" fill="#774698" font-size="30" font-wei