<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" role="img" aria-labelledby="title desc">
<title id="title">정사각뿔 단면과 최대 부피 직육면체</title>
<desc id="desc">모든 모서리 길이가 3인 정사각뿔의 중심 단면에서 높이 H=3/√2, 최적 직육면체 높이 h=H/3, 윗면 한 변 길이 2를 나타낸 그림</desc>
<rect x="0" y="0" width="560" height="360" fill="white"/>
<g stroke="black" fill="none" stroke-width="2">
  <line x1="96.667" y1="300.0" x2="280.0" y2="85.714"/>
  <line x1="280.0" y1="85.714" x2="463.333" y2="300.0"/>
  <line x1="96.667" y1="300.0" x2="463.333" y2="300.0"/>
  <rect x="157.778" y="228.571" width="244.444" height="71.429"/>
  <line x1="280.0" y1="300.0" x2="280.0" y2="85.71428571428572" stroke-dasharray="6 5"/>
</g>
<g font-family="Arial, sans-serif" font-size="18" fill="black">
  <text x="288.0" y="192.85714285714286">H = 3/√2</text>
  <text x="288.0" y="264.2857142857143">h = H/3</text>
  <text x="212.77777777777777" y="218.57142857142856" text-anchor="middle">s = 2</text>
  <text x="280.0" y="340" text-anchor="middle">V = s²h = 2√2</text>
</g>
</svg>