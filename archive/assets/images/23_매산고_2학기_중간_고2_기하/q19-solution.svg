<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" width="640" height="480" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">반지름이 같은 두 원이 한 점에서 만나면 그 점은 두 중심을 잇는 선분의 중점이다. A는 O₁O₃의 중점, B는 O₁O₄의 중점이므로 벡터 O₁O₃=2a, O₁O₄=2b이다(그림은 C₁, C₃, C₄만 그린 한 예이고 C₂는 합에서 소거된다). O₂O₁+O₄O₂=O₄O₁=−2b, −O₃B=BO₃=−b+2a, −O₃A=AO₃=a이다. 모두 더하면 3a−3b이므로 m=3, n=−3이고 m−n=6이다.</title><desc id="visual-desc">크기가 같은 세 원 C1, C3, C4가 있고 O1에서 O3, O4로 향하는 두 선분이 각각 중점 A, B에서 두 등분되어 있다. 각 절반의 길이가 문자 a, b로 표시되어 있다.</desc><rect width="640" height="480" fill="#fff"/><g data-layer="30"><line id="sO1A" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="271.953937909" y1="323.218220645" x2="368.046062091" y2="323.218220645"/></g><g data-layer="30"><line id="sAO3" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="368.046062091" y1="323.218220645" x2="464.138186273" y2="323.218220645"/></g><g data-layer="30"><line id="sO1B" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="271.953937909" y1="323.218220645" x2="223.907875818" y2="240"/></g><g data-layer="30"><line id="sBO4" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="223.907875818" y1="240" x2="175.861813727" y2="156.781779355"/></g><g data-layer="40"><circle id="C1" data-role="circle" stroke="#111" stroke-width="2.05" fill="none" cx="271.953937909" cy="323.