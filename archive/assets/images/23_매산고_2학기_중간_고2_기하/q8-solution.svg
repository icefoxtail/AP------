<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 448 242" width="448" height="242" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-ellipse-figure="ellipse-figure-v1" data-conic="HYPERBOLA" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="6" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round"><title id="visual-title">직선 y=2x+k를 쌍곡선 x²−4y²=8에 대입하면 15x²+16kx+4k²+8=0이다. 서로 다른 두 점에서 만나려면 판별식이 0보다 커야 하므로 16k²−480&gt;0, 즉 k²&gt;30이다. 실선은 k=6인 직선으로 쌍곡선과 두 점 P, Q에서 만나고, 점선은 k=5인 직선으로 쌍곡선과 만나지 않는다. 자연수 k의 최솟값은 6이므로 따라서 답은 ①이다.</title><desc id="visual-desc">좌표평면에 쌍곡선과 기울기가 2인 두 직선이 그려져 있고, 실선은 두 점 P, Q에서 쌍곡선과 만나며 점선은 쌍곡선과 만나지 않는다.</desc><rect width="448" height="242" fill="#fff"/><g data-layer="10"><line id="axis-x" data-role="axis" data-axis="x" x1="34" y1="121.43" x2="414" y2="121.43" fill="none" stroke="#444" stroke-width="1.1"/></g><g data-layer="10"><line id="axis-y" data-role="axis" data-axis="y" x1="224" y1="208" x2="224" y2="34.86" fill="none" stroke="#444" stroke-width="1.1"/></g><g data-layer="11"><polygon id="axis-x-head" data-role="axis-head" data-axis="x" points="414,121.43 405,117.83 405,125.03" fill="#444" stroke="none"/></g><g data-layer="11"><polygon id="axis-y-head" data-role="axis-head" data-axis="y" points="224,34.86 220.4,43.86 227.6,43.86" fill="#444" stroke="none"/></g><g data-layer="25"><path id="curve-pos" data-role="curve" data-curve="HYPERBOLA" data-branch="POS" d="M414 197.75 L413.34 197.35 L412.39 196.75 L411.44 196.16 L410.51 195.57 L409.57 194.98 L408.65 194.4 L407.73 193.82 L406.82 193.24 L405.92 192.66 L405.03 192.09 L404.14 191.52 L403.26 190.95 L402.38 190.39 L401.52 189.83 L400.66 189.27 L399.81 188.71 L398.96 188.16 L398.12 187.61 L397.29 187.06 L396.47 186.52 L395.65 185.98 L394.84 185.44 L394.04 184.9 L393.24 184.36 L392.45 183.83 L391.66 183.3 L390.89 182.77 L390.12 182.25 L389.35 181.73 L388.59 181.2 L387.84 180.69 L387.1 180.17 L386.3