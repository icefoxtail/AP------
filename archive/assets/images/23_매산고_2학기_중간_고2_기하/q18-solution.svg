<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" width="560" height="420" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">직각삼각형 ABC에서 AC=5이고 ∠A=θ이면 sinθ=BC/AC=4/5이다. 점 P가 AC 위에 있고 AP=AB=3이므로 ∠PAB=θ이다. 삼각형 ABP의 넓이는 S=(1/2)×3×3×sinθ=(1/2)×3×3×4/5=18/5이다. 따라서 5S=18이다.</title><desc id="visual-desc">B에서 직각을 이루는 직각삼각형 ABC가 있고 빗변 AC 위에 점 P가 있다. 선분 BP는 점선이며 AB=3, BC=4, AP=3, PC=2와 각 θ가 표시되어 있다.</desc><rect width="560" height="420" fill="#fff"/><g data-layer="30"><line id="AB" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="75.402298851" y1="56.551724138" x2="75.402298851" y2="363.448275862"/></g><g data-layer="30"><line id="BC" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="75.402298851" y1="363.448275862" x2="484.597701149" y2="363.448275862"/></g><g data-layer="30"><line id="AP" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="75.402298851" y1="56.551724138" x2="320.91954023" y2="240.689655172"/></g><g data-layer="30"><line id="PC" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="320.91954023" y1="240.689655172" x2="484.597701149" y2="363.448275862"/></g><g data-layer="30"><line id="BP" data-role="line" stroke="#111" stroke-width="1.6" fill="none" stroke-dasharray="6 4" x1="75.402298851" y1="363.448275862" x2="320.91954023" y2="240.689655172"/></g><g data-layer