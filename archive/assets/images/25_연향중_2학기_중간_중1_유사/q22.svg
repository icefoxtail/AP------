<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 220" width="480" height="220" role="img" aria-labelledby="q22-title q22-desc">
  <title id="q22-title">직선 위의 점들과 직선 밖의 점 다이어그램</title>
  <desc id="q22-desc">직선 l 위에 순서대로 놓인 네 점 A, B, C, D와 직선 위쪽에 놓인 점 P</desc>
  <rect width="480" height="220" fill="#ffffff"/>
  <!-- 직선 l -->
  <line x1="30" y1="160" x2="450" y2="160" stroke="#0f172a" stroke-width="2.5"/>
  <text x="460" y="165" font-family="sans-serif" font-size="15" font-weight="bold" fill="#0f172a">l</text>
  <!-- 직선 l 위의 네 점: A(90,160), B(180,160), C(270,160), D(360,160) -->
  <circle cx="90" cy="160" r="5" fill="#2563eb"/>
  <circle cx="180" cy="160" r="5" fill="#2563eb"/>
  <circle cx="270" cy="160" r="5" fill="#2563eb"/>
  <circle cx="360" cy="160" r="5" fill="#2563eb"/>
  <!-- 직선 밖의 점 P(225,50) -->
  <circle cx="225" cy="50" r="5" fill="#ef4444"/>
  <!-- 라벨 -->
  <g font-family="sans-serif" font-size="16" font-weight="bold" fill="#0f172a" text-anchor="middle">
    <text x="90" y="190">A</text>
    <text x="180" y="190">B</text>
    <text x="270" y="190">C</text>
    <text x="360" y="190">D</text>
    <text x="225" y="35" fill="#ef4444">P</text>
  </g>
</svg>
