<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 120" width="480" height="120" role="img" aria-labelledby="q09-title q09-desc">
  <title id="q09-title">선분의 중점 관계 다이어그램</title>
  <desc id="q09-desc">길이가 48cm인 선분 AB 위에 AM의 중점 N, AB의 중점 M, NB의 중점 P가 순서대로 표시된 선분 그림</desc>
  <rect width="480" height="120" fill="#ffffff"/>
  <!-- 기준 선분 AB (A: 40, B: 440 -> 길이 400px, 48cm) -->
  <!-- N은 1/4 지점: 40 + 100 = 140 -->
  <!-- M은 2/4 지점: 40 + 200 = 240 -->
  <!-- P는 N(140)과 B(440)의 중점: (140+440)/2 = 290 -->
  <line x1="40" y1="50" x2="440" y2="50" stroke="#0f172a" stroke-width="3"/>
  <!-- 점 표시 -->
  <circle cx="40" cy="50" r="4.5" fill="#0f172a"/>
  <circle cx="140" cy="50" r="4.5" fill="#2563eb"/>
  <circle cx="240" cy="50" r="4.5" fill="#0f172a"/>
  <circle cx="290" cy="50" r="4.5" fill="#ef4444"/>
  <circle cx="440" cy="50" r="4.5" fill="#0f172a"/>
  <!-- 라벨 -->
  <g font-family="sans-serif" font-size="15" font-weight="bold" fill="#0f172a" text-anchor="middle">
    <text x="40" y="32">A</text>
    <text x="140" y="32" fill="#2563eb">N</text>
    <text x="240" y="32">M</text>
    <text x="290" y="32" fill="#ef4444">P</text>
    <text x="440" y="32">B</text>
  </g>
  <!-- 전체 길이 48cm 치수선 -->
  <line x1="40" y1="85" x2="440" y2="85" stroke="#64748b" stroke-width="1.5"/>
  <line x1="40" y1="78" x2="40" y2="92" stroke="#64748b" stroke-width="1.5"/>
  <line x1="440" y1="78" x2="440" y2="92" stroke="#64748b" stroke-width="1.5"/>
  <text x="240" y="105" font-family="sans-serif" font-size="13" font-weight="bold" fill="#475569" text-anchor="middle">48 cm</text>
</svg>
