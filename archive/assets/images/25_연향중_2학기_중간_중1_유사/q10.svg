<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 260" width="420" height="260" role="img" aria-labelledby="q10-title q10-desc">
  <title id="q10-title">맞꼭지각과 수직 관계 다이어그램</title>
  <desc id="q10-desc">가로선과 세로선이 수직으로 만나고 기울어진 직선이 한 점에서 교차하며 각 32도, 각 x, 각 y를 이루는 그림</desc>
  <rect width="420" height="260" fill="#ffffff"/>
  <!-- 가로선과 세로선 (수직) -->
  <line x1="30" y1="130" x2="390" y2="130" stroke="#0f172a" stroke-width="2"/>
  <line x1="210" y1="20" x2="210" y2="240" stroke="#0f172a" stroke-width="2"/>
  <!-- 직각 표시 (1사분면 쪽) -->
  <rect x="210" y="105" width="20" height="25" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <!-- 기울어진 직선: 중심 (210,130), 각도 약 32도 (기울기 약 0.62) -->
  <line x1="50" y1="230" x2="370" y2="30" stroke="#2563eb" stroke-width="2"/>
  <!-- 각 32도 호 (왼쪽 아래 가로선과 기울어진 선 사이) -->
  <path d="M 160 130 A 50 50 0 0 1 168 156" fill="none" stroke="#ef4444" stroke-width="2"/>
  <text x="140" y="160" font-family="sans-serif" font-size="13" font-weight="bold" fill="#ef4444">32°</text>
  <!-- 각 x 호 (맞꼭지각: 오른쪽 위 가로선과 기울어진 선 사이) -->
  <path d="M 260 130 A 50 50 0 0 1 252 104" fill="none" stroke="#ef4444" stroke-width="2"/>
  <text x="270" y="115" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ef4444">x</text>
  <!-- 각 y 호 (왼쪽 위 세로선과 기울어진 선의 반대 방향 사이: 90 - 32 = 58도) -->
  <path d="M 210 80 A 50 50 0 0 1 252 104" fill="none" stroke="#2563eb" stroke-width="2"/>
  <text x="225" y="70" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2563eb">y</text>
</svg>
