<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 380" width="460" height="380" role="img" aria-labelledby="q08-title q08-desc">
  <title id="q08-title">반비례 관계 그래프와 점 P</title>
  <desc id="q08-desc">점 (3,4)를 지나는 반비례 그래프 y=12/x와 x좌표가 -2인 점 P의 위치</desc>
  <rect width="460" height="380" fill="#ffffff"/>
  <!-- 축 -->
  <line x1="30" y1="190" x2="430" y2="190" stroke="#0f172a" stroke-width="2"/>
  <polygon points="430,190 420,185 420,195" fill="#0f172a"/>
  <text x="440" y="194" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0f172a">x</text>
  <line x1="230" y1="360" x2="230" y2="20" stroke="#0f172a" stroke-width="2"/>
  <polygon points="230,20 225,30 235,30" fill="#0f172a"/>
  <text x="230" y="14" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="middle">y</text>
  <text x="216" y="206" font-family="sans-serif" font-size="13" fill="#0f172a">O</text>
  <!-- 반비례 곡선 y=12/x: (1,12)->(255,20), (2,6)->(280,90), (3,4)->(305,120), (4,3)->(330,135), (6,2)->(380,155) -->
  <path d="M 255 35 Q 280 105, 305 120 T 425 165" fill="none" stroke="#2563eb" stroke-width="2.5"/>
  <path d="M 205 345 Q 180 275, 155 260 T 35 215" fill="none" stroke="#2563eb" stroke-width="2.5"/>
  <text x="390" y="145" font-family="sans-serif" font-size="13" font-weight="bold" fill="#2563eb">y=a/x</text>
  <!-- 점 (3,4) 표시 -->
  <line x1="305" y1="190" x2="305" y2="120" stroke="#64748b" stroke-dasharray="3,3" stroke-width="1.5"/>
  <line x1="230" y1="120" x2="305" y2="120" stroke="#64748b" stroke-dasharray="3,3" stroke-width="1.5"/>
  <circle cx="305" cy="120" r="4.5" fill="#2563eb"/>
  <text x="305" y="206" font-family="sans-serif" font-size="12" fill="#0f172a" text-anchor="middle">3</text>
  <text x="218" y="124" font-family="sans-serif" font-size="12" fill="#0f172a" text-anchor="end">4</text>
  <!-- 점 P (x=-2, y=-6) 표시: (-2,-6) -> (180, 290) -->
  <line x1="180" y1="190" x2="180" y2="290" stroke="#ef4444" stroke-dasharray="3,3" stroke-width="1.5"/>
  <circle cx="180" cy="290" r="5" fill="#ef4444"/>
  <text x="180" y="180" font-family="sans-serif" font-size="12" fill="#ef4444" text-anchor="middle">-2</text>
  <text x="165" y="295" font-family="sans-serif" font-size="13" font-weight="bold" fill="#ef4444" text-anchor="end">P</text>
</svg>
