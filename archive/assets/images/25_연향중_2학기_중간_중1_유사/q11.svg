<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 240" width="460" height="240" role="img" aria-labelledby="q11-title q11-desc">
  <title id="q11-title">평각을 나누는 각의 비 다이어그램</title>
  <desc id="q11-desc">평각 AOF 위의 점 O에서 반직선 OB, OC, OD, OE가 뻗어나와 각들을 이루는 그림</desc>
  <rect width="460" height="240" fill="#ffffff"/>
  <!-- 평각 직선 AOF -->
  <line x1="30" y1="200" x2="430" y2="200" stroke="#0f172a" stroke-width="2"/>
  <circle cx="230" cy="200" r="4.5" fill="#0f172a"/>
  <text x="230" y="222" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="middle">O</text>
  <text x="30" y="222" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0f172a">A</text>
  <text x="430" y="222" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="end">F</text>
  <!-- 반직선들 (중심 230, 200, 길이 160) -->
  <!-- A: 180도, B: 180-36 = 144도 -> (100, 106) -->
  <line x1="230" y1="200" x2="100" y2="106" stroke="#0f172a" stroke-width="1.5"/>
  <text x="90" y="100" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a">B</text>
  <!-- C: 144 - 2x(64도) = 80도 -> (202, 42) -->
  <line x1="230" y1="200" x2="202" y2="42" stroke="#2563eb" stroke-width="2"/>
  <text x="195" y="32" font-family="sans-serif" font-size="13" font-weight="bold" fill="#2563eb">C</text>
  <!-- D: 80 - x(32도) = 48도 -> (337, 81) -->
  <line x1="230" y1="200" x2="337" y2="81" stroke="#0f172a" stroke-width="1.5"/>
  <text x="345" y="75" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a">D</text>
  <!-- E: 48 - y(16도) = 32도 -> (365, 115) -->
  <line x1="230" y1="200" x2="365" y2="115" stroke="#2563eb" stroke-width="2"/>
  <text x="375" y="115" font-family="sans-serif" font-size="13" font-weight="bold" fill="#2563eb">E</text>
  <!-- 36도 라벨 -->
  <path d="M 170 200 A 60 60 0 0 1 181 164" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <text x="160" y="180" font-family="sans-serif" font-size="12" fill="#475569">36°</text>
  <!-- 각 COE 호 강조 -->
  <path d="M 216 122 A 80 80 0 0 1 298 157" fill="none" stroke="#2563eb" stroke-width="2.5"/>
  <text x="265" y="130" font-family="sans-serif" font-size="13" font-weight="bold" fill="#2563eb">∠COE</text>
</svg>
