<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 220" width="480" height="220" role="img" aria-labelledby="q17-title q17-desc">
  <title id="q17-title">크기가 같은 각의 작도 과정 다이어그램</title>
  <desc id="q17-desc">각 XOY와 크기가 같은 각을 반직선 AB를 한 변으로 하여 옮겨 그리는 작도 그림</desc>
  <rect width="480" height="220" fill="#ffffff"/>
  <!-- 왼쪽 원래 각 XOY (꼭짓점 O: 50, 170) -->
  <line x1="50" y1="170" x2="200" y2="170" stroke="#0f172a" stroke-width="2"/>
  <line x1="50" y1="170" x2="160" y2="50" stroke="#0f172a" stroke-width="2"/>
  <circle cx="50" cy="170" r="4" fill="#0f172a"/>
  <text x="40" y="185" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0f172a">O</text>
  <text x="205" y="175" font-family="sans-serif" font-size="13" fill="#64748b">Y</text>
  <text x="165" y="45" font-family="sans-serif" font-size="13" fill="#64748b">X</text>
  <!-- 작도 호 1 (중심 O, 반지름 90) -->
  <path d="M 140 170 A 90 90 0 0 0 118 96" fill="none" stroke="#2563eb" stroke-width="2"/>
  <circle cx="140" cy="170" r="3.5" fill="#2563eb"/>
  <circle cx="118" cy="96" r="3.5" fill="#2563eb"/>
  <text x="140" y="190" font-family="sans-serif" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="middle">P</text>
  <text x="108" y="92" font-family="sans-serif" font-size="13" font-weight="bold" fill="#2563eb">Q</text>
  <!-- 작도 호 2 (현 PQ 거리 표시 점선) -->
  <line x1="140" y1="170" x2="118" y2="96" stroke="#ef4444" stroke-dasharray="3,3" stroke-width="1.5"/>
  <!-- 오른쪽 작도한 각 (꼭짓점 A: 270, 170) -->
  <line x1="270" y1="170" x2="430" y2="170" stroke="#0f172a" stroke-width="2"/>
  <line x1="270" y1="170" x2="380" y2="50" stroke="#0f172a" stroke-width="2"/>
  <circle cx="270" cy="170" r="4" fill="#0f172a"/>
  <text x="260" y="185" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0f172a">A</text>
  <text x="435" y="175" font-family="sans-serif" font-size="13" fill="#64748b">B</text>
  <!-- 작도 호 (중심 A, 반지름 90) -->
  <path d="M 360 170 A 90 90 0 0 0 330 80" fill="none" stroke="#2563eb" stroke-width="2"/>
  <circle cx="360" cy="170" r="3.5" fill="#2563eb"/>
  <text x="360" y="190" font-family="sans-serif" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="middle">C</text>
  <!-- 교점 D 호 -->
  <path d="M 325 110 A 70 70 0 0 1 345 90" fill="none" stroke="#ef4444" stroke-width="2"/>
  <circle cx="338" cy="96" r="3.5" fill="#ef4444"/>
  <text x="328" y="92" font-family="sans-serif" font-size="13" font-weight="bold" fill="#ef4444">D</text>
</svg>
