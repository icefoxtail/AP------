<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 280" width="460" height="280" role="img" aria-labelledby="q14-title q14-desc">
  <title id="q14-title">세 직선이 이루는 엇각 다이어그램</title>
  <desc id="q14-desc">세 직선이 세 점에서 만나며 이루는 각들 중 각 g와 엇각 위치에 있는 각 b, 각 j</desc>
  <rect width="460" height="280" fill="#ffffff"/>
  <!-- 세 직선: 직선 l (위아래 완만), 직선 m (좌우 수평에 가까움), 직선 n (대각선) -->
  <line x1="40" y1="210" x2="420" y2="210" stroke="#0f172a" stroke-width="2"/>
  <line x1="60" y1="250" x2="300" y2="30" stroke="#0f172a" stroke-width="2"/>
  <line x1="380" y1="250" x2="160" y2="30" stroke="#0f172a" stroke-width="2"/>
  <!-- 세 교점: 위쪽(230,95), 아래왼쪽(117,210), 아래오른쪽(323,210) -->
  <!-- 위쪽 교점 (230,95) 주위 각: a(위), b(왼쪽내각), c(오른쪽내각), d(아래) -->
  <text x="215" y="115" font-family="sans-serif" font-size="13" font-weight="bold" fill="#ef4444">b</text>
  <text x="238" y="115" font-family="sans-serif" font-size="13" fill="#64748b">c</text>
  <text x="230" y="80" font-family="sans-serif" font-size="13" fill="#64748b">a</text>
  <text x="230" y="135" font-family="sans-serif" font-size="13" fill="#64748b">d</text>
  <!-- 아래왼쪽 교점 (117,210) 주위 각: e, f, g(안쪽각), h -->
  <text x="135" y="195" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2563eb">g</text>
  <text x="95" y="195" font-family="sans-serif" font-size="13" fill="#64748b">e</text>
  <text x="95" y="235" font-family="sans-serif" font-size="13" fill="#64748b">f</text>
  <text x="135" y="235" font-family="sans-serif" font-size="13" fill="#64748b">h</text>
  <!-- 아래오른쪽 교점 (323,210) 주위 각: i, j(안쪽각), k, l -->
  <text x="305" y="195" font-family="sans-serif" font-size="13" fill="#64748b">i</text>
  <text x="305" y="235" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ef4444">j</text>
  <text x="345" y="195" font-family="sans-serif" font-size="13" fill="#64748b">k</text>
  <text x="345" y="235" font-family="sans-serif" font-size="13" fill="#64748b">l</text>
  <!-- g, b, j 각 호 강조 -->
  <path d="M 125 195 A 20 20 0 0 1 138 210" fill="none" stroke="#2563eb" stroke-width="2"/>
  <path d="M 218 105 A 20 20 0 0 1 224 116" fill="none" stroke="#ef4444" stroke-width="2"/>
  <path d="M 315 210 A 20 20 0 0 1 310 225" fill="none" stroke="#ef4444" stroke-width="2"/>
</svg>
