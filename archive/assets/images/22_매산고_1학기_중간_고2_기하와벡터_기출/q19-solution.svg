<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 528 424" width="528" height="424" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-ellipse-figure="ellipse-figure-v1" data-major-axis="X" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="6" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round"><title id="visual-title">x²/36+y²/20=1에서 c²=36−20=16이므로 초점은 F(4, 0), F′(−4, 0)이다. PF+PF′=(PO+OF)+(PO+OF′)=2PO+(OF+OF′)=2PO이므로 (1) k=2이다. (2) |PF+PF′|=2|PO|이고 타원 위에서 OP의 최댓값은 긴 반축 6이므로 최댓값은 12이다. 따라서 답은 (1) 2, (2) 12이다.</title><desc id="visual-desc">가로로 긴 타원과 두 초점 F, F′, 곡선 위의 점 P가 있다. P에서 F, F′로 가는 선분과 삼각형 PF′F가 색칠되어 있고 P에서 원점 O로 가는 점선이 있다.</desc><rect width="528" height="424" fill="#fff"/><g data-layer="10"><line id="axis-x" data-role="axis" data-axis="x" x1="34" y1="212.06" x2="494" y2="212.06" fill="none" stroke="#444" stroke-width="1.1"/></g><g data-layer="10"><line id="axis-y" data-role="axis" data-axis="y" x1="264" y1="390" x2="264" y2="34.12" fill="none" stroke="#444" stroke-width="1.1"/></g><g data-layer="11"><polygon id="axis-x-head" data-role="axis-head" data-axis="x" points="494,212.06 485,208.46 485,215.66" fill="#444" stroke="none"/></g><g data-layer="11"><polygon id="axis-y-head" data-role="axis-head" data-axis="y" points="264,34.12 260.4,43.12 267.6,43.12" fill="#444" stroke="none"/></g><g data-layer="20"><polygon id="polygon-t" data-role="polygon" data-points="P,F',F" points="366.22,80.09 127.7,212.06 400.3,212.06" fill="#eeeeee" stroke="none"/></g><g data-layer="25"><ellipse id="ellipse" data-role="ellipse" cx="264" cy="212.06" rx="204.44" ry="152.38" fill="none" stroke="#111" stroke-width="1.7"/></g><g data-layer="30"><line id="segment-sPF" data-role="segment" data-from="P" data-to="F" x1="366.22" y1="80.09" x2="400.3" y2="212.06" fill="none" stroke="#111" stroke-width="1.3"/></g><g data-layer="30"><line id="segment-sPG" data-role="segment" data-from="P" data-to=