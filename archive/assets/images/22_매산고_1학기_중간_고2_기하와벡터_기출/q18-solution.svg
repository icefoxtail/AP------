<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 448 288" width="448" height="288" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-ellipse-figure="ellipse-figure-v1" data-major-axis="X" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="6" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round"><title id="visual-title">타원에서 PF+PF′=2a=8이고 PQ가 중심 O를 지나므로 Q는 P와 O에 대하여 대칭이어서 F′Q=PF이다. 따라서 PF′+F′Q=8이고 삼각형 PF′Q의 둘레 13에서 PQ=13−8=5이다. O가 PQ의 중점이므로 OP=5/2이다. 따라서 답은 5/2이다.</title><desc id="visual-desc">가로로 긴 타원과 두 초점 F, F′가 있다. 원점을 지나는 지름의 양 끝점 P, Q와 F′를 잇는 삼각형이 색칠되어 있고 PQ의 길이가 표시되어 있다.</desc><rect width="448" height="288" fill="#fff"/><g data-layer="10"><line id="axis-x" data-role="axis" data-axis="x" x1="34" y1="144" x2="414" y2="144" fill="none" stroke="#444" stroke-width="1.1"/></g><g data-layer="10"><line id="axis-y" data-role="axis" data-axis="y" x1="224" y1="254" x2="224" y2="34" fill="none" stroke="#444" stroke-width="1.1"/></g><g data-layer="11"><polygon id="axis-x-head" data-role="axis-head" data-axis="x" points="414,144 405,140.4 405,147.6" fill="#444" stroke="none"/></g><g data-layer="11"><polygon id="axis-y-head" data-role="axis-head" data-axis="y" points="224,34 220.4,43 227.6,43" fill="#444" stroke="none"/></g><g data-layer="20"><polygon id="polygon-t1" data-role="polygon" data-points="P,F',Q" points="293.28,71.89 85.44,144 154.72,216.11" fill="#eeeeee" stroke="none"/></g><g data-layer="25"><ellipse id="ellipse" data-role="ellipse" cx="224" cy="144" rx="160" ry="80" fill="none" stroke="#111" stroke-width="1.7"/></g><g data-layer="30"><line id="segment-s1" data-role="segment" data-from="P" data-to="F'" x1="293.28" y1="71.89" x2="85.44" y2="144" fill="none" stroke="#111" stroke-width="1.3"/></g><g data-layer="30"><line id="segment-s2" data-role="segment" data-from="F'" data-to="Q" x1="85.44" y1="144" x2="154.72" y2="216.11" fill="none" stroke="#111" stroke-width="1.3"