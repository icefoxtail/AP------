<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 324 242" width="324" height="242" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-ellipse-figure="ellipse-figure-v1" data-conic="HYPERBOLA" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="6" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round"><title id="visual-title">2x²−3y²=6은 x²/3−y²/2=1이다. 직선 y=2x+k를 대입하면 10x²+12kx+3k²+6=0이고 만나지 않으려면 판별식 24k²−240&lt;0, 즉 k²&lt;10이다. 그림의 점선은 k=√10일 때 접하는 경계 직선이고 접점은 T이며, 실선은 k=3으로 쌍곡선과 만나지 않는다. 정수 k는 −3부터 3까지이므로 가장 큰 정수는 3이고 답은 ①이다.</title><desc id="visual-desc">좌우로 갈라진 쌍곡선과 기울기 2인 두 직선이 있다. 점선은 쌍곡선의 왼쪽 가지에 접점 T에서 닿고, 실선은 쌍곡선과 만나지 않는다.</desc><rect width="324" height="242" fill="#fff"/><g data-layer="10"><line id="axis-x" data-role="axis" data-axis="x" x1="34" y1="121.43" x2="289.96" y2="121.43" fill="none" stroke="#444" stroke-width="1.1"/></g><g data-layer="10"><line id="axis-y" data-role="axis" data-axis="y" x1="161.98" y1="208" x2="161.98" y2="34.86" fill="none" stroke="#444" stroke-width="1.1"/></g><g data-layer="11"><polygon id="axis-x-head" data-role="axis-head" data-axis="x" points="289.96,121.43 280.96,117.83 280.96,125.03" fill="#444" stroke="none"/></g><g data-layer="11"><polygon id="axis-y-head" data-role="axis-head" data-axis="y" points="161.98,34.86 158.38,43.86 165.58,43.86" fill="#444" stroke="none"/></g><g data-layer="25"><path id="curve-pos" data-role="curve" data-curve="HYPERBOLA" data-branch="POS" d="M288.63 208 L288.58 207.95 L287.92 207.3 L287.26 206.66 L286.6 206.01 L285.95 205.37 L285.31 204.74 L284.66 204.1 L284.03 203.47 L283.4 202.84 L282.77 202.22 L282.15 201.6 L281.53 200.98 L280.92 200.37 L280.31 199.76 L279.71 199.15 L279.11 198.55 L278.52 197.94 L277.93 197.35 L277.35 196.75 L276.77 196.16 L276.19 195.57 L275.62 194.98 L275.05 194.4 L274.49 193.82 L273.94 193.24 L273.38 192.66 L272.84 192.09 L272.29 191.52 L271.75 190.95 L271.22 190.39 L270.69 189.83