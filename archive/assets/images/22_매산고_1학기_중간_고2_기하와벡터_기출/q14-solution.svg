<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">∠CBA=∠DCB이므로 사다리꼴은 이등변이고 밑변의 길이 차 8−4=4에서 한쪽 수평 차는 2이다. P를 BC의 중점이라 하면 AB+AC=2AP이므로 AP=2√5이다. 높이 h에서 2²+h²=(2√5)²이므로 h=4이다. 그림은 B(0, 0), C(8, 0), A(2, 4), D(6, 4)로 BD의 수평 성분 6, 높이 4이므로 BD=√(36+16)=2√13이다. 따라서 답은 ④이다.</title><desc id="visual-desc">아래 변 BC가 위 변 AD보다 긴 이등변 사다리꼴 ABCD가 있다. BC의 중점 P에서 A로 가는 점선 AP와 대각선 BD(점선)가 있고 길이가 표시되어 있다.</desc><rect width="640" height="420" fill="#fff"/><g data-layer="30"><line id="AB" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="191.428571429" y1="81.428571429" x2="62.857142857" y2="338.571428571"/></g><g data-layer="30"><line id="BC" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="62.857142857" y1="338.571428571" x2="577.142857143" y2="338.571428571"/></g><g data-layer="30"><line id="CD" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="577.142857143" y1="338.571428571" x2="448.571428571" y2="81.428571429"/></g><g data-layer="30"><line id="DA" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="448.571428571" y1="81.428571429" x2="191.428571429" y2="81.428571429"/></g><g data-layer="30"><line id="AP" data-role="line" stroke="#111" stroke-width="1.6" fill="none" stroke-dasharray="6 4" x1="191.428571429" y