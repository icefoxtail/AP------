<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 410" role="img" aria-labelledby="title desc">
  <title id="title">삼각형 ABC와 BC의 중점 P</title>
  <desc id="desc">B에서 직각이고 C에서 30도인 삼각형. AB의 길이는 4이며 P는 BC의 중점이다.</desc>
  <rect width="720" height="410" rx="14" fill="#fff"/>
  <g fill="none" stroke="#253449" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M135 330 L135 70 L585 330 Z"/>
    <path d="M135 305 L160 305 L160 330" stroke="#6b7280" stroke-width="2"/>
    <path d="M523 330 A62 62 0 0 1 531.3 299" stroke="#2878b8" stroke-width="2.5"/>
    <path d="M360 330 L360 338" stroke="#e08a2e" stroke-width="4"/>
  </g>
  <g fill="#253449" font-family="Arial, sans-serif" font-size="22">
    <text x="104" y="60">A(0,4)</text>
    <text x="102" y="360">B(0,0)</text>
    <text x="590" y="338">C(4√3,0)</text>
    <text x="365" y="360" fill="#b05c13">P</text>
    <text x="146" y="206">AB = 4</text>
    <text x="508" y="305" fill="#2878b8">30°</text>
    <text x="221" y="379" fill="#b05c13">BP = PC = 2√3</text>
  </g>
  <g fill="#253449">
    <circle cx="135" cy="330" r="4"/><circle cx="135" cy="70" r="4"/>
    <circle cx="585" cy="330" r="4"/><circle cx="360" cy="330" r="4"/>
  </g>
</svg>
