<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520" width="640" height="520" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">B를 원점으로 C(6, 0), D(6, 8), A(0, 8)로 놓으면 Q(6, 8/5)이고 a=CD−BQ=(−6, 32/5)이므로 |a|=2√481/5이다. CD를 지름으로 하는 원의 중심은 O(6, 4), 반지름은 4이고 BO=2√13이므로 |b|=|BP|의 최댓값은 BO+4=2√13+4이다(그림의 P는 원 위의 한 예). a+b=QD+CP이고 CP는 중심 (0, 4), 반지름 4인 원 위에 있으므로 |a+b|의 최댓값은 32/5+4+4=72/5이다. 따라서 답은 (1) 2√481/5, (2) 2√13+4, (3) 72/5이다.</title><desc id="visual-desc">직사각형 ABCD와 변 CD를 지름으로 하는 원이 있다. B에서 변 CD 위의 점 Q와 원 위의 점 P로 가는 점선이 있고 변의 길이 6과 8이 표시되어 있다.</desc><rect width="640" height="520" fill="#fff"/><g data-layer="30"><line id="AB" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="114.533813001" y1="86.433114818" x2="114.533813001" y2="433.566885182"/></g><g data-layer="30"><line id="BC" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="114.533813001" y1="433.566885182" x2="374.884140774" y2="433.566885182"/></g><g data-layer="30"><line id="CD" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="374.884140774" y1="433.566885182" x2="374.884140774" y2="86.433114818"/></g><g data-layer="30"><line id="DA" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="374.884140774" y1="86.433114818" x2="114.533813001" y2="86.433114818"/></g><g data-layer="30"><line id="BQ" data-role="line" stro