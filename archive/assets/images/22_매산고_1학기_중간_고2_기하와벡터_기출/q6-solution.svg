<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 328 368" width="328" height="368" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-ellipse-figure="ellipse-figure-v1" data-conic="PARABOLA" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="6" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round"><title id="visual-title">p=−1일 때의 그림이다. 준선 x=−p=u 위에서 P=(−ut², −2ut), F=(−u, 0)이고 HI=2u|t|=4, PH=u(1+t²)=5이다. u|t|=2를 대입하면 u+4/u=5이므로 u=1 또는 4이고, P가 F보다 왼쪽이어야 하므로 t²&gt;1에서 u=1이다. 그러므로 p=−1이고 F의 x좌표는 −1이다. 따라서 답은 ②이다.</title><desc id="visual-desc">왼쪽으로 열린 포물선과 초점 F, 오른쪽의 준선이 있다. 곡선 위의 점 P에서 준선으로 내린 수선의 발 H, 준선과 x축이 만나는 점 I가 있고 PH=5, HI=4가 표시되어 있다.</desc><rect width="328" height="368" fill="#fff"/><g data-layer="10"><line id="axis-x" data-role="axis" data-axis="x" x1="34" y1="224" x2="294" y2="224" fill="none" stroke="#444" stroke-width="1.1"/></g><g data-layer="10"><line id="axis-y" data-role="axis" data-axis="y" x1="224" y1="334" x2="224" y2="34" fill="none" stroke="#444" stroke-width="1.1"/></g><g data-layer="11"><polygon id="axis-x-head" data-role="axis-head" data-axis="x" points="294,224 285,220.4 285,227.6" fill="#444" stroke="none"/></g><g data-layer="11"><polygon id="axis-y-head" data-role="axis-head" data-axis="y" points="224,34 220.4,43 227.6,43" fill="#444" stroke="none"/></g><g data-layer="25"><path id="curve" data-role="curve" data-curve="PARABOLA" d="M148.38 334 L149.4 333.25 L151.02 332.06 L152.61 330.88 L154.19 329.69 L155.75 328.5 L157.29 327.31 L158.82 326.13 L160.32 324.94 L161.81 323.75 L163.28 322.56 L164.74 321.38 L166.17 320.19 L167.59 319 L169 317.81 L170.38 316.63 L171.74 315.44 L173.09 314.25 L174.42 313.06 L175.74 311.88 L177.03 310.69 L178.31 309.5 L179.57 308.31 L180.81 307.13 L182.04 305.94 L183.25 304.75 L184.44 303.56 L185.61 302.38 L186.76 301.19 L187.9 300 L189.02 298.81 L190.12 297.63 L191.21 296.44 L192.27 295.25 L193.32 294.06 L194.35 292.88 L