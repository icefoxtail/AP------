<svg xmlns="http://www.w3.org/2000/svg" width="800" height="460" viewBox="0 0 800 460"><rect width="800" height="460" fill="white"/><style>text{font-family:Noto Sans CJK KR,sans-serif;font-size:17px;fill:#182537}.edge{stroke:#223047;stroke-width:3;fill:none}.aux{stroke:#2563eb;stroke-width:2;stroke-dasharray:7 5;fill:none}.dot{fill:#0f172a}</style><text x="25" y="28">AB=AD ⇒ OA는 BD의 수직이등분선 방향</text><circle cx="360" cy="230" r="150" fill="none" stroke="#64748b" stroke-width="2"/><path class="edge" d="M510.0,230.0 L450.0,350.0 L392.8125,83.63285941253756 L450.0,110.0 Z"/><line class="aux" x1="360" y1="230" x2="510.0" y2="230.0"/><line class="aux" x1="450.0" y1="350.0" x2="450.0" y2="110.0"/><line class="aux" x1="510.0" y1="230.0" x2="392.8125" y2="83.63285941253756"/><circle class="dot" cx="510.0" cy="230.0" r="4"/><text x="522.0" y="230.0">A</text><circle class="dot" cx="450.0" cy="350.0" r="4"/><text x="426.0" y="370.0">B</text><circle class="dot" cx="392.8125" cy="83.63285941253756" r="4"/><text x="384.8125" y="68.63285941253756">C</text><circle class="dot" cx="450.0" cy="110.0" r="4"/><text x="462.0" y="98.0">D</text><circle class="dot" cx="360" cy="230" r="4"/><text x="343" y="249">O</text><text x="555" y="130">AC = 10</text><text x="555" y="166">AC² = 2R(R − x_C)</text><text x="555" y="202">[ABCD] = BD(R − x_C)/2</text><text x="555" y="238">BD/R = 8/5</text><text x="30" y="440">보조 그림: R=8을 택한 동일 관계의 예시. 길이 비 결론은 모든 허용 R에 성립.</text></svg>