<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 520" width="560" height="520" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">지름 AB를 가진 반원 O에 세 선분 AC, BD, CD가 접하는 그림이다. 선분 AC의 길이는 3, 선분 BD의 길이는 12로 주어져 있다.</title><desc id="visual-desc">반원의 지름 AB가 가로로 놓여 있고, 양 끝 A, B에서 위로 세운 선분 AC와 BD가 반원에 접하며, 두 선분의 위쪽 끝 C, D를 잇는 선분 CD도 반원에 접한다. A와 B에 직각 표시가 있고 AC 옆에 3, BD 옆에 12가 적혀 있다.</desc><rect width="560" height="520" fill="#fff"/><g data-layer="30"><line id="AB" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="76.428571429" y1="463.571428571" x2="483.571428571" y2="463.571428571"/></g><g data-layer="30"><line id="AC" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="76.428571429" y1="463.571428571" x2="76.428571429" y2="361.785714286"/></g><g data-layer="30"><line id="BD" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="483.571428571" y1="463.571428571" x2="483.571428571" y2="56.428571429"/></g><g data-layer="30"><line id="CD" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="76.428571429" y1="361.785714286" x2="483.571428571" y2="56.428571429"/></g><g data-layer="46"><polyline id="arcAB" data-role="circularArc" stroke="#111" stroke-width="3.2" fill="none" data-owner-points="A B" data-center-point="O" data-owner-radius="6.0" data-sweep="CW" data-mark="arc" data-mark-id="arcA