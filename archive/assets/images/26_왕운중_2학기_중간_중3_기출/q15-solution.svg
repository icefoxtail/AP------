<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 320" role="img" aria-labelledby="svg-title-a0233f7b66" aria-describedby="svg-desc-a0233f7b66"><title id="svg-title-a0233f7b66">직각삼각형의 중점과 넓이 이등분</title><desc id="svg-desc-a0233f7b66">sin∠AOB=3/5, OB=10에서 직각삼각형 OAB의 변은 OA=8, AB=6이다. OB가 △OAC의 넓이를 이등분하므로 B는 AC의 중점이고 C=2B−A이다.</desc><style>text{font-family:Arial,sans-serif;font-size:15px}.s{fill:none;stroke:#111;stroke-width:2}.d{fill:none;stroke:#666;stroke-width:1.5;stroke-dasharray:5 4}</style><line class="s" x1="50" y1="180" x2="390" y2="180"/><line class="s" x1="80" y1="180" x2="208" y2="84"/><line class="s" x1="208" y1="84" x2="352" y2="276"/><line class="s" x1="80" y1="180" x2="280" y2="180"/><circle cx="280" cy="180" r="3"/><text x="63" y="198">O</text><text x="202" y="75">A</text><text x="274" y="171">B</text><text x="357" y="286">C</text><text x="125" y="118">OA=8</text><text x="242" y="118">AB=6</text><text x="164" y="201">OB=10</text><text x="222" y="220">B는 AC의 중점이다.</text><text x="45" y="40">A=(32/5,24/5), C=2B-A</text></svg>