<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 749 518" width="749" height="518" role="img" aria-labelledby="title desc"><title id="title">원기둥과 원뿔의 반지름과 높이</title><desc id="desc">왼쪽 원기둥의 밑면 반지름은 3ab이고 높이는 6ab이다. 오른쪽 원뿔의 밑면 반지름은 b/a이고 높이는 18a⁵b다.</desc><rect width="749" height="518" fill="white" /><ellipse cx="181" cy="139" rx="117" ry="31" fill="none" stroke="#21639a" stroke-width="4.7" /><path d="M 64 341 A 117 31 0 0 1 298 341" fill="none" stroke="#21639a" stroke-width="2.65" stroke-dasharray="7 5" /><path d="M 64 341 A 117 31 0 0 0 298 341" fill="none" stroke="#21639a" stroke-width="4.8" /><line x1="64.0000" y1="139.0000" x2="64.0000" y2="341.0000" stroke="#21639a" stroke-width="4.8" stroke-linecap="round" /><line x1="298.0000" y1="139.0000" x2="298.0000" y2="341.0000" stroke="#21639a" stroke-width="4.8" stroke-linecap="round" /><line x1="181.0000" y1="341.0000" x2="298.0000" y2="341.0000" stroke="#21639a" stroke-width="4.7" stroke-linecap="round" /><circle cx="181" cy="341" r="5" fill="#293b4b" /><line x1="326.0000" y1="139.0000" x2="326.0000" y2="341.0000" stroke="#21639a" stroke-width="1.9" stroke-linecap="round" /><line x1="320.0000" y1="139.0000" x2="332.0000" y2="139.0000" stroke="#21639a" stroke-width="1.9" stroke-linecap="round" /><line x1="320.0000" y1="341.0000" x2="332.0000" y2="341.0000" stroke="#21639a" stroke-width="1.9" stroke-linecap="round" /><text x="365.0000" y="246.0000" font-size="34" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#21639a" text-anchor="middle">6ab</text><line x1="181.0000" y1="405.0000" x2="298.0000" y2="405.0000" stroke="#21639a" stroke-width="1.85" stroke-linecap="round" /><line x1="181.0000" y1="399.0000" x2="181.0000" y2="411.0000" stroke="#21639a" stroke-width="2" stroke-linecap="round" /><line x1="298.0000" y1="399.0000" x2="298.0000" y2="411.0000" stroke="#21639a" stroke-width="2" stroke-linecap="round" /><text x="239.5000" y="441.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#21639a" text-anchor="middle">3ab</text><line x1="548.0000" y1="77.0000" x2="468.0000" y2="341.0000" stroke="#227365" stroke-width="4.65" stroke-linecap="round" /><line x1="548.0000" y1="77.0000" x2="628.0000" y2="341.0000" stroke="#227365" stroke-width="4.65" stroke-linecap="round" /><path d="M 468 341 A 80 23 0 0 1 628 341" fill="none" stroke="#227365" stroke-width="2.65" stroke-dasharray="7 5" /><path d="M 468 341 A 80 23 0 0 0 628 341" fill="none" stroke="#227365" stroke-width="4.8" /><line x1="548.0000" y1="77.0000" x2="548.0000" y2="341.0000" stroke="#774698" stroke-width="3.9" stroke-linecap="round" stroke-dasharray="9 6" /><line x1="548.0000" y1="341.0000" x2="628.0000" y2="341.0000" stroke="#227365" stroke-width="4.7" stroke-linecap="round" /><circle cx="548" cy="341" r="5" fill="#293b4b" /><text x="654.0000" y="179.0000" font-size="34" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#774698" text-anchor="middle">18a⁵b</text><line x1="587.0000" y1="171.0000" x2="553.0000" y2="171.0000" stroke="#774698" stroke-width="1.6" stroke-linecap="round" /><line x1="548.0000" y1="405.0000" x2="628.0000" y2="405.0000" stroke="#227365" stroke-width="1.85" stroke-linecap="round" /><line x1="548.0000" y1="399.0000" x2="548.0000" y2="411.0000" stroke="#227365" stroke-width="1.85" stroke-linecap="round" /><line x1="628.0000" y1="399.0000" x2="628.0000" y2="411.0000" stroke="#227365" stroke-width="1.85" stroke-linecap="round" /><text x="588.0000" y="446.0000" font-size="31" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#227365" text-anchor="middle">b</text><line x1="575.0000" y1="455.0000" x2="601.0000" y2="455.0000" stroke="#227365" stroke-width="1.8" stroke-linecap="round" /><text x="588.0000" y="484.0000" font-size="31" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#227365" text-anchor="middle">a</text></svg>
