<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 440" width="520" height="440" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">같은 색으로 넓이가 같은 두 영역을, 다른 색으로 통로를 구분한 개략도이며 길이 비율을 나타내지 않는다.</title><desc id="visual-desc">중심 O를 꼭짓점으로 하는 반지름 10의 부채꼴 개략도이다. OA 위 점은 O–C–D–A, OB 위 점은 O–E–F–B 순이며 호 CE, DF, AB가 보인다. 안쪽 부채꼴 OCE와 바깥 띠 DFBA는 같은 옅은 색, 통로 CEFD는 다른 색으로 구분한다. 길이 비율은 나타내지 않는다.</desc><rect width="520" height="440" fill="#fff"/><g data-layer="10"><path id="innerEqual" data-role="region" stroke="none" stroke-width="1.6" fill="#e4e7ec" data-owner-points="C E O" data-mark="region" data-mark-id="innerEqual" fill-rule="evenodd" d="M69.335541175 385.120264941 L221.867108235 385.120264941 A152.53156706 152.53156706 0 0 0 145.601324705 253.024052988 L69.335541175 385.120264941 Z"/></g><g data-layer="10"><path id="outerEqual" data-role="region" stroke="none" stroke-width="1.6" fill="#e4e7ec" data-owner-points="A B D F O" data-mark="region" data-mark-id="outerEqual" fill-rule="evenodd" d="M69.335541175 385.120264941 L450.664458825 385.120264941 A381.328917649 381.328917649 0 0 0 260 54.879735059 L69.335541175 385.120264941 Z M69.335541175 385.120264941 L336.26578353 385.120264941 A266.930242355 266.930242355 0 0 0 202.800662353 153.951894024 L69.335541175 385.120264941 Z"/></g><g data-layer="10"><path id="passage" data-role="region" stroke="non