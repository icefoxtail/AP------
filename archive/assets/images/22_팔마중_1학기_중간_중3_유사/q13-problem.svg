<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 420" width="460" height="420" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">한 변의 길이가 a인 정사각형을 가로, 세로로 나누어 한 변이 a-b인 정사각형과 변의 길이가 b인 직사각형들로 이루어진 그림이고, 한 변이 a-b인 정사각형이 색칠되어 있다.</title><desc id="visual-desc">큰 정사각형의 아래쪽 변에 a와 b가 치수선으로 표시되어 있다. 정사각형 안이 세로선 하나와 가로선 하나로 네 부분으로 나뉘고, 왼쪽 아래의 정사각형이 옅게 색칠되어 있으며 그 위쪽 변에 a-b가 적혀 있다.</desc><rect width="460" height="420" fill="#fff"/><g data-layer="10"><path id="sqShade" data-role="region" stroke="none" stroke-width="1.6" fill="#e4e7ec" data-owner-points="A0 B0 B2 B4" data-mark="region" data-mark-id="sqShade" fill-rule="evenodd" d="M103.090905041 301.047281312 L261.72727374 301.047281312 L261.72727374 142.410912614 L103.090905041 142.410912614 L103.090905041 301.047281312 Z"/></g><g data-layer="30"><line id="sA0A1" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="103.090905041" y1="301.047281312" x2="356.909094959" y2="301.047281312"/></g><g data-layer="30"><line id="sA1A2" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="356.909094959" y1="301.047281312" x2="356.909094959" y2="47.229091395"/></g><g data-layer="30"><line id="sA2A3" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="356.909094959" y1="47.229091395" x2="103.090905041" y2="47.229091395"/></g><g data-layer="30"><line id="sA3A0" data-