<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 260" width="420" height="260" role="img" aria-labelledby="title desc"><title id="title">q13 무게중심과 넓이비</title><desc id="desc">DE는 중점연결선, G는 무게중심. AM 위에서 N과 G의 위치를 비교한다.</desc><g fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polygon points="210,35 65,225 355,225"/><line x1="65" y1="225" x2="282.5" y2="130"/><line x1="355" y1="225" x2="137.5" y2="130"/><line x1="282.5" y1="130" x2="137.5" y2="130"/><line x1="210" y1="35" x2="210" y2="225" stroke-dasharray="6 6"/><text x="210" y="25" fill="currentColor" stroke="none" font-size="17" text-anchor="middle" font-family="sans-serif">A</text><text x="55" y="243" fill="currentColor" stroke="none" font-size="17" text-anchor="middle" font-family="sans-serif">B</text><text x="365" y="243" fill="currentColor" stroke="none" font-size="17" text-anchor="middle" font-family="sans-serif">C</text><text x="292" y="125" fill="currentColor" stroke="none" font-size="17" text-anchor="middle" font-family="sans-serif">D</text><text x="127" y="125" fill="currentColor" stroke="none" font-size="17" text-anchor="middle" font-family="sans-serif">E</text><text x="210" y="245" fill="currentColor" stroke="none" font-size="17" text-anchor="middle" font-family="sans-serif">M</text><text x="223" y="167" fill="currentColor" stroke="none" font-size="17" text-anchor="middle" font-family="sans-serif">G</text><text x="197" y="125" fill="currentColor" stroke="none" font-size="17" text-anchor="middle" font-family="sans-serif">N</text><text x="320" y="115" fill="currentColor" stroke="none" font-size="17" text-anchor="middle" font-family="sans-serif">DE ∥ BC</text><text x="80" y="145" fill="currentColor" stroke="none" font-size="17" text-anchor="middle" font-family="sans-serif">AN=AM/2</text><text x="330" y="175" fill="currentColor" stroke="none" font-size="17" text-anchor="middle" font-family="sans-serif">AG=2AM/3</text><text x="210" y="255" fill="currentColor" stroke="none" font-size="15" text-anchor="middle" font-family="sans-serif">GN=AM/6 → 넓이비 3:1</text></g></svg>
