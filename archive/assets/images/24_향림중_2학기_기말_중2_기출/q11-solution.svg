<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 260" width="420" height="260" role="img" aria-labelledby="title desc"><title id="title">q11 사다리꼴 대각선 교점과 넓이</title><desc id="desc">AB∥DC에서 △ABE∽△CDE, BE:DE=3:4. 같은 높이의 △ABE와 △ADE도 넓이비 3:4.</desc><g fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polygon points="100,70 220,70 240,210 80,210"/><line x1="100" y1="70" x2="240" y2="210"/><line x1="220" y1="70" x2="80" y2="210"/><text x="92" y="62" fill="currentColor" stroke="none" font-size="17" text-anchor="middle" font-family="sans-serif">A</text><text x="228" y="62" fill="currentColor" stroke="none" font-size="17" text-anchor="middle" font-family="sans-serif">B</text><text x="248" y="228" fill="currentColor" stroke="none" font-size="17" text-anchor="middle" font-family="sans-serif">C</text><text x="72" y="228" fill="currentColor" stroke="none" font-size="17" text-anchor="middle" font-family="sans-serif">D</text><text x="160" y="120" fill="currentColor" stroke="none" font-size="17" text-anchor="middle" font-family="sans-serif">E</text><text x="160" y="55" fill="currentColor" stroke="none" font-size="17" text-anchor="middle" font-family="sans-serif">AB=6</text><text x="160" y="235" fill="currentColor" stroke="none" font-size="17" text-anchor="middle" font-family="sans-serif">DC=8</text><text x="115" y="120" fill="currentColor" stroke="none" font-size="17" text-anchor="middle" font-family="sans-serif">[ABE]=12</text><text x="120" y="175" fill="currentColor" stroke="none" font-size="17" text-anchor="middle" font-family="sans-serif">[ADE]=16</text><text x="300" y="130" fill="currentColor" stroke="none" font-size="17" text-anchor="middle" font-family="sans-serif">BE:DE=3:4</text></g></svg>
