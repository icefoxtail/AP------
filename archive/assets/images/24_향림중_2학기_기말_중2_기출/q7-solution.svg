<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 260" width="420" height="260" role="img" aria-labelledby="title desc"><title id="title">q7 정사각형·합동·닮음</title><desc id="desc">F-B-C-E가 일직선이고 AD∥FE. 합동으로 FE와 DF를 구한 뒤 △ADG∽△EFG.</desc><g fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polygon points="120,90 240,90 240,210 120,210"/><line x1="80" y1="210" x2="280" y2="210"/><line x1="120" y1="90" x2="280" y2="210"/><line x1="240" y1="90" x2="80" y2="210"/><text x="120" y="78" fill="currentColor" stroke="none" font-size="17" text-anchor="middle" font-family="sans-serif">A</text><text x="120" y="232" fill="currentColor" stroke="none" font-size="17" text-anchor="middle" font-family="sans-serif">B</text><text x="240" y="232" fill="currentColor" stroke="none" font-size="17" text-anchor="middle" font-family="sans-serif">C</text><text x="240" y="78" fill="currentColor" stroke="none" font-size="17" text-anchor="middle" font-family="sans-serif">D</text><text x="290" y="232" fill="currentColor" stroke="none" font-size="17" text-anchor="middle" font-family="sans-serif">E</text><text x="70" y="232" fill="currentColor" stroke="none" font-size="17" text-anchor="middle" font-family="sans-serif">F</text><text x="180" y="125" fill="currentColor" stroke="none" font-size="17" text-anchor="middle" font-family="sans-serif">G</text><text x="180" y="80" fill="currentColor" stroke="none" font-size="17" text-anchor="middle" font-family="sans-serif">AD=6</text><text x="260" y="232" fill="currentColor" stroke="none" font-size="15" text-anchor="middle" font-family="sans-serif">CE=2</text><text x="100" y="232" fill="currentColor" stroke="none" font-size="15" text-anchor="middle" font-family="sans-serif">BF=2</text><text x="180" y="255" fill="currentColor" stroke="none" font-size="14" text-anchor="middle" font-family="sans-serif">FE=10, DF=10, DG:GF=3:5 → DG=15/4</text></g></svg>
