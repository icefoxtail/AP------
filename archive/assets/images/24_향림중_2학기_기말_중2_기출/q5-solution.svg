<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 260" width="420" height="260" role="img" aria-labelledby="title desc"><title id="title">q5 닮은 도형의 넓이비</title><desc id="desc">AB=10, EF=5이므로 닮음비 2:1, 넓이비 4:1.</desc><g fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polygon points="55,70 205,60 235,170 75,190"/><polygon points="285,90 360,85 375,140 295,150"/><text x="55" y="56" fill="currentColor" stroke="none" font-size="17" text-anchor="middle" font-family="sans-serif">A</text><text x="205" y="46" fill="currentColor" stroke="none" font-size="17" text-anchor="middle" font-family="sans-serif">B</text><text x="235" y="190" fill="currentColor" stroke="none" font-size="17" text-anchor="middle" font-family="sans-serif">C</text><text x="75" y="210" fill="currentColor" stroke="none" font-size="17" text-anchor="middle" font-family="sans-serif">D</text><text x="285" y="76" fill="currentColor" stroke="none" font-size="17" text-anchor="middle" font-family="sans-serif">E</text><text x="360" y="71" fill="currentColor" stroke="none" font-size="17" text-anchor="middle" font-family="sans-serif">F</text><text x="375" y="160" fill="currentColor" stroke="none" font-size="17" text-anchor="middle" font-family="sans-serif">G</text><text x="295" y="170" fill="currentColor" stroke="none" font-size="17" text-anchor="middle" font-family="sans-serif">H</text><text x="130" y="45" fill="currentColor" stroke="none" font-size="17" text-anchor="middle" font-family="sans-serif">AB=10</text><text x="325" y="72" fill="currentColor" stroke="none" font-size="17" text-anchor="middle" font-family="sans-serif">EF=5</text><text x="145" y="225" fill="currentColor" stroke="none" font-size="17" text-anchor="middle" font-family="sans-serif">넓이 100</text><text x="330" y="185" fill="currentColor" stroke="none" font-size="17" text-anchor="middle" font-family="sans-serif">넓이 25</text><text x="210" y="248" fill="currentColor" stroke="none" font-size="17" tex