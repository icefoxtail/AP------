<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 260" width="420" height="260" role="img" aria-labelledby="title desc"><title id="title">q10 평행선과 중점 연결</title><desc id="desc">AB를 5,5,5로 나눈 D,E에서 평행선을 긋고 CD와 EG의 교점을 H로 둔다.</desc><g fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polygon points="210,35 65,235 365,235"/><line x1="161.67" y1="101.67" x2="261.67" y2="101.67"/><line x1="113.33" y1="168.33" x2="313.33" y2="168.33"/><line x1="365" y1="235" x2="161.67" y2="101.67"/><text x="210" y="25" fill="currentColor" stroke="none" font-size="17" text-anchor="middle" font-family="sans-serif">A</text><text x="55" y="253" fill="currentColor" stroke="none" font-size="17" text-anchor="middle" font-family="sans-serif">B</text><text x="375" y="253" fill="currentColor" stroke="none" font-size="17" text-anchor="middle" font-family="sans-serif">C</text><text x="148" y="97" fill="currentColor" stroke="none" font-size="17" text-anchor="middle" font-family="sans-serif">D</text><text x="99" y="174" fill="currentColor" stroke="none" font-size="17" text-anchor="middle" font-family="sans-serif">E</text><text x="274" y="97" fill="currentColor" stroke="none" font-size="17" text-anchor="middle" font-family="sans-serif">F</text><text x="325" y="174" fill="currentColor" stroke="none" font-size="17" text-anchor="middle" font-family="sans-serif">G</text><text x="263" y="158" fill="currentColor" stroke="none" font-size="17" text-anchor="middle" font-family="sans-serif">H</text><text x="125" y="65" fill="currentColor" stroke="none" font-size="17" text-anchor="middle" font-family="sans-serif">AD=5</text><text x="103" y="135" fill="currentColor" stroke="none" font-size="17" text-anchor="middle" font-family="sans-serif">DE=5</text><text x="80" y="205" fill="currentColor" stroke="none" font-size="17" text-anchor="middle" font-family="sans-serif">EB=5</text><text x="215" y="248" fill="currentColor" stroke="none" font-size="17" text-anchor="middle" font-family="sans-serif">BC=18</text><text x="290" y="92" fill="currentColor" stroke="none" font-size="17" text-anchor="middle" font-family="sans-serif">DF ∥ EG ∥ BC</text><text x="280" y="190" fill="currentColor" stroke="none" font-size="17" text-anchor="middle" font-family="sans-serif">EG=12, EH=9 → GH=3</text></g></svg>
