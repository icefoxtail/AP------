<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 260" width="420" height="260" role="img" aria-labelledby="title desc"><title id="title">q2 평행선과 넓이비</title><desc id="desc">B,A,D가 한 직선, B,C,E가 한 직선이고 AC∥DE. 넓이비로 BA:BD=8:13.</desc><g fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="45" y1="225" x2="355" y2="225"/><line x1="45" y1="225" x2="335" y2="45"/><line x1="235.77" y1="225" x2="223.46" y2="114.23"/><line x1="355" y1="225" x2="335" y2="45"/><text x="236" y="245" fill="currentColor" stroke="none" font-size="17" text-anchor="middle" font-family="sans-serif">A</text><text x="35" y="245" fill="currentColor" stroke="none" font-size="17" text-anchor="middle" font-family="sans-serif">B</text><text x="211" y="105" fill="currentColor" stroke="none" font-size="17" text-anchor="middle" font-family="sans-serif">C</text><text x="365" y="245" fill="currentColor" stroke="none" font-size="17" text-anchor="middle" font-family="sans-serif">D</text><text x="335" y="33" fill="currentColor" stroke="none" font-size="17" text-anchor="middle" font-family="sans-serif">E</text><text x="120" y="155" fill="currentColor" stroke="none" font-size="17" text-anchor="middle" font-family="sans-serif">[ABC]=16</text><text x="280" y="160" fill="currentColor" stroke="none" font-size="17" text-anchor="middle" font-family="sans-serif">[ACD]=10</text><text x="210" y="258" fill="currentColor" stroke="none" font-size="15" text-anchor="middle" font-family="sans-serif">BA:BD=8:13, AC ∥ DE</text></g></svg>
