<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 684 498" width="684" height="498" role="img" aria-labelledby="title desc"><title id="title">마름모의 대각선과 주어진 길이</title><desc id="desc">마름모 ABCD에서 두 대각선은 O에서 만난다. AB는 6 cm이고 AO는 3 cm이다. B에서 AB와 BO가 이루는 각은 30도이다.</desc><rect width="684" height="498" fill="white" /><polygon points="342.0000,100.6210 85.0000,249.0000 342.0000,397.3790 599.0000,249.0000" fill="none" /><line x1="342.0000" y1="100.6210" x2="85.0000" y2="249.0000" stroke="#23649a" stroke-width="4.75" stroke-linecap="round" /><line x1="85.0000" y1="249.0000" x2="342.0000" y2="397.3790" stroke="#23649a" stroke-width="4.75" stroke-linecap="round" /><line x1="342.0000" y1="397.3790" x2="599.0000" y2="249.0000" stroke="#23649a" stroke-width="4.75" stroke-linecap="round" /><line x1="599.0000" y1="249.0000" x2="342.0000" y2="100.6210" stroke="#23649a" stroke-width="4.75" stroke-linecap="round" /><line x1="342.0000" y1="100.6210" x2="342.0000" y2="397.3790" stroke="#217060" stroke-width="4.3" stroke-linecap="round" /><line x1="85.0000" y1="249.0000" x2="599.0000" y2="249.0000" stroke="#754596" stroke-width="4.3" stroke-linecap="round" /><line x1="69.5000" y1="222.1532" x2="326.5000" y2="73.7742" stroke="#23649a" stroke-width="1.7" stroke-linecap="round" /><line x1="66.7500" y1="217.3901" x2="72.2500" y2="226.9164" stroke="#23649a" stroke-width="1.7" stroke-linecap="round" /><line x1="323.7500" y1="69.0111" x2="329.2500" y2="78.5373" stroke="#23649a" stroke-width="1.7" stroke-linecap="round" /><text x="186.0000" y="135.1791" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#23649a" text-anchor="middle">6 cm</text><line x1="342.0000" y1="174.8105" x2="361.0000" y2="176.8105" stroke="#217060" stroke-width="1.65" stroke-linecap="round" /><text x="399.0000" y="181.8105" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#217060" text-anchor="middle">3 cm</text><path d="M 136.0955 219.50