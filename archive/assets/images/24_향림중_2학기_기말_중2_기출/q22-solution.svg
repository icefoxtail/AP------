<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 275" width="420" height="275" role="img" aria-labelledby="title desc"><title id="title">q22 사다리꼴 대각선 교점과 평행선</title><desc id="desc">AB∥EF∥DC. E는 대각선의 교점, F는 BC 위. 두 닮음으로 x,y를 구한다.</desc><g fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polygon points="100,70 300,70 355,220 55,220"/><line x1="100" y1="70" x2="355" y2="220"/><line x1="300" y1="70" x2="55" y2="220"/><line x1="202" y1="130" x2="322" y2="130"/><text x="100" y="60" fill="currentColor" stroke="none" font-size="17" text-anchor="middle" font-family="sans-serif">A</text><text x="300" y="60" fill="currentColor" stroke="none" font-size="17" text-anchor="middle" font-family="sans-serif">B</text><text x="363" y="238" fill="currentColor" stroke="none" font-size="17" text-anchor="middle" font-family="sans-serif">C</text><text x="47" y="238" fill="currentColor" stroke="none" font-size="17" text-anchor="middle" font-family="sans-serif">D</text><text x="192" y="122" fill="currentColor" stroke="none" font-size="17" text-anchor="middle" font-family="sans-serif">E</text><text x="334" y="134" fill="currentColor" stroke="none" font-size="17" text-anchor="middle" font-family="sans-serif">F</text><text x="200" y="55" fill="currentColor" stroke="none" font-size="17" text-anchor="middle" font-family="sans-serif">AB=20</text><text x="263" y="120" fill="currentColor" stroke="none" font-size="17" text-anchor="middle" font-family="sans-serif">EF=12</text><text x="315" y="95" fill="currentColor" stroke="none" font-size="17" text-anchor="middle" font-family="sans-serif">BF=10</text><text x="342" y="180" fill="currentColor" stroke="none" font-size="17" text-anchor="middle" font-family="sans-serif">FC=x</text><text x="205" y="242" fill="currentColor" stroke="none" font-size="17" text-anchor="middle" font-family="sans-serif">DC=y</text><text x="90" y="242" fill="currentColor" stroke="none" font-size="17" text-anchor="middle" font-family="sans-serif">AB ∥ EF ∥ DC</text><text x="210" y="260" fill="currentColor" stroke="none" font-size="14" text-anchor="middle" font-family="sans-serif">x/(x+10)=12/20 → x=15; 12/y=10/25 → y=30</text></g></svg>
