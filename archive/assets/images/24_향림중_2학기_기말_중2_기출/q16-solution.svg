<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 260" width="420" height="260" role="img" aria-labelledby="title desc"><title id="title">q16 길의 경우의 수</title><desc id="desc">A에서 C로 직접 가는 길 3개와 B를 거치는 길 2×2개를 합한다.</desc><g fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><circle cx="55" cy="130" r="5" fill="currentColor" stroke="none"/><circle cx="210" cy="130" r="5" fill="currentColor" stroke="none"/><circle cx="365" cy="130" r="5" fill="currentColor" stroke="none"/><text x="55" y="114" fill="currentColor" stroke="none" font-size="17" text-anchor="middle" font-family="sans-serif">A</text><text x="210" y="114" fill="currentColor" stroke="none" font-size="17" text-anchor="middle" font-family="sans-serif">B</text><text x="365" y="114" fill="currentColor" stroke="none" font-size="17" text-anchor="middle" font-family="sans-serif">C</text><path d="M 55 130 Q 132 70 210 130"/><path d="M 55 130 Q 132 190 210 130"/><path d="M 210 130 Q 288 70 365 130"/><path d="M 210 130 Q 288 190 365 130"/><path d="M 55 130 Q 210 25 365 130"/><path d="M 55 130 Q 210 235 365 130"/><path d="M 55 130 L 365 130"/><text x="130" y="55" fill="currentColor" stroke="none" font-size="17" text-anchor="middle" font-family="sans-serif">2길</text><text x="290" y="55" fill="currentColor" stroke="none" font-size="17" text-anchor="middle" font-family="sans-serif">2길</text><text x="210" y="20" fill="currentColor" stroke="none" font-size="17" text-anchor="middle" font-family="sans-serif">직접 3길</text><text x="210" y="248" fill="currentColor" stroke="none" font-size="17" text-anchor="middle" font-family="sans-serif">3 + 2×2 = 7</text></g></svg>
