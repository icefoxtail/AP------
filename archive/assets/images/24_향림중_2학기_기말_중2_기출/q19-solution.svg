<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 260" width="420" height="260" role="img" aria-labelledby="title desc"><title id="title">q19 두 원판의 확률</title><desc id="desc">A는 2등분, B는 3등분. 가능한 숫자쌍 6개 중 서로 다른 경우 4개.</desc><g fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><circle cx="120" cy="130" r="70"/><line x1="120" y1="130" x2="120" y2="60"/><line x1="120" y1="130" x2="120" y2="200"/><circle cx="300" cy="130" r="70"/><line x1="300" y1="130" x2="300" y2="60"/><line x1="300" y1="130" x2="360.62" y2="165"/><line x1="300" y1="130" x2="239.38" y2="165"/><text x="92" y="135" fill="currentColor" stroke="none" font-size="22" text-anchor="middle" font-family="sans-serif">1</text><text x="148" y="135" fill="currentColor" stroke="none" font-size="22" text-anchor="middle" font-family="sans-serif">2</text><text x="300" y="95" fill="currentColor" stroke="none" font-size="20" text-anchor="middle" font-family="sans-serif">1</text><text x="332" y="158" fill="currentColor" stroke="none" font-size="20" text-anchor="middle" font-family="sans-serif">2</text><text x="268" y="158" fill="currentColor" stroke="none" font-size="20" text-anchor="middle" font-family="sans-serif">3</text><text x="120" y="230" fill="currentColor" stroke="none" font-size="17" text-anchor="middle" font-family="sans-serif">A: 1,2</text><text x="300" y="230" fill="currentColor" stroke="none" font-size="17" text-anchor="middle" font-family="sans-serif">B: 1,2,3</text><text x="210" y="252" fill="currentColor" stroke="none" font-size="14" text-anchor="middle" font-family="sans-serif">전체 6쌍, 같은 수 2쌍 → 다른 수 4쌍 = 2/3</text></g></svg>
