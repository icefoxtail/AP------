<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 260" width="420" height="260" role="img" aria-labelledby="title desc"><title id="title">q21 직각삼각형의 회전체</title><desc id="desc">5-12-13 직각삼각형을 AC 축 둘레로 회전하면 반지름 5, 높이 12인 원뿔.</desc><g fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polygon points="70,45 70,205 145,205"/><line x1="70" y1="45" x2="145" y2="205"/><text x="62" y="37" fill="currentColor" stroke="none" font-size="17" text-anchor="middle" font-family="sans-serif">A</text><text x="60" y="223" fill="currentColor" stroke="none" font-size="17" text-anchor="middle" font-family="sans-serif">C</text><text x="155" y="223" fill="currentColor" stroke="none" font-size="17" text-anchor="middle" font-family="sans-serif">B</text><text x="105" y="218" fill="currentColor" stroke="none" font-size="17" text-anchor="middle" font-family="sans-serif">BC=5</text><text x="54" y="130" fill="currentColor" stroke="none" font-size="17" text-anchor="end" font-family="sans-serif">AC=12</text><text x="118" y="120" fill="currentColor" stroke="none" font-size="17" text-anchor="middle" font-family="sans-serif">AB=13</text><line x1="300" y1="45" x2="235" y2="205"/><line x1="300" y1="45" x2="365" y2="205"/><ellipse cx="300" cy="205" rx="65" ry="18"/><line x1="300" y1="45" x2="300" y2="205" stroke-dasharray="6 6"/><text x="300" y="30" fill="currentColor" stroke="none" font-size="17" text-anchor="middle" font-family="sans-serif">회전체: 원뿔</text><text x="300" y="125" fill="currentColor" stroke="none" font-size="17" text-anchor="middle" font-family="sans-serif">h=12</text><text x="338" y="205" fill="currentColor" stroke="none" font-size="17" text-anchor="middle" font-family="sans-serif">r=5</text><text x="210" y="248" fill="currentColor" stroke="none" font-size="17" text-anchor="middle" font-family="sans-serif">V=(1/3)π·5²·12 = 100π</text></g></svg>
