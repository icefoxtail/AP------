<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 280" width="420" height="280" role="img" aria-labelledby="title desc">
<title id="title">q8 두 각의 이등분선과 평행선</title>
<desc id="desc">AB=6, AC=12, AD와 BE는 각의 이등분선이고 DE∥AB. 조건의 실제 각과 평행 관계를 좌표로 만족한다.</desc>
<g fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
  <path d="M120.00 60.00 L210.00 60.00 L165.00 234.28425 Z"/>
  <path d="M120.00 60.00 L195.00 118.09475"/>
  <path d="M210.00 60.00 L135.00 118.09475"/>
  <path d="M135.00 118.09475 L195.00 118.09475"/>
</g>
<g fill="currentColor" font-family="Noto Sans CJK KR, sans-serif" font-size="17">
  <text x="110" y="50">A</text><text x="214" y="50">B</text><text x="165" y="256" text-anchor="middle">C</text>
  <text x="205" y="128">D</text><text x="116" y="128">E</text>
  <text x="165" y="48" text-anchor="middle">AB=6</text>
  <text x="87" y="172" text-anchor="middle">AC=12</text>
  <text x="165" y="151" text-anchor="middle">DE ∥ AB</text>
  <text x="210" y="272" text-anchor="middle" font-size="15">BD:DC=1:2, CE:CA=2:3 → BC=12, DC=8</text>
</g>
</svg>