<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 260" width="420" height="260" role="img" aria-labelledby="title desc"><title id="title">q8 두 각의 이등분선과 평행선</title><desc id="desc">AD와 BE가 각의 이등분선이고 DE∥AB. 선분비를 연결해 DC=8.</desc><g fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polygon points="160,60 115,137.94 250,215.88"/><line x1="160" y1="60" x2="160" y2="163.92"/><line x1="115" y1="137.94" x2="190" y2="111.96"/><line x1="160" y1="163.92" x2="190" y2="111.96"/><text x="160" y="48" fill="currentColor" stroke="none" font-size="17" text-anchor="middle" font-family="sans-serif">A</text><text x="103" y="145" fill="currentColor" stroke="none" font-size="17" text-anchor="middle" font-family="sans-serif">B</text><text x="262" y="230" fill="currentColor" stroke="none" font-size="17" text-anchor="middle" font-family="sans-serif">C</text><text x="160" y="185" fill="currentColor" stroke="none" font-size="17" text-anchor="middle" font-family="sans-serif">D</text><text x="202" y="106" fill="currentColor" stroke="none" font-size="17" text-anchor="middle" font-family="sans-serif">E</text><text x="112" y="85" fill="currentColor" stroke="none" font-size="17" text-anchor="middle" font-family="sans-serif">AB=6</text><text x="222" y="128" fill="currentColor" stroke="none" font-size="17" text-anchor="middle" font-family="sans-serif">AC=12</text><text x="205" y="150" fill="currentColor" stroke="none" font-size="17" text-anchor="middle" font-family="sans-serif">DE ∥ AB</text><text x="210" y="250" fill="currentColor" stroke="none" font-size="15" text-anchor="middle" font-family="sans-serif">BD:DC=1:2, CE:CA=2:3 → BC=12, DC=8</text></g></svg>
