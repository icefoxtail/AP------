<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 260" width="420" height="260" role="img" aria-labelledby="title desc"><title id="title">q4 직사각형과 피타고라스 정리</title><desc id="desc">원문 표기대로 AC=25, BC=24에서 AB=7을 구해 둘레 62.</desc><g fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polygon points="70,80 310,80 310,150 70,150"/><line x1="70" y1="80" x2="310" y2="150"/><text x="60" y="72" fill="currentColor" stroke="none" font-size="17" text-anchor="middle" font-family="sans-serif">A</text><text x="320" y="72" fill="currentColor" stroke="none" font-size="17" text-anchor="middle" font-family="sans-serif">D</text><text x="322" y="170" fill="currentColor" stroke="none" font-size="17" text-anchor="middle" font-family="sans-serif">C</text><text x="58" y="170" fill="currentColor" stroke="none" font-size="17" text-anchor="middle" font-family="sans-serif">B</text><text x="52" y="120" fill="currentColor" stroke="none" font-size="17" text-anchor="end" font-family="sans-serif">AB=7</text><text x="190" y="175" fill="currentColor" stroke="none" font-size="17" text-anchor="middle" font-family="sans-serif">BC=24</text><text x="195" y="128" fill="currentColor" stroke="none" font-size="17" text-anchor="middle" font-family="sans-serif">AC=25</text><text x="190" y="210" fill="currentColor" stroke="none" font-size="17" text-anchor="middle" font-family="sans-serif">둘레 = 2(24+7)=62</text></g></svg>