<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 727 556" width="727" height="556" role="img" aria-labelledby="title desc"><title id="title">직접 가는 길과 B를 거쳐 가는 길</title><desc id="desc">위에는 A에서 C로 바로 연결된 세 길이 있다. 아래에는 A에서 B로 가는 파란 두 길과 B에서 C로 가는 청록 두 길이 있다.</desc><rect width="727" height="556" fill="white" /><text x="359.0000" y="48.0000" font-size="32" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#754596" text-anchor="middle">바로 가는 길</text><path d="M 82 170 Q 365 52 646 170" fill="none" stroke="#754596" stroke-width="5.8" stroke-linecap="round" /><path d="M 82 170 L 646 170" fill="none" stroke="#754596" stroke-width="5.8" stroke-linecap="round" /><path d="M 82 170 Q 365 274 646 170" fill="none" stroke="#754596" stroke-width="5.8" stroke-linecap="round" /><circle cx="82" cy="170" r="7.4" fill="#283a4a" stroke="white" stroke-width="2" /><text x="82.0000" y="213.0000" font-size="31" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#283a4a" text-anchor="middle">A</text><circle cx="646" cy="170" r="7.4" fill="#283a4a" stroke="white" stroke-width="2" /><text x="646.0000" y="213.0000" font-size="31" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#283a4a" text-anchor="middle">C</text><line x1="43.0000" y1="299.0000" x2="685.0000" y2="299.0000" stroke="#d7e0e8" stroke-width="1.7" stroke-linecap="round" /><text x="360.0000" y="352.0000" font-size="32" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#217060" text-anchor="middle">B를 거쳐 가는 길</text><path d="M 82 451 Q 223 378 364 451" fill="none" stroke="#23649a" stroke-width="5.8" stroke-linecap="round" /><path d="M 82 451 Q 223 526 364 451" fill="none" stroke="#23649a" stroke-width="5.8" stroke-linecap="round" /><path d="M 364 451 Q 505 378 646 451" fill="none" stroke="#217060" stroke-width="5.8" stroke-linecap="round" /><path d="M 364 451 Q 505 526 646 451" fill="none" stroke="#217060" stroke-width="5.8" stroke-linecap="round" /><circle cx="82" cy="451" r="7.4" fill="#283a4a" stroke="white" stroke-width="2" /><text x="82.0000" y="494.0000" font-size="31" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#283a4a" text-anchor="middle">A</text><circle cx="364" cy="451" r="7.4" fill="#283a4a" stroke="white" stroke-width="2" /><text x="364.0000" y="494.0000" font-size="31" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#283a4a" text-anchor="middle">B</text><circle cx="646" cy="451" r="7.4" fill="#283a4a" stroke="white" stroke-width="2" /><text x="646.0000" y="494.0000" font-size="31" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#283a4a" text-anchor="middle">C</text></svg>
