<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 260" width="420" height="260" role="img" aria-labelledby="title desc"><title id="title">q12 이등변삼각형의 무게중심</title><desc id="desc">D,E는 각각 AB,AC의 중점. 중선 BE,CD의 교점 G는 무게중심.</desc><g fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polygon points="210,40 80,220 340,220"/><line x1="80" y1="220" x2="275" y2="130"/><line x1="340" y1="220" x2="145" y2="130"/><text x="210" y="30" fill="currentColor" stroke="none" font-size="17" text-anchor="middle" font-family="sans-serif">A</text><text x="70" y="238" fill="currentColor" stroke="none" font-size="17" text-anchor="middle" font-family="sans-serif">B</text><text x="350" y="238" fill="currentColor" stroke="none" font-size="17" text-anchor="middle" font-family="sans-serif">C</text><text x="135" y="125" fill="currentColor" stroke="none" font-size="17" text-anchor="middle" font-family="sans-serif">D</text><text x="285" y="125" fill="currentColor" stroke="none" font-size="17" text-anchor="middle" font-family="sans-serif">E</text><text x="210" y="178" fill="currentColor" stroke="none" font-size="17" text-anchor="middle" font-family="sans-serif">G</text><text x="255" y="145" fill="currentColor" stroke="none" font-size="17" text-anchor="middle" font-family="sans-serif">GE=5</text><text x="140" y="145" fill="currentColor" stroke="none" font-size="17" text-anchor="middle" font-family="sans-serif">CG=10</text><text x="210" y="248" fill="currentColor" stroke="none" font-size="17" text-anchor="middle" font-family="sans-serif">AB=AC, G는 무게중심</text></g></svg>
