<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 560" width="640" height="560" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">원 O에서 중심에서 두 현에 수선을 내린 그림이다. 아래쪽 현의 길이는 16이고 중심에서 이 현까지의 거리는 6이며, 위쪽 현의 한쪽 절반은 6, 중심에서 위쪽 현까지의 거리는 x로 표시되어 있다.</title><desc id="visual-desc">원 O 안에 위아래로 두 현이 있고 중심에서 각 현에 수선이 내려져 있다. 아래쪽 현 전체는 16, 아래쪽 수선은 6, 위쪽 현의 한쪽 절반은 6, 위쪽 수선은 x로 표시되어 있다.</desc><rect width="640" height="560" fill="#fff"/><g data-layer="30"><line id="sAM" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="191.724137931" y1="108.965517241" x2="320" y2="108.965517241"/></g><g data-layer="30"><line id="sMB" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="320" y1="108.965517241" x2="448.275862069" y2="108.965517241"/></g><g data-layer="30"><line id="sEF" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="148.965517241" y1="408.275862069" x2="491.034482759" y2="408.275862069"/></g><g data-layer="30"><line id="sOM" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="320" y1="280" x2="320" y2="108.965517241"/></g><g data-layer="30"><line id="sON" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="320" y1="280" x2="320" y2="408.275862069"/></g><g data-layer="40"><circle id="c" data-role="circle" stroke="#111" stroke-width="2.05" fill="none" cx="320" cy="280" r="213.79