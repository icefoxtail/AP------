<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 420" width="420" height="420" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">지면 위의 점 E에서 5 m 떨어진 곳에 눈높이 1.4 m인 사람이 서서 나무 위의 점 C를 올려다본 각이 56도인 상황을 나타낸 그림이다.</title><desc id="visual-desc">오른쪽에 세로로 선 나무 EC가 있고, 지면 FE의 왼쪽 끝에서 사람의 키만큼 세운 선분 FB와 그 위의 눈높이 점에서 C로 향하는 빗변이 그려져 있다. 눈높이 점에서 나무로 가는 가로선이 있고, 눈높이 각에 56, 지면 거리에 5 m, 사람의 키에 1.4 m가 적혀 있다.</desc><rect width="420" height="420" fill="#fff"/><g data-layer="30"><line id="sFE" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="126.102278847" y1="345.039177164" x2="293.897721153" y2="345.039177164"/></g><g data-layer="30"><line id="sEC" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="293.897721153" y1="345.039177164" x2="293.897721153" y2="49.719198707"/></g><g data-layer="30"><line id="sFB" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="126.102278847" y1="345.039177164" x2="126.102278847" y2="298.056453319"/></g><g data-layer="30"><line id="sBD" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="126.102278847" y1="298.056453319" x2="293.897721153" y2="298.056453319"/></g><g data-layer="30"><line id="sBC" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="126.102278847" y1="298.056453319" x2="293.897721153" y2="49.719198707"/></g><g data-layer="52"><line id=