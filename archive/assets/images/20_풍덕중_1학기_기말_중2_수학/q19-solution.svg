<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 384 320" width="384" height="320" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">정사각형의 두 대각선은 길이가 같고 서로를 수직이등분하므로 BD=AC=8cm이다. 따라서 넓이는 대각선을 이용한 마름모의 넓이 공식으로 (1/2)×8×8=32cm²이다. 답은 ②이다.</title><desc id="visual-desc">정사각형 ABCD의 두 대각선이 점 O에서 직각으로 만나고 네 선분 OA, OB, OC, OD에 4가 적혀 있으며 정사각형 안이 칠해져 넓이 32가 적혀 있다.</desc><rect width="384" height="320" fill="#fff"/><g data-layer="10"><path id="rg0" data-role="region" stroke="none" stroke-width="1.6" fill="#e4e7ec" data-owner-points="A B C D" data-mark="region" data-mark-id="rg0" fill-rule="evenodd" d="M192 45.714285714 L77.714285714 160 L192 274.285714286 L306.285714286 160 L192 45.714285714 Z"/></g><g data-layer="30"><line id="AB" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="192" y1="45.714285714" x2="77.714285714" y2="160"/></g><g data-layer="30"><line id="BC" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="77.714285714" y1="160" x2="192" y2="274.285714286"/></g><g data-layer="30"><line id="CD" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="192" y1="274.285714286" x2="306.285714286" y2="160"/></g><g data-layer="30"><line id="DA" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="306.285714286" y1="160" x2="192" y2="45.714285714"/></g><g data-layer="30"><line id="AO" data-rol