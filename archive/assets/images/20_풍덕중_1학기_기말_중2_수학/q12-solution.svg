<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 384 320" width="384" height="320" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">두 쌍의 대변의 길이가 각각 같으므로(AB=CD=5, AD=BC=7) 사각형 ABCD는 평행사변형이다. 평행사변형에서 이웃하는 두 내각의 합은 180°이므로 130°+x=180°에서 x=50°이다. 따라서 답은 ②이다.</title><desc id="visual-desc">평행사변형 ABCD에서 꼭짓점 A의 각 130°, 꼭짓점 B의 각 x=50°가 표시되어 있고 변 AB 5, BC 7이 적혀 있으며 마주 보는 변에 같은 눈금이 있다.</desc><rect width="384" height="320" fill="#fff"/><g data-layer="30"><line id="AB" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="184.473498106" y1="240.640388778" x2="334.857142857" y2="240.640388778"/></g><g data-layer="30"><line id="BC" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="334.857142857" y1="240.640388778" x2="199.526501894" y2="79.359611222"/></g><g data-layer="30"><line id="CD" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="199.526501894" y1="79.359611222" x2="49.142857143" y2="79.359611222"/></g><g data-layer="30"><line id="DA" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="49.142857143" y1="79.359611222" x2="184.473498106" y2="240.640388778"/></g><g data-layer="60"><polyline id="a0-arc-1" data-role="indicator" stroke="#111" stroke-width="1.6" fill="none" data-owner-points="D A B" data-mark="angle" data-mark-id="a0" data-mark-index="1" data-mark-count="1" data-mark-side="IN