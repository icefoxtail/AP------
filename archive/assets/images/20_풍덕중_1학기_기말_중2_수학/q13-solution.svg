<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 384 320" width="384" height="320" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">평행사변형의 대변의 길이는 같으므로 CD=AB=4cm이다. 두 대각선은 서로를 이등분하므로 OC=(1/2)AC=3cm, OD=(1/2)BD=4cm이다. 따라서 △OCD의 둘레는 3+4+4=11cm이고 답은 ③이다.</title><desc id="visual-desc">평행사변형 ABCD의 두 대각선이 점 O에서 만나고 AB 4, AO 3, BO 4가 적혀 있으며 반대쪽의 OC 3, OD 4, CD 4도 적혀 있고 같은 길이의 선분에 같은 눈금이 있다.</desc><rect width="384" height="320" fill="#fff"/><g data-layer="30"><line id="AB" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="99.538304576" y1="160" x2="145.769152288" y2="45.714285714"/></g><g data-layer="30"><line id="BC" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="145.769152288" y1="45.714285714" x2="284.461695424" y2="160"/></g><g data-layer="30"><line id="CD" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="284.461695424" y1="160" x2="238.230847712" y2="274.285714286"/></g><g data-layer="30"><line id="DA" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="238.230847712" y1="274.285714286" x2="99.538304576" y2="160"/></g><g data-layer="30"><line id="AO" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="99.538304576" y1="160" x2="192" y2="160"/></g><g data-layer="30"><line id="OC" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="192" y1="160" x