<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 384 320" width="384" height="320" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">예: 마름모가 되는 경우의 평행사변형 그림이다. 평행사변형이 마름모가 되려면 이웃하는 두 변의 길이가 같거나(①), 두 대각선이 서로 수직이거나(③), 대각선이 내각을 이등분해야(④) 한다. 반면 ② ∠OAD=∠ODA는 OA=OD여서 두 대각선의 길이가 같다는 조건이고 ⑤도 직사각형이 되는 조건이다. 따라서 마름모가 되는 조건이 아닌 것은 ②, ⑤이다.</title><desc id="visual-desc">마름모 ABCD의 두 대각선이 점 O에서 직각으로 만나고 네 변에 같은 눈금이 있으며 꼭짓점 B에서 대각선 BD가 각을 이등분해 두 각에 같은 표시가 있다.</desc><rect width="384" height="320" fill="#fff"/><g data-layer="30"><line id="AB" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="192" y1="64.761904762" x2="49.142857143" y2="160"/></g><g data-layer="30"><line id="BC" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="49.142857143" y1="160" x2="192" y2="255.238095238"/></g><g data-layer="30"><line id="CD" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="192" y1="255.238095238" x2="334.857142857" y2="160"/></g><g data-layer="30"><line id="DA" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="334.857142857" y1="160" x2="192" y2="64.761904762"/></g><g data-layer="30"><line id="AO" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="192" y1="64.761904762" x2="192" y2="160"/></g><g data-layer="30"><line id="OC" data-role="line" stroke="#111" stroke-width="1.6" fill="non