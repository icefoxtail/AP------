<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480" role="img" aria-labelledby="title desc" data-visual-type="geometry" data-geometry-mode="COORDINATE_GEOMETRY" data-axis-scale-mode="EQUAL_UNIT">
<title id="title">삼각형 ABC와 무게중심 G</title>
<desc id="desc">A(-3,5), B(4,2), C(5,-10)과 세 중선이 만나는 무게중심 G(2,-1)를 표시한다.</desc>
<style>.axis{stroke:#9ca3af;stroke-width:1}.shape{stroke:#111827;stroke-width:2;fill:none}.median{stroke:#64748b;stroke-width:1.4;stroke-dasharray:6 4}.pt{fill:#111827}.g{fill:#b91c1c}.label{font:600 15px "Noto Sans KR","Malgun Gothic",sans-serif;fill:#111827}.note{font:14px "Noto Sans KR","Malgun Gothic",sans-serif;fill:#374151}.head{font:700 17px "Noto Sans KR","Malgun Gothic",sans-serif;fill:#111827}</style>
<rect width="800" height="480" fill="#fff"/>
<text x="28" y="32" class="head">세 꼭짓점의 평균 = 무게중심</text>
<rect x="28" y="52" width="470" height="400" rx="12" fill="#fff" stroke="#d1d5db"/>
<line x1="70" y1="180" x2="470" y2="180" class="axis"/><line x1="180" y1="66" x2="180" y2="430" class="axis"/>
<polyline points="114,70 268,136 290,400 114,70" class="shape"/>
<line x1="114" y1="70" x2="279" y2="268" class="median"/>
<line x1="268" y1="136" x2="202" y2="235" class="median"/>
<line x1="290" y1="400" x2="191" y2="103" class="median"/>
<circle cx="114" cy="70" r="4" class="pt"/><text x="74" y="66" class="label">A(-3,5)</text>
<circle cx="268" cy="136" r="4" class="pt"/><text x="278" y="132" class="label">B(4,2)</text>
<circle cx="290" cy="400" r="4" class="pt"/><text x="300" y="416" class="label">C(5,-10)</text>
<circle cx="224" cy="202" r="5" class="g"/><text x="234" y="197" class="label">G(2,-1)</text>
<rect x="520" y="52" width="250" height="400" rx="12" fill="#f8fafc" stroke="#d1d5db"/>
<text x="542" y="86" class="head">좌표 확인</text>
<text x="542" y="128" class="note">x좌표 평균</text><text x="542" y="154" class="label">(-3+4+5)/3 = 2</text>
<text x="542" y="204" class="note">y좌표 평균</text><text x="542" y="230" class="label">(5+2-10)/3 = -1</text>
<text x="542" y="292" class="note">세 중선의 교점이</text><text x="542" y="318" class="note">바로 G(2,-1)</text>
</svg>