<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" width="800" height="440" role="img" aria-labelledby="title desc" data-visual-type="geometry" data-geometry-mode="COORDINATE_GEOMETRY" data-axis-scale-mode="EQUAL_UNIT">
<title id="title">x축 대칭을 이용한 삼각형 둘레의 최솟값</title>
<desc id="desc">A(1,3)의 x축 대칭점 A'(1,-3), B(5,1), x축 위의 C(4,0)가 한 직선 A'CB 위에 놓이는 최단 경로를 표시한다.</desc>
<style>.axis{stroke:#9ca3af;stroke-width:1}.shape{stroke:#111827;stroke-width:2.2;fill:none}.reflect{stroke:#64748b;stroke-width:1.4;stroke-dasharray:6 4}.pt{fill:#111827}.hi{fill:#b91c1c}.label{font:600 15px "Noto Sans KR","Malgun Gothic",sans-serif;fill:#111827}.note{font:14px "Noto Sans KR","Malgun Gothic",sans-serif;fill:#374151}.head{font:700 17px "Noto Sans KR","Malgun Gothic",sans-serif;fill:#111827}</style>
<rect width="800" height="440" fill="#fff"/>
<text x="28" y="32" class="head">반사하면 꺾인 경로가 직선이 된다</text>
<rect x="28" y="52" width="470" height="360" rx="12" fill="#fff" stroke="#d1d5db"/>
<line x1="60" y1="260" x2="480" y2="260" class="axis"/><line x1="160" y1="70" x2="160" y2="400" class="axis"/>
<line x1="200" y1="140" x2="200" y2="380" class="reflect"/>
<line x1="200" y1="140" x2="320" y2="260" class="shape"/><line x1="320" y1="260" x2="360" y2="220" class="shape"/>
<line x1="200" y1="380" x2="360" y2="220" class="shape"/>
<circle cx="200" cy="140" r="4" class="pt"/><text x="210" y="134" class="label">A(1,3)</text>
<circle cx="200" cy="380" r="4" class="pt"/><text x="210" y="398" class="label">A'(1,-3)</text>
<circle cx="320" cy="260" r="5" class="hi"/><text x="330" y="280" class="label">C(4,0)</text>
<circle cx="360" cy="220" r="4" class="pt"/><text x="370" y="214" class="label">B(5,1)</text>
<text x="260" y="334" class="label">A'–C–B 일직선</text>
<rect x="520" y="52" width="250" height="360" rx="12" fill="#f8fafc" stroke="#d1d5db"/>
<text x="542" y="90" class="head">길이</text>
<text x="542" y="136" class="note">AB = 2√5</text>
<text x="542" y="184" class="note">AC = A'C</text>
<text x="542" y="232" class="note">A'C + CB ≥ A'B</text>
<text x="542" y="278" class="label">A'B = 4√2</text>
<text x="542" y="334" class="label">최소 둘레 = 2√5+4√2</text>
</svg>