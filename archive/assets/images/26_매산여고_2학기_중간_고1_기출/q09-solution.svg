<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470" width="820" height="470" role="img" aria-labelledby="title desc" data-visual-type="geometry" data-geometry-mode="COORDINATE_GEOMETRY" data-axis-scale-mode="EQUAL_UNIT">
<title id="title">점 P에서 원에 그은 두 접선</title>
<desc id="desc">점 P=(1,-3)에서 중심 C=(2,1), 반지름 2인 원에 그은 두 접선과 접점 T1,T2, 반지름과 접선의 수직 관계를 나타낸다.</desc>
<style>.axis{stroke:#9ca3af;stroke-width:1}.circle{stroke:#111827;stroke-width:2.2;fill:#dbeafe;fill-opacity:.28}.tan{stroke:#b91c1c;stroke-width:2.2}.rad{stroke:#475569;stroke-width:1.8}.pt{fill:#111827}.tp{fill:#b91c1c}.label{font:600 14px "Noto Sans KR","Malgun Gothic",sans-serif;fill:#111827}.note{font:13px "Noto Sans KR","Malgun Gothic",sans-serif;fill:#374151}.head{font:700 17px "Noto Sans KR","Malgun Gothic",sans-serif;fill:#111827}</style>
<rect width="820" height="470" fill="#fff"/>
<text x="28" y="32" class="head">두 접선의 기울기를 한 번에 정하는 조건</text>
<rect x="28" y="52" width="500" height="390" rx="12" fill="#fff" stroke="#d1d5db"/>
<line x1="70" y1="250" x2="500" y2="250" class="axis"/><line x1="190" y1="72" x2="190" y2="420" class="axis"/>
<circle cx="280" cy="205" r="90" class="circle"/>
<line x1="235" y1="385" x2="193" y2="228" class="tan"/>
<line x1="235" y1="385" x2="346" y2="266" class="tan"/>
<line x1="280" y1="205" x2="193" y2="228" class="rad"/>
<line x1="280" y1="205" x2="346" y2="266" class="rad"/>
<circle cx="280" cy="205" r="4" class="pt"/><text x="290" y="199" class="label">C(2,1)</text>
<circle cx="235" cy="385" r="4" class="pt"/><text x="244" y="405" class="label">P(1,-3)</text>
<circle cx="193" cy="228" r="5" class="tp"/><text x="118" y="218" class="label">T₁</text>
<circle cx="346" cy="266" r="5" class="tp"/><text x="356" y="282" class="label">T₂</text>
<text x="145" y="310" class="note">CT₁ ⟂ PT₁</text><text x="320" y="330" class="note">CT₂ ⟂ PT₂</text>
<rect x="550" y="52" width="240" height="390" rx="12" fill="#f8fafc" stroke="#d1d5db"/>
<text x="572" y="90" class="head">거리 조건</text>
<text x="572" y="136" class="note">접선: y+3=m(x-1)</text>
<text x="572" y="180" class="note">중심-직선 거리 = 2</text>
<text x="572" y="228" class="label">3m²+8m-12=0</text>
<text x="572" y="282" class="note">두 접선의 기울기</text>
<text x="572" y="316" class="label">m₁+m₂ = -8/3</text>
</svg>