<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470" width="820" height="470" role="img" aria-labelledby="title desc" data-visual-type="geometry" data-geometry-mode="EUCLIDEAN_GEOMETRY" data-axis-scale-mode="EQUAL_UNIT">
<title id="title">접는 선 AB는 두 원의 공통현이자 중심선 OO'의 수직이등분선</title>
<desc id="desc">반지름 6인 원의 중심 O와 접은 뒤 중심 O'=(3,6), 중점 M, 공통현 AB를 표시하고 OM=3sqrt5/2, AM=3sqrt11/2를 나타낸다.</desc>
<style>.c1{stroke:#111827;stroke-width:2.2;fill:#dbeafe;fill-opacity:.22}.c2{stroke:#64748b;stroke-width:2;fill:none;stroke-dasharray:6 4}.chord{stroke:#b91c1c;stroke-width:2.6}.centerline{stroke:#475569;stroke-width:1.8}.pt{fill:#111827}.hi{fill:#b91c1c}.label{font:600 14px "Noto Sans KR","Malgun Gothic",sans-serif;fill:#111827}.note{font:13px "Noto Sans KR","Malgun Gothic",sans-serif;fill:#374151}.head{font:700 17px "Noto Sans KR","Malgun Gothic",sans-serif;fill:#111827}</style>
<rect width="820" height="470" fill="#fff"/>
<text x="28" y="32" class="head">접기 = 중심 O를 O'로 대칭이동</text>
<rect x="28" y="52" width="510" height="390" rx="12" fill="#fff" stroke="#d1d5db"/>
<circle cx="190" cy="310" r="132" class="c1"/>
<circle cx="256" cy="178" r="132" class="c2"/>
<line x1="190" y1="310" x2="256" y2="178" class="centerline"/>
<line x1="125" y1="195" x2="321" y2="293" class="chord"/>
<circle cx="190" cy="310" r="4" class="pt"/><text x="166" y="332" class="label">O</text>
<circle cx="256" cy="178" r="4" class="pt"/><text x="266" y="174" class="label">O'</text>
<circle cx="223" cy="244" r="5" class="hi"/><text x="232" y="260" class="label">M</text>
<circle cx="125" cy="195" r="4" class="pt"/><text x="101" y="187" class="label">A</text>
<circle cx="321" cy="293" r="4" class="pt"/><text x="330" y="310" class="label">B</text>
<text x="202" y="278" class="note">OM=3√5/2</text>
<text x="142" y="240" class="note">AM=3√11/2</text>
<text x="312" y="232" class="label">AB ⟂ OO'</text>
<rect x="560" y="52" width="230" height="390" rx="12" fill="#f8fafc" stroke="#d1d5db"/>
<text x="582" y="90" class="head">직각삼각형 OMA</text>
<text x="582" y="142" class="note">OA = 6</text>
<text x="582" y="188" class="note">OM = OO'/2</text>
<text x="582" y="234" class="note">OO' = 3√5</text>
<text x="582" y="284" class="note">AM² = 36 - 45/4</text>
<text x="582" y="330" class="label">AB = 2AM = 3√11</text>
</svg>