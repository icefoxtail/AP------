<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420" role="img" aria-labelledby="title desc" data-visual-type="geometry" data-geometry-mode="COORDINATE_GEOMETRY" data-axis-scale-mode="EQUAL_UNIT">
<title id="title">선분 AB를 2대1로 내분하는 점 P</title>
<desc id="desc">A(1,5), P(5,1), B(7,-1)이 한 직선 위에 있고 AP:PB=2:1임을 나타낸다.</desc>
<style>.axis{stroke:#9ca3af;stroke-width:1}.shape{stroke:#111827;stroke-width:2.4}.pt{fill:#111827}.p{fill:#b91c1c}.label{font:600 15px "Noto Sans KR","Malgun Gothic",sans-serif;fill:#111827}.note{font:14px "Noto Sans KR","Malgun Gothic",sans-serif;fill:#374151}.head{font:700 17px "Noto Sans KR","Malgun Gothic",sans-serif;fill:#111827}</style>
<rect width="800" height="420" fill="#fff"/>
<text x="28" y="32" class="head">내분점 P의 위치</text>
<rect x="28" y="52" width="470" height="340" rx="12" fill="#fff" stroke="#d1d5db"/>
<line x1="70" y1="300" x2="470" y2="300" class="axis"/><line x1="150" y1="62" x2="150" y2="378" class="axis"/>
<line x1="180" y1="150" x2="360" y2="330" class="shape"/>
<circle cx="180" cy="150" r="4" class="pt"/><text x="116" y="140" class="label">A(1,5)</text>
<circle cx="300" cy="270" r="5" class="p"/><text x="310" y="258" class="label">P(5,1)</text>
<circle cx="360" cy="330" r="4" class="pt"/><text x="370" y="346" class="label">B(7,-1)</text>
<text x="222" y="206" class="label">AP : PB = 2 : 1</text>
<rect x="520" y="52" width="250" height="340" rx="12" fill="#f8fafc" stroke="#d1d5db"/>
<text x="542" y="88" class="head">좌표 비교</text>
<text x="542" y="132" class="note">(1 + 2b)/3 = 5</text>
<text x="542" y="158" class="label">b = 7</text>
<text x="542" y="212" class="note">(a - 2)/3 = 1</text>
<text x="542" y="238" class="label">a = 5</text>
<text x="542" y="300" class="label">3a - 2b = 1</text>
</svg>