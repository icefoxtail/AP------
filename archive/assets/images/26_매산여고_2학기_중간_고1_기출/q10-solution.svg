<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 460" width="820" height="460" role="img" aria-labelledby="title desc" data-visual-type="geometry" data-geometry-mode="COORDINATE_GEOMETRY" data-axis-scale-mode="EQUAL_UNIT">
<title id="title">원을 x축 방향으로 3만큼 평행이동한 뒤 직선과 접하는 경우</title>
<desc id="desc">원래 중심 C0=(3,0), 이동 후 중심 C1=(6,0), 반지름 2, 접선 3x+4y-8=0과 접점 T=(24/5,-8/5)를 표시한다.</desc>
<style>.axis{stroke:#9ca3af;stroke-width:1}.old{stroke:#94a3b8;stroke-width:1.8;fill:none;stroke-dasharray:6 4}.new{stroke:#111827;stroke-width:2.3;fill:#dbeafe;fill-opacity:.3}.tan{stroke:#b91c1c;stroke-width:2.2}.rad{stroke:#475569;stroke-width:1.8}.arrow{stroke:#2563eb;stroke-width:2;marker-end:url(#arr)}.pt{fill:#111827}.tp{fill:#b91c1c}.label{font:600 14px "Noto Sans KR","Malgun Gothic",sans-serif;fill:#111827}.note{font:13px "Noto Sans KR","Malgun Gothic",sans-serif;fill:#374151}.head{font:700 17px "Noto Sans KR","Malgun Gothic",sans-serif;fill:#111827}</style>
<defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto"><polygon points="0 0,8 3.5,0 7" fill="#2563eb"/></marker></defs>
<rect width="820" height="460" fill="#fff"/>
<text x="28" y="32" class="head">평행이동 후에도 반지름은 2</text>
<rect x="28" y="52" width="510" height="380" rx="12" fill="#fff" stroke="#d1d5db"/>
<line x1="60" y1="230" x2="515" y2="230" class="axis"/><line x1="100" y1="75" x2="100" y2="410" class="axis"/>
<circle cx="220" cy="230" r="80" class="old"/>
<circle cx="340" cy="230" r="80" class="new"/>
<line x1="140" y1="180" x2="420" y2="390" class="tan"/>
<line x1="340" y1="230" x2="292" y2="294" class="rad"/>
<line x1="230" y1="115" x2="325" y2="115" class="arrow"/>
<circle cx="220" cy="230" r="4" class="pt"/><text x="168" y="250" class="label">C₀(3,0)</text>
<circle cx="340" cy="230" r="4" class="pt"/><text x="350" y="224" class="label">C₁(6,0)</text>
<circle cx="292" cy="294" r="5" class="tp"/><text x="300" y="316" class="label">T(24/5,-8/5)</text>
<text x="252" y="105" class="label">+3</text><text x="330" y="360" class="label">3x+4y-8=0</text>
<rect x="560" y="52" width="230" height="380" rx="12" fill="#f8fafc" stroke="#d1d5db"/>
<text x="582" y="90" class="head">접선 조건</text>
<text x="582" y="140" class="note">중심 C₁=(3+k,0)</text>
<text x="582" y="186" class="note">직선까지 거리 = 2</text>
<text x="582" y="234" class="note">|1+3k|/5 = 2</text>
<text x="582" y="282" class="note">k&gt;0</text>
<text x="582" y="326" class="label">k = 3</text>
</svg>