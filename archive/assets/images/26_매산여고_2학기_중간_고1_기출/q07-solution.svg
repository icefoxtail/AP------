<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-labelledby="title desc" data-visual-type="geometry" data-geometry-mode="COORDINATE_GEOMETRY" data-axis-scale-mode="EQUAL_UNIT">
<title id="title">y축에 접하고 중심이 제3사분면에 있는 원</title>
<desc id="desc">중심 C=(-3,-sqrt2), 반지름 3인 원이 y축의 점 T=(0,-sqrt2)에서 접하는 모습을 나타낸다.</desc>
<style>.axis{stroke:#9ca3af;stroke-width:1}.circle{stroke:#111827;stroke-width:2.2;fill:#dbeafe;fill-opacity:.3}.radius{stroke:#b91c1c;stroke-width:2}.pt{fill:#111827}.hi{fill:#b91c1c}.label{font:600 15px "Noto Sans KR","Malgun Gothic",sans-serif;fill:#111827}.note{font:14px "Noto Sans KR","Malgun Gothic",sans-serif;fill:#374151}.head{font:700 17px "Noto Sans KR","Malgun Gothic",sans-serif;fill:#111827}</style>
<rect width="800" height="450" fill="#fff"/>
<text x="28" y="32" class="head">y축에 접하면 중심의 x좌표 절댓값 = 반지름</text>
<rect x="28" y="52" width="470" height="370" rx="12" fill="#fff" stroke="#d1d5db"/>
<line x1="60" y1="190" x2="475" y2="190" class="axis"/><line x1="340" y1="72" x2="340" y2="410" class="axis"/>
<circle cx="205" cy="254" r="135" class="circle"/>
<line x1="205" y1="254" x2="340" y2="254" class="radius"/>
<circle cx="205" cy="254" r="4" class="pt"/><text x="86" y="276" class="label">C(-3,-√2)</text>
<circle cx="340" cy="254" r="5" class="hi"/><text x="350" y="250" class="label">T(0,-√2)</text>
<text x="254" y="244" class="label">r=3</text><text x="350" y="92" class="label">y축</text>
<rect x="520" y="52" width="250" height="370" rx="12" fill="#f8fafc" stroke="#d1d5db"/>
<text x="542" y="90" class="head">결정 단계</text>
<text x="542" y="136" class="note">중심 = (-3,-k/2)</text>
<text x="542" y="178" class="note">y축까지 거리 = 3</text>
<text x="542" y="220" class="note">접하므로 r = 3</text>
<text x="542" y="268" class="note">k² = 8</text>
<text x="542" y="314" class="note">제3사분면 → k&gt;0</text>
<text x="542" y="350" class="label">k = 2√2</text>
</svg>