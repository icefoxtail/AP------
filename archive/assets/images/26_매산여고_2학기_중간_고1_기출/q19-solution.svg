<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470" width="820" height="470" role="img" aria-labelledby="title desc" data-visual-type="geometry" data-geometry-mode="COORDINATE_GEOMETRY" data-axis-scale-mode="UNIFORM_NORMALIZED">
<title id="title">두 직선 l, m과 넓이 조건으로 정해지는 점 P</title>
<desc id="desc">좌표를 a 단위로 정규화하여 A(0,a), B(-3a,0), C(0,3a), D(-2a,0), P(-12a/7,3a/7)의 관계를 표시한다.</desc>
<style>.axis{stroke:#9ca3af;stroke-width:1}.line{stroke:#111827;stroke-width:2.2}.poly1{fill:#dbeafe;fill-opacity:.55;stroke:#2563eb;stroke-width:1.5}.poly2{fill:#fee2e2;fill-opacity:.55;stroke:#b91c1c;stroke-width:1.5}.pt{fill:#111827}.p{fill:#b91c1c}.label{font:600 14px "Noto Sans KR","Malgun Gothic",sans-serif;fill:#111827}.note{font:13px "Noto Sans KR","Malgun Gothic",sans-serif;fill:#374151}.head{font:700 17px "Noto Sans KR","Malgun Gothic",sans-serif;fill:#111827}</style>
<rect width="820" height="470" fill="#fff"/>
<text x="28" y="32" class="head">넓이 6 + 6으로 P의 위치 결정</text>
<rect x="28" y="52" width="500" height="390" rx="12" fill="#fff" stroke="#d1d5db"/>
<line x1="70" y1="370" x2="500" y2="370" class="axis"/><line x1="470" y1="70" x2="470" y2="420" class="axis"/>
<polygon points="350,340 330,370 470,370 470,300" class="poly1"/>
<polygon points="350,340 470,160 260,370" class="poly2"/>
<line x1="260" y1="370" x2="470" y2="300" class="line"/>
<line x1="330" y1="370" x2="470" y2="160" class="line"/>
<circle cx="470" cy="300" r="4" class="pt"/><text x="478" y="296" class="label">A(0,a)</text>
<circle cx="260" cy="370" r="4" class="pt"/><text x="214" y="390" class="label">B(-3a,0)</text>
<circle cx="470" cy="160" r="4" class="pt"/><text x="478" y="156" class="label">C(0,3a)</text>
<circle cx="330" cy="370" r="4" class="pt"/><text x="286" y="354" class="label">D(-2a,0)</text>
<circle cx="350" cy="340" r="5" class="p"/><text x="358" y="326" class="label">P(-12a/7, 3a/7)</text>
<text x="282" y="320" class="label">l</text><text x="393" y="224" class="label">m</text>
<text x="368" y="410" class="note">좌표는 a 단위로 같은 비율로 표시</text>
<rect x="550" y="52" width="240" height="390" rx="12" fill="#f8fafc" stroke="#d1d5db"/>
<text x="572" y="90" class="head">결정 단계</text>
<text x="572" y="136" class="note">y=at, x=3a(t-1)</text>
<text x="572" y="176" class="note">△PCB=6 → a²t=2</text>
<text x="572" y="224" class="note">□PDOA=6</text>
<text x="572" y="264" class="label">t=3/7</text>
<text x="572" y="320" class="note">xy=3a²t(t-1)</text>
<text x="572" y="350" class="label">= -24/7</text>
</svg>