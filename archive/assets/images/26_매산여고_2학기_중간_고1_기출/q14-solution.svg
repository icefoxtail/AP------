<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470" width="820" height="470" role="img" aria-labelledby="title desc" data-visual-type="geometry" data-geometry-mode="COORDINATE_GEOMETRY" data-axis-scale-mode="EQUAL_UNIT">
<title id="title">세 직선이 만드는 삼각형과 외접원</title>
<desc id="desc">l과 m의 교점 (0,1), l과 n의 교점 (-4,-1), m과 n의 교점 (-2,5)을 지나는 외접원 중심 O=(-3,2), 반지름 sqrt10을 표시한다.</desc>
<style>.axis{stroke:#9ca3af;stroke-width:1}.line{stroke:#64748b;stroke-width:1.6}.tri{stroke:#111827;stroke-width:2.3;fill:none}.circle{stroke:#2563eb;stroke-width:2.2;fill:#dbeafe;fill-opacity:.18}.rad{stroke:#b91c1c;stroke-width:1.8}.pt{fill:#111827}.ctr{fill:#b91c1c}.label{font:600 14px "Noto Sans KR","Malgun Gothic",sans-serif;fill:#111827}.note{font:13px "Noto Sans KR","Malgun Gothic",sans-serif;fill:#374151}.head{font:700 17px "Noto Sans KR","Malgun Gothic",sans-serif;fill:#111827}</style>
<rect width="820" height="470" fill="#fff"/>
<text x="28" y="32" class="head">세 교점을 모두 지나는 외접원</text>
<rect x="28" y="52" width="510" height="390" rx="12" fill="#fff" stroke="#d1d5db"/>
<line x1="60" y1="280" x2="515" y2="280" class="axis"/><line x1="330" y1="75" x2="330" y2="420" class="axis"/>
<circle cx="195" cy="190" r="142.3" class="circle"/>
<line x1="70" y1="365" x2="450" y2="175" class="line"/>
<line x1="240" y1="55" x2="400" y2="375" class="line"/>
<line x1="120" y1="415" x2="240" y2="55" class="line"/>
<polyline points="330,235 150,325 240,55 330,235" class="tri"/>
<line x1="195" y1="190" x2="330" y2="235" class="rad"/>
<circle cx="330" cy="235" r="4" class="pt"/><text x="340" y="230" class="label">l∩m=(0,1)</text>
<circle cx="150" cy="325" r="4" class="pt"/><text x="64" y="344" class="label">l∩n=(-4,-1)</text>
<circle cx="240" cy="55" r="4" class="pt"/><text x="250" y="76" class="label">m∩n=(-2,5)</text>
<circle cx="195" cy="190" r="5" class="ctr"/><text x="104" y="184" class="label">O(-3,2)</text>
<text x="245" y="208" class="note">r=√10</text>
<text x="410" y="186" class="note">l</text><text x="384" y="354" class="note">m</text><text x="126" y="396" class="note">n</text>
<rect x="560" y="52" width="230" height="390" rx="12" fill="#f8fafc" stroke="#d1d5db"/>
<text x="582" y="90" class="head">외접원</text>
<text x="582" y="142" class="note">x²+y²+6x-4y+3=0</text>
<text x="582" y="194" class="note">(x+3)²+(y-2)²=10</text>
<text x="582" y="252" class="label">중심 (-3,2)</text>
<text x="582" y="292" class="label">r²=10</text>
<text x="582" y="344" class="label">넓이 = 10π</text>
</svg>