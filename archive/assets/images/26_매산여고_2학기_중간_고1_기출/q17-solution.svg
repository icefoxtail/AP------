<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470" width="820" height="470" role="img" aria-labelledby="title desc" data-visual-type="geometry" data-geometry-mode="COORDINATE_GEOMETRY" data-axis-scale-mode="EQUAL_UNIT">
<title id="title">두 점 A,B의 중점 M에서 원까지의 최단거리</title>
<desc id="desc">A=(0,5), B=(-4,9)의 중점 M=(-2,7), 원의 중심 C=(4,-1), 반지름 2, M에서 가장 가까운 원 위의 점 P=(14/5,3/5)를 표시한다.</desc>
<style>.axis{stroke:#9ca3af;stroke-width:1}.circle{stroke:#111827;stroke-width:2.2;fill:#dbeafe;fill-opacity:.25}.seg{stroke:#475569;stroke-width:1.8}.mid{stroke:#64748b;stroke-width:1.5;stroke-dasharray:6 4}.pt{fill:#111827}.hi{fill:#b91c1c}.label{font:600 14px "Noto Sans KR","Malgun Gothic",sans-serif;fill:#111827}.note{font:13px "Noto Sans KR","Malgun Gothic",sans-serif;fill:#374151}.head{font:700 17px "Noto Sans KR","Malgun Gothic",sans-serif;fill:#111827}</style>
<rect width="820" height="470" fill="#fff"/>
<text x="28" y="32" class="head">A,B의 중점 M과 원 사이의 최단거리</text>
<rect x="28" y="52" width="510" height="390" rx="12" fill="#fff" stroke="#d1d5db"/>
<line x1="60" y1="355" x2="515" y2="355" class="axis"/><line x1="230" y1="65" x2="230" y2="425" class="axis"/>
<line x1="110" y1="85" x2="230" y2="205" class="mid"/>
<line x1="170" y1="145" x2="350" y2="385" class="seg"/>
<circle cx="350" cy="385" r="60" class="circle"/>
<circle cx="230" cy="205" r="4" class="pt"/><text x="238" y="201" class="label">A(0,5)</text>
<circle cx="110" cy="85" r="4" class="pt"/><text x="48" y="80" class="label">B(-4,9)</text>
<circle cx="170" cy="145" r="5" class="hi"/><text x="88" y="163" class="label">M(-2,7)</text>
<circle cx="350" cy="385" r="4" class="pt"/><text x="360" y="400" class="label">C(4,-1)</text>
<circle cx="314" cy="337" r="5" class="hi"/><text x="322" y="331" class="label">P(14/5,3/5)</text>
<text x="235" y="253" class="note">MP=8</text><text x="334" y="357" class="note">CP=2</text>
<rect x="560" y="52" width="230" height="390" rx="12" fill="#f8fafc" stroke="#d1d5db"/>
<text x="582" y="90" class="head">완전제곱</text>
<text x="582" y="142" class="note">AP²+BP²</text>
<text x="582" y="176" class="note">= 2·PM² + 16</text>
<text x="582" y="230" class="note">CM = 10, r = 2</text>
<text x="582" y="278" class="label">PM(min)=8</text>
<text x="582" y="330" class="label">최솟값 = 144</text>
</svg>