<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" role="img" aria-labelledby="title desc" data-visual-type="geometry" data-geometry-mode="COORDINATE_GEOMETRY_CASES" data-axis-scale-mode="PANEL_LOCAL">
<title id="title">삼각형 COQ 넓이 24가 만드는 두 경우</title>
<desc id="desc">Q의 y좌표가 12 또는 -12인 두 경우를 나누어, OQ와 OP가 수직이고 P가 직선 AB 위에 놓이는 관계를 표시한다.</desc>
<style>.axis{stroke:#9ca3af;stroke-width:1}.line{stroke:#111827;stroke-width:2}.perp{stroke:#b91c1c;stroke-width:2}.pt{fill:#111827}.p{fill:#b91c1c}.label{font:600 13px "Noto Sans KR","Malgun Gothic",sans-serif;fill:#111827}.note{font:13px "Noto Sans KR","Malgun Gothic",sans-serif;fill:#374151}.head{font:700 16px "Noto Sans KR","Malgun Gothic",sans-serif;fill:#111827}</style>
<rect width="900" height="470" fill="#fff"/>
<text x="28" y="32" class="head">|y_Q|=12 → 두 경우를 각각 계산</text>
<rect x="28" y="54" width="405" height="380" rx="12" fill="#fff" stroke="#d1d5db"/>
<text x="48" y="82" class="head">CASE 1 : Q=(4,12)</text>
<line x1="58" y1="330" x2="407" y2="330" class="axis"/><line x1="180" y1="100" x2="180" y2="410" class="axis"/>
<line x1="100" y1="330" x2="300" y2="30" class="line"/>
<line x1="180" y1="330" x2="280" y2="30" class="perp"/>
<line x1="180" y1="330" x2="270" y2="360" class="perp"/>
<circle cx="180" cy="210" r="4" class="pt"/><text x="188" y="205" class="label">A(0,6)</text>
<circle cx="240" cy="330" r="4" class="pt"/><text x="248" y="346" class="label">B(3,0)</text>
<circle cx="100" cy="330" r="4" class="pt"/><text x="58" y="348" class="label">C(-4,0)</text>
<circle cx="260" cy="90" r="4" class="pt"/><text x="268" y="86" class="label">Q(4,12)</text>
<circle cx="252" cy="354" r="5" class="p"/><text x="264" y="376" class="label">P(18/5,-6/5)</text>
<text x="48" y="410" class="note">slope OQ=3, slope OP=-1/3</text>
<rect x="467" y="54" width="405" height="380" rx="12" fill="#fff" stroke="#d1d5db"/>
<text x="487" y="82" class="head">CASE 2 : Q=(-12,-12)</text>
<line x1="497" y1="210" x2="846" y2="210" class="axis"/><line x1="700" y1="92" x2="700" y2="408" class="axis"/>
<line x1="560" y1="360" x2="780" y2="30" class="line"/>
<line x1="560" y1="350" x2="840" y2="70" class="perp"/>
<line x1="700" y1="210" x2="820" y2="330" class="perp"/>
<circle cx="700" cy="150" r="4" class="pt"/><text x="708" y="146" class="label">A(0,6)</text>
<circle cx="730" cy="210" r="4" class="pt"/><text x="738" y="226" class="label">B(3,0)</text>
<circle cx="660" cy="210" r="4" class="pt"/><text x="618" y="228" class="label">C(-4,0)</text>
<circle cx="580" cy="330" r="4" class="pt"/><text x="488" y="348" class="label">Q(-12,-12)</text>
<circle cx="760" cy="270" r="5" class="p"/><text x="768" y="292" class="label">P(6,-6)</text>
<text x="487" y="410" class="note">slope OQ=1, slope OP=-1</text>
</svg>