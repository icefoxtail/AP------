<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" width="900" height="450" role="img" aria-labelledby="title desc" data-visual-type="geometry" data-geometry-mode="COORDINATE_GEOMETRY_CASES" data-axis-scale-mode="EQUAL_UNIT">
<title id="title">직각이등변삼각형 ABC에서 OC의 최댓값과 최솟값</title>
<desc id="desc">a=2와 a=-2의 끝점 배치를 나누어, 가능한 두 점 C와 원점 O 사이 거리가 sqrt2 또는 3sqrt2가 됨을 나타낸다.</desc>
<style>.axis{stroke:#9ca3af;stroke-width:1}.base{stroke:#111827;stroke-width:2}.tri1{stroke:#2563eb;stroke-width:2;fill:#dbeafe;fill-opacity:.35}.tri2{stroke:#b91c1c;stroke-width:2;fill:#fee2e2;fill-opacity:.35}.pt{fill:#111827}.label{font:600 13px "Noto Sans KR","Malgun Gothic",sans-serif;fill:#111827}.note{font:13px "Noto Sans KR","Malgun Gothic",sans-serif;fill:#374151}.head{font:700 16px "Noto Sans KR","Malgun Gothic",sans-serif;fill:#111827}</style>
<rect width="900" height="450" fill="#fff"/>
<text x="28" y="32" class="head">끝점 a=±2에서 최대·최소가 나타난다</text>
<rect x="28" y="54" width="405" height="360" rx="12" fill="#fff" stroke="#d1d5db"/>
<text x="48" y="82" class="head">a=2</text>
<line x1="68" y1="300" x2="410" y2="300" class="axis"/><line x1="120" y1="100" x2="120" y2="390" class="axis"/>
<line x1="120" y1="220" x2="280" y2="300" class="base"/>
<polygon points="120,220 280,300 240,180" class="tri1"/>
<polygon points="120,220 280,300 160,340" class="tri2"/>
<circle cx="120" cy="300" r="4" class="pt"/><text x="98" y="320" class="label">O</text>
<text x="82" y="214" class="label">A(0,2)</text><text x="286" y="316" class="label">B(4,0)</text>
<text x="246" y="174" class="label">Cmax(3,3)</text><text x="166" y="362" class="label">Cmin(1,-1)</text>
<text x="48" y="392" class="note">OCmax=3√2, OCmin=√2</text>
<rect x="467" y="54" width="405" height="360" rx="12" fill="#fff" stroke="#d1d5db"/>
<text x="487" y="82" class="head">a=-2</text>
<line x1="507" y1="250" x2="849" y2="250" class="axis"/><line x1="559" y1="90" x2="559" y2="390" class="axis"/>
<line x1="559" y1="330" x2="719" y2="250" class="base"/>
<polygon points="559,330 719,250 599,210" class="tri2"/>
<polygon points="559,330 719,250 679,370" class="tri1"/>
<circle cx="559" cy="250" r="4" class="pt"/><text x="537" y="270" class="label">O</text>
<text x="511" y="346" class="label">A(0,-2)</text><text x="725" y="266" class="label">B(4,0)</text>
<text x="605" y="204" class="label">Cmin(1,1)</text><text x="685" y="392" class="label">Cmax(3,-3)</text>
<text x="487" y="392" class="note">OCmin=√2, OCmax=3√2</text>
</svg>