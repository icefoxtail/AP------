<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420" role="img" aria-labelledby="title desc" data-visual-type="geometry" data-geometry-mode="COORDINATE_GEOMETRY" data-axis-scale-mode="EQUAL_UNIT">
<title id="title">두 점을 지나는 직선 y=3x-4</title>
<desc id="desc">두 점 (1,-1), (3,5)을 지나는 직선과 기울기 삼각형 Δx=2, Δy=6, y절편 -4를 표시한다.</desc>
<style>.axis{stroke:#9ca3af;stroke-width:1}.line{stroke:#111827;stroke-width:2.3}.aux{stroke:#64748b;stroke-width:1.4;stroke-dasharray:5 4}.pt{fill:#111827}.label{font:600 15px "Noto Sans KR","Malgun Gothic",sans-serif;fill:#111827}.note{font:14px "Noto Sans KR","Malgun Gothic",sans-serif;fill:#374151}.head{font:700 17px "Noto Sans KR","Malgun Gothic",sans-serif;fill:#111827}</style>
<rect width="800" height="420" fill="#fff"/>
<text x="28" y="32" class="head">기울기와 y절편</text>
<rect x="28" y="52" width="470" height="340" rx="12" fill="#fff" stroke="#d1d5db"/>
<line x1="60" y1="280" x2="480" y2="280" class="axis"/><line x1="180" y1="62" x2="180" y2="382" class="axis"/>
<line x1="172" y1="392" x2="285.33" y2="52" class="line"/>
<circle cx="202" cy="302" r="4" class="pt"/><text x="212" y="320" class="label">(1,-1)</text>
<circle cx="246" cy="170" r="4" class="pt"/><text x="256" y="165" class="label">(3,5)</text>
<circle cx="180" cy="368" r="4" class="pt"/><text x="188" y="364" class="label">(0,-4)</text>
<line x1="202" y1="302" x2="246" y2="302" class="aux"/><line x1="246" y1="302" x2="246" y2="170" class="aux"/>
<text x="214" y="326" class="note">Δx=2</text><text x="255" y="238" class="note">Δy=6</text>
<text x="330" y="105" class="label">y=3x-4</text>
<rect x="520" y="52" width="250" height="340" rx="12" fill="#f8fafc" stroke="#d1d5db"/>
<text x="542" y="90" class="head">결정 단계</text>
<text x="542" y="136" class="note">기울기 a = 6/2 = 3</text>
<text x="542" y="184" class="note">-1 = 3·1 + b</text>
<text x="542" y="212" class="label">b = -4</text>
<text x="542" y="282" class="label">3a+b = 5</text>
</svg>