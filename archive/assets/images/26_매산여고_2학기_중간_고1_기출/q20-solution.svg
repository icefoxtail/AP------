<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 480" width="840" height="480" role="img" aria-labelledby="title desc" data-visual-type="geometry" data-geometry-mode="COORDINATE_GEOMETRY" data-axis-scale-mode="EQUAL_UNIT">
<title id="title">대칭점 C와 삼각형 ODE의 외접원</title>
<desc id="desc">O=(0,0), A=(2,1), B=(0,2), A의 y=x 대칭점 C=(1,2), D=(4/3,4/3), E=(4/5,8/5)와 지름 OD인 삼각형 ODE의 외접원을 표시한다.</desc>
<style>.axis{stroke:#9ca3af;stroke-width:1}.tri{stroke:#111827;stroke-width:2;fill:none}.guide{stroke:#64748b;stroke-width:1.4;stroke-dasharray:6 4}.circ{stroke:#2563eb;stroke-width:2.2;fill:#dbeafe;fill-opacity:.18}.diam{stroke:#b91c1c;stroke-width:2}.pt{fill:#111827}.hi{fill:#b91c1c}.label{font:600 14px "Noto Sans KR","Malgun Gothic",sans-serif;fill:#111827}.note{font:13px "Noto Sans KR","Malgun Gothic",sans-serif;fill:#374151}.head{font:700 17px "Noto Sans KR","Malgun Gothic",sans-serif;fill:#111827}</style>
<rect width="840" height="480" fill="#fff"/>
<text x="28" y="32" class="head">대칭으로 A를 정하고, E의 직각으로 외접원을 정한다</text>
<rect x="28" y="52" width="520" height="400" rx="12" fill="#fff" stroke="#d1d5db"/>
<line x1="70" y1="350" x2="520" y2="350" class="axis"/><line x1="100" y1="76" x2="100" y2="425" class="axis"/>
<line x1="100" y1="350" x2="430" y2="20" class="guide"/><line x1="100" y1="350" x2="270" y2="10" class="guide"/>
<polyline points="100,350 300,250 100,150 100,350" class="tri"/>
<line x1="300" y1="250" x2="200" y2="150" class="guide"/>
<circle cx="167" cy="283" r="94.3" class="circ"/>
<line x1="100" y1="350" x2="233" y2="217" class="diam"/>
<circle cx="100" cy="350" r="4" class="pt"/><text x="78" y="372" class="label">O</text>
<circle cx="300" cy="250" r="4" class="pt"/><text x="310" y="246" class="label">A(2,1)</text>
<circle cx="100" cy="150" r="4" class="pt"/><text x="48" y="144" class="label">B(0,2)</text>
<circle cx="200" cy="150" r="4" class="pt"/><text x="210" y="144" class="label">C(1,2)</text>
<circle cx="233" cy="217" r="5" class="hi"/><text x="242" y="212" class="label">D(4/3,4/3)</text>
<circle cx="180" cy="190" r="5" class="hi"/><text x="132" y="184" class="label">E(4/5,8/5)</text>
<text x="118" y="250" class="note">OE ⟂ DE</text><text x="164" y="320" class="note">OD=4√2/3</text>
<rect x="575" y="52" width="235" height="400" rx="12" fill="#f8fafc" stroke="#d1d5db"/>
<text x="597" y="90" class="head">결정 단계</text>
<text x="597" y="138" class="note">A=(2,1), B=(0,2)</text>
<text x="597" y="184" class="note">D=(4/3,4/3)</text>
<text x="597" y="224" class="note">E=(4/5,8/5)</text>
<text x="597" y="274" class="note">∠OED=90°</text>
<text x="597" y="316" class="note">OD가 외접원의 지름</text>
<text x="597" y="366" class="label">둘레 = (4√2/3)π</text>
</svg>