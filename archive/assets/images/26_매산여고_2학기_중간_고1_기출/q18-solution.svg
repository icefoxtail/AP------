<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 480" width="920" height="480" role="img" aria-labelledby="title desc" data-visual-type="geometry" data-geometry-mode="COORDINATE_GEOMETRY_CASES" data-axis-scale-mode="PANEL_LOCAL">
<title id="title">접선이 서로 수직이 되는 두 직선 y=mx</title>
<desc id="desc">m=1과 m=31/17의 두 경우를 나누어, 중심 C=(3,4), 반지름 1인 원의 현 AB, CH=sqrt2/2, 두 접점에서 서로 수직인 접선을 표시한다.</desc>
<style>.axis{stroke:#9ca3af;stroke-width:1}.circle{stroke:#111827;stroke-width:2;fill:#dbeafe;fill-opacity:.22}.sec{stroke:#2563eb;stroke-width:2}.tan{stroke:#b91c1c;stroke-width:2}.rad{stroke:#475569;stroke-width:1.6}.pt{fill:#111827}.tp{fill:#b91c1c}.label{font:600 13px "Noto Sans KR","Malgun Gothic",sans-serif;fill:#111827}.note{font:13px "Noto Sans KR","Malgun Gothic",sans-serif;fill:#374151}.head{font:700 16px "Noto Sans KR","Malgun Gothic",sans-serif;fill:#111827}</style>
<rect width="920" height="480" fill="#fff"/>
<text x="28" y="32" class="head">접점 반지름 CA, CB도 서로 수직</text>
<rect x="28" y="54" width="410" height="390" rx="12" fill="#fff" stroke="#d1d5db"/>
<text x="48" y="82" class="head">경우 1 : m=1</text>
<line x1="62" y1="340" x2="414" y2="340" class="axis"/><line x1="92" y1="88" x2="92" y2="420" class="axis"/>
<circle cx="272" cy="100" r="60" class="circle"/>
<line x1="92" y1="340" x2="390" y2="42" class="sec"/>
<line x1="272" y1="100" x2="332" y2="100" class="rad"/><line x1="272" y1="100" x2="272" y2="160" class="rad"/>
<line x1="332" y1="52" x2="332" y2="190" class="tan"/><line x1="220" y1="160" x2="360" y2="160" class="tan"/>
<circle cx="272" cy="100" r="4" class="pt"/><text x="246" y="86" class="label">C</text>
<circle cx="332" cy="100" r="5" class="tp"/><text x="340" y="94" class="label">A(4,4)</text>
<circle cx="272" cy="160" r="5" class="tp"/><text x="278" y="180" class="label">B(3,3)</text>
<text x="48" y="410" class="note">CH=√2/2, 접선은 x=4, y=3</text>
<rect x="472" y="54" width="420" height="390" rx="12" fill="#fff" stroke="#d1d5db"/>
<text x="492" y="82" class="head">경우 2 : m=31/17</text>
<circle cx="700" cy="150" r="60" class="circle"/>
<line x1="570" y1="299" x2="720" y2="24" class="sec"/>
<line x1="700" y1="150" x2="683" y2="92" class="rad"/><line x1="700" y1="150" x2="642" y2="167" class="rad"/>
<line x1="635" y1="106" x2="731" y2="78" class="tan"/><line x1="625" y1="109" x2="659" y2="225" class="tan"/>
<circle cx="700" cy="150" r="4" class="pt"/><text x="708" y="146" class="label">C(3,4)</text>
<circle cx="683" cy="92" r="5" class="tp"/><text x="692" y="78" class="label">A</text>
<circle cx="642" cy="167" r="5" class="tp"/><text x="606" y="188" class="label">B</text>
<circle cx="663" cy="130" r="4" class="pt"/><text x="612" y="126" class="label">H</text>
<text x="492" y="350" class="note">A=(68/25,124/25), B=(51/25,93/25)</text>
<text x="492" y="382" class="note">CH=√2/2, 두 접선은 서로 수직</text>
<text x="492" y="418" class="label">m의 곱 = 31/17</text>
</svg>