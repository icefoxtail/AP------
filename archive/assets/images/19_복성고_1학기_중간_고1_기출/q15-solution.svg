<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-labelledby="title desc" data-visual-type="geometry" data-scale-policy="EQUAL_UNIT_REQUIRED">
 <title id="title">원에 내접한 직각이등변삼각형</title>
 <desc id="desc">중심 O가 (260,190)인 원에서 A(132,190), B(388,190), C(260,62)이다. 원의 지름 AB=20, 두 직각변 BC와 CA가 같으며, 점 C에서 직각임을 보여 준다.</desc>
 <rect x="0" y="0" width="640" height="360" fill="#fff"/>
 <text x="26" y="31" font-family="Noto Sans KR, Pretendard, Malgun Gothic, sans-serif" font-size="18" font-weight="700" fill="#14213d">인수분해 → 직각삼각형 → 넓이</text>
 <circle cx="260" cy="190" r="128" fill="none" stroke="#64748b" stroke-width="2.5"/>
 <polygon points="132,190 388,190 260,62" fill="#dbeafe" fill-opacity="0.46" stroke="#2563eb" stroke-width="3" stroke-linejoin="round"/>
 <line x1="260" y1="62" x2="260" y2="190" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6,5"/>
 <path d="M247.5 74.5 L260 87 L272.5 74.5" fill="none" stroke="#059669" stroke-width="2"/>
 <g fill="#111827" font-family="Noto Sans KR, Pretendard, Malgun Gothic, sans-serif" font-size="16">
   <text x="110" y="195">A</text>
   <text x="397" y="195">B</text>
   <text x="256" y="48">C</text>
   <text x="255" y="209">O</text>
 </g>
 <g font-family="Noto Sans KR, Pretendard, Malgun Gothic, sans-serif" font-size="15" fill="#1d4ed8">
   <text x="166" y="114">b</text>
   <text x="349" y="114">a</text>
   <text x="251" y="227">c=20</text>
 </g>
 <g font-family="Noto Sans KR, Pretendard, Malgun Gothic, sans-serif" font-size="14" fill="#14532d">
   <text x="463" y="92">a = b</text>
   <text x="463" y="119">c² = a² + b²</text>
   <text x="463" y="151">∠C = 90°</text>
   <text x="463" y="190">AB: 지름 20</text>
   <text x="463" y="232">넓이 = ab/2</text>
   <text x="463" y="262">= 100</text>
 </g>
 <text x="23" y="334" font-family="Noto Sans KR, Pretendard, Malgun Gothic, sans-serif" font-size="12" fill="#334155">도형은 길이 비례 모식도이며 점·직각·지름 관계를 실제 좌표로 구성하였다.</text>
</svg>
