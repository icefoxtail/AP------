<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="UNEQUAL_UNIT_DECLARED" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">f′(x)=3(x-1)(x+1)이므로 x=-1, 1에서 f′=0이고 그림의 극대점 M(-1,6)과 극소점 N(1,2)에서 접선이 수평이다. x&lt;-1과 x&gt;1에서는 f′&gt;0이라 곡선이 오르고, -1&lt;x&lt;1에서는 f′&lt;0이라 M에서 N까지 곡선이 내려간다. 따라서 감소하는 구간은 [-1,1]이고 답은 ①이다.</title><desc id="visual-desc">왼쪽에서 올라와 점 M에서 꼭대기에 이른 뒤 점 N까지 내려가 가장 낮고, 다시 오른쪽 위로 올라가는 삼차곡선 그래프이다.</desc><rect width="512" height="512" fill="#fff"/><g data-layer="30"><line id="x-axis" data-role="axis" stroke="#111" stroke-width="1.2" fill="none" data-axis="x" x1="32" y1="440" x2="480" y2="440"/></g><g data-layer="30"><line id="y-axis" data-role="axis" stroke="#111" stroke-width="1.2" fill="none" data-axis="y" x1="256" y1="480" x2="256" y2="32"/></g><g data-layer="40"><polyline id="f-piece-1-branch-0" data-role="curve" stroke="#111" stroke-width="2.1" fill="none" data-branch="PIECE_1" points="72,317.333333333 73.230769231,310.014431663 74.461538462,302.826370037 75.692307692,295.768267377 76.923076923,288.839242606 78.153846154,282.038414645 79.384615385,275.364902417 80.615384615,268.817824845 81.846153846,262.39630085 83.076923077,256.099449355 84.307692308,249.926389282 85.538461538,243.876239553 86.769230769,237.948119091 88,232.141146818 89.230769231,226.454441656 90.461538462,220.887122527 91.69230769