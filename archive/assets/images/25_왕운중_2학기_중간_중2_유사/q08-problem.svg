<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 360" width="460" height="360" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">직선 l이 꼭짓점 A를 지나고 변 BC와 만나지 않으며, 점 B와 C에서 l에 내린 수선의 발이 각각 D와 E인 직각이등변삼각형 ABC를 나타낸 그림이다. BD는 9, CE는 7로 주어져 있다.</title><desc id="visual-desc">직선 l 위에 점 A가 있고, A를 지나는 두 선분 AB와 AC가 직각을 이루며 길이가 같다. B와 C는 l 아래쪽에 있고, B에서 l에 내린 수선의 발이 D, C에서 내린 수선의 발이 E이며 BD는 9, CE는 7로 표시되어 있다.</desc><rect width="460" height="360" fill="#fff"/><g data-layer="30"><line id="sL1L2" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="53.214285714" y1="110.822981366" x2="406.785714286" y2="110.822981366"/></g><g data-layer="30"><line id="sBC" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="114.704968944" y1="249.177018634" x2="360.667701863" y2="218.431677019"/></g><g data-layer="30"><line id="sBD" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="114.704968944" y1="249.177018634" x2="114.704968944" y2="110.822981366"/></g><g data-layer="30"><line id="sCE" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="360.667701863" y1="218.431677019" x2="360.667701863" y2="110.822981366"/></g><g data-layer="31"><line id="sAB" data-role="line" stroke="#b8325f" stroke-width="2.4" fill="none" x1="222.313664596" y1="110.822981366" x2="114.704968944" y2="249.177018634"/></g><g data-layer="