<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 360" width="420" height="360" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">정삼각형 탁자에서는 120도씩 회전한 세 배치가 같은 것이므로 6!을 3으로 나눈다. 6!/3=720/3=240이다. 따라서 답은 ①이다.</title><desc id="visual-desc">점선으로 그린 정삼각형 탁자가 있고, 그 세 변 바깥에 좌석 점이 두 개씩 놓여 있으며 각 변에 좌석 수 2가 적혀 있다.</desc><rect width="420" height="360" fill="#fff"/><g data-layer="30"><line id="sAB" data-role="line" stroke="#111" stroke-width="1.6" fill="none" stroke-dasharray="6 4" x1="210" y1="47.857142857" x2="82.119815668" y2="260.99078341"/></g><g data-layer="30"><line id="sBC" data-role="line" stroke="#111" stroke-width="1.6" fill="none" stroke-dasharray="6 4" x1="82.119815668" y1="260.99078341" x2="337.880184332" y2="260.99078341"/></g><g data-layer="30"><line id="sCA" data-role="line" stroke="#111" stroke-width="1.6" fill="none" stroke-dasharray="6 4" x1="337.880184332" y1="260.99078341" x2="210" y2="47.857142857"/></g><g data-layer="70"><circle id="A" data-role="point" stroke="#111" stroke-width="0.8" fill="#111" cx="210" cy="47.857142857" r="3.2"/></g><g data-layer="70"><circle id="B" data-role="point" stroke="#111" stroke-width="0.8" fill="#111" cx="82.119815668" cy="260.99078341" r="3.2"/></g><g data-layer="70"><circle id="C" data-role="point" stroke="#111" stroke-width="0.8" fill="#111" cx="337.880184332" cy="260.99078341" r="3.2"/