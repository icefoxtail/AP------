<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" width="480" height="480" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">대우 &quot;x≤3이고 y≤2k이면 x+y≤9&quot;가 참이려면 x=3, y=2k일 때의 합 3+2k가 9 이하여야 한다. 그림은 k=3일 때 직선 x=3(파랑)과 y=6(주황)의 교점 (3,6)이 직선 x+y=9(분홍) 위에 놓인 경우이다. 따라서 k≤3이므로 최댓값은 3이고 답은 ①이다.</title><desc id="visual-desc">점과 도형의 관계를 확인한다.</desc><rect width="480" height="480" fill="#fff"/><g data-layer="30"><line id="x-axis" data-role="axis" stroke="#111" stroke-width="1.2" fill="none" data-axis="x" x1="32" y1="362.352941176" x2="448" y2="362.352941176"/></g><g data-layer="30"><line id="y-axis" data-role="axis" stroke="#111" stroke-width="1.2" fill="none" data-axis="y" x1="117.647058824" y1="448" x2="117.647058824" y2="32"/></g><g data-layer="40"><line id="l1" data-role="line" stroke="#b8325f" stroke-width="2.4" fill="none" x1="32" y1="32" x2="448" y2="448"/></g><g data-layer="40"><line id="l2" data-role="line" stroke="#1f5fa8" stroke-width="2.4" fill="none" x1="199.215686275" y1="448" x2="199.215686275" y2="32"/></g><g data-layer="40"><line id="l3" data-role="line" stroke="#b85c00" stroke-width="2.4" fill="none" x1="32" y1="199.215686275" x2="448" y2="199.215686275"/></g><g data-layer="70"><circle id="O" data-role="point" stroke="#111" stroke-width="0.8" fill="#111" cx="117.647058824" cy="362.352941176" r="3.2"/></g><g data-laye