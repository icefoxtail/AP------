<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 648" width="680" height="648" role="img" aria-labelledby="title desc"><title id="title">두 좌표축과 내리막 직선에 둘러싸인 삼각형</title><desc id="desc">보라색 내리막 직선은 가로축의 6/a와 세로축의 −6을 지난다. 원점과 두 절편으로 이루어진 삼각형을 칠했다.</desc><rect width="680" height="648" fill="white" /><polygon points="180.8750,274.3072 418.3750,274.3072 418.3750,536.0972" fill="#dfeee8" /><line x1="74.0000" y1="274.3072" x2="593.0000" y2="274.3072" stroke="#586574" stroke-width="2.05" stroke-linecap="round" /><polygon points="606.0000,274.3072 593.0000,269.1072 593.0000,279.5072" fill="#586574" /><line x1="418.3750" y1="595.0000" x2="418.3750" y2="101.0000" stroke="#586574" stroke-width="2.05" stroke-linecap="round" /><polygon points="418.3750,88.0000 413.1750,101.0000 423.5750,101.0000" fill="#586574" /><line x1="78.7737" y1="161.7637" x2="467.0387" y2="589.7380" stroke="#754596" stroke-width="6.8" stroke-linecap="round" /><circle cx="180.87499999999997" cy="274.3072289156626" r="7" fill="#754596" stroke="white" stroke-width="2" /><circle cx="418.375" cy="536.0972461273666" r="7" fill="#754596" stroke="white" stroke-width="2" /><line x1="180.0000" y1="39.0000" x2="225.0000" y2="39.0000" stroke="#754596" stroke-width="5.65" stroke-linecap="round" /><text x="236.0000" y="46.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#754596" text-anchor="start">y = ax − 6</text><text x="622.000" y="261.307" fill="#586574" font-size="29" font-weight="600" font-family="Malgun Gothic, Cambria Math, sans-serif" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="4.0" stroke-linejoin="round">x</text><text x="437.375" y="83.000" fill="#586574" font-size="29" font-weight="600" font-family="Malgun Gothic, Cambria Math, sans-serif" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="4.0" stroke-linejoin="round">y</text><text x="440.375" y="258.307" fill="#586574" font-size="29" font-weight="600" font-family="Malgun Gothic, Cambria Math, sans-serif" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="4.0" stroke-linejoin="round">O</text><text x="207.875" y="239.307" fill="#754596" font-size="29" font-weight="600" font-family="Malgun Gothic, Cambria Math, sans-serif" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="4.0" stroke-linejoin="round">(6/a, 0)</text><text x="499.375" y="546.097" fill="#754596" font-size="29" font-weight="600" font-family="Malgun Gothic, Cambria Math, sans-serif" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="4.0" stroke-linejoin="round">(0, −6)</text><text x="337.229" y="369.115" fill="#227164" font-size="29" font-weight="600" font-family="Malgun Gothic, Cambria Math, sans-serif" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="4.0" stroke-linejoin="round">넓이 18</text></svg>
