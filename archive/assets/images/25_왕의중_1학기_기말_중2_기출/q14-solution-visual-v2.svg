<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 713 621" width="713" height="621" role="img" aria-labelledby="title desc"><title id="title">내리막 직선의 절편과 두 평행선</title><desc id="desc">파란 직선은 (−8,3), (−4,0), (0,−3)을 지난다. 주황 점선과 기울기가 같고 세로축 절편은 다르다.</desc><rect width="713" height="621" fill="white" /><line x1="74.0000" y1="322.4945" x2="626.0000" y2="322.4945" stroke="#586574" stroke-width="2.05" stroke-linecap="round" /><polygon points="639.0000,322.4945 626.0000,317.2945 626.0000,327.6945" fill="#586574" /><line x1="477.9002" y1="568.0000" x2="477.9002" y2="101.0000" stroke="#586574" stroke-width="2.05" stroke-linecap="round" /><polygon points="477.9002,88.0000 472.7002,101.0000 483.1002,101.0000" fill="#586574" /><line x1="80.7002" y1="128.1092" x2="625.6512" y2="562.6572" stroke="#226298" stroke-width="6.8" stroke-linecap="round" /><line x1="340.8784" y1="90.8873" x2="635.3791" y2="325.7244" stroke="#a64d1e" stroke-width="6.8" stroke-linecap="round" stroke-dasharray="12 7" /><circle cx="171.04344874405973" cy="200.14953271028043" r="7" fill="#226298" stroke="white" stroke-width="2" /><circle cx="324.4718262050237" cy="322.4944774851317" r="7" fill="#226298" stroke="white" stroke-width="2" /><circle cx="477.90020366598776" cy="444.839422259983" r="7" fill="#226298" stroke="white" stroke-width="2" /><line x1="48.0000" y1="39.0000" x2="93.0000" y2="39.0000" stroke="#226298" stroke-width="5.65" stroke-linecap="round" /><text x="104.0000" y="46.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#226298" text-anchor="start">y = −(3/4)x − 3</text><line x1="363.0000" y1="39.0000" x2="408.0000" y2="39.0000" stroke="#a64d1e" stroke-width="5.65" stroke-linecap="round" stroke-dasharray="12 7" /><text x="419.0000" y="46.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#a64d1e" text-anchor="start">y = −(3/4)x + 3</text><text x="655.000" y="309.494" fill="#586574" font-size="29" font-weight="600" font-family="Malgun Gothic, Cambria Math, sans-serif" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="4.0" stroke-linejoin="round">x</text><text x="496.900" y="83.000" fill="#586574" font-size="29" font-weight="600" font-family="Malgun Gothic, Cambria Math, sans-serif" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="4.0" stroke-linejoin="round">y</text><text x="454.900" y="347.494" fill="#586574" font-size="29" font-weight="600" font-family="Malgun Gothic, Cambria Math, sans-serif" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="4.0" stroke-linejoin="round">O</text><text x="188.043" y="163.150" fill="#226298" font-size="29" font-weight="600" font-family="Malgun Gothic, Cambria Math, sans-serif" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="4.0" stroke-linejoin="round">(−8, 3)</text><text x="305.472" y="283.494" fill="#226298" font-size="29" font-weight="600" font-family="Malgun Gothic, Cambria Math, sans-serif" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="4.0" stroke-linejoin="round">(−4, 0)</text><text x="549.900" y="456.839" fill="#226298" font-size="29" font-weight="600" font-family="Malgun Gothic, Cambria Math, sans-serif" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="4.0" stroke-linejoin="round">(0, −3)</text></svg>
