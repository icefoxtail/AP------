<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 723 699" width="723" height="699" role="img" aria-labelledby="title desc"><title id="title">제1사분면을 피하는 두 경계의 예</title><desc id="desc">a=−1의 청록 실선은 y=−8이고 a=7의 보라 점선은 y=−8x이다. 두 경계 직선은 오른쪽 위에 칠한 제1사분면을 지나지 않는다.</desc><rect width="723" height="699" fill="white" /><rect x="284.9193011647254" y="90.0" width="363.0806988352746" height="157.77358490566036" rx="7" fill="#edf5f2" /><line x1="79.0000" y1="247.7736" x2="635.0000" y2="247.7736" stroke="#586574" stroke-width="2.05" stroke-linecap="round" /><polygon points="648.0000,247.7736 635.0000,242.5736 635.0000,252.9736" fill="#586574" /><line x1="284.9193" y1="655.0000" x2="284.9193" y2="103.0000" stroke="#586574" stroke-width="2.05" stroke-linecap="round" /><polygon points="284.9193,90.0000 279.7193,103.0000 290.1193,103.0000" fill="#586574" /><line x1="85.8280" y1="588.9057" x2="641.1720" y2="588.9057" stroke="#227164" stroke-width="6.8" stroke-linecap="round" /><line x1="263.9664" y1="96.7800" x2="340.4879" y2="648.2200" stroke="#754596" stroke-width="6.8" stroke-linecap="round" stroke-dasharray="12 7" /><circle cx="284.9193011647254" cy="588.9056603773585" r="7" fill="#227164" stroke="white" stroke-width="2" /><line x1="48.0000" y1="39.0000" x2="93.0000" y2="39.0000" stroke="#227164" stroke-width="5.65" stroke-linecap="round" /><text x="104.0000" y="46.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#227164" text-anchor="start">a = −1  ·  y = −8</text><line x1="368.0000" y1="39.0000" x2="413.0000" y2="39.0000" stroke="#754596" stroke-width="5.65" stroke-linecap="round" stroke-dasharray="12 7" /><text x="424.0000" y="46.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#754596" text-anchor="start">a = 7  ·  y = −8x</text><text x="664.000" y="234.774" fill="#586574" font-size="29" font-weight="600" font-family="Malgun Gothic, Cambria Math, sans-serif" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="4.0" stroke-linejoin="round">x</text><text x="303.919" y="85.000" fill="#586574" font-size="29" font-weight="600" font-family="Malgun Gothic, Cambria Math, sans-serif" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="4.0" stroke-linejoin="round">y</text><text x="262.919" y="229.774" fill="#586574" font-size="29" font-weight="600" font-family="Malgun Gothic, Cambria Math, sans-serif" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="4.0" stroke-linejoin="round">O</text><text x="451.601" y="164.491" fill="#227164" font-size="29" font-weight="600" font-family="Malgun Gothic, Cambria Math, sans-serif" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="4.0" stroke-linejoin="round">제1사분면</text><text x="207.919" y="569.906" fill="#227164" font-size="29" font-weight="600" font-family="Malgun Gothic, Cambria Math, sans-serif" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="4.0" stroke-linejoin="round">(0, −8)</text></svg>
