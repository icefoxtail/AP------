<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 713 621" width="713" height="621" role="img" aria-labelledby="title desc"><title id="title">두 직선과 가로축이 만드는 삼각형</title><desc id="desc">파란 직선 x+y−4=0은 (4,0)을, 주황 점선 2x−3y+2=0은 (−1,0)을 지난다. 두 직선이 만나는 (2,2)에서 가로축으로 내린 선의 길이는 2이다.</desc><rect width="713" height="621" fill="white" /><polygon points="226.7027,393.0569 481.2072,393.0569 379.4054,283.7175" fill="#dfeee8" /><line x1="74.0000" y1="393.0569" x2="626.0000" y2="393.0569" stroke="#586574" stroke-width="2.05" stroke-linecap="round" /><polygon points="639.0000,393.0569 626.0000,387.8569 626.0000,398.2569" fill="#586574" /><line x1="277.6036" y1="568.0000" x2="277.6036" y2="101.0000" stroke="#586574" stroke-width="2.05" stroke-linecap="round" /><polygon points="277.6036,88.0000 272.4036,101.0000 282.8036,101.0000" fill="#586574" /><line x1="202.4820" y1="93.6944" x2="633.6982" y2="556.8386" stroke="#226298" stroke-width="6.8" stroke-linecap="round" /><line x1="80.7800" y1="497.5417" x2="632.2200" y2="102.6952" stroke="#a64d1e" stroke-width="6.8" stroke-linecap="round" stroke-dasharray="12 7" /><line x1="379.4054" y1="393.0569" x2="379.4054" y2="283.7175" stroke="#227164" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="7 5" /><circle cx="481.2072072072072" cy="393.0569476082005" r="7" fill="#226298" stroke="white" stroke-width="2" /><circle cx="226.7027027027027" cy="393.0569476082005" r="7" fill="#a64d1e" stroke="white" stroke-width="2" /><circle cx="379.4054054054054" cy="283.7175398633258" r="7" fill="#227164" stroke="white" stroke-width="2" /><line x1="48.0000" y1="39.0000" x2="93.0000" y2="39.0000" stroke="#226298" stroke-width="5.65" stroke-linecap="round" /><text x="104.0000" y="46.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#226298" text-anchor="start">x + y − 4 = 0</text><line x1="363.0000" y1="39.0000" x2="408.0000" y2="39.0000" stroke="#a64d1e" stroke-width="5.65" stroke-linecap="round" stroke-dasharray="12 7" /><text x="419.0000" y="46.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#a64d1e" text-anchor="start">2x − 3y + 2 = 0</text><text x="655.000" y="380.057" fill="#586574" font-size="29" font-weight="600" font-family="Malgun Gothic, Cambria Math, sans-serif" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="4.0" stroke-linejoin="round">x</text><text x="296.604" y="83.000" fill="#586574" font-size="29" font-weight="600" font-family="Malgun Gothic, Cambria Math, sans-serif" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="4.0" stroke-linejoin="round">y</text><text x="254.604" y="418.057" fill="#586574" font-size="29" font-weight="600" font-family="Malgun Gothic, Cambria Math, sans-serif" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="4.0" stroke-linejoin="round">O</text><text x="537.207" y="376.057" fill="#226298" font-size="29" font-weight="600" font-family="Malgun Gothic, Cambria Math, sans-serif" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="4.0" stroke-linejoin="round">(4, 0)</text><text x="251.703" y="440.057" fill="#a64d1e" font-size="29" font-weight="600" font-family="Malgun Gothic, Cambria Math, sans-serif" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="4.0" stroke-linejoin="round">(−1, 0)</text><text x="383.405" y="229.718" fill="#227164" font-size="29" font-weight="600" font-family="Malgun Gothic, Cambria Math, sans-serif" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="4.0" stroke-linejoin="round">(2, 2)</text><text x="403.405" y="347.387" fill="#227164" font-size="29" font-weight="600" font-family="Malgun Gothic, Cambria Math, sans-serif" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="4.0" stroke-linejoin="round">2</text></svg>
