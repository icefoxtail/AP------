<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 692" width="720" height="692" role="img" aria-labelledby="title desc"><title id="title">두 직선이 좌표축과 만나는 네 점</title><desc id="desc">오르막 직선은 세로축 B와 가로축 C를, 내리막 직선은 세로축 A와 가로축 D를 지난다. A=(0,4), B=(0,−6), C=(4,0), D=(6,0)이다.</desc><rect width="720" height="692" fill="white" /><line x1="75.0000" y1="336.8959" x2="630.0000" y2="336.8959" stroke="#586574" stroke-width="2.05" stroke-linecap="round" /><polygon points="643.0000,336.8959 630.0000,331.6959 630.0000,342.0959" fill="#586574" /><line x1="218.7388" y1="638.0000" x2="218.7388" y2="100.0000" stroke="#586574" stroke-width="2.05" stroke-linecap="round" /><polygon points="218.7388,87.0000 213.5388,100.0000 223.9388,100.0000" fill="#586574" /><line x1="181.9973" y1="631.3880" x2="587.7796" y2="93.6120" stroke="#226298" stroke-width="7" stroke-linecap="round" /><line x1="81.8160" y1="92.3803" x2="636.1840" y2="418.9109" stroke="#a64d1e" stroke-width="6.6" stroke-linecap="round" stroke-dasharray="12 8" /><circle cx="218.73877551020408" cy="173.02973977695171" r="6.8" fill="#a64d1e" stroke="white" stroke-width="2" /><circle cx="218.73877551020408" cy="582.6951672862454" r="6.8" fill="#226298" stroke="white" stroke-width="2" /><circle cx="404.2081632653061" cy="336.8959107806691" r="6.8" fill="#226298" stroke="white" stroke-width="2" /><circle cx="496.9428571428572" cy="336.8959107806691" r="6.8" fill="#a64d1e" stroke="white" stroke-width="2" /><line x1="68.0000" y1="39.0000" x2="113.0000" y2="39.0000" stroke="#226298" stroke-width="5.65" stroke-linecap="round" /><text x="124.0000" y="46.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#226298" text-anchor="start">y = (3/2)x − 6</text><line x1="380.0000" y1="39.0000" x2="425.0000" y2="39.0000" stroke="#a64d1e" stroke-width="5.65" stroke-linecap="round" stroke-dasharray="12 8" /><text x="436.0000" y="46.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#a64d1e" text-anchor="start">y = −(2/3)x + 4</text><text x="659.000" y="323.896" fill="#586574" font-size="29" font-weight="600" font-family="Malgun Gothic, Cambria Math, sans-serif" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="4.0" stroke-linejoin="round">x</text><text x="237.739" y="82.000" fill="#586574" font-size="29" font-weight="600" font-family="Malgun Gothic, Cambria Math, sans-serif" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="4.0" stroke-linejoin="round">y</text><text x="197.739" y="360.896" fill="#586574" font-size="29" font-weight="600" font-family="Malgun Gothic, Cambria Math, sans-serif" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="4.0" stroke-linejoin="round">O</text><text x="290.739" y="160.030" fill="#a64d1e" font-size="29" font-weight="600" font-family="Malgun Gothic, Cambria Math, sans-serif" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="4.0" stroke-linejoin="round">A (0, 4)</text><text x="308.739" y="592.695" fill="#226298" font-size="29" font-weight="600" font-family="Malgun Gothic, Cambria Math, sans-serif" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="4.0" stroke-linejoin="round">B (0, −6)</text><text x="452.208" y="405.896" fill="#226298" font-size="29" font-weight="600" font-family="Malgun Gothic, Cambria Math, sans-serif" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="4.0" stroke-linejoin="round">C (4, 0)</text><text x="560.943" y="437.896" fill="#a64d1e" font-size="29" font-weight="600" font-family="Malgun Gothic, Cambria Math, sans-serif" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="4.0" stroke-linejoin="round">D (6, 0)</text></svg>
