<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 460" width="460" height="460" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">네 영역 A, B, C, D로 나뉜 도형이다. 영역 B와 D는 서로 맞닿아 있고, A와 C는 각각 B, D와 이웃하지만 A와 C는 서로 맞닿지 않는다.</title><desc id="visual-desc">가로로 긴 직사각형이 위아래 두 줄과 가운데 두 칸으로 나뉘어 A, B, D, C 영역이 보인다. 가운데 왼쪽이 B, 가운데 오른쪽이 D이고 B와 D가 맞닿아 있다.</desc><rect width="460" height="460" fill="#fff"/><g data-layer="10"><path id="rA" data-role="region" stroke="none" stroke-width="1.6" fill="#e4e7ec" data-owner-points="p04 p06 p64 p66" data-mark="region" data-mark-id="rA" fill-rule="evenodd" d="M53.214285714 171.071428571 L406.785714286 171.071428571 L406.785714286 53.214285714 L53.214285714 53.214285714 L53.214285714 171.071428571 Z"/></g><g data-layer="10"><path id="rB" data-role="region" stroke="none" stroke-width="1.6" fill="#e4e7ec" data-owner-points="p02 p04 p32 p34" data-mark="region" data-mark-id="rB" fill-rule="evenodd" d="M53.214285714 288.928571429 L230 288.928571429 L230 171.071428571 L53.214285714 171.071428571 L53.214285714 288.928571429 Z"/></g><g data-layer="10"><path id="rD" data-role="region" stroke="none" stroke-width="1.6" fill="#e4e7ec" data-owner-points="p32 p34 p62 p64" data-mark="region" data-mark-id="rD" fill-rule="evenodd" d="M230 288.928571429 L406.785714286 288.928571429 L406.785714286 171.071428571 L230 171.071428571 L230