<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 384 320" width="384" height="320" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">직각삼각형 ABC의 세 변을 각각 지름으로 하는 반원을 그린 그림이다. 두 직각변 위의 반원에서 빗변의 반원과 겹치지 않는 두 초승달 모양 부분을 색칠하였고, 변 AB의 길이 12와 빗변 BC의 길이 15를 나타내었다.</title><desc id="visual-desc">삼각형 ABC의 세 변 바깥쪽에 반원이 그려져 있고, 두 직각변 위의 반원과 빗변의 반원 사이에 생기는 두 초승달 모양 영역이 색칠되어 있다. 점 A에 직각 표시가 있고 변 AB 옆에 12, 변 BC 옆에 15가 적혀 있다.</desc><rect width="384" height="320" fill="#fff"/><g data-layer="10"><path id="luneAB" data-role="region" stroke="none" stroke-width="1.6" fill="#c7ccd5" data-owner-points="A B M O" data-mark="region" data-mark-id="luneAB" fill-rule="evenodd" d="M135.462897527 182.614840989 A90.459363958 90.459363958 0 0 0 316.381625442 182.614840989 A113.074204947 113.074204947 0 0 1 135.462897527 182.614840989 Z"/></g><g data-layer="10"><path id="luneAC" data-role="region" stroke="none" stroke-width="1.6" fill="#c7ccd5" data-owner-points="A C N O" data-mark="region" data-mark-id="luneAC" fill-rule="evenodd" d="M135.462897527 46.925795053 A67.844522968 67.844522968 0 0 0 135.462897527 182.614840989 A113.074204947 113.074204947 0 0 1 135.462897527 46.925795053 Z"/></g><g data-layer="30"><line id="AB" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="135.462897527" y1="182.614840989" x2="316.381625442" y2="182.614840989"/></g><g data