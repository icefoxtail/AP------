<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 706 510" width="706" height="510" role="img" aria-labelledby="title desc"><title id="title">삼각형 내부를 지나는 원점에서 출발한 직선</title><desc id="desc">오렌지 내리막 그래프와 두 좌표축이 만드는 삼각형을 검은 y=mx 직선이 지난다.</desc><rect width="706" height="510" fill="white" /><line x1="85.0000" y1="340.0376" x2="615.0000" y2="340.0376" stroke="#586574" stroke-width="2.05" stroke-linecap="round" /><polygon points="628.0000,340.0376 615.0000,334.8376 615.0000,345.2376" fill="#586574" /><line x1="207.9434" y1="441.0000" x2="207.9434" y2="81.0000" stroke="#586574" stroke-width="2.05" stroke-linecap="round" /><polygon points="207.9434,68.0000 202.7434,81.0000 213.1434,81.0000" fill="#586574" /><polygon points="207.9434,340.0376 207.9434,171.7669 481.1509,340.0376" fill="none" /><line x1="94.7740" y1="102.0650" x2="618.2260" y2="424.4632" stroke="#a34c1f" stroke-width="7.0" stroke-linecap="round" /><line x1="94.7740" y1="409.7395" x2="618.2260" y2="87.3413" stroke="#202020" stroke-width="7.0" stroke-linecap="round" /><text x="644.000" y="327.038" fill="#586574" font-size="32" font-weight="600" font-family="Malgun Gothic, Cambria Math, sans-serif" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="4.0" stroke-linejoin="round">x</text><text x="226.943" y="63.000" fill="#586574" font-size="32" font-weight="600" font-family="Malgun Gothic, Cambria Math, sans-serif" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="4.0" stroke-linejoin="round">y</text><text x="183.943" y="371.038" fill="#586574" font-size="32" font-weight="600" font-family="Malgun Gothic, Cambria Math, sans-serif" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="4.0" stroke-linejoin="round">O</text><text x="485.736" y="129.011" fill="#202020" font-size="34" font-weight="600" font-family="Malgun Gothic, Cambria Math, sans-serif" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="4.0" stroke-linejoin="round">y = mx</text></svg>
