<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 708 621" width="708" height="621" role="img" aria-labelledby="title desc"><title id="title">세로축 위쪽을 지나는 내리막 직선</title><desc id="desc">중심의 보라색 직선 y=−ax−b는 오른쪽 아래로 내려가고 두 축을 원점의 양의 쪽에서 지난다. 왼쪽 아래 영역을 옅게 칠했다.</desc><rect width="708" height="621" fill="white" /><rect x="78.0" y="301.5365853658536" width="252.0" height="246.46341463414637" rx="7" fill="#edf5f3" /><line x1="78.0000" y1="301.5366" x2="632.0000" y2="301.5366" stroke="#586574" stroke-width="2.05" stroke-linecap="round" /><polygon points="645.0000,301.5366 632.0000,296.3366 632.0000,306.7366" fill="#586574" /><line x1="330.0000" y1="548.0000" x2="330.0000" y2="88.0000" stroke="#586574" stroke-width="2.05" stroke-linecap="round" /><polygon points="330.0000,75.0000 324.8000,88.0000 335.2000,88.0000" fill="#586574" /><line x1="133.2408" y1="81.3713" x2="635.6195" y2="422.5921" stroke="#754596" stroke-width="7.6" stroke-linecap="round" /><text x="661.000" y="288.537" fill="#586574" font-size="29" font-weight="600" font-family="Malgun Gothic, Cambria Math, sans-serif" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="4.0" stroke-linejoin="round">x</text><text x="349.000" y="70.000" fill="#586574" font-size="29" font-weight="600" font-family="Malgun Gothic, Cambria Math, sans-serif" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="4.0" stroke-linejoin="round">y</text><text x="309.000" y="325.537" fill="#586574" font-size="29" font-weight="600" font-family="Malgun Gothic, Cambria Math, sans-serif" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="4.0" stroke-linejoin="round">O</text><text x="524.775" y="126.390" fill="#754596" font-size="32" font-weight="600" font-family="Malgun Gothic, Cambria Math, sans-serif" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="4.0" stroke-linejoin="round">y = −ax − b</text></svg>
