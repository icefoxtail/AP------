<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 752 709" width="752" height="709" role="img" aria-labelledby="title desc"><title id="title">기울기의 비교와 세로축 위에서 만나는 두 직선</title><desc id="desc">파란 y=−3x+1과 주황 점선 y=−3x−1은 평행하다. 청록 점선 y=2x+1은 파란 직선과 (0,1)에서 만난다. (2,5)는 청록 직선 위이고 파란 직선의 x=2인 점은 (2,−5)이다.</desc><rect width="752" height="709" fill="white" /><line x1="192.0000" y1="381.2426" x2="519.0000" y2="381.2426" stroke="#586574" stroke-width="2.05" stroke-linecap="round" /><polygon points="532.0000,381.2426 519.0000,376.0426 519.0000,386.4426" fill="#586574" /><line x1="339.6316" y1="695.0000" x2="339.6316" y2="107.0000" stroke="#586574" stroke-width="2.05" stroke-linecap="round" /><polygon points="339.6316,94.0000 334.4316,107.0000 344.8316,107.0000" fill="#586574" /><line x1="260.8589" y1="103.6160" x2="457.1761" y2="685.3840" stroke="#226298" stroke-width="6.65" stroke-linecap="round" /><line x1="231.0344" y1="103.6160" x2="427.3516" y2="685.3840" stroke="#a64d1e" stroke-width="6.65" stroke-linecap="round" stroke-dasharray="11 7" /><line x1="196.3305" y1="620.1578" x2="458.3274" y2="102.5554" stroke="#227164" stroke-width="6.65" stroke-linecap="round" stroke-dasharray="5 6" /><line x1="339.6316" y1="337.0515" x2="429.1053" y2="337.0515" stroke="#9cafbd" stroke-width="1.85" stroke-linecap="round" stroke-dasharray="6 5" /><line x1="429.1053" y1="337.0515" x2="429.1053" y2="602.1985" stroke="#9cafbd" stroke-width="1.85" stroke-linecap="round" stroke-dasharray="6 5" /><circle cx="339.63157894736844" cy="337.0514705882353" r="7" fill="#226298" stroke="white" stroke-width="2" /><circle cx="429.10526315789474" cy="602.1985294117648" r="7" fill="#226298" stroke="white" stroke-width="2" /><circle cx="429.10526315789474" cy="160.28676470588243" r="7" fill="#227164" stroke="white" stroke-width="2" /><line x1="22.0000" y1="39.0000" x2="67.0000" y2="39.0000" stroke="#226298" stroke-width="5.65" stroke-linecap="round" /><text x="78.0000" y="46.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#226298" text-anchor="start">y = −3x + 1</text><line x1="268.0000" y1="39.0000" x2="313.0000" y2="39.0000" stroke="#a64d1e" stroke-width="5.65" stroke-linecap="round" stroke-dasharray="11 7" /><text x="324.0000" y="46.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#a64d1e" text-anchor="start">y = −3x − 1</text><line x1="516.0000" y1="39.0000" x2="561.0000" y2="39.0000" stroke="#227164" stroke-width="5.65" stroke-linecap="round" stroke-dasharray="5 6" /><text x="572.0000" y="46.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#227164" text-anchor="start">y = 2x + 1</text><text x="548.000" y="368.243" fill="#586574" font-size="29" font-weight="600" font-family="Malgun Gothic, Cambria Math, sans-serif" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="4.0" stroke-linejoin="round">x</text><text x="358.632" y="89.000" fill="#586574" font-size="29" font-weight="600" font-family="Malgun Gothic, Cambria Math, sans-serif" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="4.0" stroke-linejoin="round">y</text><text x="318.632" y="407.243" fill="#586574" font-size="29" font-weight="600" font-family="Malgun Gothic, Cambria Math, sans-serif" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="4.0" stroke-linejoin="round">O</text><text x="406.632" y="308.051" fill="#226298" font-size="29" font-weight="600" font-family="Malgun Gothic, Cambria Math, sans-serif" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="4.0" stroke-linejoin="round">(0, 1)</text><text x="510.105" y="614.199" fill="#226298" font-size="29" font-weight="600" font-family="Malgun Gothic, Cambria Math, sans-serif" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="4.0" stroke-linejoin="round">(2, −5)</text><text x="502.105" y="164.287" fill="#227164"