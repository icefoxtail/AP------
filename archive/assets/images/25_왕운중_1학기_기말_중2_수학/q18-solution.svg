<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-labelledby="title desc">
  <title id="title">y = −ax − b가 지나는 사분면</title>
  <desc id="desc">음의 기울기와 양의 y절편 및 x절편을 가진 직선의 개략도. 직선은 제2, 제1, 제4사분면을 지나고 제3사분면을 지나지 않는다.</desc>
  <rect width="640" height="360" fill="#fff"/>
  <text x="28" y="32" font-family="sans-serif" font-size="20" font-weight="700" fill="#111">y = −ax − b의 사분면</text>
  <text x="28" y="55" font-family="sans-serif" font-size="13" fill="#444">a &gt; 0, b &lt; 0이므로 기울기 −a &lt; 0, y절편 −b &gt; 0</text>
  <g stroke="#111" stroke-width="2" fill="none">
    <line x1="55" y1="245" x2="590" y2="245"/>
    <line x1="300" y1="320" x2="300" y2="68"/>
  </g>
  <path d="M590 245 l-9 -5 v10 z M300 68 l-5 9 h10 z" fill="#111"/>
  <text x="596" y="250" font-family="serif" font-size="18">x</text>
  <text x="306" y="66" font-family="serif" font-size="18">y</text>
  <text x="306" y="264" font-family="serif" font-size="16">O</text>
  <text x="130" y="117" font-family="sans-serif" font-size="16" fill="#64748b">제2사분면</text>
  <text x="378" y="125" font-family="sans-serif" font-size="16" fill="#64748b">제1사분면</text>
  <text x="465" y="308" font-family="sans-serif" font-size="16" fill="#64748b">제4사분면</text>
  <text x="92" y="300" font-family="sans-serif" font-size="14" fill="#9ca3af">제3사분면에는 지나지 않음</text>
  <line x1="90" y1="65" x2="540" y2="300" stroke="#2563eb" stroke-width="4" stroke-linecap="round"/>
  <circle cx="300" cy="174.67" r="5" fill="#dc2626"/>
  <circle cx="434.68" cy="245" r="5" fill="#dc2626"/>
  <text x="307" y="166" font-family="sans-serif" font-size="14" fill="#b91c1c">y절편 −b&gt;0</text>
  <text x="435" y="237" font-family="sans-serif" font-size="14" fill="#b91c1c">x절편 −b/a&gt;0</text>
  <text x="340" y="184" font-family="sans-serif" font-size="15" font-weight="700" fill="#1d4ed8">y = −ax − b</text>
  <text x="30" y="344" font-family="sans-serif" font-size="12" fill="#555">개략도이며 축척은 실제 계수를 나타내지 않음</text>
</svg>