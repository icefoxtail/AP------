<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 708 621" width="708" height="621" role="img" aria-labelledby="title desc"><title id="title">세 직선의 기울기와 세로축의 위치</title><desc id="desc">두 직선이 같은 기울기로 오른쪽 위로 올라간다. 세 번째는 오른쪽 아래로 내려간다. 올라가는 직선 가운데 하나는 세로축의 위, 하나는 아래에서 만난다.</desc><rect width="708" height="621" fill="white" /><line x1="78.0000" y1="301.5366" x2="632.0000" y2="301.5366" stroke="#586574" stroke-width="2.05" stroke-linecap="round" /><polygon points="645.0000,301.5366 632.0000,296.3366 632.0000,306.7366" fill="#586574" /><line x1="330.0000" y1="548.0000" x2="330.0000" y2="88.0000" stroke="#586574" stroke-width="2.05" stroke-linecap="round" /><polygon points="330.0000,75.0000 324.8000,88.0000 335.2000,88.0000" fill="#586574" /><line x1="86.6634" y1="396.0206" x2="550.6380" y2="80.8843" stroke="#226298" stroke-width="7.1" stroke-linecap="round" /><line x1="104.4307" y1="541.2700" x2="635.0914" y2="180.8398" stroke="#227164" stroke-width="6.6" stroke-linecap="round" stroke-dasharray="12 7" /><line x1="85.7952" y1="274.6336" x2="480.4769" y2="542.7054" stroke="#a64d1e" stroke-width="6.6" stroke-linecap="round" stroke-dasharray="5 6" /><text x="661.000" y="288.537" fill="#586574" font-size="29" font-weight="600" font-family="Malgun Gothic, Cambria Math, sans-serif" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="4.0" stroke-linejoin="round">x</text><text x="349.000" y="70.000" fill="#586574" font-size="29" font-weight="600" font-family="Malgun Gothic, Cambria Math, sans-serif" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="4.0" stroke-linejoin="round">y</text><text x="309.000" y="325.537" fill="#586574" font-size="29" font-weight="600" font-family="Malgun Gothic, Cambria Math, sans-serif" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="4.0" stroke-linejoin="round">O</text></svg>
