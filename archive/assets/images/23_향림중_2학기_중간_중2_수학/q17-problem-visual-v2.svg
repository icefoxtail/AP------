<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 737 616" width="737" height="616" role="img" aria-labelledby="title desc"><title id="title">내심에서 읽는 양쪽의 반각과 꼭짓각</title><desc id="desc">내심 I와 세 꼭짓점을 이었다. B에서 BC와 BI 사이 각은 30도이고 C에서 CI와 CA 사이 각은 25도이다. A에서 AB와 AI 사이 각은 x이다.</desc><rect width="737" height="616" fill="white" /><line x1="320.8235" y1="117.8545" x2="110.5000" y2="482.1455" stroke="#21639a" stroke-width="4.8" stroke-linecap="round" /><line x1="110.5000" y1="482.1455" x2="626.5000" y2="482.1455" stroke="#21639a" stroke-width="4.8" stroke-linecap="round" /><line x1="626.5000" y1="482.1455" x2="320.8235" y2="117.8545" stroke="#21639a" stroke-width="4.8" stroke-linecap="round" /><line x1="341.0494" y1="349.0377" x2="320.8235" y2="117.8545" stroke="#227365" stroke-width="4.9" stroke-linecap="round" /><line x1="341.0494" y1="349.0377" x2="110.5000" y2="482.1455" stroke="#227365" stroke-width="4.9" stroke-linecap="round" /><line x1="341.0494" y1="349.0377" x2="626.5000" y2="482.1455" stroke="#227365" stroke-width="4.9" stroke-linecap="round" /><path d="M 177.5000 482.1455 A 67 67 0 0 0 168.5237 448.6455" stroke="#21639a" stroke-width="2.25" fill="none" /><text x="215.7178" y="464.4166" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#21639a" text-anchor="middle">30°</text><path d="M 563.9648 452.9849 A 69 69 0 0 1 582.1477 429.2885" stroke="#a34c1f" stroke-width="2.25" fill="none" /><text x="544.0577" y="418.7467" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#a34c1f" text-anchor="middle">25°</text><path d="M 291.3235 168.9500 A 59 59 0 0 0 325.9657 176.6300" stroke="#774698" stroke-width="2.25" fill="none" /><text x="292.0453" y="221.5789" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#774698" text-anchor="middle">x</text><circle cx="320.8235270267433" cy="117.85448258129736" r="4.9" fill="#28364b" /><text x="320.8235" y="9