<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 400" width="480" height="400" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">네 영역 A, B, C, D로 나누어진 지도 모양이다. B와 C는 이웃하고, A와 D는 각각 B, C와 이웃하지만 A와 D는 서로 이웃하지 않는다.</title><desc id="visual-desc">가로로 세 칸 나뉜 직사각형 지도로, 왼쪽 영역이 A, 가운데가 위아래로 B와 C, 오른쪽 영역이 D이며 각 영역에 알파벳 이름이 적혀 있다.</desc><rect width="480" height="400" fill="#fff"/><g data-layer="10"><path id="rA" data-role="region" stroke="none" stroke-width="1.6" fill="#e4e7ec" data-owner-points="p00 p04 p20 p24" data-mark="region" data-mark-id="rA" fill-rule="evenodd" d="M54.285714286 323.80952381 L178.095238095 323.80952381 L178.095238095 76.19047619 L54.285714286 76.19047619 L54.285714286 323.80952381 Z"/></g><g data-layer="10"><path id="rB" data-role="region" stroke="none" stroke-width="1.6" fill="#e4e7ec" data-owner-points="p22 p24 p42 p44" data-mark="region" data-mark-id="rB" fill-rule="evenodd" d="M178.095238095 200 L301.904761905 200 L301.904761905 76.19047619 L178.095238095 76.19047619 L178.095238095 200 Z"/></g><g data-layer="10"><path id="rC" data-role="region" stroke="none" stroke-width="1.6" fill="#e4e7ec" data-owner-points="p20 p22 p40 p42" data-mark="region" data-mark-id="rC" fill-rule="evenodd" d="M178.095238095 323.80952381 L301.904761905 323.80952381 L301.904761905 200 L178.095238095 200 L178.095238095 323.80952381 Z"/></g><