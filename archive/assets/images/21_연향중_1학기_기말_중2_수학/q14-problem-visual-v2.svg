<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 706 510" width="706" height="510" role="img" aria-labelledby="title desc"><title id="title">원점 아래에서 세로축을 만나는 오르막 직선</title><desc id="desc">오른쪽 위로 올라가는 검은 직선은 원점 아래에서 세로축과 만난다. 좌표의 눈금은 주어지지 않는다.</desc><rect width="706" height="510" fill="white" /><line x1="85.0000" y1="257.8503" x2="615.0000" y2="257.8503" stroke="#586574" stroke-width="2.05" stroke-linecap="round" /><polygon points="628.0000,257.8503 615.0000,252.6503 615.0000,263.0503" fill="#586574" /><line x1="343.5714" y1="441.0000" x2="343.5714" y2="81.0000" stroke="#586574" stroke-width="2.05" stroke-linecap="round" /><polygon points="343.5714,68.0000 338.3714,81.0000 348.7714,81.0000" fill="#586574" /><line x1="186.8190" y1="435.4117" x2="619.9132" y2="136.1272" stroke="#202020" stroke-width="7.0" stroke-linecap="round" /><text x="644.000" y="244.850" fill="#586574" font-size="32" font-weight="600" font-family="Malgun Gothic, Cambria Math, sans-serif" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="4.0" stroke-linejoin="round">x</text><text x="362.571" y="63.000" fill="#586574" font-size="32" font-weight="600" font-family="Malgun Gothic, Cambria Math, sans-serif" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="4.0" stroke-linejoin="round">y</text><text x="319.571" y="288.850" fill="#586574" font-size="32" font-weight="600" font-family="Malgun Gothic, Cambria Math, sans-serif" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="4.0" stroke-linejoin="round">O</text></svg>
