<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 384 420" width="384" height="420" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">A3 용지의 절반 크기인 A4 용지와, A4 용지의 절반 크기인 A5 용지가 계단 모양으로 나란히 놓여 있다. 세 용지는 모두 같은 모양으로 닮아 있다.</title><desc id="visual-desc">큰 직사각형 A3가 아래에 있고, 그 위 왼쪽에 A4, 오른쪽 중간에 A5가 놓여 있다. 세 직사각형은 서로 다른 크기로 같은 비율을 이룬다.</desc><rect width="384" height="420" fill="#fff"/><g data-layer="30"><line id="sO0O1" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="79.620529419" y1="368.928571429" x2="304.379470581" y2="368.928571429"/></g><g data-layer="30"><line id="sO1O2" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="304.379470581" y1="368.928571429" x2="304.379470581" y2="210"/></g><g data-layer="30"><line id="sO2O5" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="304.379470581" y1="210" x2="79.620529419" y2="210"/></g><g data-layer="30"><line id="sO5O0" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="79.620529419" y1="210" x2="79.620529419" y2="368.928571429"/></g><g data-layer="30"><line id="sO5O6" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="79.620529419" y1="210" x2="192" y2="210"/></g><g data-layer="30"><line id="sO6O7" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="192" y1="210" x2="192" y2="51.071428571"/></g><g data-la