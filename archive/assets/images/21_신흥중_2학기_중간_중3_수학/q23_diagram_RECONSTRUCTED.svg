<svg xmlns="http://www.w3.org/2000/svg" width="390" height="340" viewBox="0 0 390 340" role="img" aria-labelledby="title desc"><title id="title">직각삼각형의 내접원 도식</title><desc id="desc">각 A가 직각이고 AC가 8cm, BC가 10cm인 직각삼각형 ABC와 내접원 O. D,E,F는 접점이다. 접점 이름 배치와 축척은 조건을 위한 재구성이다.</desc><rect width="100%" height="100%" fill="white"/><path d="M80 285 L280 285 L80 18.33 Z" fill="none" stroke="#171717" stroke-width="3"/><path d="M80 264 L101 264 L101 285" fill="none" stroke="#171717" stroke-width="2"/><circle cx="146.67" cy="218.33" r="66.67" fill="none" stroke="#345" stroke-width="2.6"/><circle cx="146.67" cy="218.33" r="3.5" fill="#111"/><text x="154" y="215" font-family="serif" font-size="21">O</text><line x1="146.67" y1="218.33" x2="80" y2="218.33" stroke="#678" stroke-width="1.5"/><line x1="146.67" y1="218.33" x2="146.67" y2="285" stroke="#678" stroke-width="1.5"/><line x1="146.67" y1="218.33" x2="200" y2="178.33" stroke="#678" stroke-width="1.5"/><circle cx="80" cy="218.33" r="3.2" fill="#111"/><circle cx="146.67" cy="285" r="3.2" fill="#111"/><circle cx="200" cy="178.33" r="3.2" fill="#111"/><text x="60" y="217" font-family="serif" font-size="19">F</text><text x="145" y="309" font-family="serif" font-size="19">E</text><text x="205" y="174" font-family="serif" font-size="19">D</text><text x="61" y="304" font-family="serif" font-size="22">A</text><text x="286" y="291" font-family="serif" font-size="22">B</text><text x="65" y="14" font-family="serif" font-size="22">C</text><text x="51" y="143" font-family="sans-serif" font-size="18">8 cm</text><text x="225" y="120" transform="rotate(52 225 120)" font-family="sans-serif" font-size="18">10 cm</text><text x="18" y="331" font-family="sans-serif" font-size="12" fill="#555">인쇄 조건을 바탕으로 재구성(접점 이름 배치는 원본 확인 불가)</text></svg>