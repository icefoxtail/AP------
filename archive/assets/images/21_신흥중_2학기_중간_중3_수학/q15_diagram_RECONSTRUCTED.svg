<svg xmlns="http://www.w3.org/2000/svg" width="520" height="330" viewBox="0 0 520 330" role="img" aria-labelledby="title desc"><title id="title">접는 선분 AB와 접힌 원의 호</title><desc id="desc">현 AB를 접는 선으로 접은 뒤 짧은 호 AB가 원의 중심 O를 지나는 도식. 점선은 접기 전 호, 실선 곡선은 접은 뒤 호이다.</desc><rect width="100%" height="100%" fill="white"/><path d="M173.4 195 A100 100 0 1 1 346.6 195" fill="none" stroke="#171717" stroke-width="3"/><path d="M173.4 195 A100 100 0 0 0 346.6 195" fill="none" stroke="#222" stroke-width="3" stroke-dasharray="8 7"/><path d="M173.4 195 A100 100 0 0 1 346.6 195" fill="none" stroke="#111" stroke-width="3.2"/><line x1="173.4" y1="195" x2="346.6" y2="195" stroke="#111" stroke-width="3"/><circle cx="260" cy="145" r="3.5" fill="#111"/><text x="270" y="137" font-family="serif" font-size="23">O</text><text x="152" y="199" font-family="serif" font-size="22">A</text><text x="351" y="201" font-family="serif" font-size="22">B</text><path d="M270 164 C284 153 299 143 310 127" fill="none" stroke="#333" stroke-width="1.7" stroke-dasharray="4 5"/><path d="M304 129 L311 125 L309 134" fill="none" stroke="#333" stroke-width="1.7"/><text x="260" y="292" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#555">접기 전 짧은 호 AB(점선) · 접은 뒤 호(실선) — 조건 도식</text></svg>