<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" width="600" height="420" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">가로등과 사람, 그림자 끝이 만드는 두 직각삼각형은 닮음이고 높이의 비가 3.4:1.7=2:1이다. 사람까지의 거리를 x, 그림자 길이를 y라 하면 닮음비에서 y=x이다. 시간에 대해 미분하면 dy/dt=dx/dt이고 사람의 속도가 1.5 m/s이므로 그림자 길이의 변화율도 1.5 m/s이다. 따라서 답은 ②이다.</title><desc id="visual-desc">가로등 밑에서 꼭대기까지 높이 3.4가 표시되고, 사람의 머리에서 지면의 그림자 끝으로 햇빛이 지나간다. 사람까지의 거리 x와 그림자 길이 y가 지면에 표시되어 있다.</desc><rect width="600" height="420" fill="#fff"/><g data-layer="30"><line id="sAB" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="60.714285714" y1="345.595238095" x2="60.714285714" y2="74.404761905"/></g><g data-layer="30"><line id="sDE" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="300" y1="345.595238095" x2="300" y2="210"/></g><g data-layer="40"><line id="ground" data-role="line" stroke="#111" stroke-width="2.05" fill="none" x1="32" y1="345.595238095" x2="568" y2="345.595238095"/></g><g data-layer="40"><line id="ray" data-role="line" stroke="#111" stroke-width="2.05" fill="none" x1="32" y1="58.133333333" x2="568" y2="361.866666667"/></g><g data-layer="45"><line id="sAD" data-role="line" stroke="#111" stroke-width="3.2" fill="none" x1="60.714285714" y1="345.595238095" x2="300" y2="345.595238095"/></g><g data-layer="45"><line id="sDC" data-role="line" stroke="#111" stroke-width="3.2" fill="none" x1="300" y1="345.595238095" x2="539.285714286" y2="345.595238095"/></g><g data-layer="45"><line id="sBE" data-role="line" stroke="#111" stroke-width="3.2" fill="none" x1="60.714285714" y1="74.404761905" x2="300" y2="210"/></g><g data-layer="60"><polyline id="rA" data-role="indicator" stroke="#111" stroke-width="0.8" fill="none" points="60.714285714,335.595238095 70.714285714,335.595238095 70.714285714,345.595238095"/></g><g data-layer="60"><polyline id="rD" data-role="indicator" stroke="#111" stroke-width="0.8" fill="none" points="300,335.595238095 310,335.595238095 310,345.595238095"/></g><g data-layer="90"><g id="lAB" data-label-kind="EQUATION_LABEL" data-priority="1" data-font-px="26.7" data-owner="sAB" data-fragment-sha="sha256:c8cb70018b7fdb72469ffc761c346a13147ab1843572502f9243c2dd293b9576" transform="translate(68.714285714 183.3367)"><svg xmlns="http://www.w3.org/2000/svg" width="34.1226" height="18.6633" viewBox="0 0 34.1226 18.6633" data-outline-width="34.1226" data-outline-height="18.6633" id="lb-3f449e4bbc22a15390ed1d64a69e04cff632ce985dac96d651dc9cc178311ce3" data-owner="sAB" data-fact-role="GIVEN"><g data-outline-units-per-em="1000" transform="translate(0 18.075899999999997) scale(0.026699999999999998)"><g stroke="currentColor" fill="currentColor" stroke-width="30" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mn"><path data-c="33" d="M127 463Q100 463 85 480T69 524Q69 579 117 622T233 665Q268 665 277 664Q351 652 390 611T430 522Q430 470 396 421T302 350L299 348Q299 347 308 345T337 336T375 315Q457 262 457 175Q457 96 395 37T238 -22Q158 -22 100 21T42 130Q42 158 60 175T105 193Q133 193 151 175T169 130Q169 119 166 110T159 94T148 82T136 74T126 70T118 67L114 66Q165 21 238 21Q293 21 321 74Q338 107 338 175V195Q338 290 274 322Q259 328 213 329L171 330L168 332Q166 335 166 348Q166 366 174 366Q202 366 232 371Q266 376 294 413T322 525V533Q322 590 287 612Q265 626 240 626Q208 626 181 615T143 592T132 580H135Q138 579 143 578T153 57