<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 695 510" width="695" height="510" role="img" aria-labelledby="title desc"><title id="title">정사각형 공원과 산책로의 가운데 선</title><desc id="desc">두 정사각형 사이에 일정한 폭의 산책로가 있다. 안쪽 공원의 한 변에 r m, 띠를 가로지르는 길이에 a m를 적었다. 띠 한가운데의 정사각형 경계는 점선이다.</desc><rect width="695" height="510" fill="white" /><rect x="132.0" y="65.0" width="362" height="362" fill="#e0eff1" stroke="#205d9c" stroke-width="4" /><rect x="175.5" y="108.5" width="275" height="275" fill="#f7fafc" stroke="#266f73" stroke-width="4" /><rect x="153.75" y="86.75" width="318.5" height="318.5" fill="none" stroke="#aa5411" stroke-width="2.7" stroke-dasharray="9 7" /><text x="313.0000" y="246.0000" font-size="32" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#205d9c" text-anchor="middle">공원</text><line x1="175.5000" y1="144.5000" x2="450.5000" y2="144.5000" stroke="#266f73" stroke-width="1.65" stroke-linecap="round" /><line x1="175.5000" y1="138.5000" x2="175.5000" y2="150.5000" stroke="#266f73" stroke-width="1.7" stroke-linecap="round" /><line x1="450.5000" y1="138.5000" x2="450.5000" y2="150.5000" stroke="#266f73" stroke-width="1.7" stroke-linecap="round" /><text x="313.0000" y="174.5000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#266f73" text-anchor="middle">r m</text><line x1="450.5000" y1="246.0000" x2="549.0000" y2="246.0000" stroke="#aa5411" stroke-width="1.8" stroke-linecap="round" /><line x1="450.5000" y1="239.0000" x2="450.5000" y2="253.0000" stroke="#aa5411" stroke-width="1.8" stroke-linecap="round" /><line x1="494.0000" y1="239.0000" x2="494.0000" y2="253.0000" stroke="#aa5411" stroke-width="1.8" stroke-linecap="round" /><text x="558.0000" y="235.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#aa5411" text-anchor="middle">a m</text></svg>
