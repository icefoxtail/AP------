<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 384 320" width="384" height="320" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">사다리꼴 ABCD에서 변 AD와 변 BC는 평행하고 각 C와 각 D는 직각이다. 변 AD의 길이는 8 cm, 변 BC의 길이는 13 cm, 변 AB의 길이는 13 cm이다.</title><desc id="visual-desc">점 A가 왼쪽 위, B가 왼쪽 아래, C가 오른쪽 아래, D가 오른쪽 위에 있는 사다리꼴 ABCD가 그려져 있다. 윗변 AD 옆에 8 cm, 밑변 BC 옆에 13 cm, 빗변 AB 옆에 13 cm가 적혀 있고, C와 D의 각에는 직각 표시가, AD와 BC에는 평행 표시가 있다.</desc><rect width="384" height="320" fill="#fff"/><g data-layer="30"><line id="AB" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="163.681415929" y1="46.725663717" x2="69.286135693" y2="273.274336283"/></g><g data-layer="30"><line id="BC" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="69.286135693" y1="273.274336283" x2="314.713864307" y2="273.274336283"/></g><g data-layer="30"><line id="CD" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="314.713864307" y1="273.274336283" x2="314.713864307" y2="46.725663717"/></g><g data-layer="30"><line id="DA" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="314.713864307" y1="46.725663717" x2="163.681415929" y2="46.725663717"/></g><g data-layer="55"><polyline id="pAD-DA-1" data-role="indicator" stroke="#111" stroke-width="1.6" fill="none" data-mark="parallel" data-mark-id="pAD" data-mark-index="1" data-mark-count="1" dat