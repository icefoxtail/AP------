<svg xmlns="http://www.w3.org/2000/svg" width="680" height="445" viewBox="0 0 680 445" role="img" aria-label="정오각형에서 교점 F와 닮은 삼각형의 길이 관계">
<title>16번 정오각형의 대각선과 닮음</title>
<rect width="680" height="445" fill="#fffdfb"/>
<text x="20" y="30" font-size="19" font-weight="700" fill="#172b4d">16번 · 정오각형의 변과 대각선</text>
<!-- Regular pentagon boundary: A-C-E-D-B-A -->
<line x1="243.0" y1="63.0" x2="385.7" y2="166.6" stroke="#375f78" stroke-width="3"/>
<line x1="385.7" y1="166.6" x2="331.2" y2="334.4" stroke="#375f78" stroke-width="3"/>
<line x1="331.2" y1="334.4" x2="154.8" y2="334.4" stroke="#375f78" stroke-width="3"/>
<line x1="154.8" y1="334.4" x2="100.3" y2="166.6" stroke="#375f78" stroke-width="3"/>
<line x1="100.3" y1="166.6" x2="243.0" y2="63.0" stroke="#375f78" stroke-width="3"/>
<!-- Original diagonals -->
<line x1="243.0" y1="63.0" x2="331.2" y2="334.4" stroke="#9bb2c5" stroke-width="1.7"/>
<line x1="243.0" y1="63.0" x2="154.8" y2="334.4" stroke="#9bb2c5" stroke-width="1.7"/>
<line x1="385.7" y1="166.6" x2="154.8" y2="334.4" stroke="#9bb2c5" stroke-width="1.7"/>
<line x1="385.7" y1="166.6" x2="100.3" y2="166.6" stroke="#9bb2c5" stroke-width="1.7"/>
<line x1="331.2" y1="334.4" x2="100.3" y2="166.6" stroke="#9bb2c5" stroke-width="1.7"/>
<!-- Similar triangles ACE (teal) and AFB (orange) -->
<line x1="243.0" y1="63.0" x2="385.7" y2="166.6" stroke="#14747a" stroke-width="4"/>
<line x1="385.7" y1="166.6" x2="331.2" y2="334.4" stroke="#14747a" stroke-width="4"/>
<line x1="331.2" y1="334.4" x2="243.0" y2="63.0" stroke="#14747a" stroke-width="4"/>
<line x1="243.0" y1="63.0" x2="209.3" y2="166.6" stroke="#a45a12" stroke-width="4"/>
<line x1="209.3" y1="166.6" x2="100.3" y2="166.6" stroke="#a45a12" stroke-width="4"/>
<line x1="100.3" y1="166.6" x2="243.0" y2="63.0" stroke="#a45a12" stroke-width="4"/>
<!-- Vertices and all original intersection labels -->
<circle cx="243.0" cy="63.0" r="4" fill="#374151"/><text x="252" y="52" font-size="16" fill="#182b42">A</text>
<circle cx="100.3" cy="166.6" r="4" fill="#374151"/><text x="80" y="170" font-size="16" fill="#182b42">B</text>
<circle cx="385.7" cy="166.6" r="4" fill="#374151"/><text x="393" y="162" font-size="16" fill="#182b42">C</text>
<circle cx="154.8" cy="334.4" r="4" fill="#374151"/><text x="161" y="355" font-size="16" fill="#182b42">D</text>
<circle cx="331.2" cy="334.4" r="4" fill="#374151"/><text x="337" y="355" font-size="16" fill="#182b42">E</text>
<circle cx="209.3" cy="166.6" r="3.5" fill="#a45a12"/><text x="195" y="157" font-size="14" font-weight="700" fill="#8a470d">F</text>
<circle cx="276.7" cy="166.6" r="3" fill="#374151"/><text x="279" y="157" font-size="14" fill="#182b42">G</text>
<circle cx="188.5" cy="230.7" r="3" fill="#374151"/><text x="174" y="247" font-size="14" fill="#182b42">H</text>
<circle cx="297.5" cy="230.7" r="3" fill="#374151"/><text x="301" y="247" font-size="14" fill="#182b42">I</text>
<circle cx="243.0" cy="270.3" r="3" fill="#374151"/><text x="248" y="284" font-size="14" fill="#182b42">J</text>
<text x="104" y="120" font-size="16" font-weight="700" fill="#a45a12">변 x</text>
<text x="282" y="207" font-size="16" font-weight="700" fill="#14747a">대각선 1</text>
<rect x="432" y="84" width="232" height="260" rx="11" fill="#f1f5f9" stroke="#cbd5e1"/>
<text x="447" y="113" font-size="15" font-weight="700" fill="#334155">각과 길이 관계</text>
<text x="447" y="143" font-size="14" fill="#334155">AB = AC = BD = CE = x</text>
<text x="447" y="168" font-size="14" fill="#334155">AD = BC = AE = 1; DF = x</text>
<text x="447" y="195" font-size="14" fill="#334155">AF = BF = 1 − x</text>
<text x="447" y="225" font-size="15" font-weight="700" fill="#1e4e79">△ACE ∼ △AFB</text>
<text x="447" y="250" font-size="14" fill="#334155">AE/AB = AC/AF</text>
<text x="447" y="278" font-size="16" fill="#1e4e79">1/x = x/(1 − x)</text>
<text x="447" y="306" font-size="17" font-weight="700" fill="#1e4e79">x² + x = 1</text>
<text x="447" y="330" font-size="16" font-weight="700" fill="#a45a12">x = (√5 − 1)/2</text>
<text x="20" y="419" font-size="14" fill="#334155">원문의 A–J 표기를 유지하고, 닮음 관계에 쓰이는 F와 두 삼각형을 강조한다.</text>
</svg>
