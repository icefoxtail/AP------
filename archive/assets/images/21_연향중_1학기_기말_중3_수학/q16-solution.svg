nt-size="17" fill="#14747a" font-weight="700">대각선 1</text><rect x="447" y="98" width="216" height="217" rx="11" fill="#f1f5f9" stroke="#cbd5e1"/><text x="461" y="135" font-size="15" fill="#334155">대각선이 만드는</text><text x="461" y="158" font-size="15" fill="#334155">닮음삼각형의 비</text><text x="461" y="196" font-size="17" fill="#1e4e79">1 : x = x : (1−x)</text><text x="461" y="232" font-size="18" fill="#1e4e79">x² + x = 1</text><text x="461" y="272" font-size="18" fill="#a45a12">x = (√5−1)/2</text><text x="20" y="419" font-size="15" fill="#334155">원본 문제의 정오각형을 보존하고 해설에는 길이비와 닮음 관계를 강조한다.</text></svg>
