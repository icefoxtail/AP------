<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" role="img" aria-labelledby="title desc"><title id="title">피타고라스 조건의 귀류법</title><desc id="desc">a와 b가 모두 홀수이면 c의 제곱이 4로 나눈 나머지 2가 되어 모순이다.</desc><style>text{font-family:"Noto Sans KR","Malgun Gothic",Arial,sans-serif;fill:#172033}</style><rect width="760" height="430" fill="#f8fafc"/><text x="28" y="38" font-size="22" font-weight="700">피타고라스 조건의 귀류법</text><g font-size="16"><rect x="52" y="85" width="656" height="52" rx="10" fill="#fff" stroke="#cbd5e1"/><text x="70" y="117">1. a,b가 모두 홀수라고 가정: a=2m+1, b=2n+1</text><rect x="52" y="150" width="656" height="52" rx="10" fill="#fff" stroke="#cbd5e1"/><text x="70" y="182">2. 홀수의 제곱은 4로 나누면 나머지가 1</text><rect x="52" y="215" width="656" height="52" rx="10" fill="#fff" stroke="#cbd5e1"/><text x="70" y="247">3. a²+b²≡1+1≡2 (mod 4), 따라서 c²≡2 (mod 4)</text><rect x="52" y="280" width="656" height="52" rx="10" fill="#dcfce7" stroke="#16a34a"/><text x="70" y="312" font-weight="700">4. 정수의 제곱의 나머지는 0 또는 1뿐이므로 모순</text></g></svg>
