<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" role="img" aria-labelledby="title desc"><title id="title">진리집합 함의 연결</title><desc id="desc">P와 R이 모두 Q 안에 완전히 포함되어 있다.</desc><style>text{font-family:"Noto Sans KR","Malgun Gothic",Arial,sans-serif;fill:#172033}.math{font-family:Georgia,serif}</style><rect width="760" height="430" fill="#f8fafc"/><text x="28" y="38" font-size="22" font-weight="700">진리집합 함의 연결</text><rect x="36" y="96" width="320" height="250" rx="14" fill="#fff" stroke="#94a3b8"/><circle cx="196" cy="220" r="106" fill="#fed7aa" fill-opacity=".6" stroke="#ea580c" stroke-width="3"/><text x="196" y="135" text-anchor="middle" font-size="18" font-weight="700">Q</text><circle cx="145" cy="230" r="35" fill="#bfdbfe" stroke="#2563eb" stroke-width="3"/><text x="145" y="236" text-anchor="middle" font-size="18" font-weight="700">P</text><circle cx="248" cy="230" r="35" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text x="248" y="236" text-anchor="middle" font-size="18" font-weight="700">R</text><rect x="390" y="96" width="334" height="250" rx="14" fill="#fff" stroke="#cbd5e1"/><text x="412" y="170" class="math" font-size="21">P⊆Q</text><text x="412" y="215" class="math" font-size="21">R⊆Q</text><text x="412" y="260" class="math" font-size="21">Qᶜ⊆Rᶜ</text></svg>
