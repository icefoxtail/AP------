    <rect width="760" height="430" fill="#f8fafc"/><text x="28" y="38" font-size="22" text-anchor="start" class="text" font-weight="700">X에 반드시 들어갈 원소와 들어갈 수 없는 원소를 나눈다</text><text x="28" y="67" font-size="15" text-anchor="start" class="muted">X∩A=A는 A⊆X, X−B=X는 X∩B=∅와 같다</text><rect x="44" y="105" width="650" height="180" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/><rect x="44" y="105" width="220" height="45" rx="0" fill="#f1f5f9" stroke="none" stroke-width="0"/><text x="58" y="133" font-size="15" text-anchor="start" class="text" font-weight="700">전체집합 U</text><text x="278" y="133" font-size="15" text-anchor="start" class="text" fill="#334155">{1,2,3,4,5,6,7}</text><line x1="44" y1="150" x2="694" y2="150" stroke="#e2e8f0" stroke-width="1" stroke-linecap="round"/><rect x="44" y="150" width="220" height="45" rx="0" fill="#f1f5f9" stroke="none" stroke-width="0"/><text x="58" y="178" font-size="15" text-anchor="start" class="text" font-weight="700">반드시 포함</text><text x="278" y="178" font-size="15" text-anchor="start" class="text" fill="#166534">A={1,2}</text><line x1="44" y1="195" x2="694" y2="195" stroke="#e2e8f0" stroke-width="1" stroke-linecap="round"/><rect x="44" y="195" width="220" height="45" rx="0" fill="#f1f5f9" stroke="none" stroke-width="0"/><text x="58" y="223" font-size="15" text-anchor="start" class="text" font-weight="700">반드시 제외</text><text x="278" y="223" font-size="15" text-anchor="start" class="text" fill="#b91c1c">B={5,7}</text><line x1="44" y1="240" x2="694" y2="240" stroke="#e2e8f0" stroke-width="1" stroke-linecap="round"/><rect x="44" y="240" width="220" height="45" rx="0" fill="#f1f5f9" stroke="none" stroke-width="0"/><text x="58" y="268" font-size="15" text-anchor="start" class="text" font-weight="700">자유 선택</text><text x="278" y="268" font-size="15" text-anchor="start" class="text" fill="#1d4ed8">{3,4,6}  →  3개</text><rect x="44" y="315" width="280" height="30" rx="15" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/><text x="184" y="335" font-size="14" text-anchor="middle" class="text" fill="#166534" font-weight="700">n(X)=2³=8</text><text x="44" y="378" font-size="15" text-anchor="start" class="muted">자유 원소 3,4,6의 포함 여부만 선택한다.</text></svg>