<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc" data-visual-case="set-2022-pilot" data-fact-hash="83fa1e6baa314ab2f18296c76a24af7c8522eb770020b2ecb5638c5aabad07f1" data-visual-provenance="2026-09-05-set-visual-pilot"><title id="title">문항 8 해설: X의 포함·제외·자유 원소</title><desc id="desc">U={1,…,7}, A={1,2}, B={5,7}에서 X의 원소 상태를 분류한 표</desc>
