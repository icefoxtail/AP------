    <rect width="760" height="430" fill="#f8fafc"/><text x="28" y="38" font-size="22" text-anchor="start" class="text" font-weight="700">합집합과 교집합을 Venn 영역으로 분리한다</text><text x="28" y="67" font-size="15" text-anchor="start" class="muted">바깥 8명에서 합집합 42명을 구하고 포함배제로 교집합을 구한다</text><rect x="46" y="96" width="330" height="230" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/><text x="62" y="123" font-size="15" text-anchor="start" class="text" fill="#2563eb" font-weight="700">실제 인원 배치</text><circle cx="158" cy="219" r="67" fill="#60a5fa" fill-opacity="0.32" stroke="#2563eb" stroke-width="2"/><circle cx="251" cy="219" r="67" fill="#f59e0b" fill-opacity="0.3" stroke="#d97706" stroke-width="2"/><text x="132" y="178" font-size="14" text-anchor="start" class="text" fill="#1d4ed8" font-weight="700">A=31</text><text x="273" y="178" font-size="14" text-anchor="start" class="text" fill="#b45309" font-weight="700">B=23</text><text x="129" y="223" font-size="13" text-anchor="middle" class="text" fill="#1e40af" font-weight="700">19</text><text x="204.5" y="223" font-size="13" text-anchor="middle" class="text" fill="#166534" font-weight="700">12</text><text x="280" y="223" font-size="13" text-anchor="middle" class="text" fill="#92400e" font-weight="700">11</text><text x="308" y="290" font-size="13" text-anchor="middle" class="text" fill="#64748b">바깥 8</text><text x="64" y="308" font-size="12" text-anchor="start" class="muted">U=50명</text><rect x="410" y="96" width="314" height="230" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/><text x="426" y="123" font-size="15" text-anchor="start" class="text" fill="#16a34a" font-weight="700">빈칸 계산</text><text x="432" y="143" font-size="17" text-anchor="start" class="text" fill="#334155"><tspan x="432" dy="0">a=n(A∪B)=50−8=42</tspan><tspan x="432" dy="39">31+23=a+b</tspan><tspan x="432" dy="39">b=12</tspan><tspan x="432" dy="39">a−b=42−12=30</tspan></text><text x="46" y="374" font-size="14" text-anchor="start" class="muted">두 원의 겹친 영역 12명이 두 번 세어진다는 점을 보정한다.</text></svg>