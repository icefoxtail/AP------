<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc" data-visual-case="set-2022-pilot" data-fact-hash="f65a5450e92cee8afc964aa65105937b26ee15b8862824e78724919a93566722" data-visual-provenance="2026-09-05-set-visual-pilot"><title id="title">문항 4 해설: 두 영화 관람 인원 Venn diagram</title><desc id="desc">50명 중 A=31, B=23, 바깥=8인 실제 네 영역과 a,b의 계산</desc>
