<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 400" width="440" height="400" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">호의 길이 6π, 넓이 27π로부터 계산한 반지름 r=9와 중심각 θ=2π/3을 표시한다. 넓이 27π는 영역 안쪽에 글자로 쓰되 부채꼴의 내부는 면 채움 없이 흰색으로 둔다.</title><desc id="visual-desc">꼭짓점 O에서 같은 길이 9인 두 반지름 OA, OB를 그려 중심각 120도를 만들고 그 사이 원호에 6π, OA에 9, 작은 중심각 호에 2π/3을 적는다. 면 내부에는 넓이 27π 라벨만 있다.</desc><rect width="440" height="400" fill="#fff"/><g data-layer="30"><line id="OA" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="171.765188834" y1="287.787356322" x2="364.704433498" y2="287.787356322"/></g><g data-layer="30"><line id="OB" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="171.765188834" y1="287.787356322" x2="75.295566502" y2="120.697069056"/></g><g data-layer="46"><polyline id="arc1" data-role="circularArc" stroke="#111" stroke-width="3.2" fill="none" data-owner-points="A B" data-center-point="O" data-owner-radius="9.0" data-sweep="CCW" data-mark="arc" data-mark-id="arc1" points="364.704433498,287.787356322 364.475618211,278.393606246 363.789715078,269.022137108 362.648350983,259.695176997 361.054233117,250.434848431 359.011142551,241.263115888 356.52392527,232.201733702 353.598480678,223.272194472 350.241747607,214.495678079 346.461687858,205.893001448 342.267267313,197.48456918 337.668434676,189.290325146 332.676097