<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 401" width="480" height="401" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-solid-figure="solid-figure-v1" data-mode="SOLIDS" data-scale="25.58792" data-origin="208 314.992573" data-yaw="28" data-pitch="20" data-unit="cm" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="10" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round"><title id="visual-title">밑면이 정사각형인 사각기둥 위에 밑면이 합동인 정사각형인 사각뿔을 올려놓은 입체도형.</title><desc id="visual-desc">사각기둥의 윗면과 사각뿔의 밑면이 정확히 겹치게 올려놓은 입체도형. 밑면의 한 변 6cm와 사각기둥의 높이 5cm를 각각 그 길이 곁에 적었고, 사각뿔의 높이 6cm는 밑면의 중심에서 꼭대기까지 그린 점선으로 나타내어 그 값을 점선 오른쪽에 적었다.</desc><rect width="480" height="401" fill="#fff"/><g data-layer="40"><line id="segment-JI" data-role="segment" data-edge="JI" data-vis="hidden" data-style="DASHED" stroke="#111" stroke-width="2.4" stroke-dasharray="5 4" fill="none" x1="208" y1="194.768675" x2="208" y2="50.499997"/></g><g data-layer="40"><line id="space-segment-AB-1" data-role="space-segment" data-edge="AB" data-vis="solid" data-t0="0" data-t1="1" data-style="SOLID" data-accent="REF" data-space="1" stroke="#111" stroke-width="1.6" fill="none" x1="104.183221" y1="325.848284" x2="239.739975" y2="350.500003"/></g><g data-layer="40"><line id="space-segment-BC-1" data-role="space-segment" data-edge="BC" data-vis="solid" data-t0="0" data-t1="1" data-style="SOLID" data-accent="REF" data-space="1" stroke="#111" stroke-width="1.6" fill="none" x1="239.739975" y1="350.500003" x2="311.816779" y2="304.136862"/></g><g data-layer="40"><line id="space-segment-CD-1" data-role="space-segment" data-edge="CD" data-vis="hidden" data-t0="0" data-t1="1" data-style="DASHED" data-accent="REF" data-space="1" stroke="#111" stroke-width="1.6" stroke-dasharray="5 4" fill="none" x1="311.816779" y1="304.136862" x2="176.260025" y2="279.485143"/></g><g data-layer="40"><line id="space-segment-DA-1" data-role="space-segm