<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 336" width="480" height="336" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-solid-figure="solid-figure-v1" data-mode="SOLIDS" data-scale="21.518831" data-origin="125.999989 248.884348" data-yaw="28" data-pitch="20" data-unit="cm" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="10" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round"><title id="visual-title">밑면이 세 변의 길이가 각각 5cm, 12cm, 13cm인 직각삼각형이고 높이가 8cm인 삼각기둥.</title><desc id="visual-desc">밑면이 직각삼각형인 삼각기둥을 비스듬히 본 그림. 밑면의 세 변의 길이 5cm, 12cm, 13cm와 기둥의 높이 8cm가 적혀 있고, 직각삼각형의 직각인 꼭짓점에 직각 표시가 있으며, 보이지 않는 모서리는 점선으로 그려져 있다.</desc><rect width="480" height="336" fill="#fff"/><g data-layer="40"><line id="s1-edge-v0v1-1" data-role="edge" data-solid="s1" data-edge="v0v1" data-vis="solid" data-t0="0" data-t1="1" stroke="#111" stroke-width="1.6" fill="none" x1="125.999999" y1="244.398795" x2="354" y2="285.861812"/></g><g data-layer="40"><line id="s1-edge-v0v2-1" data-role="edge" data-solid="s1" data-edge="v0v2" data-vis="hidden" data-t0="0" data-t1="1" stroke="#111" stroke-width="1.6" stroke-dasharray="5 4" fill="none" x1="125.999999" y1="244.398795" x2="176.512395" y2="211.906881"/></g><g data-layer="40"><line id="s1-edge-v0v3-1" data-role="edge" data-solid="s1" data-edge="v0v3" data-vis="solid" data-t0="0" data-t1="1" stroke="#111" stroke-width="1.6" fill="none" x1="125.999999" y1="244.398795" x2="125.999999" y2="82.630101"/></g><g data-layer="40"><line id="s1-edge-v1v2-1" data-role="edge" data-solid="s1" data-edge="v1v2" data-vis="hidden" data-t0="0" data-t1="1" stroke="#111" stroke-width="1.6" stroke-dasharray="5 4" fill="none" x1="354" y1="285.861812" x2="176.512395" y2="211.906881"/></g><g data-layer="40"><line id="s1-edge-v1v4-1" data-role="edge" data-solid="s1" data-edge="v1v4" data-vis="solid" data-t0="0" data-t1="1" stroke="#111" stroke-width="1.6" fill="none" x1=