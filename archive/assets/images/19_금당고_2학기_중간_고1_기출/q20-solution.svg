<title id="q20-title">t=f(x)에서 합성함수의 치역</title>
<desc id="q20-desc">가로 좌표를 t=f(x)로 놓으면 a=4에서 t의 범위는 −9부터 11이다. 꼭짓점은 (2,0)이고, 양 끝점에서의 함수값은 121과 81이다. a=3에서 치역의 최댓값은 81이다.</desc>
