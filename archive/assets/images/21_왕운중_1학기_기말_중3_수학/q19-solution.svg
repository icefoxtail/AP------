<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 450" width="700" height="450" role="img" aria-labelledby="visual-title visual-desc"><title id="visual-title">높이가 250 m 이상인 물로켓의 구간</title><desc id="visual-desc">세로는 높이, 가로는 발사 이후 시간이다. 파란 포물선과 초록 기준선의 두 교점에서 시간축으로 점선을 내리고, 기준선 위를 주황으로 칠했다.</desc><rect width="700" height="450" fill="white" /><path id="over-threshold" d="M 182.0000 150.0000 Q 346.0000 12.4000 510.0000 150.0000 Z" fill="#f8c591" fill-opacity="0.66" /><line x1="34.0000" y1="365.0000" x2="665.0000" y2="365.0000" stroke="#263345" stroke-width="1.6" stroke-linecap="round" /><line x1="100.0000" y1="49.0000" x2="100.0000" y2="375.0000" stroke="#263345" stroke-width="1.6" stroke-linecap="round" /><line x1="100.0000" y1="150.0000" x2="633.0000" y2="150.0000" stroke="#257038" stroke-width="3.5" stroke-linecap="round" /><line x1="182.0000" y1="150.0000" x2="182.0000" y2="365.0000" stroke="#263345" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="7 7" /><text x="182.0000" y="400.0000" fill="#263345" font-family="Malgun Gothic, Cambria Math, sans-serif" font-size="30" font-weight="600" text-anchor="middle">2</text><line x1="510.0000" y1="150.0000" x2="510.0000" y2="365.0000" stroke="#263345" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="7 7" /><text x="510.0000" y="400.0000" fill="#263345" font-family="Malgun Gothic, Cambria Math, sans-serif" font-size="30" font-weight="600" text-anchor="middle">10</text><path id="rocket-height" d="M 100.0000 236.0000 Q 366.5000 -99.4000 633.0000 291.9000" fill="none" stroke="#205c99" stroke-width="5.7" stroke-linecap="round" /><circle cx="100.0000" cy="236.0000" r="5.0" fill="#205c99" /><circle cx="182.0000" cy="150.0000" r="5.0" fill="#a85112" /><circle cx="510.0000" cy="150.0000" r="5.0" fill="#a85112" /><text x="30.0000" y="33.0000" fill="#263345" font-family="Malgun Gothic, Cambria Math, sans-serif" font-size="31" font-weight="600" text-anchor="start">높이 (m)</text><text x="540.0000" y="411.0000" fill="#263345" font-family="Malgun Gothic, Cambria Math, sans-serif" font-size="31" font-weight="600" text-anchor="start">시간 (초)</text><text x="62.0000" y="398.0000" fill="#263345" font-family="Malgun Gothic, Cambria Math, sans-serif" font-size="29" font-weight="600" text-anchor="middle">0</text><text x="55" y="245.0000" fill="#263345" font-family="Malgun Gothic, Cambria Math, sans-serif" font-size="30" font-weight="600" text-anchor="middle">150</text><text x="50.0000" y="160.0000" fill="#257038" font-family="Malgun Gothic, Cambria Math, sans-serif" font-size="30" font-weight="600" text-anchor="middle">250</text></svg>
