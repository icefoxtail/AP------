<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 384 320" width="384" height="320" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">S(APQ)=S(ABC)/2이므로 xy=12, 코사인법칙으로 PQ²=x²+y²−12≥12이다. 그림은 xy=12를 만족하는 예시 x=3,y=4이다.</title><desc id="visual-desc">A에서 P와 Q까지의 길이가 각각 x와 y로 표시되고 PQ가 강조되어, 삼각형 APQ가 원래 삼각형 ABC의 절반 넓이임을 보인다.</desc><rect width="384" height="320" fill="#fff"/><g data-layer="30"><line id="sAB" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="104.022816123" y1="274.285714286" x2="279.977183877" y2="274.285714286"/></g><g data-layer="30"><line id="sAC" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="104.022816123" y1="274.285714286" x2="235.988591938" y2="45.714285714"/></g><g data-layer="30"><line id="sBC" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="279.977183877" y1="274.285714286" x2="235.988591938" y2="45.714285714"/></g><g data-layer="30"><line id="sAP" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="104.022816123" y1="274.285714286" x2="235.988591938" y2="274.285714286"/></g><g data-layer="30"><line id="sAQ" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="104.022816123" y1="274.285714286" x2="192" y2="121.904761905"/></g><g data-layer="38"><line id="sPQ" data-role="line" stroke="#111" stroke-width="3.2" fill="none" x1="235.988591938"