<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 384 320" width="384" height="320" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">정문·정원·분수·후문 사이의 산책로 연결 그림</title><desc id="visual-desc">왼쪽 정문과 위쪽 정원 사이에 세 갈래 산책로, 정문과 아래쪽 분수 사이에 두 갈래 산책로가 있다. 정원과 분수 사이는 하나의 길로 연결되고, 정원과 오른쪽 후문 사이에 두 갈래, 분수와 후문 사이에 두 갈래 길이 있다. 전체 경로 수와 정답은 나타내지 않았다.</desc><rect width="384" height="320" fill="#fff"/><g data-layer="30"><line id="garden1a" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="96.832713755" y1="160" x2="132.520446097" y2="106.468401487"/></g><g data-layer="30"><line id="garden1b" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="132.520446097" y1="106.468401487" x2="192" y2="76.728624535"/></g><g data-layer="30"><line id="garden2a" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="96.832713755" y1="160" x2="144.416356877" y2="118.364312268"/></g><g data-layer="30"><line id="garden2b" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="144.416356877" y1="118.364312268" x2="192" y2="76.728624535"/></g><g data-layer="30"><line id="garden3a" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="96.832713755" y1="160" x2="156.312267658" y2="130.260223048"/></g><g data-layer="30"><line id="garden3b" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="156.3122676