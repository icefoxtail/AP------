<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 384 320" width="384" height="320" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">통로를 사이에 두고 왼쪽 두 자리와 오른쪽 세 자리로 나뉜 영화관 좌석</title><desc id="visual-desc">한 줄에 왼쪽에 바로 붙어 있는 두 좌석, 통로라고 표시된 빈 공간, 오른쪽에 바로 붙어 있는 세 좌석이 순서대로 놓였다. 총 다섯 자리이며 통로 양쪽의 좌석은 이웃하지 않는다. 누구의 좌석인지와 앉는 경우의 수 정답은 그림에 나타내지 않았다.</desc><rect width="384" height="320" fill="#fff"/><g data-layer="30"><line id="seat1edge1" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="49.142857143" y1="190.07518797" x2="79.218045113" y2="190.07518797"/></g><g data-layer="30"><line id="seat1edge2" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="79.218045113" y1="190.07518797" x2="79.218045113" y2="129.92481203"/></g><g data-layer="30"><line id="seat1edge3" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="79.218045113" y1="129.92481203" x2="49.142857143" y2="129.92481203"/></g><g data-layer="30"><line id="seat1edge4" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="49.142857143" y1="129.92481203" x2="49.142857143" y2="190.07518797"/></g><g data-layer="30"><line id="seat2edge1" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="94.255639098" y1="190.07518797" x2="124.330827068" y2="190.07518797"/></g><g data-layer="30"><line id="seat2edge2" data-role="line" stroke="