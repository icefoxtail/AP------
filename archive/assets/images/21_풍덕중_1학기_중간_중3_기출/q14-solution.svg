<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 770 420" width="770" height="420" role="img" aria-labelledby="title desc"><title id="title">같은 높이로 연결한 사다리꼴과 정사각형</title><desc id="desc">사다리꼴에서 초록 윗변을 t, 같은 색 아랫변을 3t로 표시했다. 주황 높이 h는 오른쪽 정사각형 한 변과 같은 길이이다. 두 영역의 넓이는 각각 300 cm²이다.</desc><rect width="770" height="420" fill="white" /><polygon points="57.0000,306.0000 345.0000,306.0000 249.0000,114.0000 153.0000,114.0000" fill="#dceef9" /><line x1="57.0000" y1="306.0000" x2="345.0000" y2="306.0000" stroke="#28364b" stroke-width="2.6" stroke-linecap="round" /><line x1="345.0000" y1="306.0000" x2="249.0000" y2="114.0000" stroke="#28364b" stroke-width="2.6" stroke-linecap="round" /><line x1="249.0000" y1="114.0000" x2="153.0000" y2="114.0000" stroke="#28364b" stroke-width="2.6" stroke-linecap="round" /><line x1="153.0000" y1="114.0000" x2="57.0000" y2="306.0000" stroke="#28364b" stroke-width="2.6" stroke-linecap="round" /><line x1="57.0000" y1="306.0000" x2="345.0000" y2="306.0000" stroke="#277339" stroke-width="4" stroke-linecap="round" /><line x1="153.0000" y1="114.0000" x2="249.0000" y2="114.0000" stroke="#277339" stroke-width="4" stroke-linecap="round" /><line x1="153.0000" y1="83.0000" x2="249.0000" y2="83.0000" stroke="#277339" stroke-width="1.7" stroke-linecap="round" /><line x1="153.0000" y1="77.0000" x2="153.0000" y2="89.0000" stroke="#277339" stroke-width="1.7" stroke-linecap="round" /><line x1="249.0000" y1="77.0000" x2="249.0000" y2="89.0000" stroke="#277339" stroke-width="1.7" stroke-linecap="round" /><text x="201.0000" y="70.0000" font-size="31" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#277339" text-anchor="middle">t</text><line x1="57.0000" y1="342.0000" x2="345.0000" y2="342.0000" stroke="#277339" stroke-width="1.7" stroke-linecap="round" /><line x1="57.0000" y1="336.0000" x2="57.0000" y2="348.0000" stroke="#277339" stroke-width="1.7" stroke-linecap="round" /><line x1="345.0000" y1="336.0000" x2="345.0000" y2="348.0000