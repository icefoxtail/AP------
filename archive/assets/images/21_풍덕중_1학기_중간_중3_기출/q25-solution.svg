<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 690 316" width="690" height="316" role="img" aria-labelledby="title desc"><title id="title">가로와 세로의 길이를 읽는 직사각형</title><desc id="desc">가로 5x+3y와 세로 x−2y가 각각 직사각형의 두 이웃한 변이다. 두 변의 길이를 합한 뒤 두 배 하면 둘레이다.</desc><rect width="690" height="316" fill="white" /><rect x="79" y="55" width="461" height="179" fill="#d5e8f8" stroke="#28364b" stroke-width="2.8" /><line x1="79.0000" y1="264.0000" x2="540.0000" y2="264.0000" stroke="#205d9c" stroke-width="1.55" stroke-linecap="round" /><line x1="79.0000" y1="258.0000" x2="79.0000" y2="270.0000" stroke="#205d9c" stroke-width="1.55" stroke-linecap="round" /><line x1="540.0000" y1="258.0000" x2="540.0000" y2="270.0000" stroke="#205d9c" stroke-width="1.55" stroke-linecap="round" /><text x="309.5000" y="296.0000" font-size="31" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#205d9c" text-anchor="middle">(5x + 3y) cm</text><line x1="557.0000" y1="55.0000" x2="557.0000" y2="234.0000" stroke="#277339" stroke-width="1.55" stroke-linecap="round" /><line x1="551.0000" y1="55.0000" x2="563.0000" y2="55.0000" stroke="#277339" stroke-width="1.55" stroke-linecap="round" /><line x1="551.0000" y1="234.0000" x2="563.0000" y2="234.0000" stroke="#277339" stroke-width="1.55" stroke-linecap="round" /><text x="570.0000" y="154.5000" font-size="30" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#277339" text-anchor="start">x − 2y</text><text x="309" y="152" fill="#203a54" font-family="Malgun Gothic, Cambria Math, sans-serif" font-size="28" font-weight="600" text-anchor="middle">5x² − 7xy − 6y²</text></svg>
