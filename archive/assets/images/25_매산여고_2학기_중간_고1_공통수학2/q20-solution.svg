<svg data-visual-type="proof-flow" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="PROOF_FLOW" data-axis-scale-mode="NOT_APPLICABLE" data-fact-hash="77a4315bdbb060a6c0fd6317dc20df48e761e7dbb08a615c60fa21399800cdca" data-visual-provenance="deterministic-python-independent-facts" >
<title id="title">접점 좌표를 구하는 핵심 식</title><desc id="desc">접선 방정식과 원의 방정식을 차례로 사용해 x_n을 얻는 흐름</desc>
<style>
.text{font-family:"Noto Sans KR", "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;fill:#111111}.math{font-family:"STIX Two Math", "Cambria Math", "Times New Roman", serif;font-style:italic;fill:#111111}
.title{font-family:"Noto Sans KR", "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;font-size:15px;font-weight:700;fill:#111111}.note{font-family:"Noto Sans KR", "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;font-size:11.5px;fill:#333}
.label{font-family:"STIX Two Math", "Cambria Math", "Times New Roman", serif;font-size:13px;font-style:italic;fill:#111111}.small{font-family:"Noto Sans KR", "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;font-size:10.5px;fill:#444}
</style><rect width="640" height="320" fill="#ffffff"/><text x="28.00" y="28.00" class="title" text-anchor="start">접선 조건 → yₙ → 원의 방정식 → xₙ</text><rect x="24" y="78" width="105" height="100" rx="8" fill="#f4f4f4" stroke="#666"/><text x="76.50" y="103.00" class="small" text-anchor="middle">P에서의 접선</text><text x="76.50" y="140.00" class="note" text-anchor="middle">xₙx + yₙy = 4</text><line x1="129.00" y1="128.00" x2="145.00" y2="128.00" stroke="#777" stroke-width="1.2" stroke-linecap="round" /><rect x="145" y="78" width="105" height="100" rx="8" fill="#f4f4f4" stroke="#666"/><text x="197.50" y="103.00" class="small" text-anchor="middle">A(0,2n)을 대입</text><text x="197.50" y="140.00" class="note" text-anchor="middle">2n·yₙ = 4</text><line x1="250.00" y1="128.00" x2="266.00" y2="128.00" stroke="#777" stroke-width="1.2" stroke-linecap="round" /><rect x="266" y="78" width="105" height="100" rx="8" fill="#f4f4f4" stroke="#666"/><text x="318.50" y="103.00" class="small" text-anchor="middle">y좌표</text><text x="318.50" y="140.00" class="note" text-anchor="middle">yₙ = 2/n</text><line x1="371.00" y1="128.00" x2="387.00" y2="128.00" stroke="#777" stroke-width="1.2" stroke-linecap="round" /><rect x="387" y="78" width="105" height="100" rx="8" fill="#f4f4f4" stroke="#666"/><text x="439.50" y="103.00" class="small" text-anchor="middle">P가 원 위</text><text x="439.50" y="140.00" class="note" text-anchor="middle">xₙ² + yₙ² = 4</text><line x1="492.00" y1="128.00" x2="508.00" y2="128.00" stroke="#777" stroke-width="1.2" stroke-linecap="round" /><rect x="508" y="78" width="105" height="100" rx="8" fill="#f4f4f4" stroke="#666"/><text x="560.50" y="103.00" class="small" text-anchor="middle">제1사분면</text><text x="560.50" y="140.00" class="note" text-anchor="middle">xₙ = 2√(n²−1)/n</text><rect x="155" y="220" width="330" height="58" rx="9" fill="#fff" stroke="#111" stroke-width="2.05"/><text x="320.00" y="245.00" class="title" text-anchor="middle">x₂x₃x₄x₅ = 16√15/5</text></svg>