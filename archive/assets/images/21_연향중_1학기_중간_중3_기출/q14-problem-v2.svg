<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 474" width="720" height="474" role="img" aria-labelledby="title desc"><title id="title">직육면체의 가로, 깊이와 높이</title><desc id="desc">직육면체의 파란 앞면에서 가로 길이는 3x+2이다. 초록 윗면으로 이어지는 깊이 방향 모서리 길이는 2x+1이고 주황 옆면의 세로 모서리 길이는 3x−2이다.</desc><rect width="720" height="474" fill="white" /><polygon points="98.0000,344.0000 442.0000,344.0000 442.0000,176.0000 98.0000,176.0000" fill="none" /><polygon points="98.0000,176.0000 442.0000,176.0000 567.0000,101.0000 223.0000,101.0000" fill="none" /><polygon points="442.0000,344.0000 567.0000,269.0000 567.0000,101.0000 442.0000,176.0000" fill="#f7dabe" /><line x1="223.0000" y1="269.0000" x2="98.0000" y2="344.0000" stroke="#667386" stroke-width="1.9" stroke-linecap="round" stroke-dasharray="7 6" /><line x1="223.0000" y1="269.0000" x2="567.0000" y2="269.0000" stroke="#667386" stroke-width="1.9" stroke-linecap="round" stroke-dasharray="7 6" /><line x1="223.0000" y1="269.0000" x2="223.0000" y2="101.0000" stroke="#667386" stroke-width="1.9" stroke-linecap="round" stroke-dasharray="7 6" /><line x1="98.0000" y1="344.0000" x2="442.0000" y2="344.0000" stroke="#28364b" stroke-width="3.2" stroke-linecap="round" /><line x1="442.0000" y1="344.0000" x2="567.0000" y2="269.0000" stroke="#28364b" stroke-width="3.2" stroke-linecap="round" /><line x1="567.0000" y1="269.0000" x2="567.0000" y2="101.0000" stroke="#28364b" stroke-width="3.2" stroke-linecap="round" /><line x1="567.0000" y1="101.0000" x2="223.0000" y2="101.0000" stroke="#28364b" stroke-width="3.2" stroke-linecap="round" /><line x1="223.0000" y1="101.0000" x2="98.0000" y2="176.0000" stroke="#28364b" stroke-width="3.2" stroke-linecap="round" /><line x1="98.0000" y1="176.0000" x2="98.0000" y2="344.0000" stroke="#28364b" stroke-width="3.2" stroke-linecap="round" /><line x1="442.0000" y1="344.0000" x2="442.0000" y2="176.0000" stroke="#28364b" stroke-width="3.2" stroke-linecap="round" /><line x1="98.0000" y1="176.0000" x2="442.0000" y2="176.0000" stroke="#28364b" stroke-width="3.2" stroke-linecap="round" /><line x1="442.0000" y1="176.0000" x2="567.0000" y2="101.0000" stroke="#28364b" stroke-width="3.2" stroke-linecap="round" /><line x1="98.0000" y1="382.0000" x2="442.0000" y2="382.0000" stroke="#205d9c" stroke-width="1.65" stroke-linecap="round" /><line x1="98.0000" y1="376.0000" x2="98.0000" y2="388.0000" stroke="#205d9c" stroke-width="1.65" stroke-linecap="round" /><line x1="442.0000" y1="376.0000" x2="442.0000" y2="388.0000" stroke="#205d9c" stroke-width="1.65" stroke-linecap="round" /><text x="270.0000" y="411.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#205d9c" text-anchor="middle">3x + 2</text><line x1="470.0000" y1="360.0000" x2="595.0000" y2="285.0000" stroke="#277339" stroke-width="2.1" stroke-linecap="round" /><line x1="466.0000" y1="353.0000" x2="474.0000" y2="367.0000" stroke="#277339" stroke-width="1.9" stroke-linecap="round" /><line x1="591.0000" y1="278.0000" x2="599.0000" y2="292.0000" stroke="#277339" stroke-width="1.9" stroke-linecap="round" /><text x="566.5000" y="354.5000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#277339" text-anchor="middle">2x + 1</text><line x1="603.0000" y1="269.0000" x2="603.0000" y2="101.0000" stroke="#aa5411" stroke-width="1.7" stroke-linecap="round" /><line x1="596.0000" y1="269.0000" x2="610.0000" y2="269.0000" stroke="#aa5411" stroke-width="1.7" stroke-linecap="round" /><line x1="596.0000" y1="101.0000" x2="610.0000" y2="101.0000" stroke="#aa5411" stroke-width="1.7" stroke-linecap="round" /><text x="661.0000" y="193.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#aa5411" text-anchor="middle">3x − 2</text></svg>
