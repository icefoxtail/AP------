<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" width="600" height="320" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">수직선 위에 한 변의 길이가 1인 정사각형 두 개가 나란히 놓여 있고, 두 정사각형의 대각선과 수직선 위의 두 점 P, Q가 표시되어 있다.</title><desc id="visual-desc">가로로 놓인 수직선 위에 단위 정사각형 두 개가 변을 맞대고 서 있다. 각 정사각형에는 왼쪽 아래 꼭짓점에서 오른쪽 위 꼭짓점으로 대각선이 그려져 있다. P는 왼쪽 정사각형의 왼쪽 아래 꼭짓점보다 왼쪽에, Q는 오른쪽 정사각형의 오른쪽 아래 꼭짓점보다 오른쪽에 있다.</desc><rect width="600" height="320" fill="#fff"/><g data-layer="30"><line id="sLP" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="60.714285714" y1="199.880952381" x2="107.431972789" y2="199.880952381"/></g><g data-layer="30"><line id="sPX" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="107.431972789" y1="199.880952381" x2="220.238095238" y2="199.880952381"/></g><g data-layer="30"><line id="sXY" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="220.238095238" y1="199.880952381" x2="300" y2="199.880952381"/></g><g data-layer="30"><line id="sYZ" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="300" y1="199.880952381" x2="379.761904762" y2="199.880952381"/></g><g data-layer="30"><line id="sZQ" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="379.761904762" y1="199.880952381" x2="492.568027211" y2="199.880952381"/></g><g data-layer="30"><line id="sQR" data-role="line" 