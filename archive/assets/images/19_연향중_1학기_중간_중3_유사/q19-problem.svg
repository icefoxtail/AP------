<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 600" width="640" height="600" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">세 원의 중심이 모두 선분 AB 위에 있고 점 D는 선분 BC의 중점이며, 가운데 원의 둘레는 14파이 cm, 색칠한 부분의 넓이는 56파이 제곱센티미터, 선분 CD의 길이는 a cm인 그림이다.</title><desc id="visual-desc">선분 AB 위에 세 원이 나란히 있고, 가장 큰 원과 가장 작은 원 사이의 영역이 색칠되어 있다. 점 D는 선분 BC의 중점으로 표시되어 있고, 선분 CD 옆에 길이 a가 적혀 있다.</desc><rect width="640" height="600" fill="#fff"/><g data-layer="10"><path id="ring" data-role="region" stroke="none" stroke-width="1.6" fill="#c7ccd5" data-owner-points="A M1 M3" data-mark="region" data-mark-id="ring" fill-rule="evenodd" d="M80.714285714 300 A239.285714286 239.285714286 0 0 0 559.285714286 300 A239.285714286 239.285714286 0 0 0 80.714285714 300 Z M80.714285714 300 A132.936507937 132.936507937 0 0 0 346.587301587 300 A132.936507937 132.936507937 0 0 0 80.714285714 300 Z"/></g><g data-layer="30"><line id="sAC" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="80.714285714" y1="300" x2="346.587301587" y2="300"/></g><g data-layer="30"><line id="sCD" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="346.587301587" y1="300" x2="452.936507937" y2="300"/></g><g data-layer="30"><line id="sDB" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="452.936507937" y1="300" x2="559.285714286" y2="300"/></g><g data-layer