<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 340" width="420" height="340" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">세 개의 기둥과 왼쪽 기둥에 큰 원판부터 차례로 쌓인 두 원판이 그려져 있다. 원판 2개를 다른 기둥으로 모두 옮기는 최소 이동 횟수는 3이다.</title><desc id="visual-desc">세 개의 수직 기둥과 왼쪽 기둥에 놓인 크기가 다른 두 원판, 기둥을 받치는 바닥이 보인다.</desc><rect width="420" height="340" fill="#fff"/><g data-layer="10"><path id="disk1" data-role="region" stroke="none" stroke-width="1.6" fill="#e4e7ec" data-owner-points="d1a d1b d1c d1d" data-mark="region" data-mark-id="disk1" fill-rule="evenodd" d="M51.071428571 229.030612245 L141.887755102 229.030612245 L141.887755102 206.326530612 L51.071428571 206.326530612 L51.071428571 229.030612245 Z"/></g><g data-layer="10"><path id="disk2" data-role="region" stroke="none" stroke-width="1.6" fill="#c7ccd5" data-owner-points="d2a d2b d2c d2d" data-mark="region" data-mark-id="disk2" fill-rule="evenodd" d="M66.964285714 206.326530612 L125.994897959 206.326530612 L125.994897959 188.163265306 L66.964285714 188.163265306 L66.964285714 206.326530612 Z"/></g><g data-layer="30"><line id="base" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="51.071428571" y1="238.112244898" x2="368.928571429" y2="238.112244898"/></g><g data-layer="30"><line id="pegA" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="96.479591837" y1="238.1122448