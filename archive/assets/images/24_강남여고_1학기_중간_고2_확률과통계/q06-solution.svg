<svg xmlns="http://www.w3.org/2000/svg" width="900" height="450" viewBox="0 0 900 450" role="img"><style>.title{font-family:'Noto Sans KR','Malgun Gothic',sans-serif;font-size:30px;font-weight:700;fill:#14243a}.body{font-family:'Noto Sans KR','Malgun Gothic',sans-serif;font-size:20px;fill:#27364b}.small{font-family:'Noto Sans KR','Malgun Gothic',sans-serif;font-size:17px;fill:#45566e}.math{font-family:Arial,sans-serif;font-size:22px;font-weight:700;fill:#14243a}.muted{fill:#64748b}.line{stroke:#64748b;stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round}.edge{stroke:#64748b;stroke-width:5;fill:none;stroke-linecap:round}.card{fill:#f6f9fc;stroke:#d6e0ec;stroke-width:2}.accent{fill:#e7f6f5;stroke:#158b84;stroke-width:3}.accentText{fill:#126c67;font-weight:700}.warm{fill:#fff3e8;stroke:#dc7b30;stroke-width:3}.warmText{fill:#a84c12;font-weight:700}</style><text x="42" y="48" class="title">5개의 빈틈에 교사를 나누어 앉힌다</text><text x="42" y="82" class="small">학생을 먼저 원탁에 앉히면 학생 사이에 빈틈이 5곳 생긴다.</text><g transform="translate(38 44) scale(0.82)"><circle cx="255" cy="255" r="164" stroke="#cbd5e1" stroke-width="3" stroke-dasharray="8 8" fill="none"/><circle cx="255" cy="91" r="33" fill="#ffffff" stroke="#38536f" stroke-width="3"/><text x="255" y="98" text-anchor="middle" class="small">학생</text><circle cx="410.9732686724052" cy="204.32121292250864" r="33" fill="#ffffff" stroke="#38536f" stroke-width="3"/><text x="410.9732686724052" y="211.32121292250864" text-anchor="middle" class="small">학생</text><circle cx="351.3967813759656" cy="387.6787870774914" r="33" fill="#ffffff" stroke="#38536f" stroke-width="3"/><text x="351.3967813759656" y="394.6787870774914" text-anchor="middle" class="small">학생</text><circle cx="158.6032186240344" cy="387.6787870774914" r="33" fill="#ffffff" stroke="#38536f" stroke-width="3"/><text x="158.6032186240344" y="394.6787870774914" text-anchor="middle" class="small">학생</text><circle cx="99.02673132759483" cy="204.32121292250858" r="33" fill="#ffffff" stroke="#38536f" stroke-width="3"/><text x="99.02673132759483" y="211.32121292250858" text-anchor="middle" class="small">학생</text><rect x="315.3967813759656" y="100.32121292250861" width="72" height="44" rx="15" class="accent"/><text x="351.3967813759656" y="128.3212129225086" text-anchor="middle" class="small accentText">교사</text><rect x="374.9732686724052" y="283.6787870774914" width="72" height="44" rx="15" class="card"/><text x="410.9732686724052" y="311.6787870774914" text-anchor="middle" class="small ">빈틈</text><rect x="219" y="397" width="72" height="44" rx="15" class="accent"/><text x="255" y="425" text-anchor="middle" class="small accentText">교사</text><rect x="63.02673132759483" y="283.6787870774914" width="72" height="44" rx="15" class="card"/><text x="99.02673132759483" y="311.6787870774914" text-anchor="middle" class="small ">빈틈</text><rect x="122.60321862403438" y="100.32121292250864" width="72" height="44" rx="15" class="accent"/><text x="158.60321862403438" y="128.32121292250864" text-anchor="middle" class="small accentText">교사</text></g><rect x="525" y="132" width="340" height="246" rx="24" class="card"/><text x="560" y="184" class="body accentText">서로 다른 빈틈을 고르면</text><text x="560" y="222" class="body">교사끼리 이웃할 수 없다.</text><text x="560" y="282" class="math">C(5,3) × 3!</text><text x="560" y="326" class="body">빈틈 선택 · 교사 배열</text><text x="560" y="356" class="small">학생 원순열 4!과 곱한다.</text></svg>