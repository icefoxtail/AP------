<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 340" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="t d">
<title id="t">정사각형 중점과 삼각형 BMN의 넓이</title>
<desc id="d">한 변이 4인 정사각형 ABCD에서 M은 AD의 중점, N은 CD의 중점이다. B와 M, N을 이어 BM과 BN이 각각 2루트5이고 삼각형 BMN의 넓이가 6임을 확인하는 보조도형이다.</desc>
<style>text{font-family:Arial,'Noto Sans KR',sans-serif;font-size:16px;fill:currentColor}.label{font-weight:700}.small{font-size:14px}line,rect,polyline,path{vector-effect:non-scaling-stroke}</style>
<rect x="70" y="45" width="240" height="240" fill="none" stroke="currentColor" stroke-width="3"/>
<polyline points="70,285 190,45 310,165 70,285" fill="none" stroke="currentColor" stroke-width="3"/>
<line x1="126" y1="39" x2="126" y2="51" stroke="currentColor" stroke-width="2"/><line x1="134" y1="39" x2="134" y2="51" stroke="currentColor" stroke-width="2"/>
<line x1="246" y1="39" x2="246" y2="51" stroke="currentColor" stroke-width="2"/><line x1="254" y1="39" x2="254" y2="51" stroke="currentColor" stroke-width="2"/>
<line x1="304" y1="101" x2="316" y2="101" stroke="currentColor" stroke-width="2"/><line x1="304" y1="109" x2="316" y2="109" stroke="currentColor" stroke-width="2"/>
<line x1="304" y1="221" x2="316" y2="221" stroke="currentColor" stroke-width="2"/><line x1="304" y1="229" x2="316" y2="229" stroke="currentColor" stroke-width="2"/>
<path d="M88 274 A28 28 0 0 1 95 252" fill="none" stroke="currentColor" stroke-width="2"/>
<g><text x="48" y="42" class="label">A</text><text x="184" y="34" class="label">M</text><text x="318" y="42" class="label">D</text>
<text x="318" y="171" class="label">N</text><text x="318" y="305" class="label">C</text><text x="48" y="305" class="label">B</text>
<text x="96" y="261">x</text><text x="105" y="164" class="small">BM=2√5</text><text x="211" y="232" class="small">BN=2√5</text>
<text x="110" y="326" class="small">[BMN]=16-4-2-4=6</text></g>
