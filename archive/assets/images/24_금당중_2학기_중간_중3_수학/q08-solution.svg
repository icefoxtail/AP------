</g>
<g fill="currentColor" font-family="sans-serif" font-size="17">
  <text x="145" y="34">A</text><text x="70" y="307">B</text><text x="296" y="307">C</text><text x="246" y="194">D</text>
  <text x="112" y="262">75°</text><text x="260" y="264">60°</text><text x="158" y="75">45°</text>
