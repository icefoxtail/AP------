<title id="t">삼각형 ABC에 보조선 BD를 내린 그림</title>
<desc id="d">BC가 8이고 각 B가 75도, 각 C가 60도인 삼각형에서 B에서 AC에 내린 수선의 발을 D라 두어 BD가 AC에 수직이고 각 A가 45도임을 나타낸다.</desc>
