<svg xmlns="http://www.w3.org/2000/svg" width="650" height="400" viewBox="0 0 650 400" role="img" aria-label="두 점 사이의 거리 조건으로 A의 가능한 좌표 두 개를 찾는 그림">
<rect width="650" height="400" fill="white"/>
<style>text{font-family:"Noto Sans CJK KR","NanumSquare",sans-serif}</style>
<text x="22" y="30" font-size="20" font-family="sans-serif" fill="#243447">거리 조건을 만족하는 A의 두 위치</text>
<line x1="60" y1="340" x2="590" y2="340" stroke="#b6c3d1" stroke-width="2"/>
<line x1="110" y1="360" x2="110" y2="50" stroke="#b6c3d1" stroke-width="2"/>
<text x="585" y="330" font-size="16">x</text><text x="120" y="57" font-size="16">y</text>
<line x1="110" y1="70" x2="245" y2="160" stroke="#175d92" stroke-width="3"/>
<line x1="380" y1="70" x2="245" y2="160" stroke="#175d92" stroke-width="3"/>
<line x1="110" y1="70" x2="380" y2="70" stroke="#9bb9d4" stroke-width="1.5" stroke-dasharray="5 5"/>
<circle cx="110" cy="70" r="5" fill="#0e5a83"/>
<circle cx="380" cy="70" r="5" fill="#0e5a83"/>
<circle cx="245" cy="160" r="5" fill="#d16b20"/>
<text x="24" y="91" font-size="17">A1(0, 6)</text>
<text x="388" y="75" font-size="17">A2(6, 6)</text>
<text x="254" y="175" font-size="17">B(3, 4)</text>
<text x="135" y="135" font-size="17" fill="#175d92">√13</text>
<text x="325" y="136" font-size="17" fill="#175d92">√13</text>
<text x="22" y="382" font-size="17">(a − 3)² + 2² = 13  →  a = 0 또는 6  →  합 6</text>
</svg>