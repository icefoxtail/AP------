<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 360" width="620" height="360" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">두 사건 A, B가 독립이면 P(A∩B)=P(A)P(B)이고 A와 B의 여사건도 독립이다. 따라서 A와 B의 여사건이 함께 일어날 확률은 P(A)P(B의 여사건)이고, P(A의 여사건|B)=P(A의 여사건)=1−P(A)이다. 반면 P(A|B)=P(A)와 P(B|A)=P(B)는 일반적으로 같지 않고, P(A∪B)=P(A)+P(B)도 항상 성립하지 않는다. 따라서 답은 ④이다.</title><desc id="visual-desc">왼쪽의 파란 직사각형과 오른쪽의 초록 직사각형이 가운데에서 겹쳐 있고, 겹친 부분은 주황색으로 칠해져 있다. 두 직사각형의 아래쪽 변에 각각 A와 B가 적혀 있다.</desc><rect width="620" height="360" fill="#fff"/><g data-layer="10"><path id="rA" data-role="region" stroke="none" stroke-width="1.6" fill="#7fa6e8" data-owner-points="A1 A4 B1 B4" data-mark="region" data-mark-id="rA" fill-opacity="0.32" fill-rule="evenodd" d="M61.785714286 279.285714286 L210.714285714 279.285714286 L210.714285714 80.714285714 L61.785714286 80.714285714 L61.785714286 279.285714286 Z"/></g><g data-layer="10"><path id="rAB" data-role="region" stroke="none" stroke-width="1.6" fill="#f2a65a" data-owner-points="A2 A3 B1 B4" data-mark="region" data-mark-id="rAB" fill-opacity="0.42" fill-rule="evenodd" d="M210.714285714 279.285714286 L409.285714286 279.285714286 L409.285714286 80.714285714 L210.714285714 80.714285714 L210.714285714 279.285714286 Z"/></g><g data-layer="10"><path id="rB" data-role="region" stroke="none" stroke-width="1.6" fill="#6fcf97" data-owner-point