<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 738 409" width="738" height="409" role="img" aria-labelledby="title desc"><title id="title">형태가 내려가는 직선에서 양 끝의 최댓값과 최솟값</title><desc id="desc">가로축의 −11에서 함수값은 4이고, 가로축의 3에서 함수값은 −2/3이다. 두 점 사이의 직선은 내려가고 양 끝을 모두 포함한다.</desc><rect width="738" height="409" fill="white" /><line x1="77.0000" y1="270.9030" x2="644.0000" y2="270.9030" stroke="#586574" stroke-width="2.05" stroke-linecap="round" /><polygon points="657.0000,270.9030 644.0000,265.7030 644.0000,276.1030" fill="#586574" /><line x1="478.5385" y1="338.0000" x2="478.5385" y2="83.0000" stroke="#586574" stroke-width="2.05" stroke-linecap="round" /><polygon points="478.5385,70.0000 473.3385,83.0000 483.7385,83.0000" fill="#586574" /><line x1="140.0769" y1="115.7656" x2="570.8462" y2="296.7593" stroke="#23639b" stroke-width="7.25" stroke-linecap="round" /><line x1="140.0769" y1="270.9030" x2="140.0769" y2="115.7656" stroke="#97a9ba" stroke-width="2.05" stroke-linecap="round" stroke-dasharray="7 5" /><circle cx="140.0769230769231" cy="115.7655571635311" r="7" fill="#23639b" stroke="white" stroke-width="2" /><line x1="570.8462" y1="270.9030" x2="570.8462" y2="296.7593" stroke="#97a9ba" stroke-width="2.05" stroke-linecap="round" stroke-dasharray="7 5" /><circle cx="570.8461538461538" cy="296.7592860588519" r="7" fill="#23639b" stroke="white" stroke-width="2" /><text x="673.000" y="257.903" fill="#586574" font-size="29" font-weight="600" font-family="Malgun Gothic, Cambria Math, sans-serif" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="4.0" stroke-linejoin="round">x</text><text x="497.538" y="65.000" fill="#586574" font-size="29" font-weight="600" font-family="Malgun Gothic, Cambria Math, sans-serif" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="4.0" stroke-linejoin="round">y</text><text x="456.538" y="297.903" fill="#586574" font-size="29" font-weight="600" font-family="Malgun Gothic, Cambria Math, sans-serif" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="4.0" stroke-linejoin="round">O</text><text x="189.077" y="98.766" fill="#23639b" font-size="29" font-weight="600" font-family="Malgun Gothic, Cambria Math, sans-serif" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="4.0" stroke-linejoin="round">(−11, 4)</text><text x="590.846" y="329.759" fill="#23639b" font-size="29" font-weight="600" font-family="Malgun Gothic, Cambria Math, sans-serif" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="4.0" stroke-linejoin="round">(3, −2/3)</text><text x="515.231" y="117.849" fill="#207267" font-size="31" font-weight="600" font-family="Malgun Gothic, Cambria Math, sans-serif" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="4.0" stroke-linejoin="round">y = (1 − x)/3</text></svg>
