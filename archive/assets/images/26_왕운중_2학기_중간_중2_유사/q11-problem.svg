<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 320" width="420" height="320" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">평행사변형 ABCD의 네 변 옆에 길이를 나타내는 식과 값이 적힌 그림이다.</title><desc id="visual-desc">평행사변형 ABCD의 네 꼭짓점 A, B, C, D와 네 변이 그려져 있고, 각 변의 바깥쪽에 길이가 적혀 있다. 변 AB 옆에는 2x-1, 변 CD 옆에는 9, 변 BC 옆에는 y+3, 변 AD 옆에는 11이 각각 적혀 있으며, 마주 보는 두 변 AB와 CD, 두 변 BC와 AD가 서로 평행한 모양으로 놓여 있다.</desc><rect width="420" height="320" fill="#fff"/><g data-layer="30"><line id="sAB" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="155.731707317" y1="90.226480836" x2="51.071428571" y2="229.773519164"/></g><g data-layer="30"><line id="sBC" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="51.071428571" y1="229.773519164" x2="264.268292683" y2="229.773519164"/></g><g data-layer="30"><line id="sCD" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="264.268292683" y1="229.773519164" x2="368.928571429" y2="90.226480836"/></g><g data-layer="30"><line id="sDA" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="368.928571429" y1="90.226480836" x2="155.731707317" y2="90.226480836"/></g><g data-layer="70"><circle id="A" data-role="point" stroke="#111" stroke-width="0.8" fill="#111" cx="155.731707317" cy="90.226480836" r="3.2"/></g><g data-layer="70"><circle id="B" data-role="point" stroke="#111" stroke-w