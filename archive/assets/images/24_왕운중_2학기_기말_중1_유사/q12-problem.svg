<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 440" width="460" height="440" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">세로로 그린 회전축 l의 오른쪽에 직사각형이 놓여 있다. 축에서 직사각형의 가까운 변까지의 거리가 2cm, 직사각형의 가로가 2cm, 세로가 6cm로 표시되어 있다.</title><desc id="visual-desc">점선으로 그린 세로 직선 l이 있고 그 오른쪽에 직사각형이 축과 떨어져 자리한다. 아래쪽에 축과 직사각형 사이의 거리 2cm, 위쪽에 직사각형의 가로 2cm, 오른쪽에 세로 6cm가 치수선과 함께 적혀 있다.</desc><rect width="460" height="440" fill="#fff"/><g data-layer="30"><line id="sL" data-role="line" stroke="#111" stroke-width="1.6" fill="none" stroke-dasharray="6 4" x1="140.233963772" y1="365.031994406" x2="140.233963772" y2="50.850867608"/></g><g data-layer="30"><line id="sR1R2" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="230" y1="365.031994406" x2="319.766036228" y2="365.031994406"/></g><g data-layer="30"><line id="sR2R3" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="319.766036228" y1="365.031994406" x2="319.766036228" y2="95.733885722"/></g><g data-layer="30"><line id="sR3R4" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="319.766036228" y1="95.733885722" x2="230" y2="95.733885722"/></g><g data-layer="30"><line id="sR4R1" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="230" y1="95.733885722" x2="230" y2="365.031994406"/></g><g data-layer="52"><line id="dGap-ext-from" data-role="indicator