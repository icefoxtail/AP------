<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 420" preserveAspectRatio="xMidYMid meet" data-visual-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-safe-margin="32" data-scale-policy="SCHEMATIC_RELATION" data-visual-provenance="deterministic-python-3d-model" data-geometry-model="H_ON_L;PH_PERP_L;OH_PERP_L;PO_PERP_OH">
<title>q19 solution — corrected three-perpendicular theorem condition</title>
<desc>H lies on l. PH and OH are perpendicular to l, and the added condition PO is perpendicular to OH. Therefore PO is perpendicular to plane alpha.</desc>
<rect x="0" y="0" width="620" height="420" fill="white"/>
<polygon points="80,300 340,300 410,210 150,210" fill="#fafafa" stroke="#111" stroke-width="1.8"/>
<!-- l passes exactly through H -->
<line x1="155.00" y1="220.00" x2="265.00" y2="300.00" stroke="#111" stroke-width="2.2" fill="none"/>
<!-- OH, PO, PH -->
<line x1="210.00" y1="260.00" x2="330.00" y2="260.00" stroke="#111" stroke-width="2.2" fill="none"/>
<line x1="330.00" y1="260.00" x2="330.00" y2="95.00" stroke="#111" stroke-width="2.2" fill="none"/>
<line x1="210.00" y1="260.00" x2="330.00" y2="95.00" stroke="#111" stroke-width="2.2" fill="none"/>
<!-- right-angle marker: PH ⟂ l (projected exact) -->
<path d="M 219.60 253.00 L 226.60 262.60 L 217.00 269.60" fill="none" stroke="#111" stroke-width="1.5"/>
<!-- right-angle indicator: OH ⟂ l in the 3D/plane geometry -->
<path d="M 197.00 250.55 L 205.50 244.35 L 215.00 251.25" fill="none" stroke="#111" stroke-width="1.5"/>
<!-- added condition: PO ⟂ OH (projected exact) -->
<path d="M 318.00 260.00 L 318.00 248.00 L 330.00 248.00" fill="none" stroke="#111" stroke-width="1.5"/>
<circle cx="210.00" cy="260.00" r="2.8" fill="#111"/>
<text x="198" y="281" font-family="'STIX Two Math','Cambria Math','Times New Roman',serif" font-size="14" text-anchor="middle" fill="#111">H</text>
<circle cx="330.00" cy="260.00" r="2.8" fill="#111"/>
<text x="345" y="279" font-family="'STIX Two Math','Cambria Math','Times New Roman',serif" font-size="14" text-anchor="middle" fill="#111">O</text>
<circle cx="330.00" cy="95.00" r="2.8" fill="#111"/>
<text x="330" y="82" font-family="'STIX Two Math','Cambria Math','Times New Roman',serif" font-size="14" text-anchor="middle" fill="#111">P</text>
<text x="145" y="236" font-family="'STIX Two Math','Cambria Math','Times New Roman',serif" font-size="14" text-anchor="middle" fill="#111">l</text>
<text x="105" y="290" font-family="'STIX Two Math','Cambria Math','Times New Roman',serif" font-size="15" text-anchor="middle" fill="#111">α</text>
<text x="485" y="82" font-family="'STIX Two Math','Cambria Math','Times New Roman',serif" font-size="14" text-anchor="middle" fill="#111">H ∈ l</text>
<text x="485" y="112" font-family="'STIX Two Math','Cambria Math','Times New Roman',serif" font-size="14" text-anchor="middle" fill="#111">PH ⟂ l</text>
<text x="485" y="142" font-family="'STIX Two Math','Cambria Math','Times New Roman',serif" font-size="14" text-anchor="middle" fill="#111">OH ⟂ l</text>
<text x="485" y="172" font-family="'STIX Two Math','Cambria Math','Times New Roman',serif" font-size="14" text-anchor="middle" fill="#111">PO ⟂ OH</text>
<text x="485" y="218" font-family="'STIX Two Math','Cambria Math','Times New Roman',serif" font-size="16" font-weight="700" text-anchor="middle" fill="#111">⇒ PO ⟂ α</text>
</svg>