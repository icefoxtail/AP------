<text x="265.00" y="330.00" font-family="'STIX Two Math','Cambria Math','Times New Roman',serif" font-size="14" font-weight="400" text-anchor="middle" fill="#111">BO = s/√2</text>
<text x="143.00" y="205.00" font-family="'STIX Two Math','Cambria Math','Times New Roman',serif" font-size="14" font-weight="400" text-anchor="end" fill="#111">AO = s/√2</text>
