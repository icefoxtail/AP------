<svg xmlns="http://www.w3.org/2000/svg" width="880" height="460" viewBox="0 0 880 460">
<rect width="880" height="460" fill="white"/>
<text x="440" y="43" font-family="NanumGothic,sans-serif" font-size="24" font-weight="bold" text-anchor="middle">직사각형의 넓이로 인수분해</text>
<rect x="240" y="134" width="390" height="190" fill="#eff7ff" stroke="#2f528f" stroke-width="3"/>
<text x="435" y="119" font-family="NanumGothic,sans-serif" font-size="27" text-anchor="middle">가로: 3a + 2</text>
<text x="196" y="216" font-family="NanumGothic,sans-serif" font-size="25" text-anchor="middle" transform="rotate(-90 196 216)">세로: 2a - 1</text>
<text x="435" y="216" font-family="NanumGothic,sans-serif" font-size="25" text-anchor="middle">넓이: 6a² + a - 2</text>
<text x="440" y="374" font-family="NanumGothic,sans-serif" font-size="22" text-anchor="middle">6a² + a - 2 = (3a + 2)(2a - 1)</text>
<text x="440" y="415" font-family="NanumGothic,sans-serif" font-size="22" font-weight="bold" text-anchor="middle">따라서 세로 = 2a - 1</text>
</svg>