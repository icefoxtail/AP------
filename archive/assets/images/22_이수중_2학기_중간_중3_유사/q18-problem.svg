<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 580" width="640" height="580" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">삼각형 ABC의 내접원 O가 세 변과 만나는 점을 D, E, F로 나타낸 그림이다. 선분 AD, DB, BC의 길이는 각각 4, 6, 11이고 AC의 길이는 x로 표시되어 있다.</title><desc id="visual-desc">삼각형 ABC 안에 내접원 O가 있고, 원과 변 AB, BC, CA의 접점이 D, E, F로 표시되어 있다. AD는 4, DB는 6, BC는 11로 적혀 있고 AC의 길이는 x로 표시되어 있다.</desc><rect width="640" height="580" fill="#fff"/><g data-layer="30"><line id="AD" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="360.377804014" y1="109.675248245" x2="241.369539551" y2="253.935049649"/></g><g data-layer="30"><line id="DB" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="241.369539551" y1="253.935049649" x2="62.857142857" y2="470.324751755"/></g><g data-layer="30"><line id="BC" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="62.857142857" y1="470.324751755" x2="577.142857143" y2="470.324751755"/></g><g data-layer="30"><line id="CA" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="577.142857143" y1="470.324751755" x2="360.377804014" y2="109.675248245"/></g><g data-layer="40"><circle id="circ" data-role="circle" stroke="#111" stroke-width="2.05" fill="none" cx="343.376623377" cy="338.086600468" r="132.238151287"/></g><g data-layer="70"><circle id="B" data-role="point" stroke="#111" stro