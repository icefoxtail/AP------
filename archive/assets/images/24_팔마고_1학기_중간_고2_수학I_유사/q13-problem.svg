<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 380" width="480" height="380" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">길이가 12인 선분 AB를 지름으로 하는 반원의 호 위에 점 P가 있고, 선분 AB 위에 AP와 AQ의 길이가 같도록 점 Q를 잡아 점 A를 중심으로 부채꼴 APQ의 호 PQ를 그린 그림이다.</title><desc id="visual-desc">지름 AB가 수평으로 놓인 반원이 위로 볼록하게 그려져 있고, 그 호 위의 오른쪽에 점 P가 있다. 선분 AB 위에는 A에서 오른쪽으로 떨어진 점 Q가 있어 선분 AP와 선분 AQ의 길이가 같게 표시되어 있다. 점 A를 중심으로 P와 Q를 잇는 짧은 호가 그려져 있고, 선분 AB 아래에 길이 12가 표시되어 있다.</desc><rect width="480" height="380" fill="#fff"/><g data-layer="30"><line id="sAQ" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="79.901477833" y1="260.443349754" x2="357.200252443" y2="260.443349754"/></g><g data-layer="30"><line id="sQB" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="357.200252443" y1="260.443349754" x2="400.098522167" y2="260.443349754"/></g><g data-layer="30"><line id="sAP" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="79.901477833" y1="260.443349754" x2="320.049261084" y2="121.793962448"/></g><g data-layer="40"><polyline id="aBP" data-role="circularArc" stroke="#111" stroke-width="2.05" fill="none" data-owner-points="B P" data-center-point="O" data-owner-radius="6.0" data-sweep="CCW" points="400.098522167,260.443349754 400.012803414,255.205072947 399.755738942,249.972405419 399.327604024,244.75095044 398.728857116,23