<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" width="480" height="480" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">직선 l을 회전축으로 하는 평면도형으로, 위쪽은 반지름 5cm인 사분원, 아래쪽은 윗변 5cm, 아랫변 2cm, 높이 4cm, 빗변 5cm인 사다리꼴이다.</title><desc id="visual-desc">오른쪽에 세로로 놓인 직선 l이 회전축이고, 그 왼쪽에 사분원이 위로 볼록하게 붙은 사다리꼴이 그려져 있다. 사분원의 반지름과 사다리꼴의 윗변에 5cm, 아랫변에 2cm, 높이에 4cm, 빗변에 5cm가 표시되어 있다.</desc><rect width="480" height="480" fill="#fff"/><g data-layer="30"><line id="sPO" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="162.619047619" y1="240" x2="317.380952381" y2="240"/></g><g data-layer="30"><line id="sOS" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="317.380952381" y1="240" x2="317.380952381" y2="363.80952381"/></g><g data-layer="30"><line id="sSR" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="317.380952381" y1="363.80952381" x2="255.476190476" y2="363.80952381"/></g><g data-layer="30"><line id="sRP" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="255.476190476" y1="363.80952381" x2="162.619047619" y2="240"/></g><g data-layer="30"><line id="l" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="317.380952381" y1="425.714285714" x2="317.380952381" y2="54.285714286"/></g><g data-layer="46"><polyline id="arcPQ" data-role="circularArc" stroke="#111" stroke-width="3.2"