<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">정삼각형 모양 담장의 한 꼭짓점에 끈을 묶어 강아지를 연결한 모습이다. 담장의 한 변과 끈의 길이가 표시되어 있다.</title><desc id="visual-desc">정삼각형 담장의 위쪽 꼭짓점에서 오른쪽으로 길이가 7인 끈이 뻗어 있고, 담장의 한 변에는 길이 5가 표시되어 있다. 담장 안과 끈 끝에 담장, 강아지라는 글자가 있다.</desc><rect width="640" height="420" fill="#fff"/><g data-layer="30"><line id="sLR" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="62.857142857" y1="322.47083166" x2="322.597402597" y2="322.47083166"/></g><g data-layer="30"><line id="sRT" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="322.597402597" y1="322.47083166" x2="192.727272727" y2="97.52916834"/></g><g data-layer="30"><line id="sTL" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="192.727272727" y1="97.52916834" x2="62.857142857" y2="322.47083166"/></g><g data-layer="30"><line id="sTP" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="192.727272727" y1="97.52916834" x2="556.363636364" y2="97.52916834"/></g><g data-layer="52"><line id="dLR-ext-from" data-role="indicator" stroke="#111" stroke-width="0.8" fill="none" data-mark="dimension" data-mark-id="dLR" data-mark-part="ext-from" x1="62.857142857" y1="326.47083166" x2="62.857142857" y2="341.97083166"/></g><g data-layer="52"><line id="dLR-ext