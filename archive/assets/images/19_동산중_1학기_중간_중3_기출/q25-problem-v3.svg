<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 724 452" width="724" height="452" role="img" aria-labelledby="title desc"><title id="title">정사각형 세 장의 바깥 둘레와 맞닿은 변</title><desc id="desc">왼쪽에서 A·B·C 순으로 정사각형이 커진다. A의 오른쪽 변 전체는 B와, B의 오른쪽 변 전체는 C와 맞닿아 있다.</desc><rect width="724" height="452" fill="white" /><polygon points="70.0000,181.5000 167.0000,181.5000 167.0000,278.5000 70.0000,278.5000" fill="none" /><text x="118.5000" y="242.0000" font-size="35" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#205d9c" text-anchor="middle">A</text><line x1="70.0000" y1="181.5000" x2="167.0000" y2="181.5000" stroke="#205d9c" stroke-width="3.8" stroke-linecap="round" /><line x1="167.0000" y1="181.5000" x2="167.0000" y2="278.5000" stroke="#205d9c" stroke-width="3.8" stroke-linecap="round" /><line x1="167.0000" y1="278.5000" x2="70.0000" y2="278.5000" stroke="#205d9c" stroke-width="3.8" stroke-linecap="round" /><line x1="70.0000" y1="278.5000" x2="70.0000" y2="181.5000" stroke="#205d9c" stroke-width="3.8" stroke-linecap="round" /><polygon points="167.0000,133.0000 361.0000,133.0000 361.0000,327.0000 167.0000,327.0000" fill="none" /><text x="264.0000" y="242.0000" font-size="35" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#277339" text-anchor="middle">B</text><line x1="167.0000" y1="133.0000" x2="361.0000" y2="133.0000" stroke="#277339" stroke-width="3.8" stroke-linecap="round" /><line x1="361.0000" y1="133.0000" x2="361.0000" y2="327.0000" stroke="#277339" stroke-width="3.8" stroke-linecap="round" /><line x1="361.0000" y1="327.0000" x2="167.0000" y2="327.0000" stroke="#277339" stroke-width="3.8" stroke-linecap="round" /><line x1="167.0000" y1="327.0000" x2="167.0000" y2="133.0000" stroke="#277339" stroke-width="3.8" stroke-linecap="round" /><polygon points="361.0000,84.5000 652.0000,84.5000 652.0000,375.5000 361.0000,375.5000" fill="none" /><text x="506.5000" y="242.0000" font-size="35" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#aa5411" text-anchor="middle">C</text><line x1="361.0000" y1="84.5000" x2="652.0000" y2="84.5000" stroke="#aa5411" stroke-width="3.8" stroke-linecap="round" /><line x1="652.0000" y1="84.5000" x2="652.0000" y2="375.5000" stroke="#aa5411" stroke-width="3.8" stroke-linecap="round" /><line x1="652.0000" y1="375.5000" x2="361.0000" y2="375.5000" stroke="#aa5411" stroke-width="3.8" stroke-linecap="round" /><line x1="361.0000" y1="375.5000" x2="361.0000" y2="84.5000" stroke="#aa5411" stroke-width="3.8" stroke-linecap="round" /></svg>
