<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 699 579" width="699" height="579" role="img" aria-labelledby="title desc"><title id="title">두 원 사이 고리의 넓이를 구하는 두 반지름</title><desc id="desc">파란 안쪽 원의 넓이는 바깥 원 전체 넓이에서 뺀다. 주황 고리 부분과 두 반지름을 서로 구별했다.</desc><rect width="699" height="579" fill="white" /><circle cx="344" cy="260" r="214" stroke="#aa5411" stroke-width="4.5" fill="#fae6ce" /><circle cx="344" cy="260" r="128.4" stroke="#205d9c" stroke-width="4.5" fill="#f9fcff" /><line x1="344.0000" y1="260.0000" x2="472.4000" y2="260.0000" stroke="#205d9c" stroke-width="4.45" stroke-linecap="round" /><line x1="344.0000" y1="260.0000" x2="130.0000" y2="260.0000" stroke="#aa5411" stroke-width="4.45" stroke-linecap="round" /><text x="403.0000" y="238.0000" font-size="30" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#205d9c" text-anchor="middle">7.5 cm</text><text x="296.0000" y="307.0000" font-size="30" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#aa5411" text-anchor="middle">12.5 cm</text><circle cx="344" cy="260" r="5.1" fill="#28364b" /><text x="344.0000" y="537.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">바깥 넓이 − 안쪽 넓이</text></svg>
