<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 699 536" width="699" height="536" role="img" aria-labelledby="title desc"><title id="title">두 원 사이 고리의 넓이를 구하는 두 반지름</title><desc id="desc">같은 중심에서 안쪽 파란 원까지 7.5 cm이다. 주황 바깥 원까지의 거리는 12.5 cm이다.</desc><rect width="699" height="536" fill="white" /><circle cx="344" cy="260" r="214" stroke="#aa5411" stroke-width="4.5" fill="#fae6ce" /><circle cx="344" cy="260" r="128.4" stroke="#205d9c" stroke-width="4.5" fill="#f9fcff" /><line x1="344.0000" y1="260.0000" x2="472.4000" y2="260.0000" stroke="#205d9c" stroke-width="4.45" stroke-linecap="round" /><line x1="344.0000" y1="260.0000" x2="130.0000" y2="260.0000" stroke="#aa5411" stroke-width="4.45" stroke-linecap="round" /><text x="403.0000" y="238.0000" font-size="30" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#205d9c" text-anchor="middle">7.5 cm</text><text x="296.0000" y="307.0000" font-size="30" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#aa5411" text-anchor="middle">12.5 cm</text><circle cx="344" cy="260" r="5.1" fill="#28364b" /></svg>
