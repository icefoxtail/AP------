<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 734 535" width="734" height="535" role="img" aria-labelledby="title desc"><title id="title">마름모의 두 대각선과 주어진 반각</title><desc id="desc">마름모 ABCD의 대각선은 O에서 만난다. OD는 8 cm이고 BO에는 x cm가 적혀 있다. A에서 AO와 AD 사이의 각은 60도, B에서 BA와 BO 사이 각은 y도이다.</desc><rect width="734" height="535" fill="white" /><polygon points="367.0000,108.2342 105.0000,259.5000 367.0000,410.7658 629.0000,259.5000" fill="#fff" /><polygon points="367.0000,108.2342 105.0000,259.5000 629.0000,259.5000" fill="#fff" /><line x1="367.0000" y1="108.2342" x2="105.0000" y2="259.5000" stroke="#21639a" stroke-width="4.8" stroke-linecap="round" /><line x1="105.0000" y1="259.5000" x2="367.0000" y2="410.7658" stroke="#21639a" stroke-width="4.8" stroke-linecap="round" /><line x1="367.0000" y1="410.7658" x2="629.0000" y2="259.5000" stroke="#21639a" stroke-width="4.8" stroke-linecap="round" /><line x1="629.0000" y1="259.5000" x2="367.0000" y2="108.2342" stroke="#21639a" stroke-width="4.8" stroke-linecap="round" /><line x1="367.0000" y1="108.2342" x2="367.0000" y2="410.7658" stroke="#774698" stroke-width="4.65" stroke-linecap="round" /><line x1="105.0000" y1="259.5000" x2="629.0000" y2="259.5000" stroke="#227365" stroke-width="4.9" stroke-linecap="round" /><line x1="105.0000" y1="290.5000" x2="367.0000" y2="290.5000" stroke="#227365" stroke-width="1.7" stroke-linecap="round" /><line x1="105.0000" y1="285.0000" x2="105.0000" y2="296.0000" stroke="#227365" stroke-width="1.7" stroke-linecap="round" /><line x1="367.0000" y1="285.0000" x2="367.0000" y2="296.0000" stroke="#227365" stroke-width="1.7" stroke-linecap="round" /><text x="282.0000" y="325.5000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#227365" text-anchor="middle">x cm</text><line x1="367.0000" y1="233.5000" x2="629.0000" y2="233.5000" stroke="#227365" stroke-width="1.7" stroke-linecap="round" /><line x1="367.0000" y1="228.0000" x2="367.0000" y2="239.0000" stroke="#2273