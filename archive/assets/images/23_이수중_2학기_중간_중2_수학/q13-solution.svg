<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 440" role="img" aria-labelledby="t d"><title id="t">등변사다리꼴의 대각선과 각</title><desc id="d">등변사다리꼴 ABCD에서 AC와 BD가 같고 교점 O가 대칭축 위에 있어 OB와 OC가 같다. AC가 11, BO가 7, DOC가 88도일 때 y는 4, x는 44이다.</desc><g fill="none" stroke="#111" stroke-width="4" stroke-linejoin="round"><polygon points="180,80 480,80 570,350 90,350"/><line x1="180" y1="80" x2="570" y2="350"/><line x1="90" y1="350" x2="480" y2="80"/><circle cx="330" cy="184" r="5" fill="#111"/></g><g font-family="sans-serif" font-size="24" fill="#111"><text x="155" y="62">A</text><text x="55" y="382">B</text><text x="575" y="382">C</text><text x="490" y="62">D</text><text x="342" y="180">O</text><text x="130" y="245">BO=7</text><text x="365" y="125">OD=y</text><text x="390" y="245">88°</text><text x="120" y="330">x</text><text x="205" y="410">BD=AC=11 → y=4,  OB=OC → x=44°</text></g></svg>