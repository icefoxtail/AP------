<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 564" width="742" height="564" role="img" aria-labelledby="title desc"><title id="title">직각삼각형의 빗변을 나누는 높이</title><desc id="desc">A의 각은 직각이다. A에서 밑변 BC에 내린 수선은 D에 닿는다. AB는 10이고 BD는 8이다. 작은 직각삼각형을 칠하고 빗변 전체 길이를 표시했다.</desc><rect width="742" height="564" fill="white" /><polygon points="447.1250,143.5000 99.1250,404.5000 642.8750,404.5000" fill="#fff" /><polygon points="447.1250,143.5000 99.1250,404.5000 447.1250,404.5000" fill="#e3f2e9" /><line x1="447.1250" y1="143.5000" x2="99.1250" y2="404.5000" stroke="#21639a" stroke-width="4.8" stroke-linecap="round" /><line x1="99.1250" y1="404.5000" x2="642.8750" y2="404.5000" stroke="#21639a" stroke-width="4.8" stroke-linecap="round" /><line x1="642.8750" y1="404.5000" x2="447.1250" y2="143.5000" stroke="#21639a" stroke-width="4.8" stroke-linecap="round" /><line x1="447.1250" y1="143.5000" x2="447.1250" y2="404.5000" stroke="#227365" stroke-width="4.9" stroke-linecap="round" /><line x1="427.1250" y1="158.5000" x2="442.1250" y2="178.5000" stroke="#586574" stroke-width="1.8" stroke-linecap="round" /><line x1="442.1250" y1="178.5000" x2="462.1250" y2="163.5000" stroke="#586574" stroke-width="1.8" stroke-linecap="round" /><line x1="447.1250" y1="380.5000" x2="471.1250" y2="380.5000" stroke="#586574" stroke-width="1.8" stroke-linecap="round" /><line x1="471.1250" y1="380.5000" x2="471.1250" y2="404.5000" stroke="#586574" stroke-width="1.8" stroke-linecap="round" /><line x1="78.7250" y1="377.3000" x2="426.7250" y2="116.3000" stroke="#21639a" stroke-width="1.7" stroke-linecap="round" /><line x1="75.4250" y1="372.9000" x2="82.0250" y2="381.7000" stroke="#21639a" stroke-width="1.7" stroke-linecap="round" /><line x1="423.4250" y1="111.9000" x2="430.0250" y2="120.7000" stroke="#21639a" stroke-width="1.7" stroke-linecap="round" /><text x="234.1250" y="230.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#21639a" text-anchor="middle">