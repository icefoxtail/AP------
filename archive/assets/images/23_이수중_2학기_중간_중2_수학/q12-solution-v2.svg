<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 384 320" width="384" height="320" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">직사각형의 두 대각선은 길이가 같고 서로를 이등분하므로 OB=OC이고 △BOC는 이등변삼각형이다. 그래서 ∠OBC=∠BCO=42°이다. B, O, D가 한 직선 위에 있으므로 ∠DBC=42°이고, ∠BCD=90°이므로 △BCD에서 ∠BDC=180°−90°−42°=48°이다. 따라서 답은 ④이다.</title><desc id="visual-desc">직사각형 ABCD의 두 대각선이 점 O에서 만나고 네 선분 OA, OB, OC, OD에 같은 길이 눈금이 있다. 꼭짓점 C의 직각 표시가 있고 ∠ACB와 ∠OBC에 같은 각 42°, ∠BDC에 x=48°가 표시되어 있다.</desc><rect width="384" height="320" fill="#fff"/><g data-layer="30"><line id="AB" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="66.559493648" y1="47.052860762" x2="66.559493648" y2="272.947139238"/></g><g data-layer="30"><line id="BC" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="66.559493648" y1="272.947139238" x2="317.440506352" y2="272.947139238"/></g><g data-layer="30"><line id="CD" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="317.440506352" y1="272.947139238" x2="317.440506352" y2="47.052860762"/></g><g data-layer="30"><line id="DA" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="317.440506352" y1="47.052860762" x2="66.559493648" y2="47.052860762"/></g><g data-layer="30"><line id="AO" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="66.559493648" y1="47.052860762" x2="192" y2="160"/></g><g d