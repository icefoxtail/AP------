<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" role="img" aria-labelledby="t d"><title id="t">외심과 내심을 이용한 두 각 계산</title><desc id="d">삼각형 ABC의 꼭짓각 A가 80도일 때 외심 O에서 각 BOC는 160도이고 내심 I에서 각 BIC는 130도이다.</desc><g fill="none" stroke="#111" stroke-width="4" stroke-linejoin="round"><polygon points="360,55 90,390 630,390"/><circle cx="360" cy="245" r="5" fill="#111"/><circle cx="360" cy="305" r="5" fill="#111"/><line x1="360" y1="245" x2="90" y2="390"/><line x1="360" y1="245" x2="630" y2="390"/><line x1="360" y1="305" x2="90" y2="390"/><line x1="360" y1="305" x2="630" y2="390"/></g><g font-family="sans-serif" font-size="24" fill="#111"><text x="350" y="42">A</text><text x="60" y="420">B</text><text x="640" y="420">C</text><text x="375" y="242">I</text><text x="375" y="310">O</text><text x="335" y="105">80°</text><text x="255" y="230">y = 130°</text><text x="250" y="350">x = 160°</text><text x="90" y="455">외심: x=2∠A · 내심: y=90°+∠A/2</text></g></svg>