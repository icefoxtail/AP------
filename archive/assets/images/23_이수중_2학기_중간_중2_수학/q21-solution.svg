<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" role="img" aria-labelledby="t d"><title id="t">외심과 내심을 이용한 두 각 계산</title><desc id="d">꼭지각 A가 80도인 삼각형에서 위쪽 점 I는 내심, 아래쪽 점 O는 외심이다. 각 BOC는 160도이고 각 BIC는 130도이다.</desc><g fill="none" stroke="#111" stroke-width="4" stroke-linejoin="round"><polygon points="360,50 108.27,350 611.73,350"/><circle cx="360" cy="232.616" r="5" fill="#111"/><circle cx="360" cy="305.613" r="5" fill="#111"/><line x1="360" y1="232.616" x2="108.27" y2="350"/><line x1="360" y1="232.616" x2="611.73" y2="350"/><line x1="360" y1="305.613" x2="108.27" y2="350"/><line x1="360" y1="305.613" x2="611.73" y2="350"/></g><g font-family="sans-serif" font-size="24" fill="#111"><text x="350" y="38">A</text><text x="78" y="382">B</text><text x="621" y="382">C</text><text x="375" y="229">I</text><text x="375" y="310">O</text><text x="300" y="273">y=130°</text><text x="300" y="340">x=160°</text><text x="90" y="412" font-size="20">OA=OB=OC → ∠OBC=∠BCO=10° → x=160°</text><text x="235" y="442" font-size="20">I는 내심 → y=130°</text></g></svg>