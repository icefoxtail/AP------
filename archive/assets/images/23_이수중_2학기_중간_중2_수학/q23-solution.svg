<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" role="img" aria-labelledby="t d"><title id="t">평행사변형의 각 이등분선과 안쪽 평행사변형 넓이</title><desc id="d">AB가 10, BC가 13, 넓이가 78인 평행사변형에서 각 B와 D의 이등분선이 만드는 EBFD의 밑변은 3, 높이는 6이므로 넓이는 18이다.</desc><g fill="none" stroke="#111" stroke-width="4" stroke-linejoin="round"><polygon points="180,70 590,70 500,370 90,370"/><line x1="90" y1="370" x2="495" y2="70"/><line x1="590" y1="70" x2="185" y2="370"/><polygon points="495,70 590,70 185,370 90,370"/></g><g font-family="sans-serif" font-size="24" fill="#111"><text x="155" y="55">A</text><text x="55" y="402">B</text><text x="510" y="402">C</text><text x="600" y="55">D</text><text x="475" y="55">E</text><text x="175" y="405">F</text><text x="235" y="105">AE=10, ED=3</text><text x="195" y="355">BF=3, FC=10</text><text x="270" y="225">h=78÷13=6</text><text x="230" y="455">[EBFD] = 3 × 6 = 18 cm²</text></g></svg>