<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 430" role="img" aria-labelledby="t d"><title id="t">평행사변형의 각 이등분선과 안쪽 평행사변형 넓이</title><desc id="d">AB=10, BC=13, 높이 6인 평행사변형을 실제 비율로 구성했다. AE=CF=10, ED=BF=3이고 EBFD의 넓이는 18이다.</desc><g fill="none" stroke="#111" stroke-width="4" stroke-linejoin="round"><polygon points="310,90 700,90 460,270 70,270"/><line x1="70" y1="270" x2="610" y2="90"/><line x1="700" y1="90" x2="160" y2="270"/><polygon points="610,90 70,270 160,270 700,90"/><line x1="535" y1="90" x2="535" y2="270" stroke-dasharray="8 8"/></g><g font-family="sans-serif" font-size="23" fill="#111"><text x="292" y="75">A</text><text x="42" y="302">B</text><text x="470" y="302">C</text><text x="710" y="75">D</text><text x="595" y="75">E</text><text x="150" y="300">F</text><text x="390" y="78">AE=10</text><text x="645" y="78">ED=3</text><text x="78" y="300">BF=3</text><text x="250" y="300">FC=10</text><text x="545" y="190">h=6</text><text x="220" y="405">[EBFD] = 3 × 6 = 18 cm²</text></g></svg>