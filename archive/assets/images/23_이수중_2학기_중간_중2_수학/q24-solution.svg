<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 430" role="img" aria-labelledby="t d"><title id="t">직각삼각형의 빗변에 내린 높이와 닮음</title><desc id="d">직각삼각형 ABC에서 A의 직각, AD가 BC에 수직이고 AB가 10, BD가 8이다. 삼각형 ABD와 CBA의 닮음으로 BC는 25/2, 따라서 CD는 9/2이다.</desc><g fill="none" stroke="#111" stroke-width="4" stroke-linejoin="round"><polygon points="335,60 85,355 610,355"/><line x1="335" y1="60" x2="335" y2="355"/><polyline points="335,335 355,335 355,355"/></g><g font-family="sans-serif" font-size="24" fill="#111"><text x="325" y="45">A</text><text x="55" y="388">B</text><text x="620" y="388">C</text><text x="325" y="388">D</text><text x="150" y="205">AB=10</text><text x="170" y="345">BD=8</text><text x="405" y="345">CD=9/2</text><text x="155" y="420">△ABD ∼ △CBA → AB² = BD·BC → BC=25/2</text></g></svg>