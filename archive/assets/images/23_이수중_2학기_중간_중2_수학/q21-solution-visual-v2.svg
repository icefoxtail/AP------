<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 743 620" width="743" height="620" role="img" aria-labelledby="title desc"><title id="title">한 삼각형에 나타난 외심각과 내심각</title><desc id="desc">삼각형의 꼭짓각 A는 80도이다. B와 C에서 O로 이어지는 선이 각 x를 만들며, I로 이어지는 선이 각 y를 만든다. 외심 쪽의 두 같은 밑각을 표시했다.</desc><rect width="743" height="620" fill="white" /><polygon points="371.5000,142.4762 110.5000,453.5238 632.5000,453.5238" fill="#fff" /><polygon points="110.5000,453.5238 371.5000,331.8175 632.5000,453.5238" fill="#e3f2e9" /><polygon points="110.5000,453.5238 371.5000,407.5025 632.5000,453.5238" fill="#eee7f7" /><line x1="371.5000" y1="142.4762" x2="110.5000" y2="453.5238" stroke="#21639a" stroke-width="4.8" stroke-linecap="round" /><line x1="110.5000" y1="453.5238" x2="632.5000" y2="453.5238" stroke="#21639a" stroke-width="4.8" stroke-linecap="round" /><line x1="632.5000" y1="453.5238" x2="371.5000" y2="142.4762" stroke="#21639a" stroke-width="4.8" stroke-linecap="round" /><line x1="110.5000" y1="453.5238" x2="371.5000" y2="331.8175" stroke="#227365" stroke-width="4.75" stroke-linecap="round" /><line x1="110.5000" y1="453.5238" x2="371.5000" y2="407.5025" stroke="#774698" stroke-width="4.85" stroke-linecap="round" /><line x1="632.5000" y1="453.5238" x2="371.5000" y2="331.8175" stroke="#227365" stroke-width="4.75" stroke-linecap="round" /><line x1="632.5000" y1="453.5238" x2="371.5000" y2="407.5025" stroke="#774698" stroke-width="4.85" stroke-linecap="round" /><path d="M 336.1467 184.6086 A 55 55 0 0 0 406.8533 184.6086" stroke="#a34c1f" stroke-width="2.25" fill="none" /><text x="371.5000" y="239.4762" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#a34c1f" text-anchor="middle">80°</text><path d="M 330.1381 414.7957 A 42 42 0 0 0 412.8619 414.7957" stroke="#774698" stroke-width="2.25" fill="none" /><path d="M 329.8098 351.2580 A 46 46 0 0 0 413.1902 351.2580" stroke="#227365" stroke-width="2.25" fill="none" /><path d="M 191.5000 453.5238 A 81 81 0