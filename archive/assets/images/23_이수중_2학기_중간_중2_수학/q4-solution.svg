<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 384 320" width="384" height="320" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">두 직각삼각형을 빗변 AB와 AE가 같게 맞붙이면 B, C, E가 한 직선 위에 놓여 ∠ACB+∠ACE=180°이다((가)). AB=AE이므로 삼각형 ABE는 이등변삼각형이고 ∠B=∠E이다((나)). 따라서 두 직각삼각형은 빗변과 한 예각이 각각 같아 RHA 합동이다((다)). 답은 ⑤이다.</title><desc id="visual-desc">두 직각삼각형을 직각 꼭짓점 C에서 맞붙여 만든 이등변삼각형 ABE이며 C에 직각 표시가 두 개 있고 두 밑각에 같은 표시가, 변 AB와 EA에 같은 길이 눈금이 있다.</desc><rect width="384" height="320" fill="#fff"/><g data-layer="30"><line id="AB" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="192" y1="64.761904762" x2="49.142857143" y2="255.238095238"/></g><g data-layer="30"><line id="BC" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="49.142857143" y1="255.238095238" x2="192" y2="255.238095238"/></g><g data-layer="30"><line id="CE" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="192" y1="255.238095238" x2="334.857142857" y2="255.238095238"/></g><g data-layer="30"><line id="EA" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="334.857142857" y1="255.238095238" x2="192" y2="64.761904762"/></g><g data-layer="30"><line id="AC" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="192" y1="64.761904762" x2="192" y2="255.238095238"/></g><g data-layer="60"><polyline id="r0" data-role="indicator" stroke="#11