<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 384 320" width="384" height="320" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">무게중심 G는 세 중선 AD, BE, CF의 교점이다. E는 AC의 중점이므로 AE=CE이고, 중선 CF에서 CG:GF=2:1이므로 FG:GC=1:2이다. 세 중선은 삼각형을 넓이가 같은 6개로 나누므로 [GAB]=(1/3)[ABC], [GBD]=(1/6)[ABC]이다. 그러나 무게중심은 세 꼭짓점에서 같은 거리에 있는 점이 아니므로 AG=BG=CG는 일반적으로 성립하지 않아 옳지 않은 것은 ③이다.</title><desc id="visual-desc">삼각형 ABC의 세 변의 중점 D, E, F와 세 중선이 만나는 무게중심 G가 표시되어 있고 중점으로 나뉜 변에 같은 눈금이 있으며 선분 GF에 k, CG에 2k가 적혀 있다.</desc><rect width="384" height="320" fill="#fff"/><g data-layer="30"><line id="AF" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="49.142857143" y1="267.142857143" x2="192" y2="267.142857143"/></g><g data-layer="30"><line id="FB" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="192" y1="267.142857143" x2="334.857142857" y2="267.142857143"/></g><g data-layer="30"><line id="BD" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="334.857142857" y1="267.142857143" x2="227.714285714" y2="160"/></g><g data-layer="30"><line id="DC" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="227.714285714" y1="160" x2="120.571428571" y2="52.857142857"/></g><g data-layer="30"><line id="CE" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="120.571428571" y1="52.857142857" x2="84.857142857" y2="160