<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 470" role="img" aria-labelledby="t d"><title id="t">정사각형에서 합동과 외각으로 65도 구하기</title><desc id="d">정사각형 ABCD에서 E는 대각선 BD 위이고 각 DAE가 20도이다. 좌표는 정사각형과 20도 조건을 정확히 만족하며, 합동으로 각 DCE=20도, 외각 BEC=65도이다.</desc><g fill="none" stroke="#111" stroke-width="4" stroke-linejoin="round"><rect x="110" y="70" width="330" height="330"/><line x1="110" y1="400" x2="440" y2="70"/><line x1="110" y1="70" x2="351.941" y2="158.059"/><line x1="440" y1="400" x2="351.941" y2="158.059"/><circle cx="351.941" cy="158.059" r="5" fill="#111"/></g><g font-family="sans-serif" font-size="24" fill="#111"><text x="80" y="62">A</text><text x="80" y="432">B</text><text x="450" y="432">C</text><text x="450" y="62">D</text><text x="360" y="153">E</text><text x="180" y="108">20°</text><text x="392" y="112">45°</text><text x="342" y="220">65°</text><text x="65" y="458">△ADE ≡ △CDE (SAS) → ∠DCE=20° → ∠BEC=65°</text></g></svg>