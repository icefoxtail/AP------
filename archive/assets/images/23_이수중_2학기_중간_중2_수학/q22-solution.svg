<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 470" role="img" aria-labelledby="t d"><title id="t">정사각형에서 합동과 외각으로 65도 구하기</title><desc id="d">정사각형 ABCD의 대각선 BD 위 점 E에서 삼각형 ADE와 CDE가 SAS 합동이고, 각 DAE가 20도이므로 각 BEC는 65도이다.</desc><g fill="none" stroke="#111" stroke-width="4" stroke-linejoin="round"><rect x="110" y="70" width="360" height="330"/><line x1="110" y1="400" x2="470" y2="70"/><circle cx="310" cy="217" r="5" fill="#111"/><line x1="110" y1="70" x2="310" y2="217"/><line x1="470" y1="400" x2="310" y2="217"/></g><g font-family="sans-serif" font-size="24" fill="#111"><text x="80" y="62">A</text><text x="80" y="432">B</text><text x="480" y="432">C</text><text x="480" y="62">D</text><text x="320" y="210">E</text><text x="150" y="105">20°</text><text x="365" y="135">45°</text><text x="300" y="275">65°</text><text x="90" y="455">△ADE ≡ △CDE (SAS) → ∠DCE=20° → ∠BEC=65°</text></g></svg>