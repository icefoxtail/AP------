<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 384 320" width="384" height="320" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">세 평행선이 두 직선을 자르면 대응하는 선분의 길이의 비가 같으므로 x:(10−x)=5:7이다. 7x=5(10−x)에서 12x=50이므로 x=25/6이다. 따라서 답은 ②이다.</title><desc id="visual-desc">위에서 아래로 놓인 평행한 세 직선을 두 직선이 가로지르고 한 직선 위의 두 선분에 x와 10−x, 다른 직선 위의 두 선분에 5와 7이 적혀 있다.</desc><rect width="384" height="320" fill="#fff"/><g data-layer="30"><line id="AB" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="77.714285714" y1="45.714285714" x2="77.714285714" y2="140.952380952"/></g><g data-layer="30"><line id="BC" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="77.714285714" y1="140.952380952" x2="77.714285714" y2="274.285714286"/></g><g data-layer="30"><line id="DE" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="237.714285714" y1="45.714285714" x2="266.285714286" y2="140.952380952"/></g><g data-layer="30"><line id="EF" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="266.285714286" y1="140.952380952" x2="306.285714286" y2="274.285714286"/></g><g data-layer="40"><line id="ln1" data-role="line" stroke="#111" stroke-width="2.05" fill="none" x1="64" y1="45.714285714" x2="320" y2="45.714285714"/></g><g data-layer="40"><line id="ln2" data-role="line" stroke="#111" stroke-width="2.05" fill="none" x1="64" y1=