<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 510" role="img" aria-labelledby="t d"><title id="t">직사각형의 대각선으로 각 BDC 구하기</title><desc id="d">직사각형 ABCD에서 각 BCO가 42도이고 두 대각선 교점 O에 대해 OB=OC이므로 각 DBC=42도, 각 BDC=48도이다.</desc><g fill="none" stroke="#111" stroke-width="4" stroke-linejoin="round"><rect x="100" y="70" width="400" height="360"/><line x1="100" y1="70" x2="500" y2="430"/><line x1="100" y1="430" x2="500" y2="70"/><circle cx="300" cy="250" r="5" fill="#111"/><path d="M450 430 A50 50 0 0 1 462.8 396.6"/><path d="M500 120 A50 50 0 0 1 466.5 107.2"/></g><g font-family="sans-serif" font-size="25" fill="#111"><text x="72" y="62">A</text><text x="68" y="462">B</text><text x="510" y="462">C</text><text x="510" y="62">D</text><text x="312" y="244">O</text><text x="432" y="398">42°</text><text x="450" y="112">48°</text><text x="105" y="495">OB = OC → ∠DBC = 42° → ∠BDC = 48°</text></g></svg>