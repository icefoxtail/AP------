<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img" aria-labelledby="t d"><title id="t">직사각형의 대각선으로 각 BDC 구하기</title><desc id="d">직사각형 ABCD의 대각선 교점 O에서 OB와 OC가 같고, 각 BCO가 42도이므로 각 DBC도 42도, 따라서 각 BDC는 48도이다.</desc><g fill="none" stroke="#111" stroke-width="4" stroke-linejoin="round"><rect x="100" y="70" width="430" height="270"/><line x1="100" y1="70" x2="530" y2="340"/><line x1="100" y1="340" x2="530" y2="70"/><circle cx="315" cy="205" r="5" fill="#111"/></g><g font-family="sans-serif" font-size="25" fill="#111"><text x="75" y="62">A</text><text x="70" y="372">B</text><text x="540" y="372">C</text><text x="540" y="62">D</text><text x="327" y="198">O</text><text x="425" y="320">42°</text><text x="465" y="115">48°</text><text x="135" y="400">OB = OC → ∠DBC = 42° → ∠BDC = 48°</text></g></svg>