<svg xmlns="http://www.w3.org/2000/svg" width="480" height="476" viewBox="0 0 480 476" role="img" aria-labelledby="visual-title visual-desc" data-composite="composite-panels-v1"><title id="visual-title">정육면체의 여섯 면에 서로 다른 여섯 색을 칠하는 고정된 경우는 6!, 즉 720가지이다. 정육면체를 자기 자신으로 옮기는 회전은 24가지이므로 720 나누기 24는 30가지이다. 따라서 답은 ①이다.</title><desc id="visual-desc">정육면체의 앞면, 윗면, 옆면이 보이고, 보이지 않는 모서리는 점선으로 표시되어 있다.</desc><g id="p1-caption" data-role="caption" data-panel="1" data-font-px="21.4"><g id="p1-p1-caption-text" transform="translate(200.624 38.5064)" data-label-kind="CAPTION" data-owner="panel-1" data-fragment-sha="sha256:c8ef8db9929a8aef2e8d3e126d91d472ee1ddff5d3f164347c88fa21ee2a7cf5"><svg xmlns="http://www.w3.org/2000/svg" width="78.752" height="30.9872" viewBox="0 0 78.752 30.9872" data-outline-width="78.752" data-outline-height="30.9872" id="lb-7ce56c4e7070dbc94301066b29efe143b807818f45bc6d1862653117fcf6cc25" data-owner="panel-1" data-fact-role="GIVEN"><path d="M11.19220 13.24660L11.19220 12.60460L16.13560 12.60460L16.13560 13.24660L11.19220 13.24660ZM15.81460 18.66080L15.81460 7.36160L16.52080 7.36160L16.52080 18.66080L15.81460 18.66080ZM10.50740 19.40980L10.50740 19.40980Q12.41200 19.40980 13.77090 19.80570Q15.12980 20.20160 15.86810 20.96130Q16.60640 21.72100 16.60640 22.81240L16.60640 22.81240Q16.60640 24.41740 14.98000 25.30550Q13.35360 26.19360 10.50740 26.19360L10.50740 26.19360Q7.66120 26.19360 6.02410 25.30550Q4.38700 24.41740 4.38700 22.81240L4.38700 22.81240Q4.38700 21.72100 5.12530 20.96130Q5.86360 20.20160 7.23320 19.80570Q8.60280 19.40980 10.50740 19.40980ZM10.50740 20.03040L10.50740 20.03040Q8.88100 20.03040 7.66120 20.37280Q6.44140 20.71520 5.75660 21.33580Q5.07180 21.95640 5.07180 22.81240L5.07180 22.81240Q5.07180 23.64700 5.75660 24.26760Q6.44140 24.88820 7.66120 25.23060Q8.88100 25.57300 10.50740 25.57300L10.50740 25.57300Q12.13380 25.57300 13.34290 25.23060Q14.55200 24.88820 15.23680 24.26760Q15.92160 23.64700 15.92160 22.81240L15.92160 22.81240Q15.92160 21