<svg xmlns="http://www.w3.org/2000/svg" width="820" height="540" viewBox="0 0 820 540" role="img" aria-label="집에서 서점까지의 격자도로, 최고 높이 h=2인 예시 경로 UURRDDR과 경로 수 35">
<rect width="820" height="540" fill="white"/>
<text x="28" y="35" font-family="NanumGothic" font-size="23" fill="#111827">최고 높이 h=2인 이동 경로의 예</text>
<text x="28" y="63" font-family="NanumGothic" font-size="16" fill="#475569">파랑: 연락 전 (위·오른쪽)　 주황: 연락 후 (아래·오른쪽)</text>
<line x1="80" y1="85" x2="80" y2="445" stroke="#cbd5e1" stroke-width="2"/>
<line x1="165" y1="85" x2="165" y2="445" stroke="#cbd5e1" stroke-width="2"/>
<line x1="250" y1="85" x2="250" y2="445" stroke="#cbd5e1" stroke-width="2"/>
<line x1="335" y1="85" x2="335" y2="445" stroke="#cbd5e1" stroke-width="2"/>
<line x1="80" y1="445" x2="335" y2="445" stroke="#cbd5e1" stroke-width="2"/>
<line x1="80" y1="355" x2="335" y2="355" stroke="#cbd5e1" stroke-width="2"/>
<line x1="80" y1="265" x2="335" y2="265" stroke="#cbd5e1" stroke-width="2"/>
<line x1="80" y1="175" x2="335" y2="175" stroke="#cbd5e1" stroke-width="2"/>
<line x1="80" y1="85" x2="335" y2="85" stroke="#cbd5e1" stroke-width="2"/>
<line x1="80" y1="265" x2="335" y2="265" stroke="#64748b" stroke-width="1.5" stroke-dasharray="6 6"/>
<text x="348" y="260" font-family="NanumGothic" font-size="17" fill="#475569">h=2</text>
<polyline points="80,445 80,355 80,265 165,265 250,265" fill="none" stroke="#2563eb" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"/>
<polyline points="250,265 250,355 250,445 335,445" fill="none" stroke="#ea580c" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="80" cy="445" r="9" fill="#1d4ed8" stroke="white" stroke-width="2"/>
<circle cx="335" cy="445" r="9" fill="#0f766e" stroke="white" stroke-width="2"/>
<circle cx="335" cy="85" r="9" fill="#be123c" stroke="white" stroke-width="2"/>
<circle cx="250" cy="265" r="9" fill="#9333ea" stroke="white" stroke-width="2"/>
<text x="58" y="481" font-family="NanumGothic" font-size="18" fill="#1d4ed8">집</text>
<text x="335" y="481" font-family="NanumGothic" font-size="18" fill="#0f766e">서점</text>
<text x="350" y="92" font-family="NanumGothic" font-size="18" fill="#be123c">마카롱 가게</text>
<text x="266" y="249" font-family="NanumGothic" font-size="16" fill="#7e22ce">연락 지점 예시</text>
<rect x="450" y="125" width="340" height="290" rx="15" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<text x="472" y="164" font-family="NanumGothic" font-size="21" fill="#0f172a">이 경로: U U R R D D R</text>
<text x="472" y="205" font-family="NanumGothic" font-size="18" fill="#334155">위쪽 2회 → 아래쪽 2회</text>
<text x="472" y="238" font-family="NanumGothic" font-size="18" fill="#334155">오른쪽 3회를 5구간에 배분</text>
<text x="472" y="283" font-family="NanumGothic" font-size="23" fill="#1d4ed8">H(5,3) = C(7,3) = 35</text>
<text x="472" y="330" font-family="NanumGothic" font-size="18" fill="#334155">연락 위치만 다르면</text>
<text x="472" y="358" font-family="NanumGothic" font-size="18" fill="#334155">같은 경로를 다시 세지 않음</text>
<text x="28" y="525" font-family="NanumGothic" font-size="15" fill="#475569">원본의 집·서점·가게 위치와 3×4 격자 구조를 보존한 해설용 파생 도식</text>
</svg>