<svg xmlns="http://www.w3.org/2000/svg" width="460" height="460" viewBox="0 0 460 460" role="img" aria-label="사각뿔 전개도의 다섯 면을 빨강 두 번, 파랑 초록 노랑 한 번씩 칠한 예">
<rect width="460" height="460" fill="#FFFFFF"/>
<text x="18" y="30" font-family="NanumSquare, sans-serif" font-size="18" fill="#111827">네 색을 모두 사용하고 빨강만 두 번 쓴 예</text>
<rect x="165" y="170" width="130" height="130" fill="#bfdbfe" stroke="#1e3a8a" stroke-width="3"/>
<polygon points="165,170 230,70 295,170" fill="#fecaca" stroke="#991b1b" stroke-width="3"/>
<polygon points="295,170 395,235 295,300" fill="#bbf7d0" stroke="#166534" stroke-width="3"/>
<polygon points="295,300 230,400 165,300" fill="#fef08a" stroke="#854d0e" stroke-width="3"/>
<polygon points="165,300 65,235 165,170" fill="#fecaca" stroke="#991b1b" stroke-width="3"/>
<text x="230" y="242" font-family="NanumSquare, sans-serif" font-size="18" text-anchor="middle" fill="#1e3a8a">파랑</text>
<text x="230" y="143" font-family="NanumSquare, sans-serif" font-size="17" text-anchor="middle" fill="#991b1b">빨강</text>
<text x="329" y="240" font-family="NanumSquare, sans-serif" font-size="17" text-anchor="middle" fill="#166534">초록</text>
<text x="230" y="343" font-family="NanumSquare, sans-serif" font-size="17" text-anchor="middle" fill="#854d0e">노랑</text>
<text x="132" y="240" font-family="NanumSquare, sans-serif" font-size="17" text-anchor="middle" fill="#991b1b">빨강</text>
<text x="20" y="442" font-family="NanumSquare, sans-serif" font-size="14" fill="#475569">같은 색 두 면의 위치에 따라 회전으로 겹치는 배치를 제거한다.</text>
</svg>