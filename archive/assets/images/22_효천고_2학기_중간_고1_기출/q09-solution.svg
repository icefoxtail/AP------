<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" role="img" aria-labelledby="title desc"><title id="title">충분조건과 반례</title><desc id="desc">P와 Q는 U 안에서 서로소이며, Q는 P의 여집합 전체가 아니다.</desc><style>text{font-family:"Noto Sans KR","Malgun Gothic",Arial,sans-serif;fill:#172033}.math{font-family:Georgia,serif}</style><rect width="760" height="430" fill="#f8fafc"/><text x="28" y="38" font-size="22" font-weight="700">충분조건과 반례</text><rect x="36" y="96" width="320" height="250" rx="14" fill="#fff" stroke="#94a3b8"/><text x="52" y="120" font-size="14">U</text><circle cx="125" cy="220" r="45" fill="#bfdbfe" stroke="#2563eb" stroke-width="3"/><text x="125" y="226" text-anchor="middle" font-size="18" font-weight="700">P</text><circle cx="275" cy="220" r="45" fill="#fed7aa" stroke="#ea580c" stroke-width="3"/><text x="275" y="226" text-anchor="middle" font-size="18" font-weight="700">Q</text><text x="200" y="315" text-anchor="middle" font-size="14">P도 Q도 아닌 여백</text><rect x="390" y="96" width="334" height="250" rx="14" fill="#fff" stroke="#cbd5e1"/><text x="412" y="170" class="math" font-size="21">Q⊆Pᶜ</text><text x="412" y="215" class="math" font-size="21">P∩Q=∅</text><text x="412" y="260" class="math" font-size="21">Q≠Pᶜ</text></svg>
