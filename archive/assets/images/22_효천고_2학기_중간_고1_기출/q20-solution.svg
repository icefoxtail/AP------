<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="760" height="430" role="img" aria-labelledby="title desc"><title id="title">√3 무리수 증명</title><desc id="desc">√3=m/n 가정 · m²=3n² · m=3k · n²=3k² · 서로소와 모순</desc><style>text{font-family:"Noto Sans KR","Malgun Gothic",Arial,sans-serif;fill:#172033}.muted{fill:#56657a}.math{font-family:Georgia,"Times New Roman",serif}</style><rect width="760" height="430" fill="#f8fafc"/><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#2563eb"/></marker></defs><text x="28" y="38" font-size="22" font-weight="700">√3 무리수 증명</text><text x="28" y="67" class="muted" font-size="15">증명 단계와 모순·등호 조건을 순서대로 확인한다.</text><g class="logic-proof-step"><rect x="52" y="98" width="656" height="42" rx="10" fill="#ffffff" stroke="#cbd5e1"/><text x="70" y="125" class="step-label" font-size="16" font-weight="400">1. √3=m/n 가정</text></g><line x1="380" y1="140" x2="380" y2="146" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/><g class="logic-proof-step"><rect x="52" y="146" width="656" height="42" rx="10" fill="#ffffff" stroke="#cbd5e1"/><text x="70" y="173" class="step-label" font-size="16" font-weight="400">2. m²=3n²</text></g><line x1="380" y1="188" x2="380" y2="194" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/><g class="logic-proof-step"><rect x="52" y="194" width="656" height="42" rx="10" fill="#ffffff" stroke="#cbd5e1"/><text x="70" y="221" class="step-label" font-size="16" font-weight="400">3. m=3k</text></g><line x1="380" y1="236" x2="380" y2="242" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/><g class="logic-proof-step"><rect x="52" y="242" width="656" height="42" rx="10" fill="#ffffff" stroke="#cbd5e1"/><text x="70" y="269" class="step-label" font-size="16" font-weight="400">4. n²=3k²</text></g><line x1="380" y1="284" x2="380" y2="290" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/><g class="logic-proof-step"><rect x="52" y="290" width="656" height="42" rx="10" fill="#dcfce7" stroke="#16a34a"/><text x="70" y="317" class="step-label" font-size="16" font-weight="700">5. 서로소와 모순</text></g></svg>