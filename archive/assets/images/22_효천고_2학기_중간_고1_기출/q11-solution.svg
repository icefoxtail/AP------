<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" role="img" aria-labelledby="title desc" width="760" height="300"><title id="title">문항 11 해설: A와 B의 같음</title><desc id="desc">A만 영역과 B만 영역이 공집합이면 양방향 포함관계가 된다는 도식</desc><style>text{font-family:"Noto Sans KR",Arial,sans-serif;fill:#172033}.m{fill:#56657a}</style><rect width="760" height="300" rx="18" fill="#f8fafc"/><text x="28" y="38" font-size="22" font-weight="700">두 차집합이 모두 비어 있으면</text><rect x="28" y="76" width="430" height="150" rx="14" fill="#fff" stroke="#cbd5e1"/><ellipse cx="243" cy="151" rx="135" ry="60" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><ellipse cx="243" cy="151" rx="135" ry="60" fill="none" stroke="#16a34a" stroke-width="3" stroke-dasharray="8 6"/><text x="243" y="158" text-anchor="middle" font-size="20" font-weight="700" fill="#1d4ed8">A = B</text><text x="58" y="112" font-size="15" fill="#b91c1c">A−B=∅</text><text x="338" y="112" font-size="15" fill="#b91c1c">B−A=∅</text><rect x="490" y="88" width="238" height="126" rx="14" fill="#fff" stroke="#cbd5e1"/><text x="514" y="124" font-size="17">A−B=∅ → A⊆B</text><text x="514" y="160" font-size="17">B−A=∅ → B⊆A</text><text x="514" y="196" font-size="17" fill="#15803d">양방향 → 같은 집합</text><text x="28" y="264" class="m" font-size="14">Aᶜ∩B=B−A이므로 조건의 두 항을 각각 영역으로 읽는다.</text></svg>
