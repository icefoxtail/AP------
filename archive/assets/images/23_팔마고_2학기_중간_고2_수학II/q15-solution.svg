<svg xmlns="http://www.w3.org/2000/svg" width="640" height="430" viewBox="0 0 640 430" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc">
  <title id="title">23 팔마고 15번 평균변화율 함수와 원점 직선의 교점 해설</title>
  <desc id="desc">g(t)의 구간별 그래프와 직선 y=4t의 접점을 표시해 최소 기울기를 찾는 해설 그림</desc>
  <style>
    .background{fill:#fff}.axis{stroke:#171717;stroke-width:1.4;fill:none;stroke-linecap:round;stroke-linejoin:round}.curve{stroke:#111;stroke-width:2.1;fill:none;stroke-linecap:round;stroke-linejoin:round}.tangent{stroke:#3f4a5a;stroke-width:1.7;fill:none;stroke-linecap:round;stroke-linejoin:round}.guide{stroke:#777;stroke-width:.95;stroke-dasharray:4 4;fill:none}.point{stroke:#111;stroke-width:1;fill:#111}.target{fill:#e7eef5;stroke:#55718a;stroke-width:1.1}.panel{fill:#f7f8fa;stroke:#c7cbd1;stroke-width:1}.title{font-family:"Noto Sans KR","Pretendard","Malgun Gothic",sans-serif;font-size:15px;font-weight:700;fill:#111}.label{font-family:"Noto Sans KR","Pretendard","Malgun Gothic",sans-serif;font-size:12px;fill:#222}.small{font-family:"Noto Sans KR","Pretendard","Malgun Gothic",sans-serif;font-size:11px;fill:#333}.math{font-family:"STIX Two Math","Cambria Math","Times New Roman",serif;font-size:13px;fill:#111}
  </style>
  <defs><marker id="axis-arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L6,3 L0,6 Z" fill="#171717"/></marker></defs>
  <rect class="background" x="0" y="0" width="640" height="430"/>
  <text class="title" x="32" y="28">q15  평균변화율 g(t)와 직선 y=mt</text>
  <text class="small" x="32" y="47">원점을 지나는 직선이 g의 그래프와 만나는 최소 기울기를 찾는다.</text>
  <g aria-label="g graph">
    <rect class="panel" x="32" y="65" width="350" height="260" rx="8"/>
    <line class="axis" x1="52" y1="280" x2="365" y2="280" marker-end="url(#axis-arrow)"/>
    <line class="axis" x1="80" y1="305" x2="80" y2="90" marker-end="url(#axis-arrow)"/>
    <line class="curve" x1="85" y1="190" x2="145" y2="190"/>
    <path class="curve" d="M145 190 C178 180 208 155 240 120 C270 90 310 78 360 58"/>
    <path class="tangent" d="M80 280 L260 100"/>
    <circle class="point" cx="240" cy="120" r="3.8"/>
    <line class="guide" x1="240" y1="120" x2="240" y2="280"/>
    <text class="math" x="88" y="181">g=8</text><text class="math" x="272" y="92">g=t²−2t+9</text><text class="math" x="255" y="108">y=4t</text>
    <text class="label" x="232" y="298">t=3</text><text class="small" x="246" y="138">(3,12)</text>
    <text class="math" x="350" y="286">t</text><text class="math" x="86" y="101">g</text>
    <text class="small" x="52" y="315">0&lt;t≤1: g=8</text>
  </g>
  <g aria-label="calculation panel">
    <rect class="panel" x="400" y="65" width="208" height="260" rx="8"/>
    <text class="title" x="418" y="92">최소 기울기</text>
    <text class="math" x="418" y="123">t&gt;1: mt=t²−2t+9</text>
    <text class="math" x="418" y="150">m=t+9/t−2</text>
    <text class="math" x="418" y="177">m′=1−9/t²</text>
    <text class="small" x="418" y="204">t=3에서 최소</text>
    <text class="math" x="418" y="231">m=3+3−2=4</text>
    <line class="guide" x1="418" y1="245" x2="590" y2="245"/>
    <text class="small" x="418" y="272">0&lt;t≤1 구간은 m≥8</text>
    <text class="label" x="418" y="302">전체 최소: 4  (정답: ②)</text>
  </g>
</svg>
