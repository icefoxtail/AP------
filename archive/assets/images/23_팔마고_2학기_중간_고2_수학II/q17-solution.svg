<svg xmlns="http://www.w3.org/2000/svg" width="640" height="390" viewBox="0 0 640 390" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc">
  <title id="title">23 팔마고 17번 평행한 두 접선의 기울기 해설</title>
  <desc id="desc">두 접점의 x좌표를 근으로 보는 수직선과 도함수 값의 평행 조건으로 a+m을 계산하는 해설 그림</desc>
  <style>
    .background{fill:#fff}.axis{stroke:#171717;stroke-width:1.4;fill:none;stroke-linecap:round;stroke-linejoin:round}.guide{stroke:#777;stroke-width:.95;stroke-dasharray:4 4;fill:none}.point{stroke:#111;stroke-width:1;fill:#111}.target{fill:#e7eef5;stroke:#55718a;stroke-width:1.1}.panel{fill:#f7f8fa;stroke:#c7cbd1;stroke-width:1}.title{font-family:"Noto Sans KR","Pretendard","Malgun Gothic",sans-serif;font-size:15px;font-weight:700;fill:#111}.label{font-family:"Noto Sans KR","Pretendard","Malgun Gothic",sans-serif;font-size:12px;fill:#222}.small{font-family:"Noto Sans KR","Pretendard","Malgun Gothic",sans-serif;font-size:11px;fill:#333}.math{font-family:"STIX Two Math","Cambria Math","Times New Roman",serif;font-size:13px;fill:#111}
  </style>
  <defs><marker id="axis-arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L6,3 L0,6 Z" fill="#171717"/></marker></defs>
  <rect class="background" x="0" y="0" width="640" height="390"/>
  <text class="title" x="32" y="28">q17  평행한 두 접선의 공통 기울기</text>
  <text class="small" x="32" y="47">두 접점의 x좌표를 α, β로 두면 근과 계수 관계가 계산을 단순하게 만든다.</text>
  <g aria-label="contact number line">
    <rect class="panel" x="32" y="65" width="250" height="250" rx="8"/>
    <line class="axis" x1="55" y1="190" x2="255" y2="190" marker-end="url(#axis-arrow)"/>
    <circle class="point" cx="80" cy="190" r="4"/><circle class="point" cx="230" cy="190" r="4"/>
    <line class="guide" x1="80" y1="145" x2="80" y2="235"/><line class="guide" x1="230" y1="145" x2="230" y2="235"/>
    <text class="label" x="66" y="135">β</text><text class="label" x="220" y="135">α</text>
    <text class="math" x="62" y="220">α+β=−10</text><text class="math" x="62" y="247">αβ=2</text>
    <text class="math" x="62" y="274">α²=−10α−2</text>
  </g>
  <g aria-label="slope calculation panel">
    <rect class="panel" x="300" y="65" width="308" height="250" rx="8"/>
    <text class="title" x="318" y="92">도함수 값 비교</text>
    <text class="math" x="318" y="124">y′=3x²+2ax−1</text>
    <text class="small" x="318" y="151">평행 조건 y′(α)=y′(β)</text>
    <text class="math" x="318" y="178">3(α+β)+2a=0 ⇒ a=15</text>
    <line class="guide" x1="318" y1="192" x2="590" y2="192"/>
    <text class="math" x="318" y="222">m=3α²+30α−1=−7</text>
    <text class="small" x="318" y="250">두 접선은 같은 기울기 m을 가진다.</text>
    <text class="label" x="318" y="283">a+m=15−7=8  (정답: ⑤)</text>
  </g>
  <g aria-label="key point">
    <rect class="target" x="32" y="335" width="576" height="30" rx="6"/>
    <text class="small" x="50" y="355">x좌표의 합과 곱을 먼저 이용하면 α나 β를 근호로 직접 구하지 않아도 공통 접선 기울기를 얻을 수 있다.</text>
  </g>
</svg>
