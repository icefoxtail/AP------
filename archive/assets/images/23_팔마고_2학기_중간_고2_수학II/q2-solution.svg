<svg xmlns="http://www.w3.org/2000/svg" width="640" height="430" viewBox="0 0 640 430" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc">
  <title id="title">23 팔마고 2번 합성된 좌우극한 해설</title>
  <desc id="desc">f 그래프의 열린 점과 닫힌 점, x+1과 −x의 접근 방향을 분리해 두 극한을 읽는 해설 그림</desc>
  <style>
    .background{fill:#fff}.axis{stroke:#171717;stroke-width:1.4;fill:none;stroke-linecap:round;stroke-linejoin:round}.curve{stroke:#111;stroke-width:2.1;fill:none;stroke-linecap:round;stroke-linejoin:round}.guide{stroke:#777;stroke-width:.95;stroke-dasharray:4 4;fill:none}.point-open{stroke:#111;stroke-width:1.4;fill:#fff}.point-closed{stroke:#111;stroke-width:1;fill:#111}.panel{fill:#f7f8fa;stroke:#c7cbd1;stroke-width:1}.title{font-family:"Noto Sans KR","Pretendard","Malgun Gothic",sans-serif;font-size:15px;font-weight:700;fill:#111}.label{font-family:"Noto Sans KR","Pretendard","Malgun Gothic",sans-serif;font-size:12px;fill:#222}.small{font-family:"Noto Sans KR","Pretendard","Malgun Gothic",sans-serif;font-size:11px;fill:#333}.math{font-family:"STIX Two Math","Cambria Math","Times New Roman",serif;font-size:13px;fill:#111}.tick{font-family:"STIX Two Math","Cambria Math","Times New Roman",serif;font-size:11.5px;fill:#222}
  </style>
  <defs><marker id="axis-arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L6,3 L0,6 Z" fill="#171717"/></marker></defs>
  <rect class="background" x="0" y="0" width="640" height="430"/>
  <text class="title" x="32" y="28">q2  합성함수의 접근 방향</text>
  <text class="small" x="32" y="47">안쪽 입력이 어느 점으로 어느 쪽에서 가는지 먼저 바꿔 적는다.</text>
  <g aria-label="source graph">
    <rect class="panel" x="32" y="65" width="330" height="255" rx="8"/>
    <line class="axis" x1="52" y1="245" x2="340" y2="245" marker-end="url(#axis-arrow)"/>
    <line class="axis" x1="190" y1="300" x2="190" y2="82" marker-end="url(#axis-arrow)"/>
    <path class="curve" d="M55 275 L130 190"/>
    <path class="curve" d="M130 110 L190 190"/>
    <path class="curve" d="M190 150 L280 205 L340 245"/>
    <circle class="point-open" cx="130" cy="190" r="4.6" fill="#fff"/>
    <circle class="point-closed" cx="130" cy="110" r="4" fill="#111"/>
    <circle class="point-open" cx="190" cy="190" r="4.6" fill="#fff"/>
    <circle class="point-closed" cx="190" cy="150" r="4" fill="#111"/>
    <line class="guide" x1="130" y1="100" x2="130" y2="245"/><line class="guide" x1="190" y1="100" x2="190" y2="245"/>
    <text class="tick" x="124" y="263">−1</text><text class="tick" x="184" y="263">0</text>
    <text class="tick" x="125" y="116">3</text><text class="tick" x="184" y="156">2</text>
    <text class="label" x="242" y="118">f(x)</text>
    <text class="small" x="55" y="300">lim u→−1− f(u)=1</text>
    <text class="small" x="198" y="300">lim t→0+ f(t)=2</text>
  </g>
  <g aria-label="calculation panel">
    <rect class="panel" x="380" y="65" width="228" height="255" rx="8"/>
    <text class="title" x="398" y="92">두 항 계산</text>
    <text class="math" x="398" y="126">x→−1+ ⇒ x+1→0+</text>
    <text class="math" x="398" y="153">f(x+1)→2</text>
    <line class="guide" x1="398" y1="168" x2="590" y2="168"/>
    <text class="math" x="398" y="202">x→1+ ⇒ −x→−1−</text>
    <text class="math" x="398" y="229">f(−x)→1</text>
    <line class="guide" x1="398" y1="244" x2="590" y2="244"/>
    <text class="label" x="398" y="277">합 = 2+1 = 3</text>
    <text class="small" x="398" y="301">정답: ②</text>
  </g>
  <g aria-label="warning panel">
    <rect class="panel" x="32" y="340" width="576" height="55" rx="8"/>
    <text class="small" x="50" y="363">닫힌 점 f(−1)=3, f(0)=2를 무조건 대입하지 말고, 극한의 방향에 맞는 열린 점을 읽는다.</text>
    <text class="small" x="50" y="383">첫 항은 0+에서, 둘째 항은 −1−에서 접근한다.</text>
  </g>
</svg>
