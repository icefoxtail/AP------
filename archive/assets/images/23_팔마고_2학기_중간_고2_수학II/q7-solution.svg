<svg xmlns="http://www.w3.org/2000/svg" width="640" height="450" viewBox="0 0 640 450" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc">
  <title id="title">23 팔마고 7번 절댓값 함수의 연속 해설</title>
  <desc id="desc">그래프의 열린 점과 닫힌 점을 절댓값으로 바꾸어 정수 a별 연속 여부를 비교하는 해설 그림</desc>
  <style>
    .background{fill:#fff}.axis{stroke:#171717;stroke-width:1.4;fill:none;stroke-linecap:round;stroke-linejoin:round}.curve{stroke:#111;stroke-width:2.1;fill:none;stroke-linecap:round;stroke-linejoin:round}.guide{stroke:#777;stroke-width:.95;stroke-dasharray:4 4;fill:none}.point-open{stroke:#111;stroke-width:1.4;fill:#fff}.point-closed{stroke:#111;stroke-width:1;fill:#111}.panel{fill:#f7f8fa;stroke:#c7cbd1;stroke-width:1}.target{fill:#e7eef5;stroke:#55718a;stroke-width:1.1}.title{font-family:"Noto Sans KR","Pretendard","Malgun Gothic",sans-serif;font-size:15px;font-weight:700;fill:#111}.label{font-family:"Noto Sans KR","Pretendard","Malgun Gothic",sans-serif;font-size:12px;fill:#222}.small{font-family:"Noto Sans KR","Pretendard","Malgun Gothic",sans-serif;font-size:11px;fill:#333}.math{font-family:"STIX Two Math","Cambria Math","Times New Roman",serif;font-size:13px;fill:#111}
  </style>
  <defs><marker id="axis-arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L6,3 L0,6 Z" fill="#171717"/></marker></defs>
  <rect class="background" x="0" y="0" width="640" height="450"/>
  <text class="title" x="32" y="28">q7  |f(x)|의 연속성 판정</text>
  <text class="small" x="32" y="47">좌우 극한과 함숫값의 절댓값이 모두 같아지는지 정수별로 확인한다.</text>
  <g aria-label="source graph">
    <rect class="panel" x="32" y="65" width="350" height="250" rx="8"/>
    <line class="axis" x1="50" y1="205" x2="365" y2="205" marker-end="url(#axis-arrow)"/>
    <line class="axis" x1="80" y1="295" x2="80" y2="82" marker-end="url(#axis-arrow)"/>
    <path class="curve" d="M55 230 L80 150 L130 260 L180 205 L230 260 L280 105"/>
    <path class="curve" d="M280 260 L330 205 L360 125"/>
    <circle class="point-open" cx="80" cy="150" r="4.5" fill="#fff"/><circle class="point-closed" cx="80" cy="205" r="4" fill="#111"/>
    <circle class="point-closed" cx="130" cy="260" r="4" fill="#111"/><circle class="point-open" cx="130" cy="150" r="4.5" fill="#fff"/>
    <circle class="point-open" cx="230" cy="260" r="4.5" fill="#fff"/><circle class="point-closed" cx="230" cy="150" r="4" fill="#111"/>
    <circle class="point-open" cx="280" cy="260" r="4.5" fill="#fff"/><circle class="point-open" cx="280" cy="105" r="4.5" fill="#fff"/><circle class="point-closed" cx="280" cy="150" r="4" fill="#111"/>
    <line class="guide" x1="80" y1="150" x2="80" y2="205"/><line class="guide" x1="130" y1="150" x2="130" y2="260"/><line class="guide" x1="230" y1="150" x2="230" y2="260"/><line class="guide" x1="280" y1="105" x2="280" y2="260"/>
    <text class="label" x="75" y="225">0</text><text class="label" x="125" y="263">1</text><text class="label" x="175" y="225">2</text><text class="label" x="225" y="263">3</text><text class="label" x="275" y="263">4</text><text class="label" x="325" y="225">5</text>
    <text class="small" x="50" y="294">x=0: value 0, approach ±1</text><text class="small" x="190" y="294">x=4: left |f|=2, right/value |f|=1</text>
  </g>
  <g aria-label="decision table">
    <rect class="panel" x="400" y="65" width="208" height="250" rx="8"/>
    <text class="title" x="418" y="92">정수별 판정</text>
    <text class="small" x="418" y="123">a=0  불연속</text><text class="small" x="418" y="149">a=1  연속</text><text class="small" x="418" y="175">a=2  연속</text>
    <text class="small" x="418" y="201">a=3  연속</text><text class="small" x="418" y="227">a=4  불연속</text><text class="small" x="418" y="253">a=5  연속</text>
    <line class="guide" x1="418" y1="267" x2="590" y2="267"/>
    <text class="label" x="418" y="294">가능: 1,2,3,5</text><text class="label" x="418" y="312">합 = 11  (정답: ④)</text>
  </g>
  <g aria-label="absolute value note">
    <rect class="target" x="32" y="335" width="576" height="62" rx="8"/>
    <text class="math" x="50" y="362">|f| 연속 ⇔ |좌극한|=|우극한|=|f(a)|</text>
    <text class="small" x="50" y="385">부호가 바뀌어도 절댓값 뒤에 같은 크기가 되면 연속이 될 수 있다.</text>
  </g>
</svg>
