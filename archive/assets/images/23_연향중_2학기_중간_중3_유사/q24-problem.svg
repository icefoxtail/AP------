<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 560" width="720" height="560" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">반지름이 6 cm인 원기둥을 실로 감아 점 P에서 팽팽하게 들어 올린 장면을 단면으로 나타낸 그림이다. 점 P와 원기둥 사이의 최단 거리는 6 cm로 주어져 있다.</title><desc id="visual-desc">원 위의 두 접점에서 점 P로 이어지는 두 접선과 원의 아래쪽을 감싸는 굵은 호가 그려져 있다. 원의 반지름과 점 P에서 원까지의 최단 거리가 각각 6 cm로 적혀 있고, 반지름과 접선이 만나는 곳에 직각 표시가 있다.</desc><rect width="720" height="560" fill="#fff"/><g data-layer="30"><line id="sOA" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="360" y1="356.746242263" x2="478.686063295" y2="288.222811671"/></g><g data-layer="30"><line id="sOB" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="360" y1="356.746242263" x2="241.313936705" y2="288.222811671"/></g><g data-layer="30"><line id="sPA" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="360" y1="82.652519894" x2="478.686063295" y2="288.222811671"/></g><g data-layer="30"><line id="sPB" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="360" y1="82.652519894" x2="241.313936705" y2="288.222811671"/></g><g data-layer="30"><line id="sPT" data-role="line" stroke="#111" stroke-width="1.6" fill="none" stroke-dasharray="6 4" x1="360" y1="82.652519894" x2="360" y2="219.699381079"/></g><g data-layer="40"><circle id="circ" data-role="circle" stroke="#111" stroke-width="