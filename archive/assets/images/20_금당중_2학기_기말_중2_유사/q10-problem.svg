<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 340" width="420" height="340" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">두 직각삼각형이 길이가 x인 한 변을 공유하고 있다. 왼쪽 삼각형의 빗변과 한 직각변, 오른쪽 삼각형의 빗변과 다른 직각변의 길이가 주어져 있다.</title><desc id="visual-desc">왼쪽 직각삼각형은 빗변 10 cm, 한 직각변 6 cm, 공유하는 직각변 x를 갖는다. 오른쪽 직각삼각형은 빗변 17 cm와 다른 직각변 y를 가지며, 두 삼각형의 직각이 표시되어 있다.</desc><rect width="420" height="340" fill="#fff"/><g data-layer="30"><line id="sLT" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="51.071428571" y1="230.544217687" x2="141.887755102" y2="109.455782313"/></g><g data-layer="30"><line id="sLP" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="51.071428571" y1="230.544217687" x2="141.887755102" y2="230.544217687"/></g><g data-layer="30"><line id="sPT" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="141.887755102" y1="230.544217687" x2="141.887755102" y2="109.455782313"/></g><g data-layer="30"><line id="sTR" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="141.887755102" y1="109.455782313" x2="368.928571429" y2="109.455782313"/></g><g data-layer="30"><line id="sRP" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="368.928571429" y1="109.455782313" x2="141.887755102" y2="230.544217687"/></g><g data-layer="60"><polyline id="r0" data-role="indicator" stroke="#111" s