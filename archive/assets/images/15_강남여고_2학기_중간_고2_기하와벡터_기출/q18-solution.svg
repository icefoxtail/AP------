<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" role="img" aria-labelledby="t d"><title id="t">두 원판의 공통부분과 중심선</title><desc id="d">중심 A(2,0), B(0,2), 반지름 2인 두 원과 중심을 지나는 직선 x+y=2</desc><style>text{font-family:'Malgun Gothic','Noto Sans KR',sans-serif;fill:#111827}</style><rect width="520" height="300" fill="#fff"/><g stroke="#dbe4ee" stroke-width="1"><path d="M65 40H310M65 75H310M65 110H310M65 145H310M65 180H310M65 215H310M65 250H310M65 40V250M100 40V250M135 40V250M170 40V250M205 40V250M240 40V250M275 40V250M310 40V250"/></g><path d="M40 180H330M170 30V270" stroke="#64748b" stroke-width="1.2"/><circle cx="240" cy="180" r="70" fill="#60a5fa" fill-opacity=".22" stroke="#2563eb" stroke-width="2.5"/><circle cx="170" cy="110" r="70" fill="#f97316" fill-opacity=".22" stroke="#ea580c" stroke-width="2.5"/><path d="M100 40L300 240" stroke="#111827" stroke-width="2" stroke-dasharray="7 5"/><circle cx="240" cy="180" r="4" fill="#1d4ed8"/><circle cx="170" cy="110" r="4" fill="#c2410c"/><text x="248" y="199" font-size="13">A(2,0)</text><text x="117" y="102" font-size="13">B(0,2)</text><text x="257" y="232" font-size="13">x+y=2</text><text x="350" y="88" font-size="14">r=2</text><text x="350" y="114" font-size="14">공통부분</text><text x="350" y="140" font-size="14">넓이 = 2π−4</text><text x="350" y="166" font-size="14">중심선이 넓이를 이등분</text></svg>