<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" width="720" height="320" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">폭이 50인 철판의 양쪽을 같은 길이 x만큼 접어 올려 만든 물받이의 단면을 나타낸 것이다. 가운데 색칠한 직사각형의 넓이는 300이다.</title><desc id="visual-desc">가로로 긴 직사각형의 양쪽에 세로 접힘선이 있고, 가운데 부분이 색칠되어 있다. 아래쪽에 길이 50, 왼쪽에 높이 x가 표시되어 있으며, 색칠한 부분에 300이 적혀 있다.</desc><rect width="720" height="320" fill="#fff"/><g data-layer="10"><path id="rg" data-role="region" stroke="none" stroke-width="1.6" fill="#c7ccd5" data-owner-points="E F G H" data-mark="region" data-mark-id="rg" fill-rule="evenodd" d="M137.428571429 195.142857143 L582.571428571 195.142857143 L582.571428571 124.857142857 L137.428571429 124.857142857 L137.428571429 195.142857143 Z"/></g><g data-layer="30"><line id="sAB" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="67.142857143" y1="124.857142857" x2="67.142857143" y2="195.142857143"/></g><g data-layer="30"><line id="sBC" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="67.142857143" y1="195.142857143" x2="652.857142857" y2="195.142857143"/></g><g data-layer="30"><line id="sCD" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="652.857142857" y1="195.142857143" x2="652.857142857" y2="124.857142857"/></g><g data-layer="30"><line id="sDA" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="6