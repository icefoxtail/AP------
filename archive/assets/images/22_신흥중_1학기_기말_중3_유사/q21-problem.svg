<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" width="720" height="320" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">한 변의 길이가 x인 정사각형 타일 1개, 넓이가 x인 직사각형 타일 6개, 한 변의 길이가 1인 정사각형 타일 8개를 나란히 늘어놓은 그림이다.</title><desc id="visual-desc">왼쪽에 한 변의 길이가 x인 큰 정사각형 타일이 하나 있고, 그 오른쪽에 세로의 길이가 x이고 가로의 길이가 1인 직사각형 타일 여섯 개가 일정한 간격으로 늘어서 있다. 오른쪽에는 한 변의 길이가 1인 작은 정사각형 여덟 개가 가로 네 개, 세로 두 줄로 붙어 있다.</desc><rect width="720" height="320" fill="#fff"/><g data-layer="30"><line id="sQ1" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="67.142857143" y1="221.654135338" x2="190.45112782" y2="221.654135338"/></g><g data-layer="30"><line id="sQ2" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="190.45112782" y1="221.654135338" x2="190.45112782" y2="98.345864662"/></g><g data-layer="30"><line id="sQ3" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="190.45112782" y1="98.345864662" x2="67.142857143" y2="98.345864662"/></g><g data-layer="30"><line id="sQ4" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="67.142857143" y1="98.345864662" x2="67.142857143" y2="221.654135338"/></g><g data-layer="30"><line id="sX0a" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="221.278195489" y1="221.654135338" x2="252.105263158" y2="221.654135338"/></g><g data-layer="30"><line id="sX0b" dat