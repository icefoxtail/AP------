<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 420" width="480" height="420" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">각 B가 직각인 직각삼각형 ABC의 외심 O와 내심 I, 그리고 외접원과 내접원이 그려져 있다.</title><desc id="visual-desc">직각삼각형 ABC의 빗변 AC의 중점 O는 외접원의 중심이고, 삼각형 내부에 중심이 I인 내접원이 있다. 내접원은 변 AB, BC, CA와 각각 점 D, E, F에서 접하며 점 I에서 세 접점으로 선분이 그어져 있고 선분 ID의 길이는 4cm이다.</desc><rect width="480" height="420" fill="#fff"/><g data-layer="30"><line id="BD" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="98.355437666" y1="269.018567639" x2="98.355437666" y2="221.803713528"/></g><g data-layer="30"><line id="DA" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="98.355437666" y1="221.803713528" x2="98.355437666" y2="150.981432361"/></g><g data-layer="30"><line id="AF" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="98.355437666" y1="150.981432361" x2="163.729851051" y2="178.220771271"/></g><g data-layer="30"><line id="FC" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="163.729851051" y1="178.220771271" x2="381.644562334" y2="269.018567639"/></g><g data-layer="30"><line id="EC" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="145.570291777" y1="269.018567639" x2="381.644562334" y2="269.018567639"/></g><g data-layer="30"><line id="BE" data-role="line" stroke="#111" stroke-width