<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 707 621" width="707" height="621" role="img" aria-labelledby="title desc"><title id="title">같은 기울기로 올라가는 두 직선</title><desc id="desc">파란 직선 y=4x+1은 (1,5)를 지난다. 주황 점선 y=4x는 같은 기울기로 그 바로 아래에 놓인다.</desc><rect width="707" height="621" fill="white" /><line x1="96.0000" y1="389.2582" x2="590.0000" y2="389.2582" stroke="#586574" stroke-width="2.05" stroke-linecap="round" /><polygon points="603.0000,389.2582 590.0000,384.0582 590.0000,394.4582" fill="#586574" /><line x1="328.0169" y1="558.0000" x2="328.0169" y2="122.0000" stroke="#586574" stroke-width="2.05" stroke-linecap="round" /><polygon points="328.0169,109.0000 322.8169,122.0000 333.2169,122.0000" fill="#586574" /><line x1="189.5802" y1="549.0200" x2="505.1232" y2="117.9800" stroke="#21639a" stroke-width="7.35" stroke-linecap="round" /><line x1="211.0632" y1="549.0200" x2="526.6063" y2="117.9800" stroke="#a34c1f" stroke-width="6.95" stroke-linecap="round" stroke-dasharray="12 7" /><circle cx="413.9491525423729" cy="242.5261437908497" r="7.3" fill="#21639a" stroke="white" stroke-width="2" /><circle cx="328.01694915254234" cy="359.9117647058824" r="6.3" fill="#21639a" stroke="white" stroke-width="2" /><line x1="323.0169" y1="359.9118" x2="333.0169" y2="359.9118" stroke="#586574" stroke-width="1.6" stroke-linecap="round" /><line x1="60.0000" y1="39.0000" x2="105.0000" y2="39.0000" stroke="#21639a" stroke-width="5.65" stroke-linecap="round" /><text x="116.0000" y="46.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#21639a" text-anchor="start">y = 4x + 1</text><line x1="370.0000" y1="39.0000" x2="415.0000" y2="39.0000" stroke="#a34c1f" stroke-width="5.65" stroke-linecap="round" stroke-dasharray="12 7" /><text x="426.0000" y="46.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#a34c1f" text-anchor="start">y = 4x</text><text x="619.000" y="376.258" fill="#586574" font-size="