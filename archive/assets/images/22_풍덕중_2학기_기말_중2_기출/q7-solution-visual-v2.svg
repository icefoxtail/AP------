<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 736 657" width="736" height="657" role="img" aria-labelledby="title desc"><title id="title">서로 다른 두 내리막 직선의 교차</title><desc id="desc">문제의 그래프를 주황 점선으로, x+2y+1=0을 파란 실선으로 그렸다. 두 직선은 가로축의 −1에서 만나고 세로축에는 서로 다른 높이에 닿는다.</desc><rect width="736" height="657" fill="white" /><line x1="92.0000" y1="337.8393" x2="622.0000" y2="337.8393" stroke="#586574" stroke-width="2.05" stroke-linecap="round" /><polygon points="635.0000,337.8393 622.0000,332.6393 622.0000,343.0393" fill="#586574" /><line x1="382.3168" y1="589.0000" x2="382.3168" y2="117.0000" stroke="#586574" stroke-width="2.05" stroke-linecap="round" /><polygon points="382.3168,104.0000 377.1168,117.0000 387.5168,117.0000" fill="#586574" /><line x1="105.5750" y1="218.1049" x2="621.4250" y2="495.1034" stroke="#21639a" stroke-width="7.35" stroke-linecap="round" /><line x1="121.6553" y1="115.6400" x2="551.5823" y2="577.3600" stroke="#a34c1f" stroke-width="7.1" stroke-linecap="round" stroke-dasharray="12 6" /><circle cx="328.5544554455446" cy="337.83928571428567" r="7.35" fill="#227365" stroke="white" stroke-width="2" /><circle cx="382.3168316831683" cy="366.7083333333333" r="7.35" fill="#21639a" stroke="white" stroke-width="2" /><circle cx="382.3168316831683" cy="395.57738095238096" r="7.35" fill="#a34c1f" stroke="white" stroke-width="2" /><line x1="50.0000" y1="39.0000" x2="95.0000" y2="39.0000" stroke="#21639a" stroke-width="5.65" stroke-linecap="round" /><text x="106.0000" y="46.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#21639a" text-anchor="start">x + 2y + 1 = 0</text><line x1="368.0000" y1="39.0000" x2="413.0000" y2="39.0000" stroke="#a34c1f" stroke-width="5.65" stroke-linecap="round" stroke-dasharray="12 6" /><text x="424.0000" y="46.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#a34c1f" text-anchor="start">제시된 직선</text><text x="651.000" y="324.839" fill="#586574" font-size="31" font-weight="600" font-family="Malgun Gothic, Cambria Math, sans-serif" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="4.0" stroke-linejoin="round">x</text><text x="401.317" y="99.000" fill="#586574" font-size="31" font-weight="600" font-family="Malgun Gothic, Cambria Math, sans-serif" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="4.0" stroke-linejoin="round">y</text><text x="353.317" y="314.839" fill="#586574" font-size="31" font-weight="600" font-family="Malgun Gothic, Cambria Math, sans-serif" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="4.0" stroke-linejoin="round">O</text><text x="301.554" y="379.839" fill="#227365" font-size="31" font-weight="600" font-family="Malgun Gothic, Cambria Math, sans-serif" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="4.0" stroke-linejoin="round">(−1, 0)</text><text x="465.317" y="299.708" fill="#21639a" font-size="31" font-weight="600" font-family="Malgun Gothic, Cambria Math, sans-serif" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="4.0" stroke-linejoin="round">(0, −1/2)</text><text x="506.317" y="382.577" fill="#a34c1f" font-size="31" font-weight="600" font-family="Malgun Gothic, Cambria Math, sans-serif" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="4.0" stroke-linejoin="round">(0, −1)</text></svg>
