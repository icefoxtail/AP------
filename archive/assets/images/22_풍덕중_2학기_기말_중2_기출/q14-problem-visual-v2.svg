mily="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#21639a" text-anchor="middle">A</text><circle cx="598" cy="71" r="7.4" fill="#a34c1f" stroke="white" stroke-width="1.6" /><text x="621.0000" y="62.0000" font-size="34" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#a34c1f" text-anchor="middle">B</text><circle cx="432" cy="403" r="7.4" fill="#227365" stroke="white" stroke-width="1.6" /><text x="458.0000" y="433.0000" font-size="34" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#227365" text-anchor="middle">P</text></svg>
