text.ap-pub-label.ap-pub-numeric,text.ap-pub-label[data-label-kind="angle"],text.ap-pub-label[data-label-kind="angle-arc"],text.ap-pub-label[data-label-kind="length"]{font-size:19.5px!important;stroke-width:3.5px!important}
