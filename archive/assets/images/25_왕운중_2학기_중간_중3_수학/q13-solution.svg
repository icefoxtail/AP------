<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 730" role="img" aria-labelledby="title desc">
  <title id="title">현의 수직이등분선으로 반지름 구하기</title>
  <desc id="desc">중심에서 현에 내린 수선이 현을 이등분하므로 AH는 12이다. 직각삼각형 OHA에서 OA는 13이다.</desc>
  <style>
    .ko{font-family:"Noto Sans KR","Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;fill:#16324f}
    .math{font-family:"STIX Two Math","Cambria Math","Times New Roman",serif;fill:#16324f}
    .title{font-size:24px;font-weight:700}.body{font-size:20px}.small{font-size:17px;fill:#52677f}.result{font-size:25px;font-weight:700}
  </style>
  <rect width="560" height="730" rx="18" fill="#f5f8fc"/>
  <text id="title" x="28" y="42" class="ko title">원의 중심에서 현까지 내린 수선</text>
  <rect x="28" y="68" width="504" height="336" rx="14" fill="#fff" stroke="#d9e2ed"/>
  <circle cx="280" cy="224" r="104" fill="#eef5ff" stroke="#246bce" stroke-width="3"/>
  <line x1="184" y1="264" x2="376" y2="264" stroke="#16324f" stroke-width="3"/>
  <line x1="280" y1="224" x2="184" y2="264" stroke="#d97919" stroke-width="3"/>
  <line x1="280" y1="224" x2="376" y2="264" stroke="#8798aa" stroke-width="2"/>
  <line x1="280" y1="224" x2="280" y2="264" stroke="#246bce" stroke-width="3"/>
  <path d="M280 252 h-12 v12" fill="none" stroke="#16324f" stroke-width="2"/>
  <circle cx="280" cy="224" r="4" fill="#16324f"/>
  <g class="math body">
    <text x="163" y="282">A</text><text x="382" y="282">B</text><text x="271" y="217">O</text><text x="272" y="291">H</text>
    <text x="220" y="258" fill="#d97919">x</text><text x="291" y="250" fill="#246bce">5</text><text x="232" y="289">12</text>
  </g>
  <text x="280" y="350" text-anchor="middle" class="math small">AB=24,  AH=HB</text>
  <rect x="28" y="426" width="504" height="276" rx="14" fill="#fff" stroke="#d9e2ed"/>
  <text x="56" y="470" class="ko small">현의 수직이등분선</text>
  <text x="56" y="520" class="math body">AH = AB ÷ 2 = 12</text>
  <text x="56" y="566" class="math body">x² = OH² + AH²</text>
  <text x="56" y="602" class="math body">= 5² + 12² = 169</text>
  <rect x="54" y="626" width="452" height="54" rx="12" fill="#e7f5f2" stroke="#8fc9bd"/>
  <text x="280" y="662" text-anchor="middle" class="ko result">x = 13</text>
</svg>
