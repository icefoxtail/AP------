<svg xmlns="http://www.w3.org/2000/svg" width="440" height="300" viewBox="0 0 440 300" role="img" aria-labelledby="title desc">
  <title id="title">직각삼각형 ABC</title>
  <desc id="desc">C에서 직각이고 AC는 3cm, BC는 4cm인 삼각형</desc>
  <rect width="440" height="300" fill="#fff"/>
  <path d="M70 250 L340 250 L340 55 Z" fill="none" stroke="#111" stroke-width="3"/>
  <path d="M320 250 L320 230 L340 230" fill="none" stroke="#111" stroke-width="2"/>
  <text x="50" y="270" font-size="24" font-family="sans-serif">A</text>
  <text x="345" y="52" font-size="24" font-family="sans-serif">B</text>
  <text x="345" y="275" font-size="24" font-family="sans-serif">C</text>
  <text x="185" y="282" font-size="21" font-family="sans-serif">3 cm</text>
  <text x="350" y="160" font-size="21" font-family="sans-serif">4 cm</text>
</svg>
