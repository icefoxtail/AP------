<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 690 470" width="690" height="470" role="img" aria-labelledby="title desc"><title id="title">한 점에서 원으로 그은 두 접선</title><desc id="desc">원 바깥의 P에서 위쪽 A, 아래쪽 B로 이어지는 두 접선이 원에 닿는다. 원의 중심은 O이며 OA 길이는 8 cm, PB 길이는 15 cm, PO 길이는 x이다.</desc><rect width="690" height="470" fill="white" /><circle cx="433.59375" cy="235.0" r="157.5" fill="none" stroke="#205d9c" stroke-width="3.6" /><line x1="98.9062" y1="235.0000" x2="381.7114" y2="84.1706" stroke="#aa5411" stroke-width="4" stroke-linecap="round" /><line x1="433.5938" y1="235.0000" x2="359.4761" y2="96.0294" stroke="#205d9c" stroke-width="3.6" stroke-linecap="round" /><line x1="98.9062" y1="235.0000" x2="381.7114" y2="385.8294" stroke="#aa5411" stroke-width="4" stroke-linecap="round" /><line x1="433.5938" y1="235.0000" x2="359.4761" y2="373.9706" stroke="#205d9c" stroke-width="3.6" stroke-linecap="round" /><line x1="98.9062" y1="235.0000" x2="433.5938" y2="235.0000" stroke="#586574" stroke-width="2" stroke-linecap="round" stroke-dasharray="7 5" /><text x="229.2500" y="225.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">x cm</text><line x1="84.3180" y1="262.3529" x2="344.8879" y2="401.3235" stroke="#aa5411" stroke-width="1.7" stroke-linecap="round" /><line x1="86.9062" y1="257.5000" x2="81.7298" y2="267.2059" stroke="#aa5411" stroke-width="1.7" stroke-linecap="round" /><line x1="347.4761" y1="396.4706" x2="342.2996" y2="406.1765" stroke="#aa5411" stroke-width="1.7" stroke-linecap="round" /><text x="198.1324" y="370.7206" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#aa5411" text-anchor="middle">15 cm</text><text x="442.5349" y="166.5147" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#205d9c" text-anchor="middle">8 cm</text><circle cx="98.90625" cy="235.0" r="4.9" fill="#28364b" /><text x="81.9062" y="243.0