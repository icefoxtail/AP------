<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 690 470" width="690" height="470" role="img" aria-labelledby="title desc"><title id="title">80도 접선과 두 반지름이 만나는 원</title><desc id="desc">원 바깥의 P에서 그은 두 접선이 A와 B에서 원에 닿고 P의 각은 80도이다. 두 접점을 이은 현 AB 및 A와 O를 이은 파란 반지름이 있다.</desc><rect width="690" height="470" fill="white" /><circle cx="388.7632513652575" cy="235.0" r="157.5" fill="none" stroke="#205d9c" stroke-width="3.6" /><line x1="143.7367" y1="235.0000" x2="306.8285" y2="98.1498" stroke="#aa5411" stroke-width="4" stroke-linecap="round" /><line x1="388.7633" y1="235.0000" x2="287.5242" y2="114.3480" stroke="#205d9c" stroke-width="3.6" stroke-linecap="round" /><line x1="143.7367" y1="235.0000" x2="306.8285" y2="371.8502" stroke="#aa5411" stroke-width="4" stroke-linecap="round" /><line x1="388.7633" y1="235.0000" x2="287.5242" y2="355.6520" stroke="#205d9c" stroke-width="3.6" stroke-linecap="round" /><line x1="287.5242" y1="114.3480" x2="287.5242" y2="355.6520" stroke="#277339" stroke-width="3.4" stroke-linecap="round" /><path d="M 167.4841 254.9264 A 31 31 0 0 0 167.4841 215.0736" stroke="#aa5411" stroke-width="2.25" fill="none" /><text x="197.7367" y="243.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#aa5411" text-anchor="middle">80°</text><path d="M 287.5242 134.3480 A 20 20 0 0 0 300.3800 129.6689" stroke="#277339" stroke-width="2.25" fill="none" /><text x="298.8109" y="153.3579" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#277339" text-anchor="middle">x</text><circle cx="143.73674863474253" cy="235.0" r="4.9" fill="#28364b" /><text x="126.7367" y="243.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">P</text><circle cx="287.52420283962755" cy="114.34800020876095" r="4.9" fill="#28364b" /><text x="278.5242" y="97.3480" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif"