<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 566 514" width="566" height="514" role="img" aria-labelledby="title desc"><title id="title">각도가 표시된 원의 내접사각형</title><desc id="desc">원 위의 점 A와 D는 위, B와 C는 아래에 있다. 각 ABC는 75도, BCD는 70도이다. A에서의 안쪽 각을 y, D에서의 안쪽 각을 x라고 표시했다.</desc><rect width="566" height="514" fill="white" /><circle cx="283.0" cy="257.0" r="179.5" fill="none" stroke="#205d9c" stroke-width="3.6" /><polygon points="207.1400,94.3178 120.3178,332.8600 430.0378,359.9570 358.8600,94.3178" fill="none" /><line x1="207.1400" y1="94.3178" x2="120.3178" y2="332.8600" stroke="#586574" stroke-width="4.1" stroke-linecap="round" /><line x1="120.3178" y1="332.8600" x2="430.0378" y2="359.9570" stroke="#586574" stroke-width="4.1" stroke-linecap="round" /><line x1="430.0378" y1="359.9570" x2="358.8600" y2="94.3178" stroke="#586574" stroke-width="4.1" stroke-linecap="round" /><line x1="358.8600" y1="94.3178" x2="207.1400" y2="94.3178" stroke="#586574" stroke-width="4.1" stroke-linecap="round" /><path d="M 194.8273 128.1467 A 36 36 0 0 0 243.1400 94.3178" stroke="#266f73" stroke-width="2.25" fill="none" /><text x="247.8639" y="160.4775" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#266f73" text-anchor="middle">y</text><path d="M 322.8600 94.3178 A 36 36 0 0 0 368.1775 129.0911" stroke="#704895" stroke-width="2.25" fill="none" /><text x="315.6379" y="158.6458" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#704895" text-anchor="middle">x</text><path d="M 132.6305 299.0310 A 36 36 0 0 1 156.1808 335.9976" stroke="#704895" stroke-width="2.25" fill="none" /><text x="180.1985" y="302.7117" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#704895" text-anchor="middle">75°</text><path d="M 394.1748 356.8194 A 36 36 0 0 1 420.7203 325.1836" stroke="#266f73" stroke-width="2.25" fill="none" /><text x="375.6486" y="322.3191" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#266f73" text-anchor="middle">70°</text><circle cx="207.14002201754448" cy="94.31775222692133" r="4.9" fill="#28364b" /><text x="194.1400" y="76.3178" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">A</text><circle cx="120.31775222692133" cy="332.8599779824555" r="4.9" fill="#28364b" /><text x="102.3178" y="345.8600" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">B</text><circle cx="430.03779194987396" cy="359.95697032501283" r="4.9" fill="#28364b" /><text x="446.0378" y="374.9570" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">C</text><circle cx="358.8599779824556" cy="94.31775222692136" r="4.9" fill="#28364b" /><text x="370.8600" y="76.3178" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">D</text></svg>
