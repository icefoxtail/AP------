<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 692 505" width="692" height="505" role="img" aria-labelledby="title desc"><title id="title">원과 세 접선에 둘러싸인 삼각형</title><desc id="desc">원 O의 두 접선은 A와 B에서 원에 붙고 오른쪽 C에서 만난다. 그 사이의 세로 접선은 원에 R에서 닿고 두 접선과 P와 Q에서 만난다. OA는 6 cm, OC는 10 cm이다.</desc><rect width="692" height="505" fill="white" /><circle cx="284.6666666666667" cy="252.5" r="175.0" fill="none" stroke="#205d9c" stroke-width="3.6" /><polygon points="459.6667,165.0000 459.6667,340.0000 576.3333,252.5000" fill="none" /><line x1="389.6667" y1="112.5000" x2="576.3333" y2="252.5000" stroke="#aa5411" stroke-width="4.1" stroke-linecap="round" /><line x1="389.6667" y1="392.5000" x2="576.3333" y2="252.5000" stroke="#aa5411" stroke-width="4.1" stroke-linecap="round" /><line x1="459.6667" y1="165.0000" x2="459.6667" y2="340.0000" stroke="#266f73" stroke-width="4.1" stroke-linecap="round" /><line x1="284.6667" y1="252.5000" x2="389.6667" y2="112.5000" stroke="#205d9c" stroke-width="4.1" stroke-linecap="round" /><line x1="284.6667" y1="252.5000" x2="389.6667" y2="392.5000" stroke="#205d9c" stroke-width="4.1" stroke-linecap="round" /><line x1="284.6667" y1="252.5000" x2="576.3333" y2="252.5000" stroke="#586574" stroke-width="4.1" stroke-linecap="round" /><text x="300.1667" y="196.5000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#205d9c" text-anchor="middle">6 cm</text><text x="398.4167" y="291.5000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#586574" text-anchor="middle">10 cm</text><circle cx="284.6666666666667" cy="252.5" r="4.9" fill="#28364b" /><text x="269.6667" y="276.5000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">O</text><circle cx="576.3333333333334" cy="252.5" r="4.9" fill="#28364b" /><text x="593.3333" y="261.5000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">C</text><circle cx="389.6666666666667" cy="112.5" r="4.9" fill="#28364b" /><text x="390.6667" y="95.5000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">A</text><circle cx="389.6666666666667" cy="392.5" r="4.9" fill="#28364b" /><text x="392.6667" y="419.5000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">B</text><circle cx="459.6666666666667" cy="165.0" r="4.9" fill="#28364b" /><text x="476.6667" y="163.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">P</text><circle cx="459.6666666666667" cy="340.0" r="4.9" fill="#28364b" /><text x="478.6667" y="362.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">Q</text><circle cx="459.6666666666667" cy="252.5" r="4.9" fill="#28364b" /><text x="447.6667" y="239.5000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">R</text></svg>
