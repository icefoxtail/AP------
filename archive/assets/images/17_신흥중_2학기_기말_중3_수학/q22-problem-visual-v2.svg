<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 554 539" width="554" height="539" role="img" aria-labelledby="title desc"><title id="title">원 둘레에 꼭짓점을 둔 정팔각형</title><desc id="desc">원의 중심은 O이다. 원 위에 정팔각형의 여덟 꼭짓점이 놓인다. 꼭짓점 하나와 중심을 이은 반지름의 길이는 6 cm이다.</desc><rect width="554" height="539" fill="white" /><circle cx="277.0" cy="269.5" r="192.0" fill="none" stroke="#205d9c" stroke-width="3.6" /><polygon points="277.0000,77.5000 141.2355,133.7355 85.0000,269.5000 141.2355,405.2645 277.0000,461.5000 412.7645,405.2645 469.0000,269.5000 412.7645,133.7355" fill="none" /><line x1="277.0000" y1="77.5000" x2="141.2355" y2="133.7355" stroke="#266f73" stroke-width="4.0" stroke-linecap="round" /><line x1="141.2355" y1="133.7355" x2="85.0000" y2="269.5000" stroke="#266f73" stroke-width="4.0" stroke-linecap="round" /><line x1="85.0000" y1="269.5000" x2="141.2355" y2="405.2645" stroke="#266f73" stroke-width="4.0" stroke-linecap="round" /><line x1="141.2355" y1="405.2645" x2="277.0000" y2="461.5000" stroke="#266f73" stroke-width="4.0" stroke-linecap="round" /><line x1="277.0000" y1="461.5000" x2="412.7645" y2="405.2645" stroke="#266f73" stroke-width="4.0" stroke-linecap="round" /><line x1="412.7645" y1="405.2645" x2="469.0000" y2="269.5000" stroke="#266f73" stroke-width="4.0" stroke-linecap="round" /><line x1="469.0000" y1="269.5000" x2="412.7645" y2="133.7355" stroke="#266f73" stroke-width="4.0" stroke-linecap="round" /><line x1="412.7645" y1="133.7355" x2="277.0000" y2="77.5000" stroke="#266f73" stroke-width="4.0" stroke-linecap="round" /><line x1="277.0000" y1="269.5000" x2="277.0000" y2="77.5000" stroke="#aa5411" stroke-width="4.15" stroke-linecap="round" /><text x="323.0000" y="185.5000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#aa5411" text-anchor="middle">6 cm</text><circle cx="277.0" cy="269.5" r="4.9" fill="#28364b" /><text x="262.0000" y="294.5000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-