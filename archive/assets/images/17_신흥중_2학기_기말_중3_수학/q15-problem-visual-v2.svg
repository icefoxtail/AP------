<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 566 514" width="566" height="514" role="img" aria-labelledby="title desc"><title id="title">지름이 지나는 원의 중심과 두 각</title><desc id="desc">원 위 A와 Q를 지나는 지름이 중심 O를 지난다. P에서 A와 B를 바라본 각은 47도이다. Q에서 두 현이 이루는 각이 x, 중심 O에서 OA와 OB가 이루는 각이 y이다.</desc><rect width="566" height="514" fill="white" /><circle cx="283.0" cy="257.0" r="179.5" fill="none" stroke="#205d9c" stroke-width="3.6" /><line x1="151.7220" y1="379.4187" x2="283.0000" y2="77.5000" stroke="#586574" stroke-width="4.1" stroke-linecap="round" /><line x1="283.0000" y1="77.5000" x2="414.2780" y2="379.4187" stroke="#586574" stroke-width="4.1" stroke-linecap="round" /><line x1="151.7220" y1="379.4187" x2="414.2780" y2="134.5813" stroke="#266f73" stroke-width="4.1" stroke-linecap="round" /><line x1="414.2780" y1="134.5813" x2="414.2780" y2="379.4187" stroke="#586574" stroke-width="4.1" stroke-linecap="round" /><line x1="283.0000" y1="257.0000" x2="414.2780" y2="379.4187" stroke="#aa5411" stroke-width="4.1" stroke-linecap="round" /><path d="M 263.0625 123.3530 A 50 50 0 0 0 302.9375 123.3530" stroke="#277339" stroke-width="2.25" fill="none" /><text x="283.0000" y="169.5000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#277339" text-anchor="middle">47°</text><path d="M 383.5611 163.2252 A 42 42 0 0 0 414.2780 176.5813" stroke="#266f73" stroke-width="2.25" fill="none" /><text x="386.7643" y="205.8584" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#266f73" text-anchor="middle">x</text><path d="M 253.7459 284.2799 A 40 40 0 0 0 312.2541 284.2799" stroke="#aa5411" stroke-width="2.25" fill="none" /><text x="283.0000" y="339.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#aa5411" text-anchor="middle">y</text><circle cx="283.0" cy="77.5" r="4.9" fill="#28364b" /><text x="283.0000" y="60.5000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">P</text><circle cx="414.27798944064114" cy="134.58129436878153" r="4.9" fill="#28364b" /><text x="430.2780" y="122.5813" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">Q</text><circle cx="151.7220105593589" cy="379.4187056312185" r="4.9" fill="#28364b" /><text x="135.7220" y="401.4187" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">A</text><circle cx="414.27798944064114" cy="379.4187056312184" r="4.9" fill="#28364b" /><text x="430.2780" y="402.4187" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">B</text><circle cx="283.0" cy="257.0" r="4.9" fill="#28364b" /><text x="268.0000" y="244.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">O</text></svg>
