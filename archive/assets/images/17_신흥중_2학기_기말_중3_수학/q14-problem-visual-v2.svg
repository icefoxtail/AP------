<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 693 506" width="693" height="506" role="img" aria-labelledby="title desc"><title id="title">직사각형 안에 들어 있는 두 내접원</title><desc id="desc">가로가 12, 세로가 8인 직사각형 ABCD에서 직선 AF는 큰 원의 E에 접한다. 큰 원의 중심은 O′이며 H, G, I에서도 직사각형과 닿는다. 작은 원 O는 왼쪽의 삼각형 ABF 안에 있다.</desc><rect width="693" height="506" fill="white" /><polygon points="81.0000,68.6667 81.0000,417.3333 342.5000,417.3333" fill="none" /><circle cx="429.6666666666667" cy="243.0" r="174.33333333333334" fill="none" stroke="#205d9c" stroke-width="3.6" /><circle cx="168.16666666666666" cy="330.1666666666667" r="87.16666666666667" fill="none" stroke="#aa5411" stroke-width="3.6" /><line x1="81.0000" y1="68.6667" x2="81.0000" y2="417.3333" stroke="#586574" stroke-width="4.1" stroke-linecap="round" /><line x1="81.0000" y1="417.3333" x2="604.0000" y2="417.3333" stroke="#586574" stroke-width="4.1" stroke-linecap="round" /><line x1="604.0000" y1="417.3333" x2="604.0000" y2="68.6667" stroke="#586574" stroke-width="4.1" stroke-linecap="round" /><line x1="604.0000" y1="68.6667" x2="81.0000" y2="68.6667" stroke="#586574" stroke-width="4.1" stroke-linecap="round" /><line x1="81.0000" y1="68.6667" x2="342.5000" y2="417.3333" stroke="#266f73" stroke-width="4.1" stroke-linecap="round" /><line x1="81.0000" y1="39.6667" x2="604.0000" y2="39.6667" stroke="#586574" stroke-width="1.7" stroke-linecap="round" /><line x1="81.0000" y1="34.1667" x2="81.0000" y2="45.1667" stroke="#586574" stroke-width="1.7" stroke-linecap="round" /><line x1="604.0000" y1="34.1667" x2="604.0000" y2="45.1667" stroke="#586574" stroke-width="1.7" stroke-linecap="round" /><text x="342.5000" y="28.6667" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#586574" text-anchor="middle">12</text><line x1="52.0000" y1="68.6667" x2="52.0000" y2="417.3333" stroke="#586574" stroke-width="1.7" stroke-linecap="round" /><line x1="57.5000" y1="68.6667" x2="46.5000" y2="68.6667" stroke="#586574" st