<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 685 514" width="685" height="514" role="img" aria-labelledby="title desc"><title id="title">원 밖의 한 점과 원 안의 만남</title><desc id="desc">왼쪽 P에서 위로 향한 할선은 A와 C, 아래로 향한 할선은 B와 D를 지난다. 두 할선은 P에서 26도를 이룬다. 현 AD와 BC가 E에서 만나고 각 CED는 64도이다. 각 ACB를 x로 표시했다.</desc><rect width="685" height="514" fill="white" /><circle cx="446.53020507487" cy="257.0" r="153.46979492512997" fill="none" stroke="#205d9c" stroke-width="3.6" /><line x1="85.0000" y1="257.0000" x2="555.0497" y2="148.4805" stroke="#266f73" stroke-width="4.1" stroke-linecap="round" /><line x1="85.0000" y1="257.0000" x2="555.0497" y2="365.5195" stroke="#aa5411" stroke-width="4.1" stroke-linecap="round" /><line x1="301.4217" y1="207.0351" x2="555.0497" y2="365.5195" stroke="#586574" stroke-width="4.1" stroke-linecap="round" /><line x1="301.4217" y1="306.9649" x2="555.0497" y2="148.4805" stroke="#586574" stroke-width="4.1" stroke-linecap="round" /><path d="M 141.5135 270.0472 A 58 58 0 0 0 141.5135 243.9528" stroke="#704895" stroke-width="2.25" fill="none" /><text x="197.0000" y="265.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#704895" text-anchor="middle">26°</text><path d="M 412.7600 237.3930 A 37 37 0 0 1 412.7600 276.6070" stroke="#aa5411" stroke-width="2.25" fill="none" /><text x="456.3822" y="265.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#aa5411" text-anchor="middle">64°</text><path d="M 509.2543 159.0532 A 47 47 0 0 0 515.1915 173.3867" stroke="#266f73" stroke-width="2.25" fill="none" /><text x="476.9110" y="195.9471" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#266f73" text-anchor="middle">x</text><circle cx="85.0" cy="256.99999999999994" r="4.9" fill="#28364b" /><text x="71.0000" y="264.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">P</text><circle cx="301.4216631797419" cy="207.03512210130708" r="4.9" fill="#28364b" /><text x="288.4217" y="189.0351" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">A</text><circle cx="301.4216631797419" cy="306.96487789869286" r="4.9" fill="#28364b" /><text x="287.4217" y="328.9649" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">B</text><circle cx="555.0497377737382" cy="148.4804673011318" r="4.9" fill="#28364b" /><text x="569.0497" y="134.4805" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">C</text><circle cx="555.0497377737382" cy="365.51953269886826" r="4.9" fill="#28364b" /><text x="569.0497" y="389.5195" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">D</text><circle cx="381.38218252034017" cy="257.0" r="4.9" fill="#28364b" /><text x="374.3822" y="285.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">E</text></svg>
