<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 704 459" width="704" height="459" role="img" aria-labelledby="title desc"><title id="title">직각삼각형의 빗변과 작은 수선</title><desc id="desc">삼각형 ABC의 A가 직각이다. 왼쪽 AB는 8 cm, 아래쪽 빗변 BC는 17 cm이다. 오른쪽 사선 AC의 중간에서 BC로 내린 수선과 AC가 이루는 오른쪽 각을 x로 표시했다.</desc><rect width="704" height="459" fill="white" /><polygon points="203.2561,118.6349 85.0000,340.3651 619.0000,340.3651" fill="none" /><line x1="203.2561" y1="118.6349" x2="85.0000" y2="340.3651" stroke="#205d9c" stroke-width="4.1" stroke-linecap="round" /><line x1="203.2561" y1="118.6349" x2="619.0000" y2="340.3651" stroke="#aa5411" stroke-width="4.1" stroke-linecap="round" /><line x1="85.0000" y1="340.3651" x2="619.0000" y2="340.3651" stroke="#586574" stroke-width="4.1" stroke-linecap="round" /><line x1="436.0727" y1="242.8038" x2="436.0727" y2="340.3651" stroke="#266f73" stroke-width="4.1" stroke-linecap="round" /><line x1="195.7266" y1="132.7526" x2="209.8443" y2="140.2820" stroke="#586574" stroke-width="1.8" stroke-linecap="round" /><line x1="209.8443" y1="140.2820" x2="217.3737" y2="126.1644" stroke="#586574" stroke-width="1.8" stroke-linecap="round" /><line x1="436.0727" y1="324.3651" x2="452.0727" y2="324.3651" stroke="#586574" stroke-width="1.8" stroke-linecap="round" /><line x1="452.0727" y1="324.3651" x2="452.0727" y2="340.3651" stroke="#586574" stroke-width="1.8" stroke-linecap="round" /><path d="M 436.0727 280.8038 A 38 38 0 0 0 469.6021 260.6862" stroke="#aa5411" stroke-width="2.25" fill="none" /><text x="469.5149" y="306.5408" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#aa5411" text-anchor="middle">x</text><line x1="59.4118" y1="326.7180" x2="177.6678" y2="104.9879" stroke="#205d9c" stroke-width="1.7" stroke-linecap="round" /><line x1="54.5588" y1="324.1298" x2="64.2647" y2="329.3062" stroke="#205d9c" stroke-width="1.7" stroke-linecap="round" /><line x1="172.8149" y1="102.3997" x2="182.5208" y2="107.5761" stroke="#205d