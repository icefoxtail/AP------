<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 565 527" width="565" height="527" role="img" aria-labelledby="title desc"><title id="title">지름과 원 안에서 교차하는 선분</title><desc id="desc">원의 가로 지름은 AB이고 중점은 O이다. 원 위 D에서 B를 잇는 현은 선분 OC와 E에서 만난다. OE와 EC는 같은 표시이며 DE는 6 cm, EB는 4 cm이다.</desc><rect width="565" height="527" fill="white" /><circle cx="282.5" cy="263.5" r="186.0" fill="none" stroke="#205d9c" stroke-width="3.6" /><line x1="96.5000" y1="263.5000" x2="468.5000" y2="263.5000" stroke="#586574" stroke-width="4.1" stroke-linecap="round" /><line x1="177.8750" y1="109.7157" x2="468.5000" y2="263.5000" stroke="#aa5411" stroke-width="4.1" stroke-linecap="round" /><line x1="282.5000" y1="263.5000" x2="422.0000" y2="140.4726" stroke="#266f73" stroke-width="4.1" stroke-linecap="round" /><line x1="322.1176" y1="237.8939" x2="312.8574" y2="227.3939" stroke="#266f73" stroke-width="2.5" stroke-linecap="round" /><line x1="328.8676" y1="231.9410" x2="319.6074" y2="221.4410" stroke="#266f73" stroke-width="2.5" stroke-linecap="round" /><line x1="391.8676" y1="176.3802" x2="382.6074" y2="165.8802" stroke="#266f73" stroke-width="2.5" stroke-linecap="round" /><line x1="398.6176" y1="170.4273" x2="389.3574" y2="159.9273" stroke="#266f73" stroke-width="2.5" stroke-linecap="round" /><line x1="189.1000" y1="88.5025" x2="363.4750" y2="180.7731" stroke="#aa5411" stroke-width="1.7" stroke-linecap="round" /><line x1="191.6724" y1="83.6411" x2="186.5276" y2="93.3639" stroke="#aa5411" stroke-width="1.7" stroke-linecap="round" /><line x1="366.0474" y1="175.9117" x2="360.9026" y2="185.6344" stroke="#aa5411" stroke-width="1.7" stroke-linecap="round" /><text x="285.6416" y="124.9601" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#aa5411" text-anchor="middle">6 cm</text><line x1="410.3750" y1="236.7431" x2="418.3750" y2="287.7431" stroke="#aa5411" stroke-width="1.7" stroke-linecap="round" /><text x="412.3750" y="321.7431" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#aa5411" text-anchor="middle">4 cm</text><circle cx="282.5" cy="263.5" r="4.9" fill="#28364b" /><text x="275.5000" y="290.5000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">O</text><circle cx="96.5" cy="263.5" r="4.9" fill="#28364b" /><text x="83.5000" y="279.5000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">A</text><circle cx="468.5" cy="263.5" r="4.9" fill="#28364b" /><text x="486.5000" y="277.5000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">B</text><circle cx="422.0" cy="140.47256403549653" r="4.9" fill="#28364b" /><text x="437.0000" y="125.4726" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">C</text><circle cx="177.875" cy="109.71570504437068" r="4.9" fill="#28364b" /><text x="163.8750" y="94.7157" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">D</text><circle cx="352.25" cy="201.98628201774827" r="4.9" fill="#28364b" /><text x="362.2500" y="227.9863" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">E</text></svg>
