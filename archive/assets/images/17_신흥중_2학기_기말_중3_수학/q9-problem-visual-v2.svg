<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 452" width="680" height="452" role="img" aria-labelledby="title desc"><title id="title">연장한 밑변에 내려오는 수선</title><desc id="desc">B, C, H가 이 순서로 한 직선 위에 놓인다. 같은 길이 BC와 CH에 초록 눈금을 표시했다. A는 H의 위에 있고 AH는 밑변에 수직이다. 각 ACH는 45도, 각 BAC는 x이다.</desc><rect width="680" height="452" fill="white" /><polygon points="595.0000,98.5000 85.0000,353.5000 340.0000,353.5000" fill="none" /><line x1="85.0000" y1="353.5000" x2="595.0000" y2="98.5000" stroke="#205d9c" stroke-width="4.1" stroke-linecap="round" /><line x1="595.0000" y1="98.5000" x2="340.0000" y2="353.5000" stroke="#aa5411" stroke-width="4.1" stroke-linecap="round" /><line x1="85.0000" y1="353.5000" x2="340.0000" y2="353.5000" stroke="#277339" stroke-width="4.1" stroke-linecap="round" /><line x1="340.0000" y1="353.5000" x2="595.0000" y2="353.5000" stroke="#277339" stroke-width="4.1" stroke-linecap="round" /><line x1="595.0000" y1="98.5000" x2="595.0000" y2="353.5000" stroke="#586574" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="7 6" /><line x1="595.0000" y1="337.5000" x2="579.0000" y2="337.5000" stroke="#586574" stroke-width="1.8" stroke-linecap="round" /><line x1="579.0000" y1="337.5000" x2="579.0000" y2="353.5000" stroke="#586574" stroke-width="1.8" stroke-linecap="round" /><line x1="213.1000" y1="360.5000" x2="213.1000" y2="346.5000" stroke="#277339" stroke-width="2.5" stroke-linecap="round" /><line x1="222.1000" y1="360.5000" x2="222.1000" y2="346.5000" stroke="#277339" stroke-width="2.5" stroke-linecap="round" /><line x1="468.1000" y1="360.5000" x2="468.1000" y2="346.5000" stroke="#277339" stroke-width="2.5" stroke-linecap="round" /><line x1="477.1000" y1="360.5000" x2="477.1000" y2="346.5000" stroke="#277339" stroke-width="2.5" stroke-linecap="round" /><path d="M 382.0000 353.5000 A 42 42 0 0 0 369.6985 323.8015" stroke="#aa5411" stroke-width="2.25" fill="none" /><text x="411.1387" y="332.0334" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#aa5411" text-anchor="middle">45°</text><path d="M 539.5455 126.2272 A 62 62 0 0 0 551.1594 142.3406" stroke="#704895" stroke-width="2.25" fill="none" /><text x="493.5545" y="187.8781" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#704895" text-anchor="middle">x</text><circle cx="85.0" cy="353.5" r="4.9" fill="#28364b" /><text x="70.0000" y="375.5000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">B</text><circle cx="340.0" cy="353.5" r="4.9" fill="#28364b" /><text x="340.0000" y="379.5000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">C</text><circle cx="595.0" cy="353.5" r="4.9" fill="#28364b" /><text x="610.0000" y="376.5000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">H</text><circle cx="595.0" cy="98.5" r="4.9" fill="#28364b" /><text x="604.0000" y="84.5000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">A</text></svg>
