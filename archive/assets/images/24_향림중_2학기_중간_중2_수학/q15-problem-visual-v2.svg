<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 573 555" width="573" height="555" role="img" aria-labelledby="title desc"><title id="title">원의 지름을 빗변으로 하는 직각삼각형</title><desc id="desc">원 위의 A, B, C를 이었다. 빗변 AB는 중심 O를 지나고 O와 C도 연결된다. BAC의 크기는 45도이다.</desc><rect width="573" height="555" fill="white" /><circle cx="286.5" cy="277.5" r="200.0" fill="none" stroke="#23659c" stroke-width="3.6" /><polygon points="427.9214,136.0786 145.0786,418.9214 427.9214,418.9214" fill="none" /><line x1="427.9214" y1="136.0786" x2="145.0786" y2="418.9214" stroke="#23659c" stroke-width="4.75" stroke-linecap="round" /><line x1="145.0786" y1="418.9214" x2="427.9214" y2="418.9214" stroke="#23659c" stroke-width="4.75" stroke-linecap="round" /><line x1="427.9214" y1="418.9214" x2="427.9214" y2="136.0786" stroke="#23659c" stroke-width="4.75" stroke-linecap="round" /><line x1="286.5000" y1="277.5000" x2="427.9214" y2="418.9214" stroke="#207265" stroke-width="4.3" stroke-linecap="round" /><path d="M 398.9300 165.0700 A 41 41 0 0 0 427.9214 177.0786" stroke="#784995" stroke-width="2.25" fill="none" /><text x="399.9855" y="211.5218" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#784995" text-anchor="middle">45°</text><circle cx="427.9213562373095" cy="136.0786437626905" r="4.9" fill="#28364b" /><text x="442.9214" y="121.0786" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">A</text><circle cx="145.0786437626905" cy="418.9213562373095" r="4.9" fill="#28364b" /><text x="132.0786" y="441.9214" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">B</text><circle cx="427.9213562373095" cy="418.9213562373095" r="4.9" fill="#28364b" /><text x="444.9214" y="441.9214" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">C</text><circle cx="286.5" cy="277.5" r="4.9" fill="#28364b" /><text x="266.5000" y="278.5000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">O</text></svg>
