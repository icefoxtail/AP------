<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 350" role="img" aria-labelledby="svg-title-479cfd3ce3" aria-describedby="svg-desc-479cfd3ce3">
  <title id="svg-title-479cfd3ce3">내접원 반지름과 접선 길이</title><desc id="svg-desc-479cfd3ce3">△ABC의 변 길이는 15,14,13이고 넓이 84=21r이므로 내접원 반지름 r=IE=4이다. 직각삼각형 합동에서 BD=BE=8을 얻어 △IBE의 넓이는 16cm²이다.</desc><g fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <polygon points="244,48 100,240 324,240"/><line x1="228" y1="176" x2="177" y2="138"/><line x1="228" y1="176" x2="228" y2="240"/>
    <line x1="228" y1="176" x2="287" y2="151"/><circle cx="228" cy="176" r="4" fill="currentColor"/>
    <path d="M174 145 l10 7 l7-10"/><path d="M228 224 h16 v16"/><path d="M281 156 l7 10 l10-7"/>
  </g>
  <g font-family="sans-serif" font-size="18" fill="currentColor">
    <text x="244" y="30" text-anchor="middle">A</text><text x="82" y="262">B</text><text x="332" y="262">C</text><text x="162" y="130">D</text><text x="228" y="266" text-anchor="middle">E</text><text x="300" y="146">F</text><text x="238" y="172">I</text>
    <text x="125" y="145">AB=15</text><text x="292" y="145">AC=13</text><text x="212" y="292">BC=14</text><text x="238" y="214">IE=4</text><text x="126" y="224">BD=BE=8</text>
    <text x="220" y="318" font-size="16" text-anchor="middle">[ABC]=rs → r=4, △IBD≡△IBE → BE=8</text><text x="220" y="342" font-size="16" text-anchor="middle">[IBE]=1/2×8×4=16 cm²</text>
  </g>
</svg>