<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 300" role="img" aria-labelledby="svg-title-5e9f54bb4e" aria-describedby="svg-desc-5e9f54bb4e">
  <title id="svg-title-5e9f54bb4e">교점으로 만든 삼각형의 밑변과 높이</title><desc id="svg-desc-5e9f54bb4e">y=x와 y=2x는 O=(0,0)에서 만나고, x=4에서 두 직선은 (4,4),(4,8)을 지난다. 삼각형의 밑변과 높이가 각각 4이므로 넓이는 ½·4·4=8이다.</desc><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
<line x1="55" y1="245" x2="405" y2="245"/><line x1="90" y1="280" x2="90" y2="30"/>
<line x1="90" y1="245" x2="330" y2="65"/><line x1="90" y1="245" x2="250" y2="65"/>
<line x1="250" y1="245" x2="250" y2="65" stroke-dasharray="6 4"/>
<polygon points="90,245 250,125 250,65" fill="none" stroke-width="3"/>
<text x="92" y="266" font-size="15" text-anchor="start" fill="currentColor" stroke="none">O</text><text x="258" y="130" font-size="15" text-anchor="start" fill="currentColor" stroke="none">(4,4)</text><text x="258" y="70" font-size="15" text-anchor="start" fill="currentColor" stroke="none">(4,8)</text><text x="285" y="218" font-size="15" text-anchor="start" fill="currentColor" stroke="none">높이 4</text><text x="170" y="235" font-size="15" text-anchor="middle" fill="currentColor" stroke="none">가로거리 4</text><text x="360" y="85" font-size="16" text-anchor="middle" fill="currentColor" stroke="none">넓이 = 1/2×4×4 = 8</text></g>
</svg>