<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 300" role="img" aria-labelledby="svg-title-3fb39e0317" aria-describedby="svg-desc-3fb39e0317">
  <title id="svg-title-3fb39e0317">움직인 거리로 나타낸 사다리꼴 넓이</title><desc id="svg-desc-3fb39e0317">BP=x이면 PC=18−x이고 DQ=3x이다. 평행한 밑변 PC,DQ 사이 높이가 8이므로 넓이는 y=½{(18−x)+3x}×8=8x+72이다.</desc><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
<rect x="70" y="65" width="300" height="155"/><line x1="125" y1="220" x2="285" y2="65"/>
<text x="62" y="60" font-size="16" text-anchor="middle" fill="currentColor" stroke="none">A</text><text x="62" y="242" font-size="16" text-anchor="middle" fill="currentColor" stroke="none">B</text><text x="378" y="242" font-size="16" text-anchor="middle" fill="currentColor" stroke="none">C</text><text x="378" y="60" font-size="16" text-anchor="middle" fill="currentColor" stroke="none">D</text><text x="120" y="242" font-size="16" text-anchor="middle" fill="currentColor" stroke="none">P</text><text x="290" y="60" font-size="16" text-anchor="middle" fill="currentColor" stroke="none">Q</text><text x="220" y="48" font-size="15" text-anchor="middle" fill="currentColor" stroke="none">18</text><text x="48" y="148" font-size="15" text-anchor="middle" fill="currentColor" stroke="none">8</text><text x="192" y="236" font-size="15" text-anchor="middle" fill="currentColor" stroke="none">PC=18−x</text><text x="330" y="82" font-size="15" text-anchor="middle" fill="currentColor" stroke="none">DQ=3x</text><text x="220" y="285" font-size="16" text-anchor="middle" fill="currentColor" stroke="none">y = 1/2{(18−x)+3x}×8 = 8x+72</text></g>
</svg>