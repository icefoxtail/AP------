<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 732 533" width="732" height="533" role="img" aria-labelledby="title desc"><title id="title">평행사변형의 문자로 표시된 길이</title><desc id="desc">AD 전체는 3x−4, BC 전체는 x+2이다. 대각선 BD 전체에는 4y+3, O에서 D까지의 구간에는 2분의 1 y+3이 표시돼 있다.</desc><rect width="732" height="533" fill="white" /><polygon points="165.1893,77.5000 96.0800,455.5000 566.8107,455.5000 635.9200,77.5000" fill="none" /><line x1="165.1893" y1="77.5000" x2="96.0800" y2="455.5000" stroke="#23659c" stroke-width="4.75" stroke-linecap="round" /><line x1="96.0800" y1="455.5000" x2="566.8107" y2="455.5000" stroke="#23659c" stroke-width="4.75" stroke-linecap="round" /><line x1="566.8107" y1="455.5000" x2="635.9200" y2="77.5000" stroke="#23659c" stroke-width="4.75" stroke-linecap="round" /><line x1="635.9200" y1="77.5000" x2="165.1893" y2="77.5000" stroke="#23659c" stroke-width="4.75" stroke-linecap="round" /><line x1="165.1893" y1="77.5000" x2="566.8107" y2="455.5000" stroke="#207265" stroke-width="4.4" stroke-linecap="round" /><line x1="96.0800" y1="455.5000" x2="635.9200" y2="77.5000" stroke="#784995" stroke-width="4.5" stroke-linecap="round" /><line x1="165.1893" y1="46.5000" x2="635.9200" y2="46.5000" stroke="#23659c" stroke-width="1.7" stroke-linecap="round" /><line x1="165.1893" y1="41.0000" x2="165.1893" y2="52.0000" stroke="#23659c" stroke-width="1.7" stroke-linecap="round" /><line x1="635.9200" y1="41.0000" x2="635.9200" y2="52.0000" stroke="#23659c" stroke-width="1.7" stroke-linecap="round" /><text x="400.5547" y="27.5000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#23659c" text-anchor="middle">3x − 4</text><line x1="96.0800" y1="487.5000" x2="566.8107" y2="487.5000" stroke="#23659c" stroke-width="1.7" stroke-linecap="round" /><line x1="96.0800" y1="482.0000" x2="96.0800" y2="493.0000" stroke="#23659c" stroke-width="1.7" stroke-linecap="round" /><line x1="566.8107" y1="482.0000" x2="566.8107" y2="493.0000" stroke="#23659c