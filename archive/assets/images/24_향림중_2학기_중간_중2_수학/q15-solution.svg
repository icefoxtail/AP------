<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 350" role="img" aria-label="직각삼각형의 외심과 빗변, 넓이 계산 설명 도형">
  <g fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="280" cy="165" r="120"/><polygon points="357,73 203,257 372,242"/><line x1="203" y1="257" x2="357" y2="73"/>
    <circle cx="280" cy="165" r="4" fill="currentColor"/><path d="M351 226 h18 v18"/>
  </g>
  <g font-family="sans-serif" font-size="18" fill="currentColor">
    <text x="365" y="62">A</text><text x="183" y="279">B</text><text x="382" y="263">C</text><text x="266" y="160">O</text>
    <text x="338" y="105">45°</text><text x="321" y="218">90°</text><text x="245" y="108">R=4</text><text x="255" y="275">AB=8</text>
    <text x="280" y="318" text-anchor="middle">∠C=90° → O는 AB의 중점, AC=BC</text><text x="280" y="342" text-anchor="middle">AC²+BC²=64 → 넓이=16</text>
  </g>
</svg>