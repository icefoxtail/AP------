<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 765 500" width="765" height="500" role="img" aria-labelledby="title desc"><title id="title">두 각의 삼등분선이 만나는 D와 E</title><desc id="desc">A가 직각인 이등변삼각형에서 B의 각을 세 부분 a로 나눴다. BC를 늘인 끝이 F이고, C에서 ACF를 세 부분 b로 나눴다. 네 삼등분선의 교차점 D와 E를 표시했다.</desc><rect width="765" height="500" fill="white" /><polygon points="272.2378,176.8640 85.0000,364.1018 459.4755,364.1018" fill="none" /><line x1="272.2378" y1="176.8640" x2="85.0000" y2="364.1018" stroke="#23659c" stroke-width="4.75" stroke-linecap="round" /><line x1="85.0000" y1="364.1018" x2="459.4755" y2="364.1018" stroke="#23659c" stroke-width="4.75" stroke-linecap="round" /><line x1="459.4755" y1="364.1018" x2="272.2378" y2="176.8640" stroke="#23659c" stroke-width="4.75" stroke-linecap="round" /><line x1="459.4755" y1="364.1018" x2="680.0000" y2="364.1018" stroke="#637789" stroke-width="3.4" stroke-linecap="round" /><line x1="85.0000" y1="364.1018" x2="459.4755" y2="147.8982" stroke="#207265" stroke-width="4.55" stroke-linecap="round" /><line x1="459.4755" y1="364.1018" x2="459.4755" y2="147.8982" stroke="#207265" stroke-width="4.55" stroke-linecap="round" /><line x1="85.0000" y1="364.1018" x2="596.5431" y2="227.0342" stroke="#784995" stroke-width="4.45" stroke-linecap="round" /><line x1="459.4755" y1="364.1018" x2="596.5431" y2="227.0342" stroke="#784995" stroke-width="4.45" stroke-linecap="round" /><line x1="260.9241" y1="188.1777" x2="272.2378" y2="199.4914" stroke="#586574" stroke-width="1.8" stroke-linecap="round" /><line x1="272.2378" y1="199.4914" x2="283.5515" y2="188.1777" stroke="#586574" stroke-width="1.8" stroke-linecap="round" /><path d="M 176.0000 364.1018 A 91 91 0 0 0 172.8993 340.5492" stroke="#23659c" stroke-width="2.25" fill="none" /><text x="227.7852" y="353.5671" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#23659c" text-anchor="middle">a</text><path d="M 172.8993 340.5492 A 91 91 0 0 0 163.8083 318.6018" stroke="