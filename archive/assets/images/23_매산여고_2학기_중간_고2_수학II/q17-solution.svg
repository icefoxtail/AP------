<svg xmlns="http://www.w3.org/2000/svg" width="640" height="430" viewBox="0 0 640 430" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc">
  <title id="title">23 매산여고 17번 외부점에서 그은 접선 개수 해설</title>
  <desc id="desc">점 (n,0)에서 y=x³−2x²에 그은 접선의 개수를 판별식으로 세어 합 21을 얻는다</desc>
  <style>.background{fill:#fff}.axis{stroke:#171717;stroke-width:1.4;fill:none;stroke-linecap:round;stroke-linejoin:round}.curve{stroke:#111;stroke-width:2.1;fill:none;stroke-linecap:round;stroke-linejoin:round}.guide{stroke:#777;stroke-width:.95;stroke-dasharray:4 4;fill:none}.accent{stroke:#b23a48;stroke-width:2;fill:none}.panel{fill:#f7f8fa;stroke:#c7cbd1;stroke-width:1}.title{font-family:"Noto Sans KR","Pretendard","Malgun Gothic",sans-serif;font-size:15px;font-weight:700;fill:#111}.label{font-family:"Noto Sans KR","Pretendard","Malgun Gothic",sans-serif;font-size:12px;fill:#222}.small{font-family:"Noto Sans KR","Pretendard","Malgun Gothic",sans-serif;font-size:11px;fill:#333}.math{font-family:"STIX Two Math","Cambria Math","Times New Roman",serif;font-size:13px;fill:#111}</style>
  <rect class="background" x="0" y="0" width="640" height="430"/><text class="title" x="32" y="28">q17  외부점에서 그은 접선 개수</text><text class="small" x="32" y="47">접점 t의 이차식 판별식이 n에 따라 0, 1, 2개의 비영점 접점을 만든다.</text>
  <g aria-label="count-table"><rect class="panel" x="32" y="65" width="280" height="278" rx="8"/><text class="title" x="52" y="94">n별 판정</text><line class="guide" x1="52" y1="108" x2="292" y2="108"/><text class="label" x="58" y="138">n=1</text><text class="math" x="130" y="138">D&lt;0 ⇒ a₁=1</text><text class="label" x="58" y="174">n=2</text><text class="math" x="130" y="174">D=0 ⇒ a₂=2</text><text class="label" x="58" y="210">n=3…8</text><text class="math" x="130" y="210">D&gt;0 ⇒ aₙ=3</text><line class="guide" x1="52" y1="232" x2="292" y2="232"/><text class="math" x="58" y="270">D=9n²−20n+4</text><text class="math" x="58" y="306">1+2+3×6=21</text><text class="label" x="58" y="330">정답: ⑤</text></g>
  <g aria-label="tangent-geometry"><rect class="panel" x="332" y="65" width="276" height="278" rx="8"/><line class="axis" x1="350" y1="258" x2="588" y2="258"/><path class="curve" d="M354 242 C390 224 408 154 450 136 C492 118 510 216 584 232"/><path class="accent" d="M360 244 L510 104"/><path class="accent" d="M420 236 L590 236"/><circle cx="450" cy="136" r="4" fill="#111"/><circle cx="510" cy="104" r="4" fill="#111"/><text class="label" x="444" y="128">t</text><text class="label" x="514" y="100">접선</text><text class="small" x="350" y="294">t=0은 항상 한 접점,</text><text class="small" x="350" y="314">이차식의 실근을 추가한다.</text></g>
  <rect class="panel" x="32" y="366" width="576" height="38" rx="7"/><text class="small" x="50" y="390">판별식으로 서로 다른 접점 수를 세고 n=1부터 8까지 합한다.</text>
</svg>
