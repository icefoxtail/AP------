  <g aria-label="calculation"><rect class="panel" x="392" y="65" width="216" height="296" rx="8"/><text class="title" x="410.000" y="92.000">계산</text><text class="math" x="410.000" y="132.000">t²−2t−3=0</text><text class="math" x="410.000" y="166.000">t₁+t₂=2</text><text class="math" x="410.000" y="200.000">(4t₁−1)+(4t₂−1)</text><text class="math" x="410.000" y="234.000">=4×2−2=6</text><text class="label" x="410.000" y="268.000">정답: ①</text></g>
  <rect class="panel" x="32" y="382" width="576" height="38" rx="7"/><text class="small" x="50.000" y="406.000">두 접선은 같은 외부점 S를 지나며 접점 t=−1, 3에서 기울기 −5, 11을 만든다.</text>
