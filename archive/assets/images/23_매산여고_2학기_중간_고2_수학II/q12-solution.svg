<svg xmlns="http://www.w3.org/2000/svg" width="640" height="440" viewBox="0 0 640 440" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc">
  <title id="title">23 매산여고 12번 외부점에서 그은 두 접선 해설</title>
  <desc id="desc">점 (1,−3)에서 포물선 y=2x²−x+4에 그은 두 접선의 기울기 합을 근과 계수로 구한다</desc>
  <style>.background{fill:#fff}.axis{stroke:#171717;stroke-width:1.4;fill:none;stroke-linecap:round;stroke-linejoin:round}.curve{stroke:#111;stroke-width:2.1;fill:none;stroke-linecap:round;stroke-linejoin:round}.tangent{stroke:#b23a48;stroke-width:1.9;fill:none;stroke-linecap:round}.guide{stroke:#777;stroke-width:.95;stroke-dasharray:4 4;fill:none}.point{stroke:#111;stroke-width:1;fill:#111}.panel{fill:#f7f8fa;stroke:#c7cbd1;stroke-width:1}.title{font-family:"Noto Sans KR","Pretendard","Malgun Gothic",sans-serif;font-size:15px;font-weight:700;fill:#111}.label{font-family:"Noto Sans KR","Pretendard","Malgun Gothic",sans-serif;font-size:12px;fill:#222}.small{font-family:"Noto Sans KR","Pretendard","Malgun Gothic",sans-serif;font-size:11px;fill:#333}.math{font-family:"STIX Two Math","Cambria Math","Times New Roman",serif;font-size:13px;fill:#111}</style>
  <defs><marker id="axis-arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L6,3 L0,6 Z" fill="#171717"/></marker></defs>
  <rect class="background" x="0" y="0" width="640" height="440"/><text class="title" x="32" y="28">q12  두 접선의 기울기 합</text><text class="small" x="32" y="47">접점 t의 방정식에서 두 근의 합을 읽어 기울기의 합을 계산한다.</text>
  <g aria-label="tangent-graph"><rect class="panel" x="32" y="65" width="342" height="284" rx="8"/><line class="axis" x1="52" y1="296" x2="352" y2="296" marker-end="url(#axis-arrow)"/><line class="axis" x1="210" y1="330" x2="210" y2="82" marker-end="url(#axis-arrow)"/><path class="curve" d="M62 92 C92 168 146 248 210 258 C274 248 328 168 358 92"/><path class="tangent" d="M54 248 L352 340"/><path class="tangent" d="M54 154 L352 62"/><circle class="point" cx="106" cy="264" r="4"/><circle class="point" cx="314" cy="136" r="4"/><circle class="point" cx="230" cy="296" r="4"/><line class="guide" x1="106" y1="264" x2="106" y2="296"/><line class="guide" x1="314" y1="136" x2="314" y2="296"/><text class="label" x="92" y="286">t=−1</text><text class="label" x="300" y="128">t=3</text><text class="label" x="222" y="318">S=(1,−3)</text><text class="math" x="354" y="301">x</text><text class="math" x="216" y="88">y</text></g>
  <g aria-label="calculation"><rect class="panel" x="392" y="65" width="216" height="284" rx="8"/><text class="title" x="410" y="92">근과 계수</text><text class="math" x="410" y="130">t²−2t−3=0</text><text class="math" x="410" y="166">t₁+t₂=2</text><line class="guide" x1="410" y1="184" x2="590" y2="184"/><text class="math" x="410" y="222">(4t₁−1)+(4t₂−1)</text><text class="math" x="410" y="258">=4×2−2=6</text><text class="label" x="410" y="310">정답: ①</text></g>
  <rect class="panel" x="32" y="368" width="576" height="38" rx="7"/><text class="small" x="50" y="392">두 접선은 같은 외부점 (1,−3)을 지나며 접점 t=−1, 3에서 기울기 −5, 11을 만든다.</text>
</svg>
