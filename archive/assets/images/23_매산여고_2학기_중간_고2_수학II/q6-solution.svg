<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 446" width="512" height="446" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">예: a=3(범위의 끝)일 때 y=f′(x)=-3x²+12x-12=-3(x-2)²의 그래프이다. f가 항상 감소하려면 f′(x)≤0이 모든 x에서 성립해야 하므로 위로 볼록한 포물선이 x축 위로 올라가면 안 된다. 그림처럼 꼭짓점 V(2,0)이 x축에 닿는 경우가 한계이며 판별식 조건 4a²-12a≤0에서 0≤a≤3이다. 정수는 0, 1, 2, 3이고 합은 6이다. 따라서 답은 ④이다.</title><desc id="visual-desc">위로 볼록한 포물선의 꼭짓점 V가 x축에 닿은 그래프로 나머지 부분은 모두 x축 아래에 있다.</desc><rect width="512" height="446" fill="#fff"/><g data-layer="30"><line id="x-axis" data-role="axis" stroke="#111" stroke-width="1.2" fill="none" data-axis="x" x1="44" y1="72.31157973" x2="480" y2="72.31157973"/></g><g data-layer="30"><line id="y-axis" data-role="axis" stroke="#111" stroke-width="1.2" fill="none" data-axis="y" x1="32" y1="414" x2="32" y2="32"/></g><g data-layer="40"><polyline id="f-piece-1-branch-0" data-role="curve" stroke="#111" stroke-width="2.1" fill="none" data-branch="PIECE_1" points="91.999999974,373.68842027 93.163879572,369.670107344 94.327759171,365.678762961 95.49163877,361.71438712 96.655518369,357.776979824 97.819397967,353.86654107 98.983277566,349.983070859 100.147157165,346.126569192 101.311036764,342.297036067 102.474916362,338.494471486 103.638795961,334.718875448 104.80267556,330.970247953 105.966555159,327.248589001 107.130434757,323.553898592 108.294314356,319.886176727