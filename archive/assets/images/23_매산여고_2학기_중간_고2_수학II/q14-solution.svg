<svg xmlns="http://www.w3.org/2000/svg" width="640" height="450" viewBox="0 0 640 450" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc">
  <title id="title">23 매산여고 14번 곱의 연속과 합성의 극한 해설</title>
  <desc id="desc">f와 g의 불연속을 곱과 합성의 접근 방향으로 판정한다</desc>
  <style>.background{fill:#fff}.axis{stroke:#171717;stroke-width:1.4;fill:none;stroke-linecap:round;stroke-linejoin:round}.curve{stroke:#111;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}.guide{stroke:#777;stroke-width:.95;stroke-dasharray:4 4;fill:none}.open{stroke:#111;stroke-width:1.4;fill:#fff}.closed{stroke:#111;stroke-width:1;fill:#111}.accent{stroke:#b23a48;stroke-width:2;fill:none}.panel{fill:#f7f8fa;stroke:#c7cbd1;stroke-width:1}.title{font-family:"Noto Sans KR","Pretendard","Malgun Gothic",sans-serif;font-size:15px;font-weight:700;fill:#111}.label{font-family:"Noto Sans KR","Pretendard","Malgun Gothic",sans-serif;font-size:12px;fill:#222}.small{font-family:"Noto Sans KR","Pretendard","Malgun Gothic",sans-serif;font-size:11px;fill:#333}.math{font-family:"STIX Two Math","Cambria Math","Times New Roman",serif;font-size:13px;fill:#111}</style>
  <defs><marker id="axis-arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L6,3 L0,6 Z" fill="#171717"/></marker></defs>
  <rect class="background" x="0" y="0" width="640" height="450"/><text class="title" x="32" y="28">q14  곱의 연속과 합성의 접근 방향</text><text class="small" x="32" y="47">곱은 0이 불연속을 지우는지, 합성은 입력이 1의 어느 쪽으로 가는지를 본다.</text>
  <g aria-label="f-graph"><rect class="panel" x="32" y="65" width="270" height="214" rx="8"/><text class="label" x="48" y="90">f(x)</text><line class="axis" x1="48" y1="214" x2="286" y2="214" marker-end="url(#axis-arrow)"/><path class="curve" d="M52 166 L132 134 L174 134 L214 198 L276 180"/><circle class="open" cx="132" cy="134" r="4.5"/><circle class="closed" cx="132" cy="198" r="4"/><circle class="open" cx="174" cy="134" r="4.5"/><circle class="closed" cx="174" cy="198" r="4"/><line class="guide" x1="132" y1="134" x2="132" y2="214"/><line class="guide" x1="174" y1="134" x2="174" y2="214"/><text class="label" x="124" y="238">0</text><text class="label" x="166" y="238">1</text><text class="small" x="48" y="263">x=1: 1→0</text></g>
  <g aria-label="g-graph"><rect class="panel" x="322" y="65" width="286" height="214" rx="8"/><text class="label" x="338" y="90">g(x)</text><line class="axis" x1="338" y1="214" x2="592" y2="214" marker-end="url(#axis-arrow)"/><path class="curve" d="M342 180 L414 180 L446 150 L520 150 L584 118"/><circle class="open" cx="414" cy="180" r="4.5"/><circle class="closed" cx="414" cy="198" r="4"/><line class="guide" x1="414" y1="150" x2="414" y2="214"/><line class="guide" x1="520" y1="150" x2="520" y2="214"/><text class="label" x="406" y="238">0</text><text class="label" x="512" y="238">2</text><text class="small" x="338" y="263">g(2)=1, 입력 1의 좌우를 분리</text></g>
  <g aria-label="decision"><rect class="panel" x="32" y="300" width="576" height="72" rx="8"/><text class="title" x="50" y="326">판정</text><text class="small" x="50" y="350">ㄱ 거짓: x=0에서 좌극한 곱 1, 실제값 0.   ㄴ 참: [0,2]에서 곱은 연속.   ㄷ 거짓: x→2−이면 f(g(x))→1, x→2+이면 0.</text></g>
  <rect class="panel" x="32" y="390" width="576" height="38" rx="7"/><text class="small" x="50" y="414">불연속점의 곱은 값 0 여부를, 합성은 g(x)가 f의 점 1에 접근하는 방향을 표시한다.  정답: ①</text>
</svg>
