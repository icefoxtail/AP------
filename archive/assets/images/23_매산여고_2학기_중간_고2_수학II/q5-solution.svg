<svg xmlns="http://www.w3.org/2000/svg" width="640" height="410" viewBox="0 0 640 410" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc">
  <title id="title">23 매산여고 5번 접선의 x절편 해설</title>
  <desc id="desc">곡선 y=2x³−x−6의 점 (1,−5)에서 기울기 5인 접선이 x축을 (2,0)에서 만난다</desc>
  <style>.background{fill:#fff}.axis{stroke:#171717;stroke-width:1.4;fill:none;stroke-linecap:round;stroke-linejoin:round}.curve{stroke:#111;stroke-width:2.1;fill:none;stroke-linecap:round;stroke-linejoin:round}.tangent{stroke:#b23a48;stroke-width:2.2;fill:none;stroke-linecap:round}.guide{stroke:#777;stroke-width:.95;stroke-dasharray:4 4;fill:none}.point{stroke:#111;stroke-width:1;fill:#111}.panel{fill:#f7f8fa;stroke:#c7cbd1;stroke-width:1}.title{font-family:"Noto Sans KR","Pretendard","Malgun Gothic",sans-serif;font-size:15px;font-weight:700;fill:#111}.label{font-family:"Noto Sans KR","Pretendard","Malgun Gothic",sans-serif;font-size:12px;fill:#222}.small{font-family:"Noto Sans KR","Pretendard","Malgun Gothic",sans-serif;font-size:11px;fill:#333}.math{font-family:"STIX Two Math","Cambria Math","Times New Roman",serif;font-size:13px;fill:#111}</style>
  <defs><marker id="axis-arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L6,3 L0,6 Z" fill="#171717"/></marker></defs>
  <rect class="background" x="0" y="0" width="640" height="410"/><text class="title" x="32" y="28">q5  접선의 x절편</text><text class="small" x="32" y="47">y′=6x²−1을 점 (1,−5)에 적용해 접선과 x절편을 확인한다.</text>
  <g aria-label="tangent-graph"><rect class="panel" x="32" y="65" width="342" height="264" rx="8"/><line class="axis" x1="52" y1="246" x2="352" y2="246" marker-end="url(#axis-arrow)"/><line class="axis" x1="150" y1="310" x2="150" y2="82" marker-end="url(#axis-arrow)"/><path class="curve" d="M56 140 C88 230 116 264 150 270 C183 276 210 242 234 184 C257 132 284 98 352 86"/><path class="tangent" d="M82 286 L332 36"/><circle class="point" cx="190" cy="246" r="4"/><circle class="point" cx="290" cy="146" r="4"/><line class="guide" x1="190" y1="246" x2="190" y2="274"/><line class="guide" x1="290" y1="146" x2="290" y2="246"/><text class="label" x="178" y="292">(1,−5)</text><text class="label" x="278" y="138">접선</text><text class="label" x="280" y="265">(2,0)</text><text class="math" x="354" y="251">x</text><text class="math" x="156" y="88">y</text></g>
  <g aria-label="calculation"><rect class="panel" x="392" y="65" width="216" height="264" rx="8"/><text class="title" x="410" y="92">계산</text><text class="math" x="410" y="130">f′(1)=5</text><text class="math" x="410" y="166">y+5=5(x−1)</text><text class="math" x="410" y="202">y=5x−10</text><line class="guide" x1="410" y1="220" x2="590" y2="220"/><text class="math" x="410" y="260">y=0 ⇒ x=2</text><text class="label" x="410" y="296">정답: ②</text></g>
  <rect class="panel" x="32" y="348" width="576" height="38" rx="7"/><text class="small" x="50" y="372">접점 (1,−5)에서의 접선 y=5x−10이 x축과 만나는 점이 (2,0)이다.</text>
</svg>
