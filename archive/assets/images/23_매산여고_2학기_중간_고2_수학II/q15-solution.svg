<svg xmlns="http://www.w3.org/2000/svg" width="640" height="450" viewBox="0 0 640 450" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc">
  <title id="title">23 매산여고 15번 쌍곡선과 수직 접선 해설</title>
  <desc id="desc">y=2/x, y=mx의 교점 P와 수직 접선의 절편 Q,R을 비교해 극한 8을 얻는다</desc>
  <style>.background{fill:#fff}.axis{stroke:#171717;stroke-width:1.4;fill:none;stroke-linecap:round;stroke-linejoin:round}.curve{stroke:#111;stroke-width:2.1;fill:none;stroke-linecap:round;stroke-linejoin:round}.line{stroke:#356a9a;stroke-width:2;fill:none;stroke-linecap:round}.guide{stroke:#777;stroke-width:.95;stroke-dasharray:4 4;fill:none}.point{stroke:#111;stroke-width:1;fill:#111}.panel{fill:#f7f8fa;stroke:#c7cbd1;stroke-width:1}.title{font-family:"Noto Sans KR","Pretendard","Malgun Gothic",sans-serif;font-size:15px;font-weight:700;fill:#111}.label{font-family:"Noto Sans KR","Pretendard","Malgun Gothic",sans-serif;font-size:12px;fill:#222}.small{font-family:"Noto Sans KR","Pretendard","Malgun Gothic",sans-serif;font-size:11px;fill:#333}.math{font-family:"STIX Two Math","Cambria Math","Times New Roman",serif;font-size:13px;fill:#111}</style>
  <defs><marker id="axis-arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L6,3 L0,6 Z" fill="#171717"/></marker></defs>
  <rect class="background" x="0" y="0" width="640" height="450"/><text class="title" x="32" y="28">q15  쌍곡선과 수직 접선</text><text class="small" x="32" y="47">P, Q, R의 거리를 각각 m으로 나타내고 최고차항을 비교한다.</text>
  <g aria-label="geometry"><rect class="panel" x="32" y="65" width="342" height="286" rx="8"/><line class="axis" x1="52" y1="290" x2="350" y2="290" marker-end="url(#axis-arrow)"/><line class="axis" x1="188" y1="330" x2="188" y2="82" marker-end="url(#axis-arrow)"/><path class="curve" d="M205 92 C222 128 242 172 262 204 C282 235 310 258 350 273"/><path class="line" d="M188 290 L326 138"/><path class="line" d="M82 268 L290 82"/><circle class="point" cx="242" cy="230" r="4"/><circle class="point" cx="188" cy="290" r="4"/><circle class="point" cx="326" cy="138" r="4"/><circle class="point" cx="290" cy="82" r="4"/><line class="guide" x1="242" y1="230" x2="242" y2="290"/><text class="label" x="248" y="226">P</text><text class="label" x="174" y="308">O</text><text class="label" x="330" y="134">Q</text><text class="label" x="294" y="78">R</text><text class="math" x="350" y="296">x</text><text class="math" x="194" y="88">y</text></g>
  <g aria-label="calculation"><rect class="panel" x="392" y="65" width="216" height="286" rx="8"/><text class="title" x="410" y="92">거리의 제곱</text><text class="math" x="410" y="128">OP²=2/m+2m</text><text class="math" x="410" y="164">OQ²=8m</text><text class="math" x="410" y="200">QR²=8m+8/m</text><line class="guide" x1="410" y1="220" x2="590" y2="220"/><text class="math" x="410" y="258">분자=16m+8/m</text><text class="math" x="410" y="294">극한=16/2=8</text><text class="label" x="410" y="330">정답: ④</text></g>
  <rect class="panel" x="32" y="370" width="576" height="38" rx="7"/><text class="small" x="50" y="394">기울기 m인 OP와 기울기 −1/m인 접선을 같은 도형에 표시해 절편의 크기 변화를 읽는다.</text>
</svg>
