<svg xmlns="http://www.w3.org/2000/svg" width="640" height="450" viewBox="0 0 640 450" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc" data-fact-hash="sha256:c146e48badd8a635baf85e8dbbb2f81bc3bfe3eede7648e79db7d004444d57b6" data-visual-provenance="PYTHON_DERIVED_LAYOUT_REVIEWED">
  <title id="title">23 매산여고 1번 함숫값과 좌극한 해설</title>
  <desc id="desc">x=1의 채운 점과 x=2의 왼쪽에서 접근하는 높이 2를 구분한다</desc>
  <style>.background{fill:#fff}.axis{stroke:#171717;stroke-width:1.4;fill:none;stroke-linecap:round;stroke-linejoin:round}.curve{stroke:#111;stroke-width:2.1;fill:none;stroke-linecap:round;stroke-linejoin:round}.tangent{stroke:#b23a48;stroke-width:2;fill:none;stroke-linecap:round}.normal{stroke:#b23a48;stroke-width:2;fill:none;stroke-linecap:round}.perp{stroke:#356a9a;stroke-width:1.9;fill:none;stroke-linecap:round}.secant{stroke:#356a9a;stroke-width:1.9;fill:none;stroke-linecap:round}.line{stroke:#356a9a;stroke-width:1.9;fill:none;stroke-linecap:round}.line-main{stroke:#356a9a;stroke-width:1.9;fill:none;stroke-linecap:round}.level{stroke:#6b7280;stroke-width:1.2;stroke-dasharray:5 4;fill:none}.guide{stroke:#777;stroke-width:.95;stroke-dasharray:4 4;fill:none}.point{stroke:#111;stroke-width:1;fill:#111}.open{stroke:#111;stroke-width:1.3;fill:#fff}.closed{stroke:#111;stroke-width:1;fill:#111}.panel{fill:#f7f8fa;stroke:#c7cbd1;stroke-width:1}.title{font-family:"Noto Sans KR","Pretendard","Malgun Gothic",sans-serif;font-size:15px;font-weight:700;fill:#111}.label{font-family:"Noto Sans KR","Pretendard","Malgun Gothic",sans-serif;font-size:12px;fill:#222}.small{font-family:"Noto Sans KR","Pretendard","Malgun Gothic",sans-serif;font-size:11px;fill:#333}.math{font-family:"STIX Two Math","Cambria Math","Times New Roman",serif;font-size:13px;fill:#111}</style>
  <defs><marker id="axis-arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L6,3 L0,6 Z" fill="#171717"/></marker><clipPath id="graph-clip"><rect x="32" y="65" width="342" height="296" rx="8"/></clipPath></defs>
  <rect class="background" x="0" y="0" width="640" height="450"/>
  <text class="title" x="32.000" y="28.000">23 매산여고 1번 함숫값과 좌극한</text>
  <text class="small" x="32.000" y="47.000">x=1의 채운 점과 x=2의 왼쪽에서 접근하는 높이 2를 구분한다</text>
  <g aria-label="graph"><rect class="panel" x="32" y="65" width="342" height="296" rx="8"/><g clip-path="url(#graph-clip)"><line class="axis" x1="52.000" y1="246.000" x2="352.000" y2="246.000" marker-end="url(#axis-arrow)"/><line class="axis" x1="106.000" y1="346.000" x2="106.000" y2="82.000" marker-end="url(#axis-arrow)"/><polyline class="curve" points="52.000,260.000 105.000,220.000 145.000,180.000 178.000,152.000 215.000,135.000 250.000,152.000"/><polyline class="curve" points="250.000,152.000 290.000,175.000 338.000,220.000"/><circle class="closed" cx="178.000" cy="152.000" r="4.00"/><circle class="open" cx="250.000" cy="152.000" r="4.60"/><line class="guide" x1="178.000" y1="152.000" x2="178.000" y2="246.000"/><line class="guide" x1="250.000" y1="152.000" x2="250.000" y2="246.000"/><text class="label" x="170.000" y="270.000">1</text><text class="label" x="242.000" y="270.000">2</text><text class="math" x="354.000" y="251.000">x</text><text class="math" x="114.000" y="88.000">y</text></g></g>
  <g aria-label="calculation"><rect class="panel" x="392" y="65" width="216" height="296" rx="8"/><text class="title" x="410.000" y="92.000">계산</text><text class="math" x="410.000" y="132.000">f(1)=2</text><text class="math" x="410.000" y="166.000">lim x→2− f(x)=2</text><text class="math" x="410.000" y="200.000">f(1)+lim =2+2</text><text class="math" x="410.000" y="234.000">=4</text><text class="label" x="410.000" y="268.000">정답: ④</text></g>
  <rect class="panel" x="32" y="382" width="576" height="38" rx="7"/><text class="small" x="50.000" y="406.000">x=1에서는 채운 점, x=2에서는 왼쪽 branch가 다가가는 높이를 읽는다.</text>
