<svg xmlns="http://www.w3.org/2000/svg" width="640" height="390" viewBox="0 0 640 390" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc">
  <title id="title">23 매산여고 1번 함숫값과 좌극한 해설</title>
  <desc id="desc">x=1의 채운 점과 x=2의 왼쪽에서 접근하는 높이 2를 구분한다</desc>
  <style>.background{fill:#fff}.axis{stroke:#171717;stroke-width:1.4;fill:none;stroke-linecap:round;stroke-linejoin:round}.curve{stroke:#111;stroke-width:2.1;fill:none;stroke-linecap:round;stroke-linejoin:round}.guide{stroke:#777;stroke-width:.95;stroke-dasharray:4 4;fill:none}.open{stroke:#111;stroke-width:1.4;fill:#fff}.closed{stroke:#111;stroke-width:1;fill:#111}.panel{fill:#f7f8fa;stroke:#c7cbd1;stroke-width:1}.title{font-family:"Noto Sans KR","Pretendard","Malgun Gothic",sans-serif;font-size:15px;font-weight:700;fill:#111}.label{font-family:"Noto Sans KR","Pretendard","Malgun Gothic",sans-serif;font-size:12px;fill:#222}.small{font-family:"Noto Sans KR","Pretendard","Malgun Gothic",sans-serif;font-size:11px;fill:#333}.math{font-family:"STIX Two Math","Cambria Math","Times New Roman",serif;font-size:13px;fill:#111}</style>
  <defs><marker id="axis-arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L6,3 L0,6 Z" fill="#171717"/></marker></defs>
  <rect class="background" x="0" y="0" width="640" height="390"/><text class="title" x="32" y="28">q1  함숫값과 좌극한</text><text class="small" x="32" y="47">채운 점은 f(1), 왼쪽 branch의 끝 높이는 x→2−의 극한이다.</text>
  <g aria-label="graph"><rect class="panel" x="32" y="65" width="330" height="238" rx="8"/><line class="axis" x1="52" y1="246" x2="340" y2="246" marker-end="url(#axis-arrow)"/><line class="axis" x1="178" y1="282" x2="178" y2="82" marker-end="url(#axis-arrow)"/><path class="curve" d="M55 260 C92 226 116 180 155 152 C182 132 220 152 250 152"/><path class="curve" d="M250 152 C278 156 310 196 338 220"/><circle class="closed" cx="178" cy="152" r="4"/><circle class="open" cx="250" cy="152" r="4.6"/><line class="guide" x1="178" y1="152" x2="178" y2="246"/><line class="guide" x1="250" y1="152" x2="250" y2="246"/><text class="label" x="168" y="267">1</text><text class="label" x="242" y="267">2</text><text class="math" x="342" y="251">x</text><text class="math" x="184" y="88">y</text><text class="small" x="92" y="292">f(1)=2</text><text class="small" x="225" y="292">lim x→2− f(x)=2</text></g>
  <g aria-label="calculation"><rect class="panel" x="380" y="65" width="228" height="238" rx="8"/><text class="title" x="398" y="92">값 읽기</text><text class="math" x="398" y="132">f(1)=2</text><text class="math" x="398" y="168">lim x→2− f(x)=2</text><line class="guide" x1="398" y1="190" x2="590" y2="190"/><text class="label" x="398" y="230">f(1)+lim = 2+2</text><text class="label" x="398" y="262">=4  (정답: ④)</text></g>
  <rect class="panel" x="32" y="322" width="576" height="38" rx="7"/><text class="small" x="50" y="346">x=1에서는 채운 점, x=2에서는 왼쪽에서 다가가는 branch의 높이를 읽는다.</text>
</svg>
