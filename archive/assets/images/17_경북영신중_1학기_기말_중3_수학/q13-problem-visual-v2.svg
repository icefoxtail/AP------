<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 705 544" width="705" height="544" role="img" aria-labelledby="title desc"><title id="title">세로로 평행이동한 같은 두 포물선</title><desc id="desc">파란 포물선은 y=x²이고, 주황색 점선은 y=x²+3이다. 각 곡선의 왼쪽 가지에 점 A와 B가 있어 같은 세로선 위에 놓인다.</desc><rect width="705" height="544" fill="white" /><line x1="253.6008" y1="298.3610" x2="253.6008" y2="392.9838" stroke="#25736e" stroke-width="4.6" stroke-linecap="round" /><line x1="53.0000" y1="433.2584" x2="649.0000" y2="433.2584" stroke="#4d5d72" stroke-width="1.65" stroke-linecap="round" /><polygon points="649.0000,433.2584 636.0000,428.2584 636.0000,438.2584" fill="#4d5d72" /><text x="666.0000" y="425.2584" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#4d5d72" text-anchor="middle">x</text><line x1="347.2698" y1="473.0000" x2="347.2698" y2="80.0000" stroke="#4d5d72" stroke-width="1.65" stroke-linecap="round" /><polygon points="347.2698,80.0000 342.2698,93.0000 352.2698,93.0000" fill="#4d5d72" /><text x="363.2698" y="86.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#4d5d72" text-anchor="middle">y</text><text x="326.2698" y="461.2584" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#4d5d72" text-anchor="middle">O</text><path d="M 88.6439 126.2264 Q 347.2698 740.2905 605.8957 126.2264" stroke="#205d9c" stroke-width="6.0" stroke-linecap="round" fill="none" /><path d="M 120.9722 103.5642 Q 347.2698 573.7070 573.5675 103.5642" stroke="#aa5411" stroke-width="6.0" stroke-linecap="round" fill="none" stroke-dasharray="15 7" /><circle cx="253.6008344923505" cy="298.36101926163724" r="6.0" fill="white" stroke="#25736e" stroke-width="3.1" /><text x="279.6008" y="286.3610" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#25736e" text-anchor="middle">A</text><circle cx="253.6008344923505" cy="392.98381219903695" r="6.0" fill="white" stroke="#25736e" stroke-width="3.1" /><text x="233.6008" y="426.9838" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#25736e" text-anchor="middle">B</text><line x1="64.0000" y1="39.0000" x2="114.0000" y2="39.0000" stroke="#205d9c" stroke-width="5.4" stroke-linecap="round" /><text x="126.0000" y="47.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#205d9c" text-anchor="start">y = x²</text><line x1="379.0000" y1="39.0000" x2="429.0000" y2="39.0000" stroke="#aa5411" stroke-width="5.4" stroke-linecap="round" stroke-dasharray="15 7" /><text x="441.0000" y="47.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#aa5411" text-anchor="start">y = x² + 3</text></svg>
