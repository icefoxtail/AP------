<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 705 544" width="705" height="544" role="img" aria-labelledby="title desc"><title id="title">왼쪽 위에 꼭짓점이 있는 포물선</title><desc id="desc">파란 포물선은 아래로 열리며 꼭짓점은 가로축 위, 세로축 왼쪽에 있다. 곡선의 두 가지가 가로축을 한 번씩 지난다.</desc><rect width="705" height="544" fill="white" /><line x1="53.0000" y1="354.7473" x2="649.0000" y2="354.7473" stroke="#4d5d72" stroke-width="1.65" stroke-linecap="round" /><polygon points="649.0000,354.7473 636.0000,349.7473 636.0000,359.7473" fill="#4d5d72" /><text x="666.0000" y="346.7473" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#4d5d72" text-anchor="middle">x</text><line x1="400.0380" y1="473.0000" x2="400.0380" y2="58.0000" stroke="#4d5d72" stroke-width="1.65" stroke-linecap="round" /><polygon points="400.0380,58.0000 395.0380,71.0000 405.0380,71.0000" fill="#4d5d72" /><text x="416.0380" y="64.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#4d5d72" text-anchor="middle">y</text><text x="379.0380" y="382.7473" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#4d5d72" text-anchor="middle">O</text><path d="M 126.9342 454.2090 Q 328.3671 -182.0262 529.8000 454.2090" stroke="#205d9c" stroke-width="6.0" stroke-linecap="round" fill="none" /><circle cx="328.3670886075949" cy="136.09139784946234" r="6.0" fill="white" stroke="#25736e" stroke-width="3.1" /><text x="376.3671" y="123.0914" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#25736e" text-anchor="middle">(p, q)</text></svg>
