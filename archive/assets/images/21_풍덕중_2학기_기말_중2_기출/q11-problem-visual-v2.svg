<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 745 462" width="745" height="462" role="img" aria-labelledby="title desc"><title id="title">A에서 B를 거쳐 C까지 가는 두 구간</title><desc id="desc">일직선 위 A, B, C의 왼쪽 구간에는 위·가운데·아래 경로가 있다. B에서 C로 이어지는 구간도 세 경로다.</desc><rect width="745" height="462" fill="white" /><line x1="93.0000" y1="217.0000" x2="367.0000" y2="217.0000" stroke="#202020" stroke-width="5.15" stroke-linecap="round" /><path d="M 93 217 C 163 69, 297 69, 367 217" fill="none" stroke="#202020" stroke-width="5.15" stroke-linecap="round" /><path d="M 93 217 C 163 365, 297 365, 367 217" fill="none" stroke="#202020" stroke-width="5.15" stroke-linecap="round" /><line x1="367.0000" y1="217.0000" x2="641.0000" y2="217.0000" stroke="#227365" stroke-width="5.15" stroke-linecap="round" /><path d="M 367 217 C 437 69, 571 69, 641 217" fill="none" stroke="#227365" stroke-width="5.15" stroke-linecap="round" /><path d="M 367 217 C 437 365, 571 365, 641 217" fill="none" stroke="#227365" stroke-width="5.15" stroke-linecap="round" /><circle cx="93" cy="217" r="7.8" fill="#293b4b" stroke="white" stroke-width="2" /><text x="93.0000" y="270.0000" font-size="36" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#293b4b" text-anchor="middle">A</text><circle cx="367" cy="217" r="7.8" fill="#293b4b" stroke="white" stroke-width="2" /><text x="367.0000" y="270.0000" font-size="36" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#293b4b" text-anchor="middle">B</text><circle cx="641" cy="217" r="7.8" fill="#293b4b" stroke="white" stroke-width="2" /><text x="641.0000" y="270.0000" font-size="36" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#293b4b" text-anchor="middle">C</text></svg>
