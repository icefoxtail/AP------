<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 634" width="742" height="634" role="img" aria-labelledby="title desc"><title id="title">원 위에 표시한 여섯 점</title><desc id="desc">원 위의 여섯 점 A, B, C, D, E, F를 모두 서로 다른 곳에 배치했다. A는 위, D는 아래, B와 C는 왼쪽, E와 F는 오른쪽이다.</desc><rect width="742" height="634" fill="white" /><circle cx="371" cy="313" r="231" fill="none" stroke="#21639a" stroke-width="5.15" /><circle cx="371.0" cy="82.0" r="7.6" fill="#293b4b" stroke="white" stroke-width="1.7" /><text x="371.0000" y="63.0000" font-size="35" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#293b4b" text-anchor="middle">A</text><circle cx="170.94813172579467" cy="197.5" r="7.6" fill="#293b4b" stroke="white" stroke-width="1.7" /><text x="144.9674" y="193.5000" font-size="35" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#293b4b" text-anchor="middle">B</text><circle cx="170.94813172579467" cy="428.5" r="7.6" fill="#293b4b" stroke="white" stroke-width="1.7" /><text x="144.9674" y="454.5000" font-size="35" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#293b4b" text-anchor="middle">C</text><circle cx="371.0" cy="544.0" r="7.6" fill="#293b4b" stroke="white" stroke-width="1.7" /><text x="371.0000" y="585.0000" font-size="35" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#293b4b" text-anchor="middle">D</text><circle cx="571.0518682742054" cy="197.5" r="7.6" fill="#293b4b" stroke="white" stroke-width="1.7" /><text x="597.0326" y="193.5000" font-size="35" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#293b4b" text-anchor="middle">E</text><circle cx="571.0518682742054" cy="428.5" r="7.6" fill="#293b4b" stroke="white" stroke-width="1.7" /><text x="597.0326" y="454.5000" font-size="35" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#293b4b" text-anchor="middle">F</text></svg>
