<svg xmlns="http://www.w3.org/2000/svg" width="520" height="320" viewBox="0 0 520 320" role="img" aria-labelledby="t d">
<title id="t">2021 풍덕중학교 11번 경로 그림</title>
<desc id="d">세 지점 A, B, C가 한 줄로 이어져 있고, A와 B 사이 및 B와 C 사이에 각각 세 개의 인쇄 경로가 있다. 학생이 그린 바깥 루프와 교차선은 포함하지 않았다.</desc>
<rect width="520" height="320" fill="#fff"/>
<g fill="none" stroke="#202124" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
<path d="M65 160 H255 H455"/>
<path d="M65 160 C105 65 215 65 255 160"/>
<path d="M65 160 C105 245 215 245 255 160"/>
<path d="M255 160 C300 65 410 65 455 160"/>
<path d="M255 160 C300 245 410 245 455 160"/>
</g>
<g fill="#202124"><circle cx="65" cy="160" r="4.5"/><circle cx="255" cy="160" r="4.5"/><circle cx="455" cy="160" r="4.5"/></g>
<g fill="#202124" font-family="Arial, Noto Sans KR, sans-serif" font-size="22" text-anchor="middle"><text x="65" y="195">A</text><text x="255" y="195">B</text><text x="455" y="195">C</text></g>
</svg>