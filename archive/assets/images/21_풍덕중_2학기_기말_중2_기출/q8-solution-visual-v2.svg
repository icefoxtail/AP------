<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 622" width="740" height="622" role="img" aria-labelledby="title desc"><title id="title">만나지 않는 두 오르막 평행선</title><desc id="desc">파란 직선은 주어진 2x−3y−11=0의 그래프다. 청록색 점선은 (0,2)를 지나고 파란 직선과 나란하다.</desc><rect width="740" height="622" fill="white" /><line x1="95.0000" y1="328.8205" x2="632.0000" y2="328.8205" stroke="#586574" stroke-width="2.05" stroke-linecap="round" /><polygon points="645.0000,328.8205 632.0000,323.6205 632.0000,334.0205" fill="#586574" /><line x1="373.1132" y1="556.0000" x2="373.1132" y2="126.0000" stroke="#586574" stroke-width="2.05" stroke-linecap="round" /><polygon points="373.1132,113.0000 367.9132,126.0000 378.3132,126.0000" fill="#586574" /><line x1="175.6342" y1="550.7522" x2="634.9319" y2="311.3504" stroke="#21639a" stroke-width="7.4" stroke-linecap="round" /><line x1="106.5500" y1="402.8540" x2="633.4500" y2="128.2156" stroke="#227365" stroke-width="7.25" stroke-linecap="round" stroke-dasharray="13 7" /><circle cx="373.1132075471698" cy="263.91208791208794" r="7.7" fill="#227365" stroke="white" stroke-width="2" /><line x1="48.0000" y1="39.0000" x2="93.0000" y2="39.0000" stroke="#21639a" stroke-width="5.65" stroke-linecap="round" /><text x="104.0000" y="46.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#21639a" text-anchor="start">2x − 3y − 11 = 0</text><line x1="412.0000" y1="39.0000" x2="457.0000" y2="39.0000" stroke="#227365" stroke-width="5.65" stroke-linecap="round" stroke-dasharray="13 7" /><text x="468.0000" y="46.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#227365" text-anchor="start">(0, 2)를 지나는 선</text><text x="661.000" y="315.821" fill="#586574" font-size="32" font-weight="600" font-family="Malgun Gothic, Cambria Math, sans-serif" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="4.0" stroke-linejoin="round">x</text><text x="392.113" y="108.000" fill="#586574" font-size="32" font-weight="600" font-family="Malgun Gothic, Cambria Math, sans-serif" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="4.0" stroke-linejoin="round">y</text><text x="349.113" y="361.821" fill="#586574" font-size="32" font-weight="600" font-family="Malgun Gothic, Cambria Math, sans-serif" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="4.0" stroke-linejoin="round">O</text><text x="305.113" y="245.912" fill="#227365" font-size="32" font-weight="600" font-family="Malgun Gothic, Cambria Math, sans-serif" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="4.0" stroke-linejoin="round">(0, 2)</text></svg>
