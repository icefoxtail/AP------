  <text class="title" x="32.000" y="28.000">22 효천고 5번 방향극한과 함숫값</text>
  <text class="small" x="32.000" y="47.000">x=1의 우극한 −2, x=3의 좌극한 2, f(5)=2를 그래프에서 읽는다</text>
  <g aria-label="graph"><rect class="panel" x="32" y="65" width="342" height="296" rx="8"/><g clip-path="url(#graph-clip)"><line class="axis" x1="52.000" y1="222.000" x2="352.000" y2="222.000" marker-end="url(#axis-arrow)"/><line class="axis" x1="100.000" y1="346.000" x2="100.000" y2="82.000" marker-end="url(#axis-arrow)"/><polyline class="curve" points="52.000,162.000 250.000,162.000"/><polyline class="curve" points="150.000,282.000 250.000,162.000 350.000,162.000"/><line class="guide" x1="150.000" y1="282.000" x2="150.000" y2="222.000"/><line class="guide" x1="250.000" y1="162.000" x2="250.000" y2="222.000"/><line class="guide" x1="350.000" y1="162.000" x2="350.000" y2="222.000"/><circle class="open" cx="150.000" cy="282.000" r="4.60"/><circle class="closed" cx="250.000" cy="162.000" r="4.00"/><circle class="closed" cx="350.000" cy="162.000" r="4.00"/><text class="label" x="142.000" y="246.000">1</text><text class="label" x="242.000" y="246.000">3</text><text class="label" x="342.000" y="246.000">5</text><text class="math" x="354.000" y="227.000">x</text><text class="math" x="106.000" y="88.000">y</text></g></g>
  <g aria-label="calculation"><rect class="panel" x="392" y="65" width="216" height="296" rx="8"/><text class="title" x="410.000" y="92.000">계산</text><text class="math" x="410.000" y="132.000">lim x→1+ f(x)=−2</text><text class="math" x="410.000" y="166.000">lim x→3− f(x)=2</text><text class="math" x="410.000" y="200.000">f(5)=2</text><text class="math" x="410.000" y="234.000">−2+2+2=2</text><text class="label" x="410.000" y="268.000">정답: ②</text></g>
