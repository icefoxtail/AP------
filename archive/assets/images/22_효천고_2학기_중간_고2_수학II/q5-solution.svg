<svg xmlns="http://www.w3.org/2000/svg" width="640" height="390" viewBox="0 0 640 390" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc">
  <title id="title">22 효천고 5번 방향극한과 함숫값 해설</title>
  <desc id="desc">x=1의 우극한 −2, x=3의 좌극한 2, f(5)=2를 그래프에서 읽는다</desc>
  <style>.background{fill:#fff}.axis{stroke:#171717;stroke-width:1.4;fill:none;stroke-linecap:round;stroke-linejoin:round}.curve{stroke:#111;stroke-width:2.1;fill:none;stroke-linecap:round;stroke-linejoin:round}.guide{stroke:#777;stroke-width:.95;stroke-dasharray:4 4;fill:none}.open{stroke:#111;stroke-width:1.4;fill:#fff}.closed{stroke:#111;stroke-width:1;fill:#111}.panel{fill:#f7f8fa;stroke:#c7cbd1;stroke-width:1}.title{font-family:"Noto Sans KR","Pretendard","Malgun Gothic",sans-serif;font-size:15px;font-weight:700;fill:#111}.label{font-family:"Noto Sans KR","Pretendard","Malgun Gothic",sans-serif;font-size:12px;fill:#222}.small{font-family:"Noto Sans KR","Pretendard","Malgun Gothic",sans-serif;font-size:11px;fill:#333}.math{font-family:"STIX Two Math","Cambria Math","Times New Roman",serif;font-size:13px;fill:#111}</style>
  <defs><marker id="axis-arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L6,3 L0,6 Z" fill="#171717"/></marker></defs>
  <rect class="background" x="0" y="0" width="640" height="390"/><text class="title" x="32" y="28">q5  방향극한과 함숫값</text><text class="small" x="32" y="47">접근 방향은 열린 점과 선분의 끝으로, f(5)는 채운 점으로 읽는다.</text>
  <g aria-label="graph"><rect class="panel" x="32" y="65" width="342" height="238" rx="8"/><line class="axis" x1="52" y1="222" x2="352" y2="222" marker-end="url(#axis-arrow)"/><line class="axis" x1="190" y1="280" x2="190" y2="82" marker-end="url(#axis-arrow)"/><path class="curve" d="M54 154 L130 154 L174 264 L250 154 L338 154"/><circle class="open" cx="130" cy="264" r="4.6"/><circle class="closed" cx="250" cy="154" r="4"/><circle class="closed" cx="330" cy="154" r="4"/><line class="guide" x1="130" y1="264" x2="130" y2="222"/><line class="guide" x1="250" y1="154" x2="250" y2="222"/><line class="guide" x1="330" y1="154" x2="330" y2="222"/><text class="label" x="122" y="246">1</text><text class="label" x="242" y="246">3</text><text class="label" x="322" y="246">5</text><text class="math" x="354" y="227">x</text><text class="math" x="196" y="88">y</text><text class="small" x="52" y="292">x→1+: −2</text><text class="small" x="182" y="292">x→3−: 2</text><text class="small" x="288" y="292">f(5)=2</text></g>
  <g aria-label="calculation"><rect class="panel" x="392" y="65" width="216" height="238" rx="8"/><text class="title" x="410" y="92">합 계산</text><text class="math" x="410" y="132">lim x→1+ f(x)=−2</text><text class="math" x="410" y="168">lim x→3− f(x)=2</text><text class="math" x="410" y="204">f(5)=2</text><line class="guide" x1="410" y1="220" x2="590" y2="220"/><text class="label" x="410" y="260">−2+2+2=2</text><text class="label" x="410" y="288">정답: ②</text></g>
  <rect class="panel" x="32" y="322" width="576" height="38" rx="7"/><text class="small" x="50" y="346">x=1에서는 오른쪽 branch, x=3에서는 왼쪽 branch, x=5에서는 채운 점의 높이를 사용한다.</text>
</svg>
