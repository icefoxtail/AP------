<svg xmlns="http://www.w3.org/2000/svg" width="640" height="390" viewBox="0 0 640 390" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc">
  <title id="title">22 효천고 13번 미분계수 정의 오류 해설</title>
  <desc id="desc">f(1)=2를 반영한 올바른 미분계수 분자와 전개를 비교한다</desc>
  <style>.background{fill:#fff}.panel{fill:#f7f8fa;stroke:#c7cbd1;stroke-width:1}.correct{stroke:#356a9a;stroke-width:1.8;fill:none}.bad{stroke:#b23a48;stroke-width:2;fill:none}.title{font-family:"Noto Sans KR","Pretendard","Malgun Gothic",sans-serif;font-size:15px;font-weight:700;fill:#111}.label{font-family:"Noto Sans KR","Pretendard","Malgun Gothic",sans-serif;font-size:12px;fill:#222}.small{font-family:"Noto Sans KR","Pretendard","Malgun Gothic",sans-serif;font-size:11px;fill:#333}.math{font-family:"STIX Two Math","Cambria Math","Times New Roman",serif;font-size:14px;fill:#111}</style>
  <rect class="background" x="0" y="0" width="640" height="390"/><text class="title" x="32" y="28">q13  미분계수 정의의 오기</text><text class="small" x="32" y="47">f(1)=2이므로 분자에서 빼야 할 값은 1이 아니라 2이다.</text>
  <g aria-label="definition-flow"><rect class="panel" x="32" y="65" width="576" height="230" rx="8"/><text class="label" x="54" y="98">함수</text><text class="math" x="54" y="128">f(x)=x²+x,  f(1)=2</text><path class="correct" d="M54 150 L554 150"/><text class="label" x="54" y="184">올바른 정의</text><text class="math" x="54" y="216">f′(1)=lim  { f(1+Δx)−f(1) } / Δx</text><text class="math" x="54" y="252">= lim  { (1+Δx)²+(1+Δx)−2 } / Δx</text><text class="math" x="54" y="282">= lim  { Δx²+3Δx } / Δx =3</text><path class="bad" d="M374 202 L554 202 M374 238 L554 238"/><text class="bad" x="374" y="188">−1 표기는 오류</text><text class="bad" x="374" y="224">f(1)=2를 빼야 함</text></g>
  <rect class="panel" x="32" y="314" width="576" height="44" rx="7"/><text class="small" x="50" y="340">두 번째 등식의 −1만 잘못되었고, 정답은 ②이다.</text>
</svg>
