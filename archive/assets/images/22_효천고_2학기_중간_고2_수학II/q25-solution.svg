<svg xmlns="http://www.w3.org/2000/svg" width="640" height="470" viewBox="0 0 640 470" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc">
  <title id="title">22 효천고 25번 절댓값 합성함수 해설</title>
  <desc id="desc">h=|f|+cx의 근과 h(3)=−270으로 계수를 정해 h(13)=1690을 계산한다</desc>
  <style>.background{fill:#fff}.axis{stroke:#171717;stroke-width:1.3;fill:none;stroke-linecap:round;stroke-linejoin:round}.curve{stroke:#111;stroke-width:2.1;fill:none;stroke-linecap:round;stroke-linejoin:round}.guide{stroke:#777;stroke-width:.95;stroke-dasharray:4 4;fill:none}.point{stroke:#111;stroke-width:1;fill:#111}.accent{stroke:#b23a48;stroke-width:1.9;fill:none}.panel{fill:#f7f8fa;stroke:#c7cbd1;stroke-width:1}.title{font-family:"Noto Sans KR","Pretendard","Malgun Gothic",sans-serif;font-size:15px;font-weight:700;fill:#111}.label{font-family:"Noto Sans KR","Pretendard","Malgun Gothic",sans-serif;font-size:12px;fill:#222}.small{font-family:"Noto Sans KR","Pretendard","Malgun Gothic",sans-serif;font-size:11px;fill:#333}.math{font-family:"STIX Two Math","Cambria Math","Times New Roman",serif;font-size:13px;fill:#111}</style>
  <defs><marker id="axis-arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L6,3 L0,6 Z" fill="#171717"/></marker></defs>
  <rect class="background" x="0" y="0" width="640" height="470"/><text class="title" x="32" y="28">q25  |f(x)|와 접선 조건</text><text class="small" x="32" y="47">h(x)=|f(x)|+cx의 영점 구조와 h(3)을 연결한다.</text>
  <g aria-label="root-graph"><rect class="panel" x="32" y="65" width="342" height="286" rx="8"/><line class="axis" x1="52" y1="248" x2="350" y2="248" marker-end="url(#axis-arrow)"/><line class="axis" x1="98" y1="330" x2="98" y2="82" marker-end="url(#axis-arrow)"/><path class="curve" d="M58 296 C88 270 116 248 148 248 C182 248 206 196 232 166 C260 196 284 248 316 248 C330 248 340 232 350 212"/><path class="accent" d="M98 248 L350 176"/><circle class="point" cx="98" cy="248" r="4"/><circle class="point" cx="196" cy="248" r="4"/><circle class="point" cx="294" cy="248" r="4"/><line class="guide" x1="196" y1="248" x2="196" y2="278"/><text class="label" x="92" y="272">0</text><text class="label" x="190" y="272">k=6</text><text class="label" x="286" y="272">12</text><text class="math" x="354" y="254">x</text><text class="math" x="104" y="88">h</text><text class="small" x="52" y="316">h(3)=−270,  최대 근=12</text></g>
  <g aria-label="calculation"><rect class="panel" x="392" y="65" width="216" height="286" rx="8"/><text class="title" x="410" y="92">계수와 값</text><text class="math" x="410" y="130">g(x)=cx</text><text class="math" x="410" y="166">k=6, 2k=12</text><text class="math" x="410" y="202">a=−10, b=120</text><text class="math" x="410" y="238">c=−180</text><text class="math" x="410" y="274">h(13)=1690</text><text class="label" x="410" y="322">정답: 1690</text></g>
  <rect class="panel" x="32" y="368" width="576" height="42" rx="7"/><text class="small" x="50" y="394">조건 (가)의 비영점 중근은 k=6, 가장 큰 영점 12=2k이며 h(3)으로 a를 결정한다.</text>
</svg>
