<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc">
  <title id="title">22 효천고 7번 증감표 오류 해설</title>
  <desc id="desc">f′=6x(x+1)의 부호와 f(−1)=0, f(0)=−1을 증감표에 채운다</desc>
  <style>.background{fill:#fff}.axis{stroke:#171717;stroke-width:1.4;fill:none;stroke-linecap:round;stroke-linejoin:round}.curve{stroke:#111;stroke-width:2.1;fill:none;stroke-linecap:round;stroke-linejoin:round}.panel{fill:#f7f8fa;stroke:#c7cbd1;stroke-width:1}.bad{stroke:#b23a48;stroke-width:2;fill:none}.title{font-family:"Noto Sans KR","Pretendard","Malgun Gothic",sans-serif;font-size:15px;font-weight:700;fill:#111}.label{font-family:"Noto Sans KR","Pretendard","Malgun Gothic",sans-serif;font-size:12px;fill:#222}.small{font-family:"Noto Sans KR","Pretendard","Malgun Gothic",sans-serif;font-size:11px;fill:#333}.math{font-family:"STIX Two Math","Cambria Math","Times New Roman",serif;font-size:13px;fill:#111}</style>
  <rect class="background" x="0" y="0" width="640" height="420"/><text class="title" x="32" y="28">q7  증감표의 빈칸 판정</text><text class="small" x="32" y="47">도함수의 영점과 부호를 먼저 채우고 각 극점의 함숫값을 대입한다.</text>
  <g aria-label="sign-table"><rect class="panel" x="32" y="65" width="576" height="220" rx="8"/><text class="label" x="52" y="98">x</text><text class="math" x="142" y="98">x&lt;−1</text><text class="math" x="274" y="98">−1</text><text class="math" x="378" y="98">−1&lt;x&lt;0</text><text class="math" x="506" y="98">0</text><line x1="52" y1="112" x2="588" y2="112" stroke="#c7cbd1"/><text class="label" x="52" y="146">f′(x)</text><text class="math" x="154" y="146">+</text><text class="math" x="278" y="146">0</text><text class="math" x="392" y="146">−</text><text class="math" x="510" y="146">0</text><text class="label" x="52" y="190">f(x)</text><path class="curve" d="M142 178 L270 142"/><path class="curve" d="M286 142 L390 190"/><path class="curve" d="M410 190 L510 154"/><text class="math" x="255" y="224">f(−1)=0</text><text class="math" x="480" y="224">f(0)=−1</text><text class="bad" x="200" y="260">②의 값은 1이 아니라 f′(−1)=0</text></g>
  <g aria-label="calculation"><rect class="panel" x="32" y="304" width="576" height="58" rx="8"/><text class="math" x="52" y="330">f′(x)=6x(x+1),  f(−1)=0,  f(0)=−1</text><text class="label" x="52" y="351">따라서 틀린 항목은 ②이다.</text></g>
  <rect class="panel" x="32" y="380" width="576" height="24" rx="6"/><text class="small" x="50" y="397">부호표의 0은 도함수의 값이고, 극점의 높이는 원함수에 직접 대입한다.</text>
</svg>
