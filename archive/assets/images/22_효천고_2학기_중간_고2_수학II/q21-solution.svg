<svg xmlns="http://www.w3.org/2000/svg" width="640" height="470" viewBox="0 0 640 470" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc">
  <title id="title">22 효천고 21번 합성 극한과 대칭 해설</title>
  <desc id="desc">x=2 대칭으로 복원한 그래프에서 양쪽 합성 극한이 같은 정수 0,1,2를 찾는다</desc>
  <style>.background{fill:#fff}.axis{stroke:#171717;stroke-width:1.2;fill:none;stroke-linecap:round;stroke-linejoin:round}.curve{stroke:#111;stroke-width:1.9;fill:none;stroke-linecap:round;stroke-linejoin:round}.guide{stroke:#777;stroke-width:.95;stroke-dasharray:4 4;fill:none}.point{stroke:#111;stroke-width:1;fill:#111}.panel{fill:#f7f8fa;stroke:#c7cbd1;stroke-width:1}.equal{fill:#356a9a}.unequal{fill:#b23a48}.title{font-family:"Noto Sans KR","Pretendard","Malgun Gothic",sans-serif;font-size:15px;font-weight:700;fill:#111}.label{font-family:"Noto Sans KR","Pretendard","Malgun Gothic",sans-serif;font-size:12px;fill:#222}.small{font-family:"Noto Sans KR","Pretendard","Malgun Gothic",sans-serif;font-size:11px;fill:#333}.math{font-family:"STIX Two Math","Cambria Math","Times New Roman",serif;font-size:13px;fill:#111}</style>
  <rect class="background" x="0" y="0" width="640" height="470"/><text class="title" x="32" y="28">q21  합성 극한과 x=2 대칭</text><text class="small" x="32" y="47">안쪽 함수의 한쪽 접근값과 바깥 함수의 그래프를 정수별로 대입한다.</text>
  <g aria-label="mapping"><rect class="panel" x="32" y="65" width="342" height="270" rx="8"/><line class="axis" x1="52" y1="198" x2="352" y2="198"/><line class="axis" x1="202" y1="310" x2="202" y2="82"/><path class="curve" d="M54 260 L112 198 L150 130 L202 174 L250 130 L292 198 L350 260"/><line class="guide" x1="202" y1="88" x2="202" y2="300"/><text class="label" x="194" y="104">x=2</text><circle class="point" cx="112" cy="198" r="4"/><circle class="point" cx="150" cy="130" r="4"/><circle class="point" cx="202" cy="174" r="4"/><circle class="point" cx="250" cy="130" r="4"/><circle class="point" cx="292" cy="198" r="4"/><text class="label" x="102" y="220">−1</text><text class="label" x="142" y="120">0</text><text class="label" x="194" y="220">2</text><text class="label" x="244" y="120">4</text><text class="label" x="284" y="220">5</text></g>
  <g aria-label="count-table"><rect class="panel" x="392" y="65" width="216" height="270" rx="8"/><text class="title" x="410" y="92">a별 L=R</text><text class="equal math" x="410" y="130">a=0  같음</text><text class="equal math" x="410" y="166">a=1  같음</text><text class="equal math" x="410" y="202">a=2  같음</text><text class="unequal math" x="410" y="238">a=−1,3,4,5  다름</text><line class="guide" x1="410" y1="254" x2="590" y2="254"/><text class="label" x="410" y="292">개수 =3  정답: ③</text></g>
  <rect class="panel" x="32" y="356" width="576" height="76" rx="8"/><text class="small" x="50" y="382">x→a−에서 f(g(x)), x→a+에서 g(f(x))를 각각 계산한다.</text><text class="small" x="50" y="408">특히 a=3,4,5에서는 대칭으로 복원된 오른쪽 그래프 때문에 두 값이 어긋난다.</text>
</svg>
