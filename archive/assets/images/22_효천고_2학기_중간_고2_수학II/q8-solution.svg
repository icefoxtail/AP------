<svg xmlns="http://www.w3.org/2000/svg" width="640" height="390" viewBox="0 0 640 390" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc">
  <title id="title">22 효천고 8번 접선 방정식 해설</title>
  <desc id="desc">y=x³−2x²+1의 점 (1,0)에서 기울기 −1인 접선을 세운다</desc>
  <style>.background{fill:#fff}.axis{stroke:#171717;stroke-width:1.4;fill:none;stroke-linecap:round;stroke-linejoin:round}.curve{stroke:#111;stroke-width:2.1;fill:none;stroke-linecap:round;stroke-linejoin:round}.tangent{stroke:#b23a48;stroke-width:2;fill:none;stroke-linecap:round}.guide{stroke:#777;stroke-width:.95;stroke-dasharray:4 4;fill:none}.point{stroke:#111;stroke-width:1;fill:#111}.panel{fill:#f7f8fa;stroke:#c7cbd1;stroke-width:1}.title{font-family:"Noto Sans KR","Pretendard","Malgun Gothic",sans-serif;font-size:15px;font-weight:700;fill:#111}.label{font-family:"Noto Sans KR","Pretendard","Malgun Gothic",sans-serif;font-size:12px;fill:#222}.small{font-family:"Noto Sans KR","Pretendard","Malgun Gothic",sans-serif;font-size:11px;fill:#333}.math{font-family:"STIX Two Math","Cambria Math","Times New Roman",serif;font-size:13px;fill:#111}</style>
  <defs><marker id="axis-arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L6,3 L0,6 Z" fill="#171717"/></marker></defs>
  <rect class="background" x="0" y="0" width="640" height="390"/><text class="title" x="32" y="28">q8  접선의 방정식</text><text class="small" x="32" y="47">점 (1,a)의 함숫값과 도함수값을 차례로 접선에 넣는다.</text>
  <g aria-label="graph"><rect class="panel" x="32" y="65" width="330" height="236" rx="8"/><line class="axis" x1="52" y1="230" x2="340" y2="230" marker-end="url(#axis-arrow)"/><line class="axis" x1="170" y1="280" x2="170" y2="82" marker-end="url(#axis-arrow)"/><path class="curve" d="M54 286 C90 230 112 192 148 194 C185 196 202 238 230 254 C270 276 305 218 340 114"/><path class="tangent" d="M70 132 L310 292"/><circle class="point" cx="202" cy="230" r="4"/><line class="guide" x1="202" y1="230" x2="202" y2="255"/><text class="label" x="208" y="226">(1,0)</text><text class="label" x="268" y="286">y=−x+1</text><text class="math" x="342" y="235">x</text><text class="math" x="176" y="88">y</text></g>
  <g aria-label="calculation"><rect class="panel" x="380" y="65" width="228" height="236" rx="8"/><text class="title" x="398" y="92">계산</text><text class="math" x="398" y="132">a=f(1)=0</text><text class="math" x="398" y="168">m=f′(1)=−1</text><text class="math" x="398" y="204">y=−(x−1)</text><text class="math" x="398" y="240">n=1</text><text class="label" x="398" y="278">a+m+n=0  정답: ③</text></g>
  <rect class="panel" x="32" y="320" width="576" height="38" rx="7"/><text class="small" x="50" y="344">접점 (1,0)과 기울기 −1이 같은 직선 y=−x+1에 반영된다.</text>
</svg>
