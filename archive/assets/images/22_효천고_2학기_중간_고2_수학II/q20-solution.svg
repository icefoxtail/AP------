<svg xmlns="http://www.w3.org/2000/svg" width="640" height="430" viewBox="0 0 640 430" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc">
  <title id="title">22 효천고 20번 접선 y절편 함수의 미분가능성 해설</title>
  <desc id="desc">g(t)=−2t³+t²와 t≥1에서 −4t+3을 t=1에서 접합한다</desc>
  <style>.background{fill:#fff}.axis{stroke:#171717;stroke-width:1.4;fill:none;stroke-linecap:round;stroke-linejoin:round}.curve{stroke:#111;stroke-width:2.1;fill:none;stroke-linecap:round;stroke-linejoin:round}.line{stroke:#b23a48;stroke-width:2;fill:none;stroke-linecap:round}.guide{stroke:#777;stroke-width:.95;stroke-dasharray:4 4;fill:none}.point{stroke:#111;stroke-width:1;fill:#111}.panel{fill:#f7f8fa;stroke:#c7cbd1;stroke-width:1}.title{font-family:"Noto Sans KR","Pretendard","Malgun Gothic",sans-serif;font-size:15px;font-weight:700;fill:#111}.label{font-family:"Noto Sans KR","Pretendard","Malgun Gothic",sans-serif;font-size:12px;fill:#222}.small{font-family:"Noto Sans KR","Pretendard","Malgun Gothic",sans-serif;font-size:11px;fill:#333}.math{font-family:"STIX Two Math","Cambria Math","Times New Roman",serif;font-size:13px;fill:#111}</style>
  <defs><marker id="axis-arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L6,3 L0,6 Z" fill="#171717"/></marker></defs>
  <rect class="background" x="0" y="0" width="640" height="430"/><text class="title" x="32" y="28">q20  접선 y절편의 접합</text><text class="small" x="32" y="47">왼쪽의 접선 y절편 함수와 오른쪽 일차식을 값·기울기 모두 맞춘다.</text>
  <g aria-label="graph"><rect class="panel" x="32" y="65" width="342" height="278" rx="8"/><line class="axis" x1="52" y1="250" x2="352" y2="250" marker-end="url(#axis-arrow)"/><line class="axis" x1="190" y1="320" x2="190" y2="82" marker-end="url(#axis-arrow)"/><path class="curve" d="M56 110 C92 132 132 188 164 230 C178 248 190 260 202 260"/><path class="line" d="M202 260 L350 310"/><circle class="point" cx="202" cy="260" r="4"/><line class="guide" x1="202" y1="260" x2="202" y2="250"/><text class="label" x="194" y="278">t=1</text><text class="label" x="52" y="104">g(t)=−2t³+t²</text><text class="label" x="252" y="302">at+b=−4t+3</text><text class="math" x="354" y="256">t</text><text class="math" x="196" y="88">g</text></g>
  <g aria-label="calculation"><rect class="panel" x="392" y="65" width="216" height="278" rx="8"/><text class="title" x="410" y="92">값·기울기</text><text class="math" x="410" y="132">g(1)=−1</text><text class="math" x="410" y="168">g′(1)=−4</text><text class="math" x="410" y="204">a=−4</text><text class="math" x="410" y="240">a+b=−1</text><text class="math" x="410" y="276">b=3</text><text class="label" x="410" y="318">ab=−12  정답: ⑤</text></g>
  <rect class="panel" x="32" y="364" width="576" height="38" rx="7"/><text class="small" x="50" y="388">t=1에서 함수값과 도함수값을 동시에 일치시켜 전체 미분가능성을 닫는다.</text>
</svg>
