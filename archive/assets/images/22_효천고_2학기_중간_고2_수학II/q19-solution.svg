<svg xmlns="http://www.w3.org/2000/svg" width="640" height="430" viewBox="0 0 640 430" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc">
  <title id="title">22 효천고 19번 함수와 직선의 위치 해설</title>
  <desc id="desc">0과 1에서 y=x와 만나고 a에서는 아래, b에서는 위인 곡선의 기울기를 비교한다</desc>
  <style>.background{fill:#fff}.axis{stroke:#171717;stroke-width:1.4;fill:none;stroke-linecap:round;stroke-linejoin:round}.curve{stroke:#111;stroke-width:2.1;fill:none;stroke-linecap:round;stroke-linejoin:round}.line{stroke:#356a9a;stroke-width:1.8;fill:none;stroke-linecap:round}.tangent{stroke:#b23a48;stroke-width:1.9;fill:none;stroke-linecap:round}.guide{stroke:#777;stroke-width:.95;stroke-dasharray:4 4;fill:none}.point{stroke:#111;stroke-width:1;fill:#111}.panel{fill:#f7f8fa;stroke:#c7cbd1;stroke-width:1}.title{font-family:"Noto Sans KR","Pretendard","Malgun Gothic",sans-serif;font-size:15px;font-weight:700;fill:#111}.label{font-family:"Noto Sans KR","Pretendard","Malgun Gothic",sans-serif;font-size:12px;fill:#222}.small{font-family:"Noto Sans KR","Pretendard","Malgun Gothic",sans-serif;font-size:11px;fill:#333}.math{font-family:"STIX Two Math","Cambria Math","Times New Roman",serif;font-size:13px;fill:#111}</style>
  <defs><marker id="axis-arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L6,3 L0,6 Z" fill="#171717"/></marker></defs>
  <rect class="background" x="0" y="0" width="640" height="430"/><text class="title" x="32" y="28">q19  f와 y=x의 위치 비교</text><text class="small" x="32" y="47">교점 사이의 위·아래 관계와 접선 기울기를 각각 읽는다.</text>
  <g aria-label="graph"><rect class="panel" x="32" y="65" width="342" height="278" rx="8"/><line class="axis" x1="52" y1="282" x2="352" y2="282" marker-end="url(#axis-arrow)"/><line class="axis" x1="80" y1="320" x2="80" y2="82" marker-end="url(#axis-arrow)"/><path class="line" d="M54 306 L348 108"/><path class="curve" d="M56 318 C104 318 126 270 158 238 C190 206 216 196 242 184 C274 170 300 150 348 96"/><path class="tangent" d="M286 166 L348 108"/><circle class="point" cx="80" cy="282" r="4"/><circle class="point" cx="188" cy="210" r="4"/><circle class="point" cx="294" cy="138" r="4"/><line class="guide" x1="188" y1="210" x2="188" y2="282"/><line class="guide" x1="294" y1="138" x2="294" y2="282"/><text class="label" x="72" y="300">0</text><text class="label" x="180" y="300">1</text><text class="label" x="288" y="300">b</text><text class="label" x="148" y="232">a: f(a)&lt;a</text><text class="label" x="296" y="128">f(b)&gt;b</text><text class="math" x="354" y="288">x</text><text class="math" x="86" y="88">y</text></g>
  <g aria-label="decision"><rect class="panel" x="392" y="65" width="216" height="278" rx="8"/><text class="title" x="410" y="92">판정</text><text class="math" x="410" y="132">f(b)−f(a)&gt;b−a</text><text class="math" x="410" y="168">f(a)/a&lt;f(b)/b</text><text class="math" x="410" y="204">f′(b)&gt;1</text><text class="math" x="410" y="240">MVT: f′(c)=1</text><line class="guide" x1="410" y1="256" x2="590" y2="256"/><text class="label" x="410" y="294">ㄱㄴㄷㄹ 참, ㅁ 거짓</text><text class="label" x="410" y="326">정답: ②</text></g>
  <rect class="panel" x="32" y="364" width="576" height="38" rx="7"/><text class="small" x="50" y="388">a 구간의 곡률로는 항상 f(a)&lt;af′(a)를 보장할 수 없으므로 ㅁ은 거짓이다.</text>
</svg>
