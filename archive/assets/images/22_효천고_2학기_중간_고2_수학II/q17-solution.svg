<svg xmlns="http://www.w3.org/2000/svg" width="640" height="430" viewBox="0 0 640 430" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc">
  <title id="title">22 효천고 17번 도함수 부호와 극값 해설</title>
  <desc id="desc">f′의 부호가 x=−4에서 양에서 음, x=0에서 음에서 양으로 바뀌고 x=4는 중근이다</desc>
  <style>.background{fill:#fff}.axis{stroke:#171717;stroke-width:1.4;fill:none;stroke-linecap:round;stroke-linejoin:round}.curve{stroke:#111;stroke-width:2.1;fill:none;stroke-linecap:round;stroke-linejoin:round}.guide{stroke:#777;stroke-width:.95;stroke-dasharray:4 4;fill:none}.point{stroke:#111;stroke-width:1;fill:#111}.panel{fill:#f7f8fa;stroke:#c7cbd1;stroke-width:1}.title{font-family:"Noto Sans KR","Pretendard","Malgun Gothic",sans-serif;font-size:15px;font-weight:700;fill:#111}.label{font-family:"Noto Sans KR","Pretendard","Malgun Gothic",sans-serif;font-size:12px;fill:#222}.small{font-family:"Noto Sans KR","Pretendard","Malgun Gothic",sans-serif;font-size:11px;fill:#333}.math{font-family:"STIX Two Math","Cambria Math","Times New Roman",serif;font-size:13px;fill:#111}</style>
  <defs><marker id="axis-arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L6,3 L0,6 Z" fill="#171717"/></marker></defs>
  <rect class="background" x="0" y="0" width="640" height="430"/><text class="title" x="32" y="28">q17  도함수 부호와 극값</text><text class="small" x="32" y="47">영점 자체보다 좌우 부호가 바뀌는지가 극대·극소를 결정한다.</text>
  <g aria-label="derivative-graph"><rect class="panel" x="32" y="65" width="342" height="278" rx="8"/><line class="axis" x1="52" y1="230" x2="352" y2="230" marker-end="url(#axis-arrow)"/><line class="axis" x1="180" y1="310" x2="180" y2="82" marker-end="url(#axis-arrow)"/><path class="curve" d="M54 120 C104 84 142 110 166 230 C190 350 220 230 246 230 C280 230 300 92 350 116"/><circle class="point" cx="166" cy="230" r="4"/><circle class="point" cx="206" cy="230" r="4"/><circle class="point" cx="246" cy="230" r="4"/><line class="guide" x1="166" y1="230" x2="166" y2="258"/><line class="guide" x1="206" y1="230" x2="206" y2="258"/><line class="guide" x1="246" y1="230" x2="246" y2="258"/><text class="label" x="154" y="278">−4</text><text class="label" x="198" y="278">0</text><text class="label" x="240" y="278">4</text><text class="math" x="354" y="236">x</text><text class="math" x="186" y="88">f′</text><text class="small" x="52" y="304">+   −   +   (4는 부호 유지)</text></g>
  <g aria-label="decision"><rect class="panel" x="392" y="65" width="216" height="278" rx="8"/><text class="title" x="410" y="92">판정</text><text class="math" x="410" y="132">−4: +→−</text><text class="math" x="410" y="168">0: −→+</text><text class="math" x="410" y="204">4: +→+</text><line class="guide" x1="410" y1="222" x2="590" y2="222"/><text class="label" x="410" y="258">극값은 −4, 0의 2개</text><text class="label" x="410" y="294">ㄱ, ㄴ만 참</text><text class="label" x="410" y="326">정답: ①</text></g>
  <rect class="panel" x="32" y="364" width="576" height="38" rx="7"/><text class="small" x="50" y="388">x=4는 f′=0이지만 부호가 유지되므로 극값이 아니며, 넓이 대칭으로 최댓값도 −4에서 고정되지 않는다.</text>
</svg>
