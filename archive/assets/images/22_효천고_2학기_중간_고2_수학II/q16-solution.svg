<svg xmlns="http://www.w3.org/2000/svg" width="640" height="470" viewBox="0 0 640 470" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc">
  <title id="title">22 효천고 16번 도함수 그래프 후보 해설</title>
  <desc id="desc">극솟값과 최솟값이 같은 함수의 도함수 그래프로 가능한 ①과 ④를 판정한다</desc>
  <style>.background{fill:#fff}.axis{stroke:#171717;stroke-width:1.2;fill:none;stroke-linecap:round;stroke-linejoin:round}.curve{stroke:#111;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}.ok{stroke:#356a9a;stroke-width:2.3;fill:none}.no{stroke:#b23a48;stroke-width:1.8;fill:none}.panel{fill:#f7f8fa;stroke:#c7cbd1;stroke-width:1}.title{font-family:"Noto Sans KR","Pretendard","Malgun Gothic",sans-serif;font-size:15px;font-weight:700;fill:#111}.label{font-family:"Noto Sans KR","Pretendard","Malgun Gothic",sans-serif;font-size:12px;fill:#222}.small{font-family:"Noto Sans KR","Pretendard","Malgun Gothic",sans-serif;font-size:11px;fill:#333}.math{font-family:"STIX Two Math","Cambria Math","Times New Roman",serif;font-size:13px;fill:#111}</style>
  <rect class="background" x="0" y="0" width="640" height="470"/><text class="title" x="32" y="28">q16  극솟값 = 최솟값 조건</text><text class="small" x="32" y="47">f′의 −→+ 변화가 한 번이고, 적분한 f가 양끝에서 아래로 내려가지 않아야 한다.</text>
  <g aria-label="candidate-graphs"><rect class="panel" x="32" y="65" width="268" height="178" rx="8"/><text class="title" x="50" y="92">① 가능</text><line class="axis" x1="52" y1="178" x2="280" y2="178"/><line class="axis" x1="166" y1="220" x2="166" y2="94"/><path class="ok" d="M54 112 C104 112 130 112 166 178 C202 244 230 178 278 112"/><text class="small" x="50" y="218">f′: −에서 +로 한 번 전환</text><rect class="panel" x="332" y="65" width="276" height="178" rx="8"/><text class="title" x="350" y="92">④ 가능</text><line class="axis" x1="350" y1="178" x2="588" y2="178"/><line class="axis" x1="470" y1="220" x2="470" y2="94"/><path class="ok" d="M352 112 C390 112 422 158 456 178 C480 192 500 178 520 178 C548 178 566 112 588 112"/><text class="small" x="350" y="218">단순근에서 −→+, 중근은 부호 유지</text>
  <rect class="panel" x="32" y="264" width="576" height="112" rx="8"/><text class="title" x="50" y="292">②·③·⑤ 불가</text><path class="no" d="M52 320 L270 320 M336 320 L554 320"/><text class="small" x="50" y="348">f′가 이차식인 ②·③은 f가 삼차식이라 한쪽이 −∞로 가고, ⑤도 양끝에서 최솟값을 갖지 못한다.</text></g>
  <rect class="panel" x="32" y="398" width="576" height="42" rx="7"/><text class="small" x="50" y="424">도함수의 부호 변화와 최고차항의 양끝 거동을 함께 보아 정답은 ①, ④이다.</text>
</svg>
