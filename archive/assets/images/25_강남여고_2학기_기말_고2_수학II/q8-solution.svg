<svg xmlns="http://www.w3.org/2000/svg" width="760" height="620" viewBox="0 0 760 620" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet">
  <title id="title">25_강남여고_2학기_기말_고2_수학II · q8 해설 시각화</title>
  <desc id="desc">문항 8의 원문과 해설 흐름을 source-bound 텍스트 카드로 정리한 SVG</desc>
  <rect width="760" height="620" fill="#fff"/>
  <g font-family="Noto Sans KR, Pretendard, Apple SD Gothic Neo, Malgun Gothic, sans-serif" fill="#111">
    <text x="380" y="32" font-size="21" font-weight="700" text-anchor="middle">25_강남여고_2학기_기말_고2_수학II · q8 해설 시각화</text>
    <text x="380" y="59" font-size="15" text-anchor="middle" fill="#475569">문항 원문과 해설의 핵심 흐름</text>
    <rect x="18" y="82" width="350" height="300" rx="12" fill="#eff6ff" stroke="#93c5fd"/>
    <rect x="390" y="82" width="352" height="300" rx="12" fill="#f0fdf4" stroke="#86efac"/>
    <text x="34" y="112" font-size="17" font-weight="700" fill="#1d4ed8">문항 핵심</text>
    <text x="398" y="112" font-size="17" font-weight="700" fill="#15803d">해설 흐름</text>
    <text x="34" y="140" font-size="15">원점을 출발하여 수직선 위를 움직이는 점 P의</text>
    <text x="34" y="162" font-size="15">시각 t (0≤ t≤ 6)에서의 속도 v(t)의</text>
    <text x="34" y="184" font-size="15">그래프가 그림과 같다. 점 P의 시각 t=0에서</text>
    <text x="34" y="206" font-size="15">t=6까지의 위치의 변화량을 a, 움직인 거리를</text>
    <text x="34" y="228" font-size="15">b라 할 때, a+b의 값은? [3.5점]</text>
    <text x="398" y="140" font-size="14">[키포인트] 위치의 변화량은 부호 있는 넓이,</text>
    <text x="398" y="162" font-size="14">움직인 거리는 절댓값 넓이의 합이다.</text>
    <text x="398" y="184" font-size="14">그래프에서 0≤ t≤4의 음의 넓이는 1 / 2·2·4+1</text>
    <text x="398" y="206" font-size="14">/ 2·2·4=8, 4≤ t≤6의 양의 넓이는 1 / 2·1·2+1</text>
    <text x="398" y="228" font-size="14">/ 2·1·2=2이다. 따라서 a=-8+2=-6,</text>
    <text x="398" y="250" font-size="14">b=8+2=10이므로 a+b=4이다. 따라서 정답은</text>
    <text x="398" y="272" font-size="14">③이다.</text>
    <rect x="18" y="406" width="724" height="48" rx="10" fill="#fff7ed" stroke="#fdba74"/>
    <text x="380" y="436" font-size="17" text-anchor="middle" fill="#9a3412">결론: ③</text>
    <text x="380" y="482" font-size="11" text-anchor="middle" fill="#64748b">25_강남여고_2학기_기말_고2_수학II · q8 · source-bound solution visual</text>
  </g>
</svg>