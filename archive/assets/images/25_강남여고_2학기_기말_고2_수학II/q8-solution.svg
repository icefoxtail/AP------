<svg xmlns="http://www.w3.org/2000/svg" width="760" height="620" viewBox="0 0 760 620" role="img" aria-labelledby="title desc">
  <title id="title">25_강남여고_2학기_기말_고2_수학II · q8 해설 시각화</title>
  <desc id="desc">문항 8의 원문과 해설 흐름을 source-bound 텍스트 카드로 정리한 SVG</desc>
  <rect width="760" height="620" fill="#fff"/>
  <g font-family="Arial, sans-serif" fill="#111">
    <text x="380" y="32" font-size="21" font-weight="700" text-anchor="middle">25_강남여고_2학기_기말_고2_수학II · q8 해설 시각화</text>
    <text x="380" y="59" font-size="15" text-anchor="middle" fill="#475569">적분의 활용 · 속도와 거리</text>
    <rect x="18" y="82" width="350" height="350" rx="12" fill="#eff6ff" stroke="#93c5fd"/>
    <rect x="390" y="82" width="352" height="350" rx="12" fill="#f0fdf4" stroke="#86efac"/>
    <text x="34" y="112" font-size="17" font-weight="700" fill="#1d4ed8">문항 핵심</text>
    <text x="398" y="112" font-size="17" font-weight="700" fill="#15803d">해설 흐름</text>
    <text x="34" y="140" font-size="15">원점을 출발하여 수직선 위를 움직이는 점 P의 시각 t (0\le t\le 6)에서의 속도</text>
    <text x="34" y="162" font-size="15"> v(t)의 그래프가 그림과 같다. 점 P의 시각 t=0에서 t=6까지의 위치의 변화량을 </text>
    <text x="34" y="184" font-size="15">a, 움직인 거리를 b라 할 때, a+b의 값은? [3.5점]</text>
    <text x="398" y="140" font-size="14">[키포인트] 위치의 변화량은 부호 있는 넓이, 움직인 거리는 절댓값 넓이의 합이다.\n그래</text>
    <text x="398" y="162" font-size="14">프에서 0\le t\le4의 음의 넓이는 12·2·4+12·2·4=8, 4\le t\le6</text>
    <text x="398" y="184" font-size="14">의 양의 넓이는 12·1·2+12·1·2=2이다.\n따라서 a=-8+2=-6, b=8+2=</text>
    <text x="398" y="206" font-size="14">10이므로 a+b=4이다.\n따라서 정답은 ③이다.</text>
    <path d="M350 286 L410 286" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="18" y="308" width="724" height="48" rx="10" fill="#fff7ed" stroke="#fdba74"/>
    <text x="380" y="338" font-size="17" text-anchor="middle" fill="#9a3412">정답/결론: ③</text>
    <text x="380" y="383" font-size="13" text-anchor="middle" fill="#64748b">source: archive/exams/original/high/h2/2final/25_강남여고_2학기_기말_고2_수학II.js · q8 · archive/assets/images/25_강남여고_2학기_기말_고2_수학II/q8-solution.svg</text>
  </g>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#64748b"/></marker></defs>
