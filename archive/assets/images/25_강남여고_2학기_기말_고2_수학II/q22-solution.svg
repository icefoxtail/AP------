<svg xmlns="http://www.w3.org/2000/svg" width="760" height="620" viewBox="0 0 760 620" role="img" aria-labelledby="title desc">
  <title id="title">25_강남여고_2학기_기말_고2_수학II · q22 해설 시각화</title>
  <desc id="desc">문항 22의 원문과 해설 흐름을 source-bound 텍스트 카드로 정리한 SVG</desc>
  <rect width="760" height="620" fill="#fff"/>
  <g font-family="Arial, sans-serif" fill="#111">
    <text x="380" y="32" font-size="21" font-weight="700" text-anchor="middle">25_강남여고_2학기_기말_고2_수학II · q22 해설 시각화</text>
    <text x="380" y="59" font-size="15" text-anchor="middle" fill="#475569">접선의 방정식 · 접선의 방정식</text>
    <rect x="18" y="82" width="350" height="350" rx="12" fill="#eff6ff" stroke="#93c5fd"/>
    <rect x="390" y="82" width="352" height="350" rx="12" fill="#f0fdf4" stroke="#86efac"/>
    <text x="34" y="112" font-size="17" font-weight="700" fill="#1d4ed8">문항 핵심</text>
    <text x="398" y="112" font-size="17" font-weight="700" fill="#15803d">해설 흐름</text>
    <text x="34" y="140" font-size="15">서술형1. 곡선 f(x)=-x^2+4x 위의 점 (1,3)에서의 접선의 방정식을 y=ax+</text>
    <text x="34" y="162" font-size="15">b라 할 때, 상수 a, b에 대하여 a^2+b^2의 값을 구하시오. [5점]</text>
    <text x="398" y="140" font-size="14">[키포인트] 접선의 기울기는 해당 점에서의 미분계수이다.\nf'(x)=-2x+4이므로 x=</text>
    <text x="398" y="162" font-size="14">1에서 기울기는 a=2이다. 점 (1,3)을 지나므로 3=2+b에서 b=1이다.\n따라서 </text>
    <text x="398" y="184" font-size="14">a^2+b^2=4+1=5이다.</text>
    <path d="M350 264 L410 264" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="18" y="286" width="724" height="48" rx="10" fill="#fff7ed" stroke="#fdba74"/>
    <text x="380" y="316" font-size="17" text-anchor="middle" fill="#9a3412">정답/결론: 5</text>
    <text x="380" y="361" font-size="13" text-anchor="middle" fill="#64748b">source: archive/exams/original/high/h2/2final/25_강남여고_2학기_기말_고2_수학II.js · q22 · archive/assets/images/25_강남여고_2학기_기말_고2_수학II/q22-solution.svg</text>
  </g>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#64748b"/></marker></defs>
</svg>