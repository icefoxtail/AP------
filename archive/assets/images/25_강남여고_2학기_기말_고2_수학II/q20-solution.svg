<svg xmlns="http://www.w3.org/2000/svg" width="640" height="440" viewBox="0 0 640 440" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet">
  <title id="title">원뿔에 내접한 두 원기둥의 부피 최댓값</title>
  <desc id="desc">닮음으로 z=h(1-r)을 구하고 부피함수의 도함수 부호로 r=2/3에서 최댓값을 확인하는 해설 그림</desc>
  <rect width="640" height="440" fill="#fff"/>
  <g font-family="Arial, sans-serif" fill="#111">
    <text x="320" y="28" font-size="20" text-anchor="middle" font-weight="700">두 원기둥의 부피 합 최댓값</text>
    <g stroke="#1f2937" stroke-width="2" fill="none">
      <path d="M58 342 L160 58 L262 342 Z" fill="#f3f4f6"/>
      <path d="M58 342 Q160 366 262 342" stroke="#6b7280"/>
      <path d="M91 342 L91 226 L160 226 L160 342 Z" fill="#dbeafe"/>
      <path d="M160 342 L160 226 L229 226 L229 342 Z" fill="#bfdbfe"/>
      <path d="M91 226 Q125 213 160 226 Q195 213 229 226" stroke="#2563eb"/>
      <line x1="58" y1="342" x2="262" y2="342" stroke="#111"/>
      <line x1="160" y1="58" x2="160" y2="342" stroke="#9ca3af" stroke-dasharray="5 5"/>
      <line x1="276" y1="342" x2="276" y2="226" stroke="#dc2626"/>
      <line x1="271" y1="342" x2="281" y2="342" stroke="#dc2626"/>
      <line x1="271" y1="226" x2="281" y2="226" stroke="#dc2626"/>
      <line x1="91" y1="365" x2="229" y2="365" stroke="#2563eb"/>
      <line x1="91" y1="360" x2="91" y2="370" stroke="#2563eb"/>
      <line x1="229" y1="360" x2="229" y2="370" stroke="#2563eb"/>
    </g>
    <text x="160" y="412" font-size="16" text-anchor="middle">원뿔 밑면 지름 4, 원기둥 두 개의 반지름 r</text>
    <text x="288" y="286" font-size="16" fill="#dc2626">z</text>
    <text x="160" y="382" font-size="16" text-anchor="middle" fill="#2563eb">4r</text>
    <text x="162" y="80" font-size="15" text-anchor="middle">꼭짓점</text>
    <g transform="translate(330 70)">
      <rect x="0" y="0" width="280" height="300" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
      <text x="140" y="34" font-size="18" text-anchor="middle" font-weight="700">닮음과 부피</text>
      <text x="18" y="75" font-size="17">2r = 2(1 − z/h)</text>
      <text x="18" y="108" font-size="17" fill="#1d4ed8">z = h(1 − r)</text>
      <text x="18" y="153" font-size="17">V = 2πr²z</text>
      <text x="18" y="185" font-size="17" fill="#1d4ed8">V = 2πh r²(1 − r)</text>
      <text x="18" y="230" font-size="17">V′ = 2πh r(2 − 3r)</text>
      <text x="18" y="264" font-size="16" fill="#15803d">증가: 0 &lt; r &lt; 2/3</text>
      <text x="18" y="289" font-size="16" fill="#b91c1c">감소: 2/3 &lt; r &lt; 1</text>
    </g>
  </g>
</svg>
