<svg xmlns="http://www.w3.org/2000/svg" width="480" height="352" viewBox="0 0 480 352" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="ttl20 des20"><title id="ttl20">원뿔과 두 원기둥의 단면</title><desc id="des20">원뿔의 축을 지나는 단면에서 밑면 지름 4, 높이 h, 두 원기둥의 각각 지름 2r, 높이 z, 최적 반지름 r=2/3을 나타낸다.</desc><defs><clipPath id="clip20"><rect x="54" y="56" width="396" height="184"/></clipPath></defs><rect width="480" height="352" fill="#fff"/><g font-family="Arial, Malgun Gothic, Apple SD Gothic Neo, sans-serif"><text x="16.00" y="27.00" font-size="18" fill="#0f172a" text-anchor="start" font-weight="700">20 | 원뿔과 두 원기둥의 단면</text><path d="M209.00,59.00 L65.00,259.00 L353.00,259.00 Z" fill="#f1f5f9" stroke="#475569" stroke-width="2.4" stroke-linejoin="round"/><line x1="209.00" y1="59.00" x2="209.00" y2="259.00" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="5 4"/><rect x="113.00" y="192.33" width="96.00" height="66.67" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><rect x="209.00" y="192.33" width="96.00" height="66.67" fill="#bfdbfe" stroke="#2563eb" stroke-width="2"/><line x1="113.00" y1="192.33" x2="305.00" y2="192.33" stroke="#1d4ed8" stroke-width="2.6" /><rect x="188.00" y="159.00" width="42.00" height="27.00" rx="4" fill="#ffffff"/><text x="209.00" y="180.33" font-size="17" fill="#1d4ed8" text-anchor="middle" font-weight="700">4r</text><text x="161.00" y="227.33" font-size="16" fill="#1d4ed8" text-anchor="middle" font-weight="700">2r</text><text x="257.00" y="227.33" font-size="16" fill="#1d4ed8" text-anchor="middle" font-weight="700">2r</text><text x="209.00" y="280.00" font-size="16" fill="#172b46" text-anchor="middle" >원뿔 밑면 지름 4</text><line x1="379.00" y1="59.00" x2="379.00" y2="259.00" stroke="#64748b" stroke-width="1.5" /><line x1="371.00" y1="59.00" x2="387.00" y2="59.00" stroke="#64748b" stroke-width="1.5" /><line x1="371.00" y1="259.00" x2="387.00" y2="259.00" stroke="#64748b" stroke-width="1.5" /><text x="388.00" y="162.00" font-size="16" fill="#172b46" text-anchor="start" >h</text><line x1="362.00" y1="192.33" x2="362.00" y2="259.00" stroke="#ea580c" stroke-width="2" /><line x1="355.00" y1="192.33" x2="369.00" y2="192.33" stroke="#ea580c" stroke-width="1.5" /><line x1="355.00" y1="259.00" x2="369.00" y2="259.00" stroke="#ea580c" stroke-width="1.5" /><text x="367.00" y="230.67" font-size="16" fill="#c2410c" text-anchor="start" >z</text><text x="18.00" y="308.00" font-size="16" fill="#172b46" text-anchor="start" >닮음: 2r / 2 = (h−z) / h</text><text x="18.00" y="336.00" font-size="16" fill="#1d4ed8" text-anchor="start" font-weight="700">z=h(1−r),  V′=2πhr(2−3r)</text></g></svg>