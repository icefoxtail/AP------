<svg xmlns="http://www.w3.org/2000/svg" width="760" height="620" viewBox="0 0 760 620" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet">
  <title id="title">25_강남여고_2학기_기말_고2_수학II · q10 해설 시각화</title>
  <desc id="desc">문항 10의 원문과 해설 흐름을 source-bound 텍스트 카드로 정리한 SVG</desc>
  <rect width="760" height="620" fill="#fff"/>
  <g font-family="Noto Sans KR, Pretendard, Apple SD Gothic Neo, Malgun Gothic, sans-serif" fill="#111">
    <text x="380" y="32" font-size="21" font-weight="700" text-anchor="middle">25_강남여고_2학기_기말_고2_수학II · q10 해설 시각화</text>
    <text x="380" y="59" font-size="15" text-anchor="middle" fill="#475569">도함수의 활용 · 삼차방정식의 실근</text>
    <rect x="18" y="82" width="350" height="350" rx="12" fill="#eff6ff" stroke="#93c5fd"/>
    <rect x="390" y="82" width="352" height="350" rx="12" fill="#f0fdf4" stroke="#86efac"/>
    <text x="34" y="112" font-size="17" font-weight="700" fill="#1d4ed8">문항 핵심</text>
    <text x="398" y="112" font-size="17" font-weight="700" fill="#15803d">해설 흐름</text>
    <text x="34" y="140" font-size="15">방정식 3x^3-9x-k=0의 서로 다른 실근이 오직 2개가 되도록 하는 모든 실수 k의 </text>
    <text x="34" y="162" font-size="15">값의 합은? [3.5점]</text>
    <text x="398" y="140" font-size="14">[키포인트] 서로 다른 실근이 정확히 2개이면 삼차함수의 극값 중 하나가 x축에 닿는다.\</text>
    <text x="398" y="162" font-size="14">nh(x)=3x^3-9x-k라 하면 h'(x)=9(x^2-1)이므로 극점은 x=-1,1이다</text>
    <text x="398" y="184" font-size="14">.\nh(-1)=6-k, h(1)=-6-k이므로 중근이 생기는 경우는 k=6 또는 k=-6</text>
    <text x="398" y="206" font-size="14">이다.\n그 합은 0이므로 정답은 ⑤이다.</text>
    <path d="M350 286 L410 286" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="18" y="308" width="724" height="48" rx="10" fill="#fff7ed" stroke="#fdba74"/>
    <text x="380" y="338" font-size="17" text-anchor="middle" fill="#9a3412">결론: ⑤</text>
    <text x="380" y="383" font-size="13" text-anchor="middle" fill="#64748b">source: archive/exams/original/high/h2/2final/25_강남여고_2학기_기말_고2_수학II.js · q10 · archive/assets/images/25_강남여고_2학기_기말_고2_수학II/q10-solution.svg</text>
  </g>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#64748b"/></marker></defs>
