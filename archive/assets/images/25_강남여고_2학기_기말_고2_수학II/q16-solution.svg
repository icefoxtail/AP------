<svg xmlns="http://www.w3.org/2000/svg" width="760" height="660" viewBox="0 0 760 660" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet">
  <title id="title">25_강남여고_2학기_기말_고2_수학II · q16 해설 시각화</title>
  <desc id="desc">문항 16의 원문과 해설 흐름을 source-bound 텍스트 카드로 정리한 SVG</desc>
  <rect width="760" height="660" fill="#fff"/>
  <g font-family="Noto Sans KR, Pretendard, Apple SD Gothic Neo, Malgun Gothic, sans-serif" fill="#111">
    <text x="380" y="32" font-size="21" font-weight="700" text-anchor="middle">25_강남여고_2학기_기말_고2_수학II · q16 해설 시각화</text>
    <text x="380" y="59" font-size="15" text-anchor="middle" fill="#475569">문항 원문과 해설의 핵심 흐름</text>
    <rect x="18" y="82" width="350" height="438" rx="12" fill="#eff6ff" stroke="#93c5fd"/>
    <rect x="390" y="82" width="352" height="438" rx="12" fill="#f0fdf4" stroke="#86efac"/>
    <text x="34" y="112" font-size="17" font-weight="700" fill="#1d4ed8">문항 핵심</text>
    <text x="398" y="112" font-size="17" font-weight="700" fill="#15803d">해설 흐름</text>
    <text x="34" y="140" font-size="15">다음 표는 사차함수 f(x)의 증가와 감소를</text>
    <text x="34" y="162" font-size="15">나타낸 것이다. 방정식 f(x)=9이 서로 다른 세</text>
    <text x="34" y="184" font-size="15">실근을 갖도록 상수 a의 값을 정할 때, 모든</text>
    <text x="34" y="206" font-size="15">a의 값의 합은? [4.5점]</text>
    <text x="398" y="140" font-size="14">[키포인트] 증감표의 세 극값과 수평선 y=9의</text>
    <text x="398" y="162" font-size="14">교점 개수를 비교한다. x=-1,1,2에서의</text>
    <text x="398" y="184" font-size="14">함수값은 각각 a-21, a+11, a+6이고,</text>
    <text x="398" y="206" font-size="14">증감표에서 차례로 극소, 극대, 극소이다.</text>
    <text x="398" y="228" font-size="14">y=9가 극값과 같지 않으면 각 단조 구간에서</text>
    <text x="398" y="250" font-size="14">생기는 교점 수가 짝수로 변하므로 서로 다른 세</text>
    <text x="398" y="272" font-size="14">실근을 가지려면 9가 세 극값 중 하나와 같아야</text>
    <text x="398" y="294" font-size="14">한다. a+11=9이면 a=-2이다. 이때 y=9는</text>
    <text x="398" y="316" font-size="14">x=1에서 극댓값에 접하고 양쪽 바깥 단조</text>
    <text x="398" y="338" font-size="14">구간에서 각각 한 번씩 만나므로 교점은</text>
    <text x="398" y="360" font-size="14">3개이다. a+6=9이면 a=3이고, 왼쪽의 두 단조</text>
    <text x="398" y="382" font-size="14">구간에서 각각 한 번 만나며 x=2에서 극솟값에</text>
    <text x="398" y="404" font-size="14">접하므로 역시 교점은 3개이다. 반면</text>
    <text x="398" y="426" font-size="14">a-21=9이면 a=30이고 y=9는 x=-1의</text>
    <text x="398" y="448" font-size="14">극솟값에서만 만나므로 서로 다른 실근은</text>
    <text x="398" y="470" font-size="14">1개이다. 따라서 가능한 a는 -2,3이고 그 합은</text>
    <text x="398" y="492" font-size="14">1이므로 정답은 ①이다.</text>
    <rect x="18" y="544" width="724" height="48" rx="10" fill="#fff7ed" stroke="#fdba74"/>
    <text x="380" y="574" font-size="17" text-anchor="middle" fill="#9a3412">결론: ①</text>
    <text x="380" y="620" font-size="11" text-anchor="middle" fill="#64748b">25_강남여고_2학기_기말_고2_수학II · q16 · source-bound solution visual</text>
  </g>
</svg>