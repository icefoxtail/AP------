  <title id="title">25_강남여고_2학기_기말_고2_수학II · q7 해설 시각화</title>
  <desc id="desc">문항 7의 원문과 해설 흐름을 source-bound 텍스트 카드로 정리한 SVG</desc>
  <rect width="760" height="620" fill="#fff"/>
  <g font-family="Noto Sans KR, Pretendard, Apple SD Gothic Neo, Malgun Gothic, sans-serif" fill="#111">
    <text x="380" y="32" font-size="21" font-weight="700" text-anchor="middle">25_강남여고_2학기_기말_고2_수학II · q7 해설 시각화</text>
    <text x="380" y="59" font-size="15" text-anchor="middle" fill="#475569">도함수의 활용 · 극댓값과 극솟값</text>
    <rect x="18" y="82" width="350" height="350" rx="12" fill="#eff6ff" stroke="#93c5fd"/>
    <rect x="390" y="82" width="352" height="350" rx="12" fill="#f0fdf4" stroke="#86efac"/>
    <text x="34" y="112" font-size="17" font-weight="700" fill="#1d4ed8">문항 핵심</text>
    <text x="398" y="112" font-size="17" font-weight="700" fill="#15803d">해설 흐름</text>
    <text x="34" y="140" font-size="15">함수 f(x)=-x^3+3x+1의 극댓값을 M, 극솟값을 m이라 할 때, M+m의 값은? </text>
    <text x="34" y="162" font-size="15">[3.5점]</text>
    <text x="398" y="140" font-size="14">[키포인트] 극값은 f'(x)=0인 점에서 조사한다.\nf'(x)=-3x^2+3=-3(x-</text>
    <text x="398" y="162" font-size="14">1)(x+1)이므로 극대는 x=1, 극소는 x=-1에서 생긴다.\nM=f(1)=3, m=f</text>
    <text x="398" y="184" font-size="14">(-1)=-1이므로 M+m=2이다.\n따라서 정답은 ⑤이다.</text>
    <path d="M350 264 L410 264" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="18" y="286" width="724" height="48" rx="10" fill="#fff7ed" stroke="#fdba74"/>
    <text x="380" y="316" font-size="17" text-anchor="middle" fill="#9a3412">결론: ⑤</text>
    <text x="380" y="361" font-size="13" text-anchor="middle" fill="#64748b">source: archive/exams/original/high/h2/2final/25_강남여고_2학기_기말_고2_수학II.js · q7 · archive/assets/images/25_강남여고_2학기_기말_고2_수학II/q7-solution.svg</text>
  </g>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#64748b"/></marker></defs>
