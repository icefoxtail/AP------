<svg xmlns="http://www.w3.org/2000/svg" width="760" height="620" viewBox="0 0 760 620" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet">
  <title id="title">25_강남여고_2학기_기말_고2_수학II · q23 해설 시각화</title>
  <desc id="desc">문항 23의 원문과 해설 흐름을 source-bound 텍스트 카드로 정리한 SVG</desc>
  <rect width="760" height="620" fill="#fff"/>
  <g font-family="Noto Sans KR, Pretendard, Apple SD Gothic Neo, Malgun Gothic, sans-serif" fill="#111">
    <text x="380" y="32" font-size="21" font-weight="700" text-anchor="middle">25_강남여고_2학기_기말_고2_수학II · q23 해설 시각화</text>
    <text x="380" y="59" font-size="15" text-anchor="middle" fill="#475569">문항 원문과 해설의 핵심 흐름</text>
    <rect x="18" y="82" width="350" height="306" rx="12" fill="#eff6ff" stroke="#93c5fd"/>
    <rect x="390" y="82" width="352" height="306" rx="12" fill="#f0fdf4" stroke="#86efac"/>
    <text x="34" y="112" font-size="17" font-weight="700" fill="#1d4ed8">문항 핵심</text>
    <text x="398" y="112" font-size="17" font-weight="700" fill="#15803d">해설 흐름</text>
    <text x="34" y="140" font-size="15">서술형2. 함수 f(x)=2x^3+3x^2+ax+b가</text>
    <text x="34" y="162" font-size="15">x=-2에서 x축에 접할 때, 극솟값을 구하시오.</text>
    <text x="34" y="184" font-size="15">(단, a, b는 상수이다.) [5점]</text>
    <text x="398" y="140" font-size="14">[키포인트] x=-2에서 x축에 접한다는 조건으로</text>
    <text x="398" y="162" font-size="14">a,b를 구한 뒤 도함수의 부호 변화로 극솟값을</text>
    <text x="398" y="184" font-size="14">판정한다. f(-2)=0, f'(-2)=0이다.</text>
    <text x="398" y="206" font-size="14">f'(x)=6x^2+6x+a이므로 f'(-2)=12+a=0에서</text>
    <text x="398" y="228" font-size="14">a=-12이고, f(-2)=0에 대입하면</text>
    <text x="398" y="250" font-size="14">-16+12+24+b=0이므로 b=-20이다. 따라서</text>
    <text x="398" y="272" font-size="14">f'(x)=6(x+2)(x-1)이다. x&lt;-2에서 f'(x)&gt;0,</text>
    <text x="398" y="294" font-size="14">-2&lt; x&lt;1에서 f'(x)&lt;0, x&gt;1에서 f'(x)&gt;0이므로</text>
    <text x="398" y="316" font-size="14">x=1에서 도함수의 부호가 음에서 양으로 바뀌어</text>
    <text x="398" y="338" font-size="14">극솟값을 갖는다. f(1)=2+3-12-20=-27이므로</text>
    <text x="398" y="360" font-size="14">극솟값은 -27이다.</text>
    <rect x="18" y="412" width="724" height="48" rx="10" fill="#fff7ed" stroke="#fdba74"/>
    <text x="380" y="442" font-size="17" text-anchor="middle" fill="#9a3412">결론: -27</text>
    <text x="380" y="488" font-size="11" text-anchor="middle" fill="#64748b">25_강남여고_2학기_기말_고2_수학II · q23 · source-bound solution visual</text>
  </g>
</svg>