<svg xmlns="http://www.w3.org/2000/svg" width="760" height="620" viewBox="0 0 760 620" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet">
  <title id="title">25_강남여고_2학기_기말_고2_수학II · q13 해설 시각화</title>
  <desc id="desc">문항 13의 원문과 해설 흐름을 source-bound 텍스트 카드로 정리한 SVG</desc>
  <rect width="760" height="620" fill="#fff"/>
  <g font-family="Noto Sans KR, Pretendard, Apple SD Gothic Neo, Malgun Gothic, sans-serif" fill="#111">
    <text x="380" y="32" font-size="21" font-weight="700" text-anchor="middle">25_강남여고_2학기_기말_고2_수학II · q13 해설 시각화</text>
    <text x="380" y="59" font-size="15" text-anchor="middle" fill="#475569">문항 원문과 해설의 핵심 흐름</text>
    <rect x="18" y="82" width="350" height="300" rx="12" fill="#eff6ff" stroke="#93c5fd"/>
    <rect x="390" y="82" width="352" height="300" rx="12" fill="#f0fdf4" stroke="#86efac"/>
    <text x="34" y="112" font-size="17" font-weight="700" fill="#1d4ed8">문항 핵심</text>
    <text x="398" y="112" font-size="17" font-weight="700" fill="#15803d">해설 흐름</text>
    <text x="34" y="140" font-size="15">두 곡선 y=f(x), y=g(x)가 다음 그림과 같고</text>
    <text x="34" y="162" font-size="15">∫[-2, 0]f(x)dx=7 / 2, ∫[-2, 1]f(x)dx=11</text>
    <text x="34" y="184" font-size="15">/ 2 ∫[-2, 1]g(x)dx=5, ∫[0, 1]g(x)dx=8 /</text>
    <text x="34" y="206" font-size="15">3 일 때, 두 곡선 y=f(x), y=g(x)로 둘러싸인</text>
    <text x="34" y="228" font-size="15">도형의 넓이는? [4점]</text>
    <text x="398" y="140" font-size="14">[키포인트] 그림에서 두 곡선의 위아래 관계가</text>
    <text x="398" y="162" font-size="14">x=0에서 바뀌므로 구간을 나눈다. ∫[-2,</text>
    <text x="398" y="184" font-size="14">0]g(x)dx=5-8 / 3=7 / 3이므로 [-2,0]의</text>
    <text x="398" y="206" font-size="14">넓이는 7 / 2-7 / 3=7 / 6이다. 또 ∫[0,</text>
    <text x="398" y="228" font-size="14">1]f(x)dx=11 / 2-7 / 2=2이므로 [0,1]의</text>
    <text x="398" y="250" font-size="14">넓이는 8 / 3-2=2 / 3이다. 전체 넓이는 7 / 6+2</text>
    <text x="398" y="272" font-size="14">/ 3=11 / 6이다. 따라서 정답은 ③이다.</text>
    <rect x="18" y="406" width="724" height="48" rx="10" fill="#fff7ed" stroke="#fdba74"/>
    <text x="380" y="436" font-size="17" text-anchor="middle" fill="#9a3412">결론: ③</text>
    <text x="380" y="482" font-size="11" text-anchor="middle" fill="#64748b">25_강남여고_2학기_기말_고2_수학II · q13 · source-bound solution visual</text>
  </g>
</svg>