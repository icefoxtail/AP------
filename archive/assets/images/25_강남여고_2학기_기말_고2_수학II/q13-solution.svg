<svg xmlns="http://www.w3.org/2000/svg" width="480" height="322" viewBox="0 0 480 322" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="q13title q13desc">
<title id="q13title">두 구간으로 나누어 곡선 사이의 넓이 계산</title>
<desc id="q13desc">원본 그림의 교점 -2, 0, 1을 이용한다. -2에서 0까지는 f-g의 정적분이 7/6이고, 0에서 1까지는 g-f의 정적분이 2/3이다. 높이의 크기는 원본 곡선의 실제 함수값을 뜻하지 않는 면적 비교 도식이다.</desc>
<rect width="480" height="322" fill="#ffffff"/>
<g font-family="Arial, Malgun Gothic, Apple SD Gothic Neo, sans-serif">
<text x="18" y="29" font-size="19" font-weight="700" fill="#172b46">13 | 두 곡선 사이 넓이를 구간별로</text>
<text x="18" y="57" font-size="15" fill="#475569">교점 x = 0에서 위쪽 곡선이 바뀐다.</text>
<text x="104" y="105" font-size="17" font-weight="700" fill="#991b1b">f(x) − g(x)</text>
<text x="312" y="105" font-size="17" font-weight="700" fill="#1d4ed8">g(x) − f(x)</text>
<line x1="80" y1="223" x2="432" y2="223" stroke="#475569" stroke-width="1.8"/>
<rect x="80" y="153" width="220" height="70" rx="2" fill="#fecaca" stroke="#b91c1c" stroke-width="1.8"/>
<rect x="300" y="143" width="110" height="80" rx="2" fill="#bfdbfe" stroke="#2563eb" stroke-width="1.8"/>
<text x="190" y="197" font-size="24" font-weight="700" text-anchor="middle" fill="#991b1b">7/6</text>
<text x="355" y="189" font-size="23" font-weight="700" text-anchor="middle" fill="#1d4ed8">2/3</text>
<line x1="80" y1="219" x2="80" y2="229" stroke="#475569" stroke-width="1.8"/>
<line x1="300" y1="219" x2="300" y2="229" stroke="#475569" stroke-width="1.8"/>
<line x1="410" y1="219" x2="410" y2="229" stroke="#475569" stroke-width="1.8"/>
<text x="80" y="249" text-anchor="middle" font-size="15" fill="#334155">−2</text>
<text x="300" y="249" text-anchor="middle" font-size="15" fill="#334155">0</text>
<text x="410" y="249" text-anchor="middle" font-size="15" fill="#334155">1</text>
<text x="190" y="271" text-anchor="middle" font-size="14" fill="#64748b">왼쪽 구간 넓이</text>
<text x="355" y="271" text-anchor="middle" font-size="14" fill="#64748b">오른쪽 구간 넓이</text>
<line x1="18" y1="286" x2="462" y2="286" stroke="#e2e8f0" stroke-width="1.2"/>
<text x="240" y="308" text-anchor="middle" font-size="18" font-weight="700" fill="#1e40af">전체 넓이 = 7/6 + 2/3 = 11/6</text>
</g>
</svg>