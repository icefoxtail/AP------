<svg xmlns="http://www.w3.org/2000/svg" width="760" height="620" viewBox="0 0 760 620" role="img" aria-labelledby="title desc">
  <title id="title">25_강남여고_2학기_기말_고2_수학II · q24 해설 시각화</title>
  <desc id="desc">문항 24의 원문과 해설 흐름을 source-bound 텍스트 카드로 정리한 SVG</desc>
  <rect width="760" height="620" fill="#fff"/>
  <g font-family="Arial, sans-serif" fill="#111">
    <text x="380" y="32" font-size="21" font-weight="700" text-anchor="middle">25_강남여고_2학기_기말_고2_수학II · q24 해설 시각화</text>
    <text x="380" y="59" font-size="15" text-anchor="middle" fill="#475569">정적분 · 적분으로 정의된 함수의 극값</text>
    <rect x="18" y="82" width="350" height="350" rx="12" fill="#eff6ff" stroke="#93c5fd"/>
    <rect x="390" y="82" width="352" height="350" rx="12" fill="#f0fdf4" stroke="#86efac"/>
    <text x="34" y="112" font-size="17" font-weight="700" fill="#1d4ed8">문항 핵심</text>
    <text x="398" y="112" font-size="17" font-weight="700" fill="#15803d">해설 흐름</text>
    <text x="34" y="140" font-size="15">서술형3. 함수 f(x)=∫_0^x(t^2-2t-3)dt는 x=a에서 극솟값 b를 갖는다.</text>
    <text x="34" y="162" font-size="15"> 상수 a, b에 대하여 a+b의 값을 구하시오. [5점]</text>
    <text x="398" y="140" font-size="14">[키포인트] 적분으로 정의된 함수는 미분하여 극값의 위치를 찾는다.\nf'(x)=x^2-2</text>
    <text x="398" y="162" font-size="14">x-3=(x+1)(x-3)이므로 x=3에서 극솟값을 갖는다. 따라서 a=3이다.\nb=f(</text>
    <text x="398" y="184" font-size="14">3)=∫_0^3(t^2-2t-3)dt=[t^33-t^2-3t]_0^3=-9이다.\n따라서 </text>
    <text x="398" y="206" font-size="14">a+b=3-9=-6이다.</text>
    <path d="M350 286 L410 286" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="18" y="308" width="724" height="48" rx="10" fill="#fff7ed" stroke="#fdba74"/>
    <text x="380" y="338" font-size="17" text-anchor="middle" fill="#9a3412">정답/결론: -6</text>
    <text x="380" y="383" font-size="13" text-anchor="middle" fill="#64748b">source: archive/exams/original/high/h2/2final/25_강남여고_2학기_기말_고2_수학II.js · q24 · archive/assets/images/25_강남여고_2학기_기말_고2_수학II/q24-solution.svg</text>
  </g>
