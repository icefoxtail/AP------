<svg xmlns="http://www.w3.org/2000/svg" width="760" height="660" viewBox="0 0 760 660" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet">
  <title id="title">25_강남여고_2학기_기말_고2_수학II · q19 해설 시각화</title>
  <desc id="desc">문항 19의 원문과 해설 흐름을 source-bound 텍스트 카드로 정리한 SVG</desc>
  <rect width="760" height="660" fill="#fff"/>
  <g font-family="Noto Sans KR, Pretendard, Apple SD Gothic Neo, Malgun Gothic, sans-serif" fill="#111">
    <text x="380" y="32" font-size="21" font-weight="700" text-anchor="middle">25_강남여고_2학기_기말_고2_수학II · q19 해설 시각화</text>
    <text x="380" y="59" font-size="15" text-anchor="middle" fill="#475569">문항 원문과 해설의 핵심 흐름</text>
    <rect x="18" y="82" width="350" height="438" rx="12" fill="#eff6ff" stroke="#93c5fd"/>
    <rect x="390" y="82" width="352" height="438" rx="12" fill="#f0fdf4" stroke="#86efac"/>
    <text x="34" y="112" font-size="17" font-weight="700" fill="#1d4ed8">문항 핵심</text>
    <text x="398" y="112" font-size="17" font-weight="700" fill="#15803d">해설 흐름</text>
    <text x="34" y="140" font-size="15">좌표평면에서 x축 위를 양의 방향으로</text>
    <text x="34" y="162" font-size="15">움직이는 점 P는 원점을 출발하여 매초 2의</text>
    <text x="34" y="184" font-size="15">속력으로 움직인다. 그림은 원점 O와 점 P를</text>
    <text x="34" y="206" font-size="15">지나고 이차항의 계수가 -1인 이차함수의</text>
    <text x="34" y="228" font-size="15">그래프를 나타낸 것이다. 선분 OP를</text>
    <text x="34" y="250" font-size="15">사등분하는 점 중 두 점 O, P에 가까운 쪽에</text>
    <text x="34" y="272" font-size="15">있는 점을 각각 A, B라 하고, 두 점 A, B를</text>
    <text x="34" y="294" font-size="15">지나고 x축에 수직인 직선이 이차함수의</text>
    <text x="34" y="316" font-size="15">그래프와 만나는 점을 각각 C, D라 하자.</text>
    <text x="34" y="338" font-size="15">사각형 ABDC가 정사각형이 되는 순간, 사각형</text>
    <text x="34" y="360" font-size="15">ABDC의 넓이의 변화율은? [4.5점]</text>
    <text x="398" y="140" font-size="14">[키포인트] 시각 t에서 점들의 좌표와 사각형의</text>
    <text x="398" y="162" font-size="14">가로·세로를 모두 t의 식으로 나타낸다. 조건</text>
    <text x="398" y="184" font-size="14">정리: 점 P는 원점에서 매초 2의 속력으로</text>
    <text x="398" y="206" font-size="14">움직이므로 시각 t에서 P=(2t,0)이고, 포물선의</text>
    <text x="398" y="228" font-size="14">이차항의 계수는 -1이다. 풀이 방향: 포물선의</text>
    <text x="398" y="250" font-size="14">식을 구해 AB와 AC를 나타내고, 정사각형</text>
    <text x="398" y="272" font-size="14">조건으로 그 순간의 t를 구한 뒤 넓이를 t에</text>
    <text x="398" y="294" font-size="14">대하여 미분한다. 정석 풀이: 포물선은 원점과</text>
    <text x="398" y="316" font-size="14">P(2t,0)를 지나므로 y=-x^2+2tx이다. A, B의</text>
    <text x="398" y="338" font-size="14">x좌표는 각각 t / 2, 3t / 2이므로 AB=t이다. 또</text>
    <text x="398" y="360" font-size="14">AC=-(t / 2)^2+2t·t / 2=3t^2 / 4이다.</text>
    <text x="398" y="382" font-size="14">정사각형이 되는 순간에는 AB=AC이므로 t=3t^2</text>
    <text x="398" y="404" font-size="14">/ 4이다. 이때 한 변의 길이 AB=t는 양수이므로</text>
    <text x="398" y="426" font-size="14">퇴화하는 t=0은 제외하고 t=4 / 3이다.</text>
    <text x="398" y="448" font-size="14">사각형의 넓이를 S라 하면 S=t·3t^2 / 4=3t^3 /</text>
    <text x="398" y="470" font-size="14">4이므로 S'=9t^2 / 4이고, t=4 / 3일 때</text>
    <text x="398" y="492" font-size="14">S'=4이다. 따라서 정답은 ②이다.</text>
    <rect x="18" y="544" width="724" height="48" rx="10" fill="#fff7ed" stroke="#fdba74"/>
    <text x="380" y="574" font-size="17" text-anchor="middle" fill="#9a3412">결론: ②</text>
    <text x="380" y="620" font-size="11" text-anchor="middle" fill="#64748b">25_강남여고_2학기_기말_고2_수학II · q19 · source-bound solution visual</text>
  </g>
</svg>