  <title id="title">25_강남여고_2학기_기말_고2_수학II · q15 해설 시각화</title>
  <desc id="desc">문항 15의 원문과 해설 흐름을 source-bound 텍스트 카드로 정리한 SVG</desc>
  <rect width="760" height="620" fill="#fff"/>
  <g font-family="Arial, sans-serif" fill="#111">
    <text x="380" y="32" font-size="21" font-weight="700" text-anchor="middle">25_강남여고_2학기_기말_고2_수학II · q15 해설 시각화</text>
    <text x="380" y="59" font-size="15" text-anchor="middle" fill="#475569">도함수의 활용 · 도함수와 최솟값</text>
    <rect x="18" y="82" width="350" height="350" rx="12" fill="#eff6ff" stroke="#93c5fd"/>
    <rect x="390" y="82" width="352" height="350" rx="12" fill="#f0fdf4" stroke="#86efac"/>
    <text x="34" y="112" font-size="17" font-weight="700" fill="#1d4ed8">문항 핵심</text>
    <text x="398" y="112" font-size="17" font-weight="700" fill="#15803d">해설 흐름</text>
    <text x="34" y="140" font-size="15">미분가능한 함수 f(x)가 닫힌구간 [1,4]에 속하는 모든 x에 대하여 f'(x)\ge </text>
    <text x="34" y="162" font-size="15">4이다. f(1)=-3일 때, f(4)의 최솟값은? [4점]</text>
    <text x="398" y="140" font-size="14">[키포인트] f'(x)\ge4이므로 평균값 정리로 f(4)의 하한을 구한 뒤 그 값이 실제</text>
    <text x="398" y="162" font-size="14">로 가능한지도 확인한다.\n평균값 정리에 의해 어떤 c\in(1,4)에 대하여 f(4)-f</text>
    <text x="398" y="184" font-size="14">(1)=3f'(c)이다. f'(c)\ge4이므로 f(4)-f(1)\ge12이고, f(1)=</text>
    <text x="398" y="206" font-size="14">-3이므로 f(4)\ge9이다.\n한편 f(x)=4x-7로 두면 모든 x\in[1,4]에서</text>
    <text x="398" y="228" font-size="14"> f'(x)=4\ge4, f(1)=-3이고 f(4)=9이므로 이 하한은 실제로 달성된다.\</text>
    <text x="398" y="250" font-size="14">n따라서 f(4)의 최솟값은 9이고 정답은 ⑤이다.</text>
    <path d="M350 330 L410 330" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="18" y="352" width="724" height="48" rx="10" fill="#fff7ed" stroke="#fdba74"/>
    <text x="380" y="382" font-size="17" text-anchor="middle" fill="#9a3412">정답/결론: ⑤</text>
    <text x="380" y="427" font-size="13" text-anchor="middle" fill="#64748b">source: archive/exams/original/high/h2/2final/25_강남여고_2학기_기말_고2_수학II.js · q15 · archive/assets/images/25_강남여고_2학기_기말_고2_수학II/q15-solution.svg</text>
