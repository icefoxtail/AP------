<svg xmlns="http://www.w3.org/2000/svg" width="760" height="620" viewBox="0 0 760 620" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet">
  <title id="title">25_강남여고_2학기_기말_고2_수학II · q15 해설 시각화</title>
  <desc id="desc">문항 15의 원문과 해설 흐름을 source-bound 텍스트 카드로 정리한 SVG</desc>
  <rect width="760" height="620" fill="#fff"/>
  <g font-family="Noto Sans KR, Pretendard, Apple SD Gothic Neo, Malgun Gothic, sans-serif" fill="#111">
    <text x="380" y="32" font-size="21" font-weight="700" text-anchor="middle">25_강남여고_2학기_기말_고2_수학II · q15 해설 시각화</text>
    <text x="380" y="59" font-size="15" text-anchor="middle" fill="#475569">문항 원문과 해설의 핵심 흐름</text>
    <rect x="18" y="82" width="350" height="300" rx="12" fill="#eff6ff" stroke="#93c5fd"/>
    <rect x="390" y="82" width="352" height="300" rx="12" fill="#f0fdf4" stroke="#86efac"/>
    <text x="34" y="112" font-size="17" font-weight="700" fill="#1d4ed8">문항 핵심</text>
    <text x="398" y="112" font-size="17" font-weight="700" fill="#15803d">해설 흐름</text>
    <text x="34" y="140" font-size="15">미분가능한 함수 f(x)가 닫힌구간 [1,4]에</text>
    <text x="34" y="162" font-size="15">속하는 모든 x에 대하여 f'(x)≥ 4이다.</text>
    <text x="34" y="184" font-size="15">f(1)=-3일 때, f(4)의 최솟값은? [4점]</text>
    <text x="398" y="140" font-size="14">[키포인트] f'(x)≥4이므로 평균값 정리로</text>
    <text x="398" y="162" font-size="14">f(4)의 하한을 구한 뒤 그 값이 실제로</text>
    <text x="398" y="184" font-size="14">가능한지도 확인한다. 평균값 정리에 의해 어떤</text>
    <text x="398" y="206" font-size="14">c∈(1,4)에 대하여 f(4)-f(1)=3f'(c)이다.</text>
    <text x="398" y="228" font-size="14">f'(c)≥4이므로 f(4)-f(1)≥12이고,</text>
    <text x="398" y="250" font-size="14">f(1)=-3이므로 f(4)≥9이다. 한편</text>
    <text x="398" y="272" font-size="14">f(x)=4x-7로 두면 모든 x∈[1,4]에서</text>
    <text x="398" y="294" font-size="14">f'(x)=4≥4, f(1)=-3이고 f(4)=9이므로 이</text>
    <text x="398" y="316" font-size="14">하한은 실제로 달성된다. 따라서 f(4)의</text>
    <text x="398" y="338" font-size="14">최솟값은 9이고 정답은 ⑤이다.</text>
    <rect x="18" y="406" width="724" height="48" rx="10" fill="#fff7ed" stroke="#fdba74"/>
    <text x="380" y="436" font-size="17" text-anchor="middle" fill="#9a3412">결론: ⑤</text>
    <text x="380" y="482" font-size="11" text-anchor="middle" fill="#64748b">25_강남여고_2학기_기말_고2_수학II · q15 · source-bound solution visual</text>
  </g>
</svg>