<svg xmlns="http://www.w3.org/2000/svg" width="760" height="620" viewBox="0 0 760 620" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet">
  <title id="title">25_강남여고_2학기_기말_고2_수학II · q11 해설 시각화</title>
  <desc id="desc">문항 11의 원문과 해설 흐름을 source-bound 텍스트 카드로 정리한 SVG</desc>
  <rect width="760" height="620" fill="#fff"/>
  <g font-family="Noto Sans KR, Pretendard, Apple SD Gothic Neo, Malgun Gothic, sans-serif" fill="#111">
    <text x="380" y="32" font-size="21" font-weight="700" text-anchor="middle">25_강남여고_2학기_기말_고2_수학II · q11 해설 시각화</text>
    <text x="380" y="59" font-size="15" text-anchor="middle" fill="#475569">도함수의 활용 · 함수의 대소 관계</text>
    <rect x="18" y="82" width="350" height="350" rx="12" fill="#eff6ff" stroke="#93c5fd"/>
    <rect x="390" y="82" width="352" height="350" rx="12" fill="#f0fdf4" stroke="#86efac"/>
    <text x="34" y="112" font-size="17" font-weight="700" fill="#1d4ed8">문항 핵심</text>
    <text x="398" y="112" font-size="17" font-weight="700" fill="#15803d">해설 흐름</text>
    <text x="34" y="140" font-size="15">두 함수 f(x)=x^3-x^2+3x+5, g(x)=4x+a가 있다. x&gt; 0인 모든 실수</text>
    <text x="34" y="162" font-size="15"> x에 대하여 부등식 f(x)\ge g(x)가 성립할 때, 실수 a의 최댓값은? [4점]</text>
    <text x="398" y="140" font-size="14">[키포인트] 모든 x&gt; 0에서 f(x)\ge g(x)이려면 h(x)=f(x)-g(x)의 최</text>
    <text x="398" y="162" font-size="14">솟값이 0 이상이어야 한다.\nh(x)=x^3-x^2-x+5-a이고 h'(x)=3x^2-2</text>
    <text x="398" y="184" font-size="14">x-1=(3x+1)(x-1)이다. x&gt; 0에서는 3x+1&gt; 0이므로 0&lt; x&lt;1에서 h'(</text>
    <text x="398" y="206" font-size="14">x)&lt;0, x&gt;1에서 h'(x)&gt;0이다.\n따라서 h(x)는 x=1에서 최솟값 h(1)=4</text>
    <text x="398" y="228" font-size="14">-a를 갖는다. 모든 x&gt;0에서 h(x)\ge0이려면 4-a\ge0, 즉 a\le4이다.\</text>
    <text x="398" y="250" font-size="14">n따라서 a의 최댓값은 4이고 정답은 ②이다.</text>
    <path d="M350 330 L410 330" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="18" y="352" width="724" height="48" rx="10" fill="#fff7ed" stroke="#fdba74"/>
    <text x="380" y="382" font-size="17" text-anchor="middle" fill="#9a3412">결론: ②</text>
    <text x="380" y="427" font-size="13" text-anchor="middle" fill="#64748b">source: archive/exams/original/high/h2/2final/25_강남여고_2학기_기말_고2_수학II.js · q11 · archive/assets/images/25_강남여고_2학기_기말_고2_수학II/q11-solution.svg</text>
  </g>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#64748b"/></marker></defs>
</svg>