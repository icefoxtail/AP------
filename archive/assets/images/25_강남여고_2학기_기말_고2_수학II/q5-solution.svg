    <text x="380" y="294" font-size="17" text-anchor="middle" fill="#9a3412">정답/결론: ①</text>
    <text x="380" y="339" font-size="13" text-anchor="middle" fill="#64748b">source: archive/exams/original/high/h2/2final/25_강남여고_2학기_기말_고2_수학II.js · q5 · archive/assets/images/25_강남여고_2학기_기말_고2_수학II/q5-solution.svg</text>
