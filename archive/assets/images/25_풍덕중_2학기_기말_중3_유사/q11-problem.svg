<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">원 밖의 한 점에서 원에 그은 접선과, 그 점을 지나는 할선을 나타낸 그림이다. 접점에서 할선 위의 두 점까지의 길이와 접선의 길이가 주어져 있다.</title><desc id="visual-desc">원 밖의 점 P에서 원에 그은 접선이 접점 T에서 만나고, P를 지나는 직선이 원과 두 점 A, B에서 만난다. 선분 P T에는 6, 선분 T A에는 4, 선분 T B에는 6이 적혀 있다.</desc><rect width="640" height="420" fill="#fff"/><g data-layer="30"><line id="PT" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="98.325123153" y1="293.785228007" x2="320" y2="98.286362657"/></g><g data-layer="30"><line id="PB" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="98.325123153" y1="293.785228007" x2="541.674876847" y2="293.785228007"/></g><g data-layer="30"><line id="TA" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="320" y1="98.286362657" x2="295.369458128" y2="293.785228007"/></g><g data-layer="30"><line id="TB" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="320" y1="98.286362657" x2="541.674876847" y2="293.785228007"/></g><g data-layer="40"><circle id="circ" data-role="circle" stroke="#111" stroke-width="2.05" fill="none" cx="418.522167488" cy="210" r="148.951516457"/></g><g data-layer="70"><circle id="P" data-role="point" stroke="#111" stroke-width="0.8" fill="#111" cx="98.325123153" cy="293.785228007"