<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 360" width="440" height="360" role="img" aria-labelledby="q13-title q13-desc">
  <title id="q13-title">정육각형과 정사각형이 한 변을 공유할 때 이등변삼각형 EFH</title>
  <desc id="q13-desc">한 변 ED를 공유하는 정육각형 ABCDEF와 정사각형 EDGH 및 두 꼭짓점 F, H를 이은 선분</desc>
  <rect width="440" height="360" fill="#ffffff"/>
  <polygon points="160,110 240,110 280,179 240,248 160,248 120,179" fill="#f8f9fa" stroke="#222222" stroke-width="2"/>
  <polygon points="160,248 240,248 240,328 160,328" fill="#e8f4fd" stroke="#0056b3" stroke-width="2"/>
  <line x1="120" y1="179" x2="160" y2="328" stroke="#d9534f" stroke-width="2"/>
  <circle cx="120" cy="179" r="4" fill="#d9534f"/>
  <circle cx="160" cy="248" r="4" fill="#222222"/>
  <circle cx="160" cy="328" r="4" fill="#0056b3"/>
  <g font-family="sans-serif" font-size="14" font-weight="bold" fill="#111111">
    <text x="155" y="98">A</text>
    <text x="245" y="98">B</text>
    <text x="290" y="184">C</text>
    <text x="248" y="248">D</text>
    <text x="145" y="248">E</text>
    <text x="100" y="184">F</text>
    <text x="248" y="338">G</text>
    <text x="145" y="338">H</text>
  </g>
</svg>
