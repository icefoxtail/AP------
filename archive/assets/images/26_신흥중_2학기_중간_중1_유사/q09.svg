<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="400" height="240" role="img" aria-labelledby="q09-title q09-desc">
  <title id="q09-title">평행선 사이의 꺾은선의 각</title>
  <desc id="q09-desc">평행한 두 직선 l과 m 사이에 35도, 85도, x의 각을 이루는 꺾은선</desc>
  <rect width="400" height="240" fill="#ffffff"/>
  <line x1="30" y1="50" x2="370" y2="50" stroke="#222222" stroke-width="2"/>
  <line x1="30" y1="190" x2="370" y2="190" stroke="#222222" stroke-width="2"/>
  <polyline points="90,50 220,120 130,190" fill="none" stroke="#0056b3" stroke-width="2.5"/>
  <path d="M 115 50 A 25 25 0 0 1 106 60" fill="none" stroke="#d9534f" stroke-width="1.5"/>
  <path d="M 195 106 A 25 25 0 0 0 200 135" fill="none" stroke="#28a745" stroke-width="1.5"/>
  <path d="M 148 176 A 25 25 0 0 1 155 190" fill="none" stroke="#d9534f" stroke-width="1.5"/>
  <g font-family="sans-serif" font-size="14" font-weight="bold" fill="#111111">
    <text x="380" y="55">l</text>
    <text x="380" y="195">m</text>
    <text x="120" y="70">35°</text>
    <text x="160" y="125">85°</text>
    <text x="155" y="180">x</text>
  </g>
</svg>