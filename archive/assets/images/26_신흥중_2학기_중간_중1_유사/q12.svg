<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 280" width="460" height="280" role="img" aria-labelledby="q12-title q12-desc">
  <title id="q12-title">선분 위의 두 정삼각형과 합동</title>
  <desc id="q12-desc">선분 AB 위의 점 C에 세워진 두 정삼각형 ACD, CBE와 교점 P</desc>
  <rect width="460" height="280" fill="#ffffff"/>
  <polygon points="50,230 190,230 120,109" fill="#e8f4fd" stroke="#0056b3" stroke-width="2"/>
  <polygon points="190,230 390,230 290,57" fill="#fff3cd" stroke="#856404" stroke-width="2"/>
  <line x1="50" y1="230" x2="290" y2="57" stroke="#d9534f" stroke-width="2"/>
  <line x1="120" y1="109" x2="390" y2="230" stroke="#d9534f" stroke-width="2"/>
  <circle cx="195" cy="126" r="4.5" fill="#d9534f"/>
  <g font-family="sans-serif" font-size="14" font-weight="bold" fill="#111111">
    <text x="38" y="248">A</text>
    <text x="185" y="248">C</text>
    <text x="398" y="248">B</text>
    <text x="112" y="98">D</text>
    <text x="288" y="48">E</text>
