<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 140" width="460" height="140" role="img" aria-labelledby="q07-title q07-desc">
  <title id="q07-title">선분의 중점과 길이 관계</title>
  <desc id="q07-desc">선분 AC 위에 점 B가 있고 M, N이 각각 AB, BC의 중점이며 MN이 10 cm인 그림</desc>
  <rect width="460" height="140" fill="#ffffff"/>
  <line x1="40" y1="70" x2="420" y2="70" stroke="#222222" stroke-width="2.5"/>
  <line x1="40" y1="60" x2="40" y2="80" stroke="#222222" stroke-width="2"/>
  <line x1="420" y1="60" x2="420" y2="80" stroke="#222222" stroke-width="2"/>
  <circle cx="160" cy="70" r="4.5" fill="#0275d8"/>
  <circle cx="280" cy="70" r="4.5" fill="#222222"/>
  <circle cx="350" cy="70" r="4.5" fill="#0275d8"/>
  <line x1="160" y1="90" x2="350" y2="90" stroke="#d9534f" stroke-width="1.8"/>
  <line x1="160" y1="83" x2="160" y2="97" stroke="#d9534f" stroke-width="1.8"/>
  <line x1="350" y1="83" x2="350" y2="97" stroke="#d9534f" stroke-width="1.8"/>
  <g font-family="sans-serif" font-size="15" font-weight="bold" fill="#111111" text-anchor="middle">
    <text x="40" y="50">A</text>
    <text x="160" y="50" fill="#0275d8">M</text>
    <text x="280" y="50">B</text>
    <text x="350" y="50" fill="#0275d8">N</text>
    <text x="420" y="50">C</text>
    <text x="255" y="115" fill="#d9534f">10 cm</text>
  </g>
</svg>