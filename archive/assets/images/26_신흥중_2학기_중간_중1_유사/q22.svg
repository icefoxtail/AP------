<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 220" width="420" height="220" role="img" aria-labelledby="q22-title q22-desc">
  <title id="q22-title">일직선 위의 연속된 각</title>
  <desc id="q22-desc">세 점 A, O, B가 한 직선 위에 있고 반직선 OC, OD, OE가 이루는 각</desc>
  <rect width="420" height="220" fill="#ffffff"/>
  <line x1="30" y1="180" x2="390" y2="180" stroke="#222222" stroke-width="2"/>
  <line x1="210" y1="180" x2="110" y2="80" stroke="#0056b3" stroke-width="1.8"/>
  <line x1="210" y1="180" x2="210" y2="40" stroke="#0056b3" stroke-width="1.8"/>
  <line x1="210" y1="180" x2="310" y2="80" stroke="#0056b3" stroke-width="1.8"/>
  <circle cx="210" cy="180" r="4" fill="#111"/>
  <g font-family="sans-serif" font-size="14" font-weight="bold" fill="#111111">
    <text x="35" y="200">A</text>
    <text x="205" y="202">O</text>
    <text x="380" y="200">B</text>
    <text x="100" y="70">C</text>
    <text x="205" y="30">D</text>
    <text x="315" y="70">E</text>
  </g>
</svg>