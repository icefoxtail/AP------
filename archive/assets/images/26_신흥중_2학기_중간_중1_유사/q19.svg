  <rect width="360" height="340" fill="#ffffff"/>
  <polyline points="180,30 270,300 35,135 325,135 90,300 180,30" fill="none" stroke="#0056b3" stroke-width="2.5"/>
  <circle cx="180" cy="30" r="4.5" fill="#d9534f"/>
  <circle cx="325" cy="135" r="4.5" fill="#d9534f"/>
  <circle cx="270" cy="300" r="4.5" fill="#d9534f"/>
  <circle cx="90" cy="300" r="4.5" fill="#d9534f"/>
