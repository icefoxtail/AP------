<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 514" width="720" height="514" role="img" aria-labelledby="title desc"><title id="title">두 이차함수의 그래프 사이 영역</title><desc id="desc">파란 경계 곡선과 주황 경계 곡선 사이에 보라 곡선이 지나간다. 두 경계 사이의 밝은 영역은 두 부등식을 모두 만족하는 위치이다.</desc><rect width="720" height="514" fill="white" /><path d="M 116.6585 90.1082 Q 234.8293 314.4070 353.0000 314.4070 L 353.0000 314.4070 Q 234.8293 314.4070 116.6585 426.5565 Z" fill="#f4dcb5" stroke="none" /><path d="M 353.0000 314.4070 Q 471.1707 314.4070 589.3415 90.1082 L 589.3415 426.5565 Q 471.1707 314.4070 353.0000 314.4070 Z" fill="#f4dcb5" stroke="none" /><line x1="42.0000" y1="314.4070" x2="670.0000" y2="314.4070" stroke="#425064" stroke-width="1.55" stroke-linecap="round" /><polygon points="679.0000,314.4070 664.0000,308.4070 664.0000,320.4070" fill="#5c6879" /><line x1="353.0000" y1="474.0000" x2="353.0000" y2="39.0000" stroke="#425064" stroke-width="1.55" stroke-linecap="round" /><polygon points="353.0000,32.0000 347.0000,47.0000 359.0000,47.0000" fill="#5c6879" /><text x="692.0000" y="306.4070" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">x</text><text x="374.0000" y="47.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">y</text><path d="M 116.6585 90.1082 Q 353.0000 538.7059 589.3415 90.1082" stroke="#205d9c" fill="none" stroke-width="5.05" stroke-linecap="round" /><path d="M 116.6585 426.5565 Q 353.0000 202.2576 589.3415 426.5565" stroke="#aa5411" fill="none" stroke-width="5.05" stroke-linecap="round" /><path d="M 116.6585 370.4817 Q 353.0000 258.3323 589.3415 370.4817" stroke="#7548a4" fill="none" stroke-width="4.9" stroke-linecap="round" /><circle cx="353.000" cy="314.407" r="4.8" fill="#28364b" /><text x="337.0000" y="345.4070" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor