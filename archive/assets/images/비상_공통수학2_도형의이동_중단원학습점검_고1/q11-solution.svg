<svg xmlns="http://www.w3.org/2000/svg" width="360" height="474" viewBox="0 0 360 474" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc"><title id="title">도형의 관계</title><desc id="desc">도형의 관계의 문항별 수학 사실을 표시한다.</desc><g font-family="Arial, sans-serif"><line x1="106.667" y1="239.556" x2="204.444" y2="166.222" stroke="#222" stroke-width="1.8"/><line x1="204.444" y1="166.222" x2="145.778" y2="122.222" stroke="#222" stroke-width="1.8"/><line x1="302.222" y1="239.556" x2="204.444" y2="166.222" stroke="#222" stroke-width="1.8"/><line x1="302.222" y1="239.556" x2="145.778" y2="122.222" stroke="#222" stroke-width="1.8"/><line x1="106.667" y1="92.8889" x2="145.778" y2="122.222" stroke="#222" stroke-width="1.8"/><line x1="106.667" y1="92.8889" x2="302.222" y2="239.556" stroke="#222" stroke-width="1.8"/><line x1="204.444" y1="264" x2="204.444" y2="68.4444" stroke="#222" stroke-width="1.8"/><line x1="106.667" y1="239.556" x2="145.778" y2="122.222" stroke="#222" stroke-width="1.8"/><circle cx="106.667" cy="92.8889" r="48.8889" fill="none" stroke="#222" stroke-width="1.8"/><text x="76" y="56" font-size="15" text-anchor="middle" fill="#111">r = 1</text><circle cx="106.667" cy="239.556" r="2.5" fill="#111" stroke="#222" stroke-width="1.8"/><text x="106.667" y="229.556" font-size="17" text-anchor="middle" fill="#111">A</text><circle cx="106.667" cy="92.8889" r="2.5" fill="#111" stroke="#222" stroke-width="1.8"/><text x="106.667" y="82.8889" font-size="17" text-anchor="middle" fill="#111">B</text><circle cx="302.222" cy="239.556" r="2.5" fill="#111" stroke="#222" stroke-width="1.8"/><text x="302.222" y="229.556" font-size="17" text-anchor="middle" fill="#111">A′</text><circle cx="145.778" cy="122.222" r="2.5" fill="#111" stroke="#222" stroke-width="1.8"/><text x="145.778" y="112.222" font-size="17" text-anchor="middle" fill="#111">Q</text><circle cx="204.444" cy="166.222" r="2.5" fill="#111" stroke="#222" stroke-width="1.8"/><text x="204.444" y="156.222" font-size="17" text-anchor="middle" fill="#111">P</text><circle cx="204.444" cy="68.4444" r="2.5" fill="#111" stroke="#222" stroke-width="1.8"/><text x="204.444" y="58.4444" font-size="17" text-anchor="middle" fill="#111"></text><circle cx="204.444" cy="264" r="2.5" fill="#111" stroke="#222" stroke-width="1.8"/><text x="204.444" y="254" font-size="17" text-anchor="middle" fill="#111"></text><text x="180" y="286" font-size="17" text-anchor="middle" fill="#111">A′Q = A′P + PQ</text><text x="180" y="310" font-size="17" text-anchor="middle" fill="#111">BQ ⊂ BA′</text><text x="180" y="334" font-size="15" text-anchor="middle" fill="#111">A(-2,-2)  B(-2,1)</text><text x="180" y="358" font-size="15" text-anchor="middle" fill="#111">A′(2,−2)  Q(−6/5, 2/5)</text><text x="180" y="382" font-size="15" text-anchor="middle" fill="#111">P(0,−1/2),  BQ = 1</text><text x="180" y="406" font-size="15" text-anchor="middle" fill="#111">B-Q-P-A′ 순서로 한 직선 위</text><text x="180" y="430" font-size="15" text-anchor="middle" fill="#111">PQ=3/2, 높이=12/5, 넓이=9/5</text></g></svg>
