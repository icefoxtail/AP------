<svg xmlns="http://www.w3.org/2000/svg" width="360" height="474" viewBox="0 0 360 474" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc"><title id="title">도형의 관계</title><desc id="desc">도형의 관계의 문항별 수학 사실을 표시한다.</desc><g font-family="Arial, sans-serif"><line x1="180" y1="154" x2="141.176" y2="102.235" stroke="#222" stroke-width="1.8"/><line x1="63.5294" y1="160.471" x2="218.824" y2="44" stroke="#222" stroke-width="1.8"/><line x1="180" y1="154" x2="218.824" y2="205.765" stroke="#222" stroke-width="1.8"/><line x1="141.176" y1="264" x2="296.471" y2="147.529" stroke="#222" stroke-width="1.8"/><circle cx="180" cy="154" r="64.7059" fill="none" stroke="#222" stroke-width="1.8"/><text x="123" y="140" font-size="17" text-anchor="middle" fill="#111">C</text><circle cx="180" cy="154" r="2.5" fill="#111" stroke="#222" stroke-width="1.8"/><text x="180" y="144" font-size="17" text-anchor="middle" fill="#111">O</text><circle cx="141.176" cy="102.235" r="2.5" fill="#111" stroke="#222" stroke-width="1.8"/><text x="141.176" y="92.2353" font-size="17" text-anchor="middle" fill="#111"></text><circle cx="218.824" cy="205.765" r="2.5" fill="#111" stroke="#222" stroke-width="1.8"/><text x="218.824" y="195.765" font-size="17" text-anchor="middle" fill="#111"></text><circle cx="63.5294" cy="160.471" r="2.5" fill="#111" stroke="#222" stroke-width="1.8"/><text x="63.5294" y="150.471" font-size="17" text-anchor="middle" fill="#111"></text><circle cx="218.824" cy="44" r="2.5" fill="#111" stroke="#222" stroke-width="1.8"/><text x="218.824" y="34" font-size="17" text-anchor="middle" fill="#111"></text><circle cx="141.176" cy="264" r="2.5" fill="#111" stroke="#222" stroke-width="1.8"/><text x="141.176" y="254" font-size="17" text-anchor="middle" fill="#111"></text><circle cx="296.471" cy="147.529" r="2.5" fill="#111" stroke="#222" stroke-width="1.8"/><text x="296.471" y="137.529" font-size="17" text-anchor="middle" fill="#111"></text><text x="180" y="286" font-size="17" text-anchor="middle" fill="#111">r₋ ⊥ ℓ₋ : k = −9</text><text x="180" y="310" font-size="17" text-anchor="middle" fill="#111">r₊ ⊥ ℓ₊ : k = 11</text><text x="180" y="334" font-size="15" text-anchor="middle" fill="#111">O(3,2),  r = 2</text><text x="180" y="358" font-size="15" text-anchor="middle" fill="#111">3x − 4y + 9 = 0  (k = −9)</text><text x="180" y="382" font-size="15" text-anchor="middle" fill="#111">3x − 4y − 11 = 0  (k = 11)</text><text x="180" y="406" font-size="15" text-anchor="middle" fill="#111">두 접점의 반지름은 2</text><text x="180" y="430" font-size="15" text-anchor="middle" fill="#111">O는 대칭이동한 원 C의 중심</text></g></svg>
