<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 600" width="720" height="600" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">곡선 y=4/x 위의 점 P를 지나고 직선 OP에 수직인 직선 l이 x축, y축과 만나는 점 Q, R을 보여 준다. O는 원점이고, OP와 l이 이루는 직각이 표시되어 있다.</title><desc id="visual-desc">원점 O에서 곡선 y=4/x 위의 점 P로 선분 OP가 이어지고, P를 지나 OP와 직각으로 만나는 직선 l이 x축과 만나는 점이 Q, y축과 만나는 점이 R이다. x축과 y축, 곡선 y=4/x, 점 O, P, Q, R이 표시되어 있다.</desc><rect width="720" height="600" fill="#fff"/><g data-layer="30"><line id="k1" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="251.233766234" y1="321.753246753" x2="265.735930736" y2="365.25974026"/></g><g data-layer="30"><line id="k2" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="265.735930736" y1="365.25974026" x2="272.987012987" y2="379.761904762"/></g><g data-layer="30"><line id="k3" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="272.987012987" y1="379.761904762" x2="294.74025974" y2="408.766233766"/></g><g data-layer="30"><line id="k4" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="294.74025974" y1="408.766233766" x2="338.246753247" y2="437.770562771"/></g><g data-layer="30"><line id="k5" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="338.246753247" y1="437.770562771" x2="381.753246753" y2="452.272727273"/></g><g data-layer="30"><line id="k6" data