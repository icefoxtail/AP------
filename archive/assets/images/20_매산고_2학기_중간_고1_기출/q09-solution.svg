<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc">
<title id="title">문항 9 필요충분조건의 진리집합</title>
<desc id="desc">조건에서 R이 Q의 부분집합이고 Q가 P의 부분집합이라는 포함관계를 나타낸다.</desc>
<rect x="1" y="1" width="758" height="458" fill="white" stroke="#222" stroke-width="2"/>

<ellipse cx="380" cy="230" rx="285" ry="165" fill="none" stroke="#222" stroke-width="3"/>
<ellipse cx="380" cy="230" rx="205" ry="115" fill="none" stroke="#444" stroke-width="3"/>
<ellipse cx="380" cy="230" rx="115" ry="65" fill="none" stroke="#666" stroke-width="3"/>
<text x="635" y="145" font-family="sans-serif" font-size="27">P</text>
<text x="555" y="183" font-family="sans-serif" font-size="27">Q</text>
<text x="463" y="224" font-family="sans-serif" font-size="27">R</text>
<text x="380" y="420" font-family="sans-serif" font-size="22" text-anchor="middle">R subset Q subset P</text>

</svg>