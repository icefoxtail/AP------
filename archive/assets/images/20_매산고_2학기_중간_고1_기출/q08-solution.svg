<title id="title">문항 8 일대일대응 조건</title>
<desc id="desc">포물선 y=x²−2x에서 x가 3 이상인 증가 구간을 강조하고 점 (3,3)을 표시한다. 이때 치역도 y가 3 이상이다.</desc>
