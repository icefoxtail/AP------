<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc">
<title id="title">문항 2 두 집합의 인원 분배</title>
<desc id="desc">수학만 좋아하는 학생 20명, 둘 다 좋아하는 학생 30명, 영어만 좋아하는 학생 30명, 둘 다 좋아하지 않는 학생 20명을 나타낸다.</desc>
<rect x="1" y="1" width="758" height="458" fill="white" stroke="#222" stroke-width="2"/>

<circle cx="310" cy="225" r="135" fill="none" stroke="#222" stroke-width="3"/>
<circle cx="455" cy="225" r="135" fill="none" stroke="#222" stroke-width="3"/>
<text x="245" y="112" font-family="sans-serif" font-size="22" text-anchor="middle">Math</text>
<text x="520" y="112" font-family="sans-serif" font-size="22" text-anchor="middle">English</text>
<text x="245" y="235" font-family="sans-serif" font-size="30" text-anchor="middle">20</text>
<text x="382" y="235" font-family="sans-serif" font-size="30" text-anchor="middle">30</text>
<text x="520" y="235" font-family="sans-serif" font-size="30" text-anchor="middle">30</text>
<text x="105" y="390" font-family="sans-serif" font-size="24">Neither = 20</text>
<text x="545" y="390" font-family="sans-serif" font-size="24">Total = 100</text>

</svg>