<title id="title">문항 11 원과 직선의 접점</title>
<desc id="desc">중심이 (−1,−3)인 원이 직선 y=−x+4에 접하고, 접점이 (3,1)이며 최소 r²이 32임을 나타낸다.</desc>
<style>
.text{font-family:'Noto Sans KR', 'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;fill:#111}
.math{font-family:'STIX Two Math', 'Cambria Math', 'Times New Roman', serif;fill:#111}
</style>
<rect x="1" y="1" width="758" height="518" fill="#fff" stroke="#222" stroke-width="1"/>
<!-- Z30 coordinate axes -->
<line x1="40" y1="260" x2="720" y2="260" stroke="#222" stroke-width="1.2" stroke-linecap="round"/>
<line x1="380" y1="480" x2="380" y2="40" stroke="#222" stroke-width="1.2" stroke-linecap="round"/>
<!-- Z50 main geometry: line and circle -->
<line x1="256" y1="40" x2="696" y2="480" stroke="#111" stroke-width="2.05" stroke-linecap="round"/>
<circle cx="356" cy="332" r="135.764502" fill="none" stroke="#111" stroke-width="2.05"/>
<!-- Z20 auxiliary radius -->
<line x1="356" y1="332" x2="452" y2="236" stroke="#777" stroke-width="1.0" stroke-dasharray="4 4"/>
<!-- Z60 points -->
<circle cx="356" cy="332" r="3" fill="#111"/>
<circle cx="452" cy="236" r="3" fill="#111"/>
<!-- Z80 labels -->
<text x="343" y="355" class="math" font-size="13.25" text-anchor="end">C(−1,−3)</text>
<text x="462" y="223" class="math" font-size="13.25">T(3,1)</text>
<text x="555" y="88" class="math" font-size="13.5"><tspan font-style="italic">y</tspan><tspan font-style="normal"> = −</tspan><tspan font-style="italic">x</tspan><tspan font-style="normal"> + 4</tspan></text>
<text x="95" y="465" class="math" font-size="13.25">CT = 4√2, r² = 32</text>
</svg>