<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">두 각을 같은 방법으로 작도한 그림으로, 왼쪽은 점 O를 중심으로 한 호와 반직선 OX, OY 위의 점 A, B를 보여 주고 오른쪽은 점 P를 중심으로 한 호와 반직선 PQ 위의 점 D, 점 D를 중심으로 한 호가 만나는 점 C를 보여 준다.</title><desc id="visual-desc">왼쪽에 각 XOY와 중심 O의 호, 그 호와 두 반직선이 만나는 점 A, B가 있고, 오른쪽에 반직선 PQ와 중심 P의 호 위의 점 D, 중심 D의 호가 P의 호와 만나는 점 C가 있다. P에서 C로 가는 선분도 그려져 있다.</desc><rect width="720" height="400" fill="#fff"/><g data-layer="30"><line id="sOX" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="126.666666667" y1="246.666666667" x2="181.111111111" y2="60"/></g><g data-layer="30"><line id="sOY" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="126.666666667" y1="246.666666667" x2="321.111111111" y2="246.666666667"/></g><g data-layer="30"><line id="sPQ" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="437.777777778" y1="246.666666667" x2="593.333333333" y2="246.666666667"/></g><g data-layer="30"><line id="sPC" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="437.777777778" y1="246.666666667" x2="465" y2="153.333333333"/></g><g data-layer="40"><polyline id="arcO" data-role="circularArc" stroke="#111" stroke-width="2.05" fill="none" data-owner-points="A B" data-center-point="O" data-owner-radius="5.0" data-sweep="CW"