<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 320" width="420" height="320" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">직선 도로의 같은 쪽에 있는 두 마을 A, B와 각 마을에서 도로에 내린 수선의 발, 그리고 두 수선의 발 사이의 거리를 나타낸 그림이다.</title><desc id="visual-desc">수평인 직선 도로가 있고 그 위의 두 점에서 각각 A 마을까지 6 km, B 마을까지 3 km가 수직으로 표시되어 있으며, 두 수선의 발 사이의 거리는 12 km로 표시되어 있다. 두 수선의 발과 도로, 두 마을을 잇는 선분이 그려져 있다.</desc><rect width="420" height="320" fill="#fff"/><g data-layer="30"><line id="sAP" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="93.980507065" y1="101.990253533" x2="93.980507065" y2="218.009746467"/></g><g data-layer="30"><line id="sBQ" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="326.019492935" y1="160" x2="326.019492935" y2="218.009746467"/></g><g data-layer="30"><line id="sPQ" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="93.980507065" y1="218.009746467" x2="326.019492935" y2="218.009746467"/></g><g data-layer="52"><line id="dAP-ext-from" data-role="indicator" stroke="#111" stroke-width="0.8" fill="none" data-mark="dimension" data-mark-id="dAP" data-mark-part="ext-from" x1="89.980507065" y1="101.990253533" x2="66.980507065" y2="101.990253533"/></g><g data-layer="52"><line id="dAP-ext-to" data-role="indicator" stroke="#111" stroke-width="0.8" fill="none" data-mark="dimension" data-mark-id="dAP" data-mar