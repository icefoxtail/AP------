<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 430" width="620" height="430" role="img" aria-labelledby="title desc">
<title id="title">정삼각형 두 개와 SAS 합동</title>
<desc id="desc">B, E, D가 한 직선 위에 있고 ABC와 ADE가 정삼각형이다. 삼각형 ABE와 ACD의 SAS 합동으로 BE와 CD가 같다.</desc>
<style>text{font-family:Arial,sans-serif;font-size:22px}.shape{stroke:#111;stroke-width:3.2;fill:none;stroke-linejoin:round;stroke-linecap:round}.aux{stroke:#555;stroke-width:2.2;fill:none}.note{font-size:19px}</style>
<path class="shape" d="M375 93.397 L100 180 L312.5 374.856 Z"/>
<path class="shape" d="M375 93.397 L425 180 L325 180 Z"/>
<line class="shape" x1="100" y1="180" x2="425" y2="180"/>
<text x="368" y="78">A</text><text x="78" y="188">B</text><text x="304" y="403">C</text><text x="430" y="188">D</text><text x="315" y="207">E</text>
<text x="350" y="142">4 cm</text><text x="215" y="168">BD=13 cm</text>
<text class="note" x="35" y="30">AB=AC, AE=AD, ∠BAE=∠CAD</text>
<text class="note" x="35" y="56">△ABE ≡ △ACD (SAS) ⇒ BE=CD</text>
<text class="note" x="35" y="420">ED=4 cm, BD=13 cm ⇒ BE=9 cm ⇒ CD=9 cm</text>
</svg>