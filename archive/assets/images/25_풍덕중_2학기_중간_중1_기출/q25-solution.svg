<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 560" width="620" height="560" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">칠각형의 일곱 변과 이웃하지 않은 두 꼭짓점을 잇는 열네 대각선</title><desc id="visual-desc">일곱 팀을 각각 점 하나로 나타낸 칠각형이다. 이웃한 팀 사이 일곱 변은 실선이고, 경기할 수 있는 이웃하지 않은 팀의 연결 열네 개는 점선으로 그렸다. 칠각형 안쪽을 채우지 않았다.</desc><rect width="620" height="560" fill="#fff"/><g data-layer="30"><line id="e01" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="310" y1="60.707395498" x2="509.356913183" y2="140.450160772"/></g><g data-layer="30"><line id="e12" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="509.356913183" y1="140.450160772" x2="549.22829582" y2="339.807073955"/></g><g data-layer="30"><line id="e23" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="549.22829582" y1="339.807073955" x2="429.61414791" y2="499.292604502"/></g><g data-layer="30"><line id="e34" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="429.61414791" y1="499.292604502" x2="190.38585209" y2="499.292604502"/></g><g data-layer="30"><line id="e45" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="190.38585209" y1="499.292604502" x2="70.77170418" y2="339.807073955"/></g><g data-layer="30"><line id="e56" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="70.77170418" y1="339.807073955" x2="110