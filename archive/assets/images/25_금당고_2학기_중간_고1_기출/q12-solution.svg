<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" width="640" height="280" role="img" aria-labelledby="title desc" data-scale-policy="SCHEMATIC_ALLOWED">
  <title id="title">두 접선의 교점과 무게중심</title>
  <desc id="desc">원 x²+y²=13 위의 A(2,-3), B(3,2)에서 그은 접선의 교점 P(5,-1)와 삼각형의 무게중심을 나타낸 그림이다.</desc>
  <rect width="640" height="280" fill="#fff"/>
  <text x="320" y="28" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="22" font-weight="700" fill="#1e3a5f">접선의 교점 P  →  세 점의 평균</text>
  <rect x="18" y="44" width="350" height="215" rx="8" fill="#f8fafc" stroke="#dbe3ef"/>
  <line x1="45" y1="166" x2="345" y2="166" stroke="#0f172a" stroke-width="1.4"/><line x1="180" y1="242" x2="180" y2="58" stroke="#0f172a" stroke-width="1.4"/>
  <circle cx="180" cy="166" r="91" fill="#dbeafe" fill-opacity=".55" stroke="#2563eb" stroke-width="2.4"/>
  <line x1="230" y1="232" x2="305" y2="176" stroke="#0f766e" stroke-width="2.2"/><line x1="255" y1="122" x2="305" y2="176" stroke="#f97316" stroke-width="2.2"/>
  <path d="M230 232 L255 122 L305 176 Z" fill="#fde68a" fill-opacity=".35" stroke="#64748b" stroke-width="1.4"/>
  <circle cx="230" cy="232" r="4.5" fill="#0f766e"/><circle cx="255" cy="122" r="4.5" fill="#f97316"/><circle cx="305" cy="176" r="5" fill="#dc2626"/><circle cx="263" cy="177" r="4" fill="#7c3aed"/>
  <text x="211" y="253" font-family="Arial, sans-serif" font-size="16" fill="#0f766e">A(2,−3)</text><text x="260" y="115" font-family="Arial, sans-serif" font-size="16" fill="#c2410c">B(3,2)</text><text x="311" y="172" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#b91c1c">P(5,−1)</text><text x="270" y="193" font-family="Arial, sans-serif" font-size="15" fill="#6d28d9">G</text>
  <rect x="390" y="44" width="232" height="215" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="410" y="77" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="18" font-weight="700" fill="#1e3a5f">접선 공식</text>
  <text x="410" y="113" font-family="Arial, sans-serif" font-size="17">2x−3y=13</text><text x="410" y="143" font-family="Arial, sans-serif" font-size="17">3x+2y=13</text><text x="410" y="174" font-family="Arial, sans-serif" font-size="17">P=(5,−1)</text>
  <line x1="410" y1="188" x2="600" y2="188" stroke="#cbd5e1"/>
  <text x="410" y="218" font-family="Arial, sans-serif" font-size="16">G=(10/3,−2/3)</text><text x="410" y="245" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="17" font-weight="700" fill="#b91c1c">정답 ③</text>
</svg>
