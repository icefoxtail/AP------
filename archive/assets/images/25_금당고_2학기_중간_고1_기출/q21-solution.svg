<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" width="640" height="280" role="img" aria-labelledby="title desc">
  <title id="title">접점 현으로 구하는 삼각형 넓이</title>
  <desc id="desc">점 P(-4,2)에서 중심 C(2,-1), 반지름 3인 원에 그은 두 접선과 접점 현 AB를 나타낸 그림이다.</desc>
  <rect width="640" height="280" fill="#fff"/>
  <text x="320" y="28" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="22" font-weight="700" fill="#1e3a5f">AB를 밑변, PM을 높이로 선택</text>
  <rect x="18" y="44" width="360" height="215" rx="8" fill="#f8fafc" stroke="#dbe3ef"/>
  <line x1="55" y1="176" x2="345" y2="176" stroke="#0f172a" stroke-width="1.3"/><line x1="205" y1="242" x2="205" y2="58" stroke="#0f172a" stroke-width="1.3"/>
  <circle cx="250" cy="185" r="57" fill="#dbeafe" fill-opacity=".62" stroke="#2563eb" stroke-width="2.5"/>
  <line x1="85" y1="101" x2="223" y2="146" stroke="#0f766e" stroke-width="2.3"/><line x1="85" y1="101" x2="278" y2="206" stroke="#f97316" stroke-width="2.3"/>
  <line x1="223" y1="146" x2="278" y2="206" stroke="#dc2626" stroke-width="2.5"/><line x1="250" y1="185" x2="250" y2="176" stroke="#7c3aed" stroke-width="2" stroke-dasharray="5 4"/>
  <line x1="85" y1="101" x2="250" y2="185" stroke="#64748b" stroke-width="1.8" stroke-dasharray="6 4"/>
  <circle cx="85" cy="101" r="5" fill="#1d4ed8"/><circle cx="250" cy="185" r="4" fill="#1d4ed8"/><circle cx="223" cy="146" r="4" fill="#0f766e"/><circle cx="278" cy="206" r="4" fill="#f97316"/>
  <text x="48" y="94" font-family="Arial, sans-serif" font-size="16" fill="#1d4ed8">P(−4,2)</text><text x="258" y="190" font-family="Arial, sans-serif" font-size="16" fill="#1d4ed8">C</text><text x="212" y="139" font-family="Arial, sans-serif" font-size="16" fill="#0f766e">A</text><text x="284" y="217" font-family="Arial, sans-serif" font-size="16" fill="#c2410c">B</text><text x="257" y="174" font-family="Arial, sans-serif" font-size="15" fill="#6d28d9">M</text>
  <rect x="400" y="44" width="222" height="215" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="420" y="77" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="18" font-weight="700" fill="#1e3a5f">길이</text>
  <text x="420" y="113" font-family="Arial, sans-serif" font-size="17">AM = 6/√5</text><text x="420" y="143" font-family="Arial, sans-serif" font-size="17">PM = 12/√5</text><text x="420" y="173" font-family="Arial, sans-serif" font-size="16">AB=2AM</text>
  <line x1="420" y1="187" x2="600" y2="187" stroke="#cbd5e1"/>
  <text x="420" y="219" font-family="Arial, sans-serif" font-size="16">넓이 = AM·PM</text><text x="420" y="246" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="17" font-weight="700" fill="#b91c1c">=72/5  →  ⑤</text>
</svg>
