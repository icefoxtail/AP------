<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" width="640" height="280" role="img" aria-labelledby="title desc">
  <title id="title">직각이 되는 꼭짓점 세 경우</title>
  <desc id="desc">고정된 O(0,0), A(6,0)와 원 위의 P에 대해 직각이 O, A, P에 생기는 세 경우를 나누어 조사하는 그림이다.</desc>
  <rect width="640" height="280" fill="#fff"/>
  <text x="320" y="28" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="22" font-weight="700" fill="#1e3a5f">∠O, ∠A, ∠P를 각각 직각으로 조사</text>
  <rect x="18" y="44" width="360" height="215" rx="8" fill="#f8fafc" stroke="#dbe3ef"/>
  <line x1="58" y1="196" x2="342" y2="196" stroke="#0f172a" stroke-width="1.4"/><line x1="122" y1="239" x2="122" y2="59" stroke="#0f172a" stroke-width="1.4"/>
  <circle cx="224" cy="142" r="86" fill="#dbeafe" fill-opacity=".45" stroke="#2563eb" stroke-width="2.4"/>
  <line x1="122" y1="196" x2="284" y2="196" stroke="#64748b" stroke-width="2.2"/><circle cx="122" cy="196" r="5" fill="#1d4ed8"/><circle cx="284" cy="196" r="5" fill="#1d4ed8"/>
  <circle cx="122" cy="110" r="4.5" fill="#dc2626"/><circle cx="284" cy="126" r="4.5" fill="#f97316"/><circle cx="203" cy="56" r="4.5" fill="#7c3aed"/>
  <line x1="122" y1="196" x2="122" y2="110" stroke="#dc2626" stroke-width="1.8"/><line x1="284" y1="196" x2="284" y2="126" stroke="#f97316" stroke-width="1.8"/><line x1="122" y1="196" x2="203" y2="56" stroke="#7c3aed" stroke-width="1.8"/>
  <text x="105" y="216" font-family="Arial, sans-serif" font-size="16">O</text><text x="288" y="216" font-family="Arial, sans-serif" font-size="16">A</text><text x="103" y="105" font-family="Arial, sans-serif" font-size="16" fill="#b91c1c">P</text><text x="290" y="122" font-family="Arial, sans-serif" font-size="16" fill="#c2410c">P</text><text x="208" y="52" font-family="Arial, sans-serif" font-size="16" fill="#6d28d9">P</text>
  <rect x="400" y="44" width="222" height="215" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="420" y="77" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="18" font-weight="700" fill="#1e3a5f">가능한 넓이</text>
  <text x="420" y="114" font-family="Arial, sans-serif" font-size="17">∠O: 24</text><text x="420" y="145" font-family="Arial, sans-serif" font-size="17">∠A: 12, 36</text><text x="420" y="176" font-family="Arial, sans-serif" font-size="17">∠P: 9</text>
  <line x1="420" y1="189" x2="600" y2="189" stroke="#cbd5e1"/>
  <text x="420" y="220" font-family="Arial, sans-serif" font-size="17">M=36,  m=9</text><text x="420" y="247" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="17" font-weight="700" fill="#b91c1c">M+m=45  →  ②</text>
</svg>
