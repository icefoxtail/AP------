<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" width="640" height="260" role="img" aria-labelledby="title desc">
  <title id="title">완전제곱식으로 찾은 원의 중심</title>
  <desc id="desc">방정식 x²+y²-4x-2=0을 표준형으로 바꾼 원의 중심 (2,0)과 반지름 제곱 6을 나타낸 그림이다.</desc>
  <rect width="640" height="260" fill="#fff"/>
  <text x="320" y="28" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="23" font-weight="700" fill="#1e3a5f">x² + y² − 4x − 2 = 0</text>
  <rect x="18" y="44" width="315" height="190" rx="8" fill="#f8fafc" stroke="#dbe3ef"/>
  <g stroke="#e2e8f0" stroke-width="1"><line x1="72" y1="62" x2="72" y2="220"/><line x1="108" y1="62" x2="108" y2="220"/><line x1="144" y1="62" x2="144" y2="220"/><line x1="180" y1="62" x2="180" y2="220"/><line x1="216" y1="62" x2="216" y2="220"/><line x1="252" y1="62" x2="252" y2="220"/><line x1="288" y1="62" x2="288" y2="220"/><line x1="42" y1="94" x2="310" y2="94"/><line x1="42" y1="130" x2="310" y2="130"/><line x1="42" y1="166" x2="310" y2="166"/><line x1="42" y1="202" x2="310" y2="202"/></g>
  <line x1="40" y1="166" x2="312" y2="166" stroke="#0f172a" stroke-width="1.5"/><line x1="180" y1="222" x2="180" y2="58" stroke="#0f172a" stroke-width="1.5"/>
  <circle cx="252" cy="166" r="66" fill="#dbeafe" fill-opacity=".65" stroke="#2563eb" stroke-width="2.6"/>
  <line x1="180" y1="166" x2="252" y2="166" stroke="#dc2626" stroke-width="2" stroke-dasharray="5 4"/>
  <circle cx="180" cy="166" r="3.5" fill="#64748b"/><circle cx="252" cy="166" r="4.5" fill="#1d4ed8"/>
  <text x="258" y="157" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#1d4ed8">C(2,0)</text><text x="195" y="153" font-family="Arial, sans-serif" font-size="15" fill="#b91c1c">√6</text>
  <rect x="360" y="44" width="262" height="190" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="380" y="76" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="19" font-weight="700" fill="#1e3a5f">완전제곱식</text>
  <text x="380" y="115" font-family="Arial, sans-serif" font-size="20">x² − 4x = (x−2)² − 4</text>
  <text x="380" y="153" font-family="Arial, sans-serif" font-size="20">(x−2)² + y² = 6</text>
  <text x="380" y="193" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="17" fill="#475569">중심 (2,0),  r = √6</text>
  <text x="380" y="222" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="18" font-weight="700" fill="#b91c1c">정답 ①</text>
</svg>
