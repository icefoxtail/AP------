<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" width="640" height="280" role="img" aria-labelledby="title desc">
  <title id="title">두 원의 공통현과 삼각형 넓이</title>
  <desc id="desc">두 원 C1과 C2의 중심, 공통현 AB, 그리고 C1의 중심에서 공통현까지의 거리 d를 나타낸 그림이다.</desc>
  <rect width="640" height="280" fill="#fff"/>
  <text x="320" y="28" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="22" font-weight="700" fill="#1e3a5f">공통현 AB  +  중심에서 현까지의 거리 d</text>
  <rect x="18" y="44" width="360" height="215" rx="8" fill="#f8fafc" stroke="#dbe3ef"/>
  <line x1="55" y1="173" x2="345" y2="173" stroke="#0f172a" stroke-width="1.3"/><line x1="184" y1="243" x2="184" y2="56" stroke="#0f172a" stroke-width="1.3"/>
  <circle cx="150" cy="128" r="72" fill="#dbeafe" fill-opacity=".48" stroke="#2563eb" stroke-width="2.5"/><circle cx="250" cy="173" r="91" fill="#dcfce7" fill-opacity=".35" stroke="#059669" stroke-width="2.5"/>
  <line x1="67" y1="95" x2="326" y2="224" stroke="#dc2626" stroke-width="2.4"/>
  <circle cx="150" cy="128" r="4.5" fill="#1d4ed8"/><circle cx="250" cy="173" r="4.5" fill="#047857"/><circle cx="101" cy="112" r="4" fill="#dc2626"/><circle cx="299" cy="199" r="4" fill="#dc2626"/>
  <line x1="150" y1="128" x2="200" y2="153" stroke="#7c3aed" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="118" y="120" font-family="Arial, sans-serif" font-size="16" fill="#1d4ed8">C(−1,2)</text><text x="257" y="168" font-family="Arial, sans-serif" font-size="16" fill="#047857">C₂</text><text x="203" y="148" font-family="Arial, sans-serif" font-size="16" fill="#6d28d9">d</text><text x="76" y="104" font-family="Arial, sans-serif" font-size="16" fill="#b91c1c">A</text><text x="306" y="213" font-family="Arial, sans-serif" font-size="16" fill="#b91c1c">B</text>
  <rect x="400" y="44" width="222" height="215" rx="8" fill="#fff7ed" stroke="#fed7aa"/>
  <text x="420" y="77" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="18" font-weight="700" fill="#9a3412">넓이 조건</text>
  <text x="420" y="113" font-family="Arial, sans-serif" font-size="17">AM=√(10−d²)</text><text x="420" y="143" font-family="Arial, sans-serif" font-size="17">d·√(10−d²)=4</text><text x="420" y="173" font-family="Arial, sans-serif" font-size="17">d²=2 또는 8</text>
  <line x1="420" y1="187" x2="600" y2="187" stroke="#fed7aa"/>
  <text x="420" y="218" font-family="Arial, sans-serif" font-size="16">k=16, 40, 4, 52</text><text x="420" y="246" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="17" font-weight="700" fill="#b91c1c">합 = 112</text>
</svg>
