<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 430" width="820" height="430" preserveAspectRatio="xMidYMid meet" role="img" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-axis-scale-mode="EQUAL_UNIT"><title>삼각형 OAB의 각의 이등분선</title><desc>삼각형 OAB, A에서 OB로 그은 각의 이등분선 AC, 내분비와 무게중심 G를 나타낸다.</desc><style>.axis{font:italic 14px serif;fill:#111827}.label{font:600 13px "Malgun Gothic",sans-serif}.note{font:12px "Malgun Gothic",sans-serif;fill:#334155}.head{font:700 17px "Malgun Gothic",sans-serif;fill:#0f172a}</style><rect width="820" height="430" fill="#fff"/><text x="28" y="32" class="head">삼각형 OAB의 각의 이등분선과 내분</text><text x="28" y="54" class="note">AO:AB=4:5에서 OC:CB=4:5를 얻고 C를 표시</text><rect x="28" y="70" width="530" height="320" rx="12" fill="#fff" stroke="#cbd5e1"/><g stroke="#e5e7eb" stroke-width="1"><line x1="48" y1="110" x2="528" y2="110"/><line x1="48" y1="160" x2="528" y2="160"/><line x1="48" y1="210" x2="528" y2="210"/><line x1="48" y1="260" x2="528" y2="260"/><line x1="48" y1="310" x2="528" y2="310"/><line x1="48" y1="360" x2="528" y2="360"/><line x1="92" y1="90" x2="92" y2="375"/><line x1="142" y1="90" x2="142" y2="375"/><line x1="192" y1="90" x2="192" y2="375"/><line x1="242" y1="90" x2="242" y2="375"/><line x1="292" y1="90" x2="292" y2="375"/><line x1="342" y1="90" x2="342" y2="375"/><line x1="392" y1="90" x2="392" y2="375"/><line x1="442" y1="90" x2="442" y2="375"/><line x1="492" y1="90" x2="492" y2="375"/></g><line x1="48" y1="310" x2="528" y2="310" stroke="#111827" stroke-width="1.4"/><line x1="142" y1="90" x2="142" y2="375" stroke="#111827" stroke-width="1.4"/><text x="518" y="302" class="axis">x</text><text x="150" y="105" class="axis">y</text><polygon points="142,310 342,310 142,160" fill="#dbeafe" fill-opacity=".55" stroke="#2563eb" stroke-width="2.6"/><line data-geometry="segment" x1="342" y1="310" x2="142" y2="243.3" stroke="#dc2626" stroke-width="3"/><line x1="142" y1="243.3" x2="142" y2="310" stroke="#16a34a" stroke-width="5"/><line x1="142" y1="243.3" x2="142" y2="160" stroke="#f59e0b" stroke-width="5"/><circle data-point-label="O" data-point-x="0" data-point-y="0" cx="142" cy="310" r="5" fill="#111827"/><text x="151" y="328" class="label">O(0,0)</text><circle data-point-label="A" data-point-x="4" data-point-y="0" cx="342" cy="310" r="5" fill="#111827"/><text x="350" y="328" class="label">A(4,0)</text><circle data-point-label="B" data-point-x="0" data-point-y="3" cx="142" cy="160" r="5" fill="#111827"/><text x="151" y="153" class="label">B(0,3)</text><circle data-point-label="C" data-point-x="0" data-point-y="1.333333" cx="142" cy="243.3" r="6" fill="#dc2626"/><text x="151" y="236" class="label" fill="#b91c1c">C(0,4/3)</text><circle data-point-label="G" data-point-x="1.333333" data-point-y="1" cx="208.7" cy="260" r="5" fill="#7c3aed"/><text x="217" y="253" class="label" fill="#6d28d9">G(4/3,1)</text><text x="198" y="238" class="note" fill="#b91c1c">AC</text><text x="151" y="228" class="note" fill="#15803d">OC:CB=4:5</text><rect x="582" y="70" width="210" height="320" rx="12" fill="#f8fafc" stroke="#dbe3ef"/><text x="602" y="100" class="head">핵심 관계</text><text x="602" y="138" class="note">삼각형 OAB</text><text x="602" y="166" class="note">AO:AB=4:5</text><text x="602" y="194" class="note">OC:CB=4:5</text><text x="602" y="222" class="note">C=(0,4/3)</text><text x="602" y="250" class="note">G=(4/3,1)</text><text x="602" y="278" class="note">AC는 ∠A의</text><text x="602" y="298" class="note">각의 이등분선</text></svg>
