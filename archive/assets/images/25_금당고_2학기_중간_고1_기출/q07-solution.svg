<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 420" width="840" height="420" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_1" data-geometry-preset="GEOMETRY_STANDARD" data-axis-scale-mode="EQUAL_UNIT" data-fact-hash="74036f4550740fe4640a3471eab3fb0c875d6064027f7f34cf6796f0dd791ac3" data-geometry-fact-hash="74036f4550740fe4640a3471eab3fb0c875d6064027f7f34cf6796f0dd791ac3" data-visual-provenance="deterministic-independent-facts">
  <title id="title">등거리 조건과 직선의 교점</title>
  <desc id="desc">A(-1,2), B(2,0)에서 같은 거리에 있는 점의 자취인 수직이등분선 6x-4y+1=0과 직선 y=2x+1의 교점 P(-3/2,-2)를 표시한 좌표평면</desc>
  <style>
    .title{font:700 18px "Noto Sans KR","Malgun Gothic",sans-serif;fill:#111827}.note{font:12px "Noto Sans KR","Malgun Gothic",sans-serif;fill:#334155}.label{font:700 12px "STIX Two Math","Malgun Gothic",serif}.axis{font:italic 14px "STIX Two Math","Malgun Gothic",serif;fill:#111827}
  </style>
  <rect width="840" height="420" fill="#fff"/><text x="28" y="32" class="title">두 점에서 같은 거리에 있는 점 P</text><text x="28" y="54" class="note">AP=BP의 자취와 주어진 직선의 교점으로 P의 위치를 결정한다.</text>
  <rect x="24" y="70" width="520" height="320" rx="12" fill="#fff" stroke="#cbd5e1"/>
  <g stroke="#e5e7eb" stroke-width="0.8"><line x1="64" y1="70" x2="64" y2="370"/><line x1="104" y1="70" x2="104" y2="370"/><line x1="144" y1="70" x2="144" y2="370"/><line x1="184" y1="70" x2="184" y2="370"/><line x1="224" y1="70" x2="224" y2="370"/><line x1="264" y1="70" x2="264" y2="370"/><line x1="304" y1="70" x2="304" y2="370"/><line x1="344" y1="70" x2="344" y2="370"/><line x1="384" y1="70" x2="384" y2="370"/><line x1="424" y1="70" x2="424" y2="370"/><line x1="464" y1="70" x2="464" y2="370"/><line x1="504" y1="70" x2="504" y2="370"/><line x1="64" y1="70" x2="504" y2="70"/><line x1="64" y1="110" x2="504" y2="110"/><line x1="64" y1="150" x2="504" y2="150"/><line x1="64" y1="190" x2="504" y2="190"/><line x1="64" y1="230" x2="504" y2="230"/><line x1="64" y1="270" x2="504" y2="270"/><line x1="64" y1="310" x2="504" y2="310"/><line x1="64" y1="350" x2="504" y2="350"/></g>
  <line data-geometry="axis-x" x1="64" y1="230" x2="504" y2="230" stroke="#111827" stroke-width="1.4"/><line data-geometry="axis-y" x1="264" y1="70" x2="264" y2="370" stroke="#111827" stroke-width="1.4"/><text x="492" y="222" class="axis">x</text><text x="272" y="84" class="axis">y</text>
  <line data-geometry="line" data-equation="y=2x+1" x1="164" y1="390" x2="324" y2="70" stroke="#2563eb" stroke-width="2.4"/><line data-geometry="line" data-equation="6x−4y+1=0" x1="144" y1="400" x2="364" y2="70" stroke="#dc2626" stroke-width="2.2" stroke-dasharray="7 5"/>
  <line data-geometry="segment" data-relation="AB" x1="224" y1="150" x2="344" y2="230" stroke="#64748b" stroke-width="2"/><circle data-point-label="A(-1,2)" data-point-x="-1" data-point-y="2" cx="224" cy="150" r="5" fill="#111827"/><circle data-point-label="B(2,0)" data-point-x="2" data-point-y="0" cx="344" cy="230" r="5" fill="#111827"/><circle data-point-label="P(-3/2,-2)" data-point-x="-1.5" data-point-y="-2" cx="204" cy="310" r="5" fill="#16a34a"/>
  <text x="174" y="143" class="label">A(−1,2)</text><text x="350" y="246" class="label">B(2,0)</text><text x="138" y="326" class="label" fill="#15803d">P(−3/2,−2)</text><text x="384" y="110" class="note" fill="#1d4ed8">y=2x+1</text><text x="330" y="170" class="note" fill="#b91c1c">6x−4y+1=0</text>
  <rect x="568" y="70" width="248" height="320" rx="12" fill="#f8fafc" stroke="#dbe3ef"/><text x="586" y="101" class="title" style="font-size:15px">핵심 관계</text><text x="586" y="132" class="note">AP=BP</text><text x="586" y="157" class="note">수직이등분선: 6x−4y+1=0</text><text x="586" y="184" class="note">P는 y=2x+1 위</text><text x="586" y="211" class="note">두 직선의 교점</text><text x="586" y="240" class="note">P=(−3/2,−2)</text><line x1="586" y1="258" x2="798" y2="258" stroke="#cbd5e1"/><text x="586" y="290" class="note">a=−3/2, b=−2</text><text x="586" y="318" class="note">a+b=−7/2</text><text x="586" y="357" class="note">A·P·B의 거리 관계를</text><text x="586" y="378" class="note">좌표평면에서 확인</text>
</svg>
