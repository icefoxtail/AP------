<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 420" width="840" height="420" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_1" data-geometry-preset="GEOMETRY_STANDARD" data-axis-scale-mode="EQUAL_UNIT" data-fact-hash="339df610b9736bcfe03a20e9a9c05bcf12b6faf2cc32f4022adc0c8f725b31b8" data-geometry-fact-hash="339df610b9736bcfe03a20e9a9c05bcf12b6faf2cc32f4022adc0c8f725b31b8" data-visual-provenance="deterministic-independent-facts"><title id="title">등거리 조건과 직선의 교점</title><desc id="desc">A(-1,2), B(2,0)에서 같은 거리에 있는 점의 자취인 수직이등분선 6x-4y+1=0과 직선 y=2x+1의 교점 P(-3/2,-2)를 표시한다.</desc><rect width="840" height="420" fill="#fff"/><rect x="16" y="16" width="808" height="388" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><text x="34" y="46" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#0f172a">두 점에서 같은 거리에 있는 점 P</text><text x="34" y="68" font-family="Arial, sans-serif" font-size="13" fill="#475569">수직이등분선과 주어진 직선의 교점으로 P를 결정한다.</text><rect x="32" y="84" width="490" height="286" rx="12" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><g stroke="#e2e8f0" stroke-width="1"><line x1="64" y1="110" x2="504" y2="110"/><line x1="64" y1="150" x2="504" y2="150"/><line x1="64" y1="190" x2="504" y2="190"/><line x1="64" y1="230" x2="504" y2="230"/><line x1="64" y1="270" x2="504" y2="270"/><line x1="64" y1="310" x2="504" y2="310"/><line x1="64" y1="350" x2="504" y2="350"/><line x1="104" y1="100" x2="104" y2="360"/><line x1="144" y1="100" x2="144" y2="360"/><line x1="184" y1="100" x2="184" y2="360"/><line x1="224" y1="100" x2="224" y2="360"/><line x1="264" y1="100" x2="264" y2="360"/><line x1="304" y1="100" x2="304" y2="360"/><line x1="344" y1="100" x2="344" y2="360"/><line x1="384" y1="100" x2="384" y2="360"/><line x1="424" y1="100" x2="424" y2="360"/><line x1="464" y1="100" x2="464" y2="360"/></g><line id="axis-x" x1="64" y1