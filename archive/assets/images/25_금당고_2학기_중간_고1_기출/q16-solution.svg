<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" width="640" height="280" role="img" aria-labelledby="title desc">
  <title id="title">외부점에서 그은 두 접선의 접점 현</title>
  <desc id="desc">원 중심 C(2,-3), 외부점 P(2,5), 접점 A와 B를 연결한 현 AB, 그리고 서로 수직인 대각선 PC와 AB를 나타낸 그림이다.</desc>
  <rect width="640" height="280" fill="#fff"/>
  <text x="320" y="28" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="22" font-weight="700" fill="#1e3a5f">PC ⟂ AB  →  사각형 넓이 = ½·PC·AB</text>
  <rect x="18" y="44" width="360" height="215" rx="8" fill="#f8fafc" stroke="#dbe3ef"/>
  <line x1="70" y1="175" x2="350" y2="175" stroke="#0f172a" stroke-width="1.3"/><line x1="220" y1="245" x2="220" y2="57" stroke="#0f172a" stroke-width="1.3"/>
  <circle cx="220" cy="190" r="75" fill="#dbeafe" fill-opacity=".62" stroke="#2563eb" stroke-width="2.5"/>
  <line x1="220" y1="70" x2="220" y2="190" stroke="#7c3aed" stroke-width="2.2" stroke-dasharray="6 4"/>
  <line x1="220" y1="70" x2="162" y2="192" stroke="#0f766e" stroke-width="2.3"/><line x1="220" y1="70" x2="278" y2="192" stroke="#f97316" stroke-width="2.3"/>
  <line x1="162" y1="192" x2="278" y2="192" stroke="#dc2626" stroke-width="2.4"/>
  <circle cx="220" cy="190" r="4" fill="#1d4ed8"/><circle cx="220" cy="70" r="5" fill="#7c3aed"/><circle cx="162" cy="192" r="4.5" fill="#0f766e"/><circle cx="278" cy="192" r="4.5" fill="#f97316"/>
  <text x="229" y="202" font-family="Arial, sans-serif" font-size="15" fill="#1d4ed8">C</text><text x="229" y="67" font-family="Arial, sans-serif" font-size="16" fill="#6d28d9">P(2,5)</text><text x="137" y="210" font-family="Arial, sans-serif" font-size="16" fill="#0f766e">A</text><text x="283" y="210" font-family="Arial, sans-serif" font-size="16" fill="#c2410c">B</text>
  <rect x="400" y="44" width="222" height="215" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="420" y="77" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="18" font-weight="700" fill="#1e3a5f">길이와 넓이</text>
  <text x="420" y="113" font-family="Arial, sans-serif" font-size="17">PC=8</text><text x="420" y="143" font-family="Arial, sans-serif" font-size="17">AB=5√39/4</text><text x="420" y="173" font-family="Arial, sans-serif" font-size="16">PC ⟂ AB</text>
  <line x1="420" y1="187" x2="600" y2="187" stroke="#cbd5e1"/>
  <text x="420" y="219" font-family="Arial, sans-serif" font-size="16">½·8·(5√39/4)</text><text x="420" y="246" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="17" font-weight="700" fill="#b91c1c">= 5√39  →  ④</text>
</svg>
