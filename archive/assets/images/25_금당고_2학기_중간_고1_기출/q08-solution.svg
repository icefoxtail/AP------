<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" width="640" height="260" role="img" aria-labelledby="title desc" data-scale-policy="SCHEMATIC_ALLOWED">
  <title id="title">반지름 조건과 자연수 k</title>
  <desc id="desc">중심 (2k,3), 반지름 제곱 3k²+4인 원에서 반지름이 5 이하가 되는 자연수 k의 범위를 나타낸 그림이다.</desc>
  <rect width="640" height="260" fill="#fff"/>
  <text x="320" y="28" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="22" font-weight="700" fill="#1e3a5f">r² = 3k² + 4,  중심 C(2k, 3)</text>
  <rect x="18" y="45" width="300" height="188" rx="8" fill="#f8fafc" stroke="#dbe3ef"/>
  <line x1="45" y1="171" x2="292" y2="171" stroke="#0f172a" stroke-width="1.4"/><line x1="143" y1="215" x2="143" y2="64" stroke="#0f172a" stroke-width="1.4"/>
  <circle cx="175" cy="125" r="45" fill="#dbeafe" fill-opacity=".62" stroke="#2563eb" stroke-width="2.3"/><circle cx="143" cy="171" r="3.5" fill="#64748b"/>
  <circle cx="207" cy="125" r="39" fill="#dcfce7" fill-opacity=".6" stroke="#059669" stroke-width="2.3"/>
  <circle cx="175" cy="125" r="4" fill="#2563eb"/><circle cx="207" cy="125" r="4" fill="#059669"/>
  <text x="91" y="102" font-family="Arial, sans-serif" font-size="16" fill="#2563eb">k=1: C(2,3)</text><text x="190" y="102" font-family="Arial, sans-serif" font-size="16" fill="#047857">k=2: C(4,3)</text>
  <text x="58" y="219" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="15" fill="#475569">두 경우 모두 r ≤ 5</text>
  <rect x="345" y="45" width="277" height="188" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="365" y="76" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="18" font-weight="700" fill="#1e3a5f">부등식으로 선별</text>
  <text x="365" y="113" font-family="Arial, sans-serif" font-size="19">3k² + 4 ≤ 25</text>
  <text x="365" y="148" font-family="Arial, sans-serif" font-size="19">k² ≤ 7  →  k = 1, 2</text>
  <text x="365" y="183" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="16" fill="#475569">자연수 k ≥ 1</text>
  <text x="365" y="216" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="18" font-weight="700" fill="#b91c1c">2개  →  ⑤</text>
</svg>
