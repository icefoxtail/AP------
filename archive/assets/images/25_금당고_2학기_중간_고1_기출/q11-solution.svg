<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" width="640" height="260" role="img" aria-labelledby="title desc" data-scale-policy="SCHEMATIC_ALLOWED">
  <title id="title">원과 만나지 않는 직선의 경계</title>
  <desc id="desc">중심 (2,-1), 반지름 루트10인 원과 접하는 k=3 직선, 원을 지나지 않는 k=4 직선을 비교한 그림이다.</desc>
  <rect width="640" height="260" fill="#fff"/>
  <text x="320" y="28" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="22" font-weight="700" fill="#1e3a5f">중심에서 직선까지의 거리  vs  반지름</text>
  <rect x="18" y="45" width="330" height="188" rx="8" fill="#f8fafc" stroke="#dbe3ef"/>
  <line x1="42" y1="165" x2="326" y2="165" stroke="#0f172a" stroke-width="1.4"/><line x1="190" y1="220" x2="190" y2="60" stroke="#0f172a" stroke-width="1.4"/>
  <circle cx="225" cy="184" r="55" fill="#dbeafe" fill-opacity=".65" stroke="#2563eb" stroke-width="2.5"/><circle cx="225" cy="184" r="4" fill="#1d4ed8"/>
  <line x1="53" y1="223" x2="326" y2="71" stroke="#dc2626" stroke-width="2.4"/><line x1="53" y1="208" x2="326" y2="56" stroke="#f97316" stroke-width="2.4" stroke-dasharray="7 4"/>
  <circle cx="247" cy="172" r="4" fill="#dc2626"/>
  <text x="236" y="201" font-family="Arial, sans-serif" font-size="15" fill="#1d4ed8">C(2,−1)</text><text x="253" y="165" font-family="Arial, sans-serif" font-size="15" fill="#b91c1c">k=3 접점</text><text x="249" y="144" font-family="Arial, sans-serif" font-size="15" fill="#c2410c">k=4</text>
  <rect x="375" y="45" width="247" height="188" rx="8" fill="#fff7ed" stroke="#fed7aa"/>
  <text x="395" y="77" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="18" font-weight="700" fill="#9a3412">자연수 k</text>
  <text x="395" y="114" font-family="Arial, sans-serif" font-size="18">|k+7| / √10 &gt; √10</text>
  <text x="395" y="149" font-family="Arial, sans-serif" font-size="19">k+7 &gt; 10  →  k &gt; 3</text>
  <text x="395" y="184" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="16" fill="#475569">k=3은 접하는 경계</text>
  <text x="395" y="216" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="18" font-weight="700" fill="#b91c1c">최소값 4  →  ④</text>
</svg>
