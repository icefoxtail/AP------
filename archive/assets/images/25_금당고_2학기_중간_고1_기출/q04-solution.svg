<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" width="640" height="260" role="img" aria-labelledby="title desc">
  <title id="title">원에 접하는 두 평행선</title>
  <desc id="desc">원점 중심, 반지름 루트10인 원과 기울기 3인 두 접선 y=3x+10, y=3x-10을 비교한 그림이다.</desc>
  <rect width="640" height="260" fill="#fff"/>
  <text x="320" y="28" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="22" font-weight="700" fill="#1e3a5f">y = 3x + k  와  x² + y² = 10</text>
  <rect x="18" y="44" width="330" height="190" rx="8" fill="#f8fafc" stroke="#dbe3ef"/>
  <g stroke="#e2e8f0" stroke-width="1"><line x1="65" y1="60" x2="65" y2="221"/><line x1="105" y1="60" x2="105" y2="221"/><line x1="145" y1="60" x2="145" y2="221"/><line x1="185" y1="60" x2="185" y2="221"/><line x1="225" y1="60" x2="225" y2="221"/><line x1="265" y1="60" x2="265" y2="221"/><line x1="305" y1="60" x2="305" y2="221"/><line x1="42" y1="100" x2="326" y2="100"/><line x1="42" y1="140" x2="326" y2="140"/><line x1="42" y1="180" x2="326" y2="180"/><line x1="42" y1="220" x2="326" y2="220"/></g>
  <line x1="40" y1="180" x2="330" y2="180" stroke="#0f172a" stroke-width="1.4"/><line x1="185" y1="225" x2="185" y2="55" stroke="#0f172a" stroke-width="1.4"/>
  <circle cx="185" cy="180" r="61" fill="#dbeafe" fill-opacity=".68" stroke="#2563eb" stroke-width="2.5"/>
  <line x1="52" y1="202" x2="315" y2="56" stroke="#0f766e" stroke-width="2.4"/><line x1="52" y1="242" x2="315" y2="96" stroke="#f97316" stroke-width="2.4"/>
  <circle cx="185" cy="180" r="4" fill="#1d4ed8"/><circle cx="222" cy="118" r="4" fill="#0f766e"/><circle cx="222" cy="158" r="4" fill="#f97316"/>
  <text x="194" y="176" font-family="Arial, sans-serif" font-size="16" fill="#1d4ed8">O</text><text x="235" y="113" font-family="Arial, sans-serif" font-size="15" fill="#0f766e">k=10</text><text x="235" y="157" font-family="Arial, sans-serif" font-size="15" fill="#c2410c">k=−10</text>
  <rect x="375" y="44" width="247" height="190" rx="8" fill="#fff7ed" stroke="#fed7aa"/>
  <text x="395" y="77" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="18" font-weight="700" fill="#9a3412">접선 조건</text>
  <text x="395" y="115" font-family="Arial, sans-serif" font-size="18">|k| / √10 = √10</text>
  <text x="395" y="151" font-family="Arial, sans-serif" font-size="19">k = ±10</text>
  <text x="395" y="187" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="16" fill="#475569">두 직선은 평행</text>
  <text x="395" y="219" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="18" font-weight="700" fill="#b91c1c">합 = 0  →  ③</text>
</svg>
