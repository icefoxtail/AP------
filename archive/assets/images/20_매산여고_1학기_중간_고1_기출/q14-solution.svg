<svg xmlns="http://www.w3.org/2000/svg" width="820" height="395" viewBox="0 0 820 395" role="img" aria-label="직각삼각형 ABC 안에 넓이가 최대인 직사각형 EBFD. BF는 10, EB는 4이며 BC는 20, AB는 8">
 <title>직각삼각형의 내접 직사각형: 넓이 최대</title>
 <rect width="820" height="395" fill="#fff"/>
 <!-- AB=8 mapped to 240 pixels and BC=20 mapped to 600 pixels; at x=10, EB=4 mapped 120 -->
 <polygon points="96,70 96,310 696,310" fill="#f8fbff" stroke="#344054" stroke-width="3" stroke-linejoin="round"/>
 <rect x="96" y="190" width="300" height="120" fill="#dbeafe" stroke="#1260a0" stroke-width="3"/>
 <path d="M96 292 H114 V310" fill="none" stroke="#344054" stroke-width="2"/>
 <circle cx="96" cy="70" r="4" fill="#344054"/><circle cx="96" cy="310" r="4" fill="#344054"/><circle cx="696" cy="310" r="4" fill="#344054"/>
 <circle cx="96" cy="190" r="4" fill="#1260a0"/><circle cx="396" cy="310" r="4" fill="#1260a0"/><circle cx="396" cy="190" r="4" fill="#1260a0"/>
 <g font-family="Arial,'Noto Sans KR',sans-serif" font-size="22" fill="#101828">
 <text x="76" y="61">A</text><text x="70" y="335">B</text><text x="706" y="331">C</text>
 <text x="68" y="189">E</text><text x="401" y="334">F</text><text x="404" y="180">D</text>
 <text x="51" y="128">8</text><text x="56" y="254" fill="#1260a0">4</text>
 <text x="230" y="342" fill="#1260a0">10</text>
 <text x="190" y="251" fill="#1260a0">넓이 40</text>
 </g>
 <path d="M43 70 V310 M35 70 H51 M35 310 H51" fill="none" stroke="#8c97a6" stroke-width="1.8"/>
 <path d="M96 360 H696 M96 352 V368 M696 352 V368" fill="none" stroke="#8c97a6" stroke-width="1.8"/>
 <text x="348" y="388" font-family="Arial,'Noto Sans KR',sans-serif" font-size="19" fill="#344054">BC=20</text>
 <text x="367" y="58" font-family="Arial,'Noto Sans KR',sans-serif" font-size="18" fill="#344054">넓이 최대: BF=10, EB=4, 둘레 28</text>
</svg>
