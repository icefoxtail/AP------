<svg xmlns="http://www.w3.org/2000/svg" width="520" height="340" viewBox="0 0 520 340" role="img" aria-label="물받이의 U자형 단면: 양쪽 높이 각 3 cm, 밑면 너비 6 cm, 물이 채워지는 단면 넓이 18 제곱센티미터">
 <title>물받이 단면의 최대 넓이</title>
 <rect width="520" height="340" fill="#fff"/>
 <!-- 3 cm = 60px each vertical; 6 cm = 120px base (20px per cm). -->
 <path d="M145 164 V224 H265 V164" fill="none" stroke="#344054" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
 <rect x="148" y="164" width="114" height="57" fill="#dbeafe" opacity=".96"/>
 <path d="M145 164 V224 H265 V164" fill="none" stroke="#1260a0" stroke-width="3" stroke-linejoin="round"/>
 <path d="M111 164 V224 M105 164 H117 M105 224 H117 M145 253 H265 M145 247 V259 M265 247 V259" fill="none" stroke="#64748b" stroke-width="1.8"/>
 <g font-family="Arial,'Noto Sans KR',sans-serif" fill="#101828" font-size="21">
 <text x="82" y="199">3</text><text x="197" y="277">6</text><text x="303" y="197">3</text>
 <text x="160" y="199" font-size="19" fill="#1260a0">넓이 18</text>
 <text x="70" y="53">폭 12 = 3 + 6 + 3</text>
 <text x="70" y="315" font-size="19" fill="#344054">단면적 S = x(12 - 2x), 최대는 x = 3</text>
 </g>
 <path d="M291 164 V224 M284 164 H298 M284 224 H298" fill="none" stroke="#64748b" stroke-width="1.5"/>
</svg>
