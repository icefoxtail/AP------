<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 390" role="img" aria-label="직사각형과 사분원의 넓이 비교"><rect width="520" height="390" fill="white"/><g fill="none" stroke="currentColor" stroke-width="3"><rect x="80" y="50" width="205" height="220"/><path d="M80 50 A220 220 0 0 1 300 270"/><path d="M80 270 H330"/><path d="M80 50 V270"/></g><g fill="currentColor" font-family="Arial,sans-serif" font-size="21"><text x="60" y="45">A</text><text x="60" y="294">B</text><text x="290" y="294">C</text><text x="290" y="45">D</text><text x="62" y="167">8</text><text x="150" y="294">BC</text><text x="176" y="112">S₁</text><text x="294" y="220">S₂</text></g><g fill="currentColor" font-family="Arial,sans-serif" font-size="18"><text x="24" y="326">S1 = S2 implies rectangle area = quadrant area</text><text x="24" y="354">8 × BC = (1/4)π × 8² = 16π</text><text x="24" y="382">Therefore BC = 2π</text></g></svg>