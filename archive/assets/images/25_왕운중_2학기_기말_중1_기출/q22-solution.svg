<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 430" role="img" aria-label="직사각형과 사분원의 넓이 비교">
  <rect width="520" height="430" fill="white"/>
  <path d="M90 60 L251 60 L251 138 A205 205 0 0 0 90 60 Z" fill="#dbeafe"/>
  <path d="M251 138 L251 265 L295 265 A205 205 0 0 1 251 138 Z" fill="#fee2e2"/>
  <g fill="none" stroke="#111" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M90 60 H251 V265 H90 Z"/>
    <path d="M90 60 A205 205 0 0 1 295 265"/>
    <path d="M90 265 H295"/>
    <path d="M90 60 V265"/>
  </g>
  <g fill="#111" font-family="sans-serif" font-size="18">
    <text x="73" y="52">A</text>
    <text x="72" y="287">B</text>
    <text x="248" y="287">C</text>
    <text x="253" y="52">D</text>
    <text x="255" y="132">F</text>
    <text x="299" y="270">E</text>
    <text x="62" y="169">8</text>
    <text x="157" y="289">BC</text>
    <text x="211" y="91">S₁</text>
    <text x="264" y="218">S₂</text>
  </g>
  <g fill="#111" font-family="sans-serif" font-size="17">
    <text x="20" y="333">S₁ = S₂ 이므로 직사각형 넓이 = 사분원 넓이</text>
    <text x="20" y="366">8×BC = (1/4)×π×8² = 16π</text>
    <text x="20" y="399">따라서 BC = 2π</text>
  </g>
</svg>