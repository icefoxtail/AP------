<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" role="img" aria-label="사각뿔대의 겉넓이 계산">
  <rect width="600" height="450" fill="white"/>
  <g fill="none" stroke="#111" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
    <path d="M180 60 L320 60 L360 100 L220 100 Z"/>
    <path d="M220 100 L360 100 L430 245 L150 245 Z"/>
    <path d="M180 60 L70 165 L150 245 M320 60 L350 165 L430 245"/>
    <path d="M290 100 V245" stroke-dasharray="7 6" stroke-width="2"/>
    <path d="M290 226 H309 V245" stroke-width="2"/>
  </g>
  <g fill="#111" font-family="sans-serif" font-size="20">
    <text x="264" y="52">6 cm</text>
    <text x="270" y="274">12 cm</text>
    <text x="302" y="169">x cm</text>
  </g>
  <g fill="#111" font-family="sans-serif" font-size="18">
    <text x="25" y="318">한 옆면 넓이 = ((6+12)/2)×x = 9x</text>
    <text x="25" y="353">두 정사각형 밑면과 네 옆면을 더하면</text>
    <text x="25" y="388">6² + 12² + 4×9x = 504</text>
    <text x="25" y="423">x = 9</text>
  </g>
</svg>