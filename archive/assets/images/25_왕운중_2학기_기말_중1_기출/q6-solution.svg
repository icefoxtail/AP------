<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" role="img" aria-label="같은 중심각과 두 현의 관계">
  <rect width="560" height="430" fill="white"/>
  <g fill="none" stroke="#111" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="210" cy="175" r="125"/>
    <path d="M210 175 L320 115 M210 175 L335 175 M210 175 L320 235"/>
    <path d="M320 115 L335 175 L320 235 L320 115"/>
    <path d="M240 159 A34 34 0 0 1 244 175 M244 175 A34 34 0 0 1 240 191" stroke-width="2"/>
  </g>
  <g fill="#111" font-family="sans-serif">
    <circle cx="210" cy="175" r="4"/>
    <text x="184" y="170" font-size="20">O</text>
    <text x="323" y="110" font-size="20">A</text>
    <text x="342" y="182" font-size="20">B</text>
    <text x="323" y="256" font-size="20">C</text>
    <text x="245" y="158" font-size="16">θ</text>
    <text x="245" y="197" font-size="16">θ</text>
    <text x="24" y="350" font-size="17">같은 중심각이므로 호 AB = 호 BC, 현 AB = 현 BC</text>
    <text x="24" y="379" font-size="17">AC &lt; AB + BC = 2BC (삼각형의 두 변의 길이의 합)</text>
    <text x="24" y="408" font-size="17">부채꼴 AOC의 넓이는 부채꼴 AOB의 2배</text>
  </g>
</svg>