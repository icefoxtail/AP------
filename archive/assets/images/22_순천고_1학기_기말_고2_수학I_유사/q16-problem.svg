<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 600" width="720" height="600" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">곧은 길 위의 두 지점 P, Q와 두 건물 A, B의 위치를 나타낸 그림이다. P와 Q에서 진행 방향을 기준으로 두 건물을 바라본 각이 각각 표시되어 있다.</title><desc id="visual-desc">곧은 길이 세로로 놓여 있고 아래쪽에 P, 그 위에 Q가 있다. P에서 왼쪽 위 방향으로 A, 오른쪽 위 방향으로 B가 있으며, Q에서 A는 왼쪽 위로, B는 오른쪽으로 이어진다. P에서 진행 방향과 PA가 이루는 각은 15도, PQ와 PB가 이루는 각은 45도이고, Q에서 진행 방향과 QA가 이루는 각은 60도이며 진행 방향과 QB는 직각이다.</desc><rect width="720" height="600" fill="#fff"/><g data-layer="12"><polygon id="aPA-sector" data-role="angleSector" stroke="none" stroke-width="1.6" fill="#d9d9d9" data-owner-points="A P Q" data-mark="angle" data-mark-id="aPA" data-mark-index="0" data-mark-count="1" data-mark-side="INNER" points="251.043211841,539.285714286 243.796278578,512.23979115 244.239766804,512.124839196 244.685076476,512.017158866 245.132088375,511.916778987 245.580682825,511.823726434 246.030739725,511.73802612 246.482138586,511.659700987 246.934758556,511.588772007 247.388478459,511.525258167 247.843176822,511.469176473 248.298731912,511.420541939 248.755021765,511.379367585 249.211924223,511.345664435 249.66931696,511.319441512 250.127077522,511.300705836 250.585083355,511.289462424 251.043211841,511.285714286"/></g><g data-layer="12"><polygon id="aPB-sector" data-role="angleSector" stroke="none" stroke-width="1.6" fil