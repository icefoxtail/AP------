<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" role="img" aria-labelledby="title desc"><title id="title">서로 교차하는 길과 남은 네 조각</title><desc id="desc">직사각형 화단의 가로는 3a−7 m, 세로는 4a+1 m이다. 세로 방향 폭 1 m와 가로 방향 폭 2 m의 길이 가운데에서 교차한다.</desc><rect width="760" height="440" fill="white" /><rect x="92" y="84" width="300" height="165" fill="#dcebe0" stroke="#28364b" stroke-width="1.8" /><rect x="416" y="84" width="151" height="165" fill="#dcebe0" stroke="#28364b" stroke-width="1.8" /><rect x="92" y="297" width="300" height="64" fill="#dcebe0" stroke="#28364b" stroke-width="1.8" /><rect x="416" y="297" width="151" height="64" fill="#dcebe0" stroke="#28364b" stroke-width="1.8" /><rect x="392" y="84" width="24" height="277" fill="#d3e5f8" stroke="#205d9c" stroke-width="1.8" /><rect x="92" y="249" width="475" height="48" fill="#f4dbc2" stroke="#aa5411" stroke-width="1.8" /><rect x="392" y="249" width="24" height="48" fill="#e0c4ee" stroke="#67458e" stroke-width="1.8" /><rect x="92" y="84" width="475" height="277" fill="none" stroke="#28364b" stroke-width="2.4" /><line x1="92.0000" y1="55.0000" x2="567.0000" y2="55.0000" stroke="#28364b" stroke-width="1.55" stroke-linecap="round" /><line x1="92.0000" y1="49.0000" x2="92.0000" y2="61.0000" stroke="#28364b" stroke-width="1.55" stroke-linecap="round" /><line x1="567.0000" y1="49.0000" x2="567.0000" y2="61.0000" stroke="#28364b" stroke-width="1.55" stroke-linecap="round" /><text x="329.5000" y="42.0000" font-size="31" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">(3a − 7) m</text><line x1="588.0000" y1="84.0000" x2="588.0000" y2="361.0000" stroke="#28364b" stroke-width="1.55" stroke-linecap="round" /><line x1="582.0000" y1="84.0000" x2="594.0000" y2="84.0000" stroke="#28364b" stroke-width="1.55" stroke-linecap="round" /><line x1="582.0000" y1="361.0000" x2="594.0000" y2="361.0000" stroke="#28364b" stroke-width="1.55" stroke-linecap="round" /><text x="601.0000" y="232.5000" font-size="30" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="start">(4a + 1) m</text><line x1="392.0000" y1="376.0000" x2="416.0000" y2="376.0000" stroke="#205d9c" stroke-width="1.55" stroke-linecap="round" /><line x1="392.0000" y1="370.0000" x2="392.0000" y2="382.0000" stroke="#205d9c" stroke-width="1.55" stroke-linecap="round" /><line x1="416.0000" y1="370.0000" x2="416.0000" y2="382.0000" stroke="#205d9c" stroke-width="1.55" stroke-linecap="round" /><text x="404.0000" y="408.0000" font-size="31" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#205d9c" text-anchor="middle">1 m</text><line x1="79.0000" y1="249.0000" x2="79.0000" y2="297.0000" stroke="#aa5411" stroke-width="1.6" stroke-linecap="round" /><line x1="73.0000" y1="249.0000" x2="85.0000" y2="249.0000" stroke="#aa5411" stroke-width="1.6" stroke-linecap="round" /><line x1="73.0000" y1="297.0000" x2="85.0000" y2="297.0000" stroke="#aa5411" stroke-width="1.6" stroke-linecap="round" /><text x="42.0000" y="281.0000" font-size="30" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#aa5411" text-anchor="middle">2 m</text></svg>
