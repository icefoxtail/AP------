<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 460" width="480" height="460" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">한 변의 길이가 6인 정육각형에서 한 변의 중점을 잡고, 마주 보는 꼭짓점에서 그 중점으로 선분을 그은 그림이다. 그 꼭짓점과 중점이 이루는 각을 세타로 표시하였다.</title><desc id="visual-desc">정육각형의 여섯 변이 그려져 있고, 오른쪽 위 한 변의 중점에 표시가 있다. 왼쪽 위 꼭짓점에서 그 중점으로 선분이 이어지고 두 선분 사이의 각에 세타 표시가 있다. 한 변의 길이는 6으로 적혀 있다.</desc><rect width="480" height="460" fill="#fff"/><g data-layer="12"><polygon id="aM-sector" data-role="angleSector" stroke="none" stroke-width="1.6" fill="#d9d9d9" data-owner-points="A M F" data-mark="angle" data-mark-id="aM" data-mark-index="0" data-mark-count="1" data-mark-side="INNER" points="100.714285714,149.583355363 105.101373347,172.379331396 104.080468707,172.552288148 103.052866966,172.679547667 102.020612562,172.760856768 100.98575919,172.796053685 99.950365716,172.785068391 98.916492079,172.727922744 97.886195194,172.624730435 96.861524861,172.475696769 95.844519688,172.28111825 94.837203028,172.041381998 93.841578963,171.756964973 92.859628309,171.42843303 91.893304681,171.056439791 90.944530603,170.641725345 90.015193682,170.185114776 89.107142857,169.687516522"/></g><g data-layer="30"><line id="sAB" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="147.142857143" y1="390.833289274" x2="332.857142857" y2="390.833289274"/></g><g data-layer="30"