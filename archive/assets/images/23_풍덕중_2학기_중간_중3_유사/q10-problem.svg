<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 400" width="480" height="400" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">반지름이 10인 사분원에서 중심 O를 지나는 두 직선이 반지름 OC와 각 x를 이룬다. 선분 AB와 CD가 각각 수평 반지름에 수직인 두 직각삼각형 OAB, OCD가 사다리꼴 ABCD를 만든다.</title><desc id="visual-desc">사분원의 중심 O에서 수평 반지름 OC가 오른쪽으로 놓여 있고, 점 A에서 수평 반지름에 내린 수선의 발이 B, 점 D에서 내린 수선의 발이 C이다. 선분 OA 옆에 10, 각 COA에 x, 점 B와 C에 직각 표시가 있다.</desc><rect width="480" height="400" fill="#fff"/><g data-layer="12"><polygon id="angx-sector" data-role="angleSector" stroke="none" stroke-width="1.6" fill="#d9d9d9" data-owner-points="C O A" data-mark="angle" data-mark-id="angx" data-mark-index="0" data-mark-count="1" data-mark-side="INNER" points="90,350 118,350 117.977357304,348.87417663 117.909465839,347.750174094 117.796435406,346.629810281 117.638448814,345.514897196 117.43576158,344.407238026 117.188701519,343.308624227 116.897668207,342.220832628 116.563132345,341.145622552 116.185634989,340.084732973 115.765786678,339.039879707 115.304266449,338.012752631 114.801820734,337.005012955 114.259262156,336.018290531 113.677468214,335.054181221 113.057379865,334.114244313 112.4,333.2"/></g><g data-layer="30"><line id="sOA" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="90" y1="350" x2="330" y2="170"/></g><g data-layer="30"><line id="sAD" data-role="line" stroke="#111" strok