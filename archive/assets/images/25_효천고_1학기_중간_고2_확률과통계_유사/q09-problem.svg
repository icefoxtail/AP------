<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 430" width="480" height="430" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">원판이 10개의 같은 크기 영역으로 나뉘어 있고, 빨강 두 영역과 주황 두 영역이 각각 마주 보는 자리에 칠해져 있으며 나머지 여섯 영역은 비어 있다.</title><desc id="visual-desc">원판이 10등분되어 있고, 빨강으로 칠한 두 영역과 주황으로 칠한 두 영역이 각각 원의 중심을 사이에 두고 마주 보고 있으며, 나머지 여섯 영역은 칠해지지 않은 그림이다.</desc><rect width="480" height="430" fill="#fff"/><g data-layer="10"><path id="red1" data-role="region" stroke="none" stroke-width="1.6" fill="#e98aa8" data-owner-points="O V0 V1" data-mark="region" data-mark-id="red1" fill-opacity="0.42" fill-rule="evenodd" d="M240 215 L395.395841502 164.508830383 A163.392857143 163.392857143 0 0 0 336.039911759 82.812401812 L240 215 Z"/></g><g data-layer="10"><path id="red2" data-role="region" stroke="none" stroke-width="1.6" fill="#e98aa8" data-owner-points="O V5 V6" data-mark="region" data-mark-id="red2" fill-opacity="0.42" fill-rule="evenodd" d="M240 215 L84.604158498 265.491169617 A163.392857143 163.392857143 0 0 0 143.960088241 347.187598188 L240 215 Z"/></g><g data-layer="10"><path id="orange1" data-role="region" stroke="none" stroke-width="1.6" fill="#f2a65a" data-owner-points="O V2 V3" data-mark="region" data-mark-id="orange1" fill-opacity="0.42" fill-rule="evenodd" d="M240 215 L240 51.607142857 A163.392857143 163.392857143 0 0 0 143.960088241 82.81240181