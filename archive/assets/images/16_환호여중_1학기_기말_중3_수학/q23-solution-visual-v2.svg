<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 683 514" width="683" height="514" role="img" aria-labelledby="title desc"><title id="title">선분을 둘로 나누어 만든 두 정사각형</title><desc id="desc">가로 선분 BE 위의 C에서 둘로 나누었다. 왼쪽 BC와 오른쪽 CE를 밑변으로 두 정사각형을 같은 쪽에 나란히 세웠다. 전체 밑변 BE의 길이는 7 cm이다.</desc><rect width="683" height="514" fill="white" /><rect x="75" y="126" width="272" height="272" fill="#e5effa" stroke="#205d9c" stroke-width="4.3" /><rect x="347" y="194" width="204" height="204" fill="#f8ead8" stroke="#aa5411" stroke-width="4.3" /><circle cx="75" cy="398" r="4.3" fill="#28364b" /><text x="60.0000" y="421.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">B</text><circle cx="347" cy="398" r="4.3" fill="#28364b" /><text x="345.0000" y="425.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">C</text><circle cx="551" cy="398" r="4.3" fill="#28364b" /><text x="567.0000" y="421.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">E</text><line x1="75.0000" y1="447.0000" x2="551.0000" y2="447.0000" stroke="#4d5d72" stroke-width="1.8" stroke-linecap="round" /><line x1="75.0000" y1="441.0000" x2="75.0000" y2="453.0000" stroke="#4d5d72" stroke-width="1.8" stroke-linecap="round" /><line x1="551.0000" y1="441.0000" x2="551.0000" y2="453.0000" stroke="#4d5d72" stroke-width="1.8" stroke-linecap="round" /><text x="313.0000" y="485.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#4d5d72" text-anchor="middle">7 cm</text><text x="211.0000" y="272.0000" font-size="34" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#205d9c" text-anchor="middle">7 − x</text><text x="449.0000" y="306.0000" font-size="34" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#aa5411" text-anchor="middle">x</text></svg>
