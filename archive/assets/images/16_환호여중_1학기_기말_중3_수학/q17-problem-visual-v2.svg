<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 705 544" width="705" height="544" role="img" aria-labelledby="title desc"><title id="title">두 포물선을 자르는 같은 길이의 세 구간</title><desc id="desc">두 포물선 y=x²와 y=ax²가 함께 위로 열린다. 높이 y=9에서 A, B, C, D가 순서대로 놓이고 바깥쪽 A와 D는 파란 곡선에 있다. 길이가 같은 세 구간에 같은 초록색 눈금을 붙였다.</desc><rect width="705" height="544" fill="white" /><line x1="88.6230" y1="217.6812" x2="610.6368" y2="217.6812" stroke="#25736e" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="7 6" /><line x1="211.9333" y1="224.8397" x2="211.9333" y2="210.5228" stroke="#25736e" stroke-width="3.2" stroke-linecap="round" /><line x1="348.9448" y1="224.8397" x2="348.9448" y2="210.5228" stroke="#25736e" stroke-width="3.2" stroke-linecap="round" /><line x1="485.9563" y1="224.8397" x2="485.9563" y2="210.5228" stroke="#25736e" stroke-width="3.2" stroke-linecap="round" /><line x1="53.0000" y1="432.4353" x2="649.0000" y2="432.4353" stroke="#4d5d72" stroke-width="1.65" stroke-linecap="round" /><polygon points="649.0000,432.4353 636.0000,427.4353 636.0000,437.4353" fill="#4d5d72" /><text x="666.0000" y="424.4353" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#4d5d72" text-anchor="middle">x</text><line x1="348.9448" y1="473.0000" x2="348.9448" y2="80.0000" stroke="#4d5d72" stroke-width="1.65" stroke-linecap="round" /><polygon points="348.9448,80.0000 343.9448,93.0000 353.9448,93.0000" fill="#4d5d72" /><text x="364.9448" y="86.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#4d5d72" text-anchor="middle">y</text><text x="327.9448" y="460.4353" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#4d5d72" text-anchor="middle">O</text><path d="M 93.4184 100.4517 Q 348.9448 764.4189 604.4713 100.4517" stroke="#205d9c" stroke-width="6.0" stroke-linecap="round" fill="none" /><path d="M 264.6828 107.5339 Q 348.9448 757.3368 433.2069 107.5339" stroke="#aa5411" stroke-width="6.0" stroke-linecap="round" fill="none" stroke-dasharray="15 7" /><circle cx="143.4275862068966" cy="217.68123861566485" r="6.0" fill="white" stroke="#25736e" stroke-width="3.1" /><text x="110.4276" y="200.6812" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#25736e" text-anchor="middle">A</text><circle cx="280.43908045977014" cy="217.68123861566485" r="6.0" fill="white" stroke="#25736e" stroke-width="3.1" /><text x="257.4391" y="200.6812" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#25736e" text-anchor="middle">B</text><circle cx="417.45057471264374" cy="217.68123861566485" r="6.0" fill="white" stroke="#25736e" stroke-width="3.1" /><text x="440.4506" y="200.6812" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#25736e" text-anchor="middle">C</text><circle cx="554.4620689655173" cy="217.68123861566485" r="6.0" fill="white" stroke="#25736e" stroke-width="3.1" /><text x="587.4621" y="200.6812" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#25736e" text-anchor="middle">D</text><line x1="343.9448" y1="217.6812" x2="353.9448" y2="217.6812" stroke="#4d5d72" stroke-width="1.7" stroke-linecap="round" /><text x="326.9448" y="204.6812" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#4d5d72" text-anchor="middle">9</text><line x1="64.0000" y1="39.0000" x2="114.0000" y2="39.0000" stroke="#205d9c" stroke-width="5.4" stroke-linecap="round" /><text x="126.0000" y="47.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#205d9c" text-anchor="start">y = x²</text><line x1="379.0000" y1="39.0000" x2="429.0000" y2="39.0000" stroke="#aa5411" stroke-width="5.4" stroke-linecap="round" stroke-dasharray="15 7" /><text x="441.0000" y="47.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans