<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" width="720" height="520" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">중심이 O인 두 부채꼴 OAB, OCD가 있고 점 A는 반직선 OC 위, 점 B는 반직선 OD 위에 있다. 두 호 AB, CD와 선분 AC, BD로 둘러싸인 도형 ABDC에서 AC의 길이를 x로 나타내었다.</title><desc id="visual-desc">중심 O에서 두 반지름 방향으로 중심각이 같은 두 부채꼴이 겹쳐져 있다. 작은 부채꼴의 호 AB와 큰 부채꼴의 호 CD가 있고, 두 반지름 방향 사이에 선분 AC와 BD가 놓여 도형 ABDC를 이룬다. AC의 길이는 x로 적혀 있다.</desc><rect width="720" height="520" fill="#fff"/><g data-layer="30"><line id="OC" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="136.997298119" y1="445.012334108" x2="583.002701881" y2="445.012334108"/></g><g data-layer="30"><line id="OD" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="136.997298119" y1="445.012334108" x2="360" y2="58.760324226"/></g><g data-layer="40"><polyline id="aAB" data-role="circularArc" stroke="#111" stroke-width="2.05" fill="none" data-owner-points="A B" data-center-point="O" data-owner-radius="6.0" data-sweep="CCW" points="360,445.012334108 359.880601561,437.715890236 359.522534097,430.427259578 358.926181038,423.154246984 358.092180971,415.904640577 357.021426967,408.686203417 355.715065614,401.506665188 354.174495798,394.373713918 352.401367198,387.294987752 350.397578526,380.278066766 348.165275489,373.330464854 345.706848492,366.459621684 343.024930082,359.672894726