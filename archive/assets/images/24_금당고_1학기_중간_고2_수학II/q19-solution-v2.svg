<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 400" width="480" height="400" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">f(1)=-2이고 접선 l의 기울기는 2f(1)-2f′(1)=2이므로 l은 y=2x+2이다. 원 C의 중심은 P에서 l에 수직인 방향 (2,-1)로 t만큼 간 점 (1+2t,4-t)이고 x축에 접하므로 r=4-t, CP=r에서 √5·t=4-t이다. 제1사분면 조건으로 t=√5-1이고 중심은 C(2√5-1, 5-√5), 반지름은 r=5-√5이며 x축과의 접점은 F이다. 원의 넓이는 π(5-√5)²=π(30-10√5)이다.</title><desc id="visual-desc">좌표평면에서 기울기가 양수인 직선 l과 x축에 모두 접하는 원이 그려져 있고, 원의 중심 C에서 접점 P와 x축 위의 접점 F로 반지름이 그어져 있다.</desc><rect width="480" height="400" fill="#fff"/><g data-layer="30"><line id="x-axis" data-role="axis" stroke="#111" stroke-width="1.2" fill="none" data-axis="x" x1="54.826126511" y1="286.293348418" x2="425.173873489" y2="286.293348418"/></g><g data-layer="30"><line id="y-axis" data-role="axis" stroke="#111" stroke-width="1.2" fill="none" data-axis="y" x1="138.901588229" y1="368" x2="138.901588229" y2="32"/></g><g data-layer="30"><line id="sCP" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="284.072182247" y1="170.732881106" x2="180.711758078" y2="119.052669021"/></g><g data-layer="30"><line id="sCF" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="284.072182247" y1="170.732881106" x2="284.072182247" y2="286.293348418"/></g><g data-layer="40"><line id="l" data-role="line" stroke="#111" stroke-width="2.05" fill="none" x1="56.