<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 600" width="640" height="600" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">직각삼각형의 세 변을 각각 한 변으로 하는 정사각형을 바깥쪽에 그렸고, 빗변 위의 정사각형의 넓이가 225, 한 직각변 위의 정사각형의 넓이가 144로 주어진 그림이다.</title><desc id="visual-desc">직각삼각형의 세 변 바깥에 정사각형이 세 개 있고, 빗변 위 정사각형 안에 225, 한 직각변 위 정사각형 안에 144가 적혀 있다. 직각인 꼭짓점에 직각 표시가 있다.</desc><rect width="640" height="600" fill="#fff"/><g data-layer="10"><path id="rAB" data-role="region" stroke="none" stroke-width="1.6" fill="#f2a65a" data-owner-points="A B P3 P4" data-mark="region" data-mark-id="rAB" fill-opacity="0.42" fill-rule="evenodd" d="M232.987012987 234.74025974 L407.012987013 365.25974026 L537.532467532 191.233766234 L363.506493506 60.714285714 L232.987012987 234.74025974 Z"/></g><g data-layer="10"><path id="rBC" data-role="region" stroke="none" stroke-width="1.6" fill="#7fa6e8" data-owner-points="B C P1 P2" data-mark="region" data-mark-id="rBC" fill-opacity="0.32" fill-rule="evenodd" d="M407.012987013 365.25974026 L407.012987013 539.285714286 L232.987012987 539.285714286 L232.987012987 365.25974026 L407.012987013 365.25974026 Z"/></g><g data-layer="10"><path id="rAC" data-role="region" stroke="none" stroke-width="1.6" fill="#6fcf97" data-owner-points="A C P5 P6" data-mark="region" data-mark-id="rAC" fill-opacity="0.42" fill-rule="evenodd" d="M232.987012987 365.