<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 380" width="420" height="380" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">삼각형 ABC에서 변 BC의 중점 M과 두 삼각형 ABM, AMC의 무게중심 G, G&#x27;을 나타낸 그림이다. 변 BC의 길이는 18 cm이다.</title><desc id="visual-desc">삼각형 ABC가 있고 변 BC의 중점 M이 표시되어 있다. 변 BM과 MC에 같은 길이 표시가 있으며, 삼각형 ABM의 무게중심 G와 삼각형 AMC의 무게중심 G&#x27;이 보이고 두 점을 잇는 선분이 그려져 있다. 변 BC 아래에 길이 18 cm가 적혀 있다.</desc><rect width="420" height="380" fill="#fff"/><g data-layer="30"><line id="sAB" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="159.063957086" y1="50.336975449" x2="57.191871259" y2="305.017190018"/></g><g data-layer="30"><line id="sBM" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="57.191871259" y1="305.017190018" x2="210" y2="305.017190018"/></g><g data-layer="30"><line id="sMC" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="210" y1="305.017190018" x2="362.808128741" y2="305.017190018"/></g><g data-layer="30"><line id="sCA" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="362.808128741" y1="305.017190018" x2="159.063957086" y2="50.336975449"/></g><g data-layer="30"><line id="sAM" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="159.063957086" y1="50.336975449" x2="210" y2="305.017190018"/></g><g data-layer="30"><line id="sGGp" data-role="line" stroke="#1