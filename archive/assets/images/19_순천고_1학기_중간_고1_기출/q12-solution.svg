<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 370" role="img" aria-labelledby="title desc">
<title id="title">모든 이차함수에 공통인 접선</title>
<desc id="desc">a가 −1, 0, 1일 때 세 포물선이 y=2x−1에 각각 한 점에서 접한다.</desc>
<style>
.title{font-family:"Noto Sans KR","Malgun Gothic",sans-serif;font-size:18px;font-weight:700;fill:#172033}
.note{font-family:"Noto Sans KR","Malgun Gothic",sans-serif;font-size:13px;fill:#334155}
.math{font-family:"STIX Two Math","Cambria Math",serif;font-size:14px;fill:#172033}
.label{font-family:"STIX Two Math","Cambria Math",serif;font-size:12px;font-style:italic;fill:#172033}
</style>
<rect width="780" height="370" fill="#ffffff"/>
<text x="20" y="28" class="title">세 값에서 확인하는 공통 접선</text>
<rect x="16" y="41" width="395" height="310" rx="12" fill="#fbfdff" stroke="#cbd5e1"/>
<line x1="75" y1="250" x2="390" y2="250" stroke="#334155" stroke-width="1.3"/>
<line x1="230" y1="65" x2="230" y2="328" stroke="#334155" stroke-width="1.3"/>
<text x="386" y="243" class="label">x</text>
<text x="237" y="72" class="label">y</text>
<path d="M92.5,242.5 L120,280 L147.5,302.5 L175,310 L202.5,302.5 L230,280 L257.5,242.5 L285,190 L296,164.8" fill="none" stroke="#2563eb" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M131,152.8 L147.5,182.5 L175,220 L202.5,242.5 L230,250 L257.5,242.5 L285,220 L312.5,182.5 L340,130 L356.5,91.3" fill="none" stroke="#16a34a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M219,146.8 L230,160 L257.5,182.5 L285,190 L312.5,182.5 L340,160 L367.5,122.5 L378.5,103.3" fill="none" stroke="#7c3aed" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<line x1="219" y1="292" x2="373" y2="124" stroke="#ea580c" stroke-width="2.8"/>
<circle cx="230" cy="280" r="4.6" fill="#2563eb" stroke="#ffffff" stroke-width="1.5"/>
<circle cx="285" cy="220" r="4.6" fill="#16a34a" stroke="#ffffff" stroke-width="1.5"/>
<circle cx="340" cy="160" r="4.6" fill="#7c3aed" stroke="#ffffff" stroke-width="1.5"/>
<text x="232" y="297" class="label" fill="#2563eb">T₋₁(0,−1)</text>
<text x="289" y="239" class="label" fill="#16a34a">T₀(1,1)</text>
<text x="343" y="155" class="label" fill="#7c3aed">T₁(2,3)</text>
<text x="92" y="226" class="label" fill="#2563eb">a=−1</text>
<text x="133" y="166" class="label" fill="#16a34a">a=0</text>
<text x="366" y="99" class="label" fill="#7c3aed">a=1</text>
<text x="287" y="286" class="math" fill="#c2410c">y=2x−1</text>
<rect x="430" y="41" width="334" height="310" rx="12" fill="#f8fafc" stroke="#dbe3ef"/>
<text x="450" y="76" class="title">접점의 규칙</text>
<text x="450" y="114" class="math">x=a+1</text>
<text x="450" y="157" class="math">fₐ(x)−(2x−1)</text>
<text x="450" y="185" class="math">=(x−a−1)²</text>
<text x="450" y="231" class="note">차가 항상 제곱식이므로</text>
<text x="450" y="258" class="note">각 포물선과 직선은</text>
<text x="450" y="285" class="note">한 점에서 접한다.</text>
<text x="450" y="326" class="title" fill="#c2410c">m+n=1</text>
</svg>