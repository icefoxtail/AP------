<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 400" role="img" aria-labelledby="title desc">
<title id="title">직선과 원의 한 교점</title>
<desc id="desc">원점 중심 반지름 1/√2인 원과 직선 y=x+1이 T에서 접한다.</desc>
<style>
.title{font-family:"Noto Sans KR","Malgun Gothic",sans-serif;font-size:19px;font-weight:700;fill:#172033}
.note{font-family:"Noto Sans KR","Malgun Gothic",sans-serif;font-size:14px;fill:#334155}
.math{font-family:"STIX Two Math","Cambria Math",serif;font-size:15px;fill:#172033}
.label{font-family:"STIX Two Math","Cambria Math",serif;font-size:15px;font-style:italic;fill:#172033}
</style>
<rect width="780" height="400" fill="#ffffff"/>
<text x="22" y="29" class="title">한 교점은 접점</text>
<rect x="18" y="42" width="485" height="338" rx="12" fill="#fbfdff" stroke="#cbd5e1"/>
<line x1="75" y1="210" x2="485" y2="210" stroke="#334155" stroke-width="1.4"/>
<line x1="300" y1="365" x2="300" y2="58" stroke="#334155" stroke-width="1.4"/>
<text x="478" y="203" class="label">x</text>
<text x="307" y="67" class="label">y</text>
<circle cx="300" cy="210" r="70.7107" fill="#dbeafe" fill-opacity="0.25" stroke="#2563eb" stroke-width="2.6"/>
<line x1="130" y1="280" x2="390" y2="20" stroke="#ea580c" stroke-width="2.8"/>
<line x1="300" y1="210" x2="250" y2="160" stroke="#0f766e" stroke-width="2.1" stroke-dasharray="5 4"/>
<circle cx="300" cy="210" r="4.5" fill="#172033"/>
<circle cx="250" cy="160" r="5.5" fill="#ea580c" stroke="#ffffff" stroke-width="2"/>
<text x="307" y="230" class="label">O</text>
<text x="228" y="145" class="label">T</text>
<text x="288" y="282" class="math">r=1/√2</text>
<text x="352" y="87" class="math" fill="#c2410c">y=x+1</text>
<polyline points="257.1,167.1 264.2,160 257.1,152.9" fill="none" stroke="#0f766e" stroke-width="1.6"/>
<rect x="520" y="42" width="242" height="338" rx="12" fill="#f8fafc" stroke="#dbe3ef"/>
<text x="540" y="75" class="title">계산값</text>
<text x="540" y="111" class="math">a=−3/2</text>
<text x="540" y="143" class="math">x²+y²=1/2</text>
<text x="540" y="175" class="math">y=x+1</text>
<text x="540" y="221" class="note">T=(−1/2,1/2)</text>
<text x="540" y="249" class="note">OT=1/√2</text>
<text x="540" y="277" class="note">반지름과 접선은 수직</text>
<text x="540" y="321" class="note">원과 직선의</text>
<text x="540" y="349" class="title" fill="#c2410c">교점은 한 개</text>
</svg>