<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 400" role="img" aria-labelledby="title desc">
<title id="title">두 직선과 x축이 만드는 삼각형</title>
<desc id="desc">y=x+1과 y=−x/3+1, x축으로 둘러싸인 삼각형의 꼭짓점은 A(−1,0), P(0,1), C(3,0)이다.</desc>
<style>
.title{font-family:"Noto Sans KR","Malgun Gothic",sans-serif;font-size:18px;font-weight:700;fill:#172033}
.note{font-family:"Noto Sans KR","Malgun Gothic",sans-serif;font-size:13px;fill:#334155}
.math{font-family:"STIX Two Math","Cambria Math",serif;font-size:14px;fill:#172033}
.label{font-family:"STIX Two Math","Cambria Math",serif;font-size:14px;font-style:italic;fill:#172033}
</style>
<rect width="840" height="400" fill="#ffffff"/>
<text x="20" y="27" class="title">두 그래프와 x축이 만드는 삼각형</text>
<rect x="16" y="39" width="535" height="342" rx="12" fill="#fbfdff" stroke="#cbd5e1"/>
<line x1="92" y1="300" x2="540" y2="300" stroke="#334155" stroke-width="1.4"/>
<line x1="300" y1="58" x2="300" y2="354" stroke="#334155" stroke-width="1.4"/>
<text x="534" y="293" class="label">x</text>
<text x="307" y="67" class="label">y</text>
<polygon points="225,300 300,210 525,300" fill="#fbbf24" fill-opacity="0.24" stroke="#d97706" stroke-width="1.6"/>
<line x1="172.5" y1="363" x2="472.5" y2="3" stroke="#2563eb" stroke-width="2.8"/>
<line x1="187.5" y1="165" x2="547.5" y2="309" stroke="#7c3aed" stroke-width="2.8"/>
<line x1="300" y1="210" x2="300" y2="300" stroke="#0f766e" stroke-width="1.8" stroke-dasharray="5 4"/>
<circle cx="225" cy="300" r="5" fill="#2563eb" stroke="#ffffff" stroke-width="1.6"/>
<circle cx="300" cy="210" r="5.5" fill="#d97706" stroke="#ffffff" stroke-width="1.8"/>
<circle cx="525" cy="300" r="5" fill="#7c3aed" stroke="#ffffff" stroke-width="1.6"/>
<text x="185" y="324" class="label">A(−1,0)</text>
<text x="307" y="203" class="label">P(0,1)</text>
<text x="515" y="324" class="label">C(3,0)</text>
<text x="365" y="111" class="math" fill="#2563eb">y=x+1</text>
<text x="392" y="270" class="math" fill="#7c3aed">y=−x/3+1</text>
<text x="306" y="255" class="note" fill="#0f766e">높이 1</text>
<text x="355" y="320" class="note" fill="#d97706">밑변 4</text>
<rect x="570" y="39" width="254" height="342" rx="12" fill="#f8fafc" stroke="#dbe3ef"/>
<text x="590" y="75" class="title">최댓값</text>
<text x="590" y="114" class="math">P=(0,1)</text>
<text x="590" y="147" class="math">k=−1/3</text>
<text x="590" y="197" class="note">삼각형 넓이</text>
<text x="590" y="229" class="math">1/2·4·1=2</text>
<text x="590" y="283" class="note">경계점 P도</text>
<text x="590" y="309" class="note">범위에 포함한다.</text>
<text x="590" y="352" class="title" fill="#c2410c">넓이 2</text>
</svg>