<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 370" role="img" aria-labelledby="title desc">
<title id="title">직선과 이차함수의 접점</title>
<desc id="desc">이차함수 y=(x−1)²과 직선 y=2x−3은 P(2,1)에서 한 점에 접한다.</desc>
<style>
.title{font-family:"Noto Sans KR","Malgun Gothic",sans-serif;font-size:19px;font-weight:700;fill:#172033}
.note{font-family:"Noto Sans KR","Malgun Gothic",sans-serif;font-size:14px;fill:#334155}
.math{font-family:"STIX Two Math","Cambria Math",serif;font-size:14px;fill:#172033}
.label{font-family:"STIX Two Math","Cambria Math",serif;font-size:14px;font-style:italic;fill:#172033}
</style>
<rect width="780" height="370" fill="#ffffff"/>
<text x="22" y="29" class="title">접선은 교점이 중근이 되는 경우</text>
<rect x="18" y="43" width="452" height="309" rx="12" fill="#fbfdff" stroke="#cbd5e1"/>
<line x1="125" y1="260" x2="440" y2="260" stroke="#334155" stroke-width="1.4"/>
<line x1="200" y1="56" x2="200" y2="330" stroke="#334155" stroke-width="1.4"/>
<text x="433" y="253" class="label">x</text>
<text x="207" y="65" class="label">y</text>
<path d="M170,192.5 L200,230 L230,252.5 L260,260 L290,252.5 L320,230 L350,192.5 L380,140" fill="none" stroke="#2563eb" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
<line x1="200" y1="350" x2="380" y2="170" stroke="#ea580c" stroke-width="2.7"/>
<circle cx="320" cy="230" r="5.5" fill="#ea580c" stroke="#ffffff" stroke-width="2"/>
<text x="328" y="223" class="label">P(2,1)</text>
<text x="354" y="185" class="math" fill="#c2410c">y=2x−3</text>
<text x="236" y="284" class="math" fill="#2563eb">y=(x−1)²</text>
<rect x="490" y="43" width="272" height="309" rx="12" fill="#f8fafc" stroke="#dbe3ef"/>
<text x="510" y="78" class="title">중근 조건</text>
<text x="510" y="117" class="math">f(x)−(2x−3)</text>
<text x="510" y="148" class="math">=(x−2)²</text>
<text x="510" y="194" class="note">교점의 x좌표는</text>
<text x="510" y="222" class="note">x=2 한 개</text>
<text x="510" y="266" class="math">a=−2, b=1</text>
<text x="510" y="315" class="title" fill="#c2410c">a−b=−3</text>
</svg>