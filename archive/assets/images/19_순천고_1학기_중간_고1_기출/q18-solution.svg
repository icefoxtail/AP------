<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 420" role="img" aria-labelledby="title desc">
<title id="title">포물선 조형물의 그림자 끝</title>
<desc id="desc">포물선 y=−x²+7x에 조명 L(0,16)의 경계 광선이 T(4,12)에서 접하고 지면의 C(16,0)에 닿는다.</desc>
<style>
.title{font-family:"Noto Sans KR","Malgun Gothic",sans-serif;font-size:18px;font-weight:700;fill:#172033}
.note{font-family:"Noto Sans KR","Malgun Gothic",sans-serif;font-size:13px;fill:#334155}
.math{font-family:"STIX Two Math","Cambria Math",serif;font-size:14px;fill:#172033}
.label{font-family:"STIX Two Math","Cambria Math",serif;font-size:14px;font-style:italic;fill:#172033}
</style>
<rect width="840" height="420" fill="#ffffff"/>
<text x="20" y="27" class="title">접선이 그림자의 경계를 만든다</text>
<rect x="16" y="39" width="574" height="362" rx="12" fill="#fbfdff" stroke="#cbd5e1"/>
<line x1="70" y1="330" x2="585" y2="330" stroke="#334155" stroke-width="1.5"/>
<line x1="100" y1="47" x2="100" y2="365" stroke="#334155" stroke-width="1.3"/>
<text x="579" y="323" class="label">x</text>
<text x="107" y="55" class="label">y</text>
<path d="M100,330 L130,228 L160,160 L190,126 L205,121.75 L220,126 L250,160 L280,228 L310,330" fill="none" stroke="#2563eb" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
<line x1="100" y1="58" x2="580" y2="330" stroke="#ea580c" stroke-width="2.8"/>
<line x1="100" y1="330" x2="100" y2="58" stroke="#64748b" stroke-width="2" stroke-dasharray="5 4"/>
<line x1="205" y1="122" x2="205" y2="330" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4 4"/>
<line x1="100" y1="352" x2="310" y2="352" stroke="#0f766e" stroke-width="2"/>
<line x1="100" y1="346" x2="100" y2="358" stroke="#0f766e" stroke-width="1.6"/>
<line x1="310" y1="346" x2="310" y2="358" stroke="#0f766e" stroke-width="1.6"/>
<line x1="76" y1="58" x2="76" y2="330" stroke="#64748b" stroke-width="1.5"/>
<line x1="70" y1="58" x2="82" y2="58" stroke="#64748b" stroke-width="1.5"/>
<line x1="70" y1="330" x2="82" y2="330" stroke="#64748b" stroke-width="1.5"/>
<circle cx="100" cy="330" r="4.5" fill="#172033"/>
<circle cx="310" cy="330" r="4.5" fill="#172033"/>
<circle cx="580" cy="330" r="4.5" fill="#ea580c"/>
<circle cx="100" cy="58" r="5" fill="#7c3aed" stroke="#ffffff" stroke-width="1.5"/>
<circle cx="220" cy="126" r="5.5" fill="#ea580c" stroke="#ffffff" stroke-width="1.8"/>
<text x="84" y="350" class="label">A</text>
<text x="300" y="350" class="label">B</text>
<text x="578" y="350" class="label">C</text>
<text x="78" y="49" class="label">L</text>
<text x="230" y="115" class="label">T</text>
<text x="18" y="199" class="math">16 m</text>
<text x="171" y="375" class="math">AB=7 m</text>
<text x="240" y="100" class="math">높이 49/4 m</text>
<text x="349" y="224" class="math" fill="#2563eb">y=−x²+7x</text>
<text x="396" y="102" class="math" fill="#c2410c">경계 광선</text>
<rect x="607" y="39" width="217" height="362" rx="12" fill="#f8fafc" stroke="#dbe3ef"/>
<text x="625" y="73" class="title">계산</text>
<text x="625" y="111" class="math">L=(0,16)</text>
<text x="625" y="145" class="math">T=(4,12)</text>
<text x="625" y="179" class="math">y=−x+16</text>
<text x="625" y="221" class="note">접점에서 한 번 만남</text>
<text x="625" y="255" class="math">C=(16,0)</text>
<text x="625" y="304" class="note">A에서 C까지</text>
<text x="625" y="341" class="title" fill="#c2410c">16 m</text>
</svg>