<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" role="img" aria-labelledby="title desc">
<title id="title">닫힌 구간에서 이차함수의 최솟값</title>
<desc id="desc">아래로 열린 포물선의 꼭짓점과 닫힌 구간의 두 끝점 함수값을 비교한다.</desc>
<style>
.text{font-family:"Noto Sans KR","Malgun Gothic",sans-serif;fill:#172033}
.math{font-family:"STIX Two Math","Cambria Math",serif;fill:#172033}
.title{font-family:"Noto Sans KR","Malgun Gothic",sans-serif;font-size:20px;font-weight:700;fill:#172033}
.note{font-family:"Noto Sans KR","Malgun Gothic",sans-serif;font-size:15px;fill:#334155}
.label{font-family:"STIX Two Math","Cambria Math",serif;font-size:15px;font-style:italic;fill:#172033}
</style>
<rect width="800" height="360" fill="#ffffff"/>
<text x="24" y="30" class="title">꼭짓점과 구간 끝점의 함수값</text>
<rect x="20" y="44" width="515" height="294" rx="12" fill="#fbfdff" stroke="#cbd5e1"/>
<line x1="72" y1="154" x2="520" y2="154" stroke="#334155" stroke-width="1.5"/>
<line x1="310" y1="66" x2="310" y2="294" stroke="#334155" stroke-width="1.5"/>
<text x="518" y="147" class="label">x</text>
<text x="317" y="72" class="label">y</text>
<line x1="180" y1="154" x2="180" y2="269" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4 4"/>
<line x1="505" y1="154" x2="505" y2="179" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4 4"/>
<path d="M 180,271 L 196.25,245.125 L 212.5,221.5 L 228.75,200.125 L 245,181 L 261.25,164.125 L 277.5,149.5 L 293.75,137.125 L 310,127 L 326.25,119.125 L 342.5,113.5 L 358.75,110.125 L 375,109 L 391.25,110.125 L 407.5,113.5 L 423.75,119.125 L 440,127 L 456.25,137.125 L 472.5,149.5 L 488.75,164.125 L 505,181" fill="none" stroke="#2563eb" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="180" cy="271" r="5.5" fill="#ea580c" stroke="#ffffff" stroke-width="2"/>
<circle cx="505" cy="181" r="5.5" fill="#ea580c" stroke="#ffffff" stroke-width="2"/>
<circle cx="375" cy="109" r="5.5" fill="#16a34a" stroke="#ffffff" stroke-width="2"/>
<text x="76" y="290" class="label">A(−2,−13)</text>
<text x="455" y="202" class="label">B(3,−3)</text>
<text x="380" y="103" class="label">V(1,5)</text>
<text x="198" y="333" class="note" text-anchor="middle">−2</text>
<text x="505" y="333" class="note" text-anchor="middle">3</text>
<line x1="180" y1="318" x2="505" y2="318" stroke="#0f766e" stroke-width="4" stroke-linecap="round"/>
<line x1="180" y1="311" x2="180" y2="325" stroke="#0f766e" stroke-width="2"/>
<line x1="505" y1="311" x2="505" y2="325" stroke="#0f766e" stroke-width="2"/>
<text x="560" y="78" class="title">닫힌 구간</text>
<text x="560" y="108" class="math" font-size="17">−2 ≤ x ≤ 3</text>
<text x="560" y="148" class="note">꼭짓점 x=1은 안쪽</text>
<text x="560" y="181" class="note">f(−2)=−13</text>
<text x="560" y="211" class="note">f(3)=−3</text>
<text x="560" y="252" class="note">−13 &lt; −3</text>
<text x="560" y="286" class="title" fill="#c2410c">최솟값은 −13</text>
<text x="560" y="318" class="note">왼쪽 끝점에서 얻는다</text>
</svg>
