<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 380" role="img" aria-labelledby="title desc">
<title id="title">구간의 끝점에서 최솟값 비교</title>
<desc id="desc">포물선 f(x)=−x²+4x−4와 직선 y=−2x+4는 x=2와 4에서 만나고, 구간 [2,4]에서 최솟값은 x=4에서 −4이다.</desc>
<style>
.title{font-family:"Noto Sans KR","Malgun Gothic",sans-serif;font-size:18px;font-weight:700;fill:#172033}
.note{font-family:"Noto Sans KR","Malgun Gothic",sans-serif;font-size:13px;fill:#334155}
.math{font-family:"STIX Two Math","Cambria Math",serif;font-size:14px;fill:#172033}
.label{font-family:"STIX Two Math","Cambria Math",serif;font-size:13px;font-style:italic;fill:#172033}
</style>
<rect width="820" height="380" fill="#ffffff"/>
<text x="20" y="27" class="title">닫힌 구간의 끝점 함수값 비교</text>
<rect x="16" y="39" width="440" height="325" rx="12" fill="#fbfdff" stroke="#cbd5e1"/>
<line x1="70" y1="220" x2="400" y2="220" stroke="#334155" stroke-width="1.4"/>
<line x1="100" y1="65" x2="100" y2="350" stroke="#334155" stroke-width="1.3"/>
<text x="394" y="213" class="label">x</text>
<text x="107" y="73" class="label">y</text>
<path d="M100,340 L132.5,287.5 L165,250 L197.5,227.5 L230,220 L262.5,227.5 L295,250 L327.5,287.5 L360,340 L373,365.2" fill="none" stroke="#2563eb" stroke-width="3.1" stroke-linecap="round" stroke-linejoin="round"/>
<line x1="100" y1="100" x2="373" y2="352" stroke="#ea580c" stroke-width="2.5"/>
<line x1="230" y1="220" x2="360" y2="220" stroke="#0f766e" stroke-width="4" stroke-linecap="round"/>
<line x1="230" y1="220" x2="230" y2="340" stroke="#94a3b8" stroke-width="1.1" stroke-dasharray="4 4"/>
<line x1="360" y1="220" x2="360" y2="340" stroke="#94a3b8" stroke-width="1.1" stroke-dasharray="4 4"/>
<circle cx="230" cy="220" r="5.2" fill="#16a34a" stroke="#ffffff" stroke-width="1.8"/>
<circle cx="360" cy="340" r="5.2" fill="#ea580c" stroke="#ffffff" stroke-width="1.8"/>
<text x="236" y="211" class="label">x=2, f=0</text>
<text x="368" y="325" class="label">x=4, f=−4</text>
<text x="270" y="253" class="math" fill="#2563eb">f(x)</text>
<text x="155" y="138" class="math" fill="#c2410c">y=−2x+4</text>
<text x="256" y="238" class="note" fill="#0f766e">[2,4]</text>
<rect x="475" y="39" width="329" height="325" rx="12" fill="#f8fafc" stroke="#dbe3ef"/>
<text x="495" y="75" class="title">a&lt;0</text>
<text x="495" y="111" class="note">포물선은 아래로 열린다.</text>
<text x="495" y="155" class="math">f(2)=0</text>
<text x="495" y="187" class="math">f(4)=−4</text>
<text x="495" y="231" class="note">구간 [2,4]에서</text>
<text x="495" y="259" class="note">두 끝점의 값을 비교한다.</text>
<text x="495" y="308" class="title" fill="#c2410c">최솟값은 −4</text>
</svg>