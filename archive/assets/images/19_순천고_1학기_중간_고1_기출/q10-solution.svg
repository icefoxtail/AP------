<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 370" role="img" aria-labelledby="title desc">
<title id="title">두 복소 제곱근 조건의 공통 범위</title>
<desc id="desc">첫째 조건은 x가 2 이하이거나 4이고, 둘째 조건은 1 이상 3 미만이므로 공통 범위는 1 이상 2 이하이다.</desc>
<style>
.title{font-family:"Noto Sans KR","Malgun Gothic",sans-serif;font-size:19px;font-weight:700;fill:#172033}
.note{font-family:"Noto Sans KR","Malgun Gothic",sans-serif;font-size:14px;fill:#334155}
.math{font-family:"STIX Two Math","Cambria Math",serif;font-size:15px;fill:#172033}
</style>
<rect width="820" height="370" fill="#ffffff"/>
<text x="22" y="29" class="title">두 조건의 공통 범위</text>
<rect x="18" y="43" width="540" height="305" rx="12" fill="#fbfdff" stroke="#cbd5e1"/>
<text x="36" y="91" class="note">첫째 조건</text>
<line x1="120" y1="105" x2="540" y2="105" stroke="#64748b" stroke-width="1.3"/>
<line x1="320" y1="105" x2="130" y2="105" stroke="#2563eb" stroke-width="4" stroke-linecap="round"/>
<path d="M120 105 l11 -6 v12 z" fill="#2563eb"/>
<circle cx="320" cy="105" r="6" fill="#2563eb" stroke="#ffffff" stroke-width="2"/>
<circle cx="520" cy="105" r="6" fill="#2563eb" stroke="#ffffff" stroke-width="2"/>
<text x="36" y="168" class="note">둘째 조건</text>
<line x1="120" y1="181" x2="540" y2="181" stroke="#64748b" stroke-width="1.3"/>
<line x1="220" y1="181" x2="420" y2="181" stroke="#ea580c" stroke-width="4" stroke-linecap="round"/>
<circle cx="220" cy="181" r="6" fill="#ea580c" stroke="#ffffff" stroke-width="2"/>
<circle cx="420" cy="181" r="6" fill="#ffffff" stroke="#ea580c" stroke-width="2.4"/>
<text x="36" y="246" class="note">공통 범위</text>
<line x1="120" y1="258" x2="540" y2="258" stroke="#64748b" stroke-width="1.3"/>
<line x1="220" y1="258" x2="320" y2="258" stroke="#0f766e" stroke-width="5" stroke-linecap="round"/>
<circle cx="220" cy="258" r="6" fill="#0f766e" stroke="#ffffff" stroke-width="2"/>
<circle cx="320" cy="258" r="6" fill="#0f766e" stroke="#ffffff" stroke-width="2"/>
<text x="220" y="286" class="math" text-anchor="middle">1</text>
<text x="320" y="286" class="math" text-anchor="middle">2</text>
<text x="420" y="286" class="math" text-anchor="middle">3</text>
<text x="520" y="286" class="math" text-anchor="middle">4</text>
<text x="40" y="326" class="note">첫째: x≤2 또는 x=4</text>
<text x="287" y="326" class="note">둘째: 1≤x&lt;3</text>
<rect x="575" y="43" width="227" height="305" rx="12" fill="#f8fafc" stroke="#dbe3ef"/>
<text x="595" y="78" class="title">정리</text>
<text x="595" y="117" class="math">1≤x≤2</text>
<text x="595" y="166" class="math">|x−2|=2−x</text>
<text x="595" y="196" class="math">|x+1|=x+1</text>
<text x="595" y="246" class="math">2−x+x+1=3</text>
<text x="595" y="300" class="title" fill="#c2410c">값은 3</text>
</svg>