<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" role="img" aria-labelledby="title desc">
<title id="title">연립부등식의 해가 비는 경계</title>
<desc id="desc">x가 −1 이상이고 3−a보다 작을 때, 오른쪽 끝점이 −1 이하이면 공통 해가 없다.</desc>
<style>
.title{font-family:"Noto Sans KR","Malgun Gothic",sans-serif;font-size:19px;font-weight:700;fill:#172033}
.note{font-family:"Noto Sans KR","Malgun Gothic",sans-serif;font-size:14px;fill:#334155}
.math{font-family:"STIX Two Math","Cambria Math",serif;font-size:15px;fill:#172033}
</style>
<rect width="760" height="380" fill="#ffffff"/>
<text x="22" y="29" class="title">엄격한 끝점에서 해가 사라진다</text>
<rect x="18" y="43" width="478" height="316" rx="12" fill="#fbfdff" stroke="#cbd5e1"/>
<text x="35" y="82" class="note">a=3:  x≥−1,  x&lt;0</text>
<line x1="70" y1="132" x2="350" y2="132" stroke="#64748b" stroke-width="1.4"/>
<line x1="150" y1="132" x2="335" y2="132" stroke="#2563eb" stroke-width="4" stroke-linecap="round"/>
<line x1="70" y1="132" x2="230" y2="132" stroke="#ea580c" stroke-width="4" stroke-linecap="round"/>
<circle cx="150" cy="132" r="6" fill="#2563eb" stroke="#ffffff" stroke-width="2"/>
<circle cx="230" cy="132" r="6" fill="#ffffff" stroke="#ea580c" stroke-width="2.4"/>
<text x="150" y="158" class="math" text-anchor="middle">−1</text>
<text x="230" y="158" class="math" text-anchor="middle">0</text>
<text x="35" y="211" class="note">a=4:  x≥−1,  x&lt;−1</text>
<line x1="70" y1="238" x2="350" y2="238" stroke="#64748b" stroke-width="1.4"/>
<line x1="150" y1="225" x2="335" y2="225" stroke="#2563eb" stroke-width="4" stroke-linecap="round"/>
<line x1="70" y1="258" x2="150" y2="258" stroke="#ea580c" stroke-width="4" stroke-linecap="round"/>
<circle cx="150" cy="225" r="6" fill="#2563eb" stroke="#ffffff" stroke-width="2"/>
<circle cx="150" cy="258" r="6" fill="#ffffff" stroke="#ea580c" stroke-width="2.4"/>
<text x="150" y="286" class="math" text-anchor="middle">−1</text>
<text x="40" y="322" class="note">닫힌 점과 열린 점이 겹쳐도 공통 해는 없다.</text>
<rect x="514" y="43" width="228" height="316" rx="12" fill="#f8fafc" stroke="#dbe3ef"/>
<text x="534" y="80" class="title">해의 범위</text>
<text x="534" y="117" class="math">x∈[−1,3−a)</text>
<text x="534" y="166" class="note">해가 없으려면</text>
<text x="534" y="197" class="math">3−a≤−1</text>
<text x="534" y="229" class="math">a≥4</text>
<text x="534" y="280" class="note">a는 정수이므로</text>
<text x="534" y="315" class="title" fill="#c2410c">최솟값 4</text>
</svg>