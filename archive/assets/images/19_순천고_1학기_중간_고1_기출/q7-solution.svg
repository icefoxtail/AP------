<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 360" role="img" aria-labelledby="title desc">
<title id="title">직선과 포물선의 교점 수</title>
<desc id="desc">y=x−3은 포물선에 접하고, k가 3보다 작으면 두 점에서 만나며 3보다 크면 만나지 않는다.</desc>
<style>
.title{font-family:"Noto Sans KR","Malgun Gothic",sans-serif;font-size:19px;font-weight:700;fill:#172033}
.note{font-family:"Noto Sans KR","Malgun Gothic",sans-serif;font-size:14px;fill:#334155}
.math{font-family:"STIX Two Math","Cambria Math",serif;font-size:14px;fill:#172033}
.label{font-family:"STIX Two Math","Cambria Math",serif;font-size:13px;font-style:italic;fill:#172033}
</style>
<rect width="820" height="360" fill="#ffffff"/>
<text x="20" y="28" class="title">접하는 순간이 k의 경계</text>
<rect x="16" y="40" width="460" height="304" rx="12" fill="#fbfdff" stroke="#cbd5e1"/>
<line x1="60" y1="200" x2="455" y2="200" stroke="#334155" stroke-width="1.4"/>
<line x1="270" y1="48" x2="270" y2="315" stroke="#334155" stroke-width="1.4"/>
<text x="451" y="193" class="label">x</text>
<text x="277" y="57" class="label">y</text>
<path d="M77.5,204.5 L105,236 L132.5,258.5 L160,272 L187.5,276.5 L215,272 L242.5,258.5 L270,236 L297.5,204.5 L325,164 L352.5,114.5 L380,56" fill="none" stroke="#2563eb" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
<line x1="105" y1="308" x2="380" y2="218" stroke="#ea580c" stroke-width="2.8"/>
<line x1="105" y1="290" x2="380" y2="200" stroke="#64748b" stroke-width="2" stroke-dasharray="6 5"/>
<circle cx="215" cy="272" r="5.5" fill="#ea580c" stroke="#ffffff" stroke-width="2"/>
<circle cx="160" cy="272" r="4.5" fill="#64748b" stroke="#ffffff" stroke-width="1.5"/>
<circle cx="270" cy="236" r="4.5" fill="#64748b" stroke="#ffffff" stroke-width="1.5"/>
<text x="222" y="252" class="label">P(−1,−4)</text>
<text x="130" y="293" class="label">A(−2,−4)</text>
<text x="315" y="236" class="label">B(0,−2)</text>
<text x="334" y="238" class="math" fill="#c2410c">k=3</text>
<text x="340" y="190" class="math" fill="#64748b">k=2</text>
<rect x="495" y="40" width="309" height="304" rx="12" fill="#f8fafc" stroke="#dbe3ef"/>
<text x="517" y="76" class="title">교점 조건</text>
<text x="517" y="116" class="math">x²+3x−2=x−k</text>
<text x="517" y="146" class="math">x²+2x+k−2=0</text>
<text x="517" y="188" class="math">판별식 Δ=12−4k</text>
<text x="517" y="218" class="math">Δ≥0 ⇔ k≤3</text>
<text x="517" y="258" class="note">k=3에서 한 점에 접한다.</text>
<text x="517" y="292" class="note">더 큰 k에서는 만나지 않는다.</text>
<text x="517" y="326" class="title" fill="#c2410c">최댓값은 3</text>
</svg>