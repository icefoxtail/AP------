<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-labelledby="title desc">
<title id="title">둘레가 최대일 때의 직사각형</title>
<desc id="desc">포물선 y=−x²+6x의 대칭축 x=3을 기준으로 A(2,0), B(4,0), D(2,8), C(4,8)이 놓인다.</desc>
<style>
.title{font-family:"Noto Sans KR","Malgun Gothic",sans-serif;font-size:19px;font-weight:700;fill:#172033}
.note{font-family:"Noto Sans KR","Malgun Gothic",sans-serif;font-size:14px;fill:#334155}
.math{font-family:"STIX Two Math","Cambria Math",serif;font-size:14px;fill:#172033}
.label{font-family:"STIX Two Math","Cambria Math",serif;font-size:14px;font-style:italic;fill:#172033}
</style>
<rect width="800" height="420" fill="#ffffff"/>
<text x="20" y="28" class="title">대칭축에 맞춘 직사각형</text>
<rect x="16" y="42" width="465" height="362" rx="12" fill="#fbfdff" stroke="#cbd5e1"/>
<line x1="100" y1="360" x2="460" y2="360" stroke="#334155" stroke-width="1.4"/>
<line x1="180" y1="32" x2="180" y2="395" stroke="#334155" stroke-width="1.4"/>
<text x="454" y="353" class="label">x</text>
<text x="187" y="39" class="label">y</text>
<path d="M180,360 L197.5,263.75 L215,185 L232.5,123.75 L250,80 L267.5,53.75 L285,45 L302.5,53.75 L320,80 L337.5,123.75 L355,185 L372.5,263.75 L390,360" fill="none" stroke="#2563eb" stroke-width="3.1" stroke-linecap="round" stroke-linejoin="round"/>
<line x1="285" y1="48" x2="285" y2="360" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 5"/>
<rect x="250" y="80" width="70" height="280" fill="#16a34a" fill-opacity="0.12" stroke="#16a34a" stroke-width="2.6"/>
<circle cx="250" cy="360" r="4.5" fill="#16a34a" stroke="#ffffff" stroke-width="1.5"/>
<circle cx="320" cy="360" r="4.5" fill="#16a34a" stroke="#ffffff" stroke-width="1.5"/>
<circle cx="320" cy="80" r="4.5" fill="#16a34a" stroke="#ffffff" stroke-width="1.5"/>
<circle cx="250" cy="80" r="4.5" fill="#16a34a" stroke="#ffffff" stroke-width="1.5"/>
<circle cx="285" cy="45" r="4.5" fill="#2563eb" stroke="#ffffff" stroke-width="1.5"/>
<circle cx="180" cy="360" r="3.5" fill="#172033"/>
<text x="234" y="383" class="label">A(2,0)</text>
<text x="311" y="383" class="label">B(4,0)</text>
<text x="225" y="73" class="label">D(2,8)</text>
<text x="324" y="73" class="label">C(4,8)</text>
<text x="308" y="40" class="label">V(3,9)</text>
<text x="166" y="379" class="label">O</text>
<text x="289" y="111" class="math">x=3</text>
<text x="72" y="320" class="math">y=−x²+6x</text>
<rect x="500" y="42" width="284" height="362" rx="12" fill="#f8fafc" stroke="#dbe3ef"/>
<text x="520" y="78" class="title">최대일 때</text>
<text x="520" y="117" class="note">A와 B는 x=3에</text>
<text x="520" y="144" class="note">대하여 대칭</text>
<text x="520" y="193" class="math">A=(2,0), B=(4,0)</text>
<text x="520" y="224" class="math">AB=2,  AD=8</text>
<text x="520" y="272" class="note">둘레가 최대일 때</text>
<text x="520" y="299" class="note">넓이는 밑변×높이</text>
<text x="520" y="346" class="title" fill="#c2410c">넓이 16</text>
</svg>