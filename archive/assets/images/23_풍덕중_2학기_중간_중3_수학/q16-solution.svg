  <text x="190" y="34" text-anchor="middle" font-weight="700">A</text>
  <text x="45" y="474" font-weight="700">B</text>
  <text x="326" y="474" font-weight="700">C</text>
  <text x="279" y="292" font-weight="700">D</text>
