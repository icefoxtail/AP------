<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 716 551" width="716" height="551" role="img" aria-labelledby="title desc"><title id="title">부채꼴과 밑면으로 구성된 원뿔 전개도</title><desc id="desc">옆면은 반지름 9 cm, 중심각 240도인 부채꼴이다. 오른쪽 아래의 원은 밑면이다.</desc><rect width="716" height="551" fill="white" /><path d="M 252.000 250.000 L 400.956 164.000 A 172 172 0 1 1 103.044 164.000 Z" fill="none" /><line x1="252.0000" y1="250.0000" x2="400.9564" y2="164.0000" stroke="#205d9c" stroke-width="4.6" stroke-linecap="round" /><line x1="252.0000" y1="250.0000" x2="103.0436" y2="164.0000" stroke="#205d9c" stroke-width="4.6" stroke-linecap="round" /><path d="M 400.956 164.000 A 172 172 0 1 1 103.044 164.000" fill="none" stroke="#aa5411" stroke-width="4.7" /><path d="M 277.981 235.000 A 30 30 0 1 1 226.019 235.000" fill="none" stroke="#586574" stroke-width="2.5" /><text x="252.0000" y="317.0000" font-size="30" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">240°</text><text x="323.4782" y="182.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#205d9c" text-anchor="middle">9 cm</text><circle cx="547" cy="400" r="114.66666666666667" fill="none" stroke="#277339" stroke-width="4.25" /></svg>
