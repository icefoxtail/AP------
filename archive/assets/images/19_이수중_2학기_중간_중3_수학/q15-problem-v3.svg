<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 710 455" width="710" height="455" role="img" aria-labelledby="title desc"><title id="title">도로에서 다르게 떨어진 두 마을과 최단 경로</title><desc id="desc">두 마을은 같은 쪽에 있고 도로에서 각각 4 km와 2 km 떨어져 있다. 도로 위 두 수선의 발 사이의 거리는 8 km이다.</desc><rect width="710" height="455" fill="white" /><line x1="92.4500" y1="342.5000" x2="647.5500" y2="342.5000" stroke="#586574" stroke-width="4.5" stroke-linecap="round" /><line x1="126.0000" y1="342.5000" x2="126.0000" y2="98.5000" stroke="#205d9c" stroke-width="2.8" stroke-linecap="round" stroke-dasharray="7 5" /><line x1="614.0000" y1="342.5000" x2="614.0000" y2="220.5000" stroke="#704895" stroke-width="2.8" stroke-linecap="round" stroke-dasharray="7 5" /><line x1="126.0000" y1="98.5000" x2="424.9000" y2="342.5000" stroke="#205d9c" stroke-width="4.6" stroke-linecap="round" /><line x1="424.9000" y1="342.5000" x2="614.0000" y2="220.5000" stroke="#277339" stroke-width="4.6" stroke-linecap="round" /><line x1="126.0000" y1="327.5000" x2="141.0000" y2="327.5000" stroke="#586574" stroke-width="1.8" stroke-linecap="round" /><line x1="141.0000" y1="327.5000" x2="141.0000" y2="342.5000" stroke="#586574" stroke-width="1.8" stroke-linecap="round" /><line x1="614.0000" y1="327.5000" x2="599.0000" y2="327.5000" stroke="#586574" stroke-width="1.8" stroke-linecap="round" /><line x1="599.0000" y1="327.5000" x2="599.0000" y2="342.5000" stroke="#586574" stroke-width="1.8" stroke-linecap="round" /><line x1="104.0000" y1="342.5000" x2="104.0000" y2="98.5000" stroke="#205d9c" stroke-width="1.7" stroke-linecap="round" /><line x1="98.5000" y1="342.5000" x2="109.5000" y2="342.5000" stroke="#205d9c" stroke-width="1.7" stroke-linecap="round" /><line x1="98.5000" y1="98.5000" x2="109.5000" y2="98.5000" stroke="#205d9c" stroke-width="1.7" stroke-linecap="round" /><text x="62.0000" y="228.5000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#205d9c" text-anchor="middle">4 km</text><line