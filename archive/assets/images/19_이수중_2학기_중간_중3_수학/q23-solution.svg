<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 755 518" width="755" height="518" role="img" aria-labelledby="title desc"><title id="title">부채꼴과 밑면으로 구성된 원뿔 전개도</title><desc id="desc">전개도의 주황 원호와 원뿔 밑면의 주황 둘레가 대응한다. 꼭짓점을 지나는 단면에서 파랑 모선, 보라 높이, 초록 반지름의 관계를 읽는다.</desc><rect width="755" height="518" fill="white" /><path d="M 187.000 226.000 L 293.521 164.500 A 123 123 0 1 1 80.479 164.500 Z" fill="#e1eefb" /><line x1="187.0000" y1="226.0000" x2="293.5211" y2="164.5000" stroke="#205d9c" stroke-width="4.6" stroke-linecap="round" /><line x1="187.0000" y1="226.0000" x2="80.4789" y2="164.5000" stroke="#205d9c" stroke-width="4.6" stroke-linecap="round" /><path d="M 293.521 164.500 A 123 123 0 1 1 80.479 164.500" fill="none" stroke="#aa5411" stroke-width="4.7" /><path d="M 212.981 211.000 A 30 30 0 1 1 161.019 211.000" fill="none" stroke="#586574" stroke-width="2.5" /><text x="187.0000" y="293.0000" font-size="30" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">240°</text><text x="237.2606" y="170.2500" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#205d9c" text-anchor="middle">9 cm</text><polygon points="419.0000,360.0000 551.0000,212.4195 683.0000,360.0000" fill="#e1eefb" /><ellipse cx="551" cy="360" rx="132" ry="41" fill="#e5f3e4" stroke="none" /><path d="M 419.000 360.000 A 132 41 0 0 1 683.000 360.000" stroke="#aa5411" stroke-width="4.15" stroke-dasharray="7 5" fill="none" /><path d="M 419.000 360.000 A 132 41 0 0 0 683.000 360.000" stroke="#aa5411" stroke-width="4.6" fill="none" /><line x1="419.0000" y1="360.0000" x2="551.0000" y2="212.4195" stroke="#205d9c" stroke-width="4.25" stroke-linecap="round" /><line x1="551.0000" y1="212.4195" x2="683.0000" y2="360.0000" stroke="#205d9c" stroke-width="4.25" stroke-linecap="round" /><line x1="551.0000" y1="212.4195" x2="551.0000" y2="360.0000" stroke="#704895" stroke-width="4.25" stroke-linecap="round" stroke-dasharray