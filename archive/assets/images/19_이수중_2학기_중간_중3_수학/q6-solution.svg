<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 685 431" width="685" height="431" role="img" aria-labelledby="title desc"><title id="title">평균 양쪽의 편차를 표시한 자료 분포</title><desc id="desc">평균 9를 기준으로 쌓은 점들의 위치를 표시했다. 왼쪽 7과 8에는 주황 점, 평균과 같은 9에는 회색 점, 오른쪽 10에는 파란 점이 있다.</desc><rect width="685" height="431" fill="white" /><line x1="58.0000" y1="276.0000" x2="620.0000" y2="276.0000" stroke="#586574" stroke-width="2.1" stroke-linecap="round" /><circle cx="86.0" cy="251" r="11" fill="#aa5411" stroke="white" stroke-width="1.7" /><text x="86.0000" y="313.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">7</text><text x="86.0000" y="391.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#aa5411" text-anchor="middle">−2</text><circle cx="256.0" cy="251" r="11" fill="#aa5411" stroke="white" stroke-width="1.7" /><circle cx="256.0" cy="207" r="11" fill="#aa5411" stroke="white" stroke-width="1.7" /><text x="256.0000" y="313.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">8</text><text x="256.0000" y="391.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#aa5411" text-anchor="middle">−1</text><circle cx="426.0" cy="251" r="11" fill="#586574" stroke="white" stroke-width="1.7" /><circle cx="426.0" cy="207" r="11" fill="#586574" stroke="white" stroke-width="1.7" /><circle cx="426.0" cy="163" r="11" fill="#586574" stroke="white" stroke-width="1.7" /><text x="426.0000" y="313.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">9</text><text x="426.0000" y="391.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#586574" text-anchor="middle">0</text><circle cx="596.0" cy="251" r="11" fill="#205d9c" stroke="white" stroke-width="1.7" /><circle cx="596.0" cy="207" r="11" fill="#205d9c" stroke="white" stroke-width="1.7" /><circle cx="596.0" cy="163" r="11" fill="#205d9c" stroke="white" stroke-width="1.7" /><circle cx="596.0" cy="119" r="11" fill="#205d9c" stroke="white" stroke-width="1.7" /><text x="596.0000" y="313.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">10</text><text x="596.0000" y="391.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#205d9c" text-anchor="middle">+1</text><line x1="426.0000" y1="74.0000" x2="426.0000" y2="149.0000" stroke="#704895" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 5" /><text x="426.0000" y="64.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#704895" text-anchor="middle">평균 9</text><text x="47.0000" y="353.0000" font-size="26" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#586574" text-anchor="middle">편차</text></svg>
