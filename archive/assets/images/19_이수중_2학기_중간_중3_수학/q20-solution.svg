d9c" stroke="white" stroke-width="1.7" /><text x="392.0000" y="313.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">245</text><circle cx="494.0" cy="251" r="11" fill="#586574" stroke="white" stroke-width="1.7" /><text x="494.0000" y="313.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">250</text><circle cx="596.0" cy="251" r="11" fill="#586574" stroke="white" stroke-width="1.7" /><text x="596.0000" y="313.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">255</text><text x="392.0000" y="58.0000" font-size="30" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#205d9c" text-anchor="middle">최빈값</text><text x="633.0000" y="250.0000" font-size="26" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#586574" text-anchor="middle">mm</text></svg>
