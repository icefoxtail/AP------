<svg xmlns="http://www.w3.org/2000/svg" width="520" height="410" viewBox="0 0 520 410" role="img" aria-labelledby="title desc">
  <title id="title">도로를 이용한 최단 경로</title>
  <desc id="desc">A 마을에서 도로 위의 L 도서관을 거쳐 B 마을까지 가는 최단 경로를 구한다. B의 도로 대칭점 B 프라임을 이용하면 A, L, B 프라임이 한 직선 위에 놓인다.</desc>
  <rect x="0" y="0" width="520" height="410" fill="#ffffff"/>
  <text x="26" y="30" font-family="Arial, sans-serif" font-size="16" fill="#1f2937">B′는 도로에 대한 B의 대칭점</text>

  <!-- Road y=0 km, drawn as a light band with a clear centerline. -->
  <rect id="road-band" x="30" y="242" width="440" height="16" rx="3" fill="#e5e7eb"/>
  <line id="road-centerline" x1="30" y1="250" x2="470" y2="250" stroke="#374151" stroke-width="2"/>
  <text x="435" y="232" font-family="Arial, sans-serif" font-size="16" fill="#1f2937">도로</text>

  <!-- Perpendicular distances to the road and the reflection relation B ↔ B′. -->
  <line id="A-road-perpendicular" x1="60" y1="70" x2="60" y2="250" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="5 5"/>
  <line id="B-road-perpendicular" x1="420" y1="160" x2="420" y2="250" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="5 5"/>
  <line id="Bprime-road-perpendicular" x1="420" y1="250" x2="420" y2="340" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="5 5"/>
  <line id="BBprime-reflection" x1="420" y1="160" x2="420" y2="340" stroke="#9ca3af" stroke-width="1" stroke-dasharray="3 5"/>
  <text x="70" y="166" font-family="Arial, sans-serif" font-size="16" fill="#4b5563">4 km</text>
  <text x="430" y="207" font-family="Arial, sans-serif" font-size="16" fill="#4b5563">2 km</text>
  <text x="430" y="316" font-family="Arial, sans-serif" font-size="16" fill="#4b5563">2 km</text>

  <!-- Straightened path A-L-B′ and the actual route A-L-B. -->
  <line id="straightened-ABprime" x1="60" y1="70" x2="420" y2="340" stroke="#d97706" stroke-width="2.5" stroke-dasharray="8 6"/>
  <line id="route-A-L" x1="60" y1="70" x2="300" y2="250" stroke="#2563eb" stroke-width="4"/>
  <line id="route-L-B" x1="300" y1="250" x2="420" y2="160" stroke="#2563eb" stroke-width="4"/>

  <!-- Right-angle markers at the road feet. -->
  <path id="A-road-right-angle" d="M60 238 L72 238 L72 250" fill="none" stroke="#4b5563" stroke-width="1.4"/>
  <path id="B-road-right-angle" d="M420 238 L432 238 L432 250" fill="none" stroke="#4b5563" stroke-width="1.4"/>
  <path id="Bprime-road-right-angle" d="M420 250 L432 250 L432 262" fill="none" stroke="#4b5563" stroke-width="1.4"/>

  <!-- Points are placed on the actual geometry primitives. -->
  <circle id="point-A" cx="60" cy="70" r="4.5" fill="#111827"/>
  <circle id="point-B" cx="420" cy="160" r="4.5" fill="#111827"/>
  <circle id="point-Bprime" cx="420" cy="340" r="4.5" fill="#111827"/>
  <circle id="point-L" cx="300" cy="250" r="5" fill="#dc2626" stroke="#ffffff" stroke-width="1.5"/>

  <text x="24" y="60" font-family="Arial, sans-serif" font-size="16" fill="#111827">A 마을</text>
  <text x="424" y="151" font-family="Arial, sans-serif" font-size="16" fill="#111827">B 마을</text>
  <text x="337" y="365" font-family="Arial, sans-serif" font-size="16" fill="#111827">B′</text>
  <text x="192" y="280" font-family="Arial, sans-serif" font-size="16" fill="#111827">L(도서관)</text>
  
  <text x="82" y="333" font-family="Arial, sans-serif" font-size="16" fill="#92400e">AB′=10 km</text>
  <text x="322" y="84" font-family="Arial, sans-serif" font-size="16" fill="#1f2937">LB=LB′</text>

  <line x1="32" y1="390" x2="52" y2="390" stroke="#2563eb" stroke-width="4"/>
  <text x="60" y="396" font-family="Arial, sans-serif" font-size="16" fill="#1f2937">실제 경로 A-L-B</text>
  <line x1="263" y1="390" x2="283" y2="390" stroke="#d97706" stroke-width="2.5" stroke-dasharray="8 6"/>
  <text x="291" y="396" font-family="Arial, sans-serif" font-size="16" fill="#1f2937">펴서 본 직선 A-L-B′</text>
</svg>
