<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" role="img" aria-labelledby="title desc">
  <title id="title">원이 되기 위한 조건</title>
  <desc id="desc">식 (x−1)²+(y+2)²=−a−1에서 반지름의 제곱이 양수여야 하고 a의 정수 최댓값은 −2</desc>
  <rect width="640" height="300" fill="#fff"/>
  <text x="320" y="28" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="21" font-weight="700" fill="#1e3a5f">반지름의 제곱이 양수여야 원이다</text>
  <rect x="18" y="45" width="330" height="238" rx="8" fill="#f8fafc" stroke="#dbe3ef"/>
  <g stroke="#e2e8f0" stroke-width="1">
    <line x1="30" y1="72" x2="30" y2="270"/><line x1="64" y1="72" x2="64" y2="270"/><line x1="98" y1="72" x2="98" y2="270"/><line x1="132" y1="72" x2="132" y2="270"/><line x1="166" y1="72" x2="166" y2="270"/><line x1="200" y1="72" x2="200" y2="270"/><line x1="234" y1="72" x2="234" y2="270"/><line x1="268" y1="72" x2="268" y2="270"/><line x1="302" y1="72" x2="302" y2="270"/><line x1="336" y1="72" x2="336" y2="270"/>
    <line x1="28" y1="88" x2="338" y2="88"/><line x1="28" y1="122" x2="338" y2="122"/><line x1="28" y1="156" x2="338" y2="156"/><line x1="28" y1="190" x2="338" y2="190"/><line x1="28" y1="224" x2="338" y2="224"/><line x1="28" y1="258" x2="338" y2="258"/>
  </g>
  <line x1="28" y1="190" x2="338" y2="190" stroke="#0f172a" stroke-width="1.5"/><line x1="100" y1="274" x2="100" y2="58" stroke="#0f172a" stroke-width="1.5"/>
  <text x="328" y="184" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14">x</text><text x="107" y="68" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14">y</text>
  <circle cx="134" cy="258" r="34" fill="#dbeafe" fill-opacity=".72" stroke="#2563eb" stroke-width="2.6"/>
  <circle cx="134" cy="258" r="4.5" fill="#1d4ed8"/>
  <line x1="134" y1="258" x2="168" y2="258" stroke="#dc2626" stroke-width="2.2" stroke-dasharray="6 4"/>
  <text x="142" y="251" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14" font-weight="700">C(1,−2)</text>
  <text x="172" y="253" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="13" fill="#b91c1c">r=1</text>
  <text x="36" y="276" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="13" fill="#475569">a=−2일 때의 대표 원</text>
  <rect x="370" y="45" width="252" height="238" rx="8" fill="#f8fafc" stroke="#dbe3ef"/>
  <text x="388" y="75" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="17" font-weight="700" fill="#334155">조건 정리</text>
  <text x="388" y="108" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="15">(x−1)² + (y+2)² = −a−1</text>
  <text x="388" y="138" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="15">반지름의 제곱: r² = −a−1</text>
  <text x="388" y="168" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="17" font-weight="700" fill="#1d4ed8">r² &gt; 0  →  a &lt; −1</text>
  <line x1="388" y1="184" x2="602" y2="184" stroke="#cbd5e1"/>
  <text x="388" y="215" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="15">정수 a의 최댓값</text>
  <text x="388" y="246" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="19" font-weight="700" fill="#1d4ed8">a = −2</text>
  <text x="388" y="270" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="13" fill="#475569">a=−1이면 r²=0이므로 원이 아님</text>
</svg>

