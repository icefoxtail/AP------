<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" role="img" aria-labelledby="title desc">
  <title id="title">x축에 접하는 원</title>
  <desc id="desc">중심 (2,3), 반지름 3인 원이 x축에 접하고 점 P(−1,3)를 지나며 중심은 직선 y=x+1 위에 있음</desc>
  <rect width="640" height="300" fill="#fff"/>
  <text x="320" y="28" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="21" font-weight="700" fill="#1e3a5f">중심의 위치와 접점 조건을 함께 사용</text>
  <rect x="18" y="45" width="330" height="238" rx="8" fill="#f8fafc" stroke="#dbe3ef"/>
  <g stroke="#e2e8f0" stroke-width="1">
    <line x1="26" y1="67" x2="26" y2="277"/><line x1="54" y1="67" x2="54" y2="277"/><line x1="82" y1="67" x2="82" y2="277"/><line x1="110" y1="67" x2="110" y2="277"/><line x1="138" y1="67" x2="138" y2="277"/><line x1="166" y1="67" x2="166" y2="277"/><line x1="194" y1="67" x2="194" y2="277"/><line x1="222" y1="67" x2="222" y2="277"/><line x1="250" y1="67" x2="250" y2="277"/><line x1="278" y1="67" x2="278" y2="277"/><line x1="306" y1="67" x2="306" y2="277"/><line x1="334" y1="67" x2="334" y2="277"/>
    <line x1="24" y1="67" x2="338" y2="67"/><line x1="24" y1="95" x2="338" y2="95"/><line x1="24" y1="123" x2="338" y2="123"/><line x1="24" y1="151" x2="338" y2="151"/><line x1="24" y1="179" x2="338" y2="179"/><line x1="24" y1="207" x2="338" y2="207"/><line x1="24" y1="235" x2="338" y2="235"/><line x1="24" y1="263" x2="338" y2="263"/>
  </g>
  <line x1="24" y1="235" x2="338" y2="235" stroke="#0f172a" stroke-width="1.5"/><line x1="90" y1="277" x2="90" y2="58" stroke="#0f172a" stroke-width="1.5"/>
  <text x="330" y="229" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14">x</text><text x="97" y="68" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14">y</text>
  <line x1="34" y1="263" x2="306" y2="67" stroke="#7c3aed" stroke-width="2.2" stroke-dasharray="7 5"/>
  <circle cx="146" cy="151" r="84" fill="#dbeafe" fill-opacity=".64" stroke="#2563eb" stroke-width="2.6"/>
  <line x1="146" y1="151" x2="146" y2="235" stroke="#dc2626" stroke-width="2.2" stroke-dasharray="6 4"/>
  <circle cx="146" cy="151" r="4.5" fill="#1d4ed8"/><circle cx="62" cy="151" r="4.5" fill="#dc2626"/>
  <text x="154" y="145" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14" font-weight="700">C(2,3)</text>
  <text x="31" y="145" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14" font-weight="700" fill="#b91c1c">P(−1,3)</text>
  <text x="149" y="230" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="13" fill="#b91c1c">r=3</text>
  <text x="232" y="92" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="13" fill="#6d28d9">y=x+1</text>
  <text x="242" y="252" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="13" fill="#475569">x축 접점</text>
  <rect x="370" y="45" width="252" height="238" rx="8" fill="#f8fafc" stroke="#dbe3ef"/>
  <text x="388" y="75" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="17" font-weight="700" fill="#334155">식 세우기</text>
  <text x="388" y="108" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="15">중심 C=(a, a+1)</text>
  <text x="388" y="138" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="15">x축 접선 → r=|a+1|</text>
  <text x="388" y="168" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14">(a+1)²+(a−2)²=(a+1)²</text>
  <line x1="388" y1="184" x2="602" y2="184" stroke="#cbd5e1"/>
  <text x="388" y="216" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="17" font-weight="700" fill="#1d4ed8">(a−2)² = 0  →  a=2</text>
  <text x="388" y="249" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="18" font-weight="700" fill="#1d4ed8">r=3,  넓이=9π</text>
  <text x="388" y="272" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="13" fill="#475569">점 P는 원 위, 중심은 y=x+1 위</text>
</svg>

