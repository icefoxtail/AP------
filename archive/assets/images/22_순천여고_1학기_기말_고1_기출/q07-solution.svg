<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" role="img" aria-labelledby="title desc">
  <title id="title">접선이 원의 넓이를 이등분</title>
  <desc id="desc">원 x²+y²=13의 접선 −2x+3y=13과 원 (x+a)²+(y−1)²=9의 중심 (−a,1)이 같은 직선 위에 놓임</desc>
  <rect width="640" height="300" fill="#fff"/>
  <text x="320" y="28" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="21" font-weight="700" fill="#1e3a5f">원의 넓이를 이등분하는 직선은 중심을 지난다</text>
  <rect x="18" y="45" width="330" height="238" rx="8" fill="#f8fafc" stroke="#dbe3ef"/>
  <g stroke="#e2e8f0" stroke-width="1">
    <line x1="20" y1="70" x2="20" y2="270"/><line x1="44" y1="70" x2="44" y2="270"/><line x1="68" y1="70" x2="68" y2="270"/><line x1="92" y1="70" x2="92" y2="270"/><line x1="116" y1="70" x2="116" y2="270"/><line x1="140" y1="70" x2="140" y2="270"/><line x1="164" y1="70" x2="164" y2="270"/><line x1="188" y1="70" x2="188" y2="270"/><line x1="212" y1="70" x2="212" y2="270"/><line x1="236" y1="70" x2="236" y2="270"/><line x1="260" y1="70" x2="260" y2="270"/><line x1="284" y1="70" x2="284" y2="270"/><line x1="308" y1="70" x2="308" y2="270"/><line x1="332" y1="70" x2="332" y2="270"/>
    <line x1="20" y1="94" x2="334" y2="94"/><line x1="20" y1="118" x2="334" y2="118"/><line x1="20" y1="142" x2="334" y2="142"/><line x1="20" y1="166" x2="334" y2="166"/><line x1="20" y1="190" x2="334" y2="190"/><line x1="20" y1="214" x2="334" y2="214"/><line x1="20" y1="238" x2="334" y2="238"/><line x1="20" y1="262" x2="334" y2="262"/>
  </g>
  <line x1="20" y1="190" x2="334" y2="190" stroke="#0f172a" stroke-width="1.5"/><line x1="180" y1="270" x2="180" y2="58" stroke="#0f172a" stroke-width="1.5"/>
  <text x="326" y="184" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14">x</text><text x="187" y="68" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14">y</text>
  <circle cx="180" cy="190" r="86.5" fill="#dbeafe" fill-opacity=".56" stroke="#2563eb" stroke-width="2.5"/>
  <circle cx="60" cy="166" r="72" fill="#dcfce7" fill-opacity=".68" stroke="#16a34a" stroke-width="2.5"/>
  <line x1="20" y1="198" x2="223" y2="58" stroke="#dc2626" stroke-width="2.5"/>
  <line x1="180" y1="190" x2="132" y2="118" stroke="#7c3aed" stroke-width="2.1" stroke-dasharray="6 4"/>
  <circle cx="180" cy="190" r="4.5" fill="#1d4ed8"/><circle cx="60" cy="166" r="4.5" fill="#15803d"/><circle cx="132" cy="118" r="4.2" fill="#dc2626"/>
  <text x="190" y="208" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14" font-weight="700">O(0,0)</text>
  <text x="29" y="157" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14" font-weight="700" fill="#15803d">C₂(−5,1)</text>
  <text x="137" y="112" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="13" font-weight="700" fill="#b91c1c">T(−2,3)</text>
  <text x="196" y="83" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="13" fill="#b91c1c">−2x+3y=13</text>
  <rect x="370" y="45" width="252" height="238" rx="8" fill="#f8fafc" stroke="#dbe3ef"/>
  <text x="388" y="75" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="17" font-weight="700" fill="#334155">중심을 대입</text>
  <text x="388" y="108" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="15">접선: −2x + 3y = 13</text>
  <text x="388" y="138" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="15">두 번째 원의 중심: (−a, 1)</text>
  <text x="388" y="168" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="15">−2(−a) + 3·1 = 13</text>
  <line x1="388" y1="184" x2="602" y2="184" stroke="#cbd5e1"/>
  <text x="388" y="216" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="17" font-weight="700" fill="#1d4ed8">2a + 3 = 13</text>
  <text x="388" y="249" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="19" font-weight="700" fill="#1d4ed8">a = 5</text>
  <text x="388" y="272" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="13" fill="#475569">직선이 중심을 지나면 넓이가 반으로 나뉜다</text>
</svg>

