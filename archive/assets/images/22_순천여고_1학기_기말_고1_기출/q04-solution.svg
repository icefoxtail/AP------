<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" role="img" aria-labelledby="title desc">
  <title id="title">기울기 3인 두 접선</title>
  <desc id="desc">원 x²+y²=4와 평행한 두 접선 y=3x±2√10, 접점과 원점 사이의 수직 관계</desc>
  <rect width="640" height="300" fill="#fff"/>
  <text x="320" y="28" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="21" font-weight="700" fill="#1e3a5f">기울기 3인 두 접선: y = 3x ± 2√10</text>
  <rect x="18" y="45" width="330" height="238" rx="8" fill="#f8fafc" stroke="#dbe3ef"/>
  <g stroke="#e2e8f0" stroke-width="1">
    <line x1="34" y1="74" x2="34" y2="267"/><line x1="62" y1="74" x2="62" y2="267"/><line x1="90" y1="74" x2="90" y2="267"/><line x1="118" y1="74" x2="118" y2="267"/><line x1="146" y1="74" x2="146" y2="267"/><line x1="174" y1="74" x2="174" y2="267"/><line x1="202" y1="74" x2="202" y2="267"/><line x1="230" y1="74" x2="230" y2="267"/><line x1="258" y1="74" x2="258" y2="267"/><line x1="286" y1="74" x2="286" y2="267"/><line x1="314" y1="74" x2="314" y2="267"/>
    <line x1="30" y1="88" x2="334" y2="88"/><line x1="30" y1="116" x2="334" y2="116"/><line x1="30" y1="144" x2="334" y2="144"/><line x1="30" y1="172" x2="334" y2="172"/><line x1="30" y1="200" x2="334" y2="200"/><line x1="30" y1="228" x2="334" y2="228"/><line x1="30" y1="256" x2="334" y2="256"/>
  </g>
  <line x1="30" y1="228" x2="334" y2="228" stroke="#0f172a" stroke-width="1.5"/><line x1="90" y1="270" x2="90" y2="58" stroke="#0f172a" stroke-width="1.5"/>
  <text x="326" y="222" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14">x</text><text x="96" y="68" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14">y</text>
  <circle cx="90" cy="228" r="56" fill="#dbeafe" fill-opacity=".7" stroke="#2563eb" stroke-width="2.6"/>
  <line x1="34" y1="200" x2="74" y2="86" stroke="#0f766e" stroke-width="2.5"/>
  <line x1="121" y1="267" x2="188" y2="76" stroke="#f97316" stroke-width="2.5"/>
  <line x1="90" y1="228" x2="37" y2="210" stroke="#dc2626" stroke-width="2.2" stroke-dasharray="6 4"/>
  <circle cx="90" cy="228" r="4.5" fill="#1d4ed8"/><circle cx="37" cy="210" r="4.2" fill="#0f766e"/><circle cx="143" cy="246" r="4.2" fill="#f97316"/>
  <text x="98" y="245" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14" font-weight="700">O(0,0)</text>
  <text x="42" y="202" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="13" font-weight="700" fill="#047857">T₁</text>
  <text x="148" y="257" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="13" font-weight="700" fill="#c2410c">T₂</text>
  <text x="35" y="190" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="13" fill="#047857">y=3x+2√10</text>
  <text x="166" y="88" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="13" fill="#c2410c">y=3x−2√10</text>
  <text x="98" y="215" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="13" fill="#b91c1c">OT ⟂ 접선</text>
  <rect x="370" y="45" width="252" height="238" rx="8" fill="#f8fafc" stroke="#dbe3ef"/>
  <text x="388" y="75" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="17" font-weight="700" fill="#334155">거리 조건</text>
  <text x="388" y="108" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="15">원점 O에서 접선까지의 거리</text>
  <text x="388" y="136" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="16">|±k| / √(3²+1²) = k/√10</text>
  <text x="388" y="166" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="15">반지름과 같으므로</text>
  <text x="388" y="194" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="17" font-weight="700" fill="#1d4ed8">k / √10 = 2</text>
  <line x1="388" y1="210" x2="602" y2="210" stroke="#cbd5e1"/>
  <text x="388" y="240" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="17" font-weight="700" fill="#1d4ed8">k = 2√10</text>
  <text x="388" y="266" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="13" fill="#475569">두 직선의 위치를 나타내는 양의 거리값</text>
</svg>

