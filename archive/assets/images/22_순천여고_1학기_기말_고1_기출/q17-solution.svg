<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320" role="img" aria-labelledby="title desc">
  <title id="title">현의 수직이등분선과 P</title>
  <desc id="desc">원 중심 C(4,3), 현 AB를 포함하는 직선 y=2x−3, 수직이등분선 x+2y−10=0과 y축 위의 점 P(0,5)</desc>
  <rect width="640" height="320" fill="#fff"/>
  <text x="320" y="28" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="21" font-weight="700" fill="#1e3a5f">A, B에서 같은 거리에 있는 점은 현의 수직이등분선 위</text>
  <rect x="18" y="45" width="330" height="258" rx="8" fill="#f8fafc" stroke="#dbe3ef"/>
  <g stroke="#e2e8f0" stroke-width="1">
    <line x1="20" y1="70" x2="20" y2="290"/><line x1="50" y1="70" x2="50" y2="290"/><line x1="80" y1="70" x2="80" y2="290"/><line x1="110" y1="70" x2="110" y2="290"/><line x1="140" y1="70" x2="140" y2="290"/><line x1="170" y1="70" x2="170" y2="290"/><line x1="200" y1="70" x2="200" y2="290"/><line x1="230" y1="70" x2="230" y2="290"/><line x1="260" y1="70" x2="260" y2="290"/><line x1="290" y1="70" x2="290" y2="290"/><line x1="320" y1="70" x2="320" y2="290"/>
    <line x1="20" y1="75" x2="334" y2="75"/><line x1="20" y1="105" x2="334" y2="105"/><line x1="20" y1="135" x2="334" y2="135"/><line x1="20" y1="165" x2="334" y2="165"/><line x1="20" y1="195" x2="334" y2="195"/><line x1="20" y1="225" x2="334" y2="225"/><line x1="20" y1="255" x2="334" y2="255"/><line x1="20" y1="285" x2="334" y2="285"/>
  </g>
  <line x1="20" y1="225" x2="334" y2="225" stroke="#0f172a" stroke-width="1.5"/><line x1="95" y1="295" x2="95" y2="58" stroke="#0f172a" stroke-width="1.5"/>
  <text x="326" y="219" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14">x</text><text x="102" y="68" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14">y</text>
  <circle cx="215" cy="135" r="67.1" fill="#dbeafe" fill-opacity=".68" stroke="#2563eb" stroke-width="2.6"/>
  <line x1="140" y1="225" x2="225" y2="63" stroke="#dc2626" stroke-width="2.5"/>
  <line x1="80" y1="67" x2="305" y2="180" stroke="#7c3aed" stroke-width="2.4" stroke-dasharray="7 5"/>
  <line x1="215" y1="135" x2="164" y2="178" stroke="#0f766e" stroke-width="2.1" stroke-dasharray="6 4"/>
  <circle cx="215" cy="135" r="4.5" fill="#1d4ed8"/><circle cx="164" cy="178" r="4.2" fill="#dc2626"/><circle cx="219" cy="68" r="4.2" fill="#dc2626"/><circle cx="95" cy="75" r="4.5" fill="#7c3aed"/>
  <text x="222" y="130" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14" font-weight="700">C(4,3)</text>
  <text x="143" y="192" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14" font-weight="700" fill="#b91c1c">A</text>
  <text x="224" y="66" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14" font-weight="700" fill="#b91c1c">B</text>
  <text x="101" y="72" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14" font-weight="700" fill="#6d28d9">P(0,5)</text>
  <text x="202" y="212" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="12" fill="#b91c1c">AB: y=2x−3</text>
  <text x="230" y="175" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="12" fill="#6d28d9">x+2y−10=0</text>
  <rect x="370" y="45" width="252" height="258" rx="8" fill="#f8fafc" stroke="#dbe3ef"/>
  <text x="388" y="75" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="17" font-weight="700" fill="#334155">수직이등분선</text>
  <text x="388" y="108" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="15">AB의 기울기 = 2</text>
  <text x="388" y="138" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="15">수직인 기울기 = −1/2</text>
  <text x="388" y="168" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14">C(4,3)을 지나므로</text>
  <text x="388" y="196" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="15">y−3 = −1/2(x−4)</text>
  <line x1="388" y1="210" x2="602" y2="210" stroke="#cbd5e1"/>
  <text x="388" y="240" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="16" font-weight="700" fill="#1d4ed8">x=0 → a=5</text>
  <text x="388" y="272" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="13" fill="#475569">P(0,a)는 수직이등분선 위</text>
</svg>

