<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" role="img" aria-labelledby="title desc">
  <title id="title">대칭이동한 원의 중심</title>
  <desc id="desc">원 중심 (a,−2)가 y=x 대칭으로 (−2,a)가 되고 목표 원의 중심 (−2,−1)과 일치하여 a=−1, r=3</desc>
  <rect width="640" height="300" fill="#fff"/>
  <text x="320" y="28" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="21" font-weight="700" fill="#1e3a5f">y = x 대칭에서는 중심의 좌표를 바꾼다</text>
  <rect x="18" y="45" width="330" height="238" rx="8" fill="#f8fafc" stroke="#dbe3ef"/>
  <g stroke="#e2e8f0" stroke-width="1">
    <line x1="31" y1="72" x2="31" y2="270"/><line x1="53" y1="72" x2="53" y2="270"/><line x1="75" y1="72" x2="75" y2="270"/><line x1="97" y1="72" x2="97" y2="270"/><line x1="119" y1="72" x2="119" y2="270"/><line x1="141" y1="72" x2="141" y2="270"/><line x1="163" y1="72" x2="163" y2="270"/><line x1="185" y1="72" x2="185" y2="270"/><line x1="207" y1="72" x2="207" y2="270"/><line x1="229" y1="72" x2="229" y2="270"/><line x1="251" y1="72" x2="251" y2="270"/><line x1="273" y1="72" x2="273" y2="270"/><line x1="295" y1="72" x2="295" y2="270"/><line x1="317" y1="72" x2="317" y2="270"/><line x1="339" y1="72" x2="339" y2="270"/>
    <line x1="28" y1="72" x2="340" y2="72"/><line x1="28" y1="94" x2="340" y2="94"/><line x1="28" y1="116" x2="340" y2="116"/><line x1="28" y1="138" x2="340" y2="138"/><line x1="28" y1="160" x2="340" y2="160"/><line x1="28" y1="182" x2="340" y2="182"/><line x1="28" y1="204" x2="340" y2="204"/><line x1="28" y1="226" x2="340" y2="226"/><line x1="28" y1="248" x2="340" y2="248"/><line x1="28" y1="270" x2="340" y2="270"/>
  </g>
  <line x1="28" y1="160" x2="340" y2="160" stroke="#0f172a" stroke-width="1.5"/><line x1="185" y1="274" x2="185" y2="58" stroke="#0f172a" stroke-width="1.5"/>
  <text x="330" y="154" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14">x</text><text x="192" y="68" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14">y</text>
  <line x1="75" y1="270" x2="295" y2="50" stroke="#7c3aed" stroke-width="2" stroke-dasharray="7 5"/>
  <circle cx="163" cy="204" r="66" fill="#dbeafe" fill-opacity=".62" stroke="#2563eb" stroke-width="2.5"/>
  <circle cx="141" cy="182" r="66" fill="#fce7f3" fill-opacity=".48" stroke="#db2777" stroke-width="2.5"/>
  <line x1="163" y1="204" x2="141" y2="182" stroke="#dc2626" stroke-width="2.2" stroke-dasharray="6 4"/>
  <circle cx="163" cy="204" r="4.5" fill="#1d4ed8"/><circle cx="141" cy="182" r="4.5" fill="#be185d"/>
  <text x="171" y="221" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="13" font-weight="700" fill="#1d4ed8">C(−1,−2)</text>
  <text x="89" y="177" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="13" font-weight="700" fill="#be185d">C′(−2,−1)</text>
  <text x="224" y="90" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="13" fill="#6d28d9">y=x</text>
  <rect x="370" y="45" width="252" height="238" rx="8" fill="#f8fafc" stroke="#dbe3ef"/>
  <text x="388" y="75" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="17" font-weight="700" fill="#334155">중심과 반지름</text>
  <text x="388" y="108" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="15">원래 중심: (a, −2)</text>
  <text x="388" y="138" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="15">y=x 대칭 → (−2, a)</text>
  <text x="388" y="168" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="15">목표 중심 (−2,−1)과 비교</text>
  <line x1="388" y1="184" x2="602" y2="184" stroke="#cbd5e1"/>
  <text x="388" y="216" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="17" font-weight="700" fill="#1d4ed8">a = −1,  r = 3</text>
  <text x="388" y="249" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="18" font-weight="700" fill="#1d4ed8">a + r = 2</text>
  <text x="388" y="272" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="13" fill="#475569">반지름은 대칭이동해도 변하지 않는다</text>
</svg>

