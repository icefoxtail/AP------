<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320" role="img" aria-labelledby="title desc" data-scale-policy="SCHEMATIC_ALLOWED">
  <title id="title">내분점 조건으로 두 교점 결정</title>
  <desc id="desc">원 중심 (1,3), 직선 y=x+1과의 교점 P(0,1), Q(3,4), 내분점 R(2,3), 원의 방정식 k=5</desc>
  <rect width="640" height="320" fill="#fff"/>
  <text x="320" y="28" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="21" font-weight="700" fill="#1e3a5f">내분점 조건으로 P, Q의 좌표를 정한다</text>
  <rect x="18" y="45" width="330" height="258" rx="8" fill="#f8fafc" stroke="#dbe3ef"/>
  <g stroke="#e2e8f0" stroke-width="1">
    <line x1="20" y1="70" x2="20" y2="290"/><line x1="50" y1="70" x2="50" y2="290"/><line x1="80" y1="70" x2="80" y2="290"/><line x1="110" y1="70" x2="110" y2="290"/><line x1="140" y1="70" x2="140" y2="290"/><line x1="170" y1="70" x2="170" y2="290"/><line x1="200" y1="70" x2="200" y2="290"/><line x1="230" y1="70" x2="230" y2="290"/><line x1="260" y1="70" x2="260" y2="290"/><line x1="290" y1="70" x2="290" y2="290"/><line x1="320" y1="70" x2="320" y2="290"/>
    <line x1="20" y1="80" x2="334" y2="80"/><line x1="20" y1="110" x2="334" y2="110"/><line x1="20" y1="140" x2="334" y2="140"/><line x1="20" y1="170" x2="334" y2="170"/><line x1="20" y1="200" x2="334" y2="200"/><line x1="20" y1="230" x2="334" y2="230"/><line x1="20" y1="260" x2="334" y2="260"/><line x1="20" y1="290" x2="334" y2="290"/>
  </g>
  <line x1="20" y1="230" x2="334" y2="230" stroke="#0f172a" stroke-width="1.5"/><line x1="110" y1="295" x2="110" y2="58" stroke="#0f172a" stroke-width="1.5"/>
  <text x="326" y="224" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14">x</text><text x="117" y="68" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14">y</text>
  <circle cx="140" cy="140" r="67" fill="#dbeafe" fill-opacity=".66" stroke="#2563eb" stroke-width="2.6"/>
  <line x1="77" y1="263" x2="227" y2="113" stroke="#7c3aed" stroke-width="2.4"/>
  <line x1="110" y1="200" x2="200" y2="110" stroke="#dc2626" stroke-width="2.2" stroke-dasharray="7 5"/>
  <circle cx="140" cy="140" r="4.5" fill="#1d4ed8"/><circle cx="110" cy="200" r="4.5" fill="#16a34a"/><circle cx="200" cy="110" r="4.5" fill="#dc2626"/><circle cx="170" cy="140" r="4.5" fill="#f97316"/>
  <text x="147" y="135" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14" font-weight="700">C(1,3)</text>
  <text x="78" y="218" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14" font-weight="700" fill="#15803d">P(0,1)</text>
  <text x="205" y="105" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14" font-weight="700" fill="#b91c1c">Q(3,4)</text>
  <text x="174" y="134" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14" font-weight="700" fill="#c2410c">R(2,3)</text>
  <text x="224" y="106" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="13" fill="#6d28d9">y=x+1</text>
  <rect x="370" y="45" width="252" height="258" rx="8" fill="#f8fafc" stroke="#dbe3ef"/>
  <text x="388" y="75" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="17" font-weight="700" fill="#334155">내분점 계산</text>
  <text x="388" y="108" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14">교점의 x좌표를 p&lt;q라 두면</text>
  <text x="388" y="136" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="16">p+q = 3</text>
  <text x="388" y="166" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="15">R의 x좌표: (p+2q)/3 = 2</text>
  <line x1="388" y1="182" x2="602" y2="182" stroke="#cbd5e1"/>
  <text x="388" y="213" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="16" font-weight="700" fill="#1d4ed8">p=0,  q=3</text>
  <text x="388" y="243" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="15">P=(0,1)을 원에 대입</text>
  <text x="388" y="272" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="17" font-weight="700" fill="#1d4ed8">k=1²+(-2)²=5</text>
</svg>
