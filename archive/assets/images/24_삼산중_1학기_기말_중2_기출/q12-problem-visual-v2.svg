<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 748 638" width="748" height="638" role="img" aria-labelledby="title desc"><title id="title">기울기와 세로축 절편을 비교하는 여섯 직선</title><desc id="desc">ㄱ과 ㅁ은 원점을 지나며, ㄱ은 오르막이고 ㅁ은 내리막이다. ㄴ은 오르막이고 세로축의 원점 아래, ㄷ은 오르막이고 원점 위에 닿는다. ㄹ은 내리막이며 원점 위, ㅂ은 내리막이며 원점 아래에 닿는다.</desc><rect width="748" height="638" fill="white" /><line x1="72.0000" y1="338.1676" x2="655.0000" y2="338.1676" stroke="#586574" stroke-width="2.05" stroke-linecap="round" /><polygon points="668.0000,338.1676 655.0000,332.9676 655.0000,343.3676" fill="#586574" /><line x1="370.0000" y1="584.0000" x2="370.0000" y2="86.0000" stroke="#586574" stroke-width="2.05" stroke-linecap="round" /><polygon points="370.0000,73.0000 364.8000,86.0000 375.2000,86.0000" fill="#586574" /><line x1="82.1320" y1="493.7798" x2="657.8680" y2="182.5553" stroke="#24659b" stroke-width="6.0" stroke-linecap="round" /><circle cx="676.4444444444445" cy="178.02767567567565" r="17" fill="white" stroke="#24659b" stroke-width="1.9" /><text x="676.4444" y="189.0277" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#24659b" text-anchor="middle">ㄱ</text><line x1="279.5908" y1="575.3130" x2="624.4211" y2="81.6870" stroke="#207164" stroke-width="6.0" stroke-linecap="round" stroke-dasharray="14 7" /><circle cx="644.3703703703704" cy="55.60205405405401" r="17" fill="white" stroke="#207164" stroke-width="1.9" /><text x="644.3704" y="66.6021" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#207164" text-anchor="middle">ㄴ</text><line x1="79.4812" y1="480.0636" x2="504.5913" y2="80.0398" stroke="#774898" stroke-width="6.0" stroke-linecap="round" stroke-dasharray="8 6" /><circle cx="506.85925925925926" cy="58.91664864864856" r="17" fill="white" stroke="#774898" stroke-width="1.9" /><text x="506.8593" y="69.9166" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#774898" text-anchor="mid