<title id="title">세 모서리의 제곱합은 공간 대각선의 제곱</title>
<desc id="desc">직육면체의 서로 다른 세 모서리 방향과 반대 꼭짓점을 잇는 공간 대각선을 표시한 비례를 나타내지 않는 사시도</desc>
<style>.title{font:700 22px "Noto Sans KR","Malgun Gothic",sans-serif;fill:#111827}.note{font:15px "Noto Sans KR","Malgun Gothic",sans-serif;fill:#475569}.edge{stroke:#334155;stroke-width:2.4;fill:none;stroke-linecap:round}.hidden{stroke:#64748b;stroke-width:1.8;stroke-dasharray:4 4;fill:none;stroke-linecap:round}.diag{stroke:#c2410c;stroke-width:4;fill:none;stroke-linecap:round}.dim{font:700 19px "STIX Two Math","Cambria Math",serif;font-style:italic;fill:#1d4ed8}.endpoint{font:700 18px "STIX Two Math","Cambria Math",serif;font-style:italic;fill:#9a3412}.panel{fill:#f8fafc;stroke:#cbd5e1;stroke-width:1.2}.math{font:italic 25px "STIX Two Math","Cambria Math",serif;fill:#111827}.panelnote{font:15px "Noto Sans KR","Malgun Gothic",sans-serif;fill:#334155}</style>
<rect width="720" height="390" fill="#fff"/>
<text x="32" y="38" class="title">세 모서리를 잇는 공간 대각선</text>
<text x="32" y="64" class="note">그림은 꼭짓점·모서리 관계를 보이며 길이 비율은 나타내지 않는다.</text>
