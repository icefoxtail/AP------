<text x="366" y="102" class="text title">그래프에서 확인</text>
<text x="366" y="148" class="text note">두 근의 차: 3</text>
<text x="366" y="184" class="text note">근의 합: a+(a+3)=5</text>
<text x="366" y="220" class="text note">따라서 a=1</text>
