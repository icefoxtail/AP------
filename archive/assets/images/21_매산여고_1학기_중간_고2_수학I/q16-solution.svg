<svg xmlns="http://www.w3.org/2000/svg" width="940" height="440" viewBox="0 0 940 440" font-family="Noto Sans CJK KR, sans-serif" role="img" aria-label="동경의 y축 및 y=x 대칭 관계">
<rect width="940" height="440" fill="#ffffff"/>
<text x="55" y="40" font-size="22" font-family="Noto Sans CJK KR, sans-serif" fill="#17324a">동경의 대칭 조건 — θ = π/6인 경우</text>
<text x="250" y="85" text-anchor="middle" font-family="Noto Sans CJK KR, sans-serif" font-size="18" fill="#283c4f">y축 대칭: θ와 5θ</text>
<circle cx="250" cy="245" r="117" fill="none" stroke="#e2e9ee" stroke-width="1.5"/>
<line x1="105" y1="245" x2="395" y2="245" stroke="#b6c5cf" stroke-width="1.5"/>
<line x1="250" y1="382" x2="250" y2="108" stroke="#b6c5cf" stroke-width="1.5"/>
<line x1="250" y1="106" x2="250" y2="384" stroke="#2a9562" stroke-width="3" stroke-dasharray="6 5"/>
<text x="263" y="106" font-size="16" fill="#278153">y축</text>
<line x1="250" y1="245" x2="351.32" y2="186.50" stroke="#216d9d" stroke-width="4" stroke-linecap="round"/>
<circle cx="351.32" cy="186.50" r="5" fill="#216d9d"/>
<text x="372.11" y="189.50" text-anchor="middle" font-size="16" fill="#216d9d">θ = π/6</text>
<line x1="250" y1="245" x2="148.68" y2="186.50" stroke="#d47531" stroke-width="4" stroke-linecap="round"/>
<circle cx="148.68" cy="186.50" r="5" fill="#d47531"/>
<text x="127.89" y="152.50" text-anchor="middle" font-size="16" fill="#d47531">5θ = 5π/6</text>
<circle cx="250" cy="245" r="4" fill="#27394c"/>
<text x="258" y="264" font-size="15" fill="#27394c">O</text>
<text x="700" y="85" text-anchor="middle" font-family="Noto Sans CJK KR, sans-serif" font-size="18" fill="#283c4f">직선 y=x 대칭: θ와 2θ</text>
<circle cx="700" cy="245" r="117" fill="none" stroke="#e2e9ee" stroke-width="1.5"/>
<line x1="555" y1="245" x2="845" y2="245" stroke="#b6c5cf" stroke-width="1.5"/>
<line x1="700" y1="382" x2="700" y2="108" stroke="#b6c5cf" stroke-width="1.5"/>
<line x1="603.13" y1="341.87" x2="796.87" y2="148.13" stroke="#2a9562" stroke-width="3" stroke-dasharray="6 5"/>
<text x="803.87" y="141.13" font-size="16" fill="#278153">y = x</text>
<line x1="700" y1="245" x2="801.32" y2="186.50" stroke="#216d9d" stroke-width="4" stroke-linecap="round"/>
<circle cx="801.32" cy="186.50" r="5" fill="#216d9d"/>
<text x="822.11" y="189.50" text-anchor="middle" font-size="16" fill="#216d9d">θ = π/6</text>
<line x1="700" y1="245" x2="758.50" y2="143.68" stroke="#d47531" stroke-width="4" stroke-linecap="round"/>
<circle cx="758.50" cy="143.68" r="5" fill="#d47531"/>
<text x="770.50" y="100.89" text-anchor="middle" font-size="16" fill="#d47531">2θ = π/3</text>
<circle cx="700" cy="245" r="4" fill="#27394c"/>
<text x="708" y="264" font-size="15" fill="#27394c">O</text>
<text x="470" y="407" text-anchor="middle" font-family="Noto Sans CJK KR, sans-serif" font-size="16" fill="#415b6e">각의 합: θ + 5θ = π, θ + 2θ = π/2 (한 대표 경우)</text>
</svg>
