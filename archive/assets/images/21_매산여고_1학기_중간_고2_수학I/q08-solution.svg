<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="760" height="430" role="img" aria-label="sin t가 마이너스 5분의 1인 두 각의 위치와 합">
<rect width="760" height="430" fill="#fff"/>
<text x="34" y="38" font-family="NanumSquare, sans-serif" font-size="23" font-weight="700" fill="#192d46">sin t = -1/5인 두 각</text>
<line x1="76" y1="211" x2="445" y2="211" stroke="#52647a" stroke-width="1.8"/><path d="M445 211 l-9 -5 v10z" fill="#52647a"/>
<line x1="254" y1="45" x2="254" y2="375" stroke="#52647a" stroke-width="1.8"/><path d="M254 45 l-5 9 h10z" fill="#52647a"/>
<circle cx="254" cy="211" r="140" fill="none" stroke="#2a648e" stroke-width="3"/>
<line x1="104" y1="239.0" x2="404" y2="239.0" stroke="#c66a2b" stroke-width="2.5" stroke-dasharray="7 6"/>
<line x1="254" y1="211" x2="116.82857440414205" y2="239.0" stroke="#2d7a99" stroke-width="2.7"/>
<line x1="254" y1="211" x2="391.17142559585795" y2="239.0" stroke="#2d7a99" stroke-width="2.7"/>
<circle cx="116.82857440414205" cy="239.0" r="6" fill="#0b7297" stroke="white" stroke-width="2"/>
<circle cx="391.17142559585795" cy="239.0" r="6" fill="#0b7297" stroke="white" stroke-width="2"/>
<text x="30" y="353" font-family="NanumSquare,sans-serif" font-size="17" fill="#19334b">t₁ = π + φ</text>
<text x="342" y="353" font-family="NanumSquare,sans-serif" font-size="17" fill="#19334b">t₂ = 2π - φ</text>
<text x="130" y="228.0" font-family="NanumSquare,sans-serif" font-size="15" fill="#a65220">y = -1/5</text>
<text x="262" y="202" font-family="NanumSquare,sans-serif" font-size="14" fill="#334e68">O</text>
<text x="470" y="125" font-family="NanumSquare,sans-serif" font-size="19" fill="#19334b">제3·4사분면에서 각각 한 해</text>
<text x="470" y="178" font-family="NanumSquare,sans-serif" font-size="19" fill="#19334b">t₁ + t₂ = (π + φ) + (2π - φ)</text>
<text x="470" y="217" font-family="NanumSquare,sans-serif" font-size="22" font-weight="700" fill="#087293">= 3π</text>
<text x="470" y="273" font-family="NanumSquare,sans-serif" font-size="17" fill="#334e68">t = 2x 이므로</text>
<text x="470" y="310" font-family="NanumSquare,sans-serif" font-size="19" fill="#19334b">α + β = 3π/2</text>
<text x="46" y="405" font-family="NanumSquare,sans-serif" font-size="15" fill="#5a6672">φ는 sin φ = 1/5인 예각입니다.</text>
</svg>