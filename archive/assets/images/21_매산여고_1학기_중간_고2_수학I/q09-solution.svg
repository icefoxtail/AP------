<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 610" width="760" height="610" role="img" aria-label="삼각형의 밑변과 높이를 이용하여 교점 A의 높이 10을 구하는 그림">
<rect width="760" height="610" fill="white"/>
<text x="30" y="37" font-family="NanumSquare,sans-serif" font-size="23" font-weight="700" fill="#192d46">넓이에서 교점 A의 높이 구하기</text>
<line x1="115" y1="468" x2="570" y2="468" stroke="#55657a" stroke-width="1.8"/><path d="M570 468 l-10 -5 v10z" fill="#55657a"/>
<line x1="420" y1="495" x2="420" y2="65" stroke="#55657a" stroke-width="1.8"/><path d="M420 65 l-5 10 h10z" fill="#55657a"/>
<path d="M280 468 L350 118 L455 468 Z" fill="#e9f4fa" stroke="#236d96" stroke-width="3"/>
<line x1="350" y1="118" x2="350" y2="468" stroke="#d4752d" stroke-width="3" stroke-dasharray="7 5"/>
<path d="M350 454 h14 v14" fill="none" stroke="#d4752d" stroke-width="2"/>
<line x1="350" y1="118" x2="420" y2="118" stroke="#94a7b6" stroke-width="1.5" stroke-dasharray="5 5"/>
<circle cx="350" cy="118" r="5.5" fill="#0b7195"/>
<text x="220" y="106" font-family="NanumSquare,sans-serif" font-size="18" fill="#153750">A(-2, 10)</text>
<text x="259" y="496" font-family="NanumSquare,sans-serif" font-size="17" fill="#153750">B</text>
<text x="464" y="496" font-family="NanumSquare,sans-serif" font-size="17" fill="#153750">C</text>
<text x="430" y="495" font-family="NanumSquare,sans-serif" font-size="17" fill="#153750">O</text>
<text x="359" y="461" font-family="NanumSquare,sans-serif" font-size="16" fill="#153750">D</text>
<text x="364" y="293.0" font-family="NanumSquare,sans-serif" font-size="17" fill="#b55a18">높이 10</text>
<line x1="280" y1="507" x2="455" y2="507" stroke="#28739b" stroke-width="1.8"/>
<line x1="280" y1="501" x2="280" y2="513" stroke="#28739b" stroke-width="1.8"/>
<line x1="455" y1="501" x2="455" y2="513" stroke="#28739b" stroke-width="1.8"/>
<text x="335.5" y="529" font-family="NanumSquare,sans-serif" font-size="17" fill="#195675">밑변 5</text>
<rect x="505" y="155" width="229" height="191" rx="12" fill="#f2f6fa"/>
<text x="522" y="192" font-family="NanumSquare,sans-serif" font-size="17" fill="#19334b">높이 h = 2b</text>
<text x="522" y="234" font-family="NanumSquare,sans-serif" font-size="18" fill="#19334b">넓이 = ½ × b × h</text>
<text x="522" y="271" font-family="NanumSquare,sans-serif" font-size="18" fill="#19334b">25 = b²</text>
<text x="522" y="312" font-family="NanumSquare,sans-serif" font-size="18" font-weight="700" fill="#087293">b = 5, h = 10</text>
<text x="30" y="584" font-family="NanumSquare,sans-serif" font-size="14" fill="#5a6672">B, C의 개별 좌표는 주어지지 않았으며, 그림은 길이 관계를 보여 줍니다.</text>
</svg>