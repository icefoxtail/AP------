<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 573" width="742" height="573" role="img" aria-labelledby="title desc"><title id="title">원점보다 아래에서 세로축을 만나는 그래프</title><desc id="desc">파란 직선이 왼쪽 위에서 오른쪽 아래로 내려간다. 세로축과 만나는 점은 원점 아래이고, 가로축과 만나는 점은 원점 왼쪽이다.</desc><rect width="742" height="573" fill="white" /><line x1="89.0000" y1="273.8085" x2="636.0000" y2="273.8085" stroke="#586574" stroke-width="2.05" stroke-linecap="round" /><polygon points="649.0000,273.8085 636.0000,268.6085 636.0000,279.0085" fill="#586574" /><line x1="386.5845" y1="502.0000" x2="386.5845" y2="86.0000" stroke="#586574" stroke-width="2.05" stroke-linecap="round" /><polygon points="386.5845,73.0000 381.3845,86.0000 391.7845,86.0000" fill="#586574" /><line x1="99.4750" y1="92.8994" x2="533.9609" y2="492.3692" stroke="#21639a" stroke-width="7.65" stroke-linecap="round" /><text x="665.000" y="260.809" fill="#586574" font-size="32" font-weight="600" font-family="Malgun Gothic, Cambria Math, sans-serif" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="4.0" stroke-linejoin="round">x</text><text x="405.585" y="68.000" fill="#586574" font-size="32" font-weight="600" font-family="Malgun Gothic, Cambria Math, sans-serif" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="4.0" stroke-linejoin="round">y</text><text x="360.585" y="305.809" fill="#586574" font-size="32" font-weight="600" font-family="Malgun Gothic, Cambria Math, sans-serif" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="4.0" stroke-linejoin="round">O</text></svg>
