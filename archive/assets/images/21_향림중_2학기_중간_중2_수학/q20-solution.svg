<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 480" width="520" height="480" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">I가 내심이므로 ID, IE, IF는 각각 세 변에 수직이고 그 길이가 모두 같다. 또한 AI, BI, CI는 각 꼭짓점의 각을 이등분하므로 각 IAD=각 IAF, 각 ICE=각 ICF가 성립한다. 그러나 삼각형 IDA와 삼각형 IDB는 ID가 공통이고 각 IDA=각 IDB=90°이지만 AD와 BD가 같다는 보장이 없으므로 항상 합동은 아니다. 따라서 답은 ⑤이다.</title><desc id="visual-desc">삼각형 ABC의 내심 I에서 세 변 AB, BC, AC에 내린 수선의 발 D, E, F가 표시되어 있다. ID, IE, IF에 같은 길이 표시와 D, E, F의 직각 표시가 있고, AI, BI, CI가 그려져 있다.</desc><rect width="520" height="480" fill="#fff"/><g data-layer="30"><line id="sAD" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="201.836734694" y1="65.510204082" x2="123.540031397" y2="253.422291994"/></g><g data-layer="30"><line id="sDB" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="123.540031397" y1="253.422291994" x2="56.428571429" y2="414.489795918"/></g><g data-layer="30"><line id="sBE" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="56.428571429" y1="414.489795918" x2="230.918367347" y2="414.489795918"/></g><g data-layer="30"><line id="sEC" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="230.918367347" y1="414.489795918" x2="463.571428571" y2="414.489795918"/></g><g data-layer="30"><line id="sCF" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="463.57142857