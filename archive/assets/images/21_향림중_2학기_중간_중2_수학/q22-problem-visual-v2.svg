circle cx="374.0" cy="364.5" r="4.9" fill="#28364b" /><text x="355.0000" y="345.5000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">O</text></svg>
