<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 747 745" width="747" height="745" role="img" aria-labelledby="title desc"><title id="title">외심과 두 각으로 찾는 원의 호</title><desc id="desc">O는 삼각형의 외심이고 반지름 AO는 9 cm이다. 각 OAB는 48°이고 각 OCA는 32°이다. B에서 C까지 연결되는 부채꼴 호를 나타냈다.</desc><rect width="747" height="745" fill="white" /><line x1="293.3722" y1="88.0612" x2="87.2164" y2="417.9795" stroke="#202020" stroke-width="5.15" stroke-linecap="round" /><line x1="87.2164" y1="417.9795" x2="659.7836" y2="417.9795" stroke="#202020" stroke-width="5.15" stroke-linecap="round" /><line x1="659.7836" y1="417.9795" x2="293.3722" y2="88.0612" stroke="#202020" stroke-width="5.15" stroke-linecap="round" /><line x1="373.5000" y1="367.5000" x2="293.3722" y2="88.0612" stroke="#227365" stroke-width="5.2" stroke-linecap="round" /><line x1="373.5000" y1="367.5000" x2="87.2164" y2="417.9795" stroke="#227365" stroke-width="5.2" stroke-linecap="round" /><line x1="373.5000" y1="367.5000" x2="659.7836" y2="417.9795" stroke="#227365" stroke-width="5.2" stroke-linecap="round" /><path d="M 87.21638619935118 417.9795252477767 A 290.7 290.7 0 0 0 659.7836138006488 417.9795252477767" fill="none" stroke="#774698" stroke-width="4.6" /><path d="M 261.0471 139.7922 A 61 61 0 0 0 310.1861 146.6982" stroke="#a34c1f" stroke-width="2.25" fill="none" /><text x="277.2281" y="210.9323" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#a34c1f" text-anchor="middle">48°</text><path d="M 594.7863 406.5187 A 66 66 0 0 1 610.7361 373.8169" stroke="#a34c1f" stroke-width="2.25" fill="none" /><text x="552.8271" y="373.8134" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#a34c1f" text-anchor="middle">32°</text><text x="465.4361" y="166.7806" font-size="33" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#227365" text-anchor="middle">9 cm</text><line x1="423.4361" y1="165.7806" x2="338.4361" y2="224.7806" stroke=