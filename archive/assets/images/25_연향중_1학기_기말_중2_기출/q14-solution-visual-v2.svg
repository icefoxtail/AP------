<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 675" width="680" height="675" role="img" aria-labelledby="title desc"><title id="title">내리막 직선의 두 축과 만나는 위치</title><desc id="desc">파란 직선은 세로축 (0,6)을 지나 오른쪽 아래로 내려간다. 가로로 2 갈 때 아래로 3 간다. 주황 점선 y=−x+6은 같은 세로축 절편에 닿는다.</desc><rect width="680" height="675" fill="white" /><line x1="66.0000" y1="482.4967" x2="589.0000" y2="482.4967" stroke="#586574" stroke-width="2.05" stroke-linecap="round" /><polygon points="602.0000,482.4967 589.0000,477.2967 589.0000,487.6967" fill="#586574" /><line x1="195.4531" y1="647.0000" x2="195.4531" y2="108.0000" stroke="#586574" stroke-width="2.05" stroke-linecap="round" /><polygon points="195.4531,95.0000 190.2531,108.0000 200.6531,108.0000" fill="#586574" /><line x1="151.5981" y1="104.9360" x2="514.9754" y2="637.0640" stroke="#226298" stroke-width="7.2" stroke-linecap="round" /><line x1="130.1082" y1="105.3632" x2="591.3848" y2="555.6907" stroke="#a64d1e" stroke-width="6.15" stroke-linecap="round" stroke-dasharray="11 7" /><circle cx="195.45309381237524" cy="169.15704824976348" r="7.6" fill="#226298" stroke="white" stroke-width="2" /><circle cx="409.4251497005988" cy="482.49668874172187" r="7.6" fill="#226298" stroke="white" stroke-width="2" /><circle cx="302.439121756487" cy="325.82686849574264" r="7.6" fill="#226298" stroke="white" stroke-width="2" /><line x1="302.4391" y1="325.8269" x2="409.4251" y2="325.8269" stroke="#227164" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="7 5" /><line x1="409.4251" y1="325.8269" x2="409.4251" y2="482.4967" stroke="#227164" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="7 5" /><line x1="52.0000" y1="39.0000" x2="97.0000" y2="39.0000" stroke="#226298" stroke-width="5.65" stroke-linecap="round" /><text x="108.0000" y="46.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#226298" text-anchor="start">y = −(3/2)x + 6</text><line x1="388.0000" y1="39.0000" x2="433.0000" y2="39.0000" stroke="#a64d1e" stroke-width="5.65" stroke-linecap="round" stroke-dasharray="11 7" /><text x="444.0000" y="46.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#a64d1e" text-anchor="start">y = −x + 6</text><text x="618.000" y="469.497" fill="#586574" font-size="29" font-weight="600" font-family="Malgun Gothic, Cambria Math, sans-serif" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="4.0" stroke-linejoin="round">x</text><text x="214.453" y="90.000" fill="#586574" font-size="29" font-weight="600" font-family="Malgun Gothic, Cambria Math, sans-serif" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="4.0" stroke-linejoin="round">y</text><text x="174.453" y="506.497" fill="#586574" font-size="29" font-weight="600" font-family="Malgun Gothic, Cambria Math, sans-serif" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="4.0" stroke-linejoin="round">O</text><text x="130.453" y="182.157" fill="#226298" font-size="31" font-weight="600" font-family="Malgun Gothic, Cambria Math, sans-serif" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="4.0" stroke-linejoin="round">(0, 6)</text><text x="355.932" y="311.827" fill="#227164" font-size="29" font-weight="600" font-family="Malgun Gothic, Cambria Math, sans-serif" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="4.0" stroke-linejoin="round">2</text><text x="382.425" y="414.162" fill="#227164" font-size="29" font-weight="600" font-family="Malgun Gothic, Cambria Math, sans-serif" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="4.0" stroke-linejoin="round">3</text></svg>
