<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 666" width="680" height="666" role="img" aria-labelledby="title desc"><title id="title">두 그래프와 세로축이 감싼 삼각형</title><desc id="desc">파란 직선은 y=x−6, 주황 점선은 y=−1/2 x+3이다. 두 직선이 (6,0)에서 만나고, 세로축의 (0,3), (0,−6)과 이루는 삼각형을 칠했다.</desc><rect width="680" height="666" fill="white" /><polygon points="174.2964,565.0795 174.2964,162.9038 442.5375,296.9623" fill="#dceee7" /><line x1="67.0000" y1="296.9623" x2="603.0000" y2="296.9623" stroke="#586574" stroke-width="2.05" stroke-linecap="round" /><polygon points="616.0000,296.9623 603.0000,291.7623 603.0000,302.1623" fill="#586574" /><line x1="174.2964" y1="612.0000" x2="174.2964" y2="91.0000" stroke="#586574" stroke-width="2.05" stroke-linecap="round" /><polygon points="174.2964,78.0000 169.0964,91.0000 179.4964,91.0000" fill="#586574" /><line x1="133.7066" y1="605.6505" x2="609.6476" y2="129.9294" stroke="#226298" stroke-width="6.8" stroke-linecap="round" /><line x1="74.1370" y1="112.8472" x2="608.8630" y2="380.0867" stroke="#a64d1e" stroke-width="6.8" stroke-linecap="round" stroke-dasharray="12 7" /><line x1="174.2964" y1="565.0795" x2="174.2964" y2="162.9038" stroke="#227164" stroke-width="7" stroke-linecap="round" /><circle cx="174.29641693811072" cy="565.0794979079498" r="7.2" fill="#226298" stroke="white" stroke-width="2" /><circle cx="174.29641693811072" cy="162.90376569037647" r="7.2" fill="#a64d1e" stroke="white" stroke-width="2" /><circle cx="442.5374592833876" cy="296.9623430962343" r="7.2" fill="#227164" stroke="white" stroke-width="2" /><line x1="60.0000" y1="39.0000" x2="105.0000" y2="39.0000" stroke="#226298" stroke-width="5.65" stroke-linecap="round" /><text x="116.0000" y="46.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#226298" text-anchor="start">y = x − 6</text><line x1="332.0000" y1="39.0000" x2="377.0000" y2="39.0000" stroke="#a64d1e" stroke-width="5.65" stroke-linecap="round" stroke-dasharray="12 7" /><text x="388.0000" y="46.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#a64d1e" text-anchor="start">y = −(1/2)x + 3</text><text x="632.000" y="283.962" fill="#586574" font-size="29" font-weight="600" font-family="Malgun Gothic, Cambria Math, sans-serif" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="4.0" stroke-linejoin="round">x</text><text x="193.296" y="73.000" fill="#586574" font-size="29" font-weight="600" font-family="Malgun Gothic, Cambria Math, sans-serif" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="4.0" stroke-linejoin="round">y</text><text x="150.296" y="318.962" fill="#586574" font-size="29" font-weight="600" font-family="Malgun Gothic, Cambria Math, sans-serif" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="4.0" stroke-linejoin="round">O</text><text x="98.296" y="566.079" fill="#226298" font-size="29" font-weight="600" font-family="Malgun Gothic, Cambria Math, sans-serif" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="4.0" stroke-linejoin="round">(0, −6)</text><text x="105.296" y="180.904" fill="#a64d1e" font-size="29" font-weight="600" font-family="Malgun Gothic, Cambria Math, sans-serif" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="4.0" stroke-linejoin="round">(0, 3)</text><text x="509.537" y="358.962" fill="#227164" font-size="29" font-weight="600" font-family="Malgun Gothic, Cambria Math, sans-serif" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="4.0" stroke-linejoin="round">(6, 0)</text></svg>
