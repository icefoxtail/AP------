<svg xmlns="http://www.w3.org/2000/svg" width="780" height="500" viewBox="0 0 780 500"><rect width="780" height="500" fill="#fff"/><style>text{font-family:NanumGothic,'Noto Sans CJK KR',sans-serif;fill:#172a3a}.title{font-size:25px;font-weight:bold}.small{font-size:17px}.sub{font-size:18px;font-weight:bold}</style><text x="30" y="44" class="title">계단형 넓이 = 바깥 직사각형에서 오목 부분 빼기</text><polygon points="90,90 301.95,90 301.95,194.65 197.3,194.65 197.3,255.47 419.3,255.47 419.3,90 504.77,90 504.77,376.6 90,376.6" stroke="#203c62" stroke-width="3" fill="#edf3f9"/><rect x="197.30" y="90" width="222" height="165.47" fill="#f6bb91" fill-opacity=".3" stroke="#d05b35" stroke-dasharray="7 5" stroke-width="2"/><rect x="197.30" y="90" width="104.65" height="104.65" fill="#d7ead4" stroke="#58a06d" stroke-width="2"/><path d="M90 90L504.77 90L504.77 376.6L90 376.6Z" fill="none" stroke="#8091a8" stroke-dasharray="7 5" stroke-width="2"/><text x="175" y="420" class="small">아랫변: √3 + √15</text><text x="519" y="255" class="small">√15</text><rect x="512" y="90" width="251" height="320" rx="12" fill="#f8fafb" stroke="#d1dae3"/><text x="530" y="134" class="sub">바깥 넓이</text><text x="530" y="168" class="small">15+3√5</text><text x="530" y="219" class="sub">오목 부분</text><text x="530" y="255" class="small">3√5-(√2)²</text><text x="530" y="290" class="small">=3√5-2</text><text x="530" y="345" class="sub">남은 넓이=17</text><text x="530" y="385" class="sub">한 변=√17</text><text x="28" y="476" class="small">원본 도형과 치수는 문제 PNG 참조</text></svg>