<svg xmlns="http://www.w3.org/2000/svg" width="760" height="620" viewBox="0 0 760 620" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet">
  <title id="title">25_매산고_2학기_기말_고2_수학II · q1 해설 시각화</title>
  <desc id="desc">문항 1의 원문과 해설 흐름을 source-bound 텍스트 카드로 정리한 SVG</desc>
  <rect width="760" height="620" fill="#fff"/>
  <g font-family="Noto Sans KR, Pretendard, Apple SD Gothic Neo, Malgun Gothic, sans-serif" fill="#111">
    <text x="380" y="32" font-size="21" font-weight="700" text-anchor="middle">25_매산고_2학기_기말_고2_수학II · q1 해설 시각화</text>
    <text x="380" y="59" font-size="15" text-anchor="middle" fill="#475569">문항 원문과 해설의 핵심 흐름</text>
    <rect x="18" y="82" width="350" height="300" rx="12" fill="#eff6ff" stroke="#93c5fd"/>
    <rect x="390" y="82" width="352" height="300" rx="12" fill="#f0fdf4" stroke="#86efac"/>
    <text x="34" y="112" font-size="17" font-weight="700" fill="#1d4ed8">문항 핵심</text>
    <text x="398" y="112" font-size="17" font-weight="700" fill="#15803d">해설 흐름</text>
    <text x="34" y="140" font-size="15">함수 f(x)=x^3-3ax+5가 x=1에서 극솟값을</text>
    <text x="34" y="162" font-size="15">가질 때, a의 값을 구한 것은? [3점]</text>
    <text x="398" y="140" font-size="14">[키포인트] 극솟값을 갖는 점에서는 도함수의</text>
    <text x="398" y="162" font-size="14">값이 0이고, 그 점에서 극소인지도 확인해야</text>
    <text x="398" y="184" font-size="14">한다. f'(x)=3x^2-3a이므로 f'(1)=0에서</text>
    <text x="398" y="206" font-size="14">3-3a=0, 따라서 a=1이다. 또 f''(x)=6x이므로</text>
    <text x="398" y="228" font-size="14">f''(1)=6&gt; 0이다. 따라서 x=1에서 실제로</text>
    <text x="398" y="250" font-size="14">극솟값을 갖는다. 따라서 정답은 ①이다.</text>
    <rect x="18" y="406" width="724" height="48" rx="10" fill="#fff7ed" stroke="#fdba74"/>
    <text x="380" y="436" font-size="17" text-anchor="middle" fill="#9a3412">결론: ①</text>
    <text x="380" y="482" font-size="11" text-anchor="middle" fill="#64748b">25_매산고_2학기_기말_고2_수학II · q1 · source-bound solution visual</text>
  </g>
</svg>