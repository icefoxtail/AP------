<svg xmlns="http://www.w3.org/2000/svg" width="760" height="620" viewBox="0 0 760 620" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet">
  <title id="title">25_매산고_2학기_기말_고2_수학II · q21 해설 시각화</title>
  <desc id="desc">문항 21의 원문과 해설 흐름을 source-bound 텍스트 카드로 정리한 SVG</desc>
  <rect width="760" height="620" fill="#fff"/>
  <g font-family="Noto Sans KR, Pretendard, Apple SD Gothic Neo, Malgun Gothic, sans-serif" fill="#111">
    <text x="380" y="32" font-size="21" font-weight="700" text-anchor="middle">25_매산고_2학기_기말_고2_수학II · q21 해설 시각화</text>
    <text x="380" y="59" font-size="15" text-anchor="middle" fill="#475569">문항 원문과 해설의 핵심 흐름</text>
    <rect x="18" y="82" width="350" height="300" rx="12" fill="#eff6ff" stroke="#93c5fd"/>
    <rect x="390" y="82" width="352" height="300" rx="12" fill="#f0fdf4" stroke="#86efac"/>
    <text x="34" y="112" font-size="17" font-weight="700" fill="#1d4ed8">문항 핵심</text>
    <text x="398" y="112" font-size="17" font-weight="700" fill="#15803d">해설 흐름</text>
    <text x="34" y="140" font-size="15">[서답형 5번] 삼차함수 f(x)와 두 다항함수 g(x)=x^3+3x+3,</text>
    <text x="34" y="162" font-size="15">h(x)=x^2+1에 대하여 두 삼차함수 f(x)-g(x)와 f(x)-h(x)가 모두</text>
    <text x="34" y="184" font-size="15">극값을 갖지 않는다. f'(-1)=6일 때, f'(2)의 최솟값을 구하고, 그 과정을</text>
    <text x="34" y="206" font-size="15">서술하시오. [7점]</text>
    <text x="398" y="140" font-size="14">[키포인트] 삼차함수가 극값을 갖지 않으려면 그 도함수인 이차함수의</text>
    <text x="398" y="162" font-size="14">판별식이 0 이하이어야 한다. 두 조건을 연립하면 계수의 범위가 정해진다.</text>
    <text x="398" y="184" font-size="14">f(x)=ax^3+bx^2+cx+d라 두자. f'(-1)=6에서 3a-2b+c=6, 즉</text>
    <text x="398" y="206" font-size="14">c=6-3a+2b이다. f(x)-g(x)가 삼차함수이고 극값을 갖지 않으므로</text>
    <text x="398" y="228" font-size="14">(f-g)'(x)=3(a-1)x^2+2bx+(c-3)의 판별식이 0 이하이다. 판별식을 4로</text>
    <text x="398" y="250" font-size="14">나눈 값은 b^2-3(a-1)(c-3)=(3a-b-3)^2이므로 b=3a-3이다. 따라서</text>
    <text x="398" y="272" font-size="14">c=3a이다. 또 f(x)-h(x)가 극값을 갖지 않으므로</text>
    <text x="398" y="294" font-size="14">(f-h)'(x)=3ax^2+2(b-1)x+c의 판별식이 0 이하이다. b=3a-3, c=3a를</text>
    <text x="398" y="316" font-size="14">대입하면 (b-1)^2-3ac=-8(3a-2)≤0이므로 a≥2 / 3이다.</text>
    <text x="398" y="338" font-size="14">f'(2)=12a+4b+c=27a-12이므로 최솟값은 a=2 / 3일 때 6이다. 따라서</text>
    <text x="398" y="360" font-size="14">구하는 최솟값은 6이다.</text>
    <path d="M350 314 L410 314" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="18" y="350" width="724" height="48" rx="10" fill="#fff7ed" stroke="#fdba74"/>
    <text x="380" y="380" font-size="17" text-anchor="middle" fill="#9a3412">결론: 6</text>
    <text x="380" y="452" font-size="11" text-anchor="middle" fill="#64748b">25_매산고_2학기_기말_고2_수학II · q21 · source-bound solution visual</text>
  </g>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#64748b"/></marker></defs>
</svg>