<svg xmlns="http://www.w3.org/2000/svg" width="760" height="620" viewBox="0 0 760 620" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet">
  <title id="title">25_매산고_2학기_기말_고2_수학II · q5 해설 시각화</title>
  <desc id="desc">문항 5의 원문과 해설 흐름을 source-bound 텍스트 카드로 정리한 SVG</desc>
  <rect width="760" height="620" fill="#fff"/>
  <g font-family="Noto Sans KR, Pretendard, Apple SD Gothic Neo, Malgun Gothic, sans-serif" fill="#111">
    <text x="380" y="32" font-size="21" font-weight="700" text-anchor="middle">25_매산고_2학기_기말_고2_수학II · q5 해설 시각화</text>
    <text x="380" y="59" font-size="15" text-anchor="middle" fill="#475569">도함수의 활용 · 방정식의 실근</text>
    <rect x="18" y="82" width="350" height="350" rx="12" fill="#eff6ff" stroke="#93c5fd"/>
    <rect x="390" y="82" width="352" height="350" rx="12" fill="#f0fdf4" stroke="#86efac"/>
    <text x="34" y="112" font-size="17" font-weight="700" fill="#1d4ed8">문항 핵심</text>
    <text x="398" y="112" font-size="17" font-weight="700" fill="#15803d">해설 흐름</text>
    <text x="34" y="140" font-size="15">방정식 2x^3-2x^2+4=4x^2-a가 서로 다른 세 실근을 갖도록 하는 실수 a의 값</text>
    <text x="34" y="162" font-size="15">의 범위가 m&lt; a&lt; n일 때, n-m의 값을 구한 것은? [3.3점]</text>
    <text x="398" y="140" font-size="14">[키포인트] 삼차방정식이 서로 다른 세 실근을 가지려면 삼차함수의 극댓값은 양수, 극솟값은</text>
    <text x="398" y="162" font-size="14"> 음수여야 한다. 방정식을 2x^3-6x^2+a+4=0으로 정리하고 h(x)=2x^3-6x</text>
    <text x="398" y="184" font-size="14">^2+a+4라 두자. h'(x)=6x(x-2)이므로 x=0에서 극대, x=2에서 극소이다.</text>
    <text x="398" y="206" font-size="14"> h(0)=a+4, h(2)=a-4이므로 서로 다른 세 실근을 가지려면 a+4&gt; 0, a-</text>
    <text x="398" y="228" font-size="14">4&lt; 0이어야 한다. 따라서 -4&lt; a&lt; 4이다. m=-4, n=4이므로 n-m=8이다. </text>
    <text x="398" y="250" font-size="14">따라서 정답은 ⑤이다.</text>
    <path d="M350 330 L410 330" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="18" y="352" width="724" height="48" rx="10" fill="#fff7ed" stroke="#fdba74"/>
    <text x="380" y="382" font-size="17" text-anchor="middle" fill="#9a3412">결론: ⑤</text>
    <text x="380" y="427" font-size="13" text-anchor="middle" fill="#64748b">source: archive/exams/original/high/h2/2final/25_매산고_2학기_기말_고2_수학II.js · q5 · archive/assets/images/25_매산고_2학기_기말_고2_수학II/q5-solution.svg</text>
  </g>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#64748b"/></marker></defs>
</svg>