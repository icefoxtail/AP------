<svg xmlns="http://www.w3.org/2000/svg" width="760" height="620" viewBox="0 0 760 620" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet">
  <title id="title">25_매산고_2학기_기말_고2_수학II · q7 해설 시각화</title>
  <desc id="desc">문항 7의 원문과 해설 흐름을 source-bound 텍스트 카드로 정리한 SVG</desc>
  <rect width="760" height="620" fill="#fff"/>
  <g font-family="Noto Sans KR, Pretendard, Apple SD Gothic Neo, Malgun Gothic, sans-serif" fill="#111">
    <text x="380" y="32" font-size="21" font-weight="700" text-anchor="middle">25_매산고_2학기_기말_고2_수학II · q7 해설 시각화</text>
    <text x="380" y="59" font-size="15" text-anchor="middle" fill="#475569">문항 원문과 해설의 핵심 흐름</text>
    <rect x="18" y="82" width="350" height="300" rx="12" fill="#eff6ff" stroke="#93c5fd"/>
    <rect x="390" y="82" width="352" height="300" rx="12" fill="#f0fdf4" stroke="#86efac"/>
    <text x="34" y="112" font-size="17" font-weight="700" fill="#1d4ed8">문항 핵심</text>
    <text x="398" y="112" font-size="17" font-weight="700" fill="#15803d">해설 흐름</text>
    <text x="34" y="140" font-size="15">최고차항의 계수가 1인 삼차함수 f(x)가 모든 실수 x에 대하여</text>
    <text x="34" y="162" font-size="15">f(-x)+f(x)=0을 만족한다. 방정식 |f(x)|=16의 서로 다른 실근의 개수가</text>
    <text x="34" y="184" font-size="15">4일 때, f(1)의 값을 구한 것은? [4점]</text>
    <text x="398" y="140" font-size="14">[키포인트] 홀함수인 최고차항 계수 1의 삼차함수는 f(x)=x^3+px 꼴이고,</text>
    <text x="398" y="162" font-size="14">|f(x)|=16의 실근 개수는 수평선과의 접점 조건으로 판단한다.</text>
    <text x="398" y="184" font-size="14">f(-x)+f(x)=0이므로 f(x)=x^3+px이다. |f(x)|=16이 서로 다른 네 실근을</text>
    <text x="398" y="206" font-size="14">가지려면 홀함수의 대칭성에 의해 f(x)=16이 서로 다른 두 실근을 가져야</text>
    <text x="398" y="228" font-size="14">하므로, y=16은 삼차함수의 극댓값에서 접한다. 극댓값이 생기는 점을 x=-r</text>
    <text x="398" y="250" font-size="14">(r&gt; 0)라 하면 f'(-r)=3r^2+p=0에서 p=-3r^2이다. 또한</text>
    <text x="398" y="272" font-size="14">f(-r)=-r^3-pr=2r^3=16이므로 r=2, p=-12이고 f(1)=-11이다. 따라서</text>
    <text x="398" y="294" font-size="14">정답은 ②이다.</text>
    <path d="M350 314 L410 314" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="18" y="350" width="724" height="48" rx="10" fill="#fff7ed" stroke="#fdba74"/>
    <text x="380" y="380" font-size="17" text-anchor="middle" fill="#9a3412">결론: ②</text>
    <text x="380" y="452" font-size="11" text-anchor="middle" fill="#64748b">25_매산고_2학기_기말_고2_수학II · q7 · source-bound solution visual</text>
  </g>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#64748b"/></marker></defs>
</svg>