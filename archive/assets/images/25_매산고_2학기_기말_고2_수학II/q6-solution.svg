<svg xmlns="http://www.w3.org/2000/svg" width="640" height="430" viewBox="0 0 640 430" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet">
  <title id="title">포물선과 직선 사이의 넓이</title>
  <desc id="desc">y=-2x²+6x와 m=2일 때 y=-4x의 교점 0,5 및 두 그래프 사이의 넓이를 표시한 해설 그래프</desc>
  <rect width="640" height="430" fill="#fff"/>
  <g font-family="Noto Sans KR, Pretendard, Apple SD Gothic Neo, Malgun Gothic, sans-serif" fill="#111">
    <text x="320" y="27" font-size="20" text-anchor="middle" font-weight="700">두 그래프 사이의 넓이</text>
    <g transform="translate(40 48)">
      <line x1="20" y1="150" x2="510" y2="150" stroke="#111" stroke-width="2"/>
      <line x1="65" y1="20" x2="65" y2="360" stroke="#111" stroke-width="2"/>
      <path d="M65 150 L163 118 L261 118 L359 150 L457 214 L555 310 L555 310 L65 150 Z" fill="#bfdbfe" opacity="0.85"/>
      <polyline points="65,150 163,118 261,118 359,150 457,214 555,310" fill="none" stroke="#1d4ed8" stroke-width="3"/>
      <line x1="65" y1="150" x2="555" y2="310" stroke="#dc2626" stroke-width="3"/>
      <circle cx="65" cy="150" r="5" fill="#111"/><circle cx="555" cy="310" r="5" fill="#111"/>
      <line x1="555" y1="145" x2="555" y2="155" stroke="#111"/>
      <text x="65" y="176" font-size="16" text-anchor="middle">0</text>
      <text x="555" y="176" font-size="16" text-anchor="middle">5=m+3</text>
      <text x="520" y="130" font-size="15" fill="#1d4ed8">y=-2x²+6x</text>
      <text x="350" y="300" font-size="15" fill="#dc2626">y=-4x (m=2)</text>
      <text x="300" y="205" font-size="17" text-anchor="middle" fill="#1e40af">넓이 = 125/3</text>
      <text x="510" y="382" font-size="16">x</text><text x="45" y="30" font-size="16">y</text>
    </g>
    <text x="320" y="414" font-size="17" text-anchor="middle">∫₀⁵ 2x(5−x) dx = 5³/3 = 125/3  →  m=2</text>
  </g>
</svg>
