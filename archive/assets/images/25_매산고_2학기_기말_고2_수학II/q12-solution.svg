<svg xmlns="http://www.w3.org/2000/svg" width="760" height="620" viewBox="0 0 760 620" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet">
  <title id="title">25_매산고_2학기_기말_고2_수학II · q12 해설 시각화</title>
  <desc id="desc">문항 12의 원문과 해설 흐름을 source-bound 텍스트 카드로 정리한 SVG</desc>
  <rect width="760" height="620" fill="#fff"/>
  <g font-family="Noto Sans KR, Pretendard, Apple SD Gothic Neo, Malgun Gothic, sans-serif" fill="#111">
    <text x="380" y="32" font-size="21" font-weight="700" text-anchor="middle">25_매산고_2학기_기말_고2_수학II · q12 해설 시각화</text>
    <text x="380" y="59" font-size="15" text-anchor="middle" fill="#475569">정적분 · 적분과 최댓값·최솟값</text>
    <rect x="18" y="82" width="350" height="350" rx="12" fill="#eff6ff" stroke="#93c5fd"/>
    <rect x="390" y="82" width="352" height="350" rx="12" fill="#f0fdf4" stroke="#86efac"/>
    <text x="34" y="112" font-size="17" font-weight="700" fill="#1d4ed8">문항 핵심</text>
    <text x="398" y="112" font-size="17" font-weight="700" fill="#15803d">해설 흐름</text>
    <text x="34" y="140" font-size="15">함수 f(x)가 f(x)=∫_1^6|t-2x|dt이다. 함수 f(x)의 최댓값을 M, 최솟</text>
    <text x="34" y="162" font-size="15">값을 m이라 할 때, Mm의 값을 구한 것은? (단, 12\le x\le3) [4.3점]</text>
    <text x="398" y="140" font-size="14">[키포인트] 절댓값의 기준점 2x가 적분구간 [1,6] 안에 있으므로 그 점에서 적분을 나</text>
    <text x="398" y="162" font-size="14">눈다. u=2x라 두면 1\le u\le6이고 f(x)=∫_1^u(u-t)dt+∫_u^6(</text>
    <text x="398" y="184" font-size="14">t-u)dt=(u-1)^2+(6-u)^22이다. 이를 정리하면 f(x)=(u-72)^2+2</text>
    <text x="398" y="206" font-size="14">54이므로 최솟값은 m=254이다. 최댓값은 구간의 양 끝 u=1,6에서 M=252이므로 </text>
    <text x="398" y="228" font-size="14">Mm=2이다. 따라서 정답은 ③이다.</text>
    <path d="M350 308 L410 308" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="18" y="330" width="724" height="48" rx="10" fill="#fff7ed" stroke="#fdba74"/>
    <text x="380" y="360" font-size="17" text-anchor="middle" fill="#9a3412">결론: ③</text>
    <text x="380" y="405" font-size="13" text-anchor="middle" fill="#64748b">source: archive/exams/original/high/h2/2final/25_매산고_2학기_기말_고2_수학II.js · q12 · archive/assets/images/25_매산고_2학기_기말_고2_수학II/q12-solution.svg</text>
  </g>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#64748b"/></marker></defs>
</svg>