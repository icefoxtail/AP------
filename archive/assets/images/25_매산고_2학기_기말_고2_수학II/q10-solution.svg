<svg xmlns="http://www.w3.org/2000/svg" width="760" height="620" viewBox="0 0 760 620" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet">
  <title id="title">25_매산고_2학기_기말_고2_수학II · q10 해설 시각화</title>
  <desc id="desc">문항 10의 원문과 해설 흐름을 source-bound 텍스트 카드로 정리한 SVG</desc>
  <rect width="760" height="620" fill="#fff"/>
  <g font-family="Noto Sans KR, Pretendard, Apple SD Gothic Neo, Malgun Gothic, sans-serif" fill="#111">
    <text x="380" y="32" font-size="21" font-weight="700" text-anchor="middle">25_매산고_2학기_기말_고2_수학II · q10 해설 시각화</text>
    <text x="380" y="59" font-size="15" text-anchor="middle" fill="#475569">도함수의 활용 · 부등식과 미분</text>
    <rect x="18" y="82" width="350" height="350" rx="12" fill="#eff6ff" stroke="#93c5fd"/>
    <rect x="390" y="82" width="352" height="350" rx="12" fill="#f0fdf4" stroke="#86efac"/>
    <text x="34" y="112" font-size="17" font-weight="700" fill="#1d4ed8">문항 핵심</text>
    <text x="398" y="112" font-size="17" font-weight="700" fill="#15803d">해설 흐름</text>
    <text x="34" y="140" font-size="15">2 이상의 자연수 n에 대하여 모든 실수 x에서 부등식 x^n-nx+(n-1)^2&gt; 0이 </text>
    <text x="34" y="162" font-size="15">항상 성립하도록 하는 자연수 n의 최솟값을 구한 것은? [4.1점]</text>
    <text x="398" y="140" font-size="14">[키포인트] 가장 작은 자연수부터 부등식이 모든 실수에서 항상 양수인지 확인한다. n=2이</text>
    <text x="398" y="162" font-size="14">면 x^2-2x+1=(x-1)^2이므로 x=1에서 0이 되어 조건을 만족하지 않는다. n=</text>
    <text x="398" y="184" font-size="14">3이면 x^3-3x+4이고 x가 충분히 작은 음수가 되면 식의 값도 음수가 되므로 모든 실</text>
    <text x="398" y="206" font-size="14">수에서 양수일 수 없다. n=4이면 h(x)=x^4-4x+9라 할 때 h'(x)=4(x^3</text>
    <text x="398" y="228" font-size="14">-1)이므로 x=1에서 최솟값을 갖고, h(1)=6&gt; 0이다. 따라서 모든 실수 x에서 부</text>
    <text x="398" y="250" font-size="14">등식이 성립하므로 조건을 만족하는 n의 최솟값은 4이다. 따라서 정답은 ③이다.</text>
    <path d="M350 330 L410 330" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="18" y="352" width="724" height="48" rx="10" fill="#fff7ed" stroke="#fdba74"/>
    <text x="380" y="382" font-size="17" text-anchor="middle" fill="#9a3412">결론: ③</text>
    <text x="380" y="427" font-size="13" text-anchor="middle" fill="#64748b">source: archive/exams/original/high/h2/2final/25_매산고_2학기_기말_고2_수학II.js · q10 · archive/assets/images/25_매산고_2학기_기말_고2_수학II/q10-solution.svg</text>
  </g>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#64748b"/></marker></defs>
</svg>