<svg xmlns="http://www.w3.org/2000/svg" width="760" height="620" viewBox="0 0 760 620" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet">
  <title id="title">25_매산고_2학기_기말_고2_수학II · q10 해설 시각화</title>
  <desc id="desc">문항 10의 원문과 해설 흐름을 source-bound 텍스트 카드로 정리한 SVG</desc>
  <rect width="760" height="620" fill="#fff"/>
  <g font-family="Noto Sans KR, Pretendard, Apple SD Gothic Neo, Malgun Gothic, sans-serif" fill="#111">
    <text x="380" y="32" font-size="21" font-weight="700" text-anchor="middle">25_매산고_2학기_기말_고2_수학II · q10 해설 시각화</text>
    <text x="380" y="59" font-size="15" text-anchor="middle" fill="#475569">문항 원문과 해설의 핵심 흐름</text>
    <rect x="18" y="82" width="350" height="306" rx="12" fill="#eff6ff" stroke="#93c5fd"/>
    <rect x="390" y="82" width="352" height="306" rx="12" fill="#f0fdf4" stroke="#86efac"/>
    <text x="34" y="112" font-size="17" font-weight="700" fill="#1d4ed8">문항 핵심</text>
    <text x="398" y="112" font-size="17" font-weight="700" fill="#15803d">해설 흐름</text>
    <text x="34" y="140" font-size="15">2 이상의 자연수 n에 대하여 모든 실수 x에서</text>
    <text x="34" y="162" font-size="15">부등식 x^n-nx+(n-1)^2&gt; 0이 항상</text>
    <text x="34" y="184" font-size="15">성립하도록 하는 자연수 n의 최솟값을 구한</text>
    <text x="34" y="206" font-size="15">것은? [4.1점]</text>
    <text x="398" y="140" font-size="14">[키포인트] 가장 작은 자연수부터 부등식이 모든</text>
    <text x="398" y="162" font-size="14">실수에서 항상 양수인지 확인한다. n=2이면</text>
    <text x="398" y="184" font-size="14">x^2-2x+1=(x-1)^2이므로 x=1에서 0이 되어</text>
    <text x="398" y="206" font-size="14">조건을 만족하지 않는다. n=3이면</text>
    <text x="398" y="228" font-size="14">x^3-3x+4이고 x가 충분히 작은 음수가 되면</text>
    <text x="398" y="250" font-size="14">식의 값도 음수가 되므로 모든 실수에서 양수일</text>
    <text x="398" y="272" font-size="14">수 없다. n=4이면 h(x)=x^4-4x+9라 할 때</text>
    <text x="398" y="294" font-size="14">h'(x)=4(x^3-1)이므로 x=1에서 최솟값을</text>
    <text x="398" y="316" font-size="14">갖고, h(1)=6&gt; 0이다. 따라서 모든 실수 x에서</text>
    <text x="398" y="338" font-size="14">부등식이 성립하므로 조건을 만족하는 n의</text>
    <text x="398" y="360" font-size="14">최솟값은 4이다. 따라서 정답은 ③이다.</text>
    <rect x="18" y="412" width="724" height="48" rx="10" fill="#fff7ed" stroke="#fdba74"/>
    <text x="380" y="442" font-size="17" text-anchor="middle" fill="#9a3412">결론: ③</text>
    <text x="380" y="488" font-size="11" text-anchor="middle" fill="#64748b">25_매산고_2학기_기말_고2_수학II · q10 · source-bound solution visual</text>
  </g>
</svg>