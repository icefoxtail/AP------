<svg xmlns="http://www.w3.org/2000/svg" width="760" height="620" viewBox="0 0 760 620" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet">
  <title id="title">25_매산고_2학기_기말_고2_수학II · q15 해설 시각화</title>
  <desc id="desc">문항 15의 원문과 해설 흐름을 source-bound 텍스트 카드로 정리한 SVG</desc>
  <rect width="760" height="620" fill="#fff"/>
  <g font-family="Noto Sans KR, Pretendard, Apple SD Gothic Neo, Malgun Gothic, sans-serif" fill="#111">
    <text x="380" y="32" font-size="21" font-weight="700" text-anchor="middle">25_매산고_2학기_기말_고2_수학II · q15 해설 시각화</text>
    <text x="380" y="59" font-size="15" text-anchor="middle" fill="#475569">문항 원문과 해설의 핵심 흐름</text>
    <rect x="18" y="82" width="350" height="350" rx="12" fill="#eff6ff" stroke="#93c5fd"/>
    <rect x="390" y="82" width="352" height="350" rx="12" fill="#f0fdf4" stroke="#86efac"/>
    <text x="34" y="112" font-size="17" font-weight="700" fill="#1d4ed8">문항 핵심</text>
    <text x="398" y="112" font-size="17" font-weight="700" fill="#15803d">해설 흐름</text>
    <text x="34" y="140" font-size="15">원점을 출발하여 수직선 위를 움직이는 점 P의</text>
    <text x="34" y="162" font-size="15">시각 t에서의 속도를 v[1](t), 수직선 위의</text>
    <text x="34" y="184" font-size="15">위치가 8인 점을 출발하여 수직선 위를</text>
    <text x="34" y="206" font-size="15">움직이는 점 Q의 시각 t에서의 속도를</text>
    <text x="34" y="228" font-size="15">v[2](t)라 할 때, v[1](t)와 v[2](t)는</text>
    <text x="34" y="250" font-size="15">다음과 같다. v[1](t)=20t-9t^2,</text>
    <text x="34" y="272" font-size="15">v[2](t)=k 수직선 위에서 두 점 P, Q가</text>
    <text x="34" y="294" font-size="15">만나기 위한 k의 최댓값을 p라고 할 때, p^2의</text>
    <text x="34" y="316" font-size="15">값을 구한 것은? [5.3점]</text>
    <text x="398" y="140" font-size="14">[키포인트] 두 점의 위치를 속도에서 적분해</text>
    <text x="398" y="162" font-size="14">구하고, 만나는 시각 t에 대해 k를 함수로</text>
    <text x="398" y="184" font-size="14">나타내어 최댓값을 구한다. 점 P의 위치는</text>
    <text x="398" y="206" font-size="14">x[P](t)=∫[0,</text>
    <text x="398" y="228" font-size="14">t](20s-9s^2)ds=10t^2-3t^3이고, 점 Q의</text>
    <text x="398" y="250" font-size="14">위치는 x[Q](t)=8+kt이다. 두 점이 만나는</text>
    <text x="398" y="272" font-size="14">시각은 t&gt; 0이므로 10t^2-3t^3=8+kt에서</text>
    <text x="398" y="294" font-size="14">k=10t-3t^2-8 / t이다. K(t)=10t-3t^2-8 /</text>
    <text x="398" y="316" font-size="14">t라 하면 K'(t)=10-6t+8 /</text>
    <text x="398" y="338" font-size="14">t^2=-2(t-2)(3t^2+t+2) / t^2이다.</text>
    <text x="398" y="360" font-size="14">3t^2+t+2&gt; 0이므로 K(t)는 t=2에서 최댓값을</text>
    <text x="398" y="382" font-size="14">갖는다. p=K(2)=4이므로 p^2=16이다. 따라서</text>
    <text x="398" y="404" font-size="14">정답은 ⑤이다.</text>
    <rect x="18" y="456" width="724" height="48" rx="10" fill="#fff7ed" stroke="#fdba74"/>
    <text x="380" y="486" font-size="17" text-anchor="middle" fill="#9a3412">결론: ⑤</text>
    <text x="380" y="532" font-size="11" text-anchor="middle" fill="#64748b">25_매산고_2학기_기말_고2_수학II · q15 · source-bound solution visual</text>
  </g>
</svg>