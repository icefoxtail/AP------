<svg xmlns="http://www.w3.org/2000/svg" width="760" height="620" viewBox="0 0 760 620" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet">
  <title id="title">25_매산고_2학기_기말_고2_수학II · q14 해설 시각화</title>
  <desc id="desc">문항 14의 원문과 해설 흐름을 source-bound 텍스트 카드로 정리한 SVG</desc>
  <rect width="760" height="620" fill="#fff"/>
  <g font-family="Noto Sans KR, Pretendard, Apple SD Gothic Neo, Malgun Gothic, sans-serif" fill="#111">
    <text x="380" y="32" font-size="21" font-weight="700" text-anchor="middle">25_매산고_2학기_기말_고2_수학II · q14 해설 시각화</text>
    <text x="380" y="59" font-size="15" text-anchor="middle" fill="#475569">문항 원문과 해설의 핵심 흐름</text>
    <rect x="18" y="82" width="350" height="300" rx="12" fill="#eff6ff" stroke="#93c5fd"/>
    <rect x="390" y="82" width="352" height="300" rx="12" fill="#f0fdf4" stroke="#86efac"/>
    <text x="34" y="112" font-size="17" font-weight="700" fill="#1d4ed8">문항 핵심</text>
    <text x="398" y="112" font-size="17" font-weight="700" fill="#15803d">해설 흐름</text>
    <text x="34" y="140" font-size="15">두 함수 f(x)=x^4-14x^2+24x+3, g(x)=x^2+4 / x^2-3에 대하여 x에</text>
    <text x="34" y="162" font-size="15">대한 방정식 (f° g)(x)=k의 실근이 존재하도록 하는 실수 k의 최솟값을</text>
    <text x="34" y="184" font-size="15">구한 것은? [5.2점]</text>
    <text x="398" y="140" font-size="14">[키포인트] 먼저 g(x)의 치역을 구한 뒤 그 범위에서 f의 최솟값을 구한다.</text>
    <text x="398" y="162" font-size="14">x≠0에서 x^2+4 / x^2≥4이므로 g(x)=x^2+4 / x^2-3≥1이다. 또한 등호가</text>
    <text x="398" y="184" font-size="14">가능한 값이 있으므로 g(x)의 치역은 [1,∞)이다. 따라서 (f° g)(x)가 가질</text>
    <text x="398" y="206" font-size="14">수 있는 최솟값은 u≥1에서 f(u)의 최솟값과 같다.</text>
    <text x="398" y="228" font-size="14">f'(u)=4(u-1)(u-2)(u+3)이므로 u=1에서 u=2까지 감소하고 u=2 이후</text>
    <text x="398" y="250" font-size="14">증가한다. f(2)=16-56+48+3=11이므로 가능한 k의 최솟값은 11이다.</text>
    <text x="398" y="272" font-size="14">따라서 정답은 ①이다.</text>
    <path d="M350 314 L410 314" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="18" y="350" width="724" height="48" rx="10" fill="#fff7ed" stroke="#fdba74"/>
    <text x="380" y="380" font-size="17" text-anchor="middle" fill="#9a3412">결론: ①</text>
    <text x="380" y="452" font-size="11" text-anchor="middle" fill="#64748b">25_매산고_2학기_기말_고2_수학II · q14 · source-bound solution visual</text>
  </g>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#64748b"/></marker></defs>
</svg>