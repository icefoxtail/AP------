<svg xmlns="http://www.w3.org/2000/svg" width="760" height="638" viewBox="0 0 760 638" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet">
  <title id="title">25_매산고_2학기_기말_고2_수학II · q22 해설 시각화</title>
  <desc id="desc">문항 22의 원문과 해설 흐름을 source-bound 텍스트 카드로 정리한 SVG</desc>
  <rect width="760" height="638" fill="#fff"/>
  <g font-family="Noto Sans KR, Pretendard, Apple SD Gothic Neo, Malgun Gothic, sans-serif" fill="#111">
    <text x="380" y="32" font-size="21" font-weight="700" text-anchor="middle">25_매산고_2학기_기말_고2_수학II · q22 해설 시각화</text>
    <text x="380" y="59" font-size="15" text-anchor="middle" fill="#475569">문항 원문과 해설의 핵심 흐름</text>
    <rect x="18" y="82" width="350" height="416" rx="12" fill="#eff6ff" stroke="#93c5fd"/>
    <rect x="390" y="82" width="352" height="416" rx="12" fill="#f0fdf4" stroke="#86efac"/>
    <text x="34" y="112" font-size="17" font-weight="700" fill="#1d4ed8">문항 핵심</text>
    <text x="398" y="112" font-size="17" font-weight="700" fill="#15803d">해설 흐름</text>
    <text x="34" y="140" font-size="15">[서답형 6번] 최고차항의 계수가 1인 삼차함수</text>
    <text x="34" y="162" font-size="15">f(x)에 대하여 두 함수 f(x), g(x)는 다음</text>
    <text x="34" y="184" font-size="15">조건을 만족시킨다. (가) 함수 f(x)는</text>
    <text x="34" y="206" font-size="15">x=2에서 극솟값 0을 갖는다. (나)</text>
    <text x="34" y="228" font-size="15">g'(x)=f(x)+(x-2)f'(x) (다) 함수 g(x)는</text>
    <text x="34" y="250" font-size="15">x=1 / 2일 때, 최솟값 -21 / 16을 갖는다.</text>
    <text x="34" y="272" font-size="15">이때, f(1)+g(1)의 값을 구하고, 그 과정을</text>
    <text x="34" y="294" font-size="15">서술하시오. [8점]</text>
    <text x="398" y="140" font-size="14">[키포인트] f가 x=2에서 극솟값 0을 가지므로</text>
    <text x="398" y="162" font-size="14">x=2는 이중근이다. 또한 (나)는 g'(x)가 곱의</text>
    <text x="398" y="184" font-size="14">미분 형태임을 이용한다. f(x)는 최고차항의</text>
    <text x="398" y="206" font-size="14">계수가 1인 삼차함수이고 f(2)=f'(2)=0이므로</text>
    <text x="398" y="228" font-size="14">f(x)=(x-2)^2(x-a)로 둘 수 있다. (나)에서</text>
    <text x="398" y="250" font-size="14">g'(x)=f(x)+(x-2)f'(x)=d /</text>
    <text x="398" y="272" font-size="14">dx[(x-2)f(x)]이므로</text>
    <text x="398" y="294" font-size="14">g(x)=(x-2)f(x)+C이다. g가 x=1 / 2에서</text>
    <text x="398" y="316" font-size="14">최솟값을 가지므로 g'(1 / 2)=0이다. 그런데</text>
    <text x="398" y="338" font-size="14">g'(x)=(x-2)^2(4x-3a-2)이므로 g'(1 /</text>
    <text x="398" y="360" font-size="14">2)=-27a / 4=0, 따라서 a=0이다. 그러므로</text>
    <text x="398" y="382" font-size="14">f(x)=x(x-2)^2, g(x)=x(x-2)^3+C이다. g(1</text>
    <text x="398" y="404" font-size="14">/ 2)=-21 / 16을 대입하면 -27 / 16+C=-21 /</text>
    <text x="398" y="426" font-size="14">16이므로 C=3 / 8이다. f(1)=1, g(1)=-1+3 /</text>
    <text x="398" y="448" font-size="14">8=-5 / 8이므로 f(1)+g(1)=3 / 8이다. 따라서</text>
    <text x="398" y="470" font-size="14">구하는 값은 3 / 8이다.</text>
    <rect x="18" y="522" width="724" height="48" rx="10" fill="#fff7ed" stroke="#fdba74"/>
    <text x="380" y="552" font-size="17" text-anchor="middle" fill="#9a3412">결론: 3 / 8</text>
    <text x="380" y="598" font-size="11" text-anchor="middle" fill="#64748b">25_매산고_2학기_기말_고2_수학II · q22 · source-bound solution visual</text>
  </g>
</svg>