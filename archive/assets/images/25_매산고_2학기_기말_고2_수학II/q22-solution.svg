    <text x="380" y="32" font-size="21" font-weight="700" text-anchor="middle">25_매산고_2학기_기말_고2_수학II · q22 해설 시각화</text>
    <text x="380" y="59" font-size="15" text-anchor="middle" fill="#475569">도함수의 활용 · 도함수와 극값</text>
    <rect x="18" y="82" width="350" height="350" rx="12" fill="#eff6ff" stroke="#93c5fd"/>
    <rect x="390" y="82" width="352" height="350" rx="12" fill="#f0fdf4" stroke="#86efac"/>
    <text x="34" y="112" font-size="17" font-weight="700" fill="#1d4ed8">문항 핵심</text>
    <text x="398" y="112" font-size="17" font-weight="700" fill="#15803d">해설 흐름</text>
    <text x="34" y="140" font-size="15">[서답형 6번] 최고차항의 계수가 1인 삼차함수 f(x)에 대하여 두 함수 f(x), g(</text>
    <text x="34" y="162" font-size="15">x)는 다음 조건을 만족시킨다. (가) 함수 f(x)는 x=2에서 극솟값 0을 갖는다. (</text>
    <text x="34" y="184" font-size="15">나) g'(x)=f(x)+(x-2)f'(x) (다) 함수 g(x)는 x=12일 때, 최솟값</text>
    <text x="34" y="206" font-size="15"> -2116을 갖는다. 이때, f(1)+g(1)의 값을 구하고, 그 과정을 서술하시오. [</text>
    <text x="34" y="228" font-size="15">8점]</text>
    <text x="398" y="140" font-size="14">[키포인트] f가 x=2에서 극솟값 0을 가지므로 x=2는 이중근이다. 또한 (나)는 g'</text>
    <text x="398" y="162" font-size="14">(x)가 곱의 미분 형태임을 이용한다. f(x)는 최고차항의 계수가 1인 삼차함수이고 f(</text>
    <text x="398" y="184" font-size="14">2)=f'(2)=0이므로 f(x)=(x-2)^2(x-a)로 둘 수 있다. (나)에서 g'(</text>
    <text x="398" y="206" font-size="14">x)=f(x)+(x-2)f'(x)=ddx[(x-2)f(x)]이므로 g(x)=(x-2)f(x</text>
    <text x="398" y="228" font-size="14">)+C이다. g가 x=12에서 최솟값을 가지므로 g'(12)=0이다. 그런데 g'(x)=(</text>
    <text x="398" y="250" font-size="14">x-2)^2(4x-3a-2)이므로 g'(12)=-27a4=0, 따라서 a=0이다. 그러므로</text>
    <text x="398" y="272" font-size="14"> f(x)=x(x-2)^2, g(x)=x(x-2)^3+C이다. g(12)=-2116을 대입</text>
    <text x="398" y="294" font-size="14">하면 -2716+C=-2116이므로 C=38이다. f(1)=1, g(1)=-1+38=-58</text>
    <text x="398" y="316" font-size="14">이므로 f(1)+g(1)=38이다. 따라서 구하는 값은 38이다.</text>
