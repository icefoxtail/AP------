<svg xmlns="http://www.w3.org/2000/svg" width="760" height="620" viewBox="0 0 760 620" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet">
  <title id="title">25_매산고_2학기_기말_고2_수학II · q20 해설 시각화</title>
  <desc id="desc">문항 20의 원문과 해설 흐름을 source-bound 텍스트 카드로 정리한 SVG</desc>
  <rect width="760" height="620" fill="#fff"/>
  <g font-family="Noto Sans KR, Pretendard, Apple SD Gothic Neo, Malgun Gothic, sans-serif" fill="#111">
    <text x="380" y="32" font-size="21" font-weight="700" text-anchor="middle">25_매산고_2학기_기말_고2_수학II · q20 해설 시각화</text>
    <text x="380" y="59" font-size="15" text-anchor="middle" fill="#475569">도함수의 활용 · 운동 방향</text>
    <rect x="18" y="82" width="350" height="350" rx="12" fill="#eff6ff" stroke="#93c5fd"/>
    <rect x="390" y="82" width="352" height="350" rx="12" fill="#f0fdf4" stroke="#86efac"/>
    <text x="34" y="112" font-size="17" font-weight="700" fill="#1d4ed8">문항 핵심</text>
    <text x="398" y="112" font-size="17" font-weight="700" fill="#15803d">해설 흐름</text>
    <text x="34" y="140" font-size="15">[서답형 4번] 원점에서 출발하여 수직선 위를 움직이는 점 P의 시각 t에서의 위치 x가 </text>
    <text x="34" y="162" font-size="15">x=3t^3-272t^2+18t이다. 점 P가 x=a, x=b에서 운동방향을 바꾼다고 할 </text>
    <text x="34" y="184" font-size="15">때, a+b의 값을 구하고 그 과정을 서술하시오. (단, a\ne b이다.) [5점]</text>
    <text x="398" y="140" font-size="14">[키포인트] 운동방향이 바뀌는 시각은 속도의 부호가 바뀌는 시각이므로 위치함수를 미분해 찾</text>
    <text x="398" y="162" font-size="14">는다. x(t)=3t^3-272t^2+18t이므로 속도는 v(t)=9t^2-27t+18=9</text>
    <text x="398" y="184" font-size="14">(t-1)(t-2)이다. 따라서 t=1, t=2에서 속도의 부호가 바뀌어 운동방향을 바꾼다</text>
    <text x="398" y="206" font-size="14">. x(1)=3-272+18=152, x(2)=24-54+36=6이므로 a, b는 152와</text>
    <text x="398" y="228" font-size="14"> 6이다. 따라서 구하는 값은 a+b=272이다.</text>
    <path d="M350 308 L410 308" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="18" y="330" width="724" height="48" rx="10" fill="#fff7ed" stroke="#fdba74"/>
    <text x="380" y="360" font-size="17" text-anchor="middle" fill="#9a3412">결론: 272</text>
    <text x="380" y="405" font-size="13" text-anchor="middle" fill="#64748b">source: archive/exams/original/high/h2/2final/25_매산고_2학기_기말_고2_수학II.js · q20 · archive/assets/images/25_매산고_2학기_기말_고2_수학II/q20-solution.svg</text>
  </g>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#64748b"/></marker></defs>
</svg>