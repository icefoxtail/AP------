<svg xmlns="http://www.w3.org/2000/svg" width="760" height="620" viewBox="0 0 760 620" role="img" aria-labelledby="title desc">
  <title id="title">25_매산고_2학기_기말_고2_수학II · q17 해설 시각화</title>
  <desc id="desc">문항 17의 원문과 해설 흐름을 source-bound 텍스트 카드로 정리한 SVG</desc>
  <rect width="760" height="620" fill="#fff"/>
  <g font-family="Arial, sans-serif" fill="#111">
    <text x="380" y="32" font-size="21" font-weight="700" text-anchor="middle">25_매산고_2학기_기말_고2_수학II · q17 해설 시각화</text>
    <text x="380" y="59" font-size="15" text-anchor="middle" fill="#475569">도함수의 활용 · 극댓값과 극솟값</text>
    <rect x="18" y="82" width="350" height="350" rx="12" fill="#eff6ff" stroke="#93c5fd"/>
    <rect x="390" y="82" width="352" height="350" rx="12" fill="#f0fdf4" stroke="#86efac"/>
    <text x="34" y="112" font-size="17" font-weight="700" fill="#1d4ed8">문항 핵심</text>
    <text x="398" y="112" font-size="17" font-weight="700" fill="#15803d">해설 흐름</text>
    <text x="34" y="140" font-size="15">[서답형 1번] 함수 f(x)=x^3+ax^2+bx-4가 x=1에서 극댓값 0을 가진다. </text>
    <text x="34" y="162" font-size="15">이때, 상수 a, b와 함수 f(x)의 극솟값 m에 대하여 a+b+m의 값을 구하시오. [</text>
    <text x="34" y="184" font-size="15">4점]</text>
    <text x="398" y="140" font-size="14">[키포인트] x=1에서 극댓값 0이라는 조건은 f(1)=0, f'(1)=0 두 식으로 바꾼</text>
    <text x="398" y="162" font-size="14">다. f(1)=1+a+b-4=0이므로 a+b=3이다. 또 f'(x)=3x^2+2ax+b이므</text>
    <text x="398" y="184" font-size="14">로 f'(1)=3+2a+b=0이다. 두 식을 풀면 a=-6, b=9이다. 따라서 f(x)=</text>
    <text x="398" y="206" font-size="14">x^3-6x^2+9x-4이고 f'(x)=3(x-1)(x-3)이다. x=1에서 극대, x=3</text>
    <text x="398" y="228" font-size="14">에서 극소이므로 극솟값은 m=f(3)=-4이다. 따라서 구하는 값은 a+b+m=3-4=-1</text>
    <text x="398" y="250" font-size="14">이다.</text>
    <path d="M350 330 L410 330" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="18" y="352" width="724" height="48" rx="10" fill="#fff7ed" stroke="#fdba74"/>
    <text x="380" y="382" font-size="17" text-anchor="middle" fill="#9a3412">정답/결론: -1</text>
    <text x="380" y="427" font-size="13" text-anchor="middle" fill="#64748b">source: archive/exams/original/high/h2/2final/25_매산고_2학기_기말_고2_수학II.js · q17 · archive/assets/images/25_매산고_2학기_기말_고2_수학II/q17-solution.svg</text>
  </g>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#64748b"/></marker></defs>
</svg>