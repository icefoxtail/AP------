<svg xmlns="http://www.w3.org/2000/svg" width="720" height="355" viewBox="0 0 720 355" role="img" aria-labelledby="title desc"><title id="title">위치·속도·가속도 계산의 순서</title><desc id="desc">위치를 미분해 속도, 속도를 다시 미분해 가속도를 구하고 t=1을 대입한다</desc><rect width="720" height="355" fill="white"/><text x="360" y="33" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="bold">위치 → 속도 → 가속도</text><rect x="40" y="65" width="640" height="68" rx="6" fill="#fafafa" stroke="#999"/><text x="55" y="91" font-family="sans-serif" font-size="16" font-weight="bold">위치</text><text x="172" y="91" font-family="sans-serif" font-size="17">x(t) = −t³ + 6t²</text><text x="172" y="118" font-family="sans-serif" font-size="16" fill="#222">x(1) = 5</text><rect x="40" y="149" width="640" height="68" rx="6" fill="#f0f1f3" stroke="#999"/><text x="55" y="175" font-family="sans-serif" font-size="16" font-weight="bold">속도</text><text x="172" y="175" font-family="sans-serif" font-size="17">v(t) = −3t² + 12t</text><text x="172" y="202" font-family="sans-serif" font-size="16" fill="#222">v(1) = 9</text><rect x="40" y="233" width="640" height="68" rx="6" fill="#fafafa" stroke="#999"/><text x="55" y="259" font-family="sans-serif" font-size="16" font-weight="bold">가속도</text><text x="172" y="259" font-family="sans-serif" font-size="17">a(t) = −6t + 12</text><text x="172" y="286" font-family="sans-serif" font-size="16" fill="#222">a(1) = 6</text><text x="360" y="335" font-family="sans-serif" font-size="18" text-anchor="middle">v(1) + a(1) = 9 + 6 = 15</text></svg>