<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 465" width="700" height="465" role="img" aria-labelledby="title desc"><title id="title">평균 기준으로 나뉜 다섯 학생의 편차</title><desc id="desc">가로 기준선이 편차 0을 나타낸다. 학생 A와 E의 파란 막대는 양수이고 B, C, D의 주황 막대는 음수 방향으로 내려간다. D의 높이는 위와 아래 길이 합을 맞춘다.</desc><rect width="700" height="465" fill="white" /><line x1="54.0000" y1="228.0000" x2="650.0000" y2="228.0000" stroke="#586574" stroke-width="2.1" stroke-linecap="round" /><text x="45.0000" y="236.0000" font-size="27" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#586574" text-anchor="middle">0</text><rect x="85" y="68" width="62" height="160" fill="#e1eefb" stroke="#205d9c" stroke-width="3" /><text x="116.0000" y="55.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#205d9c" text-anchor="middle">4</text><text x="116.0000" y="433.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">A</text><rect x="203" y="228" width="62" height="40" fill="#fae6ce" stroke="#aa5411" stroke-width="3" /><text x="234.0000" y="298.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#aa5411" text-anchor="middle">−1</text><text x="234.0000" y="433.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">B</text><rect x="321" y="228" width="62" height="120" fill="#fae6ce" stroke="#aa5411" stroke-width="3" /><text x="352.0000" y="378.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#aa5411" text-anchor="middle">−3</text><text x="352.0000" y="433.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">C</text><rect x="439" y="228" width="62" height="80" fill="#fae6ce" stroke="#aa5411" stroke-width="3" /><text x="470.0000" y="338.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#aa5411" text-anchor="middle">−2</text><text x="470.0000" y="433.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">D</text><rect x="557" y="148" width="62" height="80" fill="#e1eefb" stroke="#205d9c" stroke-width="3" /><text x="588.0000" y="135.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#205d9c" text-anchor="middle">2</text><text x="588.0000" y="433.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">E</text></svg>
