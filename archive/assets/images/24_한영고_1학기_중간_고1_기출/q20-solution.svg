<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 440" role="img" aria-labelledby="title desc" data-visual-provenance="solution_schematic" data-bc="10" data-altitude="6" data-rq="5" data-rectangle-height="3">
  <title id="title">삼각형 안의 직사각형 PQRS</title>
  <desc id="desc">밑변 BC가 10, 높이가 6인 scalene triangle에서 RQ가 BC와 평행한 직사각형. 최대일 때 RQ=5, 높이=3을 좌표 비율로 정확히 나타낸 풀이용 도식.</desc>
  <rect width="700" height="440" fill="white"/>
  <g fill="none" stroke="#111827" stroke-width="3" stroke-linejoin="round">
    <path d="M250 50 L100 350 L600 350 Z"/>
    <rect x="175" y="200" width="250" height="150"/>
    <path d="M250 50 L250 350" stroke-dasharray="8 7"/>
  </g>
  <g fill="#111827" font-family="Arial, sans-serif" font-size="18">
    <text x="242" y="38">A</text>
    <text x="78" y="374">B</text>
    <text x="604" y="374">C</text>
    <text x="154" y="194">R</text>
    <text x="432" y="194">Q</text>
    <text x="154" y="374">P</text>
    <text x="432" y="374">S</text>
    <text x="280" y="190">RQ = x</text>
    <text x="438" y="282">y</text>
    <text x="315" y="390">BC = 10</text>
    <text x="258" y="128">6-y</text>
    <text x="258" y="286">6</text>
  </g>
  <g fill="#111827">
    <circle cx="250" cy="50" r="5"/>
    <circle cx="100" cy="350" r="5"/>
    <circle cx="600" cy="350" r="5"/>
    <circle cx="175" cy="200" r="5"/>
    <circle cx="425" cy="200" r="5"/>
    <circle cx="175" cy="350" r="5"/>
    <circle cx="425" cy="350" r="5"/>
  </g>
  <text x="108" y="420" font-family="Arial, sans-serif" font-size="16" fill="#111827">RQ ∥ BC,  x/10 = (6-y)/6</text>
</svg>
