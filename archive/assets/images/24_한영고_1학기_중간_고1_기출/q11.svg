    <text x="115" y="294">−4</text><text x="325" y="294">−1</text><text x="528" y="294">2</text>
    <text x="70" y="446">※ 그래프의 절편과 포물선 방향은 해설에서 사용한 조건으로 재구성함</text>
  </g>
