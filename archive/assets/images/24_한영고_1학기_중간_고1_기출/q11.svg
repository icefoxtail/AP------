  <title id="title">두 이차함수 f(x), g(x)의 그래프</title>
  <desc id="desc">f(x)는 x절편 -1, 2를 갖는 위로 열린 포물선이고 g(x)는 x절편 -4, 2를 갖는 아래로 열린 포물선이다.</desc>
  <rect width="720" height="480" fill="#fff"/>
