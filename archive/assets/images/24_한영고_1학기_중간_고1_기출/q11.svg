  <path d="M80 310 L115 272.9 L150 241.4 L185 215.7 L220 195.7 L255 181.4 L290 172.9 L325 170 L360 172.9 L395 181.4 L430 195.7 L465 215.7 L500 241.4 L535 272.9 L570 310 L605 352.9 L640 401.4" fill="none" stroke="#ea580c" stroke-width="4" stroke-linecap="round"/>
