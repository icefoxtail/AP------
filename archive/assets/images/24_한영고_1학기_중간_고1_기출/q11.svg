    <path d="M80 98H640M80 155H640M80 213H640M80 272H640M80 330H640M80 388H640"/>
  </g>
  <g stroke="#334155" stroke-width="2">
    <path d="M80 272H650"/>
    <path d="M395 410V48"/>
  </g>
  <g fill="#334155" font-family="Arial, sans-serif" font-size="13">
