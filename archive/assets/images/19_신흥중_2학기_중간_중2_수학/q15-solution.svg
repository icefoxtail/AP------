<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 384 320" width="384" height="320" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">예: 두 이등변삼각형의 꼭지각을 40°와 100°로 그렸다. 두 원, 두 정삼각형, 두 정사각형, 두 직각이등변삼각형은 각의 크기가 일정하게 정해져 항상 닮은 도형이다. 그러나 이등변삼각형은 두 변의 길이만 같고 꼭지각의 크기가 달라질 수 있어 그림처럼 닮음이 아닐 수 있다. 따라서 항상 닮은 도형이 아닌 것은 ④이다.</title><desc id="visual-desc">모양이 다른 두 이등변삼각형이 나란히 있고 각각 같은 두 변에 같은 눈금이 있다. 왼쪽은 꼭지각이 40°로 뾰족하고 오른쪽은 꼭지각이 100°로 납작하다.</desc><rect width="384" height="320" fill="#fff"/><g data-layer="30"><line id="AB" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="108.666666667" y1="78.229838707" x2="49.142857143" y2="241.770161293"/></g><g data-layer="30"><line id="BC" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="49.142857143" y1="241.770161293" x2="168.19047619" y2="241.770161293"/></g><g data-layer="30"><line id="CA" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="168.19047619" y1="241.770161293" x2="108.666666667" y2="78.229838707"/></g><g data-layer="30"><line id="DE" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="275.333333333" y1="191.823754676" x2="215.80952381" y2="241.770161293"/></g><g data-layer="30"><line id="EF" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="215.80952381" y1="241.770161293" x2="334.857142857" y2="241.770161293"/></g><g da