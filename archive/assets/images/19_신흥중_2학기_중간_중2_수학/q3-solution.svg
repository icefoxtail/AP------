<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 384 320" width="384" height="320" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">이등변삼각형에서 꼭지각의 이등분선 AD는 밑변 BC를 수직이등분하므로 AD 위의 점 P는 PB=PC이다. 따라서 ∠PBC=∠PCB(②), △ABP≡△ACP(SAS, ③), △PBD≡△PCD(④), ∠BPD=∠CPD(①)이다. 그러나 ∠BPC=90°라는 ⑤는 P의 위치에 따라 달라져 항상 성립하지 않는다. 따라서 옳지 않은 것은 ⑤이다.</title><desc id="visual-desc">이등변삼각형 ABC의 꼭짓점 A에서 밑변 BC의 점 D로 선분 AD가 그어져 있고 D에 직각 표시가 있다. AD 위의 점 P에서 B와 C로 선분이 그어져 있으며 PB와 PC에 같은 눈금이 있다.</desc><rect width="384" height="320" fill="#fff"/><g data-layer="30"><line id="AB" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="192" y1="45.714285714" x2="96.761904762" y2="274.285714286"/></g><g data-layer="30"><line id="BD" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="96.761904762" y1="274.285714286" x2="192" y2="274.285714286"/></g><g data-layer="30"><line id="DC" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="192" y1="274.285714286" x2="287.238095238" y2="274.285714286"/></g><g data-layer="30"><line id="CA" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="287.238095238" y1="274.285714286" x2="192" y2="45.714285714"/></g><g data-layer="30"><line id="AP" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="192" y1="45.714285714" x2="192" y2="179.047619048"/></g><g data-layer="30"><line id="PD