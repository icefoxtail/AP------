<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 600" width="720" height="600" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">직각삼각형 ABC의 넓이는 2분의 1 곱하기 8 곱하기 6, 즉 24 제곱센티미터이다. 내접원의 반지름은 8과 6을 더한 값에서 10을 뺀 것의 절반인 2 센티미터이므로 원의 넓이는 4π 제곱센티미터이다. 색칠한 부분의 넓이는 24에서 4π를 뺀 값이다. 따라서 답은 ④이다.</title><desc id="visual-desc">직각삼각형 ABC 안에 중심 I와 반지름 2인 내접원이 있고, 원을 뺀 나머지 부분이 색칠되어 있다. 세 변에 10, 8, 6이 표시되고 반지름에 r=2가 표시되어 있다.</desc><rect width="720" height="600" fill="#fff"/><g data-layer="10"><path id="rg0" data-role="region" stroke="none" stroke-width="1.6" fill="#e4e7ec" data-owner-points="A B C I P" data-mark="region" data-mark-id="rg0" fill-rule="evenodd" d="M67.142857143 80.357142857 L652.857142857 519.642857143 L67.142857143 519.642857143 L67.142857143 80.357142857 Z M213.571428571 519.642857143 A146.428571429 146.428571429 0 0 0 213.571428571 226.785714286 A146.428571429 146.428571429 0 0 0 213.571428571 519.642857143 Z"/></g><g data-layer="30"><line id="AB" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="67.142857143" y1="80.357142857" x2="652.857142857" y2="519.642857143"/></g><g data-layer="30"><line id="BC" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="652.857142857" y1="519.642857143" x2="67.142857143" y2="519.642857143"/></g><g data-layer="30"><line id="CA" data-role="line" stroke="#111" stroke-width