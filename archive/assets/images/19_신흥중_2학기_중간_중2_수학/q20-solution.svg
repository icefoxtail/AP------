<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 384 320" width="384" height="320" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">예: AD∥BC, AB∥DF인 그림이다. □ABFD는 평행사변형이므로 DF=AB=6이다. AD∥BC에서 △ADE∽△CFE(AA 닮음)이므로 DE:EF=AE:CE=4:5이다. DE+EF=6이므로 DE=6×4/9=8/3이다. 따라서 답은 ③이다.</title><desc id="visual-desc">평행한 변 AD와 BC 사이에 사다리꼴이 있고 점 A에서 평행하게 내린 AB와 DF가 평행사변형 ABFD를 만든다. 대각선 AC와 DF가 점 E에서 만나고 AB 6, AE 4, EC 5가 적혀 있다.</desc><rect width="384" height="320" fill="#fff"/><g data-layer="30"><line id="AB" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="127.714285714" y1="83.818824972" x2="49.142857143" y2="236.181175028"/></g><g data-layer="30"><line id="BF" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="49.142857143" y1="236.181175028" x2="176.126984127" y2="236.181175028"/></g><g data-layer="30"><line id="FC" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="176.126984127" y1="236.181175028" x2="334.857142857" y2="236.181175028"/></g><g data-layer="30"><line id="CE" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="334.857142857" y1="236.181175028" x2="219.777777778" y2="151.535424997"/></g><g data-layer="30"><line id="EA" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="219.777777778" y1="151.535424997" x2="127.714285714" y2="83.818824972"/></g><g data-layer="30"><