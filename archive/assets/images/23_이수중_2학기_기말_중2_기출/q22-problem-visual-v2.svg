<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 714 304" width="714" height="304" role="img" aria-labelledby="title desc"><title id="title">가운데 경계로 나뉜 같은 넓이의 두 부분</title><desc id="desc">가로로 긴 직사각형을 둘로 이등분하였다. 왼쪽은 A, 오른쪽은 B이고 두 부분 모두 아직 칠하지 않았다.</desc><rect width="714" height="304" fill="white" /><rect x="64" y="53" width="586" height="197" rx="4" fill="#edf5fb" stroke="#21639a" stroke-width="5" /><line x1="357.0000" y1="53.0000" x2="357.0000" y2="250.0000" stroke="#21639a" stroke-width="4.7" stroke-linecap="round" /><text x="211.0000" y="167.0000" font-size="43" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#273846" text-anchor="middle">A</text><text x="504.0000" y="167.0000" font-size="43" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#273846" text-anchor="middle">B</text></svg>
