<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 684 647" width="684" height="647" role="img" aria-labelledby="title desc"><title id="title">회전축을 따라 돌리는 직각삼각형</title><desc id="desc">한 직각변이 회전축 l에 놓인 삼각형이다. 반지름이 될 가로변은 8 cm이고 빗변은 17 cm이다. 회전으로 생기는 원뿔과 축을 따라 구한 높이 15 cm를 표시했다.</desc><rect width="684" height="647" fill="white" /><polygon points="336.0000,105.0000 124.8000,501.0000 547.2000,501.0000" fill="#e9f3fb" /><polygon points="336.0000,105.0000 336.0000,501.0000 547.2000,501.0000" fill="#e3f2e9" /><ellipse cx="336" cy="501" rx="211.2" ry="48" fill="#e1f0ec" /><line x1="336.0000" y1="105.0000" x2="124.8000" y2="501.0000" stroke="#21639a" stroke-width="5.3" stroke-linecap="round" /><line x1="336.0000" y1="105.0000" x2="547.2000" y2="501.0000" stroke="#21639a" stroke-width="5.3" stroke-linecap="round" /><line x1="336.0000" y1="501.0000" x2="547.2000" y2="501.0000" stroke="#227365" stroke-width="5.3" stroke-linecap="round" /><path d="M 124.8 501 A 211.2 48 0 0 0 547.2 501" stroke="#21639a" stroke-width="4.2" fill="none" /><path d="M 124.8 501 A 211.2 48 0 0 1 547.2 501" stroke="#687889" stroke-width="4.2" fill="none" stroke-dasharray="8 6" /><line x1="336.0000" y1="58.0000" x2="336.0000" y2="568.0000" stroke="#774698" stroke-width="3.65" stroke-linecap="round" stroke-dasharray="9 6" /><line x1="336.0000" y1="470.0000" x2="365.0000" y2="470.0000" stroke="#687889" stroke-width="2.6" stroke-linecap="round" /><line x1="365.0000" y1="470.0000" x2="365.0000" y2="501.0000" stroke="#687889" stroke-width="2.6" stroke-linecap="round" /><text x="353.0000" y="58.0000" font-size="34" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#774698" text-anchor="middle">l</text><text x="284.0000" y="325.0000" font-size="33" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#774698" text-anchor="middle">15 cm</text><text x="492.0000" y="284.0000" font-size="33" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="60