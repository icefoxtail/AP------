<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 460" width="520" height="460" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">sin²θ + cos²θ = 1에서 cos²θ = 1 − 7/16 = 9/16이다. 제2사분면에서는 cos θ &lt; 0이므로 cos θ = −3/4이다. 따라서 답은 ⑤이다.</title><desc id="visual-desc">단위원의 제2사분면 위의 점에서 x축에 점선 수선을 내린 그림이고, 원점에서 그 점까지의 동경과 x축이 이루는 각이 θ로 표시되어 있다.</desc><rect width="520" height="460" fill="#fff"/><g data-layer="30"><line id="x-axis" data-role="axis" stroke="#111" stroke-width="1.2" fill="none" data-axis="x" x1="32" y1="248.09847138" x2="488" y2="248.09847138"/></g><g data-layer="30"><line id="y-axis" data-role="axis" stroke="#111" stroke-width="1.2" fill="none" data-axis="y" x1="243.483048392" y1="404.271537725" x2="243.483048392" y2="55.728462275"/></g><g data-layer="30"><line id="sOP" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="243.483048392" y1="248.09847138" x2="144.381338742" y2="160.698978635"/></g><g data-layer="30"><line id="sPH" data-role="line" stroke="#111" stroke-width="1.6" fill="none" stroke-dasharray="6 4" x1="144.381338742" y1="160.698978635" x2="144.381338742" y2="248.09847138"/></g><g data-layer="40"><circle id="C" data-role="circle" stroke="#111" stroke-width="2.05" fill="none" cx="243.483048392" cy="248.09847138" r="132.135612866"/></g><g data-layer="60"><polyline id="rH" data-role="indicator" stroke="#1