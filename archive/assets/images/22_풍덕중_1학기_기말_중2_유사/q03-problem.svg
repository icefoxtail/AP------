<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 420" width="520" height="420" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">직사각형 ABCD에서 변 CD 위의 점 E와, 선분 AE를 접는 선으로 하여 점 D가 옮겨진 점 F를 보여 준다. 변 AB, AD, CE에 각각 5x, 4y, 3/2 y가 표시되어 있다.</title><desc id="visual-desc">직사각형 ABCD의 오른쪽 변 CD 위에 점 E가 있고, 점 D가 선분 AE를 접는 선으로 접혀 점 F로 옮겨진 모습이 그려져 있다. 삼각형 AEF가 보이고, 변 AB에는 5x, 변 AD에는 4y, 선분 CE에는 3/2 y가 적혀 있다.</desc><rect width="520" height="420" fill="#fff"/><g data-layer="30"><line id="sAB" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="66.52173913" y1="55.217391304" x2="66.52173913" y2="364.782608696"/></g><g data-layer="30"><line id="sBC" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="66.52173913" y1="364.782608696" x2="453.47826087" y2="364.782608696"/></g><g data-layer="30"><line id="sCE" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="453.47826087" y1="364.782608696" x2="453.47826087" y2="171.304347826"/></g><g data-layer="30"><line id="sED" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="453.47826087" y1="171.304347826" x2="453.47826087" y2="55.217391304"/></g><g data-layer="30"><line id="sDA" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="453.47826087" y1="55.217391304" x2="66.52173913" y2="55.217391304"/></g><g data-layer="30"><line id="sAE" data-