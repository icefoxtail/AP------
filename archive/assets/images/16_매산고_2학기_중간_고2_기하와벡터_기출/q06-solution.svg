<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 360" width="540" height="360" role="img" aria-labelledby="t d"><title id="t">벡터의 선형결합</title><desc id="d">a=(2,3), b=(1,−1), c=(−1,6)이며 c=a−3b</desc><rect width="540" height="360" fill="#fff"/><style>text{font-family:Arial,'Malgun Gothic',sans-serif;fill:#111}.title{font-size:18px;font-weight:bold}.lbl{font-size:14px}</style><defs><marker id="r" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#c0262d"/></marker><marker id="g" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#07805c"/></marker><marker id="k" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#555"/></marker></defs><text x="20" y="28" class="title">성분 비교로 정한 선형결합</text><line x1="70" y1="280" x2="450" y2="280" stroke="#777"/><line x1="140" y1="325" x2="140" y2="55" stroke="#777"/><line x1="140" y1="280" x2="204" y2="184" stroke="#c0262d" stroke-width="3" marker-end="url(#r)"/><line x1="140" y1="280" x2="172" y2="312" stroke="#555" stroke-width="2" marker-end="url(#k)"/><line x1="204" y1="184" x2="108" y2="88" stroke="#555" stroke-width="3" marker-end="url(#k)"/><line x1="140" y1="280" x2="108" y2="88" stroke="#07805c" stroke-width="3" marker-end="url(#g)"/><text x="210" y="180" class="lbl">a=(2,3)</text><text x="174" y="318" class="lbl">b=(1,−1)</text><text x="85" y="77" class="lbl">c=(−1,6)</text><text x="305" y="115" class="lbl">성분식:</text><text x="305" y="140" class="lbl">2k+l=−1</text><text x="305" y="165" class="lbl">3k−l=6</text><text x="305" y="200" class="lbl">k=1, l=−3</text><text x="305" y="230" class="lbl">c=a−3b</text></svg>
