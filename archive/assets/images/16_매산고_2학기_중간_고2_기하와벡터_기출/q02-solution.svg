<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 330" width="520" height="330" role="img" aria-labelledby="t d"><title id="t">초점을 공유하는 두 타원</title><desc id="d">주어진 타원은 a=3,b=√5,c=2이고 새 타원은 a=√5,b=1,c=2</desc><rect width="520" height="330" fill="#fff"/><style>text{font-family:Arial,'Malgun Gothic',sans-serif;fill:#111}.title{font-size:18px;font-weight:bold}.lbl{font-size:14px}.old{fill:none;stroke:#888;stroke-width:2;stroke-dasharray:6 4}.new{fill:#dbeafe;fill-opacity:.5;stroke:#1769aa;stroke-width:3}.focus{fill:#c0262d}</style><text x="22" y="27" class="title">공통 초점과 반축 길이</text><line x1="55" y1="205" x2="465" y2="205" stroke="#444"/><line x1="260" y1="55" x2="260" y2="300" stroke="#444"/><ellipse cx="260" cy="205" rx="105" ry="78.26" class="old"/><ellipse cx="260" cy="205" rx="78.26" ry="35" class="new"/><circle cx="190" cy="205" r="4.5" class="focus"/><circle cx="330" cy="205" r="4.5" class="focus"/><text x="167" y="225" class="lbl">F′(−2,0)</text><text x="332" y="225" class="lbl">F(2,0)</text><text x="68" y="72" class="lbl">주어진 타원: a=3, b=√5</text><text x="274" y="142" class="lbl">새 타원: a=√5, b=1</text><text x="274" y="163" class="lbl">c²=a²−b²=4</text><text x="274" y="280" class="lbl">a²+b²=5+1=6</text></svg>
