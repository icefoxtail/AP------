<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 320" width="450" height="320" role="img" aria-labelledby="t d"><title id="t">120도 각을 이루는 두 벡터</title><desc id="d">벡터 크기는 2와 3, 끼인각은 120도이므로 내적은 −3</desc><rect width="450" height="320" fill="#fff"/><style>text{font-family:Arial,'Malgun Gothic',sans-serif;fill:#111}.title{font-size:18px;font-weight:bold}.lbl{font-size:15px}</style><defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#1769aa"/></marker><marker id="b" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#c0262d"/></marker></defs><text x="20" y="28" class="title">벡터의 크기와 끼인각</text><circle cx="120" cy="230" r="4" fill="#111"/><line x1="120" y1="230" x2="220" y2="230" stroke="#1769aa" stroke-width="3" marker-end="url(#a)"/><line x1="120" y1="230" x2="45" y2="100" stroke="#c0262d" stroke-width="3" marker-end="url(#b)"/><path d="M 165 230 A45 45 0 0 0 97.5 191" fill="none" stroke="#555" stroke-width="1.5"/><text x="173" y="218" class="lbl">|a|=2</text><text x="24" y="87" class="lbl">|b|=3</text><text x="142" y="180" class="lbl">120°</text><text x="250" y="130" class="lbl">a·b=|a||b|cos120°</text><text x="250" y="160" class="lbl">=2·3·(−1/2)</text><text x="250" y="195" class="lbl">=−3</text></svg>
