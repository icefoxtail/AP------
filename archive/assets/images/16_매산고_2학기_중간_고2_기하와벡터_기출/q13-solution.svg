<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="t d"><title id="t">벡터 조건이 만드는 타원</title><desc id="d">x²+y²/4=1; 원점 거리의 최소 1, 최대 2</desc><rect width="720" height="420" fill="#fff"/><style>text{font-family:"Malgun Gothic",sans-serif;fill:#111}.small{font-size:14px}.label{font-size:18px;font-weight:bold}.main{font-size:23px;font-weight:bold}.axis{stroke:#333;stroke-width:1.4}.curve{fill:none;stroke:#1769aa;stroke-width:3}.aux{fill:none;stroke:#777;stroke-width:1.5;stroke-dasharray:6 5}.point{fill:#b42318;stroke:#fff;stroke-width:1.5}</style><text x="28" y="36" class="main">벡터 조건이 만드는 타원</text><ellipse cx="300" cy="220" rx="100" ry="200" fill="#eaf2ff" stroke="#1769aa" stroke-width="3"/><line x1="130" y1="220" x2="470" y2="220" class="axis"/><line x1="300" y1="55" x2="300" y2="385" class="axis"/><line x1="300" y1="220" x2="300" y2="20" stroke="#b42318" stroke-width="2"/><line x1="300" y1="220" x2="200" y2="220" stroke="#07805c" stroke-width="2"/><circle cx="300" cy="20" r="5" class="point"/><circle cx="200" cy="220" r="5" class="point"/><text x="315" y="35">최대 2</text><text x="180" y="250">최소 1</text><text x="500" y="180" class="label">최댓값+최솟값 = 3</text></svg>
