<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="t d"><title id="t">단위원의 접선 방향 속도와 반지름 방향 가속도</title><desc id="d">v는 접선 방향이고 a는 중심 쪽이므로 내적 0</desc><rect width="720" height="420" fill="#fff"/><style>text{font-family:"Malgun Gothic",sans-serif;fill:#111}.small{font-size:14px}.label{font-size:18px;font-weight:bold}.main{font-size:23px;font-weight:bold}.axis{stroke:#333;stroke-width:1.4}.curve{fill:none;stroke:#1769aa;stroke-width:3}.aux{fill:none;stroke:#777;stroke-width:1.5;stroke-dasharray:6 5}.point{fill:#b42318;stroke:#fff;stroke-width:1.5}</style><text x="28" y="36" class="main">단위원의 접선 방향 속도와 반지름 방향 가속도</text><defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#333"/></marker></defs><circle cx="280" cy="235" r="130" class="curve"/><line x1="100" y1="235" x2="465" y2="235" class="axis"/><line x1="280" y1="75" x2="280" y2="390" class="axis"/><circle cx="371.9" cy="143.1" r="6" class="point"/><line x1="280" y1="235" x2="371.9" y2="143.1" class="aux"/><line x1="371.9" y1="143.1" x2="306.9" y2="78.1" stroke="#2563eb" stroke-width="3" marker-end="url(#a)"/><line x1="371.9" y1="143.1" x2="280" y2="235" stroke="#e11d48" stroke-width="3" marker-end="url(#a)"/><text x="380" y="135">P(cos t,sin t)</text><text x="307" y="77">v</text><text x="292" y="220">a</text><text x="500" y="200" class="label">v·a = 0</text></svg>
