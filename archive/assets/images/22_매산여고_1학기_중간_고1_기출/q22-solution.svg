<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" width="560" height="360" role="img" aria-labelledby="title desc" data-visual-type="geometry" data-fact-binding="AB=10;AC=10;BC=12;BD=DC=6;AD=8;area=48" data-render-status="NOT_RUN">
  <title id="title">밑변 12, 두 옆변 10인 이등변삼각형의 높이</title>
  <desc id="desc">밑변 BC의 중점 D와 수선 AD를 표시하고, 6·8·10 직각삼각형으로 넓이 48을 구하는 도형이다.</desc>
  <rect x="0" y="0" width="560" height="360" fill="#ffffff"/>
  <path d="M280 50 L100 290 L460 290 Z" fill="#eaf4ff" fill-opacity=".62" stroke="#233b57" stroke-width="3" stroke-linejoin="round"/>
  <line x1="280" y1="50" x2="280" y2="290" stroke="#e0781b" stroke-width="3" stroke-dasharray="8 6"/>
  <path d="M280 272 h18 v18" fill="none" stroke="#233b57" stroke-width="2.5"/>
  <g font-family="'Noto Sans KR','Malgun Gothic',Arial,sans-serif" font-size="19" font-weight="650" fill="#17293c">
    <text x="278" y="32" text-anchor="middle">A</text>
    <text x="84" y="311">B</text>
    <text x="468" y="311">C</text>
    <text x="275" y="313" text-anchor="end">D</text>
  </g>
  <g font-family="'Noto Sans KR','Malgun Gothic',Arial,sans-serif" font-size="17" fill="#233b57" font-weight="600">
    <text x="169" y="164" text-anchor="middle">10</text>
    <text x="396" y="164" text-anchor="middle">10</text>
    <text x="188" y="283" text-anchor="middle">6</text>
    <text x="372" y="283" text-anchor="middle">6</text>
    <text x="295" y="180" fill="#b45309">8</text>
  </g>
  <text x="280" y="341" text-anchor="middle" font-size="17" font-family="'Noto Sans KR','Malgun Gothic',Arial,sans-serif" fill="#284a67">12 × 8 ÷ 2 = 48</text>
</svg>
