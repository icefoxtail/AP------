<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 330" width="460" height="330" role="img" aria-label="직각삼각형 ABC, C가 직각이고 BC가 a, CA가 b, AB가 c">
  <rect x="0" y="0" width="460" height="330" rx="16" fill="#ffffff"/>
  <path d="M 142 52 L 142 272 L 307 272 Z" fill="#edf6ff" stroke="#243b53" stroke-width="3" stroke-linejoin="round"/>
  <path d="M 142 252 L 162 252 L 162 272" fill="none" stroke="#243b53" stroke-width="2"/>
  <circle cx="142" cy="52" r="4" fill="#243b53"/>
  <circle cx="142" cy="272" r="4" fill="#243b53"/>
  <circle cx="307" cy="272" r="4" fill="#243b53"/>
  <g font-family="sans-serif" font-size="19" font-weight="600" fill="#243b53">
    <text x="127" y="37" text-anchor="end">A</text>
    <text x="120" y="293" text-anchor="end">C</text>
    <text x="324" y="294">B</text>
    <text x="110" y="165" text-anchor="end">b</text>
    <text x="227" y="298" text-anchor="middle">a</text>
    <text x="249" y="140" text-anchor="middle">c</text>
  </g>
  <text x="230" y="22" font-size="17" text-anchor="middle" font-family="sans-serif" fill="#274660">a² + b² = c²</text>
</svg>
