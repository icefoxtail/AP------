<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 420" width="520" height="420" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">예를 들어 (a,b,c)=(1,4,2)이면 A(-1,0), B(4,0), C(2,4)이고 AB=AC=5이다. 이때 AB²=25, AC²=3²+4²=25, BC²=2²+4²=20이므로 세 변의 제곱을 비교하면 된다. 해설의 세 경우를 모두 세면 2+7+6=15가지이고 전체는 216가지이므로 확률은 15/216=5/72이다. 따라서 답은 ①이다.</title><desc id="visual-desc">왼쪽 아래에 A, 오른쪽 아래에 B, 위쪽에 C가 있는 삼각형이 그려져 있고, 변 AB와 변 AC에 같은 길이 표시가 있으며 각 변에 5, 5, √20의 길이 라벨이 붙어 있다. 꼭짓점 C에서 변 AB로 내린 점선 수선과 길이 4의 라벨, 수선의 발의 직각 표시가 보인다.</desc><rect width="520" height="420" fill="#fff"/><g data-layer="30"><line id="sBC" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="453.47826087" y1="364.782608696" x2="298.695652174" y2="55.217391304"/></g><g data-layer="30"><line id="sCD" data-role="line" stroke="#111" stroke-width="1.6" fill="none" stroke-dasharray="6 4" x1="298.695652174" y1="55.217391304" x2="298.695652174" y2="364.782608696"/></g><g data-layer="31"><line id="sAB" data-role="line" stroke="#b8325f" stroke-width="2.4" fill="none" x1="66.52173913" y1="364.782608696" x2="453.47826087" y2="364.782608696"/></g><g data-layer="31"><line id="sAC" data-role="line" stroke="#b8325f" stroke-width="2.4" fill="none" x1="66.52173913" y1="364.782608696" x2="298.695652174" y2="55.217391304"/></g><g data-layer="55"><line id="e1-sAB-1" data-role="indicator" stroke="#