<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 360" width="620" height="360" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">6명을 일렬로 앉히는 배열은 6!가지이다. 직사각형 탁자는 180° 회전한 배열과만 겹치므로 서로 다른 배열은 6!을 2로 나눈 360가지이다. 따라서 답은 ③이다.</title><desc id="visual-desc">직사각형 탁자 둘레에 번호가 붙은 여섯 좌석이 배치되어 있다.</desc><rect width="620" height="360" fill="#fff"/><g data-layer="30"><line id="sT12" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="107.376093294" y1="255.983965015" x2="512.623906706" y2="255.983965015"/></g><g data-layer="30"><line id="sT23" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="512.623906706" y1="255.983965015" x2="512.623906706" y2="104.016034985"/></g><g data-layer="30"><line id="sT34" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="512.623906706" y1="104.016034985" x2="107.376093294" y2="104.016034985"/></g><g data-layer="30"><line id="sT41" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="107.376093294" y1="104.016034985" x2="107.376093294" y2="255.983965015"/></g><g data-layer="90"><g id="n1" data-label-kind="EQUATION_LABEL" data-priority="1" data-font-px="27.6" data-owner="n1" data-fragment-sha="sha256:c12db47b88336f900f2d64759997a156d2801b395420df8486507e01b9cffe94" data-text="1" transform="translate(201.498246647 43.508853644)"><svg xmlns="http://www.w3.org/2