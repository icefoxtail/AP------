<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 440" width="440" height="440" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">정육각형의 꼭짓점과 원의 중심을 이으면 안쪽에 6개의 삼각형, 정육각형과 원 사이에 6개의 활꼴이 생겨 모두 12개 영역이 된다. 12가지 색을 모두 쓰는 배치는 12!가지이고, 60도씩 회전한 6가지가 같은 문양이 된다. 모든 색이 달라 회전으로 겹치는 배치는 없으므로 12!을 6으로 나누면 k=6이다. 따라서 답은 ①이다.</title><desc id="visual-desc">원에 내접하는 정육각형이 있고, 중심에서 여섯 꼭짓점으로 반지름이 그어져 있으며, 이웃한 두 반지름 사이에 60도 각이 표시되어 있다.</desc><rect width="440" height="440" fill="#fff"/><g data-layer="12"><polygon id="a60-sector" data-role="angleSector" stroke="none" stroke-width="1.6" fill="#d9d9d9" data-owner-points="H1 O H2" data-mark="angle" data-mark-id="a60" data-mark-index="0" data-mark-count="1" data-mark-side="INNER" points="220,220 220,192 221.831287618,192.059950149 223.654733382,192.239543882 225.462529016,192.538012149 227.246933263,192.954076864 229.000305028,193.485956374 230.715136106,194.13137309 232.384083326,194.887563237 234,195.751288694 235.555966525,196.718850856 237.045320012,197.786106472 238.461682823,198.948485391 239.798989873,200.201010127 241.051514609,201.538317177 242.213893528,202.954679988 243.281149144,204.444033475 244.248711306,206"/></g><g data-layer="30"><line id="sH1H2" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="220" y1="75.295566502" x2="345.317715449" y2="147.647783251"/></g><g data-layer="