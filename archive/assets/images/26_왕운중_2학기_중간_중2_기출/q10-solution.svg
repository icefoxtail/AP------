<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 330" role="img" aria-labelledby="title desc">
<title id="title">10번 해설 도형</title><desc id="desc">내심 I를 지나는 DE가 BC와 평행일 때 BD=DI, CE=IE가 되는 관계</desc>
<g fill="none" stroke="#222" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
<path d="M70 279.4 L100 41.3 L370 279.4 Z"/><path d="M80 200 L280 200"/>
<circle cx="160" cy="200" r="3.5" fill="#222"/>
<path d="M70 279.4 L160 200 M370 279.4 L160 200" stroke-dasharray="6 5"/>
</g>
<g fill="#222" font-family="sans-serif" font-size="14">
<text x="94" y="30">A</text><text x="54" y="299">B</text><text x="375" y="299">C</text>
<text x="68" y="195">D</text><text x="285" y="195">E</text><text x="167" y="196">I</text>
<text x="92" y="226">BD=DI=4</text><text x="274" y="226">CE=IE=6</text>
<text x="82" y="120">AD=8</text><text x="229" y="120">AE=12</text>
<text x="225" y="316" text-anchor="middle">DE ∥ BC, 따라서 AB=12, AC=18</text>
</g></svg>