<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 350" role="img" aria-labelledby="title desc">
<title id="title">10번 해설 도형</title><desc id="desc">내심 I를 지나는 DE가 BC와 평행일 때 BD=DI, CE=IE가 되는 관계</desc>
<g fill="none" stroke="#222" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
<path d="M82 285 L118 94 L442 285 Z"/><path d="M94 190 L310 190"/><path d="M94 190 L190 190 L310 190"/>
<circle cx="190" cy="190" r="3.5" fill="#222"/>
<path d="M82 285 L190 190 M442 285 L190 190" stroke-dasharray="6 5"/>
</g>
<g fill="#222" font-family="sans-serif" font-size="14">
<text x="111" y="82">A</text><text x="65" y="303">B</text><text x="447" y="303">C</text>
<text x="84" y="185">D</text><text x="315" y="185">E</text><text x="197" y="186">I</text>
<text x="115" y="215">BD=DI=4</text><text x="294" y="215">CE=IE=6</text>
<text x="118" y="139">AD=8</text><text x="286" y="139">AE=12</text>
<text x="250" y="327" text-anchor="middle">DE ∥ BC, 따라서 AB=12, AC=18</text>
</g></svg>