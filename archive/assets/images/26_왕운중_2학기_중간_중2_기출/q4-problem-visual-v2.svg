<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 721 513" width="721" height="513" role="img" aria-labelledby="title desc"><title id="title">밑변 아래의 외심과 오른쪽 변 위의 외심</title><desc id="desc">삼각형 ABC의 외심 O는 밑변 BC 아래에 있다. A에서 BC로 내린 수선의 발이 D이고, 삼각형 ADC의 외심 O′는 AC 위에 있다. ABD는 45도이며 BOC는 160도이다.</desc><rect width="721" height="513" fill="white" /><polygon points="311.9219,118.7500 85.0000,345.6719 636.0000,345.6719" fill="none" /><line x1="85.0000" y1="345.6719" x2="311.9219" y2="118.7500" stroke="#205d9c" stroke-width="4.6" stroke-linecap="round" /><line x1="311.9219" y1="118.7500" x2="636.0000" y2="345.6719" stroke="#205d9c" stroke-width="4.6" stroke-linecap="round" /><line x1="636.0000" y1="345.6719" x2="85.0000" y2="345.6719" stroke="#205d9c" stroke-width="4.6" stroke-linecap="round" /><line x1="311.9219" y1="118.7500" x2="311.9219" y2="345.6719" stroke="#266f73" stroke-width="4.1" stroke-linecap="round" /><line x1="311.9219" y1="345.6719" x2="473.9610" y2="232.2110" stroke="#704895" stroke-width="3.7" stroke-linecap="round" /><line x1="85.0000" y1="345.6719" x2="360.5000" y2="394.2500" stroke="#704895" stroke-width="4.0" stroke-linecap="round" /><line x1="636.0000" y1="345.6719" x2="360.5000" y2="394.2500" stroke="#704895" stroke-width="4.0" stroke-linecap="round" /><line x1="311.9219" y1="329.6719" x2="327.9219" y2="329.6719" stroke="#586574" stroke-width="1.8" stroke-linecap="round" /><line x1="327.9219" y1="329.6719" x2="327.9219" y2="345.6719" stroke="#586574" stroke-width="1.8" stroke-linecap="round" /><path d="M 113.2843 317.3876 A 40 40 0 0 1 125.0000 345.6719" stroke="#266f73" stroke-width="2.25" fill="none" /><text x="148.7477" y="327.2668" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#266f73" text-anchor="middle">45°</text><path d="M 320.1229 387.1304 A 41 41 0 0 1 400.8771 387.1304" stroke="#704895" stroke-width="2.25" fill="none" /><line x1="395.5000" y1="374.2500" x2="464.5000" y2="416.2500" stroke="#704895" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="5 5" /><text x="508.5000" y="426.2500" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#704895" text-anchor="middle">160°</text><circle cx="311.92191681481813" cy="118.75000000000003" r="4.9" fill="#28364b" /><text x="311.9219" y="101.7500" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">A</text><circle cx="85.0" cy="345.67191681481813" r="4.9" fill="#28364b" /><text x="67.0000" y="352.6719" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">B</text><circle cx="636.0" cy="345.67191681481813" r="4.9" fill="#28364b" /><text x="653.0000" y="353.6719" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">C</text><circle cx="311.92191681481813" cy="345.67191681481813" r="4.9" fill="#28364b" /><text x="295.9219" y="363.6719" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">D</text><circle cx="360.5" cy="394.25" r="4.9" fill="#28364b" /><text x="360.5000" y="418.2500" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">O</text><circle cx="473.96095840740907" cy="232.21095840740907" r="4.9" fill="#28364b" /><text x="491.9610" y="219.2110" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">O′</text></svg>
