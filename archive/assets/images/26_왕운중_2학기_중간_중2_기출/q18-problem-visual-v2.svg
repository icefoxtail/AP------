<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 722 518" width="722" height="518" role="img" aria-labelledby="title desc"><title id="title">마름모의 대각선과 오른쪽 아래 변에 내린 수선</title><desc id="desc">마름모 ABCD의 두 대각선은 O에서 만난다. A에서 CD에 내린 수선은 E에 닿고 BD와 F에서 만난다. AFD의 각은 115도이다.</desc><rect width="722" height="518" fill="white" /><polygon points="361.0000,130.2991 85.0000,259.0000 361.0000,387.7009 637.0000,259.0000" fill="none" /><line x1="361.0000" y1="130.2991" x2="85.0000" y2="259.0000" stroke="#205d9c" stroke-width="4.6" stroke-linecap="round" /><line x1="85.0000" y1="259.0000" x2="361.0000" y2="387.7009" stroke="#205d9c" stroke-width="4.6" stroke-linecap="round" /><line x1="361.0000" y1="387.7009" x2="637.0000" y2="259.0000" stroke="#205d9c" stroke-width="4.6" stroke-linecap="round" /><line x1="637.0000" y1="259.0000" x2="361.0000" y2="130.2991" stroke="#205d9c" stroke-width="4.6" stroke-linecap="round" /><line x1="361.0000" y1="130.2991" x2="361.0000" y2="387.7009" stroke="#586574" stroke-width="3.5" stroke-linecap="round" /><line x1="85.0000" y1="259.0000" x2="637.0000" y2="259.0000" stroke="#704895" stroke-width="4.15" stroke-linecap="round" /><line x1="361.0000" y1="130.2991" x2="459.5906" y2="341.7274" stroke="#266f73" stroke-width="4.3" stroke-linecap="round" /><line x1="452.8287" y1="327.2264" x2="438.3278" y2="333.9883" stroke="#586574" stroke-width="1.8" stroke-linecap="round" /><line x1="438.3278" y1="333.9883" x2="445.0897" y2="348.4892" stroke="#586574" stroke-width="1.8" stroke-linecap="round" /><path d="M 403.2643 220.9351 A 42 42 0 0 1 463.0142 259.0000" stroke="#aa5411" stroke-width="2.25" fill="none" /><text x="483.3863" y="240.0589" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#aa5411" text-anchor="middle">115°</text><circle cx="361.0" cy="130.29908634922037" r="4.9" fill="#28364b" /><text x="361.0000" y="113.2991" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill