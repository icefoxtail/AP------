<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 560" width="600" height="560" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">n≥5의 대표 사례 n=5로, C=(5,5), P=(4,6)은 중심 C 반지름 √2인 원 위의 점이다. O 중심 반지름 √2인 원에 P에서 접선을 그어 A에 닿게 하고 OA⊥AP를 표시한다. P는 최대·최소를 만드는 특수점이 아닌 예시이며 f(n)이나 합의 정답은 표시하지 않는다.</title><desc id="visual-desc">원점 O의 작은 원과 오른쪽 위 C(5,5)의 같은 크기 원, 두 번째 원의 일반점 P에서 첫째 원에 그은 접선 AP, 접점 A의 직각 표시가 있다.</desc><rect width="600" height="560" fill="#fff"/><g data-layer="30"><line id="sOA" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="163.450792834" y1="416.549207166" x2="234.876531967" y2="445.959805633"/></g><g data-layer="30"><line id="sAP" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="234.876531967" y1="445.959805633" x2="381.9295243" y2="88.831109968"/></g><g data-layer="30"><line id="sOP" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="163.450792834" y1="416.549207166" x2="381.9295243" y2="88.831109968"/></g><g data-layer="30"><line id="sCP" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="436.549207166" y1="143.450792834" x2="381.9295243" y2="88.831109968"/></g><g data-layer="40"><circle id="k0" data-role="circle" stroke="#111" stroke-width="2.05" fill="none" cx="163.450792834" cy="416.549207166" r="77.243896282"/></g><g data-layer="40"><circle id="k1" data-rol