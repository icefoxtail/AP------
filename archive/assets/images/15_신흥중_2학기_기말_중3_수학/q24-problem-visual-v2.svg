<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 701 489" width="701" height="489" role="img" aria-labelledby="title desc"><title id="title">접선과 할선 사이에 색칠한 삼각형</title><desc id="desc">왼쪽 P에서 가로선이 B에서 원에 접한다. P에서 올라가는 사선은 먼저 A, 그 다음 C를 지난다. PA와 AC는 각각 4 cm이고, 각 BPC는 30도이다. 삼각형 PBA를 색칠했다.</desc><rect width="701" height="489" fill="white" /><circle cx="435.9552937369432" cy="244.5" r="136.61620434648268" fill="#eef6fc" stroke="#205d9c" stroke-width="3.6" /><polygon points="85.0000,381.1162 435.9553,381.1162 299.9153,257.0348" fill="#f7e4ca" /><line x1="85.0000" y1="381.1162" x2="616.0000" y2="381.1162" stroke="#586574" stroke-width="4.1" stroke-linecap="round" /><line x1="85.0000" y1="381.1162" x2="514.8307" y2="132.9533" stroke="#266f73" stroke-width="4.1" stroke-linecap="round" /><line x1="299.9153" y1="257.0348" x2="435.9553" y2="381.1162" stroke="#aa5411" stroke-width="4.1" stroke-linecap="round" /><line x1="435.9553" y1="381.1162" x2="514.8307" y2="132.9533" stroke="#205d9c" stroke-width="4.1" stroke-linecap="round" /><line x1="200.2560" y1="322.6560" x2="193.2560" y2="310.5317" stroke="#266f73" stroke-width="2.5" stroke-linecap="round" /><line x1="70.5000" y1="356.0015" x2="285.4153" y2="231.9200" stroke="#266f73" stroke-width="1.7" stroke-linecap="round" /><line x1="67.7500" y1="351.2383" x2="73.2500" y2="360.7646" stroke="#266f73" stroke-width="1.7" stroke-linecap="round" /><line x1="282.6653" y1="227.1569" x2="288.1653" y2="236.6832" stroke="#266f73" stroke-width="1.7" stroke-linecap="round" /><text x="168.4577" y="285.5063" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#266f73" text-anchor="middle">4 cm</text><line x1="415.1713" y1="198.5746" x2="408.1713" y2="186.4502" stroke="#266f73" stroke-width="2.5" stroke-linecap="round" /><line x1="285.4153" y1="231.9200" x2="500.3307" y2="107.8386" stroke="#266f73" stroke-width="1.7" stroke-linecap="round" /><line x1="282.6653" y1="227.1569" x2="288.1653" y2="236.6832