<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 474" width="720" height="474" role="img" aria-labelledby="title desc"><title id="title">반원에 들어 있는 서로 접한 두 원</title><desc id="desc">가로 지름 위의 가운데 점은 O이다. 반원 안 왼쪽의 원 P와 오른쪽의 작은 원 Q는 서로 접하고, 각각 윗쪽 가로 지름과 아래쪽 큰 원호에 접한다.</desc><rect width="720" height="474" fill="white" /><path d="M 85.000 99.500 A 275.0 275.0 0 0 0 635.000 99.500 Z" fill="none" stroke="#205d9c" stroke-width="4.1" /><circle cx="360.0" cy="237.0" r="137.5" fill="none" stroke="#266f73" stroke-width="3.6" /><circle cx="554.4543648263007" cy="168.25" r="68.75" fill="none" stroke="#aa5411" stroke-width="3.6" /><line x1="360.0000" y1="99.5000" x2="360.0000" y2="237.0000" stroke="#266f73" stroke-width="3" stroke-linecap="round" /><line x1="554.4544" y1="168.2500" x2="554.4544" y2="99.5000" stroke="#aa5411" stroke-width="3" stroke-linecap="round" /><circle cx="360.0" cy="99.5" r="4.9" fill="#28364b" /><text x="357.0000" y="82.5000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">O</text><circle cx="360.0" cy="237.0" r="4.9" fill="#28364b" /><text x="360.0000" y="264.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">P</text><circle cx="554.4543648263007" cy="168.25" r="4.9" fill="#28364b" /><text x="554.4544" y="194.2500" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">Q</text></svg>
