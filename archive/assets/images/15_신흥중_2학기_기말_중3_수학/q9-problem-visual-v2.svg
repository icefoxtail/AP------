<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 639 551" width="639" height="551" role="img" aria-labelledby="title desc"><title id="title">지름과 두 현을 그린 원의 작은 활꼴</title><desc id="desc">가로 지름 AB는 16 cm이다. 원 위의 C를 A와 B에 이었다. 각 CAB는 30도이고 오른쪽의 현 BC와 원호 사이가 색칠되어 있다.</desc><rect width="639" height="551" fill="white" /><circle cx="319.5" cy="275.5" r="198.0" fill="#f2f8fc" stroke="#205d9c" stroke-width="3.6" /><path d="M 418.500 104.027 A 198.0 198.0 0 0 1 517.500 275.500 Z" fill="#f5ddb8" stroke="#aa5411" stroke-width="3.4" /><line x1="121.5000" y1="275.5000" x2="517.5000" y2="275.5000" stroke="#586574" stroke-width="4.1" stroke-linecap="round" /><line x1="121.5000" y1="275.5000" x2="418.5000" y2="104.0270" stroke="#205d9c" stroke-width="4.1" stroke-linecap="round" /><line x1="418.5000" y1="104.0270" x2="517.5000" y2="275.5000" stroke="#aa5411" stroke-width="4.1" stroke-linecap="round" /><path d="M 164.5000 275.5000 A 43 43 0 0 0 158.7391 254.0000" stroke="#704895" stroke-width="2.25" fill="none" /><text x="199.7400" y="262.5357" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#704895" text-anchor="middle">30°</text><line x1="121.5000" y1="311.5000" x2="517.5000" y2="311.5000" stroke="#586574" stroke-width="1.7" stroke-linecap="round" /><line x1="121.5000" y1="306.0000" x2="121.5000" y2="317.0000" stroke="#586574" stroke-width="1.7" stroke-linecap="round" /><line x1="517.5000" y1="306.0000" x2="517.5000" y2="317.0000" stroke="#586574" stroke-width="1.7" stroke-linecap="round" /><text x="319.5000" y="346.5000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#586574" text-anchor="middle">16 cm</text><circle cx="121.5" cy="275.5" r="4.9" fill="#28364b" /><text x="102.5000" y="284.5000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">A</text><circle cx="517.5" cy="275.5" r="4.9" fill="#28364b" /><text x="536.