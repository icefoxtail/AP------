<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 721 543" width="721" height="543" role="img" aria-labelledby="title desc"><title id="title">원 밖의 접선과 두 현으로 만든 각</title><desc id="desc">왼쪽 P에서 그은 가로선이 아래쪽 T에서 원에 접한다. 사선은 P, A, B를 차례로 지난다. 각 APT는 35도, BAT는 80도이고 AT와 BT가 이루는 각은 x이다.</desc><rect width="721" height="543" fill="white" /><circle cx="465.3926763921381" cy="271.5" r="156.6595921401501" fill="none" stroke="#205d9c" stroke-width="3.6" /><polygon points="308.7331,271.5000 518.9734,124.2881 465.3927,428.1596" fill="none" /><line x1="85.0000" y1="428.1596" x2="636.0000" y2="428.1596" stroke="#266f73" stroke-width="4.1" stroke-linecap="round" /><line x1="85.0000" y1="428.1596" x2="518.9734" y2="124.2881" stroke="#205d9c" stroke-width="4.1" stroke-linecap="round" /><line x1="308.7331" y1="271.5000" x2="465.3927" y2="428.1596" stroke="#aa5411" stroke-width="4.1" stroke-linecap="round" /><line x1="465.3927" y1="428.1596" x2="518.9734" y2="124.2881" stroke="#aa5411" stroke-width="4.1" stroke-linecap="round" /><path d="M 123.0000 428.1596 A 38 38 0 0 0 116.1278 406.3637" stroke="#266f73" stroke-width="2.25" fill="none" /><text x="159.7602" y="415.1102" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#266f73" text-anchor="middle">35°</text><path d="M 339.1387 301.9056 A 43 43 0 0 0 343.9566 246.8362" stroke="#704895" stroke-width="2.25" fill="none" /><text x="384.4819" y="278.2523" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#704895" text-anchor="middle">80°</text><path d="M 438.5226 401.2895 A 38 38 0 0 1 471.9913 390.7369" stroke="#aa5411" stroke-width="2.25" fill="none" /><text x="453.3503" y="370.9366" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#aa5411" text-anchor="middle">x</text><circle cx="85.0" cy="428.1595921401501" r="4.9" fill="#28364b" /><text x="66.0000" y="452.1596" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">P</text><circle cx="465.3926763921381" cy="428.1595921401501" r="4.9" fill="#28364b" /><text x="465.3927" y="452.1596" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">T</text><circle cx="308.73308425198803" cy="271.5" r="4.9" fill="#28364b" /><text x="290.7331" y="255.5000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">A</text><circle cx="518.9734125492531" cy="124.28813729057083" r="4.9" fill="#28364b" /><text x="524.9734" y="108.2881" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">B</text></svg>
