<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 695 554" width="695" height="554" role="img" aria-labelledby="title desc"><title id="title">꼭짓점을 중심으로 돌린 두 삼각형</title><desc id="desc">두 삼각형 ABC와 AB′C′는 꼭짓점 A를 공유한다. 왼쪽과 가운데는 B와 C, 오른쪽은 B′과 C′이다. A에서 뻗는 두 변 AB와 AB′ 사이에 40도를 표시했다.</desc><rect width="695" height="554" fill="white" /><polygon points="283.0017,77.5000 183.5198,476.5000 366.2561,333.7308" fill="#e4effa" /><polygon points="283.0017,77.5000 463.2664,447.0974 511.4802,220.2692" fill="#e6f2ea" /><line x1="283.0017" y1="77.5000" x2="183.5198" y2="476.5000" stroke="#205d9c" stroke-width="4.5" stroke-linecap="round" /><line x1="283.0017" y1="77.5000" x2="463.2664" y2="447.0974" stroke="#205d9c" stroke-width="4.5" stroke-linecap="round" /><line x1="283.0017" y1="77.5000" x2="366.2561" y2="333.7308" stroke="#266f73" stroke-width="4.5" stroke-linecap="round" /><line x1="283.0017" y1="77.5000" x2="511.4802" y2="220.2692" stroke="#266f73" stroke-width="4.5" stroke-linecap="round" /><line x1="183.5198" y1="476.5000" x2="366.2561" y2="333.7308" stroke="#704895" stroke-width="4.5" stroke-linecap="round" /><line x1="463.2664" y1="447.0974" x2="511.4802" y2="220.2692" stroke="#704895" stroke-width="4.5" stroke-linecap="round" /><path d="M 270.1798 128.9257 A 53 53 0 0 0 306.2353 125.1361" stroke="#aa5411" stroke-width="2.25" fill="none" /><text x="234.4685" y="188.0563" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#aa5411" text-anchor="middle">40°</text><circle cx="283.0016644551158" cy="77.5" r="4.9" fill="#28364b" /><text x="283.0017" y="58.5000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">A</text><circle cx="183.5197913206867" cy="476.5" r="4.9" fill="#28364b" /><text x="169.5198" y="499.5000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">B</text><circle cx="366.2560