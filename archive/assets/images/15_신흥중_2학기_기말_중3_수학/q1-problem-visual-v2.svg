<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 625 551" width="625" height="551" role="img" aria-labelledby="title desc"><title id="title">단위 사분원과 그 바깥으로 이어진 사선</title><desc id="desc">O를 중심으로 반지름이 1인 사분원에서 사선 OB를 바깥쪽 D까지 이었다. B에서 내린 세로선의 발은 A이다. 가로선 OC와 사선의 각은 x, BA와 BO의 각은 y이다.</desc><rect width="625" height="551" fill="white" /><path d="M 140.381 473.500 L 140.381 129.262 A 344.2375481752258 344.2375481752258 0 0 1 484.619 473.500 Z" fill="none" stroke="#205d9c" stroke-width="4" /><line x1="140.3812" y1="473.5000" x2="484.6188" y2="77.5000" stroke="#aa5411" stroke-width="4.1" stroke-linecap="round" /><line x1="366.2214" y1="473.5000" x2="366.2214" y2="213.7006" stroke="#266f73" stroke-width="4.1" stroke-linecap="round" /><line x1="484.6188" y1="473.5000" x2="484.6188" y2="77.5000" stroke="#266f73" stroke-width="4.1" stroke-linecap="round" /><path d="M 185.3812 473.5000 A 45 45 0 0 0 169.9039 439.5381" stroke="#aa5411" stroke-width="2.25" fill="none" /><text x="201.3486" y="453.7156" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#aa5411" text-anchor="middle">x</text><path d="M 366.2214 252.7006 A 39 39 0 0 1 340.6351 243.1343" stroke="#704895" stroke-width="2.25" fill="none" /><text x="344.5085" y="279.7743" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#704895" text-anchor="middle">y</text><line x1="113.3812" y1="473.5000" x2="113.3812" y2="129.2625" stroke="#205d9c" stroke-width="1.7" stroke-linecap="round" /><line x1="107.8812" y1="473.5000" x2="118.8812" y2="473.5000" stroke="#205d9c" stroke-width="1.7" stroke-linecap="round" /><line x1="107.8812" y1="129.2625" x2="118.8812" y2="129.2625" stroke="#205d9c" stroke-width="1.7" stroke-linecap="round" /><text x="93.3812" y="309.3812" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#205d9c" text-anchor="middle">1</text><circle cx="140.3812259123871" cy="473.5" r="4.9" fill="#28364b" /><text x="124.3812" y="499.5000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">O</text><circle cx="366.2213775102987" cy="473.5" r="4.9" fill="#28364b" /><text x="366.2214" y="503.5000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">A</text><circle cx="366.2213775102987" cy="213.70062451975906" r="4.9" fill="#28364b" /><text x="365.2214" y="193.7006" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">B</text><circle cx="484.6187740876129" cy="473.5" r="4.9" fill="#28364b" /><text x="499.6188" y="501.5000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">C</text><circle cx="484.6187740876129" cy="77.5" r="4.9" fill="#28364b" /><text x="491.6188" y="61.5000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">D</text><circle cx="140.3812259123871" cy="129.2624518247742" r="4.9" fill="#28364b" /><text x="122.3812" y="116.2625" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">E</text></svg>
