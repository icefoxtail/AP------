<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 709 548" width="709" height="548" role="img" aria-labelledby="title desc"><title id="title">삼각형의 내접원과 오른쪽 접선</title><desc id="desc">삼각형 ABC의 세 변 길이는 각각 AB 7 cm, AC 9 cm, BC 10 cm이다. 내접원 O의 접점은 왼쪽 F, 오른쪽 E, 밑변 D이다. 오른쪽 사선 ST도 원에 접하며 S는 AC, T는 BC 위에 있다.</desc><rect width="709" height="548" fill="white" /><polygon points="268.2600,109.0977 85.0000,438.9023 624.0000,438.9023" fill="none" /><circle cx="300.6" cy="312.0543748622132" r="126.84791620737744" fill="none" stroke="#266f73" stroke-width="3.6" /><line x1="85.0000" y1="438.9023" x2="268.2600" y2="109.0977" stroke="#205d9c" stroke-width="4.1" stroke-linecap="round" /><line x1="268.2600" y1="109.0977" x2="624.0000" y2="438.9023" stroke="#205d9c" stroke-width="4.1" stroke-linecap="round" /><line x1="85.0000" y1="438.9023" x2="624.0000" y2="438.9023" stroke="#205d9c" stroke-width="4.1" stroke-linecap="round" /><line x1="387.1027" y1="438.9023" x2="450.2753" y2="277.8431" stroke="#aa5411" stroke-width="4.1" stroke-linecap="round" /><line x1="57.9024" y1="423.8451" x2="241.1624" y2="94.0406" stroke="#205d9c" stroke-width="1.7" stroke-linecap="round" /><line x1="53.0947" y1="421.1737" x2="62.7100" y2="426.5166" stroke="#205d9c" stroke-width="1.7" stroke-linecap="round" /><line x1="236.3547" y1="91.3691" x2="245.9700" y2="96.7120" stroke="#205d9c" stroke-width="1.7" stroke-linecap="round" /><text x="131.1759" y="256.7429" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#205d9c" text-anchor="middle">7 cm</text><line x1="289.3359" y1="86.3644" x2="645.0759" y2="416.1690" stroke="#205d9c" stroke-width="1.7" stroke-linecap="round" /><line x1="293.0752" y1="82.3310" x2="285.5967" y2="90.3977" stroke="#205d9c" stroke-width="1.7" stroke-linecap="round" /><line x1="648.8152" y1="412.1356" x2="641.3367" y2="420.2023" stroke="#205d9c" stroke-width="1.7" stroke-linecap="round" /><text x="481.4832" y="243.8667" font-size="28" font-family