<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 619 551" width="619" height="551" role="img" aria-labelledby="title desc"><title id="title">교차하는 현과 두 각</title><desc id="desc">원의 A와 C를 연결한 현이 가로선 BD와 E에서 만난다. 위쪽 A와 오른쪽 D, 왼쪽 B와 아래쪽 C도 연결했다. 각 AEB는 60도, ADB는 40도이다.</desc><rect width="619" height="551" fill="white" /><circle cx="309.5" cy="275.5" r="198.0" fill="none" stroke="#205d9c" stroke-width="3.6" /><line x1="275.1177" y1="80.5081" x2="507.5000" y2="275.5000" stroke="#205d9c" stroke-width="4.1" stroke-linecap="round" /><line x1="111.5000" y1="275.5000" x2="461.1768" y2="402.7719" stroke="#205d9c" stroke-width="4.1" stroke-linecap="round" /><line x1="111.5000" y1="275.5000" x2="507.5000" y2="275.5000" stroke="#266f73" stroke-width="4.1" stroke-linecap="round" /><line x1="275.1177" y1="80.5081" x2="461.1768" y2="402.7719" stroke="#aa5411" stroke-width="4.1" stroke-linecap="round" /><path d="M 367.6963 240.8590 A 40 40 0 0 0 347.6963 275.5000" stroke="#aa5411" stroke-width="2.25" fill="none" /><text x="333.1367" y="252.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#aa5411" text-anchor="middle">60°</text><path d="M 476.8582 249.7885 A 40 40 0 0 0 467.5000 275.5000" stroke="#704895" stroke-width="2.25" fill="none" /><text x="446.4200" y="261.2687" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#704895" text-anchor="middle">40°</text><circle cx="275.1176608219478" cy="80.5080649035828" r="4.9" fill="#28364b" /><text x="267.1177" y="64.5081" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">A</text><circle cx="111.5" cy="275.5" r="4.9" fill="#28364b" /><text x="94.5000" y="281.5000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">B</text><circle cx="461.17679973755764" cy="402.77194671793484" r="4.9" fill="#28364b" /><text x="476.1768" y="424.7719" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">C</text><circle cx="507.5" cy="275.5" r="4.9" fill="#28364b" /><text x="525.5000" y="283.5000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">D</text><circle cx="387.6963070396702" cy="275.49999999999994" r="4.9" fill="#28364b" /><text x="387.6963" y="304.5000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">E</text></svg>
