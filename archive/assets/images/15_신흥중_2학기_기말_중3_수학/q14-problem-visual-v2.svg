<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 672 547" width="672" height="547" role="img" aria-labelledby="title desc"><title id="title">원 바깥의 점에서 그은 접선과 색칠한 삼각형</title><desc id="desc">원 밖 P에서 A로 그은 선은 원에 접한다. PA는 3 cm이다. P와 중심 O를 연결한 선이 원에 들어가는 곳이 B이고 PB는 1 cm이다. 세 점 A, P, O의 삼각형을 칠했다.</desc><rect width="672" height="547" fill="white" /><circle cx="360.5" cy="273.5" r="196.0" fill="none" stroke="#205d9c" stroke-width="3.6" /><polygon points="203.7000,155.9000 115.5000,273.5000 360.5000,273.5000" fill="none" /><line x1="115.5000" y1="273.5000" x2="203.7000" y2="155.9000" stroke="#aa5411" stroke-width="4.1" stroke-linecap="round" /><line x1="203.7000" y1="155.9000" x2="360.5000" y2="273.5000" stroke="#205d9c" stroke-width="4.1" stroke-linecap="round" /><line x1="115.5000" y1="273.5000" x2="360.5000" y2="273.5000" stroke="#266f73" stroke-width="4.1" stroke-linecap="round" /><line x1="85.1000" y1="250.7000" x2="173.3000" y2="133.1000" stroke="#aa5411" stroke-width="1.7" stroke-linecap="round" /><line x1="80.7000" y1="247.4000" x2="89.5000" y2="254.0000" stroke="#aa5411" stroke-width="1.7" stroke-linecap="round" /><line x1="168.9000" y1="129.8000" x2="177.7000" y2="136.4000" stroke="#aa5411" stroke-width="1.7" stroke-linecap="round" /><text x="110.8000" y="186.1000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#aa5411" text-anchor="middle">3 cm</text><line x1="115.5000" y1="316.5000" x2="164.5000" y2="316.5000" stroke="#266f73" stroke-width="1.7" stroke-linecap="round" /><line x1="115.5000" y1="311.0000" x2="115.5000" y2="322.0000" stroke="#266f73" stroke-width="1.7" stroke-linecap="round" /><line x1="164.5000" y1="311.0000" x2="164.5000" y2="322.0000" stroke="#266f73" stroke-width="1.7" stroke-linecap="round" /><text x="128.0000" y="347.5000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#266f73" text-anchor="middle">1 cm</text><circle cx="115.5" cy="273.5" r="4.9" fill="#28364b" /><text x="100.5000" y="283.5000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">P</text><circle cx="203.7" cy="155.9" r="4.9" fill="#28364b" /><text x="213.7000" y="145.9000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">A</text><circle cx="164.5" cy="273.5" r="4.9" fill="#28364b" /><text x="170.5000" y="299.5000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">B</text><circle cx="360.5" cy="273.5" r="4.9" fill="#28364b" /><text x="372.5000" y="296.5000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">O</text></svg>
