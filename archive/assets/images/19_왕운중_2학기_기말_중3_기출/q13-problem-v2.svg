<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 505" width="560" height="505" role="img" aria-labelledby="title desc"><title id="title">지름 아래의 두 같은 호와 원주각</title><desc id="desc">AB가 원의 지름이다. 아래쪽에서 호 AC와 호 CD는 같은 녹색 표시이다. B의 각은 25도이고 C에서 x를 표시했다.</desc><rect width="560" height="505" fill="white" /><circle cx="280.0" cy="252.5" r="175.0" fill="none" stroke="#205d9c" stroke-width="3.6" /><line x1="105.0000" y1="252.5000" x2="455.0000" y2="252.5000" stroke="#586574" stroke-width="3.7" stroke-linecap="round" /><line x1="455.0000" y1="252.5000" x2="167.5122" y2="386.5578" stroke="#205d9c" stroke-width="3.7" stroke-linecap="round" /><line x1="167.5122" y1="386.5578" x2="310.3884" y2="424.8414" stroke="#586574" stroke-width="3.7" stroke-linecap="round" /><line x1="310.3884" y1="424.8414" x2="455.0000" y2="252.5000" stroke="#aa5411" stroke-width="3.7" stroke-linecap="round" /><path d="M 105.000 252.500 A 175.0000 175.0000 0 0 0 167.512 386.558" fill="none" stroke="#277339" stroke-width="5.7" stroke-linecap="round" /><path d="M 167.512 386.558 A 175.0000 175.0000 0 0 0 310.388 424.841" fill="none" stroke="#277339" stroke-width="5.7" stroke-linecap="round" /><path d="M 388.0000 252.5000 A 67 67 0 0 0 394.2774 280.8154" stroke="#277339" stroke-width="2.25" fill="none" /><text x="336.6548" y="280.7412" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#277339" text-anchor="middle">25°</text><path d="M 203.7645 369.6530 A 40 40 0 0 1 206.1492 396.9105" stroke="#aa5411" stroke-width="2.25" fill="none" /><text x="238.2572" y="388.7183" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#aa5411" text-anchor="middle">x</text><circle cx="105.0" cy="252.49999999999997" r="4.9" fill="#28364b" /><text x="88.0000" y="261.5000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">A</text><circle cx="455.0" cy="252.5" r="4.9" fil