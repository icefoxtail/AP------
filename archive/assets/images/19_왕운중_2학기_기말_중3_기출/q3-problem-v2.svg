<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 712 362" width="712" height="362" role="img" aria-labelledby="title desc"><title id="title">같은 높이를 공유하는 15도와 30도의 직각삼각형</title><desc id="desc">B, C, D는 같은 밑변 위에 왼쪽부터 놓이고 A는 D 바로 위이다. B에 15도, C에 30도를 표시했다.</desc><rect width="712" height="362" fill="white" /><polygon points="85.0000,253.6142 627.0000,108.3858 627.0000,253.6142" fill="none" /><line x1="85.0000" y1="253.6142" x2="627.0000" y2="108.3858" stroke="#205d9c" stroke-width="3.7" stroke-linecap="round" /><line x1="375.4569" y1="253.6142" x2="627.0000" y2="108.3858" stroke="#aa5411" stroke-width="3.7" stroke-linecap="round" /><line x1="85.0000" y1="253.6142" x2="627.0000" y2="253.6142" stroke="#28364b" stroke-width="3.7" stroke-linecap="round" /><line x1="627.0000" y1="253.6142" x2="627.0000" y2="108.3858" stroke="#277339" stroke-width="3.7" stroke-linecap="round" /><line x1="611.0000" y1="253.6142" x2="611.0000" y2="237.6142" stroke="#586574" stroke-width="1.8" stroke-linecap="round" /><line x1="611.0000" y1="237.6142" x2="627.0000" y2="237.6142" stroke="#586574" stroke-width="1.8" stroke-linecap="round" /><path d="M 146.0000 253.6142 A 61 61 0 0 0 143.9215 237.8263" stroke="#205d9c" stroke-width="2.25" fill="none" /><text x="180.2300" y="220.8669" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#205d9c" text-anchor="middle">15°</text><path d="M 410.4569 253.6142 A 35 35 0 0 0 405.7678 236.1142" stroke="#aa5411" stroke-width="2.25" fill="none" /><text x="450.3103" y="247.3086" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#aa5411" text-anchor="middle">30°</text><circle cx="627.0" cy="108.38576885116575" r="4.9" fill="#28364b" /><text x="638.0000" y="93.3858" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">A</text><circle cx="85.0" cy="253.61423114883425" r="4.9" fill="#28364b" /><text x="70.0000