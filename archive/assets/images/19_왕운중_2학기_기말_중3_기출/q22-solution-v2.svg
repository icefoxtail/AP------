<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 695 480" width="695" height="480" role="img" aria-labelledby="title desc"><title id="title">한 점에서 외접원으로 이어지는 두 할선</title><desc id="desc">A에서 P까지와 P부터 Q까지의 길이비를 위쪽 할선에서 비교한다. 아래쪽 할선의 B, C, Q는 한 직선이다.</desc><rect width="695" height="480" fill="white" /><circle cx="244.60095100559965" cy="240.0" r="159.60095100559968" fill="none" stroke="#205d9c" stroke-width="3.6" /><polygon points="244.6010,80.3990 91.3840,195.3117 397.8179,195.3117" fill="none" /><line x1="91.3840" y1="195.3117" x2="397.8179" y2="195.3117" stroke="#205d9c" stroke-width="3.8" stroke-linecap="round" /><line x1="397.8179" y1="195.3117" x2="610.0000" y2="195.3117" stroke="#205d9c" stroke-width="3.8" stroke-linecap="round" /><line x1="244.6010" y1="80.3990" x2="335.9507" y2="109.1272" stroke="#aa5411" stroke-width="4.3" stroke-linecap="round" /><line x1="335.9507" y1="109.1272" x2="610.0000" y2="195.3117" stroke="#aa5411" stroke-width="3.55" stroke-linecap="round" /><line x1="244.6010" y1="80.3990" x2="91.3840" y2="195.3117" stroke="#266f73" stroke-width="3.4" stroke-linecap="round" /><line x1="140.8100" y1="149.4923" x2="149.2100" y2="160.6923" stroke="#266f73" stroke-width="2.5" stroke-linecap="round" /><line x1="244.6010" y1="80.3990" x2="397.8179" y2="195.3117" stroke="#266f73" stroke-width="3.4" stroke-linecap="round" /><line x1="339.9919" y1="160.6923" x2="348.3919" y2="149.4923" stroke="#266f73" stroke-width="2.5" stroke-linecap="round" /><text x="148.0000" y="46.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#266f73" text-anchor="middle">AB = AC = 5</text><line x1="91.3840" y1="221.3117" x2="397.8179" y2="221.3117" stroke="#205d9c" stroke-width="1.7" stroke-linecap="round" /><line x1="91.3840" y1="215.8117" x2="91.3840" y2="226.8117" stroke="#205d9c" stroke-width="1.7" stroke-linecap="round" /><line x1="397.8179" y1="215.8117" x2="397.8179" y2="226.8117" stroke="#205d9c" stroke-width="1.7" str