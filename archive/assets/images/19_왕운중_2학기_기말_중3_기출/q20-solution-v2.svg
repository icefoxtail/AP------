<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 520" width="620" height="520" role="img" aria-labelledby="title desc"><title id="title">교차하는 현의 대응하는 두 부분</title><desc id="desc">P 양쪽 파랑 구간을 곱한 값은 주황 구간의 곱과 같다. 주황 현의 두 부분 비는 2 대 5이다.</desc><rect width="620" height="520" fill="white" /><circle cx="310.0" cy="274.0" r="182.5" fill="none" stroke="#205d9c" stroke-width="3.6" /><line x1="191.3910" y1="135.2983" x2="479.8420" y2="207.2173" stroke="#205d9c" stroke-width="4.3" stroke-linecap="round" /><line x1="370.3101" y1="101.7532" x2="132.3927" y2="315.9750" stroke="#aa5411" stroke-width="4.3" stroke-linecap="round" /><line x1="246.8623" y1="149.1289" x2="212.0000" y2="81.0000" stroke="#205d9c" stroke-width="1.45" stroke-linecap="round" /><text x="204.0000" y="69.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#205d9c" text-anchor="middle">AP = 5 cm</text><line x1="391.0879" y1="185.0884" x2="487.0000" y2="86.0000" stroke="#205d9c" stroke-width="1.45" stroke-linecap="round" /><text x="493.0000" y="73.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#205d9c" text-anchor="middle">PB = 8 cm</text><text x="374.0000" y="313.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#aa5411" text-anchor="middle">CP : DP = 2 : 5</text><circle cx="191.3909795731185" cy="135.29834076920494" r="4.9" fill="#28364b" /><text x="168.3910" y="125.2983" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">A</text><circle cx="479.84203379734777" cy="207.21726603694202" r="4.9" fill="#28364b" /><text x="496.8420" y="219.2173" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">B</text><circle cx="370.31008465799954" cy="101.75324766909267" r="4.9" fill="#28364b" /><text x="376.3101" y="84.7532" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">C</text><circle cx="132.39271293199374" cy="315.9750113799009" r="4.9" fill="#28364b" /><text x="119.3927" y="341.9750" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">D</text><circle cx="302.3336927362836" cy="162.95946587218071" r="4.9" fill="#28364b" /><text x="302.3337" y="195.9595" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">P</text></svg>
