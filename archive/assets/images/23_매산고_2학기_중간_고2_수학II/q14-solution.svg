<svg xmlns="http://www.w3.org/2000/svg" width="640" height="450" viewBox="0 0 640 450" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc">
  <title id="title">23 매산고 14번 포물선과 평행 접선 해설</title>
  <desc id="desc">y=x²에 평행한 접점 P와 직선 OP와 주어진 직선의 교점 Q 사이 거리를 계산한다</desc>
  <style>.background{fill:#fff}.axis{stroke:#171717;stroke-width:1.4;fill:none;stroke-linecap:round;stroke-linejoin:round}.curve{stroke:#111;stroke-width:2.1;fill:none;stroke-linecap:round;stroke-linejoin:round}.line{stroke:#356a9a;stroke-width:1.9;fill:none;stroke-linecap:round}.tangent{stroke:#b23a48;stroke-width:1.9;fill:none;stroke-linecap:round}.guide{stroke:#777;stroke-width:.95;stroke-dasharray:4 4;fill:none}.point{stroke:#111;stroke-width:1;fill:#111}.panel{fill:#f7f8fa;stroke:#c7cbd1;stroke-width:1}.title{font-family:"Noto Sans KR","Pretendard","Malgun Gothic",sans-serif;font-size:15px;font-weight:700;fill:#111}.label{font-family:"Noto Sans KR","Pretendard","Malgun Gothic",sans-serif;font-size:12px;fill:#222}.small{font-family:"Noto Sans KR","Pretendard","Malgun Gothic",sans-serif;font-size:11px;fill:#333}.math{font-family:"STIX Two Math","Cambria Math","Times New Roman",serif;font-size:13px;fill:#111}</style>
  <defs><marker id="axis-arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L6,3 L0,6 Z" fill="#171717"/></marker></defs>
  <rect class="background" x="0" y="0" width="640" height="450"/><text class="title" x="32" y="28">q14  포물선과 평행 접선</text><text class="small" x="32" y="47">직선 y=4tx−1에 평행한 포물선의 접점 P를 구한 뒤 Q와의 거리를 본다.</text>
  <g aria-label="geometry"><rect class="panel" x="32" y="65" width="342" height="296" rx="8"/><line class="axis" x1="52" y1="286" x2="352" y2="286" marker-end="url(#axis-arrow)"/><line class="axis" x1="174" y1="326" x2="174" y2="82" marker-end="url(#axis-arrow)"/><path class="curve" d="M76 94 C116 126 142 190 174 222 C206 190 232 126 272 94"/><path class="line" d="M54 268 L350 118"/><path class="tangent" d="M68 300 L350 158"/><line class="guide" x1="222" y1="198" x2="222" y2="286"/><circle class="point" cx="222" cy="198" r="4"/><circle class="point" cx="174" cy="286" r="4"/><circle class="point" cx="292" cy="168" r="4"/><text class="label" x="228" y="194">P=(2t,4t²)</text><text class="label" x="164" y="304">O</text><text class="label" x="298" y="164">Q</text><text class="math" x="354" y="291">x</text><text class="math" x="180" y="88">y</text></g>
  <g aria-label="calculation"><rect class="panel" x="392" y="65" width="216" height="296" rx="8"/><text class="title" x="410" y="92">거리 계산</text><text class="math" x="410" y="132">P=(2t,4t²)</text><text class="math" x="410" y="168">OP: y=2tx</text><text class="math" x="410" y="204">Q=(1/(2t),1)</text><text class="math" x="410" y="240">PQ=(1−4t²)√(1+4t²)/(2t)</text><text class="math" x="410" y="276">lim =4√2</text><text class="label" x="410" y="326">정답: ③</text></g>
  <rect class="panel" x="32" y="382" width="576" height="38" rx="7"/><text class="small" x="50" y="406">P에서의 접선과 y=4tx−1은 평행하고, OP와의 교점이 Q이다.</text>
</svg>
