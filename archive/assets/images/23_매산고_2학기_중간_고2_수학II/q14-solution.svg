  <g aria-label="calculation"><rect class="panel" x="392" y="65" width="216" height="296" rx="8"/><text class="title" x="410.000" y="92.000">계산</text><text class="math" x="410.000" y="132.000">P=(2t,4t²)</text><text class="math" x="410.000" y="166.000">OP: y=2tx</text><text class="math" x="410.000" y="200.000">Q=(1/(2t),1)</text><text class="math" x="410.000" y="234.000">PQ=(1−4t²)√(1+4t²)/(2t)</text><text class="math" x="410.000" y="268.000">lim =4√2</text><text class="label" x="410.000" y="302.000">정답: ③</text></g>
  <rect class="panel" x="32" y="382" width="576" height="38" rx="7"/><text class="small" x="50.000" y="406.000">대표값 t=0.4에서도 P의 접선과 주어진 직선은 평행하고, OP는 Q에서 교차한다.</text>
