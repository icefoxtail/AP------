<svg xmlns="http://www.w3.org/2000/svg" width="640" height="450" viewBox="0 0 640 450" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc">
  <title id="title">23 매산고 13번 수직인 접선의 접점 해설</title>
  <desc id="desc">원점을 지나는 음의 기울기 접선과 기울기 1인 두 수직 접선의 접점을 구한다</desc>
  <style>.background{fill:#fff}.axis{stroke:#171717;stroke-width:1.4;fill:none;stroke-linecap:round;stroke-linejoin:round}.curve{stroke:#111;stroke-width:2.1;fill:none;stroke-linecap:round;stroke-linejoin:round}.tangent{stroke:#b23a48;stroke-width:1.9;fill:none;stroke-linecap:round}.perp{stroke:#356a9a;stroke-width:1.9;fill:none;stroke-linecap:round}.guide{stroke:#777;stroke-width:.95;stroke-dasharray:4 4;fill:none}.point{stroke:#111;stroke-width:1;fill:#111}.panel{fill:#f7f8fa;stroke:#c7cbd1;stroke-width:1}.title{font-family:"Noto Sans KR","Pretendard","Malgun Gothic",sans-serif;font-size:15px;font-weight:700;fill:#111}.label{font-family:"Noto Sans KR","Pretendard","Malgun Gothic",sans-serif;font-size:12px;fill:#222}.small{font-family:"Noto Sans KR","Pretendard","Malgun Gothic",sans-serif;font-size:11px;fill:#333}.math{font-family:"STIX Two Math","Cambria Math","Times New Roman",serif;font-size:13px;fill:#111}</style>
  <defs><marker id="axis-arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L6,3 L0,6 Z" fill="#171717"/></marker></defs>
  <rect class="background" x="0" y="0" width="640" height="450"/><text class="title" x="32" y="28">q13  수직인 접선의 접점</text><text class="small" x="32" y="47">원점을 지나는 접선의 음의 기울기를 먼저 고정하고, 수직 접선의 기울기를 대입한다.</text>
  <g aria-label="graph"><rect class="panel" x="32" y="65" width="342" height="296" rx="8"/><line class="axis" x1="52" y1="260" x2="352" y2="260" marker-end="url(#axis-arrow)"/><line class="axis" x1="190" y1="326" x2="190" y2="82" marker-end="url(#axis-arrow)"/><path class="curve" d="M58 316 C90 254 116 164 154 126 C190 90 230 104 262 142 C296 184 326 246 352 310"/><path class="tangent" d="M70 260 L330 332"/><path class="perp" d="M78 300 L184 194"/><path class="perp" d="M214 246 L330 130"/><circle class="point" cx="190" cy="260" r="4"/><circle class="point" cx="130" cy="248" r="4"/><circle class="point" cx="274" cy="186" r="4"/><text class="label" x="196" y="252">l₁, m=−1</text><text class="label" x="112" y="242">a</text><text class="label" x="278" y="180">b</text><text class="math" x="354" y="265">x</text><text class="math" x="196" y="88">y</text></g>
  <g aria-label="calculation"><rect class="panel" x="392" y="65" width="216" height="296" rx="8"/><text class="title" x="410" y="92">기울기 조건</text><text class="math" x="410" y="132">f′(x)=3x²−12x+8</text><text class="math" x="410" y="168">l₁: f′(3)=−1</text><text class="math" x="410" y="204">수직 ⇒ f′(x)=1</text><text class="math" x="410" y="240">3x²−12x+7=0</text><text class="math" x="410" y="276">ab=7/3</text><text class="label" x="410" y="326">정답: ③</text></g>
  <rect class="panel" x="32" y="382" width="576" height="38" rx="7"/><text class="small" x="50" y="406">두 수직 접선의 접점 x좌표는 3x²−12x+7=0의 두 근이다.</text>
</svg>
