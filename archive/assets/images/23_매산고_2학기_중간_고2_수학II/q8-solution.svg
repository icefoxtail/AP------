<svg xmlns="http://www.w3.org/2000/svg" width="640" height="450" viewBox="0 0 640 450" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc" data-fact-hash="sha256:a1f2ebb74d2028acd81c0a59d11f82bbeb516df3291fda296fc5ea33b59226ba" data-visual-provenance="PYTHON_DERIVED_LAYOUT_REVIEWED">
  <title id="title">23 매산고 8번 접선과 현의 기울기 비교 해설</title>
  <desc id="desc">g의 증가·감소와 극대점, 현의 기울기를 그림으로 비교한다</desc>
  <style>.background{fill:#fff}.axis{stroke:#171717;stroke-width:1.4;fill:none;stroke-linecap:round;stroke-linejoin:round}.curve{stroke:#111;stroke-width:2.1;fill:none;stroke-linecap:round;stroke-linejoin:round}.tangent{stroke:#b23a48;stroke-width:2;fill:none;stroke-linecap:round}.normal{stroke:#b23a48;stroke-width:2;fill:none;stroke-linecap:round}.perp{stroke:#356a9a;stroke-width:1.9;fill:none;stroke-linecap:round}.secant{stroke:#356a9a;stroke-width:1.9;fill:none;stroke-linecap:round}.line{stroke:#356a9a;stroke-width:1.9;fill:none;stroke-linecap:round}.line-main{stroke:#356a9a;stroke-width:1.9;fill:none;stroke-linecap:round}.level{stroke:#6b7280;stroke-width:1.2;stroke-dasharray:5 4;fill:none}.guide{stroke:#777;stroke-width:.95;stroke-dasharray:4 4;fill:none}.point{stroke:#111;stroke-width:1;fill:#111}.open{stroke:#111;stroke-width:1.3;fill:#fff}.closed{stroke:#111;stroke-width:1;fill:#111}.panel{fill:#f7f8fa;stroke:#c7cbd1;stroke-width:1}.title{font-family:"Noto Sans KR","Pretendard","Malgun Gothic",sans-serif;font-size:15px;font-weight:700;fill:#111}.label{font-family:"Noto Sans KR","Pretendard","Malgun Gothic",sans-serif;font-size:12px;fill:#222}.small{font-family:"Noto Sans KR","Pretendard","Malgun Gothic",sans-serif;font-size:11px;fill:#333}.math{font-family:"STIX Two Math","Cambria Math","Times New Roman",serif;font-size:13px;fill:#111}</style>
  <defs><marker id="axis-arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L6,3 L0,6 Z" fill="#171717"/></marker><clipPath id="graph-clip"><rect x="32" y="65" width="342" height="296" rx="8"/></clipPath></defs>
  <rect class="background" x="0" y="0" width="640" height="450"/>
  <text class="title" x="32.000" y="28.000">23 매산고 8번 접선과 현의 기울기 비교</text>
  <text class="small" x="32.000" y="47.000">g의 증가·감소와 극대점, 현의 기울기를 그림으로 비교한다</text>
  <g aria-label="graph"><rect class="panel" x="32" y="65" width="342" height="296" rx="8"/><g clip-path="url(#graph-clip)"><line class="axis" x1="52.000" y1="286.000" x2="352.000" y2="286.000" marker-end="url(#axis-arrow)"/><line class="axis" x1="72.000" y1="346.000" x2="72.000" y2="82.000" marker-end="url(#axis-arrow)"/><polyline class="curve" points="70.000,286.000 100.000,286.000 130.000,235.000 170.000,165.000 200.000,150.000 230.000,160.000 250.000,196.000 300.000,286.000 330.000,310.000 352.000,315.000"/><line class="tangent" x1="82.000" y1="286.000" x2="140.000" y2="235.000"/><line class="tangent" x1="225.000" y1="150.000" x2="275.000" y2="150.000"/><line class="secant" x1="100.000" y1="286.000" x2="300.000" y2="286.000"/><circle class="point" cx="100.000" cy="286.000" r="4.00"/><circle class="point" cx="200.000" cy="150.000" r="4.00"/><circle class="point" cx="250.000" cy="196.000" r="4.00"/><circle class="point" cx="300.000" cy="286.000" r="4.00"/><text class="label" x="90.000" y="306.000">a</text><text class="label" x="194.000" y="140.000">c</text><text class="label" x="244.000" y="188.000">b</text><text class="label" x="294.000" y="306.000">d</text><text class="small" x="52.000" y="344.000">g(a)=g(d)=0,  g(b)=k</text><text class="math" x="354.000" y="291.000">x</text><text class="math" x="78.000" y="88.000">y</text></g></g>
  <g aria-label="calculation"><rect class="panel" x="392" y="65" width="216" height="296" rx="8"/><text class="title" x="410.000" y="92.000">계산</text><text class="math" x="410.000" y="132.000">g′(a)&gt;0</text><text class="math" x="410.000" y="166.000">g′(c)=0</text><text class="math" x="410.000" y="200.000">ㄱ: g′(a)&lt;g′(c)</text><text class="math" x="410.000" y="234.000">거짓</text><text class="math" x="410.000" y="268.000">g(d)−g(c)&lt;0</text><text class="math" x="410.000" y="302.000">ㄴ 참 · ㄷ 거짓</text><text class="label" x="410.000" y="336.000">정답: ②</text></g>
  <rect class="panel" x="32" y="382" width="576" height="38" rx="7"/><text class="small" x="50.000" y="406.000">a와 d를 x축 위에 두고, c의 극대와 d에서의 감소를 함께 표시한다.</text>
</svg>
