<svg xmlns="http://www.w3.org/2000/svg" width="640" height="450" viewBox="0 0 640 450" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc">
  <title id="title">23 매산고 8번 그래프의 기울기 비교 해설</title>
  <desc id="desc">g의 증가·감소와 극대점, 현의 기울기를 그림으로 비교한다</desc>
  <style>.background{fill:#fff}.axis{stroke:#171717;stroke-width:1.4;fill:none;stroke-linecap:round;stroke-linejoin:round}.curve{stroke:#111;stroke-width:2.1;fill:none;stroke-linecap:round;stroke-linejoin:round}.tangent{stroke:#b23a48;stroke-width:1.9;fill:none;stroke-linecap:round}.secant{stroke:#356a9a;stroke-width:1.7;fill:none;stroke-linecap:round}.guide{stroke:#777;stroke-width:.95;stroke-dasharray:4 4;fill:none}.point{stroke:#111;stroke-width:1;fill:#111}.panel{fill:#f7f8fa;stroke:#c7cbd1;stroke-width:1}.title{font-family:"Noto Sans KR","Pretendard","Malgun Gothic",sans-serif;font-size:15px;font-weight:700;fill:#111}.label{font-family:"Noto Sans KR","Pretendard","Malgun Gothic",sans-serif;font-size:12px;fill:#222}.small{font-family:"Noto Sans KR","Pretendard","Malgun Gothic",sans-serif;font-size:11px;fill:#333}.math{font-family:"STIX Two Math","Cambria Math","Times New Roman",serif;font-size:13px;fill:#111}</style>
  <defs><marker id="axis-arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L6,3 L0,6 Z" fill="#171717"/></marker></defs>
  <rect class="background" x="0" y="0" width="640" height="450"/><text class="title" x="32" y="28">q8  접선과 현의 기울기 비교</text><text class="small" x="32" y="47">a, c, d의 접선 기울기와 a·d 사이 평균변화율의 부호를 시각화한다.</text>
  <g aria-label="graph"><rect class="panel" x="32" y="65" width="342" height="296" rx="8"/><line class="axis" x1="52" y1="286" x2="352" y2="286" marker-end="url(#axis-arrow)"/><line class="axis" x1="72" y1="326" x2="72" y2="82" marker-end="url(#axis-arrow)"/><path class="curve" d="M54 270 C96 250 112 170 150 142 C190 112 214 148 236 162 C270 184 290 196 314 212 C332 224 344 226 354 226"/><path class="tangent" d="M88 250 L150 205"/><path class="tangent" d="M224 164 L276 142"/><path class="secant" d="M88 250 L314 212"/><circle class="point" cx="88" cy="250" r="4"/><circle class="point" cx="150" cy="142" r="4"/><circle class="point" cx="314" cy="212" r="4"/><circle class="point" cx="236" cy="162" r="4"/><text class="label" x="78" y="268">a</text><text class="label" x="144" y="132">c</text><text class="label" x="308" y="230">d</text><text class="label" x="236" y="154">b</text><text class="math" x="354" y="291">x</text><text class="math" x="78" y="88">y</text><text class="small" x="52" y="344">g(a)=g(d)=0, g(b)=k</text></g>
  <g aria-label="decision"><rect class="panel" x="392" y="65" width="216" height="296" rx="8"/><text class="title" x="410" y="92">판정</text><text class="math" x="410" y="132">g′(a)&gt;0</text><text class="math" x="410" y="168">g′(c)=0</text><text class="label" x="410" y="198">ㄱ: g′(a)&lt;g′(c)</text><text class="label" x="410" y="222">거짓</text><line class="guide" x1="410" y1="238" x2="590" y2="238"/><text class="math" x="410" y="274">g(d)−g(c)&lt;0</text><text class="label" x="410" y="304">ㄴ 참 · ㄷ 거짓</text><text class="label" x="410" y="338">정답: ②</text></g>
  <rect class="panel" x="32" y="382" width="576" height="38" rx="7"/><text class="small" x="50" y="406">극대점 c에서는 접선 기울기 0, 감소 구간 d에서는 음의 기울기를 읽는다.</text>
</svg>
