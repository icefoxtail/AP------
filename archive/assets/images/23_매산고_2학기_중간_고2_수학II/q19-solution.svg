<svg xmlns="http://www.w3.org/2000/svg" width="640" height="470" viewBox="0 0 640 470" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc">
  <title id="title">23 매산고 19번 연속 선택 함수와 직선의 교점 해설</title>
  <desc id="desc">연속성을 만족하는 조각함수 g와 y=k(x+1)−1의 교점 수 변화를 비교한다</desc>
  <style>.background{fill:#fff}.axis{stroke:#171717;stroke-width:1.4;fill:none;stroke-linecap:round;stroke-linejoin:round}.curve{stroke:#111;stroke-width:2.1;fill:none;stroke-linecap:round;stroke-linejoin:round}.line{stroke:#b23a48;stroke-width:1.8;fill:none;stroke-linecap:round}.guide{stroke:#777;stroke-width:.95;stroke-dasharray:4 4;fill:none}.point{stroke:#111;stroke-width:1;fill:#111}.panel{fill:#f7f8fa;stroke:#c7cbd1;stroke-width:1}.title{font-family:"Noto Sans KR","Pretendard","Malgun Gothic",sans-serif;font-size:15px;font-weight:700;fill:#111}.label{font-family:"Noto Sans KR","Pretendard","Malgun Gothic",sans-serif;font-size:12px;fill:#222}.small{font-family:"Noto Sans KR","Pretendard","Malgun Gothic",sans-serif;font-size:11px;fill:#333}.math{font-family:"STIX Two Math","Cambria Math","Times New Roman",serif;font-size:13px;fill:#111}</style>
  <rect class="background" x="0" y="0" width="640" height="470"/><text class="title" x="32" y="28">q19  연속 선택 함수와 교점 수</text><text class="small" x="32" y="47">g는 네 구간의 가지를 이어 붙이고, 직선은 항상 (−1,−1)을 지난다.</text>
  <g aria-label="piecewise-graph"><rect class="panel" x="32" y="65" width="342" height="306" rx="8"/><line class="axis" x1="52" y1="254" x2="352" y2="254"/><line class="axis" x1="182" y1="340" x2="182" y2="82"/><path class="curve" d="M54 300 L120 254 L182 254 C206 228 224 188 242 150 C260 188 278 228 300 254 L350 254"/><path class="line" d="M58 312 L340 106"/><line class="guide" x1="120" y1="254" x2="120" y2="272"/><line class="guide" x1="182" y1="254" x2="182" y2="272"/><line class="guide" x1="242" y1="150" x2="242" y2="254"/><circle class="point" cx="120" cy="254" r="4"/><circle class="point" cx="182" cy="254" r="4"/><circle class="point" cx="242" cy="150" r="4"/><text class="label" x="108" y="290">−1</text><text class="label" x="176" y="290">0</text><text class="label" x="238" y="142">x=1</text><text class="math" x="354" y="260">x</text><text class="math" x="188" y="88">y</text><text class="small" x="52" y="338">g=x, −x², x², x</text></g>
  <g aria-label="count-table"><rect class="panel" x="392" y="65" width="216" height="306" rx="8"/><text class="title" x="410" y="92">k별 교점 수</text><text class="math" x="410" y="132">k&lt;k₀: 1개</text><text class="math" x="410" y="168">k=k₀: 2개</text><text class="math" x="410" y="204">k₀&lt;k&lt;1: 3개</text><text class="math" x="410" y="240">1&lt;k&lt;2: 2개</text><text class="math" x="410" y="276">k₀=−2+2√2</text><text class="label" x="410" y="326">최솟값: k₀  정답: −2+2√2</text></g>
  <rect class="panel" x="32" y="392" width="576" height="42" rx="7"/><text class="small" x="50" y="418">0≤x&lt;1에서 x²−kx−k+1의 판별식이 0이 되는 순간이 두 교점의 최소 경계다.</text>
</svg>
