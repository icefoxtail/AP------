<svg xmlns="http://www.w3.org/2000/svg" width="640" height="410" viewBox="0 0 640 410" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc">
  <title id="title">23 매산고 7번 방향극한의 곱 해설</title>
  <desc id="desc">x→1−에서 f(x)와 x−1의 왼쪽 극한을 읽어 곱 −2를 구한다</desc>
  <style>.background{fill:#fff}.axis{stroke:#171717;stroke-width:1.4;fill:none;stroke-linecap:round;stroke-linejoin:round}.curve{stroke:#111;stroke-width:2.1;fill:none;stroke-linecap:round;stroke-linejoin:round}.guide{stroke:#777;stroke-width:.95;stroke-dasharray:4 4;fill:none}.open{stroke:#111;stroke-width:1.4;fill:#fff}.panel{fill:#f7f8fa;stroke:#c7cbd1;stroke-width:1}.title{font-family:"Noto Sans KR","Pretendard","Malgun Gothic",sans-serif;font-size:15px;font-weight:700;fill:#111}.label{font-family:"Noto Sans KR","Pretendard","Malgun Gothic",sans-serif;font-size:12px;fill:#222}.small{font-family:"Noto Sans KR","Pretendard","Malgun Gothic",sans-serif;font-size:11px;fill:#333}.math{font-family:"STIX Two Math","Cambria Math","Times New Roman",serif;font-size:13px;fill:#111}</style>
  <defs><marker id="axis-arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L6,3 L0,6 Z" fill="#171717"/></marker></defs>
  <rect class="background" x="0" y="0" width="640" height="410"/><text class="title" x="32" y="28">q7  방향극한의 곱</text><text class="small" x="32" y="47">x→1−이면 x−1→0−이므로 두 branch의 접근 방향을 따로 읽는다.</text>
  <g aria-label="graph"><rect class="panel" x="32" y="65" width="342" height="264" rx="8"/><line class="axis" x1="52" y1="240" x2="352" y2="240" marker-end="url(#axis-arrow)"/><line class="axis" x1="178" y1="302" x2="178" y2="82" marker-end="url(#axis-arrow)"/><path class="curve" d="M54 140 C90 160 120 192 150 218 L238 270"/><path class="curve" d="M238 270 C270 234 314 170 350 130"/><circle class="open" cx="238" cy="270" r="4.6"/><circle class="open" cx="150" cy="130" r="4.6"/><line class="guide" x1="238" y1="270" x2="238" y2="240"/><line class="guide" x1="150" y1="130" x2="150" y2="240"/><text class="label" x="230" y="262">x=1, y=−1</text><text class="label" x="136" y="122">x=0−, y=2</text><text class="math" x="354" y="245">x</text><text class="math" x="184" y="88">y</text><text class="small" x="52" y="292">lim x→1− f(x)=−1</text><text class="small" x="202" y="312">lim t→0− f(t)=2</text></g>
  <g aria-label="calculation"><rect class="panel" x="392" y="65" width="216" height="264" rx="8"/><text class="title" x="410" y="92">곱 계산</text><text class="math" x="410" y="132">t=x−1</text><text class="math" x="410" y="168">x→1− ⇒ t→0−</text><text class="math" x="410" y="204">f(x)→−1</text><text class="math" x="410" y="240">f(t)→2</text><line class="guide" x1="410" y1="256" x2="590" y2="256"/><text class="label" x="410" y="292">−1×2=−2  (정답: ①)</text></g>
  <rect class="panel" x="32" y="348" width="576" height="38" rx="7"/><text class="small" x="50" y="372">합성된 입력 x−1의 방향을 놓치지 않고 f의 0− branch를 사용한다.</text>
</svg>
