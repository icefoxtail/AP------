<svg xmlns="http://www.w3.org/2000/svg" width="520" height="320" viewBox="0 0 520 320" role="img" aria-label="삼각형 합동을 완성하는 추가 조건">
<rect width="100%" height="100%" fill="white"/>
<g stroke="#222" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round">
<polyline points="70,240 140,80 230,240 70,240"/><polyline points="300,240 370,80 460,240 300,240"/>
<text x="140" y="68" fill="#111" stroke="none" font-size="17" text-anchor="middle" font-family="sans-serif">A</text>
<text x="70" y="263" fill="#111" stroke="none" font-size="17" text-anchor="middle" font-family="sans-serif">B</text>
<text x="230" y="263" fill="#111" stroke="none" font-size="17" text-anchor="middle" font-family="sans-serif">C</text>
<text x="370" y="68" fill="#111" stroke="none" font-size="17" text-anchor="middle" font-family="sans-serif">D</text>
<text x="300" y="263" fill="#111" stroke="none" font-size="17" text-anchor="middle" font-family="sans-serif">E</text>
<text x="460" y="263" fill="#111" stroke="none" font-size="17" text-anchor="middle" font-family="sans-serif">F</text>
<text x="260" y="30" fill="#111" stroke="none" font-size="15" text-anchor="middle" font-family="sans-serif">주어진 조건: BC=EF, ∠C=∠F</text>
<text x="260" y="292" fill="#111" stroke="none" font-size="15" text-anchor="middle" font-family="sans-serif">② AC=DF → SAS  /  ③ ∠A=∠D → 두 각과 한 변</text>
</g></svg>