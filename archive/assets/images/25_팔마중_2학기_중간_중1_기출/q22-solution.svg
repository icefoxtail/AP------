<svg xmlns="http://www.w3.org/2000/svg" width="520" height="340" viewBox="0 0 520 340" role="img" aria-label="두 정삼각형에서 SAS 합동을 만드는 대응 관계">
<rect width="100%" height="100%" fill="white"/>
<g stroke="#222" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round">
<!-- BAD와 ACE를 실제 정삼각형으로 구성 -->
<polyline points="260,135 125,285 62.596,93.087 260,135"/><polyline points="260,135 395,285 457.404,93.087 260,135"/>
<line x1="125" y1="285" x2="457.404" y2="93.087"/><line x1="62.596" y1="93.087" x2="395" y2="285"/>
<circle cx="260" cy="135" r="3.5" fill="#111" stroke="none"/><text x="260" y="123" fill="#111" stroke="none" font-size="17" text-anchor="middle" font-family="sans-serif">A</text>
<circle cx="125" cy="285" r="3.5" fill="#111" stroke="none"/><text x="125" y="309" fill="#111" stroke="none" font-size="17" text-anchor="middle" font-family="sans-serif">B</text>
<circle cx="395" cy="285" r="3.5" fill="#111" stroke="none"/><text x="395" y="309" fill="#111" stroke="none" font-size="17" text-anchor="middle" font-family="sans-serif">C</text>
<circle cx="62.596" cy="93.087" r="3.5" fill="#111" stroke="none"/><text x="62" y="80" fill="#111" stroke="none" font-size="17" text-anchor="middle" font-family="sans-serif">D</text>
<circle cx="457.404" cy="93.087" r="3.5" fill="#111" stroke="none"/><text x="458" y="80" fill="#111" stroke="none" font-size="17" text-anchor="middle" font-family="sans-serif">E</text>
<text x="260" y="35" fill="#111" stroke="none" font-size="15" text-anchor="middle" font-family="sans-serif">AB=AD, AE=AC, ∠BAE=∠DAC</text>
<text x="260" y="330" fill="#111" stroke="none" font-size="17" text-anchor="middle" font-family="sans-serif">△ABE ≡ △ADC (SAS)</text>
</g></svg>