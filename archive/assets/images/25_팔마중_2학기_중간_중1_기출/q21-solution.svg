<circle cx="250" cy="180" r="3.5" fill="#111" stroke="none"/><text x="250" y="204" fill="#111" stroke="none" font-size="17" text-anchor="middle" font-family="sans-serif">O</text>
<circle cx="435" cy="180" r="3.5" fill="#111" stroke="none"/><text x="447" y="204" fill="#111" stroke="none" font-size="17" text-anchor="middle" font-family="sans-serif">D</text>
