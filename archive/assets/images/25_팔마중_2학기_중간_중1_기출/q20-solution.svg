<svg xmlns="http://www.w3.org/2000/svg" width="520" height="330" viewBox="0 0 520 330" role="img" aria-label="정오각형 외각 회전과 평행선으로 x를 구하는 해설도">
<rect width="100%" height="100%" fill="white"/>
<g stroke="#222" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round">
<line x1="45" y1="55" x2="475" y2="55"/><line x1="45" y1="270" x2="475" y2="270"/>
<!-- 아래 변의 방향 19°, 정오각형 외각 72°씩 회전한 정확한 정오각형 -->
<polygon points="250,270 375.6,226.7 373.3,93.8 246.2,55 170,163.9"/>
<circle cx="250" cy="270" r="3.5" fill="#111" stroke="none"/><circle cx="375.6" cy="226.7" r="3.5" fill="#111" stroke="none"/><circle cx="373.3" cy="93.8" r="3.5" fill="#111" stroke="none"/><circle cx="246.2" cy="55" r="3.5" fill="#111" stroke="none"/><circle cx="170" cy="163.9" r="3.5" fill="#111" stroke="none"/>
<text x="303" y="263" fill="#111" stroke="none" font-size="16" text-anchor="middle" font-family="sans-serif">19°</text>
<text x="401" y="163" fill="#111" stroke="none" font-size="15" text-anchor="middle" font-family="sans-serif">+72°</text>
<text x="327" y="74" fill="#111" stroke="none" font-size="15" text-anchor="middle" font-family="sans-serif">+72°</text>
<text x="292" y="76" fill="#111" stroke="none" font-size="17" text-anchor="middle" font-family="sans-serif">x=17°</text>
<text x="260" y="313" fill="#111" stroke="none" font-size="16" text-anchor="middle" font-family="sans-serif">정오각형의 외각 = 72°</text>
</g></svg>