<svg xmlns="http://www.w3.org/2000/svg" width="520" height="320" viewBox="0 0 520 320" role="img" aria-label="직선, 반직선, 선분의 동일성">
<rect width="100%" height="100%" fill="white"/>
<g stroke="#222" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"><line x1="70" y1="160" x2="450" y2="160" /><circle cx="130" cy="160" r="3.5" fill="#111" stroke="none"/><text x="130" y="195" fill="#111" stroke="none" font-size="17" text-anchor="middle" font-family="sans-serif">A</text><circle cx="220" cy="160" r="3.5" fill="#111" stroke="none"/><text x="220" y="195" fill="#111" stroke="none" font-size="17" text-anchor="middle" font-family="sans-serif">B</text><circle cx="310" cy="160" r="3.5" fill="#111" stroke="none"/><text x="310" y="195" fill="#111" stroke="none" font-size="17" text-anchor="middle" font-family="sans-serif">C</text><circle cx="400" cy="160" r="3.5" fill="#111" stroke="none"/><text x="400" y="195" fill="#111" stroke="none" font-size="17" text-anchor="middle" font-family="sans-serif">D</text><text x="260" y="65" fill="#111" stroke="none" font-size="19" text-anchor="middle" font-family="sans-serif">직선 AB = 직선 CD = l</text><text x="260" y="105" fill="#111" stroke="none" font-size="15" text-anchor="middle" font-family="sans-serif">반직선은 시작점과 방향까지 같아야 한다.</text></g>
</svg>