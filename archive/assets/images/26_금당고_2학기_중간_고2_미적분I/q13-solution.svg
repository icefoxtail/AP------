<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" preserveAspectRatio="xMidYMid meet"><title>q13 좌극한 접근 방향 도식</title><desc>두 합성 입력이 각각 0과 1에 왼쪽에서 접근함을 분리해 보여 준다.</desc><rect width="760" height="440" fill="white"/><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#222"/></marker></defs><style>.axis{stroke:#333;stroke-width:1.5}.helper{stroke:#777;stroke-width:1.3}.label{font-family:Arial,sans-serif;font-size:18px;fill:#111}.note{font-family:Arial,sans-serif;font-size:17px;fill:#111;font-weight:600}</style><text class="note" x="55" y="55">입력값이 어느 쪽에서 0, 1로 가까워지는지가 핵심</text><line class="axis" x1="100" y1="190" x2="660" y2="190" marker-end="url(#arrow)"/><line class="helper" x1="300" y1="120" x2="300" y2="260"/><line class="helper" x1="510" y1="120" x2="510" y2="260"/><text class="label" x="300" y="220" text-anchor="middle">0</text><text class="label" x="510" y="220" text-anchor="middle">1</text><line x1="180" y1="150" x2="285" y2="150" stroke="#111" stroke-width="2.2" marker-end="url(#arrow)"/><line x1="390" y1="150" x2="495" y2="150" stroke="#111" stroke-width="2.2" marker-end="url(#arrow)"/><text class="label" x="230" y="132" text-anchor="middle">1/t → 0−</text><text class="label" x="445" y="132" text-anchor="middle">(t−1)/(t+1) → 1−</text><rect x="145" y="290" width="220" height="70" rx="10" fill="#f6f6f6" stroke="#777"/><text class="label" x="255" y="320" text-anchor="middle">x→0− 에서</text><text class="note" x="255" y="347" text-anchor="middle">f(x)→1</text><rect x="400" y="290" width="220" height="70" rx="10" fill="#f6f6f6" stroke="#777"/><text class="label" x="510" y="320" text-anchor="middle">x→1− 에서</text><text class="note" x="510" y="347" text-anchor="middle">f(x)→1</text></svg>