<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" preserveAspectRatio="xMidYMid meet"><title>q10 연속성 해설 도식</title><desc>x=2에서 분자가 x-2를 인수로 가져야 함을 단계별로 보여 준다.</desc><rect width="760" height="440" fill="white"/><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#222"/></marker></defs><style>.label{font-family:Arial,sans-serif;font-size:18px;fill:#111}.note{font-family:Arial,sans-serif;font-size:17px;fill:#111;font-weight:600}</style><text class="note" x="70" y="70">x=2에서 연속하려면 분자도 x=2에서 0</text><rect x="80" y="105" width="600" height="58" rx="10" fill="#f5f5f5" stroke="#777"/><text class="label" x="380" y="141" text-anchor="middle">x² + ax + b = (x−2)(x+a+2)</text><line x1="380" y1="170" x2="380" y2="225" stroke="#444" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="155" y="235" width="450" height="58" rx="10" fill="#fff" stroke="#777"/><text class="label" x="380" y="271" text-anchor="middle">x≠2에서  f(x)=x+a+2</text><line x1="380" y1="300" x2="380" y2="347" stroke="#444" stroke-width="1.8" marker-end="url(#arrow)"/><text class="note" x="380" y="380" text-anchor="middle">연속성과 f(2)=5 → 2+a+2=5 → a=1</text></svg>