<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" preserveAspectRatio="xMidYMid meet"><title>q3 해설 수직선</title><desc>x=3을 제외한 정의역을 수직선으로 나타낸다.</desc><rect width="760" height="440" fill="white"/><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#222"/></marker></defs><style>.axis{stroke:#333;stroke-width:1.5}.curve{fill:none;stroke:#111;stroke-width:2.6}.point{fill:#111}.open{fill:white;stroke:#111;stroke-width:2}.label{font-family:Arial,sans-serif;font-size:18px;fill:#111}.small{font-family:Arial,sans-serif;font-size:15px;fill:#333}.note{font-family:Arial,sans-serif;font-size:17px;fill:#111;font-weight:600}</style><text class="note" x="50" y="52">x=3에서는 분모가 0 → 정의역에서 제외</text><line class="axis" x1="85" y1="225" x2="675" y2="225" marker-end="url(#arrow)"/><circle class="open" cx="380" cy="225" r="8"/><line class="curve" x1="115" y1="225" x2="367" y2="225"/><line class="curve" x1="393" y1="225" x2="650" y2="225"/><text class="label" x="380" y="260" text-anchor="middle">3</text><text class="label" x="220" y="190" text-anchor="middle">(-∞, 3)</text><text class="label" x="540" y="190" text-anchor="middle">(3, ∞)</text><text class="small" x="380" y="305" text-anchor="middle">빈 점은 x=3이 포함되지 않음을 뜻한다.</text></svg>