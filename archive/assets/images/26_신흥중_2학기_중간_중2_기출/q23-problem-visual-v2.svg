<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" width="720" height="440" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">AC=BC인 삼각형 ABC의 외심 O, 삼각형 ABO의 내심 I와 외심 O′를 표시하고 A에서 이 점들로 실선을 잇는다.</title><desc id="visual-desc">밑변 BC가 긴 삼각형 ABC에서 AC와 BC에 같은 길이 눈금이 있다. 외심 O는 삼각형 안의 오른쪽에 있으며 A-O와 B-O가 실선이다. 삼각형 ABO의 내심 I, 외심 O′는 A에서 O로 향하는 두 내부 방향에 있고 A-I, A-O′도 모두 실선이다. 두 질문의 x, y, 12도는 발문으로 제공되며 문제 그림에는 정답을 적지 않는다. 면 채움은 없다.</desc><rect width="720" height="440" fill="#fff"/><g data-layer="30"><line id="sAB" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="90.571428571" y1="138" x2="67.142857143" y2="302"/></g><g data-layer="30"><line id="sBC" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="67.142857143" y1="302" x2="652.857142857" y2="302"/></g><g data-layer="30"><line id="sAC" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="90.571428571" y1="138" x2="652.857142857" y2="302"/></g><g data-layer="30"><line id="sAO" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="90.571428571" y1="138" x2="360" y2="260.163265306"/></g><g data-layer="30"><line id="sBO" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="67.142857143" y1="302" x2="360" y2="260.163265306"/></g><g data-layer="30"><line id="sAI" data-role="line" stroke="#111" stroke-width="1.6" fill="none" 