<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 717 504" width="717" height="504" role="img" aria-labelledby="title desc"><title id="title">두 대각선과 색칠한 삼각형 EBD</title><desc id="desc">마름모 ABCD의 대각선은 O에서 교차한다. O에서 아래 C까지는 12 cm, 오른쪽 D까지는 20 cm이다. 왼쪽 위 변의 E와 B, D가 이루는 삼각형을 칠했다.</desc><rect width="717" height="504" fill="white" /><polygon points="358.5000,87.9000 85.0000,252.0000 358.5000,416.1000 632.0000,252.0000" fill="none" /><polygon points="194.4000,186.3600 85.0000,252.0000 632.0000,252.0000" fill="#f1dfbe" /><line x1="358.5000" y1="87.9000" x2="85.0000" y2="252.0000" stroke="#205d9c" stroke-width="4.5" stroke-linecap="round" /><line x1="85.0000" y1="252.0000" x2="358.5000" y2="416.1000" stroke="#205d9c" stroke-width="4.5" stroke-linecap="round" /><line x1="358.5000" y1="416.1000" x2="632.0000" y2="252.0000" stroke="#205d9c" stroke-width="4.5" stroke-linecap="round" /><line x1="632.0000" y1="252.0000" x2="358.5000" y2="87.9000" stroke="#205d9c" stroke-width="4.5" stroke-linecap="round" /><line x1="358.5000" y1="87.9000" x2="358.5000" y2="416.1000" stroke="#266f73" stroke-width="4" stroke-linecap="round" /><line x1="85.0000" y1="252.0000" x2="632.0000" y2="252.0000" stroke="#704895" stroke-width="4" stroke-linecap="round" /><line x1="194.4000" y1="186.3600" x2="632.0000" y2="252.0000" stroke="#aa5411" stroke-width="4" stroke-linecap="round" /><text x="528.0700" y="277.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#704895" text-anchor="middle">20 cm</text><text x="294.5000" y="355.8190" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#266f73" text-anchor="middle">12 cm</text><circle cx="358.5" cy="87.89999999999998" r="4.9" fill="#28364b" /><text x="358.5000" y="69.9000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">A</text><circle cx="85.0" cy="252.0" r="4.9" fill="#28364b" /><text x="68.0000" y="259.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">B</text><circle cx="358.5" cy="416.1" r="4.9" fill="#28364b" /><text x="358.5000" y="442.1000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">C</text><circle cx="632.0" cy="252.0" r="4.9" fill="#28364b" /><text x="650.0000" y="261.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">D</text><circle cx="358.5" cy="252.0" r="4.9" fill="#28364b" /><text x="376.5000" y="279.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">O</text><circle cx="194.39999999999998" cy="186.35999999999999" r="4.9" fill="#28364b" /><text x="177.4000" y="174.3600" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">E</text></svg>
