<svg xmlns="http://www.w3.org/2000/svg" width="480" height="477" viewBox="0 0 480 477" role="img" aria-labelledby="visual-title visual-desc" data-composite="composite-panels-v1"><title id="visual-title">꼭짓점이 아래인 원뿔 그릇에서 물은 전체 높이의 1/3 지점까지만 차 있다.</title><desc id="visual-desc">위로 넓어지는 원뿔 모양 그릇의 아래쪽에서 전체 높이의 정확히 3분의 1까지 물이 찬 부분만 옅게 표시하고 수면의 타원을 그린다.</desc><g id="p1-caption" data-role="caption" data-panel="1" data-font-px="21.4"><g id="p1-p1-caption-text" transform="translate(154.186 38.5064)" data-label-kind="CAPTION" data-owner="panel-1" data-fragment-sha="sha256:35ca12f4b200cce7255fc910094b8a7be6dc4832ff35ea8cac5d320388f74816"><svg xmlns="http://www.w3.org/2000/svg" width="171.628" height="30.9872" viewBox="0 0 171.628 30.9872" data-outline-width="171.628" data-outline-height="30.9872" id="lb-7799dda4d3c7baa20d1c376830b8aa5526d05fc8a0664bf2487e5f2ccd4beede" data-owner="panel-1" data-fact-role="GIVEN"><path d="M7.08340 20.95060L7.08340 16.69200L7.78960 16.69200L7.78960 20.95060L7.08340 20.95060ZM15.55780 21.80660L15.55780 7.38300L16.26400 7.38300L16.26400 21.80660L15.55780 21.80660ZM4.13020 25.74420L4.13020 25.10220L16.77760 25.10220L16.77760 25.74420L4.13020 25.74420ZM4.13020 25.29480L4.13020 20.35140L4.83640 20.35140L4.83640 25.29480L4.13020 25.29480ZM1.26260 17.16280L1.26260 17.16280L1.13420 16.49940Q2.91040 16.49940 4.99690 16.46730Q7.08340 16.43520 9.26620 16.31750Q11.44900 16.19980 13.48200 15.94300L13.48200 15.94300L13.56760 16.49940Q11.51320 16.82040 9.31970 16.95950Q7.12620 17.09860 5.06110 17.13070Q2.99600 17.16280 1.26260 17.16280ZM11.42760 19.36700L11.42760 18.72500L15.85740 18.72500L15.85740 19.36700L11.42760 19.36700ZM7.34020 8.26040L7.34020 8.26040Q8.73120 8.26040 9.75840 8.65630Q10.78560 9.05220 11.35270 9.76910Q11.91980 10.48600 11.91980 11.47040L11.91980 11.47040Q11.91980 12.45480 11.35270 13.18240Q10.78560 13.91000 9.75840 14.29520Q8.73120 14.68040 7.34020 14.68040L7.34020 14.68040Q5.97060 14.68040 4.93270 14.29520Q3.89480 13.91000 3.32770 13.18240Q