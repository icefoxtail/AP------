<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 543" width="650" height="543" role="img" aria-labelledby="title desc"><title id="title">원뿔 그릇 아래쪽에 채워진 물</title><desc id="desc">입구가 위에 있고 꼭짓점이 아래에 있는 원뿔 그릇이다. 전체 높이의 3분의 1까지 아래쪽에 물을 채웠다. 물의 수면과 원뿔의 입구를 타원으로 보인다.</desc><rect width="650" height="543" fill="white" /><path d="M 160.000 115.000 L 325.000 466.000 L 490.000 115.000 A 165 42 0 0 1 160.000 115.000 Z" stroke="none" fill="none" /><path d="M 270.0 349.0 L 325.000 466.000 L 380.0 349.0 A 55.0 14.0 0 0 1 270.0 349.0 Z" stroke="none" fill="#b8e1d8" /><line x1="160.0000" y1="115.0000" x2="325.0000" y2="466.0000" stroke="#205d9c" stroke-width="4.6" stroke-linecap="round" /><line x1="325.0000" y1="466.0000" x2="490.0000" y2="115.0000" stroke="#205d9c" stroke-width="4.6" stroke-linecap="round" /><ellipse cx="325" cy="115" rx="165" ry="42" fill="none" stroke="#205d9c" stroke-width="4.4" /><ellipse cx="325" cy="349.0" rx="55.0" ry="14.0" fill="none" stroke="#266f73" stroke-width="3.85" /><line x1="270.0000" y1="349.0000" x2="325.0000" y2="466.0000" stroke="#266f73" stroke-width="4.5" stroke-linecap="round" /><line x1="325.0000" y1="466.0000" x2="380.0000" y2="349.0000" stroke="#266f73" stroke-width="4.5" stroke-linecap="round" /></svg>
