<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 683 545" width="683" height="545" role="img" aria-labelledby="title desc"><title id="title">삼각형 안의 내심과 세 꼭짓점</title><desc id="desc">삼각형 ABC의 안에 내심 I가 있다. I를 위쪽 A, 왼쪽 아래 B, 오른쪽 아래 C와 연결했다. I 아래쪽의 두 선 사이 각이 표시되어 있다.</desc><rect width="683" height="545" fill="white" /><polygon points="419.6995,77.5000 194.5329,467.5000 488.4671,467.5000" fill="none" /><line x1="419.6995" y1="77.5000" x2="194.5329" y2="467.5000" stroke="#205d9c" stroke-width="4.6" stroke-linecap="round" /><line x1="194.5329" y1="467.5000" x2="488.4671" y2="467.5000" stroke="#205d9c" stroke-width="4.6" stroke-linecap="round" /><line x1="488.4671" y1="467.5000" x2="419.6995" y2="77.5000" stroke="#205d9c" stroke-width="4.6" stroke-linecap="round" /><line x1="419.6995" y1="77.5000" x2="368.6584" y2="366.9686" stroke="#266f73" stroke-width="4.2" stroke-linecap="round" /><line x1="194.5329" y1="467.5000" x2="368.6584" y2="366.9686" stroke="#266f73" stroke-width="4.2" stroke-linecap="round" /><line x1="488.4671" y1="467.5000" x2="368.6584" y2="366.9686" stroke="#266f73" stroke-width="4.2" stroke-linecap="round" /><path d="M 331.4193 388.4686 A 43 43 0 0 0 401.5983 394.6085" stroke="#aa5411" stroke-width="2.25" fill="none" /><circle cx="419.69954125382645" cy="77.5" r="4.9" fill="#28364b" /><text x="418.6995" y="59.5000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">A</text><circle cx="194.53293626987232" cy="467.5" r="4.9" fill="#28364b" /><text x="178.5329" y="490.5000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">B</text><circle cx="488.4670637301277" cy="467.5" r="4.9" fill="#28364b" /><text x="506.4671" y="489.5000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">C</text><circle cx="368.6584156662338" cy="366.9686075977381" r="4