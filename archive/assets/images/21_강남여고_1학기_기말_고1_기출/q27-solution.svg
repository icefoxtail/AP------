<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">원 위 점과 삼각형 넓이</title><desc id="desc">AB is x plus 2y plus 5 equals zero. Its distance from C(1,2) is 2 square root 5; radius 3 gives area values from 10 minus 3 square root 5 to 10 plus 3 square root 5.</desc><rect width="640" height="360" fill="#fff"/><text x="24" y="30" font-family="sans-serif" font-size="20" font-weight="700" fill="#18334f">원 위 점과 삼각형 넓이</text><g font-family="sans-serif" fill="#203040"><text x="24" y="62" font-size="16">AB: x+2y+5=0, d(C,AB)=2√5</text><text x="24" y="87" font-size="16">넓이 범위: 10−3√5 ~ 10+3√5</text><text x="24" y="112" font-size="14" fill="#d86f4b">넓이 4 경계선</text><text x="24" y="134" font-size="14" fill="#6c58a8">넓이 16 경계선</text><circle cx="400" cy="170" r="84" fill="#eef5fb" stroke="#3478b9" stroke-width="3"/><circle cx="400" cy="170" r="4" fill="#18334f"/><text x="410" y="165" font-size="15">C(1,2)</text><line x1="125" y1="172" x2="485" y2="352" stroke="#667788" stroke-width="3"/><line x1="100" y1="104" x2="500" y2="304" stroke="#d86f4b" stroke-width="2" stroke-dasharray="7 5"/><line x1="100" y1="-63.5" x2="500" y2="136.5" stroke="#6c58a8" stroke-width="2" stroke-dasharray="7 5"/><text x="24" y="336" font-size="15">√5=2.23에서 자연수 넓이는 4~16; 각각 2점 → 26점</text></g></svg>