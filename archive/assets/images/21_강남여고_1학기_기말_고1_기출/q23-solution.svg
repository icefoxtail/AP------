<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title" aria-describedby="desc"><title id="title">정삼각형 현과 원 중심에서 직선까지의 거리</title><desc id="desc">원 중심은 C=(0,4), 반지름은 4이고 정삼각형의 한 변인 현 AB의 길이는 4이다. 중심에서 AB까지의 거리는 2√3이며, 거리식 12/√(m²+1)=2√3에서 m²=11이다.</desc><rect width="640" height="360" fill="#fff"/><text x="24" y="30" font-family="sans-serif" font-size="20" font-weight="700" fill="#18334f">원의 정삼각형 현</text><g font-family="sans-serif" fill="#203040"><circle cx="300" cy="210" r="96" fill="none" stroke="#3478b9" stroke-width="3"/><line x1="300" y1="114" x2="365.7" y2="184.0" stroke="#6c58a8"/><line x1="300" y1="114" x2="393.5" y2="92.0" stroke="#6c58a8"/><line x1="365.7" y1="184.0" x2="393.5" y2="92.0" stroke="#18334f" stroke-width="4"/><text x="305" y="109" font-size="16" fill="#203040">C(0,4)</text><text x="390" y="335" font-size="16" fill="#203040">AB=4; d(C,AB)=2√3</text><text x="22" y="348" font-size="16" fill="#203040">12/√(m²+1)=2√3 ⇒ m²=11</text></g></svg>