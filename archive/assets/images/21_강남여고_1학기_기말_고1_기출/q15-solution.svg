<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">원의 두 축 교차 조건</title><desc id="desc">중심 (2,1), r²=a+2. x축 교차: r≥1. y축 비교차: r&lt;2.</desc><rect width="640" height="360" fill="#fff"/><text x="24" y="32" font-family="sans-serif" font-size="20" font-weight="700" fill="#18334f">원의 두 축 교차 조건</text><g font-family="sans-serif" fill="#203040"><line x1="100" y1="220" x2="500" y2="220" stroke="#667788"/><line x1="180" y1="65" x2="180" y2="320" stroke="#667788"/><circle cx="260" cy="180" r="60" fill="#edf5fc" stroke="#3478b9" stroke-width="3"/><circle cx="260" cy="180" r="4" fill="#18334f"/><line x1="260" y1="180" x2="260" y2="220" stroke="#d86f4b" stroke-width="2"/><line x1="180" y1="180" x2="260" y2="180" stroke="#6c58a8" stroke-width="2"/><text x="272" y="176" font-size="16" fill="#203040" font-weight="400">(2,1)</text><text x="218" y="214" font-size="16" fill="#203040" font-weight="400">1</text><text x="202" y="168" font-size="16" fill="#203040" font-weight="400">2</text><text x="355" y="112" font-size="20" fill="#18334f" font-weight="700">1 ≤ r &lt; 2</text><text x="355" y="145" font-size="20" fill="#18334f" font-weight="700">−1 ≤ a &lt; 2</text></g></svg>