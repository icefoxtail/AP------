<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">단위원의 접점</title><desc id="desc">For n=2 the tangent contact is (1/2,√3/2); the general formula is x_n=1/n.</desc><rect width="640" height="360" fill="#fff"/><text x="24" y="30" font-family="sans-serif" font-size="20" font-weight="700" fill="#18334f">단위원의 접점</text><g font-family="sans-serif" fill="#203040"><line x1="110" y1="220" x2="520" y2="220" stroke="#8895a1"/><line x1="200" y1="65" x2="200" y2="320" stroke="#8895a1"/><circle cx="200" cy="220" r="90" fill="none" stroke="#3478b9" stroke-width="3"/><line x1="200" y1="220" x2="245" y2="142.1" stroke="#6c58a8" stroke-width="2"/><line x1="245" y1="142.1" x2="380" y2="220" stroke="#d86f4b" stroke-width="3"/><circle cx="245" cy="142.1" r="5" fill="#18334f"/><circle cx="380" cy="220" r="5" fill="#18334f"/><text x="206" y="235" font-size="16" fill="#203040">O</text><text x="248" y="135" font-size="16" fill="#203040">P₂</text><text x="382" y="238" font-size="16" fill="#203040">(2,0)</text><text x="308" y="95" font-size="16" fill="#203040">접점 x₂=1/2</text></g></svg>