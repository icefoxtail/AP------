<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">원과 수직인 접선</title><desc id="desc">원 x²+y²=5, 양의 y절편 접선 y=2x+5, 접점 (-2,1).</desc><rect width="640" height="360" fill="#fff"/><text x="24" y="32" font-family="sans-serif" font-size="20" font-weight="700" fill="#18334f">원과 수직인 접선</text><g font-family="sans-serif" fill="#203040"><line x1="200" y1="55" x2="200" y2="300" stroke="#8996a3"/><line x1="55" y1="220" x2="385" y2="220" stroke="#8996a3"/><circle cx="200" cy="220" r="89.44" fill="none" stroke="#3478b9" stroke-width="3"/><line x1="55" y1="310" x2="175" y2="70" stroke="#df724f" stroke-width="3"/><line x1="200" y1="220" x2="120" y2="180" stroke="#6c58a8" stroke-width="2"/><circle cx="120" cy="180" r="5" fill="#18334f"/><text x="207" y="215" font-size="16" fill="#203040" font-weight="400">O</text><text x="92" y="170" font-size="16" fill="#203040" font-weight="400">T(-2,1)</text><text x="215" y="66" font-size="16" fill="#203040" font-weight="400">x²+y²=5</text><text x="215" y="92" font-size="16" fill="#203040" font-weight="400">접선 y=2x+5</text><text x="410" y="180" font-size="17" fill="#6c58a8" font-weight="400">반지름 ⟂ 접선</text></g></svg>