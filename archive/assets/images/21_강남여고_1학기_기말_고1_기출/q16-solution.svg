<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">잘못 읽은 계수 바로잡기</title><desc id="desc">g1 has roots −3 and 8 so b=−24; g2 axis x=−5 implies a=10.</desc><rect width="640" height="360" fill="#fff"/><text x="24" y="30" font-family="sans-serif" font-size="20" font-weight="700" fill="#18334f">잘못 읽은 계수 바로잡기</text><g font-family="sans-serif" fill="#203040"><line x1="45" y1="215" x2="390" y2="215" stroke="#8895a1"/><line x1="180" y1="70" x2="180" y2="315" stroke="#8895a1"/><path d="M 125.0,221.8 L 136.0,228.0 L 147.0,233.5 L 158.0,238.4 L 169.0,242.6 L 180.0,246.2 L 191.0,249.1 L 202.0,251.4 L 213.0,253.0 L 224.0,254.0 L 235.0,254.3 L 246.0,254.0 L 257.0,253.0 L 268.0,251.4 L 279.0,249.1 L 290.0,246.2 L 301.0,242.6 L 312.0,238.4 L 323.0,233.5 L 334.0,228.0 L 345.0,221.8 L 356.0,215.0 L 367.0,207.5 L 378.0,199.4 L 389.0,190.6 L 400.0,181.2" fill="none" stroke="#3478b9" stroke-width="3"/><circle cx="114" cy="215" r="4" fill="#203040"/><circle cx="356" cy="215" r="4" fill="#203040"/><text x="98" y="238" font-size="16" fill="#203040">−3</text><text x="351" y="238" font-size="16" fill="#203040">8</text><text x="56" y="70" font-size="17" fill="#203040">g₁: b=−24</text><line x1="480" y1="90" x2="480" y2="315" stroke="#d86f4b" stroke-dasharray="5 5"/><text x="442" y="80" font-size="16" fill="#203040">g₂ axis x=−5</text><text x="60" y="335" font-size="16" fill="#203040">a=10 → x²+10x−24=(x+12)(x−2)</text></g></svg>