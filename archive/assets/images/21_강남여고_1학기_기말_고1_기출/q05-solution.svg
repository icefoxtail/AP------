<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">두 축에 접하는 원</title><desc id="desc">제4사분면 중심 (3,-3), 반지름 3인 원은 양의 x축과 음의 y축에 접한다.</desc><rect width="640" height="360" fill="#fff"/><text x="24" y="32" font-family="sans-serif" font-size="20" font-weight="700" fill="#18334f">두 축에 접하는 원</text><g font-family="sans-serif" fill="#203040"><line x1="100" y1="100" x2="570" y2="100" stroke="#566879" stroke-width="2"/><line x1="190" y1="55" x2="190" y2="320" stroke="#566879" stroke-width="2"/><circle cx="280" cy="190" r="90" fill="#eaf4fc" stroke="#3478b9" stroke-width="3"/><circle cx="280" cy="190" r="4" fill="#18334f"/><text x="292" y="185" font-size="16" fill="#203040" font-weight="400">C(3,-3)</text><text x="370" y="212" font-size="16" fill="#203040" font-weight="400">r=3</text><text x="112" y="90" font-size="16" fill="#203040" font-weight="400">y축</text><text x="520" y="90" font-size="16" fill="#203040" font-weight="400">x축</text><text x="370" y="255" font-size="18" fill="#18334f" font-weight="700">(x−3)²+(y+3)²=9</text></g></svg>