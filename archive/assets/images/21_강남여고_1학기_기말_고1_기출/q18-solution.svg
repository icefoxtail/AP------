<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">두 원의 대칭축</title><desc id="desc">The axis is the perpendicular bisector of the segment joining centers.</desc><rect width="640" height="360" fill="#fff"/><text x="24" y="30" font-family="sans-serif" font-size="20" font-weight="700" fill="#18334f">두 원의 대칭축</text><g font-family="sans-serif" fill="#203040"><line x1="100" y1="275" x2="560" y2="275" stroke="#9aa5ae"/><line x1="260" y1="55" x2="260" y2="330" stroke="#9aa5ae"/><circle cx="200" cy="245" r="30" fill="none" stroke="#3478b9" stroke-width="3"/><circle cx="320" cy="125" r="30" fill="none" stroke="#3478b9" stroke-width="3"/><line x1="170" y1="95" x2="350" y2="275" stroke="#d86f4b" stroke-width="3" stroke-dasharray="7 5"/><line x1="200" y1="245" x2="320" y2="125" stroke="#6c58a8" stroke-width="2"/><text x="150" y="290" font-size="16" fill="#203040">C₁(−2,1)</text><text x="326" y="105" font-size="16" fill="#203040">C₂(2,5)</text><text x="280" y="205" font-size="16" fill="#203040">M(0,3)</text><text x="360" y="150" font-size="17" fill="#203040">l: y=−x+3</text></g></svg>