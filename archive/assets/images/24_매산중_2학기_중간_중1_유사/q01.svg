<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" width="500" height="120" role="img" aria-labelledby="q01-title q01-desc">
  <title id="q01-title">직선 위의 네 점</title>
  <desc id="q01-desc">직선 l 위에 네 점 A, B, C, D가 차례로 놓여 있는 그림</desc>
  <rect width="500" height="120" fill="#ffffff"/>
  <line x1="40" y1="60" x2="450" y2="60" stroke="#222222" stroke-width="2"/>
  <text x="465" y="65" font-family="sans-serif" font-size="16" font-style="italic" fill="#111111" text-anchor="middle">l</text>
  <circle cx="90" cy="60" r="4" fill="#222222"/>
  <text x="90" y="90" font-family="sans-serif" font-size="15" font-weight="bold" fill="#111111" text-anchor="middle">A</text>
  <circle cx="190" cy="60" r="4" fill="#222222"/>
  <text x="190" y="90" font-family="sans-serif" font-size="15" font-weight="bold" fill="#111111" text-anchor="middle">B</text>
  <circle cx="290" cy="60" r="4" fill="#222222"/>
  <text x="290" y="90" font-family="sans-serif" font-size="15" font-weight="bold" fill="#111111" text-anchor="middle">C</text>
  <circle cx="390" cy="60" r="4" fill="#222222"/>
  <text x="390" y="90" font-family="sans-serif" font-size="15" font-weight="bold" fill="#111111" text-anchor="middle">D</text>
</svg>