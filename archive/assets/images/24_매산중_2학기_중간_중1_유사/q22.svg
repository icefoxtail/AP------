<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 220" width="420" height="220" role="img" aria-labelledby="q22-title q22-desc">
  <title id="q22-title">평행선과 각의 크기</title>
  <desc id="q22-desc">평행한 두 직선 l, m과 만나는 직선이 이루는 각 3x-10도와 2x+40도</desc>
  <rect width="420" height="220" fill="#ffffff"/>
  <line x1="40" y1="60" x2="380" y2="60" stroke="#222222" stroke-width="2"/>
  <text x="395" y="65" font-family="sans-serif" font-size="16" font-style="italic" fill="#111111">l</text>
  <line x1="40" y1="160" x2="380" y2="160" stroke="#222222" stroke-width="2"/>
  <text x="395" y="165" font-family="sans-serif" font-size="16" font-style="italic" fill="#111111">m</text>
  <line x1="120" y1="20" x2="280" y2="200" stroke="#222222" stroke-width="2"/>
  <text x="165" y="50" font-family="sans-serif" font-size="13" fill="#222222">3x-10°</text>
  <text x="250" y="185" font-family="sans-serif" font-size="13" fill="#222222">2x+40°</text>
</svg>