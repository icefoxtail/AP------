<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 130" width="500" height="130" role="img" aria-labelledby="q03-title q03-desc">
  <title id="q03-title">선분의 중점 관계</title>
  <desc id="q03-desc">직선 l 위에 네 점 A, B, C, D가 놓이고 AB는 6cm인 중점 관계 다이어그램</desc>
  <rect width="500" height="130" fill="#ffffff"/>
  <line x1="40" y1="65" x2="460" y2="65" stroke="#222222" stroke-width="2"/>
  <text x="475" y="70" font-family="sans-serif" font-size="16" font-style="italic" fill="#111111" text-anchor="middle">l</text>
  <circle cx="90" cy="65" r="4" fill="#222222"/>
  <text x="90" y="95" font-family="sans-serif" font-size="15" font-weight="bold" fill="#111111" text-anchor="middle">A</text>
  <circle cx="190" cy="65" r="4" fill="#222222"/>
  <text x="190" y="95" font-family="sans-serif" font-size="15" font-weight="bold" fill="#111111" text-anchor="middle">B</text>
  <circle cx="290" cy="65" r="4" fill="#222222"/>
  <text x="290" y="95" font-family="sans-serif" font-size="15" font-weight="bold" fill="#111111" text-anchor="middle">C</text>
  <circle cx="390" cy="65" r="4" fill="#222222"/>
  <text x="390" y="95" font-family="sans-serif" font-size="15" font-weight="bold" fill="#111111" text-anchor="middle">D</text>
  <line x1="90" y1="35" x2="190" y2="35" stroke="#555555" stroke-width="1.5"/>
  <line x1="90" y1="28" x2="90" y2="42" stroke="#555555" stroke-width="1.5"/>
  <line x1="190" y1="28" x2="190" y2="42" stroke="#555555" stroke-width="1.5"/>
  <text x="140" y="25" font-family="sans-serif" font-size="13" fill="#333333" text-anchor="middle">6 cm</text>
</svg>