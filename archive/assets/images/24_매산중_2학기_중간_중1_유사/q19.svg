<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 260" width="420" height="260" role="img" aria-labelledby="q19-title q19-desc">
  <title id="q19-title">오각형의 외각</title>
  <desc id="q19-desc">오각형의 다섯 꼭짓점에서 외각 x, y 및 70도, 80도, 65도의 관계</desc>
  <rect width="420" height="260" fill="#ffffff"/>
  <polygon points="210,50 320,100 280,200 140,200 100,100" fill="none" stroke="#222222" stroke-width="2"/>
  <line x1="210" y1="50" x2="380" y2="120" stroke="#888888" stroke-width="1.5" stroke-dasharray="3,3"/>
  <line x1="320" y1="100" x2="260" y2="240" stroke="#888888" stroke-width="1.5" stroke-dasharray="3,3"/>
  <line x1="280" y1="200" x2="60" y2="200" stroke="#888888" stroke-width="1.5" stroke-dasharray="3,3"/>
  <line x1="140" y1="200" x2="80" y2="50" stroke="#888888" stroke-width="1.5" stroke-dasharray="3,3"/>
  <line x1="100" y1="100" x2="270" y2="20" stroke="#888888" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="345" y="95" font-family="sans-serif" font-size="13" fill="#222222">70°</text>
  <text x="280" y="230" font-family="sans-serif" font-size="13" fill="#222222">80°</text>
  <text x="80" y="220" font-family="sans-serif" font-size="13" fill="#222222">65°</text>
  <text x="65" y="85" font-family="sans-serif" font-size="15" font-weight="bold" fill="#dc2626">x</text>
  <text x="235" y="35" font-family="sans-serif" font-size="15" font-weight="bold" fill="#dc2626">y</text>
</svg>