<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 240" width="440" height="240" role="img" aria-labelledby="q20-title q20-desc">
  <title id="q20-title">삼각형의 내외각 이등분선</title>
  <desc id="q20-desc">삼각형 ABC에서 각 B의 이등분선과 각 C의 외각 이등분선이 만나 생기는 각 x</desc>
  <rect width="440" height="240" fill="#ffffff"/>
  <polygon points="120,60 50,180 230,180" fill="none" stroke="#222222" stroke-width="2"/>
  <text x="120" y="45" font-family="sans-serif" font-size="15" font-weight="bold" fill="#111111" text-anchor="middle">A</text>
  <text x="35" y="190" font-family="sans-serif" font-size="15" font-weight="bold" fill="#111111">B</text>
  <text x="225" y="200" font-family="sans-serif" font-size="15" font-weight="bold" fill="#111111">C</text>
  <text x="120" y="85" font-family="sans-serif" font-size="13" fill="#222222" text-anchor="middle">50°</text>
  <line x1="230" y1="180" x2="380" y2="180" stroke="#222222" stroke-width="1.8"/>
  <text x="390" y="185" font-family="sans-serif" font-size="15" font-weight="bold" fill="#111111">E</text>
  <line x1="50" y1="180" x2="330" y2="90" stroke="#2563eb" stroke-width="2"/>
  <line x1="230" y1="180" x2="330" y2="90" stroke="#2563eb" stroke-width="2"/>
  <circle cx="330" cy="90" r="4" fill="#222222"/>
  <text x="345" y="90" font-family="sans-serif" font-size="15" font-weight="bold" fill="#111111">D</text>
  <text x="300" y="105" font-family="sans-serif" font-size="15" font-weight="bold" fill="#dc2626">x</text>
</svg>