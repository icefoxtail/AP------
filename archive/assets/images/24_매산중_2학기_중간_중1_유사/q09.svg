<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 200" width="460" height="200" role="img" aria-labelledby="q09-title q09-desc">
  <title id="q09-title">합동인 두 삼각형</title>
  <desc id="q09-desc">삼각형 ABC와 삼각형 DEF의 변의 길이와 각의 크기를 나타낸 다이어그램</desc>
  <rect width="460" height="200" fill="#ffffff"/>
  <polygon points="90,40 40,150 170,150" fill="none" stroke="#222222" stroke-width="2"/>
  <text x="90" y="30" font-family="sans-serif" font-size="15" font-weight="bold" fill="#111111" text-anchor="middle">A</text>
  <text x="25" y="160" font-family="sans-serif" font-size="15" font-weight="bold" fill="#111111" text-anchor="middle">B</text>
  <text x="185" y="160" font-family="sans-serif" font-size="15" font-weight="bold" fill="#111111" text-anchor="middle">C</text>
  <text x="90" y="65" font-family="sans-serif" font-size="12" fill="#222222" text-anchor="middle">55°</text>
  <text x="65" y="140" font-family="sans-serif" font-size="12" fill="#222222">65°</text>
  <text x="105" y="168" font-family="sans-serif" font-size="13" fill="#222222" text-anchor="middle">8 cm</text>
  <polygon points="340,40 290,150 420,150" fill="none" stroke="#222222" stroke-width="2"/>
  <text x="340" y="30" font-family="sans-serif" font-size="15" font-weight="bold" fill="#111111" text-anchor="middle">D</text>
  <text x="275" y="160" font-family="sans-serif" font-size="15" font-weight="bold" fill="#111111" text-anchor="middle">E</text>
  <text x="435" y="160" font-family="sans-serif" font-size="15" font-weight="bold" fill="#111111" text-anchor="middle">F</text>
  <text x="390" y="140" font-family="sans-serif" font-size="12" fill="#222222">60°</text>
  <text x="355" y="168" font-family="sans-serif" font-size="13" fill="#222222" text-anchor="middle">8 cm</text>
  <text x="300" y="90" font-family="sans-serif" font-size="13" fill="#222222">7 cm</text>
</svg>