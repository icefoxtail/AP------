<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 260" width="460" height="260" role="img" aria-labelledby="q06-title q06-desc">
  <title id="q06-title">평행선 판정 다이어그램</title>
  <desc id="q06-desc">직선 l, m, n과 횡단선 p, q 사이의 각도 표시를 통한 평행선 판정</desc>
  <rect width="460" height="260" fill="#ffffff"/>
  <line x1="30" y1="60" x2="420" y2="60" stroke="#222222" stroke-width="2"/>
  <text x="435" y="65" font-family="sans-serif" font-size="16" font-style="italic" fill="#111111">l</text>
  <line x1="30" y1="130" x2="420" y2="130" stroke="#222222" stroke-width="2"/>
  <text x="435" y="135" font-family="sans-serif" font-size="16" font-style="italic" fill="#111111">m</text>
  <line x1="30" y1="200" x2="420" y2="200" stroke="#222222" stroke-width="2"/>
  <text x="435" y="205" font-family="sans-serif" font-size="16" font-style="italic" fill="#111111">n</text>
  <line x1="120" y1="20" x2="220" y2="240" stroke="#222222" stroke-width="2"/>
  <text x="110" y="25" font-family="sans-serif" font-size="16" font-style="italic" fill="#111111">p</text>
  <line x1="260" y1="20" x2="360" y2="240" stroke="#222222" stroke-width="2"/>
  <text x="250" y="25" font-family="sans-serif" font-size="16" font-style="italic" fill="#111111">q</text>
  <text x="155" y="52" font-family="sans-serif" font-size="13" fill="#222222">65°</text>
  <text x="190" y="122" font-family="sans-serif" font-size="13" fill="#222222">65°</text>
  <text x="220" y="192" font-family="sans-serif" font-size="13" fill="#222222">70°</text>
  <text x="275" y="152" font-family="sans-serif" font-size="13" fill="#222222">115°</text>
</svg>