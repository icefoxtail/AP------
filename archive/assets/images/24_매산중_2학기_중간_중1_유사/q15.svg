<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 260" width="420" height="260" role="img" aria-labelledby="q15-title q15-desc">
  <title id="q15-title">정육면체 전개도</title>
  <desc id="q15-desc">정육면체 전개도에서 색칠한 면 ㉡과 마주 보는 면을 찾는 그림</desc>
  <rect width="420" height="260" fill="#ffffff"/>
  <rect x="120" y="20" width="60" height="60" fill="none" stroke="#222222" stroke-width="2"/>
  <text x="150" y="55" font-family="sans-serif" font-size="16" fill="#111111" text-anchor="middle">㉤</text>
  <rect x="60" y="80" width="60" height="60" fill="none" stroke="#222222" stroke-width="2"/>
  <text x="90" y="115" font-family="sans-serif" font-size="16" fill="#111111" text-anchor="middle">㉠</text>
  <rect x="120" y="80" width="60" height="60" fill="#e0e0e0" stroke="#222222" stroke-width="2"/>
  <text x="150" y="115" font-family="sans-serif" font-size="16" font-weight="bold" fill="#111111" text-anchor="middle">㉡</text>
