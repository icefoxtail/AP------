<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 328" width="512" height="328" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">ㄷ이 거짓인 반례이다. f(x)=1(x≥0), f(x)=-1(x&lt;0)은 x=0에서 높이 -1의 열린 점과 높이 1의 닫힌 점으로 끊어져 불연속이다. 그러나 |f(x)|=1은 상수라 x=0에서 연속이다. ㄱ(연속함수의 곱), ㄴ(연속함수의 절댓값)은 참이다. 따라서 옳은 것은 ㄱ, ㄴ이고 답은 ②이다.</title><desc id="visual-desc">x=0에서 아래쪽 수평선이 열린 점으로 끝나고 위쪽 수평선이 닫힌 점에서 시작하는 끊어진 그래프이다.</desc><rect width="512" height="328" fill="#fff"/><g data-layer="30"><line id="x-axis" data-role="axis" stroke="#111" stroke-width="1.2" fill="none" data-axis="x" x1="32" y1="164" x2="480" y2="164"/></g><g data-layer="30"><line id="y-axis" data-role="axis" stroke="#111" stroke-width="1.2" fill="none" data-axis="y" x1="256" y1="296" x2="256" y2="32"/></g><g data-layer="30"><line id="tick-y--1" data-role="tick" stroke="#111" stroke-width="0.8" fill="none" data-axis="y" data-value="-1.0" data-required-label-id="tick-y--1-label" x1="256" y1="256" x2="252" y2="256"/></g><g data-layer="30"><line id="model-y-unit" data-role="tick" stroke="#111" stroke-width="0.8" fill="none" data-axis="y" data-value="1.0" data-required-label-id="tick-y-1-label" x1="256" y1="72" x2="252" y2="72"/></g><g data-layer="40"><polyline id="f-piece-1-branch-0" data-role="curve" stroke="#111" stroke-width="2.1" fill="none" data-branch="PIECE_1" points="72,256 72.615384615,256 73.23076