<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 420" width="480" height="420" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">예: a=3/8일 때를 그린다. 원은 중심 O, 반지름 3/8이고 직선은 y=2ax=(3/4)x이다. 연립하면 (1+4a²)x²=a²에서 제3사분면의 교점 P의 x좌표는 -a/√(1+4a²)=-3/10이고 P(-3/10,-9/40)이다. 일반적으로 f(a)=-1/√(1/a²+4)이고 a→∞에서 극한은 -1/2이다. 따라서 답은 ①이다.</title><desc id="visual-desc">원점을 중심으로 한 원과 원점을 지나는 오르는 직선이 있고, 직선이 원과 왼쪽 아래의 점 P에서 만나며 원점에서 P로 반지름이 그려진 그림이다.</desc><rect width="480" height="420" fill="#fff"/><g data-layer="30"><line id="x-axis" data-role="axis" stroke="#111" stroke-width="1.2" fill="none" data-axis="x" x1="32" y1="235.963488844" x2="448" y2="235.963488844"/></g><g data-layer="30"><line id="y-axis" data-role="axis" stroke="#111" stroke-width="1.2" fill="none" data-axis="y" x1="183.204868154" y1="368.117647059" x2="183.204868154" y2="51.882352941"/></g><g data-layer="40"><line id="lL" data-role="line" stroke="#111" stroke-width="2.05" fill="none" x1="32" y1="349.367139959" x2="428.646382691" y2="51.882352941"/></g><g data-layer="40"><circle id="C" data-role="circle" stroke="#111" stroke-width="2.05" fill="none" cx="183.204868154" cy="235.963488844" r="60.851926978"/></g><g data-layer="45"><line id="sOP" data-role="line" stroke="#111" stroke-width="3.2" fill="none" x1="183.204868154" y1="235.963488844" x2="134.523326572" y2="272.47464503"/></g><g data-