<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 704" width="512" height="704" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="UNEQUAL_UNIT_DECLARED" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">x=2에서 f(x)g(x)=2g(x)/(x-2)의 극한이 유한하려면 g(2)=0이고, 함숫값 f(2)g(2)=0과 같으려면 g′(2)=0이어야 한다. 그러면 g는 x=2에서 x축에 접하는 포물선이다. 그림은 g(x)=3(x-2)²이고 꼭짓점 V(2,0)이 x축 위에 있으며 P(0,12)를 지난다. 따라서 g(x)=3(x-2)²이다.</title><desc id="visual-desc">세로축 위의 높은 점 P에서 시작해 내려가 가로축 위의 꼭짓점 V에서 닿았다가 다시 올라가는 아래로 볼록한 포물선 그래프이다.</desc><rect width="512" height="704" fill="#fff"/><g data-layer="30"><line id="x-axis" data-role="axis" stroke="#111" stroke-width="1.2" fill="none" data-axis="x" x1="32" y1="632" x2="480" y2="632"/></g><g data-layer="30"><line id="y-axis" data-role="axis" stroke="#111" stroke-width="1.2" fill="none" data-axis="y" x1="136.533333333" y1="672" x2="136.533333333" y2="32"/></g><g data-layer="40"><polyline id="f-piece-1-branch-0" data-role="curve" stroke="#111" stroke-width="2.1" fill="none" data-branch="PIECE_1" points="106.666666667,72 107.665551839,79.466583148 108.664437012,86.883054999 109.663322185,94.249415555 110.662207358,101.565664814 111.661092531,108.831802776 112.659977703,116.047829443 113.658862876,123.213744813 114.657748049,130.329548886 115.656633222,137.395241664 116.655518395,144.410823145 117.654403567,151.37629333 118.65328874,158.291652219 119.652173913,165.156899811 120.651059086,171.972036107