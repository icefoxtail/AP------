<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" width="720" height="480" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">두 원이 두 점 P, Q에서 만나고, 점 P를 지나는 직선이 두 원과 만나는 점이 A, B이며, 점 Q를 지나는 직선이 두 원과 만나는 점이 C, D이다. 점 P에서 B와 Q 사이의 각이 48도로, 점 D에서 A와 Q 사이의 각이 x로 표시되어 있다.</title><desc id="visual-desc">두 원이 두 점 P, Q에서 만나고, P를 지나는 직선 위에 A와 B가, Q를 지나는 직선 위에 D와 C가 있다. 점 P에서 B와 Q 사이의 각 48도와 점 D에서 A와 Q 사이의 각 x가 표시되어 있고, 선분 PQ와 AD도 그려져 있다.</desc><rect width="720" height="480" fill="#fff"/><g data-layer="12"><polygon id="aBPQ-sector" data-role="angleSector" stroke="none" stroke-width="1.6" fill="#d9d9d9" data-owner-points="B P Q" data-mark="angle" data-mark-id="aBPQ" data-mark-index="0" data-mark-count="1" data-mark-side="INNER" points="351.350339479,138.33813278 372.277800402,156.940320268 371.267691387,158.018048761 370.202153729,159.04100938 369.084152748,160.006355295 367.916799766,160.911400013 366.703343446,161.753624857 365.447160755,162.530685972 364.151747565,163.240420848 362.820708923,163.880854343 361.457749019,164.450204173 360.066660879,164.946885875 358.651315806,165.369517219 357.21565261,165.71692205 355.763666645,165.988133564 354.299398689,166.182396997 352.826923701,166.299171728 351.350339479,166.33813278"/></g><g data-layer="12"><polygon id="aX-sector" data-role="angleSector" stroke="none" stroke-width="1.6" fill="#d9d9d