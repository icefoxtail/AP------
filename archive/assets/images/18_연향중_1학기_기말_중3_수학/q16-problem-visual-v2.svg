<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 688 1115" width="688" height="1115" role="img" aria-labelledby="title desc"><title id="title">그래프의 열림 방향과 꼭짓점 위치</title><desc id="desc">위의 주어진 포물선은 원점을 지나고 꼭짓점이 y축 왼쪽에 있으며 위로 열린다. 아래 ①과 ②는 y축 대칭이며 꼭짓점이 x축 위에 있다. ①은 위로, ②는 아래로 열린다. ③·④·⑤는 원점을 지나며 꼭짓점이 차례로 오른쪽 아래, 오른쪽 위, 왼쪽 위에 있다.</desc><rect width="688" height="1115" fill="white" /><rect x="181" y="8" width="326" height="255" rx="15" fill="#f8fbfe" stroke="#dce6ef" stroke-width="1.4" /><text x="202.0000" y="47.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#4d5d72" text-anchor="start">주어진 그래프</text><line x1="201.0000" y1="158.5352" x2="477.0000" y2="158.5352" stroke="#4d5d72" stroke-width="1.65" stroke-linecap="round" /><polygon points="477.0000,158.5352 464.0000,153.5352 464.0000,163.5352" fill="#4d5d72" /><text x="494.0000" y="150.5352" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#4d5d72" text-anchor="middle">x</text><line x1="399.8824" y1="232.0000" x2="399.8824" y2="69.0000" stroke="#4d5d72" stroke-width="1.65" stroke-linecap="round" /><polygon points="399.8824,69.0000 394.8824,82.0000 404.8824,82.0000" fill="#4d5d72" /><text x="415.8824" y="75.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#4d5d72" text-anchor="middle">y</text><circle cx="399.88235294117646" cy="158.53521126760563" r="4.6" fill="#28364b" /><text x="415.8824" y="185.5352" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">O</text><path d="M 222.7336 81.6268 Q 339.0000 293.5555 455.2664 81.6268" stroke="#205d9c" stroke-width="5.6" stroke-linecap="round" fill="none" /><rect x="12" y="285" width="326" height="252" rx="15" fill="#f8fbfe" stroke="#dce6ef" stroke-width="1.4" /><text x="33.0000" y="324.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font