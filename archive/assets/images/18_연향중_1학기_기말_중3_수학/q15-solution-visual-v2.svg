<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 710 544" width="710" height="544" role="img" aria-labelledby="title desc"><title id="title">직선과 포물선 사이의 세로 길이</title><desc id="desc">주황색 점선은 직선 y=2x+3이고, 파란 그래프는 아래로 열린 포물선 y=−4x²−1이다. 같은 x에서 P와 Q를 수직선으로 이었다. t=−1/4에서 잰 세로 길이는 초록 실선이다. 양옆의 옅은 세로선과 비교할 수 있다.</desc><rect width="710" height="544" fill="white" /><line x1="47.0000" y1="264.0707" x2="656.0000" y2="264.0707" stroke="#4d5d72" stroke-width="1.65" stroke-linecap="round" /><polygon points="656.0000,264.0707 643.0000,259.0707 643.0000,269.0707" fill="#4d5d72" /><text x="673.0000" y="256.0707" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#4d5d72" text-anchor="middle">x</text><line x1="377.8148" y1="486.0000" x2="377.8148" y2="80.0000" stroke="#4d5d72" stroke-width="1.65" stroke-linecap="round" /><polygon points="377.8148,80.0000 372.8148,93.0000 382.8148,93.0000" fill="#4d5d72" /><text x="393.8148" y="86.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#4d5d72" text-anchor="middle">y</text><circle cx="377.8148148148148" cy="264.07073954983923" r="4.6" fill="#28364b" /><text x="362.8148" y="291.0707" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">O</text><line x1="173.3111" y1="483.3473" x2="173.3111" y2="256.7601" stroke="#8c9da9" stroke-width="2.35" stroke-linecap="round" stroke-dasharray="7 6" /><line x1="483.0741" y1="341.3543" x2="483.0741" y2="149.1897" stroke="#8c9da9" stroke-width="2.35" stroke-linecap="round" stroke-dasharray="7 6" /><path d="M 172.5593 484.7703 Q 377.8148 95.5899 583.0704 484.7703" stroke="#205d9c" stroke-width="6.1" stroke-linecap="round" fill="none" /><line x1="62.0370" y1="295.4019" x2="636.4519" y2="95.9267" stroke="#aa5411" stroke-width="5.55" stroke-linecap="round" stroke-dasharray="15 7" /><line x1="340.2222" y1="296.7074" x2="340.2222" y2="198.7974" stroke="#277339" stroke-width="4.2" stroke-linecap="round" /><circle cx="340.22222222222223" cy="296.7073954983923" r="6.0" fill="white" stroke="#277339" stroke-width="3.0" /><circle cx="340.22222222222223" cy="198.79742765273312" r="6.0" fill="white" stroke="#277339" stroke-width="3.0" /><text x="321.2222" y="185.7974" font-size="31" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#277339" text-anchor="middle">Q</text><text x="364.2222" y="325.7074" font-size="31" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#277339" text-anchor="middle">P</text><line x1="340.2222" y1="257.0707" x2="340.2222" y2="273.0707" stroke="#277339" stroke-width="2.1" stroke-linecap="round" /><line x1="338.2222" y1="271.0707" x2="308.2222" y2="291.0707" stroke="#277339" stroke-width="1.75" stroke-linecap="round" /><text x="245.2222" y="306.0707" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#277339" text-anchor="middle">t = −1/4</text><line x1="56.0000" y1="38.0000" x2="101.0000" y2="38.0000" stroke="#205d9c" stroke-width="5.5" stroke-linecap="round" /><text x="114.0000" y="47.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#205d9c" text-anchor="start">y = −4x² − 1</text><line x1="411.0000" y1="38.0000" x2="456.0000" y2="38.0000" stroke="#aa5411" stroke-width="5.5" stroke-linecap="round" stroke-dasharray="15 7" /><text x="469.0000" y="47.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#aa5411" text-anchor="start">y = 2x + 3</text></svg>
