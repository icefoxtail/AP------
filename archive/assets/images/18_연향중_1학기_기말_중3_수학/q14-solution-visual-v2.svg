<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 708 530" width="708" height="530" role="img" aria-labelledby="title desc"><title id="title">왼쪽과 아래로 옮긴 꼭짓점</title><desc id="desc">파란 y=x²/2의 꼭짓점은 원점이고, 이동한 주황 포물선의 꼭짓점은 (−2, −3)이다. 두 포물선의 폭은 같다.</desc><rect width="708" height="530" fill="white" /><line x1="291.2649" y1="321.4168" x2="402.0858" y2="321.4168" stroke="#26716e" stroke-width="2.05" stroke-linecap="round" stroke-dasharray="7 6" /><line x1="291.2649" y1="422.5317" x2="291.2649" y2="321.4168" stroke="#26716e" stroke-width="2.05" stroke-linecap="round" stroke-dasharray="7 6" /><line x1="53.0000" y1="321.4168" x2="647.0000" y2="321.4168" stroke="#4d5d72" stroke-width="1.65" stroke-linecap="round" /><polygon points="647.0000,321.4168 634.0000,316.4168 634.0000,326.4168" fill="#4d5d72" /><text x="664.0000" y="313.4168" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#4d5d72" text-anchor="middle">x</text><line x1="402.0858" y1="465.0000" x2="402.0858" y2="72.0000" stroke="#4d5d72" stroke-width="1.65" stroke-linecap="round" /><polygon points="402.0858,72.0000 397.0858,85.0000 407.0858,85.0000" fill="#4d5d72" /><text x="418.0858" y="78.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#4d5d72" text-anchor="middle">y</text><text x="386.0858" y="349.4168" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#4d5d72" text-anchor="middle">O</text><path d="M 199.2836 95.6676 Q 402.0858 547.1660 604.8881 95.6676" stroke="#205d9c" stroke-width="5.9" stroke-linecap="round" fill="none" /><path d="M 66.8526 146.1088 Q 291.2649 698.9547 515.6772 146.1088" stroke="#aa5411" stroke-width="5.9" stroke-linecap="round" fill="none" stroke-dasharray="15 7" /><circle cx="291.26492537313436" cy="422.5317324185249" r="6.0" fill="white" stroke="#aa5411" stroke-width="3.0" /><text x="255.2649" y="454.5317" font-size="30" font-family="Malgun Gothic, Cambr