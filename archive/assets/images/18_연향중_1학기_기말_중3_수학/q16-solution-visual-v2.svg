<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 696 418" width="696" height="418" role="img" aria-labelledby="title desc"><title id="title">그래프의 열림 방향과 꼭짓점 위치</title><desc id="desc">왼쪽은 주어진 위로 열린 포물선이다. 원점과 왼쪽 꼭짓점으로부터 a&gt;0, b&lt;0, c=0이다. 오른쪽의 구하는 포물선은 y축에 대칭이며 꼭짓점이 x축보다 높고 아래로 열린다.</desc><rect width="696" height="418" fill="white" /><rect x="12" y="31" width="326" height="337" rx="15" fill="#f8fbfe" stroke="#dce6ef" stroke-width="1.4" /><text x="33.0000" y="70.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#4d5d72" text-anchor="start">주어진 그래프</text><line x1="32.0000" y1="226.5775" x2="308.0000" y2="226.5775" stroke="#4d5d72" stroke-width="1.65" stroke-linecap="round" /><polygon points="308.0000,226.5775 295.0000,221.5775 295.0000,231.5775" fill="#4d5d72" /><text x="325.0000" y="218.5775" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#4d5d72" text-anchor="middle">x</text><line x1="230.8824" y1="337.0000" x2="230.8824" y2="92.0000" stroke="#4d5d72" stroke-width="1.65" stroke-linecap="round" /><polygon points="230.8824,92.0000 225.8824,105.0000 235.8824,105.0000" fill="#4d5d72" /><text x="246.8824" y="98.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#4d5d72" text-anchor="middle">y</text><circle cx="230.88235294117646" cy="226.57746478873239" r="4.6" fill="#28364b" /><text x="246.8824" y="253.5775" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">O</text><line x1="170.0000" y1="334.4120" x2="170.0000" y2="118.7430" stroke="#8a9aaa" stroke-width="1.7" stroke-linecap="round" stroke-dasharray="6 6" /><path d="M 53.7336 110.9789 Q 170.0000 429.5220 286.2664 110.9789" stroke="#205d9c" stroke-width="5.6" stroke-linecap="round" fill="none" /><rect x="357" y="31" width="326" height="337" rx="15" fill="#f8fbfe" stroke="#dce6ef" stroke-width="1.4" /><text x="378.0000" y="70.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#4d5d72" text-anchor="start">구하는 그래프</text><line x1="377.0000" y1="226.5775" x2="653.0000" y2="226.5775" stroke="#4d5d72" stroke-width="1.65" stroke-linecap="round" /><polygon points="653.0000,226.5775 640.0000,221.5775 640.0000,231.5775" fill="#4d5d72" /><text x="670.0000" y="218.5775" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#4d5d72" text-anchor="middle">x</text><line x1="515.0000" y1="337.0000" x2="515.0000" y2="92.0000" stroke="#4d5d72" stroke-width="1.65" stroke-linecap="round" /><polygon points="515.0000,92.0000 510.0000,105.0000 520.0000,105.0000" fill="#4d5d72" /><text x="531.0000" y="98.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#4d5d72" text-anchor="middle">y</text><circle cx="515.0" cy="226.57746478873239" r="4.6" fill="#28364b" /><text x="500.0000" y="253.5775" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">O</text><path d="M 397.3364 324.9225 Q 515.0000 16.9472 632.6636 324.9225" stroke="#aa5411" stroke-width="5.6" stroke-linecap="round" fill="none" /></svg>
