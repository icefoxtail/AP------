<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 708 530" width="708" height="530" role="img" aria-labelledby="title desc"><title id="title">꼭짓점이 한 칸 옮겨진 포물선</title><desc id="desc">파란 포물선의 꼭짓점은 원점이다. 오른쪽으로 1만큼 옮긴 주황색 점선 포물선의 꼭짓점은 (1, 0)이다. 두 그래프는 위로 열린다.</desc><rect width="708" height="530" fill="white" /><line x1="405.5540" y1="434.6134" x2="405.5540" y2="122.6443" stroke="#26716e" stroke-width="2.05" stroke-linecap="round" stroke-dasharray="7 6" /><line x1="53.0000" y1="396.1237" x2="647.0000" y2="396.1237" stroke="#4d5d72" stroke-width="1.65" stroke-linecap="round" /><polygon points="647.0000,396.1237 634.0000,391.1237 634.0000,401.1237" fill="#4d5d72" /><text x="664.0000" y="388.1237" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#4d5d72" text-anchor="middle">x</text><line x1="298.7194" y1="465.0000" x2="298.7194" y2="72.0000" stroke="#4d5d72" stroke-width="1.65" stroke-linecap="round" /><polygon points="298.7194,72.0000 293.7194,85.0000 303.7194,85.0000" fill="#4d5d72" /><text x="314.7194" y="78.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#4d5d72" text-anchor="middle">y</text><text x="282.7194" y="424.1237" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#4d5d72" text-anchor="middle">O</text><path d="M 92.5288 94.2916 Q 298.7194 697.9558 504.9101 94.2916" stroke="#205d9c" stroke-width="5.9" stroke-linecap="round" fill="none" /><path d="M 199.3633 94.2916 Q 405.5540 697.9558 611.7446 94.2916" stroke="#aa5411" stroke-width="5.9" stroke-linecap="round" fill="none" stroke-dasharray="15 7" /><circle cx="405.55395683453236" cy="396.12371134020617" r="6.0" fill="white" stroke="#aa5411" stroke-width="3.0" /><text x="431.5540" y="433.1237" font-size="30" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#aa5411" text-anchor="middle">(1, 0)</text><line x1="60.0000" y1="28.0000" x2="104.0000" y2="28.0000" stroke="#205d9c" stroke-width="5.3" stroke-linecap="round" /><text x="118.0000" y="36.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#205d9c" text-anchor="start">y = 2x²</text><line x1="400.0000" y1="28.0000" x2="444.0000" y2="28.0000" stroke="#aa5411" stroke-width="5.3" stroke-linecap="round" stroke-dasharray="15 7" /><text x="458.0000" y="36.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#aa5411" text-anchor="start">y = 2(x − 1)²</text></svg>
