<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 715 590" width="715" height="590" role="img" aria-labelledby="title desc"><title id="title">두 포물선 사이에 놓인 정사각형</title><desc id="desc">원점에서 올라가는 두 포물선의 오른쪽 가지가 보인다. 파란 y=x² 위에 A와 C, 주황색 점선 y=4x² 위에 D가 있다. 각 변이 좌표축과 평행한 정사각형 ABCD의 B는 오른쪽 아래이다.</desc><rect width="715" height="590" fill="white" /><polygon points="278.8621,404.7037 434.1499,404.7037 434.1499,252.6569 278.8621,252.6569" fill="#e6f2e8" /><line x1="70.0000" y1="455.3860" x2="650.0000" y2="455.3860" stroke="#4d5d72" stroke-width="1.65" stroke-linecap="round" /><polygon points="650.0000,455.3860 637.0000,450.3860 637.0000,460.3860" fill="#4d5d72" /><text x="667.0000" y="447.3860" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#4d5d72" text-anchor="middle">x</text><line x1="123.5743" y1="501.0000" x2="123.5743" y2="85.0000" stroke="#4d5d72" stroke-width="1.65" stroke-linecap="round" /><polygon points="123.5743,85.0000 118.5743,98.0000 128.5743,98.0000" fill="#4d5d72" /><text x="139.5743" y="91.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#4d5d72" text-anchor="middle">y</text><circle cx="123.57429718875503" cy="455.3859649122807" r="4.6" fill="#28364b" /><text x="108.5743" y="482.3860" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">O</text><path d="M 123.5743 455.3860 Q 328.5542 455.3860 533.5341 102.1509" stroke="#205d9c" stroke-width="6.2" stroke-linecap="round" fill="none" /><path d="M 123.5743 455.3860 Q 224.8996 455.3860 326.2249 110.1333" stroke="#aa5411" stroke-width="5.6" stroke-linecap="round" fill="none" stroke-dasharray="15 7" /><line x1="278.8621" y1="404.7037" x2="434.1499" y2="404.7037" stroke="#277339" stroke-width="3.8" stroke-linecap="round" /><line x1="434.1499" y1="404.7037" x2="434.1499" y2="252.6569" stroke="#277339" stroke-width="3.8" stroke-linecap="round" /><line 