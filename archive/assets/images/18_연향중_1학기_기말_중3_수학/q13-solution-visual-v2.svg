<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 708 530" width="708" height="530" role="img" aria-labelledby="title desc"><title id="title">포물선이 네 사분면을 모두 지나는 예</title><desc id="desc">아래로 열린 그래프가 x축을 y축 양쪽에서 가로지른다. 네 사분면마다 초록 점을 하나씩 표시했다.</desc><rect width="708" height="530" fill="white" /><line x1="53.0000" y1="323.3784" x2="647.0000" y2="323.3784" stroke="#4d5d72" stroke-width="1.65" stroke-linecap="round" /><polygon points="647.0000,323.3784 634.0000,318.3784 634.0000,328.3784" fill="#4d5d72" /><text x="664.0000" y="315.3784" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#4d5d72" text-anchor="middle">x</text><line x1="256.6571" y1="465.0000" x2="256.6571" y2="72.0000" stroke="#4d5d72" stroke-width="1.65" stroke-linecap="round" /><polygon points="256.6571,72.0000 251.6571,85.0000 261.6571,85.0000" fill="#4d5d72" /><text x="272.6571" y="78.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#4d5d72" text-anchor="middle">y</text><text x="240.6571" y="351.3784" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#4d5d72" text-anchor="middle">O</text><path d="M 153.1314 459.9299 Q 341.5143 -238.0381 529.8971 459.9299" stroke="#205d9c" stroke-width="5.9" stroke-linecap="round" fill="none" /><circle cx="341.5142857142857" cy="110.94594594594594" r="6.0" fill="white" stroke="#26716e" stroke-width="3.0" /><circle cx="214.22857142857143" cy="270.27027027027026" r="6.0" fill="white" stroke="#26716e" stroke-width="3.0" /><circle cx="171.79999999999998" cy="394.18918918918916" r="6.0" fill="white" stroke="#26716e" stroke-width="3.0" /><circle cx="511.22857142857146" cy="394.18918918918916" r="6.0" fill="white" stroke="#26716e" stroke-width="3.0" /><text x="556.2029" y="169.9550" font-size="30" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#26716e" text-anchor="middle">Ⅰ</text><text x="161.6171" y="169.9550" font-size="30" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#26716e" text-anchor="middle">Ⅱ</text><text x="112.4000" y="424.8739" font-size="30" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#26716e" text-anchor="middle">Ⅲ</text><text x="587.6000" y="424.8739" font-size="30" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#26716e" text-anchor="middle">Ⅳ</text><line x1="60.0000" y1="28.0000" x2="104.0000" y2="28.0000" stroke="#205d9c" stroke-width="5.3" stroke-linecap="round" /><text x="118.0000" y="36.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#205d9c" text-anchor="start">y = −3(x − 1)² + 9</text></svg>
