<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 708 530" width="708" height="530" role="img" aria-labelledby="title desc"><title id="title">높이 105 m를 두 번 지나는 물체</title><desc id="desc">가로축은 시간(초), 세로축은 높이(m)를 나타낸다. 파란 포물선과 높이 105 m의 수평선은 3초와 7초에 만난다. 두 교점에서 각각 가로축에 수직으로 점선을 내렸다.</desc><rect width="708" height="530" fill="white" /><line x1="96.1538" y1="145.0000" x2="588.6154" y2="145.0000" stroke="#26716e" stroke-width="2.05" stroke-linecap="round" stroke-dasharray="7 6" /><line x1="248.4615" y1="425.0000" x2="248.4615" y2="145.0000" stroke="#aa5411" stroke-width="2.05" stroke-linecap="round" stroke-dasharray="7 6" /><line x1="451.5385" y1="425.0000" x2="451.5385" y2="145.0000" stroke="#26716e" stroke-width="2.05" stroke-linecap="round" stroke-dasharray="7 6" /><line x1="53.0000" y1="425.0000" x2="647.0000" y2="425.0000" stroke="#4d5d72" stroke-width="1.6" stroke-linecap="round" /><polygon points="647.0000,425.0000 635.0000,420.0000 635.0000,430.0000" fill="#4d5d72" /><text x="670.0000" y="415.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#4d5d72" text-anchor="middle">초</text><line x1="96.1538" y1="465.0000" x2="96.1538" y2="49.0000" stroke="#4d5d72" stroke-width="1.6" stroke-linecap="round" /><polygon points="96.1538,49.0000 91.1538,61.0000 101.1538,61.0000" fill="#4d5d72" /><text x="114.1538" y="54.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#4d5d72" text-anchor="middle">m</text><path d="M 96.1538 425.0000 Q 350.0000 -241.6667 603.8462 425.0000" stroke="#205d9c" stroke-width="5.9" stroke-linecap="round" fill="none" /><circle cx="248.46153846153848" cy="145.0" r="6.0" fill="white" stroke="#aa5411" stroke-width="3.0" /><circle cx="451.53846153846155" cy="145.0" r="6.0" fill="white" stroke="#26716e" stroke-width="3.0" /><text x="154.5385" y="131.4000" font-size="30" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#26716e" text-anchor="middle">105 m</text><text x="248.4615" y="453.0000" font-size="30" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#aa5411" text-anchor="middle">3초</text><text x="451.5385" y="453.0000" font-size="30" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#26716e" text-anchor="middle">7초</text></svg>
