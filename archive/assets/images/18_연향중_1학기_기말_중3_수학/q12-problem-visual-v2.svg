<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 707 581" width="707" height="581" role="img" aria-labelledby="title desc"><title id="title">가로축에 대칭인 두 쌍의 포물선</title><desc id="desc">같은 색의 포물선 두 개는 x축에 서로 대칭이다. 좁은 파랑 쌍은 위가 y=ax², 아래가 y=dx²이다. 넓은 주황 쌍은 위가 y=bx², 아래가 y=cx²이다.</desc><rect width="707" height="581" fill="white" /><line x1="49.0000" y1="290.5000" x2="650.0000" y2="290.5000" stroke="#4d5d72" stroke-width="1.65" stroke-linecap="round" /><polygon points="650.0000,290.5000 637.0000,285.5000 637.0000,295.5000" fill="#4d5d72" /><text x="667.0000" y="282.5000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#4d5d72" text-anchor="middle">x</text><line x1="349.5000" y1="509.0000" x2="349.5000" y2="72.0000" stroke="#4d5d72" stroke-width="1.65" stroke-linecap="round" /><polygon points="349.5000,72.0000 344.5000,85.0000 354.5000,85.0000" fill="#4d5d72" /><text x="365.5000" y="78.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#4d5d72" text-anchor="middle">y</text><circle cx="349.5" cy="290.5" r="4.6" fill="#28364b" /><text x="334.5000" y="317.5000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">O</text><path d="M 222.9941 92.2315 Q 349.5000 488.7685 476.0059 92.2315" stroke="#205d9c" stroke-width="5.7" stroke-linecap="round" fill="none" /><path d="M 222.9941 488.7685 Q 349.5000 92.2315 476.0059 488.7685" stroke="#205d9c" stroke-width="5.7" stroke-linecap="round" fill="none" /><path d="M 97.4202 92.2315 Q 349.5000 488.7685 601.5798 92.2315" stroke="#aa5411" stroke-width="5.7" stroke-linecap="round" fill="none" stroke-dasharray="15 7" /><path d="M 97.4202 488.7685 Q 349.5000 92.2315 601.5798 488.7685" stroke="#aa5411" stroke-width="5.7" stroke-linecap="round" fill="none" stroke-dasharray="15 7" /><line x1="77.0000" y1="35.0000" x2="122.0000" y2="35.0000" stroke="#205d9c" stroke-width="5.5" stroke-linecap="round" /><text x="135.0000" y="44.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#205d9c" text-anchor="start">y = ax²</text><line x1="383.0000" y1="35.0000" x2="428.0000" y2="35.0000" stroke="#aa5411" stroke-width="5.5" stroke-linecap="round" stroke-dasharray="15 7" /><text x="441.0000" y="44.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#aa5411" text-anchor="start">y = bx²</text><line x1="77.0000" y1="550.0000" x2="122.0000" y2="550.0000" stroke="#205d9c" stroke-width="5.5" stroke-linecap="round" /><text x="135.0000" y="559.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#205d9c" text-anchor="start">y = dx²</text><line x1="383.0000" y1="550.0000" x2="428.0000" y2="550.0000" stroke="#aa5411" stroke-width="5.5" stroke-linecap="round" stroke-dasharray="15 7" /><text x="441.0000" y="559.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#aa5411" text-anchor="start">y = cx²</text></svg>
