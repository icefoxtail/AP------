<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 708 530" width="708" height="530" role="img" aria-labelledby="title desc"><title id="title">가로축과 만나지 않는 아래쪽 포물선</title><desc id="desc">아래로 열린 그래프의 꼭짓점 높이는 k+13이다. 위쪽의 x축은 곡선 전체보다 높고 축 x=4를 초록 점선으로 표시했다.</desc><rect width="708" height="530" fill="white" /><line x1="366.6422" y1="413.9571" x2="366.6422" y2="133.2209" stroke="#26716e" stroke-width="2.05" stroke-linecap="round" stroke-dasharray="7 6" /><line x1="53.0000" y1="133.2209" x2="647.0000" y2="133.2209" stroke="#4d5d72" stroke-width="1.65" stroke-linecap="round" /><polygon points="647.0000,133.2209 634.0000,128.2209 634.0000,138.2209" fill="#4d5d72" /><text x="664.0000" y="125.2209" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#4d5d72" text-anchor="middle">x</text><line x1="110.6078" y1="465.0000" x2="110.6078" y2="49.0000" stroke="#4d5d72" stroke-width="1.65" stroke-linecap="round" /><polygon points="110.6078,49.0000 105.6078,62.0000 115.6078,62.0000" fill="#4d5d72" /><text x="126.6078" y="55.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#4d5d72" text-anchor="middle">y</text><text x="94.6078" y="161.2209" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#4d5d72" text-anchor="middle">O</text><path d="M 181.0172 454.1534 Q 366.6422 -82.4356 552.2672 454.1534" stroke="#205d9c" stroke-width="5.9" stroke-linecap="round" fill="none" /><circle cx="366.64224137931035" cy="185.8588957055215" r="6.0" fill="white" stroke="#205d9c" stroke-width="3.0" /><text x="492.6422" y="191.8589" font-size="30" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#205d9c" text-anchor="middle">(4, k + 13)</text></svg>
