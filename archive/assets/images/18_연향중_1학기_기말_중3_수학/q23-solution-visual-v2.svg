<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 708 530" width="708" height="530" role="img" aria-labelledby="title desc"><title id="title">계수에 따른 최솟값의 변화</title><desc id="desc">가로축은 계수 a, 세로축은 함수의 최솟값 m이다. 아래로 열린 포물선에서 꼭짓점 (−4, 4)를 파란 점으로 표시했다.</desc><rect width="708" height="530" fill="white" /><line x1="350.0000" y1="265.3200" x2="350.0000" y2="117.4089" stroke="#26716e" stroke-width="2.05" stroke-linecap="round" stroke-dasharray="7 6" /><line x1="350.0000" y1="117.4089" x2="530.0000" y2="117.4089" stroke="#26716e" stroke-width="2.05" stroke-linecap="round" stroke-dasharray="7 6" /><line x1="53.0000" y1="265.3200" x2="647.0000" y2="265.3200" stroke="#4d5d72" stroke-width="1.6" stroke-linecap="round" /><polygon points="647.0000,265.3200 635.0000,260.3200 635.0000,270.3200" fill="#4d5d72" /><text x="670.0000" y="255.3200" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#4d5d72" text-anchor="middle">a</text><line x1="530.0000" y1="465.0000" x2="530.0000" y2="49.0000" stroke="#4d5d72" stroke-width="1.6" stroke-linecap="round" /><polygon points="530.0000,49.0000 525.0000,61.0000 535.0000,61.0000" fill="#4d5d72" /><text x="548.0000" y="54.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#4d5d72" text-anchor="middle">m</text><path d="M 82.2500 444.6853 Q 350.0000 -209.8676 617.7500 444.6853" stroke="#205d9c" stroke-width="5.9" stroke-linecap="round" fill="none" /><circle cx="350.0" cy="117.4088888888889" r="6.0" fill="white" stroke="#26716e" stroke-width="3.0" /><text x="381.0000" y="102.4089" font-size="30" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#26716e" text-anchor="middle">(−4, 4)</text></svg>
