<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 688 537" width="688" height="537" role="img" aria-labelledby="title desc"><title id="title">정사각형의 변을 따라 내려가고 오른쪽으로 가는 점</title><desc id="desc">가로와 세로 길이가 모두 24 cm인 정사각형이다. P는 왼쪽 변 위, Q는 아래 변 위를 움직인다. 왼쪽 아래 B와 두 점 P, Q를 이은 삼각형을 칠했다.</desc><rect width="688" height="537" fill="white" /><line x1="149.0000" y1="86.0000" x2="149.0000" y2="426.0000" stroke="#205d9c" stroke-width="4.1" stroke-linecap="round" /><line x1="149.0000" y1="426.0000" x2="489.0000" y2="426.0000" stroke="#205d9c" stroke-width="4.1" stroke-linecap="round" /><line x1="489.0000" y1="426.0000" x2="489.0000" y2="86.0000" stroke="#205d9c" stroke-width="4.1" stroke-linecap="round" /><line x1="489.0000" y1="86.0000" x2="149.0000" y2="86.0000" stroke="#205d9c" stroke-width="4.1" stroke-linecap="round" /><polygon points="149.0000,210.6667 149.0000,426.0000 211.3333,426.0000" fill="#f7ddbf" /><line x1="149.0000" y1="210.6667" x2="149.0000" y2="426.0000" stroke="#aa5411" stroke-width="4.2" stroke-linecap="round" /><line x1="149.0000" y1="426.0000" x2="211.3333" y2="426.0000" stroke="#aa5411" stroke-width="4.2" stroke-linecap="round" /><line x1="149.0000" y1="210.6667" x2="211.3333" y2="426.0000" stroke="#aa5411" stroke-width="4.2" stroke-linecap="round" /><circle cx="149" cy="86" r="4.3" fill="#28364b" /><text x="134.0000" y="71.0000" font-size="30" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">A</text><circle cx="149" cy="426" r="4.3" fill="#28364b" /><text x="133.0000" y="452.0000" font-size="30" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">B</text><circle cx="489" cy="426" r="4.3" fill="#28364b" /><text x="506.0000" y="450.0000" font-size="30" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">C</text><circle cx="489" cy="86" r="4.3" fill="#28364b" /><text x="506.0000" y="73.00