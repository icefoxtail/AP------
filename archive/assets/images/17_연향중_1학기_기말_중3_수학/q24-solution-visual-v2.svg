<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 707 774" width="707" height="774" role="img" aria-labelledby="title desc"><title id="title">무대와 보드의 세로 높이 차</title><desc id="desc">같은 폭의 포물선 두 개가 위로 열린다. 아래쪽 A는 무대이고 위쪽 B는 보드의 곡선이다. 왼쪽 세로 경계의 x좌표는 −1이고 위쪽 높이는 3이다. 오른쪽 경계는 x=2이다. 두 세로선과 두 곡선 사이의 녹색 면이 색칠한 부분이다. 아래 그림의 두 빗금 친 조각은 평행이동으로 서로 겹친다.</desc><rect width="707" height="774" fill="white" /><path d="M 195.1777 192.2687 Q 316.0455 398.4361 436.9132 295.3524 L 436.9132 398.4361 Q 316.0455 501.5198 195.1777 295.3524 Z" fill="#dceee1" stroke="none" /><line x1="59.0000" y1="295.3524" x2="644.0000" y2="295.3524" stroke="#4d5d72" stroke-width="1.65" stroke-linecap="round" /><polygon points="644.0000,295.3524 631.0000,290.3524 631.0000,300.3524" fill="#4d5d72" /><text x="661.0000" y="287.3524" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#4d5d72" text-anchor="middle">x</text><line x1="275.7562" y1="473.0000" x2="275.7562" y2="83.0000" stroke="#4d5d72" stroke-width="1.65" stroke-linecap="round" /><polygon points="275.7562,83.0000 270.7562,96.0000 280.7562,96.0000" fill="#4d5d72" /><text x="291.7562" y="89.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#4d5d72" text-anchor="middle">y</text><circle cx="275.75619834710744" cy="295.352422907489" r="4.6" fill="#28364b" /><text x="260.7562" y="322.3524" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">O</text><path d="M 112.9876 119.4092 Q 356.3347 746.1856 599.6818 119.4092" stroke="#205d9c" stroke-width="5.7" stroke-linecap="round" fill="none" /><path d="M 144.4132 92.0404 Q 356.3347 567.3869 568.2562 92.0404" stroke="#aa5411" stroke-width="5.9" stroke-linecap="round" fill="none" stroke-dasharray="15 7" /><line x1="195.1777" y1="295.3524" x2="195.1777" y2="192.2687" stroke="#25736e" stroke-width="3.2" stroke-linecap="round" /><line x1="436.9132" y1="398.4361" x2="436.9132" y2="295.3524" stroke="#25736e" stroke-width="3.2" stroke-linecap="round" /><line x1="195.1777" y1="192.2687" x2="275.7562" y2="192.2687" stroke="#4d5d72" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="7 6" /><line x1="191.1777" y1="291.3524" x2="199.1777" y2="299.3524" stroke="#4d5d72" stroke-width="1.6" stroke-linecap="round" /><text x="180.1777" y="329.3524" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#4d5d72" text-anchor="middle">−1</text><line x1="432.9132" y1="291.3524" x2="440.9132" y2="299.3524" stroke="#4d5d72" stroke-width="1.6" stroke-linecap="round" /><text x="444.9132" y="280.3524" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#4d5d72" text-anchor="middle">2</text><line x1="271.7562" y1="188.2687" x2="279.7562" y2="196.2687" stroke="#4d5d72" stroke-width="1.6" stroke-linecap="round" /><text x="252.7562" y="185.2687" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#4d5d72" text-anchor="middle">3</text><line x1="67.0000" y1="40.0000" x2="115.0000" y2="40.0000" stroke="#205d9c" stroke-width="5.4" stroke-linecap="round" /><text x="127.0000" y="48.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#205d9c" text-anchor="start">무대의 곡선 A</text><line x1="387.0000" y1="40.0000" x2="435.0000" y2="40.0000" stroke="#aa5411" stroke-width="5.4" stroke-linecap="round" stroke-dasharray="15 7" /><text x="447.0000" y="48.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#aa5411" text-anchor="start">보드의 곡선 B</text><path d="M 195.1777 192.2687 Q 316.0455 398.4361 436.9132 295.3524 L 436.9132 295.3524 Z" fill="#f8d7b5" stroke="none" /><path d="M 436.9132 398.4361 Q 316.0455 501.5198 195.1777 295.3524 L 195.1777 295.3524 Z" fill="#f8d7b5" stroke="none" /><line x1="195.1777" y1="192.2687" x2="436.9132" y2="295.