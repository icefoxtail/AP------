<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 705 544" width="705" height="544" role="img" aria-labelledby="title desc"><title id="title">포물선의 열림과 y절편의 위치</title><desc id="desc">파란 포물선은 위로 열린다. 꼭짓점은 세로축 오른쪽과 가로축 아래에 있고, 세로축과 만나는 곳은 가로축보다 위에 있다.</desc><rect width="705" height="544" fill="white" /><line x1="53.0000" y1="369.3504" x2="649.0000" y2="369.3504" stroke="#4d5d72" stroke-width="1.65" stroke-linecap="round" /><polygon points="649.0000,369.3504 636.0000,364.3504 636.0000,374.3504" fill="#4d5d72" /><text x="666.0000" y="361.3504" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#4d5d72" text-anchor="middle">x</text><line x1="224.3500" y1="473.0000" x2="224.3500" y2="58.0000" stroke="#4d5d72" stroke-width="1.65" stroke-linecap="round" /><polygon points="224.3500,58.0000 219.3500,71.0000 229.3500,71.0000" fill="#4d5d72" /><text x="240.3500" y="64.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#4d5d72" text-anchor="middle">y</text><text x="203.3500" y="397.3504" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#4d5d72" text-anchor="middle">O</text><path d="M 157.3000 87.7450 Q 371.1150 747.2616 584.9300 83.1330" stroke="#205d9c" stroke-width="6.0" stroke-linecap="round" fill="none" /></svg>
