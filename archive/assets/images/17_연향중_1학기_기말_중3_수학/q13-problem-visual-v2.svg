<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 705 544" width="705" height="544" role="img" aria-labelledby="title desc"><title id="title">포물선 위의 한 점과 가로축으로 만든 삼각형</title><desc id="desc">위로 열린 포물선 y=2x²의 오른쪽 가지에 A가 있다. 가로축의 왼쪽 점 B는 x=−5이다. 점 B와 원점 O, 포물선의 A를 이었다.</desc><rect width="705" height="544" fill="white" /><polygon points="551.0104,191.1697 116.8793,431.5367 426.9729,431.5367" fill="#e3f3e7" /><line x1="551.0104" y1="191.1697" x2="116.8793" y2="431.5367" stroke="#25736e" stroke-width="3.6" stroke-linecap="round" /><line x1="116.8793" y1="431.5367" x2="426.9729" y2="431.5367" stroke="#25736e" stroke-width="3.6" stroke-linecap="round" /><line x1="426.9729" y1="431.5367" x2="551.0104" y2="191.1697" stroke="#25736e" stroke-width="3.6" stroke-linecap="round" /><line x1="53.0000" y1="431.5367" x2="649.0000" y2="431.5367" stroke="#4d5d72" stroke-width="1.65" stroke-linecap="round" /><polygon points="649.0000,431.5367 636.0000,426.5367 636.0000,436.5367" fill="#4d5d72" /><text x="666.0000" y="423.5367" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#4d5d72" text-anchor="middle">x</text><line x1="426.9729" y1="473.0000" x2="426.9729" y2="80.0000" stroke="#4d5d72" stroke-width="1.65" stroke-linecap="round" /><polygon points="426.9729,80.0000 421.9729,93.0000 431.9729,93.0000" fill="#4d5d72" /><text x="442.9729" y="86.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#4d5d72" text-anchor="middle">y</text><text x="405.9729" y="459.5367" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#4d5d72" text-anchor="middle">O</text><path d="M 284.3299 113.6514 Q 427.9032 753.5683 571.4766 105.3046" stroke="#205d9c" stroke-width="6.0" stroke-linecap="round" fill="none" /><circle cx="551.0104058272634" cy="191.16972477064218" r="6.0" fill="white" stroke="#25736e" stroke-width="3.1" /><text x="574.0104" y="178.1697" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#25736e" text-anchor="middle">A</text><circle cx="116.87929240374612" cy="431.5366972477064" r="6.0" fill="white" stroke="#25736e" stroke-width="3.1" /><text x="94.8793" y="418.5367" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#25736e" text-anchor="middle">B</text><line x1="116.8793" y1="426.5367" x2="116.8793" y2="436.5367" stroke="#4d5d72" stroke-width="1.7" stroke-linecap="round" /><text x="116.8793" y="462.5367" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#4d5d72" text-anchor="middle">−5</text><line x1="64.0000" y1="39.0000" x2="114.0000" y2="39.0000" stroke="#205d9c" stroke-width="5.4" stroke-linecap="round" /><text x="126.0000" y="47.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#205d9c" text-anchor="start">y = 2x²</text></svg>
