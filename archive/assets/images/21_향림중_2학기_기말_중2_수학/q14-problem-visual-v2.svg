<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 749 596" width="749" height="596" role="img" aria-labelledby="title desc"><title id="title">세 평행선과 세 갈래 사선의 대응</title><desc id="desc">세 평행선 l, m, n을 세 사선이 가로지른다. 왼쪽 사선의 위와 아래는 6 cm와 8 cm, 가운데는 x cm와 10 cm, 오른쪽은 y cm와 12 cm이다.</desc><rect width="749" height="596" fill="white" /><line x1="70.0000" y1="152.0000" x2="680.0000" y2="152.0000" stroke="#687889" stroke-width="2.5" stroke-linecap="round" /><text x="705.0000" y="162.0000" font-size="32" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#687889" text-anchor="middle">l</text><line x1="70.0000" y1="254.0000" x2="680.0000" y2="254.0000" stroke="#687889" stroke-width="2.5" stroke-linecap="round" /><text x="705.0000" y="264.0000" font-size="32" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#687889" text-anchor="middle">m</text><line x1="70.0000" y1="390.0000" x2="680.0000" y2="390.0000" stroke="#687889" stroke-width="2.5" stroke-linecap="round" /><text x="705.0000" y="400.0000" font-size="32" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#687889" text-anchor="middle">n</text><line x1="205.5900" y1="124.6300" x2="124.0800" y2="418.5600" stroke="#687889" stroke-width="3.6" stroke-linecap="round" /><line x1="198.0000" y1="152.0000" x2="169.7143" y2="254.0000" stroke="#21639a" stroke-width="5.8" stroke-linecap="round" /><line x1="169.7143" y1="254.0000" x2="132.0000" y2="390.0000" stroke="#21639a" stroke-width="5.8" stroke-linecap="round" /><line x1="175.8050" y1="124.6300" x2="414.1600" y2="418.5600" stroke="#687889" stroke-width="3.6" stroke-linecap="round" /><line x1="198.0000" y1="152.0000" x2="280.7143" y2="254.0000" stroke="#a34c1f" stroke-width="5.8" stroke-linecap="round" /><line x1="280.7143" y1="254.0000" x2="391.0000" y2="390.0000" stroke="#a34c1f" stroke-width="5.8" stroke-linecap="round" /><line x1="656.3700" y1="124.6300" x2="362.4400" y2="418.5600" stroke="#687889" stroke-width="3.6" stroke-linecap="round" /><line x1="629.0000" y1="152.0000" x2="527.0000" y2="254.0000" stroke="#227365" stroke-width="5.8" stroke-linecap="round" /><line x1="527.0000" y1="254.0000" x2="391.0000" y2="390.0000" stroke="#227365" stroke-width="5.8" stroke-linecap="round" /><text x="120.0000" y="211.0000" font-size="32" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#21639a" text-anchor="middle">6 cm</text><text x="88.0000" y="325.0000" font-size="32" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#21639a" text-anchor="middle">8 cm</text><text x="286.0000" y="212.0000" font-size="32" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#a34c1f" text-anchor="middle">x cm</text><text x="273.0000" y="330.0000" font-size="32" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#a34c1f" text-anchor="middle">10 cm</text><text x="517.0000" y="204.0000" font-size="32" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#227365" text-anchor="middle">y cm</text><text x="550.0000" y="329.0000" font-size="32" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#227365" text-anchor="middle">12 cm</text><circle cx="391" cy="390" r="5.2" fill="#293b4b" /><circle cx="169.71428571428572" cy="254" r="5.2" fill="#293b4b" /><circle cx="527" cy="254" r="5.2" fill="#293b4b" /><circle cx="280.7142857142857" cy="254" r="5.2" fill="#293b4b" /><circle cx="629" cy="152" r="5.2" fill="#293b4b" /><circle cx="198" cy="152" r="5.2" fill="#293b4b" /><circle cx="132" cy="390" r="5.2" fill="#293b4b" /></svg>
