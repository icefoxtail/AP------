<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 744 526" width="744" height="526" role="img" aria-labelledby="title desc"><title id="title">서로 같은 모양의 다섯 장 카드</title><desc id="desc">흰색 카드 다섯 장은 같은 크기로 놓여 있다. 위쪽의 카드 위치는 왼쪽부터 1, 2, 3이며 아래쪽에는 4, 5가 놓여 있다.</desc><rect width="744" height="526" fill="white" /><rect x="91" y="41" width="152" height="187" rx="17" fill="white" stroke="#202020" stroke-width="4.75" /><text x="167.0000" y="158.0000" font-size="62" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#293b4b" text-anchor="middle">1</text><rect x="296" y="41" width="152" height="187" rx="17" fill="white" stroke="#202020" stroke-width="4.75" /><text x="372.0000" y="158.0000" font-size="62" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#293b4b" text-anchor="middle">2</text><rect x="501" y="41" width="152" height="187" rx="17" fill="white" stroke="#202020" stroke-width="4.75" /><text x="577.0000" y="158.0000" font-size="62" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#293b4b" text-anchor="middle">3</text><rect x="193" y="272" width="152" height="187" rx="17" fill="white" stroke="#202020" stroke-width="4.75" /><text x="269.0000" y="389.0000" font-size="62" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#293b4b" text-anchor="middle">4</text><rect x="398" y="272" width="152" height="187" rx="17" fill="white" stroke="#202020" stroke-width="4.75" /><text x="474.0000" y="389.0000" font-size="62" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#293b4b" text-anchor="middle">5</text></svg>
