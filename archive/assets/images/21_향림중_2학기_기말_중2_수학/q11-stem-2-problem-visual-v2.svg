<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 747 553" width="747" height="553" role="img" aria-labelledby="title desc"><title id="title">각 이등분선과 평행한 보조선</title><desc id="desc">삼각형 ABC에서 AD가 각 A를 두 같은 각으로 나눈다. C에서 AD와 평행하게 그은 선이 BA의 연장선과 점 E에서 만난다.</desc><rect width="747" height="553" fill="white" /><line x1="376.8545" y1="271.7828" x2="209.8145" y2="506.6828" stroke="#21639a" stroke-width="5.15" stroke-linecap="round" /><line x1="209.8145" y1="506.6828" x2="523.0145" y2="506.6828" stroke="#21639a" stroke-width="5.15" stroke-linecap="round" /><line x1="523.0145" y1="506.6828" x2="376.8545" y2="271.7828" stroke="#21639a" stroke-width="5.15" stroke-linecap="round" /><line x1="376.8545" y1="271.7828" x2="369.6237" y2="506.6828" stroke="#227365" stroke-width="5.6" stroke-linecap="round" /><path d="M 350.7759 308.4558 A 45 45 0 0 0 375.4699 316.7615" stroke="#a34c1f" stroke-width="2.25" fill="none" /><path d="M 375.4699 316.7615 A 45 45 0 0 0 400.6281 309.9903" stroke="#a34c1f" stroke-width="2.25" fill="none" /><line x1="376.8545" y1="271.7828" x2="537.1855" y2="46.3172" stroke="#687889" stroke-width="4.2" stroke-linecap="round" stroke-dasharray="10 6" /><line x1="523.0145" y1="506.6828" x2="537.1855" y2="46.3172" stroke="#227365" stroke-width="5.5" stroke-linecap="round" /><polygon points="374.7037,341.6535 380.2086,357.8305 368.2143,357.4613" fill="#227365" /><polygon points="532.6750,192.8462 538.1799,209.0233 526.1856,208.6541" fill="#227365" /><circle cx="376.8544746328207" cy="271.7827700475959" r="4.9" fill="#28364b" /><text x="376.8545" y="252.7828" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">A</text><circle cx="209.81447463282072" cy="506.6827700475959" r="4.9" fill="#28364b" /><text x="192.8145" y="529.6828" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">B</text><circle cx="523.0144746328208" cy="506.6