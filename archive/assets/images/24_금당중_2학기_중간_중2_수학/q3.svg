<svg xmlns="http://www.w3.org/2000/svg" width="520" height="330" viewBox="0 0 520 330" role="img" aria-labelledby="title desc">
  <title id="title">삼각형의 중점연결정리 그림</title>
  <desc id="desc">삼각형 ABC에서 M은 AB의 중점이고 MN은 BC와 평행이다. AB는 7, BC는 11이며 AM과 MN은 각각 x와 y로 표시되어 있다.</desc>
  <rect width="520" height="330" fill="white"/>
  <g fill="none" stroke="#111" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M260 35 L75 285 L445 285 Z"/>
    <path d="M168 160 L352 160"/>
  </g>
  <g fill="#111" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="22">
    <text x="251" y="25">A</text><text x="50" y="310">B</text><text x="450" y="310">C</text>
    <text x="140" y="154">M</text><text x="360" y="154">N</text>
    <text x="173" y="85" font-style="italic">x</text><text x="254" y="150" font-style="italic">y</text>
    <text x="83" y="208">AB=7</text><text x="238" y="315">BC=11</text>
  </g>
  <g stroke="#111" stroke-width="2">
    <path d="M162 151 l12 9 M168 143 l12 9 M346 151 l12 9 M352 143 l12 9"/>
    <path d="M245 280 l10 10 M260 280 l10 10"/>
  </g>
</svg>
