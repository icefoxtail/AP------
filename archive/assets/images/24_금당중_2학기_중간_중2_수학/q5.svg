<svg xmlns="http://www.w3.org/2000/svg" width="520" height="360" viewBox="0 0 520 360" role="img" aria-labelledby="title desc">
  <title id="title">평행선과 닮음 그림</title>
  <desc id="desc">A를 꼭짓점으로 하고 D, B, A와 A, C, E가 각각 한 직선 위에 있으며 BC와 DE가 평행인 그림이다. AD는 12, DB는 4, DE는 9, CE는 3이다.</desc>
  <rect width="520" height="360" fill="white"/>
  <g fill="none" stroke="#111" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M260 30 L55 315 M260 30 L465 315"/>
    <path d="M120 225 L400 225 M55 315 L465 315"/>
  </g>
  <g fill="#111" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="22">
    <text x="251" y="24">A</text><text x="96" y="220">B</text><text x="408" y="220">C</text>
    <text x="30" y="342">D</text><text x="470" y="342">E</text>
    <text x="105" y="132">AD=12</text><text x="55" y="277">DB=4</text>
    <text x="230" y="348">DE=9</text><text x="412" y="278">CE=3</text>
  </g>
  <g stroke="#111" stroke-width="2">
    <path d="M245 218 l12 8 M265 218 l12 8 M245 308 l12 8 M265 308 l12 8"/>
  </g>
</svg>
