<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 330" role="img" aria-labelledby="title desc">
<title id="title">10번 해설 도형</title><desc id="desc">직사각형을 BE로 접어 C가 C'로 이동할 때 BC와 BC'가 같음을 이용하는 그림</desc>
<g fill="none" stroke="#222" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
<rect x="45" y="45" width="250" height="200"/><path d="M45 245 L295 120"/><path d="M45 245 L195 45"/><path d="M195 45 L295 120" stroke-dasharray="6 5"/>
<path d="M45 53 L53 53 L53 45"/>
</g>
<g fill="#222" font-family="sans-serif" font-size="15">
<text x="30" y="40">A</text><text x="30" y="266">B</text><text x="300" y="266">C</text><text x="300" y="40">D</text>
<text x="302" y="123">E</text><text x="183" y="37">C'</text>
<text x="7" y="152">8</text><text x="157" y="267">10</text><text x="241" y="74">DE=3</text>
<text x="93" y="132">BC'=10</text><text x="109" y="64">AC'=6</text><text x="213" y="62">DC'=4</text>
<text x="35" y="304">접기: BC'=BC=10 → 6²+8²=10² → AC'=6 → DC'=10-6=4</text>
</g></svg>