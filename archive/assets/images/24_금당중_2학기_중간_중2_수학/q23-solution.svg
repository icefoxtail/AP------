<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 340" role="img" aria-labelledby="title desc">
<title id="title">23번 해설 도형</title><desc id="desc">사다리꼴에서 AD, EF, BC가 평행이고 대각선과 EF의 교점 P,Q를 이용해 PQ를 구하는 그림</desc>
<g fill="none" stroke="#222" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
<path d="M105 45 L255 45 L320 285 L45 285 Z"/><path d="M105 45 L320 285 M45 285 L255 45"/>
<path d="M65 205 L298.33 205"/>
</g>
<g fill="#222" font-family="sans-serif" font-size="15">
<text x="94" y="36">A</text><text x="31" y="304">B</text><text x="322" y="304">C</text><text x="258" y="36">D</text>
<text x="51" y="202">E</text><text x="300" y="202">F</text><text x="116" y="202">P</text><text x="237" y="202">Q</text>
<text x="161" y="35">AD=6</text><text x="162" y="309">BC=15</text><text x="47" y="118">AE=8</text><text x="26" y="251">EB=4</text>
<text x="75" y="227">EP=2</text><text x="176" y="227">PQ=8</text><text x="249" y="227">EQ=10</text>
<text x="25" y="331">EP=2, EQ=10 이므로 PQ=EQ-EP=8</text>
</g></svg>