<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 350" role="img" aria-labelledby="title desc">
<title id="title">23번 해설 도형</title><desc id="desc">사다리꼴에서 AD, EF, BC가 평행이고 AE:EB=8:4일 때 EP=2, EQ=10, PQ=8이 실제 길이비와 일치하는 그림</desc>
<g fill="none" stroke="#222" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
<path d="M120 45 L228 45 L315 285 L45 285 Z"/>
<path d="M120 45 L315 285 M45 285 L228 45"/>
<path d="M70 205 L286 205"/>
</g>
<g fill="#222" font-family="sans-serif" font-size="15">
<text x="109" y="36">A</text><text x="31" y="304">B</text><text x="318" y="304">C</text><text x="232" y="36">D</text>
<text x="56" y="202">E</text><text x="289" y="202">F</text><text x="99" y="202">P</text><text x="252" y="202">Q</text>
<text x="174" y="35">AD=6</text><text x="180" y="309">BC=15</text><text x="55" y="118">AE=8</text><text x="30" y="251">EB=4</text>
<text x="84" y="227">EP=2</text><text x="166" y="227">PQ=8</text><text x="241" y="227">EQ=10</text>
<text x="200" y="337" text-anchor="middle" font-size="14">PQ=EQ-EP=10-2=8</text>
</g></svg>