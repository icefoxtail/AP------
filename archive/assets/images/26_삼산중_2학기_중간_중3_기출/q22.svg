<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" role="img" aria-labelledby="svg-title-b7af235922" aria-describedby="svg-desc-b7af235922"><title id="svg-title-b7af235922">기울어진 탑의 높이를 구하는 시선각</title><desc id="svg-desc-b7af235922">A와 탑 밑 B의 거리는 60m, 탑의 기울기는 4°이고 A에서 꼭대기 C를 올려다본 각은 45°이다. 지면에서 C까지의 높이를 묻고 tan86°=14를 사용한다.</desc><rect width="100%" height="100%" fill="#fff"/><line x1="100" y1="550" x2="760" y2="550" stroke="#111" stroke-width="3"/><line x1="510" y1="550" x2="486" y2="214" stroke="#111" stroke-width="7"/><line x1="150" y1="550" x2="486" y2="214" stroke="#111" stroke-width="2" stroke-dasharray="7 6"/><line x1="486" y1="214" x2="486" y2="550" stroke="#111" stroke-width="2" stroke-dasharray="7 6"/><path d="M486 525h25v25" fill="none" stroke="#111" stroke-width="3"/><text x="135" y="580" font-family="serif" font-size="23" text-anchor="middle" fill="#111">A</text><text x="530" y="580" font-family="serif" font-size="23" text-anchor="middle" fill="#111">B</text><text x="475" y="205" font-family="serif" font-size="23" text-anchor="middle" fill="#111">C</text><text x="318" y="580" font-family="serif" font-size="20" text-anchor="middle" fill="#111">60m</text><text x="500" y="310" font-family="serif" font-size="20" text-anchor="middle" fill="#111">4°</text><text x="230" y="525" font-family="serif" font-size="20" text-anchor="middle" fill="#111">45°</text><text x="475" y="575" font-family="serif" font-size="23" text-anchor="middle" fill="#111">D</text></svg>