<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="svg-title-ce21a44e4a" aria-describedby="svg-desc-ce21a44e4a"><title id="svg-title-ce21a44e4a">서로 수직인 평행현의 길이 조건</title><desc id="svg-desc-ce21a44e4a">원 O 안의 두 쌍의 평행현 AB,CD와 EF,GH는 각각 같은 길이이다. AB⊥EF, 두 평행현 쌍 사이의 거리는 각각 10cm, 6cm이며 AB=24cm일 때 EF의 길이를 묻는다.</desc><rect width="100%" height="100%" fill="#fff"/><circle cx="450" cy="250" r="145" fill="none" stroke="#111" stroke-width="3"/><line x1="375" y1="108" x2="375" y2="392" stroke="#111" stroke-width="3"/><line x1="525" y1="108" x2="525" y2="392" stroke="#111" stroke-width="3"/><line x1="120" y1="205" x2="780" y2="205" stroke="#111" stroke-width="3"/><line x1="120" y1="295" x2="780" y2="295" stroke="#111" stroke-width="3"/><line x1="365" y1="205" x2="385" y2="205" stroke="#111" stroke-width="2"/><line x1="515" y1="205" x2="535" y2="205" stroke="#111" stroke-width="2"/><line x1="375" y1="195" x2="375" y2="215" stroke="#111" stroke-width="2"/><line x1="525" y1="195" x2="525" y2="215" stroke="#111" stroke-width="2"/><text x="355" y="100" font-family="serif" font-size="23" text-anchor="middle" fill="#111">A</text><text x="355" y="425" font-family="serif" font-size="23" text-anchor="middle" fill="#111">B</text><text x="545" y="100" font-family="serif" font-size="23" text-anchor="middle" fill="#111">C</text><text x="545" y="425" font-family="serif" font-size="23" text-anchor="middle" fill="#111">D</text><text x="95" y="212" font-family="serif" font-size="23" text-anchor="middle" fill="#111">E</text><text x="805" y="212" font-family="serif" font-size="23" text-anchor="middle" fill="#111">F</text><text x="95" y="320" font-family="serif" font-size="23" text-anchor="middle" fill="#111">G</text><text x="805" y="320" font-family="serif" font-size="23" text-anchor="middle" fill="#111">H</text><text x="450" y="192" font-family="serif" font-size="20" text-anchor="middle" fill="#111">10cm</text><text x="765" y="263" font-family="serif" font-size="20" text-anchor="middle" fill="#111">6cm</text><text x="350" y="275" font-family="serif" font-size="20" text-anchor="middle" fill="#111">24cm</text></svg>