<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500" role="img" aria-labelledby="title desc"><title id="title">직각삼각형 ABC의 삼각비</title><desc id="desc">C가 직각이고 AB가 빗변이며, A의 각은 a도, 빗변 AB의 길이는 루트 13이다.</desc><rect width="900" height="500" fill="#fff"/><line x1="180" y1="390" x2="660" y2="390" stroke="#111" stroke-width="3"/><line x1="660" y1="390" x2="660" y2="70" stroke="#111" stroke-width="3"/><line x1="180" y1="390" x2="660" y2="70" stroke="#111" stroke-width="3"/><path d="M630 390v-25h30" fill="none" stroke="#111" stroke-width="3"/><path d="M240 390A60 60 0 0 0 230 357" fill="none" stroke="#111" stroke-width="2.5"/><text x="270" y="365" font-family="serif" font-size="26" fill="#111">a°</text><rect x="394" y="206" width="92" height="36" rx="4" fill="#fff"/><text x="440" y="232" font-family="serif" font-size="26" text-anchor="middle" fill="#111">√13</text><text x="158" y="424" font-family="serif" font-size="26" text-anchor="middle" fill="#111">A</text><text x="684" y="424" font-family="serif" font-size="26" text-anchor="middle" fill="#111">C</text><text x="684" y="64" font-family="serif" font-size="26" text-anchor="middle" fill="#111">B</text></svg>