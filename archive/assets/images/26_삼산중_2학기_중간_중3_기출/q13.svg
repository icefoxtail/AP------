<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="svg-title-47f8c35a6a" aria-describedby="svg-desc-47f8c35a6a"><title id="svg-title-47f8c35a6a">사각형 ABCD의 변과 내각 조건</title><desc id="svg-desc-47f8c35a6a">사각형 ABCD에서 AB=DA=4√2, BC=4√3, CD=6√2−2√6이며, ∠B=120°, ∠C=135°이다. 이 조건으로 넓이를 구한다.</desc><rect width="100%" height="100%" fill="#fff"/><line x1="450" y1="100" x2="274" y2="202" stroke="#111" stroke-width="3"/><line x1="274" y1="202" x2="515" y2="266" stroke="#111" stroke-width="3"/><line x1="515" y1="266" x2="626" y2="202" stroke="#111" stroke-width="3"/><line x1="626" y1="202" x2="450" y2="100" stroke="#111" stroke-width="3"/><text x="450" y="78" font-family="serif" font-size="23" text-anchor="middle" fill="#111">A</text><text x="254" y="215" font-family="serif" font-size="23" text-anchor="middle" fill="#111">B</text><text x="515" y="294" font-family="serif" font-size="23" text-anchor="middle" fill="#111">C</text><text x="645" y="215" font-family="serif" font-size="23" text-anchor="middle" fill="#111">D</text><text x="345" y="143" font-family="serif" font-size="20" text-anchor="middle" fill="#111">4√2</text><text x="355" y="250" font-family="serif" font-size="20" text-anchor="middle" fill="#111">4√3</text><text x="570" y="255" font-family="serif" font-size="18" text-anchor="middle" fill="#111">6√2−2√6</text><text x="555" y="142" font-family="serif" font-size="20" text-anchor="middle" fill="#111">4√2</text><text x="450" y="145" font-family="serif" font-size="19" text-anchor="middle" fill="#111">120°</text><text x="515" y="240" font-family="serif" font-size="19" text-anchor="middle" fill="#111">135°</text></svg>