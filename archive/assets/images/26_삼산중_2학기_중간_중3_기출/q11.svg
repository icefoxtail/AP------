<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="svg-title-9876440023" aria-describedby="svg-desc-9876440023"><title id="svg-title-9876440023">삼각형의 넓이와 한 변의 길이</title><desc id="svg-desc-9876440023">삼각형 ABC의 넓이는 3√3cm², AB=4√3cm, ∠A=30°이다. 이 조건이 표시된 삼각형에서 BC의 길이를 묻는다.</desc><rect width="100%" height="100%" fill="#fff"/><line x1="170" y1="380" x2="503" y2="380" stroke="#111" stroke-width="3"/><line x1="170" y1="380" x2="295" y2="308" stroke="#111" stroke-width="3"/><line x1="295" y1="308" x2="503" y2="380" stroke="#111" stroke-width="3"/><path d="M205 380 A35 35 0 0 0 200 362" fill="none" stroke="#111" stroke-width="2"/><text x="150" y="410" font-family="serif" font-size="23" text-anchor="middle" fill="#111">A</text><text x="520" y="410" font-family="serif" font-size="23" text-anchor="middle" fill="#111">B</text><text x="295" y="290" font-family="serif" font-size="23" text-anchor="middle" fill="#111">C</text><text x="335" y="420" font-family="serif" font-size="23" text-anchor="middle" fill="#111">4√3</text><text x="220" y="365" font-family="serif" font-size="20" text-anchor="middle" fill="#111">30°</text></svg>