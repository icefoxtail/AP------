<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="svg-title-2be3d4cb80" aria-describedby="svg-desc-2be3d4cb80"><title id="svg-title-2be3d4cb80">평행사변형의 대각선과 두 색칠 삼각형</title><desc id="svg-desc-2be3d4cb80">평행사변형 ABCD에서 대각선은 O에서 만난다. ∠A:∠B=5:10, BC=12cm, CD=8cm이며, 색칠된 두 부분은 △ADO와 △BOC이다. 두 삼각형의 넓이 합을 묻는다.</desc><rect width="100%" height="100%" fill="#fff"/><polygon points="300,300 380,160 620,160 540,300" fill="none" stroke="#111" stroke-width="3"/><polygon points="380,160 620,160 460,230" fill="#bbb" stroke="none"/><polygon points="300,300 540,300 460,230" fill="#bbb" stroke="none"/><line x1="300" y1="300" x2="620" y2="160" stroke="#111" stroke-width="3"/><line x1="380" y1="160" x2="540" y2="300" stroke="#111" stroke-width="3"/><text x="285" y="325" font-family="serif" font-size="23" text-anchor="middle" fill="#111">B</text><text x="372" y="140" font-family="serif" font-size="23" text-anchor="middle" fill="#111">A</text><text x="635" y="155" font-family="serif" font-size="23" text-anchor="middle" fill="#111">D</text><text x="555" y="325" font-family="serif" font-size="23" text-anchor="middle" fill="#111">C</text><text x="460" y="220" font-family="serif" font-size="23" text-anchor="middle" fill="#111">O</text><text x="500" y="145" font-family="serif" font-size="20" text-anchor="middle" fill="#111">8cm</text><text x="420" y="330" font-family="serif" font-size="20" text-anchor="middle" fill="#111">12cm</text></svg>