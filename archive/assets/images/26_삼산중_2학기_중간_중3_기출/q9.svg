<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="svg-title-eb4d3cf63a" aria-describedby="svg-desc-eb4d3cf63a"><title id="svg-title-eb4d3cf63a">높이 3m 공간에서 높이 2m인 거울점의 빛 반사</title><desc id="svg-desc-eb4d3cf63a">높이 3m인 직사각형 공간에서 거울이 있는 벽면의 B는 바닥에서 2m 높이에 있다. 바닥의 A에서 수평선과 30°를 이루도록 쏜 빛이 B에서 반사되어 천장 C에 닿으며, 입사각과 반사각은 같다. AC의 길이를 구하는 상황이다.</desc><rect width="100%" height="100%" fill="#fff"/><line x1="160" y1="400" x2="700" y2="400" stroke="#111" stroke-width="3"/><line x1="160" y1="150" x2="700" y2="150" stroke="#111" stroke-width="3"/><line x1="160" y1="150" x2="160" y2="400" stroke="#111" stroke-width="3"/><line x1="700" y1="150" x2="700" y2="400" stroke="#111" stroke-width="7"/><line x1="411" y1="400" x2="700" y2="233" stroke="#111" stroke-width="3"/><line x1="700" y1="233" x2="556" y2="150" stroke="#111" stroke-width="3"/><path d="M676 400v-24h24M676 150v24h24" fill="none" stroke="#111" stroke-width="3"/><text x="320" y="270" font-family="serif" font-size="23" text-anchor="middle" fill="#111">3m</text><text x="725" y="330" font-family="serif" font-size="20" text-anchor="middle" fill="#111">2m</text><text x="395" y="420" font-family="serif" font-size="23" text-anchor="middle" fill="#111">A</text><text x="720" y="240" font-family="serif" font-size="23" text-anchor="middle" fill="#111">B</text><text x="548" y="142" font-family="serif" font-size="23" text-anchor="middle" fill="#111">C</text><text x="495" y="350" font-family="serif" font-size="20" text-anchor="middle" fill="#111">30°</text></svg>