<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="svg-title-b5a4842263" aria-describedby="svg-desc-b5a4842263"><title id="svg-title-b5a4842263">이등변삼각형의 각과 각의 이등분선</title><desc id="svg-desc-b5a4842263">AB=AC인 △ABC에서 BC=1, ∠A=36°이다. ∠B의 이등분선과 AC의 교점을 D라 할 때 sin18°의 값을 묻는다.</desc><rect width="100%" height="100%" fill="#fff"/><line x1="330" y1="450" x2="570" y2="450" stroke="#111" stroke-width="3"/><line x1="330" y1="450" x2="450" y2="70" stroke="#111" stroke-width="3"/><line x1="450" y1="70" x2="570" y2="450" stroke="#111" stroke-width="3"/><line x1="330" y1="450" x2="525" y2="307" stroke="#111" stroke-width="3"/><text x="310" y="478" font-family="serif" font-size="23" text-anchor="middle" fill="#111">B</text><text x="590" y="478" font-family="serif" font-size="23" text-anchor="middle" fill="#111">C</text><text x="450" y="55" font-family="serif" font-size="23" text-anchor="middle" fill="#111">A</text><text x="535" y="300" font-family="serif" font-size="23" text-anchor="middle" fill="#111">D</text><text x="450" y="166" font-family="serif" font-size="20" text-anchor="middle" fill="#111">36°</text><text x="450" y="485" font-family="serif" font-size="20" text-anchor="middle" fill="#111">1</text></svg>