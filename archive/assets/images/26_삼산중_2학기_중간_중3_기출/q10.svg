<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="svg-title-b52d83e932" aria-describedby="svg-desc-b52d83e932"><title id="svg-title-b52d83e932">두 각으로 나눈 배구공의 경로</title><desc id="svg-desc-b52d83e932">배구공은 A에서 네트 상단 D에 맞은 뒤 바닥의 B로 이동한다. A의 높이는 2.5m, 네트 높이는 2m이며, 경로 AD의 각은 30°, DB의 각은 45°로 표시되어 있다.</desc><rect width="100%" height="100%" fill="#fff"/><line x1="100" y1="400" x2="820" y2="400" stroke="#111" stroke-width="3"/><line x1="510" y1="400" x2="510" y2="210" stroke="#111" stroke-width="6"/><line x1="428" y1="163" x2="510" y2="210" stroke="#111" stroke-width="3"/><line x1="510" y1="210" x2="700" y2="400" stroke="#111" stroke-width="3"/><line x1="180" y1="163" x2="180" y2="400" stroke="#111" stroke-width="2" stroke-dasharray="6 6"/><text x="165" y="150" font-family="serif" font-size="23" text-anchor="middle" fill="#111">A</text><text x="710" y="425" font-family="serif" font-size="23" text-anchor="middle" fill="#111">B</text><text x="525" y="200" font-family="serif" font-size="23" text-anchor="middle" fill="#111">D</text><text x="145" y="300" font-family="serif" font-size="20" text-anchor="middle" fill="#111">2.5m</text><text x="540" y="315" font-family="serif" font-size="20" text-anchor="middle" fill="#111">2m</text><text x="465" y="185" font-family="serif" font-size="20" text-anchor="middle" fill="#111">30°</text><text x="650" y="375" font-family="serif" font-size="20" text-anchor="middle" fill="#111">45°</text></svg>