<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 320" role="img" aria-label="내접사각형의 두 외부각 50도와 20도로 x=55도를 구하는 그림">
<style>text{font-family:Arial,'Noto Sans KR',sans-serif;font-size:16px;fill:#111}.s{stroke:#111;stroke-width:2.3;fill:none;stroke-linecap:round;stroke-linejoin:round}.pt{fill:#111}.note{font-size:15px}</style>
<circle class="s" cx="180" cy="165" r="65"/>
<!-- cyclic points: A(100°), B(220°), C(350°), D(70°=430°) -->
<line class="s" x1="168.713" y1="100.987" x2="130.207" y2="206.781"/>
<line class="s" x1="130.207" y1="206.781" x2="244.013" y2="176.287"/>
<line class="s" x1="244.013" y1="176.287" x2="202.231" y2="103.920"/>
<line class="s" x1="202.231" y1="103.920" x2="168.713" y2="100.987"/>
<!-- F is intersection of BA and CD extensions -->
<line class="s" x1="130.207" y1="206.781" x2="181.018" y2="67.178"/>
<line class="s" x1="244.013" y1="176.287" x2="181.018" y2="67.178"/>
<!-- E is intersection of AD and BC extensions -->
<line class="s" x1="168.713" y1="100.987" x2="437.328" y2="124.488"/>
<line class="s" x1="130.207" y1="206.781" x2="437.328" y2="124.488"/>
<circle class="pt" cx="168.713" cy="100.987" r="3"/><text x="150" y="96">A</text>
<circle class="pt" cx="130.207" cy="206.781" r="3"/><text x="111" y="218">B</text>
<circle class="pt" cx="244.013" cy="176.287" r="3"/><text x="248" y="193">C</text>
<circle class="pt" cx="202.231" cy="103.920" r="3"/><text x="207" y="99">D</text>
<circle class="pt" cx="181.018" cy="67.178" r="3"/><text x="174" y="53">F</text>
<circle class="pt" cx="437.328" cy="124.488" r="3"/><text x="445" y="129">E</text>
<text x="164" y="79">50°</text><text x="399" y="119">20°</text><text x="142" y="190">x=55°</text>
<text class="note" x="285" y="274" text-anchor="middle">A+D=230°, C+D=200°, A+C=180°</text>
<text class="note" x="285" y="296" text-anchor="middle">→ A=105°, D=125°, B=x=55°</text>
</svg>