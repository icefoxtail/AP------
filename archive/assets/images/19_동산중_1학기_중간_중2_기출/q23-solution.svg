<svg xmlns="http://www.w3.org/2000/svg" width="512" height="190" viewBox="0 0 512 190" role="img" aria-labelledby="visual-title visual-desc" data-composite="composite-panels-v1"><title id="visual-title">−2(x−5a)≤7a+3에서 −2x≤−3a+3이고 양변을 −2로 나누면 x≥(3a−3)/2이다. 음의 정수가 존재하지 않으려면 해의 가장 작은 값 (3a−3)/2가 −1보다 커야 한다. (3a−3)/2&gt;−1에서 3a&gt;1이므로 a&gt;1/3이다. 수직선은 a의 범위를 나타낸다.</title><desc id="visual-desc">수직선 위에 1/3보다 큰 수 전체가 오른쪽으로 뻗은 구간이 있고 1/3에는 속이 빈 점이 있다.</desc><g id="p1-caption" data-role="caption" data-panel="1" data-font-px="22.6"><g id="p1-p1-caption-text" transform="translate(178.256 37.6376)" data-label-kind="CAPTION" data-owner="panel-1" data-fragment-sha="sha256:88e3515968efadfdffc09d22e2f2b1f77e5d3d51983c0ebe87c662cf11a964ac"><svg xmlns="http://www.w3.org/2000/svg" width="155.488" height="32.7248" viewBox="0 0 155.488 32.7248" data-outline-width="155.488" data-outline-height="32.7248" id="lb-b602cdd61aac9e5589e2983cfc1c8117ca4dc6e967ed45b481a511dcd02ec129" data-owner="panel-1" data-fact-role="GIVEN"><path d="M9.98920 9.92140L9.98920 8.61060L10.64460 8.61060L10.64460 9.92140Q10.64460 11.05140 10.12480 12.00060Q9.60500 12.94980 8.75750 13.70690Q7.91000 14.46400 6.88170 15.02900Q5.85340 15.59400 4.80250 15.96690Q3.75160 16.33980 2.84760 16.52060L2.84760 16.52060L2.50860 15.91040Q3.29960 15.77480 4.29400 15.43580Q5.28840 15.09680 6.29410 14.56570Q7.29980 14.03460 8.13600 13.33400Q8.97220 12.63340 9.48070 11.77460Q9.98920 10.91580 9.98920 9.92140L9.98920 9.92140ZM10.07960 9.92140L10.07960 8.61060L10.71240 8.61060L10.71240 9.92140Q10.71240 10.89320 11.23220 11.74070Q11.75200 12.58820 12.59950 13.28880Q13.44700 13.98940 14.44140 14.53180Q15.43580 15.07420 16.43020 15.42450Q17.42460 15.77480 18.19300 15.91040L18.19300 15.91040L17.85400 16.52060Q16.97260 16.33980 15.93300 15.95560Q14.89340 15.57140 13.85380 14.99510Q12.81420 14.41880 11.96670 13.66170Q11.11920 12.90460 10.59940 11.96670Q10.07960 11.02880 10.07960 9.92140L10.07960 9.92140ZM9.96660 27.73020L9.96660 19.84280L10.