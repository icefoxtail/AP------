<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 350" width="360" height="350" role="img" aria-labelledby="t d"><title id="t">네 정수의 합이 같은 삼각형 배열</title><desc id="d">삼각형의 세 변을 따라 원 안에 수가 놓여 있다. 위 꼭짓점은 3이고 왼쪽 변에는 3, A, −7, 5가, 오른쪽 변에는 3, B, 1, −4가, 아래 변에는 5, 2, −6, −4가 있다. 각 변에 놓인 네 수의 합은 모두 같다.</desc><rect x="0" y="0" width="360" height="350" fill="#ffffff"/><line x1="180" y1="50" x2="50" y2="300" stroke="#202020" stroke-width="2.2" stroke-linecap="round"/><line x1="180" y1="50" x2="310" y2="300" stroke="#202020" stroke-width="2.2" stroke-linecap="round"/><line x1="50" y1="300" x2="310" y2="300" stroke="#202020" stroke-width="2.2" stroke-linecap="round"/><circle cx="180" cy="50" r="25" fill="#fff" stroke="#202020" stroke-width="2.2"/><text x="180" y="57" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="26" text-anchor="middle" fill="#202020">3</text><circle cx="136.67" cy="133.33" r="25" fill="#fff" stroke="#202020" stroke-width="2.2"/><text x="136.67" y="140.33" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="26" text-anchor="middle" font-style="italic" fill="#202020">A</text><circle cx="223.33" cy="133.33" r="25" fill="#fff" stroke="#202020" stroke-width="2.2"/><text x="223.33" y="140.33" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="26" text-anchor="middle" font-style="italic" fill="#202020">B</text><circle cx="93.33" cy="216.67" r="25" fill="#fff" stroke="#202020" stroke-width="2.2"/><text x="93.33" y="223.67" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="24" text-anchor="middle" fill="#202020">−7</text><circle cx="266.67" cy="216.67" r="25" fill="#fff" stroke="#202020" stroke-width="2.2"/><text x="266.67" y="223.67" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="26" text-anchor="middle" fill="#202020">1</text><circle cx="50" cy="300" r="25" fill="#fff" stroke="#202020" stroke-width="2.2"/><text x="50" y="307" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="26" text-anchor="middle" fill="#202020">5</text><circle cx="136.67" cy="300" r="25" fill="#fff" stroke="#202020" stroke-width="2.2"/><text x="136.67" y="307" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="26" text-anchor="middle" fill="#202020">2</text><circle cx="223.33" cy="300" r="25" fill="#fff" stroke="#202020" stroke-width="2.2"/><text x="223.33" y="307" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="24" text-anchor="middle" fill="#202020">−6</text><circle cx="310" cy="300" r="25" fill="#fff" stroke="#202020" stroke-width="2.2"/><text x="310" y="307" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="24" text-anchor="middle" fill="#202020">−4</text></svg>
