<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 622 532" width="622" height="532" role="img" aria-labelledby="title desc"><title id="title">서로 안쪽에서 접하는 두 원과 작은 원의 접선</title><desc id="desc">서로 다른 두 원이 오른쪽 끝 B에서 접한다. 큰 원의 중심 O는 작은 원 둘레 위에 있으며 두 중심 사이가 3 cm이다.</desc><rect width="622" height="532" fill="white" /><circle cx="311.0" cy="266.0" r="188.5" fill="none" stroke="#205d9c" stroke-width="3.6" /><circle cx="405.25" cy="266.0" r="94.25" fill="none" stroke="#277339" stroke-width="3.6" /><line x1="122.5000" y1="266.0000" x2="499.5000" y2="266.0000" stroke="#586574" stroke-width="3.4" stroke-linecap="round" /><line x1="122.5000" y1="266.0000" x2="457.6111" y2="147.5203" stroke="#aa5411" stroke-width="4.15" stroke-linecap="round" /><line x1="373.8333" y1="177.1402" x2="499.5000" y2="266.0000" stroke="#205d9c" stroke-width="4.1" stroke-linecap="round" /><line x1="311.0000" y1="298.0000" x2="405.2500" y2="298.0000" stroke="#277339" stroke-width="1.7" stroke-linecap="round" /><line x1="311.0000" y1="292.5000" x2="311.0000" y2="303.5000" stroke="#277339" stroke-width="1.7" stroke-linecap="round" /><line x1="405.2500" y1="292.5000" x2="405.2500" y2="303.5000" stroke="#277339" stroke-width="1.7" stroke-linecap="round" /><text x="381.1250" y="329.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#277339" text-anchor="middle">3 cm</text><circle cx="405.25" cy="266.0" r="4.9" fill="#28364b" /><text x="420.2500" y="253.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">O′</text><circle cx="122.5" cy="266.0" r="4.9" fill="#28364b" /><text x="106.5000" y="274.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">A</text><circle cx="499.5" cy="266.0" r="4.9" fill="#28364b" /><text x="515.5000" y="275.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-