<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 635 545" width="635" height="545" role="img" aria-labelledby="title desc"><title id="title">교차하는 두 현과 서로 마주 보는 호</title><desc id="desc">교점 P의 아래 각은 85도이며 D의 왼쪽 각은 25도이다. 아래의 호 DB에는 길이 4 cm를 표시했다.</desc><rect width="635" height="545" fill="white" /><circle cx="317.5" cy="260.5" r="195.0" fill="none" stroke="#205d9c" stroke-width="3.6" /><line x1="168.1213" y1="135.1564" x2="466.8787" y2="385.8436" stroke="#205d9c" stroke-width="3.75" stroke-linecap="round" /><line x1="134.2599" y1="327.1939" x2="317.5000" y2="65.5000" stroke="#aa5411" stroke-width="3.75" stroke-linecap="round" /><line x1="168.1213" y1="135.1564" x2="134.2599" y2="327.1939" stroke="#586574" stroke-width="3.75" stroke-linecap="round" /><line x1="317.5000" y1="65.5000" x2="466.8787" y2="385.8436" stroke="#586574" stroke-width="3.75" stroke-linecap="round" /><path d="M 134.260 327.194 A 195.0000 195.0000 0 0 0 466.879 385.844" fill="none" stroke="#aa5411" stroke-width="5.4" stroke-linecap="round" /><path d="M 167.5274 279.6831 A 58 58 0 0 0 144.3315 270.0751" stroke="#277339" stroke-width="2.25" fill="none" /><text x="179.9975" y="226.5015" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#277339" text-anchor="middle">25°</text><path d="M 208.5496 221.0973 A 40 40 0 0 0 262.1344 214.0428" stroke="#aa5411" stroke-width="2.25" fill="none" /><text x="241.8905" y="273.7153" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#aa5411" text-anchor="middle">85°</text><text x="300.6386" y="495.5375" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#aa5411" text-anchor="middle">호 DB = 4 cm</text><circle cx="168.1213335917993" cy="135.15641611112477" r="4.9" fill="#28364b" /><text x="154.1213" y="121.1564" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">A</text>