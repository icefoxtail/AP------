<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 685 488" width="685" height="488" role="img" aria-labelledby="title desc"><title id="title">반원에서 원 밖의 두 할선이 이루는 각</title><desc id="desc">지름의 양 끝 A·B와 반원 위 C·D를 연결한 두 직선이 P에서 만난다. 반원 중심의 30도에 대응하는 작은 호는 CD이다.</desc><rect width="685" height="488" fill="white" /><path d="M 86.980 410.500 A 255.5199 255.5199 0 0 1 598.020 410.500" fill="none" stroke="#205d9c" stroke-width="4.5" stroke-linecap="round" /><line x1="86.9801" y1="410.5000" x2="598.0199" y2="410.5000" stroke="#205d9c" stroke-width="4.0" stroke-linecap="round" /><line x1="86.9801" y1="410.5000" x2="342.5000" y2="77.5000" stroke="#586574" stroke-width="3.7" stroke-linecap="round" /><line x1="342.5000" y1="77.5000" x2="598.0199" y2="410.5000" stroke="#586574" stroke-width="3.7" stroke-linecap="round" /><line x1="342.5000" y1="410.5000" x2="276.3666" y2="163.6867" stroke="#aa5411" stroke-width="3.3" stroke-linecap="round" /><line x1="342.5000" y1="410.5000" x2="408.6334" y2="163.6867" stroke="#aa5411" stroke-width="3.3" stroke-linecap="round" /><path d="M 352.0763 374.7607 A 37 37 0 0 0 332.9237 374.7607" stroke="#aa5411" stroke-width="2.25" fill="none" /><text x="341.5000" y="312.5000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#aa5411" text-anchor="middle">30°</text><path d="M 321.1933 105.2674 A 35 35 0 0 0 363.8067 105.2674" stroke="#28364b" stroke-width="2.25" fill="none" /><text x="342.5000" y="139.5000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">x</text><circle cx="86.98011300300618" cy="410.5" r="4.9" fill="#28364b" /><text x="70.9801" y="434.5000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">A</text><circle cx="598.0198869969938" cy="410.5" r="4.9" fill="#28364b" /><text x="614.0199" y="434.5000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">B</text><circle cx="276.366586842734" cy="163.6867420191394" r="4.9" fill="#28364b" /><text x="261.3666" y="151.6867" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">C</text><circle cx="408.633413157266" cy="163.6867420191394" r="4.9" fill="#28364b" /><text x="425.6334" y="153.6867" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">D</text><circle cx="342.5" cy="410.5" r="4.9" fill="#28364b" /><text x="342.5000" y="438.5000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">O</text><circle cx="342.49999999999994" cy="77.5" r="4.9" fill="#28364b" /><text x="342.5000" y="60.5000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">P</text></svg>
