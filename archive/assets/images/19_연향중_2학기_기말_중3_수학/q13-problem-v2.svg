<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 685 511" width="685" height="511" role="img" aria-labelledby="title desc"><title id="title">두 끝점의 접선과 반원의 세 번째 접선</title><desc id="desc">반원의 지름 양 끝에서 세운 두 접선은 각각 4 cm와 9 cm이다. 두 끝점 C, D는 반원을 E에서 스치는 사선 위에 있다.</desc><rect width="685" height="511" fill="white" /><path d="M 123.500 419.750 A 219.0 219.0 0 0 1 561.500 419.750 Z" fill="none" stroke="none" /><path d="M 123.500 419.750 A 219.0 219.0 0 0 1 561.500 419.750" fill="none" stroke="#205d9c" stroke-width="4.55" /><line x1="123.5000" y1="419.7500" x2="561.5000" y2="419.7500" stroke="#205d9c" stroke-width="3.7" stroke-linecap="round" /><line x1="123.5000" y1="419.7500" x2="123.5000" y2="273.7500" stroke="#586574" stroke-width="3.85" stroke-linecap="round" /><line x1="123.5000" y1="273.7500" x2="258.2692" y2="217.5962" stroke="#586574" stroke-width="3.85" stroke-linecap="round" /><line x1="258.2692" y1="217.5962" x2="561.5000" y2="91.2500" stroke="#586574" stroke-width="3.85" stroke-linecap="round" /><line x1="561.5000" y1="91.2500" x2="561.5000" y2="419.7500" stroke="#586574" stroke-width="3.85" stroke-linecap="round" /><line x1="91.5000" y1="419.7500" x2="91.5000" y2="273.7500" stroke="#277339" stroke-width="1.7" stroke-linecap="round" /><line x1="86.0000" y1="419.7500" x2="97.0000" y2="419.7500" stroke="#277339" stroke-width="1.7" stroke-linecap="round" /><line x1="86.0000" y1="273.7500" x2="97.0000" y2="273.7500" stroke="#277339" stroke-width="1.7" stroke-linecap="round" /><text x="46.5000" y="354.7500" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#277339" text-anchor="middle">4 cm</text><line x1="593.5000" y1="91.2500" x2="593.5000" y2="419.7500" stroke="#aa5411" stroke-width="1.7" stroke-linecap="round" /><line x1="599.0000" y1="91.2500" x2="588.0000" y2="91.2500" stroke="#aa5411" stroke-width="1.7" stroke-linecap="round" /><line x1="599.0000" y1="419.7500" x2="588.0000" y2="419.7500" stroke="#aa5411" stroke-wid