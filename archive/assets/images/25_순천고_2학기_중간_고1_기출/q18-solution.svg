<svg xmlns="http://www.w3.org/2000/svg" width="840" height="480" viewBox="0 0 840 480" role="img" aria-labelledby="title desc" data-geometry="coordinate-plane line" data-fact-hash="93da40df2d6f4b239a2933af750345c20d1ddf69501a255f69762723bc7293ff" data-fact-provenance="deterministic-independent-facts" data-style="AP_GEOMETRY_PRINT_V1_1"><title id="title">무게중심과 직선까지의 거리</title><desc id="desc">G(3,1), BC의 중점 M(0,-1), A(9,5), 수선의 발 H(27/10,71/10)를 좌표별로 비교하여 AH를 구한다.</desc><rect width="840" height="480" fill="#fff"/><rect x="16" y="16" width="808" height="448" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><text x="38" y="48" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#0f172a">좌표별 무게중심 조건과 수선의 거리</text><g stroke="#e2e8f0" stroke-width="1"><path d="M84 50H500M84 75H500M84 100H500M84 125H500M84 150H500M84 175H500M84 200H500M84 225H500M84 250H500M84 275H500M84 300H500M84 325H500"/><path d="M84 50V350M116 50V350M148 50V350M180 50V350M212 50V350M244 50V350M276 50V350M308 50V350M340 50V350M372 50V350M404 50V350M436 50V350M468 50V350M500 50V350"/></g><path d="M84 250H510M180 350V42" stroke="#475569" stroke-width="2"/><path d="M500 250l-10-6v12zM180 42l-6 10h12z" fill="#475569"/><g font-family="Arial, sans-serif" font-size="13" fill="#475569"><text x="490" y="270">x</text><text x="190" y="56">y</text><text x="176" y="269">O</text><text x="244" y="269">2</text><text x="340" y="269">5</text><text x="468" y="269">9</text><text x="167" y="226">1</text><text x="163" y="276">−1</text><text x="163" y="126">5</text><text x="163" y="76">7</text></g><path d="M180 275L276 50" stroke="#2563eb" stroke-width="3" data-geometry="line"/><path d="M180 275L468 125" stroke="#f97316" stroke-width="3" data-geometry="segment"/><path d="M468 125L266.4 72.5" stroke="#dc2626" stroke-width="4" data-geometry="segment"/><circle cx="468" cy="125" r="6" fill="#dc2626"/><circle cx="266.4" cy="72.5" r="6" fill="#dc2626"/><circle cx="276" cy="225" r="6" fill="#7c3aed"/><circle cx="180" cy="275" r="6" fill="#16a34a"/><g font-family="Arial, sans-serif" font-size="15" font-weight="700"><text x="476" y="118" fill="#b91c1c">A(9,5)</text><text x="274" y="68" fill="#b91c1c">H(27/10,71/10)</text><text x="284" y="220" fill="#6d28d9">G(3,1)</text><text x="188" y="292" fill="#15803d">M(0,−1)</text></g><rect x="530" y="72" width="270" height="300" rx="12" fill="#fff" stroke="#94a3b8" stroke-width="2"/><g font-family="Arial, sans-serif" fill="#0f172a"><text x="552" y="105" font-size="19" font-weight="700">좌표별 계산</text><text x="552" y="140" font-size="16">M=(u,v), 3u−v−1=0</text><text x="552" y="178" font-size="16">G=(3,1)</text><text x="552" y="212" font-size="16">x_A=9−2u</text><text x="552" y="242" font-size="16">y_A=3−2v</text><text x="552" y="282" font-size="16" fill="#b91c1c">3x_A−y_A−1=21</text><text x="552" y="320" font-size="18" font-weight="700" fill="#b91c1c">AH=21/√10</text><text x="552" y="350" font-size="13" fill="#475569">M은 BC 위, AH⊥BC</text></g><text x="38" y="430" font-family="Arial, sans-serif" font-size="14" fill="#475569">무게중심 조건을 x좌표와 y좌표로 나누어 적용하고, 점 A에서 직선 BC까지의 거리를 계산한다.</text></svg>
