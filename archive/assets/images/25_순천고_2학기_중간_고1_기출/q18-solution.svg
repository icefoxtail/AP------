<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 480" width="840" height="480" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_1" data-geometry-preset="GEOMETRY_STANDARD" data-axis-scale-mode="EQUAL_UNIT" data-scale-policy="EQUAL_SCALE_REQUIRED" data-fact-hash="b61b53af740074a270d238fabbd7262a08a8bf418a862a29708134b6064cb724" data-geometry-fact-hash="b61b53af740074a270d238fabbd7262a08a8bf418a862a29708134b6064cb724" data-visual-provenance="deterministic-independent-facts"><title id="title">무게중심과 직선까지의 거리</title><desc id="desc">G(3,1), BC의 중점 M(0,-1), A(9,5), 수선의 발 H(27/10,71/10)를 동일 축척 좌표평면에 표시하여 AH=21/√10을 확인한다.</desc><rect width="840" height="480" fill="#fff"/><rect x="16" y="16" width="808" height="448" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><text x="38" y="48" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#0f172a">좌표별 무게중심 조건과 수선의 거리</text><rect x="36" y="78" width="430" height="350" rx="12" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><g stroke="#e2e8f0" stroke-width="1"><line x1="50" y1="140" x2="450" y2="140"/><line x1="50" y1="170" x2="450" y2="170"/><line x1="50" y1="200" x2="450" y2="200"/><line x1="50" y1="230" x2="450" y2="230"/><line x1="50" y1="260" x2="450" y2="260"/><line x1="50" y1="290" x2="450" y2="290"/><line x1="50" y1="320" x2="450" y2="320"/><line x1="50" y1="350" x2="450" y2="350"/><line x1="50" y1="380" x2="450" y2="380"/><line x1="50" y1="410" x2="450" y2="410"/><line x1="50" y1="440" x2="450" y2="440"/><line x1="60" y1="120" x2="60" y2="440"/><line x1="90" y1="120" x2="90" y2="440"/><line x1="120" y1="120" x2="120" y2="440"/><line x1="150" y1="120" x2="150" y2="440"/><line x1="180" y1="120" x2="180" y2="440"/><line x1="210" y1="120" x2="210" y2="440"/><line x1="240" y1="120" x2="240" y2="440"/><line x1="270" y1="120" x2="270" y2="440"/><line x1="300" y1="120" x2="300" y2="440"/><line x1="330" y1="120" x2="330" y2="440"/><line x1="360" y1="120" x2="360" y2="440"/><line x1="390" y1="120" x2="390" y2="440"/><line x1="420" y1="120" x2="420" y2="440"/><line x1="450" y1="120" x2="450" y2="440"/></g><line id="axis-x" x1="50" y1="380" x2="450" y2="380" stroke="#475569" stroke-width="2"/><line id="axis-y" x1="120" y1="120" x2="120" y2="440" stroke="#475569" stroke-width="2"/><polygon points="450,380 438,374 438,386" fill="#475569"/><polygon points="120,120 114,132 126,132" fill="#475569"/><g font-family="Arial, sans-serif" font-size="12" fill="#475569"><text x="432" y="398">x</text><text x="128" y="136">y</text><text x="112" y="398">O</text><text x="180" y="398">2</text><text x="270" y="398">5</text><text x="390" y="398">9</text><text x="104" y="350">1</text><text x="99" y="320">2</text><text x="95" y="170">7</text></g><line id="line-bc" x1="120" y1="410" x2="210" y2="140" stroke="#2563eb" stroke-width="3"/><line id="line-ah" x1="390" y1="230" x2="201" y2="167" stroke="#dc2626" stroke-width="4"/><line id="segment-mg" x1="120" y1="410" x2="210" y2="350" stroke="#7c3aed" stroke-width="2.5" stroke-dasharray="7 4"/><polyline points="201,167 219,173 222,164 204,158" fill="none" stroke="#0f172a" stroke-width="1.8"/><circle id="point-m" cx="120" cy="410" r="6" fill="#16a34a"/><circle id="point-g" cx="210" cy="350" r="6" fill="#7c3aed"/><circle id="point-a" cx="390" cy="230" r="6" fill="#dc2626"/><circle id="point-h" cx="201" cy="167" r="6" fill="#dc2626"/><g font-family="Arial, sans-serif" font-size="14" font-weight="700"><text x="128" y="430" fill="#15803d">M(0,−1)</text><text x="218" y="346" fill="#6d28d9">G(3,1)</text><text x="398" y="224" fill="#b91c1c">A(9,5)</text><text x="208" y="161" fill="#b91c1c">H(27/10,71/10)</text></g><rect x="500" y="78" width="300" height="350" rx="12" fill="#fff" stroke="#94a3b8" stroke-width="2"/><g font-family="Arial, sans-serif" fill="#0f172a"><text x="524" y="112" font-size="19" font-weight="700">좌표별 계산</text><text x="524" y="148" font-size="15">M=(u,v), 3u−v−1=0</text><text x="524" y="180" font-size="15">G=(3,1)</text><text x="524" y="214" font-size="15">x_A=9−2u</text><text x="524" y="244" font-size="15">y_A=3−2v</text><line x1="524" y1="262" x2="776" y2="262" stroke="#cbd5e1"/><text x="524" y="296" font-size="14">3x_A−y_A−1=21</text><text x="524" y="332" font-size="18" font-weight="700" fill="#b91c1c">AH=21/√10</text><text x="524" y="368" font-size="13" fill="#475569">BC와 AH의 실제 기울기</text><text x="524" y="392" font-size="13" fill="#475569">3, −1/3은 서로 수직</text></g></svg>
