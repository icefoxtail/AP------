<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" width="640" height="260" role="img" aria-labelledby="title desc">
  <title id="title">두 같은 원의 공통현</title>
  <desc id="desc">중심 (3,4)와 (3,0), 반지름 3인 두 원과 공통현 PQ를 나타낸 그림이다.</desc>
  <rect width="640" height="260" fill="#fff"/>
  <text x="320" y="28" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="22" font-weight="700" fill="#1e3a5f">C₁, C₂의 중심 거리 4  →  PQ=2√5</text>
  <rect x="18" y="44" width="355" height="190" rx="8" fill="#f8fafc" stroke="#dbe3ef"/>
  <line x1="47" y1="166" x2="345" y2="166" stroke="#0f172a" stroke-width="1.3"/><line x1="187" y1="222" x2="187" y2="58" stroke="#0f172a" stroke-width="1.3"/>
  <circle cx="187" cy="111" r="61" fill="#dbeafe" fill-opacity=".55" stroke="#2563eb" stroke-width="2.5"/><circle cx="187" cy="166" r="61" fill="#dcfce7" fill-opacity=".48" stroke="#059669" stroke-width="2.5"/>
  <line x1="126" y1="139" x2="248" y2="139" stroke="#dc2626" stroke-width="2.5"/><line x1="187" y1="111" x2="187" y2="166" stroke="#7c3aed" stroke-width="2" stroke-dasharray="5 4"/>
  <circle cx="187" cy="111" r="4" fill="#2563eb"/><circle cx="187" cy="166" r="4" fill="#059669"/><circle cx="126" cy="139" r="4" fill="#dc2626"/><circle cx="248" cy="139" r="4" fill="#dc2626"/>
  <text x="196" y="105" font-family="Arial, sans-serif" font-size="15" fill="#1d4ed8">C₁(3,4)</text><text x="196" y="184" font-family="Arial, sans-serif" font-size="15" fill="#047857">C₂(3,0)</text><text x="113" y="132" font-family="Arial, sans-serif" font-size="15" fill="#b91c1c">P</text><text x="254" y="136" font-family="Arial, sans-serif" font-size="15" fill="#b91c1c">Q</text><text x="193" y="143" font-family="Arial, sans-serif" font-size="14" fill="#6d28d9">2</text>
  <rect x="393" y="44" width="229" height="190" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="413" y="76" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="18" font-weight="700" fill="#1e3a5f">공통현 길이</text>
  <text x="413" y="113" font-family="Arial, sans-serif" font-size="18">d=4, r=3</text><text x="413" y="148" font-family="Arial, sans-serif" font-size="18">반현=√(9−2²)=√5</text><text x="413" y="183" font-family="Arial, sans-serif" font-size="18">PQ=2√5</text>
  <text x="413" y="218" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="18" font-weight="700" fill="#b91c1c">정답 ⑤</text>
</svg>
