<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" width="640" height="260" role="img" aria-labelledby="title desc" data-scale-policy="SCHEMATIC_ALLOWED">
  <title id="title">직선과 원이 두 점에서 만나는 조건</title>
  <desc id="desc">중심 (1,-2)의 원과 직선 5x-12y+1=0에서 중심과 직선 사이 거리 30/13, 반지름 r의 비교를 나타낸 그림이다.</desc>
  <rect width="640" height="260" fill="#fff"/>
  <text x="320" y="28" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="22" font-weight="700" fill="#1e3a5f">두 교점 조건  d &lt; r</text>
  <rect x="18" y="44" width="350" height="190" rx="8" fill="#f8fafc" stroke="#dbe3ef"/>
  <line x1="48" y1="174" x2="345" y2="174" stroke="#0f172a" stroke-width="1.4"/><line x1="150" y1="224" x2="150" y2="58" stroke="#0f172a" stroke-width="1.4"/>
  <circle cx="184" cy="194" r="63" fill="#dbeafe" fill-opacity=".62" stroke="#2563eb" stroke-width="2.5"/>
  <line x1="52" y1="218" x2="338" y2="99" stroke="#dc2626" stroke-width="2.4"/>
  <line x1="184" y1="194" x2="198" y2="188" stroke="#7c3aed" stroke-width="2" stroke-dasharray="5 4"/>
  <circle cx="184" cy="194" r="4.5" fill="#1d4ed8"/><circle cx="198" cy="188" r="4" fill="#7c3aed"/>
  <text x="191" y="209" font-family="Arial, sans-serif" font-size="15" fill="#1d4ed8">C(1,−2)</text><text x="201" y="181" font-family="Arial, sans-serif" font-size="15" fill="#6d28d9">d=30/13</text><text x="235" y="109" font-family="Arial, sans-serif" font-size="15" fill="#b91c1c">5x−12y+1=0</text>
  <rect x="390" y="44" width="232" height="190" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="410" y="76" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="18" font-weight="700" fill="#1e3a5f">반지름 r의 선별</text>
  <text x="410" y="113" font-family="Arial, sans-serif" font-size="18">d = 30/13</text><text x="410" y="146" font-family="Arial, sans-serif" font-size="18">두 교점 ⇔ r &gt; d</text><text x="410" y="180" font-family="Arial, sans-serif" font-size="18">r = 3부터 가능</text>
  <text x="410" y="218" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="18" font-weight="700" fill="#b91c1c">최솟값 3  →  ③</text>
</svg>
