<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" width="640" height="260" role="img" aria-labelledby="title desc" data-scale-policy="SCHEMATIC_ALLOWED">
  <title id="title">원과 원점을 지나는 직선의 두 교점</title>
  <desc id="desc">원과 원점을 지나는 직선 y=mx의 두 교점 P,Q를 직선 매개변수 t로 나타낸 그림이다.</desc>
  <rect width="640" height="260" fill="#fff"/>
  <text x="320" y="28" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="22" font-weight="700" fill="#1e3a5f">P=(t₁, mt₁),  Q=(t₂, mt₂)</text>
  <rect x="18" y="44" width="355" height="190" rx="8" fill="#f8fafc" stroke="#dbe3ef"/>
  <line x1="43" y1="192" x2="345" y2="192" stroke="#0f172a" stroke-width="1.4"/><line x1="135" y1="223" x2="135" y2="58" stroke="#0f172a" stroke-width="1.4"/>
  <circle cx="205" cy="150" r="75" fill="#dbeafe" fill-opacity=".55" stroke="#2563eb" stroke-width="2.4"/>
  <line x1="70" y1="225" x2="300" y2="74" stroke="#0f766e" stroke-width="2.3"/><line x1="135" y1="192" x2="205" y2="150" stroke="#7c3aed" stroke-width="1.8" stroke-dasharray="5 4"/><line x1="135" y1="192" x2="278" y2="98" stroke="#7c3aed" stroke-width="1.8" stroke-dasharray="5 4"/>
  <circle cx="135" cy="192" r="4" fill="#1d4ed8"/><circle cx="97" cy="217" r="4.5" fill="#dc2626"/><circle cx="278" cy="98" r="4.5" fill="#dc2626"/>
  <text x="123" y="210" font-family="Arial, sans-serif" font-size="16" fill="#1d4ed8">O</text><text x="74" y="216" font-family="Arial, sans-serif" font-size="16" fill="#b91c1c">P</text><text x="284" y="94" font-family="Arial, sans-serif" font-size="16" fill="#b91c1c">Q</text><text x="285" y="78" font-family="Arial, sans-serif" font-size="15" fill="#0f766e">y=mx</text>
  <rect x="393" y="44" width="229" height="190" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="413" y="76" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="18" font-weight="700" fill="#1e3a5f">근과 계수</text>
  <text x="413" y="113" font-family="Arial, sans-serif" font-size="17">(1+m²)t²+…−16=0</text><text x="413" y="148" font-family="Arial, sans-serif" font-size="17">t₁t₂=−16/(1+m²)</text><text x="413" y="183" font-family="Arial, sans-serif" font-size="17">OP·OQ=16</text>
  <text x="413" y="218" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="18" font-weight="700" fill="#b91c1c">정답 16</text>
</svg>
