<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" width="640" height="260" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_1" data-geometry-preset="GEOMETRY_STANDARD" data-axis-scale-mode="SCHEMATIC_EQUAL_PIXEL" data-fact-hash="f9d31eef91b7c9289ebc11cc1047664feadc000820280cad2b41244c7c4e6bc4" data-geometry-fact-hash="f9d31eef91b7c9289ebc11cc1047664feadc000820280cad2b41244c7c4e6bc4" data-visual-provenance="deterministic-python-independent-facts"><title id="title">원과 원점을 지나는 직선의 두 교점</title><desc id="desc">원점을 지나는 직선 y=mx와 원의 실제 교점 P,Q를 표시한 모식도이다. P,Q는 원주 위에 있고 원점은 두 점 사이에 있다.</desc><style>.title{font:700 19px "Noto Sans KR","Malgun Gothic",sans-serif;fill:#1e3a5f}.label{font:15px "Noto Sans KR","Malgun Gothic",sans-serif}.note{font:16px "Noto Sans KR","Malgun Gothic",sans-serif;fill:#334155}</style><rect width="640" height="260" fill="#fff"/><text x="320" y="28" text-anchor="middle" class="title">P=(t₁,mt₁), Q=(t₂,mt₂)</text><rect x="18" y="44" width="355" height="190" rx="8" fill="#f8fafc" stroke="#dbe3ef"/><line x1="43" y1="190" x2="345" y2="190" stroke="#0f172a" stroke-width="1.4"/><line x1="155" y1="232" x2="155" y2="50" stroke="#0f172a" stroke-width="1.4"/><circle data-geometry="circle" data-center-x="205" data-center-y="150" data-radius="80" cx="205" cy="150" r="80" fill="#dbeafe" fill-opacity=".55" stroke="#2563eb" stroke-width="2.4"/><line data-geometry="line" data-equation="y=mx" x1="142.530495244558" y1="199.975603804354" x2="267.469504755442" y2="100.024396195646" stroke="#0f766e" stroke-width="2.3"/><line data-geometry="segment" x1="155" y1="190" x2="142.530495244558" y2="199.975603804354" stroke="#7c3aed" stroke-width="1.8" stroke-dasharray="5 4"/><line data-geometry="segment" x1="155" y1="190" x2="267.469504755442" y2="100.024396195646" stroke="#7c3aed" stroke-width="1.8" stroke-dasharray="5 4"/><circle data-point-label="O" data-point-x="0" data-point-y="0" cx="155" cy="190" r="4" fill="#1d4ed8"/><circle data-point-label="P" data-point-x="t₁" data-point-y="mt₁" cx="142.530495244558" cy="199.975603804354" r="4.5" fill="#dc2626"/><circle data-point-label="Q" data-point-x="t₂" data-point-y="mt₂" cx="267.469504755442" cy="100.024396195646" r="4.5" fill="#dc2626"/><circle data-point-label="C" data-point-x="205" data-point-y="150" cx="205" cy="150" r="3.5" fill="#111827"/><text x="144" y="211" class="label" fill="#1d4ed8">O</text><text x="104" y="220" class="label" fill="#b91c1c">P</text><text x="274" y="95" class="label" fill="#b91c1c">Q</text><text x="212" y="145" class="label" fill="#111827">C</text><rect x="393" y="44" width="229" height="190" rx="8" fill="#eff6ff" stroke="#bfdbfe"/><text x="413" y="76" class="title" font-size="17">근과 계수</text><text x="413" y="113" class="note">t₁,t₂는 서로 다른 부호</text><text x="413" y="148" class="note">P,Q는 원주 위의 점</text><text x="413" y="183" class="note">OP·OQ=16</text><text x="413" y="218" class="note" fill="#b91c1c">정답 16</text></svg>
