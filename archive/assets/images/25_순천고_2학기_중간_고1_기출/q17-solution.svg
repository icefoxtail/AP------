<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" width="640" height="260" role="img" aria-labelledby="title desc" data-scale-policy="SCHEMATIC_ALLOWED">
  <title id="title">접점 현의 좌표</title>
  <desc id="desc">점 A(18,2)에서 중심 (3,2), 반지름 3인 원에 그은 두 접선과 접점 현 PQ, 그 직선 x=18/5를 나타낸 그림이다.</desc>
  <rect width="640" height="260" fill="#fff"/>
  <text x="320" y="28" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="22" font-weight="700" fill="#1e3a5f">접점 현 PQ ⟂ CA  →  x = 18/5</text>
  <rect x="18" y="44" width="355" height="190" rx="8" fill="#f8fafc" stroke="#dbe3ef"/>
  <line x1="45" y1="163" x2="345" y2="163" stroke="#0f172a" stroke-width="1.3"/><line x1="119" y1="220" x2="119" y2="60" stroke="#0f172a" stroke-width="1.3"/>
  <circle cx="170" cy="163" r="53" fill="#dbeafe" fill-opacity=".62" stroke="#2563eb" stroke-width="2.4"/>
  <line x1="119" y1="163" x2="323" y2="163" stroke="#7c3aed" stroke-width="1.8" stroke-dasharray="6 4"/><line x1="154" y1="120" x2="154" y2="206" stroke="#dc2626" stroke-width="2.5"/>
  <line x1="323" y1="163" x2="154" y2="120" stroke="#0f766e" stroke-width="2.2"/><line x1="323" y1="163" x2="154" y2="206" stroke="#f97316" stroke-width="2.2"/>
  <circle cx="170" cy="163" r="4" fill="#1d4ed8"/><circle cx="323" cy="163" r="5" fill="#dc2626"/><circle cx="154" cy="120" r="4" fill="#dc2626"/><circle cx="154" cy="206" r="4" fill="#dc2626"/>
  <text x="177" y="158" font-family="Arial, sans-serif" font-size="15" fill="#1d4ed8">C(3,2)</text><text x="326" y="157" font-family="Arial, sans-serif" font-size="15" fill="#b91c1c">A(18,2)</text><text x="161" y="116" font-family="Arial, sans-serif" font-size="15" fill="#b91c1c">P</text><text x="161" y="222" font-family="Arial, sans-serif" font-size="15" fill="#b91c1c">Q</text><text x="158" y="94" font-family="Arial, sans-serif" font-size="14" fill="#6d28d9">x=18/5</text>
  <rect x="393" y="44" width="229" height="190" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="413" y="76" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="18" font-weight="700" fill="#1e3a5f">대칭 구조</text>
  <text x="413" y="113" font-family="Arial, sans-serif" font-size="17">u=18/5</text><text x="413" y="148" font-family="Arial, sans-serif" font-size="17">P,Q의 x좌표 = u</text><text x="413" y="183" font-family="Arial, sans-serif" font-size="17">합=2u=36/5</text>
  <text x="413" y="218" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="18" font-weight="700" fill="#b91c1c">정답 ④</text>
</svg>
