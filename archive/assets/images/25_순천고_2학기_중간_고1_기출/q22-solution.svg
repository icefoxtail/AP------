<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" width="640" height="280" role="img" aria-labelledby="title desc" data-scale-policy="SCHEMATIC_ALLOWED">
  <title id="title">점과 원에 그은 두 접선</title>
  <desc id="desc">점 (0,6)에서 중심 (2,1), 반지름 2인 원에 그은 두 접선 중 y축과 기울기 m인 접선을 나타낸 그림이다.</desc>
  <rect width="640" height="280" fill="#fff"/>
  <text x="320" y="28" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="22" font-weight="700" fill="#1e3a5f">한 접선은 y축, 다른 접선은 기울기 m</text>
  <rect x="18" y="44" width="360" height="215" rx="8" fill="#f8fafc" stroke="#dbe3ef"/>
  <line x1="58" y1="223" x2="345" y2="223" stroke="#0f172a" stroke-width="1.5"/><line x1="140" y1="244" x2="140" y2="56" stroke="#0f172a" stroke-width="2.2"/>
  <circle cx="205" cy="183" r="42" fill="#dbeafe" fill-opacity=".62" stroke="#2563eb" stroke-width="2.5"/>
  <line x1="140" y1="63" x2="140" y2="223" stroke="#dc2626" stroke-width="2.5"/><line x1="140" y1="63" x2="256" y2="171" stroke="#0f766e" stroke-width="2.4"/>
  <line x1="205" y1="183" x2="163" y2="144" stroke="#7c3aed" stroke-width="2" stroke-dasharray="5 4"/>
  <circle cx="140" cy="63" r="5" fill="#dc2626"/><circle cx="256" cy="171" r="4" fill="#0f766e"/><circle cx="205" cy="183" r="4" fill="#1d4ed8"/>
  <text x="145" y="59" font-family="Arial, sans-serif" font-size="16" fill="#b91c1c">P(0,6)</text><text x="210" y="179" font-family="Arial, sans-serif" font-size="15" fill="#1d4ed8">C(2,1)</text><text x="259" y="168" font-family="Arial, sans-serif" font-size="15" fill="#0f766e">m</text><text x="104" y="126" font-family="Arial, sans-serif" font-size="15" fill="#b91c1c">y축</text>
  <rect x="398" y="44" width="224" height="215" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="418" y="76" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="18" font-weight="700" fill="#1e3a5f">㉠, ㉡</text>
  <text x="418" y="112" font-family="Arial, sans-serif" font-size="17">㉠=x,  ㉡=y</text><text x="418" y="145" font-family="Arial, sans-serif" font-size="17">mx−y+6=0</text><text x="418" y="178" font-family="Arial, sans-serif" font-size="17">|2m+5|/√(m²+1)=2</text>
  <text x="418" y="215" font-family="Arial, sans-serif" font-size="17">m=−21/20</text><text x="418" y="246" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="17" font-weight="700" fill="#b91c1c">서술형 풀이 완성</text>
</svg>
