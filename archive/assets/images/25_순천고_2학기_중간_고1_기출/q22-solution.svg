 data-point-label="A(0,6)" data-point-x="0" data-point-y="6" cx="72" cy="52" r="5" fill="#dc2626"/><circle data-point-label="T₀(0,1)" data-point-x="0" data-point-y="1" cx="72" cy="192" r="4" fill="#dc2626"/><circle data-point-label="T₁(100/29,69/29)" data-point-x="3.4482758621" data-point-y="2.3793103448" cx="168.55" cy="153.38" r="4" fill="#0f766e"/><circle data-point-label="C(2,1)" data-point-x="2" data-point-y="1" cx="128" cy="192" r="4" fill="#1d4ed8"/><text x="78" y="47" class="label" fill="#b91c1c">A(0,6)</text><text x="78" y="187" class="label" fill="#b91c1c">T₀(0,1)</text><text x="174" y="148" class="label" fill="#0f766e">T₁</text><text x="134" y="187" class="label" fill="#1d4ed8">C(2,1)</text><text x="92" y="132" class="label" fill="#b91c1c">y축</text><rect x="398" y="44" width="224" height="215" rx="8" fill="#eff6ff" stroke="#bfdbfe"/><text x="418" y="76" class="title" font-size="17">접선 조건</text><text x="418" y="112" class="note">T₀=(0,1)</text><text x="418" y="142" class="note">T₁=(100/29,69/29)</text><text x="418" y="172" class="note">mx−y+6=0</text><text x="418" y="202" class="note">m=−21/20</text><text x="418" y="236" class="note" fill="#b91c1c">y축이 실제 접선</text></svg>
