<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="720" height="360" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_1" data-geometry-preset="GEOMETRY_STANDARD" data-axis-scale-mode="EQUAL_UNIT" data-fact-hash="69402518fc358b8a0af2951d4893d920e4ad0f54855cddba2b5b83d378d5dae1" data-geometry-fact-hash="69402518fc358b8a0af2951d4893d920e4ad0f54855cddba2b5b83d378d5dae1" data-visual-provenance="deterministic-independent-facts"><title id="title">평행사변형 ABCD의 좌표별 중점 관계</title><desc id="desc">A(1,2), B(-1,-1), D(3,0), 대각선의 공통중점 M(1,-1/2), C(1,-3)을 표시한 좌표평면이다.</desc><rect width="720" height="360" fill="#fff"/><rect x="14" y="14" width="692" height="332" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><text x="32" y="42" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#0f172a">평행사변형의 두 대각선 중점 비교</text><g stroke="#e2e8f0" stroke-width="1"><path d="M56 68H420M56 92H420M56 116H420M56 140H420M56 164H420M56 188H420M56 212H420M56 236H420M56 260H420M56 284H420M56 308H420"/><path d="M56 68V308M80 68V308M104 68V308M128 68V308M152 68V308M176 68V308M200 68V308M224 68V308M248 68V308M272 68V308M296 68V308M320 68V308M344 68V308M368 68V308M392 68V308M416 68V308"/></g><path d="M56 188H432M200 320V56" stroke="#475569" stroke-width="2"/><path d="M432 188l-10-6v12zM200 56l-6 10h12z" fill="#475569"/><g font-family="Arial, sans-serif" font-size="12" fill="#475569"><text x="415" y="205">x</text><text x="209" y="68">y</text><text x="194" y="205">O</text><text x="224" y="205">1</text><text x="272" y="205">3</text><text x="152" y="205">−2</text><text x="188" y="232">−1</text><text x="184" y="280">−3</text></g><path d="M224 140L224 260" stroke="#2563eb" stroke-width="3" data-geometry="segment"/><path d="M176 212L272 188" stroke="#f97316" stroke-width="3" data-geometry="segment"/><path d="M176 212L224 140L272 188L224 260Z" fill="#dbeafe" fill-opacity="0.45" stroke="#64748b" stroke-width="2" data-geometry="polygon"/><circle cx="224" cy="200" r="5" fill="#7c3aed"/><circle cx="224" cy="140" r="5" fill="#dc2626"/><circle cx="176" cy="212" r="5" fill="#16a34a"/><circle cx="272" cy="188" r="5" fill="#16a34a"/><circle cx="224" cy="260" r="5" fill="#dc2626"/><g font-family="Arial, sans-serif" font-size="13" font-weight="700"><text x="232" y="136" fill="#b91c1c">A(1,2)</text><text x="140" y="227" fill="#15803d">B(-1,-1)</text><text x="278" y="184" fill="#15803d">D(3,0)</text><text x="232" y="278" fill="#b91c1c">C(1,-3)</text><text x="232" y="198" fill="#6d28d9">M(1,-1/2)</text></g><rect x="446" y="68" width="240" height="236" rx="12" fill="#fff" stroke="#94a3b8" stroke-width="2"/><g font-family="Arial, sans-serif" fill="#0f172a"><text x="464" y="98" font-size="17" font-weight="700">중점 좌표를 각각 비교</text><text x="464" y="132" font-size="15">M_BD=(1,−1/2)</text><text x="464" y="164" font-size="15">M_AC=(1,−1/2)</text><text x="464" y="200" font-size="15" fill="#b91c1c">(1+x_C)/2=1</text><text x="464" y="228" font-size="15" fill="#b91c1c">(2+y_C)/2=−1/2</text><text x="464" y="264" font-size="16" font-weight="700" fill="#b91c1c">C=(1,−3), ab=−3</text></g><text x="32" y="330" font-family="Arial, sans-serif" font-size="12" fill="#475569">대각선 AC와 BD의 중점을 좌표별로 일치시켜 C를 결정한다.</text></svg>
