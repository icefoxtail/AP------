<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="720" height="360" preserveAspectRatio="xMidYMid meet" role="img" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-geometry-fact-hash="fcac4632b88fae161a44c0590834d31f75f01312a389991e2076f219bef9d535" data-visual-provenance="deterministic-vector-reconstruction" data-axis-scale-mode="EQUAL_UNIT"><title>평행사변형 ABCD의 실제 좌표</title><desc>실제 네 꼭짓점 A, B, C, D를 같은 좌표계에 배치한 평행사변형 해설 도형</desc><style>.axis-label{font:italic 13px "STIX Two Math","Malgun Gothic",serif;fill:#111}.point-label{font:12px "STIX Two Math","Malgun Gothic",serif;font-weight:600}.side-title{font:700 15px "Noto Sans KR","Malgun Gothic",sans-serif;fill:#111827}.side-note{font:11px "Noto Sans KR","Malgun Gothic",sans-serif;fill:#374151}</style><rect width="720" height="360" fill="#fff"/><text x="28" y="32" class="side-title">평행사변형 ABCD의 실제 좌표</text><text x="28" y="51" class="side-note">네 번째 꼭짓점은 C=(1,−3)</text><rect x="24" y="62" width="460" height="263" rx="10" fill="#fff" stroke="#cbd5e1"/><line x1="34" y1="210" x2="474" y2="210" stroke="#111" stroke-width="1.35"/><line x1="210" y1="72" x2="210" y2="315" stroke="#111" stroke-width="1.35"/><line x1="34" y1="150" x2="474" y2="150" stroke="#e5e7eb"/><line x1="34" y1="270" x2="474" y2="270" stroke="#e5e7eb"/><line x1="150" y1="72" x2="150" y2="315" stroke="#e5e7eb"/><line x1="270" y1="72" x2="270" y2="315" stroke="#e5e7eb"/><text x="466" y="203" text-anchor="end" class="axis-label">x</text><text x="218" y="86" class="axis-label">y</text><polygon points="240,150 180,240 240,300 300,210" fill="#dbeafe" fill-opacity=".45" stroke="#2563eb" stroke-width="2.4"/><line x1="240" y1="150" x2="240" y2="300" stroke="#64748b" stroke-width="1.2" stroke-dasharray="4 4"/><line x1="180" y1="240" x2="300" y2="210" stroke="#64748b" stroke-width="1.2" stroke-dasharray="4 4"/><circle data-point-label="A" data-point-x="1" data-point-y="2" cx="240" cy="150" r="4" fill="#111827"/><text x="248" y="144" class="point-label">A(1,2)</text><circle data-point-label="B" data-point-x="-1" data-point-y="-1" cx="180" cy="240" r="4" fill="#111827"/><text x="126" y="235" class="point-label">B(−1,−1)</text><circle data-point-label="C" data-point-x="1" data-point-y="-3" cx="240" cy="300" r="4" fill="#dc2626"/><text x="248" y="294" class="point-label" fill="#b91c1c">C(1,−3)</text><circle data-point-label="D" data-point-x="3" data-point-y="0" cx="300" cy="210" r="4" fill="#111827"/><text x="308" y="204" class="point-label">D(3,0)</text><rect x="510" y="62" width="186" height="263" rx="10" fill="#f8fafc" stroke="#dbe3ef"/><text x="528" y="91" class="side-title">핵심 관계</text><text x="528" y="119" class="side-note">A+C=B+D</text><text x="528" y="145" class="side-note">C=(1,−3)</text><text x="528" y="171" class="side-note">a=1, b=−3</text><text x="528" y="197" class="side-note">ab=−3</text></svg>
