<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" role="img" aria-labelledby="title desc" width="760" height="340"><title id="title">문항 13 해설: 세 집합식 영역 비교</title><desc id="desc">세 집합 Venn diagram과 각 차집합 식의 영역표</desc><style>text{font-family:"Noto Sans KR",Arial,sans-serif;fill:#172033}.m{fill:#56657a}.math{font-family:Georgia,serif}</style><rect width="760" height="340" rx="18" fill="#f8fafc"/><text x="28" y="38" font-size="22" font-weight="700">세 집합식을 영역으로 비교</text><rect x="28" y="78" width="330" height="190" rx="14" fill="#fff" stroke="#cbd5e1"/><circle cx="193" cy="153" r="65" fill="#dbeafe" fill-opacity=".7" stroke="#2563eb" stroke-width="3"/><circle cx="150" cy="208" r="65" fill="#fef3c7" fill-opacity=".7" stroke="#d97706" stroke-width="3"/><circle cx="236" cy="208" r="65" fill="#dcfce7" fill-opacity=".7" stroke="#16a34a" stroke-width="3"/><text x="193" y="96" text-anchor="middle" font-size="17">A</text><text x="102" y="256" font-size="17">B</text><text x="270" y="256" font-size="17">C</text><rect x="390" y="92" width="338" height="152" rx="14" fill="#fff" stroke="#cbd5e1"/><text x="414" y="126" font-size="17" font-weight="700">영역식</text><text x="414" y="162" class="math" font-size="18" fill="#1d4ed8">ㄱ A∩Bᶜ</text><text x="414" y="196" class="math" font-size="17" fill="#b45309">ㄴ A∩Bᶜ∩Cᶜ</text><text x="414" y="220" class="math" font-size="17" fill="#b91c1c">≠ A∩(Bᶜ∪Cᶜ)</text><text x="28" y="310" class="m" font-size="14">ㄷ은 A∩B 안에서 C 영역을 지운 식으로 읽는다.</text></svg>
