<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" width="640" height="260" role="img" aria-labelledby="title desc" data-scale-policy="SCHEMATIC_ALLOWED">
  <title id="title">원의 현 길이</title>
  <desc id="desc">중심 (1,0), 반지름 루트3인 원과 직선 y=x+1, 현의 중점까지의 거리 루트2를 나타낸 그림이다.</desc>
  <rect width="640" height="260" fill="#fff"/>
  <text x="320" y="28" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="22" font-weight="700" fill="#1e3a5f">현의 길이 = 2√(r² − d²)</text>
  <rect x="18" y="44" width="350" height="190" rx="8" fill="#f8fafc" stroke="#dbe3ef"/>
  <line x1="45" y1="168" x2="340" y2="168" stroke="#0f172a" stroke-width="1.4"/><line x1="150" y1="223" x2="150" y2="59" stroke="#0f172a" stroke-width="1.4"/>
  <circle cx="187" cy="168" r="65" fill="#dbeafe" fill-opacity=".63" stroke="#2563eb" stroke-width="2.5"/>
  <line x1="70" y1="215" x2="315" y2="72" stroke="#0f766e" stroke-width="2.4"/>
  <line x1="187" y1="168" x2="197" y2="141" stroke="#7c3aed" stroke-width="2" stroke-dasharray="5 4"/>
  <line x1="142" y1="173" x2="242" y2="114" stroke="#dc2626" stroke-width="3"/>
  <circle cx="187" cy="168" r="4" fill="#1d4ed8"/><circle cx="197" cy="141" r="4" fill="#7c3aed"/><circle cx="142" cy="173" r="4" fill="#dc2626"/><circle cx="242" cy="114" r="4" fill="#dc2626"/>
  <text x="195" y="183" font-family="Arial, sans-serif" font-size="15" fill="#1d4ed8">C(1,0)</text><text x="204" y="138" font-family="Arial, sans-serif" font-size="15" fill="#6d28d9">d=√2</text><text x="248" y="108" font-family="Arial, sans-serif" font-size="15" fill="#b91c1c">현</text><text x="250" y="75" font-family="Arial, sans-serif" font-size="15" fill="#0f766e">y=x+1</text>
  <rect x="390" y="44" width="232" height="190" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="410" y="76" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="18" font-weight="700" fill="#1e3a5f">값 대입</text>
  <text x="410" y="113" font-family="Arial, sans-serif" font-size="18">r²=3,  d²=2</text><text x="410" y="148" font-family="Arial, sans-serif" font-size="18">현=2√(3−2)</text><text x="410" y="183" font-family="Arial, sans-serif" font-size="18">=2</text>
  <text x="410" y="218" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="18" font-weight="700" fill="#b91c1c">정답 ④</text>
</svg>
