<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" width="640" height="260" role="img" aria-labelledby="title desc">
  <title id="title">두 축에 접하는 두 원</title>
  <desc id="desc">점 (2,-1)을 지나고 두 좌표축에 접하는 원의 중심 (r,-r), 반지름 1과 5를 나타낸 그림이다.</desc>
  <rect width="640" height="260" fill="#fff"/>
  <text x="320" y="28" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="22" font-weight="700" fill="#1e3a5f">중심 (r, −r)  →  r=1, 5</text>
  <rect x="18" y="44" width="350" height="190" rx="8" fill="#f8fafc" stroke="#dbe3ef"/>
  <line x1="45" y1="137" x2="345" y2="137" stroke="#0f172a" stroke-width="1.8"/><line x1="112" y1="225" x2="112" y2="58" stroke="#0f172a" stroke-width="1.8"/>
  <circle cx="144" cy="169" r="32" fill="#dbeafe" fill-opacity=".7" stroke="#2563eb" stroke-width="2.3"/><circle cx="215" cy="185" r="42" fill="#dcfce7" fill-opacity=".35" stroke="#059669" stroke-width="2.4"/>
  <circle cx="176" cy="137" r="5" fill="#dc2626"/><circle cx="208" cy="137" r="5" fill="#dc2626"/>
  <circle cx="144" cy="169" r="4" fill="#1d4ed8"/><circle cx="215" cy="185" r="4" fill="#047857"/>
  <text x="180" y="132" font-family="Arial, sans-serif" font-size="16" fill="#b91c1c">P(2,−1)</text><text x="119" y="172" font-family="Arial, sans-serif" font-size="15" fill="#1d4ed8">r=1</text><text x="230" y="184" font-family="Arial, sans-serif" font-size="15" fill="#047857">r=5</text><text x="320" y="132" font-family="Arial, sans-serif" font-size="15">x축</text><text x="116" y="70" font-family="Arial, sans-serif" font-size="15">y축</text>
  <rect x="390" y="44" width="232" height="190" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="410" y="76" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="18" font-weight="700" fill="#1e3a5f">거리식</text>
  <text x="410" y="113" font-family="Arial, sans-serif" font-size="17">(2−r)²+(r−1)²=r²</text><text x="410" y="148" font-family="Arial, sans-serif" font-size="18">r²−6r+5=0</text><text x="410" y="182" font-family="Arial, sans-serif" font-size="18">r=1, 5</text>
  <text x="410" y="218" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="18" font-weight="700" fill="#b91c1c">합 = 6  →  ③</text>
</svg>
