<svg xmlns="http://www.w3.org/2000/svg" width="480" height="477" viewBox="0 0 480 477" role="img" aria-labelledby="visual-title visual-desc" data-composite="composite-panels-v1"><title id="visual-title">오각뿔대의 면은 윗면 1개, 아랫면 1개, 옆면 5개로 모두 7개이다. 서로 다른 7가지 색을 모두 쓰므로 고정한 상태의 색칠은 7!가지이다. 중심축 둘레의 5가지 회전을 같은 것으로 보면 7! 나누기 5는 1008가지이다. 따라서 답은 ⑤이다.</title><desc id="visual-desc">오각뿔대의 윗면과 아랫면, 다섯 옆면이 보이고, 뒤쪽의 보이지 않는 모서리는 점선으로 나타나 있다.</desc><g id="p1-caption" data-role="caption" data-panel="1" data-font-px="21.4"><g id="p1-p1-caption-text" transform="translate(200.624 38.5064)" data-label-kind="CAPTION" data-owner="panel-1" data-fragment-sha="sha256:564b2c0e525196cea1d594b27c6645aca7840cafcde93709561b629b9ecb5f9a"><svg xmlns="http://www.w3.org/2000/svg" width="78.752" height="30.9872" viewBox="0 0 78.752 30.9872" data-outline-width="78.752" data-outline-height="30.9872" id="lb-48a84e119cb616c4df759141585c814755e02d370b6fdefbd10f689ce550b8a2" data-owner="panel-1" data-fact-role="GIVEN"><path d="M9.43740 23.19760L9.43740 18.08300L10.12220 18.08300L10.12220 23.19760L9.43740 23.19760ZM9.77980 8.88100L9.77980 8.88100Q11.74860 8.88100 13.24660 9.45880Q14.74460 10.03660 15.58990 11.08520Q16.43520 12.13380 16.43520 13.56760L16.43520 13.56760Q16.43520 14.98000 15.58990 16.02860Q14.74460 17.07720 13.24660 17.65500Q11.74860 18.23280 9.77980 18.23280L9.77980 18.23280Q7.83240 18.23280 6.32370 17.65500Q4.81500 17.07720 3.96970 16.02860Q3.12440 14.98000 3.12440 13.56760L3.12440 13.56760Q3.12440 12.13380 3.96970 11.08520Q4.81500 10.03660 6.32370 9.45880Q7.83240 8.88100 9.77980 8.88100ZM9.77980 9.48020L9.77980 9.48020Q8.06780 9.48020 6.69820 10.00450Q5.32860 10.52880 4.53680 11.44900Q3.74500 12.36920 3.74500 13.56760L3.74500 13.56760Q3.74500 14.74460 4.53680 15.67550Q5.32860 16.60640 6.69820 17.13070Q8.06780 17.65500 9.77980 17.65500L9.77980 17.65500Q11.49180 17.65500 12.86140 17.13070Q14.23100 16.60640 15.02280 15.67550Q15.81460 14.74460 15.81460 13.56760L15.81460 13.56760Q15.81460 12.36920 15