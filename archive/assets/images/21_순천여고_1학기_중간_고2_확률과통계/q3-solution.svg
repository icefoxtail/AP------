<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 360" width="420" height="360" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">한 변에 두 좌석씩 모두 6좌석이고, 세 학급을 세 변에 배정하는 방법은 3!가지, 각 변의 두 대표가 자리를 바꾸는 방법은 2의 3제곱 가지이다. 회전한 세 배치가 같으므로 3!×8/3=16가지이다. 따라서 답은 ②이다.</title><desc id="visual-desc">정삼각형 탁자의 세 변이 각각 다른 색으로 칠해져 있고, 각 변 바깥에 좌석 점이 두 개씩 놓여 있으며 변마다 2가 적혀 있다.</desc><rect width="420" height="360" fill="#fff"/><g data-layer="31"><line id="sAB" data-role="line" stroke="#1f5fa8" stroke-width="2.4" fill="none" x1="210" y1="47.857142857" x2="82.119815668" y2="260.99078341"/></g><g data-layer="31"><line id="sBC" data-role="line" stroke="#b85c00" stroke-width="2.4" fill="none" x1="82.119815668" y1="260.99078341" x2="337.880184332" y2="260.99078341"/></g><g data-layer="31"><line id="sCA" data-role="line" stroke="#2e7d32" stroke-width="2.4" fill="none" x1="337.880184332" y1="260.99078341" x2="210" y2="47.857142857"/></g><g data-layer="70"><circle id="A" data-role="point" stroke="#111" stroke-width="0.8" fill="#111" cx="210" cy="47.857142857" r="3.2"/></g><g data-layer="70"><circle id="B" data-role="point" stroke="#111" stroke-width="0.8" fill="#111" cx="82.119815668" cy="260.99078341" r="3.2"/></g><g data-layer="70"><circle id="C" data-role="point" stroke="#111" stroke-width="0.8" fill="#111" cx="337.880184332" cy="260.99078341" r="3.2"/></g><g da