<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="title desc"><title id="title">집합 해설 보강 · 문항 11</title><desc id="desc">각 집합 등식의 변형과 거짓인 식</desc><rect width="720" height="300" rx="18" fill="#f8fafc"/><text x="32" y="38" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#0f172a">집합 해설 보강 · 문항 11</text><text x="32" y="68" font-family="Arial,sans-serif" font-size="14" fill="#475569">차집합·여집합으로 등식 검증</text><rect x="32" y="88" width="656" height="156" rx="12" fill="#fff" stroke="#cbd5e1"/><rect x="62" y="113" width="570" height="36" rx="8" fill="#fee2e2" stroke="#ef4444"/><text x="78" y="137" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#b91c1c">① A-(B-C)=(A-B)∩(A-C) : 일반적으로 거짓</text><text x="62" y="178" font-family="Arial,sans-serif" font-size="14" fill="#334155">②~⑤는 차집합 정의, 드모르간, 분배·흡수법칙으로 참</text><text x="62" y="215" font-family="Arial,sans-serif" font-size="14" fill="#1d4ed8">A-(B-C)=(A-B)∪(A∩C)</text><text x="32" y="274" font-family="Arial,sans-serif" font-size="13" fill="#64748b">합집합은 ‘또는’, 교집합은 ‘그리고’로 읽어 양변을 비교한다.</text></svg>
