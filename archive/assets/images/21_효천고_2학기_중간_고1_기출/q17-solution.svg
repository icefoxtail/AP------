<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="title desc" data-scale-policy="SCHEMATIC_ALLOWED" width="720" height="360"><title id="title">집합 해설 보강 · 문항 17</title><desc id="desc">A와 B가 서로소로 X 전체를 분할함을 표시</desc><rect width="720" height="300" rx="18" fill="#f8fafc"/><text x="32" y="38" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#0f172a">집합 해설 보강 · 문항 17</text><text x="32" y="68" font-family="Arial,sans-serif" font-size="14" fill="#475569">A∩B=∅, A∪B=X</text><rect x="32" y="88" width="656" height="156" rx="12" fill="#fff" stroke="#cbd5e1"/><rect x="120" y="120" width="220" height="92" fill="#bfdbfe" fill-opacity=".75" stroke="#2563eb" stroke-width="3"/><rect x="340" y="120" width="220" height="92" fill="#fed7aa" fill-opacity=".75" stroke="#ea580c" stroke-width="3"/><text x="220" y="171" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#1d4ed8">A</text><text x="440" y="171" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#c2410c">B</text><text x="32" y="274" font-family="Arial,sans-serif" font-size="13" fill="#64748b">X의 모든 원소가 A 또는 B 중 정확히 한 곳에 들어간다.</text></svg>
