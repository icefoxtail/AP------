<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="title desc"><title id="title">집합 해설 보강 · 문항 6</title><desc id="desc">a=2일 때 대칭차집합은 A-B와 B-A의 바깥쪽 두 영역임을 표시</desc><defs><mask id="onlyA"><rect width="720" height="300" fill="black"/><circle cx="305" cy="166" r="70" fill="white"/><circle cx="415" cy="166" r="70" fill="black"/></mask><mask id="onlyB"><rect width="720" height="300" fill="black"/><circle cx="415" cy="166" r="70" fill="white"/><circle cx="305" cy="166" r="70" fill="black"/></mask></defs><rect width="720" height="300" rx="18" fill="#f8fafc"/><text x="32" y="38" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#0f172a">집합 해설 보강 · 문항 6</text><text x="32" y="68" font-family="Arial,sans-serif" font-size="14" fill="#475569">a=2: A={1,2,3}, B={0,1,2}</text><rect x="32" y="88" width="656" height="156" rx="12" fill="#fff" stroke="#cbd5e1"/><circle cx="305" cy="166" r="70" fill="#bfdbfe" fill-opacity=".5" stroke="#2563eb" stroke-width="3"/><circle cx="415" cy="166" r="70" fill="#fed7aa" fill-opacity=".5" stroke="#ea580c" stroke-width="3"/><rect x="32" y="88" width="656" height="156" fill="#fde68a" fill-opacity=".75" mask="url(#onlyA)"/><rect x="32" y="88" width="656" height="156" fill="#fde68a" fill-opacity=".75" mask="url(#onlyB)"/><text x="265" y="166" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#1d4ed8">A</text><text x="450" y="166" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#c2410c">B</text><text x="95" y="218" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#92400e">3</text><text x="568" y="218" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#92400e">0</text><text x="331" y="166" font-family="Arial,sans-serif" font-size="13" fill="#334155">A∩B={1,2}</text><text x="32" y="274" font-family="Arial,sans-serif" font-size="13" fill="#64748b">노란색 바깥 영역의 원소 3과 0이 대칭차집합을 이룬다.</text></svg>
