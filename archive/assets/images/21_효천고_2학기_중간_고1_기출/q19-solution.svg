<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 480" width="940" height="480" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="svg-title-q19h1" aria-describedby="svg-desc-q19h1" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-geometry-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-axis-scale-mode="EQUAL_UNIT" data-fact-hash="7e5bef797e5bef797e5bef797e5bef797e5bef797e5bef797e5bef797e5bef79" data-visual-provenance="deterministic-python-independent-facts"><title id="svg-title-q19h1">직선의 평행이동과 대칭이동 후 교점</title><desc id="svg-desc-q19h1">직선 l과 (4,1)만큼 평행이동한 뒤 y=x에 대칭이동한 직선 l′은 기울기가 달라 y축 위의 점 (0,2)에서 만난다.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8z" fill="#64748b"/></marker></defs><style>.label{font:11px "STIX Two Math","Malgun Gothic",serif;font-weight:600}.note{font:11px "Noto Sans KR","Malgun Gothic",sans-serif;fill:#374151}.heading{font:700 16px "Noto Sans KR","Malgun Gothic",sans-serif;fill:#111827}</style><rect width="940" height="480" fill="#fff"/><text x="32" y="34" class="heading">도형의 이동 해설 도형 · 문항 19</text><text x="32" y="54" class="note">실제 수치·좌표·변환 순서를 표시한 해설 자료</text><rect x="30" y="66" width="530" height="370" rx="12" fill="#fff" stroke="#cbd5e1"/><line x1="68.00" y1="78" x2="68.00" y2="423" stroke="#e5e7eb" stroke-width=".8"/><line x1="125.50" y1="78" x2="125.50" y2="423" stroke="#e5e7eb" stroke-width=".8"/><line x1="183.00" y1="78" x2="183.00" y2="423" stroke="#e5e7eb" stroke-width=".8"/><line x1="240.50" y1="78" x2="240.50" y2="423" stroke="#e5e7eb" stroke-width=".8"/><line x1="298.00" y1="78" x2="298.00" y2="423" stroke="#e5e7eb" stroke-width=".8"/><line x1="355.50" y1="78" x2="355.50" y2="423" stroke="#e5e7eb" stroke-width=".8"/><line x1="413.00" y1="78" x2="413.00" y2="423" stroke="#e5e7eb" stroke-width=".8"/><line x1="470.50" y1="78" x2="470.50" y2="423" stroke="#e5e7eb" stroke-width=".8"/><line x1="528.00" y1="78" x2="528.00" y2="423" stroke="#e5e7eb" stroke-width=".8"/><line x1="48" y1="423.00" x2="548" y2="423.00" stroke="#e5e7eb" stroke-width=".8"/><line x1="48" y1="365.50" x2="548" y2="365.50" stroke="#e5e7eb" stroke-width=".8"/><line x1="48" y1="308.00" x2="548" y2="308.00" stroke="#e5e7eb" stroke-width=".8"/><line x1="48" y1="250.50" x2="548" y2="250.50" stroke="#e5e7eb" stroke-width=".8"/><line x1="48" y1="193.00" x2="548" y2="193.00" stroke="#e5e7eb" stroke-width=".8"/><line x1="48" y1="135.50" x2="548" y2="135.50" stroke="#e5e7eb" stroke-width=".8"/><line x1="48" y1="78.00" x2="548" y2="78.00" stroke="#e5e7eb" stroke-width=".8"/><line x1="240.5" y1="78" x2="240.5" y2="423" stroke="#111827" stroke-width="1.35"/><line x1="48" y1="365.5" x2="548" y2="365.5" stroke="#111827" stroke-width="1.35"/><line data-geometry="line" data-equation="x-y=0" x1="183.00" y1="423.00" x2="528.00" y2="78.00" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="3 4"/><line data-geometry="line" data-equation="3x-2y+4=0" x1="125.50" y1="423.00" x2="355.50" y2="78.00" stroke="#2563eb" stroke-width="2.25" /><text x="361" y="87" class="label" fill="#2563eb">l: y=(3/2)x+2</text><line data-geometry="line" data-equation="3x-2y-6=0" x1="317.17" y1="423.00" x2="528.00" y2="106.75" stroke="#7c3aed" stroke-width="2.25" stroke-dasharray="6 4"/><text x="442" y="245" class="label" fill="#7c3aed">이동 후</text><line data-geometry="line" data-equation="2x-3y+6=0" x1="68.00" y1="365.50" x2="499.25" y2="78.00" stroke="#dc2626" stroke-width="2.25" /><text x="413" y="115" class="label" fill="#dc2626">l′</text><text x="482" y="101" class="label" fill="#64748b">y=x</text><g data-point-label="교점" data-point-x="0" data-point-y="2"><circle cx="240.5" cy="250.5" r="4.6" fill="#dc2626" stroke="#fff" stroke-width="1.5"/><text x="154.5" y="240.5" class="label" fill="#dc2626">교점 (0,2)</text></g><rect x="580" y="66" width="330" height="370" rx="12" fill="#f8fafc" stroke="#dbe3ef"/><text x="600" y="92" class="heading">핵심 수치와 관계</text><text x="592" y="118" class="note">l: y=ax+2 를 (4,1)만큼 평행이동 → y=ax−4a+3</text><text x="592" y="140" class="note">y=x 에 대하여 대칭 → l′: y=(1/a)x+4−3/a</text><text x="592" y="162" class="note">교점이 y축 위: 2=4−3/a → a=3/2</text><text x="592" y="184" class="note">a=3/2: l: y=(3/2)x+2, l′: y=(2/3)x+2</text><text x="592" y="206" class="note">두 직선의 기울기가 달라 (0,2)에서 한 점으로 만남</text></svg>
