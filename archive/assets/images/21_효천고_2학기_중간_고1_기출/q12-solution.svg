<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" role="img" aria-labelledby="title desc"><title id="title">명제와 구간 포함</title><desc id="desc">P의 여집합은 왼쪽 반직선과 열린구간 (1,3)이다.</desc><style>text{font-family:"Noto Sans KR","Malgun Gothic",Arial,sans-serif;fill:#172033}.muted{fill:#56657a}</style><rect width="760" height="330" fill="#f8fafc"/><text x="28" y="38" font-size="22" font-weight="700">명제와 구간 포함</text><text x="28" y="67" class="muted" font-size="15">Pᶜ=(-∞,−2)∪(1,3)</text><defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M6 0 0 3 6 6z" fill="#2563eb"/></marker></defs><line x1="100" y1="150" x2="680" y2="150" stroke="#64748b" stroke-width="2"/><line x1="165" y1="150" x2="390" y2="150" stroke="#2563eb" stroke-width="10" marker-start="url(#a)"/><circle cx="390" cy="150" r="8" fill="#fff" stroke="#2563eb" stroke-width="3"/><text x="390" y="185" text-anchor="middle" font-size="15">−2</text><line x1="100" y1="245" x2="680" y2="245" stroke="#64748b" stroke-width="2"/><line x1="465" y1="245" x2="580" y2="245" stroke="#16a34a" stroke-width="10"/><circle cx="465" cy="245" r="8" fill="#fff" stroke="#16a34a" stroke-width="3"/><circle cx="580" cy="245" r="8" fill="#fff" stroke="#16a34a" stroke-width="3"/><text x="465" y="280" text-anchor="middle" font-size="15">1</text><text x="580" y="280" text-anchor="middle" font-size="15">3</text></svg>
