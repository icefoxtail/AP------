<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="600" height="450" role="img" aria-labelledby="title desc">
  <title id="title">두 반사 원 위 점 사이의 최댓거리</title>
  <desc id="desc">반사된 두 원의 중심 C1(-1,-2), C2(-2,1)와 반지름 √10, 그리고 같은 직선 위의 가장 먼 점 P'(0,-5), Q'(-3,4)를 표시한다.</desc>
  <rect width="600" height="450" fill="#fff"/>
  <text x="22" y="30" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#17324d">반사된 원의 중심과 가장 먼 두 점</text>
  <g stroke="#e6ebf0" stroke-width="1"><line x1="100" y1="90" x2="100" y2="415"/><line x1="170" y1="90" x2="170" y2="415"/><line x1="240" y1="90" x2="240" y2="415"/><line x1="310" y1="90" x2="310" y2="415"/><line x1="380" y1="90" x2="380" y2="415"/><line x1="450" y1="90" x2="450" y2="415"/><line x1="80" y1="125" x2="470" y2="125"/><line x1="80" y1="195" x2="470" y2="195"/><line x1="80" y1="265" x2="470" y2="265"/><line x1="80" y1="335" x2="470" y2="335"/></g>
  <line x1="80" y1="230" x2="470" y2="230" stroke="#64748b" stroke-width="1.4"/><line x1="300" y1="420" x2="300" y2="80" stroke="#64748b" stroke-width="1.4"/>
  <circle cx="265" cy="300" r="110.68" fill="#dbeafe" fill-opacity=".25" stroke="#2563eb" stroke-width="2.6"/>
  <circle cx="230" cy="195" r="110.68" fill="#ffedd5" fill-opacity=".22" stroke="#ea580c" stroke-width="2.6"/>
  <line x1="265" y1="300" x2="230" y2="195" stroke="#0f766e" stroke-width="2" stroke-dasharray="6 5"/>
  <line x1="300" y1="405" x2="195" y2="90" stroke="#0f172a" stroke-width="3.2"/>
  <circle cx="265" cy="300" r="5" fill="#1d4ed8"/><circle cx="230" cy="195" r="5" fill="#c2410c"/>
  <circle cx="300" cy="405" r="6" fill="#1d4ed8"/><circle cx="195" cy="90" r="6" fill="#c2410c"/>
  <text x="276" y="321" font-family="Arial, sans-serif" font-size="16" fill="#1d4ed8">C₁(−1,−2)</text>
  <text x="91" y="188" font-family="Arial, sans-serif" font-size="16" fill="#c2410c">C₂(−2,1)</text>
  <text x="309" y="414" font-family="Arial, sans-serif" font-size="16" fill="#1d4ed8">P′(0,−5)</text>
  <text x="112" y="82" font-family="Arial, sans-serif" font-size="16" fill="#c2410c">Q′(−3,4)</text>
  <text x="394" y="190" font-family="Arial, sans-serif" font-size="16" fill="#0f766e">C₁C₂=√10</text>
  <text x="395" y="220" font-family="Arial, sans-serif" font-size="16" fill="#2563eb">r₁=√10</text>
  <text x="395" y="248" font-family="Arial, sans-serif" font-size="16" fill="#c2410c">r₂=√10</text>
  <rect x="392" y="278" width="184" height="62" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="406" y="304" font-family="Arial, sans-serif" font-size="16" fill="#334155">최댓거리</text>
  <text x="406" y="328" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">√10+√10+√10=3√10</text>
</svg>

