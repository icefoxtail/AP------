<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" width="480" height="360" role="img" aria-labelledby="title desc">
  <title id="title">두 원의 대칭축</title>
  <desc id="desc">중심 (1,2), (3,1)이고 반지름이 같은 두 원의 중심을 잇는 선분과 그 수직이등분선 y=2x-5/2를 나타낸다.</desc>
  <rect width="480" height="360" fill="#fff"/>
  <text x="20" y="28" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#17324d">같은 반지름인 두 원의 대칭축</text>
  <g stroke="#e6ebf0" stroke-width="1"><line x1="100" y1="50" x2="100" y2="310"/><line x1="160" y1="50" x2="160" y2="310"/><line x1="220" y1="50" x2="220" y2="310"/><line x1="280" y1="50" x2="280" y2="310"/><line x1="340" y1="50" x2="340" y2="310"/><line x1="400" y1="50" x2="400" y2="310"/><line x1="60" y1="65" x2="430" y2="65"/><line x1="60" y1="125" x2="430" y2="125"/><line x1="60" y1="185" x2="430" y2="185"/><line x1="60" y1="245" x2="430" y2="245"/></g>
  <line x1="60" y1="245" x2="430" y2="245" stroke="#64748b" stroke-width="1.3"/><line x1="70" y1="310" x2="70" y2="48" stroke="#64748b" stroke-width="1.3"/>
  <circle cx="130" cy="125" r="60" fill="#dbeafe" fill-opacity=".35" stroke="#2563eb" stroke-width="2.5"/>
  <circle cx="250" cy="185" r="60" fill="#ffedd5" fill-opacity=".35" stroke="#ea580c" stroke-width="2.5"/>
  <line x1="130" y1="125" x2="250" y2="185" stroke="#475569" stroke-width="2" stroke-dasharray="6 4"/>
  <line x1="112" y1="311" x2="262" y2="11" stroke="#7c3aed" stroke-width="2.8"/>
  <circle cx="130" cy="125" r="5" fill="#1d4ed8"/><circle cx="250" cy="185" r="5" fill="#c2410c"/><circle cx="190" cy="155" r="5" fill="#111827"/>
  <text x="84" y="112" font-family="Arial, sans-serif" font-size="15" fill="#1d4ed8">C₁(1,2)</text>
  <text x="256" y="203" font-family="Arial, sans-serif" font-size="15" fill="#c2410c">C₂(3,1)</text>
  <text x="198" y="149" font-family="Arial, sans-serif" font-size="14" fill="#111827">M(2,3/2)</text>
  <text x="285" y="82" font-family="Arial, sans-serif" font-size="16" fill="#6d28d9">y=2x−5/2</text>
  <text x="277" y="226" font-family="Arial, sans-serif" font-size="14" fill="#475569">중심선의 기울기 −1/2</text>
  <text x="277" y="251" font-family="Arial, sans-serif" font-size="14" fill="#6d28d9">대칭축의 기울기 2</text>
</svg>
