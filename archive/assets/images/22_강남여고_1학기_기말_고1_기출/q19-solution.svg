<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 430" width="620" height="430" role="img" aria-labelledby="title desc">
  <title id="title">원과 현의 수직거리</title>
  <desc id="desc">중심 O(2,0), 반지름 2인 원에서 길이 2인 현 AB와 수선 OH를 나타낸다. 반현 길이는 1이고 OH는 √3이다.</desc>
  <rect width="620" height="430" fill="#fff"/>
  <text x="22" y="30" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#17324d">현의 길이에서 중심과 직선 사이의 거리 구하기</text>
  <g stroke="#e6ebf0" stroke-width="1"><line x1="110" y1="70" x2="110" y2="350"/><line x1="180" y1="70" x2="180" y2="350"/><line x1="250" y1="70" x2="250" y2="350"/><line x1="320" y1="70" x2="320" y2="350"/><line x1="390" y1="70" x2="390" y2="350"/><line x1="460" y1="70" x2="460" y2="350"/><line x1="80" y1="110" x2="500" y2="110"/><line x1="80" y1="180" x2="500" y2="180"/><line x1="80" y1="250" x2="500" y2="250"/><line x1="80" y1="320" x2="500" y2="320"/></g>
  <line x1="80" y1="250" x2="500" y2="250" stroke="#64748b" stroke-width="1.4"/><line x1="250" y1="355" x2="250" y2="65" stroke="#64748b" stroke-width="1.4"/>
  <circle cx="390" cy="250" r="140" fill="#dbeafe" fill-opacity=".25" stroke="#2563eb" stroke-width="2.7"/>
  <line x1="345.4" y1="220.3" x2="424.6" y2="182.2" stroke="#dc2626" stroke-width="3.2"/>
  <line x1="390" y1="250" x2="385" y2="201.3" stroke="#0f766e" stroke-width="2.4" stroke-dasharray="6 4"/>
  <line x1="390" y1="250" x2="424.6" y2="182.2" stroke="#1d4ed8" stroke-width="2"/>
  <circle cx="390" cy="250" r="5" fill="#111827"/><circle cx="385" cy="201.3" r="4.5" fill="#0f766e"/><circle cx="345.4" cy="220.3" r="5" fill="#dc2626"/><circle cx="424.6" cy="182.2" r="5" fill="#dc2626"/>
  <text x="398" y="267" font-family="Arial, sans-serif" font-size="16">O(2,0)</text>
  <text x="368" y="193" font-family="Arial, sans-serif" font-size="16" fill="#0f766e">H</text>
  <text x="315" y="216" font-family="Arial, sans-serif" font-size="16" fill="#b91c1c">A</text>
  <text x="432" y="177" font-family="Arial, sans-serif" font-size="16" fill="#b91c1c">B</text>
  <text x="405" y="222" font-family="Arial, sans-serif" font-size="15" fill="#1d4ed8">r=2</text>
  <text x="355" y="235" font-family="Arial, sans-serif" font-size="15" fill="#0f766e">OH=√3</text>
  <text x="379" y="174" font-family="Arial, sans-serif" font-size="15" fill="#b91c1c">AB=2</text>
  <rect x="70" y="365" width="500" height="48" rx="9" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="88" y="395" font-family="Arial, sans-serif" font-size="17" fill="#334155">반현 1, 반지름 2이므로 OH²+1²=2², 따라서 OH=√3</text>
</svg>
