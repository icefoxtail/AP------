<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 420" width="460" height="420" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">범위 3π/2&lt;θ&lt;2π이면 θ는 제4사분면, θ/2는 제2사분면이다. 방향만 보이기 위해 그린 대표 예시는 θ=5π/3, θ/2=5π/6이며 임의의 θ값을 고정한 해답은 아니다.</title><desc id="visual-desc">원점에서 오른쪽 아래로 향하는 θ 동경과 왼쪽 위로 향하는 θ/2 동경을 화살표로 표시한 제4·제2사분면 예시다.</desc><rect width="460" height="420" fill="#fff"/><g data-layer="30"><line id="xAxis" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="71.071428571" y1="210" x2="388.928571429" y2="210"/></g><g data-layer="30"><line id="yAxis" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="230" y1="368.928571429" x2="230" y2="51.071428571"/></g><g data-layer="30"><line id="thetaRay" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="230" y1="210" x2="309.464285714" y2="347.636180244"/></g><g data-layer="30"><line id="halfRay" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="230" y1="210" x2="92.363819756" y2="130.535714286"/></g><g data-layer="62"><polygon id="thetaRay-arrow-end" data-role="indicator" stroke="#111" stroke-width="0.8" fill="#111" data-mark="arrow" data-mark-id="thetaRay" data-mark-end="END" points="309.464285714,347.636180244 301.346594261,340.775926206 307.581977168,337.175926206"/></g><g data-layer="62"><polygon id="halfRay-arrow-end" data-role="indicator" stroke="#111" stroke-width="0.8" fill="#111" data-mark="arrow" data-mark-id="halfRay" data-mark-end="END" points="92.363819756,130.535714286 102.824073794,132.418022832 99.224073794,138.653405739"/></g><g data-layer="70"><circle id="O" data-role="point" stroke="#111" stroke-width="0.8" fill="#111" cx="230" cy="210" r="3.2"/></g><g data-layer="90"><g id="O-name" data-label-kind="POINT_NAME" data-priority="1" data-font-px="20.5" data-owner="O" data-fragment-sha="sha256:6649a7e0b98324ddc0f10ba8f927f99f0f5c2095fe80d16de33a53f205ceb4ab" transform="translate(242 183.117)"><svg xmlns="http://www.w3.org/2000/svg" width="15.6415" height="14.883" viewBox="0 0 15.6415 14.883" data-outline-width="15.6415" data-outline-height="14.883" id="lb-90a134a336e529919673c6ec133860f5ad4aedd5ed9b798fdc965873b18b618f" data-owner="O" data-fact-role="GIVEN"><g data-outline-units-per-em="1000" transform="translate(0 14.432) scale(0.0205)"><g stroke="currentColor" fill="currentColor" stroke-width="30" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mi"><path data-c="1D442" d="M740 435Q740 320 676 213T511 42T304 -22Q207 -22 138 35T51 201Q50 209 50 244Q50 346 98 438T227 601Q351 704 476 704Q514 704 524 703Q621 689 680 617T740 435ZM637 476Q637 565 591 615T476 665Q396 665 322 605Q242 542 200 428T157 216Q157 126 200 73T314 19Q404 19 485 98T608 313Q637 408 637 476Z"></path></g></g></g></g></svg></g></g><g data-layer="90"><g id="halfLabel" data-label-kind="EQUATION_LABEL" data-priority="1" data-font-px="20.5" data-owner="halfRay" data-fragment-sha="sha256:86db6420f0d2c300a1972e7d1df1f6600eecab63884900277b0ac2356f9c99f3" transform="translate(167.181909878 121.894357143)"><svg xmlns="http://www.w3.org/2000/svg" width="19.27" height="42.3735" viewBox="0 0 19.27 42.3735" data-outline-width="19.27" data-outline-height="42.3735" id="lb-7d0414a66224db048b34fa0e91c32d35d1552925f502e1a01095d3d9662cf9fc" data-owner="halfRay" data-fact-role="GIVEN"><g data-outline-units-per-em="1