<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 420" width="460" height="420" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">풀이에서 sinθ=(1+√17)/6&gt;0, cosθ=(1−√17)/6&lt;0이므로 θ의 동경은 제2사분면이다. 단위원 위의 정확한 점과 두 성분을 표시하며 sinθ+cosθ=1/3을 만족한다.</title><desc id="visual-desc">원점 O에서 왼쪽 위로 향하는 θ 동경, 그 끝점에서 두 축으로 내린 수직·수평선, 양의 사인 성분과 음의 코사인 성분이 보인다.</desc><rect width="460" height="420" fill="#fff"/><g data-layer="30"><line id="xAxis" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="71.071428571" y1="210" x2="388.928571429" y2="210"/></g><g data-layer="30"><line id="yAxis" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="230" y1="368.928571429" x2="230" y2="51.071428571"/></g><g data-layer="30"><line id="OP" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="230" y1="210" x2="147.27488075" y2="74.298690274"/></g><g data-layer="30"><line id="PC" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="147.27488075" y1="74.298690274" x2="147.27488075" y2="210"/></g><g data-layer="30"><line id="PS" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="147.27488075" y1="74.298690274" x2="230" y2="74.298690274"/></g><g data-layer="62"><polygon id="OP-arrow-end" data-role="indicator" stroke="#111" stroke-width="0.8" fill="#111" data-mark="arrow" data-mark-id="OP" data-mark-end="