<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 500" width="720" height="500" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">해설용 인접 관계 그래프(영역의 실제 모양이 아님). 나와 나머지 네 영역이 맞닿고, 나 이외에 가–라, 라–마, 다–마가 맞닿는다. 일곱 연결선이 모든 인접 쌍을 나타낸다.</title><desc id="visual-desc">가, 나, 다, 라, 마를 다섯 점으로 놓고 실제 문제의 인접 쌍만 일곱 선으로 연결한 그래프이다. 가–나, 가–라, 나–라, 나–다, 나–마, 다–마, 라–마가 연결되어 있고 영역에는 면 채움이 없다.</desc><rect width="720" height="500" fill="#fff"/><g data-layer="30"><line id="s1" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="144.158415842" y1="102.508250825" x2="360" y2="246.402640264"/></g><g data-layer="30"><line id="s2" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="144.158415842" y1="102.508250825" x2="144.158415842" y2="390.297029703"/></g><g data-layer="30"><line id="s3" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="360" y1="246.402640264" x2="144.158415842" y2="390.297029703"/></g><g data-layer="30"><line id="s4" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="360" y1="246.402640264" x2="575.841584158" y2="102.508250825"/></g><g data-layer="30"><line id="s5" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="360" y1="246.402640264" x2="575.841584158" y2="390.297029703"/></g><g data-layer="30"><line id="s6" data-role="line" stroke="#111" stroke-width="1.6" fill="non