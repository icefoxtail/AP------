<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" width="720" height="340" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">출발과 도착 사이에 징검돌 여섯 개가 왼쪽부터 순서대로 놓여 있는 모습을 흰 바탕의 원형 기호 여섯 개로 나타낸 도식이다. 사진 속 바위의 모양과 물결은 수학적 조건이 아니다.</title><desc id="visual-desc">왼쪽에 출발, 오른쪽에 도착이 적혀 있고 그 사이에 서로 구분되는 원형 징검돌 여섯 개가 일렬로 나열되어 있다. 건널 때 한 번에 한 칸 또는 두 칸 이동한다.</desc><rect width="720" height="340" fill="#fff"/><g data-layer="40"><circle id="k1" data-role="circle" stroke="#111" stroke-width="2.05" fill="none" cx="150.816326531" cy="128.163265306" r="31.37755102"/></g><g data-layer="40"><circle id="k2" data-role="circle" stroke="#111" stroke-width="2.05" fill="none" cx="234.489795918" cy="128.163265306" r="31.37755102"/></g><g data-layer="40"><circle id="k3" data-role="circle" stroke="#111" stroke-width="2.05" fill="none" cx="318.163265306" cy="128.163265306" r="31.37755102"/></g><g data-layer="40"><circle id="k4" data-role="circle" stroke="#111" stroke-width="2.05" fill="none" cx="401.836734694" cy="128.163265306" r="31.37755102"/></g><g data-layer="40"><circle id="k5" data-role="circle" stroke="#111" stroke-width="2.05" fill="none" cx="485.510204082" cy="128.163265306" r="31.37755102"/></g><g data-layer="40"><circle id="k6" data-role="circle" stroke="#111" stroke-width="2.05" fill="none" cx="569.183673469" cy="128.163265306" r="31.37755102"/></g><