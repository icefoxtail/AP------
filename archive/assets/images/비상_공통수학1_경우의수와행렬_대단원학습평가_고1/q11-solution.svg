<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="720" height="380" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">위쪽 직선 l에서 두 점 P₁, P₂, 아래쪽 직선 m에서 두 점 Q₁, Q₂를 왼쪽부터 택하면 P₁Q₂와 P₂Q₁만 내부에서 교차한다. 점 선택 수는 3C2×4C2=18이다.</title><desc id="visual-desc">위 평행선 l에는 점 셋, 아래 평행선 m에는 점 넷이 있다. 선택한 위의 P1과 P2, 아래의 Q1과 Q2를 엇갈리게 이은 선분 P1Q2와 P2Q1은 두 선 사이에서 교차한다.</desc><rect width="720" height="380" fill="#fff"/><g data-layer="30"><line id="sTop" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="129.902912621" y1="90.291262136" x2="590.097087379" y2="90.291262136"/></g><g data-layer="30"><line id="sBottom" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="129.902912621" y1="243.689320388" x2="590.097087379" y2="243.689320388"/></g><g data-layer="30"><line id="sCross1" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="129.902912621" y1="90.291262136" x2="436.699029126" y2="243.689320388"/></g><g data-layer="30"><line id="sCross2" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="360" y1="90.291262136" x2="129.902912621" y2="243.689320388"/></g><g data-layer="70"><circle id="P1" data-role="point" stroke="#111" stroke-width="0.8" fill="#111" cx="129.902912621" cy="90.291262136" r="3.2"/></g><g data-layer="70"><circle id="P2" data-role="point" stroke="#111" stroke-width="0.8" fill