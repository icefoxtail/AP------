<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 400" width="480" height="400" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">예: n=1일 때를 그린다. 점 T(1,2)에서 직선 y=2x에 접하는 원의 중심 C는 T를 지나고 기울기가 -1/2인 법선 위에 있고, 점 A(1,0)까지의 거리 CA와 CT가 같다. 이로부터 중심은 C(3,1)이고 a₁=3=(5·1²+1)/2이다. 일반적으로 aₙ=(5n²+1)/2이므로 aₙ/n²→5/2이다. 따라서 답은 ⑤이다.</title><desc id="visual-desc">원점을 지나는 직선 y=2x와 점 T에서 이 직선에 접하고 점 A를 지나는 원이 그려져 있으며, 원의 중심 C에서 T와 A로 반지름이 그어져 있고 T에서 직각 표시가 있다.</desc><rect width="480" height="400" fill="#fff"/><g data-layer="30"><line id="x-axis" data-role="axis" stroke="#111" stroke-width="1.2" fill="none" data-axis="x" x1="32" y1="257.050081377" x2="448" y2="257.050081377"/></g><g data-layer="30"><line id="y-axis" data-role="axis" stroke="#111" stroke-width="1.2" fill="none" data-axis="y" x1="120.592240618" y1="347.978717693" x2="120.592240618" y2="52.021282307"/></g><g data-layer="30"><line id="sCT" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="291.742484748" y1="200" x2="177.642321994" y2="142.949918623"/></g><g data-layer="30"><line id="sCA" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="291.742484748" y1="200" x2="177.642321994" y2="257.050081377"/></g><g data-layer="40"><line id="l" data-role="line" stroke="#111" stroke-width="2.05" fill="none" x1="75.12792246" y1="347.978717693" x2="223.106640153" y2="52.02