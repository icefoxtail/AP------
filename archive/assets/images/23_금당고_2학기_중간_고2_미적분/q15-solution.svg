<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 400" width="480" height="400" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">예: AB=2, BC=1일 때(tanθ=1/2)를 그린다. 삼각형 ABC에서 BC=AB tanθ, BH=AB sinθ이고 CH=BC sin θ이다. 점 P는 BH 위에서 ∠PCH=θ이므로 PH=CH tanθ, CP=CH/cosθ이다. 삼각형 PBC(진한 회색)의 넓이는 (1/2)·PB·CH이고 내접원의 반지름은 r=(넓이)/(둘레의 반)이다. θ→0+에서 넓이는 θ³/2, 둘레는 2θ에 가까워지므로 r(θ)≈θ²/2이고 극한은 1/2이다. 따라서 답은 ②이다.</title><desc id="visual-desc">B에서 직각인 삼각형 ABC와 B에서 빗변 AC에 내린 수선의 발 H가 있고, 선분 BH 위의 점 P와 C를 이은 선분이 그려져 있다. 각 A와 각 PCH에 같은 크기의 각 표시 θ가 있고, 삼각형 PBC가 진한 회색으로 칠해져 있다.</desc><rect width="480" height="400" fill="#fff"/><g data-layer="10"><path id="rgPBC" data-role="region" stroke="none" stroke-width="1.6" fill="#c7ccd5" data-owner-points="B C P" data-mark="region" data-mark-id="rgPBC" fill-rule="evenodd" d="M110 181.428571429 L54.285714286 292.857142857 L54.285714286 107.142857143 L110 181.428571429 Z"/></g><g data-layer="30"><line id="sAB" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="425.714285714" y1="292.857142857" x2="54.285714286" y2="292.857142857"/></g><g data-layer="30"><line id="sBC" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="54.285714286" y1="292.857142857" x2="54.285714286" y2="107.142857143"/></g><g data-layer="30"><line id="sCA" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="54.2857