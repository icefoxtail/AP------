<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 280" width="460" height="280" role="img" aria-labelledby="q21-title q21-desc">
  <title id="q21-title">한 점 O에서 만나는 세 직선과 맞꼭지각</title>
  <desc id="q21-desc">세 직선 AB, CD, EF가 한 점 O에서 만날 때의 각의 크기</desc>
  <rect width="460" height="280" fill="#ffffff"/>
  <!-- 세 직선: 중심 O(230,140) -->
  <line x1="40" y1="140" x2="420" y2="140" stroke="#0f172a" stroke-width="2.5"/>
  <line x1="80" y1="30" x2="380" y2="250" stroke="#2563eb" stroke-width="2.5"/>
  <line x1="90" y1="250" x2="370" y2="30" stroke="#b91c1c" stroke-width="2.5"/>
  <circle cx="230" cy="140" r="4.5" fill="#0f172a"/>
  <!-- 각 호 -->
  <path d="M 180,140 A 50,50 0 0,1 195,95" fill="none" stroke="#2563eb" stroke-width="2"/>
  <path d="M 205,80 A 60,60 0 0,1 270,95" fill="none" stroke="#0f172a" stroke-width="2"/>
  <path d="M 285,140 A 55,55 0 0,0 270,95" fill="none" stroke="#b91c1c" stroke-width="2"/>
  <!-- 텍스트 레이블 -->
  <g font-family="sans-serif" font-size="14" fill="#0f172a" text-anchor="middle">
    <text x="165" y="110" fill="#2563eb">(2x+8)°</text>
    <text x="235" y="70">(5x+12)°</text>
    <text x="305" y="115" fill="#b91c1c">(3x+10)°</text>
  </g>
  <!-- 직선 끝점 레이블: A, B, C, D, E, F, O -->
  <g font-family="sans-serif" font-size="16" font-weight="bold" fill="#0f172a" text-anchor="middle">
    <text x="25" y="145">A</text>
    <text x="435" y="145">B</text>
    <text x="70" y="35" fill="#2563eb">C</text>
    <text x="395" y="260" fill="#2563eb">D</text>
    <text x="380" y="30" fill="#b91c1c">E</text>
    <text x="80" y="265" fill="#b91c1c">F</text>
    <text x="230" y="165">O</text>
  </g>
</svg>