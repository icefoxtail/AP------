<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 220" width="460" height="220" role="img" aria-labelledby="q05-title q05-desc">
  <title id="q05-title">한 변과 두 각이 주어진 삼각형</title>
  <desc id="q05-desc">한 변의 길이가 8cm이고 두 각이 50도, 65도인 이등변삼각형</desc>
  <rect width="460" height="220" fill="#ffffff"/>
  <!-- 삼각형 ABC: 밑각 65도, 65도, 꼭지각 50도 -->
  <polygon points="70,170 310,170 190,50" fill="#f8fafc" stroke="#1e293b" stroke-width="2.5"/>
  <circle cx="190" cy="50" r="4" fill="#1e293b"/>
  <circle cx="70" cy="170" r="4" fill="#1e293b"/>
  <circle cx="310" cy="170" r="4" fill="#1e293b"/>
  <!-- 각도 호 -->
  <path d="M 105,170 A 35,35 0 0,0 87,138" fill="none" stroke="#2563eb" stroke-width="2"/>
  <path d="M 275,170 A 35,35 0 0,1 293,138" fill="none" stroke="#2563eb" stroke-width="2"/>
  <path d="M 175,65 A 25,25 0 0,0 205,65" fill="none" stroke="#e11d48" stroke-width="2"/>
  <!-- 레이블 -->
  <g font-family="sans-serif" font-size="14" text-anchor="middle">
    <text x="115" y="155" fill="#2563eb">65°</text>
    <text x="265" y="155" fill="#2563eb">65°</text>
    <text x="190" y="95" fill="#e11d48">50°</text>
    <text x="190" y="195" font-size="15" font-weight="bold" fill="#0f172a">8 cm</text>
  </g>
</svg>