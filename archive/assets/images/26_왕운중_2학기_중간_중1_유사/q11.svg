<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 260" width="480" height="260" role="img" aria-labelledby="q11-title q11-desc">
  <title id="q11-title">평행사변형의 각 변의 중점을 연결한 사각형</title>
  <desc id="q11-desc">평행사변형 ABCD의 네 변의 중점 E, F, G, H를 연결하여 만든 사각형 EFGH</desc>
  <rect width="480" height="260" fill="#ffffff"/>
  <!-- 평행사변형 ABCD: A(120,40), B(40,200), C(360,200), D(440,40) -->
  <polygon points="120,40 40,200 360,200 440,40" fill="#f8fafc" stroke="#0f172a" stroke-width="2.5"/>
  <!-- 중점 E(AB의 중점: 80,120), F(BC의 중점: 200,200), G(CD의 중점: 400,120), H(DA의 중점: 280,40) -->
  <polygon points="80,120 200,200 400,120 280,40" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/>
  <!-- 꼭짓점 점 표시 -->
  <circle cx="120" cy="40" r="4" fill="#0f172a"/>
  <circle cx="40" cy="200" r="4" fill="#0f172a"/>
  <circle cx="360" cy="200" r="4" fill="#0f172a"/>
  <circle cx="440" cy="40" r="4" fill="#0f172a"/>
  <circle cx="80" cy="120" r="4" fill="#2563eb"/>
  <circle cx="200" cy="200" r="4" fill="#2563eb"/>
  <circle cx="400" cy="120" r="4" fill="#2563eb"/>
  <circle cx="280" cy="40" r="4" fill="#2563eb"/>
  <!-- 레이블 A, B, C, D, E, F, G, H -->
  <g font-family="sans-serif" font-size="16" font-weight="bold" fill="#0f172a" text-anchor="middle">
    <text x="115" y="25">A</text>
    <text x="25" y="215">B</text>
    <text x="375" y="215">C</text>
    <text x="450" y="35">D</text>
    <text x="60" y="120" fill="#2563eb">E</text>
    <text x="200" y="225" fill="#2563eb">F</text>
    <text x="420" y="120" fill="#2563eb">G</text>
    <text x="280" y="25" fill="#2563eb">H</text>
  </g>
</svg>