<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 280" width="680" height="280" role="img" aria-labelledby="q19-title q19-desc">
  <title id="q19-title">봉사활동 시간의 줄기와 잎 그림 및 도수분포표</title>
  <desc id="q19-desc">학생 20명의 봉사활동 시간을 나타낸 줄기와 잎 그림과 도수분포표</desc>
  <rect width="680" height="280" fill="#ffffff"/>
  <!-- 왼쪽: 줄기와 잎 그림 -->
  <rect x="20" y="20" width="300" height="240" rx="6" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/>
  <text x="170" y="45" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="middle">[줄기와 잎 그림]</text>
  <line x1="80" y1="60" x2="80" y2="245" stroke="#334155" stroke-width="2"/>
  <line x1="30" y1="85" x2="310" y2="85" stroke="#cbd5e1" stroke-width="1"/>
  <g font-family="sans-serif" font-size="13" font-weight="bold" fill="#475569" text-anchor="middle">
    <text x="55" y="78">줄기</text>
    <text x="180" y="78">잎</text>
  </g>
  <g font-family="sans-serif" font-size="15" fill="#0f172a">
    <text x="55" y="115" font-weight="bold" text-anchor="middle">0</text>
    <text x="100" y="115">1  2  4  5  7  8  9</text>
    <text x="55" y="150" font-weight="bold" text-anchor="middle">1</text>
    <text x="100" y="150">0  2  <tspan fill="#2563eb" font-weight="bold">a</tspan>  <tspan fill="#2563eb" font-weight="bold">b</tspan>  7  8</text>
    <text x="55" y="185" font-weight="bold" text-anchor="middle">2</text>
    <text x="100" y="185">1  3  6  7  8</text>
    <text x="55" y="220" font-weight="bold" text-anchor="middle">3</text>
    <text x="100" y="220">2  5</text>
  </g>
  <!-- 오른쪽: 도수분포표 -->
  <rect x="340" y="20" width="320" height="240" rx="6" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
  <text x="500" y="45" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="middle">[도수분포표]</text>
  <line x1="340" y1="60" x2="660" y2="60" stroke="#334155" stroke-width="1.5"/>
  <line x1="520" y1="60" x2="520" y2="260" stroke="#334155" stroke-width="1.5"/>
  <line x1="340" y1="95" x2="660" y2="95" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="340" y1="135" x2="660" y2="135" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="340" y1="175" x2="660" y2="175" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="340" y1="215" x2="660" y2="215" stroke="#cbd5e1" stroke-width="1"/>
  <g font-family="sans-serif" font-size="13" font-weight="bold" fill="#475569" text-anchor="middle">
    <text x="430" y="80">봉사 시간 (시간)</text>
    <text x="590" y="80">도수 (명)</text>
  </g>
  <g font-family="sans-serif" font-size="14" fill="#0f172a" text-anchor="middle">
    <text x="430" y="120">0 이상 ~ 10 미만</text>
    <text x="590" y="120">7</text>
    <text x="430" y="160">10 이상 ~ 20 미만</text>
    <text x="590" y="160" fill="#e11d48" font-weight="bold">A</text>
    <text x="430" y="200">20 이상 ~ 30 미만</text>
    <text x="590" y="200" fill="#e11d48" font-weight="bold">B</text>
    <text x="430" y="240">30 이상 ~ 40 미만</text>
    <text x="590" y="240">2</text>
  </g>
</svg>