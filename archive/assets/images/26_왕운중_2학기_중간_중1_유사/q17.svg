<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 90" width="680" height="90" role="img" aria-labelledby="q17-title q17-desc">
  <title id="q17-title">크기순으로 나열된 자연수 변량</title>
  <desc id="q17-desc">작은 값부터 크기순으로 나열된 10개의 변량 5, 6, 7, 7, 7, x, y, 10, 10, 10</desc>
  <rect width="680" height="90" fill="#ffffff"/>
  <rect x="15" y="15" width="650" height="60" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <g font-family="sans-serif" font-size="20" font-weight="bold" fill="#0f172a" text-anchor="middle">
    <text x="55" y="52">5</text>
    <text x="115" y="52">6</text>
    <text x="175" y="52">7</text>
    <text x="235" y="52">7</text>
    <text x="295" y="52">7</text>
    <text x="365" y="52" fill="#2563eb" font-style="italic">x</text>
    <text x="435" y="52" fill="#2563eb" font-style="italic">y</text>
    <text x="505" y="52">10</text>
    <text x="565" y="52">10</text>
    <text x="625" y="52">10</text>
  </g>
</svg>