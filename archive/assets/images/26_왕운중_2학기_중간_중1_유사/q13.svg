<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 240" width="460" height="240" role="img" aria-labelledby="q13-title q13-desc">
  <title id="q13-title">평행선 사이의 꺾은선의 각</title>
  <desc id="q13-desc">두 직선 l과 m이 평행할 때 꺾인 점에서의 각 x의 크기</desc>
  <rect width="460" height="240" fill="#ffffff"/>
  <!-- 평행선 l, m -->
  <line x1="40" y1="50" x2="420" y2="50" stroke="#0f172a" stroke-width="2.5"/>
  <line x1="40" y1="190" x2="420" y2="190" stroke="#0f172a" stroke-width="2.5"/>
  <!-- 꺾은선: (120,50) -> (240,120) -> (150,190) -->
  <polyline points="120,50 240,120 150,190" fill="none" stroke="#2563eb" stroke-width="2.5"/>
  <circle cx="240" cy="120" r="4" fill="#2563eb"/>
  <!-- 각 호 -->
  <path d="M 150,50 A 30,30 0 0,1 144,65" fill="none" stroke="#e11d48" stroke-width="1.8"/>
  <path d="M 180,190 A 30,30 0 0,0 171,173" fill="none" stroke="#e11d48" stroke-width="1.8"/>
  <path d="M 220,108 A 20,20 0 0,0 220,135" fill="none" stroke="#2563eb" stroke-width="2"/>
  <!-- 텍스트 레이블 -->
  <g font-family="sans-serif" font-size="16" font-weight="bold" fill="#0f172a">
    <text x="30" y="55">l</text>
    <text x="30" y="195">m</text>
    <text x="200" y="126" fill="#2563eb" text-anchor="end">x</text>
  </g>
  <g font-family="sans-serif" font-size="14" fill="#e11d48">
    <text x="155" y="75">40°</text>
    <text x="185" y="175">70°</text>
  </g>
</svg>