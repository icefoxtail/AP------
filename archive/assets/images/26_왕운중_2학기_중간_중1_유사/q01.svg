<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 240" width="500" height="240" role="img" aria-labelledby="q01-title q01-desc">
  <title id="q01-title">삼각형의 작도 조건: 선분 BC와 두 각 B, C</title>
  <desc id="q01-desc">선분 BC와 양 끝 각 B, C의 크기가 주어져 삼각형 ABC를 작도하는 조건</desc>
  <rect width="500" height="240" fill="#ffffff"/>
  <!-- 선분 BC -->
  <line x1="60" y1="190" x2="260" y2="190" stroke="#111111" stroke-width="2.5"/>
  <circle cx="60" cy="190" r="4" fill="#111111"/>
  <circle cx="260" cy="190" r="4" fill="#111111"/>
  <!-- 삼각형 ABC 점선/실선 완성 형태 -->
  <line x1="60" y1="190" x2="150" y2="60" stroke="#2563eb" stroke-width="2" stroke-dasharray="4 3"/>
  <line x1="260" y1="190" x2="150" y2="60" stroke="#2563eb" stroke-width="2" stroke-dasharray="4 3"/>
  <circle cx="150" cy="60" r="4" fill="#2563eb"/>
  <!-- 각 표시 호 -->
  <path d="M 90,190 A 30,30 0 0,0 77,165" fill="none" stroke="#e11d48" stroke-width="2"/>
  <path d="M 230,190 A 30,30 0 0,1 243,165" fill="none" stroke="#e11d48" stroke-width="2"/>
  <!-- 레이블 -->
  <g font-family="sans-serif" font-size="16" font-weight="bold" fill="#111111" text-anchor="middle">
    <text x="150" y="45" fill="#2563eb">A</text>
    <text x="45" y="200">B</text>
    <text x="275" y="200">C</text>
    <text x="160" y="215" font-size="14" font-weight="normal">선분 BC</text>
  </g>
  <g font-family="sans-serif" font-size="14" fill="#e11d48" text-anchor="middle">
    <text x="100" y="175">∠B</text>
    <text x="220" y="175">∠C</text>
  </g>
  <!-- 조건 분리 표시 (오른쪽) -->
  <rect x="310" y="30" width="170" height="180" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="395" y="55" font-family="sans-serif" font-size="14" font-weight="bold" fill="#334155" text-anchor="middle">주어진 조건</text>
  <line x1="330" y1="100" x2="460" y2="100" stroke="#111111" stroke-width="2"/>
  <text x="395" y="90" font-family="sans-serif" font-size="13" fill="#111111" text-anchor="middle">선분 BC</text>
  <path d="M 340,160 L 410,160 L 375,120 Z" fill="none" stroke="#e11d48" stroke-width="1.5"/>
  <text x="395" y="180" font-family="sans-serif" font-size="13" fill="#e11d48" text-anchor="middle">∠B, ∠C</text>
</svg>