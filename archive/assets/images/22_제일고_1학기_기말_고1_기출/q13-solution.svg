<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" role="img" aria-labelledby="title desc">
  <title id="title">원의 중심과 반지름 읽기</title>
  <desc id="desc">원 x²+y²−8x+6y−24=0을 표준형 (x−4)²+(y+3)²=49로 고쳐 중심 (4,−3), 반지름 7을 확인</desc>
  <rect width="640" height="300" fill="#fff"/>
  <text x="320" y="28" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="21" font-weight="700" fill="#1e3a5f">완전제곱식으로 중심과 반지름을 읽는다</text>
  <rect x="18" y="45" width="330" height="238" rx="8" fill="#f8fafc" stroke="#dbe3ef"/>
  <g stroke="#e2e8f0" stroke-width="1">
    <line x1="27" y1="73" x2="27" y2="275"/><line x1="49" y1="73" x2="49" y2="275"/><line x1="71" y1="73" x2="71" y2="275"/><line x1="93" y1="73" x2="93" y2="275"/><line x1="115" y1="73" x2="115" y2="275"/><line x1="137" y1="73" x2="137" y2="275"/><line x1="159" y1="73" x2="159" y2="275"/><line x1="181" y1="73" x2="181" y2="275"/><line x1="203" y1="73" x2="203" y2="275"/><line x1="225" y1="73" x2="225" y2="275"/><line x1="247" y1="73" x2="247" y2="275"/><line x1="269" y1="73" x2="269" y2="275"/><line x1="291" y1="73" x2="291" y2="275"/><line x1="313" y1="73" x2="313" y2="275"/><line x1="335" y1="73" x2="335" y2="275"/>
    <line x1="25" y1="77" x2="340" y2="77"/><line x1="25" y1="99" x2="340" y2="99"/><line x1="25" y1="121" x2="340" y2="121"/><line x1="25" y1="143" x2="340" y2="143"/><line x1="25" y1="165" x2="340" y2="165"/><line x1="25" y1="187" x2="340" y2="187"/><line x1="25" y1="209" x2="340" y2="209"/><line x1="25" y1="231" x2="340" y2="231"/><line x1="25" y1="253" x2="340" y2="253"/><line x1="25" y1="275" x2="340" y2="275"/>
  </g>
  <line x1="25" y1="165" x2="340" y2="165" stroke="#0f172a" stroke-width="1.5"/><line x1="105" y1="278" x2="105" y2="58" stroke="#0f172a" stroke-width="1.5"/>
  <text x="330" y="159" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14">x</text><text x="112" y="68" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14">y</text>
  <circle cx="149" cy="198" r="77" fill="#dbeafe" fill-opacity=".68" stroke="#2563eb" stroke-width="2.6"/>
  <circle cx="149" cy="198" r="4.5" fill="#1d4ed8"/><line x1="149" y1="198" x2="226" y2="198" stroke="#dc2626" stroke-width="2.2" stroke-dasharray="6 4"/>
  <text x="157" y="194" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14" font-weight="700">C(4,−3)</text>
  <text x="230" y="193" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14" fill="#b91c1c">r=7</text>
  <rect x="370" y="45" width="252" height="238" rx="8" fill="#f8fafc" stroke="#dbe3ef"/>
  <text x="388" y="75" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="17" font-weight="700" fill="#334155">표준형으로 정리</text>
  <text x="388" y="108" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="15">x²−8x + y²+6y = 24</text>
  <text x="388" y="138" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="15">(x−4)² + (y+3)² = 49</text>
  <line x1="388" y1="154" x2="602" y2="154" stroke="#cbd5e1"/>
  <text x="388" y="187" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="16" font-weight="700" fill="#1d4ed8">중심 (a,b)=(4,−3)</text>
  <text x="388" y="218" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="16" font-weight="700" fill="#1d4ed8">반지름 r=7</text>
  <text x="388" y="253" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="17" font-weight="700" fill="#1d4ed8">a+b+r = 8</text>
  <text x="388" y="274" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="13" fill="#475569">4−3+7=8</text>
</svg>

