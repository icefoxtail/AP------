<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" role="img" aria-labelledby="title desc">
  <title id="title">접선식의 곱 계산</title>
  <desc id="desc">원 x²+y²=16에 접하는 직선 y=mx+n과 제2사분면 접점의 대표 예, f(−4)f(4)=16</desc>
  <rect width="640" height="300" fill="#fff"/>
  <text x="320" y="28" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="21" font-weight="700" fill="#1e3a5f">접선 조건으로 f(−4)f(4)를 없앤다</text>
  <rect x="18" y="45" width="330" height="238" rx="8" fill="#f8fafc" stroke="#dbe3ef"/>
  <g stroke="#e2e8f0" stroke-width="1">
    <line x1="25" y1="75" x2="25" y2="275"/><line x1="50" y1="75" x2="50" y2="275"/><line x1="75" y1="75" x2="75" y2="275"/><line x1="100" y1="75" x2="100" y2="275"/><line x1="125" y1="75" x2="125" y2="275"/><line x1="150" y1="75" x2="150" y2="275"/><line x1="175" y1="75" x2="175" y2="275"/><line x1="200" y1="75" x2="200" y2="275"/><line x1="225" y1="75" x2="225" y2="275"/><line x1="250" y1="75" x2="250" y2="275"/><line x1="275" y1="75" x2="275" y2="275"/><line x1="300" y1="75" x2="300" y2="275"/><line x1="325" y1="75" x2="325" y2="275"/>
    <line x1="23" y1="85" x2="338" y2="85"/><line x1="23" y1="110" x2="338" y2="110"/><line x1="23" y1="135" x2="338" y2="135"/><line x1="23" y1="160" x2="338" y2="160"/><line x1="23" y1="185" x2="338" y2="185"/><line x1="23" y1="210" x2="338" y2="210"/><line x1="23" y1="235" x2="338" y2="235"/><line x1="23" y1="260" x2="338" y2="260"/>
  </g>
  <line x1="23" y1="190" x2="338" y2="190" stroke="#0f172a" stroke-width="1.5"/><line x1="120" y1="278" x2="120" y2="58" stroke="#0f172a" stroke-width="1.5"/>
  <text x="330" y="184" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14">x</text><text x="127" y="68" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14">y</text>
  <circle cx="120" cy="190" r="80" fill="#dbeafe" fill-opacity=".68" stroke="#2563eb" stroke-width="2.6"/>
  <line x1="40" y1="157" x2="130" y2="67" stroke="#dc2626" stroke-width="2.6"/>
  <line x1="120" y1="190" x2="63" y2="133" stroke="#0f766e" stroke-width="2.2" stroke-dasharray="6 4"/>
  <circle cx="120" cy="190" r="4.5" fill="#1d4ed8"/><circle cx="63" cy="133" r="4.4" fill="#dc2626"/>
  <text x="128" y="184" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14" font-weight="700">O(0,0)</text>
  <text x="69" y="126" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="13" font-weight="700" fill="#b91c1c">P(QII)</text>
  <text x="160" y="74" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="13" fill="#b91c1c">y=mx+n</text>
  <rect x="370" y="45" width="252" height="238" rx="8" fill="#f8fafc" stroke="#dbe3ef"/>
  <text x="388" y="75" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="17" font-weight="700" fill="#334155">곱을 전개</text>
  <text x="388" y="108" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14">f(−4)=−4m+n</text>
  <text x="388" y="136" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14">f(4)=4m+n</text>
  <text x="388" y="166" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="15">곱 = n²−16m²</text>
  <line x1="388" y1="182" x2="602" y2="182" stroke="#cbd5e1"/>
  <text x="388" y="214" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14">접선 조건: n²=16(m²+1)</text>
  <text x="388" y="249" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="19" font-weight="700" fill="#1d4ed8">곱 = 16</text>
  <text x="388" y="272" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="13" fill="#475569">제2사분면 조건은 부호를 정하지만 곱은 일정</text>
</svg>

