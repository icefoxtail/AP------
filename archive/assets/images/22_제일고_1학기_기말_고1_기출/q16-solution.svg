<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_1" data-geometry-preset="GEOMETRY_STANDARD" data-axis-scale-mode="EQUAL_UNIT" data-fact-hash="61afac517e8afadd833a4a6b512be842f077a8df644ed35f51329015c770139b" data-geometry-fact-hash="61afac517e8afadd833a4a6b512be842f077a8df644ed35f51329015c770139b" data-visual-provenance="deterministic-python-independent-facts"><title id="title">두 원 조건의 정수 구간</title><desc id="desc">허용되는 정수 k는 −7,−6,−5,−4,−3,−2,−1,1,2이고 0은 제외된 수직선</desc><style>.title{font:700 20px "Noto Sans KR","Malgun Gothic",sans-serif;fill:#1e3a5f}.note{font:13px "Noto Sans KR","Malgun Gothic",sans-serif;fill:#334155}.small{font:12px "Noto Sans KR","Malgun Gothic",sans-serif;fill:#475569}</style><rect width="640" height="300" fill="#fff"/><text x="320" y="28" text-anchor="middle" class="title">두 원과의 위치 관계를 동시에 만족하는 k</text><rect x="18" y="45" width="330" height="238" rx="8" fill="#f8fafc" stroke="#dbe3ef"/><g stroke="#e2e8f0" stroke-width="1"><line x1="25" y1="78" x2="25" y2="270"/><line x1="55" y1="78" x2="55" y2="270"/><line x1="85" y1="78" x2="85" y2="270"/><line x1="115" y1="78" x2="115" y2="270"/><line x1="145" y1="78" x2="145" y2="270"/><line x1="175" y1="78" x2="175" y2="270"/><line x1="205" y1="78" x2="205" y2="270"/><line x1="235" y1="78" x2="235" y2="270"/><line x1="265" y1="78" x2="265" y2="270"/><line x1="295" y1="78" x2="295" y2="270"/><line x1="325" y1="78" x2="325" y2="270"/></g><line x1="30" y1="180" x2="334" y2="180" stroke="#0f172a" stroke-width="2"/><line x1="50" y1="180" x2="320" y2="180" stroke="#86efac" stroke-width="7" stroke-linecap="round"/><text x="91" y="151" class="small" fill="#15803d">허용 구간의 정수</text><g fill="#1d4ed8"><circle data-point-label="k=−7" data-point-value="-7" cx="50" cy="180" r="4"/><circle data-point-label="k=−6" data-point-value="-6" cx="80" cy="180" r="4"/><circle data-point-label="k=−5" data-point-value="-5" cx="110" cy="180" r="4"/><circle data-point-label="k=−4" data-point-value="-4" cx="140" cy="180" r="4"/><circle data-point-label="k=−3" data-point-value="-3" cx="170" cy="180" r="4"/><circle data-point-label="k=−2" data-point-value="-2" cx="200" cy="180" r="4"/><circle data-point-label="k=−1" data-point-value="-1" cx="230" cy="180" r="4"/><circle data-point-label="k=1" data-point-value="1" cx="290" cy="180" r="4"/><circle data-point-label="k=2" data-point-value="2" cx="320" cy="180" r="4"/></g><g font-family="Arial, 'Noto Sans KR', sans-serif" font-size="12" fill="#334155" text-anchor="middle"><text x="50" y="204">−7</text><text x="80" y="204">−6</text><text x="110" y="204">−5</text><text x="140" y="204">−4</text><text x="170" y="204">−3</text><text x="200" y="204">−2</text><text x="230" y="204">−1</text><text x="260" y="204" fill="#b91c1c">0</text><text x="290" y="204">1</text><text x="320" y="204">2</text></g><line x1="260" y1="172" x2="260" y2="188" stroke="#dc2626" stroke-width="3"/><text x="246" y="232" class="small" fill="#b91c1c">0은 조건 k≠0으로 제외</text><rect x="370" y="45" width="252" height="238" rx="8" fill="#f8fafc" stroke="#dbe3ef"/><text x="388" y="75" class="title" font-size="17">조건의 교집합</text><text x="388" y="108" class="note">(가) |k| &lt; 5√2</text><text x="388" y="138" class="note">(나) −5−5√2 &lt; k &lt; −5+5√2</text><text x="388" y="168" class="note">공통 범위: −5√2 &lt; k &lt; −5+5√2</text><line x1="388" y1="184" x2="602" y2="184" stroke="#cbd5e1"/><text x="388" y="216" class="note">정수: −7,−6,−5,−4,−3,−2,−1,1,2</text><text x="388" y="250" class="title" font-size="19" fill="#1d4ed8">개수 = 9</text><text x="388" y="272" class="small">0에는 점을 찍지 않는다</text></svg>
