<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" role="img" aria-labelledby="title desc">
  <title id="title">두 원 조건의 정수 구간</title>
  <desc id="desc">직선 y=x+k가 첫 원과 두 점에서 만나고 둘째 원과 만나지 않는 조건의 교집합에서 정수 k 아홉 개를 선택</desc>
  <rect width="640" height="300" fill="#fff"/>
  <text x="320" y="28" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="21" font-weight="700" fill="#1e3a5f">두 원과의 위치 관계를 동시에 만족하는 k</text>
  <rect x="18" y="45" width="330" height="238" rx="8" fill="#f8fafc" stroke="#dbe3ef"/>
  <g stroke="#e2e8f0" stroke-width="1">
    <line x1="25" y1="78" x2="25" y2="270"/><line x1="55" y1="78" x2="55" y2="270"/><line x1="85" y1="78" x2="85" y2="270"/><line x1="115" y1="78" x2="115" y2="270"/><line x1="145" y1="78" x2="145" y2="270"/><line x1="175" y1="78" x2="175" y2="270"/><line x1="205" y1="78" x2="205" y2="270"/><line x1="235" y1="78" x2="235" y2="270"/><line x1="265" y1="78" x2="265" y2="270"/><line x1="295" y1="78" x2="295" y2="270"/><line x1="325" y1="78" x2="325" y2="270"/>
  </g>
  <line x1="30" y1="180" x2="334" y2="180" stroke="#0f172a" stroke-width="2"/>
  <line x1="50" y1="180" x2="260" y2="180" stroke="#93c5fd" stroke-width="12" stroke-linecap="round" opacity=".72"/>
  <line x1="50" y1="180" x2="162" y2="180" stroke="#86efac" stroke-width="7" stroke-linecap="round"/>
  <text x="52" y="128" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="13" fill="#2563eb">|k|&lt;5√2</text>
  <text x="91" y="151" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="12" fill="#15803d">교집합</text>
  <g fill="#1d4ed8"><circle cx="50" cy="180" r="4"/><circle cx="80" cy="180" r="4"/><circle cx="110" cy="180" r="4"/><circle cx="140" cy="180" r="4"/><circle cx="170" cy="180" r="4"/><circle cx="200" cy="180" r="4"/><circle cx="230" cy="180" r="4"/><circle cx="260" cy="180" r="4"/></g>
  <g font-family="Arial, 'Noto Sans KR', sans-serif" font-size="12" fill="#334155" text-anchor="middle"><text x="50" y="204">−7</text><text x="80" y="204">−6</text><text x="110" y="204">−5</text><text x="140" y="204">−4</text><text x="170" y="204">−3</text><text x="200" y="204">−2</text><text x="230" y="204">−1</text><text x="260" y="204">0</text><text x="290" y="204">1</text><text x="320" y="204">2</text></g>
  <line x1="260" y1="172" x2="260" y2="188" stroke="#dc2626" stroke-width="3"/><text x="246" y="232" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="12" fill="#b91c1c">0 제외</text>
  <circle cx="100" cy="255" r="35" fill="#dbeafe" fill-opacity=".5" stroke="#2563eb" stroke-width="2"/><circle cx="100" cy="215" r="16" fill="#fce7f3" fill-opacity=".7" stroke="#db2777" stroke-width="2"/>
  <line x1="100" y1="215" x2="100" y2="239" stroke="#dc2626" stroke-width="2.2" stroke-dasharray="5 3"/><text x="145" y="255" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="12" fill="#475569">예: k=2는 둘째 원과 만나지 않음</text>
  <rect x="370" y="45" width="252" height="238" rx="8" fill="#f8fafc" stroke="#dbe3ef"/>
  <text x="388" y="75" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="17" font-weight="700" fill="#334155">조건의 교집합</text>
  <text x="388" y="108" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14">(가) |k| &lt; 5√2</text>
  <text x="388" y="138" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14">(나) −5−5√2 &lt; k &lt; −5+5√2</text>
  <text x="388" y="168" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14">따라서 −5√2 &lt; k &lt; −5+5√2</text>
  <line x1="388" y1="184" x2="602" y2="184" stroke="#cbd5e1"/>
  <text x="388" y="216" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14">정수: −7,−6,−5,−4,−3,−2,−1,1,2</text>
  <text x="388" y="250" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="19" font-weight="700" fill="#1d4ed8">개수 = 9</text>
  <text x="388" y="272" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="13" fill="#475569">k≠0 조건으로 0은 세지 않는다</text>
</svg>

