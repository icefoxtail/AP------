<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" role="img" aria-labelledby="title desc" data-scale-policy="SCHEMATIC_ALLOWED">
  <title id="title">외부점에서 원에 그은 접선</title>
  <desc id="desc">외부점 P(4,5), 원 x²+y²=9의 중심 O와 접점 Q가 이루는 직각삼각형에서 PQ=4√2</desc>
  <rect width="640" height="300" fill="#fff"/>
  <text x="320" y="28" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="21" font-weight="700" fill="#1e3a5f">반지름 OQ는 접선 PQ와 수직</text>
  <rect x="18" y="45" width="330" height="238" rx="8" fill="#f8fafc" stroke="#dbe3ef"/>
  <g stroke="#e2e8f0" stroke-width="1">
    <line x1="23" y1="80" x2="23" y2="270"/><line x1="48" y1="80" x2="48" y2="270"/><line x1="73" y1="80" x2="73" y2="270"/><line x1="98" y1="80" x2="98" y2="270"/><line x1="123" y1="80" x2="123" y2="270"/><line x1="148" y1="80" x2="148" y2="270"/><line x1="173" y1="80" x2="173" y2="270"/><line x1="198" y1="80" x2="198" y2="270"/><line x1="223" y1="80" x2="223" y2="270"/><line x1="248" y1="80" x2="248" y2="270"/><line x1="273" y1="80" x2="273" y2="270"/><line x1="298" y1="80" x2="298" y2="270"/><line x1="323" y1="80" x2="323" y2="270"/>
    <line x1="22" y1="95" x2="338" y2="95"/><line x1="22" y1="120" x2="338" y2="120"/><line x1="22" y1="145" x2="338" y2="145"/><line x1="22" y1="170" x2="338" y2="170"/><line x1="22" y1="195" x2="338" y2="195"/><line x1="22" y1="220" x2="338" y2="220"/><line x1="22" y1="245" x2="338" y2="245"/><line x1="22" y1="270" x2="338" y2="270"/>
  </g>
  <line x1="22" y1="220" x2="338" y2="220" stroke="#0f172a" stroke-width="1.5"/><line x1="95" y1="278" x2="95" y2="58" stroke="#0f172a" stroke-width="1.5"/>
  <text x="330" y="214" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14">x</text><text x="102" y="68" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14">y</text>
  <circle cx="95" cy="220" r="60" fill="#dbeafe" fill-opacity=".72" stroke="#2563eb" stroke-width="2.6"/>
  <line x1="175" y1="120" x2="71" y2="165" stroke="#dc2626" stroke-width="2.6"/>
  <line x1="95" y1="220" x2="71" y2="165" stroke="#0f766e" stroke-width="2.2" stroke-dasharray="6 4"/>
  <line x1="175" y1="120" x2="154" y2="231" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="5 4"/>
  <circle cx="95" cy="220" r="4.5" fill="#1d4ed8"/><circle cx="175" cy="120" r="4.5" fill="#7c3aed"/><circle cx="71" cy="165" r="4.3" fill="#dc2626"/><circle cx="154" cy="231" r="3.8" fill="#94a3b8"/>
  <text x="103" y="215" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14" font-weight="700">O(0,0)</text>
  <text x="180" y="114" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14" font-weight="700" fill="#6d28d9">P(4,5)</text>
  <text x="45" y="158" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14" font-weight="700" fill="#b91c1c">Q</text>
  <text x="102" y="188" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="13" fill="#047857">OQ ⟂ PQ</text>
  <rect x="370" y="45" width="252" height="238" rx="8" fill="#f8fafc" stroke="#dbe3ef"/>
  <text x="388" y="75" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="17" font-weight="700" fill="#334155">직각삼각형 OPQ</text>
  <text x="388" y="108" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="15">OP² = 4²+5² = 41</text>
  <text x="388" y="138" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="15">OQ = r = 3</text>
  <text x="388" y="168" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="15">PQ² = OP²−OQ² = 41−9</text>
  <line x1="388" y1="184" x2="602" y2="184" stroke="#cbd5e1"/>
  <text x="388" y="218" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="19" font-weight="700" fill="#1d4ed8">PQ = √32 = 4√2</text>
  <text x="388" y="268" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="13" fill="#475569">접점에서는 반지름과 접선이 수직이다</text>
</svg>

