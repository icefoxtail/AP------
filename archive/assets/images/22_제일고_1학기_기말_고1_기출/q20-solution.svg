<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" role="img" aria-labelledby="title desc">
  <title id="title">원의 방정식 조건 반례</title>
  <desc id="desc">ㄱ은 x²+y²=0에서 원이 아닌 점이 되고, ㄴ은 a=1,b=−1일 때 x축과 y축 모두에 접하므로 두 문장이 거짓</desc>
  <rect width="640" height="300" fill="#fff"/>
  <text x="320" y="28" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="21" font-weight="700" fill="#1e3a5f">조건이 빠진 문장은 반례로 확인한다</text>
  <rect x="18" y="45" width="330" height="238" rx="8" fill="#f8fafc" stroke="#dbe3ef"/>
  <g stroke="#e2e8f0" stroke-width="1">
    <line x1="24" y1="75" x2="24" y2="275"/><line x1="49" y1="75" x2="49" y2="275"/><line x1="74" y1="75" x2="74" y2="275"/><line x1="99" y1="75" x2="99" y2="275"/><line x1="124" y1="75" x2="124" y2="275"/><line x1="149" y1="75" x2="149" y2="275"/><line x1="174" y1="75" x2="174" y2="275"/><line x1="199" y1="75" x2="199" y2="275"/><line x1="224" y1="75" x2="224" y2="275"/><line x1="249" y1="75" x2="249" y2="275"/><line x1="274" y1="75" x2="274" y2="275"/><line x1="299" y1="75" x2="299" y2="275"/><line x1="324" y1="75" x2="324" y2="275"/>
    <line x1="22" y1="75" x2="338" y2="75"/><line x1="22" y1="100" x2="338" y2="100"/><line x1="22" y1="125" x2="338" y2="125"/><line x1="22" y1="150" x2="338" y2="150"/><line x1="22" y1="175" x2="338" y2="175"/><line x1="22" y1="200" x2="338" y2="200"/><line x1="22" y1="225" x2="338" y2="225"/><line x1="22" y1="250" x2="338" y2="250"/><line x1="22" y1="275" x2="338" y2="275"/>
  </g>
  <line x1="22" y1="200" x2="338" y2="200" stroke="#0f172a" stroke-width="1.5"/><line x1="120" y1="278" x2="120" y2="58" stroke="#0f172a" stroke-width="1.5"/>
  <text x="330" y="194" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14">x</text><text x="127" y="68" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14">y</text>
  <circle cx="120" cy="200" r="5" fill="#dc2626"/><line x1="113" y1="193" x2="127" y2="207" stroke="#dc2626" stroke-width="2"/><line x1="127" y1="193" x2="113" y2="207" stroke="#dc2626" stroke-width="2"/>
  <text x="32" y="95" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="13" fill="#b91c1c">ㄱ: x²+y²=0 → 한 점</text>
  <circle cx="145" cy="225" r="25" fill="#dcfce7" fill-opacity=".8" stroke="#16a34a" stroke-width="2.6"/>
  <circle cx="145" cy="225" r="4.3" fill="#15803d"/><text x="151" y="220" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="13" font-weight="700" fill="#15803d">C(1,−1)</text>
  <text x="174" y="260" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="12" fill="#15803d">a=1,b=−1: 두 축에 접함</text>
  <rect x="370" y="45" width="252" height="238" rx="8" fill="#f8fafc" stroke="#dbe3ef"/>
  <text x="388" y="75" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="17" font-weight="700" fill="#334155">두 문장의 반례</text>
  <text x="388" y="108" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14">ㄱ: A=B=C=0이면</text>
  <text x="388" y="136" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="15">x²+y²=0 → 원이 아니라 점</text>
  <line x1="388" y1="151" x2="602" y2="151" stroke="#cbd5e1"/>
  <text x="388" y="181" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14">ㄴ: a=1, b=−1이면 a≠b</text>
  <text x="388" y="209" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14">|a|=|b|=1 → x축에도 접함</text>
  <text x="388" y="244" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="17" font-weight="700" fill="#1d4ed8">ㄱ, ㄴ 모두 거짓</text>
  <text x="388" y="272" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="13" fill="#475569">a≠b는 |a|≠|b|를 보장하지 않는다</text>
</svg>

