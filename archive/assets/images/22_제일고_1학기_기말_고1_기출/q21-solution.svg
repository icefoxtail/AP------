<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" role="img" aria-labelledby="title desc">
  <title id="title">외분점의 원형 자취</title>
  <desc id="desc">원 x²+y²−2x=0 위의 P가 외분점 Q로 옮겨질 때 Q의 자취는 중심 (7,0), 반지름 3인 원</desc>
  <rect width="640" height="300" fill="#fff"/>
  <text x="320" y="28" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="21" font-weight="700" fill="#1e3a5f">외분점 좌표식이 원을 다른 원으로 보낸다</text>
  <rect x="18" y="45" width="330" height="238" rx="8" fill="#f8fafc" stroke="#dbe3ef"/>
  <g stroke="#e2e8f0" stroke-width="1">
    <line x1="23" y1="78" x2="23" y2="275"/><line x1="45" y1="78" x2="45" y2="275"/><line x1="67" y1="78" x2="67" y2="275"/><line x1="89" y1="78" x2="89" y2="275"/><line x1="111" y1="78" x2="111" y2="275"/><line x1="133" y1="78" x2="133" y2="275"/><line x1="155" y1="78" x2="155" y2="275"/><line x1="177" y1="78" x2="177" y2="275"/><line x1="199" y1="78" x2="199" y2="275"/><line x1="221" y1="78" x2="221" y2="275"/><line x1="243" y1="78" x2="243" y2="275"/><line x1="265" y1="78" x2="265" y2="275"/><line x1="287" y1="78" x2="287" y2="275"/><line x1="309" y1="78" x2="309" y2="275"/><line x1="331" y1="78" x2="331" y2="275"/>
    <line x1="22" y1="90" x2="338" y2="90"/><line x1="22" y1="112" x2="338" y2="112"/><line x1="22" y1="134" x2="338" y2="134"/><line x1="22" y1="156" x2="338" y2="156"/><line x1="22" y1="178" x2="338" y2="178"/><line x1="22" y1="200" x2="338" y2="200"/><line x1="22" y1="222" x2="338" y2="222"/><line x1="22" y1="244" x2="338" y2="244"/><line x1="22" y1="266" x2="338" y2="266"/>
  </g>
  <line x1="22" y1="200" x2="338" y2="200" stroke="#0f172a" stroke-width="1.5"/><line x1="50" y1="278" x2="50" y2="58" stroke="#0f172a" stroke-width="1.5"/>
  <text x="330" y="194" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14">x</text><text x="57" y="68" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14">y</text>
  <circle cx="72" cy="200" r="22" fill="#dbeafe" fill-opacity=".8" stroke="#2563eb" stroke-width="2.4"/>
  <circle cx="204" cy="200" r="66" fill="#dcfce7" fill-opacity=".42" stroke="#16a34a" stroke-width="2.6"/>
  <line x1="72" y1="178" x2="204" y2="134" stroke="#dc2626" stroke-width="2.2" stroke-dasharray="7 5"/>
  <line x1="72" y1="200" x2="204" y2="200" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="5 4"/>
  <circle cx="72" cy="178" r="4.2" fill="#2563eb"/><circle cx="204" cy="134" r="4.2" fill="#16a34a"/><circle cx="72" cy="200" r="4.2" fill="#1d4ed8"/><circle cx="204" cy="200" r="4.5" fill="#15803d"/>
  <text x="31" y="173" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="13" font-weight="700" fill="#1d4ed8">P(1,1)</text>
  <text x="210" y="128" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="13" font-weight="700" fill="#15803d">Q(7,3)</text>
  <text x="76" y="218" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="12" fill="#1d4ed8">원 P의 자취</text><text x="210" y="218" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="12" fill="#15803d">Q의 자취</text>
  <rect x="370" y="45" width="252" height="238" rx="8" fill="#f8fafc" stroke="#dbe3ef"/>
  <text x="388" y="75" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="17" font-weight="700" fill="#334155">외분점 좌표식</text>
  <text x="388" y="108" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14">P=(u,v), Q=(x,y)</text>
  <text x="388" y="138" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14">x=3u+4,  y=3v</text>
  <text x="388" y="168" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14">u=(x−4)/3,  v=y/3</text>
  <text x="388" y="198" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14">→ (x−7)²+y²=9</text>
  <line x1="388" y1="211" x2="602" y2="211" stroke="#cbd5e1"/>
  <text x="388" y="243" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="17" font-weight="700" fill="#1d4ed8">a+b+r=7+0+3=10</text>
  <text x="388" y="272" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="13" fill="#475569">중심 (7,0), 반지름 3</text>
</svg>

