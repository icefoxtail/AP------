<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_1" data-geometry-preset="GEOMETRY_STANDARD" data-axis-scale-mode="EQUAL_UNIT" data-fact-hash="b7757718ca63f389aec9f7f316d320ed62a728f47253e31dbc104b95704deecc" data-geometry-fact-hash="b7757718ca63f389aec9f7f316d320ed62a728f47253e31dbc104b95704deecc" data-visual-provenance="independent-facts">
  <title id="title">점의 순서 A-P-Q와 자취 원</title>
  <desc id="desc">A(-2,0), P(1,1), Q(7,3)가 A-P-Q 순서로 놓이고 AQ=3AP, PQ=2AP가 되는 관계와 P의 원, Q의 자취 원을 표시한 해설 도형</desc>
  <style>
    .tick{font:11px "STIX Two Math","Malgun Gothic",serif;fill:#475569}
    .axis{font:italic 14px "STIX Two Math","Malgun Gothic",serif;fill:#111827}
    .label{font:12px "STIX Two Math","Malgun Gothic",serif;font-weight:700}
    .note{font:12px "Noto Sans KR","Malgun Gothic",sans-serif;fill:#334155}
    .panel-title{font:700 16px "Noto Sans KR","Malgun Gothic",sans-serif;fill:#111827}
  </style>
  <rect width="800" height="420" fill="#fff"/>
  <text x="28" y="34" class="panel-title">점의 순서와 거리 관계로 만든 자취 원</text>
  <text x="28" y="54" class="note">A-P-Q · AQ=3AP · P의 원 → Q의 자취</text>
  <rect x="24" y="70" width="500" height="320" rx="12" fill="#fff" stroke="#cbd5e1"/>
  <g stroke="#e5e7eb" stroke-width="0.8">
    <line x1="40" y1="70" x2="40" y2="370"/><line x1="70" y1="70" x2="70" y2="370"/><line x1="100" y1="70" x2="100" y2="370"/><line x1="130" y1="70" x2="130" y2="370"/><line x1="160" y1="70" x2="160" y2="370"/><line x1="190" y1="70" x2="190" y2="370"/><line x1="220" y1="70" x2="220" y2="370"/><line x1="250" y1="70" x2="250" y2="370"/><line x1="280" y1="70" x2="280" y2="370"/><line x1="310" y1="70" x2="310" y2="370"/><line x1="340" y1="70" x2="340" y2="370"/><line x1="370" y1="70" x2="370" y2="370"/><line x1="400" y1="70" x2="400" y2="370"/><line x1="430" y1="70" x2="430" y2="370"/><line x1="460" y1="70" x2="460" y2="370"/><line x1="490" y1="70" x2="490" y2="370"/>
    <line x1="40" y1="70" x2="490" y2="70"/><line x1="40" y1="100" x2="490" y2="100"/><line x1="40" y1="130" x2="490" y2="130"/><line x1="40" y1="160" x2="490" y2="160"/><line x1="40" y1="190" x2="490" y2="190"/><line x1="40" y1="220" x2="490" y2="220"/><line x1="40" y1="250" x2="490" y2="250"/><line x1="40" y1="280" x2="490" y2="280"/><line x1="40" y1="310" x2="490" y2="310"/><line x1="40" y1="340" x2="490" y2="340"/><line x1="40" y1="370" x2="490" y2="370"/>
  </g>
  <line data-geometry="axis-x" x1="40" y1="250" x2="490" y2="250" stroke="#111827" stroke-width="1.4"/>
  <line data-geometry="axis-y" x1="160" y1="70" x2="160" y2="370" stroke="#111827" stroke-width="1.4"/>
  <text x="480" y="242" class="axis">x</text><text x="168" y="84" class="axis">y</text>
  <text x="94" y="266" class="tick">−2</text><text x="184" y="266" class="tick">1</text><text x="364" y="266" class="tick">7</text>
  <circle data-geometry="circle" data-center-x="1" data-center-y="0" data-radius="1" cx="190" cy="250" r="30" fill="#dbeafe" fill-opacity=".72" stroke="#2563eb" stroke-width="2.4"/>
  <circle data-geometry="circle" data-center-x="7" data-center-y="0" data-radius="3" cx="370" cy="250" r="90" fill="#dcfce7" fill-opacity=".34" stroke="#16a34a" stroke-width="2.4"/>
  <line data-geometry="segment" data-relation="A-P-Q" x1="100" y1="250" x2="370" y2="160" stroke="#dc2626" stroke-width="2.2" stroke-dasharray="7 5"/>
  <line data-geometry="segment" data-relation="source-radius" x1="190" y1="250" x2="190" y2="220" stroke="#2563eb" stroke-width="2"/>
  <line data-geometry="segment" data-relation="target-radius" x1="370" y1="250" x2="370" y2="160" stroke="#16a34a" stroke-width="2"/>
  <circle data-point-label="A(-2,0)" data-point-x="-2" data-point-y="0" cx="100" cy="250" r="4.5" fill="#111827"/>
  <circle data-point-label="P(1,1)" data-point-x="1" data-point-y="1" cx="190" cy="220" r="4.5" fill="#2563eb" stroke="#fff" stroke-width="1.2"/>
  <circle data-point-label="Q(7,3)" data-point-x="7" data-point-y="3" cx="370" cy="160" r="4.5" fill="#16a34a" stroke="#fff" stroke-width="1.2"/>
  <circle data-point-label="O(1,0)" data-point-x="1" data-point-y="0" cx="190" cy="250" r="3.2" fill="#1d4ed8"/>
  <circle data-point-label="O′(7,0)" data-point-x="7" data-point-y="0" cx="370" cy="250" r="3.2" fill="#15803d"/>
  <text x="75" y="240" class="label" fill="#111827">A(−2,0)</text>
  <text x="198" y="212" class="label" fill="#1d4ed8">P(1,1)</text>
  <text x="378" y="153" class="label" fill="#15803d">Q(7,3)</text>
  <text x="176" y="272" class="label" fill="#1d4ed8">O(1,0)</text>
  <text x="376" y="272" class="label" fill="#15803d">O′(7,0)</text>
  <text x="112" y="235" class="note" fill="#b91c1c">A-P-Q</text>
  <text x="116" y="292" class="note" fill="#2563eb">P의 원: 중심 (1,0), r=1</text>
  <text x="296" y="350" class="note" fill="#15803d">Q의 자취: 중심 (7,0), r=3</text>
  <rect x="548" y="70" width="228" height="320" rx="12" fill="#f8fafc" stroke="#dbe3ef"/>
  <text x="566" y="100" class="panel-title">위치·거리 관계</text>
  <text x="566" y="130" class="note">A — P — Q</text>
  <text x="566" y="154" class="note">AQ = AP + PQ</text>
  <text x="566" y="178" class="note">AQ : PQ = 3 : 2</text>
  <text x="566" y="202" class="note">PQ = 2AP</text>
  <text x="566" y="226" class="note">AQ = 3AP</text>
  <line x1="566" y1="242" x2="758" y2="242" stroke="#cbd5e1"/>
  <text x="566" y="270" class="note">P=(u,v), Q=(x,y)</text>
  <text x="566" y="294" class="note">x+2 = 3(u+2)</text>
  <text x="566" y="318" class="note">y = 3v</text>
  <text x="566" y="348" class="note">(x−7)²+y²=9</text>
  <text x="566" y="374" class="note">a+b+r = 7+0+3 = 10</text>
</svg>
