<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" role="img" aria-labelledby="title desc" data-scale-policy="SCHEMATIC_ALLOWED">
  <title id="title">두 축에 동시에 접하는 두 원</title>
  <desc id="desc">점 (2,4)를 지나고 x축과 y축에 접하는 원의 중심 (2,2), (10,10), 반지름 2와 10</desc>
  <rect width="640" height="300" fill="#fff"/>
  <text x="320" y="28" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="21" font-weight="700" fill="#1e3a5f">두 좌표축에 접하는 원의 중심은 (±r,±r)</text>
  <rect x="18" y="45" width="330" height="238" rx="8" fill="#f8fafc" stroke="#dbe3ef"/>
  <g stroke="#e2e8f0" stroke-width="1">
    <line x1="21" y1="77" x2="21" y2="275"/><line x1="47" y1="77" x2="47" y2="275"/><line x1="73" y1="77" x2="73" y2="275"/><line x1="99" y1="77" x2="99" y2="275"/><line x1="125" y1="77" x2="125" y2="275"/><line x1="151" y1="77" x2="151" y2="275"/><line x1="177" y1="77" x2="177" y2="275"/><line x1="203" y1="77" x2="203" y2="275"/><line x1="229" y1="77" x2="229" y2="275"/><line x1="255" y1="77" x2="255" y2="275"/><line x1="281" y1="77" x2="281" y2="275"/><line x1="307" y1="77" x2="307" y2="275"/><line x1="333" y1="77" x2="333" y2="275"/>
    <line x1="20" y1="77" x2="338" y2="77"/><line x1="20" y1="103" x2="338" y2="103"/><line x1="20" y1="129" x2="338" y2="129"/><line x1="20" y1="155" x2="338" y2="155"/><line x1="20" y1="181" x2="338" y2="181"/><line x1="20" y1="207" x2="338" y2="207"/><line x1="20" y1="233" x2="338" y2="233"/><line x1="20" y1="259" x2="338" y2="259"/>
  </g>
  <line x1="20" y1="250" x2="338" y2="250" stroke="#0f172a" stroke-width="1.5"/><line x1="55" y1="278" x2="55" y2="58" stroke="#0f172a" stroke-width="1.5"/>
  <text x="330" y="244" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14">x</text><text x="62" y="68" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14">y</text>
  <circle cx="140" cy="165" r="85" fill="#dbeafe" fill-opacity=".38" stroke="#2563eb" stroke-width="2.6"/>
  <circle cx="72" cy="233" r="17" fill="#dcfce7" fill-opacity=".85" stroke="#16a34a" stroke-width="2.4"/>
  <line x1="72" y1="233" x2="140" y2="165" stroke="#7c3aed" stroke-width="2" stroke-dasharray="6 4"/>
  <circle cx="72" cy="233" r="4.3" fill="#15803d"/><circle cx="140" cy="165" r="4.5" fill="#1d4ed8"/>
  <text x="77" y="227" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="13" font-weight="700" fill="#15803d">C₁(2,2)</text>
  <text x="147" y="159" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="13" font-weight="700" fill="#1d4ed8">C₂(10,10)</text>
  <text x="218" y="240" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="13" fill="#475569">P(2,4)</text>
  <text x="88" y="270" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="12" fill="#15803d">r=2</text><text x="208" y="90" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="12" fill="#1d4ed8">r=10</text>
  <rect x="370" y="45" width="252" height="238" rx="8" fill="#f8fafc" stroke="#dbe3ef"/>
  <text x="388" y="75" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="17" font-weight="700" fill="#334155">중심을 문자로 두기</text>
  <text x="388" y="107" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14">중심은 (±r,±r), 반지름은 r</text>
  <text x="388" y="136" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14">P(2,4)까지 거리 = r</text>
  <text x="388" y="164" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14">1사분면: (2−r)²+(4−r)²=r²</text>
  <text x="388" y="192" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="15">r=2 또는 r=10</text>
  <line x1="388" y1="207" x2="602" y2="207" stroke="#cbd5e1"/>
  <text x="388" y="237" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="17" font-weight="700" fill="#1d4ed8">둘레의 합 = 2π(2+10)</text>
  <text x="388" y="270" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="19" font-weight="700" fill="#1d4ed8">= 24π</text>
</svg>

