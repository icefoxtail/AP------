<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="900" height="320" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_1" data-geometry-preset="GEOMETRY_STANDARD" data-axis-scale-mode="EQUAL_UNIT" data-fact-hash="785a452ec7fc18cb7c7adb659fed1c872e1b98b2a492235b0a7b60cd1ec009c4" data-geometry-fact-hash="785a452ec7fc18cb7c7adb659fed1c872e1b98b2a492235b0a7b60cd1ec009c4" data-visual-provenance="deterministic-independent-facts">
  <title id="title">수직선 위의 내분점과 선분 밖의 점</title>
  <desc id="desc">수직선 위에서 Q-A-P-B 순서, AP:PB=1:3, AQ:QB=1:3, P=3, Q=-6, PQ=9를 표시한 해설 도형</desc>
  <style>
    .title{font:700 18px "Noto Sans KR","Malgun Gothic",sans-serif;fill:#111827}
    .note{font:13px "Noto Sans KR","Malgun Gothic",sans-serif;fill:#334155}
    .label{font:700 14px "STIX Two Math","Malgun Gothic",serif}
    .tick{font:11px "STIX Two Math","Malgun Gothic",serif;fill:#475569}
  </style>
  <rect width="900" height="320" fill="#fff"/>
  <text x="30" y="34" class="title">점의 순서와 거리 관계</text>
  <text x="30" y="58" class="note">Q — A — P — B · 선분 안의 P와 선분 밖의 Q를 수직선에서 확인</text>
  <line x1="70" y1="145" x2="790" y2="145" stroke="#111827" stroke-width="2"/>
  <path d="M790 145 l-12 -6 v12 z" fill="#111827"/>
  <g stroke="#cbd5e1" stroke-width="1">
    <line x1="70" y1="132" x2="70" y2="158"/><line x1="110" y1="132" x2="110" y2="158"/><line x1="150" y1="132" x2="150" y2="158"/><line x1="190" y1="132" x2="190" y2="158"/><line x1="230" y1="132" x2="230" y2="158"/><line x1="270" y1="132" x2="270" y2="158"/><line x1="310" y1="132" x2="310" y2="158"/><line x1="350" y1="132" x2="350" y2="158"/><line x1="390" y1="132" x2="390" y2="158"/><line x1="430" y1="132" x2="430" y2="158"/><line x1="470" y1="132" x2="470" y2="158"/><line x1="510" y1="132" x2="510" y2="158"/><line x1="550" y1="132" x2="550" y2="158"/><line x1="590" y1="132" x2="590" y2="158"/><line x1="630" y1="132" x2="630" y2="158"/><line x1="670" y1="132" x2="670" y2="158"/><line x1="710" y1="132" x2="710" y2="158"/><line x1="750" y1="132" x2="750" y2="158"/>
  </g>
  <line data-geometry="segment" data-relation="AQ" x1="70" y1="105" x2="310" y2="105" stroke="#dc2626" stroke-width="4"/>
  <line data-geometry="segment" data-relation="AP" x1="310" y1="185" x2="430" y2="185" stroke="#2563eb" stroke-width="4"/>
  <line data-geometry="segment" data-relation="PB" x1="430" y1="185" x2="790" y2="185" stroke="#16a34a" stroke-width="4"/>
  <text x="178" y="96" class="note" fill="#b91c1c">AQ=6</text><text x="355" y="207" class="note" fill="#1d4ed8">AP=3</text><text x="590" y="207" class="note" fill="#15803d">PB=9</text>
  <circle data-point-label="Q(-6)" data-point-x="-6" data-point-y="0" cx="70" cy="145" r="6" fill="#dc2626"/>
  <circle data-point-label="A(0)" data-point-x="0" data-point-y="0" cx="310" cy="145" r="6" fill="#111827"/>
  <circle data-point-label="P(3)" data-point-x="3" data-point-y="0" cx="430" cy="145" r="6" fill="#2563eb"/>
  <circle data-point-label="B(12)" data-point-x="12" data-point-y="0" cx="790" cy="145" r="6" fill="#16a34a"/>
  <text x="52" y="182" class="label" fill="#b91c1c">Q(−6)</text><text x="293" y="182" class="label">A(0)</text><text x="414" y="182" class="label" fill="#1d4ed8">P(3)</text><text x="760" y="182" class="label" fill="#15803d">B(12)</text>
  <rect x="30" y="238" width="840" height="55" rx="8" fill="#f8fafc" stroke="#dbe3ef"/>
  <text x="48" y="263" class="note">AP:PB=1:3 · AQ:QB=6:18=1:3 · PQ=PA+AQ=3+6=9</text>
  <text x="48" y="284" class="note">내분점 P는 선분 안에, Q는 점의 순서 Q-A-P-B에 따라 선분 밖에 놓인다.</text>
</svg>
