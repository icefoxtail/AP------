  <text x="754" y="306" class="note">x: (−8+10+4)/3=2</text>
  <text x="754" y="334" class="note">y: (15/2+9/2+6)/3=6</text>
  <text x="754" y="385" class="note">각 점은 선분 밖</text>
  <text x="754" y="408" class="note">거리·좌표 변화로 확인</text>
