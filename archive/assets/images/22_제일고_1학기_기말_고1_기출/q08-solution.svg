  <title id="title">선분 밖의 점 D, E, F와 무게중심</title>
  <desc id="desc">A(10,3), B(-2,6), C(6,5)와 선분 밖의 점 D(-8,15/2), E(10,9/2), F(4,6)의 실제 순서 A-B-D, B-C-E, A-C-F 및 무게중심 G(2,6)를 표시한 해설 도형</desc>
  <style>
