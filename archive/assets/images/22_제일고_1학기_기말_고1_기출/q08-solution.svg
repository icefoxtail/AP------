  <rect x="738" y="70" width="178" height="395" rx="12" fill="#f8fafc" stroke="#dbe3ef"/>
  <text x="754" y="98" class="panel">핵심 관계</text>
  <text x="754" y="125" class="note">D: A-B-D, 3:1</text>
