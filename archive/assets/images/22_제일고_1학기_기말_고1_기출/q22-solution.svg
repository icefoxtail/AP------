<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320" role="img" aria-labelledby="title desc">
  <title id="title">직각삼각형의 내접원</title>
  <desc id="desc">세 직선이 만드는 직각삼각형의 꼭짓점 (−4,4),(4,4),(−4,−2), 내접원 중심 (−2,2), 반지름 2</desc>
  <rect width="640" height="320" fill="#fff"/>
  <text x="320" y="28" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="21" font-weight="700" fill="#1e3a5f">직각삼각형의 내접원은 세 변에 접한다</text>
  <rect x="18" y="45" width="330" height="258" rx="8" fill="#f8fafc" stroke="#dbe3ef"/>
  <g stroke="#e2e8f0" stroke-width="1">
    <line x1="35" y1="78" x2="35" y2="290"/><line x1="55" y1="78" x2="55" y2="290"/><line x1="75" y1="78" x2="75" y2="290"/><line x1="95" y1="78" x2="95" y2="290"/><line x1="115" y1="78" x2="115" y2="290"/><line x1="135" y1="78" x2="135" y2="290"/><line x1="155" y1="78" x2="155" y2="290"/><line x1="175" y1="78" x2="175" y2="290"/><line x1="195" y1="78" x2="195" y2="290"/><line x1="215" y1="78" x2="215" y2="290"/><line x1="235" y1="78" x2="235" y2="290"/><line x1="255" y1="78" x2="255" y2="290"/><line x1="275" y1="78" x2="275" y2="290"/><line x1="295" y1="78" x2="295" y2="290"/><line x1="315" y1="78" x2="315" y2="290"/><line x1="335" y1="78" x2="335" y2="290"/>
    <line x1="30" y1="80" x2="340" y2="80"/><line x1="30" y1="100" x2="340" y2="100"/><line x1="30" y1="120" x2="340" y2="120"/><line x1="30" y1="140" x2="340" y2="140"/><line x1="30" y1="160" x2="340" y2="160"/><line x1="30" y1="180" x2="340" y2="180"/><line x1="30" y1="200" x2="340" y2="200"/><line x1="30" y1="220" x2="340" y2="220"/><line x1="30" y1="240" x2="340" y2="240"/><line x1="30" y1="260" x2="340" y2="260"/><line x1="30" y1="280" x2="340" y2="280"/>
  </g>
  <line x1="30" y1="190" x2="340" y2="190" stroke="#0f172a" stroke-width="1.5"/><line x1="175" y1="298" x2="175" y2="58" stroke="#0f172a" stroke-width="1.5"/>
  <text x="330" y="184" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14">x</text><text x="182" y="68" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14">y</text>
  <polygon points="95,110 255,110 95,230" fill="#fef3c7" fill-opacity=".55" stroke="#475569" stroke-width="2.4"/>
  <circle cx="135" cy="150" r="40" fill="#dbeafe" fill-opacity=".85" stroke="#2563eb" stroke-width="2.6"/>
  <circle cx="135" cy="150" r="4.5" fill="#1d4ed8"/><line x1="135" y1="150" x2="95" y2="150" stroke="#dc2626" stroke-width="2.1" stroke-dasharray="6 4"/><line x1="135" y1="150" x2="135" y2="110" stroke="#dc2626" stroke-width="2.1" stroke-dasharray="6 4"/>
  <text x="99" y="104" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="13" font-weight="700">A(−4,4)</text>
  <text x="258" y="105" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="13" font-weight="700">B(4,4)</text>
  <text x="44" y="246" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="13" font-weight="700">C(−4,−2)</text>
  <text x="141" y="145" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="13" font-weight="700" fill="#1d4ed8">I(−2,2)</text>
  <text x="102" y="168" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="12" fill="#b91c1c">r=2</text>
  <rect x="370" y="45" width="252" height="258" rx="8" fill="#f8fafc" stroke="#dbe3ef"/>
  <text x="388" y="75" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="17" font-weight="700" fill="#334155">내접원 계산</text>
  <text x="388" y="108" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14">직각변: 8, 6</text>
  <text x="388" y="136" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14">빗변: √(8²+6²)=10</text>
  <text x="388" y="166" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14">r=(8+6−10)/2=2</text>
  <text x="388" y="196" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14">중심 I=(−2,2)</text>
  <line x1="388" y1="211" x2="602" y2="211" stroke="#cbd5e1"/>
  <text x="388" y="242" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="15">(x+2)²+(y−2)²=4</text>
  <text x="388" y="274" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="18" font-weight="700" fill="#1d4ed8">A+B+C = 4</text>
</svg>
