<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" role="img" aria-labelledby="title desc" data-scale-policy="SCHEMATIC_ALLOWED">
  <title id="title">서로 수직인 접선의 x절편</title>
  <desc id="desc">원 x²+y²=10에 접하고 주어진 직선에 수직인 두 접선 y=2x±5√2와 x절편 차 5√2</desc>
  <rect width="640" height="300" fill="#fff"/>
  <text x="320" y="28" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="21" font-weight="700" fill="#1e3a5f">수직 조건으로 두 접선의 기울기를 정한다</text>
  <rect x="18" y="45" width="330" height="238" rx="8" fill="#f8fafc" stroke="#dbe3ef"/>
  <g stroke="#e2e8f0" stroke-width="1">
    <line x1="25" y1="75" x2="25" y2="275"/><line x1="50" y1="75" x2="50" y2="275"/><line x1="75" y1="75" x2="75" y2="275"/><line x1="100" y1="75" x2="100" y2="275"/><line x1="125" y1="75" x2="125" y2="275"/><line x1="150" y1="75" x2="150" y2="275"/><line x1="175" y1="75" x2="175" y2="275"/><line x1="200" y1="75" x2="200" y2="275"/><line x1="225" y1="75" x2="225" y2="275"/><line x1="250" y1="75" x2="250" y2="275"/><line x1="275" y1="75" x2="275" y2="275"/><line x1="300" y1="75" x2="300" y2="275"/><line x1="325" y1="75" x2="325" y2="275"/>
    <line x1="23" y1="80" x2="338" y2="80"/><line x1="23" y1="105" x2="338" y2="105"/><line x1="23" y1="130" x2="338" y2="130"/><line x1="23" y1="155" x2="338" y2="155"/><line x1="23" y1="180" x2="338" y2="180"/><line x1="23" y1="205" x2="338" y2="205"/><line x1="23" y1="230" x2="338" y2="230"/><line x1="23" y1="255" x2="338" y2="255"/>
  </g>
  <line x1="23" y1="180" x2="338" y2="180" stroke="#0f172a" stroke-width="1.5"/><line x1="130" y1="278" x2="130" y2="58" stroke="#0f172a" stroke-width="1.5"/>
  <text x="329" y="174" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14">x</text><text x="137" y="68" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14">y</text>
  <circle cx="130" cy="180" r="79.1" fill="#dbeafe" fill-opacity=".7" stroke="#2563eb" stroke-width="2.6"/>
  <line x1="35" y1="193" x2="95" y2="73" stroke="#0f766e" stroke-width="2.5"/>
  <line x1="168" y1="282" x2="243" y2="132" stroke="#f97316" stroke-width="2.5"/>
  <line x1="130" y1="180" x2="59" y2="145" stroke="#dc2626" stroke-width="2.1" stroke-dasharray="6 4"/>
  <line x1="130" y1="180" x2="201" y2="215" stroke="#dc2626" stroke-width="2.1" stroke-dasharray="6 4"/>
  <circle cx="130" cy="180" r="4.5" fill="#1d4ed8"/><circle cx="59" cy="145" r="4.2" fill="#0f766e"/><circle cx="201" cy="215" r="4.2" fill="#f97316"/>
  <text x="138" y="174" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14" font-weight="700">O(0,0)</text>
  <text x="28" y="140" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="13" fill="#047857">y=2x+5√2</text>
  <text x="214" y="128" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="13" fill="#c2410c">y=2x−5√2</text>
  <text x="66" y="138" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="12" fill="#b91c1c">T₁</text><text x="207" y="224" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="12" fill="#b91c1c">T₂</text>
  <rect x="370" y="45" width="252" height="238" rx="8" fill="#f8fafc" stroke="#dbe3ef"/>
  <text x="388" y="75" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="17" font-weight="700" fill="#334155">접선의 절편 차</text>
  <text x="388" y="108" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14">주어진 기울기 −1/2에 수직</text>
  <text x="388" y="136" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="15">구하는 직선: y=2x+b</text>
  <text x="388" y="166" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14">|b|/√5 = √10  →  |b|=5√2</text>
  <line x1="388" y1="182" x2="602" y2="182" stroke="#cbd5e1"/>
  <text x="388" y="214" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14">x절편: −5√2/2, 5√2/2</text>
  <text x="388" y="248" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="18" font-weight="700" fill="#1d4ed8">차 = 5√2</text>
  <text x="388" y="272" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="13" fill="#475569">두 접선은 서로 평행하며 기울기는 2</text>
</svg>

