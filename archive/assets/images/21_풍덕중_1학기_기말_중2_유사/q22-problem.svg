<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 420" width="420" height="420" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">사다리꼴 ABCD에서 두 대각선 AC, BD가 만나는 점 O를 표시하였다. 삼각형 DBC의 넓이는 36제곱센티미터이고, 선분 OD와 OB의 길이 비는 1 대 2로 표시되어 있다.</title><desc id="visual-desc">위쪽 변 AD와 아래쪽 변 BC가 평행한 사다리꼴 ABCD가 있고, 두 대각선 AC와 BD가 내부의 점 O에서 만난다. 선분 OD 옆에는 1, 선분 OB 옆에는 2가 적혀 있고, 삼각형 DBC 안에는 36이 적혀 있다.</desc><rect width="420" height="420" fill="#fff"/><g data-layer="30"><line id="sAB" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="139.365079365" y1="51.071428571" x2="68.73015873" y2="368.928571429"/></g><g data-layer="30"><line id="sBC" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="68.73015873" y1="368.928571429" x2="351.26984127" y2="368.928571429"/></g><g data-layer="30"><line id="sCD" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="351.26984127" y1="368.928571429" x2="280.634920635" y2="51.071428571"/></g><g data-layer="30"><line id="sDA" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="280.634920635" y1="51.071428571" x2="139.365079365" y2="51.071428571"/></g><g data-layer="30"><line id="sAC" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="139.365079365" y1="51.071428571" x2="351.26984127" y2="368.928571429"/></g><g data-layer="30"><line id="sBO" data-role="lin