<svg xmlns="http://www.w3.org/2000/svg" width="560" height="260" viewBox="0 0 560 260" role="img" aria-label="q6 해설 교차하는 두 현과 두 호"><rect width="560" height="260" fill="white"/><g stroke="#222" stroke-width="2" fill="none"><circle cx="145" cy="130" r="92"/><line x1="65" y1="84" x2="236" y2="114"/><line x1="114" y1="216" x2="204" y2="60"/><text x="48" y="78" fill="#111" stroke="none" font-size="15">A</text><text x="104" y="238" fill="#111" stroke="none" font-size="15">B</text><text x="244" y="118" fill="#111" stroke="none" font-size="15">C</text><text x="208" y="50" fill="#111" stroke="none" font-size="15">D</text><text x="145" y="126" fill="#111" stroke="none" font-size="15">P</text><text x="300" y="65" fill="#111" stroke="none" font-size="15">∠BAC = 60° → 호 BC = 120°</text><text x="300" y="105" fill="#111" stroke="none" font-size="15">∠ACD = 50° → 호 AD = 100°</text><text x="300" y="155" fill="#111" stroke="none" font-size="16">∠APD = (120°+100°)/2</text><text x="390" y="195" fill="#111" stroke="none" font-size="18">= 110°</text></g></svg>