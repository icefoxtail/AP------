<svg xmlns="http://www.w3.org/2000/svg" width="560" height="270" viewBox="0 0 560 270" role="img" aria-label="q21 해설 두 현의 교점과 호 비"><rect width="560" height="270" fill="white"/><g stroke="#222" stroke-width="2" fill="none"><circle cx="145" cy="130" r="95"/><line x1="84" y1="57" x2="195" y2="211"/><line x1="84" y1="203" x2="233" y2="94"/><text x="72" y="51" fill="#111" stroke="none" font-size="15">A</text><text x="67" y="222" fill="#111" stroke="none" font-size="15">B</text><text x="197" y="229" fill="#111" stroke="none" font-size="15">C</text><text x="240" y="94" fill="#111" stroke="none" font-size="15">D</text><text x="145" y="137" fill="#111" stroke="none" font-size="15">E</text><text x="300" y="52" fill="#111" stroke="none" font-size="15">호 BC = 360°/5 = 72°</text><text x="300" y="91" fill="#111" stroke="none" font-size="15">호 AD = d°</text><text x="300" y="130" fill="#111" stroke="none" font-size="15">∠ABE=d/2</text><text x="300" y="166" fill="#111" stroke="none" font-size="15">∠AED=(d+72°)/2</text><text x="300" y="203" fill="#111" stroke="none" font-size="15">5d=3(d+72) → d=108</text><text x="365" y="239" fill="#111" stroke="none" font-size="18">∠ACD=54°</text></g></svg>