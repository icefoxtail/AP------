<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 702 497" width="702" height="497" role="img" aria-labelledby="title desc"><title id="title">같은 타일 여섯 개를 두 방향으로 놓은 직사각형</title><desc id="desc">윗줄에는 세로 방향 타일 네 개가 이어 붙어 있다. 아랫줄에는 같은 타일 두 개를 가로로 돌려 왼쪽부터 붙였다. 아랫줄 오른쪽에 폭 2 cm의 빈 직사각형이 남았다.</desc><rect width="702" height="497" fill="white" /><rect x="91" y="66" width="126" height="210" fill="#e5f0fc" stroke="#205d9c" stroke-width="4" /><rect x="217" y="66" width="126" height="210" fill="#e5f0fc" stroke="#205d9c" stroke-width="4" /><rect x="343" y="66" width="126" height="210" fill="#e5f0fc" stroke="#205d9c" stroke-width="4" /><rect x="469" y="66" width="126" height="210" fill="#e5f0fc" stroke="#205d9c" stroke-width="4" /><rect x="91" y="276" width="210" height="126" fill="#e7f2e8" stroke="#25736e" stroke-width="4" /><rect x="301" y="276" width="210" height="126" fill="#e7f2e8" stroke="#25736e" stroke-width="4" /><rect x="511" y="276" width="84" height="126" fill="white" stroke="#4d5d72" stroke-width="4" /><line x1="511.0000" y1="433.0000" x2="595.0000" y2="433.0000" stroke="#4d5d72" stroke-width="1.8" stroke-linecap="round" /><line x1="511.0000" y1="427.0000" x2="511.0000" y2="439.0000" stroke="#4d5d72" stroke-width="1.8" stroke-linecap="round" /><line x1="595.0000" y1="427.0000" x2="595.0000" y2="439.0000" stroke="#4d5d72" stroke-width="1.8" stroke-linecap="round" /><text x="553.0000" y="466.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#4d5d72" text-anchor="middle">2 cm</text></svg>
