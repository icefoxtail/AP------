<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 705 544" width="705" height="544" role="img" aria-labelledby="title desc"><title id="title">원점을 지나 오른쪽에서 다시 가로축과 만나는 포물선</title><desc id="desc">파란 곡선은 위로 열린다. 원점을 지나고 오른쪽 아래에 꼭짓점이 있다. 오른쪽 가지가 양의 부분에서 x축을 지난다.</desc><rect width="705" height="544" fill="white" /><line x1="53.0000" y1="341.5149" x2="649.0000" y2="341.5149" stroke="#4d5d72" stroke-width="1.65" stroke-linecap="round" /><polygon points="649.0000,341.5149 636.0000,336.5149 636.0000,346.5149" fill="#4d5d72" /><text x="666.0000" y="333.5149" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#4d5d72" text-anchor="middle">x</text><line x1="249.5828" y1="473.0000" x2="249.5828" y2="58.0000" stroke="#4d5d72" stroke-width="1.65" stroke-linecap="round" /><polygon points="249.5828,58.0000 244.5828,71.0000 254.5828,71.0000" fill="#4d5d72" /><text x="265.5828" y="64.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#4d5d72" text-anchor="middle">y</text><text x="228.5828" y="369.5149" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#4d5d72" text-anchor="middle">O</text><path d="M 148.1655 76.3586 Q 352.3893 786.6743 556.6131 76.3586" stroke="#205d9c" stroke-width="6.0" stroke-linecap="round" fill="none" /></svg>
