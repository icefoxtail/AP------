<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 705 544" width="705" height="544" role="img" aria-labelledby="title desc"><title id="title">한 포물선의 오른쪽 가지에 놓이는 정사각형</title><desc id="desc">위로 열린 파란 포물선의 오른쪽 가지에 점 B와 D가 있다. 녹색 정사각형 ABCD의 네 변은 두 좌표축과 평행하고 B는 왼쪽 아래, D는 오른쪽 위이다.</desc><rect width="705" height="544" fill="white" /><polygon points="340.1636,234.8724 340.1636,397.4168 502.7091,397.4168 502.7091,234.8724" fill="none" /><line x1="340.1636" y1="234.8724" x2="340.1636" y2="397.4168" stroke="#25736e" stroke-width="3.6" stroke-linecap="round" /><line x1="340.1636" y1="397.4168" x2="502.7091" y2="397.4168" stroke="#25736e" stroke-width="3.6" stroke-linecap="round" /><line x1="502.7091" y1="397.4168" x2="502.7091" y2="234.8724" stroke="#25736e" stroke-width="3.6" stroke-linecap="round" /><line x1="502.7091" y1="234.8724" x2="340.1636" y2="234.8724" stroke="#25736e" stroke-width="3.6" stroke-linecap="round" /><line x1="53.0000" y1="417.7349" x2="649.0000" y2="417.7349" stroke="#4d5d72" stroke-width="1.65" stroke-linecap="round" /><polygon points="649.0000,417.7349 636.0000,412.7349 636.0000,422.7349" fill="#4d5d72" /><text x="666.0000" y="409.7349" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#4d5d72" text-anchor="middle">x</text><line x1="258.8909" y1="473.0000" x2="258.8909" y2="80.0000" stroke="#4d5d72" stroke-width="1.65" stroke-linecap="round" /><polygon points="258.8909,80.0000 253.8909,93.0000 263.8909,93.0000" fill="#4d5d72" /><text x="274.8909" y="86.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#4d5d72" text-anchor="middle">y</text><text x="237.8909" y="445.7349" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#4d5d72" text-anchor="middle">O</text><path d="M 72.5055 310.8745 Q 327.1600 602.8766 581.8145 96.9660" stroke="#205d9c" stroke-width="6.0" stroke-linecap="round" fill="none" /><circle cx="340.16363636363633" cy="234.8723633054843" r="6.0" fill="white" stroke="#25736e" stroke-width="3.1" /><text x="323.1636" y="222.8724" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#25736e" text-anchor="middle">A</text><circle cx="340.16363636363633" cy="397.41682521300356" r="6.0" fill="white" stroke="#25736e" stroke-width="3.1" /><text x="320.1636" y="420.4168" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#25736e" text-anchor="middle">B</text><circle cx="502.70909090909095" cy="397.41682521300356" r="6.0" fill="white" stroke="#25736e" stroke-width="3.1" /><text x="520.7091" y="420.4168" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#25736e" text-anchor="middle">C</text><circle cx="502.70909090909095" cy="234.8723633054843" r="6.0" fill="white" stroke="#25736e" stroke-width="3.1" /><text x="538.7091" y="228.8724" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#25736e" text-anchor="middle">D</text><line x1="64.0000" y1="39.0000" x2="114.0000" y2="39.0000" stroke="#205d9c" stroke-width="5.4" stroke-linecap="round" /><text x="126.0000" y="47.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#205d9c" text-anchor="start">y = x²/3</text></svg>
