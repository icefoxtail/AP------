<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 560" width="720" height="560" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">학생 수를 n이라 하면 한 사람이 받는 사탕 수는 n+4이므로 n(n+4)=77이다. 이를 정리하면 n²+4n−77=0이고 (n+11)(n−7)=0이다. 학생 수는 자연수이므로 n=7이다. 따라서 답은 ④이다.</title><desc id="visual-desc">가로변이 7명, 세로변이 11개인 직사각형이 있고, 그 넓이 자리에 77개가 적혀 있다.</desc><rect width="720" height="560" fill="#fff"/><g data-layer="10"><path id="rArea" data-role="region" stroke="none" stroke-width="1.6" fill="#e4e7ec" data-owner-points="A B C D" data-mark="region" data-mark-id="rArea" fill-rule="evenodd" d="M65.002773088 456.014789803 L615.048991221 456.014789803 L615.048991221 103.985210197 L65.002773088 103.985210197 L65.002773088 456.014789803 Z"/></g><g data-layer="30"><line id="sAB" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="65.002773088" y1="456.014789803" x2="615.048991221" y2="456.014789803"/></g><g data-layer="30"><line id="sBC" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="615.048991221" y1="456.014789803" x2="615.048991221" y2="103.985210197"/></g><g data-layer="30"><line id="sCD" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="615.048991221" y1="103.985210197" x2="65.002773088" y2="103.985210197"/></g><g data-layer="30"><line id="sDA" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="65.