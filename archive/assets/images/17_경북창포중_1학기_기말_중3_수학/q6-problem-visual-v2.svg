<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 705 544" width="705" height="544" role="img" aria-labelledby="title desc"><title id="title">높이 9인 직선에서 구간을 나누기</title><desc id="desc">위로 열린 y=x²와 같은 높이의 직선 y=9이다. y축과 이 직선이 만나는 점은 A이며 오른쪽 곡선과 만나는 점은 B이다. 그 사이에 D, C가 이 순서로 놓인다.</desc><rect width="705" height="544" fill="white" /><line x1="74.9340" y1="181.7302" x2="618.7462" y2="181.7302" stroke="#aa5411" stroke-width="4.1" stroke-linecap="round" stroke-dasharray="12 7" /><line x1="53.0000" y1="422.6703" x2="649.0000" y2="422.6703" stroke="#4d5d72" stroke-width="1.65" stroke-linecap="round" /><polygon points="649.0000,422.6703 636.0000,417.6703 636.0000,427.6703" fill="#4d5d72" /><text x="666.0000" y="414.6703" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#4d5d72" text-anchor="middle">x</text><line x1="336.6294" y1="473.0000" x2="336.6294" y2="80.0000" stroke="#4d5d72" stroke-width="1.65" stroke-linecap="round" /><polygon points="336.6294,80.0000 331.6294,93.0000 341.6294,93.0000" fill="#4d5d72" /><text x="352.6294" y="86.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#4d5d72" text-anchor="middle">y</text><text x="315.6294" y="450.6703" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#4d5d72" text-anchor="middle">O</text><path d="M 79.4721 113.1962 Q 336.6294 732.1444 593.7868 113.1962" stroke="#205d9c" stroke-width="6.0" stroke-linecap="round" fill="none" /><circle cx="336.6294416243655" cy="181.73024523160768" r="6.0" fill="white" stroke="#25736e" stroke-width="3.1" /><text x="319.6294" y="209.7302" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#25736e" text-anchor="middle">A</text><circle cx="412.26395939086296" cy="181.73024523160768" r="6.0" fill="white" stroke="#25736e" stroke-width="3.1" /><text x="403.2640" y="215.7302" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#25736e" text-anchor="middle">D</text><circle cx="450.0812182741117" cy="181.73024523160768" r="6.0" fill="white" stroke="#25736e" stroke-width="3.1" /><text x="460.0812" y="214.7302" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#25736e" text-anchor="middle">C</text><circle cx="563.5329949238578" cy="181.73024523160768" r="6.0" fill="white" stroke="#25736e" stroke-width="3.1" /><text x="575.5330" y="212.7302" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#25736e" text-anchor="middle">B</text><line x1="64.0000" y1="39.0000" x2="114.0000" y2="39.0000" stroke="#205d9c" stroke-width="5.4" stroke-linecap="round" /><text x="126.0000" y="47.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#205d9c" text-anchor="start">y = x²</text><line x1="379.0000" y1="39.0000" x2="429.0000" y2="39.0000" stroke="#aa5411" stroke-width="5.4" stroke-linecap="round" stroke-dasharray="12 7" /><text x="441.0000" y="47.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#aa5411" text-anchor="start">y = 9</text></svg>
