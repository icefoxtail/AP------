<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 705 544" width="705" height="544" role="img" aria-labelledby="title desc"><title id="title">같은 높이에서 두 포물선으로 나뉜 가로선</title><desc id="desc">파랑과 주황 두 포물선이 원점을 공통 꼭짓점으로 한다. y=9인 가로선이 두 곡선을 A, B, C, D의 순서로 만난다. 바깥쪽 두 점은 y=x² 위에 놓인다.</desc><rect width="705" height="544" fill="white" /><line x1="83.0798" y1="222.9091" x2="618.9202" y2="222.9091" stroke="#4d5d72" stroke-width="2.25" stroke-linecap="round" stroke-dasharray="7 6" /><line x1="53.0000" y1="437.2727" x2="649.0000" y2="437.2727" stroke="#4d5d72" stroke-width="1.65" stroke-linecap="round" /><polygon points="649.0000,437.2727 636.0000,432.2727 636.0000,442.2727" fill="#4d5d72" /><text x="666.0000" y="429.2727" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#4d5d72" text-anchor="middle">x</text><line x1="348.9014" y1="473.0000" x2="348.9014" y2="80.0000" stroke="#4d5d72" stroke-width="1.65" stroke-linecap="round" /><polygon points="348.9014,80.0000 343.9014,93.0000 353.9014,93.0000" fill="#4d5d72" /><text x="364.9014" y="86.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#4d5d72" text-anchor="middle">y</text><text x="327.9014" y="465.2727" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#4d5d72" text-anchor="middle">O</text><path d="M 86.5775 102.3295 Q 348.9014 772.2159 611.2254 102.3295" stroke="#205d9c" stroke-width="6.0" stroke-linecap="round" fill="none" /><path d="M 261.4601 102.3295 Q 348.9014 772.2159 436.3427 102.3295" stroke="#aa5411" stroke-width="6.0" stroke-linecap="round" fill="none" stroke-dasharray="14 7" /><circle cx="139.04225352112678" cy="222.9090909090909" r="6.0" fill="white" stroke="#25736e" stroke-width="3.1" /><text x="119.0423" y="209.9091" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#25736e" text-anchor="middle">A</text><circle cx="278.9483568075118"