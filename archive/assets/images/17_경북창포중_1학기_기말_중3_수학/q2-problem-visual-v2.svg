<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 694 499" width="694" height="499" role="img" aria-labelledby="title desc"><title id="title">가로는 늘고 세로는 줄어드는 직사각형</title><desc id="desc">원래 직사각형 ABCD의 윗변 AD는 6 cm이고 왼쪽 AB는 10 cm이다. 가로로 더 넓고 아래쪽 높이는 낮아진 직사각형의 오른쪽과 밑변이 점선이다.</desc><rect width="694" height="499" fill="white" /><rect x="155" y="63" width="216" height="360" stroke="#205d9c" stroke-width="4.3" fill="#e7f0fa" /><path d="M 371 63 H 508 V 345 H 155" fill="none" stroke="#aa5411" stroke-width="4.0" stroke-dasharray="13 7" /><circle cx="155" cy="63" r="4.3" fill="#28364b" /><text x="137.0000" y="53.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">A</text><circle cx="155" cy="423" r="4.3" fill="#28364b" /><text x="136.0000" y="447.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">B</text><circle cx="371" cy="423" r="4.3" fill="#28364b" /><text x="385.0000" y="447.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">C</text><circle cx="371" cy="63" r="4.3" fill="#28364b" /><text x="378.0000" y="46.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">D</text><line x1="155.0000" y1="34.0000" x2="371.0000" y2="34.0000" stroke="#205d9c" stroke-width="1.65" stroke-linecap="round" /><line x1="155.0000" y1="28.0000" x2="155.0000" y2="40.0000" stroke="#205d9c" stroke-width="1.65" stroke-linecap="round" /><line x1="371.0000" y1="28.0000" x2="371.0000" y2="40.0000" stroke="#205d9c" stroke-width="1.65" stroke-linecap="round" /><text x="263.0000" y="23.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#205d9c" text-anchor="middle">6 cm</text><line x1="118.0000" y1="63.0000" x2="118.0000" y2="423.0000" stroke="#4d5d72" stroke-width="1.65" stroke-linecap="round" /><line x1="112.0000" y1="63.0000" x2="124.0000" y2="63.0000" stroke="#4d5d72" stroke-width="1.7" stroke-linecap="round" /><line x1="112.0000" y1="423.0000" x2="124.0000" y2="423.0000" stroke="#4d5d72" stroke-width="1.7" stroke-linecap="round" /><text x="71.0000" y="252.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#4d5d72" text-anchor="middle">10 cm</text></svg>
