<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 518" width="730" height="518" role="img" aria-labelledby="title desc"><title id="title">오른쪽 위로 향하는 일차함수의 그래프</title><desc id="desc">파란 직선은 왼쪽 아래에서 오른쪽 위로 향한다. 원점의 아래에서 세로축을, 원점의 오른쪽에서 가로축을 만난다.</desc><rect width="730" height="518" fill="white" /><line x1="91.0000" y1="243.7543" x2="640.0000" y2="243.7543" stroke="#586574" stroke-width="2.05" stroke-linecap="round" /><polygon points="653.0000,243.7543 640.0000,238.5543 640.0000,248.9543" fill="#586574" /><line x1="318.1915" y1="443.0000" x2="318.1915" y2="77.0000" stroke="#586574" stroke-width="2.05" stroke-linecap="round" /><polygon points="318.1915,64.0000 312.9915,77.0000 323.3915,77.0000" fill="#586574" /><line x1="145.5260" y1="435.6470" x2="642.6434" y2="82.7014" stroke="#21639a" stroke-width="7.65" stroke-linecap="round" /><text x="669.000" y="230.754" fill="#586574" font-size="32" font-weight="600" font-family="Malgun Gothic, Cambria Math, sans-serif" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="4.0" stroke-linejoin="round">x</text><text x="337.191" y="59.000" fill="#586574" font-size="32" font-weight="600" font-family="Malgun Gothic, Cambria Math, sans-serif" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="4.0" stroke-linejoin="round">y</text><text x="292.191" y="275.754" fill="#586574" font-size="32" font-weight="600" font-family="Malgun Gothic, Cambria Math, sans-serif" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="4.0" stroke-linejoin="round">O</text></svg>
