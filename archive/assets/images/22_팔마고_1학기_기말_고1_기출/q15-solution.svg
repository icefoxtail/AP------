<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" role="img" aria-labelledby="title desc">
  <title id="title">원과 직선의 교점 조건</title>
  <desc id="desc">원 x²+y²=5와 평행한 세 직선 y=2x−5, y=2x, y=2x+5를 통해 |k|≤5를 나타낸 그림</desc>
  <rect width="640" height="300" fill="#fff"/>
  <text x="320" y="28" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="21" font-weight="700" fill="#1e3a5f">중심에서 직선까지의 거리 ≤ 반지름</text>
  <rect x="18" y="45" width="315" height="235" rx="8" fill="#f8fafc" stroke="#dbe3ef"/>
  <g stroke="#e2e8f0" stroke-width="1">
    <line x1="40" y1="75" x2="315" y2="75"/><line x1="40" y1="105" x2="315" y2="105"/><line x1="40" y1="135" x2="315" y2="135"/><line x1="40" y1="185" x2="315" y2="185"/><line x1="40" y1="215" x2="315" y2="215"/><line x1="40" y1="245" x2="315" y2="245"/><line x1="70" y1="50" x2="70" y2="275"/><line x1="100" y1="50" x2="100" y2="275"/><line x1="130" y1="50" x2="130" y2="275"/><line x1="160" y1="50" x2="160" y2="275"/><line x1="190" y1="50" x2="190" y2="275"/><line x1="220" y1="50" x2="220" y2="275"/><line x1="250" y1="50" x2="250" y2="275"/><line x1="280" y1="50" x2="280" y2="275"/>
  </g>
  <line x1="40" y1="160" x2="318" y2="160" stroke="#0f172a" stroke-width="1.5"/><line x1="175" y1="50" x2="175" y2="275" stroke="#0f172a" stroke-width="1.5"/>
  <text x="309" y="154" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14">x</text><text x="182" y="62" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14">y</text>
  <circle cx="175" cy="160" r="67.1" fill="#dbeafe" fill-opacity=".65" stroke="#2563eb" stroke-width="2.6"/>
  <line x1="40" y1="274" x2="154" y2="52" stroke="#f59e0b" stroke-width="2.2"/>
  <line x1="118" y1="274" x2="232" y2="46" stroke="#64748b" stroke-width="2.2" stroke-dasharray="7 5"/>
  <line x1="190" y1="274" x2="310" y2="46" stroke="#dc2626" stroke-width="2.2"/>
  <circle cx="175" cy="160" r="4.5" fill="#1d4ed8"/>
  <text x="182" y="154" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14" font-weight="700">O(0,0)</text>
  <text x="52" y="263" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="12" fill="#b45309">k=5</text>
  <text x="122" y="263" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="12" fill="#475569">k=0</text>
  <text x="268" y="263" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="12" fill="#b91c1c">k=−5</text>
  <rect x="355" y="45" width="267" height="235" rx="8" fill="#f8fafc" stroke="#dbe3ef"/>
  <text x="373" y="75" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="17" font-weight="700" fill="#334155">만나거나 접하는 조건</text>
  <text x="373" y="110" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="15">d(O,l)=|k|/√5 ≤ √5</text>
  <text x="373" y="143" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="16" font-weight="700" fill="#1d4ed8">|k|≤5</text>
  <line x1="373" y1="158" x2="604" y2="158" stroke="#cbd5e1"/>
  <text x="373" y="188" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="15">−5≤k≤5</text>
  <text x="373" y="218" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="13">정수: −5,−4,...,0,...,4,5</text>
  <text x="373" y="255" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="16" font-weight="700" fill="#1d4ed8">총 11개 → 정답 ④</text>
</svg>
