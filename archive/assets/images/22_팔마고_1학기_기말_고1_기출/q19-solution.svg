<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320" role="img" aria-labelledby="title desc">
  <title id="title">접선과 두 번째 원의 위치 관계</title>
  <desc id="desc">원점 중심 반지름 2√5인 원의 점 T(2,4)에서의 접선 x+2y−10=0과 중심 C(−1,3), 반지름 2인 대표 원을 비교한 그림</desc>
  <rect width="640" height="320" fill="#fff"/>
  <text x="320" y="28" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="21" font-weight="700" fill="#1e3a5f">접선과 다른 원이 만나지 않는 조건</text>
  <rect x="18" y="45" width="350" height="258" rx="8" fill="#f8fafc" stroke="#dbe3ef"/>
  <g stroke="#e2e8f0" stroke-width="1">
    <line x1="35" y1="75" x2="350" y2="75"/><line x1="35" y1="105" x2="350" y2="105"/><line x1="35" y1="135" x2="350" y2="135"/><line x1="35" y1="165" x2="350" y2="165"/><line x1="35" y1="205" x2="350" y2="205"/><line x1="35" y1="235" x2="350" y2="235"/><line x1="35" y1="265" x2="350" y2="265"/><line x1="35" y1="295" x2="350" y2="295"/>
    <line x1="55" y1="50" x2="55" y2="300"/><line x1="85" y1="50" x2="85" y2="300"/><line x1="115" y1="50" x2="115" y2="300"/><line x1="145" y1="50" x2="145" y2="300"/><line x1="175" y1="50" x2="175" y2="300"/><line x1="205" y1="50" x2="205" y2="300"/><line x1="235" y1="50" x2="235" y2="300"/><line x1="265" y1="50" x2="265" y2="300"/><line x1="295" y1="50" x2="295" y2="300"/><line x1="325" y1="50" x2="325" y2="300"/>
  </g>
  <line x1="35" y1="175" x2="353" y2="175" stroke="#0f172a" stroke-width="1.5"/><line x1="175" y1="50" x2="175" y2="300" stroke="#0f172a" stroke-width="1.5"/>
  <text x="345" y="169" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14">x</text><text x="182" y="62" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14">y</text>
  <circle cx="175" cy="175" r="89.4" fill="#dbeafe" fill-opacity=".42" stroke="#2563eb" stroke-width="2.5"/>
  <circle cx="155" cy="115" r="40" fill="#fef3c7" fill-opacity=".75" stroke="#d97706" stroke-width="2.4"/>
  <line x1="45" y1="10" x2="315" y2="145" stroke="#dc2626" stroke-width="2.6"/>
  <line x1="155" y1="115" x2="205" y2="140" stroke="#0f766e" stroke-width="2.1" stroke-dasharray="6 4"/>
  <circle cx="175" cy="175" r="4.5" fill="#1d4ed8"/><circle cx="215" cy="95" r="4.5" fill="#dc2626"/><circle cx="155" cy="115" r="4.5" fill="#b45309"/>
  <text x="182" y="190" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14" font-weight="700">O</text>
  <text x="220" y="91" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="13" font-weight="700" fill="#b91c1c">T(2,4)</text>
  <text x="160" y="111" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="13" font-weight="700" fill="#b45309">C(−1,3)</text>
  <text x="76" y="54" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="12" fill="#b91c1c">x+2y−10=0</text>
  <text x="189" y="134" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="12" fill="#047857">d=√5</text>
  <rect x="385" y="45" width="237" height="258" rx="8" fill="#f8fafc" stroke="#dbe3ef"/>
  <text x="403" y="75" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="17" font-weight="700" fill="#334155">두 번째 원</text>
  <text x="403" y="108" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14">중심 C=(−1,3)</text>
  <text x="403" y="136" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14">반지름²=10−k</text>
  <text x="403" y="168" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14">중심까지 거리 = √5</text>
  <text x="403" y="200" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14">√5 &gt; √(10−k)</text>
  <text x="403" y="229" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14">→ k&gt;5, 또 k&lt;10</text>
  <line x1="403" y1="242" x2="604" y2="242" stroke="#cbd5e1"/>
  <text x="403" y="270" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="15" font-weight="700" fill="#1d4ed8">k=6,7,8,9 → 4개</text>
</svg>
