<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" width="640" height="280" role="img" aria-labelledby="title desc">
  <title id="title">지름의 양 끝점과 원의 넓이</title>
  <desc id="desc">지름의 양 끝점 A(−5,−2), B(3,4), 중심 C(−1,1), 지름 10과 반지름 5를 표시한 원</desc>
  <rect width="640" height="280" fill="#fff"/>
  <text x="320" y="28" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="21" font-weight="700" fill="#1e3a5f">지름의 양 끝점에서 중심과 반지름 구하기</text>
  <rect x="18" y="45" width="360" height="215" rx="8" fill="#f8fafc" stroke="#dbe3ef"/>
  <g stroke="#e2e8f0" stroke-width="1">
    <line x1="45" y1="65" x2="370" y2="65"/><line x1="45" y1="95" x2="370" y2="95"/><line x1="45" y1="125" x2="370" y2="125"/><line x1="45" y1="155" x2="370" y2="155"/><line x1="45" y1="185" x2="370" y2="185"/><line x1="45" y1="215" x2="370" y2="215"/><line x1="45" y1="245" x2="370" y2="245"/>
    <line x1="60" y1="50" x2="60" y2="255"/><line x1="90" y1="50" x2="90" y2="255"/><line x1="120" y1="50" x2="120" y2="255"/><line x1="150" y1="50" x2="150" y2="255"/><line x1="210" y1="50" x2="210" y2="255"/><line x1="240" y1="50" x2="240" y2="255"/><line x1="270" y1="50" x2="270" y2="255"/><line x1="300" y1="50" x2="300" y2="255"/><line x1="330" y1="50" x2="330" y2="255"/><line x1="360" y1="50" x2="360" y2="255"/>
  </g>
  <line x1="45" y1="155" x2="373" y2="155" stroke="#0f172a" stroke-width="1.5"/><line x1="180" y1="50" x2="180" y2="258" stroke="#0f172a" stroke-width="1.5"/>
  <text x="365" y="149" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14">x</text><text x="187" y="62" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14">y</text>
  <circle cx="162" cy="137" r="90" fill="#dbeafe" fill-opacity=".62" stroke="#2563eb" stroke-width="2.6"/>
  <line x1="90" y1="191" x2="234" y2="83" stroke="#dc2626" stroke-width="2.7"/>
  <circle cx="90" cy="191" r="4.5" fill="#dc2626"/><circle cx="234" cy="83" r="4.5" fill="#dc2626"/><circle cx="162" cy="137" r="4.5" fill="#1d4ed8"/>
  <text x="70" y="210" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14" font-weight="700" fill="#b91c1c">A(−5,−2)</text>
  <text x="238" y="78" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14" font-weight="700" fill="#b91c1c">B(3,4)</text>
  <text x="168" y="132" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14" font-weight="700" fill="#1d4ed8">C(−1,1)</text>
  <text x="180" y="119" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="13" fill="#b91c1c">AB=10</text>
  <rect x="400" y="45" width="222" height="215" rx="8" fill="#f8fafc" stroke="#dbe3ef"/>
  <text x="418" y="75" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="17" font-weight="700" fill="#334155">계산</text>
  <text x="418" y="108" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14">AB=√(8²+6²)=10</text>
  <text x="418" y="140" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="15">r=AB/2=5</text>
  <text x="418" y="175" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="15">넓이=πr²=25π</text>
  <text x="418" y="215" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="16" font-weight="700" fill="#1d4ed8">정답: ③</text>
</svg>
