<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" width="640" height="280" role="img" aria-labelledby="title desc" data-scale-policy="SCHEMATIC_ALLOWED">
  <title id="title">원의 중심과 반지름</title>
  <desc id="desc">원 (x−1)²+(y+4)²=25의 중심 C(1,−4)와 반지름 5를 좌표평면과 함께 나타낸 그림</desc>
  <rect width="640" height="280" fill="#fff"/>
  <text x="320" y="28" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="21" font-weight="700" fill="#1e3a5f">완전제곱식으로 중심과 반지름 읽기</text>
  <rect x="18" y="45" width="330" height="215" rx="8" fill="#f8fafc" stroke="#dbe3ef"/>
  <g stroke="#e2e8f0" stroke-width="1">
    <line x1="43" y1="69" x2="330" y2="69"/><line x1="43" y1="94" x2="330" y2="94"/><line x1="43" y1="144" x2="330" y2="144"/><line x1="43" y1="169" x2="330" y2="169"/><line x1="43" y1="194" x2="330" y2="194"/><line x1="43" y1="219" x2="330" y2="219"/><line x1="43" y1="244" x2="330" y2="244"/>
    <line x1="68" y1="50" x2="68" y2="255"/><line x1="93" y1="50" x2="93" y2="255"/><line x1="118" y1="50" x2="118" y2="255"/><line x1="168" y1="50" x2="168" y2="255"/><line x1="193" y1="50" x2="193" y2="255"/><line x1="218" y1="50" x2="218" y2="255"/><line x1="243" y1="50" x2="243" y2="255"/><line x1="268" y1="50" x2="268" y2="255"/><line x1="293" y1="50" x2="293" y2="255"/><line x1="318" y1="50" x2="318" y2="255"/>
  </g>
  <line x1="43" y1="119" x2="334" y2="119" stroke="#0f172a" stroke-width="1.5"/>
  <line x1="143" y1="50" x2="143" y2="258" stroke="#0f172a" stroke-width="1.5"/>
  <text x="326" y="113" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14">x</text><text x="150" y="62" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14">y</text>
  <circle cx="168" cy="169" r="70" fill="#dbeafe" fill-opacity=".68" stroke="#2563eb" stroke-width="2.6"/>
  <line x1="168" y1="169" x2="238" y2="169" stroke="#dc2626" stroke-width="2.6"/>
  <circle cx="168" cy="169" r="4.5" fill="#1d4ed8"/><circle cx="238" cy="169" r="4.2" fill="#dc2626"/>
  <text x="176" y="164" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14" font-weight="700">C(1,−4)</text>
  <text x="241" y="164" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="13" fill="#b91c1c">P(6,−4)</text>
  <text x="194" y="160" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="13" fill="#b91c1c">r=5</text>
  <rect x="370" y="45" width="252" height="215" rx="8" fill="#f8fafc" stroke="#dbe3ef"/>
  <text x="388" y="75" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="17" font-weight="700" fill="#334155">표준형</text>
  <text x="388" y="108" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="15">x²−2x+y²+8y=8</text>
  <text x="388" y="138" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="15">(x−1)²+(y+4)²=25</text>
  <line x1="388" y1="151" x2="602" y2="151" stroke="#cbd5e1"/>
  <text x="388" y="180" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="15">중심 C=(1,−4), r=5</text>
  <text x="388" y="215" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="16" font-weight="700" fill="#1d4ed8">a+b+r=1−4+5=2</text>
  <text x="388" y="242" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="13" fill="#475569">좌표의 음수 부호까지 대입한다.</text>
</svg>
