<svg xmlns="http://www.w3.org/2000/svg" width="760" height="478" viewBox="0 0 760 478" role="img" aria-labelledby="title desc"><title id="title">꼭짓점 위치가 다른 포물선</title><desc id="desc">검은 점선은 y=x²이다. 원문의 다섯 포물선은 같은 폭이며 (1)부터 (5)까지 번호와 색으로 구분한다.</desc><rect x="0" y="0" width="760" height="478" fill="white"/><g font-family="STIX Two Text, Cambria Math, Times New Roman, serif" font-weight="600" stroke-linecap="round" stroke-linejoin="round"><path d="M 55.2,400 L 723,400" fill="none" stroke="#c1cbd6" stroke-width="1.15" stroke-dasharray="5 5"/><text x="137.1" y="408" text-anchor="end" fill="#263139" font-size="27">−5</text><path d="M 55.2,200 L 723,200" fill="none" stroke="#c1cbd6" stroke-width="1.15" stroke-dasharray="5 5"/><text x="189.6" y="208" text-anchor="end" fill="#263139" font-size="27">5</text><path d="M 55.2,100 L 723,100" fill="none" stroke="#c1cbd6" stroke-width="1.15" stroke-dasharray="5 5"/><text x="189.6" y="108" text-anchor="end" fill="#263139" font-size="27">10</text><path d="M 408,446 L 408,40" fill="none" stroke="#c1cbd6" stroke-width="1.15" stroke-dasharray="5 5"/><text x="408" y="324.8" text-anchor="middle" fill="#263139" font-size="27">5</text><path d="M 618,446 L 618,40" fill="none" stroke="#c1cbd6" stroke-width="1.15" stroke-dasharray="5 5"/><text x="618" y="324.8" text-anchor="middle" fill="#263139" font-size="27">10</text><path d="M 55.2,300 L 723,300" fill="none" stroke="#263139" stroke-width="2"/><path d="M 198,446 L 198,40" fill="none" stroke="#263139" stroke-width="2"/><path d="M 722 294 L 734 300 L 722 306 Z M 192 42 L 198 29 L 204 42 Z" fill="#263139"/><text x="732" y="287" text-anchor="start" fill="#263139" font-size="29">x</text><text x="208.5" y="23" text-anchor="start" fill="#263139" font-size="28">y</text><text x="175.32" y="322" text-anchor="start" fill="#263139" font-size="29">O</text><path id="curve-one" d="M 72,40 Q 198,400 324,40" fill="none" stroke="#205aa7" stroke-width="4"/><text x="219" y="195" text-anchor="middle" fill="#205