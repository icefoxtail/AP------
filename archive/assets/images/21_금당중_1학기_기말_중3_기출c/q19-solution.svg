<svg xmlns="http://www.w3.org/2000/svg" width="760" height="530" viewBox="0 0 760 530" role="img" aria-labelledby="title desc"><title id="title">위와 아래로 대칭인 두 포물선</title><desc id="desc">파란 포물선의 꼭짓점 V와 주황 포물선의 꼭짓점 W는 x좌표가 같으며 x축에서 위아래로 같은 거리에 있다. 두 포물선은 x축에 대하여 대칭이다.</desc><rect width="760" height="530" fill="white"/><g font-family="STIX Two Text, Cambria Math, Times New Roman, serif" font-weight="600" stroke-linecap="round" stroke-linejoin="round"><path d="M 32 265 H 721 M 55 512 V 21" fill="none" stroke="#344455" stroke-width="2"/><path d="M 721 259 L 734 265 L 721 271 Z M 49 26 L 55 13 L 61 26 Z" fill="#344455"/><text x="720.600" y="249.000" fill="#253240" font-size="31">x</text><text x="67.800" y="49.400" fill="#253240" font-size="31">y</text><path d="M 311.000,133.000 L 311.000,397.000" fill="none" stroke="#535e6c" stroke-width="2.2" stroke-dasharray="8 6"/><path id="given" d="M 202.200,26.410 Q 439.000,327.590 675.800,26.410" fill="none" stroke="#205aa7" stroke-width="5"/><path id="reflected" d="M 202.200,503.590 Q 439.000,202.410 675.800,503.590" fill="none" stroke="#a84f00" stroke-width="5"/><circle cx="439.000" cy="177.000" r="5.4" fill="#205aa7"/><circle cx="439.000" cy="353.000" r="5.4" fill="#a84f00"/><circle cx="311.000" cy="133.000" r="5.4" fill="#205aa7"/><circle cx="311.000" cy="397.000" r="5.4" fill="#a84f00"/><text x="451.800" y="144.000" fill="#205aa7" font-size="31">V</text><text x="451.800" y="388.200" fill="#a84f00" font-size="31">W</text></g></svg>
