<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 710 500" width="710" height="500" role="img" aria-labelledby="title desc"><title id="title">원 바깥 점에서 그은 두 할선의 구간</title><desc id="desc">원 바깥의 P에서 파란 할선이 먼저 A에 닿고 그다음 B에서 나온다. 주황 할선은 먼저 C에, 그다음 D에 닿는다. PA=3 cm, AB=6 cm, PC=4 cm이다.</desc><rect width="710" height="500" fill="white" /><circle cx="278.44793074231427" cy="250.0" r="172.5" fill="none" stroke="#205d9c" stroke-width="3.6" /><line x1="604.0521" y1="307.0240" x2="115.6459" y2="307.0240" stroke="#205d9c" stroke-width="4.5" stroke-linecap="round" /><line x1="604.0521" y1="307.0240" x2="315.4001" y2="81.5043" stroke="#aa5411" stroke-width="4.5" stroke-linecap="round" /><line x1="604.0521" y1="340.0240" x2="441.2500" y2="340.0240" stroke="#205d9c" stroke-width="1.7" stroke-linecap="round" /><line x1="604.0521" y1="345.5240" x2="604.0521" y2="334.5240" stroke="#205d9c" stroke-width="1.7" stroke-linecap="round" /><line x1="441.2500" y1="345.5240" x2="441.2500" y2="334.5240" stroke="#205d9c" stroke-width="1.7" stroke-linecap="round" /><text x="522.6510" y="381.0240" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#205d9c" text-anchor="middle">3 cm</text><line x1="441.2500" y1="340.0240" x2="115.6459" y2="340.0240" stroke="#205d9c" stroke-width="1.7" stroke-linecap="round" /><line x1="441.2500" y1="345.5240" x2="441.2500" y2="334.5240" stroke="#205d9c" stroke-width="1.7" stroke-linecap="round" /><line x1="115.6459" y1="345.5240" x2="115.6459" y2="334.5240" stroke="#205d9c" stroke-width="1.7" stroke-linecap="round" /><text x="278.4479" y="384.0240" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#205d9c" text-anchor="middle">6 cm</text><line x1="621.2906" y1="284.9597" x2="450.2375" y2="151.3184" stroke="#aa5411" stroke-width="1.7" stroke-linecap="round" /><line x1="617.9045" y1="289.2938" x2="624.6767" y2="280.6256" stroke="#aa5411" stroke-width="1.7" stroke-linecap="round" /><