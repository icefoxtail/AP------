<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 690 510" width="690" height="510" role="img" aria-labelledby="title desc"><title id="title">한 점에서 같은 원에 그은 두 접선</title><desc id="desc">원 밖의 P에서 원으로 올라가는 선은 A에서 닿고 내려가는 선은 B에서 닿는다. O는 원의 중심이다.</desc><rect width="690" height="510" fill="white" /><circle cx="445.0" cy="255.0" r="160.0" fill="none" stroke="#205d9c" stroke-width="3.6" /><line x1="85.0000" y1="255.0000" x2="373.8889" y2="111.6710" stroke="#aa5411" stroke-width="4.4" stroke-linecap="round" /><line x1="85.0000" y1="255.0000" x2="373.8889" y2="398.3290" stroke="#aa5411" stroke-width="4.4" stroke-linecap="round" /><line x1="373.8889" y1="111.6710" x2="445.0000" y2="255.0000" stroke="#205d9c" stroke-width="3.65" stroke-linecap="round" /><line x1="373.8889" y1="398.3290" x2="445.0000" y2="255.0000" stroke="#205d9c" stroke-width="3.65" stroke-linecap="round" /><circle cx="373.8888888888889" cy="111.67097336358134" r="4.9" fill="#28364b" /><text x="365.8889" y="94.6710" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">A</text><circle cx="373.8888888888889" cy="398.3290266364187" r="4.9" fill="#28364b" /><text x="367.8889" y="425.3290" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">B</text><circle cx="445.0" cy="255.0" r="4.9" fill="#28364b" /><text x="460.0000" y="264.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">O</text><circle cx="85.0" cy="255.0" r="4.9" fill="#28364b" /><text x="68.0000" y="263.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">P</text></svg>
