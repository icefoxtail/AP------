<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 615 527" width="615" height="527" role="img" aria-labelledby="title desc"><title id="title">원의 반지름과 중심에서 현까지의 거리</title><desc id="desc">원이 크게 보이고 아래 현의 양 끝이 연결된다. 중심에서 현까지는 8 cm이며 반지름 10 cm가 표시됐다.</desc><rect width="615" height="527" fill="white" /><circle cx="307.5" cy="257.5" r="186.0" fill="none" stroke="#205d9c" stroke-width="3.6" /><line x1="195.9000" y1="406.3000" x2="419.1000" y2="406.3000" stroke="#277339" stroke-width="4.1" stroke-linecap="round" /><line x1="195.9000" y1="406.3000" x2="307.5000" y2="257.5000" stroke="#205d9c" stroke-width="3.8" stroke-linecap="round" /><line x1="307.5000" y1="257.5000" x2="307.5000" y2="406.3000" stroke="#aa5411" stroke-width="3.85" stroke-linecap="round" /><line x1="307.5000" y1="390.3000" x2="291.5000" y2="390.3000" stroke="#586574" stroke-width="1.8" stroke-linecap="round" /><line x1="291.5000" y1="390.3000" x2="291.5000" y2="406.3000" stroke="#586574" stroke-width="1.8" stroke-linecap="round" /><line x1="195.9000" y1="460.3000" x2="419.1000" y2="460.3000" stroke="#277339" stroke-width="1.7" stroke-linecap="round" /><line x1="195.9000" y1="454.8000" x2="195.9000" y2="465.8000" stroke="#277339" stroke-width="1.7" stroke-linecap="round" /><line x1="419.1000" y1="454.8000" x2="419.1000" y2="465.8000" stroke="#277339" stroke-width="1.7" stroke-linecap="round" /><text x="307.5000" y="492.3000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#277339" text-anchor="middle">x cm</text><text x="211.7000" y="313.9000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#205d9c" text-anchor="middle">10 cm</text><text x="349.5000" y="340.9000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#aa5411" text-anchor="middle">8 cm</text><circle cx="307.5" cy="257.5" r="4.9" fill="#28364b" /><text x="319.5000" y="242.5000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">O</text></svg>
