<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 520" width="520" height="520" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">반지름이 7 cm인 원 O 위에 길이 10 cm인 현 AB가 있고, 원 위의 점 P를 잡아 삼각형 ABP를 그린 그림이다. 점 P는 원 위에서 움직일 수 있는 위치로 표시되어 있다.</title><desc id="visual-desc">원 O의 아래쪽에 현 AB가 10 cm로 표시되어 있고, 원 위의 점 P와 A, B를 이은 삼각형 ABP가 그려져 있다. 중심 O에서 P까지의 반지름은 7 cm이다.</desc><rect width="520" height="520" fill="#fff"/><g data-layer="30"><line id="sAB" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="119.60591133" y1="397.557552058" x2="400.39408867" y2="397.557552058"/></g><g data-layer="30"><line id="sPA" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="161.724137931" y1="89.781213739" x2="119.60591133" y2="397.557552058"/></g><g data-layer="30"><line id="sPB" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="161.724137931" y1="89.781213739" x2="400.39408867" y2="397.557552058"/></g><g data-layer="30"><line id="sOP" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="260" y1="260" x2="161.724137931" y2="89.781213739"/></g><g data-layer="40"><circle id="circ" data-role="circle" stroke="#111" stroke-width="2.05" fill="none" cx="260" cy="260" r="196.551724138"/></g><g data-layer="70"><circle id="O" data-role="point" stroke="#111" stroke-width="0.8" fill="#111" cx="260" cy="260" r="3.2"/><