<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 622 481" width="622" height="481" role="img" aria-labelledby="title desc"><title id="title">가로축의 1을 지나는 세로 직선</title><desc id="desc">가로축의 1을 지나고 세로축과 나란한 파란 직선을 나타냈다. 두 좌표축은 옅은 회색이다. 직선과 가로축이 만나는 곳에 직각 표시가 있다.</desc><rect width="622" height="481" fill="white" /><line x1="57.0000" y1="256.0417" x2="545.0000" y2="256.0417" stroke="#586574" stroke-width="2.05" stroke-linecap="round" /><polygon points="558.0000,256.0417 545.0000,250.8417 545.0000,261.2417" fill="#586574" /><line x1="216.1412" y1="427.0000" x2="216.1412" y2="67.0000" stroke="#586574" stroke-width="2.05" stroke-linecap="round" /><polygon points="216.1412,54.0000 210.9412,67.0000 221.3412,67.0000" fill="#586574" /><text x="574.000" y="243.042" fill="#586574" font-size="29" font-weight="600" font-family="Malgun Gothic, Cambria Math, sans-serif" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="4.0" stroke-linejoin="round">x</text><text x="235.141" y="49.000" fill="#586574" font-size="29" font-weight="600" font-family="Malgun Gothic, Cambria Math, sans-serif" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="4.0" stroke-linejoin="round">y</text><text x="193.141" y="283.042" fill="#586574" font-size="29" font-weight="600" font-family="Malgun Gothic, Cambria Math, sans-serif" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="4.0" stroke-linejoin="round">O</text><line x1="334.0235" y1="414.5667" x2="334.0235" y2="68.5056" stroke="#205d9c" stroke-width="7.2" stroke-linecap="round" /><line x1="334.0235" y1="251.0417" x2="334.0235" y2="261.0417" stroke="#586574" stroke-width="1.6" stroke-linecap="round" /><text x="353.024" y="286.042" fill="#586574" font-size="29" font-weight="600" font-family="Malgun Gothic, Cambria Math, sans-serif" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="4.0" stroke-linejoin="round">1</text><line x1="315.0235" y1="256.0417" x2="315.0235" y2="237.0417