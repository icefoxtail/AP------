<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 718 560" width="718" height="560" role="img" aria-labelledby="title desc"><title id="title">선분 AB에 닿는 두 경계 직선</title><desc id="desc">세로축의 (0,1)에서 나온 두 직선 중 파란 실선은 A(2,21), 주황 점선은 B(3,8)을 지난다. 두 점 사이의 녹색 선분에서 만날 수 있도록 두 직선 사이를 연한 색으로 표시했다.</desc><rect width="718" height="560" fill="white" /><line x1="75.0000" y1="460.5385" x2="650.0000" y2="460.5385" stroke="#586574" stroke-width="2.05" stroke-linecap="round" /><polygon points="663.0000,460.5385 650.0000,455.3385 650.0000,465.7385" fill="#586574" /><line x1="147.7423" y1="492.0000" x2="147.7423" y2="96.0000" stroke="#586574" stroke-width="2.05" stroke-linecap="round" /><polygon points="147.7423,83.0000 142.5423,96.0000 152.9423,96.0000" fill="#586574" /><polygon points="147.7423,444.8077 390.2165,130.1923 511.4536,334.6923" fill="none" /><line x1="111.3711" y1="492.0000" x2="426.5876" y2="83.0000" stroke="#205d9c" stroke-width="6.5" stroke-linecap="round" /><line x1="75.0000" y1="466.8308" x2="663.0000" y2="288.8109" stroke="#aa5411" stroke-width="6.5" stroke-linecap="round" stroke-dasharray="16 8" /><line x1="390.2165" y1="130.1923" x2="511.4536" y2="334.6923" stroke="#266f73" stroke-width="7.15" stroke-linecap="round" /><circle cx="147.74226804123714" cy="444.8076923076923" r="7.1" fill="#266f73" stroke="white" stroke-width="2" /><circle cx="390.21649484536084" cy="130.19230769230768" r="7.1" fill="#205d9c" stroke="white" stroke-width="2" /><circle cx="511.4536082474228" cy="334.6923076923077" r="7.1" fill="#aa5411" stroke="white" stroke-width="2" /><line x1="142.7423" y1="444.8077" x2="152.7423" y2="444.8077" stroke="#586574" stroke-width="1.6" stroke-linecap="round" /><line x1="99.0000" y1="39.0000" x2="144.0000" y2="39.0000" stroke="#205d9c" stroke-width="5.65" stroke-linecap="round" /><text x="155.0000" y="46.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#205d9c" text-anchor="start">A를 지나는 경계</text><line x1="388.0000" y1="39.0000" x2="433.0000" y2="39.0000" stroke="#aa5411" stroke-width="5.65" stroke-linecap="round" stroke-dasharray="16 8" /><text x="444.0000" y="46.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#aa5411" text-anchor="start">B를 지나는 경계</text><text x="679.000" y="447.538" fill="#586574" font-size="29" font-weight="600" font-family="Malgun Gothic, Cambria Math, sans-serif" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="4.0" stroke-linejoin="round">x</text><text x="166.742" y="78.000" fill="#586574" font-size="29" font-weight="600" font-family="Malgun Gothic, Cambria Math, sans-serif" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="4.0" stroke-linejoin="round">y</text><text x="170.742" y="490.538" fill="#586574" font-size="29" font-weight="600" font-family="Malgun Gothic, Cambria Math, sans-serif" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="4.0" stroke-linejoin="round">O</text><text x="455.216" y="114.192" fill="#205d9c" font-size="29" font-weight="600" font-family="Malgun Gothic, Cambria Math, sans-serif" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="4.0" stroke-linejoin="round">A(2, 21)</text><text x="585.454" y="348.692" fill="#aa5411" font-size="29" font-weight="600" font-family="Malgun Gothic, Cambria Math, sans-serif" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="4.0" stroke-linejoin="round">B(3, 8)</text><text x="120.742" y="443.808" fill="#586574" font-size="29" font-weight="600" font-family="Malgun Gothic, Cambria Math, sans-serif" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="4.0" stroke-linejoin="round">1</text></svg>
