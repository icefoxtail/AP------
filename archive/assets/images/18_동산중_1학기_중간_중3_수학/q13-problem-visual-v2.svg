<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 565 520" width="565" height="520" role="img" aria-labelledby="title desc"><title id="title">정사각형의 대각선과 부채꼴의 반지름</title><desc id="desc">90도 부채꼴 안의 정사각형 한 꼭짓점은 부채꼴의 중심에 있고 두 이웃 변은 두 반지름 위에 놓인다. 정사각형의 반대쪽 꼭짓점은 호 위에 있다. 정사각형 한 변의 길이는 2이다.</desc><rect width="565" height="520" fill="white" /><path d="M 104.000 433.500 L 104.000 68.500 A 365.0000 365.0000 0 0 1 469.000 433.500 Z" fill="none" stroke="#205d9c" stroke-width="4.5" /><polygon points="104.0000,433.5000 362.0940,433.5000 362.0940,175.4060 104.0000,175.4060" fill="none" /><line x1="104.0000" y1="433.5000" x2="362.0940" y2="433.5000" stroke="#aa5411" stroke-width="4.2" stroke-linecap="round" /><line x1="362.0940" y1="433.5000" x2="362.0940" y2="175.4060" stroke="#aa5411" stroke-width="4.2" stroke-linecap="round" /><line x1="362.0940" y1="175.4060" x2="104.0000" y2="175.4060" stroke="#aa5411" stroke-width="4.2" stroke-linecap="round" /><line x1="104.0000" y1="175.4060" x2="104.0000" y2="433.5000" stroke="#aa5411" stroke-width="4.2" stroke-linecap="round" /><line x1="120.0000" y1="433.5000" x2="120.0000" y2="417.5000" stroke="#586574" stroke-width="1.8" stroke-linecap="round" /><line x1="120.0000" y1="417.5000" x2="104.0000" y2="417.5000" stroke="#586574" stroke-width="1.8" stroke-linecap="round" /><line x1="104.0000" y1="461.5000" x2="362.0940" y2="461.5000" stroke="#aa5411" stroke-width="1.7" stroke-linecap="round" /><line x1="104.0000" y1="456.0000" x2="104.0000" y2="467.0000" stroke="#aa5411" stroke-width="1.7" stroke-linecap="round" /><line x1="362.0940" y1="456.0000" x2="362.0940" y2="467.0000" stroke="#aa5411" stroke-width="1.7" stroke-linecap="round" /><text x="233.0470" y="491.5000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#aa5411" text-anchor="middle">2</text></svg>
