<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 666 386" width="666" height="386" role="img" aria-labelledby="title desc"><title id="title">직사각형의 넓이에서 가로 길이 구하기</title><desc id="desc">가로 길이가 3x이고 세로 길이가 x−2인 직사각형이다. 안에는 인수분해한 넓이 3x(x−2)를 적었다.</desc><rect width="666" height="386" fill="white" /><rect x="97" y="112" width="418" height="215" fill="#e1eefb" stroke="#205d9c" stroke-width="4.4" /><line x1="97.0000" y1="77.0000" x2="515.0000" y2="77.0000" stroke="#586574" stroke-width="2" stroke-linecap="round" /><line x1="97.0000" y1="71.0000" x2="97.0000" y2="83.0000" stroke="#586574" stroke-width="2" stroke-linecap="round" /><line x1="515.0000" y1="71.0000" x2="515.0000" y2="83.0000" stroke="#586574" stroke-width="2" stroke-linecap="round" /><text x="306.0000" y="61.0000" font-size="30" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#205d9c" text-anchor="middle">3x</text><line x1="549.0000" y1="112.0000" x2="549.0000" y2="327.0000" stroke="#aa5411" stroke-width="2" stroke-linecap="round" /><line x1="543.0000" y1="112.0000" x2="555.0000" y2="112.0000" stroke="#aa5411" stroke-width="2" stroke-linecap="round" /><line x1="543.0000" y1="327.0000" x2="555.0000" y2="327.0000" stroke="#aa5411" stroke-width="2" stroke-linecap="round" /><text x="595.0000" y="229.5000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#aa5411" text-anchor="middle">x − 2</text><text x="306.0000" y="231.5000" font-size="36" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#205d9c" text-anchor="middle">3x(x − 2)</text></svg>
