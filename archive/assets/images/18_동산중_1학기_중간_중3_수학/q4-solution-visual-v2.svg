<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 706 449" width="706" height="449" role="img" aria-labelledby="title desc"><title id="title">정사각형의 두 대각선을 옮긴 수직선</title><desc id="desc">한 변의 길이가 1인 정사각형 ABCD의 밑변 BC는 수직선에 있다. C를 중심으로 한 왼쪽 호는 A에서 P로 이어지고, B를 중심으로 한 오른쪽 호는 D에서 Q로 이어진다. P, B, C, Q가 이 순서로 놓인다. 두 대각선 CA와 BD, 수직선 위의 CP와 BQ는 모두 같은 길이다. 두 원호에 작동하는 중심을 구분했다.</desc><rect width="706" height="449" fill="white" /><polygon points="228.6378,88.8649 228.6378,316.1351 455.9079,316.1351 455.9079,88.8649" fill="#e1eefb" /><line x1="228.6378" y1="88.8649" x2="228.6378" y2="316.1351" stroke="#586574" stroke-width="3.8" stroke-linecap="round" /><line x1="228.6378" y1="316.1351" x2="455.9079" y2="316.1351" stroke="#586574" stroke-width="3.8" stroke-linecap="round" /><line x1="455.9079" y1="316.1351" x2="455.9079" y2="88.8649" stroke="#586574" stroke-width="3.8" stroke-linecap="round" /><line x1="455.9079" y1="88.8649" x2="228.6378" y2="88.8649" stroke="#586574" stroke-width="3.8" stroke-linecap="round" /><line x1="228.6378" y1="88.8649" x2="455.9079" y2="316.1351" stroke="#205d9c" stroke-width="4.5" stroke-linecap="round" /><line x1="228.6378" y1="316.1351" x2="455.9079" y2="88.8649" stroke="#205d9c" stroke-width="4.5" stroke-linecap="round" /><line x1="300.0506" y1="170.1772" x2="309.9501" y2="160.2778" stroke="#205d9c" stroke-width="2.5" stroke-linecap="round" /><line x1="306.4146" y1="176.5412" x2="316.3141" y2="166.6417" stroke="#205d9c" stroke-width="2.5" stroke-linecap="round" /><line x1="312.2228" y1="242.4495" x2="302.3233" y2="232.5500" stroke="#205d9c" stroke-width="2.5" stroke-linecap="round" /><line x1="318.5868" y1="236.0856" x2="308.6873" y2="226.1861" stroke="#205d9c" stroke-width="2.5" stroke-linecap="round" /><line x1="134.4994" y1="316.1351" x2="455.9079" y2="316.1351" stroke="#205d9c" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="7 5" /><line x1="228.6378" y1="316.1351" x2="550.0463" y2="316.1351" stroke="#205d9c" stroke-width="2.6" strok