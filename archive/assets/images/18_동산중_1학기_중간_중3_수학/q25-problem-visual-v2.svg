<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 637 531" width="637" height="531" role="img" aria-labelledby="title desc"><title id="title">한 정사각형 안에 있는 기울어진 정사각형</title><desc id="desc">큰 정사각형 한 변은 3x+4이고 그 안의 기울어진 작은 정사각형 한 변은 x−3이다. 두 정사각형 사이에 끼인 부분을 주황색으로 칠했다.</desc><rect width="637" height="531" fill="white" /><rect x="151" y="64" width="355" height="355" fill="#f6d8b6" stroke="#205d9c" stroke-width="4.6" /><polygon points="309.341 164.656 405.344 222.341 347.659 318.344 251.656 260.659" fill="white" stroke="#266f73" stroke-width="4.25" /><line x1="151.0000" y1="457.0000" x2="506.0000" y2="457.0000" stroke="#205d9c" stroke-width="1.7" stroke-linecap="round" /><line x1="151.0000" y1="450.0000" x2="151.0000" y2="464.0000" stroke="#205d9c" stroke-width="1.7" stroke-linecap="round" /><line x1="506.0000" y1="450.0000" x2="506.0000" y2="464.0000" stroke="#205d9c" stroke-width="1.7" stroke-linecap="round" /><text x="328.5000" y="495.0000" font-size="31" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#205d9c" text-anchor="middle">3x + 4</text><line x1="376.5014" y1="270.3421" x2="401.5014" y2="319.3421" stroke="#266f73" stroke-width="1.65" stroke-linecap="round" /><line x1="401.5014" y1="319.3421" x2="422.5014" y2="319.3421" stroke="#266f73" stroke-width="1.65" stroke-linecap="round" /><text x="440.5014" y="354.3421" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#266f73" text-anchor="middle">x − 3</text></svg>
