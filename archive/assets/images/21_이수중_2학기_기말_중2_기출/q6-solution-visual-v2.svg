<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 540" width="742" height="540" role="img" aria-labelledby="title desc"><title id="title">세 평행선의 대응 선분</title><desc id="desc">가로 평행선 l, m, n을 두 사선이 가로지른다. 왼쪽 사선은 위 7 cm와 아래 x cm, 오른쪽 사선은 위 6 cm와 아래 12 cm이다. 위쪽 두 구간을 같은 색, 아래쪽 두 구간을 또 다른 같은 색으로 표시했다.</desc><rect width="742" height="540" fill="white" /><line x1="34.0000" y1="135.0000" x2="646.0000" y2="135.0000" stroke="#687889" stroke-width="2.8" stroke-linecap="round" /><text x="675.0000" y="144.0000" font-size="32" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#687889" text-anchor="middle">l</text><line x1="34.0000" y1="225.0000" x2="646.0000" y2="225.0000" stroke="#687889" stroke-width="2.8" stroke-linecap="round" /><text x="675.0000" y="234.0000" font-size="32" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#687889" text-anchor="middle">m</text><line x1="34.0000" y1="405.0000" x2="646.0000" y2="405.0000" stroke="#687889" stroke-width="2.8" stroke-linecap="round" /><text x="675.0000" y="414.0000" font-size="32" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#687889" text-anchor="middle">n</text><line x1="294.0900" y1="105.3000" x2="29.1000" y2="432.0000" stroke="#687889" stroke-width="3.4" stroke-linecap="round" /><line x1="270.0000" y1="135.0000" x2="197.0000" y2="225.0000" stroke="#202020" stroke-width="5.65" stroke-linecap="round" /><line x1="197.0000" y1="225.0000" x2="51.0000" y2="405.0000" stroke="#a34c1f" stroke-width="5.65" stroke-linecap="round" /><line x1="391.1400" y1="105.3000" x2="543.6000" y2="432.0000" stroke="#687889" stroke-width="3.4" stroke-linecap="round" /><line x1="405.0000" y1="135.0000" x2="447.0000" y2="225.0000" stroke="#202020" stroke-width="5.65" stroke-linecap="round" /><line x1="447.0000" y1="225.0000" x2="531.0000" y2="405.0000" stroke="#a34c1f" stroke-width="5.65" stroke-linecap="round" /><text x="158.0000" y="193.0000" font-size="34" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#202020" text-anchor="middle">7 cm</text><text x="54.0000" y="325.0000" font-size="34" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#a34c1f" text-anchor="middle">x cm</text><text x="497.0000" y="192.0000" font-size="34" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#202020" text-anchor="middle">6 cm</text><text x="571.0000" y="323.0000" font-size="34" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#a34c1f" text-anchor="middle">12 cm</text><circle cx="270" cy="135" r="5.5" fill="#293b4b" /><circle cx="197" cy="225" r="5.5" fill="#293b4b" /><circle cx="51" cy="405" r="5.5" fill="#293b4b" /><circle cx="405" cy="135" r="5.5" fill="#293b4b" /><circle cx="447" cy="225" r="5.5" fill="#293b4b" /><circle cx="531" cy="405" r="5.5" fill="#293b4b" /></svg>
