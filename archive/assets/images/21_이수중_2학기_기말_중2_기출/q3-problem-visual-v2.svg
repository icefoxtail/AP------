<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 747 683" width="747" height="683" role="img" aria-labelledby="title desc"><title id="title">원뿔을 밑면에 평행하게 자른 원뿔대</title><desc id="desc">처음 원뿔의 밑면 중심 O와 자른 면 중심 O′가 같은 세로축에 있으며 거리는 4 cm이다. 밑면 반지름은 6 cm이다.</desc><rect width="747" height="683" fill="white" /><path d="M 259 330 L 147 512 A 224 51 0 0 0 595 512 L 483 330 A 112 25.5 0 0 1 259 330 Z" fill="none" stroke="#227365" stroke-width="5.0" stroke-linejoin="round" /><ellipse cx="371" cy="330" rx="112" ry="25.5" fill="white" stroke="#227365" stroke-width="4.45" /><path d="M 147 512 A 224 51 0 0 1 595 512" fill="none" stroke="#227365" stroke-width="3" stroke-dasharray="9 6" /><line x1="371.0000" y1="148.0000" x2="259.0000" y2="330.0000" stroke="#774698" stroke-width="4.45" stroke-linecap="round" stroke-dasharray="10 7" /><line x1="371.0000" y1="148.0000" x2="483.0000" y2="330.0000" stroke="#774698" stroke-width="4.45" stroke-linecap="round" stroke-dasharray="10 7" /><line x1="371.0000" y1="148.0000" x2="371.0000" y2="512.0000" stroke="#774698" stroke-width="4.2" stroke-linecap="round" stroke-dasharray="9 6" /><line x1="371.0000" y1="512.0000" x2="595.0000" y2="512.0000" stroke="#202020" stroke-width="4.65" stroke-linecap="round" /><path d="M 371 496 H 387 V 512" fill="none" stroke="#687889" stroke-width="2.6" /><circle cx="371" cy="512" r="5.4" fill="#293b4b" /><text x="349.0000" y="539.0000" font-size="33" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#293b4b" text-anchor="middle">O</text><circle cx="371" cy="330" r="5.4" fill="#293b4b" /><text x="346.0000" y="318.0000" font-size="33" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#293b4b" text-anchor="middle">O′</text><text x="488.0000" y="549.0000" font-size="33" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#202020" text-anchor="middle">6 cm</text><line x1="416.0000" y1="330.0000" x2="416.0000" y2="512.0000" stroke="#77