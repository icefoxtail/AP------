<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 749 609" width="749" height="609" role="img" aria-labelledby="title desc"><title id="title">마름모에서 변 CD에 내려온 수선</title><desc id="desc">마름모의 가로 대각선 BD와 변 BC 사이의 각은 24°이다. 점 A에서 CD로 내린 선이 H에 닿으며 직각을 이룬다.</desc><rect width="749" height="609" fill="white" /><line x1="374.5000" y1="179.5848" x2="102.9200" y2="300.5000" stroke="#202020" stroke-width="5.15" stroke-linecap="round" /><line x1="102.9200" y1="300.5000" x2="374.5000" y2="421.4152" stroke="#202020" stroke-width="5.15" stroke-linecap="round" /><line x1="374.5000" y1="421.4152" x2="646.0800" y2="300.5000" stroke="#202020" stroke-width="5.15" stroke-linecap="round" /><line x1="646.0800" y1="300.5000" x2="374.5000" y2="179.5848" stroke="#202020" stroke-width="5.15" stroke-linecap="round" /><line x1="102.9200" y1="300.5000" x2="646.0800" y2="300.5000" stroke="#774698" stroke-width="5.2" stroke-linecap="round" /><line x1="374.5000" y1="179.5848" x2="464.3575" y2="381.4081" stroke="#227365" stroke-width="5.3" stroke-linecap="round" /><line x1="455.4093" y1="361.3101" x2="475.5073" y2="352.3619" stroke="#586574" stroke-width="1.8" stroke-linecap="round" /><line x1="475.5073" y1="352.3619" x2="484.4555" y2="372.4599" stroke="#586574" stroke-width="1.8" stroke-linecap="round" /><path d="M 155.9056 324.0907 A 58 58 0 0 0 160.9200 300.5000" stroke="#a34c1f" stroke-width="2.25" fill="none" /><text x="222.2540" y="333.8652" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#a34c1f" text-anchor="middle">24°</text><circle cx="374.5" cy="179.58479364390772" r="4.9" fill="#28364b" /><text x="374.5000" y="162.5848" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">A</text><circle cx="102.91999999999996" cy="300.5" r="4.9" fill="#28364b" /><text x="81.9200" y="310.5000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#2836