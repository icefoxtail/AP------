<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 744 650" width="744" height="650" role="img" aria-labelledby="title desc"><title id="title">두 일차함수와 가로축이 둘러싸는 삼각형</title><desc id="desc">오르는 실선 y=2x+6과 내리는 점선 y=−x+3이 A에서 만난다. 두 직선은 가로축에서 B 및 C와 만난다. 삼각형 ABC만 옅게 칠했다.</desc><rect width="744" height="650" fill="white" /><line x1="91.0000" y1="446.0000" x2="640.0000" y2="446.0000" stroke="#586574" stroke-width="2.05" stroke-linecap="round" /><polygon points="653.0000,446.0000 640.0000,440.8000 640.0000,451.2000" fill="#586574" /><line x1="362.7869" y1="582.0000" x2="362.7869" y2="121.0000" stroke="#586574" stroke-width="2.05" stroke-linecap="round" /><polygon points="362.7869,108.0000 357.5869,121.0000 367.9869,121.0000" fill="#586574" /><polygon points="224.5902,446.0000 316.7213,286.0000 500.9836,446.0000" fill="none" /><line x1="224.5902" y1="446.0000" x2="500.9836" y2="446.0000" stroke="#687889" stroke-width="2.15" stroke-linecap="round" /><line x1="362.7869" y1="446.0000" x2="362.7869" y2="326.0000" stroke="#687889" stroke-width="2.15" stroke-linecap="round" /><line x1="150.6457" y1="574.4160" x2="414.8502" y2="115.5840" stroke="#202020" stroke-width="7.5" stroke-linecap="round" /><line x1="122.0136" y1="116.9300" x2="642.7159" y2="569.0700" stroke="#a34c1f" stroke-width="7.2" stroke-linecap="round" stroke-dasharray="13 7" /><circle cx="316.72131147540983" cy="285.99999999999994" r="7.8" fill="#227365" stroke="white" stroke-width="2" /><circle cx="224.59016393442624" cy="446.0" r="7.8" fill="#202020" stroke="white" stroke-width="2" /><circle cx="500.9836065573771" cy="446.0" r="7.8" fill="#a34c1f" stroke="white" stroke-width="2" /><line x1="58.0000" y1="39.0000" x2="103.0000" y2="39.0000" stroke="#202020" stroke-width="5.65" stroke-linecap="round" /><text x="114.0000" y="46.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#202020" text-anchor="start">y = 2x + 6</text><line x1="401.0000" y1="39.0000" x2="446.0000" y2="39.0000" stroke="#a34c1f" stroke-width="5.65" stroke-linecap="round" stroke-dasharray="13 7" /><text x="457.0000" y="46.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#a34c1f" text-anchor="start">y = −x + 3</text><text x="669.000" y="433.000" fill="#586574" font-size="32" font-weight="600" font-family="Malgun Gothic, Cambria Math, sans-serif" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="4.0" stroke-linejoin="round">x</text><text x="381.787" y="103.000" fill="#586574" font-size="32" font-weight="600" font-family="Malgun Gothic, Cambria Math, sans-serif" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="4.0" stroke-linejoin="round">y</text><text x="386.787" y="479.000" fill="#586574" font-size="32" font-weight="600" font-family="Malgun Gothic, Cambria Math, sans-serif" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="4.0" stroke-linejoin="round">O</text><text x="316.721" y="239.000" fill="#227365" font-size="34" font-weight="600" font-family="Malgun Gothic, Cambria Math, sans-serif" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="4.0" stroke-linejoin="round">A</text><text x="247.590" y="481.000" fill="#202020" font-size="34" font-weight="600" font-family="Malgun Gothic, Cambria Math, sans-serif" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="4.0" stroke-linejoin="round">B</text><text x="481.984" y="481.000" fill="#a34c1f" font-size="34" font-weight="600" font-family="Malgun Gothic, Cambria Math, sans-serif" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="4.0" stroke-linejoin="round">C</text></svg>
