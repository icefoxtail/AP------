<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 732 633" width="732" height="633" role="img" aria-labelledby="title desc"><title id="title">함수 식을 따라 이어진 미로</title><desc id="desc">출발 칸에는 y=2x가 적혀 있다. 세 줄의 갈림길에 식이 있고 오른쪽과 아래쪽의 화살표가 서로 이어진다. 오른쪽 도착지는 독도, 설악산, 제주도이며 아래쪽 도착지는 남산, 경주, 지리산이다. 해설의 주황색 화살표는 출발점에서 골라 가는 이동을 표시한다.</desc><rect width="732" height="633" fill="white" /><rect x="20" y="45" width="155" height="94" rx="12" fill="#edf4fb" stroke="#9db1c3" stroke-width="2.0" /><text x="97.5000" y="80.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#25736e" text-anchor="middle">출발</text><text x="97.5000" y="118.0000" font-size="27" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">y=2x</text><line x1="180.0000" y1="92.0000" x2="186.0000" y2="92.0000" stroke="#aa5411" stroke-width="2.5" stroke-linecap="round" /><polygon points="191.0000,92.0000 183.0000,87.0000 183.0000,97.0000" fill="#aa5411" /><line x1="97.5000" y1="144.0000" x2="97.5000" y2="185.0000" stroke="#4d5d72" stroke-width="2.5" stroke-linecap="round" /><polygon points="97.5000,190.0000 92.5000,182.0000 102.5000,182.0000" fill="#4d5d72" /><rect x="198" y="45" width="155" height="94" rx="12" fill="#edf4fb" stroke="#9db1c3" stroke-width="2.0" /><text x="275.5000" y="104.0000" font-size="27" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">y=x²/2+1</text><line x1="358.0000" y1="92.0000" x2="364.0000" y2="92.0000" stroke="#4d5d72" stroke-width="2.5" stroke-linecap="round" /><polygon points="369.0000,92.0000 361.0000,87.0000 361.0000,97.0000" fill="#4d5d72" /><line x1="275.5000" y1="144.0000" x2="275.5000" y2="185.0000" stroke="#aa5411" stroke-width="2.5" stroke-linecap="round" /><polygon points="275.5000,190.0000 270.5000,182.0000 280.5000,182.0000" fill="#aa5411" /><rect x="376" y="45" width="155" height="94" rx="12" fill="#edf4fb" stroke="#9db1c3" stroke-width="2.0" /><text x="453.5000" y="104.0000" font-size="27" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">y=4x−2</text><line x1="536.0000" y1="92.0000" x2="542.0000" y2="92.0000" stroke="#4d5d72" stroke-width="2.5" stroke-linecap="round" /><polygon points="547.0000,92.0000 539.0000,87.0000 539.0000,97.0000" fill="#4d5d72" /><line x1="453.5000" y1="144.0000" x2="453.5000" y2="185.0000" stroke="#4d5d72" stroke-width="2.5" stroke-linecap="round" /><polygon points="453.5000,190.0000 448.5000,182.0000 458.5000,182.0000" fill="#4d5d72" /><rect x="554" y="45" width="155" height="94" rx="12" fill="#e9f3e9" stroke="#9db1c3" stroke-width="2.0" /><text x="631.5000" y="104.0000" font-size="27" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">독도</text><rect x="20" y="194" width="155" height="94" rx="12" fill="#edf4fb" stroke="#9db1c3" stroke-width="2.0" /><text x="97.5000" y="253.0000" font-size="27" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">y=5x−2</text><line x1="180.0000" y1="241.0000" x2="186.0000" y2="241.0000" stroke="#4d5d72" stroke-width="2.5" stroke-linecap="round" /><polygon points="191.0000,241.0000 183.0000,236.0000 183.0000,246.0000" fill="#4d5d72" /><line x1="97.5000" y1="293.0000" x2="97.5000" y2="334.0000" stroke="#4d5d72" stroke-width="2.5" stroke-linecap="round" /><polygon points="97.5000,339.0000 92.5000,331.0000 102.5000,331.0000" fill="#4d5d72" /><rect x="198" y="194" width="155" height="94" rx="12" fill="#edf4fb" stroke="#9db1c3" stroke-width="2.0" /><text x="275.5000" y="253.0000" font-size="27" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">y=−3x²</text><line x1="358.0000" y1="241.0000" x2="364.0000" y2="241.0000" stroke="#4d5d72" stroke-width="2.5" stroke-linecap="round" /><polygon points="369.0000,241.0000 361.0000,236.0000 361.0000,246.0000" fill="#4d5d72" /><line x1="275.5000" y1="293.0000" x2="275.5000" y2="334.0000" stroke="#aa5411" stroke-width="2.5" stroke-linecap="round" /><polygon points="275.5000,339.0000 270.5000,331.0000 280.5000,331.0000" fill="#aa5411" /><rect x="376" y="194" width="155" height="94" rx="12" fill="#edf4fb" stroke="#9db1c3" stroke-width="2.0" /><text x="453.5000" y="253.0000" font-size="27" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">y=6x²</text><line x1="536.0000" y1="241.0000" x2="542.0000" y2="241.0000" stroke="#4d5d72" stroke-width="2.5" stroke-linecap="round" /><polygon points="547.0000,241.0000 539.0000,236.0000 539.0000,246.0000" fill="#4d5d72" /><line x1="453.5000" y1="293.0000" x2="453.5000" y2="334.0000" stroke="#4d5d72" stroke-width="2.5" stroke-linecap="round" /><polygon points="453.5000,339.0000 448.5000,331.0000 458.5000,331.0000" fill="#4d5d72" /><rect x="554" y="194" width="155" height="94" rx="12" fill="#e9f3e9" stroke="#9db1c3" stroke-width="2.0" /><text x="631.5000" y="253.0000" font-size="27" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">설악산</text><rect x="20" y="343" width="155" height="94" rx="12" fill="#edf4fb" stroke="#9db1c3" stroke-width="2.0" /><text x="97.5000" y="402.0000" font-size="27" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">y=−x²/4</text><line x1="180.0000" y1="390.0000" x2="186.0000" y2="390.0000" stroke="#4d5d72" stroke-width="2.5" stroke-linecap="round" /><polygon points="191.0000,390.0000 183.0000,385.0000 183.0000,395.0000" fill="#4d5d72" /><line x1="97.5000" y1="442.0000" x2="97.5000" y2="483.0000" stroke="#4d5d72" stroke-width="2.5" stroke-linecap="round" /><polygon points="97.5000,488.0000 92.5000,480.0000 102.5000,480.0000" fill="#4d5d72" /><rect x="198" y="343" width="155" height="94" rx="12" fill="#edf4fb" stroke="#9db1c3" stroke-width="2.0" /><text x="275.5000" y="402.0000" font-size="27" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">y=4x−1/3</text><line x1="358.0000" y1="390.0000" x2="364.0000" y2="390.0000" stroke="#aa5411" stroke-width="2.5" stroke-linecap="round" /><polygon points="369.0000,390.0000 361.0000,385.0000 361.0000,395.0000" fill="#aa5411" /><line x1="275.5000" y1="442.0000" x2="275.5000" y2="483.0000" stroke="#4d5d72" stroke-width="2.5" stroke-linecap="round" /><polygon points="275.5000,488.0000 270.5000,480.0000 280.5000,480.0000" fill="#4d5d72" /><rect x="376" y="343" width="155" height="94" rx="12" fill="#edf4fb" stroke="#9db1c3" stroke-width="2.0" /><text x="453.5000" y="402.0000" font-size="27" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">y=−x²+5</text><line x1="536.0000" y1="390.0000" x2="542.0000" y2="390.0000" stroke="#4d5d72" stroke-width="2.5" stroke-linecap="round" /><polygon points="547.0000,390.0000 539.0000,385.0000 539.0000,395.0000" fill="#4d5d72" /><line x1="453.5000" y1="442.0000" x2="453.5000" y2="483.0000" stroke="#aa5411" stroke-width="2.5" stroke-linecap="round" /><polygon points="453.5000,488.0000 448.5000,480.0000 458.5000,480.0000" fill="#aa5411" /><rect x="554" y="343" width="155" height="94" rx="12" fill="#e9f3e9" stroke="#9db1c3" stroke-width="2.0" /><text x="631.5000" y="402.0000" font-size="27" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">제주도</text><rect x="20" y="492" width="155" height="94" rx="12" fill="#e9f3e9" stroke="#9db1c3" stroke-width="2.0" /><text x="97.5000" y="551.0000" font-size="27" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">남산</text><rect x="198" y="492" width="155" height="94" rx="12" fill="#e9f3e9" stroke="#9db1c3" stroke-width="2.0" /><text x="27