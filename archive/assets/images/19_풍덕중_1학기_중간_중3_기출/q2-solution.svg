<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 702 311" width="702" height="311" role="img" aria-labelledby="title desc"><title id="title">자연수 범위의 양 끝과 포함되는 값</title><desc id="desc">36부터 48까지를 같은 간격의 파란 점으로 표시했다. 오른쪽 49의 점은 속을 비워 범위에 포함하지 않았다.</desc><rect width="702" height="311" fill="white" /><line x1="35.0000" y1="158.0000" x2="657.0000" y2="158.0000" stroke="#586574" stroke-width="2.05" stroke-linecap="round" /><line x1="71.0000" y1="158.0000" x2="575.0000" y2="158.0000" stroke="#205d9c" stroke-width="4.55" stroke-linecap="round" /><circle cx="71" cy="158" r="5.3" fill="#205d9c" /><text x="71.0000" y="196.0000" font-size="30" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#205d9c" text-anchor="middle">36</text><circle cx="113" cy="158" r="5.3" fill="#205d9c" /><circle cx="155" cy="158" r="5.3" fill="#205d9c" /><circle cx="197" cy="158" r="5.3" fill="#205d9c" /><text x="197.0000" y="196.0000" font-size="30" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#205d9c" text-anchor="middle">39</text><circle cx="239" cy="158" r="5.3" fill="#205d9c" /><circle cx="281" cy="158" r="5.3" fill="#205d9c" /><circle cx="323" cy="158" r="5.3" fill="#205d9c" /><text x="323.0000" y="196.0000" font-size="30" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#205d9c" text-anchor="middle">42</text><circle cx="365" cy="158" r="5.3" fill="#205d9c" /><circle cx="407" cy="158" r="5.3" fill="#205d9c" /><circle cx="449" cy="158" r="5.3" fill="#205d9c" /><text x="449.0000" y="196.0000" font-size="30" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#205d9c" text-anchor="middle">45</text><circle cx="491" cy="158" r="5.3" fill="#205d9c" /><circle cx="533" cy="158" r="5.3" fill="#205d9c" /><circle cx="575" cy="158" r="5.3" fill="#205d9c" /><text x="575.0000" y="196.0000" font-size="30" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#205d9c" text-anchor="middle">48</text><circle cx="617" cy="158" r="7" fill="white" stroke="#586574" stroke-width="2.6" /><text x="617.0000" y="196.0000" font-size="30" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#586574" text-anchor="middle">49</text><text x="323.0000" y="98.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#205d9c" text-anchor="middle">범위 안에 있는 자연수</text></svg>
