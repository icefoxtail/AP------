<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 708 522" width="708" height="522" role="img" aria-labelledby="title desc"><title id="title">합이 13인 자연수의 곱을 비교한 길이</title><desc id="desc">합이 13인 여섯 수 쌍 옆에서 가로 막대 길이로 곱을 비교한다. 첫 줄은 1과 12이고 아래에서 두 수가 가까워질수록 막대가 길어진다.</desc><rect width="708" height="522" fill="white" /><text x="124.0000" y="79.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">1 × 12</text><rect x="202" y="62" width="117.0" height="18" rx="4" fill="#205d9c" /><text x="124.0000" y="151.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">2 × 11</text><rect x="202" y="134" width="214.5" height="18" rx="4" fill="#205d9c" /><text x="124.0000" y="223.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">3 × 10</text><rect x="202" y="206" width="292.5" height="18" rx="4" fill="#205d9c" /><text x="124.0000" y="295.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">4 × 9</text><rect x="202" y="278" width="351.0" height="18" rx="4" fill="#205d9c" /><text x="124.0000" y="367.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">5 × 8</text><rect x="202" y="350" width="390.0" height="18" rx="4" fill="#205d9c" /><text x="124.0000" y="439.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">6 × 7</text><rect x="202" y="422" width="409.5" height="18" rx="4" fill="#277339" /></svg>
