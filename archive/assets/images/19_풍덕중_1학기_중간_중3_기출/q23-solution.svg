<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 404" width="720" height="404" role="img" aria-labelledby="title desc"><title id="title">39보다 작은 자연수 제곱을 세는 순서</title><desc id="desc">수직선에 1부터 36까지 여섯 양의 제곱수를 표시했다. 7의 제곱 49는 39의 주황 기준선을 지나 포함하지 않는다.</desc><rect width="720" height="404" fill="white" /><line x1="46.0000" y1="210.0000" x2="667.0000" y2="210.0000" stroke="#586574" stroke-width="2.0" stroke-linecap="round" /><circle cx="77.3" cy="210" r="5.5" fill="#205d9c" stroke="#205d9c" stroke-width="2" /><text x="77.3000" y="293.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#205d9c" text-anchor="middle">1</text><circle cx="111.2" cy="210" r="5.5" fill="#205d9c" stroke="#205d9c" stroke-width="2" /><text x="111.2000" y="255.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#205d9c" text-anchor="middle">4</text><circle cx="167.7" cy="210" r="5.5" fill="#205d9c" stroke="#205d9c" stroke-width="2" /><text x="167.7000" y="293.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#205d9c" text-anchor="middle">9</text><circle cx="246.8" cy="210" r="5.5" fill="#205d9c" stroke="#205d9c" stroke-width="2" /><text x="246.8000" y="255.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#205d9c" text-anchor="middle">16</text><circle cx="348.5" cy="210" r="5.5" fill="#205d9c" stroke="#205d9c" stroke-width="2" /><text x="348.5000" y="255.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#205d9c" text-anchor="middle">25</text><circle cx="472.8" cy="210" r="5.5" fill="#205d9c" stroke="#205d9c" stroke-width="2" /><text x="472.8000" y="255.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#205d9c" text-anchor="middle">36</text><circle cx="619.7" cy="210" r="5.5" fill="white" stroke="#586574" stroke-width="2" /><text x="619.7000" y="293.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#586574" text-anchor="middle">49</text><line x1="506.7000" y1="126.0000" x2="506.7000" y2="222.0000" stroke="#aa5411" stroke-width="2.15" stroke-linecap="round" stroke-dasharray="6 5" /><text x="506.7000" y="96.0000" font-size="30" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#aa5411" text-anchor="middle">39</text><text x="251.0000" y="110.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#205d9c" text-anchor="middle">가능한 양의 제곱수</text></svg>
