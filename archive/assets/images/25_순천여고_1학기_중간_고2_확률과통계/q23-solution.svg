<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 600" width="720" height="600" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">밑면이 정사각형인 사각뿔의 5개 면에 6가지 색 중 5가지를 칠한다. 6가지 색 중 5가지를 고르는 경우는 6가지, 밑면에 칠할 색은 5가지, 옆면 네 개를 돌려 같은 것으로 보는 배열은 6가지이므로 6×5×6=180이다. 따라서 답은 180이다.</title><desc id="visual-desc">밑면이 정사각형인 사각뿔이 보이고 꼭짓점 P에서 밑면의 네 꼭짓점 A, B, C, D로 모서리가 이어진다. 밑면과 한 옆면에 짧은 이름표가 붙어 있다.</desc><rect width="720" height="600" fill="#fff"/><g data-layer="30"><line id="sAB" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="68.695652174" y1="533.043478261" x2="534.782608696" y2="533.043478261"/></g><g data-layer="30"><line id="sBC" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="534.782608696" y1="533.043478261" x2="651.304347826" y2="358.260869565"/></g><g data-layer="30"><line id="sCD" data-role="line" stroke="#111" stroke-width="1.6" fill="none" stroke-dasharray="6 4" x1="651.304347826" y1="358.260869565" x2="185.217391304" y2="358.260869565"/></g><g data-layer="30"><line id="sDA" data-role="line" stroke="#111" stroke-width="1.6" fill="none" stroke-dasharray="6 4" x1="185.217391304" y1="358.260869565" x2="68.695652174" y2="533.043478261"/></g><g data-layer="30"><line id="sPA" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="360" y1="66.956521739" x2="68.695652174" y2="533.043478261"/></g><g 