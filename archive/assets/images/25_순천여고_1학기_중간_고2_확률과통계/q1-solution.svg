<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" width="480" height="480" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">서로 다른 네 색을 네 영역에 모두 쓰는 배열은 4!가지이다. 회전하여 같은 배열은 네 가지씩 한 묶음이 되므로 서로 다른 칠하기는 4!을 4로 나눈 6가지이다. 따라서 답은 ①이다.</title><desc id="visual-desc">정사각형이 가운데에서 십자로 나뉘어 네 영역이 되고 각 영역이 다른 색과 번호로 표시되어 있다.</desc><rect width="480" height="480" fill="#fff"/><g data-layer="10"><path id="r1" data-role="region" stroke="none" stroke-width="1.6" fill="#7fa6e8" data-owner-points="A M1 M4 O" data-mark="region" data-mark-id="r1" fill-opacity="0.32" fill-rule="evenodd" d="M54.285714286 425.714285714 L240 425.714285714 L240 240 L54.285714286 240 L54.285714286 425.714285714 Z"/></g><g data-layer="10"><path id="r2" data-role="region" stroke="none" stroke-width="1.6" fill="#f2a65a" data-owner-points="B M1 M2 O" data-mark="region" data-mark-id="r2" fill-opacity="0.42" fill-rule="evenodd" d="M240 425.714285714 L425.714285714 425.714285714 L425.714285714 240 L240 240 L240 425.714285714 Z"/></g><g data-layer="10"><path id="r3" data-role="region" stroke="none" stroke-width="1.6" fill="#6fcf97" data-owner-points="C M2 M3 O" data-mark="region" data-mark-id="r3" fill-opacity="0.42" fill-rule="evenodd" d="M240 240 L425.714285714 240 L425.714285714 54.285714286 L240 54.285714286 L240 240 Z"/></g><g data-layer="10"><path id="r4" data-role="region" s