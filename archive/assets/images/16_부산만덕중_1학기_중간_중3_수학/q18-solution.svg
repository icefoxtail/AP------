<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 384 320" width="384" height="320" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">색칠한 부분은 반지름이 a인 큰 원에서 반지름이 b인 작은 원을 뺀 원환이다. 그 넓이는 πa²−πb²=π(a²−b²)로 나타낼 수 있다. 이때 a²−b²=(a+b)(a−b)인 합차공식을 쓰면 넓이는 π(a+b)(a−b)가 된다. 따라서 답은 ①이다.</title><desc id="visual-desc">중심이 같은 두 원이 겹쳐 있고, 두 원 사이의 원환 부분이 연한 회색으로 색칠되어 있다. 중심에서 큰 원과 작은 원에 이르는 반지름이 각각 a, b로 표시되어 있다.</desc><rect width="384" height="320" fill="#fff"/><g data-layer="10"><path id="ring" data-role="region" stroke="none" stroke-width="1.6" fill="#e4e7ec" data-owner-points="A B O" data-mark="region" data-mark-id="ring" fill-rule="evenodd" d="M306.285714286 160 A114.285714286 114.285714286 0 0 0 77.714285714 160 A114.285714286 114.285714286 0 0 0 306.285714286 160 Z M192 91.428571429 A68.571428571 68.571428571 0 0 0 192 228.571428571 A68.571428571 68.571428571 0 0 0 192 91.428571429 Z"/></g><g data-layer="30"><line id="OA" data-role="line" stroke="#111" stroke-width="1.6" fill="none" stroke-dasharray="6 4" x1="192" y1="160" x2="306.285714286" y2="160"/></g><g data-layer="30"><line id="OB" data-role="line" stroke="#111" stroke-width="1.6" fill="none" stroke-dasharray="6 4" x1="192" y1="160" x2="192" y2="91.428571429"/></g><g data-layer="40"><circle id="cOuter" data-role="circle" stroke="#111" stroke-width="2.05" fill="none" cx="192" cy="160" r="114.