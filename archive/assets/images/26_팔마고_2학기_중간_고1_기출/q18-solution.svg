<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 930" width="580" height="930" role="img" aria-labelledby="title desc" data-geometry-mode="EXACT_COORDINATE_SAMPLE" data-axis-scale-mode="EQUAL_UNIT">
<title id="title">18번 해설: 무게중심과 원점 대칭으로 결정되는 점 Q</title>
<desc id="desc">원점 O, A(-1,2), 원점 대칭점 A′(1,-2), 사분원 위의 예시 점 P(2루트2,2루트2), Q(1-2루트2,-2-2루트2)를 실제 좌표에 그렸다. P와 Q의 좌표합은 A′, 벡터 A′Q는 벡터 OP의 반대이고 두 길이는 4다. 삼각형 A′QP의 넓이는 (2x+y)/2다.</desc>
<rect width="580" height="930" fill="white"/>
<text x="22" y="34" font-size="25" font-family="Arial,sans-serif" font-weight="700" fill="#0f172a">무게중심  O  →  점 Q의 위치</text>
<text x="22" y="61" font-size="19" font-family="Arial,sans-serif" fill="#475569">P는 호 위의 예시 위치 (45°), Q는 P+Q=A′로 결정</text>
<line x1="38" y1="306" x2="496" y2="306" stroke="#94a3b8" stroke-width="1.5"/>
<line x1="270" y1="78" x2="270" y2="562" stroke="#94a3b8" stroke-width="1.5"/>
<text x="500" y="313" font-size="19" fill="#475569">x</text>
<text x="282" y="88" font-size="19" fill="#475569">y</text>
<polyline points="446.000,306.000 445.893,299.858 445.571,293.723 445.036,287.603 444.287,281.506 443.326,275.438 442.154,269.408 440.772,263.422 439.182,257.488 437.386,251.613 435.386,245.804 433.184,240.069 430.784,234.414 428.188,228.847 425.399,223.373 422.420,218.000 419.256,212.734 415.911,207.582 412.387,202.550 408.690,197.644 404.824,192.869 400.793,188.233 396.604,183.740 392.260,179.396 387.767,175.207 383.131,171.176 378.356,167.310 373.450,163.613 368.418,160.089 363.266,156.744 358.000,153.580 352.627,150.601 347.153,147.812 341.586,145.216 335.931,142.816 330.196,140.614 324.387,138.614 318.512,136.818 312.578,135.228 306.592,133.846 300.562,132.674 294.494,131.713 288.397,130.964 282.277,130.429 276.142,130.107 270.000,130.000" fill="none" stroke="#334155" stroke-width="2.8"/>
<polygon points="314.000,394.000 189.549,518.451 394.451,181.549" fill="#dbeafe" fill-opacity="0.67" stroke="#2563eb" stroke-width="2.4" stroke-linejoin="round" data-geometry="triangle-Aprime-Q-P"/>
<line x1="270.000" y1="306.000" x2="394.451" y2="181.549" stroke="#059669" stroke-width="2.6" stroke-dasharray="6 5" data-geometry="vector-OP"/>
<line x1="314.000" y1="394.000" x2="189.549" y2="518.451" stroke="#059669" stroke-width="3.1"  data-geometry="vector-Aprime-Q"/>
<line x1="270.000" y1="306.000" x2="314.000" y2="394.000" stroke="#64748b" stroke-width="1.6" stroke-dasharray="4 5" />
<line x1="226.000" y1="218.000" x2="270.000" y2="306.000" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="4 5" />
<g data-point="O" data-math-x="0.000000000" data-math-y="0.000000000"><circle cx="270.000" cy="306.000" r="4.8" fill="#0f172a" stroke="#fff" stroke-width="1.4"/><text x="247.000" y="328.000" font-size="20" font-family="Arial,sans-serif" font-style="italic" fill="#0f172a">O</text></g>
<g data-point="A" data-math-x="-1.000000000" data-math-y="2.000000000"><circle cx="226.000" cy="218.000" r="4.8" fill="#0f172a" stroke="#fff" stroke-width="1.4"/><text x="202.000" y="207.000" font-size="20" font-family="Arial,sans-serif" font-style="italic" fill="#0f172a">A</text></g>
<g data-point="A′" data-math-x="1.000000000" data-math-y="-2.000000000"><circle cx="314.000" cy="394.000" r="4.8" fill="#0f172a" stroke="#fff" stroke-width="1.4"/><text x="325.000" y="414.000" font-size="20" font-family="Arial,sans-serif" font-style="italic" fill="#0f172a">A′</text></g>
<g data-point="P" data-math-x="2.828427125" data-math-y="2.828427125"><circle cx="394.451" cy="181.549" r="4.8" fill="#2563eb" stroke="#fff" stroke-width="1.4"/><text x="405.451" y="171.549" font-size="20" font-family="Arial,sans-serif" font-style="italic" fill="#2563eb">P</text></g>
<g data-point="Q" data-math-x="-1.828427125" data-math-y="-4.828427125"><circle cx="189.549" cy="518.451" r="4.8" fill="#2563eb" stroke="#fff" stroke-width="1.4"/><text x="162.549" y="535.451" font-size="20" font-family="Arial,sans-serif" font-style="italic" fill="#2563eb">Q</text></g>
<rect x="20" y="610" width="540" height="142" rx="14" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="38" y="640" font-size="22" font-family="Arial,sans-serif" font-weight="700" fill="#0f172a">핵심 벡터 관계</text>
<text x="38" y="677" font-size="22" font-family="Arial,sans-serif" fill="#334155">P + Q = A′</text>
<text x="295" y="677" font-size="21" font-family="Arial,sans-serif" fill="#047857">A′Q = OP = 4</text>
<text x="38" y="713" font-size="19" font-family="Arial,sans-serif" fill="#475569">실제 길이가 같은 두 선분</text>
<text x="295" y="713" font-size="19" font-family="Arial,sans-serif" fill="#475569">(초록색 선분)</text>
<rect x="20" y="767" width="540" height="118" rx="14" fill="#eff6ff" stroke="#bfdbfe"/>
<text x="38" y="798" font-size="21" font-family="Arial,sans-serif" font-weight="700" fill="#1e40af">△A′QP 의 넓이</text>
<text x="38" y="836" font-size="24" font-family="Arial,sans-serif" fill="#1e3a8a">S = (2x + y) / 2</text>
<text x="335" y="836" font-size="21" font-family="Arial,sans-serif" fill="#1e3a8a">2 ≤ S ≤ 2√5</text>
<text x="22" y="914" font-size="18" font-family="Arial,sans-serif" fill="#475569">점 P의 위치가 바뀌면 Q도 이동하며, 위 삼각형은 한 예시다.</text>
</svg>