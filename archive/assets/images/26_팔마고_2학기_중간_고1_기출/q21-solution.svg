<title id="title">21번 해설: 대칭으로 펴는 삼각형의 최소 둘레</title>
<desc id="desc">호 AB의 내부에 점 P를 잡아 각 AOP가 22.5도가 되게 한다. P의 두 대칭점 P₁, P₂를 잇는 직선은 선분 OA와 OB를 각각 R, Q에서 만나며 P₁, R, Q, P₂ 순으로 일직선이다. P, Q, R은 서로 다른 점이고 삼각형 PQR의 둘레는 6루트2이다.</desc>
