<text x="526" y="98" class="sidehead">해설 핵심</text>
<text x="526" y="124" class="sidebody">A(t)=(t,2t)</text>
<text x="526" y="145" class="sidebody">0≤t≤2: B=(9,0)</text>
<text x="526" y="166" class="sidebody">AB²=5t²−18t+81</text>
<text x="526" y="187" class="sidebody">t≥2:</text>
<text x="526" y="208" class="sidebody">B(t)=(13−2t,0)</text>
<text x="526" y="229" class="sidebody">AB²=13(t−3)²+52</text>
<text x="526" y="250" class="sidebody">전체 최소는 t=3</text>
<text x="526" y="271" class="sidebody">최소거리 = √52 = 2√13</text>
