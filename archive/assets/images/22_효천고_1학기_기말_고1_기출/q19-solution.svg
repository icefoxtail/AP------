<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" role="img" aria-labelledby="title desc" data-scale-policy="SCHEMATIC_ALLOWED">
  <title id="title">외부점에서 그은 두 접선</title>
  <desc id="desc">원 x²+y²=1과 외부점 P(2,1)에서 그은 두 접선 y=1, y=4x/3−5/3 및 접점 Q를 나타낸 그림</desc>
  <rect width="640" height="300" fill="#fff"/>
  <text x="320" y="28" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="21" font-weight="700" fill="#1e3a5f">중심에서 접점으로 이은 반지름은 접선과 수직</text>
  <rect x="18" y="45" width="350" height="235" rx="8" fill="#f8fafc" stroke="#dbe3ef"/>
  <g stroke="#e2e8f0" stroke-width="1">
    <line x1="50" y1="65" x2="330" y2="65"/><line x1="50" y1="95" x2="330" y2="95"/><line x1="50" y1="125" x2="330" y2="125"/><line x1="50" y1="155" x2="330" y2="155"/><line x1="50" y1="185" x2="330" y2="185"/><line x1="50" y1="215" x2="330" y2="215"/><line x1="50" y1="245" x2="330" y2="245"/><line x1="70" y1="50" x2="70" y2="270"/><line x1="100" y1="50" x2="100" y2="270"/><line x1="130" y1="50" x2="130" y2="270"/><line x1="160" y1="50" x2="160" y2="270"/><line x1="190" y1="50" x2="190" y2="270"/><line x1="220" y1="50" x2="220" y2="270"/><line x1="250" y1="50" x2="250" y2="270"/><line x1="280" y1="50" x2="280" y2="270"/><line x1="310" y1="50" x2="310" y2="270"/>
  </g>
  <line x1="50" y1="165" x2="333" y2="165" stroke="#0f172a" stroke-width="1.5"/><line x1="160" y1="50" x2="160" y2="270" stroke="#0f172a" stroke-width="1.5"/>
  <text x="325" y="159" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14">x</text><text x="167" y="62" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14">y</text>
  <circle cx="160" cy="165" r="70" fill="#dbeafe" fill-opacity=".7" stroke="#2563eb" stroke-width="2.6"/>
  <line x1="70" y1="95" x2="315" y2="95" stroke="#dc2626" stroke-width="2.5"/>
  <line x1="216" y1="207" x2="300" y2="95" stroke="#d97706" stroke-width="2.5"/>
  <line x1="160" y1="165" x2="160" y2="95" stroke="#0f766e" stroke-width="2.1" stroke-dasharray="6 4"/>
  <line x1="160" y1="165" x2="216" y2="207" stroke="#0f766e" stroke-width="2.1" stroke-dasharray="6 4"/>
  <circle cx="160" cy="165" r="4.5" fill="#1d4ed8"/><circle cx="160" cy="95" r="4.2" fill="#dc2626"/><circle cx="216" cy="207" r="4.2" fill="#d97706"/><circle cx="300" cy="95" r="4.8" fill="#111827"/>
  <text x="167" y="180" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14" font-weight="700">O</text>
  <text x="166" y="91" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="12" fill="#b91c1c">Q₁(0,1)</text>
  <text x="220" y="222" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="12" fill="#b45309">Q₂(4/5,−3/5)</text>
  <text x="304" y="91" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="13" font-weight="700">P(2,1)</text>
  <text x="72" y="88" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="12" fill="#b91c1c">y=1</text>
  <text x="230" y="146" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="12" fill="#b45309">y=4x/3−5/3</text>
  <rect x="375" y="45" width="247" height="235" rx="8" fill="#f8fafc" stroke="#dbe3ef"/>
  <text x="393" y="75" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="17" font-weight="700" fill="#334155">기울기 a로 계산</text>
  <text x="393" y="108" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14">y=a(x−2)+1</text>
  <text x="393" y="138" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14">|−2a+1|/√(a²+1)=1</text>
  <text x="393" y="168" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14">a(3a−4)=0</text>
  <text x="393" y="198" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14">a=0 또는 a=4/3</text>
  <line x1="393" y1="212" x2="604" y2="212" stroke="#cbd5e1"/>
  <text x="393" y="240" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="13">y=1, y=4x/3−5/3</text>
  <text x="393" y="267" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="13" fill="#475569">두 직선 모두 P를 지난다.</text>
</svg>
