<text x="277.05" y="236.70" class="small" text-anchor="start">AC와 BD의 중점 O</text>
<text x="313.90" y="268.52" class="small" text-anchor="start">AB²=20</text>
<text x="323.95" y="230.00" class="small" text-anchor="start">BC²=20</text>
<text x="526" y="98" class="sidehead">해설 핵심</text>
<text x="526" y="124" class="sidebody">대각선 중점 일치</text>
<text x="526" y="145" class="sidebody">(a+5)/2=(b+1)/2</text>
<text x="526" y="166" class="sidebody">→ b=a+4</text>
<text x="526" y="187" class="sidebody">AB²=20</text>
<text x="526" y="208" class="sidebody">BC²=(1−a)²+16</text>
<text x="526" y="229" class="sidebody">AB=BC</text>
<text x="526" y="250" class="sidebody">(1−a)²=4</text>
<text x="526" y="271" class="sidebody">a&gt;0 → a=3, b=7</text>
<text x="526" y="292" class="sidebody">ab=21</text>
