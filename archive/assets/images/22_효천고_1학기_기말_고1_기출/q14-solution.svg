<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" role="img" aria-labelledby="title desc">
  <title id="title">두 축과 주어진 직선에 접하는 두 원</title>
  <desc id="desc">제1사분면에서 두 좌표축과 직선 6x+8y−9=0에 동시에 접하는 중심 (r,r), 반지름 r인 두 원을 나타낸 그림</desc>
  <rect width="640" height="300" fill="#fff"/>
  <text x="320" y="28" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="21" font-weight="700" fill="#1e3a5f">중심 (r,r), 축까지의 거리는 r</text>
  <rect x="18" y="45" width="350" height="238" rx="8" fill="#f8fafc" stroke="#dbe3ef"/>
  <g stroke="#e2e8f0" stroke-width="1">
    <line x1="65" y1="75" x2="350" y2="75"/><line x1="65" y1="115" x2="350" y2="115"/><line x1="65" y1="155" x2="350" y2="155"/><line x1="65" y1="195" x2="350" y2="195"/><line x1="65" y1="235" x2="350" y2="235"/><line x1="105" y1="55" x2="105" y2="270"/><line x1="145" y1="55" x2="145" y2="270"/><line x1="185" y1="55" x2="185" y2="270"/><line x1="225" y1="55" x2="225" y2="270"/><line x1="265" y1="55" x2="265" y2="270"/><line x1="305" y1="55" x2="305" y2="270"/>
  </g>
  <line x1="65" y1="235" x2="354" y2="235" stroke="#0f172a" stroke-width="1.5"/><line x1="65" y1="55" x2="65" y2="270" stroke="#0f172a" stroke-width="1.5"/>
  <text x="344" y="229" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14">x</text><text x="72" y="66" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14">y</text>
  <line x1="65" y1="190" x2="350" y2="284" stroke="#dc2626" stroke-width="2.5"/>
  <circle cx="80" cy="220" r="15" fill="#fef3c7" fill-opacity=".9" stroke="#d97706" stroke-width="2.3"/>
  <circle cx="155" cy="145" r="90" fill="#dbeafe" fill-opacity=".42" stroke="#2563eb" stroke-width="2.6"/>
  <circle cx="80" cy="220" r="4" fill="#b45309"/><circle cx="155" cy="145" r="4.5" fill="#1d4ed8"/>
  <text x="88" y="216" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="12" font-weight="700" fill="#b45309">r=3/8</text>
  <text x="162" y="140" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="13" font-weight="700" fill="#1d4ed8">r=9/4</text>
  <text x="188" y="110" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="12" fill="#b91c1c">6x+8y−9=0</text>
  <text x="263" y="274" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="12" fill="#b91c1c">공통 접선</text>
  <rect x="390" y="45" width="232" height="238" rx="8" fill="#f8fafc" stroke="#dbe3ef"/>
  <text x="408" y="75" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="17" font-weight="700" fill="#334155">거리 조건</text>
  <text x="408" y="108" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14">|14r−9|/10=r</text>
  <text x="408" y="140" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14">14r−9=10r</text>
  <text x="408" y="164" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14">→ r=9/4</text>
  <text x="408" y="194" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14">14r−9=−10r</text>
  <text x="408" y="218" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14">→ r=3/8</text>
  <line x1="408" y1="232" x2="604" y2="232" stroke="#cbd5e1"/>
  <text x="408" y="262" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="15" font-weight="700" fill="#1d4ed8">r₁+r₂=21/8 → ⑤</text>
</svg>
