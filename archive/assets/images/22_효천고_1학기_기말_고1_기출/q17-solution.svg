<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320" role="img" aria-labelledby="title desc" data-scale-policy="SCHEMATIC_ALLOWED">
  <title id="title">y=m|x|와 원의 교점 수</title>
  <desc id="desc">원 중심 (1,2), 반지름 √3과 V자 그래프 y=m|x|의 오른쪽 가지·왼쪽 가지, 두 임계 기울기를 나타낸 그림</desc>
  <rect width="640" height="320" fill="#fff"/>
  <text x="320" y="28" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="21" font-weight="700" fill="#1e3a5f">두 가지의 교점 수를 따로 센다</text>
  <rect x="18" y="45" width="350" height="258" rx="8" fill="#f8fafc" stroke="#dbe3ef"/>
  <g stroke="#e2e8f0" stroke-width="1">
    <line x1="40" y1="70" x2="350" y2="70"/><line x1="40" y1="107" x2="350" y2="107"/><line x1="40" y1="144" x2="350" y2="144"/><line x1="40" y1="181" x2="350" y2="181"/><line x1="40" y1="218" x2="350" y2="218"/><line x1="40" y1="255" x2="350" y2="255"/><line x1="78" y1="55" x2="78" y2="290"/><line x1="115" y1="55" x2="115" y2="290"/><line x1="152" y1="55" x2="152" y2="290"/><line x1="189" y1="55" x2="189" y2="290"/><line x1="226" y1="55" x2="226" y2="290"/><line x1="263" y1="55" x2="263" y2="290"/><line x1="300" y1="55" x2="300" y2="290"/><line x1="337" y1="55" x2="337" y2="290"/>
  </g>
  <line x1="40" y1="220" x2="354" y2="220" stroke="#0f172a" stroke-width="1.5"/><line x1="171" y1="55" x2="171" y2="295" stroke="#0f172a" stroke-width="1.5"/>
  <text x="344" y="214" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14">x</text><text x="178" y="66" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14">y</text>
  <circle cx="208.5" cy="145" r="65" fill="#dbeafe" fill-opacity=".7" stroke="#2563eb" stroke-width="2.6"/>
  <line x1="40" y1="89" x2="171" y2="220" stroke="#94a3b8" stroke-width="2.2" stroke-dasharray="7 5"/>
  <line x1="171" y1="220" x2="340" y2="51" stroke="#16a34a" stroke-width="2.7"/>
  <circle cx="208.5" cy="145" r="4.5" fill="#1d4ed8"/><circle cx="171" cy="220" r="4" fill="#111827"/>
  <text x="214" y="140" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="13" font-weight="700">C(1,2)</text>
  <text x="177" y="236" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="13" font-weight="700">O</text>
  <text x="279" y="75" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="13" fill="#15803d">y=mx (x≥0)</text>
  <text x="45" y="84" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="12" fill="#64748b">y=−mx (x≤0)</text>
  <text x="219" y="107" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="12" fill="#1d4ed8">r=√3</text>
  <rect x="390" y="45" width="232" height="258" rx="8" fill="#f8fafc" stroke="#dbe3ef"/>
  <text x="408" y="75" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="17" font-weight="700" fill="#334155">각 가지의 조건</text>
  <text x="408" y="107" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="13">오른쪽: |m−2|/√(m²+1)&lt;√3</text>
  <text x="408" y="133" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14">→ m&gt;(√6−2)/2</text>
  <text x="408" y="166" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="13">왼쪽: |m+2|/√(m²+1)&lt;√3</text>
  <text x="408" y="192" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14">→ m&gt;(√6+2)/2</text>
  <line x1="408" y1="208" x2="604" y2="208" stroke="#cbd5e1"/>
  <text x="408" y="238" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14">정확히 2개:</text>
  <text x="408" y="268" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="15" font-weight="700" fill="#1d4ed8">a&lt;m&lt;b, ab=1/2 → ①</text>
</svg>
