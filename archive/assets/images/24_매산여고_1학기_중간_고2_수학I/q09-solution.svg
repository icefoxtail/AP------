<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" role="img" aria-label="삼각부등식의 해"><style>text{font-family:"Noto Sans KR","Malgun Gothic",sans-serif;fill:#111827;font-size:17px}.title{font-weight:700;font-size:22px}.axis{stroke:#334155;stroke-width:2}.guide{stroke:#94a3b8;stroke-width:1.5;stroke-dasharray:6 5}.curve{fill:none;stroke:#2563eb;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.curve2{fill:none;stroke:#ea580c;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.accent{stroke:#16a34a;stroke-width:9;stroke-linecap:round}.dot{fill:#dc2626;stroke:white;stroke-width:2}.panel{fill:#f8fafc;stroke:#cbd5e1;stroke-width:1.5}.small{font-size:14px}.math{font-family:"STIX Two Math","Cambria Math","Times New Roman",serif}</style><rect width="100%" height="100%" fill="#fff"/><text x="28" y="34" class="title">삼각부등식의 해</text><line x1="120" y1="210" x2="680" y2="210" class="axis"/><line x1="240" y1="210" x2="570" y2="210" class="accent"/><circle cx="240" cy="210" r="9" fill="#fff" stroke="#dc2626" stroke-width="3"/><circle cx="570" cy="210" r="9" class="dot"/><text x="208" y="250" class="math">π/4</text><text x="530" y="250" class="math">2π/3</text><text x="222" y="184">열림</text><text x="550" y="184">포함</text><text x="350" y="145" fill="#15803d">π/4 &lt; x ≤ 2π/3</text></svg>