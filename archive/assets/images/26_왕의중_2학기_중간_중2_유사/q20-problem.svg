<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 560" width="420" height="560" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">직사각형 ABCD의 변 DC 위에 점 F가 있고, 선분 AF의 연장선과 변 BC의 연장선이 만나는 점이 E로 표시되어 있다. 직사각형 ABCD의 넓이는 150제곱센티미터로 주어져 있다.</title><desc id="visual-desc">직사각형 ABCD가 있고 변 DC 위에 점 F가 찍혀 있다. 점 A에서 F를 지나 아래로 뻗은 선과 점 C에서 아래로 뻗은 변 BC의 연장선이 점 E에서 만난다. 직사각형의 네 꼭짓점에 직각 표시가 있고 직사각형 안에 넓이 150이 적혀 있다.</desc><rect width="420" height="560" fill="#fff"/><g data-layer="10"><path id="rABCD" data-role="region" stroke="none" stroke-width="1.6" fill="#e4e7ec" data-owner-points="A B C D" data-mark="region" data-mark-id="rABCD" fill-rule="evenodd" d="M77.142857143 58.571428571 L342.857142857 58.571428571 L342.857142857 235.714285714 L77.142857143 235.714285714 L77.142857143 58.571428571 Z"/></g><g data-layer="30"><line id="sAB" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="77.142857143" y1="58.571428571" x2="342.857142857" y2="58.571428571"/></g><g data-layer="30"><line id="sBC" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="342.857142857" y1="58.571428571" x2="342.857142857" y2="235.714285714"/></g><g data-layer="30"><line id="sCD" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="77.142857143" y1="235.714285714" x2="342.857142857" y2="235.714285714"/></g><g data-layer="30"><line id="sDA" da