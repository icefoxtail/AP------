<line x1="58" y1="370" x2="58" y2="380" class="tick"/>
<text x="58" y="400" class="small" text-anchor="middle">0</text>
<line x1="84" y1="123" x2="84" y2="375" class="line"/>
<line x1="84" y1="370" x2="84" y2="380" class="tick"/>
<text x="84" y="400" class="small" text-anchor="middle">1</text>
<line x1="110" y1="123" x2="110" y2="375" class="line"/>
<line x1="110" y1="370" x2="110" y2="380" class="tick"/>
<text x="110" y="400" class="small" text-anchor="middle">2</text>
<line x1="162" y1="123" x2="162" y2="375" class="line"/>
<line x1="162" y1="370" x2="162" y2="380" class="tick"/>
<text x="162" y="400" class="small" text-anchor="middle">4</text>
<line x1="474" y1="123" x2="474" y2="375" class="line"/>
<line x1="474" y1="370" x2="474" y2="380" class="tick"/>
<text x="474" y="400" class="small" text-anchor="middle">16</text>
<line x1="58" y1="249" x2="474" y2="249" class="line"/>
<text x="42" y="254" class="small" text-anchor="end">2</text>
<line x1="58" y1="123" x2="474" y2="123" class="line"/>
<text x="42" y="128" class="small" text-anchor="end">4</text>
<rect x="110" y="123" width="364" height="252" fill="#d8eafa" fill-opacity="0.72" stroke="#2268a5" stroke-width="2.5"/>
<rect x="84" y="249" width="78" height="126" fill="#fff1db" fill-opacity="0.75" stroke="#d18b19" stroke-width="2.5"/>
<rect x="110" y="249" width="52" height="126" fill="#5cba96" fill-opacity="0.82" stroke="#167954" stroke-width="2.5"/>
