<line x1="938" y1="123" x2="938" y2="375" class="line"/>
<line x1="938" y1="370" x2="938" y2="380" class="tick"/>
<text x="938" y="400" class="small" text-anchor="middle">4</text>
<line x1="1023" y1="123" x2="1023" y2="375" class="line"/>
<line x1="1023" y1="370" x2="1023" y2="380" class="tick"/>
<text x="1023" y="400" class="small" text-anchor="middle">5</text>
<line x1="598" y1="249" x2="1023" y2="249" class="line"/>
<text x="582" y="254" class="small" text-anchor="end">2</text>
<line x1="598" y1="123" x2="1023" y2="123" class="line"/>
<text x="582" y="128" class="small" text-anchor="end">4</text>
<rect x="768" y="123" width="255" height="252" fill="#d8eafa" fill-opacity="0.72" stroke="#2268a5" stroke-width="2.5"/>
<rect x="683" y="249" width="255" height="126" fill="#fff1db" fill-opacity="0.75" stroke="#d18b19" stroke-width="2.5"/>
<rect x="768" y="249" width="170" height="126" fill="#5cba96" fill-opacity="0.82" stroke="#167954" stroke-width="2.5"/>
<text x="853" y="318" text-anchor="middle" class="small" font-weight="700">공통</text>
<text x="895.5" y="186" text-anchor="middle" class="small">Q: 높이 4</text>
<text x="721.25" y="293.1" text-anchor="middle" class="small">P</text>
<text x="1045" y="380" class="small">x</text>
<text x="595" y="93" class="small">y</text>
<rect x="55" y="430" width="18" height="14" fill="#fff1db" stroke="#d18b19"/><text x="82" y="442" class="small">P: x=1~4, 높이 2, 넓이 6</text>
<rect x="398" y="430" width="18" height="14" fill="#d8eafa" stroke="#2268a5"/><text x="426" y="442" class="small">Q: x=2~16, 높이 4, 넓이 56</text>
<rect x="760" y="430" width="18" height="14" fill="#5cba96" stroke="#167954"/><text x="788" y="442" class="small">공통: (4−2)×2=4</text>
</svg>