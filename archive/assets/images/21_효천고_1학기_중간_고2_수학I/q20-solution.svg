<line x1="598" y1="381" x2="598" y2="101" class="axis"/>
<line x1="598" y1="123" x2="598" y2="375" class="line"/>
<line x1="598" y1="370" x2="598" y2="380" class="tick"/>
<text x="598" y="400" class="small" text-anchor="middle">0</text>
<line x1="683" y1="123" x2="683" y2="375" class="line"/>
<line x1="683" y1="370" x2="683" y2="380" class="tick"/>
