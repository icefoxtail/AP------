<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="490" viewBox="0 0 1100 490" role="img" aria-labelledby="title desc">
<title id="title">두 직사각형과 공통 영역의 좌표 해설</title>
<desc id="desc">n=4일 때 첫 직사각형은 x=1부터4, 높이2, 넓이6이다. 두 번째 직사각형은 x=2부터16, 높이4, 넓이56이다. 공통 영역은 x=2부터4, 높이2, 넓이4이다. 오른쪽에는 공통 부분을 확대한 좌표도가 있다.</desc>
<rect x="0" y="0" width="1100" height="490" fill="#ffffff"/>
<style>text{font-family:"Noto Sans CJK KR","Noto Sans",sans-serif;fill:#243145} .title{font-size:23px;font-weight:700} .sub{font-size:17px;font-weight:650} .small{font-size:15px} .axis{stroke:#344054;stroke-width:2} .tick{stroke:#667085;stroke-width:1.2} .line{stroke:#98a2b3;stroke-dasharray:4 5;stroke-width:1} </style>
<text x="50" y="43" class="title">서술형 2 · n = 4에서 겹치는 두 직사각형</text>
<text x="50" y="78" class="sub">전체 좌표: 넓이 6과 56의 차를 계산</text>
<text x="590" y="78" class="sub">왼쪽 부분 확대: 공통 영역의 넓이 4</text>
