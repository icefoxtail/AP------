<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 250" width="480" height="250" role="img" aria-labelledby="q03-title q03-desc">
  <title id="q03-title">식의 덧셈 피라미드</title>
  <desc id="q03-desc">위 칸의 식이 바로 아래 두 칸의 식의 합과 같은 다항식 피라미드</desc>
  <rect width="480" height="250" fill="#ffffff"/>
  
  <!-- Blocks -->
  <g stroke="#222222" stroke-width="2" fill="#ffffff">
    <!-- Top block (A) -->
    <rect x="190" y="20" width="100" height="50" rx="4"/>
    
    <!-- Middle row: Left (5), Right (B) -->
    <rect x="135" y="85" width="100" height="50" rx="4"/>
    <rect x="245" y="85" width="100" height="50" rx="4"/>
    
    <!-- Bottom row: Left (x+4), Center (-x+1), Right (x-2) -->
    <rect x="80" y="150" width="100" height="50" rx="4"/>
    <rect x="190" y="150" width="100" height="50" rx="4"/>
    <rect x="300" y="150" width="100" height="50" rx="4"/>
  </g>
  
  <!-- Labels -->
  <g font-family="sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#111111">
    <!-- Top -->
    <text x="240" y="52" font-style="italic">A</text>
    
    <!-- Middle -->
    <text x="185" y="117">5</text>
    <text x="295" y="117" font-style="italic">B</text>
    
    <!-- Bottom -->
    <text x="130" y="182">x + 4</text>
    <text x="240" y="182">-x + 1</text>
    <text x="350" y="182">x - 2</text>
  </g>
</svg>
