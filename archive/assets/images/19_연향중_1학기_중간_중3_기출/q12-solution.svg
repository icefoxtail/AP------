<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 710 434" width="710" height="434" role="img" aria-labelledby="title desc"><title id="title">가로와 세로의 비가 주어진 카드</title><desc id="desc">옅은 파랑 카드의 가로는 √112 cm이다. 가로와 세로의 비는 √7 대 1이라고 아래에 표시했다.</desc><rect width="710" height="434" fill="white" /><polygon points="124.0000,63.0000 549.9660,63.0000 549.9660,224.0000 124.0000,224.0000" fill="none" /><line x1="124.0000" y1="63.0000" x2="549.9660" y2="63.0000" stroke="#205d9c" stroke-width="4.25" stroke-linecap="round" /><line x1="549.9660" y1="63.0000" x2="549.9660" y2="224.0000" stroke="#205d9c" stroke-width="4.25" stroke-linecap="round" /><line x1="549.9660" y1="224.0000" x2="124.0000" y2="224.0000" stroke="#205d9c" stroke-width="4.25" stroke-linecap="round" /><line x1="124.0000" y1="224.0000" x2="124.0000" y2="63.0000" stroke="#205d9c" stroke-width="4.25" stroke-linecap="round" /><line x1="124.0000" y1="247.0000" x2="549.9660" y2="247.0000" stroke="#205d9c" stroke-width="1.65" stroke-linecap="round" /><line x1="124.0000" y1="242.0000" x2="124.0000" y2="252.0000" stroke="#205d9c" stroke-width="1.65" stroke-linecap="round" /><line x1="549.9660" y1="242.0000" x2="549.9660" y2="252.0000" stroke="#205d9c" stroke-width="1.65" stroke-linecap="round" /><text x="336.9830" y="279.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#205d9c" text-anchor="middle">√112 cm</text><text x="336.9830" y="350.0000" font-size="30" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">가로 : 세로  =  √7 : 1</text></svg>
