<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 705" width="720" height="705" role="img" aria-labelledby="title desc"><title id="title">왼쪽 점을 함께 지나는 세 원과 색칠된 부분</title><desc id="desc">둘레에서 가운데 지름은 12 cm이다. 큰 지름과 작은 지름을 아래 두 치수선으로 나누고 차이에 해당하는 주황 영역을 표시했다.</desc><rect width="720" height="705" fill="white" /><circle cx="343.5" cy="270" r="232.5" fill="#fae6ce" stroke="#aa5411" stroke-width="4.6" /><circle cx="297.0" cy="270" r="186.0" fill="none" stroke="#266f73" stroke-width="2.8" stroke-dasharray="10 6" /><circle cx="250.5" cy="270" r="139.5" fill="#f6faff" stroke="#205d9c" stroke-width="4.2" /><line x1="111.0000" y1="270.0000" x2="576.0000" y2="270.0000" stroke="#586574" stroke-width="2.3" stroke-linecap="round" /><circle cx="111" cy="270" r="5" fill="#28364b" /><text x="93.0000" y="277.0000" font-size="30" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">A</text><circle cx="390" cy="270" r="5" fill="#28364b" /><text x="379.0000" y="297.0000" font-size="30" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">C</text><circle cx="483" cy="270" r="5" fill="#28364b" /><text x="487.0000" y="298.0000" font-size="30" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">D</text><circle cx="576" cy="270" r="5" fill="#28364b" /><text x="596.0000" y="277.0000" font-size="30" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">B</text><line x1="436.5000" y1="262.0000" x2="436.5000" y2="278.0000" stroke="#277339" stroke-width="2.65" stroke-linecap="round" /><line x1="529.5000" y1="262.0000" x2="529.5000" y2="278.0000" stroke="#277339" stroke-width="2.65" stroke-linecap="round" /><text x="436.5000" y="251.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#277339" text-anchor="middle">a cm</text><text x="270.0000" y="325.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#266f73" text-anchor="middle">AD = 12 cm</text><line x1="111.0000" y1="546.0000" x2="390.0000" y2="546.0000" stroke="#205d9c" stroke-width="1.65" stroke-linecap="round" /><line x1="111.0000" y1="541.0000" x2="111.0000" y2="551.0000" stroke="#205d9c" stroke-width="1.65" stroke-linecap="round" /><line x1="390.0000" y1="541.0000" x2="390.0000" y2="551.0000" stroke="#205d9c" stroke-width="1.65" stroke-linecap="round" /><text x="250.5000" y="578.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#205d9c" text-anchor="middle">12−a</text><line x1="111.0000" y1="613.0000" x2="576.0000" y2="613.0000" stroke="#aa5411" stroke-width="1.65" stroke-linecap="round" /><line x1="111.0000" y1="608.0000" x2="111.0000" y2="618.0000" stroke="#aa5411" stroke-width="1.65" stroke-linecap="round" /><line x1="576.0000" y1="608.0000" x2="576.0000" y2="618.0000" stroke="#aa5411" stroke-width="1.65" stroke-linecap="round" /><text x="343.5000" y="645.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#aa5411" text-anchor="middle">12+a</text></svg>
