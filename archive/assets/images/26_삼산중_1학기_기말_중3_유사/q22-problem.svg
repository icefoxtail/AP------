<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 600" width="700" height="600" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">가로의 길이가 x, 세로의 길이가 x+4인 직사각형 종이의 네 귀퉁이에서 한 변의 길이가 3인 정사각형을 잘라낼 부분을 나타낸 것이다. 안쪽의 점선은 상자를 만들기 위해 접을 선을 나타낸다.</title><desc id="visual-desc">직사각형 종이의 네 모서리에 한 변의 길이가 3인 작은 정사각형이 있고, 종이 안쪽에는 직사각형 모양의 점선 접기 선이 있다. 가로 아래에는 x, 세로 왼쪽에는 x+4가 표시되어 있다.</desc><rect width="700" height="600" fill="#fff"/><g data-layer="30"><line id="sAB" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="175.587086702" y1="525.007168257" x2="524.412913298" y2="525.007168257"/></g><g data-layer="30"><line id="sBC" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="524.412913298" y1="525.007168257" x2="524.412913298" y2="59.906066128"/></g><g data-layer="30"><line id="sCD" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="524.412913298" y1="59.906066128" x2="175.587086702" y2="59.906066128"/></g><g data-layer="30"><line id="sDA" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="175.587086702" y1="59.906066128" x2="175.587086702" y2="525.007168257"/></g><g data-layer="30"><line id="sCutA1" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="262.793543351" y1="525.007168257" x2="262.793543351" y2="437.800711608"/></g><g data-layer="30"><line id="sCutA2" data-role="l