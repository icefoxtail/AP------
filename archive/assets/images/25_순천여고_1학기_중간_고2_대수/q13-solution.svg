<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 604" width="512" height="604" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="UNEQUAL_UNIT_DECLARED" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">S는 반지름 r에 따른 부채꼴의 넓이이다. 둘레가 20이면 호의 길이는 20−2r이므로 S=(1/2)r(20−2r)=−(r−5)²+25이다. 그래프의 꼭짓점 V(5, 25)에서 최대이므로 a=25이고, 이때 호의 길이는 10이어서 중심각 b=10/5=2이다. 따라서 a+b=27이고 답은 ⑤이다.</title><desc id="visual-desc">r가 0에서 10 사이일 때 위로 볼록한 포물선 S가 그려져 있고 꼭짓점 V의 좌표가 표시되어 있다.</desc><rect width="512" height="604" fill="#fff"/><g data-layer="30"><line id="x-axis" data-role="axis" stroke="#111" stroke-width="1.2" fill="none" data-axis="x" x1="32" y1="532" x2="480" y2="532"/></g><g data-layer="30"><line id="y-axis" data-role="axis" stroke="#111" stroke-width="1.2" fill="none" data-axis="y" x1="72" y1="572" x2="72" y2="32"/></g><g data-layer="40"><polyline id="f-piece-1-branch-0" data-role="curve" stroke="#111" stroke-width="2.1" fill="none" data-branch="PIECE_1" points="72,532 73.230769231,525.866735271 74.461538462,519.774633393 75.692307692,513.723694366 76.923076923,507.713918189 78.153846154,501.745304862 79.384615385,495.817854386 80.615384615,489.931566761 81.846153846,484.086441986 83.076923077,478.282480062 84.307692308,472.519680988 85.538461538,466.798044765 86.769230769,461.117571392 88,455.47826087 89.230769231,449.880113198 90.461538462,444.323128377 91.692307692,438.807306406 92.923076923,433.332647286 94.15