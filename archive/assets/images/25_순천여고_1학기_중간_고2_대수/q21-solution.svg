<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 558" width="512" height="558" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="UNEQUAL_UNIT_DECLARED" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">t=2ˣ으로 두면 x≤2에서 0&lt;t≤4이고 y=t²−2t−8=(t−1)²−9이다. 그래프는 꼭짓점 V(1, −9)에서 최소이고, 구간 끝점 B(4, 0)에서 최대이다. t=1이면 x=0, t=4이면 x=2이므로 a=2, b=0, M=0, m=−9이다. 따라서 답은 a=2, b=0, M=0, m=−9이다.</title><desc id="visual-desc">t가 0보다 크고 4 이하인 구간에서 아래로 볼록한 포물선이 그려져 있고, 꼭짓점 V와 오른쪽 끝점 B의 좌표가 표시되어 있다.</desc><rect width="512" height="558" fill="#fff"/><g data-layer="30"><line id="x-axis" data-role="axis" stroke="#111" stroke-width="1.2" fill="none" data-axis="x" x1="32" y1="72" x2="480" y2="72"/></g><g data-layer="30"><line id="y-axis" data-role="axis" stroke="#111" stroke-width="1.2" fill="none" data-axis="y" x1="72" y1="526" x2="72" y2="32"/></g><g data-layer="40"><polyline id="f-piece-1-branch-0" data-role="curve" stroke="#111" stroke-width="2.1" fill="none" data-branch="PIECE_1" points="72,440 73.230769231,441.222536661 74.461538462,442.428608181 75.692307692,443.618214561 76.923076923,444.791355801 78.153846154,445.948031901 79.384615385,447.088242861 80.615384615,448.21198868 81.846153846,449.319269359 83.076923077,450.410084898 84.307692308,451.484435297 85.538461538,452.542320556 86.769230769,453.583740674 88,454.608695652 89.230769231,455.61718549 90.461538462,456.609210188 91.692307692,457.584769745 92.923076923