<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="title desc"><title id="title">집합 해설 보강 · 문항 6</title><desc id="desc">집합 항등식의 각 표시와 적용 법칙</desc><rect width="720" height="300" rx="18" fill="#f8fafc"/><text x="32" y="38" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#0f172a">집합 해설 보강 · 문항 6</text><text x="32" y="68" font-family="Arial,sans-serif" font-size="14" fill="#475569">항등식 변형과 연산법칙</text><rect x="32" y="88" width="656" height="156" rx="12" fill="#fff" stroke="#cbd5e1"/><text x="62" y="128" font-family="Arial,sans-serif" font-size="15" fill="#334155">㉠  (B∩Aᶜ)ᶜ=Bᶜ∪A  → 드모르간</text><text x="62" y="166" font-family="Arial,sans-serif" font-size="15" fill="#334155">㉡  Bᶜ∪A=A∪Bᶜ  → 교환</text><text x="62" y="204" font-family="Arial,sans-serif" font-size="15" fill="#334155">㉢  (A∪B)∩(A∪Bᶜ)=A∪(B∩Bᶜ)  → 분배</text><text x="32" y="274" font-family="Arial,sans-serif" font-size="13" fill="#64748b">원문 증명 그림의 세 표시와 해설을 직접 대응시킨다.</text></svg>
