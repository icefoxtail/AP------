<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" role="img" aria-labelledby="title desc"><title id="title">그림의 진리집합 포함</title><desc id="desc">Q가 P 안에 완전히 포함되어 있다.</desc><style>text{font-family:"Noto Sans KR","Malgun Gothic",Arial,sans-serif;fill:#172033}.math{font-family:Georgia,serif}</style><rect width="760" height="430" fill="#f8fafc"/><text x="28" y="38" font-size="22" font-weight="700">그림의 진리집합 포함</text><rect x="36" y="96" width="320" height="250" rx="14" fill="#fff" stroke="#94a3b8"/><circle cx="196" cy="220" r="100" fill="#bfdbfe" fill-opacity=".6" stroke="#2563eb" stroke-width="3"/><text x="196" y="140" text-anchor="middle" font-size="18" font-weight="700">P</text><circle cx="196" cy="220" r="46" fill="#fed7aa" stroke="#ea580c" stroke-width="3"/><text x="196" y="226" text-anchor="middle" font-size="18" font-weight="700">Q</text><rect x="390" y="96" width="334" height="250" rx="14" fill="#fff" stroke="#cbd5e1"/><text x="412" y="170" class="math" font-size="21">Q⊆P</text><text x="412" y="215" class="math" font-size="21">Pᶜ∩Q=∅</text><text x="412" y="260" class="math" font-size="21">q→p</text><text x="412" y="305" font-size="17">q는 p의 충분조건</text></svg>
