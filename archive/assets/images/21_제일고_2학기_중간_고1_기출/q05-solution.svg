<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="title desc"><title id="title">집합 해설 보강 · 문항 5</title><desc id="desc">2와 3은 금지되고 4 또는 5 중 하나 이상을 포함하는 조건</desc><rect width="720" height="300" rx="18" fill="#f8fafc"/><text x="32" y="38" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#0f172a">집합 해설 보강 · 문항 5</text><text x="32" y="68" font-family="Arial,sans-serif" font-size="14" fill="#475569">금지·강제 조건과 여사건</text><rect x="32" y="88" width="656" height="156" rx="12" fill="#fff" stroke="#cbd5e1"/><rect x="88" y="123" width="100" height="56" rx="10" fill="#fee2e2" stroke="#ef4444"/><text x="138" y="157" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#b91c1c">2,3 금지</text><rect x="230" y="123" width="115" height="56" rx="10" fill="#dcfce7" stroke="#16a34a"/><text x="287" y="157" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#15803d">4 또는 5</text><text x="373" y="157" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#334155">→</text><rect x="420" y="123" width="180" height="56" rx="10" fill="#dbeafe" stroke="#2563eb"/><text x="510" y="157" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#1d4ed8">2⁷-2⁵=96</text><text x="72" y="216" font-family="Arial,sans-serif" font-size="15" fill="#334155">선택 가능 원소: 1,4,5,6,7,8,9</text><text x="32" y="274" font-family="Arial,sans-serif" font-size="13" fill="#64748b">4와 5를 모두 제외한 경우를 여사건으로 뺀다.</text></svg>
