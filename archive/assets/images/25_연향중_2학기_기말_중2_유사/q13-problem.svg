<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 480" width="420" height="480" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">네 영역 A, B, C, D로 나누어진 도형이다. B와 C는 이웃하고, A와 D는 각각 B, C와 이웃하지만 A와 D는 서로 이웃하지 않는다.</title><desc id="visual-desc">세로로 세 줄로 나뉜 직사각형 도형으로, 아래 영역이 A, 가운데 줄이 좌우로 B와 C, 위 영역이 D이며 각 영역에 알파벳 이름이 적혀 있다.</desc><rect width="420" height="480" fill="#fff"/><g data-layer="10"><path id="rA" data-role="region" stroke="none" stroke-width="1.6" fill="#e4e7ec" data-owner-points="q00 q02 q40 q42" data-mark="region" data-mark-id="rA" fill-rule="evenodd" d="M86.19047619 425.714285714 L333.80952381 425.714285714 L333.80952381 301.904761905 L86.19047619 301.904761905 L86.19047619 425.714285714 Z"/></g><g data-layer="10"><path id="rB" data-role="region" stroke="none" stroke-width="1.6" fill="#e4e7ec" data-owner-points="q02 q04 q22 q24" data-mark="region" data-mark-id="rB" fill-rule="evenodd" d="M86.19047619 301.904761905 L210 301.904761905 L210 178.095238095 L86.19047619 178.095238095 L86.19047619 301.904761905 Z"/></g><g data-layer="10"><path id="rC" data-role="region" stroke="none" stroke-width="1.6" fill="#e4e7ec" data-owner-points="q22 q24 q42 q44" data-mark="region" data-mark-id="rC" fill-rule="evenodd" d="M210 301.904761905 L333.80952381 301.904761905 L333.80952381 178.095238095 L210 178.095238095 L210 301.904761905 Z"/></g><g