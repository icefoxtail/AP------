<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 524" width="730" height="524" role="img" aria-labelledby="title desc"><title id="title">밑변과 넓이가 주어진 삼각형</title><desc id="desc">삼각형 안에 넓이 6x²y³−3x²y²가 쓰여 있다. 아래쪽 밑변의 길이는 세로 분수 3/2와 x²y의 곱이다.</desc><rect width="730" height="524" fill="white" /><line x1="365.0000" y1="78.0000" x2="107.0000" y2="386.0000" stroke="#21639a" stroke-width="5.5" stroke-linecap="round" /><line x1="107.0000" y1="386.0000" x2="623.0000" y2="386.0000" stroke="#227365" stroke-width="5.5" stroke-linecap="round" /><line x1="623.0000" y1="386.0000" x2="365.0000" y2="78.0000" stroke="#21639a" stroke-width="5.5" stroke-linecap="round" /><text x="365.0000" y="308.0000" font-size="36" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#293b4b" text-anchor="middle">6x²y³ − 3x²y²</text><line x1="107.0000" y1="428.0000" x2="623.0000" y2="428.0000" stroke="#227365" stroke-width="2" stroke-linecap="round" /><line x1="107.0000" y1="421.0000" x2="107.0000" y2="435.0000" stroke="#227365" stroke-width="2" stroke-linecap="round" /><line x1="623.0000" y1="421.0000" x2="623.0000" y2="435.0000" stroke="#227365" stroke-width="2" stroke-linecap="round" /><text x="330.0000" y="469.0000" font-size="32" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#227365" text-anchor="middle">3</text><line x1="314.0000" y1="477.0000" x2="347.0000" y2="477.0000" stroke="#227365" stroke-width="2" stroke-linecap="round" /><text x="330.0000" y="505.0000" font-size="32" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#227365" text-anchor="middle">2</text><text x="385.0000" y="490.0000" font-size="35" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#227365" text-anchor="middle">x²y</text></svg>
