<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 755 650" width="755" height="650" role="img" aria-labelledby="title desc"><title id="title">접는 선 AE와 색칠한 삼각형 AEF</title><desc id="desc">가로가 2b이고 세로가 3a인 직사각형이다. 오른쪽 변 위 E와 A를 접는 선으로 그렸다. 접혀서 D가 옮겨지는 F를 표시하고 삼각형 AEF만 청록으로 칠했다. CE는 2/3 b이다.</desc><rect width="755" height="650" fill="white" /><polygon points="119.5000,134.0000 599.5000,358.0000 427.8212,518.0000" fill="#e2f1ea" /><line x1="119.5000" y1="134.0000" x2="119.5000" y2="518.0000" stroke="#21639a" stroke-width="4.7" stroke-linecap="round" /><line x1="119.5000" y1="518.0000" x2="599.5000" y2="518.0000" stroke="#21639a" stroke-width="4.7" stroke-linecap="round" /><line x1="599.5000" y1="518.0000" x2="599.5000" y2="134.0000" stroke="#21639a" stroke-width="4.7" stroke-linecap="round" /><line x1="599.5000" y1="134.0000" x2="119.5000" y2="134.0000" stroke="#21639a" stroke-width="4.7" stroke-linecap="round" /><line x1="119.5000" y1="134.0000" x2="599.5000" y2="358.0000" stroke="#774698" stroke-width="5.3" stroke-linecap="round" stroke-dasharray="12 7" /><line x1="119.5000" y1="134.0000" x2="427.8212" y2="518.0000" stroke="#227365" stroke-width="5.3" stroke-linecap="round" /><line x1="599.5000" y1="358.0000" x2="427.8212" y2="518.0000" stroke="#227365" stroke-width="5.3" stroke-linecap="round" /><line x1="119.5000" y1="100.0000" x2="599.5000" y2="100.0000" stroke="#21639a" stroke-width="1.7" stroke-linecap="round" /><line x1="119.5000" y1="94.5000" x2="119.5000" y2="105.5000" stroke="#21639a" stroke-width="1.7" stroke-linecap="round" /><line x1="599.5000" y1="94.5000" x2="599.5000" y2="105.5000" stroke="#21639a" stroke-width="1.7" stroke-linecap="round" /><text x="359.5000" y="79.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#21639a" text-anchor="middle">2b</text><line x1="87.5000" y1="518.0000" x2="87.5000" y2="134.0000" stroke="#21639a" stroke-width="1.7" stroke-linecap="round" /><line x1="82.0000" y1="518.0000