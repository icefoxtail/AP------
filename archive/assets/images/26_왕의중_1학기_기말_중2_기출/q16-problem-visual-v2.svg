<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 674 476" width="674" height="476" role="img" aria-labelledby="title desc"><title id="title">세로축의 아래쪽을 지나는 오름직선</title><desc id="desc">파란 직선은 오른쪽으로 갈수록 높아진다. 세로축은 원점 아래에서, 가로축은 원점 오른쪽에서 만난다.</desc><rect width="674" height="476" fill="white" /><line x1="63.0000" y1="176.8199" x2="603.0000" y2="176.8199" stroke="#586574" stroke-width="2.05" stroke-linecap="round" /><polygon points="616.0000,176.8199 603.0000,171.6199 603.0000,182.0199" fill="#586574" /><line x1="250.8782" y1="418.0000" x2="250.8782" y2="78.0000" stroke="#586574" stroke-width="2.05" stroke-linecap="round" /><polygon points="250.8782,65.0000 245.6782,78.0000 256.0782,78.0000" fill="#586574" /><text x="632.000" y="163.820" fill="#586574" font-size="29" font-weight="600" font-family="Malgun Gothic, Cambria Math, sans-serif" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="4.0" stroke-linejoin="round">x</text><text x="269.878" y="60.000" fill="#586574" font-size="29" font-weight="600" font-family="Malgun Gothic, Cambria Math, sans-serif" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="4.0" stroke-linejoin="round">y</text><text x="228.878" y="203.820" fill="#586574" font-size="29" font-weight="600" font-family="Malgun Gothic, Cambria Math, sans-serif" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="4.0" stroke-linejoin="round">O</text><line x1="63.0000" y1="409.2298" x2="616.0000" y2="67.1925" stroke="#205d9c" stroke-width="7.4" stroke-linecap="round" /></svg>
