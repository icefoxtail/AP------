<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 340" role="img" aria-labelledby="title desc">
  <title id="title">반사한 점에서 원까지의 최단거리</title>
  <desc id="desc">A를 x축에 대칭이동한 A'에서 원의 가장 가까운 점 Q까지의 선분이 x축을 P에서 만나므로 AP+PQ가 최소가 된다.</desc>
  <rect width="450" height="340" fill="#ffffff"/>
  <text x="18" y="28" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="20" font-weight="700" fill="#1e3a5f"></text>
  <line x1="35" y1="160" x2="420" y2="160" stroke="#111827" stroke-width="1.5"/>
  <path d="M420 160 l-9 -5 v10 z" fill="#111827"/>
  <text x="424" y="166" font-family="Arial, sans-serif" font-size="16">x</text>
  <circle cx="294" cy="288" r="45.3" fill="#fff7ed" stroke="#d97706" stroke-width="2.5"/>
  <line x1="70" y1="64" x2="262" y2="256" stroke="#0f766e" stroke-width="3" stroke-dasharray="7 5"/>
  <line x1="70" y1="256" x2="166" y2="160" stroke="#2563eb" stroke-width="3"/>
  <line x1="166" y1="160" x2="262" y2="256" stroke="#2563eb" stroke-width="3"/>
  <circle cx="70" cy="64" r="5" fill="#0f766e"/><circle cx="70" cy="256" r="5" fill="#2563eb"/>
  <circle cx="166" cy="160" r="5" fill="#7c3aed"/><circle cx="262" cy="256" r="5" fill="#dc2626"/><circle cx="294" cy="288" r="4" fill="#b45309"/>
  <text x="47" y="55" font-family="Arial, sans-serif" font-size="17" font-weight="700">A′</text>
  <text x="45" y="281" font-family="Arial, sans-serif" font-size="17" font-weight="700">A</text>
  <text x="158" y="151" font-family="Arial, sans-serif" font-size="17" font-weight="700">P</text>
  <text x="267" y="254" font-family="Arial, sans-serif" font-size="17" font-weight="700">Q</text>
  <text x="301" y="295" font-family="Arial, sans-serif" font-size="16">C(7,−4)</text>
  <text x="18" y="325" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="16" fill="#334155">A′Q = AP + PQ = 6√2</text>
</svg>
