<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 330" role="img" aria-labelledby="title desc">
  <title id="title">원의 두 현과 중심에서 현까지의 거리</title>
  <desc id="desc">중심 O인 원에서 x+y=1과 x+y=7에 해당하는 평행한 두 현은 중심에서 같은 거리만큼 떨어져 있어 길이가 같다.</desc>
  <rect width="460" height="330" fill="#ffffff"/>
  <text x="18" y="28" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="20" font-weight="700" fill="#1e3a5f"></text>
  <circle cx="180" cy="165" r="96" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/>
  <line x1="84" y1="171" x2="174" y2="261" stroke="#0f766e" stroke-width="4"/>
  <line x1="186" y1="69" x2="276" y2="159" stroke="#d97706" stroke-width="4"/>
  <circle cx="180" cy="165" r="4.5" fill="#1d4ed8"/>
  <line x1="180" y1="165" x2="129" y2="216" stroke="#475569" stroke-width="2" stroke-dasharray="5 4"/>
  <line x1="180" y1="165" x2="231" y2="114" stroke="#475569" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="187" y="160" font-family="Arial, sans-serif" font-size="17" font-weight="700">O(2,2)</text>
  <text x="87" y="194" font-family="Arial, sans-serif" font-size="16" fill="#0f766e">k=1</text>
  <text x="242" y="115" font-family="Arial, sans-serif" font-size="16" fill="#b45309">k=7</text>
  <text x="22" y="300" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="16" fill="#334155">AB = √14     d = 3/√2</text>
</svg>
