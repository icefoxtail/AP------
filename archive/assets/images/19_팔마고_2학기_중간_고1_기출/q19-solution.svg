<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 360" role="img" aria-labelledby="title desc">
  <title id="title">원에 접하는 두 평행선</title>
  <desc id="desc">중심 C, 반지름 2인 원에 서로 반대쪽에서 접하는 두 평행선과 접점 T₁, T₂를 표시한다.</desc>
  <rect width="430" height="360" fill="#ffffff"/>
  <text x="18" y="28" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="20" font-weight="700" fill="#1e3a5f"></text>
  <circle cx="180" cy="160" r="60" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/>
  <line x1="60" y1="325" x2="330" y2="122" stroke="#0f766e" stroke-width="2.5"/>
  <line x1="60" y1="175" x2="280" y2="10" stroke="#d97706" stroke-width="2.5"/>
  <line x1="180" y1="160" x2="216" y2="208" stroke="#475569" stroke-width="2" stroke-dasharray="5 4"/>
  <line x1="180" y1="160" x2="144" y2="112" stroke="#475569" stroke-width="2" stroke-dasharray="5 4"/>
  <circle cx="180" cy="160" r="4.5" fill="#1d4ed8"/><circle cx="216" cy="208" r="5" fill="#0f766e"/><circle cx="144" cy="112" r="5" fill="#d97706"/>
  <text x="185" y="154" font-family="Arial, sans-serif" font-size="17" font-weight="700">C(−2,5)</text>
  <text x="112" y="110" font-family="Arial, sans-serif" font-size="16">T1</text><text x="223" y="211" font-family="Arial, sans-serif" font-size="16">T2</text>
  <text x="270" y="184" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="16" fill="#92400e">k=13/4</text>
  <text x="244" y="62" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="16" fill="#0f766e">k=33/4</text>
<text x="18" y="345" font-family="Arial, sans-serif" font-size="16">d(C,t)=2</text></svg>


