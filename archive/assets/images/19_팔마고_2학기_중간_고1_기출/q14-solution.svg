<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470" role="img" aria-labelledby="title desc">
  <title id="title">삼각형의 넓이가 최대가 되는 점</title>
  <desc id="desc">원 위의 점 P에서 현 AB까지의 거리가 최대인 경우를 보인다. 중심 C, 수선의 발 H, P는 한 직선 위에 있고 CP는 AB에 수직이다.</desc>
  <rect width="640" height="470" fill="#ffffff"/>
  <text x="24" y="34" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="22" font-weight="700" fill="#1e3a5f"></text>
  <circle cx="307" cy="244" r="170" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
  <line x1="72" y1="380" x2="560" y2="380" stroke="#111827" stroke-width="1.5"/>
  <line x1="205" y1="440" x2="205" y2="42" stroke="#111827" stroke-width="1.5"/>
  <path d="M560 380 l-9 -5 v10 z M205 42 l-5 9 h10 z" fill="#111827"/>
  <text x="568" y="386" font-family="Arial, sans-serif" font-size="17">x</text>
  <text x="210" y="43" font-family="Arial, sans-serif" font-size="17">y</text>
  <line x1="171" y1="346" x2="307" y2="414" stroke="#0f766e" stroke-width="3"/>
  <line x1="239" y1="380" x2="383" y2="92" stroke="#b45309" stroke-width="2.5" stroke-dasharray="8 6"/>
  <path d="M239 380 L250 385 L255 374" fill="none" stroke="#b45309" stroke-width="2"/>
  <circle cx="171" cy="346" r="5" fill="#0f766e"/><circle cx="307" cy="414" r="5" fill="#0f766e"/>
  <circle cx="307" cy="244" r="5" fill="#1d4ed8"/><circle cx="383" cy="92" r="6" fill="#dc2626"/><circle cx="239" cy="380" r="4" fill="#b45309"/>
  <text x="148" y="344" font-family="Arial, sans-serif" font-size="19" font-weight="700">A</text>
  <text x="312" y="432" font-family="Arial, sans-serif" font-size="19" font-weight="700">B</text>
  <text x="286" y="235" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#1d4ed8">C(3,4)</text>
  <text x="390" y="87" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#b91c1c">P</text>
  <text x="218" y="401" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#92400e">H</text>
  <text x="400" y="178" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="18" fill="#92400e"></text>
  <text x="400" y="204" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="16" fill="#334155">y = 2x − 2</text>
</svg>
