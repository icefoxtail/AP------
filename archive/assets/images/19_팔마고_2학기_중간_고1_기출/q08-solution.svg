<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 340" role="img" aria-labelledby="title desc">
  <title id="title">원을 넓이 이등분하는 직선</title>
  <desc id="desc">원은 중심 C를 지나가는 직선에 의해 두 부분으로 나뉜다. 이동한 직선은 중심 C를 지난다.</desc>
  <rect width="420" height="340" fill="#ffffff"/>
  <text x="18" y="28" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="20" font-weight="700" fill="#1e3a5f"></text>
  <circle cx="188" cy="110" r="71.6" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/>
  <line x1="35" y1="270" x2="390" y2="270" stroke="#111827" stroke-width="1.4"/>
  <line x1="220" y1="300" x2="220" y2="45" stroke="#111827" stroke-width="1.4"/>
  <line x1="92" y1="158" x2="348" y2="30" stroke="#0f766e" stroke-width="3"/>
  <circle cx="188" cy="110" r="5" fill="#1d4ed8"/>
  <text x="266" y="132" font-family="Arial, sans-serif" font-size="17" font-weight="700">C(−1,5)</text>
  <text x="302" y="78" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="16" fill="#0f766e">x−2y+11=0</text>
</svg>
