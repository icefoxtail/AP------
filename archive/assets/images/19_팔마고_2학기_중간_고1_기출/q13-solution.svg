<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 450" role="img" aria-labelledby="title desc">
  <title id="title">접선과 다른 원의 두 교점</title>
  <desc id="desc">원점 중심 반지름 3인 원의 점 P에서 그은 접선이 중심 C, 반지름 2인 원과 두 점에서 만나는 한 사례를 보인다.</desc>
  <rect width="460" height="450" fill="#ffffff"/>
  <text x="18" y="28" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="20" font-weight="700" fill="#1e3a5f"></text>
  <circle cx="200" cy="330" r="84" fill="#eff6ff" fill-opacity="0.85" stroke="#2563eb" stroke-width="2.5"/>
  <circle cx="200" cy="134" r="56" fill="#fff7ed" fill-opacity="0.8" stroke="#d97706" stroke-width="2.5"/>
  <line x1="133" y1="45" x2="323" y2="375" stroke="#0f766e" stroke-width="2.5"/>
  <line x1="200" y1="330" x2="273" y2="288" stroke="#475569" stroke-width="2" stroke-dasharray="5 4"/>
  <circle cx="200" cy="330" r="4" fill="#1d4ed8"/><circle cx="200" cy="134" r="4" fill="#b45309"/>
  <circle cx="273" cy="288" r="5" fill="#dc2626"/><circle cx="161" cy="94" r="4.5" fill="#0f766e"/><circle cx="215" cy="188" r="4.5" fill="#0f766e"/>
  <text x="209" y="325" font-family="Arial, sans-serif" font-size="16" font-weight="700">O(0,0)</text>
  <text x="208" y="129" font-family="Arial, sans-serif" font-size="16" font-weight="700">C(0,7)</text>
  <text x="278" y="286" font-family="Arial, sans-serif" font-size="16" font-weight="700">P</text>
  <text x="18" y="440" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="16" fill="#334155">3/7 &lt; b &lt; 15/7     (b=3/2)</text>
</svg>

