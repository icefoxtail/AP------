<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 380" role="img" aria-labelledby="title desc">
  <title id="title">직선에 대한 점의 대칭이동</title>
  <desc id="desc">점 A와 대칭점 A′를 잇는 선분의 중점 M은 대칭축 위에 있고, 선분 AA′는 대칭축에 수직이다.</desc>
  <rect width="430" height="380" fill="#ffffff"/>
  <text x="18" y="28" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="20" font-weight="700" fill="#1e3a5f"></text>
  <line x1="76" y1="52" x2="356" y2="332" stroke="#0f766e" stroke-width="2.5"/>
  <line x1="104" y1="220" x2="244" y2="80" stroke="#b45309" stroke-width="3"/>
  <line x1="104" y1="220" x2="174" y2="150" stroke="#2563eb" stroke-width="2" stroke-dasharray="6 4"/>
  <circle cx="104" cy="220" r="5" fill="#2563eb"/><circle cx="244" cy="80" r="5" fill="#dc2626"/><circle cx="174" cy="150" r="5" fill="#1d4ed8"/>
  <text x="78" y="239" font-family="Arial, sans-serif" font-size="17" font-weight="700">A(−2,5)</text>
  <text x="249" y="77" font-family="Arial, sans-serif" font-size="17" font-weight="700">A′(3,10)</text>
  <text x="180" y="145" font-family="Arial, sans-serif" font-size="17" font-weight="700">M</text>
  <text x="282" y="310" font-family="Arial, sans-serif" font-size="16">x+y=8</text>
</svg>
