<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 260" width="360" height="260" role="img" aria-labelledby="q8.svg-title q8.svg-desc">
  <title id="q8.svg-title">삼각형 ABC와 높이 AH</title>
  <desc id="q8.svg-desc">각 B가 45도, AB=6√2, BC=14</desc>
  <rect width="360" height="260" fill="#ffffff"/>
  
  <polygon points="60,200 180,80 320,200" fill="none" stroke="#111" stroke-width="2"/>
  <line x1="180" y1="80" x2="180" y2="200" stroke="#555" stroke-dasharray="3,3" stroke-width="1.5"/>
  <rect x="180" y="185" width="15" height="15" fill="none" stroke="#555" stroke-width="1"/>
  <circle cx="60" cy="200" r="2.5" fill="#111"/><text x="45" y="205" font-size="15" font-style="italic">B</text>
  <circle cx="180" cy="80" r="2.5" fill="#111"/><text x="180" y="68" font-size="15" font-style="italic">A</text>
  <circle cx="320" cy="200" r="2.5" fill="#111"/><text x="325" y="205" font-size="15" font-style="italic">C</text>
  <circle cx="180" cy="200" r="2.5" fill="#555"/><text x="175" y="220" font-size="15" font-style="italic">H</text>
  <text x="100" y="130" font-size="14">6√2</text>
  <text x="190" y="235" font-size="14">14</text>
  <text x="85" y="192" font-size="13">45°</text>

</svg>
