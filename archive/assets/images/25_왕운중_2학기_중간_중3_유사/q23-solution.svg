<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 260" width="360" height="260" role="img" aria-labelledby="q23-soluti-title q23-soluti-desc">
  <title id="q23-soluti-title">삼각형 OAB 넓이 계산</title>
  <desc id="q23-soluti-desc">OM=4, OB=5, BM=3, AB=6, 넓이=12</desc>
  <rect width="360" height="260" fill="#ffffff"/>
  
  <polygon points="180,130 100,70 260,70" fill="#f0f7ff" stroke="#0066cc" stroke-width="2"/>
  <line x1="180" y1="130" x2="180" y2="70" stroke="#cc0000" stroke-width="1.8"/>
  <rect x="180" y="70" width="12" height="12" fill="none" stroke="#cc0000" stroke-width="1"/>
  <text x="185" y="105" font-size="13" fill="#cc0000">4</text>
  <text x="225" y="110" font-size="13">5</text>
  <text x="215" y="62" font-size="13" fill="#0066cc">3</text>
  <text x="140" y="165" font-size="15" fill="#0066cc" font-weight="bold">넓이 = 12 cm²</text>

</svg>
