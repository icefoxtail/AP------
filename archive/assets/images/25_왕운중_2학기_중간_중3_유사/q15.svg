<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 260" width="360" height="260" role="img" aria-labelledby="q15.svg-title q15.svg-desc">
  <title id="q15.svg-title">원호와 수선</title>
  <desc id="q15.svg-desc">CM=2, AB=8인 원의 일부분</desc>
  <rect width="360" height="260" fill="#ffffff"/>
  
  <path d="M 60,180 A 130,130 0 0,1 300,180" fill="none" stroke="#111" stroke-width="2"/>
  <line x1="60" y1="180" x2="300" y2="180" stroke="#111" stroke-width="2"/>
  <line x1="180" y1="120" x2="180" y2="180" stroke="#cc0000" stroke-width="2"/>
  <circle cx="60" cy="180" r="2.5" fill="#111"/><text x="50" y="195" font-size="14" font-style="italic">A</text>
  <circle cx="300" cy="180" r="2.5" fill="#111"/><text x="305" y="195" font-size="14" font-style="italic">B</text>
  <circle cx="180" cy="120" r="2.5" fill="#111"/><text x="175" y="110" font-size="14" font-style="italic">C</text>
  <circle cx="180" cy="180" r="2.5" fill="#111"/><text x="175" y="200" font-size="14" font-style="italic">M</text>
  <text x="185" y="155" font-size="13" fill="#cc0000">2</text>
  <text x="180" y="225" font-size="14">AB=8</text>

</svg>
