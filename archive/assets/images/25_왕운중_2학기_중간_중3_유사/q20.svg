<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 260" width="360" height="260" role="img" aria-labelledby="q20.svg-title q20.svg-desc">
  <title id="q20.svg-title">직사각형 안의 직각삼각형</title>
  <desc id="q20.svg-desc">빗변 AF=8, 각 EAF=30도</desc>
  <rect width="360" height="260" fill="#ffffff"/>
  
  <rect x="50" y="40" width="240" height="180" fill="none" stroke="#111" stroke-width="2"/>
  <polygon points="50,220 180,100 240,165" fill="none" stroke="#0066cc" stroke-width="2"/>
  <text x="35" y="230" font-size="14">A</text>
  <text x="35" y="45" font-size="14">B</text>
  <text x="295" y="45" font-size="14">C</text>
  <text x="295" y="230" font-size="14">D</text>
  <text x="180" y="90" font-size="14">E</text>
  <text x="245" y="180" font-size="14">F</text>
  <text x="135" y="205" font-size="14" fill="#0066cc">8</text>
  <text x="95" y="195" font-size="13">30°</text>

