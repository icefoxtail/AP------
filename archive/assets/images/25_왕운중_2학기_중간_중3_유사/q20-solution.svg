<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" width="300" height="200" role="img" aria-labelledby="q20-soluti-title q20-soluti-desc">
  <title id="q20-soluti-title">투영을 이용한 sin 75도 계산</title>
  <desc id="q20-soluti-desc">sin 75 = (√6+√2)/4</desc>
  <rect width="300" height="200" fill="#ffffff"/>
  
  <text x="60" y="80" font-size="14">AE = 4√3, EF = 4</text>
  <text x="60" y="120" font-size="14">수평 투영: 2√6 + 2√2</text>
  <text x="60" y="160" font-size="16" fill="#cc0000" font-weight="bold">sin 75° = (√6+√2)/4</text>

</svg>
