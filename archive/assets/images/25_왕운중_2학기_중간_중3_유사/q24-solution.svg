<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200" role="img" aria-labelledby="q24-soluti-title q24-soluti-desc">
  <title id="q24-soluti-title">거리 AB 계산</title>
  <desc id="q24-soluti-desc">AH=600m, BH=858m, AB=1458m</desc>
  <rect width="320" height="200" fill="#ffffff"/>
  
  <text x="80" y="80" font-size="14">AH = 600 * tan 45° = 600m</text>
  <text x="80" y="120" font-size="14">BH = 600 * tan 55° = 858m</text>
  <text x="80" y="160" font-size="16" fill="#cc0000" font-weight="bold">AB = 600 + 858 = 1458m</text>

</svg>
