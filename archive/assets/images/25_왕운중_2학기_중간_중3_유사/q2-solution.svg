<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 260" width="360" height="260" role="img" aria-labelledby="q2-solutio-title q2-solutio-desc">
  <title id="q2-solutio-title">직각삼각형 비율 3:4:5</title>
  <desc id="q2-solutio-desc">각 B가 직각이고 밑변 3k, 높이 4k, 빗변 5k인 직각삼각형</desc>
  <rect width="360" height="260" fill="#ffffff"/>
  
  <polygon points="90,60 90,200 250,200" fill="none" stroke="#111" stroke-width="2"/>
  <rect x="90" y="185" width="15" height="15" fill="none" stroke="#111" stroke-width="1.2"/>
  <circle cx="90" cy="60" r="2.5" fill="#111"/><text x="85" y="50" font-size="15" font-style="italic">C</text>
  <circle cx="90" cy="200" r="2.5" fill="#111"/><text x="75" y="215" font-size="15" font-style="italic">B</text>
  <circle cx="250" cy="200" r="2.5" fill="#111"/><text x="260" y="215" font-size="15" font-style="italic">A</text>
  <text x="165" y="220" font-size="14">3k</text>
  <text x="65" y="135" font-size="14">4k</text>
  <text x="180" y="120" font-size="14" fill="#0066cc">5k</text>

</svg>
