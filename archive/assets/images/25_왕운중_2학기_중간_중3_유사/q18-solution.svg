<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 220" width="300" height="220" role="img" aria-labelledby="q18-soluti-title q18-soluti-desc">
  <title id="q18-soluti-title">연속 접선 계산</title>
  <desc id="q18-soluti-desc">AD=26, AF=22, AD+AF=48</desc>
  <rect width="300" height="220" fill="#ffffff"/>
  
  <text x="50" y="60" font-size="14">첫 접선 t 가정</text>
  <text x="50" y="100" font-size="14">AD = 26</text>
  <text x="50" y="140" font-size="14">AF = 22</text>
  <text x="50" y="180" font-size="16" fill="#cc0000" font-weight="bold">AD+AF = 48</text>

</svg>
