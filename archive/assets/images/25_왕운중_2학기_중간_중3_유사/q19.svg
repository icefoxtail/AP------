<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 260" width="360" height="260" role="img" aria-labelledby="q19.svg-title q19.svg-desc">
  <title id="q19.svg-title">직각삼각형과 빗변 중점 M</title>
  <desc id="q19.svg-desc">AB=6, BC=8, M은 AC 중점, MH 수선</desc>
  <rect width="360" height="260" fill="#ffffff"/>
  
  <polygon points="60,200 260,200 60,80" fill="none" stroke="#111" stroke-width="2"/>
  <rect x="60" y="185" width="15" height="15" fill="none" stroke="#111" stroke-width="1"/>
  <circle cx="160" cy="140" r="3" fill="#0066cc"/><text x="165" y="135" font-size="14" font-style="italic" fill="#0066cc">M</text>
  <line x1="160" y1="140" x2="160" y2="200" stroke="#0066cc" stroke-width="1.8"/>
  <rect x="160" y="185" width="15" height="15" fill="none" stroke="#0066cc" stroke-width="1"/>
  <line x1="60" y1="200" x2="160" y2="140" stroke="#555" stroke-dasharray="3,3"/>
  <text x="50" y="215" font-size="14">B</text>
  <text x="265" y="215" font-size="14">C</text>
  <text x="50" y="75" font-size="14">A</text>
  <text x="155" y="215" font-size="14">H</text>
  <text x="35" y="145" font-size="14">6</text>
  <text x="155" y="235" font-size="14">8</text>

</svg>
