<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 260" width="360" height="260" role="img" aria-labelledby="q24.svg-title q24.svg-desc">
  <title id="q24.svg-title">드론에서 내려다본 두 지점 A, B</title>
  <desc id="q24.svg-desc">고도 600m, 내려다본 각 45도와 35도</desc>
  <rect width="360" height="260" fill="#ffffff"/>
  
  <line x1="40" y1="200" x2="320" y2="200" stroke="#111" stroke-width="2"/>
  <circle cx="160" cy="60" r="4" fill="#0066cc"/><text x="155" y="48" font-size="15" font-style="italic" fill="#0066cc">P</text>
  <line x1="160" y1="60" x2="160" y2="200" stroke="#555" stroke-dasharray="3,3"/>
  <line x1="160" y1="60" x2="80" y2="200" stroke="#111" stroke-width="1.8"/>
  <line x1="160" y1="60" x2="270" y2="200" stroke="#111" stroke-width="1.8"/>
  <text x="70" y="215" font-size="14">A</text>
  <text x="275" y="215" font-size="14">B</text>
  <text x="165" y="215" font-size="14">H</text>
  <text x="165" y="130" font-size="13">600m</text>

