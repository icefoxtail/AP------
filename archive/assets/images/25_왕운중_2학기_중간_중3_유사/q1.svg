<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 260" width="360" height="260" role="img" aria-labelledby="q1.svg-title q1.svg-desc">
  <title id="q1.svg-title">직각삼각형 ABC</title>
  <desc id="q1.svg-desc">각 B가 90도이고 AB=12, BC=5, AC=13인 직각삼각형</desc>
  <rect width="360" height="260" fill="#ffffff"/>
  
  <polygon points="80,60 80,200 280,200" fill="none" stroke="#111" stroke-width="2"/>
  <rect x="80" y="185" width="15" height="15" fill="none" stroke="#111" stroke-width="1.2"/>
  <circle cx="80" cy="60" r="2.5" fill="#111"/><text x="75" y="50" font-size="15" font-style="italic">A</text>
  <circle cx="80" cy="200" r="2.5" fill="#111"/><text x="65" y="215" font-size="15" font-style="italic">B</text>
  <circle cx="280" cy="200" r="2.5" fill="#111"/><text x="290" y="215" font-size="15" font-style="italic">C</text>
  <text x="55" y="135" font-size="14">12</text>
  <text x="175" y="220" font-size="14">5</text>
  <text x="190" y="120" font-size="14">13</text>

</svg>
