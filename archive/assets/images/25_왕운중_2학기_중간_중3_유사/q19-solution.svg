<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 260" width="360" height="260" role="img" aria-labelledby="q19-soluti-title q19-soluti-desc">
  <title id="q19-soluti-title">중점연결과 삼각비 sin x</title>
  <desc id="q19-soluti-desc">BM=5, BH=4, sin x=4/5</desc>
  <rect width="360" height="260" fill="#ffffff"/>
  
  <polygon points="60,200 160,200 160,140" fill="#f0f7ff" stroke="#0066cc" stroke-width="2"/>
  <text x="105" y="160" font-size="14" fill="#cc0000">BM=5</text>
  <text x="105" y="215" font-size="14" fill="#0066cc">BH=4</text>
  <text x="170" y="170" font-size="13">x</text>
  <text x="120" y="240" font-size="15" fill="#cc0000" font-weight="bold">sin x = 4/5</text>

</svg>
