<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 440" width="480" height="440" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">한 변의 길이가 a+4인 정육면체의 중앙에서 한 변의 길이가 a인 정육면체를 제거한 모양이다.</title><desc id="visual-desc">비스듬히 그린 정육면체의 앞면 가운데에 정사각형 구멍이 뚫려 있고, 구멍 안쪽으로 이어지는 모서리가 함께 그려져 있다. 구멍의 왼쪽 세로 모서리에 a, 바깥 오른쪽 모서리에 a+4가 표시되어 있다.</desc><rect width="480" height="440" fill="#fff"/><g data-layer="30"><line id="sAB" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="72.142857143" y1="387.857142857" x2="338.58276644" y2="387.857142857"/></g><g data-layer="30"><line id="sBC" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="338.58276644" y1="387.857142857" x2="338.58276644" y2="121.41723356"/></g><g data-layer="30"><line id="sCD" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="338.58276644" y1="121.41723356" x2="72.142857143" y2="121.41723356"/></g><g data-layer="30"><line id="sDA" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="72.142857143" y1="121.41723356" x2="72.142857143" y2="387.857142857"/></g><g data-layer="30"><line id="sBB2" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="338.58276644" y1="387.857142857" x2="407.857142857" y2="318.58276644"/></g><g data-layer="30"><line id="sCC2" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="338.582