<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300"><g fill="none" stroke="#222" stroke-width="3"><line x1="40" y1="150" x2="480" y2="150"/><line x1="70" y1="30" x2="450" y2="270"/><line x1="70" y1="270" x2="450" y2="30"/></g><g font-family="Arial,sans-serif" font-size="21" fill="#111"><text x="205" y="82">5x+17</text><text x="100" y="205">2x+2</text><text x="350" y="205">59-x</text><text x="210" y="255">(2x+2)+(5x+17)+(59-x)=180</text><text x="225" y="287">x=17</text></g></svg>