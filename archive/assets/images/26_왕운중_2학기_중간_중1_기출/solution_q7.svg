<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 330" role="img" aria-labelledby="svg-title-791462413e" aria-describedby="svg-desc-791462413e">
<title id="svg-title-791462413e">반비례 곡선 위 점이 만드는 직사각형</title><desc id="svg-desc-791462413e">P=(x,b/x)에서 좌표축에 내린 수선으로 만든 직사각형의 넓이는 x·(b/x)=b이다. 따라서 b가 커질수록 넓이도 커진다.</desc><rect width="540" height="330" fill="white"/>
<g fill="none" stroke="#222" stroke-width="2.5"><line x1="45" y1="285" x2="510" y2="285"/><line x1="65" y1="305" x2="65" y2="20"/>
<path d="M95 75 C130 125 175 165 235 200 C300 238 385 260 485 270"/>
<rect x="65" y="200" width="170" height="85" stroke-dasharray="7 5"/></g>
<circle cx="235" cy="200" r="5" fill="#111"/>
<g font-family="Arial,sans-serif" fill="#111"><text x="244" y="194" font-size="21">P(x, b/x)</text><text x="122" y="246" font-size="22">넓이=x·(b/x)=b</text><text x="300" y="155" font-size="24">y = b/x</text></g>
</svg>