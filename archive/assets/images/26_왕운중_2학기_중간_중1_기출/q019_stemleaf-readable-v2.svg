<text x="92.5" y="44.5" class="cell-text">0</text>
<rect x="169" y="35" width="153" height="19" class="cell"/>
<text x="245.5" y="44.5" class="cell-text">1  1  3  3  7  8  9</text>
<rect x="16" y="54" width="153" height="19" class="cell"/>
<text x="92.5" y="63.5" class="cell-text">1</text>
<rect x="169" y="54" width="153" height="19" class="cell"/>
<text x="245.5" y="63.5" class="cell-text">0  4  a  b  8  8</text>
<rect x="16" y="73" width="153" height="19" class="cell"/>
<text x="92.5" y="82.5" class="cell-text">2</text>
<rect x="169" y="73" width="153" height="19" class="cell"/>
<text x="245.5" y="82.5" class="cell-text">3  7  7</text>
<rect x="16" y="92" width="153" height="19" class="cell"/>
<text x="92.5" y="101.5" class="cell-text">3</text>
<rect x="169" y="92" width="153" height="19" class="cell"/>
<text x="245.5" y="101.5" class="cell-text">0  0  1  1  1</text>
<rect x="16" y="111" width="153" height="19" class="cell"/>
<text x="92.5" y="120.5" class="cell-text"></text>
<rect x="169" y="111" width="153" height="19" class="cell"/>
<text x="245.5" y="120.5" class="cell-text">1 | 0은 10시간</text>
</svg>
