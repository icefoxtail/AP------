<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 370" role="img" aria-label="반구의 부피">
  <rect width="560" height="370" fill="#fff"/>
  <g fill="none" stroke="#111" stroke-width="2" stroke-linecap="round">
    <path d="M145 205 A135 135 0 0 1 415 205"/>
    <line x1="145" y1="205" x2="415" y2="205"/>
    <line x1="280" y1="205" x2="415" y2="205" stroke="#666" stroke-dasharray="6 5"/>
  </g>
  <circle cx="280" cy="205" r="4" fill="#111"/>
  <g fill="#111" font-family="sans-serif">
    <text x="22" y="32" font-size="20" font-weight="700">반구의 부피</text>
    <text x="330" y="194" font-size="18">6 cm</text>
    <text x="48" y="270" font-size="20">V = 1/2 × (4/3)π × 6³</text>
