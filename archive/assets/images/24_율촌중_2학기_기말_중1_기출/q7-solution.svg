<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 390" role="img" aria-label="호의 길이가 4π이고 반지름이 5인 부채꼴은 중심각 144도">
  <rect width="700" height="390" fill="#fff"/>
  <g fill="none" stroke="#111" stroke-width="2.5" stroke-linejoin="round">
    <path d="M185 240 L50 196.1 A142 142 0 0 1 320 196.1 Z" fill="#f1f5f9"/>
    <line x1="185" y1="240" x2="185" y2="98" stroke="#64748b" stroke-dasharray="6 5"/>
    <circle cx="475" cy="175" r="58"/>
    <line x1="475" y1="175" x2="533" y2="175" stroke="#64748b" stroke-dasharray="6 5"/>
  </g>
  <g fill="#111" font-family="sans-serif">
    <text x="24" y="34" font-size="20" font-weight="700">원뿔 전개도의 부채꼴</text>
    <text x="177" y="225" font-size="16">144°</text>
    <text x="105" y="159" font-size="16">반지름 5 cm</text>
    <text x="208" y="105" font-size="15">호의 길이 4π cm</text>
    <text x="493" y="166" font-size="15">반지름 2 cm</text>
    <text x="445" y="254" font-size="16">밑면</text>
    <text x="24" y="300" font-size="17">2π·5·(θ/360)=4π 이므로 θ=144°</text>
    <text x="24" y="330" font-size="17">옆면 넓이=(144/360)π·5²=10π cm²</text>
    <text x="24" y="360" font-size="17">밑면 넓이=π·2²=4π cm², 겉넓이=14π cm²</text>
  </g>
</svg>
