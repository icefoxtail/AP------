<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 390" role="img" aria-label="반지름 6과 높이 6인 원기둥 A, 반지름 3인 원기둥 B의 같은 부피 비교">
  <rect width="620" height="390" fill="#fff"/>
  <g fill="none" stroke="#111" stroke-width="2.5" stroke-linejoin="round">
    <ellipse cx="145" cy="105" rx="30" ry="9"/>
    <line x1="115" y1="105" x2="115" y2="135"/><line x1="175" y1="105" x2="175" y2="135"/>
    <ellipse cx="145" cy="135" rx="30" ry="9"/>
    <ellipse cx="405" cy="55" rx="15" ry="5"/>
    <line x1="390" y1="55" x2="390" y2="175"/><line x1="420" y1="55" x2="420" y2="175"/>
    <ellipse cx="405" cy="175" rx="15" ry="5"/>
    <line x1="145" y1="105" x2="175" y2="105" stroke="#64748b" stroke-dasharray="5 4"/>
    <line x1="405" y1="55" x2="420" y2="55" stroke="#64748b" stroke-dasharray="5 4"/>
    <line x1="194" y1="105" x2="194" y2="135" stroke="#64748b" stroke-dasharray="5 4"/>
  </g>
  <g fill="#111" font-family="sans-serif">
    <text x="24" y="32" font-size="20" font-weight="700">부피가 같은 두 원기둥</text>
    <text x="135" y="167" font-size="18" font-weight="700">A</text>
    <text x="395" y="207" font-size="18" font-weight="700">B</text>
    <text x="121" y="96" font-size="15">r=6 cm</text>
    <text x="197" y="127" font-size="15">h=6 cm</text>
    <text x="424" y="54" font-size="15">r=3 cm</text>
    <text x="426" y="121" font-size="15">h cm</text>
    <text x="24" y="265" font-size="17">A의 부피 = π·6²·6 = 216π cm³</text>
    <text x="24" y="296" font-size="17">B의 부피 = π·3²·h = 9πh cm³</text>
    <text x="24" y="327" font-size="17">9πh=216π 이므로 h=24 cm</text>
  </g>
</svg>
