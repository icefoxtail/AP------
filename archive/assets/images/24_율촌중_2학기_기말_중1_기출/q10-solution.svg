<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 385" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="svg-title-c2222348f7" aria-describedby="svg-desc-c2222348f7"><title id="svg-title-c2222348f7">입체도형의 성질: 큰 원뿔(r=4m, h=6m)에서 작은 원뿔(r=2m, h=3m)을 잘라 만든 원뿔대</title><desc id="svg-desc-c2222348f7">큰 원뿔(r=4m, h=6m)에서 작은 원뿔(r=2m, h=3m)을 잘라 만든 원뿔대</desc><rect width="620" height="385" fill="#fff"/><style>.s{fill:none;stroke:#111;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.a{fill:none;stroke:#555;stroke-width:1.5;stroke-dasharray:6 5}.t{font:16px sans-serif;fill:#111}.m{font:15px sans-serif;fill:#111}</style><path class="s" d="M150 220 L210 82 L310 82 L370 220 Z"/><line class="a" x1="210" y1="82" x2="260" y2="18"/><line class="a" x1="310" y1="82" x2="260" y2="18"/><line class="a" x1="260" y1="18" x2="260" y2="220"/><text class="m" x="285" y="48">작은 원뿔: r=2 m, h=3 m</text><text class="m" x="98" y="246">큰 원뿔: r=4 m, h=6 m</text><text class="t" x="28" y="292">큰 원뿔의 부피: (1/3)π·4²·6=32π m³</text><text class="t" x="28" y="322">작은 원뿔의 부피: (1/3)π·2²·3=4π m³</text><text class="t" x="28" y="352">원뿔대: 32π − 4π = 28π m³</text></svg>