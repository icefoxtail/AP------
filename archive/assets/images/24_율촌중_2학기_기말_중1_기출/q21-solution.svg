<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="svg-title-a770067f07" aria-describedby="svg-desc-a770067f07"><title id="svg-title-a770067f07">입체도형의 성질: 반지름 3cm인 구 세 개가 반지름 3cm, 높이 18cm인 원기둥 통에 세로로 꼭 맞</title><desc id="svg-desc-a770067f07">반지름 3cm인 구 세 개가 반지름 3cm, 높이 18cm인 원기둥 통에 세로로 꼭 맞게 들어 있다</desc><rect width="600" height="420" fill="#fff"/><style>.s{fill:none;stroke:#111;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.a{fill:none;stroke:#555;stroke-width:1.5;stroke-dasharray:6 5}.t{font:14px sans-serif;fill:#111}.m{font:15px sans-serif;fill:#111}</style><ellipse class="s" cx="300" cy="42" rx="95" ry="18"/><line class="s" x1="205" y1="42" x2="205" y2="250"/><line class="s" x1="395" y1="42" x2="395" y2="250"/><ellipse class="s" cx="300" cy="250" rx="95" ry="18"/><circle class="s" cx="300" cy="77" r="34"/><circle class="s" cx="300" cy="145" r="34"/><circle class="s" cx="300" cy="213" r="34"/><line class="a" x1="300" y1="77" x2="334" y2="77"/><text class="m" x="410" y="73">r=3 cm</text><text class="m" x="410" y="160">높이 18 cm</text><text class="t" x="24" y="302">원기둥의 부피: π·3²·18=162π cm³</text><text class="t" x="24" y="330">구 하나의 부피: (4/3)π·3³=36π cm³</text><text class="t" x="24" y="358">구 세 개의 부피: 3·36π=108π cm³</text><text class="t" x="24" y="386">빈 공간의 부피: 162π−108π=54π cm³</text></svg>