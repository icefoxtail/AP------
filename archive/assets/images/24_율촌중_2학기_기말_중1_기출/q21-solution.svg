<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 455" role="img" aria-label="반지름 3cm인 공 세 개가 반지름 3cm인 원기둥에 꼭 맞게 들어감">
  <rect width="640" height="455" fill="#fff"/>
  <g fill="none" stroke="#111" stroke-width="2.5" stroke-linejoin="round">
    <ellipse cx="300" cy="50" rx="45" ry="12"/>
    <line x1="255" y1="50" x2="255" y2="320"/><line x1="345" y1="50" x2="345" y2="320"/>
    <ellipse cx="300" cy="320" rx="45" ry="12"/>
    <circle cx="300" cy="95" r="45" fill="#f8fafc"/>
    <circle cx="300" cy="185" r="45" fill="#f8fafc"/>
    <circle cx="300" cy="275" r="45" fill="#f8fafc"/>
    <line x1="300" y1="95" x2="345" y2="95" stroke="#64748b" stroke-dasharray="5 4"/>
    <line x1="300" y1="50" x2="300" y2="320" stroke="#64748b" stroke-dasharray="6 5"/>
  </g>
  <g fill="#111" font-family="sans-serif">
    <text x="24" y="34" font-size="20" font-weight="700">반지름 3 cm인 공 세 개가 꼭 맞게 들어 있는 원기둥</text>
    <text x="354" y="99" font-size="16">공과 원기둥의 반지름 3 cm</text>
    <text x="354" y="188" font-size="16">원기둥 높이=6×3=18 cm</text>
    <text x="24" y="365" font-size="17">원기둥 부피=π·3²·18=162π cm³</text>
    <text x="24" y="395" font-size="17">공 세 개 부피=3·(4/3)π·3³=108π cm³</text>
    <text x="24" y="430" font-size="18" font-weight="700">빈 공간=162π−108π=54π cm³</text>
  </g>
</svg>
