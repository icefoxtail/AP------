<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 320" width="420" height="320" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">넓이가 6a²+17a+5이고 가로의 길이가 3a+1인 직사각형 모양 교실의 평면도이다. 세로의 길이는 그림에 표시하지 않았다.</title><desc id="visual-desc">가로로 긴 직사각형이 있고 아래쪽 가로변 바깥에 3a+1이 표시되어 있다. 꼭짓점 이름과 세로의 길이는 보이지 않는다.</desc><rect width="420" height="320" fill="#fff"/><g data-layer="30"><line id="sAB" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="63.423839504" y1="49.589139259" x2="63.423839504" y2="245.024019921"/></g><g data-layer="30"><line id="sBC" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="63.423839504" y1="245.024019921" x2="356.576160496" y2="245.024019921"/></g><g data-layer="30"><line id="sCD" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="356.576160496" y1="245.024019921" x2="356.576160496" y2="49.589139259"/></g><g data-layer="30"><line id="sDA" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="356.576160496" y1="49.589139259" x2="63.423839504" y2="49.589139259"/></g><g data-layer="52"><line id="dW-ext-from" data-role="indicator" stroke="#111" stroke-width="0.8" fill="none" data-mark="dimension" data-mark-id="dW" data-mark-part="ext-from" x1="63.423839504" y1="249.024019921" x2="63.423839504" y2="272.024019921"/></g><g data-layer="52"><line id="dW-ext-to" data-role="i