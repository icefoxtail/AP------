<svg xmlns="http://www.w3.org/2000/svg" width="720" height="430" viewBox="0 0 720 430" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc"><title id="title">23 팔마고 기말 q10 해설 부호표</title><desc id="desc">도함수 그래프의 영점 -4, 0, 4에서 부호 변화를 읽어 ㄴ과 ㄷ만 참임을 확인한다.</desc><style>
.bg{fill:#fff}.axis{stroke:#171717;stroke-width:1.4;fill:none;stroke-linecap:round;stroke-linejoin:round}.curve{stroke:#111;stroke-width:2.0;fill:none;stroke-linecap:round;stroke-linejoin:round}.guide{stroke:#777;stroke-width:1;stroke-dasharray:4 4;fill:none}.thin{stroke:#555;stroke-width:1.1;fill:none}.point{fill:#111}.open{fill:#fff;stroke:#111;stroke-width:1.3}.shade{fill:#eceff1;stroke:none}.panel{fill:#f7f8fa;stroke:#c7cbd1;stroke-width:1}.title{font-family:"Noto Sans CJK KR","NanumGothic","UnDotum","Noto Sans KR","Pretendard","Malgun Gothic",sans-serif;font-size:16px;font-weight:700;fill:#111}.label{font-family:"Noto Sans CJK KR","NanumGothic","UnDotum","Noto Sans KR","Pretendard","Malgun Gothic",sans-serif;font-size:13px;fill:#222}.small{font-family:"Noto Sans CJK KR","NanumGothic","UnDotum","Noto Sans KR","Pretendard","Malgun Gothic",sans-serif;font-size:11.5px;fill:#333}.math{font-family:"STIX Two Math","Cambria Math","Times New Roman",serif;font-size:13px;fill:#111}.tick{font-family:"STIX Two Math","Cambria Math","Times New Roman",serif;font-size:11.5px;fill:#222}</style><defs><marker id="arr" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L6,3 L0,6 Z" fill="#171717"/></marker></defs><rect class="bg" x="0" y="0" width="720" height="430"/><text class="title" x="28" y="32">q10 f'(x)의 부호로 f의 증감·극값 판정</text>
<rect class="panel" x="40" y="62" width="640" height="145" rx="8"/>
<line class="axis" x1="75" y1="125" x2="645" y2="125"/>
<circle class="point" cx="215" cy="125" r="4"/><circle class="point" cx="365" cy="125" r="4"/><circle class="point" cx="515" cy="125" r="4"/>
<text class="tick" x="202" y="151">−4</text><text class="tick" x="360" y="151">0</text><text class="tick" x="510" y="151">4</text>
<text class="label" x="118" y="105">f' &gt; 0</text><text class="label" x="265" y="105">f' &lt; 0</text><text class="label" x="410" y="105">f' &gt; 0</text><text class="label" x="555" y="105">f' &gt; 0</text>
<text class="small" x="73" y="185">x=−4: +→− (극대) · x=0: −→+ (극소) · x=4: +→+ (극값 없음)</text>
<rect class="panel" x="40" y="230" width="640" height="145" rx="8"/>
<text class="label" x="70" y="263">ㄱ X : [−5,−4]에서는 증가하므로 [−5,−2] 전체 감소가 아니다.</text>
<text class="label" x="70" y="292">ㄴ O : x=0에서 f'의 부호가 −에서 +로 바뀐다.</text>
<text class="label" x="70" y="321">ㄷ O : x=4에서는 f'가 0이지만 부호가 바뀌지 않는다.</text>
<text class="label" x="70" y="350">ㄹ X : 극값은 x=−4, 0의 2개이다. → 정답 ② (ㄴ, ㄷ)</text></svg>