<svg xmlns="http://www.w3.org/2000/svg" width="720" height="430" viewBox="0 0 720 430" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc"><title id="title">23 팔마고 기말 q15 해설</title><desc id="desc">도함수 그래프의 세 넓이를 함수값 변화량으로 바꾸어 세 단조구간의 공통 높이 범위를 구한다.</desc><style>
.bg{fill:#fff}.axis{stroke:#171717;stroke-width:1.4;fill:none;stroke-linecap:round;stroke-linejoin:round}.curve{stroke:#111;stroke-width:2.0;fill:none;stroke-linecap:round;stroke-linejoin:round}.guide{stroke:#777;stroke-width:1;stroke-dasharray:4 4;fill:none}.thin{stroke:#555;stroke-width:1.1;fill:none}.point{fill:#111}.open{fill:#fff;stroke:#111;stroke-width:1.3}.shade{fill:#eceff1;stroke:none}.panel{fill:#f7f8fa;stroke:#c7cbd1;stroke-width:1}.title{font-family:"Noto Sans CJK KR","NanumGothic","UnDotum","Noto Sans KR","Pretendard","Malgun Gothic",sans-serif;font-size:16px;font-weight:700;fill:#111}.label{font-family:"Noto Sans CJK KR","NanumGothic","UnDotum","Noto Sans KR","Pretendard","Malgun Gothic",sans-serif;font-size:13px;fill:#222}.small{font-family:"Noto Sans CJK KR","NanumGothic","UnDotum","Noto Sans KR","Pretendard","Malgun Gothic",sans-serif;font-size:11.5px;fill:#333}.math{font-family:"STIX Two Math","Cambria Math","Times New Roman",serif;font-size:13px;fill:#111}.tick{font-family:"STIX Two Math","Cambria Math","Times New Roman",serif;font-size:11.5px;fill:#222}</style><defs><marker id="arr" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L6,3 L0,6 Z" fill="#171717"/></marker></defs><rect class="bg" x="0" y="0" width="720" height="430"/><text class="title" x="28" y="32">q15 넓이 A,B,C를 f의 함숫값 변화량으로 해석</text>
<rect class="panel" x="40" y="58" width="640" height="110" rx="8"/>
<text class="label" x="68" y="88">B = 극댓값−극솟값 = 3−(−7)=10,  A:B=1:2 → A=5</text>
<text class="label" x="68" y="118">f(b)−f(a)=A−B+C=3 → 5−10+C=3 → C=8</text>
<text class="label" x="68" y="148">따라서 f(a)=3−5=−2,  f(b)=−7+8=1</text>
<rect class="panel" x="40" y="194" width="640" height="125" rx="8"/>
<text class="small" x="68" y="220">왼쪽 증가 구간</text><text class="small" x="285" y="220">가운데 감소 구간</text><text class="small" x="510" y="220">오른쪽 증가 구간</text>
<text class="math" x="83" y="258">−2  ↑  3</text><text class="math" x="300" y="258">3  ↓  −7</text><text class="math" x="525" y="258">−7  ↑  1</text>
<text class="label" x="68" y="298">세 구간을 모두 한 번씩 지나는 높이: −2 ≤ k ≤ 1</text>
<text class="label" x="68" y="365">정수 k = −2, −1, 0, 1 → 4개 → 정답 ②</text></svg>