<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 320" role="img" aria-labelledby="svg-title-1443d98f2a" aria-describedby="svg-desc-1443d98f2a"><title id="svg-title-1443d98f2a">사다리꼴 두 대각선의 중점을 잇는 선분</title><desc id="svg-desc-1443d98f2a">M,N은 사다리꼴의 두 옆변 중점이고 MN은 밑변들과 평행하다. P,Q는 대각선의 중점이므로 밑변 길이 14와 8에서 PQ=(14−8)/2=3이다.</desc><rect x="1" y="1" width="558" height="318" fill="white"/><g stroke="#111" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="200,65 360,65 420,245 140,245 200,65"/><line x1="170" y1="155" x2="390" y2="155"/><line x1="200" y1="65" x2="420" y2="245"/><line x1="360" y1="65" x2="140" y2="245"/><g fill="#111" stroke="none" font-size="16"><text x="188" y="52">A</text><text x="365" y="52">D</text><text x="125" y="265">B</text><text x="425" y="265">C</text><text x="155" y="150">M</text><text x="395" y="150">N</text><text x="238" y="150">P</text><text x="315" y="150">Q</text><text x="280" y="50">8</text><text x="280" y="270">14</text></g></g><text x="280" y="307" fill="#111" font-size="15" font-family="sans-serif" text-anchor="middle">P,Q는 대각선의 중점 → PQ=(14−8)/2=3</text></svg>