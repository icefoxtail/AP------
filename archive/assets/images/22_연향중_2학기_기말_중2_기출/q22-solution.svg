<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 320" role="img" aria-labelledby="svg-title-e2676f2c38" aria-describedby="svg-desc-e2676f2c38"><title id="svg-title-e2676f2c38">정오각형 꼭짓점 이동과 주사위 확률</title><desc id="svg-desc-e2676f2c38">두 번의 주사위 눈의 합을 5로 나눈 나머지가 1이면 A에서 B에 도착한다. 가능한 합은 6과 11로 유리한 순서쌍은 7개이므로 확률은 7/36이다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#111"/></marker></defs><rect x="1" y="1" width="558" height="318" fill="white"/><g stroke="#111" fill="none" stroke-width="2"><polygon points="280,50 175.4,126 215.3,249 344.7,249 384.6,126"/><circle cx="280" cy="50" r="5" fill="#111"/><path d="M255 68 L200 108" marker-end="url(#arrow)"/><g fill="#111" stroke="none" font-size="16"><text x="280" y="32">A(P)</text><text x="155" y="126">B</text><text x="200" y="270">C</text><text x="356" y="270">D</text><text x="402" y="126">E</text><text x="215" y="150">반시계 방향</text></g></g><text x="280" y="307" fill="#111" font-size="15" text-anchor="middle">두 눈의 합 ≡1 (mod 5): 6 또는 11 → 7/36</text></svg>