  <rect x="1" y="1" width="558" height="318" fill="white"/>
  <g stroke="#111" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="70,255 310,95 310,255 70,255"/><polyline points="310,95 450,95 310,255 310,95"/><g fill="#111" stroke="none" font-size="16"><text x="180" y="145">17</text><text x="332" y="180">x</text><text x="382" y="82">6</text><text x="400" y="190">10</text><text x="180" y="275">y</text></g>
  </g>
  <text x="280" y="304" fill="#111" font-size="15" font-family="sans-serif" text-anchor="middle">x²+6²=10² → x=8; y²+8²=17² → y=15</text>
