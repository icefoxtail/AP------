<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 320" role="img" aria-labelledby="svg-title-4a966cfe9f" aria-describedby="svg-desc-4a966cfe9f"><title id="svg-title-4a966cfe9f">이어진 두 직각삼각형의 빗변 길이</title><desc id="svg-desc-4a966cfe9f">△ACD에서 6²+x²=10²이므로 x=AC=8이다. △ABC에서 8²+y²=17²이므로 y=BC=15이고 x+y=23이다.</desc><rect x="1" y="1" width="558" height="318" fill="white"/><g stroke="#111" fill="none" stroke-width="2"><polyline points="60,240 300,112 300,240 60,240"/><polyline points="300,112 396,112 300,240 300,112"/><polyline points="288,112 288,124 300,124"/><polyline points="288,228 300,228 300,240"/><g fill="#111" stroke="none" font-size="16"><text x="45" y="260">B</text><text x="288" y="260">C</text><text x="288" y="102">A</text><text x="402" y="108">D</text><text x="160" y="155">17</text><text x="312" y="180">x=8</text><text x="345" y="100">6</text><text x="350" y="185">10</text><text x="160" y="260">y=15</text></g></g><text x="280" y="307" fill="#111" font-size="15" text-anchor="middle">6-8-10, 8-15-17 → x+y=23</text></svg>