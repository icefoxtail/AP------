<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 320" role="img" aria-labelledby="svg-title-3f2bb017d4" aria-describedby="svg-desc-3f2bb017d4"><title id="svg-title-3f2bb017d4">직선과 좌표축이 만드는 삼각형의 높이</title><desc id="svg-desc-3f2bb017d4">직선 y=−4x/3+4의 절편은 A=(0,4), B=(3,0)이므로 AB=5이다. 삼각형 OAB의 넓이 6은 (1/2)·5·OH와 같아 OH=12/5이다.</desc><rect x="1" y="1" width="558" height="318" fill="white"/><g stroke="#111" fill="none" stroke-width="2"><line x1="70" y1="235" x2="470" y2="235"/><line x1="140" y1="280" x2="140" y2="35"/><line x1="140" y1="75" x2="260" y2="235"/><line x1="140" y1="235" x2="216.8" y2="177.4"/><polyline points="207.2,184.6 214.4,194.2 224,187"/><g fill="#111" stroke="none" font-size="16"><text x="128" y="255">O</text><text x="112" y="72">A(0,4)</text><text x="264" y="255">B(3,0)</text><text x="224" y="174">H</text><text x="280" y="205">y=−4/3x+4</text></g></g><text x="280" y="307" fill="#111" font-size="15" text-anchor="middle">OA=4, OB=3, AB=5; 6=(1/2)·5·OH → OH=12/5</text></svg>