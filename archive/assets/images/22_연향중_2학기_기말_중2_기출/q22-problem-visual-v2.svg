<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 693 607" width="693" height="607" role="img" aria-labelledby="title desc"><title id="title">바둑돌 P가 출발하는 정오각형</title><desc id="desc">정오각형의 위 꼭짓점 A에 P가 있다. 화살표는 A에서 왼쪽 위 B로 향한다. 나머지 꼭짓점은 시계 반대 방향으로 C, D, E 순서다.</desc><rect width="693" height="607" fill="white" /><line x1="556.2814" y1="253.3253" x2="348.0000" y2="102.0000" stroke="#21639a" stroke-width="5.15" stroke-linecap="round" /><line x1="348.0000" y1="102.0000" x2="139.7186" y2="253.3253" stroke="#21639a" stroke-width="5.15" stroke-linecap="round" /><line x1="139.7186" y1="253.3253" x2="219.2750" y2="498.1747" stroke="#21639a" stroke-width="5.15" stroke-linecap="round" /><line x1="219.2750" y1="498.1747" x2="476.7250" y2="498.1747" stroke="#21639a" stroke-width="5.15" stroke-linecap="round" /><line x1="476.7250" y1="498.1747" x2="556.2814" y2="253.3253" stroke="#21639a" stroke-width="5.15" stroke-linecap="round" /><line x1="323.0062" y1="120.1590" x2="242.9124" y2="178.3506" stroke="#227365" stroke-width="6.25" stroke-linecap="round" /><polygon points="225.1140,191.2819 248.0849,185.4700 237.7399,171.2313" fill="#227365" /><circle cx="348.0" cy="102.0" r="5.85" fill="#21639a" /><text x="348.0000" y="77.0000" font-size="34" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#273846" text-anchor="middle">A</text><circle cx="139.71862293136138" cy="253.3252782318865" r="5.85" fill="#21639a" /><text x="115.7186" y="249.3253" font-size="34" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#273846" text-anchor="middle">B</text><circle cx="219.27502974794837" cy="498.1747217681135" r="5.85" fill="#21639a" /><text x="202.2750" y="520.1747" font-size="34" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#273846" text-anchor="middle">C</text><circle cx="476.72497025205155" cy="498.1747217681135" r="5.85" fill="#21639a" /><text x="494.7250" y="521.1747" font-size="34" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#273846" text-anchor="middle">D</text><circle cx="556.2813770686387" cy="253.32527823188656" r="5.85" fill="#21639a" /><text x="582.2814" y="252.3253" font-size="34" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#273846" text-anchor="middle">E</text><text x="390.0000" y="114.0000" font-size="36" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#227365" text-anchor="middle">P</text></svg>
