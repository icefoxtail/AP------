<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 744 596" width="744" height="596" role="img" aria-labelledby="title desc"><title id="title">세 반원과 어두운 두 초승달</title><desc id="desc">직각삼각형의 AB는 12 cm이고 빗변의 중점 O에서 B까지는 10 cm이다. 세 변을 지름으로 만든 세 반원에서, 두 작은 반원에 속하고 큰 반원 밖에 남는 두 부분을 칠했다. AC의 길이 16 cm도 표시했다.</desc><rect width="744" height="596" fill="white" /><path d="M 103.0000 430.0000 A 161.4000 161.4000 0 0 1 296.6800 171.7600 A 269.0 269.0 0 0 0 103 430 Z" fill="#a4d7c3" /><path d="M 296.6800 171.7600 A 215.2000 215.2000 0 0 1 641.0000 430.0000 A 269.0 269.0 0 0 0 296.68 171.76 Z" fill="#f2caab" /><path d="M 103.0000 430.0000 A 161.4000 161.4000 0 0 1 296.6800 171.7600" fill="none" stroke="#227365" stroke-width="5.15" /><line x1="103.0000" y1="430.0000" x2="296.6800" y2="171.7600" stroke="#227365" stroke-width="4.7" stroke-linecap="round" /><path d="M 296.6800 171.7600 A 215.2000 215.2000 0 0 1 641.0000 430.0000" fill="none" stroke="#a34c1f" stroke-width="5.15" /><line x1="296.6800" y1="171.7600" x2="641.0000" y2="430.0000" stroke="#a34c1f" stroke-width="4.7" stroke-linecap="round" /><path d="M 103.0000 430.0000 A 269.0000 269.0000 0 0 1 641.0000 430.0000" fill="none" stroke="#21639a" stroke-width="5.15" /><line x1="103.0000" y1="430.0000" x2="641.0000" y2="430.0000" stroke="#21639a" stroke-width="4.7" stroke-linecap="round" /><line x1="281.0800" y1="192.5600" x2="301.8800" y2="208.1600" stroke="#687889" stroke-width="2.6" stroke-linecap="round" /><line x1="301.8800" y1="208.1600" x2="317.4800" y2="187.3600" stroke="#687889" stroke-width="2.6" stroke-linecap="round" /><circle cx="296.68" cy="171.76" r="4.9" fill="#273846" /><text x="287.6800" y="151.7600" font-size="32" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#273846" text-anchor="middle">A</text><circle cx="103" cy="430" r="4.9" fill="#273846" /><text x="79.0000" y="453.0000" font-size="32" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#273846" text-anchor="middle">B</text><circle cx="641" cy="430" r="4.9" fill="#273846" /><text x="665.0000" y="453.0000" font-size="32" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#273846" text-anchor="middle">C</text><circle cx="372.0" cy="430.0" r="4.9" fill="#273846" /><text x="372.0000" y="462.0000" font-size="32" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#273846" text-anchor="middle">O</text><text x="215.0000" y="474.0000" font-size="33" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#21639a" text-anchor="middle">10 cm</text><text x="241.0000" y="347.0000" font-size="33" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#227365" text-anchor="middle">12 cm</text><text x="494.0000" y="382.0000" font-size="33" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#a34c1f" text-anchor="middle">16 cm</text></svg>
