<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 230" width="480" height="230" role="img" aria-labelledby="q12-title q12-desc">
  <title id="q12-title">곱셈의 연산 법칙 계산 과정</title>
  <desc id="q12-desc">곱셈의 교환법칙과 결합법칙을 적용하는 계산 과정</desc>
  <rect width="480" height="230" fill="#ffffff"/>
  <rect x="15" y="15" width="450" height="200" fill="#ffffff" stroke="#333333" stroke-width="1.5" rx="8"/>
  <g font-family="sans-serif" font-size="16" fill="#111111">
    <text x="35" y="55">(-25) × (+7) × (-4)</text>
    <text x="35" y="95">= (-25) × (-4) × (+7)</text>
    <text x="270" y="95" fill="#0066cc" font-weight="bold">…… ㉠</text>
    <text x="35" y="135">= {(-25) × (-4)} × (+7)</text>
    <text x="270" y="135" fill="#0066cc" font-weight="bold">…… ㉡</text>
    <text x="35" y="170">= ㉢ × (+7)</text>
    <text x="35" y="200">= ㉣</text>
  </g>
</svg>
