<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 210" width="460" height="210" role="img" aria-labelledby="q23-title q23-desc">
  <title id="q23-title">혼합 계산 순서</title>
  <desc id="q23-desc">사칙연산 혼합 계산 식과 계산 순서 기호</desc>
  <rect width="460" height="210" fill="#ffffff"/>
  <rect x="15" y="15" width="430" height="180" fill="#ffffff" stroke="#333333" stroke-width="1.5" rx="8"/>
  
  <!-- Expression text -->
  <text x="35" y="65" font-family="sans-serif" font-size="20" fill="#111111">
    5  -  {  3  -  6  ÷  (-3/2)²  }  ×  (-2)
  </text>
  
  <!-- Step lines and labels -->
  <!-- ㄹ: (-3/2)² -->
  <path d="M 195,78 L 195,95 L 260,95 L 260,78" fill="none" stroke="#0066cc" stroke-width="2"/>
  <text x="228" y="112" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0066cc" text-anchor="middle">ㄹ</text>
  
  <!-- ㄷ: 6 ÷ ㄹ -->
  <path d="M 155,78 L 155,125 L 265,125 L 265,98" fill="none" stroke="#e65100" stroke-width="2"/>
  <text x="180" y="142" font-family="sans-serif" font-size="14" font-weight="bold" fill="#e65100" text-anchor="middle">ㄷ</text>
  
  <!-- ㄴ: 3 - ㄷ -->
  <path d="M 95,78 L 95,155 L 270,155 L 270,128" fill="none" stroke="#2e7d32" stroke-width="2"/>
  <text x="125" y="172" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2e7d32" text-anchor="middle">ㄴ</text>
  
  <!-- ㅁ: ㄴ × (-2) -->
  <path d="M 90,160 L 90,185 L 365,185 L 365,78" fill="none" stroke="#9c27b0" stroke-width="2"/>
  <text x="320" y="178" font-family="sans-serif" font-size="14" font-weight="bold" fill="#9c27b0" text-anchor="middle">ㅁ</text>
  
  <!-- ㄱ: 5 - ㅁ -->
  <path d="M 40,78 L 40,195 L 375,195" fill="none" stroke="#c2185b" stroke-width="2"/>
  <text x="65" y="190" font-family="sans-serif" font-size="14" font-weight="bold" fill="#c2185b" text-anchor="middle">ㄱ</text>
</svg>
