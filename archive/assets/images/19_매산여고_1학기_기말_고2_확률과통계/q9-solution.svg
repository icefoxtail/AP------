<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 600" width="720" height="600" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">6번 중 앞면이 4번, 5번, 6번 나오는 경우를 센다. 그 수는 15+6+1=22이고 전체는 64가지이므로 확률은 22/64=11/32이다. 그림은 64가지를 한 막대로 보고 앞면이 4번 이상인 22가지를 15와 7로 나누어 표시한 것이다. 따라서 답은 ⑤이다.</title><desc id="visual-desc">가로로 놓인 하나의 큰 직사각형이 세 칸으로 나뉘어 있고, 왼쪽부터 파란색 칸에 15, 주황색 칸에 7, 보라색 칸에 42가 적혀 있다. 첫 두 칸 위를 가로지르는 치수선에는 22, 세 칸 전체 아래를 가로지르는 치수선에는 64가 적혀 있다.</desc><rect width="720" height="600" fill="#fff"/><g data-layer="10"><path id="r1" data-role="region" stroke="none" stroke-width="1.6" fill="#7fa6e8" data-owner-points="P1 P2 P7 P8" data-mark="region" data-mark-id="r1" fill-opacity="0.32" fill-rule="evenodd" d="M67.142857143 354.910714286 L204.419642857 354.910714286 L204.419642857 245.089285714 L67.142857143 245.089285714 L67.142857143 354.910714286 Z"/></g><g data-layer="10"><path id="r2" data-role="region" stroke="none" stroke-width="1.6" fill="#f2a65a" data-owner-points="P2 P3 P6 P7" data-mark="region" data-mark-id="r2" fill-opacity="0.42" fill-rule="evenodd" d="M204.419642857 354.910714286 L268.482142857 354.910714286 L268.482142857 245.089285714 L204.419642857 245.089285714 L204.419642857 354.910714286 Z"/></g><g data-layer="10"><path id="r3" data-role="region" stroke="none" stroke-width="1.6" fill="#a78bdb" data-owner-points="P3 P4 P5 P6" d