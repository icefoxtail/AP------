<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 600" width="720" height="600" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">삼각형 ABC에서 점 D는 변 AB의 중점, 점 E는 변 AC의 중점이고 점 G는 삼각형 ABC의 무게중심이다. 선분 DE가 변 BC와 평행이고 삼각형 GDE의 넓이는 6제곱센티미터로 주어져 있다.</title><desc id="visual-desc">삼각형 ABC의 꼭짓점 A, B, C가 보이고 변 AB의 중점 D와 변 AC의 중점 E에 같은 길이 표시가 있다. 선분 DE와 변 BC에 평행 표시가 있으며, 꼭짓점 B에서 중점 E로, 꼭짓점 C에서 중점 D로 그은 두 중선이 점 G에서 만난다. 삼각형 GDE 안에 6제곱센티미터가 적혀 있고 삼각형 ADE의 넓이는 적혀 있지 않다.</desc><rect width="720" height="600" fill="#fff"/><g data-layer="10"><path id="rGDE" data-role="region" stroke="none" stroke-width="1.6" fill="#c7ccd5" data-owner-points="D E G" data-mark="region" data-mark-id="rGDE" fill-rule="evenodd" d="M360 379.761904762 L240.357142857 300 L479.642857143 300 L360 379.761904762 Z"/></g><g data-layer="30"><line id="sAD" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="360" y1="60.714285714" x2="240.357142857" y2="300"/></g><g data-layer="30"><line id="sDB" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="240.357142857" y1="300" x2="120.714285714" y2="539.285714286"/></g><g data-layer="30"><line id="sAE" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="360" y1="60.714285714" x2="479.642857143" y2="300"/></g><g data-layer="30"><line id="sEC" data-role="line" stroke="#111" stroke-width="1.6" fill="non