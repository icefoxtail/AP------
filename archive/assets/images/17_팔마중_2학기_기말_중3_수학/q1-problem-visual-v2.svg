<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 464" width="620" height="464" role="img" aria-labelledby="title desc"><title id="title">세 꼭짓점을 이은 직각삼각형</title><desc id="desc">B와 C는 수평한 직각변의 양끝이다. C에서 올린 수직변은 A까지 이어지고, A와 B를 이은 선이 빗변이다.</desc><rect width="620" height="464" fill="white" /><polygon points="516.0000,77.5000 104.0000,386.5000 516.0000,386.5000" fill="none" /><line x1="516.0000" y1="77.5000" x2="104.0000" y2="386.5000" stroke="#205d9c" stroke-width="4.1" stroke-linecap="round" /><line x1="104.0000" y1="386.5000" x2="516.0000" y2="386.5000" stroke="#586574" stroke-width="4.1" stroke-linecap="round" /><line x1="516.0000" y1="386.5000" x2="516.0000" y2="77.5000" stroke="#266f73" stroke-width="4.1" stroke-linecap="round" /><line x1="516.0000" y1="370.5000" x2="500.0000" y2="370.5000" stroke="#586574" stroke-width="1.8" stroke-linecap="round" /><line x1="500.0000" y1="370.5000" x2="500.0000" y2="386.5000" stroke="#586574" stroke-width="1.8" stroke-linecap="round" /><circle cx="516.0" cy="77.5" r="4.9" fill="#28364b" /><text x="516.0000" y="60.5000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">A</text><circle cx="104.0" cy="386.5" r="4.9" fill="#28364b" /><text x="88.0000" y="408.5000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">B</text><circle cx="516.0" cy="386.5" r="4.9" fill="#28364b" /><text x="533.0000" y="408.5000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">C</text></svg>
