<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 690 505" width="690" height="505" role="img" aria-labelledby="title desc"><title id="title">원 밖 P에서 원의 두 점에 닿는 접선</title><desc id="desc">원 O의 왼쪽에서 두 접선 PA와 PB가 만난다. A와 B는 접점이다. 중심각 AOB는 120도이며 반지름 OB의 길이는 5 cm이다.</desc><rect width="690" height="505" fill="white" /><circle cx="431.66666666666663" cy="252.5" r="173.33333333333331" fill="none" stroke="#205d9c" stroke-width="3.6" /><line x1="85.0000" y1="252.5000" x2="345.0000" y2="102.3889" stroke="#266f73" stroke-width="4.1" stroke-linecap="round" /><line x1="85.0000" y1="252.5000" x2="345.0000" y2="402.6111" stroke="#266f73" stroke-width="4.1" stroke-linecap="round" /><line x1="431.6667" y1="252.5000" x2="345.0000" y2="102.3889" stroke="#205d9c" stroke-width="4.1" stroke-linecap="round" /><line x1="431.6667" y1="252.5000" x2="345.0000" y2="402.6111" stroke="#205d9c" stroke-width="4.1" stroke-linecap="round" /><line x1="85.0000" y1="252.5000" x2="431.6667" y2="252.5000" stroke="#586574" stroke-width="4.1" stroke-linecap="round" /><path d="M 408.1667 211.7968 A 47 47 0 0 0 408.1667 293.2032" stroke="#aa5411" stroke-width="2.25" fill="none" /><text x="335.6667" y="291.5000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#aa5411" text-anchor="middle">120°</text><text x="443.3333" y="342.5555" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#205d9c" text-anchor="middle">5 cm</text><circle cx="85.0" cy="252.5" r="4.9" fill="#28364b" /><text x="68.0000" y="256.5000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">P</text><circle cx="345.00000000000006" cy="102.3889300106973" r="4.9" fill="#28364b" /><text x="332.0000" y="87.3889" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">A</text><circle cx="344.99999999999994" cy="402.6110699893027" r="4.9" fill="#28364b" /><text x="332.0000" y="427.6111" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">B</text><circle cx="431.66666666666663" cy="252.5" r="4.9" fill="#28364b" /><text x="450.6667" y="267.5000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">O</text></svg>
