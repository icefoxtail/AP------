<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 685 500" width="685" height="500" role="img" aria-labelledby="title desc"><title id="title">원 밖의 점에서 원을 만나는 두 할선</title><desc id="desc">아래 할선은 P에서 C, 중심 O, D 순서로 지나고 위 할선은 P에서 A, B 순서로 간다. PA=3, AB=5, PC=2를 각각 표시했다.</desc><rect width="685" height="500" fill="white" /><circle cx="377.0" cy="250.0" r="172.5" fill="none" stroke="#205d9c" stroke-width="3.6" /><line x1="135.5000" y1="250.0000" x2="549.5000" y2="250.0000" stroke="#586574" stroke-width="4.1" stroke-linecap="round" /><line x1="135.5000" y1="250.0000" x2="352.3571" y2="79.2693" stroke="#aa5411" stroke-width="4.1" stroke-linecap="round" /><line x1="135.5000" y1="278.0000" x2="204.5000" y2="278.0000" stroke="#586574" stroke-width="1.7" stroke-linecap="round" /><line x1="135.5000" y1="272.5000" x2="135.5000" y2="283.5000" stroke="#586574" stroke-width="1.7" stroke-linecap="round" /><line x1="204.5000" y1="272.5000" x2="204.5000" y2="283.5000" stroke="#586574" stroke-width="1.7" stroke-linecap="round" /><text x="170.0000" y="310.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#586574" text-anchor="middle">2</text><line x1="116.3237" y1="225.6429" x2="197.6452" y2="161.6188" stroke="#aa5411" stroke-width="1.7" stroke-linecap="round" /><line x1="112.9215" y1="221.3214" x2="119.7260" y2="229.9643" stroke="#aa5411" stroke-width="1.7" stroke-linecap="round" /><line x1="194.2429" y1="157.2974" x2="201.0474" y2="165.9403" stroke="#aa5411" stroke-width="1.7" stroke-linecap="round" /><text x="144.6126" y="185.9166" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#aa5411" text-anchor="middle">3</text><line x1="197.6452" y1="161.6188" x2="333.1809" y2="54.9121" stroke="#aa5411" stroke-width="1.7" stroke-linecap="round" /><line x1="194.2429" y1="157.2974" x2="201.0474" y2="165.9403" stroke="#aa5411" stroke-width="1.7" stroke-linecap="round" /><line x1="329.7786" y1="50.5907" x2