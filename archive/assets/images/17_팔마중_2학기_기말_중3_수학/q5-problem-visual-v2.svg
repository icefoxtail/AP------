<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 694 427" width="694" height="427" role="img" aria-labelledby="title desc"><title id="title">지면과 25도를 이루는 비탈길</title><desc id="desc">수평 지면 위의 A에서 비탈길 AC가 출발한다. 비탈길과 지면의 각은 25도이다. C에서 지면으로 내린 수선은 B에 닿고 높이는 10 m이다.</desc><rect width="694" height="427" fill="white" /><polygon points="85.0000,345.1836 544.6926,345.1836 544.6926,130.8255" fill="none" /><line x1="85.0000" y1="345.1836" x2="602.5693" y2="103.8164" stroke="#205d9c" stroke-width="4.1" stroke-linecap="round" /><line x1="85.0000" y1="345.1836" x2="609.0000" y2="345.1836" stroke="#586574" stroke-width="4.1" stroke-linecap="round" /><line x1="544.6926" y1="345.1836" x2="544.6926" y2="130.8255" stroke="#266f73" stroke-width="4.1" stroke-linecap="round" /><line x1="544.6926" y1="329.1836" x2="528.6926" y2="329.1836" stroke="#586574" stroke-width="1.8" stroke-linecap="round" /><line x1="528.6926" y1="329.1836" x2="528.6926" y2="345.1836" stroke="#586574" stroke-width="1.8" stroke-linecap="round" /><line x1="570.6926" y1="345.1836" x2="570.6926" y2="130.8255" stroke="#266f73" stroke-width="1.7" stroke-linecap="round" /><line x1="565.1926" y1="345.1836" x2="576.1926" y2="345.1836" stroke="#266f73" stroke-width="1.7" stroke-linecap="round" /><line x1="565.1926" y1="130.8255" x2="576.1926" y2="130.8255" stroke="#266f73" stroke-width="1.7" stroke-linecap="round" /><text x="603.6926" y="246.0046" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#266f73" text-anchor="middle">10 m</text><path d="M 131.0000 345.1836 A 46 46 0 0 0 126.6902 325.7432" stroke="#205d9c" stroke-width="2.25" fill="none" /><text x="210.2977" y="331.5095" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#205d9c" text-anchor="middle">25°</text><circle cx="85.0" cy="345.1836427930851" r="4.9" fill="#28364b" /><text x="78.0000" y="371.1836" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-w