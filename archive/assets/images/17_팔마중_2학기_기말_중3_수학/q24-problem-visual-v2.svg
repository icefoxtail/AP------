<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 682 525" width="682" height="525" role="img" aria-labelledby="title desc"><title id="title">원의 중심을 지나 접선과 만나는 직선</title><desc id="desc">P에서 나온 직선은 A와 중심 O를 지나 B에 닿고 가로 접선은 T에서 원에 닿는다. P에서 할선과 접선이 30도를 이룬다. B와 T를 이은 선과 접선 위 점 C가 보인다.</desc><rect width="682" height="525" fill="white" /><circle cx="408.7146997001211" cy="262.5" r="185.0" fill="none" stroke="#205d9c" stroke-width="3.6" /><line x1="88.2853" y1="447.5000" x2="527.1147" y2="447.5000" stroke="#586574" stroke-width="4.1" stroke-linecap="round" /><line x1="88.2853" y1="447.5000" x2="568.9294" y2="170.0000" stroke="#266f73" stroke-width="4.1" stroke-linecap="round" /><line x1="568.9294" y1="170.0000" x2="408.7147" y2="447.5000" stroke="#aa5411" stroke-width="4.1" stroke-linecap="round" /><path d="M 135.2853 447.5000 A 47 47 0 0 0 128.9885 424.0000" stroke="#266f73" stroke-width="2.25" fill="none" /><text x="181.0142" y="430.6534" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#266f73" text-anchor="middle">30°</text><path d="M 424.7147 419.7872 A 32 32 0 0 1 440.7147 447.5000" stroke="#aa5411" stroke-width="2.25" fill="none" /><circle cx="88.28530029987886" cy="447.5" r="4.9" fill="#28364b" /><text x="73.2853" y="471.5000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">P</text><circle cx="248.50000000000003" cy="355.0" r="4.9" fill="#28364b" /><text x="236.5000" y="343.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">A</text><circle cx="568.9293994002423" cy="170.00000000000003" r="4.9" fill="#28364b" /><text x="583.9294" y="159.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">B</text><circle cx="408.7146997001211" cy="262.5" r="4.9" fill="#28364b" /><text x="399.7147" y="245.5000" 