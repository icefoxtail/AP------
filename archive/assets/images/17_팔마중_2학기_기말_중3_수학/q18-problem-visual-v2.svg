<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 574 535" width="574" height="535" role="img" aria-labelledby="title desc"><title id="title">지름과 현이 만나는 점까지의 거리</title><desc id="desc">원의 중심 O는 가로 지름 AB의 가운데에 있다. C와 D를 이은 현이 O 오른쪽의 P에서 지름을 만난다. 반지름은 4 cm이고 CP, DP의 길이는 각각 3 cm와 2 cm이다.</desc><rect width="574" height="535" fill="white" /><circle cx="287.0" cy="267.5" r="190.0" fill="none" stroke="#205d9c" stroke-width="3.6" /><line x1="97.0000" y1="267.5000" x2="477.0000" y2="267.5000" stroke="#586574" stroke-width="4.1" stroke-linecap="round" /><line x1="414.6770" y1="126.7925" x2="452.2290" y2="361.3050" stroke="#aa5411" stroke-width="4.1" stroke-linecap="round" /><line x1="97.0000" y1="237.5000" x2="287.0000" y2="237.5000" stroke="#586574" stroke-width="1.7" stroke-linecap="round" /><line x1="97.0000" y1="232.0000" x2="97.0000" y2="243.0000" stroke="#586574" stroke-width="1.7" stroke-linecap="round" /><line x1="287.0000" y1="232.0000" x2="287.0000" y2="243.0000" stroke="#586574" stroke-width="1.7" stroke-linecap="round" /><text x="192.0000" y="222.5000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#586574" text-anchor="middle">4 cm</text><line x1="459.9189" y1="263.8634" x2="437.3876" y2="123.1559" stroke="#aa5411" stroke-width="1.7" stroke-linecap="round" /><line x1="454.4881" y1="264.7330" x2="465.3497" y2="262.9938" stroke="#aa5411" stroke-width="1.7" stroke-linecap="round" /><line x1="431.9568" y1="124.0255" x2="442.8185" y2="122.2863" stroke="#aa5411" stroke-width="1.7" stroke-linecap="round" /><text x="498.0243" y="193.6039" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#aa5411" text-anchor="middle">3 cm</text><line x1="474.9397" y1="357.6684" x2="459.9189" y2="263.8634" stroke="#aa5411" stroke-width="1.7" stroke-linecap="round" /><line x1="469.5089" y1="358.5380" x2="480.3705" y2="356.7987" stroke="#aa5411" stroke-width="1.7" stroke-linecap="round" /><line x1="454.4881" y1="264.7330" x2="465.3497" y2="262.9938" stroke="#aa5411" stroke-width="1.7" stroke-linecap="round" /><text x="516.8003" y="310.8602" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#aa5411" text-anchor="middle">2 cm</text><circle cx="97.0" cy="267.5" r="4.9" fill="#28364b" /><text x="81.0000" y="278.5000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">A</text><circle cx="477.0" cy="267.5" r="4.9" fill="#28364b" /><text x="495.0000" y="278.5000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">B</text><circle cx="287.0" cy="267.5" r="4.9" fill="#28364b" /><text x="292.0000" y="293.5000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">O</text><circle cx="414.6769605292983" cy="126.79252418581305" r="4.9" fill="#28364b" /><text x="406.6770" y="109.7925" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">C</text><circle cx="452.22900774379787" cy="361.30498387612465" r="4.9" fill="#28364b" /><text x="468.2290" y="385.3050" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">D</text><circle cx="437.20818885799804" cy="267.5" r="4.9" fill="#28364b" /><text x="417.2082" y="294.5000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">P</text></svg>
