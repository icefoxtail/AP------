<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 666 501" width="666" height="501" role="img" aria-labelledby="title desc"><title id="title">반원에서 올라가 만나는 두 할선</title><desc id="desc">O는 반원 지름 AB의 중점이다. P에서 내린 두 직선은 각각 C를 거쳐 A, D를 거쳐 B에 닿는다. 호 위의 C와 D를 중심과 연결했다. P와 O에 같은 각 표시가 있고 B에서 65도이다.</desc><rect width="666" height="501" fill="white" /><path d="M 131.193 423.500 A 201.8071 201.8071 0 0 1 534.807 423.500 Z" fill="none" stroke="#205d9c" stroke-width="4.1" /><line x1="131.1929" y1="423.5000" x2="373.4647" y2="77.5000" stroke="#266f73" stroke-width="4.1" stroke-linecap="round" /><line x1="534.8071" y1="423.5000" x2="373.4647" y2="77.5000" stroke="#266f73" stroke-width="4.1" stroke-linecap="round" /><line x1="263.9779" y1="233.8633" x2="333.0000" y2="423.5000" stroke="#586574" stroke-width="4.1" stroke-linecap="round" /><line x1="333.0000" y1="423.5000" x2="462.7191" y2="268.9068" stroke="#586574" stroke-width="4.1" stroke-linecap="round" /><line x1="131.1929" y1="423.5000" x2="534.8071" y2="423.5000" stroke="#586574" stroke-width="4.1" stroke-linecap="round" /><path d="M 352.2424 107.8086 A 37 37 0 0 0 389.1016 111.0334" stroke="#aa5411" stroke-width="2.25" fill="none" /><path d="M 320.3453 388.7314 A 37 37 0 0 1 356.7831 395.1564" stroke="#aa5411" stroke-width="2.25" fill="none" /><path d="M 518.3250 388.1540 A 39 39 0 0 0 495.8071 423.5000" stroke="#704895" stroke-width="2.25" fill="none" /><text x="466.8660" y="398.1279" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#704895" text-anchor="middle">65°</text><circle cx="131.19287102890542" cy="423.5" r="4.9" fill="#28364b" /><text x="116.1929" y="445.5000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">A</text><circle cx="534.8071289710946" cy="423.5" r="4.9" fill="#28364b" /><text x="550.8071" y="447.5000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">B</text><circle cx="333.0" cy="423.5" r="4.9" fill="#28364b" /><text x="333.0000" y="451.5000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">O</text><circle cx="263.9778968251645" cy="233.86333008387228" r="4.9" fill="#28364b" /><text x="247.9779" y="218.8633" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">C</text><circle cx="462.71912204903305" cy="268.90677026989806" r="4.9" fill="#28364b" /><text x="474.7191" y="255.9068" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">D</text><circle cx="373.46467924946495" cy="77.5" r="4.9" fill="#28364b" /><text x="373.4647" y="60.5000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">P</text></svg>
