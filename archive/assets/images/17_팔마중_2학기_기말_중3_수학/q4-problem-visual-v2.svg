<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 563 534" width="563" height="534" role="img" aria-labelledby="title desc"><title id="title">직각삼각형에 세 변과 접하는 원</title><desc id="desc">오른쪽 C가 직각이다. B와 C 사이의 밑변은 3 cm이고 각 ABC는 60도이다. 삼각형 ABC 안의 원은 세 변에 붙고 중심은 I이다.</desc><rect width="563" height="534" fill="white" /><polygon points="390.9079,77.5000 172.0921,456.5000 390.9079,456.5000" fill="none" /><circle cx="310.81575202286814" cy="376.4078760114341" r="80.09212398856593" fill="none" stroke="#205d9c" stroke-width="3.6" /><line x1="390.9079" y1="77.5000" x2="172.0921" y2="456.5000" stroke="#586574" stroke-width="4.1" stroke-linecap="round" /><line x1="172.0921" y1="456.5000" x2="390.9079" y2="456.5000" stroke="#266f73" stroke-width="4.1" stroke-linecap="round" /><line x1="390.9079" y1="456.5000" x2="390.9079" y2="77.5000" stroke="#586574" stroke-width="4.1" stroke-linecap="round" /><line x1="374.9079" y1="456.5000" x2="374.9079" y2="440.5000" stroke="#586574" stroke-width="1.8" stroke-linecap="round" /><line x1="374.9079" y1="440.5000" x2="390.9079" y2="440.5000" stroke="#586574" stroke-width="1.8" stroke-linecap="round" /><line x1="172.0921" y1="483.5000" x2="390.9079" y2="483.5000" stroke="#266f73" stroke-width="1.7" stroke-linecap="round" /><line x1="172.0921" y1="478.0000" x2="172.0921" y2="489.0000" stroke="#266f73" stroke-width="1.7" stroke-linecap="round" /><line x1="390.9079" y1="478.0000" x2="390.9079" y2="489.0000" stroke="#266f73" stroke-width="1.7" stroke-linecap="round" /><text x="281.5000" y="509.5000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#266f73" text-anchor="middle">3 cm</text><path d="M 211.0921 456.5000 A 39 39 0 0 0 191.5921 422.7250" stroke="#aa5411" stroke-width="2.25" fill="none" /><text x="225.3120" y="434.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#aa5411" text-anchor="middle">60°</text><circle cx="390.9078760114341" cy="77.5" r="4.