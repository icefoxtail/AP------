<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 530 490" width="530" height="490" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">t=log_a 2로 두면 가로 세 칸은 t, 2t, 7t이고 가운데를 공유하는 세로 세 칸은 2t, 3t, 5t가 되는 배치이다.</title><desc id="visual-desc">같은 크기의 정사각형 다섯 개가 T자 형태로 이어져 있다. 위쪽 왼쪽부터 t, 2t, 7t를 쓰고, 중앙 아래에 3t와 5t를 위아래로 적는다.</desc><rect width="530" height="490" fill="#fff"/><g data-layer="30"><line id="edge01" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="74.821428571" y1="54.821428571" x2="201.607142857" y2="54.821428571"/></g><g data-layer="30"><line id="edge02" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="201.607142857" y1="54.821428571" x2="328.392857143" y2="54.821428571"/></g><g data-layer="30"><line id="edge03" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="328.392857143" y1="54.821428571" x2="455.178571429" y2="54.821428571"/></g><g data-layer="30"><line id="edge04" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="74.821428571" y1="54.821428571" x2="74.821428571" y2="181.607142857"/></g><g data-layer="30"><line id="edge05" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="201.607142857" y1="54.821428571" x2="201.607142857" y2="181.607142857"/></g><g data-layer="30"><line id="edge06" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1