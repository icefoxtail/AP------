<ns0:title id="title">큰 원뿔 − 작은 원뿔 해설 도식</ns0:title>
<ns0:desc id="desc">원문 그림에 풀이의 결정 관계를 추가했다. 큰 옆넓이 = 144π, 작은 옆넓이 = 36π, 밑면 둘 = 80π, 결론 188π cm²</ns0:desc>
