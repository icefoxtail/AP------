<ns0:title id="title">원기둥 − 구 2개 해설 도식</ns0:title>
<ns0:desc id="desc">원문 그림에 풀이의 결정 관계를 추가했다. 높이 = 6×2 = 12, 원기둥 = 108π, 구 둘 = 72π, 결론 36π cm³</ns0:desc>
