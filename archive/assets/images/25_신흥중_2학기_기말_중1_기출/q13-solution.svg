<ns0:title id="title">물의 부피 보존 해설 도식</ns0:title>
<ns0:desc id="desc">원문 그림에 풀이의 결정 관계를 추가했다. 원기둥 = 2πr³, 구 = 4πr³/3, 남은 물 = 4πr², 결론 r = 6 cm</ns0:desc>
