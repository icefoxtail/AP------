<ns0:title id="title">모르는 도수 채우기 해설 도식</ns0:title>
<ns0:desc id="desc">원문 그림에 풀이의 결정 관계를 추가했다. 10장 이상 = 21명, 10장 미만 = 9명, 5~10장 = 9−3, 결론 6명</ns0:desc>
