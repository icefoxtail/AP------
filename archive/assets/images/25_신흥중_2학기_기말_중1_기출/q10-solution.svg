<ns0:title id="title">겉면만 계산 해설 도식</ns0:title>
<ns0:desc id="desc">원문 그림에 풀이의 결정 관계를 추가했다. 반구 둘 = 구 1개, 곡면 넓이 = 64π, 원기둥 옆넓이 = 48π, 결론 112π cm²</ns0:desc>
