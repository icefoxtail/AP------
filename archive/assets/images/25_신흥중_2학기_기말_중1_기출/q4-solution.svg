<ns0:title id="title">안쪽·바깥쪽 원호 해설 도식</ns0:title>
<ns0:desc id="desc">원문 그림에 풀이의 결정 관계를 추가했다. 바깥 호 = 2π, 안쪽 호 = π, 직선 두 부분 = 8, 결론 3π+8 cm</ns0:desc>
