<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" width="680" height="380" role="img" aria-labelledby="title desc" data-axis-scale-mode="EQUAL_UNIT" data-unit-scale-px="45" data-fact-hash="ac5aa4091c230a109fbc31414bfdccc9eda9f4c842b86e5a45be5379fef93828" data-visual-provenance="deterministic-coordinate-facts">
<title id="title">삼각형 넓이를 이등분하는 중선</title><desc id="desc">A(-6,0), B(2,0), C(-6/13,48/13)를 꼭짓점으로 하는 삼각형과 AB의 중점 M(-2,0), 중선 CM을 실제 좌표 비율로 표시한다.</desc>
<rect width="680" height="380" fill="white"/>
<line x1="70" y1="300" x2="540" y2="300" stroke="#111" stroke-width="1.2"/><line x1="385" y1="55" x2="385" y2="345" stroke="#111" stroke-width="1.2"/>
<polygon points="115.00,300.00 475.00,300.00 364.23,133.85" fill="none" stroke="#111" stroke-width="2"/>
<line x1="364.23" y1="133.85" x2="295.00" y2="300.00" stroke="#555" stroke-width="2.2" stroke-dasharray="7 4"/>
<g font-family="sans-serif" font-size="13" fill="#111">
<circle cx="115.00" cy="300.00" r="3"/><text x="97.00" y="320.00">A(-6,0)</text>
<circle cx="475.00" cy="300.00" r="3"/><text x="467.00" y="320.00">B(2,0)</text>
<circle cx="364.23" cy="133.85" r="3"/><text x="372.23" y="125.85">C(-6/13,48/13)</text>
<circle cx="295.00" cy="300.00" r="3"/><text x="273.00" y="290.00">M(-2,0)</text>
<text x="455" y="75" font-weight="700">CM: 12x-5y+24=0</text><text x="455" y="97">AM=MB</text><text x="455" y="117">→ 두 부분의 넓이가 같음</text></g></svg>