<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 480" width="520" height="480" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">한 변의 길이가 12인 정사각형 ABCD에 내접하는 원 위의 점 P에서 변 AB와 BC에 내린 수선의 발을 각각 Q, R라 하면 직사각형 PQBR이 생긴다. 이 직사각형의 둘레가 32, 넓이가 50임이 주어져 있다.</title><desc id="visual-desc">정사각형 ABCD 안에 내접원이 있고, 원 위의 점 P에서 변 AB와 BC에 내린 수선의 발 Q, R가 표시되어 있다. 정사각형의 한 변 12와 직사각형 PQBR의 넓이 50이 보인다.</desc><rect width="520" height="480" fill="#fff"/><g data-layer="10"><path id="rg0" data-role="region" stroke="none" stroke-width="1.6" fill="#e4e7ec" data-owner-points="B P Q R" data-mark="region" data-mark-id="rg0" fill-rule="evenodd" d="M437.717966733 293.908442924 L74.285714286 293.908442924 L74.285714286 425.714285714 L437.717966733 425.714285714 L437.717966733 293.908442924 Z"/></g><g data-layer="30"><line id="AQ" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="74.285714286" y1="54.285714286" x2="74.285714286" y2="293.908442924"/></g><g data-layer="30"><line id="QB" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="74.285714286" y1="293.908442924" x2="74.285714286" y2="425.714285714"/></g><g data-layer="30"><line id="BR" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="74.285714286" y1="425.714285714" x2="437.717966733" y2="425.714285714"/></g><g data-layer="30"><line id="RC" data-role="line" stroke