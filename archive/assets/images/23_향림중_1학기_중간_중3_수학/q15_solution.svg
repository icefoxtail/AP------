<svg xmlns="http://www.w3.org/2000/svg" width="800" height="360" viewBox="0 0 800 360"><rect width="800" height="360" rx="18" fill="#ffffff"/><style>text{font-family:"Noto Sans CJK KR","Malgun Gothic",sans-serif;fill:#222;font-size:19px}.lab{font-size:19px;font-weight:bold}.hint{font-size:19px;fill:#263f7a}line,path,rect{stroke-linecap:round}</style><text x="34" y="42" class="lab">q15 | 색칠한 직사각형의 가로 × 세로</text><rect x="160" y="90" width="440" height="190" fill="none" stroke="#333" stroke-width="2.5"/><rect x="160" y="90" width="440" height="143" fill="#d9eafa" stroke="#355a7a" stroke-width="2.6"/><line x1="160" y1="233" x2="600" y2="233" stroke="#555" stroke-dasharray="6 5" stroke-width="2"/><text x="360" y="80" text-anchor="middle">5x + 4</text><text x="138" y="186" text-anchor="end">4x - 3</text><text x="620" y="267">3</text><text x="380" y="169" text-anchor="middle" class="hint">(5x + 4)(4x - 3)</text><text x="380" y="322" text-anchor="middle">= 20x² + x - 12</text></svg>