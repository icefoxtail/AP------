<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 368 288" width="368" height="288" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-ellipse-figure="ellipse-figure-v1" data-major-axis="X" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="6" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round"><title id="visual-title">원점 중심 타원 위 대표점 P와 같은 방향의 단위벡터 종점 Q를 표시한 문제 도식이다.</title><desc id="visual-desc">가로 반지름 3, 세로 반지름 2인 타원과 중심 O가 있다. 대표점 P는 타원의 맨 위, Q는 같은 반직선의 원점으로부터 거리 1인 곳에 표시된다. Q 전체의 자취는 그려지지 않는다.</desc><rect width="368" height="288" fill="#fff"/><g data-layer="10"><line id="axis-x" data-role="axis" data-axis="x" x1="34" y1="144" x2="334" y2="144" fill="none" stroke="#444" stroke-width="1.1"/></g><g data-layer="10"><line id="axis-y" data-role="axis" data-axis="y" x1="184" y1="254" x2="184" y2="34" fill="none" stroke="#444" stroke-width="1.1"/></g><g data-layer="11"><polygon id="axis-x-head" data-role="axis-head" data-axis="x" points="334,144 325,140.4 325,147.6" fill="#444" stroke="none"/></g><g data-layer="11"><polygon id="axis-y-head" data-role="axis-head" data-axis="y" points="184,34 180.4,43 187.6,43" fill="#444" stroke="none"/></g><g data-layer="25"><ellipse id="ellipse" data-role="ellipse" cx="184" cy="144" rx="120" ry="80" fill="none" stroke="#111" stroke-width="1.7"/></g><g data-layer="30"><line id="segment-sOP" data-role="segment" data-from="O" data-to="P" x1="184" y1="144" x2="184" y2="64" fill="none" stroke="#111" stroke-width="1.3"/></g><g data-layer="30"><line id="segment-sOQ" data-role="segment" data-from="O" data-to="Q" x1="184" y1="144" x2="184" y2="104" fill="none" stroke="#111" stroke-width="1.3" stroke-dasharray="7 5"/></g><g data-layer="40"><circle id="point-O" data-role="point" data-point="O" cx="184" cy="144" r="3.2" fill="#111" stroke="none"/></g><g data-layer="40"><circle id="point-P" data-role="point" data-point="P" cx="184" cy="64" r="3.2" fill=