<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="720" height="360" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">왼쪽부터 한 변의 길이가 2인 정사각형 두 개를 붙인 직사각형, 그 도형을 네 조각으로 자른 모양, 같은 조각을 재배열하여 만든 정사각형이 차례로 놓여 있다.</title><desc id="visual-desc">직사각형은 가로로 긴 두 정사각형으로 이루어져 있고, 가운데 그림에서는 두 정사각형에 각각 대각선이 그어져 네 개의 삼각형 조각이 된다. 오른쪽에는 네 삼각형을 돌려 붙여 만든 마름모 모양의 정사각형이 있다.</desc><rect width="720" height="360" fill="#fff"/><g data-layer="30"><line id="sAM" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="67.142857143" y1="216.607142857" x2="140.357142857" y2="216.607142857"/></g><g data-layer="30"><line id="sMB" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="140.357142857" y1="216.607142857" x2="213.571428571" y2="216.607142857"/></g><g data-layer="30"><line id="sBC" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="213.571428571" y1="216.607142857" x2="213.571428571" y2="143.392857143"/></g><g data-layer="30"><line id="sCN" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="213.571428571" y1="143.392857143" x2="140.357142857" y2="143.392857143"/></g><g data-layer="30"><line id="sND" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="140.357142857" y1="143.392857143" x2="67.142857143" y2="143.392857143"/></g><g data-layer="30"><line id="sDA" data-role="line" stro