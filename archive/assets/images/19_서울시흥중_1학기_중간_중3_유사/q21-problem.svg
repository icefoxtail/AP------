<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 380" width="480" height="380" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">큰 반원 O의 지름을 4와 2a로 나누고, 지름이 4인 반원은 큰 반원에서 제외하며 지름이 2a인 반원은 아래쪽에 붙인 그림이다. 색칠한 부분은 큰 반원에서 작은 반원을 뺀 뒤 아래쪽 반원을 더한 영역이다.</title><desc id="visual-desc">큰 반원 O의 지름 위에 두 부분 4와 2a가 표시되어 있고, 왼쪽 부분에는 위쪽으로 볼록한 작은 반원, 오른쪽 부분에는 아래쪽으로 볼록한 반원이 그려져 있다. 큰 반원과 두 작은 반원이 만드는 색칠한 영역과 중심 O가 보인다.</desc><rect width="480" height="380" fill="#fff"/><g data-layer="10"><path id="shaded" data-role="region" stroke="none" stroke-width="1.6" fill="#f2a65a" data-owner-points="A B C M1 M2 O" data-mark="region" data-mark-id="shaded" fill-opacity="0.42" fill-rule="evenodd" d="M68.260869565 224.347826087 A171.739130435 171.739130435 0 0 1 411.739130435 224.347826087 A103.043478261 103.043478261 0 0 1 205.652173913 224.347826087 A68.695652174 68.695652174 0 0 0 68.260869565 224.347826087 Z"/></g><g data-layer="30"><line id="sAC" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="68.260869565" y1="224.347826087" x2="205.652173913" y2="224.347826087"/></g><g data-layer="30"><line id="sCB" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="205.652173913" y1="224.347826087" x2="411.739130435" y2="224.347826087"/></g><g data-layer="40"><polyline id="arcLarge" data-role="circularArc" stroke="#111" stroke-width="2.05" fi