<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" role="img" aria-labelledby="title desc">
  <title id="title">점 P를 중심으로 한 원과 수직선</title>
  <desc id="desc">모눈 한 칸은 1이고, 점 Q와 점 P를 이은 선분이 원의 반지름이다. 원과 수직선의 교점은 A와 B이다.</desc>
  <rect width="800" height="380" fill="#ffffff"/>
  <text x="40" y="42" font-size="24" font-family="sans-serif" fill="#202a37">모눈의 한 칸은 1</text>
  <g stroke="#dbe4ee" stroke-width="1">
    <path d="M90 60V290 M160 60V290 M230 60V290 M300 60V290 M370 60V290 M440 60V290 M510 60V290 M580 60V290 M650 60V290 M720 60V290"/>
    <path d="M90 130H720 M90 200H720 M90 270H720"/>
  </g>
  <path d="M148.6 270 A221.4 221.4 0 0 1 591.4 270" fill="none" stroke="#2474b8" stroke-width="4"/>
  <path d="M160 200 L370 270" stroke="#bf4b38" stroke-width="3"/>
  <path d="M58 270 H752" stroke="#263548" stroke-width="3"/>
  <path d="M752 270 l-12 -7 v14 z" fill="#263548"/>
  <g stroke="#263548" stroke-width="2">
    <path d="M90 262V278 M160 262V278 M230 262V278 M300 262V278 M370 262V278 M440 262V278 M510 262V278 M580 262V278 M650 262V278 M720 262V278"/>
  </g>
  <g font-size="19" text-anchor="middle" font-family="sans-serif" fill="#263548">
    <text x="90" y="306">−1</text><text x="160" y="306">0</text><text x="230" y="306">1</text><text x="300" y="306">2</text><text x="370" y="306">3</text><text x="440" y="306">4</text><text x="510" y="306">5</text><text x="580" y="306">6</text><text x="650" y="306">7</text>
  </g>
  <circle cx="160" cy="200" r="5" fill="#bf4b38"/><circle cx="370" cy="270" r="5" fill="#bf4b38"/>
  <circle cx="148.6" cy="270" r="6" fill="#2474b8"/><circle cx="591.4" cy="270" r="6" fill="#2474b8"/>
  <g font-size="20" font-weight="600" font-family="sans-serif" fill="#18324b">
    <text x="160" y="185" text-anchor="middle">Q</text><text x="382" y="250">P</text>
    <text x="148.6" y="340" text-anchor="middle">A</text><text x="591.4" y="340" text-anchor="middle">B</text>
  </g>
  <text x="400" y="365" text-anchor="middle" font-size="18" font-family="sans-serif" fill="#43556b">반지름 PQ의 길이와 두 교점의 위치를 그림에서 확인한다.</text>
</svg>
