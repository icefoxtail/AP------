<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" role="img" aria-label="3-3-5-7 사다리꼴 밑면의 기둥 겉넓이 계산 해설도">
<rect width="100%" height="100%" fill="white"/>
<g stroke="#222" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round">

<polygon points="130,290 130,140 280,140 480,290"/>
<line x1="130" y1="290" x2="480" y2="290"/>
<path d="M130 275 L145 275 L145 290"/>
<path d="M130 140 L145 140 L145 155"/>
<text x="200" y="125" fill="#111" stroke="none" font-size="18" font-family="sans-serif">3 cm</text>
<text x="300" y="320" fill="#111" stroke="none" font-size="18" font-family="sans-serif">7 cm</text>
<text x="77" y="220" fill="#111" stroke="none" font-size="18" font-family="sans-serif">3 cm</text>
<text x="390" y="205" fill="#111" stroke="none" font-size="18" font-family="sans-serif">5 cm</text>
<text x="320" y="70" fill="#111" stroke="none" font-size="18" text-anchor="middle" font-family="sans-serif">밑넓이 = (3+7)×3÷2 = 15</text>
<text x="320" y="365" fill="#111" stroke="none" font-size="18" text-anchor="middle" font-family="sans-serif">밑면 둘레 18, 기둥 높이 8 → 겉넓이 = 30+144 = 174 cm²</text>

</g>
</svg>