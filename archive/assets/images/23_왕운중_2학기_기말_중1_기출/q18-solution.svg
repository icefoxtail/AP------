<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" role="img" aria-label="반지름 3cm인 서로 접하는 세 원의 테이프 길이를 직선 부분과 원호 부분으로 나눈 해설도">
<rect width="100%" height="100%" fill="white"/>
<g stroke="#222" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round">

<circle cx="250" cy="245" r="70"/>
<circle cx="390" cy="245" r="70"/>
<circle cx="320" cy="123.756" r="70"/>
<circle cx="250" cy="245" r="3.5" fill="#111" stroke="none"/>
<circle cx="390" cy="245" r="3.5" fill="#111" stroke="none"/>
<circle cx="320" cy="123.756" r="3.5" fill="#111" stroke="none"/>
<line x1="250" y1="245" x2="390" y2="245" stroke-dasharray="5 5"/>
<line x1="250" y1="245" x2="320" y2="123.756" stroke-dasharray="5 5"/>
<line x1="390" y1="245" x2="320" y2="123.756" stroke-dasharray="5 5"/>
<text x="320" y="270" fill="#111" stroke="none" font-size="17" text-anchor="middle" font-family="sans-serif">중심 사이 6 cm</text>
<text x="320" y="35" fill="#111" stroke="none" font-size="18" text-anchor="middle" font-family="sans-serif">반지름 3 cm · 직선 부분 합 = 6×3 = 18</text>
<text x="320" y="365" fill="#111" stroke="none" font-size="18" text-anchor="middle" font-family="sans-serif">원호 부분 합 = 2π×3 = 6π → 전체 = 18+6π</text>

</g>
</svg>