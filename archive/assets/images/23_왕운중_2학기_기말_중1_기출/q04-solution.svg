<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" role="img" aria-label="오각형 내각의 합 식으로 x=60을 구하는 해설도">
<rect width="100%" height="100%" fill="white"/>
<g stroke="#222" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round">

<polygon points="170,300 110,170 240,70 420,120 480,300"/>
<text x="140" y="235" fill="#111" stroke="none" font-size="18" font-family="sans-serif">85°</text>
<text x="165" y="125" fill="#111" stroke="none" font-size="18" font-family="sans-serif">110°</text>
<text x="310" y="103" fill="#111" stroke="none" font-size="18" font-family="sans-serif">(195−x)°</text>
<text x="438" y="210" fill="#111" stroke="none" font-size="18" font-family="sans-serif">2x°</text>
<text x="425" y="285" fill="#111" stroke="none" font-size="18" font-family="sans-serif">90°</text>
<text x="320" y="355" fill="#111" stroke="none" font-size="17" text-anchor="middle" font-family="sans-serif">85+110+2x+90+(195−x)=540  →  x=60</text>

</g>
</svg>