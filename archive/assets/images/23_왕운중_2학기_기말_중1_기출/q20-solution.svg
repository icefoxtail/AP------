<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" role="img" aria-label="속이 빈 원기둥의 안쪽 반지름 2, 바깥 반지름 5, 높이 6 해설도">
<rect width="100%" height="100%" fill="white"/>
<g stroke="#222" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round">

<rect x="170" y="90" width="300" height="220"/>
<rect x="260" y="90" width="120" height="220" stroke-dasharray="6 5"/>
<line x1="320" y1="55" x2="320" y2="345" stroke-dasharray="6 5"/>
<text x="330" y="50" fill="#111" stroke="none" font-size="18" font-family="sans-serif">회전축 l</text>
<text x="205" y="80" fill="#111" stroke="none" font-size="17" font-family="sans-serif">바깥 반지름 5</text>
<text x="330" y="200" fill="#111" stroke="none" font-size="17" font-family="sans-serif">안쪽 반지름 2</text>
