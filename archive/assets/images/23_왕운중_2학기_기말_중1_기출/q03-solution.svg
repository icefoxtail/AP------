<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" role="img" aria-label="삼각형의 세 외각 합을 이용해 x=125를 구하는 해설도">
<rect width="100%" height="100%" fill="white"/>
<g stroke="#222" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round">

<polygon points="155,300 485,300 345,100"/>
<line x1="155" y1="300" x2="70" y2="350"/>
<line x1="485" y1="300" x2="565" y2="350"/>
<line x1="345" y1="100" x2="345" y2="35"/>
<text x="110" y="325" fill="#111" stroke="none" font-size="18" font-family="sans-serif">x°</text>
<text x="500" y="330" fill="#111" stroke="none" font-size="18" font-family="sans-serif">124°</text>
<text x="360" y="80" fill="#111" stroke="none" font-size="18" font-family="sans-serif">(x−14)°</text>
<text x="320" y="375" fill="#111" stroke="none" font-size="19" text-anchor="middle" font-family="sans-serif">x + (x−14) + 124 = 360  →  x = 125</text>

</g>
</svg>