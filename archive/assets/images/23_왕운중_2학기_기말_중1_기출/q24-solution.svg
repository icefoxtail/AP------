<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" role="img" aria-label="원뿔대의 반지름 9와 3, 높이 8, 모선 10 및 연장 모선 15와 5의 관계 해설도">
<rect width="100%" height="100%" fill="white"/>
<g stroke="#222" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round">

<line x1="460" y1="45" x2="460" y2="340"/>
<polygon points="190,300 460,300 460,140 370,140"/>
<line x1="190" y1="300" x2="460" y2="300"/>
<line x1="370" y1="140" x2="460" y2="140"/>
<line x1="190" y1="300" x2="370" y2="140"/>
<line x1="370" y1="140" x2="460" y2="60" stroke-dasharray="6 5"/>
<line x1="190" y1="300" x2="460" y2="60" stroke-dasharray="6 5"/>
<text x="325" y="325" fill="#111" stroke="none" font-size="18" font-family="sans-serif">9 cm</text>
<text x="414" y="128" fill="#111" stroke="none" font-size="18" font-family="sans-serif">3 cm</text>
<text x="275" y="205" fill="#111" stroke="none" font-size="18" font-family="sans-serif">10 cm</text>
<text x="478" y="225" fill="#111" stroke="none" font-size="18" font-family="sans-serif">8 cm</text>
<text x="405" y="87" fill="#111" stroke="none" font-size="17" font-family="sans-serif">5</text>
<text x="245" y="145" fill="#111" stroke="none" font-size="17" font-family="sans-serif">큰 모선 15</text>
<text x="320" y="370" fill="#111" stroke="none" font-size="16" text-anchor="middle" font-family="sans-serif">전개도 옆면: 바깥 15, 안쪽 5, 중심각 216° → 겉넓이 210π cm²</text>

</g>
</svg>