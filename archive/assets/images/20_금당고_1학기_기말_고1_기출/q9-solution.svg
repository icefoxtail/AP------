<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="760" viewBox="0 0 1000 760" preserveAspectRatio="xMidYMid meet" role="img" aria-label="두 직선의 각의 이등분선 두 개와 음의 기울기 선택">
<title>두 직선이 이루는 각의 이등분선</title><style>
.title{font:700 25px "Malgun Gothic","Noto Sans KR",sans-serif;fill:#172033}
.label{font:18px "Malgun Gothic","Noto Sans KR",sans-serif;fill:#172033}
.small{font:16px "Malgun Gothic","Noto Sans KR",sans-serif;fill:#334155}
.math{font:italic 18px "Cambria Math","Times New Roman",serif;fill:#172033}
.axis{stroke:#cbd5e1;stroke-width:1.4}
.given{stroke:#64748b;stroke-width:2.5}
.selected{stroke:#0f766e;stroke-width:3.5}
.other{stroke:#d97706;stroke-width:2.2;stroke-dasharray:8 6}
.point{fill:#172033;stroke:#fff;stroke-width:2}
.panel{fill:#f8fafc;stroke:#cbd5e1;stroke-width:1.3}
</style>
<rect x="0" y="0" width="1000" height="760" fill="#fff"/>
<text class="title" x="45" y="48">두 직선이 이루는 각의 이등분선</text>
<rect class="panel" x="730" y="115" width="235" height="360" rx="18"/>
<line class="axis" x1="100" y1="400" x2="700" y2="400"/><line class="axis" x1="300" y1="100" x2="300" y2="700"/>
<line class="given" x1="275" y1="100" x2="700" y2="666.667"/>
<line class="given" x1="100" y1="700" x2="700" y2="250"/>
<line class="selected" x1="100" y1="342.857" x2="700" y2="428.571"/>
<line class="other" x1="457.143" y1="700" x2="542.857" y2="100"/>
<circle class="point" cx="500" cy="400" r="6"/>
<text class="math" x="250" y="135">4x+3y−11=0</text>
<text class="math" x="110" y="680">3x−4y−2=0</text>
<text class="math" x="110" y="325">x+7y−9=0</text>
<text class="math" x="548" y="145">7x−y−13=0</text>
<text class="math" x="690" y="390">x</text><text class="math" x="310" y="115">y</text>
<text class="label" x="755" y="165">같은 거리인 점의 자취</text>
<line x1="755" y1="205" x2="805" y2="205" class="selected"/>
<text class="small" x="820" y="211">선택한 이등분선</text>
<line x1="755" y1="245" x2="805" y2="245" class="other"/>
<text class="small" x="820" y="251">다른 이등분선</text>
<text class="small" x="755" y="315">기울기 −1/7</text>
<text class="label" x="755" y="365">음의 기울기</text>
<text class="math" x="755" y="410">x+7y−9=0</text>
</svg>