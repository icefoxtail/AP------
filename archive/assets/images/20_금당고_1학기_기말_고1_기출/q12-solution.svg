<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="760" viewBox="0 0 1000 760" preserveAspectRatio="xMidYMid meet" role="img" aria-label="원 위의 점에서 직선 AB까지의 거리와 삼각형 넓이">
<title>원 위의 점과 삼각형 PAB의 넓이</title><style>
.title{font:700 25px "Malgun Gothic","Noto Sans KR",sans-serif;fill:#172033}
.label{font:18px "Malgun Gothic","Noto Sans KR",sans-serif;fill:#172033}
.small{font:16px "Malgun Gothic","Noto Sans KR",sans-serif;fill:#334155}
.math{font:italic 18px "Cambria Math","Times New Roman",serif;fill:#172033}
.axis{stroke:#cbd5e1;stroke-width:1.4}.base{stroke:#334155;stroke-width:2.8}
.circle{fill:#eff6ff;fill-opacity:.65;stroke:#2563eb;stroke-width:2.8}
.normal{stroke:#64748b;stroke-width:1.6;stroke-dasharray:7 5}
.near{stroke:#0f766e;stroke-width:3}.far{stroke:#d97706;stroke-width:3}
.point{fill:#172033;stroke:#fff;stroke-width:2}.center{fill:#2563eb;stroke:#fff;stroke-width:2}
.panel{fill:#f8fafc;stroke:#cbd5e1;stroke-width:1.3}
</style>
<rect x="0" y="0" width="1000" height="760" fill="#fff"/>
<text class="title" x="45" y="48">원 위의 점에서 직선 AB까지의 거리</text>
<rect class="panel" x="735" y="120" width="230" height="440" rx="18"/>
<line class="axis" x1="390" y1="80" x2="390" y2="700"/><line class="axis" x1="80" y1="390" x2="700" y2="390"/>
<line class="base" x1="441.667" y1="700" x2="700" y2="390"/>
<circle class="circle" cx="441.667" cy="493.333" r="73.068"/>
<line class="normal" x1="390" y1="441.667" x2="545" y2="596.667"/>
<line class="near" x1="493.333" y1="545" x2="545" y2="596.667"/>
<line class="far" x1="390" y1="441.667" x2="545" y2="596.667"/>
<circle class="point" cx="493.333" cy="545" r="6"/><circle class="point" cx="390" cy="441.667" r="6"/>
<circle class="center" cx="441.667" cy="493.333" r="6"/><circle class="point" cx="545" cy="596.667" r="5"/>
<circle class="point" cx="493.333" cy="648.333" r="5"/><circle class="point" cx="596.667" cy="545" r="5"/>
<text class="math" x="503" y="540">P₁</text><text class="math" x="350" y="430">P₂</text><text class="math" x="447" y="485">C</text><text class="math" x="552" y="615">H</text>
<text class="math" x="475" y="668">A</text><text class="math" x="603" y="540">B</text>
<text class="math" x="695" y="380">x</text><text class="math" x="400" y="100">y</text>
<text class="label" x="760" y="175">r=√2,  d(C,AB)=2√2</text>
<text class="small" x="760" y="235">P₁: 거리 √2</text><text class="small" x="760" y="275">넓이 2</text>
<text class="small" x="760" y="345">P₂: 거리 3√2</text><text class="small" x="760" y="385">넓이 6</text>
<line x1="760" y1="430" x2="940" y2="430" stroke="#cbd5e1" stroke-width="1.5"/>
<text class="math" x="760" y="485">최댓값+최솟값=8</text>
</svg>