<svg xmlns="http://www.w3.org/2000/svg" width="620" height="390" viewBox="0 0 620 390"><rect width="620" height="390" fill="#fff"/><style>text{font-family:Arial,'Noto Sans KR',sans-serif;fill:#172033}.s{font-size:15px}.l{font-size:17px;font-weight:600}</style><text x="30" y="34" class="l">정사각형의 한 변 AB가 x축에 의해 이등분된다.</text><line x1="38" y1="180" x2="326" y2="180" stroke="#64748b" stroke-width="2"/><path d="M326 180l-9-5v10z" fill="#64748b"/><line x1="120" y1="345" x2="120" y2="56" stroke="#64748b" stroke-width="2"/><path d="M120 56l-5 9h10z" fill="#64748b"/><text x="330" y="185" class="s">x</text><text x="126" y="56" class="s">y</text><polygon points="232,124 288,236 176,292 120,180" fill="#bfdbfe" fill-opacity=".7" stroke="#2563eb" stroke-width="3"/><line x1="232" y1="124" x2="288" y2="236" stroke="#ea580c" stroke-width="4"/><circle cx="232" cy="124" r="5" fill="#2563eb"/><circle cx="288" cy="236" r="5" fill="#2563eb"/><circle cx="176" cy="292" r="5" fill="#2563eb"/><circle cx="120" cy="180" r="5" fill="#2563eb"/><circle cx="260" cy="180" r="6" fill="#ea580c"/><text x="213" y="116" class="l">A</text><text x="295" y="240" class="l">B</text><text x="181" y="315" class="l">C</text><text x="99" y="177" class="l">O</text><text x="254" y="204" class="l">M(4, 0)</text><text x="365" y="92" class="s">OA ⟂ AB,  OA=AB</text><text x="365" y="130" class="s">AB: x+my−4=0</text><text x="365" y="178" class="s">M은 x축과 AB의 교점이며</text><text x="365" y="202" class="s">선분 AB의 중점이다.</text><text x="365" y="250" class="s">A=(16/5, 8/5)</text><text x="365" y="274" class="s">B=(24/5, −8/5)</text><text x="365" y="312" class="s">m=1/2</text><text x="365" y="348" class="l">8m=4</text></svg>