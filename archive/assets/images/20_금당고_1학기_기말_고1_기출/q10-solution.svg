<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="760" viewBox="0 0 1000 760" preserveAspectRatio="xMidYMid meet" role="img" aria-label="직선의 교점이 제1사분면에 있도록 하는 k의 범위">
<title>직선의 교점과 제1사분면</title><style>
.title{font:700 25px "Malgun Gothic","Noto Sans KR",sans-serif;fill:#172033}
.label{font:18px "Malgun Gothic","Noto Sans KR",sans-serif;fill:#172033}
.small{font:16px "Malgun Gothic","Noto Sans KR",sans-serif;fill:#334155}
.math{font:italic 18px "Cambria Math","Times New Roman",serif;fill:#172033}
.axis{stroke:#334155;stroke-width:1.8}
.base{stroke:#2563eb;stroke-width:2.5}
.segment{stroke:#0f766e;stroke-width:5}
.boundary{stroke:#64748b;stroke-width:2.1;stroke-dasharray:8 6}
.representative{stroke:#d97706;stroke-width:2.6}
.open{fill:#fff;stroke:#0f766e;stroke-width:2.4}
.point{fill:#d97706;stroke:#fff;stroke-width:2}
.panel{fill:#f8fafc;stroke:#cbd5e1;stroke-width:1.3}
</style>
<rect x="0" y="0" width="1000" height="760" fill="#fff"/>
<text class="title" x="45" y="48">두 직선의 교점이 제1사분면에 있을 조건</text>
<rect class="panel" x="740" y="125" width="230" height="390" rx="18"/>
<line class="axis" x1="200" y1="100" x2="200" y2="700"/><line class="axis" x1="100" y1="600" x2="700" y2="600"/>
<line class="base" x1="100" y1="225" x2="700" y2="675"/>
<line class="segment" x1="200" y1="300" x2="600" y2="600"/>
<line class="boundary" x1="100" y1="500" x2="300" y2="100"/>
<line class="boundary" x1="100" y1="500" x2="700" y2="620"/>
<line class="representative" x1="100" y1="500" x2="700" y2="500"/>
<circle class="open" cx="200" cy="300" r="7"/><circle class="open" cx="600" cy="600" r="7"/>
<circle class="point" cx="466.667" cy="500" r="5"/>
<text class="math" x="185" y="285">(0,3)</text><text class="math" x="605" y="625">(4,0)</text>
<text class="math" x="300" y="245">3x+4y−12=0</text>
<text class="math" x="285" y="135">k=2</text><text class="math" x="615" y="650">k=−1/5</text>
<text class="math" x="470" y="490">k=0</text><text class="math" x="685" y="590">x</text><text class="math" x="210" y="115">y</text>
<text class="label" x="765" y="180">경계에서</text><text class="math" x="765" y="220">k=2,  k=−1/5</text>
<text class="small" x="765" y="280">축 위의 끝점은</text><text class="small" x="765" y="305">제1사분면에서 제외</text>
<line x1="770" y1="355" x2="930" y2="355" stroke="#cbd5e1" stroke-width="1.5"/>
<text class="math" x="765" y="405">−1/5&lt;k&lt;2</text>
<text class="math" x="765" y="455">α+β=9/5</text>
</svg>