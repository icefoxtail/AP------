<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="760" viewBox="0 0 1000 760" preserveAspectRatio="xMidYMid meet" role="img" aria-label="양의 y축에 접하고 x축에 길이 2인 현을 만드는 원">
<title>축에 접하는 원과 x축의 현</title><style>
.title{font:700 25px "Malgun Gothic","Noto Sans KR",sans-serif;fill:#172033}
.label{font:18px "Malgun Gothic","Noto Sans KR",sans-serif;fill:#172033}
.small{font:16px "Malgun Gothic","Noto Sans KR",sans-serif;fill:#334155}
.math{font:italic 18px "Cambria Math","Times New Roman",serif;fill:#172033}
.axis{stroke:#334155;stroke-width:1.8}.locus{stroke:#94a3b8;stroke-width:1.8;stroke-dasharray:8 6}
.circle{fill:#eff6ff;fill-opacity:.5;stroke:#2563eb;stroke-width:3}
.radius{stroke:#0f766e;stroke-width:3}.chord{stroke:#d97706;stroke-width:4}
.point{fill:#172033;stroke:#fff;stroke-width:2}.tangent{fill:#d97706;stroke:#fff;stroke-width:2}
.panel{fill:#f8fafc;stroke:#cbd5e1;stroke-width:1.3}
</style>
<rect x="0" y="0" width="1000" height="760" fill="#fff"/>
<text class="title" x="45" y="48">축에 접하는 원과 x축의 현</text><rect class="panel" x="735" y="120" width="235" height="370" rx="18"/>
<line class="locus" x1="180" y1="80" x2="680" y2="580"/>
<circle class="circle" cx="440" cy="340" r="260"/>
<line class="axis" x1="180" y1="80" x2="180" y2="680"/><line class="axis" x1="80" y1="580" x2="700" y2="580"/>
<line class="radius" x1="180" y1="340" x2="440" y2="340"/>
<line class="chord" x1="340" y1="580" x2="540" y2="580"/>
<line x1="440" y1="340" x2="440" y2="580" stroke="#64748b" stroke-width="1.7" stroke-dasharray="6 5"/>
<path d="M180 340 L198 340 L198 358 L180 358" fill="none" stroke="#0f766e" stroke-width="2"/>
<circle class="point" cx="440" cy="340" r="6"/><circle class="tangent" cx="180" cy="340" r="6"/><circle class="point" cx="340" cy="580" r="5"/><circle class="point" cx="440" cy="580" r="5"/><circle class="point" cx="540" cy="580" r="5"/>
<text class="math" x="448" y="330">C(13/5,12/5)</text><text class="math" x="185" y="325">T</text><text class="math" x="440" y="610" text-anchor="middle">현의 중점</text>
<text class="math" x="180" y="700">x=0</text><text class="math" x="690" y="570">x</text><text class="math" x="190" y="95">y</text>
<text class="math" x="240" y="320">r=13/5</text><text class="math" x="370" y="565">1</text><text class="math" x="472" y="565">1</text>
<text class="small" x="760" y="175">중심: x+y=5</text><text class="small" x="760" y="230">x축의 현: 2</text>
<text class="small" x="760" y="285">반 현: 1</text><text class="small" x="760" y="340">반지름: 13/5</text><text class="math" x="760" y="420">α−β=8</text>
</svg>