<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="900" viewBox="0 0 1120 900" preserveAspectRatio="xMidYMid meet" role="img" aria-label="평행선 사이의 두 닮은 삼각형과 둘레">
<title>평행선과 닮은 삼각형의 둘레</title><style>
.title{font:700 25px "Malgun Gothic","Noto Sans KR",sans-serif;fill:#172033}
.label{font:17px "Malgun Gothic","Noto Sans KR",sans-serif;fill:#172033}
.small{font:16px "Malgun Gothic","Noto Sans KR",sans-serif;fill:#334155}
.math{font:italic 18px "Cambria Math","Times New Roman",serif;fill:#172033}
.parallel{stroke:#334155;stroke-width:2.5}.diag{stroke:#475569;stroke-width:2.8}
.smallTri{fill:#0f766e;fill-opacity:.14;stroke:#0f766e;stroke-width:3.2}
.bigTri{fill:#2563eb;fill-opacity:.12;stroke:#2563eb;stroke-width:3.2}
.given{fill:#172033}.derived{fill:#0f766e}.panel{fill:#f8fafc;stroke:#cbd5e1;stroke-width:1.3}
</style>
<rect x="0" y="0" width="1120" height="900" fill="#fff"/>
<text class="title" x="45" y="48">평행선과 닮은 삼각형의 둘레</text>
<rect class="panel" x="950" y="115" width="150" height="600" rx="18"/>
<polygon class="smallTri" points="156,212 506,212 380,380"/>
<polygon class="bigTri" points="380,380 128,716 828,716"/>
<line class="parallel" x1="100" y1="212" x2="900" y2="212"/><line class="parallel" x1="80" y1="716" x2="900" y2="716"/>
<line class="diag" x1="156" y1="212" x2="828" y2="716"/><line class="diag" x1="128" y1="716" x2="506" y2="212"/>
<path d="M450 212 l10 -8 l10 8" fill="none" stroke="#172033" stroke-width="2"/><path d="M450 716 l10 -8 l10 8" fill="none" stroke="#172033" stroke-width="2"/>
<circle cx="156" cy="212" r="5" fill="#172033"/><circle cx="506" cy="212" r="5" fill="#172033"/><circle cx="380" cy="380" r="5" fill="#172033"/><circle cx="128" cy="716" r="5" fill="#172033"/><circle cx="828" cy="716" r="5" fill="#172033"/>
<text class="math" x="137" y="198">E</text><text class="math" x="510" y="198">D</text><text class="math" x="390" y="375">C</text><text class="math" x="108" y="740">A</text><text class="math" x="836" y="740">B</text>
<text class="math" x="875" y="205">l</text><text class="math" x="875" y="710">m</text><text class="math" x="735" y="385">l∥m</text>
<text class="label given" x="318" y="190">ED=5</text><text class="label given" x="468" y="752">AB=10</text><text class="label given" x="448" y="300">CD=3</text>
<text class="label derived" x="205" y="300">CE=4</text><text class="label derived" x="200" y="565">CA=6</text><text class="label derived" x="635" y="560">CB=8</text>
<text class="small" x="970" y="170">△CDE∼△CAB</text><text class="math" x="970" y="225">1:2</text>
<text class="small" x="970" y="300">a=12</text><text class="small" x="970" y="345">b=24</text>
<line x1="970" y1="390" x2="1080" y2="390" stroke="#cbd5e1" stroke-width="1.4"/>
<text class="math" x="970" y="450">a+b=36</text>
</svg>