<svg xmlns="http://www.w3.org/2000/svg" width="650" height="430" viewBox="0 0 650 430"><rect width="650" height="430" fill="#fff"/><style>text{font-family:Arial,'Noto Sans KR',sans-serif;fill:#172033}.s{font-size:15px}.l{font-size:17px;font-weight:600}</style><text x="30" y="34" class="l">두 좌표축에 접하는 원의 중심: (±r, ±r)</text><line x1="45" y1="210" x2="366" y2="210" stroke="#64748b" stroke-width="2"/><path d="M366 210l-9-5v10z" fill="#64748b"/><line x1="160" y1="378" x2="160" y2="48" stroke="#64748b" stroke-width="2"/><path d="M160 48l-5 9h10z" fill="#64748b"/><text x="369" y="215" class="s">x</text><text x="166" y="48" class="s">y</text><text x="165" y="229" class="s">O</text><circle cx="179" cy="172" r="57" fill="#cbd5e1" fill-opacity=".12" stroke="#475569" stroke-width="2.5" stroke-dasharray="7 5"/><circle cx="227.6" cy="142.4" r="67.7" fill="none" stroke="#2563eb" stroke-width="2.5"/><circle cx="122" cy="172" r="38" fill="none" stroke="#16a34a" stroke-width="2.5"/><circle cx="179" cy="229" r="19" fill="none" stroke="#ea580c" stroke-width="2.5"/><circle cx="149.4" cy="220.6" r="10.8" fill="none" stroke="#9333ea" stroke-width="2.5"/><circle cx="179" cy="172" r="4" fill="#475569"/><circle cx="227.6" cy="142.4" r="4" fill="#2563eb"/><circle cx="122" cy="172" r="4" fill="#16a34a"/><circle cx="179" cy="229" r="4" fill="#ea580c"/><circle cx="149.4" cy="220.6" r="4" fill="#9333ea"/><text x="185" y="166" class="s">(1, 2)</text><line x1="394" y1="82" x2="424" y2="82" stroke="#475569" stroke-width="3" stroke-dasharray="7 5"/><text x="435" y="87" class="s">주어진 원, 반지름 3</text><line x1="394" y1="132" x2="424" y2="132" stroke="#2563eb" stroke-width="3"/><text x="435" y="137" class="s">제1사분면: r=(3+√17)/2</text><line x1="394" y1="182" x2="424" y2="182" stroke="#16a34a" stroke-width="3"/><text x="435" y="187" class="s">제2사분면: r=2</text><line x1="394" y1="232" x2="424" y2="232" stroke="#ea580c" stroke-width="3"/><text x="435" y="237" class="s">제4사분면: r=1</text><line x1="394" y1="282" x2="424" y2="282" stroke="#9333ea" stroke-width="3"/><text x="435" y="287" class="s">제3사분면: r=(√17−3)/2</text><text x="394" y="345" class="s">각 원의 넓이: r²π</text><text x="394" y="373" class="l">넓이 계수의 합 S=18</text><text x="32" y="411" class="s">네 사분면의 양수 반지름을 모두 세어 넓이를 합한다.</text></svg>