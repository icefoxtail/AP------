<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 470" width="470" height="470" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">남학생 3명과 여학생 4명을 모두 원탁에 앉히는 배열은 7명의 원순열이다. 일렬 배열 7!을 그대로 세면 한 배치를 회전한 7가지가 중복되므로 한 사람의 자리를 고정한다. 그러면 나머지 6명의 자리를 정하는 방법은 6!=720가지이다. 따라서 답은 ④이다.</title><desc id="visual-desc">원 위에 일곱 개의 점이 같은 간격으로 놓여 있고, 이웃한 두 점 사이의 짧은 호가 파란색으로 강조되어 있다.</desc><rect width="470" height="470" fill="#fff"/><g data-layer="40"><circle id="k" data-role="circle" stroke="#111" stroke-width="2.05" fill="none" cx="230.338818532" cy="239.661181468" r="187.087548706"/></g><g data-layer="46"><polyline id="fix" data-role="circularArc" stroke="#1f5fa8" stroke-width="3.2" fill="none" data-owner-points="S1 S2" data-center-point="O" data-owner-radius="5.999999999999999" data-sweep="CCW" data-mark="arc" data-mark-id="fix" points="362.629692897,107.370307103 358.867389392,103.712083077 355.00396639,100.160816628 351.042463427,96.719301706 346.985997205,93.390245912 342.837759138,90.176268372 338.601012841,87.079897674 334.279091562,84.103569879 329.87539556,81.249626604 325.393389432,78.520313183 320.836599383,75.917776893 316.208610456,73.444065274 311.513063707,71.101124512 306.753653345,68.890797908 301.934123823,66.814824431 297.058266893,64.874837347 292.129918622,63.072362936 287.152956373,61.40881929 282.131295759,59.885515196 277.06888