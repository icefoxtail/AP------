<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 705 544" width="705" height="544" role="img" aria-labelledby="title desc"><title id="title">두 포물선 위의 세 점과 두 길이</title><desc id="desc">위로 열린 y=x²에는 A와 B가 있다. 두 점의 높이는 같다. B에서 같은 세로선을 내려 주황 점선 y=−2x²/3 위의 C에 닿는다.</desc><rect width="705" height="544" fill="white" /><line x1="246.7000" y1="272.6659" x2="445.3667" y2="272.6659" stroke="#25736e" stroke-width="3.6" stroke-linecap="round" /><line x1="445.3667" y1="272.6659" x2="445.3667" y2="330.1780" stroke="#25736e" stroke-width="3.6" stroke-linecap="round" /><line x1="53.0000" y1="307.1732" x2="649.0000" y2="307.1732" stroke="#4d5d72" stroke-width="1.65" stroke-linecap="round" /><polygon points="649.0000,307.1732 636.0000,302.1732 636.0000,312.1732" fill="#4d5d72" /><text x="666.0000" y="299.1732" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#4d5d72" text-anchor="middle">x</text><line x1="346.0333" y1="473.0000" x2="346.0333" y2="80.0000" stroke="#4d5d72" stroke-width="1.65" stroke-linecap="round" /><polygon points="346.0333,80.0000 341.0333,93.0000 351.0333,93.0000" fill="#4d5d72" /><text x="362.0333" y="86.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#4d5d72" text-anchor="middle">y</text><text x="325.0333" y="335.1732" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#4d5d72" text-anchor="middle">O</text><path d="M 102.6667 100.0430 Q 346.0333 514.3033 589.4000 100.0430" stroke="#205d9c" stroke-width="6.0" stroke-linecap="round" fill="none" /><path d="M 96.0444 452.8771 Q 346.0333 161.4692 596.0222 452.8771" stroke="#aa5411" stroke-width="6.0" stroke-linecap="round" fill="none" stroke-dasharray="15 7" /><circle cx="246.7" cy="272.6658536585366" r="6.0" fill="white" stroke="#25736e" stroke-width="3.1" /><text x="225.7000" y="261.6659" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill