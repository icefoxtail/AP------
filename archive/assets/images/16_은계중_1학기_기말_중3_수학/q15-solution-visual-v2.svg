<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 705 544" width="705" height="544" role="img" aria-labelledby="title desc"><title id="title">늘리고 줄인 직사각형의 넓이 변화</title><desc id="desc">시간이 늘어날 때의 넓이는 아래로 열린 파란 그래프이다. 초록색 점선으로 처음 넓이 24와 같은 높이를 표시했다.</desc><rect width="705" height="544" fill="white" /><line x1="109.0753" y1="206.3799" x2="558.4785" y2="206.3799" stroke="#25736e" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="7 6" /><line x1="53.0000" y1="438.2235" x2="649.0000" y2="438.2235" stroke="#4d5d72" stroke-width="1.75" stroke-linecap="round" /><polygon points="649.0000,438.2235 636.0000,433.2235 636.0000,443.2235" fill="#4d5d72" /><line x1="109.0753" y1="473.0000" x2="109.0753" y2="58.0000" stroke="#4d5d72" stroke-width="1.75" stroke-linecap="round" /><polygon points="109.0753,58.0000 104.0753,71.0000 114.0753,71.0000" fill="#4d5d72" /><text x="652.0000" y="475.2235" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#4d5d72" text-anchor="middle">t (초)</text><text x="120.0753" y="37.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#4d5d72" text-anchor="middle">넓이</text><path d="M 109.0753 206.3799 Q 349.3978 -25.4637 589.7204 438.2235" stroke="#205d9c" stroke-width="6.0" stroke-linecap="round" fill="none" /><circle cx="109.07526881720429" cy="206.37988826815644" r="6.0" fill="white" stroke="#205d9c" stroke-width="3.1" /><circle cx="429.505376344086" cy="206.37988826815644" r="6.0" fill="white" stroke="#25736e" stroke-width="3.1" /><line x1="104.0753" y1="206.3799" x2="114.0753" y2="206.3799" stroke="#4d5d72" stroke-width="1.7" stroke-linecap="round" /><text x="84.0753" y="194.3799" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#4d5d72" text-anchor="middle">24</text></svg>
