<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 400" width="420" height="400" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">선분 AB와, 점 A에서 선분 AB에 수직으로 세운 선분 AC, 그리고 점 C를 중심으로 하고 반지름이 선분 AC인 원을 보여 준다. 선분 BC가 원과 만나는 점 E도 표시되어 있다.</title><desc id="visual-desc">수평인 선분 AB가 있고 점 A에서 위쪽으로 선분 AC가 직각을 이루며 서 있다. 점 C를 중심으로 하는 원이 점 A와 점 E를 지나며, 점 B에서 점 C로 가는 선분이 원과 만나는 자리에 점 E가 있다. 선분 AC에는 p 나누기 2, 선분 BE에는 x가 적혀 있다.</desc><rect width="420" height="400" fill="#fff"/><g data-layer="30"><line id="sAC" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="210" y1="336.391027787" x2="210" y2="195.78172079"/></g><g data-layer="30"><line id="sBE" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="315.456980248" y1="336.391027787" x2="294.365584198" y2="308.269166388"/></g><g data-layer="31"><line id="sAB" data-role="line" stroke="#b85c00" stroke-width="2.4" fill="none" x1="210" y1="336.391027787" x2="315.456980248" y2="336.391027787"/></g><g data-layer="31"><line id="sEC" data-role="line" stroke="#1f5fa8" stroke-width="2.4" fill="none" x1="294.365584198" y1="308.269166388" x2="210" y2="195.78172079"/></g><g data-layer="40"><circle id="circ" data-role="circle" stroke="#111" stroke-width="2.05" fill="none" cx="210" cy="195.78172079" r="140.609306997"/></g><g data-layer="60"><polyline id="rA" data-role="indicator" stroke="