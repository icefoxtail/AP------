<svg xmlns="http://www.w3.org/2000/svg" width="512" height="206" viewBox="0 0 512 206" role="img" aria-labelledby="visual-title visual-desc" data-composite="composite-panels-v1"><title id="visual-title">7x−5&lt;a−bx에서 (7+b)x&lt;a+5이다. 해가 x&lt;1이므로 7+b&gt;0이고 (a+5)/(7+b)=1, 즉 a+5=7+b이다. 따라서 b−a=−2이고 답은 −2이다.</title><desc id="visual-desc">수직선에서 1보다 왼쪽 부분이 파란 굵은 선으로 표시되어 있고, 1에는 열린 점이 있다.</desc><g id="p1-caption" data-role="caption" data-panel="1" data-font-px="24.5"><g id="p1-p1-caption-text" transform="translate(196.95499999999998 36.262)" data-label-kind="CAPTION" data-owner="panel-1" data-fragment-sha="sha256:02a108c4d5653d41caa4b00dc7a5e80de4bfe34b9158171eee32f69ee52f41e1"><svg xmlns="http://www.w3.org/2000/svg" width="118.09" height="35.476" viewBox="0 0 118.09 35.476" data-outline-width="118.09" data-outline-height="35.476" id="lb-517df85e1c52a471534bcf9b3f0b441c1c0f8f1cc4b6a43b9ac3539f7a055fc1" data-owner="panel-1" data-fact-role="GIVEN"><path d="M1.42100 22.34400L1.42100 21.60900L21.04550 21.60900L21.04550 22.34400L1.42100 22.34400ZM10.80450 30.06150L10.80450 21.85400L11.58850 21.85400L11.58850 30.06150L10.80450 30.06150ZM4.14050 18.47300L4.14050 9.35900L4.94900 9.35900L4.94900 12.86250L17.54200 12.86250L17.54200 9.35900L18.35050 9.35900L18.35050 18.47300L4.14050 18.47300ZM17.54200 13.59750L4.94900 13.59750L4.94900 17.76250L17.54200 17.76250L17.54200 13.59750ZM23.98550 19.86950L23.98550 19.13450L43.51200 19.13450L43.51200 19.86950L23.98550 19.86950ZM26.55800 16.51300L26.55800 15.77800L41.16000 15.77800L41.16000 16.51300L26.55800 16.51300ZM26.55800 16.07200L26.55800 9.57950L40.96400 9.57950L40.96400 10.31450L27.34200 10.31450L27.34200 16.07200L26.55800 16.07200ZM33.76100 22.34400L33.76100 22.34400Q37.19100 22.34400 39.12650 23.34850Q41.06200 24.35300 41.06200 26.16600L41.06200 26.16600Q41.06200 27.97900 39.12650 28.97125Q37.19100 29.96350 33.76100 29.96350L33.76100 29.96350Q30.35550 29.96350 28.40775 28.97125Q26.46000 27.97900 26.46000 26.16600L26.46000 26.1660