<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 703 588" width="703" height="588" role="img" aria-labelledby="title desc"><title id="title">두 정사각형의 네 점이 둘러싸는 겹친 부분</title><desc id="desc">파란 정사각형 ABCD에서 두 대각선은 O에서 만난다. 다른 정사각형 OEFG의 한 꼭짓점도 O이다. 두 경계는 P와 Q에서 교차하며, OPCQ의 겹친 부분을 따로 칠했다.</desc><rect width="703" height="588" fill="white" /><polygon points="178.2974,76.5000 178.2974,318.1364 419.9338,318.1364 419.9338,76.5000" fill="none" /><polygon points="299.1156,197.3182 212.5208,422.9052 438.1079,509.5000 524.7026,283.9130" fill="none" /><polygon points="299.1156,197.3182 252.7378,318.1364 419.9338,318.1364 419.9338,243.6960" fill="none" /><line x1="178.2974" y1="76.5000" x2="178.2974" y2="318.1364" stroke="#24649a" stroke-width="4.7" stroke-linecap="round" /><line x1="178.2974" y1="318.1364" x2="419.9338" y2="318.1364" stroke="#24649a" stroke-width="4.7" stroke-linecap="round" /><line x1="419.9338" y1="318.1364" x2="419.9338" y2="76.5000" stroke="#24649a" stroke-width="4.7" stroke-linecap="round" /><line x1="419.9338" y1="76.5000" x2="178.2974" y2="76.5000" stroke="#24649a" stroke-width="4.7" stroke-linecap="round" /><line x1="299.1156" y1="197.3182" x2="212.5208" y2="422.9052" stroke="#217266" stroke-width="4.75" stroke-linecap="round" /><line x1="212.5208" y1="422.9052" x2="438.1079" y2="509.5000" stroke="#217266" stroke-width="4.75" stroke-linecap="round" /><line x1="438.1079" y1="509.5000" x2="524.7026" y2="283.9130" stroke="#217266" stroke-width="4.75" stroke-linecap="round" /><line x1="524.7026" y1="283.9130" x2="299.1156" y2="197.3182" stroke="#217266" stroke-width="4.75" stroke-linecap="round" /><line x1="178.2974" y1="76.5000" x2="419.9338" y2="318.1364" stroke="#637786" stroke-width="3.45" stroke-linecap="round" /><line x1="178.2974" y1="318.1364" x2="419.9338" y2="76.5000" stroke="#637786" stroke-width="3.45" stroke-linecap="round" /><circle cx="178.29737514420302" cy="76.5" r="4.9" fill="#28364b" /><text x="163.2974" y="61.5000" font-size="29" font-f