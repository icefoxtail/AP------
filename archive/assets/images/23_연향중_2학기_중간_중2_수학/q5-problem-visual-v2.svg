<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 733 617" width="733" height="617" role="img" aria-labelledby="title desc"><title id="title">같은 삼각형에 놓인 외심과 내심</title><desc id="desc">삼각형 ABC의 A각은 64도이다. B와 C에서 외심 O를 향하는 선분과 내심 I를 향하는 선분을 서로 다른 색으로 나타냈다.</desc><rect width="733" height="617" fill="white" /><polygon points="465.4384,102.1793 106.5000,500.8207 626.5000,500.8207" fill="#fff" /><line x1="465.4384" y1="102.1793" x2="106.5000" y2="500.8207" stroke="#21639a" stroke-width="4.8" stroke-linecap="round" /><line x1="106.5000" y1="500.8207" x2="626.5000" y2="500.8207" stroke="#21639a" stroke-width="4.8" stroke-linecap="round" /><line x1="626.5000" y1="500.8207" x2="465.4384" y2="102.1793" stroke="#21639a" stroke-width="4.8" stroke-linecap="round" /><line x1="106.5000" y1="500.8207" x2="366.5000" y2="374.0103" stroke="#227365" stroke-width="4.5" stroke-linecap="round" stroke-dasharray="9 6" /><line x1="106.5000" y1="500.8207" x2="419.7382" y2="361.3581" stroke="#774698" stroke-width="4.65" stroke-linecap="round" /><line x1="626.5000" y1="500.8207" x2="366.5000" y2="374.0103" stroke="#227365" stroke-width="4.5" stroke-linecap="round" stroke-dasharray="9 6" /><line x1="626.5000" y1="500.8207" x2="419.7382" y2="361.3581" stroke="#774698" stroke-width="4.65" stroke-linecap="round" /><path d="M 425.9597 146.0248 A 59 59 0 0 0 487.5402 156.8831" stroke="#a34c1f" stroke-width="2.25" fill="none" /><text x="448.7682" y="204.7208" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#a34c1f" text-anchor="middle">64°</text><circle cx="465.43839153789287" cy="102.17926515267771" r="4.9" fill="#28364b" /><text x="465.4384" y="80.1793" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">A</text><circle cx="106.5" cy="500.8207348473223" r="4.9" fill="#28364b" /><text x="89.5000" y="522.8207" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-wei