ans-serif" font-weight="600" fill="#28364b" text-anchor="middle">O</text><circle cx="515.8" cy="359.6" r="4.9" fill="#28364b" /><text x="508.8000" y="342.6000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">I</text><circle cx="515.8" cy="436.0" r="4.9" fill="#28364b" /><text x="516.8000" y="461.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">D</text><circle cx="592.2" cy="359.6" r="4.9" fill="#28364b" /><text x="619.2000" y="365.6000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">E</text><circle cx="486.4153846153846" cy="289.0769230769231" r="4.9" fill="#28364b" /><text x="469.4154" y="271.0769" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">F</text></svg>
