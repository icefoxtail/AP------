<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 380" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-geometry-fact-hash="f41186e39730e4ce255c3a0033f10b3cdda2453d3ed72aa9bfd96177ce7fb982" data-visual-provenance="SOURCE_SOLUTION_DERIVED">
  <title id="title">24번 해설 도형</title>
  <desc id="desc">직사각형 ABCD에서 AC와 EF가 O에서 수직으로 만나고 두 선분이 서로를 이등분하여 AFCE가 마름모가 됨을 보여 주는 모식도</desc>
  <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
    <rect x="40" y="50" width="240" height="169.706" stroke-width="2.05"/>
    <path d="M40 50 L280 219.706 M220 50 L100 219.706" stroke-width="1.6"/>
    <circle cx="160" cy="134.853" r="2" fill="currentColor" stroke="none"/>
  </g>
  <g fill="currentColor" font-family="Arial, sans-serif" font-size="13.25">
    <text x="32" y="46">A</text><text x="32" y="241">B</text><text x="286" y="241">C</text><text x="286" y="46">D</text><text x="212" y="42">E</text><text x="92" y="242">F</text><text x="166" y="130">O</text>
  </g>
  <g fill="currentColor" font-family="Arial, sans-serif" font-size="12"><text x="244" y="42">DE=2</text><text x="143" y="249">BC=8</text></g>
  <text x="175" y="157" fill="currentColor" font-family="Arial, sans-serif" font-size="11.75">90°</text>
  <g fill="currentColor" font-family="Arial, sans-serif" font-size="12">
    <text x="32" y="315">AO=CO, △AEO ≅ △CFO → EO=FO</text>
    <text x="32" y="333">두 대각선이 서로 이등분하고 수직 → AFCE는 마름모</text>
  </g>
</svg>
