<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 310" role="img" aria-labelledby="title desc">
<title id="title">24번 해설 도형</title><desc id="desc">직사각형 ABCD에서 AC와 EF가 O에서 수직으로 만나고 AO=CO, EO=FO를 보여 주는 그림</desc>
<g fill="none" stroke="#222" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="40" y="50" width="240" height="169.706"/><path d="M40 50 L280 219.706"/><path d="M220 50 L100 219.706"/><circle cx="160" cy="134.853" r="3" fill="#222"/></g>
<g fill="#222" font-family="sans-serif" font-size="16"><text x="24" y="46">A</text><text x="24" y="241">B</text><text x="286" y="241">C</text><text x="286" y="46">D</text><text x="212" y="42">E</text><text x="91" y="242">F</text><text x="166" y="130">O</text><text x="246" y="43">DE=2</text><text x="142" y="249">BC=8</text><text x="174" y="156">90°</text><text x="18" y="276">AO=CO, △AEO ≅ △CFO → EO=FO</text><text x="18" y="299">두 대각선이 서로 이등분하고 수직 → AFCE는 마름모</text></g></svg>
