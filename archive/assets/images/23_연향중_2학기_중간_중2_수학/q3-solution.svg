<g fill="#222" font-family="sans-serif" font-size="16"><text x="238" y="47">A</text><text x="24" y="278">B</text><text x="244" y="279">C</text><text x="78" y="198">D</text><text x="150" y="281">E</text><text x="181" y="283">CE=4</text><text x="112" y="233">DE=4</text><text x="48" y="248">45°</text><text x="25" y="304">RHS: △ADE ≅ △ACE → DE=CE=4, 이어서 DB=DE</text></g></svg>
