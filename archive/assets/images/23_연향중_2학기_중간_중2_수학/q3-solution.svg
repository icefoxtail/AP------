<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-geometry-fact-hash="1e23546482a9f55c38a8a631c5ba7fd2115498d440285daeb82571120cfec924" data-visual-provenance="SOURCE_SOLUTION_DERIVED">
  <title id="title">3번 해설 도형</title>
  <desc id="desc">직각삼각형 ADE와 ACE의 RHS 합동으로 DE와 CE가 같고, DBE가 45도 직각삼각형임을 보여 주는 모식도</desc>
  <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
    <path d="M40 260 L240 60 L240 260 Z" stroke-width="2.05"/>
    <path d="M98.58 201.42 L157.16 260" stroke-width="1.6"/>
    <path d="M232 252 L232 260 L240 260 M98.58 201.42 l8.5 8.5 l-8.5 8.5" stroke-width="0.8"/>
  </g>
  <g fill="currentColor" font-family="Arial, sans-serif" font-size="13.25">
    <text x="238" y="47">A</text><text x="32" y="278">B</text><text x="244" y="279">C</text><text x="80" y="197">D</text><text x="151" y="280">E</text>
  </g>
  <g fill="currentColor" font-family="Arial, sans-serif" font-size="12">
    <text x="184" y="281">CE=4</text><text x="112" y="233">DE=4</text>
  </g>
  <text x="50" y="247" fill="currentColor" font-family="Arial, sans-serif" font-size="11.75">45°</text>
  <g fill="currentColor" font-family="Arial, sans-serif" font-size="12">
    <text x="34" y="310">RHS: △ADE ≅ △ACE → DE=CE=4</text>
    <text x="34" y="327">△DBE는 45°-45°-90° → DB=DE</text>
  </g>
</svg>
