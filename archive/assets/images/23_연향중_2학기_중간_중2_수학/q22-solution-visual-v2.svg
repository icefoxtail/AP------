<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 724 681" width="724" height="681" role="img" aria-labelledby="title desc"><title id="title">직각삼각형의 외접원과 내접원</title><desc id="desc">외접원의 중심 O는 빗변 AB 위에 있고 내접원의 중심은 I이다. 내접원은 BC, AC, AB에 각각 D, E, F에서 닿는다. 외접원의 두 같은 반지름과 내접원의 세 같은 반지름을 각각 같은 색과 눈금으로 표시했다.</desc><rect width="724" height="681" fill="white" /><circle cx="363.0" cy="340.5" r="248.3" fill="#fff" stroke="#21639a" stroke-width="3.6" /><polygon points="592.2000,245.0000 133.8000,436.0000 592.2000,436.0000" fill="#fff" /><circle cx="515.8" cy="359.6" r="76.4" fill="#fff" stroke="#774698" stroke-width="3.6" /><line x1="592.2000" y1="245.0000" x2="133.8000" y2="436.0000" stroke="#21639a" stroke-width="4.8" stroke-linecap="round" /><line x1="133.8000" y1="436.0000" x2="592.2000" y2="436.0000" stroke="#21639a" stroke-width="4.8" stroke-linecap="round" /><line x1="592.2000" y1="436.0000" x2="592.2000" y2="245.0000" stroke="#21639a" stroke-width="4.8" stroke-linecap="round" /><line x1="572.2000" y1="436.0000" x2="572.2000" y2="416.0000" stroke="#586574" stroke-width="1.8" stroke-linecap="round" /><line x1="572.2000" y1="416.0000" x2="592.2000" y2="416.0000" stroke="#586574" stroke-width="1.8" stroke-linecap="round" /><line x1="592.2000" y1="245.0000" x2="363.0000" y2="340.5000" stroke="#21639a" stroke-width="5.17" stroke-linecap="round" /><line x1="470.3237" y1="288.1985" x2="475.7083" y2="301.1215" stroke="#21639a" stroke-width="2.5" stroke-linecap="round" /><line x1="363.0000" y1="340.5000" x2="133.8000" y2="436.0000" stroke="#21639a" stroke-width="5.17" stroke-linecap="round" /><line x1="241.1237" y1="383.6985" x2="246.5083" y2="396.6215" stroke="#21639a" stroke-width="2.5" stroke-linecap="round" /><line x1="515.8000" y1="359.6000" x2="515.8000" y2="436.0000" stroke="#774698" stroke-width="4.6" stroke-linecap="round" /><line x1="508.8000" y1="408.5800" x2="522.8000" y2="408.5800" stroke="#774698" stroke-width="2.5" stroke-linecap="round" /><line x1="508.8000" y1