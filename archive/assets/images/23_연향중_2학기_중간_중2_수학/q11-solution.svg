    <text x="138" y="143">E</text><text x="102" y="281">I</text><text x="267" y="188">J</text><text x="75" y="332">F</text><text x="258" y="396">G</text><text x="320" y="214">H</text>
  </g>
  <g fill="currentColor" font-family="Arial, sans-serif" font-size="12">
