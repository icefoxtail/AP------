<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 470" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-geometry-fact-hash="dfcdb495907eaf1286d5375db56f742431f6694a8f543d157becc89fcf0d9cb1" data-visual-provenance="SOURCE_SOLUTION_DERIVED">
  <title id="title">11번 해설 도형</title>
  <desc id="desc">합동인 두 정사각형에서 삼각형 EBI와 ECJ의 합동으로 사각형 EICJ의 넓이를 삼각형 EBC의 넓이로 바꾸는 모식도</desc>
  <g fill="#e8e8e8" stroke="none"><polygon points="150,150 40,260 110,260"/><polygon points="150,150 260,260 260,190"/></g>
