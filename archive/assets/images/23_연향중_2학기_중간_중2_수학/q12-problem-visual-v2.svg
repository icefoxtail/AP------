<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 751 493" width="751" height="493" role="img" aria-labelledby="title desc"><title id="title">사각형에서 정사각형이 되기까지</title><desc id="desc">사각형에서 사다리꼴, 평행사변형으로 간다. 평행사변형에서 직사각형과 마름모로 갈라지고 두 경우 모두 정사각형으로 이어진다. 다섯 조건 자리에 ㄱ부터 ㅁ이 표시돼 있다.</desc><rect width="751" height="493" fill="white" /><polygon points="33.0000,222.0000 98.0000,197.0000 115.0000,282.0000 25.0000,282.0000" fill="#fff" /><line x1="25.0000" y1="282.0000" x2="33.0000" y2="222.0000" stroke="#21639a" stroke-width="4.5" stroke-linecap="round" /><line x1="33.0000" y1="222.0000" x2="98.0000" y2="197.0000" stroke="#21639a" stroke-width="4.5" stroke-linecap="round" /><line x1="98.0000" y1="197.0000" x2="115.0000" y2="282.0000" stroke="#21639a" stroke-width="4.5" stroke-linecap="round" /><line x1="115.0000" y1="282.0000" x2="25.0000" y2="282.0000" stroke="#21639a" stroke-width="4.5" stroke-linecap="round" /><text x="69.0000" y="330.0000" font-size="26" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#273846" text-anchor="middle">사각형</text><polygon points="161.0000,209.0000 220.0000,209.0000 239.0000,283.0000 146.0000,283.0000" fill="#fff" /><line x1="146.0000" y1="283.0000" x2="161.0000" y2="209.0000" stroke="#21639a" stroke-width="4.5" stroke-linecap="round" /><line x1="161.0000" y1="209.0000" x2="220.0000" y2="209.0000" stroke="#21639a" stroke-width="4.5" stroke-linecap="round" /><line x1="220.0000" y1="209.0000" x2="239.0000" y2="283.0000" stroke="#21639a" stroke-width="4.5" stroke-linecap="round" /><line x1="239.0000" y1="283.0000" x2="146.0000" y2="283.0000" stroke="#21639a" stroke-width="4.5" stroke-linecap="round" /><text x="187.0000" y="330.0000" font-size="26" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#273846" text-anchor="middle">사다리꼴</text><polygon points="292.0000,207.0000 370.0000,207.0000 345.0000,282.0000 267.0000,282.0000" fill="#fff" /><line x1="267.0000" y1="282.0000" x2="292.0000" y2="