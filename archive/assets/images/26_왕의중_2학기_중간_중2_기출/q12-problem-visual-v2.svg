<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 726 489" width="726" height="489" role="img" aria-labelledby="title desc"><title id="title">한 삼각형의 내심 I와 외심 O</title><desc id="desc">삼각형 ABC 안에 내심 I와 외심 O가 표시돼 있다. B와 C에서 각각 I, O로 이어진다. B에서 BI와 BA 사이가 30도이고, C에서 CA와 CI 사이는 20도이다.</desc><rect width="726" height="489" fill="white" /><polygon points="266.4516,87.3583 85.0000,401.6417 641.0000,401.6417" fill="none" /><line x1="266.4516" y1="87.3583" x2="85.0000" y2="401.6417" stroke="#205d9c" stroke-width="4.5" stroke-linecap="round" /><line x1="85.0000" y1="401.6417" x2="641.0000" y2="401.6417" stroke="#205d9c" stroke-width="4.5" stroke-linecap="round" /><line x1="641.0000" y1="401.6417" x2="266.4516" y2="87.3583" stroke="#205d9c" stroke-width="4.5" stroke-linecap="round" /><line x1="85.0000" y1="401.6417" x2="299.9825" y2="277.5215" stroke="#266f73" stroke-width="4.05" stroke-linecap="round" /><line x1="85.0000" y1="401.6417" x2="363.0000" y2="352.6228" stroke="#704895" stroke-width="3.1" stroke-linecap="round" stroke-dasharray="9 6" /><line x1="641.0000" y1="401.6417" x2="299.9825" y2="277.5215" stroke="#266f73" stroke-width="4.05" stroke-linecap="round" /><line x1="641.0000" y1="401.6417" x2="363.0000" y2="352.6228" stroke="#704895" stroke-width="3.1" stroke-linecap="round" stroke-dasharray="9 6" /><path d="M 128.3013 376.6417 A 50 50 0 0 0 110.0000 358.3404" stroke="#266f73" stroke-width="2.25" fill="none" /><text x="174.0746" y="330.5671" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#266f73" text-anchor="middle">30°</text><path d="M 592.7392 361.1461 A 63 63 0 0 0 581.7994 380.0944" stroke="#266f73" stroke-width="2.25" fill="none" /><text x="542.2731" y="347.6417" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#266f73" text-anchor="middle">20°</text><circle cx="299.9825160602216" cy="277.5214930853199" r="4.9" fill="#266f73" /><text x="291.9825" y="259.5215" font-size="