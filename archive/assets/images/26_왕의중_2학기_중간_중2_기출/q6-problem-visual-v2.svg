<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 701 531" width="701" height="531" role="img" aria-labelledby="title desc"><title id="title">외심을 지나 두 변까지 이어지는 선</title><desc id="desc">삼각형 ABC에서 A에서 외심 O를 지나 밑변 BC의 D까지 이었다. B에서 O를 지나 오른쪽 변 AC의 E까지 이었다. 오른쪽 밑각 ACB는 64도이다.</desc><rect width="701" height="531" fill="white" /><polygon points="416.5570,77.5000 101.0555,453.5000 599.9445,453.5000" fill="none" /><line x1="416.5570" y1="77.5000" x2="101.0555" y2="453.5000" stroke="#205d9c" stroke-width="4.1" stroke-linecap="round" /><line x1="101.0555" y1="453.5000" x2="599.9445" y2="453.5000" stroke="#205d9c" stroke-width="4.1" stroke-linecap="round" /><line x1="599.9445" y1="453.5000" x2="416.5570" y2="77.5000" stroke="#205d9c" stroke-width="4.1" stroke-linecap="round" /><line x1="416.5570" y1="77.5000" x2="322.8097" y2="453.5000" stroke="#704895" stroke-width="4.1" stroke-linecap="round" /><line x1="101.0555" y1="453.5000" x2="510.9375" y2="271.0088" stroke="#266f73" stroke-width="4.1" stroke-linecap="round" /><path d="M 580.6561 413.9531 A 44 44 0 0 0 555.9445 453.5000" stroke="#aa5411" stroke-width="2.25" fill="none" /><text x="532.9487" y="419.6364" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#aa5411" text-anchor="middle">64°</text><circle cx="416.5570040109466" cy="77.5" r="4.9" fill="#28364b" /><text x="423.5570" y="58.5000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">A</text><circle cx="101.05554268828931" cy="453.5" r="4.9" fill="#28364b" /><text x="84.0555" y="476.5000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">B</text><circle cx="599.9444573117107" cy="453.5" r="4.9" fill="#28364b" /><text x="616.9445" y="475.5000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">C</text><circle cx