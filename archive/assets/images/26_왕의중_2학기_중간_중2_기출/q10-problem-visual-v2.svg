<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 729 473" width="729" height="473" role="img" aria-labelledby="title desc"><title id="title">내심을 거쳐 이어지는 두 각의 이등분선</title><desc id="desc">삼각형 ABC의 내심 I를 A와 C에 각각 이었다. I에서 AIC는 130도이며 C에서 ICB는 18도이다. A에서 AB와 AI 사이의 각은 x이다.</desc><rect width="729" height="473" fill="white" /><polygon points="173.6913,77.5000 117.6193,395.5000 611.3807,395.5000" fill="none" /><line x1="173.6913" y1="77.5000" x2="117.6193" y2="395.5000" stroke="#205d9c" stroke-width="4.1" stroke-linecap="round" /><line x1="117.6193" y1="395.5000" x2="611.3807" y2="395.5000" stroke="#205d9c" stroke-width="4.1" stroke-linecap="round" /><line x1="611.3807" y1="395.5000" x2="173.6913" y2="77.5000" stroke="#205d9c" stroke-width="4.1" stroke-linecap="round" /><line x1="173.6913" y1="77.5000" x2="255.4459" y2="279.8498" stroke="#266f73" stroke-width="4.1" stroke-linecap="round" /><line x1="611.3807" y1="395.5000" x2="255.4459" y2="279.8498" stroke="#266f73" stroke-width="4.1" stroke-linecap="round" /><path d="M 165.5298 123.7860 A 47 47 0 0 0 191.2978 121.0776" stroke="#266f73" stroke-width="2.25" fill="none" /><text x="174.6354" y="165.0837" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#266f73" text-anchor="middle">x</text><path d="M 237.8394 236.2721 A 47 47 0 0 1 300.1455 294.3736" stroke="#aa5411" stroke-width="2.25" fill="none" /><text x="315.6877" y="232.6101" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#aa5411" text-anchor="middle">130°</text><path d="M 521.9814 366.4524 A 94 94 0 0 0 517.3807 395.5000" stroke="#704895" stroke-width="2.25" fill="none" /><text x="479.8704" y="380.5714" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#704895" text-anchor="middle">18°</text><circle cx="173.69126457772967" cy="77.5" r="4.9" fill="#28364b" /><text x="165.6913" y="58.5000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">A</text><circle cx="117.61928471243777" cy="395.5" r="4.9" fill="#28364b" /><text x="100.6193" y="418.5000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">B</text><circle cx="611.3807152875622" cy="395.5" r="4.9" fill="#28364b" /><text x="628.3807" y="417.5000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">C</text><circle cx="255.44587423388498" cy="279.84975956613124" r="4.9" fill="#28364b" /><text x="236.4459" y="300.8498" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">I</text></svg>
