<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 550" width="720" height="550" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">마름모 ABCD의 B 각은 64°이며 A에서 BC와 CD에 내린 두 수선 AP, AQ가 PQ와 만나는 P의 미지각 x를 보인다.</title><desc id="visual-desc">A가 위, B와 D가 좌우, C가 아래인 마름모에서 A-P는 왼쪽 아래 BC에, A-Q는 오른쪽 아래 CD에 각각 수직이다. P와 Q를 실선으로 잇고 두 수선의 발에 직각 사각표식, B에는 64도 각 호, P의 구하는 각에는 x 호가 있다. 외곽이나 내부에 필요 없는 면 채움이 없다.</desc><rect width="720" height="550" fill="#fff"/><g data-layer="30"><line id="sAB" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="360" y1="91.964285714" x2="67.142857143" y2="275"/></g><g data-layer="30"><line id="sAD" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="360" y1="91.964285714" x2="652.857142857" y2="275"/></g><g data-layer="30"><line id="sAP" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="360" y1="91.964285714" x2="195.473515249" y2="355.206661316"/></g><g data-layer="30"><line id="sAQ" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="360" y1="91.964285714" x2="524.526484751" y2="355.206661316"/></g><g data-layer="30"><line id="sPQ" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="195.473515249" y1="355.206661316" x2="524.526484751" y2="355.206661316"/></g><g data-layer="40"><line id="lBC" data-role="line" stroke="#111" stroke-width="2.05" fill="n