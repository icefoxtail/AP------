<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 620" width="512" height="620" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="UNEQUAL_UNIT_DECLARED" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">예: k=8일 때 f(t)=t²−6t+(k−4)=t²−6t+4의 그래프이다. t=3ˣ&gt;0이므로 서로 다른 두 양의 근이 필요하다. 이 그래프는 t축과 두 점에서 만나고 두 점 모두 t&gt;0이며 f(0)=4&gt;0(A)이고 꼭짓점 V(3, −5)는 t축 아래에 있다. 조건은 D/4=9−(k−4)&gt;0에서 k&lt;13, 두 근의 곱 k−4&gt;0에서 k&gt;4이므로 4&lt;k&lt;13이다. 자연수 k는 5부터 12까지 8개이다. 따라서 답은 ①이다.</title><desc id="visual-desc">아래로 볼록한 포물선이 가로축과 두 점에서 만나고 두 교점이 모두 세로축 오른쪽에 있다. 세로축과 만나는 점 A와 꼭짓점 V의 좌표가 표시되어 있다.</desc><rect width="512" height="620" fill="#fff"/><g data-layer="30"><line id="x-axis" data-role="axis" stroke="#111" stroke-width="1.2" fill="none" data-axis="x" x1="32" y1="336.411875719" x2="480" y2="336.411875719"/></g><g data-layer="30"><line id="y-axis" data-role="axis" stroke="#111" stroke-width="1.2" fill="none" data-axis="y" x1="101.927990798" y1="588" x2="101.927990798" y2="32"/></g><g data-layer="40"><polyline id="f-piece-1-branch-0" data-role="curve" stroke="#111" stroke-width="2.1" fill="none" data-branch="PIECE_1" points="72,72.29311853 73.230769231,76.412282664 74.461538462,80.513524074 75.692307692,84.596842759 76.923076923,88.662238719 78.153846154,92.709711954 79.384615385,96.739262464 80.615384615,100.75089025 81.846153846,104.74459531 83.076923077,108.720377646 84.307692308,112.678237257 85.538461538,11