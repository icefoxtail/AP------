<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 480" width="560" height="480" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">tan x를 sin x/cos x로 바꾸어 정리하면 sin x(1/cos x − 2) = 0이다. sin x = 0에서 x = π, 2π이고, cos x = 1/2에서 x = π/3, 5π/3이다. 네 해를 더하면 π + 2π + π/3 + 5π/3 = 5π이다. 따라서 답은 5π이다.</title><desc id="visual-desc">원점을 중심으로 하는 단위원과 세 개의 동경이 있고, 각각 π/3, π, 5π/3의 각이 호와 함께 표시되어 있다.</desc><rect width="560" height="480" fill="#fff"/><g data-layer="12"><polygon id="a1-sector" data-role="angleSector" stroke="none" stroke-width="1.6" fill="#d9d9d9" data-owner-points="X O P" data-mark="angle" data-mark-id="a1" data-mark-index="0" data-mark-count="1" data-mark-side="INNER" points="280,240 308,240 307.940049851,238.168712382 307.760456118,236.345266618 307.461987851,234.537470984 307.045923136,232.753066737 306.514043626,230.999694972 305.86862691,229.284863894 305.112436763,227.615916674 304.248711306,226 303.281149144,224.444033475 302.213893528,222.954679988 301.051514609,221.538317177 299.798989873,220.201010127 298.461682823,218.948485391 297.045320012,217.786106472 295.555966525,216.718850856 294,215.751288694"/></g><g data-layer="12"><polygon id="a3-sector" data-role="angleSector" stroke="none" stroke-width="1.6" fill="#d9d9d9" data-owner-points="X O S" data-mark="angle" data-mark-id="a3" data-mark-index="0" data-mark-count="1" data