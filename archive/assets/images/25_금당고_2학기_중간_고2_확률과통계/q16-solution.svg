<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 384 320" width="384" height="320" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">원탁 6자리를 육각형 꼭짓점으로 나타낸 그림이다. M과 N은 부모의 마주 보는 자리를 지름으로 이은 예이다. 마주 보는 경우는 한 부모를 고정하면 다른 부모의 자리가 맞은편 한 곳으로 정해지고 나머지 4명을 배열하므로 b=4!=24이다. 이웃하는 경우는 부모를 한 묶음으로 보아 (5−1)!×2!=48이므로 a=48이다. a+b=72이다.</title><desc id="visual-desc">여섯 자리가 육각형 꼭짓점으로 놓인 원탁 그림이며 부모의 마주 보는 자리 M과 N이 지름으로 이어져 있다.</desc><rect width="384" height="320" fill="#fff"/><g data-layer="30"><line id="sMP" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="306.285714286" y1="160" x2="249.142857143" y2="45.714285714"/></g><g data-layer="30"><line id="sPQ" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="249.142857143" y1="45.714285714" x2="134.857142857" y2="45.714285714"/></g><g data-layer="30"><line id="sQN" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="134.857142857" y1="45.714285714" x2="77.714285714" y2="160"/></g><g data-layer="30"><line id="sNR" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="77.714285714" y1="160" x2="134.857142857" y2="274.285714286"/></g><g data-layer="30"><line id="sRS" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="134.857142857" y1="274.285714286" x2="249.142857143" y2="274.285714286"/></g><g data-layer="30"><line id="sSM" data-role="