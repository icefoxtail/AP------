<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" role="img" aria-labelledby="title desc" width="760" height="320"><title id="title">문항 13 해설: 대칭차 영역 수</title><desc id="desc">A만, 교집합, B만 영역을 x,y,z로 나눈 수치 Venn diagram</desc><style>text{font-family:"Noto Sans KR",Arial,sans-serif;fill:#172033}.m{fill:#56657a}</style><rect width="760" height="320" rx="18" fill="#f8fafc"/><text x="28" y="38" font-size="22" font-weight="700">대칭차집합은 A만과 B만의 합</text><rect x="28" y="78" width="430" height="180" rx="14" fill="#fff" stroke="#cbd5e1"/><circle cx="220" cy="168" r="68" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><circle cx="300" cy="168" r="68" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text x="177" y="130" font-size="17" fill="#1d4ed8">A</text><text x="330" y="130" font-size="17" fill="#15803d">B</text><text x="180" y="180" text-anchor="middle" font-size="22">x</text><text x="260" y="180" text-anchor="middle" font-size="22">y</text><text x="340" y="180" text-anchor="middle" font-size="22">z</text><text x="180" y="210" text-anchor="middle" class="m" font-size="13">A−B</text><text x="260" y="210" text-anchor="middle" class="m" font-size="13">A∩B</text><text x="340" y="210" text-anchor="middle" class="m" font-size="13">B−A</text><rect x="490" y="94" width="238" height="132" rx="14" fill="#fff" stroke="#cbd5e1"/><text x="514" y="130" font-size="18" fill="#1d4ed8">x+y=4</text><text x="514" y="166" font-size="18" fill="#b45309">x+z=2</text><text x="514" y="202" font-size="17" fill="#475569">n(B)=y+z</text><text x="28" y="294" class="m" font-size="14">x를 기준으로 가능한 세 영역의 배치를 모두 비교한다.</text></svg>
