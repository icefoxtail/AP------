<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" role="img" aria-labelledby="title desc">
  <title id="title">큰 원과 두 반원, 직선의 교점 개수</title>
  <desc id="desc">중심이 원점이고 반지름이 4인 큰 원, 중심 (2,0)의 위쪽 반원과 그 원점 대칭인 중심 (-2,0)의 아래쪽 반원, 그리고 점 (-2,0)을 지나는 직선의 교점 개수를 나타낸 그림이다.</desc>
  <rect width="640" height="300" fill="#fff"/>
  <text x="320" y="28" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="21" font-weight="700" fill="#1e3a5f">큰 원과 두 반원의 교점 개수</text>
  <rect x="18" y="45" width="360" height="238" rx="8" fill="#f8fafc" stroke="#dbe3ef"/>
  <g stroke="#cbd5e1" stroke-width="1" opacity=".65">
    <line x1="76" y1="62" x2="76" y2="270"/><line x1="128" y1="62" x2="128" y2="270"/><line x1="180" y1="62" x2="180" y2="270"/><line x1="232" y1="62" x2="232" y2="270"/><line x1="284" y1="62" x2="284" y2="270"/>
    <line x1="55" y1="114" x2="305" y2="114"/><line x1="55" y1="166" x2="305" y2="166"/><line x1="55" y1="218" x2="305" y2="218"/>
  </g>
  <line x1="43" y1="166" x2="318" y2="166" stroke="#0f172a" stroke-width="1.5"/>
  <line x1="180" y1="276" x2="180" y2="51" stroke="#0f172a" stroke-width="1.5"/>
  <text x="310" y="160" font-family="Arial, sans-serif" font-size="15" fill="#334155">x</text><text x="187" y="61" font-family="Arial, sans-serif" font-size="15" fill="#334155">y</text>
  <circle cx="180" cy="166" r="104" fill="#dbeafe" fill-opacity=".48" stroke="#2563eb" stroke-width="2.5"/>
  <path d="M178 166 C178 137 201 114 230 114 C259 114 282 137 282 166" fill="none" stroke="#f97316" stroke-width="3"/>
  <path d="M78 166 C78 195 101 218 130 218 C159 218 182 195 182 166" fill="none" stroke="#8b5cf6" stroke-width="3"/>
  <line x1="76" y1="129" x2="284" y2="275" stroke="#2563eb" stroke-width="2" opacity=".85"/>
  <line x1="76" y1="196" x2="284" y2="76" stroke="#dc2626" stroke-width="2" opacity=".8"/>
  <circle cx="180" cy="166" r="4" fill="#0f172a"/><circle cx="130" cy="166" r="4" fill="#8b5cf6"/>
  <text x="187" y="158" font-family="Arial, sans-serif" font-size="15" fill="#0f172a">O</text>
  <text x="236" y="108" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="15" fill="#c2410c">위 반원</text>
  <text x="82" y="238" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="15" fill="#6d28d9">아래 반원</text>
  <text x="91" y="124" font-family="Arial, sans-serif" font-size="14" fill="#1d4ed8">a&lt;0</text>
  <text x="239" y="72" font-family="Arial, sans-serif" font-size="14" fill="#b91c1c">a=√3/3</text>
  <text x="124" y="181" font-family="Arial, sans-serif" font-size="14" fill="#334155">−2</text>
  <text x="92" y="202" font-family="Arial, sans-serif" font-size="13" fill="#6d28d9">중심 (−2,0)</text>
  <text x="174" y="181" font-family="Arial, sans-serif" font-size="14" fill="#334155">0</text>
  <text x="225" y="181" font-family="Arial, sans-serif" font-size="14" fill="#334155">2</text>
  <rect x="400" y="45" width="222" height="238" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="420" y="74" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="18" font-weight="700" fill="#1e3a5f">겹치지 않게 세기</text>
  <text x="420" y="103" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="15">큰 원: 항상 2점</text>
  <text x="420" y="127" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="15">아래 반원: a≠0이면 1점</text>
  <text x="420" y="149" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14">a=0이면 (0,0)만 추가</text>
  <line x1="420" y1="161" x2="602" y2="161" stroke="#cbd5e1"/>
  <text x="420" y="183" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14">a≤0: 위 반원 추가 0</text>
  <text x="420" y="204" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14">0&lt;a&lt;√3/3: 추가 2점</text>
  <text x="420" y="225" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14">a=√3/3: 추가 1점</text>
  <text x="420" y="246" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14">a&gt;√3/3: 추가 0점</text>
  <text x="420" y="271" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="16" font-weight="700" fill="#1d4ed8">f(a): 3, 5, 4, 3</text>
</svg>
