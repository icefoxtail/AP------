<svg xmlns="http://www.w3.org/2000/svg" width="480" height="460" viewBox="0 0 480 460" role="img" aria-labelledby="visual-title visual-desc" data-composite="composite-panels-v1"><title id="visual-title">예: 밑면의 반지름이 3ab², 높이가 h, 부피가 9πa⁶b⁶인 원뿔이다(길이의 비율은 모양만 나타낸 것이다). 밑넓이는 π(3ab²)²=9πa²b⁴이다. 부피 (1/3)×9πa²b⁴×h=3πa²b⁴h가 9πa⁶b⁶이므로 h=3a⁴b²이다. 따라서 답은 ①이다.</title><desc id="visual-desc">원뿔이 있고 밑면의 반지름에 3ab², 높이에 h가 적혀 있다.</desc><g id="p1-caption" data-role="caption" data-panel="1" data-font-px="21.4"><g id="p1-p1-caption-text" transform="translate(220.312 38.5064)" data-label-kind="CAPTION" data-owner="panel-1" data-fragment-sha="sha256:d96aaf7a1333d272f30d518c56b76f2c78adc4b555abb2a79a8e6cdaf5054fca"><svg xmlns="http://www.w3.org/2000/svg" width="39.376" height="30.9872" viewBox="0 0 39.376 30.9872" data-outline-width="39.376" data-outline-height="30.9872" id="lb-175f2c91eb2d01c6e0505f53e05a2dfc117fad813f1dd7d646ba948b33c8365b" data-owner="panel-1" data-fact-role="GIVEN"><path d="M7.08340 20.95060L7.08340 16.69200L7.78960 16.69200L7.78960 20.95060L7.08340 20.95060ZM15.55780 21.80660L15.55780 7.38300L16.26400 7.38300L16.26400 21.80660L15.55780 21.80660ZM4.13020 25.74420L4.13020 25.10220L16.77760 25.10220L16.77760 25.74420L4.13020 25.74420ZM4.13020 25.29480L4.13020 20.35140L4.83640 20.35140L4.83640 25.29480L4.13020 25.29480ZM1.26260 17.16280L1.26260 17.16280L1.13420 16.49940Q2.91040 16.49940 4.99690 16.46730Q7.08340 16.43520 9.26620 16.31750Q11.44900 16.19980 13.48200 15.94300L13.48200 15.94300L13.56760 16.49940Q11.51320 16.82040 9.31970 16.95950Q7.12620 17.09860 5.06110 17.13070Q2.99600 17.16280 1.26260 17.16280ZM11.42760 19.36700L11.42760 18.72500L15.85740 18.72500L15.85740 19.36700L11.42760 19.36700ZM7.34020 8.26040L7.34020 8.26040Q8.73120 8.26040 9.75840 8.65630Q10.78560 9.05220 11.35270 9.76910Q11.91980 10.48600 11.91980 11.47040L11.91980 11.47040Q11.91980 12.45480 11.35270 13.18240Q10.78560 13.91000 9.75840 14.29520Q8.73120 14.68040 7.34020 14.68040L7.34020 14.68040Q5.9