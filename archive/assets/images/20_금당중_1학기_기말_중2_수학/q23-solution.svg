<svg xmlns="http://www.w3.org/2000/svg" width="512" height="206" viewBox="0 0 512 206" role="img" aria-labelledby="visual-title visual-desc" data-composite="composite-panels-v1"><title id="visual-title">출발점에서 x미터 떨어진 지점까지 갔다 온다고 하면 갈 때는 x/60분, 올 때는 x/80분이 걸린다. 두 시간의 합이 70분 이하이므로 x/60+x/80≤70이고, 양변에 240을 곱하면 4x+3x≤16800, 즉 7x≤16800에서 x≤2400이다. 따라서 최대 거리는 2400미터, 즉 2.4킬로미터이다. 따라서 답은 2.4킬로미터이다.</title><desc id="visual-desc">수직선 한 줄에 왼쪽 끝없이 이어지다가 2400에서 멈추는 굵은 범위가 있고, 끝점 2400은 채운 점으로 표시되어 있다.</desc><g id="p1-caption" data-role="caption" data-panel="1" data-font-px="24.5"><g id="p1-p1-caption-text" transform="translate(196.95499999999998 36.262)" data-label-kind="CAPTION" data-owner="panel-1" data-fragment-sha="sha256:f2651de9fdcd5eb8c47a7ac2dfcdecaad9811b4632502ceb805274abc44fd528"><svg xmlns="http://www.w3.org/2000/svg" width="118.09" height="35.476" viewBox="0 0 118.09 35.476" data-outline-width="118.09" data-outline-height="35.476" id="lb-957dc456d51b4c78e21f755b9dae35d3437c40762e88e3244849eb5042c6258f" data-owner="panel-1" data-fact-role="GIVEN"><path d="M18.10550 30.06150L18.10550 8.42800L18.88950 8.42800L18.88950 30.06150L18.10550 30.06150ZM12.15200 18.22800L12.15200 17.49300L18.35050 17.49300L18.35050 18.22800L12.15200 18.22800ZM11.34350 10.92700L11.34350 10.85350L12.12750 10.85350Q12.12750 13.00950 11.53950 15.09200Q10.95150 17.17450 9.75100 19.08550Q8.55050 20.99650 6.67625 22.63800Q4.80200 24.27950 2.22950 25.55350L2.22950 25.55350L1.69050 24.91650Q4.11600 23.74050 5.92900 22.19700Q7.74200 20.65350 8.94250 18.82825Q10.14300 17.00300 10.74325 15.00625Q11.34350 13.00950 11.34350 10.92700L11.34350 10.92700ZM2.54800 11.58850L2.54800 10.85350L11.76000 10.85350L11.76000 11.58850L2.54800 11.58850ZM40.64550 30.06150L40.64550 8.42800L41.42950 8.42800L41.42950 30.06150L40.64550 30.06150ZM25.33300 24.64700L25.33300 23.91200L26.99900 23.91200Q28.71400 23.91200 30.44125 23.85075Q32.16850 23.78950 34.04275 23.60575Q35.91700 23.42200 38.04850 23.10350L38.04850 23.10350L38.14