<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340" width="560" height="340" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">상자 x개의 무게는 30x이고 배달원의 무게는 70이므로 승강기에 실리는 전체 무게는 30x+70이다. 승강기는 500까지 운반할 수 있으므로 30x+70≤500이어야 한다. 그림에서 상자와 배달원의 무게를 합한 길이를 한도 500과 비교할 수 있다. 따라서 답은 ④이다.</title><desc id="visual-desc">가로로 놓인 막대가 상자 무게 30x와 배달원 무게 70의 두 구간으로 나뉘고, 그 위와 아래에 합 30x+70과 한도 500의 치수가 나란히 표시되어 있다.</desc><rect width="560" height="340" fill="#fff"/><g data-layer="30"><line id="sAB" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="58.571428571" y1="170" x2="259.87012987" y2="170"/></g><g data-layer="30"><line id="sBC" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="259.87012987" y1="170" x2="340.38961039" y2="170"/></g><g data-layer="30"><line id="sCD" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="340.38961039" y1="170" x2="501.428571429" y2="170"/></g><g data-layer="52"><line id="dBox-ext-from" data-role="indicator" stroke="#111" stroke-width="0.8" fill="none" data-mark="dimension" data-mark-id="dBox" data-mark-part="ext-from" x1="58.571428571" y1="166" x2="58.571428571" y2="150.5"/></g><g data-layer="52"><line id="dBox-ext-to" data-role="indicator" stroke="#111" stroke-width="0.8" fill="none" data-mark="dimension" data-mark-id="dBox" data-mark-part="ext-to" x1="259.87012987" y1=