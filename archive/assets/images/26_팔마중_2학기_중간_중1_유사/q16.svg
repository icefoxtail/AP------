<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 440" width="480" height="440" role="img" aria-labelledby="q16-title q16-desc">
  <title id="q16-title">정오각형 ABCDE의 대각선과 각의 크기</title>
  <desc id="q16-desc">정오각형 ABCDE에서 대각선 AC, BD가 교점 P에서 만날 때 각 x, y를 구하는 다이어그램</desc>
  <rect width="480" height="440" fill="#ffffff"/>
  <!-- 정오각형 ABCDE: 중심 (240, 230), 반지름 160 -->
  <!-- A = (240, 70), B = (88, 180), C = (146, 359), D = (334, 359), E = (392, 180) -->
  <polygon points="240,70 88,180 146,359 334,359 392,180" fill="#f8fafc" stroke="#1e293b" stroke-width="2.5"/>
  <!-- 대각선 AC: (240, 70) to (146, 359) -->
  <line x1="240" y1="70" x2="146" y2="359" stroke="#2563eb" stroke-width="2.2"/>
  <!-- 대각선 BD: (88, 180) to (334, 359) -->
  <line x1="88" y1="180" x2="334" y2="359" stroke="#2563eb" stroke-width="2.2"/>
  <!-- 교점 P: 약 (182, 248) -->
  <circle cx="182" cy="248" r="4.5" fill="#dc2626"/>
  <!-- 각 x 표시 (APB): 교점 P 위쪽/왼쪽 호 -->
  <path d="M 172,218 A 30,30 0 0,1 155,228" fill="none" stroke="#dc2626" stroke-width="2"/>
  <!-- 각 y 표시 (BDC): 점 D (334, 359) 안쪽 호 -->
  <path d="M 296,331 A 45,45 0 0,1 289,359" fill="none" stroke="#16a34a" stroke-width="2"/>
  <!-- 꼭짓점 점 -->
  <circle cx="240" cy="70" r="4.5" fill="#1e293b"/>
  <circle cx="88" cy="180" r="4.5" fill="#1e293b"/>
  <circle cx="146" cy="359" r="4.5" fill="#1e293b"/>
  <circle cx="334" cy="359" r="4.5" fill="#1e293b"/>
  <circle cx="392" cy="180" r="4.5" fill="#1e293b"/>
  <!-- 꼭짓점 문자 -->
  <g font-family="sans-serif" font-size="16" font-weight="bold" fill="#0f172a" text-anchor="middle">
    <text x="240" y="50">A</text>
    <text x="65" y="185">B</text>
    <text x="135" y="385">C</text>
    <text x="345" y="385">D</text>
    <text x="410" y="185">E</text>
    <text x="200" y="245" fill="#dc2626">P</text>
  </g>
  <g font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="middle">
    <text x="145" y="210" fill="#dc2626">x</text>
    <text x="275" y="340" fill="#16a34a">y</text>
  </g>
</svg>