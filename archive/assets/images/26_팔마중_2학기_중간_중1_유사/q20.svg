<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 340" width="520" height="340" role="img" aria-labelledby="q20-title q20-desc">
  <title id="q20-title">평행선 사이의 꺾인 선과 각의 비</title>
  <desc id="q20-desc">두 평행선 l, m 사이에서 각 DAC:DAB=4:1, 각 ACE:BCE=4:1일 때 각 ABC를 구하는 다이어그램</desc>
  <rect width="520" height="340" fill="#ffffff"/>
  <!-- 직선 l, m (수평선) -->
  <line x1="50" y1="80" x2="470" y2="80" stroke="#1e293b" stroke-width="2.5"/>
  <line x1="50" y1="260" x2="470" y2="260" stroke="#1e293b" stroke-width="2.5"/>
  <!-- 점 A on l (120, 80), 점 D on l (380, 80) -->
  <!-- 점 C on m (220, 260), 점 E on m (440, 260) -->
  <!-- 점 B (꺾인 꼭짓점) (280, 170) -->
  <!-- 선분 AC (가로지르는 횡단선) -->
  <line x1="120" y1="80" x2="220" y2="260" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4 3"/>
  <!-- 삼각형 ABC 변 AB, BC -->
  <line x1="120" y1="80" x2="280" y2="170" stroke="#2563eb" stroke-width="2.5"/>
  <line x1="280" y1="170" x2="220" y2="260" stroke="#2563eb" stroke-width="2.5"/>
  <!-- 점들 -->
  <circle cx="120" cy="80" r="4.5" fill="#1e293b"/>
  <circle cx="280" cy="170" r="4.5" fill="#2563eb"/>
  <circle cx="220" cy="260" r="4.5" fill="#1e293b"/>
  <circle cx="380" cy="80" r="4" fill="#64748b"/>
  <circle cx="440" cy="260" r="4" fill="#64748b"/>
  <!-- 레이블 -->
  <g font-family="sans-serif" font-size="16" font-weight="bold" fill="#0f172a" text-anchor="middle">
    <text x="120" y="60">A</text>
    <text x="380" y="60">D</text>
    <text x="300" y="175" fill="#2563eb">B</text>
    <text x="220" y="285">C</text>
    <text x="440" y="285">E</text>
    <text x="485" y="85">l</text>
    <text x="485" y="265">m</text>
  </g>
</svg>