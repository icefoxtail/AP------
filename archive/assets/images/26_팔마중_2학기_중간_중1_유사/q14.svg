<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 280" width="520" height="280" role="img" aria-labelledby="q14-title q14-desc">
  <title id="q14-title">두 삼각형 ABC와 DEF의 합동 조건 탐색</title>
  <desc id="q14-desc">변 AB=DE, 변 BC=EF가 주어진 두 삼각형 ABC, DEF의 합동 조건 다이어그램</desc>
  <rect width="520" height="280" fill="#ffffff"/>
  <!-- 삼각형 ABC: A=(120, 70), B=(60, 220), C=(240, 220) -->
  <polygon points="120,70 60,220 240,220" fill="#f8fafc" stroke="#1e293b" stroke-width="2.5"/>
  <!-- AB 1-tick mark -->
  <line x1="86" y1="140" x2="94" y2="150" stroke="#dc2626" stroke-width="2.5"/>
  <!-- BC 2-tick mark -->
  <line x1="147" y1="214" x2="147" y2="226" stroke="#2563eb" stroke-width="2.5"/>
  <line x1="153" y1="214" x2="153" y2="226" stroke="#2563eb" stroke-width="2.5"/>
  <!-- 삼각형 DEF: D=(380, 70), E=(320, 220), F=(500, 220) -->
  <polygon points="380,70 320,220 500,220" fill="#f8fafc" stroke="#1e293b" stroke-width="2.5"/>
  <!-- DE 1-tick mark -->
  <line x1="346" y1="140" x2="354" y2="150" stroke="#dc2626" stroke-width="2.5"/>
  <!-- EF 2-tick mark -->
  <line x1="407" y1="214" x2="407" y2="226" stroke="#2563eb" stroke-width="2.5"/>
  <line x1="413" y1="214" x2="413" y2="226" stroke="#2563eb" stroke-width="2.5"/>
  <!-- 점들 -->
  <circle cx="120" cy="70" r="4" fill="#1e293b"/>
  <circle cx="60" cy="220" r="4" fill="#1e293b"/>
  <circle cx="240" cy="220" r="4" fill="#1e293b"/>
  <circle cx="380" cy="70" r="4" fill="#1e293b"/>
  <circle cx="320" cy="220" r="4" fill="#1e293b"/>
  <circle cx="500" cy="220" r="4" fill="#1e293b"/>
  <!-- 레이블 -->
  <g font-family="sans-serif" font-size="16" font-weight="bold" fill="#0f172a" text-anchor="middle">
    <text x="120" y="55">A</text>
    <text x="45" y="235">B</text>
    <text x="255" y="235">C</text>
    <text x="380" y="55">D</text>
    <text x="305" y="235">E</text>
    <text x="515" y="235">F</text>
  </g>
</svg>