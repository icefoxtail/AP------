<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320" width="500" height="320" role="img" aria-labelledby="q09-title q09-desc">
  <title id="q09-title">두 쌍의 평행선과 동위각, 엇각</title>
  <desc id="q09-desc">평행선 l, m과 교차하는 평행선 p, q에 의해 생기는 각 x, y를 구하는 다이어그램</desc>
  <rect width="500" height="320" fill="#ffffff"/>
  <!-- 수평 평행선 l, m -->
  <line x1="50" y1="100" x2="450" y2="100" stroke="#1e293b" stroke-width="2.5"/>
  <line x1="50" y1="220" x2="450" y2="220" stroke="#1e293b" stroke-width="2.5"/>
  <!-- 비스듬한 평행선 p, q (기울기 약 1.33) -->
  <line x1="120" y1="280" x2="250" y2="40" stroke="#2563eb" stroke-width="2.5"/>
  <line x1="240" y1="280" x2="370" y2="40" stroke="#2563eb" stroke-width="2.5"/>
  <!-- 각 표시 -->
  <!-- 105° 호 (q와 l의 교점 (337.5, 100) 오른쪽 아래) -->
  <path d="M 365,100 A 30,30 0 0,1 320,132" fill="none" stroke="#dc2626" stroke-width="2"/>
  <!-- x 호 (p와 l의 교점 (217.5, 100)) -->
  <path d="M 218,65 A 35,35 0 0,1 252,100" fill="none" stroke="#16a34a" stroke-width="2"/>
  <!-- y 호 (q와 m의 교점 (272.5, 220)) -->
  <path d="M 273,185 A 35,35 0 0,1 307,220" fill="none" stroke="#7c3aed" stroke-width="2"/>
  <!-- 직선 레이블 -->
  <g font-family="sans-serif" font-size="16" font-weight="bold" fill="#0f172a">
    <text x="460" y="105">l</text>
    <text x="460" y="225">m</text>
    <text x="255" y="35" fill="#2563eb">p</text>
    <text x="375" y="35" fill="#2563eb">q</text>
  </g>
  <!-- 각 레이블 -->
  <g font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="middle">
    <text x="365" y="135" fill="#dc2626">105°</text>
    <text x="238" y="80" fill="#16a34a">x</text>
    <text x="295" y="200" fill="#7c3aed">y</text>
  </g>
</svg>