<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 708 505" width="708" height="505" role="img" aria-labelledby="title desc"><title id="title">발사 뒤 물체가 지나가는 높이 그래프</title><desc id="desc">물체는 높이 20 m에서 출발해 올라갔다가 주황 점에서 지면에 닿는다. 가로축은 발사 후의 시간이다.</desc><rect width="708" height="505" fill="white" /><line x1="57.0000" y1="384.7897" x2="648.0000" y2="384.7897" stroke="#586574" stroke-width="1.65" stroke-linecap="round" /><line x1="128.1065" y1="416.0000" x2="128.1065" y2="58.0000" stroke="#586574" stroke-width="1.65" stroke-linecap="round" /><polygon points="648.0000,384.7897 636.0000,379.7897 636.0000,389.7897" fill="#586574" /><polygon points="128.1065,58.0000 123.1065,70.0000 133.1065,70.0000" fill="#586574" /><text x="661.0000" y="375.7897" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#586574" text-anchor="middle">t</text><circle cx="128.10650887573962" cy="384.7897435897436" r="4.6" fill="#28364b" /><text x="114.1065" y="410.7897" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">O</text><path d="M 128.1065 201.2000 Q 361.2426 -74.1846 594.3787 384.7897" stroke="#205d9c" stroke-width="5.75" stroke-linecap="round" fill="none" /><text x="101.1065" y="209.2000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#586574" text-anchor="middle">20</text><circle cx="128.10650887573962" cy="201.20000000000002" r="4.6" fill="#205d9c" /><circle cx="594.3786982248521" cy="384.7897435897436" r="4.6" fill="#aa5411" /><text x="572.3787" y="419.7897" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#aa5411" text-anchor="middle">지면</text><text x="206.0000" y="40.0000" font-size="30" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#586574" text-anchor="middle">높이(m)</text><text x="489.0000" y="472.0000" font-size="29" font-family="Malgun Gothic, Camb