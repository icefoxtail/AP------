<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 703 549" width="703" height="549" role="img" aria-labelledby="title desc"><title id="title">두 포물선 사이의 색칠된 구간</title><desc id="desc">위로 열린 파란 포물선과 아래로 열린 주황 포물선 사이 두 쪽을 초록으로 칠했다. 두 포물선은 원점에서 만난다.</desc><rect width="703" height="549" fill="white" /><path d="M 351.0000 294.4267 Q 253.7654 294.4267 156.5308 58.0000 L 56.000 58.000 L 56.000 461.000 L 68.2739 461.0000 Q 209.6369 294.4267 351.0000 294.4267 Z" fill="#e5f3e4" /><path d="M 351.0000 294.4267 Q 448.2346 294.4267 545.4692 58.0000 L 646.000 58.000 L 646.000 461.000 L 633.7261 461.0000 Q 492.3631 294.4267 351.0000 294.4267 Z" fill="#e5f3e4" /><line x1="56.0000" y1="294.4267" x2="646.0000" y2="294.4267" stroke="#586574" stroke-width="1.65" stroke-linecap="round" /><polygon points="646.0000,294.4267 633.0000,289.4267 633.0000,299.4267" fill="#586574" /><text x="663.0000" y="286.4267" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#586574" text-anchor="middle">x</text><line x1="351.0000" y1="461.0000" x2="351.0000" y2="58.0000" stroke="#586574" stroke-width="1.65" stroke-linecap="round" /><polygon points="351.0000,58.0000 346.0000,71.0000 356.0000,71.0000" fill="#586574" /><text x="367.0000" y="64.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#586574" text-anchor="middle">y</text><circle cx="351.0" cy="294.4266666666667" r="4.6" fill="#28364b" /><text x="336.0000" y="321.4267" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">O</text><path d="M 156.5308 58.0000 Q 351.0000 530.8533 545.4692 58.0000" stroke="#205d9c" stroke-width="5.55" stroke-linecap="round" fill="none" /><path d="M 68.2739 461.0000 Q 351.0000 127.8533 633.7261 461.0000" stroke="#aa5411" stroke-width="5.55" stroke-linecap="round" fill="none" /><line x1="57.0000" y1="508.0000" x2="109.0000" y2="508.0000" stroke="#205d9c" stroke-width="4.7" stroke-linecap="round" /><text x="121.0000" y="516.0000" font-size="30" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#205d9c" text-anchor="start">y = 3x²</text><line x1="424.0000" y1="508.0000" x2="476.0000" y2="508.0000" stroke="#aa5411" stroke-width="4.7" stroke-linecap="round" /><text x="488.0000" y="516.0000" font-size="30" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#aa5411" text-anchor="start">y = −x²</text></svg>
