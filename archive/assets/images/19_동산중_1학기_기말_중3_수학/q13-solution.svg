<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 710 598" width="710" height="598" role="img" aria-labelledby="title desc"><title id="title">정사각형을 떼어 내도 닮은 황금 직사각형</title><desc id="desc">오른쪽 그림에는 아래 직사각형만 각 변의 길이를 유지한 채 90도 돌려 놓았다. 큰 직사각형의 긴 변 1과 작은 직사각형의 긴 변 x가 대응한다.</desc><rect width="710" height="598" fill="white" /><rect x="113" y="78" width="245.35949353370827" height="245.35949353370827" fill="#e1eefb" stroke="#205d9c" stroke-width="4.0" /><rect x="113" y="323.35949353370825" width="245.35949353370827" height="151.64050646629173" fill="#fae6ce" stroke="#aa5411" stroke-width="4.0" /><circle cx="113" cy="78" r="4.75" fill="#28364b" /><text x="96.0000" y="68.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">A</text><circle cx="358.35949353370825" cy="78" r="4.75" fill="#28364b" /><text x="373.3595" y="68.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">D</text><circle cx="113" cy="323.35949353370825" r="4.75" fill="#28364b" /><text x="96.0000" y="330.3595" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">F</text><circle cx="358.35949353370825" cy="323.35949353370825" r="4.75" fill="#28364b" /><text x="373.3595" y="330.3595" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">E</text><circle cx="113" cy="475" r="4.75" fill="#28364b" /><text x="99.0000" y="497.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">B</text><circle cx="358.35949353370825" cy="475" r="4.75" fill="#28364b" /><text x="373.3595" y="497.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">C</text><line x1="84.0000" y1="78.0000" x2="84.0000