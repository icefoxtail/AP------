<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 731 490" width="731" height="490" role="img" aria-labelledby="title desc"><title id="title">같은 폭으로 오려낸 가로와 세로 띠</title><desc id="desc">왼쪽은 원래 종이와 오려낸 띠이다. 오른쪽은 남은 네 색 조각을 밀어 붙인 직사각형이며 폭과 높이가 각각 x만큼 줄었다.</desc><rect width="731" height="490" fill="white" /><rect x="106" y="150" width="234" height="130" fill="#f9e2c4" stroke="#586574" stroke-width="3.4" /><rect x="106" y="150" width="143" height="52" fill="#e6eefb" stroke="#586574" stroke-width="2.7" /><rect x="275" y="150" width="65" height="52" fill="#e4efd9" stroke="#586574" stroke-width="2.7" /><rect x="106" y="228" width="143" height="52" fill="#eae0f6" stroke="#586574" stroke-width="2.7" /><rect x="275" y="228" width="65" height="52" fill="#d8f0ed" stroke="#586574" stroke-width="2.7" /><line x1="106.0000" y1="302.0000" x2="340.0000" y2="302.0000" stroke="#586574" stroke-width="1.65" stroke-linecap="round" /><line x1="106.0000" y1="297.0000" x2="106.0000" y2="307.0000" stroke="#586574" stroke-width="1.65" stroke-linecap="round" /><line x1="340.0000" y1="297.0000" x2="340.0000" y2="307.0000" stroke="#586574" stroke-width="1.65" stroke-linecap="round" /><text x="223.0000" y="338.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#586574" text-anchor="middle">18 cm</text><line x1="90.0000" y1="150.0000" x2="90.0000" y2="280.0000" stroke="#586574" stroke-width="1.65" stroke-linecap="round" /><line x1="95.0000" y1="150.0000" x2="85.0000" y2="150.0000" stroke="#586574" stroke-width="1.65" stroke-linecap="round" /><line x1="95.0000" y1="280.0000" x2="85.0000" y2="280.0000" stroke="#586574" stroke-width="1.65" stroke-linecap="round" /><text x="50.0000" y="223.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#586574" text-anchor="middle">10 cm</text><text x="241.0000" y="94.0000" font-size="30" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">오려내기 전</text><rect x="423" y="150" width="143" height="52" fill="#e6eefb" stroke="#586574" stroke-width="2.7" /><rect x="566" y="150" width="65" height="52" fill="#e4efd9" stroke="#586574" stroke-width="2.7" /><rect x="423" y="202" width="143" height="52" fill="#eae0f6" stroke="#586574" stroke-width="2.7" /><rect x="566" y="202" width="65" height="52" fill="#d8f0ed" stroke="#586574" stroke-width="2.7" /><line x1="423.0000" y1="276.0000" x2="631.0000" y2="276.0000" stroke="#586574" stroke-width="1.65" stroke-linecap="round" /><line x1="423.0000" y1="271.0000" x2="423.0000" y2="281.0000" stroke="#586574" stroke-width="1.65" stroke-linecap="round" /><line x1="631.0000" y1="271.0000" x2="631.0000" y2="281.0000" stroke="#586574" stroke-width="1.65" stroke-linecap="round" /><text x="527.0000" y="312.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#586574" text-anchor="middle">18−x</text><line x1="648.0000" y1="150.0000" x2="648.0000" y2="254.0000" stroke="#586574" stroke-width="1.65" stroke-linecap="round" /><line x1="653.0000" y1="150.0000" x2="643.0000" y2="150.0000" stroke="#586574" stroke-width="1.65" stroke-linecap="round" /><line x1="653.0000" y1="254.0000" x2="643.0000" y2="254.0000" stroke="#586574" stroke-width="1.65" stroke-linecap="round" /><text x="686.0000" y="210.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#586574" text-anchor="middle">10−x</text><text x="543.0000" y="94.0000" font-size="30" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">붙인 네 조각</text><text x="553.0000" y="411.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#266f73" text-anchor="middle">넓이 128 cm²</text></svg>
