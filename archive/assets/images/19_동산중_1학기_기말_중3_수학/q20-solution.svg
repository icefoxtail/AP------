<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 718 700" width="718" height="700" role="img" aria-labelledby="title desc"><title id="title">두 포물선 사이의 색칠된 구간</title><desc id="desc">위 그림에서 x가 1인 세로 점선은 파랑과 주황 경계를 잇는다. 아래 수직선에서 계수 −1과 3 사이의 초록 구간을 보고 네 후보 계수를 비교한다.</desc><rect width="718" height="700" fill="white" /><path d="M 358.5000 274.4800 Q 258.7933 274.4800 159.0867 58.0000 L 56.000 58.000 L 56.000 427.000 L 68.5859 427.0000 Q 213.5430 274.4800 358.5000 274.4800 Z" fill="#e5f3e4" /><path d="M 358.5000 274.4800 Q 458.2067 274.4800 557.9133 58.0000 L 661.000 58.000 L 661.000 427.000 L 648.4141 427.0000 Q 503.4570 274.4800 358.5000 274.4800 Z" fill="#e5f3e4" /><line x1="56.0000" y1="274.4800" x2="661.0000" y2="274.4800" stroke="#586574" stroke-width="1.65" stroke-linecap="round" /><polygon points="661.0000,274.4800 648.0000,269.4800 648.0000,279.4800" fill="#586574" /><text x="678.0000" y="266.4800" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#586574" text-anchor="middle">x</text><line x1="358.5000" y1="427.0000" x2="358.5000" y2="58.0000" stroke="#586574" stroke-width="1.65" stroke-linecap="round" /><polygon points="358.5000,58.0000 353.5000,71.0000 363.5000,71.0000" fill="#586574" /><text x="374.5000" y="64.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#586574" text-anchor="middle">y</text><circle cx="358.5" cy="274.48" r="4.6" fill="#28364b" /><text x="343.5000" y="301.4800" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">O</text><path d="M 159.0867 58.0000 Q 358.5000 490.9600 557.9133 58.0000" stroke="#205d9c" stroke-width="5.55" stroke-linecap="round" fill="none" /><path d="M 68.5859 427.0000 Q 358.5000 121.9600 648.4141 427.0000" stroke="#aa5411" stroke-width="5.55" stroke-linecap="round" fill="none" /><line x1="57.0000" y1="468.0000" x2="109.0000" y2="468.0000" stroke="#205d9c" stroke-width="4.7" stroke-linecap="round" /><text x="121.0000" y="476.0000" font-size="30" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#205d9c" text-anchor="start">y = 3x²</text><line x1="424.0000" y1="468.0000" x2="476.0000" y2="468.0000" stroke="#aa5411" stroke-width="4.7" stroke-linecap="round" /><text x="488.0000" y="476.0000" font-size="30" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#aa5411" text-anchor="start">y = −x²</text><line x1="492.9444" y1="307.2800" x2="492.9444" y2="176.0800" stroke="#277339" stroke-width="3.05" stroke-linecap="round" stroke-dasharray="6 5" /><circle cx="492.94444444444446" cy="307.28" r="4.6" fill="#aa5411" /><circle cx="492.94444444444446" cy="176.08" r="4.6" fill="#205d9c" /><text x="508.9444" y="300.4800" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#277339" text-anchor="middle">1</text><text x="359.0000" y="548.0000" font-size="30" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#277339" text-anchor="middle">색칠된 구간에 속하는 계수</text><line x1="95.4000" y1="584.0000" x2="610.6000" y2="584.0000" stroke="#586574" stroke-width="1.85" stroke-linecap="round" /><line x1="215.0000" y1="584.0000" x2="583.0000" y2="584.0000" stroke="#277339" stroke-width="5.25" stroke-linecap="round" /><circle cx="123" cy="584" r="5.2" fill="#586574" stroke="white" stroke-width="1" /><text x="123.0000" y="629.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#586574" text-anchor="middle">−2</text><circle cx="215" cy="584" r="5.2" fill="#aa5411" stroke="white" stroke-width="1" /><text x="215.0000" y="629.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#aa5411" text-anchor="middle">−1</text><circle cx="261.0" cy="584" r="5.2" fill="#277339" stroke="white" stroke-width="1" /><text x="261.0000" y="661.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#277339" text-anchor="middle">−1/2</text><circle cx="337.6666666666667" cy="584" r="5.2" fill="#277339" stroke="white" stroke-width="1" /><text x="337.6667" y="629.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#277339" text-anchor="middle">1/3</text><circle cx="491" cy="584" r="5.2" fill="#277339" stroke="white" stroke-width="1" /><text x="491.0000" y="661.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#277339" text-anchor="middle">2</text><circle cx="583" cy="584" r="5.2" fill="#205d9c" stroke="white" stroke-width="1" /><text x="583.0000" y="629.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#205d9c" text-anchor="middle">3</text></svg>
