<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 708 505" width="708" height="505" role="img" aria-labelledby="title desc"><title id="title">기본 포물선의 대칭축과 같은 폭</title><desc id="desc">위로 열린 파란 포물선은 y축을 기준으로 양쪽이 같다. x축을 접는 기준으로 하면 같은 폭의 주황 포물선과 대응한다.</desc><rect width="708" height="505" fill="white" /><line x1="57.0000" y1="237.0000" x2="648.0000" y2="237.0000" stroke="#586574" stroke-width="1.65" stroke-linecap="round" /><polygon points="648.0000,237.0000 635.0000,232.0000 635.0000,242.0000" fill="#586574" /><text x="665.0000" y="229.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#586574" text-anchor="middle">x</text><line x1="352.5000" y1="416.0000" x2="352.5000" y2="58.0000" stroke="#586574" stroke-width="1.65" stroke-linecap="round" /><polygon points="352.5000,58.0000 347.5000,71.0000 357.5000,71.0000" fill="#586574" /><text x="368.5000" y="64.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#586574" text-anchor="middle">y</text><circle cx="352.5" cy="237.0" r="4.6" fill="#28364b" /><text x="337.5000" y="264.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">O</text><path d="M 98.7176 80.9087 Q 352.5000 393.0913 606.2824 80.9087" stroke="#205d9c" stroke-width="5.75" stroke-linecap="round" fill="none" /><path d="M 98.7176 393.0913 Q 352.5000 80.9087 606.2824 393.0913" stroke="#aa5411" stroke-width="5.3" stroke-linecap="round" fill="none" stroke-dasharray="13 6" /><circle cx="183.31176470588235" cy="167.6261090909091" r="4.6" fill="#277339" /><circle cx="521.6882352941177" cy="167.6261090909091" r="4.6" fill="#277339" /><line x1="183.3118" y1="167.6261" x2="521.6882" y2="167.6261" stroke="#277339" stroke-width="2.0" stroke-linecap="round" stroke-dasharray="6 5" /><text x="556.0000" y="75.0000" font-size="30" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#205d9c" text-anchor="middle">y = x²</text><text x="563.0000" y="462.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#aa5411" text-anchor="middle">y = −x²</text></svg>
