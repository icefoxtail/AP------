<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 708 505" width="708" height="505" role="img" aria-labelledby="title desc"><title id="title">위로 이동한 포물선과 폭이 좁은 포물선</title><desc id="desc">파랑 그래프의 꼭짓점은 x축보다 하나 위에 있다. 각 꼭짓점에서 같은 높이를 올려 파랑과 주황의 가로 길이를 비교하고, 파랑 왼쪽 가지가 오른쪽으로 갈수록 낮아짐을 읽는다.</desc><rect width="708" height="505" fill="white" /><line x1="57.0000" y1="386.6810" x2="648.0000" y2="386.6810" stroke="#586574" stroke-width="1.65" stroke-linecap="round" /><polygon points="648.0000,386.6810 635.0000,381.6810 635.0000,391.6810" fill="#586574" /><text x="665.0000" y="378.6810" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#586574" text-anchor="middle">x</text><line x1="352.5000" y1="416.0000" x2="352.5000" y2="58.0000" stroke="#586574" stroke-width="1.65" stroke-linecap="round" /><polygon points="352.5000,58.0000 347.5000,71.0000 357.5000,71.0000" fill="#586574" /><text x="368.5000" y="64.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#586574" text-anchor="middle">y</text><circle cx="352.5" cy="386.6810344827586" r="4.6" fill="#28364b" /><text x="337.5000" y="413.6810" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">O</text><path d="M 75.2247 75.7827 Q 352.5000 635.8552 629.7753 75.7827" stroke="#205d9c" stroke-width="5.75" stroke-linecap="round" fill="none" /><path d="M 115.5793 79.9985 Q 352.5000 693.3636 589.4207 79.9985" stroke="#aa5411" stroke-width="5.2" stroke-linecap="round" fill="none" stroke-dasharray="13 6" /><line x1="130.8179" y1="176.8190" x2="574.1821" y2="176.8190" stroke="#205d9c" stroke-width="1.9" stroke-linecap="round" stroke-dasharray="6 5" /><circle cx="130.81789995016516" cy="176.81896551724137" r="4.6" fill="#205d9c" /><circle cx="574.1821000498348" cy="176.81896551724137" r="4.6" fill="#205d9c" /><line x1="171.4973" y1="207.6810" x2="533.5027" y2="207.6810" stroke="#aa5411" stroke-width="1.9" stroke-linecap="round" stroke-dasharray="6 5" /><circle cx="171.49732325643174" cy="207.6810344827586" r="4.6" fill="#aa5411" /><circle cx="533.5026767435683" cy="207.6810344827586" r="4.6" fill="#aa5411" /><circle cx="352.5" cy="355.8189655172414" r="4.6" fill="#205d9c" /><text x="196.0000" y="466.0000" font-size="30" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#205d9c" text-anchor="middle">y = 2x² + 1</text><text x="537.0000" y="466.0000" font-size="30" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#aa5411" text-anchor="middle">y = 3x²</text></svg>
