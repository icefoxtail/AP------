<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 708 505" width="708" height="505" role="img" aria-labelledby="title desc"><title id="title">꼭짓점 왼쪽에서 감소하는 포물선의 가지</title><desc id="desc">주황 왼쪽 가지를 따라 오른쪽으로 가면 낮아진다. 주황과 파랑이 만나는 아래쪽 점에서 대칭축을 점선으로 그렸다.</desc><rect width="708" height="505" fill="white" /><line x1="57.0000" y1="262.5714" x2="648.0000" y2="262.5714" stroke="#586574" stroke-width="1.65" stroke-linecap="round" /><polygon points="648.0000,262.5714 635.0000,257.5714 635.0000,267.5714" fill="#586574" /><text x="665.0000" y="254.5714" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#586574" text-anchor="middle">x</text><line x1="245.8213" y1="416.0000" x2="245.8213" y2="58.0000" stroke="#586574" stroke-width="1.65" stroke-linecap="round" /><polygon points="245.8213,58.0000 240.8213,71.0000 250.8213,71.0000" fill="#586574" /><text x="261.8213" y="64.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#586574" text-anchor="middle">y</text><circle cx="245.82129963898916" cy="262.57142857142856" r="4.6" fill="#28364b" /><text x="230.8213" y="289.5714" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">O</text><path d="M 116.7401 83.7822 Q 234.6200 386.5541 352.5000 386.5541" stroke="#aa5411" stroke-width="5.75" stroke-linecap="round" fill="none" stroke-dasharray="13 6" /><path d="M 352.5000 386.5541 Q 470.3800 386.5541 588.2599 83.7822" stroke="#205d9c" stroke-width="5.75" stroke-linecap="round" fill="none" /><circle cx="352.5" cy="386.5541125541125" r="4.6" fill="#aa5411" /><line x1="352.5000" y1="411.3506" x2="352.5000" y2="58.0000" stroke="#704895" stroke-width="1.9" stroke-linecap="round" stroke-dasharray="6 5" /><text x="530.0000" y="70.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#704895" text-anchor="middle">대칭축</text><polygon points="215.7261,283.1021 213.5404,271.2183 205.3354,276.9348" fill="#aa5411" /><polygon points="273.2169,350.6303 268.1006,339.6840 261.6055,347.2875" fill="#aa5411" /><text x="159.0000" y="465.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#aa5411" text-anchor="middle">왼쪽 가지에서 감소</text></svg>
