<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 698 515" width="698" height="515" role="img" aria-labelledby="title desc"><title id="title">꼭짓점과 열리는 방향을 비교하는 포물선</title><desc id="desc">아래로 열린 파란 포물선의 꼭짓점을 지나는 점선이 가로축의 1을 지난다. 세로축의 −2에도 파란 점이 놓인다.</desc><rect width="698" height="515" fill="white" /><line x1="60.0000" y1="159.5924" x2="645.0000" y2="159.5924" stroke="#586574" stroke-width="1.65" stroke-linecap="round" /><polygon points="645.0000,159.5924 632.0000,154.5924 632.0000,164.5924" fill="#586574" /><text x="662.0000" y="151.5924" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#586574" text-anchor="middle">x</text><line x1="352.5000" y1="441.0000" x2="352.5000" y2="44.0000" stroke="#586574" stroke-width="1.65" stroke-linecap="round" /><polygon points="352.5000,44.0000 347.5000,57.0000 357.5000,57.0000" fill="#586574" /><text x="368.5000" y="50.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#586574" text-anchor="middle">y</text><circle cx="352.5" cy="159.59236947791163" r="4.6" fill="#28364b" /><text x="337.5000" y="186.5924" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">O</text><path d="M 322.8242 416.2871 Q 462.8774 -97.1024 602.9305 416.2871" stroke="#205d9c" stroke-width="6.2" stroke-linecap="round" fill="none" /><text x="462.8774" y="145.5924" font-size="27" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#586574" text-anchor="middle">1</text><text x="322.5000" y="325.0301" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#586574" text-anchor="middle">−2</text><circle cx="462.87735849056605" cy="159.59236947791163" r="4.6" fill="#aa5411" /><circle cx="352.5" cy="319.0301204819277" r="4.6" fill="#205d9c" /><line x1="462.8774" y1="374.8333" x2="462.8774" y2="70.3072" stroke="#586574" stroke-width="1.8" stroke