<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 686 500" width="686" height="500" role="img" aria-labelledby="title desc"><title id="title">같은 폭으로 오려낸 가로와 세로 띠</title><desc id="desc">가로 18 cm, 세로 10 cm인 직사각형 안에 일정한 폭의 띠가 가로와 세로로 교차한다. 띠를 제거하면 서로 다른 네 조각이 남는다.</desc><rect width="686" height="500" fill="white" /><rect x="77" y="90" width="486" height="270" fill="#f9e2c4" stroke="#586574" stroke-width="3.5" /><rect x="77" y="90" width="297" height="108" fill="#e6eefb" stroke="#586574" stroke-width="2.7" /><rect x="428" y="90" width="135" height="108" fill="#e4efd9" stroke="#586574" stroke-width="2.7" /><rect x="77" y="252" width="297" height="108" fill="#eae0f6" stroke="#586574" stroke-width="2.7" /><rect x="428" y="252" width="135" height="108" fill="#d8f0ed" stroke="#586574" stroke-width="2.7" /><line x1="77.0000" y1="385.0000" x2="563.0000" y2="385.0000" stroke="#586574" stroke-width="1.65" stroke-linecap="round" /><line x1="77.0000" y1="380.0000" x2="77.0000" y2="390.0000" stroke="#586574" stroke-width="1.65" stroke-linecap="round" /><line x1="563.0000" y1="380.0000" x2="563.0000" y2="390.0000" stroke="#586574" stroke-width="1.65" stroke-linecap="round" /><text x="320.0000" y="420.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#586574" text-anchor="middle">18 cm</text><line x1="586.0000" y1="90.0000" x2="586.0000" y2="360.0000" stroke="#586574" stroke-width="1.65" stroke-linecap="round" /><line x1="591.0000" y1="90.0000" x2="581.0000" y2="90.0000" stroke="#586574" stroke-width="1.65" stroke-linecap="round" /><line x1="591.0000" y1="360.0000" x2="581.0000" y2="360.0000" stroke="#586574" stroke-width="1.65" stroke-linecap="round" /><text x="629.0000" y="233.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#586574" text-anchor="middle">10 cm</text></svg>
