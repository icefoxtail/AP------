<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 360" width="420" height="360" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">각 변환 공식으로 a=cosθ+sinθ−sinθ+cosθ=2cosθ이고, b=(cosθ+sinθ)²+2sinθ−2sinθcosθ−1=2sinθ이다. 따라서 a²+b²=4cos²θ+4sin²θ=4이다. 따라서 답은 ③이다.</title><desc id="visual-desc">빗변의 길이가 1인 직각삼각형이 있고, 한 예각이 θ로 표시되어 있다. 세 변 옆에 cosθ, sinθ, 1이 적혀 있다.</desc><rect width="420" height="360" fill="#fff"/><g data-layer="12"><polygon id="aO-sector" data-role="angleSector" stroke="none" stroke-width="1.6" fill="#d9d9d9" data-owner-points="A O P" data-mark="angle" data-mark-id="aO" data-mark-index="0" data-mark-count="1" data-mark-side="INNER" points="51.071428571,271.756966519 79.071428571,271.756966519 79.056437152,270.840836219 79.011478948,269.925686926 78.936602101,269.012498597 78.83188679,268.102249086 78.697445145,267.195913104 78.53342113,266.294461169 78.339990384,265.39885857 78.117360035,264.510064333 77.865768479,263.629030192 77.585485125,262.756699573 77.276810104,261.89400658 76.94007395,261.041874999 76.575637246,260.201217306 76.183890237,259.37293369 75.76525241,258.55791109 75.320172051,257.757022245"/></g><g data-layer="30"><line id="sOA" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="51.071428571" y1="271.756966519" x2="368.928571429" y2="271.756966519"/></g><g data-layer="30"><line id="sAP" data-role