<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 460" width="520" height="460" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">sin x = t로 치환하면 -1 ≤ t ≤ 1이고, 주어진 식은 k = -t² - t + 2가 된다. 이 이차함수는 t = -1/2에서 최대 9/4, t = 1에서 최소 0이므로 k의 범위는 0 ≤ k ≤ 9/4이다. 따라서 b - a = 9/4 - 0 = 9/4이다. 따라서 답은 ⑤이다.</title><desc id="visual-desc">가로로 놓인 t축 위에 이차함수 k = -t² - t + 2의 그래프가 아래로 볼록한 모양으로 그려져 있고, 꼭짓점에 최대 9/4, 오른쪽 끝에 1과 0, 왼쪽 끝에 -1과 2가 표시된 그림이다.</desc><rect width="520" height="460" fill="#fff"/><g data-layer="30"><line id="sAxis" data-role="line" stroke="#111" stroke-width="1.6" fill="none" stroke-dasharray="6 4" x1="116.66023166" y1="316.003861004" x2="403.33976834" y2="316.003861004"/></g><g data-layer="30"><line id="s0" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="164.44015444" y1="124.884169884" x2="188.33011583" y2="106.966698842"/></g><g data-layer="30"><line id="s1" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="188.33011583" y1="106.966698842" x2="212.22007722" y2="100.994208494"/></g><g data-layer="30"><line id="s2" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="212.22007722" y1="100.994208494" x2="236.11003861" y2="106.966698842"/></g><g data-layer="30"><line id="s3" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="236.11003861" y1="106.966698842" x2="260" y2="124