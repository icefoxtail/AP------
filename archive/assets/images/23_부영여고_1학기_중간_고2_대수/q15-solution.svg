<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 460" width="512" height="460" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="UNEQUAL_UNIT_DECLARED" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">h는 진수 h(x)=(x−1)(7−x)=−(x−4)²+9의 그래프이고 진수 조건 h(x)&gt;0에서 정의역은 1&lt;x&lt;7이다. h의 최댓값은 꼭짓점 V(4, 9)의 9이므로 y=log₃h의 최댓값은 log₃9=2이고 치역은 y≤2이다. 정의역은 1≤x≤7이 아니고 최댓값은 4가 아니다. 따라서 답은 ⑤이다.</title><desc id="visual-desc">1과 7 사이에서 위로 볼록한 포물선이 그려져 있고 꼭짓점 V의 좌표가 표시되어 있다. 양 끝은 가로축 위의 열린 점이다.</desc><rect width="512" height="460" fill="#fff"/><g data-layer="30"><line id="x-axis" data-role="axis" stroke="#111" stroke-width="1.2" fill="none" data-axis="x" x1="32" y1="387.714285714" x2="480" y2="387.714285714"/></g><g data-layer="30"><line id="y-axis" data-role="axis" stroke="#111" stroke-width="1.2" fill="none" data-axis="y" x1="72" y1="428" x2="72" y2="32"/></g><g data-layer="30"><line id="model-x-unit" data-role="tick" stroke="#111" stroke-width="0.8" fill="none" data-axis="x" data-value="1.0" data-required-label-id="tick-x-1-label" x1="124.571428571" y1="387.714285714" x2="124.571428571" y2="391.714285714"/></g><g data-layer="30"><line id="tick-x-7" data-role="tick" stroke="#111" stroke-width="0.8" fill="none" data-axis="x" data-value="7.0" data-required-label-id="tick-x-7-label" x1="440" y1="387.714285714" x2="440" y2="391.714285714"/></g><g data-layer="40"><polyline id="f-piece-1-branch-0" data-role="curve" 