<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 743 616" width="743" height="616" role="img" aria-labelledby="title desc"><title id="title">두 일차방정식의 그래프와 교점</title><desc id="desc">파란 실선과 청록 점선이 세로축 왼쪽에서 만난다. 그 점에서 축으로 그은 점선은 가로좌표 −1과 세로좌표 b를 가리킨다.</desc><rect width="743" height="616" fill="white" /><line x1="77.0000" y1="442.8286" x2="641.0000" y2="442.8286" stroke="#586574" stroke-width="2.05" stroke-linecap="round" /><polygon points="654.0000,442.8286 641.0000,437.6286 641.0000,448.0286" fill="#586574" /><line x1="356.2680" y1="584.0000" x2="356.2680" y2="111.0000" stroke="#586574" stroke-width="2.05" stroke-linecap="round" /><polygon points="356.2680,98.0000 351.0680,111.0000 361.4680,111.0000" fill="#586574" /><line x1="82.8162" y1="578.1680" x2="555.8638" y2="103.8320" stroke="#24659b" stroke-width="7.0" stroke-linecap="round" /><line x1="84.5010" y1="501.0714" x2="646.4990" y2="125.3857" stroke="#207164" stroke-width="6.75" stroke-linecap="round" stroke-dasharray="13 8" /><line x1="310.1080" y1="442.8286" x2="310.1080" y2="350.2571" stroke="#65788a" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="7 5" /><line x1="310.1080" y1="350.2571" x2="356.2680" y2="350.2571" stroke="#65788a" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="7 5" /><circle cx="310.108" cy="350.25714285714287" r="7.7" fill="#774898" stroke="white" stroke-width="2" /><line x1="310.1080" y1="437.8286" x2="310.1080" y2="447.8286" stroke="#586574" stroke-width="1.6" stroke-linecap="round" /><line x1="351.2680" y1="350.2571" x2="361.2680" y2="350.2571" stroke="#586574" stroke-width="1.6" stroke-linecap="round" /><line x1="72.0000" y1="39.0000" x2="117.0000" y2="39.0000" stroke="#24659b" stroke-width="5.65" stroke-linecap="round" /><text x="128.0000" y="46.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#24659b" text-anchor="start">x − y = −3</text><line x1="368.0000" y1="39.0000" x2="413.0000" y2="39.0000" stroke="#207164" stroke-width="5.65" stroke-linecap="round" stroke-dasharray="13 8" /><text x="424.0000" y="46.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#207164" text-anchor="start">ax + 3y = 8</text><text x="670.000" y="429.829" fill="#586574" font-size="29" font-weight="600" font-family="Malgun Gothic, Cambria Math, sans-serif" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="4.0" stroke-linejoin="round">x</text><text x="375.268" y="93.000" fill="#586574" font-size="29" font-weight="600" font-family="Malgun Gothic, Cambria Math, sans-serif" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="4.0" stroke-linejoin="round">y</text><text x="380.268" y="469.829" fill="#586574" font-size="29" font-weight="600" font-family="Malgun Gothic, Cambria Math, sans-serif" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="4.0" stroke-linejoin="round">O</text><text x="304.108" y="476.829" fill="#586574" font-size="29" font-weight="600" font-family="Malgun Gothic, Cambria Math, sans-serif" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="4.0" stroke-linejoin="round">−1</text><text x="384.268" y="368.257" fill="#586574" font-size="29" font-weight="600" font-family="Malgun Gothic, Cambria Math, sans-serif" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="4.0" stroke-linejoin="round">b</text></svg>
