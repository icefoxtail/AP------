<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" width="640" height="280" role="img" aria-labelledby="title desc">
  <title id="title">지름으로 정해지는 원과 직선의 교점 조건</title>
  <desc id="desc">지름의 양 끝점 (0,4), (2,0), 중심 (1,2), 반지름 √5인 원과 직선 2x−y+k=0의 두 교점 조건 |k|&lt;5를 나타낸 그림</desc>
  <rect width="640" height="280" fill="#fff"/>
  <text x="320" y="28" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="21" font-weight="700" fill="#1e3a5f">두 교점 조건: 중심에서 직선까지의 거리 &lt; 반지름</text>
  <rect x="18" y="45" width="350" height="215" rx="8" fill="#f8fafc" stroke="#dbe3ef"/>
  <g stroke="#e2e8f0" stroke-width="1">
    <line x1="45" y1="75" x2="350" y2="75"/><line x1="45" y1="105" x2="350" y2="105"/><line x1="45" y1="135" x2="350" y2="135"/><line x1="45" y1="165" x2="350" y2="165"/><line x1="45" y1="195" x2="350" y2="195"/><line x1="45" y1="225" x2="350" y2="225"/><line x1="75" y1="50" x2="75" y2="255"/><line x1="105" y1="50" x2="105" y2="255"/><line x1="135" y1="50" x2="135" y2="255"/><line x1="165" y1="50" x2="165" y2="255"/><line x1="195" y1="50" x2="195" y2="255"/><line x1="225" y1="50" x2="225" y2="255"/><line x1="255" y1="50" x2="255" y2="255"/><line x1="285" y1="50" x2="285" y2="255"/><line x1="315" y1="50" x2="315" y2="255"/>
  </g>
  <line x1="45" y1="190" x2="354" y2="190" stroke="#0f172a" stroke-width="1.5"/><line x1="175" y1="50" x2="175" y2="258" stroke="#0f172a" stroke-width="1.5"/>
  <text x="345" y="184" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14">x</text><text x="182" y="62" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14">y</text>
  <circle cx="203" cy="134" r="62.6" fill="#dbeafe" fill-opacity=".62" stroke="#2563eb" stroke-width="2.6"/>
  <line x1="175" y1="78" x2="231" y2="190" stroke="#dc2626" stroke-width="2.5"/>
  <line x1="91" y1="218" x2="189" y2="50" stroke="#f59e0b" stroke-width="2.1" stroke-dasharray="7 5"/>
  <line x1="142" y1="255" x2="245" y2="50" stroke="#64748b" stroke-width="2.2"/>
  <line x1="213" y1="255" x2="308" y2="64" stroke="#dc2626" stroke-width="2.1" stroke-dasharray="7 5"/>
  <circle cx="175" cy="78" r="4.3" fill="#dc2626"/><circle cx="231" cy="190" r="4.3" fill="#dc2626"/><circle cx="203" cy="134" r="4.5" fill="#1d4ed8"/>
  <text x="148" y="70" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="12" font-weight="700" fill="#b91c1c">A(0,4)</text>
  <text x="235" y="205" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="12" font-weight="700" fill="#b91c1c">B(2,0)</text>
  <text x="210" y="130" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="13" font-weight="700" fill="#1d4ed8">C(1,2)</text>
  <text x="93" y="211" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="11" fill="#b45309">k=5</text>
  <text x="206" y="248" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="11" fill="#475569">k=0</text>
  <text x="283" y="73" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="11" fill="#b91c1c">k=−5</text>
  <rect x="390" y="45" width="232" height="215" rx="8" fill="#f8fafc" stroke="#dbe3ef"/>
  <text x="408" y="75" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="17" font-weight="700" fill="#334155">거리 조건</text>
  <text x="408" y="108" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14">중심 C=(1,2), r=√5</text>
  <text x="408" y="138" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14">d(C,l)=|k|/√5</text>
  <text x="408" y="168" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="15" font-weight="700" fill="#1d4ed8">|k|/√5&lt;√5 → |k|&lt;5</text>
  <text x="408" y="198" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="13">−5&lt;k&lt;5</text>
  <text x="408" y="228" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="13">정수 −4,−3,...,4</text>
  <text x="408" y="253" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="15" font-weight="700" fill="#1d4ed8">총 9개 → 정답 ④</text>
</svg>
