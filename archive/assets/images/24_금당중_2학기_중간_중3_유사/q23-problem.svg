<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 480" width="560" height="480" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">원 모양의 접시가 두 개의 곧은 금으로 세 조각으로 나뉜 그림이다. 작은 조각부터 큰 조각까지 ①, ②, ③ 번호가 붙어 있다.</title><desc id="visual-desc">원이 두 현에 의해 세 영역으로 나뉘어 있고, 왼쪽 활꼴 조각 ①, 가운데를 포함한 가장 큰 조각 ②, 오른쪽 활꼴 조각 ③이 표시되어 있다.</desc><rect width="560" height="480" fill="#fff"/><g data-layer="10"><path id="r1" data-role="region" stroke="none" stroke-width="1.6" fill="#e4e7ec" data-owner-points="O P1 P2" data-mark="region" data-mark-id="r1" fill-rule="evenodd" d="M187.137479358 79.164510138 A185.716487675 185.716487675 0 0 0 127.865682658 346.522307539 L187.137479358 79.164510138 Z"/></g><g data-layer="10"><path id="rBig" data-role="region" stroke="none" stroke-width="1.6" fill="#e4e7ec" data-owner-points="O P1 P2 P3" data-mark="region" data-mark-id="rBig" fill-rule="evenodd" d="M187.137479358 79.164510138 L127.865682658 346.522307539 L440.830919424 332.857950204 A185.716487675 185.716487675 0 0 0 187.137479358 79.164510138 Z"/></g><g data-layer="10"><path id="r2" data-role="region" stroke="none" stroke-width="1.6" fill="#e4e7ec" data-owner-points="O P2 P3" data-mark="region" data-mark-id="r2" fill-rule="evenodd" d="M127.865682658 346.522307539 A185.716487675 185.716487675 0 0 0 440.830919424 332.857950204 L127.865682658 346.522307539 Z"/></g><g data-l