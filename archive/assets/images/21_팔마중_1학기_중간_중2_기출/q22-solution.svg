<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img" aria-labelledby="title desc">
  <title id="title">원기둥의 물을 원뿔에 옮겨 담는 부피 보존</title>
  <desc id="desc">반지름 a, 높이 3a인 원기둥의 부피와 반지름 2a, 높이 h인 원뿔의 부피가 같아 h는 9a/4가 된다.</desc>
  <defs>
    <style>
      .shape{fill:#f8fbff;stroke:#26364a;stroke-width:3;stroke-linejoin:round}
      .hidden{fill:none;stroke:#718096;stroke-width:2;stroke-dasharray:7 6}
      .dim{fill:none;stroke:#2b6cb0;stroke-width:2}
      .guide{fill:none;stroke:#2b6cb0;stroke-width:1.7;stroke-dasharray:5 5}
      .accent{fill:#ebf8ff;stroke:#2b6cb0;stroke-width:2}
      .label{font:600 22px "Noto Sans KR",Arial,sans-serif;fill:#1a202c}
      .math{font:italic 22px Georgia,"Times New Roman",serif;fill:#1a202c}
      .small{font:500 17px "Noto Sans KR",Arial,sans-serif;fill:#4a5568}
      .eq{font:600 24px Georgia,"Times New Roman",serif;fill:#1a365d}
    </style>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0L9 4.5L0 9Z" fill="#2b6cb0"/>
    </marker>
  </defs>
  <rect x="18" y="18" width="724" height="324" rx="18" fill="#ffffff" stroke="#d7e1ec" stroke-width="2"/>

  <text x="150" y="52" text-anchor="middle" class="label">CYLINDER</text>
  <ellipse cx="150" cy="100" rx="72" ry="24" class="shape"/>
  <path d="M78 100V254M222 100V254" class="shape"/>
  <path d="M78 254A72 24 0 0 0 222 254" class="shape"/>
  <path d="M78 254A72 24 0 0 1 222 254" class="hidden"/>
  <line x1="150" y1="100" x2="222" y2="100" class="dim"/>
  <line x1="150" y1="92" x2="150" y2="108" class="dim"/>
  <text x="186" y="88" text-anchor="middle" class="math">a</text>
  <line x1="52" y1="100" x2="52" y2="254" class="dim"/>
  <line x1="44" y1="100" x2="60" y2="100" class="dim"/>
  <line x1="44" y1="254" x2="60" y2="254" class="dim"/>
  <text x="36" y="184" text-anchor="middle" class="math">3a</text>

  <path d="M260 177H338" class="dim" marker-end="url(#arrow)"/>
  <text x="299" y="158" text-anchor="middle" class="small">TRANSFER</text>
  <text x="299" y="210" text-anchor="middle" class="small">SAME VOLUME</text>

  <text x="468" y="52" text-anchor="middle" class="label">CONE</text>
  <ellipse cx="468" cy="254" rx="102" ry="30" class="shape"/>
  <path d="M468 78L366 254M468 78L570 254" class="shape"/>
  <path d="M366 254A102 30 0 0 1 570 254" class="hidden"/>
  <line x1="468" y1="78" x2="468" y2="254" class="guide"/>
  <line x1="468" y1="254" x2="570" y2="254" class="dim"/>
  <line x1="468" y1="246" x2="468" y2="262" class="dim"/>
  <text x="519" y="242" text-anchor="middle" class="math">2a</text>
  <line x1="590" y1="78" x2="590" y2="254" class="dim"/>
  <line x1="582" y1="78" x2="598" y2="78" class="dim"/>
  <line x1="582" y1="254" x2="598" y2="254" class="dim"/>
  <text x="608" y="173" class="math">h</text>

  <rect x="92" y="292" width="576" height="38" rx="10" class="accent"/>
  <text x="380" y="318" text-anchor="middle" class="eq">3πa³ = ⅓π(2a)²h  →  h = 9a⁄4</text>
</svg>
