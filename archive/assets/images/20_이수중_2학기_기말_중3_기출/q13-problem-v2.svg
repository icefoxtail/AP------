<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 489" width="720" height="489" role="img" aria-labelledby="title desc"><title id="title">원 바깥에서 만나는 두 쌍의 할선</title><desc id="desc">원에 내접한 A, B, C, D를 각각 이었다. P에서 두 할선 사이 각은 30도이고, 원주각 ADC는 115도이다. 오른쪽 Q에서 두 할선이 만드는 각을 x로 표시했다.</desc><rect width="720" height="489" fill="white" /><circle cx="164" cy="352" r="115" fill="none" stroke="#28364b" stroke-width="2.7" /><line x1="176.6621" y1="56.2565" x2="79.8943" y2="430.4298" stroke="#205d9c" stroke-width="2.9" stroke-linecap="round" /><line x1="176.6621" y1="56.2565" x2="270.6261" y2="395.0798" stroke="#205d9c" stroke-width="2.9" stroke-linecap="round" /><line x1="128.4630" y1="242.6285" x2="635.4348" y2="327.4665" stroke="#aa5411" stroke-width="2.9" stroke-linecap="round" /><line x1="79.8943" y1="430.4298" x2="635.4348" y2="327.4665" stroke="#aa5411" stroke-width="2.9" stroke-linecap="round" /><path d="M 169.4011 84.3328 A 29.0000 29.0000 0 0 0 184.4120 84.2018" stroke="#205d9c" stroke-width="2.2" fill="none" stroke-linecap="round" /><text x="177.6046" y="171.2524" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#205d9c" text-anchor="middle">30°</text><path d="M 203.6202 255.2055 A 30.0000 30.0000 0 0 0 241.2259 289.0658" stroke="#277339" stroke-width="2.2" fill="none" stroke-linecap="round" /><text x="195.7374" y="308.7730" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#277339" text-anchor="middle">115°</text><path d="M 592.0382 320.2044 A 44.0000 44.0000 0 0 0 592.1716 335.4848" stroke="#aa5411" stroke-width="2.2" fill="none" stroke-linecap="round" /><text x="564.4375" y="335.0861" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#aa5411" text-anchor="middle">x</text><circle cx="128.4630" cy="242.6285" r="4" fill="#28364b" /><text x="106.4630" y="235.6285" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">A</text><circle cx="79.8943" cy="430.4298" r="4" fill="#28364b" /><text x="65.8943" y="457.4298" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">B</text><circle cx="270.6261" cy="395.0798" r="4" fill="#28364b" /><text x="278.6261" y="427.0798" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">C</text><circle cx="233.2087" cy="260.1569" r="4" fill="#28364b" /><text x="249.2087" y="246.1569" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">D</text><circle cx="176.6621" cy="56.2565" r="4" fill="#28364b" /><text x="162.6621" y="41.2565" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">P</text><circle cx="635.4348" cy="327.4665" r="4" fill="#28364b" /><text x="655.4348" y="332.4665" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">Q</text></svg>
