<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 494" width="600" height="494" role="img" aria-labelledby="title desc"><title id="title">무대 양 끝을 바라보는 카메라</title><desc id="desc">무대는 가로 10 m 직사각형이다. 아래쪽 카메라에서 무대 양쪽 끝으로 시야가 이어지고, 카메라의 최대 시야각은 60도이다.</desc><rect width="600" height="494" fill="white" /><rect x="130" y="61" width="340" height="82" fill="#d9e7f8" stroke="#28364b" stroke-width="2.8" /><text x="300.0000" y="113.0000" font-size="31" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#205d9c" text-anchor="middle">무대</text><line x1="130.0000" y1="51.0000" x2="470.0000" y2="51.0000" stroke="#205d9c" stroke-width="1.7" stroke-linecap="round" /><line x1="130.0000" y1="44.0000" x2="130.0000" y2="58.0000" stroke="#205d9c" stroke-width="1.7" stroke-linecap="round" /><line x1="470.0000" y1="44.0000" x2="470.0000" y2="58.0000" stroke="#205d9c" stroke-width="1.7" stroke-linecap="round" /><text x="300.0000" y="39.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#205d9c" text-anchor="middle">10 m</text><line x1="300.0000" y1="437.4486" x2="130.0000" y2="143.0000" stroke="#aa5411" stroke-width="3" stroke-linecap="round" stroke-dasharray="7 6" /><line x1="300.0000" y1="437.4486" x2="470.0000" y2="143.0000" stroke="#aa5411" stroke-width="3" stroke-linecap="round" stroke-dasharray="7 6" /><rect x="282" y="427.44863728670913" width="36" height="21" rx="3" fill="#405164" /><polygon points="292.0000,427.4486 308.0000,427.4486 312.0000,417.4486 288.0000,417.4486" fill="#405164" /><path d="M 268.5000 382.8890 A 63.0000 63.0000 0 0 1 331.5000 382.8890" stroke="#aa5411" stroke-width="2.2" fill="none" stroke-linecap="round" /><text x="300.0000" y="329.4486" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#aa5411" text-anchor="middle">최대 60°</text><text x="300.0000" y="475.4486" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weigh