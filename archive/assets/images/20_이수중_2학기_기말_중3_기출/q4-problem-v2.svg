<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 550 458" width="550" height="458" role="img" aria-labelledby="title desc"><title id="title">원 밖의 점에서 이어진 접선 PT</title><desc id="desc">원의 중심 O에서 위쪽 점 T까지 반지름 길이는 5이다. 원 밖의 P에서 O까지의 길이는 10이고, PT는 T에서 원에 닿는다.</desc><rect width="550" height="458" fill="white" /><circle cx="354" cy="229" r="128" fill="none" stroke="#28364b" stroke-width="2.75" /><line x1="354.0000" y1="229.0000" x2="98.0000" y2="229.0000" stroke="#277339" stroke-width="3" stroke-linecap="round" /><line x1="354.0000" y1="229.0000" x2="290.0000" y2="118.1487" stroke="#aa5411" stroke-width="3.3" stroke-linecap="round" /><line x1="98.0000" y1="229.0000" x2="290.0000" y2="118.1487" stroke="#205d9c" stroke-width="4.1" stroke-linecap="round" /><circle cx="98.0000" cy="229.0000" r="4" fill="#28364b" /><text x="74.0000" y="238.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">P</text><circle cx="290.0000" cy="118.1487" r="4" fill="#28364b" /><text x="286.0000" y="102.1487" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">T</text><circle cx="354.0000" cy="229.0000" r="4" fill="#28364b" /><text x="377.0000" y="237.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">O</text><line x1="226.0000" y1="229.0000" x2="203.0000" y2="257.0000" stroke="#277339" stroke-width="1.5" stroke-linecap="round" /><text x="148.0000" y="280.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#277339" text-anchor="middle">PO = 10</text><text x="344.0000" y="165.5744" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#aa5411" text-anchor="middle">5</text></svg>
