<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 485" width="620" height="485" role="img" aria-labelledby="title desc"><title id="title">지름 AC와 같은 원 위의 네 점</title><desc id="desc">지름 AC는 중심 O를 지난다. A에서 지름과 현 AB가 만드는 각은 25도이며 D에서 보는 각 x를 표시했다.</desc><rect width="620" height="485" fill="white" /><circle cx="308" cy="239" r="165" fill="none" stroke="#28364b" stroke-width="2.75" /><line x1="143.0000" y1="239.0000" x2="473.0000" y2="239.0000" stroke="#28364b" stroke-width="2.8" stroke-linecap="round" /><line x1="143.0000" y1="239.0000" x2="414.0600" y2="365.3973" stroke="#205d9c" stroke-width="2.8" stroke-linecap="round" /><line x1="473.0000" y1="239.0000" x2="276.5165" y2="77.0315" stroke="#28364b" stroke-width="2.8" stroke-linecap="round" /><line x1="143.0000" y1="239.0000" x2="276.5165" y2="77.0315" stroke="#277339" stroke-width="2.8" stroke-linecap="round" /><line x1="414.0600" y1="365.3973" x2="276.5165" y2="77.0315" stroke="#277339" stroke-width="2.8" stroke-linecap="round" /><path d="M 187.0000 239.0000 A 44.0000 44.0000 0 0 1 182.8775 257.5952" stroke="#205d9c" stroke-width="2.2" fill="none" stroke-linecap="round" /><text x="223.0563" y="263.7480" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#205d9c" text-anchor="middle">25°</text><path d="M 256.1620 101.7235 A 32.0000 32.0000 0 0 0 290.2929 105.9142" stroke="#277339" stroke-width="2.2" fill="none" stroke-linecap="round" /><text x="270.1793" y="135.6439" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#277339" text-anchor="middle">x</text><circle cx="143.0000" cy="239.0000" r="4" fill="#28364b" /><text x="124.0000" y="244.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">A</text><circle cx="414.0600" cy="365.3973" r="4" fill="#28364b" /><text x="436.0600" y="390.3973" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">B</text><circle cx="473.0000" cy="239.0000" r="4" fill="#28364b" /><text x="493.0000" y="246.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">C</text><circle cx="276.5165" cy="77.0315" r="4" fill="#28364b" /><text x="271.5165" y="60.0315" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">D</text><circle cx="308.0000" cy="239.0000" r="4" fill="#28364b" /><text x="308.0000" y="267.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">O</text></svg>
