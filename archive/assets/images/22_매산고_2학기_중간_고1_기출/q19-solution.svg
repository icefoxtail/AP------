<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc" data-visual-case="set-2022-pilot" data-fact-hash="8ae288f7de7ba660833a18f39a8b1bbf97de3c3149f4846db5ad72b5194837e4" data-visual-provenance="2026-09-05-set-visual-pilot"><title id="title">문항 19 해설: 제주도만 신청한 학생 수의 범위</title><desc id="desc">200명 학급에서 합집합 140명과 교집합 t에 따른 네 영역의 인원 변화를 보여 주는 Venn diagram</desc>
    <style>
      .text { font-family:"Noto Sans KR","Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif; fill:#172033; }
      .math { font-family:"STIX Two Math","Cambria Math","Times New Roman",serif; fill:#172033; }
      .muted { font-family:"Noto Sans KR","Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif; fill:#56657a; }
      .small { font-family:"Noto Sans KR","Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif; fill:#334155; }
      .strong { font-family:"Noto Sans KR","Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif; fill:#172033; font-weight:700; }
      .math-strong { font-family:"STIX Two Math","Cambria Math","Times New Roman",serif; fill:#172033; font-weight:700; }
    </style>
    <rect width="760" height="430" fill="#f8fafc"/><text x="28" y="38" font-size="22" text-anchor="start" class="text" font-weight="700">합집합을 먼저 140명으로 고정한 뒤 교집합을 움직인다</text><text x="28" y="67" font-size="15" text-anchor="start" class="muted">제주도만 신청한 수 = 85−t/2  (t=n(A∩B))</text><rect x="34" y="96" width="330" height="230" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/><text x="50" y="123" font-size="15" text-anchor="start" class="text" fill="#2563eb" font-weight="700">일반적인 t</text><circle cx="146" cy="219" r="67" fill="#60a5fa" fill-opacity="0.32" stroke="#2563eb" stroke-width="2"/><circle cx="239" cy="219" r="67" fill="#f59e0b" fill-opacity="0.3" stroke="#d97706" stroke-width="2"/><text x="120" y="178" font-size="14" text-anchor="start" class="text" fill="#1d4ed8" font-weight="700">A=제주도</text><text x="261" y="178" font-size="14" text-anchor="start" class="text" fill="#b45309" font-weight="700">B=서울</text><text x="117" y="223" font-size="13" text-anchor="middle" class="text" fill="#1e40af" font-weight="700">85−t/2</text><text x="192.5" y="223" font-size="13" text-anchor="middle" class="text" fill="#166534" font-weight="700">t</text><text x="268" y="223" font-size="13" text-anchor="middle" class="text" fill="#92400e" font-weight="700">55−t/2</text><text x="296" y="290" font-size="13" text-anchor="middle" class="text" fill="#64748b">합집합 140명</text><text x="52" y="308" font-size="12" text-anchor="start" class="muted">200명 중 바깥 60명</text><rect x="388" y="96" width="336" height="230" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/><text x="404" y="123" font-size="15" text-anchor="start" class="text" fill="#16a34a" font-weight="700">두 끝값</text><text x="410" y="140" font-size="16" text-anchor="start" class="text" fill="#334155"><tspan x="410" dy="0">t=0  →  제주도만 85명</tspan><tspan x="410" dy="39">t=110 →  제주도만 30명</tspan><tspan x="410" dy="39">t는 짝수: 0≤t≤110</tspan></text><line x1="410" y1="266" x2="704" y2="266" stroke="#e2e8f0" stroke-width="1.4" stroke-linecap="round"/><text x="410" y="305" font-size="24" text-anchor="start" class="text" fill="#166534" font-weight="700">85+30=115</text><text x="34" y="374" font-size="14" text-anchor="start" class="muted">n(A∪B)=140, n(A)−n(B)=30에서 n(A)=85+t/2, n(B)=55+t/2이다.</text></svg>