<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" role="img" aria-labelledby="title desc" width="760" height="300"><title id="title">문항 17 해설: a와 n-a 짝짓기</title><desc id="desc">a(n-a)의 같은 출력값을 합이 n인 입력쌍으로 묶는 대칭 도식</desc><style>text{font-family:"Noto Sans KR",Arial,sans-serif;fill:#172033}.m{fill:#56657a}</style><rect width="760" height="300" rx="18" fill="#f8fafc"/><text x="28" y="38" font-size="22" font-weight="700">같은 출력값을 만드는 대칭 짝짓기</text><text x="28" y="66" class="m" font-size="15">a(n−a)=(n−a)a 이므로 a와 n−a는 한 쌍이다.</text><rect x="28" y="88" width="704" height="150" rx="14" fill="#fff" stroke="#cbd5e1"/><g font-size="17" text-anchor="middle"><text x="130" y="130">a</text><text x="230" y="130">b</text><text x="330" y="130">n−b</text><text x="430" y="130">n−a</text><text x="550" y="130">...</text></g><g stroke="#2563eb" stroke-width="3" fill="none"><path d="M130 145Q180 210 230 145"/><path d="M330 145Q380 210 430 145"/></g><g fill="#dbeafe" stroke="#2563eb"><ellipse cx="180" cy="210" rx="62" ry="23"/><ellipse cx="380" cy="210" rx="62" ry="23"/></g><g text-anchor="middle" font-size="15" fill="#1d4ed8"><text x="180" y="216">a와 n−a</text><text x="380" y="216">b와 n−b</text></g><text x="28" y="270" class="m" font-size="14">서로 다른 입력이 같은 값을 만드는 조건은 (a−b)(n−a−b)=0이다.</text></svg>
