<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc" data-visual-case="set-2022-pilot" data-fact-hash="c6cc896452a9418acfcfa8c7a978f6ae6b034983e8180ae7dcc0a355008be9c0" data-visual-provenance="2026-09-05-set-visual-pilot"><title id="title">문항 17 해설: n=21의 열 쌍과 출력값</title><desc id="desc">A={1,…,20}에서 n=21일 때 실제 열 쌍 10개와 B₂₁의 출력값을 모두 표시한 도식</desc>
    <style>
      .text { font-family:"Noto Sans KR","Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif; fill:#172033; }
      .math { font-family:"STIX Two Math","Cambria Math","Times New Roman",serif; fill:#172033; }
      .muted { font-family:"Noto Sans KR","Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif; fill:#56657a; }
      .small { font-family:"Noto Sans KR","Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif; fill:#334155; }
      .strong { font-family:"Noto Sans KR","Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif; fill:#172033; font-weight:700; }
      .math-strong { font-family:"STIX Two Math","Cambria Math","Times New Roman",serif; fill:#172033; font-weight:700; }
    </style>
    <rect width="760" height="430" fill="#f8fafc"/><text x="28" y="38" font-size="22" text-anchor="start" class="text" font-weight="700">n=21에서 1부터 20까지가 정확히 10쌍으로 묶인다</text><text x="28" y="67" font-size="15" text-anchor="start" class="muted">a(21−a)는 a와 21−a를 바꾸어도 같은 출력값을 만든다</text><rect x="28" y="92" width="704" height="242" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/><text x="44" y="119" font-size="15" text-anchor="start" class="text" fill="#2563eb" font-weight="700">A={1,2,…,20}의 실제 중복쌍</text><text x="48" y="158" font-size="16" text-anchor="start" class="math-strong">(1,20)</text><text x="153" y="158" font-size="16" text-anchor="start" class="text" fill="#64748b">→</text><text x="181" y="158" font-size="16" text-anchor="start" class="text" fill="#1d4ed8" font-weight="700">20</text><text x="378" y="158" font-size="16" text-anchor="start" class="math-strong">(2,19)</text><text x="483" y="158" font-size="16" text-anchor="start" class="text" fill="#64748b">→</text><text x="511" y="158" font-size="16" text-anchor="start" class="text" fill="#1d4ed8" font-weight="700">38</text><text x="48" y="193" font-size="16" text-anchor="start" class="math-strong">(3,18)</text><text x="153" y="193" font-size="16" text-anchor="start" class="text" fill="#64748b">→</text><text x="181" y="193" font-size="16" text-anchor="start" class="text" fill="#1d4ed8" font-weight="700">54</text><text x="378" y="193" font-size="16" text-anchor="start" class="math-strong">(4,17)</text><text x="483" y="193" font-size="16" text-anchor="start" class="text" fill="#64748b">→</text><text x="511" y="193" font-size="16" text-anchor="start" class="text" fill="#1d4ed8" font-weight="700">68</text><text x="48" y="228" font-size="16" text-anchor="start" class="math-strong">(5,16)</text><text x="153" y="228" font-size="16" text-anchor="start" class="text" fill="#64748b">→</text><text x="181" y="228" font-size="16" text-anchor="start" class="text" fill="#1d4ed8" font-weight="700">80</text><text x="378" y="228" font-size="16" text-anchor="start" class="math-strong">(6,15)</text><text x="483" y="228" font-size="16" text-anchor="start" class="text" fill="#64748b">→</text><text x="511" y="228" font-size="16" text-anchor="start" class="text" fill="#1d4ed8" font-weight="700">90</text><text x="48" y="263" font-size="16" text-anchor="start" class="math-strong">(7,14)</text><text x="153" y="263" font-size="16" text-anchor="start" class="text" fill="#64748b">→</text><text x="181" y="263" font-size="16" text-anchor="start" class="text" fill="#1d4ed8" font-weight="700">98</text><text x="378" y="263" font-size="16" text-anchor="start" class="math-strong">(8,13)</text><text x="483" y="263" font-size="16" text-anchor="start" class="text" fill="#64748b">→</text><text x="511" y="263" font-size="16" text-anchor="start" class="text" fill="#1d4ed8" font-weight="700">104</text><text x="48" y="298" font-size="16" text-anchor="start" class="math-strong">(9,12)</text><text x="153" y="298" font-size="16" text-anchor="start" class="text" fill="#64748b">→</text><text x="181" y="298" font-size="16" text-anchor="start" class="text" fill="#1d4ed8" font-weight="700">108</text><text x="378" y="298" font-size="16" text-anchor="start" class="math-strong">(10,11)</text><text x="483" y="298" font-size="16" text-anchor="start" class="text" fill="#64748b">→</text><text x="511" y="298" font-size="16" text-anchor="start" class="text" fill="#1d4ed8" font-weight="700">110</text><text x="28" y="372" font-size="15" text-anchor="start" class="math-strong">서로 다른 입력값의 충돌 조건: (a−b)(21−a−b)=0</text><rect x="420" y="348" width="130" height="30" rx="15" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/><text x="485" y="368" font-size="14" text-anchor="middle" class="text" fill="#1d4ed8" font-weight="700">|B₂₁|=10</text><rect x="562" y="348" width="82" height="30" rx="15" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/><text x="603" y="368" font-size="14" text-anchor="middle" class="text" fill="#92400e" font-weight="700">α=20</text><rect x="656" y="348" width="76" height="30" rx="15" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/><text x="694" y="368" font-size="14" text-anchor="middle" class="text" fill="#166534" font-weight="700">41</text></svg>