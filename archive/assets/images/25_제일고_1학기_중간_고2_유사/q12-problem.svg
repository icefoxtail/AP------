<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 520" width="540" height="520" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">한 변이 1인 정사각형의 각 변을 3등분해 만든 3×3 격자에서 첫 시행의 가운데 작은 정사각형만 연한 회색으로 표시했다.</title><desc id="visual-desc">정사각형의 가로세로를 각각 정확히 삼등분한 3 곱하기 3 격자. 가운데 칸 하나만 색칠되어 있다. 이후 반복 방식은 표시하지 않았다.</desc><rect width="540" height="520" fill="#fff"/><g data-layer="10"><path id="center" data-role="region" stroke="none" stroke-width="1.6" fill="#e4e7ec" data-owner-points="P11 P12 P21 P22" data-mark="region" data-mark-id="center" fill-rule="evenodd" d="M205.060549867 315.136002579 L334.939450133 315.136002579 L334.939450133 185.257102314 L205.060549867 185.257102314 L205.060549867 315.136002579 Z"/></g><g data-layer="30"><line id="h00" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="75.181649601" y1="445.014902845" x2="205.060549867" y2="445.014902845"/></g><g data-layer="30"><line id="h10" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="205.060549867" y1="445.014902845" x2="334.939450133" y2="445.014902845"/></g><g data-layer="30"><line id="h20" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="334.939450133" y1="445.014902845" x2="464.818350399" y2="445.014902845"/></g><g data-layer="30"><line id="h01" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="75.181649601"