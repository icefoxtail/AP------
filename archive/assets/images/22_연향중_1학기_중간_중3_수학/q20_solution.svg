<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="560" viewBox="0 0 1080 560">
<rect width="1080" height="560" fill="white"/>
<text x="65" y="62" font-size="29" fill="#162c48" font-weight="bold">두 상자를 한 방향으로 두른 끈의 길이</text>
<text x="78" y="115" font-size="24" fill="#253f55">한 고리의 경로를 펼쳐 선분별로 세기 (cm)</text>
<rect x="80" y="140" width="76" height="90" fill="#d7ecff" stroke="#34495e" stroke-width="1.5"/><text x="118" y="198" text-anchor="middle" font-size="25" fill="#172b4c">4</text>
<rect x="156" y="140" width="38" height="90" fill="#e1f5df" stroke="#34495e" stroke-width="1.5"/><text x="175" y="198" text-anchor="middle" font-size="25" fill="#172b4c">2</text>
<rect x="194" y="140" width="38" height="90" fill="#e1f5df" stroke="#34495e" stroke-width="1.5"/><text x="213" y="198" text-anchor="middle" font-size="25" fill="#172b4c">2</text>
<rect x="232" y="140" width="114" height="90" fill="#fdf1ce" stroke="#34495e" stroke-width="1.5"/><text x="289" y="198" text-anchor="middle" font-size="25" fill="#172b4c">3 + 3</text>
<rect x="346" y="140" width="38" height="90" fill="#e1f5df" stroke="#34495e" stroke-width="1.5"/><text x="365" y="198" text-anchor="middle" font-size="25" fill="#172b4c">2</text>
<rect x="384" y="140" width="38" height="90" fill="#e1f5df" stroke="#34495e" stroke-width="1.5"/><text x="403" y="198" text-anchor="middle" font-size="25" fill="#172b4c">2</text>
<rect x="422" y="140" width="190" height="90" fill="#d7ecff" stroke="#34495e" stroke-width="1.5"/><text x="517" y="198" text-anchor="middle" font-size="25" fill="#172b4c">10</text>
<text x="80" y="286" font-size="24" fill="#253f55">윗면 노출: (10 - 4) = 3 + 3 = 6 cm</text>
<text x="80" y="338" font-size="24" fill="#253f55">한 고리: 4 + 2 + 2 + 3 + 3 + 2 + 2 + 10 = 28 cm</text>
<text x="80" y="400" font-size="26" fill="#253f55">직각인 두 고리: 28 × 2 = 56 cm</text>
<text x="80" y="462" font-size="28" fill="#162c48" font-weight="bold">매듭 10 cm를 더하면: 56 + 10 = 66 cm</text>
<text x="80" y="522" font-size="18" fill="#667788">작은 상자는 큰 상자의 가운데에 놓여 각 윗면 노출 길이는 3 cm이다.</text>
</svg>