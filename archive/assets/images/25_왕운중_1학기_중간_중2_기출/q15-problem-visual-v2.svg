<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 521 430" width="521" height="430" role="img" aria-labelledby="title desc"><title id="title">차 중량 제한 5.5톤 표지판</title><desc id="desc">위에는 차중량제한이라고 적혀 있다. 아래 흰 바탕 원형 표지 안에 5.5 t가 표시돼 있다.</desc><rect width="521" height="430" fill="white" /><text x="260.0000" y="55.0000" font-size="34" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#293b4a" text-anchor="middle">차중량제한</text><circle cx="261" cy="242" r="143" fill="#bd413c" stroke="#a22d2c" stroke-width="2.4" /><circle cx="261" cy="242" r="110" fill="white" stroke="#f4d8d2" stroke-width="1.3" /><text x="235.0000" y="269.0000" font-size="70" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#293b4a" text-anchor="middle">5.5</text><text x="329.0000" y="269.0000" font-size="46" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#293b4a" text-anchor="middle">t</text></svg>
