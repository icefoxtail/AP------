<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 708 356" width="708" height="356" role="img" aria-labelledby="title desc"><title id="title">다섯 정수에서 부등식의 참과 거짓을 가르는 경계</title><desc id="desc">수직선의 −2, −1, 0은 청록으로 채운 점이고 1, 2는 빈 점이다. 가능한 위치의 한 예로, 0과 1 사이에 점 n을 세로 점선으로 표시했다.</desc><rect width="708" height="356" fill="white" /><line x1="77.0000" y1="214.0000" x2="635.0000" y2="214.0000" stroke="#677989" stroke-width="2.15" stroke-linecap="round" /><line x1="97.0000" y1="214.0000" x2="75.0000" y2="214.0000" stroke="#677989" stroke-width="2.15" stroke-linecap="round" /><polygon points="62.0000,214.0000 75.0000,219.2000 75.0000,208.8000" fill="#677989" /><line x1="615.0000" y1="214.0000" x2="637.0000" y2="214.0000" stroke="#677989" stroke-width="2.15" stroke-linecap="round" /><polygon points="650.0000,214.0000 637.0000,208.8000 637.0000,219.2000" fill="#677989" /><line x1="160.0000" y1="208.0000" x2="160.0000" y2="220.0000" stroke="#677989" stroke-width="1.85" stroke-linecap="round" /><text x="160.0000" y="253.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#293b4a" text-anchor="middle">−2</text><line x1="258.0000" y1="208.0000" x2="258.0000" y2="220.0000" stroke="#677989" stroke-width="1.85" stroke-linecap="round" /><text x="258.0000" y="253.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#293b4a" text-anchor="middle">−1</text><line x1="356.0000" y1="208.0000" x2="356.0000" y2="220.0000" stroke="#677989" stroke-width="1.85" stroke-linecap="round" /><text x="356.0000" y="253.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#293b4a" text-anchor="middle">0</text><line x1="454.0000" y1="208.0000" x2="454.0000" y2="220.0000" stroke="#677989" stroke-width="1.85" stroke-linecap="round" /><text x="454.0000" y="253.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#293b4a" text-anchor="middle">1</text><line x1="552.0000" y1="208.0000" x2="552.0000" y2="220.0000" stroke="#677989" stroke-width="1.85" stroke-linecap="round" /><text x="552.0000" y="253.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#293b4a" text-anchor="middle">2</text><circle cx="160.0" cy="214" r="8" fill="#207267" stroke="#207267" stroke-width="3.4" /><circle cx="258.0" cy="214" r="8" fill="#207267" stroke="#207267" stroke-width="3.4" /><circle cx="356.0" cy="214" r="8" fill="#207267" stroke="#207267" stroke-width="3.4" /><circle cx="454.0" cy="214" r="8" fill="white" stroke="#a64d1e" stroke-width="3.4" /><circle cx="552.0" cy="214" r="8" fill="white" stroke="#a64d1e" stroke-width="3.4" /><line x1="406.9600" y1="152.0000" x2="406.9600" y2="216.0000" stroke="#754697" stroke-width="2.7" stroke-linecap="round" stroke-dasharray="6 4" /><text x="406.9600" y="140.0000" font-size="31" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#754697" text-anchor="middle">n</text><text x="666.0000" y="199.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#677989" text-anchor="middle">x</text><text x="247.0000" y="111.0000" font-size="32" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#207267" text-anchor="middle">x &lt; n</text></svg>
