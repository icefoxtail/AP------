<svg xmlns="http://www.w3.org/2000/svg" width="512" height="200" viewBox="0 0 512 200" role="img" aria-labelledby="visual-title visual-desc" data-composite="composite-panels-v1"><title id="visual-title">수직선 위의 점 A를 중심으로 왼쪽의 P와 오른쪽의 Q를 잡은 부분 도식이다. 원문에 언급된 직각삼각형 ABC의 원래 그림 파일이 없어 삼각형은 재현하지 않았다.</title><desc id="visual-desc">수직선에 점 A, 그 왼쪽에 P, 오른쪽에 Q가 있으며 A에서 P와 Q까지 같은 길이를 나타내는 호가 있다. 각 점의 수치는 그림에 공개하지 않는다. 원문 직각삼각형의 형태와 배치는 미확정이다.</desc><g id="p1-caption" data-role="caption" data-panel="1" data-font-px="20"><g id="p1-p1-caption-text" transform="translate(185 39.519999999999996)" data-label-kind="CAPTION" data-owner="panel-1" data-fragment-sha="sha256:816d352abbec6410015d3767385223dac1eadaa09f5895839db65875b8a93ada"><svg xmlns="http://www.w3.org/2000/svg" width="142.00000000000003" height="28.96" viewBox="0 0 142.00000000000003 28.96" data-outline-width="142.00000000000003" data-outline-height="28.96" id="lb-4333d56e249c27cbbc3acfe05146a5eb2939af12320d3118a6fbdad6da9b4be2" data-owner="panel-1" data-fact-role="GIVEN"><path d="M8.84000 8.78000L8.84000 7.62000L9.42000 7.62000L9.42000 8.78000Q9.42000 9.78000 8.96000 10.62000Q8.50000 11.46000 7.75000 12.13000Q7 12.80000 6.09000 13.30000Q5.18000 13.80000 4.25000 14.13000Q3.32000 14.46000 2.52000 14.62000L2.52000 14.62000L2.22000 14.08000Q2.92000 13.96000 3.80000 13.66000Q4.68000 13.36000 5.57000 12.89000Q6.46000 12.42000 7.20000 11.80000Q7.94000 11.18000 8.39000 10.42000Q8.84000 9.66000 8.84000 8.78000L8.84000 8.78000ZM8.92000 8.78000L8.92000 7.62000L9.48000 7.62000L9.48000 8.78000Q9.48000 9.64000 9.94000 10.39000Q10.40000 11.14000 11.15000 11.76000Q11.90000 12.38000 12.78000 12.86000Q13.66000 13.34000 14.54000 13.65000Q15.42000 13.96000 16.10000 14.08000L16.10000 14.08000L15.80000 14.62000Q15.02000 14.46000 14.10000 14.12000Q13.18000 13.78000 12.26000 13.27000Q11.34000 12.76000 10.59000 12.09000Q9.84000 11.42000 9.38000 10.59000Q8.92000 9.76000 8.92000 8.78000L8.92000 8.78000ZM8.82000 24.54000L8.82000 17.56000L9.46000 17.56