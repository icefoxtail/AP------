<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" width="480" height="360" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">A+B+C=π이므로 sin(B+C)=sinA=1/3이다. 두 변 b=5, c=6 사이의 끼인각이 A이다. 그림은 AB=6, AC=5이고 사잇각 A의 sinA=1/3(약 19.47°)인 삼각형이다. 넓이는 (1/2)·5·6·sinA=(1/2)·5·6·(1/3)=5이다. 따라서 답은 ⑤이다.</title><desc id="visual-desc">점 A에서 가로축을 따라 점 B로 가는 변과 위쪽의 점 C로 가는 변이 좁은 각 A를 이루는 삼각형이고, 각 A에 호 표시와 두 변의 길이가 적혀 있다.</desc><rect width="480" height="360" fill="#fff"/><g data-layer="30"><line id="x-axis" data-role="axis" stroke="#111" stroke-width="1.2" fill="none" data-axis="x" x1="32" y1="213.986928105" x2="448" y2="213.986928105"/></g><g data-layer="30"><line id="y-axis" data-role="axis" stroke="#111" stroke-width="1.2" fill="none" data-axis="y" x1="117.647058824" y1="299.633986928" x2="117.647058824" y2="60.366013072"/></g><g data-layer="30"><line id="sAC" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="117.647058824" y1="213.986928105" x2="309.906157499" y2="146.013071895"/></g><g data-layer="30"><line id="sBC" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="362.352941176" y1="213.986928105" x2="309.906157499" y2="146.013071895"/></g><g data-layer="35"><line id="sAB" data-role="line" stroke="#111" stroke-width="3.2" fill="none" x1="117.647058824" y1="213.986928105" x2="362.352941176" y2="213.986928105"/></g