<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 575 539" width="575" height="539" role="img" aria-labelledby="title desc"><title id="title">지름과 현이 교차하는 원</title><desc id="desc">반지름은 5 cm이며 가로 지름 AB에 중심 O가 있다. 현 CD는 A에서 오른쪽에 있는 P에서 지름과 만난다. CP는 4 cm, DP는 3 cm이다.</desc><rect width="575" height="539" fill="white" /><circle cx="287.5" cy="269.5" r="192.0" fill="none" stroke="#205d9c" stroke-width="3.6" /><line x1="95.5000" y1="269.5000" x2="479.5000" y2="269.5000" stroke="#586574" stroke-width="4.1" stroke-linecap="round" /><line x1="404.6527" y1="117.3841" x2="441.9285" y2="383.5869" stroke="#aa5411" stroke-width="4.1" stroke-linecap="round" /><line x1="95.5000" y1="242.5000" x2="287.5000" y2="242.5000" stroke="#586574" stroke-width="1.7" stroke-linecap="round" /><line x1="95.5000" y1="237.0000" x2="95.5000" y2="248.0000" stroke="#586574" stroke-width="1.7" stroke-linecap="round" /><line x1="287.5000" y1="237.0000" x2="287.5000" y2="248.0000" stroke="#586574" stroke-width="1.7" stroke-linecap="round" /><text x="191.5000" y="226.5000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#586574" text-anchor="middle">5 cm</text><line x1="450.7116" y1="266.0331" x2="429.4111" y2="113.9172" stroke="#aa5411" stroke-width="1.7" stroke-linecap="round" /><line x1="445.2648" y1="266.7958" x2="456.1585" y2="265.2704" stroke="#aa5411" stroke-width="1.7" stroke-linecap="round" /><line x1="423.9643" y1="114.6799" x2="434.8580" y2="113.1545" stroke="#aa5411" stroke-width="1.7" stroke-linecap="round" /><text x="488.5879" y="191.1801" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#aa5411" text-anchor="middle">4 cm</text><line x1="466.6870" y1="380.1201" x2="450.7116" y2="266.0331" stroke="#aa5411" stroke-width="1.7" stroke-linecap="round" /><line x1="461.2401" y1="380.8828" x2="472.1338" y2="379.3573" stroke="#aa5411" stroke-width="1.7" stroke-linecap="round" /><line x1="445.2648" y1="266.7958"