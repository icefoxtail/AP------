<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 684 450" width="684" height="450" role="img" aria-labelledby="title desc"><title id="title">지름과 한 현 사이의 반원 영역</title><desc id="desc">반원의 지름은 AB이며, 가운데는 O이다. AO의 길이는 √3 cm이고, B에서 가로 지름과 현 BC가 이루는 각은 30도이다. 호 AC, 현 CB, 지름 BA 사이의 영역을 칠했다.</desc><rect width="684" height="450" fill="white" /><path d="M 85.000 353.500 A 257.0 257.0 0 0 1 599.000 353.500 Z" fill="#eff6fc" stroke="none" /><path d="M 85.000 353.500 A 257.0 257.0 0 0 1 213.500 130.931 L 599.000 353.500 Z" fill="#f7dec1" stroke="none" /><path d="M 85.000 353.500 A 257.0000 257.0000 0 0 1 599.000 353.500" stroke="#205d9c" stroke-width="4.5" fill="none" stroke-linecap="round" /><line x1="85.0000" y1="353.5000" x2="599.0000" y2="353.5000" stroke="#586574" stroke-width="4.1" stroke-linecap="round" /><line x1="213.5000" y1="130.9315" x2="599.0000" y2="353.5000" stroke="#aa5411" stroke-width="4.1" stroke-linecap="round" /><path d="M 562.0000 353.5000 A 37 37 0 0 1 566.9571 335.0000" stroke="#aa5411" stroke-width="2.25" fill="none" /><text x="498.1007" y="339.9475" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#aa5411" text-anchor="middle">30°</text><line x1="85.0000" y1="386.5000" x2="342.0000" y2="386.5000" stroke="#266f73" stroke-width="1.7" stroke-linecap="round" /><line x1="85.0000" y1="381.0000" x2="85.0000" y2="392.0000" stroke="#266f73" stroke-width="1.7" stroke-linecap="round" /><line x1="342.0000" y1="381.0000" x2="342.0000" y2="392.0000" stroke="#266f73" stroke-width="1.7" stroke-linecap="round" /><text x="213.5000" y="417.5000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#266f73" text-anchor="middle">√3 cm</text><circle cx="85.0" cy="353.5" r="4.9" fill="#28364b" /><text x="71.0000" y="379.5000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">A</text><circle cx="599.0" cy="353.5" r="4.9" fill="#28364b" /><text x="615.0000" y="380.5000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">B</text><circle cx="213.50000000000003" cy="130.93147122739924" r="4.9" fill="#28364b" /><text x="213.5000" y="112.9315" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">C</text><circle cx="342.0" cy="353.5" r="4.9" fill="#28364b" /><text x="346.0000" y="337.5000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">O</text></svg>
