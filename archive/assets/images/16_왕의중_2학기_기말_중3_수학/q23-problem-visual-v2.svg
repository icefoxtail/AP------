<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 573 545" width="573" height="545" role="img" aria-labelledby="title desc"><title id="title">원에서 접은 호와 중심으로 만든 삼각형</title><desc id="desc">점선은 접기 전 위쪽 원호이다. 가로로 놓인 AB로 종이를 접으면 원호가 중심 O를 지난다. 반지름이 8 cm인 원의 A, O, B를 이은 삼각형을 칠했다.</desc><rect width="573" height="545" fill="white" /><path d="M 117.625 175.000 A 195.0 195.0 0 1 0 455.375 175.000 Z" fill="#edf6fb" stroke="none" /><path d="M 117.625 175.000 A 195.0 195.0 0 1 0 455.375 175.000" fill="none" stroke="#205d9c" stroke-width="4.35" /><path d="M 117.625 175.000 A 195.0000 195.0000 0 0 1 455.375 175.000" stroke="#586574" stroke-width="2.3" fill="none" stroke-linecap="round" stroke-dasharray="7 6" /><path d="M 117.625 175.000 A 195.0 195.0 0 0 0 455.375 175.000 Z" fill="#f5d9ba" stroke="none" /><polygon points="117.6250,175.0000 286.5000,272.5000 455.3750,175.0000" fill="#edc697" /><path d="M 117.625 175.000 A 195.0 195.0 0 0 0 455.375 175.000" fill="none" stroke="#aa5411" stroke-width="3.7" /><line x1="117.6250" y1="175.0000" x2="455.3750" y2="175.0000" stroke="#266f73" stroke-width="4.1" stroke-linecap="round" /><line x1="117.6250" y1="175.0000" x2="286.5000" y2="272.5000" stroke="#aa5411" stroke-width="4.1" stroke-linecap="round" /><line x1="455.3750" y1="175.0000" x2="286.5000" y2="272.5000" stroke="#aa5411" stroke-width="4.1" stroke-linecap="round" /><circle cx="117.62504626203449" cy="175.0" r="4.9" fill="#28364b" /><text x="100.6250" y="184.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">A</text><circle cx="455.3749537379655" cy="175.0" r="4.9" fill="#28364b" /><text x="473.3750" y="184.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">B</text><circle cx="286.5" cy="272.5" r="4.9" fill="#28364b" /><text x="286.5000" y="303.5000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">O</text></svg>
