<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 652 544" width="652" height="544" role="img" aria-labelledby="title desc"><title id="title">직각삼각형의 세로변을 지름으로 하는 원</title><desc id="desc">삼각형 ABC의 각 ABC는 직각이다. AB의 길이 12 cm를 지름으로 삼은 원이 사선 AC와 D에서 만난다. 밑변 BC의 길이는 5 cm이다.</desc><rect width="652" height="544" fill="white" /><circle cx="326.0" cy="272.0" r="194.5" fill="none" stroke="#205d9c" stroke-width="3.6" /><polygon points="326.0000,77.5000 326.0000,466.5000 488.0833,466.5000" fill="none" /><line x1="326.0000" y1="77.5000" x2="326.0000" y2="466.5000" stroke="#266f73" stroke-width="4.1" stroke-linecap="round" /><line x1="326.0000" y1="466.5000" x2="488.0833" y2="466.5000" stroke="#277339" stroke-width="4.1" stroke-linecap="round" /><line x1="326.0000" y1="77.5000" x2="488.0833" y2="466.5000" stroke="#aa5411" stroke-width="4.1" stroke-linecap="round" /><line x1="326.0000" y1="450.5000" x2="342.0000" y2="450.5000" stroke="#586574" stroke-width="1.8" stroke-linecap="round" /><line x1="342.0000" y1="450.5000" x2="342.0000" y2="466.5000" stroke="#586574" stroke-width="1.8" stroke-linecap="round" /><line x1="295.0000" y1="466.5000" x2="295.0000" y2="77.5000" stroke="#266f73" stroke-width="1.7" stroke-linecap="round" /><line x1="289.5000" y1="466.5000" x2="300.5000" y2="466.5000" stroke="#266f73" stroke-width="1.7" stroke-linecap="round" /><line x1="289.5000" y1="77.5000" x2="300.5000" y2="77.5000" stroke="#266f73" stroke-width="1.7" stroke-linecap="round" /><text x="228.0000" y="280.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#266f73" text-anchor="middle">12 cm</text><line x1="326.0000" y1="502.5000" x2="488.0833" y2="502.5000" stroke="#277339" stroke-width="1.7" stroke-linecap="round" /><line x1="326.0000" y1="497.0000" x2="326.0000" y2="508.0000" stroke="#277339" stroke-width="1.7" stroke-linecap="round" /><line x1="488.0833" y1="497.0000" x2="488.0833" y2="508.0000" stroke="#277339" stroke-width="1.7" stroke-linecap="round" /><text x="407.0417" y="533.5000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#277339" text-anchor="middle">5 cm</text><circle cx="326.0" cy="77.5" r="4.9" fill="#28364b" /><text x="326.0000" y="60.5000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">A</text><circle cx="326.0" cy="466.5" r="4.9" fill="#28364b" /><text x="313.0000" y="490.5000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">B</text><circle cx="488.0833333333333" cy="466.5" r="4.9" fill="#28364b" /><text x="505.0833" y="490.5000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">C</text><circle cx="464.1065088757397" cy="408.9556213017752" r="4.9" fill="#28364b" /><text x="481.1065" y="408.9556" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">D</text><circle cx="326.0" cy="272.0" r="4.9" fill="#28364b" /><text x="345.0000" y="281.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">O</text></svg>
