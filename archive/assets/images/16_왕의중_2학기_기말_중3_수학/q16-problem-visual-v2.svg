<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 598 531" width="598" height="531" role="img" aria-labelledby="title desc"><title id="title">두 현이 만나서 이루는 안쪽 각</title><desc id="desc">원 위 A와 C를 잇는 현, B와 D를 잇는 현은 P에서 만난다. 왼쪽 호 AB와 오른쪽 호 CD를 다른 색으로 표시했다. 구하는 각은 P에서 아래로 향하는 두 선 사이의 각이다.</desc><rect width="598" height="531" fill="white" /><circle cx="299.0" cy="265.5" r="188.0" fill="none" stroke="#205d9c" stroke-width="3.6" /><path d="M 154.984 144.656 A 188.0000 188.0000 0 0 0 178.156 409.516" stroke="#266f73" stroke-width="5.0" fill="none" stroke-linecap="round" /><path d="M 431.936 398.436 A 188.0000 188.0000 0 0 0 480.594 216.842" stroke="#aa5411" stroke-width="5.0" fill="none" stroke-linecap="round" /><line x1="154.9836" y1="144.6559" x2="431.9361" y2="398.4361" stroke="#586574" stroke-width="4.1" stroke-linecap="round" /><line x1="178.1559" y1="409.5164" x2="480.5941" y2="216.8420" stroke="#586574" stroke-width="4.1" stroke-linecap="round" /><path d="M 299.5680 332.1683 A 42 42 0 0 0 365.9561 337.9765" stroke="#704895" stroke-width="2.25" fill="none" /><circle cx="154.98364469363216" cy="144.65592937893058" r="4.9" fill="#28364b" /><text x="139.9836" y="131.6559" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">A</text><circle cx="178.15592937893058" cy="409.5163553063678" r="4.9" fill="#28364b" /><text x="161.1559" y="433.5164" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">B</text><circle cx="431.93607486307087" cy="398.436074863071" r="4.9" fill="#28364b" /><text x="447.9361" y="420.4361" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">C</text><circle cx="480.59405534234486" cy="216.8420195207261" r="4.9" fill="#28364b" /><text x="496.5941" y="202.8420" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600