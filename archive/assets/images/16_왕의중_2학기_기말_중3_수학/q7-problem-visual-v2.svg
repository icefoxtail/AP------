<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 686 528" width="686" height="528" role="img" aria-labelledby="title desc"><title id="title">한 지점에서 바라본 플랜카드의 양끝</title><desc id="desc">수평한 지면에서 건물 아래 C에 수직선을 세웠다. 수직선에 D와 A가 이 순서로 있다. B에서 지면과 BD가 이루는 각은 30도이고 BD와 BA의 끼인각은 15도이다. 수직 길이 CD는 3 m이다.</desc><rect width="686" height="528" fill="white" /><polygon points="466.0169,450.5000 466.0169,89.9885 580.4946,77.5000 580.4946,450.5000" fill="none" /><line x1="466.0169" y1="378.3977" x2="580.4946" y2="378.3977" stroke="#afbecd" stroke-width="1.7" stroke-linecap="round" /><line x1="466.0169" y1="306.2954" x2="580.4946" y2="306.2954" stroke="#afbecd" stroke-width="1.7" stroke-linecap="round" /><line x1="466.0169" y1="234.1931" x2="580.4946" y2="234.1931" stroke="#afbecd" stroke-width="1.7" stroke-linecap="round" /><line x1="466.0169" y1="162.0908" x2="580.4946" y2="162.0908" stroke="#afbecd" stroke-width="1.7" stroke-linecap="round" /><line x1="466.0169" y1="89.9885" x2="105.5054" y2="450.5000" stroke="#205d9c" stroke-width="4.1" stroke-linecap="round" /><line x1="105.5054" y1="450.5000" x2="466.0169" y2="242.3586" stroke="#266f73" stroke-width="4.1" stroke-linecap="round" /><line x1="105.5054" y1="450.5000" x2="580.4946" y2="450.5000" stroke="#586574" stroke-width="4.1" stroke-linecap="round" /><line x1="466.0169" y1="450.5000" x2="466.0169" y2="242.3586" stroke="#586574" stroke-width="4.1" stroke-linecap="round" /><line x1="466.0169" y1="242.3586" x2="466.0169" y2="89.9885" stroke="#aa5411" stroke-width="4.1" stroke-linecap="round" /><line x1="466.0169" y1="89.9885" x2="580.4946" y2="77.5000" stroke="#586574" stroke-width="4.1" stroke-linecap="round" /><line x1="580.4946" y1="77.5000" x2="580.4946" y2="450.5000" stroke="#586574" stroke-width="4.1" stroke-linecap="round" /><path d="M 142.5054 450.5000 A 37 37 0 0 0 137.5483 432.0000" stroke="#266f73" stroke-width="2.25" fill="none" /><text x="194.3705" y="434.6886" font-size="28" font-family="Malgun Gothic, Cambria Mat