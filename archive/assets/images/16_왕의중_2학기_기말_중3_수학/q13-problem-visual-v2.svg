<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 703 508" width="703" height="508" role="img" aria-labelledby="title desc"><title id="title">원 밖의 두 접선과 두 같은 현</title><desc id="desc">P에서 나온 두 접선은 A, B에서 원에 닿는다. 원 위 C에서 A와 B를 이은 두 길이에 같은 눈금을 썼다. PAC는 34도이고 ACB는 112도이다.</desc><rect width="703" height="508" fill="white" /><circle cx="472.74730352157655" cy="254.0" r="145.25269647842347" fill="none" stroke="#205d9c" stroke-width="3.6" /><line x1="85.0000" y1="254.0000" x2="418.3347" y2="119.3240" stroke="#586574" stroke-width="4.1" stroke-linecap="round" /><line x1="85.0000" y1="254.0000" x2="418.3347" y2="388.6760" stroke="#586574" stroke-width="4.1" stroke-linecap="round" /><line x1="418.3347" y1="119.3240" x2="327.4946" y2="254.0000" stroke="#266f73" stroke-width="4.1" stroke-linecap="round" /><line x1="418.3347" y1="388.6760" x2="327.4946" y2="254.0000" stroke="#266f73" stroke-width="4.1" stroke-linecap="round" /><line x1="367.8109" y1="181.7105" x2="379.4175" y2="189.5392" stroke="#266f73" stroke-width="2.5" stroke-linecap="round" /><line x1="362.7782" y1="189.1719" x2="374.3847" y2="197.0006" stroke="#266f73" stroke-width="2.5" stroke-linecap="round" /><line x1="379.4175" y1="318.4608" x2="367.8109" y2="326.2895" stroke="#266f73" stroke-width="2.5" stroke-linecap="round" /><line x1="374.3847" y1="310.9994" x2="362.7782" y2="318.8281" stroke="#266f73" stroke-width="2.5" stroke-linecap="round" /><path d="M 373.8299 137.3052 A 48 48 0 0 0 391.4934 159.1178" stroke="#aa5411" stroke-width="2.25" fill="none" /><text x="340.5001" y="198.4456" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#aa5411" text-anchor="middle">34°</text><path d="M 348.7439 222.4966 A 38 38 0 0 1 348.7439 285.5034" stroke="#704895" stroke-width="2.25" fill="none" /><text x="410.4946" y="270.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#704895" text-anchor="middle">112°</text><circle cx="418.33468