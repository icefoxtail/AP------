<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 679 457" width="679" height="457" role="img" aria-labelledby="title desc"><title id="title">밑각 60도와 45도가 만나는 삼각형</title><desc id="desc">밑변 BC는 6 cm이다. 삼각형의 밑변 왼쪽 B에서 60도, 오른쪽 C에서 45도를 표시했다.</desc><rect width="679" height="457" fill="white" /><polygon points="279.6799,66.5000 105.3201,368.5000 581.6799,368.5000" fill="#e1eefb" /><line x1="279.6799" y1="66.5000" x2="105.3201" y2="368.5000" stroke="#205d9c" stroke-width="4.3" stroke-linecap="round" /><line x1="279.6799" y1="66.5000" x2="581.6799" y2="368.5000" stroke="#aa5411" stroke-width="4.3" stroke-linecap="round" /><line x1="105.3201" y1="368.5000" x2="581.6799" y2="368.5000" stroke="#586574" stroke-width="4.3" stroke-linecap="round" /><path d="M 146.3201 368.5000 A 41 41 0 0 0 125.8201 332.9930" stroke="#205d9c" stroke-width="2.25" fill="none" /><text x="174.6021" y="334.5000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#205d9c" text-anchor="middle">60°</text><path d="M 552.6885 339.5086 A 41 41 0 0 0 540.6799 368.5000" stroke="#aa5411" stroke-width="2.25" fill="none" /><text x="508.6934" y="346.2680" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#aa5411" text-anchor="middle">45°</text><line x1="105.3201" y1="407.5000" x2="581.6799" y2="407.5000" stroke="#28364b" stroke-width="1.7" stroke-linecap="round" /><line x1="105.3201" y1="402.0000" x2="105.3201" y2="413.0000" stroke="#28364b" stroke-width="1.7" stroke-linecap="round" /><line x1="581.6799" y1="402.0000" x2="581.6799" y2="413.0000" stroke="#28364b" stroke-width="1.7" stroke-linecap="round" /><text x="343.5000" y="438.5000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">6 cm</text><circle cx="279.6798906476335" cy="66.5" r="4.9" fill="#28364b" /><text x="282.6799" y="48.5000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-