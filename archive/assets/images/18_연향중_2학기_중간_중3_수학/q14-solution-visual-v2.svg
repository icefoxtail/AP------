<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 530" width="700" height="530" role="img" aria-labelledby="title desc"><title id="title">포물선과 직선의 두 교점</title><desc id="desc">파란 포물선과 주황색 점선 직선이 P(1, −2)와 Q(4, 4)에서 교차한다. 두 교점 사이의 연두색 직각삼각형은 가로 차 3, 세로 차 6을 표시한다.</desc><rect width="700" height="530" fill="white" /><polygon points="297.6696,395.8626 555.0609,395.8626 555.0609,219.7914" fill="#e3f0e4" /><line x1="48.0000" y1="337.1722" x2="640.0000" y2="337.1722" stroke="#4d5d72" stroke-width="1.65" stroke-linecap="round" /><polygon points="640.0000,337.1722 627.0000,332.1722 627.0000,342.1722" fill="#4d5d72" /><text x="657.0000" y="329.1722" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#4d5d72" text-anchor="middle">x</text><line x1="211.8725" y1="439.0000" x2="211.8725" y2="76.0000" stroke="#4d5d72" stroke-width="1.65" stroke-linecap="round" /><polygon points="211.8725,76.0000 206.8725,89.0000 216.8725,89.0000" fill="#4d5d72" /><text x="227.8725" y="82.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#4d5d72" text-anchor="middle">y</text><circle cx="211.87246376811595" cy="337.1721907841552" r="4.6" fill="#28364b" /><text x="196.8725" y="364.1722" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">O</text><path d="M 60.5750 90.6726 Q 340.5681 715.7251 620.5613 90.6726" stroke="#205d9c" stroke-width="6.35" stroke-linecap="round" fill="none" /><line x1="238.4696" y1="436.3589" x2="631.4203" y2="167.5570" stroke="#aa5411" stroke-width="5.9" stroke-linecap="round" stroke-dasharray="15 7" /><line x1="297.6696" y1="395.8626" x2="555.0609" y2="395.8626" stroke="#277339" stroke-width="3.25" stroke-linecap="round" stroke-dasharray="7 5" /><line x1="555.0609" y1="395.8626" x2="555.0609" y2="219.7914" stroke="#277339" stroke-width="3.25" stroke-linecap="round" stroke-dasharray="7 5" /><line x1="541.0609" y1="395.8626" x2="541.0609" y2="381.8626" stroke="#277339" stroke-width="1.9" stroke-linecap="round" /><line x1="541.0609" y1="381.8626" x2="555.0609" y2="381.8626" stroke="#277339" stroke-width="1.9" stroke-linecap="round" /><circle cx="297.6695652173913" cy="395.86257073565076" r="7.1" fill="#feffff" stroke="#aa5411" stroke-width="3.1" /><text x="275.6696" y="478.8626" font-size="31" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">P(1, −2)</text><circle cx="555.0608695652174" cy="219.7914308811641" r="7.1" fill="#feffff" stroke="#aa5411" stroke-width="3.1" /><text x="498.0609" y="189.7914" font-size="31" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">Q(4, 4)</text><text x="431.5130" y="434.8626" font-size="31" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#277339" text-anchor="middle">3</text><text x="579.0609" y="314.8270" font-size="31" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#277339" text-anchor="middle">6</text><line x1="63.0000" y1="35.0000" x2="111.0000" y2="35.0000" stroke="#205d9c" stroke-width="5.4" stroke-linecap="round" /><text x="124.0000" y="44.0000" font-size="31" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#205d9c" text-anchor="start">y = x² − 3x</text><line x1="389.0000" y1="35.0000" x2="437.0000" y2="35.0000" stroke="#aa5411" stroke-width="5.4" stroke-linecap="round" stroke-dasharray="15 7" /><text x="450.0000" y="44.0000" font-size="31" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#aa5411" text-anchor="start">y = 2x − 4</text></svg>
