<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 724 441" width="724" height="441" role="img" aria-labelledby="title desc"><title id="title">두 옆면을 지나는 삼각기둥의 경로</title><desc id="desc">삼각기둥의 두 옆면 ABED, BCEF를 하나의 직사각형으로 펼쳤다. 세로선 BE의 왼쪽이 너비 3 cm, 오른쪽이 너비 4 cm이고 높이는 4 cm이다. 주황선 AF가 BE를 가로지른다.</desc><rect width="724" height="441" fill="white" /><polygon points="124.0000,84.5000 328.0000,84.5000 328.0000,356.5000 124.0000,356.5000" fill="#e5effb" /><polygon points="328.0000,84.5000 600.0000,84.5000 600.0000,356.5000 328.0000,356.5000" fill="#e5f3e9" /><line x1="124.0000" y1="84.5000" x2="600.0000" y2="84.5000" stroke="#586574" stroke-width="4.2" stroke-linecap="round" /><line x1="600.0000" y1="84.5000" x2="600.0000" y2="356.5000" stroke="#586574" stroke-width="4.2" stroke-linecap="round" /><line x1="600.0000" y1="356.5000" x2="124.0000" y2="356.5000" stroke="#586574" stroke-width="4.2" stroke-linecap="round" /><line x1="124.0000" y1="356.5000" x2="124.0000" y2="84.5000" stroke="#586574" stroke-width="4.2" stroke-linecap="round" /><line x1="328.0000" y1="84.5000" x2="328.0000" y2="356.5000" stroke="#277339" stroke-width="3.1" stroke-linecap="round" stroke-dasharray="7 5" /><line x1="124.0000" y1="84.5000" x2="600.0000" y2="356.5000" stroke="#aa5411" stroke-width="5.0" stroke-linecap="round" /><line x1="124.0000" y1="59.5000" x2="328.0000" y2="59.5000" stroke="#205d9c" stroke-width="1.7" stroke-linecap="round" /><line x1="124.0000" y1="54.0000" x2="124.0000" y2="65.0000" stroke="#205d9c" stroke-width="1.7" stroke-linecap="round" /><line x1="328.0000" y1="54.0000" x2="328.0000" y2="65.0000" stroke="#205d9c" stroke-width="1.7" stroke-linecap="round" /><text x="226.0000" y="49.5000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#205d9c" text-anchor="middle">3 cm</text><line x1="328.0000" y1="59.5000" x2="600.0000" y2="59.5000" stroke="#205d9c" stroke-width="1.7" stroke-linecap="round" /><line x1="328.0000" y1="54.0000" x2="328.