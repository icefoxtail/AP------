<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 690 507" width="690" height="507" role="img" aria-labelledby="title desc"><title id="title">원뿔의 모선을 따라 한 바퀴 돌아오는 경로</title><desc id="desc">원뿔 옆면을 펼친 반지름 12 cm, 중심각 60도의 부채꼴이다. B와 다른 절단면의 중점 M′ 사이의 최단 경로가 주황 선이다. M′에서 OB에 내린 수선의 발은 X이다.</desc><rect width="690" height="507" fill="white" /><path d="M 131.773 420.500 L 538.227 420.500 A 406.4545895094966 406.4545895094966 0 0 0 335.000 68.500 Z" stroke="#205d9c" stroke-width="4.5" fill="#e8f3fb" /><polygon points="538.2273,420.5000 233.3864,420.5000 233.3864,244.5000" fill="#fae8d3" /><line x1="538.2273" y1="420.5000" x2="233.3864" y2="244.5000" stroke="#aa5411" stroke-width="4.4" stroke-linecap="round" /><line x1="233.3864" y1="244.5000" x2="233.3864" y2="420.5000" stroke="#277339" stroke-width="4.4" stroke-linecap="round" /><line x1="131.7727" y1="420.5000" x2="335.0000" y2="68.5000" stroke="#205d9c" stroke-width="4.4" stroke-linecap="round" /><line x1="233.3864" y1="404.5000" x2="249.3864" y2="404.5000" stroke="#586574" stroke-width="1.8" stroke-linecap="round" /><line x1="249.3864" y1="404.5000" x2="249.3864" y2="420.5000" stroke="#586574" stroke-width="1.8" stroke-linecap="round" /><path d="M 173.7727 420.5000 A 42 42 0 0 0 152.7727 384.1269" stroke="#266f73" stroke-width="2.25" fill="none" /><text x="204.7868" y="391.5000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#266f73" text-anchor="middle">60°</text><line x1="131.7727" y1="458.5000" x2="538.2273" y2="458.5000" stroke="#205d9c" stroke-width="1.7" stroke-linecap="round" /><line x1="131.7727" y1="453.0000" x2="131.7727" y2="464.0000" stroke="#205d9c" stroke-width="1.7" stroke-linecap="round" /><line x1="538.2273" y1="453.0000" x2="538.2273" y2="464.0000" stroke="#205d9c" stroke-width="1.7" stroke-linecap="round" /><text x="335.0000" y="484.5000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#205d9c" text-anchor="mi