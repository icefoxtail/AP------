<title id="visual-title">원뿔 옆면을 한 바퀴 돌아 중점에 닿는 경로</title>
<desc id="visual-description">밑면의 반지름은 2센티미터이고 모선 OB는 12센티미터이다. M은 모선 OB의 중점이며 B에서 원뿔 옆면을 한 바퀴 돌아 M에 닿는 경로가 나타나 있다.</desc>
