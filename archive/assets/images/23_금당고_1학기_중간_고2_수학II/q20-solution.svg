<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-labelledby="t d"><title id="t">두 접선이 만드는 삼각형과 내접원</title><desc id="d">k=-1인 대표 배치에서 포물선 y=x², 접선 두 개, 밑변과 내접원의 반지름</desc><rect width="640" height="480" fill="#fff"/><text x="28" y="34" font-size="22" font-family="sans-serif">접선 삼각형과 내접원</text><line x1="58" y1="280" x2="590" y2="280" stroke="#222" stroke-width="1.5"/><line x1="320" y1="60" x2="320" y2="440" stroke="#64748b" stroke-width="1.2"/><text x="590" y="272" font-size="16">x</text><text x="328" y="70" font-size="16">y</text><path d="M124 6 Q320 554 516 6" fill="none" stroke="#16a34a" stroke-width="2.8"/><line x1="180" y1="140" x2="320" y2="420" stroke="#2563eb" stroke-width="3"/><line x1="460" y1="140" x2="320" y2="420" stroke="#2563eb" stroke-width="3"/><line x1="250" y1="280" x2="390" y2="280" stroke="#111" stroke-width="2.4"/><circle cx="320" cy="323.3" r="43.3" fill="#fef3c7" fill-opacity=".55" stroke="#d97706" stroke-width="2.5"/><line x1="320" y1="323.3" x2="320" y2="280" stroke="#d97706" stroke-width="2" stroke-dasharray="5 4"/><circle cx="320" cy="420" r="4" fill="#111"/><circle cx="250" cy="280" r="4" fill="#111"/><circle cx="390" cy="280" r="4" fill="#111"/><text x="331" y="420" font-size="17">(0,−1)= (0,k)</text><text x="230" y="303" font-size="15">−p/2</text><text x="383" y="303" font-size="15">p/2</text><text x="329" y="310" font-size="17" fill="#9a3412">r</text><text x="28" y="456" font-size="16" font-family="sans-serif">p=√(−k),   r(k)=p²/(1+2√(1/4+p²))</text></svg>
