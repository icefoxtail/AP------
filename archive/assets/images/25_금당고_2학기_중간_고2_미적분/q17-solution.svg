<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 610 420" width="610" height="420" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="UNEQUAL_UNIT_DECLARED" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">예로 n=3일 때, 0≤x≤1에서는 |sin πx|=sin πx이므로 이 구간의 곡선을 sin πx로 그렸고 직선 y=x/3은 원점과 그 오른쪽 한 점에서 만난다. 같은 모양이 되풀이되는 나머지 두 구간에서는 봉우리의 높이 1이 x/3보다 크므로 각 구간에 두 점씩 만나 양의 쪽 교점은 1+2·2=5개이고, 원점 1개와 음의 쪽 5개를 더해 a₃=11이다. 일반적으로 aₙ=4n−1이고 36/(aₙaₙ₊₁)=9(1/(4n−1)−1/(4n+3))의 망원합은 3이다. 따라서 답은 3이다.</title><desc id="visual-desc">가로축 0부터 1까지 사인 곡선 한 봉우리가 솟아 있고, 원점에서 오른쪽 위로 뻗는 직선 y=x/3이 원점과 봉우리 오른쪽의 한 점에서 곡선과 만난다. 두 교점은 주황색 점으로 표시되어 있다.</desc><rect width="610" height="420" fill="#fff"/><g data-layer="30"><line id="x-axis" data-role="axis" stroke="#111" stroke-width="1.2" fill="none" data-axis="x" x1="32" y1="210" x2="438" y2="210"/></g><g data-layer="30"><line id="y-axis" data-role="axis" stroke="#111" stroke-width="1.2" fill="none" data-axis="y" x1="108.125" y1="388" x2="108.125" y2="32"/></g><g data-layer="30"><line id="model-y-unit" data-role="tick" stroke="#111" stroke-width="0.8" fill="none" data-axis="y" data-value="1.0" data-required-label-id="tick-y-1-label" x1="108.125" y1="79.117647059" x2="104.125" y2="79.117647059"/></g><g data-layer="40"><polyline id="f-branch-0" data-role="curve" stroke="#111" stroke-width="2.1" fill="none" points="108.125,210 109.061346863,208.482768159 109.997693727,206.965740214 110.9340405