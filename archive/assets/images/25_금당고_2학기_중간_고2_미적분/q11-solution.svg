<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 384 320" width="384" height="320" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">f(x)를 정리하면 −1/(sin x+cos x)이고, 미분하면 (cos x−sin x)/(sin x+cos x)²이다. x=π/4에서 sin x=cos x이므로 도함숫값은 0이다. 그림은 45°에서 가로 성분과 세로 성분이 같은 것을 보여 준다. 따라서 답은 ③이다.</title><desc id="visual-desc">좌표평면의 원점에서 (1, 1)까지 그은 선분, (1, 1)에서 (1, 0)까지 내린 선분, 원점에서 (1, 0)까지 그은 선분이 있고, 원점의 각에 45가 표시되어 있다.</desc><rect width="384" height="320" fill="#fff"/><g data-layer="12"><polygon id="angXOP-sector" data-role="angleSector" stroke="none" stroke-width="1.6" fill="#d9d9d9" data-owner-points="X O P" data-mark="angle" data-mark-id="angXOP" data-mark-index="0" data-mark-count="1" data-mark-side="INNER" points="116.705882353,235.294117647 144.705882353,235.294117647 144.672155127,233.920222766 144.5710547,232.549637718 144.402824632,231.185664362 144.167870204,229.831588631 143.866757442,228.49067261 143.500211753,227.166146684 143.069116178,225.861201752 142.574509263,224.578981541 142.01758256,223.322575031 141.399677755,222.095009016 140.722283433,220.89924081 139.987031497,219.738151123 139.195693234,218.614537121 138.350175047,217.53110569 137.452513863,216.490466911 136.504872226,215.495127774"/></g><g data-layer="30"><line id="x-axis" data-role="axis" stroke="#111" stroke-width="1.2" fill="none" data-axis="x" x1="64" y1="235.2941176