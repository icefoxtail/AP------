<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 440" width="440" height="440" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">(1) 원의 반지름은 4, 2, 1, …이므로 둘레의 합은 8π+4π+2π+…=16π이다. (2) S₁=12√3−4π, S₂=3√3−π이고 각 단계의 넓이는 앞 단계의 1/4이므로 S₁+S₂+…=(12√3−4π)/(1−1/4)=(48√3−16π)/3이다. 따라서 답은 (1) 16π, (2) (48√3−16π)/3이다.</title><desc id="visual-desc">공통 중심을 가진 반지름 4, 2, 1인 세 원이 있고, 가장 큰 원과 둘째 원에 각각 내접하는 정삼각형이 겹쳐 그려져 있다. 큰 삼각형과 둘째 원 사이의 영역이 S₁, 작은 삼각형과 가장 작은 원 사이의 영역이 S₂로 표시되어 있다.</desc><rect width="440" height="440" fill="#fff"/><g data-layer="10"><path id="rgS1" data-role="region" stroke="none" stroke-width="1.6" fill="#e4e7ec" data-owner-points="A A2 B C O" data-mark="region" data-mark-id="rgS1" fill-rule="evenodd" d="M220 73.941792071 L86.5770201 305.037172156 L353.4229799 305.037172156 L220 73.941792071 Z M220 150.973585432 A77.031793362 77.031793362 0 0 0 220 305.037172156 A77.031793362 77.031793362 0 0 0 220 150.973585432 Z"/></g><g data-layer="10"><path id="rgS2" data-role="region" stroke="none" stroke-width="1.6" fill="#c7ccd5" data-owner-points="A2 A3 B2 C2 O" data-mark="region" data-mark-id="rgS2" fill-rule="evenodd" d="M220 150.973585432 L153.28851005 266.521275475 L286.71148995 266.521275475 L220 150.973585432 Z M220 189.489482113 A38.515896681 38.515896681 0 0 0 220 266.521275475 A38.515896681 38.515896681 0 0 0 220 189.489482113 Z"/></g><g data-layer="30"><line id="sAB" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="220" y1="73.941792071" x2="86.5770201" y2="305.037172156"/></g><g data-layer="30"><line id="sBC" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="86.5770201" y1="305.037172156" x2="353.4229799" y2="305.037172156"/></g><g data-layer="30"><line id="sCA" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="353.4229799" y1="305.037172156" x2="220" y2="73.941792071"/></g><g data-layer="30"><line id="sA2B2" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="220" y1="150.973585432" x2="153.28851005" y2="266.521275475"/></g><g data-layer="30"><line id="sB2C2" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="153.28851005" y1="266.521275475" x2="286.71148995" y2="266.521275475"/></g><g data-layer="30"><line id="sC2A2" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="286.71148995" y1="266.521275475" x2="220" y2="150.973585432"/></g><g data-layer="40"><circle id="c1" data-role="circle" stroke="#111" stroke-width="2.05" fill="none" cx="220" cy="228.005378794" r="154.063586723"/></g><g data-layer="40"><circle id="c2" data-role="circle" stroke="#111" stroke-width="2.05" fill="none" cx="220" cy="228.005378794" r="77.031793362"/></g><g data-layer="40"><circle id="c3" data-role="circle" stroke="#111" stroke-width="2.05" fill="none" cx="220" cy="228.005378794" r="38.515896681"/></g><g data-layer="70"><circle id="O" data-role="point" stroke="#111" stroke-width="0.8" fill="#111" cx="220" cy="228.005378794" r="3.2"/></g><g data-layer="70"><circle id="A" data-role="point" stroke="#111" stroke-width="0.8" fill="#111" cx="220" cy="73.941792071" r="3.2"/></g><g data-layer="70"><circle id="B" data-role="point" stroke="#111" stroke-width="0.8" fill="#111" cx="86.5770201" cy="305.037172156" r="3.2"/></g><g data-layer="70"><circle id="C" data-role="point" stroke="#111" stroke-width="0.8" fill="#111" cx="353.4229799