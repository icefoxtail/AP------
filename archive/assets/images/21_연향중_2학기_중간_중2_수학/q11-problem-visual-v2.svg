<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 747 652" width="747" height="652" role="img" aria-labelledby="title desc"><title id="title">두 각의 이등분선이 만나는 내심</title><desc id="desc">삼각형 ABC에서 B의 각은 68°이다. 내심 I에서 만나는 두 이등분선이 AB와 BC에 닿는 점은 D와 E이며, 그 곳의 x와 y를 표시했다.</desc><rect width="747" height="652" fill="white" /><line x1="248.3584" y1="161.1069" x2="113.5000" y2="494.8931" stroke="#21639a" stroke-width="5.15" stroke-linecap="round" /><line x1="113.5000" y1="494.8931" x2="633.5000" y2="494.8931" stroke="#21639a" stroke-width="5.15" stroke-linecap="round" /><line x1="633.5000" y1="494.8931" x2="248.3584" y2="161.1069" stroke="#21639a" stroke-width="5.15" stroke-linecap="round" /><line x1="248.3584" y1="161.1069" x2="328.7580" y2="494.8931" stroke="#227365" stroke-width="5.15" stroke-linecap="round" /><line x1="633.5000" y1="494.8931" x2="181.6067" y2="326.3231" stroke="#774698" stroke-width="5.15" stroke-linecap="round" /><path d="M 174.5000 494.8931 A 61 61 0 0 0 136.3510 438.3349" stroke="#a34c1f" stroke-width="2.25" fill="none" /><text x="212.1555" y="436.3491" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#a34c1f" text-anchor="middle">68°</text><path d="M 197.3402 287.3813 A 42 42 0 0 1 220.9580 341.0023" stroke="#774698" stroke-width="2.25" fill="none" /><text x="262.1408" y="298.8512" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#774698" text-anchor="middle">x</text><path d="M 317.5176 448.2277 A 48 48 0 0 1 376.7580 494.8931" stroke="#227365" stroke-width="2.25" fill="none" /><text x="385.0688" y="431.4081" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#227365" text-anchor="middle">y</text><circle cx="248.3583736297283" cy="161.10690617797826" r="4.9" fill="#28364b" /><text x="248.3584" y="142.1069" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">A</text><circle cx="113.5" cy="494.89309382202174" r="4.9" fill="#28364b" /><text x="96.5000" y="517.8931" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">B</text><circle cx="633.5" cy="494.89309382202174" r="4.9" fill="#28364b" /><text x="650.5000" y="517.8931" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">C</text><circle cx="181.6067117301236" cy="326.3230669893794" r="4.9" fill="#28364b" /><text x="159.6067" y="317.3231" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">D</text><circle cx="328.7579998859654" cy="494.89309382202174" r="4.9" fill="#28364b" /><text x="327.7580" y="522.8931" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">E</text><circle cx="298.67295501405147" cy="369.9923585761645" r="4.9" fill="#28364b" /><text x="325.6730" y="356.9924" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">I</text></svg>
