<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">연속하는 세 홀수를 x−4, x−2, x라 하면 가장 큰 수의 제곱이 나머지 두 수의 제곱의 합보다 65만큼 작으므로 x²+65=(x−2)²+(x−4)²이다. 우변을 전개하면 x²+65=2x²−12x+20이고, 정리하면 x²−12x−45=0이다. (x−15)(x+3)=0에서 양수인 홀수는 x=15이다. 따라서 답은 ②이다.</title><desc id="visual-desc">가로가 각각 11, 13, 15인 세 정사각형이 나란히 있고, 각 정사각형의 넓이 121, 169, 225가 적혀 있다.</desc><rect width="640" height="360" fill="#fff"/><g data-layer="10"><path id="rA" data-role="region" stroke="none" stroke-width="1.6" fill="#e4e7ec" data-owner-points="A1 A2 A3 A4" data-mark="region" data-mark-id="rA" fill-rule="evenodd" d="M62.857142857 269.700996678 L194.418604651 269.700996678 L194.418604651 138.139534884 L62.857142857 138.139534884 L62.857142857 269.700996678 Z"/></g><g data-layer="10"><path id="rB" data-role="region" stroke="none" stroke-width="1.6" fill="#f2a65a" data-owner-points="B1 B2 B3 B4" data-mark="region" data-mark-id="rB" fill-opacity="0.42" fill-rule="evenodd" d="M218.338870432 269.700996678 L373.820598007 269.700996678 L373.820598007 114.219269103 L218.338870432 114.219269103 L218.338870432 269.700996678 Z"/></g><g data-layer="10"><path id="rC" data-role="region" stroke="none" stroke-width="1.6" fill="#c7ccd5" data-owner-points="C1 C2 C3 C4" data-mark="region" data-mark-id="rC" fill-rule="evenodd