<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 705 544" width="705" height="544" role="img" aria-labelledby="title desc"><title id="title">서로 반대 방향으로 열린 그래프의 정사각형</title><desc id="desc">위로 열린 파란 y=ax² 위에 A와 B가 있고, 아래로 열린 주황 y=−x² 위에 C와 D가 있다. 두 그래프의 꼭짓점은 원점이다. 오른쪽 변 AD가 가로축과 만나는 점은 E이다.</desc><rect width="705" height="544" fill="white" /><polygon points="452.5909,175.0162 249.4091,175.0162 249.4091,378.1870 452.5909,378.1870" fill="none" /><line x1="452.5909" y1="175.0162" x2="249.4091" y2="175.0162" stroke="#25736e" stroke-width="3.6" stroke-linecap="round" /><line x1="249.4091" y1="175.0162" x2="249.4091" y2="378.1870" stroke="#25736e" stroke-width="3.6" stroke-linecap="round" /><line x1="249.4091" y1="378.1870" x2="452.5909" y2="378.1870" stroke="#25736e" stroke-width="3.6" stroke-linecap="round" /><line x1="452.5909" y1="378.1870" x2="452.5909" y2="175.0162" stroke="#25736e" stroke-width="3.6" stroke-linecap="round" /><line x1="53.0000" y1="225.8089" x2="649.0000" y2="225.8089" stroke="#4d5d72" stroke-width="1.65" stroke-linecap="round" /><polygon points="649.0000,225.8089 636.0000,220.8089 636.0000,230.8089" fill="#4d5d72" /><text x="666.0000" y="217.8089" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#4d5d72" text-anchor="middle">x</text><line x1="351.0000" y1="473.0000" x2="351.0000" y2="80.0000" stroke="#4d5d72" stroke-width="1.65" stroke-linecap="round" /><polygon points="351.0000,80.0000 346.0000,93.0000 356.0000,93.0000" fill="#4d5d72" /><text x="367.0000" y="86.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#4d5d72" text-anchor="middle">y</text><text x="330.0000" y="253.8089" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#4d5d72" text-anchor="middle">O</text><path d="M 187.1000 93.6034 Q 351.0000 358.0144 514.9000 93.6034" stroke="#205d9c" stroke-width="6.0" stroke-linecap="round" fill="none" /><path d="M