<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 705 544" width="705" height="544" role="img" aria-labelledby="title desc"><title id="title">꼭짓점과 두 절편, 같은 높이의 두 점</title><desc id="desc">아래로 열린 파란 포물선의 꼭짓점은 A, x절편은 B와 D이다. C는 y축 위의 절편이고 E는 C와 같은 높이에 있다. 세 점 A, C, E를 이었다.</desc><rect width="705" height="544" fill="white" /><line x1="347.1795" y1="146.8455" x2="156.1538" y2="405.1857" stroke="#25736e" stroke-width="3.6" stroke-linecap="round" /><line x1="156.1538" y1="405.1857" x2="538.2051" y2="405.1857" stroke="#25736e" stroke-width="3.6" stroke-linecap="round" /><line x1="538.2051" y1="405.1857" x2="347.1795" y2="146.8455" stroke="#25736e" stroke-width="3.6" stroke-linecap="round" /><line x1="53.0000" y1="179.1380" x2="649.0000" y2="179.1380" stroke="#4d5d72" stroke-width="1.65" stroke-linecap="round" /><polygon points="649.0000,179.1380 636.0000,174.1380 636.0000,184.1380" fill="#4d5d72" /><text x="666.0000" y="171.1380" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#4d5d72" text-anchor="middle">x</text><line x1="156.1538" y1="473.0000" x2="156.1538" y2="80.0000" stroke="#4d5d72" stroke-width="1.65" stroke-linecap="round" /><polygon points="156.1538,80.0000 151.1538,93.0000 161.1538,93.0000" fill="#4d5d72" /><text x="172.1538" y="86.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#4d5d72" text-anchor="middle">y</text><text x="135.1538" y="207.1380" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#4d5d72" text-anchor="middle">O</text><path d="M 135.1410 465.1465 Q 347.1795 -171.4554 559.2179 465.1465" stroke="#205d9c" stroke-width="6.0" stroke-linecap="round" fill="none" /><circle cx="347.1794871794872" cy="146.84552177485625" r="6.0" fill="white" stroke="#25736e" stroke-width="3.1" /><text x="351.1795" y="128.8455" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#25736e" text-anchor="middle">A</text><circle cx="279.6417241046182" cy="179.1380443714051" r="6.0" fill="white" stroke="#25736e" stroke-width="3.1" /><text x="259.6417" y="209.1380" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#25736e" text-anchor="middle">B</text><circle cx="156.15384615384616" cy="405.18570254724733" r="6.0" fill="white" stroke="#25736e" stroke-width="3.1" /><text x="139.1538" y="421.1857" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#25736e" text-anchor="middle">C</text><circle cx="414.71725025435614" cy="179.1380443714051" r="6.0" fill="white" stroke="#25736e" stroke-width="3.1" /><text x="434.7173" y="209.1380" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#25736e" text-anchor="middle">D</text><circle cx="538.2051282051282" cy="405.18570254724733" r="6.0" fill="white" stroke="#25736e" stroke-width="3.1" /><text x="560.2051" y="422.1857" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#25736e" text-anchor="middle">E</text><line x1="64.0000" y1="39.0000" x2="114.0000" y2="39.0000" stroke="#205d9c" stroke-width="5.4" stroke-linecap="round" /><text x="126.0000" y="47.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#205d9c" text-anchor="start">y = −2x² + 8x − 7</text></svg>
