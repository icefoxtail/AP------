<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="UNEQUAL_UNIT_DECLARED" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">점 P가 A를 출발한 지 t초 후라고 하면 PB=8−t, BQ=4+2t이므로 삼각형 PBQ의 넓이는 S=1/2(8−t)(4+2t)=−t²+6t+16 (0≤t≤5)이다. 이 그래프는 t=3에서 최댓값 25를 가지며, 양 끝 t=0, t=5에서 각각 16, 21이다. 이므로 최대 넓이는 25cm²이다. 따라서 답은 ②이다.</title><desc id="visual-desc">가로축 t, 세로축 S인 좌표평면에 위로 볼록한 포물선이 t=0부터 t=5까지 그려져 있고, 꼭짓점 V와 양 끝 점 M, N이 표시되어 있다. 세로축에는 16과 25의 눈금이 있다.</desc><rect width="512" height="512" fill="#fff"/><g data-layer="30"><line id="x-axis" data-role="axis" stroke="#111" stroke-width="1.2" fill="none" data-axis="x" x1="32" y1="440" x2="480" y2="440"/></g><g data-layer="30"><line id="y-axis" data-role="axis" stroke="#111" stroke-width="1.2" fill="none" data-axis="y" x1="72" y1="480" x2="72" y2="32"/></g><g data-layer="30"><line id="tick-y-16" data-role="tick" stroke="#111" stroke-width="0.8" fill="none" data-axis="y" data-value="16.0" data-required-label-id="tick-y-16-label" x1="72" y1="204.48" x2="68" y2="204.48"/></g><g data-layer="30"><line id="tick-y-25" data-role="tick" stroke="#111" stroke-width="0.8" fill="none" data-axis="y" data-value="25.0" data-required-label-id="tick-y-25-label" x1="72" y1="72" x2="68" y2="72"/></g><g data-layer="40"><polyline id="f-piece-1-branch-0" data-role="curve" stroke="#111" stroke-width="2.1" fill="none"