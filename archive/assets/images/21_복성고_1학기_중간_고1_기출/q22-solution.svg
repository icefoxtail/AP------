<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="680" height="570" viewBox="0 0 680 570" role="img" aria-labelledby="title desc">
<title id="title">내접 정사각형의 넓이</title>
<desc id="desc">한 변 10인 정사각형 ABCD의 각 변에 E, F, G, H가 있고 AE=x, AH=10-x일 때 정사각형 EFGH의 넓이는 EH의 제곱이다.</desc>
<rect width="680" height="570" fill="white"/>
<text x="44" y="45" font-family="Noto Sans CJK KR, NanumGothic, sans-serif" font-size="24" font-weight="700" fill="#111827">내접 정사각형의 넓이</text>
<text x="44" y="72" font-family="Noto Sans CJK KR, NanumGothic, sans-serif" font-size="15" fill="#334155">AE = x, AH = 10 - x; EFGH는 정사각형</text>
<rect x="140" y="110" width="340" height="340" fill="white" stroke="#1f2937" stroke-width="3"/>
<polygon points="140,246 276,450 480,314 344,110" fill="#dbeafe" stroke="#1d4ed8" stroke-width="3.5" stroke-linejoin="round"/>
<polygon points="140,110 140,246 344,110" fill="#fef3c7" stroke="#ca8a04" stroke-width="1.8"/>
<path d="M140 126 H156 V110" fill="none" stroke="#374151" stroke-width="2"/>
<text x="113" y="104" font-family="serif" font-size="20" font-style="italic">A</text>
<text x="113" y="473" font-family="serif" font-size="20" font-style="italic">B</text>
<text x="488" y="472" font-family="serif" font-size="20" font-style="italic">C</text>
<text x="488" y="106" font-family="serif" font-size="20" font-style="italic">D</text>
<text x="105" y="248" font-family="serif" font-size="20" font-style="italic">E</text>
<text x="267" y="477" font-family="serif" font-size="20" font-style="italic">F</text>
<text x="495" y="318" font-family="serif" font-size="20" font-style="italic">G</text>
<text x="337" y="98" font-family="serif" font-size="20" font-style="italic">H</text>
<text x="122" y="187" font-family="Noto Sans CJK KR, NanumGothic, sans-serif" font-size="17" text-anchor="end" fill="#92400e">x</text>
<text x="246" y="100" font-family="Noto Sans CJK KR, NanumGothic, sans-serif" font-size="17" text-anchor="middle" fill="#92400e">10 - x</text>
<text x="310" y="305" font-family="Noto Sans CJK KR, NanumGothic, sans-serif" font-size="18" text-anchor="middle" fill="#1e40af">S = EH²</text>
<rect x="65" y="499" rx="10" width="560" height="52" fill="#f1f5f9"/>
<text x="345" y="520" font-family="Noto Sans CJK KR, NanumGothic, sans-serif" font-size="17" text-anchor="middle" fill="#0f172a">넓이 S = x² + (10 - x)² = 2(x - 5)² + 50</text>
<text x="345" y="541" font-family="Noto Sans CJK KR, NanumGothic, sans-serif" font-size="15" text-anchor="middle" fill="#0f172a">x = 5일 때 넓이의 최솟값은 50</text>
</svg>
