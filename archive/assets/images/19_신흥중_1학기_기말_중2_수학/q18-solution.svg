<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 224" width="512" height="224" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">y축에 수직인 직선은 x축에 평행한 직선이므로 두 점의 y좌표가 같아야 한다. 2a−3=5a+6에서 −3a=9이므로 a=−3이다. 이때 두 점은 (2,−9), (−1,−9)로 y좌표가 모두 −9이다. 따라서 답은 ①이다.</title><desc id="visual-desc">x축과 평행한 수평 직선이 x축 아래 y=−9의 높이에 그려져 있고 직선 위의 두 점 (2,−9), (−1,−9)가 표시되어 있다.</desc><rect width="512" height="224" fill="#fff"/><g data-layer="30"><line id="x-axis" data-role="axis" stroke="#111" stroke-width="1.2" fill="none" data-axis="x" x1="32" y1="32" x2="480" y2="32"/></g><g data-layer="30"><line id="y-axis" data-role="axis" stroke="#111" stroke-width="1.2" fill="none" data-axis="y" x1="229.714285714" y1="192" x2="229.714285714" y2="44"/></g><g data-layer="40"><polyline id="f-piece-1-branch-0" data-role="curve" stroke="#111" stroke-width="2.1" fill="none" data-branch="PIECE_1" points="72,122 73.230769231,122 74.461538462,122 75.692307692,122 76.923076923,122 78.153846154,122 79.384615385,122 80.615384615,122 81.846153846,122 83.076923077,122 84.307692308,122 85.538461538,122 86.769230769,122 88,122 89.230769231,122 90.461538462,122 91.692307692,122 92.923076923,122 94.153846154,122 95.384615385,122 96.615384615,122 97.846153846,122 99.076923077,122 100.307692308,122 101.538461538,122 102.769230769,122 104,122 105.230769231,122 106.461538462,122 107.692