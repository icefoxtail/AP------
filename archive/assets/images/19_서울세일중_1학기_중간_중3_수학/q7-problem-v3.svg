<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 703 576" width="703" height="576" role="img" aria-labelledby="title desc"><title id="title">두 정사각형이 맞닿는 직사각형 꽃밭</title><desc id="desc">초록 왼쪽 밭은 넓이 32 m²인 정사각형이다. 파란 아래쪽 밭은 넓이 75 m²인 정사각형이고 주황 화단이 두 변을 공유한다.</desc><rect width="703" height="576" fill="white" /><rect x="117" y="50" width="181.01933598375618" height="181.01933598375618" stroke="#277339" stroke-width="4.0" fill="#e5f3e4" /><rect x="298.01933598375615" y="50" width="277.1281292110204" height="181.01933598375618" stroke="#aa5411" stroke-width="4.0" fill="#fae6ce" /><rect x="298.01933598375615" y="231.01933598375618" width="277.1281292110204" height="277.1281292110204" stroke="#205d9c" stroke-width="4.0" fill="#e1eefb" /><text x="207.5097" y="149.5097" font-size="33" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#277339" text-anchor="middle">32 m²</text><text x="436.5834" y="149.5097" font-size="33" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#aa5411" text-anchor="middle">화단</text><text x="436.5834" y="378.5834" font-size="33" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#205d9c" text-anchor="middle">75 m²</text></svg>
