<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 713 630" width="713" height="630" role="img" aria-labelledby="title desc"><title id="title">모서리를 잘라낸 도형과 같은 넓이의 직사각형</title><desc id="desc">파란 긴 직사각형을 돌려 아래 초록 띠와 이어 붙였다. 이때 가로는 원래 한 변에 1을 더한 길이이고 높이는 1을 빼서 얻는다.</desc><rect width="713" height="630" fill="white" /><rect x="225" y="73" width="188" height="235" fill="#e1eefb" stroke="#205d9c" stroke-width="4" /><rect x="413" y="120" width="47" height="188" fill="#e5f3e4" stroke="#277339" stroke-width="4" /><rect x="224" y="359" width="220" height="176" fill="#e1eefb" stroke="#205d9c" stroke-width="4" /><rect x="444" y="359" width="44" height="176" fill="#e5f3e4" stroke="#277339" stroke-width="4" /><text x="334.0000" y="458.0000" font-size="30" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#205d9c" text-anchor="middle">2x+3</text><text x="466.0000" y="458.0000" font-size="30" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#277339" text-anchor="middle">1</text><line x1="199.0000" y1="359.0000" x2="199.0000" y2="535.0000" stroke="#586574" stroke-width="1.65" stroke-linecap="round" /><line x1="204.0000" y1="359.0000" x2="194.0000" y2="359.0000" stroke="#586574" stroke-width="1.65" stroke-linecap="round" /><line x1="204.0000" y1="535.0000" x2="194.0000" y2="535.0000" stroke="#586574" stroke-width="1.65" stroke-linecap="round" /><text x="156.0000" y="455.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#586574" text-anchor="middle">2x+2</text><text x="354.0000" y="591.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">넓이가 같은 직사각형</text><line x1="413.0000" y1="73.0000" x2="460.0000" y2="73.0000" stroke="#586574" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 5" /><line x1="460.0000" y1="73.0000" x2="460.0000" y2="120.0000" stroke="#586574" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 5" /><text x="340.1500" y="201.7800" font-size="34" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#205d9c" text-anchor="middle">A</text><line x1="225.0000" y1="50.0000" x2="460.0000" y2="50.0000" stroke="#205d9c" stroke-width="1.65" stroke-linecap="round" /><line x1="225.0000" y1="45.0000" x2="225.0000" y2="55.0000" stroke="#205d9c" stroke-width="1.65" stroke-linecap="round" /><line x1="460.0000" y1="45.0000" x2="460.0000" y2="55.0000" stroke="#205d9c" stroke-width="1.65" stroke-linecap="round" /><text x="342.5000" y="36.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#205d9c" text-anchor="middle">2x+3</text><text x="436.5000" y="150.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#277339" text-anchor="middle">1</text></svg>
