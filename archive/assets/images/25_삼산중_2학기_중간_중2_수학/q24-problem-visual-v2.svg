<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 738 542" width="738" height="542" role="img" aria-labelledby="title desc"><title id="title">학교와 은행과 병원이 있는 동네 지도</title><desc id="desc">지도에는 학교, 편의점, 시청, 병원, 도서관, 경찰서, 서점, 지하철역, 은행이 각각 점과 이름으로 표시돼 있다. 학교는 왼쪽 위, 병원은 오른쪽 위, 은행은 왼쪽 아래에 있다.</desc><rect width="738" height="542" fill="white" /><rect x="24" y="23" width="690" height="496" rx="28" fill="#f2f6ed" stroke="#b9c5b8" stroke-width="2.7" /><path d="M 30 161 Q 119 124 216 130 T 480 121 Q 567 111 708 157" fill="none" stroke="#e1e8db" stroke-width="10" stroke-linecap="round" /><path d="M 51 325 Q 201 321 306 344 T 689 363" fill="none" stroke="#e1e8db" stroke-width="10" stroke-linecap="round" /><path d="M 351 29 Q 370 111 357 198 T 333 513" fill="none" stroke="#e1e8db" stroke-width="10" stroke-linecap="round" /><circle cx="85" cy="79" r="21" fill="#e4ecde" /><circle cx="85" cy="79" r="10" fill="#d7e4d1" /><circle cx="648" cy="88" r="21" fill="#e4ecde" /><circle cx="648" cy="88" r="10" fill="#d7e4d1" /><circle cx="520" cy="251" r="21" fill="#e4ecde" /><circle cx="520" cy="251" r="10" fill="#d7e4d1" /><circle cx="203" cy="360" r="21" fill="#e4ecde" /><circle cx="203" cy="360" r="10" fill="#d7e4d1" /><circle cx="656" cy="454" r="21" fill="#e4ecde" /><circle cx="656" cy="454" r="10" fill="#d7e4d1" /><circle cx="113" cy="448" r="21" fill="#e4ecde" /><circle cx="113" cy="448" r="10" fill="#d7e4d1" /><circle cx="466" cy="464" r="21" fill="#e4ecde" /><circle cx="466" cy="464" r="10" fill="#d7e4d1" /><circle cx="178.4647922241901" cy="158.49999999999997" r="7.3" fill="#334b49" stroke="white" stroke-width="2.2" /><rect x="118.46479222419009" y="114.49999999999997" width="68" height="39" rx="7" fill="#fbfcf8" fill-opacity=".91" /><text x="152.4648" y="142.5000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#263b39" text-anchor="middle">학교</text><circle cx="369" cy="102" r="7.3" fill="#334b49" stroke="white" stroke-width="2.2" /><r