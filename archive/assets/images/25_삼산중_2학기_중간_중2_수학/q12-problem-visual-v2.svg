<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 765 515" width="765" height="515" role="img" aria-labelledby="title desc"><title id="title">사각형을 분류하는 예와 아니오의 흐름</title><desc id="desc">첫 조건 (가)의 예는 (나), 아니오는 (다)로 이어진다. (나)의 예와 아니오 아래에는 각각 두 대각선이 수직인가를 묻는 상자가 있다. 왼쪽 수직 질문의 예와 아니오는 정사각형과 직사각형, 오른쪽 수직 질문의 예와 아니오는 마름모와 평행사변형이다. (다)의 예는 사다리꼴, 아니오는 그 외 사각형이다.</desc><rect width="765" height="515" fill="white" /><line x1="356.0000" y1="91.0000" x2="356.0000" y2="111.0000" stroke="#266f73" stroke-width="2.4" stroke-linecap="round" /><line x1="356.0000" y1="111.0000" x2="253.0000" y2="111.0000" stroke="#266f73" stroke-width="2.4" stroke-linecap="round" /><line x1="253.0000" y1="111.0000" x2="253.0000" y2="137.0000" stroke="#266f73" stroke-width="2.4" stroke-linecap="round" /><polygon points="248.0000,135.0000 258.0000,135.0000 253.0000,144.0000" fill="#266f73" /><rect x="265" y="91" width="40" height="36" rx="7" fill="white" /><text x="285.0000" y="116.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#266f73" text-anchor="middle">예</text><line x1="407.0000" y1="91.0000" x2="407.0000" y2="111.0000" stroke="#9b4c14" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="6 4" /><line x1="407.0000" y1="111.0000" x2="639.0000" y2="111.0000" stroke="#9b4c14" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="6 4" /><line x1="639.0000" y1="111.0000" x2="639.0000" y2="137.0000" stroke="#9b4c14" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="6 4" /><polygon points="634.0000,135.0000 644.0000,135.0000 639.0000,144.0000" fill="#9b4c14" /><rect x="483" y="91" width="84" height="36" rx="7" fill="white" /><text x="525.0000" y="116.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#9b4c14" text-anchor="middle">아니오</text><line x1="217.0000" y1="211.0000" x2="217.0000" y2="237.0000" stroke="#266f73" stroke-width="2.4" stroke-linecap="round" /><line x1="217.0000" y1