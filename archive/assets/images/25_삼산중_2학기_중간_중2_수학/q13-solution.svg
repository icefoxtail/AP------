<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 500" role="img" aria-labelledby="t d"><title id="t">정사각형의 대각선과 각 추적</title><desc id="d">BD=10에서 AO=5, DOP의 각과 대각선 성질로 y=10을 구한다.</desc><g fill="none" stroke="#111" stroke-width="3"><rect x="70" y="60" width="380" height="380"/><line x1="70" y1="60" x2="450" y2="440"/><line x1="70" y1="440" x2="450" y2="60"/><line x1="450" y1="60" x2="365" y2="355"/></g><g font-family="sans-serif" font-size="20" fill="#111"><text x="48" y="55">A</text><text x="48" y="465">B</text><text x="458" y="465">C</text><text x="458" y="55">D</text><text x="268" y="245">O</text><text x="370" y="380">P</text><text x="120" y="265">AO=5</text><text x="305" y="165">BD=10</text><text x="335" y="325">55°</text><text x="405" y="170">35°</text><text x="430" y="120">45°</text><text x="430" y="330">y=10°</text><text x="100" y="485">x+y=15</text></g></svg>