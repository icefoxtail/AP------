<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 420" role="img" aria-labelledby="t d"><title id="t">평행사변형 중점과 SAS 합동</title><desc id="d">M,N이 중점일 때 AMD와 CNB의 SAS 합동으로 BMD=130도를 구한다.</desc><g fill="none" stroke="#111" stroke-width="3"><polygon points="125,55 505,55 445,340 65,340"/><line x1="95" y1="198" x2="505" y2="55"/><line x1="65" y1="340" x2="475" y2="198"/></g><g font-family="sans-serif" font-size="20" fill="#111"><text x="112" y="38">A</text><text x="45" y="365">B</text><text x="445" y="365">C</text><text x="512" y="50">D</text><text x="72" y="195">M</text><text x="485" y="195">N</text><text x="430" y="230">50°</text><text x="430" y="82">20°</text><text x="155" y="385">△AMD≡△CNB → ∠AMD=50° → ∠BMD=130°</text></g></svg>