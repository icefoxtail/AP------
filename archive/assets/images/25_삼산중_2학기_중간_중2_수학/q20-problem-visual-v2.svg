<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 714 370" width="714" height="370" role="img" aria-labelledby="title desc"><title id="title">집과 학교와 도서관을 연결하는 일곱 길</title><desc id="desc">왼쪽부터 집, 학교, 도서관이 있다. 집에서 학교로 이어지는 곡선이 두 개이고 학교에서 도서관으로 이어지는 선은 세 개이다. 바깥 위와 아래의 두 곡선은 집과 도서관을 직접 연결한다.</desc><rect width="714" height="370" fill="white" /><path d="M 73 159 C 160 33 548 33 630 159" fill="none" stroke="#704895" stroke-width="4.2" stroke-linecap="round" /><path d="M 73 211 C 165 336 550 336 630 211" fill="none" stroke="#704895" stroke-width="4.2" stroke-linecap="round" stroke-dasharray="10 6" /><path d="M 117 184 Q 205 101 293 184" fill="none" stroke="#24649a" stroke-width="4.2" stroke-linecap="round" /><path d="M 117 184 Q 205 267 293 184" fill="none" stroke="#24649a" stroke-width="4.2" stroke-linecap="round" /><path d="M 421 184 Q 496 101 569 184" fill="none" stroke="#266f73" stroke-width="4.2" stroke-linecap="round" /><path d="M 421 184 L 569 184" fill="none" stroke="#266f73" stroke-width="4.2" stroke-linecap="round" /><path d="M 421 184 Q 496 267 569 184" fill="none" stroke="#266f73" stroke-width="4.2" stroke-linecap="round" /><rect x="26" y="157" width="94" height="55" rx="13" fill="#f1f6fa" stroke="#5c748b" stroke-width="2.1" /><text x="73.0000" y="194.0000" font-size="30" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">집</text><rect x="290" y="157" width="134" height="55" rx="13" fill="#f1f6fa" stroke="#5c748b" stroke-width="2.1" /><text x="357.0000" y="194.0000" font-size="30" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">학교</text><rect x="567" y="157" width="124" height="55" rx="13" fill="#f1f6fa" stroke="#5c748b" stroke-width="2.1" /><text x="629.0000" y="194.0000" font-size="30" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">도서관</text></svg>
