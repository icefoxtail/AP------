<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 562 520" width="562" height="520" role="img" aria-labelledby="title desc"><title id="title">원 안의 직사각형과 대각선 AC</title><desc id="desc">반지름 4 cm인 원의 중심 O가 직사각형 OABC의 한 꼭짓점이다. 오른쪽 위 꼭짓점 B는 원 위에 있다. C에서 A까지 직사각형의 대각선을 그었다.</desc><rect width="562" height="520" fill="white" /><circle cx="281.0" cy="260.0" r="182.5" fill="none" stroke="#24649a" stroke-width="3.6" /><polygon points="281.0000,260.0000 388.2188,260.0000 388.2188,112.3166 281.0000,112.3166" fill="none" /><line x1="98.5000" y1="260.0000" x2="463.5000" y2="260.0000" stroke="#586574" stroke-width="3" stroke-linecap="round" /><line x1="281.0000" y1="260.0000" x2="388.2188" y2="260.0000" stroke="#266f73" stroke-width="4.6" stroke-linecap="round" /><line x1="388.2188" y1="260.0000" x2="388.2188" y2="112.3166" stroke="#266f73" stroke-width="4.6" stroke-linecap="round" /><line x1="388.2188" y1="112.3166" x2="281.0000" y2="112.3166" stroke="#266f73" stroke-width="4.6" stroke-linecap="round" /><line x1="281.0000" y1="112.3166" x2="281.0000" y2="260.0000" stroke="#266f73" stroke-width="4.6" stroke-linecap="round" /><line x1="388.2188" y1="260.0000" x2="281.0000" y2="112.3166" stroke="#704895" stroke-width="4.5" stroke-linecap="round" /><line x1="98.5000" y1="290.0000" x2="281.0000" y2="290.0000" stroke="#24649a" stroke-width="1.7" stroke-linecap="round" /><line x1="98.5000" y1="284.5000" x2="98.5000" y2="295.5000" stroke="#24649a" stroke-width="1.7" stroke-linecap="round" /><line x1="281.0000" y1="284.5000" x2="281.0000" y2="295.5000" stroke="#24649a" stroke-width="1.7" stroke-linecap="round" /><text x="189.7500" y="314.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#24649a" text-anchor="middle">4 cm</text><circle cx="281.0" cy="260.0" r="4.9" fill="#28364b" /><text x="274.0000" y="285.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">O</tex