<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" role="img" aria-labelledby="t d"><title id="t">이등변삼각형의 각 추적</title><desc id="d">B=36도와 C의 각 이등분을 이용해 BD=DC=AC=4를 얻는다.</desc><g fill="none" stroke="#111" stroke-width="3"><polygon points="455,45 65,345 535,345"/><line x1="535" y1="345" x2="200" y2="240"/></g><g font-family="sans-serif" font-size="20" fill="#111"><text x="455" y="28">A</text><text x="45" y="368">B</text><text x="542" y="368">C</text><text x="178" y="232">D</text><text x="90" y="326">36°</text><text x="465" y="325">36°+36°</text><text x="395" y="85">72°</text><text x="105" y="255">BD=4</text><text x="290" y="305">DC=4</text><text x="455" y="205">AC=4</text><text x="75" y="400">BD=DC=AC=4 cm</text></g></svg>