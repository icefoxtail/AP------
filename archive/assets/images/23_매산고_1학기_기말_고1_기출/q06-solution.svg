<svg xmlns="http://www.w3.org/2000/svg" width="640" height="280" viewBox="0 0 640 280" role="img" aria-label="원점 중심 반지름 5인 원의 P(4,3)에서의 접선과 중심 (5,0), 반지름 2인 원의 두 교점" data-scale-policy="SCHEMATIC_ALLOWED"><rect width="640" height="280" fill="#fff"/><text x="20" y="17" font-family="Arial, Malgun Gothic, sans-serif" font-size="15" fill="#17324d" font-weight="700">23_매산고_1학기_기말_고1 q6</text><rect x="16" y="22" width="360" height="232" rx="8" fill="#f7fbff" stroke="#b8c7d9"/><line x1="20" y1="150" x2="372" y2="150" stroke="#7189a3" stroke-width="1.8"/><line x1="110" y1="28" x2="110" y2="248" stroke="#7189a3" stroke-width="1.8"/><text x="357" y="140" font-family="Arial, Malgun Gothic, sans-serif" font-size="13" fill="#7189a3" font-weight="700">x</text><text x="115" y="37" font-family="Arial, Malgun Gothic, sans-serif" font-size="13" fill="#7189a3" font-weight="700">y</text><circle cx="110" cy="150" r="80" stroke="#2364aa" stroke-width="2.5" fill="none"/><circle cx="190" cy="150" r="32" stroke="#d1495b" stroke-width="2.5" fill="none"/><line x1="126" y1="38" x2="222" y2="166" stroke="#17324d" stroke-width="2.4"/><circle cx="174" cy="102" r="4.5" fill="#d1495b"/><circle cx="193" cy="127" r="4" fill="#d1495b"/><circle cx="213" cy="154" r="4" fill="#d1495b"/><circle cx="110" cy="150" r="4" fill="#2364aa"/><circle cx="190" cy="150" r="4" fill="#d1495b"/><text x="118" y="72" font-family="Arial, Malgun Gothic, sans-serif" font-size="13" fill="#17324d" font-weight="700">4x+3y=25</text><text x="180" y="94" font-family="Arial, Malgun Gothic, sans-serif" font-size="12" fill="#b23a4b" font-weight="700">P(4,3)</text><text x="114" y="166" font-family="Arial, Malgun Gothic, sans-serif" font-size="12" fill="#2364aa" font-weight="700">O</text><text x="196" y="166" font-family="Arial, Malgun Gothic, sans-serif" font-size="12" fill="#b23a4b" font-weight="700">C(5,0)</text><rect x="392" y="22" width="232" height="232" rx="8" fill="#fff" stroke="#b8c7d9"/><text x="408" y="49" font-family="Arial, Malgun Gothic, sans-serif" font-size="17" fill="#17324d" font-weight="700">핵심 연결</text><text x="408" y="75" font-family="Arial, Malgun Gothic, sans-serif" font-size="13" fill="#274c77">큰 원: O(0,0), R=5</text><text x="408" y="101" font-family="Arial, Malgun Gothic, sans-serif" font-size="13" fill="#274c77">P=(4,3), 접선 4x+3y=25</text><text x="408" y="127" font-family="Arial, Malgun Gothic, sans-serif" font-size="13" fill="#274c77">작은 원: C=(5,0), r=2</text><text x="408" y="153" font-family="Arial, Malgun Gothic, sans-serif" font-size="13" fill="#274c77">거리 |20−25|/5=1&lt;2</text><text x="408" y="179" font-family="Arial, Malgun Gothic, sans-serif" font-size="13" fill="#274c77">따라서 두 점에서 만남</text><text x="408" y="205" font-family="Arial, Malgun Gothic, sans-serif" font-size="13" fill="#274c77">a=4 또는 5</text><text x="408" y="231" font-family="Arial, Malgun Gothic, sans-serif" font-size="13" fill="#274c77" font-weight="700">곱=20</text></svg>
