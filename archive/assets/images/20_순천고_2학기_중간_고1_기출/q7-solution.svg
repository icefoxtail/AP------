<svg xmlns="http://www.w3.org/2000/svg" width="760" height="600" viewBox="0 0 760 600" role="img" aria-labelledby="title desc">
<title id="title">두 원에서 직선에 내린 수선의 발 구간</title>
<desc id="desc">두 원의 중심을 직선 l에 수선으로 내리고, 각 원에서 발이 움직이는 구간과 최대·최소 거리를 표시한다.</desc>
<style>text{font-family:"Noto Sans KR","Malgun Gothic",sans-serif;fill:#172033}.axis{stroke:#111;stroke-width:1.3}.circle{fill:none;stroke:#64748b;stroke-width:1.8}.line{stroke:#111827;stroke-width:2}.perp{stroke:#64748b;stroke-width:1.4;stroke-dasharray:6 4}.c1{stroke:#2563eb;stroke-width:7;stroke-linecap:round;opacity:.72}.c2{stroke:#dc2626;stroke-width:7;stroke-linecap:round;opacity:.72}.point{fill:#111827}.foot{fill:#fff;stroke:#111827;stroke-width:2}.small{font-size:14px}.label{font-size:15px;font-weight:600}.panel{font-size:16px}.answer{font-size:18px;font-weight:700}</style>
<rect width="760" height="600" fill="#fff"/>
<line x1="324.36" y1="32" x2="324.36" y2="568" class="axis"/><line x1="32" y1="348.73" x2="568" y2="348.73" class="axis"/>
<text x="332" y="50" class="small">y</text><text x="552" y="340" class="small">x</text>
<circle cx="494.91" cy="348.73" r="24.36" class="circle"/><circle cx="178.18" cy="275.64" r="73.09" class="circle"/>
<line x1="80.73" y1="568" x2="568" y2="80.73" class="line"/><text x="351" y="324" class="label">l: y=x+1</text>
<line x1="494.91" y1="348.73" x2="397.45" y2="251.27" class="perp"/><line x1="178.18" y1="275.64" x2="275.64" y2="373.09" class="perp"/>
<line x1="223.98" y1="424.79" x2="327.32" y2="321.40" class="c2"/><line x1="380.24" y1="268.52" x2="414.67" y2="234.04" class="c1"/>
<circle cx="494.91" cy="348.73" r="4" class="point"/><circle cx="178.18" cy="275.64" r="4" class="point"/>
<circle cx="397.45" cy="251.27" r="4" class="foot"/><circle cx="275.64" cy="373.09" r="4" class="foot"/>
<circle cx="223.98" cy="424.79" r="4" class="point"/><circle cx="327.32" cy="321.40" r="4" class="point"/><circle cx="380.24" cy="268.52" r="4" class="point"/><circle cx="414.67" cy="234.04" r="4" class="point"/>
<text x="502" y="371" class="label">C₁ 중심</text><text x="91" y="267" class="label">C₂ 중심</text>
<text x="404" y="246" class="label">G₁</text><text x="283" y="389" class="label">G₂</text>
<text x="184" y="448" class="label">H₂⁻</text><text x="330" y="344" class="label">H₂⁺</text><text x="349" y="253" class="label">H₁⁻</text><text x="418" y="222" class="label">H₁⁺</text>
<text x="465" y="326" class="small">r=1</text><text x="126" y="203" class="small">r=3</text>
<rect x="584" y="72" width="160" height="426" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="600" y="108" class="panel">발의 구간</text><line x1="600" y1="128" x2="620" y2="128" class="c2"/><text x="630" y="133" class="small">C₂에서 나온 발</text><line x1="600" y1="158" x2="620" y2="158" class="c1"/><text x="630" y="163" class="small">C₁에서 나온 발</text>
<text x="600" y="220" class="panel">두 구간은 떨어져 있다</text><text x="600" y="264" class="panel">최댓값 M</text><text x="600" y="292" class="answer">5√2+4</text><text x="600" y="344" class="panel">최솟값 m</text><text x="600" y="372" class="answer">5√2−4</text><text x="600" y="438" class="panel">M+m</text><text x="600" y="470" class="answer">10√2</text>
</svg>
