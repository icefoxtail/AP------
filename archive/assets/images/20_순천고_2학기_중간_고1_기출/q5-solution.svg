<svg xmlns="http://www.w3.org/2000/svg" width="600" height="500" viewBox="0 0 600 500" role="img" aria-labelledby="t d"><title id="t">직선이 삼각형의 넓이를 이등분</title><desc id="d">O(0,0), A(0,3), B(3,0), D(0,1), C(9/4,3/4). ADC와 ODCB의 넓이는 각각 9/4이다.</desc><style>text{font-family:"Noto Sans KR","Malgun Gothic",sans-serif;fill:#172033}.pt{font-size:18px;font-weight:600}.note{font-size:16px}.cap{font-size:20px;font-weight:700}</style><rect width="600" height="500" fill="#fff"/><text x="30" y="36" class="cap">삼각형 넓이의 절반은 9/4</text><line x1="100" y1="430" x2="510" y2="430" stroke="#111" stroke-width="1.5"/><line x1="100" y1="430" x2="100" y2="80" stroke="#111" stroke-width="1.5"/><polygon points="100,122.5 100,327.5 330.625,353.125" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/><polygon points="100,430 100,327.5 330.625,353.125 407.5,430" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/><line x1="100" y1="122.5" x2="407.5" y2="430" stroke="#111" stroke-width="2.3"/><line x1="100" y1="327.5" x2="330.625" y2="353.125" stroke="#dc2626" stroke-width="3"/><circle cx="100" cy="430" r="4" fill="#111"/><circle cx="100" cy="122.5" r="4" fill="#111"/><circle cx="407.5" cy="430" r="4" fill="#111"/><circle cx="100" cy="327.5" r="4" fill="#111"/><circle cx="330.625" cy="353.125" r="4" fill="#111"/><text x="78" y="455" class="pt">O</text><text x="77" y="112" class="pt">A(0,3)</text><text x="414" y="448" class="pt">B(3,0)</text><text x="61" y="321" class="pt">D(0,1)</text><text x="335" y="352" class="pt">C(9/4,3/4)</text><text x="150" y="157" class="note">넓이 9/4</text><text x="193" y="416" class="note">나머지 넓이 9/4</text><text x="155" y="278" class="note">k=−1/8: x+9y=9</text><text x="30" y="485" class="note">두 색칠 영역이 각각 전체 넓이 9/2의 절반</text></svg>


