<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300" role="img">
<title>두 집합의 영역별 포함</title><desc>집합 연산의 양쪽이 같으려면 A만의 영역이 비어야 한다.</desc>
<style>.axis{stroke:#111;stroke-width:1.2}.shape,.curve{fill:none;stroke:#111;stroke-width:1.8}.guide{fill:none;stroke:#555;stroke-width:1;stroke-dasharray:5 4}.point{fill:#111}.radius{fill:none;stroke:#1f4e79;stroke-width:1.5}.tangent{fill:none;stroke:#111;stroke-width:2.1}.perpendicular{fill:none;stroke:#555;stroke-width:1;stroke-dasharray:3 3}.right-angle{fill:none;stroke:#111;stroke-width:1.2}.center-point{fill:#1f4e79}.element-label,.annotation{font:13px sans-serif}.annotation{font-style:italic}text{font:14px sans-serif;fill:#111}.cell{fill:#fff;stroke:#111;stroke-width:1}.cell-text{text-anchor:middle;dominant-baseline:middle;font:13px sans-serif}</style>
<rect x="16" y="16" width="242.666667" height="53.6" class="cell"/>
<text x="137.333333" y="42.8" class="cell-text">영역</text>
<rect x="258.666667" y="16" width="242.666667" height="53.6" class="cell"/>
<text x="380" y="42.8" class="cell-text">조건식 왼쪽</text>
<rect x="501.333333" y="16" width="242.666667" height="53.6" class="cell"/>
<text x="622.666667" y="42.8" class="cell-text">조건식 오른쪽</text>
<rect x="16" y="69.6" width="242.666667" height="53.6" class="cell"/>
<text x="137.333333" y="96.4" class="cell-text">A−B</text>
<rect x="258.666667" y="69.6" width="242.666667" height="53.6" class="cell"/>
<text x="380" y="96.4" class="cell-text">포함됨</text>
<rect x="501.333333" y="69.6" width="242.666667" height="53.6" class="cell"/>
<text x="622.666667" y="96.4" class="cell-text">포함되지 않음</text>
<rect x="16" y="123.2" width="242.666667" height="53.6" class="cell"/>
<text x="137.333333" y="150" class="cell-text">A∩B</text>
<rect x="258.666667" y="123.2" width="242.666667" height="53.6" class="cell"/>
<text x="380" y="150" class="cell-text">제외됨</text>
<rect x="501.333333" y="123.2" width="242.666667" height="53.6" class="cell"/>
<text x="622.666667" y="150" class="cell-text">제외됨</text>
<rect x="16" y="176.8" width="242.666667" height="53.6" class="cell"/>
<text x="137.333333" y="203.6" class="cell-text">B−A</text>
<rect x="258.666667" y="176.8" width="242.666667" height="53.6" class="cell"/>
<text x="380" y="203.6" class="cell-text">포함됨</text>
<rect x="501.333333" y="176.8" width="242.666667" height="53.6" class="cell"/>
<text x="622.666667" y="203.6" class="cell-text">포함됨</text>
<rect x="16" y="230.4" width="242.666667" height="53.6" class="cell"/>
<text x="137.333333" y="257.2" class="cell-text">결론</text>
<rect x="258.666667" y="230.4" width="242.666667" height="53.6" class="cell"/>
<text x="380" y="257.2" class="cell-text">A−B=∅</text>
<rect x="501.333333" y="230.4" width="242.666667" height="53.6" class="cell"/>
<text x="622.666667" y="257.2" class="cell-text">A⊂B</text>
</svg>
