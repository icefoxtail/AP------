<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420" role="img" aria-labelledby="t d"><title id="t">집합 X의 포함 조건</title><desc id="d">A와 B의 각 영역 원소와 X에 포함되는 영역</desc><style>text{font-family:"Noto Sans KR","Malgun Gothic",sans-serif;fill:#152238}.label{font-size:19px;font-weight:700}.elem{font-size:22px;font-weight:600}.note{font-size:17px}.small{font-size:15px}</style><rect width="760" height="420" rx="18" fill="#f8fafc"/><text x="28" y="38" class="label">A−B⊂X⊂A∪B</text><rect x="36" y="60" width="688" height="270" rx="18" fill="#fff" stroke="#94a3b8" stroke-width="2"/><text x="660" y="88" class="label">U</text><circle cx="290" cy="195" r="116" fill="#bfdbfe" fill-opacity=".55" stroke="#2563eb" stroke-width="3"/><circle cx="425" cy="195" r="116" fill="#bbf7d0" fill-opacity=".55" stroke="#16a34a" stroke-width="3"/><text x="205" y="105" class="label" fill="#1d4ed8">A</text><text x="500" y="105" class="label" fill="#15803d">B</text><text x="180" y="205" class="elem">1, 9</text><text x="337" y="205" class="elem">3, 5, 7</text><text x="505" y="205" class="elem">2</text><text x="620" y="275" class="small">4, 6, 8, 10</text><text x="48" y="360" class="note">A−B의 1, 9는 반드시 포함</text><text x="48" y="390" class="note">A∪B 밖의 원소는 포함하지 않음 · 나머지 네 원소는 각각 선택</text><text x="620" y="365" class="label">2⁴=16</text></svg>
