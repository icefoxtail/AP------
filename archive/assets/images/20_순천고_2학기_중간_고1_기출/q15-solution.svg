<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330" role="img">
<title>문항 15 해설 표</title><desc>조건과 결론을 비교하는 작은 표.</desc>
<style>.axis{stroke:#111;stroke-width:1.2}.shape,.curve{fill:none;stroke:#111;stroke-width:1.8}.guide{fill:none;stroke:#555;stroke-width:1;stroke-dasharray:5 4}.point{fill:#111}.radius{fill:none;stroke:#1f4e79;stroke-width:1.5}.tangent{fill:none;stroke:#111;stroke-width:2.1}.perpendicular{fill:none;stroke:#555;stroke-width:1;stroke-dasharray:3 3}.right-angle{fill:none;stroke:#111;stroke-width:1.2}.center-point{fill:#1f4e79}.element-label,.annotation{font:13px sans-serif}.annotation{font-style:italic}text{font:14px sans-serif;fill:#111}.cell{fill:#fff;stroke:#111;stroke-width:1}.cell-text{text-anchor:middle;dominant-baseline:middle;font:13px sans-serif}</style>
<rect x="16" y="16" width="242.666667" height="49.666667" class="cell"/>
<text x="137.333333" y="40.833333" class="cell-text">선택지</text>
<rect x="258.666667" y="16" width="242.666667" height="49.666667" class="cell"/>
<text x="380" y="40.833333" class="cell-text">무리수에서 확인</text>
<rect x="501.333333" y="16" width="242.666667" height="49.666667" class="cell"/>
<text x="622.666667" y="40.833333" class="cell-text">참·거짓</text>
<rect x="16" y="65.666667" width="242.666667" height="49.666667" class="cell"/>
<text x="137.333333" y="90.5" class="cell-text">①</text>
<rect x="258.666667" y="65.666667" width="242.666667" height="49.666667" class="cell"/>
<text x="380" y="90.5" class="cell-text">x²≥0</text>
<rect x="501.333333" y="65.666667" width="242.666667" height="49.666667" class="cell"/>
<text x="622.666667" y="90.5" class="cell-text">참</text>
<rect x="16" y="115.333333" width="242.666667" height="49.666667" class="cell"/>
<text x="137.333333" y="140.166667" class="cell-text">②</text>
<rect x="258.666667" y="115.333333" width="242.666667" height="49.666667" class="cell"/>
<text x="380" y="140.166667" class="cell-text">(x+1/2)²+3/4&gt;0</text>
<rect x="501.333333" y="115.333333" width="242.666667" height="49.666667" class="cell"/>
<text x="622.666667" y="140.166667" class="cell-text">참</text>
<rect x="16" y="165" width="242.666667" height="49.666667" class="cell"/>
<text x="137.333333" y="189.833333" class="cell-text">③</text>
<rect x="258.666667" y="165" width="242.666667" height="49.666667" class="cell"/>
<text x="380" y="189.833333" class="cell-text">x≠0</text>
<rect x="501.333333" y="165" width="242.666667" height="49.666667" class="cell"/>
<text x="622.666667" y="189.833333" class="cell-text">참</text>
<rect x="16" y="214.666667" width="242.666667" height="49.666667" class="cell"/>
<text x="137.333333" y="239.5" class="cell-text">④</text>
<rect x="258.666667" y="214.666667" width="242.666667" height="49.666667" class="cell"/>
<text x="380" y="239.5" class="cell-text">x²=x의 해 0, 1은 무리수가 아님</text>
<rect x="501.333333" y="214.666667" width="242.666667" height="49.666667" class="cell"/>
<text x="622.666667" y="239.5" class="cell-text">거짓</text>
<rect x="16" y="264.333333" width="242.666667" height="49.666667" class="cell"/>
<text x="137.333333" y="289.166667" class="cell-text">⑤</text>
<rect x="258.666667" y="264.333333" width="242.666667" height="49.666667" class="cell"/>
<text x="380" y="289.166667" class="cell-text">무리수 x는 0이 아님</text>
<rect x="501.333333" y="264.333333" width="242.666667" height="49.666667" class="cell"/>
<text x="622.666667" y="289.166667" class="cell-text">참</text>
