<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600" role="img" aria-labelledby="title desc">
<title id="title">직선에 대한 점의 대칭</title><desc id="desc">점 P에서 직선에 내린 수선의 발 H가 선분 PP′의 중점임을 좌표평면에 나타낸다.</desc>
<style>text{font-family:"Noto Sans KR","Malgun Gothic",sans-serif;fill:#172033}.axis{stroke:#64748b;stroke-width:1.2}.line{stroke:#111827;stroke-width:2}.perp{stroke:#2563eb;stroke-width:2}.mark{fill:none;stroke:#111827;stroke-width:1.5}.point{fill:#111827}.foot{fill:#fff;stroke:#111827;stroke-width:2}.label{font-size:16px;font-weight:600}.note{font-size:15px}</style>
<rect width="600" height="600" fill="#fff"/>
<line x1="60" y1="300" x2="540" y2="300" class="axis"/><line x1="300" y1="60" x2="300" y2="540" class="axis"/><text x="530" y="288" class="note">x</text><text x="310" y="76" class="note">y</text>
<line x1="60" y1="380" x2="380" y2="60" class="line"/><text x="330" y="106" class="label">x−y+4=0</text>
<line x1="140" y1="60" x2="540" y2="460" class="perp"/><line x1="220" y1="140" x2="300" y2="220" class="perp"/>
<polyline points="260,180 248,168 260,156 272,168" class="mark"/>
<circle cx="220" cy="140" r="4" class="point"/><circle cx="260" cy="180" r="4" class="foot"/><circle cx="300" cy="220" r="4" class="point"/>
<text x="199" y="128" class="label">P(−2,4)</text><text x="274" y="194" class="label">H(−1,3)</text><text x="307" y="236" class="label">P′(0,2)</text>
<text x="350" y="520" class="note">H는 PP′의 중점, P′=2H−P=(0,2)</text>
</svg>
