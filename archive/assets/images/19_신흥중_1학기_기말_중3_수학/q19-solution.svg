<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 807" width="720" height="807" role="img" aria-labelledby="title desc"><title id="title">꼭짓점의 높이를 새 함수로 나타내기</title><desc id="desc">위 두 포물선 예시에서는 각각 꼭짓점의 높이가 최댓값이다. 아래 파란 포물선은 k를 바꾸면서 생기는 높이 f(k)를 이어 나타낸 것이다.</desc><rect width="720" height="807" fill="white" /><text x="358.0000" y="51.0000" font-size="30" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">k에 따라 달라지는 두 예시</text><line x1="58.0000" y1="132.5979" x2="314.0000" y2="132.5979" stroke="#586574" stroke-width="1.65" stroke-linecap="round" /><line x1="218.7805" y1="329.0000" x2="218.7805" y2="97.0000" stroke="#586574" stroke-width="1.65" stroke-linecap="round" /><path d="M 135.1122 306.6887 Q 218.7805 130.3589 302.4488 306.6887" stroke="#205d9c" stroke-width="5.35" stroke-linecap="round" fill="none" /><circle cx="218.78048780487808" cy="218.52380952380952" r="4.6" fill="#aa5411" /><text x="185.0000" y="370.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#205d9c" text-anchor="middle">k = 0</text><line x1="409.0000" y1="132.5979" x2="665.0000" y2="132.5979" stroke="#586574" stroke-width="1.65" stroke-linecap="round" /><line x1="569.7805" y1="329.0000" x2="569.7805" y2="97.0000" stroke="#586574" stroke-width="1.65" stroke-linecap="round" /><path d="M 423.6732 208.4877 Q 507.3415 32.1578 591.0098 208.4877" stroke="#266f73" stroke-width="5.35" stroke-linecap="round" fill="none" /><circle cx="507.3414634146342" cy="120.32275132275132" r="4.6" fill="#aa5411" /><text x="536.0000" y="370.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#266f73" text-anchor="middle">k = 1</text><line x1="59.0000" y1="412.0000" x2="661.0000" y2="412.0000" stroke="#dce4ed" stroke-width="1.45" stroke-linecap="round" /><text x="359.0000" y="465.0000" font-size="31" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">각 꼭짓점 높이로 만든 f(k)</text><line x1="67.0000" y1="623.8804" x2="654.0000" y2="623.8804" stroke="#586574" stroke-width="1.75" stroke-linecap="round" /><line x1="428.6460" y1="747.0000" x2="428.6460" y2="506.0000" stroke="#586574" stroke-width="1.75" stroke-linecap="round" /><text x="668.0000" y="615.8804" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#586574" text-anchor="middle">k</text><path d="M 98.0368 529.4451 Q 361.1747 927.8810 624.3126 529.4451" stroke="#205d9c" stroke-width="5.85" stroke-linecap="round" fill="none" /><circle cx="361.1747126436782" cy="728.6630434782609" r="4.6" fill="#aa5411" /><text x="443.0000" y="777.0000" font-size="30" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#205d9c" text-anchor="middle">f(k) = 4k² + 4k − 7</text></svg>
