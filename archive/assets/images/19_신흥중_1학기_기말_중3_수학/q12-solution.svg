<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 718 515" width="718" height="515" role="img" aria-labelledby="title desc"><title id="title">포물선의 대칭축과 두 포물선이 대칭인 축</title><desc id="desc">위로 열린 파란 포물선 하나의 대칭축은 세로축이다. 주황 점선 포물선까지 맞대면 두 그래프는 가로축의 위와 아래에 놓인다.</desc><rect width="718" height="515" fill="white" /><line x1="58.0000" y1="245.0000" x2="654.0000" y2="245.0000" stroke="#586574" stroke-width="1.65" stroke-linecap="round" /><polygon points="654.0000,245.0000 641.0000,240.0000 641.0000,250.0000" fill="#586574" /><text x="671.0000" y="237.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#586574" text-anchor="middle">x</text><line x1="356.0000" y1="432.0000" x2="356.0000" y2="58.0000" stroke="#586574" stroke-width="1.65" stroke-linecap="round" /><polygon points="356.0000,58.0000 351.0000,71.0000 361.0000,71.0000" fill="#586574" /><text x="372.0000" y="64.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#586574" text-anchor="middle">y</text><circle cx="356.0" cy="245.0" r="4.6" fill="#28364b" /><text x="341.0000" y="272.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">O</text><path d="M 93.0588 69.9521 Q 356.0000 420.0479 618.9412 69.9521" stroke="#205d9c" stroke-width="5.85" stroke-linecap="round" fill="none" /><path d="M 93.0588 420.0479 Q 356.0000 69.9521 618.9412 420.0479" stroke="#aa5411" stroke-width="5.35" stroke-linecap="round" fill="none" stroke-dasharray="13 6" /><line x1="356.0000" y1="245.0000" x2="356.0000" y2="96.8113" stroke="#704895" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="6 5" /><circle cx="105.57983193277309" cy="86.22641509433959" r="4.6" fill="#205d9c" /><text x="161.0000" y="37.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#205d9c" text-anchor="middle">점 (−3,9)</text><text x="534.0000" y="41.0000" font-size="30" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#205d9c" text-anchor="middle">y = x²</text><text x="552.0000" y="479.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#aa5411" text-anchor="middle">y = −x²</text></svg>
