<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 718 515" width="718" height="515" role="img" aria-labelledby="title desc"><title id="title">세 칸 옮긴 꼭짓점과 포물선 위에 놓인 점</title><desc id="desc">파랑 원래 그래프를 가로 방향으로 세 칸 옮기면 주황 점선 그래프가 된다. 옮긴 그래프는 점 (5,2)를 지난다.</desc><rect width="718" height="515" fill="white" /><line x1="58.0000" y1="394.1266" x2="654.0000" y2="394.1266" stroke="#586574" stroke-width="1.65" stroke-linecap="round" /><polygon points="654.0000,394.1266 641.0000,389.1266 641.0000,399.1266" fill="#586574" /><text x="671.0000" y="386.1266" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#586574" text-anchor="middle">x</text><line x1="281.1469" y1="432.0000" x2="281.1469" y2="58.0000" stroke="#586574" stroke-width="1.65" stroke-linecap="round" /><polygon points="281.1469,58.0000 276.1469,71.0000 286.1469,71.0000" fill="#586574" /><text x="297.1469" y="64.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#586574" text-anchor="middle">y</text><circle cx="281.1469194312796" cy="394.126582278481" r="4.6" fill="#28364b" /><text x="266.1469" y="421.1266" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">O</text><path d="M 77.7725 87.3519 Q 281.1469 700.9013 484.5213 87.3519" stroke="#205d9c" stroke-width="5.35" stroke-linecap="round" fill="none" /><path d="M 247.2512 87.3519 Q 450.6256 700.9013 654.0000 87.3519" stroke="#aa5411" stroke-width="5.55" stroke-linecap="round" fill="none" stroke-dasharray="13 6" /><circle cx="281.1469194312796" cy="394.126582278481" r="4.6" fill="#205d9c" /><circle cx="450.62559241706157" cy="394.126582278481" r="4.6" fill="#aa5411" /><circle cx="563.6113744075828" cy="299.44303797468353" r="4.6" fill="#aa5411" /><text x="614.6114" y="312.4430" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#aa5411" text-anchor="middle">(5, 2)</text><text x="365.8863" y="433.1266" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#704895" text-anchor="middle">오른쪽 3</text><text x="173.0000" y="472.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#205d9c" text-anchor="middle">원래 그래프</text><text x="549.0000" y="472.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#aa5411" text-anchor="middle">이동한 그래프</text></svg>
