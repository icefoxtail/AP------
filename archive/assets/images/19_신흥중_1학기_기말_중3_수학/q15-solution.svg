<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 718 515" width="718" height="515" role="img" aria-labelledby="title desc"><title id="title">네 사분면을 모두 지나는 포물선</title><desc id="desc">두 가지의 네 위치에 초록 점을 찍어 네 사분면마다 파란 곡선이 지나는 모습을 보여 준다. 가운데 주황 점은 y축과의 교점이다.</desc><rect width="718" height="515" fill="white" /><line x1="58.0000" y1="316.0738" x2="654.0000" y2="316.0738" stroke="#586574" stroke-width="1.65" stroke-linecap="round" /><polygon points="654.0000,316.0738 641.0000,311.0738 641.0000,321.0738" fill="#586574" /><text x="671.0000" y="308.0738" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#586574" text-anchor="middle">x</text><line x1="356.0000" y1="432.0000" x2="356.0000" y2="58.0000" stroke="#586574" stroke-width="1.65" stroke-linecap="round" /><polygon points="356.0000,58.0000 351.0000,71.0000 361.0000,71.0000" fill="#586574" /><text x="372.0000" y="64.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#586574" text-anchor="middle">y</text><circle cx="356.0" cy="316.0738007380074" r="4.6" fill="#28364b" /><text x="341.0000" y="343.0738" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">O</text><path d="M 112.7347 67.6605 Q 356.0000 730.0959 599.2653 67.6605" stroke="#205d9c" stroke-width="5.8" stroke-linecap="round" fill="none" /><circle cx="356.0" cy="398.8782287822878" r="4.6" fill="#aa5411" /><circle cx="168.6857142857143" cy="202.49924723247233" r="4.6" fill="#277339" /><text x="84.6857" y="210.4992" font-size="27" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#277339" text-anchor="middle">제2사분면</text><circle cx="543.3142857142857" cy="202.49924723247233" r="4.6" fill="#277339" /><text x="627.3143" y="210.4992" font-size="27" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#277339" text-anchor="middle">제1사분면</text><circle cx="296.4" cy="378.9968856088561" r="4.6" fill="#277339" /><text x="205.4000" y="370.9969" font-size="27" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#277339" text-anchor="middle">제3사분면</text><circle cx="415.6" cy="378.9968856088561" r="4.6" fill="#277339" /><text x="510.6000" y="370.9969" font-size="27" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#277339" text-anchor="middle">제4사분면</text><text x="479.0000" y="50.0000" font-size="30" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#205d9c" text-anchor="middle">y = 3x² − 3</text></svg>
