<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 704 502" width="704" height="502" role="img" aria-labelledby="title desc"><title id="title">꼭짓점과 절편에서 계수를 찾는 이차함수</title><desc id="desc">꼭짓점에서 y절편까지 가로 4만큼 갔을 때 높이가 2 감소한다. 주황 보조선은 x=1의 함수값을 찾는 데 쓴다.</desc><rect width="704" height="502" fill="white" /><line x1="58.0000" y1="287.8847" x2="648.0000" y2="287.8847" stroke="#586574" stroke-width="1.65" stroke-linecap="round" /><polygon points="648.0000,287.8847 635.0000,282.8847 635.0000,292.8847" fill="#586574" /><text x="665.0000" y="279.8847" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#586574" text-anchor="middle">x</text><line x1="541.2928" y1="436.0000" x2="541.2928" y2="66.0000" stroke="#586574" stroke-width="1.65" stroke-linecap="round" /><polygon points="541.2928,66.0000 536.2928,79.0000 546.2928,79.0000" fill="#586574" /><text x="557.2928" y="72.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#586574" text-anchor="middle">y</text><circle cx="541.2927818329279" cy="287.8847352024922" r="4.6" fill="#28364b" /><text x="526.2928" y="314.8847" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">O</text><path d="M 62.7851 374.3333 Q 354.1963 -152.1386 645.6075 390.1275" stroke="#205d9c" stroke-width="6.0" stroke-linecap="round" fill="none" /><line x1="349.8897" y1="287.8847" x2="349.8897" y2="114.9875" stroke="#704895" stroke-width="1.9" stroke-linecap="round" stroke-dasharray="6 5" /><line x1="349.8897" y1="114.9875" x2="508.2758" y2="114.9875" stroke="#704895" stroke-width="1.9" stroke-linecap="round" stroke-dasharray="6 5" /><line x1="349.8897" y1="282.8847" x2="349.8897" y2="292.8847" stroke="#586574" stroke-width="1.75" stroke-linecap="round" /><text x="349.8897" y="317.8847" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#586574" text-anchor="middle">−4</text><line x1="536.2928" y1="114.9875" x2="546.2928" y2="114.9875" stroke="#586574" stroke-width="1.75" stroke-linecap="round" /><text x="520.2928" y="122.9875" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#586574" text-anchor="middle">3</text><line x1="536.2928" y1="230.2523" x2="546.2928" y2="230.2523" stroke="#586574" stroke-width="1.75" stroke-linecap="round" /><text x="520.2928" y="238.2523" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#586574" text-anchor="middle">1</text><circle cx="349.889699918897" cy="114.98753894080994" r="4.6" fill="#aa5411" /><circle cx="541.2927818329279" cy="230.25233644859816" r="4.6" fill="#205d9c" /><line x1="589.1436" y1="287.8847" x2="589.1436" y2="295.0888" stroke="#aa5411" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="6 5" /><circle cx="589.1435523114355" cy="295.08878504672896" r="4.6" fill="#aa5411" /><line x1="589.1436" y1="282.8847" x2="589.1436" y2="292.8847" stroke="#aa5411" stroke-width="1.75" stroke-linecap="round" /><text x="589.1436" y="317.8847" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#aa5411" text-anchor="middle">1</text><text x="445.5912" y="98.9875" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#704895" text-anchor="middle">4</text><text x="224.0000" y="81.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#205d9c" text-anchor="middle">y = a(x + 4)² + 3</text></svg>
