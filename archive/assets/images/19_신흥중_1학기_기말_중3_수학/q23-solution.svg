<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 718 515" width="718" height="515" role="img" aria-labelledby="title desc"><title id="title">폭은 같고 꼭짓점과 방향이 다른 두 포물선</title><desc id="desc">파란 위로 열린 포물선에 대응하는 주황 포물선을 그렸다. 주황 꼭짓점은 가로 1과 세로 4의 안내선이 만나는 위치에 있다.</desc><rect width="718" height="515" fill="white" /><line x1="58.0000" y1="304.6378" x2="654.0000" y2="304.6378" stroke="#586574" stroke-width="1.65" stroke-linecap="round" /><polygon points="654.0000,304.6378 641.0000,299.6378 641.0000,309.6378" fill="#586574" /><text x="671.0000" y="296.6378" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#586574" text-anchor="middle">x</text><line x1="316.0536" y1="432.0000" x2="316.0536" y2="58.0000" stroke="#586574" stroke-width="1.65" stroke-linecap="round" /><polygon points="316.0536,58.0000 311.0536,71.0000 321.0536,71.0000" fill="#586574" /><text x="332.0536" y="64.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#586574" text-anchor="middle">y</text><circle cx="316.053619302949" cy="304.6378378378379" r="4.6" fill="#28364b" /><text x="301.0536" y="331.6378" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">O</text><path d="M 89.1582 87.2300 Q 316.0536 522.0457 542.9491 87.2300" stroke="#205d9c" stroke-width="5.4" stroke-linecap="round" fill="none" /><path d="M 140.2895 418.9268 Q 395.9464 -133.1106 651.6032 418.9268" stroke="#aa5411" stroke-width="5.65" stroke-linecap="round" fill="none" stroke-dasharray="13 6" /><circle cx="395.9463806970509" cy="142.90810810810814" r="4.6" fill="#aa5411" /><line x1="316.0536" y1="142.9081" x2="395.9464" y2="142.9081" stroke="#704895" stroke-width="2.1" stroke-linecap="round" stroke-dasharray="6 5" /><line x1="395.9464" y1="304.6378" x2="395.9464" y2="142.9081" stroke="#704895" stroke-width="2.1" stroke-linecap="round" stroke-dasharray="6 5" /><text x="395.9464" y="334.6378" font-size="27" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#704895" text-anchor="middle">1</text><text x="294.0536" y="150.9081" font-size="27" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#704895" text-anchor="middle">4</text><text x="156.0000" y="479.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#205d9c" text-anchor="middle">기준 그래프</text><text x="540.0000" y="479.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#aa5411" text-anchor="middle">같은 폭의 그래프</text></svg>
