<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 704 505" width="704" height="505" role="img" aria-labelledby="title desc"><title id="title">포물선의 두 절편과 세 눈금에서의 부호</title><desc id="desc">아래로 열린 포물선은 x축 왼쪽 −1과 −1/2 사이에서 한 번, 원점과 1/2 사이에서 한 번 축을 지난다. y절편은 x축 위에 있다.</desc><rect width="704" height="505" fill="white" /><line x1="62.0000" y1="171.7313" x2="650.0000" y2="171.7313" stroke="#586574" stroke-width="1.65" stroke-linecap="round" /><polygon points="650.0000,171.7313 637.0000,166.7313 637.0000,176.7313" fill="#586574" /><text x="667.0000" y="163.7313" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#586574" text-anchor="middle">x</text><line x1="426.1421" y1="434.0000" x2="426.1421" y2="52.0000" stroke="#586574" stroke-width="1.65" stroke-linecap="round" /><polygon points="426.1421,52.0000 421.1421,65.0000 431.1421,65.0000" fill="#586574" /><text x="442.1421" y="58.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#586574" text-anchor="middle">y</text><circle cx="426.1421319796954" cy="171.73134328358208" r="4.6" fill="#28364b" /><text x="411.1421" y="198.7313" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">O</text><path d="M 105.2792 349.3323 Q 338.8376 -180.3496 572.3959 337.2864" stroke="#205d9c" stroke-width="6.0" stroke-linecap="round" fill="none" /><line x1="127.6650" y1="176.6346" x2="127.6650" y2="166.8281" stroke="#586574" stroke-width="1.75" stroke-linecap="round" /><text x="127.6650" y="201.7313" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#586574" text-anchor="middle">−1</text><line x1="276.9036" y1="176.6346" x2="276.9036" y2="166.8281" stroke="#586574" stroke-width="1.75" stroke-linecap="round" /><text x="259.9036" y="201.7313" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#586574" text-anchor="middle">−1/2</text><line x1="575.3807" y1="176.6346" x2="575.3807" y2="166.8281" stroke="#586574" stroke-width="1.75" stroke-linecap="round" /><text x="575.3807" y="201.7313" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#586574" text-anchor="middle">1/2</text><line x1="341.5239" y1="171.7313" x2="341.5239" y2="81.4453" stroke="#586574" stroke-width="1.7" stroke-linecap="round" stroke-dasharray="6 5" /></svg>
