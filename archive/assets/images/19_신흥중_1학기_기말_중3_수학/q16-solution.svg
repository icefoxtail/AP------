<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 718 484" width="718" height="484" role="img" aria-labelledby="title desc"><title id="title">네 사분면을 지나는 두 가지 꼭짓점 위치</title><desc id="desc">왼쪽 예시는 위로 열리고 꼭짓점이 x축 아래에 있다. 오른쪽 예시는 아래로 열리고 꼭짓점이 x축 위에 있다.</desc><rect width="718" height="484" fill="white" /><line x1="48.0000" y1="209.0000" x2="324.0000" y2="209.0000" stroke="#586574" stroke-width="1.65" stroke-linecap="round" /><line x1="186.0000" y1="345.0000" x2="186.0000" y2="73.0000" stroke="#586574" stroke-width="1.65" stroke-linecap="round" /><path d="M 52.3514 81.6214 Q 186.0000 530.6643 319.6486 81.6214" stroke="#205d9c" stroke-width="5.65" stroke-linecap="round" fill="none" /><circle cx="186.0" cy="306.14285714285717" r="4.6" fill="#205d9c" /><text x="186.0000" y="423.0000" font-size="30" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#205d9c" text-anchor="middle">a &gt; 0, q &lt; 0</text><line x1="395.0000" y1="209.0000" x2="671.0000" y2="209.0000" stroke="#586574" stroke-width="1.65" stroke-linecap="round" /><line x1="533.0000" y1="345.0000" x2="533.0000" y2="73.0000" stroke="#586574" stroke-width="1.65" stroke-linecap="round" /><path d="M 399.3514 336.3786 Q 533.0000 -112.6643 666.6486 336.3786" stroke="#aa5411" stroke-width="5.65" stroke-linecap="round" fill="none" /><circle cx="533.0" cy="111.85714285714286" r="4.6" fill="#aa5411" /><text x="533.0000" y="423.0000" font-size="30" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#aa5411" text-anchor="middle">a &lt; 0, q &gt; 0</text></svg>
