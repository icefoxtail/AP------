<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 723 823" width="723" height="823" role="img" aria-labelledby="title desc"><title id="title">직각삼각형과 원뿔의 밑면</title><desc id="desc">직각삼각형의 빗변은 5 cm, 한 직각변은 3 cm, 다른 변은 x cm이다. 원뿔의 밑면 반지름은 6 cm이다.</desc><rect width="723" height="823" fill="white" /><rect x="18" y="18" width="687" height="352" rx="17" fill="#f6f9fc" stroke="#d5e2ec" stroke-width="2" /><rect x="18" y="395" width="687" height="408" rx="17" fill="#f6f9fc" stroke="#d5e2ec" stroke-width="2" /><text x="58.0000" y="67.0000" font-size="36" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#687889" text-anchor="middle">①</text><text x="58.0000" y="447.0000" font-size="36" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#687889" text-anchor="middle">②</text><polygon points="176.0000,286.0000 475.0000,286.0000 475.0000,62.0000" fill="#e9f3fb" /><line x1="176.0000" y1="286.0000" x2="475.0000" y2="286.0000" stroke="#21639a" stroke-width="5.1" stroke-linecap="round" /><line x1="176.0000" y1="286.0000" x2="475.0000" y2="62.0000" stroke="#227365" stroke-width="5.1" stroke-linecap="round" /><line x1="475.0000" y1="286.0000" x2="475.0000" y2="62.0000" stroke="#774698" stroke-width="5.1" stroke-linecap="round" /><line x1="446.0000" y1="286.0000" x2="446.0000" y2="257.0000" stroke="#687889" stroke-width="2.8" stroke-linecap="round" /><line x1="446.0000" y1="257.0000" x2="475.0000" y2="257.0000" stroke="#687889" stroke-width="2.8" stroke-linecap="round" /><text x="283.0000" y="162.0000" font-size="34" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#227365" text-anchor="middle">5 cm</text><text x="541.0000" y="190.0000" font-size="34" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#774698" text-anchor="middle">3 cm</text><text x="325.0000" y="334.0000" font-size="34" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#21639a" tex