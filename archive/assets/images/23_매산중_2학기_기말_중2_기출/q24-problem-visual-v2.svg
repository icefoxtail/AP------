<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 686 617" width="686" height="617" role="img" aria-labelledby="title desc"><title id="title">같은 간격의 동심원 표적</title><desc id="desc">점 하나를 중심으로 세 원을 그렸다. 가운데 원과 가장 작은 원 사이의 고리만 색칠했다. 중심에서 가장 작은 원까지와 두 원 사이의 간격에 각각 2가 적혀 있다.</desc><rect width="686" height="617" fill="white" /><circle cx="343" cy="307" r="246" fill="#f5f9fc" stroke="#21639a" stroke-width="4.9" /><circle cx="343" cy="307" r="164" fill="#c7eddf" stroke="#227365" stroke-width="4.9" /><circle cx="343" cy="307" r="82" fill="#f8fbfd" stroke="#227365" stroke-width="4.9" /><line x1="343.0000" y1="307.0000" x2="589.0000" y2="307.0000" stroke="#687889" stroke-width="2.9" stroke-linecap="round" /><line x1="343.0000" y1="297.0000" x2="343.0000" y2="317.0000" stroke="#687889" stroke-width="2.9" stroke-linecap="round" /><text x="384.0000" y="355.0000" font-size="35" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#273846" text-anchor="middle">2</text><line x1="425.0000" y1="297.0000" x2="425.0000" y2="317.0000" stroke="#687889" stroke-width="2.9" stroke-linecap="round" /><text x="466.0000" y="355.0000" font-size="35" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#273846" text-anchor="middle">2</text><line x1="507.0000" y1="297.0000" x2="507.0000" y2="317.0000" stroke="#687889" stroke-width="2.9" stroke-linecap="round" /><text x="548.0000" y="355.0000" font-size="35" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#273846" text-anchor="middle">2</text><line x1="589.0000" y1="297.0000" x2="589.0000" y2="317.0000" stroke="#687889" stroke-width="2.9" stroke-linecap="round" /><circle cx="343" cy="307" r="5.5" fill="#273846" /></svg>
