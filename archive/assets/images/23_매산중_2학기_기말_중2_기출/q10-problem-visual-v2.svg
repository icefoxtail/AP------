text x="610.0000" y="370.0000" font-size="30" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#273846" text-anchor="middle">C</text><text x="344.0000" y="338.0000" font-size="33" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#a34c1f" text-anchor="middle">12 cm</text></svg>
