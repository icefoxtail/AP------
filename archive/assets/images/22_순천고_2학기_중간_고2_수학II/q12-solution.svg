<svg xmlns="http://www.w3.org/2000/svg" width="640" height="460" viewBox="0 0 640 460" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-graph-preset="SOLUTION_GRAPH" data-axis-scale-mode="UNEQUAL_UNIT_DECLARED" data-fact-hash="sha256:5ffe75ca4030418c1cf05c14f18f479285099c5238e9fcf9ecaa11100f93df1f" data-visual-provenance="PYTHON_DERIVED_LAYOUT_REVIEWED">
  <title id="title">22 순천고 12번 f의 제곱 감소구간 해설</title>
  <desc id="desc">f의 부호와 증가·감소를 곱해 (f(x))²의 감소구간을 찾는 해설 그래프와 부호표</desc>
  <style>
    .background{fill:#fff}
    .axis{stroke:#171717;stroke-width:1.4;fill:none;stroke-linecap:round;stroke-linejoin:round}
    .curve{stroke:#111;stroke-width:2.1;fill:none;stroke-linecap:round;stroke-linejoin:round}
    .guide{stroke:#777;stroke-width:.95;stroke-dasharray:4 4;fill:none}
    .target{fill:#e7eef5;stroke:#55718a;stroke-width:1.1}
    .panel{fill:#f7f8fa;stroke:#c7cbd1;stroke-width:1}
    .title{font-family:"Noto Sans KR","Pretendard","Malgun Gothic",sans-serif;font-size:15px;font-weight:700;fill:#111}
    .label{font-family:"Noto Sans KR","Pretendard","Malgun Gothic",sans-serif;font-size:12px;fill:#222}
    .small{font-family:"Noto Sans KR","Pretendard","Malgun Gothic",sans-serif;font-size:11px;fill:#333}
    .math{font-family:"STIX Two Math","Cambria Math","Times New Roman",serif;font-size:13px;fill:#111}
  </style>
  <defs>
    <marker id="axis-arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L6,3 L0,6 Z" fill="#171717"/></marker>
  </defs>
  <rect class="background" x="0" y="0" width="640" height="460"/>
  <text class="title" x="32" y="28">q12  (f(x)²)′ = 2f(x)f′(x)</text>
  <text class="small" x="32" y="47">f와 f′의 부호가 서로 다를 때만 f(x)²가 감소한다.</text>

  <g aria-label="function graph">
    <rect class="panel" x="32" y="65" width="350" height="170" rx="8"/>
    <line class="axis" x1="48" y1="185" x2="365" y2="185" marker-end="url(#axis-arrow)"/>
    <path class="curve" d="M55 185 C70 160 86 120 105 120 C125 120 140 160 155 185 C170 210 190 220 205 220 C220 220 240 210 255 185 C270 150 290 135 305 135 C325 135 340 175 355 185"/>
    <text class="math" x="360" y="180">x</text>
    <text class="math" x="56" y="100">y=f(x)</text>
    <line class="guide" x1="55" y1="185" x2="55" y2="218"/><line class="guide" x1="105" y1="120" x2="105" y2="218"/>
    <line class="guide" x1="155" y1="185" x2="155" y2="218"/><line class="guide" x1="205" y1="220" x2="205" y2="218"/>
    <line class="guide" x1="255" y1="185" x2="255" y2="218"/><line class="guide" x1="305" y1="135" x2="305" y2="218"/>
    <line class="guide" x1="355" y1="185" x2="355" y2="218"/>
    <text class="label" x="51" y="228">a</text><text class="label" x="101" y="228">b</text><text class="label" x="151" y="228">c</text>
    <text class="label" x="201" y="228">d</text><text class="label" x="251" y="228">e</text><text class="label" x="301" y="228">f</text><text class="label" x="351" y="228">g</text>
  </g>

  <g aria-label="sign table">
    <rect class="panel" x="400" y="65" width="208" height="300" rx="8"/>
    <text class="title" x="418" y="92">부호 비교</text>
    <text class="math" x="418" y="119">구간</text><text class="math" x="478" y="119">f · f′</text><text class="math" x="550" y="119">2ff′</text>
    <line class="guide" x1="418" y1="129" x2="590" y2="129"/>
    <text class="small" x="418" y="151">(a,b)</text><text class="small" x="478" y="151">+ · +</text><text class="small" x="550" y="151">+</text>
    <text class="small" x="418" y="178">(c,d)</text><text class="small" x="478" y="178">− · −</text><text class="small" x="550" y="178">+</text>
    <rect class="target" x="412" y="188" width="180" height="31" rx="4"/>
    <text class="small" x="418" y="208">(d,e)</text><text class="small" x="478" y="208">− · +</text><text class="label" x="550" y="208">− ↓</text>
    <text class="small" x="418" y="242">(e,f)</text><text class="small" x="478" y="242">+ · +</text><text class="small" x="550" y="242">+</text>
    <text class="small" x="418" y="269">(g,∞)</text><text class="small" x="478" y="269">− · −</text><text class="small" x="550" y="269">+</text>
    <line class="guide" x1="418" y1="286" x2="590" y2="286"/>
    <text class="small" x="418" y="313">감소 조건: f와 f′의 부호가 반대</text>
    <text class="label" x="418" y="344">정답: ③  d&lt;x&lt;e</text>
  </g>

  <g aria-label="derivative note">
    <rect class="panel" x="32" y="280" width="350" height="85" rx="8"/>
    <text class="title" x="50" y="307">판정 핵심</text>
    <text class="small" x="50" y="330">(d,e)에서는 f(x)&lt;0이고 그래프가 증가하므로 f′(x)&gt;0이다.</text>
    <text class="small" x="50" y="351">따라서 2f(x)f′(x)&lt;0이고 f(x)²가 감소한다.</text>
  </g>
</svg>
