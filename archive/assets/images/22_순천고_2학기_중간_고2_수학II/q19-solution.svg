<svg xmlns="http://www.w3.org/2000/svg" width="640" height="460" viewBox="0 0 640 460" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-graph-preset="SOLUTION_GRAPH" data-axis-scale-mode="UNEQUAL_UNIT_DECLARED" data-fact-hash="sha256:e885dc8fa25c4b6cf9eb159e03b7bc7658bdf82cbb845cb7ff66e26c54bce26b" data-visual-provenance="PYTHON_DERIVED_COORDINATES">
  <title id="title">22 순천고 19번 곡선과 직선 사이 삼각형 넓이 해설</title>
  <desc id="desc">A와 B를 잇는 직선, 곡선 위의 점 P, 거리함수 g의 최솟값을 이용한 삼각형 넓이 해설</desc>
  <style>
    .background{fill:#fff}.axis{stroke:#171717;stroke-width:1.4;fill:none;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}.curve{stroke:#111;stroke-width:2.1;fill:none;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}.line-main{stroke:#3f4a5a;stroke-width:1.7;fill:none;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}.guide{stroke:#777;stroke-width:.95;stroke-dasharray:4 4;fill:none;vector-effect:non-scaling-stroke}.point{stroke:#111;stroke-width:1;fill:#111;vector-effect:non-scaling-stroke}.triangle{fill:#e7eef5;fill-opacity:.7;stroke:#55718a;stroke-width:1.1;vector-effect:non-scaling-stroke}.panel{fill:#f7f8fa;stroke:#c7cbd1;stroke-width:1}.title{font-family:"Noto Sans KR","Pretendard","Malgun Gothic",sans-serif;font-size:15px;font-weight:700;fill:#111}.label{font-family:"Noto Sans KR","Pretendard","Malgun Gothic",sans-serif;font-size:12px;fill:#222}.small{font-family:"Noto Sans KR","Pretendard","Malgun Gothic",sans-serif;font-size:11px;fill:#333}.math{font-family:"STIX Two Math","Cambria Math","Times New Roman",serif;font-size:13px;fill:#111}
  </style>
  <defs><marker id="axis-arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L6,3 L0,6 Z" fill="#171717"/></marker></defs>
  <rect class="background" x="0" y="0" width="640" height="460"/>
  <text class="title" x="32" y="28">q19  곡선 위 점 P와 고정 밑변 AB</text>
  <text class="small" x="32" y="47">거리함수의 최솟값을 찾아 삼각형 ABP의 넓이를 계산한다.</text>
  <g aria-label="coordinate diagram">
    <rect class="panel" x="32" y="65" width="330" height="290" rx="8"/>
    <g transform="translate(45 180) scale(50 -6)" aria-label="single coordinate transform">
      <line class="axis" x1="-0.5" y1="0" x2="5.8" y2="0" marker-end="url(#axis-arrow)"/>
      <line class="axis" x1="0" y1="-20" x2="0" y2="15" marker-end="url(#axis-arrow)"/>
      <polyline class="curve" points="1.5,-2.21875 1.625,-2.435425 1.75,-2.498047 1.875,-2.367065 2,-2 2.125,-1.35144 2.25,-0.373047 2.375,0.98645 2.5,2.78125 2.625,5.068481 2.75,7.908203 2.875,11.363403 3,15.5"/>
      <polygon class="triangle" points="2,-14 5,-2 2,-2"/>
      <line class="line-main" x1="2" y1="-14" x2="5" y2="-2"/>
      <line class="guide" x1="2" y1="-14" x2="2" y2="-2"/>
      <circle class="point" cx="2" cy="-14" r=".08"/><circle class="point" cx="5" cy="-2" r=".08"/><circle class="point" cx="2" cy="-2" r=".08"/>
    </g>
    <text class="label" x="100" y="284">A(2,−14)</text>
    <text class="label" x="286" y="184">B(5,−2)</text>
    <text class="label" x="106" y="176">P(2,−2)</text>
    <text class="math" x="204" y="226">y=4x−22</text>
    <text class="small" x="151" y="253">g(2)=12</text>
    <text class="math" x="338" y="175">x</text><text class="math" x="52" y="84">y</text>
  </g>
  <g aria-label="calculation panel">
    <rect class="panel" x="380" y="65" width="228" height="290" rx="8"/>
    <text class="title" x="398" y="92">최솟값 계산</text>
    <text class="math" x="398" y="122">g(x)=f(x)−4x+22</text>
    <text class="math" x="398" y="149">=1/2x⁴−3x²−4x+24</text>
    <text class="math" x="398" y="177">g′(x)=2(x−2)(x+1)²</text>
    <text class="small" x="398" y="198">x&lt;2에서 감소, x&gt;2에서 증가</text>
    <text class="math" x="398" y="227">g(2)=12</text>
    <line class="guide" x1="398" y1="240" x2="590" y2="240"/>
    <text class="small" x="398" y="267">AB=3√17</text>
    <text class="small" x="398" y="288">P에서 AB까지 거리 = 12/√17</text>
    <text class="math" x="398" y="317">넓이 = 1/2·3√17·12/√17</text>
    <text class="label" x="398" y="343">=18  (정답: ①)</text>
  </g>
</svg>
