<svg xmlns="http://www.w3.org/2000/svg" width="640" height="460" viewBox="0 0 640 460" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc">
  <title id="title">22 순천고 19번 곡선과 직선 사이 삼각형 넓이 해설</title>
  <desc id="desc">A와 B를 잇는 직선, 곡선 위의 점 P, 거리함수 g의 최솟값을 이용한 삼각형 넓이 해설</desc>
  <style>
    .background{fill:#fff}
    .axis{stroke:#171717;stroke-width:1.4;fill:none;stroke-linecap:round;stroke-linejoin:round}
    .curve{stroke:#111;stroke-width:2.1;fill:none;stroke-linecap:round;stroke-linejoin:round}
    .line-main{stroke:#3f4a5a;stroke-width:1.7;fill:none;stroke-linecap:round;stroke-linejoin:round}
    .guide{stroke:#777;stroke-width:.95;stroke-dasharray:4 4;fill:none}
    .point{stroke:#111;stroke-width:1;fill:#111}
    .triangle{fill:#e7eef5;fill-opacity:.7;stroke:#55718a;stroke-width:1.1}
    .panel{fill:#f7f8fa;stroke:#c7cbd1;stroke-width:1}
    .title{font-family:"Noto Sans KR","Pretendard","Malgun Gothic",sans-serif;font-size:15px;font-weight:700;fill:#111}
    .label{font-family:"Noto Sans KR","Pretendard","Malgun Gothic",sans-serif;font-size:12px;fill:#222}
    .small{font-family:"Noto Sans KR","Pretendard","Malgun Gothic",sans-serif;font-size:11px;fill:#333}
    .math{font-family:"STIX Two Math","Cambria Math","Times New Roman",serif;font-size:13px;fill:#111}
  </style>
  <defs>
    <marker id="axis-arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L6,3 L0,6 Z" fill="#171717"/></marker>
  </defs>
  <rect class="background" x="0" y="0" width="640" height="460"/>
  <text class="title" x="32" y="28">q19  곡선 위 점 P와 고정 밑변 AB</text>
  <text class="small" x="32" y="47">거리함수의 최솟값을 찾아 삼각형 ABP의 넓이를 계산한다.</text>

  <g aria-label="coordinate diagram">
    <rect class="panel" x="32" y="65" width="330" height="290" rx="8"/>
    <line class="axis" x1="48" y1="330" x2="345" y2="330" marker-end="url(#axis-arrow)"/>
    <line class="axis" x1="70" y1="345" x2="70" y2="82" marker-end="url(#axis-arrow)"/>
    <path class="curve" d="M72 285 C105 275 140 300 170 300 C198 295 220 260 245 225 C265 185 282 135 300 92"/>
    <path class="triangle" d="M170 330 L335 300 L170 300 Z"/>
    <line class="line-main" x1="170" y1="330" x2="335" y2="300"/>
    <line class="guide" x1="170" y1="330" x2="170" y2="300"/>
    <circle class="point" cx="170" cy="330" r="3.8"/>
    <circle class="point" cx="335" cy="300" r="3.8"/>
    <circle class="point" cx="170" cy="300" r="3.8"/>
    <text class="label" x="142" y="348">A(2,−14)</text>
    <text class="label" x="291" y="318">B(5,−2)</text>
    <text class="label" x="176" y="292">P(2,−2)</text>
    <text class="math" x="282" y="289">y=4x−22</text>
    <text class="small" x="178" y="322">g(2)=12</text>
    <text class="math" x="338" y="325">x</text><text class="math" x="76" y="91">y</text>
  </g>

  <g aria-label="calculation panel">
    <rect class="panel" x="380" y="65" width="228" height="290" rx="8"/>
    <text class="title" x="398" y="92">최솟값 계산</text>
    <text class="math" x="398" y="122">g(x)=f(x)−4x+22</text>
    <text class="math" x="398" y="149">=1/2x⁴−3x²−4x+24</text>
    <text class="math" x="398" y="177">g′(x)=2(x−2)(x+1)²</text>
    <text class="small" x="398" y="198">x&lt;2에서 감소, x&gt;2에서 증가</text>
    <text class="math" x="398" y="227">g(2)=12</text>
    <line class="guide" x1="398" y1="240" x2="590" y2="240"/>
    <text class="small" x="398" y="267">AB=3√17</text>
    <text class="small" x="398" y="288">P에서 AB까지 거리 = 12/√17</text>
    <text class="math" x="398" y="317">넓이 = 1/2·3√17·12/√17</text>
    <text class="label" x="398" y="343">=18  (정답: ①)</text>
  </g>
</svg>
