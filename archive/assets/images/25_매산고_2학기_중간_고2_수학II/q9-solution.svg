<title id="title">25 매산고 9번 거리 차의 극한</title>
<desc id="desc">같은 축척의 좌표평면에서 P는 y=9x² 위, H는 P에서 y축에 내린 수선의 발, Q는 OH의 중점이다. PQ와 HQ의 차를 유리화한다.</desc>
