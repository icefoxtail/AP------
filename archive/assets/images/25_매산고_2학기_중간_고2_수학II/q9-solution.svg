<svg xmlns="http://www.w3.org/2000/svg" width="640" height="430" viewBox="0 0 640 430" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc">
  <title id="title">25 매산고 9번 거리 차의 극한 해설</title>
  <desc id="desc">P=(t,9t²), H=(0,9t²), Q=(0,9t²/2)에서 PQ−HQ를 유리화해 1/9을 얻는다</desc>
  <style>.background{fill:#fff}.axis{stroke:#171717;stroke-width:1.3;fill:none;stroke-linecap:round;stroke-linejoin:round}.curve{stroke:#111;stroke-width:2.1;fill:none;stroke-linecap:round;stroke-linejoin:round}.segment{stroke:#356a9a;stroke-width:1.9;fill:none;stroke-linecap:round}.guide{stroke:#777;stroke-width:.95;stroke-dasharray:4 4;fill:none}.point{stroke:#111;stroke-width:1;fill:#111}.panel{fill:#f7f8fa;stroke:#c7cbd1;stroke-width:1}.title{font-family:"Noto Sans KR","Pretendard","Malgun Gothic",sans-serif;font-size:15px;font-weight:700;fill:#111}.label{font-family:"Noto Sans KR","Pretendard","Malgun Gothic",sans-serif;font-size:12px;fill:#222}.small{font-family:"Noto Sans KR","Pretendard","Malgun Gothic",sans-serif;font-size:11px;fill:#333}.math{font-family:"STIX Two Math","Cambria Math","Times New Roman",serif;font-size:13px;fill:#111}</style>
  <defs><marker id="axis-arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L6,3 L0,6 Z" fill="#171717"/></marker></defs>
  <rect class="background" x="0" y="0" width="640" height="430"/><text class="title" x="32" y="28">q9  거리 차의 극한</text><text class="small" x="32" y="47">큰 두 길이를 직접 빼지 않고 켤레식으로 유리화한다.</text>
  <g aria-label="geometry"><rect class="panel" x="32" y="65" width="342" height="278" rx="8"/><line class="axis" x1="52" y1="300" x2="350" y2="300" marker-end="url(#axis-arrow)"/><line class="axis" x1="96" y1="326" x2="96" y2="82" marker-end="url(#axis-arrow)"/><path class="curve" d="M110 292 C168 266 220 214 266 154 C300 112 324 90 350 82"/><line class="segment" x1="96" y1="282" x2="282" y2="142"/><line class="segment" x1="96" y1="282" x2="96" y2="216"/><line class="guide" x1="282" y1="142" x2="282" y2="300"/><line class="guide" x1="96" y1="216" x2="282" y2="216"/><circle class="point" cx="282" cy="142" r="4"/><circle class="point" cx="96" cy="216" r="4"/><circle class="point" cx="96" cy="282" r="4"/><text class="label" x="288" y="138">P</text><text class="label" x="102" y="212">H</text><text class="label" x="102" y="278">Q</text><text class="label" x="84" y="318">O</text><text class="math" x="354" y="305">x</text><text class="math" x="102" y="88">y</text></g>
  <g aria-label="calculation"><rect class="panel" x="392" y="65" width="216" height="278" rx="8"/><text class="title" x="410" y="92">유리화</text><text class="math" x="410" y="132">PQ=√(t²+81t⁴/4)</text><text class="math" x="410" y="168">HQ=9t²/2</text><text class="math" x="410" y="204">PQ−HQ</text><text class="math" x="410" y="240">=1/(√(1/t²+81/4)+9/2)</text><text class="math" x="410" y="276">lim=1/9</text><text class="label" x="410" y="322">정답: ③</text></g>
  <rect class="panel" x="32" y="364" width="576" height="38" rx="7"/><text class="small" x="50" y="388">P, H, Q의 세로 관계를 표시하고 제곱차 공식으로 소거한다.</text>
</svg>
