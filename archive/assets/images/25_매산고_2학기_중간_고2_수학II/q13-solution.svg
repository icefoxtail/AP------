<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="480" viewBox="0 0 760 480" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc" data-scale-policy="SCHEMATIC_ALLOWED" data-visual-provenance="reconstructed_from_independent_solution_facts">
  <title id="title">문항 13 해설: OP=OQ인 삼각형의 외접원 지름</title>
  <desc id="desc">대표 배치 t=1에서 P=(1,1), Q=(√2,0), OP=OQ인 삼각형과 외접원의 지름 OR을 표시하고, 외접원 지름 공식에 필요한 밑변과 높이를 나타낸 해설 도형</desc>
  <style>
    text{font-family:Arial,"Malgun Gothic",sans-serif;fill:#111827}
    .axis{stroke:#111827;stroke-width:1.2;stroke-linecap:round}
    .side{fill:none;stroke:#111827;stroke-width:2.05;stroke-linecap:round;stroke-linejoin:round}
    .circle{fill:#eff6ff;fill-opacity:.32;stroke:#111827;stroke-width:2.05}
    .diameter{fill:none;stroke:#2563eb;stroke-width:1.6;stroke-linecap:round}
    .height{fill:none;stroke:#64748b;stroke-width:1;stroke-dasharray:5 4;stroke-linecap:round}
    .point{stroke:#fff;stroke-width:1}
    .label{font-size:22px;font-weight:700}
    .small{font-size:17px}
    .formula{font-family:Georgia,"Times New Roman",serif;font-size:23px}
    .panel-title{font-size:23px;font-weight:700}
    .panel-text{font-size:20px}
    .muted{fill:#475569;font-size:15px}
  </style>

  <rect id="background" x="0" y="0" width="760" height="480" rx="16" fill="#f8fafc"/>
  <rect id="diagram-panel" x="24" y="24" width="430" height="432" rx="14" fill="#fff" stroke="#cbd5e1"/>
  <rect id="formula-panel" x="478" y="24" width="258" height="432" rx="14" fill="#fff" stroke="#cbd5e1"/>

  <line id="x-axis" class="axis" x1="48" y1="380" x2="440" y2="380"/>
  <line id="y-axis" class="axis" x1="90" y1="445" x2="90" y2="50"/>
  <circle id="anchor-x-unit" cx="210" cy="380" r="1" fill="#111827"/>
  <circle id="anchor-y-unit" cx="90" cy="260" r="1" fill="#111827"/>
  <text x="423" y="369" class="label">x</text>
  <text x="98" y="66" class="label">y</text>

  <circle id="circle-circum" class="circle" cx="174.8528137423857" cy="344.8528137423857" r="91.84402376762155"/>
  <line id="side-op" class="side" x1="90" y1="380" x2="210" y2="260"/>
  <line id="side-pq" class="side" x1="210" y1="260" x2="259.7056274847714" y2="380"/>
  <line id="side-oq" class="side" x1="90" y1="380" x2="259.7056274847714" y2="380"/>
  <line id="height-p-to-oq" class="height" x1="210" y1="260" x2="210" y2="380"/>
  <line id="diameter-or" class="diameter" x1="90" y1="380" x2="259.7056274847714" y2="309.7056274847714"/>

  <circle id="point-o" class="point" cx="90" cy="380" r="3.2" fill="#111827"/>
  <circle id="point-p" class="point" cx="210" cy="260" r="3.8" fill="#2563eb"/>
  <circle id="point-q" class="point" cx="259.7056274847714" cy="380" r="3.8" fill="#2563eb"/>
  <circle id="point-c" class="point" cx="174.8528137423857" cy="344.8528137423857" r="3.8" fill="#0f766e"/>
  <circle id="point-r" class="point" cx="259.7056274847714" cy="309.7056274847714" r="3.4" fill="#2563eb"/>
  <text x="72" y="409" class="label">O</text>
  <text x="216" y="250" class="label">P</text>
  <text x="264" y="405" class="label">Q</text>
  <text x="181" y="341" class="label">C</text>
  <text x="265" y="305" class="label">R</text>
  <text x="139" y="397" class="small">OQ=s</text>
  <text x="214" y="326" class="small">t²</text>
  <text x="166" y="300" class="small" fill="#2563eb">지름 OR</text>
  <text x="76" y="437" class="muted">대표 배치 t=1, OP=OQ</text>

  <text x="502" y="64" class="panel-title">길이 관계</text>
  <line x1="502" y1="78" x2="712" y2="78" stroke="#e2e8f0"/>
  <text x="502" y="113" class="panel-text">P=(1,1), Q=(√2,0)</text>
  <text x="502" y="147" class="panel-text">OP=OQ=s</text>
  <text x="502" y="181" class="panel-text">높이=t²</text>
  <text x="502" y="224" class="formula">넓이=1/2·s·t²</text>
  <text x="502" y="267" class="formula">f(t)=s·PQ/t²</text>
  <text x="502" y="324" class="panel-title">극한</text>
  <line x1="502" y1="338" x2="712" y2="338" stroke="#e2e8f0"/>
  <text x="502" y="374" class="formula">s²/t⁴ → 1</text>
  <text x="502" y="408" class="formula">PQ²/t⁴ → 2</text>
  <text x="502" y="442" class="formula">f(t)²/t⁴ → 2</text>
</svg>
