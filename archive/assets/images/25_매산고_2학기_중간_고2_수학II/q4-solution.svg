<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 682" width="512" height="682" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="UNEQUAL_UNIT_DECLARED" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">P(x)=3x³−x²−x+2라 하면 P(−1)=−1, P(0)=2로 부호가 다르고 P는 연속이다. 따라서 중간값 정리에 의해 (−1, 0)에 실근이 적어도 하나 있고, 실근이 오직 하나이므로 그 실근은 이 구간에 있다. 따라서 답은 ①이다.</title><desc id="visual-desc">삼차함수 P의 그래프가 x=−1에서 음수, x=0에서 양수이고 두 점 A, B 사이에서 x축을 한 번 지난다. 그래프의 두 극값 점 E, F가 표시되어 있다.</desc><rect width="512" height="682" fill="#fff"/><g data-layer="30"><line id="x-axis" data-role="axis" stroke="#111" stroke-width="1.2" fill="none" data-axis="x" x1="32" y1="323.269090909" x2="480" y2="323.269090909"/></g><g data-layer="30"><line id="y-axis" data-role="axis" stroke="#111" stroke-width="1.2" fill="none" data-axis="y" x1="272.727272727" y1="650" x2="272.727272727" y2="32"/></g><g data-layer="40"><polyline id="f-piece-1-branch-0" data-role="curve" stroke="#111" stroke-width="2.1" fill="none" data-branch="PIECE_1" points="72,609.64 73.230769231,600.856406356 74.461538462,592.179071788 75.692307692,583.607396613 76.923076923,575.140781148 78.153846154,566.778625708 79.384615385,558.520330611 80.615384615,550.365296172 81.846153846,542.312922709 83.076923077,534.362610537 84.307692308,526.513759973 85.538461538,518.765771335 86.769230769,511.118044937 88,503.569981096 89.230769231,496.12098013 90.461538462,488.770442354 91.692307692,