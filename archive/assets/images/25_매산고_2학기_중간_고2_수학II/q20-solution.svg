<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 704" width="512" height="704" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="UNEQUAL_UNIT_DECLARED" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">조건 (가)에서 f′(x)=3x²+k이고 평균변화율과 미분계수가 같다는 식을 정리하면 g(x)=−2x이다. 조건 (나)에서 (3x²+k)(12x²+k)=k²이므로 36x⁴+15kx²=0이고, 영이 아닌 두 근의 곱은 5k/12이다. 5k/12=−5에서 k=−12이므로 k/12=−1이고 g(−1)=2이다. 따라서 답은 2이다.</title><desc id="visual-desc">삼차함수 f의 그래프가 두 극값 점 E, F를 지나고, 그래프 위의 두 점 A, B를 잇는 직선 t가 그려져 있다. A, B, E, F가 표시되어 있다.</desc><rect width="512" height="704" fill="#fff"/><g data-layer="30"><line id="x-axis" data-role="axis" stroke="#111" stroke-width="1.2" fill="none" data-axis="x" x1="32" y1="352" x2="480" y2="352"/></g><g data-layer="30"><line id="y-axis" data-role="axis" stroke="#111" stroke-width="1.2" fill="none" data-axis="y" x1="256" y1="672" x2="256" y2="32"/></g><g data-layer="40"><polyline id="f-piece-1-branch-0" data-role="curve" stroke="#111" stroke-width="2.1" fill="none" data-branch="PIECE_1" points="116,632 116.468227425,623.609447928 116.936454849,615.293811405 117.404682274,607.052839038 117.872909699,598.886279433 118.341137124,590.793881193 118.809364548,582.775392926 119.745819398,566.959140731 120.682274247,551.43551169 121.618729097,536.202494649 122.555183946,521.258078451 123.491638796,506.600251941 124.428093645,492.227003963 125.364548495,478.136323361 126.301003344,464.32619898 127.237458194,