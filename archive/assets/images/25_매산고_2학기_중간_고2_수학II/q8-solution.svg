<svg xmlns="http://www.w3.org/2000/svg" width="640" height="450" viewBox="0 0 640 450" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc">
  <title id="title">25 매산고 8번 직선과 함수의 교점 해설</title>
  <desc id="desc">f와 y=x/2가 O와 P에서 만나고 A는 아래, B는 위에 있어 롤의 정리와 접선 기울기를 판정한다</desc>
  <style>.background{fill:#fff}.axis{stroke:#171717;stroke-width:1.3;fill:none;stroke-linecap:round;stroke-linejoin:round}.curve{stroke:#111;stroke-width:2.1;fill:none;stroke-linecap:round;stroke-linejoin:round}.line{stroke:#356a9a;stroke-width:1.8;fill:none;stroke-linecap:round}.tangent{stroke:#b23a48;stroke-width:1.9;fill:none;stroke-linecap:round}.guide{stroke:#777;stroke-width:.95;stroke-dasharray:4 4;fill:none}.point{stroke:#111;stroke-width:1;fill:#111}.panel{fill:#f7f8fa;stroke:#c7cbd1;stroke-width:1}.title{font-family:"Noto Sans KR","Pretendard","Malgun Gothic",sans-serif;font-size:15px;font-weight:700;fill:#111}.label{font-family:"Noto Sans KR","Pretendard","Malgun Gothic",sans-serif;font-size:12px;fill:#222}.small{font-family:"Noto Sans KR","Pretendard","Malgun Gothic",sans-serif;font-size:11px;fill:#333}.math{font-family:"STIX Two Math","Cambria Math","Times New Roman",serif;font-size:13px;fill:#111}</style>
  <defs><marker id="axis-arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L6,3 L0,6 Z" fill="#171717"/></marker></defs>
  <rect class="background" x="0" y="0" width="640" height="450"/><text class="title" x="32" y="28">q8  y=x/2와 함수의 교점</text><text class="small" x="32" y="47">A, B의 위치와 P에서의 접선, 두 교점 사이의 롤 정리를 한 그림에 묶는다.</text>
  <g aria-label="graph"><rect class="panel" x="32" y="65" width="342" height="296" rx="8"/><line class="axis" x1="52" y1="286" x2="350" y2="286" marker-end="url(#axis-arrow)"/><line class="axis" x1="96" y1="326" x2="96" y2="82" marker-end="url(#axis-arrow)"/><path class="line" d="M54 306 L348 158"/><path class="curve" d="M56 320 C106 320 126 274 160 244 C194 214 220 182 248 168 C278 154 310 134 348 94"/><path class="tangent" d="M232 180 L348 106"/><circle class="point" cx="96" cy="286" r="4"/><circle class="point" cx="178" cy="214" r="4"/><circle class="point" cx="248" cy="168" r="4"/><circle class="point" cx="308" cy="134" r="4"/><text class="label" x="88" y="304">O</text><text class="label" x="170" y="206">A</text><text class="label" x="246" y="160">P</text><text class="label" x="310" y="128">B</text><text class="math" x="350" y="164">y=x/2</text><text class="math" x="354" y="291">x</text><text class="math" x="102" y="88">y</text></g>
  <g aria-label="decision"><rect class="panel" x="392" y="65" width="216" height="296" rx="8"/><text class="title" x="410" y="92">판정</text><text class="math" x="410" y="132">f′(p)&gt;1/2</text><text class="math" x="410" y="168">f(a)&lt;a/2</text><text class="math" x="410" y="204">f(b)&gt;b/2</text><text class="math" x="410" y="240">h=f−x/2</text><text class="math" x="410" y="276">h(0)=h(p)=0</text><text class="label" x="410" y="324">ㄱ, ㄷ 참 · 정답: ④</text></g>
  <rect class="panel" x="32" y="382" width="576" height="38" rx="7"/><text class="small" x="50" y="406">A는 직선 아래, B는 위이므로 ㄴ의 부등호는 반대이고 롤의 정리로 ㄷ을 닫는다.</text>
</svg>
