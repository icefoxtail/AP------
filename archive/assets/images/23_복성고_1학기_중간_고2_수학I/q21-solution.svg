<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 190" width="520" height="190" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc" data-visual-type="number-line" data-interval="(0,3]" data-visual-provenance="solution-derived-facts">
<title id="title">해의 구간</title>
<desc id="desc">0은 제외하고 3은 포함하는 구간이며 정수 1, 2, 3이 포함된다.</desc>
<rect width="520" height="190" rx="16" fill="#ffffff"/>
<text x="28" y="31" font-family="Noto Sans KR, Pretendard, Malgun Gothic, sans-serif" font-size="18" font-weight="700" fill="#243247">해의 구간</text>
<text x="28" y="57" font-family="Cambria Math, STIX Two Math, serif" font-size="16" fill="#243247">0 &lt; x ≤ 3</text>
<line id="number-line-axis" data-role="axis" x1="62" y1="100" x2="482" y2="100" stroke="#26364a" stroke-width="2" stroke-linecap="round"/>
<line id="solution-interval" data-role="interval" data-start="0" data-end="3" x1="92" y1="100" x2="362" y2="100" stroke="#2767a5" stroke-width="8" stroke-linecap="round"/>
<g id="ticks" stroke="#26364a" stroke-width="1.7">
<line id="tick-0" data-value="0" x1="92" y1="91" x2="92" y2="109"/><line id="tick-1" data-value="1" x1="182" y1="91" x2="182" y2="109"/><line id="tick-2" data-value="2" x1="272" y1="91" x2="272" y2="109"/><line id="tick-3" data-value="3" x1="362" y1="91" x2="362" y2="109"/><line id="tick-4" data-value="4" x1="452" y1="91" x2="452" y2="109"/>
</g>
<circle id="open-endpoint-0" data-role="endpoint" data-value="0" data-state="open" cx="92" cy="100" r="8" fill="#ffffff" stroke="#2767a5" stroke-width="3"/>
<circle id="included-marker-1" data-role="included-integer" data-value="1" cx="182" cy="100" r="5.5" fill="#2767a5" stroke="#ffffff" stroke-width="1.2"/>
<circle id="included-marker-2" data-role="included-integer" data-value="2" cx="272" cy="100" r="5.5" fill="#2767a5" stroke="#ffffff" stroke-width="1.2"/>
<circle id="closed-endpoint-3" data-role="endpoint included-integer" data-value="3" data-state="closed" cx="362" cy="100" r="8" fill="#2767a5" stroke="#ffffff" stroke-width="1.2"/>
<g font-family="Noto Sans KR, Pretendard, Malgun Gothic, sans-serif" font-size="14" text-anchor="middle" fill="#243247">
<text id="label-0" data-value="0" x="92" y="133">0</text><text id="label-1" data-value="1" x="182" y="133">1</text><text id="label-2" data-value="2" x="272" y="133">2</text><text id="label-3" data-value="3" x="362" y="133">3</text><text id="label-4" data-value="4" x="452" y="133">4</text>
</g>
<text x="92" y="163" font-family="Noto Sans KR, Pretendard, Malgun Gothic, sans-serif" font-size="13" fill="#52657b">0 제외</text><text x="292" y="163" font-family="Noto Sans KR, Pretendard, Malgun Gothic, sans-serif" font-size="13" fill="#52657b">1, 2, 3 포함</text>
</svg>
