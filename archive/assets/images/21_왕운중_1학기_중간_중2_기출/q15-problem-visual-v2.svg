<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 756 527" width="756" height="527" role="img" aria-labelledby="title desc"><title id="title">직사각형과 내부 삼각형 AEF</title><desc id="desc">직사각형 ABCD에서 전체 가로는 5a+b, 세로는 3b이다. E는 아랫변 위에 있고 BE는 2a이다. F는 오른쪽 변 위에 있고 FC는 b이다. A와 E와 F를 연결한 삼각형이 표시된다.</desc><rect width="756" height="527" fill="white" /><line x1="117.0000" y1="120.0000" x2="117.0000" y2="398.0000" stroke="#202020" stroke-width="5.6" stroke-linecap="round" /><line x1="117.0000" y1="398.0000" x2="622.0000" y2="398.0000" stroke="#202020" stroke-width="5.6" stroke-linecap="round" /><line x1="622.0000" y1="398.0000" x2="622.0000" y2="120.0000" stroke="#202020" stroke-width="5.6" stroke-linecap="round" /><line x1="622.0000" y1="120.0000" x2="117.0000" y2="120.0000" stroke="#202020" stroke-width="5.6" stroke-linecap="round" /><line x1="117.0000" y1="120.0000" x2="276.4737" y2="398.0000" stroke="#227365" stroke-width="5.5" stroke-linecap="round" /><line x1="276.4737" y1="398.0000" x2="622.0000" y2="305.3333" stroke="#227365" stroke-width="5.5" stroke-linecap="round" /><line x1="622.0000" y1="305.3333" x2="117.0000" y2="120.0000" stroke="#227365" stroke-width="5.5" stroke-linecap="round" /><circle cx="117" cy="120" r="4.7" fill="#202020" /><text x="99.0000" y="103.0000" font-size="31" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#293b4b" text-anchor="middle">A</text><circle cx="117" cy="398" r="4.7" fill="#202020" /><text x="95.0000" y="422.0000" font-size="31" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#293b4b" text-anchor="middle">B</text><circle cx="622" cy="398" r="4.7" fill="#202020" /><text x="641.0000" y="424.0000" font-size="31" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#293b4b" text-anchor="middle">C</text><circle cx="622" cy="120" r="4.7" fill="#202020" /><text x="641.0000" y="103.0000" font-size="31" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#293b4b" text-anchor="middle">D</text><circle cx="276.47368421052636" cy="398" r="4.7" fill="#202020" /><text x="276.4737" y="426.0000" font-size="31" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#293b4b" text-anchor="middle">E</text><circle cx="622" cy="305.3333333333333" r="4.7" fill="#202020" /><text x="646.0000" y="310.3333" font-size="31" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#293b4b" text-anchor="middle">F</text><line x1="117.0000" y1="69.0000" x2="622.0000" y2="69.0000" stroke="#202020" stroke-width="2.1" stroke-linecap="round" /><line x1="117.0000" y1="61.0000" x2="117.0000" y2="77.0000" stroke="#202020" stroke-width="2.1" stroke-linecap="round" /><line x1="622.0000" y1="61.0000" x2="622.0000" y2="77.0000" stroke="#202020" stroke-width="2.1" stroke-linecap="round" /><text x="369.5000" y="51.0000" font-size="34" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#202020" text-anchor="middle">5a + b</text><line x1="72.0000" y1="120.0000" x2="72.0000" y2="398.0000" stroke="#202020" stroke-width="2.1" stroke-linecap="round" /><line x1="64.0000" y1="120.0000" x2="80.0000" y2="120.0000" stroke="#202020" stroke-width="2.1" stroke-linecap="round" /><line x1="64.0000" y1="398.0000" x2="80.0000" y2="398.0000" stroke="#202020" stroke-width="2.1" stroke-linecap="round" /><text x="40.0000" y="268.0000" font-size="34" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#202020" text-anchor="middle">3b</text><line x1="117.0000" y1="454.0000" x2="276.4737" y2="454.0000" stroke="#227365" stroke-width="2.1" stroke-linecap="round" /><line x1="117.0000" y1="446.0000" x2="117.0000" y2="462.0000" stroke="#227365" stroke-width="2.1" stroke-linecap="round" /><line x1="276.4737" y1="446.0000" x2="276.4737" y2="462.0000" stroke="#227365" stroke-width="2.1" stroke-linecap="round" /><text x="196.7368" y="497.0000" font-size="34" font-family="