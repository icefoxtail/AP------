<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" width="640" height="280" role="img" aria-labelledby="title desc" data-scale-policy="SCHEMATIC_ALLOWED">
  <title id="title">원과 현의 길이 및 삼각형 넓이</title>
  <desc id="desc">중심 C에서 현 AB에 내린 수선 CH, 반지름 5, CH=3, AH=4를 표시한 그림</desc>
  <rect width="640" height="280" fill="#fff"/>
  <text x="320" y="28" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="20" font-weight="700" fill="#1e3a5f">현 AB의 길이 → 중심에서 현까지 거리 → 넓이</text>
  <rect x="18" y="42" width="330" height="230" rx="8" fill="#f8fafc" stroke="#dbe3ef"/>
  <g stroke="#e2e8f0" stroke-width="1">
    <line x1="40" y1="68" x2="40" y2="266"/><line x1="68" y1="68" x2="68" y2="266"/><line x1="96" y1="68" x2="96" y2="266"/><line x1="124" y1="68" x2="124" y2="266"/><line x1="152" y1="68" x2="152" y2="266"/><line x1="180" y1="68" x2="180" y2="266"/><line x1="208" y1="68" x2="208" y2="266"/><line x1="236" y1="68" x2="236" y2="266"/>
    <line x1="30" y1="96" x2="332" y2="96"/><line x1="30" y1="124" x2="332" y2="124"/><line x1="30" y1="152" x2="332" y2="152"/><line x1="30" y1="180" x2="332" y2="180"/><line x1="30" y1="208" x2="332" y2="208"/><line x1="30" y1="236" x2="332" y2="236"/><line x1="30" y1="264" x2="332" y2="264"/>
  </g>
  <line x1="30" y1="190" x2="334" y2="190" stroke="#0f172a" stroke-width="1.5"/><line x1="110" y1="270" x2="110" y2="55" stroke="#0f172a" stroke-width="1.5"/>
  <circle cx="110" cy="204" r="70" fill="#dbeafe" fill-opacity=".65" stroke="#2563eb" stroke-width="2.6"/>
  <polygon points="110,134 176.8,223.6 110,204" fill="#fef3c7" fill-opacity=".65"/>
  <line x1="54" y1="59.3" x2="222" y2="227.3" stroke="#f97316" stroke-width="2.4"/>
  <line x1="110" y1="204" x2="143.6" y2="178.8" stroke="#dc2626" stroke-width="2.2" stroke-dasharray="6 4"/>
  <line x1="110" y1="134" x2="176.8" y2="223.6" stroke="#0f766e" stroke-width="2.2"/>
  <circle cx="110" cy="204" r="4.5" fill="#1d4ed8"/><circle cx="110" cy="134" r="4.2" fill="#0f766e"/><circle cx="176.8" cy="223.6" r="4.2" fill="#0f766e"/><circle cx="143.6" cy="178.8" r="4" fill="#dc2626"/>
  <text x="118" y="222" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14" font-weight="700">C(0,−1)</text>
  <text x="84" y="126" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14" font-weight="700">A(0,4)</text>
  <text x="183" y="239" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14" font-weight="700">B(4.8,−2.4)</text>
  <text x="148" y="176" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="13" fill="#b91c1c">H</text>
  <text x="116" y="162" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="13" fill="#047857">AH=4</text><text x="116" y="198" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="13" fill="#b91c1c">CH=3</text>
  <rect x="370" y="42" width="252" height="230" rx="8" fill="#f8fafc" stroke="#dbe3ef"/>
  <text x="388" y="72" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="17" font-weight="700" fill="#334155">계산 흐름</text>
  <text x="388" y="105" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="15">중심 C에서 직선까지</text><text x="388" y="128" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="15">거리 CH = 3</text>
  <text x="388" y="158" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="15">AH = √(5²−3²) = 4</text><text x="388" y="184" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="15">AB = 2AH = 8</text>
  <line x1="388" y1="198" x2="602" y2="198" stroke="#cbd5e1"/>
  <text x="388" y="226" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="15">넓이 = ½ × 8 × 3</text><text x="388" y="254" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="18" font-weight="700" fill="#1d4ed8">= 12</text>
</svg>
