<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" width="640" height="280" role="img" aria-labelledby="title desc">
  <title id="title">두 점까지 거리의 비가 일정한 점의 자취</title>
  <desc id="desc">A(3,0), B(6,0)에서 거리의 비가 1:2인 점의 자취인 중심 (2,0), 반지름 2인 원</desc>
  <rect width="640" height="280" fill="#fff"/>
  <text x="320" y="28" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="20" font-weight="700" fill="#1e3a5f">PA : PB = 1 : 2  →  (x − 2)² + y² = 4</text>
  <rect x="18" y="45" width="330" height="215" rx="8" fill="#f8fafc" stroke="#dbe3ef"/>
  <g stroke="#e2e8f0" stroke-width="1">
    <line x1="46" y1="70" x2="46" y2="250"/><line x1="80" y1="70" x2="80" y2="250"/><line x1="114" y1="70" x2="114" y2="250"/><line x1="148" y1="70" x2="148" y2="250"/><line x1="182" y1="70" x2="182" y2="250"/><line x1="216" y1="70" x2="216" y2="250"/><line x1="250" y1="70" x2="250" y2="250"/><line x1="284" y1="70" x2="284" y2="250"/><line x1="318" y1="70" x2="318" y2="250"/>
    <line x1="30" y1="122" x2="334" y2="122"/><line x1="30" y1="156" x2="334" y2="156"/><line x1="30" y1="190" x2="334" y2="190"/><line x1="30" y1="224" x2="334" y2="224"/><line x1="30" y1="258" x2="334" y2="258"/>
  </g>
  <line x1="30" y1="190" x2="334" y2="190" stroke="#0f172a" stroke-width="1.5"/><line x1="80" y1="260" x2="80" y2="58" stroke="#0f172a" stroke-width="1.5"/>
  <circle cx="148" cy="190" r="68" fill="#dbeafe" fill-opacity=".7" stroke="#2563eb" stroke-width="2.6"/>
  <line x1="80" y1="190" x2="284" y2="190" stroke="#64748b" stroke-width="1.8" stroke-dasharray="5 4"/>
  <line x1="80" y1="190" x2="182" y2="190" stroke="#dc2626" stroke-width="2.2"/><line x1="216" y1="190" x2="284" y2="190" stroke="#0f766e" stroke-width="2.2"/>
  <circle cx="148" cy="190" r="4.5" fill="#1d4ed8"/><circle cx="80" cy="190" r="4.2" fill="#dc2626"/><circle cx="216" cy="190" r="4.2" fill="#0f766e"/><circle cx="182" cy="190" r="4" fill="#111827"/><circle cx="284" cy="190" r="4" fill="#111827"/>
  <text x="151" y="178" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14" font-weight="700">C(2,0)</text>
  <text x="38" y="218" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="13" fill="#b91c1c">P₁(0,0)</text><text x="197" y="218" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="13" fill="#047857">P₂(4,0)</text>
  <text x="165" y="174" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="13">A(3,0)</text><text x="266" y="174" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="13">B(6,0)</text>
  <rect x="370" y="45" width="252" height="215" rx="8" fill="#f8fafc" stroke="#dbe3ef"/>
  <text x="388" y="75" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="17" font-weight="700" fill="#334155">자취의 의미</text>
  <text x="388" y="108" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="15">4PA² = PB²</text><text x="388" y="136" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="15">→ (x−2)² + y² = 4</text>
  <text x="388" y="166" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="15">중심: (2, 0)</text><text x="388" y="192" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="15">반지름: 2</text>
  <line x1="388" y1="204" x2="602" y2="204" stroke="#cbd5e1"/>
  <text x="388" y="232" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="15">넓이 = π × 2²</text><text x="388" y="254" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="18" font-weight="700" fill="#1d4ed8">= 4π</text>
</svg>
