<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" role="img" aria-labelledby="title desc">
  <title id="title">정사각형과 지름 CD인 원</title>
  <desc id="desc">정사각형 A(5,4), B(2,8), C(6,11), D(9,7)와 선분 CD를 지름으로 하는 원의 중심과 반지름을 나타낸 그림이다.</desc>
  <rect width="640" height="300" fill="#fff"/>
  <text x="320" y="28" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="22" font-weight="700" fill="#1e3a5f">AB에 수직인 변을 찾아 C,D를 결정</text>
  <rect x="18" y="42" width="360" height="240" rx="8" fill="#f8fafc" stroke="#dbe3ef"/>
  <line x1="38" y1="245" x2="350" y2="245" stroke="#0f172a" stroke-width="1.5"/>
  <line x1="80" y1="52" x2="80" y2="270" stroke="#0f172a" stroke-width="1.5"/>
  <polygon points="165,177 114,109 182,58 233,126" fill="#dcfce7" fill-opacity=".65" stroke="#059669" stroke-width="2.5"/>
  <line x1="114" y1="109" x2="233" y2="126" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="7 5"/>
  <circle cx="207.5" cy="92" r="42.5" fill="#dbeafe" fill-opacity=".35" stroke="#2563eb" stroke-width="2.4"/>
  <circle cx="207.5" cy="92" r="4.5" fill="#1d4ed8"/>
  <circle cx="165" cy="177" r="4" fill="#059669"/><circle cx="114" cy="109" r="4" fill="#059669"/><circle cx="182" cy="58" r="4" fill="#059669"/><circle cx="233" cy="126" r="4" fill="#059669"/>
  <text x="169" y="194" font-family="Arial, sans-serif" font-size="15">A(5,4)</text><text x="68" y="104" font-family="Arial, sans-serif" font-size="15">B(2,8)</text><text x="184" y="52" font-family="Arial, sans-serif" font-size="15">C(6,11)</text><text x="238" y="123" font-family="Arial, sans-serif" font-size="15">D(9,7)</text>
  <text x="214" y="88" font-family="Arial, sans-serif" font-size="14" fill="#1d4ed8">중심</text><text x="245" y="105" font-family="Arial, sans-serif" font-size="14" fill="#b45309">CD=5</text>
  <rect x="398" y="42" width="224" height="240" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="416" y="76" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="18" font-weight="700" fill="#1e3a5f">좌표 변화량</text>
  <text x="416" y="111" font-family="Arial, sans-serif" font-size="16">AB: (−3,4), |AB|=5</text>
  <text x="416" y="141" font-family="Arial, sans-serif" font-size="16">수직변: 기울기 3/4</text>
  <text x="416" y="171" font-family="Arial, sans-serif" font-size="16">(p,q)=(4,3) 선택</text>
  <text x="416" y="201" font-family="Arial, sans-serif" font-size="16">C=(6,11), D=(9,7)</text>
  <text x="416" y="231" font-family="Arial, sans-serif" font-size="16">중심=(15/2,9), r=5/2</text>
  <text x="416" y="266" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="18" font-weight="700" fill="#b91c1c">a+b+c=19  →  ①</text>
</svg>
