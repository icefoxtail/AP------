<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500" preserveAspectRatio="xMidYMid meet" role="img" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-axis-scale-mode="EQUAL_UNIT"><title>삼각형 ABC와 평행한 선분 DE</title><desc>A(2,5), B(-1,-1), C(6,-8), D(1,3), E(10/3,2/3)를 동일 축척으로 표시하고 DE와 BC의 평행 관계와 내분비를 나타낸다.</desc><style>.axis{font:italic 14px serif;fill:#111827}.label{font:600 12px "Malgun Gothic",sans-serif}.note{font:12px "Malgun Gothic",sans-serif;fill:#334155}.head{font:700 17px "Malgun Gothic",sans-serif;fill:#0f172a}</style><rect width="900" height="500" fill="#fff"/><text x="30" y="32" class="head">삼각형 ABC의 닮음과 선분 DE</text><text x="30" y="54" class="note">넓이비 1:9 → 닮음비 1:3 → AD:DB=AE:EC=1:2</text><rect x="30" y="70" width="570" height="390" rx="12" fill="#fff" stroke="#cbd5e1"/><g data-origin-x="200" data-origin-y="270" data-sx="22" data-sy="22"><line x1="50" y1="270" x2="580" y2="270" stroke="#111827" stroke-width="1.4"/><line x1="200" y1="82" x2="200" y2="450" stroke="#111827" stroke-width="1.4"/><text x="570" y="262" class="axis">x</text><text x="208" y="96" class="axis">y</text><polygon points="244,160 178,292 332,446" fill="#dbeafe" fill-opacity=".45" stroke="#2563eb" stroke-width="2.6"/><line data-geometry="segment" data-equation="y=-x+4" x1="222" y1="204" x2="273.333" y2="255.333" stroke="#dc2626" stroke-width="4"/><line data-geometry="segment" data-equation="BC" x1="178" y1="292" x2="332" y2="446" stroke="#16a34a" stroke-width="4" stroke-dasharray="8 5"/><circle data-point-label="A" data-point-x="2" data-point-y="5" cx="244" cy="160" r="6" fill="#111827"/><text x="252" y="154" class="label">A(2,5)</text><circle data-point-label="B" data-point-x="-1" data-point-y="-1" cx="178" cy="292" r="6" fill="#111827"/><text x="108" y="308" class="label">B(-1,-1)</text><circle data-point-label="C" data-point-x="6" data-point-y="-8" cx="332" cy="446" r="6" fill="#111827"/><text x="340" y="442" class="label">C(6,-8)</text><circle data-point-label="D" data-point-x="1" data-point-y="3" cx="222" cy="204" r="6" fill="#dc2626"/><text x="160" y="198" class="label" fill="#b91c1c">D(1,3)</text><circle data-point-label="E" data-point-x="3.333333" data-point-y="0.666667" cx="273.333" cy="255.333" r="6" fill="#dc2626"/><text x="281" y="250" class="label" fill="#b91c1c">E(10/3,2/3)</text></g><rect x="620" y="70" width="250" height="390" rx="12" fill="#f8fafc" stroke="#dbe3ef"/><text x="642" y="102" class="head">풀이 핵심</text><text x="642" y="140" class="note">△ADE ∼ △ABC</text><text x="642" y="168" class="note">넓이비 1:9</text><text x="642" y="196" class="note">닮음비 1:3</text><text x="642" y="234" class="note">AD:DB=1:2</text><text x="642" y="262" class="note">AE:EC=1:2</text><text x="642" y="300" class="note">DE ∥ BC</text><text x="642" y="328" class="note">DE: y=-x+4</text><text x="642" y="366" class="note">sx=sy=22</text></svg>