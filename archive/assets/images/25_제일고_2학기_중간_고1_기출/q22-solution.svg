<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" role="img" aria-labelledby="title desc">
  <title id="title">정수 거리별 원의 교점 개수</title>
  <desc id="desc">주어진 원의 중심 C(3,4), 반지름 4와 중심 O에서 거리 d인 원의 교점 개수를 d=1부터 9까지 분류한 그림이다.</desc>
  <rect width="640" height="300" fill="#fff"/>
  <text x="320" y="28" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="22" font-weight="700" fill="#1e3a5f">OP=d인 원과 주어진 원의 교점 세기</text>
  <rect x="18" y="42" width="360" height="240" rx="8" fill="#f8fafc" stroke="#dbe3ef"/>
  <line x1="38" y1="170" x2="350" y2="170" stroke="#0f172a" stroke-width="1.5"/>
  <line x1="145" y1="54" x2="145" y2="270" stroke="#0f172a" stroke-width="1.5"/>
  <circle cx="145" cy="170" r="90" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="8 5"/>
  <circle cx="145" cy="170" r="50" fill="none" stroke="#2563eb" stroke-width="2" stroke-dasharray="6 4"/>
  <circle cx="145" cy="170" r="10" fill="none" stroke="#64748b" stroke-width="2"/>
  <circle cx="175" cy="130" r="40" fill="#dcfce7" fill-opacity=".62" stroke="#059669" stroke-width="2.5"/>
  <line x1="145" y1="170" x2="175" y2="130" stroke="#475569" stroke-width="1.7"/>
  <circle cx="145" cy="170" r="4.5" fill="#1d4ed8"/><circle cx="175" cy="130" r="4.5" fill="#059669"/>
  <text x="127" y="190" font-family="Arial, sans-serif" font-size="15">O</text><text x="181" y="126" font-family="Arial, sans-serif" font-size="15" fill="#047857">C(3,4)</text><text x="153" y="153" font-family="Arial, sans-serif" font-size="14">OC=5</text>
  <text x="242" y="88" font-family="Arial, sans-serif" font-size="15" fill="#b45309">d=9</text><text x="191" y="184" font-family="Arial, sans-serif" font-size="15" fill="#1d4ed8">d=5</text><text x="148" y="165" font-family="Arial, sans-serif" font-size="13" fill="#475569">d=1</text><text x="201" y="111" font-family="Arial, sans-serif" font-size="15" fill="#047857">r=4</text>
  <rect x="398" y="42" width="224" height="240" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="416" y="75" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="18" font-weight="700" fill="#1e3a5f">거리 조건과 개수</text>
  <text x="416" y="108" font-family="Arial, sans-serif" font-size="16">|5−4| ≤ d ≤ 5+4</text>
  <text x="416" y="140" font-family="Arial, sans-serif" font-size="16">d=1: 1점</text>
  <text x="416" y="172" font-family="Arial, sans-serif" font-size="16">d=2,…,8: 각각 2점</text>
  <text x="416" y="204" font-family="Arial, sans-serif" font-size="16">d=9: 1점</text>
  <text x="416" y="240" font-family="Arial, sans-serif" font-size="17">1+7×2+1=16</text>
  <text x="416" y="270" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="18" font-weight="700" fill="#b91c1c">정답 = 16</text>
</svg>
