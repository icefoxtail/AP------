<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" role="img" aria-labelledby="title desc" data-scale-policy="SCHEMATIC_ALLOWED">
  <title id="title">원의 두 접선과 k의 값</title>
  <desc id="desc">중심 (2,−4), 반지름 √10인 원에 접하는 두 평행한 직선 x+3y=0과 x+3y+20=0을 나타낸 그림이다.</desc>
  <rect width="640" height="300" fill="#fff"/>
  <text x="320" y="28" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="22" font-weight="700" fill="#1e3a5f">중심 (2, −4)에서 두 접선까지의 거리 = √10</text>
  <rect x="18" y="42" width="360" height="240" rx="8" fill="#f8fafc" stroke="#dbe3ef"/>
  <line x1="40" y1="145" x2="350" y2="145" stroke="#0f172a" stroke-width="1.6"/>
  <line x1="145" y1="56" x2="145" y2="268" stroke="#0f172a" stroke-width="1.6"/>
  <text x="330" y="138" font-family="Arial, sans-serif" font-size="15">x축</text><text x="151" y="68" font-family="Arial, sans-serif" font-size="15">y축</text>
  <line x1="40" y1="110" x2="350" y2="213" stroke="#2563eb" stroke-width="2.4"/>
  <line x1="40" y1="140" x2="210" y2="267" stroke="#f59e0b" stroke-width="2.4"/>
  <circle cx="175" cy="205" r="47.4" fill="#dbeafe" fill-opacity=".72" stroke="#2563eb" stroke-width="2.5"/>
  <circle cx="175" cy="205" r="5" fill="#1d4ed8"/>
  <text x="184" y="222" font-family="Arial, sans-serif" font-size="15" fill="#1d4ed8">C(2,−4)</text>
  <text x="272" y="188" font-family="Arial, sans-serif" font-size="15" fill="#1d4ed8">k=0</text>
  <text x="82" y="253" font-family="Arial, sans-serif" font-size="15" fill="#b45309">k=20</text>
  <text x="185" y="178" font-family="Arial, sans-serif" font-size="15" fill="#1d4ed8">r=√10</text>
  <rect x="398" y="42" width="224" height="240" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="416" y="76" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="18" font-weight="700" fill="#1e3a5f">접선 조건</text>
  <text x="416" y="112" font-family="Arial, sans-serif" font-size="17">x+3y+k=0</text>
  <text x="416" y="143" font-family="Arial, sans-serif" font-size="16">|k−10|/√10 = √10</text>
  <text x="416" y="174" font-family="Arial, sans-serif" font-size="17">|k−10|=10</text>
  <text x="416" y="205" font-family="Arial, sans-serif" font-size="17">k=0, 20</text>
  <text x="416" y="243" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="18" font-weight="700" fill="#b91c1c">곱 = 0  →  ③</text>
</svg>
