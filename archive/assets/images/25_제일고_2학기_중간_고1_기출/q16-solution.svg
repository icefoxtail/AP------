<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" role="img" aria-labelledby="title desc">
  <title id="title">직각삼각형의 외접원과 무게중심</title>
  <desc id="desc">A(0,−3), B(−1,0), C(9,0)인 직각삼각형의 외접원과 P(16,9), 무게중심 Q(8,3)를 나타낸 그림이다.</desc>
  <rect width="640" height="300" fill="#fff"/>
  <text x="320" y="28" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="22" font-weight="700" fill="#1e3a5f">BC를 지름으로 하는 외접원과 Q의 위치</text>
  <rect x="18" y="42" width="360" height="240" rx="8" fill="#f8fafc" stroke="#dbe3ef"/>
  <line x1="38" y1="165" x2="350" y2="165" stroke="#0f172a" stroke-width="1.5"/>
  <line x1="95" y1="54" x2="95" y2="270" stroke="#0f172a" stroke-width="1.5"/>
  <circle cx="143" cy="165" r="60" fill="#dbeafe" fill-opacity=".55" stroke="#2563eb" stroke-width="2.4"/>
  <line x1="83" y1="165" x2="203" y2="165" stroke="#1d4ed8" stroke-width="2.2"/>
  <line x1="83" y1="165" x2="95" y2="201" stroke="#dc2626" stroke-width="2.1"/>
  <line x1="95" y1="201" x2="203" y2="165" stroke="#dc2626" stroke-width="2.1"/>
  <line x1="287" y1="57" x2="83" y2="165" stroke="#059669" stroke-width="2" stroke-dasharray="6 5"/>
  <line x1="287" y1="57" x2="203" y2="165" stroke="#059669" stroke-width="2" stroke-dasharray="6 5"/>
  <circle cx="95" cy="201" r="4" fill="#dc2626"/><circle cx="83" cy="165" r="4" fill="#dc2626"/><circle cx="203" cy="165" r="4" fill="#dc2626"/>
  <circle cx="287" cy="57" r="5" fill="#059669"/><circle cx="191" cy="129" r="5" fill="#f59e0b"/>
  <text x="102" y="220" font-family="Arial, sans-serif" font-size="15">A(0,−3)</text><text x="45" y="157" font-family="Arial, sans-serif" font-size="15">B(−1,0)</text><text x="208" y="157" font-family="Arial, sans-serif" font-size="15">C(9,0)</text>
  <text x="292" y="55" font-family="Arial, sans-serif" font-size="15" fill="#047857">P(16,9)</text><text x="196" y="124" font-family="Arial, sans-serif" font-size="15" fill="#b45309">Q(8,3)</text>
  <text x="130" y="160" font-family="Arial, sans-serif" font-size="14" fill="#1d4ed8">O(4,0)</text>
  <rect x="398" y="42" width="224" height="240" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="416" y="75" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="18" font-weight="700" fill="#1e3a5f">계산 순서</text>
  <text x="416" y="107" font-family="Arial, sans-serif" font-size="16">A=(0,−3), B=(−1,0)</text>
  <text x="416" y="135" font-family="Arial, sans-serif" font-size="16">C=(9,0), [ABC]=15</text>
  <text x="416" y="163" font-family="Arial, sans-serif" font-size="16">[PBC]=45  →  b=9</text>
  <text x="416" y="191" font-family="Arial, sans-serif" font-size="16">외접원: O=(4,0), r=5</text>
  <text x="416" y="219" font-family="Arial, sans-serif" font-size="16">Q=((a+8)/3, 3)</text>
  <text x="416" y="247" font-family="Arial, sans-serif" font-size="16">(a−4)²+9=25 → a=16</text>
  <text x="416" y="273" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="17" font-weight="700" fill="#b91c1c">a+b=25  →  ⑤</text>
</svg>
