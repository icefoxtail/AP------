<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 420" width="840" height="420" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_1" data-geometry-preset="GEOMETRY_STANDARD" data-axis-scale-mode="EQUAL_UNIT" data-fact-hash="69677e22ce4acebc7e20f2740cd5db92458b33f4d52decc8ef8d1342c6a51fcc" data-geometry-fact-hash="69677e22ce4acebc7e20f2740cd5db92458b33f4d52decc8ef8d1342c6a51fcc" data-visual-provenance="deterministic-independent-facts"><title id="title">두 삼각형의 무게중심 좌표</title><desc id="desc">A(2,4)와 원점 O를 같은 축척 좌표평면에 표시하고 ABC의 무게중심이 O일 때 OBC의 무게중심 좌표를 계산한다.</desc><rect width="840" height="420" fill="#fff"/><rect x="16" y="16" width="808" height="388" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><text x="34" y="48" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#0f172a">두 삼각형의 무게중심 좌표</text><rect x="34" y="72" width="390" height="300" rx="12" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><g stroke="#e2e8f0" stroke-width="1"><line x1="50" y1="108" x2="408" y2="108"/><line x1="50" y1="140" x2="408" y2="140"/><line x1="50" y1="172" x2="408" y2="172"/><line x1="50" y1="204" x2="408" y2="204"/><line x1="50" y1="236" x2="408" y2="236"/><line x1="50" y1="268" x2="408" y2="268"/><line x1="50" y1="300" x2="408" y2="300"/><line x1="50" y1="332" x2="408" y2="332"/><line x1="50" y1="364" x2="408" y2="364"/><line x1="60" y1="90" x2="60" y2="364"/><line x1="92" y1="90" x2="92" y2="364"/><line x1="124" y1="90" x2="124" y2="364"/><line x1="156" y1="90" x2="156" y2="364"/><line x1="188" y1="90" x2="188" y2="364"/><line x1="220" y1="90" x2="220" y2="364"/><line x1="252" y1="90" x2="252" y2="364"/><line x1="284" y1="90" x2="284" y2="364"/><line x1="316" y1="90" x2="316" y2="364"/><line x1="348" y1="90" x2="348" y2="364"/><line x1="380" y1="90" x2="380" y2="364"/></g><line id="axis-x" x1="50" y1="300" x2="408" y2="300" stroke="#475569" stroke-width="2"/><line id="axis-y" x1="220" y1="90" x2="220" y2="364" stroke="#475569" stroke-width="2"/><polygon points="408,300 396,294 396,306" fill="#475569"/><polygon points="220,90 214,102 226,102" fill="#475569"/><g font-family="Arial, sans-serif" font-size="12" fill="#475569"><text x="392" y="318">x</text><text x="228" y="106">y</text><text x="212" y="318">O</text><text x="252" y="318">1</text><text x="284" y="318">2</text><text x="348" y="318">4</text><text x="206" y="268">1</text><text x="202" y="172">4</text></g><line id="segment-oa" x1="220" y1="300" x2="284" y2="172" stroke="#94a3b8" stroke-width="2.5"/><circle id="point-o" cx="220" cy="300" r="6" fill="#f59e0b"/><circle id="point-a" cx="284" cy="172" r="6" fill="#2563eb"/><g font-family="Arial, sans-serif" font-size="14" font-weight="700"><text x="228" y="294" fill="#b45309">O(0,0)</text><text x="292" y="166" fill="#1d4ed8">A(2,4)</text></g><rect x="456" y="72" width="360" height="300" rx="12" fill="#fff" stroke="#94a3b8" stroke-width="2"/><g font-family="Arial, sans-serif" fill="#0f172a"><text x="480" y="106" font-size="19" font-weight="700">좌표별 무게중심 계산</text><text x="480" y="144" font-size="15">G_ABC = O = (0,0)</text><text x="480" y="180" font-size="15">(2+x_B+x_C)/3=0</text><text x="480" y="208" font-size="15">x_B+x_C=−2</text><text x="480" y="244" font-size="15">(4+y_B+y_C)/3=0</text><text x="480" y="272" font-size="15">y_B+y_C=−4</text><line x1="480" y1="290" x2="790" y2="290" stroke="#cbd5e1"/><text x="480" y="326" font-size="15">G_OBC=(−2/3,−4/3)</text><text x="480" y="356" font-size="17" font-weight="700" fill="#b91c1c">a+b=−2</text></g></svg>
