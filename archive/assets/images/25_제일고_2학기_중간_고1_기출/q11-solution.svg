<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 360" width="840" height="360" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_1" data-geometry-preset="GEOMETRY_STANDARD" data-axis-scale-mode="EQUAL_UNIT" data-fact-hash="29a831b5560d3a761e3310a2f9748b80bfa42f76c40a8e57391c4408f8d6edec" data-geometry-fact-hash="29a831b5560d3a761e3310a2f9748b80bfa42f76c40a8e57391c4408f8d6edec" data-visual-provenance="deterministic-independent-facts">
  <title id="title">두 삼각형의 무게중심 좌표</title>
  <desc id="desc">A(2,4)와 원점 O, ABC의 무게중심이 O라는 조건에서 OBC의 무게중심이 (-2/3,-4/3)임을 좌표별 평균으로 표시한 해설 도형</desc>
  <style>
    .title{font:700 18px "Noto Sans KR","Malgun Gothic",sans-serif;fill:#111827}.note{font:12px "Noto Sans KR","Malgun Gothic",sans-serif;fill:#334155}.label{font:700 13px "STIX Two Math","Malgun Gothic",serif}.axis{font:italic 14px "STIX Two Math","Malgun Gothic",serif;fill:#111827}
  </style>
  <rect width="840" height="360" fill="#fff"/><text x="28" y="32" class="title">무게중심 조건을 좌표별로 계산</text><text x="28" y="54" class="note">A(2,4)와 ABC의 무게중심 O에서 B, C의 좌표합을 확인한다.</text>
  <rect x="24" y="72" width="400" height="240" rx="12" fill="#fff" stroke="#cbd5e1"/>
  <g stroke="#e5e7eb" stroke-width="0.8"><line x1="64" y1="72" x2="64" y2="292"/><line x1="104" y1="72" x2="104" y2="292"/><line x1="144" y1="72" x2="144" y2="292"/><line x1="184" y1="72" x2="184" y2="292"/><line x1="224" y1="72" x2="224" y2="292"/><line x1="264" y1="72" x2="264" y2="292"/><line x1="304" y1="72" x2="304" y2="292"/><line x1="344" y1="72" x2="344" y2="292"/><line x1="384" y1="72" x2="384" y2="292"/><line x1="64" y1="72" x2="384" y2="72"/><line x1="64" y1="112" x2="384" y2="112"/><line x1="64" y1="152" x2="384" y2="152"/><line x1="64" y1="192" x2="384" y2="192"/><line x1="64" y1="232" x2="384" y2="232"/><line x1="64" y1="272" x2="384" y2="272"/></g>
  <line data-geometry="axis-x" x1="64" y1="192" x2="384" y2="192" stroke="#111827" stroke-width="1.4"/><line data-geometry="axis-y" x1="224" y1="72" x2="224" y2="292" stroke="#111827" stroke-width="1.4"/><text x="372" y="184" class="axis">x</text><text x="232" y="86" class="axis">y</text>
  <circle data-point-label="O(0,0)" data-point-x="0" data-point-y="0" cx="224" cy="192" r="5" fill="#f59e0b"/><circle data-point-label="A(2,4)" data-point-x="2" data-point-y="4" cx="304" cy="112" r="5" fill="#2563eb"/>
  <text x="232" y="210" class="label" fill="#b45309">O(0,0)</text><text x="312" y="106" class="label" fill="#1d4ed8">A(2,4)</text>
  <rect x="448" y="72" width="368" height="240" rx="12" fill="#f8fafc" stroke="#dbe3ef"/><text x="468" y="102" class="title" style="font-size:15px">좌표별 평균</text><text x="468" y="134" class="note">ABC의 무게중심 = O</text><text x="468" y="160" class="note">(2+x_B+x_C)/3=0</text><text x="468" y="184" class="note">x_B+x_C=−2</text><text x="468" y="212" class="note">(4+y_B+y_C)/3=0</text><text x="468" y="236" class="note">y_B+y_C=−4</text><line x1="468" y1="252" x2="796" y2="252" stroke="#cbd5e1"/><text x="468" y="278" class="note">G_OBC=(−2/3,−4/3)</text><text x="468" y="300" class="note">a+b=−2</text>
</svg>
