<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" role="img" aria-labelledby="title desc" width="760" height="320"><title id="title">문항 6 해설: 교집합 최소 Venn diagram</title><desc id="desc">전체 30, A 20, B 15를 가능한 한 덜 겹치게 놓아 교집합 최소를 설명한 그림</desc><style>text{font-family:"Noto Sans KR",Arial,sans-serif;fill:#172033}.m{fill:#56657a}</style><rect width="760" height="320" rx="18" fill="#f8fafc"/><text x="28" y="38" font-size="22" font-weight="700">전체가 30개라서 생기는 최소 겹침</text><rect x="28" y="78" width="430" height="180" rx="14" fill="#fff" stroke="#cbd5e1"/><circle cx="220" cy="168" r="68" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><circle cx="300" cy="168" r="68" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text x="170" y="128" font-size="17">A 20</text><text x="318" y="128" font-size="17">B 15</text><text x="180" y="180" text-anchor="middle" font-size="18">20−y</text><text x="260" y="180" text-anchor="middle" font-size="22" fill="#7c3aed">y</text><text x="350" y="180" text-anchor="middle" font-size="18">15−y</text><text x="52" y="236" font-size="16">y≥20+15−30</text><rect x="490" y="90" width="238" height="132" rx="14" fill="#fff" stroke="#cbd5e1"/><text x="514" y="126" font-size="17">y 작을수록</text><text x="514" y="162" font-size="17">Aᶜ∪Bᶜ 커짐</text><text x="514" y="198" font-size="17">교집합 최소를 선택</text><text x="28" y="294" class="m" font-size="14">두 집합을 덜 겹치게 놓는다는 말이 y의 최소와 연결된다.</text></svg>
