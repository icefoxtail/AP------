<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 450" width="820" height="450" role="img" aria-labelledby="t d"><title id="t">좌우 대칭 색칠의 독립 선택</title><desc id="d">축 위 삼각형 네 개는 각자 색을 고르고 좌우 대응 삼각형 두 쌍은 한 색을 공유하므로 대칭 색칠은 2의 6제곱이다.</desc><rect width="820" height="450" fill="#fff"/><text x="38" y="42" font-size="24" font-weight="700" fill="#0f172a">대칭일 때 독립적으로 색을 정하는 단위</text><rect x="38" y="78" width="300" height="290" rx="14" fill="#f8fafc" stroke="#cbd5e1"/><text x="62" y="112" font-size="18" font-weight="700">대칭축 위: 4개</text><rect x="62" y="136" width="242" height="34" rx="8" fill="#e0f2fe"/><text x="78" y="159" font-size="15">삼각형 1: 빨강 또는 파랑</text><rect x="62" y="184" width="242" height="34" rx="8" fill="#e0f2fe"/><text x="78" y="207" font-size="15">삼각형 2: 빨강 또는 파랑</text><rect x="62" y="232" width="242" height="34" rx="8" fill="#e0f2fe"/><text x="78" y="255" font-size="15">삼각형 3: 빨강 또는 파랑</text><rect x="62" y="280" width="242" height="34" rx="8" fill="#e0f2fe"/><text x="78" y="303" font-size="15">삼각형 4: 빨강 또는 파랑</text><rect x="368" y="78" width="280" height="290" rx="14" fill="#f8fafc" stroke="#cbd5e1"/><text x="392" y="112" font-size="18" font-weight="700">좌우 대응: 2쌍</text><rect x="392" y="140" width="232" height="72" rx="10" fill="#ede9fe"/><text x="410" y="169" font-size="16">왼쪽 쌍 1 = 오른쪽 쌍 1</text><text x="410" y="194" font-size="14">한 색 선택: 2가지</text><rect x="392" y="230" width="232" height="72" rx="10" fill="#ede9fe"/><text x="410" y="259" font-size="16">왼쪽 쌍 2 = 오른쪽 쌍 2</text><text x="410" y="284" font-size="14">한 색 선택: 2가지</text><text x="688" y="145" font-size="16" fill="#334155">4+2=6</text><text x="688" y="190" font-size="24" font-weight="700" fill="#1d4ed8">2⁶=64</text><text x="688" y="255" font-size="15" fill="#334155">전체 2⁸=256</text><text x="688" y="290" font-size="15" fill="#334155">256−64</text><text x="688" y="328" font-size="25" font-weight="700" fill="#b91c1c">=192</text><text x="38" y="414" font-size="14" fill="#475569">좌우 대칭 색칠은 각 대응쌍의 두 칸에 같은 색을 쓰는 경우만 센다.</text></svg>