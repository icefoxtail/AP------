<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470" width="820" height="470" role="img" aria-labelledby="t d"><title id="t">홀수 자리 패턴과 회전 나눗셈</title><desc id="d">육각형에서 서로 이웃하지 않는 홀수 자리 배치는 2개일 때 9가지, 3개일 때 2가지이며 모든 배치를 여섯 회전으로 나눈다.</desc><rect width="820" height="470" fill="#fff"/><text x="38" y="42" font-size="24" font-weight="700" fill="#0f172a">홀수는 서로 이웃할 수 없다</text><text x="38" y="70" font-size="15" fill="#334155">홀수 O가 이웃하면 두 수의 곱이 홀수가 된다. E는 짝수 자리이다.</text><text x="100" y="116" font-size="17" font-weight="700">홀수 2개 자리: 9가지</text><polygon points="200,137 284.870489570875,186 284.870489570875,284 200,333 115.129510429125,284 115.12951042912502,186" fill="none" stroke="#64748b" stroke-width="3"/><circle cx="200" cy="137" r="17" fill="#fecaca" stroke="#b91c1c" stroke-width="2"/><text x="200" y="142" text-anchor="middle" font-size="14" font-weight="700">O</text><circle cx="284.870489570875" cy="186" r="17" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/><text x="284.870489570875" y="191" text-anchor="middle" font-size="14" font-weight="700">E</text><circle cx="284.870489570875" cy="284" r="17" fill="#fecaca" stroke="#b91c1c" stroke-width="2"/><text x="284.870489570875" y="289" text-anchor="middle" font-size="14" font-weight="700">O</text><circle cx="200" cy="333" r="17" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/><text x="200" y="338" text-anchor="middle" font-size="14" font-weight="700">E</text><circle cx="115.129510429125" cy="284" r="17" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/><text x="115.129510429125" y="289" text-anchor="middle" font-size="14" font-weight="700">E</text><circle cx="115.12951042912502" cy="186" r="17" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/><text x="115.12951042912502" y="191" text-anchor="middle" font-size="14" font-weight="700">E</text><text x="416" y="116" font-size="17" font-weight="700">홀수 3개 자리: 2가지</text><polygon points="520,137 604.870489570875,186 604.870489570875,284 520,333 435.129510429125,284 435.12951042912505,186" fill="none" stroke="#64748b" stroke-width="3"/><circle cx="520" cy="137" r="17" fill="#fecaca" stroke="#b91c1c" stroke-width="2"/><text x="520" y="142" text-anchor="middle" font-size="14" font-weight="700">O</text><circle cx="604.870489570875" cy="186" r="17" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/><text x="604.870489570875" y="191" text-anchor="middle" font-size="14" font-weight="700">E</text><circle cx="604.870489570875" cy="284" r="17" fill="#fecaca" stroke="#b91c1c" stroke-width="2"/><text x="604.870489570875" y="289" text-anchor="middle" font-size="14" font-weight="700">O</text><circle cx="520" cy="333" r="17" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/><text x="520" y="338" text-anchor="middle" font-size="14" font-weight="700">E</text><circle cx="435.129510429125" cy="284" r="17" fill="#fecaca" stroke="#b91c1c" stroke-width="2"/><text x="435.129510429125" y="289" text-anchor="middle" font-size="14" font-weight="700">O</text><circle cx="435.12951042912505" cy="186" r="17" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/><text x="435.12951042912505" y="191" text-anchor="middle" font-size="14" font-weight="700">E</text><rect x="38" y="382" width="744" height="56" rx="10" fill="#f8fafc" stroke="#cbd5e1"/><text x="58" y="408" font-size="15">2개: 9·P(4,2)·P(4,4)=2592</text><text x="58" y="429" font-size="15">3개: 2·P(4,3)·P(4,3)=1152</text><text x="470" y="416" font-size="17" font-weight="700" fill="#1d4ed8">(2592+1152)÷6=624</text></svg>