<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="640" viewBox="0 0 1040 640" role="img" aria-labelledby="title desc">
<title id="title">아르벨로스의 넓이와 CG를 지름으로 하는 원의 넓이</title>
<desc id="desc">AC=m, CB=n인 반원 두 개를 큰 반원에서 뺀 색칠 부분과, 지름 CG=2r인 원을 나란히 비교한다. 삼각형 AGB의 높이 정리로 CG 제곱은 AC 곱하기 CB이다.</desc>
<rect width="1040" height="640" fill="#ffffff"/>
<text x="36" y="48" font-size="25" font-family="sans-serif" fill="#111827">큰 반원에서 작은 두 반원을 뺀 넓이</text>
<text x="70" y="94" font-size="17" font-family="sans-serif" fill="#475569">AC=m, CB=n, CG=2r</text>
<!-- General off-center arbelos: AB=460, AC=170, CB=290, CG=sqrt(170*290). -->
<path d="M80 430 A230 230 0 0 1 540 430 L80 430 Z" fill="#dbeafe" stroke="#1f2937" stroke-width="3"/>
<path d="M80 430 A85 85 0 0 1 250 430 L80 430 Z" fill="#ffffff" stroke="#1f2937" stroke-width="2.5"/>
<path d="M250 430 A145 145 0 0 1 540 430 L250 430 Z" fill="#ffffff" stroke="#1f2937" stroke-width="2.5"/>
<line x1="250" y1="430" x2="250" y2="208" stroke="#64748b" stroke-width="2.5" stroke-dasharray="8 6"/>
<circle cx="250" cy="208" r="4" fill="#111827"/>
<text x="62" y="462" font-size="19" font-family="sans-serif" fill="#111827">A</text>
<text x="241" y="462" font-size="19" font-family="sans-serif" fill="#111827">C</text>
<text x="544" y="462" font-size="19" font-family="sans-serif" fill="#111827">B</text>
<text x="240" y="193" font-size="19" font-family="sans-serif" fill="#111827">G</text>
<text x="112" y="412" font-size="16" font-family="sans-serif" fill="#334155">m</text>
<text x="390" y="412" font-size="16" font-family="sans-serif" fill="#334155">n</text>
<text x="210" y="326" font-size="16" font-family="sans-serif" fill="#334155">2r</text>
<text x="120" y="510" font-size="20" font-family="sans-serif" fill="#1e3a8a">색칠한 아르벨로스</text>
<text x="584" y="300" font-size="38" font-family="sans-serif" fill="#64748b">=</text>
<circle cx="790" cy="330" r="111" fill="#dbeafe" stroke="#dc2626" stroke-width="3"/>
<line x1="790" y1="219" x2="790" y2="441" stroke="#64748b" stroke-width="2.5" stroke-dasharray="8 6"/>
<text x="800" y="275" font-size="17" font-family="sans-serif" fill="#334155">CG=2r</text>
<text x="735" y="480" font-size="19" font-family="sans-serif" fill="#1e3a8a">넓이 πr²</text>
<rect x="42" y="540" width="956" height="76" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="66" y="572" font-size="18" font-family="sans-serif" fill="#111827">CG²=AC·CB</text>
<text x="300" y="572" font-size="18" font-family="sans-serif" fill="#111827">A(색칠)=π/8[(m+n)²−m²−n²]</text>
<text x="720" y="572" font-size="18" font-family="sans-serif" fill="#111827">=π/4·CG²=πr²</text>
</svg>


