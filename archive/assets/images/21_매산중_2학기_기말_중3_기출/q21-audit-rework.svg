<svg xmlns="http://www.w3.org/2000/svg" width="776" height="278.4" viewBox="0 0 485 174" role="img" aria-labelledby="title desc"><title id="title">매산중 서답형 1의 원주각과 반원 넓이</title><desc id="desc">위쪽은 AB가 지름인 원에서 A의 각이 40도이고 C는 원주 위에 있다. 아래쪽은 지름 AB인 큰 반원, 지름 AC와 CB인 두 작은 반원, C에서 큰 반원 호로 수직인 CG, 그리고 지름 CG인 원 O를 나타낸다. 두 작은 반원을 제외한 큰 반원의 영역을 색으로 표시했다.</desc><rect width="485" height="174" fill="#fff" />
