<svg xmlns="http://www.w3.org/2000/svg" width="900" height="640" viewBox="0 0 900 640" role="img" aria-labelledby="title desc">
<title id="title">외심의 수선과 평행사변형 AGCH</title>
<desc id="desc">BC is horizontal. O is the circumcenter, D is the foot of OD on BC with OD=2 cm, H is the antipode of B, and G is the orthocenter from altitudes AE and CF. Coordinates verify AG parallel CH and AH parallel CG.</desc>
<rect width="900" height="640" fill="#ffffff"/>
<text x="34" y="44" font-size="24" font-family="sans-serif" fill="#111827">중점 연결과 평행사변형</text>
<!-- Computed model: circumradius 5, BC at y=-2; A=(5 cos 110°,5 sin 110°); H is antipode of B. -->
<circle cx="450" cy="280" r="190" fill="#f8fafc" stroke="#94a3b8" stroke-width="2.5"/>
<!-- Triangle ABC and its two altitudes -->
<line x1="276" y1="356" x2="624" y2="356" stroke="#1f2937" stroke-width="3"/>
<line x1="385" y1="102" x2="276" y2="356" stroke="#64748b" stroke-width="2.5"/>
<line x1="385" y1="102" x2="624" y2="356" stroke="#64748b" stroke-width="2.5"/>
<line x1="385" y1="102" x2="385" y2="356" stroke="#475569" stroke-width="2" stroke-dasharray="7 5"/>
<line x1="624" y1="356" x2="330" y2="230" stroke="#475569" stroke-width="2" stroke-dasharray="7 5"/>
<!-- Diameter BH and perpendicular from O to chord BC -->
<line x1="276" y1="356" x2="624" y2="204" stroke="#7c3aed" stroke-width="2.5" stroke-dasharray="8 5"/>
<line x1="450" y1="280" x2="450" y2="356" stroke="#dc2626" stroke-width="3"/>
<!-- Parallelogram AGCH; actual opposite-side slopes are equal. -->
<path d="M385 102 L385 254 L624 356 L624 204 Z" fill="#22c55e" fill-opacity="0.10" stroke="#16a34a" stroke-width="4"/>
<!-- Right-angle markers at E and C -->
<path d="M385 344 L397 344 L397 356" fill="none" stroke="#0f172a" stroke-width="2"/>
<path d="M612 356 L612 344 L624 344" fill="none" stroke="#0f172a" stroke-width="2"/>
<!-- Points -->
<g fill="#111827">
<circle cx="385" cy="102" r="5.5"/><circle cx="276" cy="356" r="5.5"/><circle cx="624" cy="356" r="5.5"/>
<circle cx="450" cy="356" r="4.5"/><circle cx="385" cy="356" r="4.5"/><circle cx="330" cy="230" r="4.5"/>
<circle cx="385" cy="254" r="5.5"/><circle cx="624" cy="204" r="5.5"/><circle cx="450" cy="280" r="5.5"/>
</g>
<g font-family="sans-serif" font-size="17" fill="#111827">
<text x="375" y="96">A</text><text x="254" y="380">B</text><text x="630" y="380">C</text>
<text x="441" y="380">D</text><text x="376" y="380">E</text><text x="314" y="226">F</text>
<text x="371" y="250">G</text><text x="634" y="201">H</text><text x="460" y="258">O</text>
</g>
<text x="416" y="330" font-size="16" font-family="sans-serif" fill="#b91c1c">2 cm</text>
<text x="638" y="300" font-size="16" font-family="sans-serif" fill="#15803d">4 cm</text>
<rect x="40" y="500" width="820" height="105" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="62" y="540" font-size="18" font-family="sans-serif" fill="#166534">AG ∥ CH, AH ∥ CG  →  AGCH는 평행사변형</text>
<text x="62" y="578" font-size="18" font-family="sans-serif" fill="#111827">HC=2·OD=4 cm,  OD:HC=1:2,  AG=HC=4 cm</text>
</svg>


