<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" role="img" aria-labelledby="title desc" width="760" height="320"><title id="title">문항 10 해설: 포함관계와 여집합</title><desc id="desc">B가 A 안에 들어가고 여집합의 포함 방향이 뒤집히는 Venn diagram</desc><style>text{font-family:"Noto Sans KR",Arial,sans-serif;fill:#172033}.m{fill:#56657a}</style><rect width="760" height="320" rx="18" fill="#f8fafc"/><text x="28" y="38" font-size="22" font-weight="700">B⊆A이면 여집합의 방향은 반대</text><text x="28" y="66" class="m" font-size="15">A∩B=B를 영역과 포함관계로 번역한다.</text><rect x="28" y="78" width="430" height="180" rx="14" fill="#fff" stroke="#cbd5e1"/><ellipse cx="243" cy="168" rx="135" ry="62" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><ellipse cx="243" cy="168" rx="78" ry="42" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text x="350" y="128" font-size="20" fill="#1d4ed8">A</text><text x="243" y="174" text-anchor="middle" font-size="20" fill="#15803d">B</text><text x="58" y="236" font-size="16" fill="#1d4ed8">B⊆A</text><rect x="490" y="90" width="238" height="132" rx="14" fill="#fff" stroke="#cbd5e1"/><text x="514" y="126" font-size="17">A∪B=A</text><text x="514" y="162" font-size="17" fill="#7c3aed">Aᶜ⊆Bᶜ</text><text x="514" y="198" font-size="17" fill="#b91c1c">A=B이면 A∩Bᶜ=∅</text><text x="28" y="294" class="m" font-size="14">‘항상’은 A=B인 경계 경우도 확인해야 함을 잊지 않는다.</text></svg>
