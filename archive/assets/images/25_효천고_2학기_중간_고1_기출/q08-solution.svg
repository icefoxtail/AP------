<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" role="img" aria-labelledby="title desc" data-scale-policy="SCHEMATIC_ALLOWED">
<title id="title">점과 직선 사이의 거리 공식 유도</title>
<desc id="desc">점 P에서 직선 l에 내린 수선의 발 H와 좌표 차 x2-x1=ak, y2-y1=bk를 이용해 거리 공식의 절댓값을 연결한 해설 도형</desc>
<style>.head{font:700 18px Arial,"Noto Sans KR","Malgun Gothic",sans-serif;fill:#111827}.txt{font:14px Arial,"Noto Sans KR","Malgun Gothic",sans-serif;fill:#334155}.math{font:italic 16px "Cambria Math","STIX Two Math",serif;fill:#111827}.label{font:600 14px Arial,"Noto Sans KR","Malgun Gothic",sans-serif;fill:#111827}</style>
<rect width="800" height="400" fill="#fff"/>
<text x="28" y="32" class="head">수선의 발 H를 좌표로 나타내면 거리 공식이 연결된다</text>
<rect x="28" y="55" width="430" height="310" rx="10" fill="#fff" stroke="#cbd5e1"/>
<line x1="70" y1="295" x2="410" y2="105" stroke="#374151" stroke-width="2.4"/>
<text x="365" y="92" class="math">ℓ: ax+by+c=0</text>
<circle cx="315" cy="105" r="5" fill="#111827"/><text x="327" y="104" class="label">P(x₁,y₁)</text>
<circle cx="337.607" cy="145.455" r="5" fill="#111827"/><text x="347" y="163" class="label">H(x₂,y₂)</text>
<line x1="315" y1="105" x2="337.607" y2="145.455" stroke="#111827" stroke-width="2.2"/>
<path d="M327.132 151.309 L321.278 140.833 L331.753 134.980" fill="none" stroke="#111827" stroke-width="1.4"/>
<line x1="337.607" y1="145.455" x2="315" y2="145.455" stroke="#64748b" stroke-width="1.2" stroke-dasharray="5 4"/>
<line x1="315" y1="145.455" x2="315" y2="105" stroke="#64748b" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="270" y="166" class="math">x₂−x₁=ak</text>
<text x="326" y="129" class="math">y₂−y₁=bk</text>
<text x="85" y="330" class="txt">PH ⟂ l  →  기울기의 곱은 −1</text>
<rect x="480" y="55" width="292" height="310" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="500" y="88" class="head">식의 흐름</text>
<text x="500" y="125" class="math">PH = √[(ak)²+(bk)²]</text>
<text x="500" y="155" class="math">= |k|√(a²+b²)</text>
<text x="500" y="205" class="math">k = −(ax₁+by₁+c)/(a²+b²)</text>
<text x="500" y="255" class="txt">따라서 분자에는</text>
<text x="500" y="285" class="math">|ax₁+by₁+c|</text>
<text x="500" y="330" class="txt">가 들어간다.</text>
</svg>