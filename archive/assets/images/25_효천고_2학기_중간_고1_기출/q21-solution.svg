<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 550" width="1000" height="550" preserveAspectRatio="xMidYMid meet" role="img" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-axis-scale-mode="EQUAL_UNIT">
<title>직선 AB 위의 두 위치</title>
<desc>AC 대 BC의 비 2대3을 만족하는 두 점을 A와 B 사이의 C1, AB 밖의 C2로 나누어 점의 순서와 좌표를 함께 나타낸다.</desc>
<style>.axis{font:italic 14px serif;fill:#111827}.label{font:600 12px "Malgun Gothic",sans-serif}.note{font:12px "Malgun Gothic",sans-serif;fill:#334155}.head{font:700 17px "Malgun Gothic",sans-serif;fill:#0f172a}.small{font:11px "Malgun Gothic",sans-serif;fill:#475569}</style>
<rect width="1000" height="550" fill="#fff"/>
<text x="28" y="32" class="head">직선 위 점의 위치와 거리의 비</text>
<text x="28" y="54" class="note">AC:BC=2:3이므로 점의 순서를 두 경우로 나누어 확인한다.</text>
<rect x="28" y="72" width="430" height="430" rx="12" fill="#fff" stroke="#cbd5e1"/>
<text x="50" y="104" class="head">Panel A · 위치관계</text>
<text x="50" y="132" class="note">경우 1 · C가 A와 B 사이</text>
<line x1="70" y1="180" x2="400" y2="180" stroke="#334155" stroke-width="3"/>
<circle cx="110" cy="180" r="6" fill="#111827"/><circle cx="210" cy="180" r="6" fill="#dc2626"/><circle cx="360" cy="180" r="6" fill="#111827"/>
<text x="102" y="164" class="label">A</text><text x="198" y="164" class="label" fill="#b91c1c">C₁</text><text x="352" y="164" class="label">B</text>
<line x1="110" y1="224" x2="210" y2="224" stroke="#16a34a" stroke-width="5"/><line x1="210" y1="224" x2="360" y2="224" stroke="#f59e0b" stroke-width="5"/>
<text x="95" y="210" class="note">A-C₁-B · AC₁:C₁B=2:3</text>
<text x="50" y="274" class="note">경우 2 · C가 AB 밖</text>
<line x1="50" y1="322" x2="400" y2="322" stroke="#334155" stroke-width="3"/>
<circle cx="60" cy="322" r="6" fill="#dc2626"/><circle cx="260" cy="322" r="6" fill="#111827"/><circle cx="360" cy="322" r="6" fill="#111827"/>
<text x="48" y="306" class="label" fill="#b91c1c">C₂</text><text x="252" y="306" class="label">A</text><text x="352" y="306" class="label">B</text>
<text x="50" y="356" class="note">C₂-A-B · AC₂=2AB</text>
<text x="50" y="384" class="note">AB=d, AC₂=x, BC₂=x+d</text>
<text x="50" y="412" class="note">2(x+d)=3x → x=2d</text>
<rect x="480" y="72" width="492" height="430" rx="12" fill="#fff" stroke="#cbd5e1"/>
<text x="502" y="104" class="head">Panel B · 좌표평면</text>
<g id="coord-plane" data-origin-x="850" data-origin-y="200" data-sx="8" data-sy="8">
<line x1="510" y1="200" x2="950" y2="200" stroke="#111827" stroke-width="1.4"/>
<line x1="850" y1="116" x2="850" y2="492" stroke="#111827" stroke-width="1.4"/>
<text x="940" y="192" class="axis">x</text><text x="858" y="130" class="axis">y</text>
<line data-geometry="line" data-equation="3x-2y+12=0" x1="626" y1="488" x2="866" y2="128" stroke="#2563eb" stroke-width="3"/>
<circle data-point-label="C₂" data-point-x="-28" data-point-y="-36" cx="626" cy="488" r="6" fill="#dc2626"/><text x="634" y="476" class="label" fill="#b91c1c">C₂(-28,-36)</text>
<circle data-point-label="A" data-point-x="-8" data-point-y="-6" cx="786" cy="248" r="6" fill="#111827"/><text x="794" y="242" class="label">A(-8,-6)</text>
<circle data-point-label="C₁" data-point-x="-4" data-point-y="0" cx="818" cy="200" r="6" fill="#dc2626"/><text x="826" y="194" class="label" fill="#b91c1c">C₁(-4,0)</text>
<circle data-point-label="B" data-point-x="2" data-point-y="9" cx="866" cy="128" r="6" fill="#111827"/><text x="874" y="145" class="label">B(2,9)</text>
</g>
<text x="512" y="330" class="note" fill="#1d4ed8">A→B: (+10,+15)</text>
<text x="512" y="358" class="note" fill="#b91c1c">A→C₂: (-20,-30)</text>
<text x="512" y="404" class="small">동일 축척 sx=sy=8</text>
<text x="512" y="426" class="small">네 점은 같은 직선 AB 위</text>
<text x="512" y="448" class="small">C₁=(-4,0), C₂=(-28,-36)</text>
</svg>
