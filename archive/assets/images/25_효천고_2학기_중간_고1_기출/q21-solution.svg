<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 550" width="1000" height="550" preserveAspectRatio="xMidYMid meet" role="img" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-axis-scale-mode="EQUAL_UNIT"><title>직선 AB 위의 두 위치</title><desc>AC 대 BC의 비 2대3을 만족하는 두 점을 A와 B 사이의 C1, AB 밖의 C2로 나누어 점의 순서와 좌표를 함께 나타낸다.</desc><style>.axis{font:italic 14px serif;fill:#111827}.label{font:600 12px "Malgun Gothic",sans-serif}.note{font:12px "Malgun Gothic",sans-serif;fill:#334155}.head{font:700 17px "Malgun Gothic",sans-serif;fill:#0f172a}.small{font:11px "Malgun Gothic",sans-serif;fill:#475569}</style><rect width="1000" height="550" fill="#fff"/><text x="28" y="32" class="head">직선 위 점의 위치와 거리의 비</text><text x="28" y="54" class="note">AC:BC=2:3이므로 점의 순서를 두 경우로 나누어 확인한다.</text><rect x="28" y="72" width="430" height="430" rx="12" fill="#fff" stroke="#cbd5e1"/><text x="50" y="104" class="head">Panel A · 위치관계</text><text x="50" y="132" class="note">경우 1 · C가 A와 B 사이</text><line x1="78" y1="180" x2="408" y2="180" stroke="#334155" stroke-width="3"/><circle cx="128" cy="180" r="6" fill="#111827"/><circle cx="238" cy="180" r="6" fill="#dc2626"/><circle cx="388" cy="180" r="6" fill="#111827"/><text x="112" y="164" class="label">A</text><text x="224" y="164" class="label" fill="#b91c1c">C₁</text><text x="380" y="164" class="label">B</text><text x="112" y="210" class="note">A-C₁-B · AC₁:C₁B=2:3</text><line x1="128" y1="224" x2="238" y2="224" stroke="#16a34a" stroke-width="5"/><line x1="238" y1="224" x2="388" y2="224" stroke="#f59e0b" stroke-width="5"/><text x="50" y="274" class="note">경우 2 · C가 AB 밖</text><line x1="78" y1="322" x2="408" y2="322" stroke="#334155" stroke-width="3"/><circle cx="98" cy="322" r="6" fill="#dc2626"/><circle cx="238" cy="322" r="6" fill="#111827"/><circle cx="388" cy="322" r="6" fill="#111827"/><text x="78" y="306" class="label" fill="#b91c1c">C₂</text><text x="224" y="306" class="label">A</text><text x="380" y="306" class="label">B</text><text x="50" y="356" class="note">C₂-A-B</text><text x="50" y="384" class="note">AB=d, AC₂=x</text><text x="50" y="412" class="note">BC₂=x+d</text><text x="50" y="440" class="note">2(x+d)=3x → x=2d</text><rect x="480" y="72" width="492" height="430" rx="12" fill="#fff" stroke="#cbd5e1"/><text x="502" y="104" class="head">Panel B · 좌표평면</text><g stroke="#e5e7eb" stroke-width="1"><line x1="522" y1="140" x2="952" y2="140"/><line x1="522" y1="190" x2="952" y2="190"/><line x1="522" y1="240" x2="952" y2="240"/><line x1="522" y1="290" x2="952" y2="290"/><line x1="522" y1="340" x2="952" y2="340"/><line x1="522" y1="390" x2="952" y2="390"/><line x1="522" y1="440" x2="952" y2="440"/><line x1="522" y1="120" x2="522" y2="460"/><line x1="572" y1="120" x2="572" y2="460"/><line x1="622" y1="120" x2="622" y2="460"/><line x1="672" y1="120" x2="672" y2="460"/><line x1="722" y1="120" x2="722" y2="460"/><line x1="772" y1="120" x2="772" y2="460"/><line x1="822" y1="120" x2="822" y2="460"/><line x1="872" y1="120" x2="872" y2="460"/><line x1="922" y1="120" x2="922" y2="460"/></g><line x1="522" y1="390" x2="952" y2="390" stroke="#111827" stroke-width="1.4"/><line x1="833" y1="120" x2="833" y2="460" stroke="#111827" stroke-width="1.4"/><line data-geometry="line" data-equation="AB" x1="522" y1="319.2" x2="922" y2="117.3" stroke="#2563eb" stroke-width="3"/><line x1="522" y1="319.2" x2="922" y2="117.3" stroke="#2563eb" stroke-width="1" stroke-dasharray="5 5"/><circle data-point-label="C₂" data-point-x="-28" data-point-y="-36" cx="522" cy="319.2" r="6" fill="#dc2626"/><text x="530" y="312" class="label" fill="#b91c1c">C₂(-28,-36)</text><circle data-point-label="A" data-point-x="-8" data-point-y="-6" cx="788.6" cy="203.8" r="6" fill="#111827"/><text x="796" y="198" class="label">A(-8,-6)</text><circle data-point-label="C₁" data-point-x="-4" data-point-y="0" cx="833" cy="169.2" r="6" fill="#dc2626"/><text x="841" y="164" class="label" fill="#b91c1c">C₁(-4,0)</text><circle data-point-label="B" data-point-x="2" data-point-y="9" cx="922" cy="117.3" r="6" fill="#111827"/><text x="830" y="136" class="label">B(2,9)</text><text x="532" y="350" class="note" fill="#1d4ed8">A→B: (+10,+15)</text><text x="532" y="378" class="note" fill="#b91c1c">A→C₂: (-20,-30)</text><text x="532" y="430" class="small">네 점은 같은 직선 AB 위</text><text x="532" y="452" class="small">C₁=(-4,0), C₂=(-28,-36)</text></svg>
