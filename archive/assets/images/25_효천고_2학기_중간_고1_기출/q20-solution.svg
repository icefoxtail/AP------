<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" role="img" aria-labelledby="title desc" width="760" height="320"><title id="title">문항 20 해설: 두 집합의 수치 영역</title><desc id="desc">전체 150, A 62, B 96, 바깥 18에서 교집합을 미지수로 둔 Venn diagram</desc><style>text{font-family:"Noto Sans KR",Arial,sans-serif;fill:#172033}.m{fill:#56657a}</style><rect width="760" height="320" rx="18" fill="#f8fafc"/><text x="28" y="38" font-size="22" font-weight="700">바깥 영역에서 합집합으로</text><text x="28" y="66" class="m" font-size="15">Aᶜ∩Bᶜ는 바깥 영역이므로 합집합을 먼저 구한다.</text><rect x="28" y="78" width="430" height="180" rx="14" fill="#fff" stroke="#cbd5e1"/><circle cx="220" cy="168" r="68" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><circle cx="300" cy="168" r="68" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text x="166" y="128" font-size="17">A 62</text><text x="318" y="128" font-size="17">B 96</text><text x="180" y="180" text-anchor="middle" font-size="18">62−x</text><text x="260" y="180" text-anchor="middle" font-size="22" fill="#7c3aed">x</text><text x="340" y="180" text-anchor="middle" font-size="18">96−x</text><text x="52" y="236" font-size="16" fill="#b91c1c">바깥 18</text><rect x="490" y="90" width="238" height="132" rx="14" fill="#fff" stroke="#cbd5e1"/><text x="514" y="126" font-size="17">n(A∪B)=150−18</text><text x="514" y="162" font-size="17">62+96−x=n(A∪B)</text><text x="514" y="198" font-size="17">x는 겹친 영역</text><text x="28" y="294" class="m" font-size="14">포함배제 원리는 합집합에서 공통 부분을 한 번 빼는 것이다.</text></svg>
