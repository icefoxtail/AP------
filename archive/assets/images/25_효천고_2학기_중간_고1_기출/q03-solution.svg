<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 260" width="520" height="260" role="img" aria-labelledby="title desc">
  <title id="title">중심이 (-1, 3)이고 반지름이 2인 원</title>
  <desc id="desc">원의 중심 C(-1, 3)과 반지름 2를 좌표평면에 나타낸 그림이다.</desc>
  <rect width="520" height="260" fill="#ffffff"/>
  <text x="18" y="27" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="22" font-weight="700" fill="#1e3a5f">(x+1)² + (y−3)² = 2²</text>
  <g stroke="#e5e7eb" stroke-width="1">
    <line x1="164" y1="38" x2="164" y2="220"/><line x1="228" y1="38" x2="228" y2="220"/><line x1="292" y1="38" x2="292" y2="220"/>
    <line x1="56" y1="60" x2="470" y2="60"/><line x1="56" y1="124" x2="470" y2="124"/><line x1="56" y1="188" x2="470" y2="188"/>
  </g>
  <g stroke="#111827" stroke-width="1.6">
    <line x1="48" y1="220" x2="478" y2="220"/><line x1="260" y1="232" x2="260" y2="32"/>
  </g>
  <path d="M478 220 l-8 -4 v8 z M260 32 l-4 8 h8 z" fill="#111827"/>
  <text x="483" y="225" font-family="Arial, sans-serif" font-size="17">x</text>
  <text x="265" y="30" font-family="Arial, sans-serif" font-size="17">y</text>
  <text x="254" y="240" font-family="Arial, sans-serif" font-size="16">0</text>
  <text x="216" y="240" font-family="Arial, sans-serif" font-size="16">−1</text>
  <text x="240" y="130" font-family="Arial, sans-serif" font-size="16">3</text>
  <circle cx="228" cy="124" r="64" fill="#dbeafe" fill-opacity="0.68" stroke="#2563eb" stroke-width="2.6"/>
  <line x1="228" y1="124" x2="292" y2="124" stroke="#dc2626" stroke-width="2" stroke-dasharray="5 4"/>
  <circle cx="228" cy="124" r="4.5" fill="#1d4ed8"/>
  <circle cx="292" cy="124" r="4" fill="#dc2626"/>
  <text x="174" y="109" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="21" font-weight="700" fill="#1d4ed8">C(−1, 3)</text>
  <text x="304" y="108" font-family="Arial, sans-serif" font-size="20" fill="#b91c1c">r = 2</text>
  <text x="301" y="149" font-family="Arial, sans-serif" font-size="17" fill="#b91c1c">(1, 3)</text>
</svg>
