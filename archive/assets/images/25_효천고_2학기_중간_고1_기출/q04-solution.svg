<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 280" width="520" height="280" role="img" aria-labelledby="title desc" data-scale-policy="SCHEMATIC_ALLOWED">
  <title id="title">원 x제곱 더하기 y제곱은 5의 두 접선과 y절편</title>
  <desc id="desc">중심이 원점이고 반지름이 루트 5인 원에 기울기 1인 두 직선이 접한다. 두 y절편 A, B의 거리는 2루트10이다.</desc>
  <rect width="520" height="280" fill="#ffffff"/>
  <text x="20" y="27" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="22" font-weight="700" fill="#1e3a5f">접선: y = x ± √10</text>
  <g stroke="#e5e7eb" stroke-width="1">
    <line x1="130" y1="30" x2="130" y2="260"/><line x1="260" y1="30" x2="260" y2="260"/><line x1="390" y1="30" x2="390" y2="260"/>
    <line x1="80" y1="41" x2="450" y2="41"/><line x1="80" y1="145" x2="450" y2="145"/><line x1="80" y1="249" x2="450" y2="249"/>
  </g>
  <line x1="80" y1="145" x2="450" y2="145" stroke="#111827" stroke-width="1.6"/>
  <line x1="260" y1="270" x2="260" y2="30" stroke="#111827" stroke-width="1.6"/>
  <path d="M450 145 l-8 -4 v8 z M260 30 l-4 8 h8 z" fill="#111827"/>
  <text x="455" y="150" font-family="Arial, sans-serif" font-size="17">x</text>
  <text x="265" y="30" font-family="Arial, sans-serif" font-size="17">y</text>
  <line x1="260" y1="62.8" x2="260" y2="227.2" stroke="#7c3aed" stroke-width="7" stroke-opacity="0.18"/>
  <circle cx="260" cy="145" r="58.14" fill="#dbeafe" fill-opacity="0.72" stroke="#2563eb" stroke-width="2.5"/>
  <line x1="130" y1="192.8" x2="307.8" y2="15" stroke="#059669" stroke-width="2.5"/>
  <line x1="212.2" y1="275" x2="390" y2="97.2" stroke="#059669" stroke-width="2.5"/>
  <line x1="260" y1="145" x2="218.9" y2="103.9" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="5 4"/>
  <line x1="260" y1="145" x2="301.1" y2="186.1" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="5 4"/>
  <circle cx="260" cy="145" r="4" fill="#1d4ed8"/>
  <circle cx="260" cy="62.8" r="4" fill="#7c3aed"/>
  <circle cx="260" cy="227.2" r="4" fill="#7c3aed"/>
  <circle cx="218.9" cy="103.9" r="3.5" fill="#059669"/>
  <circle cx="301.1" cy="186.1" r="3.5" fill="#059669"/>
  <text x="241" y="161" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#1d4ed8">O</text>
  <text x="272" y="59" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#6d28d9">A</text>
  <text x="272" y="245" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#6d28d9">B</text>
  <text x="199" y="132" font-family="Arial, sans-serif" font-size="18" fill="#b91c1c">r = √5</text>
  <text x="287" y="178" font-family="Arial, sans-serif" font-size="18" fill="#6d28d9">AB = 2√10</text>
</svg>
