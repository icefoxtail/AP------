<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" width="560" height="300" role="img" aria-labelledby="title desc" data-scale-policy="SCHEMATIC_ALLOWED">
  <title id="title">두 좌표축에 접하는 두 원과 중심 사이 거리</title>
  <desc id="desc">점 (-2, 3)을 지나는 두 원의 중심 C1, C2는 y=-x 위에 있고, 두 중심 사이 거리는 4루트6이다.</desc>
  <rect width="560" height="300" fill="#ffffff"/>
  <text x="18" y="28" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="22" font-weight="700" fill="#1e3a5f">유효한 중심: C = (−r, r)</text>
  <g stroke="#e5e7eb" stroke-width="1"><line x1="196" y1="30" x2="196" y2="270"/><line x1="252" y1="30" x2="252" y2="270"/><line x1="308" y1="30" x2="308" y2="270"/><line x1="364" y1="30" x2="364" y2="270"/><line x1="420" y1="30" x2="420" y2="270"/><line x1="168" y1="270" x2="440" y2="270"/><line x1="168" y1="214" x2="440" y2="214"/><line x1="168" y1="158" x2="440" y2="158"/><line x1="168" y1="102" x2="440" y2="102"/><line x1="168" y1="46" x2="440" y2="46"/></g>
  <circle cx="301.50" cy="151.50" r="118.50" fill="#dbeafe" fill-opacity="0.5" stroke="#2563eb" stroke-width="2.5"/>
  <circle cx="398.50" cy="248.50" r="21.50" fill="#fed7aa" fill-opacity="0.7" stroke="#d97706" stroke-width="2.5"/>
  <line x1="301.50" y1="151.50" x2="398.50" y2="248.50" stroke="#0f766e" stroke-width="2" stroke-dasharray="6 4"/>
  <line x1="155" y1="270" x2="450" y2="270" stroke="#111827" stroke-width="1.6"/><line x1="420" y1="282" x2="420" y2="28" stroke="#111827" stroke-width="1.6"/>
  <path d="M450 270 l-8 -4 v8 z M420 28 l-4 8 h8 z" fill="#111827"/>
  <text x="455" y="275" font-family="Arial, sans-serif" font-size="17">x</text><text x="425" y="28" font-family="Arial, sans-serif" font-size="17">y</text><text x="425" y="287" font-family="Arial, sans-serif" font-size="15">0</text>
  <circle cx="301.50" cy="151.50" r="4" fill="#1d4ed8"/><circle cx="398.50" cy="248.50" r="4" fill="#c2410c"/><circle cx="392" cy="228" r="4.5" fill="#dc2626"/>
  <text x="195" y="143" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#1d4ed8">C₁</text><text x="404" y="254" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#c2410c">C₂</text><text x="401" y="222" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#b91c1c">P(−2, 3)</text>
  <text x="247" y="215" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#0f766e">C₁C₂ = 4√6</text>
</svg>
