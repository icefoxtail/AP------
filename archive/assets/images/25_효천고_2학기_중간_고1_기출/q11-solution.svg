<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 300" width="620" height="300" role="img" aria-labelledby="title desc" data-scale-policy="SCHEMATIC_ALLOWED">
  <title id="title">원과 직선이 만나는 a의 양 끝값</title>
  <desc id="desc">중심 C(a, a)가 y=x 위를 움직일 때, 반지름 1/3인 원이 직선 x+y=3에 접하는 두 경계 위치를 나타낸 그림이다.</desc>
  <rect width="620" height="300" fill="#ffffff"/>
  <text x="18" y="28" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="22" font-weight="700" fill="#1e3a5f">C(a, a)는 y = x 위에서 움직인다</text>
  <g stroke="#e5e7eb" stroke-width="1"><line x1="160" y1="40" x2="160" y2="250"/><line x1="230" y1="40" x2="230" y2="250"/><line x1="300" y1="40" x2="300" y2="250"/><line x1="370" y1="40" x2="370" y2="250"/><line x1="160" y1="250" x2="440" y2="250"/><line x1="160" y1="180" x2="440" y2="180"/><line x1="160" y1="110" x2="440" y2="110"/><line x1="160" y1="40" x2="440" y2="40"/></g>
  <line x1="145" y1="250" x2="470" y2="250" stroke="#111827" stroke-width="1.6"/><line x1="160" y1="263" x2="160" y2="30" stroke="#111827" stroke-width="1.6"/>
  <path d="M470 250 l-8 -4 v8 z M160 30 l-4 8 h8 z" fill="#111827"/>
  <text x="475" y="255" font-family="Arial, sans-serif" font-size="17">x</text><text x="165" y="30" font-family="Arial, sans-serif" font-size="17">y</text>
  <line x1="160" y1="40" x2="370" y2="250" stroke="#6d28d9" stroke-width="2.6"/>
  <line x1="160" y1="250" x2="370" y2="40" stroke="#64748b" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="380" y="239" font-family="Arial, sans-serif" font-size="17" fill="#6d28d9">x + y = 3</text><text x="380" y="53" font-family="Arial, sans-serif" font-size="17" fill="#475569">y = x</text>
  <circle cx="248.10" cy="161.90" r="23.33" fill="#bfdbfe" fill-opacity="0.78" stroke="#2563eb" stroke-width="2.3"/>
  <circle cx="281.90" cy="128.10" r="23.33" fill="#fecdd3" fill-opacity="0.78" stroke="#e11d48" stroke-width="2.3"/>
  <line x1="248.10" y1="161.90" x2="265" y2="145" stroke="#2563eb" stroke-width="1.7" stroke-dasharray="4 3"/><line x1="281.90" y1="128.10" x2="265" y2="145" stroke="#e11d48" stroke-width="1.7" stroke-dasharray="4 3"/>
  <line x1="248.10" y1="161.90" x2="281.90" y2="128.10" stroke="#0f766e" stroke-width="2" stroke-dasharray="4 3"/>
  <circle cx="248.10" cy="161.90" r="3.8" fill="#1d4ed8"/><circle cx="281.90" cy="128.10" r="3.8" fill="#be123c"/><circle cx="265" cy="145" r="4" fill="#111827"/>
  <line x1="235" y1="169" x2="248.10" y2="161.90" stroke="#1d4ed8" stroke-width="1.2"/><line x1="291" y1="112" x2="281.90" y2="128.10" stroke="#be123c" stroke-width="1.2"/>
  <text x="176" y="177" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#1d4ed8">C(m, m)</text><text x="292" y="106" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#be123c">C(M, M)</text>
  <text x="450" y="118" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="19" fill="#111827">검은 점 T: 접점</text><text x="450" y="148" font-family="Arial, sans-serif" font-size="19" fill="#0f766e">m ≤ a ≤ M</text><text x="190" y="215" font-family="Arial, sans-serif" font-size="18" fill="#b91c1c">r = 1/3</text>
</svg>
