<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" width="800" height="430" preserveAspectRatio="xMidYMid meet" role="img" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-axis-scale-mode="EQUAL_UNIT" aria-labelledby="svg-title-2691f8b8ab" aria-describedby="svg-desc-2691f8b8ab"><title id="svg-title-2691f8b8ab">삼각형의 내심과 각의 이등분선</title><desc id="svg-desc-2691f8b8ab">I는 삼각형 ABC의 내심이므로 AI는 ∠A의 이등분선이다. AI와 BC의 교점을 D라 하면 BD:DC=AB:AC=2:3이며, D=(−1,−2/5)이다.</desc><style>.axis{font:italic 14px serif;fill:#111827}.label{font:600 12px "Malgun Gothic",sans-serif}.note{font:12px "Malgun Gothic",sans-serif;fill:#334155}.head{font:700 17px "Malgun Gothic",sans-serif;fill:#0f172a}</style><rect width="800" height="430" fill="#fff"/><text x="28" y="32" class="head">삼각형 ABC의 각의 이등분선</text><text x="28" y="54" class="note">D는 BC 위의 점이며 B-D-C의 순서로 BD:DC=2:3</text><rect x="28" y="70" width="520" height="320" rx="12" fill="#fff" stroke="#cbd5e1"/><g data-origin-x="250" data-origin-y="230" data-sx="45" data-sy="45"><line x1="48" y1="230" x2="528" y2="230" stroke="#111827" stroke-width="1.4"/><line x1="250" y1="82" x2="250" y2="375" stroke="#111827" stroke-width="1.4"/><text x="518" y="222" class="axis">x</text><text x="258" y="96" class="axis">y</text><polygon points="205,140 115,230 340,275" fill="#dbeafe" fill-opacity=".48" stroke="#2563eb" stroke-width="2.6"/><line x1="205" y1="140" x2="205" y2="248" stroke="#7c3aed" stroke-width="3" stroke-dasharray="7 5"/><line x1="115" y1="230" x2="205" y2="248" stroke="#16a34a" stroke-width="5"/><line x1="205" y1="248" x2="340" y2="275" stroke="#f59e0b" stroke-width="5"/><circle data-point-label="A" data-point-x="-1" data-point-y="2" cx="205" cy="140" r="6" fill="#111827"/><text x="213" y="134" class="label">A(-1,2)</text><circle data-point-label="B" data-point-x="-3" data-point-y="0" cx="115" cy="230" r="6" fill="#111827"/><text x="55" y="222" class="label">B(-3,0)</text><circle data-point-label="D" data-point-x="-1" data-point-y="-0.4" cx="205" cy="248" r="6" fill="#dc2626"/><text x="213" y="242" class="label" fill="#b91c1c">D(-1,-2/5)</text><circle data-point-label="C" data-point-x="2" data-point-y="-1" cx="340" cy="275" r="6" fill="#111827"/><text x="348" y="291" class="label">C(2,-1)</text></g><rect x="570" y="70" width="200" height="320" rx="12" fill="#f8fafc" stroke="#dbe3ef"/><text x="590" y="100" class="head">비와 순서</text><text x="590" y="138" class="note">B-D-C</text><text x="590" y="166" class="note">BD:DC=2:3</text><text x="590" y="204" class="note">AB=2√2</text><text x="590" y="232" class="note">AC=3√2</text><text x="590" y="270" class="note">AI는 ∠A의 이등분선</text><text x="590" y="308" class="note">D=(-1,-2/5)</text></svg>