<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" role="img" aria-labelledby="title desc" data-scale-policy="SCHEMATIC_ALLOWED">
  <title id="title">매개변수 k에 따른 원의 존재 조건</title>
  <desc id="desc">k가 -1일 때와 9일 때의 실제 원을 좌표평면에 나타내고, k의 범위에 따른 반지름 제곱의 부호를 수직선으로 나타낸 그림이다.</desc>
  <rect width="640" height="300" fill="#ffffff"/>
  <text x="320" y="29" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="24" font-weight="700" fill="#1e3a5f">r² = k(k−8) / 4</text>
  <rect x="18" y="42" width="270" height="178" rx="8" fill="#f8fafc" stroke="#dbe3ef"/>
  <text x="35" y="70" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="20" font-weight="700" fill="#047857">k = −1 : r² = 9/4 &gt; 0</text>
  <g stroke="#e5e7eb" stroke-width="1"><line x1="94" y1="83" x2="94" y2="210"/><line x1="150" y1="83" x2="150" y2="210"/><line x1="206" y1="83" x2="206" y2="210"/><line x1="55" y1="104" x2="250" y2="104"/><line x1="55" y1="160" x2="250" y2="160"/></g>
  <line x1="55" y1="160" x2="250" y2="160" stroke="#111827" stroke-width="1.4"/><line x1="150" y1="82" x2="150" y2="210" stroke="#111827" stroke-width="1.4"/>
  <circle cx="136" cy="188" r="42" fill="#bbf7d0" fill-opacity="0.72" stroke="#059669" stroke-width="2.4"/><circle cx="136" cy="188" r="3.5" fill="#047857"/>
  <text x="72" y="205" font-family="Arial, sans-serif" font-size="18" fill="#047857">C(−1/2, −1)</text><text x="170" y="186" font-family="Arial, sans-serif" font-size="18" fill="#047857">r = 3/2</text>
  <rect x="352" y="42" width="270" height="178" rx="8" fill="#f8fafc" stroke="#dbe3ef"/>
  <text x="370" y="70" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="20" font-weight="700" fill="#047857">k = 9 : r² = 9/4 &gt; 0</text>
  <g stroke="#e5e7eb" stroke-width="1"><line x1="400" y1="83" x2="400" y2="210"/><line x1="444" y1="83" x2="444" y2="210"/><line x1="488" y1="83" x2="488" y2="210"/><line x1="532" y1="83" x2="532" y2="210"/><line x1="375" y1="104" x2="610" y2="104"/><line x1="375" y1="160" x2="610" y2="160"/></g>
  <line x1="375" y1="160" x2="610" y2="160" stroke="#111827" stroke-width="1.4"/><line x1="400" y1="82" x2="400" y2="210" stroke="#111827" stroke-width="1.4"/>
  <circle cx="499" cy="182" r="33" fill="#bbf7d0" fill-opacity="0.72" stroke="#059669" stroke-width="2.4"/><circle cx="499" cy="182" r="3.5" fill="#047857"/>
  <text x="440" y="214" font-family="Arial, sans-serif" font-size="18" fill="#047857">C(9/2, −1)</text><text x="540" y="181" font-family="Arial, sans-serif" font-size="18" fill="#047857">r = 3/2</text>
  <line x1="82" y1="260" x2="558" y2="260" stroke="#64748b" stroke-width="1.6"/>
  <path d="M82 260 l8 -4 v8 z M558 260 l-8 -4 v8 z" fill="#64748b"/>
  <line x1="88" y1="260" x2="246" y2="260" stroke="#059669" stroke-width="6"/><line x1="254" y1="260" x2="386" y2="260" stroke="#dc2626" stroke-width="6"/><line x1="394" y1="260" x2="552" y2="260" stroke="#059669" stroke-width="6"/>
  <circle cx="250" cy="260" r="5.5" fill="#ffffff" stroke="#d97706" stroke-width="2"/><circle cx="390" cy="260" r="5.5" fill="#ffffff" stroke="#d97706" stroke-width="2"/>
  <text x="128" y="244" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="19" fill="#047857">실제 원</text><text x="275" y="244" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="19" fill="#b91c1c">실수 좌표 없음</text><text x="460" y="244" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="19" fill="#047857">실제 원</text>
  <text x="242" y="286" font-family="Arial, sans-serif" font-size="18">0</text><text x="384" y="286" font-family="Arial, sans-serif" font-size="18">8</text>
  <text x="184" y="286" text-anchor="middle" font-family="Arial, sans-serif" font-size="18">k &lt; 0</text><text x="320" y="286" text-anchor="middle" font-family="Arial, sans-serif" font-size="18">0 &lt; k &lt; 8</text><text x="466" y="286" text-anchor="middle" font-family="Arial, sans-serif" font-size="18">k &gt; 8</text>
</svg>
