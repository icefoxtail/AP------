<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 790 390" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc" data-geometry-preset="STANDARD_LANDSCAPE" data-visual-provenance="CODEX_CREATE_VISUAL_ASSET_REAUTHOR_20261012">
<title id="title">금지 도로를 지나는 최단 경로를 빼기</title><desc id="desc">6열 3행 도로망에서 A에서 B로 가는 최단 경로 중 세로 간선 QP를 지나는 15개 경로를 전체 84개에서 뺀다.</desc><rect width="790" height="390" fill="#fff"/><text x="34" y="35" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="22" font-weight="700" fill="#111">금지 도로를 지나는 경로를 제외</text>
<g stroke="#777" stroke-width="2"><line x1="70.0" y1="70.0" x2="70.0" y2="235.0" data-grid-vertical="0"/><line x1="125.0" y1="70.0" x2="125.0" y2="235.0" data-grid-vertical="1"/><line x1="180.0" y1="70.0" x2="180.0" y2="235.0" data-grid-vertical="2"/><line x1="235.0" y1="70.0" x2="235.0" y2="235.0" data-grid-vertical="3"/><line x1="290.0" y1="70.0" x2="290.0" y2="235.0" data-grid-vertical="4"/><line x1="345.0" y1="70.0" x2="345.0" y2="235.0" data-grid-vertical="5"/><line x1="400.0" y1="70.0" x2="400.0" y2="235.0" data-grid-vertical="6"/><line x1="70.0" y1="235.0" x2="400.0" y2="235.0" data-grid-horizontal="0"/><line x1="70.0" y1="180.0" x2="400.0" y2="180.0" data-grid-horizontal="1"/><line x1="70.0" y1="125.0" x2="400.0" y2="125.0" data-grid-horizontal="2"/><line x1="70.0" y1="70.0" x2="400.0" y2="70.0" data-grid-horizontal="3"/></g><line id="forbidden-edge" x1="290.0" y1="125.0" x2="290.0" y2="180.0" stroke="#b3261e" stroke-width="8" stroke-linecap="round" data-role="forbidden-edge" data-math-from="4,1" data-math-to="4,2"/>
<circle cx="290.0" cy="125.0" r="6" fill="#111"/><circle cx="290.0" cy="180.0" r="6" fill="#111"/><text x="275.0" y="131.0" text-anchor="end" font-family="sans-serif" font-size="17" fill="#111">Q</text><text x="275.0" y="186.0" text-anchor="end" font-family="sans-serif" font-size="17" fill="#111">P</text><circle cx="70.0" cy="235.0" r="5" fill="#111"/><circle cx="400.0" cy="70.0" r="5" fill="#111"/><text x="58.0" y="259.0" font-family="sans-serif" font-size="18" font-weight="700" fill="#111">A</text><text x="408.0" y="76.0" font-family="sans-serif" font-size="18" font-weight="700" fill="#111">B</text><text x="310.0" y="158.5" font-family="sans-serif" font-size="16" font-weight="700" fill="#b3261e">금지</text>
<rect x="455" y="62" width="305" height="270" rx="16" fill="#f7f9fc" stroke="#c5d3e1" stroke-width="2"/><text x="480" y="102" font-family="sans-serif" font-size="18" font-weight="700" fill="#111">전체 최단 경로</text><text x="480" y="135" font-family="sans-serif" font-size="19" fill="#111">C(9,3) = 84</text><line x1="480" y1="157" x2="730" y2="157" stroke="#c8c8c8"/><text x="480" y="192" font-family="sans-serif" font-size="17" fill="#111">A → P: C(5,1) = 5</text><text x="480" y="224" font-family="sans-serif" font-size="17" fill="#111">Q → B: C(3,1) = 3</text><text x="480" y="256" font-family="sans-serif" font-size="17" fill="#111">금지 도로 통과: 5 × 3 = 15</text><text x="480" y="300" font-family="sans-serif" font-size="22" font-weight="700" fill="#111">84 − 15 = 69</text></svg>