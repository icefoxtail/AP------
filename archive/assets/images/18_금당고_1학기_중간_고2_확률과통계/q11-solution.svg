<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 430" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc" data-geometry-preset="STANDARD_LANDSCAPE" data-visual-provenance="CODEX_CREATE_VISUAL_ASSET_REAUTHOR_20261012">
<title id="title">두 점 사이 거리 조건이 만드는 정사각형 영역</title><desc id="desc">단위 정사각형에서 |x-y|≤1/3인 대각 띠가 유효 영역이며 좌상단과 우하단 직각삼각형은 제외 영역이다.</desc>
<defs><pattern id="hatch" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="9" stroke="#8a8a8a" stroke-width="1.2"/></pattern></defs>
<rect width="780" height="430" fill="#fff"/><text x="38" y="34" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="22" font-weight="700" fill="#111">거리 조건이 정하는 영역</text>
<polygon id="valid-region" data-role="valid-region" points="72.000,262.000 272.000,62.000 372.000,62.000 372.000,162.000 172.000,362.000 72.000,362.000" fill="#e8f1fa"/>
<polygon data-role="excluded-region" points="72.000,262.000 72.000,62.000 272.000,62.000" fill="#ededed"/><polygon points="72.000,262.000 72.000,62.000 272.000,62.000" fill="url(#hatch)"/><polygon data-role="excluded-region" points="172.000,362.000 372.000,362.000 372.000,162.000" fill="#ededed"/><polygon points="172.000,362.000 372.000,362.000 372.000,162.000" fill="url(#hatch)"/>
<line x1="72.000" y1="262.000" x2="272.000" y2="62.000" stroke="#245a88" stroke-width="3" data-role="boundary-upper"/><line x1="172.000" y1="362.000" x2="372.000" y2="162.000" stroke="#245a88" stroke-width="3" data-role="boundary-lower"/>
<rect x="72.0" y="62.0" width="300.0" height="300.0" fill="none" stroke="#111" stroke-width="2.5" data-role="unit-square"/>
<text x="68.0" y="389.0" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#111">0</text><text x="372.0" y="389.0" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#111">1</text><text x="57.0" y="366.0" text-anchor="end" font-family="sans-serif" font-size="17" fill="#111">x</text><text x="57.0" y="74.0" text-anchor="end" font-family="sans-serif" font-size="17" fill="#111">y</text>
<text x="60.0" y="267.00" text-anchor="end" font-family="sans-serif" font-size="16" fill="#245a88">1/3</text><text x="272.00" y="52.0" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#245a88">2/3</text><text x="380.00" y="167.00" font-family="sans-serif" font-size="16" fill="#245a88">2/3</text><text x="172.00" y="387.0" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#245a88">1/3</text>
<rect x="430" y="78" width="310" height="275" rx="16" fill="#f7f9fc" stroke="#c5d3e1" stroke-width="2"/><text x="456" y="116" font-family="sans-serif" font-size="19" font-weight="700" fill="#111">유효 영역</text><text x="456" y="151" font-family="sans-serif" font-size="18" fill="#111">|x − y| ≤ 1/3</text><text x="456" y="194" font-family="sans-serif" font-size="17" fill="#333">제외되는 모서리 삼각형 2개</text><text x="456" y="225" font-family="sans-serif" font-size="17" fill="#333">각 직각변의 길이: 2/3</text><line x1="456" y1="246" x2="710" y2="246" stroke="#c8c8c8"/><text x="456" y="282" font-family="sans-serif" font-size="18" fill="#111">1 − 2 × 1/2 × (2/3)²</text><text x="456" y="321" font-family="sans-serif" font-size="22" font-weight="700" fill="#111">= 5/9</text></svg>