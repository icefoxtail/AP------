<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">X=x+2, Y=y+1, Z=z로 놓으면 X, Y, Z는 음이 아닌 정수이고 X+Y+Z=12이다. 12개의 별과 2개의 막대로 나타내면 14자리 중 막대가 들어갈 2자리를 고르는 경우이므로 91이다. 따라서 답은 ④이다.</title><desc id="visual-desc">12개의 점을 두 개의 세로 막대가 세 구간으로 나누고 있고, 구간 아래에 X, Y, Z가 적혀 있다. 오른쪽에 조합을 구하는 식이 표시되어 있다.</desc><rect width="640" height="360" fill="#fff"/><g data-layer="30"><line id="sLine" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="62.857142857" y1="109.87012987" x2="577.142857143" y2="109.87012987"/></g><g data-layer="30"><line id="sBar1" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="226.493506494" y1="156.623376623" x2="226.493506494" y2="63.116883117"/></g><g data-layer="30"><line id="sBar2" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="460.25974026" y1="156.623376623" x2="460.25974026" y2="63.116883117"/></g><g data-layer="70"><circle id="S1" data-role="point" stroke="#111" stroke-width="0.8" fill="#111" cx="62.857142857" cy="109.87012987" r="3.2"/></g><g data-layer="70"><circle id="S2" data-role="point" stroke="#111" stroke-width="0.8" fill="#111" cx="109.61038961" cy="109.87012987" r="3.2"/></g><g data-layer="70"><circle id="S3" data-role="point" stroke="#111" stroke-width="0.8" fill="#111" cx="156.3636363