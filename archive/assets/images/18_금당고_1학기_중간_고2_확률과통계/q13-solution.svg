<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 430" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc" data-geometry-preset="STANDARD_LANDSCAPE" data-visual-provenance="CODEX_CREATE_VISUAL_ASSET_REAUTHOR_20261012">
<title id="title">원 위의 8점에서 지름을 고르는 직각삼각형</title><desc id="desc">같은 간격의 8개 원주점에서 마주 보는 점 2개를 고르면 지름이며, 네 지름 각각에 대해 나머지 6점이 세 번째 꼭짓점 후보가 된다.</desc><rect width="780" height="430" fill="#fff"/><text x="34" y="35" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="22" font-weight="700" fill="#111">직각삼각형의 빗변은 원의 지름</text>
<circle cx="265.000" cy="235.000" r="145.000" fill="none" stroke="#333" stroke-width="2.5" data-role="circumcircle"/><line x1="265.000" y1="90.000" x2="265.000" y2="380.000" stroke="#245a88" stroke-width="2.5" stroke-dasharray="none" data-role="diameter" data-pair="0,4"/><line x1="367.530" y1="132.470" x2="162.470" y2="337.530" stroke="#245a88" stroke-width="2.5" stroke-dasharray="9 5" data-role="diameter" data-pair="1,5"/><line x1="410.000" y1="235.000" x2="120.000" y2="235.000" stroke="#245a88" stroke-width="2.5" stroke-dasharray="3 5" data-role="diameter" data-pair="2,6"/><line x1="367.530" y1="337.530" x2="162.470" y2="132.470" stroke="#245a88" stroke-width="2.5" stroke-dasharray="12 4 2 4" data-role="diameter" data-pair="3,7"/><circle cx="265.000" cy="90.000" r="6.5" fill="#111" data-role="equally-spaced-point" data-index="0"/><circle cx="367.530" cy="132.470" r="6.5" fill="#111" data-role="equally-spaced-point" data-index="1"/><circle cx="410.000" cy="235.000" r="6.5" fill="#111" data-role="equally-spaced-point" data-index="2"/><circle cx="367.530" cy="337.530" r="6.5" fill="#111" data-role="equally-spaced-point" data-index="3"/><circle cx="265.000" cy="380.000" r="6.5" fill="#111" data-role="equally-spaced-point" data-index="4"/><circle cx="162.470" cy="337.530" r="6.5" fill="#111" data-role="equally-spaced-point" data-index="5"/><circle cx="120.000" cy="235.000" r="6.5" fill="#111" data-role="equally-spaced-point" data-index="6"/><circle cx="162.470" cy="132.470" r="6.5" fill="#111" data-role="equally-spaced-point" data-index="7"/><circle cx="265.000" cy="235.000" r="4" fill="#245a88"/>
<rect x="485" y="68" width="265" height="278" rx="16" fill="#f7f9fc" stroke="#c5d3e1" stroke-width="2"/><text x="510" y="108" font-family="sans-serif" font-size="19" font-weight="700" fill="#111">원주각과 지름</text><text x="510" y="148" font-family="sans-serif" font-size="17" fill="#111">마주 보는 점 2개</text><text x="510" y="178" font-family="sans-serif" font-size="17" fill="#111">→ 지름 4개</text><text x="510" y="219" font-family="sans-serif" font-size="17" fill="#111">지름마다 세 번째 점 6개</text><text x="510" y="251" font-family="sans-serif" font-size="18" fill="#111">직각삼각형: 4 × 6 = 24</text><line x1="510" y1="271" x2="725" y2="271" stroke="#c8c8c8"/><text x="510" y="306" font-family="sans-serif" font-size="17" fill="#111">전체: C(8,3) = 56</text><text x="510" y="335" font-family="sans-serif" font-size="20" font-weight="700" fill="#111">확률 = 3/7</text></svg>