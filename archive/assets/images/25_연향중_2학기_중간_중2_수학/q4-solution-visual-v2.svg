<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 550" width="640" height="550" role="img" aria-labelledby="title desc"><title id="title">기울기는 같고 절편은 다른 두 직선</title><desc id="desc">파란 실선 y=2x−1과 주황 점선 y=2x−3/2는 기울기가 모두 2이다. 두 직선은 세로축의 −1과 −3/2에서 따로 만난다.</desc><rect width="640" height="550" fill="white" /><line x1="188.0000" y1="240.9537" x2="461.0000" y2="240.9537" stroke="#586574" stroke-width="2.05" stroke-linecap="round" /><polygon points="474.0000,240.9537 461.0000,235.7537 461.0000,246.1537" fill="#586574" /><line x1="281.1667" y1="493.0000" x2="281.1667" y2="109.0000" stroke="#586574" stroke-width="2.05" stroke-linecap="round" /><polygon points="281.1667,96.0000 275.9667,109.0000 286.3667,109.0000" fill="#586574" /><line x1="211.5105" y1="488.2360" x2="405.5312" y2="100.7640" stroke="#21629a" stroke-width="6.8" stroke-linecap="round" /><line x1="238.5938" y1="488.2360" x2="432.6145" y2="100.7640" stroke="#a74f20" stroke-width="6.8" stroke-linecap="round" stroke-dasharray="12 8" /><circle cx="281.1666666666667" cy="349.1280653950954" r="7" fill="#21629a" stroke="white" stroke-width="2" /><line x1="271.1667" y1="349.1281" x2="216.1667" y2="349.1281" stroke="#21629a" stroke-width="1.7" stroke-linecap="round" /><text x="156.167" y="359.128" fill="#21629a" font-size="29" font-weight="600" font-family="Malgun Gothic, Cambria Math, sans-serif" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="4.0" stroke-linejoin="round">(0, −1)</text><circle cx="281.1666666666667" cy="403.21525885558583" r="7" fill="#a74f20" stroke="white" stroke-width="2" /><line x1="271.1667" y1="403.2153" x2="216.1667" y2="403.2153" stroke="#a74f20" stroke-width="1.7" stroke-linecap="round" /><text x="156.167" y="413.215" fill="#a74f20" font-size="29" font-weight="600" font-family="Malgun Gothic, Cambria Math, sans-serif" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="4.0" stroke-linejoin="round">(0, −3/2)</text><line x1="60.0000" y1="39.0000" x2="105.0000" y2="39.0000" stroke="#21629a" stroke-width="5.65" stroke-linecap="round" /><text x="116.0000" y="46.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#21629a" text-anchor="start">y = 2x − 1</text><line x1="326.0000" y1="39.0000" x2="371.0000" y2="39.0000" stroke="#a74f20" stroke-width="5.65" stroke-linecap="round" stroke-dasharray="12 8" /><text x="382.0000" y="46.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#a74f20" text-anchor="start">y = 2x − 3/2</text><text x="490.000" y="227.954" fill="#586574" font-size="29" font-weight="600" font-family="Malgun Gothic, Cambria Math, sans-serif" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="4.0" stroke-linejoin="round">x</text><text x="300.167" y="91.000" fill="#586574" font-size="29" font-weight="600" font-family="Malgun Gothic, Cambria Math, sans-serif" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="4.0" stroke-linejoin="round">y</text><text x="263.167" y="225.954" fill="#586574" font-size="29" font-weight="600" font-family="Malgun Gothic, Cambria Math, sans-serif" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="4.0" stroke-linejoin="round">O</text></svg>
