<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 724 576" width="724" height="576" role="img" aria-labelledby="title desc"><title id="title">직각삼각형에 닿는 내접원과 바깥 외접원</title><desc id="desc">C에서 직각인 삼각형 ABC의 변은 AB 5 cm, BC 3 cm, AC 4 cm이다. 외접원의 중심 O는 빗변 AB에 있고, 내접원의 중심 I는 삼각형 안에 있다.</desc><rect width="724" height="576" fill="white" /><circle cx="362.0" cy="275.0" r="210.5" fill="none" stroke="#24649a" stroke-width="3.6" /><polygon points="488.3000,106.6000 235.7000,443.4000 488.3000,443.4000" fill="none" /><circle cx="404.1" cy="359.2" r="84.20000000000002" fill="none" stroke="#266f73" stroke-width="3.6" /><line x1="488.3000" y1="106.6000" x2="235.7000" y2="443.4000" stroke="#586574" stroke-width="4.2" stroke-linecap="round" /><line x1="235.7000" y1="443.4000" x2="488.3000" y2="443.4000" stroke="#586574" stroke-width="4.2" stroke-linecap="round" /><line x1="488.3000" y1="443.4000" x2="488.3000" y2="106.6000" stroke="#586574" stroke-width="4.2" stroke-linecap="round" /><line x1="488.3000" y1="425.4000" x2="470.3000" y2="425.4000" stroke="#586574" stroke-width="1.8" stroke-linecap="round" /><line x1="470.3000" y1="425.4000" x2="470.3000" y2="443.4000" stroke="#586574" stroke-width="1.8" stroke-linecap="round" /><line x1="210.1000" y1="424.2000" x2="462.7000" y2="87.4000" stroke="#24649a" stroke-width="1.7" stroke-linecap="round" /><line x1="205.7000" y1="420.9000" x2="214.5000" y2="427.5000" stroke="#24649a" stroke-width="1.7" stroke-linecap="round" /><line x1="458.3000" y1="84.1000" x2="467.1000" y2="90.7000" stroke="#24649a" stroke-width="1.7" stroke-linecap="round" /><text x="254.2000" y="328.4000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#24649a" text-anchor="middle">5 cm</text><line x1="235.7000" y1="477.4000" x2="488.3000" y2="477.4000" stroke="#24649a" stroke-width="1.7" stroke-linecap="round" /><line x1="235.7000" y1="471.9000" x2="235.7000" y2="482.9000" stroke="#24649a" stroke-width="1.7" stroke-linecap="round" /><line x1="488.3000" y1="471.9000" x2="488.3000" y2="482.9000" stroke="#24649a" stroke-width="1.7" stroke-linecap="round" /><text x="362.0000" y="514.4000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#24649a" text-anchor="middle">3 cm</text><line x1="607.3000" y1="106.6000" x2="607.3000" y2="443.4000" stroke="#24649a" stroke-width="1.7" stroke-linecap="round" /><line x1="612.8000" y1="106.6000" x2="601.8000" y2="106.6000" stroke="#24649a" stroke-width="1.7" stroke-linecap="round" /><line x1="612.8000" y1="443.4000" x2="601.8000" y2="443.4000" stroke="#24649a" stroke-width="1.7" stroke-linecap="round" /><text x="635.3000" y="283.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#24649a" text-anchor="middle">4 cm</text><circle cx="488.3" cy="106.6" r="4.9" fill="#28364b" /><text x="495.3000" y="91.6000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">A</text><circle cx="235.7" cy="443.4" r="4.9" fill="#28364b" /><text x="219.7000" y="443.4000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">B</text><circle cx="488.3" cy="443.4" r="4.9" fill="#28364b" /><text x="502.3000" y="458.4000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">C</text><circle cx="362.0" cy="275.0" r="4.9" fill="#28364b" /><text x="414.0000" y="250.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">O</text><circle cx="404.1" cy="359.2" r="4.9" fill="#28364b" /><text x="404.1000" y="387.2000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">I</text></svg>
