<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 622 706" width="622" height="706" role="img" aria-labelledby="title desc"><title id="title">세 직선으로 둘러싸인 삼각형</title><desc id="desc">굵은 세로선 x=0과 두 사선 x+y−4=0, 3x−y−4=0 사이를 청록으로 칠했다. 세 꼭짓점은 (0, 4), (0, −4), (2, 2)이며 (2, 2)에서 밑변으로 수평 점선을 그었다.</desc><rect width="622" height="706" fill="white" /><polygon points="232.9383,141.9353 232.9383,599.6468 347.5062,256.3632" fill="#dceee7" /><line x1="84.0000" y1="370.7910" x2="535.0000" y2="370.7910" stroke="#586574" stroke-width="2.05" stroke-linecap="round" /><polygon points="548.0000,370.7910 535.0000,365.5910 535.0000,375.9910" fill="#586574" /><line x1="232.9383" y1="654.0000" x2="232.9383" y2="92.0000" stroke="#586574" stroke-width="2.05" stroke-linecap="round" /><polygon points="232.9383,79.0000 227.7383,92.0000 238.1383,92.0000" fill="#586574" /><line x1="232.9383" y1="644.8458" x2="232.9383" y2="87.0100" stroke="#20746d" stroke-width="7" stroke-linecap="round" /><line x1="172.9505" y1="82.0209" x2="544.9754" y2="453.5910" stroke="#21629a" stroke-width="6.4" stroke-linecap="round" /><line x1="216.3336" y1="649.4000" x2="405.1644" y2="83.6000" stroke="#a74f20" stroke-width="6.4" stroke-linecap="round" stroke-dasharray="11 7" /><line x1="234.3704" y1="256.3632" x2="345.2148" y2="256.3632" stroke="#426f68" stroke-width="2.35" stroke-linecap="round" stroke-dasharray="7 5" /><circle cx="232.93827160493828" cy="141.93532338308466" r="7" fill="#21629a" stroke="white" stroke-width="2" /><circle cx="232.93827160493828" cy="599.6467661691543" r="7" fill="#a74f20" stroke="white" stroke-width="2" /><circle cx="347.5061728395061" cy="256.36318407960204" r="7" fill="#20746d" stroke="white" stroke-width="2" /><line x1="395.0519" y1="113.9005" x2="413.9556" y2="97.3085" stroke="#a74f20" stroke-width="1.85" stroke-linecap="round" /><line x1="518.7852" y1="427.4328" x2="497.5901" y2="490.3682" stroke="#21629a" stroke-width="1.85" stroke-linecap="round" /><text x="564.000" y="357.791" fil