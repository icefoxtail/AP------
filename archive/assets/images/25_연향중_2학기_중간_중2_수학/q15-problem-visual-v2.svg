<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 748 462" width="748" height="462" role="img" aria-labelledby="title desc"><title id="title">평행사변형에서 세 사각형으로 이어지는 분류도</title><desc id="desc">왼쪽 평행사변형에서 (1)은 직사각형, (3)은 마름모로 간다. 가운데 직사각형에서 (2), 마름모에서 (4)를 거치면 오른쪽 정사각형으로 간다. 각 사각형의 두 대각선과 교점 O가 그려져 있다.</desc><rect width="748" height="462" fill="white" /><line x1="215.0000" y1="207.0000" x2="266.7272" y2="148.4889" stroke="#24649a" stroke-width="3.3" stroke-linecap="round" /><polygon points="276.0000,138.0000 271.2225,152.4629 262.2320,144.5148" fill="#24649a" /><text x="231.0000" y="152.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#24649a" text-anchor="middle">(1)</text><line x1="216.0000" y1="255.0000" x2="264.0064" y2="312.2708" stroke="#266f73" stroke-width="3.3" stroke-linecap="round" /><polygon points="273.0000,323.0000 259.4082,316.1252 268.6046,308.4164" fill="#266f73" /><text x="246.0000" y="273.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#266f73" text-anchor="middle">(3)</text><line x1="472.0000" y1="138.0000" x2="526.4049" y2="195.8052" stroke="#24649a" stroke-width="3.3" stroke-linecap="round" /><polygon points="536.0000,206.0000 522.0357,199.9174 530.7741,191.6930" fill="#24649a" /><text x="515.0000" y="152.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#24649a" text-anchor="middle">(2)</text><line x1="478.0000" y1="319.0000" x2="526.9147" y2="261.6517" stroke="#266f73" stroke-width="3.3" stroke-linecap="round" /><polygon points="536.0000,251.0000 531.4798,265.5454 522.3497,257.7580" fill="#266f73" /><text x="511.0000" y="329.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#266f73" text-anchor="middle">(4)</text><polygon points="58.0000,185.0000 34.0000,275.0000 172.0000,275.0000 196.0000,185.0000" fill="none" /><line x1="58.0000" y1="185.0000" x2