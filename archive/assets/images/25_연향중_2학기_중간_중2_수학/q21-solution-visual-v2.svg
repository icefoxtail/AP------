<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 748 850" width="748" height="850" role="img" aria-labelledby="title desc"><title id="title">세 직선이 삼각형을 만들지 않는 세 경우</title><desc id="desc">세 칸에서 기존 두 직선은 파란 실선과 주황 점선이다. 보라색 짧은 점선이 세 번째 직선이다. 위는 파란 직선과 평행하고 가운데는 주황 직선과 평행하다. 아래에서는 세 직선이 (3, 2)에서 만난다.</desc><rect width="748" height="850" fill="white" /><rect x="24" y="97" width="700" height="237" rx="19" fill="#f6f9fc" stroke="#e0e7ef" stroke-width="1.8" /><line x1="63.0000" y1="199.1020" x2="343.0000" y2="199.1020" stroke="#586574" stroke-width="2.05" stroke-linecap="round" /><polygon points="356.0000,199.1020 343.0000,193.9020 343.0000,204.3020" fill="#586574" /><line x1="108.1364" y1="318.0000" x2="108.1364" y2="133.0000" stroke="#586574" stroke-width="2.05" stroke-linecap="round" /><polygon points="108.1364,120.0000 102.9364,133.0000 113.3364,133.0000" fill="#586574" /><line x1="162.9430" y1="124.9500" x2="351.0498" y2="313.0500" stroke="#21629a" stroke-width="5.5" stroke-linecap="round" /><line x1="130.0043" y1="314.0400" x2="193.3666" y2="123.9600" stroke="#a74f20" stroke-width="5.5" stroke-linecap="round" stroke-dasharray="12 7" /><line x1="64.8261" y1="258.9585" x2="122.0436" y2="316.1740" stroke="#784793" stroke-width="5.4" stroke-linecap="round" stroke-dasharray="4 6" /><circle cx="185.51320422535213" cy="147.51934349355219" r="7" fill="#20746d" stroke="white" stroke-width="2" /><text x="540.0000" y="209.0000" font-size="30" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#263645" text-anchor="middle">첫째 직선과 평행</text><text x="540.0000" y="261.0000" font-size="36" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#784793" text-anchor="middle">a = 1</text><text x="372.000" y="186.102" fill="#586574" font-size="30" font-weight="600" font-family="Malgun Gothic, Cambria Math, sans-serif" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="4.0" stroke-linejoin="round">x</text><text x="1