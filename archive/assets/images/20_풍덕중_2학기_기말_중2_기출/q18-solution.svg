<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 384 320" width="384" height="320" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">원판은 크기가 같은 10개의 칸으로 나뉘어 있고 1부터 10까지의 수 중 소수인 칸 2, 3, 5, 7을 색칠했다. 소수는 4개이므로 바늘이 소수를 가리킬 확률은 4/10=2/5이다. 따라서 답은 ③이다.</title><desc id="visual-desc">크기가 같은 10개의 부채꼴로 나뉜 원판에서 네 부채꼴이 색칠되어 있고 색칠된 칸에 2, 3, 5, 7이 적혀 있다.</desc><rect width="384" height="320" fill="#fff"/><g data-layer="10"><path id="s2" data-role="region" stroke="none" stroke-width="1.6" fill="#e4e7ec" data-owner-points="O P1 P2" data-mark="region" data-mark-id="s2" fill-rule="evenodd" d="M192 162.859244327 L286.524421903 94.183231879 A116.838611006 116.838611006 0 0 0 228.1051164 51.739121975 L192 162.859244327 Z"/></g><g data-layer="10"><path id="s3" data-role="region" stroke="none" stroke-width="1.6" fill="#e4e7ec" data-owner-points="O P2 P3" data-mark="region" data-mark-id="s3" fill-rule="evenodd" d="M192 162.859244327 L228.1051164 51.739121975 A116.838611006 116.838611006 0 0 0 155.8948836 51.739121975 L192 162.859244327 Z"/></g><g data-layer="10"><path id="s5" data-role="region" stroke="none" stroke-width="1.6" fill="#e4e7ec" data-owner-points="O P4 P5" data-mark="region" data-mark-id="s5" fill-rule="evenodd" d="M192 162.859244327 L97.475578097 94.183231879 A116.838611006 116.838611006 0 0 0 75.161388994 162.859244327 L192 162.859244327 Z"/></