<svg xmlns="http://www.w3.org/2000/svg" width="440" height="320" viewBox="0 0 440 320" role="img" aria-labelledby="svg-title-02958aa281" aria-describedby="svg-desc-02958aa281">
<title id="svg-title-02958aa281">접기로 생기는 이등변삼각형과 사인</title><desc id="svg-desc-02958aa281">접은 선과 평행선에서 ∠BAC=∠ACB이므로 AB=BC이다. AH=3, AC=5에서 HC=4이고 AB=BC=25/8이다. 따라서 sin a=AH/AB=24/25이다.</desc><style>text{font-family:Arial,sans-serif;font-size:15px;fill:#111}.g{fill:none;stroke:#111;stroke-width:2.2}.a{fill:none;stroke:#666;stroke-width:1.6;stroke-dasharray:6 5}.m{font-size:14px;font-weight:600}</style>
<rect x="1" y="1" width="438" height="318" rx="8" fill="white" stroke="#ddd"/>
<path class="g" d="M100 250 H340 M100 70 V250 M100 70 L152.5 250 M100 70 L340 250"/>
<path class="g" d="M100 240 h10 v10"/>
<path class="a" d="M122.5 250 A30 30 0 0 1 144.1 221.2"/>
<text x="88" y="60">A</text><text x="145" y="273">B</text><text x="345" y="273">C</text><text x="88" y="273">H</text>
<text class="m" x="52" y="166">AH=3</text><text class="m" x="238" y="273">HC=4</text><text class="m" x="183" y="153">AC=5</text>
<text class="m" x="117" y="177">AB=BC=25/8</text><text class="m" x="130" y="235">a</text>
<text x="20" y="30">AH:HC:AC=3:4:5, AB=BC</text>
<text x="20" y="52">sin(a)=AH/AB=24/25</text>
</svg>