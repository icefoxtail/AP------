<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 290" width="300" height="290" role="img" aria-labelledby="t d"><title id="t">회전체</title><desc id="d">원뿔 모양의 회전체. 꼭짓점에서 밑면의 중심까지 점선(ㄱ), 꼭짓점에서 밑면의 둘레 위의 점까지 선분(ㄴ), 밑면의 중심에서 둘레 위의 점까지 점선(ㄷ)이 있다.</desc><rect x="0" y="0" width="300" height="290" fill="#ffffff"/><path d="M 60 230 A 90 22 0 0 0 240 230" fill="none" stroke="#202020" stroke-width="2.2"/><path d="M 60 230 A 90 22 0 0 1 240 230" fill="none" stroke="#202020" stroke-width="1.8" stroke-dasharray="6 5"/><line x1="150" y1="40" x2="60" y2="230" stroke="#202020" stroke-width="2.2" stroke-linecap="round"/><line x1="150" y1="40" x2="240" y2="230" stroke="#202020" stroke-width="2.2" stroke-linecap="round"/><line x1="150" y1="40" x2="150" y2="230" stroke="#202020" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="6 5"/><line x1="150" y1="230" x2="240" y2="230" stroke="#202020" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="6 5"/><circle cx="150" cy="230" r="2.5" fill="#202020" stroke="#202020" stroke-width="1"/><circle cx="126" cy="142" r="17" fill="#fff" stroke="#202020" stroke-width="1.6"/><text x="126" y="150" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="20" text-anchor="middle" fill="#202020">ㄱ</text><circle cx="225" cy="124" r="17" fill="#fff" stroke="#202020" stroke-width="1.6"/><text x="225" y="132" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="20" text-anchor="middle" fill="#202020">ㄴ</text><circle cx="195" cy="256" r="17" fill="#fff" stroke="#202020" stroke-width="1.6"/><text x="195" y="264" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="20" text-anchor="middle" fill="#202020">ㄷ</text></svg>
