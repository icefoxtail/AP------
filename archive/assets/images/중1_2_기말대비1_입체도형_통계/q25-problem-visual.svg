<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 370" width="520" height="370" role="img" aria-labelledby="t d"><title id="t">몸무게에 대한 상대도수의 분포 그래프</title><desc id="d">가로축은 몸무게(kg), 세로축은 상대도수이다. 실선은 남학생, 점선은 여학생의 상대도수의 분포를 나타낸 도수분포다각형이다. 계급은 30kg 이상 35kg 미만부터 5kg씩 5개이고, 여학생은 35~40 계급이 0.2, 40~45 계급이 0.4이며 남학생은 40~45 계급이 0.3이다.</desc><rect x="0" y="0" width="520" height="370" fill="#ffffff"/><line x1="70" y1="300" x2="450" y2="300" stroke="#202020" stroke-width="1.8" stroke-linecap="round"/><line x1="70" y1="300" x2="70" y2="30.4" stroke="#202020" stroke-width="1.8" stroke-linecap="round"/><line x1="66" y1="250.08" x2="70" y2="250.08" stroke="#202020" stroke-width="1.4" stroke-linecap="round"/><line x1="70" y1="250.08" x2="430" y2="250.08" stroke="#c8c8c8" stroke-width="0.8" stroke-linecap="round"/><text x="62" y="255.08" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="21" text-anchor="end" fill="#202020">0.1</text><line x1="66" y1="200.16" x2="70" y2="200.16" stroke="#202020" stroke-width="1.4" stroke-linecap="round"/><line x1="70" y1="200.16" x2="430" y2="200.16" stroke="#c8c8c8" stroke-width="0.8" stroke-linecap="round"/><text x="62" y="205.16" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="21" text-anchor="end" fill="#202020">0.2</text><line x1="66" y1="150.24" x2="70" y2="150.24" stroke="#202020" stroke-width="1.4" stroke-linecap="round"/><line x1="70" y1="150.24" x2="430" y2="150.24" stroke="#c8c8c8" stroke-width="0.8" stroke-linecap="round"/><text x="62" y="155.24" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="21" text-anchor="end" fill="#202020">0.3</text><line x1="66" y1="100.32" x2="70" y2="100.32" stroke="#202020" stroke-width="1.4" stroke-linecap="round"/><line x1="70" y1="100.32" x2="430" y2="100.32" stroke="#c8c8c8" stroke-width="0.8" stroke-linecap="round"/><text x="62" y="105.32" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="21" text-anchor="end" fill="#202020">0.4</text><text x="62" y="305" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="21" text-anchor="end" fill="#202020">0</text><line x1="100" y1="300" x2="100" y2="305" stroke="#202020" stroke-width="1.4" stroke-linecap="round"/><text x="100" y="326" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="21" text-anchor="middle" fill="#202020">30</text><line x1="160" y1="300" x2="160" y2="305" stroke="#202020" stroke-width="1.4" stroke-linecap="round"/><text x="160" y="326" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="21" text-anchor="middle" fill="#202020">35</text><line x1="220" y1="300" x2="220" y2="305" stroke="#202020" stroke-width="1.4" stroke-linecap="round"/><text x="220" y="326" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="21" text-anchor="middle" fill="#202020">40</text><line x1="280" y1="300" x2="280" y2="305" stroke="#202020" stroke-width="1.4" stroke-linecap="round"/><text x="280" y="326" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="21" text-anchor="middle" fill="#202020">45</text><line x1="340" y1="300" x2="340" y2="305" stroke="#202020" stroke-width="1.4" stroke-linecap="round"/><text x="340" y="326" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="21" text-anchor="middle" fill="#202020">50</text><line x1="400" y1="300" x2="400" y2="305" stroke="#202020" stroke-width="1.4" stroke-linecap="round"/><text x="400" y="326" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="21" text-anchor="middle" fill="#202020">55</text><text x="454" y="322" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="21" text-anchor="start" fill="#202020">(kg)</text><text x="74" y="2