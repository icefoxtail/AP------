<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 277" width="340" height="277" role="img" aria-labelledby="t d"><title id="t">원뿔의 전개도</title><desc id="d">점 A를 중심으로 하는 부채꼴과 그 호 BC에 접하는 원으로 이루어진 원뿔의 전개도. 부채꼴의 두 반지름이 AB와 AC이다.</desc><rect x="0" y="0" width="340" height="277" fill="#ffffff"/><path d="M 170 40 L 57.42 105 A 130 130 0 0 0 282.58 105 Z" fill="#fff" stroke="#202020" stroke-width="2.2" stroke-linejoin="round"/><circle cx="170" cy="213.33" r="43.33" fill="#fff" stroke="#202020" stroke-width="2.2"/><text x="170" y="30" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="26" text-anchor="middle" font-style="italic" fill="#202020">A</text><text x="39.42" y="119" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="26" text-anchor="middle" font-style="italic" fill="#202020">B</text><text x="300.58" y="119" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="26" text-anchor="middle" font-style="italic" fill="#202020">C</text></svg>
