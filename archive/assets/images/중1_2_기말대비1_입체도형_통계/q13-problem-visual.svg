<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 430" width="420" height="430" role="img" aria-labelledby="t d"><title id="t">직선 l을 축으로 회전시킬 평면도형</title><desc id="d">직선 l 위의 두 점과 l에서 오른쪽으로 6 cm 떨어진 점을 꼭짓점으로 하는 삼각형을 색칠했다. 직선 l 위에서 아래쪽 기준선으로부터 두 꼭짓점까지의 길이는 각각 8 cm, 4 cm이다.</desc><rect x="0" y="0" width="420" height="430" fill="#ffffff"/><line x1="200" y1="377.2" x2="200" y2="37.2" stroke="#202020" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="12 4 2 4"/><text x="182" y="45.2" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="26" text-anchor="middle" font-style="italic" fill="#202020">l</text><polygon points="200,78 404,350 200,214" fill="#d9d9d9" stroke="#202020" stroke-width="2.2" stroke-linejoin="round"/><line x1="200" y1="350" x2="404" y2="350" stroke="#202020" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="6 5"/><line x1="404" y1="380.6" x2="200" y2="380.6" stroke="#202020" stroke-width="1.4" stroke-linecap="round"/><line x1="404" y1="385.6" x2="404" y2="375.6" stroke="#202020" stroke-width="1.4" stroke-linecap="round"/><line x1="200" y1="385.6" x2="200" y2="375.6" stroke="#202020" stroke-width="1.4" stroke-linecap="round"/><text x="302" y="410.6" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="24" text-anchor="middle" fill="#202020">6 cm</text><line x1="181.3" y1="350" x2="181.3" y2="214" stroke="#202020" stroke-width="1.4" stroke-linecap="round"/><line x1="176.3" y1="350" x2="186.3" y2="350" stroke="#202020" stroke-width="1.4" stroke-linecap="round"/><line x1="176.3" y1="214" x2="186.3" y2="214" stroke="#202020" stroke-width="1.4" stroke-linecap="round"/><text x="143.3" y="288" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="24" text-anchor="middle" fill="#202020">4 cm</text><line x1="84.4" y1="350" x2="84.4" y2="78" stroke="#202020" stroke-width="1.4" stroke-linecap="round"/><line x1="79.4" y1="350" x2="89.4