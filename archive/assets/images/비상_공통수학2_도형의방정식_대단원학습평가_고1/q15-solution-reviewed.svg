<svg xmlns="http://www.w3.org/2000/svg" width="360" height="402" viewBox="0 0 360 402" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc"><title id="title">원과 현 AB</title><desc id="desc">중심 O에서 현 AB에 내린 수선 OM. P는 작은 호 AB의 중점이며 좌표는 (-√5, 2√5)이다.</desc><g font-family="Arial, sans-serif"><line x1="246" y1="66" x2="70" y2="154" stroke="#222" stroke-width="1.8"/><line x1="180" y1="154" x2="158" y2="110" stroke="#222" stroke-width="1.8"/><circle cx="180" cy="154" r="110" fill="none" stroke="#222" stroke-width="1.8"/><text x="180" y="154" font-size="17" text-anchor="middle" fill="#111">circle</text><circle cx="180" cy="154" r="2.5" fill="#111" stroke="#222" stroke-width="1.8"/><text x="180" y="144" font-size="17" text-anchor="middle" fill="#111">O</text><circle cx="246" cy="66" r="2.5" fill="#111" stroke="#222" stroke-width="1.8"/><text x="246" y="56" font-size="17" text-anchor="middle" fill="#111">A</text><circle cx="70" cy="154" r="2.5" fill="#111" stroke="#222" stroke-width="1.8"/><text x="70" y="144" font-size="17" text-anchor="middle" fill="#111">B</text><circle cx="158" cy="110" r="2.5" fill="#111" stroke="#222" stroke-width="1.8"/><text x="158" y="100" font-size="17" text-anchor="middle" fill="#111">M</text><text x="180" y="286" font-size="17" text-anchor="middle" fill="#111">OM⊥AB</text><text x="180" y="310" font-size="15" text-anchor="middle" fill="#111">O(0,0)  A(3,4)</text><text x="180" y="334" font-size="15" text-anchor="middle" fill="#111">B(-5,0)  M(-1,2)</text><text x="180" y="358" font-size="15" text-anchor="middle" fill="#111">circle(0,0), r=5</text><text x="131" y="48" font-size="17" text-anchor="middle" fill="#111">P</text></g></svg>
