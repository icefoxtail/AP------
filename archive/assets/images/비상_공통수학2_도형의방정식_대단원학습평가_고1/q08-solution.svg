<svg xmlns="http://www.w3.org/2000/svg" width="360" height="402" viewBox="0 0 360 402" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title" aria-describedby="desc"><title id="title">도형의 방정식: 원과 현 AB 및 중심에서 현에 내린 수선의 발 M</title><desc id="desc">원과 현 AB 및 중심에서 현에 내린 수선의 발 M. 도형은 등거리 좌표변환을 적용한 그림이다</desc><g font-family="Arial, sans-serif"><line x1="70" y1="80.6667" x2="290" y2="80.6667" stroke="#222" stroke-width="1.8"/><line x1="180" y1="154" x2="180" y2="80.6667" stroke="#222" stroke-width="1.8"/><circle cx="180" cy="154" r="110" fill="none" stroke="#222" stroke-width="1.8"/><text x="180" y="154" font-size="17" text-anchor="middle" fill="#111">원</text><circle cx="180" cy="154" r="2.5" fill="#111" stroke="#222" stroke-width="1.8"/><text x="180" y="144" font-size="17" text-anchor="middle" fill="#111">O</text><circle cx="180" cy="80.6667" r="2.5" fill="#111" stroke="#222" stroke-width="1.8"/><text x="180" y="70.6667" font-size="17" text-anchor="middle" fill="#111">M</text><circle cx="70" cy="80.6667" r="2.5" fill="#111" stroke="#222" stroke-width="1.8"/><text x="70" y="70.6667" font-size="17" text-anchor="middle" fill="#111">L</text><circle cx="290" cy="80.6667" r="2.5" fill="#111" stroke="#222" stroke-width="1.8"/><text x="290" y="70.6667" font-size="17" text-anchor="middle" fill="#111">R</text><text x="180" y="286" font-size="17" text-anchor="middle" fill="#111">OM⊥LR</text><text x="180" y="310" font-size="15" text-anchor="middle" fill="#111">O(0,0)  M(0,2)</text><text x="180" y="334" font-size="15" text-anchor="middle" fill="#111">L(-3,2)  R(3,2)</text><text x="180" y="358" font-size="15" text-anchor="middle" fill="#111">중심이 (0,0)인 원, r=3</text><text x="98.0" y="73" font-size="17" text-anchor="middle" fill="#111">A</text><text x="262.0" y="73" font-size="17" text-anchor="middle" fill="#111">B</text></g></svg>