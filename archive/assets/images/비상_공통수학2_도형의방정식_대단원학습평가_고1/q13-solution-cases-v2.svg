<svg xmlns="http://www.w3.org/2000/svg" width="360" height="470" viewBox="0 0 360 470" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc"><title id="title">경우별 검산</title><desc id="desc">경우별 검산의 문항별 수학 사실을 표시한다.</desc><g font-family="Arial, sans-serif"><text x="18" y="28" font-size="16" text-anchor="start" fill="#111">평행 또는 한 점에서의 동시 교점</text><text x="18" y="62" font-size="18" text-anchor="start" fill="#111">경우 1 — 선택</text><text x="18" y="88" font-size="17" text-anchor="start" fill="#111">a: a=3</text><text x="18" y="114" font-size="17" text-anchor="start" fill="#111">관계: l,m,n meet at (-1,2)</text><text x="18" y="140" font-size="16" text-anchor="start" fill="#111">세 직선이 한 점에 모인다.</text><line x1="12" y1="166" x2="348" y2="166" stroke="#222" stroke-width="1.8"/><text x="18" y="192" font-size="18" text-anchor="start" fill="#111">경우 2 — 선택</text><text x="18" y="218" font-size="17" text-anchor="start" fill="#111">a: a=-1</text><text x="18" y="244" font-size="17" text-anchor="start" fill="#111">관계: l∥m: no triangle</text><text x="18" y="270" font-size="16" text-anchor="start" fill="#111">l과 m이 평행하다.</text><line x1="12" y1="296" x2="348" y2="296" stroke="#222" stroke-width="1.8"/><text x="18" y="322" font-size="18" text-anchor="start" fill="#111">경우 3 — 선택</text><text x="18" y="348" font-size="17" text-anchor="start" fill="#111">a: a=2</text><text x="18" y="374" font-size="17" text-anchor="start" fill="#111">관계: m∥n: no triangle</text><text x="18" y="400" font-size="16" text-anchor="start" fill="#111">m과 n이 평행하다.</text><line x1="12" y1="426" x2="348" y2="426" stroke="#222" stroke-width="1.8"/></g></svg>
