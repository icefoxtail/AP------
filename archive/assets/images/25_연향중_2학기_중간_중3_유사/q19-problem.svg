<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 560" width="640" height="560" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">원 O의 외부 점 A에서 그은 두 접선 AT, AT′와, 점 B와 C를 지나며 점 E에서 원에 접하는 직선 BC를 나타낸 그림이다. AO와 OT의 길이가 주어져 있다.</title><desc id="visual-desc">왼쪽에 점 A가 있고 오른쪽에 원의 중심 O가 있다. A에서 원 위의 두 점 T와 아래쪽 접점으로 접선이 그어져 있고, 두 접선 사이의 원 위에 점 E가 있다. 점 B와 C를 지나는 직선이 E에서 원에 접하며 삼각형 ABC를 이룬다. 선분 AO에는 13 cm, 선분 OT에는 5 cm가 적혀 있다.</desc><rect width="640" height="560" fill="#fff"/><g data-layer="30"><line id="AT" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="92.347691969" y1="280" x2="385.226565877" y2="157.967135872"/></g><g data-layer="30"><line id="AT2" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="92.347691969" y1="280" x2="385.226565877" y2="402.032864128"/></g><g data-layer="30"><line id="BC" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="303.871323124" y1="191.865153685" x2="303.871323124" y2="368.134846315"/></g><g data-layer="30"><line id="OT" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="436.073592597" y1="280" x2="385.226565877" y2="157.967135872"/></g><g data-layer="30"><line id="OT2" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="436.073592597" y1="280" x2="385.226565877" y2="402.032864128"/></g><g data-layer="30"><line id="AO" data-role=