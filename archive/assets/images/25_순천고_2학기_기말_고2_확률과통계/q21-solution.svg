<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="578" viewBox="0 0 900 578" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="s21-title s21-desc">
<title id="s21-title">21번 두 확률밀도함수의 대칭성과 넓이</title><desc id="s21-desc">f(x)는 y축 대칭인 꺾은선이며 -3부터 3까지의 면적이 11/16이다. g(x)는 x=3을 중심으로 대칭인 지붕 모양 꺾은선이다. 두 함수 각각 전체 넓이가 1이다.</desc>
<style>.h{font:bold 28px Arial,'Noto Sans KR',sans-serif;fill:#243645}.lab{font:24px Arial,'Noto Sans KR',sans-serif;fill:#243645}.cap{font:25px Arial,'Noto Sans KR',sans-serif;fill:#196384}</style>
<text class="h" x="35" y="42">f(x): y축 대칭, 구간 확률은 아래 면적</text>
<path d="M208 251 L208 128.50 L448 181 L688 128.50 L688 251 Z" fill="#b2ddeb" stroke="none"/><line x1="112" y1="251" x2="798" y2="251" stroke="#354e60" stroke-width="2"/>
<polyline points="128,111 448,181 768,111" fill="none" stroke="#243948" stroke-width="3.3"/>
<line x1="448" y1="95" x2="448" y2="251" stroke="#7c8e9c" stroke-dasharray="5 6" stroke-width="1.5"/>
<text class="lab" x="128" y="284" text-anchor="middle">-4</text><text class="lab" x="208" y="284" text-anchor="middle">-3</text><text class="lab" x="448" y="284" text-anchor="middle">0</text><text class="lab" x="688" y="284" text-anchor="middle">3</text><text class="lab" x="768" y="284" text-anchor="middle">4</text>
<text class="cap" x="562" y="127">P(-3≤X≤3)=11/16</text>
<text class="h" x="35" y="344">g(x): x = 3 대칭, 전체 면적 1</text>
<line x1="112" y1="499" x2="798" y2="499" stroke="#354e60" stroke-width="2"/><polyline points="128,479 448,359 768,479" fill="none" stroke="#243948" stroke-width="3.3"/>
<text class="lab" x="128" y="532" text-anchor="middle">-3</text><text class="lab" x="448" y="532" text-anchor="middle">3</text><text class="lab" x="768" y="532" text-anchor="middle">9</text>
<text class="cap" x="35" y="570">g의 좌우 넓이: 6b + 6b = 12b = 1</text>
</svg>
