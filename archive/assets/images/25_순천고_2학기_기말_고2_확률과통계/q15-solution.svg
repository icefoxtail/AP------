<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="860" height="360" viewBox="0 0 860 360" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="s15-title s15-desc">
<title id="s15-title">15번 확률밀도함수의 두 삼각형 넓이</title><desc id="s15-desc">x가 0에서 3까지인 왼쪽 삼각형의 높이는 3a, 3에서 6까지인 오른쪽 삼각형의 높이는 b이다. 각 삼각형의 넓이는 2/3, 1/3이다.</desc>
<style>.h{font:bold 28px Arial,'Noto Sans KR',sans-serif;fill:#263947}.t{font:26px Arial,'Noto Sans KR',sans-serif;fill:#1c2d39}.cap{font:25px Arial,'Noto Sans KR',sans-serif;fill:#195879}</style>
<text class="h" x="28" y="42">확률밀도함수 = 두 삼각형의 넓이</text>
<path d="M130 268 L130 86 L430 268 Z" fill="#b7ddeb" stroke="none"/>
<path d="M430 268 L730 177 L730 268 Z" fill="#e1e5ea" stroke="none"/>
<line x1="104" y1="268" x2="776" y2="268" stroke="#324755" stroke-width="2"/><line x1="130" y1="68" x2="130" y2="280" stroke="#324755" stroke-width="2"/>
<polyline points="130,86 430,268 730,177" fill="none" stroke="#233948" stroke-width="3.5" stroke-linejoin="round"/>
<text class="t" x="117" y="301">0</text><text class="t" x="422" y="301">3</text><text class="t" x="722" y="301">6</text>
<text class="t" x="65" y="94">3a</text><text class="t" x="743" y="185">b</text><text class="t" x="784" y="276">x</text><text class="t" x="101" y="69">f(x)</text>
<text class="cap" x="196" y="225">2/3</text><text class="cap" x="562" y="246">1/3</text>
<text class="t" x="25" y="340">왼쪽 넓이 = 9a/2, 오른쪽 넓이 = 3b/2</text>
</svg>
