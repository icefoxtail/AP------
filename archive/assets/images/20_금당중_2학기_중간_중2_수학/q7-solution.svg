<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 420" width="420" height="420" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">외심 O에서 세 꼭짓점까지의 거리가 같으므로 삼각형 OAB, OBC, OCA는 모두 이등변삼각형이다. 이때 꼭짓점마다 한 각씩 고른 세 각의 합은 90이므로 x + 29 + 31 = 90이다. 따라서 x의 크기는 30이다. 따라서 답은 ③이다.</title><desc id="visual-desc">삼각형 ABC와 그 외심 O가 있고 O에서 A, B, C로 선분이 그려져 있다. 꼭짓점 B의 각에 29, 꼭짓점 C의 각에 31, 꼭짓점 A의 각에 x가 표시되어 있고 OA, OB, OC에 같은 길이 표시가 있다.</desc><rect width="420" height="420" fill="#fff"/><g data-layer="12"><polygon id="aB-sector" data-role="angleSector" stroke="none" stroke-width="1.6" fill="#d9d9d9" data-owner-points="O B C" data-mark="angle" data-mark-id="aB" data-mark-index="0" data-mark-count="1" data-mark-side="INNER" points="51.071428571,344.889750893 75.560776752,331.315074996 75.977875485,332.09643615 76.370051996,332.890598721 76.736913858,333.696768045 77.078093977,334.514137442 77.393250958,335.341889025 77.682069443,336.179194517 77.944260432,337.025216083 78.179561567,337.879107165 78.387737399,338.740013332 78.568579618,339.607073132 78.721907269,340.479418956 78.847566927,341.356177906 78.945432852,342.236472666 79.015407117,343.119422386 79.057419703,344.004143555 79.071428571,344.889750893"/></g><g data-layer="12"><polygon id="aC-sector" data-role="angleSector" stroke="none" stroke-width="1.6" fill="#d9d9d9" data-owner-points="O C A" data-ma