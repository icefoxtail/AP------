<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 384 320" width="384" height="320" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">예: ∠ABC=60°, BC=5cm인 평행사변형이다(AB의 길이는 모양만 나타낸 예이다). 마주 보는 대각은 같으므로 ∠D=∠B=60°이고, 이웃한 두 각의 합이 180°이므로 ∠A=120°이다. 마주 보는 대변은 평행하고 길이가 같으므로 AB∥CD이고 AD=BC=5cm이다. 그러나 AB의 길이는 조건만으로 5cm라고 정할 수 없으므로 옳지 않은 것은 ④이다.</title><desc id="visual-desc">평행사변형 ABCD에서 꼭짓점 B와 D의 각 60°, 꼭짓점 A의 각 120°가 표시되어 있고 변 BC와 DA에 5가 적혀 있으며 마주 보는 변에 같은 눈금이 있다.</desc><rect width="384" height="320" fill="#fff"/><g data-layer="30"><line id="AB" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="130.775510204" y1="89.304048671" x2="49.142857143" y2="230.695951329"/></g><g data-layer="30"><line id="BC" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="49.142857143" y1="230.695951329" x2="253.224489796" y2="230.695951329"/></g><g data-layer="30"><line id="CD" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="253.224489796" y1="230.695951329" x2="334.857142857" y2="89.304048671"/></g><g data-layer="30"><line id="DA" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="334.857142857" y1="89.304048671" x2="130.775510204" y2="89.304048671"/></g><g data-layer="60"><polyline id="a0-arc-1" data-role="indicator" stroke="#111" stroke-width="1.6" fill="none" data-owner-points="A B C" data-mark="ang