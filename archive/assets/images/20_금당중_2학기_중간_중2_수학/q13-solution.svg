<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 384 320" width="384" height="320" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">∠A=90°이므로 꼭짓점 A의 대변 BC=15cm가 빗변이다. 직각삼각형의 외심은 빗변의 중점이므로 외접원의 지름이 빗변 BC=15cm이다. 따라서 반지름은 15/2=7.5cm이다. 답은 ③이다.</title><desc id="visual-desc">꼭짓점 A에서 직각인 직각삼각형 ABC와 그 외접원이 있고 외심 O가 빗변 BC의 중점에 있으며 AB 9, CA 12, 빗변의 절반인 BO와 OC에 15/2가 적혀 있다.</desc><rect width="384" height="320" fill="#fff"/><g data-layer="30"><line id="AB" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="125.793103448" y1="248.275862069" x2="258.206896552" y2="248.275862069"/></g><g data-layer="30"><line id="BO" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="258.206896552" y1="248.275862069" x2="192" y2="160"/></g><g data-layer="30"><line id="OC" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="192" y1="160" x2="125.793103448" y2="71.724137931"/></g><g data-layer="30"><line id="CA" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="125.793103448" y1="71.724137931" x2="125.793103448" y2="248.275862069"/></g><g data-layer="40"><circle id="cc" data-role="circle" stroke="#111" stroke-width="2.05" fill="none" cx="192" cy="160" r="110.344827586"/></g><g data-layer="60"><polyline id="r0" data-role="indicator" stroke="#111" stroke-width="0.8" fill="none" points="135.793103448,248.27586