<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 340" width="420" height="340" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">큰 정사각형 안에 작은 정사각형이 왼쪽 아래 모서리에 닿도록 들어 있고, 두 정사각형 사이의 부분이 색칠되어 있다. 큰 정사각형의 한 변은 4x+5, 작은 정사각형의 한 변은 x-2로 표시되어 있다.</title><desc id="visual-desc">정사각형 두 개가 왼쪽 아래 모서리를 함께 쓰며 겹쳐 있고, 점 이름은 쓰지 않았다. 큰 정사각형에서 작은 정사각형을 뺀 나머지 ㄱ자 모양 부분이 색칠되어 있다. 큰 정사각형의 위쪽 변 바깥에 4x+5, 작은 정사각형의 아래쪽 변 바깥에 x-2의 길이 표시가 있다.</desc><rect width="420" height="340" fill="#fff"/><g data-layer="10"><path id="rShade" data-role="region" stroke="none" stroke-width="1.6" fill="#7fa6e8" data-owner-points="B C D F G H" data-mark="region" data-mark-id="rShade" fill-opacity="0.32" fill-rule="evenodd" d="M169.277179708 265.019914016 L305.019914016 265.019914016 L305.019914016 74.980085984 L114.980085984 74.980085984 L114.980085984 210.722820292 L169.277179708 210.722820292 L169.277179708 265.019914016 Z"/></g><g data-layer="30"><line id="sAB" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="114.980085984" y1="265.019914016" x2="305.019914016" y2="265.019914016"/></g><g data-layer="30"><line id="sBC" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="305.019914016" y1="265.019914016" x2="305.019914016" y2="74.980085984"/></g><g data-layer="30"><line id="sCD" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="3