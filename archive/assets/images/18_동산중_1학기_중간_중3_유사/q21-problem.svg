<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 320" width="420" height="320" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">가로로 긴 직사각형이 하나 그려져 있고, 오른쪽 세로변 바깥에 세로의 길이 x-3이 치수선으로 표시되어 있다. 가로의 길이는 표시되어 있지 않다.</title><desc id="visual-desc">점 이름이 없는 직사각형이 그려져 있다. 오른쪽 세로변의 바깥쪽에 화살표 치수선이 있고 그 옆에 x-3이라는 길이가 적혀 있다. 다른 변에는 길이 표시가 없다.</desc><rect width="420" height="320" fill="#fff"/><g data-layer="30"><line id="sAB" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="48.587026657" y1="242.935133285" x2="325.037470941" y2="242.935133285"/></g><g data-layer="30"><line id="sBC" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="325.037470941" y1="242.935133285" x2="325.037470941" y2="77.064866715"/></g><g data-layer="30"><line id="sCD" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="325.037470941" y1="77.064866715" x2="48.587026657" y2="77.064866715"/></g><g data-layer="30"><line id="sDA" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="48.587026657" y1="77.064866715" x2="48.587026657" y2="242.935133285"/></g><g data-layer="52"><line id="dH-ext-from" data-role="indicator" stroke="#111" stroke-width="0.8" fill="none" data-mark="dimension" data-mark-id="dH" data-mark-part="ext-from" x1="329.037470941" y1="242.935133285" x2="352.037470941" y2="242.935133285"/></g><g data-layer="5