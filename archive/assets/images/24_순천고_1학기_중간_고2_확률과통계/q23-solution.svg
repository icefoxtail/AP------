<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="840" height="200" viewBox="0 0 840 200" role="img">
<style>.axis{stroke:#111;stroke-width:1.2}.shape,.curve{fill:none;stroke:#111;stroke-width:1.8}.guide{fill:none;stroke:#555;stroke-width:1;stroke-dasharray:5 4}.point{fill:#111}.radius{fill:none;stroke:#1f4e79;stroke-width:1.5}.tangent{fill:none;stroke:#111;stroke-width:2.1}.perpendicular{fill:none;stroke:#555;stroke-width:1;stroke-dasharray:3 3}.right-angle{fill:none;stroke:#111;stroke-width:1.2}.center-point{fill:#1f4e79}.element-label,.annotation{font:13px sans-serif}.annotation{font-style:italic}text{font:14px sans-serif;fill:#111}.cell{fill:#fff;stroke:#111;stroke-width:1}.cell-text{text-anchor:middle;dominant-baseline:middle;font:13px sans-serif}</style>
<rect x="16" y="16" width="404" height="42" class="cell"/>
<text x="218" y="37" class="cell-text">부분</text>
<rect x="420" y="16" width="404" height="42" class="cell"/>
<text x="622" y="37" class="cell-text">조건·경우 수</text>
<rect x="16" y="58" width="404" height="42" class="cell"/>
<text x="218" y="79" class="cell-text">f₁&lt;f₂&lt;f₃=t</text>
<rect x="420" y="58" width="404" height="42" class="cell"/>
<text x="622" y="79" class="cell-text">t=−4,−3,−2 에서 1+3+6=10</text>
<rect x="16" y="100" width="404" height="42" class="cell"/>
<text x="218" y="121" class="cell-text">f₃=t&lt;f₄&lt;f₅&lt;f₆</text>
<rect x="420" y="100" width="404" height="42" class="cell"/>
<text x="622" y="121" class="cell-text">세 간격 ≥2, 합 10 → C(6,2)=15</text>
<rect x="16" y="142" width="404" height="42" class="cell"/>
<text x="218" y="163" class="cell-text">전체</text>
<rect x="420" y="142" width="404" height="42" class="cell"/>
<text x="622" y="163" class="cell-text">10×15 = 150</text>
</svg>
