<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="840" height="180" viewBox="0 0 840 180" role="img">
<style>.axis{stroke:#111;stroke-width:1.2}.shape,.curve{fill:none;stroke:#111;stroke-width:1.8}.guide{fill:none;stroke:#555;stroke-width:1;stroke-dasharray:5 4}.point{fill:#111}.radius{fill:none;stroke:#1f4e79;stroke-width:1.5}.tangent{fill:none;stroke:#111;stroke-width:2.1}.perpendicular{fill:none;stroke:#555;stroke-width:1;stroke-dasharray:3 3}.right-angle{fill:none;stroke:#111;stroke-width:1.2}.center-point{fill:#1f4e79}.element-label,.annotation{font:13px sans-serif}.annotation{font-style:italic}text{font:14px sans-serif;fill:#111}.cell{fill:#fff;stroke:#111;stroke-width:1}.cell-text{text-anchor:middle;dominant-baseline:middle;font:13px sans-serif}</style>
<rect x="16" y="16" width="404" height="37" class="cell"/>
<text x="218" y="34.5" class="cell-text">원탁 위의 배열 단위</text>
<rect x="420" y="16" width="404" height="37" class="cell"/>
<text x="622" y="34.5" class="cell-text">경우의 수</text>
<rect x="16" y="53" width="404" height="37" class="cell"/>
<text x="218" y="71.5" class="cell-text">A 네 명과 묶음 (B₁B₂B₃)</text>
<rect x="420" y="53" width="404" height="37" class="cell"/>
<text x="622" y="71.5" class="cell-text">(5−1)!</text>
<rect x="16" y="90" width="404" height="37" class="cell"/>
<text x="218" y="108.5" class="cell-text">묶음 안의 B 학생 배열</text>
<rect x="420" y="90" width="404" height="37" class="cell"/>
<text x="622" y="108.5" class="cell-text">3!</text>
<rect x="16" y="127" width="404" height="37" class="cell"/>
<text x="218" y="145.5" class="cell-text">전체</text>
<rect x="420" y="127" width="404" height="37" class="cell"/>
<text x="622" y="145.5" class="cell-text">(5−1)!×3! = 144</text>
</svg>
