<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 723 437" width="723" height="437" role="img" aria-labelledby="title desc"><title id="title">큰 삼각형의 외심과 작은 삼각형의 내심</title><desc id="desc">삼각형 ABC에서 꼭짓점 A는 오른쪽에 있고 각 BAC는 20도이다. 외심 O와 왼쪽 두 꼭짓점 B, C가 이루는 삼각형의 내심은 I이다. I에서 B와 C를 이었다.</desc><rect width="723" height="437" fill="white" /><polygon points="638.0000,218.5000 85.0000,120.9912 85.0000,316.0088" fill="none" /><polygon points="85.0000,120.9912 85.0000,316.0088 352.9033,218.5000" fill="none" /><line x1="638.0000" y1="218.5000" x2="85.0000" y2="120.9912" stroke="#205d9c" stroke-width="4.55" stroke-linecap="round" /><line x1="85.0000" y1="120.9912" x2="85.0000" y2="316.0088" stroke="#205d9c" stroke-width="4.55" stroke-linecap="round" /><line x1="85.0000" y1="316.0088" x2="638.0000" y2="218.5000" stroke="#205d9c" stroke-width="4.55" stroke-linecap="round" /><line x1="85.0000" y1="120.9912" x2="352.9033" y2="218.5000" stroke="#704895" stroke-width="4.15" stroke-linecap="round" /><line x1="85.0000" y1="316.0088" x2="352.9033" y2="218.5000" stroke="#704895" stroke-width="4.15" stroke-linecap="round" /><line x1="85.0000" y1="120.9912" x2="153.2764" y2="218.5000" stroke="#266f73" stroke-width="4.0" stroke-linecap="round" /><line x1="85.0000" y1="316.0088" x2="153.2764" y2="218.5000" stroke="#266f73" stroke-width="4.0" stroke-linecap="round" /><path d="M 588.7596 209.8176 A 50 50 0 0 0 588.7596 227.1824" stroke="#aa5411" stroke-width="2.25" fill="none" /><text x="501.0000" y="229.5000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#aa5411" text-anchor="middle">20°</text><path d="M 133.2012 189.8297 A 35 35 0 0 0 133.2012 247.1703" stroke="#266f73" stroke-width="2.25" fill="none" /><circle cx="638.0" cy="218.50000000000003" r="4.9" fill="#28364b" /><text x="656.0000" y="225.5000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">A</text><circle cx="85.0"