<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 527" width="700" height="527" role="img" aria-labelledby="title desc"><title id="title">외심을 연결한 삼각형과 세 각 표시</title><desc id="desc">삼각형 ABC의 외심 O를 B, C와 이었다. 왼쪽 A의 각은 68도, 오른쪽 B에서 BO와 BA 사이의 각은 32도이다. C에서 CO와 CB 사이 각은 x이다.</desc><rect width="700" height="527" fill="white" /><polygon points="139.7142,449.5000 560.2858,449.5000 290.0120,77.5000" fill="none" /><line x1="139.7142" y1="449.5000" x2="560.2858" y2="449.5000" stroke="#205d9c" stroke-width="4.55" stroke-linecap="round" /><line x1="560.2858" y1="449.5000" x2="290.0120" y2="77.5000" stroke="#205d9c" stroke-width="4.55" stroke-linecap="round" /><line x1="290.0120" y1="77.5000" x2="139.7142" y2="449.5000" stroke="#205d9c" stroke-width="4.55" stroke-linecap="round" /><line x1="560.2858" y1="449.5000" x2="350.0000" y2="318.0989" stroke="#266f73" stroke-width="4.15" stroke-linecap="round" /><line x1="290.0120" y1="77.5000" x2="350.0000" y2="318.0989" stroke="#266f73" stroke-width="4.15" stroke-linecap="round" /><path d="M 182.7142 449.5000 A 43 43 0 0 0 155.8223 409.6311" stroke="#205d9c" stroke-width="2.25" fill="none" /><text x="204.3791" y="413.8830" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#205d9c" text-anchor="middle">68°</text><path d="M 516.1873 421.9442 A 52 52 0 0 0 508.2858 449.5000" stroke="#266f73" stroke-width="2.25" fill="none" /><text x="455.0434" y="433.7632" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#266f73" text-anchor="middle">32°</text><path d="M 300.8985 121.1633 A 45 45 0 0 0 316.4623 113.9058" stroke="#aa5411" stroke-width="2.25" fill="none" /><text x="332.1310" y="160.3794" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#aa5411" text-anchor="middle">x</text><circle cx="139.7142117856638" cy="449.5" r="4.9" fill="#28364b" /><text x="122.7142" y="472.5000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">A</text><circle cx="560.2857882143362" cy="449.5" r="4.9" fill="#28364b" /><text x="578.2858" y="472.5000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">B</text><circle cx="290.01196779634205" cy="77.5" r="4.9" fill="#28364b" /><text x="290.0120" y="60.5000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">C</text><circle cx="350.0" cy="318.0988558027655" r="4.9" fill="#28364b" /><text x="332.0000" y="336.0989" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">O</text></svg>
