<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 708 509" width="708" height="509" role="img" aria-labelledby="title desc"><title id="title">마름모 안의 두 대각선과 색칠한 삼각형</title><desc id="desc">마름모 ABCD 안의 두 대각선 AC와 BD는 O에서 교차한다. OD가 3 cm, OC가 2 cm이다. BC의 중점 P와 A를 연결해 삼각형 ABP를 칠했다.</desc><rect width="708" height="509" fill="white" /><polygon points="354.0000,77.5000 88.5000,254.5000 354.0000,431.5000 619.5000,254.5000" fill="none" /><polygon points="354.0000,77.5000 88.5000,254.5000 221.2500,343.0000" fill="none" /><line x1="354.0000" y1="77.5000" x2="88.5000" y2="254.5000" stroke="#205d9c" stroke-width="4.55" stroke-linecap="round" /><line x1="88.5000" y1="254.5000" x2="354.0000" y2="431.5000" stroke="#205d9c" stroke-width="4.55" stroke-linecap="round" /><line x1="354.0000" y1="431.5000" x2="619.5000" y2="254.5000" stroke="#205d9c" stroke-width="4.55" stroke-linecap="round" /><line x1="619.5000" y1="254.5000" x2="354.0000" y2="77.5000" stroke="#205d9c" stroke-width="4.55" stroke-linecap="round" /><line x1="354.0000" y1="77.5000" x2="354.0000" y2="431.5000" stroke="#266f73" stroke-width="4.05" stroke-linecap="round" /><line x1="88.5000" y1="254.5000" x2="619.5000" y2="254.5000" stroke="#704895" stroke-width="4.05" stroke-linecap="round" /><line x1="354.0000" y1="77.5000" x2="221.2500" y2="343.0000" stroke="#aa5411" stroke-width="4.2" stroke-linecap="round" /><line x1="153.6471" y1="306.3444" x2="161.4129" y2="294.6956" stroke="#205d9c" stroke-width="2.5" stroke-linecap="round" /><line x1="286.3971" y1="394.8444" x2="294.1629" y2="383.1956" stroke="#205d9c" stroke-width="2.5" stroke-linecap="round" /><text x="486.7500" y="240.5000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#704895" text-anchor="middle">3 cm</text><text x="410.0000" y="358.0800" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#266f73" text-anchor="middle">2 cm</text><circle cx="354.0" cy="77.5" r="4.9" fill="#28364b" /><text x="354.0000" y="60.5000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">A</text><circle cx="88.5" cy="254.5" r="4.9" fill="#28364b" /><text x="71.5000" y="263.5000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">B</text><circle cx="354.0" cy="431.5" r="4.9" fill="#28364b" /><text x="354.0000" y="458.5000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">C</text><circle cx="619.5" cy="254.5" r="4.9" fill="#28364b" /><text x="636.5000" y="263.5000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">D</text><circle cx="354.0" cy="254.5" r="4.9" fill="#28364b" /><text x="338.0000" y="239.5000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">O</text><circle cx="221.25" cy="343.0" r="4.9" fill="#28364b" /><text x="204.2500" y="365.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">P</text></svg>
