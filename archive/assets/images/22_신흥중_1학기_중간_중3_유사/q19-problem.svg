<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">넓이가 각각 3 제곱센티미터, 27 제곱센티미터, 75 제곱센티미터인 세 정사각형을 아래쪽 변이 일직선이 되도록 왼쪽부터 차례로 이어 붙인 도형이다. 세 정사각형의 높이는 서로 다르고 오른쪽으로 갈수록 높아진다.</title><desc id="visual-desc">바닥이 하나의 직선을 이루도록 세 정사각형이 왼쪽부터 나란히 붙어 있고, 왼쪽 정사각형에는 3 제곱센티미터, 가운데 정사각형에는 27 제곱센티미터, 오른쪽 정사각형에는 75 제곱센티미터가 적혀 있다. 세 정사각형의 높이는 왼쪽이 가장 낮고 오른쪽이 가장 높다.</desc><rect width="640" height="360" fill="#fff"/><g data-layer="10"><path id="r1" data-role="region" stroke="none" stroke-width="1.6" fill="#7fa6e8" data-owner-points="b0 b1 t0 t1" data-mark="region" data-mark-id="r1" fill-opacity="0.32" fill-rule="evenodd" d="M100.921052632 301.710526316 L149.605263158 301.710526316 L149.605263158 253.026315789 L100.921052632 253.026315789 L100.921052632 301.710526316 Z"/></g><g data-layer="10"><path id="r2" data-role="region" stroke="none" stroke-width="1.6" fill="#f2a65a" data-owner-points="b1 b2 t2 t3" data-mark="region" data-mark-id="r2" fill-opacity="0.42" fill-rule="evenodd" d="M149.605263158 301.710526316 L295.657894737 301.710526316 L295.657894737 155.657894737 L149.605263158 155.657894737 L149.605263158 301.710526316 Z"/></g><g data-layer="10"><path id="r3" data-role="region" stroke="none" stroke-width="1.6" fill="#e4e7ec" data-owner-points="b2 b3 t4 t5" data-mark="region