<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 496" width="720" height="496" role="img" aria-labelledby="title desc"><title id="title">정사면체의 높이를 삼등분한 두 단면</title><desc id="desc">정사면체의 밑면과 나란한 두 평면으로 높이를 똑같이 셋으로 나눴다. 꼭대기부터 (가), 가운데 (나), 아래 (다)이다. 뒤쪽의 모서리와 단면 경계는 점선이다.</desc><rect width="720" height="496" fill="white" /><polygon points="294.2191,132.2338 294.2191,132.2338 301.0318,234.4700 231.8127,208.4892" fill="none" /><polygon points="294.2191,132.2338 294.2191,132.2338 349.8127,208.4892 301.0318,234.4700" fill="none" /><polygon points="231.8127,208.4892 301.0318,234.4700 307.8446,336.7061 169.4064,284.7446" fill="none" /><polygon points="301.0318,234.4700 349.8127,208.4892 405.4064,284.7446 307.8446,336.7061" fill="none" /><polygon points="169.4064,284.7446 307.8446,336.7061 314.6573,438.9423 107.0000,361.0000" fill="none" /><polygon points="307.8446,336.7061 405.4064,284.7446 461.0000,361.0000 314.6573,438.9423" fill="#f6dfbc" /><line x1="294.2191" y1="132.2338" x2="107.0000" y2="361.0000" stroke="#205d9c" stroke-width="4.25" stroke-linecap="round" /><line x1="294.2191" y1="132.2338" x2="461.0000" y2="361.0000" stroke="#205d9c" stroke-width="4.25" stroke-linecap="round" /><line x1="294.2191" y1="132.2338" x2="314.6573" y2="438.9423" stroke="#205d9c" stroke-width="4.25" stroke-linecap="round" /><line x1="107.0000" y1="361.0000" x2="461.0000" y2="361.0000" stroke="#586574" stroke-width="2.55" stroke-linecap="round" stroke-dasharray="8 6" /><line x1="461.0000" y1="361.0000" x2="314.6573" y2="438.9423" stroke="#205d9c" stroke-width="4.25" stroke-linecap="round" /><line x1="314.6573" y1="438.9423" x2="107.0000" y2="361.0000" stroke="#205d9c" stroke-width="4.25" stroke-linecap="round" /><line x1="231.8127" y1="208.4892" x2="349.8127" y2="208.4892" stroke="#266f73" stroke-width="2.55" stroke-linecap="round" stroke-dasharray="8 6" /><line x1="349.8127" y1="208.4892" x2="301.0318" y2="234.4700" stroke="#266f73" stroke-width="4.15" stroke-linecap="round" /><line