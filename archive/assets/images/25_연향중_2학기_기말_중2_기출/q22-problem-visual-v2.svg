<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 728 541" width="728" height="541" role="img" aria-labelledby="title desc"><title id="title">직각삼각형에서 무게중심을 지나는 중선</title><desc id="desc">삼각형 ABC의 A가 직각이고 AC는 12 cm이다. 빗변 BC의 가운데 D와 A를 이었다. 이 중선의 무게중심 G부터 D까지는 10/3 cm이다.</desc><rect width="728" height="541" fill="white" /><polygon points="442.1200,136.5800 85.0000,404.4200 643.0000,404.4200" fill="none" /><line x1="442.1200" y1="136.5800" x2="85.0000" y2="404.4200" stroke="#205d9c" stroke-width="4.65" stroke-linecap="round" /><line x1="85.0000" y1="404.4200" x2="643.0000" y2="404.4200" stroke="#205d9c" stroke-width="4.65" stroke-linecap="round" /><line x1="643.0000" y1="404.4200" x2="442.1200" y2="136.5800" stroke="#205d9c" stroke-width="4.65" stroke-linecap="round" /><line x1="442.1200" y1="136.5800" x2="364.0000" y2="404.4200" stroke="#266f73" stroke-width="4.35" stroke-linecap="round" /><line x1="426.9200" y1="147.9800" x2="438.3200" y2="163.1800" stroke="#586574" stroke-width="1.8" stroke-linecap="round" /><line x1="438.3200" y1="163.1800" x2="453.5200" y2="151.7800" stroke="#586574" stroke-width="1.8" stroke-linecap="round" /><line x1="466.9200" y1="117.9800" x2="667.8000" y2="385.8200" stroke="#205d9c" stroke-width="1.7" stroke-linecap="round" /><line x1="471.3200" y1="114.6800" x2="462.5200" y2="121.2800" stroke="#205d9c" stroke-width="1.7" stroke-linecap="round" /><line x1="672.2000" y1="382.5200" x2="663.4000" y2="389.1200" stroke="#205d9c" stroke-width="1.7" stroke-linecap="round" /><text x="592.9600" y="240.7000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#205d9c" text-anchor="middle">12 cm</text><line x1="369.0200" y1="359.7800" x2="272.0200" y2="427.4200" stroke="#266f73" stroke-width="1.7" stroke-linecap="round" stroke-dasharray="5 5" /><text x="250.0200" y="446.4200" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#266f73" text-anchor="middle">10</text><line