<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 690 456" width="690" height="456" role="img" aria-labelledby="title desc"><title id="title">네 영역 A, B, C, D가 나뉜 직사각형</title><desc id="desc">가로로 긴 직사각형에서 가로선 두 개가 세 층을 가른다. 위쪽 층은 A이고 아래쪽 층은 D이다. 가운데 층에만 세로 경계가 있어 왼쪽 B와 오른쪽 C로 나뉜다.</desc><rect width="690" height="456" fill="white" /><rect x="107" y="65" width="476" height="320" fill="#f9fbfd" stroke="#205d9c" stroke-width="4.45" /><line x1="107.0000" y1="171.6667" x2="583.0000" y2="171.6667" stroke="#205d9c" stroke-width="4.15" stroke-linecap="round" /><line x1="107.0000" y1="278.3333" x2="583.0000" y2="278.3333" stroke="#205d9c" stroke-width="4.15" stroke-linecap="round" /><line x1="345.0000" y1="171.6667" x2="345.0000" y2="278.3333" stroke="#205d9c" stroke-width="4.15" stroke-linecap="round" /><text x="345.0000" y="130.3333" font-size="35" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">A</text><text x="226.0000" y="237.0000" font-size="35" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">B</text><text x="464.0000" y="237.0000" font-size="35" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">C</text><text x="345.0000" y="343.6667" font-size="35" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">D</text></svg>
