<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 460" preserveAspectRatio="xMidYMid meet" role="img" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-geometry-fact-hash="sha256:240d7fbd8848aef20a34be2b7516ceb70cd6db5e644dfa2f08746bec530307d0" data-visual-provenance="M2_RESET_20260928|25_연향중_2학기_기말_중2_기출|q22|R1_D_AUTHORITY_REFRESH" aria-labelledby="svg-title-414a202ac5" aria-describedby="svg-desc-414a202ac5">
<title id="svg-title-414a202ac5">무게중심과 빗변 중점으로 구한 변</title><desc id="svg-desc-414a202ac5">AG:GD=2:1이고 GD=10/3이므로 AD=10이다. D는 BC의 중점이며 ∠A=90°라서 AD=BD=CD=10, BC=20이다. AC=12에서 AB²+12²=20², AB=16이다.</desc><style>.main{fill:none;stroke:#111;stroke-width:2.05}.secondary{fill:none;stroke:#333;stroke-width:1.55}.dot{fill:#111}.v{font:13px system-ui,sans-serif;fill:#111}.e{font:12px system-ui,sans-serif;fill:#222}.note{font:12px system-ui,sans-serif;fill:#222}</style>
<path class="main" d="M150 360 L150 120 L330 360 Z"/><path class="secondary" d="M150 360 L240 240 M150 344 L166 344 L166 360"/><circle class="dot" cx="240" cy="240" r="3"/><circle class="dot" cx="210" cy="280" r="3"/><text class="v" x="132" y="378">A</text><text class="v" x="132" y="112">B</text><text class="v" x="336" y="378">C</text><text class="v" x="247" y="238">D</text><text class="v" x="192" y="282">G</text><text class="e" x="113" y="246">AB=16</text><text class="e" x="225" y="380">AC=12</text><text class="e" x="222" y="292">GD=10/3</text><text class="note" x="72" y="32">AG:GD=2:1; AD=10</text><text class="note" x="72" y="52">D는 빗변의 중점이고 AD=BD=CD=10</text><text class="note" x="72" y="72">AB²+12²=20²이므로 AB=16</text>
</svg>