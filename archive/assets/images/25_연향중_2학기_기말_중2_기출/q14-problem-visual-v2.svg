<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 639 514" width="639" height="514" role="img" aria-labelledby="title desc"><title id="title">원 위에 따로 놓인 다섯 점</title><desc id="desc">파란 원둘레의 서로 다른 다섯 자리마다 작은 청록색 점과 이름이 있다. 위의 A에서 왼쪽으로 내려가면 B와 C, 아래에서 오른쪽으로 올라가면 D와 E가 나타난다.</desc><rect width="639" height="514" fill="white" /><circle cx="320" cy="251" r="182" fill="none" stroke="#205d9c" stroke-width="4.55" /><circle cx="320.0" cy="69.0" r="6.2" fill="#266f73" /><text x="320.0000" y="43.0000" font-size="32" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">A</text><circle cx="146.90771403428207" cy="194.75890702375955" r="6.2" fill="#266f73" /><text x="114.5718" y="192.2523" font-size="32" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">B</text><circle cx="207.94961149073023" cy="394.4179571564234" r="6.2" fill="#266f73" /><text x="187.0171" y="429.2103" font-size="32" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">C</text><circle cx="439.4027432762723" cy="388.35714360054453" r="6.2" fill="#266f73" /><text x="461.7088" y="422.0173" font-size="32" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">D</text><circle cx="487.5318833283442" cy="179.88693461495217" r="6.2" fill="#266f73" /><text x="518.8290" y="174.6021" font-size="32" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">E</text></svg>
