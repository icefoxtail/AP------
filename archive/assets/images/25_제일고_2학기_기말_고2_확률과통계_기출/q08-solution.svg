<svg xmlns="http://www.w3.org/2000/svg" width="480" height="290" viewBox="0 0 480 290" role="img" aria-labelledby="q08-title q08-desc">
<title id="q08-title">삼각형 확률밀도함수와 누적확률</title>
<desc id="q08-desc">0에서 3까지 삼각형 모양의 확률밀도함수로, 꼭짓점은 (2, 2/3)이다. 0에서 1까지의 진한 회색 영역 확률은 1/6이고 0에서 2까지 전체 회색 영역 확률은 2/3이다.</desc>
<rect width="480" height="290" fill="#ffffff"/>
<polygon points="62,226 298,226 298,108.67" fill="#ededed"/>
<polygon points="62,226 180,226 180,167.33" fill="#bababa"/>
<line x1="62" y1="226" x2="444" y2="226" stroke="#333" stroke-width="1.3"/>
<line x1="62" y1="246" x2="62" y2="58" stroke="#333" stroke-width="1.3"/>
<polyline points="62,226 298,108.67 416,226" fill="none" stroke="#161616" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
<line x1="298" y1="226" x2="298" y2="108.67" stroke="#555" stroke-width="1.1" stroke-dasharray="5 4"/>
<line x1="62" y1="108.67" x2="298" y2="108.67" stroke="#777" stroke-width="1.1" stroke-dasharray="5 4"/>
<line x1="180" y1="226" x2="180" y2="167.33" stroke="#777" stroke-width="1.1" stroke-dasharray="4 3"/>
<text x="43" y="247" font-size="15" font-family="Arial,sans-serif">0</text>
<text x="175" y="246" font-size="15" font-family="Arial,sans-serif">1</text>
<text x="285" y="247" font-size="15" font-family="Arial,sans-serif">b=2</text>
<text x="400" y="247" font-size="15" font-family="Arial,sans-serif">a=3</text>
<text x="450" y="232" font-size="16" font-family="Arial,sans-serif">x</text>
<text x="52" y="52" font-size="16" font-family="Arial,sans-serif">y</text>
<text x="308" y="100" font-size="15" font-family="Arial,sans-serif">c=2/3</text>
<text x="80" y="277" font-size="15" font-family="Arial,sans-serif">진한 영역 = 1/6 · 왼쪽 전체 영역 = 2/3</text>
</svg>
