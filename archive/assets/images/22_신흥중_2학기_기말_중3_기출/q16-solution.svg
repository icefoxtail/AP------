<svg xmlns="http://www.w3.org/2000/svg" width="420" height="250" viewBox="0 0 420 250" role="img" aria-labelledby="svg-title-efe546beea" aria-describedby="svg-desc-efe546beea">
<title id="svg-title-efe546beea">원 중심에서 현에 내린 수선은 현을 이등분한다</title><desc id="svg-desc-efe546beea">OM⊥AB이고 OA=OB인 두 반지름이며 OM은 공통이다. 직각삼각형 OAM과 OBM은 RHS 합동이므로 AM=BM이다. 따라서 중심에서 현에 내린 수선의 발 M은 AB의 중점이다.</desc><g fill="none" stroke="black" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
<circle cx="210" cy="105" r="108.17"/>
<line x1="120" y1="165" x2="300" y2="165"/>
<line x1="210" y1="105" x2="210" y2="165"/>
<line x1="210" y1="105" x2="120" y2="165"/>
<line x1="210" y1="105" x2="300" y2="165"/>
<path d="M 210 165 h -10 v -10"/>
</g>
<g fill="black" font-size="15" font-family="sans-serif">
<text x="217" y="98">O</text><text x="102" y="181">A</text><text x="305" y="181">B</text><text x="215" y="182">M</text>
<text x="65" y="225">OA=OB, OM 공통, AM=BM</text>
</g>
</svg>