<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">가로 길이와 세로 길이는 각각 1 또는 2이고, 넓이 1, 2, 4의 확률은 4/9, 4/9, 1/9이다. E(X)=16/9, E(X²)=4이므로 V(X)=68/81이고, V(-9X+5)=81×68/81=68이다. 따라서 답은 ③이다.</title><desc id="visual-desc">가로 방향 평행선 세 개와 세로 방향 평행선 세 개가 직각으로 만나고 사이 간격이 1로 표시되어 있다.</desc><rect width="600" height="600" fill="#fff"/><g data-layer="30"><line id="v1" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="140.476190476" y1="539.285714286" x2="140.476190476" y2="60.714285714"/></g><g data-layer="30"><line id="v2" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="300" y1="539.285714286" x2="300" y2="60.714285714"/></g><g data-layer="30"><line id="v3" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="459.523809524" y1="539.285714286" x2="459.523809524" y2="60.714285714"/></g><g data-layer="30"><line id="h1" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="60.714285714" y1="459.523809524" x2="539.285714286" y2="459.523809524"/></g><g data-layer="30"><line id="h2" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="60.714285714" y1="300" x2="539.285714286" y2="300"/></g><g data-layer="30"><line id="h3" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="60.714285714" y1="14