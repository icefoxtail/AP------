<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 620" role="img" aria-labelledby="title desc">
<title id="title">직사각형 탁자의 180도 회전 대응 자리</title>
<desc id="desc">여덟 자리 가운데 반 바퀴 회전으로 서로 바뀌는 네 쌍을 같은 번호와 색으로 표시한다.</desc>
<rect width="1060" height="620" fill="#FFFFFF"/>
<text x="60" y="58" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="32" font-weight="700" fill="#0F172A">180° 회전에서 서로 대응하는 자리</text>
<text x="60" y="96" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="21" fill="#475569">같은 번호의 두 자리는 반 바퀴 회전으로 서로 바뀐다.</text>
<rect x="260" y="230" width="260" height="160" rx="12" fill="#F8FAFC" stroke="#64748B" stroke-width="4"/>
<text x="390" y="303" text-anchor="middle" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="26" font-weight="600" fill="#334155">탁자</text>
<text x="390" y="350" text-anchor="middle" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="26" font-weight="700" fill="#2563EB">↻ 180°</text>

<circle class="seat" data-seat="top_left" data-pair="1" cx="270" cy="150" r="28" fill="#2563EB" stroke="#FFFFFF" stroke-width="3"/>
<text class="seat-pair-label" data-seat-owner="top_left" data-pair="1" x="270" y="158" text-anchor="middle" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF">1</text>
<circle class="seat" data-seat="top_middle" data-pair="2" cx="390" cy="150" r="28" fill="#7C3AED" stroke="#FFFFFF" stroke-width="3"/>
<text class="seat-pair-label" data-seat-owner="top_middle" data-pair="2" x="390" y="158" text-anchor="middle" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF">2</text>
<circle class="seat" data-seat="top_right" data-pair="3" cx="510" cy="150" r="28" fill="#059669" stroke="#FFFFFF" stroke-width="3"/>
<text class="seat-pair-label" data-seat-owner="top_right" data-pair="3" x="510" y="158" text-anchor="middle" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF">3</text>
<circle class="seat" data-seat="left_middle" data-pair="4" cx="180" cy="310" r="28" fill="#D97706" stroke="#FFFFFF" stroke-width="3"/>
<text class="seat-pair-label" data-seat-owner="left_middle" data-pair="4" x="180" y="318" text-anchor="middle" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF">4</text>
<circle class="seat" data-seat="right_middle" data-pair="4" cx="600" cy="310" r="28" fill="#D97706" stroke="#FFFFFF" stroke-width="3"/>
<text class="seat-pair-label" data-seat-owner="right_middle" data-pair="4" x="600" y="318" text-anchor="middle" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF">4</text>
<circle class="seat" data-seat="bottom_left" data-pair="3" cx="270" cy="470" r="28" fill="#059669" stroke="#FFFFFF" stroke-width="3"/>
<text class="seat-pair-label" data-seat-owner="bottom_left" data-pair="3" x="270" y="478" text-anchor="middle" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF">3</text>
<circle class="seat" data-seat="bottom_middle" data-pair="2" cx="390" cy="470" r="28" fill="#7C3AED" stroke="#FFFFFF" stroke-width="3"/>
<text class="seat-pair-label" data-seat-owner="bottom_middle" data-pair="2" x="390" y="478" text-anchor="middle" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF">2</text>
<circle class="seat" data-seat="bottom_right" data-pair="1" cx="510" cy="470" r="28" fill="#2563EB" stroke="#FFFFFF" stroke-width="3"/>
<text class="seat-pair-label" data-seat-owner="bottom_right" data-pair="1" x="510" y="478" text-anchor="middle" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF">1</text>
<rect x="690" y="195" width="300" height="250" rx="18" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
<text x="720" y="237" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="22" font-weight="700" fill="#0F172A">회전으로 겹치는 두 배치</text>
<text x="720" y="282" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="20" fill="#334155">각 번호 쌍은 서로</text>
<text x="720" y="313" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="20" fill="#334155">마주 보는 자리다.</text>
<text x="720" y="370" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="22" font-weight="700" fill="#1D4ED8">배치 수를 2로 나눔</text>
<text x="60" y="555" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="19" fill="#475569">번호 ①–④는 회전으로 짝지어지는 자리만 나타낸다.</text>
</svg>
