<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 410" width="650" height="410" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">AB와 AC의 길이가 같은 이등변삼각형 ABC와 그 외접원 O가 있고, 원 위의 점 P를 지나는 직선 AP가 변 BC의 연장선과 만나는 점 Q를 나타낸 그림</title><desc id="visual-desc">원 O에 내접하는 이등변삼각형 ABC가 있다. 변 AB와 AC에는 10, 변 BC에는 12가 적혀 있고, 원 위의 점 P를 지나 A와 이어지는 직선이 밑변 BC를 연장한 직선과 만나는 점 Q가 표시되어 있다. 선분 AP와 PQ의 길이의 비는 1 대 3으로 표시되어 있다.</desc><rect width="650" height="410" fill="#fff"/><g data-layer="30"><line id="ab" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="210.707472737" y1="102.665912533" x2="99.476600985" y2="250.973741535"/></g><g data-layer="30"><line id="ac" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="210.707472737" y1="102.665912533" x2="321.938344488" y2="250.973741535"/></g><g data-layer="30"><line id="bc" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="99.476600985" y1="250.973741535" x2="321.938344488" y2="250.973741535"/></g><g data-layer="30"><line id="cq" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="321.938344488" y1="250.973741535" x2="550.523399015" y2="250.973741535"/></g><g data-layer="30"><line id="ap" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="210.707472737" y1="102.665912533" x2="295.661454306" y2="139.742869784"/></g><g data-layer="30"><line i