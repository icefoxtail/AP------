<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 639" width="700" height="639" role="img" aria-labelledby="title desc"><title id="title">직각삼각형과 바깥쪽 세 반원</title><desc id="desc">A각이 직각인 삼각형의 세 변 AB, AC, BC를 지름으로 하는 반원이 각각 P, Q, R이다. 가로선 BC는 16 cm이다.</desc><rect width="700" height="639" fill="white" /><path d="M 358.00 113.62 A 169.8617 169.8617 0 0 0 114.00 350.00 Z" fill="none" stroke="#21639a" stroke-width="5.3" /><text x="179.0000" y="157.0000" font-size="38" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#21639a" text-anchor="middle">P</text><path d="M 587.00 350.00 A 164.5577 164.5577 0 0 0 358.00 113.62 Z" fill="none" stroke="#227365" stroke-width="5.3" /><text x="510.0000" y="177.0000" font-size="38" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#227365" text-anchor="middle">Q</text><path d="M 114.00 350.00 A 236.5000 236.5000 0 0 0 587.00 350.00 Z" fill="none" stroke="#a34c1f" stroke-width="5.3" /><text x="350.0000" y="505.0000" font-size="38" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#a34c1f" text-anchor="middle">R</text><line x1="335.0166" y1="135.8847" x2="357.2823" y2="158.8681" stroke="#687889" stroke-width="2.75" stroke-linecap="round" /><line x1="357.2823" y1="158.8681" x2="380.2657" y2="136.6024" stroke="#687889" stroke-width="2.75" stroke-linecap="round" /><text x="358.0000" y="93.6190" font-size="33" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#273846" text-anchor="middle">A</text><text x="92.0000" y="370.0000" font-size="33" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#273846" text-anchor="middle">B</text><text x="612.0000" y="370.0000" font-size="33" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#273846" text-anchor="middle">C</text><text x="350.0000" y="330.0000" font-size="35" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#a34c1f" text-anchor="middle">16 cm</text></svg>
