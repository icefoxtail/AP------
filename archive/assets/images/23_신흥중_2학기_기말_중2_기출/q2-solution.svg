<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 384 320" width="384" height="320" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">1:80의 비율은 실제 길이를 80으로 나눈 길이로 그린다는 뜻이다. 실제 가로 4.8 m는 480 cm이므로 480을 80으로 나누면 6 cm이고, 세로 3.6 m는 360 cm이므로 360을 80으로 나누면 4.5 cm이다. 따라서 답은 ②이다.</title><desc id="visual-desc">가로가 세로보다 긴 직사각형이 있고, 가로 변에 6, 세로 변에 4.5가 적혀 있다.</desc><rect width="384" height="320" fill="#fff"/><g data-layer="30"><line id="AB" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="49.142857143" y1="52.857142857" x2="49.142857143" y2="267.142857143"/></g><g data-layer="30"><line id="BC" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="49.142857143" y1="267.142857143" x2="334.857142857" y2="267.142857143"/></g><g data-layer="30"><line id="CD" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="334.857142857" y1="267.142857143" x2="334.857142857" y2="52.857142857"/></g><g data-layer="30"><line id="DA" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="334.857142857" y1="52.857142857" x2="49.142857143" y2="52.857142857"/></g><g data-layer="70"><circle id="A" data-role="point" stroke="#111" stroke-width="0.8" fill="#111" cx="49.142857143" cy="52.857142857" r="3.2"/></g><g data-layer="70"><circle id="B" data-role="point" stroke="#111" stroke-width="0.8" fill="#111" cx="49.142857143"