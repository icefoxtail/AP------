<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 758 578" width="758" height="578" role="img" aria-labelledby="title desc"><title id="title">같은 폭의 테두리를 가진 직사각형 액자</title><desc id="desc">바깥 직사각형 ABCD의 가로는 30 cm, 세로는 24 cm이다. 안쪽 직사각형 EFGH는 네 쪽 테두리 폭이 같은 액자 안에 놓인다. 안쪽의 가로 24 cm와 세로 18 cm를 표시했다.</desc><rect width="758" height="578" fill="white" /><rect x="111" y="96" width="462" height="369.6" rx="2" fill="#c8e6e4" stroke="#227365" stroke-width="5.2" /><rect x="157.2" y="142.2" width="369.6" height="277.20000000000005" fill="#f7fafb" stroke="#21639a" stroke-width="4.8" /><line x1="111.0000" y1="53.0000" x2="573.0000" y2="53.0000" stroke="#227365" stroke-width="2.3" stroke-linecap="round" /><line x1="111.0000" y1="46.0000" x2="111.0000" y2="60.0000" stroke="#227365" stroke-width="2" stroke-linecap="round" /><line x1="573.0000" y1="46.0000" x2="573.0000" y2="60.0000" stroke="#227365" stroke-width="2" stroke-linecap="round" /><text x="342.0000" y="38.0000" font-size="31" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#227365" text-anchor="middle">30 cm</text><line x1="604.0000" y1="96.0000" x2="604.0000" y2="465.6000" stroke="#227365" stroke-width="2.3" stroke-linecap="round" /><line x1="597.0000" y1="96.0000" x2="611.0000" y2="96.0000" stroke="#227365" stroke-width="2" stroke-linecap="round" /><line x1="597.0000" y1="465.6000" x2="611.0000" y2="465.6000" stroke="#227365" stroke-width="2" stroke-linecap="round" /><text x="671.0000" y="290.8000" font-size="31" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#227365" text-anchor="middle">24 cm</text><line x1="157.2000" y1="196.2000" x2="526.8000" y2="196.2000" stroke="#21639a" stroke-width="2.3" stroke-linecap="round" /><line x1="157.2000" y1="189.2000" x2="157.2000" y2="203.2000" stroke="#21639a" stroke-width="2" stroke-linecap="round" /><line x1="526.8000" y1="189.2000" x2="526.8000" y2="203.2000" stroke="#21639a" stroke-width="2" stroke-linecap="round" /><te