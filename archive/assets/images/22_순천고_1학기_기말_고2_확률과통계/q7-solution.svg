<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">그림의 아홉 점은 가로·세로가 각각 0, 1, 2인 3×3 격자점이다. 서로 다른 두 점을 고르는 경우는 36가지이고, 길이가 유리수이려면 두 점이 같은 가로줄이나 같은 세로줄에 있어야 한다. 가로줄마다 3쌍씩 9쌍, 세로줄마다 3쌍씩 9쌍이므로 유리수 길이의 선분은 18개이고 확률은 18/36=1/2이다. 따라서 답은 ④이다.</title><desc id="visual-desc">정사각형 4개가 붙은 3×3 격자점 아홉 개가 검은 점으로 표시되어 있고, 가로·세로 방향의 실선과 긴 점선이 격자를 이룬다. 아래와 왼쪽에는 한 칸의 길이 1과 두 칸의 길이 2를 나타내는 치수선이 있다.</desc><rect width="600" height="600" fill="#fff"/><g data-layer="30"><line id="sAB" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="109.630158724" y1="57.417121339" x2="321.439503219" y2="57.417121339"/></g><g data-layer="30"><line id="sBC" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="321.439503219" y1="57.417121339" x2="533.248847715" y2="57.417121339"/></g><g data-layer="30"><line id="sDE" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="109.630158724" y1="269.226465835" x2="321.439503219" y2="269.226465835"/></g><g data-layer="30"><line id="sEF" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="321.439503219" y1="269.226465835" x2="533.248847715" y2="269.226465835"/></g><g data-layer="30"><line id="sGH" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="109.630158724" y1="481.03581033" x2="32