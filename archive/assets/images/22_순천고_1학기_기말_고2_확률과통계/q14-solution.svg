<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 420" width="480" height="420" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">다섯 번 중 x축 방향으로 간 횟수를 k라 하면 점의 좌표는 (k, 2(5−k))이고 k=0부터 5까지의 점이 한 직선 위에 놓인다(이름 없는 점). 원점에서 거리가 5인 점은 피타고라스 정리 k²+4(5−k)²=25에서 k=3, 5이고 그림의 P(3, 4)와 Q(5, 0)이다. 독립시행 확률은 k=3일 때 10×(1/27)×(4/9)=40/243, k=5일 때 1/243이므로 합은 41/243이다. 따라서 답은 ②이다.</title><desc id="visual-desc">좌표평면에 원점과 두 점 P, Q가 있고 원점에서 P와 Q로 이어진 선분이 있으며 이름 없는 점 네 개가 더 찍혀 있다.</desc><rect width="480" height="420" fill="#fff"/><g data-layer="30"><line id="x-axis" data-role="axis" stroke="#111" stroke-width="1.2" fill="none" data-axis="x" x1="114.352941176" y1="314.705882353" x2="365.647058824" y2="314.705882353"/></g><g data-layer="30"><line id="y-axis" data-role="axis" stroke="#111" stroke-width="1.2" fill="none" data-axis="y" x1="187.647058824" y1="388" x2="187.647058824" y2="32"/></g><g data-layer="30"><line id="model-x-unit" data-role="tick" stroke="#111" stroke-width="0.8" fill="none" data-axis="x" data-value="1" x1="208.588235294" y1="314.705882353" x2="208.588235294" y2="318.705882353"/></g><g data-layer="30"><line id="model-y-unit" data-role="tick" stroke="#111" stroke-width="0.8" fill="none" data-axis="y" data-value="1" x1="187.647058824" y1="293.764705882" x2="183.647058824" y2="293.764705882"/></g><g data-layer="30"><line id="tick-x-1" da