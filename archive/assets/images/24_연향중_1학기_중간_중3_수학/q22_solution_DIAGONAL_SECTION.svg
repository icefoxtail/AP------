<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 410" width="600" height="410" role="img" aria-labelledby="title desc">
<title id="title">끈 한 방향의 단면과 사선 구간</title>
<desc id="desc">밑면 너비 40 cm, 높이 10 cm인 큰 상자 가운데 너비 20 cm, 높이 10 cm인 작은 상자가 놓여 있다. 끈은 작은 상자의 윗모서리와 큰 상자의 윗모서리를 사선으로 잇는다. 보조선이 만드는 직각삼각형의 가로와 세로는 각각 10 cm이다.</desc>
<style>text{font-family:'Noto Sans CJK KR','Noto Sans KR',sans-serif;fill:#182335;font-size:20px}.dim{stroke:#64748b;stroke-width:1.5;fill:none}.aux{stroke:#a16207;stroke-width:2;stroke-dasharray:6 5;fill:none}</style>
<rect width="600" height="410" fill="white"/>
<text x="30" y="35" font-size="25" font-weight="700">끈 한 방향의 단면</text>
<rect id="large-box" x="100" y="210" width="400" height="100" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
<rect id="small-box" x="200" y="110" width="200" height="100" fill="#e2e8f0" stroke="#475569" stroke-width="2"/>
<path id="rope" d="M 100 310 L 500 310 L 500 210 L 400 110 L 200 110 L 100 210 Z" fill="none" stroke="#2563eb" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<path id="right-triangle-legs" d="M 100 210 L 200 210 L 200 110" class="aux"/>
<path d="M 188 210 L 188 198 L 200 198" fill="none" stroke="#a16207" stroke-width="2"/>
<path id="top-dimension" d="M 200 88 L 400 88 M 200 82 L 200 94 M 400 82 L 400 94" class="dim"/>
<text x="300" y="77" text-anchor="middle">20 cm</text>
<path id="bottom-dimension" d="M 100 335 L 500 335 M 100 329 L 100 341 M 500 329 L 500 341" class="dim"/>
<text x="300" y="361" text-anchor="middle">40 cm</text>
<path id="lower-height-dimension" d="M 525 210 L 525 310 M 519 210 L 531 210 M 519 310 L 531 310" class="dim"/>
<text x="536" y="267">10 cm</text>
<path id="upper-height-dimension" d="M 225 110 L 225 210 M 219 110 L 231 110 M 219 210 L 231 210" class="dim"/>
<text x="237" y="166">10 cm</text>
<text x="150" y="240" text-anchor="middle" fill="#854d0e">10 cm</text>
<text x="30" y="395">사선 길이를 구한 뒤 두 방향의 끈을 합한다.</text>
</svg>
