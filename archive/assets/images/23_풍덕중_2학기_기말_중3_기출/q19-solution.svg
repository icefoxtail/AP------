<text x="45" y="148" font-size="14">A</text><text x="248" y="148" font-size="14">B</text><text x="124" y="148" font-size="14">C</text>
<text x="154" y="72" font-size="14">T</text><text x="217" y="52" font-size="14">D</text><text x="171" y="148" font-size="14">H</text>
<text x="73" y="107" font-size="13">∠DAB=26°</text><text x="215" y="111" font-size="13">CB는 지름이다.</text>
<text x="76" y="216" font-size="13">T에서 AT가 접하고 TH⊥AB이며 THBD는 원에 내접한다.</text>
<text x="105" y="234" font-size="13">x+y=90°, x−y=26° → x=58°</text>
