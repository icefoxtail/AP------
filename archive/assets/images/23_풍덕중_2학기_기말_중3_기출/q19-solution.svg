<line x1="60" y1="130" x2="213.488" y2="55.139" stroke="black" stroke-width="2"/>
<line x1="166.709" y1="77.954" x2="166.709" y2="130" stroke="black" stroke-width="1.8"/>
<path d="M166.709 120 h10 v10" fill="none" stroke="black" stroke-width="1.4"/>
