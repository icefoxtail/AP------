<title id="svg-title-44234baccb">접선·지름·원주각으로 구하는 각</title><desc id="svg-desc-44234baccb">THBD는 원에 내접하고 CB는 지름이다. x=∠DHB=∠DTB=∠TCB, y=∠TBC라 두면 x+y=90°, x−y=26°이므로 x=58°이다.</desc><rect width="360" height="240" fill="white"/>
