<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 240" role="img" aria-labelledby="svg-title-de65b3e8a7" aria-describedby="svg-desc-de65b3e8a7"><title id="svg-title-de65b3e8a7">현의 중점과 호 AB의 길이</title><desc id="svg-desc-de65b3e8a7">∠ACB=60°이므로 ∠AOB=120°이다. M은 AB의 중점이라 OM⊥AB이며 OM=2에서 반지름 OA=4이다. 호 AB의 길이는 (120/360)·2π·4=8π/3이다.</desc><rect width="360" height="240" fill="white"/><circle cx="180" cy="120" r="88" fill="none" stroke="black" stroke-width="2"/><line x1="103.8" y1="164" x2="256.2" y2="164" stroke="black" stroke-width="2"/><line x1="180" y1="120" x2="103.8" y2="164" stroke="black" stroke-width="1.8"/><line x1="180" y1="120" x2="256.2" y2="164" stroke="black" stroke-width="1.8"/><line x1="180" y1="120" x2="180" y2="164" stroke="black" stroke-width="1.6"/><line x1="103.8" y1="164" x2="180" y2="32" stroke="black" stroke-width="1.5"/><line x1="256.2" y1="164" x2="180" y2="32" stroke="black" stroke-width="1.5"/><path d="M180 154 h10 v10" fill="none" stroke="black"/><text x="92" y="181" font-size="14">A</text><text x="262" y="181" font-size="14">B</text><text x="184" y="184" font-size="14">M</text><text x="184" y="29" font-size="14">C</text><text x="164" y="115" font-size="14">O</text><text x="191" y="145" font-size="13">OM=2</text><text x="164" y="63" font-size="13">∠ACB=60°</text><text x="105" y="220" font-size="13">∠AOB=120°, R=4 → 호 AB=8π/3</text></svg>