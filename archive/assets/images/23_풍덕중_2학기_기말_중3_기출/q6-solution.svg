<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 240" role="img" aria-labelledby="svg-title-69c74572b0" aria-describedby="svg-desc-69c74572b0">
<title id="svg-title-69c74572b0">현의 길이와 중심에서 현까지 거리</title><desc id="svg-desc-69c74572b0">OH⊥AB이고 H는 AB의 중점이다. OB=4, OH=2에서 BH=√(4²−2²)=2√3이므로 AB=4√3이다. AB=CD이고 중심에서 CD까지의 거리도 2이므로 [△OCD]=4√3.</desc><rect width="360" height="240" fill="white"/>
<circle cx="180" cy="120" r="90" fill="none" stroke="black" stroke-width="2"/>
<line x1="102.1" y1="165" x2="257.9" y2="165" stroke="black" stroke-width="2"/>
<line x1="102.1" y1="75" x2="257.9" y2="75" stroke="black" stroke-width="2"/>
<line x1="180" y1="120" x2="257.9" y2="165" stroke="black" stroke-width="2"/>
<line x1="180" y1="120" x2="180" y2="165" stroke="black" stroke-width="2"/>
<line x1="180" y1="120" x2="102.1" y2="75" stroke="black" stroke-width="1.6"/>
<line x1="180" y1="120" x2="257.9" y2="75" stroke="black" stroke-width="1.6"/>
<path d="M180 155 h10 v10" fill="none" stroke="black" stroke-width="1.5"/>
<text x="173" y="114" font-size="14">O</text><text x="92" y="184" font-size="14">A</text><text x="262" y="184" font-size="14">B</text>
<text x="92" y="68" font-size="14">C</text><text x="262" y="68" font-size="14">D</text><text x="185" y="181" font-size="14">H</text>
<text x="200" y="145" font-size="13">OB=4</text><text x="187" y="146" font-size="13"/>
<text x="150" y="145" font-size="13">OH=2</text>
<text x="112" y="215" font-size="13">AB=CD=4√3 → [△OCD]=4√3</text>
</svg>