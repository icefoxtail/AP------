<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 480" width="680" height="480" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">네 평행선 k, l, m, n이 두 직선과 만나는 그림이다. 첫 번째 직선에는 k와 l 사이 8, l과 m 사이 6, l과 n 사이 y가 표시되어 있다.</title><desc id="visual-desc">네 가로 평행선 k, l, m, n을 두 직선이 가로지른다. 왼쪽 직선에는 8과 6 및 전체 y가, 오른쪽 직선에는 12, x, 6이 표시되어 있다.</desc><rect width="680" height="480" fill="#fff"/><g data-layer="30"><line id="sk" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="65" y1="69.310344828" x2="615" y2="69.310344828"/></g><g data-layer="30"><line id="sl" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="65" y1="221.034482759" x2="615" y2="221.034482759"/></g><g data-layer="30"><line id="sm" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="65" y1="334.827586207" x2="615" y2="334.827586207"/></g><g data-layer="30"><line id="sn" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="65" y1="410.689655172" x2="615" y2="410.689655172"/></g><g data-layer="31"><line id="sK1L1" data-role="line" stroke="#1f5fa8" stroke-width="2.4" fill="none" x1="102.931034483" y1="69.310344828" x2="102.931034483" y2="221.034482759"/></g><g data-layer="31"><line id="sL1M1" data-role="line" stroke="#1f5fa8" stroke-width="2.4" fill="none" x1="102.931034483" y1="221.034482759" x2="102.931034483" y2="334.827586207