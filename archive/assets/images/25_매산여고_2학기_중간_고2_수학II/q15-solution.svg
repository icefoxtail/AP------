<svg xmlns="http://www.w3.org/2000/svg" width="640" height="450" viewBox="0 0 640 450" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc" data-fact-hash="sha256:eaf8d8bd13c236de88bbaa1adec4afe73255af05a8b5ff70e5a9f78b81fe6c2d" data-visual-provenance="PYTHON_DERIVED_LAYOUT_REVIEWED">
  <title id="title">25 매산여고 15번 교점 개수 함수 해설</title>
  <desc id="desc">y=(3x+1)/(x+1)의 치역에서 3만 빠져 f(3)=0, g(3)=0이 되도록 a=6을 정한다</desc>
  <style>.background{fill:#fff}.axis{stroke:#171717;stroke-width:1.4;fill:none;stroke-linecap:round;stroke-linejoin:round}.curve{stroke:#111;stroke-width:2.1;fill:none;stroke-linecap:round;stroke-linejoin:round}.tangent{stroke:#b23a48;stroke-width:2;fill:none;stroke-linecap:round}.normal{stroke:#b23a48;stroke-width:2;fill:none;stroke-linecap:round}.perp{stroke:#356a9a;stroke-width:1.9;fill:none;stroke-linecap:round}.secant{stroke:#356a9a;stroke-width:1.9;fill:none;stroke-linecap:round}.line{stroke:#356a9a;stroke-width:1.9;fill:none;stroke-linecap:round}.line-main{stroke:#356a9a;stroke-width:1.9;fill:none;stroke-linecap:round}.level{stroke:#6b7280;stroke-width:1.2;stroke-dasharray:5 4;fill:none}.guide{stroke:#777;stroke-width:.95;stroke-dasharray:4 4;fill:none}.point{stroke:#111;stroke-width:1;fill:#111}.open{stroke:#111;stroke-width:1.3;fill:#fff}.closed{stroke:#111;stroke-width:1;fill:#111}.panel{fill:#f7f8fa;stroke:#c7cbd1;stroke-width:1}.title{font-family:"Noto Sans KR","Pretendard","Malgun Gothic",sans-serif;font-size:15px;font-weight:700;fill:#111}.label{font-family:"Noto Sans KR","Pretendard","Malgun Gothic",sans-serif;font-size:12px;fill:#222}.small{font-family:"Noto Sans KR","Pretendard","Malgun Gothic",sans-serif;font-size:11px;fill:#333}.math{font-family:"STIX Two Math","Cambria Math","Times New Roman",serif;font-size:13px;fill:#111}</style>
  <defs><marker id="axis-arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L6,3 L0,6 Z" fill="#171717"/></marker><clipPath id="graph-clip"><rect x="32" y="65" width="342" height="296" rx="8"/></clipPath></defs>
  <rect class="background" x="0" y="0" width="640" height="450"/>
  <text class="title" x="32.000" y="28.000">25 매산여고 15번 교점 개수 함수</text>
  <text class="small" x="32.000" y="47.000">y=(3x+1)/(x+1)의 치역에서 3만 빠져 f(3)=0, g(3)=0이 되도록 a=6을 정한다</text>
  <g aria-label="graph"><rect class="panel" x="32" y="65" width="342" height="296" rx="8"/><g clip-path="url(#graph-clip)"><line class="axis" x1="52.000" y1="246.000" x2="350.000" y2="246.000"/><line class="axis" x1="100.000" y1="320.000" x2="100.000" y2="82.000"/><line class="curve" x1="54.000" y1="154.000" x2="216.000" y2="154.000"/><line class="curve" x1="224.000" y1="154.000" x2="348.000" y2="154.000"/><line class="guide" x1="220.000" y1="154.000" x2="220.000" y2="246.000"/><circle class="point" cx="220.000" cy="246.000" r="4.00"/><circle class="open" cx="220.000" cy="154.000" r="4.60"/><text class="label" x="208.000" y="268.000">t=3</text><text class="label" x="226.000" y="148.000">f(3)=0</text><text class="math" x="354.000" y="251.000">t</text><text class="math" x="106.000" y="88.000">f(t)</text></g></g>
  <g aria-label="calculation"><rect class="panel" x="392" y="65" width="216" height="296" rx="8"/><text class="title" x="410.000" y="92.000">계산</text><text class="math" x="410.000" y="132.000">y=3−2/(x+1)</text><text class="math" x="410.000" y="166.000">t≠3: f(t)=1</text><text class="math" x="410.000" y="200.000">t=3: f(3)=0</text><text class="math" x="410.000" y="234.000">g(3)=−6+a=0</text><text class="math" x="410.000" y="268.000">a=6</text><text class="label" x="410.000" y="302.000">정답: ③</text></g>
  <rect class="panel" x="32" y="382" width="576" height="38" rx="7"/><text class="small" x="50.000" y="406.000">교점 개수 함수의 유일한 불연속점 t=3과 g의 영점을 일치시킨다.</text>
</svg>
