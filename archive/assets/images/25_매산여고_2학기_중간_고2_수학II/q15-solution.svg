<svg xmlns="http://www.w3.org/2000/svg" width="640" height="430" viewBox="0 0 640 430" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc">
  <title id="title">25 매산여고 15번 교점 개수 함수 해설</title>
  <desc id="desc">y=(3x+1)/(x+1)의 치역에서 3만 빠져 f(3)=0, g(3)=0이 되도록 a=6을 정한다</desc>
  <style>.background{fill:#fff}.axis{stroke:#171717;stroke-width:1.3;fill:none;stroke-linecap:round;stroke-linejoin:round}.curve{stroke:#111;stroke-width:2.1;fill:none;stroke-linecap:round;stroke-linejoin:round}.step{stroke:#b23a48;stroke-width:2;fill:none;stroke-linecap:round}.guide{stroke:#777;stroke-width:.95;stroke-dasharray:4 4;fill:none}.point{stroke:#111;stroke-width:1;fill:#111}.panel{fill:#f7f8fa;stroke:#c7cbd1;stroke-width:1}.title{font-family:"Noto Sans KR","Pretendard","Malgun Gothic",sans-serif;font-size:15px;font-weight:700;fill:#111}.label{font-family:"Noto Sans KR","Pretendard","Malgun Gothic",sans-serif;font-size:12px;fill:#222}.small{font-family:"Noto Sans KR","Pretendard","Malgun Gothic",sans-serif;font-size:11px;fill:#333}.math{font-family:"STIX Two Math","Cambria Math","Times New Roman",serif;font-size:13px;fill:#111}</style>
  <rect class="background" x="0" y="0" width="640" height="430"/><text class="title" x="32" y="28">q15  교점 개수 함수와 영점</text><text class="small" x="32" y="47">유리함수의 빠진 값 t=3에서 f(t)가 한 단계 내려가고 g(3)=0이 된다.</text>
  <g aria-label="step-graph"><rect class="panel" x="32" y="65" width="342" height="278" rx="8"/><line class="axis" x1="52" y1="246" x2="350" y2="246"/><line class="axis" x1="202" y1="320" x2="202" y2="82"/><path class="step" d="M54 154 L182 154 M222 154 L348 154"/><path class="step" d="M54 154 L54 246 M348 154 L348 246"/><circle class="point" cx="202" cy="246" r="4"/><circle cx="202" cy="154" r="4.6" fill="#fff" stroke="#b23a48" stroke-width="1.5"/><line class="guide" x1="202" y1="154" x2="202" y2="246"/><text class="label" x="194" y="268">t=3</text><text class="label" x="208" y="148">f(3)=0</text><text class="math" x="354" y="251">t</text><text class="math" x="208" y="88">f(t)</text></g>
  <g aria-label="calculation"><rect class="panel" x="392" y="65" width="216" height="278" rx="8"/><text class="title" x="410" y="92">계산</text><text class="math" x="410" y="132">y=3−2/(x+1)</text><text class="math" x="410" y="168">t≠3: f(t)=1</text><text class="math" x="410" y="204">t=3: f(3)=0</text><text class="math" x="410" y="240">g(3)=−6+a=0</text><text class="math" x="410" y="276">a=6</text><text class="label" x="410" y="318">정답: ③</text></g>
  <rect class="panel" x="32" y="364" width="576" height="38" rx="7"/><text class="small" x="50" y="388">교점 개수의 불연속점과 일차식 g의 영점을 같은 입력 t=3에 맞춘다.</text>
</svg>
