<svg xmlns="http://www.w3.org/2000/svg" width="640" height="440" viewBox="0 0 640 440" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc">
  <title id="title">25 매산여고 16번 교점 개수와 이차함수 해설</title>
  <desc id="desc">직선 y=mx와 구간별 함수의 교점 개수 g가 m=2,4에서 불연속이고 h(x)=(x−2)(x−4)이다</desc>
  <style>.background{fill:#fff}.axis{stroke:#171717;stroke-width:1.3;fill:none;stroke-linecap:round;stroke-linejoin:round}.curve{stroke:#111;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}.line{stroke:#356a9a;stroke-width:1.8;fill:none;stroke-linecap:round}.step{stroke:#b23a48;stroke-width:2;fill:none}.guide{stroke:#777;stroke-width:.95;stroke-dasharray:4 4;fill:none}.point{stroke:#111;stroke-width:1;fill:#111}.panel{fill:#f7f8fa;stroke:#c7cbd1;stroke-width:1}.title{font-family:"Noto Sans KR","Pretendard","Malgun Gothic",sans-serif;font-size:15px;font-weight:700;fill:#111}.label{font-family:"Noto Sans KR","Pretendard","Malgun Gothic",sans-serif;font-size:12px;fill:#222}.small{font-family:"Noto Sans KR","Pretendard","Malgun Gothic",sans-serif;font-size:11px;fill:#333}.math{font-family:"STIX Two Math","Cambria Math","Times New Roman",serif;font-size:13px;fill:#111}</style>
  <rect class="background" x="0" y="0" width="640" height="440"/><text class="title" x="32" y="28">q16  교점 개수의 불연속</text><text class="small" x="32" y="47">절댓값을 구간별 직선으로 나누어 m의 허용 범위를 세고 h의 영점을 정한다.</text>
  <g aria-label="piecewise-graph"><rect class="panel" x="32" y="65" width="342" height="286" rx="8"/><line class="axis" x1="52" y1="270" x2="350" y2="270"/><line class="axis" x1="176" y1="330" x2="176" y2="82"/><path class="curve" d="M54 310 L176 186 L350 104"/><path class="line" d="M54 310 L350 128"/><circle class="point" cx="176" cy="186" r="4"/><text class="label" x="166" y="292">x=1</text><text class="label" x="280" y="132">y=mx</text><text class="math" x="354" y="275">x</text><text class="math" x="182" y="88">f</text></g>
  <g aria-label="step-graph"><rect class="panel" x="392" y="65" width="216" height="286" rx="8"/><text class="title" x="410" y="92">g(m)</text><line class="axis" x1="410" y1="276" x2="590" y2="276"/><line class="axis" x1="462" y1="320" x2="462" y2="110"/><path class="step" d="M412 170 L462 170 M462 276 L520 276 M520 170 L588 170"/><circle cx="462" cy="170" r="4.5" fill="#fff" stroke="#b23a48" stroke-width="1.5"/><circle class="point" cx="462" cy="276" r="4"/><circle cx="520" cy="170" r="4.5" fill="#fff" stroke="#b23a48" stroke-width="1.5"/><text class="label" x="452" y="300">2</text><text class="label" x="512" y="300">4</text><text class="small" x="410" y="336">g=0 on [2,4]</text></g>
  <g aria-label="calculation"><rect class="panel" x="32" y="368" width="576" height="42" rx="7"/><text class="math" x="50" y="394">g의 불연속: m=2,4  ⇒  h(x)=(x−2)(x−4)  ⇒  h(7)=15  정답: ②</text></g>
</svg>
