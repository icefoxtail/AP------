<svg xmlns="http://www.w3.org/2000/svg" width="640" height="450" viewBox="0 0 640 450" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc" data-fact-hash="sha256:e856dddebb3a35189561be69eb3da91140030cee118414a51a603b735ce8182e" data-visual-provenance="PYTHON_DERIVED_LAYOUT_REVIEWED">
  <title id="title">25 매산여고 16번 교점 개수와 이차함수 해설</title>
  <desc id="desc">직선 y=mx와 구간별 함수의 교점 개수 g가 m=2,4에서 불연속이고 h(x)=(x−2)(x−4)이다</desc>
  <style>.background{fill:#fff}.axis{stroke:#171717;stroke-width:1.4;fill:none;stroke-linecap:round;stroke-linejoin:round}.curve{stroke:#111;stroke-width:2.1;fill:none;stroke-linecap:round;stroke-linejoin:round}.tangent{stroke:#b23a48;stroke-width:2;fill:none;stroke-linecap:round}.normal{stroke:#b23a48;stroke-width:2;fill:none;stroke-linecap:round}.perp{stroke:#356a9a;stroke-width:1.9;fill:none;stroke-linecap:round}.secant{stroke:#356a9a;stroke-width:1.9;fill:none;stroke-linecap:round}.line{stroke:#356a9a;stroke-width:1.9;fill:none;stroke-linecap:round}.line-main{stroke:#356a9a;stroke-width:1.9;fill:none;stroke-linecap:round}.level{stroke:#6b7280;stroke-width:1.2;stroke-dasharray:5 4;fill:none}.guide{stroke:#777;stroke-width:.95;stroke-dasharray:4 4;fill:none}.point{stroke:#111;stroke-width:1;fill:#111}.open{stroke:#111;stroke-width:1.3;fill:#fff}.closed{stroke:#111;stroke-width:1;fill:#111}.panel{fill:#f7f8fa;stroke:#c7cbd1;stroke-width:1}.title{font-family:"Noto Sans KR","Pretendard","Malgun Gothic",sans-serif;font-size:15px;font-weight:700;fill:#111}.label{font-family:"Noto Sans KR","Pretendard","Malgun Gothic",sans-serif;font-size:12px;fill:#222}.small{font-family:"Noto Sans KR","Pretendard","Malgun Gothic",sans-serif;font-size:11px;fill:#333}.math{font-family:"STIX Two Math","Cambria Math","Times New Roman",serif;font-size:13px;fill:#111}</style>
  <defs><marker id="axis-arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L6,3 L0,6 Z" fill="#171717"/></marker><clipPath id="graph-clip"><rect x="32" y="65" width="342" height="296" rx="8"/></clipPath></defs>
  <rect class="background" x="0" y="0" width="640" height="450"/>
  <text class="title" x="32.000" y="28.000">25 매산여고 16번 교점 개수와 이차함수</text>
  <text class="small" x="32.000" y="47.000">직선 y=mx와 구간별 함수의 교점 개수 g가 m=2,4에서 불연속이고 h(x)=(x−2)(x−4)이다</text>
  <g aria-label="graph"><rect class="panel" x="32" y="65" width="342" height="296" rx="8"/><g clip-path="url(#graph-clip)"><line class="axis" x1="52.000" y1="276.000" x2="352.000" y2="276.000" marker-end="url(#axis-arrow)"/><line class="axis" x1="100.000" y1="320.000" x2="100.000" y2="110.000" marker-end="url(#axis-arrow)"/><line class="curve" x1="54.000" y1="226.000" x2="175.000" y2="226.000"/><line class="curve" x1="185.000" y1="276.000" x2="255.000" y2="276.000"/><line class="curve" x1="265.000" y1="226.000" x2="350.000" y2="226.000"/><circle class="open" cx="180.000" cy="226.000" r="4.50"/><circle class="point" cx="180.000" cy="276.000" r="4.00"/><circle class="open" cx="260.000" cy="226.000" r="4.50"/><circle class="point" cx="260.000" cy="276.000" r="4.00"/><text class="label" x="172.000" y="300.000">2</text><text class="label" x="252.000" y="300.000">4</text><text class="math" x="354.000" y="281.000">m</text><text class="math" x="106.000" y="116.000">g(m)</text><text class="small" x="52.000" y="335.000">2≤m≤4에서 g=0</text></g></g>
  <g aria-label="calculation"><rect class="panel" x="392" y="65" width="216" height="296" rx="8"/><text class="title" x="410.000" y="92.000">계산</text><text class="math" x="410.000" y="132.000">f=2x+3 (x&lt;1)</text><text class="math" x="410.000" y="166.000">f=4x+1 (x≥1)</text><text class="math" x="410.000" y="200.000">g의 불연속: m=2,4</text><text class="math" x="410.000" y="234.000">h(x)=(x−2)(x−4)</text><text class="math" x="410.000" y="268.000">h(7)=15</text><text class="label" x="410.000" y="302.000">정답: ②</text></g>
  <rect class="panel" x="32" y="382" width="576" height="38" rx="7"/><text class="small" x="50.000" y="406.000">m=2와 m=4의 끝점 포함 여부를 열린 점과 채운 점으로 표시한다.</text>
</svg>
