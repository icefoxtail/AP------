<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc" data-scale-policy="SCHEMATIC_ALLOWED" data-visual-provenance="reconstructed_from_independent_solution_facts">
  <title id="title">문항 13 해설: AH/BH의 극한</title>
  <desc id="desc">y=√2x/(x−1)과 y=t, y=2의 교점 A와 B, A에서 y=2에 내린 수선의 발 H를 표시하고 t가 2로 갈 때 AH/BH를 계산한다.</desc>
  <style>
    text{font-family:Arial,"Malgun Gothic",sans-serif;fill:#111827}.axis{stroke:#111827;stroke-width:1.2}.curve{fill:none;stroke:#111827;stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round}.level{fill:none;stroke:#2563eb;stroke-width:1.8}.base{fill:none;stroke:#0f766e;stroke-width:2}.guide{fill:none;stroke:#64748b;stroke-width:1.2;stroke-dasharray:5 4}.point{stroke:#fff;stroke-width:1}.label{font-size:22px;font-weight:700}.small{font-size:17px}.formula{font-family:Georgia,"Times New Roman",serif;font-size:22px}.panel-title{font-size:23px;font-weight:700}.panel-text{font-size:19px}.muted{fill:#475569;font-size:15px}
  </style>
  <rect id="background" x="0" y="0" width="800" height="520" rx="16" fill="#f8fafc"/><rect id="diagram-panel" x="24" y="24" width="468" height="472" rx="14" fill="#fff" stroke="#cbd5e1"/><rect id="formula-panel" x="516" y="24" width="260" height="472" rx="14" fill="#fff" stroke="#cbd5e1"/>
  <line id="x-axis" class="axis" x1="48" y1="420" x2="478" y2="420"/><line id="y-axis" class="axis" x1="90" y1="470" x2="90" y2="48"/><circle id="anchor-x-unit" cx="185" cy="420" r="1" fill="#111827"/><circle id="anchor-y-unit" cx="90" cy="350" r="1" fill="#111827"/><text x="460" y="409" class="label">x</text><text x="98" y="66" class="label">y</text>
  <path id="curve-sqrt2-rational" class="curve" d="M232.5 123 C252 160 265 202 280 222 S312 249 327.5 255 S358 269 375 271 S407 278 422.5 279 S452 283 478 286"/>
  <line id="level-y-t" class="level" x1="48" y1="210" x2="478" y2="210"/><line id="level-y-2" class="base" x1="48" y1="280" x2="478" y2="280"/><line id="height-ah" class="guide" x1="269.7215521823332" y1="210" x2="269.7215521823332" y2="280"/><line id="distance-bh" class="base" x1="269.7215521823332" y1="280" x2="414.3502884254441" y2="280"/>
  <circle id="point-a" class="point" cx="269.7215521823332" cy="210" r="5" fill="#dc2626"/><circle id="point-b" class="point" cx="414.3502884254441" cy="280" r="5" fill="#dc2626"/><circle id="point-h" class="point" cx="269.7215521823332" cy="280" r="5" fill="#0f766e"/>
  <text x="278" y="203" class="label">A</text><text x="422" y="273" class="label">B</text><text x="260" y="302" class="label">H</text><text x="62" y="203" class="small">y=t</text><text x="62" y="273" class="small">y=2</text><text x="300" y="238" class="small" fill="#dc2626">AH=t−2</text><text x="315" y="302" class="small" fill="#0f766e">BH</text><text x="310" y="120" class="label">y=√2x/(x−1)</text><text x="52" y="454" class="muted">t=3 대표 배치 · t→2+이면 A→B</text>
  <text x="536" y="64" class="panel-title">교점의 x좌표</text><line x1="536" y1="78" x2="756" y2="78" stroke="#e2e8f0"/><text x="536" y="118" class="formula">x_A=t/(t−√2)</text><text x="536" y="158" class="formula">x_B=2/(2−√2)</text><text x="536" y="198" class="panel-text">AH=t−2</text><text x="536" y="238" class="panel-text">BH=x_B−x_A</text>
  <text x="536" y="294" class="panel-title">극한 정리</text><line x1="536" y1="308" x2="756" y2="308" stroke="#e2e8f0"/><text x="536" y="350" class="formula">lim AH/BH</text><text x="536" y="388" class="formula">=(2−√2)²/√2</text><text x="536" y="426" class="formula">=3√2−4</text><text x="536" y="466" class="panel-text">a+b=−4+3=−1</text>
</svg>
