  <title id="title">문항 2 해설: 좌극한과 우극한 읽기</title>
  <desc id="desc">x=0의 왼쪽에서 열린 점 (0,-1)로, x=1의 오른쪽에서 열린 점 (1,-1)로 접근하는 그래프를 표시한다.</desc>
  <style>
    text{font-family:Arial,"Malgun Gothic",sans-serif;fill:#111827}.axis{stroke:#111827;stroke-width:1.2}.branch{fill:none;stroke:#111827;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}.guide{fill:none;stroke:#64748b;stroke-width:1;stroke-dasharray:5 4}.open{fill:#fff;stroke:#dc2626;stroke-width:2}.closed{fill:#2563eb;stroke:#fff;stroke-width:1}.label{font-size:21px;font-weight:700}.small{font-size:17px}.formula{font-family:Georgia,"Times New Roman",serif;font-size:24px}.panel-title{font-size:23px;font-weight:700}.panel-text{font-size:20px}.muted{fill:#475569;font-size:15px}
  </style>
