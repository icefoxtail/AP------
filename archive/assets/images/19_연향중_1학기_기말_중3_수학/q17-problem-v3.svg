<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 711 546" width="711" height="546" role="img" aria-labelledby="title desc"><title id="title">직선이 포물선 안쪽 삼각형의 넓이를 반으로 나누는 지점</title><desc id="desc">파란 포물선의 두 가로축 교점 A와 B, 세로축 교점 C를 세 변으로 이었다. 보라 직선은 C를 지나 삼각형의 넓이를 반으로 나눈다.</desc><rect width="711" height="546" fill="white" /><polygon points="168.7973,256.4351 576.4983,256.4351 508.5481,346.5793" fill="none" /><line x1="56.0000" y1="256.4351" x2="656.0000" y2="256.4351" stroke="#586574" stroke-width="1.65" stroke-linecap="round" /><polygon points="656.0000,256.4351 643.0000,251.4351 643.0000,261.4351" fill="#586574" /><text x="673.0000" y="248.4351" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#586574" text-anchor="middle">x</text><line x1="508.5481" y1="447.0000" x2="508.5481" y2="72.0000" stroke="#586574" stroke-width="1.65" stroke-linecap="round" /><polygon points="508.5481,72.0000 503.5481,85.0000 513.5481,85.0000" fill="#586574" /><text x="524.5481" y="78.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#586574" text-anchor="middle">y</text><circle cx="508.5481313703284" cy="256.4350961538462" r="4.6" fill="#28364b" /><text x="493.5481" y="283.4351" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">O</text><path d="M 81.8211 88.4351 Q 369.9298 742.7812 658.0385 100.6659" stroke="#205d9c" stroke-width="5.8" stroke-linecap="round" fill="none" /><line x1="118.5142" y1="87.8654" x2="623.3839" y2="422.7512" stroke="#704895" stroke-width="4.3" stroke-linecap="round" stroke-dasharray="11 5" /><line x1="168.7973" y1="256.4351" x2="576.4983" y2="256.4351" stroke="#aa5411" stroke-width="3.6" stroke-linecap="round" /><line x1="168.7973" y1="256.4351" x2="508.5481" y2="346.5793" stroke="#aa5411" stroke-width="3.6" stroke-linecap="round" /><line x1="576.4983" y1="256.4351" x2="508.5481" y2="346.5793" stroke="#aa5411" stroke-width="3.6" stroke-linecap="round" /><circle cx="168.797281993205" cy="256.4350961538462" r="4.6" fill="#aa5411" /><text x="183.7973" y="239.4351" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#aa5411" text-anchor="middle">A</text><circle cx="576.498301245753" cy="256.4350961538462" r="4.6" fill="#aa5411" /><text x="561.4983" y="238.4351" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#aa5411" text-anchor="middle">B</text><circle cx="508.5481313703284" cy="346.5793269230769" r="4.6" fill="#704895" /><text x="563.5481" y="365.5793" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#704895" text-anchor="middle">C</text><text x="230.0000" y="56.0000" font-size="30" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#205d9c" text-anchor="middle">y = x² + 4x − 5</text><line x1="473.0000" y1="491.0000" x2="520.0000" y2="491.0000" stroke="#704895" stroke-width="3.75" stroke-linecap="round" stroke-dasharray="11 5" /><text x="532.0000" y="501.0000" font-size="30" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#704895" text-anchor="start">y = mx + n</text></svg>
