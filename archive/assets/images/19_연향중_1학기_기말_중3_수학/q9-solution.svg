<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 713 509" width="713" height="509" role="img" aria-labelledby="title desc"><title id="title">분출물의 높이가 기준을 넘는 시간의 범위</title><desc id="desc">파란 포물선은 분출 후 높이이다. 높이 3500 m의 주황 수평선 위에 놓이는 곡선 부분을 옅은 주황으로 칠했다.</desc><rect width="713" height="509" fill="white" /><line x1="81.0000" y1="426.0000" x2="655.0000" y2="426.0000" stroke="#586574" stroke-width="1.65" stroke-linecap="round" /><line x1="90.1111" y1="426.0000" x2="90.1111" y2="69.0000" stroke="#586574" stroke-width="1.65" stroke-linecap="round" /><text x="160.0000" y="49.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#586574" text-anchor="middle">높이(m)</text><text x="634.0000" y="470.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#586574" text-anchor="middle">t(초)</text><path d="M 272.3333 131.7692 Q 363.4444 66.3846 454.5556 131.7692 Z" fill="#fae6ce" /><line x1="90.1111" y1="131.7692" x2="636.7778" y2="131.7692" stroke="#aa5411" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="7 5" /><path d="M 90.1111 393.3077 Q 363.4444 -195.1538 636.7778 393.3077" stroke="#205d9c" stroke-width="5.8" stroke-linecap="round" fill="none" /><line x1="272.3333" y1="426.0000" x2="272.3333" y2="131.7692" stroke="#704895" stroke-width="1.9" stroke-linecap="round" stroke-dasharray="6 5" /><circle cx="272.33333333333337" cy="131.76923076923077" r="4.6" fill="#aa5411" /><text x="272.3333" y="458.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#704895" text-anchor="middle">10</text><line x1="454.5556" y1="426.0000" x2="454.5556" y2="131.7692" stroke="#704895" stroke-width="1.9" stroke-linecap="round" stroke-dasharray="6 5" /><circle cx="454.55555555555554" cy="131.76923076923077" r="4.6" fill="#aa5411" /><text x="454.5556" y="458.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#7