<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 719 498" width="719" height="498" role="img" aria-labelledby="title desc"><title id="title">오른쪽으로 옮긴 포물선에서 높아지는 가지</title><desc id="desc">선 모양으로 구분한 왼쪽 주황 가지를 따라 오른쪽으로 움직이면 꼭짓점까지 높이가 올라간다.</desc><rect width="719" height="498" fill="white" /><line x1="52.0000" y1="166.0857" x2="653.0000" y2="166.0857" stroke="#586574" stroke-width="1.65" stroke-linecap="round" /><polygon points="653.0000,166.0857 640.0000,161.0857 640.0000,171.0857" fill="#586574" /><text x="670.0000" y="158.0857" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#586574" text-anchor="middle">x</text><line x1="60.9302" y1="422.0000" x2="60.9302" y2="55.0000" stroke="#586574" stroke-width="1.65" stroke-linecap="round" /><polygon points="60.9302,55.0000 55.9302,68.0000 65.9302,68.0000" fill="#586574" /><text x="76.9302" y="61.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#586574" text-anchor="middle">y</text><circle cx="60.93016344725112" cy="166.08574380165288" r="4.6" fill="#28364b" /><text x="45.9302" y="193.0857" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">O</text><path d="M 183.2734 392.4542 Q 256.0542 90.2593 328.8351 90.2593" stroke="#aa5411" stroke-width="5.6" stroke-linecap="round" fill="none" stroke-dasharray="12 5" /><path d="M 328.8351 90.2593 Q 401.6159 90.2593 474.3967 392.4542" stroke="#205d9c" stroke-width="5.6" stroke-linecap="round" fill="none" /><circle cx="328.8350668647846" cy="90.25929752066116" r="4.6" fill="#aa5411" /><line x1="328.8351" y1="389.7738" x2="328.8351" y2="90.2593" stroke="#704895" stroke-width="1.95" stroke-linecap="round" stroke-dasharray="6 5" /><text x="178.0000" y="465.0000" font-size="30" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#aa5411" text-anchor="middle">높아지는 왼쪽 가지</text></svg>
