<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 654 551" width="654" height="551" role="img" aria-labelledby="title desc"><title id="title">절반으로 잘라도 닮은 A4와 A5 용지</title><desc id="desc">세로로 놓인 A4의 짧은 변은 2, 긴 변은 x+1이다. 가운데 접을 선이 A4를 두 장의 A5로 나누고, 위쪽 A5를 반으로 나누면 A6가 된다.</desc><rect width="654" height="551" fill="white" /><rect x="180" y="67" width="282" height="398.80822458921284" fill="#e1eefb" stroke="#205d9c" stroke-width="4.3" /><rect x="180" y="266.4041122946064" width="282" height="199.40411229460642" fill="#fae6ce" stroke="#aa5411" stroke-width="4.1" /><text x="321.0000" y="378.1062" font-size="37" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#aa5411" text-anchor="middle">A5</text><line x1="321.0000" y1="67.0000" x2="321.0000" y2="266.4041" stroke="#586574" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="6 5" /><text x="391.5000" y="177.7021" font-size="36" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#205d9c" text-anchor="middle">A6</text><text x="321.0000" y="44.0000" font-size="31" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">A4 용지</text><line x1="180.0000" y1="487.8082" x2="462.0000" y2="487.8082" stroke="#205d9c" stroke-width="1.65" stroke-linecap="round" /><line x1="180.0000" y1="482.8082" x2="180.0000" y2="492.8082" stroke="#205d9c" stroke-width="1.65" stroke-linecap="round" /><line x1="462.0000" y1="482.8082" x2="462.0000" y2="492.8082" stroke="#205d9c" stroke-width="1.65" stroke-linecap="round" /><text x="321.0000" y="518.8082" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#205d9c" text-anchor="middle">2</text><line x1="153.0000" y1="67.0000" x2="153.0000" y2="465.8082" stroke="#aa5411" stroke-width="1.65" stroke-linecap="round" /><line x1="158.0000" y1="67.0000" x2="148.0000" y2="67.0000" stroke="#aa5411" stroke-width="1.65" stroke-linecap="round" /><line x1="158.0000" y1="465.8082" x2="148.0000" y2="465.8082" stroke="#aa5411" stroke-width="1.65" stroke-linecap="round" /><text x="113.0000" y="274.4041" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#aa5411" text-anchor="middle">x+1</text></svg>
