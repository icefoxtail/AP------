<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 696 500" width="696" height="500" role="img" aria-labelledby="title desc"><title id="title">가로축에 닿는 포물선과 세로축의 교점</title><desc id="desc">파란 포물선의 꼭짓점은 가로축의 −1에 있다. 세로축과는 눈금 2에서 만난다.</desc><rect width="696" height="500" fill="white" /><line x1="48.0000" y1="405.0486" x2="644.0000" y2="405.0486" stroke="#586574" stroke-width="1.65" stroke-linecap="round" /><polygon points="644.0000,405.0486 631.0000,400.0486 631.0000,410.0486" fill="#586574" /><text x="661.0000" y="397.0486" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#586574" text-anchor="middle">x</text><line x1="461.6034" y1="445.0000" x2="461.6034" y2="64.0000" stroke="#586574" stroke-width="1.65" stroke-linecap="round" /><polygon points="461.6034,64.0000 456.6034,77.0000 466.6034,77.0000" fill="#586574" /><text x="477.6034" y="70.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#586574" text-anchor="middle">y</text><circle cx="461.60344827586204" cy="405.0485933503836" r="4.6" fill="#28364b" /><text x="446.6034" y="432.0486" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">O</text><path d="M 100.6638 85.8174 Q 333.1552 724.2798 565.6466 85.8174" stroke="#205d9c" stroke-width="6.0" stroke-linecap="round" fill="none" /><circle cx="333.1551724137931" cy="405.0485933503836" r="4.6" fill="#aa5411" /><circle cx="461.60344827586204" cy="307.6061381074169" r="4.6" fill="#205d9c" /><line x1="333.1552" y1="400.0486" x2="333.1552" y2="410.0486" stroke="#586574" stroke-width="1.75" stroke-linecap="round" /><text x="333.1552" y="435.0486" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#586574" text-anchor="middle">−1</text><line x1="456.6034" y1="307.6061" x2="466.6034" y2="307.6061" stroke="#586574" stroke-width="1.75" stroke-linecap="round" /><text x="440.6034" y="315.6061" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#586574" text-anchor="middle">2</text><text x="283.0000" y="49.0000" font-size="30" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#205d9c" text-anchor="middle">y = a(x − p)²</text></svg>
