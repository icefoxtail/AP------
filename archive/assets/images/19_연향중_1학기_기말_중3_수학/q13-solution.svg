<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 719 498" width="719" height="498" role="img" aria-labelledby="title desc"><title id="title">완전제곱으로 읽는 포물선의 축과 꼭짓점</title><desc id="desc">파란 포물선의 양 가지는 보라 점선에 대칭이다. 파란 길이가 가장 낮아지는 위치에 주황 점을 표시했다.</desc><rect width="719" height="498" fill="white" /><line x1="52.0000" y1="274.7325" x2="653.0000" y2="274.7325" stroke="#586574" stroke-width="1.65" stroke-linecap="round" /><polygon points="653.0000,274.7325 640.0000,269.7325 640.0000,279.7325" fill="#586574" /><text x="670.0000" y="266.7325" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#586574" text-anchor="middle">x</text><line x1="539.6850" y1="422.0000" x2="539.6850" y2="55.0000" stroke="#586574" stroke-width="1.65" stroke-linecap="round" /><polygon points="539.6850,55.0000 534.6850,68.0000 544.6850,68.0000" fill="#586574" /><text x="555.6850" y="61.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#586574" text-anchor="middle">y</text><circle cx="539.6849642004773" cy="274.73248407643314" r="4.6" fill="#28364b" /><text x="524.6850" y="301.7325" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">O</text><path d="M 58.4547 69.8647 Q 324.5298 713.3583 590.6050 69.8647" stroke="#205d9c" stroke-width="6" stroke-linecap="round" fill="none" /><circle cx="324.5298329355609" cy="391.61146496815286" r="4.6" fill="#aa5411" /><line x1="324.5298" y1="415.6885" x2="324.5298" y2="71.3631" stroke="#704895" stroke-width="2.0" stroke-linecap="round" stroke-dasharray="7 5" /><text x="169.0000" y="51.0000" font-size="30" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#205d9c" text-anchor="middle">y = x² + 6x + 4</text></svg>
