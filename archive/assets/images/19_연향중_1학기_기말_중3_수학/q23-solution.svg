<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 717 871" width="717" height="871" role="img" aria-labelledby="title desc"><title id="title">직선 아래 직사각형의 넓이를 만드는 두 길이</title><desc id="desc">위에서 직선 위의 점에 따라 직사각형 높이가 달라진다. 아래는 가로 길이에 따른 넓이 그래프이며 주황 꼭짓점에서 최대가 된다.</desc><rect width="717" height="871" fill="white" /><polygon points="150.8000,324.8429 285.8000,324.8429 285.8000,221.8761 150.8000,221.8761" fill="#e1eefb" /><line x1="59.0000" y1="324.8429" x2="653.0000" y2="324.8429" stroke="#586574" stroke-width="1.65" stroke-linecap="round" /><polygon points="653.0000,324.8429 640.0000,319.8429 640.0000,329.8429" fill="#586574" /><text x="670.0000" y="316.8429" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#586574" text-anchor="middle">x</text><line x1="150.8000" y1="365.0000" x2="150.8000" y2="70.0000" stroke="#586574" stroke-width="1.65" stroke-linecap="round" /><polygon points="150.8000,70.0000 145.8000,83.0000 155.8000,83.0000" fill="#586574" /><text x="166.8000" y="76.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#586574" text-anchor="middle">y</text><circle cx="150.8" cy="324.8429319371728" r="4.6" fill="#28364b" /><text x="135.8000" y="351.8429" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">O</text><line x1="88.7000" y1="71.5445" x2="469.4000" y2="361.9110" stroke="#aa5411" stroke-width="5.25" stroke-linecap="round" /><line x1="150.8000" y1="221.8761" x2="285.8000" y2="221.8761" stroke="#205d9c" stroke-width="3.75" stroke-linecap="round" /><line x1="285.8000" y1="221.8761" x2="285.8000" y2="324.8429" stroke="#205d9c" stroke-width="3.75" stroke-linecap="round" /><circle cx="285.8" cy="221.8760907504363" r="4.6" fill="#205d9c" /><text x="302.8000" y="208.8761" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#205d9c" text-anchor="middle">P</text><circle cx="285.8" cy="324.8429319371728" r="4.6" fill="#205d9c" /><text x="294.8000" y="351.8429" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#205d9c" text-anchor="middle">Q</text><circle cx="150.8" cy="221.8760907504363" r="4.6" fill="#205d9c" /><text x="134.8000" y="222.8761" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#205d9c" text-anchor="middle">R</text><line x1="420.8000" y1="319.8429" x2="420.8000" y2="329.8429" stroke="#586574" stroke-width="1.75" stroke-linecap="round" /><text x="420.8000" y="354.8429" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#586574" text-anchor="middle">2</text><line x1="145.8000" y1="118.9092" x2="155.8000" y2="118.9092" stroke="#586574" stroke-width="1.75" stroke-linecap="round" /><text x="129.8000" y="126.9092" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#586574" text-anchor="middle">4</text><text x="532.0000" y="67.0000" font-size="30" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#aa5411" text-anchor="middle">y = −2x + 4</text><text x="218.3000" y="370.8429" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#205d9c" text-anchor="middle">x</text><text x="222.8000" y="281.3595" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#205d9c" text-anchor="middle">4−2x</text><line x1="52.0000" y1="436.0000" x2="665.0000" y2="436.0000" stroke="#dae1e8" stroke-width="1.5" stroke-linecap="round" /><text x="360.0000" y="486.0000" font-size="30" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">가로 길이에 따른 직사각형의 넓이</text><line x1="67.4291" y1="759.4894" x2="641.0000" y2="759.4894" stroke="#586574" stroke-width="1.85" stroke-linecap="round" /><line x1="127.2222" y1="797.0000" x2="127.2222" y2="539.9149" stroke="#586574" stroke-width="1.85" stroke-linecap="round" /><text x="659.0000" y="749.4894" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#586574" text-anchor="middle">x</text><text x="142.2222" y="547.9149" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#586574" text-anchor="middle">S</text><path d="M 127.2222 759.4894 Q 348.6782 393.5319 570.1341 759.4894" stroke="#205d9c" stroke-width="6.05" stroke-linecap="round" fill="none" /><circle cx="348.67816091954023" cy="576.5106382978723" r="4.6" fill="#aa5411" /><line x1="348.6782" y1="759.4894" x2="348.6782" y2="576.5106" stroke="#aa5411" stroke-width="2.0" stroke-linecap="round" stroke-dasharray="6 5" /><text x="481.0000" y="540.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#205d9c" text-anchor="middle">S = x(4 − 2x)</text></svg>
