<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 719 498" width="719" height="498" role="img" aria-labelledby="title desc"><title id="title">같은 점을 지나는 두 후보 꼭짓점의 위치</title><desc id="desc">두 포물선은 같은 폭이며 하나의 검은 점을 같이 지난다. 파란 포물선의 꼭짓점만 제1사분면에 있다.</desc><rect width="719" height="498" fill="white" /><polygon points="266.0610,394.7860 653.0000,394.7860 653.0000,55.0000 266.0610,55.0000" fill="none" /><line x1="52.0000" y1="394.7860" x2="653.0000" y2="394.7860" stroke="#586574" stroke-width="1.65" stroke-linecap="round" /><polygon points="653.0000,394.7860 640.0000,389.7860 640.0000,399.7860" fill="#586574" /><text x="670.0000" y="386.7860" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#586574" text-anchor="middle">x</text><line x1="266.0610" y1="422.0000" x2="266.0610" y2="55.0000" stroke="#586574" stroke-width="1.65" stroke-linecap="round" /><polygon points="266.0610,55.0000 261.0610,68.0000 271.0610,68.0000" fill="#586574" /><text x="282.0610" y="61.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#586574" text-anchor="middle">y</text><circle cx="266.06099397590367" cy="394.78601694915255" r="4.6" fill="#28364b" /><text x="251.0610" y="421.7860" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">O</text><path d="M 55.6205 68.4709 Q 220.8050 689.9994 385.9895 68.4709" stroke="#586574" stroke-width="5.2" stroke-linecap="round" fill="none" stroke-dasharray="10 6" /><path d="M 334.3976 95.1189 Q 492.3411 663.3515 650.2846 95.1189" stroke="#205d9c" stroke-width="5.8" stroke-linecap="round" fill="none" /><circle cx="220.8049698795181" cy="379.2351694915254" r="4.6" fill="#586574" /><circle cx="492.34111445783134" cy="379.2351694915254" r="4.6" fill="#205d9c" /><circle cx="356.5730421686747" cy="169.29872881355934" r="4.6" fill="#704895" /><text x="166.0000" y="64.0000" font-size="28" font-family="Malgun Got