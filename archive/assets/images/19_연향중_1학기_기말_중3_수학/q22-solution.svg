<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 719 498" width="719" height="498" role="img" aria-labelledby="title desc"><title id="title">방향이 다른 두 포물선과 직선의 공통 교점</title><desc id="desc">아래로 열린 파랑과 위로 열린 초록 포물선은 두 점을 공유한다. 두 검은 점에 모두 주황 직선이 지나간다.</desc><rect width="719" height="498" fill="white" /><line x1="52.0000" y1="322.3620" x2="653.0000" y2="322.3620" stroke="#586574" stroke-width="1.65" stroke-linecap="round" /><polygon points="653.0000,322.3620 640.0000,317.3620 640.0000,327.3620" fill="#586574" /><text x="670.0000" y="314.3620" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#586574" text-anchor="middle">x</text><line x1="263.7159" y1="422.0000" x2="263.7159" y2="55.0000" stroke="#586574" stroke-width="1.65" stroke-linecap="round" /><polygon points="263.7159,55.0000 258.7159,68.0000 268.7159,68.0000" fill="#586574" /><text x="279.7159" y="61.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#586574" text-anchor="middle">y</text><circle cx="263.7159090909091" cy="322.36199095022624" r="4.6" fill="#28364b" /><text x="248.7159" y="349.3620" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">O</text><path d="M 53.3659 333.9010 Q 280.4483 -152.0003 507.5307 411.2035" stroke="#205d9c" stroke-width="5.8" stroke-linecap="round" fill="none" /><path d="M 161.8588 56.8979 Q 399.2340 632.6705 636.6091 62.0790" stroke="#277339" stroke-width="5.5" stroke-linecap="round" fill="none" stroke-dasharray="12 5" /><line x1="89.5625" y1="59.0330" x2="608.6080" y2="419.6277" stroke="#aa5411" stroke-width="4.55" stroke-linecap="round" /><circle cx="195.42045454545456" cy="132.57530704589527" r="4.6" fill="#28364b" /><circle cx="468.6022727272727" cy="322.36199095022624" r="4.6" fill="#28364b" /><text x="113.4205" y="54.5753" font-size="27" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">(−1,8)</text><text x="546.6023" y="305.3620" font-size="27" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">(3,0)</text><line x1="37.0000" y1="469.0000" x2="85.0000" y2="469.0000" stroke="#205d9c" stroke-width="4.7" stroke-linecap="round" /><text x="99.0000" y="477.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#205d9c" text-anchor="start">y = −x² + 9</text><line x1="385.0000" y1="469.0000" x2="433.0000" y2="469.0000" stroke="#277339" stroke-width="4.7" stroke-linecap="round" stroke-dasharray="12 5" /><text x="447.0000" y="477.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#277339" text-anchor="start">y = ax² + bx + 3</text></svg>
