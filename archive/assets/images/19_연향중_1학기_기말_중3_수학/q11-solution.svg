<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 719 498" width="719" height="498" role="img" aria-labelledby="title desc"><title id="title">원점에서 위로 열리는 포물선의 가로 폭</title><desc id="desc">두 포물선은 원점에서 위로 열린다. 같은 높이의 보라 보조선을 따라 파랑과 초록 가지 사이의 가로 폭을 비교한다.</desc><rect width="719" height="498" fill="white" /><line x1="52.0000" y1="379.3256" x2="653.0000" y2="379.3256" stroke="#586574" stroke-width="1.65" stroke-linecap="round" /><polygon points="653.0000,379.3256 640.0000,374.3256 640.0000,384.3256" fill="#586574" /><text x="670.0000" y="371.3256" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#586574" text-anchor="middle">x</text><line x1="352.5000" y1="422.0000" x2="352.5000" y2="55.0000" stroke="#586574" stroke-width="1.65" stroke-linecap="round" /><polygon points="352.5000,55.0000 347.5000,68.0000 357.5000,68.0000" fill="#586574" /><text x="368.5000" y="61.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#586574" text-anchor="middle">y</text><circle cx="352.5" cy="379.3255813953488" r="4.6" fill="#28364b" /><text x="337.5000" y="406.3256" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">O</text><path d="M 65.6227 197.0148 Q 352.5000 561.6364 639.3773 197.0148" stroke="#205d9c" stroke-width="5.9" stroke-linecap="round" fill="none" /><path d="M 130.8622 89.1395 Q 352.5000 669.5116 574.1378 89.1395" stroke="#277339" stroke-width="5.2" stroke-linecap="round" fill="none" stroke-dasharray="12 5" /><circle cx="573.4123546668327" cy="271.2170542635659" r="4.6" fill="#205d9c" /><circle cx="131.5876453331674" cy="271.2170542635659" r="4.6" fill="#205d9c" /><circle cx="487.7806367026215" cy="271.2170542635659" r="4.6" fill="#277339" /><circle cx="217.21936329737846" cy="271.2170542635659" r="4.6" fill="#277339" /><line x1="131.5876" y1="271.2171" x2="573.4124" y2="271.2171" stroke="#704895" stroke-width="1.85" stroke-linecap="round" stroke-dasharray="6 5" /><line x1="67.0000" y1="464.0000" x2="115.0000" y2="464.0000" stroke="#205d9c" stroke-width="4.7" stroke-linecap="round" /><text x="129.0000" y="472.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#205d9c" text-anchor="start">y = x²/4</text><line x1="396.0000" y1="464.0000" x2="444.0000" y2="464.0000" stroke="#277339" stroke-width="4.7" stroke-linecap="round" stroke-dasharray="12 5" /><text x="458.0000" y="472.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#277339" text-anchor="start">y = 2x²/3</text></svg>
