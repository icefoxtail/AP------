<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 384 384" width="384" height="384" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">좌표평면 위에 네 꼭짓점의 좌표가 각각 (1, 1), (5, 1), (5, 3), (1, 3)인 직사각형을 나타낸 그림이다.</title><desc id="visual-desc">원점 O와 x축, y축이 있는 좌표평면에 직사각형이 그려져 있다. 직사각형의 네 꼭짓점에서 x축으로 내린 점선이 x축 위의 1과 5에서 만나고, y축으로 내린 점선이 y축 위의 1과 3에서 만난다. 직사각형의 내부는 옅은 색으로 칠해져 있다.</desc><rect width="384" height="384" fill="#fff"/><g data-layer="10"><path id="r1" data-role="region" stroke="none" stroke-width="1.6" fill="#e4e7ec" data-owner-points="A B C D" data-mark="region" data-mark-id="r1" fill-rule="evenodd" d="M96.761904762 239.619047619 L287.238095238 239.619047619 L287.238095238 144.380952381 L96.761904762 144.380952381 L96.761904762 239.619047619 Z"/></g><g data-layer="30"><line id="sOX" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="49.142857143" y1="287.238095238" x2="334.857142857" y2="287.238095238"/></g><g data-layer="30"><line id="sOY" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="49.142857143" y1="287.238095238" x2="49.142857143" y2="96.761904762"/></g><g data-layer="30"><line id="sAB" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="96.761904762" y1="239.619047619" x2="287.238095238" y2="239.619047619"/></g><g data-layer="30"><line id="sBC" data-role="line" stroke="#111" stroke-wi