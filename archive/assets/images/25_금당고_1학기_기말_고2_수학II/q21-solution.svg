<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 500" role="img" aria-labelledby="t d">
<title id="t">함수와 역함수의 그래프</title><desc id="d">f와 f 역함수는 y=x에 대하여 대칭이며 역함수 그래프 아래의 넓이를 나타낸다.</desc>
<rect width="820" height="500" rx="18" fill="#F7FAFC"/>
<text x="36" y="46" font-family="sans-serif" font-size="24" font-weight="700" fill="#18324A">역함수는 y=x 대칭</text>
<path d="M110,420 L110.0,420.0 L112.0,400.0 L117.6,380.0 L126.7,360.0 L138.8,340.0 L153.8,320.0 L171.2,300.0 L190.8,280.0 L212.4,260.0 L235.6,240.0 L260.0,220.0 L285.5,200.0 L311.6,180.0 L338.2,160.0 L364.8,140.0 L391.2,120.0 L417.2,100.0 L442.3,80.0 L466.4,60.0 L489.1,40.0 L510.0,20.0 L510,420 Z" fill="#DCEBFA" opacity="0.9"/>
