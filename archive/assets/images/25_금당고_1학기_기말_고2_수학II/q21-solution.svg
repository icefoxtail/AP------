<path d="M110.0,420.0 L112.0,400.0 L117.6,380.0 L126.7,360.0 L138.8,340.0 L153.8,320.0 L171.2,300.0 L190.8,280.0 L212.4,260.0 L235.6,240.0 L260.0,220.0 L285.5,200.0 L311.6,180.0 L338.2,160.0 L364.8,140.0 L391.2,120.0 L417.2,100.0 L442.3,80.0 L466.4,60.0 L489.1,40.0 L510.0,20.0" fill="none" stroke="#C66A00" stroke-width="4" stroke-linejoin="round"/>
<circle cx="110" cy="420" r="5" fill="#18324A"/><circle cx="510" cy="20" r="5" fill="#18324A"/>
<text x="498" y="70" font-family="sans-serif" font-size="18" fill="#214E75">y=x</text>
<text x="380" y="290" font-family="sans-serif" font-size="18" fill="#214E75">y=f(x)</text>
<text x="215" y="120" font-family="sans-serif" font-size="18" fill="#9C5200">y=f⁻¹(x)</text>
<text x="108" y="448" font-family="sans-serif" font-size="17" fill="#18324A">0</text>
<text x="305" y="448" font-family="sans-serif" font-size="17" fill="#18324A">1</text>
<text x="505" y="448" font-family="sans-serif" font-size="17" fill="#18324A">2</text>
<text x="530" y="426" font-family="sans-serif" font-size="18" fill="#18324A">x</text>
<text x="92" y="60" font-family="sans-serif" font-size="18" fill="#18324A">y</text>
<rect x="570" y="116" width="220" height="250" rx="18" fill="#FFFFFF" stroke="#D1DCE6" stroke-width="2"/>
<text x="594" y="160" font-family="sans-serif" font-size="19" font-weight="700" fill="#18324A">0&lt;x&lt;2에서</text>
<text x="594" y="206" font-family="sans-serif" font-size="20" fill="#18324A">f(x)&lt;x&lt;f⁻¹(x)</text>
<text x="594" y="260" font-family="sans-serif" font-size="18" fill="#18324A">g(x)=f⁻¹(x)</text>
<text x="594" y="314" font-family="sans-serif" font-size="18" fill="#18324A">넓이 관계로 적분</text>
</svg>