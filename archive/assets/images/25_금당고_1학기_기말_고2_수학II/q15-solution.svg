<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 500" role="img" aria-labelledby="t d">
<title id="t">속도와 시간 그래프</title><desc id="d">가속, 등속, 감속의 세 구간을 속도 그래프 아래 넓이로 분리한다.</desc>
<rect width="820" height="500" rx="18" fill="#F7FAFC"/>
<text x="36" y="48" font-family="sans-serif" font-size="24" font-weight="700" fill="#18324A">세 구간의 이동거리 = 속도 그래프 아래 넓이</text>
<polygon points="100,360 190,90 550,90 685,360" fill="#DCEBFA"/>
<line x1="100" y1="360" x2="730" y2="360" stroke="#486581" stroke-width="2"/>
<line x1="100" y1="390" x2="100" y2="70" stroke="#486581" stroke-width="2"/>
<path d="M100 360 L190 90 L550 90 L685 360" fill="none" stroke="#214E75" stroke-width="4" stroke-linejoin="round"/>
<circle cx="100" cy="360" r="5" fill="#18324A"/><circle cx="190" cy="90" r="5" fill="#18324A"/><circle cx="550" cy="90" r="5" fill="#18324A"/><circle cx="685" cy="360" r="5" fill="#18324A"/>
<line x1="190" y1="90" x2="190" y2="360" stroke="#718096" stroke-dasharray="5 5"/>
<line x1="550" y1="90" x2="550" y2="360" stroke="#718096" stroke-dasharray="5 5"/>
<text x="95" y="390" font-family="sans-serif" font-size="17" fill="#18324A">0</text>
<text x="182" y="390" font-family="sans-serif" font-size="17" fill="#18324A">2</text>
<text x="540" y="390" font-family="sans-serif" font-size="17" fill="#18324A">10</text>
<text x="675" y="390" font-family="sans-serif" font-size="17" fill="#18324A">13</text>
<text x="738" y="366" font-family="sans-serif" font-size="18" fill="#18324A">t</text>
<text x="82" y="70" font-family="sans-serif" font-size="18" fill="#18324A">v</text>
<text x="198" y="82" font-family="sans-serif" font-size="17" fill="#18324A">6</text>
<text x="295" y="128" font-family="sans-serif" font-size="16" fill="#18324A">가속</text>
<text x="362" y="128" font-family="sans-serif" font-size="16" fill="#18324A">등속</text>
<text x="578" y="220" font-family="sans-serif" font-size="16" fill="#18324A">감속</text>
<text x="178" y="445" font-family="sans-serif" font-size="17" fill="#18324A">0–2분</text>
<text x="342" y="445" font-family="sans-serif" font-size="17" fill="#18324A">2–10분</text>
<text x="573" y="445" font-family="sans-serif" font-size="17" fill="#18324A">10–13분</text>
</svg>