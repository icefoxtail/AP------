<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" role="img" aria-labelledby="title desc"><title id="title">필요조건과 구간 포함</title><desc id="desc">P는 (-3,1]과 [3,7/2)의 합집합이다.</desc><style>text{font-family:"Noto Sans KR","Malgun Gothic",Arial,sans-serif;fill:#172033}.muted{fill:#56657a}</style><rect width="760" height="330" fill="#f8fafc"/><text x="28" y="38" font-size="22" font-weight="700">필요조건과 구간 포함</text><text x="28" y="67" class="muted" font-size="15">P=(-3,1]∪[3,7/2)</text><line x1="100" y1="145" x2="690" y2="145" stroke="#64748b" stroke-width="2"/><line x1="170" y1="145" x2="430" y2="145" stroke="#2563eb" stroke-width="10"/><circle cx="170" cy="145" r="8" fill="#fff" stroke="#2563eb" stroke-width="3"/><circle cx="430" cy="145" r="8" fill="#2563eb"/><text x="170" y="180" text-anchor="middle" font-size="15">−3</text><text x="430" y="180" text-anchor="middle" font-size="15">1</text><line x1="100" y1="245" x2="690" y2="245" stroke="#64748b" stroke-width="2"/><line x1="510" y1="245" x2="590" y2="245" stroke="#16a34a" stroke-width="10"/><circle cx="510" cy="245" r="8" fill="#16a34a"/><circle cx="590" cy="245" r="8" fill="#fff" stroke="#16a34a" stroke-width="3"/><text x="510" y="280" text-anchor="middle" font-size="15">3 포함</text><text x="590" y="280" text-anchor="middle" font-size="15">7/2 미포함</text></svg>
