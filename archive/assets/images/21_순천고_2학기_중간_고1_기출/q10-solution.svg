<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="title desc"><title id="title">집합 해설 보강 · 문항 10</title><desc id="desc">B가 A에 포함되는 관계</desc><rect width="720" height="300" rx="18" fill="#f8fafc"/><text x="32" y="38" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#0f172a">집합 해설 보강 · 문항 10</text><text x="32" y="68" font-family="Arial,sans-serif" font-size="14" fill="#475569">B⊆A</text><rect x="32" y="88" width="656" height="156" rx="12" fill="#fff" stroke="#cbd5e1"/><circle cx="360" cy="166" r="78" fill="#bfdbfe" fill-opacity=".72" stroke="#2563eb" stroke-width="3"/><circle cx="360" cy="166" r="43" fill="#fed7aa" fill-opacity=".9" stroke="#ea580c" stroke-width="3"/><text x="286" y="166" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#1d4ed8">A</text><text x="350" y="166" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#c2410c">B</text><text x="52" y="218" font-family="Arial,sans-serif" font-size="13" fill="#334155">A-B</text><text x="500" y="218" font-family="Arial,sans-serif" font-size="13" fill="#334155">B-A=∅</text><text x="32" y="274" font-family="Arial,sans-serif" font-size="13" fill="#64748b">식의 결과는 B의 모든 원소가 A에 들어간다는 뜻이다.</text></svg>
