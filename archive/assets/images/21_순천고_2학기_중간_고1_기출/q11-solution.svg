<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="title desc"><title id="title">집합 해설 보강 · 문항 11</title><desc id="desc">신청자 수 최댓값 계산의 변수와 범위</desc><rect width="720" height="300" rx="18" fill="#f8fafc"/><text x="32" y="38" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#0f172a">집합 해설 보강 · 문항 11</text><text x="32" y="68" font-family="Arial,sans-serif" font-size="14" fill="#475569">합집합과 교집합의 범위</text><rect x="32" y="88" width="656" height="156" rx="12" fill="#fff" stroke="#cbd5e1"/><text x="62" y="128" font-family="Arial,sans-serif" font-size="15" fill="#334155">200-u=u-80 → u=140</text><text x="62" y="164" font-family="Arial,sans-serif" font-size="15" fill="#334155">수학=s+30, 과학=s, 교집합 i=2s-110</text><text x="62" y="200" font-family="Arial,sans-serif" font-size="15" fill="#334155">i≥0 → s≥55</text><text x="62" y="230" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#1d4ed8">수학만=140-s≤85</text><text x="32" y="274" font-family="Arial,sans-serif" font-size="13" fill="#64748b">s=55, i=0에서 최댓값 85가 실제로 가능하다.</text></svg>
