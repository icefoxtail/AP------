<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="title desc"><title id="title">집합 해설 보강 · 문항 19</title><desc id="desc">부분집합 X의 원소별 가중합 비교</desc><rect width="720" height="300" rx="18" fill="#f8fafc"/><text x="32" y="38" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#0f172a">집합 해설 보강 · 문항 19</text><text x="32" y="68" font-family="Arial,sans-serif" font-size="14" fill="#475569">f_A(X)-f_B(X)=6I₆+8I₈-I₁-3I₃</text><rect x="32" y="88" width="656" height="156" rx="12" fill="#fff" stroke="#cbd5e1"/><rect x="72" y="118" width="88" height="58" rx="8" fill="#fee2e2" stroke="#ef4444"/><text x="108" y="153" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#b91c1c">1: -1</text><rect x="180" y="118" width="88" height="58" rx="8" fill="#fee2e2" stroke="#ef4444"/><text x="224" y="153" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#b91c1c">3: -3</text><rect x="288" y="118" width="88" height="58" rx="8" fill="#dcfce7" stroke="#16a34a"/><text x="332" y="153" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#15803d">6: +6</text><rect x="396" y="118" width="88" height="58" rx="8" fill="#dcfce7" stroke="#16a34a"/><text x="440" y="153" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#15803d">8: +8</text><text x="72" y="211" font-family="Arial,sans-serif" font-size="15" fill="#334155">6 또는 8 포함 → 양수 → X∈T</text><text x="72" y="236" font-family="Arial,sans-serif" font-size="15" fill="#334155">둘 다 미포함 → 최대 0 이하 → X∉T</text><text x="32" y="274" font-family="Arial,sans-serif" font-size="13" fill="#64748b">5와 7은 양쪽 합에 공통으로 들어가 소거된다.</text></svg>
