<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" role="img" aria-labelledby="title desc"><title id="title">명제와 진리집합 포함</title><desc id="desc">P, Q, R이 차례로 완전히 포함되어 P⊆Q⊆R을 보인다.</desc><style>text{font-family:"Noto Sans KR","Malgun Gothic",Arial,sans-serif;fill:#172033}.muted{fill:#56657a}.math{font-family:Georgia,serif}</style><rect width="760" height="430" fill="#f8fafc"/><text x="28" y="38" font-size="22" font-weight="700">명제와 진리집합 포함</text><text x="28" y="67" class="muted" font-size="15">~q→~p ⇔ P⊆Q, q→r ⇔ Q⊆R</text><rect x="36" y="96" width="320" height="250" rx="14" fill="#fff" stroke="#94a3b8"/><circle cx="196" cy="220" r="105" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text x="196" y="132" text-anchor="middle" font-size="18" font-weight="700">R</text><circle cx="196" cy="220" r="72" fill="#fed7aa" fill-opacity=".8" stroke="#ea580c" stroke-width="3"/><text x="196" y="164" text-anchor="middle" font-size="18" font-weight="700">Q</text><circle cx="196" cy="220" r="38" fill="#bfdbfe" stroke="#2563eb" stroke-width="3"/><text x="196" y="226" text-anchor="middle" font-size="18" font-weight="700">P</text><rect x="390" y="96" width="334" height="250" rx="14" fill="#fff" stroke="#cbd5e1"/><text x="412" y="170" class="math" font-size="21">P⊆Q</text><text x="412" y="215" class="math" font-size="21">Q⊆R</text><text x="412" y="260" class="math" font-size="21">P⊆Q⊆R</text></svg>
