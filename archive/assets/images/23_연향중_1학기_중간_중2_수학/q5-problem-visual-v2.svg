<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 728 434" width="728" height="434" role="img" aria-labelledby="title desc"><title id="title">직사각형과 삼각형의 넓이를 비교하는 그림</title><desc id="desc">직사각형의 가로 길이는 6a²b⁴이고 세로 길이는 2a³을 b³으로 나눈 값이다. 삼각형의 밑변은 4a³b³이다. 꼭짓점에서 밑변에 내리는 높이를 점선으로 표시했다.</desc><rect width="728" height="434" fill="white" /><line x1="80.0000" y1="164.0000" x2="80.0000" y2="306.0000" stroke="#21639a" stroke-width="5.2" stroke-linecap="round" /><line x1="80.0000" y1="306.0000" x2="285.0000" y2="306.0000" stroke="#21639a" stroke-width="5.2" stroke-linecap="round" /><line x1="285.0000" y1="306.0000" x2="285.0000" y2="164.0000" stroke="#21639a" stroke-width="5.2" stroke-linecap="round" /><line x1="285.0000" y1="164.0000" x2="80.0000" y2="164.0000" stroke="#21639a" stroke-width="5.2" stroke-linecap="round" /><line x1="101.0000" y1="164.0000" x2="101.0000" y2="185.0000" stroke="#687889" stroke-width="2.4" stroke-linecap="round" /><line x1="101.0000" y1="185.0000" x2="80.0000" y2="185.0000" stroke="#687889" stroke-width="2.4" stroke-linecap="round" /><line x1="101.0000" y1="306.0000" x2="101.0000" y2="285.0000" stroke="#687889" stroke-width="2.4" stroke-linecap="round" /><line x1="101.0000" y1="285.0000" x2="80.0000" y2="285.0000" stroke="#687889" stroke-width="2.4" stroke-linecap="round" /><line x1="264.0000" y1="306.0000" x2="264.0000" y2="285.0000" stroke="#687889" stroke-width="2.4" stroke-linecap="round" /><line x1="264.0000" y1="285.0000" x2="285.0000" y2="285.0000" stroke="#687889" stroke-width="2.4" stroke-linecap="round" /><line x1="264.0000" y1="164.0000" x2="264.0000" y2="185.0000" stroke="#687889" stroke-width="2.4" stroke-linecap="round" /><line x1="264.0000" y1="185.0000" x2="285.0000" y2="185.0000" stroke="#687889" stroke-width="2.4" stroke-linecap="round" /><line x1="423.0000" y1="306.0000" x2="668.0000" y2="306.0000" stroke="#227365" stroke-width="5.2" stroke-linecap="round" /><line x1="668.0000" y1="306.0000" x2="573.0000" y2="68.3673" stroke="#227365" stroke-width="5.2" stroke-linecap="round" /><line x1="573.0000" y1="68.3673" x2="423.0000" y2="306.0000" stroke="#227365" stroke-width="5.2" stroke-linecap="round" /><line x1="573.0000" y1="68.3673" x2="573.0000" y2="306.0000" stroke="#227365" stroke-width="3.7" stroke-linecap="round" stroke-dasharray="9 7" /><line x1="552.0000" y1="306.0000" x2="552.0000" y2="285.0000" stroke="#687889" stroke-width="2.4" stroke-linecap="round" /><line x1="552.0000" y1="285.0000" x2="573.0000" y2="285.0000" stroke="#687889" stroke-width="2.4" stroke-linecap="round" /><line x1="80.0000" y1="342.0000" x2="285.0000" y2="342.0000" stroke="#21639a" stroke-width="2.25" stroke-linecap="round" /><line x1="80.0000" y1="334.0000" x2="80.0000" y2="350.0000" stroke="#21639a" stroke-width="2.2" stroke-linecap="round" /><line x1="285.0000" y1="334.0000" x2="285.0000" y2="350.0000" stroke="#21639a" stroke-width="2.2" stroke-linecap="round" /><text x="182.5000" y="390.0000" font-size="35" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#21639a" text-anchor="middle">6a²b⁴</text><line x1="423.0000" y1="342.0000" x2="668.0000" y2="342.0000" stroke="#227365" stroke-width="2.25" stroke-linecap="round" /><line x1="423.0000" y1="334.0000" x2="423.0000" y2="350.0000" stroke="#227365" stroke-width="2.2" stroke-linecap="round" /><line x1="668.0000" y1="334.0000" x2="668.0000" y2="350.0000" stroke="#227365" stroke-width="2.2" stroke-linecap="round" /><text x="545.5000" y="390.0000" font-size="35" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#227365" text-anchor="middle">4a³b³</text><line x1="312.0000" y1="164.0000" x2="312.0000" y2="306.0000" stroke="#21639a" stroke-width="2.25" stroke-linecap="round" /><line x1="303.0000" y1="164.0000" x2="321.0000" y2="164.0000" stroke="#21639a" stroke-width="2.25" stroke-linecap="round" /><line x1="303.0000" y1="306.0000" x2="321.0000" y2="306.0000" stroke="#21639a" stroke-width="2.25" stroke-linecap="ro