<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 695 700" width="695" height="700" role="img" aria-labelledby="title desc"><title id="title">과녁의 일곱 칸에 적힌 다항식</title><desc id="desc">중앙 f는 3x+2y이다. 위 왼쪽 a는 4x−5y, 왼쪽 b는 2x−3y, 아래 왼쪽 c는 −5x+4y, 아래 오른쪽 d는 3x−y, 오른쪽 e는 2x+7y이다. 화살표가 있는 위 오른쪽에는 −x+3y가 적혀 있다.</desc><rect width="695" height="700" fill="white" /><path d="M 346.000 98.000 A 275 275 0 0 0 107.843 235.500 L 271.522 330.000 A 86 86 0 0 1 346.000 287.000 Z" fill="none" stroke="#526c81" stroke-width="2.75" stroke-linejoin="round" /><circle cx="248.14276576708968" cy="189.13821286659865" r="18.5" fill="white" stroke="#547184" stroke-width="2.0" /><text x="248.1428" y="198.1382" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#293b4a" text-anchor="middle">a</text><text x="248.1428" y="237.1382" font-size="31" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#293b4a" text-anchor="middle">4x − 5y</text><path d="M 107.843 235.500 A 275 275 0 0 0 107.843 510.500 L 271.522 416.000 A 86 86 0 0 1 271.522 330.000 Z" fill="none" stroke="#526c81" stroke-width="2.75" stroke-linejoin="round" /><circle cx="159.02848100575483" cy="355.26360000377196" r="18.5" fill="white" stroke="#547184" stroke-width="2.0" /><text x="159.0285" y="364.2636" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#293b4a" text-anchor="middle">b</text><text x="159.0285" y="403.2636" font-size="31" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#293b4a" text-anchor="middle">2x − 3y</text><path d="M 107.843 510.500 A 275 275 0 0 0 346.000 648.000 L 346.000 459.000 A 86 86 0 0 1 271.522 416.000 Z" fill="none" stroke="#526c81" stroke-width="2.75" stroke-linejoin="round" /><circle cx="247.11268961726955" cy="516.5761217348055" r="18.5" fill="white" stroke="#547184" stroke-width="2.0" /><text x="247.1127" y="525.5761" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#293b4a" text-anchor="middle">c</text><text x="247.1127" y="564.5761" font-size="31" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#293b4a" text-anchor="middle">−5x + 4y</text><path d="M 346.000 648.000 A 275 275 0 0 0 584.157 510.500 L 420.478 416.000 A 86 86 0 0 1 346.000 459.000 Z" fill="none" stroke="#526c81" stroke-width="2.75" stroke-linejoin="round" /><circle cx="446.4324246074606" cy="519.1476236369119" r="18.5" fill="white" stroke="#547184" stroke-width="2.0" /><text x="446.4324" y="528.1476" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#293b4a" text-anchor="middle">d</text><text x="446.4324" y="567.1476" font-size="31" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#293b4a" text-anchor="middle">3x − y</text><path d="M 584.157 510.500 A 275 275 0 0 0 537.031 175.182 L 405.741 311.137 A 86 86 0 0 1 420.478 416.000 Z" fill="none" stroke="#526c81" stroke-width="2.75" stroke-linejoin="round" /><circle cx="531.2922138450647" cy="335.78903184893545" r="18.5" fill="white" stroke="#547184" stroke-width="2.0" /><text x="531.2922" y="344.7890" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#293b4a" text-anchor="middle">e</text><text x="531.2922" y="383.7890" font-size="31" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#293b4a" text-anchor="middle">2x + 7y</text><path d="M 537.031 175.182 A 275 275 0 0 0 346.000 98.000 L 346.000 287.000 A 86 86 0 0 1 405.741 311.137 Z" fill="none" stroke="#526c81" stroke-width="2.75" stroke-linejoin="round" /><text x="419.7975" y="197.3448" font-size="31" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#293b4a" text-anchor="middle">−x + 3y</text><circle cx="346" cy="373" r="86" fill="none" stroke="#526c81" stroke-width="3.3" /><circle cx="346" cy="351" r="18.5" fill="whit