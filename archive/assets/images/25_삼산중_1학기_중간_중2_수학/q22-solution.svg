<svg xmlns="http://www.w3.org/2000/svg" width="700" height="420" viewBox="0 0 700 420" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc">
  <title id="title">직사각형과 사다리꼴의 넓이 비교</title>
  <desc id="desc">직사각형의 가로 3a²b와 세로 4ab, 사다리꼴의 평행한 두 변 2a와 4a 및 높이 h를 표시하고 두 넓이가 같음을 나타낸다.</desc>
  <rect x="0" y="0" width="700" height="420" fill="#ffffff"/>
  <text x="350" y="38" text-anchor="middle" font-family="Noto Sans KR, Pretendard, Malgun Gothic, sans-serif" font-size="19" font-weight="700" fill="#172033">두 넓이가 같음</text>

  <text x="175" y="78" text-anchor="middle" font-family="Noto Sans KR, Pretendard, Malgun Gothic, sans-serif" font-size="16" font-weight="600" fill="#172033">직사각형</text>
  <rect x="86" y="105" width="180" height="118" rx="2" fill="#e8f1fb" stroke="#26384b" stroke-width="2.2"/>
  <text x="176" y="250" text-anchor="middle" font-family="STIX Two Math, Cambria Math, Times New Roman, serif" font-size="16" fill="#172033">3a²b</text>
  <text x="76" y="168" text-anchor="end" font-family="STIX Two Math, Cambria Math, Times New Roman, serif" font-size="16" fill="#172033">4ab</text>
  <text x="176" y="285" text-anchor="middle" font-family="STIX Two Math, Cambria Math, Times New Roman, serif" font-size="16" font-weight="600" fill="#172033">A₁ = 12a³b²</text>

  <text x="505" y="78" text-anchor="middle" font-family="Noto Sans KR, Pretendard, Malgun Gothic, sans-serif" font-size="16" font-weight="600" fill="#172033">사다리꼴</text>
  <polygon points="455,105 555,105 605,223 405,223" fill="#f1eee4" stroke="#26384b" stroke-width="2.2" stroke-linejoin="round"/>
  <line x1="555" y1="105" x2="555" y2="223" stroke="#60758b" stroke-width="1.5"/>
  <path d="M 555 207 L 571 207 L 571 223" fill="none" stroke="#60758b" stroke-width="1.5"/>
  <text x="505" y="96" text-anchor="middle" font-family="STIX Two Math, Cambria Math, Times New Roman, serif" font-size="16" fill="#172033">2a</text>
  <text x="505" y="250" text-anchor="middle" font-family="STIX Two Math, Cambria Math, Times New Roman, serif" font-size="16" fill="#172033">4a</text>
  <text x="568" y="166" text-anchor="start" font-family="STIX Two Math, Cambria Math, Times New Roman, serif" font-size="16" fill="#172033">h</text>
  <text x="505" y="285" text-anchor="middle" font-family="STIX Two Math, Cambria Math, Times New Roman, serif" font-size="16" font-weight="600" fill="#172033">A₂ = 3ah</text>

  <line x1="286" y1="164" x2="394" y2="164" stroke="#6a7481" stroke-width="1.8"/>
  <path d="M 394 164 L 384 158 L 384 170 Z" fill="#6a7481"/>
  <text x="350" y="151" text-anchor="middle" font-family="Noto Sans KR, Pretendard, Malgun Gothic, sans-serif" font-size="13" fill="#39465a">넓이 같음</text>

  <rect x="95" y="314" width="510" height="54" rx="8" fill="#f6f7f9" stroke="#c7ced7" stroke-width="1.2"/>
  <text x="350" y="348" text-anchor="middle" font-family="STIX Two Math, Cambria Math, Times New Roman, serif" font-size="18" font-weight="600" fill="#172033">12a³b² = 3ah</text>
  <text x="350" y="397" text-anchor="middle" font-family="Noto Sans KR, Pretendard, Malgun Gothic, sans-serif" font-size="12" fill="#5b6470">모식도 · 실제 길이 비율을 나타내지 않음</text>
</svg>
