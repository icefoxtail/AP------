<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 600" width="720" height="600" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">사각형 ABCD에서 변 AB와 변 CD가 평행하고 길이가 같으며, 대각선 AC가 꼭짓점 A의 각을 이등분한다. 변 AD의 길이는 7 cm로 주어져 있다.</title><desc id="visual-desc">사각형 ABCD와 대각선 AC가 보이고, 변 AD 옆에 7 cm가 적혀 있다. 변 AB와 변 CD에는 평행 표시와 같은 길이 표시가 있고, 각 BAC와 각 CAD에는 같은 각 표시가 있다.</desc><rect width="720" height="600" fill="#fff"/><g data-layer="30"><line id="AB" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="67.142857143" y1="505.060779047" x2="503.58510328" y2="505.060779047"/></g><g data-layer="30"><line id="BC" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="503.58510328" y1="505.060779047" x2="652.857142857" y2="94.939220953"/></g><g data-layer="30"><line id="CD" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="652.857142857" y1="94.939220953" x2="216.41489672" y2="94.939220953"/></g><g data-layer="30"><line id="DA" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="216.41489672" y1="94.939220953" x2="67.142857143" y2="505.060779047"/></g><g data-layer="30"><line id="AC" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="67.142857143" y1="505.060779047" x2="652.857142857" y2="94.939220953"/></g><g data-layer="55"><line id="eq0-AB-1" data-role="indicator" stroke="#111" stroke-wi