<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 360" width="620" height="360" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">서로 평행한 세 직선이 두 직선과 만나고, 한 직선 위의 두 선분의 길이가 위부터 x, 12-x, 다른 직선 위의 대응하는 두 선분의 길이가 위부터 4, 5로 표시된 그림이다.</title><desc id="visual-desc">세 개의 평행한 직선과 이를 가로지르는 두 직선이 보이며, 왼쪽 직선 위에는 위부터 x와 12-x가, 오른쪽 직선 위에는 위부터 4와 5가 표시되어 있다.</desc><rect width="620" height="360" fill="#fff"/><g data-layer="30"><line id="sAB" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="61.785714286" y1="63.951762523" x2="199.32436611" y2="167.105751391"/></g><g data-layer="30"><line id="sBC" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="199.32436611" y1="167.105751391" x2="371.247680891" y2="296.048237477"/></g><g data-layer="30"><line id="sDE" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="384.141929499" y1="63.951762523" x2="461.50742115" y2="167.105751391"/></g><g data-layer="30"><line id="sEF" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="461.50742115" y1="167.105751391" x2="558.214285714" y2="296.048237477"/></g><g data-layer="40"><line id="h1" data-role="line" stroke="#111" stroke-width="2.05" fill="none" x1="32" y1="63.951762523" x2="588" y2="63.951762523"/></g><g data-layer="40"><line id="h2" data-role="line" stroke="#111" stroke-width="2.05" fill="none" x1="32"