<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 705 544" width="705" height="544" role="img" aria-labelledby="title desc"><title id="title">세로축 왼쪽에 꼭짓점이 있는 포물선</title><desc id="desc">파란 포물선은 위로 열린다. 꼭짓점은 세로축의 왼쪽에 있다. y축과 교차하는 높이는 x축보다 낮다.</desc><rect width="705" height="544" fill="white" /><line x1="53.0000" y1="347.5349" x2="649.0000" y2="347.5349" stroke="#4d5d72" stroke-width="1.65" stroke-linecap="round" /><polygon points="649.0000,347.5349 636.0000,342.5349 636.0000,352.5349" fill="#4d5d72" /><text x="666.0000" y="339.5349" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#4d5d72" text-anchor="middle">x</text><line x1="414.2121" y1="473.0000" x2="414.2121" y2="58.0000" stroke="#4d5d72" stroke-width="1.65" stroke-linecap="round" /><polygon points="414.2121,58.0000 409.2121,71.0000 419.2121,71.0000" fill="#4d5d72" /><text x="430.2121" y="64.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#4d5d72" text-anchor="middle">y</text><text x="393.2121" y="375.5349" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#4d5d72" text-anchor="middle">O</text><path d="M 110.1919 99.4960 Q 329.1768 780.5544 548.1616 99.4960" stroke="#205d9c" stroke-width="6.0" stroke-linecap="round" fill="none" /></svg>
