<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 705 544" width="705" height="544" role="img" aria-labelledby="title desc"><title id="title">직선의 계수와 구하는 포물선</title><desc id="desc">주황 점선 직선은 세로축의 2와 가로축의 1을 지난다. 파란 포물선의 꼭짓점은 (1,1)이며 두 가지가 위로 열린다.</desc><rect width="705" height="544" fill="white" /><line x1="92.2967" y1="197.6378" x2="483.0806" y2="465.8818" stroke="#aa5411" stroke-width="4.4" stroke-linecap="round" stroke-dasharray="13 7" /><line x1="53.0000" y1="375.9676" x2="649.0000" y2="375.9676" stroke="#4d5d72" stroke-width="1.65" stroke-linecap="round" /><polygon points="649.0000,375.9676 636.0000,370.9676 636.0000,380.9676" fill="#4d5d72" /><text x="666.0000" y="367.9676" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#4d5d72" text-anchor="middle">x</text><line x1="242.9341" y1="473.0000" x2="242.9341" y2="80.0000" stroke="#4d5d72" stroke-width="1.65" stroke-linecap="round" /><polygon points="242.9341,80.0000 237.9341,93.0000 247.9341,93.0000" fill="#4d5d72" /><text x="258.9341" y="86.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#4d5d72" text-anchor="middle">y</text><text x="221.9341" y="403.9676" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#4d5d72" text-anchor="middle">O</text><path d="M 90.1136 122.7092 Q 351.5458 553.3983 612.9780 124.5038" stroke="#205d9c" stroke-width="6.0" stroke-linecap="round" fill="none" /><circle cx="352.0915750915751" cy="338.50333651096287" r="6.0" fill="white" stroke="#25736e" stroke-width="3.1" /><circle cx="242.93406593406593" cy="301.0390848427073" r="6.0" fill="white" stroke="#25736e" stroke-width="3.1" /><line x1="64.0000" y1="39.0000" x2="114.0000" y2="39.0000" stroke="#aa5411" stroke-width="5.4" stroke-linecap="round" stroke-dasharray="13 7" /><text x="126.0000" y="47.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#aa5411" text-anchor="start">주어진 직선</text><line x1="379.0000" y1="39.0000" x2="429.0000" y2="39.0000" stroke="#205d9c" stroke-width="5.4" stroke-linecap="round" /><text x="441.0000" y="47.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#205d9c" text-anchor="start">구하는 포물선</text></svg>
