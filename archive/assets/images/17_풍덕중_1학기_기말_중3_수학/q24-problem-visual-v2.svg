<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 705 544" width="705" height="544" role="img" aria-labelledby="title desc"><title id="title">꼭짓점과 y절편이 표시된 포물선</title><desc id="desc">위로 열린 파란 포물선의 꼭짓점은 (1,−4)이다. 세로축과 만나는 점의 높이는 −3이다. 꼭짓점의 x좌표와 y좌표를 점선으로 표시했다.</desc><rect width="705" height="544" fill="white" /><line x1="307.9690" y1="425.6784" x2="388.4008" y2="425.6784" stroke="#25736e" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="7 6" /><line x1="388.4008" y1="425.6784" x2="388.4008" y2="289.5012" stroke="#25736e" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="7 6" /><line x1="53.0000" y1="289.5012" x2="649.0000" y2="289.5012" stroke="#4d5d72" stroke-width="1.65" stroke-linecap="round" /><polygon points="649.0000,289.5012 636.0000,284.5012 636.0000,294.5012" fill="#4d5d72" /><text x="666.0000" y="281.5012" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#4d5d72" text-anchor="middle">x</text><line x1="307.9690" y1="473.0000" x2="307.9690" y2="58.0000" stroke="#4d5d72" stroke-width="1.65" stroke-linecap="round" /><polygon points="307.9690,58.0000 302.9690,71.0000 312.9690,71.0000" fill="#4d5d72" /><text x="323.9690" y="64.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#4d5d72" text-anchor="middle">y</text><text x="286.9690" y="317.5012" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#4d5d72" text-anchor="middle">O</text><path d="M 137.4534 94.2776 Q 388.4008 757.0792 639.3482 94.2776" stroke="#205d9c" stroke-width="6.0" stroke-linecap="round" fill="none" /><circle cx="388.4008097165992" cy="425.67842493847417" r="6.0" fill="white" stroke="#25736e" stroke-width="3.1" /><circle cx="307.9689608636977" cy="391.6341263330599" r="6.0" fill="white" stroke="#25736e" stroke-width="3.1" /><line x1="388.4008" y1="284.5012" x2="388.4008" y2="294.5012" stroke="#4d5d72" stroke-width="1.7" stroke-linecap="round" /><text x="388.4008" y="274.5012" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#4d5d72" text-anchor="middle">1</text><line x1="302.9690" y1="425.6784" x2="312.9690" y2="425.6784" stroke="#4d5d72" stroke-width="1.7" stroke-linecap="round" /><text x="281.9690" y="435.6784" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#4d5d72" text-anchor="middle">−4</text><line x1="302.9690" y1="391.6341" x2="312.9690" y2="391.6341" stroke="#4d5d72" stroke-width="1.7" stroke-linecap="round" /><text x="279.9690" y="401.6341" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#4d5d72" text-anchor="middle">−3</text></svg>
