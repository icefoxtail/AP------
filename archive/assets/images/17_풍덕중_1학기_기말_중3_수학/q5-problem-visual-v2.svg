<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 616 539" width="616" height="539" role="img" aria-labelledby="title desc"><title id="title">반지름을 늘려 생긴 둥근 띠</title><desc id="desc">두 원은 중심이 같다. 중심부터 안쪽 원까지가 2 cm, 안쪽 원에서 바깥 원까지 더 늘어난 길이가 x cm이다. 두 원 사이의 띠를 칠했다.</desc><rect width="616" height="539" fill="white" /><circle cx="281" cy="251" r="189" fill="#f6d9b8" stroke="#aa5411" stroke-width="5.1" /><circle cx="281" cy="251" r="100" fill="white" stroke="#205d9c" stroke-width="4.6" /><line x1="281.0000" y1="251.0000" x2="381.0000" y2="251.0000" stroke="#205d9c" stroke-width="3.5" stroke-linecap="round" /><line x1="381.0000" y1="251.0000" x2="470.0000" y2="251.0000" stroke="#aa5411" stroke-width="3.5" stroke-linecap="round" /><circle cx="281" cy="251" r="4.6" fill="#28364b" /><text x="331.0000" y="233.0000" font-size="30" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#205d9c" text-anchor="middle">2 cm</text><text x="425.5000" y="289.0000" font-size="30" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#aa5411" text-anchor="middle">x cm</text></svg>
