<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 384 540" width="384" height="540" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">6개의 정육각형이 벌집 모양으로 이웃해 있고, 각 정육각형에 1부터 6까지 번호가 붙어 있는 그림이다.</title><desc id="visual-desc">정육각형 6개가 세 줄로 놓여 있다. 첫째 줄에는 1과 2가 나란히 있고, 둘째 줄에는 3과 4가 오른쪽으로 반 칸 어긋나게 있으며, 셋째 줄에는 5와 6이 다시 왼쪽으로 맞추어져 있다. 이웃한 정육각형은 한 변을 공유한다.</desc><rect width="384" height="540" fill="#fff"/><g data-layer="10"><path id="r1" data-role="region" stroke="none" stroke-width="1.6" fill="#e4e7ec" data-owner-points="h1a h1b h1c h1d h1e h1f" data-mark="region" data-mark-id="r1" fill-rule="evenodd" d="M163.894523327 140.182555781 L107.68356998 107.728194726 L51.472616633 140.182555781 L51.472616633 205.09127789 L107.68356998 237.545638945 L163.894523327 205.09127789 L163.894523327 140.182555781 Z"/></g><g data-layer="10"><path id="r2" data-role="region" stroke="none" stroke-width="1.6" fill="#e4e7ec" data-owner-points="h2a h2b h2c h2d h2e h2f" data-mark="region" data-mark-id="r2" fill-rule="evenodd" d="M276.31643002 140.182555781 L220.105476673 107.728194726 L163.894523327 140.182555781 L163.894523327 205.09127789 L220.105476673 237.545638945 L276.31643002 205.09127789 L276.31643002 140.182555781 Z"/></g><g data-layer="10"><path id="r3" data-role="region" stroke="none" stroke-width="1.6" fill="#e4e7ec" data-owner-points="h3a h3b h3c h3d h3e h3