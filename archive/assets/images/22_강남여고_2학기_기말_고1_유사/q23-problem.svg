<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 360" width="700" height="360" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">위쪽에 다섯 개의 좌석이 한 줄로, 아래쪽에 네 개의 좌석이 한 줄로 원 모양으로 놓여 있고, 아래쪽 좌석은 각각 위쪽 좌석 하나와 마주 보도록 정렬되어 있다. 두 줄 사이에는 긴 직사각형 탁자가 있다.</title><desc id="visual-desc">위쪽에 원 모양 좌석 다섯 개가 같은 간격으로 놓여 있고, 아래쪽에 원 모양 좌석 네 개가 위쪽 좌석과 마주 보도록 놓여 있다. 두 좌석 줄 사이에 긴 직사각형 탁자가 그려져 있다.</desc><rect width="700" height="360" fill="#fff"/><g data-layer="30"><line id="sTop" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="111.290322581" y1="120.322580645" x2="588.709677419" y2="120.322580645"/></g><g data-layer="30"><line id="sRight" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="588.709677419" y1="120.322580645" x2="588.709677419" y2="239.677419355"/></g><g data-layer="30"><line id="sBottom" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="588.709677419" y1="239.677419355" x2="111.290322581" y2="239.677419355"/></g><g data-layer="30"><line id="sLeft" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="111.290322581" y1="239.677419355" x2="111.290322581" y2="120.322580645"/></g><g data-layer="40"><circle id="cT1" data-role="circle" stroke="#111" stroke-width="2.05" fill="none" cx="151.075268817" cy="60.64516129" r="27.352150538"/></g><g data-layer="40"><circle id="cT2" data-role="circ