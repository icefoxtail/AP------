<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 380" width="660" height="380" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">원기둥 모양 그릇과 원뿔 모양 그릇을 나란히 옆에서 본 모양이다. 원기둥의 밑면 반지름과 높이, 원뿔의 밑면 반지름이 주어져 있고 원뿔의 높이는 구해야 하는 값이다.</title><desc id="visual-desc">왼쪽에 원기둥을 옆에서 본 직사각형이, 오른쪽에 원뿔을 옆에서 본 삼각형이 있다. 원기둥의 밑면 반지름은 a, 높이는 3a-6b로 표시되어 있고, 원뿔의 밑면 반지름은 3a로 표시되어 있으며 원뿔의 높이는 표시되어 있지 않다.</desc><rect width="660" height="380" fill="#fff"/><g data-layer="30"><line id="sP1P2" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="63.928571429" y1="243.214285714" x2="170.357142857" y2="243.214285714"/></g><g data-layer="30"><line id="sP2P3" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="170.357142857" y1="243.214285714" x2="170.357142857" y2="136.785714286"/></g><g data-layer="30"><line id="sP3P4" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="170.357142857" y1="136.785714286" x2="63.928571429" y2="136.785714286"/></g><g data-layer="30"><line id="sP4P1" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="63.928571429" y1="136.785714286" x2="63.928571429" y2="243.214285714"/></g><g data-layer="30"><line id="sAK" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="436.428571429" y1="136.785714286" x2="276.785714286" y2="243.214285714"/></g><g data-layer="30"><line id="sAQ" d