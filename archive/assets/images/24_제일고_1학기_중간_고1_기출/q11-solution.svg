<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 360" width="840" height="360" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_1" data-geometry-preset="GEOMETRY_STANDARD" data-axis-scale-mode="EQUAL_UNIT" data-fact-hash="c6b2c52c49fe2a09c281594f4ff324edc506ccecc0b88610d38fc08da84b4df9" data-geometry-fact-hash="c6b2c52c49fe2a09c281594f4ff324edc506ccecc0b88610d38fc08da84b4df9" data-visual-provenance="deterministic-independent-facts">
  <title id="title">선분 AB의 4등분점과 B에 가장 가까운 점</title>
  <desc id="desc">A(3,5), B(-5,-1)와 네 등분점 P1, P2, P3를 표시하고 B에 가장 가까운 P3(-3,1/2)가 AP3:P3B=3:1임을 나타낸 그림</desc>
  <style>
    .title{font:700 18px "Noto Sans KR","Malgun Gothic",sans-serif;fill:#111827}.note{font:12px "Noto Sans KR","Malgun Gothic",sans-serif;fill:#334155}.label{font:700 12px "STIX Two Math","Malgun Gothic",serif}.axis{font:italic 14px "STIX Two Math","Malgun Gothic",serif;fill:#111827}
  </style>
  <rect width="840" height="360" fill="#fff"/>
  <text x="28" y="32" class="title">선분 AB의 4등분점</text>
  <text x="28" y="54" class="note">A — P₁ — P₂ — P₃ — B · B에 가장 가까운 점은 P₃</text>
  <rect x="24" y="72" width="520" height="240" rx="12" fill="#fff" stroke="#cbd5e1"/>
  <line data-geometry="axis-x" x1="54" y1="266" x2="510" y2="266" stroke="#111827" stroke-width="1.3"/><line data-geometry="axis-y" x1="54" y1="100" x2="54" y2="290" stroke="#111827" stroke-width="1.3"/>
  <text x="500" y="258" class="axis">x</text><text x="62" y="110" class="axis">y</text>
  <line data-geometry="segment" data-relation="AB" x1="234" y1="116" x2="54" y2="296" stroke="#64748b" stroke-width="2.4"/>
  <line data-geometry="segment" data-relation="AP3" x1="234" y1="116" x2="99" y2="251" stroke="#2563eb" stroke-width="5"/>
  <line data-geometry="segment" data-relation="P3B" x1="99" y1="251" x2="54" y2="296" stroke="#16a34a" stroke-width="5"/>
  <circle data-point-label="A(3,5)" data-point-x="3" data-point-y="5" cx="234" cy="116" r="5" fill="#111827"/><circle data-point-label="P1(1,7/2)" data-point-x="1" data-point-y="3.5" cx="189" cy="161" r="4" fill="#94a3b8"/><circle data-point-label="P2(-1,2)" data-point-x="-1" data-point-y="2" cx="144" cy="206" r="4" fill="#94a3b8"/><circle data-point-label="P3(-3,1/2)" data-point-x="-3" data-point-y="0.5" cx="99" cy="251" r="5" fill="#2563eb"/><circle data-point-label="B(-5,-1)" data-point-x="-5" data-point-y="-1" cx="54" cy="296" r="5" fill="#16a34a"/>
  <text x="242" y="111" class="label">A(3,5)</text><text x="190" y="153" class="label">P₁</text><text x="146" y="198" class="label">P₂</text><text x="106" y="247" class="label" fill="#1d4ed8">P₃(−3,1/2)</text><text x="62" y="315" class="label" fill="#15803d">B(−5,−1)</text>
  <text x="110" y="135" class="note" fill="#1d4ed8">AP₃</text><text x="65" y="278" class="note" fill="#15803d">P₃B</text>
  <rect x="568" y="72" width="248" height="240" rx="12" fill="#f8fafc" stroke="#dbe3ef"/>
  <text x="586" y="102" class="title" style="font-size:15px">핵심 관계</text><text x="586" y="132" class="note">AB를 4등분</text><text x="586" y="157" class="note">A-P₁-P₂-P₃-B</text><text x="586" y="184" class="note">AP₃:P₃B=3:1</text><text x="586" y="212" class="note">xₚ₃=(3·(−5)+1·3)/4=−3</text><text x="586" y="238" class="note">yₚ₃=(3·(−1)+1·5)/4=1/2</text><text x="586" y="275" class="note">P₃가 B에 가장 가깝다</text>
