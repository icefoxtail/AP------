<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 420" width="480" height="420" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">그래프가 y축에 평행하려면 y의 계수 b=0이어야 하고 식은 ax−2=0, 즉 x=2/a이다. 점 (2,1)을 지나므로 x=2이고 2/a=2에서 a=1이다. 따라서 a−b=1−0=1이고 답은 ③이다.</title><desc id="visual-desc">위아래로 곧은 직선이 x좌표 2에서 y축에 평행하게 있고 그 위의 점 (2,1)의 좌표가 표시되어 있다.</desc><rect width="480" height="420" fill="#fff"/><g data-layer="30"><line id="x-axis" data-role="axis" stroke="#111" stroke-width="1.2" fill="none" data-axis="x" x1="32" y1="271.176470588" x2="448" y2="271.176470588"/></g><g data-layer="30"><line id="y-axis" data-role="axis" stroke="#111" stroke-width="1.2" fill="none" data-axis="y" x1="117.647058824" y1="356.823529412" x2="117.647058824" y2="63.176470588"/></g><g data-layer="40"><line id="lV" data-role="line" stroke="#111" stroke-width="2.05" fill="none" x1="362.352941176" y1="356.823529412" x2="362.352941176" y2="63.176470588"/></g><g data-layer="70"><circle id="O" data-role="point" stroke="#111" stroke-width="0.8" fill="#111" cx="117.647058824" cy="271.176470588" r="3.2"/></g><g data-layer="70"><circle id="X" data-role="point" stroke="#111" stroke-width="0.8" fill="#111" cx="240" cy="271.176470588" r="3.2"/></g><g data-layer="70"><circle id="P" data-role="point" stroke="#111" stroke-width="0.8" fill="#111" cx="362.352941176" cy="148.823529412" r="3.2"/><