<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 652" width="730" height="652" role="img" aria-labelledby="title desc"><title id="title">제2사분면과 네 일차함수의 예시</title><desc id="desc">흰 바탕에 네 함수를 두 줄로 비교했다. 각 좌표평면에서 제2사분면 영역은 옅은 청록이다. 예시 값 a=−1, b=2를 쓰고 각 직선은 식의 부호와 일치한다.</desc><rect width="730" height="652" fill="white" /><rect x="16" y="55" width="342" height="281" rx="14" fill="white" stroke="#dce7ef" stroke-width="2" /><text x="187.0000" y="92.0000" font-size="30" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#293b4b" text-anchor="middle">㉠  y = (a−b)x + b</text><rect x="58" y="120" width="133.2982456140351" height="94.5625" fill="#e2f2ed" /><line x1="58.0000" y1="214.5625" x2="307.0000" y2="214.5625" stroke="#586574" stroke-width="2.05" stroke-linecap="round" /><polygon points="320.0000,214.5625 307.0000,209.3625 307.0000,219.7625" fill="#586574" /><line x1="191.2982" y1="307.0000" x2="191.2982" y2="133.0000" stroke="#586574" stroke-width="2.05" stroke-linecap="round" /><polygon points="191.2982,120.0000 186.0982,133.0000 196.4982,133.0000" fill="#586574" /><text x="83.0000" y="146.0000" font-size="30" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#227365" text-anchor="middle">Ⅱ</text><line x1="156.0524" y1="123.1790" x2="286.2985" y2="303.8210" stroke="#227365" stroke-width="7.15" stroke-linecap="round" /><text x="336.000" y="201.562" fill="#586574" font-size="30" font-weight="600" font-family="Malgun Gothic, Cambria Math, sans-serif" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="4.0" stroke-linejoin="round">x</text><text x="210.298" y="115.000" fill="#586574" font-size="30" font-weight="600" font-family="Malgun Gothic, Cambria Math, sans-serif" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="4.0" stroke-linejoin="round">y</text><text x="170.298" y="239.562" fill="#586574" font-size="30" font-weight="600" font-family="Malgun Gothic, Cambria Math, sans-serif" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="4.0" stroke-linejoin="round">O</text><rect x="372" y="55" width="342" height="281" rx="14" fill="white" stroke="#dce7ef" stroke-width="2" /><text x="543.0000" y="92.0000" font-size="30" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#293b4b" text-anchor="middle">㉡  y = (b−a)x − b</text><rect x="414" y="120" width="133.29824561403507" height="94.5625" fill="#e2f2ed" /><line x1="414.0000" y1="214.5625" x2="663.0000" y2="214.5625" stroke="#586574" stroke-width="2.05" stroke-linecap="round" /><polygon points="676.0000,214.5625 663.0000,209.3625 663.0000,219.7625" fill="#586574" /><line x1="547.2982" y1="307.0000" x2="547.2982" y2="133.0000" stroke="#586574" stroke-width="2.05" stroke-linecap="round" /><polygon points="547.2982,120.0000 542.0982,133.0000 552.4982,133.0000" fill="#586574" /><text x="439.0000" y="146.0000" font-size="30" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#227365" text-anchor="middle">Ⅱ</text><line x1="513.5845" y1="303.8210" x2="643.8307" y2="123.1790" stroke="#a34c1f" stroke-width="7.15" stroke-linecap="round" stroke-dasharray="11 6" /><text x="692.000" y="201.562" fill="#586574" font-size="30" font-weight="600" font-family="Malgun Gothic, Cambria Math, sans-serif" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="4.0" stroke-linejoin="round">x</text><text x="566.298" y="115.000" fill="#586574" font-size="30" font-weight="600" font-family="Malgun Gothic, Cambria Math, sans-serif" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="4.0" stroke-linejoin="round">y</text><text x="526.298" y="239.562" fill="#586574" font-size="30" font-weight="600" font-family="Malgun Gothic, Cambria Math, sans-serif" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="4.0" stroke-linejoin="round">O</text><rect x="16" y="353" width="342" height="281" rx="14" fill="