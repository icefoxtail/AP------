<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 260" width="480" height="260" role="img" aria-labelledby="q13-title q13-desc">
  <title id="q13-title">합동인 두 삼각형의 대응</title>
  <desc id="q13-desc">합동인 삼각형 ABC와 DEF의 각과 변의 수치가 표시된 다이어그램</desc>
  <rect width="480" height="260" fill="#ffffff"/>
  <!-- 삼각형 ABC: A(120,60), B(60,200), C(200,200) -->
  <polygon points="120,60 60,200 200,200" fill="none" stroke="#1e293b" stroke-width="2.5"/>
  <text x="90" y="185" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0f172a">65°</text>
  <text x="175" y="185" font-family="sans-serif" font-size="14" font-weight="bold" fill="#dc2626">a°</text>
  <text x="175" y="125" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2563eb">7 cm</text>
  <!-- 삼각형 DEF: D(360,60), E(300,200), F(440,200) -->
  <polygon points="360,60 300,200 440,200" fill="none" stroke="#1e293b" stroke-width="2.5"/>
  <text x="360" y="90" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0f172a">45°</text>
  <text x="370" y="220" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2563eb">6 cm</text>
  <text x="415" y="125" font-family="sans-serif" font-size="14" font-weight="bold" fill="#dc2626">b cm</text>
  <!-- 라벨 -->
  <g font-family="sans-serif" font-size="16" font-weight="bold" fill="#0f172a" text-anchor="middle">
    <text x="120" y="45">A</text>
    <text x="45" y="215">B</text>
    <text x="215" y="215">C</text>
    <text x="360" y="45">D</text>
    <text x="285" y="215">E</text>
    <text x="455" y="215">F</text>
  </g>
</svg>