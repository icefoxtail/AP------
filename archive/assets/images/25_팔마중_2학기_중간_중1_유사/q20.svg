<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" width="480" height="320" role="img" aria-labelledby="q20-title q20-desc">
  <title id="q20-title">평행선 사이의 정오각형</title>
  <desc id="q20-desc">평행선 l, m 사이에 꼭짓점이 닿아 있는 정오각형과 각 21도 및 x</desc>
  <rect width="480" height="320" fill="#ffffff"/>
  <!-- 평행선 l, m -->
  <line x1="40" y1="70" x2="440" y2="70" stroke="#1e293b" stroke-width="2.5"/>
  <line x1="40" y1="250" x2="440" y2="250" stroke="#1e293b" stroke-width="2.5"/>
  <!-- 정오각형 -->
  <polygon points="200,250 304,210 298,99 191,70 130,164" fill="none" stroke="#2563eb" stroke-width="2.5"/>
  <!-- 꼭짓점 마커 -->
  <circle cx="200" cy="250" r="4.5" fill="#1e293b"/>
  <circle cx="304" cy="210" r="4" fill="#2563eb"/>
  <circle cx="298" cy="99" r="4" fill="#2563eb"/>
  <circle cx="191" cy="70" r="4.5" fill="#1e293b"/>
  <circle cx="130" cy="164" r="4" fill="#2563eb"/>
  <!-- 각 21도 호 및 라벨 -->
  <path d="M 230,250 A 30,30 0 0,0 228,239" fill="none" stroke="#1e293b" stroke-width="1.8"/>
  <text x="245" y="244" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0f172a">21°</text>
  <!-- 각 x 호 및 라벨 -->
  <path d="M 221,70 A 30,30 0 0,1 220,78" fill="none" stroke="#dc2626" stroke-width="1.8"/>
  <text x="235" y="85" font-family="sans-serif" font-size="15" font-weight="bold" fill="#dc2626">x</text>
  <g font-family="sans-serif" font-size="16" font-weight="bold" fill="#0f172a">
    <text x="30" y="75">l</text>
    <text x="30" y="255">m</text>
  </g>
</svg>
