<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" width="520" height="380" role="img" aria-labelledby="q20-title q20-desc">
  <title id="q20-title">평행선과 정오각형의 각 x</title>
  <desc id="q20-desc">평행한 두 직선 l과 m 사이에 14도 기울어져 놓인 정오각형과 각 x의 관계 다이어그램</desc>
  <rect width="520" height="380" fill="#ffffff"/>
  <!-- Parallel lines l and m -->
  <line x1="40" y1="80" x2="480" y2="80" stroke="#0f172a" stroke-width="2.5"/>
  <line x1="40" y1="290" x2="480" y2="290" stroke="#0f172a" stroke-width="2.5"/>
  <text x="495" y="85" font-family="sans-serif" font-size="16" font-style="italic" fill="#0f172a">l</text>
  <text x="495" y="295" font-family="sans-serif" font-size="16" font-style="italic" fill="#0f172a">m</text>
  <!-- Regular pentagon tilted by 14 deg -->
  <polygon points="235,80 355,129 346,259 220,290 151,180" fill="#f8fafc" stroke="#2563eb" stroke-width="2.5"/>
  <!-- Angle 14 deg mark at bottom vertex A -->
  <path d="M 260,290 A 40 40 0 0 0 259,280" fill="none" stroke="#dc2626" stroke-width="2"/>
  <text x="272" y="282" font-family="sans-serif" font-size="14" font-weight="bold" fill="#dc2626">14°</text>
  <!-- Angle x mark at top vertex D -->
  <path d="M 275,80 A 40 40 0 0 1 272,95" fill="none" stroke="#dc2626" stroke-width="2"/>
  <text x="285" y="105" font-family="sans-serif" font-size="16" font-weight="bold" fill="#dc2626">x</text>
  <!-- Vertices -->
  <circle cx="235" cy="80" r="4.5" fill="#0f172a"/>
  <circle cx="355" cy="129" r="4.5" fill="#0f172a"/>
  <circle cx="346" cy="259" r="4.5" fill="#0f172a"/>
  <circle cx="220" cy="290" r="4.5" fill="#0f172a"/>
  <circle cx="151" cy="180" r="4.5" fill="#0f172a"/>
</svg>