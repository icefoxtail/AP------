<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320" width="500" height="320" role="img" aria-labelledby="q15-title q15-desc">
  <title id="q15-title">두 선분의 교차와 네 각 a, b, c, d</title>
  <desc id="q15-desc">선분 AD와 BC의 교점 O를 중심으로 형성된 두 삼각형과 각 a, b, c, d 다이어그램</desc>
  <rect width="500" height="320" fill="#ffffff"/>
  <!-- Segments AD and BC intersecting at O -->
  <line x1="70" y1="70" x2="430" y2="250" stroke="#0f172a" stroke-width="2.5"/>
  <line x1="70" y1="250" x2="430" y2="70" stroke="#0f172a" stroke-width="2.5"/>
  <!-- Triangle sides AB and CD -->
  <line x1="70" y1="70" x2="70" y2="250" stroke="#2563eb" stroke-width="2.5"/>
  <line x1="430" y1="70" x2="430" y2="250" stroke="#2563eb" stroke-width="2.5"/>
  <!-- Center O -->
  <circle cx="250" cy="160" r="4" fill="#0f172a"/>
  <text x="250" y="145" font-family="sans-serif" font-size="16" font-weight="bold" fill="#0f172a" text-anchor="middle">O</text>
  <!-- Angles on left triangle -->
  <text x="95" y="105" font-family="sans-serif" font-size="16" font-weight="bold" fill="#dc2626">a</text>
  <text x="95" y="235" font-family="sans-serif" font-size="16" font-weight="bold" fill="#dc2626">b</text>
  <text x="210" y="165" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0f172a">30°</text>
  <!-- Angles on right triangle -->
  <text x="405" y="105" font-family="sans-serif" font-size="16" font-weight="bold" fill="#dc2626">c</text>
  <text x="405" y="235" font-family="sans-serif" font-size="16" font-weight="bold" fill="#dc2626">d</text>
  <text x="280" y="165" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0f172a">30°</text>
  <!-- Labels -->
  <g font-family="sans-serif" font-size="16" font-weight="bold" fill="#0f172a" text-anchor="middle">
    <text x="50" y="75">A</text>
    <text x="50" y="260">B</text>
    <text x="450" y="75">C</text>
    <text x="450" y="260">D</text>
  </g>
</svg>