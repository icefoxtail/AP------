<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 420" width="500" height="420" role="img" aria-labelledby="q14-title q14-desc">
  <title id="q14-title">정사각형 ABCD와 정삼각형 CDE</title>
  <desc id="q14-desc">정사각형 ABCD의 외부에 한 변 CD를 공유하는 정삼각형 CDE를 붙여 만든 다이어그램</desc>
  <rect width="500" height="420" fill="#ffffff"/>
  <!-- Square ABCD -->
  <polygon points="100,320 260,320 260,160 100,160" fill="#f8fafc" stroke="#0f172a" stroke-width="2.5"/>
  <polygon points="260,160 100,160 180,21" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/>
  <!-- Line segment AE -->
  <line x1="100" y1="320" x2="180" y2="21" stroke="#dc2626" stroke-width="2" stroke-dasharray="4,4"/>
  <!-- Vertices -->
  <circle cx="100" cy="320" r="5" fill="#0f172a"/>
  <circle cx="260" cy="320" r="5" fill="#0f172a"/>
  <circle cx="260" cy="160" r="5" fill="#0f172a"/>
  <circle cx="100" cy="160" r="5" fill="#0f172a"/>
  <circle cx="180" cy="21" r="5" fill="#2563eb"/>
  <!-- Labels -->
  <g font-family="sans-serif" font-size="16" font-weight="bold" fill="#0f172a" text-anchor="middle">
    <text x="80" y="335">A</text>
    <text x="280" y="335">B</text>
    <text x="280" y="165">C</text>
    <text x="80" y="165">D</text>
    <text x="180" y="14" fill="#2563eb">E</text>
  </g>
</svg>
