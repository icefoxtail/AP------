<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 460" width="460" height="460" role="img" aria-labelledby="q19-title q19-desc">
  <title id="q19-title">원 위에 등간격으로 놓인 10개의 점</title>
  <desc id="q19-desc">원 둘레에 동일한 간격으로 배치된 10개의 점 다이어그램</desc>
  <rect width="460" height="460" fill="#ffffff"/>
  <!-- Main circle -->
  <circle cx="230" cy="230" r="160" fill="none" stroke="#64748b" stroke-width="2"/>
  <!-- 10 dots on circle at 36 deg intervals -->
  <circle cx="390" cy="230" r="6" fill="#2563eb"/>
  <circle cx="359" cy="324" r="6" fill="#2563eb"/>
  <circle cx="279" cy="382" r="6" fill="#2563eb"/>
  <circle cx="181" cy="382" r="6" fill="#2563eb"/>
  <circle cx="101" cy="324" r="6" fill="#2563eb"/>
  <circle cx="70" cy="230" r="6" fill="#2563eb"/>
  <circle cx="101" cy="136" r="6" fill="#2563eb"/>
  <circle cx="181" cy="78" r="6" fill="#2563eb"/>
  <circle cx="279" cy="78" r="6" fill="#2563eb"/>
  <circle cx="359" cy="136" r="6" fill="#2563eb"/>
  <!-- Center marker -->
  <circle cx="230" cy="230" r="3" fill="#94a3b8"/>
</svg>
