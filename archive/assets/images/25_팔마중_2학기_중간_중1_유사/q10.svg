<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 260" width="480" height="260" role="img" aria-labelledby="q10-title q10-desc">
  <title id="q10-title">크기가 같은 각의 작도</title>
  <desc id="q10-desc">각 XOY와 크기가 같은 각을 반직선 PQ 위에 옮겨 작도하는 과정</desc>
  <rect width="480" height="260" fill="#ffffff"/>
  <!-- 원래 각 XOY -->
  <line x1="50" y1="180" x2="200" y2="180" stroke="#1e293b" stroke-width="2.5"/>
  <line x1="50" y1="180" x2="160" y2="70" stroke="#1e293b" stroke-width="2.5"/>
  <circle cx="50" cy="180" r="4.5" fill="#1e293b"/>
  <!-- 호 AB -->
  <path d="M 120,180 A 70,70 0 0,0 99,129" fill="none" stroke="#2563eb" stroke-width="2"/>
  <circle cx="120" cy="180" r="4" fill="#2563eb"/>
  <circle cx="99" cy="129" r="4" fill="#2563eb"/>
  <!-- 새 각 RPQ -->
  <line x1="280" y1="180" x2="430" y2="180" stroke="#1e293b" stroke-width="2.5"/>
  <line x1="280" y1="180" x2="390" y2="70" stroke="#1e293b" stroke-width="2.5"/>
  <circle cx="280" cy="180" r="4.5" fill="#1e293b"/>
  <!-- 호 C, D -->
  <path d="M 350,180 A 70,70 0 0,0 329,129" fill="none" stroke="#2563eb" stroke-width="2"/>
  <circle cx="350" cy="180" r="4" fill="#2563eb"/>
  <circle cx="329" cy="129" r="4" fill="#2563eb"/>
  <!-- 라벨 -->
  <g font-family="sans-serif" font-size="15" font-weight="bold" fill="#0f172a" text-anchor="middle">
    <text x="40" y="195">O</text>
    <text x="205" y="195">X</text>
    <text x="165" y="60">Y</text>
    <text x="120" y="200">A</text>
    <text x="90" y="125">B</text>
    <text x="270" y="195">P</text>
    <text x="435" y="195">Q</text>
    <text x="350" y="200">C</text>
    <text x="320" y="125">D</text>
  </g>
</svg>