<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 340" width="480" height="340" role="img" aria-labelledby="q17-title q17-desc">
  <title id="q17-title">평행선과 이등변삼각형</title>
  <desc id="q17-desc">평행선 l, m 사이의 삼각형 ABC와 이등변삼각형 ADE의 각도 관계</desc>
  <rect width="480" height="340" fill="#ffffff"/>
  <!-- 평행선 l, m -->
  <line x1="40" y1="70" x2="440" y2="70" stroke="#1e293b" stroke-width="2.5"/>
  <line x1="40" y1="210" x2="440" y2="210" stroke="#1e293b" stroke-width="2.5"/>
  <!-- 직선 BAD (D(320,70), A(240,210), B(180,315)) -->
  <line x1="330" y1="52" x2="170" y2="332" stroke="#1e293b" stroke-width="2"/>
  <!-- 삼각형 ABC의 변 BC와 AC -->
  <line x1="180" y1="315" x2="380" y2="210" stroke="#1e293b" stroke-width="2"/>
  <line x1="240" y1="210" x2="380" y2="210" stroke="#1e293b" stroke-width="2.5"/>
  <!-- 이등변삼각형 DAE의 변 DE(직선 l 위)와 AE -->
  <line x1="160" y1="70" x2="320" y2="70" stroke="#2563eb" stroke-width="2.5"/>
  <line x1="240" y1="210" x2="160" y2="70" stroke="#2563eb" stroke-width="2"/>
  <!-- 같은 길이 표시 (DA = DE) -->
  <line x1="240" y1="63" x2="240" y2="77" stroke="#dc2626" stroke-width="2"/>
  <line x1="274" y1="137" x2="286" y2="143" stroke="#dc2626" stroke-width="2"/>
  <!-- 점 마커 -->
  <circle cx="180" cy="315" r="4.5" fill="#1e293b"/>
  <circle cx="240" cy="210" r="4.5" fill="#1e293b"/>
  <circle cx="380" cy="210" r="4.5" fill="#1e293b"/>
  <circle cx="320" cy="70" r="4.5" fill="#1e293b"/>
  <circle cx="160" cy="70" r="4.5" fill="#2563eb"/>
  <!-- 각도 및 라벨 -->
  <text x="195" y="300" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a">30°</text>
  <text x="345" y="200" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a">40°</text>
  <g font-family="sans-serif" font-size="15" font-weight="bold" fill="#0f172a">
    <text x="30" y="75">l</text>
    <text x="30" y="215">m</text>
    <text x="165" y="325">B</text>
    <text x="245" y="235">A</text>
    <text x="395" y="215">C</text>
    <text x="330" y="60">D</text>
    <text x="145" y="60" fill="#2563eb">E</text>
  </g>
</svg>
