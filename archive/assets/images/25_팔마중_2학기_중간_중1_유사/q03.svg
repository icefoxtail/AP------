<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 180" width="540" height="180" role="img" aria-labelledby="q03-title q03-desc">
  <title id="q03-title">선분의 중점 M과 N의 관계</title>
  <desc id="q03-desc">선분 AB의 중점 M, 선분 BC의 중점 N, 그리고 선분 MN의 길이가 18cm인 다이어그램</desc>
  <rect width="540" height="180" fill="#ffffff"/>
  <!-- Main Segment AC -->
  <line x1="50" y1="90" x2="490" y2="90" stroke="#0f172a" stroke-width="3"/>
  <!-- Points A, M, B, N, C -->
  <circle cx="70" cy="90" r="5" fill="#0f172a"/>
  <circle cx="210" cy="90" r="5" fill="#2563eb"/>
  <circle cx="350" cy="90" r="5" fill="#0f172a"/>
  <circle cx="410" cy="90" r="5" fill="#2563eb"/>
  <circle cx="470" cy="90" r="5" fill="#0f172a"/>
  <!-- Labels -->
  <g font-family="sans-serif" font-size="16" font-weight="bold" fill="#0f172a" text-anchor="middle">
    <text x="70" y="70">A</text>
    <text x="210" y="70">M</text>
    <text x="350" y="70">B</text>
    <text x="410" y="70">N</text>
    <text x="470" y="70">C</text>
  </g>
  <!-- Dimension MN -->
  <line x1="210" y1="120" x2="410" y2="120" stroke="#2563eb" stroke-width="1.5"/>
  <line x1="210" y1="110" x2="210" y2="130" stroke="#2563eb" stroke-width="1.5"/>
  <line x1="410" y1="110" x2="410" y2="130" stroke="#2563eb" stroke-width="1.5"/>
  <text x="310" y="145" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2563eb" text-anchor="middle">18 cm</text>
</svg>
