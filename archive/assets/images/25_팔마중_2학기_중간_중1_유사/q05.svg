<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 380" width="500" height="380" role="img" aria-labelledby="q05-title q05-desc">
  <title id="q05-title">두 직선 AD, BE와 수선 OC가 이루는 각</title>
  <desc id="q05-desc">교점 O에서 만나는 두 직선 AD, BE와 수선 OC에 의해 생기는 각의 관계</desc>
  <rect width="500" height="380" fill="#ffffff"/>
  <!-- Line AD -->
  <line x1="50" y1="190" x2="450" y2="190" stroke="#0f172a" stroke-width="2.5"/>
  <!-- Line BE (slant) -->
  <line x1="100" y1="318" x2="400" y2="62" stroke="#0f172a" stroke-width="2.5"/>
  <!-- Ray OC perpendicular to AD pointing downwards -->
  <line x1="250" y1="190" x2="250" y2="330" stroke="#0f172a" stroke-width="2.5"/>
  <!-- Right angle mark at O for OC perp AD -->
  <path d="M 250,215 L 275,215 L 275,190" fill="none" stroke="#dc2626" stroke-width="2"/>
  <!-- Center O -->
  <circle cx="250" cy="190" r="5" fill="#0f172a"/>
  <!-- Points along lines -->
  <circle cx="65" cy="190" r="4" fill="#0f172a"/>
  <circle cx="435" cy="190" r="4" fill="#0f172a"/>
  <circle cx="115" cy="305" r="4" fill="#0f172a"/>
  <circle cx="385" cy="75" r="4" fill="#0f172a"/>
  <circle cx="250" cy="315" r="4" fill="#0f172a"/>
  <!-- Labels -->
  <g font-family="sans-serif" font-size="16" font-weight="bold" fill="#0f172a">
    <text x="45" y="180">A</text>
    <text x="445" y="180">D</text>
    <text x="95" y="325">B</text>
    <text x="400" y="70">E</text>
    <text x="240" y="350">C</text>
    <text x="235" y="180">O</text>
  </g>
</svg>