<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 160" width="500" height="160" role="img" aria-labelledby="q02-title q02-desc">
  <title id="q02-title">직선 l 위의 네 점 A, B, C, D</title>
  <desc id="q02-desc">직선 l 위에 순서대로 배열된 네 점 A, B, C, D 다이어그램</desc>
  <rect width="500" height="160" fill="#ffffff"/>
  <!-- Line l -->
  <line x1="40" y1="80" x2="460" y2="80" stroke="#0f172a" stroke-width="2.5"/>
  <polyline points="450,75 460,80 450,85" fill="none" stroke="#0f172a" stroke-width="2"/>
  <polyline points="50,75 40,80 50,85" fill="none" stroke="#0f172a" stroke-width="2"/>
  <text x="475" y="85" font-family="sans-serif" font-size="16" font-style="italic" fill="#0f172a">l</text>
  <!-- Points A, B, C, D -->
  <circle cx="100" cy="80" r="5" fill="#2563eb"/>
  <circle cx="190" cy="80" r="5" fill="#2563eb"/>
  <circle cx="280" cy="80" r="5" fill="#2563eb"/>
  <circle cx="370" cy="80" r="5" fill="#2563eb"/>
  <!-- Labels -->
  <g font-family="sans-serif" font-size="16" font-weight="bold" fill="#0f172a" text-anchor="middle">
    <text x="100" y="60">A</text>
    <text x="190" y="60">B</text>
    <text x="280" y="60">C</text>
    <text x="370" y="60">D</text>
  </g>
</svg>
