<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 280" width="480" height="280" role="img" aria-labelledby="q21-title q21-desc">
  <title id="q21-title">맞꼭지각과 삼각형의 내각</title>
  <desc id="q21-desc">점 O에서 맞꼭지각을 이루는 두 삼각형 AOB와 COD</desc>
  <rect width="480" height="280" fill="#ffffff"/>
  <!-- 두 삼각형: A(60,60), B(60,220), O(240,140), C(420,60), D(420,220) -->
  <polygon points="60,60 60,220 240,140" fill="none" stroke="#1e293b" stroke-width="2.5"/>
  <polygon points="420,60 420,220 240,140" fill="none" stroke="#1e293b" stroke-width="2.5"/>
  <circle cx="60" cy="60" r="4.5" fill="#1e293b"/>
  <circle cx="60" cy="220" r="4.5" fill="#1e293b"/>
  <circle cx="240" cy="140" r="4.5" fill="#1e293b"/>
  <circle cx="420" cy="60" r="4.5" fill="#1e293b"/>
  <circle cx="420" cy="220" r="4.5" fill="#1e293b"/>
  <text x="90" y="90" font-family="sans-serif" font-size="15" font-weight="bold" fill="#0f172a">72°</text>
  <text x="90" y="205" font-family="sans-serif" font-size="15" font-weight="bold" fill="#0f172a">46°</text>
  <text x="375" y="90" font-family="sans-serif" font-size="15" font-weight="bold" fill="#0f172a">58°</text>
  <text x="380" y="205" font-family="sans-serif" font-size="16" font-weight="bold" fill="#dc2626">x</text>
  <g font-family="sans-serif" font-size="16" font-weight="bold" fill="#0f172a" text-anchor="middle">
    <text x="45" y="60">A</text>
    <text x="45" y="235">B</text>
    <text x="240" y="165">O</text>
    <text x="435" y="60">C</text>
    <text x="435" y="235">D</text>
  </g>
</svg>