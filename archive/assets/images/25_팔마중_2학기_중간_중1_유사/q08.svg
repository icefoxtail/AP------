<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" width="480" height="320" role="img" aria-labelledby="q08-title q08-desc">
  <title id="q08-title">평행선과 꺾인 선의 각</title>
  <desc id="q08-desc">평행선 l, m 사이의 꺾인 선 각 x와 평행선 p, q 사이의 각 y, z</desc>
  <rect width="480" height="320" fill="#ffffff"/>
  <!-- 왼쪽 평행선 l, m -->
  <line x1="40" y1="70" x2="220" y2="70" stroke="#1e293b" stroke-width="2.5"/>
  <line x1="40" y1="230" x2="220" y2="230" stroke="#1e293b" stroke-width="2.5"/>
  <!-- 꺾인 선 -->
  <line x1="80" y1="70" x2="160" y2="150" stroke="#2563eb" stroke-width="2.5"/>
  <line x1="160" y1="150" x2="90" y2="230" stroke="#2563eb" stroke-width="2.5"/>
  <text x="110" y="95" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0f172a">30°</text>
  <text x="130" y="155" font-family="sans-serif" font-size="15" font-weight="bold" fill="#dc2626">x</text>
  <text x="115" y="215" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0f172a">40°</text>
  <!-- 오른쪽 평행선 p, q -->
  <line x1="270" y1="70" x2="440" y2="70" stroke="#1e293b" stroke-width="2.5"/>
  <line x1="270" y1="230" x2="440" y2="230" stroke="#1e293b" stroke-width="2.5"/>
  <line x1="320" y1="70" x2="390" y2="230" stroke="#1e293b" stroke-width="2.5"/>
  <text x="345" y="105" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2563eb">y</text>
  <text x="355" y="210" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2563eb">z</text>
  <g font-family="sans-serif" font-size="16" font-weight="bold" fill="#0f172a">
    <text x="30" y="75">l</text>
    <text x="30" y="235">m</text>
    <text x="445" y="75">p</text>
    <text x="445" y="235">q</text>
  </g>
</svg>