<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="420" height="266" viewBox="0 0 420 266" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="q07-title q07-desc">
<title id="q07-title">확률밀도함수의 넓이와 구간 확률</title>
<desc id="q07-desc">점 (0,0), (3,1/4), (5,1/4), (6,0)을 잇는 밀도 그래프에서 x가 2 이상 6 이하인 영역의 넓이 5/6을 색으로 구분한다. x가 0 이상 2 이하인 작은 삼각형의 넓이는 1/6이다.</desc>
<style>.axis{stroke:#555;stroke-width:1.4}.curve{stroke:#151515;stroke-width:2.8;stroke-linejoin:round;stroke-linecap:round;fill:none}.region{fill:#dbeefa;fill-opacity:.92}.helper{stroke:#7d8690;stroke-width:1.3;stroke-dasharray:5 4}.label{fill:#141414;font-family:Arial,'Noto Sans KR',sans-serif;font-size:18px}.note{fill:#263b52;font-family:Arial,'Noto Sans KR',sans-serif;font-size:18px}</style>
<rect width="420" height="266" fill="#fff"/>
<polygon class="region" points="152,212 152,117.333 206,70 314,70 368,212"/>
<line class="axis" x1="31" y1="212" x2="393" y2="212"/><line class="axis" x1="44" y1="234" x2="44" y2="39"/>
<line class="helper" x1="152" y1="212" x2="152" y2="117.333"/>
<line class="helper" x1="44" y1="70" x2="206" y2="70"/>
<polyline class="curve" points="44,212 206,70 314,70 368,212"/>
<g class="label" text-anchor="middle"><text x="44" y="236">0</text><text x="152" y="236">2</text><text x="206" y="236">3</text><text x="314" y="236">5</text><text x="368" y="236">6</text></g>
<text class="label" x="400" y="219">x</text><text class="label" x="26" y="32">y</text><text class="label" x="20" y="76">k</text>
<text class="note" x="196" y="161">넓이 5/6</text><text class="note" x="59" y="200">1/6</text>
<text class="note" x="170" y="255">k = 1/4</text>
</svg>