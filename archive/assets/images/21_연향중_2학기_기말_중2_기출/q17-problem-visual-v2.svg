<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 719 667" width="719" height="667" role="img" aria-labelledby="title desc"><title id="title">정사각 격자에서 A, B, C를 잇는 길</title><desc id="desc">가로세로 세 칸씩인 격자 그림에서 A는 왼쪽 아래, C는 오른쪽 위, B는 왼쪽에서 두 칸과 아래에서 두 칸인 곳이다. 가로·세로의 선분이 교차하는 곳에서 방향을 바꿀 수 있다.</desc><rect width="719" height="667" fill="white" /><line x1="97.0000" y1="563.0000" x2="97.0000" y2="71.0000" stroke="#687889" stroke-width="3.3" stroke-linecap="round" /><line x1="97.0000" y1="563.0000" x2="589.0000" y2="563.0000" stroke="#687889" stroke-width="3.3" stroke-linecap="round" /><line x1="261.0000" y1="563.0000" x2="261.0000" y2="71.0000" stroke="#687889" stroke-width="3.3" stroke-linecap="round" /><line x1="97.0000" y1="399.0000" x2="589.0000" y2="399.0000" stroke="#687889" stroke-width="3.3" stroke-linecap="round" /><line x1="425.0000" y1="563.0000" x2="425.0000" y2="71.0000" stroke="#687889" stroke-width="3.3" stroke-linecap="round" /><line x1="97.0000" y1="235.0000" x2="589.0000" y2="235.0000" stroke="#687889" stroke-width="3.3" stroke-linecap="round" /><line x1="589.0000" y1="563.0000" x2="589.0000" y2="71.0000" stroke="#687889" stroke-width="3.3" stroke-linecap="round" /><line x1="97.0000" y1="71.0000" x2="589.0000" y2="71.0000" stroke="#687889" stroke-width="3.3" stroke-linecap="round" /><circle cx="97" cy="563" r="7" fill="#293b4b" stroke="white" stroke-width="1.75" /><text x="73.0000" y="589.0000" font-size="35" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#293b4b" text-anchor="middle">A</text><circle cx="425" cy="235" r="7" fill="#293b4b" stroke="white" stroke-width="1.75" /><text x="449.0000" y="268.0000" font-size="35" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#293b4b" text-anchor="middle">B</text><circle cx="589" cy="71" r="7" fill="#293b4b" stroke="white" stroke-width="1.75" /><text x="612.0000" y="56.0000" font-size="35" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#293b4b" text-anchor="middle">C</text></svg>
