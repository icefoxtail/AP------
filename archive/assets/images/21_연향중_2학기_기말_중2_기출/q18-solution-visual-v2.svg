<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 629" width="750" height="629" role="img" aria-labelledby="title desc"><title id="title">원 위 네 자리와 두 말의 출발점</title><desc id="desc">A는 위, B는 왼쪽, C는 아래, D는 오른쪽이다. 원에서 시계 방향은 A에서 D 쪽이다. A 출발 말은 세 칸, B 출발 말은 한 칸으로 서로의 자리에 도착하는 기본 이동을 표시했다.</desc><rect width="750" height="629" fill="white" /><circle cx="371" cy="293" r="194" fill="none" stroke="#202020" stroke-width="4.6" /><path d="M 393.78720499234845 76.19422680971641 A 218 218 0 1 1 153.53103704335834 308.2069112762194" fill="none" stroke="#227365" stroke-width="5.8" stroke-linecap="round" /><line x1="156.3119" y1="330.8553" x2="155.7247" y2="326.0727" stroke="#227365" stroke-width="5.8" stroke-linecap="round" /><polygon points="153.5310,308.2069 148.5784,326.9502 162.8710,325.1953" fill="#227365" /><path d="M 153.5310370433583 277.7930887237808 A 218 218 0 0 1 344.43248313767793 76.62493894219179" fill="none" stroke="#a34c1f" stroke-width="5.8" stroke-linecap="round" /><line x1="321.9607" y1="80.5873" x2="326.7059" y2="79.7506" stroke="#a34c1f" stroke-width="5.8" stroke-linecap="round" /><polygon points="344.4325,76.6249 325.4557,72.6600 327.9562,86.8412" fill="#a34c1f" /><circle cx="371.0" cy="99.0" r="10" fill="#227365" stroke="#202020" stroke-width="3" /><text x="371.0000" y="53.0000" font-size="35" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#293b4b" text-anchor="middle">A</text><circle cx="177.0" cy="293.0" r="10" fill="#a34c1f" stroke="#202020" stroke-width="3" /><text x="121.0000" y="303.0000" font-size="35" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#293b4b" text-anchor="middle">B</text><circle cx="371.0" cy="487.0" r="10" fill="white" stroke="#202020" stroke-width="3" /><text x="371.0000" y="553.0000" font-size="35" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#293b4b" text-anchor="middle">C</text><circle cx="565.0" cy="293.0" r="10" fill="white" stroke="#202020" stroke-width="3" /><text x="621.0000" y="303.0000" font-size="35" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#293b4b" text-anchor="middle">D</text></svg>
