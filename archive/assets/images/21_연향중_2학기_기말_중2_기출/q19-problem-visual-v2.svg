<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 745 670" width="745" height="670" role="img" aria-labelledby="title desc"><title id="title">두 삼각형의 무게중심을 잇는 선</title><desc id="desc">D는 밑변 BC 위에 있으며 E와 F는 각각 BD와 DC의 중점이다. 두 중선 위 G와 G′를 이었다. BC는 30 cm이다.</desc><rect width="745" height="670" fill="white" /><line x1="425.0000" y1="168.7500" x2="110.0000" y2="501.2500" stroke="#21639a" stroke-width="5.15" stroke-linecap="round" /><line x1="110.0000" y1="501.2500" x2="635.0000" y2="501.2500" stroke="#21639a" stroke-width="5.15" stroke-linecap="round" /><line x1="635.0000" y1="501.2500" x2="425.0000" y2="168.7500" stroke="#21639a" stroke-width="5.15" stroke-linecap="round" /><line x1="425.0000" y1="168.7500" x2="241.2500" y2="501.2500" stroke="#774698" stroke-width="4.55" stroke-linecap="round" /><line x1="425.0000" y1="168.7500" x2="372.5000" y2="501.2500" stroke="#98aebe" stroke-width="4.55" stroke-linecap="round" stroke-dasharray="9 6" /><line x1="425.0000" y1="168.7500" x2="503.7500" y2="501.2500" stroke="#774698" stroke-width="4.55" stroke-linecap="round" /><line x1="302.5000" y1="390.4167" x2="477.5000" y2="390.4167" stroke="#227365" stroke-width="5.5" stroke-linecap="round" /><line x1="110.0000" y1="545.2500" x2="635.0000" y2="545.2500" stroke="#21639a" stroke-width="1.7" stroke-linecap="round" /><line x1="110.0000" y1="539.7500" x2="110.0000" y2="550.7500" stroke="#21639a" stroke-width="1.7" stroke-linecap="round" /><line x1="635.0000" y1="539.7500" x2="635.0000" y2="550.7500" stroke="#21639a" stroke-width="1.7" stroke-linecap="round" /><text x="372.5000" y="579.2500" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#21639a" text-anchor="middle">30 cm</text><circle cx="425.0" cy="168.75" r="4.9" fill="#28364b" /><text x="425.0000" y="149.7500" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">A</text><circle cx="110.0" cy="501.25" r="4.9" fill="#