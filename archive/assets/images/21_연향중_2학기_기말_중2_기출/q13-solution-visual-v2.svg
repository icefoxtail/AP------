<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 746 710" width="746" height="710" role="img" aria-labelledby="title desc"><title id="title">같은 길이를 직각으로 세 번 이은 도형</title><desc id="desc">OA, AB, BC, CD는 같은 청록색과 눈금이다. O를 공통 꼭짓점으로 하는 직각삼각형 세 개가 이어진다. 첫 두 빗변의 제곱이 차례로 2a²과 3a²임을 표시했다.</desc><rect width="746" height="710" fill="white" /><line x1="407.2634" y1="515.1973" x2="184.2634" y2="515.1973" stroke="#227365" stroke-width="5.55" stroke-linecap="round" /><line x1="291.3034" y1="508.1973" x2="291.3034" y2="522.1973" stroke="#227365" stroke-width="2.5" stroke-linecap="round" /><line x1="184.2634" y1="515.1973" x2="184.2634" y2="292.1973" stroke="#227365" stroke-width="5.55" stroke-linecap="round" /><line x1="191.2634" y1="399.2373" x2="177.2634" y2="399.2373" stroke="#227365" stroke-width="2.5" stroke-linecap="round" /><line x1="184.2634" y1="292.1973" x2="341.9482" y2="134.5125" stroke="#227365" stroke-width="5.55" stroke-linecap="round" /><line x1="271.2092" y1="215.1509" x2="261.3097" y2="205.2514" stroke="#227365" stroke-width="2.5" stroke-linecap="round" /><line x1="341.9482" y1="134.5125" x2="561.7366" y2="96.8027" stroke="#227365" stroke-width="5.55" stroke-linecap="round" /><line x1="457.4219" y1="121.8026" x2="455.0545" y2="108.0042" stroke="#227365" stroke-width="2.5" stroke-linecap="round" /><line x1="407.2634" y1="515.1973" x2="184.2634" y2="292.1973" stroke="#774698" stroke-width="4.85" stroke-linecap="round" stroke-dasharray="10 6" /><line x1="407.2634" y1="515.1973" x2="341.9482" y2="134.5125" stroke="#774698" stroke-width="4.85" stroke-linecap="round" stroke-dasharray="10 6" /><line x1="407.2634" y1="515.1973" x2="561.7366" y2="96.8027" stroke="#774698" stroke-width="4.85" stroke-linecap="round" /><line x1="209.2634" y1="515.1973" x2="209.2634" y2="490.1973" stroke="#586574" stroke-width="1.8" stroke-linecap="round" /><line x1="209.2634" y1="490.1973" x2="184.2634" y2="490.1973" stroke="#586574" stroke-width="1.8" stroke-linecap="round" /><line x1="201.9410" y1="309.8749" x2="219.6187" y2="292.1973" stroke="#586574" stroke-width="1.8" stroke-linecap="round" /><line x1="219.6187" y1="292.1973" x2="201.9410" y2="274.5196" stroke="#586574" stroke-width="1.8" stroke-linecap="round" /><line x1="346.1757" y1="159.1524" x2="370.8157" y2="154.9249" stroke="#586574" stroke-width="1.8" stroke-linecap="round" /><line x1="370.8157" y1="154.9249" x2="366.5881" y2="130.2849" stroke="#586574" stroke-width="1.8" stroke-linecap="round" /><text x="229.0000" y="641.0000" font-size="37" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#774698" text-anchor="middle">OB² = 2a²</text><text x="514.0000" y="641.0000" font-size="37" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#774698" text-anchor="middle">OC² = 3a²</text><circle cx="184.26335449633595" cy="515.1972767302226" r="4.9" fill="#28364b" /><text x="168.2634" y="539.1973" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">A</text><circle cx="184.26335449633595" cy="292.1972767302226" r="4.9" fill="#28364b" /><text x="162.2634" y="286.1973" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">B</text><circle cx="341.94816670093604" cy="134.5124645256225" r="4.9" fill="#28364b" /><text x="336.9482" y="114.5125" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">C</text><circle cx="561.736645503664" cy="96.8027232697774" r="4.9" fill="#28364b" /><text x="580.7366" y="81.8027" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">D</text><circle cx="407.263354496336" cy="515.1972767302226" r="4.9" fill="#28364b" /><text x="420.2634" y="538.1973" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364