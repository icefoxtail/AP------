<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 535" width="750" height="535" role="img" aria-labelledby="title desc"><title id="title">500원짜리 동전 개수에 따른 지불</title><desc id="desc">1550원을 낼 수 있는 경우는 500원짜리를 두 개 쓰거나 세 개 쓰는 두 묶음으로 정리했다. 각 묶음의 50원짜리와 100원짜리 개수를 순서쌍으로 표시했다.</desc><rect width="750" height="535" fill="white" /><rect x="25" y="57" width="323" height="391" rx="15" fill="white" stroke="#dbe5ee" stroke-width="2.15" /><text x="186.0000" y="116.0000" font-size="34" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#21639a" text-anchor="middle">500원짜리 2개</text><text x="186.0000" y="185.0000" font-size="30" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#687889" text-anchor="middle">(50원, 100원) 개수</text><text x="186.0000" y="251.0000" font-size="40" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#21639a" text-anchor="middle">(5, 3)</text><text x="186.0000" y="323.0000" font-size="40" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#21639a" text-anchor="middle">(3, 4)</text><text x="186.0000" y="395.0000" font-size="40" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#21639a" text-anchor="middle">(1, 5)</text><rect x="402" y="57" width="323" height="391" rx="15" fill="white" stroke="#dbe5ee" stroke-width="2.15" /><text x="563.0000" y="116.0000" font-size="34" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#227365" text-anchor="middle">500원짜리 3개</text><text x="563.0000" y="185.0000" font-size="30" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#687889" text-anchor="middle">(50원, 100원) 개수</text><text x="563.0000" y="251.0000" font-size="40" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#227365" text-anchor="middle">(1, 0)</text></svg>
