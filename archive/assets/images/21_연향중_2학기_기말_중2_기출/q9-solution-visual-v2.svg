<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 745 719" width="745" height="719" role="img" aria-labelledby="title desc"><title id="title">평행선 사이 세 등분 길이</title><desc id="desc">B, A, D가 같은 직선이고 M은 AC의 중점이다. A와 N을 잇는 선이 밑변 BC와 나란하다. BC는 15 cm이다. A에서 DE와 평행선을 그어 밑변의 P에 닿게 했다. BP, PE, EC가 같은 길이다.</desc><rect width="745" height="719" fill="white" /><line x1="117.5000" y1="614.5000" x2="287.5000" y2="104.5000" stroke="#202020" stroke-width="5.35" stroke-linecap="round" /><line x1="202.5000" y1="359.5000" x2="627.5000" y2="614.5000" stroke="#a34c1f" stroke-width="5.1" stroke-linecap="round" /><line x1="287.5000" y1="104.5000" x2="457.5000" y2="614.5000" stroke="#774698" stroke-width="5.1" stroke-linecap="round" /><line x1="202.5000" y1="359.5000" x2="372.5000" y2="359.5000" stroke="#227365" stroke-width="4.75" stroke-linecap="round" /><line x1="117.5000" y1="614.5000" x2="627.5000" y2="614.5000" stroke="#227365" stroke-width="5.1" stroke-linecap="round" /><polygon points="324.7000,359.5000 308.7000,365.5000 308.7000,353.5000" fill="#227365" /><polygon points="464.1000,614.5000 448.1000,620.5000 448.1000,608.5000" fill="#227365" /><line x1="168.3408" y1="484.1136" x2="155.0592" y2="479.6864" stroke="#202020" stroke-width="2.5" stroke-linecap="round" /><line x1="253.3408" y1="229.1136" x2="240.0592" y2="224.6864" stroke="#202020" stroke-width="2.5" stroke-linecap="round" /><line x1="305.5398" y1="429.4872" x2="312.7428" y2="417.4823" stroke="#a34c1f" stroke-width="2.5" stroke-linecap="round" /><line x1="313.2572" y1="434.1177" x2="320.4602" y2="422.1128" stroke="#a34c1f" stroke-width="2.5" stroke-linecap="round" /><line x1="518.0398" y1="556.9872" x2="525.2428" y2="544.9823" stroke="#a34c1f" stroke-width="2.5" stroke-linecap="round" /><line x1="525.7572" y1="561.6177" x2="532.9602" y2="549.6128" stroke="#a34c1f" stroke-width="2.5" stroke-linecap="round" /><line x1="202.5000" y1="359.5000" x2="287.5000" y2="614.5000" stroke="#774698" stroke-width="5.0" stroke-linecap="round" stroke-dasharray="10 6" /><line x1="205.9000" y1="621.5000" x2="205.9000" y2="607.5000" stroke="#227365" stroke-width="2.5" stroke-linecap="round" /><line x1="375.9000" y1="621.5000" x2="375.9000" y2="607.5000" stroke="#227365" stroke-width="2.5" stroke-linecap="round" /><line x1="545.9000" y1="621.5000" x2="545.9000" y2="607.5000" stroke="#227365" stroke-width="2.5" stroke-linecap="round" /><line x1="117.5000" y1="658.5000" x2="627.5000" y2="658.5000" stroke="#227365" stroke-width="1.7" stroke-linecap="round" /><line x1="117.5000" y1="653.0000" x2="117.5000" y2="664.0000" stroke="#227365" stroke-width="1.7" stroke-linecap="round" /><line x1="627.5000" y1="653.0000" x2="627.5000" y2="664.0000" stroke="#227365" stroke-width="1.7" stroke-linecap="round" /><text x="372.5000" y="690.5000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#227365" text-anchor="middle">15 cm</text><circle cx="202.5" cy="359.5" r="4.9" fill="#28364b" /><text x="181.5000" y="352.5000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">A</text><circle cx="117.5" cy="614.5" r="4.9" fill="#28364b" /><text x="100.5000" y="637.5000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">B</text><circle cx="627.5" cy="614.5" r="4.9" fill="#28364b" /><text x="644.5000" y="637.5000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">C</text><circle cx="287.5" cy="104.5" r="4.9" fill="#28364b" /><text x="287.5000" y="85.5000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">D</text><circle cx="457.5" cy="614.5" r="4.9" fill="#28364b" /><text x="456.5000" y="639.5000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" te