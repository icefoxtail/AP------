<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 380" width="440" height="380" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">반지름의 길이가 9cm인 원 O와 길이가 12cm인 현 AB를 나타낸 그림이다. 원의 중심 O와 현의 양 끝점 A, B가 표시되어 있다.</title><desc id="visual-desc">원의 중심 O에서 한 점 A까지 반지름이 그려져 있고, 원 위의 두 점 A, B를 잇는 현 AB가 있다. 반지름에는 9cm, 현에는 12cm가 적혀 있다.</desc><rect width="440" height="380" fill="#fff"/><g data-layer="30"><line id="AB" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="129.195402299" y1="291.522626565" x2="310.804597701" y2="291.522626565"/></g><g data-layer="30"><line id="OA" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="220" y1="190" x2="129.195402299" y2="291.522626565"/></g><g data-layer="40"><circle id="circ" data-role="circle" stroke="#111" stroke-width="2.05" fill="none" cx="220" cy="190" r="136.206896552"/></g><g data-layer="70"><circle id="O" data-role="point" stroke="#111" stroke-width="0.8" fill="#111" cx="220" cy="190" r="3.2"/></g><g data-layer="70"><circle id="A" data-role="point" stroke="#111" stroke-width="0.8" fill="#111" cx="129.195402299" cy="291.522626565" r="3.2"/></g><g data-layer="70"><circle id="B" data-role="point" stroke="#111" stroke-width="0.8" fill="#111" cx="310.804597701" cy="291.522626565" r="3.2"/></g><g data-layer="85"><line id="lOA-owner-leader" data-role="leader" data-owner-labe