<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 600" width="720" height="600" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">지면에 수직으로 선 나무와 그로부터 60 m 떨어진 곳에 선 사람이 보이고, 사람의 눈높이에서 나무 꼭대기를 올려다본 각이 36도로 표시되어 있다. 사람의 눈높이는 1.6 m이다.</title><desc id="visual-desc">수평인 지면, 지면에 똑바로 서 있는 나무, 사람의 눈높이를 나타내는 짧은 세로선이 보인다. 눈높이에서 나무 쪽으로 뻗은 수평선과 나무 꼭대기로 향하는 빗변이 있고, 그 두 선 사이의 각은 36도이며 지면의 거리는 60 m, 눈높이는 1.6 m로 적혀 있다.</desc><rect width="720" height="600" fill="#fff"/><g data-layer="12"><polygon id="aE-sector" data-role="angleSector" stroke="none" stroke-width="1.6" fill="#d9d9d9" data-owner-points="H E T" data-mark="angle" data-mark-id="aE" data-mark-index="0" data-mark-count="1" data-mark-side="INNER" points="113.117806694,425.072497476 141.117806694,425.072497476 141.096214126,423.973080566 141.031469726,422.875359315 140.923673351,421.781026768 140.772991258,420.691770743 140.579655848,419.609271227 140.343965306,418.535197789 140.066283146,417.471207 139.747037643,416.41893988 139.386721178,415.38001937 138.985889476,414.356047823 138.545160751,413.348604538 138.065214751,412.35924332 137.546791708,411.389490089 136.9906912,410.440840518 136.397770916,409.514757737 135.768945332,408.612670066"/></g><g data-layer="30"><line id="ground" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="113.117806694" y1="525.006183275" x2="612.786