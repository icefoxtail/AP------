<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300" role="img" aria-labelledby="title desc"><title id="title">집합 해설 보강 · 문항 14</title><desc id="desc">원소의 강제 포함 관계와 가능한 6원소 폐쇄집합 두 개를 표시</desc><rect width="720" height="300" rx="18" fill="#f8fafc"/><text x="32" y="34" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#0f172a">집합 해설 보강 · 문항 14</text><text x="32" y="57" font-family="Arial,sans-serif" font-size="12" fill="#475569">강제 포함 관계를 따라가면 가능한 6원소 집합은 두 개뿐이다.</text><rect x="32" y="72" width="656" height="92" rx="12" fill="#fff" stroke="#cbd5e1"/><text x="50" y="96" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#1d4ed8">순환</text><text x="105" y="96" font-family="Arial,sans-serif" font-size="12" fill="#0f172a">1→4→2→1</text><text x="260" y="96" font-family="Arial,sans-serif" font-size="12" fill="#0f172a">3→5→6→3</text><text x="430" y="96" font-family="Arial,sans-serif" font-size="12" fill="#0f172a">7→7</text><text x="50" y="126" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#c2410c">부착</text><text x="105" y="126" font-family="Arial,sans-serif" font-size="12" fill="#0f172a">8→4, 9→8, 10→5</text><text x="50" y="150" font-family="Arial,sans-serif" font-size="11" fill="#64748b">8·9는 {1,2,4}를, 10은 {3,5,6}을 함께 강제한다.</text><rect x="32" y="178" width="310" height="64" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><rect x="378" y="178" width="310" height="64" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="50" y="202" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#1d4ed8">가능한 집합 A₁ (6개)</text><text x="50" y="225" font-family="Arial,sans-serif" font-size="13" fill="#0f172a">{1,2,3,4,5,6}</text><text x="396" y="202" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#15803d">가능한 집합 A₂ (6개)</text><text x="396" y="225" font-family="Arial,sans-serif" font-size="13" fill="#0f172a">{1,2,4,7,8,9}</text><text x="32" y="274" font-family="Arial,sans-serif" font-size="12" fill="#64748b">a=2, B={1,2,3,4,5,6,7,8,9}, S-B={10}, b=10 → 5a+b=20</text></svg>
