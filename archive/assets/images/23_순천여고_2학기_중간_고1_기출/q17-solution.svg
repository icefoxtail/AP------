<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" width="640" height="280" role="img" aria-labelledby="title desc" data-scale-policy="SCHEMATIC_ALLOWED">
  <title id="title">직각삼각형 PQR과 외접원</title>
  <desc id="desc">내분점 P(0,3), Q(3,4), R(4,1)이 이루는 직각삼각형과 빗변 PR을 지름으로 하는 외접원을 나타낸 좌표평면 그림이다.</desc>
  <rect width="640" height="280" fill="#fff"/>
  <text x="320" y="28" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="21" font-weight="700" fill="#1e3a5f">직각삼각형 PQR의 외접원</text>
  <rect x="18" y="45" width="360" height="215" rx="8" fill="#f8fafc" stroke="#dbe3ef"/>
  <line x1="70" y1="230" x2="300" y2="230" stroke="#0f172a" stroke-width="1.3"/><line x1="70" y1="245" x2="70" y2="57" stroke="#0f172a" stroke-width="1.3"/>
  <polyline points="70,90 210,90 210,230" fill="none" stroke="#94a3b8" stroke-width="1.7" stroke-dasharray="5 4"/>
  <circle cx="140" cy="160" r="78.3" fill="#dbeafe" fill-opacity=".42" stroke="#2563eb" stroke-width="2.4"/>
  <polygon points="70,125 175,90 210,195" fill="#fef3c7" fill-opacity=".7" stroke="#7c3aed" stroke-width="2.4"/>
  <path d="M175 90 L157.9 95.7 L163.6 112.8 L180.7 107.1 Z" fill="#fff" fill-opacity=".86" stroke="#dc2626" stroke-width="2"/>
  <circle cx="70" cy="125" r="4.5" fill="#1d4ed8"/><circle cx="175" cy="90" r="4.5" fill="#dc2626"/><circle cx="210" cy="195" r="4.5" fill="#f97316"/><circle cx="140" cy="160" r="3.5" fill="#0f172a"/>
  <text x="52" y="119" font-family="Arial, sans-serif" font-size="15" fill="#1d4ed8">P(0,3)</text>
  <text x="179" y="82" font-family="Arial, sans-serif" font-size="15" fill="#b91c1c">Q(3,4)</text>
  <text x="216" y="204" font-family="Arial, sans-serif" font-size="15" fill="#c2410c">R(4,1)</text>
  <text x="76" y="84" font-family="Arial, sans-serif" font-size="14" fill="#64748b">A</text><text x="216" y="84" font-family="Arial, sans-serif" font-size="14" fill="#64748b">B</text><text x="216" y="246" font-family="Arial, sans-serif" font-size="14" fill="#64748b">C</text>
  <text x="187" y="119" font-family="Arial, sans-serif" font-size="14" fill="#b91c1c">90°</text>
  <text x="294" y="224" font-family="Arial, sans-serif" font-size="14" fill="#334155">x</text><text x="77" y="67" font-family="Arial, sans-serif" font-size="14" fill="#334155">y</text>
  <rect x="400" y="45" width="222" height="215" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="420" y="74" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="18" font-weight="700" fill="#1e3a5f">좌표와 직각</text>
  <text x="420" y="107" font-family="Arial, sans-serif" font-size="15">P=(0,3), Q=(3,4), R=(4,1)</text>
  <text x="420" y="134" font-family="Arial, sans-serif" font-size="15">PQ 기울기=1/3</text>
  <text x="420" y="158" font-family="Arial, sans-serif" font-size="15">QR 기울기=−3</text>
  <text x="420" y="182" font-family="Arial, sans-serif" font-size="14">곱이 −1 → ∠Q=90°</text>
  <line x1="420" y1="193" x2="602" y2="193" stroke="#cbd5e1"/>
  <text x="420" y="218" font-family="Arial, sans-serif" font-size="15">PR=2√5 → r=√5</text>
  <text x="420" y="244" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#1d4ed8">넓이=5π → ④</text>
</svg>
