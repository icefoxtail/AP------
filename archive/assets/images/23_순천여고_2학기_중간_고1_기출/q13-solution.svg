<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" width="640" height="280" role="img" aria-labelledby="title desc">
  <title id="title">원과 직선의 두 교점 조건</title>
  <desc id="desc">원 x²+y²=5와 점 (-3,-1)을 지나는 직선의 두 접선 기울기 -1/2, 2, 그리고 두 교점을 만드는 기울기 구간을 나타낸 좌표평면 그림이다.</desc>
  <rect width="640" height="280" fill="#fff"/>
  <text x="320" y="28" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="21" font-weight="700" fill="#1e3a5f">원과 두 교점이 생기는 기울기</text>
  <rect x="18" y="45" width="360" height="215" rx="8" fill="#f8fafc" stroke="#dbe3ef"/>
  <line x1="40" y1="160" x2="320" y2="160" stroke="#0f172a" stroke-width="1.4"/><line x1="180" y1="250" x2="180" y2="52" stroke="#0f172a" stroke-width="1.4"/>
  <circle cx="180" cy="160" r="63" fill="#dbeafe" fill-opacity=".65" stroke="#2563eb" stroke-width="2.5"/>
  <line x1="40" y1="160" x2="264" y2="272" stroke="#f97316" stroke-width="2.4"/>
  <line x1="60" y1="260" x2="164" y2="52" stroke="#f97316" stroke-width="2.4"/>
  <line x1="68" y1="202" x2="236" y2="118" stroke="#0f766e" stroke-width="2.4"/>
  <circle cx="96" cy="188" r="4.5" fill="#dc2626"/>
  <text x="100" y="181" font-family="Arial, sans-serif" font-size="14" fill="#b91c1c">S(−3,−1)</text>
  <text x="223" y="104" font-family="Arial, sans-serif" font-size="14" fill="#0f766e">−1/2&lt;m&lt;2</text>
  <text x="224" y="83" font-family="Arial, sans-serif" font-size="14" fill="#c2410c">m=2</text>
  <text x="52" y="151" font-family="Arial, sans-serif" font-size="14" fill="#c2410c">m=−1/2</text>
  <text x="187" y="156" font-family="Arial, sans-serif" font-size="14" fill="#1d4ed8">O</text>
  <text x="310" y="154" font-family="Arial, sans-serif" font-size="14" fill="#334155">x</text><text x="187" y="64" font-family="Arial, sans-serif" font-size="14" fill="#334155">y</text>
  <rect x="400" y="45" width="222" height="215" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="420" y="74" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="18" font-weight="700" fill="#1e3a5f">거리 조건</text>
  <text x="420" y="108" font-family="Arial, sans-serif" font-size="16">d(O,l) &lt; √5</text>
  <text x="420" y="132" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14">서로 다른 두 교점</text>
  <text x="420" y="164" font-family="Arial, sans-serif" font-size="15">(3m−1)²&lt;5(m²+1)</text>
  <text x="420" y="188" font-family="Arial, sans-serif" font-size="15">(2m+1)(m−2)&lt;0</text>
  <line x1="420" y1="201" x2="602" y2="201" stroke="#cbd5e1"/>
  <text x="420" y="226" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#1d4ed8">−1/2&lt;m&lt;2</text>
  <text x="420" y="249" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#b91c1c">a+b=3/2 → ④</text>
</svg>
