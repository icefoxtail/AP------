<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" role="img" aria-labelledby="title desc">
  <title id="title">문항 21 해설: 두 동아리 교집합의 최댓값과 최솟값</title>
  <desc id="desc">30명 중 수학 17명과 과학 22명의 교집합이 최대 17, 최소 9가 되는 두 Venn diagram</desc>
  <style>
    text{font-family:"Noto Sans KR","Malgun Gothic",Arial,sans-serif;fill:#172033}.muted{fill:#56657a}.math{font-family:Georgia,"Times New Roman",serif}
  </style>
  <rect width="760" height="420" rx="18" fill="#f8fafc"/>
  <text x="30" y="38" font-size="22" font-weight="700">교집합의 최대·최소를 Venn diagram으로 확인</text>
  <text x="30" y="67" class="muted" font-size="15">n(M)=17, n(S)=22, 전체 30명</text>
  <rect x="30" y="90" width="335" height="255" rx="14" fill="#fff" stroke="#cbd5e1"/><rect x="395" y="90" width="335" height="255" rx="14" fill="#fff" stroke="#cbd5e1"/>
  <text x="50" y="120" font-size="16" font-weight="700" fill="#1d4ed8">최댓값: 17</text>
  <rect x="58" y="140" width="280" height="175" rx="10" fill="#f8fafc" stroke="#94a3b8"/>
  <ellipse cx="198" cy="227" rx="112" ry="66" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
  <ellipse cx="198" cy="227" rx="73" ry="43" fill="#bfdbfe" stroke="#2563eb" stroke-width="3"/>
  <text x="198" y="253" text-anchor="middle" font-size="21" font-weight="700" fill="#1d4ed8">17</text>
  <text x="198" y="174" text-anchor="middle" font-size="16" font-weight="700" fill="#15803d">S</text><text x="198" y="211" text-anchor="middle" font-size="16" font-weight="700" fill="#1d4ed8">M</text>
  <text x="302" y="230" font-size="15" fill="#15803d">S만 5</text><text x="70" y="304" class="muted" font-size="14">바깥 8</text>
  <text x="415" y="120" font-size="16" font-weight="700" fill="#d97706">최솟값: 9</text>
  <rect x="423" y="140" width="280" height="175" rx="10" fill="#f8fafc" stroke="#94a3b8"/>
  <circle cx="535" cy="227" r="62" fill="#bfdbfe" fill-opacity=".8" stroke="#2563eb" stroke-width="3"/><circle cx="595" cy="227" r="62" fill="#dcfce7" fill-opacity=".8" stroke="#16a34a" stroke-width="3"/>
  <text x="512" y="181" font-size="16" font-weight="700" fill="#1d4ed8">M</text><text x="617" y="181" font-size="16" font-weight="700" fill="#15803d">S</text>
  <text x="565" y="233" text-anchor="middle" font-size="21" font-weight="700" fill="#d97706">9</text><text x="490" y="233" text-anchor="middle" font-size="18" font-weight="700">8</text><text x="640" y="233" text-anchor="middle" font-size="18" font-weight="700">13</text><text x="565" y="300" text-anchor="middle" class="muted" font-size="14">바깥 0</text>
  <rect x="30" y="365" width="700" height="35" rx="10" fill="#eff6ff"/><text x="380" y="388" text-anchor="middle" font-size="16" font-weight="700" fill="#1d4ed8">최대=min(17,22)=17  ·  최소=17+22−30=9  →  a=17, b=9</text>
</svg>
