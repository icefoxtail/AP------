<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" role="img" aria-labelledby="title desc" data-scale-policy="SCHEMATIC_ALLOWED" width="720" height="360">
  <title id="title">문항 10 해설: A와 B의 구간 관계</title>
  <desc id="desc">A=[−5,3]과 B=(−∞,−5)∪(−1,∞)를 수직선에 표시해 교집합을 확인</desc>
  <style>
    text{font-family:"Noto Sans KR","Malgun Gothic",Arial,sans-serif;fill:#172033}.muted{fill:#56657a}.math{font-family:Georgia,"Times New Roman",serif}
  </style>
  <rect width="760" height="380" rx="18" fill="#f8fafc"/>
  <text x="30" y="38" font-size="22" font-weight="700">합집합은 전체, 교집합은 끝점 조건</text>
  <text x="30" y="67" class="muted" font-size="15">A=[−5,3],  B=(−∞,−5)∪(−1,∞),  A∩B=(−1,3]</text>
  <rect x="30" y="92" width="700" height="202" rx="14" fill="#fff" stroke="#cbd5e1"/>
  <line x1="105" y1="164" x2="690" y2="164" stroke="#172033" stroke-width="2"/><path d="m690 164-10-6v12z" fill="#172033"/>
  <line x1="105" y1="234" x2="690" y2="234" stroke="#172033" stroke-width="2"/><path d="m690 234-10-6v12z" fill="#172033"/>
  <g stroke="#64748b" stroke-width="2"><line x1="195" y1="158" x2="195" y2="170"/><line x1="285" y1="158" x2="285" y2="170"/><line x1="375" y1="158" x2="375" y2="170"/><line x1="465" y1="158" x2="465" y2="170"/><line x1="555" y1="158" x2="555" y2="170"/><line x1="645" y1="158" x2="645" y2="170"/><line x1="195" y1="228" x2="195" y2="240"/><line x1="285" y1="228" x2="285" y2="240"/><line x1="375" y1="228" x2="375" y2="240"/><line x1="465" y1="228" x2="465" y2="240"/><line x1="555" y1="228" x2="555" y2="240"/><line x1="645" y1="228" x2="645" y2="240"/></g>
  <g text-anchor="middle" class="muted" font-size="14"><text x="195" y="257">−5</text><text x="285" y="257">−3</text><text x="375" y="257">−1</text><text x="465" y="257">1</text><text x="555" y="257">3</text><text x="645" y="257">5</text></g>
  <text x="82" y="169" text-anchor="end" font-size="17" font-weight="700" fill="#2563eb">A</text>
  <line x1="195" y1="164" x2="555" y2="164" stroke="#2563eb" stroke-width="12" stroke-linecap="round"/><circle cx="195" cy="164" r="8" fill="#2563eb"/><circle cx="555" cy="164" r="8" fill="#2563eb"/>
  <text x="82" y="239" text-anchor="end" font-size="17" font-weight="700" fill="#ea580c">B</text>
  <line x1="110" y1="234" x2="195" y2="234" stroke="#f97316" stroke-width="12" stroke-linecap="round"/><line x1="375" y1="234" x2="690" y2="234" stroke="#f97316" stroke-width="12" stroke-linecap="round"/><circle cx="195" cy="234" r="8" fill="#fff" stroke="#f97316" stroke-width="3"/><circle cx="375" cy="234" r="8" fill="#fff" stroke="#f97316" stroke-width="3"/>
  <rect x="30" y="318" width="700" height="35" rx="10" fill="#eff6ff"/><text x="380" y="341" text-anchor="middle" font-size="16" font-weight="700" fill="#1d4ed8">B=(x+5)(x+1)&gt;0  →  a=6, b=5  →  a−b=1 (④)</text>
</svg>
