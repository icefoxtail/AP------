<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 320" width="420" height="320" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">한 변의 길이가 x+2인 정사각형의 오른쪽 위 귀퉁이에서 한 변의 길이가 2인 정사각형을 잘라 낸 모양을 나타낸 그림이다. 남은 부분이 색칠되어 있다.</title><desc id="visual-desc">큰 정사각형의 오른쪽 위가 작은 정사각형 모양으로 비어 있고, 남은 ㄱ자 모양 부분이 색칠되어 있다. 큰 정사각형의 왼쪽 변에는 x+2, 잘라 낸 부분의 가로 변에는 2가 적혀 있다.</desc><rect width="420" height="320" fill="#fff"/><g data-layer="10"><path id="ry" data-role="region" stroke="none" stroke-width="1.6" fill="#e4e7ec" data-owner-points="A B C E F G" data-mark="region" data-mark-id="ry" fill-rule="evenodd" d="M95.714285714 45.714285714 L95.714285714 274.285714286 L324.285714286 274.285714286 L324.285714286 121.904761905 L248.095238095 121.904761905 L248.095238095 45.714285714 L95.714285714 45.714285714 Z"/></g><g data-layer="30"><line id="sAB" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="95.714285714" y1="45.714285714" x2="95.714285714" y2="274.285714286"/></g><g data-layer="30"><line id="sBC" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="95.714285714" y1="274.285714286" x2="324.285714286" y2="274.285714286"/></g><g data-layer="30"><line id="sCG" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="324.285714286" y1="274.285714286" x2="324.285714286" y2="121.904761905"/></g><g data-layer="30"><line id="sGF