<svg xmlns="http://www.w3.org/2000/svg" width="600" height="280" viewBox="0 0 600 280"><rect width="600" height="280" fill="white"/><g stroke="#222" fill="none" stroke-width="2"><ellipse cx="135" cy="55" rx="65" ry="18"/><line x1="70" y1="55" x2="70" y2="220"/><line x1="200" y1="55" x2="200" y2="220"/><ellipse cx="135" cy="220" rx="65" ry="18"/><circle cx="135" cy="138" r="65"/><line x1="135" y1="138" x2="200" y2="138"/><ellipse cx="350" cy="55" rx="65" ry="18"/><line x1="285" y1="55" x2="285" y2="220"/><line x1="415" y1="55" x2="415" y2="220"/><ellipse cx="350" cy="220" rx="65" ry="18"/><ellipse cx="350" cy="165" rx="65" ry="18"/><line x1="285" y1="165" x2="285" y2="220" stroke-width="5"/><line x1="415" y1="165" x2="415" y2="220" stroke-width="5"/></g><g font-family="sans-serif" font-size="17" fill="#111"><text x="148" y="130">r</text><text x="105" y="265">물 = 원기둥−구</text><text x="310" y="155">높이 2r/3</text><text x="445" y="105">물의 부피 = ⅔πr³</text><text x="445" y="145">⅔πr³ = 18π</text><text x="485" y="185">r = 3</text></g></svg>