<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 280" width="760" height="280" role="img" aria-labelledby="title desc" data-scale-policy="SCHEMATIC_ALLOWED">
<title id="title">필요조건에서 구간의 포함 관계 찾기</title>
<desc id="desc">이차부등식의 해구간 열린구간 마이너스 1에서 3까지가 절댓값 부등식의 해구간 안에 포함되도록 양 끝점을 비교한다.</desc>
<rect width="760" height="280" rx="20" fill="#ffffff"/>
<text x="34" y="42" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#142238">필요조건이면 해구간이 안쪽에 포함된다</text>
<text x="34" y="72" font-family="Arial, sans-serif" font-size="15" fill="#526175">끝점의 순서만 나타낸 구간 도식</text>
<text x="34" y="126" font-family="Arial, sans-serif" font-size="17" font-weight="600" fill="#526175">|x−a|&lt;3</text>
<line x1="156" y1="120" x2="624" y2="120" stroke="#566578" stroke-width="7" stroke-linecap="round"/>
<circle cx="156" cy="120" r="8" fill="#ffffff" stroke="#24364b" stroke-width="3"/>
<circle cx="624" cy="120" r="8" fill="#ffffff" stroke="#24364b" stroke-width="3"/>
<text x="122" y="101" font-family="Arial, sans-serif" font-size="16" fill="#24364b">a−3</text>
<text x="592" y="101" font-family="Arial, sans-serif" font-size="16" fill="#24364b">a+3</text>
<text x="34" y="184" font-family="Arial, sans-serif" font-size="17" font-weight="600" fill="#526175">x²−2x−3&lt;0</text>
<line x1="254" y1="178" x2="526" y2="178" stroke="#15827a" stroke-width="9" stroke-linecap="round"/>
<circle cx="254" cy="178" r="8" fill="#ffffff" stroke="#087970" stroke-width="3"/>
<circle cx="526" cy="178" r="8" fill="#ffffff" stroke="#087970" stroke-width="3"/>
<text x="241" y="207" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#087970">−1</text>
<text x="519" y="207" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#087970">3</text>
<rect x="34" y="226" width="330" height="38" rx="10" fill="#eef5fb"/>
<text x="50" y="251" font-family="Arial, sans-serif" font-size="17" fill="#142238">a−3 ≤ −1  ⟹  a ≤ 2</text>
<rect x="382" y="226" width="344" height="38" rx="10" fill="#e8f5f2"/>
<text x="399" y="251" font-family="Arial, sans-serif" font-size="17" fill="#142238">a+3 ≥ 3  ⟹  a ≥ 0</text>
</svg>