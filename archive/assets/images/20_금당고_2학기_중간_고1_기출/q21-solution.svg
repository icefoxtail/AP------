<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 570" width="760" height="570" role="img" aria-labelledby="title desc" data-scale-policy="EQUAL_UNIT" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT">
<title id="title">대칭으로 펴서 원 사이의 최단거리를 구한다</title>
<desc id="desc">원 C1의 중심 마이너스 4,2를 y=x에 대칭이동하면 중심 2,마이너스 4이고 반지름 2이다. 이 원과 C2의 중심 1,3, 반지름 1 사이의 가장 짧은 선분은 y=x와 만난다.</desc>
<rect width="760" height="570" rx="20" fill="#ffffff"/>
<text x="28" y="34" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#142238">대칭으로 펴서 원 사이의 최단거리를 구한다</text>
<text x="28" y="60" font-family="Arial,sans-serif" font-size="15" fill="#526175">P는 y=x 위이므로 AP=A′P, 따라서 AP+PB≥A′B</text>
<line x1="110" y1="460" x2="470" y2="100" stroke="#24364b" stroke-width="2.5"/>
<line x1="320" y1="100" x2="320" y2="460" stroke="#c7d1dd" stroke-width="1.2"/><line x1="110" y1="250" x2="470" y2="250" stroke="#c7d1dd" stroke-width="1.2"/>
<text x="474" y="103" font-family="Arial,sans-serif" font-size="15" fill="#24364b">y=x</text><text x="460" y="244" font-family="Arial,sans-serif" font-size="14" fill="#66758a">x</text><text x="324" y="112" font-family="Arial,sans-serif" font-size="14" fill="#66758a">y</text>
<circle cx="200" cy="190" r="60" fill="#eef1f4" fill-opacity="0.35" stroke="#8996a6" stroke-width="2.5" stroke-dasharray="7 5"/>
<circle cx="380" cy="370" r="60" fill="#d9efec" fill-opacity="0.62" stroke="#087970" stroke-width="3"/>
<circle cx="350" cy="160" r="30" fill="#e9eff8" fill-opacity="0.7" stroke="#536f9c" stroke-width="3"/>
<line x1="380" y1="370" x2="350" y2="160" stroke="#7b8797" stroke-width="1.8" stroke-dasharray="6 5"/>
<line x1="371.515" y1="310.603" x2="354.243" y2="189.698" stroke="#d77a26" stroke-width="4"/>
<circle cx="200" cy="190" r="5" fill="#68788d"/><circle cx="380" cy="370" r="5.5" fill="#087970"/><circle cx="350" cy="160" r="5.5" fill="#536f9c"/>
<circle cx="371.515" cy="310.603" r="5.5" fill="#d35e48"/><circle cx="354.243" cy="189.698" r="5.5" fill="#d35e48"/><circle cx="357.5" cy="212.5" r="6" fill="#142238"/>
<text x="142" y="174" font-family="Arial,sans-serif" font-size="14" fill="#66758a">C₁ 중심 (−4,2)</text>
<text x="384" y="405" font-family="Arial,sans-serif" font-size="14" fill="#087970">C₁′ 중심 (2,−4), r=2</text>
<text x="354" y="147" font-family="Arial,sans-serif" font-size="14" fill="#536f9c">C₂ 중심 (1,3), r=1</text>
<text x="337.515" y="329.603" font-family="Arial,sans-serif" font-size="15" fill="#142238">A′</text><text x="362.243" y="181.698" font-family="Arial,sans-serif" font-size="15" fill="#142238">B</text><text x="365.5" y="232.5" font-family="Arial,sans-serif" font-size="15" fill="#142238">P</text>
<rect x="28" y="486" width="704" height="58" rx="12" fill="#f1f5f9"/>
<text x="48" y="510" font-family="Arial,sans-serif" font-size="16" fill="#142238">중심거리 5√2, 반지름 합 3이므로 A′B=5√2−3</text>
<text x="48" y="534" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#087970">m=(5√2−3)+3=5√2  ⟹  m²=50</text>
</svg>