<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc" data-scale-policy="EQUAL_UNIT" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT">
<title id="title">삼각형 안에 들어가는 가장 큰 원</title>
<desc id="desc">P는 꼭짓점 마이너스 2,1과 2,1과 0,마이너스 1을 갖는 삼각형이며, 중심 M은 0,a이고 반지름 b인 원이 세 변에 접한다.</desc>
<rect width="720" height="420" rx="20" fill="#ffffff"/>
<text x="28" y="34" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#142238">P의 내부에 포함되는 원 Q의 반지름 최댓값</text>
<text x="28" y="59" font-family="Arial, sans-serif" font-size="15" fill="#526175">Q⊂P일 때 가장 큰 원은 위쪽 변과 양쪽 사선에 접한다.</text>
<line x1="90" y1="230" x2="630" y2="230" stroke="#a9b5c4" stroke-width="1.5"/>
<line x1="360" y1="98" x2="360" y2="346" stroke="#a9b5c4" stroke-width="1.5"/>
<text x="618" y="323" font-family="Arial, sans-serif" font-size="14" fill="#526175">x</text>
<text x="367" y="108" font-family="Arial, sans-serif" font-size="14" fill="#526175">y</text>
<polygon points="160,130 560,130 360,330" fill="#eaf4f2" stroke="#24364b" stroke-width="3" stroke-linejoin="round"/>
<circle cx="160" cy="130" r="4.5" fill="#24364b"/><circle cx="560" cy="130" r="4.5" fill="#24364b"/><circle cx="360" cy="340" r="4.5" fill="#24364b"/>
<text x="108" y="121" font-family="Arial, sans-serif" font-size="15" fill="#24364b">(−2,1)</text>
<text x="564" y="121" font-family="Arial, sans-serif" font-size="15" fill="#24364b">(2,1)</text>
<text x="366" y="347" font-family="Arial, sans-serif" font-size="15" fill="#24364b">(0,−1)</text>
<circle cx="360" cy="212.8427" r="82.8427" fill="#d9efec" fill-opacity="0.82" stroke="#087970" stroke-width="3"/>
<line x1="360" y1="212.8427" x2="360" y2="130" stroke="#d77a26" stroke-width="2.5" stroke-dasharray="7 5"/>
<line x1="360" y1="212.8427" x2="418.5786" y2="271.4214" stroke="#d77a26" stroke-width="2.5" stroke-dasharray="7 5"/>
<circle cx="360" cy="212.8427" r="5.5" fill="#087970"/><circle cx="360" cy="130" r="4.5" fill="#d35e48"/><circle cx="418.5786" cy="271.4214" r="4.5" fill="#d35e48"/>
<text x="369" y="183" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#ad5915">b</text>
<text x="369" y="232" font-family="Arial, sans-serif" font-size="15" fill="#142238">M(0,a)</text>
<text x="424" y="278" font-family="Arial, sans-serif" font-size="14" fill="#526175">접점</text>
<rect x="28" y="370" width="664" height="34" rx="10" fill="#f1f5f9"/>
<text x="44" y="393" font-family="Arial, sans-serif" font-size="16" fill="#142238">위쪽 변: 1−a=b  ·  사선 변: (a+1)/√2=b  ·  따라서 a+b=1</text>
</svg>