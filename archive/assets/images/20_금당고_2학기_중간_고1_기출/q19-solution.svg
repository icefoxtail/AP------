<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 520" width="920" height="520" role="img" aria-labelledby="title desc" data-scale-policy="SCHEMATIC_ALLOWED">
<title id="title">겹치는 삼각형의 넓이와 매개변수 구간</title>
<desc id="desc">0보다 크고 1 이하인 t에서는 한 변 t인 정사각형 전체가 공통부분이다. t가 1보다 크고 2보다 작은 경우 t가 4/3일 때 정사각형의 맞은편 두 모서리에서 다리가 2/3인 직각삼각형 두 개가 빠진다.</desc>
<rect width="920" height="520" rx="20" fill="#ffffff"/>
<text x="28" y="34" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#142238">공통부분 넓이를 t의 구간별로 계산</text>
<text x="28" y="60" font-family="Arial, sans-serif" font-size="15" fill="#526175">정사각형 [0,t]×[0,t]에서 경계 x+y=2와 x+y=2t−2가 잘라 내는 부분을 센다.</text>
<line x1="408" y1="82" x2="408" y2="496" stroke="#d5dde6" stroke-width="2"/>
<text x="42" y="98" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#087970">0&lt;t≤1</text>
<text x="42" y="122" font-family="Arial, sans-serif" font-size="15" fill="#526175">두 대각선 경계는 정사각형 바깥에 있다.</text>
<rect x="104" y="188" width="176" height="176" fill="#d9efec" stroke="#24364b" stroke-width="3"/>
<line x1="104" y1="364" x2="292" y2="364" stroke="#24364b" stroke-width="2"/>
<line x1="104" y1="376" x2="104" y2="176" stroke="#24364b" stroke-width="2"/>
<text x="288" y="382" font-family="Arial, sans-serif" font-size="14" fill="#526175">x</text>
<text x="87" y="184" font-family="Arial, sans-serif" font-size="14" fill="#526175">y</text>
<text x="177" y="282" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#087970">공통부분</text>
<text x="176" y="388" font-family="Arial, sans-serif" font-size="16" fill="#142238">S(t)=t²</text>
<text x="454" y="98" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#087970">1&lt;t&lt;2</text>
<text x="454" y="122" font-family="Arial, sans-serif" font-size="15" fill="#526175">오른쪽은 최댓값이 생기는 t=4/3의 정확한 도형이다.</text>
<rect x="540" y="150" width="160" height="160" fill="#d9efec" stroke="#24364b" stroke-width="3"/>
<polygon points="620,150 700,150 700,230" fill="#f7e7d4" stroke="#d77a26" stroke-width="2"/>
<polygon points="540,230 620,310 540,310" fill="#e8edf3" stroke="#68788d" stroke-width="2"/>
<line x1="620" y1="150" x2="700" y2="230" stroke="#d77a26" stroke-width="2.5" stroke-dasharray="6 4"/>
<line x1="540" y1="230" x2="620" y2="310" stroke="#68788d" stroke-width="2.5" stroke-dasharray="6 4"/>
<text x="644" y="191" font-family="Arial, sans-serif" font-size="14" fill="#8e4b18">잘린 넓이</text>
<text x="548" y="278" font-family="Arial, sans-serif" font-size="14" fill="#526175">잘린 넓이</text>
<text x="607" y="140" font-family="Arial, sans-serif" font-size="14" fill="#8e4b18">x+y=2</text>
<text x="452" y="232" font-family="Arial, sans-serif" font-size="14" fill="#526175">x+y=2t−2</text>
<text x="543" y="333" font-family="Arial, sans-serif" font-size="15" fill="#142238">정사각형 넓이: 16/9</text>
<text x="543" y="354" font-family="Arial, sans-serif" font-size="15" fill="#142238">각 모서리 삼각형: 2/9</text>
<text x="543" y="375" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#087970">S(4/3)=16/9−2·2/9=4/3</text>
<rect x="28" y="432" width="864" height="64" rx="12" fill="#f1f5f9"/>
<text x="48" y="459" font-family="Arial, sans-serif" font-size="17" fill="#142238">1&lt;t&lt;2:  S(t)=t²−(2t−2)²=−3t²+8t−4</text>
<text x="48" y="484" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#087970">S(t)=−3(t−4/3)²+4/3이므로 최댓값은 4/3 (t=4/3)</text>
</svg>