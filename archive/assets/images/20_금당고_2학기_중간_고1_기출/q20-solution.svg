<text x="58" y="136" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#142238">g(0)=1, g(2)=4</text>
<text x="60" y="486" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#087970">중간 구간의 치역 [1,4]</text>
</g>
<g>
