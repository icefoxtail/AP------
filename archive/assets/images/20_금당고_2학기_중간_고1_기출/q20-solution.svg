<circle cx="530" cy="270" r="5.5" fill="#087970"/><circle cx="590" cy="360" r="5.5" fill="#087970"/>
<text x="478" y="136" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#142238">g(0)=4, g(2)=1</text>
<text x="480" y="486" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#087970">중간 구간의 치역 [1,4]</text>
</g>
<text x="236" y="524" font-family="Arial,sans-serif" font-size="14" fill="#526175">두 방향 모두 중간 치역은 [1,4]; 두 끝 범위와 겹치지 않는다.</text>
</svg>