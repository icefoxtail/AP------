<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 530" width="720" height="530" role="img" aria-labelledby="title desc" data-scale-policy="EQUAL_UNIT">
<title id="title">세 구간의 치역을 잇는 일대일 함수</title>
<desc id="desc">왼쪽 가지의 치역은 마이너스 무한대부터 1까지 열리고, 오른쪽 가지는 4부터 무한대까지 열리므로 가운데 절댓값 일차함수는 1과 4를 끝값으로 단조로워야 한다. 증가형과 감소형 두 경우를 보여준다.</desc>
<rect width="720" height="530" rx="20" fill="#ffffff"/>
<text x="28" y="34" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#142238">치역 전체와 역함수 존재 조건</text>
<text x="28" y="60" font-family="Arial,sans-serif" font-size="15" fill="#526175">왼쪽 치역 (−∞,1), 오른쪽 치역 (4,∞) 사이를 가운데 구간이 일대일로 채운다.</text>
<text x="35" y="89" font-family="Arial,sans-serif" font-size="14" fill="#536f9c">x&lt;0: 1−x²</text><text x="295" y="89" font-family="Arial,sans-serif" font-size="14" fill="#087970">0≤x≤2: |ax+b|</text><text x="520" y="89" font-family="Arial,sans-serif" font-size="14" fill="#d77a26">x&gt;2: (x−2)²+4</text>
<g>
<rect x="38" y="112" width="206" height="397" rx="12" fill="#fbfcfe" stroke="#d5dde6"/>
<line x1="50" y1="390" x2="230" y2="390" stroke="#94a3b8" stroke-width="1.5"/><line x1="110" y1="150" x2="110" y2="510" stroke="#94a3b8" stroke-width="1.5"/>
<line x1="50" y1="360" x2="230" y2="360" stroke="#dfe6ee" stroke-width="1" stroke-dasharray="4 4"/><line x1="50" y1="270" x2="230" y2="270" stroke="#dfe6ee" stroke-width="1" stroke-dasharray="4 4"/>
<text x="113" y="405" font-family="Arial,sans-serif" font-size="13" fill="#526175">0</text><text x="169" y="405" font-family="Arial,sans-serif" font-size="13" fill="#526175">2</text><text x="42" y="364" font-family="Arial,sans-serif" font-size="13" fill="#526175">1</text><text x="42" y="274" font-family="Arial,sans-serif" font-size="13" fill="#526175">4</text>
