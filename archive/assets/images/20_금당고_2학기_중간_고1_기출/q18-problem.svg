<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-labelledby="title desc" data-scale-policy="EQUAL_UNIT">
<title id="title">집합 P의 좌표평면 영역</title>
<desc id="desc">y가 절댓값 x 마이너스 1 이상이고 1 이하인 점들의 삼각형 영역 P이다.</desc>
<rect width="640" height="360" fill="#ffffff"/>
<line x1="88" y1="220" x2="552" y2="220" stroke="#8996a6" stroke-width="1.5"/>
<line x1="320" y1="64" x2="320" y2="316" stroke="#8996a6" stroke-width="1.5"/>
<text x="554" y="215" font-family="Arial,sans-serif" font-size="16" fill="#526175">x</text><text x="326" y="70" font-family="Arial,sans-serif" font-size="16" fill="#526175">y</text>
<polygon points="160,140 480,140 320,300" fill="#e8edf3" stroke="#24364b" stroke-width="3" stroke-linejoin="round"/>
<circle cx="160" cy="140" r="4.5" fill="#24364b"/><circle cx="480" cy="140" r="4.5" fill="#24364b"/><circle cx="320" cy="300" r="4.5" fill="#24364b"/>
<text x="98" y="127" font-family="Arial,sans-serif" font-size="16" fill="#24364b">(−2,1)</text><text x="486" y="127" font-family="Arial,sans-serif" font-size="16" fill="#24364b">(2,1)</text><text x="328" y="317" font-family="Arial,sans-serif" font-size="16" fill="#24364b">(0,−1)</text>
<text x="302" y="204" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#24364b">P</text>
<text x="366" y="126" font-family="Arial,sans-serif" font-size="15" fill="#526175">y=1</text>
<text x="408" y="207" font-family="Arial,sans-serif" font-size="14" fill="#526175">y=|x|−1</text>
</svg>