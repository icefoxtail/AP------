<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" width="720" height="430" role="img" aria-labelledby="title desc" data-scale-policy="EQUAL_UNIT" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT">
<title id="title">대칭이동 뒤 원과 직선의 접선</title>
<desc id="desc">반지름 루트 5인 두 원이 직선 2x 더하기 y 더하기 1은 0에 각각 k가 2일 때와 마이너스 8일 때 접한다. 두 그림은 같은 축척이다.</desc>
<rect width="720" height="430" rx="20" fill="#ffffff"/>
<text x="28" y="34" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#142238">대칭이동 뒤 원과 직선의 접선</text>
<text x="28" y="59" font-family="Arial, sans-serif" font-size="15" fill="#526175">직선 l: 2x+y+1=0 · 접선이면 중심에서 l까지의 거리=√5</text>
<line x1="360" y1="82" x2="360" y2="404" stroke="#d5dde6" stroke-width="2"/>
<text x="56" y="92" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#087970">k=2</text>
<text x="56" y="116" font-family="Arial, sans-serif" font-size="15" fill="#526175">C=(−2,−2), T=(0,−1), r=√5</text>
<line x1="115" y1="130" x2="235" y2="370" stroke="#24364b" stroke-width="3"/>
<line x1="175" y1="130" x2="175" y2="370" stroke="#d7dfe7" stroke-width="1.5"/>
<line x1="55" y1="226" x2="247" y2="226" stroke="#d7dfe7" stroke-width="1.5"/>
<text x="238" y="222" font-family="Arial, sans-serif" font-size="14" fill="#66758a">x</text>
<text x="179" y="139" font-family="Arial, sans-serif" font-size="14" fill="#66758a">y</text>
<circle cx="127" cy="274" r="53.6656" fill="#e7f3f2" fill-opacity="0.75" stroke="#15827a" stroke-width="3"/>
<line x1="127" y1="274" x2="175" y2="250" stroke="#d77a26" stroke-width="2.5" stroke-dasharray="7 5"/>
<circle cx="127" cy="274" r="5.5" fill="#087970"/>
<circle cx="175" cy="250" r="5.5" fill="#d35e48"/>
<text x="92" y="300" font-family="Arial, sans-serif" font-size="15" fill="#142238">C</text>
<text x="183" y="246" font-family="Arial, sans-serif" font-size="15" fill="#142238">T</text>
<text x="440" y="92" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#087970">k=−8</text>
<text x="440" y="116" font-family="Arial, sans-serif" font-size="15" fill="#526175">C=(−2,8), T=(−4,7), r=√5</text>
<line x1="462" y1="130" x2="558" y2="322" stroke="#24364b" stroke-width="3"/>
<line x1="618" y1="130" x2="618" y2="322" stroke="#d7dfe7" stroke-width="1.5"/>
<text x="622" y="139" font-family="Arial, sans-serif" font-size="14" fill="#66758a">y</text>
<circle cx="570" cy="226" r="53.6656" fill="#e7f3f2" fill-opacity="0.75" stroke="#15827a" stroke-width="3"/>
<line x1="570" y1="226" x2="522" y2="250" stroke="#d77a26" stroke-width="2.5" stroke-dasharray="7 5"/>
<circle cx="570" cy="226" r="5.5" fill="#087970"/>
<circle cx="522" cy="250" r="5.5" fill="#d35e48"/>
<text x="580" y="221" font-family="Arial, sans-serif" font-size="15" fill="#142238">C</text>
<text x="490" y="270" font-family="Arial, sans-serif" font-size="15" fill="#142238">T</text>
<text x="28" y="408" font-family="Arial, sans-serif" font-size="14" fill="#526175">두 후보에서 반지름과 중심-접점 거리는 각각 √5이다.</text>
</svg>