<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" role="img" aria-labelledby="title desc" width="760" height="340"><title id="title">문항 9 해설: 열린 수직선</title><desc id="desc">B가 열린 구간이고 점 3과 5를 비교해 서로소와 포함관계를 판정하는 수직선</desc><style>text{font-family:"Noto Sans KR",Arial,sans-serif;fill:#172033}.m{fill:#56657a}.math{font-family:Georgia,serif}</style><rect width="760" height="340" rx="18" fill="#f8fafc"/><text x="28" y="38" font-size="22" font-weight="700">열린 구간과 두 점의 위치</text><text x="28" y="66" class="m" font-size="15">x²−a&lt;0은 −√a&lt;x&lt;√a이고 양 끝점은 ○이다.</text><rect x="28" y="86" width="704" height="140" rx="14" fill="#fff" stroke="#cbd5e1"/><line x1="92" y1="150" x2="670" y2="150" stroke="#64748b" stroke-width="2"/><line x1="220" y1="150" x2="530" y2="150" stroke="#2563eb" stroke-width="8"/><circle cx="220" cy="150" r="9" fill="#fff" stroke="#2563eb" stroke-width="3"/><circle cx="530" cy="150" r="9" fill="#fff" stroke="#2563eb" stroke-width="3"/><circle cx="370" cy="150" r="7" fill="#dc2626"/><circle cx="450" cy="150" r="7" fill="#d97706"/><text x="220" y="126" text-anchor="middle" class="math" font-size="18">−√a</text><text x="530" y="126" text-anchor="middle" class="math" font-size="18">√a</text><text x="370" y="184" text-anchor="middle" font-size="16">3</text><text x="450" y="184" text-anchor="middle" font-size="16">5</text><rect x="70" y="248" width="286" height="54" rx="10" fill="#eff6ff" stroke="#93c5fd"/><text x="84" y="272" font-size="16">A∩B=∅ → √a≤3</text><text x="84" y="292" class="m" font-size="13">점 3이 경계에 놓여도 제외</text><rect x="400" y="248" width="286" height="54" rx="10" fill="#ecfdf5" stroke="#86efac"/><text x="414" y="272" font-size="16">A⊆B → 5&lt;√a</text><text x="414" y="292" class="m" font-size="13">점 3과 5가 모두 안쪽</text></svg>
