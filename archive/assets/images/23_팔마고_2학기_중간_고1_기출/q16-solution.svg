<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" width="640" height="280" role="img" aria-labelledby="title desc">
  <title id="title">대칭이동으로 바꾼 최단거리</title>
  <desc id="desc">원 C1을 y=x에 대칭이동한 원의 중심 C1'(8,2), 원 C2를 y축에 대칭이동한 원의 중심 C2'(-4,2), 두 원에서 서로 마주 보는 점 A'(6,2), B'(-3,2), 그리고 선분 A'B'가 y=x와 y축을 차례로 만나는 점 P(2,2), Q(0,2)를 나타낸 그림이다.</desc>
  <rect width="640" height="280" fill="#fff"/>
  <text x="320" y="28" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="21" font-weight="700" fill="#1e3a5f">대칭이동 후 한 직선으로 펼치기</text>
  <rect x="18" y="45" width="360" height="215" rx="8" fill="#f8fafc" stroke="#dbe3ef"/>
  <line x1="35" y1="190" x2="360" y2="190" stroke="#0f172a" stroke-width="1.3"/>
  <line x1="140" y1="250" x2="140" y2="53" stroke="#0f172a" stroke-width="1.5"/>
  <line x1="96" y1="234" x2="294" y2="36" stroke="#7c3aed" stroke-width="2" stroke-dasharray="6 4"/>
  <circle cx="52" cy="146" r="22" fill="#fef3c7" fill-opacity=".7" stroke="#f97316" stroke-width="2.5"/>
  <circle cx="316" cy="146" r="44" fill="#dbeafe" fill-opacity=".6" stroke="#2563eb" stroke-width="2.5"/>
  <line x1="74" y1="146" x2="272" y2="146" stroke="#0f766e" stroke-width="3"/>
  <circle cx="74" cy="146" r="4.5" fill="#f97316"/><circle cx="272" cy="146" r="4.5" fill="#2563eb"/><circle cx="184" cy="146" r="4" fill="#dc2626"/><circle cx="140" cy="146" r="4" fill="#b91c1c"/>
  <text x="23" y="136" font-family="Arial, sans-serif" font-size="14" fill="#c2410c">B'(−3,2)</text>
  <text x="270" y="111" font-family="Arial, sans-serif" font-size="14" fill="#1d4ed8">A'(6,2)</text>
  <text x="187" y="137" font-family="Arial, sans-serif" font-size="14" fill="#b91c1c">P(2,2)</text><text x="144" y="137" font-family="Arial, sans-serif" font-size="14" fill="#b91c1c">Q(0,2)</text>
  <text x="300" y="53" font-family="Arial, sans-serif" font-size="14" fill="#6d28d9">y=x</text><text x="145" y="67" font-family="Arial, sans-serif" font-size="14" fill="#334155">y축</text>
  <rect x="400" y="45" width="222" height="215" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="420" y="74" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="18" font-weight="700" fill="#1e3a5f">최단거리 구조</text>
  <text x="420" y="106" font-family="Arial, sans-serif" font-size="15">C1' 중심 (8,2), A'(6,2), r=2</text>
  <text x="420" y="130" font-family="Arial, sans-serif" font-size="15">C2' 중심 (−4,2), B'(−3,2), r=1</text>
  <text x="420" y="158" font-family="Arial, sans-serif" font-size="15">중심거리=12</text>
  <text x="420" y="182" font-family="Arial, sans-serif" font-size="15">A'B'=12−2−1=9</text>
  <line x1="420" y1="193" x2="602" y2="193" stroke="#cbd5e1"/>
  <text x="420" y="218" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14">P, Q를 차례로 지나 등호 성립</text>
  <text x="420" y="246" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#1d4ed8">최솟값 9 → ①</text>
</svg>
