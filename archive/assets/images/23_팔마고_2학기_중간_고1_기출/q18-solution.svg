<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" width="640" height="280" role="img" aria-labelledby="title desc">
  <title id="title">중심의 자취인 세 평행선과 원</title>
  <desc id="desc">평행이동 후 좌표축에 접하는 반지름 1인 원의 중심이 놓일 세 평행선 y=x, y=x-2, y=x+2와, 중심이 y=x 위에 있는 원 C가 두 점과 두 접점으로 총 네 점을 만드는 모습을 나타낸 그림이다.</desc>
  <rect width="640" height="280" fill="#fff"/>
  <text x="320" y="28" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="21" font-weight="700" fill="#1e3a5f">중심의 자취와 교점 개수</text>
  <rect x="18" y="45" width="360" height="215" rx="8" fill="#f8fafc" stroke="#dbe3ef"/>
  <defs><clipPath id="plotClip18"><rect x="35" y="53" width="325" height="199" rx="2"/></clipPath></defs>
  <g clip-path="url(#plotClip18)">
    <line x1="35" y1="266" x2="260" y2="41" stroke="#0f766e" stroke-width="2.6"/>
    <line x1="35" y1="196" x2="260" y2="-29" stroke="#f97316" stroke-width="2.3"/>
    <line x1="35" y1="336" x2="260" y2="111" stroke="#f97316" stroke-width="2.3"/>
    <circle cx="140" cy="160" r="49.5" fill="#dbeafe" fill-opacity=".6" stroke="#2563eb" stroke-width="2.5"/>
  </g>
  <line x1="35" y1="230" x2="350" y2="230" stroke="#0f172a" stroke-width="1.2"/><line x1="70" y1="252" x2="70" y2="53" stroke="#0f172a" stroke-width="1.2"/>
  <circle cx="105" cy="195" r="4.5" fill="#0f766e"/><circle cx="175" cy="125" r="4.5" fill="#0f766e"/><circle cx="105" cy="125" r="4.5" fill="#f97316"/><circle cx="175" cy="195" r="4.5" fill="#f97316"/>
  <text x="180" y="116" font-family="Arial, sans-serif" font-size="14" fill="#0f766e">2점</text><text x="180" y="207" font-family="Arial, sans-serif" font-size="14" fill="#c2410c">접점 1</text><text x="83" y="117" font-family="Arial, sans-serif" font-size="14" fill="#c2410c">접점 1</text>
  <text x="265" y="64" font-family="Arial, sans-serif" font-size="14" fill="#0f766e">y=x</text><text x="260" y="88" font-family="Arial, sans-serif" font-size="13" fill="#c2410c">y=x+2</text><text x="250" y="219" font-family="Arial, sans-serif" font-size="13" fill="#c2410c">y=x−2</text>
  <text x="145" y="154" font-family="Arial, sans-serif" font-size="14" fill="#1d4ed8">C 중심</text>
  <text x="341" y="224" font-family="Arial, sans-serif" font-size="14" fill="#334155">x</text><text x="77" y="66" font-family="Arial, sans-serif" font-size="14" fill="#334155">y</text>
  <rect x="400" y="45" width="222" height="215" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="420" y="74" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="18" font-weight="700" fill="#1e3a5f">세 직선이 나오는 이유</text>
  <text x="420" y="106" font-family="Arial, sans-serif" font-size="15">|x+m|=|y+m|=1</text>
  <text x="420" y="130" font-family="Arial, sans-serif" font-size="15">x−y=0, ±2</text>
  <text x="420" y="154" font-family="Arial, sans-serif" font-size="14">중심의 자취: y=x, y=x±2</text>
  <line x1="420" y1="166" x2="602" y2="166" stroke="#cbd5e1"/>
  <text x="420" y="191" font-family="Arial, sans-serif" font-size="15">중앙선 2점 + 바깥선 접점 1+1</text>
  <text x="420" y="218" font-family="Arial, sans-serif" font-size="15">r=√2</text>
  <text x="420" y="246" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#1d4ed8">r²=2 → ②</text>
</svg>
