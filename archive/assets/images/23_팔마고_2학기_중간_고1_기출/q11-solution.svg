<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" role="img" aria-labelledby="title desc" width="760" height="320"><title id="title">문항 11 해설: B만 영역의 범위</title><desc id="desc">교집합과 B만 영역을 변수로 두어 겹침의 크기와 B-A를 비교하는 Venn diagram</desc><style>text{font-family:"Noto Sans KR",Arial,sans-serif;fill:#172033}.m{fill:#56657a}</style><rect width="760" height="320" rx="18" fill="#f8fafc"/><text x="28" y="38" font-size="22" font-weight="700">겹침이 바뀌면 B만 영역이 반대로 바뀐다</text><rect x="28" y="78" width="430" height="180" rx="14" fill="#fff" stroke="#cbd5e1"/><circle cx="220" cy="168" r="68" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><circle cx="300" cy="168" r="68" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text x="170" y="128" font-size="17">A 15</text><text x="318" y="128" font-size="17">B 19</text><text x="260" y="180" text-anchor="middle" font-size="22" fill="#7c3aed">y</text><text x="350" y="180" text-anchor="middle" font-size="18" fill="#15803d">19−y</text><rect x="490" y="90" width="238" height="132" rx="14" fill="#fff" stroke="#cbd5e1"/><text x="514" y="126" font-size="17">y 작아짐 → B만 커짐</text><text x="514" y="162" font-size="17">y 커짐 → B만 작아짐</text><text x="514" y="198" font-size="17">교집합의 최솟값·최댓값</text><text x="28" y="294" class="m" font-size="14">B−A=19−y이므로 y의 범위가 곧 B−A의 범위다.</text></svg>
