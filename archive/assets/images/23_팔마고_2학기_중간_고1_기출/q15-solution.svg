<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" width="640" height="280" role="img" aria-labelledby="title desc" data-scale-policy="SCHEMATIC_ALLOWED">
  <title id="title">현 AB와 반대쪽 점 C, 점 D</title>
  <desc id="desc">원 x²+y²=10과 기울기 2인 직선 l의 교점 A(-1,3), B(-3,-1), 원점을 사이에 둔 반대쪽 점 C(1,-3), 수평선과 l의 교점 D(-4,-3)를 나타낸 그림이다.</desc>
  <rect width="640" height="280" fill="#fff"/>
  <text x="320" y="28" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="21" font-weight="700" fill="#1e3a5f">현의 길이로 직선과 점을 결정</text>
  <rect x="18" y="45" width="360" height="215" rx="8" fill="#f8fafc" stroke="#dbe3ef"/>
  <line x1="46" y1="155" x2="320" y2="155" stroke="#0f172a" stroke-width="1.3"/><line x1="190" y1="250" x2="190" y2="52" stroke="#0f172a" stroke-width="1.3"/>
  <circle cx="190" cy="155" r="76" fill="#dbeafe" fill-opacity=".58" stroke="#2563eb" stroke-width="2.5"/>
  <line x1="70" y1="275" x2="190" y2="40" stroke="#0f766e" stroke-width="2.6"/>
  <line x1="118" y1="179" x2="166" y2="83" stroke="#dc2626" stroke-width="2.5"/>
  <line x1="94" y1="227" x2="214" y2="227" stroke="#f97316" stroke-width="2.5"/>
  <line x1="190" y1="155" x2="166" y2="83" stroke="#64748b" stroke-width="1.6" stroke-dasharray="5 4"/>
  <circle cx="166" cy="83" r="4.5" fill="#1d4ed8"/><circle cx="118" cy="179" r="4.5" fill="#1d4ed8"/><circle cx="190" cy="155" r="4" fill="#0f172a"/><circle cx="214" cy="227" r="4.5" fill="#f97316"/><circle cx="94" cy="227" r="4.5" fill="#f97316"/>
  <text x="169" y="76" font-family="Arial, sans-serif" font-size="15" fill="#1d4ed8">A(−1,3)</text><text x="91" y="174" font-family="Arial, sans-serif" font-size="15" fill="#1d4ed8">B(−3,−1)</text>
  <text x="195" y="151" font-family="Arial, sans-serif" font-size="15" fill="#0f172a">O</text><text x="217" y="244" font-family="Arial, sans-serif" font-size="15" fill="#c2410c">C(1,−3)</text><text x="57" y="244" font-family="Arial, sans-serif" font-size="15" fill="#c2410c">D(−4,−3)</text>
  <text x="270" y="74" font-family="Arial, sans-serif" font-size="15" fill="#0f766e">l: 기울기 2</text>
  <text x="312" y="149" font-family="Arial, sans-serif" font-size="14" fill="#334155">x</text><text x="197" y="64" font-family="Arial, sans-serif" font-size="14" fill="#334155">y</text>
  <rect x="400" y="45" width="222" height="215" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="420" y="74" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="18" font-weight="700" fill="#1e3a5f">핵심 계산</text>
  <text x="420" y="106" font-family="Arial, sans-serif" font-size="15">r=√10, AB/2=√5</text>
  <text x="420" y="130" font-family="Arial, sans-serif" font-size="15">d²+5=10 → d=√5</text>
  <text x="420" y="154" font-family="Arial, sans-serif" font-size="15">d=|k|/√5 → |k|=5</text>
  <text x="420" y="178" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14">A·B의 사분면 조건 → k=5</text>
  <line x1="420" y1="190" x2="602" y2="190" stroke="#cbd5e1"/>
  <text x="420" y="216" font-family="Arial, sans-serif" font-size="15">C=(1,−3), D=(−4,−3)</text>
  <text x="420" y="244" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#1d4ed8">OD=5 → ①</text>
</svg>
