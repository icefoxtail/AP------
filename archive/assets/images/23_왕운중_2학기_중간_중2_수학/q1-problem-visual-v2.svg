<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 718 545" width="718" height="545" role="img" aria-labelledby="title desc"><title id="title">큰 원뿔과 작은 원뿔의 같은 모양</title><desc id="desc">왼쪽 (가)는 작은 원뿔, 오른쪽 (나)는 큰 원뿔이다. 두 원뿔은 닮았고 밑면은 같은 모양이다.</desc><rect width="718" height="545" fill="white" /><polygon points="68.2000,398.0000 269.8000,398.0000 169.0000,236.0000" fill="#fff" /><ellipse cx="169" cy="398" rx="100.8" ry="21.0" fill="#fff" /><path d="M 68.2 398 A 100.8 21.0 0 0 1 269.8 398" fill="none" stroke="#687889" stroke-dasharray="8 6" stroke-width="3.25" /><path d="M 68.2 398 A 100.8 21.0 0 0 0 269.8 398" fill="none" stroke="#227365" stroke-width="4.85" /><line x1="68.2000" y1="398.0000" x2="169.0000" y2="236.0000" stroke="#21639a" stroke-width="5.15" stroke-linecap="round" /><line x1="269.8000" y1="398.0000" x2="169.0000" y2="236.0000" stroke="#21639a" stroke-width="5.15" stroke-linecap="round" /><text x="169.0000" y="472.0000" font-size="36" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#273846" text-anchor="middle">(가)</text><polygon points="334.0000,398.0000 670.0000,398.0000 502.0000,128.0000" fill="#fff" /><ellipse cx="502" cy="398" rx="168" ry="35" fill="#fff" /><path d="M 334 398 A 168 35 0 0 1 670 398" fill="none" stroke="#687889" stroke-dasharray="8 6" stroke-width="3.25" /><path d="M 334 398 A 168 35 0 0 0 670 398" fill="none" stroke="#227365" stroke-width="4.85" /><line x1="334.0000" y1="398.0000" x2="502.0000" y2="128.0000" stroke="#21639a" stroke-width="5.15" stroke-linecap="round" /><line x1="670.0000" y1="398.0000" x2="502.0000" y2="128.0000" stroke="#21639a" stroke-width="5.15" stroke-linecap="round" /><text x="502.0000" y="486.0000" font-size="36" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#273846" text-anchor="middle">(나)</text></svg>
