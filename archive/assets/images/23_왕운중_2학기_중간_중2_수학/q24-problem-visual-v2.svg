<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 736 682" width="736" height="682" role="img" aria-labelledby="title desc"><title id="title">큰 원에서 작은 내접원을 뺀 색칠 영역</title><desc id="desc">직각삼각형 ABC의 세 꼭짓점은 중심 O의 원 위에 있다. 작은 내접원의 중심은 O′이다. AB는 8 cm, BC는 6 cm, AC는 10 cm이다. 큰 원 안에서 작은 원 내부만 제외했다.</desc><rect width="736" height="682" fill="white" /><circle cx="386.0" cy="338.0" r="230" fill="#f8e5d2" stroke="#a34c1f" stroke-width="3.6" /><circle cx="340.0" cy="430.0" r="92" fill="#fff" stroke="#227365" stroke-width="3.6" /><line x1="248.0000" y1="154.0000" x2="248.0000" y2="522.0000" stroke="#21639a" stroke-width="4.8" stroke-linecap="round" /><line x1="248.0000" y1="522.0000" x2="524.0000" y2="522.0000" stroke="#21639a" stroke-width="4.8" stroke-linecap="round" /><line x1="524.0000" y1="522.0000" x2="248.0000" y2="154.0000" stroke="#21639a" stroke-width="4.8" stroke-linecap="round" /><line x1="248.0000" y1="501.0000" x2="269.0000" y2="501.0000" stroke="#586574" stroke-width="1.8" stroke-linecap="round" /><line x1="269.0000" y1="501.0000" x2="269.0000" y2="522.0000" stroke="#586574" stroke-width="1.8" stroke-linecap="round" /><line x1="146.0000" y1="154.0000" x2="146.0000" y2="522.0000" stroke="#21639a" stroke-width="1.7" stroke-linecap="round" /><line x1="151.5000" y1="154.0000" x2="140.5000" y2="154.0000" stroke="#21639a" stroke-width="1.7" stroke-linecap="round" /><line x1="151.5000" y1="522.0000" x2="140.5000" y2="522.0000" stroke="#21639a" stroke-width="1.7" stroke-linecap="round" /><text x="104.0000" y="346.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#21639a" text-anchor="middle">8 cm</text><line x1="248.0000" y1="577.0000" x2="524.0000" y2="577.0000" stroke="#21639a" stroke-width="1.7" stroke-linecap="round" /><line x1="248.0000" y1="571.5000" x2="248.0000" y2="582.5000" stroke="#21639a" stroke-width="1.7" stroke-linecap="round" /><line x1="524.0000" y1="571.5000" x2="524.0000" y2="582.5000" stroke="#21639a" stroke-width="1.7" stroke-linecap="round" /><text x="386.0000" y="618.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#21639a" text-anchor="middle">6 cm</text><line x1="294.4000" y1="119.2000" x2="570.4000" y2="487.2000" stroke="#21639a" stroke-width="1.7" stroke-linecap="round" /><line x1="298.8000" y1="115.9000" x2="290.0000" y2="122.5000" stroke="#21639a" stroke-width="1.7" stroke-linecap="round" /><line x1="574.8000" y1="483.9000" x2="566.0000" y2="490.5000" stroke="#21639a" stroke-width="1.7" stroke-linecap="round" /><text x="460.4000" y="290.2000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#21639a" text-anchor="middle">10 cm</text><circle cx="248.0" cy="154.0" r="4.9" fill="#28364b" /><text x="234.0000" y="136.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">A</text><circle cx="248.0" cy="522.0" r="4.9" fill="#28364b" /><text x="230.0000" y="546.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">B</text><circle cx="524.0" cy="522.0" r="4.9" fill="#28364b" /><text x="541.0000" y="544.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">C</text><circle cx="386.0" cy="338.0" r="4.9" fill="#28364b" /><text x="408.0000" y="321.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">O</text><circle cx="340.0" cy="430.0" r="4.9" fill="#28364b" /><text x="320.0000" y="411.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">O′</text></svg>
