<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 754 601" width="754" height="601" role="img" aria-labelledby="title desc"><title id="title">같은 원의 두 호와 바깥 점</title><desc id="desc">D와 E는 지름의 양 끝이다. A, B, C는 한 직선 위에 있고 A, D, O, E도 한 직선 위에 있다. AB와 OB의 길이는 같다. 호 BD는 12π cm이다.</desc><rect width="754" height="601" fill="white" /><circle cx="428.875" cy="295.5" r="195.5" fill="#fff" stroke="#21639a" stroke-width="3.6" /><line x1="135.6250" y1="464.8080" x2="598.1830" y2="197.7500" stroke="#687889" stroke-width="3.6" stroke-linecap="round" /><line x1="135.6250" y1="464.8080" x2="526.6250" y2="464.8080" stroke="#687889" stroke-width="3.65" stroke-linecap="round" /><line x1="428.8750" y1="295.5000" x2="331.1250" y2="464.8080" stroke="#227365" stroke-width="4.7" stroke-linecap="round" /><line x1="428.8750" y1="295.5000" x2="526.6250" y2="464.8080" stroke="#774698" stroke-width="4.65" stroke-linecap="round" /><line x1="232.7850" y1="471.8080" x2="232.7850" y2="457.8080" stroke="#227365" stroke-width="2.5" stroke-linecap="round" /><line x1="241.7850" y1="471.8080" x2="241.7850" y2="457.8080" stroke="#227365" stroke-width="2.5" stroke-linecap="round" /><line x1="374.2328" y1="376.1430" x2="386.3572" y2="383.1430" stroke="#227365" stroke-width="2.5" stroke-linecap="round" /><line x1="369.7328" y1="383.9373" x2="381.8572" y2="390.9373" stroke="#227365" stroke-width="2.5" stroke-linecap="round" /><path d="M 259.57 393.25 A 195.500 195.500 0 0 0 331.13 464.81" stroke="#227365" stroke-width="6.25" fill="none" /><path d="M 526.62 464.81 A 195.500 195.500 0 0 0 598.18 197.75" stroke="#774698" stroke-width="6.25" fill="none" /><text x="168.8600" y="320.9150" font-size="30" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#227365" text-anchor="middle">12π cm</text><circle cx="135.625" cy="464.80796643985775" r="4.9" fill="#28364b" /><text x="118.6250" y="484.8080" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="