<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 440" width="520" height="440" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">큰 직사각형이 가로선과 세로선으로 네 개의 작은 직사각형으로 나뉘어 있고, 각 영역에 넓이가 적혀 있다.</title><desc id="visual-desc">큰 직사각형이 십자 모양의 두 선으로 네 영역으로 나뉘어 있다. 왼쪽 위에는 3x 제곱, 오른쪽 위에는 5x, 왼쪽 아래에는 6x, 오른쪽 아래에는 10이 적혀 있다.</desc><rect width="520" height="440" fill="#fff"/><g data-layer="30"><line id="topSide" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="105.054945055" y1="52.142857143" x2="414.945054945" y2="52.142857143"/></g><g data-layer="30"><line id="rightSide" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="414.945054945" y1="52.142857143" x2="414.945054945" y2="387.857142857"/></g><g data-layer="30"><line id="bottomSide" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="414.945054945" y1="387.857142857" x2="105.054945055" y2="387.857142857"/></g><g data-layer="30"><line id="leftSide" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="105.054945055" y1="387.857142857" x2="105.054945055" y2="52.142857143"/></g><g data-layer="30"><line id="colDiv" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="285.824175824" y1="52.142857143" x2="285.824175824" y2="387.857142857"/></g><g data-layer="30"><line id="rowDiv" data-role="line" stroke="#111" stroke-width="1.6"