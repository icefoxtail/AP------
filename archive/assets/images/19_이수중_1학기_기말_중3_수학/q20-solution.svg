<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 703 625" width="703" height="625" role="img" aria-labelledby="title desc"><title id="title">사진을 둘러싼 일정한 폭의 액자</title><desc id="desc">파란 사진과 주황 액자 부분을 구분했다. 각 쪽의 폭 x를 더한 바깥 가로와 세로는 각각 12+2x와 20+2x이다.</desc><rect width="703" height="625" fill="white" /><rect x="166" y="67" width="300" height="420" fill="#fae6ce" stroke="#aa5411" stroke-width="4.45" /><rect x="226" y="127" width="180" height="300" fill="#e1eefb" stroke="#205d9c" stroke-width="4.3" /><text x="316.0000" y="287.0000" font-size="35" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#205d9c" text-anchor="middle">사진</text><line x1="166.0000" y1="518.0000" x2="466.0000" y2="518.0000" stroke="#205d9c" stroke-width="1.7" stroke-linecap="round" /><line x1="166.0000" y1="512.0000" x2="166.0000" y2="524.0000" stroke="#205d9c" stroke-width="1.65" stroke-linecap="round" /><line x1="466.0000" y1="512.0000" x2="466.0000" y2="524.0000" stroke="#205d9c" stroke-width="1.65" stroke-linecap="round" /><text x="316.0000" y="553.0000" font-size="30" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#205d9c" text-anchor="middle">12+2x</text><line x1="496.0000" y1="67.0000" x2="496.0000" y2="487.0000" stroke="#205d9c" stroke-width="1.7" stroke-linecap="round" /><line x1="502.0000" y1="67.0000" x2="490.0000" y2="67.0000" stroke="#205d9c" stroke-width="1.65" stroke-linecap="round" /><line x1="502.0000" y1="487.0000" x2="490.0000" y2="487.0000" stroke="#205d9c" stroke-width="1.65" stroke-linecap="round" /><text x="549.0000" y="286.0000" font-size="30" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#205d9c" text-anchor="middle">20+2x</text><line x1="166.0000" y1="147.0000" x2="226.0000" y2="147.0000" stroke="#aa5411" stroke-width="1.7" stroke-linecap="round" /><line x1="166.0000" y1="141.0000" x2="166.0000" y2="153.0000" stroke="#aa5411" stroke-width="1.65" stroke-linecap="round" /><line x1="226.0000" y1="141.0000" x2="226.0000" y2="153.0000" stroke="#aa5411" stroke-width="1.65" stroke-linecap="round" /><text x="196.0000" y="134.0000" font-size="30" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#aa5411" text-anchor="middle">x</text><line x1="406.0000" y1="147.0000" x2="466.0000" y2="147.0000" stroke="#aa5411" stroke-width="1.7" stroke-linecap="round" /><line x1="406.0000" y1="141.0000" x2="406.0000" y2="153.0000" stroke="#aa5411" stroke-width="1.65" stroke-linecap="round" /><line x1="466.0000" y1="141.0000" x2="466.0000" y2="153.0000" stroke="#aa5411" stroke-width="1.65" stroke-linecap="round" /><text x="436.0000" y="134.0000" font-size="30" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#aa5411" text-anchor="middle">x</text><line x1="309.0000" y1="97.0000" x2="323.0000" y2="97.0000" stroke="#aa5411" stroke-width="2.85" stroke-linecap="round" /><line x1="309.0000" y1="457.0000" x2="323.0000" y2="457.0000" stroke="#aa5411" stroke-width="2.85" stroke-linecap="round" /><text x="316.0000" y="341.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#205d9c" text-anchor="middle">12×20</text></svg>
