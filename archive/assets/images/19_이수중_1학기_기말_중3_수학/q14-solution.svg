<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 717 510" width="717" height="510" role="img" aria-labelledby="title desc"><title id="title">폭이 달라도 같은 꼭짓점을 가진 두 포물선</title><desc id="desc">파랑 곡선보다 초록 곡선의 폭이 넓고, 아래쪽에서는 두 곡선이 주황 꼭짓점과 보라 대칭축을 공유한다.</desc><rect width="717" height="510" fill="white" /><line x1="54.0000" y1="394.8706" x2="651.0000" y2="394.8706" stroke="#586574" stroke-width="1.65" stroke-linecap="round" /><polygon points="651.0000,394.8706 638.0000,389.8706 638.0000,399.8706" fill="#586574" /><text x="668.0000" y="386.8706" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#586574" text-anchor="middle">x</text><line x1="460.1322" y1="435.0000" x2="460.1322" y2="56.0000" stroke="#586574" stroke-width="1.65" stroke-linecap="round" /><polygon points="460.1322,56.0000 455.1322,69.0000 465.1322,69.0000" fill="#586574" /><text x="476.1322" y="62.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#586574" text-anchor="middle">y</text><circle cx="460.13221153846155" cy="394.8705882352941" r="4.6" fill="#28364b" /><text x="445.1322" y="421.8706" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">O</text><path d="M 220.1907 69.3765 Q 352.5000 675.7765 484.8093 69.3765" stroke="#205d9c" stroke-width="5.75" stroke-linecap="round" fill="none" /><path d="M 28.4097 69.3765 Q 352.5000 675.7765 676.5903 69.3765" stroke="#277339" stroke-width="5.35" stroke-linecap="round" fill="none" stroke-dasharray="12 5" /><circle cx="352.5" cy="372.5764705882353" r="4.6" fill="#aa5411" /><line x1="352.5000" y1="394.8706" x2="352.5000" y2="118.4235" stroke="#704895" stroke-width="1.95" stroke-linecap="round" stroke-dasharray="6 5" /><text x="171.0000" y="480.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#205d9c" text-anchor="middle">첫째 포물선</text><text x="546.0000" y="480