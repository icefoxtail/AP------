<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 722 543" width="722" height="543" role="img" aria-labelledby="title desc"><title id="title">다섯 포물선에서 꼭짓점의 높이만 비교</title><desc id="desc">계수가 양수이면 아래쪽 꼭짓점의 높이, 음수이면 위쪽 꼭짓점의 높이가 해당한다. 다섯 주황 점은 같은 세로 눈금으로 비교한다.</desc><rect width="722" height="543" fill="white" /><line x1="78.0000" y1="331.6520" x2="666.0000" y2="331.6520" stroke="#586574" stroke-width="1.35" stroke-linecap="round" stroke-dasharray="4 5" /><text x="56.0000" y="340.6520" font-size="27" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#586574" text-anchor="middle">0</text><line x1="78.0000" y1="262.9520" x2="666.0000" y2="262.9520" stroke="#586574" stroke-width="1.35" stroke-linecap="round" stroke-dasharray="4 5" /><text x="56.0000" y="271.9520" font-size="27" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#586574" text-anchor="middle">3</text><line x1="78.0000" y1="194.2520" x2="666.0000" y2="194.2520" stroke="#586574" stroke-width="1.35" stroke-linecap="round" stroke-dasharray="4 5" /><text x="56.0000" y="203.2520" font-size="27" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#586574" text-anchor="middle">6</text><line x1="78.0000" y1="125.5520" x2="666.0000" y2="125.5520" stroke="#586574" stroke-width="1.35" stroke-linecap="round" stroke-dasharray="4 5" /><text x="56.0000" y="134.5520" font-size="27" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#586574" text-anchor="middle">9</text><line x1="78.0000" y1="56.8520" x2="666.0000" y2="56.8520" stroke="#586574" stroke-width="1.35" stroke-linecap="round" stroke-dasharray="4 5" /><text x="56.0000" y="65.8520" font-size="27" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#586574" text-anchor="middle">12</text><path d="M 81.3169 221.2168 Q 126.0000 304.6873 170.6831 221.2168" stroke="#205d9c" stroke-width="5.3" stroke-linecap="round" fill="none" /><circle cx