<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 717 510" width="717" height="510" role="img" aria-labelledby="title desc"><title id="title">이차함수에서 완전제곱으로 얻은 대칭축</title><desc id="desc">파란 포물선은 원점 왼쪽의 보라 세로 점선을 사이에 두고 같은 모양이다. 아래 주황 꼭짓점과 두 x절편을 볼 수 있다.</desc><rect width="717" height="510" fill="white" /><line x1="54.0000" y1="281.5952" x2="651.0000" y2="281.5952" stroke="#586574" stroke-width="1.65" stroke-linecap="round" /><polygon points="651.0000,281.5952 638.0000,276.5952 638.0000,286.5952" fill="#586574" /><text x="668.0000" y="273.5952" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#586574" text-anchor="middle">x</text><line x1="389.3621" y1="435.0000" x2="389.3621" y2="56.0000" stroke="#586574" stroke-width="1.65" stroke-linecap="round" /><polygon points="389.3621,56.0000 384.3621,69.0000 394.3621,69.0000" fill="#586574" /><text x="405.3621" y="62.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#586574" text-anchor="middle">y</text><circle cx="389.36211699164346" cy="281.5952380952381" r="4.6" fill="#28364b" /><text x="374.3621" y="308.5952" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">O</text><path d="M 66.1950 175.1058 Q 360.2604 656.8109 654.3259 80.3605" stroke="#205d9c" stroke-width="5.8" stroke-linecap="round" fill="none" /><circle cx="333.93036211699166" cy="394.3928571428571" r="4.6" fill="#aa5411" /><line x1="333.9304" y1="428.7961" x2="333.9304" y2="72.9196" stroke="#704895" stroke-width="2.05" stroke-linecap="round" stroke-dasharray="6 5" /><circle cx="141.9091305257902" cy="281.5952380952381" r="4.6" fill="#205d9c" /><circle cx="525.9515937081931" cy="281.5952380952381" r="4.6" fill="#205d9c" /><text x="191.0000" y="43.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#205d9c" text-anchor="middle">y = (x + 1)²/6 − 2</text><