<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 646 601" width="646" height="601" role="img" aria-labelledby="title desc"><title id="title">사진을 둘러싼 일정한 폭의 액자</title><desc id="desc">파란 직사각형 사진에서 가로변의 길이는 12 cm, 세로변은 20 cm이다. 주황 액자의 네 모서리 쪽 띠는 모두 폭이 같다.</desc><rect width="646" height="601" fill="white" /><rect x="167" y="59" width="314.0" height="439.6" fill="#fae6ce" stroke="#aa5411" stroke-width="4.45" /><rect x="229.8" y="121.8" width="188.39999999999998" height="314.0" fill="#e1eefb" stroke="#205d9c" stroke-width="4.3" /><text x="324.0000" y="288.8000" font-size="35" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#205d9c" text-anchor="middle">사진</text><line x1="229.8000" y1="507.8000" x2="418.2000" y2="507.8000" stroke="#205d9c" stroke-width="1.7" stroke-linecap="round" /><line x1="229.8000" y1="501.8000" x2="229.8000" y2="513.8000" stroke="#205d9c" stroke-width="1.65" stroke-linecap="round" /><line x1="418.2000" y1="501.8000" x2="418.2000" y2="513.8000" stroke="#205d9c" stroke-width="1.65" stroke-linecap="round" /><text x="324.0000" y="547.8000" font-size="30" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#205d9c" text-anchor="middle">12 cm</text><line x1="491.2000" y1="121.8000" x2="491.2000" y2="435.8000" stroke="#205d9c" stroke-width="1.7" stroke-linecap="round" /><line x1="497.2000" y1="121.8000" x2="485.2000" y2="121.8000" stroke="#205d9c" stroke-width="1.65" stroke-linecap="round" /><line x1="497.2000" y1="435.8000" x2="485.2000" y2="435.8000" stroke="#205d9c" stroke-width="1.65" stroke-linecap="round" /><text x="542.2000" y="287.8000" font-size="30" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#205d9c" text-anchor="middle">20 cm</text></svg>
