<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 715 530" width="715" height="530" role="img" aria-labelledby="title desc"><title id="title">꼭짓점이 가질 높이와 직선이 요구하는 높이</title><desc id="desc">각 k에서 파란 포물선은 주어진 꼭짓점 높이를, 주황 직선은 조건에서 필요한 높이를 나타낸다. 두 그래프의 교점에서 두 높이가 같다.</desc><rect width="715" height="530" fill="white" /><line x1="61.0000" y1="424.9775" x2="653.0000" y2="424.9775" stroke="#586574" stroke-width="1.8" stroke-linecap="round" /><line x1="276.4880" y1="447.0000" x2="276.4880" y2="55.0000" stroke="#586574" stroke-width="1.8" stroke-linecap="round" /><text x="669.0000" y="416.9775" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#586574" text-anchor="middle">k</text><path d="M 75.2080 171.6579 Q 317.9280 580.4806 560.6480 63.8090" stroke="#205d9c" stroke-width="5.9" stroke-linecap="round" fill="none" /><line x1="79.9440" y1="424.4881" x2="650.6320" y2="70.6604" stroke="#aa5411" stroke-width="4.45" stroke-linecap="round" /><line x1="223.8658" y1="424.9775" x2="223.8658" y2="335.2563" stroke="#704895" stroke-width="1.9" stroke-linecap="round" stroke-dasharray="6 5" /><circle cx="223.8657777777778" cy="335.2563462338743" r="4.6" fill="#704895" /><line x1="513.2880" y1="424.9775" x2="513.2880" y2="155.8140" stroke="#704895" stroke-width="1.9" stroke-linecap="round" stroke-dasharray="6 5" /><circle cx="513.288" cy="155.81398252184766" r="4.6" fill="#704895" /><text x="244.0000" y="53.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#205d9c" text-anchor="middle">꼭짓점의 높이</text><text x="534.0000" y="493.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#aa5411" text-anchor="middle">직선이 요구하는 높이</text></svg>
