<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 712 513" width="712" height="513" role="img" aria-labelledby="title desc"><title id="title">같은 높이에서 두 포물선의 폭 비교</title><desc id="desc">두 포물선은 원점에서 위로 열린다. 파란 y=3x²가 좁고 초록 y=ax²가 넓다.</desc><rect width="712" height="513" fill="white" /><line x1="52.0000" y1="385.1218" x2="650.0000" y2="385.1218" stroke="#586574" stroke-width="1.65" stroke-linecap="round" /><polygon points="650.0000,385.1218 637.0000,380.1218 637.0000,390.1218" fill="#586574" /><text x="667.0000" y="377.1218" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#586574" text-anchor="middle">x</text><line x1="351.0000" y1="427.0000" x2="351.0000" y2="52.0000" stroke="#586574" stroke-width="1.65" stroke-linecap="round" /><polygon points="351.0000,52.0000 346.0000,65.0000 356.0000,65.0000" fill="#586574" /><text x="367.0000" y="58.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#586574" text-anchor="middle">y</text><circle cx="351.0" cy="385.1218274111675" r="4.6" fill="#28364b" /><text x="336.0000" y="412.1218" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">O</text><path d="M 176.4548 66.2766 Q 351.0000 703.9670 525.5452 66.2766" stroke="#205d9c" stroke-width="5.7" stroke-linecap="round" fill="none" /><path d="M 90.8033 66.2766 Q 351.0000 703.9670 611.1967 66.2766" stroke="#277339" stroke-width="5.7" stroke-linecap="round" fill="none" stroke-dasharray="13 6" /><line x1="67.0000" y1="467.0000" x2="114.0000" y2="467.0000" stroke="#205d9c" stroke-width="4.8" stroke-linecap="round" /><text x="126.0000" y="477.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#205d9c" text-anchor="start">y = 3x²</text><line x1="401.0000" y1="467.0000" x2="448.0000" y2="467.0000" stroke="#277339" stroke-width="4.8" stroke-linecap="round" stroke-dasharray="13 6" /