<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 712 513" width="712" height="513" role="img" aria-labelledby="title desc"><title id="title">포물선 꼭짓점의 위치와 열린 방향</title><desc id="desc">위로 열린 포물선의 꼭짓점은 두 축의 왼쪽 아래에 있다. 다른 눈금 숫자는 표시하지 않았다.</desc><rect width="712" height="513" fill="white" /><line x1="52.0000" y1="206.1692" x2="651.0000" y2="206.1692" stroke="#586574" stroke-width="1.65" stroke-linecap="round" /><polygon points="651.0000,206.1692 638.0000,201.1692 638.0000,211.1692" fill="#586574" /><text x="668.0000" y="198.1692" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#586574" text-anchor="middle">x</text><line x1="445.1897" y1="446.0000" x2="445.1897" y2="53.0000" stroke="#586574" stroke-width="1.65" stroke-linecap="round" /><polygon points="445.1897,53.0000 440.1897,66.0000 450.1897,66.0000" fill="#586574" /><text x="461.1897" y="59.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#586574" text-anchor="middle">y</text><circle cx="445.1897435897436" cy="206.16923076923075" r="4.6" fill="#28364b" /><text x="430.1897" y="233.1692" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">O</text><path d="M 85.7897 57.6428 Q 330.5094 748.3675 575.2291 57.6428" stroke="#205d9c" stroke-width="6.1" stroke-linecap="round" fill="none" /></svg>
