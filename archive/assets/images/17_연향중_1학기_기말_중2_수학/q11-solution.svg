<svg xmlns="http://www.w3.org/2000/svg" width="512" height="176" viewBox="0 0 512 176" role="img" aria-labelledby="visual-title visual-desc" data-composite="composite-panels-v1"><title id="visual-title">5x&lt;2(x−3)−6에서 5x&lt;2x−12이므로 3x&lt;−12에서 x&lt;−4이다. 수직선에서 −4보다 작은 모든 수가 해이고 −4는 속이 빈 점이다. 따라서 답은 ③이다.</title><desc id="visual-desc">수직선 위에 −4보다 작은 수 전체가 왼쪽으로 뻗은 구간이 있고 −4에는 속이 빈 점이 있다.</desc><g id="p1-caption" data-role="caption" data-panel="1" data-font-px="20.9"><g id="p1-p1-caption-text" transform="translate(184.104 38.8684)" data-label-kind="CAPTION" data-owner="panel-1" data-fragment-sha="sha256:98ff4ca30311e969e814560eafede69df55633bd5ae617dba8422a120cb75a52"><svg xmlns="http://www.w3.org/2000/svg" width="143.79199999999997" height="30.263199999999998" viewBox="0 0 143.79199999999997 30.263199999999998" data-outline-width="143.79199999999997" data-outline-height="30.263199999999998" id="lb-6549ce090a6210a7d62aa950affcea426d8f402c7e9809f61fa549005e552781" data-owner="panel-1" data-fact-role="GIVEN"><path d="M9.23780 9.17510L9.23780 7.96290L9.84390 7.96290L9.84390 9.17510Q9.84390 10.22010 9.36320 11.09790Q8.88250 11.97570 8.09875 12.67585Q7.31500 13.37600 6.36405 13.89850Q5.41310 14.42100 4.44125 14.76585Q3.46940 15.11070 2.63340 15.27790L2.63340 15.27790L2.31990 14.71360Q3.05140 14.58820 3.97100 14.27470Q4.89060 13.96120 5.82065 13.47005Q6.75070 12.97890 7.52400 12.33100Q8.29730 11.68310 8.76755 10.88890Q9.23780 10.09470 9.23780 9.17510L9.23780 9.17510ZM9.32140 9.17510L9.32140 7.96290L9.90660 7.96290L9.90660 9.17510Q9.90660 10.07380 10.38730 10.85755Q10.86800 11.64130 11.65175 12.28920Q12.43550 12.93710 13.35510 13.43870Q14.27470 13.94030 15.19430 14.26425Q16.11390 14.58820 16.82450 14.71360L16.82450 14.71360L16.51100 15.27790Q15.69590 15.11070 14.73450 14.75540Q13.77310 14.40010 12.81170 13.86715Q11.85030 13.33420 11.06655 12.63405Q10.28280 11.93390 9.80210 11.06655Q9.32140 10.19920 9.32140 9.17510L9.32140 9.17510ZM9.21690 25.64430L9.21690 18.35020L9.88570 1