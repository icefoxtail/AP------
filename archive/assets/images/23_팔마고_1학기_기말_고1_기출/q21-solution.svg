<text x="423.33" y="192.33" class="small">(a+c,b)</text>
<text x="264.77" y="259.03" class="label" text-anchor="start">AC</text>
<text x="269.23" y="241.17" class="label" text-anchor="start">BD</text>
<text x="526" y="98" class="sidehead">해설 핵심</text>
<text x="526" y="124" class="sidebody">AC²=(c−a)²+b²</text>
<text x="526" y="145" class="sidebody">BD²=(a+c)²+b²</text>
<text x="526" y="166" class="sidebody">AC²+BD²</text>
<text x="526" y="187" class="sidebody">=2a²+2b²+2c²</text>
<text x="526" y="208" class="sidebody">AB²=a²+b²</text>
<text x="526" y="229" class="sidebody">BC²=c²</text>
<text x="526" y="250" class="sidebody">2(AB²+BC²)</text>
<text x="526" y="271" class="sidebody">=2a²+2b²+2c²</text>
<text x="526" y="292" class="sidebody">따라서 두 식은 같다</text>
