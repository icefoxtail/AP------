<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 705 544" width="705" height="544" role="img" aria-labelledby="title desc"><title id="title">포물선의 왼쪽과 오른쪽에 놓인 사다리꼴</title><desc id="desc">위로 열린 파란 포물선 위에 사다리꼴의 네 끝점이 있다. A와 B가 낮은 가로변의 두 끝, D와 C가 높은 가로변의 두 끝이다. A는 y축의 높이 2이다.</desc><rect width="705" height="544" fill="white" /><polygon points="266.5133,386.5904 433.5381,386.5904 600.5628,185.0519 99.4886,185.0519" fill="none" /><line x1="266.5133" y1="386.5904" x2="433.5381" y2="386.5904" stroke="#25736e" stroke-width="3.6" stroke-linecap="round" /><line x1="433.5381" y1="386.5904" x2="600.5628" y2="185.0519" stroke="#25736e" stroke-width="3.6" stroke-linecap="round" /><line x1="600.5628" y1="185.0519" x2="99.4886" y2="185.0519" stroke="#25736e" stroke-width="3.6" stroke-linecap="round" /><line x1="99.4886" y1="185.0519" x2="266.5133" y2="386.5904" stroke="#25736e" stroke-width="3.6" stroke-linecap="round" /><line x1="53.0000" y1="436.9750" x2="649.0000" y2="436.9750" stroke="#4d5d72" stroke-width="1.65" stroke-linecap="round" /><polygon points="649.0000,436.9750 636.0000,431.9750 636.0000,441.9750" fill="#4d5d72" /><text x="666.0000" y="428.9750" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#4d5d72" text-anchor="middle">x</text><line x1="266.5133" y1="473.0000" x2="266.5133" y2="80.0000" stroke="#4d5d72" stroke-width="1.65" stroke-linecap="round" /><polygon points="266.5133,80.0000 261.5133,93.0000 271.5133,93.0000" fill="#4d5d72" /><text x="282.5133" y="86.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#4d5d72" text-anchor="middle">y</text><text x="245.5133" y="464.9750" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#4d5d72" text-anchor="middle">O</text><path d="M 56.8972 101.4109 Q 350.0257 722.1544 643.1541 101.4109" stroke="#205d9c" stroke-width="6.0" stroke-linecap="round" fill="none" /><circle cx="266.5133115366651