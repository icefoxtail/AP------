<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 705 544" width="705" height="544" role="img" aria-labelledby="title desc"><title id="title">원점이 꼭짓점이고 (2,2)를 지나는 포물선</title><desc id="desc">위로 열린 파란 포물선 y=f(x)는 원점을 꼭짓점으로 한다. 가로 2와 세로 2를 점선으로 이으면 곡선 위 한 점을 읽을 수 있다.</desc><rect width="705" height="544" fill="white" /><line x1="464.4547" y1="422.9466" x2="464.4547" y2="358.3615" stroke="#25736e" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="7 6" /><line x1="348.3885" y1="358.3615" x2="464.4547" y2="358.3615" stroke="#25736e" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="7 6" /><line x1="53.0000" y1="422.9466" x2="649.0000" y2="422.9466" stroke="#4d5d72" stroke-width="1.65" stroke-linecap="round" /><polygon points="649.0000,422.9466 636.0000,417.9466 636.0000,427.9466" fill="#4d5d72" /><text x="666.0000" y="414.9466" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#4d5d72" text-anchor="middle">x</text><line x1="348.3885" y1="473.0000" x2="348.3885" y2="80.0000" stroke="#4d5d72" stroke-width="1.65" stroke-linecap="round" /><polygon points="348.3885,80.0000 343.3885,93.0000 353.3885,93.0000" fill="#4d5d72" /><text x="364.3885" y="86.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#4d5d72" text-anchor="middle">y</text><text x="327.3885" y="450.9466" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#4d5d72" text-anchor="middle">O</text><path d="M 84.9182 90.1463 Q 348.3885 755.7469 611.8588 90.1463" stroke="#205d9c" stroke-width="6.0" stroke-linecap="round" fill="none" /><circle cx="464.4547224926972" cy="358.3615447822514" r="6.0" fill="white" stroke="#25736e" stroke-width="3.1" /><line x1="464.4547" y1="417.9466" x2="464.4547" y2="427.9466" stroke="#4d5d72" stroke-width="1.7" stroke-linecap="round" /><text x="464.4547" y="454.9466" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#4d5d72" text-anchor="middle">2</text><line x1="343.3885" y1="358.3615" x2="353.3885" y2="358.3615" stroke="#4d5d72" stroke-width="1.7" stroke-linecap="round" /><text x="323.3885" y="366.3615" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#4d5d72" text-anchor="middle">2</text><line x1="64.0000" y1="39.0000" x2="114.0000" y2="39.0000" stroke="#205d9c" stroke-width="5.4" stroke-linecap="round" /><text x="126.0000" y="47.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#205d9c" text-anchor="start">y = f(x)</text></svg>
