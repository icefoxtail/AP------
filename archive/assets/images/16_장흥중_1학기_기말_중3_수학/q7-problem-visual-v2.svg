<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 635 538" width="635" height="538" role="img" aria-labelledby="title desc"><title id="title">사진 가장자리를 두른 폭이 일정한 틀</title><desc id="desc">안쪽 사진은 가로 10 cm, 세로 16 cm인 직사각형이다. 둘레를 둘러싼 주황색 사진틀의 폭은 네 변에서 모두 같다.</desc><rect width="635" height="538" fill="white" /><rect x="177.18" y="60.18" width="269.64" height="395.64" fill="#efd5b6" stroke="#aa5411" stroke-width="4.6" /><rect x="207" y="90" width="210" height="336" fill="#edf4fc" stroke="#205d9c" stroke-width="3.8" /><circle cx="241" cy="270" r="9" fill="#bad4c1" /><circle cx="293" cy="291" r="12" fill="#bad4c1" /><circle cx="356" cy="255" r="15" fill="#bad4c1" /><polygon points="207.0000,384.0000 267.0000,302.0000 312.0000,361.0000 363.0000,317.0000 417.0000,383.0000 417.0000,426.0000 207.0000,426.0000" fill="#d7e7d7" /><line x1="207.0000" y1="36.0000" x2="417.0000" y2="36.0000" stroke="#205d9c" stroke-width="1.7" stroke-linecap="round" /><line x1="207.0000" y1="31.0000" x2="207.0000" y2="41.0000" stroke="#205d9c" stroke-width="1.7" stroke-linecap="round" /><line x1="417.0000" y1="31.0000" x2="417.0000" y2="41.0000" stroke="#205d9c" stroke-width="1.7" stroke-linecap="round" /><text x="312.0000" y="25.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#205d9c" text-anchor="middle">10 cm</text><line x1="143.0000" y1="90.0000" x2="143.0000" y2="426.0000" stroke="#205d9c" stroke-width="1.7" stroke-linecap="round" /><line x1="137.0000" y1="90.0000" x2="149.0000" y2="90.0000" stroke="#205d9c" stroke-width="1.7" stroke-linecap="round" /><line x1="137.0000" y1="426.0000" x2="149.0000" y2="426.0000" stroke="#205d9c" stroke-width="1.7" stroke-linecap="round" /><text x="100.0000" y="266.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#205d9c" text-anchor="middle">16 cm</text></svg>
