<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 705 544" width="705" height="544" role="img" aria-labelledby="title desc"><title id="title">두 포물선의 같은 높이에서 읽는 폭</title><desc id="desc">파란 y=2x²는 주황 점선 y=ax²보다 좁고 두 그래프 모두 위로 열린다. 두 꼭짓점은 원점이다.</desc><rect width="705" height="544" fill="white" /><line x1="53.0000" y1="406.7221" x2="649.0000" y2="406.7221" stroke="#4d5d72" stroke-width="1.65" stroke-linecap="round" /><polygon points="649.0000,406.7221 636.0000,401.7221 636.0000,411.7221" fill="#4d5d72" /><text x="666.0000" y="398.7221" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#4d5d72" text-anchor="middle">x</text><line x1="346.5522" y1="473.0000" x2="346.5522" y2="80.0000" stroke="#4d5d72" stroke-width="1.65" stroke-linecap="round" /><polygon points="346.5522,80.0000 341.5522,93.0000 351.5522,93.0000" fill="#4d5d72" /><text x="362.5522" y="86.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#4d5d72" text-anchor="middle">y</text><text x="325.5522" y="434.7221" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#4d5d72" text-anchor="middle">O</text><path d="M 192.4773 126.6746 Q 346.5522 686.7696 500.6272 126.6746" stroke="#205d9c" stroke-width="6.0" stroke-linecap="round" fill="none" /><path d="M 91.5255 126.6746 Q 346.5522 686.7696 601.5789 126.6746" stroke="#aa5411" stroke-width="6.0" stroke-linecap="round" fill="none" stroke-dasharray="15 7" /><line x1="64.0000" y1="39.0000" x2="114.0000" y2="39.0000" stroke="#205d9c" stroke-width="5.4" stroke-linecap="round" /><text x="126.0000" y="47.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#205d9c" text-anchor="start">y = 2x²</text><line x1="379.0000" y1="39.0000" x2="429.0000" y2="39.0000" stroke="#aa5411" stroke-width="5.4" stroke-linecap="round" stroke-dasharray="15 7" /><text x="441.0000" y="47.0000" font-size="28" font-family