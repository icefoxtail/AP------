<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 559 544" width="559" height="544" role="img" aria-labelledby="title desc"><title id="title">이등변삼각형의 밑각을 나눈 선</title><desc id="desc">왼쪽 B와 오른쪽 C 위에 꼭짓점 A가 있다. 두 옆변에는 같은 눈금이 있고 AB는 10 cm이다. C의 각은 72도이며, B의 각을 반으로 나눈 선은 AC 위 D와 만난다.</desc><rect width="559" height="544" fill="white" /><polygon points="278.0000,75.8711 152.5391,462.0000 403.4609,462.0000" fill="none" /><polygon points="152.5391,462.0000 355.5391,314.5119 403.4609,462.0000" fill="none" /><line x1="278.0000" y1="75.8711" x2="152.5391" y2="462.0000" stroke="#205d9c" stroke-width="4.2" stroke-linecap="round" /><line x1="278.0000" y1="75.8711" x2="403.4609" y2="462.0000" stroke="#205d9c" stroke-width="4.2" stroke-linecap="round" /><line x1="152.5391" y1="462.0000" x2="403.4609" y2="462.0000" stroke="#4d5d72" stroke-width="4.2" stroke-linecap="round" /><line x1="152.5391" y1="462.0000" x2="355.5391" y2="314.5119" stroke="#25736e" stroke-width="4.2" stroke-linecap="round" /><line x1="209.8482" y1="262.9682" x2="223.1630" y2="267.2944" stroke="#205d9c" stroke-width="2.6" stroke-linecap="round" /><line x1="207.3761" y1="270.5766" x2="220.6909" y2="274.9029" stroke="#205d9c" stroke-width="2.6" stroke-linecap="round" /><line x1="332.8370" y1="267.2944" x2="346.1518" y2="262.9682" stroke="#205d9c" stroke-width="2.6" stroke-linecap="round" /><line x1="335.3091" y1="274.9029" x2="348.6239" y2="270.5766" stroke="#205d9c" stroke-width="2.6" stroke-linecap="round" /><text x="111.0000" y="237.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#205d9c" text-anchor="middle">10 cm</text><line x1="219.0000" y1="179.8711" x2="133.5391" y2="374.0000" stroke="#205d9c" stroke-width="1.6" stroke-linecap="round" /><path d="M 365.46 462.00 A 38 38 0 0 1 391.72 425.86" stroke="#aa5411" stroke-width="2.3" fill="none" /><text x="340.4609" y="433.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600"