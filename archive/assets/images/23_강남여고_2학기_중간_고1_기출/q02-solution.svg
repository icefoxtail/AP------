<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" role="img" aria-labelledby="title desc" width="760" height="320"><title id="title">문항 2 해설: 합집합 수치 Venn diagram</title><desc id="desc">전체 40, A 18, 교집합 9, 바깥 12를 배치하고 B를 미지수로 둔 그림</desc><style>text{font-family:"Noto Sans KR",Arial,sans-serif;fill:#172033}.m{fill:#56657a}</style><rect width="760" height="320" rx="18" fill="#f8fafc"/><text x="28" y="38" font-size="22" font-weight="700">바깥 영역과 겹친 영역으로 B를 복원</text><rect x="28" y="78" width="430" height="180" rx="14" fill="#fff" stroke="#cbd5e1"/><circle cx="220" cy="168" r="68" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><circle cx="300" cy="168" r="68" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text x="170" y="128" font-size="17">A 18</text><text x="318" y="128" font-size="17">B ?</text><text x="260" y="180" text-anchor="middle" font-size="22" fill="#7c3aed">9</text><text x="180" y="180" text-anchor="middle" font-size="18">9</text><text x="350" y="180" text-anchor="middle" font-size="18">?</text><text x="52" y="236" font-size="16" fill="#b91c1c">바깥 12</text><rect x="490" y="90" width="238" height="132" rx="14" fill="#fff" stroke="#cbd5e1"/><text x="514" y="126" font-size="17">n(A∪B)=40−12</text><text x="514" y="162" font-size="17">18+n(B)−9</text><text x="514" y="198" font-size="17">= n(A∪B)</text><text x="28" y="294" class="m" font-size="14">겹친 9명은 두 집합을 더할 때 중복되므로 한 번 뺀다.</text></svg>
