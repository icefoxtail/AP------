<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 733" width="740" height="733" role="img" aria-labelledby="title desc"><title id="title">일곱 다항식이 적힌 원형 과녁</title><desc id="desc">원의 가운데 영역은 −3x+y이다. 바깥쪽의 여섯 영역에는 위 오른쪽부터 시계 방향으로 4x−y, 2x+8y, 3x+4y, −2x+3y, 2x−3y, 5x−6y가 적혀 있다. 화살은 4x−y가 적힌 칸을 가리킨다.</desc><rect width="740" height="733" fill="white" /><circle cx="370" cy="397" r="275" fill="white" stroke="#202020" stroke-width="5" /><circle cx="370" cy="397" r="86" fill="none" stroke="#202020" stroke-width="5" /><line x1="370.0000" y1="311.0000" x2="370.0000" y2="122.0000" stroke="#202020" stroke-width="3.8" stroke-linecap="round" /><line x1="444.4782" y1="354.0000" x2="608.1570" y2="259.5000" stroke="#202020" stroke-width="3.8" stroke-linecap="round" /><line x1="444.4782" y1="440.0000" x2="608.1570" y2="534.5000" stroke="#202020" stroke-width="3.8" stroke-linecap="round" /><line x1="370.0000" y1="483.0000" x2="370.0000" y2="672.0000" stroke="#202020" stroke-width="3.8" stroke-linecap="round" /><line x1="295.5218" y1="440.0000" x2="131.8430" y2="534.5000" stroke="#202020" stroke-width="3.8" stroke-linecap="round" /><line x1="295.5218" y1="354.0000" x2="131.8430" y2="259.5000" stroke="#202020" stroke-width="3.8" stroke-linecap="round" /><text x="454.5000" y="262.6417" font-size="36" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#a34c1f" text-anchor="middle">4x − y</text><text x="539.0000" y="409.0000" font-size="36" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#202020" text-anchor="middle">2x + 8y</text><text x="454.5000" y="555.3583" font-size="36" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#202020" text-anchor="middle">3x + 4y</text><text x="285.5000" y="555.3583" font-size="36" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#202020" text-anchor="middle">−2x + 3y</text><text x="201.0000" y="409.0000" font-size="36" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#202020" text-anchor="middle">2x − 3y</text><text x="285.5000" y="262.6417" font-size="36" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#202020" text-anchor="middle">5x − 6y</text><text x="370.0000" y="409.0000" font-size="37" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#202020" text-anchor="middle">−3x + y</text><line x1="588.0000" y1="63.0000" x2="500.5939" y2="223.6961" stroke="#a34c1f" stroke-width="5" stroke-linecap="round" /><polygon points="500.5939,223.6961 503.6003,201.4259 517.6556,209.0709" fill="#a34c1f" /></svg>
