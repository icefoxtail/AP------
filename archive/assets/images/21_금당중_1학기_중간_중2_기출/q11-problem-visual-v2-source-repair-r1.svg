<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 684 607" width="684" height="607" role="img" aria-labelledby="title desc"><title id="title">직사각형 안의 두 색칠한 삼각형</title><desc id="desc">직사각형의 가로는 6x이고 세로는 7y이다. 왼쪽 위 꼭짓점에서 오른쪽 변과 아래쪽 변으로 각각 선을 그었다. 오른쪽 아래의 남은 세로는 3x, 아래쪽 오른편 길이는 2y이다. 오른쪽 위와 왼쪽 아래의 두 삼각형이 색칠되어 있다.</desc><rect width="684" height="607" fill="white" /><polygon points="178.0000,103.0000 486.0000,103.0000 486.0000,300.0000" fill="#e4f0ea" /><polygon points="178.0000,103.0000 178.0000,499.0000 367.0000,499.0000" fill="#e4f0ea" /><line x1="178.0000" y1="103.0000" x2="178.0000" y2="499.0000" stroke="#202020" stroke-width="5.7" stroke-linecap="round" /><line x1="178.0000" y1="499.0000" x2="486.0000" y2="499.0000" stroke="#202020" stroke-width="5.7" stroke-linecap="round" /><line x1="486.0000" y1="499.0000" x2="486.0000" y2="103.0000" stroke="#202020" stroke-width="5.7" stroke-linecap="round" /><line x1="486.0000" y1="103.0000" x2="178.0000" y2="103.0000" stroke="#202020" stroke-width="5.7" stroke-linecap="round" /><line x1="178.0000" y1="103.0000" x2="486.0000" y2="300.0000" stroke="#202020" stroke-width="5.7" stroke-linecap="round" /><line x1="178.0000" y1="103.0000" x2="367.0000" y2="499.0000" stroke="#202020" stroke-width="5.7" stroke-linecap="round" /><line x1="486.0000" y1="300.0000" x2="367.0000" y2="499.0000" stroke="#202020" stroke-width="5.7" stroke-linecap="round" /><line x1="178.0000" y1="64.0000" x2="486.0000" y2="64.0000" stroke="#202020" stroke-width="2" stroke-linecap="round" /><line x1="178.0000" y1="56.0000" x2="178.0000" y2="72.0000" stroke="#202020" stroke-width="2" stroke-linecap="round" /><line x1="486.0000" y1="56.0000" x2="486.0000" y2="72.0000" stroke="#202020" stroke-width="2" stroke-linecap="round" /><text x="332.0000" y="46.0000" font-size="35" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#202020" text-anchor="middle">6x</text><line x1="134.0000" y1="103.0000" x2="134.0000" y2="499.0000" stroke="#202020" stroke-width="2" stroke-linecap="round" /><line x1="126.0000" y1="103.0000" x2="142.0000" y2="103.0000" stroke="#202020" stroke-width="2" stroke-linecap="round" /><line x1="126.0000" y1="499.0000" x2="142.0000" y2="499.0000" stroke="#202020" stroke-width="2" stroke-linecap="round" /><text x="101.0000" y="312.0000" font-size="35" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#202020" text-anchor="middle">7y</text><line x1="528.0000" y1="300.0000" x2="528.0000" y2="499.0000" stroke="#202020" stroke-width="2" stroke-linecap="round" /><line x1="520.0000" y1="300.0000" x2="536.0000" y2="300.0000" stroke="#202020" stroke-width="2" stroke-linecap="round" /><line x1="520.0000" y1="499.0000" x2="536.0000" y2="499.0000" stroke="#202020" stroke-width="2" stroke-linecap="round" /><text x="560.0000" y="410.5000" font-size="35" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#202020" text-anchor="middle">3x</text><line x1="367.0000" y1="539.0000" x2="486.0000" y2="539.0000" stroke="#202020" stroke-width="2" stroke-linecap="round" /><line x1="367.0000" y1="531.0000" x2="367.0000" y2="547.0000" stroke="#202020" stroke-width="2" stroke-linecap="round" /><line x1="486.0000" y1="531.0000" x2="486.0000" y2="547.0000" stroke="#202020" stroke-width="2" stroke-linecap="round" /><text x="426.5000" y="582.0000" font-size="35" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#202020" text-anchor="middle">2y</text></svg>
