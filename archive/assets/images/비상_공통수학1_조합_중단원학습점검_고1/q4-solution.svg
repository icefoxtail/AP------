<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 690 340" width="690" height="340" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">폭 10m를 1m씩 10칸으로 나누면 칸 사이 경계는 9곳이다. 이 중 7곳을 여덟 단의 경계로 골라 9C7=36가지가 된다. 점선은 가능한 경계 위치다.</title><desc id="visual-desc">전체 폭 10m의 긴 직사각형 막대가 1m짜리 열 칸으로 나뉘었다. 내부의 아홉 곳마다 세로 점선이 있어 그중 일곱 곳을 선택하면 여덟 개의 양의 정수 폭으로 구분됨을 나타낸다. 실제 선택된 경계는 지정하지 않았다.</desc><rect width="690" height="340" fill="#fff"/><g data-layer="30"><line id="bottom" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="65.535714286" y1="197.946428571" x2="624.464285714" y2="197.946428571"/></g><g data-layer="30"><line id="top" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="65.535714286" y1="142.053571429" x2="624.464285714" y2="142.053571429"/></g><g data-layer="30"><line id="left" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="65.535714286" y1="197.946428571" x2="65.535714286" y2="142.053571429"/></g><g data-layer="30"><line id="right" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="624.464285714" y1="197.946428571" x2="624.464285714" y2="142.053571429"/></g><g data-layer="30"><line id="c1" data-role="line" stroke="#111" stroke-width="1.6" fill="none" stroke-dasharray="6 4" x1="121.428571429" y1="197.946428571" x2="121.428571429" y2="142.053571429"/></g><g data-layer="30"><line id