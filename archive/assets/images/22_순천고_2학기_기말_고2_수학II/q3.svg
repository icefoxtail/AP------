<svg xmlns="http://www.w3.org/2000/svg" width="460" height="250" viewBox="0 0 460 250" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="t3 d3">
<title id="t3">점 P의 속도 v(t)의 그래프</title>
<desc id="d3">0≤t≤20에서 v(t)는 양수로 출발해 축에 한 번 닿았다가 다시 양수가 되고, 이어서 t축을 +에서 −, −에서 +, +에서 −로 세 번 지난다. t=20 부근에서는 t축에 닿았다가 다시 음수가 된다.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<rect width="460" height="250" fill="#fff"/>
<g stroke="#222" stroke-width="1.4" fill="none">
<line x1="50" y1="226" x2="50" y2="14" marker-end="url(#ar)"/>
<line x1="24" y1="120" x2="440" y2="120" marker-end="url(#ar)"/>
</g>
<path d="M50,72 C68,72 86,120 104,120 C119,120 124,92 140,92 C167,92 194,166 221,166 C248,166 275,76 302,76 C316,76 324,150 338,150 C350,150 360,120 374,120 C388,120 396,150 410,150" fill="none" stroke="#1a56c8" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<g stroke="#222" stroke-width="1.2"><line x1="410" y1="115" x2="410" y2="125"/></g>
<g font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" fill="#222">
<text x="38" y="136" text-anchor="end">O</text>
<text x="410" y="141" text-anchor="middle">20</text>
<text x="446" y="140" font-style="italic">t</text>
<text x="58" y="20" font-style="italic">v</text>
<text x="300" y="30" font-style="italic" font-size="16">y = v(t)</text>
</g>
</svg>
