<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" width="780" height="420" viewBox="0 0 780 420" preserveAspectRatio="xMidYMid meet" role="img" data-visual-case="hs-r12-008" data-fact-hash="efa4f85e05b89d38e694236d3d6511b2821b36f2c560b5ecde2d67b151caac23" data-visual-provenance="candidate_builder_python_r12"><title>조건별 판정과 핵심 근거</title><desc>조건별 판정과 핵심 근거</desc><style>.bg{fill:#fff}.head{font-family:'Noto Sans KR','Malgun Gothic',sans-serif;font-size:15px;fill:#111}.cell{font-family:'Noto Sans KR','Malgun Gothic',sans-serif;font-size:13px;fill:#111}.true{fill:#eef5e9;stroke:#536d3f}.false{fill:#fff1f1;stroke:#a55}.box{stroke-width:1}.annotation{font-family:'Noto Sans KR','Malgun Gothic',sans-serif;font-size:13px;fill:#111}</style>
<rect width="780" height="420" class="bg"/>
<text x="48" y="32" class="head">조건별 판정과 핵심 근거</text>
<text x="62" y="62" class="cell">판정</text><text x="145" y="62" class="cell">판정 결과</text><text x="300" y="62" class="cell">근거 구조</text>
<rect x="48" y="78" width="684" height="50" rx="6" class="box true"/>
<text x="62" y="108" class="cell">p≤0</text><text x="145" y="108" class="cell">q=−p²+3</text><text x="300" y="108" class="cell">최솟값은 x=0</text>
<rect x="48" y="140" width="684" height="50" rx="6" class="box true"/>
<text x="62" y="170" class="cell">0≤p≤1</text><text x="145" y="170" class="cell">q=3</text><text x="300" y="170" class="cell">꼭짓점 x=p가 구간 안</text>
<rect x="48" y="202" width="684" height="50" rx="6" class="box true"/>
<text x="62" y="232" class="cell">p≥1</text><text x="145" y="232" class="cell">q=3−(p−1)²</text><text x="300" y="232" class="cell">최솟값은 x=1</text>
<text x="48" y="390" class="annotation">항상 성립: ㄱ, ㄴ</text>
<text x="48" y="390" class="annotation">p+q의 최댓값=17/4</text>
</svg>
