<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" width="600" height="420" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">출발 후 t초에 사람까지의 거리는 1.5t이고 그림자 끝까지의 거리는 x이다. 높이 5와 2의 닮음비에서 5:x=2:(x-1.5t)이므로 3x=5 곱하기 1.5t, 즉 x=2.5t이다. 시간에 대해 미분하면 그림자 끝의 속도는 2.5 m/s이다. 따라서 답은 ⑤이다.</title><desc id="visual-desc">높이 5인 가로등과 키 2인 사람이 지면에 서 있고, 사람까지의 거리 1.5t와 사람에서 그림자 끝까지 x-1.5t가 표시되어 있다. 가로등 꼭대기에서 사람 머리를 지나 그림자 끝으로 햇빛 직선이 이어진다.</desc><rect width="600" height="420" fill="#fff"/><g data-layer="30"><line id="sAB" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="141.071428571" y1="368.928571429" x2="141.071428571" y2="51.071428571"/></g><g data-layer="30"><line id="sDE" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="331.785714286" y1="368.928571429" x2="331.785714286" y2="241.785714286"/></g><g data-layer="40"><line id="ground" data-role="line" stroke="#111" stroke-width="2.05" fill="none" x1="122" y1="368.928571429" x2="478" y2="368.928571429"/></g><g data-layer="40"><line id="ray" data-role="line" stroke="#111" stroke-width="2.05" fill="none" x1="122" y1="32" x2="478" y2="388"/></g><g data-layer="45"><line id="sAD" data-role="line" stroke="#111" stroke-width="3.2" fill="none" x1="141.071428571" y1="368.928571429" x2="331.785714286" y2="368.928571429"/></g><g data-layer="45"><line id="sDC" data-role="line" stroke="#111" stroke-width="3.2" fill="none" x1="331.785714286" y1="368.928571429" x2="458.928571429" y2="368.928571429"/></g><g data-layer="45"><line id="sBC" data-role="line" stroke="#111" stroke-width="3.2" fill="none" x1="141.071428571" y1="51.071428571" x2="458.928571429" y2="368.928571429"/></g><g data-layer="60"><polyline id="rA" data-role="indicator" stroke="#111" stroke-width="0.8" fill="none" points="141.071428571,358.928571429 151.071428571,358.928571429 151.071428571,368.928571429"/></g><g data-layer="60"><polyline id="rD" data-role="indicator" stroke="#111" stroke-width="0.8" fill="none" points="331.785714286,358.928571429 341.785714286,358.928571429 341.785714286,368.928571429"/></g><g data-layer="85"><line id="lDC-owner-leader" data-role="leader" data-owner-label="lDC" data-owner="sDC" x1="392.814285714" y1="368.928571429" x2="359.896340714" y2="378.914371429" stroke="#666" stroke-width="0.8" fill="none"/></g><g data-layer="90"><g id="lAB" data-label-kind="EQUATION_LABEL" data-priority="1" data-font-px="26.7" data-owner="sAB" data-fragment-sha="sha256:d91c51cf18d9996e15897cc009491d36dc54128391a7486ceb05ec116d80eabb" transform="translate(149.071428571 183.6304)"><svg xmlns="http://www.w3.org/2000/svg" width="13.35" height="18.3696" viewBox="0 0 13.35 18.3696" data-outline-width="13.35" data-outline-height="18.3696" id="lb-b0d139fd1bf3da44ed70b2bba3c3b917b30a4d40fa863295d9d3df99b4c616e0" data-owner="sAB" data-fact-role="GIVEN"><g data-outline-units-per-em="1000" transform="translate(0 17.7822) scale(0.026699999999999998)"><g stroke="currentColor" fill="currentColor" stroke-width="30" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mn"><path data-c="35" d="M164 157Q164 133 148 117T109 101H102Q148 22 224 22Q294 22 326 82Q345 115 345 210Q345 313 318 349Q292 382 260 382H254Q176 382 136 314Q132 307 129 306T114 304Q97 304 95 310Q93 314 93 485V614Q93 664 98 664Q100 666 102 666Q103 666 123 658T178 642T253 634Q324 634 389 662Q397 666 402 666Q4