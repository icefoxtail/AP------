<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 420" width="460" height="420" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">풀이에서 θ=3π/4이므로 2θ=3π/2의 동경은 아래쪽, 6θ=9π/2의 동경은 위쪽으로 향해 서로 반대 방향이다.</title><desc id="visual-desc">원점에서 세로축 아래로 뻗는 2θ 동경과 위로 뻗는 6θ 동경이 한 직선 위에서 반대 방향을 나타낸다.</desc><rect width="460" height="420" fill="#fff"/><g data-layer="30"><line id="sX" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="71.071428571" y1="210" x2="388.928571429" y2="210"/></g><g data-layer="30"><line id="sOQ" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="230" y1="210" x2="230" y2="368.928571429"/></g><g data-layer="30"><line id="sOR" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="230" y1="210" x2="230" y2="51.071428571"/></g><g data-layer="62"><polygon id="sOQ-arrow-end" data-role="indicator" stroke="#111" stroke-width="0.8" fill="#111" data-mark="arrow" data-mark-id="sOQ" data-mark-end="END" points="230,368.928571429 226.4,358.928571429 233.6,358.928571429"/></g><g data-layer="62"><polygon id="sOR-arrow-end" data-role="indicator" stroke="#111" stroke-width="0.8" fill="#111" data-mark="arrow" data-mark-id="sOR" data-mark-end="END" points="230,51.071428571 233.6,61.071428571 226.4,61.071428571"/></g><g data-layer="70"><circle id="O" data-role="point" stroke="#111" stroke-width="0.8" fill