<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 480" width="560" height="480" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">원 O에서 현과, 중심에서 그 현에 내린 수선, 그리고 중심에서 현의 한 끝까지 그은 반지름을 나타낸 그림이다. 현의 길이는 12 cm, 중심에서 현까지의 거리는 8 cm이고, 반지름의 길이는 x로 표시되어 있다.</title><desc id="visual-desc">중심이 O인 원 안에 현이 있고, 중심에서 현에 내린 수선이 수직으로 만난다. 현의 길이는 12 cm, 수선의 길이는 8 cm이며, 중심에서 현의 한 끝까지의 반지름이 x로 표시되어 있다.</desc><rect width="560" height="480" fill="#fff"/><g data-layer="30"><line id="chord" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="172.413793103" y1="383.448275862" x2="387.586206897" y2="383.448275862"/></g><g data-layer="30"><line id="dist" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="280" y1="240" x2="280" y2="383.448275862"/></g><g data-layer="30"><line id="rad" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="280" y1="240" x2="387.586206897" y2="383.448275862"/></g><g data-layer="40"><circle id="k" data-role="circle" stroke="#111" stroke-width="2.05" fill="none" cx="280" cy="240" r="179.310344828"/></g><g data-layer="60"><polyline id="rM" data-role="indicator" stroke="#111" stroke-width="0.8" fill="none" points="270,383.448275862 270,373.448275862 280,373.448275862"/></g><g data-layer="70"><circle id="O" data-role="point" stroke="#111" stroke-width="0.8" fill="#111" cx="280" cy="240" r="3.2"/></g><g data-layer="85"><line id="lChord-owner-leader" data-role="leader" data-owner-label="lChord" data-owner="chord" x1="236.965517241" y1="383.448275862" x2="236.965517241" y2="363.448275862" stroke="#666" stroke-width="0.8" fill="none"/></g><g data-layer="85"><line id="lRad-owner-leader" data-role="leader" data-owner-label="lRad" data-owner="rad" x1="333.793103448" y1="311.724137931" x2="368.916949976" y2="291.724137931" stroke="#666" stroke-width="0.8" fill="none"/></g><g data-layer="90"><g id="O-name" data-label-kind="POINT_NAME" data-priority="1" data-font-px="25" data-owner="O" data-fragment-sha="sha256:ac5d7039ce7b405b8f80a2fc0161be44be91359c024b6c6305d8ac15ce202f62" transform="translate(270.4625 209.85)"><svg xmlns="http://www.w3.org/2000/svg" width="19.075" height="18.15" viewBox="0 0 19.075 18.15" data-outline-width="19.075" data-outline-height="18.15" id="lb-bfc56f65ef68e022f35b275d418bcedef2990fcb8b80e3564291098bd8947b25" data-owner="O" data-fact-role="GIVEN"><g data-outline-units-per-em="1000" transform="translate(0 17.6) scale(0.025)"><g stroke="currentColor" fill="currentColor" stroke-width="30" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mi"><path data-c="1D442" d="M740 435Q740 320 676 213T511 42T304 -22Q207 -22 138 35T51 201Q50 209 50 244Q50 346 98 438T227 601Q351 704 476 704Q514 704 524 703Q621 689 680 617T740 435ZM637 476Q637 565 591 615T476 665Q396 665 322 605Q242 542 200 428T157 216Q157 126 200 73T314 19Q404 19 485 98T608 313Q637 408 637 476Z"></path></g></g></g></g></svg></g></g><g data-layer="90"><g id="lChord" data-label-kind="EQUATION_LABEL" data-priority="1" data-font-px="25" data-owner="chord" data-fragment-sha="sha256:ca5aec78636c0e65328d911394ad9cf3c00d6a9391e063d17376e7ff7c4e333f" data-tex="12\mathrm{cm}" transform="translate(208.503017241 346.523275862)"><svg xmlns="http://www.w3.org/2000/svg" width="56.925" height="16.925" viewBox="0 0 56.925 16.925" data-outline-width="56.925" data-outline-height="16.925" id=