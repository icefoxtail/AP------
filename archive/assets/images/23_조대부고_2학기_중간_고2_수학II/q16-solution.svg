<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc" data-scale-policy="SOLUTION_GRAPH">
<title id="title">2023 조대부고 16번 곱함수 해설</title><desc id="desc">f와 g의 좌우 값을 곱해 h의 극한과 미분가능성을 판단하는 그래프</desc>
<rect width="640" height="360" fill="white"/><g stroke="#111" fill="none" stroke-linecap="round" stroke-linejoin="round"><line x1="38" y1="178" x2="300" y2="178" stroke-width="1.2"/><line x1="168" y1="320" x2="168" y2="28" stroke-width="1.2"/><line x1="340" y1="178" x2="602" y2="178" stroke-width="1.2"/><line x1="470" y1="320" x2="470" y2="28" stroke-width="1.2"/><polyline points="45,250 105,178 168,250 230,178 292,105" stroke="#333" stroke-width="2.2"/><polyline points="350,90 405,178 470,250 535,178 595,105" stroke="#333" stroke-width="2.2"/><circle cx="168" cy="178" r="5" fill="white" stroke="#d33" stroke-width="2"/><circle cx="168" cy="250" r="5" fill="#1b6ca8" stroke="none"/><circle cx="470" cy="250" r="5" fill="#1b6ca8" stroke="none"/><line x1="168" y1="250" x2="168" y2="178" stroke="#1b6ca8" stroke-width="1" stroke-dasharray="4 4"/></g><g font-family="Noto Sans KR, Pretendard, Malgun Gothic, sans-serif" fill="#111" font-size="14"><text x="130" y="48">y=f(x)</text><text x="430" y="48">y=g(x)</text><text x="148" y="338">x=0</text><text x="450" y="338">x=1</text><text x="42" y="95">h→0</text><text x="192" y="300" fill="#1b6ca8">h 왼쪽: −x²</text><text x="492" y="300" fill="#1b6ca8">x=1− : 0　x=1+ : 1</text><text x="250" y="345">좌미분계수 0, 우미분계수 1</text></g></svg>
