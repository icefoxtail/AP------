<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc" data-scale-policy="GEOMETRY_HYBRID">
<title id="title">2023 조대부고 23번 좌표기하 해설</title><desc id="desc">A, B의 중점 C와 AB에 수직인 CD를 표시한 좌표도</desc>
<rect width="640" height="420" fill="white"/><g stroke="#111" fill="none" stroke-linecap="round" stroke-linejoin="round"><line x1="55" y1="356" x2="590" y2="356" stroke-width="1.4"/><line x1="110" y1="390" x2="110" y2="28" stroke-width="1.4"/><line x1="470" y1="390" x2="470" y2="45" stroke="#555" stroke-width="1.2" stroke-dasharray="5 4"/><line x1="110" y1="356" x2="470" y2="72" stroke="#333" stroke-width="2.2"/><line x1="290" y1="214" x2="470" y2="356" stroke="#333" stroke-width="2.2"/><line x1="290" y1="214" x2="470" y2="166" stroke="#1b6ca8" stroke-width="2.2"/><path d="M302 224l9-12 12 9" stroke="#1b6ca8" stroke-width="1.2"/><circle cx="290" cy="214" r="5" fill="#d33" stroke="none"/><circle cx="470" cy="356" r="5" fill="#111" stroke="none"/><circle cx="470" cy="166" r="5" fill="#1b6ca8" stroke="none"/><circle cx="110" cy="356" r="4" fill="#111" stroke="none"/></g><g font-family="Noto Sans KR, Pretendard, Malgun Gothic, sans-serif" fill="#111" font-size="14"><text x="575" y="348">x</text><text x="120" y="40">y</text><text x="278" y="205">C</text><text x="478" y="365">B</text><text x="478" y="160">D</text><text x="293" y="95">A</text><text x="405" y="110">x=2t</text><text x="130" y="78">y=√3x</text><text x="350" y="200" fill="#1b6ca8">CD ⟂ AB</text><text x="350" y="235" fill="#1b6ca8">Δx=t/2,　Δy=t/(2√3)</text><text x="300" y="395" fill="#1b6ca8">CD=t/√3</text></g></svg>
