<svg xmlns="http://www.w3.org/2000/svg" width="512" height="176" viewBox="0 0 512 176" role="img" aria-labelledby="visual-title visual-desc" data-composite="composite-panels-v1"><title id="visual-title">f가 일대일이므로 삼차함수 f는 모든 실수에서 증가해야 한다. f′(x)=6x²+2ax+(2a+1)의 판별식 D=4(a²-12a-6)이 0 이하이면 되고, 6-√42≤a≤6+√42이다. 6-√42는 -1과 0 사이, 6+√42는 12와 13 사이이므로 정수 a는 0부터 12까지의 13개이다. 따라서 답은 13개이다.</title><desc id="visual-desc">수직선에 6-√42와 6+√42를 양 끝으로 하는 닫힌구간이 굵게 표시되어 있다.</desc><g id="p1-caption" data-role="caption" data-panel="1" data-font-px="20.9"><g id="p1-p1-caption-text" transform="translate(219.2578 38.8684)" data-label-kind="CAPTION" data-owner="panel-1" data-fragment-sha="sha256:7caabdf7a21d5e7bdaaeac09137d2b3bed06d66f53e82d68ee3a0822ac026a22"><svg xmlns="http://www.w3.org/2000/svg" width="73.4844" height="30.263199999999998" viewBox="0 0 73.4844 30.263199999999998" data-outline-width="73.4844" data-outline-height="30.263199999999998" id="lb-caa55d0f3f4b0e2c6a67245b06e4ad753ef2478387495d3fb28da0201500d11f" data-owner="panel-1" data-fact-role="GIVEN"><path d="M4.55620 24.51570L4.55620 24.51570Q3.69930 24.51570 2.97825 24.20220Q2.25720 23.88870 1.81830 23.23035Q1.37940 22.57200 1.37940 21.52700L1.37940 21.52700Q1.37940 19.68780 3.11410 18.73685Q4.84880 17.78590 8.56900 17.36790L8.56900 17.36790Q8.61080 16.46920 8.41225 15.62275Q8.21370 14.77630 7.62850 14.21200Q7.04330 13.64770 5.89380 13.64770L5.89380 13.64770Q4.72340 13.64770 3.78290 14.10750Q2.84240 14.56730 2.29900 14.98530L2.29900 14.98530L1.92280 14.37920Q2.27810 14.12840 2.87375 13.79400Q3.46940 13.45960 4.25315 13.20880Q5.03690 12.95800 5.93560 12.95800L5.93560 12.95800Q7.23140 12.95800 7.97335 13.53275Q8.71530 14.10750 9.01835 15.04800Q9.32140 15.98850 9.32140 17.11710L9.32140 17.11710L9.32140 24.24400L8.69440 24.24400L8.58990 22.78100L8.52720 22.78100Q7.69120 23.47070 6.67755 23.99320Q5.66390 24.51570 4.55620 24.51570ZM4.61890 23.82600L4.61890 23.82600Q5.60120 23.82600 6.54170 23.35575Q7.48220 22.88550 8.56900 21.96590