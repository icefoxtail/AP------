<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 400" width="840" height="400" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_1" data-geometry-preset="GEOMETRY_STANDARD" data-axis-scale-mode="EQUAL_UNIT" data-fact-hash="9658085baf0ab0c6c538f26491f71ba99f064f1959e0566f56f5c60f8cd04657" data-geometry-fact-hash="9658085baf0ab0c6c538f26491f71ba99f064f1959e0566f56f5c60f8cd04657" data-visual-provenance="deterministic-independent-facts">
  <title id="title">두 직선이 이루는 둔각</title>
  <desc id="desc">원점을 지나는 두 직선 y=2x와 y=-3x, 예각 45도와 문제에서 요구한 둔각 θ=135도를 표시한 좌표평면</desc>
  <style>
    .title{font:700 18px "Noto Sans KR","Malgun Gothic",sans-serif;fill:#111827}.note{font:12px "Noto Sans KR","Malgun Gothic",sans-serif;fill:#334155}.label{font:700 13px "STIX Two Math","Malgun Gothic",serif}.axis{font:italic 14px "STIX Two Math","Malgun Gothic",serif;fill:#111827}
  </style>
  <rect width="840" height="400" fill="#fff"/><text x="28" y="32" class="title">두 직선이 이루는 각</text><text x="28" y="54" class="note">예각 φ=45°를 구한 뒤, 조건 90°&lt;θ&lt;180°에 맞는 둔각을 선택한다.</text>
  <rect x="24" y="70" width="500" height="300" rx="12" fill="#fff" stroke="#cbd5e1"/>
  <g stroke="#e5e7eb" stroke-width="0.8"><line x1="64" y1="70" x2="64" y2="350"/><line x1="104" y1="70" x2="104" y2="350"/><line x1="144" y1="70" x2="144" y2="350"/><line x1="184" y1="70" x2="184" y2="350"/><line x1="224" y1="70" x2="224" y2="350"/><line x1="264" y1="70" x2="264" y2="350"/><line x1="304" y1="70" x2="304" y2="350"/><line x1="344" y1="70" x2="344" y2="350"/><line x1="384" y1="70" x2="384" y2="350"/><line x1="424" y1="70" x2="424" y2="350"/><line x1="464" y1="70" x2="464" y2="350"/><line x1="504" y1="70" x2="504" y2="350"/><line x1="64" y1="70" x2="504" y2="70"/><line x1="64" y1="110" x2="504" y2="110"/><line x1="64" y1="150" x2="504" y2="150"/><line x1="64" y1="190" x2="504" y2="190"/><line x1="64" y1="230" x2="504" y2="230"/><line x1="64" y1="270" x2="504" y2="270"/><line x1="64" y1="310" x2="504" y2="310"/><line x1="64" y1="350" x2="504" y2="350"/></g>
  <line data-geometry="axis-x" x1="64" y1="230" x2="504" y2="230" stroke="#111827" stroke-width="1.4"/><line data-geometry="axis-y" x1="284" y1="70" x2="284" y2="350" stroke="#111827" stroke-width="1.4"/><text x="492" y="222" class="axis">x</text><text x="292" y="84" class="axis">y</text>
  <line data-geometry="line" data-equation="y=2x" x1="204" y1="350" x2="364" y2="70" stroke="#2563eb" stroke-width="2.6"/><line data-geometry="line" data-equation="y=−3x" x1="231" y1="70" x2="337" y2="350" stroke="#dc2626" stroke-width="2.6"/>
  <path d="M337 322 A104 104 0 0 1 218 162" fill="#fef3c7" fill-opacity=".7" stroke="#f59e0b" stroke-width="2.2"/>
  <circle data-point-label="O(0,0)" data-point-x="0" data-point-y="0" cx="284" cy="230" r="5" fill="#111827"/><text x="292" y="246" class="label">O</text><text x="360" y="84" class="label" fill="#1d4ed8">y=2x</text><text x="342" y="350" class="label" fill="#b91c1c">y=−3x</text><text x="285" y="173" class="label" fill="#b45309">θ=135°</text>
  <rect x="548" y="70" width="268" height="300" rx="12" fill="#f8fafc" stroke="#dbe3ef"/><text x="568" y="103" class="title" style="font-size:15px">각의 판정</text><text x="568" y="137" class="note">m₁=2, m₂=−3</text><text x="568" y="166" class="note">tan φ=1</text><text x="568" y="194" class="note">φ=45°</text><line x1="568" y1="212" x2="796" y2="212" stroke="#cbd5e1"/><text x="568" y="243" class="note">90°&lt;θ&lt;180°</text><text x="568" y="271" class="note">θ=180°−45°</text><text x="568" y="305" class="note">θ=135°</text><text x="568" y="345" class="note">예각과 둔각을 구분해 표시</text>
</svg>
