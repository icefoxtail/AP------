<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 420" width="420" height="420" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">한 변의 길이가 1인 정사각형을 네 등분해 왼쪽 위 칸을 색칠하고, 남은 오른쪽 아래 정사각형에서 같은 시행을 이어가는 모양을 보여 준다.</title><desc id="visual-desc">큰 정사각형이 가운데의 가로선과 세로선으로 네 칸으로 나뉘고 왼쪽 위 칸이 색칠되어 있다. 오른쪽 아래 칸은 다시 네 칸으로 나뉘어 그 왼쪽 위 칸이 색칠되어 있다. 아래쪽에 한 변의 길이 1이 표시되어 있다.</desc><rect width="420" height="420" fill="#fff"/><g data-layer="10"><path id="r1" data-role="region" stroke="none" stroke-width="1.6" fill="#f2a65a" data-owner-points="D G H O" data-mark="region" data-mark-id="r1" fill-opacity="0.42" fill-rule="evenodd" d="M62.340010772 49.719198707 L210 49.719198707 L210 197.379187936 L62.340010772 197.379187936 L62.340010772 49.719198707 Z"/></g><g data-layer="10"><path id="r2" data-role="region" stroke="none" stroke-width="1.6" fill="#7fa6e8" data-owner-points="O Q3 Q4 Q5" data-mark="region" data-mark-id="r2" fill-opacity="0.32" fill-rule="evenodd" d="M210 197.379187936 L283.829994614 197.379187936 L283.829994614 271.20918255 L210 271.20918255 L210 197.379187936 Z"/></g><g data-layer="30"><line id="sAE" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="62.340010772" y1="345.039177164" x2="210" y2="345.039177164"/></g><g data-layer="30"><line id="sEB" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="210" y1="345.03