<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-label="사다리꼴과 정사각형의 넓이 조건을 이용해 높이와 밑변을 구하는 풀이">
  <rect width="960" height="520" fill="#ffffff"/>
  <rect x="24" y="24" width="912" height="472" rx="14" fill="#f8fbff" stroke="#d8e4ef" stroke-width="2"/>
  <text x="52" y="66" font-family="Noto Sans CJK KR, NanumGothic, sans-serif" font-size="27" font-weight="700" fill="#24384b">높이와 밑변의 비로 넓이 조건을 식으로 만들기</text>

  <polygon points="250,145 400,145 550,295 100,295" fill="#e5f2fb" stroke="#286a91" stroke-width="4"/>
  <line x1="250" y1="145" x2="250" y2="295" stroke="#d28724" stroke-width="3" stroke-dasharray="8 6"/>
  <polyline points="250,280 265,280 265,295" fill="none" stroke="#d28724" stroke-width="3"/>
  <text x="325" y="130" text-anchor="middle" font-family="Noto Sans CJK KR, NanumGothic, sans-serif" font-size="20" fill="#24384b">윗변 t</text>
  <text x="325" y="326" text-anchor="middle" font-family="Noto Sans CJK KR, NanumGothic, sans-serif" font-size="20" fill="#24384b">아랫변 3t</text>
  <text x="266" y="228" font-family="Noto Sans CJK KR, NanumGothic, sans-serif" font-size="19" fill="#9a641c">높이 h</text>
  <text x="325" y="365" text-anchor="middle" font-family="Noto Sans CJK KR, NanumGothic, sans-serif" font-size="18" fill="#536b7c">사다리꼴의 넓이 = 300 cm²</text>

  <rect x="665" y="145" width="150" height="150" fill="#fef3dc" stroke="#c47a14" stroke-width="4"/>
  <text x="740" y="225" text-anchor="middle" font-family="Noto Sans CJK KR, NanumGothic, sans-serif" font-size="21" fill="#24384b">한 변 h</text>
  <text x="740" y="325" text-anchor="middle" font-family="Noto Sans CJK KR, NanumGothic, sans-serif" font-size="18" fill="#536b7c">정사각형 넓이 = h² = 300 cm²</text>

  <line x1="52" y1="390" x2="908" y2="390" stroke="#d8e4ef" stroke-width="2"/>
  <text x="52" y="430" font-family="Noto Sans CJK KR, NanumGothic, sans-serif" font-size="21" fill="#24384b">h² = 300  →  h = 10√3</text>
  <text x="52" y="466" font-family="Noto Sans CJK KR, NanumGothic, sans-serif" font-size="21" fill="#24384b">(t + 3t)h ÷ 2 = 300  →  t = 5√3  →  3t = 15√3 cm</text>
</svg>
