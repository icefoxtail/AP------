<svg xmlns="http://www.w3.org/2000/svg" width="960" height="580" viewBox="0 0 960 580" role="img" aria-label="넓이식을 인수분해해 직사각형의 세로와 둘레를 구하는 풀이">
  <rect width="960" height="580" fill="#ffffff"/>
  <rect x="24" y="24" width="912" height="532" rx="14" fill="#f8fbff" stroke="#d8e4ef" stroke-width="2"/>
  <text x="52" y="66" font-family="Noto Sans CJK KR, NanumGothic, sans-serif" font-size="27" font-weight="700" fill="#24384b">넓이의 인수분해로 세로를 찾은 뒤 둘레 계산</text>

  <rect x="265" y="130" width="430" height="190" fill="#e7f3fb" stroke="#286a91" stroke-width="4"/>
  <text x="480" y="112" text-anchor="middle" font-family="Noto Sans CJK KR, NanumGothic, sans-serif" font-size="21" fill="#24384b">가로 5x + 3y cm</text>
  <text x="230" y="231" text-anchor="middle" font-family="Noto Sans CJK KR, NanumGothic, sans-serif" font-size="20" fill="#24384b">세로</text>
  <text x="230" y="259" text-anchor="middle" font-family="Noto Sans CJK KR, NanumGothic, sans-serif" font-size="20" fill="#24384b">x − 2y</text>
  <text x="480" y="224" text-anchor="middle" font-family="Noto Sans CJK KR, NanumGothic, sans-serif" font-size="22" font-weight="700" fill="#24384b">넓이</text>
  <text x="480" y="262" text-anchor="middle" font-family="Noto Sans CJK KR, NanumGothic, sans-serif" font-size="21" fill="#24384b">5x² − 7xy − 6y² cm²</text>
  <line x1="265" y1="337" x2="695" y2="337" stroke="#286a91" stroke-width="2"/>
  <text x="480" y="368" text-anchor="middle" font-family="Noto Sans CJK KR, NanumGothic, sans-serif" font-size="18" fill="#536b7c">넓이 = 가로 × 세로</text>

  <line x1="52" y1="398" x2="908" y2="398" stroke="#d8e4ef" stroke-width="2"/>
  <text x="52" y="435" font-family="Noto Sans CJK KR, NanumGothic, sans-serif" font-size="18" fill="#24384b">5x² − 7xy − 6y² = 5x² − 10xy + 3xy − 6y²</text>
  <text x="52" y="472" font-family="Noto Sans CJK KR, NanumGothic, sans-serif" font-size="18" fill="#24384b">= 5x(x − 2y) + 3y(x − 2y) = (5x + 3y)(x − 2y)</text>
  <text x="52" y="516" font-family="Noto Sans CJK KR, NanumGothic, sans-serif" font-size="21" font-weight="700" fill="#176489">둘레 = 2[(5x + 3y) + (x − 2y)] = 12x + 2y cm</text>
</svg>
