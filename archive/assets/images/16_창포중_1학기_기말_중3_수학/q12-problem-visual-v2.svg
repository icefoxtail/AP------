<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 705 544" width="705" height="544" role="img" aria-labelledby="title desc"><title id="title">두 포물선에서 비교하는 가로 길이와 세로 길이</title><desc id="desc">위로 열린 파란 그래프 y=x² 위의 A와 B는 y축에 대해 서로 대칭이다. A의 아래 C는 주황 점선 y=−x²/3 위에 있다. 가로 AB와 세로 AC를 이었다.</desc><rect width="705" height="544" fill="white" /><line x1="444.7762" y1="329.4038" x2="236.3846" y2="329.4038" stroke="#25736e" stroke-width="3.6" stroke-linecap="round" /><line x1="444.7762" y1="329.4038" x2="444.7762" y2="379.7885" stroke="#25736e" stroke-width="3.6" stroke-linecap="round" /><line x1="53.0000" y1="367.1923" x2="649.0000" y2="367.1923" stroke="#4d5d72" stroke-width="1.65" stroke-linecap="round" /><polygon points="649.0000,367.1923 636.0000,362.1923 636.0000,372.1923" fill="#4d5d72" /><text x="666.0000" y="359.1923" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#4d5d72" text-anchor="middle">x</text><line x1="340.5804" y1="473.0000" x2="340.5804" y2="80.0000" stroke="#4d5d72" stroke-width="1.65" stroke-linecap="round" /><polygon points="340.5804,80.0000 335.5804,93.0000 345.5804,93.0000" fill="#4d5d72" /><text x="356.5804" y="86.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#4d5d72" text-anchor="middle">y</text><text x="319.5804" y="395.1923" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#4d5d72" text-anchor="middle">O</text><path d="M 63.4196 99.8163 Q 340.5804 634.5683 617.7413 99.8163" stroke="#205d9c" stroke-width="6.0" stroke-linecap="round" fill="none" /><path d="M 57.1678 460.3837 Q 340.5804 274.0009 623.9930 460.3837" stroke="#aa5411" stroke-width="6.0" stroke-linecap="round" fill="none" stroke-dasharray="15 7" /><circle cx="444.7762237762238" cy="329.4038461538462" r="6.0" fill="white" stroke="#25736e" stroke-width="3.1" /><text x="477.7762" y="318.4038" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#25736e" text-anchor="middle">A</text><circle cx="236.38461538461536" cy="329.4038461538462" r="6.0" fill="white" stroke="#25736e" stroke-width="3.1" /><text x="202.3846" y="318.4038" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#25736e" text-anchor="middle">B</text><circle cx="444.7762237762238" cy="379.78846153846155" r="6.0" fill="white" stroke="#25736e" stroke-width="3.1" /><text x="467.7762" y="408.7885" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#25736e" text-anchor="middle">C</text><line x1="64.0000" y1="39.0000" x2="114.0000" y2="39.0000" stroke="#205d9c" stroke-width="5.4" stroke-linecap="round" /><text x="126.0000" y="47.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#205d9c" text-anchor="start">y = x²</text><line x1="379.0000" y1="39.0000" x2="429.0000" y2="39.0000" stroke="#aa5411" stroke-width="5.4" stroke-linecap="round" stroke-dasharray="15 7" /><text x="441.0000" y="47.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#aa5411" text-anchor="start">y = −x²/3</text></svg>
