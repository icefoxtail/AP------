<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 705 544" width="705" height="544" role="img" aria-labelledby="title desc"><title id="title">세 점을 포물선과 두 축에서 찾는 삼각형</title><desc id="desc">파란 포물선 y=x²−4x−5가 오른쪽 가로축에서 A, 세로축에서 B를 만난다. 가로축 아래쪽 꼭짓점 C를 이은 삼각형을 연두색으로 표시했다.</desc><rect width="705" height="544" fill="white" /><polygon points="541.2411,237.2848 208.6518,343.2718 341.6875,428.0615" fill="#e7f2e8" /><line x1="541.2411" y1="237.2848" x2="208.6518" y2="343.2718" stroke="#25736e" stroke-width="3.6" stroke-linecap="round" /><line x1="208.6518" y1="343.2718" x2="341.6875" y2="428.0615" stroke="#25736e" stroke-width="3.6" stroke-linecap="round" /><line x1="341.6875" y1="428.0615" x2="541.2411" y2="237.2848" stroke="#25736e" stroke-width="3.6" stroke-linecap="round" /><line x1="53.0000" y1="237.2848" x2="649.0000" y2="237.2848" stroke="#4d5d72" stroke-width="1.65" stroke-linecap="round" /><polygon points="649.0000,237.2848 636.0000,232.2848 636.0000,242.2848" fill="#4d5d72" /><text x="666.0000" y="229.2848" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#4d5d72" text-anchor="middle">x</text><line x1="208.6518" y1="473.0000" x2="208.6518" y2="80.0000" stroke="#4d5d72" stroke-width="1.65" stroke-linecap="round" /><polygon points="208.6518,80.0000 203.6518,93.0000 213.6518,93.0000" fill="#4d5d72" /><text x="224.6518" y="86.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#4d5d72" text-anchor="middle">y</text><text x="187.6518" y="265.2848" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#4d5d72" text-anchor="middle">O</text><path d="M 77.6116 93.9712 Q 341.6875 762.1518 605.7634 93.9712" stroke="#205d9c" stroke-width="6.0" stroke-linecap="round" fill="none" /><circle cx="541.2410714285714" cy="237.28478964401293" r="6.0" fill="white" stroke="#25736e" stroke-width="3.1" /><text x="574.2411" y="224.2848" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#25736e" text-anchor="middle">A</text><circle cx="208.6517857142857" cy="343.2718446601942" r="6.0" fill="white" stroke="#25736e" stroke-width="3.1" /><text x="176.6518" y="334.2718" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#25736e" text-anchor="middle">B</text><circle cx="341.68749999999994" cy="428.0614886731392" r="6.0" fill="white" stroke="#25736e" stroke-width="3.1" /><text x="348.6875" y="459.0615" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#25736e" text-anchor="middle">C</text><line x1="64.0000" y1="39.0000" x2="114.0000" y2="39.0000" stroke="#205d9c" stroke-width="5.4" stroke-linecap="round" /><text x="126.0000" y="47.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#205d9c" text-anchor="start">y = x² − 4x − 5</text></svg>
