<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 460" width="460" height="460" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">A학급 두 학생은 이웃하거나 마주보지 않아야 하므로 원형 거리 2 또는 3에 놓인다. 거리 3인 배치마다 B학급과 C학급을 조건에 맞게 놓는 방법이 2가지씩 있어 학급 배치는 16가지이다. 학생 개인별 배열 2!3!3!=72가지를 곱하고 회전 중복 8을 나누면 16×72÷8=144이다. 따라서 답은 ④이다.</title><desc id="visual-desc">원 위에 여덟 개의 점이 같은 간격으로 놓여 있고, 한 점에서 두 칸 떨어진 점까지의 호와 세 칸 떨어진 점까지의 호가 서로 다른 색으로 표시되어 있다.</desc><rect width="460" height="460" fill="#fff"/><g data-layer="40"><circle id="k" data-role="circle" stroke="#111" stroke-width="2.05" fill="none" cx="230" cy="230" r="179.512918887"/></g><g data-layer="46"><polyline id="d2" data-role="circularArc" stroke="#1f5fa8" stroke-width="3.2" fill="none" data-owner-points="S1 S3" data-center-point="O" data-owner-radius="6.0" data-sweep="CW" data-mark="arc" data-mark-id="d2" points="198.827908768,53.214285714 207.539920771,51.897689829 216.306041072,51.010158008 225.105151321,50.553828395 233.916053688,50.529800327 242.717521939,50.938131689 251.488352565,51.777838776 260.207415868,53.04689866 268.853706861,54.742254064 277.40639587,56.859820729 285.84487872,59.394497251 294.148826365,62.340177373 302.298233869,65.689764693 310.273468594,69.435189761 318.055317503,73.567429521 325.625033439,78.076529045 332.964380294,82.951625517 340.055676938,88.180974404 346.881839817,93.751977