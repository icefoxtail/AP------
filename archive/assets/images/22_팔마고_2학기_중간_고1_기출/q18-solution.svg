<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" width="640" height="280" role="img" aria-labelledby="title desc" data-scale-policy="SCHEMATIC_ALLOWED">
  <title id="title">원의 정수 격자점과 집합의 원소 수</title>
  <desc id="desc">원 x²+y²=5 위의 여덟 정수 격자점 (±1,±2), (±2,±1)과 B={1,2,...,k}의 원소 수를 비교한 그림</desc>
  <rect width="640" height="280" fill="#fff"/>
  <text x="320" y="28" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="21" font-weight="700" fill="#1e3a5f">원 위의 정수 격자점을 세어 n(A)=n(B)</text>
  <rect x="18" y="45" width="350" height="215" rx="8" fill="#f8fafc" stroke="#dbe3ef"/>
  <g stroke="#e2e8f0" stroke-width="1">
    <line x1="40" y1="90" x2="350" y2="90"/><line x1="40" y1="125" x2="350" y2="125"/><line x1="40" y1="160" x2="350" y2="160"/><line x1="40" y1="195" x2="350" y2="195"/><line x1="40" y1="230" x2="350" y2="230"/><line x1="70" y1="50" x2="70" y2="255"/><line x1="105" y1="50" x2="105" y2="255"/><line x1="140" y1="50" x2="140" y2="255"/><line x1="210" y1="50" x2="210" y2="255"/><line x1="245" y1="50" x2="245" y2="255"/><line x1="280" y1="50" x2="280" y2="255"/><line x1="315" y1="50" x2="315" y2="255"/>
  </g>
  <line x1="40" y1="160" x2="354" y2="160" stroke="#0f172a" stroke-width="1.5"/><line x1="175" y1="50" x2="175" y2="258" stroke="#0f172a" stroke-width="1.5"/>
  <text x="345" y="154" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14">x</text><text x="182" y="62" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14">y</text>
  <circle cx="175" cy="160" r="78.3" fill="#dbeafe" fill-opacity=".58" stroke="#2563eb" stroke-width="2.6"/>
  <g fill="#dc2626" stroke="#fff" stroke-width="1.2">
    <circle cx="140" cy="90" r="5"/><circle cx="210" cy="90" r="5"/><circle cx="140" cy="230" r="5"/><circle cx="210" cy="230" r="5"/>
    <circle cx="105" cy="125" r="5"/><circle cx="245" cy="125" r="5"/><circle cx="105" cy="195" r="5"/><circle cx="245" cy="195" r="5"/>
  </g>
  <text x="184" y="176" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14" font-weight="700">O</text>
  <text x="50" y="248" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="13" fill="#b91c1c">정수해 8개</text>
  <rect x="390" y="45" width="232" height="215" rx="8" fill="#f8fafc" stroke="#dbe3ef"/>
  <text x="408" y="75" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="17" font-weight="700" fill="#334155">A의 원소 수</text>
  <text x="408" y="108" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="15">(±1,±2), (±2,±1)</text>
  <text x="408" y="140" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="15">n(A)=4+4=8</text>
  <line x1="408" y1="153" x2="604" y2="153" stroke="#cbd5e1"/>
  <text x="408" y="181" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="13">B={x∈N | 1≤x&lt;k+1}</text>
  <text x="408" y="211" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14">B={1,2,...,k}, n(B)=k</text>
  <text x="408" y="247" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="16" font-weight="700" fill="#1d4ed8">n(A)=n(B) → k=8</text>
</svg>
