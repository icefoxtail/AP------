    </style>
    <rect width="760" height="430" fill="#f8fafc"/><text x="28" y="38" font-size="22" text-anchor="start" class="text" font-weight="700">집합 등식의 양쪽에만 나타나는 원소는 X에 고정된다</text><text x="28" y="67" font-size="15" text-anchor="start" class="muted">(A−B)∪X = X∪(B−A)의 양변을 비교한 상태표</text><rect x="44" y="105" width="650" height="180" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/><rect x="44" y="105" width="220" height="45" rx="0" fill="#f1f5f9" stroke="none" stroke-width="0"/><text x="58" y="133" font-size="15" text-anchor="start" class="text" font-weight="700">전체집합 U</text><text x="278" y="133" font-size="15" text-anchor="start" class="text" fill="#334155">{1,2,4,8,11,13,15}</text><line x1="44" y1="150" x2="694" y2="150" stroke="#e2e8f0" stroke-width="1" stroke-linecap="round"/><rect x="44" y="150" width="220" height="45" rx="0" fill="#f1f5f9" stroke="none" stroke-width="0"/><text x="58" y="178" font-size="15" text-anchor="start" class="text" font-weight="700">왼쪽에만 나타남</text><text x="278" y="178" font-size="15" text-anchor="start" class="text" fill="#166534">A−B={4,11}  →  X에 포함</text><line x1="44" y1="195" x2="694" y2="195" stroke="#e2e8f0" stroke-width="1" stroke-linecap="round"/><rect x="44" y="195" width="220" height="45" rx="0" fill="#f1f5f9" stroke="none" stroke-width="0"/><text x="58" y="223" font-size="15" text-anchor="start" class="text" font-weight="700">오른쪽에만 나타남</text><text x="278" y="223" font-size="15" text-anchor="start" class="text" fill="#166534">B−A={2,13}  →  X에 포함</text><line x1="44" y1="240" x2="694" y2="240" stroke="#e2e8f0" stroke-width="1" stroke-linecap="round"/><rect x="44" y="240" width="220" height="45" rx="0" fill="#f1f5f9" stroke="none" stroke-width="0"/><text x="58" y="268" font-size="15" text-anchor="start" class="text" font-weight="700">자유 선택</text><text x="278" y="268" font-size="15" text-anchor="start" class="text" fill="#1d4ed8">{1,8,15}  →  3개</text><rect x="44" y="315" width="310" height="30" rx="15" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/><text x="199" y="335" font-size="14" text-anchor="middle" class="text" fill="#166534" font-weight="700">{2,4,11,13}⊆X</text><text x="390" y="337" font-size="24" text-anchor="start" class="text" fill="#1d4ed8" font-weight="700">n(X)=2³=8</text><text x="44" y="378" font-size="14" text-anchor="start" class="muted">고정된 네 원소 외의 1,8,15는 등식의 양변에 이미 대칭적으로 나타난다.</text></svg>