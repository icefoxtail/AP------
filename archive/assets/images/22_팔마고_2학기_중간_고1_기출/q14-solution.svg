    <rect width="760" height="430" fill="#f8fafc"/><text x="28" y="38" font-size="22" text-anchor="start" class="text" font-weight="700">A♥B는 같은 소속인 두 영역을 남기는 연산이다</text><text x="28" y="67" font-size="15" text-anchor="start" class="muted">U={a,b,c,d,e,f}, A♥B=(A−B)ᶜ∩(B−A)ᶜ</text><rect x="30" y="94" width="330" height="232" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/><text x="46" y="121" font-size="15" text-anchor="start" class="text" fill="#7c3aed" font-weight="700">네 영역의 의미</text><circle cx="138" cy="196" r="64" fill="#ef4444" fill-opacity="0.28" stroke="#b91c1c" stroke-width="2"/><circle cx="232" cy="196" r="64" fill="#ef4444" fill-opacity="0.28" stroke="#b91c1c" stroke-width="2"/><rect x="74" y="268" width="220" height="38" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/><text x="184" y="293" font-size="13" text-anchor="middle" class="text" fill="#166534" font-weight="700">A♥B: 함께 또는 둘 다 아님</text><text x="101" y="195" font-size="14" text-anchor="start" class="text" fill="#991b1b" font-weight="700">A만</text><text x="269" y="195" font-size="14" text-anchor="start" class="text" fill="#991b1b" font-weight="700">B만</text><text x="185" y="199" font-size="14" text-anchor="middle" class="text" fill="#166534" font-weight="700">A∩B</text><text x="54" y="160" font-size="13" text-anchor="start" class="text" fill="#166534">U 밖</text><text x="46" y="316" font-size="13" text-anchor="start" class="muted">빨강=A△B, 초록=A♥B</text><rect x="388" y="94" width="336" height="232" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/><text x="404" y="121" font-size="15" text-anchor="start" class="text" fill="#2563eb" font-weight="700">보기별 결정 단계</text><text x="408" y="158" font-size="14" text-anchor="start" class="text" fill="#334155"><tspan x="408" dy="0">ㄱ: 첫 결과 크기 4, 둘째 결과 크기 4</tspan><tspan x="408" dy="35">ㄴ: A♥Bᶜ=Aᶜ♥B</tspan><tspan x="408" dy="35">ㄷ: A♥B=U → A=B → 2⁶=64</tspan></text><line x1="408" y1="264" x2="704" y2="264" stroke="#e2e8f0" stroke-widt