<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" role="img" aria-labelledby="title desc" width="760" height="330"><title id="title">문항 14 해설: 대칭차의 여집합</title><desc id="desc">Venn diagram에서 한쪽에만 속하는 대칭차와 나머지 영역을 구분한 그림</desc><style>text{font-family:"Noto Sans KR",Arial,sans-serif;fill:#172033}.m{fill:#56657a}</style><rect width="760" height="330" rx="18" fill="#f8fafc"/><text x="28" y="38" font-size="22" font-weight="700">대칭차와 그 여집합</text><text x="28" y="66" class="m" font-size="15">한쪽에만 속하는 영역을 제외하면 A♥B가 남는다.</text><rect x="28" y="84" width="430" height="190" rx="14" fill="#fff" stroke="#cbd5e1"/><circle cx="216" cy="178" r="72" fill="#fee2e2" stroke="#dc2626" stroke-width="3"/><circle cx="300" cy="178" r="72" fill="#fee2e2" stroke="#dc2626" stroke-width="3"/><ellipse cx="258" cy="178" rx="38" ry="68" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="165" y="162" font-size="18" fill="#b91c1c">A만</text><text x="335" y="162" font-size="18" fill="#b91c1c">B만</text><text x="258" y="183" text-anchor="middle" font-size="17" fill="#15803d">A∩B</text><text x="56" y="248" font-size="15" fill="#b91c1c">A△B</text><text x="318" y="248" font-size="15" fill="#15803d">(A△B)ᶜ</text><rect x="490" y="98" width="238" height="154" rx="14" fill="#fff" stroke="#cbd5e1"/><text x="514" y="132" font-size="17" font-weight="700">남는 영역</text><text x="514" y="172" font-size="17" fill="#15803d">A∩B</text><text x="514" y="208" font-size="17" fill="#15803d">U−(A∪B)</text><text x="28" y="306" class="m" font-size="14">A♥B=(A−B)ᶜ∩(B−A)ᶜ는 두 집합에 함께 속하거나 모두 속하지 않는 곳이다.</text></svg>
