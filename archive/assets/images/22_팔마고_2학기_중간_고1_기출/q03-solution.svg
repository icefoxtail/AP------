<svg xmlns="http://www.w3.org/2000/svg" width="960" height="260" viewBox="0 0 960 260" role="img" aria-labelledby="title desc">
  <title id="title">p의 진리집합과 q의 진리집합의 포함 관계</title>
  <desc id="desc">p의 진리집합은 닫힌구간 -4부터 2까지이고 q의 진리집합은 a-7보다 큰 수의 구간이다. p가 q의 부분집합이 되려면 a-7이 -4보다 작아야 한다.</desc>
  <rect x="0" y="0" width="960" height="260" fill="#ffffff"/>
  <text x="48" y="38" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#1f2937">진리집합의 포함 관계</text>
  <text x="48" y="70" font-family="Arial, sans-serif" font-size="18" fill="#374151">p → q 이므로 P ⊆ Q</text>

  <line x1="100" y1="124" x2="865" y2="124" stroke="#374151" stroke-width="3"/>
  <polygon points="865,124 850,116 850,132" fill="#374151"/>
  <line x1="250" y1="107" x2="250" y2="141" stroke="#374151" stroke-width="3"/>
  <line x1="580" y1="107" x2="580" y2="141" stroke="#374151" stroke-width="3"/>
  <text x="238" y="169" font-family="Arial, sans-serif" font-size="19" fill="#1f2937">−4</text>
  <text x="574" y="169" font-family="Arial, sans-serif" font-size="19" fill="#1f2937">2</text>

  <line x1="250" y1="92" x2="580" y2="92" stroke="#2563eb" stroke-width="10" stroke-linecap="round"/>
  <circle cx="250" cy="92" r="9" fill="#2563eb" stroke="#ffffff" stroke-width="3"/>
  <circle cx="580" cy="92" r="9" fill="#2563eb" stroke="#ffffff" stroke-width="3"/>
  <text x="390" y="82" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#1d4ed8">P = [−4, 2]</text>

  <line x1="170" y1="207" x2="865" y2="207" stroke="#059669" stroke-width="10" stroke-linecap="round"/>
  <circle cx="170" cy="207" r="10" fill="#ffffff" stroke="#059669" stroke-width="4"/>
  <text x="170" y="239" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#047857">a−7</text>
  <text x="520" y="196" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#047857">Q = (a−7, ∞)</text>
  <text x="760" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#374151">a−7 &lt; −4  →  a &lt; 3</text>
</svg>
