<title id="svg-title-b606681775">삼차함수와 원의 공통 접선</title><desc id="svg-desc-b606681775">최고차항 계수가 1인 f는 x=1에서 y=2x−1에 접하고, 중심 C=(3,0)인 원도 같은 직선에 T에서 접한다. g(x)=f(x)−2x+1, h(x)=(x−1)(f′(x)−2), 3g(2)=h(2)의 조건을 나타낸다.</desc><style>.axis{stroke:#111;stroke-width:1.2}.shape,.curve{fill:none;stroke:#111;stroke-width:1.8}.guide{fill:none;stroke:#555;stroke-width:1;stroke-dasharray:5 4}.point{fill:#111}.radius{fill:none;stroke:#1f4e79;stroke-width:1.5}.tangent{fill:none;stroke:#111;stroke-width:2.1}.perpendicular{fill:none;stroke:#555;stroke-width:1;stroke-dasharray:3 3}.right-angle{fill:none;stroke:#111;stroke-width:1.2}.center-point{fill:#1f4e79}.element-label,.annotation{font:13px sans-serif}.annotation{font-style:italic}text{font:14px sans-serif;fill:#111}.cell{fill:#fff;stroke:#111;stroke-width:1}.cell-text{text-anchor:middle;dominant-baseline:middle;font:13px sans-serif}</style>
