<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="760" viewBox="0 0 1120 760" role="img"><title>0과 1 사이의 밑에서 지수 비교</title><desc>수직선은 순서 관계를 보여 주며, 숫자는 그 관계를 설명하는 한 가지 예시다.</desc><style>text{font-family:Arial,"Noto Sans KR",sans-serif;fill:#263746}.title{font-size:27px;font-weight:700;fill:#18324b}.sub{font-size:17px;fill:#62788a}.label{font-size:19px}.math{font-family:Georgia,"Times New Roman",serif;font-size:22px;font-style:italic}.small{font-size:16px;fill:#62788a}.badge{font-size:20px;font-weight:700;fill:#18324b}.axis{stroke:#18324b;stroke-width:2.2;fill:none}.guide{stroke:#93a4b1;stroke-width:1.7;stroke-dasharray:7 6;fill:none}.grid{stroke:#dce5ec;stroke-width:1}.curve{fill:none;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.card{fill:#ffffff;stroke:#dce5ec;stroke-width:1.5}</style><rect width="1120" height="760" fill="#ffffff"/><text x="40" y="48" class="title" style="font-size:46px">0과 1 사이의 밑에서 지수 비교</text><text x="42" y="100" class="sub" style="font-size:46px">r=a/b이면 0&lt;r&lt;a&lt;1&lt;b</text><g data-qid="22"><rect x="90" y="115" width="940" height="170" rx="18" fill="#ffffff" stroke="#dce5ec" stroke-width="1.5"/><rect x="90" y="115" width="8" height="170" rx="4" fill="#3478a8"/><text x="125.00" y="158.00" class="badge" text-anchor="start"  style="font-size:46px">조건의 순서</text><text x="120" y="700" class="small" text-anchor="start"  textLength="900" lengthAdjust="spacingAndGlyphs" style="font-size:46px">예: a=1/2, b=5/3, r=3/10</text><line x1="240.00" y1="230.00" x2="950.00" y2="230.00" class="axis" /><text x="240.00" y="264.00" class="math" text-anchor="middle"  style="font-size:46px">0</text><circle cx="358.33" cy="230.00" r="8.00" fill="#e77c45" stroke="#ffffff" stroke-width="2" data-label="r=a/b" data-fact-id="numberline-first-r=a/b" data-x="0.3"/><text x="358.33" y="210.00" class="math" text-anchor="middle"  style="font-size:46px">r=a/b</text><circle cx="437.22" cy="230.00" r="8.00" fill="#3478a8" stroke="#ffffff" stroke-width="2" data-label="a" data-fact-id="numberline-first-a" data-x="0.5"/><text x="437.22" y="210.00" class="math" text-anchor="middle"  style="font-size:46px">a</text><circle cx="634.44" cy="230.00" r="8.00" fill="#18324b" stroke="#ffffff" stroke-width="2" data-label="1" data-fact-id="numberline-first-1" data-x="1"/><text x="634.44" y="210.00" class="math" text-anchor="middle"  style="font-size:46px">1</text><circle cx="897.41" cy="230.00" r="8.00" fill="#178f87" stroke="#ffffff" stroke-width="2" data-label="b" data-fact-id="numberline-first-b" data-x="1.6666666666666667"/><text x="897.41" y="210.00" class="math" text-anchor="middle"  style="font-size:46px">b</text><text x="123.00" y="330.00" class="badge" text-anchor="start"  style="font-size:46px">0 &lt; r &lt; a &lt; 1 &lt; b</text><rect x="90" y="365" width="940" height="180" rx="18" fill="#ffffff" stroke="#dce5ec" stroke-width="1.5"/><rect x="90" y="365" width="8" height="180" rx="4" fill="#178f87"/><text x="125" y="555" class="small" text-anchor="start"  textLength="900" lengthAdjust="spacingAndGlyphs" style="font-size:46px">0&lt;r&lt;1: x↑이면 r^x↓</text><line x1="310.00" y1="420.00" x2="885.00" y2="420.00" class="axis" /><text x="310.00" y="454.00" class="math" text-anchor="middle"  style="font-size:46px">0</text><circle cx="482.50" cy="420.00" r="8.00" fill="#e77c45" stroke="#ffffff" stroke-width="2" data-label="r" data-fact-id="power-order-r" data-value="0.3"/><text x="482.50" y="400.00" class="math" text-anchor="middle"  style="font-size:46px">r</text><circle cx="624.94" cy="420.00" r="8.00" fill="#3478a8" stroke="#ffffff" stroke-width="2" data-label="rᵃ" data-fact-id="power-order-rᵃ" data-value="0.5477225575051661"/><text x="624.94" y="400.00" class="math" text-anchor="middle"  style="font-size:46px">rᵃ</text><circle cx="710.69" cy="420.00" r="8.00" fill="#178f87" stroke="#ffffff" stroke-width="2" data-label="rʳ" data-fact-id="power-order-rʳ" data-value="0.696845301935949"/><text x="710.69" y="400.00" class="math" text-anchor="middle"  style="font-size:46px">rʳ</text><circle cx="885.00" cy="420.00" r="8.00" fill="#18324b" stroke="#ffffff" stroke-width="2" data-label="1" data-fact-id="power-order-1" data-value="1"/><text x="885.00" y="400.00" class="math" text-anchor="middle"  style="font-size:46px">1</text><text x="123.00" y="630" class="badge" text-anchor="start"  style="font-size:46px">r &lt; rᵃ &lt; rʳ</text><text x="780.00" y="630" class="small" text-anchor="end"  style="font-size:46px">순서 비교 예시</text></g></svg>
