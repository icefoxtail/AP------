<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="850" viewBox="0 0 1024 850" role="img"><title>제2사분면의 단위원 좌표</title><desc>cos가 x좌표를 정하고 사분면이 sin의 부호를 정한다.</desc><style>text{font-family:Arial,"Noto Sans KR",sans-serif;fill:#263746}.title{font-size:27px;font-weight:700;fill:#18324b}.sub{font-size:17px;fill:#62788a}.label{font-size:19px}.math{font-family:Georgia,"Times New Roman",serif;font-size:22px;font-style:italic}.small{font-size:16px;fill:#62788a}.badge{font-size:20px;font-weight:700;fill:#18324b}.axis{stroke:#18324b;stroke-width:2.2;fill:none}.guide{stroke:#93a4b1;stroke-width:1.7;stroke-dasharray:7 6;fill:none}.grid{stroke:#dce5ec;stroke-width:1}.curve{fill:none;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.card{fill:#ffffff;stroke:#dce5ec;stroke-width:1.5}</style><rect width="1024" height="620" fill="#ffffff"/><text x="40" y="48" class="title" style="font-size:42px">제2사분면의 단위원 좌표</text><text x="42" y="78" class="sub" style="font-size:42px">cos가 x좌표를 정하고 사분면이 sin의 부호를 정한다.</text><g data-qid="3"><line x1="115.00" y1="355.00" x2="675.00" y2="355.00" class="axis" /><line x1="390.00" y1="555.00" x2="390.00" y2="140.00" class="axis" /><circle cx="390" cy="355" r="210" fill="none" stroke="#18324b" stroke-width="3" data-fact-id="unit-circle-radius-one"/><polygon points="390,355 222.00,355 222.00,229.00" fill="#e8f2f7"/><line x1="390.00" y1="355.00" x2="222.00" y2="229.00" class="shape" data-fact-id="radius-one"/><line x1="390.00" y1="355.00" x2="222.00" y2="355.00" class="shape" stroke="#3478a8" data-fact-id="cos-minus-four-fifths"/><line x1="222.00" y1="355.00" x2="222.00" y2="229.00" class="shape" stroke="#178f87" data-fact-id="sin-plus-three-fifths"/><circle cx="390.00" cy="355.00" r="6.00" fill="#18324b" stroke="#ffffff" stroke-width="2" data-label="O"/><circle cx="222.00" cy="229.00" r="7.00" fill="#e77c45" stroke="#ffffff" stroke-width="2" data-label="Q" data-x="-.8" data-y=".6"/><text x="402.00" y="380.00" class="math" text-anchor="start"  style="font-size:42px">O</text><text x="245" y="220" class="math" text-anchor="start"  textLength="315" lengthAdjust="spacingAndGlyphs" style="font-size:42px">Q (−4/5, 3/5)</text><text x="390" y="620" class="math" text-anchor="middle"  textLength="260" lengthAdjust="spacingAndGlyphs" style="font-size:42px">cos θ = −4/5</text><text x="390" y="680" class="math" text-anchor="middle"  textLength="260" lengthAdjust="spacingAndGlyphs" style="font-size:42px">sin θ = +3/5</text><text x="422.00" y="323.00" class="math" text-anchor="start"  style="font-size:42px">θ</text><text x="50" y="740" class="badge" text-anchor="start"  style="font-size:42px">제2사분면</text><text x="50" y="800" class="math" text-anchor="start"  style="font-size:42px">x&lt;0, y&gt;0</text><text x="650" y="620" class="math" text-anchor="start"  textLength="340" lengthAdjust="spacingAndGlyphs" style="font-size:42px">x좌표: cos θ = −4/5</text><text x="650" y="680" class="math" text-anchor="start"  textLength="340" lengthAdjust="spacingAndGlyphs" style="font-size:42px">y² = 1 − 16/25</text><text x="390" y="680" class="badge" text-anchor="middle"  textLength="260" lengthAdjust="spacingAndGlyphs" style="font-size:42px">sin θ = +3/5</text><polyline points="240.00,355.00 240.00,337.00 222.00,337.00" fill="none" stroke="#18324b" stroke-width="2" data-fact-id="right-angle"/></g></svg>
