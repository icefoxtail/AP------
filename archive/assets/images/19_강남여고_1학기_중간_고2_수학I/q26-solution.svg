<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1250" viewBox="0 0 1000 1250" role="img"><title>보완각 쌍과 가운데 항</title><desc>k와 2n−k를 짝짓고 k=n 항을 따로 더한다.</desc><rect width="1000" height="1250" fill="#ffffff"/><text x="42" y="52" style="font-size:41px" font-family="sans-serif" font-weight="700">보완각 쌍과 가운데 항</text><text x="42" y="108" style="font-size:41px" font-family="sans-serif">대칭인 두 항과 k=n 항을 분리한다.</text><g data-qid="26"><path d="M 170 410 A 130 130 0 0 1 430 410" fill="none" stroke="#18324b" stroke-width="4" data-fact-id="upper-semicircle-radius-one"/><line x1="170" y1="410" x2="430" y2="410" stroke="#18324b" stroke-width="4" data-fact-id="diameter-two"/><circle cx="300" cy="410" r="5" fill="#18324b" data-label="O"/><text x="300" y="465" text-anchor="middle" style="font-size:41px" data-label-owner="center O" data-fact-id="center-O">O</text><text x="170" y="465" text-anchor="middle" style="font-size:41px" data-label-owner="left diameter endpoint A" data-fact-id="diameter-two">A</text><text x="430" y="465" text-anchor="middle" style="font-size:41px" data-label-owner="right diameter endpoint B" data-fact-id="diameter-two">B</text><circle cx="420.104339" cy="360.251154" r="6" fill="#94a3b8" data-fact-id="P1-n4" data-angle-rad="0.39269908169872414"/><circle cx="391.923882" cy="318.076118" r="6" fill="#0f766e" data-fact-id="P2-n4" data-angle-rad="0.7853981633974483"/><circle cx="349.748846" cy="289.895661" r="6" fill="#94a3b8" data-fact-id="P3-n4" data-angle-rad="1.1780972450961724"/><circle cx="300.000000" cy="280.000000" r="6" fill="#e77c45" data-fact-id="P4-n4" data-angle-rad="1.5707963267948966"/><circle cx="250.251154" cy="289.895661" r="6" fill="#94a3b8" data-fact-id="P5-n4" data-angle-rad="1.9634954084936207"/><circle cx="208.076118" cy="318.076118" r="6" fill="#0f766e" data-fact-id="P6-n4" data-angle-rad="2.356194490192345"/><circle cx="179.895661" cy="360.251154" r="6" fill="#94a3b8" data-fact-id="P7-n4" data-angle-rad="2.748893571891069"/><text x="455" y="386" text-anchor="start" style="font-size:41px" data-label-owner="point P1" data-fact-id="P1-n4">P1</text><text x="405" y="335" text-anchor="start" style="font-size:41px" data-label-owner="point P2" data-fact-id="P2-n4">P2</text><text x="355" y="280" text-anchor="start" style="font-size:41px" data-label-owner="point P3" data-fact-id="P3-n4">P3</text><text x="300" y="245" text-anchor="middle" style="font-size:41px" data-label-owner="point P4" data-fact-id="P4-n4">Pₙ</text><text x="245" y="280" text-anchor="end" style="font-size:41px" data-label-owner="point P5" data-fact-id="P5-n4">P5</text><text x="195" y="335" text-anchor="end" style="font-size:41px" data-label-owner="point P6" data-fact-id="P6-n4">P6</text><text x="145" y="386" text-anchor="end" style="font-size:41px" data-label-owner="point P7" data-fact-id="P7-n4">P7</text><line x1="430" y1="410" x2="391.923882" y2="318.076118" stroke="#0f766e" stroke-width="4" data-fact-id="chord-B-P2"/><line x1="430" y1="410" x2="208.076118" y2="318.076118" stroke="#0f766e" stroke-width="4" data-fact-id="chord-B-P6"/><line x1="430" y1="410" x2="300.000000" y2="280.000000" stroke="#e77c45" stroke-width="5" data-fact-id="chord-B-P4"/><text x="50" y="540" text-anchor="start" style="font-size:41px" data-label-owner="central angle formula" data-fact-id="central-angle-formula">∠BOPₖ = kπ/(2n)</text><text x="50" y="595" text-anchor="start" style="font-size:41px" data-label-owner="chord formula" data-fact-id="chord-formula">BPₖ = 2sin(kπ/(4n))</text><text x="50" y="650" text-anchor="start" style="font-size:41px" data-label-owner="pair k with 2n−k" data-fact-id="pairing">k와 2n−k를 한 쌍으로 묶는다</text><text x="50" y="705" text-anchor="start" style="font-size:41px" data-label-owner="first paired angle" data-fact-id="paired-angle-first">θₖ = kπ/(4n)</text><text x="50" y="760" text-anchor="start" style="font-size:41px" data-label-owner="complementary paired angle" data-fact-id="paired-angle-second">θ₂ₙ₋ₖ = π/2−θₖ</text><text x="50" y="815" text-anchor="start" style="font-size:41px" data-label-owner="pair sine-square sum" data-fact-id="paired-sin-square-identity">sin²θₖ + sin²θ₂ₙ₋ₖ = 1</text><text x="50" y="870" text-anchor="start" style="font-size:41px" data-label-owner="n−1 pairs contribute n−1" data-fact-id="pair-count">짝은 n−1개, 각 쌍의 합은 1</text><text x="50" y="925" text-anchor="start" style="font-size:41px" data-label-owner="separate midpoint term" data-fact-id="midpoint-separation">가운데 k=n 항은 별도</text><text x="50" y="980" text-anchor="start" style="font-size:41px" data-label-owner="midpoint term value" data-fact-id="midpoint-k-n-term">sin²(π/4) = 1/2</text><text x="50" y="1035" text-anchor="start" style="font-size:41px" data-label-owner="paired sum plus midpoint" data-fact-id="sum-paired-plus-midpoint">Σ sin² = n−1/2</text><text x="50" y="1090" text-anchor="start" style="font-size:41px" data-label-owner="sum of squared chords" data-fact-id="sum-4n-minus-two">Σ BPₖ² = 4(n−1/2) = 4n−2</text><text x="50" y="1145" text-anchor="start" style="font-size:41px" data-label-owner="threshold inequality" data-fact-id="threshold-n-13">4n−2 ≥ 50 ⇒ n ≥ 13</text><text x="50" y="1200" text-anchor="start" style="font-size:41px" data-label-owner="minimum natural n" data-fact-id="minimum-n-13">최솟값 n = 13</text></g></svg>