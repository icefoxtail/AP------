<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 410" role="img" aria-label="삼각함수 그래프 교점의 대칭과 근의 합"><rect width="820" height="360" rx="18" fill="#fff"/><text x="36" y="42" font-size="22" font-family="sans-serif" fill="#172554" style="font-size:34px">수평선 교점의 대칭</text><rect x="28" y="66" width="764" height="122" rx="12" fill="#eff6ff"/><text x="52" y="96" font-size="18" font-family="serif" fill="#1e3a8a" style="font-size:34px">y = sin 2x,  y = k</text><line x1="130" y1="137" x2="690" y2="137" stroke="#64748b" stroke-width="2"/><circle cx="315" cy="137" r="7" fill="#2563eb"/><circle cx="505" cy="137" r="7" fill="#2563eb"/><line x1="410" y1="105" x2="410" y2="164" stroke="#ef4444" stroke-dasharray="5 5" stroke-width="2"/><path d="M315 123 Q410 105 505 123" fill="none" stroke="#2563eb" stroke-width="3"/><text x="306" y="160" font-size="17" font-family="serif" style="font-size:34px">a</text><text x="497" y="160" font-size="17" font-family="serif" style="font-size:34px">b</text><text x="345" y="210" font-size="17" font-family="serif" fill="#1e3a8a" style="font-size:34px">중심 π/4  →  a+b=π/2</text><rect x="28" y="204" width="764" height="122" rx="12" fill="#f0fdfa"/><text x="52" y="252" font-size="18" font-family="serif" fill="#115e59" style="font-size:34px">y = sin 4x,  y = −k</text><line x1="130" y1="275" x2="690" y2="275" stroke="#64748b" stroke-width="2"/><circle cx="345" cy="275" r="7" fill="#0f766e"/><circle cx="475" cy="275" r="7" fill="#0f766e"/><line x1="410" y1="243" x2="410" y2="302" stroke="#ef4444" stroke-dasharray="5 5" stroke-width="2"/><path d="M345 261 Q410 243 475 261" fill="none" stroke="#0f766e" stroke-width="3"/><text x="336" y="298" font-size="17" font-family="serif" style="font-size:34px">c</text><text x="467" y="298" font-size="17" font-family="serif" style="font-size:34px">d</text><text x="337" y="352" font-size="17" font-family="serif" fill="#115e59" style="font-size:34px">중심 3π/8  →  c+d=3π/4</text></svg>