<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">예: n=2인 경우의 그림으로 반원의 호를 4등분하는 점 P1, P2, P3이다. 반지름은 1이고 B에서 k번째 점까지의 중심각은 kπ/(2n)이므로 현의 길이는 2sin(kπ/4n)이다. 그 제곱은 4sin²(kπ/4n)이고 k와 2n−k의 두 각은 서로 여각이어서 sin² 합이 1이다. 이런 쌍이 n−1개이고 가운데 항은 1/2이므로 합은 4n−2이다. 4n−2≥50에서 n≥13이므로 최솟값은 13이다. 따라서 답은 ②이다.</title><desc id="visual-desc">지름 AB가 2인 원과 지름의 중점 O가 있다. 원 위의 점 P1, P2, P3과 B를 잇는 점선 세 개가 있다.</desc><rect width="640" height="420" fill="#fff"/><g data-layer="30"><line id="AB" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="175.237475602" y1="218.685751464" x2="464.762524398" y2="218.685751464"/></g><g data-layer="30"><line id="BP1" data-role="line" stroke="#111" stroke-width="1.6" fill="none" stroke-dasharray="6 4" x1="464.762524398" y1="218.685751464" x2="422.362562664" y2="116.3231888"/></g><g data-layer="30"><line id="BP2" data-role="line" stroke="#111" stroke-width="1.6" fill="none" stroke-dasharray="6 4" x1="464.762524398" y1="218.685751464" x2="320" y2="73.923227066"/></g><g data-layer="30"><line id="BP3" data-role="line" stroke="#111" stroke-width="1.6" fill="none" stroke-dasharray="6 4" x1="464.762524398" y1="218.685751464" x2="217.637437336" y2="116.3231888"/></g><g data-layer="40"><circle id="K" data-role="circle" stroke="#111" stroke-wid