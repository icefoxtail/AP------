<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="760" viewBox="0 0 1120 760" role="img"><title>로그 부등식의 정의역과 정수해</title><desc>오른쪽 해 구간 (6,7)은 비어 있고, 왼쪽 정수해의 최댓값은 −3이다.</desc><style>text{font-family:Arial,"Noto Sans KR",sans-serif;fill:#263746}.title{font-size:27px;font-weight:700;fill:#18324b}.sub{font-size:17px;fill:#62788a}.label{font-size:19px}.math{font-family:Georgia,"Times New Roman",serif;font-size:22px;font-style:italic}.small{font-size:16px;fill:#62788a}.badge{font-size:20px;font-weight:700;fill:#18324b}.axis{stroke:#18324b;stroke-width:2.2;fill:none}.guide{stroke:#93a4b1;stroke-width:1.7;stroke-dasharray:7 6;fill:none}.grid{stroke:#dce5ec;stroke-width:1}.curve{fill:none;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.card{fill:#ffffff;stroke:#dce5ec;stroke-width:1.5}</style><rect width="1120" height="650" fill="#ffffff"/><text x="40" y="48" class="title" style="font-size:46px">로그 부등식의 정의역과 정수해</text><text x="42" y="100" class="sub" text-anchor="start" textLength="1040" lengthAdjust="spacingAndGlyphs" style="font-size:46px">오른쪽 해 구간 (6,7)은 비어 있고, 왼쪽 정수해의 최댓값은 −3이다.</text><g data-qid="13"><rect x="105" y="110" width="925" height="105" rx="18" fill="#ffffff" stroke="#dce5ec" stroke-width="1.5"/><rect x="105" y="110" width="8" height="105" rx="4" fill="#3478a8"/><text x="132.00" y="150.00" class="badge" text-anchor="start"  style="font-size:46px">정의역</text><text x="132" y="210" class="math" text-anchor="start"  style="font-size:46px">x&lt;7, x≠4</text><text x="420.00" y="150.00" class="badge" text-anchor="start"  style="font-size:46px">이차부등식 해</text><text x="420" y="210" class="math" text-anchor="start"  style="font-size:46px">x&lt;−2 또는 x&gt;6</text><text x="115.00" y="275.00" class="badge" text-anchor="start"  style="font-size:46px">정의역</text><line x1="140.00" y1="300.00" x2="1030.00" y2="300.00" class="axis" /><line x1="140.00" y1="300.00" x2="964.07" y2="300.00" class="shape" stroke="#3478a8" stroke-width="8" data-fact-id="domain-x-le