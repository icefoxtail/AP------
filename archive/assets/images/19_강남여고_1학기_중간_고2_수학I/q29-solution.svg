<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="580" viewBox="0 0 1080 580" role="img"><title>로그 구간을 3/2배로 옮기기</title><desc>열린 구간 (3/2,3) 안의 정수는 2 하나뿐이다.</desc><style>text{font-family:Arial,"Noto Sans KR",sans-serif;fill:#263746}.title{font-size:27px;font-weight:700;fill:#18324b}.sub{font-size:17px;fill:#62788a}.label{font-size:19px}.math{font-family:Georgia,"Times New Roman",serif;font-size:22px;font-style:italic}.small{font-size:16px;fill:#62788a}.badge{font-size:20px;font-weight:700;fill:#18324b}.axis{stroke:#18324b;stroke-width:2.2;fill:none}.guide{stroke:#93a4b1;stroke-width:1.7;stroke-dasharray:7 6;fill:none}.grid{stroke:#dce5ec;stroke-width:1}.curve{fill:none;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.card{fill:#ffffff;stroke:#dce5ec;stroke-width:1.5}</style><rect width="1080" height="580" fill="#ffffff"/><text x="40" y="48" class="title" style="font-size:44px">로그 구간을 3/2배로 옮기기</text><text x="42" y="100" class="sub" text-anchor="start" textLength="1000" lengthAdjust="spacingAndGlyphs" style="font-size:44px">열린 구간 (3/2,3) 안의 정수는 2 하나뿐이다.</text><g data-qid="29"><rect x="75" y="120" width="930" height="150" rx="18" fill="#ffffff" stroke="#dce5ec" stroke-width="1.5"/><rect x="75" y="120" width="8" height="150" rx="4" fill="#3478a8"/><text x="105.00" y="160.00" class="badge" text-anchor="start"  style="font-size:44px">t=log x</text><text x="105.00" y="208.00" class="math" text-anchor="start"  style="font-size:44px">1&lt;t&lt;2</text><line x1="280.00" y1="225.00" x2="900.00" y2="225.00" class="axis" /><line x1="280.00" y1="225.00" x2="590.00" y2="225.00" class="shape" stroke="#3478a8" stroke-width="9" data-fact-id="open-t-interval"/><circle cx="280.00" cy="225.00" r="9.00" fill="#ffffff" stroke="#3478a8" stroke-width="2" /><circle cx="590.00" cy="225.00" r="9.00" fill="#ffffff" stroke="#3478a8" stroke-width="2" /><text x="280.00" y="255.00" class="math" text-anchor="middle"  style="font-size:44px">1</text><text x="590.00" y="255.00" class="math" text-anchor="middle"  style="font-size:44px">2</text><rect x="75" y="320" width="930" height="170" rx="18" fill="#ffffff" stroke="#dce5ec" stroke-width="1.5"/><rect x="75" y="320" width="8" height="170" rx="4" fill="#178f87"/><text x="105.00" y="360.00" class="badge" text-anchor="start"  style="font-size:44px">u=(3/2)t</text><text x="105.00" y="404.00" class="math" text-anchor="start"  style="font-size:44px">3/2&lt;u&lt;3</text><text x="105.00" y="520" class="badge" text-anchor="start"  style="font-size:44px">정수는 2뿐</text><line x1="280.00" y1="440.00" x2="900.00" y2="440.00" class="axis" /><line x1="280.00" y1="440.00" x2="900.00" y2="440.00" class="shape" stroke="#178f87" stroke-width="9" data-fact-id="open-scaled-interval"/><circle cx="280.00" cy="440.00" r="8.00" fill="#ffffff" stroke="#178f87" stroke-width="2" /><circle cx="900.00" cy="440.00" r="8.00" fill="#ffffff" stroke="#178f87" stroke-width="2" /><circle cx="486.67" cy="440.00" r="8.00" fill="#e77c45" stroke="#ffffff" stroke-width="2" data-fact-id="only-integer-two"/><text x="280.00" y="470.00" class="math" text-anchor="middle"  style="font-size:44px">3/2</text><text x="486.67" y="423.00" class="badge" text-anchor="middle"  style="font-size:44px">2</text><text x="900.00" y="470.00" class="math" text-anchor="middle"  style="font-size:44px">3</text><text x="760.00" y="565" class="badge" text-anchor="middle"  style="font-size:44px">log x=4/3 → x=10^(4/3)</text></g></svg>
