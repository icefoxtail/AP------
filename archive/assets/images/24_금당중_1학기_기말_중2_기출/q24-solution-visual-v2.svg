<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 728 692" width="728" height="692" role="img" aria-labelledby="title desc"><title id="title">같은 넓이에서 시작해 넓이비를 구하는 그림</title><desc id="desc">위에서는 AD와 BC가 평행한 사다리꼴에서 OAB와 ODC를 같은 청록으로 칠했다. 아래에서는 ABC의 꼭짓점 B에서 AOC에 이어진 선이 두 삼각형으로 나눈다. AO와 OC의 길이비는 3 대 5이다.</desc><rect width="728" height="692" fill="white" /><text x="366.0000" y="57.0000" font-size="31" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#273a49" text-anchor="middle">같은 밑변과 높이</text><polygon points="202.0000,101.0000 146.0000,300.0000 604.0000,300.0000 477.0000,101.0000" fill="#e9f4fa" /><polygon points="202.0000,101.0000 352.8186,175.6589 146.0000,300.0000" fill="#bfe3d5" /><polygon points="352.8186,175.6589 477.0000,101.0000 604.0000,300.0000" fill="#bfe3d5" /><line x1="202.0000" y1="101.0000" x2="146.0000" y2="300.0000" stroke="#24659b" stroke-width="4.4" stroke-linecap="round" /><line x1="146.0000" y1="300.0000" x2="604.0000" y2="300.0000" stroke="#24659b" stroke-width="4.4" stroke-linecap="round" /><line x1="604.0000" y1="300.0000" x2="477.0000" y2="101.0000" stroke="#24659b" stroke-width="4.4" stroke-linecap="round" /><line x1="477.0000" y1="101.0000" x2="202.0000" y2="101.0000" stroke="#24659b" stroke-width="4.4" stroke-linecap="round" /><line x1="202.0000" y1="101.0000" x2="604.0000" y2="300.0000" stroke="#207164" stroke-width="4.25" stroke-linecap="round" /><line x1="146.0000" y1="300.0000" x2="477.0000" y2="101.0000" stroke="#774898" stroke-width="4.25" stroke-linecap="round" /><line x1="333.5000" y1="95.0000" x2="342.5000" y2="101.0000" stroke="#24659b" stroke-width="2.55" stroke-linecap="round" /><line x1="333.5000" y1="107.0000" x2="342.5000" y2="101.0000" stroke="#24659b" stroke-width="2.55" stroke-linecap="round" /><line x1="369.0000" y1="294.0000" x2="378.0000" y2="300.0000" stroke="#24659b" stroke-width="2.55" stroke-linecap="round" /><line x1="369.0000" y1="306.0000" x2="378.0000" y2="300.0000" stroke="#24659b