<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 625 528" width="625" height="528" role="img" aria-labelledby="title desc"><title id="title">두 번 접은 종이와 자르는 사선</title><desc id="desc">두 번 접혀 여러 겹인 종이가 있다. 왼쪽 접힌 쪽과 아래쪽을 잇는 자르는 선분의 길이는 7 cm이며 왼쪽 접힌 변과 만드는 각은 25도이다.</desc><rect width="625" height="528" fill="white" /><rect x="176" y="83" width="309" height="343" rx="5" fill="#e7edf6" stroke="#6a7e94" stroke-width="2.2" /><rect x="164" y="94" width="309" height="343" rx="5" fill="#ecf3fa" stroke="#6a7e94" stroke-width="2.2" /><rect x="148" y="106" width="309" height="343" rx="5" fill="#f2f7fb" stroke="#24659b" stroke-width="4.3" /><line x1="148.0000" y1="117.0000" x2="148.0000" y2="440.0000" stroke="#207164" stroke-width="4.45" stroke-linecap="round" /><line x1="154.0000" y1="449.0000" x2="453.0000" y2="449.0000" stroke="#207164" stroke-width="4.45" stroke-linecap="round" /><polygon points="148.0000,171.0000 148.0000,449.0000 277.6335,449.0000" fill="#ddf0e8" /><line x1="148.0000" y1="171.0000" x2="277.6335" y2="449.0000" stroke="#774898" stroke-width="5.1" stroke-linecap="round" stroke-dasharray="10 6" /><path d="M 174.202 227.191 A 62 62 0 0 1 148.000 233.000" fill="none" stroke="#774898" stroke-width="2.6" /><text x="105.0000" y="263.0000" font-size="31" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#774898" text-anchor="middle">25°</text><line x1="137.0000" y1="247.0000" x2="153.0000" y2="234.0000" stroke="#774898" stroke-width="1.6" stroke-linecap="round" /><line x1="220.5948" y1="326.6800" x2="258.5948" y2="304.6800" stroke="#774898" stroke-width="1.8" stroke-linecap="round" /><text x="315.5948" y="298.6800" font-size="31" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#774898" text-anchor="middle">7 cm</text></svg>
