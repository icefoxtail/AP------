<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1120" viewBox="0 0 900 1120" role="img" aria-labelledby="title desc">
<title id="title">넓이의 같음과 3:5 분할</title><desc id="desc">평행한 밑변을 가진 두 큰 삼각형에서 공통 삼각형 OBC를 빼면 OAB와 ODC의 넓이가 같다. 이어 AO와 OC의 비 3:5로 삼각형 ABC의 넓이를 나누어 OBC의 넓이 20제곱센티미터를 구한다.</desc>
<style>text{font-family:'Malgun Gothic','Noto Sans KR','Apple SD Gothic Neo',sans-serif;fill:#172033}.title{font-size:34px;font-weight:700}.subtitle{font-size:20px;fill:#475569}.card{fill:#fff;stroke:#cbd5e1;stroke-width:2}.heading{font-size:24px;font-weight:700}.body{font-size:20px}.math{font-size:22px;font-family:'Malgun Gothic','Noto Sans KR',sans-serif}.strong{font-size:23px;font-weight:700}.label{font-size:20px;font-weight:600}.base{stroke:#172033;stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round}.diag{stroke:#334155;stroke-width:3;fill:none;stroke-linecap:round}.given{stroke:#2563eb;stroke-width:6;fill:none;stroke-linecap:round}.triangle-blue{fill:#dbeafe;stroke:none}.triangle-orange{fill:#ffedd5;stroke:none}.triangle-neutral{fill:#f1f5f9;stroke:none}.point{fill:#172033}.given-text{fill:#1d4ed8;font-weight:700}.derived-text{fill:#0f766e;font-weight:700}.answer{fill:#7c3aed;font-weight:700}.parallel{stroke:#0f766e;stroke-width:2.5;fill:none;stroke-linecap:round;stroke-linejoin:round}.rule{stroke:#e2e8f0;stroke-width:2}.bar-blue{fill:#93c5fd}.bar-orange{fill:#fdba74}.bar-line{stroke:#fff;stroke-width:3}</style>
<rect width="900" height="1120" fill="#f8fafc"/><text id="title" x="42" y="58" class="title">넓이의 같음과 3:5 분할</text><text x="42" y="92" class="subtitle">평행선으로 넓이를 보존한 뒤, 밑변의 비로 남은 넓이를 구합니다.</text>
<rect x="28" y="122" width="844" height="460" rx="22" class="card"/><text x="54" y="164" class="heading">① 공통 △OBC를 빼면 두 넓이가 같다</text>
<!-- Exact, asymmetric model: A=(2/5,4), D=(17/5,4), B=(0,0), C=(5,0), O=(17/8,5/2). -->
<polygon points="120.8,290 245,372.5 92,510" class="triangle-blue"/><polygon points="245,372.5 92,510 452,510" class="triangle-orange"/><polygon points="245,372.5 336.8,290 452,510" class="triangle-blue"/><polygon points="120.8,290 336.8,290 245,372.5" class="triangle-neutral"/>
<path d="M120.8 290 L336.8 290 L452 510 L92 510 Z" class="base"/><path d="M120.8 290 L452 510 M92 510 L336.8 290" class="diag"/>
<!-- Matching local chevrons mark only the given parallel bases; no side-congruence is implied. -->
<path d="M245 282 L253 290 L245 298 M255 282 L263 290 L255 298 M245 502 L253 510 L245 518 M255 502 L263 510 L255 518" class="parallel"/>
<circle cx="120.8" cy="290" r="4.5" class="point"/><circle cx="336.8" cy="290" r="4.5" class="point"/><circle cx="92" cy="510" r="4.5" class="point"/><circle cx="452" cy="510" r="4.5" class="point"/><circle cx="245" cy="372.5" r="5" class="point"/>
<text x="99" y="276" class="label">A</text><text x="345" y="276" class="label">D</text><text x="68" y="536" class="label">B</text><text x="458" y="536" class="label">C</text><text x="254" y="368" class="label">O</text><text x="72" y="214" class="body derived-text">AD ∥ BC</text>
<line x1="474" y1="192" x2="474" y2="548" class="rule"/>
<text x="500" y="226" class="body">같은 밑변 BC, 같은 높이</text><text x="500" y="260" class="math">S(△ABC) = S(△DBC)</text>
<text x="500" y="316" class="math">S(△ABC)</text><text x="500" y="346" class="math">= S(△OAB) + S(△OBC)</text>
<text x="500" y="392" class="math">S(△DBC)</text><text x="500" y="422" class="math">= S(△ODC) + S(△OBC)</text>
<text x="500" y="468" class="body">공통인 △OBC의 넓이를 빼면</text><text x="500" y="508" class="strong answer">S(△OAB) = S(△ODC) = 12cm²</text>
<rect x="28" y="604" width="844" height="484" rx="22" class="card"/><text x="54" y="646" class="heading">② AO:OC=3:5로 △ABC의 넓이를 나눈다</text>
<!-- Triangle ABC is the same asymmetric geometry model; no isosceles or right-angle relation is added. -->
<polygon points="120.8,740 245,822.5 92,960" class="triangle-blue"/><polygon points="245,822.5 92,960 452,960" class="triangle-orange"/><path d="M120.8 740 L92 960 L452 960 Z" class="base"/><path d="M120.8 740 L452 960" class="given"/><path d="M92 960 L245 822.5" class="diag"/>
<circle cx="120.8" cy="740" r="4.5" class="point"/><circle cx="92" cy="960" r="4.5" class="point"/><circle cx="452" cy="960" r="4.5" class="point"/><circle cx="245" cy="822.5" r="5" class="point"/>
<text x="99" y="726" class="label">A</text><text x="68" y="986" class="label">B</text><text x="458" y="986" class="label">C</text><text x="254" y="818" class="label">O</text><text x="162" y="768" class="body given-text">AO:OC = 3:5</text>
<line x1="474" y1="674" x2="474" y2="1052" class="rule"/>
<text x="500" y="708" class="body">같은 높이를 이용한 넓이비</text><text x="500" y="746" class="math">S(△OAB):S(△OBC)</text><text x="500" y="778" class="math">= AO:OC = 3:5</text>
<text x="500" y="824" class="body">3칸이 12cm²이므로</text>
<rect x="500" y="842" width="45" height="34" rx="4" class="bar-blue"/><rect x="545" y="842" width="45" height="34" rx="4" class="bar-blue"/><rect x="590" y="842" width="45" height="34" rx="4" class="bar-blue"/><rect x="635" y="842" width="45" height="34" rx="4" class="bar-orange"/><rect x="680" y="842" width="45" height="34" rx="4" class="bar-orange"/><rect x="725" y="842" width="45" height="34" rx="4" class="bar-orange"/><rect x="770" y="842" width="45" height="34" rx="4" class="bar-orange"/><rect x="815" y="842" width="45" height="34" rx="4" class="bar-orange"/>
<path d="M545 842 V876 M590 842 V876 M635 842 V876 M680 842 V876 M725 842 V876 M770 842 V876 M815 842 V876" class="bar-line"/>
<text x="500" y="904" class="body given-text">3칸 = 12</text><text x="680" y="904" class="body derived-text">5칸 = 20</text><text x="500" y="946" class="math">S(△ABC) = 12 × 8/3 = 32</text><text x="500" y="990" class="strong answer">S(△OBC) = 32 − 12 = 20cm²</text>
</svg>
