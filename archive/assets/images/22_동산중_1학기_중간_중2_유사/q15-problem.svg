<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">왼쪽은 밑면의 반지름이 3a²b이고 높이가 2ab³인 원기둥을 옆에서 본 모양, 오른쪽은 밑면의 반지름이 ab이고 높이가 6a³b³인 원뿔을 옆에서 본 모양이다.</title><desc id="visual-desc">왼쪽에는 직사각형, 오른쪽에는 밑변이 수평이고 꼭짓점이 위에 있는 삼각형이 보인다. 왼쪽에는 반지름 3a²b와 높이 2ab³, 오른쪽에는 반지름 ab와 높이 6a³b³이 적혀 있다.</desc><rect width="640" height="400" fill="#fff"/><g data-layer="30"><line id="b1" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="63.656877943" y1="302.014755234" x2="268.731375589" y2="302.014755234"/></g><g data-layer="30"><line id="t1" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="63.656877943" y1="96.940257588" x2="268.731375589" y2="96.940257588"/></g><g data-layer="30"><line id="l1" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="63.656877943" y1="302.014755234" x2="63.656877943" y2="96.940257588"/></g><g data-layer="30"><line id="r1" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="268.731375589" y1="302.014755234" x2="268.731375589" y2="96.940257588"/></g><g data-layer="30"><line id="b2" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="371.268624411" y1="302.014755234" x2="576.343122057" y2="302.014755234"/></g><g data-layer="30"><line id="l2" data-role="line" stroke="#111" stroke-width="1