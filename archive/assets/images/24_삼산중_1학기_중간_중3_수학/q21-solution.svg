<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" role="img" aria-labelledby="title desc">
<title id="title">두 점의 대응값으로 비 구하기 풀이</title><desc id="desc">그림과 풀이의 핵심 계산을 나타냅니다.</desc>
<rect width="960" height="500" fill="#ffffff"/>
<style>text{font-family:'Noto Sans CJK KR','Noto Sans KR',sans-serif;fill:#17233d} .title{font-size:25px;font-weight:700} .label{font-size:19px} .small{font-size:17px} .eq{font-size:21px;font-weight:600} .line{stroke:#243b64;stroke-width:4;stroke-linecap:round;stroke-linejoin:round} .thin{stroke:#52627e;stroke-width:2.5;stroke-linecap:round} .fill{fill:#e8f1fb;stroke:#243b64;stroke-width:3} .card{fill:#f4f7fb;stroke:#d2dceb;stroke-width:2}</style>
<text class="title" x="480" y="38" text-anchor="middle">두 점의 대응값으로 비 구하기 풀이 그림</text>
<line x1="110" y1="210" x2="850" y2="210" class="line"/><path d="M850 210 l−18 −10 m18 10 l−18 10" class="line" fill="none"/><line x1="218" y1="194" x2="218" y2="226" class="thin"/><line x1="270" y1="194" x2="270" y2="226" class="thin"/><line x1="400" y1="194" x2="400" y2="226" class="thin"/><line x1="584" y1="194" x2="584" y2="226" class="thin"/><text class="label" x="218" y="254" text-anchor="middle">Q</text><text class="label" x="270" y="254" text-anchor="middle">0</text><text class="label" x="400" y="254" text-anchor="middle">A</text><text class="small" x="400" y="284" text-anchor="middle">2</text><text class="label" x="584" y="254" text-anchor="middle">P</text><text class="small" x="310" y="127" text-anchor="middle">AP = AQ = 2√2</text><rect class="card" x="80" y="324" width="800" height="136" rx="14"/><text class="eq" x="480" y="365" text-anchor="middle">a = 2 + 2√2,   b = 2 − 2√2</text><text class="eq" x="480" y="408" text-anchor="middle">b/a = (1−√2)/(1+√2) = 2√2−3</text><text class="small" x="480" y="440" text-anchor="middle">분모에 켤레식 1−√2를 곱해 정리합니다.</text></svg>