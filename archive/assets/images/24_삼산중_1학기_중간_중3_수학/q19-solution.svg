<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" role="img" aria-labelledby="title desc">
<title id="title">남은 넓이 인수분해하기 풀이</title><desc id="desc">그림과 풀이의 핵심 계산을 나타냅니다.</desc>
<rect width="960" height="500" fill="#ffffff"/>
<style>text{font-family:'Noto Sans CJK KR','Noto Sans KR',sans-serif;fill:#17233d} .title{font-size:25px;font-weight:700} .label{font-size:19px} .small{font-size:17px} .eq{font-size:21px;font-weight:600} .line{stroke:#243b64;stroke-width:4;stroke-linecap:round;stroke-linejoin:round} .thin{stroke:#52627e;stroke-width:2.5;stroke-linecap:round} .fill{fill:#e8f1fb;stroke:#243b64;stroke-width:3} .card{fill:#f4f7fb;stroke:#d2dceb;stroke-width:2}</style>
<text class="title" x="480" y="38" text-anchor="middle">남은 넓이 인수분해하기 풀이 그림</text>
<rect x="145" y="91" width="430" height="265" fill="#f7f9fc" class="line"/><rect x="145" y="246" width="110" height="110" class="fill"/><rect x="275" y="246" width="110" height="110" class="fill"/><text class="small" x="200" y="305" text-anchor="middle">y × y</text><text class="small" x="330" y="305" text-anchor="middle">y × y</text><text class="label" x="360" y="384" text-anchor="middle">가로 x</text><text class="label" x="594" y="229">세로 x−y</text><text class="small" x="430" y="210" text-anchor="middle">남은 부분</text><rect class="card" x="90" y="425" width="780" height="54" rx="14"/><text class="eq" x="480" y="453" text-anchor="middle">남은 넓이 = x(x−y)−2y² = x²−xy−2y² = (x+y)(x−2y)</text></svg>