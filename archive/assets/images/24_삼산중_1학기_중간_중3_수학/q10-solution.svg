<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" role="img" aria-labelledby="title desc">
<title id="title">넓이를 같게 놓아 가로 길이 구하기 풀이</title><desc id="desc">그림과 풀이의 핵심 계산을 나타냅니다.</desc>
<rect width="960" height="500" fill="#ffffff"/>
<style>text{font-family:'Noto Sans CJK KR','Noto Sans KR',sans-serif;fill:#17233d} .title{font-size:25px;font-weight:700} .label{font-size:19px} .small{font-size:17px} .eq{font-size:21px;font-weight:600} .line{stroke:#243b64;stroke-width:4;stroke-linecap:round;stroke-linejoin:round} .thin{stroke:#52627e;stroke-width:2.5;stroke-linecap:round} .fill{fill:#e8f1fb;stroke:#243b64;stroke-width:3} .card{fill:#f4f7fb;stroke:#d2dceb;stroke-width:2}</style>
<text class="title" x="480" y="38" text-anchor="middle">넓이를 같게 놓아 가로 길이 구하기 풀이 그림</text>
<g transform="translate(0,8)"><polygon points="120,300 390,300 210,120" fill="#f6f8fc" class="line"/><line x1="210" y1="120" x2="210" y2="300" class="thin" stroke-dasharray="7 6"/><path d="M210 284 h16 v16" fill="none" class="thin"/><text class="label" x="255" y="331" text-anchor="middle">밑변 6√3 cm</text><text class="label" x="154" y="205" text-anchor="end">높이 4 cm</text><rect x="545" y="180" width="280" height="120" class="fill"/><text class="label" x="838" y="242">세로 3 cm</text><text class="label" x="685" y="331" text-anchor="middle">가로 w cm</text></g><rect class="card" x="80" y="365" width="800" height="104" rx="14"/><text class="eq" x="480" y="401" text-anchor="middle">삼각형 넓이 = ½ × 6√3 × 4 = 12√3 cm²</text><text class="eq" x="480" y="439" text-anchor="middle">3w = 12√3 이므로 w = 4√3 cm</text></svg>