<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" role="img" aria-labelledby="title desc">
<title id="title">부피와 겉넓이 계산 풀이</title><desc id="desc">그림과 풀이의 핵심 계산을 나타냅니다.</desc>
<rect width="960" height="500" fill="#ffffff"/>
<style>text{font-family:'Noto Sans CJK KR','Noto Sans KR',sans-serif;fill:#17233d} .title{font-size:25px;font-weight:700} .label{font-size:19px} .small{font-size:17px} .eq{font-size:21px;font-weight:600} .line{stroke:#243b64;stroke-width:4;stroke-linecap:round;stroke-linejoin:round} .thin{stroke:#52627e;stroke-width:2.5;stroke-linecap:round} .fill{fill:#e8f1fb;stroke:#243b64;stroke-width:3} .card{fill:#f4f7fb;stroke:#d2dceb;stroke-width:2}</style>
<text class="title" x="480" y="38" text-anchor="middle">부피와 겉넓이 계산 풀이 그림</text>
<path d="M145 145 L500 145 L500 360 L145 360 Z M145 145 L245 78 L600 78 L500 145 M500 145 L600 78 L600 293 L500 360 M145 360 L245 293 L600 293" fill="#f6f8fc" class="line"/><path d="M245 78 L245 293" class="thin"/><text class="label" x="325" y="395" text-anchor="middle">(√6+√8) cm</text><text class="label" x="526" y="255">√6 cm</text><text class="label" x="112" y="116">√8 cm</text><rect class="card" x="650" y="96" width="250" height="264" rx="14"/><text class="eq" x="775" y="135" text-anchor="middle">부피</text><text class="small" x="775" y="177" text-anchor="middle">(√6+√8)√6√8</text><text class="small" x="775" y="211" text-anchor="middle">= 12√2 + 8√6 cm³</text><text class="eq" x="775" y="262" text-anchor="middle">겉넓이</text><text class="small" x="775" y="303" text-anchor="middle">2(ab+bc+ca)</text><text class="small" x="775" y="336" text-anchor="middle">= 28 + 24√3 cm²</text></svg>