<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" role="img" aria-labelledby="title desc">
<title id="title">정사각형의 한 변의 길이 더하기 풀이</title><desc id="desc">그림과 풀이의 핵심 계산을 나타냅니다.</desc>
<rect width="960" height="500" fill="#ffffff"/>
<style>text{font-family:'Noto Sans CJK KR','Noto Sans KR',sans-serif;fill:#17233d} .title{font-size:25px;font-weight:700} .label{font-size:19px} .small{font-size:17px} .eq{font-size:21px;font-weight:600} .line{stroke:#243b64;stroke-width:4;stroke-linecap:round;stroke-linejoin:round} .thin{stroke:#52627e;stroke-width:2.5;stroke-linecap:round} .fill{fill:#e8f1fb;stroke:#243b64;stroke-width:3} .card{fill:#f4f7fb;stroke:#d2dceb;stroke-width:2}</style>
<text class="title" x="480" y="38" text-anchor="middle">정사각형의 한 변의 길이 더하기 풀이 그림</text>
<rect x="140" y="192" width="110" height="110" class="fill"/><rect x="407.5" y="137" width="165" height="165" class="fill"/><rect x="680" y="82" width="220" height="220" class="fill"/><text class="small" x="195" y="249" text-anchor="middle">넓이 8 cm²</text><text class="small" x="490" y="224" text-anchor="middle">넓이 18 cm²</text><text class="small" x="790" y="210" text-anchor="middle">넓이 32 cm²</text><rect class="card" x="90" y="334" width="780" height="130" rx="14"/><text class="eq" x="480" y="375" text-anchor="middle">한 변의 길이의 합 = √8 + √18 + √32</text><text class="eq" x="480" y="416" text-anchor="middle">= 2√2 + 3√2 + 4√2 = 9√2 cm</text></svg>