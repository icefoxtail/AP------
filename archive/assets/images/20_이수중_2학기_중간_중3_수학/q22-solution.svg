<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" role="img" aria-labelledby="t d"><title id="t">22번 풀이: 클리노미터로 높이 측정</title><desc id="d">중3 삼각비 풀이 보조도. 도형은 표시된 조건을 따르며, 모양은 축척에 맞지 않을 수 있다.</desc><style>text{font-family:Arial,"Noto Sans KR",sans-serif;font-size:18px;fill:#182230}.thin{stroke:#667085;stroke-width:2;fill:none}.main{stroke:#182230;stroke-width:3;fill:none}.aux{stroke:#d97706;stroke-width:2.5;stroke-dasharray:7 5;fill:none}.shade{fill:#eff6ff;stroke:#182230;stroke-width:3}.mark{stroke:#344054;stroke-width:2;fill:none}</style><path class="main" d="M450 60 L450 335 L90 335"/><path class="aux" d="M180 335 L180 265 L450 60"/><path class="thin" d="M180 265 L450 265"/><path class="mark" d="M438 335 L438 323 L450 323"/><circle cx="180" cy="265" r="6" fill="#182230"/><text x="431" y="52">T</text><text x="458" y="340">C</text><text x="163" y="258">A</text><text x="287" y="355">d</text><text x="152" y="305">h</text><text x="215" y="254">θ</text><text x="490" y="210">H</text><text x="18" y="385">tan θ = (H−h)/d, 따라서 H=h+d tan θ</text></svg>