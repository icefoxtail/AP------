<svg xmlns="http://www.w3.org/2000/svg" width="500" height="400" viewBox="0 0 500 400" role="img" aria-labelledby="t d"><title id="t">18번 사각형 ABCD의 길이와 각</title><desc id="d">사각형 ABCD에서 AB=6 cm, BC=8 cm, ∠ABC=60°, AD=2√3 cm, DC=4 cm, ∠ADC=150°를 표시한 문제 그림. 도형은 표시된 조건을 따르며 모양은 축척에 맞지 않을 수 있다.</desc><style>text{font-family:Arial,"Noto Sans KR",sans-serif;font-size:18px;fill:#182230}.thin{stroke:#667085;stroke-width:2;fill:none}.main{stroke:#182230;stroke-width:3;fill:none}.aux{stroke:#d97706;stroke-width:2.5;stroke-dasharray:7 5;fill:none}.shade{fill:#eff6ff;stroke:#182230;stroke-width:3}.mark{stroke:#344054;stroke-width:2;fill:none}</style><path class="shade" d="M80 330 L80 150 L287.846 270 L183.923 330 Z"/><path class="thin" d="M100.8 162 A24 24 0 0 1 80 174 M159.923 330 A24 24 0 0 1 204.707 318"/><text x="60" y="335">A</text><text x="60" y="145">B</text><text x="294" y="279">C</text><text x="180" y="352">D</text><text x="112" y="235">AB=6 cm</text><text x="205" y="205">BC=8 cm</text><text x="89" y="205">60°</text><text x="194" y="320">AD=2√3 cm</text><text x="262" y="272">DC=4 cm</text><text x="174" y="290">150°</text></svg>