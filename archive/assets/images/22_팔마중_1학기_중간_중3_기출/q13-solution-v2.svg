<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 384 320" width="384" height="320" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">왼쪽 직사각형은 가로a+b,세로a−b이므로 넓이(a+b)(a−b)이다. 같은 절단선으로 나눈 두 조각을 재배열하면 오른쪽처럼 한 변a의 정사각형에서 한 변b의 점선 정사각형을 뺀 도형이 된다. 두 도형은 같은 단위로 그렸고 조각을 뒤집어 옮길 뿐 넓이는 그대로다. 따라서(a+b)(a−b)=a²−b². 정답②. 배치에는a=5,b=2의 비율을 예시로 사용했으며 일반식은모든a&gt;b&gt;0에서성립한다.</title><desc id="visual-desc">점과 도형의 관계를 확인한다.</desc><rect width="384" height="320" fill="#fff"/><g data-layer="30"><line id="AB" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="67" y1="204.642857143" x2="192" y2="204.642857143"/></g><g data-layer="30"><line id="BC" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="192" y1="204.642857143" x2="192" y2="151.071428571"/></g><g data-layer="30"><line id="CD" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="192" y1="151.071428571" x2="67" y2="151.071428571"/></g><g data-layer="30"><line id="DA" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="67" y1="151.071428571" x2="67" y2="204.642857143"/></g><g data-layer="30"><line id="EF" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="102.714285714" y1="151.071428571" x2="156.285714286" y2="204.642857143"/></g><g data-layer="30"><line id="DE" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="67" y1