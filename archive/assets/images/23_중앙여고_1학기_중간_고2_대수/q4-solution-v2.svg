<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 328" width="512" height="328" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">양변에 밑이 2인 로그를 취하고 t=log₂x로 두면 t²−2t−log₂k≥0이 모든 실수 t에서 성립해야 한다. h는 그 이차식의 경계 예 k=1/2일 때 h(t)=t²−2t+1의 그래프로 꼭짓점 V(1, 0)에서 t축에 접한다. 포물선이 t축 아래로 내려가지 않으려면 t축과 만나지 않거나 접해야 하므로 D/4=1+log₂k≤0이다. 따라서 0&lt;k≤1/2이고 답은 ①이다.</title><desc id="visual-desc">아래로 볼록한 포물선이 가로축에 꼭짓점 V에서 접해 있고, V의 좌표가 표시되어 있다. 포물선의 나머지 부분은 모두 가로축 위쪽에 있다.</desc><rect width="512" height="328" fill="#fff"/><g data-layer="30"><line id="x-axis" data-role="axis" stroke="#111" stroke-width="1.2" fill="none" data-axis="x" x1="32" y1="256" x2="480" y2="256"/></g><g data-layer="30"><line id="y-axis" data-role="axis" stroke="#111" stroke-width="1.2" fill="none" data-axis="y" x1="72" y1="296" x2="72" y2="32"/></g><g data-layer="30"><line id="model-x-unit" data-role="tick" stroke="#111" stroke-width="0.8" fill="none" data-axis="x" data-value="1.0" data-required-label-id="tick-x-1-label" x1="256" y1="256" x2="256" y2="260"/></g><g data-layer="40"><polyline id="f-piece-1-branch-0" data-role="curve" stroke="#111" stroke-width="2.1" fill="none" data-branch="PIECE_1" points="72,72 73.230769231,74.453305891 74.461538462,76.890146643 75.692307692,79.310522254 76.923076923,81.714432724 78.153846154,84.101878055 79.384615385,86.472858245 80.615384615,88.82737329