<svg xmlns="http://www.w3.org/2000/svg" width="760" height="480" viewBox="0 0 760 480"><defs><style>.bg{fill:#f8fafc}.card{fill:#fff;stroke:#cbd5e1;stroke-width:2}.title{font:700 27px 'Noto Sans KR','Malgun Gothic',sans-serif;fill:#0f172a}.label{font:600 20px 'Noto Sans KR','Malgun Gothic',sans-serif;fill:#1e293b}.small{font:500 16px 'Noto Sans KR','Malgun Gothic',sans-serif;fill:#475569}.math{font:600 22px 'Cambria Math','Times New Roman',serif;fill:#0f172a}</style></defs><rect class="bg" width="760" height="480" rx="22"/><text class="title" x="34" y="48">최단 경로는 대각선을 한 번 사용</text><text class="small" x="36" y="82">빨간 대각선은 서로 이어서 두 번 쓸 수 없습니다.</text><rect class="card" x="28" y="105" width="400" height="334" rx="18"/><line x1="58" y1="132" x2="58" y2="402" stroke="#64748b" stroke-width="2"/><line x1="58" y1="132" x2="328" y2="132" stroke="#64748b" stroke-width="2"/><circle cx="58" cy="132" r="4" fill="#334155"/><circle cx="125.5" cy="132" r="4" fill="#334155"/><circle cx="193" cy="132" r="4" fill="#334155"/><circle cx="260.5" cy="132" r="4" fill="#334155"/><circle cx="328" cy="132" r="4" fill="#334155"/><line x1="125.5" y1="132" x2="125.5" y2="402" stroke="#64748b" stroke-width="2"/><line x1="58" y1="199.5" x2="328" y2="199.5" stroke="#64748b" stroke-width="2"/><circle cx="58" cy="199.5" r="4" fill="#334155"/><circle cx="125.5" cy="199.5" r="4" fill="#334155"/><circle cx="193" cy="199.5" r="4" fill="#334155"/><circle cx="260.5" cy="199.5" r="4" fill="#334155"/><circle cx="328" cy="199.5" r="4" fill="#334155"/><line x1="193" y1="132" x2="193" y2="402" stroke="#64748b" stroke-width="2"/><line x1="58" y1="267" x2="328" y2="267" stroke="#64748b" stroke-width="2"/><circle cx="58" cy="267" r="4" fill="#334155"/><circle cx="125.5" cy="267" r="4" fill="#334155"/><circle cx="193" cy="267" r="4" fill="#334155"/><circle cx="260.5" cy="267" r="4" fill="#334155"/><circle cx="328" cy="267" r="4" fill="#334155"/><line x1="260.5" y1="132" x2="260.5" y2="402" stroke="#64748b" stroke-width="2"/><line x1="58" y1="334.5" x2="328" y2="334.5" stroke="#64748b" stroke-width="2"/><circle cx="58" cy="334.5" r="4" fill="#334155"/><circle cx="125.5" cy="334.5" r="4" fill="#334155"/><circle cx="193" cy="334.5" r="4" fill="#334155"/><circle cx="260.5" cy="334.5" r="4" fill="#334155"/><circle cx="328" cy="334.5" r="4" fill="#334155"/><line x1="328" y1="132" x2="328" y2="402" stroke="#64748b" stroke-width="2"/><line x1="58" y1="402" x2="328" y2="402" stroke="#64748b" stroke-width="2"/><circle cx="58" cy="402" r="4" fill="#334155"/><circle cx="125.5" cy="402" r="4" fill="#334155"/><circle cx="193" cy="402" r="4" fill="#334155"/><circle cx="260.5" cy="402" r="4" fill="#334155"/><circle cx="328" cy="402" r="4" fill="#334155"/><line x1="125.5" y1="199.5" x2="193" y2="132" stroke="#dc2626" stroke-width="6" stroke-linecap="round"/><line x1="193" y1="267" x2="260.5" y2="199.5" stroke="#dc2626" stroke-width="6" stroke-linecap="round"/><line x1="260.5" y1="334.5" x2="328" y2="267" stroke="#dc2626" stroke-width="6" stroke-linecap="round"/><text class="label" x="42" y="420">A</text><text class="label" x="326" y="128">B</text><rect class="card" x="452" y="105" width="280" height="334" rx="18"/><text class="label" x="478" y="150">대각선별 경우</text><text class="math" x="480" y="205">첫째: 4</text><text class="math" x="480" y="250">가운데: 12</text><text class="math" x="480" y="295">셋째: 4</text><line x1="478" y1="320" x2="705" y2="320" stroke="#cbd5e1" stroke-width="2"/><text class="math" x="480" y="367">4 + 12 + 4 = 20</text><text class="small" x="480" y="405">A에서 B까지</text></svg>
