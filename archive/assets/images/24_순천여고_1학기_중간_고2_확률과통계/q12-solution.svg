<svg xmlns="http://www.w3.org/2000/svg" width="760" height="410" viewBox="0 0 760 410"><defs><style>.bg{fill:#f8fafc}.card{fill:#fff;stroke:#cbd5e1;stroke-width:2}.title{font:700 27px 'Noto Sans KR','Malgun Gothic',sans-serif;fill:#0f172a}.label{font:600 20px 'Noto Sans KR','Malgun Gothic',sans-serif;fill:#1e293b}.small{font:500 16px 'Noto Sans KR','Malgun Gothic',sans-serif;fill:#475569}.math{font:600 22px 'Cambria Math','Times New Roman',serif;fill:#0f172a}.edge{stroke:#64748b;stroke-width:5;stroke-linecap:round}.hot{stroke:#dc2626;stroke-width:8;stroke-linecap:round}.node{fill:#fff;stroke:#334155;stroke-width:3}.hotnode{fill:#fff7ed;stroke:#dc2626;stroke-width:4}</style></defs><rect class="bg" width="760" height="410" rx="22"/><text class="title" x="34" y="48">합이 10 이상인 이웃쌍</text><text class="small" x="36" y="82">1부터 6까지에서 가능한 쌍은 4·6과 5·6뿐입니다.</text><rect class="card" x="28" y="112" width="220" height="210" rx="18"/><text class="label" x="50" y="148">사건 A</text><circle class="node" cx="88" cy="220" r="34"/><circle class="hotnode" cx="190" cy="220" r="34"/><line class="hot" x1="122" y1="220" x2="156" y2="220"/><text class="math" x="77" y="227">4</text><text class="math" x="179" y="227">6</text><text class="small" x="60" y="286">4 + 6 = 10</text><rect class="card" x="270" y="112" width="220" height="210" rx="18"/><text class="label" x="292" y="148">사건 B</text><circle class="node" cx="330" cy="220" r="34"/><circle class="hotnode" cx="432" cy="220" r="34"/><line class="hot" x1="364" y1="220" x2="398" y2="220"/><text class="math" x="319" y="227">5</text><text class="math" x="421" y="227">6</text><text class="small" x="302" y="286">5 + 6 = 11</text><rect class="card" x="512" y="112" width="220" height="210" rx="18"/><text class="label" x="534" y="148">겹치는 경우</text><circle class="node" cx="566" cy="220" r="29"/><circle class="hotnode" cx="622" cy="220" r="29"/><circle class="node" cx="678" cy="220" r="29"/><line class="hot" x1="595" y1="220" x2="593" y2="220"/><line class="hot" x1="651" y1="220" x2="649" y2="220"/><text class="math" x="556" y="227">4</text><text class="math" x="612" y="227">6</text><text class="math" x="668" y="227">5</text><text class="small" x="533" y="286">4–6–5가 연속</text><text class="math" x="110" y="370">|A ∪ B| = 48 + 48 − 12 = 84</text></svg>
