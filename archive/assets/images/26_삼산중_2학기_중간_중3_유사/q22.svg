<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 280" width="440" height="280" role="img" aria-labelledby="q22.svg-title q22.svg-desc">
  <title id="q22.svg-title">기울어진 건축물의 높이</title>
  <desc id="q22.svg-desc">AB=48m이고 탑의 꼭대기 C를 올려다본 각이 45도, 탑의 경사각이 85도일 때 탑의 높이 CD</desc>
  <rect width="100%" height="100%" fill="#ffffff"/>
  
  <!-- Ground line -->
  <line x1="40" y1="220" x2="400" y2="220" stroke="#222222" stroke-width="2"/>
  
  <!-- D=(250, 220), C=(250, 70) [height 150]. A=(100, 220) [dist 150, 45 deg]. B=(264, 220) [dist 14, 85 deg] -->
  <line x1="100" y1="220" x2="250" y2="70" stroke="#0066cc" stroke-width="1.8"/>
  <line x1="250" y1="70" x2="250" y2="220" stroke="#e60000" stroke-width="2.2"/>
  <line x1="250" y1="70" x2="265" y2="220" stroke="#222222" stroke-width="3"/>
  
  <rect x="236" y="206" width="14" height="14" fill="none" stroke="#222222" stroke-width="1.2"/>
  
  <circle cx="100" cy="220" r="3.5" fill="#222222"/>
  <text x="94" y="240" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222222">A</text>
  
  <circle cx="250" cy="70" r="3.5" fill="#222222"/>
  <text x="245" y="58" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222222">C</text>
  
  <circle cx="250" cy="220" r="3" fill="#222222"/>
  <text x="242" y="240" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222222">D</text>
  
  <circle cx="265" cy="220" r="3" fill="#222222"/>
  <text x="268" y="240" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222222">B</text>
  
  <path d="M 130,220 A 30 30 0 0 0 121,199" fill="none" stroke="#222222" stroke-width="1.2"/>
  <text x="135" y="210" font-family="sans-serif" font-size="13" fill="#222222">45°</text>
  
  <text x="170" y="255" font-family="sans-serif" font-size="14" fill="#222222">48 m</text>
</svg>
