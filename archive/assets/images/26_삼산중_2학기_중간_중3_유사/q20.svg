<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 300" width="420" height="300" role="img" aria-labelledby="q20.svg-title q20.svg-desc">
  <title id="q20.svg-title">직각삼각형의 내접원</title>
  <desc id="q20.svg-desc">각 A가 90도인 직각삼각형 ABC의 내접원 O와 접점 D, E, F, 그리고 BD=3, CE=10</desc>
  <rect width="100%" height="100%" fill="#ffffff"/>
  
  <!-- Right triangle: A=(80, 220), B=(80, 70), C=(340, 220) -->
  <polygon points="80,220 80,70 340,220" fill="none" stroke="#222222" stroke-width="2"/>
  <rect x="80" y="206" width="14" height="14" fill="none" stroke="#222222" stroke-width="1.5"/>
  
  <!-- Inradius r = 40. Incenter O = (80 + 40, 220 - 40) = (120, 180) -->
  <circle cx="120" cy="180" r="40" fill="none" stroke="#222222" stroke-width="1.8"/>
  <circle cx="120" cy="180" r="3" fill="#222222"/>
  <text x="126" y="176" font-family="sans-serif" font-size="15" font-weight="bold" fill="#222222">O</text>
  
  <!-- Radii to tangency points -->
  <!-- D on AB: (80, 180) -->
  <circle cx="80" cy="180" r="2.5" fill="#222222"/>
  <text x="64" y="185" font-family="sans-serif" font-size="15" font-weight="bold" fill="#222222">D</text>
  <line x1="80" y1="180" x2="120" y2="180" stroke="#999999" stroke-width="1" stroke-dasharray="2,2"/>
  
  <!-- F on AC: (120, 220) -->
  <circle cx="120" cy="220" r="2.5" fill="#222222"/>
  <text x="116" y="238" font-family="sans-serif" font-size="15" font-weight="bold" fill="#222222">F</text>
  <line x1="120" y1="180" x2="120" y2="220" stroke="#999999" stroke-width="1" stroke-dasharray="2,2"/>
  
  <!-- E on BC: tangency point -->
  <circle cx="144" cy="148" r="2.5" fill="#222222"/>
  <text x="150" y="142" font-family="sans-serif" font-size="15" font-weight="bold" fill="#222222">E</text>
  
  <!-- Connect OA, OB, OC -->
  <line x1="120" y1="180" x2="80" y2="220" stroke="#0066cc" stroke-width="1.5"/>
  <line x1="120" y1="180" x2="80" y2="70" stroke="#0066cc" stroke-width="1.5"/>
  <line x1="120" y1="180" x2="340" y2="220" stroke="#0066cc" stroke-width="1.5"/>
  
  <circle cx="80" cy="220" r="3.5" fill="#222222"/>
  <text x="65" y="236" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222222">A</text>
  
  <circle cx="80" cy="70" r="3.5" fill="#222222"/>
  <text x="65" y="65" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222222">B</text>
  
  <circle cx="340" cy="220" r="3.5" fill="#222222"/>
  <text x="348" y="226" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222222">C</text>
  
  <text x="60" y="125" font-family="sans-serif" font-size="14" fill="#222222">3</text>
  <text x="240" y="240" font-family="sans-serif" font-size="14" fill="#222222">10</text>
</svg>
