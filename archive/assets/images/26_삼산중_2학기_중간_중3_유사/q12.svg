<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 260" width="440" height="260" role="img" aria-labelledby="q12.svg-title q12.svg-desc">
  <title id="q12.svg-title">평행사변형 ABCD와 대각선 분할</title>
  <desc id="q12.svg-desc">BC=10, CD=6이고 두 대각선의 교점이 O인 평행사변형 ABCD에서 색칠된 삼각형 OAB와 OCD</desc>
  <rect width="100%" height="100%" fill="#ffffff"/>
  
  <!-- A=(70, 200), D=(250, 200), B=(155, 90), C=(335, 90) -->
  <!-- Center O = ((70+335)/2, (200+90)/2) = (202.5, 145) -->
  <!-- Shaded triangles OAB and OCD -->
  <polygon points="70,200 155,90 202.5,145" fill="#e8f0fe" stroke="none"/>
  <polygon points="250,200 335,90 202.5,145" fill="#e8f0fe" stroke="none"/>
  
  <polygon points="70,200 250,200 335,90 155,90" fill="none" stroke="#222222" stroke-width="2"/>
  <line x1="70" y1="200" x2="335" y2="90" stroke="#222222" stroke-width="1.5"/>
  <line x1="155" y1="90" x2="250" y2="200" stroke="#222222" stroke-width="1.5"/>
  
  <circle cx="70" cy="200" r="3" fill="#222222"/>
  <text x="54" y="206" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222222">A</text>
  
  <circle cx="155" cy="90" r="3" fill="#222222"/>
  <text x="148" y="78" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222222">B</text>
  
  <circle cx="335" cy="90" r="3" fill="#222222"/>
  <text x="345" y="88" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222222">C</text>
  
  <circle cx="250" cy="200" r="3" fill="#222222"/>
  <text x="256" y="214" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222222">D</text>
  
  <circle cx="202.5" cy="145" r="3" fill="#222222"/>
  <text x="206" y="140" font-family="sans-serif" font-size="15" font-weight="bold" fill="#222222">O</text>
  
  <text x="240" y="80" font-family="sans-serif" font-size="14" fill="#222222">10 cm</text>
  <text x="300" y="155" font-family="sans-serif" font-size="14" fill="#222222">6 cm</text>
</svg>
