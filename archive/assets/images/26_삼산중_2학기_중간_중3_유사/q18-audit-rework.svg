<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 455" width="380" height="455" role="img" aria-labelledby="q18.svg-title q18.svg-desc">
  <title id="q18.svg-title">황금삼각형 ABC</title>
  <desc id="q18.svg-desc">AB=AC이고 각 A가 36도, BC=1인 이등변삼각형 ABC에서 각 B의 이등분선 BD</desc>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <defs><marker id="dim-arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 z" fill="#222"/></marker></defs>

  <!-- Schematic scale: BC=1 is 200 px. Equal sides and angle A=36° give height=100/tan(18°); D is set by the angle-bisector ratio. -->
  <polygon points="190,72.231646 90,380 290,380" fill="none" stroke="#222222" stroke-width="2"/>
  <line x1="90" y1="380" x2="251.803399" y2="262.231646" stroke="#222222" stroke-width="1.8"/>
  <path d="M199.27051 100.76997 A30 30 0 0 1 180.72949 100.76997" fill="none" stroke="#222222" stroke-width="1.6"/>
  <line x1="90" y1="380" x2="90" y2="414" stroke="#222" stroke-width="1"/>
  <line x1="290" y1="380" x2="290" y2="414" stroke="#222" stroke-width="1"/>
  <line x1="90" y1="414" x2="290" y2="414" stroke="#222" stroke-width="1.3" marker-start="url(#dim-arrow)" marker-end="url(#dim-arrow)"/>

  <circle cx="190" cy="72.231646" r="3.5" fill="#222222"/>
  <text x="185" y="62" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222222">A</text>

  <circle cx="90" cy="380" r="3.5" fill="#222222"/>
  <text x="74" y="388" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222222">B</text>

  <circle cx="290" cy="380" r="3.5" fill="#222222"/>
  <text x="298" y="388" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222222">C</text>

  <circle cx="251.803399" cy="262.231646" r="3" fill="#222222"/>
  <text x="262" y="264" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222222">D</text>

  <text x="190" y="119" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222222">36°</text>
  <text x="190" y="440" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#222222">1</text>
</svg>
