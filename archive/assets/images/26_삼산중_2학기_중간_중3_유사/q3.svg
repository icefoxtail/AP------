<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 320" width="360" height="320" role="img" aria-labelledby="q3.svg-title q3.svg-desc">
  <title id="q3.svg-title">원 O와 현 AB</title>
  <desc id="q3.svg-desc">원의 중심 O에서 현 AB에 내린 수선의 길이가 6 cm이고 현 AB의 길이가 16 cm인 원</desc>
  <rect width="100%" height="100%" fill="#ffffff"/>
  
  <circle cx="180" cy="150" r="110" fill="none" stroke="#222222" stroke-width="2"/>
  <circle cx="180" cy="150" r="3" fill="#222222"/>
  <text x="188" y="146" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222222">O</text>
  
  <!-- chord at y = 150 + 66 = 216, half chord = 88. x from 92 to 268 -->
  <line x1="92" y1="216" x2="268" y2="216" stroke="#222222" stroke-width="2"/>
  <circle cx="92" cy="216" r="3" fill="#222222"/>
  <text x="76" y="222" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222222">A</text>
  
  <circle cx="268" cy="216" r="3" fill="#222222"/>
  <text x="276" y="222" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222222">B</text>
  
  <!-- perpendicular from O to chord -->
  <line x1="180" y1="150" x2="180" y2="216" stroke="#222222" stroke-width="1.8" stroke-dasharray="4,3"/>
  <circle cx="180" cy="216" r="2.5" fill="#222222"/>
  <text x="185" y="234" font-family="sans-serif" font-size="14" fill="#222222">M</text>
  <rect x="180" y="203" width="13" height="13" fill="none" stroke="#222222" stroke-width="1.2"/>
  
  <text x="190" y="186" font-family="sans-serif" font-size="14" fill="#222222">6 cm</text>
  <text x="160" y="248" font-family="sans-serif" font-size="14" fill="#222222">16 cm</text>
</svg>
