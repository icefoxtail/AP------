<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 300" width="460" height="300" role="img" aria-labelledby="q9.svg-title q9.svg-desc">
  <title id="q9.svg-title">빛의 반사와 삼각비</title>
  <desc id="q9.svg-desc">높이가 4m인 직사각형 공간에서 바닥의 A지점에서 30도의 각도로 거울 B에 쏜 빛이 반사되어 천장의 C지점에 닿는 경로</desc>
  <rect width="100%" height="100%" fill="#ffffff"/>
  
  <!-- Room boundary: ceiling y=50, floor y=230, left wall x=50, right wall x=380 -->
  <rect x="50" y="50" width="330" height="180" fill="#fafafa" stroke="#222222" stroke-width="2"/>
  
  <!-- Mirror at right wall from y=100 to y=150 -->
  <line x1="380" y1="80" x2="380" y2="150" stroke="#0066cc" stroke-width="4"/>
  
  <!-- Point B on wall at y=95 (3m above floor, 1m below ceiling) -->
  <!-- A on floor at x=146 (distance 234 from wall = 135*sqrt(3)) -->
  <!-- C on ceiling at x=302 (distance 78 from wall = 45*sqrt(3)) -->
  <line x1="146" y1="230" x2="380" y2="95" stroke="#e60000" stroke-width="2.2"/>
  <line x1="380" y1="95" x2="302" y2="50" stroke="#e60000" stroke-width="2.2"/>
  
  <!-- Light arrows -->
  <polygon points="260,164 266,160 263,168" fill="#e60000"/>
  <polygon points="340,72 346,75 340,80" fill="#e60000"/>
  
  <circle cx="146" cy="230" r="3.5" fill="#222222"/>
  <text x="140" y="250" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222222">A</text>
  
  <circle cx="380" cy="95" r="3.5" fill="#222222"/>
  <text x="390" y="98" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222222">B</text>
  
  <circle cx="302" cy="50" r="3.5" fill="#222222"/>
  <text x="300" y="40" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222222">C</text>
  
  <path d="M 180,230 A 34 34 0 0 0 176,213" fill="none" stroke="#222222" stroke-width="1.2"/>
  <text x="188" y="222" font-family="sans-serif" font-size="13" fill="#222222">30°</text>
  
  <!-- Height indicators -->
  <line x1="415" y1="50" x2="415" y2="230" stroke="#666666" stroke-width="1"/>
  <line x1="410" y1="50" x2="420" y2="50" stroke="#666666" stroke-width="1"/>
  <line x1="410" y1="230" x2="420" y2="230" stroke="#666666" stroke-width="1"/>
  <text x="425" y="145" font-family="sans-serif" font-size="13" fill="#666666">4 m</text>
  
  <line x1="395" y1="95" x2="395" y2="230" stroke="#666666" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="398" y="170" font-family="sans-serif" font-size="13" fill="#666666">3 m</text>
</svg>
