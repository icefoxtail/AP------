<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 564" width="540" height="564" role="img" aria-labelledby="q5.svg-title q5.svg-desc">
  <title id="q5.svg-title">직각삼각형과 삼각비 표</title>
  <desc id="q5.svg-desc">빗변 AB가 4이고 각 A가 38도인 직각삼각형 ABC와 37도부터 39도까지의 삼각비 표</desc>
  <rect width="100%" height="100%" fill="#ffffff" />
  <defs><marker id="dim-arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 z" fill="#222" /></marker></defs>


  <g transform="translate(145 -24)"><polygon points="60,210 200,210 200,100" fill="none" stroke="#222222" stroke-width="2" />
  <rect x="186" y="196" width="14" height="14" fill="none" stroke="#222222" stroke-width="1.5" />

  <circle cx="60" cy="210" r="3" fill="#222222" />
  <text x="44" y="216" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222222">A</text>

