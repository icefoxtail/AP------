  <line x1="200" y1="100" x2="180" y2="80" stroke="#222" stroke-width="1" />
  <line x1="40" y1="190" x2="180" y2="80" stroke="#222" stroke-width="1.3" marker-start="url(#dim-arrow)" marker-end="url(#dim-arrow)" />
  <rect x="101" y="119" width="20" height="20" fill="white" />
  <text x="111" y="134" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222222">4</text>


  </g><g transform="translate(28 227) scale(1.86)">
