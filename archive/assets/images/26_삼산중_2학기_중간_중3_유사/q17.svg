<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 300" width="440" height="300" role="img" aria-labelledby="q17.svg-title q17.svg-desc">
  <title id="q17.svg-title">원의 접선과 삼각형의 넓이</title>
  <desc id="q17.svg-desc">AD, BC, AF가 각각 점 D, E, F를 접점으로 하는 원 O의 접선이고 AD=14, AC=10, AB=8, 각 ACB=60도인 도형</desc>
  <rect width="100%" height="100%" fill="#ffffff"/>
  
  <!-- Circle on right -->
  <circle cx="280" cy="150" r="65" fill="none" stroke="#222222" stroke-width="2"/>
  <circle cx="280" cy="150" r="2.5" fill="#222222"/>
  <text x="286" y="146" font-family="sans-serif" font-size="15" font-weight="bold" fill="#222222">O</text>
  
  <!-- Tangents from A(60, 150): AD top tangent, AF bottom tangent -->
  <line x1="60" y1="150" x2="310" y2="90" stroke="#222222" stroke-width="2"/>
  <line x1="60" y1="150" x2="310" y2="210" stroke="#222222" stroke-width="2"/>
  
  <!-- Tangent BC touching at E -->
  <line x1="170" y1="128" x2="200" y2="222" stroke="#222222" stroke-width="2"/>
  
  <circle cx="60" cy="150" r="3.5" fill="#222222"/>
  <text x="44" y="156" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222222">A</text>
  
  <circle cx="170" cy="128" r="3" fill="#222222"/>
  <text x="162" y="118" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222222">B</text>
  
  <circle cx="200" cy="222" r="3" fill="#222222"/>
  <text x="195" y="240" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222222">C</text>
  
  <circle cx="265" cy="99" r="2.5" fill="#222222"/>
  <text x="264" y="88" font-family="sans-serif" font-size="15" font-weight="bold" fill="#222222">D</text>
  
  <circle cx="190" cy="172" r="2.5" fill="#222222"/>
  <text x="198" y="176" font-family="sans-serif" font-size="15" font-weight="bold" fill="#222222">E</text>
  
  <circle cx="265" cy="201" r="2.5" fill="#222222"/>
  <text x="264" y="218" font-family="sans-serif" font-size="15" font-weight="bold" fill="#222222">F</text>
  
  <text x="110" y="125" font-family="sans-serif" font-size="14" fill="#222222">8</text>
  <text x="110" y="195" font-family="sans-serif" font-size="14" fill="#222222">10</text>
  <text x="210" y="80" font-family="sans-serif" font-size="14" fill="#222222">14</text>
</svg>
