<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" width="400" height="320" role="img" aria-labelledby="q19.svg-title q19.svg-desc">
  <title id="q19.svg-title">정삼각형과 원의 영역</title>
  <desc id="q19.svg-desc">한 변이 12인 정삼각형 ABC와 반지름 6인 원의 중심각 120도 부채꼴을 제외한 색칠된 부분</desc>
  <rect width="100%" height="100%" fill="#ffffff"/>
  
  <!-- Triangle A=(200, 40), B=(80, 248), C=(320, 248) -->
  <!-- Shaded triangle background -->
  <polygon points="200,40 80,248 320,248" fill="#e8f0fe" stroke="#222222" stroke-width="2"/>
  
  <!-- Circle center O=(200, 160), radius R=70. Sector cutout in white -->
  <path d="M 200,160 L 139,125 A 70 70 0 0 1 261,125 Z" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
  <circle cx="200" cy="160" r="70" fill="none" stroke="#666666" stroke-width="1.2" stroke-dasharray="3,3"/>
  
  <!-- Diameter AH -->
  <line x1="200" y1="40" x2="200" y2="248" stroke="#222222" stroke-width="1.5" stroke-dasharray="4,3"/>
  
  <circle cx="200" cy="40" r="3.5" fill="#222222"/>
  <text x="195" y="30" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222222">A</text>
  
  <circle cx="80" cy="248" r="3.5" fill="#222222"/>
  <text x="64" y="254" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222222">B</text>
  
  <circle cx="320" cy="248" r="3.5" fill="#222222"/>
  <text x="328" y="254" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222222">C</text>
  
  <circle cx="200" cy="160" r="2.5" fill="#222222"/>
  <text x="206" y="165" font-family="sans-serif" font-size="15" font-weight="bold" fill="#222222">O</text>
  
  <circle cx="200" cy="248" r="2.5" fill="#222222"/>
  <text x="195" y="266" font-family="sans-serif" font-size="15" font-weight="bold" fill="#222222">H</text>
</svg>
