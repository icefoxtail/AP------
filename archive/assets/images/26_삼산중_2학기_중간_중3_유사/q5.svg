<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 280" width="540" height="280" role="img" aria-labelledby="q5.svg-title q5.svg-desc">
  <title id="q5.svg-title">직각삼각형과 삼각비 표</title>
  <desc id="q5.svg-desc">빗변 AB가 4이고 각 A가 38도인 직각삼각형 ABC와 37도부터 39도까지의 삼각비 표</desc>
  <rect width="100%" height="100%" fill="#ffffff"/>
  
  <!-- Triangle on left -->
  <polygon points="60,210 200,210 200,100" fill="none" stroke="#222222" stroke-width="2"/>
  <rect x="186" y="196" width="14" height="14" fill="none" stroke="#222222" stroke-width="1.5"/>
  
  <circle cx="60" cy="210" r="3" fill="#222222"/>
  <text x="44" y="216" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222222">A</text>
  
  <circle cx="200" cy="210" r="3" fill="#222222"/>
  <text x="208" y="216" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222222">C</text>
  
  <circle cx="200" cy="100" r="3" fill="#222222"/>
  <text x="206" y="94" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222222">B</text>
  
  <path d="M 85,210 A 25 25 0 0 0 80,195" fill="none" stroke="#222222" stroke-width="1.2"/>
  <text x="88" y="200" font-family="sans-serif" font-size="13" fill="#222222">38°</text>
  
  <text x="120" y="145" font-family="sans-serif" font-size="15" fill="#222222">4</text>
  
  <!-- Table on right -->
  <g transform="translate(250, 50)">
    <rect x="0" y="0" width="260" height="170" fill="#fcfcfc" stroke="#222222" stroke-width="1.5"/>
    <line x1="0" y1="42" x2="260" y2="42" stroke="#222222" stroke-width="1.2"/>
    <line x1="0" y1="84" x2="260" y2="84" stroke="#e0e0e0" stroke-width="1"/>
    <line x1="0" y1="126" x2="260" y2="126" stroke="#222222" stroke-width="1.5"/>
    <line x1="60" y1="0" x2="60" y2="170" stroke="#222222" stroke-width="1.2"/>
    <line x1="125" y1="0" x2="125" y2="170" stroke="#222222" stroke-width="1"/>
    <line x1="190" y1="0" x2="190" y2="170" stroke="#222222" stroke-width="1"/>
    
    <text x="30" y="26" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#222222">각도</text>
    <text x="92" y="26" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#222222">sin</text>
    <text x="157" y="26" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#222222">cos</text>
    <text x="225" y="26" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#222222">tan</text>
    
    <text x="30" y="68" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">37°</text>
    <text x="92" y="68" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">0.6018</text>
    <text x="157" y="68" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">0.7986</text>
    <text x="225" y="68" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">0.7536</text>
    
    <text x="30" y="110" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#222222">38°</text>
    <text x="92" y="110" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#222222">0.6157</text>
    <text x="157" y="110" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#222222">0.7880</text>
    <text x="225" y="110" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#222222">0.7813</text>
    
    <text x="30" y="152" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">39°</text>
    <text x="92" y="152" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">0.6293</text>
    <text x="157" y="152" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">0.7771</text>
    <text x="225" y="152" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#222222">0.8098</text>
  </g>
</svg>
