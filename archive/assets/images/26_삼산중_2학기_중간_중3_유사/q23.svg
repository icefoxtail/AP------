<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 280" width="420" height="280" role="img" aria-labelledby="q23.svg-title q23.svg-desc">
  <title id="q23.svg-title">두 삼각형 ABC와 ADE의 넓이 비</title>
  <desc id="q23.svg-desc">공통 꼭짓점 A를 공유하고 AC:AE=3:2, AB:AD=1:4인 두 삼각형 ABC와 ADE</desc>
  <rect width="100%" height="100%" fill="#ffffff"/>
  
  <!-- A=(60, 200). Ray AB: to D=(340, 200). Ray AC: to C=(240, 60) -->
  <!-- AB = 70 -> B=(130, 200), AD = 280 -> D=(340, 200) -->
  <!-- AC = 210 -> C=(240, 60), AE = 140 -> E=(180, 107) -->
  <polygon points="60,200 130,200 240,60" fill="#e8f0fe" stroke="#222222" stroke-width="1.8"/>
  <polygon points="60,200 340,200 180,107" fill="none" stroke="#0066cc" stroke-width="2"/>
  
  <circle cx="60" cy="200" r="3.5" fill="#222222"/>
  <text x="44" y="206" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222222">A</text>
  
  <circle cx="130" cy="200" r="3" fill="#222222"/>
  <text x="125" y="222" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222222">B</text>
  
  <circle cx="340" cy="200" r="3.5" fill="#222222"/>
  <text x="348" y="206" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222222">D</text>
  
  <circle cx="240" cy="60" r="3.5" fill="#222222"/>
  <text x="246" y="56" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222222">C</text>
  
  <circle cx="180" cy="107" r="3" fill="#222222"/>
  <text x="180" y="96" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222222">E</text>
</svg>
