<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 340" width="380" height="340" role="img" aria-labelledby="q16.svg-title q16.svg-desc">
  <title id="q16.svg-title">원 내부의 수직인 평행 현들</title>
  <desc id="q16.svg-desc">서로 수직인 두 쌍의 평행한 현 AB, CD와 EF, GH가 있고 거리가 각각 8 cm, 12 cm인 원</desc>
  <rect width="100%" height="100%" fill="#ffffff"/>
  
  <circle cx="190" cy="170" r="115" fill="none" stroke="#222222" stroke-width="2"/>
  <circle cx="190" cy="170" r="3" fill="#222222"/>
  <text x="196" y="166" font-family="sans-serif" font-size="15" font-weight="bold" fill="#222222">O</text>
  
  <!-- AB at y = 170 - 45 = 125, CD at y = 170 + 45 = 215 (dist 90) -->
  <line x1="84" y1="125" x2="296" y2="125" stroke="#222222" stroke-width="2"/>
  <text x="68" y="130" font-family="sans-serif" font-size="15" font-weight="bold" fill="#222222">A</text>
  <text x="304" y="130" font-family="sans-serif" font-size="15" font-weight="bold" fill="#222222">B</text>
  
  <line x1="84" y1="215" x2="296" y2="215" stroke="#222222" stroke-width="2"/>
  <text x="68" y="220" font-family="sans-serif" font-size="15" font-weight="bold" fill="#222222">C</text>
  <text x="304" y="220" font-family="sans-serif" font-size="15" font-weight="bold" fill="#222222">D</text>
  
  <!-- EF at x = 190 - 65 = 125, GH at x = 190 + 65 = 255 (dist 130) -->
  <line x1="125" y1="75" x2="125" y2="265" stroke="#222222" stroke-width="2"/>
  <text x="120" y="66" font-family="sans-serif" font-size="15" font-weight="bold" fill="#222222">E</text>
  <text x="120" y="282" font-family="sans-serif" font-size="15" font-weight="bold" fill="#222222">F</text>
  
  <line x1="255" y1="75" x2="255" y2="265" stroke="#222222" stroke-width="2"/>
  <text x="250" y="66" font-family="sans-serif" font-size="15" font-weight="bold" fill="#222222">G</text>
  <text x="250" y="282" font-family="sans-serif" font-size="15" font-weight="bold" fill="#222222">H</text>
  
  <text x="315" y="175" font-family="sans-serif" font-size="13" fill="#666666">8 cm</text>
  <text x="180" y="300" font-family="sans-serif" font-size="13" fill="#666666">12 cm</text>
</svg>
