<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 320" width="380" height="320" role="img" aria-labelledby="q21.svg-title q21.svg-desc">
  <title id="q21.svg-title">정삼각형 종이접기</title>
  <desc id="q21.svg-desc">정삼각형 종이를 EF를 접는 선으로 접어 CF=2 cm, 각 CDF=90도가 된 도형</desc>
  <rect width="100%" height="100%" fill="#ffffff"/>
  
  <!-- Equilateral triangle ABC: C=(300, 250), B=(70, 250), A=(185, 51) -->
  <!-- Fold along EF: F on AC, E on AB. A folds to D on BC -->
  <polygon points="70,250 300,250 185,51" fill="none" stroke="#999999" stroke-width="1.5" stroke-dasharray="4,4"/>
  
  <!-- Folded shape: polygon with flap DEF -->
  <polygon points="70,250 240,250 240,200 120,130" fill="none" stroke="#222222" stroke-width="2"/>
  <line x1="70" y1="250" x2="300" y2="250" stroke="#222222" stroke-width="2"/>
  
  <!-- Crease EF -->
  <line x1="120" y1="130" x2="265" y2="180" stroke="#e60000" stroke-width="2"/>
  
  <!-- Folded flap DEF: D on BC at (240, 250), F on AC at (265, 180), E on AB at (120, 130) -->
  <polygon points="120,130 265,180 240,250" fill="#e8f0fe" stroke="#222222" stroke-width="1.8"/>
  <line x1="265" y1="180" x2="300" y2="250" stroke="#222222" stroke-width="2"/>
  
  <!-- Right angle at D -->
  <rect x="240" y="236" width="14" height="14" fill="none" stroke="#222222" stroke-width="1.2"/>
  
  <circle cx="185" cy="51" r="3" fill="#999999"/>
  <text x="180" y="42" font-family="sans-serif" font-size="15" fill="#999999">A</text>
  
  <circle cx="70" cy="250" r="3.5" fill="#222222"/>
  <text x="54" y="256" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222222">B</text>
  
  <circle cx="300" cy="250" r="3.5" fill="#222222"/>
  <text x="310" y="256" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222222">C</text>
  
  <circle cx="240" cy="250" r="3" fill="#222222"/>
  <text x="234" y="272" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222222">D</text>
  
  <circle cx="120" cy="130" r="3" fill="#222222"/>
  <text x="104" y="126" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222222">E</text>
  
  <circle cx="265" cy="180" r="3" fill="#222222"/>
  <text x="274" y="176" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222222">F</text>
  
  <text x="285" y="215" font-family="sans-serif" font-size="14" fill="#222222">2 cm</text>
</svg>
