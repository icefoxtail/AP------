<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 280" width="420" height="280" role="img" aria-labelledby="q6.svg-title q6.svg-desc">
  <title id="q6.svg-title">사각형 ABCD</title>
  <desc id="q6.svg-desc">각 A가 30도, 각 C가 45도, 각 ABD와 각 BDC가 90도이고 DC=2인 사각형 ABCD</desc>
  <rect width="100%" height="100%" fill="#ffffff"/>
  
  <!-- D=(220, 200), C=(320, 200), B=(220, 100), A=(50, 100) -->
  <polygon points="50,100 220,100 320,200 220,200" fill="none" stroke="#222222" stroke-width="2"/>
  <line x1="220" y1="100" x2="220" y2="200" stroke="#222222" stroke-width="1.8" stroke-dasharray="4,3"/>
  
  <!-- Right angles -->
  <rect x="220" y="100" width="14" height="14" fill="none" stroke="#222222" stroke-width="1.5"/>
  <rect x="220" y="186" width="14" height="14" fill="none" stroke="#222222" stroke-width="1.5"/>
  
  <circle cx="50" cy="100" r="3" fill="#222222"/>
  <text x="36" y="98" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222222">A</text>
  
  <circle cx="220" cy="100" r="3" fill="#222222"/>
  <text x="216" y="86" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222222">B</text>
  
  <circle cx="320" cy="200" r="3" fill="#222222"/>
  <text x="330" y="212" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222222">C</text>
  
  <circle cx="220" cy="200" r="3" fill="#222222"/>
  <text x="206" y="218" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222222">D</text>
  
  <path d="M 75,100 A 25 25 0 0 1 70,118" fill="none" stroke="#222222" stroke-width="1.2"/>
  <text x="82" y="118" font-family="sans-serif" font-size="13" fill="#222222">30°</text>
  
  <path d="M 298,200 A 25 25 0 0 1 306,186" fill="none" stroke="#222222" stroke-width="1.2"/>
  <text x="280" y="190" font-family="sans-serif" font-size="13" fill="#222222">45°</text>
  
  <text x="265" y="222" font-family="sans-serif" font-size="15" fill="#222222">2</text>
</svg>
