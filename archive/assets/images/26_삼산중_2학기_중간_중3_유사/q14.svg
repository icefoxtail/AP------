<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 340" width="360" height="340" role="img" aria-labelledby="q14.svg-title q14.svg-desc">
  <title id="q14.svg-title">원 O와 반지름을 수직이등분하는 현</title>
  <desc id="q14.svg-desc">원 O에서 현 AB가 반지름 OC를 수직이등분하고 AB의 길이가 12 cm인 도형</desc>
  <rect width="100%" height="100%" fill="#ffffff"/>
  
  <circle cx="180" cy="160" r="115" fill="none" stroke="#222222" stroke-width="2"/>
  <circle cx="180" cy="160" r="3" fill="#222222"/>
  <text x="188" y="156" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222222">O</text>
  
  <!-- Radius OC vertically down: from (180, 160) to (180, 275) -->
  <line x1="180" y1="160" x2="180" y2="275" stroke="#222222" stroke-width="1.8"/>
  <circle cx="180" cy="275" r="3" fill="#222222"/>
  <text x="176" y="295" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222222">C</text>
  
  <!-- Midpoint of OC at y = 160 + 57.5 = 217.5 -->
  <!-- Chord AB horizontal at y=217.5. Half chord = sqrt(115^2 - 57.5^2) = 115*sqrt(3)/2 = 99.6. x from 80 to 280 -->
  <line x1="80" y1="217.5" x2="280" y2="217.5" stroke="#222222" stroke-width="2"/>
  
  <circle cx="80" cy="217.5" r="3" fill="#222222"/>
  <text x="64" y="222" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222222">A</text>
  
  <circle cx="280" cy="217.5" r="3" fill="#222222"/>
  <text x="288" y="222" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222222">B</text>
  
  <!-- Right angle at midpoint M -->
  <rect x="180" y="204" width="13" height="13" fill="none" stroke="#222222" stroke-width="1.2"/>
  
  <!-- Tick marks showing OM = MC -->
  <line x1="176" y1="188" x2="184" y2="188" stroke="#222222" stroke-width="1.5"/>
  <line x1="176" y1="246" x2="184" y2="246" stroke="#222222" stroke-width="1.5"/>
  
  <text x="170" y="238" font-family="sans-serif" font-size="15" fill="#222222">12 cm</text>
</svg>
