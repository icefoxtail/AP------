<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 320" width="380" height="320" role="img" aria-labelledby="q15.svg-title q15.svg-desc">
  <title id="q15.svg-title">원 O와 같은 길이의 두 현</title>
  <desc id="q15.svg-desc">원 O에서 AB와 CD의 길이가 같고 OM이 AB에 수직이며 OD=10, OM=8일 때 삼각형 OCD</desc>
  <rect width="100%" height="100%" fill="#ffffff"/>
  
  <circle cx="190" cy="160" r="110" fill="none" stroke="#222222" stroke-width="2"/>
  <circle cx="190" cy="160" r="3" fill="#222222"/>
  <text x="198" y="156" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222222">O</text>
  
  <!-- Chord AB: horizontal at y = 160 + 88 = 248. Half chord = 66. x from 124 to 256 -->
  <line x1="124" y1="248" x2="256" y2="248" stroke="#222222" stroke-width="2"/>
  <circle cx="124" cy="248" r="3" fill="#222222"/>
  <text x="108" y="254" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222222">A</text>
  <circle cx="256" cy="248" r="3" fill="#222222"/>
  <text x="264" y="254" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222222">B</text>
  
  <line x1="190" y1="160" x2="190" y2="248" stroke="#222222" stroke-width="1.8"/>
  <rect x="190" y="235" width="13" height="13" fill="none" stroke="#222222" stroke-width="1.2"/>
  <text x="196" y="210" font-family="sans-serif" font-size="14" fill="#222222">8</text>
  <text x="175" y="254" font-family="sans-serif" font-size="14" fill="#222222">M</text>
  
  <!-- Chord CD at angle: say tilted in top left -->
  <line x1="102" y1="94" x2="234" y2="94" stroke="#222222" stroke-width="2"/>
  <circle cx="102" cy="94" r="3" fill="#222222"/>
  <text x="88" y="96" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222222">C</text>
  <circle cx="234" cy="94" r="3" fill="#222222"/>
  <text x="242" y="96" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222222">D</text>
  
  <!-- Triangle OCD lines -->
  <line x1="190" y1="160" x2="102" y2="94" stroke="#666666" stroke-width="1.5" stroke-dasharray="3,3"/>
  <line x1="190" y1="160" x2="234" y2="94" stroke="#666666" stroke-width="1.5" stroke-dasharray="3,3"/>
  
  <text x="220" y="130" font-family="sans-serif" font-size="14" fill="#222222">10</text>
</svg>
