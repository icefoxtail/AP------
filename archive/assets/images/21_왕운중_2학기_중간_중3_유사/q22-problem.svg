<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 480" width="460" height="480" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">모선의 길이가 6 cm이고 모선과 밑면이 이루는 각의 크기가 60도인 원뿔을 나타낸 그림이다.</title><desc id="visual-desc">원뿔의 꼭짓점에서 밑면의 중심으로 수선이 그어져 있고 밑면의 중심에서 밑면 둘레의 한 점으로 반지름이 그어져 있어 서로 수직을 이룬다. 모선과 밑면의 반지름이 이루는 각의 크기는 60도이고 모선의 길이는 6 cm이다.</desc><rect width="460" height="480" fill="#fff"/><g data-layer="12"><polygon id="aC-sector" data-role="angleSector" stroke="none" stroke-width="1.6" fill="#d9d9d9" data-owner-points="A C H" data-mark="angle" data-mark-id="aC" data-mark-index="0" data-mark-count="1" data-mark-side="INNER" points="351.168686975,264.156036414 337.168686975,239.907325108 335.612720451,240.874887269 334.123366963,241.942142885 332.707004153,243.104521804 331.369697102,244.35704654 330.117172366,245.694353591 328.954793447,247.110716401 327.887537831,248.600069889 326.91997567,250.156036414 326.056250213,251.771953088 325.300060065,253.440900307 324.65464335,255.155731385 324.122763839,256.909103151 323.706699124,258.693507397 323.408230857,260.501303031 323.228637125,262.324748795 323.168686975,264.156036414"/></g><g data-layer="30"><line id="AB" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="230" y1="54.285714286" x2="108.831313025" y2="264.156036414"/></g><g data-layer="30"><line id="AC" data-role="line"