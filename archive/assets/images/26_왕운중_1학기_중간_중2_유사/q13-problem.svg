<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 400" width="440" height="400" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">세로인 변 AB를 지름으로 하는 반원이 직사각형 ABCD 안쪽에 그려져 있고, 대각선 AC가 직각삼각형 ABC를 이룬다. 변 AB와 변 BC에는 각각의 길이가 문자식으로 적혀 있다.</title><desc id="visual-desc">직사각형 ABCD가 있고 변 AB는 세로이다. 변 AB를 지름으로 하는 반원이 직사각형 안쪽으로 그려져 있으며, 점 A와 점 B에서 각각 점 C로 가는 선분이 직각삼각형 ABC를 만든다. 변 AB에는 세로 길이를 나타내는 문자식, 변 BC에는 가로 길이를 나타내는 문자식이 적혀 있다.</desc><rect width="440" height="400" fill="#fff"/><g data-layer="30"><line id="sCD" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="387.857142857" y1="88.095238095" x2="387.857142857" y2="311.904761905"/></g><g data-layer="30"><line id="sDA" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="387.857142857" y1="311.904761905" x2="52.142857143" y2="311.904761905"/></g><g data-layer="30"><line id="sAC" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="52.142857143" y1="311.904761905" x2="387.857142857" y2="88.095238095"/></g><g data-layer="31"><line id="sAB" data-role="line" stroke="#1f5fa8" stroke-width="2.4" fill="none" x1="52.142857143" y1="311.904761905" x2="52.142857143" y2="88.095238095"/></g><g data-layer="31"><line id="sBC" data-role="line" stroke="#b85c00" stroke-width="2.4" fill="none" x1="52.142857143" y1="88.095238095" x2="387.857142857" y2="88.095238095"/></g><