<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 635" width="742" height="635" role="img" aria-labelledby="title desc"><title id="title">내심을 지나는 두 선과 70도, 80도</title><desc id="desc">삼각형 ABC의 내심 I에서 A와 D가 한 직선 위에 있고 B와 E가 한 직선 위에 있다. D의 BDA각은 70도이고 E의 AEB각은 80도이다.</desc><rect width="742" height="635" fill="white" /><polygon points="179.5054,122.9146 113.0000,500.0854 629.0000,500.0854" fill="#fff" /><line x1="179.5054" y1="122.9146" x2="113.0000" y2="500.0854" stroke="#21639a" stroke-width="4.8" stroke-linecap="round" /><line x1="113.0000" y1="500.0854" x2="629.0000" y2="500.0854" stroke="#21639a" stroke-width="4.8" stroke-linecap="round" /><line x1="629.0000" y1="500.0854" x2="179.5054" y2="122.9146" stroke="#21639a" stroke-width="4.8" stroke-linecap="round" /><line x1="179.5054" y1="122.9146" x2="316.7843" y2="500.0854" stroke="#227365" stroke-width="4.85" stroke-linecap="round" /><line x1="113.0000" y1="500.0854" x2="371.0000" y2="283.5977" stroke="#774698" stroke-width="4.9" stroke-linecap="round" /><path d="M 269.7843 500.0854 A 47 47 0 0 1 300.7094 455.9198" stroke="#227365" stroke-width="2.25" fill="none" /><text x="249.6138" y="461.0521" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#227365" text-anchor="middle">70°</text><path d="M 335.7620 254.0294 A 46 46 0 0 0 335.7620 313.1659" stroke="#774698" stroke-width="2.25" fill="none" /><text x="282.0000" y="287.5977" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#774698" text-anchor="middle">80°</text><circle cx="179.5053826661117" cy="122.91461618948102" r="4.9" fill="#28364b" /><text x="179.5054" y="102.9146" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">A</text><circle cx="113.0" cy="500.085383810519" r="4.9" fill="#28364b" /><text x="96.0000" y="522.0854" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weig