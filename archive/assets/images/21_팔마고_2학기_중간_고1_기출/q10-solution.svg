<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="title desc"><title id="title">집합 해설 보강 · 문항 10</title><desc id="desc">합집합 원소합의 포함배제 계산</desc><rect width="720" height="300" rx="18" fill="#f8fafc"/><text x="32" y="38" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#0f172a">집합 해설 보강 · 문항 10</text><text x="32" y="68" font-family="Arial,sans-serif" font-size="14" fill="#475569">원소합에 대한 포함배제</text><rect x="32" y="88" width="656" height="156" rx="12" fill="#fff" stroke="#cbd5e1"/><text x="75" y="132" font-family="Arial,sans-serif" font-size="16" fill="#334155">S(A)=21</text><text x="270" y="132" font-family="Arial,sans-serif" font-size="16" fill="#334155">S(A∩B)=4+6=10</text><text x="515" y="132" font-family="Arial,sans-serif" font-size="16" fill="#334155">S(A∪B)=40</text><line x1="75" y1="153" x2="645" y2="153" stroke="#cbd5e1"/><text x="160" y="198" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#1d4ed8">40=21+S(B)-10</text><text x="260" y="229" font-family="Arial,sans-serif" font-size="17" fill="#0f172a">S(B)=29</text><text x="32" y="274" font-family="Arial,sans-serif" font-size="13" fill="#64748b">합집합의 합은 두 합을 더하고 교집합의 합을 한 번 뺀다.</text></svg>
