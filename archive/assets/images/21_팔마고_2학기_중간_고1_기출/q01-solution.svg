<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="title desc" data-scale-policy="SCHEMATIC_ALLOWED" width="720" height="360"><title id="title">집합 해설 보강 · 문항 1</title><desc id="desc">A가 B에 포함되는 관계와 여집합 관계</desc><rect width="720" height="300" rx="18" fill="#f8fafc"/><text x="32" y="38" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#0f172a">집합 해설 보강 · 문항 1</text><text x="32" y="68" font-family="Arial,sans-serif" font-size="14" fill="#475569">A⊆B, Bᶜ⊆Aᶜ</text><rect x="32" y="88" width="656" height="156" rx="12" fill="#fff" stroke="#cbd5e1"/><circle cx="360" cy="166" r="78" fill="#fed7aa" fill-opacity=".72" stroke="#ea580c" stroke-width="3"/><circle cx="360" cy="166" r="43" fill="#bfdbfe" fill-opacity=".9" stroke="#2563eb" stroke-width="3"/><text x="286" y="166" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#c2410c">B</text><text x="350" y="166" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#1d4ed8">A</text><text x="52" y="218" font-family="Arial,sans-serif" font-size="13" fill="#334155">A∪B=B</text><text x="500" y="218" font-family="Arial,sans-serif" font-size="13" fill="#334155">A∩B=A</text><text x="32" y="274" font-family="Arial,sans-serif" font-size="13" fill="#64748b">A의 모든 원소가 B 안에 있다.</text></svg>
