<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="title desc"><title id="title">집합 해설 보강 · 문항 2</title><desc id="desc">집합 판정 기준과 원소 관계를 표시</desc><rect width="720" height="300" rx="18" fill="#f8fafc"/><text x="32" y="38" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#0f172a">집합 해설 보강 · 문항 2</text><text x="32" y="68" font-family="Arial,sans-serif" font-size="14" fill="#475569">집합 판정 기준과 원소 관계를 표시</text><rect x="32" y="88" width="656" height="156" rx="12" fill="#fff" stroke="#cbd5e1"/><rect x="88" y="126" width="210" height="78" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><rect x="422" y="126" width="210" height="78" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="130" y="158" font-family="Arial,sans-serif" font-size="18" font-weight="700">원소 후보</text><text x="125" y="186" font-family="Arial,sans-serif" font-size="15">소속 여부 판정</text><text x="461" y="158" font-family="Arial,sans-serif" font-size="18" font-weight="700">집합</text><text x="454" y="186" font-family="Arial,sans-serif" font-size="15">기준이 명확함</text><text x="32" y="274" font-family="Arial,sans-serif" font-size="13" fill="#64748b">원소의 소속과 조건의 방향을 그림으로 확인하세요.</text></svg>