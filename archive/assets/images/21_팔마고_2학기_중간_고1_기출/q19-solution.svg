<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="title desc"><title id="title">집합 해설 보강 · 문항 19</title><desc id="desc">집합식 변형에서 사용한 여섯 법칙</desc><rect width="720" height="300" rx="18" fill="#f8fafc"/><text x="32" y="38" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#0f172a">집합 해설 보강 · 문항 19</text><text x="32" y="68" font-family="Arial,sans-serif" font-size="14" fill="#475569">식의 앞뒤를 비교해 법칙 확인</text><rect x="32" y="88" width="656" height="156" rx="12" fill="#fff" stroke="#cbd5e1"/><text x="62" y="121" font-family="Arial,sans-serif" font-size="14" fill="#334155">① 차집합의 정의</text><text x="274" y="121" font-family="Arial,sans-serif" font-size="14" fill="#334155">② 드모르간</text><text x="456" y="121" font-family="Arial,sans-serif" font-size="14" fill="#334155">③ 분배</text><text x="62" y="160" font-family="Arial,sans-serif" font-size="14" fill="#334155">④ 여집합의 성질</text><text x="274" y="160" font-family="Arial,sans-serif" font-size="14" fill="#334155">⑤ 결합</text><text x="456" y="160" font-family="Arial,sans-serif" font-size="14" fill="#334155">⑥ 교환</text><text x="62" y="208" font-family="Arial,sans-serif" font-size="15" fill="#1d4ed8">각 줄의 식이 바뀐 부분과 법칙을 대응시킨다.</text><text x="32" y="274" font-family="Arial,sans-serif" font-size="13" fill="#64748b">정의와 법칙을 순서대로 적용하면 A∩B∩C가 남는다.</text></svg>
