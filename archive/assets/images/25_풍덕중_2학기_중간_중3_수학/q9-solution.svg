<style id="apmath-publication-style">
:root{color:#1f2937}
text.ap-pub-label{font-size:42px!important;font-weight:500!important;fill:#1f2937!important;stroke:none!important;font-kerning:normal}
text.ap-pub-text{font-family:"Noto Sans KR", "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", Arial, sans-serif!important;font-style:normal!important}
text.ap-pub-math{font-family:"STIX Two Math", "Cambria Math", "Times New Roman", serif!important;font-style:normal!important}
text.ap-pub-variable{font-style:italic!important}
text.ap-pub-strong{font-weight:650!important}
text.ap-pub-title{font-size:50px!important;font-weight:700!important;fill:#1f2937!important}
text.ap-pub-label[data-publication-tone="teal"]{fill:#0f766e!important}
text.ap-pub-label[data-publication-tone="blue"]{fill:#2563eb!important}
text.ap-pub-label[data-publication-tone="warm"]{fill:#d97706!important}
.g,.main{stroke:#1f2937!important;stroke-width:2.05px!important}
.aux,.guide{stroke:#94a3b8!important;stroke-width:1.35px!important;stroke-dasharray:5 4}
.hi,.accent{stroke:#2563eb!important;stroke-width:2.6px!important}
.dot{fill:#2563eb!important}
line,path,polyline,polygon,circle,ellipse{stroke-linecap:round;stroke-linejoin:round}
@media print{text.ap-pub-label{font-size:20px!important}text.ap-pub-title{font-size:24px!important}}
text.ap-pub-label.ap-pub-numeric,text[data-label-kind="angle"],text[data-label-kind="angle-arc"],text[data-label-kind="length"]{font-size:22px!important;stroke:#fff!important;stroke-width:8px!important;paint-order:stroke fill!important;stroke-linejoin:round!important}
.ap-pub-angle-arc{stroke:#64748b;stroke-width:2.2;fill:none;stroke-linecap:round}
.ap-pub-dimension line{stroke:#94a3b8;stroke-width:1.6;fill:none;stroke-linecap:round}
.ap-pub-equality-mark{stroke:#64748b;stroke-width:2.5;stroke-linecap:round}

/* numeric annotation labels: half-size publication pass */
text.ap-pub-label.ap-pub-numeric,text.ap-pub-label[data-label-kind="angle"],text.ap-pub-label[data-label-kind="angle-arc"],text.ap-pub-label[data-label-kind="length"]{font-size:21px!important;stroke-width:3.8px!important}
</style></svg>
