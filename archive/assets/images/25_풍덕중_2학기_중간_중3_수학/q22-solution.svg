<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 790" role="img" aria-labelledby="title desc">
  <title id="title">나무 높이와 눈높이</title>
  <desc id="desc">눈높이에서 나무까지의 수평 거리 BD는 4.5미터이고 시선 각은 54도이다. 나무의 눈높이 위 부분 CD를 더해 지면에서 고양이까지의 높이를 구한다.</desc>
  <style>
    .ko{font-family:"Noto Sans KR","Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;fill:#16324f}
    .math{font-family:"STIX Two Math","Cambria Math","Times New Roman",serif;fill:#16324f}
    .title{font-size:24px;font-weight:700}.body{font-size:20px}.small{font-size:17px;fill:#52677f}.result{font-size:23px;font-weight:700}
  </style>
  <rect width="560" height="790" rx="18" fill="#f5f8fc"/>
  <text id="title" x="28" y="42" class="ko title">눈높이 위의 높이를 먼저 구하기</text>
  <rect x="28" y="68" width="504" height="374" rx="14" fill="#fff" stroke="#d9e2ed"/>
  <g transform="translate(88 0)">
    <line x1="72" y1="340" x2="336" y2="340" stroke="#16324f" stroke-width="3"/>
    <line x1="112" y1="298" x2="112" y2="340" stroke="#65778b" stroke-width="4"/>
    <line x1="112" y1="298" x2="238" y2="298" stroke="#8798aa" stroke-width="2" stroke-dasharray="6 5"/>
    <line x1="238" y1="82" x2="238" y2="340" stroke="#138a82" stroke-width="5"/>
    <line x1="112" y1="298" x2="238" y2="82" stroke="#d97919" stroke-width="3"/>
    <path d="M222 298 h16 v16 h-16 M222 340 v-16 h16 v16" fill="none" stroke="#16324f" stroke-width="2"/>
    <path d="M139 298 A27 27 0 0 0 127.88 276.2" fill="none" stroke="#d97919" stroke-width="2.5"/>
    <g class="math body">
      <text x="96" y="293">B</text><text x="97" y="365">A</text><text x="243" y="76">C</text><text x="244" y="294">D</text><text x="244" y="365">E</text>
      <text x="82" y="324" fill="#65778b">1.5</text><text x="161" y="322" fill="#246bce">4.5 m</text><text x="244" y="204" fill="#138a82">CE</text><text x="133" y="286" fill="#d97919">54°</text>
    </g>
  </g>
  <rect x="28" y="460" width="504" height="300" rx="14" fill="#fff" stroke="#d9e2ed"/>
  <text x="54" y="503" class="ko small">같은 높이의 수평선으로 작은 직각삼각형을 만든다</text>
  <text x="54" y="546" class="math body">BD = AE = 4.5 m</text>
  <text x="54" y="584" class="math body">CD = 4.5 × tan54° = 6.21 m</text>
  <line x1="54" y1="610" x2="506" y2="610" stroke="#e4eaf1"/>
  <text x="54" y="650" class="math body">CE = CD + DE</text>
  <text x="54" y="684" class="math body">= 6.21 + 1.5</text>
  <rect x="52" y="711" width="456" height="40" rx="10" fill="#e7f5f2" stroke="#8fc9bd"/>
  <text x="280" y="739" text-anchor="middle" class="ko result">CE = 7.71 m</text>
</svg>
