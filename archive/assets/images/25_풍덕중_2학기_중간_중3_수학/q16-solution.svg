<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 270" role="img" aria-labelledby="title desc">
<title id="title">16번 해설 도형</title><desc id="desc">현 AB의 중점 D와 원의 중심 O, 원 위의 점 C가 일직선 위에 있고 AD=DB=6cm, DC=3cm, OD=r-3임을 나타낸 도형</desc>
<rect width="100%" height="100%" fill="white"/>
<circle cx="160" cy="135" r="75" fill="none" stroke="currentColor" stroke-width="2"/>
<g fill="none" stroke="currentColor" stroke-width="2">
  <line x1="205" y1="75" x2="205" y2="195"/>
  <line x1="160" y1="135" x2="235" y2="135"/>
  <line x1="160" y1="135" x2="205" y2="75"/>
  <polyline points="205,135 205,125 215,125 215,135" stroke-width="1.5"/>
</g>
<g fill="currentColor" font-family="Arial, sans-serif" font-size="15">
  <text x="145" y="155">O</text>
  <text x="190" y="151">D</text>
  <text x="242" y="141">C</text>
  <text x="211" y="69">A</text>
  <text x="211" y="214">B</text>
  <text x="213" y="108">6 cm</text>
  <text x="213" y="174">6 cm</text>
  <text x="220" y="158" text-anchor="middle">3 cm</text>
  <text x="182" y="126" text-anchor="middle">r−3</text>
  <text x="177" y="98">r</text>
</g>
</svg>
