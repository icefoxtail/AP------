<svg xmlns="http://www.w3.org/2000/svg" viewBox="75 55 185 165" role="img" aria-labelledby="title desc" data-publication-style-version="AP_M3_PUBLICATION_2026_10_04" style="color:#1f2937" width="185" height="165">
  <title id="title">16번 해설 도형</title>
  <desc id="desc">현 AB의 중점 D와 원의 중심 O, 원 위의 점 C가 일직선 위에 있고 AD=DB=6cm, DC=3cm, OD=r-3임을 나타낸 도형</desc>
  <rect width="100%" height="100%" fill="white" />
  <circle cx="160" cy="135" r="75" fill="none" stroke="currentColor" stroke-width="2.05" />
  <g fill="none" stroke="currentColor" stroke-width="2.05">
    <line x1="205" y1="75" x2="205" y2="195" />
    <line x1="160" y1="135" x2="235" y2="135" />
    <line x1="160" y1="135" x2="205" y2="75" />
    <polyline points="205,135 205,125 215,125 215,135" stroke-width="1.35" />
  </g>
  <g fill="currentColor" font-family="Arial, sans-serif" font-size="15">
    <g class="ap-pub-equality-mark" data-equal-segment="AD,DB">
      <line x1="199.00" y1="105.00" x2="211.00" y2="105.00" />
      <line x1="199.00" y1="165.00" x2="211.00" y2="165.00" />
    </g>
    <polyline id="right-angle-at-D" data-owner-vertex="pt-D" data-owner-rays="seg-OD seg-AD" points="195,135 195,125 205,125 205,135" fill="none" stroke="#64748b" stroke-width="1.6" stroke-linejoin="round" />
    <text id="length-label-q16-AD" class="ap-pub-label ap-pub-math ap-pub-numeric" x="247" y="90" text-anchor="middle" data-label-kind="length" data-owner-segment="AD" data-owner-segment-endpoints="205,75;205,135" data-owner-type="STRAIGHT_SEGMENT_LENGTH" data-fact-role="GIVEN" font-size="28.9" style="stroke:#fff!important;stroke-width:0.12em!important;paint-order:stroke fill!important;stroke-linejoin:round!important;font-size:28.9px!important">6</text>
    <text id="length-label-q16-DC" class="ap-pub-label ap-pub-math ap-pub-numeric" x="225" y="178" text-anchor="middle" data-label-kind="length" data-owner-segment="DC" data-owner-segment-endpoints="205,135;235,135" data-owner-type="STRAIGHT_SEGMENT_LENGTH" data-fact-role="GIVEN" font-size="28.9" style="stroke:#fff!important;stroke-width:0.12em!important;paint-order:stroke fill!important;stroke-linejoin:round!important;font-size:28.9px!important">3</text>
    <text id="length-label-q16-OD" class="ap-pub-label ap-pub-math ap-pub-variable" x="170" y="160" text-anchor="middle" data-label-kind="length" data-owner-segment="OD" data-owner-segment-endpoints="160,135;205,135" data-owner-type="STRAIGHT_SEGMENT_LENGTH" data-fact-role="GIVEN" font-size="28.9" style="stroke:#fff!important;stroke-width:0.12em!important;paint-order:stroke fill!important;stroke-linejoin:round!important;font-size:28.9px!important">r−3</text>
    <text id="length-label-q16-OC" class="ap-pub-label ap-pub-math ap-pub-variable" x="220" y="110" text-anchor="middle" data-label-kind="length" data-owner-segment="OC" data-owner-segment-endpoints="160,135;235,135" data-owner-type="RADIUS_LENGTH" data-fact-role="GIVEN" font-size="28.9" style="stroke:#fff!important;stroke-width:0.12em!important;paint-order:stroke fill!important;stroke-linejoin:round!important;font-size:28.9px!important">r</text>
    <text x="125" y="180" class="ap-pub-label ap-pub-math ap-pub-variable" data-publication-font-role="MATH_VARIABLE" data-publication-tone="neutral" font-size="28.9" style="font-size:28.9px!important">O</text>
    <text x="174" y="110" class="ap-pub-label ap-pub-math ap-pub-variable" data-publication-font-role="MATH_VARIABLE" data-publication-tone="neutral" font-size="28.9" style="font-size:28.9px!important">D</text>
    <text x="250" y="127" class="ap-pub-label ap-pub-math ap-pub-variable" data-publication-font-role="MATH_VARIABLE" data-publication-tone="neutral" font-size="28.9" style="font-size:28.9px!important">C</text>
    <text x="225" y="72" class="ap-pub-label ap-pub-math ap-pub-variable" data-publication-font-role="MATH_VARIABLE" data-publication-tone="neutral" font-size="28.9" style="font-size:28.9px!important">A</text>
    <text x="186" y="205" class="ap-pub-label ap-pub-math ap-pub-variable" data-publication-font-role="MATH_VARIABLE" data-publication-tone="neutral" font-size="28.9" style="font-size:28.9px!important">B</text>
  </g>
  <style id="apmath-publication-style">
:root{color:#1f2937}
text.ap-pub-label{font-size:37px!important;font-weight:500!important;fill:#1f2937!important;stroke:none!important;font-kerning:normal}
text.ap-pub-text{font-family:"Noto Sans KR", "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", Arial, sans-serif!important;font-style:normal!important}
text.ap-pub-math{font-family:"STIX Two Math", "Cambria Math", "Times New Roman", serif!important;font-style:normal!important}
text.ap-pub-variable{font-style:italic!important}
text.ap-pub-strong{font-weight:650!important}
text.ap-pub-title{font-size:44px!important;font-weight:700!important;fill:#1f2937!important}
text.ap-pub-label[data-publication-tone="teal"]{fill:#0f766e!important}
text.ap-pub-label[data-publication-tone="blue"]{fill:#2563eb!important}
text.ap-pub-label[data-publication-tone="warm"]{fill:#d97706!important}
.g,.main{stroke:#1f2937!important;stroke-width:2.05px!important}
.aux,.guide{stroke:#94a3b8!important;stroke-width:1.35px!important;stroke-dasharray:5 4}
.hi,.accent{stroke:#2563eb!important;stroke-width:2.6px!important}
.dot{fill:#2563eb!important}
line,path,polyline,polygon,circle,ellipse{stroke-linecap:round;stroke-linejoin:round}
@media print{text.ap-pub-label{font-size:17px!important}text.ap-pub-title{font-size:21px!important}}
text.ap-pub-label.ap-pub-numeric,text[data-label-kind="angle"],text[data-label-kind="angle-arc"],text[data-label-kind="length"]{font-size:22px!important;stroke:#fff!important;stroke-width:8px!important;paint-order:stroke fill!important;stroke-linejoin:round!important}
.ap-pub-angle-arc{stroke:#64748b;stroke-width:2.2;fill:none;stroke-linecap:round}
.ap-pub-dimension line{stroke:#94a3b8;stroke-width:1.6;fill:none;stroke-linecap:round}
.ap-pub-equality-mark{stroke:#64748b;stroke-width:2.5;stroke-linecap:round}

/* numeric annotation labels: half-size publication pass */
text.ap-pub-label.ap-pub-numeric,text.ap-pub-label[data-label-kind="angle"],text.ap-pub-label[data-label-kind="angle-arc"],text.ap-pub-label[data-label-kind="length"]{font-size:18.5px!important;stroke-width:3.4px!important}
</style>
  <g id="dim-q16-AD" class="ap-pub-dimension" data-owner-dimension="dim-q16-AD" data-owner-segment="AD">
    <line id="dim-q16-AD-1" x1="235" y1="75" x2="235" y2="135" fill="none" stroke="#94a3b8" stroke-width="1.8" stroke-linecap="round" data-marker-kind="dimension-line" data-owner-dimension="dim-q16-AD" data-owner-segment="AD" data-owner-start-point="AD" data-owner-end-point="AD" />
    <line id="dim-q16-AD-2" x1="229" y1="75" x2="241" y2="75" fill="none" stroke="#94a3b8" stroke-width="1.8" stroke-linecap="round" data-marker-kind="dimension-end-cap" data-owner-dimension="dim-q16-AD" data-owner-segment="AD" data-owner-start-point="AD" data-owner-end-point="AD" />
    <line id="dim-q16-AD-3" x1="229" y1="135" x2="241" y2="135" fill="none" stroke="#94a3b8" stroke-width="1.8" stroke-linecap="round" data-marker-kind="dimension-end-cap" data-owner-dimension="dim-q16-AD" data-owner-segment="AD" data-owner-start-point="AD" data-owner-end-point="AD" />
  </g>
  <g id="dim-q16-DC" class="ap-pub-dimension" data-owner-dimension="dim-q16-DC" data-owner-segment="DC">
    <line id="dim-q16-DC-1" x1="205" y1="155" x2="235" y2="155" fill="none" stroke="#94a3b8" stroke-width="1.8" stroke-linecap="round" data-marker-kind="dimension-line" data-owner-dimension="dim-q16-DC" data-owner-segment="DC" data-owner-start-point="DC" data-owner-end-point="DC" />
    <line id="dim-q16-DC-2" x1="205" y1="149" x2="205" y2="161" fill="none" stroke="#94a3b8" stroke-width="1.8" stroke-linecap="round" data-marker-kind="dimension-end-cap" data-owner-dimension="dim-q16-DC" data-owner-segment="DC" data-owner-start-point="DC" data-owner-end-point="DC" />
    <line id="dim-q16-DC-3" x1="235" y1="149" x2="235" y2="161" fill="none" stroke="#94a3b8" stroke-width="1.8" stroke-linecap="round" data-marker-kind="dimension-end-cap" data-owner-dimension="dim-q16-DC" data-owner-segment="DC" data-owner-start-point="DC" data-owner-end-point="DC" />
  </g>
</svg>