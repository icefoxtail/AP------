<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 270" role="img" aria-labelledby="title desc" data-publication-style-version="AP_M3_PUBLICATION_2026_10_04" style="color:#1f2937">
<title id="title">16번 해설 도형</title><desc id="desc">현 AB의 중점 D와 원의 중심 O, 원 위의 점 C가 일직선 위에 있고 AD=DB=6cm, DC=3cm, OD=r-3임을 나타낸 도형</desc>
<rect width="100%" height="100%" fill="white" />
<circle cx="160" cy="135" r="75" fill="none" stroke="currentColor" stroke-width="2.05" />
<g fill="none" stroke="currentColor" stroke-width="2.05">
  <line x1="205" y1="75" x2="205" y2="195" />
  <line x1="160" y1="135" x2="235" y2="135" />
  <line x1="160" y1="135" x2="205" y2="75" />
  <polyline points="205,135 205,125 215,125 215,135" stroke-width="1.35" />
</g>
<g fill="currentColor" font-family="Arial, sans-serif" font-size="15">
  <g class="ap-pub-equality-mark" data-equal-segment="AD,DB"><line x1="199.00" y1="105.00" x2="211.00" y2="105.00"/><line x1="199.00" y1="165.00" x2="211.00" y2="165.00"/></g><polyline id="right-angle-at-D" data-owner-vertex="pt-D" data-owner-rays="seg-OD seg-AD" points="195,135 195,125 205,125 205,135" fill="none" stroke="#64748b" stroke-width="1.6" stroke-linejoin="round"/><text id="length-label-q16-AD" class="ap-pub-label ap-pub-math ap-pub-numeric" x="222" y="107" text-anchor="middle" data-label-kind="length" data-owner-segment="AD" data-owner-segment-endpoints="205,75;205,135" data-owner-type="STRAIGHT_SEGMENT_LENGTH" data-fact-role="GIVEN">6</text><text id="length-label-q16-DC" class="ap-pub-label ap-pub-math ap-pub-numeric" x="222" y="122" text-anchor="middle" data-label-kind="length" data-owner-segment="DC" data-owner-segment-endpoints="205,135;235,135" data-owner-type="STRAIGHT_SEGMENT_LENGTH" data-fact-role="GIVEN">3</text><text id="length-label-q16-OD" class="ap-pub-label ap-pub-math ap-pub-variable" x="181" y="154" text-anchor="middle" data-label-kind="length" data-owner-segment="OD" data-owner-segment-endpoints="160,135;205,135" data-owner-type="STRAIGHT_SEGMENT_LENGTH" data-fact-role="GIVEN">r−3</text><text id="length-label-q16-OC" class="ap-pub-label ap-pub-math ap-pub-variable" x="222" y="154" text-anchor="middle" data-label-kind="length" data-owner-segment="OC" data-owner-segment-endpoints="160,135;235,135" data-owner-type="RADIUS_LENGTH" data-fact-role="GIVEN">r</text><text x="136" y="182" class="ap-pub-label ap-pub-math ap-pub-variable" data-publication-font-role="MATH_VARIABLE" data-publication-tone="neutral">O</text>
  <text x="190" y="182" class="ap-pub-label ap-pub-math ap-pub-variable" data-publication-font-role="MATH_VARIABLE" data-publication-tone="neutral">D</text>
  <text x="256" y="173" class="ap-pub-label ap-pub-math ap-pub-variable" data-publication-font-role="MATH_VARIABLE" data-publication-tone="neutral">C</text>
  <text x="211" y="69" class="ap-pub-label ap-pub-math ap-pub-variable" data-publication-font-role="MATH_VARIABLE" data-publication-tone="neutral">A</text>
  <text x="221" y="228" class="ap-pub-label ap-pub-math ap-pub-variable" data-publication-font-role="MATH_VARIABLE" data-publication-tone="neutral">B</text>





</g>
<style id="apmath-publication-style">
:root{color:#1f2937}
text.ap-pub-label{font-size:37px!important;font-weight:500!important;fill:#1f2937!important;stroke:none!important;font-kerning:normal}
