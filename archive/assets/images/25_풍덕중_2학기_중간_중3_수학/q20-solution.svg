<svg xmlns="http://www.w3.org/2000/svg" width="420" height="300" viewBox="0 0 420 300" preserveAspectRatio="xMidYMid meet" role="img" aria-label="원 O의 외부점 P에서 접선 PA, PB를 그었다. OA와 OB는 접선에 수직인 같은 반지름이며, OP는 두 직각삼각형의 공통 빗변이다." data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="CUSTOM_SOLUTION_SLOT_420x300" data-geometry-fact-hash="sha256:112426050e3bc14cbf55b5094eac62cae14974e380a3c283994cfdfa69d27e5a" data-visual-provenance="SOURCE_SOLUTION_PYTHON_COORDINATE_MODEL"><title>원 O의 외부점 P에서 접선 PA, PB를 그었다. OA와 OB는 접선에 수직인 같은 반지름이며, OP는 두 직각삼각형의 공통 빗변이다.</title><desc>OA=OB는 같은 원의 반지름이고 OP는 공통이다. 두 직각삼각형은 RHS 합동이므로 PA=PB가 결론이다.</desc><style>text{font-family:Arial,"Malgun Gothic",sans-serif}.math{font-family:Times New Roman,Cambria Math,serif}.main{stroke:#202124;stroke-width:2.05}.aux{stroke:#59636e;stroke-width:1.35}</style><g id="geometry"><circle id="circle-main" cx="200" cy="150" r="52" fill="none" stroke="#202124" stroke-width="2.0" /><line id="seg-PA" x1="282" y1="150" x2="232.97561" y2="109.792922" fill="none" stroke="#202124" stroke-width="2.05" stroke-linecap="round" stroke-linejoin="round" /><line id="seg-PB" x1="282" y1="150" x2="232.97561" y2="190.207078" fill="none" stroke="#202124" stroke-width="2.05" stroke-linecap="round" stroke-linejoin="round" /><line id="seg-OA" x1="200" y1="150" x2="232.97561" y2="109.792922" fill="none" stroke="#59636e" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round" /><line id="seg-OB" x1="200" y1="150" x2="232.97561" y2="190.207078" fill="none" stroke="#59636e" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round" /><line id="seg-OP" x1="200" y1="150" x2="282" y2="150" fill="none" stroke="#59636e" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round" /><polyline id="right-angle-A" data-owner-vertex="pt-A" data-owner-rays="seg-OA seg-PA" points="226.634146,117.525052 234.366277,123.866515 240.70774,116.134385" fill="none" stroke="#3e7773" stroke-width="1.15" strok