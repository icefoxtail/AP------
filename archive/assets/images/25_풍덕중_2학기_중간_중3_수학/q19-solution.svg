<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-labelledby="title desc">
<title id="title">19번 해설 도형</title><desc id="desc">지름 AB=6인 반원에서 AD, BC, CD가 접선이고 AD=DE=9/5, BC=CE=5인 관계를 표시한 도형</desc>
<rect width="100%" height="100%" fill="white"/>
<g fill="none" stroke="currentColor" stroke-width="2">
  <path d="M 120.00 250.00 A 120.00 120.00 0 0 1 360.00 250.00"/>
  <line x1="120.00" y1="250.00" x2="120.00" y2="178.00"/>
  <line x1="360.00" y1="250.00" x2="360.00" y2="50.00"/>
  <line x1="120.00" y1="178.00" x2="360.00" y2="50.00"/>
  <line x1="240.00" y1="250.00" x2="183.53" y2="144.12" stroke-dasharray="5 4"/>
</g>
<g fill="currentColor" font-family="Arial, sans-serif" font-size="15">
  <text x="108" y="272">A</text><text x="370" y="272">B</text><text x="238" y="272">O</text>
  <text x="104" y="170.00">D</text><text x="370" y="54.00">C</text><text x="179.53" y="134.12">E</text>
  <text x="91" y="214.00">9/5</text><text x="375" y="150.00">5</text><text x="240" y="286" text-anchor="middle">AB=6</text>
  <text x="143.76" y="151.06">DE=9/5</text>
  <text x="279.76" y="91.06">CE=5</text>
</g>
</svg>