<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 850" role="img" aria-labelledby="title desc">
  <title id="title">내접원의 접선 길이</title>
  <desc id="desc">각 꼭짓점에서 같은 원에 그은 접선 조각의 길이를 같게 둔다. 세 변의 길이 식을 빼서 접선 조각 x를 구한다.</desc>
  <style>
    .ko{font-family:"Noto Sans KR","Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;fill:#16324f}
    .math{font-family:"STIX Two Math","Cambria Math","Times New Roman",serif;fill:#16324f}
    .title{font-size:24px;font-weight:700}.body{font-size:20px}.small{font-size:17px;fill:#52677f}.result{font-size:24px;font-weight:700}
  </style>
  <rect width="560" height="850" rx="18" fill="#f5f8fc"/>
  <text id="title" x="28" y="42" class="ko title">꼭짓점에서 같은 접선 길이</text>
  <rect x="28" y="68" width="504" height="386" rx="14" fill="#fff" stroke="#d9e2ed"/>
  <g transform="translate(-43 12)">
    <path d="M260 375 L386 375 L232 124.56 Z" fill="none" stroke="#16324f" stroke-width="3" stroke-linejoin="round"/>
    <circle cx="302" cy="328.04" r="46.96" fill="#eaf1fb" stroke="#246bce" stroke-width="3"/>
    <line x1="260" y1="375" x2="302" y2="375" stroke="#d97919" stroke-width="5" stroke-linecap="round"/>
    <line x1="302" y1="375" x2="386" y2="375" stroke="#138a82" stroke-width="5" stroke-linecap="round"/>
    <line x1="260" y1="375" x2="255.33" y2="333.26" stroke="#d97919" stroke-width="4" stroke-linecap="round"/>
    <line x1="255.33" y1="333.26" x2="232" y2="124.56" stroke="#805ad5" stroke-width="4" stroke-linecap="round"/>
    <line x1="386" y1="375" x2="342" y2="303.45" stroke="#138a82" stroke-width="4" stroke-linecap="round"/>
    <line x1="342" y1="303.45" x2="232" y2="124.56" stroke="#805ad5" stroke-width="4" stroke-linecap="round"/>
    <circle cx="302" cy="375" r="4" fill="#d97919"/><circle cx="342" cy="303.45" r="4" fill="#138a82"/><circle cx="255.33" cy="333.26" r="4" fill="#d97919"/>
    <circle cx="302" cy="328.04" r="4" fill="#16324f"/>
    <g class="math body">
      <text x="247" y="397">A</text><text x="390" y="397">B</text><text x="218" y="120">C</text><text x="299" y="322">O</text>
      <text x="297" y="397" fill="#d97919">P</text><text x="348" y="299" fill="#138a82">Q</text><text x="240" y="330" fill="#d97919">R</text>
      <text x="315" y="425" class="math small">AB=3</text><text x="220" y="260" class="math small">AC=6</text><text x="320" y="235" class="math small">BC=7</text>
    </g>
  </g>
  <text x="280" y="432" text-anchor="middle" class="ko small">같은 꼭짓점에서 그은 두 접선 조각의 길이는 같습니다.</text>
  <rect x="28" y="470" width="504" height="340" rx="14" fill="#fff" stroke="#d9e2ed"/>
  <text x="54" y="513" class="ko small">접점까지의 길이를 꼭짓점별로 둔다</text>
  <text x="54" y="555" class="math body" fill="#138a82">BP = BQ = u</text>
  <text x="54" y="591" class="math body" fill="#d97919">AP = AR = w</text>
  <text x="54" y="627" class="math body" fill="#805ad5">CQ = CR = x</text>
  <line x1="54" y1="649" x2="506" y2="649" stroke="#e4eaf1"/>
  <text x="54" y="687" class="math body">u + w = 3,  w + x = 6,  u + x = 7</text>
  <rect x="52" y="716" width="456" height="66" rx="12" fill="#e7f5f2" stroke="#8fc9bd"/>
  <text x="280" y="758" text-anchor="middle" class="ko result">2x = 6 + 7 − 3 = 10  →  x = 5</text>
</svg>
