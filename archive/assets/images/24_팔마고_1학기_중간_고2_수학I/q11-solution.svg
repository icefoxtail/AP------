<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 320" role="img" aria-labelledby="title desc" width="520" height="320">
  <title id="title">y축 대칭으로 가능한 중심각 후보</title>
  <desc id="desc">가능한 theta 값 36도와 108도를 각각 동경 대칭으로 확인하고 더 큰 각을 선택한다.</desc>
  <style>
    text{font-family:"Noto Sans KR",Arial,sans-serif;fill:#172033}.muted{fill:#526174}.blue{fill:#1d4ed8}.teal{fill:#0f766e}
  </style>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#334155"/></marker></defs>
  <rect width="520" height="320" rx="16" fill="#f8fafc"/>
  <text x="24" y="32" font-size="20" font-weight="700">y축 대칭으로 가능한 중심각 후보</text>
  <rect x="18" y="54" width="236" height="210" rx="12" fill="#fff" stroke="#cbd5e1"/>
  <rect x="266" y="54" width="236" height="210" rx="12" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="34" y="79" font-size="15" font-weight="700">후보 1</text>
  <text x="282" y="79" font-size="15" font-weight="700" fill="#1d4ed8">후보 2 · 더 큰 θ</text>
  <path d="M130 104 L130 245 M54 205 L218 205 M390 104 L390 245 M314 205 L478 205" stroke="#94a3b8" stroke-width="1.5"/>
  <path d="M130 115 L130 245 M390 115 L390 245" stroke="#0f766e" stroke-width="2" stroke-dasharray="5 5"/>
  <text x="134" y="121" font-size="13" class="muted">y</text>
  <text x="394" y="121" font-size="13" class="muted">y</text>
  <path d="M130 205 L191.485292 160.328321 M130 205 L68.514708 160.328321" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M390 205 L366.514708 132.719705 M390 205 L413.485292 132.719705" stroke="#1d4ed8" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M150 205 A20 20 0 0 0 146.18034 193.244295" fill="none" stroke="#334155" stroke-width="2"/>
  <path d="M162 205 A32 32 0 0 0 104.105091 186.206148" fill="none" stroke="#334155" stroke-width="2"/>
  <path d="M410 205 A20 20 0 0 0 383.81966 185.97887" fill="none" stroke="#2563eb" stroke-width="2"/>
  <path d="M422 205 A32 32 0 0 0 399.888183 174.583112" fill="none" stroke="#2563eb" stroke-width="2"/>
  <circle cx="130" cy="205" r="3.5" fill="#0f172a"/><circle cx="390" cy="205" r="3.5" fill="#0f172a"/>
  <text x="78" y="145" font-size="14" font-weight="700">4θ=144°</text>
  <text x="151" y="185" font-size="14" font-weight="700">θ=36°</text>
  <text x="322" y="176" font-size="14" font-weight="700" fill="#1d4ed8">θ=108°</text>
  <text x="418" y="143" font-size="13" font-weight="700" fill="#1d4ed8">4θ=432°</text>
  <text x="418" y="159" font-size="12" class="muted">동경은 72°</text>
  <text x="31" y="246" font-size="13" class="muted">36°와 144°는 y축 대칭</text>
  <text x="281" y="246" font-size="13" class="muted">108°와 432°의 동경은 대칭</text>
  <rect x="112" y="276" width="296" height="30" rx="15" fill="#dbeafe"/>
  <text x="260" y="297" text-anchor="middle" font-size="15" font-weight="700" class="blue">최댓값은 θ=108°일 때</text>
</svg>