  <path d="M268 250 A36 36 0 0 0 250 218.823085" fill="none" stroke="#0f766e" stroke-width="2.5"/>
  <text x="268" y="218" font-size="15" font-weight="700" fill="#0f766e">60°</text>
  <path d="M187 166 l7 12 M189 164 l7 12 M204 250 l0 -8 M207 250 l0 -8" stroke="#7c3aed" stroke-width="2.5"/>
