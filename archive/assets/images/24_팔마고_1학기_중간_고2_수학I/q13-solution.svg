<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 320" role="img" aria-labelledby="title desc" width="520" height="320">
  <title id="title">호의 길이에서 부채꼴 넓이로</title>
  <desc id="desc">반원에서 호 BP의 중심각을 구하고, 현 AP의 길이와 부채꼴 APQ의 각을 연결한다.</desc>
  <style>
    text { font-family: "Noto Sans KR", Arial, sans-serif; fill: #172033; }
    .muted { fill: #526174; }
    .given { stroke: #334155; }
    .derived { stroke: #2563eb; }
  </style>
  <rect width="520" height="320" rx="16" fill="#f8fafc"/>
  <text x="24" y="32" font-size="20" font-weight="700">호의 길이에서 부채꼴 넓이로</text>
  <text x="24" y="58" class="muted" font-size="14">중심각 → 현 AP → 부채꼴 중심각</text>
