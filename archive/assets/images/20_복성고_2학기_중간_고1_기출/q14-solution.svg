<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" role="img" aria-labelledby="title desc" data-geometry-mode="FUNCTION_GRAPH" data-coordinate-provenance="DERIVED_FROM_SOLUTION" data-axis-scale-mode="NON_UNIFORM_EXPLICIT">
<title id="title">정의역 끝점과 치역의 최솟값</title><desc id="desc">y=(x+2)²+4의 왼쪽 가지에서 정의역 x≤−2를 취한다. 꼭짓점에서 a=−2, b=4이고 치역은 y≥4이다.</desc>
<style>text{font-family:"Noto Sans KR","Malgun Gothic",sans-serif;fill:#172033}.math{font-family:"STIX Two Math","Cambria Math",serif;font-style:italic}.axis{stroke:#475569;stroke-width:1.4}.curve{fill:none;stroke:#2563eb;stroke-width:3}.guide{stroke:#64748b;stroke-width:1.2;stroke-dasharray:5 4}.point{fill:#b91c1c}</style>
<rect width="600" height="400" fill="#fff"/><text x="28" y="32" font-size="18" font-weight="700">정의역 끝점이 치역의 최솟값을 정한다</text><text x="28" y="56" class="math" font-size="15">f(x)=(x+2)²+4, x≤−2</text>
<line x1="24" y1="330" x2="410" y2="330" class="axis"/><line x1="285" y1="62" x2="285" y2="355" class="axis"/><text x="414" y="335" class="math" font-size="16">x</text><text x="278" y="58" class="math" font-size="16">y</text>
<polyline points="21,90 65,174 109,234 153,270 197,282" class="curve"/><line x1="197" y1="282" x2="197" y2="330" class="guide"/><line x1="197" y1="282" x2="285" y2="282" class="guide"/><circle cx="197" cy="282" r="5" class="point"/><text x="203" y="324" class="math" font-size="14">a=−2</text><text x="290" y="277" class="math" font-size="14">b=4</text><text x="35" y="83" class="math" font-size="14">x≤a</text>
<line x1="42" y1="122" x2="24" y2="88" stroke="#2563eb" stroke-width="2"/><polyline points="24,88 24,98 34,90" fill="none" stroke="#2563eb" stroke-width="2"/>
<rect x="365" y="112" width="202" height="114" rx="12" fill="#f8fafc" stroke="#cbd5e1"/><text x="384" y="145" font-size="15">역함수가 존재하려면</text><text x="384" y="174" class="math" font-size="16">a≤−2</text><text x="384" y="204" class="math" font-size="16">b≥4</text><text x="365" y="260" font-size="15" fill="#b91c1c">최댓값 ab=(−2)·4=−8</text>
</svg>



