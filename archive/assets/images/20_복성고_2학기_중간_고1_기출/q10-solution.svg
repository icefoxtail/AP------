<svg xmlns="http://www.w3.org/2000/svg" width="600" height="420" viewBox="0 0 600 420" role="img" aria-labelledby="title desc" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT">
<title id="title">원점과 직선 사이의 최단거리</title><desc id="desc">직선 3x+2y=26과 원점 O, 수선의 발 H(6,4)를 나타낸다. OH는 직선에 수직이고 길이는 2√13이다.</desc>
<style>text{font-family:"Noto Sans KR","Malgun Gothic",sans-serif;fill:#172033}.math{font-family:"STIX Two Math","Cambria Math",serif;font-style:italic}.axis{stroke:#475569;stroke-width:1.5}.line{stroke:#2563eb;stroke-width:3;fill:none}.distance{stroke:#dc2626;stroke-width:2.4;fill:none}.point{fill:#111827}.right{fill:none;stroke:#111827;stroke-width:1.4}</style>
<rect width="600" height="420" fill="#fff"/><text x="28" y="34" font-size="18" font-weight="700">원점에서 직선까지의 거리</text><text x="28" y="58" class="math" font-size="16">3x + 2y = 26</text>
<line x1="70" y1="370" x2="540" y2="370" class="axis"/><line x1="100" y1="390" x2="100" y2="70" class="axis"/><text x="545" y="375" class="math" font-size="18">x</text><text x="82" y="88" class="math" font-size="18">y</text><circle cx="100" cy="370" r="3.5" class="point"/><text x="82" y="393" class="math" font-size="16">O</text>
<line x1="80" y1="80" x2="300" y2="410" class="line"/><circle cx="220" cy="290" r="4.5" class="point"/><line x1="100" y1="370" x2="232" y2="252" class="distance"/><polyline points="220,290 213.34,294.44 217.78,301.1 224.44,296.66" class="right"/>
<text x="228" y="286" class="math" font-size="17">H(6,4)</text><text x="370" y="226" class="math" font-size="16" fill="#b91c1c">OH=2√13</text><text x="370" y="251" font-size="15" fill="#b91c1c">최솟값 x²+y²=52</text>
</svg>


