<svg xmlns="http://www.w3.org/2000/svg" width="600" height="420" viewBox="0 0 600 420" role="img" aria-labelledby="title desc">
<title id="title">최솟값이 되는 절편의 위치</title><desc id="desc">a=6, b=8일 때 직선 x/6+y/8=1은 점 P(3,4)를 지나며 P는 두 절편을 잇는 선분의 중점이다.</desc>
<style>text{font-family:"Noto Sans KR","Malgun Gothic",sans-serif;fill:#172033}.math{font-family:"STIX Two Math","Cambria Math",serif;font-style:italic}.axis{stroke:#475569;stroke-width:1.5}.line{stroke:#2563eb;stroke-width:3;fill:none}.guide{stroke:#64748b;stroke-width:1.2;stroke-dasharray:5 4}.point{fill:#111827}.answer{fill:#b91c1c}</style>
<rect width="600" height="420" fill="#fff"/><text x="28" y="34" font-size="18" font-weight="700">등호가 성립하는 절편</text><text x="28" y="58" font-size="14">a=6, b=8 · 3/a=4/b=1/2</text>
<line x1="56" y1="350" x2="535" y2="350" class="axis"/><line x1="90" y1="386" x2="90" y2="78" class="axis"/><text x="540" y="355" class="math" font-size="18">x</text><text x="84" y="70" class="math" font-size="18">y</text><circle cx="90" cy="350" r="3.5" class="point"/><text x="72" y="373" class="math" font-size="16">O</text>
<line x1="282" y1="350" x2="90" y2="94" class="line"/><line x1="186" y1="350" x2="186" y2="222" class="guide"/><line x1="90" y1="222" x2="186" y2="222" class="guide"/><circle cx="282" cy="350" r="4" class="point"/><circle cx="90" cy="94" r="4" class="point"/><circle cx="186" cy="222" r="5" class="answer"/>
<text x="290" y="346" class="math" font-size="17">A(6,0)</text><text x="98" y="90" class="math" font-size="17">B(0,8)</text><text x="196" y="214" class="math" font-size="17">P(3,4)</text><text x="358" y="390" font-size="15" class="answer">최솟값 ab=48</text>
</svg>
