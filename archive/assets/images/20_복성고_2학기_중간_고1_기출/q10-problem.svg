<svg xmlns="http://www.w3.org/2000/svg" width="600" height="420" viewBox="0 0 600 420" role="img" aria-labelledby="title desc" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT">
<title id="title">주어진 직선의 조건</title><desc id="desc">직선 x/2+y/3=13/3의 그래프를 좌표축에 나타냈다. 원점에서 직선까지의 최단거리는 표시하지 않았다.</desc>
<style>text{font-family:"Noto Sans KR","Malgun Gothic",sans-serif;fill:#172033}.math{font-family:"STIX Two Math","Cambria Math",serif;font-style:italic}.axis{stroke:#475569;stroke-width:1.5}.line{stroke:#2563eb;stroke-width:3;fill:none}.point{fill:#111827}</style>
<rect width="600" height="420" fill="#fff"/><text x="28" y="34" font-size="18" font-weight="700">조건을 나타내는 직선</text><text x="28" y="58" class="math" font-size="16">x/2 + y/3 = 13/3</text>
<line x1="70" y1="370" x2="540" y2="370" class="axis"/><line x1="100" y1="390" x2="100" y2="70" class="axis"/><text x="545" y="375" class="math" font-size="18">x</text><text x="82" y="88" class="math" font-size="18">y</text><circle cx="100" cy="370" r="3.5" class="point"/><text x="82" y="393" class="math" font-size="16">O</text>
<line x1="80" y1="80" x2="300" y2="410" class="line"/><circle cx="273.333" cy="370" r="4" class="point"/><circle cx="100" cy="110" r="4" class="point"/><text x="281" y="363" class="math" font-size="16">(26/3,0)</text><text x="106" y="118" class="math" font-size="16">(0,13)</text>
</svg>


