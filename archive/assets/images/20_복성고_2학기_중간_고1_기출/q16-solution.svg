<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" role="img" aria-labelledby="title desc" data-geometry-mode="FUNCTION_GRAPH" data-coordinate-provenance="DERIVED_FROM_SOLUTION" data-axis-scale-mode="NON_UNIFORM_EXPLICIT">
<title id="title">함수와 역함수의 교점</title><desc id="desc">y=(x−2)², x≥2와 y=2+√x의 그래프는 (4,4)에서 만나며 그 점은 y=x 위에 있다.</desc>
<style>text{font-family:"Noto Sans KR","Malgun Gothic",sans-serif;fill:#172033}.math{font-family:"STIX Two Math","Cambria Math",serif;font-style:italic}.axis{stroke:#475569;stroke-width:1.3}.grid{stroke:#e2e8f0;stroke-width:1}.fcurve{fill:none;stroke:#2563eb;stroke-width:3}.icurve{fill:none;stroke:#16a34a;stroke-width:3}.diagonal{fill:none;stroke:#64748b;stroke-width:1.5;stroke-dasharray:5 4}.point{fill:#b91c1c}</style>
<rect width="600" height="400" fill="#fff"/><text x="28" y="30" font-size="18" font-weight="700">함수와 역함수의 교점</text>
<line x1="100" y1="340" x2="480" y2="340" class="axis"/><line x1="100" y1="350" x2="100" y2="62" class="axis"/><line x1="100" y1="308" x2="460" y2="308" class="grid"/><text x="95" y="344" class="math" font-size="14">O</text><text x="484" y="345" class="math" font-size="15">x</text><text x="94" y="60" class="math" font-size="15">y</text>
<text x="188" y="359" class="math" font-size="12">2</text><text x="278" y="359" class="math" font-size="12">4</text><text x="368" y="359" class="math" font-size="12">6</text><text x="458" y="359" class="math" font-size="12">8</text><text x="78" y="312" class="math" font-size="12">4</text><text x="72" y="216" class="math" font-size="12">16</text><text x="72" y="56" class="math" font-size="12">36</text>
<polyline points="190,340 212.5,338 235,332 257.5,322 280,308 302.5,290 325,268 347.5,242 370,212 392.5,178 415,140 437.5,98 460,52" class="fcurve"/>
<polyline points="100,324 122.5,318.3 145,316 167.5,314.2 190,312.7 212.5,311.4 235,310.1 257.5,309 280,308 302.5,307 325,306.1 347.5,305.2 370,304.4 392.5,303.6 415,302.8 437.5,302.1 460,301.4" class="icurve"/>
<line x1="100" y1="340" x2="460" y2="276" class="diagonal"/><circle cx="280" cy="308" r="5" class="point"/><line x1="280" y1="308" x2="280" y2="340" class="grid"/><text x="288" y="300" class="math" font-size="14">(4,4)</text>
<text x="365" y="106" class="math" font-size="15" fill="#2563eb">y=f(x)</text><text x="345" y="290" font-size="14" fill="#16a34a">역함수</text><text x="405" y="271" class="math" font-size="14">y=x</text><line x1="145" y1="386" x2="176" y2="386" class="fcurve"/><text x="183" y="391" font-size="13">f의 그래프</text><line x1="270" y1="386" x2="301" y2="386" class="icurve"/><text x="308" y="391" font-size="13">역함수의 그래프</text>
</svg>



