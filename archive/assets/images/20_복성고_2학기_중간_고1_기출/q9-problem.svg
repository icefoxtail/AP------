<svg xmlns="http://www.w3.org/2000/svg" width="600" height="420" viewBox="0 0 600 420" role="img" aria-labelledby="title desc">
<title id="title">양의 절편을 가진 직선과 점</title><desc id="desc">직선이 양의 x축과 y축에서 만나는 점 A(a,0), B(0,b)를 잇고, 점 P(3,4)를 지난다. 그림은 축척에 맞지 않는다.</desc>
<style>text{font-family:"Noto Sans KR","Malgun Gothic",sans-serif;fill:#172033}.math{font-family:"STIX Two Math","Cambria Math",serif;font-style:italic}.axis{stroke:#475569;stroke-width:1.5}.line{stroke:#2563eb;stroke-width:3;fill:none}.guide{stroke:#64748b;stroke-width:1.2;stroke-dasharray:5 4}.point{fill:#111827}</style>
<rect width="600" height="420" fill="#fff"/><text x="28" y="34" font-size="18" font-weight="700">양의 절편을 가진 직선</text><text x="28" y="58" font-size="13" fill="#475569">개형도 · 축척에 맞지 않음</text>
<line x1="56" y1="350" x2="535" y2="350" class="axis"/><line x1="90" y1="386" x2="90" y2="78" class="axis"/><text x="540" y="355" class="math" font-size="18">x</text><text x="84" y="70" class="math" font-size="18">y</text><circle cx="90" cy="350" r="3.5" class="point"/><text x="72" y="373" class="math" font-size="16">O</text>
<line x1="440" y1="350" x2="90" y2="110" class="line"/><line x1="300" y1="350" x2="300" y2="254" class="guide"/><line x1="90" y1="254" x2="300" y2="254" class="guide"/><circle cx="440" cy="350" r="4" class="point"/><circle cx="90" cy="110" r="4" class="point"/><circle cx="300" cy="254" r="5" fill="#dc2626"/>
<text x="448" y="346" class="math" font-size="17">A(a,0)</text><text x="98" y="106" class="math" font-size="17">B(0,b)</text><text x="308" y="246" class="math" font-size="17">P(3,4)</text>
</svg>
