<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 580" width="640" height="580" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">한 변의 길이가 16센티미터인 정사각형 안에 한 꼭짓점을 중심으로 하는 사분원과 두 변을 지름으로 하는 두 반원을 그린 그림이다. 두 반원이 만나 생기는 아래쪽 렌즈 모양과 그 위쪽 곡선 영역이 색칠되어 있다.</title><desc id="visual-desc">한 변의 길이가 16센티미터인 정사각형이 있고, 왼쪽 아래 꼭짓점을 중심으로 반지름 16센티미터인 사분원 호가 있다. 왼쪽 변과 아래쪽 변을 각각 지름으로 하는 반지름 8센티미터의 반원 두 개가 사분원 안에서 만나며, 아래쪽 렌즈 모양과 위쪽 곡선 영역에 색이 칠해져 있다. 왼쪽 변과 아래쪽 변에 16센티미터 표시가 있다.</desc><rect width="640" height="580" fill="#fff"/><g data-layer="10"><path id="lens" data-role="region" stroke="none" stroke-width="1.6" fill="#f2a65a" data-owner-points="I L M8 V0" data-mark="region" data-mark-id="lens" fill-opacity="0.42" fill-rule="evenodd" d="M109.959463038 505.000000415 A223.113207743 223.113207743 0 0 0 333.072670781 281.886792672 A223.113207743 223.113207743 0 0 0 109.959463038 505.000000415 Z"/></g><g data-layer="10"><path id="upper" data-role="region" stroke="none" stroke-width="1.6" fill="#f2a65a" data-owner-points="I L M8 V0 V1 V3" data-mark="region" data-mark-id="upper" fill-opacity="0.42" fill-rule="evenodd" d="M109.959463038 58.773584929 A446.226415486 446.226415486 0 0 1 556.185878524 505.000000415 A223.113207743 223.113207743 0 0 0 333.072670781 281.886792672 A223.113207743 223.113207743 0 0 0 109.959463038 58.773584929 Z"/></g><g data-layer="30"><l