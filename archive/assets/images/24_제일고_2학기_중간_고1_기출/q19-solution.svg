<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" role="img" aria-labelledby="title desc" width="760" height="320"><title id="title">문항 19 해설: 학생 신청 Venn diagram</title><desc id="desc">전체 20명과 수학 8명, 영어 6명, 바깥 9명을 네 영역으로 나눈 그림</desc><style>text{font-family:"Noto Sans KR",Arial,sans-serif;fill:#172033}.m{fill:#56657a}</style><rect width="760" height="320" rx="18" fill="#f8fafc"/><text x="28" y="38" font-size="22" font-weight="700">신청 학생을 네 영역으로 나누기</text><text x="28" y="66" class="m" font-size="15">바깥 학생을 제외하고 겹친 학생을 x로 둔다.</text><rect x="28" y="78" width="430" height="180" rx="14" fill="#fff" stroke="#cbd5e1"/><circle cx="220" cy="168" r="68" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><circle cx="300" cy="168" r="68" fill="#fef3c7" stroke="#d97706" stroke-width="3"/><text x="166" y="128" font-size="17">수학 8</text><text x="318" y="128" font-size="17">영어 6</text><text x="180" y="180" text-anchor="middle" font-size="18">8−x</text><text x="260" y="180" text-anchor="middle" font-size="22" fill="#7c3aed">x</text><text x="340" y="180" text-anchor="middle" font-size="18">6−x</text><text x="52" y="236" font-size="16" fill="#b91c1c">바깥 9</text><rect x="490" y="90" width="238" height="132" rx="14" fill="#fff" stroke="#cbd5e1"/><text x="514" y="126" font-size="17">n(A∪B)=20−9</text><text x="514" y="162" font-size="17">8+6−x=n(A∪B)</text><text x="514" y="198" font-size="17">수학만=8−x</text><text x="28" y="294" class="m" font-size="14">겹친 학생은 두 번 세어졌으므로 한 번 빼야 한다.</text></svg>
