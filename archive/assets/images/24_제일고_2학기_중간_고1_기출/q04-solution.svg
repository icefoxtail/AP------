<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" role="img" aria-labelledby="title desc" width="760" height="320"><title id="title">문항 4 해설: 여집합 합집합</title><desc id="desc">전체 20에서 A와 B의 겹친 영역을 제외한 18을 보여 주는 Venn diagram</desc><style>text{font-family:"Noto Sans KR",Arial,sans-serif;fill:#172033}.m{fill:#56657a}</style><rect width="760" height="320" rx="18" fill="#f8fafc"/><text x="28" y="38" font-size="22" font-weight="700">두 여집합의 합집합과 겹친 영역</text><text x="28" y="66" class="m" font-size="15">Aᶜ∪Bᶜ=(A∩B)ᶜ이므로 겹친 영역을 먼저 찾는다.</text><rect x="28" y="78" width="430" height="180" rx="14" fill="#fff" stroke="#cbd5e1"/><circle cx="220" cy="168" r="68" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><circle cx="300" cy="168" r="68" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><ellipse cx="260" cy="168" rx="35" ry="65" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="170" y="128" font-size="17">A 8</text><text x="318" y="128" font-size="17">B 9</text><text x="260" y="174" text-anchor="middle" font-size="21">?</text><text x="52" y="236" font-size="16" fill="#b91c1c">겹친 부분의 바깥 = 18</text><rect x="490" y="90" width="238" height="132" rx="14" fill="#fff" stroke="#cbd5e1"/><text x="514" y="126" font-size="17">n(A∩B)=20−18</text><text x="514" y="162" font-size="17">A만=8−n(A∩B)</text><text x="514" y="198" font-size="17">B만=9−n(A∩B)</text><text x="28" y="294" class="m" font-size="14">교집합을 정한 뒤 합집합에서는 겹친 영역을 한 번 뺀다.</text></svg>
