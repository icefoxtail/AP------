<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" width="600" height="320" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">좌변을 전개하면 4x²−3x이고, 우변을 정리하면 (a+1)²x²+2x이므로 (4−(a+1)²)x²−5x=0이다. 이차방정식이 되려면 x²의 계수가 0이 아니어야 하므로 4−(a+1)²≠0이다. (a+1)²≠4에서 a+1≠2, a+1≠−2이므로 a≠1, a≠−3이다. 따라서 답은 ④이다.</title><desc id="visual-desc">수직선 위에 두 점이 표시되어 있고, 각 점에 a=-3 제외, a=1 제외라는 라벨이 붙어 있다.</desc><rect width="600" height="320" fill="#fff"/><g data-layer="30"><line id="base" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="60.714285714" y1="160" x2="539.285714286" y2="160"/></g><g data-layer="30"><line id="tickP" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="180.357142857" y1="100.178571429" x2="180.357142857" y2="219.821428571"/></g><g data-layer="30"><line id="tickQ" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="419.642857143" y1="100.178571429" x2="419.642857143" y2="219.821428571"/></g><g data-layer="85"><line id="lP-owner-leader" data-role="leader" data-owner-label="lP" data-owner="tickP" x1="180.357142857" y1="136.071428571" x2="217.423614935" y2="116.071428571" stroke="#666" stroke-width="0.8" fill="none"/></g><g data-layer="85"><line id="lQ-owner-leader" data-role="leader" data-owner-label="lQ" data-owner="tickQ" x1="419.642857143" y1="136.071428571" x2="454.509831626" y2="116.071428571