<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 705 544" width="705" height="544" role="img" aria-labelledby="title desc"><title id="title">직선과 포물선에 놓이는 가로 선분</title><desc id="desc">파란 위로 열린 포물선 위 P와 주황 점선 직선 위 Q를 가로선으로 연결했다. 포물선의 y절편은 −2이다.</desc><rect width="705" height="544" fill="white" /><line x1="299.3198" y1="469.9769" x2="639.6036" y2="86.8019" stroke="#aa5411" stroke-width="5.3" stroke-linecap="round" stroke-dasharray="14 7" /><line x1="346.9730" y1="324.7748" x2="428.2686" y2="324.7748" stroke="#25736e" stroke-width="4.4" stroke-linecap="round" /><line x1="53.0000" y1="314.2885" x2="649.0000" y2="314.2885" stroke="#4d5d72" stroke-width="1.65" stroke-linecap="round" /><polygon points="649.0000,314.2885 636.0000,309.2885 636.0000,319.2885" fill="#4d5d72" /><text x="666.0000" y="306.2885" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#4d5d72" text-anchor="middle">x</text><line x1="169.1126" y1="473.0000" x2="169.1126" y2="80.0000" stroke="#4d5d72" stroke-width="1.65" stroke-linecap="round" /><polygon points="169.1126,80.0000 164.1126,93.0000 174.1126,93.0000" fill="#4d5d72" /><text x="185.1126" y="86.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#4d5d72" text-anchor="middle">y</text><text x="148.1126" y="342.2885" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#4d5d72" text-anchor="middle">O</text><path d="M 71.1216 198.9732 Q 253.0090 702.8143 434.8964 96.5665" stroke="#205d9c" stroke-width="6.0" stroke-linecap="round" fill="none" /><circle cx="346.97297297297297" cy="324.7747596153846" r="6.0" fill="white" stroke="#25736e" stroke-width="3.1" /><text x="334.9730" y="355.7748" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#25736e" text-anchor="middle">P</text><circle cx="428.2685810810811" cy="324.7747596153846" r="6.0" fill="white" stroke="#25736e" stroke-width="3.1" /><text x="449.2686" y="324.7748" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#25736e" text-anchor="middle">Q</text><line x1="164.1126" y1="389.8654" x2="174.1126" y2="389.8654" stroke="#4d5d72" stroke-width="1.7" stroke-linecap="round" /><text x="146.1126" y="399.8654" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#4d5d72" text-anchor="middle">−2</text><line x1="64.0000" y1="39.0000" x2="114.0000" y2="39.0000" stroke="#205d9c" stroke-width="5.4" stroke-linecap="round" /><text x="126.0000" y="47.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#205d9c" text-anchor="start">y = x² − 2x − 2</text><line x1="379.0000" y1="39.0000" x2="429.0000" y2="39.0000" stroke="#aa5411" stroke-width="5.4" stroke-linecap="round" stroke-dasharray="14 7" /><text x="441.0000" y="47.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#aa5411" text-anchor="start">y = 2x − 8</text></svg>
