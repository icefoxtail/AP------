y="156.90156062424973" r="6.0" fill="white" stroke="#25736e" stroke-width="3.1" /><text x="355.7042" y="136.9016" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#25736e" text-anchor="middle">A</text><circle cx="165.03697996918334" cy="345.6170468187275" r="6.0" fill="white" stroke="#25736e" stroke-width="3.1" /><text x="145.0370" y="329.6170" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#25736e" text-anchor="middle">B</text><circle cx="440.53775038520797" cy="204.08043217286917" r="6.0" fill="white" stroke="#25736e" stroke-width="3.1" /><text x="462.5378" y="195.0804" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#25736e" text-anchor="middle">C</text><line x1="64.0000" y1="39.0000" x2="114.0000" y2="39.0000" stroke="#205d9c" stroke-width="5.4" stroke-linecap="round" /><text x="126.0000" y="47.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#205d9c" text-anchor="start">y = −x² − 2x + 3</text></svg>
