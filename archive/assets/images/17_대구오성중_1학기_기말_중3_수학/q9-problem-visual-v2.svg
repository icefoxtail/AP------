<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 705 544" width="705" height="544" role="img" aria-labelledby="title desc"><title id="title">직선과 두 좌표축이 함께 만드는 사다리꼴</title><desc id="desc">원점 O 오른쪽의 A에서 수직으로 올라가 직선 위 P에 닿는다. 직선과 y축이 만나는 B 높이는 2이다. 점 P, B, O, A를 이은 사다리꼴을 칠했다.</desc><rect width="705" height="544" fill="white" /><polygon points="519.4010,142.8944 177.9427,301.0288 177.9427,408.8477 519.4010,408.8477" fill="none" /><line x1="69.2969" y1="351.3425" x2="640.4635" y2="86.8285" stroke="#205d9c" stroke-width="6.0" stroke-linecap="round" /><line x1="519.4010" y1="142.8944" x2="519.4010" y2="408.8477" stroke="#25736e" stroke-width="3.6" stroke-linecap="round" /><line x1="53.0000" y1="408.8477" x2="649.0000" y2="408.8477" stroke="#4d5d72" stroke-width="1.65" stroke-linecap="round" /><polygon points="649.0000,408.8477 636.0000,403.8477 636.0000,413.8477" fill="#4d5d72" /><text x="666.0000" y="400.8477" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#4d5d72" text-anchor="middle">x</text><line x1="177.9427" y1="473.0000" x2="177.9427" y2="80.0000" stroke="#4d5d72" stroke-width="1.65" stroke-linecap="round" /><polygon points="177.9427,80.0000 172.9427,93.0000 182.9427,93.0000" fill="#4d5d72" /><text x="193.9427" y="86.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#4d5d72" text-anchor="middle">y</text><text x="156.9427" y="436.8477" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#4d5d72" text-anchor="middle">O</text><circle cx="519.4010416666667" cy="142.8943758573388" r="6.0" fill="white" stroke="#25736e" stroke-width="3.1" /><text x="529.4010" y="122.8944" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#25736e" text-anchor="middle">P</text><circle cx="519.4010416666667" cy="408.8477366255144" r="6.0" fill="white" stroke="#25736e" stroke-width="3.1" /><text x="527.4010" y="437.8477" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#25736e" text-anchor="middle">A</text><circle cx="177.94270833333331" cy="301.0288065843621" r="6.0" fill="white" stroke="#25736e" stroke-width="3.1" /><text x="155.9427" y="288.0288" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#25736e" text-anchor="middle">B</text><line x1="172.9427" y1="301.0288" x2="182.9427" y2="301.0288" stroke="#4d5d72" stroke-width="1.7" stroke-linecap="round" /><text x="154.9427" y="311.0288" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#4d5d72" text-anchor="middle">2</text><line x1="64.0000" y1="39.0000" x2="114.0000" y2="39.0000" stroke="#205d9c" stroke-width="5.4" stroke-linecap="round" /><text x="126.0000" y="47.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#205d9c" text-anchor="start">y = 2x/3 + 2</text></svg>
