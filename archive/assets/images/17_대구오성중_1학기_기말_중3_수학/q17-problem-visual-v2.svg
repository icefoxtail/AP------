<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 705 544" width="705" height="544" role="img" aria-labelledby="title desc"><title id="title">원점 오른쪽에 꼭짓점이 있는 포물선</title><desc id="desc">위로 열린 파란 곡선의 꼭짓점은 y축의 오른쪽에 있다. 곡선이 x축을 y축 양쪽에서 지나며 y축과 만나는 점은 x축 아래이다.</desc><rect width="705" height="544" fill="white" /><line x1="53.0000" y1="338.5818" x2="649.0000" y2="338.5818" stroke="#4d5d72" stroke-width="1.65" stroke-linecap="round" /><polygon points="649.0000,338.5818 636.0000,333.5818 636.0000,343.5818" fill="#4d5d72" /><text x="666.0000" y="330.5818" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#4d5d72" text-anchor="middle">x</text><line x1="280.6389" y1="473.0000" x2="280.6389" y2="58.0000" stroke="#4d5d72" stroke-width="1.65" stroke-linecap="round" /><polygon points="280.6389,58.0000 275.6389,71.0000 285.6389,71.0000" fill="#4d5d72" /><text x="296.6389" y="64.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#4d5d72" text-anchor="middle">y</text><text x="259.6389" y="366.5818" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#4d5d72" text-anchor="middle">O</text><path d="M 104.3222 86.1713 Q 326.1667 711.0551 548.0111 86.1713" stroke="#205d9c" stroke-width="6.0" stroke-linecap="round" fill="none" /></svg>
