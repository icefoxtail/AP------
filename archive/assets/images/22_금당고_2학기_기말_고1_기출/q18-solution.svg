<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-labelledby="title desc" data-scale-policy="SCHEMATIC_ALLOWED" width="720" height="360">
  <title id="title">문항 18 해설: 교점 조건과 양의 정수 조건</title>
  <desc id="desc">양의 정수 n에서 n=9일 때 포물선과 제곱근 그래프가 (3,3)에서 접하여 교점이 하나이다.</desc>
  <style>
    text{font-family:"Noto Sans KR","Malgun Gothic",Arial,sans-serif;fill:#172033}.muted{fill:#56657a}.math{font-family:Georgia,"Times New Roman",serif}
  </style>
  <rect width="760" height="400" rx="18" fill="#f8fafc"/>
  <text x="30" y="38" font-size="22" font-weight="700">교점 조건과 양의 정수 조건</text>
  <text x="30" y="67" class="muted" font-size="15">양의 정수 n에서는 n=9일 때 (3,3)에서 접하여 한 번만 만난다.</text>
  <rect x="30" y="84" width="460" height="270" rx="12" fill="#fff" stroke="#cbd5e1"/>
  <g stroke="#e2e8f0" stroke-width="1">
    <line x1="70" y1="100" x2="70" y2="330"/><line x1="130" y1="100" x2="130" y2="330"/><line x1="190" y1="100" x2="190" y2="330"/><line x1="250" y1="100" x2="250" y2="330"/><line x1="310" y1="100" x2="310" y2="330"/><line x1="370" y1="100" x2="370" y2="330"/><line x1="430" y1="100" x2="430" y2="330"/>
    <line x1="70" y1="300" x2="450" y2="300"/><line x1="70" y1="250" x2="450" y2="250"/><line x1="70" y1="200" x2="450" y2="200"/><line x1="70" y1="150" x2="450" y2="150"/><line x1="70" y1="100" x2="450" y2="100"/>
  </g>
  <line x1="70" y1="300" x2="450" y2="300" stroke="#172033" stroke-width="2"/><line x1="70" y1="100" x2="70" y2="330" stroke="#172033" stroke-width="2"/>
  <path d="M70 262.5 C95 261 135 258.3 160 258.3 C175 255 185 248 190 245.8 C215 237 235 226 250 225 C270 224 300 201 310 195.8 C330 183 350 164 370 158.3 C392 150 418 116 430 112.5" fill="none" stroke="#2563eb" stroke-width="4"/>
  <path d="M160 300 C175 275 185 260 190 256.7 C200 249 213 240 220 238.8 C230 232 243 226 250 225 C270 218 295 207 310 203.2 C330 198 350 190 370 185.4 C390 180 415 172 430 170.1" fill="none" stroke="#f97316" stroke-width="4"/>
  <line x1="190" y1="250" x2="310" y2="200" stroke="#dc2626" stroke-width="2" stroke-dasharray="7 5"/>
  <circle cx="250" cy="225" r="7" fill="#dc2626"/><line x1="250" y1="225" x2="250" y2="300" stroke="#dc2626" stroke-dasharray="5 5"/><line x1="70" y1="225" x2="250" y2="225" stroke="#dc2626" stroke-dasharray="5 5"/>
  <text x="259" y="216" font-size="15" font-weight="700" fill="#dc2626">(3,3)</text><text x="330" y="126" font-size="14" font-weight="700" fill="#2563eb">A: y=(x²+9)/6</text><text x="275" y="270" font-size="14" font-weight="700" fill="#ea580c">B: y=√(6x−9)</text><text x="190" y="243" font-size="12" font-weight="700" fill="#dc2626">(3,3)에서 한 점에서 만남</text>
  <text x="72" y="321" class="muted" font-size="12">0</text><text x="247" y="321" class="muted" font-size="12">3</text><text x="427" y="321" class="muted" font-size="12">6</text><text x="440" y="294" class="muted" font-size="12">x</text><text x="76" y="108" class="muted" font-size="12">y</text><text x="55" y="304" class="muted" font-size="11">0</text><text x="52" y="254" class="muted" font-size="11">2</text><text x="52" y="204" class="muted" font-size="11">4</text><text x="52" y="154" class="muted" font-size="11">6</text><text x="52" y="104" class="muted" font-size="11">8</text>
  <rect x="520" y="100" width="205" height="232" rx="14" fill="#fff" stroke="#cbd5e1"/>
  <text x="542" y="137" font-size="16" font-weight="700">대수적 확인</text>
  <text x="542" y="176" class="math" font-size="21">x=y</text>
  <text x="542" y="211" class="math" font-size="21">x²−6x+n=0</text>
  <text x="542" y="244" class="muted" font-size="14">한 점: n=9</text>
  <text x="542" y="272" class="math" font-size="19" font-weight="700" fill="#1d4ed8">양의 정수 조건 ⇒ n=9</text>
</svg>
