<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-labelledby="title desc" data-scale-policy="SCHEMATIC_ALLOWED" width="720" height="360">
  <title id="title">문항 13 해설: 교점이 생기지 않는 기울기</title>
  <desc id="desc">집합 A의 그래프와 원점을 지나는 경계 직선의 접점을 표시하고 교점이 없는 기울기 범위를 제시</desc>
  <style>
    text{font-family:"Noto Sans KR","Malgun Gothic",Arial,sans-serif;fill:#172033}.muted{fill:#56657a}.math{font-family:Georgia,"Times New Roman",serif}
  </style>
  <rect width="760" height="400" rx="18" fill="#f8fafc"/>
  <text x="30" y="38" font-size="22" font-weight="700">그래프와 원점을 지나는 직선의 관계</text>
  <text x="30" y="67" class="muted" font-size="15">경계 기울기 m₀=−3+2√2에서 왼쪽 가지에 접한다.</text>
  <rect x="30" y="84" width="460" height="270" rx="12" fill="#fff" stroke="#cbd5e1"/>
  <g stroke="#e2e8f0" stroke-width="1">
    <line x1="100" y1="100" x2="100" y2="290"/><line x1="160" y1="100" x2="160" y2="290"/><line x1="220" y1="100" x2="220" y2="290"/><line x1="280" y1="100" x2="280" y2="290"/><line x1="340" y1="100" x2="340" y2="290"/><line x1="400" y1="100" x2="400" y2="290"/><line x1="460" y1="100" x2="460" y2="290"/>
    <line x1="90" y1="140" x2="470" y2="140"/><line x1="90" y1="190" x2="470" y2="190"/><line x1="90" y1="240" x2="470" y2="240"/><line x1="90" y1="290" x2="470" y2="290"/>
  </g>
  <line x1="90" y1="190" x2="470" y2="190" stroke="#172033" stroke-width="2"/><line x1="280" y1="100" x2="280" y2="290" stroke="#172033" stroke-width="2"/>
  <path d="M100 165 L130 168 L160 173 L190 181 L220 190 L250 207 L280 240" fill="none" stroke="#2563eb" stroke-width="4"/>
  <path d="M280 240 L310 240 L340 240" fill="none" stroke="#2563eb" stroke-width="4"/>
  <path d="M340 140 L400 140 L460 140" fill="none" stroke="#2563eb" stroke-width="4"/>
  <path d="M100 164 L135 169 L160 173 L220 181 L280 190 L340 199 L400 207 L460 216" fill="none" stroke="#f97316" stroke-width="3" stroke-dasharray="8 6"/>
  <circle cx="135" cy="169" r="6" fill="#dc2626"/>
  <circle cx="280" cy="240" r="7" fill="#2563eb"/>
  <circle cx="340" cy="240" r="7" fill="#fff" stroke="#2563eb" stroke-width="3"/>
  <circle cx="340" cy="140" r="7" fill="#fff" stroke="#2563eb" stroke-width="3"/>
  <text x="111" y="153" font-size="14" font-weight="700" fill="#dc2626">접점 T</text>
  <text x="289" y="177" font-size="14" font-weight="700" fill="#f97316">y=m₀x</text>
  <text x="382" y="132" font-size="14" font-weight="700" fill="#2563eb">A의 그래프</text>
  <g text-anchor="middle" class="muted" font-size="12"><text x="100" y="308">−3</text><text x="160" y="308">−2</text><text x="220" y="308">−1</text><text x="280" y="308">0</text><text x="340" y="308">1</text><text x="400" y="308">2</text><text x="460" y="308">3</text></g>
  <text x="458" y="184" class="muted" font-size="12">x</text><text x="288" y="108" class="muted" font-size="12">y</text>
  <text x="50" y="371" class="muted" font-size="13">파란색: A의 그래프( x&lt;0, 0≤x&lt;1, x&gt;1 ) · 주황 점선: 경계 직선</text>
  <rect x="520" y="100" width="205" height="232" rx="14" fill="#fff" stroke="#cbd5e1"/>
  <text x="542" y="137" font-size="16" font-weight="700">기울기별 교점</text>
  <text x="542" y="176" class="math" font-size="20">m&lt;−1</text><text x="625" y="176" class="muted" font-size="14">교점 있음</text>
  <text x="542" y="211" class="math" font-size="20">m≥m₀</text><text x="625" y="211" class="muted" font-size="14">교점 있음</text>
  <line x1="542" y1="229" x2="700" y2="229" stroke="#cbd5e1"/>
  <text x="542" y="263" class="math" font-size="19" fill="#1d4ed8">−1≤m&lt;m₀</text>
  <text x="542" y="294" font-size="16" font-weight="700" fill="#1d4ed8">허용되는 기울기 영역</text>
</svg>
