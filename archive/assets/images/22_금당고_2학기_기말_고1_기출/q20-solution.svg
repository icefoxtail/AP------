<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" role="img" aria-labelledby="title desc" width="760" height="340"><title id="title">문항 20 해설: 네 영역 배치표</title><desc id="desc">공통 영역, 대칭차집합의 A만 B만 영역, 두 집합 바깥 영역을 나눈 표</desc><style>text{font-family:"Noto Sans KR",Arial,sans-serif;fill:#172033}.m{fill:#56657a}</style><rect width="760" height="340" rx="18" fill="#f8fafc"/><text x="28" y="38" font-size="22" font-weight="700">두 집합을 네 영역으로 나누어 합을 세기</text><text x="28" y="66" class="m" font-size="15">A∩B, A만, B만, 바깥 영역을 분리하면 합 조건이 한 식이 된다.</text><rect x="28" y="88" width="704" height="150" rx="14" fill="#fff" stroke="#cbd5e1"/><g stroke="#94a3b8" stroke-width="2"><line x1="28" y1="137" x2="732" y2="137"/><line x1="204" y1="88" x2="204" y2="238"/><line x1="380" y1="88" x2="380" y2="238"/><line x1="556" y1="88" x2="556" y2="238"/></g><g text-anchor="middle" font-size="16" font-weight="700"><text x="116" y="119">공통</text><text x="292" y="119">A만</text><text x="468" y="119">B만</text><text x="644" y="119">바깥</text></g><g text-anchor="middle" font-size="20"><text x="116" y="181" fill="#7c3aed">{c}</text><text x="292" y="181" fill="#2563eb">A−B</text><text x="468" y="181" fill="#2563eb">B−A</text><text x="644" y="181" fill="#b91c1c">4ΣS</text></g><text x="28" y="278" font-size="20" fill="#1d4ed8">c+ΣS+4ΣS=55</text><text x="28" y="310" class="m" font-size="14">A만과 B만을 합친 것이 S이므로 두 영역의 배분 수가 따로 생긴다.</text></svg>
