<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc" data-visual-case="set-2022-pilot" data-fact-hash="9c491e610022f63113f0617851ad3e1f2562b73e48004a1a00aca379702bae21" data-visual-provenance="2026-09-05-set-visual-pilot"><title id="title">문항 20 해설: S의 크기별 후보와 배분 경우</title><desc id="desc">c+5ΣS=55에서 |S|=2의 8개 후보와 |S|=3의 5개 후보 및 각 배분 경우를 나눈 표</desc>
    <style>
      .text { font-family:"Noto Sans KR","Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif; fill:#172033; }
      .math { font-family:"STIX Two Math","Cambria Math","Times New Roman",serif; fill:#172033; }
      .muted { font-family:"Noto Sans KR","Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif; fill:#56657a; }
      .small { font-family:"Noto Sans KR","Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif; fill:#334155; }
      .strong { font-family:"Noto Sans KR","Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif; fill:#172033; font-weight:700; }
      .math-strong { font-family:"STIX Two Math","Cambria Math","Times New Roman",serif; fill:#172033; font-weight:700; }
    </style>
    <rect width="760" height="430" fill="#f8fafc"/><text x="28" y="38" font-size="22" text-anchor="start" class="text" font-weight="700">c+5ΣS=55를 만족하는 S의 크기를 나누어 센다</text><text x="28" y="67" font-size="15" text-anchor="start" class="muted">c는 공통 원소, S=(A−B)∪(B−A)인 대칭차집합</text><rect x="30" y="94" width="342" height="262" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/><text x="46" y="121" font-size="15" text-anchor="start" class="text" fill="#2563eb" font-weight="700">|S|=2</text><text x="48" y="151" font-size="16" text-anchor="start" class="text" fill="#1d4ed8" font-weight="700">후보 8개</text><text x="48" y="169" font-size="14" text-anchor="start" class="math">(5,{1,9})</text><text x="48" y="200" font-size="14" text-anchor="start" class="math">(5,{2,8})</text><text x="48" y="231" font-size="14" text-anchor="start" class="math">(5,{3,7})</text><text x="48" y="262" font-size="14" text-anchor="start" class="math">(5,{4,6})</text><text x="203" y="169" font-size="14" text-anchor="start" class="math">(10,{1,8})</text><text x="203" y="200" font-size="14" text-anchor="start" class="math">(10,{2,7})</text><text x="203" y="231" font-size="14" text-anchor="start" class="math">(10,{3,6})</text><text x="203" y="262" font-size="14" text-anchor="start" class="math">(10,{4,5})</text><line x1="48" y1="292" x2="354" y2="292" stroke="#e2e8f0" stroke-width="1.4" stroke-linecap="round"/><text x="48" y="322" font-size="18" text-anchor="start" class="text" fill="#166534" font-weight="700">8×2²=8×4=32</text><rect x="388" y="94" width="342" height="262" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/><text x="404" y="121" font-size="15" text-anchor="start" class="text" fill="#7c3aed" font-weight="700">|S|=3</text><text x="406" y="151" font-size="16" text-anchor="start" class="text" fill="#6d28d9" font-weight="700">후보 5개</text><text x="406" y="169" font-size="14" text-anchor="start" class="math">(5,{1,2,7})</text><text x="406" y="196" font-size="14" text-anchor="start" class="math">(5,{1,3,6})</text><text x="406" y="223" font-size="14" text-anchor="start" class="math">(10,{1,2,6})</text><text x="406" y="250" font-size="14" text-anchor="start" class="math">(10,{1,3,5})</text><text x="406" y="277" font-size="14" text-anchor="start" class="math">(10,{2,3,4})</text><line x1="406" y1="292" x2="712" y2="292" stroke="#e2e8f0" stroke-width="1.4" stroke-linecap="round"/><text x="406" y="322" font-size="18" text-anchor="start" class="text" fill="#166534" font-weight="700">5×2³=5×8=40</text><rect x="30" y="376" width="230" height="30" rx="15" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/><text x="145" y="396" font-size="14" text-anchor="middle" class="text" fill="#1d4ed8" font-weight="700">|S|=2: 32</text><rect x="274" y="376" width="230" height="30" rx="15" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.2"/><text x="389" y="396" font-size="14" text-anchor="middle" class="text" fill="#6d28d9" font-weight="700">|S|=3: 40</text><text x="530" y="399" font-size="22" text-anchor="start" class="text" fill="#166534" font-weight="700">32+40=72</text></svg>