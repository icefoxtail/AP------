<svg xmlns="http://www.w3.org/2000/svg" width="420" height="328" viewBox="0 0 420 328" role="img"><title>명제의 반례 영역과 경계</title><desc>x&lt;2, y&lt;1 영역에서 4x+y 값은 9보다 작으며, (2,1)은 포함되지 않는 경계점이다.</desc><rect width="420" height="328" fill="#FFFFFF"/><rect x="60" y="24" width="315" height="255" fill="none" stroke="#CBD5E1" stroke-width="1"/><line x1="60.00" y1="247.13" x2="375.00" y2="247.13" stroke="#6B7280" stroke-width="1.2" /><line x1="78.81" y1="279.00" x2="78.81" y2="24.00" stroke="#6B7280" stroke-width="1.2" /><rect x="60" y="140.87" width="206.87" height="138.13" fill="#DBEAFE" opacity=".52"/><line x1="266.87" y1="24.00" x2="266.87" y2="279.00" stroke="#64748B" stroke-width="1.25" stroke-dasharray="5 4"/><line x1="60.00" y1="140.87" x2="375.00" y2="140.87" stroke="#64748B" stroke-width="1.25" stroke-dasharray="5 4"/><line x1="243.36" y1="34.63" x2="297.43" y2="279.00" stroke="#1D4ED8" stroke-width="2.5" /><circle cx="266.87" cy="140.87" r="4.7" fill="#FFFFFF" stroke="#1D4ED8" stroke-width="1.5"/><text x="274.9" y="128.9" fill="#172334" font-size="12" font-family="Arial, sans-serif" text-anchor="start">(2, 1) 경계</text><text x="88.0" y="225.0" fill="#172334" font-size="15" font-family="Arial, sans-serif" text-anchor="start">x&lt;2, y&lt;1</text><text x="80.0" y="307.0" fill="#172334" font-size="14" font-family="Arial, sans-serif" text-anchor="start">이 영역에서는 4x+y &lt; 9</text><text x="272.0" y="44.0" fill="#172334" font-size="13" font-family="Arial, sans-serif" text-anchor="start">4x+y=9</text></svg>
