<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 580" width="640" height="580" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">한 직선 위에 세 점 A, B, C가 순서대로 있고, 그 위쪽의 점 D와 직선 CD를 D 너머로 늘인 점 E를 이어 만든 그림. 선분 AD, DB, BC에 같은 길이 표시가 있고, 각 ADE에 84, 각 ACD에 x가 적혀 있다.</title><desc id="visual-desc">한 직선 위에 A, B, C가 왼쪽부터 순서대로 놓여 있고, A와 B 사이 위쪽에 점 D가 있다. D에서 A, B, C로 선분이 이어지며, C에서 D를 지나 왼쪽 위로 뻗은 직선 끝에 E가 있다. 선분 AD, DB, BC에는 같은 길이 표시가 있고, D의 각 ADE에는 84, C의 각 ACD에는 x가 적혀 있다.</desc><rect width="640" height="580" fill="#fff"/><g data-layer="12"><polygon id="aD-sector" data-role="angleSector" stroke="none" stroke-width="1.6" fill="#d9d9d9" data-owner-points="A D E" data-mark="angle" data-mark-id="aD" data-mark-index="0" data-mark-count="1" data-mark-side="INNER" points="223.202184899,238.531688747 207.544783602,261.744740778 205.96366359,260.595989847 204.466527921,259.33974386 203.060670489,257.982123119 201.752940492,256.529741818 200.549709056,254.989675811 199.456838206,253.369428145 198.479652299,251.676892505 197.622912085,249.920314753 196.890791517,248.10825276 196.286857413,246.249534709 195.814052078,244.353216089 195.474678974,242.428535573 195.270391492,240.484870011 195.202184899,238.531688747 195.270391492,236.578507482 195.474678974,234.63484192 195.814052078,232.710161404 196.286857413,230.813842784 196.890791517,228.955124733 197.622