<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 480" width="560" height="480" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">직선 l을 회전축으로 하는 사다리꼴을 나타낸 그림이다. 윗변은 4cm, 아랫변은 8cm, 옆면의 빗변은 6cm로 표시되어 있다.</title><desc id="visual-desc">세로 직선 l이 지나고, 그 왼쪽에 윗변 4cm, 아랫변 8cm, 빗변 6cm인 사다리꼴이 있다. 윗변과 아랫변이 직선 l과 만나는 곳에 직각 표시가 있다.</desc><rect width="560" height="480" fill="#fff"/><g data-layer="30"><line id="sAT" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="280" y1="141.968105928" x2="455.364783286" y2="141.968105928"/></g><g data-layer="30"><line id="sSC" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="455.364783286" y1="338.031894072" x2="104.635216714" y2="338.031894072"/></g><g data-layer="30"><line id="sCA" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="104.635216714" y1="338.031894072" x2="280" y2="141.968105928"/></g><g data-layer="30"><line id="sL" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="455.364783286" y1="425.714285714" x2="455.364783286" y2="54.285714286"/></g><g data-layer="60"><polyline id="rT" data-role="indicator" stroke="#111" stroke-width="0.8" fill="none" points="445.364783286,141.968105928 445.364783286,151.968105928 455.364783286,151.968105928"/></g><g data-layer="60"><polyline id="rS" data-role="indicator" stroke="#111" stroke-width="0.8" fill