<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 440" width="440" height="440" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">원탁에서는 회전하여 같은 배치를 한 가지로 본다. 한 학생의 자리를 고정하면 나머지 다섯 학생이 남은 다섯 자리에 앉는 방법은 5!=120가지이다. 6!을 6으로 나눈 값과 같다. 따라서 답은 ②이다.</title><desc id="visual-desc">원 위에 여섯 개의 점이 같은 간격으로 놓여 있고, 이웃한 두 점 사이의 짧은 호가 파란색으로 강조되어 있다.</desc><rect width="440" height="440" fill="#fff"/><g data-layer="40"><circle id="k" data-role="circle" stroke="#111" stroke-width="2.05" fill="none" cx="179.140058471" cy="220" r="121.209023988"/></g><g data-layer="46"><polyline id="fix" data-role="circularArc" stroke="#1f5fa8" stroke-width="3.2" fill="none" data-owner-points="S1 S2" data-center-point="O" data-owner-radius="6.0" data-sweep="CW" data-mark="arc" data-mark-id="fix" points="179.140058471,98.790976012 183.105906565,98.855872841 187.067507931,99.050493836 191.020620384,99.374630592 194.961010835,99.827936015 198.884459813,100.409924694 202.786765992,101.11997342 206.663750684,101.957321857 210.511262317,102.921073351 214.32518088,104.010195891 218.101422331,105.223523219 221.835942979,106.559756073 225.524743804,108.017463582 229.163874746,109.595084795 232.749438933,111.290930357 236.277596853,113.103184314 239.744570465,115.029906058 243.146647248,117.069032409 246.480184172,119.218379817 249.741611603,121.475646709 252.927437123,123.8384159