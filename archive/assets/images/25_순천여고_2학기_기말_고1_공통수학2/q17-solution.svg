<title id="q17-title">무리함수와 직선의 교점 개수 경계</title><desc id="q17-desc">k=-3일 때 두 교점 A(3,0), B(4,1)이 존재한다. k=-11/4에서는 T(13/4,1/2) 한 점에서 접한다. 따라서 두 교점이 있는 범위는 -3 이상 -11/4 미만이다.</desc>
