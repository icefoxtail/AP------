<title id="inv-title">역함수와 직선의 유일한 교점</title>
<desc id="inv-desc">원래 함수 f(x)=(x−2)²+1, x≥2의 역함수는 y=2+√(x−1), x≥1이다. 역함수는 A(1,2)에서 시작하고 직선 y=x−2와 P((9+√13)/2,(5+√13)/2)에서 만난다. 제곱 전 x≥4 조건을 만족하는 교점은 P뿐이다.</desc>
