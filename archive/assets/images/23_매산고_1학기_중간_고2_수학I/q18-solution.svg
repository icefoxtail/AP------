<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc"><title id="title">Triangle midpoint and logarithm point</title><desc id="desc">B is (1,0), A is (1,4), C is (1 plus 2 root 3,6), M is their midpoint (1 plus root 3,3). AM is perpendicular to BC. AB and AC are both 4; AM is 2.</desc><rect width="720" height="420" fill="#fff"/><g stroke="#e0e5ec" stroke-width="1"><path d="M100 370H670M100 315H670M100 260H670M100 205H670M100 150H670M100 95H670M100 40H670M155 20V390M210 20V390M265 20V390M320 20V390M375 20V390M430 20V390M485 20V390M540 20V390M595 20V390M650 20V390"/></g><g stroke="#263548" stroke-width="2"><path d="M85 370H675M100 390V20"/><path d="M665 365l10 5-10 5M95 30l5-10 5 10"/></g><g fill="#253142" font-family="Arial,sans-serif" font-size="15"><text x="681" y="375">x</text><text x="106" y="32">y</text><text x="88" y="390">0</text><text x="149" y="390">1</text><text x="135" y="154">4</text><text x="135" y="44">6</text></g><g fill="none" stroke="#2457d6" stroke-width="4"><path d="M155 150L155 370L345.526 40Z"/><path d="M155 150L250.263 205" stroke="#e04b3f" stroke-width="3"/></g><path d="M250.263 205L239.871 199L233.871 209.392L244.263 215.392Z" fill="none" stroke="#111" stroke-width="2"/><g fill="#111"><circle cx="155" cy="150" r="5"/><circle cx="155" cy="370" r="5"/><circle cx="345.526" cy="40" r="5"/><circle cx="250.263" cy="205" r="5"/></g><g fill="#111" font-family="Arial,sans-serif" font-size="18" font-weight="600"><text x="132" y="140">A</text><text x="132" y="395">B</text><text x="356" y="42">C</text><text x="256" y="224">M</text></g><g fill="#9b2c25" font-family="Arial,sans-serif" font-size="16"><text x="180" y="95">AB = AC = 4</text><text x="262" y="251">AM = 2</text><text x="365" y="70">C ∈ y = logₐ x</text></g></svg>