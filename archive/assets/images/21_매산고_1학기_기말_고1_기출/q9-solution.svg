<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" width="720" height="440" role="img" aria-labelledby="title desc"><title id="title">절댓값 부등식의 해</title><desc id="desc">연속 해집합은 [5/3,3]이고 이 구간의 정수는 2와 3이다.</desc><rect width="720" height="440" fill="#fff"/><style>text{font-family:Noto Sans KR, Pretendard, sans-serif;fill:#172033}.title{font-size:20px;font-weight:700}.label{font-size:15px}.small{font-size:12px;fill:#475569}.axis{stroke:#64748b;stroke-width:1.4}.main{stroke:#2563eb;stroke-width:3;fill:none}.aux{stroke:#64748b;stroke-width:1.8;fill:none;stroke-dasharray:7 5}.point{fill:#b91c1c;stroke:#fff;stroke-width:1.5}.fillA{fill:#fb7185;fill-opacity:.22;stroke:#be123c;stroke-width:2.5}.fillB{fill:#34d399;fill-opacity:.20;stroke:#047857;stroke-width:2.5}.overlap{fill:#60a5fa;fill-opacity:.58;stroke:#1d4ed8;stroke-width:2}</style><text x="28" y="36" class="title">절댓값 부등식의 해</text><line x1="90" y1="220" x2="630" y2="220" class="axis"/><line x1="230" y1="190" x2="230" y2="250" class="main"/><line x1="540" y1="190" x2="540" y2="250" class="main"/><circle cx="230" cy="220" r="8" fill="#2563eb"/><circle cx="540" cy="220" r="8" fill="#2563eb"/><line x1="230" y1="220" x2="540" y2="220" stroke="#2563eb" stroke-width="8" stroke-linecap="round"/><text x="210" y="280" class="label">5/3</text><text x="532" y="280" class="label">3</text><text x="300" y="170" class="small">정수 해: 2, 3</text></svg>