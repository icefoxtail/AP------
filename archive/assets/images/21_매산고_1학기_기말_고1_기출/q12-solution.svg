<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" width="720" height="440" role="img" aria-labelledby="title desc"><title id="title">이차부등식 해의 교집합</title><desc id="desc">두 해집합의 교집합이 (−3,0]이 되도록 첫째 이차식의 양의 근을 t=2로 정한다.</desc><rect width="720" height="440" fill="#fff"/><style>text{font-family:Noto Sans KR, Pretendard, sans-serif;fill:#172033}.title{font-size:20px;font-weight:700}.label{font-size:15px}.small{font-size:12px;fill:#475569}.axis{stroke:#64748b;stroke-width:1.4}.main{stroke:#2563eb;stroke-width:3;fill:none}.aux{stroke:#64748b;stroke-width:1.8;fill:none;stroke-dasharray:7 5}.point{fill:#b91c1c;stroke:#fff;stroke-width:1.5}.fillA{fill:#fb7185;fill-opacity:.22;stroke:#be123c;stroke-width:2.5}.fillB{fill:#34d399;fill-opacity:.20;stroke:#047857;stroke-width:2.5}.overlap{fill:#60a5fa;fill-opacity:.58;stroke:#1d4ed8;stroke-width:2}</style><text x="28" y="36" class="title">이차부등식 해의 교집합</text><text x="80" y="105" class="label">첫째 부등식: (−3,2)</text><line x1="110" y1="155" x2="620" y2="155" class="axis"/><circle cx="205" cy="155" r="8" fill="#fff" stroke="#2563eb" stroke-width="3"/><circle cx="460" cy="155" r="8" fill="#fff" stroke="#2563eb" stroke-width="3"/><line x1="205" y1="155" x2="460" y2="155" stroke="#2563eb" stroke-width="8"/><text x="195" y="190" class="small">−3</text><text x="452" y="190" class="small">t=2</text><text x="80" y="250" class="label">둘째 부등식: (−∞,0] ∪ [5,∞)</text><line x1="110" y1="300" x2="620" y2="300" class="axis"/><line x1="110" y1="300" x2="332" y2="300" stroke="#047857" stroke-width="8"/><line x1="525" y1="300" x2="620" y2="300" stroke="#047857" stroke-width="8"/><circle cx="332" cy="300" r="8" fill="#047857"/><circle cx="525" cy="300" r="8" fill="#047857"/><text x="325" y="335" class="small">0</text><text x="517" y="335" class="small">5</text><text x="240" y="390" class="label">교집합: (−3,0]</text></svg>