<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" width="720" height="440" role="img" aria-labelledby="title desc"><title id="title">평행이동한 직선과 수선의 발</title><desc id="desc">점과 직선을 함께 평행이동한 뒤 P′에서 이동한 직선으로 내린 수선의 발을 표시한다.</desc><rect width="720" height="440" fill="#fff"/><style>text{font-family:Noto Sans KR, Pretendard, sans-serif;fill:#172033}.title{font-size:20px;font-weight:700}.label{font-size:15px}.small{font-size:12px;fill:#475569}.axis{stroke:#64748b;stroke-width:1.4}.main{stroke:#2563eb;stroke-width:3;fill:none}.aux{stroke:#64748b;stroke-width:1.8;fill:none;stroke-dasharray:7 5}.point{fill:#b91c1c;stroke:#fff;stroke-width:1.5}.fillA{fill:#fb7185;fill-opacity:.22;stroke:#be123c;stroke-width:2.5}.fillB{fill:#34d399;fill-opacity:.20;stroke:#047857;stroke-width:2.5}.overlap{fill:#60a5fa;fill-opacity:.58;stroke:#1d4ed8;stroke-width:2}</style><text x="28" y="36" class="title">평행이동한 직선과 수선의 발</text><rect x="30" y="65" width="320" height="330" rx="12" fill="#f8fafc" stroke="#cbd5e1"/><rect x="370" y="65" width="320" height="330" rx="12" fill="#f8fafc" stroke="#cbd5e1"/><text x="50" y="95" class="label">원래</text><text x="390" y="95" class="label">평행이동 후</text><line x1="80" y1="160" x2="320" y2="280" class="main"/><circle cx="140" cy="70" r="7" class="point"/><text x="90" y="60" class="small">P(1,3)</text><text x="180" y="230" class="small">x+2y−3=0</text><line x1="430" y1="205" x2="640" y2="310" class="main"/><line x1="520" y1="130" x2="472" y2="226" class="aux"/><circle cx="520" cy="130" r="7" class="point"/><circle cx="472" cy="226" r="7" fill="#047857"/><text x="430" y="185" class="small">P′(2,2)</text><text x="475" y="250" class="small">H(6/5,2/5)</text><text x="430" y="120" class="small">x+2y−2=0</text></svg>