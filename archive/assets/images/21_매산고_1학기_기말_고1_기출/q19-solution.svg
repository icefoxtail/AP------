<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" width="720" height="440" role="img" aria-labelledby="title desc"><title id="title">네 직선에 둘러싸인 도형의 내접원</title><desc id="desc">네 대칭 직선은 대각선 길이 10인 마름모를 만들고, 중심에서 변까지 거리는 5/√2이다.</desc><rect width="720" height="440" fill="#fff"/><style>text{font-family:Noto Sans KR, Pretendard, sans-serif;fill:#172033}.title{font-size:20px;font-weight:700}.label{font-size:15px}.small{font-size:12px;fill:#475569}.axis{stroke:#64748b;stroke-width:1.4}.main{stroke:#2563eb;stroke-width:3;fill:none}.aux{stroke:#64748b;stroke-width:1.8;fill:none;stroke-dasharray:7 5}.point{fill:#b91c1c;stroke:#fff;stroke-width:1.5}.fillA{fill:#fb7185;fill-opacity:.22;stroke:#be123c;stroke-width:2.5}.fillB{fill:#34d399;fill-opacity:.20;stroke:#047857;stroke-width:2.5}.overlap{fill:#60a5fa;fill-opacity:.58;stroke:#1d4ed8;stroke-width:2}</style><text x="28" y="36" class="title">네 직선에 둘러싸인 도형의 내접원</text><polygon points="360,70 525,235 360,400 195,235" fill="#dbeafe" fill-opacity=".42" stroke="#2563eb" stroke-width="3"/><circle cx="360" cy="235" r="116.7" fill="#34d399" fill-opacity=".14" stroke="#047857" stroke-width="3"/><line x1="70" y1="235" x2="650" y2="235" class="axis"/><line x1="360" y1="60" x2="360" y2="410" class="axis"/><line x1="360" y1="70" x2="525" y2="235" class="main"/><line x1="360" y1="400" x2="525" y2="235" class="main"/><circle cx="360" cy="235" r="6" class="point"/><text x="370" y="225" class="label">O</text><text x="425" y="125" class="small">AC: y=−x+5</text><text x="80" y="420" class="label">r=5√2/2, 넓이=25π/2</text></svg>