<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" width="720" height="440" role="img" aria-labelledby="title desc"><title id="title">합성 대칭이동과 방정식</title><desc id="desc">평행이동 후 두 번의 대칭이동으로 점 좌표가 바뀌는 순서를 보여 준다.</desc><rect width="720" height="440" fill="#fff"/><style>text{font-family:Noto Sans KR, Pretendard, sans-serif;fill:#172033}.title{font-size:20px;font-weight:700}.label{font-size:15px}.small{font-size:12px;fill:#475569}.axis{stroke:#64748b;stroke-width:1.4}.main{stroke:#2563eb;stroke-width:3;fill:none}.aux{stroke:#64748b;stroke-width:1.8;fill:none;stroke-dasharray:7 5}.point{fill:#b91c1c;stroke:#fff;stroke-width:1.5}.fillA{fill:#fb7185;fill-opacity:.22;stroke:#be123c;stroke-width:2.5}.fillB{fill:#34d399;fill-opacity:.20;stroke:#047857;stroke-width:2.5}.overlap{fill:#60a5fa;fill-opacity:.58;stroke:#1d4ed8;stroke-width:2}</style><text x="28" y="36" class="title">합성 대칭이동과 방정식</text><rect x="35" y="80" width="195" height="245" rx="14" fill="#eff6ff" stroke="#93c5fd"/><rect x="263" y="80" width="195" height="245" rx="14" fill="#f0fdf4" stroke="#86efac"/><rect x="490" y="80" width="195" height="245" rx="14" fill="#fff7ed" stroke="#fdba74"/><text x="58" y="115" class="label">원래 점</text><text x="295" y="115" class="label">평행이동</text><text x="522" y="115" class="label">두 번 대칭</text><circle cx="130" cy="220" r="8" class="point"/><text x="92" y="260" class="small">(1,2)</text><circle cx="360" cy="220" r="8" fill="#047857"/><text x="315" y="260" class="small">(6,−1)</text><circle cx="585" cy="220" r="8" fill="#047857"/><text x="540" y="260" class="small">(1,6)</text><text x="270" y="365" class="small">(X,Y) → (3−Y, X+5) → 역변환 (y−5, 3−x)</text></svg>