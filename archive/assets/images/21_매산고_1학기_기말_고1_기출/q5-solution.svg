<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" width="720" height="440" role="img" aria-labelledby="title desc"><title id="title">원에 접하는 직선</title><desc id="desc">기울기 2인 접선은 원의 반지름과 접점에서 수직이다.</desc><rect width="720" height="440" fill="#fff"/><style>text{font-family:Noto Sans KR, Pretendard, sans-serif;fill:#172033}.title{font-size:20px;font-weight:700}.label{font-size:15px}.small{font-size:12px;fill:#475569}.axis{stroke:#64748b;stroke-width:1.4}.main{stroke:#2563eb;stroke-width:3;fill:none}.aux{stroke:#64748b;stroke-width:1.8;fill:none;stroke-dasharray:7 5}.point{fill:#b91c1c;stroke:#fff;stroke-width:1.5}.fillA{fill:#fb7185;fill-opacity:.22;stroke:#be123c;stroke-width:2.5}.fillB{fill:#34d399;fill-opacity:.20;stroke:#047857;stroke-width:2.5}.overlap{fill:#60a5fa;fill-opacity:.58;stroke:#1d4ed8;stroke-width:2}</style><text x="28" y="36" class="title">원에 접하는 직선</text><circle cx="360" cy="240" r="100" fill="#dbeafe" fill-opacity=".3" stroke="#2563eb" stroke-width="3"/><line x1="396" y1="392" x2="503" y2="178" class="main"/><line x1="360" y1="240" x2="449" y2="285" class="aux"/><circle cx="360" cy="240" r="6" class="point"/><circle cx="449" cy="285" r="7" fill="#047857"/><text x="343" y="265" class="label">O</text><text x="455" y="308" class="label">T</text><text x="505" y="190" class="label">y=2x−2√5</text><text x="365" y="120" class="small">r=2, 반지름과 접선은 수직</text></svg>