<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" role="img" aria-labelledby="title desc"><title id="title">지름 AB인 원과 수직 교점 P</title><desc id="desc">A(2,0), B(0,6), P(4,2)가 원 위에 있고 각 APB는 직각이다. 원의 중심은 (1,3)이다.</desc><rect width="720" height="460" fill="#fff"/><g stroke="#cbd5e1" stroke-width="1"><path d="M90 385H650M355 430V40"/></g><g fill="#475569" font-family="Arial,sans-serif" font-size="16"><text x="655" y="390">x</text><text x="360" y="35">y</text></g><circle cx="400" cy="250" r="142.3025" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/><path d="M445 385L355 115L535 295Z" fill="#fef3c7" fill-opacity=".65" stroke="#334155" stroke-width="3"/><path d="M523.686 306.314L512.373 295L523.686 283.686" fill="none" stroke="#dc2626" stroke-width="2.5"/><g fill="#0f172a" font-family="Arial,sans-serif" font-size="17"><circle cx="445" cy="385" r="5"/><text x="455" y="392">A(2,0)</text><circle cx="355" cy="115" r="5"/><text x="305" y="100">B(0,6)</text><circle cx="535" cy="295" r="5"/><text x="545" y="292">P(4,2)</text><circle cx="400" cy="250" r="5" fill="#dc2626"/><text x="410" y="240">C(1,3)</text></g><text x="160" y="438" fill="#334155" font-family="Arial,sans-serif" font-size="16">AB는 원 C의 지름이고 ∠APB=90°</text></svg>