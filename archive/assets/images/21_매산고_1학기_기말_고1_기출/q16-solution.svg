<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" width="720" height="440" role="img" aria-labelledby="title desc"><title id="title">원과 직선이 만나지 않는 조건</title><desc id="desc">경계값에서는 접하고, 그보다 바깥으로 이동하면 원과 만나지 않는다.</desc><rect width="720" height="440" fill="#fff"/><style>text{font-family:Noto Sans KR, Pretendard, sans-serif;fill:#172033}.title{font-size:20px;font-weight:700}.label{font-size:15px}.small{font-size:12px;fill:#475569}.axis{stroke:#64748b;stroke-width:1.4}.main{stroke:#2563eb;stroke-width:3;fill:none}.aux{stroke:#64748b;stroke-width:1.8;fill:none;stroke-dasharray:7 5}.point{fill:#b91c1c;stroke:#fff;stroke-width:1.5}.fillA{fill:#fb7185;fill-opacity:.22;stroke:#be123c;stroke-width:2.5}.fillB{fill:#34d399;fill-opacity:.20;stroke:#047857;stroke-width:2.5}.overlap{fill:#60a5fa;fill-opacity:.58;stroke:#1d4ed8;stroke-width:2}</style><text x="28" y="36" class="title">원과 직선이 만나지 않는 조건</text><circle cx="330" cy="245" r="90" fill="#dbeafe" fill-opacity=".28" stroke="#2563eb" stroke-width="3"/><line x1="70" y1="245" x2="650" y2="245" class="axis"/><line x1="330" y1="70" x2="330" y2="390" class="axis"/><line x1="195.5" y1="312.8" x2="303.5" y2="96.8" class="aux"/><line x1="356.5" y1="393.2" x2="464.5" y2="177.2" class="aux"/><circle cx="249.5" cy="204.8" r="6" fill="#047857"/><text x="500" y="130" class="small">y=2x+√10 (접선 경계)</text><text x="500" y="365" class="small">y=2x−√10 (접선 경계)</text><text x="90" y="410" class="label">비교: |k|/√5 와 √2</text></svg>