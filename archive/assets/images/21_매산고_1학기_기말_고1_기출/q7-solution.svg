<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" width="720" height="440" role="img" aria-labelledby="title desc"><title id="title">두 원 사이의 최소 거리</title><desc id="desc">중심 거리는 5이고 반지름의 합은 3이므로 두 원 사이 최소 간격은 2이다.</desc><rect width="720" height="440" fill="#fff"/><style>text{font-family:Noto Sans KR, Pretendard, sans-serif;fill:#172033}.title{font-size:20px;font-weight:700}.label{font-size:15px}.small{font-size:12px;fill:#475569}.axis{stroke:#64748b;stroke-width:1.4}.main{stroke:#2563eb;stroke-width:3;fill:none}.aux{stroke:#64748b;stroke-width:1.8;fill:none;stroke-dasharray:7 5}.point{fill:#b91c1c;stroke:#fff;stroke-width:1.5}.fillA{fill:#fb7185;fill-opacity:.22;stroke:#be123c;stroke-width:2.5}.fillB{fill:#34d399;fill-opacity:.20;stroke:#047857;stroke-width:2.5}.overlap{fill:#60a5fa;fill-opacity:.58;stroke:#1d4ed8;stroke-width:2}</style><text x="28" y="36" class="title">두 원 사이의 최소 거리</text><line x1="80" y1="280" x2="620" y2="280" class="axis"/><line x1="350" y1="60" x2="350" y2="390" class="axis"/><circle cx="430" cy="280" r="50" fill="#bfdbfe" fill-opacity=".3" stroke="#2563eb" stroke-width="3"/><circle cx="230" cy="130" r="100" fill="#bbf7d0" fill-opacity=".24" stroke="#047857" stroke-width="3"/><line x1="430" y1="280" x2="230" y2="130" class="aux"/><circle cx="430" cy="280" r="6" class="point"/><circle cx="230" cy="130" r="6" class="point"/><text x="438" y="300" class="label">C (r=1)</text><text x="135" y="115" class="label">C′ (r=2)</text><text x="310" y="185" class="small">중심 거리 5, 최소 간격 2</text></svg>