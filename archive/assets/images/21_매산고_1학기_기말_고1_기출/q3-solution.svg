<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" width="720" height="440" role="img" aria-labelledby="title desc"><title id="title">평행한 직선</title><desc id="desc">기울기 4인 두 직선과 점 (−1,1)을 나타낸다.</desc><rect width="720" height="440" fill="#fff"/><style>text{font-family:Noto Sans KR, Pretendard, sans-serif;fill:#172033}.title{font-size:20px;font-weight:700}.label{font-size:15px}.small{font-size:12px;fill:#475569}.axis{stroke:#64748b;stroke-width:1.4}.main{stroke:#2563eb;stroke-width:3;fill:none}.aux{stroke:#64748b;stroke-width:1.8;fill:none;stroke-dasharray:7 5}.point{fill:#b91c1c;stroke:#fff;stroke-width:1.5}.fillA{fill:#fb7185;fill-opacity:.22;stroke:#be123c;stroke-width:2.5}.fillB{fill:#34d399;fill-opacity:.20;stroke:#047857;stroke-width:2.5}.overlap{fill:#60a5fa;fill-opacity:.58;stroke:#1d4ed8;stroke-width:2}</style><text x="28" y="36" class="title">평행한 직선</text><line x1="100" y1="330" x2="630" y2="330" class="axis"/><line x1="300" y1="65" x2="300" y2="390" class="axis"/><line x1="240" y1="290" x2="300" y2="50" class="aux"/><line x1="240" y1="350" x2="300" y2="110" class="main"/><circle cx="270" cy="230" r="7" class="point"/><text x="215" y="225" class="label">(−1,1)</text><text x="305" y="55" class="small">y=4x+7</text><text x="305" y="115" class="label">y=4x+5</text></svg>