<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" width="720" height="440" role="img" aria-labelledby="title desc"><title id="title">선분의 내분점</title><desc id="desc">A, P, B가 한 선분 위에 있고 AP:PB=3:2이다.</desc><rect width="720" height="440" fill="#fff"/><style>text{font-family:Noto Sans KR, Pretendard, sans-serif;fill:#172033}.title{font-size:20px;font-weight:700}.label{font-size:15px}.small{font-size:12px;fill:#475569}.axis{stroke:#64748b;stroke-width:1.4}.main{stroke:#2563eb;stroke-width:3;fill:none}.aux{stroke:#64748b;stroke-width:1.8;fill:none;stroke-dasharray:7 5}.point{fill:#b91c1c;stroke:#fff;stroke-width:1.5}.fillA{fill:#fb7185;fill-opacity:.22;stroke:#be123c;stroke-width:2.5}.fillB{fill:#34d399;fill-opacity:.20;stroke:#047857;stroke-width:2.5}.overlap{fill:#60a5fa;fill-opacity:.58;stroke:#1d4ed8;stroke-width:2}</style><text x="28" y="36" class="title">선분의 내분점</text><line x1="110" y1="310" x2="620" y2="130" class="axis"/><line x1="190" y1="340" x2="545" y2="90" class="main"/><circle cx="190" cy="340" r="8" class="point"/><circle cx="403" cy="190" r="8" fill="#047857"/><circle cx="545" cy="90" r="8" class="point"/><text x="155" y="370" class="label">A(1,2)</text><text x="370" y="170" class="label">P(4,5)</text><text x="550" y="82" class="label">B(6,7)</text><text x="260" y="245" class="small">AP:PB=3:2</text></svg>