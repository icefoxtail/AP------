<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" width="720" height="440" role="img" aria-labelledby="title desc"><title id="title">좌표와 원의 접점</title><desc id="desc">중심 P=(1,0), 반지름 1인 원이 y축에 접한다.</desc><rect width="720" height="440" fill="#fff"/><style>text{font-family:Noto Sans KR, Pretendard, sans-serif;fill:#172033}.title{font-size:20px;font-weight:700}.label{font-size:15px}.small{font-size:12px;fill:#475569}.axis{stroke:#64748b;stroke-width:1.4}.main{stroke:#2563eb;stroke-width:3;fill:none}.aux{stroke:#64748b;stroke-width:1.8;fill:none;stroke-dasharray:7 5}.point{fill:#b91c1c;stroke:#fff;stroke-width:1.5}.fillA{fill:#fb7185;fill-opacity:.22;stroke:#be123c;stroke-width:2.5}.fillB{fill:#34d399;fill-opacity:.20;stroke:#047857;stroke-width:2.5}.overlap{fill:#60a5fa;fill-opacity:.58;stroke:#1d4ed8;stroke-width:2}</style><text x="28" y="36" class="title">좌표와 원의 접점</text><line x1="220" y1="80" x2="220" y2="370" class="axis"/><line x1="80" y1="280" x2="640" y2="280" class="axis"/><circle cx="360" cy="280" r="140" fill="#dbeafe" fill-opacity=".28" stroke="#2563eb" stroke-width="3"/><line x1="360" y1="280" x2="220" y2="280" class="aux"/><circle cx="360" cy="280" r="7" class="point"/><circle cx="220" cy="280" r="7" fill="#047857"/><text x="365" y="300" class="label">P(1,0)</text><text x="185" y="305" class="small">y축 접점</text><text x="400" y="130" class="label">(x−1)²+y²=1</text></svg>