<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 748 641" width="748" height="641" role="img" aria-labelledby="title desc"><title id="title">직사각형과 연장선의 교점 E</title><desc id="desc">F는 오른쪽 변 DC 위에 있다. A와 F를 이은 선을 아래로 늘이면 BC의 연장선과 E에서 만난다. 물은 삼각형 DFE만 옅은 청록으로 칠했다.</desc><rect width="748" height="641" fill="white" /><polygon points="431.4000,190.5000 431.4000,347.7000 641.0000,452.5000" fill="none" /><line x1="117.0000" y1="190.5000" x2="117.0000" y2="452.5000" stroke="#202020" stroke-width="5.15" stroke-linecap="round" /><line x1="117.0000" y1="452.5000" x2="431.4000" y2="452.5000" stroke="#202020" stroke-width="5.15" stroke-linecap="round" /><line x1="431.4000" y1="452.5000" x2="431.4000" y2="190.5000" stroke="#202020" stroke-width="5.15" stroke-linecap="round" /><line x1="431.4000" y1="190.5000" x2="117.0000" y2="190.5000" stroke="#202020" stroke-width="5.15" stroke-linecap="round" /><line x1="117.0000" y1="190.5000" x2="431.4000" y2="347.7000" stroke="#774698" stroke-width="5.15" stroke-linecap="round" /><line x1="431.4000" y1="347.7000" x2="641.0000" y2="452.5000" stroke="#774698" stroke-width="4.9" stroke-linecap="round" stroke-dasharray="10 6" /><line x1="431.4000" y1="452.5000" x2="641.0000" y2="452.5000" stroke="#202020" stroke-width="4.7" stroke-linecap="round" stroke-dasharray="10 6" /><line x1="431.4000" y1="190.5000" x2="641.0000" y2="452.5000" stroke="#227365" stroke-width="5.25" stroke-linecap="round" /><circle cx="117.0" cy="190.5" r="4.9" fill="#28364b" /><text x="99.0000" y="175.5000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">A</text><circle cx="117.0" cy="452.5" r="4.9" fill="#28364b" /><text x="100.0000" y="475.5000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">B</text><circle cx="431.4" cy="452.5" r="4.9" fill="#28364b" /><text x="448.4000" y="475.5000" font-size="29" font-family="Malgun G