<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 747 593" width="747" height="593" role="img" aria-labelledby="title desc"><title id="title">반듯한 종이띠에서 E와 F를 따라 접은 모양</title><desc id="desc">EF가 접는 선이다. 접기 전 오른쪽의 테두리는 회색 점선, 접은 뒤의 테두리는 청록선이다. G는 접은 선 모양이 위 가로선과 만나는 점이며 각 EGF는 30°이다. E의 바깥 각 CEF에 x를 붙였다.</desc><rect width="747" height="593" fill="white" /><line x1="127.2150" y1="298.4849" x2="127.2150" y2="415.7849" stroke="#202020" stroke-width="5.25" stroke-linecap="round" /><line x1="127.2150" y1="415.7849" x2="361.8150" y2="415.7849" stroke="#202020" stroke-width="5.15" stroke-linecap="round" /><line x1="127.2150" y1="298.4849" x2="158.6454" y2="298.4849" stroke="#202020" stroke-width="4.75" stroke-linecap="round" /><line x1="158.6454" y1="298.4849" x2="393.2454" y2="298.4849" stroke="#202020" stroke-width="4.75" stroke-linecap="round" /><line x1="361.8150" y1="415.7849" x2="623.7850" y2="415.7849" stroke="#687889" stroke-width="3.45" stroke-linecap="round" stroke-dasharray="10 7" /><line x1="623.7850" y1="415.7849" x2="623.7850" y2="298.4849" stroke="#687889" stroke-width="3.45" stroke-linecap="round" stroke-dasharray="10 7" /><line x1="623.7850" y1="298.4849" x2="393.2454" y2="298.4849" stroke="#687889" stroke-width="3.45" stroke-linecap="round" stroke-dasharray="10 7" /><line x1="361.8150" y1="415.7849" x2="134.9423" y2="284.7999" stroke="#227365" stroke-width="5.35" stroke-linecap="round" /><line x1="134.9423" y1="284.7999" x2="193.5923" y2="183.2151" stroke="#227365" stroke-width="5.35" stroke-linecap="round" /><line x1="193.5923" y1="183.2151" x2="393.2454" y2="298.4849" stroke="#227365" stroke-width="5.35" stroke-linecap="round" /><line x1="361.8150" y1="415.7849" x2="393.2454" y2="298.4849" stroke="#774698" stroke-width="5.3" stroke-linecap="round" /><path d="M 212.3390 329.4849 A 62 62 0 0 0 220.6454 298.4849" stroke="#a34c1f" stroke-width="2.25" fill="none" /><text x="273.5906" y="337.2844" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#a34c1f" text-anchor="middle">30°</text><path d="M 376.5677 360.7271 A 57 57 0 0 1 418.8150 415.7849" stroke="#a34c1f" stroke-width="2.25" fill="none" /><text x="449.0839" y="356.8211" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#a34c1f" text-anchor="middle">x</text><circle cx="127.215" cy="298.4848899319573" r="4.9" fill="#28364b" /><text x="109.2150" y="283.4849" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">A</text><circle cx="127.215" cy="415.7848899319573" r="4.9" fill="#28364b" /><text x="110.2150" y="438.7849" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">B</text><circle cx="623.785" cy="415.7848899319573" r="4.9" fill="#28364b" /><text x="640.7850" y="438.7849" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">C</text><circle cx="623.785" cy="298.4848899319573" r="4.9" fill="#28364b" /><text x="640.7850" y="283.4849" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">D</text><circle cx="158.64544027217065" cy="298.4848899319573" r="4.9" fill="#28364b" /><text x="158.6454" y="279.4849" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">G</text><circle cx="393.2454402721707" cy="298.4848899319573" r="4.9" fill="#28364b" /><text x="406.2454" y="284.4849" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">F</text><circle cx="361.815" cy="415.7848899319573" r="4.9" fill="#28364b" /><text x="362.8150" y="443.7849" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">E</text></svg>
