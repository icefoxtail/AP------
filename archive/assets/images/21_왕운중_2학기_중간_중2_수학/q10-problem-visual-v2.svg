<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 748 675" width="748" height="675" role="img" aria-labelledby="title desc"><title id="title">외심에서 본 각의 크기</title><desc id="desc">O는 외심이다. B에서 BA와 BO 사이는 20°, C에서 CA와 CO 사이는 30°이다. B의 OBC에 x, O의 BOC에 y를 표시했다.</desc><rect width="748" height="675" fill="white" /><line x1="430.2620" y1="69.8296" x2="125.8016" y2="597.1704" stroke="#202020" stroke-width="5.15" stroke-linecap="round" /><line x1="125.8016" y1="597.1704" x2="622.1984" y2="597.1704" stroke="#202020" stroke-width="5.15" stroke-linecap="round" /><line x1="622.1984" y1="597.1704" x2="430.2620" y2="69.8296" stroke="#202020" stroke-width="5.15" stroke-linecap="round" /><line x1="374.0000" y1="388.9073" x2="430.2620" y2="69.8296" stroke="#227365" stroke-width="5.1" stroke-linecap="round" /><line x1="374.0000" y1="388.9073" x2="125.8016" y2="597.1704" stroke="#227365" stroke-width="5.1" stroke-linecap="round" /><line x1="374.0000" y1="388.9073" x2="622.1984" y2="597.1704" stroke="#227365" stroke-width="5.1" stroke-linecap="round" /><path d="M 188.6172 544.4619 A 82 82 0 0 0 166.8016 526.1564" stroke="#a34c1f" stroke-width="2.25" fill="none" /><text x="209.3640" y="505.5847" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#a34c1f" text-anchor="middle">20°</text><path d="M 597.9150 530.4523 A 71 71 0 0 0 567.8092 551.5325" stroke="#a34c1f" stroke-width="2.25" fill="none" /><text x="548.7806" y="500.3190" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#a34c1f" text-anchor="middle">30°</text><path d="M 191.8016 597.1704 A 66 66 0 0 0 176.3605 554.7465" stroke="#774698" stroke-width="2.25" fill="none" /><text x="237.6250" y="564.4701" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#774698" text-anchor="middle">x</text><path d="M 332.6336 423.6178 A 54 54 0 0 0 415.3664 423.6178" stroke="#774698" stroke-width="2.25" fill="none" /><text