<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 748 637" width="748" height="637" role="img" aria-labelledby="title desc"><title id="title">평행사변형 안 색칠한 삼각형 COD</title><desc id="desc">AB는 12 cm, 대각선 AC는 14 cm이고 OD는 8 cm이다. 두 대각선은 O에서 만나며 오른쪽 삼각형 COD만 옅게 칠했다.</desc><rect width="748" height="637" fill="white" /><polygon points="503.4810,526.4896 374.0000,318.5000 561.4575,110.5104" fill="none" /><line x1="244.5190" y1="110.5104" x2="186.5425" y2="526.4896" stroke="#202020" stroke-width="5.15" stroke-linecap="round" /><line x1="186.5425" y1="526.4896" x2="503.4810" y2="526.4896" stroke="#202020" stroke-width="5.15" stroke-linecap="round" /><line x1="503.4810" y1="526.4896" x2="561.4575" y2="110.5104" stroke="#202020" stroke-width="5.15" stroke-linecap="round" /><line x1="561.4575" y1="110.5104" x2="244.5190" y2="110.5104" stroke="#202020" stroke-width="5.15" stroke-linecap="round" /><line x1="244.5190" y1="110.5104" x2="503.4810" y2="526.4896" stroke="#774698" stroke-width="4.9" stroke-linecap="round" /><line x1="186.5425" y1="526.4896" x2="561.4575" y2="110.5104" stroke="#227365" stroke-width="4.9" stroke-linecap="round" /><line x1="146.9254" y1="520.9680" x2="204.9020" y2="104.9888" stroke="#202020" stroke-width="1.7" stroke-linecap="round" /><line x1="141.4781" y1="520.2088" x2="152.3728" y2="521.7273" stroke="#202020" stroke-width="1.7" stroke-linecap="round" /><line x1="199.4546" y1="104.2296" x2="210.3493" y2="105.7480" stroke="#202020" stroke-width="1.7" stroke-linecap="round" /><text x="125.4019" y="313.9384" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#202020" text-anchor="middle">12 cm</text><line x1="207.1658" y1="133.7641" x2="466.1277" y2="549.7433" stroke="#774698" stroke-width="1.7" stroke-linecap="round" /><line x1="211.8350" y1="130.8574" x2="202.4966" y2="136.6708" stroke="#774698" stroke-width="1.7" stroke-linecap="round" /><line x1="470.7969" y1="546.8366" x2="461.4586" y2="552.6501" stroke="#7746