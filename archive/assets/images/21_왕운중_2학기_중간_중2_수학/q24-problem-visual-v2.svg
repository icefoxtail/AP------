ke="#202020" stroke-width="1.7" stroke-linecap="round" /><text x="46.0000" y="372.5000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#202020" text-anchor="middle">5</text><circle cx="101.0" cy="250.75" r="4.9" fill="#28364b" /><text x="83.0000" y="238.7500" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">A</text><circle cx="101.0" cy="478.25" r="4.9" fill="#28364b" /><text x="82.0000" y="496.2500" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">B</text><circle cx="647.0" cy="478.25" r="4.9" fill="#28364b" /><text x="668.0000" y="494.2500" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">C</text><circle cx="192.0" cy="387.25" r="4.9" fill="#28364b" /><text x="215.0000" y="401.2500" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">D</text><circle cx="374.0" cy="364.5" r="4.9" fill="#28364b" /><text x="384.0000" y="346.5000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">E</text></svg>
