<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="760" height="430" role="img" aria-labelledby="title desc"><title id="title">전칭·존재명제의 진리집합</title><desc id="desc">P=U ⇒ 어떤 x에 대하여 p · P=∅ ⇒ 모든 x에 대하여 ~p · P≠U만으로는 존재 보장 불가</desc><style>text{font-family:"Noto Sans KR","Malgun Gothic",Arial,sans-serif;fill:#172033}.muted{fill:#56657a}.math{font-family:Georgia,"Times New Roman",serif}</style><rect width="760" height="430" fill="#f8fafc"/><text x="28" y="38" font-size="22" font-weight="700">전칭·존재명제의 진리집합</text><text x="28" y="67" class="muted" font-size="15">P=U ⇒ 어떤 x에 대하여 p</text><rect x="42" y="96" width="676" height="184" rx="12" fill="#fff" stroke="#cbd5e1"/><line x1="42" y1="130" x2="718" y2="130" stroke="#e2e8f0"/><text x="68" y="160" class="case-label" font-size="16" font-weight="700">P=U</text><text x="280" y="160" class="muted" font-size="15">P=∅ ⇒ 모든 x에 대하여 ~p</text><line x1="42" y1="180" x2="718" y2="180" stroke="#e2e8f0"/><text x="68" y="210" class="case-label" font-size="16" font-weight="700">P=∅</text><text x="280" y="210" class="muted" font-size="15">P≠U만으로는 존재 보장 불가</text><line x1="42" y1="230" x2="718" y2="230" stroke="#e2e8f0"/><text x="68" y="260" class="case-label" font-size="16" font-weight="700">P≠U</text><text x="280" y="260" class="muted" font-size="15"></text></svg>