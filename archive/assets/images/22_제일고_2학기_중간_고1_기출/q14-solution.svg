<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" role="img" aria-labelledby="title desc"><title id="title">전칭·존재명제의 진리집합</title><desc id="desc">각 진리집합 경우와 그 결론을 같은 행에서 보인다.</desc><style>text{font-family:"Noto Sans KR","Malgun Gothic",Arial,sans-serif;fill:#172033}.muted{fill:#56657a}</style><rect width="760" height="430" fill="#f8fafc"/><text x="28" y="38" font-size="22" font-weight="700">전칭·존재명제의 진리집합</text><rect x="42" y="96" width="676" height="216" rx="12" fill="#fff" stroke="#cbd5e1"/><line x1="42" y1="168" x2="718" y2="168" stroke="#e2e8f0"/><line x1="42" y1="240" x2="718" y2="240" stroke="#e2e8f0"/><text x="68" y="135" font-size="18" font-weight="700">P=U</text><text x="180" y="135" class="muted" font-size="16">모든 x에서 p 참 → 어떤 x에 대하여 p도 참</text><text x="68" y="207" font-size="18" font-weight="700">P=∅</text><text x="180" y="207" class="muted" font-size="16">모든 x에 대하여 ~p</text><text x="68" y="279" font-size="18" font-weight="700">P≠U</text><text x="180" y="279" class="muted" font-size="16">P가 비어 있지 않음을 보장하지 않아 존재명제 참을 보장 못 함</text></svg>
