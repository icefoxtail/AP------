    </style>
    <rect width="760" height="430" fill="#f8fafc"/><text x="28" y="38" font-size="22" text-anchor="start" class="text" font-weight="700">두 괄호를 먼저 정리하면 B와 Bᶜ가 남는다</text><text x="28" y="67" font-size="15" text-anchor="start" class="muted">분배법칙: (X∪Z)∩(Y∪Z)=(X∩Y)∪Z</text><rect x="34" y="98" width="692" height="214" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/><text x="50" y="125" font-size="15" text-anchor="start" class="text" fill="#2563eb" font-weight="700">문항의 실제 식을 두 줄로 변형</text><text x="54" y="145" font-size="19" text-anchor="start" class="math-strong">(A∪B)∩(Aᶜ∪B)</text><text x="350" y="145" font-size="19" text-anchor="start" class="text" fill="#1d4ed8" font-weight="700">= (A∩Aᶜ)∪B = B</text><text x="54" y="205" font-size="19" text-anchor="start" class="math-strong">(Aᶜ∪Bᶜ)∩(A∪Bᶜ)</text><text x="350" y="205" font-size="19" text-anchor="start" class="text" fill="#1d4ed8" font-weight="700">= (Aᶜ∩A)∪Bᶜ = Bᶜ</text><line x1="54" y1="242" x2="704" y2="242" stroke="#e2e8f0" stroke-width="1.4" stroke-linecap="round"/><rect x="54" y="270" width="260" height="30" rx="15" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/><text x="184" y="290" font-size="14" text-anchor="middle" class="text" fill="#166534" font-weight="700">B∪Bᶜ=U</text><text x="354" y="293" font-size="22" text-anchor="start" class="text" fill="#166534" font-weight="700">최종 결과: U</text></svg>