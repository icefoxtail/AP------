<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc" data-visual-case="set-2022-pilot" data-fact-hash="78b169625cdaf203209aca1577bc628bc7d8c19e4af06eb541268cc98e5f556d" data-visual-provenance="2026-09-05-set-visual-pilot"><title id="title">문항 13 해설: 집합식의 두 단계 분배</title><desc id="desc">문항에 제시된 두 괄호가 각각 B와 Bᶜ로 정리된 뒤 전체집합 U가 되는 변형 흐름</desc>
    <style>
      .text { font-family:"Noto Sans KR","Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif; fill:#172033; }
      .math { font-family:"STIX Two Math","Cambria Math","Times New Roman",serif; fill:#172033; }
      .muted { font-family:"Noto Sans KR","Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif; fill:#56657a; }
      .small { font-family:"Noto Sans KR","Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif; fill:#334155; }
      .strong { font-family:"Noto Sans KR","Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif; fill:#172033; font-weight:700; }
