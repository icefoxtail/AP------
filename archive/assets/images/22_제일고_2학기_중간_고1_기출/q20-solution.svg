<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc" data-visual-case="set-2022-pilot" data-fact-hash="732d1f6dc0f5dd5cc55e57c0c9b037adfb9300b23f361d775f065ea539afcf33" data-visual-provenance="2026-09-05-set-visual-pilot"><title id="title">문항 20 해설: A와 제곱 집합의 후보 결정</title><desc id="desc">A∩B={a₁,a₄}, a₁+a₄=10, 합집합 원소 합 232에서 실제 A와 B를 복원하는 수치 흐름</desc>
    <style>
      .text { font-family:"Noto Sans KR","Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif; fill:#172033; }
      .math { font-family:"STIX Two Math","Cambria Math","Times New Roman",serif; fill:#172033; }
      .muted { font-family:"Noto Sans KR","Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif; fill:#56657a; }
      .small { font-family:"Noto Sans KR","Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif; fill:#334155; }
      .strong { font-family:"Noto Sans KR","Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif; fill:#172033; font-weight:700; }
      .math-strong { font-family:"STIX Two Math","Cambria Math","Times New Roman",serif; fill:#172033; font-weight:700; }
    </style>
    <rect width="760" height="430" fill="#f8fafc"/><text x="28" y="38" font-size="22" text-anchor="start" class="text" font-weight="700">교집합의 두 원소와 제곱 관계를 순서대로 확정한다</text><text x="28" y="67" font-size="15" text-anchor="start" class="muted">a₁+a₄=10, A∩B={a₁,a₄}, Σ(aᵢ+aᵢ²)=242</text><rect x="34" y="96" width="326" height="220" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/><text x="50" y="123" font-size="15" text-anchor="start" class="text" fill="#7c3aed" font-weight="700">앞의 두 원소</text><text x="54" y="140" font-size="15" text-anchor="start" class="text" fill="#334155"><tspan x="54" dy="0">a₁=1  (a₁이 제곱수 집합에 속해야 함)</tspan><tspan x="54" dy="39">a₄=9</tspan><tspan x="54" dy="39">9∈B → 3∈A</tspan></text><rect x="394" y="96" width="330" height="220" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/><text x="410" y="123" font-size="15" text-anchor="start" class="text" fill="#2563eb" font-weight="700">합 조건으로 나머지 결정</text><text x="414" y="140" font-size="15" text-anchor="start" class="text" fill="#334155"><tspan x="414" dy="0">T(t)=t²+t</tspan><tspan x="414" dy="35">T(1)+T(9)=92</tspan><tspan x="414" dy="35">T(a₂)+T(a₃)+T(a₅)=150</tspan><tspan x="414" dy="35">a₂=2, a₃=3, a₅=11</tspan></text><rect x="54" y="342" width="260" height="30" rx="15" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/><text x="184" y="362" font-size="14" text-anchor="middle" class="text" fill="#166534" font-weight="700">A={1,2,3,9,11}</text><text x="350" y="364" font-size="18" text-anchor="start" class="text" fill="#1d4ed8" font-weight="700">B={1,4,9,81,121}</text></svg>