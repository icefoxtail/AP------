<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc" data-visual-case="set-2022-pilot" data-fact-hash="eba8bd05d644969ff6835cdaffc2612fceaf412e287907b72ee40f3c30987e4d" data-visual-provenance="2026-09-05-set-visual-pilot"><title id="title">문항 11 해설: 진부분집합 후보 교집합</title><desc id="desc">A의 두 원소가 B의 세 식 중 하나와 같아지는 후보를 비교해 a=3을 고르는 도식</desc>
    <style>
      .text { font-family:"Noto Sans KR","Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif; fill:#172033; }
      .math { font-family:"STIX Two Math","Cambria Math","Times New Roman",serif; fill:#172033; }
      .muted { font-family:"Noto Sans KR","Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif; fill:#56657a; }
      .small { font-family:"Noto Sans KR","Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif; fill:#334155; }
      .strong { font-family:"Noto Sans KR","Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif; fill:#172033; font-weight:700; }
      .math-strong { font-family:"STIX Two Math","Cambria Math","Times New Roman",serif; fill:#172033; font-weight:700; }
    </style>
    <rect width="760" height="430" fill="#f8fafc"/><text x="28" y="38" font-size="22" text-anchor="start" class="text" font-weight="700">A의 두 원소가 B에 들어가는 a 후보의 교집합을 찾는다</text><text x="28" y="67" font-size="15" text-anchor="start" class="muted">a∈B의 후보와 a+2∈B의 후보를 각각 계산</text><rect x="34" y="96" width="330" height="214" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/><text x="50" y="123" font-size="15" text-anchor="start" class="text" fill="#2563eb" font-weight="700">첫 번째 원소 a</text><text x="54" y="141" font-size="15" text-anchor="start" class="text" fill="#334155"><tspan x="54" dy="0">a=3a−4 → a=2</tspan><tspan x="54" dy="35">a=2a−2 → a=2</tspan><tspan x="54" dy="35">a=2a−3 → a=3</tspan><tspan x="54" dy="35">후보: {2,3}</tspan></text><rect x="394" y="96" width="330" height="214" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/><text x="410" y="123" font-size="15" text-anchor="start" class="text" fill="#7c3aed" font-weight="700">두 번째 원소 a+2</text><text x="414" y="141" font-size="15" text-anchor="start" class="text" fill="#334155"><tspan x="414" dy="0">a+2=3a−4 → a=3</tspan><tspan x="414" dy="35">a+2=2a−2 → a=4</tspan><tspan x="414" dy="35">a+2=2a−3 → a=5</tspan><tspan x="414" dy="35">후보: {3,4,5}</tspan></text><line x1="184" y1="334" x2="576" y2="334" stroke="#16a34a" stroke-width="2.2" stroke-linecap="round"/><text x="380" y="326" font-size="18" text-anchor="middle" class="text" fill="#166534" font-weight="700">공통 후보 a=3</text><text x="38" y="374" font-size="15" text-anchor="start" class="muted">a=3이면 A={3,5}, B={3,4,5}이므로 A⊊B가 실제로 성립한다.</text></svg>