<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 420" width="480" height="420" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">예: t=4일 때를 그린다. A(4,0), B(0,3)이고 OA=4, OB=3, 빗변 AB=5인 직각삼각형이다. 내접원은 세 변에 접하고 반지름 r=(4+3-5)/2=1이며 중심은 I(1,1)이다. 일반적으로 넓이 3t/2=r·(t+3+√(t²+9))/2에서 r/t=3/(t+3+√(t²+9))이고 t→0+에서 극한은 3/6=1/2이다. 따라서 답은 ②이다.</title><desc id="visual-desc">원점 O에서 가로축 위의 점 A와 세로축 위의 점 B로 가는 두 변과 빗변 AB가 직각삼각형을 이루고, 삼각형 안에 세 변에 접하는 원이 있으며 원의 중심 I에 좌표가 표시된 그림이다.</desc><rect width="480" height="420" fill="#fff"/><g data-layer="30"><line id="x-axis" data-role="axis" stroke="#111" stroke-width="1.2" fill="none" data-axis="x" x1="32" y1="301.764705882" x2="448" y2="301.764705882"/></g><g data-layer="30"><line id="y-axis" data-role="axis" stroke="#111" stroke-width="1.2" fill="none" data-axis="y" x1="117.647058824" y1="387.411764706" x2="117.647058824" y2="32.588235294"/></g><g data-layer="30"><line id="sAB" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="362.352941176" y1="301.764705882" x2="117.647058824" y2="118.235294118"/></g><g data-layer="35"><line id="sOA" data-role="line" stroke="#111" stroke-width="3.2" fill="none" x1="117.647058824" y1="301.764705882" x2="362.352941176" y2="301.764705882"/></g><g data-layer="35"><line id="sOB" data-role="line" stroke="#111" stroke-width="3.2" fill="none" x1="117.647058824" y1="