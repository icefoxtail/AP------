<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" width="640" height="480" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">제1사분면에서 x축 위의 A와 y축 위의 B를 잇는 길이 8의 선분 AB, AP:PB=3:1인 내부 점 P</title><desc id="visual-desc">가로 x축 위 A와 세로 y축 위 B를 대각선으로 연결한 선분 AB의 길이는 8이다. 선분 중간의 점 P는 A에서 P까지가 P에서 B까지의 세 배인 위치에 있으며, 두 부분에 각각 3t와 t를 표시한다.</desc><rect width="640" height="480" fill="#fff"/><g data-layer="30"><line id="x-axis" data-role="axis" stroke="#111" stroke-width="1.2" fill="none" data-axis="x" x1="142.588235294" y1="362.352941176" x2="497.411764706" y2="362.352941176"/></g><g data-layer="30"><line id="y-axis" data-role="axis" stroke="#111" stroke-width="1.2" fill="none" data-axis="y" x1="228.235294118" y1="448" x2="228.235294118" y2="32"/></g><g data-layer="30"><line id="sAP" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="411.764705882" y1="362.352941176" x2="274.117647059" y2="178.823529412"/></g><g data-layer="30"><line id="sPB" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="274.117647059" y1="178.823529412" x2="228.235294118" y2="117.647058824"/></g><g data-layer="52"><line id="dAB-ext-from" data-role="indicator" stroke="#111" stroke-width="0.8" fill="none" data-mark="dimension" data-mark-id="dAB" data-mark-part="ext-from" x1="414.964705882" y1="359.952941176" x2="503.764705882" y2="293.3529411