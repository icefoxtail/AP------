<svg xmlns="http://www.w3.org/2000/svg" width="640" height="640" viewBox="0 0 640 640" role="img" aria-labelledby="title desc">
<title id="title">직선이 선분과 만나는 매개변수</title><desc id="desc">선분 AB에서 교점이 A일 때 k=−1, B일 때 k=2.</desc>
<style>.axis{stroke:#111;stroke-width:1.2}.shape,.curve{fill:none;stroke:#111;stroke-width:1.8}.guide{fill:none;stroke:#555;stroke-width:1;stroke-dasharray:5 4}.point{fill:#111}.radius{fill:none;stroke:#1f4e79;stroke-width:1.5}.tangent{fill:none;stroke:#111;stroke-width:2.1}.perpendicular{fill:none;stroke:#555;stroke-width:1;stroke-dasharray:3 3}.right-angle{fill:none;stroke:#111;stroke-width:1.2}.center-point{fill:#1f4e79}.element-label,.annotation{font:13px sans-serif}.annotation{font-style:italic}text{font:14px sans-serif;fill:#111}.cell{fill:#fff;stroke:#111;stroke-width:1}.cell-text{text-anchor:middle;dominant-baseline:middle;font:13px sans-serif}</style><rect width="640" height="640" fill="#ffffff"/>
<line x1="176" y1="32" x2="176" y2="608" class="axis"/>
<line x1="32" y1="464" x2="608" y2="464" class="axis"/>
