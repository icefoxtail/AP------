<svg xmlns="http://www.w3.org/2000/svg" width="700" height="240" viewBox="0 0 700 240" role="img" aria-labelledby="title desc"><title id="title">두 점 사이 거리 3</title><desc id="desc">A의 두 좌표 후보가 B(−1)에서 각각 3만큼 떨어진 수직선.</desc><style>text{font-family:"Noto Sans KR","Malgun Gothic",sans-serif;fill:#111}.title{font-size:20px;font-weight:700}.label{font-size:16px}.note{font-size:14px}.axis{stroke:#111;stroke-width:2}.bar{stroke:#111;stroke-width:5;stroke-linecap:round}.guide{stroke:#555;stroke-width:2;stroke-dasharray:7 5}.dot{fill:#111}.open{fill:white;stroke:#111;stroke-width:2.5}</style><rect width="700" height="240" fill="white"/><text x="35" y="38" class="title">두 점 사이 거리 3</text><line x1="90" y1="135" x2="620" y2="135" class="axis"/><line x1="110" y1="95" x2="350" y2="95" class="guide"/><line x1="350" y1="95" x2="590" y2="95" class="guide"/><text x="230" y="82" class="note" text-anchor="middle">거리 3</text><text x="470" y="82" class="note" text-anchor="middle">거리 3</text><circle cx="110" cy="135" r="6" class="dot"/><circle cx="350" cy="135" r="6" class="dot"/><circle cx="590" cy="135" r="6" class="dot"/><text x="110" y="177" class="label" text-anchor="middle">A(−4)</text><text x="350" y="177" class="label" text-anchor="middle">B(−1)</text><text x="590" y="177" class="label" text-anchor="middle">A(2)</text><text x="110" y="205" class="note" text-anchor="middle">a=−4</text><text x="590" y="205" class="note" text-anchor="middle">a=2</text></svg>