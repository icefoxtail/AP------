<svg xmlns="http://www.w3.org/2000/svg" width="760" height="360" viewBox="0 0 760 360" role="img" aria-labelledby="title desc"><title id="title">연립부등식의 공통 구간</title><desc id="desc">첫 부등식의 닫힌 구간과 두 번째 부등식의 바깥 구간을 교차한다.</desc><style>text{font-family:"Noto Sans KR","Malgun Gothic",sans-serif;fill:#111}.title{font-size:20px;font-weight:700}.label{font-size:16px}.note{font-size:14px}.axis{stroke:#111;stroke-width:2}.bar{stroke:#111;stroke-width:5;stroke-linecap:round}.guide{stroke:#555;stroke-width:2;stroke-dasharray:7 5}.dot{fill:#111}.open{fill:white;stroke:#111;stroke-width:2.5}</style><rect width="760" height="360" fill="white"/><text x="25" y="34" class="title">연립부등식의 공통 구간</text><text x="22" y="104" class="note">첫째 부등식</text><text x="22" y="204" class="note">a=−3일 때</text><text x="22" y="304" class="note">공통 해</text><line x1="180" y1="110" x2="700" y2="110" class="axis"/><line x1="180" y1="210" x2="700" y2="210" class="axis"/><line x1="180" y1="310" x2="700" y2="310" class="axis"/><line x1="284" y1="110" x2="648" y2="110" class="bar"/><circle cx="284" cy="110" r="7" class="dot"/><circle cx="648" cy="110" r="7" class="dot"/><polygon points="180,210 195,201 195,219" fill="#111"/><line x1="180" y1="210" x2="232" y2="210" class="bar"/><circle cx="232" cy="210" r="7" class="dot"/><line x1="596" y1="210" x2="700" y2="210" class="bar"/><polygon points="700,210 685,201 685,219" fill="#111"/><circle cx="596" cy="210" r="7" class="dot"/><line x1="596" y1="310" x2="648" y2="310" class="bar"/><circle cx="596" cy="310" r="7" class="dot"/><circle cx="648" cy="310" r="7" class="dot"/><text x="284" y="138" class="label" text-anchor="middle">−2</text><text x="648" y="138" class="label" text-anchor="middle">5</text><text x="232" y="238" class="label" text-anchor="middle">−3</text><text x="596" y="238" class="label" text-anchor="middle">4</text><text x="180" y="340" class="note">[−2,5] ∩ ((−∞,−3]∪[4,∞)) = [4,5]</text></svg>