<svg xmlns="http://www.w3.org/2000/svg" width="760" height="310" viewBox="0 0 760 310" role="img" aria-labelledby="title desc"><title id="title">이차부등식의 음수 구간</title><desc id="desc">해의 열린 부호 구간 (−4,2) 안에 주어진 열린 범위 (−2,2)가 놓인다.</desc><style>text{font-family:"Noto Sans KR","Malgun Gothic",sans-serif;fill:#111}.title{font-size:20px;font-weight:700}.label{font-size:16px}.note{font-size:14px}.axis{stroke:#111;stroke-width:2}.bar{stroke:#111;stroke-width:5;stroke-linecap:round}.guide{stroke:#555;stroke-width:2;stroke-dasharray:7 5}.dot{fill:#111}.open{fill:white;stroke:#111;stroke-width:2.5}</style><rect width="760" height="310" fill="white"/><text x="30" y="36" class="title">이차부등식의 음수 구간</text><text x="35" y="126" class="note">f(x)&lt;0</text><text x="35" y="226" class="note">주어진 범위</text><line x1="120" y1="130" x2="700" y2="130" class="axis"/><line x1="120" y1="230" x2="700" y2="230" class="axis"/><line x1="192.5" y1="130" x2="555" y2="130" class="bar"/><circle cx="192.5" cy="130" r="8" class="open"/><circle cx="555" cy="130" r="8" class="open"/><line x1="337.5" y1="230" x2="555" y2="230" class="bar"/><circle cx="337.5" cy="230" r="8" class="open"/><circle cx="555" cy="230" r="8" class="open"/><text x="192.5" y="164" class="label" text-anchor="middle">−4</text><text x="337.5" y="264" class="label" text-anchor="middle">−2</text><text x="555" y="164" class="label" text-anchor="middle">2 (제외)</text><text x="120" y="296" class="note">a=−2이면 (x+4)(x−2)&lt;0인 구간 안에 (−2,2)가 포함된다.</text></svg>