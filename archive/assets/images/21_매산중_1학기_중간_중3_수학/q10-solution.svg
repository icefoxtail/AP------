<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 241" width="680" height="241" role="img" aria-labelledby="title desc"><title id="title">제곱근에서 양쪽 정수까지의 거리</title><desc id="desc">수직선의 2와 3 사이에 √5가 있다. 파란 치수선은 √5와 왼쪽 정수 2 사이의 거리, 초록 치수선은 오른쪽 정수 3까지의 거리이다.</desc><rect width="680" height="241" fill="white" /><line x1="42.0000" y1="116.0000" x2="638.0000" y2="116.0000" stroke="#28364b" stroke-width="1.85" stroke-linecap="round" /><polygon points="645.0000,116.0000 631.0000,110.0000 631.0000,122.0000" fill="#28364b" /><line x1="110.0000" y1="116.0000" x2="223.3126" y2="116.0000" stroke="#205d9c" stroke-width="4" stroke-linecap="round" /><line x1="223.3126" y1="116.0000" x2="590.0000" y2="116.0000" stroke="#277339" stroke-width="4" stroke-linecap="round" /><line x1="110.0000" y1="107.0000" x2="110.0000" y2="123.0000" stroke="#28364b" stroke-width="2" stroke-linecap="round" /><text x="110.0000" y="159.0000" font-size="30" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">2</text><circle cx="223.3126" cy="116" r="5.5" fill="#28364b" /><text x="223.3126" y="159.0000" font-size="30" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">√5</text><line x1="590.0000" y1="107.0000" x2="590.0000" y2="123.0000" stroke="#28364b" stroke-width="2" stroke-linecap="round" /><text x="590.0000" y="159.0000" font-size="30" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">3</text><line x1="110.0000" y1="64.0000" x2="223.3126" y2="64.0000" stroke="#205d9c" stroke-width="1.7" stroke-linecap="round" /><line x1="110.0000" y1="58.0000" x2="110.0000" y2="70.0000" stroke="#205d9c" stroke-width="1.7" stroke-linecap="round" /><line x1="223.3126" y1="58.0000" x2="223.3126" y2="70.0000" stroke="#205d9c" stroke-width="1.7" stroke-linecap="round" /><text x="166.6563" y="47.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#205d9c" text-anchor="middle">√5 − 2</text><line x1="223.3126" y1="184.0000" x2="590.0000" y2="184.0000" stroke="#277339" stroke-width="1.7" stroke-linecap="round" /><line x1="223.3126" y1="178.0000" x2="223.3126" y2="190.0000" stroke="#277339" stroke-width="1.7" stroke-linecap="round" /><line x1="590.0000" y1="178.0000" x2="590.0000" y2="190.0000" stroke="#277339" stroke-width="1.7" stroke-linecap="round" /><text x="406.6563" y="220.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#277339" text-anchor="middle">3 − √5</text></svg>
