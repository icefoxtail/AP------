<svg xmlns="http://www.w3.org/2000/svg" width="640" height="450" viewBox="0 0 640 450" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc">
  <title id="title">23 순천여고 23번 외접원 지름과 극한 해설</title>
  <desc id="desc">P=(t,2t²), Q의 좌표, OQ=PQ, 각 theta와 외접원 지름 공식을 설명한다</desc>
  <style>.background{fill:#fff}.axis{stroke:#171717;stroke-width:1.4;fill:none;stroke-linecap:round;stroke-linejoin:round}.curve{stroke:#111;stroke-width:2.1;fill:none;stroke-linecap:round;stroke-linejoin:round}.side{stroke:#3f4a5a;stroke-width:1.7;fill:none;stroke-linecap:round;stroke-linejoin:round}.guide{stroke:#777;stroke-width:.95;stroke-dasharray:4 4;fill:none}.point{stroke:#111;stroke-width:1;fill:#111}.panel{fill:#f7f8fa;stroke:#c7cbd1;stroke-width:1}.title{font-family:"Noto Sans KR","Pretendard","Malgun Gothic",sans-serif;font-size:15px;font-weight:700;fill:#111}.label{font-family:"Noto Sans KR","Pretendard","Malgun Gothic",sans-serif;font-size:12px;fill:#222}.small{font-family:"Noto Sans KR","Pretendard","Malgun Gothic",sans-serif;font-size:11px;fill:#333}.math{font-family:"STIX Two Math","Cambria Math","Times New Roman",serif;font-size:13px;fill:#111}</style>
  <defs><marker id="axis-arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L6,3 L0,6 Z" fill="#171717"/></marker></defs>
  <rect class="background" x="0" y="0" width="640" height="450"/><text class="title" x="32" y="28">q23  OQ=PQ와 외접원 지름</text><text class="small" x="32" y="47">길이 조건으로 Q를 정하고, sinθ와 확장 사인법칙을 차례로 적용한다.</text>
  <g aria-label="triangle diagram"><rect class="panel" x="32" y="65" width="300" height="300" rx="8"/><line class="axis" x1="55" y1="315" x2="310" y2="315" marker-end="url(#axis-arrow)"/><line class="axis" x1="110" y1="340" x2="110" y2="82" marker-end="url(#axis-arrow)"/><path class="curve" d="M78 250 C100 220 112 190 160 115 C195 65 225 52 290 45"/><line class="side" x1="110" y1="315" x2="110" y2="245"/><line class="side" x1="110" y1="245" x2="160" y2="175"/><line class="side" x1="110" y1="315" x2="160" y2="175"/><line class="guide" x1="160" y1="175" x2="160" y2="315"/><circle class="point" cx="110" cy="315" r="3.8"/><circle class="point" cx="110" cy="245" r="3.8"/><circle class="point" cx="160" cy="175" r="3.8"/><text class="label" x="92" y="335">O</text><text class="label" x="82" y="238">Q</text><text class="label" x="165" y="170">P(t,2t²)</text><text class="math" x="119" y="212">θ</text><text class="small" x="116" y="280">OQ=PQ</text><text class="math" x="288" y="320">x</text><text class="math" x="116" y="90">y</text></g>
  <g aria-label="calculation"><rect class="panel" x="350" y="65" width="258" height="300" rx="8"/><text class="title" x="368" y="92">식의 흐름</text><text class="math" x="368" y="124">Q=(0,(4t²+1)/4)</text><text class="math" x="368" y="151">sinθ=1/√(4t²+1)</text><text class="math" x="368" y="178">PQ=OQ=(4t²+1)/4</text><line class="guide" x1="368" y1="192" x2="590" y2="192"/><text class="math" x="368" y="223">A(t)=(4t²+1)³ᐟ²/4</text><text class="math" x="368" y="250">A(t)/t³ → 2</text><text class="label" x="368" y="290">(1) 1/√(4t²+1)</text><text class="label" x="368" y="316">(2) (4t²+1)³ᐟ²/4</text><text class="label" x="368" y="342">(3) 2</text></g>
</svg>
