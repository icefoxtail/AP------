<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 704" width="512" height="704" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="UNEQUAL_UNIT_DECLARED" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">h(x)=-x³+2x²+5는 연속이다. 점 A(2,5)에서 h(2)=5&gt;0이고 점 B(3,-4)에서 h(3)=-4&lt;0이므로 그래프가 구간 (2,3)에서 x축을 지난다. 그래서 중간값 정리에 의해 (2,3)에 실근이 반드시 있다. 다른 보기 구간의 양 끝에서는 값이 모두 양수라 근이 보장되지 않는다. 따라서 답은 ①이다.</title><desc id="visual-desc">삼차함수의 그래프이며 x=2의 점 A는 x축 위에, x=3의 점 B는 x축 아래에 있고 두 점의 좌표가 표시되어 있다.</desc><rect width="512" height="704" fill="#fff"/><g data-layer="30"><line id="x-axis" data-role="axis" stroke="#111" stroke-width="1.2" fill="none" data-axis="x" x1="32" y1="379.982176957" x2="480" y2="379.982176957"/></g><g data-layer="30"><line id="y-axis" data-role="axis" stroke="#111" stroke-width="1.2" fill="none" data-axis="y" x1="172.927143994" y1="672" x2="172.927143994" y2="32"/></g><g data-layer="40"><polyline id="f-piece-1-branch-0" data-role="curve" stroke="#111" stroke-width="2.1" fill="none" data-branch="PIECE_1" points="95.931599754,72 97.002291395,75.71030196 98.072983035,79.346780446 99.143674676,82.910056588 100.214366316,86.400751518 101.285057956,89.819486366 102.355749597,93.166882265 103.426441237,96.443560344 104.497132878,99.650141735 105.567824518,102.78724757 106.638516159,105.855498979 107.709207799,108.855517093 108.77989944,111.787923045 109.85059108,114.653337964 110.92128272,117.452382