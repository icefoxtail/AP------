<svg xmlns="http://www.w3.org/2000/svg" width="640" height="390" viewBox="0 0 640 390" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc">
  <title id="title">23 순천여고 1번 좌우극한 해설</title>
  <desc id="desc">x=1의 왼쪽 branch가 2에 접근하고 x=4의 오른쪽 branch가 3에서 시작하는 점을 표시한다</desc>
  <style>.background{fill:#fff}.axis{stroke:#171717;stroke-width:1.4;fill:none;stroke-linecap:round;stroke-linejoin:round}.curve{stroke:#111;stroke-width:2.1;fill:none;stroke-linecap:round;stroke-linejoin:round}.guide{stroke:#777;stroke-width:.95;stroke-dasharray:4 4;fill:none}.open{stroke:#111;stroke-width:1.4;fill:#fff}.closed{stroke:#111;stroke-width:1;fill:#111}.panel{fill:#f7f8fa;stroke:#c7cbd1;stroke-width:1}.title{font-family:"Noto Sans KR","Pretendard","Malgun Gothic",sans-serif;font-size:15px;font-weight:700;fill:#111}.label{font-family:"Noto Sans KR","Pretendard","Malgun Gothic",sans-serif;font-size:12px;fill:#222}.small{font-family:"Noto Sans KR","Pretendard","Malgun Gothic",sans-serif;font-size:11px;fill:#333}.math{font-family:"STIX Two Math","Cambria Math","Times New Roman",serif;font-size:13px;fill:#111}</style>
  <defs><marker id="axis-arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L6,3 L0,6 Z" fill="#171717"/></marker></defs>
  <rect class="background" x="0" y="0" width="640" height="390"/><text class="title" x="32" y="28">q1  지정된 방향의 극한 읽기</text><text class="small" x="32" y="47">x=1의 왼쪽과 x=4의 오른쪽에서 가까워지는 branch의 높이를 읽는다.</text>
  <g aria-label="graph"><rect class="panel" x="32" y="65" width="350" height="235" rx="8"/><line class="axis" x1="52" y1="245" x2="365" y2="245" marker-end="url(#axis-arrow)"/><line class="axis" x1="100" y1="280" x2="100" y2="82" marker-end="url(#axis-arrow)"/><path class="curve" d="M55 260 L150 170 L200 120"/><path class="curve" d="M200 120 L250 185 L300 245"/><path class="curve" d="M300 120 L365 205"/><circle class="open" cx="200" cy="120" r="4.6"/><circle class="open" cx="300" cy="120" r="4.6"/><line class="guide" x1="200" y1="120" x2="200" y2="245"/><line class="guide" x1="300" y1="120" x2="300" y2="245"/><text class="label" x="194" y="267">1</text><text class="label" x="294" y="267">4</text><text class="math" x="78" y="124">2</text><text class="math" x="308" y="124">3</text><text class="math" x="358" y="250">x</text><text class="math" x="106" y="90">y</text><text class="small" x="55" y="284">x→1− : 2</text><text class="small" x="223" y="284">x→4+ : 3</text></g>
  <g aria-label="calculation"><rect class="panel" x="400" y="65" width="208" height="235" rx="8"/><text class="title" x="418" y="92">합 계산</text><text class="math" x="418" y="128">lim x→1− f(x)=2</text><text class="math" x="418" y="160">lim x→4+ f(x)=3</text><line class="guide" x1="418" y1="176" x2="590" y2="176"/><text class="label" x="418" y="214">합 = 2+3=5</text><text class="small" x="418" y="248">정답: ③</text><text class="small" x="418" y="278">함숫값이 아니라 접근 branch를 본다.</text></g>
  <rect class="panel" x="32" y="320" width="576" height="38" rx="7"/><text class="small" x="50" y="344">좌극한은 왼쪽에서, 우극한은 오른쪽에서 접근하는 값을 읽는 것이 핵심이다.</text>
</svg>
