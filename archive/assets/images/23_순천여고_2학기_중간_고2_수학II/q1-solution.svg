<svg xmlns="http://www.w3.org/2000/svg" width="640" height="450" viewBox="0 0 640 450" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc" data-fact-hash="sha256:17ddd452db2315a015e368342d714d34423bbe2f0dda77b68653fe357c4ec21d" data-visual-provenance="PYTHON_DERIVED_LAYOUT_REVIEWED">
  <title id="title">23 순천여고 1번 좌우극한 해설</title>
  <desc id="desc">x=1의 왼쪽 branch가 2에 접근하고 x=4의 오른쪽 branch가 3에서 시작하는 점을 표시한다</desc>
  <style>.background{fill:#fff}.axis{stroke:#171717;stroke-width:1.4;fill:none;stroke-linecap:round;stroke-linejoin:round}.curve{stroke:#111;stroke-width:2.1;fill:none;stroke-linecap:round;stroke-linejoin:round}.tangent{stroke:#b23a48;stroke-width:2;fill:none;stroke-linecap:round}.normal{stroke:#b23a48;stroke-width:2;fill:none;stroke-linecap:round}.perp{stroke:#356a9a;stroke-width:1.9;fill:none;stroke-linecap:round}.secant{stroke:#356a9a;stroke-width:1.9;fill:none;stroke-linecap:round}.line{stroke:#356a9a;stroke-width:1.9;fill:none;stroke-linecap:round}.line-main{stroke:#356a9a;stroke-width:1.9;fill:none;stroke-linecap:round}.level{stroke:#6b7280;stroke-width:1.2;stroke-dasharray:5 4;fill:none}.guide{stroke:#777;stroke-width:.95;stroke-dasharray:4 4;fill:none}.point{stroke:#111;stroke-width:1;fill:#111}.open{stroke:#111;stroke-width:1.3;fill:#fff}.closed{stroke:#111;stroke-width:1;fill:#111}.panel{fill:#f7f8fa;stroke:#c7cbd1;stroke-width:1}.title{font-family:"Noto Sans KR","Pretendard","Malgun Gothic",sans-serif;font-size:15px;font-weight:700;fill:#111}.label{font-family:"Noto Sans KR","Pretendard","Malgun Gothic",sans-serif;font-size:12px;fill:#222}.small{font-family:"Noto Sans KR","Pretendard","Malgun Gothic",sans-serif;font-size:11px;fill:#333}.math{font-family:"STIX Two Math","Cambria Math","Times New Roman",serif;font-size:13px;fill:#111}</style>
  <defs><marker id="axis-arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L6,3 L0,6 Z" fill="#171717"/></marker><clipPath id="graph-clip"><rect x="32" y="65" width="342" height="296" rx="8"/></clipPath></defs>
  <rect class="background" x="0" y="0" width="640" height="450"/>
  <text class="title" x="32.000" y="28.000">23 순천여고 1번 좌우극한</text>
  <text class="small" x="32.000" y="47.000">x=1의 왼쪽 그래프가 2에 접근하고 x=4의 오른쪽 그래프가 3에서 시작하는 점을 표시한다</text>
  <g aria-label="graph"><rect class="panel" x="32" y="65" width="342" height="296" rx="8"/><g clip-path="url(#graph-clip)"><line class="axis" x1="52.000" y1="245.000" x2="352.000" y2="245.000" marker-end="url(#axis-arrow)"/><line class="axis" x1="110.000" y1="346.000" x2="110.000" y2="82.000" marker-end="url(#axis-arrow)"/><polyline class="curve" points="52.000,260.000 100.000,205.000 155.000,185.000"/><polyline class="curve" points="155.000,185.000 230.000,205.000 250.000,245.000"/><polyline class="curve" points="290.000,155.000 330.000,205.000 352.000,185.000"/><circle class="open" cx="155.000" cy="185.000" r="4.60"/><circle class="open" cx="290.000" cy="155.000" r="4.60"/><line class="guide" x1="155.000" y1="185.000" x2="155.000" y2="245.000"/><line class="guide" x1="290.000" y1="155.000" x2="290.000" y2="245.000"/><text class="label" x="147.000" y="269.000">1</text><text class="label" x="282.000" y="269.000">4</text><text class="math" x="354.000" y="250.000">x</text><text class="math" x="116.000" y="90.000">y</text></g></g>
  <g aria-label="calculation"><rect class="panel" x="392" y="65" width="216" height="296" rx="8"/><text class="title" x="410.000" y="92.000">계산</text><text class="math" x="410.000" y="132.000">lim x→1− f(x)=2</text><text class="math" x="410.000" y="166.000">lim x→4+ f(x)=3</text><text class="math" x="410.000" y="200.000">합=2+3=5</text><text class="label" x="410.000" y="234.000">정답: ③</text></g>
  <rect class="panel" x="32" y="382" width="576" height="38" rx="7"/><text class="small" x="50.000" y="406.000">좌극한은 왼쪽에서, 우극한은 오른쪽에서 접근하는 그래프의 높이를 읽는다.</text>
</svg>
