<svg xmlns="http://www.w3.org/2000/svg" width="640" height="430" viewBox="0 0 640 430" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc">
  <title id="title">23 순천여고 21번 외부점에서 포물선에 그은 두 접선 해설</title>
  <desc id="desc">외부점 (1,−4)와 포물선의 접점 u=4,−2 및 두 접선의 방정식을 표시한다</desc>
  <style>.background{fill:#fff}.axis{stroke:#171717;stroke-width:1.4;fill:none;stroke-linecap:round;stroke-linejoin:round}.curve{stroke:#111;stroke-width:2.1;fill:none;stroke-linecap:round;stroke-linejoin:round}.tangent{stroke:#3f4a5a;stroke-width:1.7;fill:none;stroke-linecap:round;stroke-linejoin:round}.guide{stroke:#777;stroke-width:.95;stroke-dasharray:4 4;fill:none}.point{stroke:#111;stroke-width:1;fill:#111}.panel{fill:#f7f8fa;stroke:#c7cbd1;stroke-width:1}.title{font-family:"Noto Sans KR","Pretendard","Malgun Gothic",sans-serif;font-size:15px;font-weight:700;fill:#111}.label{font-family:"Noto Sans KR","Pretendard","Malgun Gothic",sans-serif;font-size:12px;fill:#222}.small{font-family:"Noto Sans KR","Pretendard","Malgun Gothic",sans-serif;font-size:11px;fill:#333}.math{font-family:"STIX Two Math","Cambria Math","Times New Roman",serif;font-size:13px;fill:#111}</style>
  <defs><marker id="axis-arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L6,3 L0,6 Z" fill="#171717"/></marker></defs>
  <rect class="background" x="0" y="0" width="640" height="430"/><text class="title" x="32" y="28">q21  한 점에서 포물선에 그은 두 접선</text><text class="small" x="32" y="47">접점 u를 변수로 놓고 외부점 조건을 대입한다.</text>
  <g aria-label="tangent diagram"><rect class="panel" x="32" y="65" width="340" height="285" rx="8"/><line class="axis" x1="50" y1="285" x2="350" y2="285" marker-end="url(#axis-arrow)"/><line class="axis" x1="170" y1="325" x2="170" y2="82" marker-end="url(#axis-arrow)"/><path class="curve" d="M65 105 C100 150 125 235 170 250 C215 235 240 150 275 105"/><path class="tangent" d="M95 285 L250 90"/><path class="tangent" d="M80 165 L260 315"/><circle class="point" cx="215" cy="130" r="3.8"/><circle class="point" cx="90" cy="205" r="3.8"/><circle class="point" cx="170" cy="315" r="3.8"/><text class="label" x="218" y="122">u=4</text><text class="label" x="58" y="198">u=−2</text><text class="label" x="176" y="334">S=(1,−4)</text><text class="math" x="242" y="108">y=7x−11</text><text class="math" x="78" y="150">y=−5x+1</text><text class="math" x="340" y="290">x</text><text class="math" x="176" y="90">y</text></g>
  <g aria-label="calculation"><rect class="panel" x="390" y="65" width="218" height="285" rx="8"/><text class="title" x="408" y="92">접점 방정식</text><text class="math" x="408" y="124">y=(2u−1)x−u²+5</text><text class="small" x="408" y="151">S=(1,−4)를 대입하면</text><text class="math" x="408" y="178">u²−2u−8=0</text><text class="math" x="408" y="205">u=4, −2</text><line class="guide" x1="408" y1="219" x2="590" y2="219"/><text class="small" x="408" y="248">u=4: y=7x−11</text><text class="small" x="408" y="275">u=−2: y=−5x+1</text><text class="label" x="408" y="317">두 접선 모두 정답</text></g>
</svg>
