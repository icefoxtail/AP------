  <g aria-label="calculation"><rect class="panel" x="392" y="65" width="216" height="296" rx="8"/><text class="title" x="410.000" y="92.000">계산</text><text class="math" x="410.000" y="132.000">y=(2u−1)x−u²+5</text><text class="math" x="410.000" y="166.000">u²−2u−8=0</text><text class="math" x="410.000" y="200.000">u=4, −2</text><text class="math" x="410.000" y="234.000">u=4: y=7x−11</text><text class="math" x="410.000" y="268.000">u=−2: y=−5x+1</text><text class="label" x="410.000" y="302.000">정답: 두 접선</text></g>
