<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc" data-visual-case="set-2022-pilot" data-fact-hash="818465f3cd7e32323b343163db00cf55faee5b075f75cb249c721136cc6f7830" data-visual-provenance="2026-09-05-set-visual-pilot"><title id="title">문항 16 해설: 64를 포함하는 홀수 크기 부분집합</title><desc id="desc">U={2,3,4,8,16,32,64}에서 Y=Xᶜ와 합·홀짝 조건으로 X의 경우를 세는 상태도</desc>
    <style>
      .text { font-family:"Noto Sans KR","Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif; fill:#172033; }
      .math { font-family:"STIX Two Math","Cambria Math","Times New Roman",serif; fill:#172033; }
      .muted { font-family:"Noto Sans KR","Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif; fill:#56657a; }
      .small { font-family:"Noto Sans KR","Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif; fill:#334155; }
      .strong { font-family:"Noto Sans KR","Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif; fill:#172033; font-weight:700; }
      .math-strong { font-family:"STIX Two Math","Cambria Math","Times New Roman",serif; fill:#172033; font-weight:700; }
    </style>
    <rect width="760" height="430" fill="#f8fafc"/><text x="28" y="38" font-size="22" text-anchor="start" class="text" font-weight="700">Y=Xᶜ로 정한 뒤, 64의 포함 여부를 판정한다</text><text x="28" y="67" font-size="15" text-anchor="start" class="muted">S(X)&gt;S(Y)와 n(X)의 홀짝을 동시에 만족시키는 선택</text><rect x="36" y="95" width="310" height="235" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/><text x="52" y="122" font-size="15" text-anchor="start" class="text" fill="#7c3aed" font-weight="700">전체집합과 합</text><text x="56" y="143" font-size="17" text-anchor="start" class="text" fill="#334155"><tspan x="56" dy="0">U={2,3,4,8,16,32,64}</tspan><tspan x="56" dy="34">S(U)=129</tspan><tspan x="56" dy="34">Y=Xᶜ</tspan><tspan x="56" dy="34">S(X)&gt;64.5</tspan></text><rect x="370" y="95" width="354" height="235" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/><text x="386" y="122" font-size="15" text-anchor="start" class="text" fill="#2563eb" font-weight="700">홀수 원소 수를 만드는 선택</text><rect x="392" y="122" width="290" height="30" rx="15" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/><text x="537" y="142" font-size="14" text-anchor="middle" class="text" fill="#166534" font-weight="700">64 ∈ X  (강제)</text><text x="392" y="184" font-size="16" text-anchor="start" class="small">나머지 {2,3,4,8,16,32}에서</text><text x="392" y="212" font-size="16" text-anchor="start" class="small">짝수 개를 선택하면 n(X)가 홀수</text><text x="392" y="250" font-size="15" text-anchor="start" class="text" fill="#b91c1c">단, 0개 선택은 S(X)=64라 제외</text><text x="392" y="292" font-size="16" text-anchor="start" class="math-strong">C(6,2)+C(6,4)+C(6,6)=15+15+1</text><rect x="392" y="345" width="230" height="30" rx="15" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/><text x="507" y="365" font-size="14" text-anchor="middle" class="text" fill="#1d4ed8" font-weight="700">총 31개</text></svg>