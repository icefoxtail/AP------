<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc" data-visual-case="set-2022-pilot" data-fact-hash="d23f60f29548d76e58327540ae8b0f65302968af37dd5955f33e1bcc2f3ce834" data-visual-provenance="2026-09-05-set-visual-pilot"><title id="title">문항 13 해설: 대칭차집합의 네 영역</title><desc id="desc">U={1,…,9}에서 두 조건으로 A−B와 B−A를 찾아 대칭차집합의 원소 합을 구하는 도식</desc>
    <style>
      .text { font-family:"Noto Sans KR","Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif; fill:#172033; }
      .math { font-family:"STIX Two Math","Cambria Math","Times New Roman",serif; fill:#172033; }
      .muted { font-family:"Noto Sans KR","Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif; fill:#56657a; }
      .small { font-family:"Noto Sans KR","Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif; fill:#334155; }
      .strong { font-family:"Noto Sans KR","Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif; fill:#172033; font-weight:700; }
      .math-strong { font-family:"STIX Two Math","Cambria Math","Times New Roman",serif; fill:#172033; font-weight:700; }
    </style>
    <rect width="760" height="430" fill="#f8fafc"/><text x="28" y="38" font-size="22" text-anchor="start" class="text" font-weight="700">두 여집합 조건에서 대칭차집합을 바로 복원한다</text><text x="28" y="67" font-size="15" text-anchor="start" class="muted">구하는 집합은 (A∪B)∩(A∩B)ᶜ = (A−B)∪(B−A)</text><rect x="36" y="94" width="330" height="230" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/><text x="52" y="121" font-size="15" text-anchor="start" class="text" fill="#7c3aed" font-weight="700">네 영역 판정</text><rect x="52" y="134" width="298" height="42" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.4"/><text x="68" y="161" font-size="15" text-anchor="start" class="text" fill="#991b1b" font-weight="700">A만 = A−B</text><text x="236" y="161" font-size="17" text-anchor="middle" class="text" fill="#991b1b" font-weight="700">{3,4,6}</text><rect x="52" y="184" width="298" height="42" rx="8" fill="#ffedd5" stroke="#d97706" stroke-width="1.4"/><text x="68" y="211" font-size="15" text-anchor="start" class="text" fill="#9a3412" font-weight="700">B만 = B−A</text><text x="236" y="211" font-size="17" text-anchor="middle" class="text" fill="#9a3412" font-weight="700">{1,5,8}</text><rect x="52" y="234" width="298" height="58" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.4"/><text x="68" y="258" font-size="14" text-anchor="start" class="text" fill="#475569"><tspan x="68" dy="0">A∩B와 바깥</tspan><tspan x="68" dy="20">현재 조건에서 구분 불필요: {2,7,9}</tspan></text><rect x="394" y="94" width="330" height="230" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/><text x="410" y="121" font-size="15" text-anchor="start" class="text" fill="#2563eb" font-weight="700">대칭차집합의 합</text><text x="414" y="143" font-size="19" text-anchor="start" class="text" fill="#1d4ed8" font-weight="700"><tspan x="414" dy="0">A△B</tspan><tspan x="414" dy="32">= {1,3,4,5,6,8}</tspan></text><line x1="414" y1="208" x2="704" y2="208" stroke="#e2e8f0" stroke-width="1.4" stroke-linecap="round"/><text x="414" y="246" font-size="20" text-anchor="start" class="math-strong">1+3+4+5+6+8</text><text x="414" y="286" font-size="24" text-anchor="start" class="text" fill="#166534" font-weight="700">= 27</text><text x="36" y="374" font-size="14" text-anchor="start" class="muted">첫째 조건의 여집합은 B−A={1,5,8}, 둘째 조건의 여집합은 A−B={3,4,6}이다.</text></svg>