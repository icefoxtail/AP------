<svg xmlns="http://www.w3.org/2000/svg" width="520" height="340" viewBox="0 0 520 340" role="img" aria-label="q18 해설: 공통각 A를 가진 닮은 두 직각삼각형">
<title>q18 해설: 공통각 A를 가진 닮은 두 직각삼각형</title>
<desc>q18 해설: 공통각 A를 가진 닮은 두 직각삼각형</desc>
<rect x="0" y="0" width="520" height="340" fill="white"/>
<g stroke="#222" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
<polyline points="65,285 65,85 215,85 65,285" fill="none" stroke="#222" stroke-width="2"/>
<polyline points="65,285 65,185 140,185 65,285" fill="none" stroke="#222" stroke-width="2"/>
<line x1="65" y1="105" x2="85" y2="105" stroke="#222" stroke-width="2"/>
<line x1="85" y1="105" x2="85" y2="85" stroke="#222" stroke-width="2"/>
<line x1="65" y1="205" x2="85" y2="205" stroke="#222" stroke-width="2"/>
<line x1="85" y1="205" x2="85" y2="185" stroke="#222" stroke-width="2"/>
<text x="53" y="290" text-anchor="end" font-size="16" font-weight="bold" fill="#111" stroke="none" font-family="sans-serif">A</text>
<text x="55" y="85" text-anchor="end" font-size="16" font-weight="bold" fill="#111" stroke="none" font-family="sans-serif">D</text>
<text x="225" y="85" text-anchor="start" font-size="16" font-weight="bold" fill="#111" stroke="none" font-family="sans-serif">E</text>
<text x="55" y="185" text-anchor="end" font-size="16" font-weight="bold" fill="#111" stroke="none" font-family="sans-serif">B</text>
<text x="150" y="185" text-anchor="start" font-size="16" font-weight="bold" fill="#111" stroke="none" font-family="sans-serif">C</text>
<text x="48" y="237" text-anchor="end" font-size="14" font-weight="normal" fill="#111" stroke="none" font-family="sans-serif">AB=4</text>
<text x="105" y="178" text-anchor="middle" font-size="14" font-weight="normal" fill="#111" stroke="none" font-family="sans-serif">BC=3</text>
<text x="46" y="137" text-anchor="end" font-size="14" font-weight="normal" fill="#111" stroke="none" font-family="sans-serif">BD=4</text>
