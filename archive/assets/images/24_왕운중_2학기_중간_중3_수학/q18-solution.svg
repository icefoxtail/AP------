<text x="370" y="120" text-anchor="middle" font-size="15" font-weight="normal" fill="#111" stroke="none" font-family="sans-serif">작은 삼각형 : 큰 삼각형 = 1 : 2</text>
<text x="370" y="155" text-anchor="middle" font-size="15" font-weight="normal" fill="#111" stroke="none" font-family="sans-serif">AE=10, AD=8</text>
<text x="370" y="195" text-anchor="middle" font-size="15" font-weight="normal" fill="#111" stroke="none" font-family="sans-serif">cos E=3/5, cos A=4/5</text>
