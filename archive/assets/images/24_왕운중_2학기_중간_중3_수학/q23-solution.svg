<svg xmlns="http://www.w3.org/2000/svg" width="520" height="340" viewBox="0 0 520 340" role="img" aria-label="q23 해설: 변의 길이 2, 3, √13인 직각삼각형">
<title>q23 해설: 변의 길이 2, 3, √13인 직각삼각형</title>
<desc>q23 해설: 변의 길이 2, 3, √13인 직각삼각형</desc>
<rect x="0" y="0" width="520" height="340" fill="white"/>
<g stroke="#222" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
<polyline points="90,70 90,250 210,250 90,70" fill="none" stroke="#222" stroke-width="2"/>
<line x1="90" y1="230" x2="110" y2="230" stroke="#222" stroke-width="2"/>
<line x1="110" y1="230" x2="110" y2="250" stroke="#222" stroke-width="2"/>
<text x="78" y="70" text-anchor="end" font-size="16" font-weight="bold" fill="#111" stroke="none" font-family="sans-serif">A</text>
<text x="78" y="255" text-anchor="end" font-size="16" font-weight="bold" fill="#111" stroke="none" font-family="sans-serif">B</text>
<text x="222" y="255" text-anchor="start" font-size="16" font-weight="bold" fill="#111" stroke="none" font-family="sans-serif">C</text>
<text x="65" y="165" text-anchor="end" font-size="16" font-weight="normal" fill="#111" stroke="none" font-family="sans-serif">AB=3</text>
<text x="150" y="275" text-anchor="middle" font-size="16" font-weight="normal" fill="#111" stroke="none" font-family="sans-serif">BC=2</text>
<text x="160" y="150" text-anchor="middle" font-size="16" font-weight="normal" fill="#111" stroke="none" font-family="sans-serif">AC=√13</text>
<text x="380" y="115" text-anchor="middle" font-size="16" font-weight="normal" fill="#111" stroke="none" font-family="sans-serif">sin A = 2/√13</text>
<text x="380" y="150" text-anchor="middle" font-size="16" font-weight="normal" fill="#111" stroke="none" font-family="sans-serif">cos A = 3/√13</text>
<text x="380" y="185" text-anchor="middle" font-size="16" font-weight="normal" fill="#111" stroke="none" font-family="sans-serif">tan A = 2/3</text>
</g>
</svg>