<svg xmlns="http://www.w3.org/2000/svg" width="520" height="340" viewBox="0 0 520 340" role="img" aria-label="q17 해설: 3-4-5 직각삼각형에서 코사인 구하기">
<title>q17 해설: 3-4-5 직각삼각형에서 코사인 구하기</title>
<desc>q17 해설: 3-4-5 직각삼각형에서 코사인 구하기</desc>
<rect x="0" y="0" width="520" height="340" fill="white"/>
<g stroke="#222" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
<polyline points="90,55 90,275 255,275 90,55" fill="none" stroke="#222" stroke-width="2"/>
<line x1="90" y1="255" x2="110" y2="255" stroke="#222" stroke-width="2"/>
<line x1="110" y1="255" x2="110" y2="275" stroke="#222" stroke-width="2"/>
<text x="78" y="55" text-anchor="end" font-size="16" font-weight="bold" fill="#111" stroke="none" font-family="sans-serif">A</text>
<text x="78" y="280" text-anchor="end" font-size="16" font-weight="bold" fill="#111" stroke="none" font-family="sans-serif">B</text>
<text x="267" y="280" text-anchor="start" font-size="16" font-weight="bold" fill="#111" stroke="none" font-family="sans-serif">C</text>
<text x="72" y="170" text-anchor="middle" font-size="16" font-weight="normal" fill="#111" stroke="none" font-family="sans-serif">4</text>
<text x="173" y="297" text-anchor="middle" font-size="16" font-weight="normal" fill="#111" stroke="none" font-family="sans-serif">3</text>
<text x="180" y="155" text-anchor="middle" font-size="16" font-weight="normal" fill="#111" stroke="none" font-family="sans-serif">5</text>
<text x="380" y="115" text-anchor="middle" font-size="17" font-weight="normal" fill="#111" stroke="none" font-family="sans-serif">sin A = 3/5</text>
<text x="380" y="155" text-anchor="middle" font-size="17" font-weight="normal" fill="#111" stroke="none" font-family="sans-serif">cos A = 4/5</text>
</g>
</svg>