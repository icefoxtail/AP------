<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 747 560" width="747" height="560" role="img" aria-labelledby="title desc"><title id="title">두 묶음으로 표시한 같은 길이</title><desc id="desc">BA와 BC는 한 쌍의 같은 길이이다. BD, DC, CA는 다른 묶음으로 같은 길이이다. 같은 묶음에 같은 색과 눈금을 붙였다.</desc><rect width="747" height="560" fill="white" /><line x1="137.0154" y1="239.7643" x2="609.9846" y2="130.5708" stroke="#202020" stroke-width="5.3" stroke-linecap="round" /><line x1="137.0154" y1="239.7643" x2="583.8379" y2="429.4292" stroke="#202020" stroke-width="5.3" stroke-linecap="round" /><line x1="429.3264" y1="172.2790" x2="583.8379" y2="429.4292" stroke="#227365" stroke-width="5.3" stroke-linecap="round" /><line x1="583.8379" y1="429.4292" x2="609.9846" y2="130.5708" stroke="#227365" stroke-width="5.3" stroke-linecap="round" /><line x1="380.1494" y1="190.8166" x2="377.0001" y2="177.1754" stroke="#202020" stroke-width="2.5" stroke-linecap="round" /><line x1="388.9187" y1="188.7920" x2="385.7694" y2="175.1508" stroke="#202020" stroke-width="2.5" stroke-linecap="round" /><line x1="362.4857" y1="343.0753" x2="367.9559" y2="330.1882" stroke="#202020" stroke-width="2.5" stroke-linecap="round" /><line x1="370.7702" y1="346.5919" x2="376.2405" y2="333.7048" stroke="#202020" stroke-width="2.5" stroke-linecap="round" /><line x1="290.5918" y1="211.4926" x2="287.4425" y2="197.8514" stroke="#227365" stroke-width="2.5" stroke-linecap="round" /><line x1="503.6722" y1="309.6024" x2="515.6725" y2="302.3918" stroke="#227365" stroke-width="2.5" stroke-linecap="round" /><line x1="604.4075" y1="274.6329" x2="590.4608" y2="273.4127" stroke="#227365" stroke-width="2.5" stroke-linecap="round" /><circle cx="609.9845823664422" cy="130.57079528623817" r="4.9" fill="#28364b" /><text x="628.9846" y="111.5708" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">A</text><circle cx="137.01541763355783" cy="239.76433080628763" r="4.9" fill="#28364b" /><text x="114.