<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 749 705" width="749" height="705" role="img" aria-labelledby="title desc"><title id="title">대각선으로 접고 나서 생긴 점 P와 Q</title><desc id="desc">직사각형 ABCD의 BC는 16 cm, CD는 12 cm, 대각선 BD는 20 cm이다. BD를 접는 선으로 그림을 접은 뒤 B에서 E로 향하는 선이 AD와 P에서 만난다. P에서 BD에 내린 수선의 발은 Q이다.</desc><rect width="749" height="705" fill="white" /><line x1="115.9000" y1="211.5560" x2="115.9000" y2="591.9560" stroke="#21639a" stroke-width="5.4" stroke-linecap="round" /><line x1="115.9000" y1="211.5560" x2="226.8500" y2="211.5560" stroke="#21639a" stroke-width="5.3" stroke-linecap="round" /><line x1="226.8500" y1="211.5560" x2="623.1000" y2="211.5560" stroke="#687889" stroke-width="4.0" stroke-linecap="round" stroke-dasharray="10 6" /><line x1="115.9000" y1="591.9560" x2="623.1000" y2="591.9560" stroke="#687889" stroke-width="4.0" stroke-linecap="round" stroke-dasharray="10 6" /><line x1="623.1000" y1="591.9560" x2="623.1000" y2="211.5560" stroke="#687889" stroke-width="4.0" stroke-linecap="round" stroke-dasharray="10 6" /><line x1="115.9000" y1="591.9560" x2="257.9160" y2="105.0440" stroke="#227365" stroke-width="5.35" stroke-linecap="round" /><line x1="257.9160" y1="105.0440" x2="623.1000" y2="211.5560" stroke="#227365" stroke-width="5.35" stroke-linecap="round" /><line x1="115.9000" y1="591.9560" x2="623.1000" y2="211.5560" stroke="#774698" stroke-width="5.25" stroke-linecap="round" /><line x1="226.8500" y1="211.5560" x2="369.5000" y2="401.7560" stroke="#a34c1f" stroke-width="5.25" stroke-linecap="round" /><line x1="356.3000" y1="384.1560" x2="373.9000" y2="370.9560" stroke="#586574" stroke-width="1.8" stroke-linecap="round" /><line x1="373.9000" y1="370.9560" x2="387.1000" y2="388.5560" stroke="#586574" stroke-width="1.8" stroke-linecap="round" /><line x1="115.9000" y1="633.9560" x2="623.1000" y2="633.9560" stroke="#21639a" stroke-width="1.7" stroke-linecap="round" /><line x1="115.9000" y1="628.4560" x2="115.9000" y2="639.4560" stroke="#21639a" stroke-