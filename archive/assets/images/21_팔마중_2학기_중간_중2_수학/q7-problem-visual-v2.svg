<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 748 698" width="748" height="698" role="img" aria-labelledby="title desc"><title id="title">원주각 x와 외심에서 본 y</title><desc id="desc">O는 외심이다. B의 ABO는 20°, C의 ACO는 30°이며, A의 BAC에 x, O의 BOC에 y를 표시했다. A, B, C가 같은 원 위에 있다.</desc><rect width="748" height="698" fill="white" /><circle cx="374.0" cy="343.0" r="273.48" fill="none" stroke="#21639a" stroke-width="4.6" /><line x1="421.4893" y1="73.6748" x2="164.5022" y2="518.7896" stroke="#21639a" stroke-width="5.15" stroke-linecap="round" /><line x1="164.5022" y1="518.7896" x2="583.4978" y2="518.7896" stroke="#21639a" stroke-width="5.15" stroke-linecap="round" /><line x1="583.4978" y1="518.7896" x2="421.4893" y2="73.6748" stroke="#21639a" stroke-width="5.15" stroke-linecap="round" /><line x1="164.5022" y1="518.7896" x2="374.0000" y2="343.0000" stroke="#227365" stroke-width="5.25" stroke-linecap="round" /><line x1="583.4978" y1="518.7896" x2="374.0000" y2="343.0000" stroke="#227365" stroke-width="5.25" stroke-linecap="round" /><path d="M 215.0611 476.3656 A 66 66 0 0 0 197.5022 461.6319" stroke="#a34c1f" stroke-width="2.25" fill="none" /><text x="240.9939" y="435.6303" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#a34c1f" text-anchor="middle">20°</text><path d="M 562.6346 461.4683 A 61 61 0 0 0 536.7691 479.5795" stroke="#a34c1f" stroke-width="2.25" fill="none" /><text x="518.6837" y="434.2254" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#a34c1f" text-anchor="middle">30°</text><path d="M 392.9893 123.0382 A 57 57 0 0 0 440.9845 127.2373" stroke="#774698" stroke-width="2.25" fill="none" /><text x="411.9022" y="191.2562" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#774698" text-anchor="middle">x</text><path d="M 333.3996 377.0677 A 53 53 0 0 0 414.6004 377.0677" stroke="#774698" stroke-width="2.25" fill="none" /><text x="374.0000" y="45