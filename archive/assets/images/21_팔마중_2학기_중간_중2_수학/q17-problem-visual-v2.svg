<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 748 625" width="748" height="625" role="img" aria-labelledby="title desc"><title id="title">크기가 다른 닮은 두 원뿔</title><desc id="desc">큰 원뿔의 밑면 넓이는 25π cm²이고 작은 원뿔의 높이는 12 cm이다. 서로 대응하는 꼭짓점과 밑면 중심을 세로 점선으로 이었다.</desc><rect width="748" height="625" fill="white" /><line x1="206.0000" y1="168.0000" x2="71.0000" y2="414.0000" stroke="#202020" stroke-width="5.55" stroke-linecap="round" /><line x1="206.0000" y1="168.0000" x2="341.0000" y2="414.0000" stroke="#202020" stroke-width="5.55" stroke-linecap="round" /><path d="M 71 414 A 135 33 0 0 0 341 414" fill="none" stroke="#202020" stroke-width="5.4" /><path d="M 71 414 A 135 33 0 0 1 341 414" fill="none" stroke="#202020" stroke-width="3.15" stroke-dasharray="9 7" /><line x1="206.0000" y1="168.0000" x2="206.0000" y2="414.0000" stroke="#202020" stroke-width="3.3" stroke-linecap="round" stroke-dasharray="9 6" /><circle cx="206" cy="414" r="5.2" fill="#293b4b" /><text x="206.0000" y="500.0000" font-size="36" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#202020" text-anchor="middle">25π cm²</text><line x1="206.0000" y1="465.0000" x2="206.0000" y2="432.0000" stroke="#202020" stroke-width="1.8" stroke-linecap="round" /><line x1="565.0000" y1="217.2000" x2="457.0000" y2="414.0000" stroke="#227365" stroke-width="5.55" stroke-linecap="round" /><line x1="565.0000" y1="217.2000" x2="673.0000" y2="414.0000" stroke="#227365" stroke-width="5.55" stroke-linecap="round" /><path d="M 457 414 A 108 26.4 0 0 0 673 414" fill="none" stroke="#227365" stroke-width="5.4" /><path d="M 457 414 A 108 26.4 0 0 1 673 414" fill="none" stroke="#227365" stroke-width="3.15" stroke-dasharray="9 7" /><line x1="565.0000" y1="217.2000" x2="565.0000" y2="414.0000" stroke="#227365" stroke-width="3.3" stroke-linecap="round" stroke-dasharray="9 6" /><circle cx="565" cy="414" r="5.2" fill="#293b4b" /><text x="678.0000" y="315.6000" font-size="34" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#227365" text-anchor="middle">12 cm</text><line x1="630.0000" y1="306.6000" x2="567.0000" y2="306.6000" stroke="#227365" stroke-width="1.8" stroke-linecap="round" /></svg>
