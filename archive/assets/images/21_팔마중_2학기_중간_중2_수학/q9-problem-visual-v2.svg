<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 745 697" width="745" height="697" role="img" aria-labelledby="title desc"><title id="title">외접원에서 내접원을 제외한 색칠 영역</title><desc id="desc">직각삼각형 ABC의 외접원을 옅게 칠하고, 안에 있는 내접원은 흰색이다. 내심 I와 B의 직각을 표시했다.</desc><rect width="745" height="697" fill="white" /><circle cx="372.5" cy="346.5" r="270" fill="#e2f1eb" stroke="#202020" stroke-width="4.75" /><circle cx="264.5" cy="400.5" r="108" fill="white" stroke="#227365" stroke-width="4.75" /><line x1="156.5000" y1="184.5000" x2="156.5000" y2="508.5000" stroke="#202020" stroke-width="4.55" stroke-linecap="round" /><line x1="156.5000" y1="508.5000" x2="588.5000" y2="508.5000" stroke="#202020" stroke-width="4.55" stroke-linecap="round" /><line x1="588.5000" y1="508.5000" x2="156.5000" y2="184.5000" stroke="#202020" stroke-width="4.55" stroke-linecap="round" /><line x1="156.5000" y1="486.5000" x2="178.5000" y2="486.5000" stroke="#586574" stroke-width="1.8" stroke-linecap="round" /><line x1="178.5000" y1="486.5000" x2="178.5000" y2="508.5000" stroke="#586574" stroke-width="1.8" stroke-linecap="round" /><circle cx="156.5" cy="184.5" r="4.9" fill="#28364b" /><text x="138.5000" y="176.5000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">A</text><circle cx="156.5" cy="508.5" r="4.9" fill="#28364b" /><text x="137.5000" y="531.5000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">B</text><circle cx="588.5" cy="508.5" r="4.9" fill="#28364b" /><text x="609.5000" y="529.5000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">C</text><circle cx="264.5" cy="400.5" r="4.9" fill="#28364b" /><text x="289.5000" y="419.5000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">I</text></svg>
