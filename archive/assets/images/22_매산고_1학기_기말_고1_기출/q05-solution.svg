<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" role="img" aria-labelledby="title desc">
  <title id="title">원의 방정식이 되는 조건</title>
  <desc id="desc">완전제곱식으로 정리한 원의 반지름 제곱이 17/4−2k이고, 실제 원이 되려면 k가 17/8보다 작아야 함을 나타낸 그림</desc>
  <rect width="640" height="300" fill="#fff"/>
  <text x="320" y="28" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="21" font-weight="700" fill="#1e3a5f">원의 조건: (x−½)² + (y−2)² = 17/4 − 2k</text>
  <rect x="18" y="45" width="370" height="240" rx="8" fill="#f8fafc" stroke="#dbe3ef"/>
  <g stroke="#e2e8f0" stroke-width="1">
    <line x1="40" y1="120" x2="366" y2="120"/><line x1="40" y1="155" x2="366" y2="155"/><line x1="40" y1="190" x2="366" y2="190"/><line x1="40" y1="225" x2="366" y2="225"/><line x1="40" y1="260" x2="366" y2="260"/>
    <line x1="65" y1="58" x2="65" y2="275"/><line x1="100" y1="58" x2="100" y2="275"/><line x1="135" y1="58" x2="135" y2="275"/><line x1="170" y1="58" x2="170" y2="275"/><line x1="205" y1="58" x2="205" y2="275"/><line x1="240" y1="58" x2="240" y2="275"/><line x1="275" y1="58" x2="275" y2="275"/><line x1="310" y1="58" x2="310" y2="275"/><line x1="345" y1="58" x2="345" y2="275"/>
  </g>
  <line x1="38" y1="225" x2="370" y2="225" stroke="#0f172a" stroke-width="1.5"/><line x1="170" y1="58" x2="170" y2="278" stroke="#0f172a" stroke-width="1.5"/>
  <text x="360" y="219" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14">x</text><text x="177" y="70" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14">y</text>
  <circle cx="187.5" cy="155" r="52.5" fill="#dbeafe" fill-opacity=".7" stroke="#2563eb" stroke-width="2.6"/>
  <circle cx="187.5" cy="155" r="4.5" fill="#1d4ed8"/>
  <text x="195" y="149" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14" font-weight="700">C(½,2)</text>
  <text x="98" y="82" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14" fill="#1d4ed8">예: k=1이면 r=3/2</text>
  <text x="98" y="276" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="13" fill="#475569">r²&gt;0인 경우에만 좌표평면의 원이 된다.</text>
  <rect x="407" y="45" width="215" height="240" rx="8" fill="#f8fafc" stroke="#dbe3ef"/>
  <text x="424" y="78" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="17" font-weight="700" fill="#334155">반지름 조건</text>
  <text x="424" y="111" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="15">r² = 17/4 − 2k</text>
  <text x="424" y="143" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="15">원 ⇔ r² &gt; 0</text>
  <text x="424" y="175" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="15">17/4 − 2k &gt; 0</text>
  <text x="424" y="207" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="16" font-weight="700" fill="#047857">⇔ k &lt; 17/8</text>
  <text x="424" y="239" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="13">k=17/8: r=0인 한 점</text>
  <text x="424" y="265" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="13">k&gt;17/8: 실수인 원 없음</text>
</svg>
