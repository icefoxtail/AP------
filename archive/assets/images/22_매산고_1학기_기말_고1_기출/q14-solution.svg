<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" role="img" aria-labelledby="title desc">
  <title id="title">두 접점이 만드는 직선</title>
  <desc id="desc">원 x²+y²=25에 외부점 P(5,20/3)에서 그은 두 접선의 접점 Q,R과 두 접점을 지나는 직선 3x+4y=15를 나타낸 그림</desc>
  <rect width="640" height="300" fill="#fff"/>
  <text x="320" y="28" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="21" font-weight="700" fill="#1e3a5f">두 접점 Q, R을 지나는 직선</text>
  <rect x="18" y="45" width="370" height="240" rx="8" fill="#f8fafc" stroke="#dbe3ef"/>
  <g stroke="#e2e8f0" stroke-width="1">
    <line x1="35" y1="95" x2="365" y2="95"/><line x1="35" y1="142" x2="365" y2="142"/><line x1="35" y1="190" x2="365" y2="190"/><line x1="35" y1="238" x2="365" y2="238"/>
    <line x1="59" y1="55" x2="59" y2="275"/><line x1="97" y1="55" x2="97" y2="275"/><line x1="135" y1="55" x2="135" y2="275"/><line x1="173" y1="55" x2="173" y2="275"/><line x1="211" y1="55" x2="211" y2="275"/><line x1="249" y1="55" x2="249" y2="275"/><line x1="287" y1="55" x2="287" y2="275"/><line x1="325" y1="55" x2="325" y2="275"/>
  </g>
  <line x1="35" y1="190" x2="365" y2="190" stroke="#0f172a" stroke-width="1.5"/><line x1="155" y1="55" x2="155" y2="275" stroke="#0f172a" stroke-width="1.5"/>
  <text x="357" y="184" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14">x</text><text x="162" y="67" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14">y</text>
  <circle cx="155" cy="190" r="95" fill="#dbeafe" fill-opacity=".58" stroke="#2563eb" stroke-width="2.6"/>
  <line x1="250" y1="63.333" x2="128.4" y2="98.8" stroke="#0f766e" stroke-width="2.4"/>
  <line x1="250" y1="63.333" x2="250" y2="190" stroke="#0f766e" stroke-width="2.4"/>
  <line x1="155" y1="190" x2="128.4" y2="98.8" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 4"/>
  <line x1="155" y1="190" x2="250" y2="190" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 4"/>
  <line x1="128.4" y1="98.8" x2="250" y2="190" stroke="#047857" stroke-width="2.8"/>
  <circle cx="250" cy="63.333" r="4.5" fill="#f97316"/><circle cx="128.4" cy="98.8" r="4.2" fill="#047857"/><circle cx="250" cy="190" r="4.2" fill="#047857"/><circle cx="155" cy="190" r="4.2" fill="#1d4ed8"/>
  <text x="258" y="57" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14" font-weight="700">P(5,20/3)</text>
  <text x="87" y="91" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14" font-weight="700">Q</text>
  <text x="258" y="185" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14" font-weight="700">R</text>
  <text x="163" y="208" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14" font-weight="700">O</text>
  <text x="91" y="126" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="13" fill="#047857">QR</text>
  <rect x="407" y="45" width="215" height="240" rx="8" fill="#f8fafc" stroke="#dbe3ef"/>
  <text x="424" y="78" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="17" font-weight="700" fill="#334155">접점의 공통 조건</text>
  <text x="424" y="111" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14">Q,R=(x,y)라 하면</text>
  <text x="424" y="141" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14">x²+y²=25</text>
  <text x="424" y="171" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14">5x+20/3 y=25</text>
  <text x="424" y="201" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="15" fill="#047857">⇔ 3x+4y=15</text>
  <text x="424" y="233" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14">a=3, b=4, c=−15</text>
  <text x="424" y="265" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="16" font-weight="700" fill="#047857">a+b+c=−8</text>
</svg>
