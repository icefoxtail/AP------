<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" role="img" aria-labelledby="title desc" data-scale-policy="SCHEMATIC_ALLOWED">
  <title id="title">두 원을 동시에 만나는 직선의 기울기</title>
  <desc id="desc">중심 (0,0), (4,1), 반지름 1인 두 원과 두 경계 직선의 기울기 k 최솟값과 최댓값을 나타낸 그림</desc>
  <rect width="640" height="300" fill="#fff"/>
  <text x="320" y="28" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="21" font-weight="700" fill="#1e3a5f">두 원을 동시에 가르는 직선의 기울기 범위</text>
  <rect x="18" y="45" width="370" height="240" rx="8" fill="#f8fafc" stroke="#dbe3ef"/>
  <g stroke="#e2e8f0" stroke-width="1">
    <line x1="40" y1="92" x2="366" y2="92"/><line x1="40" y1="124" x2="366" y2="124"/><line x1="40" y1="156" x2="366" y2="156"/><line x1="40" y1="188" x2="366" y2="188"/><line x1="40" y1="220" x2="366" y2="220"/><line x1="40" y1="252" x2="366" y2="252"/>
    <line x1="48" y1="58" x2="48" y2="275"/><line x1="80" y1="58" x2="80" y2="275"/><line x1="112" y1="58" x2="112" y2="275"/><line x1="144" y1="58" x2="144" y2="275"/><line x1="176" y1="58" x2="176" y2="275"/><line x1="208" y1="58" x2="208" y2="275"/><line x1="240" y1="58" x2="240" y2="275"/><line x1="272" y1="58" x2="272" y2="275"/><line x1="304" y1="58" x2="304" y2="275"/><line x1="336" y1="58" x2="336" y2="275"/>
  </g>
  <line x1="38" y1="220" x2="368" y2="220" stroke="#0f172a" stroke-width="1.5"/><line x1="80" y1="58" x2="80" y2="278" stroke="#0f172a" stroke-width="1.5"/>
  <text x="360" y="214" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14">x</text><text x="87" y="70" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14">y</text>
  <circle cx="80" cy="220" r="32" fill="#dbeafe" fill-opacity=".75" stroke="#2563eb" stroke-width="2.5"/>
  <circle cx="208" cy="188" r="32" fill="#ffedd5" fill-opacity=".75" stroke="#f97316" stroke-width="2.5"/>
  <line x1="64" y1="182.593" x2="256" y2="233.970" stroke="#7c3aed" stroke-width="2.5"/>
  <line x1="64" y1="278.741" x2="256" y2="99.363" stroke="#0f766e" stroke-width="2.5"/>
  <circle cx="80" cy="220" r="4.2" fill="#1d4ed8"/><circle cx="208" cy="188" r="4.2" fill="#c2410c"/>
  <text x="88" y="244" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="13" fill="#1d4ed8">C₁(0,0)</text>
  <text x="216" y="181" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="13" fill="#c2410c">C₂(4,1)</text>
  <text x="112" y="177" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="13" fill="#6d28d9">k 최솟값</text>
  <text x="218" y="105" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="13" fill="#047857">k 최댓값</text>
  <text x="101" y="274" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="12" fill="#475569">경계에서는 두 원에 접한다.</text>
  <rect x="407" y="45" width="215" height="240" rx="8" fill="#f8fafc" stroke="#dbe3ef"/>
  <text x="424" y="78" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="17" font-weight="700" fill="#334155">기울기 조건</text>
  <text x="424" y="111" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14">직선: y=kx+n</text>
  <text x="424" y="141" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14">|4k−1| ≤ 2√(k²+1)</text>
  <text x="424" y="171" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14">12k²−8k−3 ≤ 0</text>
  <text x="424" y="203" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="13">kmin=(2−√13)/6</text>
  <text x="424" y="231" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="13">kmax=(2+√13)/6</text>
  <text x="424" y="265" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="16" font-weight="700" fill="#047857">곱 = −1/4</text>
</svg>
