<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img">
<title>내분·외분 넓이비 · 22 매산고 20번</title><desc>같은 꼭짓점 A에서 내분 삼각형과 외분 삼각형의 두 변 길이를 비교</desc>
<style>
.bg{fill:#ffffff}.panel{fill:#ffffff;stroke:#cbd5e1;stroke-width:1.2}.side{fill:#f8fafc;stroke:#dbe3ef;stroke-width:1.2}
.title{font:700 19px Arial,'Malgun Gothic','Noto Sans KR',sans-serif;fill:#0f172a}.subtitle{font:12px Arial,'Malgun Gothic','Noto Sans KR',sans-serif;fill:#475569}
.axis{stroke:#334155;stroke-width:1.5}.grid{stroke:#e5e7eb;stroke-width:.8}.shape{stroke:#2563eb;stroke-width:2.4;fill:none}.shape2{stroke:#d97706;stroke-width:2.2;fill:none}.guide{stroke:#64748b;stroke-width:1.5;stroke-dasharray:5 4;fill:none}.point{fill:#111827;stroke:#fff;stroke-width:1.5}.point2{fill:#b91c1c;stroke:#fff;stroke-width:1.5}
.label{font:600 12px Arial,'Malgun Gothic','Noto Sans KR',sans-serif;fill:#111827}.small{font:11px Arial,'Malgun Gothic','Noto Sans KR',sans-serif;fill:#334155}.sidehead{font:700 14px Arial,'Malgun Gothic','Noto Sans KR',sans-serif;fill:#0f172a}.sidebody{font:11.5px Arial,'Malgun Gothic','Noto Sans KR',sans-serif;fill:#334155}
.areaA{fill:#2563eb;fill-opacity:.10;stroke:#2563eb;stroke-width:2}.areaB{fill:#d97706;fill-opacity:.12;stroke:#d97706;stroke-width:2}.areaC{fill:#0f766e;fill-opacity:.10;stroke:#0f766e;stroke-width:2}.tick{stroke:#111827;stroke-width:1.7}.right{stroke:#111827;stroke-width:1.7;fill:none}.arc{stroke:#7c3aed;stroke-width:1.8;fill:none}.dim{stroke:#7c3aed;stroke-width:1.6;fill:none}.ghost{stroke:#94a3b8;stroke-width:1.3;fill:none;stroke-dasharray:4 4}
</style>
<rect class="bg" width="720" height="420"/>
<text x="24" y="31" class="title">내분·외분 넓이비 · 22 매산고 20번</text>
<text x="24" y="52" class="subtitle">같은 꼭짓점 A에서 내분 삼각형과 외분 삼각형의 두 변 길이를 비교</text>
<rect x="24" y="70" width="470" height="320" rx="10" class="panel"/>
<rect x="510" y="70" width="186" height="320" rx="10" class="side"/>
<line x1="145.5" y1="305.0" x2="424.0" y2="305.0" class="guide"/>
<line x1="230.0" y1="305.0" x2="347.7" y2="82.5" class="guide"/>
<!-- outer triangle A P' Q' -->
<polygon points="230,305 145.5,305.0 347.7,82.5" class="areaB"/>
<polygon points="230,305 275.2,305.0 292.9,186.1" class="areaA"/>
<line x1="230" y1="305" x2="424" y2="305" class="shape"/><line x1="230" y1="305" x2="312" y2="150" class="shape"/>
<circle cx="230.0" cy="305.0" r="4.3" class="point"/><text x="238.0" y="323.0" class="label">A</text>
<circle cx="424.0" cy="305.0" r="4.3" class="point"/><text x="432.0" y="323.0" class="label">B</text>
<circle cx="312.0" cy="150.0" r="4.3" class="point"/><text x="320.0" y="142.0" class="label">C</text>
<circle cx="275.2" cy="305.0" r="4.3" class="point2"/><text x="283.2" y="297.0" class="label">P</text>
<circle cx="292.9" cy="186.1" r="4.3" class="point2"/><text x="300.9" y="178.1" class="label">Q</text>
<circle cx="145.5" cy="305.0" r="4.3" class="point2"/><text x="123.5" y="323.0" class="label">P′</text>
<circle cx="347.7" cy="82.5" r="4.3" class="point2"/><text x="355.7" y="74.5" class="label">Q′</text>
<text x="275" y="329" class="small">AP:PB = 1:k</text>
<text x="278" y="214" class="small">CQ:QA = 1:k</text>
<text x="72" y="329" class="small">AP′:P′B = 1:k</text>
<text x="340" y="96" class="small">CQ′:Q′A = 1:k</text>
<text x="245" y="267" class="label">S₁</text><text x="188" y="205" class="label">S₂</text>
<text x="526" y="98" class="sidehead">해설 핵심</text>
<text x="526" y="124" class="sidebody">AP=AB/(k+1)</text>
<text x="526" y="145" class="sidebody">AQ=k·AC/(k+1)</text>
<text x="526" y="166" class="sidebody">AP′=AB/(k−1)</text>
<text x="526" y="187" class="sidebody">AQ′=k·AC/(k−1)</text>
<text x="526" y="208" class="sidebody">S₁/S₂=((k−1)/(k+1))²</text>
<text x="526" y="229" class="sidebody">7S₁=2S₂</text>
<text x="526" y="250" class="sidebody">k=(9+2√14)/5</text>
</svg>