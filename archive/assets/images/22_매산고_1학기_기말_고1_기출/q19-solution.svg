<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320" role="img" aria-labelledby="title desc">
  <title id="title">세 원과 직선의 서로 다른 교점 수</title>
  <desc id="desc">세 원의 반지름 8, 4, 2와 직선 y=mx−8이 만드는 교점 수, 그리고 m=1에서 (8,0)이 중복되는 이유를 나타낸 그림</desc>
  <rect width="640" height="320" fill="#fff"/>
  <text x="320" y="28" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="21" font-weight="700" fill="#1e3a5f">세 원과 직선의 교점 개수</text>
  <rect x="18" y="45" width="370" height="260" rx="8" fill="#f8fafc" stroke="#dbe3ef"/>
  <g stroke="#e2e8f0" stroke-width="1">
    <line x1="45" y1="90" x2="365" y2="90"/><line x1="45" y1="135" x2="365" y2="135"/><line x1="45" y1="180" x2="365" y2="180"/><line x1="45" y1="225" x2="365" y2="225"/><line x1="45" y1="270" x2="365" y2="270"/>
    <line x1="60" y1="55" x2="60" y2="295"/><line x1="105" y1="55" x2="105" y2="295"/><line x1="150" y1="55" x2="150" y2="295"/><line x1="195" y1="55" x2="195" y2="295"/><line x1="240" y1="55" x2="240" y2="295"/><line x1="285" y1="55" x2="285" y2="295"/><line x1="330" y1="55" x2="330" y2="295"/>
  </g>
  <line x1="42" y1="180" x2="367" y2="180" stroke="#0f172a" stroke-width="1.5"/><line x1="180" y1="55" x2="180" y2="298" stroke="#0f172a" stroke-width="1.5"/>
  <text x="358" y="174" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14">x</text><text x="187" y="67" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14">y</text>
  <circle cx="180" cy="180" r="120" fill="#dbeafe" fill-opacity=".25" stroke="#2563eb" stroke-width="2.4"/>
  <circle cx="240" cy="180" r="60" fill="#ffedd5" fill-opacity=".42" stroke="#f97316" stroke-width="2.4"/>
  <circle cx="210" cy="180" r="30" fill="#dcfce7" fill-opacity=".68" stroke="#059669" stroke-width="2.4"/>
  <line x1="180" y1="300" x2="330" y2="120" stroke="#047857" stroke-width="2.7"/>
  <line x1="270" y1="210" x2="315" y2="150" stroke="#dc2626" stroke-width="2.3" stroke-dasharray="7 5"/>
  <circle cx="180" cy="300" r="3.8" fill="#047857"/><circle cx="298.033" cy="158.361" r="3.8" fill="#047857"/><circle cx="230.615" cy="239.261" r="3.8" fill="#047857"/><circle cx="296.598" cy="160.083" r="3.8" fill="#047857"/>
  <circle cx="300" cy="180" r="5" fill="#fff" stroke="#dc2626" stroke-width="2.5"/><line x1="295" y1="175" x2="305" y2="185" stroke="#dc2626" stroke-width="2"/><line x1="305" y1="175" x2="295" y2="185" stroke="#dc2626" stroke-width="2"/>
  <text x="80" y="78" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="13" fill="#1d4ed8">C₁: r=8</text>
  <text x="250" y="132" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="13" fill="#c2410c">C₂: r=4</text>
  <text x="214" y="148" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="13" fill="#047857">C₃: r=2</text>
  <text x="246" y="114" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="12" fill="#047857">예: m=6/5 → 4점</text>
  <text x="252" y="202" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="12" fill="#b91c1c">m=1이면 (8,0) 중복</text>
  <rect x="407" y="45" width="215" height="260" rx="8" fill="#f8fafc" stroke="#dbe3ef"/>
  <text x="424" y="76" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="17" font-weight="700" fill="#334155">교점 개수 조건</text>
  <text x="424" y="107" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="13.5">C₁: 항상 2점</text>
  <text x="424" y="135" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="13.5">C₂: 2점 ⇔ m &gt; 3/4</text>
  <text x="424" y="163" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="13.5">C₃: 0점 ⇔ m &lt; 15/8</text>
  <text x="424" y="195" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14" fill="#047857">4점: 3/4 &lt; m &lt; 15/8</text>
  <text x="424" y="226" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="12.5" fill="#b91c1c">m=1이면 C₁,C₂의</text>
  <text x="424" y="248" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="12.5" fill="#b91c1c">공통점 (8,0)이 겹친다.</text>
  <text x="424" y="278" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="13" font-weight="700" fill="#047857">3/4&lt;m&lt;1 또는 1&lt;m&lt;15/8</text>
</svg>
