<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" width="780" height="420" viewBox="0 0 780 420" preserveAspectRatio="xMidYMid meet" role="img" data-visual-case="hs-r12-002" data-fact-hash="b589844d88d6faa9ba21adaa516d45252762581b7e226a3758c3cbc8955db23d" data-visual-provenance="candidate_builder_python_r12"><title>조건별 판정과 핵심 근거</title><desc>조건별 판정과 핵심 근거</desc><style>.bg{fill:#fff}.head{font-family:'Noto Sans KR','Malgun Gothic',sans-serif;font-size:15px;fill:#111}.cell{font-family:'Noto Sans KR','Malgun Gothic',sans-serif;font-size:13px;fill:#111}.true{fill:#eef5e9;stroke:#536d3f}.false{fill:#fff1f1;stroke:#a55}.box{stroke-width:1}.annotation{font-family:'Noto Sans KR','Malgun Gothic',sans-serif;font-size:13px;fill:#111}</style>
<rect width="780" height="420" class="bg"/>
<text x="48" y="32" class="head">조건별 판정과 핵심 근거</text>
<text x="62" y="62" class="cell">판정</text><text x="145" y="62" class="cell">판정 결과</text><text x="300" y="62" class="cell">근거 구조</text>
<rect x="48" y="78" width="684" height="50" rx="6" class="box true"/>
<text x="62" y="108" class="cell">ㄱ</text><text x="145" y="108" class="cell">참</text><text x="300" y="108" class="cell">(x+1/2)^2+3/4&gt;0</text>
<rect x="48" y="140" width="684" height="50" rx="6" class="box false"/>
<text x="62" y="170" class="cell">ㄴ</text><text x="145" y="170" class="cell">거짓</text><text x="300" y="170" class="cell">x=y=0에서 0&gt;0 불성립</text>
<rect x="48" y="202" width="684" height="50" rx="6" class="box false"/>
<text x="62" y="232" class="cell">ㄷ</text><text x="145" y="232" class="cell">거짓</text><text x="300" y="232" class="cell">(x-y)^2≤0은 x=y일 때만</text>
<rect x="48" y="264" width="684" height="50" rx="6" class="box true"/>
<text x="62" y="294" class="cell">ㄹ</text><text x="145" y="294" class="cell">참</text><text x="300" y="294" class="cell">1/2{(x-y)^2+(y-z)^2+(z-x)^2}≥0</text>
<text x="48" y="390" class="annotation">항상 성립: ㄱ, ㄹ</text>
</svg>
