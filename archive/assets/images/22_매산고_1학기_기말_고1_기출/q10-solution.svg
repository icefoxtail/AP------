<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" role="img" aria-labelledby="title desc" data-scale-policy="SCHEMATIC_ALLOWED">
  <title id="title">두 원의 공통현과 삼각형의 넓이</title>
  <desc id="desc">두 원의 공통현 AB, 원 C2의 중심 O, 공통현에 내린 수선 OH와 삼각형 ABO의 넓이 3√5를 나타낸 그림</desc>
  <rect width="640" height="300" fill="#fff"/>
  <text x="320" y="28" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="21" font-weight="700" fill="#1e3a5f">공통현 AB와 △ABO의 넓이</text>
  <rect x="18" y="45" width="370" height="240" rx="8" fill="#f8fafc" stroke="#dbe3ef"/>
  <g stroke="#e2e8f0" stroke-width="1">
    <line x1="40" y1="125" x2="366" y2="125"/><line x1="40" y1="165" x2="366" y2="165"/><line x1="40" y1="205" x2="366" y2="205"/><line x1="40" y1="245" x2="366" y2="245"/>
    <line x1="60" y1="55" x2="60" y2="275"/><line x1="100" y1="55" x2="100" y2="275"/><line x1="140" y1="55" x2="140" y2="275"/><line x1="180" y1="55" x2="180" y2="275"/><line x1="220" y1="55" x2="220" y2="275"/><line x1="260" y1="55" x2="260" y2="275"/><line x1="300" y1="55" x2="300" y2="275"/><line x1="340" y1="55" x2="340" y2="275"/>
  </g>
  <line x1="40" y1="225" x2="366" y2="225" stroke="#0f172a" stroke-width="1.5"/><line x1="160" y1="55" x2="160" y2="278" stroke="#0f172a" stroke-width="1.5"/>
  <text x="358" y="219" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14">x</text><text x="167" y="67" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14">y</text>
  <circle cx="140" cy="185" r="60" fill="#dbeafe" fill-opacity=".5" stroke="#2563eb" stroke-width="2.5"/>
  <circle cx="220" cy="125" r="74.833" fill="#ffedd5" fill-opacity=".43" stroke="#f97316" stroke-width="2.5"/>
  <line x1="120" y1="91.667" x2="260" y2="278.333" stroke="#047857" stroke-width="2.6"/>
  <line x1="220" y1="125" x2="172" y2="161" stroke="#dc2626" stroke-width="2.2" stroke-dasharray="6 4"/>
  <line x1="140" y1="185" x2="220" y2="125" stroke="#64748b" stroke-width="1.6" stroke-dasharray="4 4"/>
  <circle cx="145.167" cy="125.223" r="4.2" fill="#047857"/><circle cx="198.833" cy="196.777" r="4.2" fill="#047857"/><circle cx="172" cy="161" r="4" fill="#dc2626"/>
  <text x="124" y="117" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14" font-weight="700">A</text>
  <text x="205" y="211" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14" font-weight="700">B</text>
  <text x="176" y="153" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="13" fill="#b91c1c">H</text>
  <text x="228" y="115" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14" font-weight="700">O(3,5)</text>
  <text x="82" y="196" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="13" fill="#1d4ed8">C₁</text>
  <text x="280" y="75" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="13" fill="#c2410c">C₂</text>
  <rect x="407" y="45" width="215" height="240" rx="8" fill="#f8fafc" stroke="#dbe3ef"/>
  <text x="424" y="78" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="17" font-weight="700" fill="#334155">계산 흐름</text>
  <text x="424" y="111" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14">공통현: 4x+3y−12=0</text>
  <text x="424" y="141" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14">O에서 현까지 OH=3</text>
  <text x="424" y="171" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14">AH=√(14−3²)=√5</text>
  <text x="424" y="201" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14">AB=2√5</text>
  <text x="424" y="235" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14">[ABO]=½×AB×OH</text>
  <text x="424" y="265" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="16" font-weight="700" fill="#047857">= 3√5</text>
</svg>
