<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 650" width="730" height="650" role="img" aria-labelledby="title desc"><title id="title">외심과 꼭짓각 안의 24도, 26도</title><desc id="desc">외심 O에 A와 C를 이었다. A에서 BAO각은 24도, CAO각은 26도이다. C에서는 BC와 CO가 이루는 각을 표시했다.</desc><rect width="730" height="650" fill="white" /><line x1="376.0979" y1="56.8959" x2="121.4000" y2="579.1041" stroke="#21639a" stroke-width="4.8" stroke-linecap="round" /><line x1="121.4000" y1="579.1041" x2="608.6000" y2="579.1041" stroke="#21639a" stroke-width="4.8" stroke-linecap="round" /><line x1="608.6000" y1="579.1041" x2="376.0979" y2="56.8959" stroke="#21639a" stroke-width="4.8" stroke-linecap="round" /><line x1="376.0979" y1="56.8959" x2="365.0000" y2="374.6994" stroke="#227365" stroke-width="4.9" stroke-linecap="round" /><line x1="608.6000" y1="579.1041" x2="365.0000" y2="374.6994" stroke="#227365" stroke-width="4.9" stroke-linecap="round" /><path d="M 349.3573 111.7224 A 61 61 0 0 0 373.9691 117.8588" stroke="#a34c1f" stroke-width="2.25" fill="none" /><text x="329.6647" y="232.0541" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#a34c1f" text-anchor="middle">24°</text><path d="M 373.9342 118.8581 A 62 62 0 0 0 401.3156 113.5357" stroke="#21639a" stroke-width="2.25" fill="none" /><text x="414.3906" y="234.8828" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#21639a" text-anchor="middle">26°</text><path d="M 546.6000 579.1041 A 62 62 0 0 1 561.1052 539.2513" stroke="#774698" stroke-width="2.25" fill="none" /><circle cx="376.0979427800758" cy="56.89591473783338" r="4.9" fill="#28364b" /><text x="376.0979" y="36.8959" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">A</text><circle cx="121.39999999999998" cy="579.1040852621666" r="4.9" fill="#28364b" /><text x="103.4000" y="601.1041" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">B</text><circle cx="608.6" cy="579.1040852621666" r="4.9" fill="#28364b" /><text x="626.6000" y="601.1041" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">C</text><circle cx="365.0" cy="374.69941510738084" r="4.9" fill="#28364b" /><text x="344.0000" y="396.6994" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">O</text></svg>
