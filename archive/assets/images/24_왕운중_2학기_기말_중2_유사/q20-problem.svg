<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 384 320" width="384" height="320" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">직각삼각형 ABC에서 각 B의 이등분선 BD와 빗변 BC에 내린 수선 DE, FG, 그리고 BD에 평행한 EF를 나타낸 그림이다. AB는 6, BC는 10으로 주어져 있다.</title><desc id="visual-desc">각 A가 직각인 삼각형 ABC에서 점 B의 각의 이등분선이 변 AC와 점 D에서 만난다. 점 D에서 빗변 BC에 내린 수선의 발 E, 점 E를 지나 BD에 평행한 직선과 AC의 교점 F, 점 F에서 BC에 내린 수선의 발 G가 보인다. AB 옆에 6, BC 옆에 10이 적혀 있다.</desc><rect width="384" height="320" fill="#fff"/><g data-layer="30"><line id="AB" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="49.142857143" y1="267.142857143" x2="49.142857143" y2="52.857142857"/></g><g data-layer="30"><line id="BC" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="49.142857143" y1="52.857142857" x2="334.857142857" y2="267.142857143"/></g><g data-layer="30"><line id="CA" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="334.857142857" y1="267.142857143" x2="49.142857143" y2="267.142857143"/></g><g data-layer="30"><line id="BD" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="49.142857143" y1="52.857142857" x2="156.285714286" y2="267.142857143"/></g><g data-layer="30"><line id="DE" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="156.285714286" y1="267.142857143" x2="220.571428571" y2="181.428571429"/></g><g data-layer="30