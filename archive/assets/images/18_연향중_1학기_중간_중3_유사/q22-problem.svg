<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520" width="640" height="520" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">큰 직사각형이 왼쪽의 정사각형 A, 오른쪽 위의 직사각형 B, 오른쪽 아래의 정사각형 C로 나뉘어 있고 A와 C의 넓이가 적혀 있다.</title><desc id="visual-desc">큰 직사각형의 왼쪽에 정사각형 A가 있고, 오른쪽은 위쪽의 직사각형 B와 아래쪽의 정사각형 C로 나뉘어 있다. 정사각형 A에는 5분의 27 곱하기 x, 정사각형 C에는 16 빼기 x라는 넓이 식이 적혀 있다.</desc><rect width="640" height="520" fill="#fff"/><g data-layer="30"><line id="sPQ" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="62.857142857" y1="447.012987013" x2="436.883116883" y2="447.012987013"/></g><g data-layer="30"><line id="sQM" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="436.883116883" y1="447.012987013" x2="436.883116883" y2="72.987012987"/></g><g data-layer="30"><line id="sMW" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="436.883116883" y1="72.987012987" x2="62.857142857" y2="72.987012987"/></g><g data-layer="30"><line id="sWP" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="62.857142857" y1="72.987012987" x2="62.857142857" y2="447.012987013"/></g><g data-layer="30"><line id="sQR" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="436.883116883" y1="447.012987013" x2="577.142857143" y2="447.012987013"/></g><g data-layer="30"><line id="sRS" data-role="line" stroke="#111" stroke-wid