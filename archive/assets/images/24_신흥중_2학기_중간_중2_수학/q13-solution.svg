<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 330" role="img" aria-label="평행사변형 대각선과 이등변삼각형 AOB">
  <g fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round">
    <polygon points="135,65 430,65 375,260 80,260"/><line x1="135" y1="65" x2="375" y2="260"/><line x1="80" y1="260" x2="430" y2="65"/>
    <circle cx="255" cy="162.5" r="4" fill="currentColor"/>
  </g>
  <g font-family="sans-serif" font-size="18" fill="currentColor">
    <text x="125" y="52">A</text><text x="62" y="282">B</text><text x="382" y="282">C</text><text x="438" y="52">D</text><text x="265" y="157">O</text>
    <text x="155" y="125">OA=OB</text><text x="300" y="123">OA=OC</text><text x="302" y="214">OB=OD</text>
