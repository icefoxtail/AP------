<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 554" width="680" height="554" role="img" aria-labelledby="title desc"><title id="title">꼭짓각과 같은 호를 보는 중심각</title><desc id="desc">삼각형 ABC에서 B의 각은 50도이다. 외심 O에서 A와 C로 선을 이었다. 그 사이의 중심각을 표시했다. 원주각 B와 중심각 AOC를 청록색으로 표시하고 호 AC를 굵게 그렸다.</desc><rect width="680" height="554" fill="white" /><circle cx="340.00000000000006" cy="277.0" r="199.5" fill="none" stroke="#a3b5cb" stroke-width="3.6" /><path d="M 386.572 83.012 A 199.5000 199.5000 0 0 1 522.953 356.550" fill="none" stroke="#217060" stroke-width="5.4" /><polygon points="386.5724,83.0122 157.0465,356.5504 522.9535,356.5504" fill="none" /><line x1="386.5724" y1="83.0122" x2="157.0465" y2="356.5504" stroke="#23649a" stroke-width="4.7" stroke-linecap="round" /><line x1="157.0465" y1="356.5504" x2="522.9535" y2="356.5504" stroke="#23649a" stroke-width="4.7" stroke-linecap="round" /><line x1="522.9535" y1="356.5504" x2="386.5724" y2="83.0122" stroke="#23649a" stroke-width="4.7" stroke-linecap="round" /><line x1="386.5724" y1="83.0122" x2="340.0000" y2="277.0000" stroke="#217060" stroke-width="4.4" stroke-linecap="round" /><line x1="522.9535" y1="356.5504" x2="340.0000" y2="277.0000" stroke="#217060" stroke-width="4.4" stroke-linecap="round" /><path d="M 188.5431 319.0143 A 49 49 0 0 1 206.0465 356.5504" stroke="#217060" stroke-width="2.25" fill="none" /><text x="242.4268" y="324.6696" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#217060" text-anchor="middle">50°</text><path d="M 351.6723 228.3815 A 50 50 0 0 1 385.8530 296.9375" stroke="#217060" stroke-width="2.25" fill="none" /><circle cx="386.5723500892531" cy="83.01220088066356" r="4.9" fill="#28364b" /><text x="386.5724" y="66.0122" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">A</text><circle cx="157.0465151601678" cy="356.5504392505866" r="4.9" fill="#28364b" /><text x="142.0465" y="378.5504