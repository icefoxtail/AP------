<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 704 451" width="704" height="451" role="img" aria-labelledby="title desc"><title id="title">문제에서 조건을 표시할 빈 삼각형</title><desc id="desc">왼쪽 B, 위쪽 A, 오른쪽 C의 윤곽과 이름만 보인다. 표시할 선과 점을 넣을 삼각형 내부가 비어 있다.</desc><rect width="704" height="451" fill="white" /><line x1="352.0000" y1="118.7000" x2="85.0000" y2="332.3000" stroke="#23649a" stroke-width="4.65" stroke-linecap="round" /><line x1="85.0000" y1="332.3000" x2="619.0000" y2="332.3000" stroke="#23649a" stroke-width="4.65" stroke-linecap="round" /><line x1="619.0000" y1="332.3000" x2="352.0000" y2="118.7000" stroke="#23649a" stroke-width="4.65" stroke-linecap="round" /><circle cx="352.0" cy="118.7" r="4.9" fill="#28364b" /><text x="352.0000" y="100.7000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">A</text><circle cx="85.0" cy="332.3" r="4.9" fill="#28364b" /><text x="69.0000" y="355.3000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">B</text><circle cx="619.0" cy="332.3" r="4.9" fill="#28364b" /><text x="636.0000" y="356.3000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">C</text></svg>
