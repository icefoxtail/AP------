<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 487" width="742" height="487" role="img" aria-labelledby="title desc"><title id="title">삼각형 아래에 놓인 외심 O</title><desc id="desc">삼각형 ABC의 외심 O는 밑변 BC 아래에 있다. B에서 위쪽 BA와 BC 사이가 20도이고, BC와 아래쪽 BO 사이가 15도이다.</desc><rect width="742" height="487" fill="white" /><polygon points="540.8297,116.2291 85.0000,282.1375 657.0000,282.1375" fill="none" /><line x1="540.8297" y1="116.2291" x2="85.0000" y2="282.1375" stroke="#23649a" stroke-width="4.7" stroke-linecap="round" /><line x1="85.0000" y1="282.1375" x2="657.0000" y2="282.1375" stroke="#23649a" stroke-width="4.7" stroke-linecap="round" /><line x1="657.0000" y1="282.1375" x2="540.8297" y2="116.2291" stroke="#23649a" stroke-width="4.7" stroke-linecap="round" /><line x1="85.0000" y1="282.1375" x2="371.0000" y2="358.7709" stroke="#217060" stroke-width="4.55" stroke-linecap="round" /><path d="M 174.2708 249.6456 A 95 95 0 0 1 180.0000 282.1375" stroke="#23649a" stroke-width="2.25" fill="none" /><text x="236.6756" y="251.5693" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#23649a" text-anchor="middle">20°</text><path d="M 179.0000 282.1375 A 94 94 0 0 1 175.7970 306.4665" stroke="#217060" stroke-width="2.25" fill="none" /><text x="233.7167" y="312.7164" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#217060" text-anchor="middle">15°</text><circle cx="540.8296663488392" cy="116.22905025911354" r="4.9" fill="#28364b" /><text x="540.8297" y="98.2291" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">A</text><circle cx="85.0" cy="282.13748070558535" r="4.9" fill="#28364b" /><text x="68.0000" y="292.1375" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">B</text><circle cx="657.0" cy="282.13748070558535" r="4.9" fill="#28364b" /><text x="674.0000"