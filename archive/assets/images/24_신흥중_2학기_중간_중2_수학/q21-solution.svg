<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="평행사변형의 대변 길이 성질을 대각선 AC와 ASA 합동으로 설명하는 도형">
  <g fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <polygon points="150,50 480,50 410,245 80,245"/>
    <line x1="150" y1="50" x2="410" y2="245"/>
  </g>
  <g font-family="sans-serif" font-size="18" fill="currentColor">
    <text x="140" y="37">A</text>
    <text x="62" y="268">B</text>
    <text x="418" y="268">C</text>
    <text x="488" y="37">D</text>
    <text x="365" y="100">∠BAC=∠DCA</text>
    <text x="130" y="220">∠BCA=∠DAC</text>
    <text x="320" y="292" text-anchor="middle">AC=CA, ASA → △ABC≡△CDA</text>
    <text x="320" y="322" text-anchor="middle">AB=CD, BC=AD</text>
  </g>
</svg>
