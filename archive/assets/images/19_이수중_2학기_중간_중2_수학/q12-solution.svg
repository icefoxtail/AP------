<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 384 320" width="384" height="320" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">평행사변형의 두 대각선은 서로를 이등분하므로 △ODP≡△OBQ(ASA 합동)이다. 따라서 △OBQ=15cm²이고 △OBC=△OBQ+△OCQ=15+30=45cm²이다. 대각선이 평행사변형을 넓이가 같은 네 삼각형으로 나누므로 □ABCD=4×45=180cm²이다. 답은 ⑤이다.</title><desc id="visual-desc">평행사변형 ABCD의 두 대각선이 점 O에서 만나고 O를 지나는 직선 PQ가 변 AD 위의 P와 변 BC 위의 Q를 잇는다. 삼각형 ODP에 15, 삼각형 OCQ에 30이 적혀 칠해져 있고 OA와 OC, OB와 OD에 각각 같은 눈금이 있다.</desc><rect width="384" height="320" fill="#fff"/><g data-layer="10"><path id="rg0" data-role="region" stroke="none" stroke-width="1.6" fill="#e4e7ec" data-owner-points="D O P" data-mark="region" data-mark-id="rg0" fill-rule="evenodd" d="M192 160 L334.857142857 102.899423926 L268.923076923 102.899423926 L192 160 Z"/></g><g data-layer="10"><path id="rg1" data-role="region" stroke="none" stroke-width="1.6" fill="#e4e7ec" data-owner-points="C O Q" data-mark="region" data-mark-id="rg1" fill-rule="evenodd" d="M192 160 L268.923076923 217.100576074 L115.076923077 217.100576074 L192 160 Z"/></g><g data-layer="30"><line id="AP" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="115.076923077" y1="102.899423926" x2="268.923076923" y2="102.899423926"/></g><g data-layer="30"><line id="PD" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="268.923076923" y1="102.899423926" x