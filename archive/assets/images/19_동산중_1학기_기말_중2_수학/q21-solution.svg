<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 568" width="512" height="568" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="UNEQUAL_UNIT_DECLARED" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">x초 후의 밑변의 길이는 3+2x cm이고 높이는 2cm이므로 넓이는 y=(1/2)×(3+2x)×2=2x+3이다. 넓이가 19cm²이면 2x+3=19에서 x=8이다. 그래프에서 y=19인 점은 P(8,19)이다. 따라서 8초 후이고 답은 ②이다.</title><desc id="visual-desc">y절편 3에서 시작해 오른쪽 위로 올라가는 직선 y=2x+3이 있고 x=8일 때 y=19인 점 P(8,19)가 표시되어 있다.</desc><rect width="512" height="568" fill="#fff"/><g data-layer="30"><line id="x-axis" data-role="axis" stroke="#111" stroke-width="1.2" fill="none" data-axis="x" x1="32" y1="495.6" x2="480" y2="495.6"/></g><g data-layer="30"><line id="y-axis" data-role="axis" stroke="#111" stroke-width="1.2" fill="none" data-axis="y" x1="72" y1="536" x2="72" y2="32"/></g><g data-layer="40"><polyline id="f-piece-1-branch-0" data-role="curve" stroke="#111" stroke-width="2.1" fill="none" data-branch="PIECE_1" points="72,440.4 73.230769231,439.169230769 74.461538462,437.938461538 75.692307692,436.707692308 76.923076923,435.476923077 78.153846154,434.246153846 79.384615385,433.015384615 80.615384615,431.784615385 81.846153846,430.553846154 83.076923077,429.323076923 84.307692308,428.092307692 85.538461538,426.861538462 86.769230769,425.630769231 88,424.4 89.230769231,423.169230769 90.461538462,421.938461538 91.692307692,420.707692308 92.923076923,419.476923077 94.153846154,418.246