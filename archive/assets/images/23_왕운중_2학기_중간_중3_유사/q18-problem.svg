<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 380" width="420" height="380" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">가로의 길이가 10, 세로의 길이가 8인 직사각형 ABCD에서 선분 AF를 접는 선으로 하여 꼭짓점 D가 변 BC 위의 점 E에 오도록 접은 그림이다.</title><desc id="visual-desc">직사각형 ABCD에서 선분 AB 왼쪽에 8, 선분 AD 위쪽에 10이라는 치수가 표시되어 있다. 선분 AF를 따라 접힌 꼭짓점 D가 변 BC 위의 점 E에 놓여 있고, 선분 AD와 선분 DF는 점선으로, 접힌 선분 AE와 선분 EF는 실선으로 나타나 있다.</desc><rect width="420" height="380" fill="#fff"/><g data-layer="30"><line id="sAB" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="62.999994983" y1="74.957629482" x2="62.999994983" y2="320.240652136"/></g><g data-layer="30"><line id="sBE" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="62.999994983" y1="320.240652136" x2="246.962261974" y2="320.240652136"/></g><g data-layer="30"><line id="sEC" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="246.962261974" y1="320.240652136" x2="369.603773301" y2="320.240652136"/></g><g data-layer="30"><line id="sCF" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="369.603773301" y1="320.240652136" x2="369.603773301" y2="228.259518641"/></g><g data-layer="30"><line id="sFD" data-role="line" stroke="#111" stroke-width="1.6" fill="none" stroke-dasharray="6 4" x1="369.603773301" y1="228.259518641" x2="369.603773301" y2="74.957629482"/></g><g data-laye