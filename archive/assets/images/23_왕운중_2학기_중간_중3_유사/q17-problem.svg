<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520" width="640" height="520" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">지호가 깃대로부터 15 m 떨어진 지점에서 깃대의 꼭대기를 올려본 각이 34도인 장면이다. 지호의 눈높이는 1.5 m로 주어져 있다.</title><desc id="visual-desc">지면에 선 사람의 눈높이 1.5 m가 세로 선분으로 표시되고, 눈에서 깃대까지의 수평거리 15 m와 깃대 꼭대기를 올려본 각 34도가 나타나 있다. 깃대는 지면에 수직으로 서 있다.</desc><rect width="640" height="520" fill="#fff"/><g data-layer="12"><polygon id="aA-sector" data-role="angleSector" stroke="none" stroke-width="1.6" fill="#7fa6e8" data-owner-points="B A T" data-mark="angle" data-mark-id="aA" data-mark-index="0" data-mark-count="1" data-mark-side="INNER" fill-opacity="0.32" points="63.820224719,406.02247191 91.820224719,406.02247191 91.801170362,404.989669445 91.744033224,403.958272651 91.64889107,402.929685284 91.515873392,401.905307279 91.345161229,400.88653284 91.136986925,399.874748545 90.891633811,398.871331459 90.609435819,397.877647257 90.290777027,396.895048369 89.936091138,395.924872137 89.545860889,394.968438997 89.120617393,394.027050677 88.660939416,393.101988431 88.167452594,392.194511293 87.640828573,391.305854362 87.081784102,390.437227123"/></g><g data-layer="30"><line id="sGA" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="63.820224719" y1="457.258426966" x2="63.820224719" y2="406.02247191"/></g><g data-layer="30"><line id="sAB" dat