<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 360" width="440" height="360" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">선분 AB의 길이가 6, 선분 BC의 길이가 10이고 각 B가 60도인 사각형 ABCD를 나타낸 그림이다. 꼭짓점 D에서 각 ADC는 직각이고 선분 AD와 선분 DC의 길이가 같다.</title><desc id="visual-desc">사각형 ABCD에서 선분 AB 바깥쪽에 6, 선분 BC 아래쪽에 10이라는 치수가 표시되어 있다. 꼭짓점 B에는 60도 각 표시가 있고, 꼭짓점 D에는 직각 표시가 있다. 선분 AD와 선분 DC에는 길이가 같음을 나타내는 같은 길이 기호가 표시되어 있다.</desc><rect width="440" height="360" fill="#fff"/><g data-layer="30"><line id="sAB" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="152.857142857" y1="107.922142857" x2="52.142857143" y2="282.359285714"/></g><g data-layer="30"><line id="sBC" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="52.142857143" y1="282.359285714" x2="387.857142857" y2="282.359285714"/></g><g data-layer="30"><line id="sCD" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="387.857142857" y1="282.359285714" x2="357.575714286" y2="77.640714286"/></g><g data-layer="30"><line id="sAD" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="152.857142857" y1="107.922142857" x2="357.575714286" y2="77.640714286"/></g><g data-layer="52"><polyline id="dAB-brace" data-role="indicator" stroke="#111" stroke-width="1.0" fill="none" data-mark="dimension" data-mark-id="dAB" data-mark-part="brace" points="41.750628511