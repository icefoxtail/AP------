<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 630" width="742" height="630" role="img" aria-labelledby="title desc"><title id="title">네 평행선에서 대응하는 두 사선의 길이</title><desc id="desc">네 평행선은 위부터 k, l, m, n이다. l에서 두 사선이 만난다. 내려가는 사선에서 위는 12 cm, 중간은 4 cm, l부터 n까지는 y cm이다. 올라가는 사선의 세 구간은 10 cm, x cm, 6 cm이다.</desc><rect width="742" height="630" fill="white" /><line x1="71.0000" y1="142.0000" x2="649.0000" y2="142.0000" stroke="#687889" stroke-width="2.55" stroke-linecap="round" /><text x="679.0000" y="151.0000" font-size="31" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#687889" text-anchor="middle">k</text><line x1="71.0000" y1="292.0000" x2="649.0000" y2="292.0000" stroke="#687889" stroke-width="2.55" stroke-linecap="round" /><text x="679.0000" y="301.0000" font-size="31" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#687889" text-anchor="middle">l</text><line x1="71.0000" y1="342.0000" x2="649.0000" y2="342.0000" stroke="#687889" stroke-width="2.55" stroke-linecap="round" /><text x="679.0000" y="351.0000" font-size="31" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#687889" text-anchor="middle">m</text><line x1="71.0000" y1="432.0000" x2="649.0000" y2="432.0000" stroke="#687889" stroke-width="2.55" stroke-linecap="round" /><text x="679.0000" y="441.0000" font-size="31" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#687889" text-anchor="middle">n</text><line x1="197.6518" y1="107.2000" x2="516.1108" y2="469.7000" stroke="#202020" stroke-width="5.4" stroke-linecap="round" /><line x1="448.7040" y1="107.2000" x2="274.7040" y2="469.7000" stroke="#227365" stroke-width="5.4" stroke-linecap="round" /><text x="211.0000" y="215.0000" font-size="32" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#202020" text-anchor="middle">12 cm</text><text x="482.0000" y="210.0000" font-size="32" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#227365" text-anchor="middle">10 cm</text><text x="283.0000" y="321.0000" font-size="32" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#227365" text-anchor="middle">x cm</text><text x="427.0000" y="319.0000" font-size="32" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#202020" text-anchor="middle">4 cm</text><text x="231.0000" y="400.0000" font-size="32" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#227365" text-anchor="middle">6 cm</text><line x1="463.0000" y1="302.0000" x2="585.9911" y2="442.0000" stroke="#202020" stroke-width="1.75" stroke-linecap="round" /><line x1="458.0000" y1="308.0000" x2="468.0000" y2="296.0000" stroke="#202020" stroke-width="1.75" stroke-linecap="round" /><line x1="580.9911" y1="448.0000" x2="590.9911" y2="436.0000" stroke="#202020" stroke-width="1.75" stroke-linecap="round" /><text x="570.4955" y="386.0000" font-size="32" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#202020" text-anchor="middle">y cm</text><circle cx="228.22382612930363" cy="142" r="4.9" fill="#293b4b" /><circle cx="336.0" cy="342" r="4.9" fill="#293b4b" /><circle cx="292.8" cy="432" r="4.9" fill="#293b4b" /><circle cx="432.0" cy="142" r="4.9" fill="#293b4b" /><circle cx="403.92539129023214" cy="342" r="4.9" fill="#293b4b" /><circle cx="360.0" cy="292" r="4.9" fill="#293b4b" /><circle cx="482.99109561264993" cy="432" r="4.9" fill="#293b4b" /></svg>
