<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 747 718" width="747" height="718" role="img" aria-labelledby="title desc"><title id="title">두 밑변의 길이가 주어진 직각 사다리꼴</title><desc id="desc">윗변 AD의 길이는 9 cm이고 아랫변 BC는 16 cm이다. 오른쪽 두 모서리는 직각이다. A에서 수선을 내려 얻은 직각삼각형 ABH만 옅게 칠했다. 두 다리는 7 cm와 24 cm이다.</desc><rect width="747" height="718" fill="white" /><polygon points="353.1000,114.2000 210.3000,603.8000 353.1000,603.8000" fill="#e2f1eb" /><line x1="353.1000" y1="114.2000" x2="210.3000" y2="603.8000" stroke="#21639a" stroke-width="5.15" stroke-linecap="round" /><line x1="210.3000" y1="603.8000" x2="536.7000" y2="603.8000" stroke="#21639a" stroke-width="5.15" stroke-linecap="round" /><line x1="536.7000" y1="603.8000" x2="536.7000" y2="114.2000" stroke="#21639a" stroke-width="5.15" stroke-linecap="round" /><line x1="536.7000" y1="114.2000" x2="353.1000" y2="114.2000" stroke="#21639a" stroke-width="5.15" stroke-linecap="round" /><line x1="353.1000" y1="114.2000" x2="536.7000" y2="114.2000" stroke="#227365" stroke-width="5.35" stroke-linecap="round" /><line x1="210.3000" y1="603.8000" x2="536.7000" y2="603.8000" stroke="#227365" stroke-width="5.35" stroke-linecap="round" /><line x1="514.7000" y1="114.2000" x2="514.7000" y2="136.2000" stroke="#586574" stroke-width="1.8" stroke-linecap="round" /><line x1="514.7000" y1="136.2000" x2="536.7000" y2="136.2000" stroke="#586574" stroke-width="1.8" stroke-linecap="round" /><line x1="514.7000" y1="603.8000" x2="514.7000" y2="581.8000" stroke="#586574" stroke-width="1.8" stroke-linecap="round" /><line x1="514.7000" y1="581.8000" x2="536.7000" y2="581.8000" stroke="#586574" stroke-width="1.8" stroke-linecap="round" /><line x1="353.1000" y1="74.2000" x2="536.7000" y2="74.2000" stroke="#227365" stroke-width="1.7" stroke-linecap="round" /><line x1="353.1000" y1="68.7000" x2="353.1000" y2="79.7000" stroke="#227365" stroke-width="1.7" stroke-linecap="round" /><line x1="536.7000" y1="68.7000" x2="536.7000" y2="79.7000" stroke="#227365" stroke-w