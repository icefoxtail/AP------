<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 745 642" width="745" height="642" role="img" aria-labelledby="title desc"><title id="title">정사각형에서 반시계 방향으로 이동하는 말</title><desc id="desc">정사각형 그림에서 A는 왼쪽 위, B는 왼쪽 아래, C는 오른쪽 아래, D는 오른쪽 위이다. A에서 반시계 방향으로 B를 향한다. A부터 B를 지나 C까지의 두 구간을 화살표로 표시했다.</desc><rect width="745" height="642" fill="white" /><line x1="157.0000" y1="135.0000" x2="157.0000" y2="511.0000" stroke="#227365" stroke-width="5.4" stroke-linecap="round" /><line x1="157.0000" y1="247.8000" x2="157.0000" y2="363.1600" stroke="#227365" stroke-width="6.15" stroke-linecap="round" /><polygon points="157.0000,383.1600 165.0000,363.1600 149.0000,363.1600" fill="#227365" /><line x1="157.0000" y1="511.0000" x2="533.0000" y2="511.0000" stroke="#227365" stroke-width="5.4" stroke-linecap="round" /><line x1="269.8000" y1="511.0000" x2="385.1600" y2="511.0000" stroke="#227365" stroke-width="6.15" stroke-linecap="round" /><polygon points="405.1600,511.0000 385.1600,503.0000 385.1600,519.0000" fill="#227365" /><line x1="533.0000" y1="511.0000" x2="533.0000" y2="135.0000" stroke="#21639a" stroke-width="5.4" stroke-linecap="round" /><line x1="533.0000" y1="135.0000" x2="157.0000" y2="135.0000" stroke="#21639a" stroke-width="5.4" stroke-linecap="round" /><circle cx="157" cy="135" r="8.8" fill="#227365" /><text x="132.0000" y="122.0000" font-size="34" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#293b4b" text-anchor="middle">A</text><circle cx="157" cy="511" r="5.7" fill="#293b4b" /><text x="134.0000" y="538.0000" font-size="34" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#293b4b" text-anchor="middle">B</text><circle cx="533" cy="511" r="5.7" fill="#293b4b" /><text x="557.0000" y="539.0000" font-size="34" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#293b4b" text-anchor="middle">C</text><circle cx="533" cy="135" r="5.7" fill="#293b4b" /><text x="557.0000" y="122.0000" font-size="34" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#293b4b" text-anchor="middle">D</text><line x1="573.0000" y1="135.0000" x2="573.0000" y2="511.0000" stroke="#21639a" stroke-width="1.9" stroke-linecap="round" /><line x1="567.0000" y1="135.0000" x2="579.0000" y2="135.0000" stroke="#21639a" stroke-width="1.8" stroke-linecap="round" /><line x1="567.0000" y1="511.0000" x2="579.0000" y2="511.0000" stroke="#21639a" stroke-width="1.8" stroke-linecap="round" /><text x="600.0000" y="330.0000" font-size="34" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#21639a" text-anchor="middle">1</text></svg>
