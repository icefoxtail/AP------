<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 520" width="560" height="520" role="img" aria-labelledby="title desc"><title id="title">네 부분을 모아 완전제곱식 만들기</title><desc id="desc">한 변을 x와 B로 나눈 정사각형이다. 두 주황 직사각형은 크기가 같은 xB이고, 파란 x²과 초록 B²도 각각 하나씩 있다.</desc><rect width="560" height="520" fill="white" /><rect x="153" y="103" width="206" height="206" fill="#e1eefb" stroke="#586574" stroke-width="2.55" /><text x="256.0000" y="215.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#205d9c" text-anchor="middle">x²</text><rect x="359" y="103" width="84" height="206" fill="#fae6ce" stroke="#586574" stroke-width="2.55" /><text x="401.0000" y="215.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#aa5411" text-anchor="middle">xB</text><rect x="153" y="309" width="206" height="84" fill="#fae6ce" stroke="#586574" stroke-width="2.55" /><text x="256.0000" y="360.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#aa5411" text-anchor="middle">xB</text><rect x="359" y="309" width="84" height="84" fill="#e5f3e4" stroke="#586574" stroke-width="2.55" /><text x="401.0000" y="360.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#277339" text-anchor="middle">B²</text><text x="256.0000" y="82.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#586574" text-anchor="middle">x</text><text x="401.0000" y="82.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#586574" text-anchor="middle">B</text><text x="125.0000" y="214.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#586574" text-anchor="middle">x</text><text x="125.0000" y="359.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#586574" text-anchor="middle">B</text></svg>
