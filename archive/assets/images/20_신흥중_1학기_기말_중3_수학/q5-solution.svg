<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 270" width="700" height="270" role="img" aria-labelledby="title desc"><title id="title">1과 2 사이에서 두 절댓값을 길이로 보기</title><desc id="desc">가운데 a를 기준으로 왼쪽 1까지는 파랑, 오른쪽 2까지는 주황이다. 두 길이는 각각 a−1, 2−a이다.</desc><rect width="700" height="270" fill="white" /><line x1="50.0000" y1="135.0000" x2="647.0000" y2="135.0000" stroke="#586574" stroke-width="2.2" stroke-linecap="round" /><polygon points="657.0000,135.0000 646.0000,131.0000 646.0000,139.0000" fill="#586574" /><line x1="118.8846" y1="127.0000" x2="118.8846" y2="143.0000" stroke="#205d9c" stroke-width="2.8" stroke-linecap="round" /><circle cx="118.8846153846154" cy="135" r="4.8" fill="#205d9c" /><text x="118.8846" y="172.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#205d9c" text-anchor="middle">1</text><line x1="325.5385" y1="127.0000" x2="325.5385" y2="143.0000" stroke="#28364b" stroke-width="2.8" stroke-linecap="round" /><circle cx="325.53846153846155" cy="135" r="4.8" fill="#28364b" /><text x="325.5385" y="172.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">a</text><line x1="578.1154" y1="127.0000" x2="578.1154" y2="143.0000" stroke="#aa5411" stroke-width="2.8" stroke-linecap="round" /><circle cx="578.1153846153846" cy="135" r="4.8" fill="#aa5411" /><text x="578.1154" y="172.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#aa5411" text-anchor="middle">2</text><line x1="118.8846" y1="112.0000" x2="325.5385" y2="112.0000" stroke="#205d9c" stroke-width="4" stroke-linecap="round" /><text x="222.2115" y="90.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#205d9c" text-anchor="middle">a − 1</text><line x1="325.5385" y1="112.0000" x2="578.1154" y2="112.0000" stroke="#aa5411" stroke-width="4" stroke-linecap="round" /><text x="451.8269" y="9