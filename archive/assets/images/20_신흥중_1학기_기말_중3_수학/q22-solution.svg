<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 690 520" width="690" height="520" role="img" aria-labelledby="title desc"><title id="title">넓이가 같은 정사각형과 직사각형</title><desc id="desc">왼쪽 정사각형의 변 하나는 8√2이고 오른쪽 직사각형의 밑변은 4√3이다. 같은 넓이인 두 도형의 변과 밑변을 비교한다.</desc><rect width="690" height="520" fill="white" /><rect x="100" y="211.71792231644687" width="183.28207768355313" height="183.28207768355313" fill="#e1eefb" stroke="#205d9c" stroke-width="4.6" /><rect x="440" y="95.70162045209798" width="112.23689233046323" height="299.298379547902" fill="#fae6ce" stroke="#aa5411" stroke-width="4.6" /><text x="191.6410" y="439.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#205d9c" text-anchor="middle">8√2</text><text x="496.1184" y="439.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#aa5411" text-anchor="middle">4√3</text><text x="584.2369" y="256.3508" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#aa5411" text-anchor="middle">h</text><text x="345.0000" y="293.0000" font-size="27" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#586574" text-anchor="middle">같은 넓이</text></svg>
