<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 703 440" width="703" height="440" role="img" aria-labelledby="title desc"><title id="title">넓이가 다른 정사각형을 한 줄로 붙인 도형</title><desc id="desc">작은 정사각형부터 큰 정사각형을 왼쪽에서 오른쪽으로 정렬했다. ㉠, ㉡, ㉢의 넓이는 차례로 12, 27, 48 cm²이다. 맞닿은 변이 점선이다.</desc><rect width="703" height="440" fill="white" /><rect x="68" y="218.5" width="118.5" height="118.5" fill="#e7f2fb" stroke="none" /><text x="127.2500" y="286.7500" font-size="34" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#205d9c" text-anchor="middle">㉠</text><text x="127.2500" y="326.7500" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#205d9c" text-anchor="middle">12 cm²</text><line x1="68.0000" y1="218.5000" x2="186.5000" y2="218.5000" stroke="#205d9c" stroke-width="4.25" stroke-linecap="round" /><line x1="68.0000" y1="337.0000" x2="68.0000" y2="218.5000" stroke="#205d9c" stroke-width="4.25" stroke-linecap="round" /><rect x="186.5" y="159.25" width="177.75" height="177.75" fill="#e7f4ea" stroke="none" /><text x="275.3750" y="257.1250" font-size="34" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#266f73" text-anchor="middle">㉡</text><text x="275.3750" y="297.1250" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#266f73" text-anchor="middle">27 cm²</text><line x1="186.5000" y1="159.2500" x2="364.2500" y2="159.2500" stroke="#266f73" stroke-width="4.25" stroke-linecap="round" /><line x1="186.5000" y1="159.2500" x2="186.5000" y2="337.0000" stroke="#586574" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="7 6" /><line x1="186.5000" y1="159.2500" x2="186.5000" y2="218.5000" stroke="#266f73" stroke-width="4.25" stroke-linecap="round" /><rect x="364.25" y="100.0" width="237.0" height="237.0" fill="#f8ead9" stroke="none" /><text x="482.7500" y="227.5000" font-size="34" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight=