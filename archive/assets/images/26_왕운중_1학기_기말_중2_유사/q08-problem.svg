<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">모양과 크기가 같은 직사각형 타일 11장을 붙여 만든 큰 직사각형이다. 위쪽에는 가로로 긴 타일 5장, 아래쪽에는 세로로 긴 타일 6장이 나란히 붙어 있고 큰 직사각형의 둘레는 164cm이다.</title><desc id="visual-desc">큰 직사각형의 위쪽 띠에는 가로로 긴 타일 5장이, 아래쪽 띠에는 세로로 긴 타일 6장이 빈틈없이 이어져 있다. 위아래 띠의 타일 방향과 수가 구분되어 보인다.</desc><rect width="640" height="320" fill="#fff"/><g data-layer="30"><line id="sAB" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="62.857142857" y1="65.714285714" x2="62.857142857" y2="254.285714286"/></g><g data-layer="30"><line id="sBC" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="62.857142857" y1="254.285714286" x2="577.142857143" y2="254.285714286"/></g><g data-layer="30"><line id="sCD" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="577.142857143" y1="254.285714286" x2="577.142857143" y2="65.714285714"/></g><g data-layer="30"><line id="sDA" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="577.142857143" y1="65.714285714" x2="62.857142857" y2="65.714285714"/></g><g data-layer="30"><line id="sMN" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="62.857142857" y1="151.428571429" x2="577.142857143" y2="151.428571429"/></g><g data-layer="30"><line id="sT1U1" data-role="line" stroke="#111" str