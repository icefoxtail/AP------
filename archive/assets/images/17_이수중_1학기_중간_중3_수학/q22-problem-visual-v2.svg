<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 703 440" width="703" height="440" role="img" aria-labelledby="title desc"><title id="title">세 정사각형을 이어 붙인 도형</title><desc id="desc">A, B, C의 아래쪽 변을 한 수평선에 맞춰 큰 것부터 작은 것 순서로 붙였다. 안쪽 두 세로 점선은 옆 정사각형과 겹치는 변이다.</desc><rect width="703" height="440" fill="white" /><rect x="68" y="102.64916842006892" width="234.35083157993108" height="234.35083157993108" fill="#e7f2fb" stroke="none" /><text x="185.1754" y="228.8246" font-size="34" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#205d9c" text-anchor="middle">A</text><line x1="68.0000" y1="102.6492" x2="302.3508" y2="102.6492" stroke="#205d9c" stroke-width="4.25" stroke-linecap="round" /><line x1="68.0000" y1="337.0000" x2="68.0000" y2="102.6492" stroke="#205d9c" stroke-width="4.25" stroke-linecap="round" /><rect x="302.3508315799311" y="145.65334727741686" width="191.34665272258314" height="191.34665272258314" fill="#e7f4ea" stroke="none" /><text x="398.0242" y="250.3267" font-size="34" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#266f73" text-anchor="middle">B</text><line x1="302.3508" y1="145.6533" x2="493.6975" y2="145.6533" stroke="#266f73" stroke-width="4.25" stroke-linecap="round" /><line x1="302.3508" y1="145.6533" x2="302.3508" y2="337.0000" stroke="#586574" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="7 6" /><line x1="302.3508" y1="102.6492" x2="302.3508" y2="145.6533" stroke="#205d9c" stroke-width="4.25" stroke-linecap="round" /><rect x="493.6974843025142" y="201.6974843025141" width="135.3025156974859" height="135.3025156974859" fill="#f8ead9" stroke="none" /><text x="561.3487" y="278.3487" font-size="34" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#aa5411" text-anchor="middle">C</text><line x1="493.6975" y1="201.6975" x2="629.0000" y2="201.6975" stroke="#aa5411" stroke-width="4.25" stroke-linecap="round" /><line x1="493.6975" y1="201.6975" x2="493.6