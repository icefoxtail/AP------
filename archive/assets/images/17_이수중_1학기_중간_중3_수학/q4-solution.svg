<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" width="520" height="360" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">1/2이 1/3보다 크므로 √(1/2)이 √(1/3)보다 크다. 따라서 √(1/2)이 √(1/3)보다 작다는 ③은 옳지 않다. ①은 11이 13보다 작아 √11이 √13보다 작으므로 옳고, ②와 ⑤는 √(1/3)이 1/2보다 커서 옳으며, ④는 3이 √7보다 커서 옳다. 따라서 답은 ③이다.</title><desc id="visual-desc">왼쪽 끝을 맞춘 세 개의 가로 선분이 위에서부터 놓여 있고, 각 선분 곁에 √(1/2), √(1/3), 1/2이 적혀 있다. 맨 위 선분이 가장 길고 맨 아래 선분이 가장 짧다.</desc><rect width="520" height="360" fill="#fff"/><g data-layer="30"><line id="sG" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="204.81092437" y1="312.142857143" x2="204.81092437" y2="47.857142857"/></g><g data-layer="31"><line id="s1" data-role="line" stroke="#b85c00" stroke-width="2.4" fill="none" x1="204.81092437" y1="71.176470588" x2="315.18907563" y2="71.176470588"/></g><g data-layer="31"><line id="s2" data-role="line" stroke="#1f5fa8" stroke-width="2.4" fill="none" x1="204.81092437" y1="180" x2="294.978991597" y2="180"/></g><g data-layer="31"><line id="s3" data-role="line" stroke="#2e7d32" stroke-width="2.4" fill="none" x1="204.81092437" y1="288.823529412" x2="282.542016807" y2="288.823529412"/></g><g data-layer="90"><g id="t1" data-label-kind="EQUATION_LABEL" data-priority="1" data-font-px="23.2" data-owner="s1" data-fragment-sha="sha256:0e5aa5642f3737d93e72833b768b9aa582a2fd06a60dbde4a588c