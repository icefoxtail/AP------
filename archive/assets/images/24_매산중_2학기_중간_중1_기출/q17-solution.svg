<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 384 320" width="384" height="320" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">원본의 교차하는 닫힌 여섯 변 경로에 45°·40°·55°·25°와 미지각 x·y를 모두 복구한 풀이 그림이다.</title><desc id="visual-desc">꼭짓점 여섯 개를 순서대로 이은 선들이 안쪽에서 서로 교차한다. 왼쪽 각은 45도, 왼쪽 아래 각은 40도, 위의 뾰족한 각은 25도, 아래 중앙 각은 55도, 오른쪽 위아래의 두 각은 각각 x와 y이다. 여섯 각은 선에 닿는 호로 표시되어 있고 면의 색칠은 없다.</desc><rect width="384" height="320" fill="#fff"/><g data-layer="30"><line id="sLX" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="49.142857143" y1="171.444652748" x2="326.126050716" y2="122.605042518"/></g><g data-layer="30"><line id="sXY" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="326.126050716" y1="122.605042518" x2="334.857142857" y2="136.330770875"/></g><g data-layer="30"><line id="sYC" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="334.857142857" y1="136.330770875" x2="75.63212709" y2="257.209380913"/></g><g data-layer="30"><line id="sCT" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="75.63212709" y1="257.209380913" x2="166.291084618" y2="62.790619087"/></g><g data-layer="30"><line id="sTB" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="166.291084618" y1="62.790619087" x2="166.291084618" y2="253.472724714"/></g><g data-layer="30"><line id="sBL" data-role="line" str