<title id="title">접선과 수선으로 만든 삼각형</title><desc id="desc">A(0,3)에서의 접선은 y=3이고 다른 교점은 B(3,3)이다. P=(x,f(x)), H=(x,3)일 때 S(x)=x³(3−x)이므로 넓이는 x=9/4에서 최대이다.</desc>
