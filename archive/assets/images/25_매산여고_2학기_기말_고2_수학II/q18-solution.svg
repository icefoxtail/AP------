<svg xmlns="http://www.w3.org/2000/svg" width="760" height="620" viewBox="0 0 760 620" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet">
  <title id="title">25_매산여고_2학기_기말_고2_수학II · q18 해설 시각화</title>
  <desc id="desc">문항 18의 원문과 해설 흐름을 source-bound 텍스트 카드로 정리한 SVG</desc>
  <rect width="760" height="620" fill="#fff"/>
  <g font-family="Noto Sans KR, Pretendard, Apple SD Gothic Neo, Malgun Gothic, sans-serif" fill="#111">
    <text x="380" y="32" font-size="21" font-weight="700" text-anchor="middle">25_매산여고_2학기_기말_고2_수학II · q18 해설 시각화</text>
    <text x="380" y="59" font-size="15" text-anchor="middle" fill="#475569">도함수의 활용 · 접선과 삼각형의 넓이</text>
    <rect x="18" y="82" width="350" height="350" rx="12" fill="#eff6ff" stroke="#93c5fd"/>
    <rect x="390" y="82" width="352" height="350" rx="12" fill="#f0fdf4" stroke="#86efac"/>
    <text x="34" y="112" font-size="17" font-weight="700" fill="#1d4ed8">문항 핵심</text>
    <text x="398" y="112" font-size="17" font-weight="700" fill="#15803d">해설 흐름</text>
    <text x="34" y="140" font-size="15">함수 f(x)=2x^3-6x^2+3에 대하여 이 곡선 y=f(x) 위의 점 A(0,3)에서</text>
    <text x="34" y="162" font-size="15">의 접선을 l이라 할 때, 직선 l이 곡선과 제 1사분면에서 만나는 점을 B라 하자. 곡선</text>
    <text x="34" y="184" font-size="15">을 따라 두 점 A, B 사이를 움직이는 점 P에서 직선 l에 내린 수선의 발을 H라 할 </text>
    <text x="34" y="206" font-size="15">때, 삼각형 APH의 넓이가 최대가 되는 점 P의 x좌표는? [4.6점]</text>
    <text x="398" y="140" font-size="14">[키포인트] 접선이 수평이므로 삼각형 APH의 밑변과 높이를 x 하나로 표현할 수 있다. </text>
    <text x="398" y="162" font-size="14">조건 정리: f'(x)=6x^2-12x이므로 A(0,3)에서의 접선은 l:y=3이다. f(</text>
    <text x="398" y="184" font-size="14">x)=3에서 제1사분면의 다른 교점은 B(3,3)이다. 풀이 방향: P=(x,f(x)) (</text>
    <text x="398" y="206" font-size="14">0\le x\le3)로 두고 삼각형의 넓이를 함수로 만든다. 정석 풀이: H=(x,3)이므</text>
    <text x="398" y="228" font-size="14">로 AH=x, PH=3-f(x)=2x^2(3-x)이다. 따라서 S(x)=12· x·2x^2</text>
    <text x="398" y="250" font-size="14">(3-x)=x^3(3-x)이고 S'(x)=x^2(9-4x)이다. 내부에서 최대가 되는 점은</text>
    <text x="398" y="272" font-size="14"> x=94이다. 따라서 정답은 ③이다.</text>
    <path d="M350 352 L410 352" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="18" y="374" width="724" height="48" rx="10" fill="#fff7ed" stroke="#fdba74"/>
    <text x="380" y="404" font-size="17" text-anchor="middle" fill="#9a3412">결론: ③</text>
    <text x="380" y="449" font-size="13" text-anchor="middle" fill="#64748b">source: archive/exams/original/high/h2/2final/25_매산여고_2학기_기말_고2_수학II.js · q18 · archive/assets/images/25_매산여고_2학기_기말_고2_수학II/q18-solution.svg</text>
  </g>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#64748b"/></marker></defs>
</svg>