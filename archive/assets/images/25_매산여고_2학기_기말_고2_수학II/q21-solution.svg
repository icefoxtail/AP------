<svg xmlns="http://www.w3.org/2000/svg" width="760" height="620" viewBox="0 0 760 620" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet">
  <title id="title">25_매산여고_2학기_기말_고2_수학II · q21 해설 시각화</title>
  <desc id="desc">문항 21의 원문과 해설 흐름을 source-bound 텍스트 카드로 정리한 SVG</desc>
  <rect width="760" height="620" fill="#fff"/>
  <g font-family="Noto Sans KR, Pretendard, Apple SD Gothic Neo, Malgun Gothic, sans-serif" fill="#111">
    <text x="380" y="32" font-size="21" font-weight="700" text-anchor="middle">25_매산여고_2학기_기말_고2_수학II · q21 해설 시각화</text>
    <text x="380" y="59" font-size="15" text-anchor="middle" fill="#475569">문항 원문과 해설의 핵심 흐름</text>
    <rect x="18" y="82" width="350" height="350" rx="12" fill="#eff6ff" stroke="#93c5fd"/>
    <rect x="390" y="82" width="352" height="350" rx="12" fill="#f0fdf4" stroke="#86efac"/>
    <text x="34" y="112" font-size="17" font-weight="700" fill="#1d4ed8">문항 핵심</text>
    <text x="398" y="112" font-size="17" font-weight="700" fill="#15803d">해설 흐름</text>
    <text x="34" y="140" font-size="15">[주관식1 (서술형)] [6점](부분점수 있음)</text>
    <text x="34" y="162" font-size="15">삼차함수 f(x)=x^3-3x+a에 대하여 함수</text>
    <text x="34" y="184" font-size="15">F(x)=∫[0, x] f(t)dt가 오직 하나의 극값을</text>
    <text x="34" y="206" font-size="15">갖도록 양수 a의 최솟값을 구하는 과정을</text>
    <text x="34" y="228" font-size="15">서술하시오.</text>
    <text x="398" y="140" font-size="14">[키포인트] F'(x)=f(x)이므로 F의 극값 개수는</text>
    <text x="398" y="162" font-size="14">삼차함수 f의 영점에서의 부호 변화로 결정된다.</text>
    <text x="398" y="184" font-size="14">조건 정리: f(x)=x^3-3x+a이고</text>
    <text x="398" y="206" font-size="14">f'(x)=3(x^2-1)이므로 f(-1)=a+2,</text>
    <text x="398" y="228" font-size="14">f(1)=a-2이다. 풀이 방향: 양수 a의 범위에</text>
    <text x="398" y="250" font-size="14">따라 f(x)=0의 실근 개수와 중근 여부를</text>
    <text x="398" y="272" font-size="14">판단한다. 정석 풀이: 0&lt;a&lt;2이면 f(-1)&gt;0,</text>
    <text x="398" y="294" font-size="14">f(1)&lt;0이므로 f(x)=0은 서로 다른 세 실근을</text>
    <text x="398" y="316" font-size="14">가지고 F는 세 곳에서 극값을 갖는다. a=2이면</text>
    <text x="398" y="338" font-size="14">f(x)=(x-1)^2(x+2)이다. x=1은 짝수중근이라</text>
    <text x="398" y="360" font-size="14">부호가 바뀌지 않고 x=-2에서만 부호가 바뀌므로</text>
    <text x="398" y="382" font-size="14">F는 오직 하나의 극값을 갖는다. 따라서 양수 a의</text>
    <text x="398" y="404" font-size="14">최솟값은 2이다. 따라서 구하는 값은 2이다.</text>
    <rect x="18" y="456" width="724" height="48" rx="10" fill="#fff7ed" stroke="#fdba74"/>
    <text x="380" y="486" font-size="17" text-anchor="middle" fill="#9a3412">결론: 2</text>
    <text x="380" y="532" font-size="11" text-anchor="middle" fill="#64748b">25_매산여고_2학기_기말_고2_수학II · q21 · source-bound solution visual</text>
  </g>
</svg>