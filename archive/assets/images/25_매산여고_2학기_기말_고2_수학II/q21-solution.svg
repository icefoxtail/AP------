<svg xmlns="http://www.w3.org/2000/svg" width="760" height="620" viewBox="0 0 760 620" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet">
  <title id="title">25_매산여고_2학기_기말_고2_수학II · q21 해설 시각화</title>
  <desc id="desc">문항 21의 원문과 해설 흐름을 source-bound 텍스트 카드로 정리한 SVG</desc>
  <rect width="760" height="620" fill="#fff"/>
  <g font-family="Noto Sans KR, Pretendard, Apple SD Gothic Neo, Malgun Gothic, sans-serif" fill="#111">
    <text x="380" y="32" font-size="21" font-weight="700" text-anchor="middle">25_매산여고_2학기_기말_고2_수학II · q21 해설 시각화</text>
    <text x="380" y="59" font-size="15" text-anchor="middle" fill="#475569">문항 원문과 해설의 핵심 흐름</text>
    <rect x="18" y="82" width="350" height="300" rx="12" fill="#eff6ff" stroke="#93c5fd"/>
    <rect x="390" y="82" width="352" height="300" rx="12" fill="#f0fdf4" stroke="#86efac"/>
    <text x="34" y="112" font-size="17" font-weight="700" fill="#1d4ed8">문항 핵심</text>
    <text x="398" y="112" font-size="17" font-weight="700" fill="#15803d">해설 흐름</text>
    <text x="34" y="140" font-size="15">[주관식1 (서술형)] [6점](부분점수 있음) 삼차함수 f(x)=x^3-3x+a에</text>
    <text x="34" y="162" font-size="15">대하여 함수 F(x)=∫[0, x] f(t)dt가 오직 하나의 극값을 갖도록 양수 a의</text>
    <text x="34" y="184" font-size="15">최솟값을 구하는 과정을 서술하시오.</text>
    <text x="398" y="140" font-size="14">[키포인트] F'(x)=f(x)이므로 F의 극값 개수는 삼차함수 f의 영점에서의</text>
    <text x="398" y="162" font-size="14">부호 변화로 결정된다. 조건 정리: f(x)=x^3-3x+a이고</text>
    <text x="398" y="184" font-size="14">f'(x)=3(x^2-1)이므로 f(-1)=a+2, f(1)=a-2이다. 풀이 방향: 양수 a의</text>
    <text x="398" y="206" font-size="14">범위에 따라 f(x)=0의 실근 개수와 중근 여부를 판단한다. 정석 풀이:</text>
    <text x="398" y="228" font-size="14">0&lt;a&lt;2이면 f(-1)&gt;0, f(1)&lt;0이므로 f(x)=0은 서로 다른 세 실근을 가지고</text>
    <text x="398" y="250" font-size="14">F는 세 곳에서 극값을 갖는다. a=2이면 f(x)=(x-1)^2(x+2)이다. x=1은</text>
    <text x="398" y="272" font-size="14">짝수중근이라 부호가 바뀌지 않고 x=-2에서만 부호가 바뀌므로 F는 오직</text>
    <text x="398" y="294" font-size="14">하나의 극값을 갖는다. 따라서 양수 a의 최솟값은 2이다. 따라서 구하는 값은</text>
    <text x="398" y="316" font-size="14">2이다.</text>
    <path d="M350 314 L410 314" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="18" y="350" width="724" height="48" rx="10" fill="#fff7ed" stroke="#fdba74"/>
    <text x="380" y="380" font-size="17" text-anchor="middle" fill="#9a3412">결론: 2</text>
    <text x="380" y="452" font-size="11" text-anchor="middle" fill="#64748b">25_매산여고_2학기_기말_고2_수학II · q21 · source-bound solution visual</text>
  </g>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#64748b"/></marker></defs>
</svg>