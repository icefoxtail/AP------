<svg xmlns="http://www.w3.org/2000/svg" width="760" height="620" viewBox="0 0 760 620" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet">
  <title id="title">25_매산여고_2학기_기말_고2_수학II · q14 해설 시각화</title>
  <desc id="desc">문항 14의 원문과 해설 흐름을 source-bound 텍스트 카드로 정리한 SVG</desc>
  <rect width="760" height="620" fill="#fff"/>
  <g font-family="Noto Sans KR, Pretendard, Apple SD Gothic Neo, Malgun Gothic, sans-serif" fill="#111">
    <text x="380" y="32" font-size="21" font-weight="700" text-anchor="middle">25_매산여고_2학기_기말_고2_수학II · q14 해설 시각화</text>
    <text x="380" y="59" font-size="15" text-anchor="middle" fill="#475569">문항 원문과 해설의 핵심 흐름</text>
    <rect x="18" y="82" width="350" height="300" rx="12" fill="#eff6ff" stroke="#93c5fd"/>
    <rect x="390" y="82" width="352" height="300" rx="12" fill="#f0fdf4" stroke="#86efac"/>
    <text x="34" y="112" font-size="17" font-weight="700" fill="#1d4ed8">문항 핵심</text>
    <text x="398" y="112" font-size="17" font-weight="700" fill="#15803d">해설 흐름</text>
    <text x="34" y="140" font-size="15">수직선 위를 움직이는 점 P의 시각 t</text>
    <text x="34" y="162" font-size="15">(t≥0)에서의 속도 v(t)가 v(t)=-2t+6이다.</text>
    <text x="34" y="184" font-size="15">t=0부터 t=6까지 점 P가 움직인 거리는?</text>
    <text x="34" y="206" font-size="15">[4.1점]</text>
    <text x="398" y="140" font-size="14">[키포인트] 이동거리는 속도의 절댓값을</text>
    <text x="398" y="162" font-size="14">적분하므로 방향이 바뀌는 시각에서 구간을</text>
    <text x="398" y="184" font-size="14">나눈다. 조건 정리: v(t)=-2t+6은 t=3에서</text>
    <text x="398" y="206" font-size="14">부호가 바뀐다. 풀이 방향: [0,3]과 [3,6]에서</text>
    <text x="398" y="228" font-size="14">속도의 절댓값을 각각 적분한다. 정석 풀이:</text>
    <text x="398" y="250" font-size="14">이동거리는 ∫[0, 3](6-2t)dt+∫[3,</text>
    <text x="398" y="272" font-size="14">6](2t-6)dt=9+9=18이다. 따라서 정답은</text>
    <text x="398" y="294" font-size="14">②이다.</text>
    <rect x="18" y="406" width="724" height="48" rx="10" fill="#fff7ed" stroke="#fdba74"/>
    <text x="380" y="436" font-size="17" text-anchor="middle" fill="#9a3412">결론: ②</text>
    <text x="380" y="482" font-size="11" text-anchor="middle" fill="#64748b">25_매산여고_2학기_기말_고2_수학II · q14 · source-bound solution visual</text>
  </g>
</svg>