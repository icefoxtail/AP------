<svg xmlns="http://www.w3.org/2000/svg" width="760" height="620" viewBox="0 0 760 620" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet">
  <title id="title">25_매산여고_2학기_기말_고2_수학II · q17 해설 시각화</title>
  <desc id="desc">문항 17의 원문과 해설 흐름을 source-bound 텍스트 카드로 정리한 SVG</desc>
  <rect width="760" height="620" fill="#fff"/>
  <g font-family="Noto Sans KR, Pretendard, Apple SD Gothic Neo, Malgun Gothic, sans-serif" fill="#111">
    <text x="380" y="32" font-size="21" font-weight="700" text-anchor="middle">25_매산여고_2학기_기말_고2_수학II · q17 해설 시각화</text>
    <text x="380" y="59" font-size="15" text-anchor="middle" fill="#475569">문항 원문과 해설의 핵심 흐름</text>
    <rect x="18" y="82" width="350" height="300" rx="12" fill="#eff6ff" stroke="#93c5fd"/>
    <rect x="390" y="82" width="352" height="300" rx="12" fill="#f0fdf4" stroke="#86efac"/>
    <text x="34" y="112" font-size="17" font-weight="700" fill="#1d4ed8">문항 핵심</text>
    <text x="398" y="112" font-size="17" font-weight="700" fill="#15803d">해설 흐름</text>
    <text x="34" y="140" font-size="15">최고차항의 계수가 1인 이차함수 f(x)가 f(5)=0이고, ∫[2,</text>
    <text x="34" y="162" font-size="15">2025]f(x)dx=∫[5, 2025]f(x)dx를 만족시킨다. 곡선 y=f(x)와 x축으로</text>
    <text x="34" y="184" font-size="15">둘러싸인 부분의 넓이는? [4.4점]</text>
    <text x="398" y="140" font-size="14">[키포인트] 두 정적분의 상한이 같으므로 빼면 짧은 구간의 적분 조건으로</text>
    <text x="398" y="162" font-size="14">바뀐다. 조건 정리: 최고차항 계수가 1이고 f(5)=0이므로</text>
    <text x="398" y="184" font-size="14">f(x)=(x-5)(x-r)로 둔다. 풀이 방향: ∫[2, 2025]f=∫[5, 2025]f에서</text>
    <text x="398" y="206" font-size="14">∫[2, 5]f=0을 얻어 다른 근 r을 구한다. 정석 풀이: ∫[2,</text>
    <text x="398" y="228" font-size="14">5](x-5)(x-r)dx=9 / 2(r-3)이므로 r=3이다. 따라서</text>
    <text x="398" y="250" font-size="14">f(x)=(x-3)(x-5)이고 3&lt;x&lt;5에서 음수이다. 둘러싸인 넓이는 -∫[3,</text>
    <text x="398" y="272" font-size="14">5](x-3)(x-5)dx=4 / 3이다. 따라서 정답은 ⑤이다.</text>
    <path d="M350 314 L410 314" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="18" y="350" width="724" height="48" rx="10" fill="#fff7ed" stroke="#fdba74"/>
    <text x="380" y="380" font-size="17" text-anchor="middle" fill="#9a3412">결론: ⑤</text>
    <text x="380" y="452" font-size="11" text-anchor="middle" fill="#64748b">25_매산여고_2학기_기말_고2_수학II · q17 · source-bound solution visual</text>
  </g>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#64748b"/></marker></defs>
</svg>