<svg xmlns="http://www.w3.org/2000/svg" width="760" height="620" viewBox="0 0 760 620" role="img" aria-labelledby="title desc">
  <title id="title">25_매산여고_2학기_기말_고2_수학II · q4 해설 시각화</title>
  <desc id="desc">문항 4의 원문과 해설 흐름을 source-bound 텍스트 카드로 정리한 SVG</desc>
  <rect width="760" height="620" fill="#fff"/>
  <g font-family="Arial, sans-serif" fill="#111">
    <text x="380" y="32" font-size="21" font-weight="700" text-anchor="middle">25_매산여고_2학기_기말_고2_수학II · q4 해설 시각화</text>
    <text x="380" y="59" font-size="15" text-anchor="middle" fill="#475569">도함수의 활용 · 속도와 가속도</text>
    <rect x="18" y="82" width="350" height="350" rx="12" fill="#eff6ff" stroke="#93c5fd"/>
    <rect x="390" y="82" width="352" height="350" rx="12" fill="#f0fdf4" stroke="#86efac"/>
    <text x="34" y="112" font-size="17" font-weight="700" fill="#1d4ed8">문항 핵심</text>
    <text x="398" y="112" font-size="17" font-weight="700" fill="#15803d">해설 흐름</text>
    <text x="34" y="140" font-size="15">수직선 위를 움직이는 점 P의 시각 t에서의 위치 x가 x=-t^3+3t^2+9t-10일 </text>
    <text x="34" y="162" font-size="15">때, 점 P의 속도가 0이 되는 순간의 가속도는? [3.6점]</text>
    <text x="398" y="140" font-size="14">[키포인트] 속도는 위치를 한 번 미분하고, 가속도는 속도를 다시 미분한다. 조건 정리: </text>
    <text x="398" y="162" font-size="14">x=-t^3+3t^2+9t-10이므로 v(t)=-3t^2+6t+9=-3(t-3)(t+1)이</text>
    <text x="398" y="184" font-size="14">다. 풀이 방향: 시각은 t\ge0이므로 속도가 0인 시각을 찾은 뒤 가속도에 대입한다. </text>
    <text x="398" y="206" font-size="14">정석 풀이: v(t)=0에서 t=3이다. 가속도는 a(t)=v'(t)=-6t+6이므로 a(</text>
    <text x="398" y="228" font-size="14">3)=-18+6=-12이다. 따라서 정답은 ⑤이다.</text>
    <path d="M350 308 L410 308" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="18" y="330" width="724" height="48" rx="10" fill="#fff7ed" stroke="#fdba74"/>
    <text x="380" y="360" font-size="17" text-anchor="middle" fill="#9a3412">정답/결론: ⑤</text>
    <text x="380" y="405" font-size="13" text-anchor="middle" fill="#64748b">source: archive/exams/original/high/h2/2final/25_매산여고_2학기_기말_고2_수학II.js · q4 · archive/assets/images/25_매산여고_2학기_기말_고2_수학II/q4-solution.svg</text>
  </g>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#64748b"/></marker></defs>
</svg>