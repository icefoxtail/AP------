<svg xmlns="http://www.w3.org/2000/svg" width="760" height="620" viewBox="0 0 760 620" role="img" aria-labelledby="title desc">
  <title id="title">25_매산여고_2학기_기말_고2_수학II · q13 해설 시각화</title>
  <desc id="desc">문항 13의 원문과 해설 흐름을 source-bound 텍스트 카드로 정리한 SVG</desc>
  <rect width="760" height="620" fill="#fff"/>
  <g font-family="Arial, sans-serif" fill="#111">
    <text x="380" y="32" font-size="21" font-weight="700" text-anchor="middle">25_매산여고_2학기_기말_고2_수학II · q13 해설 시각화</text>
    <text x="380" y="59" font-size="15" text-anchor="middle" fill="#475569">적분의 활용 · 속도와 위치</text>
    <rect x="18" y="82" width="350" height="350" rx="12" fill="#eff6ff" stroke="#93c5fd"/>
    <rect x="390" y="82" width="352" height="350" rx="12" fill="#f0fdf4" stroke="#86efac"/>
    <text x="34" y="112" font-size="17" font-weight="700" fill="#1d4ed8">문항 핵심</text>
    <text x="398" y="112" font-size="17" font-weight="700" fill="#15803d">해설 흐름</text>
    <text x="34" y="140" font-size="15">좌표가 1인 점을 출발하여 수직선 위를 움직이는 점 P의 시각 t (t\ge0)에서의 속도</text>
    <text x="34" y="162" font-size="15"> v(t)=t^2-6t일 때, 시각 t=3에서의 점 P의 수직선 위의 위치는? [4.0점]</text>
    <text x="398" y="140" font-size="14">[키포인트] 위치의 변화량은 속도의 정적분이다. 조건 정리: 처음 위치는 1이고 v(t)=</text>
    <text x="398" y="162" font-size="14">t^2-6t이다. 풀이 방향: 0부터 3까지 속도를 적분해 처음 위치에 더한다. 정석 풀이</text>
    <text x="398" y="184" font-size="14">: x(3)=1+∫_0^3(t^2-6t)dt=1+[13t^3-3t^2]_0^3=-17이다.</text>
    <text x="398" y="206" font-size="14"> 따라서 정답은 ③이다.</text>
    <path d="M350 286 L410 286" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="18" y="308" width="724" height="48" rx="10" fill="#fff7ed" stroke="#fdba74"/>
    <text x="380" y="338" font-size="17" text-anchor="middle" fill="#9a3412">정답/결론: ③</text>
    <text x="380" y="383" font-size="13" text-anchor="middle" fill="#64748b">source: archive/exams/original/high/h2/2final/25_매산여고_2학기_기말_고2_수학II.js · q13 · archive/assets/images/25_매산여고_2학기_기말_고2_수학II/q13-solution.svg</text>
  </g>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#64748b"/></marker></defs>
</svg>