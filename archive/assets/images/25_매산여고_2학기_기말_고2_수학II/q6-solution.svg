<svg xmlns="http://www.w3.org/2000/svg" width="760" height="620" viewBox="0 0 760 620" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet">
  <title id="title">25_매산여고_2학기_기말_고2_수학II · q6 해설 시각화</title>
  <desc id="desc">문항 6의 원문과 해설 흐름을 source-bound 텍스트 카드로 정리한 SVG</desc>
  <rect width="760" height="620" fill="#fff"/>
  <g font-family="Noto Sans KR, Pretendard, Apple SD Gothic Neo, Malgun Gothic, sans-serif" fill="#111">
    <text x="380" y="32" font-size="21" font-weight="700" text-anchor="middle">25_매산여고_2학기_기말_고2_수학II · q6 해설 시각화</text>
    <text x="380" y="59" font-size="15" text-anchor="middle" fill="#475569">적분의 활용 · 접선과 넓이</text>
    <rect x="18" y="82" width="350" height="350" rx="12" fill="#eff6ff" stroke="#93c5fd"/>
    <rect x="390" y="82" width="352" height="350" rx="12" fill="#f0fdf4" stroke="#86efac"/>
    <text x="34" y="112" font-size="17" font-weight="700" fill="#1d4ed8">문항 핵심</text>
    <text x="398" y="112" font-size="17" font-weight="700" fill="#15803d">해설 흐름</text>
    <text x="34" y="140" font-size="15">곡선 y=x^3+1과 이 곡선 위의 점 (1,2)에서 접하는 접선으로 둘러싸인 도형의 넓이</text>
    <text x="34" y="162" font-size="15">는? [3.7점]</text>
    <text x="398" y="140" font-size="14">[키포인트] 접선과 곡선의 다른 교점을 구한 뒤 두 그래프의 차를 적분한다. 조건 정리: </text>
    <text x="398" y="162" font-size="14">y=x^3+1에서 f'(1)=3이므로 점 (1,2)에서의 접선은 y=3x-1이다. 풀이 방</text>
    <text x="398" y="184" font-size="14">향: x^3+1=3x-1의 교점을 구하고 곡선과 직선의 위아래를 확인한다. 정석 풀이: x</text>
    <text x="398" y="206" font-size="14">^3-3x+2=(x-1)^2(x+2)=0이므로 교점의 x좌표는 -2,1이다. -2&lt;x&lt;1에</text>
    <text x="398" y="228" font-size="14">서 곡선이 직선 위에 있으므로 넓이는 ∫_-2^1(x^3-3x+2)dx=274이다. 따라서</text>
    <text x="398" y="250" font-size="14"> 정답은 ①이다.</text>
    <path d="M350 330 L410 330" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="18" y="352" width="724" height="48" rx="10" fill="#fff7ed" stroke="#fdba74"/>
    <text x="380" y="382" font-size="17" text-anchor="middle" fill="#9a3412">결론: ①</text>
    <text x="380" y="427" font-size="13" text-anchor="middle" fill="#64748b">source: archive/exams/original/high/h2/2final/25_매산여고_2학기_기말_고2_수학II.js · q6 · archive/assets/images/25_매산여고_2학기_기말_고2_수학II/q6-solution.svg</text>
  </g>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#64748b"/></marker></defs>
</svg>