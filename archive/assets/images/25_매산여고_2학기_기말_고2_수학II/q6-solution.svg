<title id="title">삼차함수와 접선이 둘러싼 넓이</title><desc id="desc">곡선 y=x³+1과 점 (1,2)에서의 접선 y=3x−1은 x=−2,1에서 만난다. 곡선과 접선의 차는 (x−1)²(x+2)≥0이므로 둘러싸인 넓이는 ∫₋₂¹(x−1)²(x+2)dx=27/4이다.</desc>
