<svg xmlns="http://www.w3.org/2000/svg" width="760" height="620" viewBox="0 0 760 620" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet">
  <title id="title">25_매산여고_2학기_기말_고2_수학II · q6 해설 시각화</title>
  <desc id="desc">문항 6의 원문과 해설 흐름을 source-bound 텍스트 카드로 정리한 SVG</desc>
  <rect width="760" height="620" fill="#fff"/>
  <g font-family="Noto Sans KR, Pretendard, Apple SD Gothic Neo, Malgun Gothic, sans-serif" fill="#111">
    <text x="380" y="32" font-size="21" font-weight="700" text-anchor="middle">25_매산여고_2학기_기말_고2_수학II · q6 해설 시각화</text>
    <text x="380" y="59" font-size="15" text-anchor="middle" fill="#475569">문항 원문과 해설의 핵심 흐름</text>
    <rect x="18" y="82" width="350" height="306" rx="12" fill="#eff6ff" stroke="#93c5fd"/>
    <rect x="390" y="82" width="352" height="306" rx="12" fill="#f0fdf4" stroke="#86efac"/>
    <text x="34" y="112" font-size="17" font-weight="700" fill="#1d4ed8">문항 핵심</text>
    <text x="398" y="112" font-size="17" font-weight="700" fill="#15803d">해설 흐름</text>
    <text x="34" y="140" font-size="15">곡선 y=x^3+1과 이 곡선 위의 점 (1,2)에서</text>
    <text x="34" y="162" font-size="15">접하는 접선으로 둘러싸인 도형의 넓이는?</text>
    <text x="34" y="184" font-size="15">[3.7점]</text>
    <text x="398" y="140" font-size="14">[키포인트] 접선과 곡선의 다른 교점을 구한 뒤</text>
    <text x="398" y="162" font-size="14">두 그래프의 차를 적분한다. 조건 정리:</text>
    <text x="398" y="184" font-size="14">y=x^3+1에서 f'(1)=3이므로 점 (1,2)에서의</text>
    <text x="398" y="206" font-size="14">접선은 y=3x-1이다. 풀이 방향: x^3+1=3x-1의</text>
    <text x="398" y="228" font-size="14">교점을 구하고 곡선과 직선의 위아래를</text>
    <text x="398" y="250" font-size="14">확인한다. 정석 풀이:</text>
    <text x="398" y="272" font-size="14">x^3-3x+2=(x-1)^2(x+2)=0이므로 교점의</text>
    <text x="398" y="294" font-size="14">x좌표는 -2,1이다. -2&lt;x&lt;1에서 곡선이 직선</text>
    <text x="398" y="316" font-size="14">위에 있으므로 넓이는 ∫[-2,</text>
    <text x="398" y="338" font-size="14">1](x^3-3x+2)dx=27 / 4이다. 따라서 정답은</text>
    <text x="398" y="360" font-size="14">①이다.</text>
    <rect x="18" y="412" width="724" height="48" rx="10" fill="#fff7ed" stroke="#fdba74"/>
    <text x="380" y="442" font-size="17" text-anchor="middle" fill="#9a3412">결론: ①</text>
    <text x="380" y="488" font-size="11" text-anchor="middle" fill="#64748b">25_매산여고_2학기_기말_고2_수학II · q6 · source-bound solution visual</text>
  </g>
</svg>