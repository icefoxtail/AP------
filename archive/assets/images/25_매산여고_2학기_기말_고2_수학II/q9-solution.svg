<svg xmlns="http://www.w3.org/2000/svg" width="760" height="620" viewBox="0 0 760 620" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet">
  <title id="title">25_매산여고_2학기_기말_고2_수학II · q9 해설 시각화</title>
  <desc id="desc">문항 9의 원문과 해설 흐름을 source-bound 텍스트 카드로 정리한 SVG</desc>
  <rect width="760" height="620" fill="#fff"/>
  <g font-family="Noto Sans KR, Pretendard, Apple SD Gothic Neo, Malgun Gothic, sans-serif" fill="#111">
    <text x="380" y="32" font-size="21" font-weight="700" text-anchor="middle">25_매산여고_2학기_기말_고2_수학II · q9 해설 시각화</text>
    <text x="380" y="59" font-size="15" text-anchor="middle" fill="#475569">문항 원문과 해설의 핵심 흐름</text>
    <rect x="18" y="82" width="350" height="300" rx="12" fill="#eff6ff" stroke="#93c5fd"/>
    <rect x="390" y="82" width="352" height="300" rx="12" fill="#f0fdf4" stroke="#86efac"/>
    <text x="34" y="112" font-size="17" font-weight="700" fill="#1d4ed8">문항 핵심</text>
    <text x="398" y="112" font-size="17" font-weight="700" fill="#15803d">해설 흐름</text>
    <text x="34" y="140" font-size="15">함수 f(x)=2x^3+ax^2+bx+3은 x=-1에서</text>
    <text x="34" y="162" font-size="15">극대이고, x=4에서 극소이다. 함수 f(x)의</text>
    <text x="34" y="184" font-size="15">극댓값은? (단, a, b는 상수이다.) [3.9점]</text>
    <text x="398" y="140" font-size="14">[키포인트] 극대·극소가 일어나는 두 x값은</text>
    <text x="398" y="162" font-size="14">도함수의 두 근이다. 조건 정리:</text>
    <text x="398" y="184" font-size="14">f'(x)=6x^2+2ax+b는 x=-1,4에서 0이 된다.</text>
    <text x="398" y="206" font-size="14">풀이 방향: 최고차항 계수가 6인 이차식으로</text>
    <text x="398" y="228" font-size="14">도함수를 인수분해한다. 정석 풀이:</text>
    <text x="398" y="250" font-size="14">f'(x)=6(x+1)(x-4)=6x^2-18x-24이므로</text>
    <text x="398" y="272" font-size="14">a=-9, b=-24이다. 극댓값은</text>
    <text x="398" y="294" font-size="14">f(-1)=-2-9+24+3=16이다. 따라서 정답은</text>
    <text x="398" y="316" font-size="14">①이다.</text>
    <rect x="18" y="406" width="724" height="48" rx="10" fill="#fff7ed" stroke="#fdba74"/>
    <text x="380" y="436" font-size="17" text-anchor="middle" fill="#9a3412">결론: ①</text>
    <text x="380" y="482" font-size="11" text-anchor="middle" fill="#64748b">25_매산여고_2학기_기말_고2_수학II · q9 · source-bound solution visual</text>
  </g>
</svg>