<svg xmlns="http://www.w3.org/2000/svg" width="760" height="620" viewBox="0 0 760 620" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet">
  <title id="title">25_매산여고_2학기_기말_고2_수학II · q8 해설 시각화</title>
  <desc id="desc">문항 8의 원문과 해설 흐름을 source-bound 텍스트 카드로 정리한 SVG</desc>
  <rect width="760" height="620" fill="#fff"/>
  <g font-family="Noto Sans KR, Pretendard, Apple SD Gothic Neo, Malgun Gothic, sans-serif" fill="#111">
    <text x="380" y="32" font-size="21" font-weight="700" text-anchor="middle">25_매산여고_2학기_기말_고2_수학II · q8 해설 시각화</text>
    <text x="380" y="59" font-size="15" text-anchor="middle" fill="#475569">문항 원문과 해설의 핵심 흐름</text>
    <rect x="18" y="82" width="350" height="300" rx="12" fill="#eff6ff" stroke="#93c5fd"/>
    <rect x="390" y="82" width="352" height="300" rx="12" fill="#f0fdf4" stroke="#86efac"/>
    <text x="34" y="112" font-size="17" font-weight="700" fill="#1d4ed8">문항 핵심</text>
    <text x="398" y="112" font-size="17" font-weight="700" fill="#15803d">해설 흐름</text>
    <text x="34" y="140" font-size="15">함수 f(x)=x^3-(a+3)x^2+2ax에 대하여 곡선 y=f(x) 위의 점</text>
    <text x="34" y="162" font-size="15">(t,f(t))에서의 접선의 y절편을 g(t)라 하자. 함수 g(t)가 열린 구간</text>
    <text x="34" y="184" font-size="15">(0,6)에서 증가할 때, a의 최솟값은? (단, a는 상수이다.) [3.8점]</text>
    <text x="398" y="140" font-size="14">[키포인트] 접선의 y절편을 t의 함수로 직접 나타낸 뒤 증가 조건을 미분으로</text>
    <text x="398" y="162" font-size="14">판정한다. 조건 정리: 점 (t,f(t))에서의 접선은</text>
    <text x="398" y="184" font-size="14">y-f(t)=f'(t)(x-t)이므로 y절편은 g(t)=f(t)-tf'(t)이다. 풀이 방향:</text>
    <text x="398" y="206" font-size="14">g'(t)의 부호가 열린 구간 (0,6)에서 양수가 되도록 한다. 정석 풀이:</text>
    <text x="398" y="228" font-size="14">g(t)=t^2(a+3-2t)이고 g'(t)=2t(a+3-3t)이다. 0&lt;t&lt;6에서 2t&gt;0이므로</text>
    <text x="398" y="250" font-size="14">a+3-3t&gt;0이어야 한다. t가 6에 가까워질 때까지 성립하려면 a+3≥18, 즉</text>
    <text x="398" y="272" font-size="14">a≥15이다. a=15이면 g'(t)=6t(6-t)&gt;0이므로 조건을 만족한다. 따라서</text>
    <text x="398" y="294" font-size="14">정답은 ②이다.</text>
    <path d="M350 314 L410 314" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="18" y="350" width="724" height="48" rx="10" fill="#fff7ed" stroke="#fdba74"/>
    <text x="380" y="380" font-size="17" text-anchor="middle" fill="#9a3412">결론: ②</text>
    <text x="380" y="452" font-size="11" text-anchor="middle" fill="#64748b">25_매산여고_2학기_기말_고2_수학II · q8 · source-bound solution visual</text>
  </g>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#64748b"/></marker></defs>
</svg>