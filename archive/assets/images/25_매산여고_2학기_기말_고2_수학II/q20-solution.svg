<svg xmlns="http://www.w3.org/2000/svg" width="760" height="620" viewBox="0 0 760 620" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet">
  <title id="title">25_매산여고_2학기_기말_고2_수학II · q20 해설 시각화</title>
  <desc id="desc">문항 20의 원문과 해설 흐름을 source-bound 텍스트 카드로 정리한 SVG</desc>
  <rect width="760" height="620" fill="#fff"/>
  <g font-family="Noto Sans KR, Pretendard, Apple SD Gothic Neo, Malgun Gothic, sans-serif" fill="#111">
    <text x="380" y="32" font-size="21" font-weight="700" text-anchor="middle">25_매산여고_2학기_기말_고2_수학II · q20 해설 시각화</text>
    <text x="380" y="59" font-size="15" text-anchor="middle" fill="#475569">문항 원문과 해설의 핵심 흐름</text>
    <rect x="18" y="82" width="350" height="350" rx="12" fill="#eff6ff" stroke="#93c5fd"/>
    <rect x="390" y="82" width="352" height="350" rx="12" fill="#f0fdf4" stroke="#86efac"/>
    <text x="34" y="112" font-size="17" font-weight="700" fill="#1d4ed8">문항 핵심</text>
    <text x="398" y="112" font-size="17" font-weight="700" fill="#15803d">해설 흐름</text>
    <text x="34" y="140" font-size="15">실수 m에 대하여 수직선 위를 움직이는 두 점</text>
    <text x="34" y="162" font-size="15">P, Q의 시각 t (t≥0)에서의 속도를 각각</text>
    <text x="34" y="184" font-size="15">v[1]=3 / 4t^2+1, v[2]=mt-4라 하자. 시각</text>
    <text x="34" y="206" font-size="15">t=0에서 t=2까지 두 점 P, Q가 움직인 거리가</text>
    <text x="34" y="228" font-size="15">같도록 하는 모든 m값의 합은? [4.7점]</text>
    <text x="398" y="140" font-size="14">[키포인트] 이동거리는 속도의 절댓값</text>
    <text x="398" y="162" font-size="14">적분이므로 v[2]=mt-4가 0이 되는 위치에 따라</text>
    <text x="398" y="184" font-size="14">경우를 나눈다. 조건 정리: v[1]=3 /</text>
    <text x="398" y="206" font-size="14">4t^2+1&gt;0이므로 P의 이동거리는 ∫[0, 2](3 /</text>
    <text x="398" y="228" font-size="14">4t^2+1)dt=4이다. 풀이 방향: Q의 이동거리</text>
    <text x="398" y="250" font-size="14">∫[0, 2]|mt-4|dt가 4가 되는 m을 찾는다. 정석</text>
    <text x="398" y="272" font-size="14">풀이: 0&lt;m≤2이면 거리는 8-2m이므로 m=2이다.</text>
    <text x="398" y="294" font-size="14">m&gt;2이면 방향 전환 시각은 4/m이고 거리는</text>
    <text x="398" y="316" font-size="14">2m-8+16 / m이다. 이를 4와 같게 두면</text>
    <text x="398" y="338" font-size="14">m^2-6m+8=0이므로 이 경우에는 m=4이다.</text>
    <text x="398" y="360" font-size="14">m≤0에서는 조건을 만족하는 값이 없다. 따라서</text>
    <text x="398" y="382" font-size="14">모든 m은 2,4이고 합은 6이다. 따라서 정답은</text>
    <text x="398" y="404" font-size="14">②이다.</text>
    <rect x="18" y="456" width="724" height="48" rx="10" fill="#fff7ed" stroke="#fdba74"/>
    <text x="380" y="486" font-size="17" text-anchor="middle" fill="#9a3412">결론: ②</text>
    <text x="380" y="532" font-size="11" text-anchor="middle" fill="#64748b">25_매산여고_2학기_기말_고2_수학II · q20 · source-bound solution visual</text>
  </g>
</svg>