<title id="title">m에 따른 속도의 방향 전환</title><desc id="desc">P의 속도 v₁(t)=3t²/4+1은 항상 양수라 이동 거리는 4이다. Q의 속도 v₂(t)=mt−4에서 이동 거리가 4가 되는 m은 2,4이므로 가능한 m의 합은 6이다.</desc>
