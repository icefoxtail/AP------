<svg xmlns="http://www.w3.org/2000/svg" width="760" height="620" viewBox="0 0 760 620" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet">
  <title id="title">25_매산여고_2학기_기말_고2_수학II · q5 해설 시각화</title>
  <desc id="desc">문항 5의 원문과 해설 흐름을 source-bound 텍스트 카드로 정리한 SVG</desc>
  <rect width="760" height="620" fill="#fff"/>
  <g font-family="Noto Sans KR, Pretendard, Apple SD Gothic Neo, Malgun Gothic, sans-serif" fill="#111">
    <text x="380" y="32" font-size="21" font-weight="700" text-anchor="middle">25_매산여고_2학기_기말_고2_수학II · q5 해설 시각화</text>
    <text x="380" y="59" font-size="15" text-anchor="middle" fill="#475569">문항 원문과 해설의 핵심 흐름</text>
    <rect x="18" y="82" width="350" height="300" rx="12" fill="#eff6ff" stroke="#93c5fd"/>
    <rect x="390" y="82" width="352" height="300" rx="12" fill="#f0fdf4" stroke="#86efac"/>
    <text x="34" y="112" font-size="17" font-weight="700" fill="#1d4ed8">문항 핵심</text>
    <text x="398" y="112" font-size="17" font-weight="700" fill="#15803d">해설 흐름</text>
    <text x="34" y="140" font-size="15">다항함수 f(x)에 대하여 함수 g(x)를</text>
    <text x="34" y="162" font-size="15">g(x)=(x^2-5x+2)f(x)라 하자. 곡선 y=f(x)</text>
    <text x="34" y="184" font-size="15">위의 점 (1,2)에서 접선의 방정식이</text>
    <text x="34" y="206" font-size="15">y=-2x+4일 때, g'(1)의 값은? [3.7점]</text>
    <text x="398" y="140" font-size="14">[키포인트] 접선의 기울기에서 f'(1)을 읽고</text>
    <text x="398" y="162" font-size="14">곱의 미분법을 적용한다. 조건 정리: 점 (1,2)가</text>
    <text x="398" y="184" font-size="14">곡선 위에 있으므로 f(1)=2, 접선 y=-2x+4의</text>
    <text x="398" y="206" font-size="14">기울기에서 f'(1)=-2이다. 풀이 방향:</text>
    <text x="398" y="228" font-size="14">g(x)=(x^2-5x+2)f(x)를 미분한다. 정석 풀이:</text>
    <text x="398" y="250" font-size="14">g'(x)=(2x-5)f(x)+(x^2-5x+2)f'(x)이다.</text>
    <text x="398" y="272" font-size="14">따라서 g'(1)=(-3)·2+(-2)·(-2)=-2이다.</text>
    <text x="398" y="294" font-size="14">따라서 정답은 ④이다.</text>
    <rect x="18" y="406" width="724" height="48" rx="10" fill="#fff7ed" stroke="#fdba74"/>
    <text x="380" y="436" font-size="17" text-anchor="middle" fill="#9a3412">결론: ④</text>
    <text x="380" y="482" font-size="11" text-anchor="middle" fill="#64748b">25_매산여고_2학기_기말_고2_수학II · q5 · source-bound solution visual</text>
  </g>
</svg>