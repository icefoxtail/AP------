<svg xmlns="http://www.w3.org/2000/svg" width="760" height="620" viewBox="0 0 760 620" role="img" aria-labelledby="title desc">
  <title id="title">25_매산여고_2학기_기말_고2_수학II · q16 해설 시각화</title>
  <desc id="desc">문항 16의 원문과 해설 흐름을 source-bound 텍스트 카드로 정리한 SVG</desc>
  <rect width="760" height="620" fill="#fff"/>
  <g font-family="Arial, sans-serif" fill="#111">
    <text x="380" y="32" font-size="21" font-weight="700" text-anchor="middle">25_매산여고_2학기_기말_고2_수학II · q16 해설 시각화</text>
    <text x="380" y="59" font-size="15" text-anchor="middle" fill="#475569">도함수의 활용 · 삼차함수와 실근의 개수</text>
    <rect x="18" y="82" width="350" height="350" rx="12" fill="#eff6ff" stroke="#93c5fd"/>
    <rect x="390" y="82" width="352" height="350" rx="12" fill="#f0fdf4" stroke="#86efac"/>
    <text x="34" y="112" font-size="17" font-weight="700" fill="#1d4ed8">문항 핵심</text>
    <text x="398" y="112" font-size="17" font-weight="700" fill="#15803d">해설 흐름</text>
    <text x="34" y="140" font-size="15">최고차항의 계수가 1인 삼차함수 f(x)가 다음 조건을 모두 만족시킬 때, f(-1)의 값</text>
    <text x="34" y="162" font-size="15">은? [4.4점] &amp;lt;조 건&amp;gt; (가) 함수 f(x)는 x=0에서 극댓값 30을 갖</text>
    <text x="34" y="184" font-size="15">는다. (나) 방정식 |f(x)|=2의 서로 다른 실근의 개수가 5이다.</text>
    <text x="398" y="140" font-size="14">[키포인트] |f(x)|=2의 실근 개수는 삼차함수와 두 직선 y=2, y=-2의 교점 개</text>
    <text x="398" y="162" font-size="14">수를 함께 세어 판단한다. 조건 정리: 최고차항이 1이고 x=0에서 극댓값 30을 가지므로</text>
    <text x="398" y="184" font-size="14"> f(x)=x^3+px^2+30으로 둘 수 있고 p 0이다. y=2와의 교점이 3개이고 y</text>
    <text x="398" y="206" font-size="14">=-2와의 교점이 2개가 되어야 총 5개이므로 극솟값은 -2이다. p=-3c2이므로 f(c</text>
    <text x="398" y="228" font-size="14">)=30-12c^3=-2이다. 따라서 c=4, p=-6이고 f(-1)=-1-6+30=23이</text>
    <text x="398" y="250" font-size="14">다. 따라서 정답은 ④이다.</text>
    <path d="M350 330 L410 330" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="18" y="352" width="724" height="48" rx="10" fill="#fff7ed" stroke="#fdba74"/>
    <text x="380" y="382" font-size="17" text-anchor="middle" fill="#9a3412">정답/결론: ④</text>
    <text x="380" y="427" font-size="13" text-anchor="middle" fill="#64748b">source: archive/exams/original/high/h2/2final/25_매산여고_2학기_기말_고2_수학II.js · q16 · archive/assets/images/25_매산여고_2학기_기말_고2_수학II/q16-solution.svg</text>
  </g>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#64748b"/></marker></defs>
</svg>