<svg xmlns="http://www.w3.org/2000/svg" width="760" height="620" viewBox="0 0 760 620" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet">
  <title id="title">25_매산여고_2학기_기말_고2_수학II · q16 해설 시각화</title>
  <desc id="desc">문항 16의 원문과 해설 흐름을 source-bound 텍스트 카드로 정리한 SVG</desc>
  <rect width="760" height="620" fill="#fff"/>
  <g font-family="Noto Sans KR, Pretendard, Apple SD Gothic Neo, Malgun Gothic, sans-serif" fill="#111">
    <text x="380" y="32" font-size="21" font-weight="700" text-anchor="middle">25_매산여고_2학기_기말_고2_수학II · q16 해설 시각화</text>
    <text x="380" y="59" font-size="15" text-anchor="middle" fill="#475569">문항 원문과 해설의 핵심 흐름</text>
    <rect x="18" y="82" width="350" height="350" rx="12" fill="#eff6ff" stroke="#93c5fd"/>
    <rect x="390" y="82" width="352" height="350" rx="12" fill="#f0fdf4" stroke="#86efac"/>
    <text x="34" y="112" font-size="17" font-weight="700" fill="#1d4ed8">문항 핵심</text>
    <text x="398" y="112" font-size="17" font-weight="700" fill="#15803d">해설 흐름</text>
    <text x="34" y="140" font-size="15">최고차항의 계수가 1인 삼차함수 f(x)가 다음</text>
    <text x="34" y="162" font-size="15">조건을 모두 만족시킬 때, f(-1)의 값은?</text>
    <text x="34" y="184" font-size="15">[4.4점] &lt;조 건&gt; (가) 함수 f(x)는 x=0에서</text>
    <text x="34" y="206" font-size="15">극댓값 30을 갖는다. (나) 방정식</text>
    <text x="34" y="228" font-size="15">|f(x)|=2의 서로 다른 실근의 개수가 5이다.</text>
    <text x="398" y="140" font-size="14">[키포인트] |f(x)|=2의 실근 개수는 삼차함수와</text>
    <text x="398" y="162" font-size="14">두 직선 y=2, y=-2의 교점 개수를 함께 세어</text>
    <text x="398" y="184" font-size="14">판단한다. 조건 정리: 최고차항이 1이고</text>
    <text x="398" y="206" font-size="14">x=0에서 극댓값 30을 가지므로</text>
    <text x="398" y="228" font-size="14">f(x)=x^3+px^2+30으로 둘 수 있고 p&lt;0이다.</text>
    <text x="398" y="250" font-size="14">풀이 방향: 다른 극값의 위치를 x=c라 하고</text>
    <text x="398" y="272" font-size="14">실근이 모두 5개가 되기 위한 극솟값을</text>
    <text x="398" y="294" font-size="14">결정한다. 정석 풀이: f'(x)=x(3x+2p)이므로</text>
    <text x="398" y="316" font-size="14">c=-2p / 3&gt;0이다. y=2와의 교점이 3개이고</text>
    <text x="398" y="338" font-size="14">y=-2와의 교점이 2개가 되어야 총 5개이므로</text>
    <text x="398" y="360" font-size="14">극솟값은 -2이다. p=-3c / 2이므로 f(c)=30-1</text>
    <text x="398" y="382" font-size="14">/ 2c^3=-2이다. 따라서 c=4, p=-6이고</text>
    <text x="398" y="404" font-size="14">f(-1)=-1-6+30=23이다. 따라서 정답은 ④이다.</text>
    <rect x="18" y="456" width="724" height="48" rx="10" fill="#fff7ed" stroke="#fdba74"/>
    <text x="380" y="486" font-size="17" text-anchor="middle" fill="#9a3412">결론: ④</text>
    <text x="380" y="532" font-size="11" text-anchor="middle" fill="#64748b">25_매산여고_2학기_기말_고2_수학II · q16 · source-bound solution visual</text>
  </g>
</svg>