<svg xmlns="http://www.w3.org/2000/svg" width="760" height="652" viewBox="0 0 760 652" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet">
  <title id="title">25_매산여고_2학기_기말_고2_수학II · q23 해설 시각화</title>
  <desc id="desc">문항 23의 원문과 해설 흐름을 source-bound 텍스트 카드로 정리한 SVG</desc>
  <rect width="760" height="652" fill="#fff"/>
  <g font-family="Noto Sans KR, Pretendard, Apple SD Gothic Neo, Malgun Gothic, sans-serif" fill="#111">
    <text x="380" y="32" font-size="21" font-weight="700" text-anchor="middle">25_매산여고_2학기_기말_고2_수학II · q23 해설 시각화</text>
    <text x="380" y="59" font-size="15" text-anchor="middle" fill="#475569">문항 원문과 해설의 핵심 흐름</text>
    <rect x="18" y="82" width="350" height="460" rx="12" fill="#eff6ff" stroke="#93c5fd"/>
    <rect x="390" y="82" width="352" height="460" rx="12" fill="#f0fdf4" stroke="#86efac"/>
    <text x="34" y="112" font-size="17" font-weight="700" fill="#1d4ed8">문항 핵심</text>
    <text x="398" y="112" font-size="17" font-weight="700" fill="#15803d">해설 흐름</text>
    <text x="34" y="140" font-size="15">[주관식3 (서술형)] [7점](부분점수 있음) 실수 a (a&gt;1)에 대하여 함수</text>
    <text x="34" y="162" font-size="15">f(x)를 f(x)=(x+1)(x-1)(x-a)라 하자. 함수 g(x)=x^2∫[0, x]</text>
    <text x="34" y="184" font-size="15">f(t)dt-∫[0, x] t^2f(t)dt가 오직 하나의 극값을 갖도록 하는 a의</text>
    <text x="34" y="206" font-size="15">최댓값을 k라고 할 때, 함수 h(x)=(x+1)(x-1)(x-k)의 그래프와 x축으로</text>
    <text x="34" y="228" font-size="15">둘러싸인 도형의 넓이를 구하는 과정을 서술하시오.</text>
    <text x="398" y="140" font-size="14">[키포인트] g'(x)를 인수분해하여 극값 개수를 결정하는 삼차식만 따로 본</text>
    <text x="398" y="162" font-size="14">뒤, 경계값에서 중근이 생기는 조건을 찾는다. 조건 정리:</text>
    <text x="398" y="184" font-size="14">f(x)=(x^2-1)(x-a)이고 I(x)=∫[0, x] f(t)dt라 하면</text>
    <text x="398" y="206" font-size="14">g(x)=x^2I(x)-∫[0, x] t^2f(t)dt이다. 풀이 방향: g'(x)를 계산해 a의</text>
    <text x="398" y="228" font-size="14">최대 허용값을 구한 뒤 h와 x축 사이의 넓이를 계산한다. 정석 풀이:</text>
    <text x="398" y="250" font-size="14">g'(x)=2xI(x)=x^2 / 6Q[a](x)이고 Q[a](x)=3x^3-4ax^2-6x+12a이다.</text>
    <text x="398" y="272" font-size="14">x=0의 인수 x^2에서는 부호가 바뀌지 않는다. 최대 경계에서 Q[a]가 중근</text>
    <text x="398" y="294" font-size="14">r을 가진다고 두면 Q[a](r)=Q[a]'(r)=0이다.</text>
    <text x="398" y="316" font-size="14">Q[a]'(r)=9r^2-8ar-6=0에서 a=9r^2-6 / 8r이고 이를 Q[a](r)=0에</text>
    <text x="398" y="338" font-size="14">대입하면 (r-1)(r+1)(r^2-6)=0이다. a&gt;1에 해당하는 경계는 r=√(6),</text>
    <text x="398" y="360" font-size="14">a=√(6)이다. 실제로 Q[√(6)](x)=3(x-√(6))^2(x+2√(6) / 3)이므로</text>
    <text x="398" y="382" font-size="14">부호가 바뀌는 근은 음의 단순근 하나뿐이다. 또 a&gt;√(6)이면 Q[a](0)&gt;0,</text>
    <text x="398" y="404" font-size="14">Q[a](√(6))=12(√(6)-a)&lt;0, Q[a](x)→∞ (x→∞)이므로 양의 근이 두 개 생겨</text>
    <text x="398" y="426" font-size="14">조건을 만족하지 못한다. 따라서 k=√(6)이다. 이제</text>
    <text x="398" y="448" font-size="14">h(x)=(x+1)(x-1)(x-√(6))의 영점은 -1,1,√(6)이다. 넓이는 ∫[-1,</text>
    <text x="398" y="470" font-size="14">1]h(x)dx-∫[1, √(6)]h(x)dx이다. 원시함수 H(x)=1 / 4x^4-√(6) /</text>
    <text x="398" y="492" font-size="14">3x^3-1 / 2x^2+√(6)x를 이용하면 두 넓이는 각각 4√(6) / 3, -1 / 4+2√(6)</text>
    <text x="398" y="514" font-size="14">/ 3이다. 따라서 전체 넓이는 2√(6)-1 / 4이다. 따라서 구하는 넓이는</text>
    <text x="398" y="536" font-size="14">2√(6)-1 / 4이다.</text>
    <path d="M350 474 L410 474" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="18" y="510" width="724" height="48" rx="10" fill="#fff7ed" stroke="#fdba74"/>
    <text x="380" y="540" font-size="17" text-anchor="middle" fill="#9a3412">결론: 2√(6)-1 / 4</text>
    <text x="380" y="612" font-size="11" text-anchor="middle" fill="#64748b">25_매산여고_2학기_기말_고2_수학II · q23 · source-bound solution visual</text>
  </g>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#64748b"/></marker></defs>
</svg>