<svg xmlns="http://www.w3.org/2000/svg" width="760" height="620" viewBox="0 0 760 620" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet">
  <title id="title">25_매산여고_2학기_기말_고2_수학II · q3 해설 시각화</title>
  <desc id="desc">문항 3의 원문과 해설 흐름을 source-bound 텍스트 카드로 정리한 SVG</desc>
  <rect width="760" height="620" fill="#fff"/>
  <g font-family="Noto Sans KR, Pretendard, Apple SD Gothic Neo, Malgun Gothic, sans-serif" fill="#111">
    <text x="380" y="32" font-size="21" font-weight="700" text-anchor="middle">25_매산여고_2학기_기말_고2_수학II · q3 해설 시각화</text>
    <text x="380" y="59" font-size="15" text-anchor="middle" fill="#475569">문항 원문과 해설의 핵심 흐름</text>
    <rect x="18" y="82" width="350" height="300" rx="12" fill="#eff6ff" stroke="#93c5fd"/>
    <rect x="390" y="82" width="352" height="300" rx="12" fill="#f0fdf4" stroke="#86efac"/>
    <text x="34" y="112" font-size="17" font-weight="700" fill="#1d4ed8">문항 핵심</text>
    <text x="398" y="112" font-size="17" font-weight="700" fill="#15803d">해설 흐름</text>
    <text x="34" y="140" font-size="15">곡선 y=x^2-4x+3과 x축으로 둘러싸인 도형의</text>
    <text x="34" y="162" font-size="15">넓이는? [3.6점]</text>
    <text x="398" y="140" font-size="14">[키포인트] 넓이는 함수값이 음수인 구간에서는</text>
    <text x="398" y="162" font-size="14">정적분의 부호를 바꾸어 계산한다. 조건 정리:</text>
    <text x="398" y="184" font-size="14">x^2-4x+3=(x-1)(x-3)이므로 교점은</text>
    <text x="398" y="206" font-size="14">x=1,3이고, 1&lt;x&lt;3에서 함수값은 음수이다.</text>
    <text x="398" y="228" font-size="14">풀이 방향: 넓이는 -∫[1,</text>
    <text x="398" y="250" font-size="14">3](x^2-4x+3)dx이다. 정석 풀이: -[1 /</text>
    <text x="398" y="272" font-size="14">3x^3-2x^2+3x][1]^3=4 / 3이다. 따라서</text>
    <text x="398" y="294" font-size="14">정답은 ①이다.</text>
    <rect x="18" y="406" width="724" height="48" rx="10" fill="#fff7ed" stroke="#fdba74"/>
    <text x="380" y="436" font-size="17" text-anchor="middle" fill="#9a3412">결론: ①</text>
    <text x="380" y="482" font-size="11" text-anchor="middle" fill="#64748b">25_매산여고_2학기_기말_고2_수학II · q3 · source-bound solution visual</text>
  </g>
</svg>