<title id="title">포물선과 x축 사이의 넓이</title><desc id="desc">f(x)=(x−1)(x−3)은 x=1,3에서 x축과 만나고 1&lt;x&lt;3에서 음수이다. 따라서 둘러싸인 넓이는 −∫₁³f(x)dx=4/3이다.</desc>
