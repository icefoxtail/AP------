<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 340" role="img" aria-labelledby="t d">
<title id="t">두 현의 수직이등분선으로 원의 중심 찾기</title>
<desc id="d">원호 위의 세 점 A, B, C를 잡아 현 AB와 BC를 긋고, 두 현의 수직이등분선을 연장하면 중심 O에서 만나는 것을 보여 준다.</desc>
<g fill="none" stroke="#111" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
  <circle cx="180" cy="160" r="105" stroke-width="1.8"/>
  <line x1="89.07" y1="107.5" x2="247.49" y2="79.57"/>
  <line x1="247.49" y1="79.57" x2="232.5" y2="250.93"/>
  <line x1="206.05" y1="307.72" x2="153.95" y2="12.28" stroke-dasharray="7 5"/>
  <line x1="30.57" y1="146.93" x2="329.43" y2="173.07" stroke-dasharray="7 5"/>
</g>
<g fill="#111"><circle cx="180" cy="160" r="4"/><circle cx="89.07" cy="107.5" r="3.2"/><circle cx="247.49" cy="79.57" r="3.2"/><circle cx="232.5" cy="250.93" r="3.2"/></g>
<g fill="#111" font-family="Arial, sans-serif" font-size="16">
  <text x="71.07" y="111.5">A</text><text x="255.49" y="75.57">B</text><text x="240.5" y="260.93">C</text><text x="188" y="152">O</text>
  <text x="70" y="322" font-size="14">두 현의 수직이등분선은 중심 O에서 만난다</text>
</g>
</svg>