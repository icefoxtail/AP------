<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 340" role="img" aria-labelledby="t d">
<title id="t">정사각형에서 각 EBF를 구하는 보조선</title>
<desc id="d">정사각형 ABCD에서 E와 F는 각각 AD와 CD의 중점이고, E에서 BF에 내린 수선의 발을 H로 잡은 풀이 그림이다.</desc>
<g fill="none" stroke="#111" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
  <polygon points="70,60 70,280 290,280 290,60"/>
  <line x1="70" y1="280" x2="180" y2="60"/>
  <line x1="70" y1="280" x2="290" y2="170"/>
  <line x1="180" y1="60" x2="246" y2="192" stroke-dasharray="7 5"/>
  <polyline points="240.63,181.27 229.9,186.63 235.27,197.37" stroke-width="1.8"/>
</g>
<g fill="#111" font-family="Arial, sans-serif" font-size="16">
  <text x="48" y="54">A</text><text x="48" y="300">B</text>
  <text x="300" y="300">C</text><text x="300" y="54">D</text>
  <text x="173" y="42">E</text><text x="304" y="174">F</text><text x="251" y="211">H</text>
  <text x="92" y="258" font-size="17">x</text>
  <text x="142" y="326" font-size="14">E에서 BF에 내린 수선 EH</text>
</g>
<g fill="#111"><circle cx="180" cy="60" r="3.2"/><circle cx="290" cy="170" r="3.2"/><circle cx="246" cy="192" r="3.2"/></g>
</svg>