<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 654" width="720" height="654" role="img" aria-labelledby="title desc"><title id="title">두 원과 옆면 직사각형으로 펼친 원기둥</title><desc id="desc">둘레가 2√2π cm인 원 두 개는 반지름이 √2 cm로 같다. 옆면 직사각형의 가로는 그 원둘레이고 세로는 높이 3√5 cm이다.</desc><rect width="720" height="654" fill="white" /><rect x="163" y="196" width="382.0879" height="288.4528" fill="#fae0c7" stroke="#28364b" stroke-width="2.7" /><circle cx="354.0440" cy="135.1888" r="60.8112" fill="#dcecf9" stroke="#205d9c" stroke-width="3.3" /><circle cx="354.0440" cy="545.2640" r="60.8112" fill="#dcecf9" stroke="#205d9c" stroke-width="3.3" /><line x1="354.0440" y1="135.1888" x2="414.8551" y2="135.1888" stroke="#205d9c" stroke-width="2.3" stroke-linecap="round" /><circle cx="354.0440" cy="135.1888" r="4.2" fill="#28364b" /><text x="381.4090" y="121.1888" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#205d9c" text-anchor="middle">√2</text><line x1="132.0000" y1="196.0000" x2="132.0000" y2="484.4528" stroke="#aa5411" stroke-width="1.7" stroke-linecap="round" /><line x1="126.0000" y1="196.0000" x2="138.0000" y2="196.0000" stroke="#aa5411" stroke-width="1.7" stroke-linecap="round" /><line x1="126.0000" y1="484.4528" x2="138.0000" y2="484.4528" stroke="#aa5411" stroke-width="1.7" stroke-linecap="round" /><text x="69.0000" y="350.2264" font-size="31" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#aa5411" text-anchor="middle">3√5</text><line x1="163.0000" y1="228.0000" x2="545.0879" y2="228.0000" stroke="#205d9c" stroke-width="1.7" stroke-linecap="round" /><line x1="163.0000" y1="222.0000" x2="163.0000" y2="234.0000" stroke="#205d9c" stroke-width="1.7" stroke-linecap="round" /><line x1="545.0879" y1="222.0000" x2="545.0879" y2="234.0000" stroke="#205d9c" stroke-width="1.7" stroke-linecap="round" /><text x="354.0440" y="265.0000" font-size="30" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fil