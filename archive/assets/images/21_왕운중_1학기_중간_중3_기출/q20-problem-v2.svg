<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 565" width="650" height="565" role="img" aria-labelledby="title desc"><title id="title">원기둥의 두 밑면 사이 높이와 반지름</title><desc id="desc">원기둥의 윗면 중심에서 둘레까지 표시한 파란 반지름은 √2 cm이다. 밑면 사이에 표시한 주황 높이는 3√5 cm이다.</desc><rect width="650" height="565" fill="white" /><path d="M 113.3776 109 L 113.3776 444.4102 A 121.6224 40 0 0 0 356.6224 444.4102 L 356.6224 109 Z" fill="none" /><path d="M 113.3776 444.4102 A 121.6224 40 0 0 1 356.6224 444.4102" fill="none" stroke="#617285" stroke-width="1.65" stroke-dasharray="7 6" /><path d="M 113.3776 444.4102 A 121.6224 40 0 0 0 356.6224 444.4102" fill="none" stroke="#28364b" stroke-width="3" /><line x1="113.3776" y1="109.0000" x2="113.3776" y2="444.4102" stroke="#28364b" stroke-width="3" stroke-linecap="round" /><line x1="356.6224" y1="109.0000" x2="356.6224" y2="444.4102" stroke="#28364b" stroke-width="3" stroke-linecap="round" /><ellipse cx="235" cy="109" rx="121.6224" ry="40" fill="#bfdaf0" stroke="#28364b" stroke-width="3" /><line x1="235.0000" y1="109.0000" x2="356.6224" y2="109.0000" stroke="#205d9c" stroke-width="3.2" stroke-linecap="round" /><circle cx="235" cy="109" r="4.2" fill="#28364b" /><line x1="301.8923" y1="109.0000" x2="376.6224" y2="70.0000" stroke="#205d9c" stroke-width="1.5" stroke-linecap="round" /><line x1="376.6224" y1="70.0000" x2="420.0000" y2="70.0000" stroke="#205d9c" stroke-width="1.5" stroke-linecap="round" /><text x="475.0000" y="77.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#205d9c" text-anchor="middle">√2 cm</text><line x1="430.0000" y1="109.0000" x2="430.0000" y2="444.4102" stroke="#aa5411" stroke-width="1.8" stroke-linecap="round" /><line x1="424.0000" y1="109.0000" x2="436.0000" y2="109.0000" stroke="#aa5411" stroke-width="1.8" stroke-linecap="round" /><line x1="356.6224" y1="109.0000" x2="430.0000" y2="109.0000" stroke="#aa5411" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="5 6" /><li