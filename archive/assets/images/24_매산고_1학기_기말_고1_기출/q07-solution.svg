<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" width="640" height="280" role="img" aria-labelledby="title desc">
  <title id="title">지름의 양 끝점으로 만든 원</title>
  <desc id="desc">지름 AB의 중점 M(1,4), 반지름 5인 원과 x축의 교점 (−2,0),(4,0)을 나타낸 그림</desc>
  <rect width="640" height="280" fill="#fff"/>
  <text x="320" y="28" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="21" font-weight="700" fill="#1e3a5f">AB가 지름  →  M(1,4), r=5  →  x축과의 교점</text>
  <rect x="18" y="45" width="350" height="215" rx="8" fill="#f8fafc" stroke="#dbe3ef"/>
  <line x1="42" y1="220" x2="344" y2="220" stroke="#0f172a" stroke-width="1.5"/>
  <line x1="188" y1="245" x2="188" y2="58" stroke="#0f172a" stroke-width="1.5"/>
  <circle cx="188" cy="122" r="76" fill="#dbeafe" fill-opacity=".62" stroke="#2563eb" stroke-width="2.5"/>
  <line x1="127" y1="76" x2="249" y2="168" stroke="#64748b" stroke-width="2.1" stroke-dasharray="6 4"/>
  <line x1="188" y1="122" x2="188" y2="220" stroke="#dc2626" stroke-width="2" stroke-dasharray="5 4"/>
  <circle cx="188" cy="122" r="4.5" fill="#1d4ed8"/><text x="195" y="116" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14" font-weight="700">M(1,4)</text>
  <circle cx="127" cy="76" r="4" fill="#334155"/><text x="108" y="68" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14" font-weight="700">A</text>
  <circle cx="249" cy="168" r="4" fill="#334155"/><text x="255" y="176" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14" font-weight="700">B</text>
  <circle cx="112" cy="220" r="4" fill="#dc2626"/><circle cx="264" cy="220" r="4" fill="#dc2626"/>
  <text x="75" y="246" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="13">−2</text><text x="267" y="246" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="13">4</text>
  <rect x="388" y="45" width="234" height="215" rx="8" fill="#f8fafc" stroke="#dbe3ef"/>
  <text x="405" y="75" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="17" font-weight="700" fill="#334155">계산 흐름</text>
  <text x="405" y="110" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="15">중점: M(1,4)</text>
  <text x="405" y="142" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="15">AB=10, r=5</text>
  <text x="405" y="174" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="15">y=0 대입</text>
  <text x="405" y="207" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="15">(x−1)²=9</text>
  <text x="405" y="240" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="17" font-weight="700" fill="#1d4ed8">거리 = 6</text>
</svg>
