<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" width="640" height="280" role="img" aria-labelledby="title desc">
  <title id="title">두 직선에 동시에 접하는 원의 중심</title>
  <desc id="desc">x축과 y=x에 동시에 접하는 원의 중심이 두 각의 이등분선 위에 놓임을 나타낸 그림</desc>
  <rect width="640" height="280" fill="#fff"/>
  <text x="320" y="28" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="21" font-weight="700" fill="#1e3a5f">두 접선까지의 거리 같음  →  |b|=|a−b|/√2</text>
  <rect x="18" y="45" width="350" height="215" rx="8" fill="#f8fafc" stroke="#dbe3ef"/>
  <line x1="42" y1="202" x2="344" y2="202" stroke="#0f172a" stroke-width="1.5"/>
  <line x1="172" y1="245" x2="172" y2="58" stroke="#0f172a" stroke-width="1.5"/>
  <line x1="72" y1="245" x2="320" y2="80" stroke="#64748b" stroke-width="2.1"/>
  <line x1="72" y1="160" x2="320" y2="244" stroke="#64748b" stroke-width="2.1"/>
  <line x1="172" y1="202" x2="267" y2="162" stroke="#2563eb" stroke-width="2.2" stroke-dasharray="6 4"/>
  <circle cx="267" cy="162" r="23" fill="#dbeafe" fill-opacity=".65" stroke="#2563eb" stroke-width="2"/>
  <circle cx="267" cy="162" r="3.8" fill="#1d4ed8"/><text x="276" y="154" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="13">C₁</text>
  <line x1="172" y1="202" x2="116" y2="104" stroke="#f97316" stroke-width="2.2" stroke-dasharray="6 4"/>
  <circle cx="116" cy="104" r="23" fill="#ffedd5" fill-opacity=".75" stroke="#f97316" stroke-width="2"/>
  <circle cx="116" cy="104" r="3.8" fill="#f97316"/><text x="91" y="96" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="13">C₂</text>
  <text x="296" y="92" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14">y=x</text><text x="309" y="232" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14">x축</text>
  <rect x="388" y="45" width="234" height="215" rx="8" fill="#f8fafc" stroke="#dbe3ef"/>
  <text x="405" y="75" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="17" font-weight="700" fill="#334155">비율 계산</text>
  <text x="405" y="110" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="15">b²=(a−b)²/2</text>
  <text x="405" y="143" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="15">t=b/a라 두면</text>
  <text x="405" y="176" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="15">t²+2t−1=0</text>
  <text x="405" y="210" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="15">t=−1±√2</text>
  <text x="405" y="244" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="17" font-weight="700" fill="#1d4ed8">두 값 모두 가능</text>
</svg>
