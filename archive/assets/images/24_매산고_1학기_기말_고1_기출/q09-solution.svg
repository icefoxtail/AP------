<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" width="640" height="280" role="img" aria-labelledby="title desc">
  <title id="title">외부점에서 그은 두 접선의 기울기</title>
  <desc id="desc">원점 중심 반지름 1/√2인 원과 외부점 P(2,1)에서 그은 두 접선을 나타낸 그림</desc>
  <rect width="640" height="280" fill="#fff"/>
  <text x="320" y="28" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="21" font-weight="700" fill="#1e3a5f">접선 조건  →  7m² − 8m + 1 = 0</text>
  <rect x="18" y="45" width="350" height="215" rx="8" fill="#f8fafc" stroke="#dbe3ef"/>
  <line x1="42" y1="180" x2="344" y2="180" stroke="#0f172a" stroke-width="1.4"/>
  <line x1="154" y1="245" x2="154" y2="58" stroke="#0f172a" stroke-width="1.4"/>
  <circle cx="154" cy="180" r="45" fill="#dbeafe" fill-opacity=".65" stroke="#2563eb" stroke-width="2.4"/>
  <line x1="290" y1="92" x2="135" y2="149" stroke="#0f766e" stroke-width="2.3"/>
  <line x1="290" y1="92" x2="183" y2="206" stroke="#f97316" stroke-width="2.3"/>
  <line x1="154" y1="180" x2="135" y2="149" stroke="#64748b" stroke-width="1.8" stroke-dasharray="5 4"/>
  <line x1="154" y1="180" x2="183" y2="206" stroke="#64748b" stroke-width="1.8" stroke-dasharray="5 4"/>
  <circle cx="154" cy="180" r="4" fill="#1d4ed8"/><text x="162" y="197" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14">O</text>
  <circle cx="290" cy="92" r="4.5" fill="#111827"/><text x="297" y="86" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14" font-weight="700">P(2,1)</text>
  <circle cx="135" cy="149" r="4" fill="#0f766e"/><circle cx="183" cy="206" r="4" fill="#f97316"/>
  <rect x="388" y="45" width="234" height="215" rx="8" fill="#f8fafc" stroke="#dbe3ef"/>
  <text x="405" y="75" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="17" font-weight="700" fill="#334155">거리 = 반지름</text>
  <text x="405" y="110" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="15">직선: y−1=m(x−2)</text>
  <text x="405" y="143" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="15">d(O,l)=1/√2</text>
  <text x="405" y="177" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="15">7m²−8m+1=0</text>
  <text x="405" y="211" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="15">두 근의 곱 = 1/7</text>
  <text x="405" y="244" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="17" font-weight="700" fill="#1d4ed8">m₁m₂=1/7</text>
</svg>
