<text x="526" y="98" class="sidehead">해설 핵심</text>
<text x="526" y="124" class="sidebody">AB=9</text>
<text x="526" y="145" class="sidebody">내분점 P는 A에서</text>
<text x="526" y="166" class="sidebody">AB의 2/3만큼 이동</text>
<text x="526" y="187" class="sidebody">P=−2+6=4</text>
<text x="526" y="208" class="sidebody">외분점 Q는 B 오른쪽</text>
<text x="526" y="229" class="sidebody">QB=AB=9</text>
<text x="526" y="250" class="sidebody">Q=7+9=16</text>
<text x="526" y="271" class="sidebody">a+b=4+16=20</text>
