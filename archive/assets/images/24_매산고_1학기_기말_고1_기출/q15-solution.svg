<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" width="640" height="280" role="img" aria-labelledby="title desc">
  <title id="title">원과 직선 사이 거리의 최솟값과 최댓값</title>
  <desc id="desc">점 (4,1)을 지나며 원점에서 가장 먼 직선 l과 중심 (−9,2), 반지름 11인 원을 나타낸 그림</desc>
  <rect width="640" height="280" fill="#fff"/>
  <text x="320" y="28" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="20" font-weight="700" fill="#1e3a5f">C에서 l까지 거리 d=3√17  →  d−r, d+r</text>
  <rect x="18" y="45" width="350" height="215" rx="8" fill="#f8fafc" stroke="#dbe3ef"/>
  <line x1="42" y1="174" x2="344" y2="174" stroke="#0f172a" stroke-width="1.4"/>
  <line x1="205" y1="245" x2="205" y2="58" stroke="#0f172a" stroke-width="1.4"/>
  <circle cx="110" cy="142" r="74" fill="#dbeafe" fill-opacity=".64" stroke="#2563eb" stroke-width="2.5"/>
  <line x1="46" y1="218" x2="330" y2="76" stroke="#dc2626" stroke-width="2.5"/>
  <line x1="110" y1="142" x2="207" y2="137" stroke="#64748b" stroke-width="1.9" stroke-dasharray="6 4"/>
  <circle cx="110" cy="142" r="4.5" fill="#1d4ed8"/><text x="56" y="130" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14" font-weight="700">C(−9,2)</text>
  <circle cx="300" cy="91" r="4" fill="#dc2626"/><text x="302" y="81" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14" font-weight="700">H(4,1)</text>
  <text x="274" y="70" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14" fill="#b91c1c">l: 4x+y−17=0</text>
  <rect x="388" y="45" width="234" height="215" rx="8" fill="#f8fafc" stroke="#dbe3ef"/>
  <text x="405" y="75" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="17" font-weight="700" fill="#334155">거리의 양 끝</text>
  <text x="405" y="110" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="15">d(C,l)=3√17</text>
  <text x="405" y="143" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="15">r=11, d&gt;r</text>
  <text x="405" y="177" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="15">m=d−r, M=d+r</text>
  <line x1="405" y1="190" x2="604" y2="190" stroke="#cbd5e1"/>
  <text x="405" y="222" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="15">mM=d²−r²</text>
  <text x="405" y="250" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="17" font-weight="700" fill="#1d4ed8">=32</text>
</svg>
