<text x="294.83" y="186.71" class="label" text-anchor="start">PM=5</text>
<text x="205.40" y="176.40" class="label" text-anchor="start">PA</text>
<text x="322.91" y="188.77" class="label" text-anchor="start">PB</text>
<text x="526" y="98" class="sidehead">해설 핵심</text>
<text x="526" y="124" class="sidebody">M을 원점으로 두면</text>
<text x="526" y="145" class="sidebody">A=(-c,0), B=(c,0)</text>
<text x="526" y="166" class="sidebody">PA²+PB²</text>
<text x="526" y="187" class="sidebody">=2(PM²+AM²)</text>
<text x="526" y="208" class="sidebody">AB=8 → AM=4</text>
<text x="526" y="229" class="sidebody">82=2(PM²+16)</text>
<text x="526" y="250" class="sidebody">PM²=25</text>
<text x="526" y="271" class="sidebody">P의 자취: 중심 M, 반지름 5</text>
<text x="526" y="292" class="sidebody">넓이 = 25π</text>
