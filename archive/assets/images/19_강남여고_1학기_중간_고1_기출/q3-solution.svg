<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="UNEQUAL_UNIT_DECLARED" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">y=−x²+2ax+b−7을 완전제곱식으로 고치면 y=−(x−a)²+a²+b−7이다. x²의 계수가 음수이므로 꼭짓점 (a, a²+b−7)에서 최댓값을 갖는다. x=3에서 최댓값 5이므로 a=3이고 a²+b−7=5에서 9+b−7=5이므로 b=3이다. 따라서 a+b=6이고 답은 ②이다. 그림은 꼭짓점이 V(3,5)인 위로 볼록한 포물선이다.</title><desc id="visual-desc">위로 볼록한 포물선이 있고 꼭짓점 V(3,5)가 가장 높은 점으로 표시되어 있으며 좌표가 적혀 있다.</desc><rect width="512" height="512" fill="#fff"/><g data-layer="30"><line id="x-axis" data-role="axis" stroke="#111" stroke-width="1.2" fill="none" data-axis="x" x1="32" y1="276.444444444" x2="480" y2="276.444444444"/></g><g data-layer="30"><line id="y-axis" data-role="axis" stroke="#111" stroke-width="1.2" fill="none" data-axis="y" x1="72" y1="480" x2="72" y2="32"/></g><g data-layer="40"><polyline id="f-piece-1-branch-0" data-role="curve" stroke="#111" stroke-width="2.1" fill="none" data-branch="PIECE_1" points="72,440 73.230769231,435.093388217 74.461538462,430.219706715 75.692307692,425.378955493 76.923076923,420.571134551 78.153846154,415.79624389 79.384615385,411.054283509 80.615384615,406.345253409 81.846153846,401.669153589 83.076923077,397.025984049 84.307692308,392.41574479 85.538461538,387.838435812 86.769230769,383.294057113 88,378.782608696 89.230769231,374.304090558 90.461538462,369.858502701 91.692307692,365