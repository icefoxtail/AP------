<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title desc" data-visual-type="manual-quadratic-interval" data-source-qid="19">
<title id="title">대칭축과 구간 끝점 비교</title>
<desc id="desc">대칭축 x=−1에서 왼쪽 끝 −8/3까지의 거리는 5/3이고 오른쪽 끝 1/3까지의 거리는 4/3이다. 위로 열린 포물선의 구간 최댓값은 왼쪽 끝에서 나온다.</desc>
<rect width="960" height="560" fill="#ffffff"/>
<text x="36" y="38" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="22" font-weight="700" fill="#202a35">대칭축과 구간 끝점 비교</text>
<text x="36" y="68" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="16" fill="#485866">비교용 g(x)=(x+1)²;  f(x)=g(x)+b−1은 세로로 이동한 그래프</text>
<g stroke="#263746" fill="none" stroke-width="1.7">
  <line x1="78" y1="390" x2="398" y2="390" data-geometry="x-axis"/>
  <line x1="230" y1="125" x2="230" y2="425" stroke="#6d8090" stroke-dasharray="6 5" data-geometry="symmetry-axis" data-model-x="-1"/>
</g>
<text x="401" y="396" font-family="Cambria Math, serif" font-size="17" fill="#263746">x</text>
<text x="236" y="132" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="15" fill="#485866">대칭축 x=−1</text>
<path d="M110 250 Q230 530 350 250" fill="none" stroke="#276c91" stroke-width="4" stroke-linecap="round" data-geometry="quadratic-curve" data-equation="g(x)=(x+1)^2" data-vertex-x="-1"/>
<circle cx="230" cy="390" r="6" fill="#276c91" data-fact-id="vertex" data-model-x="-1" data-model-y="0"/>
<circle cx="130" cy="292.777778" r="6" fill="#b8782d" data-fact-id="left-endpoint" data-model-x="-8/3" data-model-y="25/9"/>
<circle cx="310" cy="327.777778" r="6" fill="#6a7f8e" data-fact-id="right-endpoint" data-model-x="1/3" data-model-y="16/9"/>
<line x1="130" y1="292.78" x2="130" y2="423" stroke="#b8782d" stroke-width="1.5" stroke-dasharray="5 4"/>
<line x1="310" y1="327.78" x2="310" y2="423" stroke="#6a7f8e" stroke-width="1.5" stroke-dasharray="5 4"/>
<line x1="130" y1="423" x2="230" y2="423" stroke="#b8782d" stroke-width="3"/>
<line x1="230" y1="423" x2="310" y2="423" stroke="#6a7f8e" stroke-width="3"/>
<text x="119" y="447" font-family="Cambria Math, serif" font-size="16" fill="#263746">−8/3</text>
<text x="300" y="447" font-family="Cambria Math, serif" font-size="16" fill="#263746">1/3</text>
<text x="218" y="447" font-family="Cambria Math, serif" font-size="16" fill="#263746">−1</text>
<text x="94" y="278" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="15" fill="#945d20">거리 5/3</text>
<text x="306" y="314" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="15" fill="#536876">거리 4/3</text>
<rect x="445" y="112" width="480" height="330" rx="12" fill="#f4f7f9" stroke="#c4d0d8"/>
<text x="472" y="151" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="19" font-weight="700" fill="#263746">판정</text>
<text x="472" y="193" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="17" fill="#263746">ㄱ. 꼭짓점 x=−1에서 최솟값을 갖는다.</text>
<text x="472" y="235" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="17" fill="#263746">ㄴ. 5/3 &gt; 4/3이므로 최댓값은 x=−8/3에서 나온다.</text>
<text x="472" y="277" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="17" fill="#263746">ㄷ. b&gt;1이면 (x+1)²+b−1&gt;0이다.</text>
<line x1="472" y1="300" x2="895" y2="300" stroke="#d2dbe1"/>
<text x="472" y="341" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="18" font-weight="700" fill="#276c91">참: ㄱ, ㄷ</text>
<text x="472" y="386" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="16" fill="#485866">구간의 양 끝점은 대칭축에서</text>
<text x="472" y="411" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="16" fill="#485866">거리가 다르므로 최댓값 위치가 다르다.</text>
</svg>