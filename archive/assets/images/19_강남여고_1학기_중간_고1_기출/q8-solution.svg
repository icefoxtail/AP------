<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 470" role="img" aria-labelledby="title desc" data-visual-type="manual-function-graph" data-source-qid="8">
<title id="title">구간에서 이차함수의 최솟값과 최댓값</title>
<desc id="desc">f(x)=x²−2x의 꼭짓점은 (1,−1)이고, 구간 [1,7]에서 x=7일 때 최댓값 35를 갖는다.</desc>
<rect width="700" height="470" fill="#ffffff"/>
<text x="36" y="36" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="22" font-weight="700" fill="#202a35">꼭짓점과 구간 끝점</text>
<text x="36" y="66" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="16" fill="#485866">f(x)=(x−1)²−1,  1≤x≤7</text>
<g stroke="#263746" fill="none" stroke-width="2">
  <line x1="70" y1="330" x2="470" y2="330" data-geometry="x-axis"/>
  <line x1="70" y1="95" x2="70" y2="390" data-geometry="y-axis"/>
</g>
<text x="474" y="336" font-family="Cambria Math, serif" font-size="18" fill="#263746">x</text>
<text x="62" y="90" font-family="Cambria Math, serif" font-size="18" fill="#263746">y</text>
<polyline data-geometry="quadratic-curve" data-equation="y=x^2−2x" data-model-points="0,0;0.25,-0.4375;0.5,-0.75;0.75,-0.9375;1,-1;1.25,-0.9375;1.5,-0.75;1.75,-0.4375;2,0;2.25,0.5625;2.5,1.25;2.75,2.0625;3,3;3.25,4.0625;3.5,5.25;3.75,6.5625;4,8;4.25,9.5625;4.5,11.25;4.75,13.0625;5,15;5.25,17.0625;5.5,19.25;5.75,21.5625;6,24;6.25,26.5625;6.5,29.25;6.75,32.0625;7,35" points="70.000,330.000 83.750,332.625 97.500,334.500 111.250,335.625 125.000,336.000 138.750,335.625 152.500,334.500 166.250,332.625 180.000,330.000 193.750,326.625 207.500,322.500 221.250,317.625 235.000,312.000 248.750,305.625 262.500,298.500 276.250,290.625 290.000,282.000 303.750,272.625 317.500,262.500 331.250,251.625 345.000,240.000 358.750,227.625 372.500,214.500 386.250,200.625 400.000,186.000 413.750,170.625 427.500,154.500 441.250,137.625 455.000,120.000" fill="none" stroke="#276c91" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<line x1="125" y1="336" x2="125" y2="365" stroke="#5c7f93" stroke-width="1.5" stroke-dasharray="5 4"/>
<line x1="455" y1="120" x2="455" y2="365" stroke="#b8782d" stroke-width="1.5" stroke-dasharray="5 4"/>
<line x1="125" y1="365" x2="455" y2="365" stroke="#b8782d" stroke-width="4" stroke-linecap="round"/>
<path d="M125 365 l10 -6 v12 z M455 365 l-10 -6 v12 z" fill="#b8782d"/>
<circle cx="125" cy="336" r="6" fill="#276c91" data-fact-id="vertex" data-model-x="1" data-model-y="-1"/>
<circle cx="455" cy="120" r="6" fill="#b8782d" data-fact-id="right-endpoint" data-model-x="7" data-model-y="35"/>
<text x="137" y="327" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="16" fill="#1e5879">꼭짓점 (1, −1)</text>
<text x="363" y="105" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="16" fill="#8e571e">(7, 35)</text>
<text x="118" y="389" font-family="Cambria Math, serif" font-size="16" fill="#263746">1</text>
<text x="450" y="389" font-family="Cambria Math, serif" font-size="16" fill="#263746">7</text>
<text x="35" y="342" font-family="Cambria Math, serif" font-size="15" fill="#263746">0</text>
<rect x="505" y="112" width="165" height="250" rx="12" fill="#f4f7f9" stroke="#c4d0d8"/>
<text x="522" y="145" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="17" font-weight="700" fill="#263746">구간 [1, 7]</text>
<text x="522" y="185" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="16" fill="#263746">x=1에서</text>
<text x="522" y="210" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="16" font-weight="700" fill="#276c91">최솟값 −1</text>
<line x1="522" y1="230" x2="650" y2="230" stroke="#d2dbe1"/>
<text x="522" y="267" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="16" fill="#263746">x=7에서</text>
<text x="522" y="292" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="16" font-weight="700" fill="#a86822">최댓값 35</text>
<text x="522" y="332" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="14" fill="#485866">a=7, b=−1</text>
</svg>