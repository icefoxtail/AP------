<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 672 499" width="672" height="499" role="img" aria-labelledby="title desc"><title id="title">외부 점에서 원으로 향하는 접선과 할선</title><desc id="desc">P에서 그은 가로 접선은 T에서 원에 닿는다. 사선은 P, A, B 순서로 지나며 T에서 A와 B를 각각 이었다. PT는 6 cm, AB는 9 cm, BT는 8 cm이다.</desc><rect width="672" height="499" fill="white" /><circle cx="364.6526684163958" cy="249.5" r="171.99999999999997" fill="none" stroke="#205d9c" stroke-width="3.6" /><line x1="135.3473" y1="421.5000" x2="364.6527" y2="421.5000" stroke="#266f73" stroke-width="4.1" stroke-linecap="round" /><line x1="135.3473" y1="421.5000" x2="504.7837" y2="149.7639" stroke="#aa5411" stroke-width="4.1" stroke-linecap="round" /><line x1="227.7064" y1="353.5660" x2="364.6527" y2="421.5000" stroke="#586574" stroke-width="4.1" stroke-linecap="round" /><line x1="364.6527" y1="421.5000" x2="504.7837" y2="149.7639" stroke="#704895" stroke-width="4.1" stroke-linecap="round" /><line x1="135.3473" y1="448.5000" x2="364.6527" y2="448.5000" stroke="#266f73" stroke-width="1.7" stroke-linecap="round" /><line x1="135.3473" y1="443.0000" x2="135.3473" y2="454.0000" stroke="#266f73" stroke-width="1.7" stroke-linecap="round" /><line x1="364.6527" y1="443.0000" x2="364.6527" y2="454.0000" stroke="#266f73" stroke-width="1.7" stroke-linecap="round" /><text x="250.0000" y="477.5000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#266f73" text-anchor="middle">6 cm</text><line x1="209.9308" y1="329.3993" x2="487.0081" y2="125.5972" stroke="#aa5411" stroke-width="1.7" stroke-linecap="round" /><line x1="206.6720" y1="324.9687" x2="213.1897" y2="333.8299" stroke="#aa5411" stroke-width="1.7" stroke-linecap="round" /><line x1="483.7492" y1="121.1667" x2="490.2670" y2="130.0278" stroke="#aa5411" stroke-width="1.7" stroke-linecap="round" /><text x="333.0639" y="214.5538" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#aa5411" text-anchor="middle">9 cm</text><line x1="387.7610" y1="433.4167" x2="527.8920" y2="161.6806" stroke="#704895" stroke-width="1.7" stroke-linecap="round" /><line x1="382.8727" y1="430.8958" x2="392.6493" y2="435.9375" stroke="#704895" stroke-width="1.7" stroke-linecap="round" /><line x1="523.0037" y1="159.1597" x2="532.7803" y2="164.2014" stroke="#704895" stroke-width="1.7" stroke-linecap="round" /><text x="509.3757" y="332.1319" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#704895" text-anchor="middle">8 cm</text><circle cx="135.34733158360422" cy="421.5" r="4.9" fill="#28364b" /><text x="112.3473" y="436.5000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">P</text><circle cx="227.7064255857008" cy="353.5659722222222" r="4.9" fill="#28364b" /><text x="211.7064" y="366.5660" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">A</text><circle cx="504.7837075919906" cy="149.7638888888888" r="4.9" fill="#28364b" /><text x="515.7837" y="134.7639" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">B</text><circle cx="364.6526684163958" cy="421.5" r="4.9" fill="#28364b" /><text x="368.6527" y="447.5000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">T</text></svg>
