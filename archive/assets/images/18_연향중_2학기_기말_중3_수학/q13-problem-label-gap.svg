<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 698 513" width="698" height="513" role="img" aria-labelledby="title desc"><title id="title">원 밖 두 할선과 원 안의 교점</title><desc id="desc">외부의 P에서 각각 P-A-B와 P-C-D 순서로 두 할선이 지나간다. P에서 두 할선이 이루는 각은 50도이다. 현 AD와 CB가 Q에서 교차하며 작은 호 AC와 BD의 길이비는 1 대 3이다.</desc><rect width="698" height="513" fill="white" /><circle cx="421.72909387956037" cy="256.5" r="179.0" fill="none" stroke="#205d9c" stroke-width="3.6" /><line x1="97.2709" y1="256.5000" x2="468.0577" y2="83.5993" stroke="#266f73" stroke-width="4.1" stroke-linecap="round" /><line x1="97.2709" y1="256.5000" x2="468.0577" y2="429.4007" stroke="#aa5411" stroke-width="4.1" stroke-linecap="round" /><line x1="259.5000" y1="180.8513" x2="468.0577" y2="429.4007" stroke="#586574" stroke-width="4.1" stroke-linecap="round" /><line x1="468.0577" y1="83.5993" x2="259.5000" y2="332.1487" stroke="#586574" stroke-width="4.1" stroke-linecap="round" /><path d="M 259.500 332.149 A 179.0000 179.0000 0 0 1 259.500 180.851" fill="none" stroke="#266f73" stroke-width="4.4" stroke-linecap="round" /><path d="M 468.058 83.599 A 179.0000 179.0000 0 0 1 468.058 429.401" fill="none" stroke="#aa5411" stroke-width="4.4" stroke-linecap="round" /><path d="M 136.2421 274.6726 A 43 43 0 0 0 136.2421 238.3274" stroke="#704895" stroke-width="2.25" fill="none" /><text x="184.2709" y="264.5000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#704895" text-anchor="middle">50°</text><circle cx="259.50000000000006" cy="180.8513311484148" r="4.9" fill="#28364b" /><text x="248.5000" y="163.8513" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">A</text><circle cx="468.05770295291154" cy="83.59927709425679" r="4.9" fill="#28364b" /><text x="482.0577" y="71.5993" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">B</text><circle cx="259.5" cy="332.14866885158517" r="4.9" fill="#28364b" /><text x="241.5000" y="354.1487" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">C</text><circle cx="468.05770295291165" cy="429.4007229057432" r="4.9" fill="#28364b" /><text x="481.0577" y="454.4007" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">D</text><circle cx="97.27090612043966" cy="256.5" r="4.9" fill="#28364b" /><text x="79.2709" y="264.5000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">P</text><circle cx="322.97677013241736" cy="256.49999999999994" r="4.9" fill="#28364b" /><text x="320.9768" y="227.5000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">Q</text><text x="349.0000" y="499.0000" font-size="30" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">호 AC : 호 BD = 1 : 3</text></svg>
