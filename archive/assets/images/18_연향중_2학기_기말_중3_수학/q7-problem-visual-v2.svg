<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 585 501" width="585" height="501" role="img" aria-labelledby="title desc"><title id="title">실 끝의 추가 움직이는 원호</title><desc id="desc">O에서 세로로 늘어진 실의 끝은 A이고 오른쪽으로 끌어 올린 실의 끝은 B이다. 실 길이는 12 cm이고 OA와 OB 사이의 각은 30도이다.</desc><rect width="585" height="501" fill="white" /><path d="M 119.500 371.145 A 346.0000 346.0000 0 0 0 465.500 371.145" fill="none" stroke="#586574" stroke-width="2.8" stroke-linecap="round" stroke-dasharray="6 7" /><line x1="292.5000" y1="71.5000" x2="119.5000" y2="371.1448" stroke="#586574" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="7 6" /><line x1="292.5000" y1="71.5000" x2="292.5000" y2="417.5000" stroke="#205d9c" stroke-width="3.4" stroke-linecap="round" stroke-dasharray="8 6" /><line x1="292.5000" y1="71.5000" x2="465.5000" y2="371.1448" stroke="#aa5411" stroke-width="4.6" stroke-linecap="round" /><path d="M 292.5000 118.5000 A 47 47 0 0 0 316.0000 112.2032" stroke="#28364b" stroke-width="2.25" fill="none" /><text x="310.3938" y="150.0126" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">30°</text><line x1="317.6147" y1="57.0000" x2="490.6147" y2="356.6448" stroke="#aa5411" stroke-width="1.7" stroke-linecap="round" /><line x1="322.3779" y1="54.2500" x2="312.8516" y2="59.7500" stroke="#aa5411" stroke-width="1.7" stroke-linecap="round" /><line x1="495.3779" y1="353.8948" x2="485.8516" y2="359.3948" stroke="#aa5411" stroke-width="1.7" stroke-linecap="round" /><text x="435.2917" y="196.8224" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#aa5411" text-anchor="middle">12 cm</text><circle cx="119.5" cy="371.14478970941576" r="12" fill="#586574" /><circle cx="292.5" cy="417.5" r="12" fill="#205d9c" /><circle cx="465.5" cy="371.14478970941576" r="12" fill="#aa5411" /><circle cx="292.5" cy="71.5" r="4.9" fill="#28364b" /><text x="288.5000" y="53.5000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">O</text><text x="292.5000" y="454.5000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">A</text><text x="488.5000" y="397.1448" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">B</text></svg>
