<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 571 519" width="571" height="519" role="img" aria-labelledby="title desc"><title id="title">원 안의 교점에서 이루는 두 현</title><desc id="desc">원의 두 현 AB와 CD가 P에서 교차한다. B와 C를 연결한 현이 원의 위쪽에 있다. 원의 중심은 O이다.</desc><rect width="571" height="519" fill="white" /><circle cx="285.5" cy="259.5" r="182.0" fill="none" stroke="#205d9c" stroke-width="3.6" /><line x1="110.5504" y1="309.6660" x2="392.4769" y2="112.2589" stroke="#266f73" stroke-width="4.1" stroke-linecap="round" /><line x1="127.8834" y1="168.5000" x2="464.7350" y2="227.8960" stroke="#aa5411" stroke-width="4.1" stroke-linecap="round" /><line x1="127.8834" y1="168.5000" x2="392.4769" y2="112.2589" stroke="#586574" stroke-width="4.1" stroke-linecap="round" /><circle cx="110.55037133922596" cy="309.66599875869383" r="4.9" fill="#28364b" /><text x="94.5504" y="334.6660" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">A</text><circle cx="392.47691591723014" cy="112.25890702375958" r="4.9" fill="#28364b" /><text x="405.4769" y="96.2589" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">B</text><circle cx="127.88337651123217" cy="168.5" r="4.9" fill="#28364b" /><text x="111.8834" y="153.5000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">C</text><circle cx="464.73501104822185" cy="227.89603166461868" r="4.9" fill="#28364b" /><text x="484.7350" y="234.8960" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">D</text><circle cx="285.5" cy="259.5" r="4.9" fill="#28364b" /><text x="290.5000" y="284.5000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">O</text><circle cx="275.08727446687243" cy="194.45601887503503" r="4.9"