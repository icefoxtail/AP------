<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 571 519" width="571" height="519" role="img" aria-labelledby="title desc"><title id="title">같은 두 호 아래 교차하는 현</title><desc id="desc">원 위의 M은 위쪽 두 호 AM과 MB의 공통 끝점이다. 현 MP와 MQ가 가로 현 AB와 각각 R, S에서 교차한다. 각 ARM은 110도이며 P와 Q를 현으로 연결했다.</desc><rect width="571" height="519" fill="white" /><circle cx="294.02599137966484" cy="259.5" r="182.0" fill="none" stroke="#205d9c" stroke-width="3.6" /><path d="M 129.078 182.583 A 182.0000 182.0000 0 0 1 294.026 77.500" fill="none" stroke="#277339" stroke-width="4.4" stroke-linecap="round" /><path d="M 294.026 77.500 A 182.0000 182.0000 0 0 1 458.974 182.583" fill="none" stroke="#277339" stroke-width="4.4" stroke-linecap="round" /><line x1="129.0780" y1="182.5835" x2="458.9740" y2="182.5835" stroke="#586574" stroke-width="4.1" stroke-linecap="round" /><line x1="294.0260" y1="77.5000" x2="177.0386" y2="398.9201" stroke="#266f73" stroke-width="4.1" stroke-linecap="round" /><line x1="294.0260" y1="77.5000" x2="437.4439" y2="371.5504" stroke="#aa5411" stroke-width="4.1" stroke-linecap="round" /><line x1="177.0386" y1="398.9201" x2="437.4439" y2="371.5504" stroke="#586574" stroke-width="4.1" stroke-linecap="round" /><line x1="189.1028" y1="102.2482" x2="196.6250" y2="114.0557" stroke="#277339" stroke-width="2.6" stroke-linecap="round" /><line x1="195.8499" y1="97.9498" x2="203.3721" y2="109.7573" stroke="#277339" stroke-width="2.6" stroke-linecap="round" /><line x1="392.2021" y1="97.9498" x2="384.6799" y2="109.7573" stroke="#277339" stroke-width="2.6" stroke-linecap="round" /><line x1="398.9492" y1="102.2482" x2="391.4270" y2="114.0557" stroke="#277339" stroke-width="2.6" stroke-linecap="round" /><path d="M 218.7787 182.5835 A 37 37 0 0 1 268.4335 147.8148" stroke="#266f73" stroke-width="2.25" fill="none" /><text x="212.9377" y="145.2535" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#266f73" text-anchor="middle">110°</text><circle cx="294.0259