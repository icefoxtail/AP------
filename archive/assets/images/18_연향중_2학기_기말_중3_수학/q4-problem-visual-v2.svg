<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 665 440" width="665" height="440" role="img" aria-labelledby="title desc"><title id="title">반원과 지름 위로 내린 수선</title><desc id="desc">반원의 지름 양 끝은 A와 B이고 중점은 O이다. 호 위의 C에서 지름으로 내린 수선의 발 D가 O와 B 사이에 있다. 수선 CD와 현 CB 사이의 C의 각은 x이다.</desc><rect width="665" height="440" fill="white" /><path d="M 85.000 354.750 A 247.5 247.5 0 0 1 580.000 354.750 Z" fill="none" stroke="none" /><path d="M 85.000 354.750 A 247.5000 247.5000 0 0 1 580.000 354.750" fill="none" stroke="#205d9c" stroke-width="4.4" stroke-linecap="round" /><line x1="85.0000" y1="354.7500" x2="580.0000" y2="354.7500" stroke="#586574" stroke-width="4.1" stroke-linecap="round" /><line x1="85.0000" y1="354.7500" x2="401.8000" y2="117.1500" stroke="#586574" stroke-width="4.1" stroke-linecap="round" /><line x1="580.0000" y1="354.7500" x2="401.8000" y2="117.1500" stroke="#aa5411" stroke-width="4.1" stroke-linecap="round" /><line x1="401.8000" y1="117.1500" x2="401.8000" y2="354.7500" stroke="#266f73" stroke-width="4.1" stroke-linecap="round" /><line x1="401.8000" y1="338.7500" x2="417.8000" y2="338.7500" stroke="#586574" stroke-width="1.8" stroke-linecap="round" /><line x1="417.8000" y1="338.7500" x2="417.8000" y2="354.7500" stroke="#586574" stroke-width="1.8" stroke-linecap="round" /><path d="M 401.8000 156.1500 A 39 39 0 0 0 425.2000 148.3500" stroke="#aa5411" stroke-width="2.25" fill="none" /><text x="426.6197" y="187.6091" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#aa5411" text-anchor="middle">x</text><circle cx="85.0" cy="354.75" r="4.9" fill="#28364b" /><text x="73.0000" y="382.7500" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">A</text><circle cx="580.0" cy="354.75" r="4.9" fill="#28364b" /><text x="593.0000" y="382.7500" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">B</text><circle cx="401.8" cy="117.14999999999999" r="4.9" fill="#28364b" /><text x="410.8000" y="98.1500" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">C</text><circle cx="401.8" cy="354.75" r="4.9" fill="#28364b" /><text x="404.8000" y="383.7500" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">D</text><circle cx="332.5" cy="354.75" r="4.9" fill="#28364b" /><text x="332.5000" y="383.7500" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">O</text></svg>
