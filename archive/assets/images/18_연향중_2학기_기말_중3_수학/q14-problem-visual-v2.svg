<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 670 916" width="670" height="916" role="img" aria-labelledby="title desc"><title id="title">원에 내접하는 사각형을 고르는 다섯 그림</title><desc id="desc">①의 A는 대각선으로 두 35도 각으로 나뉘고 D에는 20도가 표시되어 있다. ②의 P에서 AD와 BC를 잇는 두 직선이 만난다. PA, AD, PB, BC 길이는 각각 3, 4, 2, 6이다. ③의 A는 70도이며 D와 B에서 삼각형 DBC 안쪽 각은 60도와 50도이다. ④의 교점에서 각 꼭짓점까지의 거리는 A와 B가 4와 5, C와 D가 각각 3이다. ⑤의 A와 C에 표시한 바깥각은 60도와 120도이다.</desc><rect width="670" height="916" fill="white" /><rect x="13" y="14" width="315" height="283" rx="14" fill="#fbfcfe" stroke="#dbe5ee" stroke-width="1.2" /><text x="35.0000" y="48.0000" font-size="31" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#205d9c" text-anchor="middle">1</text><circle cx="35" cy="37" r="20" fill="none" stroke="#205d9c" stroke-width="1.7" /><polygon points="85.1509,70.5000 69.6654,247.5000 183.7860,241.3410 270.3346,156.8525" fill="#e7f1fc" /><line x1="85.1509" y1="70.5000" x2="69.6654" y2="247.5000" stroke="#586574" stroke-width="3.65" stroke-linecap="round" /><line x1="69.6654" y1="247.5000" x2="183.7860" y2="241.3410" stroke="#586574" stroke-width="3.65" stroke-linecap="round" /><line x1="183.7860" y1="241.3410" x2="270.3346" y2="156.8525" stroke="#586574" stroke-width="3.65" stroke-linecap="round" /><line x1="270.3346" y1="156.8525" x2="85.1509" y2="70.5000" stroke="#586574" stroke-width="3.65" stroke-linecap="round" /><line x1="85.1509" y1="70.5000" x2="183.7860" y2="241.3410" stroke="#205d9c" stroke-width="3.25" stroke-linecap="round" /><line x1="69.6654" y1="247.5000" x2="270.3346" y2="156.8525" stroke="#266f73" stroke-width="3.25" stroke-linecap="round" /><circle cx="85.15093188670761" cy="70.5" r="3.8" fill="#28364b" /><text x="73.1509" y="55.5000" font-size="30" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">A</text><circle cx="69.66543844261905" cy="247.5" r="3.8" fill="#28364b" /><text x="50.6654" y="258.5000" font-size="30