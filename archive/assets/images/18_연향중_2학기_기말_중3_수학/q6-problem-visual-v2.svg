<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 678 452" width="678" height="452" role="img" aria-labelledby="title desc"><title id="title">두 직각삼각형의 변이 만나는 점</title><desc id="desc">삼각형 BAC는 A에서 직각이고 C에서 45도이다. 삼각형 BCD는 C에서 직각이며 D에서 60도이고 수직변 CD의 길이는 10이다. 사선 AC와 BD는 E에서 교차한다.</desc><rect width="678" height="452" fill="white" /><polygon points="85.0000,372.6470 339.0000,118.6470 593.0000,372.6470" fill="none" /><line x1="85.0000" y1="372.6470" x2="593.0000" y2="372.6470" stroke="#586574" stroke-width="4.1" stroke-linecap="round" /><line x1="85.0000" y1="372.6470" x2="339.0000" y2="118.6470" stroke="#205d9c" stroke-width="4.1" stroke-linecap="round" /><line x1="339.0000" y1="118.6470" x2="593.0000" y2="372.6470" stroke="#205d9c" stroke-width="4.1" stroke-linecap="round" /><line x1="85.0000" y1="372.6470" x2="593.0000" y2="79.3530" stroke="#aa5411" stroke-width="4.1" stroke-linecap="round" /><line x1="593.0000" y1="372.6470" x2="593.0000" y2="79.3530" stroke="#aa5411" stroke-width="4.1" stroke-linecap="round" /><line x1="327.6863" y1="129.9607" x2="339.0000" y2="141.2744" stroke="#586574" stroke-width="1.8" stroke-linecap="round" /><line x1="339.0000" y1="141.2744" x2="350.3137" y2="129.9607" stroke="#586574" stroke-width="1.8" stroke-linecap="round" /><line x1="577.0000" y1="372.6470" x2="577.0000" y2="356.6470" stroke="#586574" stroke-width="1.8" stroke-linecap="round" /><line x1="577.0000" y1="356.6470" x2="593.0000" y2="356.6470" stroke="#586574" stroke-width="1.8" stroke-linecap="round" /><path d="M 564.7157 344.3627 A 40 40 0 0 0 553.0000 372.6470" stroke="#205d9c" stroke-width="2.25" fill="none" /><text x="523.7090" y="354.9457" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#205d9c" text-anchor="middle">45°</text><path d="M 554.0289 101.8530 A 45 45 0 0 0 593.0000 124.3530" stroke="#aa5411" stroke-width="2.25" fill="none" /><text x="546.0000" y="154.9030" font-size="28" font-family="Malgun Gothic, Cambria Math,