<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 514" width="680" height="514" role="img" aria-labelledby="title desc"><title id="title">사각형 네 변에 접하는 원</title><desc id="desc">원 O에 외접하는 사각형 ABCD의 A는 왼쪽 위, B는 왼쪽 아래, C는 오른쪽 아래, D는 오른쪽 위에 있다. 변 AB, BC, CD, DA의 길이는 순서대로 4, x+4, 3x+1, 5이다.</desc><rect width="680" height="514" fill="white" /><circle cx="317.4197808667623" cy="285.8669222343921" r="148.63307776560788" fill="none" stroke="#205d9c" stroke-width="3.6" /><line x1="136.5932" y1="219.9835" x2="212.2207" y2="434.5000" stroke="#266f73" stroke-width="4.1" stroke-linecap="round" /><line x1="212.2207" y1="434.5000" x2="553.4068" y2="434.5000" stroke="#aa5411" stroke-width="4.1" stroke-linecap="round" /><line x1="553.4068" y1="434.5000" x2="381.4674" y2="75.5000" stroke="#266f73" stroke-width="4.1" stroke-linecap="round" /><line x1="381.4674" y1="75.5000" x2="136.5932" y2="219.9835" stroke="#aa5411" stroke-width="4.1" stroke-linecap="round" /><line x1="113.0155" y1="228.2957" x2="188.6431" y2="442.8123" stroke="#266f73" stroke-width="1.7" stroke-linecap="round" /><line x1="118.2026" y1="226.4670" x2="107.8284" y2="230.1244" stroke="#266f73" stroke-width="1.7" stroke-linecap="round" /><line x1="193.8302" y1="440.9836" x2="183.4560" y2="444.6410" stroke="#266f73" stroke-width="1.7" stroke-linecap="round" /><text x="128.1947" y="351.5338" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#266f73" text-anchor="middle">4</text><line x1="212.2207" y1="459.5000" x2="553.4068" y2="459.5000" stroke="#aa5411" stroke-width="1.7" stroke-linecap="round" /><line x1="212.2207" y1="454.0000" x2="212.2207" y2="465.0000" stroke="#aa5411" stroke-width="1.7" stroke-linecap="round" /><line x1="553.4068" y1="454.0000" x2="553.4068" y2="465.0000" stroke="#aa5411" stroke-width="1.7" stroke-linecap="round" /><text x="382.8138" y="491.5000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#aa5411" text-anchor="middle">x + 4</text><line x1="575.9542" y1="423.7012" x2="404.0148" y2="64.7012" stroke="#266f73" stroke-width="1.7" stroke-linecap="round" /><line x1="570.9938" y1="426.0769" x2="580.9147" y2="421.3254" stroke="#266f73" stroke-width="1.7" stroke-linecap="round" /><line x1="399.0544" y1="67.0769" x2="408.9752" y2="62.3254" stroke="#266f73" stroke-width="1.7" stroke-linecap="round" /><text x="545.0001" y="225.8520" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#266f73" text-anchor="middle">3x + 1</text><line x1="368.7632" y1="53.9686" x2="123.8889" y2="198.4520" stroke="#aa5411" stroke-width="1.7" stroke-linecap="round" /><line x1="371.5581" y1="58.7055" x2="365.9682" y2="49.2316" stroke="#aa5411" stroke-width="1.7" stroke-linecap="round" /><line x1="126.6839" y1="203.1889" x2="121.0940" y2="193.7151" stroke="#aa5411" stroke-width="1.7" stroke-linecap="round" /><text x="234.1300" y="113.5401" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#aa5411" text-anchor="middle">5</text><circle cx="136.5931567926927" cy="219.98346577800558" r="4.9" fill="#28364b" /><text x="151.5932" y="206.9835" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">A</text><circle cx="212.22072898001335" cy="434.5" r="4.9" fill="#28364b" /><text x="199.2207" y="458.5000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">B</text><circle cx="553.4068432073072" cy="434.5" r="4.9" fill="#28364b" /><text x="566.4068" y="458.5000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">C</text><circle cx="381.4673946816964" cy="75.5" r="4.9" fill="#28364b" /><text x="391.4674" y="58.5000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text