<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 565 526" width="565" height="526" role="img" aria-labelledby="title desc"><title id="title">대칭으로 접은 원과 색칠한 삼각형</title><desc id="desc">원의 점 P와 중심 O는 가로 접는 선 AB를 사이에 두고 있다. PO는 AB와 M에서 만나고 Q는 PM의 중점이다. A, P, Q를 이은 삼각형을 칠했다.</desc><rect width="565" height="526" fill="white" /><path d="M 121.852 170.250 A 185.5 185.5 0 1 0 443.148 170.250 Z" fill="#e1eefb" stroke="none" /><path d="M 121.852 170.250 A 185.5 185.5 0 1 0 443.148 170.250" fill="none" stroke="#205d9c" stroke-width="4.4" /><path d="M 121.852 170.250 A 185.5000 185.5000 0 0 1 443.148 170.250" fill="none" stroke="#586574" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="7 6" /><path d="M 121.852 170.250 A 185.5 185.5 0 0 0 443.148 170.250 Z" fill="#fbe6ce" stroke="none" /><path d="M 121.852 170.250 A 185.5 185.5 0 0 0 443.148 170.250" fill="none" stroke="#aa5411" stroke-width="4.0" /><line x1="121.8523" y1="170.2500" x2="443.1477" y2="170.2500" stroke="#704895" stroke-width="4" stroke-linecap="round" /><polygon points="121.8523,170.2500 282.5000,77.5000 282.5000,123.8750" fill="#f6d499" /><line x1="282.5000" y1="263.0000" x2="282.5000" y2="77.5000" stroke="#586574" stroke-width="4.1" stroke-linecap="round" /><line x1="121.8523" y1="170.2500" x2="282.5000" y2="77.5000" stroke="#277339" stroke-width="4.1" stroke-linecap="round" /><line x1="121.8523" y1="170.2500" x2="282.5000" y2="123.8750" stroke="#277339" stroke-width="4.1" stroke-linecap="round" /><line x1="275.5000" y1="99.7600" x2="289.5000" y2="99.7600" stroke="#277339" stroke-width="2.5" stroke-linecap="round" /><line x1="275.5000" y1="147.9900" x2="289.5000" y2="147.9900" stroke="#277339" stroke-width="2.5" stroke-linecap="round" /><circle cx="121.85228759798665" cy="170.25" r="4.9" fill="#28364b" /><text x="102.8523" y="177.2500" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">A</text><circle cx="443.1477124020133" cy