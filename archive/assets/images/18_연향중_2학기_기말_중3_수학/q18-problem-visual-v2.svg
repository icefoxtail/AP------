<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 695 443" width="695" height="443" role="img" aria-labelledby="title desc"><title id="title">원 바깥의 점에서 그은 두 할선</title><desc id="desc">P에서 나온 위쪽 할선은 A와 B를 지나고 PA는 6 cm, AB는 8 cm이다. 가로 할선은 C와 D를 지나며 PC는 7 cm이다. 중심 O에서 가로 할선에 내린 수선의 발은 E이다.</desc><rect width="695" height="443" fill="white" /><circle cx="432.1334819912053" cy="218.50000000000003" r="144.0" fill="none" stroke="#205d9c" stroke-width="3.6" /><line x1="106.8665" y1="334.2982" x2="533.9623" y2="116.6821" stroke="#266f73" stroke-width="4.1" stroke-linecap="round" /><line x1="106.8665" y1="334.2982" x2="517.7301" y2="334.2982" stroke="#aa5411" stroke-width="4.1" stroke-linecap="round" /><line x1="432.1335" y1="218.5000" x2="432.1335" y2="334.2982" stroke="#586574" stroke-width="4.1" stroke-linecap="round" /><line x1="432.1335" y1="318.2982" x2="448.1335" y2="318.2982" stroke="#586574" stroke-width="1.8" stroke-linecap="round" /><line x1="448.1335" y1="318.2982" x2="448.1335" y2="334.2982" stroke="#586574" stroke-width="1.8" stroke-linecap="round" /><line x1="97.3327" y1="315.5871" x2="280.3738" y2="222.3230" stroke="#266f73" stroke-width="1.7" stroke-linecap="round" /><line x1="94.8358" y1="310.6865" x2="99.8297" y2="320.4876" stroke="#266f73" stroke-width="1.7" stroke-linecap="round" /><line x1="277.8768" y1="217.4225" x2="282.8707" y2="227.2235" stroke="#266f73" stroke-width="1.7" stroke-linecap="round" /><text x="179.3194" y="258.2439" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#266f73" text-anchor="middle">6 cm</text><line x1="279.4658" y1="220.5410" x2="523.5205" y2="96.1889" stroke="#266f73" stroke-width="1.7" stroke-linecap="round" /><line x1="276.9688" y1="215.6405" x2="281.9627" y2="225.4415" stroke="#266f73" stroke-width="1.7" stroke-linecap="round" /><line x1="521.0236" y1="91.2884" x2="526.0175" y2="101.0894" stroke="#266f73" stroke-width="1.7" stroke-linecap="round" /><text x="391.5054" y="146.762