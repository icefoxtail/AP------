<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 565 526" width="565" height="526" role="img" aria-labelledby="title desc"><title id="title">원을 접었을 때 중심을 지나는 굽은 경계</title><desc id="desc">수평인 접는 선 AB 위로 접힌 원호가 중심 O를 지난다. 원의 위쪽 점 P에서 A와 B를 이었으며 두 현이 이루는 각은 x이다. 아래쪽은 접기 전 원의 점선 윤곽이다.</desc><rect width="565" height="526" fill="white" /><path d="M 121.852 355.750 A 185.5 185.5 0 1 1 443.148 355.750 Z" fill="none" stroke="none" /><path d="M 121.852 355.750 A 185.5 185.5 0 1 1 443.148 355.750" fill="none" stroke="#205d9c" stroke-width="4.4" /><path d="M 121.852 355.750 A 185.5000 185.5000 0 0 0 443.148 355.750" fill="none" stroke="#586574" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="7 6" /><path d="M 121.852 355.750 A 185.5 185.5 0 0 1 443.148 355.750 Z" fill="none" stroke="none" /><path d="M 121.852 355.750 A 185.5 185.5 0 0 1 443.148 355.750" fill="none" stroke="#aa5411" stroke-width="4.0" /><line x1="121.8523" y1="355.7500" x2="443.1477" y2="355.7500" stroke="#704895" stroke-width="4" stroke-linecap="round" /><line x1="121.8523" y1="355.7500" x2="321.0676" y2="81.5536" stroke="#586574" stroke-width="4.1" stroke-linecap="round" /><line x1="443.1477" y1="355.7500" x2="321.0676" y2="81.5536" stroke="#586574" stroke-width="4.1" stroke-linecap="round" /><path d="M 296.3806 115.5323 A 42 42 0 0 0 338.1506 119.9225" stroke="#704895" stroke-width="2.25" fill="none" /><text x="313.5416" y="161.1592" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#704895" text-anchor="middle">x</text><circle cx="121.85228759798665" cy="355.75" r="4.9" fill="#28364b" /><text x="103.8523" y="376.7500" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">A</text><circle cx="443.1477124020133" cy="355.75" r="4.9" fill="#28364b" /><text x="461.1477" y="376.7500" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">B</text><circle cx="282.5" cy="263.0" r="4.9" fill="#28364b" /><text x="273.5000" y="247.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">O</text><circle cx="321.06761864669437" cy="81.55362006387907" r="4.9" fill="#28364b" /><text x="328.0676" y="64.5536" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">P</text></svg>
