<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-labelledby="title desc">
  <title id="title">집합 문항 13의 경우분류 풀이</title>
  <desc id="desc">합집합에서 빠지는 한 원소를 고르고 나머지 네 원소를 두 집합에 배치한 뒤, 한 집합이 공집합이 되는 두 경우를 제외하는 흐름을 나타낸 그림이다.</desc>
  <rect width="760" height="300" rx="18" fill="#f8fafc"/>
  <text x="32" y="38" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="22" font-weight="700" fill="#0f172a">집합 문항 13 · 경우분류</text>
  <text x="32" y="68" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14" fill="#475569">A∩B=∅, |A∪B|=4, A와 B는 모두 공집합이 아님</text>
  <rect x="32" y="100" width="200" height="116" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="132" y="130" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="18" font-weight="700" fill="#1e3a8a">① 빠진 원소 선택</text>
  <text x="132" y="161" text-anchor="middle" font-family="Arial, sans-serif" font-size="17">U의 5개 중 1개</text>
  <text x="132" y="192" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#1d4ed8">5가지</text>
  <path d="M242 158 H270" stroke="#64748b" stroke-width="2.2" fill="none"/><path d="M264 151 l9 7 l-9 7" stroke="#64748b" stroke-width="2.2" fill="none"/>
  <rect x="280" y="100" width="200" height="116" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="380" y="130" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="18" font-weight="700" fill="#166534">② 네 원소 배치</text>
  <text x="380" y="161" text-anchor="middle" font-family="Arial, sans-serif" font-size="16">각 원소를 A 또는 B에</text>
  <text x="380" y="193" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#15803d">2⁴가지</text>
  <path d="M490 158 H518" stroke="#64748b" stroke-width="2.2" fill="none"/><path d="M512 151 l9 7 l-9 7" stroke="#64748b" stroke-width="2.2" fill="none"/>
  <rect x="528" y="100" width="200" height="116" rx="12" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
  <text x="628" y="130" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="18" font-weight="700" fill="#9a3412">③ 두 경우 제외</text>
  <text x="628" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="15">모두 A → B=∅</text>
  <text x="628" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="15">모두 B → A=∅</text>
  <text x="628" y="207" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#c2410c">2가지 제외</text>
  <rect x="32" y="240" width="696" height="38" rx="10" fill="#fff" stroke="#cbd5e1"/>
  <text x="380" y="266" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="19" font-weight="700" fill="#b91c1c">5(2⁴−2)=5·14=70  →  ①</text>
</svg>
