<svg xmlns="http://www.w3.org/2000/svg" width="640" height="280" viewBox="0 0 640 280" data-scale-policy="SCHEMATIC_ALLOWED">
  <rect width="640" height="280" fill="#fff"/>
  <rect x="18" y="18" width="604" height="244" rx="10" fill="#fbfdff" stroke="#cbd5e1"/>
  <g stroke="#64748b" stroke-width="1.5"><line x1="38" y1="150" x2="350" y2="150"/><line x1="175" y1="38" x2="175" y2="242"/></g>
  <g fill="#475569" font-family="Arial, sans-serif" font-size="12"><text x="342" y="143">x</text><text x="181" y="48">y</text><text x="181" y="166">O(0,0)</text></g>
  <circle cx="175" cy="150" r="70" fill="#dbeafe" fill-opacity=".65" stroke="#2563eb" stroke-width="2.5"/>
  <g stroke="#94a3b8" stroke-dasharray="5 4" stroke-width="1.5"><line x1="210" y1="80" x2="210" y2="150"/><line x1="175" y1="80" x2="210" y2="80"/></g>
  <line x1="175" y1="150" x2="210" y2="80" stroke="#ef4444" stroke-width="2.5"/>
  <circle cx="210" cy="80" r="4.5" fill="#ef4444"/>
  <g fill="#0f172a" font-family="Arial, sans-serif" font-size="13"><text x="220" y="74">P(1,2)</text><text x="191" y="119" fill="#dc2626">OP</text></g>
  <g transform="translate(380 42)" font-family="Arial, sans-serif" fill="#0f172a"><rect width="220" height="190" rx="8" fill="#eff6ff" stroke="#93c5fd"/><text x="16" y="29" font-size="16" font-weight="700">그림에서 읽기</text><text x="16" y="64" font-size="14">O=(0,0), P=(1,2)</text><text x="16" y="98" font-size="14">r²=OP²=1²+2²=5</text><line x1="16" y1="116" x2="204" y2="116" stroke="#bfdbfe"/><text x="16" y="148" font-size="15">x²+y²=r²</text><text x="16" y="178" font-size="15" font-weight="700" fill="#1d4ed8">→ x²+y²=5</text></g>
</svg>
