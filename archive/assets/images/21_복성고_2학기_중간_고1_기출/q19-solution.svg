<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="title desc" data-scale-policy="SCHEMATIC_ALLOWED" width="720" height="360"><title id="title">집합 해설 보강 · 문항 19</title><desc id="desc">세 과목의 쌍별 교집합은 가능하지만 세 집합의 공통 교집합은 공집합임을 표시</desc><rect width="720" height="300" rx="18" fill="#f8fafc"/><text x="32" y="38" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#0f172a">집합 해설 보강 · 문항 19</text><text x="32" y="68" font-family="Arial,sans-serif" font-size="14" fill="#475569">A∩B∩C=∅</text><rect x="32" y="88" width="656" height="156" rx="12" fill="#fff" stroke="#cbd5e1"/><circle cx="315" cy="135" r="46" fill="#bfdbfe" fill-opacity=".55" stroke="#2563eb" stroke-width="3"/><circle cx="405" cy="135" r="46" fill="#fed7aa" fill-opacity=".55" stroke="#ea580c" stroke-width="3"/><circle cx="360" cy="195" r="46" fill="#bbf7d0" fill-opacity=".55" stroke="#16a34a" stroke-width="3"/><text x="290" y="125" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#1d4ed8">A</text><text x="414" y="125" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#c2410c">B</text><text x="350" y="206" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#15803d">C</text><text x="32" y="274" font-family="Arial,sans-serif" font-size="13" fill="#64748b">쌍별 교집합은 서로 겹치지만 세 원의 중앙 공통 영역은 없다.</text></svg>
