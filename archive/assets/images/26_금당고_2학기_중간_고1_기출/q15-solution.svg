<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 440" width="820" height="440" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc" data-visual-type="geometry" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-axis-scale-mode="EQUAL_UNIT" data-visual-provenance="review1-pinpoint-repair">
<title id="title">삼각형 PAB의 넓이가 최대가 되는 원 위의 점과 접선</title>
<desc id="desc">원 중심 C(2,3), chord AB, C를 지나 AB에 수직인 직선 y=x+1, 넓이를 최대화하는 P(2+√5,3+√5), P에서의 접선을 표시한다.</desc>
<style>.head{font:700 17px "Noto Sans KR","Malgun Gothic",sans-serif;fill:#0f172a}.note{font:12px "Noto Sans KR","Malgun Gothic",sans-serif;fill:#334155}.label{font:600 12px "STIX Two Math","Malgun Gothic",serif;fill:#111827}</style>
<rect width="820" height="440" fill="#fff"/>
<text x="28" y="30" class="head">밑변 AB가 고정일 때: P에서 AB까지의 거리를 최대로</text>
<rect x="28" y="48" width="540" height="360" rx="12" fill="#fff" stroke="#cbd5e1"/>
<g data-origin-x="210" data-origin-y="350" data-sx="45" data-sy="45">
<line x1="52" y1="350" x2="548" y2="350" stroke="#d1d5db" stroke-width="1"/>
<line x1="210" y1="64" x2="210" y2="404" stroke="#d1d5db" stroke-width="1"/>
<circle cx="300" cy="215" r="142.302" fill="#dbeafe" fill-opacity=".35" stroke="#2563eb" stroke-width="2.4"/>
<line x1="75" y1="485" x2="525" y2="35" stroke="#64748b" stroke-width="2.2"/>
<line x1="75" y1="215" x2="480" y2="-190" stroke="#16a34a" stroke-width="1.8" stroke-dasharray="6 4"/>
<line x1="150" y1="305" x2="255" y2="350" stroke="#0f172a" stroke-width="3"/>
<polygon points="255,350 150,260 400.62,114.38" fill="#fde68a" fill-opacity=".28" stroke="#f59e0b" stroke-width="1.2"/>
<line x1="300" y1="215" x2="400.62" y2="114.38" stroke="#dc2626" stroke-width="2.5"/>
<line x1="240" y1="360" x2="518" y2="82" stroke="#7c3aed" stroke-width="2.4"/>
<circle cx="255" cy="350" r="4.2" fill="#111827"/><text x="263" y="344" class="label">A(1,0)</text>
<circle cx="165" cy="260" r="4.2" fill="#111827"/><text x="118" y="254" class="label">B(−1,2)</text>
<circle cx="300" cy="215" r="4.5" fill="#1d4ed8"/><text x="308" y="209" class="label" fill="#1d4ed8">C(2,3)</text>
<circle cx="400.62" cy="114.38" r="4.7" fill="#dc2626"/><text x="408" y="106" class="label" fill="#b91c1c">P(2+√5,3+√5)</text>
<text x="322" y="168" class="label" fill="#b91c1c">CP=√10</text>
<text x="420" y="151" class="label" fill="#6d28d9">접선 기울기 −1</text>
</g>
<rect x="590" y="48" width="200" height="360" rx="12" fill="#f8fafc" stroke="#dbe3ef"/>
<text x="610" y="80" class="head">결정 단계</text>
<text x="610" y="120" class="note">AB: x+y−1=0</text>
<text x="610" y="146" class="note">C=(2,3), r=√10</text>
<text x="610" y="186" class="note">C를 지나 AB⊥인 직선</text>
<text x="610" y="212" class="note">y=x+1</text>
<text x="610" y="252" class="note">먼 교점 P 선택</text>
<text x="610" y="292" class="note">P에서 접선 ⟂ CP</text>
<text x="610" y="318" class="note">x+y−5−2√5=0</text>
<text x="610" y="358" class="note">a+b+c=−6</text>
</svg>