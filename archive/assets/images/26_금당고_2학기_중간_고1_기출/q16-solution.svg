<svg xmlns="http://www.w3.org/2000/svg" width="440" height="630" viewBox="0 0 440 630" role="img" aria-label="집합 조건에 맞는 나머지류와 최댓값 원소 선택"><style>text{font-family:'Noto Sans KR','Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#24364B}.h{font-size:21px;font-weight:700;fill:#16324F}.s{font-size:15px;fill:#65778B}.l{font-family:'STIX Two Math','Cambria Math','Times New Roman','Noto Sans KR','Malgun Gothic',serif;font-size:16px;font-weight:600}.e{font-family:'STIX Two Math','Cambria Math','Times New Roman','Noto Sans KR','Malgun Gothic',serif;font-size:17px;font-weight:700}.p{fill:white;stroke:#D8E1EB;stroke-width:2}</style><rect width="100%" height="100%" rx="20" fill="white"/><text x="22" y="34" class="h">합이 4의 배수가 되지 않게 고르기</text><text x="22.0" y="59.0" class="s" text-anchor="start">15와 합이 4의 배수가 되지 않으려면 모두 나머지 3인 수예요.</text><rect x="20" y="78" width="400" height="145" rx="16" class="p"/><rect x="20" y="236" width="400" height="370" rx="16" class="p"/><text x="220.0" y="111.0" class="e" text-anchor="middle">2ⁿ−n−1=247  →  n=8</text><text x="220.0" y="143.0" class="s" text-anchor="middle">15는 4로 나눈 나머지가 3</text><text x="220.0" y="181.0" class="l" text-anchor="middle" style="fill:#C44848">나머지 1인 수는 15와 함께 못 써요</text><rect x="43" y="276" width="78" height="58" rx="14" fill="#FFF4E8" stroke="#F0D4B3" stroke-width="2"/><text x="82.0" y="314.0" class="e" text-anchor="middle" style="fill:#D97919">15</text><rect x="139" y="276" width="78" height="58" rx="14" fill="#FFF4E8" stroke="#F0D4B3" stroke-width="2"/><text x="178.0" y="314.0" class="e" text-anchor="middle" style="fill:#D97919">75</text><rect x="235" y="276" width="78" height="58" rx="14" fill="#FFF4E8" stroke="#F0D4B3" stroke-width="2"/><text x="274.0" y="314.0" class="e" text-anchor="middle" style="fill:#D97919">79</text><rect x="331" y="276" width="78" height="58" rx="14" fill="#FFF4E8" stroke="#F0D4B3" stroke-width="2"/><text x="370.0" y="314.0" class="e" text-anchor="middle" style="fill:#D97919">83</text><rect x="43" y="364" width="78" height="58" rx="14" fill="#FFF4E8" stroke="#F0D4B3" stroke-width="2"/><text x="82.0" y="402.0" class="e" text-anchor="middle" style="fill:#D97919">87</text><rect x="139" y="364" width="78" height="58" rx="14" fill="#FFF4E8" stroke="#F0D4B3" stroke-width="2"/><text x="178.0" y="402.0" class="e" text-anchor="middle" style="fill:#D97919">91</text><rect x="235" y="364" width="78" height="58" rx="14" fill="#FFF4E8" stroke="#F0D4B3" stroke-width="2"/><text x="274.0" y="402.0" class="e" text-anchor="middle" style="fill:#D97919">95</text><rect x="331" y="364" width="78" height="58" rx="14" fill="#FFF4E8" stroke="#F0D4B3" stroke-width="2"/><text x="370.0" y="402.0" class="e" text-anchor="middle" style="fill:#D97919">99</text><text x="220.0" y="469.0" class="l" text-anchor="middle" style="fill:#138A82">15와 가장 큰 일곱 수를 선택</text><text x="220.0" y="553.0" class="s" text-anchor="middle">B={15,75,79,83,87,91,95,99}</text><text x="220.0" y="591.0" class="e" text-anchor="middle" style="fill:#138A82">S(B)=624</text></svg>