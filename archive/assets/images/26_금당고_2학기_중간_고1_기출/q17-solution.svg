<svg xmlns="http://www.w3.org/2000/svg" width="440" height="650" viewBox="0 0 440 650" role="img" aria-label="사각형의 두 영역 넓이와 선분 PQ 최소 배치"><style>text{font-family:'Noto Sans KR','Malgun Gothic',sans-serif;fill:#24364B}.h{font-size:21px;font-weight:700;fill:#16324F}.s{font-size:15px;fill:#65778B}.l{font-size:16px;font-weight:600}.e{font-size:17px;font-weight:700}.p{fill:white;stroke:#D8E1EB;stroke-width:2}</style><rect width="100%" height="100%" rx="20" fill="white"/><text x="22" y="34" class="h">넓이로 나누고, 거리로 위치 정하기</text><text x="22.0" y="59.0" class="s" text-anchor="start">두 넓이의 비가 이동 비율의 합을, 최소 거리가 두 비율을 같게 해요.</text><rect x="20" y="78" width="400" height="355" rx="16" class="p"/><rect x="20" y="445" width="400" height="180" rx="16" class="p"/><polygon points="75.0,228.0 136.3,350.7 320.3,258.7 259.0,136.0" fill="#DDEBFF"/><polygon points="136.3,350.7 167.0,412.0 351.0,320.0 320.3,258.7" fill="#E3F5F1"/><polygon points="75.0,228.0 167.0,412.0 351.0,320.0 259.0,136.0" fill="none" stroke="#16324F" stroke-width="4" stroke-linejoin="round"/><line x1="136.3" y1="350.7" x2="320.3" y2="258.7" stroke="#D97919" stroke-width="5" stroke-linecap="round"/><circle cx="75.0" cy="228.0" r="5" fill="#16324F"/><text x="70.0" y="247.0" class="s" text-anchor="end" style="fill:#16324F">A</text><circle cx="167.0" cy="412.0" r="5" fill="#16324F"/><text x="162.0" y="431.0" class="s" text-anchor="end" style="fill:#16324F">B</text><circle cx="351.0" cy="320.0" r="5" fill="#16324F"/><text x="357.0" y="313.0" class="s" text-anchor="start" style="fill:#16324F">C</text><circle cx="259.0" cy="136.0" r="5" fill="#16324F"/><text x="265.0" y="129.0" class="s" text-anchor="start" style="fill:#16324F">D</text><circle cx="136.3" cy="350.7" r="5" fill="#D97919"/><text x="131.3" y="369.7" class="s" text-anchor="end" style="fill:#D97919">P</text><circle cx="320.3" cy="258.7" r="5" fill="#D97919"/><text x="326.3" y="251.7" class="s" text-anchor="start" style="fill:#D97919">Q</text><text x="220.0" y="482.0" class="e" text-anchor="middle">s+t=4/3  ·  PQ²=5+5(s−t)²</text><text x="220.0" y="519.0" class="l" text-anchor="middle" style="fill:#138A82">최소일 때 s=t=2/3</text><text x="220.0" y="556.0" class="s" text-anchor="middle">P=(2/3,2/3), Q=(8/3,5/3)</text><text x="220.0" y="601.0" class="e" text-anchor="middle" style="fill:#D97919">30(m+n)=25</text></svg>