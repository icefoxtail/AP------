<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 420" width="820" height="420" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc" data-visual-type="geometry" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-axis-scale-mode="EQUAL_UNIT" data-visual-provenance="review1-pinpoint-repair">
<title id="title">사각형 ABCD의 넓이 분할과 PQ의 최소</title>
<desc id="desc">A(0,2), B(1,0), C(3,1), D(2,3), P(2/3,2/3), Q(8/3,5/3)를 표시하고 APQD:PBCQ=2:1 및 최소 PQ를 나타낸다.</desc>
<style>.head{font:700 17px "Noto Sans KR","Malgun Gothic",sans-serif;fill:#0f172a}.note{font:12px "Noto Sans KR","Malgun Gothic",sans-serif;fill:#334155}.label{font:600 12px "STIX Two Math","Malgun Gothic",serif;fill:#111827}</style>
<rect width="820" height="420" fill="#fff"/>
<text x="28" y="30" class="head">넓이 조건으로 위치를 묶고, PQ²를 최소화</text>
<rect x="28" y="48" width="540" height="340" rx="12" fill="#fff" stroke="#cbd5e1"/>
<g data-origin-x="110" data-origin-y="340" data-sx="80" data-sy="80">
<line x1="60" y1="340" x2="548" y2="340" stroke="#d1d5db" stroke-width="1"/>
<line x1="110" y1="64" x2="110" y2="382" stroke="#d1d5db" stroke-width="1"/>
<polygon points="110,180 190,340 350,260 270,100" fill="#f8fafc" stroke="#0f172a" stroke-width="2.6"/>
<polygon points="110,180 163.33,286.67 323.33,206.67 270,100" fill="#dbeafe" fill-opacity=".65" stroke="none"/>
<polygon points="163.33,286.67 190,340 350,260 323.33,206.67" fill="#fde68a" fill-opacity=".62" stroke="none"/>
<line x1="163.33" y1="286.67" x2="323.33" y2="206.67" stroke="#dc2626" stroke-width="3.2"/>
<circle cx="110" cy="180" r="4.4" fill="#111827"/><text x="118" y="174" class="label">A(0,2)</text>
<circle cx="190" cy="340" r="4.4" fill="#111827"/><text x="198" y="358" class="label">B(1,0)</text>
<circle cx="350" cy="260" r="4.4" fill="#111827"/><text x="358" y="276" class="label">C(3,1)</text>
<circle cx="270" cy="100" r="4.4" fill="#111827"/><text x="278" y="94" class="label">D(2,3)</text>
<circle cx="163.33" cy="286.67" r="4.8" fill="#dc2626"/><text x="90" y="305" class="label" fill="#b91c1c">P(2/3,2/3)</text>
<circle cx="323.33" cy="206.67" r="4.8" fill="#dc2626"/><text x="331" y="198" class="label" fill="#b91c1c">Q(8/3,5/3)</text>
<text x="205" y="192" class="note" fill="#1d4ed8">APQD = 10/3</text>
<text x="230" y="308" class="note" fill="#92400e">PBCQ = 5/3</text>
<text x="226" y="238" class="label" fill="#b91c1c">PQ=√5</text>
</g>
<rect x="590" y="48" width="200" height="340" rx="12" fill="#f8fafc" stroke="#dbe3ef"/>
<text x="610" y="80" class="head">계산 구조</text>
<text x="610" y="120" class="note">P=(s,2−2s)</text>
<text x="610" y="146" class="note">Q=(2+t,3−2t)</text>
<text x="610" y="186" class="note">넓이비 2:1</text>
<text x="610" y="212" class="note">→ s+t=4/3</text>
<text x="610" y="252" class="note">PQ²=5+5(s−t)²</text>
<text x="610" y="278" class="note">→ s=t=2/3</text>
<text x="610" y="318" class="note">m=1/2, n=1/3</text>
<text x="610" y="344" class="note">30(m+n)=25</text>
</svg>