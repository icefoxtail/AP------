<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 440" width="820" height="440" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc" data-visual-type="geometry" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-axis-scale-mode="EQUAL_UNIT" data-visual-provenance="review1-pinpoint-repair">
<title id="title">대칭이동을 이용한 최단거리와 삼각형 AP0Q0</title>
<desc id="desc">A(-2,-3)의 대칭점 A'(-3,-2), y=x 위 P0(1,1), 원의 중심 C(5,4), 원 위 Q0(17/5,14/5)가 A'-P0-Q0-C 순서로 한 직선 위에 놓인다.</desc>
<style>.head{font:700 17px "Noto Sans KR","Malgun Gothic",sans-serif;fill:#0f172a}.note{font:12px "Noto Sans KR","Malgun Gothic",sans-serif;fill:#334155}.label{font:600 12px "STIX Two Math","Malgun Gothic",serif;fill:#111827}</style>
<rect width="820" height="440" fill="#fff"/>
<text x="28" y="30" class="head">대칭이동으로 꺾인 경로를 한 직선으로 펴기</text>
<rect x="28" y="48" width="540" height="360" rx="12" fill="#fff" stroke="#cbd5e1"/>
<g data-origin-x="220" data-origin-y="300" data-sx="40" data-sy="40">
<line x1="54" y1="300" x2="548" y2="300" stroke="#d1d5db" stroke-width="1"/>
<line x1="220" y1="64" x2="220" y2="406" stroke="#d1d5db" stroke-width="1"/>
<line x1="60" y1="460" x2="540" y2="-20" stroke="#7c3aed" stroke-width="2.2" stroke-dasharray="7 5"/>
<text x="448" y="78" class="label" fill="#6d28d9">y=x</text>
<circle cx="420" cy="140" r="80" fill="#dbeafe" fill-opacity=".35" stroke="#2563eb" stroke-width="2.4"/>
<line x1="100" y1="380" x2="420" y2="140" stroke="#dc2626" stroke-width="2.6"/>
<line x1="140" y1="420" x2="260" y2="260" stroke="#64748b" stroke-width="2"/>
<line x1="140" y1="420" x2="356" y2="188" stroke="#64748b" stroke-width="2"/>
<line x1="260" y1="260" x2="356" y2="188" stroke="#64748b" stroke-width="2"/>
<polygon points="140,420 260,260 356,188" fill="#fde68a" fill-opacity=".28" stroke="none"/>
<line x1="140" y1="420" x2="100" y2="380" stroke="#16a34a" stroke-width="1.8" stroke-dasharray="5 4"/>
<circle cx="140" cy="420" r="4.2" fill="#111827"/><text x="148" y="414" class="label">A(−2,−3)</text>
<circle cx="100" cy="380" r="4.2" fill="#16a34a"/><text x="52" y="374" class="label" fill="#15803d">A′(−3,−2)</text>
<circle cx="260" cy="260" r="4.5" fill="#dc2626"/><text x="268" y="254" class="label" fill="#b91c1c">P₀(1,1)</text>
<circle cx="356" cy="188" r="4.5" fill="#f59e0b"/><text x="364" y="182" class="label">Q₀(17/5,14/5)</text>
<circle cx="420" cy="140" r="4.5" fill="#1d4ed8"/><text x="428" y="134" class="label" fill="#1d4ed8">C(5,4)</text>
<text x="314" y="218" class="label" fill="#b91c1c">A′Q₀=8</text>
<text x="382" y="170" class="label" fill="#1d4ed8">CQ₀=2</text>
</g>
<rect x="590" y="48" width="200" height="360" rx="12" fill="#f8fafc" stroke="#dbe3ef"/>
<text x="610" y="80" class="head">핵심 관계</text>
<text x="610" y="120" class="note">AP=A′P</text>
<text x="610" y="146" class="note">A′Q ≥ A′C−2 = 8</text>
<text x="610" y="186" class="note">A′–P₀–Q₀–C 일직선</text>
<text x="610" y="226" class="note">A′Q₀:Q₀C = 4:1</text>
<text x="610" y="266" class="note">P₀=(1,1)</text>
<text x="610" y="292" class="note">Q₀=(17/5,14/5)</text>
<text x="610" y="332" class="note">밑변 AP₀=5</text>
<text x="610" y="358" class="note">높이=21/25</text>
<text x="610" y="384" class="note">S=21/10</text>
</svg>