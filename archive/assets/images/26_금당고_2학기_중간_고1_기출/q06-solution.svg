<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 470" width="700" height="470" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-geometry-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-axis-scale-mode="EQUAL_UNIT" data-origin-x="220" data-origin-y="250" data-scale-x="45" data-scale-y="45" data-visual-provenance="deterministic-python-independent-facts"><title id="title">삼각형 ABC의 무게중심</title><desc id="desc">세 꼭짓점 A(5,2), B(2,4), C(-1,-3)과 세 중선을 나타내며 교점 G(2,1)가 무게중심임을 보여 준다.</desc><style>.heading{font:700 16px "Noto Sans KR","Malgun Gothic",sans-serif;fill:#111}.label{font:13px "STIX Two Math","Cambria Math","Times New Roman",serif;font-style:italic;fill:#111}.note{font:12px "Noto Sans KR","Malgun Gothic",sans-serif;fill:#333}</style><rect width="700" height="470" fill="#fff"/><text x="28" y="32" class="heading">세 중선의 교점 G = (2,1)</text><line data-axis="x" x1="85" y1="250" x2="472" y2="250" stroke="#888" stroke-width="1.2"/><line data-axis="y" x1="220" y1="52" x2="220" y2="415" stroke="#888" stroke-width="1.2"/><polygon data-geometry="polygon" points="445,160 310,70 175,385" fill="none" stroke="#111" stroke-width="2.05" stroke-linejoin="round"/><line data-geometry="line" data-role="median-A" x1="445" y1="160" x2="242.5" y2="227.5" stroke="#666" stroke-width="1" stroke-dasharray="5 4"/><line data-geometry="line" data-role="median-B" x1="310" y1="70" x2="310" y2="272.5" stroke="#666" stroke-width="1" stroke-dasharray="5 4"/><line data-geometry="line" data-role="median-C" x1="175" y1="385" x2="377.5" y2="115" stroke="#666" stroke-width="1" stroke-dasharray="5 4"/><circle data-point-label="A" data-point-x="5" data-point-y="2" cx="445" cy="160" r="4" fill="#111"/><circle data-point-label="B" data-point-x="2" data-point-y="4" cx="310" cy="70" r="4" fill="#111"/><circle data-point-label="C" data-point-x="-1" data-point-y="-3" cx="175" cy="385" r="4" fill="#111"/><circle data-point-label="G" data-point-x="2" data-point-y="1" cx="310" cy="205" r="4.5" fill="#111"/><text x="453" y="153" class="label">A(5,2)</text><text x="318" y="62" class="label">B(2,4)</text><text x="119" y="404" class="label">C(−1,−3)</text><text x="318" y="200" class="label">G(2,1)</text><rect x="500" y="112" width="172" height="162" rx="10" fill="#fafafa" stroke="#bbb"/><text x="516" y="145" class="note">x_G=(5+2−1)/3=2</text><text x="516" y="182" class="note">y_G=(2+4−3)/3=1</text><text x="516" y="228" class="heading">a+b=3</text></svg>