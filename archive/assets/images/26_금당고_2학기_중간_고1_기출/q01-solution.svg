<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 460" width="700" height="460" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-geometry-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-axis-scale-mode="EQUAL_UNIT" data-visual-provenance="deterministic-python-independent-facts"><title id="title">원이 되기 위한 정수 k의 범위</title><desc id="desc">중심 C(-2,3)이 같은 세 원은 k=0,1,2,3,4에서 얻는 서로 다른 반지름을 보여 준다.</desc><style>.text{font-family:"Noto Sans KR","Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;fill:#111}.math{font-family:"STIX Two Math","Cambria Math","Times New Roman",serif;fill:#111}.heading{font-family:"Noto Sans KR","Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:16px;font-weight:700;fill:#111}.label{font-family:"STIX Two Math","Cambria Math","Times New Roman",serif;font-size:13px;font-style:italic;fill:#111}.note{font-family:"Noto Sans KR","Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:12px;fill:#333}.small{font-family:"Noto Sans KR","Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:11px;fill:#444}</style><rect width="700" height="460" fill="#fff"/><line data-axis="x" x1="100.00" y1="362.50" x2="440.00" y2="362.50" stroke="#777" stroke-width="1.2"/><line data-axis="y" x1="355.00" y1="65.00" x2="355.00" y2="405.00" stroke="#777" stroke-width="1.2"/><circle data-geometry="circle" data-center-x="-2" data-center-y="3" data-radius="2.236067977500" cx="270.00" cy="235.00" r="95.03" fill="none" stroke="#333" stroke-width="1.2" stroke-dasharray="6 4"/><circle data-geometry="circle" data-center-x="-2" data-center-y="3" data-radius="2.828427124746" cx="270.00" cy="235.00" r="120.21" fill="none" stroke="#333" stroke-width="1.6" stroke-dasharray="3 3"/><circle data-geometry="circle" data-center-x="-2" data-center-y="3" data-radius="3.000000000000" cx="270.00" cy="235.00" r="127.50" fill="none" stroke="#333" stroke-width="2.05"/><circle data-point-label="C" data-point-x="-2" data-point-y="3" cx="270.00" cy="235.00" r="3.3" fill="#111"/><text x="278.00" y="227.00" class="label">C(−2,3)</text><rect x="515" y="88" width="158" height="218" rx="10" fill="#fafafa" stroke="#bbb"/><text x="594" y="116" text-anchor="middle" class="heading">반지름 제곱</text><text x="530" y="148" class="note">k=0,4 → r²=5</text><text x="530" y="181" class="note">k=1,3 → r²=8</text><text x="530" y="214" class="note">k=2 → r²=9</text><line x1="530" y1="235" x2="658" y2="235" stroke="#bbb"/><text x="530" y="266" class="note">가능한 정수 k:</text><text x="530" y="292" class="heading">0, 1, 2, 3, 4</text><text x="58" y="432" class="small">중심은 항상 C(−2,3), 원이 되려면 r²=9−(k−2)²&gt;0</text></svg>