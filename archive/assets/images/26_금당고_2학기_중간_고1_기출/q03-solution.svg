<svg xmlns="http://www.w3.org/2000/svg" width="440" height="600" viewBox="0 0 440 600" role="img" aria-label="접점의 반지름과 접선의 수직 관계"><style>text{font-family:'Noto Sans KR','Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#24364B}.h{font-size:21px;font-weight:700;fill:#16324F}.s{font-size:15px;fill:#65778B}.l{font-family:'STIX Two Math','Cambria Math','Times New Roman','Noto Sans KR','Malgun Gothic',serif;font-size:16px;font-weight:600}.e{font-family:'STIX Two Math','Cambria Math','Times New Roman','Noto Sans KR','Malgun Gothic',serif;font-size:17px;font-weight:700}.p{fill:white;stroke:#D8E1EB;stroke-width:2}</style><rect width="100%" height="100%" rx="20" fill="white"/><text x="22" y="34" class="h">접선은 접점 반지름에 수직</text><text x="22.0" y="59.0" class="s" text-anchor="start">T(−2,3)에서 그은 접선이 P(a,5)를 지나갑니다.</text><rect x="20" y="78" width="400" height="370" rx="16" class="p"/><rect x="20" y="460" width="400" height="120" rx="16" class="p"/><circle cx="200.0" cy="330.0" r="108.2" fill="#EFF5FF" stroke="#246BCE" stroke-width="4"/><line x1="50.0" y1="300.0" x2="320.0" y2="120.0" stroke="#24364B" stroke-width="3" stroke-linecap="round"/><line x1="200.0" y1="330.0" x2="140.0" y2="240.0" stroke="#D97919" stroke-width="3" stroke-linecap="round" stroke-dasharray="7 5"/><circle cx="200.0" cy="330.0" r="5" fill="#16324F"/><circle cx="140.0" cy="240.0" r="5" fill="#C44848"/><circle cx="230.0" cy="180.0" r="5" fill="#138A82"/><text x="208.0" y="348.0" class="s" text-anchor="start" style="fill:#16324F">O</text><text x="132.0" y="230.0" class="s" text-anchor="end" style="fill:#C44848">T(−2,3)</text><text x="238.0" y="170.0" class="s" text-anchor="start" style="fill:#138A82">P(a,5)</text><text x="220.0" y="505.0" class="e" text-anchor="middle" style="fill:#246BCE">−2x+3y=13</text><text x="220.0" y="542.0" class="e" text-anchor="middle" style="fill:#138A82">P=(1,5)  →  a=1</text></svg>