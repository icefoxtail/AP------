1"/><circle data-point-label="C" data-point-x="3" data-point-y="2" cx="290" cy="250" r="4.5" fill="#111"/><circle data-point-label="T1" data-point-x="2.483006032408" data-point-y="0.067975870370" cx="269.320241" cy="327.280965" r="4" fill="#111"/><circle data-point-label="T2" data-point-x="1.634641026416" data-point-y="3.461435894336" cx="235.385641" cy="191.542564" r="4" fill="#111"/><text x="91" y="307" class="label">P(−1,1)</text><text x="298" y="244" class="label">C(3,2)</text><text x="277" y="344" class="label">T₁</text><text x="205" y="181" class="label">T₂</text><polyline points="271.595015,318.780059 263.094109,316.505286 260.819335,325.006192" fill="none" stroke="#555" stroke-width="0.8"/><polyline points="241.393221,197.972882 234.962903,203.980462 228.955323,197.550144" fill="none" stroke="#555" stroke-width="0.8"/><rect x="478" y="92" width="245" height="232" rx="10" fill="#fafafa" stroke="#bbb"/><text x="496" y="126" class="note">중심 C=(3,2), 반지름 2</text><text x="496" y="162" class="note">접선: y−1=m(x+1)</text><text x="496" y="198" class="note">거리 조건 → 12m²−8m−3=0</text><text x="496" y="238" class="note">두 접선의 기울기 m₁, m₂</text><text x="496" y="282" class="heading">m₁m₂ = −1/4</text><text x="496" y="306" class="small">CT₁, CT₂는 각각 접선에 수직</text></svg>