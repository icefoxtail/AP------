<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 460" width="820" height="460" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-geometry-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-axis-scale-mode="EQUAL_UNIT" data-visual-provenance="deterministic-python-independent-facts"><title id="title">평행 조건과 수직 조건의 두 경우</title><desc id="desc">k=2/3일 때 두 직선은 기울기 1/3로 평행하고, k=2일 때 기울기 -1과 1로 서로 수직임을 두 패널로 나타낸다.</desc><style>.heading{font:700 16px "Noto Sans KR","Malgun Gothic",sans-serif;fill:#111}.label{font:13px "STIX Two Math","Cambria Math","Times New Roman",serif;font-style:italic;fill:#111}.note{font:12px "Noto Sans KR","Malgun Gothic",sans-serif;fill:#333}.small{font:11px "Noto Sans KR","Malgun Gothic",sans-serif;fill:#444}</style><rect width="820" height="460" fill="#fff"/><text x="28" y="32" class="heading">두 경우를 분리해서 보기</text><rect x="28" y="55" width="350" height="330" rx="12" fill="#fff" stroke="#cbd5e1"/><text x="48" y="82" class="heading">CASE 1 · 평행</text><g data-panel="parallel" data-origin-x="190" data-origin-y="299" data-sx="28" data-sy="28"><line data-axis="x" x1="50" y1="299" x2="330" y2="299" stroke="#aaa" stroke-width="1.1"/><line data-axis="y" x1="190" y1="75" x2="190" y2="355" stroke="#aaa" stroke-width="1.1"/><line data-geometry="line" data-role="parallel-1" x1="50" y1="233.666667" x2="330" y2="140.333333" stroke="#111" stroke-width="2.05"/><line data-geometry="line" data-role="parallel-2" x1="50" y1="303.666667" x2="330" y2="210.333333" stroke="#555" stroke-width="1.6" stroke-dasharray="6 4"/><text x="204" y="115" class="note">m₁=1/3</text><text x="204" y="188" class="note">m₂=1/3</text><text x="48" y="365" class="small">k=2/3 → a=2/3</text></g><rect x="402" y="55" width="390" height="330" rx="12" fill="#fff" stroke="#cbd5e1"/><text x="422" y="82" class="heading">CASE 2 · 수직</text><g data-panel="perpendicular" data-origin-x="500" data-origin-y="299" data-sx="28" data-sy="28"><line data-axis="x" x1="416" y1="299" x2="752" y2="299" stroke="#aaa" stroke-width="1.1"/><line data-axis="y" x1="500" y1="75" x2="500" y2="355" stroke="#aaa" stroke-width="1.1"/><line data-geometry="line" data-role="perp-1" x1="416" y1="103" x2="640" y2="327" stroke="#111" stroke-width="2.05"/><line data-geometry="line" data-role="perp-2" x1="444" y1="313" x2="640" y2="117" stroke="#555" stroke-width="1.6"/><circle data-point-label="H" data-point-x="1.25" data-point-y="2.75" cx="535" cy="222" r="3.8" fill="#111"/><text x="542" y="214" class="label">H</text><polyline points="529.4,227.6 535,233.2 540.6,227.6" fill="none" stroke="#555" stroke-width="0.8"/><text x="654" y="145" class="note">m₂=1</text><text x="647" y="305" class="note">m₁=−1</text><text x="422" y="365" class="small">k=2 → b=2</text></g><text x="410" y="425" text-anchor="middle" class="heading">ab = (2/3)·2 = 4/3</text></svg>