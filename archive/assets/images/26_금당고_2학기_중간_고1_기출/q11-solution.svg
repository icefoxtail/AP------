<svg xmlns="http://www.w3.org/2000/svg" width="440" height="560" viewBox="0 0 440 560" role="img" aria-label="평행 조건과 수직 조건을 분리한 해설 패널"><style>text{font-family:'Noto Sans KR','Malgun Gothic',sans-serif;fill:#24364B}.h{font-size:21px;font-weight:700;fill:#16324F}.s{font-size:15px;fill:#65778B}.l{font-size:16px;font-weight:600}.e{font-size:17px;font-weight:700}.p{fill:white;stroke:#D8E1EB;stroke-width:2}</style><rect width="100%" height="100%" rx="20" fill="white"/><text x="22" y="34" class="h">평행과 수직은 따로 계산</text><text x="22.0" y="59.0" class="s" text-anchor="start">두 직선의 기울기를 비교해 각각 a와 b를 정합니다.</text><rect x="20" y="78" width="400" height="174" rx="16" class="p"/><rect x="20" y="264" width="400" height="174" rx="16" class="p"/><rect x="20" y="450" width="400" height="92" rx="16" class="p"/><text x="220.0" y="111.0" class="l" text-anchor="middle" style="fill:#246BCE">① 평행</text><line x1="112.0" y1="166.0" x2="184.0" y2="142.0" stroke="#246BCE" stroke-width="4" stroke-linecap="round"/><line x1="256.0" y1="166.0" x2="328.0" y2="142.0" stroke="#246BCE" stroke-width="4" stroke-linecap="round"/><text x="220.0" y="185.0" class="e" text-anchor="middle" style="fill:#246BCE">m₁=m₂=1/3  →  a=2/3</text><text x="220.0" y="297.0" class="l" text-anchor="middle" style="fill:#D97919">② 수직 (b&gt;0)</text><line x1="177.0" y1="303.0" x2="263.0" y2="389.0" stroke="#D97919" stroke-width="4" stroke-linecap="round"/><line x1="177.0" y1="389.0" x2="263.0" y2="303.0" stroke="#D97919" stroke-width="4" stroke-linecap="round"/><text x="220.0" y="405.0" class="e" text-anchor="middle" style="fill:#D97919">m₁=−1, m₂=1  →  b=2</text><text x="220.0" y="489.0" class="e" text-anchor="middle" style="fill:#138A82">ab = 4/3</text></svg>