<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 420" width="700" height="420" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-geometry-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-axis-scale-mode="EQUAL_UNIT" data-visual-provenance="deterministic-python-independent-facts"><title id="title">점의 평행이동</title><desc id="desc">점 A(-2,3)을 x방향 1, y방향 4만큼 이동하여 B(-1,7)이 되는 과정을 나타낸다.</desc><style>.text{font-family:"Noto Sans KR","Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;fill:#111}.math{font-family:"STIX Two Math","Cambria Math","Times New Roman",serif;fill:#111}.heading{font-family:"Noto Sans KR","Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:16px;font-weight:700;fill:#111}.label{font-family:"STIX Two Math","Cambria Math","Times New Roman",serif;font-size:13px;font-style:italic;fill:#111}.note{font-family:"Noto Sans KR","Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:12px;fill:#333}.small{font-family:"Noto Sans KR","Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:11px;fill:#444}</style><rect width="700" height="420" fill="#fff"/><line data-axis="y" x1="307.50" y1="55.00" x2="307.50" y2="355.00" stroke="#777" stroke-width="1.2"/><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8z" fill="#333"/></marker></defs><line data-geometry="segment" data-role="translation" x1="232.50" y1="280.00" x2="270.00" y2="130.00" stroke="#333" stroke-width="2.05" marker-end="url(#arrow)"/><line x1="232.50" y1="280.00" x2="270.00" y2="280.00" stroke="#777" stroke-width="1.0" stroke-dasharray="4 3"/><line x1="270.00" y1="280.00" x2="270.00" y2="130.00" stroke="#777" stroke-width="1.0" stroke-dasharray="4 3"/><circle data-point-label="A" data-point-x="-2" data-point-y="3" cx="232.50" cy="280.00" r="4" fill="#111"/><text x="168.50" y="297.00" class="label">A(−2,3)</text><circle data-point-label="B" data-point-x="-1" data-point-y="7" cx="270.00" cy="130.00" r="4" fill="#111"/><text x="280.00" y="122.00" class="label">B(−1,7)</text><text x="251.25" y="298.00" text-anchor="middle" class="note">x방향 +1</text><text x="288.00" y="205.00" class="note">y방향 +4</text><rect x="515" y="92" width="160" height="150" rx="10" fill="#fafafa" stroke="#bbb"/><text x="530" y="125" class="note">−2+a=−1 → a=1</text><text x="530" y="161" class="note">3+4=b → b=7</text><text x="530" y="197" class="note">a−b=−6</text></svg>