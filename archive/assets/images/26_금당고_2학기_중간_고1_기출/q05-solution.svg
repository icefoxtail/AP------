<svg xmlns="http://www.w3.org/2000/svg" width="440" height="550" viewBox="0 0 440 550" role="img" aria-label="원의 중심을 y=x에 대칭하고 반지름을 보존"><style>text{font-family:'Noto Sans KR','Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#24364B}.h{font-size:21px;font-weight:700;fill:#16324F}.s{font-size:15px;fill:#65778B}.l{font-family:'STIX Two Math','Cambria Math','Times New Roman','Noto Sans KR','Malgun Gothic',serif;font-size:16px;font-weight:600}.e{font-family:'STIX Two Math','Cambria Math','Times New Roman','Noto Sans KR','Malgun Gothic',serif;font-size:17px;font-weight:700}.p{fill:white;stroke:#D8E1EB;stroke-width:2}</style><rect width="100%" height="100%" rx="20" fill="white"/><text x="22" y="34" class="h">y=x 대칭은 좌표를 바꿔요</text><text x="22.0" y="59.0" class="s" text-anchor="start">원의 중심은 대칭하고, 반지름 4는 그대로입니다.</text><rect x="20" y="78" width="400" height="330" rx="16" class="p"/><rect x="20" y="420" width="400" height="115" rx="16" class="p"/><circle cx="125.0" cy="225.0" r="67.0" fill="#EFF5FF" stroke="#246BCE" stroke-width="4"/><circle cx="125.0" cy="225.0" r="6" fill="#16324F"/><circle cx="315.0" cy="225.0" r="67.0" fill="#EEF7F6" stroke="#138A82" stroke-width="4"/><circle cx="315.0" cy="225.0" r="6" fill="#138A82"/><line x1="192.0" y1="225.0" x2="248.0" y2="225.0" stroke="#D97919" stroke-width="4" stroke-linecap="round"/><text x="125.0" y="317.0" class="l" text-anchor="middle" style="fill:#246BCE">중심 (3,−2)</text><text x="315.0" y="317.0" class="l" text-anchor="middle" style="fill:#138A82">중심 (−2,3)</text><text x="220.0" y="205.0" class="s" text-anchor="middle" style="fill:#D97919">좌표 교환</text><text x="220.0" y="463.0" class="e" text-anchor="middle">반지름 4 → 4</text><text x="220.0" y="510.0" class="e" text-anchor="middle" style="fill:#138A82">a−b+c = −1</text></svg>