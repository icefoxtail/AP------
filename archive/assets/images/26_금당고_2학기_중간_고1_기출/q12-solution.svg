<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc" data-visual-type="geometry" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-axis-scale-mode="EQUAL_UNIT" data-visual-provenance="review1-pinpoint-repair">
<title id="title">원 C2의 현 AB와 중심에서 현에 내린 수선</title>
<desc id="desc">중심 O(2,-1), 현 AB 위의 수선의 발 H(1/5,7/5), OH=3, AH=BH=4, OA=OB=5를 표시한다.</desc>
<style>.head{font:700 17px "Noto Sans KR","Malgun Gothic",sans-serif;fill:#0f172a}.note{font:12px "Noto Sans KR","Malgun Gothic",sans-serif;fill:#334155}.label{font:600 12px "STIX Two Math","Malgun Gothic",serif;fill:#111827}.small{font:11px "Noto Sans KR","Malgun Gothic",sans-serif;fill:#475569}</style>
<rect width="800" height="420" fill="#fff"/>
<text x="28" y="30" class="head">현의 길이: 중심에서 현에 내린 수선</text>
<rect x="28" y="48" width="470" height="340" rx="12" fill="#fff" stroke="#cbd5e1"/>
<g data-origin-x="180" data-origin-y="220" data-sx="30" data-sy="30">
<line x1="48" y1="220" x2="478" y2="220" stroke="#d1d5db" stroke-width="1"/>
<line x1="180" y1="64" x2="180" y2="382" stroke="#d1d5db" stroke-width="1"/>
<circle cx="240" cy="250" r="150" fill="#dbeafe" fill-opacity=".34" stroke="#2563eb" stroke-width="2.4"/>
<line x1="90" y1="250" x2="282" y2="106" stroke="#0f172a" stroke-width="3"/>
<line x1="240" y1="250" x2="186" y2="178" stroke="#dc2626" stroke-width="2.5"/>
<line x1="240" y1="250" x2="282" y2="106" stroke="#64748b" stroke-width="1.6" stroke-dasharray="5 4"/>
<path d="M186 178 l10 -7.5 l7.5 10 l-10 7.5 z" fill="none" stroke="#dc2626" stroke-width="1.5"/>
<circle cx="240" cy="250" r="4.5" fill="#1d4ed8"/><text x="248" y="268" class="label">O(2,−1)</text>
<circle cx="186" cy="178" r="4.2" fill="#dc2626"/><text x="194" y="170" class="label">H(1/5,7/5)</text>
<circle cx="282" cy="106" r="4.2" fill="#111827"/><text x="290" y="100" class="label">A</text>
<circle cx="90" cy="250" r="4.2" fill="#111827"/><text x="70" y="268" class="label">B</text>
<text x="204" y="222" class="label" fill="#b91c1c">OH=3</text>
<text x="235" y="142" class="label">AH=4</text>
<text x="132" y="207" class="label">BH=4</text>
<text x="263" y="184" class="label" fill="#475569">OA=5</text>
</g>
<rect x="520" y="48" width="250" height="340" rx="12" fill="#f8fafc" stroke="#dbe3ef"/>
<text x="540" y="80" class="head">결정 단계</text>
<text x="540" y="116" class="note">C₁ 중심 (1,2)가 직선 위</text>
<text x="540" y="138" class="note">→ a=5</text>
<text x="540" y="178" class="note">C₂ 중심 O=(2,−1)</text>
<text x="540" y="200" class="note">O에서 직선까지 거리=3</text>
<text x="540" y="240" class="note">AB=8 → AH=BH=4</text>
<text x="540" y="280" class="note">r²=3²+4²=25</text>
<text x="540" y="302" class="note">→ r=5, d=−20</text>
<text x="540" y="344" class="small">현의 중점 H와 수직 관계를 확인</text>
</svg>