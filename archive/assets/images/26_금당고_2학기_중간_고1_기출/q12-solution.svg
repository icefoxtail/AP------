<svg xmlns="http://www.w3.org/2000/svg" width="440" height="870" viewBox="0 0 440 870" role="img" aria-label="두 원의 넓이 이등분선과 중심에서 현까지의 거리 관계"><style>text{font-family:'Noto Sans KR','Malgun Gothic',sans-serif;fill:#24364B}.h{font-size:21px;font-weight:700;fill:#16324F}.s{font-size:15px;fill:#65778B}.l{font-size:16px;font-weight:600}.e{font-size:17px;font-weight:700}.p{fill:white;stroke:#D8E1EB;stroke-width:2}</style><rect width="100%" height="100%" rx="20" fill="white"/><text x="22" y="34" class="h">중심 거리와 현의 길이</text><text x="22.0" y="59.0" class="s" text-anchor="start">원의 넓이를 반으로 나누는 직선은 중심을 지납니다.</text><rect x="20" y="78" width="400" height="300" rx="16" class="p"/><rect x="20" y="392" width="400" height="488" rx="16" class="p"/><text x="220.0" y="108.0" class="l" text-anchor="middle">① 첫 원: 넓이를 이등분하는 직선</text><circle cx="257.0" cy="251.0" r="74.0" fill="#EAF2FF" stroke="#246BCE" stroke-width="4"/><line x1="146.0" y1="334.0" x2="368.0" y2="168.0" stroke="#138A82" stroke-width="3" stroke-linecap="round"/><circle cx="257.0" cy="251.0" r="6" fill="#16324F"/><text x="220.0" y="350.0" class="s" text-anchor="middle">중심 (1, 2)을 지나야 함</text><text x="220.0" y="376.0" class="e" text-anchor="middle" style="fill:#138A82">3−8+a=0  →  a=5</text><text x="220.0" y="423.0" class="l" text-anchor="middle">② 두 번째 원: 현의 길이 8</text><circle cx="220.0" cy="600.0" r="150.0" fill="#FFF4E8" stroke="#D97919" stroke-width="4"/><line x1="70.0" y1="600.0" x2="262.0" y2="456.0" stroke="#246BCE" stroke-width="5" stroke-linecap="round"/><line x1="220.0" y1="600.0" x2="166.0" y2="528.0" stroke="#C44848" stroke-width="3" stroke-linecap="round" stroke-dasharray="7 6"/><circle cx="220.0" cy="600.0" r="5" fill="#16324F"/><circle cx="166.0" cy="528.0" r="5" fill="#C44848"/><text x="220.0" y="760.0" class="s" text-anchor="middle">C₂=(2,−1) · 3x−4y+5=0</text><text x="220.0" y="788.0" class="e" text-anchor="middle" style="fill:#D97919">거리 3, 반현 4 → 반지름 5</text><text x="220.0" y="821.0" class="l" text-anchor="middle" style="fill:#D97919">x²+y²−4x+2y−20=0</text><text x="220.0" y="853.0" class="e" text-anchor="middle" style="fill:#138A82">a+b+c+d=−17</text></svg>