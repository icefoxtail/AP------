<svg xmlns="http://www.w3.org/2000/svg" width="440" height="530" viewBox="0 0 440 530" role="img" aria-label="원의 중심 평행이동과 대칭 후 직선 조건"><style>text{font-family:'Noto Sans KR','Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#24364B}.h{font-size:21px;font-weight:700;fill:#16324F}.s{font-size:15px;fill:#65778B}.l{font-family:'STIX Two Math','Cambria Math','Times New Roman','Noto Sans KR','Malgun Gothic',serif;font-size:16px;font-weight:600}.e{font-family:'STIX Two Math','Cambria Math','Times New Roman','Noto Sans KR','Malgun Gothic',serif;font-size:17px;font-weight:700}.p{fill:white;stroke:#D8E1EB;stroke-width:2}</style><rect width="100%" height="100%" rx="20" fill="white"/><text x="22" y="34" class="h">원의 중심 이동과 반사</text><text x="22.0" y="59.0" class="s" text-anchor="start">반지름 2는 그대로이며, y=x 대칭에서 좌표를 맞바꿔요.</text><rect x="20" y="78" width="400" height="350" rx="16" class="p"/><circle cx="220.0" cy="143.0" r="25.0" fill="#F1F6FC" stroke="#16324F" stroke-width="3"/><circle cx="220.0" cy="143.0" r="5" fill="#16324F"/><text x="268.0" y="149.0" class="l" text-anchor="start" style="fill:#16324F">C₀(−2,1)</text><circle cx="220.0" cy="242.0" r="25.0" fill="#F1F6FC" stroke="#246BCE" stroke-width="3"/><circle cx="220.0" cy="242.0" r="5" fill="#246BCE"/><text x="268.0" y="248.0" class="l" text-anchor="start" style="fill:#246BCE">C₁(1,3)</text><circle cx="220.0" cy="341.0" r="25.0" fill="#F1F6FC" stroke="#138A82" stroke-width="3"/><circle cx="220.0" cy="341.0" r="5" fill="#138A82"/><text x="268.0" y="347.0" class="l" text-anchor="start" style="fill:#138A82">C(3,1)</text><text x="220.0" y="191.0" class="s" text-anchor="middle" style="fill:#246BCE">평행이동 (+3,+2)</text><text x="220.0" y="290.0" class="s" text-anchor="middle" style="fill:#138A82">y=x 대칭: 좌표를 맞바꿈</text><text x="220.0" y="397.0" class="l" text-anchor="middle">중심 C=(3,1)에서 거리 √5인 평행선</text><text x="220.0" y="453.0" class="s" text-anchor="middle">x−2y+4=0 또는 x−2y−6=0</text><text x="220.0" y="497.0" class="e" text-anchor="middle" style="fill:#138A82">양의 y절편 선택 → 2</text></svg>