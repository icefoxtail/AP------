<svg xmlns="http://www.w3.org/2000/svg" width="440" height="540" viewBox="0 0 440 540" role="img" aria-label="선분 AB의 내분비와 좌표를 나타낸 비례 그림"><style>text{font-family:'Noto Sans KR','Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#24364B}.h{font-size:21px;font-weight:700;fill:#16324F}.s{font-size:15px;fill:#65778B}.l{font-family:'STIX Two Math','Cambria Math','Times New Roman','Noto Sans KR','Malgun Gothic',serif;font-size:16px;font-weight:600}.e{font-family:'STIX Two Math','Cambria Math','Times New Roman','Noto Sans KR','Malgun Gothic',serif;font-size:17px;font-weight:700}.p{fill:white;stroke:#D8E1EB;stroke-width:2}</style><rect width="100%" height="100%" rx="20" fill="white"/><text x="22" y="34" class="h">선분을 4:5로 나누는 점</text><text x="22.0" y="59.0" class="s" text-anchor="start">5AP=4PB  →  AP:PB=4:5</text><rect x="20" y="78" width="400" height="260" rx="16" class="p"/><rect x="20" y="350" width="400" height="170" rx="16" class="p"/><line x1="55.0" y1="190.0" x2="380.0" y2="190.0" stroke="#24364B" stroke-width="5" stroke-linecap="round"/><line x1="55.0" y1="177.0" x2="55.0" y2="204.0" stroke="#246BCE" stroke-width="3" stroke-linecap="round"/><line x1="199.4" y1="177.0" x2="199.4" y2="204.0" stroke="#D97919" stroke-width="4" stroke-linecap="round"/><line x1="380.0" y1="177.0" x2="380.0" y2="204.0" stroke="#138A82" stroke-width="3" stroke-linecap="round"/><circle cx="55.0" cy="190.0" r="6" fill="#246BCE"/><circle cx="199.4" cy="190.0" r="7" fill="#D97919"/><circle cx="380.0" cy="190.0" r="6" fill="#138A82"/><text x="55.0" y="226.0" class="s" text-anchor="middle" style="fill:#246BCE">A(−3,−8)</text><text x="199.4" y="226.0" class="s" text-anchor="middle" style="fill:#D97919">P(5,−4)</text><text x="380.0" y="226.0" class="s" text-anchor="middle" style="fill:#138A82">B(15,1)</text><line x1="55.0" y1="264.0" x2="199.4" y2="264.0" stroke="#246BCE" stroke-width="4" stroke-linecap="round"/><line x1="199.4" y1="264.0" x2="380.0" y2="264.0" stroke="#138A82" stroke-width="4" stroke-linecap="round"/><text x="127.2" y="254.0" class="s" text-anchor="middle" style="fill:#246BCE">4</text><text x="289.7" y="254.0" class="s" text-anchor="middle" style="fill:#138A82">5</text><text x="220.0" y="397.0" class="l" text-anchor="middle">P는 AB의 4/9 지점</text><text x="220.0" y="443.0" class="s" text-anchor="middle">p=5, q=−4</text><text x="220.0" y="495.0" class="e" text-anchor="middle" style="fill:#D97919">p+q = 1</text></svg>