<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" width="720" height="480" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-geometry-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-axis-scale-mode="EQUAL_UNIT" data-origin-x="250" data-origin-y="270" data-scale-x="25" data-scale-y="25" data-visual-provenance="deterministic-python-independent-facts"><title id="title">항상 지나는 점 P와 점-직선 거리</title><desc id="desc">직선족의 두 대표 직선 k=0과 k=1이 P(2,4)에서 만나고, P에서 3x+4y+3=0에 내린 수선의 발 H(-1,0)까지의 거리가 5임을 나타낸다.</desc><style>.heading{font:700 16px "Noto Sans KR","Malgun Gothic",sans-serif;fill:#111}.label{font:13px "STIX Two Math","Cambria Math","Times New Roman",serif;font-style:italic;fill:#111}.note{font:12px "Noto Sans KR","Malgun Gothic",sans-serif;fill:#333}</style><rect width="720" height="480" fill="#fff"/><text x="28" y="32" class="heading">모든 k에서 공통점 P=(2,4),  PH=5</text><line data-axis="x" x1="92" y1="270" x2="432" y2="270" stroke="#888" stroke-width="1.2"/><line data-axis="y" x1="250" y1="45" x2="250" y2="420" stroke="#888" stroke-width="1.2"/><line data-geometry="line" data-role="family-k0" data-equation="3x-y-2=0" x1="217.5" y1="417.5" x2="342.5" y2="42.5" stroke="#555" stroke-width="1.4" stroke-dasharray="6 4"/><line data-geometry="line" data-role="family-k1" data-equation="x=2" x1="300" y1="395" x2="300" y2="45" stroke="#555" stroke-width="1.4" stroke-dasharray="3 3"/><line data-geometry="line" data-role="target" data-equation="3x+4y+3=0" x1="150" y1="213.75" x2="400" y2="401.25" stroke="#111" stroke-width="2.05"/><line data-geometry="line" data-role="distance" x1="225" y1="270" x2="300" y2="170" stroke="#666" stroke-width="1.0"/><circle data-point-label="P" data-point-x="2" data-point-y="4" cx="300" cy="170" r="4.5" fill="#111"/><circle data-point-label="H" data-point-x="-1" data-point-y="0" cx="225" cy="270" r="4" fill="#111"/><text x="308" y="162" class="label">P(2,4)</text><text x="198" y="289" class="label">H(−1,0)</text><polyline points="232.2,260.4 241.8,267.6 234.6,277.2" fill="none" stroke="#555" stroke-width="0.8"/><text x="314" y="78" class="note">k=1</text><text x="330" y="62" class="note">k=0</text><text x="145" y="207" class="note">3x+4y+3=0</text><text x="260" y="218" class="note">PH=5</text><rect x="500" y="112" width="190" height="190" rx="10" fill="#fafafa" stroke="#bbb"/><text x="516" y="146" class="note">3x−y−2=0</text><text x="516" y="180" class="note">x+y−6=0</text><text x="516" y="214" class="note">→ P=(2,4)</text><text x="516" y="248" class="note">H=(−1,0)</text><text x="516" y="280" class="heading">PH=5</text></svg>