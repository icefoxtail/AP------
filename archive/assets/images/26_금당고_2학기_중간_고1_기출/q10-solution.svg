<svg xmlns="http://www.w3.org/2000/svg" width="440" height="620" viewBox="0 0 440 620" role="img" aria-label="공통점 P와 직선까지의 수선거리"><style>text{font-family:'Noto Sans KR','Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#24364B}.h{font-size:21px;font-weight:700;fill:#16324F}.s{font-size:15px;fill:#65778B}.l{font-family:'STIX Two Math','Cambria Math','Times New Roman','Noto Sans KR','Malgun Gothic',serif;font-size:16px;font-weight:600}.e{font-family:'STIX Two Math','Cambria Math','Times New Roman','Noto Sans KR','Malgun Gothic',serif;font-size:17px;font-weight:700}.p{fill:white;stroke:#D8E1EB;stroke-width:2}</style><rect width="100%" height="100%" rx="20" fill="white"/><text x="22" y="34" class="h">모든 k에서 지나는 점 P</text><text x="22.0" y="59.0" class="s" text-anchor="start">두 계수가 동시에 0인 점이 공통점입니다.</text><rect x="20" y="78" width="400" height="128" rx="16" class="p"/><rect x="20" y="218" width="400" height="260" rx="16" class="p"/><rect x="20" y="490" width="400" height="110" rx="16" class="p"/><text x="220.0" y="116.0" class="l" text-anchor="middle">3x−y−2=0  ·  x+y−6=0</text><text x="220.0" y="154.0" class="e" text-anchor="middle" style="fill:#246BCE">공통점 P=(2,4)</text><line x1="70.0" y1="325.0" x2="250.0" y2="460.0" stroke="#65778B" stroke-width="3" stroke-linecap="round"/><line x1="130.0" y1="370.0" x2="190.0" y2="415.0" stroke="#246BCE" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 5"/><line x1="130.0" y1="370.0" x2="220.0" y2="250.0" stroke="#D97919" stroke-width="4" stroke-linecap="round"/><circle cx="130.0" cy="370.0" r="6" fill="#138A82"/><circle cx="220.0" cy="250.0" r="7" fill="#D97919"/><text x="116.0" y="389.0" class="s" text-anchor="end" style="fill:#138A82">H(−1,0)</text><text x="232.0" y="241.0" class="s" text-anchor="start" style="fill:#D97919">P(2,4)</text><text x="306.0" y="454.0" class="s" text-anchor="middle" style="fill:#246BCE">3x+4y+3=0</text><text x="220.0" y="523.0" class="e" text-anchor="middle" style="fill:#D97919">PH=√(3²+4²)=5</text><text x="220.0" y="570.0" class="l" text-anchor="middle" style="fill:#138A82">점 P와 직선 사이의 거리 = 5</text></svg>