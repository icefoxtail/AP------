<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" role="img" aria-labelledby="title desc"><title id="title">세 명제의 진리집합</title><desc id="desc">U에서 Q 바깥 전체가 R=Q의 여집합이고 P는 R 안에 있다.</desc><style>text{font-family:"Noto Sans KR","Malgun Gothic",Arial,sans-serif;fill:#172033}.muted{fill:#56657a}.math{font-family:Georgia,serif}</style><rect width="760" height="430" fill="#f8fafc"/><text x="28" y="38" font-size="22" font-weight="700">세 명제의 진리집합</text><rect x="36" y="96" width="320" height="250" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text x="52" y="122" class="muted" font-size="15">U, R=Qᶜ</text><ellipse cx="210" cy="215" rx="72" ry="84" fill="#fed7aa" stroke="#ea580c" stroke-width="3"/><text x="210" y="220" text-anchor="middle" font-size="18" font-weight="700">Q</text><circle cx="88" cy="275" r="29" fill="#bfdbfe" stroke="#2563eb" stroke-width="3"/><text x="88" y="281" text-anchor="middle" font-size="18" font-weight="700">P</text><text x="92" y="325" text-anchor="middle" font-size="15">P⊆R</text><rect x="390" y="96" width="334" height="250" rx="14" fill="#fff" stroke="#cbd5e1"/><text x="412" y="170" class="math" font-size="21">P⊆Qᶜ</text><text x="412" y="215" class="math" font-size="21">R=Qᶜ</text><text x="412" y="260" class="math" font-size="21">Q∪R=U, Q∩R=∅</text></svg>
