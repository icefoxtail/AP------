<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" role="img" aria-labelledby="title desc" data-scale-policy="SCHEMATIC_ALLOWED" width="720" height="360">
  <title id="title">문항 14 해설: A와 B의 해집합 관계</title>
  <desc id="desc">A={x|x&lt;2 또는 x&gt;4}, B={x|−1≤x≤4}를 수직선에 표시해 A∩B={x|−1≤x&lt;2}를 확인</desc>
  <style>
    text{font-family:"Noto Sans KR","Malgun Gothic",Arial,sans-serif;fill:#172033}.muted{fill:#56657a}.math{font-family:Georgia,"Times New Roman",serif}
  </style>
  <rect width="760" height="380" rx="18" fill="#f8fafc"/>
  <text x="30" y="38" font-size="22" font-weight="700">합집합·교집합 조건으로 B를 결정</text>
  <text x="30" y="67" class="muted" font-size="15">A={x|x&lt;2 또는 x&gt;4},  B={x|−1≤x≤4}</text>
  <rect x="30" y="92" width="700" height="202" rx="14" fill="#fff" stroke="#cbd5e1"/>
  <line x1="105" y1="164" x2="690" y2="164" stroke="#172033" stroke-width="2"/><path d="m690 164-10-6v12z" fill="#172033"/>
  <line x1="105" y1="234" x2="690" y2="234" stroke="#172033" stroke-width="2"/><path d="m690 234-10-6v12z" fill="#172033"/>
  <g stroke="#64748b" stroke-width="2"><line x1="150" y1="158" x2="150" y2="170"/><line x1="240" y1="158" x2="240" y2="170"/><line x1="330" y1="158" x2="330" y2="170"/><line x1="375" y1="158" x2="375" y2="170"/><line x1="420" y1="158" x2="420" y2="170"/><line x1="465" y1="158" x2="465" y2="170"/><line x1="510" y1="158" x2="510" y2="170"/><line x1="555" y1="158" x2="555" y2="170"/><line x1="600" y1="158" x2="600" y2="170"/><line x1="150" y1="228" x2="150" y2="240"/><line x1="240" y1="228" x2="240" y2="240"/><line x1="330" y1="228" x2="330" y2="240"/><line x1="375" y1="228" x2="375" y2="240"/><line x1="420" y1="228" x2="420" y2="240"/><line x1="465" y1="228" x2="465" y2="240"/><line x1="510" y1="228" x2="510" y2="240"/><line x1="555" y1="228" x2="555" y2="240"/><line x1="600" y1="228" x2="600" y2="240"/></g>
  <g text-anchor="middle" class="muted" font-size="14"><text x="150" y="257">−5</text><text x="240" y="257">−3</text><text x="330" y="257">−1</text><text x="375" y="257">0</text><text x="420" y="257">1</text><text x="465" y="257">2</text><text x="510" y="257">3</text><text x="555" y="257">4</text><text x="600" y="257">5</text></g>
  <text x="82" y="169" text-anchor="end" font-size="17" font-weight="700" fill="#2563eb">A</text>
  <line x1="110" y1="164" x2="465" y2="164" stroke="#2563eb" stroke-width="12" stroke-linecap="round"/><path d="m105 164-12-6v12z" fill="#2563eb"/><line x1="555" y1="164" x2="690" y2="164" stroke="#2563eb" stroke-width="12" stroke-linecap="round"/><path d="m695 164-12-6v12z" fill="#2563eb"/>
  <circle cx="465" cy="164" r="8" fill="#fff" stroke="#2563eb" stroke-width="3"/><circle cx="555" cy="164" r="8" fill="#fff" stroke="#2563eb" stroke-width="3"/>
  <text x="82" y="239" text-anchor="end" font-size="17" font-weight="700" fill="#16a34a">B</text>
  <line x1="330" y1="234" x2="555" y2="234" stroke="#16a34a" stroke-width="12" stroke-linecap="round"/><circle cx="330" cy="234" r="8" fill="#16a34a"/><circle cx="555" cy="234" r="8" fill="#16a34a"/>
  <rect x="30" y="318" width="700" height="35" rx="10" fill="#eff6ff"/><text x="380" y="341" text-anchor="middle" font-size="15" font-weight="700" fill="#1d4ed8">A∩B={x|−1≤x&lt;2},  B=(x+1)(x−4)  →  a=−3, b=−4, ab=12 (③)</text>
</svg>
