<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" role="img" aria-labelledby="title desc" data-scale-policy="SCHEMATIC_ALLOWED">
  <title id="title">원 위의 비의 최댓값과 접선</title>
  <desc id="desc">원 x²+y²=2와 외부점 A(−2,0)에서 그은 최대 기울기의 접선 y=x+2, 접점 P(−1,1), 직선 OP를 표시한 그림</desc>
  <rect width="640" height="300" fill="#fff"/>
  <text x="320" y="28" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="21" font-weight="700" fill="#1e3a5f">비의 최댓값 = A에서 원에 그은 접선의 기울기</text>
  <rect x="18" y="45" width="350" height="235" rx="8" fill="#f8fafc" stroke="#dbe3ef"/>
  <g stroke="#e2e8f0" stroke-width="1">
    <line x1="40" y1="70" x2="350" y2="70"/><line x1="40" y1="115" x2="350" y2="115"/><line x1="40" y1="160" x2="350" y2="160"/><line x1="40" y1="205" x2="350" y2="205"/><line x1="40" y1="250" x2="350" y2="250"/><line x1="90" y1="50" x2="90" y2="275"/><line x1="135" y1="50" x2="135" y2="275"/><line x1="180" y1="50" x2="180" y2="275"/><line x1="225" y1="50" x2="225" y2="275"/><line x1="270" y1="50" x2="270" y2="275"/><line x1="315" y1="50" x2="315" y2="275"/>
  </g>
  <line x1="40" y1="160" x2="354" y2="160" stroke="#0f172a" stroke-width="1.5"/><line x1="180" y1="50" x2="180" y2="275" stroke="#0f172a" stroke-width="1.5"/>
  <text x="345" y="154" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14">x</text><text x="187" y="62" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14">y</text>
  <circle cx="180" cy="160" r="77.8" fill="#dbeafe" fill-opacity=".68" stroke="#2563eb" stroke-width="2.6"/>
  <line x1="70" y1="160" x2="190" y2="50" stroke="#dc2626" stroke-width="2.7"/>
  <line x1="180" y1="160" x2="125" y2="105" stroke="#0f766e" stroke-width="2.2" stroke-dasharray="6 4"/>
  <circle cx="180" cy="160" r="4.5" fill="#1d4ed8"/><circle cx="70" cy="160" r="4.8" fill="#111827"/><circle cx="125" cy="105" r="4.5" fill="#dc2626"/>
  <text x="187" y="178" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14" font-weight="700">O</text>
  <text x="43" y="181" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="13" font-weight="700">A(−2,0)</text>
  <text x="129" y="101" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="13" font-weight="700" fill="#b91c1c">P(−1,1)</text>
  <text x="76" y="151" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="12" fill="#b91c1c">y=x+2</text>
  <text x="137" y="143" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="12" fill="#047857">OP</text>
  <rect x="390" y="45" width="232" height="235" rx="8" fill="#f8fafc" stroke="#dbe3ef"/>
  <text x="408" y="75" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="17" font-weight="700" fill="#334155">접선 기울기</text>
  <text x="408" y="108" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14">t=y/(x+2)=기울기 AP</text>
  <text x="408" y="137" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14">|2t|/√(t²+1)=√2</text>
  <text x="408" y="166" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14">→ t²=1, 최대 t=1</text>
  <text x="408" y="195" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14">접점 P=(−1,1)</text>
  <line x1="408" y1="208" x2="604" y2="208" stroke="#cbd5e1"/>
  <text x="408" y="238" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="15" font-weight="700" fill="#1d4ed8">기울기 OP=1/(−1)=−1</text>
  <text x="408" y="267" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="15" font-weight="700" fill="#1d4ed8">정답: ②</text>
</svg>
