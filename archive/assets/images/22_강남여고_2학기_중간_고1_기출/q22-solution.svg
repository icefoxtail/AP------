<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="720" height="360" role="img" data-fact-hash="0ecd8be2b4c9c99c1844b2a8689d2a0bdeb81cc5731f6cb814e95c2bdccb9fb4" data-scale-policy="SCHEMATIC_ALLOWED" data-semantic-role="line-relation-cases"><title>직선의 방정식 해설 도형 · 문항 22</title><desc>두 직선의 계수비와 기울기 관계를 비교한 해설 자료</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8z" fill="#2563eb"/></marker></defs><rect width="720" height="360" rx="18" fill="#f8fafc"/><text x="32" y="38" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#0f172a">직선의 방정식 해설 도형 · 문항 22</text><text x="32" y="64" font-family="Arial,sans-serif" font-size="12" fill="#475569">두 직선의 계수비와 기울기 관계를 비교한 해설 자료</text><rect x="76" y="116" width="222" height="118" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><rect x="422" y="116" width="222" height="118" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><path d="M312 174h96" stroke="#64748b" stroke-width="3"/><path d="m398 165 14 9-14 9" fill="#64748b"/><text x="187" y="150" text-anchor="middle" font-size="17" font-weight="700" fill="#1e40af">평행·일치</text><text x="187" y="178" text-anchor="middle" font-size="12" fill="#334155">계수의 비를 비교</text><text x="187" y="204" text-anchor="middle" font-size="12" fill="#334155">a=1, -3</text><text x="533" y="150" text-anchor="middle" font-size="17" font-weight="700" fill="#166534">수직</text><text x="533" y="178" text-anchor="middle" font-size="12" fill="#334155">기울기의 곱 = -1</text><text x="533" y="204" text-anchor="middle" font-size="12" fill="#334155">a=-1/2</text><text x="54" y="270" font-size="12" fill="#334155">a=-3은 일치, a=1은 서로 다른 평행선</text><text x="54" y="288" font-size="12" fill="#334155">αβγ = 1×(-3)×(-1/2) = 3/2</text><text x="32" y="344" font-family="Arial,sans-serif" font-size="11" fill="#64748b">풀이 관찰: 계수비로 평행·일치를, 기울기의 곱으로 수직을 판정</text></svg>
