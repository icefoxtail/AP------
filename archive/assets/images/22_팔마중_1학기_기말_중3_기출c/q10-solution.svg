<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" width="640" height="440" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">같은 폭 x인 길이 화단의 네 변 바깥을 둘러싼다. 바깥의 가로와 세로에는 양쪽 폭 x씩 더해진다.</title><desc id="visual-desc">초록색 안쪽 직사각형은 8 m와 5 m인 화단이고, 연한 띠는 네 방향에서 같은 폭 x m로 둘러싼 길이다. 바깥 크기는 가로 8+2x m, 세로 5+2x m이다. 띠의 두께는 변수 설명용 예시이며 실제 비례를 나타내지 않는다.</desc><rect width="640" height="440" fill="#fff"/><g data-layer="10"><path id="road" data-role="region" stroke="none" stroke-width="1.6" fill="#e4e7ec" data-owner-points="A B C D E F G H" data-mark="region" data-mark-id="road" fill-rule="evenodd" d="M90.731707317 380.487804878 L549.268292683 380.487804878 L549.268292683 59.512195122 L90.731707317 59.512195122 L90.731707317 380.487804878 Z M136.585365854 334.634146341 L503.414634146 334.634146341 L503.414634146 105.365853659 L136.585365854 105.365853659 L136.585365854 334.634146341 Z"/></g><g data-layer="10"><path id="garden" data-role="region" stroke="none" stroke-width="1.6" fill="#6fcf97" data-owner-points="A B C D" data-mark="region" data-mark-id="garden" fill-opacity="0.42" fill-rule="evenodd" d="M136.585365854 334.634146341 L503.414634146 334.634146341 L503.414634146 105.365853659 L136.585365854 105.365853659 L136.585365854 334.634146341 Z"/></g><g data-layer="30"><line id="outerBottom" data-role="line" stroke="#111" stroke-width="1.6" fill