<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 340" width="380" height="340" role="img" aria-labelledby="q21-title q21-desc">
  <title id="q21-title">정비례 관계 y=ax의 그래프</title>
  <desc id="q21-desc">원점 O와 점 A(2, -4)를 지나는 정비례 관계의 직선 그래프</desc>
  <rect width="380" height="340" fill="#ffffff"/>

  <!-- Coordinate Axes -->
  <g stroke="#333333" stroke-width="1.5">
    <!-- X axis -->
    <line x1="30" y1="150" x2="350" y2="150"/>
    <polyline points="342,145 350,150 342,155" fill="none"/>
    <!-- Y axis -->
    <line x1="190" y1="310" x2="190" y2="30"/>
    <polyline points="185,38 190,30 195,38" fill="none"/>
  </g>

  <!-- Axis and Origin Labels -->
  <g font-family="sans-serif" font-size="14" fill="#111111" font-weight="bold">
    <text x="355" y="155">x</text>
    <text x="190" y="22" text-anchor="middle">y</text>
    <text x="176" y="166">O</text>
  </g>

  <!-- Dashed Guidelines for Point A(2, -4) -->
  <g stroke="#777777" stroke-width="1.2" stroke-dasharray="4,4">
    <line x1="238" y1="150" x2="238" y2="246"/>
    <line x1="190" y1="246" x2="238" y2="246"/>
  </g>

  <!-- Axis Numbers & Ticks -->
  <g font-family="sans-serif" font-size="12" fill="#333333">
    <text x="238" y="142" text-anchor="middle">2</text>
    <text x="182" y="250" text-anchor="end">-4</text>
  </g>

  <!-- Graph Line y = -2x -->
  <line x1="118" y1="6" x2="262" y2="294" stroke="#0066cc" stroke-width="2.5"/>

  <!-- Point A and Origin -->
  <circle cx="190" cy="150" r="3" fill="#333333"/>
  <circle cx="238" cy="246" r="4.5" fill="#d32f2f"/>

  <!-- Point A Label -->
  <g font-family="sans-serif" font-size="15" fill="#111111" font-weight="bold">
    <text x="248" y="254">A</text>
  </g>
</svg>