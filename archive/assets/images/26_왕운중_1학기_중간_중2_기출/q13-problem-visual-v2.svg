<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 674 544" width="674" height="544" role="img" aria-labelledby="title desc"><title id="title">직사각형 안의 반원과 직각삼각형</title><desc id="desc">직사각형 ABCD의 세로변 AB는 4x³y, 가로변 BC는 2x³y이다. 왼쪽 AB를 지름으로 하는 청록색 반원을 그리고 A와 C를 이어 주황색 직각삼각형 ABC를 표시했다.</desc><rect width="674" height="544" fill="white" /><polygon points="225.0000,69.0000 225.0000,459.0000 420.0000,459.0000 420.0000,69.0000" fill="#edf4fa" /><path d="M 225.000 69.000 A 195 195 0 0 1 225.000 459.000 Z" fill="#dcefe9" stroke="none" fill-opacity=".70" /><polygon points="225,69 225,459 420,459" fill="#fee8cd" fill-opacity=".64" /><line x1="225.0000" y1="69.0000" x2="225.0000" y2="459.0000" stroke="#704895" stroke-width="4.4" stroke-linecap="round" /><line x1="225.0000" y1="459.0000" x2="420.0000" y2="459.0000" stroke="#205d9c" stroke-width="4.4" stroke-linecap="round" /><line x1="420.0000" y1="459.0000" x2="420.0000" y2="69.0000" stroke="#205d9c" stroke-width="4.4" stroke-linecap="round" /><line x1="420.0000" y1="69.0000" x2="225.0000" y2="69.0000" stroke="#205d9c" stroke-width="4.4" stroke-linecap="round" /><path d="M 225.000 69.000 A 195 195 0 0 1 225.000 459.000" fill="none" stroke="#266f73" stroke-width="4.6" /><line x1="225.0000" y1="69.0000" x2="420.0000" y2="459.0000" stroke="#aa5411" stroke-width="4.55" stroke-linecap="round" /><line x1="190.0000" y1="69.0000" x2="190.0000" y2="459.0000" stroke="#704895" stroke-width="1.7" stroke-linecap="round" /><line x1="184.0000" y1="69.0000" x2="196.0000" y2="69.0000" stroke="#704895" stroke-width="1.85" stroke-linecap="round" /><line x1="184.0000" y1="459.0000" x2="196.0000" y2="459.0000" stroke="#704895" stroke-width="1.85" stroke-linecap="round" /><text x="137.0000" y="273.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#704895" text-anchor="middle">4x³y</text><line x1="225.0000" y1="494.0000" x2="420.0000" y2="494.0000" stroke="#205d9c" stroke-width="1.7" stroke-linecap="round" /><line x1="225.0000" y1="488.0000" x2="225.0000" y2="500.0000" stroke="#205d9c" stroke-width="1.85" stroke-linecap="round" /><line x1="420.0000" y1="488.0000" x2="420.0000" y2="500.0000" stroke="#205d9c" stroke-width="1.85" stroke-linecap="round" /><text x="322.5000" y="524.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#205d9c" text-anchor="middle">2x³y</text><circle cx="225" cy="69" r="4.1" fill="#28364b" /><text x="211.0000" y="56.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">A</text><circle cx="225" cy="459" r="4.1" fill="#28364b" /><text x="209.0000" y="486.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">B</text><circle cx="420" cy="459" r="4.1" fill="#28364b" /><text x="436.0000" y="486.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">C</text><circle cx="420" cy="69" r="4.1" fill="#28364b" /><text x="437.0000" y="58.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">D</text><circle cx="225" cy="264" r="4.1" fill="#28364b" /><text x="210.0000" y="279.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">O</text></svg>
