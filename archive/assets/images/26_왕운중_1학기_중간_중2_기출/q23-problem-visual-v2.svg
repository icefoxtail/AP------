<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" width="720" height="460" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">직사각형 A와 B를 밑변에 맞춰 붙인 그림으로, 원본 접합부의 두 직각표식과 두 세로 길이 및 가로 전체 L을 표시한다.</title><desc id="visual-desc">왼쪽의 큰 직사각형 A와 오른쪽의 작은 직사각형 B가 밑변을 일직선으로 하여 붙어 있다. A의 높이는 5xy, B의 높이는 3x²y²이며 밑변 전체가 L이다. 두 도형이 만나는 세로선의 위아래에 직각 표시가 있고 두 내부는 옅은 회색이다.</desc><rect width="720" height="460" fill="#fff"/><g data-layer="10"><path id="regionA" data-role="region" stroke="none" stroke-width="1.6" fill="#e4e7ec" data-owner-points="P Q R S" data-mark="region" data-mark-id="regionA" fill-rule="evenodd" d="M94.985300358 370.240772967 L94.985300358 78.963065309 L386.263008017 78.963065309 L386.263008017 370.240772967 L94.985300358 370.240772967 Z"/></g><g data-layer="10"><path id="regionB" data-role="region" stroke="none" stroke-width="1.6" fill="#e4e7ec" data-owner-points="S T U V" data-mark="region" data-mark-id="regionB" fill-rule="evenodd" d="M386.263008017 370.240772967 L386.263008017 195.474148372 L561.029632612 195.474148372 L561.029632612 370.240772967 L386.263008017 370.240772967 Z"/></g><g data-layer="30"><line id="sPQ" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="94.985300358" y1="370.240772967" x2="94.985300358" y2="78.963065309"/></g><g data-layer="30"><line id="sQR" data-role="line" stroke="#111" stroke