<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 724 466" width="724" height="466" role="img" aria-labelledby="title desc"><title id="title">밑줄이 이어지는 두 직사각형 A와 B</title><desc id="desc">왼쪽의 파란 직사각형 A는 세로가 5xy이고 오른쪽 청록색 직사각형 B는 세로가 3x²y²이다. 두 도형의 가로 길이의 합에 L을 표시했다.</desc><rect width="724" height="466" fill="white" /><rect x="116" y="105.57500000000002" width="222.74249999999998" height="238.42499999999998" fill="#e8f2fa" stroke="#205d9c" stroke-width="4.4" /><text x="227.3712" y="234.7875" font-size="32" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#205d9c" text-anchor="middle">A</text><rect x="338.74249999999995" y="210.24357499999996" width="245.31000000000006" height="133.75642500000004" fill="#e2f1ea" stroke="#266f73" stroke-width="4.4" /><text x="461.3975" y="287.1218" font-size="32" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#266f73" text-anchor="middle">B</text><line x1="90.0000" y1="105.5750" x2="90.0000" y2="344.0000" stroke="#205d9c" stroke-width="1.7" stroke-linecap="round" /><line x1="84.0000" y1="105.5750" x2="96.0000" y2="105.5750" stroke="#205d9c" stroke-width="1.85" stroke-linecap="round" /><line x1="84.0000" y1="344.0000" x2="96.0000" y2="344.0000" stroke="#205d9c" stroke-width="1.85" stroke-linecap="round" /><text x="43.0000" y="233.7875" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#205d9c" text-anchor="middle">5xy</text><line x1="610.0525" y1="210.2436" x2="610.0525" y2="344.0000" stroke="#266f73" stroke-width="1.7" stroke-linecap="round" /><line x1="604.0525" y1="210.2436" x2="616.0525" y2="210.2436" stroke="#266f73" stroke-width="1.85" stroke-linecap="round" /><line x1="604.0525" y1="344.0000" x2="616.0525" y2="344.0000" stroke="#266f73" stroke-width="1.85" stroke-linecap="round" /><text x="659.0525" y="286.1218" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#266f73" text-anchor="middle">3x²y²</text><line x1="116.0000" y1="386.0000" x2="584.0525" y2="386.0000" stroke="#586574" stroke-width="1.7" stroke-linecap="round" /><line x1="116.0000" y1="380.0000" x2="116.0000" y2="392.0000" stroke="#586574" stroke-width="1.85" stroke-linecap="round" /><line x1="584.0525" y1="380.0000" x2="584.0525" y2="392.0000" stroke="#586574" stroke-width="1.85" stroke-linecap="round" /><text x="350.0263" y="420.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#586574" text-anchor="middle">L</text></svg>
