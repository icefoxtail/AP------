<svg xmlns="http://www.w3.org/2000/svg" width="480" height="476" viewBox="0 0 480 476" role="img" aria-labelledby="visual-title visual-desc" data-composite="composite-panels-v1"><title id="visual-title">△ABD는 B에서 직각이므로 BD²=8²−4²=48, BD=CD=4√3이다. AD를 축으로 두고 A에서 AD 방향으로 B의 정사영 길이가 (16+64−48)/16=2이므로 축에서 B, C까지의 거리는 2√3이고, 평면 ABD와 ACD가 이루는 각이 60°이므로 BC=2√3이다. 사면체의 부피는 8√3, △DBC의 넓이는 3√15이다. 3V=AD×[△DBC]×sinθ에서 sinθ=1/√5이고 θ는 예각이므로 cosθ=2√5/5이다. 따라서 답은 2√5/5이다.</title><desc id="visual-desc">세로로 선 선분 AD를 축으로 한 사면체 ABCD가 있다. B와 C는 같은 높이의 축 둘레에 있고 B에는 직각 표시가 있다.</desc><g id="p1-caption" data-role="caption" data-panel="1" data-font-px="28.5"><g id="p1-p1-caption-text" transform="translate(162.10949999999997 33.366)" data-label-kind="CAPTION" data-owner="panel-1" data-fragment-sha="sha256:f7d14f6f1b9e4c99436f52f88e69344f0824cb6bf0773db1756c116111b1385c"><svg xmlns="http://www.w3.org/2000/svg" width="155.78100000000003" height="41.268" viewBox="0 0 155.78100000000003 41.268" data-outline-width="155.78100000000003" data-outline-height="41.268" id="lb-1ebae45f7dffe4e9b7809bee2ade802e028e2bf511bc4a17ed3494375ed0f86a" data-owner="panel-1" data-fact-role="GIVEN"><path d="M8.37900 17.61300L8.37900 12.22650L9.17700 12.22650L9.17700 17.61300Q9.17700 19.43700 8.53575 21.23250Q7.89450 23.02800 6.85425 24.60975Q5.81400 26.19150 4.57425 27.43125Q3.33450 28.67100 2.13750 29.38350L2.13750 29.38350L1.51050 28.64250Q2.65050 28.01550 3.86175 26.86125Q5.07300 25.70700 6.09900 24.19650Q7.12500 22.68600 7.75200 21.00450Q8.37900 19.32300 8.37900 17.61300L8.37900 17.61300ZM8.46450 17.61300L8.46450 12.22650L9.26250 12.22650L9.26250 17.61300Q9.26250 19.23750 9.90375 20.86200Q10.54500 22.48650 11.59950 23.91150Q12.65400 25.33650 13.87950 26.43375Q15.10500 27.53100 16.24500 28.12950L16.24500 28.12950L15.61800 28.87050Q14.39250 28.18650 13.13850 27.01800Q11.88450 25.84950 10.83000 24.33900Q9.77550 22.82850 9.12000 21.10425Q8.46450 19.38000 8.46450 17.61300L8.46450 17.61300ZM19.69350 34.96950L19.69350 9