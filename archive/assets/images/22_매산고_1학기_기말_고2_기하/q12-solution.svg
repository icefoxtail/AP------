<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 348 428" width="348" height="428" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-ellipse-figure="ellipse-figure-v1" data-major-axis="Y" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="6" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round"><title id="visual-title">밑변 AB가 고정되므로 삼각형 ABP의 넓이는 P에서 직선 AB까지의 거리가 클 때 최대이다. 직선 AB는 8x+5y=40이고, AB와 평행한 두 접선 중 AB에서 더 먼 접선의 접점이 P(−5/√2, −8/√2)이다(점 S는 P와 대칭인 다른 접점). 접선 xx₀/25+yy₀/64=1에서 y=0이면 x=25/x₀=−5√2이므로 접선은 x축과 N(−5√2, 0)에서 만난다. 따라서 답은 ②이다.</title><desc id="visual-desc">세로로 긴 타원과 위쪽 꼭짓점 A, 오른쪽 꼭짓점 B를 잇는 직선, 이 직선과 평행한 두 접선이 있다. 왼쪽 아래 접점 P와 삼각형 ABP가 색칠되어 있고 접선이 x축과 만나는 점 N이 표시되어 있다.</desc><rect width="348" height="428" fill="#fff"/><g data-layer="10"><line id="axis-x" data-role="axis" data-axis="x" x1="34" y1="214" x2="313.18" y2="214" fill="none" stroke="#444" stroke-width="1.1"/></g><g data-layer="10"><line id="axis-y" data-role="axis" data-axis="y" x1="194.89" y1="394" x2="194.89" y2="34" fill="none" stroke="#444" stroke-width="1.1"/></g><g data-layer="11"><polygon id="axis-x-head" data-role="axis-head" data-axis="x" points="313.18,214 304.18,210.4 304.18,217.6" fill="#444" stroke="none"/></g><g data-layer="11"><polygon id="axis-y-head" data-role="axis-head" data-axis="y" points="194.89,34 191.29,43 198.49,43" fill="#444" stroke="none"/></g><g data-layer="20"><polygon id="polygon-tri" data-role="polygon" data-points="A,B,P" points="194.89,49.43 297.75,214 122.16,330.37" fill="#eeeeee" stroke="none"/></g><g data-layer="25"><ellipse id="ellipse" data-role="ellipse" cx="194.89" cy="214" rx="102.86" ry="164.57" fill="none" stroke="#111" stroke-width="1.7"/></g><g data-layer="30"><line id="line-ab" data-role="line" data-line="ab" x1="313.18" y1="238.69" x2="185.25" y2="34" fill="none" stroke="#111" stroke-width="1.3"/></g><g data-layer="30"><line id="line-t1" data-role="line" d