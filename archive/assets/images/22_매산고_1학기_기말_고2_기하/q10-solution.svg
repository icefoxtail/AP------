<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" width="560" height="420" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">지름의 양 끝점의 중점이 구의 중심 C(4, 3, 1)이고 반지름의 제곱은 (1/4)(2²+2²+6²)=11이다. 그림은 구의 중심 C에서 xz평면에 내린 수선의 발 H와 단면원 위의 한 점 X를 지나는 직각삼각형이다. CH=3은 중심에서 xz평면(y=0)까지의 거리이고 CX=√11은 구의 반지름이므로 단면원의 반지름은 HX=√(11−9)=√2이다. 단면의 넓이는 2π이다. 따라서 답은 ③이다.</title><desc id="visual-desc">H에서 직각을 이루는 직각삼각형 CHX가 있다. 세로 변 CH는 3, 가로 변 HX는 √2, 빗변 CX는 √11이고 직각 표시가 있다.</desc><rect width="560" height="420" fill="#fff"/><g data-layer="30"><line id="CH" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="205.080352946" y1="51.071428571" x2="205.080352946" y2="368.928571429"/></g><g data-layer="30"><line id="HX" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="205.080352946" y1="368.928571429" x2="354.919647054" y2="368.928571429"/></g><g data-layer="30"><line id="CX" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="205.080352946" y1="51.071428571" x2="354.919647054" y2="368.928571429"/></g><g data-layer="60"><polyline id="rH" data-role="indicator" stroke="#111" stroke-width="0.8" fill="none" points="205.080352946,358.928571429 215.080352946,358.928571429 215.080352946,368.928571429"/></g><g data-layer="70"><circle id="C" data-role="point" stroke="#111" stroke-width="0.8" fill="#111" cx="205.080352946" cy="51.071428571" r="3.2"/></g><g data-layer="70"><circle id="H" data-role="point" stroke="#111" stroke-width="0.8" fill="#111" cx="205.080352946" cy="368.928571429" r="3.2"/></g><g data-layer="70"><circle id="X" data-role="point" stroke="#111" stroke-width="0.8" fill="#111" cx="354.919647054" cy="368.928571429" r="3.2"/></g><g data-layer="90"><g id="C-name" data-label-kind="POINT_NAME" data-priority="1" data-font-px="23.5" data-owner="C" data-fragment-sha="sha256:c2a96e58daf6108a026eff3220b22e609a0ed7b49247a25c934826a99e125f07" transform="translate(196.150352946 21.986928571)"><svg xmlns="http://www.w3.org/2000/svg" width="17.86" height="17.0845" viewBox="0 0 17.86 17.0845" data-outline-width="17.86" data-outline-height="17.0845" id="lb-60592b71d8be483ec486d33b7f4110bdb75fea6fbcb149fbd9ad1a591f64bb04" data-owner="C" data-fact-role="GIVEN"><g data-outline-units-per-em="1000" transform="translate(0 16.5675) scale(0.0235)"><g stroke="currentColor" fill="currentColor" stroke-width="30" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mi"><path data-c="1D436" d="M50 252Q50 367 117 473T286 641T490 704Q580 704 633 653Q642 643 648 636T656 626L657 623Q660 623 684 649Q691 655 699 663T715 679T725 690L740 705H746Q760 705 760 698Q760 694 728 561Q692 422 692 421Q690 416 687 415T669 413H653Q647 419 647 422Q647 423 648 429T650 449T651 481Q651 552 619 605T510 659Q484 659 454 652T382 628T299 572T226 479Q194 422 175 346T156 222Q156 108 232 58Q280 24 350 24Q441 24 512 92T606 240Q610 253 612 255T628 257Q648 257 648 248Q648 243 647 239Q618 132 523 55T319 -22Q206 -22 128 53T50 252Z"></path></g></g></g></g></svg></g></g><g data-layer="90"><g id="H-name" data-label-kind="POINT_NAME" data-priority="1" data-font-px="23.5" data-owner="H" data-fragment-sha="sha256:67faedb3fcbb27397ef0247aaedc2253dcbeb47894fb5c1f34ec7cbcd298e2eb" transform="translate(217.080352946 380.928571429)"><svg xmlns="http://www.w3.org/2000/svg" width="20.868" height="16.0505" viewBox="0 0 20.868 16.0505"