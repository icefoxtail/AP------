<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 528 391" width="528" height="391" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-ellipse-figure="ellipse-figure-v1" data-major-axis="X" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="6" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round"><title id="visual-title">x²/45+y²/20=1에서 a²=45, b²=20이고 c²=a²−b²=25이므로 c=5이다. 직각삼각형 OFB에서 OF=c=5, OB=b=2√5, BF=a=3√5이고 5²+(2√5)²=(3√5)²이다. 두 초점 F(5, 0), F′(−5, 0) 사이의 거리는 FF′=2c=10이다. 따라서 답은 ④이다.</title><desc id="visual-desc">가로로 긴 타원과 두 초점 F, F′, 위쪽 꼭짓점 B가 있다. 원점 O와 F, B를 이은 직각삼각형이 색칠되어 있고 점선 FF′의 길이와 세 변의 길이가 표시되어 있다.</desc><rect width="528" height="391" fill="#fff"/><g data-layer="10"><line id="axis-x" data-role="axis" data-axis="x" x1="34" y1="195.96" x2="494" y2="195.96" fill="none" stroke="#444" stroke-width="1.1"/></g><g data-layer="10"><line id="axis-y" data-role="axis" data-axis="y" x1="264" y1="357" x2="264" y2="34.91" fill="none" stroke="#444" stroke-width="1.1"/></g><g data-layer="11"><polygon id="axis-x-head" data-role="axis-head" data-axis="x" points="494,195.96 485,192.36 485,199.56" fill="#444" stroke="none"/></g><g data-layer="11"><polygon id="axis-y-head" data-role="axis-head" data-axis="y" points="264,34.91 260.4,43.91 267.6,43.91" fill="#444" stroke="none"/></g><g data-layer="20"><polygon id="polygon-tri" data-role="polygon" data-points="O,F,B" points="264,195.96 418.19,195.96 264,58.04" fill="#eeeeee" stroke="none"/></g><g data-layer="25"><ellipse id="ellipse" data-role="ellipse" cx="264" cy="195.96" rx="206.87" ry="137.91" fill="none" stroke="#111" stroke-width="1.7"/></g><g data-layer="30"><line id="segment-sOF" data-role="segment" data-from="O" data-to="F" x1="264" y1="195.96" x2="418.19" y2="195.96" fill="none" stroke="#111" stroke-width="1.3"/></g><g data-layer="30"><line id="segment-sOB" data-role="segment" data-from="O" data-to="B" x1="264" y1="195.96" 