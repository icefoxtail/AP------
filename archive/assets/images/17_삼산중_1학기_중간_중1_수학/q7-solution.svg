<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 320" width="560" height="320" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">절댓값이 가장 큰 수는 |-10| = 10인 -10이므로 a = -10이고, 절댓값이 가장 작은 수는 |1| = 1인 1이므로 b = 1이다. 따라서 a + b = -10 + 1 = -9이다. 따라서 답은 ②이다.</title><desc id="visual-desc">수직선 위에 -10, -8/3, -2, 1, 3, 4가 표시되어 있고, -10 옆에 a, 1 옆에 b가 적혀 있으며, 0에서 -10까지의 거리 10이 치수선으로 나타난 그림이다.</desc><rect width="560" height="320" fill="#fff"/><g data-layer="30"><line id="sAxis" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="58.571428571" y1="158.616071429" x2="501.428571429" y2="158.616071429"/></g><g data-layer="52"><line id="dA-ext-from" data-role="indicator" stroke="#111" stroke-width="0.8" fill="none" data-mark="dimension" data-mark-id="dA" data-mark-part="ext-from" x1="363.035714286" y1="162.616071429" x2="363.035714286" y2="185.616071429"/></g><g data-layer="52"><line id="dA-ext-to" data-role="indicator" stroke="#111" stroke-width="0.8" fill="none" data-mark="dimension" data-mark-id="dA" data-mark-part="ext-to" x1="86.25" y1="162.616071429" x2="86.25" y2="185.616071429"/></g><g data-layer="52"><line id="dA-line" data-role="indicator" stroke="#111" stroke-width="1.0" fill="none" data-mark="dimension" data-mark-id="dA" data-mark-part="line" x1="363.035714286" y1="182.616071429" x2="86.25" y2="182.616071429"/></g><g data-layer=