<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 320" width="560" height="320" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">그림에서 흰 바둑돌 4개와 검은 바둑돌 6개가 한 주기 10개로 반복된다. 200 = 10 × 20이므로 200번째 바둑돌은 한 주기의 마지막인 검은 돌이다. 한 주기에 흰 돌 4개, 검은 돌 6개이므로 200개 중 흰 돌은 4 × 20 = 80개, 검은 돌은 6 × 20 = 120개이다. 따라서 200번째는 검은 돌이고, 흰 돌 80개, 검은 돌 120개이다.</title><desc id="visual-desc">가로로 늘어놓은 바둑돌 열 개를 보여 주며, 앞쪽 흰 돌 네 개와 뒤쪽 검은 돌 여섯 개를 각각 치수선과 함께 구분한 그림이다.</desc><rect width="560" height="320" fill="#fff"/><g data-layer="30"><line id="sLine" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="58.571428571" y1="182.142857143" x2="501.428571429" y2="182.142857143"/></g><g data-layer="52"><line id="dW-ext-from" data-role="indicator" stroke="#111" stroke-width="0.8" fill="none" data-mark="dimension" data-mark-id="dW" data-mark-part="ext-from" x1="58.571428571" y1="186.142857143" x2="58.571428571" y2="201.642857143"/></g><g data-layer="52"><line id="dW-ext-to" data-role="indicator" stroke="#111" stroke-width="0.8" fill="none" data-mark="dimension" data-mark-id="dW" data-mark-part="ext-to" x1="206.19047619" y1="186.142857143" x2="206.19047619" y2="201.642857143"/></g><g data-layer="52"><line id="dW-line" data-role="indicator" stroke="#111" stroke-width="1.0" fill="none" data-mark="dimension" data-mark-id="dW" data-mark-part="line" x1="58.571428571" y