<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc" data-visual-provenance="PYTHON_DERIVED" data-geometry-policy="v1.1">
<title id="title">10번 공간도형의 평면 환원</title><desc id="desc">정사면체에서 BD가 평면 AMC에 수직임을 보이고, 정팔면체에서는 FI와 GH의 평행 관계를 이용해 각을 평면으로 환원한다.</desc>
<style>.bg{fill:#fff}.main{stroke:#111;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}.guide{stroke:#555;stroke-width:1.3;fill:none}.hidden{stroke:#888;stroke-width:1.1;stroke-dasharray:5 5;fill:none}.emph{stroke:#111;stroke-width:2.5;fill:none}.point{fill:#111;stroke:#111;stroke-width:1}.label{font-family:"Noto Sans KR","Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:14px;fill:#111}.small{font-family:"STIX Two Math","Cambria Math","Times New Roman",serif;font-size:12px;fill:#222}.panel{fill:none;stroke:#bbb;stroke-width:1}.plane{fill:#f7f7f7;stroke:#777;stroke-width:1.1}.right{fill:none;stroke:#111;stroke-width:1.3}</style>
<rect class="bg" x="0" y="0" width="640" height="420" />
<rect class="panel" x="36" y="42" width="276" height="322" /><text class="small" x="174" y="63" text-anchor="middle">(1)</text>
<polygon class="plane" points="263.7,97.0 174.0,252.3 84.3,132.4" />
<line class="guide" x1="263.7" y1="97.0" x2="122.2" y2="221.7" /><line class="guide" x1="263.7" y1="97.0" x2="84.3" y2="132.4" /><line class="guide" x1="263.7" y1="97.0" x2="225.8" y2="283.0" />
<line class="guide" x1="122.2" y1="221.7" x2="84.3" y2="132.4" /><line id="BD" class="emph" x1="122.2" y1="221.7" x2="225.8" y2="283.0" /><line class="hidden" x1="84.3" y1="132.4" x2="225.8" y2="283.0" />
<line id="AM" class="emph" x1="263.7" y1="97.0" x2="174.0" y2="252.3" /><line id="CM" class="guide" x1="84.3" y1="132.4" x2="174.0" y2="252.3" /><polyline class="right" points="180.0,241.9 190.3,248.1 184.3,258.4" />
<circle id="pt-A" class="point" cx="263.7" cy="97.0" r="3.2" /><text class="small" x="271.7" y="90.0" text-anchor="start">A</text><circle id="pt-B" class="point" cx="122.2" cy="221.7" r="3.2" /><text class="small" x="130.2" y="214.0" text-anchor="start">B</text><circle id="pt-C" class="point" cx="84.3" cy="132.4" r="3.2" /><text class="small" x="76.3" y="125.0" text-anchor="end">C</text><circle id="pt-D" class="point" cx="225.8" cy="283.0" r="3.2" /><text class="small" x="233.8" y="300.0" text-anchor="start">D</text><circle id="pt-M" class="point" cx="174.0" cy="252.3" r="3.2" /><text class="small" x="181.0" y="265.0" text-anchor="start">M</text><text class="small" x="174" y="338" text-anchor="middle">BD ⟂ AM, BD ⟂ CM ⇒ BD ⟂ AC</text>
<rect class="panel" x="328" y="42" width="276" height="322" /><text class="small" x="466" y="63" text-anchor="middle">(2)</text>
<line id="FI" class="emph" x1="382" y1="244" x2="468" y2="244" /><line class="guide" x1="468" y1="244" x2="536" y2="294" /><line id="GH" class="emph" x1="536" y1="294" x2="450" y2="294" /><line class="guide" x1="450" y1="294" x2="382" y2="244" />
<line id="EF" class="emph" x1="425" y1="169" x2="382" y2="244" /><line id="EI" class="guide" x1="425" y1="169" x2="468" y2="244" />
<circle class="point" cx="425" cy="169" r="3.2" /><text class="small" x="432" y="162">E</text><circle class="point" cx="382" cy="244" r="3.2" /><text class="small" x="374" y="238" text-anchor="end">F</text><circle class="point" cx="468" cy="244" r="3.2" /><text class="small" x="476" y="238">I</text><circle class="point" cx="536" cy="294" r="3.2" /><text class="small" x="544" y="288">H</text><circle class="point" cx="450" cy="294" r="3.2" /><text class="small" x="442" y="288" text-anchor="end">G</text>
<text class="small" x="466" y="323" text-anchor="middle">FI ∥ GH</text><text class="small" x="466" y="342" text-anchor="middle">∠EFI = 60°</text>
