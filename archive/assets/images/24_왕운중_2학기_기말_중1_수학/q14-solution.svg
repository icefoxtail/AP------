<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 390" role="img" aria-label="두 기둥의 겉넓이와 부피 없는 면적 비교">
<rect width="820" height="390" fill="white"/><text x="28" y="34" font-size="22" font-weight="700">밑면의 넓이·둘레로 기둥의 겉넓이 비교</text>
<path d="M80 105 L170 105 L80 195 Z" fill="#dbeafe" stroke="#111827" stroke-width="2"/><text x="82" y="88" font-size="15">6</text><text x="178" y="152" font-size="15">8</text><text x="70" y="157" font-size="15">10</text><text x="55" y="224" font-size="14">삼각기둥 길이 10</text>
<path d="M265 104 L265 194 L320 194 L320 176 Z" fill="#dcfce7" stroke="#111827" stroke-width="2"/><text x="238" y="151" font-size="14">10</text><text x="286" y="213" font-size="14">6</text><text x="323" y="190" font-size="14">2</text><text x="288" y="94" font-size="14">10</text><text x="246" y="238" font-size="14">사다리꼴 밑면</text>
<rect x="375" y="62" width="415" height="286" rx="12" fill="#f8fafc" stroke="#cbd5e1"/><text x="400" y="97" font-size="18" font-weight="700">삼각기둥</text><text x="400" y="132" font-size="16">밑면 넓이 = 6×8÷2 = 24</text><text x="400" y="164" font-size="16">밑면 둘레 = 6+8+10 = 24</text><text x="400" y="198" font-size="16">겉넓이 = 2×24+24×10 = 288 cm²</text><text x="400" y="240" font-size="18" font-weight="700">사각기둥 겉넓이 = 2×288 = 576 cm²</text><text x="400" y="278" font-size="16">2×36+28h = 576</text><text x="400" y="317" font-size="20" font-weight="700">h = 18 cm</text></svg>
