<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 300" role="img" aria-label="원뿔대의 겉넓이와 구의 겉넓이 계산">
<rect width="650" height="300" fill="white"/><text x="28" y="36" font-size="22" font-weight="700">원뿔대와 구의 겉넓이</text><path d="M75 95 L125 225 M205 95 L255 225" stroke="#2563eb" stroke-width="4"/><ellipse cx="140" cy="95" rx="65" ry="18" fill="none" stroke="#111827" stroke-width="2"/><ellipse cx="165" cy="225" rx="130" ry="32" fill="none" stroke="#111827" stroke-width="2"/><line x1="140" y1="95" x2="205" y2="95" stroke="#dc2626" stroke-width="2"/><text x="210" y="101" font-size="15">5</text><line x1="165" y1="225" x2="295" y2="225" stroke="#dc2626" stroke-width="2"/><text x="300" y="231" font-size="15">10</text><text x="32" y="164" font-size="15">모선 13</text><text x="340" y="100" font-size="18">S₁ = π(10+5)×13 + π(10²+5²)</text><text x="340" y="136" font-size="18">= 195π+125π = 320π</text><text x="340" y="194" font-size="18">S₂ = 4π×4² = 64π</text><text x="340" y="246" font-size="21" font-weight="700">S₁/S₂ = 320/64 = 5</text></svg>
