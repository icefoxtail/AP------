<rect width="420" height="300" fill="white"/><text x="22" y="28" font-size="20" font-weight="700">맞꼭지각으로 두 삼각형 연결</text><path d="M100 160 L193 185 L200 160 Z M200 160 L221 81 L300 160 Z" fill="#f8fafc" stroke="#111827" stroke-width="2.5"/><path d="M192 171 L204 174 L201 186" fill="none" stroke="#111827" stroke-width="2"/><text x="107" y="145" font-size="16">15°</text><text x="174" y="204" font-size="16">90°</text><text x="203" y="151" font-size="16" fill="#2563eb">75°</text><text x="231" y="91" font-size="16">60°</text><text x="302" y="168" font-size="16" fill="#dc2626">x</text><rect x="28" y="226" width="360" height="50" rx="8" fill="#eff6ff"/><text x="45" y="257" font-size="17">180°−90°−15°=75°,  x=180°−75°−60°=45°</text></svg>
