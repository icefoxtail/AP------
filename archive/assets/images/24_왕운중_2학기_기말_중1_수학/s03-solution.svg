<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 390" role="img" aria-label="원기둥 안에 세 구가 쌓이고 물 부피가 보존된다">
<rect width="660" height="390" fill="white"/><text x="28" y="34" font-size="22" font-weight="700">쇠공을 꺼내도 물의 부피는 그대로</text><ellipse cx="145" cy="78" rx="60" ry="17" fill="#f8fafc" stroke="#111827" stroke-width="2"/><path d="M85 78V330 M205 78V330" stroke="#111827" stroke-width="2"/><ellipse cx="145" cy="330" rx="60" ry="17" fill="#dbeafe" stroke="#111827" stroke-width="2"/><circle cx="145" cy="120" r="42" fill="#cbd5e1" stroke="#475569" stroke-width="2"/><circle cx="145" cy="204" r="42" fill="#cbd5e1" stroke="#475569" stroke-width="2"/><circle cx="145" cy="288" r="42" fill="#cbd5e1" stroke="#475569" stroke-width="2"/><line x1="145" y1="120" x2="187" y2="120" stroke="#2563eb" stroke-width="2"/><text x="193" y="126" font-size="14">r=3 cm</text><rect x="285" y="67" width="345" height="260" rx="12" fill="#eff6ff" stroke="#93c5fd"/><text x="310" y="111" font-size="18">원기둥: π×3²×18 = 162π</text><text x="310" y="153" font-size="17">쇠공 3개: 3×(4/3)π×3³ = 108π</text><text x="310" y="196" font-size="18">물 부피: 162π−108π = 54π</text><text x="310" y="244" font-size="19" font-weight="700">물 높이: 54π÷(π×3²)</text><text x="310" y="282" font-size="21" font-weight="700">= 6 cm</text></svg>
