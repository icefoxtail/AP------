<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 320" role="img" aria-label="색칠한 육각형 둘레는 네 변과 120도 원호">
<rect width="620" height="320" fill="white"/><text x="24" y="30" font-size="21" font-weight="700">둘레에서 네 변과 원호를 더한다</text><path d="M95 165 L155 61 L275 61 L335 165 L275 269 L155 269 Z" fill="#f8fafc" stroke="#64748b" stroke-width="2"/><path d="M155 61 L275 61 L335 165 L275 269 L155 269" fill="none" stroke="#2563eb" stroke-width="4"/><path d="M155 61 A120 120 0 0 1 155 269" fill="none" stroke="#dc2626" stroke-width="4"/><circle cx="95" cy="165" r="4" fill="#111827"/><text x="104" y="187" font-size="15">중심</text><text x="55" y="164" font-size="15">r=12</text><text x="287" y="160" font-size="15" fill="#dc2626">120°</text><rect x="380" y="74" width="218" height="172" rx="12" fill="#eff6ff" stroke="#93c5fd"/><text x="400" y="112" font-size="17">직선 부분: 4×12=48</text><text x="400" y="153" font-size="17">호: 2π×12×120/360=8π</text><text x="400" y="204" font-size="19" font-weight="700">둘레 = 48+8π cm</text></svg>
