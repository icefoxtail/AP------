<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 310" role="img" aria-label="세 부채꼴의 중심과 반지름을 확인하고 넓이를 계산">
<rect width="760" height="310" fill="white"/><text x="24" y="30" font-size="21" font-weight="700">사다리꼴의 길이와 각으로 P, Q, R 계산</text>
<g transform="translate(0 55)"><path d="M150 132 L210 132 L240 184 L120 184 Z" fill="#f8fafc" stroke="#111827" stroke-width="2"/><line x1="90" y1="132" x2="240" y2="132" stroke="#111827"/><line x1="90" y1="184" x2="420" y2="184" stroke="#111827"/>
<path d="M150 132 L90 132 A60 60 0 0 0 120 184" fill="none" stroke="#2563eb" stroke-width="2.5"/><path d="M210 132 L90 132 A120 120 0 0 0 150 28" fill="none" stroke="#dc2626" stroke-width="2.5"/><path d="M240 184 L150 28 A180 180 0 0 1 420 184" fill="none" stroke="#16a34a" stroke-width="2.5"/>
<text x="151" y="124" font-size="14">A</text><text x="212" y="124" font-size="14">B</text><text x="244" y="198" font-size="14">C</text><text x="106" y="198" font-size="14">D</text><text x="73" y="137" font-size="14">E</text><text x="143" y="23" font-size="14">F</text><text x="424" y="190" font-size="14">G</text><text x="116" y="164" font-size="14" fill="#2563eb">P, r=2, 60°</text><text x="132" y="91" font-size="14" fill="#dc2626">Q, r=4, 60°</text><text x="315" y="122" font-size="14" fill="#16a34a">R, r=6, 120°</text>
</g><text x="470" y="84" font-size="17" fill="#2563eb">P = 2²π×60/360 = 2π/3</text><text x="470" y="124" font-size="17" fill="#dc2626">Q = 4²π×60/360 = 8π/3</text><text x="470" y="164" font-size="17" fill="#16a34a">R = 6²π×120/360 = 12π</text><text x="470" y="224" font-size="19" font-weight="700">R+Q−P = 14π cm²</text></svg>
