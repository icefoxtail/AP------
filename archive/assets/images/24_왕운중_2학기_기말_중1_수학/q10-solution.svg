<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 330" role="img" aria-label="색칠한 부분의 둘레 구성">
<rect width="620" height="330" fill="white"/><text x="28" y="34" font-size="22" font-weight="700">둘레는 바깥 원·두 안쪽 호·두 지름선의 합</text><circle cx="160" cy="175" r="90" fill="#f1f5f9" stroke="#2563eb" stroke-width="4"/><path d="M70 175 A54 54 0 0 1 178 175 L70 175Z" fill="white" stroke="#dc2626" stroke-width="3"/><path d="M178 175 A36 36 0 0 1 250 175 L178 175Z" fill="white" stroke="#f59e0b" stroke-width="3"/><line x1="70" y1="175" x2="250" y2="175" stroke="#64748b"/>
<text x="300" y="100" font-size="18" fill="#2563eb">큰 원: 반지름 10 cm</text><text x="300" y="137" font-size="18">큰 원 둘레 = 2π×10 = 20π</text><text x="300" y="174" font-size="18" fill="#dc2626">작은 반원호 = 6π</text><text x="300" y="211" font-size="18" fill="#f59e0b">작은 반원호 = 4π</text><text x="300" y="241" font-size="15">두 지름선 = 12+8 = 20 cm</text><text x="300" y="282" font-size="20" font-weight="700">합 = 20π+6π+4π+20 = 30π+20 cm</text></svg>
