<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" preserveAspectRatio="xMidYMid meet" role="img" aria-label="직사각형을 회전해 생긴 속이 빈 원기둥의 반지름과 높이">
<rect width="960" height="440" fill="#ffffff"/>
<text x="35" y="38" font-size="22" font-weight="700" fill="#111827">직사각형의 회전으로 생긴 속이 빈 원기둥</text>
<g stroke="#cbd5e1" stroke-width="2"><line x1="470" y1="65" x2="470" y2="365"/></g>
<text x="62" y="82" font-size="18" font-weight="600" fill="#111827">회전 전: 축에서 떨어진 직사각형</text>
<line x1="85" y1="130" x2="85" y2="318" stroke="#111827" stroke-width="3"/><text x="52" y="121" font-size="16" fill="#111827">회전축</text>
<rect x="123" y="145" width="152" height="160" fill="#dbeafe" stroke="#111827" stroke-width="3"/>
<line x1="85" y1="325" x2="123" y2="325" stroke="#2563eb" stroke-width="2"/><line x1="85" y1="337" x2="275" y2="337" stroke="#111827" stroke-width="1.5"/>
<text x="88" y="360" font-size="16" fill="#2563eb">1 cm</text><text x="168" y="360" font-size="16" fill="#111827">5 cm</text><text x="160" y="231" font-size="18" fill="#111827">8 cm</text><text x="294" y="229" font-size="17" fill="#111827">너비 4 cm</text>
<text x="318" y="214" font-size="30" fill="#64748b">→</text>
<text x="515" y="82" font-size="18" font-weight="600" fill="#111827">회전 후: 안쪽 반지름 1, 바깥 반지름 5</text>
<ellipse cx="720" cy="126" rx="145" ry="29" fill="#eff6ff" stroke="#111827" stroke-width="2.5"/><path d="M575 126 A145 29 0 0 0 865 126" fill="none" stroke="#111827" stroke-width="2.5"/>
<path d="M575 126 L575 300 M865 126 L865 300" fill="none" stroke="#111827" stroke-width="2.5"/><ellipse cx="720" cy="300" rx="145" ry="29" fill="#eff6ff" stroke="#111827" stroke-width="2.5"/>
<ellipse cx="720" cy="126" rx="29" ry="6" fill="#ffffff" stroke="#2563eb" stroke-width="2.5"/><ellipse cx="720" cy="300" rx="29" ry="6" fill="#ffffff" stroke="#2563eb" stroke-width="2.5"/><path d="M691 126 L691 300 M749 126 L749 300" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-dasharray="6 5"/>
<line x1="720" y1="126" x2="865" y2="126" stroke="#dc2626" stroke-width="2.5"/><text x="780" y="116" font-size="17" fill="#dc2626">5 cm</text><line x1="720" y1="126" x2="749" y2="126" stroke="#2563eb" stroke-width="2.5"/><text x="723" y="106" font-size="16" fill="#2563eb">1 cm</text><text x="875" y="220" font-size="17" fill="#111827">높이 8 cm</text>
<text x="510" y="365" font-size="18" fill="#111827">부피: π(5²−1²)×8=192π cm³</text><text x="510" y="399" font-size="18" font-weight="600" fill="#111827">겉넓이: 2π×5×8+2π×1×8+2π(5²−1²)=144π cm²</text>
</svg>