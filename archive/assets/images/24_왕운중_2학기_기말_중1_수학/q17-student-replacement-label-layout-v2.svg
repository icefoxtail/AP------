<g fill="#dc2626"><circle cx="175" cy="240" r="5"/><circle cx="265" cy="210" r="5"/><circle cx="355" cy="150" r="5"/><circle cx="445" cy="150" r="5"/><circle cx="535" cy="210" r="5"/><circle cx="625" cy="240" r="5"/></g>
<text x="24" y="38" font-size="24" fill="#111827">상대도수</text><text x="400" y="382" font-size="24" text-anchor="middle" fill="#111827">계급(권)</text>
<circle cx="428" cy="28" r="5" fill="#2563eb"/><text x="440" y="35" font-size="24" fill="#111827">A반(실선)</text><circle cx="590" cy="28" r="5" fill="#dc2626"/><text x="602" y="35" font-size="24" fill="#111827">B반(점선)</text>
