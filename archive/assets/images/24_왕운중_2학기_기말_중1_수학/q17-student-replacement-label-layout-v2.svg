<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="760" height="430" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="problem-visual-title problem-visual-desc"><title id="problem-visual-title">학급별로 읽은 책의 권수와 상대도수</title><desc id="problem-visual-desc">가로축은 책을 읽은 권수의 계급, 세로축은 상대도수이다. A반의 실선과 B반의 점선은 각 계급의 점을 이은 것이다.</desc>
<rect width="760" height="430" fill="#ffffff"/>
<g stroke="#d7dee8" stroke-width="1"><line x1="130" y1="60" x2="670" y2="60"/><line x1="130" y1="120" x2="670" y2="120"/><line x1="130" y1="180" x2="670" y2="180"/><line x1="130" y1="240" x2="670" y2="240"/><line x1="130" y1="300" x2="670" y2="300"/></g>
<g stroke="#334155" stroke-width="2"><line x1="130" y1="60" x2="130" y2="300"/><line x1="130" y1="300" x2="670" y2="300"/></g>
<g font-size="28" fill="#111827" text-anchor="end"><text x="112" y="309">0.0</text><text x="112" y="249">0.1</text><text x="112" y="189">0.2</text><text x="112" y="129">0.3</text><text x="112" y="69">0.4</text></g>
<g font-size="25" fill="#111827" text-anchor="middle"><text x="175" y="338">0~2</text><text x="265" y="338">3~5</text><text x="355" y="338">6~8</text><text x="445" y="338">9~11</text><text x="535" y="338">12~14</text><text x="625" y="338">15~17</text></g>
<g fill="none" stroke="#2563eb" stroke-width="3"><line x1="130" y1="300" x2="175" y2="270"/><line x1="175" y1="270" x2="265" y2="240"/><line x1="265" y1="240" x2="355" y2="90"/><line x1="355" y1="90" x2="445" y2="150"/><line x1="445" y1="150" x2="535" y2="210"/><line x1="535" y1="210" x2="625" y2="240"/><line x1="625" y1="240" x2="670" y2="300"/></g>
<g fill="none" stroke="#dc2626" stroke-width="3" stroke-dasharray="8 5"><line x1="130" y1="300" x2="175" y2="240"/><line x1="175" y1="240" x2="265" y2="210"/><line x1="265" y1="210" x2="355" y2="150"/><line x1="355" y1="150" x2="445" y2="150"/><line x1="445" y1="150" x2="535" y2="210"/><line x1="535" y1="210" x2="625" y2="240"/><line x1="625" y1="240" x2="670" y2="300"/></g>
