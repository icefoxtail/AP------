<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" preserveAspectRatio="xMidYMid meet" role="img" aria-label="정오각형의 두 이등변삼각형으로 대각선 교점 각을 계산">
<rect width="880" height="420" fill="#ffffff"/>
<g fill="none" stroke="#111827" stroke-width="3"><line x1="230" y1="55" x2="95" y2="153"/><line x1="95" y1="153" x2="146" y2="325"/><line x1="146" y1="325" x2="314" y2="325"/><line x1="314" y1="325" x2="365" y2="153"/><line x1="365" y1="153" x2="230" y2="55"/></g>
<line x1="230" y1="55" x2="146" y2="325" stroke="#2563eb" stroke-width="3"/><line x1="95" y1="153" x2="365" y2="153" stroke="#dc2626" stroke-width="3"/>
<circle cx="200" cy="153" r="5" fill="#111827"/>
<g font-size="18" font-weight="600" fill="#111827"><text x="218" y="40">A</text><text x="73" y="159">B</text><text x="138" y="351">C</text><text x="310" y="351">D</text><text x="370" y="159">E</text><text x="190" y="178">F</text></g>

<line x1="430" y1="45" x2="430" y2="375" stroke="#cbd5e1" stroke-width="2"/>
<g font-size="18" fill="#111827"><text x="465" y="76">정오각형의 각은 108°이고, 변은 모두 같다.</text><text x="465" y="126">AB=AE이므로 △ABE의 밑각은</text><text x="465" y="156">(180°−108°)÷2=36°이다.</text><text x="465" y="206">AB=BC이므로 △ABC에서도</text><text x="465" y="236">∠BCA=(180°−108°)÷2=36°이다.</text><text x="465" y="286">F가 BE와 AC 위에 있으므로</text><text x="465" y="316">∠CBF=108°−36°=72°, ∠BCF=36°.</text></g>
<text x="465" y="366" font-size="22" font-weight="700" fill="#111827">∠BFC=180°−72°−36°=72°</text>
</svg>