<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" role="img" aria-label="삼각형에서 외각과 두 반대쪽 내각의 관계">
<rect width="600" height="300" fill="white"/><text x="28" y="34" font-size="22" font-weight="700">삼각형의 외각은 두 반대쪽 내각의 합</text><path d="M105 220 L220 70 L355 220 Z" fill="none" stroke="#111827" stroke-width="3"/><path d="M105 220 L68 270 M220 70 L260 18" stroke="#111827" stroke-width="2"/><path d="M206 86 A26 26 0 0 0 238 88" fill="none" stroke="#2563eb" stroke-width="3"/><path d="M87 243 A28 28 0 0 1 112 203" fill="none" stroke="#dc2626" stroke-width="3"/><text x="250" y="63" font-size="18">x</text><text x="39" y="250" font-size="18">x+2°</text><text x="310" y="211" font-size="18">58°</text><rect x="394" y="86" width="175" height="128" rx="12" fill="#eff6ff" stroke="#93c5fd"/><text x="413" y="123" font-size="18">x = 180−(x+2)+58</text><text x="413" y="160" font-size="18">2x = 236</text><text x="413" y="194" font-size="20" font-weight="700">x = 118°</text></svg>
