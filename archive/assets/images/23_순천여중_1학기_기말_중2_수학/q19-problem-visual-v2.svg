<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 736 626" width="736" height="626" role="img" aria-labelledby="title desc"><title id="title">두 오르막 직선과 세 교점</title><desc id="desc">파란 직선과 주황 점선은 가로축의 A에서 만난다. 파란 직선은 세로축의 B를, 주황 점선은 세로축의 C를 지난다.</desc><rect width="736" height="626" fill="white" /><line x1="103.0000" y1="456.1116" x2="617.0000" y2="456.1116" stroke="#586574" stroke-width="2.05" stroke-linecap="round" /><polygon points="630.0000,456.1116 617.0000,450.9116 617.0000,461.3116" fill="#586574" /><line x1="448.1333" y1="552.0000" x2="448.1333" y2="110.0000" stroke="#586574" stroke-width="2.05" stroke-linecap="round" /><polygon points="448.1333,97.0000 442.9333,110.0000 453.3333,110.0000" fill="#586574" /><line x1="111.8536" y1="536.4247" x2="586.0131" y2="105.0546" stroke="#21639a" stroke-width="7.5" stroke-linecap="round" /><line x1="112.4860" y1="469.4012" x2="620.5140" y2="392.3708" stroke="#a34c1f" stroke-width="7.5" stroke-linecap="round" stroke-dasharray="12 6" /><circle cx="200.13333333333333" cy="456.1115702479339" r="7.6" fill="#273846" stroke="white" stroke-width="2" /><circle cx="448.1333333333333" cy="230.4917355371901" r="7.6" fill="#21639a" stroke="white" stroke-width="2" /><circle cx="448.1333333333333" cy="418.50826446280996" r="7.6" fill="#a34c1f" stroke="white" stroke-width="2" /><line x1="52.0000" y1="39.0000" x2="97.0000" y2="39.0000" stroke="#21639a" stroke-width="5.65" stroke-linecap="round" /><text x="108.0000" y="46.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#21639a" text-anchor="start">y = ax + b</text><line x1="361.0000" y1="39.0000" x2="406.0000" y2="39.0000" stroke="#a34c1f" stroke-width="5.65" stroke-linecap="round" stroke-dasharray="12 6" /><text x="417.0000" y="46.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#a34c1f" text-anchor="start">y = x/6 + 1</text><text x="646.000" y="443.112" fill="#586574" font-size="31" font-weight="600" font-family="Malgun Gothic, Cambria Math, sans-serif" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="4.0" stroke-linejoin="round">x</text><text x="467.133" y="92.000" fill="#586574" font-size="31" font-weight="600" font-family="Malgun Gothic, Cambria Math, sans-serif" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="4.0" stroke-linejoin="round">y</text><text x="425.133" y="487.112" fill="#586574" font-size="31" font-weight="600" font-family="Malgun Gothic, Cambria Math, sans-serif" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="4.0" stroke-linejoin="round">O</text><text x="182.133" y="432.112" fill="#273846" font-size="31" font-weight="600" font-family="Malgun Gothic, Cambria Math, sans-serif" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="4.0" stroke-linejoin="round">A</text><text x="413.133" y="233.492" fill="#21639a" font-size="31" font-weight="600" font-family="Malgun Gothic, Cambria Math, sans-serif" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="4.0" stroke-linejoin="round">B</text><text x="469.133" y="450.508" fill="#a34c1f" font-size="31" font-weight="600" font-family="Malgun Gothic, Cambria Math, sans-serif" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="4.0" stroke-linejoin="round">C</text></svg>
