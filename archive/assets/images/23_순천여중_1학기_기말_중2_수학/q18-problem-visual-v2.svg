<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 736 564" width="736" height="564" role="img" aria-labelledby="title desc"><title id="title">가로축 오른쪽에서 교차하는 오르막 직선</title><desc id="desc">직선의 식은 y=ax−b이다. 직선은 세로축의 음의 쪽과 가로축의 양의 쪽을 지나 오른쪽 위로 올라간다.</desc><rect width="736" height="564" fill="white" /><line x1="103.0000" y1="276.6571" x2="617.0000" y2="276.6571" stroke="#586574" stroke-width="2.05" stroke-linecap="round" /><polygon points="630.0000,276.6571 617.0000,271.4571 617.0000,281.8571" fill="#586574" /><line x1="308.4009" y1="490.0000" x2="308.4009" y2="110.0000" stroke="#586574" stroke-width="2.05" stroke-linecap="round" /><polygon points="308.4009,97.0000 303.2009,110.0000 313.6009,110.0000" fill="#586574" /><line x1="147.9504" y1="483.4066" x2="621.1641" y2="130.2949" stroke="#21639a" stroke-width="7.5" stroke-linecap="round" /><line x1="77.0000" y1="39.0000" x2="122.0000" y2="39.0000" stroke="#21639a" stroke-width="5.65" stroke-linecap="round" /><text x="133.0000" y="46.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#21639a" text-anchor="start">y = ax − b</text><text x="646.000" y="263.657" fill="#586574" font-size="31" font-weight="600" font-family="Malgun Gothic, Cambria Math, sans-serif" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="4.0" stroke-linejoin="round">x</text><text x="327.401" y="92.000" fill="#586574" font-size="31" font-weight="600" font-family="Malgun Gothic, Cambria Math, sans-serif" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="4.0" stroke-linejoin="round">y</text><text x="285.401" y="307.657" fill="#586574" font-size="31" font-weight="600" font-family="Malgun Gothic, Cambria Math, sans-serif" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="4.0" stroke-linejoin="round">O</text></svg>
