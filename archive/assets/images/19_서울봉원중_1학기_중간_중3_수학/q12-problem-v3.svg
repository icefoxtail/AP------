<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 733 500" width="733" height="500" role="img" aria-labelledby="title desc"><title id="title">정사각형과 직사각형을 하나로 모으기</title><desc id="desc">파란 큰 정사각형은 세 개이고 한 변이 x이다. 초록 직사각형은 네 개이며 두 변은 1과 x이다. 주황 단위 정사각형이 하나 있다.</desc><rect width="733" height="500" fill="white" /><rect x="116" y="116" width="138" height="138" fill="#e1eefb" stroke="#205d9c" stroke-width="3.5" /><rect x="306" y="116" width="138" height="138" fill="#e1eefb" stroke="#205d9c" stroke-width="3.5" /><rect x="496" y="116" width="138" height="138" fill="#e1eefb" stroke="#205d9c" stroke-width="3.5" /><line x1="116.0000" y1="96.0000" x2="254.0000" y2="96.0000" stroke="#205d9c" stroke-width="1.65" stroke-linecap="round" /><line x1="116.0000" y1="91.0000" x2="116.0000" y2="101.0000" stroke="#205d9c" stroke-width="1.65" stroke-linecap="round" /><line x1="254.0000" y1="91.0000" x2="254.0000" y2="101.0000" stroke="#205d9c" stroke-width="1.65" stroke-linecap="round" /><text x="185.0000" y="82.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#205d9c" text-anchor="middle">x</text><line x1="94.0000" y1="116.0000" x2="94.0000" y2="254.0000" stroke="#205d9c" stroke-width="1.65" stroke-linecap="round" /><line x1="99.0000" y1="116.0000" x2="89.0000" y2="116.0000" stroke="#205d9c" stroke-width="1.65" stroke-linecap="round" /><line x1="99.0000" y1="254.0000" x2="89.0000" y2="254.0000" stroke="#205d9c" stroke-width="1.65" stroke-linecap="round" /><text x="69.0000" y="193.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#205d9c" text-anchor="middle">x</text><rect x="120" y="327" width="46" height="138" fill="#e5f3e4" stroke="#277339" stroke-width="3.5" /><rect x="230" y="327" width="46" height="138" fill="#e5f3e4" stroke="#277339" stroke-width="3.5" /><rect x="340" y="327" width="46" height="138" fill="#e5f3e4" stroke="#277339" stroke-width="3.5" /><rect x="450" y="327" width="46