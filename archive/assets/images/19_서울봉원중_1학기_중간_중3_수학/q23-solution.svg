<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 715 466" width="715" height="466" role="img" aria-labelledby="title desc"><title id="title">두 소수의 곱을 푸는 만화 속 힌트</title><desc id="desc">3600에서 1을 빼면 3599이다. 보라 점 60 양쪽의 1만큼 떨어진 두 점이 합차 공식에 대응한다.</desc><rect width="715" height="466" fill="white" /><text x="357.0000" y="96.0000" font-size="36" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#205d9c" text-anchor="middle">3599 = 60² − 1²</text><line x1="93.0000" y1="252.0000" x2="622.0000" y2="252.0000" stroke="#586574" stroke-width="2.2" stroke-linecap="round" /><line x1="201.0000" y1="252.0000" x2="357.0000" y2="252.0000" stroke="#aa5411" stroke-width="5.2" stroke-linecap="round" /><line x1="357.0000" y1="252.0000" x2="513.0000" y2="252.0000" stroke="#aa5411" stroke-width="5.2" stroke-linecap="round" /><circle cx="201" cy="252" r="7" fill="#aa5411" /><text x="201.0000" y="304.0000" font-size="31" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#aa5411" text-anchor="middle">60−1</text><circle cx="357" cy="252" r="7" fill="#704895" /><text x="357.0000" y="304.0000" font-size="31" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#704895" text-anchor="middle">60</text><circle cx="513" cy="252" r="7" fill="#aa5411" /><text x="513.0000" y="304.0000" font-size="31" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#aa5411" text-anchor="middle">60+1</text><line x1="279.0000" y1="243.0000" x2="279.0000" y2="261.0000" stroke="#277339" stroke-width="2.9" stroke-linecap="round" /><text x="279.0000" y="218.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#277339" text-anchor="middle">1</text><line x1="435.0000" y1="243.0000" x2="435.0000" y2="261.0000" stroke="#277339" stroke-width="2.9" stroke-linecap="round" /><text x="435.0000" y="218.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#277339" text-anchor="middle">1</text><text x="355.0000" y="415.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#586574" text-anchor="middle">같은 수의 양쪽에서 1만큼 이동</text></svg>
