<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 715 642" width="715" height="642" role="img" aria-labelledby="title desc"><title id="title">두 소수의 곱을 푸는 만화 속 힌트</title><desc id="desc">등장인물들이 합차 공식을 생각한다. 오른쪽 힌트에는 네 자리 공개 키가 두 소수의 곱이며 작은 소수부터 차례로 붙여 쓴다는 규칙이 있다.</desc><rect width="715" height="642" fill="white" /><rect x="64" y="41" width="539" height="68" rx="16" fill="#e1eefb" stroke="#205d9c" stroke-width="1.9" /><polygon points="86.0000,108.0000 92.0000,126.0000 112.0000,107.0000" fill="#e1eefb" /><text x="333.0000" y="84.0000" font-size="26" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#205d9c" text-anchor="middle">와이파이 비밀번호를 어떻게 알아내지?</text><rect x="110" y="132" width="539" height="68" rx="16" fill="#e5f3e4" stroke="#266f73" stroke-width="1.9" /><polygon points="132.0000,199.0000 138.0000,217.0000 158.0000,198.0000" fill="#e5f3e4" /><text x="379.0000" y="175.0000" font-size="26" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#266f73" text-anchor="middle">왜 뭔데 그래?</text><rect x="64" y="223" width="539" height="68" rx="16" fill="#e1eefb" stroke="#205d9c" stroke-width="1.9" /><polygon points="86.0000,290.0000 92.0000,308.0000 112.0000,289.0000" fill="#e1eefb" /><text x="333.0000" y="266.0000" font-size="26" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#205d9c" text-anchor="middle">힌트가 적혀 있는데 잘 모르겠어.</text><rect x="110" y="314" width="539" height="68" rx="16" fill="#e5f3e4" stroke="#266f73" stroke-width="1.9" /><polygon points="132.0000,381.0000 138.0000,399.0000 158.0000,380.0000" fill="#e5f3e4" /><text x="379.0000" y="357.0000" font-size="26" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#266f73" text-anchor="middle">a²−b²의 인수분해 공식을 써 보면 어때?</text><rect x="49" y="420" width="617" height="188" rx="14" fill="#fae6ce" stroke="#aa5411" stroke-width="2.6" /><text x="356.0000" y="460.0000" font-size="30" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#aa5411" text-anchor="middle">와이파이 비밀번호 힌트</text><text x="356.0000" y="504.0000" font-size="26" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">공개 키로 주어진 네 자리 수는 두 소수의 곱이다.</text><text x="356.0000" y="542.0000" font-size="26" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">두 소수를 찾고, 작은 수부터 큰 수 순으로</text><text x="356.0000" y="578.0000" font-size="26" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">이어 쓰면 비밀번호가 된다.</text></svg>
