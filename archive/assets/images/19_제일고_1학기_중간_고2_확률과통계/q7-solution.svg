<svg xmlns="http://www.w3.org/2000/svg" width="480" height="476" viewBox="0 0 480 476" role="img" aria-labelledby="visual-title visual-desc" data-composite="composite-panels-v1"><title id="visual-title">윗면과 아랫면에 서로 다른 색을 고르는 경우는 6 곱하기 5, 즉 30가지이다. 남은 네 색을 네 옆면에 배열할 때 회전하여 같은 것은 하나로 보므로 (4-1)!가지, 즉 6가지이다. 따라서 30 곱하기 6은 180가지이다. 따라서 답은 ④이다.</title><desc id="visual-desc">정사각뿔대의 윗면과 아랫면, 네 옆면이 보이고, 뒤쪽의 보이지 않는 모서리는 점선으로 나타나 있다.</desc><g id="p1-caption" data-role="caption" data-panel="1" data-font-px="21.4"><g id="p1-p1-caption-text" transform="translate(190.78 38.5064)" data-label-kind="CAPTION" data-owner="panel-1" data-fragment-sha="sha256:5409516905c42da06b59c03cab25b3164ace9620fa3da37b962add14f4cb8d8f"><svg xmlns="http://www.w3.org/2000/svg" width="98.44" height="30.9872" viewBox="0 0 98.44 30.9872" data-outline-width="98.44" data-outline-height="30.9872" id="lb-34ffba7c785b67ee68874c134df25d7aec029cf402ec29a63274533976b9c9bb" data-owner="panel-1" data-fact-role="GIVEN"><path d="M11.19220 13.24660L11.19220 12.60460L16.13560 12.60460L16.13560 13.24660L11.19220 13.24660ZM15.81460 18.66080L15.81460 7.36160L16.52080 7.36160L16.52080 18.66080L15.81460 18.66080ZM10.50740 19.40980L10.50740 19.40980Q12.41200 19.40980 13.77090 19.80570Q15.12980 20.20160 15.86810 20.96130Q16.60640 21.72100 16.60640 22.81240L16.60640 22.81240Q16.60640 24.41740 14.98000 25.30550Q13.35360 26.19360 10.50740 26.19360L10.50740 26.19360Q7.66120 26.19360 6.02410 25.30550Q4.38700 24.41740 4.38700 22.81240L4.38700 22.81240Q4.38700 21.72100 5.12530 20.96130Q5.86360 20.20160 7.23320 19.80570Q8.60280 19.40980 10.50740 19.40980ZM10.50740 20.03040L10.50740 20.03040Q8.88100 20.03040 7.66120 20.37280Q6.44140 20.71520 5.75660 21.33580Q5.07180 21.95640 5.07180 22.81240L5.07180 22.81240Q5.07180 23.64700 5.75660 24.26760Q6.44140 24.88820 7.66120 25.23060Q8.88100 25.57300 10.50740 25.57300L10.50740 25.57300Q12.13380 25.57300 13.34290 25.23060Q14.55200 24.88820 15.23680 24.26760Q15.92160 23.64700 15.92160 22.81240L1