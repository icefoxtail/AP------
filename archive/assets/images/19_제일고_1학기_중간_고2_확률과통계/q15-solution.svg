<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" width="720" height="520" role="img" aria-labelledby="title desc">
<title id="title">같은 시각에 만날 수 있는 격자점</title><desc id="desc">속도 비가 2대 1일 때 만남 후보가 되는 세 격자점을 표시한다. 원문의 3 곱하기 3 격자와 이동 방향을 보존한다.</desc>
<style>.grid{stroke:#7b8794;stroke-width:2}.frame{stroke:#263746;stroke-width:3;fill:none}.meet{fill:#d4482f;stroke:#fff;stroke-width:3}.endpoint{fill:#263746}.title{font:700 30px sans-serif;fill:#172b3a}.subtitle{font:600 30px sans-serif;fill:#344b5e}.coord{font:700 30px sans-serif;fill:#a62f20}.label{font:700 30px sans-serif;fill:#172b3a}.panel{fill:#f1f6fa;stroke:#c5d4df;stroke-width:1.5}.paneltext{font:700 30px sans-serif;fill:#172b3a}</style>
<text x="54" y="40" class="title">같은 시각에 만날 수 있는 격자점</text><text x="54" y="78" class="subtitle">속도 비가 2:1이면</text><text x="54" y="112" class="subtitle">만남 시각에는 형 4칸, 동생 2칸 이동</text>
<line x1="112" y1="415" x2="112" y2="145" class="grid"/><line x1="202" y1="415" x2="202" y2="145" class="grid"/><line x1="292" y1="415" x2="292" y2="145" class="grid"/><line x1="382" y1="415" x2="382" y2="145" class="grid"/>
<line x1="112" y1="415" x2="382" y2="415" class="grid"/><line x1="112" y1="325" x2="382" y2="325" class="grid"/><line x1="112" y1="235" x2="382" y2="235" class="grid"/><line x1="112" y1="145" x2="382" y2="145" class="grid"/>
<rect x="112" y="145" width="270" height="270" class="frame"/>
<circle cx="202" cy="145" r="11" class="meet"/><text x="218" y="184" class="coord">(1,3)</text>
<circle cx="292" cy="235" r="11" class="meet"/><text x="218" y="280" class="coord">(2,2)</text>
<circle cx="382" cy="325" r="11" class="meet"/><text x="308" y="370" class="coord">(3,1)</text>
<circle cx="112" cy="415" r="6" class="endpoint"/><text x="80" y="448" class="label">A</text><circle cx="382" cy="145" r="6" class="endpoint"/><text x="394" y="155" class="label">B</text>
<rect x="475" y="155" width="220" height="250" rx="14" class="panel"/><text x="495" y="190" class="paneltext">만남 후보</text><text x="495" y="226" class="paneltext">(1,3)</text><text x="495" y="262" class="paneltext">(2,2)</text><text x="495" y="298" class="paneltext">(3,1)</text><text x="495" y="334" class="paneltext">경로 쌍은</text><text x="495" y="370" class="paneltext">점별로 계산</text></svg>