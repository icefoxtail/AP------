<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 460" width="460" height="460" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">예시 문제로 서로 다른 여섯 명의 친구가 원탁에 앉는 경우를 든다. 회전하여 같은 배치는 한 가지로 보므로 한 사람의 자리를 고정하고 나머지 다섯 명을 배열하면 5!=120가지이다. 따라서 예시 문제의 답은 120가지이다.</title><desc id="visual-desc">원 위에 여섯 개의 점이 같은 간격으로 놓여 있고, 이웃한 두 점 사이의 짧은 호가 파란색으로 강조되어 있다.</desc><rect width="460" height="460" fill="#fff"/><g data-layer="40"><circle id="k" data-role="circle" stroke="#111" stroke-width="2.05" fill="none" cx="192.025660709" cy="230" r="132.715315881"/></g><g data-layer="46"><polyline id="fix" data-role="circularArc" stroke="#1f5fa8" stroke-width="3.2" fill="none" data-owner-points="S1 S2" data-center-point="O" data-owner-radius="6.0" data-sweep="CW" data-mark="arc" data-mark-id="fix" points="192.025660709,97.284684119 196.367984121,97.355741561 200.705657664,97.568837797 205.03403645,97.923744639 209.34848554,98.420082044 213.644384916,99.05731852 217.917134421,99.8347717 222.162158687,100.751609066 226.374912036,101.806848846 230.550883346,102.999361064 234.685600883,104.327868747 238.774637088,105.790949295 242.813613318,107.387036006 246.798204536,109.114419751 250.724143942,110.971250802 254.587227542,112.95554082 258.38331865,115.065164975 262.108352315,117.297864232 265.758339678,119.651247758 269.329372243,122.122795491 272.817626056,124.70