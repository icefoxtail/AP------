<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="310" viewBox="0 0 720 310" role="img" aria-labelledby="title desc">
<title id="title">함수 g의 치역이 이어지는 조건</title><desc id="desc">세 가지 x 구간에서 얻는 치역이 겹치지 않고 실수 전체를 채우려면 가운데 이차함수의 치역은 닫힌 구간 마이너스 오부터 사까지여야 한다.</desc>
<style>.title{font:700 18px "Noto Sans KR","Malgun Gothic",sans-serif;fill:#111}.note{font:14px "Noto Sans KR","Malgun Gothic",sans-serif;fill:#222}.math{font:italic 15px "STIX Two Math","Cambria Math","Malgun Gothic",serif;fill:#111}.axis{stroke:#111;stroke-width:1.4}.left{stroke:#2563eb;stroke-width:7;stroke-linecap:round}.mid{stroke:#16a34a;stroke-width:7;stroke-linecap:round}.right{stroke:#dc2626;stroke-width:7;stroke-linecap:round}.tick{stroke:#111;stroke-width:1.2}.dot{fill:#111}</style>
<rect width="720" height="310" fill="#fff"/><text x="28" y="34" class="title">각 가지가 만드는 치역</text>
<text x="28" y="72" class="math">x&lt;−1: g(x)=x−4 → (−∞,−5)</text><text x="28" y="105" class="math">−1≤x≤2: f(x) 감소 → [−5,4]</text><text x="28" y="138" class="math">x&gt;2: g(x)=x+2 → (4,∞)</text>
<text x="28" y="190" class="note">치역의 수직선</text><line x1="70" y1="236" x2="650" y2="236" class="axis"/>
<line x1="70" y1="236" x2="270" y2="236" class="left"/><polygon points="70,230 58,236 70,242" fill="#2563eb"/>
<line x1="270" y1="236" x2="470" y2="236" class="mid"/><line x1="470" y1="236" x2="650" y2="236" class="right"/><polygon points="650,230 662,236 650,242" fill="#dc2626"/>
<line x1="270" y1="221" x2="270" y2="251" class="tick"/><line x1="470" y1="221" x2="470" y2="251" class="tick"/><circle cx="270" cy="236" r="5" class="dot"/><circle cx="470" cy="236" r="5" class="dot"/>
<text x="256" y="273" class="math">−5</text><text x="465" y="273" class="math">4</text><text x="274" y="210" class="note">f(2)=−5</text><text x="477" y="210" class="note">f(−1)=4</text>
<text x="28" y="298" class="note">가운데 가지가 −5에서 4까지 한 번씩 지나야 전체 치역은 ℝ이고 역함수가 존재한다.</text></svg>
