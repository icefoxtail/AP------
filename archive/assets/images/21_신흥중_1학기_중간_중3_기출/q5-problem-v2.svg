<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 670 328" width="670" height="328" role="img" aria-labelledby="title desc"><title id="title">정사각형의 같은 두 대각선을 수직선으로 옮기기</title><desc id="desc">정사각형 ABCD에서 파란 BD는 왼쪽 Q로, 파란 AC는 오른쪽 P로 옮긴다. 네 점의 순서는 Q, A, B, P이다.</desc><rect width="670" height="328" fill="white" /><polygon points="214.0000,262.0000 424.0000,262.0000 424.0000,52.0000 214.0000,52.0000" fill="none" /><line x1="214.0000" y1="262.0000" x2="424.0000" y2="262.0000" stroke="#28364b" stroke-width="2.65" stroke-linecap="round" /><line x1="424.0000" y1="262.0000" x2="424.0000" y2="52.0000" stroke="#28364b" stroke-width="2.65" stroke-linecap="round" /><line x1="424.0000" y1="52.0000" x2="214.0000" y2="52.0000" stroke="#28364b" stroke-width="2.65" stroke-linecap="round" /><line x1="214.0000" y1="52.0000" x2="214.0000" y2="262.0000" stroke="#28364b" stroke-width="2.65" stroke-linecap="round" /><line x1="40.0000" y1="262.0000" x2="624.0000" y2="262.0000" stroke="#28364b" stroke-width="2" stroke-linecap="round" /><polygon points="31.0000,262.0000 46.0000,256.0000 46.0000,268.0000" fill="#28364b" /><polygon points="633.0000,262.0000 618.0000,256.0000 618.0000,268.0000" fill="#28364b" /><line x1="214.0000" y1="262.0000" x2="424.0000" y2="52.0000" stroke="#205d9c" stroke-width="4.2" stroke-linecap="round" /><line x1="424.0000" y1="262.0000" x2="214.0000" y2="52.0000" stroke="#205d9c" stroke-width="4.2" stroke-linecap="round" /><path d="M 214 52 A 296.9848 296.9848 0 0 0 127.0152 262" stroke="#205d9c" fill="none" stroke-width="3.2" stroke-dasharray="8 7" stroke-linecap="round" /><path d="M 424 52 A 296.9848 296.9848 0 0 1 510.9848 262" stroke="#205d9c" fill="none" stroke-width="3.2" stroke-dasharray="8 7" stroke-linecap="round" /><circle cx="214.0000" cy="52" r="4.7" fill="#28364b" /><text x="214.0000" y="38.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">D</text><circle cx="424.0000" cy="52