<svg xmlns="http://www.w3.org/2000/svg" width="530" height="340" viewBox="0 0 530 340" role="img" aria-labelledby="title desc">
<title id="title">다섯 영역의 색칠 인접 관계</title>
<desc id="desc">바깥 영역 O는 A B C D 모두와 인접한다. 내부는 A B, B C, C D, D A만 변을 공유한다.</desc>
<rect width="530" height="340" fill="#fff"/>
<text x="20" y="29" font-size="16" font-family="sans-serif">영역 사이의 인접 관계</text>
<g stroke="#222" stroke-width="2.1" fill="none">
<line x1="145" y1="93" x2="385" y2="93"/><line x1="385" y1="93" x2="385" y2="263"/>
<line x1="385" y1="263" x2="145" y2="263"/><line x1="145" y1="263" x2="145" y2="93"/>
</g>
<g stroke="#555" stroke-width="1.6" stroke-dasharray="6 5">
<line x1="265" y1="178" x2="145" y2="93"/><line x1="265" y1="178" x2="385" y2="93"/>
<line x1="265" y1="178" x2="385" y2="263"/><line x1="265" y1="178" x2="145" y2="263"/>
</g>
<g fill="#fff" stroke="#111" stroke-width="1.8">
<circle cx="145" cy="93" r="24"/><circle cx="385" cy="93" r="24"/><circle cx="385" cy="263" r="24"/><circle cx="145" cy="263" r="24"/>
<circle cx="265" cy="178" r="35"/>
</g>
<g font-family="sans-serif" font-size="19" fill="#111" text-anchor="middle" dominant-baseline="middle">
<text x="145" y="93">A</text><text x="385" y="93">B</text><text x="385" y="263">C</text><text x="145" y="263">D</text><text x="265" y="178" font-size="15">바깥</text>
</g>
<g font-size="13" font-family="sans-serif" fill="#222"><text x="18" y="318">실선: 내부의 변 인접</text><text x="288" y="318">점선: 바깥과 인접</text></g>
</svg>