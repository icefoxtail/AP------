<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" width="560" height="460" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">반지름이 4cm인 반원 O에 세 선분 AD, BC, CD가 접하고, 접점이 각각 A, B, E인 그림이다. CD의 길이는 11cm로 표시되어 있다.</title><desc id="visual-desc">세로로 놓인 지름 AB의 오른쪽에 반원이 있고, 중심 O가 AB 위에 있다. 위쪽 접선 AD, 아래쪽 접선 BC, 두 접선을 잇는 접선 CD가 반원과 각각 A, B, E에서 만난다. OA는 4cm, CD는 11cm로 표시되어 있다.</desc><rect width="560" height="460" fill="#fff"/><g data-layer="30"><line id="sAO" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="78.481772089" y1="56.182187349" x2="78.481772089" y2="230"/></g><g data-layer="30"><line id="sOB" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="78.481772089" y1="230" x2="78.481772089" y2="403.817812651"/></g><g data-layer="30"><line id="sAD" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="78.481772089" y1="56.182187349" x2="153.444301057" y2="56.182187349"/></g><g data-layer="30"><line id="sBC" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="78.481772089" y1="403.817812651" x2="481.518227911" y2="403.817812651"/></g><g data-layer="30"><line id="sCD" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="481.518227911" y1="403.817812651" x2="153.444301057" y2="56.182187349"/></g><g data-layer="40"><polyline id="arcAB" data-role="circularArc" stroke="#111