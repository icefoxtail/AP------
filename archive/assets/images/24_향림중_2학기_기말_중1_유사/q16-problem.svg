<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 420" width="620" height="420" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">가로의 길이가 8π 센티미터이고 세로의 길이가 10 센티미터인 직사각형이 원기둥의 옆면을 펼친 모양으로 제시되어 있다.</title><desc id="visual-desc">가로로 긴 직사각형이 있고, 아래쪽 가로변에는 8π 센티미터, 오른쪽 세로변에는 10 센티미터의 치수선과 길이가 표시되어 있다.</desc><rect width="620" height="420" fill="#fff"/><g data-layer="30"><line id="s12" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="191.872008617" y1="345.039177164" x2="428.127991383" y2="345.039177164"/></g><g data-layer="30"><line id="s23" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="428.127991383" y1="345.039177164" x2="428.127991383" y2="49.719198707"/></g><g data-layer="30"><line id="s34" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="428.127991383" y1="49.719198707" x2="191.872008617" y2="49.719198707"/></g><g data-layer="30"><line id="s41" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="191.872008617" y1="49.719198707" x2="191.872008617" y2="345.039177164"/></g><g data-layer="52"><line id="dW-ext-from" data-role="indicator" stroke="#111" stroke-width="0.8" fill="none" data-mark="dimension" data-mark-id="dW" data-mark-part="ext-from" x1="191.872008617" y1="349.039177164" x2="191.872008617" y2="372.039177164"/></g><g data-layer="52"><line id="dW-ext-to" data-