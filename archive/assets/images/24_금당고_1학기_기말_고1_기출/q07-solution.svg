<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" width="640" height="280" role="img" aria-labelledby="title desc">
  <title id="title">원의 중심과 반지름 읽기</title>
  <desc id="desc">표준형 (x+4)²+(y−2)²=4에서 중심 C(−4,2)와 반지름 2를 읽는 그림</desc>
  <rect width="640" height="280" fill="#fff"/>
  <text x="320" y="28" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="22" font-weight="700" fill="#1e3a5f">(x + 4)² + (y − 2)² = 4</text>
  <rect x="18" y="45" width="330" height="215" rx="8" fill="#f8fafc" stroke="#dbe3ef"/>
  <g stroke="#e2e8f0" stroke-width="1">
    <line x1="72" y1="62" x2="72" y2="240"/><line x1="118" y1="62" x2="118" y2="240"/><line x1="164" y1="62" x2="164" y2="240"/><line x1="210" y1="62" x2="210" y2="240"/><line x1="256" y1="62" x2="256" y2="240"/><line x1="302" y1="62" x2="302" y2="240"/>
    <line x1="42" y1="86" x2="324" y2="86"/><line x1="42" y1="132" x2="324" y2="132"/><line x1="42" y1="178" x2="324" y2="178"/><line x1="42" y1="224" x2="324" y2="224"/>
  </g>
  <line x1="40" y1="178" x2="330" y2="178" stroke="#0f172a" stroke-width="1.5"/>
  <line x1="164" y1="245" x2="164" y2="58" stroke="#0f172a" stroke-width="1.5"/>
  <circle cx="100" cy="132" r="46" fill="#dbeafe" fill-opacity=".7" stroke="#2563eb" stroke-width="2.6"/>
  <line x1="100" y1="132" x2="146" y2="132" stroke="#dc2626" stroke-width="2.2" stroke-dasharray="6 4"/>
  <circle cx="100" cy="132" r="4.5" fill="#1d4ed8"/><text x="72" y="122" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="15" font-weight="700">C(−4,2)</text>
  <text x="121" y="153" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14" fill="#b91c1c">r=2</text>
  <rect x="370" y="45" width="252" height="215" rx="8" fill="#f8fafc" stroke="#dbe3ef"/>
  <text x="388" y="75" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="17" font-weight="700" fill="#334155">표준형과 비교</text>
  <text x="388" y="110" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="16">중심: (−4, 2)</text>
  <text x="388" y="143" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="16">반지름: √4 = 2</text>
  <line x1="388" y1="160" x2="602" y2="160" stroke="#cbd5e1"/>
  <text x="388" y="191" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="16">a+b+r = −4+2+2</text>
  <text x="388" y="227" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="18" font-weight="700" fill="#1d4ed8">= 0</text>
</svg>
