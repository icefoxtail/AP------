<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320" role="img" aria-labelledby="title desc">
  <title id="title">포물선과 원의 지름</title>
  <desc id="desc">포물선 y=x²와 원의 두 교점 A,B, 그 중점 P, 그리고 AB에 수직인 중심선 l을 나타낸 그림</desc>
  <rect width="640" height="320" fill="#fff"/>
  <text x="320" y="28" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="21" font-weight="700" fill="#1e3a5f">둘레를 이등분하는 현 AB  →  지름  →  P는 중점</text>
  <rect x="18" y="45" width="370" height="255" rx="8" fill="#f8fafc" stroke="#dbe3ef"/>
  <line x1="45" y1="245" x2="365" y2="245" stroke="#0f172a" stroke-width="1.4"/>
  <line x1="150" y1="282" x2="150" y2="58" stroke="#0f172a" stroke-width="1.4"/>
  <path d="M95 239 C126 226 144 187 150 143 C156 187 174 226 205 239" fill="none" stroke="#059669" stroke-width="2.5"/>
  <circle cx="150" cy="195" r="73" fill="#dbeafe" fill-opacity=".35" stroke="#2563eb" stroke-width="2.4"/>
  <line x1="118" y1="226" x2="182" y2="169" stroke="#7c3aed" stroke-width="2.5"/>
  <line x1="150" y1="195" x2="211" y2="104" stroke="#dc2626" stroke-width="2.2" stroke-dasharray="6 4"/>
  <circle cx="118" cy="226" r="4" fill="#7c3aed"/><circle cx="182" cy="169" r="4" fill="#7c3aed"/><circle cx="150" cy="195" r="4.5" fill="#111827"/>
  <text x="101" y="244" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="15" font-weight="700">A</text>
  <text x="186" y="163" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="15" font-weight="700">B</text>
  <text x="157" y="214" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="15" font-weight="700">P</text>
  <text x="214" y="102" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="15" fill="#b91c1c">l</text>
  <text x="83" y="82" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14" fill="#047857">y=x²</text>
  <rect x="407" y="45" width="215" height="255" rx="8" fill="#f8fafc" stroke="#dbe3ef"/>
  <text x="424" y="76" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="17" font-weight="700" fill="#334155">중점 조건</text>
  <text x="424" y="110" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="15">P=((a+b)/2,</text>
  <text x="424" y="136" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="15">(a²+b²)/2)</text>
  <text x="424" y="169" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="15">P가 y=x 위</text>
  <text x="424" y="196" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="15">a+b=a²+b²=2/3</text>
  <line x1="424" y1="211" x2="603" y2="211" stroke="#cbd5e1"/>
  <text x="424" y="240" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="15">r²=26/81</text>
  <text x="424" y="273" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="17" font-weight="700" fill="#1d4ed8">81r²=26</text>
</svg>
