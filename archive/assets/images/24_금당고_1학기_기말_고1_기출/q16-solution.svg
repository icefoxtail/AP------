<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" width="640" height="280" role="img" aria-labelledby="title desc" data-scale-policy="SCHEMATIC_ALLOWED">
  <title id="title">중심 조건과 축에 접하는 원</title>
  <desc id="desc">중심이 y=3x+6 위에 있고 반지름 3인 원이 좌표축에 접할 때의 세 중심 후보를 나타낸 그림</desc>
  <rect width="640" height="280" fill="#fff"/>
  <text x="320" y="28" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="20" font-weight="700" fill="#1e3a5f">중심 C(h,k): k=3h+6,  |h|=3 또는 |k|=3</text>
  <rect x="18" y="45" width="355" height="215" rx="8" fill="#f8fafc" stroke="#dbe3ef"/>
  <line x1="42" y1="220" x2="348" y2="220" stroke="#0f172a" stroke-width="1.4"/>
  <line x1="102" y1="245" x2="102" y2="58" stroke="#0f172a" stroke-width="1.4"/>
  <line x1="55" y1="230" x2="330" y2="72" stroke="#2563eb" stroke-width="2.2"/>
  <text x="250" y="86" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14" fill="#1d4ed8">k=3h+6</text>
  <circle cx="314" cy="81" r="22" fill="#dbeafe" fill-opacity=".7" stroke="#2563eb" stroke-width="1.8"/>
  <circle cx="73" cy="210" r="22" fill="#dcfce7" fill-opacity=".7" stroke="#059669" stroke-width="1.8"/>
  <circle cx="176" cy="151" r="22" fill="#fef3c7" fill-opacity=".8" stroke="#d97706" stroke-width="1.8"/>
  <circle cx="314" cy="81" r="3.5" fill="#1d4ed8"/><circle cx="73" cy="210" r="3.5" fill="#059669"/><circle cx="176" cy="151" r="3.5" fill="#d97706"/>
  <text x="258" y="59" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="13">C(3,15)</text>
  <text x="42" y="247" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="13">C(−3,−3)</text>
  <text x="181" y="143" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="13">C(−1,3)</text>
  <rect x="392" y="45" width="230" height="215" rx="8" fill="#f8fafc" stroke="#dbe3ef"/>
  <text x="409" y="75" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="17" font-weight="700" fill="#334155">후보를 만드는 선</text>
  <text x="409" y="109" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="15">x축 접함: |k|=3</text>
  <text x="409" y="140" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="15">y축 접함: |h|=3</text>
  <text x="409" y="173" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="15">직선과의 교점만 조사</text>
  <line x1="409" y1="187" x2="602" y2="187" stroke="#cbd5e1"/>
  <text x="409" y="218" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14">각 중심에서 a+b+c 계산</text>
  <text x="409" y="244" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="17" font-weight="700" fill="#1d4ed8">M−m = 192</text>
</svg>
