<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" width="640" height="280" role="img" aria-labelledby="title desc">
  <title id="title">외부점에서 그은 두 접선의 접점 현</title>
  <desc id="desc">원 x²+y²=5와 외부점 (4,3)에서 그은 두 접선의 접점 P,Q가 직선 4x+3y=5 위에 있음을 나타낸 그림</desc>
  <rect width="640" height="280" fill="#fff"/>
  <text x="320" y="28" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="21" font-weight="700" fill="#1e3a5f">접점 P,Q의 공통 조건  →  4x + 3y = 5</text>
  <rect x="18" y="45" width="350" height="215" rx="8" fill="#f8fafc" stroke="#dbe3ef"/>
  <line x1="42" y1="178" x2="344" y2="178" stroke="#0f172a" stroke-width="1.4"/>
  <line x1="172" y1="245" x2="172" y2="58" stroke="#0f172a" stroke-width="1.4"/>
  <circle cx="172" cy="178" r="55" fill="#dbeafe" fill-opacity=".65" stroke="#2563eb" stroke-width="2.5"/>
  <line x1="172" y1="178" x2="149" y2="121" stroke="#64748b" stroke-width="1.8" stroke-dasharray="5 4"/>
  <line x1="172" y1="178" x2="203" y2="210" stroke="#64748b" stroke-width="1.8" stroke-dasharray="5 4"/>
  <line x1="300" y1="90" x2="149" y2="121" stroke="#0f766e" stroke-width="2.2"/>
  <line x1="300" y1="90" x2="203" y2="210" stroke="#f97316" stroke-width="2.2"/>
  <line x1="130" y1="116" x2="222" y2="218" stroke="#7c3aed" stroke-width="2.1"/>
  <circle cx="172" cy="178" r="4" fill="#1d4ed8"/><text x="180" y="196" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14">O</text>
  <circle cx="149" cy="121" r="4" fill="#0f766e"/><text x="129" y="112" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14" font-weight="700">P</text>
  <circle cx="203" cy="210" r="4" fill="#f97316"/><text x="210" y="227" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14" font-weight="700">Q</text>
  <circle cx="300" cy="90" r="4.5" fill="#111827"/><text x="307" y="84" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14" font-weight="700">(4,3)</text>
  <rect x="388" y="45" width="234" height="215" rx="8" fill="#f8fafc" stroke="#dbe3ef"/>
  <text x="405" y="75" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="17" font-weight="700" fill="#334155">접점의 조건</text>
  <text x="405" y="109" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="15">P(s,t): s²+t²=5</text>
  <text x="405" y="141" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="15">접선: sx+ty=5</text>
  <text x="405" y="173" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="15">(4,3)을 대입하면</text>
  <text x="405" y="204" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="16" font-weight="700" fill="#7c3aed">4s+3t=5</text>
  <text x="405" y="236" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="15">따라서 PQ: 4x+3y−5=0</text>
</svg>
