<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img">
<title>정삼각형 거리제곱 최소 · 24 금당고 15번</title><desc>P=(t,0)으로 두고 AP²+CP²가 최소가 되는 위치 t=3/2를 표시</desc>
<style>
