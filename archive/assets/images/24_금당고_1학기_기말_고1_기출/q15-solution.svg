<text x="159.90" y="109.00" class="small">y</text>
<line x1="111.86" y1="327.22" x2="406.14" y2="327.22" class="axis"/>
<text x="396.14" y="320.22" class="small">x</text>
<polygon points="259.00,145.18 153.90,327.22 364.10,327.22" class="areaA"/>
<line x1="259.00" y1="145.18" x2="311.55" y2="327.22" class="shape2"/>
<line x1="364.10" y1="327.22" x2="311.55" y2="327.22" class="shape2"/>
<circle cx="259.00" cy="145.18" r="4.3" class="point"/>
<text x="267.00" y="137.18" class="label">A</text>
<text x="267.00" y="152.18" class="small">(1,√3)</text>
<circle cx="153.90" cy="327.22" r="4.3" class="point"/>
<text x="117.90" y="345.22" class="label">B</text>
<text x="117.90" y="360.22" class="small">(0,0)</text>
<circle cx="364.10" cy="327.22" r="4.3" class="point"/>
<text x="372.10" y="345.22" class="label">C</text>
<text x="372.10" y="360.22" class="small">(2,0)</text>
<circle cx="311.55" cy="327.22" r="4.3" class="point2"/>
<text x="319.55" y="319.22" class="label">P</text>
<text x="319.55" y="334.22" class="small">(3/2,0)</text>
<line x1="172.82" y1="344.03" x2="345.18" y2="344.03" class="dim"/>
<text x="259.00" y="360.03" class="small" text-anchor="middle">P=(t,0), 0≤t≤2</text>
<text x="279.61" y="234.73" class="small" text-anchor="start">AP²=(t−1)²+3</text>
<text x="332.16" y="307.45" class="small" text-anchor="start">CP²=(t−2)²</text>
<text x="526" y="98" class="sidehead">해설 핵심</text>
<text x="526" y="124" class="sidebody">A=(1,√3), B=(0,0)</text>
<text x="526" y="145" class="sidebody">C=(2,0), P=(t,0)</text>
<text x="526" y="166" class="sidebody">AP²+CP²</text>
<text x="526" y="187" class="sidebody">=2t²−6t+8</text>
<text x="526" y="208" class="sidebody">=2(t−3/2)²+7/2</text>
<text x="526" y="229" class="sidebody">0≤t≤2</text>
<text x="526" y="250" class="sidebody">t=3/2에서 최소</text>
<text x="526" y="271" class="sidebody">최솟값 = 7/2</text>
</svg>