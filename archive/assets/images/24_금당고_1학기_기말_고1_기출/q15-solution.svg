<rect x="510" y="70" width="186" height="320" rx="10" class="side"/>
<line x1="153.90" y1="364.00" x2="153.90" y2="96.00" class="grid"/>
<line x1="206.45" y1="364.00" x2="206.45" y2="96.00" class="grid"/>
<line x1="259.00" y1="364.00" x2="259.00" y2="96.00" class="grid"/>
<line x1="311.55" y1="364.00" x2="311.55" y2="96.00" class="grid"/>
<line x1="364.10" y1="364.00" x2="364.10" y2="96.00" class="grid"/>
<line x1="111.86" y1="327.22" x2="406.14" y2="327.22" class="grid"/>
<line x1="111.86" y1="274.67" x2="406.14" y2="274.67" class="grid"/>
<line x1="111.86" y1="222.12" x2="406.14" y2="222.12" class="grid"/>
<line x1="111.86" y1="169.57" x2="406.14" y2="169.57" class="grid"/>
<line x1="111.86" y1="117.02" x2="406.14" y2="117.02" class="grid"/>
