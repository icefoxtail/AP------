<svg xmlns="http://www.w3.org/2000/svg" width="640" height="440" viewBox="0 0 640 440" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc">
  <title id="title">23 제일고 12번 극한·연속·미분가능 집합 해설</title>
  <desc id="desc">특이점에서 극한 존재 A, 연속 B, 미분가능 C를 분류하고 원소 수를 세는 해설 그림</desc>
  <style>.background{fill:#fff}.axis{stroke:#171717;stroke-width:1.4;fill:none;stroke-linecap:round;stroke-linejoin:round}.curve{stroke:#111;stroke-width:2.1;fill:none;stroke-linecap:round;stroke-linejoin:round}.guide{stroke:#777;stroke-width:.95;stroke-dasharray:4 4;fill:none}.open{stroke:#111;stroke-width:1.4;fill:#fff}.closed{stroke:#111;stroke-width:1;fill:#111}.panel{fill:#f7f8fa;stroke:#c7cbd1;stroke-width:1}.target{fill:#e7eef5;stroke:#55718a;stroke-width:1.1}.title{font-family:"Noto Sans KR","Pretendard","Malgun Gothic",sans-serif;font-size:15px;font-weight:700;fill:#111}.label{font-family:"Noto Sans KR","Pretendard","Malgun Gothic",sans-serif;font-size:12px;fill:#222}.small{font-family:"Noto Sans KR","Pretendard","Malgun Gothic",sans-serif;font-size:11px;fill:#333}.math{font-family:"STIX Two Math","Cambria Math","Times New Roman",serif;font-size:13px;fill:#111}</style>
  <defs><marker id="axis-arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L6,3 L0,6 Z" fill="#171717"/></marker></defs>
  <rect class="background" x="0" y="0" width="640" height="440"/><text class="title" x="32" y="28">q12  A·B·C는 점점 강한 조건</text><text class="small" x="32" y="47">C⊂B⊂A: 극한 존재, 연속, 미분가능을 특이점별로 판정한다.</text>
  <g aria-label="schematic graph"><rect class="panel" x="32" y="65" width="360" height="205" rx="8"/><line class="axis" x1="50" y1="180" x2="375" y2="180" marker-end="url(#axis-arrow)"/><line class="axis" x1="70" y1="250" x2="70" y2="82" marker-end="url(#axis-arrow)"/><path class="curve" d="M70 210 C92 165 112 135 140 145 L185 195 L230 195 L270 115 L315 165 L360 135"/><path class="curve" d="M230 75 L270 115"/><circle class="open" cx="140" cy="145" r="4.5"/><circle class="closed" cx="140" cy="110" r="4"/><circle class="closed" cx="185" cy="195" r="4"/><circle class="open" cx="230" cy="195" r="4.5"/><circle class="closed" cx="230" cy="75" r="4"/><circle class="closed" cx="315" cy="165" r="4"/><circle class="open" cx="315" cy="115" r="4.5"/><text class="label" x="65" y="202">0</text><text class="label" x="135" y="225">1</text><text class="label" x="180" y="225">2</text><text class="label" x="225" y="225">3</text><text class="label" x="310" y="225">4</text><text class="label" x="355" y="225">5</text><text class="small" x="86" y="252">smooth</text><text class="small" x="168" y="252">corner</text><text class="small" x="296" y="252">corner</text></g>
  <g aria-label="set counts"><rect class="panel" x="410" y="65" width="198" height="205" rx="8"/><text class="title" x="428" y="92">원소 수</text><text class="small" x="428" y="122">A: 0,1,2,4,5 → m=5</text><text class="small" x="428" y="150">B: 0,2,4,5 → n=4</text><text class="small" x="428" y="178">C: 0,5 → l=2</text><line class="guide" x1="428" y1="194" x2="590" y2="194"/><text class="label" x="428" y="230">m+n+l=11</text><text class="small" x="428" y="256">정답: ③</text></g>
  <rect class="target" x="32" y="290" width="576" height="72" rx="8"/><text class="math" x="50" y="318">x=1: 극한만 존재  ·  x=2,4: 연속이지만 꺾임  ·  x=3: 극한 불존재</text><text class="small" x="50" y="347">따라서 A={0,1,2,4,5}, B={0,2,4,5}, C={0,5}이다.</text>
</svg>
