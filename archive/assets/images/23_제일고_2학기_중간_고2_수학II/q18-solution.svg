<svg xmlns="http://www.w3.org/2000/svg" width="640" height="410" viewBox="0 0 640 410" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc">
  <title id="title">23 제일고 18번 원점에서 본 접선 기울기 최솟값 해설</title>
  <desc id="desc">곡선 위 점 (3,27)과 원점을 잇는 최소 기울기 접선을 표시한다</desc>
  <style>.background{fill:#fff}.axis{stroke:#171717;stroke-width:1.4;fill:none;stroke-linecap:round;stroke-linejoin:round}.curve{stroke:#111;stroke-width:2.1;fill:none;stroke-linecap:round;stroke-linejoin:round}.tangent{stroke:#3f4a5a;stroke-width:1.7;fill:none;stroke-linecap:round;stroke-linejoin:round}.guide{stroke:#777;stroke-width:.95;stroke-dasharray:4 4;fill:none}.point{stroke:#111;stroke-width:1;fill:#111}.panel{fill:#f7f8fa;stroke:#c7cbd1;stroke-width:1}.title{font-family:"Noto Sans KR","Pretendard","Malgun Gothic",sans-serif;font-size:15px;font-weight:700;fill:#111}.label{font-family:"Noto Sans KR","Pretendard","Malgun Gothic",sans-serif;font-size:12px;fill:#222}.small{font-family:"Noto Sans KR","Pretendard","Malgun Gothic",sans-serif;font-size:11px;fill:#333}.math{font-family:"STIX Two Math","Cambria Math","Times New Roman",serif;font-size:13px;fill:#111}</style>
  <defs><marker id="axis-arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L6,3 L0,6 Z" fill="#171717"/></marker></defs>
  <rect class="background" x="0" y="0" width="640" height="410"/><text class="title" x="32" y="28">q18  b/a는 OP의 기울기</text><text class="small" x="32" y="47">기울기 함수가 최소가 되는 점에서 원점을 잇는 직선은 접선이다.</text>
  <g aria-label="curve and tangent"><rect class="panel" x="32" y="65" width="335" height="270" rx="8"/><line class="axis" x1="52" y1="300" x2="345" y2="300" marker-end="url(#axis-arrow)"/><line class="axis" x1="70" y1="320" x2="70" y2="82" marker-end="url(#axis-arrow)"/><path class="curve" d="M74 250 C105 230 135 200 160 175 C185 150 205 115 220 95 C240 80 270 88 320 145"/><path class="tangent" d="M70 300 L220 95"/><circle class="point" cx="220" cy="95" r="3.8"/><line class="guide" x1="220" y1="95" x2="220" y2="300"/><text class="label" x="226" y="90">(3,27)</text><text class="math" x="235" y="128">y=9x</text><text class="small" x="80" y="320">O=(0,0)</text><text class="math" x="332" y="305">x</text><text class="math" x="76" y="90">y</text></g>
  <g aria-label="calculation"><rect class="panel" x="385" y="65" width="223" height="270" rx="8"/><text class="title" x="403" y="92">최소 확인</text><text class="math" x="403" y="124">k(a)=a²−3a+27/a</text><text class="math" x="403" y="151">k′(a)=0 ⇒ a=3</text><text class="small" x="403" y="178">0&lt;a&lt;3 감소, a&gt;3 증가</text><line class="guide" x1="403" y1="193" x2="590" y2="193"/><text class="math" x="403" y="224">b=f(3)=27</text><text class="math" x="403" y="251">b/a=27/3=9</text><text class="label" x="403" y="288">b−a=24  (정답: ⑤)</text><text class="small" x="403" y="318">(3,27)에서 접하는 직선의 기울기가 최소다.</text></g>
</svg>
