<svg xmlns="http://www.w3.org/2000/svg" width="640" height="390" viewBox="0 0 640 390" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc">
  <title id="title">23 제일고 1번 좌우극한과 함숫값 해설</title>
  <desc id="desc">x=−1의 우극한, 실제 함숫값, x=1의 좌극한을 열린 점과 닫힌 점으로 구분한다</desc>
  <style>.background{fill:#fff}.axis{stroke:#171717;stroke-width:1.4;fill:none;stroke-linecap:round;stroke-linejoin:round}.curve{stroke:#111;stroke-width:2.1;fill:none;stroke-linecap:round;stroke-linejoin:round}.guide{stroke:#777;stroke-width:.95;stroke-dasharray:4 4;fill:none}.open{stroke:#111;stroke-width:1.4;fill:#fff}.closed{stroke:#111;stroke-width:1;fill:#111}.panel{fill:#f7f8fa;stroke:#c7cbd1;stroke-width:1}.title{font-family:"Noto Sans KR","Pretendard","Malgun Gothic",sans-serif;font-size:15px;font-weight:700;fill:#111}.label{font-family:"Noto Sans KR","Pretendard","Malgun Gothic",sans-serif;font-size:12px;fill:#222}.small{font-family:"Noto Sans KR","Pretendard","Malgun Gothic",sans-serif;font-size:11px;fill:#333}.math{font-family:"STIX Two Math","Cambria Math","Times New Roman",serif;font-size:13px;fill:#111}</style>
  <defs><marker id="axis-arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L6,3 L0,6 Z" fill="#171717"/></marker></defs>
  <rect class="background" x="0" y="0" width="640" height="390"/><text class="title" x="32" y="28">q1  극한값과 함숫값을 분리</text><text class="small" x="32" y="47">왼쪽·오른쪽에서 접근하는 값과 닫힌 점의 값을 각각 읽는다.</text>
  <g aria-label="graph"><rect class="panel" x="32" y="65" width="330" height="235" rx="8"/><line class="axis" x1="52" y1="220" x2="340" y2="220" marker-end="url(#axis-arrow)"/><line class="axis" x1="190" y1="280" x2="190" y2="82" marker-end="url(#axis-arrow)"/><path class="curve" d="M55 260 L130 120"/><path class="curve" d="M130 170 L190 205 L250 120"/><path class="curve" d="M250 120 L340 220"/><circle class="open" cx="130" cy="120" r="4.6"/><circle class="closed" cx="130" cy="170" r="4"/><circle class="open" cx="250" cy="120" r="4.6"/><line class="guide" x1="130" y1="120" x2="130" y2="220"/><line class="guide" x1="250" y1="120" x2="250" y2="220"/><text class="label" x="121" y="243">−1</text><text class="label" x="242" y="243">1</text><text class="math" x="342" y="225">x</text><text class="math" x="196" y="88">y</text><text class="math" x="91" y="116">2</text><text class="math" x="91" y="174">1</text><text class="small" x="52" y="278">우극한: 2</text><text class="small" x="202" y="278">좌극한: 2</text></g>
  <g aria-label="calculation"><rect class="panel" x="380" y="65" width="228" height="235" rx="8"/><text class="title" x="398" y="92">합 계산</text><text class="math" x="398" y="128">lim x→−1+ f(x)=2</text><text class="math" x="398" y="160">f(−1)=1</text><text class="math" x="398" y="192">lim x→1− f(x)=2</text><line class="guide" x1="398" y1="207" x2="590" y2="207"/><text class="label" x="398" y="242">2+1+2=5  (정답: ①)</text><text class="small" x="398" y="276">열린 점은 극한, 닫힌 점은 함숫값이다.</text></g>
  <rect class="panel" x="32" y="320" width="576" height="38" rx="7"/><text class="small" x="50" y="344">극한 문제에서는 접근 방향을 먼저 표시한 뒤 해당 branch의 높이를 읽는다.</text>
</svg>
