<svg xmlns="http://www.w3.org/2000/svg" width="640" height="430" viewBox="0 0 640 430" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc">
  <title id="title">23 제일고 23번 유리함수와 삼각형 넓이 해설</title>
  <desc id="desc">A=(0,2), B=(2,0), P=(4,4)와 직선 AB를 이용해 넓이 함수의 도함수를 구한다</desc>
  <style>.background{fill:#fff}.axis{stroke:#171717;stroke-width:1.4;fill:none;stroke-linecap:round;stroke-linejoin:round}.curve{stroke:#111;stroke-width:2.1;fill:none;stroke-linecap:round;stroke-linejoin:round}.line-main{stroke:#3f4a5a;stroke-width:1.7;fill:none;stroke-linecap:round;stroke-linejoin:round}.guide{stroke:#777;stroke-width:.95;stroke-dasharray:4 4;fill:none}.point{stroke:#111;stroke-width:1;fill:#111}.triangle{fill:#e7eef5;fill-opacity:.7;stroke:#55718a;stroke-width:1.1}.panel{fill:#f7f8fa;stroke:#c7cbd1;stroke-width:1}.title{font-family:"Noto Sans KR","Pretendard","Malgun Gothic",sans-serif;font-size:15px;font-weight:700;fill:#111}.label{font-family:"Noto Sans KR","Pretendard","Malgun Gothic",sans-serif;font-size:12px;fill:#222}.small{font-family:"Noto Sans KR","Pretendard","Malgun Gothic",sans-serif;font-size:11px;fill:#333}.math{font-family:"STIX Two Math","Cambria Math","Times New Roman",serif;font-size:13px;fill:#111}</style>
  <defs><marker id="axis-arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L6,3 L0,6 Z" fill="#171717"/></marker></defs>
  <rect class="background" x="0" y="0" width="640" height="430"/><text class="title" x="32" y="28">q23  S(a)의 변화율을 넓이로 연결</text><text class="small" x="32" y="47">고정된 A, B와 곡선 위 P의 위치 관계를 직선 AB까지의 거리로 표현한다.</text>
  <g aria-label="triangle diagram"><rect class="panel" x="32" y="65" width="330" height="285" rx="8"/><line class="axis" x1="50" y1="300" x2="345" y2="300" marker-end="url(#axis-arrow)"/><line class="axis" x1="70" y1="325" x2="70" y2="82" marker-end="url(#axis-arrow)"/><path class="curve" d="M220 105 C240 125 255 115 270 100 C290 90 310 92 330 95"/><path class="triangle" d="M70 200 L170 300 L270 100 Z"/><line class="line-main" x1="70" y1="200" x2="170" y2="300"/><line class="guide" x1="270" y1="100" x2="270" y2="300"/><circle class="point" cx="70" cy="200" r="3.8"/><circle class="point" cx="170" cy="300" r="3.8"/><circle class="point" cx="270" cy="100" r="3.8"/><text class="label" x="53" y="190">A=(0,2)</text><text class="label" x="174" y="318">B=(2,0)</text><text class="label" x="275" y="95">P=(4,4)</text><text class="math" x="90" y="250">x+y−2=0</text><text class="math" x="335" y="305">x</text><text class="math" x="76" y="90">y</text></g>
  <g aria-label="calculation"><rect class="panel" x="380" y="65" width="228" height="285" rx="8"/><text class="title" x="398" y="92">넓이 함수</text><text class="math" x="398" y="124">f(a)=3+3/(a−3)</text><text class="math" x="398" y="151">S(a)=a+1+3/(a−3)</text><text class="math" x="398" y="178">S(4)=8</text><line class="guide" x1="398" y1="192" x2="590" y2="192"/><text class="math" x="398" y="223">S′(a)=1−3/(a−3)²</text><text class="math" x="398" y="250">S′(4)=−2</text><text class="label" x="398" y="288">−S′(4)=2  (정답: 2)</text><text class="small" x="398" y="320">삼각형 넓이는 P의 직선 AB까지 거리와 같다.</text></g>
</svg>
