<svg xmlns="http://www.w3.org/2000/svg" width="640" height="430" viewBox="0 0 640 430" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc">
  <title id="title">23 제일고 16번 기함수 접선 해설</title>
  <desc id="desc">기함수 cubic의 점 (1,3), (2,0)과 x=2에서의 접선을 표시하고 계수를 계산한다</desc>
  <style>.background{fill:#fff}.axis{stroke:#171717;stroke-width:1.4;fill:none;stroke-linecap:round;stroke-linejoin:round}.curve{stroke:#111;stroke-width:2.1;fill:none;stroke-linecap:round;stroke-linejoin:round}.tangent{stroke:#3f4a5a;stroke-width:1.7;fill:none;stroke-linecap:round;stroke-linejoin:round}.guide{stroke:#777;stroke-width:.95;stroke-dasharray:4 4;fill:none}.point{stroke:#111;stroke-width:1;fill:#111}.panel{fill:#f7f8fa;stroke:#c7cbd1;stroke-width:1}.title{font-family:"Noto Sans KR","Pretendard","Malgun Gothic",sans-serif;font-size:15px;font-weight:700;fill:#111}.label{font-family:"Noto Sans KR","Pretendard","Malgun Gothic",sans-serif;font-size:12px;fill:#222}.small{font-family:"Noto Sans KR","Pretendard","Malgun Gothic",sans-serif;font-size:11px;fill:#333}.math{font-family:"STIX Two Math","Cambria Math","Times New Roman",serif;font-size:13px;fill:#111}</style>
  <defs><marker id="axis-arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L6,3 L0,6 Z" fill="#171717"/></marker></defs>
  <rect class="background" x="0" y="0" width="640" height="430"/><text class="title" x="32" y="28">q16  기함수와 x=2에서의 접선</text><text class="small" x="32" y="47">기함수 조건으로 f를 정하고, 접선의 기울기·절편을 구한다.</text>
  <g aria-label="cubic graph"><rect class="panel" x="32" y="65" width="335" height="275" rx="8"/><line class="axis" x1="52" y1="220" x2="345" y2="220" marker-end="url(#axis-arrow)"/><line class="axis" x1="130" y1="320" x2="130" y2="82" marker-end="url(#axis-arrow)"/><path class="curve" d="M58 300 C78 250 102 175 130 220 C150 190 164 140 175 130 C194 150 205 190 220 220 C245 275 282 315 335 330"/><path class="tangent" d="M190 280 L250 160"/><circle class="point" cx="175" cy="130" r="3.8"/><circle class="point" cx="220" cy="220" r="3.8"/><line class="guide" x1="175" y1="130" x2="175" y2="220"/><line class="guide" x1="220" y1="220" x2="220" y2="250"/><text class="label" x="180" y="120">(1,3)</text><text class="label" x="225" y="235">(2,0)</text><text class="math" x="228" y="166">y=−8x+16</text><text class="math" x="332" y="225">x</text><text class="math" x="136" y="90">y</text></g>
  <g aria-label="calculation"><rect class="panel" x="385" y="65" width="223" height="275" rx="8"/><text class="title" x="403" y="92">계수 계산</text><text class="math" x="403" y="124">f(x)=px³+qx</text><text class="math" x="403" y="151">p+q=3, 3p+q=1</text><text class="math" x="403" y="178">p=−1, q=4</text><line class="guide" x1="403" y1="192" x2="590" y2="192"/><text class="math" x="403" y="222">f(2)=0, f′(2)=−8</text><text class="math" x="403" y="249">m=−8, n=16</text><text class="label" x="403" y="288">n−m=24  (정답: ⑤)</text><text class="small" x="403" y="319">접선은 (2,0)을 지나고 y절편은 16이다.</text></g>
</svg>
