<svg xmlns="http://www.w3.org/2000/svg" width="760" height="490" viewBox="0 0 760 490" role="img" aria-label="Q33 해설 도형 — 원의 방정식"><rect width="760" height="490" fill="#fff"/><style>.t{font:700 20px &quot;Noto Sans CJK KR&quot;,sans-serif;fill:#21304a}.st{font:14px &quot;Noto Sans CJK KR&quot;,sans-serif;fill:#506078}.lb{font:14px &quot;Noto Sans CJK KR&quot;,sans-serif;fill:#172a44}.sm{font:13px &quot;Noto Sans CJK KR&quot;,sans-serif;fill:#365b67}</style><text x="25" y="35" class="t">Q33 해설 도형 — 원의 방정식</text><text x="25" y="58" class="st">좌표는 발문과 동일한 축척으로 표시</text><rect x="68" y="90" width="634" height="305" fill="#f7fbfd" rx="12"/><line x1="350.34" y1="90" x2="350.34" y2="395" stroke="#bacbd5" stroke-width="1.5"/><text x="354.34" y="105" class="sm">y</text><line x1="68" y1="311.82" x2="702" y2="311.82" stroke="#bacbd5" stroke-width="1.5"/><text x="687" y="304.82" class="sm">x</text><circle cx="385.00" cy="242.50" r="103.98" fill="none" stroke="#127b84" stroke-width="2.5"/><line x1="232.50" y1="395.00" x2="537.50" y2="90.00" stroke="#7a6aaf" stroke-width="2.5"/><text x="507.50" y="81.00" class="sm">y=x+1</text><line x1="458.52" y1="168.98" x2="311.48" y2="316.02" stroke="#c26732" stroke-width="2.6"/><text x="391.00" y="233.50" class="sm">현</text><circle cx="385.00" cy="242.50" r="4.5" fill="#1b3349"/><text x="393.00" y="232.50" class="lb">C(1, 2)</text><circle cx="458.52" cy="168.98" r="4.5" fill="#1b3349"/><text x="466.52" y="158.98" class="lb">A</text><circle cx="311.48" cy="316.02" r="4.5" fill="#1b3349"/><text x="319.48" y="306.02" class="lb">B</text><text x="25" y="429" class="sm">직선 y=x+1는 중심을 통과하는 두 교점 예시</text><text x="25" y="449" class="sm">다른 두 점에서 만나려면 중심-직선 거리 d &lt; r</text></svg>