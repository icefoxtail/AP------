<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" width="640" height="280" role="img" aria-labelledby="title desc">
  <title id="title">수직 접선을 빠뜨린 경우</title>
  <desc id="desc">점 P(2,−2)에서 원 x²+y²=4에 그은 수평 접선 y=−2와 수직 접선 x=2를 함께 나타낸 그림</desc>
  <rect width="640" height="280" fill="#fff"/>
  <text x="320" y="28" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="21" font-weight="700" fill="#1e3a5f">P에서 원에 그은 두 접선: y = −2, x = 2</text>
  <rect x="18" y="45" width="330" height="215" rx="8" fill="#f8fafc" stroke="#dbe3ef"/>
  <g stroke="#e2e8f0" stroke-width="1">
    <line x1="45" y1="95" x2="330" y2="95"/><line x1="45" y1="140" x2="330" y2="140"/><line x1="45" y1="185" x2="330" y2="185"/><line x1="45" y1="230" x2="330" y2="230"/>
    <line x1="45" y1="50" x2="45" y2="275"/><line x1="90" y1="50" x2="90" y2="275"/><line x1="135" y1="50" x2="135" y2="275"/><line x1="180" y1="50" x2="180" y2="275"/><line x1="225" y1="50" x2="225" y2="275"/><line x1="270" y1="50" x2="270" y2="275"/><line x1="315" y1="50" x2="315" y2="275"/>
  </g>
  <line x1="42" y1="185" x2="335" y2="185" stroke="#0f172a" stroke-width="1.5"/><line x1="180" y1="50" x2="180" y2="278" stroke="#0f172a" stroke-width="1.5"/>
  <text x="327" y="179" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14">x</text><text x="187" y="63" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14">y</text>
  <circle cx="180" cy="185" r="90" fill="#dbeafe" fill-opacity=".64" stroke="#2563eb" stroke-width="2.6"/>
  <line x1="90" y1="275" x2="315" y2="275" stroke="#0f766e" stroke-width="2.7"/>
  <line x1="270" y1="95" x2="270" y2="275" stroke="#dc2626" stroke-width="2.7"/>
  <circle cx="180" cy="275" r="4.2" fill="#0f766e"/><circle cx="270" cy="185" r="4.2" fill="#dc2626"/><circle cx="270" cy="275" r="4.8" fill="#111827"/>
  <text x="96" y="268" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="13" fill="#047857">y=−2</text>
  <text x="276" y="109" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="13" fill="#b91c1c">x=2</text>
  <text x="278" y="269" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="13" font-weight="700">P(2,−2)</text>
  <text x="188" y="205" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14" font-weight="700">O</text>
  <rect x="370" y="45" width="252" height="215" rx="8" fill="#f8fafc" stroke="#dbe3ef"/>
  <text x="388" y="75" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="17" font-weight="700" fill="#334155">처음 틀린 곳</text>
  <text x="388" y="108" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14">P=(2,−2)는 원 밖의 점</text>
  <text x="388" y="138" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14">ㄱ: y=m(x−2)−2</text>
  <text x="388" y="168" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14">기울기가 없는 x=2 누락</text>
  <text x="388" y="198" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14">4+y²=4 → y=0</text>
  <text x="388" y="232" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="16" font-weight="700" fill="#b91c1c">정답: ㄱ</text>
</svg>
