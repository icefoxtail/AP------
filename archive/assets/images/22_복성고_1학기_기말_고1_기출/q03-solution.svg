<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" width="640" height="280" role="img" aria-labelledby="title desc">
  <title id="title">원의 접선 기울기와 절편</title>
  <desc id="desc">원 x²+y²=10 위의 점 (3,1)에서의 접선 3x+y=10과 x절편 (10,0)을 나타낸 그림</desc>
  <rect width="640" height="280" fill="#fff"/>
  <text x="320" y="28" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="21" font-weight="700" fill="#1e3a5f">접선: 3x + y = 10  →  y = −3x + 10</text>
  <rect x="18" y="45" width="330" height="215" rx="8" fill="#f8fafc" stroke="#dbe3ef"/>
  <g stroke="#e2e8f0" stroke-width="1">
    <line x1="32" y1="72" x2="332" y2="72"/><line x1="32" y1="104" x2="332" y2="104"/><line x1="32" y1="136" x2="332" y2="136"/><line x1="32" y1="168" x2="332" y2="168"/><line x1="32" y1="200" x2="332" y2="200"/><line x1="32" y1="232" x2="332" y2="232"/>
    <line x1="32" y1="72" x2="32" y2="246"/><line x1="64" y1="72" x2="64" y2="246"/><line x1="96" y1="72" x2="96" y2="246"/><line x1="128" y1="72" x2="128" y2="246"/><line x1="160" y1="72" x2="160" y2="246"/><line x1="192" y1="72" x2="192" y2="246"/><line x1="224" y1="72" x2="224" y2="246"/><line x1="256" y1="72" x2="256" y2="246"/><line x1="288" y1="72" x2="288" y2="246"/>
  </g>
  <line x1="30" y1="200" x2="334" y2="200" stroke="#0f172a" stroke-width="1.5"/><line x1="80" y1="58" x2="80" y2="250" stroke="#0f172a" stroke-width="1.5"/>
  <text x="326" y="194" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14">x</text><text x="87" y="68" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14">y</text>
  <circle cx="80" cy="200" r="50.596" fill="#dbeafe" fill-opacity=".7" stroke="#2563eb" stroke-width="2.6"/>
  <line x1="88" y1="64" x2="243" y2="210" stroke="#0f766e" stroke-width="2.6"/>
  <line x1="80" y1="200" x2="128" y2="184" stroke="#dc2626" stroke-width="2.2" stroke-dasharray="6 4"/>
  <circle cx="80" cy="200" r="4.5" fill="#1d4ed8"/><circle cx="128" cy="184" r="4.2" fill="#0f766e"/><circle cx="240" cy="200" r="4.2" fill="#f97316"/>
  <text x="88" y="218" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14" font-weight="700">O(0,0)</text>
  <text x="136" y="178" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14" font-weight="700">T(3,1)</text>
  <text x="204" y="218" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14" font-weight="700" fill="#c2410c">X(10,0)</text>
  <text x="100" y="96" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="13" fill="#047857">접선</text><text x="86" y="181" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="13" fill="#b91c1c">OT ⟂ 접선</text>
  <rect x="370" y="45" width="252" height="215" rx="8" fill="#f8fafc" stroke="#dbe3ef"/>
  <text x="388" y="75" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="17" font-weight="700" fill="#334155">계산 흐름</text>
  <text x="388" y="108" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="15">접선 조건: 3x+y=10</text>
  <text x="388" y="136" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="15">y=−3x+10</text>
  <text x="388" y="164" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="15">m=−3, n=10</text>
  <text x="388" y="196" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="15">m×n=(−3)×10</text>
  <text x="388" y="232" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="17" font-weight="700" fill="#047857">= −30</text>
</svg>
