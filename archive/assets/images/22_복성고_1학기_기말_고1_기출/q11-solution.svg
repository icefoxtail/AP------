<text x="526" y="166" class="sidebody">=10(1−x/8)</text>
<text x="526" y="187" class="sidebody">=10−5x/4</text>
<text x="526" y="208" class="sidebody">S=x(10−5x/4)</text>
<text x="526" y="229" class="sidebody">=−(5/4)x²+10x</text>
