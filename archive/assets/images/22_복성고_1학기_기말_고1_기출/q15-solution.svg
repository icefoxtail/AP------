  <text x="90" y="82" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="13" fill="#1d4ed8">C(−1,3)</text>
  <text x="280" y="230" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="13" fill="#c2410c">C′(3,−1)</text>
  <text x="184" y="125" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="13" fill="#047857">구하는 원</text>
  <text x="182" y="169" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="12" fill="#475569">중심 (1,1)</text>
  <rect x="407" y="45" width="215" height="215" rx="8" fill="#f8fafc" stroke="#dbe3ef"/>
  <text x="424" y="75" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="17" font-weight="700" fill="#334155">계산 흐름</text>
  <text x="424" y="108" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14">두 중심 거리: CC′=4√2</text>
  <text x="424" y="138" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14">큰 두 원의 반지름: √2</text>
  <text x="424" y="168" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14">2r=4√2−2√2</text>
  <text x="424" y="198" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14">r=√2</text>
  <text x="424" y="232" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="16" font-weight="700" fill="#047857">넓이=2π</text>
