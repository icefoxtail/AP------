<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" width="640" height="280" role="img" aria-labelledby="title desc" data-scale-policy="SCHEMATIC_ALLOWED">
  <title id="title">두 원 사이에 끼워진 가장 작은 원</title>
  <desc id="desc">중심 (−1,3), (3,−1)의 같은 원 두 개와 두 원 사이에서 동시에 접하는 중심 (1,1), 반지름 √2인 원을 나타낸 그림</desc>
  <rect width="640" height="280" fill="#fff"/>
  <text x="320" y="28" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="21" font-weight="700" fill="#1e3a5f">두 원 사이의 가장 작은 접하는 원</text>
  <rect x="18" y="45" width="370" height="215" rx="8" fill="#f8fafc" stroke="#dbe3ef"/>
  <g stroke="#e2e8f0" stroke-width="1">
    <line x1="45" y1="74" x2="365" y2="74"/><line x1="45" y1="110" x2="365" y2="110"/><line x1="45" y1="146" x2="365" y2="146"/><line x1="45" y1="182" x2="365" y2="182"/><line x1="45" y1="218" x2="365" y2="218"/><line x1="45" y1="254" x2="365" y2="254"/>
    <line x1="54" y1="55" x2="54" y2="252"/><line x1="90" y1="55" x2="90" y2="252"/><line x1="126" y1="55" x2="126" y2="252"/><line x1="162" y1="55" x2="162" y2="252"/><line x1="198" y1="55" x2="198" y2="252"/><line x1="234" y1="55" x2="234" y2="252"/><line x1="270" y1="55" x2="270" y2="252"/><line x1="306" y1="55" x2="306" y2="252"/><line x1="342" y1="55" x2="342" y2="252"/>
  </g>
  <line x1="42" y1="180" x2="368" y2="180" stroke="#0f172a" stroke-width="1.5"/><line x1="190" y1="55" x2="190" y2="258" stroke="#0f172a" stroke-width="1.5"/>
  <text x="358" y="174" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14">x</text><text x="197" y="67" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14">y</text>
  <line x1="151" y1="84" x2="289" y2="222" stroke="#64748b" stroke-width="1.8" stroke-dasharray="6 4"/>
  <circle cx="162" cy="96" r="39.598" fill="#dbeafe" fill-opacity=".72" stroke="#2563eb" stroke-width="2.5"/>
  <circle cx="274" cy="208" r="39.598" fill="#ffedd5" fill-opacity=".72" stroke="#f97316" stroke-width="2.5"/>
  <circle cx="218" cy="152" r="39.598" fill="#dcfce7" fill-opacity=".88" stroke="#059669" stroke-width="2.7"/>
