<svg xmlns="http://www.w3.org/2000/svg" width="360" height="308" viewBox="0 0 360 308" role="img" aria-labelledby="title desc"><title id="title">두 공통 접선과 직선 x=8이 만드는 삼각형</title><desc id="desc">접선 y=0과 y=x, 직선 x=8이 꼭짓점 O, A, B인 직각삼각형을 이룬다.</desc><rect width="360" height="308" fill="#ffffff"/><text x="18" y="22" font-size="14" font-weight="700" fill="#172033">공통 접선과 x=8이 만드는 영역</text><text x="18" y="42" font-size="11" fill="#334155">두 접선은 y=0과 y=x이다.</text><line x1="70" y1="264" x2="290" y2="264" stroke="#2563eb" stroke-width="2.2" stroke-linecap="round"/><line x1="290" y1="264" x2="290" y2="44" stroke="#2563eb" stroke-width="2.2" stroke-linecap="round"/><line x1="290" y1="44" x2="70" y2="264" stroke="#2563eb" stroke-width="2.2" stroke-linecap="round"/><circle cx="70" cy="264" r="2.5" fill="#172033"/><circle cx="290" cy="264" r="2.5" fill="#172033"/><circle cx="290" cy="44" r="2.5" fill="#172033"/><line x1="274" y1="264" x2="274" y2="248" stroke="#172033" stroke-width="1.2"/><line x1="274" y1="248" x2="290" y2="248" stroke="#172033" stroke-width="1.2"/><text x="57" y="279" font-size="11" fill="#172033">O</text><text x="295" y="279" font-size="11" fill="#172033">A</text><text x="295" y="48" font-size="11" fill="#172033">B</text><text x="140" y="285" font-size="10" fill="#334155">m: y=0</text><text x="155" y="150" font-size="10" fill="#334155">l: y=x</text><text x="302" y="155" font-size="10" fill="#334155">x=8</text><text x="18" y="302" font-size="11" fill="#334155">밑변과 높이가 모두 8이므로 넓이는 1/2×8×8이다.</text></svg>
