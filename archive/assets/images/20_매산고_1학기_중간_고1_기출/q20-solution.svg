<svg xmlns="http://www.w3.org/2000/svg" width="360" height="230" viewBox="0 0 360 230" role="img" aria-labelledby="title desc"><title id="title">연립부등식의 해와 정수해</title><desc id="desc">예를 들어 n이 −1일 때 해는 (−2,0]과 [2,4)의 합집합이고 정수해는 네 개이다.</desc><rect width="360" height="230" fill="#ffffff"/><text x="18" y="22" font-size="14" font-weight="700" fill="#172033">예: n=−1일 때의 해</text><text x="18" y="42" font-size="10" fill="#334155">해: (−2, 0] ∪ [2, 4), 정수해: −1, 0, 2, 3</text><text x="83" y="50" font-size="10" fill="#334155">−2</text><text x="146" y="50" font-size="10" fill="#334155">0</text><line x1="93" y1="60" x2="151" y2="60" stroke="#2563eb" stroke-width="3" stroke-linecap="round"/><circle cx="93" cy="60" r="4" fill="white" stroke="#2563eb" stroke-width="1.5"/><circle cx="151" cy="60" r="4" fill="#2563eb" stroke="#2563eb" stroke-width="1.5"/><text x="199" y="130" font-size="10" fill="#334155">2</text><text x="262" y="130" font-size="10" fill="#334155">4</text><line x1="209" y1="140" x2="267" y2="140" stroke="#2563eb" stroke-width="3" stroke-linecap="round"/><circle cx="209" cy="140" r="4" fill="#2563eb" stroke="#2563eb" stroke-width="1.5"/><circle cx="267" cy="140" r="4" fill="white" stroke="#2563eb" stroke-width="1.5"/></svg>
