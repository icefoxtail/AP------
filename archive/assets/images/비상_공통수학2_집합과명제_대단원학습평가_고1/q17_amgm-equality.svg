<svg xmlns="http://www.w3.org/2000/svg" width="820" height="360" viewBox="0 0 820 360" role="img" aria-labelledby="title desc">
  <title id="title">AM-GM equality condition for the minimum</title>
  <desc id="desc">Let u equal 4x over y and v equal 9y over x. Their product is 36, so their sum is at least 12. Equality occurs at u equals v equals 6, equivalent to 2x equals 3y. For x equals 3 and y equals 2, the full expression equals 25.</desc>
  <rect width="820" height="360" fill="#fff"/>
  <g font-family="Arial,sans-serif" fill="#17212b">
    <text x="410" y="48" text-anchor="middle" font-size="23" font-weight="700">u = 4x/y,  v = 9y/x,  uv = 36</text>
    <text x="410" y="98" text-anchor="middle" font-size="22">u + v ≥ 2√(uv) = 12</text>
  </g>
  <g stroke="#446779" stroke-width="2">
    <rect x="96" y="141" width="240" height="68" rx="12" fill="#d8ebf2"/>
    <rect x="484" y="141" width="240" height="68" rx="12" fill="#d8ebf2"/>
  </g>
  <g font-family="Arial,sans-serif" fill="#17212b" font-size="20" font-weight="700">
    <text x="216" y="183" text-anchor="middle">u = 6</text>
    <text x="604" y="183" text-anchor="middle">v = 6</text>
    <text x="410" y="181" text-anchor="middle" font-size="26">=</text>
    <text x="410" y="253" text-anchor="middle" font-size="20">u = v  ⇔  4x/y = 9y/x  ⇔  2x = 3y</text>
    <text x="410" y="302" text-anchor="middle" font-size="20">Example: x = 3, y = 2  →  13 + 6 + 6 = 25</text>
  </g>
</svg>