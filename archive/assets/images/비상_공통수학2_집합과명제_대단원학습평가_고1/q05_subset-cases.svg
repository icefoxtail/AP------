<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330" role="img" aria-labelledby="title" aria-describedby="desc">
  <title id="title">부분집합과 진부분집합</title>
  <desc id="desc">A⊆B인 경우와 A⊊B인 경우를 벤 다이어그램과 차집합의 조건으로 구분한다.</desc>
  <rect width="760" height="330" fill="#fff"/>
  <g font-family="Arial,sans-serif" fill="#17212b" stroke="#31434d" stroke-width="2">
    <rect x="24" y="24" width="340" height="248" rx="12" fill="#fbfdff"/><rect x="396" y="24" width="340" height="248" rx="12" fill="#fbfdff"/>
    <ellipse cx="194" cy="150" rx="105" ry="72" fill="#d9ecf5" stroke="#28718e" stroke-width="3"/>
    <ellipse cx="566" cy="150" rx="122" ry="88" fill="#d9ecf5" stroke="#28718e" stroke-width="3"/>
    <ellipse cx="566" cy="150" rx="68" ry="48" fill="#a9d3e2" stroke="#775b9e" stroke-width="3"/>
  </g>
  <g font-family="Arial,sans-serif" fill="#17212b" font-size="19" font-weight="700">
    <text x="194" y="57" text-anchor="middle">경우 1: A=B</text>
    <text x="566" y="57" text-anchor="middle">경우 2: A는 B의 진부분집합</text>
    <text x="194" y="154" text-anchor="middle">A, B</text>
    <text x="566" y="154" text-anchor="middle">A</text>
    <text x="566" y="101" text-anchor="middle">B\A는 공집합이 아니다.</text>
    <text x="194" y="230" text-anchor="middle" font-size="17">B\A=∅</text>
  </g>
  <g font-family="Arial,sans-serif" fill="#354b55" font-size="15">
    <text x="380" y="307" text-anchor="middle">두 경우 모두 A⊆B를 만족하므로 B\A가 공집합일 필요는 없다.</text>
  </g>
</svg>