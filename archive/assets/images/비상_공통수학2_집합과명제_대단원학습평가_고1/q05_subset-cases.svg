<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330" role="img" aria-labelledby="title desc">
  <title id="title">Cases showing B minus A need not be empty</title>
  <desc id="desc">Two universes show the shared condition A is a subset of B. In the first A equals B. In the second A is properly inside B, leaving elements in B minus A.</desc>
  <rect width="760" height="330" fill="#fff"/>
  <g font-family="Arial,sans-serif" fill="#17212b" stroke="#31434d" stroke-width="2">
    <rect x="24" y="24" width="340" height="248" rx="12" fill="#fbfdff"/><rect x="396" y="24" width="340" height="248" rx="12" fill="#fbfdff"/>
    <ellipse cx="194" cy="150" rx="105" ry="72" fill="#d9ecf5" stroke="#28718e" stroke-width="3"/>
    <ellipse cx="566" cy="150" rx="122" ry="88" fill="#d9ecf5" stroke="#28718e" stroke-width="3"/>
    <ellipse cx="566" cy="150" rx="68" ry="48" fill="#a9d3e2" stroke="#775b9e" stroke-width="3"/>
  </g>
  <g font-family="Arial,sans-serif" fill="#17212b" font-size="19" font-weight="700">
    <text x="194" y="57" text-anchor="middle">Case 1: A = B</text>
    <text x="566" y="57" text-anchor="middle">Case 2: A is a proper subset of B</text>
    <text x="194" y="154" text-anchor="middle">A, B</text>
    <text x="566" y="154" text-anchor="middle">A</text>
    <text x="566" y="101" text-anchor="middle">BA is nonempty</text>
    <text x="194" y="230" text-anchor="middle" font-size="17">BA = empty</text>
  </g>
  <g font-family="Arial,sans-serif" fill="#354b55" font-size="15">
    <text x="380" y="307" text-anchor="middle">Both cases satisfy A subset-or-equal B; so BA need not be empty.</text>
  </g>
</svg>