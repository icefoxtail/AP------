<svg xmlns="http://www.w3.org/2000/svg" width="640" height="340" viewBox="0 0 640 340" role="img" aria-labelledby="title desc">
  <title id="title">집합 A와 B의 합집합 바깥 원소</title>
  <desc id="desc">U={1,...,7}; A-only={1,2}, intersection={3}, B-only={4,5}, and complement of the union is {6,7}, whose sum is 13.</desc>
  <rect width="640" height="340" rx="16" fill="#fff"/>
  <rect x="24" y="28" width="592" height="260" rx="14" fill="#f9e3a2" stroke="#596e78" stroke-width="2.5"/>
  <ellipse cx="250" cy="157" rx="145" ry="92" fill="#dceff6" fill-opacity="0.88" stroke="#2b7895" stroke-width="3"/>
  <ellipse cx="378" cy="157" rx="145" ry="92" fill="#e4f1df" fill-opacity="0.82" stroke="#56865e" stroke-width="3"/>
  <g font-family="sans-serif" fill="#17212b">
    <text x="44" y="55" font-size="17" font-weight="700">U={1,2,3,4,5,6,7}</text>
    <text x="174" y="90" font-size="17" font-weight="700">A</text>
    <text x="442" y="90" font-size="17" font-weight="700">B</text>
    <text x="188" y="164" text-anchor="middle" font-size="17">1, 2</text>
    <text x="314" y="164" text-anchor="middle" font-size="17" font-weight="700">3</text>
    <text x="439" y="164" text-anchor="middle" font-size="17">4, 5</text>
    <text x="560" y="156" text-anchor="middle" font-size="17" font-weight="700">6, 7</text>
    <text x="320" y="318" text-anchor="middle" font-size="19" font-weight="700">(A∪B)ᶜ={6,7};  6+7=13</text>
  </g>
</svg>
