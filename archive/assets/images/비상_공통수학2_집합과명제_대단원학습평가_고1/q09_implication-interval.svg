<svg xmlns="http://www.w3.org/2000/svg" width="660" height="300" viewBox="0 0 660 300" role="img" aria-labelledby="title desc">
  <title id="title">명제의 참을 위한 진리집합 포함 관계</title>
  <desc id="desc">For P=(k−1,k+2] to be a subset of Q=(2,7), the left endpoint condition is k−1≥2 and the closed right endpoint must satisfy k+2&lt;7, so k is 3 or 4.</desc>
  <defs><marker id="left-arrow" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto"><path d="M8,0 L0,4 L8,8" fill="none" stroke="#294f64" stroke-width="1.6"/></marker></defs>
  <rect width="660" height="300" rx="16" fill="#fff"/>
  <g font-family="sans-serif" fill="#17212b">
    <text x="28" y="34" font-size="16" font-weight="700">p→q가 참 ⇔ P⊆Q</text>
    <text x="38" y="102" font-size="17" font-weight="700" fill="#28718e">P: (k−1, k+2]</text>
    <text x="38" y="170" font-size="17" font-weight="700" fill="#54845c">Q: (2, 7)</text>
    <text x="330" y="240" text-anchor="middle" font-size="18" font-weight="700">k−1 ≥ 2,  k+2 &lt; 7  ⇒  3 ≤ k &lt; 5</text>
    <text x="330" y="272" text-anchor="middle" font-size="16">자연수 k = 3, 4이므로 합은 7</text>
  </g>
  <line x1="300" y1="108" x2="500" y2="108" stroke="#28718e" stroke-width="8" stroke-linecap="round"/>
  <line x1="190" y1="176" x2="520" y2="176" stroke="#54845c" stroke-width="8" stroke-linecap="round"/>
  <line x1="190" y1="108" x2="190" y2="176" stroke="#7d8d95" stroke-width="1.4" stroke-dasharray="4 4"/>
  <line x1="300" y1="108" x2="300" y2="176" stroke="#7d8d95" stroke-width="1.4" stroke-dasharray="4 4"/>
  <line x1="500" y1="108" x2="500" y2="176" stroke="#7d8d95" stroke-width="1.4" stroke-dasharray="4 4"/>
  <line x1="520" y1="108" x2="520" y2="176" stroke="#7d8d95" stroke-width="1.4" stroke-dasharray="4 4"/>
  <circle cx="300" cy="108" r="8" fill="#fff" stroke="#28718e" stroke-width="3"/>
  <circle cx="500" cy="108" r="8" fill="#28718e" stroke="#28718e" stroke-width="2"/>
  <circle cx="190" cy="176" r="8" fill="#fff" stroke="#54845c" stroke-width="3"/>
  <circle cx="520" cy="176" r="8" fill="#fff" stroke="#54845c" stroke-width="3"/>
  <g font-family="sans-serif" font-size="14" fill="#17212b">
    <text x="300" y="133" text-anchor="middle">k−1</text><text x="190" y="201" text-anchor="middle">2</text>
    <text x="500" y="133" text-anchor="middle">k+2</text><text x="520" y="201" text-anchor="middle">7</text>
  </g>
</svg>
