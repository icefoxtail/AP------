<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 384 320" width="384" height="320" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">원기둥 윗면의 원과 정사각형 관통 구멍을 위에서 본 한 가능한 배치이다. 구멍 중심을 원 중심에 둔 것은 예시이며 원문이 중심 일치를 요구한 것은 아니다. 실제 넓이식은 구멍 위치와 무관하다. 위·아래 각각의 남은 면적은 πa²−b², 바깥 옆면은2πab, 안쪽 네 벽은4b²이다. 이 항들을 합해 유리수 조건을 적용하며 최종 a−b는 쓰지 않는다.</title><desc id="visual-desc">점과 도형의 관계를 확인한다.</desc><rect width="384" height="320" fill="#fff"/><g data-layer="30"><line id="AB" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="146.285714286" y1="205.714285714" x2="237.714285714" y2="205.714285714"/></g><g data-layer="30"><line id="BC" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="237.714285714" y1="205.714285714" x2="237.714285714" y2="114.285714286"/></g><g data-layer="30"><line id="CD" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="237.714285714" y1="114.285714286" x2="146.285714286" y2="114.285714286"/></g><g data-layer="30"><line id="DA" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="146.285714286" y1="114.285714286" x2="146.285714286" y2="205.714285714"/></g><g data-layer="30"><line id="radius" data-role="line" stroke="#111" stroke-width="1.6" fill="none" stroke-dasharray="6 4" x1="192" y1="160" x2="306.285714286" y2="160"/></g><g data-layer="40"><circle id="circle" data-role="circle" stroke="#111" stroke-width="2.05" fill="none" cx="192" cy="160" r="114.285714286"/></g><g data-layer="60"><polyline id="rB" data-role="indicator" stroke="#111" stroke-width="0.8" fill="none" points="227.714285714,205.714285714 227.714285714,195.714285714 237.714285714,195.714285714"/></g><g data-layer="85"><line id="label1-owner-leader" data-role="leader" data-owner-label="label1" data-owner="radius" x1="249.142857143" y1="160" x2="249.142857143" y2="140" stroke="#666" stroke-width="0.8" fill="none"/></g><g data-layer="90"><g id="label0" data-label-kind="EQUATION_LABEL" data-priority="1" data-font-px="20" data-owner="AB" data-fragment-sha="sha256:1b75aa958af82d2656158922ed110e56f4409993eeec7cdbab0f0fca0573a428" transform="translate(187.71 213.714285714)"><svg xmlns="http://www.w3.org/2000/svg" width="8.58" height="14.1" viewBox="0 0 8.58 14.1" data-outline-width="8.58" data-outline-height="14.1" id="lb-798042077f6a74649d4d4cdbf23b16294047b17ac3674fd563612d9301011e82" data-owner="AB" data-fact-role="DERIVED_INTERMEDIATE"><g data-outline-units-per-em="1000" transform="translate(0 13.88) scale(0.02)"><g stroke="currentColor" fill="currentColor" stroke-width="30" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mi"><path data-c="1D44F" d="M73 647Q73 657 77 670T89 683Q90 683 161 688T234 694Q246 694 246 685T212 542Q204 508 195 472T180 418L176 399Q176 396 182 402Q231 442 283 442Q345 442 383 396T422 280Q422 169 343 79T173 -11Q123 -11 82 27T40 150V159Q40 180 48 217T97 414Q147 611 147 623T109 637Q104 637 101 637H96Q86 637 83 637T76 640T73 647ZM336 325V331Q336 405 275 405Q258 405 240 397T207 376T181 352T163 330L157 322L136 236Q114 150 114 114Q114 66 138 42Q154 26 178 26Q211 26 245 58Q270 81 285 114T318 219Q336 291 336 325Z"></path></g></g></g></g></svg></g></g><g data-layer="90"><g id="label1" data-label-kind="EQUATION_LABEL" data-priority="1" data-font-px="20" data-owner="radius" data-fragment-sha="sha256:32a4a81de492692a62359918dba68bf48210771b2e7f34e766