<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 705 470" width="705" height="470" role="img" aria-labelledby="title desc"><title id="title">오른쪽과 아래로 이동한 포물선</title><desc id="desc">아래로 열린 파란 포물선의 최고점과 주황 대칭축이 보인다. 대칭축은 x축의 3을 통과하고 최고점은 x축 아래에 있다.</desc><rect width="705" height="470" fill="white" /><line x1="42.0000" y1="92.5380" x2="664.0000" y2="92.5380" stroke="#4d5d72" stroke-width="1.65" stroke-linecap="round" /><polygon points="664.0000,92.5380 651.0000,87.5380 651.0000,97.5380" fill="#4d5d72" /><text x="681.0000" y="84.5380" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#4d5d72" text-anchor="middle">x</text><line x1="130.2839" y1="419.0000" x2="130.2839" y2="34.0000" stroke="#4d5d72" stroke-width="1.65" stroke-linecap="round" /><polygon points="130.2839,34.0000 125.2839,47.0000 135.2839,47.0000" fill="#4d5d72" /><text x="146.2839" y="40.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#4d5d72" text-anchor="middle">y</text><circle cx="130.28387096774196" cy="92.53801169590645" r="4.6" fill="#28364b" /><text x="115.2839" y="119.5380" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">O</text><path d="M 134.2968 333.5007 Q 371.0581 -58.3662 607.8194 333.5007" stroke="#205d9c" stroke-width="4.55" stroke-linecap="round" fill="none" /><line x1="371.0581" y1="137.5673" x2="371.0581" y2="92.5380" stroke="#4d5d72" stroke-width="1.85" stroke-linecap="round" stroke-dasharray="7 5" /><circle cx="371.05806451612904" cy="137.56725146198835" r="4.6" fill="#aa5411" /><text x="393.0581" y="124.5673" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#aa5411" text-anchor="middle">V</text><circle cx="371.05806451612904" cy="92.53801169590645" r="4.6" fill="#28364b" /><text x="353.0581" y="80.5380" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" fo