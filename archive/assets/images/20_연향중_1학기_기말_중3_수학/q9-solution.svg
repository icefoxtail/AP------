<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 705 470" width="705" height="470" role="img" aria-labelledby="title desc"><title id="title">x축에 대해 뒤집힌 포물선</title><desc id="desc">a가 양수인 예에서 파랑은 위로 열린 포물선, 주황은 아래로 열린 포물선이다. x가 같은 두 점의 세로 높이는 x축을 가운데 두고 서로 반대 방향이다.</desc><rect width="705" height="470" fill="white" /><line x1="42.0000" y1="226.5000" x2="664.0000" y2="226.5000" stroke="#4d5d72" stroke-width="1.65" stroke-linecap="round" /><polygon points="664.0000,226.5000 651.0000,221.5000 651.0000,231.5000" fill="#4d5d72" /><text x="681.0000" y="218.5000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#4d5d72" text-anchor="middle">x</text><line x1="353.0000" y1="419.0000" x2="353.0000" y2="34.0000" stroke="#4d5d72" stroke-width="1.65" stroke-linecap="round" /><polygon points="353.0000,34.0000 348.0000,47.0000 358.0000,47.0000" fill="#4d5d72" /><text x="369.0000" y="40.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#4d5d72" text-anchor="middle">y</text><circle cx="353.0" cy="226.5" r="4.6" fill="#28364b" /><text x="338.0000" y="253.5000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">O</text><path d="M 97.1585 47.8890 Q 353.0000 405.1110 608.8415 47.8890" stroke="#205d9c" stroke-width="4.55" stroke-linecap="round" fill="none" /><path d="M 97.1585 405.1110 Q 353.0000 47.8890 608.8415 405.1110" stroke="#aa5411" stroke-width="4.55" stroke-linecap="round" fill="none" /><line x1="534.9057" y1="136.2060" x2="534.9057" y2="316.7940" stroke="#4d5d72" stroke-width="1.7" stroke-linecap="round" stroke-dasharray="6 5" /><circle cx="534.9056603773586" cy="136.2060416666667" r="4.6" fill="#205d9c" /><line x1="76.0000" y1="440.0000" x2="125.0000" y2="440.0000" stroke="#205d9c" stroke-width="4.5" stroke-linecap="round" /><text x="136.0000" y="449.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#205d9c" text-anchor="start">y = ax² (a &gt; 0)</text><circle cx="534.9056603773586" cy="316.7939583333333" r="4.6" fill="#aa5411" /><line x1="421.0000" y1="440.0000" x2="470.0000" y2="440.0000" stroke="#aa5411" stroke-width="4.5" stroke-linecap="round" /><text x="481.0000" y="449.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#aa5411" text-anchor="start">y = −ax²</text></svg>
