<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 505" width="720" height="505" role="img" aria-labelledby="title desc"><title id="title">같은 포물선 경계의 이동으로 넓이 구하기</title><desc id="desc">두 이차함수의 그래프 아래쪽에서 왼쪽 가지 두 개가 연두 영역을 사이에 둔다. 위 경계는 x축, 아래 경계는 P와 Q가 이어진 수평선이다.</desc><rect width="720" height="505" fill="white" /><path d="M 121.9047 186.2736 Q 192.5723 384.9528 263.2400 384.9528 L 426.4400 384.9528 Q 355.7723 384.9528 285.1047 186.2736 Z" fill="#e1f0e3" /><line x1="47.0000" y1="186.2736" x2="659.0000" y2="186.2736" stroke="#4d5d72" stroke-width="1.65" stroke-linecap="round" /><polygon points="659.0000,186.2736 646.0000,181.2736 646.0000,191.2736" fill="#4d5d72" /><text x="676.0000" y="178.2736" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#4d5d72" text-anchor="middle">x</text><line x1="181.6400" y1="428.0000" x2="181.6400" y2="77.0000" stroke="#4d5d72" stroke-width="1.65" stroke-linecap="round" /><polygon points="181.6400,77.0000 176.6400,90.0000 186.6400,90.0000" fill="#4d5d72" /><text x="197.6400" y="83.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#4d5d72" text-anchor="middle">y</text><circle cx="181.64" cy="186.27358490566039" r="4.6" fill="#28364b" /><text x="166.6400" y="213.2736" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">O</text><path d="M 92.8542 96.2057 Q 263.2400 673.7000 433.6258 96.2057" stroke="#205d9c" stroke-width="4.7" stroke-linecap="round" fill="none" /><line x1="48.0000" y1="39.0000" x2="97.0000" y2="39.0000" stroke="#205d9c" stroke-width="4.7" stroke-linecap="round" /><text x="107.0000" y="47.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#205d9c" text-anchor="start">y = x² − 2x − 2</text><path d="M 256.0542 96.2057 Q 426.4400 673.7000 596.8258 96.2057" stroke="#aa5411" stroke-width="4.7" stroke-linecap="round" fill="none" stroke-dasharray="14 6" /><line x1="373.0000" y1="39.0000" x2="422.0000" y2="39.0000" stroke="#aa5411" stroke-width="4.7" stroke-linecap="round" stroke-dasharray="14 6" /><text x="432.0000" y="47.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#aa5411" text-anchor="start">y = x² − 6x + 6</text><line x1="263.2400" y1="384.9528" x2="426.4400" y2="384.9528" stroke="#4d5d72" stroke-width="2.05" stroke-linecap="round" /><circle cx="263.24" cy="384.95283018867923" r="4.6" fill="#205d9c" /><text x="259.2400" y="413.9528" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#205d9c" text-anchor="middle">P</text><circle cx="426.44" cy="384.95283018867923" r="4.6" fill="#aa5411" /><text x="428.4400" y="413.9528" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#aa5411" text-anchor="middle">Q</text></svg>
