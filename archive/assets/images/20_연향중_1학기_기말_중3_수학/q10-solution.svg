<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 705 470" width="705" height="470" role="img" aria-labelledby="title desc"><title id="title">같은 꼭짓점에서 세 포물선의 폭 비교</title><desc id="desc">세 포물선의 꼭짓점은 모두 원점이며 세 그래프가 아래로 열린다. 파랑 그래프가 가장 좁고 초록 그래프가 가장 넓으며 주황 그래프가 가운데이다.</desc><rect width="705" height="470" fill="white" /><line x1="46.0000" y1="88.1341" x2="654.0000" y2="88.1341" stroke="#4d5d72" stroke-width="1.65" stroke-linecap="round" /><polygon points="654.0000,88.1341 641.0000,83.1341 641.0000,93.1341" fill="#4d5d72" /><text x="671.0000" y="80.1341" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#4d5d72" text-anchor="middle">x</text><line x1="350.0000" y1="399.0000" x2="350.0000" y2="40.0000" stroke="#4d5d72" stroke-width="1.65" stroke-linecap="round" /><polygon points="350.0000,40.0000 345.0000,53.0000 355.0000,53.0000" fill="#4d5d72" /><text x="366.0000" y="46.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#4d5d72" text-anchor="middle">y</text><circle cx="350.0" cy="88.13407821229049" r="4.6" fill="#28364b" /><text x="335.0000" y="115.1341" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">O</text><path d="M 83.0408 372.2588 Q 350.0000 -195.9907 616.9592 372.2588" stroke="#277339" stroke-width="5.5" stroke-linecap="round" fill="none" stroke-dasharray="2 6" /><line x1="480.0000" y1="429.0000" x2="527.0000" y2="429.0000" stroke="#277339" stroke-width="5.5" stroke-linecap="round" stroke-dasharray="2 6" /><text x="537.0000" y="438.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#277339" text-anchor="start">y = −x²/2</text><path d="M 181.1601 372.2588 Q 350.0000 -195.9907 518.8399 372.2588" stroke="#aa5411" stroke-width="4.8" stroke-linecap="round" fill="none" stroke-dasharray="15 7" /><line x1="264.0000" y1="429.0000" x2="311.0000" y2="429.0000" stroke="#aa5411" stroke-width="4.8" stroke-linecap="round" stroke-dasharray="15 7" /><text x="321.0000" y="438.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#aa5411" text-anchor="start">y = ax²</text><path d="M 241.0143 372.2588 Q 350.0000 -195.9907 458.9857 372.2588" stroke="#205d9c" stroke-width="4.7" stroke-linecap="round" fill="none" /><line x1="48.0000" y1="429.0000" x2="95.0000" y2="429.0000" stroke="#205d9c" stroke-width="4.7" stroke-linecap="round" /><text x="105.0000" y="438.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#205d9c" text-anchor="start">y = −3x²</text><line x1="89.0361" y1="198.4413" x2="592.6506" y2="198.4413" stroke="#4d5d72" stroke-width="1.39" stroke-linecap="round" stroke-dasharray="6 5" /><circle cx="183.661619100186" cy="198.44134078212286" r="4.6" fill="#277339" /><circle cx="516.3383808998141" cy="198.44134078212286" r="4.6" fill="#277339" /><circle cx="244.79837081038792" cy="198.44134078212286" r="4.6" fill="#aa5411" /><circle cx="455.2016291896121" cy="198.44134078212286" r="4.6" fill="#aa5411" /><circle cx="282.09264035912406" cy="198.44134078212286" r="4.6" fill="#205d9c" /><circle cx="417.90735964087594" cy="198.44134078212286" r="4.6" fill="#205d9c" /></svg>
