<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 705 470" width="705" height="470" role="img" aria-labelledby="title desc"><title id="title">대칭축과 왼쪽 x절편이 표시된 포물선</title><desc id="desc">포물선은 위로 열리고 왼쪽에서 x축의 −1을 지난다. 꼭짓점은 x=1에 해당하는 점선 위와 x축 아래에 있다.</desc><rect width="705" height="470" fill="white" /><line x1="42.0000" y1="230.5526" x2="664.0000" y2="230.5526" stroke="#4d5d72" stroke-width="1.65" stroke-linecap="round" /><polygon points="664.0000,230.5526 651.0000,225.5526 651.0000,235.5526" fill="#4d5d72" /><text x="681.0000" y="222.5526" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#4d5d72" text-anchor="middle">x</text><line x1="250.9160" y1="419.0000" x2="250.9160" y2="34.0000" stroke="#4d5d72" stroke-width="1.65" stroke-linecap="round" /><polygon points="250.9160,34.0000 245.9160,47.0000 255.9160,47.0000" fill="#4d5d72" /><text x="266.9160" y="40.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#4d5d72" text-anchor="middle">y</text><circle cx="250.91603053435117" cy="230.55263157894734" r="4.6" fill="#28364b" /><text x="235.9160" y="257.5526" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">O</text><path d="M 62.8916 56.5022 Q 345.8779 689.9084 628.8641 56.5022" stroke="#205d9c" stroke-width="4.55" stroke-linecap="round" fill="none" /><line x1="345.8779" y1="373.2053" x2="345.8779" y2="230.5526" stroke="#4d5d72" stroke-width="1.85" stroke-linecap="round" stroke-dasharray="7 5" /><circle cx="345.87786259541986" cy="373.2052631578947" r="4.6" fill="#aa5411" /><text x="367.8779" y="360.2053" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#aa5411" text-anchor="middle">V</text><circle cx="155.95419847328247" cy="230.55263157894734" r="4.6" fill="#205d9c" /><text x="167.9542" y="217.5526" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-ser