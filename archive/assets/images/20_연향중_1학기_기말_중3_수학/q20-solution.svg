<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 725" width="720" height="725" role="img" aria-labelledby="title desc"><title id="title">같은 포물선 경계의 이동으로 넓이 구하기</title><desc id="desc">왼쪽 조각의 겹치지 않는 부분을 주황으로 칠하고 x=1에서 자른 경계를 점선으로 표시했다. 아래 직사각형은 원래 색과 이동한 색이 합쳐진 모습을 보여 준다.</desc><rect width="720" height="725" fill="white" /><path d="M 121.9047 186.2736 L 263.2400 186.2736 L 263.2400 384.9528 Q 192.5723 384.9528 121.9047 186.2736 Z" fill="#fae4c9" /><path d="M 263.2400 186.2736 L 263.2400 384.9528 L 426.4400 384.9528 Q 355.7723 384.9528 285.1047 186.2736 Z" fill="#e1f0e3" /><line x1="47.0000" y1="186.2736" x2="659.0000" y2="186.2736" stroke="#4d5d72" stroke-width="1.65" stroke-linecap="round" /><polygon points="659.0000,186.2736 646.0000,181.2736 646.0000,191.2736" fill="#4d5d72" /><text x="676.0000" y="178.2736" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#4d5d72" text-anchor="middle">x</text><line x1="181.6400" y1="428.0000" x2="181.6400" y2="77.0000" stroke="#4d5d72" stroke-width="1.65" stroke-linecap="round" /><polygon points="181.6400,77.0000 176.6400,90.0000 186.6400,90.0000" fill="#4d5d72" /><text x="197.6400" y="83.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#4d5d72" text-anchor="middle">y</text><circle cx="181.64" cy="186.27358490566039" r="4.6" fill="#28364b" /><text x="166.6400" y="213.2736" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">O</text><path d="M 92.8542 96.2057 Q 263.2400 673.7000 433.6258 96.2057" stroke="#205d9c" stroke-width="4.7" stroke-linecap="round" fill="none" /><line x1="48.0000" y1="39.0000" x2="97.0000" y2="39.0000" stroke="#205d9c" stroke-width="4.7" stroke-linecap="round" /><text x="107.0000" y="47.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#205d9c" text-anchor="start">y = x² − 2x − 2</text><path d="M 256.0542 96.2057 Q 426.4400 673.7000 596.8258 96.2057" stroke="#aa5411" stroke-width="4.7" stroke-linecap="round" fill="none" stroke-dasharray="14 6" /><line x1="373.0000" y1="39.0000" x2="422.0000" y2="39.0000" stroke="#aa5411" stroke-width="4.7" stroke-linecap="round" stroke-dasharray="14 6" /><text x="432.0000" y="47.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#aa5411" text-anchor="start">y = x² − 6x + 6</text><line x1="263.2400" y1="384.9528" x2="426.4400" y2="384.9528" stroke="#4d5d72" stroke-width="2.05" stroke-linecap="round" /><circle cx="263.24" cy="384.95283018867923" r="4.6" fill="#205d9c" /><text x="259.2400" y="413.9528" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#205d9c" text-anchor="middle">P</text><circle cx="426.44" cy="384.95283018867923" r="4.6" fill="#aa5411" /><text x="428.4400" y="413.9528" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#aa5411" text-anchor="middle">Q</text><line x1="263.2400" y1="186.2736" x2="263.2400" y2="384.9528" stroke="#4d5d72" stroke-width="2.15" stroke-linecap="round" stroke-dasharray="7 5" /><text x="246.2400" y="176.2736" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#4d5d72" text-anchor="middle">1</text><text x="352.0000" y="464.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#4d5d72" text-anchor="middle">오른쪽으로 2만큼 옮긴 뒤</text><rect x="258" y="482" width="194" height="185" fill="#e1f0e3" stroke="#4d5d72" stroke-width="2.6" /><path d="M 452 667 Q 367.99553583290947 667 283.99107166581894 482 L 452 482 Z" fill="#fae4c9" stroke="#aa5411" stroke-width="2.2" /><text x="355.0000" y="704.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#4d5d72" text-anchor="middle">2</text><text x="228.0000" y="588.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#4d5d72" text-anchor="middle">3</text></svg>
