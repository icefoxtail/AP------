<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 384 320" width="384" height="320" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">사다리꼴 ABCD에서 AD와 BC가 평행하고, 두 변 AB, DC의 중점 M, N을 잇는 선분 MN이 대각선 BD, AC와 만나는 점이 각각 P, Q이다. 윗변 AD는 10 cm, 아랫변 BC는 18 cm이다.</title><desc id="visual-desc">윗변 AD와 아랫변 BC가 평행한 사다리꼴 ABCD에서 두 다리의 중점 M, N을 잇는 선분이 그려져 있고, 이 선분이 대각선 BD와 만나는 점 P, 대각선 AC와 만나는 점 Q가 표시되어 있다. 윗변 옆에 10 cm, 아랫변 옆에 18 cm가 적혀 있다.</desc><rect width="384" height="320" fill="#fff"/><g data-layer="30"><line id="AB" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="112.634920635" y1="96.507936508" x2="49.142857143" y2="223.492063492"/></g><g data-layer="30"><line id="BC" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="49.142857143" y1="223.492063492" x2="334.857142857" y2="223.492063492"/></g><g data-layer="30"><line id="CD" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="334.857142857" y1="223.492063492" x2="271.365079365" y2="96.507936508"/></g><g data-layer="30"><line id="DA" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="271.365079365" y1="96.507936508" x2="112.634920635" y2="96.507936508"/></g><g data-layer="30"><line id="AC" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="112.634920635" y1="96.507936508" x2="334.857142857" y2="223.492063492"/></g><g data-l