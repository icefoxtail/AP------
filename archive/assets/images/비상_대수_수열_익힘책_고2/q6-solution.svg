<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 410" width="640" height="410" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">12개 수선의 길이는 등차수열. 양끝 a₁+a₁₂와 같은 합을 만드는 대칭항 a₃과 a₁₀을 강조한다. 여섯 가운데 선분은 생략했다.</title><desc id="visual-desc">서로 만나는 두 직선 l,m 사이에 첫째, 셋째, 열째, 열두째 수선만 대표로 보인다. 가운데에는 생략 기호가 있다. 셋째 a₃과 열째 a₁₀ 수선은 강조되며 네 발에는 직각 표시가 있다.</desc><rect width="640" height="410" fill="#fff"/><g data-layer="30"><line id="sTop" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="178.407738095" y1="50.535714286" x2="461.592261905" y2="205"/></g><g data-layer="30"><line id="sBottom" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="178.407738095" y1="359.464285714" x2="461.592261905" y2="359.464285714"/></g><g data-layer="30"><line id="s0" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="178.407738095" y1="359.464285714" x2="178.407738095" y2="50.535714286"/></g><g data-layer="30"><line id="s11" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="461.592261905" y1="359.464285714" x2="461.592261905" y2="205"/></g><g data-layer="38"><line id="s2" data-role="line" stroke="#c0392b" stroke-width="3.2" fill="none" x1="229.895833333" y1="359.464285714" x2="229.895833333" y2="78.62012987"/></g><g data-layer="38"><line id="s9" data-role="line" stroke="#c0392b" stroke-width="3.2" fill="none