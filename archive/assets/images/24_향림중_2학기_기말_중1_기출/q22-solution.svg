<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 360" role="img" aria-labelledby="title desc"><title id="title">사각뿔의 밑넓이와 옆넓이</title><desc id="desc">한 변 5인 정사각형 밑면과 밑변 5, 높이 x인 합동 삼각형 옆면 네 개를 분해한다.</desc><style>.main{fill:none;stroke:#111;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}.aux{fill:none;stroke:#666;stroke-width:1.6;stroke-dasharray:6 5}.shade{fill:#111;fill-opacity:.08;stroke:#111;stroke-width:1.7}.txt{font:18px sans-serif;fill:#111}.small{font:15px sans-serif;fill:#111}.formula{font:17px serif;fill:#111}.bold{font:700 18px sans-serif;fill:#111}.dot{fill:#111}</style><rect width="100%" height="100%" fill="#fff"/><g><polygon points="170,70 70,235 270,235" class="main"/><line x1="170" y1="70" x2="335" y2="200" class="main"/><line x1="70" y1="235" x2="335" y2="200" class="main"/><line x1="270" y1="235" x2="335" y2="200" class="main"/><line x1="170" y1="70" x2="238" y2="220" class="aux"/><rect x="231" y="207" width="14" height="14" fill="none" stroke="#111" stroke-width="1.5"/><text x="145" y="265" class="txt">5 cm</text><text x="250" y="198" class="bold">x cm</text></g><g><path d="M505 90 L590 245 L420 245 Z" class="main"/><line x1="505" y1="90" x2="505" y2="245" class="aux"/><rect x="505" y="231" width="14" height="14" fill="none" stroke="#111" stroke-width="1.5"/><text x="485" y="175" class="bold">x</text><text x="500" y="274" class="txt">5</text><text x="400" y="310" class="formula">한 옆면 = 1/2×5×x = 5x/2</text><text x="400" y="338" class="formula">옆넓이 = 4×5x/2 = 10x</text><text x="85" y="315" class="formula">밑넓이 = 5² = 25</text></g></svg>