<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" role="img" aria-labelledby="title desc"><title id="title">구의 1/8을 잘라낸 뒤의 부피 비율</title><desc id="desc">구의 부피를 8등분한 개념도로 한 부분을 제거하면 7/8이 남음을 나타낸다. 실제 구의 단면도가 아니라 부피 비율을 설명하는 개념도이다.</desc><style>.main{fill:none;stroke:#111;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}.aux{fill:none;stroke:#666;stroke-width:1.6;stroke-dasharray:6 5}.shade{fill:#111;fill-opacity:.08;stroke:#111;stroke-width:1.7}.txt{font:18px sans-serif;fill:#111}.small{font:15px sans-serif;fill:#111}.formula{font:17px serif;fill:#111}.bold{font:700 18px sans-serif;fill:#111}.dot{fill:#111}</style><rect width="100%" height="100%" fill="#fff"/><g transform="translate(185 170)"><circle cx="0" cy="0" r="120" class="main"/><path d="M0 0 L120 0 A120 120 0 0 1 84.85 84.85 Z" class="shade"/><line x1="0" y1="0" x2="120" y2="0" class="main"/><line x1="0" y1="0" x2="84.85" y2="84.85" class="main"/><line x1="0" y1="0" x2="0" y2="120" class="aux"/><line x1="0" y1="0" x2="-84.85" y2="84.85" class="aux"/><line x1="0" y1="0" x2="-120" y2="0" class="aux"/><line x1="0" y1="0" x2="-84.85" y2="-84.85" class="aux"/><line x1="0" y1="0" x2="0" y2="-120" class="aux"/><line x1="0" y1="0" x2="84.85" y2="-84.85" class="aux"/></g><g><text x="230" y="235" class="bold">제거 1/8</text><text x="350" y="88" class="small">부피 비율 개념도</text><text x="350" y="135" class="formula">구 전체 부피 = 4/3π·3³ = 36π</text><text x="350" y="185" class="formula">남은 비율 = 1 - 1/8 = 7/8</text><text x="350" y="235" class="bold">36π × 7/8</text><text x="350" y="272" class="bold">= 63π/2 cm³</text></g></svg>