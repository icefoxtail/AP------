<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 330" role="img" aria-labelledby="title desc"><title id="title">삼각기둥의 겉넓이 분해</title><desc id="desc">직각삼각형 밑면 두 개와 밑면 둘레에 높이 15를 곱한 옆넓이로 분해한다.</desc><style>.main{fill:none;stroke:#111;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}.aux{fill:none;stroke:#666;stroke-width:1.6;stroke-dasharray:6 5}.shade{fill:#111;fill-opacity:.08;stroke:#111;stroke-width:1.7}.txt{font:18px sans-serif;fill:#111}.small{font:15px sans-serif;fill:#111}.formula{font:17px serif;fill:#111}.bold{font:700 18px sans-serif;fill:#111}.dot{fill:#111}</style><rect width="100%" height="100%" fill="#fff"/><g><path d="M70 230 L70 110 L230 230 Z" class="main"/><path d="M230 230 L400 185 L400 65 L230 110" class="main"/><line x1="70" y1="110" x2="230" y2="110" class="main"/><line x1="70" y1="230" x2="400" y2="185" class="aux"/><line x1="70" y1="110" x2="400" y2="65" class="aux"/><rect x="62" y="214" width="16" height="16" fill="none" stroke="#111" stroke-width="1.6"/></g><g><text x="38" y="172" class="txt">6</text><text x="145" y="253" class="txt">8</text><text x="145" y="154" class="txt">10</text><text x="320" y="236" class="txt">15</text><text x="430" y="95" class="bold">밑넓이</text><text x="430" y="125" class="formula">1/2×6×8 = 24</text><text x="430" y="168" class="bold">옆넓이</text><text x="430" y="198" class="formula">(6+8+10)×15 = 360</text><text x="340" y="302" text-anchor="middle" class="bold">겉넓이 = 2×24 + 360 = 408 cm²</text></g></svg>