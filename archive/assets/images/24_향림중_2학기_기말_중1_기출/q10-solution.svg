<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 320" role="img" aria-labelledby="title desc"><title id="title">잘라낸 정육면체의 부피</title><desc id="desc">남은 입체를 사다리꼴 단면이 길이 6만큼 이어진 기둥으로 본다.</desc><style>.main{fill:none;stroke:#111;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}.aux{fill:none;stroke:#666;stroke-width:1.6;stroke-dasharray:6 5}.shade{fill:#111;fill-opacity:.08;stroke:#111;stroke-width:1.7}.txt{font:18px sans-serif;fill:#111}.small{font:15px sans-serif;fill:#111}.formula{font:17px serif;fill:#111}.bold{font:700 18px sans-serif;fill:#111}.dot{fill:#111}</style><rect width="100%" height="100%" fill="#fff"/><g><polygon points="80,235 80,130 300,70 300,235" class="main"/><line x1="80" y1="235" x2="300" y2="235" class="main"/><line x1="80" y1="130" x2="300" y2="70" class="main"/></g><g><text x="42" y="190" class="txt">3 cm</text><text x="310" y="160" class="txt">6 cm</text><text x="175" y="262" class="txt">6 cm</text><text x="360" y="82" class="bold">사다리꼴 단면</text><text x="360" y="116" class="formula">(3+6)/2 × 6 = 27 cm²</text><text x="360" y="166" class="bold">기둥 길이 6 cm</text><text x="360" y="205" class="formula">27×6 = 162 cm³</text><text x="310" y="298" text-anchor="middle" class="bold">정답 ①</text></g></svg>