<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 350" role="img" aria-labelledby="title desc"><title id="title">호의 길이와 중심각의 비례</title><desc id="desc">30도에 9cm, x도에 15cm, 70도에 ycm가 대응하는 원을 나타낸다.</desc><style>.main{fill:none;stroke:#111;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}.aux{fill:none;stroke:#666;stroke-width:1.6;stroke-dasharray:6 5}.shade{fill:#111;fill-opacity:.08;stroke:#111;stroke-width:1.7}.txt{font:18px sans-serif;fill:#111}.small{font:15px sans-serif;fill:#111}.formula{font:17px serif;fill:#111}.bold{font:700 18px sans-serif;fill:#111}.dot{fill:#111}</style><rect width="100%" height="100%" fill="#fff"/><g><circle cx="250" cy="175" r="125" class="main"/><line x1="250" y1="175" x2="125" y2="175" class="main"/><line x1="250" y1="175" x2="142" y2="112" class="main"/><line x1="250" y1="175" x2="271" y2="298" class="main"/><line x1="250" y1="175" x2="344" y2="257" class="main"/><line x1="250" y1="175" x2="367" y2="132" class="main"/><circle cx="250" cy="175" r="4" class="dot"/></g><g><text x="237" y="167" class="txt">O</text><text x="140" y="133" class="bold">30° ↔ 9 cm</text><text x="205" y="282" class="bold">x° ↔ 15 cm</text><text x="350" y="206" class="bold">70° ↔ y cm</text><text x="425" y="95" class="formula">둘레 = 9×360/30 = 108</text><text x="425" y="135" class="formula">x = 360×15/108 = 50</text><text x="425" y="175" class="formula">y = 108×70/360 = 21</text><text x="425" y="225" class="bold">x+y = 71</text></g></svg>