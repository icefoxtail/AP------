<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" role="img" aria-labelledby="title desc"><title id="title">염소가 움직일 수 있는 영역</title><desc id="desc">P 중심 240도 영역과 양쪽 이웃 꼭짓점에서 반지름 9, 중심각 60도인 추가 영역 두 개를 나타낸다.</desc><style>.main{fill:none;stroke:#111;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}.aux{fill:none;stroke:#666;stroke-width:1.6;stroke-dasharray:6 5}.shade{fill:#111;fill-opacity:.08;stroke:#111;stroke-width:1.7}.txt{font:18px sans-serif;fill:#111}.small{font:15px sans-serif;fill:#111}.formula{font:17px serif;fill:#111}.bold{font:700 18px sans-serif;fill:#111}.dot{fill:#111}</style><rect width="100%" height="100%" fill="#fff"/><g><polygon points="255,92 395,92 465,213 395,334 255,334 185,213" class="main"/><path d="M255 334 A205 205 0 1 1 145 160" class="aux"/><path d="M185 213 A62 62 0 0 0 134 250" class="aux"/><path d="M395 334 A62 62 0 0 1 428 388" class="aux"/></g><g><text x="242" y="362" class="txt">P</text><text x="150" y="205" class="txt">Q</text><text x="402" y="355" class="txt">R</text><text x="290" y="72" class="txt">21 m</text><text x="45" y="420" class="bold">P 중심 240°, r=30 → 600π</text><text x="410" y="420" class="bold">Q, R 각각 60°, r=9</text><text x="410" y="454" class="formula">2×(60/360)π·9² = 27π</text><text x="380" y="495" text-anchor="middle" class="bold">전체 = 627π m²</text></g></svg>