<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-labelledby="title desc"><title id="title">정다면체가 아닌 삼각쌍뿔</title><desc id="desc">삼각쌍뿔에서 위아래 꼭짓점에는 3개의 면, 가운데 삼각형의 꼭짓점에는 4개의 면이 모여 정다면체 조건을 만족하지 않음을 보여준다.</desc><style>.main{fill:none;stroke:#111;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}.aux{fill:none;stroke:#666;stroke-width:1.6;stroke-dasharray:6 5}.shade{fill:#111;fill-opacity:.08;stroke:#111;stroke-width:1.7}.txt{font:18px sans-serif;fill:#111}.small{font:15px sans-serif;fill:#111}.formula{font:17px serif;fill:#111}.bold{font:700 18px sans-serif;fill:#111}.dot{fill:#111}</style><rect width="100%" height="100%" fill="#fff"/><g><line x1="320" y1="45" x2="155" y2="205" class="main"/><line x1="320" y1="45" x2="485" y2="205" class="main"/><line x1="320" y1="45" x2="320" y2="135" class="aux"/><line x1="320" y1="335" x2="155" y2="205" class="main"/><line x1="320" y1="335" x2="485" y2="205" class="main"/><line x1="320" y1="335" x2="320" y2="135" class="aux"/><path d="M155 205 L485 205 L320 135 Z" class="main"/><circle cx="320" cy="45" r="4" class="dot"/><circle cx="320" cy="335" r="4" class="dot"/><circle cx="155" cy="205" r="4" class="dot"/><circle cx="485" cy="205" r="4" class="dot"/><circle cx="320" cy="135" r="4" class="dot"/></g><g><text x="335" y="42" class="bold">3면</text><text x="335" y="357" class="bold">3면</text><text x="90" y="210" class="bold">4면</text><text x="500" y="210" class="bold">4면</text><text x="330" y="130" class="small">가운데 꼭짓점: 4면</text><text x="320" y="378" text-anchor="middle" class="bold">꼭짓점마다 모이는 면의 수가 다름 → 정다면체 아님</text></g></svg>