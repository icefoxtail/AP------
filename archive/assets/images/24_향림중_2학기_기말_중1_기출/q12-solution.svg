<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 340" role="img" aria-labelledby="title desc"><title id="title">남은 물의 삼각뿔</title><desc id="desc">직육면체에서 남은 물을 서로 수직인 8, 12인 삼각형을 밑면으로 하고 높이 3인 삼각뿔로 본다.</desc><style>.main{fill:none;stroke:#111;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}.aux{fill:none;stroke:#666;stroke-width:1.6;stroke-dasharray:6 5}.shade{fill:#111;fill-opacity:.08;stroke:#111;stroke-width:1.7}.txt{font:18px sans-serif;fill:#111}.small{font:15px sans-serif;fill:#111}.formula{font:17px serif;fill:#111}.bold{font:700 18px sans-serif;fill:#111}.dot{fill:#111}</style><rect width="100%" height="100%" fill="#fff"/><g><polygon points="95,260 365,260 175,115" class="main"/><line x1="95" y1="260" x2="95" y2="105" class="main"/><line x1="95" y1="105" x2="365" y2="260" class="main"/><line x1="95" y1="105" x2="175" y2="115" class="main"/><path d="M106 248 h18 v-18" class="main"/></g><g><text x="212" y="292" class="txt">12 cm</text><text x="192" y="188" class="txt">8 cm</text><text x="48" y="188" class="txt">3 cm</text><text x="390" y="105" class="bold">남은 물 = 삼각뿔</text><text x="390" y="142" class="formula">밑넓이 = 1/2×8×12 = 48</text><text x="390" y="180" class="formula">부피 = 1/3×48×3 = 48</text><text x="390" y="230" class="formula">288 - 48 = 240 cm³</text></g></svg>