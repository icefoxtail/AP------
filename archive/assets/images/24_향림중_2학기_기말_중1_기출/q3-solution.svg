<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 320" role="img" aria-labelledby="title desc"><title id="title">원뿔의 축단면</title><desc id="desc">회전축을 포함하는 평면으로 자른 원뿔의 단면이 이등변삼각형임을 보여준다.</desc><style>.main{fill:none;stroke:#111;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}.aux{fill:none;stroke:#666;stroke-width:1.6;stroke-dasharray:6 5}.shade{fill:#111;fill-opacity:.08;stroke:#111;stroke-width:1.7}.txt{font:18px sans-serif;fill:#111}.small{font:15px sans-serif;fill:#111}.formula{font:17px serif;fill:#111}.bold{font:700 18px sans-serif;fill:#111}.dot{fill:#111}</style><rect width="100%" height="100%" fill="#fff"/><g><path d="M260 45 L120 255 Q260 292 400 255 Z" class="main"/><ellipse cx="260" cy="255" rx="140" ry="36" class="aux"/><line x1="260" y1="45" x2="260" y2="255" class="aux"/><path d="M260 45 L140 255 L380 255 Z" class="shade"/></g><g><text x="275" y="142" class="small">회전축</text><text x="260" y="298" text-anchor="middle" class="bold">축을 포함한 단면 = 이등변삼각형</text><text x="145" y="235" class="small">같은 모선</text><text x="320" y="235" class="small">같은 모선</text></g></svg>