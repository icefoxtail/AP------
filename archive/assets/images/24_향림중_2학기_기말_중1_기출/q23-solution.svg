<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 390" role="img" aria-labelledby="title desc"><title id="title">회전체의 부피 분해</title><desc id="desc">큰 직각삼각형을 회전한 원뿔에서 안쪽 직사각형을 회전한 원기둥을 뺀다.</desc><style>.main{fill:none;stroke:#111;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}.aux{fill:none;stroke:#666;stroke-width:1.6;stroke-dasharray:6 5}.shade{fill:#111;fill-opacity:.08;stroke:#111;stroke-width:1.7}.txt{font:18px sans-serif;fill:#111}.small{font:15px sans-serif;fill:#111}.formula{font:17px serif;fill:#111}.bold{font:700 18px sans-serif;fill:#111}.dot{fill:#111}</style><rect width="100%" height="100%" fill="#fff"/><g><line x1="445" y1="50" x2="445" y2="340" class="aux"/><polygon points="90,315 445,315 445,65" class="main"/><rect x="270" y="215" width="175" height="100" fill="#fff" stroke="#111" stroke-width="2.4"/></g><g><text x="455" y="150" class="txt">4 cm</text><text x="455" y="270" class="txt">2 cm</text><text x="155" y="343" class="txt">2 cm</text><text x="350" y="343" class="txt">2 cm</text><text x="480" y="82" class="txt">회전축 l</text><text x="70" y="45" class="bold">큰 삼각형 → 원뿔 (r=4, h=6)</text><text x="70" y="78" class="bold">직사각형 → 원기둥 (r=2, h=2)</text><text x="70" y="112" class="formula">32π - 8π = 24π cm³</text></g></svg>