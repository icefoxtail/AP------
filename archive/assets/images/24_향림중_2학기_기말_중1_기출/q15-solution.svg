<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" role="img" aria-labelledby="title desc"><title id="title">점 O의 이동 경로</title><desc id="desc">처음과 마지막은 반지름 8의 90도 원호, 가운데는 호 AB의 길이만큼 직선 이동한다.</desc><style>.main{fill:none;stroke:#111;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}.aux{fill:none;stroke:#666;stroke-width:1.6;stroke-dasharray:6 5}.shade{fill:#111;fill-opacity:.08;stroke:#111;stroke-width:1.7}.txt{font:18px sans-serif;fill:#111}.small{font:15px sans-serif;fill:#111}.formula{font:17px serif;fill:#111}.bold{font:700 18px sans-serif;fill:#111}.dot{fill:#111}</style><rect width="100%" height="100%" fill="#fff"/><g><line x1="40" y1="230" x2="720" y2="230" class="main"/><path d="M100 230 A80 80 0 0 1 180 150" class="main"/><line x1="180" y1="150" x2="510" y2="150" class="main"/><path d="M510 150 A80 80 0 0 1 590 230" class="main"/><line x1="100" y1="230" x2="180" y2="230" class="aux"/><line x1="510" y1="230" x2="590" y2="230" class="aux"/></g><g><text x="112" y="120" class="bold">① 사분원 4π</text><text x="300" y="130" class="bold">② 직선 4π</text><text x="520" y="120" class="bold">③ 사분원 4π</text><text x="85" y="258" class="txt">A</text><text x="170" y="145" class="txt">O</text><text x="500" y="145" class="txt">O</text><text x="595" y="258" class="txt">B</text><text x="380" y="52" text-anchor="middle" class="bold">O의 전체 이동거리 = 12π cm</text></g></svg>