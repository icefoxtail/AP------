<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 320" role="img" aria-labelledby="title desc"><title id="title">두 부채꼴의 중심각 합</title><desc id="desc">15도와 75도의 합이 90도이므로 두 부채꼴 넓이의 합이 원 전체의 1/4임을 보여준다.</desc><style>.main{fill:none;stroke:#111;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}.aux{fill:none;stroke:#666;stroke-width:1.6;stroke-dasharray:6 5}.shade{fill:#111;fill-opacity:.08;stroke:#111;stroke-width:1.7}.txt{font:18px sans-serif;fill:#111}.small{font:15px sans-serif;fill:#111}.formula{font:17px serif;fill:#111}.bold{font:700 18px sans-serif;fill:#111}.dot{fill:#111}</style><rect width="100%" height="100%" fill="#fff"/><g><circle cx="190" cy="165" r="120" class="main"/><path d="M190 165 L190 45 A120 120 0 0 1 310 165 Z" class="shade"/><line x1="190" y1="165" x2="306" y2="134" class="main"/><circle cx="190" cy="165" r="4" class="dot"/></g><g><text x="205" y="158" class="txt">O</text><text x="255" y="108" class="small">15° + 75° = 90°</text><text x="350" y="90" class="bold">두 부채꼴의 합</text><text x="350" y="125" class="formula">90/360 = 1/4</text><text x="350" y="172" class="formula">원 넓이 S:</text><text x="350" y="205" class="formula">S/4 = 30</text><text x="350" y="245" class="bold">S = 120 cm²</text></g></svg>