<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340" role="img" aria-labelledby="title desc"><title id="title">두 반구의 겉넓이 분해</title><desc id="desc">큰 반구 곡면, 작은 반구 곡면, 큰 원판에서 작은 원판을 뺀 환형 평면을 합한다.</desc><style>.main{fill:none;stroke:#111;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}.aux{fill:none;stroke:#666;stroke-width:1.6;stroke-dasharray:6 5}.shade{fill:#111;fill-opacity:.08;stroke:#111;stroke-width:1.7}.txt{font:18px sans-serif;fill:#111}.small{font:15px sans-serif;fill:#111}.formula{font:17px serif;fill:#111}.bold{font:700 18px sans-serif;fill:#111}.dot{fill:#111}</style><rect width="100%" height="100%" fill="#fff"/><g><path d="M70 235 A190 155 0 0 1 450 235" class="main"/><line x1="70" y1="235" x2="450" y2="235" class="main"/><path d="M175 235 A85 75 0 0 1 345 235" class="main"/><line x1="175" y1="235" x2="345" y2="235" class="main"/></g><g><text x="120" y="92" class="bold">큰 반구 곡면 72π</text><text x="205" y="158" class="bold">작은 반구 곡면 18π</text><text x="355" y="260" class="small">r=6</text><text x="292" y="214" class="small">r=3</text><text x="480" y="100" class="bold">드러난 평면</text><text x="480" y="135" class="formula">π·6² - π·3²</text><text x="480" y="168" class="formula">= 27π</text><text x="340" y="314" text-anchor="middle" class="bold">72π + 18π + 27π = 117π cm²</text></g></svg>