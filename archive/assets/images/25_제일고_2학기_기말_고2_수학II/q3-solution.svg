<svg xmlns="http://www.w3.org/2000/svg" width="760" height="620" viewBox="0 0 760 620" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet">
  <title id="title">25_제일고_2학기_기말_고2_수학II · q3 해설 시각화</title>
  <desc id="desc">문항 3의 원문과 해설 흐름을 source-bound 텍스트 카드로 정리한 SVG</desc>
  <rect width="760" height="620" fill="#fff"/>
  <g font-family="Noto Sans KR, Pretendard, Apple SD Gothic Neo, Malgun Gothic, sans-serif" fill="#111">
    <text x="380" y="32" font-size="21" font-weight="700" text-anchor="middle">25_제일고_2학기_기말_고2_수학II · q3 해설 시각화</text>
    <text x="380" y="59" font-size="15" text-anchor="middle" fill="#475569">도함수의 활용 · 극댓값과 극솟값</text>
    <rect x="18" y="82" width="350" height="350" rx="12" fill="#eff6ff" stroke="#93c5fd"/>
    <rect x="390" y="82" width="352" height="350" rx="12" fill="#f0fdf4" stroke="#86efac"/>
    <text x="34" y="112" font-size="17" font-weight="700" fill="#1d4ed8">문항 핵심</text>
    <text x="398" y="112" font-size="17" font-weight="700" fill="#15803d">해설 흐름</text>
    <text x="34" y="140" font-size="15">함수 f(x)=x^3-6x^2+9x+4의 극댓값을 M, 극솟값을 m이라 할 때, M-m의 </text>
    <text x="34" y="162" font-size="15">값은? [3.8점]</text>
    <text x="398" y="140" font-size="14">[키포인트] 극값이 생기는 임계점에서 함수값을 계산하여 극댓값과 극솟값의 차를 구한다. 조</text>
    <text x="398" y="162" font-size="14">건 정리: f(x)=x^3-6x^2+9x+4이다. 풀이 방향: f'(x)=0인 두 점을 구</text>
    <text x="398" y="184" font-size="14">하고, 도함수의 부호로 어느 점이 극댓값인지 확인한다. 정석 풀이: f'(x)=3x^2-1</text>
    <text x="398" y="206" font-size="14">2x+9=3(x-1)(x-3)이다. x=1에서 도함수의 부호가 +에서 -로 바뀌므로 극댓값</text>
    <text x="398" y="228" font-size="14">을 갖고, x=3에서 -에서 +로 바뀌므로 극솟값을 갖는다. M=f(1)=1-6+9+4=8</text>
    <text x="398" y="250" font-size="14">, m=f(3)=27-54+27+4=4이므로 M-m=8-4=4이다. 따라서 정답은 ②이다.</text>
    <path d="M350 330 L410 330" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="18" y="352" width="724" height="48" rx="10" fill="#fff7ed" stroke="#fdba74"/>
    <text x="380" y="382" font-size="17" text-anchor="middle" fill="#9a3412">결론: ②</text>
    <text x="380" y="427" font-size="13" text-anchor="middle" fill="#64748b">source: archive/exams/original/high/h2/2final/25_제일고_2학기_기말_고2_수학II.js · q3 · archive/assets/images/25_제일고_2학기_기말_고2_수학II/q3-solution.svg</text>
  </g>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#64748b"/></marker></defs>
</svg>