<svg xmlns="http://www.w3.org/2000/svg" width="760" height="620" viewBox="0 0 760 620" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet">
  <title id="title">25_제일고_2학기_기말_고2_수학II · q3 해설 시각화</title>
  <desc id="desc">문항 3의 원문과 해설 흐름을 source-bound 텍스트 카드로 정리한 SVG</desc>
  <rect width="760" height="620" fill="#fff"/>
  <g font-family="Noto Sans KR, Pretendard, Apple SD Gothic Neo, Malgun Gothic, sans-serif" fill="#111">
    <text x="380" y="32" font-size="21" font-weight="700" text-anchor="middle">25_제일고_2학기_기말_고2_수학II · q3 해설 시각화</text>
    <text x="380" y="59" font-size="15" text-anchor="middle" fill="#475569">문항 원문과 해설의 핵심 흐름</text>
    <rect x="18" y="82" width="350" height="306" rx="12" fill="#eff6ff" stroke="#93c5fd"/>
    <rect x="390" y="82" width="352" height="306" rx="12" fill="#f0fdf4" stroke="#86efac"/>
    <text x="34" y="112" font-size="17" font-weight="700" fill="#1d4ed8">문항 핵심</text>
    <text x="398" y="112" font-size="17" font-weight="700" fill="#15803d">해설 흐름</text>
    <text x="34" y="140" font-size="15">함수 f(x)=x^3-6x^2+9x+4의 극댓값을 M,</text>
    <text x="34" y="162" font-size="15">극솟값을 m이라 할 때, M-m의 값은? [3.8점]</text>
    <text x="398" y="140" font-size="14">[키포인트] 극값이 생기는 임계점에서 함수값을</text>
    <text x="398" y="162" font-size="14">계산하여 극댓값과 극솟값의 차를 구한다. 조건</text>
    <text x="398" y="184" font-size="14">정리: f(x)=x^3-6x^2+9x+4이다. 풀이 방향:</text>
    <text x="398" y="206" font-size="14">f'(x)=0인 두 점을 구하고, 도함수의 부호로</text>
    <text x="398" y="228" font-size="14">어느 점이 극댓값인지 확인한다. 정석 풀이:</text>
    <text x="398" y="250" font-size="14">f'(x)=3x^2-12x+9=3(x-1)(x-3)이다.</text>
    <text x="398" y="272" font-size="14">x=1에서 도함수의 부호가 +에서 -로 바뀌므로</text>
    <text x="398" y="294" font-size="14">극댓값을 갖고, x=3에서 -에서 +로 바뀌므로</text>
    <text x="398" y="316" font-size="14">극솟값을 갖는다. M=f(1)=1-6+9+4=8,</text>
    <text x="398" y="338" font-size="14">m=f(3)=27-54+27+4=4이므로 M-m=8-4=4이다.</text>
    <text x="398" y="360" font-size="14">따라서 정답은 ②이다.</text>
    <rect x="18" y="412" width="724" height="48" rx="10" fill="#fff7ed" stroke="#fdba74"/>
    <text x="380" y="442" font-size="17" text-anchor="middle" fill="#9a3412">결론: ②</text>
    <text x="380" y="488" font-size="11" text-anchor="middle" fill="#64748b">25_제일고_2학기_기말_고2_수학II · q3 · source-bound solution visual</text>
  </g>
</svg>