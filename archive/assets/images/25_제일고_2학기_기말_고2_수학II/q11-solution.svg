<svg xmlns="http://www.w3.org/2000/svg" width="760" height="620" viewBox="0 0 760 620" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet">
  <title id="title">25_제일고_2학기_기말_고2_수학II · q11 해설 시각화</title>
  <desc id="desc">문항 11의 원문과 해설 흐름을 source-bound 텍스트 카드로 정리한 SVG</desc>
  <rect width="760" height="620" fill="#fff"/>
  <g font-family="Noto Sans KR, Pretendard, Apple SD Gothic Neo, Malgun Gothic, sans-serif" fill="#111">
    <text x="380" y="32" font-size="21" font-weight="700" text-anchor="middle">25_제일고_2학기_기말_고2_수학II · q11 해설 시각화</text>
    <text x="380" y="59" font-size="15" text-anchor="middle" fill="#475569">문항 원문과 해설의 핵심 흐름</text>
    <rect x="18" y="82" width="350" height="350" rx="12" fill="#eff6ff" stroke="#93c5fd"/>
    <rect x="390" y="82" width="352" height="350" rx="12" fill="#f0fdf4" stroke="#86efac"/>
    <text x="34" y="112" font-size="17" font-weight="700" fill="#1d4ed8">문항 핵심</text>
    <text x="398" y="112" font-size="17" font-weight="700" fill="#15803d">해설 흐름</text>
    <text x="34" y="140" font-size="15">수직선 위를 움직이는 두 점 P, Q의 시각</text>
    <text x="34" y="162" font-size="15">t에서의 위치가 각각 -1 / 2t^4+2t^3+3t^2,</text>
    <text x="34" y="184" font-size="15">kt^2이다. t&gt;0에서 두 점 P, Q의 가속도가</text>
    <text x="34" y="206" font-size="15">같아지는 순간이 2번 있도록 하는 모든 정수</text>
    <text x="34" y="228" font-size="15">k의 값의 합은? [4.3점]</text>
    <text x="398" y="140" font-size="14">[키포인트] 두 점의 가속도가 같다는 조건을</text>
    <text x="398" y="162" font-size="14">이차방정식으로 바꾸고 양의 해의 개수를</text>
    <text x="398" y="184" font-size="14">조사한다. 조건 정리: P의 위치는 -1 /</text>
    <text x="398" y="206" font-size="14">2t^4+2t^3+3t^2, Q의 위치는 kt^2이다. 풀이</text>
    <text x="398" y="228" font-size="14">방향: 두 위치를 두 번 미분하여 가속도를 구한</text>
    <text x="398" y="250" font-size="14">뒤, t&gt;0에서 교점이 두 개가 되는 k의 범위를</text>
    <text x="398" y="272" font-size="14">찾는다. 정석 풀이: P와 Q의 가속도는 각각</text>
    <text x="398" y="294" font-size="14">-6t^2+12t+6, 2k이다. 따라서 같은 순간의</text>
    <text x="398" y="316" font-size="14">조건은 k=-3t^2+6t+3이다. 이 함수는 t=0에서</text>
    <text x="398" y="338" font-size="14">3이고, t=1에서 최댓값 6을 가지며 t&gt;1에서</text>
    <text x="398" y="360" font-size="14">감소한다. 따라서 수평선 y=k가 t&gt;0에서 두 점과</text>
    <text x="398" y="382" font-size="14">만나려면 3&lt; k&lt;6이어야 한다. 정수 k는 4,5이고</text>
    <text x="398" y="404" font-size="14">그 합은 9이다. 따라서 정답은 ②이다.</text>
    <rect x="18" y="456" width="724" height="48" rx="10" fill="#fff7ed" stroke="#fdba74"/>
    <text x="380" y="486" font-size="17" text-anchor="middle" fill="#9a3412">결론: ②</text>
    <text x="380" y="532" font-size="11" text-anchor="middle" fill="#64748b">25_제일고_2학기_기말_고2_수학II · q11 · source-bound solution visual</text>
  </g>
</svg>