<svg xmlns="http://www.w3.org/2000/svg" width="760" height="620" viewBox="0 0 760 620" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet">
  <title id="title">25_제일고_2학기_기말_고2_수학II · q19 해설 시각화</title>
  <desc id="desc">문항 19의 원문과 해설 흐름을 source-bound 텍스트 카드로 정리한 SVG</desc>
  <rect width="760" height="620" fill="#fff"/>
  <g font-family="Noto Sans KR, Pretendard, Apple SD Gothic Neo, Malgun Gothic, sans-serif" fill="#111">
    <text x="380" y="32" font-size="21" font-weight="700" text-anchor="middle">25_제일고_2학기_기말_고2_수학II · q19 해설 시각화</text>
    <text x="380" y="59" font-size="15" text-anchor="middle" fill="#475569">적분의 활용 · 최댓값 함수와 넓이</text>
    <rect x="18" y="82" width="350" height="350" rx="12" fill="#eff6ff" stroke="#93c5fd"/>
    <rect x="390" y="82" width="352" height="350" rx="12" fill="#f0fdf4" stroke="#86efac"/>
    <text x="34" y="112" font-size="17" font-weight="700" fill="#1d4ed8">문항 핵심</text>
    <text x="398" y="112" font-size="17" font-weight="700" fill="#15803d">해설 흐름</text>
    <text x="34" y="140" font-size="15">실수 전체의 집합에서 정의된 함수 f(x)가 다음 조건을 만족시킨다. (가) x\ge0일 </text>
    <text x="34" y="162" font-size="15">때, f(x)=-x^2+2x이다. (나) 함수 f(x)의 그래프는 원점에 대하여 대칭이다.</text>
    <text x="34" y="184" font-size="15"> 실수 t에 대하여 닫힌구간 [t,t+1]에서 함수 f(x)의 최댓값을 g(t)라 하자. </text>
    <text x="34" y="206" font-size="15">두 곡선 y=f(x), y=g(x)와 두 직선 x=-32, x=0으로 둘러싸인 부분의 넓이</text>
    <text x="34" y="228" font-size="15">를 qp라 하자. p+q의 값은? [4.9점] (단, p, q는 서로소인 자연수이다.)</text>
    <text x="398" y="140" font-size="14">[키포인트] 최댓값함수의 구간별 식을 구한 뒤 원래 함수와의 차를 적분한다. 조건 정리: </text>
    <text x="398" y="162" font-size="14">x\ge0에서 f(x)=-x^2+2x이고, 원점 대칭으로 x\le0에서 f(x)=x^2+2</text>
    <text x="398" y="184" font-size="14">x이다. 풀이 방향: 구간 [t,t+1]에서 f가 갖는 최댓값을 위치에 따라 나누어 g(t</text>
    <text x="398" y="206" font-size="14">)를 정한 다음, [-32,0]에서 g(t)-f(t)를 적분한다. 정석 풀이: 구간 [t,</text>
    <text x="398" y="228" font-size="14">t+1]의 위치를 조사하면 g(t)=\begincasest^2+2t&amp; (t\le-32)\\</text>
    <text x="398" y="250" font-size="14">t^2+4t+3&amp;(-32\le t\le-1)\\-t^2+1&amp;(-1\le t\le0)\end</text>
    <text x="398" y="272" font-size="14">cases이다. 따라서 구하는 넓이는 ∫_-3/2^-1\g(t)-f(t)\dt+∫_-1^0</text>
    <text x="398" y="294" font-size="14">\g(t)-f(t)\dt =∫_-3/2^-1(2t+3)dt+∫_-1^0(1-2t^2-2t)</text>
    <text x="398" y="316" font-size="14">dt=14+43=1912이다. 따라서 p=12, q=19이므로 p+q=31이다. 따라서 정</text>
    <text x="398" y="338" font-size="14">답은 ②이다.</text>
    <path d="M350 418 L410 418" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="18" y="440" width="724" height="48" rx="10" fill="#fff7ed" stroke="#fdba74"/>
    <text x="380" y="470" font-size="17" text-anchor="middle" fill="#9a3412">결론: ②</text>
    <text x="380" y="515" font-size="13" text-anchor="middle" fill="#64748b">source: archive/exams/original/high/h2/2final/25_제일고_2학기_기말_고2_수학II.js · q19 · archive/assets/images/25_제일고_2학기_기말_고2_수학II/q19-solution.svg</text>
  </g>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#64748b"/></marker></defs>
</svg>