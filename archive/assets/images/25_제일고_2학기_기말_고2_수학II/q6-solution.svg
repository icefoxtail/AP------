<svg xmlns="http://www.w3.org/2000/svg" width="640" height="430" viewBox="0 0 640 430" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet"><title id="title">포물선과 x축으로 둘러싸인 넓이</title><desc id="desc">실제 y=3x−x² 포물선의 두 근 0,3과 대칭축 x=1.5, 넓이 9/2를 표시한다.</desc><rect width="640" height="430" fill="#fff"/><g font-family="Arial, sans-serif" fill="#111"><text x="320" y="27" font-size="20" text-anchor="middle" font-weight="700">포물선과 x축 사이의 넓이</text><g transform="translate(52 48)"><line x1="20" y1="255" x2="490" y2="255" stroke="#111" stroke-width="2"/><line x1="65" y1="28" x2="65" y2="300" stroke="#111" stroke-width="2"/><polyline points="65.00,255.00 79.00,233.25 93.00,213.00 107.00,194.25 121.00,177.00 135.00,161.25 149.00,147.00 163.00,134.25 177.00,123.00 191.00,113.25 205.00,105.00 219.00,98.25 233.00,93.00 247.00,89.25 261.00,87.00 275.00,86.25 289.00,87.00 303.00,89.25 317.00,93.00 331.00,98.25 345.00,105.00 359.00,113.25 373.00,123.00 387.00,134.25 401.00,147.00 415.00,161.25 429.00,177.00 443.00,194.25 457.00,213.00 471.00,233.25 485.00,255.00 485,255 65,255" fill="#bfdbfe" opacity="0.85" stroke="#1d4ed8" stroke-width="3"/><line x1="275" y1="86.25" x2="275" y2="255" stroke="#64748b" stroke-dasharray="5 5"/><circle cx="65" cy="255" r="5" fill="#111"/><circle cx="485" cy="255" r="5" fill="#111"/><circle cx="275" cy="86.25" r="5" fill="#1d4ed8"/><text x="65" y="282" font-size="16" text-anchor="middle">0</text><text x="485" y="282" font-size="16" text-anchor="middle">a=3</text><text x="275" y="76" font-size="14" text-anchor="middle">x=1.5</text><text x="260" y="150" font-size="17" text-anchor="middle" fill="#1e40af">넓이 9/2</text><text x="455" y="238" font-size="15" fill="#1d4ed8">y=3x−x²</text><text x="470" y="315" font-size="15">x</text><text x="48" y="35" font-size="15">y</text></g><g transform="translate(520 85)"><text x="0" y="0" font-size="16" font-weight="700">계산</text><text x="0" y="35" font-size="15">y=x(a−x)</text><text x="0" y="68" font-size="15">A=a³/6</text><text x="0" y="101" font-size="15">a³/6=9/2</text><text x="0" y="140" font-size="16" fill="#1d4ed8">a=3</text></g></g></svg>