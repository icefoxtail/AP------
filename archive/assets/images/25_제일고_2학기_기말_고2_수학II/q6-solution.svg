<svg xmlns="http://www.w3.org/2000/svg" width="640" height="430" viewBox="0 0 640 430" role="img" aria-labelledby="title desc">
  <title id="title">포물선과 x축으로 둘러싸인 넓이</title>
  <desc id="desc">y=3x-x²의 두 근 0,3과 x축 위의 넓이 9/2를 나타낸 해설 그래프</desc>
  <rect width="640" height="430" fill="#fff"/>
  <g font-family="Arial, sans-serif" fill="#111">
    <text x="320" y="27" font-size="20" text-anchor="middle" font-weight="700">포물선과 x축 사이의 넓이</text>
    <g transform="translate(52 48)">
      <line x1="20" y1="255" x2="490" y2="255" stroke="#111" stroke-width="2"/>
      <line x1="65" y1="28" x2="65" y2="300" stroke="#111" stroke-width="2"/>
      <path d="M65 255 C120 80 300 80 485 255 L65 255 Z" fill="#bfdbfe" opacity="0.85"/>
      <path d="M65 255 C120 80 300 80 485 255" fill="none" stroke="#1d4ed8" stroke-width="3"/>
      <circle cx="65" cy="255" r="5" fill="#111"/><circle cx="485" cy="255" r="5" fill="#111"/>
      <text x="65" y="282" font-size="16" text-anchor="middle">0</text><text x="485" y="282" font-size="16" text-anchor="middle">a=3</text>
      <text x="260" y="150" font-size="17" text-anchor="middle" fill="#1e40af">넓이 9/2</text>
      <text x="455" y="238" font-size="15" fill="#1d4ed8">y=3x−x²</text>
      <text x="470" y="315" font-size="15">x</text><text x="48" y="35" font-size="15">y</text>
    </g>
    <g transform="translate(520 85)">
      <text x="0" y="0" font-size="16" font-weight="700">계산</text>
      <text x="0" y="35" font-size="15">y=x(a−x)</text>
      <text x="0" y="68" font-size="15">A=a³/6</text>
      <text x="0" y="101" font-size="15">a³/6=9/2</text>
      <text x="0" y="140" font-size="16" fill="#1d4ed8">a=3</text>
    </g>
  </g>
</svg>
