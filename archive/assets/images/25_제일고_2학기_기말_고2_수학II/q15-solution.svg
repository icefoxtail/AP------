<svg xmlns="http://www.w3.org/2000/svg" width="760" height="748" viewBox="0 0 760 748" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet">
  <title id="title">25_제일고_2학기_기말_고2_수학II · q15 해설 시각화</title>
  <desc id="desc">문항 15의 원문과 해설 흐름을 source-bound 텍스트 카드로 정리한 SVG</desc>
  <rect width="760" height="748" fill="#fff"/>
  <g font-family="Noto Sans KR, Pretendard, Apple SD Gothic Neo, Malgun Gothic, sans-serif" fill="#111">
    <text x="380" y="32" font-size="21" font-weight="700" text-anchor="middle">25_제일고_2학기_기말_고2_수학II · q15 해설 시각화</text>
    <text x="380" y="59" font-size="15" text-anchor="middle" fill="#475569">문항 원문과 해설의 핵심 흐름</text>
    <rect x="18" y="82" width="350" height="526" rx="12" fill="#eff6ff" stroke="#93c5fd"/>
    <rect x="390" y="82" width="352" height="526" rx="12" fill="#f0fdf4" stroke="#86efac"/>
    <text x="34" y="112" font-size="17" font-weight="700" fill="#1d4ed8">문항 핵심</text>
    <text x="398" y="112" font-size="17" font-weight="700" fill="#15803d">해설 흐름</text>
    <text x="34" y="140" font-size="15">삼차함수 f(x)와 상수 a (a≠0,1)에 대하여</text>
    <text x="34" y="162" font-size="15">f(0)=f(1)=f(a), f'(0)=f'(a)를</text>
    <text x="34" y="184" font-size="15">만족시키고, 함수 f'(x)의 최댓값이 1이며,</text>
    <text x="34" y="206" font-size="15">(1,f(1))에서 접선의 y절편이 6일 때,</text>
    <text x="34" y="228" font-size="15">f(3)의 값은? [4.7점]</text>
    <text x="398" y="140" font-size="14">[키포인트] 함수값과 도함수값 조건으로</text>
    <text x="398" y="162" font-size="14">삼차함수의 계수를 정한 뒤 접선 조건을</text>
    <text x="398" y="184" font-size="14">적용한다. 조건 정리: f(x)=Ax^3+Bx^2+Cx+D,</text>
    <text x="398" y="206" font-size="14">a≠0,1, f(0)=f(1)=f(a), f'(0)=f'(a)이고</text>
    <text x="398" y="228" font-size="14">f'의 최댓값은 1이다. 풀이 방향: 먼저 a와</text>
    <text x="398" y="250" font-size="14">A,B,C 사이의 관계를 구하고, f'의 최댓값 및</text>
    <text x="398" y="272" font-size="14">접선의 y절편으로 남은 상수항을 정한다. 정석</text>
    <text x="398" y="294" font-size="14">풀이: f(0)=f(1)에서 A+B+C=0이다. 또</text>
    <text x="398" y="316" font-size="14">f'(0)=f'(a)에서 a(3Aa+2B)=0이고 a≠0이므로</text>
    <text x="398" y="338" font-size="14">B=-3Aa / 2이다. f(a)=f(0)을 이용하면 A</text>
    <text x="398" y="360" font-size="14">a^2+B a+C=0이고 C=-A-B이므로</text>
    <text x="398" y="382" font-size="14">A(a-1)(a-2)=0을 얻는다. A≠0, a≠1이므로</text>
    <text x="398" y="404" font-size="14">a=2이다. 따라서 B=-3A, C=2A이고</text>
    <text x="398" y="426" font-size="14">f'(x)=A(3x^2-6x+2)이다. f'가 최댓값을</text>
    <text x="398" y="448" font-size="14">가지려면 A&lt;0이어야 하며, 꼭짓점 x=1에서</text>
    <text x="398" y="470" font-size="14">f'(1)=-A=1이므로 A=-1이다. 따라서</text>
    <text x="398" y="492" font-size="14">f(x)=-x^3+3x^2-2x+D이다. (1,f(1))에서</text>
    <text x="398" y="514" font-size="14">접선의 y절편이 6이므로 f(1)-f'(1)=6이다.</text>
    <text x="398" y="536" font-size="14">f'(1)=1, f(1)=D이므로 D=7이다.</text>
    <text x="398" y="558" font-size="14">f(3)=-27+27-6+7=1이므로 따라서 정답은</text>
    <text x="398" y="580" font-size="14">①이다.</text>
    <rect x="18" y="632" width="724" height="48" rx="10" fill="#fff7ed" stroke="#fdba74"/>
    <text x="380" y="662" font-size="17" text-anchor="middle" fill="#9a3412">결론: ①</text>
    <text x="380" y="708" font-size="11" text-anchor="middle" fill="#64748b">25_제일고_2학기_기말_고2_수학II · q15 · source-bound solution visual</text>
  </g>
</svg>