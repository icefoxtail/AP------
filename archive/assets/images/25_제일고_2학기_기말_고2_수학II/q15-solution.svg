<svg xmlns="http://www.w3.org/2000/svg" width="760" height="620" viewBox="0 0 760 620" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet">
  <title id="title">25_제일고_2학기_기말_고2_수학II · q15 해설 시각화</title>
  <desc id="desc">문항 15의 원문과 해설 흐름을 source-bound 텍스트 카드로 정리한 SVG</desc>
  <rect width="760" height="620" fill="#fff"/>
  <g font-family="Noto Sans KR, Pretendard, Apple SD Gothic Neo, Malgun Gothic, sans-serif" fill="#111">
    <text x="380" y="32" font-size="21" font-weight="700" text-anchor="middle">25_제일고_2학기_기말_고2_수학II · q15 해설 시각화</text>
    <text x="380" y="59" font-size="15" text-anchor="middle" fill="#475569">문항 원문과 해설의 핵심 흐름</text>
    <rect x="18" y="82" width="350" height="328" rx="12" fill="#eff6ff" stroke="#93c5fd"/>
    <rect x="390" y="82" width="352" height="328" rx="12" fill="#f0fdf4" stroke="#86efac"/>
    <text x="34" y="112" font-size="17" font-weight="700" fill="#1d4ed8">문항 핵심</text>
    <text x="398" y="112" font-size="17" font-weight="700" fill="#15803d">해설 흐름</text>
    <text x="34" y="140" font-size="15">삼차함수 f(x)와 상수 a (a≠0,1)에 대하여 f(0)=f(1)=f(a),</text>
    <text x="34" y="162" font-size="15">f'(0)=f'(a)를 만족시키고, 함수 f'(x)의 최댓값이 1이며,</text>
    <text x="34" y="184" font-size="15">(1,f(1))에서 접선의 y절편이 6일 때, f(3)의 값은? [4.7점]</text>
    <text x="398" y="140" font-size="14">[키포인트] 함수값과 도함수값 조건으로 삼차함수의 계수를 정한 뒤 접선</text>
    <text x="398" y="162" font-size="14">조건을 적용한다. 조건 정리: f(x)=Ax^3+Bx^2+Cx+D, a≠0,1,</text>
    <text x="398" y="184" font-size="14">f(0)=f(1)=f(a), f'(0)=f'(a)이고 f'의 최댓값은 1이다. 풀이 방향: 먼저</text>
    <text x="398" y="206" font-size="14">a와 A,B,C 사이의 관계를 구하고, f'의 최댓값 및 접선의 y절편으로 남은</text>
    <text x="398" y="228" font-size="14">상수항을 정한다. 정석 풀이: f(0)=f(1)에서 A+B+C=0이다. 또</text>
    <text x="398" y="250" font-size="14">f'(0)=f'(a)에서 a(3Aa+2B)=0이고 a≠0이므로 B=-3Aa / 2이다.</text>
    <text x="398" y="272" font-size="14">f(a)=f(0)을 이용하면 A a^2+B a+C=0이고 C=-A-B이므로</text>
    <text x="398" y="294" font-size="14">A(a-1)(a-2)=0을 얻는다. A≠0, a≠1이므로 a=2이다. 따라서 B=-3A,</text>
    <text x="398" y="316" font-size="14">C=2A이고 f'(x)=A(3x^2-6x+2)이다. f'가 최댓값을 가지려면 A&lt;0이어야</text>
    <text x="398" y="338" font-size="14">하며, 꼭짓점 x=1에서 f'(1)=-A=1이므로 A=-1이다. 따라서</text>
    <text x="398" y="360" font-size="14">f(x)=-x^3+3x^2-2x+D이다. (1,f(1))에서 접선의 y절편이 6이므로</text>
    <text x="398" y="382" font-size="14">f(1)-f'(1)=6이다. f'(1)=1, f(1)=D이므로 D=7이다.</text>
    <text x="398" y="404" font-size="14">f(3)=-27+27-6+7=1이므로 따라서 정답은 ①이다.</text>
    <path d="M350 342 L410 342" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="18" y="378" width="724" height="48" rx="10" fill="#fff7ed" stroke="#fdba74"/>
    <text x="380" y="408" font-size="17" text-anchor="middle" fill="#9a3412">결론: ①</text>
    <text x="380" y="480" font-size="11" text-anchor="middle" fill="#64748b">25_제일고_2학기_기말_고2_수학II · q15 · source-bound solution visual</text>
  </g>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#64748b"/></marker></defs>
</svg>