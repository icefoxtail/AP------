<svg xmlns="http://www.w3.org/2000/svg" width="760" height="620" viewBox="0 0 760 620" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet">
  <title id="title">25_제일고_2학기_기말_고2_수학II · q2 해설 시각화</title>
  <desc id="desc">문항 2의 원문과 해설 흐름을 source-bound 텍스트 카드로 정리한 SVG</desc>
  <rect width="760" height="620" fill="#fff"/>
  <g font-family="Noto Sans KR, Pretendard, Apple SD Gothic Neo, Malgun Gothic, sans-serif" fill="#111">
    <text x="380" y="32" font-size="21" font-weight="700" text-anchor="middle">25_제일고_2학기_기말_고2_수학II · q2 해설 시각화</text>
    <text x="380" y="59" font-size="15" text-anchor="middle" fill="#475569">문항 원문과 해설의 핵심 흐름</text>
    <rect x="18" y="82" width="350" height="306" rx="12" fill="#eff6ff" stroke="#93c5fd"/>
    <rect x="390" y="82" width="352" height="306" rx="12" fill="#f0fdf4" stroke="#86efac"/>
    <text x="34" y="112" font-size="17" font-weight="700" fill="#1d4ed8">문항 핵심</text>
    <text x="398" y="112" font-size="17" font-weight="700" fill="#15803d">해설 흐름</text>
    <text x="34" y="140" font-size="15">함수 f(x)=x^3+6x^2+9x+1이 감소하는</text>
    <text x="34" y="162" font-size="15">구간이 [a,b]일 때, b-a의 값은? [3.6점]</text>
    <text x="398" y="140" font-size="14">[키포인트] 도함수의 부호로 함수가 감소하는</text>
    <text x="398" y="162" font-size="14">구간을 찾는다. 조건 정리:</text>
    <text x="398" y="184" font-size="14">f(x)=x^3+6x^2+9x+1이고 f'(x)가 음수인</text>
    <text x="398" y="206" font-size="14">구간을 구해야 한다. 풀이 방향: f'(x)를</text>
    <text x="398" y="228" font-size="14">인수분해한 뒤 두 영점 사이에서 부호를</text>
    <text x="398" y="250" font-size="14">확인한다. 정석 풀이:</text>
    <text x="398" y="272" font-size="14">f'(x)=3x^2+12x+9=3(x+1)(x+3)이다. x&lt;-3</text>
    <text x="398" y="294" font-size="14">또는 x&gt;-1에서는 f'(x)&gt;0이고, -3&lt;</text>
    <text x="398" y="316" font-size="14">x&lt;-1에서는 f'(x)&lt;0이다. 따라서 감소 구간의</text>
    <text x="398" y="338" font-size="14">양 끝은 a=-3, b=-1이다.</text>
    <text x="398" y="360" font-size="14">b-a=(-1)-(-3)=2이므로 따라서 정답은 ①이다.</text>
    <rect x="18" y="412" width="724" height="48" rx="10" fill="#fff7ed" stroke="#fdba74"/>
    <text x="380" y="442" font-size="17" text-anchor="middle" fill="#9a3412">결론: ①</text>
    <text x="380" y="488" font-size="11" text-anchor="middle" fill="#64748b">25_제일고_2학기_기말_고2_수학II · q2 · source-bound solution visual</text>
  </g>
</svg>