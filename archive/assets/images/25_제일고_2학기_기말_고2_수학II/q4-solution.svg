<svg xmlns="http://www.w3.org/2000/svg" width="760" height="620" viewBox="0 0 760 620" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet">
  <title id="title">25_제일고_2학기_기말_고2_수학II · q4 해설 시각화</title>
  <desc id="desc">문항 4의 원문과 해설 흐름을 source-bound 텍스트 카드로 정리한 SVG</desc>
  <rect width="760" height="620" fill="#fff"/>
  <g font-family="Noto Sans KR, Pretendard, Apple SD Gothic Neo, Malgun Gothic, sans-serif" fill="#111">
    <text x="380" y="32" font-size="21" font-weight="700" text-anchor="middle">25_제일고_2학기_기말_고2_수학II · q4 해설 시각화</text>
    <text x="380" y="59" font-size="15" text-anchor="middle" fill="#475569">문항 원문과 해설의 핵심 흐름</text>
    <rect x="18" y="82" width="350" height="394" rx="12" fill="#eff6ff" stroke="#93c5fd"/>
    <rect x="390" y="82" width="352" height="394" rx="12" fill="#f0fdf4" stroke="#86efac"/>
    <text x="34" y="112" font-size="17" font-weight="700" fill="#1d4ed8">문항 핵심</text>
    <text x="398" y="112" font-size="17" font-weight="700" fill="#15803d">해설 흐름</text>
    <text x="34" y="140" font-size="15">방정식 3x^4+4x^3-12x^2=a의 서로 다른</text>
    <text x="34" y="162" font-size="15">실근의 개수가 4일 때, 정수 a의 개수는?</text>
    <text x="34" y="184" font-size="15">[3.8점]</text>
    <text x="398" y="140" font-size="14">[키포인트] 도함수의 부호표와 극값을 이용하여</text>
    <text x="398" y="162" font-size="14">수평선과 그래프의 교점 개수를 판단한다. 조건</text>
    <text x="398" y="184" font-size="14">정리: h(x)=3x^4+4x^3-12x^2라 하고 방정식은</text>
    <text x="398" y="206" font-size="14">h(x)=a이다. 풀이 방향: h'(x)=0인 점에서의</text>
    <text x="398" y="228" font-size="14">함수값을 구한 뒤, 수평선 y=a가 네 구간에서</text>
    <text x="398" y="250" font-size="14">각각 한 번씩 만나는 범위를 찾는다. 정석 풀이:</text>
    <text x="398" y="272" font-size="14">h'(x)=12x(x+2)(x-1)이므로 임계점은</text>
    <text x="398" y="294" font-size="14">x=-2,0,1이다. 함수값은 h(-2)=-32, h(0)=0,</text>
    <text x="398" y="316" font-size="14">h(1)=-5이다. 도함수의 부호는 차례로</text>
    <text x="398" y="338" font-size="14">-,+,-,+이므로 x=-2와 x=1에서 극소, x=0에서</text>
    <text x="398" y="360" font-size="14">극대이다. 수평선 y=a가 네 구간에서 모두</text>
    <text x="398" y="382" font-size="14">교차하려면 두 번째 극솟값보다 높고 극댓값보다</text>
    <text x="398" y="404" font-size="14">낮아야 하므로 -5&lt; a&lt;0이다. 이 범위의 정수는</text>
    <text x="398" y="426" font-size="14">-4,-3,-2,-1 네 개이므로 따라서 정답은</text>
    <text x="398" y="448" font-size="14">④이다.</text>
    <rect x="18" y="500" width="724" height="48" rx="10" fill="#fff7ed" stroke="#fdba74"/>
    <text x="380" y="530" font-size="17" text-anchor="middle" fill="#9a3412">결론: ④</text>
    <text x="380" y="576" font-size="11" text-anchor="middle" fill="#64748b">25_제일고_2학기_기말_고2_수학II · q4 · source-bound solution visual</text>
  </g>
</svg>