<svg xmlns="http://www.w3.org/2000/svg" width="760" height="620" viewBox="0 0 760 620" role="img" aria-labelledby="title desc">
  <title id="title">25_제일고_2학기_기말_고2_수학II · q16 해설 시각화</title>
  <desc id="desc">문항 16의 원문과 해설 흐름을 source-bound 텍스트 카드로 정리한 SVG</desc>
  <rect width="760" height="620" fill="#fff"/>
  <g font-family="Arial, sans-serif" fill="#111">
    <text x="380" y="32" font-size="21" font-weight="700" text-anchor="middle">25_제일고_2학기_기말_고2_수학II · q16 해설 시각화</text>
    <text x="380" y="59" font-size="15" text-anchor="middle" fill="#475569">도함수의 활용 · 닫힌구간의 최댓값과 최솟값</text>
    <rect x="18" y="82" width="350" height="350" rx="12" fill="#eff6ff" stroke="#93c5fd"/>
    <rect x="390" y="82" width="352" height="350" rx="12" fill="#f0fdf4" stroke="#86efac"/>
    <text x="34" y="112" font-size="17" font-weight="700" fill="#1d4ed8">문항 핵심</text>
    <text x="398" y="112" font-size="17" font-weight="700" fill="#15803d">해설 흐름</text>
    <text x="34" y="140" font-size="15">닫힌 구간 [1,t]에서 함수 f(x)=2x^3-9x^2+12x의 최댓값이 5, 최솟값이 </text>
    <text x="34" y="162" font-size="15">4가 되도록 하는 실수 t의 최댓값과 최솟값을 각각 a, b라 하자. ab의 값은? (단,</text>
    <text x="34" y="184" font-size="15"> t&gt;1) [4.7점]</text>
    <text x="398" y="140" font-size="14">[키포인트] 도함수의 부호로 구간의 최댓값·최솟값을 정하고, 끝점 조건을 함께 적용한다. </text>
    <text x="398" y="162" font-size="14">조건 정리: f(x)=2x^3-9x^2+12x, t&gt;1이고 [1,t]에서 최댓값은 5, 최</text>
    <text x="398" y="184" font-size="14">솟값은 4이다. 풀이 방향: 임계점과 함수값을 구한 뒤, t의 위치에 따라 구간에서 최댓값</text>
    <text x="398" y="206" font-size="14">과 최솟값이 어떻게 정해지는지 조사한다. 정석 풀이: f'(x)=6x^2-18x+12=6(</text>
    <text x="398" y="228" font-size="14">x-1)(x-2)이다. 따라서 f는 1&lt; x&lt;2에서 감소하고 x&gt;2에서 증가한다. f(1)</text>
    <text x="398" y="250" font-size="14">=5, f(2)=4이므로 최솟값이 4가 되려면 t\ge2이어야 한다. t\ge2에서 최댓값</text>
    <text x="398" y="272" font-size="14">이 5가 되려면 f(t)\le5이어야 한다. 그런데 f(t)-5=(t-1)^2(2t-5)이</text>
    <text x="398" y="294" font-size="14">므로 t\ge2에서 f(t)\le5인 범위는 2\le t\le52이다. 따라서 a=52, </text>
    <text x="398" y="316" font-size="14">b=2이고 ab=5이다. 따라서 정답은 ①이다.</text>
    <path d="M350 396 L410 396" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="18" y="418" width="724" height="48" rx="10" fill="#fff7ed" stroke="#fdba74"/>
    <text x="380" y="448" font-size="17" text-anchor="middle" fill="#9a3412">정답/결론: ①</text>
    <text x="380" y="493" font-size="13" text-anchor="middle" fill="#64748b">source: archive/exams/original/high/h2/2final/25_제일고_2학기_기말_고2_수학II.js · q16 · archive/assets/images/25_제일고_2학기_기말_고2_수학II/q16-solution.svg</text>
  </g>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#64748b"/></marker></defs>
</svg>