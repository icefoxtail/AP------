<svg xmlns="http://www.w3.org/2000/svg" width="760" height="620" viewBox="0 0 760 620" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet">
  <title id="title">25_제일고_2학기_기말_고2_수학II · q16 해설 시각화</title>
  <desc id="desc">문항 16의 원문과 해설 흐름을 source-bound 텍스트 카드로 정리한 SVG</desc>
  <rect width="760" height="620" fill="#fff"/>
  <g font-family="Noto Sans KR, Pretendard, Apple SD Gothic Neo, Malgun Gothic, sans-serif" fill="#111">
    <text x="380" y="32" font-size="21" font-weight="700" text-anchor="middle">25_제일고_2학기_기말_고2_수학II · q16 해설 시각화</text>
    <text x="380" y="59" font-size="15" text-anchor="middle" fill="#475569">문항 원문과 해설의 핵심 흐름</text>
    <rect x="18" y="82" width="350" height="394" rx="12" fill="#eff6ff" stroke="#93c5fd"/>
    <rect x="390" y="82" width="352" height="394" rx="12" fill="#f0fdf4" stroke="#86efac"/>
    <text x="34" y="112" font-size="17" font-weight="700" fill="#1d4ed8">문항 핵심</text>
    <text x="398" y="112" font-size="17" font-weight="700" fill="#15803d">해설 흐름</text>
    <text x="34" y="140" font-size="15">닫힌 구간 [1,t]에서 함수</text>
    <text x="34" y="162" font-size="15">f(x)=2x^3-9x^2+12x의 최댓값이 5,</text>
    <text x="34" y="184" font-size="15">최솟값이 4가 되도록 하는 실수 t의 최댓값과</text>
    <text x="34" y="206" font-size="15">최솟값을 각각 a, b라 하자. ab의 값은? (단,</text>
    <text x="34" y="228" font-size="15">t&gt;1) [4.7점]</text>
    <text x="398" y="140" font-size="14">[키포인트] 도함수의 부호로 구간의</text>
    <text x="398" y="162" font-size="14">최댓값·최솟값을 정하고, 끝점 조건을 함께</text>
    <text x="398" y="184" font-size="14">적용한다. 조건 정리: f(x)=2x^3-9x^2+12x,</text>
    <text x="398" y="206" font-size="14">t&gt;1이고 [1,t]에서 최댓값은 5, 최솟값은</text>
    <text x="398" y="228" font-size="14">4이다. 풀이 방향: 임계점과 함수값을 구한 뒤,</text>
    <text x="398" y="250" font-size="14">t의 위치에 따라 구간에서 최댓값과 최솟값이</text>
    <text x="398" y="272" font-size="14">어떻게 정해지는지 조사한다. 정석 풀이:</text>
    <text x="398" y="294" font-size="14">f'(x)=6x^2-18x+12=6(x-1)(x-2)이다.</text>
    <text x="398" y="316" font-size="14">따라서 f는 1&lt; x&lt;2에서 감소하고 x&gt;2에서</text>
    <text x="398" y="338" font-size="14">증가한다. f(1)=5, f(2)=4이므로 최솟값이 4가</text>
    <text x="398" y="360" font-size="14">되려면 t≥2이어야 한다. t≥2에서 최댓값이 5가</text>
    <text x="398" y="382" font-size="14">되려면 f(t)≤5이어야 한다. 그런데</text>
    <text x="398" y="404" font-size="14">f(t)-5=(t-1)^2(2t-5)이므로 t≥2에서</text>
    <text x="398" y="426" font-size="14">f(t)≤5인 범위는 2≤ t≤5 / 2이다. 따라서 a=5 /</text>
    <text x="398" y="448" font-size="14">2, b=2이고 ab=5이다. 따라서 정답은 ①이다.</text>
    <rect x="18" y="500" width="724" height="48" rx="10" fill="#fff7ed" stroke="#fdba74"/>
    <text x="380" y="530" font-size="17" text-anchor="middle" fill="#9a3412">결론: ①</text>
    <text x="380" y="576" font-size="11" text-anchor="middle" fill="#64748b">25_제일고_2학기_기말_고2_수학II · q16 · source-bound solution visual</text>
  </g>
</svg>