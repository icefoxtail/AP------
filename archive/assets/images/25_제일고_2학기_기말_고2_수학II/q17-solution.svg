<svg xmlns="http://www.w3.org/2000/svg" width="760" height="620" viewBox="0 0 760 620" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet">
  <title id="title">25_제일고_2학기_기말_고2_수학II · q17 해설 시각화</title>
  <desc id="desc">문항 17의 원문과 해설 흐름을 source-bound 텍스트 카드로 정리한 SVG</desc>
  <rect width="760" height="620" fill="#fff"/>
  <g font-family="Noto Sans KR, Pretendard, Apple SD Gothic Neo, Malgun Gothic, sans-serif" fill="#111">
    <text x="380" y="32" font-size="21" font-weight="700" text-anchor="middle">25_제일고_2학기_기말_고2_수학II · q17 해설 시각화</text>
    <text x="380" y="59" font-size="15" text-anchor="middle" fill="#475569">문항 원문과 해설의 핵심 흐름</text>
    <rect x="18" y="82" width="350" height="300" rx="12" fill="#eff6ff" stroke="#93c5fd"/>
    <rect x="390" y="82" width="352" height="300" rx="12" fill="#f0fdf4" stroke="#86efac"/>
    <text x="34" y="112" font-size="17" font-weight="700" fill="#1d4ed8">문항 핵심</text>
    <text x="398" y="112" font-size="17" font-weight="700" fill="#15803d">해설 흐름</text>
    <text x="34" y="140" font-size="15">정의역이 {xmid0&lt; x&lt;3}인 함수 f(x)=∫[0, 3](x-t)|x-t|dt에 대하여</text>
    <text x="34" y="162" font-size="15">함수 f'(x)의 극솟값은? [4.7점]</text>
    <text x="398" y="140" font-size="14">[키포인트] 절댓값의 부호가 바뀌는 t=x에서 적분구간을 나눈 뒤, 먼저</text>
    <text x="398" y="162" font-size="14">f(x)를 구하고 미분한다. 조건 정리: 정의역은 0&lt; x&lt;3이고 f(x)=∫[0,</text>
    <text x="398" y="184" font-size="14">3](x-t)|x-t|dt이다. 풀이 방향: 0≤ t≤ x에서는 |x-t|=x-t, x≤</text>
    <text x="398" y="206" font-size="14">t≤3에서는 |x-t|=t-x임을 이용한다. 정석 풀이: f(x)=∫[0,</text>
    <text x="398" y="228" font-size="14">x](x-t)^2dt-∫[x, 3](t-x)^2dt=x^3 / 3-(3-x)^3 / 3이다. 따라서</text>
    <text x="398" y="250" font-size="14">f'(x)=x^2+(3-x)^2=2x^2-6x+9=2(x-3 / 2)^2+9 / 2이다. 그러므로 x=3</text>
    <text x="398" y="272" font-size="14">/ 2에서 f'(x)의 극솟값은 9 / 2이다. 따라서 정답은 ④이다.</text>
    <path d="M350 314 L410 314" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="18" y="350" width="724" height="48" rx="10" fill="#fff7ed" stroke="#fdba74"/>
    <text x="380" y="380" font-size="17" text-anchor="middle" fill="#9a3412">결론: ④</text>
    <text x="380" y="452" font-size="11" text-anchor="middle" fill="#64748b">25_제일고_2학기_기말_고2_수학II · q17 · source-bound solution visual</text>
  </g>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#64748b"/></marker></defs>
</svg>