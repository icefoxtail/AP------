<svg xmlns="http://www.w3.org/2000/svg" width="760" height="620" viewBox="0 0 760 620" role="img" aria-labelledby="title desc">
  <title id="title">25_제일고_2학기_기말_고2_수학II · q10 해설 시각화</title>
  <desc id="desc">문항 10의 원문과 해설 흐름을 source-bound 텍스트 카드로 정리한 SVG</desc>
  <rect width="760" height="620" fill="#fff"/>
  <g font-family="Arial, sans-serif" fill="#111">
    <text x="380" y="32" font-size="21" font-weight="700" text-anchor="middle">25_제일고_2학기_기말_고2_수학II · q10 해설 시각화</text>
    <text x="380" y="59" font-size="15" text-anchor="middle" fill="#475569">도함수의 활용 · 상자의 부피의 최댓값</text>
    <rect x="18" y="82" width="350" height="350" rx="12" fill="#eff6ff" stroke="#93c5fd"/>
    <rect x="390" y="82" width="352" height="350" rx="12" fill="#f0fdf4" stroke="#86efac"/>
    <text x="34" y="112" font-size="17" font-weight="700" fill="#1d4ed8">문항 핵심</text>
    <text x="398" y="112" font-size="17" font-weight="700" fill="#15803d">해설 흐름</text>
    <text x="34" y="140" font-size="15">한 변의 길이가 6인 정사각형 모양의 두꺼운 종이의 네 귀퉁이에서 같은 크기의 정사각형을 </text>
    <text x="34" y="162" font-size="15">잘라내고, 나머지 부분을 접어서 뚜껑이 없는 직육면체 모양의 상자를 만들려고 한다. 이 상</text>
    <text x="34" y="184" font-size="15">자의 부피의 최댓값은? [4.4점]</text>
    <text x="398" y="140" font-size="14">[키포인트] 상자의 부피를 잘라내는 정사각형의 한 변으로 나타내고 도함수로 최댓값을 찾는다</text>
    <text x="398" y="162" font-size="14">. 조건 정리: 잘라내는 정사각형의 한 변을 x라 하면 0&lt; x&lt;3이다. 풀이 방향: 상자</text>
    <text x="398" y="184" font-size="14">의 높이는 x, 밑면의 두 변의 길이는 각각 6-2x이므로 부피함수를 세운다. 정석 풀이:</text>
    <text x="398" y="206" font-size="14"> V(x)=x(6-2x)^2이고 V'(x)=(6-2x)(6-6x)=12(3-x)(1-x)이</text>
    <text x="398" y="228" font-size="14">다. 0&lt; x&lt;1에서 V'(x)&gt;0, 1&lt; x&lt;3에서 V'(x)&lt;0이므로 x=1에서 최댓값</text>
    <text x="398" y="250" font-size="14">을 갖는다. V(1)=1×4^2=16이므로 따라서 정답은 ③이다.</text>
    <path d="M350 330 L410 330" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="18" y="352" width="724" height="48" rx="10" fill="#fff7ed" stroke="#fdba74"/>
    <text x="380" y="382" font-size="17" text-anchor="middle" fill="#9a3412">정답/결론: ③</text>
    <text x="380" y="427" font-size="13" text-anchor="middle" fill="#64748b">source: archive/exams/original/high/h2/2final/25_제일고_2학기_기말_고2_수학II.js · q10 · archive/assets/images/25_제일고_2학기_기말_고2_수학II/q10-solution.svg</text>
  </g>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#64748b"/></marker></defs>
</svg>