<svg xmlns="http://www.w3.org/2000/svg" width="760" height="620" viewBox="0 0 760 620" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet">
  <title id="title">25_제일고_2학기_기말_고2_수학II · q8 해설 시각화</title>
  <desc id="desc">문항 8의 원문과 해설 흐름을 source-bound 텍스트 카드로 정리한 SVG</desc>
  <rect width="760" height="620" fill="#fff"/>
  <g font-family="Noto Sans KR, Pretendard, Apple SD Gothic Neo, Malgun Gothic, sans-serif" fill="#111">
    <text x="380" y="32" font-size="21" font-weight="700" text-anchor="middle">25_제일고_2학기_기말_고2_수학II · q8 해설 시각화</text>
    <text x="380" y="59" font-size="15" text-anchor="middle" fill="#475569">도함수의 활용 · 극댓값과 극솟값</text>
    <rect x="18" y="82" width="350" height="350" rx="12" fill="#eff6ff" stroke="#93c5fd"/>
    <rect x="390" y="82" width="352" height="350" rx="12" fill="#f0fdf4" stroke="#86efac"/>
    <text x="34" y="112" font-size="17" font-weight="700" fill="#1d4ed8">문항 핵심</text>
    <text x="398" y="112" font-size="17" font-weight="700" fill="#15803d">해설 흐름</text>
    <text x="34" y="140" font-size="15">함수 f(x)=-x^3+ax^2+a^2x-1이 -1&lt; x&lt;1에서 극솟값, x&gt;1에서 극댓값</text>
    <text x="34" y="162" font-size="15">을 갖도록 하는 실수 a의 값의 범위가 n&lt; a&lt; m일 때, nm의 값은? [4.2점]</text>
    <text x="398" y="140" font-size="14">[키포인트] 도함수의 두 근이 극솟값과 극댓값을 만드는 순서를 확인하여 매개변수의 범위를 </text>
    <text x="398" y="162" font-size="14">정한다. 조건 정리: f'(x)=-3x^2+2ax+a^2=-(3x+a)(x-a)이고, -1</text>
    <text x="398" y="184" font-size="14">&lt; x&lt;1에서 극솟값, x&gt;1에서 극댓값을 가져야 한다. 풀이 방향: 최고차항 계수가 음수</text>
    <text x="398" y="206" font-size="14">인 f'의 작은 근에서 극솟값, 큰 근에서 극댓값이 생긴다는 점을 이용한다. 정석 풀이: </text>
    <text x="398" y="228" font-size="14">a&gt;0이면 두 근의 순서는 - a3&lt; a이다. 따라서 -1&lt;- a3&lt;1이고 a&gt;1이어야 하</text>
    <text x="398" y="250" font-size="14">므로 1&lt; a&lt;3이다. a&lt;0이면 작은 근이 a이고 큰 근이 - a3인데, 작은 근이 (-</text>
    <text x="398" y="272" font-size="14">1,1)에 있으려면 -1&lt; a&lt;0이다. 이때 - a3&lt;13&lt;1이어서 큰 근이 1보다 클 수</text>
    <text x="398" y="294" font-size="14"> 없다. 따라서 a&lt;0인 경우는 불가능하고, 전체 조건은 1&lt; a&lt;3이다. 그러므로 n=1</text>
    <text x="398" y="316" font-size="14">, m=3이고 nm=3이다. 따라서 정답은 ③이다.</text>
    <path d="M350 396 L410 396" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="18" y="418" width="724" height="48" rx="10" fill="#fff7ed" stroke="#fdba74"/>
    <text x="380" y="448" font-size="17" text-anchor="middle" fill="#9a3412">결론: ③</text>
    <text x="380" y="493" font-size="13" text-anchor="middle" fill="#64748b">source: archive/exams/original/high/h2/2final/25_제일고_2학기_기말_고2_수학II.js · q8 · archive/assets/images/25_제일고_2학기_기말_고2_수학II/q8-solution.svg</text>
  </g>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#64748b"/></marker></defs>
</svg>