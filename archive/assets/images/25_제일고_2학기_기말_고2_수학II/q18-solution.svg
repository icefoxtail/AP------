<svg xmlns="http://www.w3.org/2000/svg" width="760" height="620" viewBox="0 0 760 620" role="img" aria-labelledby="title desc">
  <title id="title">25_제일고_2학기_기말_고2_수학II · q18 해설 시각화</title>
  <desc id="desc">문항 18의 원문과 해설 흐름을 source-bound 텍스트 카드로 정리한 SVG</desc>
  <rect width="760" height="620" fill="#fff"/>
  <g font-family="Arial, sans-serif" fill="#111">
    <text x="380" y="32" font-size="21" font-weight="700" text-anchor="middle">25_제일고_2학기_기말_고2_수학II · q18 해설 시각화</text>
    <text x="380" y="59" font-size="15" text-anchor="middle" fill="#475569">도함수의 활용 · 사차함수의 극값</text>
    <rect x="18" y="82" width="350" height="350" rx="12" fill="#eff6ff" stroke="#93c5fd"/>
    <rect x="390" y="82" width="352" height="350" rx="12" fill="#f0fdf4" stroke="#86efac"/>
    <text x="34" y="112" font-size="17" font-weight="700" fill="#1d4ed8">문항 핵심</text>
    <text x="398" y="112" font-size="17" font-weight="700" fill="#15803d">해설 흐름</text>
    <text x="34" y="140" font-size="15">서로 다른 두 정수 a, b (a&lt; b)에 대하여 사차함수 f(x)=(x-a)^3(x-b)</text>
    <text x="34" y="162" font-size="15">+3이 x=3에서 극솟값을 가질 때, f'(x)=0을 만족시키는 서로 다른 모든 근의 합의</text>
    <text x="34" y="184" font-size="15"> 최댓값은? [4.9점]</text>
    <text x="398" y="140" font-size="14">[키포인트] 도함수의 중근과 단순근을 구분하여 극솟값의 위치를 정하고, 정수 조건을 적용한</text>
    <text x="398" y="162" font-size="14">다. 조건 정리: f(x)=(x-a)^3(x-b)+3, a&lt; b인 서로 다른 정수이고 x=</text>
    <text x="398" y="184" font-size="14">3에서 극솟값을 갖는다. 풀이 방향: f'(x)=0의 근과 부호 변화를 조사한 뒤, 극솟값</text>
    <text x="398" y="206" font-size="14">의 위치 조건으로 a,b의 관계를 구한다. 정석 풀이: f'(x)=(x-a)^2(4x-a-</text>
    <text x="398" y="228" font-size="14">3b)이다. x=a는 제곱인수로 인해 부호가 바뀌지 않으므로 극값을 만들지 않는다. 다른 </text>
    <text x="398" y="250" font-size="14">근 r=a+3b4에서는 부호가 바뀌어 극솟값이 생긴다. 따라서 r=3이므로 a+3b=12이</text>
    <text x="398" y="272" font-size="14">다. a=12-3b이고 a&lt; b이므로 12-3b&lt; b, 즉 b&gt;3이다. 따라서 정수 b의 </text>
    <text x="398" y="294" font-size="14">최솟값은 4이고, f'(x)=0의 서로 다른 근은 a와 3이다. 그 합은 a+3=15-3b</text>
    <text x="398" y="316" font-size="14">이므로 b=4일 때 최댓값 3을 갖는다. 따라서 정답은 ⑤이다.</text>
    <path d="M350 396 L410 396" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="18" y="418" width="724" height="48" rx="10" fill="#fff7ed" stroke="#fdba74"/>
    <text x="380" y="448" font-size="17" text-anchor="middle" fill="#9a3412">정답/결론: ⑤</text>
    <text x="380" y="493" font-size="13" text-anchor="middle" fill="#64748b">source: archive/exams/original/high/h2/2final/25_제일고_2학기_기말_고2_수학II.js · q18 · archive/assets/images/25_제일고_2학기_기말_고2_수학II/q18-solution.svg</text>
  </g>
