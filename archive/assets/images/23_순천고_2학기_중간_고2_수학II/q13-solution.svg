<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc">
  <title id="title">23 순천고 13번 두 곡선의 접선 조건 해설</title>
  <desc id="desc">점 (2,−4)에서의 접선 y=−6x+8과 두 번째 삼차곡선의 접점 후보를 비교한다</desc>
  <style>.background{fill:#fff}.axis{stroke:#171717;stroke-width:1.4;fill:none;stroke-linecap:round;stroke-linejoin:round}.curve{stroke:#111;stroke-width:2.1;fill:none;stroke-linecap:round;stroke-linejoin:round}.tangent{stroke:#3f4a5a;stroke-width:1.7;fill:none;stroke-linecap:round;stroke-linejoin:round}.guide{stroke:#777;stroke-width:.95;stroke-dasharray:4 4;fill:none}.point{stroke:#111;stroke-width:1;fill:#111}.panel{fill:#f7f8fa;stroke:#c7cbd1;stroke-width:1}.title{font-family:"Noto Sans KR","Pretendard","Malgun Gothic",sans-serif;font-size:15px;font-weight:700;fill:#111}.label{font-family:"Noto Sans KR","Pretendard","Malgun Gothic",sans-serif;font-size:12px;fill:#222}.small{font-family:"Noto Sans KR","Pretendard","Malgun Gothic",sans-serif;font-size:11px;fill:#333}.math{font-family:"STIX Two Math","Cambria Math","Times New Roman",serif;font-size:13px;fill:#111}</style>
  <defs><marker id="axis-arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L6,3 L0,6 Z" fill="#171717"/></marker></defs>
  <rect class="background" x="0" y="0" width="640" height="420"/><text class="title" x="32" y="28">q13  접선의 기울기와 함숫값을 동시에 맞추기</text><text class="small" x="32" y="47">첫 곡선의 접선을 구한 뒤, 두 번째 곡선에서 같은 접선이 되는 접점을 찾는다.</text>
  <g aria-label="tangent diagram"><rect class="panel" x="32" y="65" width="330" height="270" rx="8"/><line class="axis" x1="52" y1="255" x2="340" y2="255" marker-end="url(#axis-arrow)"/><line class="axis" x1="175" y1="310" x2="175" y2="82" marker-end="url(#axis-arrow)"/><path class="curve" d="M58 125 C105 145 145 205 175 215 C215 222 260 180 330 110"/><path class="tangent" d="M70 80 L300 300"/><circle class="point" cx="255" cy="255" r="3.8"/><circle class="point" cx="105" cy="255" r="3.8"/><text class="label" x="260" y="248">x=2</text><text class="label" x="77" y="248">x=−1</text><text class="math" x="210" y="108">y=−6x+8</text><text class="math" x="300" y="260">x</text><text class="math" x="181" y="90">y</text></g>
  <g aria-label="candidate table"><rect class="panel" x="380" y="65" width="228" height="270" rx="8"/><text class="title" x="398" y="92">접점 후보</text><text class="math" x="398" y="126">−3x²+3x=−6</text><text class="math" x="398" y="153">x=2 또는 −1</text><line class="guide" x1="398" y1="168" x2="590" y2="168"/><text class="small" x="398" y="198">x=2: k=−2</text><text class="small" x="398" y="225">x=−1: k=23/2</text><text class="math" x="398" y="260">곱 = −2×23/2=−23</text><text class="label" x="398" y="300">정답: ②</text></g>
</svg>
