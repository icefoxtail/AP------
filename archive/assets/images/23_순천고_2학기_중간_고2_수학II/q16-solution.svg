<svg xmlns="http://www.w3.org/2000/svg" width="640" height="440" viewBox="0 0 640 440" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc">
  <title id="title">23 순천고 16번 교점 개수 함수의 불연속 해설</title>
  <desc id="desc">h(x)의 그래프와 수평선의 교점 개수가 t=0,4에서 바뀌고 g의 영점이 0,4가 되는 과정을 설명한다</desc>
  <style>.background{fill:#fff}.axis{stroke:#171717;stroke-width:1.4;fill:none;stroke-linecap:round;stroke-linejoin:round}.curve{stroke:#111;stroke-width:2.1;fill:none;stroke-linecap:round;stroke-linejoin:round}.line-main{stroke:#3f4a5a;stroke-width:1.7;fill:none;stroke-linecap:round;stroke-linejoin:round}.guide{stroke:#777;stroke-width:.95;stroke-dasharray:4 4;fill:none}.point{stroke:#111;stroke-width:1;fill:#111}.panel{fill:#f7f8fa;stroke:#c7cbd1;stroke-width:1}.target{fill:#e7eef5;stroke:#55718a;stroke-width:1.1}.title{font-family:"Noto Sans KR","Pretendard","Malgun Gothic",sans-serif;font-size:15px;font-weight:700;fill:#111}.label{font-family:"Noto Sans KR","Pretendard","Malgun Gothic",sans-serif;font-size:12px;fill:#222}.small{font-family:"Noto Sans KR","Pretendard","Malgun Gothic",sans-serif;font-size:11px;fill:#333}.math{font-family:"STIX Two Math","Cambria Math","Times New Roman",serif;font-size:13px;fill:#111}</style>
  <defs><marker id="axis-arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L6,3 L0,6 Z" fill="#171717"/></marker></defs>
  <rect class="background" x="0" y="0" width="640" height="440"/><text class="title" x="32" y="28">q16  수평선 교점 개수의 변화</text><text class="small" x="32" y="47">f(t)는 h(x)=t의 실근 개수이고, 변화하는 높이에서 g를 0으로 만든다.</text>
  <g aria-label="h graph"><rect class="panel" x="32" y="65" width="330" height="230" rx="8"/><line class="axis" x1="52" y1="245" x2="345" y2="245" marker-end="url(#axis-arrow)"/><line class="axis" x1="180" y1="275" x2="180" y2="82" marker-end="url(#axis-arrow)"/><path class="curve" d="M55 120 C100 160 125 190 150 220 C175 250 200 220 220 175 C240 130 265 115 290 145 C315 175 335 210 345 230"/><line class="line-main" x1="52" y1="185" x2="345" y2="185"/><line class="line-main" x1="52" y1="125" x2="345" y2="125"/><line class="guide" x1="180" y1="185" x2="180" y2="245"/><line class="guide" x1="280" y1="125" x2="280" y2="245"/><circle class="point" cx="180" cy="185" r="3.8"/><circle class="point" cx="280" cy="125" r="3.8"/><text class="label" x="174" y="263">t=0</text><text class="label" x="274" y="263">t=4</text><text class="math" x="348" y="250">x</text><text class="math" x="186" y="90">y</text><text class="small" x="60" y="282">f(t)의 변화 높이: 0,4</text></g>
  <g aria-label="g graph"><rect class="panel" x="380" y="65" width="228" height="230" rx="8"/><text class="title" x="398" y="92">g(x)=|x−a|+b</text><line class="axis" x1="398" y1="220" x2="590" y2="220" marker-end="url(#axis-arrow)"/><path class="line-main" d="M420 125 L500 220 L580 125"/><line class="guide" x1="420" y1="220" x2="420" y2="245"/><line class="guide" x1="580" y1="220" x2="580" y2="245"/><text class="small" x="411" y="263">영점 0</text><text class="small" x="568" y="263">영점 4</text><text class="math" x="505" y="214">a=2</text><text class="math" x="505" y="244">b=−2</text><text class="label" x="398" y="285">g(−2)=2  (정답: ⑤)</text></g>
  <rect class="target" x="32" y="315" width="576" height="62" rx="8"/><text class="math" x="50" y="343">f(x)g(x) 연속 ⇒ g(0)=g(4)=0</text><text class="small" x="50" y="365">따라서 a=2, b=−2이고 a+2b=−2를 대입한다.</text>
</svg>
