<svg xmlns="http://www.w3.org/2000/svg" width="640" height="410" viewBox="0 0 640 410" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc">
  <title id="title">23 순천고 5번 세 직선의 기울기 비교</title>
  <desc id="desc">원점과 곡선 위 두 점을 잇는 두 직선, 두 점을 잇는 현의 기울기 A>B>C를 설명한다</desc>
  <style>.background{fill:#fff}.axis{stroke:#171717;stroke-width:1.4;fill:none;stroke-linecap:round;stroke-linejoin:round}.curve{stroke:#111;stroke-width:2.1;fill:none;stroke-linecap:round;stroke-linejoin:round}.sec{stroke:#3f4a5a;stroke-width:1.7;fill:none;stroke-linecap:round;stroke-linejoin:round}.guide{stroke:#777;stroke-width:.95;stroke-dasharray:4 4;fill:none}.point{stroke:#111;stroke-width:1;fill:#111}.panel{fill:#f7f8fa;stroke:#c7cbd1;stroke-width:1}.target{fill:#e7eef5;stroke:#55718a;stroke-width:1.1}.title{font-family:"Noto Sans KR","Pretendard","Malgun Gothic",sans-serif;font-size:15px;font-weight:700;fill:#111}.label{font-family:"Noto Sans KR","Pretendard","Malgun Gothic",sans-serif;font-size:12px;fill:#222}.small{font-family:"Noto Sans KR","Pretendard","Malgun Gothic",sans-serif;font-size:11px;fill:#333}.math{font-family:"STIX Two Math","Cambria Math","Times New Roman",serif;font-size:13px;fill:#111}</style>
  <defs><marker id="axis-arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L6,3 L0,6 Z" fill="#171717"/></marker></defs>
  <rect class="background" x="0" y="0" width="640" height="410"/><text class="title" x="32" y="28">q5  A, B, C는 세 할선의 기울기</text><text class="small" x="32" y="47">증가하면서 아래로 휘는 곡선에서는 원점에서 본 기울기와 현의 기울기를 비교한다.</text>
  <g aria-label="slope diagram"><rect class="panel" x="32" y="65" width="350" height="270" rx="8"/><line class="axis" x1="52" y1="275" x2="365" y2="275" marker-end="url(#axis-arrow)"/><line class="axis" x1="130" y1="315" x2="130" y2="82" marker-end="url(#axis-arrow)"/><path class="curve" d="M55 300 C85 245 120 190 165 150 C215 110 275 90 355 88"/><path class="sec" d="M130 275 L205 135"/><path class="sec" d="M130 275 L320 100"/><path class="sec" d="M205 135 L320 100"/><circle class="point" cx="205" cy="135" r="3.8"/><circle class="point" cx="320" cy="100" r="3.8"/><line class="guide" x1="205" y1="135" x2="205" y2="275"/><line class="guide" x1="320" y1="100" x2="320" y2="275"/><text class="label" x="198" y="292">a</text><text class="label" x="313" y="292">b</text><text class="math" x="206" y="125">A</text><text class="math" x="322" y="92">B</text><text class="math" x="260" y="120">C</text><text class="math" x="358" y="280">x</text><text class="math" x="136" y="90">y</text></g>
  <g aria-label="comparison"><rect class="panel" x="400" y="65" width="208" height="270" rx="8"/><text class="title" x="418" y="92">기울기 비교</text><text class="math" x="418" y="128">A=f(a)/a</text><text class="math" x="418" y="160">B=f(b)/b</text><text class="math" x="418" y="192">C=(f(b)−f(a))/(b−a)</text><line class="guide" x1="418" y1="207" x2="590" y2="207"/><text class="small" x="418" y="238">곡선의 증가·아래로 휨</text><text class="label" x="418" y="275">A &gt; B &gt; C</text><text class="small" x="418" y="308">정답: ①</text></g>
</svg>
