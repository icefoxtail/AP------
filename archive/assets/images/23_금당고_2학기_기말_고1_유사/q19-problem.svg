<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 400" width="480" height="400" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">위층에 사물함 세 개, 아래층에 사물함 네 개가 나란히 놓여 있는 모습을 보여 준다.</title><desc id="visual-desc">세로로 긴 직사각형 일곱 개가 사물함으로 그려져 있다. 위쪽에는 세 개가 나란히 붙어 있고, 그 아래쪽에는 네 개가 더 넓게 나란히 붙어 있다. 맨 위 가로선 위에 위층이라는 글자가, 맨 아래 가로선 아래에 아래층이라는 글자가 붙어 있다.</desc><rect width="480" height="400" fill="#fff"/><g data-layer="30"><line id="bd0" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="90" y1="350" x2="390" y2="350"/></g><g data-layer="30"><line id="bd1" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="390" y1="350" x2="390" y2="200"/></g><g data-layer="30"><line id="bd2" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="390" y1="200" x2="90" y2="200"/></g><g data-layer="30"><line id="bd3" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="90" y1="200" x2="90" y2="350"/></g><g data-layer="30"><line id="bv1" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="165" y1="350" x2="165" y2="200"/></g><g data-layer="30"><line id="bv2" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="240" y1="350" x2="240" y2="200"/></g><g data-layer="30"><line id="bv3" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="315" y1="350" x2="315" y2="200"/></g><g data