<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="title desc"><title id="title">집합 해설 보강 · 문항 10</title><desc id="desc">최소원소별 부분집합 개수와 원소합</desc><rect width="720" height="300" rx="18" fill="#f8fafc"/><text x="32" y="38" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#0f172a">집합 해설 보강 · 문항 10</text><text x="32" y="68" font-family="Arial,sans-serif" font-size="14" fill="#475569">최소원소별 경우의 수</text><rect x="32" y="88" width="656" height="156" rx="12" fill="#fff" stroke="#cbd5e1"/><text x="92" y="126" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#334155">최소원소</text><text x="230" y="126" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#334155">1</text><text x="350" y="126" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#334155">2</text><text x="470" y="126" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#334155">4</text><text x="590" y="126" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#334155">8</text><line x1="72" y1="140" x2="648" y2="140" stroke="#cbd5e1"/><text x="92" y="178" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#334155">경우의 수</text><text x="230" y="178" font-family="Arial,sans-serif" font-size="16" fill="#1d4ed8">2³=8</text><text x="350" y="178" font-family="Arial,sans-serif" font-size="16" fill="#1d4ed8">2²=4</text><text x="470" y="178" font-family="Arial,sans-serif" font-size="16" fill="#1d4ed8">2</text><text x="590" y="178" font-family="Arial,sans-serif" font-size="16" fill="#1d4ed8">1</text><text x="72" y="222" font-family="Arial,sans-serif" font-size="15" fill="#0f172a">1·8+2·4+4·2+8·1=32</text><text x="32" y="274" font-family="Arial,sans-serif" font-size="13" fill="#64748b">작은 원소를 제외하고 큰 원소를 자유롭게 선택한다.</text></svg>
