<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="title desc" data-scale-policy="SCHEMATIC_ALLOWED" width="720" height="360"><title id="title">집합 해설 보강 · 문항 15</title><desc id="desc">A와 B는 열린 구간이고 C는 양 끝이 포함된 닫힌 구간임을 표시</desc><rect width="720" height="300" rx="18" fill="#f8fafc"/><text x="32" y="38" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#0f172a">집합 해설 보강 · 문항 15</text><text x="32" y="68" font-family="Arial,sans-serif" font-size="14" fill="#475569">A=(0,3), B=(7,9), C=[a-1,a+3]</text><rect x="32" y="88" width="656" height="156" rx="12" fill="#fff" stroke="#cbd5e1"/><line x1="155" y1="120" x2="600" y2="120" stroke="#94a3b8" stroke-width="2"/><line x1="205" y1="120" x2="315" y2="120" stroke="#2563eb" stroke-width="8"/><circle cx="205" cy="120" r="7" fill="#fff" stroke="#2563eb" stroke-width="3"/><circle cx="315" cy="120" r="7" fill="#fff" stroke="#2563eb" stroke-width="3"/><text x="90" y="125" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#1d4ed8">A=(0,3)</text><line x1="155" y1="166" x2="600" y2="166" stroke="#94a3b8" stroke-width="2"/><line x1="425" y1="166" x2="505" y2="166" stroke="#ea580c" stroke-width="8"/><circle cx="425" cy="166" r="7" fill="#fff" stroke="#ea580c" stroke-width="3"/><circle cx="505" cy="166" r="7" fill="#fff" stroke="#ea580c" stroke-width="3"/><text x="90" y="171" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#c2410c">B=(7,9)</text><line x1="155" y1="212" x2="600" y2="212" stroke="#94a3b8" stroke-width="2"/><line x1="330" y1="212" x2="545" y2="212" stroke="#16a34a" stroke-width="8"/><circle cx="330" cy="212" r="7" fill="#16a34a"/><circle cx="545" cy="212" r="7" fill="#16a34a"/><text x="90" y="217" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#15803d">C=[a-1,a+3]</text><text x="32" y="274" font-family="Arial,sans-serif" font-size="13" fill="#64748b">C의 양 끝점은 포함된다.</text></svg>
