<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" role="img" aria-labelledby="title desc"><title id="title">진리집합 포함관계</title><desc id="desc">P는 Q 안에 있고 R은 Q 밖에 있어 P와 R은 서로소이다.</desc><style>text{font-family:"Noto Sans KR","Malgun Gothic",Arial,sans-serif;fill:#172033}.muted{fill:#56657a}.math{font-family:Georgia,serif}</style><rect width="760" height="430" fill="#f8fafc"/><text x="28" y="38" font-size="22" font-weight="700">진리집합 포함관계</text><text x="28" y="67" class="muted" font-size="15">P⊆Q, R⊆Qᶜ</text><rect x="36" y="96" width="320" height="250" rx="14" fill="#fff" stroke="#94a3b8"/><text x="50" y="120" class="muted" font-size="14">U</text><circle cx="175" cy="220" r="92" fill="#fed7aa" fill-opacity=".55" stroke="#ea580c" stroke-width="3"/><text x="175" y="140" text-anchor="middle" font-size="18" font-weight="700">Q</text><circle cx="175" cy="220" r="42" fill="#bfdbfe" fill-opacity=".8" stroke="#2563eb" stroke-width="3"/><text x="175" y="226" text-anchor="middle" font-size="18" font-weight="700">P</text><circle cx="302" cy="290" r="27" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text x="302" y="296" text-anchor="middle" font-size="17" font-weight="700">R</text><rect x="390" y="96" width="334" height="250" rx="14" fill="#fff" stroke="#cbd5e1"/><text x="412" y="135" font-size="17" font-weight="700">논리 관계</text><text x="412" y="180" class="math" font-size="21">P⊆Q</text><text x="412" y="225" class="math" font-size="21">R⊆Qᶜ</text><text x="412" y="270" class="math" font-size="21">R⊆Pᶜ</text></svg>
