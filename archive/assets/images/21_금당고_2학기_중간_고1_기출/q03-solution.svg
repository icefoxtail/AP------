<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="title desc"><title id="title">집합 해설 보강 · 문항 3</title><desc id="desc">B가 X에, X가 A에 포함되는 관계</desc><rect width="720" height="300" rx="18" fill="#f8fafc"/><text x="32" y="38" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#0f172a">집합 해설 보강 · 문항 3</text><text x="32" y="68" font-family="Arial,sans-serif" font-size="14" fill="#475569">B⊆X⊆A</text><rect x="32" y="88" width="656" height="156" rx="12" fill="#fff" stroke="#cbd5e1"/><ellipse cx="360" cy="166" rx="155" ry="70" fill="#bfdbfe" fill-opacity=".55" stroke="#2563eb" stroke-width="3"/><ellipse cx="360" cy="166" rx="108" ry="52" fill="#bbf7d0" fill-opacity=".7" stroke="#16a34a" stroke-width="3"/><ellipse cx="360" cy="166" rx="58" ry="32" fill="#fed7aa" fill-opacity=".9" stroke="#ea580c" stroke-width="3"/><text x="208" y="166" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#1d4ed8">A</text><text x="266" y="166" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#15803d">X</text><text x="347" y="166" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#c2410c">B</text><text x="32" y="274" font-family="Arial,sans-serif" font-size="13" fill="#64748b">B의 원소를 포함하고 A의 원소 밖으로 나가지 않는다.</text></svg>
