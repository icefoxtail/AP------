<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 320" width="420" height="320" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">연속한 50개의 자연수 a, a+1, …, a+49에서 두 위치 i, j를 뽑으면 두 수의 차는 |i−j|이다. 짝수와 홀수는 이웃한 수 사이의 간격이 2이므로 같은 두 위치를 뽑을 때 차가 2|i−j|가 된다. 따라서 E(X)=E(Y)=2E(Z)&gt;E(Z)이다. 따라서 답은 ①이다.</title><desc id="visual-desc">왼쪽 끝을 맞춘 두 개의 가로 선분이 위아래로 놓여 있고, 위 선분에는 Z, 아래 선분에는 X=Y라는 이름이 붙어 있다. 위 선분의 길이는 2, 아래 선분의 길이는 4로 표시되어 있어 아래 선분이 두 배로 길다.</desc><rect width="420" height="320" fill="#fff"/><g data-layer="30"><line id="sAC" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="168.96289248" y1="118.96289248" x2="210" y2="118.96289248"/></g><g data-layer="30"><line id="sDF" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="168.96289248" y1="201.03710752" x2="251.03710752" y2="201.03710752"/></g><g data-layer="52"><line id="dAC-ext-from" data-role="indicator" stroke="#111" stroke-width="0.8" fill="none" data-mark="dimension" data-mark-id="dAC" data-mark-part="ext-from" x1="168.96289248" y1="114.96289248" x2="168.96289248" y2="47.96289248"/></g><g data-layer="52"><line id="dAC-ext-to" data-role="indicator" stroke="#111" stroke-width="0.8" fill="none" data-mark="dimension" data-mark-id="dAC" data-mark-part="ext-to" x1="210" y1="114.96289248" x2="210" y2="47.96289248"/></g><g data-layer="52"><line id="dAC-line" data-role="indicator" stroke="#111" stroke-width="1.0" fill="none" data-mark="dimension" data-mark-id="dAC" data-mark-part="line" x1="168.96289248" y1="50.96289248" x2="210" y2="50.96289248"/></g><g data-layer="52"><polygon id="dAC-arrow-from" data-role="indicator" stroke="#111" stroke-width="0.8" fill="#111" data-mark="dimension" data-mark-id="dAC" data-mark-part="arrow-from" points="168.96289248,50.96289248 178.96289248,47.36289248 178.96289248,54.56289248"/></g><g data-layer="52"><polygon id="dAC-arrow-to" data-role="indicator" stroke="#111" stroke-width="0.8" fill="#111" data-mark="dimension" data-mark-id="dAC" data-mark-part="arrow-to" points="210,50.96289248 200,54.56289248 200,47.36289248"/></g><g data-layer="52"><line id="dDF-ext-from" data-role="indicator" stroke="#111" stroke-width="0.8" fill="none" data-mark="dimension" data-mark-id="dDF" data-mark-part="ext-from" x1="168.96289248" y1="205.03710752" x2="168.96289248" y2="272.03710752"/></g><g data-layer="52"><line id="dDF-ext-to" data-role="indicator" stroke="#111" stroke-width="0.8" fill="none" data-mark="dimension" data-mark-id="dDF" data-mark-part="ext-to" x1="251.03710752" y1="205.03710752" x2="251.03710752" y2="272.03710752"/></g><g data-layer="52"><line id="dDF-line" data-role="indicator" stroke="#111" stroke-width="1.0" fill="none" data-mark="dimension" data-mark-id="dDF" data-mark-part="line" x1="168.96289248" y1="269.03710752" x2="251.03710752" y2="269.03710752"/></g><g data-layer="52"><polygon id="dDF-arrow-from" data-role="indicator" stroke="#111" stroke-width="0.8" fill="#111" data-mark="dimension" data-mark-id="dDF" data-mark-part="arrow-from" points="168.96289248,269.03710752 178.96289248,265.43710752 178.96289248,272.63710752"/></g><g data-layer="52"><polygon id="dDF-arrow-to" data-role="indicator" stroke="#111" stroke-width="0.8" fill="#111" data-mark="dimension" data-mark-id="dDF" data-mark-part="arrow-to" points="251.03710752,269.03710752 241.03710752,272.63710752 241.03710752,265.43710752"