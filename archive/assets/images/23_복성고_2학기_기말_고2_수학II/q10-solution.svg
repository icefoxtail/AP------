<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" role="img" aria-labelledby="title desc">
<title id="title">도함수 부호표와 함수의 max·min 위치</title>
<desc id="desc">f prime의 영점이 -7, -3, -2, 2, 7이고 부호가 차례로 음, 양, 음, 양, 음, 양으로 바뀌는 부호표</desc>
<rect width="760" height="250" fill="white"/>
<g stroke="#111" stroke-width="2" fill="none">
<line x1="70" y1="118" x2="700" y2="118"/>
<path d="M 700 118 l -10 -6 l 0 12 z" fill="#111"/>
</g>
<g font-family="Arial, sans-serif" font-size="20" fill="#111" text-anchor="middle">
<line x1="109.38" y1="106" x2="109.38" y2="130" stroke="#111" stroke-width="2"/>
<text x="109.38" y="158">-7</text>
<line x1="266.88" y1="106" x2="266.88" y2="130" stroke="#111" stroke-width="2"/>
<text x="266.88" y="158">-3</text>
<line x1="306.25" y1="106" x2="306.25" y2="130" stroke="#111" stroke-width="2"/>
<text x="306.25" y="158">-2</text>
<line x1="463.75" y1="106" x2="463.75" y2="130" stroke="#111" stroke-width="2"/>
<text x="463.75" y="158">2</text>
<line x1="660.62" y1="106" x2="660.62" y2="130" stroke="#111" stroke-width="2"/>
<text x="660.62" y="158">7</text>
<text x="89.69" y="90" font-size="25">−</text>
<text x="188.12" y="90" font-size="25">+</text>
<text x="286.56" y="90" font-size="25">−</text>
<text x="385.00" y="90" font-size="25">+</text>
<text x="562.19" y="90" font-size="25">−</text>
<text x="680.31" y="90" font-size="25">+</text>
<text x="109.38" y="205" font-size="16">min</text>
<text x="266.88" y="55" font-size="16">max</text>
<text x="306.25" y="205" font-size="16">min</text>
<text x="463.75" y="55" font-size="16">max</text>
<text x="660.62" y="205" font-size="16">min</text>
</g>
<text x="380" y="28" font-family="Arial, sans-serif" font-size="18" text-anchor="middle" fill="#111">Sign chart of f' determines extrema of f</text>
</svg>