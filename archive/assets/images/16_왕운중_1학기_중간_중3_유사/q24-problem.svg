<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 360" width="540" height="360" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">한 변의 길이가 각각 2b, 2a인 두 정사각형이 밑변을 맞대어 붙어 있고, 밑변 위에 A, D, B, C가 왼쪽부터 차례로 표시되어 있다. D는 선분 AC의 중점이다.</title><desc id="visual-desc">왼쪽의 큰 정사각형과 오른쪽의 작은 정사각형이 붙어 있고, 두 정사각형의 밑변을 잇는 선분 위에 A, D, B, C가 왼쪽부터 놓여 있다. 큰 정사각형의 윗변에 2b, 작은 정사각형의 윗변에 2a가 적혀 있고, A와 B에 직각 표시가 있다.</desc><rect width="540" height="360" fill="#fff"/><g data-layer="30"><line id="sAD" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="64.444444444" y1="303.333333333" x2="270" y2="303.333333333"/></g><g data-layer="30"><line id="sDC" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="270" y1="303.333333333" x2="475.555555556" y2="303.333333333"/></g><g data-layer="30"><line id="sAP" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="64.444444444" y1="303.333333333" x2="64.444444444" y2="56.666666667"/></g><g data-layer="30"><line id="sPT" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="64.444444444" y1="56.666666667" x2="311.111111111" y2="56.666666667"/></g><g data-layer="30"><line id="sTR" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="311.111111111" y1="56.666666667" x2="311.111111111" y2="138.888888889"/></g><g data-layer="30"><line id="sRB" data-role="line" stroke