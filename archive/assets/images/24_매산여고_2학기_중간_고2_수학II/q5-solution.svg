<svg xmlns="http://www.w3.org/2000/svg" width="640" height="380" viewBox="0 0 640 380" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-graph-preset="SOLUTION_GRAPH" data-axis-scale-mode="UNEQUAL_UNIT_DECLARED" data-fact-hash="sha256:eda2516f0a2852f8d836148a626d29c928556dd7763021a5f46e5207ab307e09" data-visual-provenance="PYTHON_DERIVED_COORDINATES">
  <title id="title">24 매산여고 5번 외부점에서 그은 접선 해설</title>
  <desc id="desc">곡선 y=x³−x+2에 접하는 직선과 외부점 (0,4), 접점 t=−1을 표시하여 y절편을 구하는 해설 그림</desc>
  <style>
    .background{fill:#fff}.axis{stroke:#171717;stroke-width:1.4;fill:none;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}.curve{stroke:#111;stroke-width:2.1;fill:none;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}.tangent{stroke:#3f4a5a;stroke-width:1.7;fill:none;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}.guide{stroke:#777;stroke-width:.95;stroke-dasharray:4 4;fill:none;vector-effect:non-scaling-stroke}.point{stroke:#111;stroke-width:1;fill:#111;vector-effect:non-scaling-stroke}.panel{fill:#f7f8fa;stroke:#c7cbd1;stroke-width:1}.title{font-family:"Noto Sans KR","Pretendard","Malgun Gothic",sans-serif;font-size:15px;font-weight:700;fill:#111}.label{font-family:"Noto Sans KR","Pretendard","Malgun Gothic",sans-serif;font-size:12px;fill:#222}.small{font-family:"Noto Sans KR","Pretendard","Malgun Gothic",sans-serif;font-size:11px;fill:#333}.math{font-family:"STIX Two Math","Cambria Math","Times New Roman",serif;font-size:13px;fill:#111}
  </style>
  <defs><marker id="axis-arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L6,3 L0,6 Z" fill="#171717"/></marker></defs>
  <rect class="background" x="0" y="0" width="640" height="380"/>
  <text class="title" x="32" y="28">q5  외부점에서 그은 접선의 y절편</text>
  <text class="small" x="32" y="47">접점의 x좌표 t를 정하면 접선의 기울기와 절편이 함께 결정된다.</text>
  <g aria-label="tangent diagram">
    <rect class="panel" x="32" y="65" width="305" height="255" rx="8"/>
    <g transform="translate(160 250) scale(55 -35)" aria-label="single coordinate transform">
      <line class="axis" x1="-1.9" y1="0" x2="3.0" y2="0" marker-end="url(#axis-arrow)"/>
      <line class="axis" x1="0" y1="-2" x2="0" y2="4.8" marker-end="url(#axis-arrow)"/>
      <polyline class="curve" points="-1.4,0.656 -1.3,1.103 -1.2,1.472 -1.1,1.769 -1,2 -0.9,2.171 -0.8,2.288 -0.7,2.357 -0.6,2.384 -0.5,2.375 -0.4,2.336 -0.3,2.273 -0.2,2.192 -0.1,2.099 0,2 0.1,1.901 0.2,1.808 0.3,1.727 0.4,1.664 0.5,1.625 0.6,1.616 0.7,1.643 0.8,1.712 0.9,1.829 1,2 1.1,2.231 1.2,2.528 1.3,2.897 1.4,3.344 1.5,3.875"/>
      <line class="tangent" x1="-1.35" y1="1.3" x2="0.45" y2="4.9"/>
      <line class="guide" x1="-1" y1="0" x2="-1" y2="2"/>
      <circle class="point" cx="0" cy="4" r=".08"/><circle class="point" cx="-1" cy="2" r=".08"/>
    </g>
    <text class="label" x="171" y="96">S=(0,4)</text>
    <text class="label" x="67" y="177">T=(−1,2)</text>
    <text class="math" x="210" y="125">y=2x+4</text>
    <text class="math" x="185" y="148">y=x³−x+2</text>
    <text class="small" x="73" y="238">t=−1</text>
    <text class="math" x="302" y="255">x</text><text class="math" x="166" y="88">y</text>
  </g>
  <g aria-label="calculation panel">
    <rect class="panel" x="355" y="65" width="253" height="255" rx="8"/>
    <text class="title" x="373" y="92">접선 계산</text>
    <text class="math" x="373" y="124">f′(t)=3t²−1</text>
    <text class="math" x="373" y="151">접선 y절편=−2t³+2</text>
    <text class="small" x="373" y="178">S=(0,4)를 지나므로</text>
    <text class="math" x="373" y="205">−2t³+2=4 ⇒ t=−1</text>
    <line class="guide" x1="373" y1="219" x2="590" y2="219"/>
    <text class="math" x="373" y="249">y절편=−2(−1)³+2=4</text>
    <text class="label" x="373" y="282">정답: ②  4</text>
    <text class="small" x="373" y="305">접선은 외부점 S를 지나고 T에서 곡선에 접한다.</text>
  </g>
</svg>
