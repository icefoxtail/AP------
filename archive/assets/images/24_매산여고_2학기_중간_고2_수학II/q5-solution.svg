<svg xmlns="http://www.w3.org/2000/svg" width="640" height="380" viewBox="0 0 640 380" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc">
  <title id="title">24 매산여고 5번 외부점에서 그은 접선 해설</title>
  <desc id="desc">곡선 y=x³−x+2에 접하는 직선과 외부점 (0,4), 접점 t=−1을 표시하여 y절편을 구하는 해설 그림</desc>
  <style>
    .background{fill:#fff}.axis{stroke:#171717;stroke-width:1.4;fill:none;stroke-linecap:round;stroke-linejoin:round}.curve{stroke:#111;stroke-width:2.1;fill:none;stroke-linecap:round;stroke-linejoin:round}.tangent{stroke:#3f4a5a;stroke-width:1.7;fill:none;stroke-linecap:round;stroke-linejoin:round}.guide{stroke:#777;stroke-width:.95;stroke-dasharray:4 4;fill:none}.point{stroke:#111;stroke-width:1;fill:#111}.panel{fill:#f7f8fa;stroke:#c7cbd1;stroke-width:1}.title{font-family:"Noto Sans KR","Pretendard","Malgun Gothic",sans-serif;font-size:15px;font-weight:700;fill:#111}.label{font-family:"Noto Sans KR","Pretendard","Malgun Gothic",sans-serif;font-size:12px;fill:#222}.small{font-family:"Noto Sans KR","Pretendard","Malgun Gothic",sans-serif;font-size:11px;fill:#333}.math{font-family:"STIX Two Math","Cambria Math","Times New Roman",serif;font-size:13px;fill:#111}
  </style>
  <defs><marker id="axis-arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L6,3 L0,6 Z" fill="#171717"/></marker></defs>
  <rect class="background" x="0" y="0" width="640" height="380"/>
  <text class="title" x="32" y="28">q5  외부점에서 그은 접선의 y절편</text>
  <text class="small" x="32" y="47">접점의 x좌표 t를 정하면 접선의 기울기와 절편이 함께 결정된다.</text>
  <g aria-label="tangent diagram">
    <rect class="panel" x="32" y="65" width="305" height="255" rx="8"/>
    <line class="axis" x1="55" y1="250" x2="315" y2="250" marker-end="url(#axis-arrow)"/>
    <line class="axis" x1="160" y1="295" x2="160" y2="82" marker-end="url(#axis-arrow)"/>
    <path class="curve" d="M75 310 C88 265 96 220 105 195 C125 145 146 120 169 108 C190 101 208 109 224 128 C244 151 259 190 278 245"/>
    <path class="tangent" d="M80 233.63636363636363 L190 63.63636363636363"/>
    <line class="guide" x1="105" y1="195" x2="105" y2="250"/>
    <circle class="point" cx="105" cy="195" r="3.7"/>
    <circle class="point" cx="160" cy="110" r="3.7"/>
    <text class="label" x="171" y="101">S=(0,4)</text>
    <text class="label" x="83" y="187">T=(−1,2)</text>
    <text class="math" x="205" y="94">y=2x+4</text>
    <text class="math" x="195" y="142">y=x³−x+2</text>
    <text class="small" x="67" y="278">t=−1</text>
    <text class="math" x="302" y="255">x</text><text class="math" x="166" y="88">y</text>
  </g>
  <g aria-label="calculation panel">
    <rect class="panel" x="355" y="65" width="253" height="255" rx="8"/>
    <text class="title" x="373" y="92">접선 계산</text>
    <text class="math" x="373" y="124">f′(t)=3t²−1</text>
    <text class="math" x="373" y="151">접선 y절편=−2t³+2</text>
    <text class="small" x="373" y="178">S=(0,4)를 지나므로</text>
    <text class="math" x="373" y="205">−2t³+2=4 ⇒ t=−1</text>
    <line class="guide" x1="373" y1="219" x2="590" y2="219"/>
    <text class="math" x="373" y="249">y절편=−2(−1)³+2=4</text>
    <text class="label" x="373" y="282">정답: ②  4</text>
    <text class="small" x="373" y="305">접선은 외부점 S를 지나고 T에서 곡선에 접한다.</text>
  </g>
</svg>
