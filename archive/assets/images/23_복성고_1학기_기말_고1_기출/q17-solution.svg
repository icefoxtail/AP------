<text x="526" y="98" class="sidehead">해설 핵심</text>
<text x="526" y="124" class="sidebody">M은 AC의 중점</text>
<text x="526" y="146" class="sidebody">AM=MC → AM/MC=1</text>
<text x="526" y="168" class="sidebody">각의 이등분선 정리</text>
<text x="526" y="190" class="sidebody">AB/BC=AM/MC=1</text>
<text x="526" y="212" class="sidebody">따라서 AB=BC=5</text>
<text x="526" y="234" class="sidebody">√(a²+9)=5 → a=4</text>
