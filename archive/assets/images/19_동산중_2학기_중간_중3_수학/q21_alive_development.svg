<svg xmlns="http://www.w3.org/2000/svg" width="680" height="610" viewBox="0 0 680 610" role="img" aria-labelledby="title desc">
<title id="title">ALIVE 조건의 원기둥 옆면 전개도</title>
<desc id="desc">가로 6π, 세로 8π인 직사각형. A는 왼쪽 아래, B는 오른쪽 위에 있고 두 점을 대각선으로 잇는다. 가로 방향 한 폭은 원둘레 한 바퀴다.</desc>
<defs>
  <marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 Z" fill="#475569"/></marker>
</defs>
<rect width="680" height="610" fill="#ffffff"/>
<text x="340" y="34" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#0f172a">옆면 전개도 · 원둘레 방향 한 바퀴</text>
<!-- Rectangle has the exact 6:8 (3:4) side ratio. -->
<rect x="150" y="82" width="360" height="480" fill="#f8fafc" stroke="#334155" stroke-width="3"/>
<line x1="150" y1="562" x2="510" y2="82" stroke="#2563eb" stroke-width="5"/>
<circle cx="150" cy="562" r="7" fill="#dc2626"/>
<circle cx="510" cy="82" r="7" fill="#dc2626"/>
<text x="126" y="554" text-anchor="end" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#991b1b">A</text>
<text x="528" y="78" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#991b1b">B</text>
<line x1="150" y1="62" x2="510" y2="62" stroke="#475569" stroke-width="1.7" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<text x="330" y="54" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#1e293b">원둘레 = 2πr = 6π cm</text>
<line x1="540" y1="82" x2="540" y2="562" stroke="#475569" stroke-width="1.7" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<text x="565" y="322" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#1e293b" transform="rotate(90 565 322)">높이 = 8π cm</text>
<text x="330" y="590" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#334155">A에서 오른쪽 경계까지가 정확히 한 바퀴이며, 펼친 면의 최단 경로는 대각선</text>
</svg>
