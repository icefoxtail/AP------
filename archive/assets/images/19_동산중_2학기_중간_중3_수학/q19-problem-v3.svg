<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 520" width="700" height="520" role="img" aria-labelledby="title desc"><title id="title">구의 중심에서 일정 거리 떨어진 단면</title><desc id="desc">위쪽 평면이 구와 만나 원을 만든다. 중심 O와 평면의 수선의 발 H 사이 거리는 4 cm이다.</desc><rect width="700" height="520" fill="white" /><circle cx="355" cy="274" r="170.0" fill="none" stroke="#205d9c" stroke-width="4.35" /><polygon points="145.0000,189.6188 521.0000,189.6188 577.0000,114.6188 205.0000,114.6188" fill="none" /><circle cx="355" cy="274" r="170.0" fill="none" stroke="#205d9c" stroke-width="2.3" stroke-dasharray="6 5" /><ellipse cx="355" cy="165.6187943241893" rx="126.71051872498808" ry="37.046570365927025" fill="none" stroke="#277339" stroke-width="4" /><line x1="355.0000" y1="274.0000" x2="355.0000" y2="165.6188" stroke="#aa5411" stroke-width="3.8" stroke-linecap="round" stroke-dasharray="7 5" /><text x="298.0000" y="227.8094" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#aa5411" text-anchor="middle">4 cm</text><circle cx="355" cy="274" r="4.7" fill="#28364b" /><text x="368.0000" y="299.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">O</text><circle cx="355" cy="165.6187943241893" r="4.7" fill="#aa5411" /><text x="339.0000" y="150.6188" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#aa5411" text-anchor="middle">H</text><circle cx="481.7105187249881" cy="165.6187943241893" r="4.7" fill="#277339" /><text x="496.7105" y="150.6188" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#277339" text-anchor="middle">A</text></svg>
