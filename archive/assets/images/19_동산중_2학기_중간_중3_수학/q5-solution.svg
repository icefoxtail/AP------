<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 726 495" width="726" height="495" role="img" aria-labelledby="title desc"><title id="title">가운데와 양끝의 막대를 비교하는 분포</title><desc id="desc">두 막대 분포를 비교했다. 왼쪽 도표의 양끝 막대가 높고 오른쪽 도표는 가운데 막대가 높다. 양끝 계급에 있는 점들이 평균에서 더 멀다.</desc><rect width="726" height="495" fill="white" /><rect x="33" y="50" width="316" height="380" rx="12" fill="#f9fbfe" stroke="#ccd8e6" stroke-width="1.6" /><text x="191.0000" y="92.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#586574" text-anchor="middle">양끝이 높은 분포</text><line x1="78.0000" y1="365.0000" x2="318.0000" y2="365.0000" stroke="#586574" stroke-width="2.0" stroke-linecap="round" /><line x1="86.0000" y1="365.0000" x2="86.0000" y2="154.0000" stroke="#586574" stroke-width="2.0" stroke-linecap="round" /><polygon points="86.0000,147.0000 82.0000,158.0000 90.0000,158.0000" fill="#586574" /><polygon points="321.0000,365.0000 311.0000,361.0000 311.0000,369.0000" fill="#586574" /><text x="68.0000" y="388.0000" font-size="27" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#586574" text-anchor="middle">0</text><rect x="120" y="169.12121212121212" width="38" height="195.87878787878788" fill="#e5f3e4" stroke="#277339" stroke-width="3" /><rect x="181" y="268.5909090909091" width="38" height="96.4090909090909" fill="#fae6ce" stroke="#aa5411" stroke-width="3" /><rect x="242" y="172.1818181818182" width="38" height="192.8181818181818" fill="#e5f3e4" stroke="#277339" stroke-width="3" /><rect x="379" y="50" width="316" height="380" rx="12" fill="#f9fbfe" stroke="#ccd8e6" stroke-width="1.6" /><text x="537.0000" y="92.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#586574" text-anchor="middle">가운데가 높은 분포</text><line x1="424.0000" y1="365.0000" x2="664.0000" y2="365.0000" stroke="#586574" stroke-width="2.0" stroke-linecap="round" /><line x1="432.0000" y1="365.0000" x2="432.0000" y