<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 340" role="img"><title>3번 해설 도형</title><desc>현의 반과 sagitta로 반지름 구하기</desc><rect width="100%" height="100%" fill="white"/><g stroke="#222" stroke-width="2" fill="none"><circle cx="160" cy="185" r="100"/><line x1="100.0" y1="105.0" x2="220.0" y2="105.0" /><line x1="160.0" y1="185.0" x2="160.0" y2="105.0" /><line x1="160.0" y1="185.0" x2="100.0" y2="105.0" /><line x1="160.0" y1="85.0" x2="160.0" y2="105.0" /><circle cx="160.0" cy="185.0" r="3" fill="#111"/><circle cx="160.0" cy="105.0" r="2" fill="#111"/>
 <text x="168" y="190" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="#111">O</text><text x="168" y="110" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="#111">M</text><text x="85" y="110" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="#111">A</text><text x="228" y="110" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="#111">B</text><text x="160" y="77" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#111">C</text>
 <text x="95" y="135" font-family="Arial, sans-serif" font-size="15" text-anchor="start" fill="#111">AB=6</text><text x="168" y="96" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="#111">1</text><text x="325" y="105" font-family="Arial, sans-serif" font-size="16" text-anchor="start" fill="#111">AM=3, OM=r−1</text><text x="325" y="145" font-family="Arial, sans-serif" font-size="16" text-anchor="start" fill="#111">r²=(r−1)²+3²</text><text x="325" y="185" font-family="Arial, sans-serif" font-size="18" text-anchor="start" fill="#111">r=5</text></g></svg>