<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 340" role="img"><title>7번 해설 도형</title><desc>호의 길이와 중심각, 원주각의 비례</desc><rect width="100%" height="100%" fill="white"/><g stroke="#222" stroke-width="2" fill="none"><circle cx="165" cy="160" r="92"/><line x1="165.0" y1="68.0" x2="211.0" y2="239.7" /><line x1="165.0" y1="68.0" x2="119.0" y2="239.7" /><line x1="165.0" y1="160.0" x2="211.0" y2="239.7" /><line x1="165.0" y1="160.0" x2="119.0" y2="239.7" /><line x1="251.5" y1="191.5" x2="73.0" y2="160.0" /><line x1="251.5" y1="191.5" x2="85.3" y2="114.0" /><circle cx="165.0" cy="160.0" r="3" fill="#111"/>
 <text x="165" y="60" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#111">x=30°</text><text x="145" y="173" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="#111">y=60°</text><text x="70" y="155" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="#111">호 4</text><text x="145" y="275" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="#111">호 8</text>
 <text x="345" y="90" font-family="Arial, sans-serif" font-size="15" text-anchor="start" fill="#111">15° ↔ 중심각 30°</text><text x="345" y="125" font-family="Arial, sans-serif" font-size="15" text-anchor="start" fill="#111">호 4 → 둘레 48</text><text x="345" y="160" font-family="Arial, sans-serif" font-size="15" text-anchor="start" fill="#111">호 8 → 중심각 60°</text><text x="345" y="200" font-family="Arial, sans-serif" font-size="18" text-anchor="start" fill="#111">x+y=90°</text></g></svg>