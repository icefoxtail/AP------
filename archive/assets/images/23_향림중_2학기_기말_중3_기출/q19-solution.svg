<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 360" role="img"><title>19번 해설 산점도</title><desc>수학+과학 점수가 160 이상인 네 점을 경계선 x+y=160으로 확인</desc><rect width="100%" height="100%" fill="white"/><g stroke="#222" stroke-width="2" fill="none"><line x1="70" y1="285" x2="330" y2="285"/><line x1="70" y1="285" x2="70" y2="25"/><line x1="120" y1="35" x2="320" y2="235" stroke-dasharray="7 5"/><g fill="#111" stroke="none"><circle cx="70" cy="235" r="4"/><circle cx="120" cy="285" r="4"/><circle cx="120" cy="135" r="4"/><circle cx="170" cy="235" r="4"/><circle cx="170" cy="185" r="4"/><circle cx="220" cy="185" r="4"/><circle cx="220" cy="135" r="4"/><circle cx="270" cy="135" r="4"/><circle cx="270" cy="85" r="4"/><circle cx="320" cy="35" r="4"/></g><g stroke-width="2"><circle cx="220" cy="135" r="9"/><circle cx="270" cy="135" r="9"/><circle cx="270" cy="85" r="9"/><circle cx="320" cy="35" r="9"/></g><g fill="#111" stroke="none" font-family="Arial, sans-serif"><text x="338" y="290" font-size="14">수학</text><text x="50" y="20" font-size="14">과학</text><text x="335" y="155" font-size="15">x+y=160</text><text x="360" y="195" font-size="16">경계선 위·위쪽 4개</text><text x="360" y="225" font-size="16">(80,80), (90,80)</text><text x="360" y="250" font-size="16">(90,90), (100,100)</text></g></g></svg>