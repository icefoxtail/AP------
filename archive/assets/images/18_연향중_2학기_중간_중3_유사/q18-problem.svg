<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 420" width="420" height="420" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">구에 원뿔이 내접한 그림이다. 구의 반지름 5와 원뿔의 모선의 길이 2루트 15가 표시되어 있다.</title><desc id="visual-desc">구를 나타내는 원 안에 꼭짓점이 구의 위쪽에 닿는 원뿔이 있고, 원뿔의 밑면은 구의 중심 아래쪽을 지나는 가로 선분으로 나타나 있다. 구의 반지름 5와 원뿔의 모선 2루트 15가 선분 옆에 적혀 있다.</desc><rect width="420" height="420" fill="#fff"/><g data-layer="30"><line id="sAB" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="210" y1="78.387862333" x2="72.992610837" y2="246.186959553"/></g><g data-layer="30"><line id="sAC" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="210" y1="78.387862333" x2="347.007389163" y2="246.186959553"/></g><g data-layer="30"><line id="sBC" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="72.992610837" y1="246.186959553" x2="347.007389163" y2="246.186959553"/></g><g data-layer="30"><line id="sAO" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="210" y1="78.387862333" x2="210" y2="218.22044335"/></g><g data-layer="40"><circle id="k" data-role="circle" stroke="#111" stroke-width="2.05" fill="none" cx="210" cy="218.22044335" r="139.832581016"/></g><g data-layer="85"><line id="lAB-owner-leader" data-role="leader" data-owner-label="lAB" data-owner="sAB" x1="141.496305419" y1="162.287410943" x2="141.496305419" y2