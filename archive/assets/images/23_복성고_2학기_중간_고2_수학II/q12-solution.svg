<svg xmlns="http://www.w3.org/2000/svg" width="640" height="450" viewBox="0 0 640 450" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc" data-fact-hash="sha256:5d46d214c65ca375e56bac78dcf4f4267a8758dfae45c453c4a0127418a24357" data-visual-provenance="PYTHON_DERIVED_LAYOUT_REVIEWED">
  <title id="title">23 복성고 12번 극한과 접선 y절편 해설</title>
  <desc id="desc">점 (2,3)에서 곡선의 접선 y=4x−5를 표시해 y절편 −5를 구한다</desc>
  <style>.background{fill:#fff}.axis{stroke:#171717;stroke-width:1.4;fill:none;stroke-linecap:round;stroke-linejoin:round}.curve{stroke:#111;stroke-width:2.1;fill:none;stroke-linecap:round;stroke-linejoin:round}.tangent{stroke:#b23a48;stroke-width:2;fill:none;stroke-linecap:round}.normal{stroke:#b23a48;stroke-width:2;fill:none;stroke-linecap:round}.perp{stroke:#356a9a;stroke-width:1.9;fill:none;stroke-linecap:round}.secant{stroke:#356a9a;stroke-width:1.9;fill:none;stroke-linecap:round}.line{stroke:#356a9a;stroke-width:1.9;fill:none;stroke-linecap:round}.line-main{stroke:#356a9a;stroke-width:1.9;fill:none;stroke-linecap:round}.level{stroke:#6b7280;stroke-width:1.2;stroke-dasharray:5 4;fill:none}.guide{stroke:#777;stroke-width:.95;stroke-dasharray:4 4;fill:none}.point{stroke:#111;stroke-width:1;fill:#111}.open{stroke:#111;stroke-width:1.3;fill:#fff}.closed{stroke:#111;stroke-width:1;fill:#111}.panel{fill:#f7f8fa;stroke:#c7cbd1;stroke-width:1}.title{font-family:"Noto Sans KR","Pretendard","Malgun Gothic",sans-serif;font-size:15px;font-weight:700;fill:#111}.label{font-family:"Noto Sans KR","Pretendard","Malgun Gothic",sans-serif;font-size:12px;fill:#222}.small{font-family:"Noto Sans KR","Pretendard","Malgun Gothic",sans-serif;font-size:11px;fill:#333}.math{font-family:"STIX Two Math","Cambria Math","Times New Roman",serif;font-size:13px;fill:#111}</style>
  <defs><marker id="axis-arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L6,3 L0,6 Z" fill="#171717"/></marker><clipPath id="graph-clip"><rect x="32" y="65" width="342" height="296" rx="8"/></clipPath></defs>
  <rect class="background" x="0" y="0" width="640" height="450"/>
  <text class="title" x="32.000" y="28.000">23 복성고 12번 극한과 접선 y절편</text>
  <text class="small" x="32.000" y="47.000">점 (2,3)에서 곡선의 접선 y=4x−5를 표시해 y절편 −5를 구한다</text>
  <g aria-label="graph"><rect class="panel" x="32" y="65" width="342" height="296" rx="8"/><g clip-path="url(#graph-clip)"><line class="axis" x1="52.000" y1="220.000" x2="352.000" y2="220.000" marker-end="url(#axis-arrow)"/><line class="axis" x1="130.000" y1="346.000" x2="130.000" y2="82.000" marker-end="url(#axis-arrow)"/><polyline class="tangent" points="123.333,356.000 244.583,65.000"/><circle class="point" cx="210.000" cy="148.000" r="4.00"/><circle class="point" cx="130.000" cy="340.000" r="4.00"/><text class="label" x="216.000" y="140.000">(2,3)</text><text class="label" x="138.000" y="336.000">(0,−5)</text><text class="label" x="228.000" y="100.000">y=4x−5</text><text class="math" x="354.000" y="225.000">x</text><text class="math" x="136.000" y="88.000">y</text></g></g>
  <g aria-label="calculation"><rect class="panel" x="392" y="65" width="216" height="296" rx="8"/><text class="title" x="410.000" y="92.000">계산</text><text class="math" x="410.000" y="132.000">f(2)=3</text><text class="math" x="410.000" y="166.000">f′(2)/4=1 ⇒ f′(2)=4</text><text class="math" x="410.000" y="200.000">y−3=4(x−2)</text><text class="math" x="410.000" y="234.000">y=4x−5</text><text class="math" x="410.000" y="268.000">y절편 −5</text><text class="label" x="410.000" y="302.000">정답: ③</text></g>
  <rect class="panel" x="32" y="382" width="576" height="38" rx="7"/><text class="small" x="50.000" y="406.000">극한을 f(2)=3, f′(2)=4로 바꾸어 접선의 y절편을 구한다.</text>
</svg>
