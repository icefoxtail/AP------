<svg xmlns="http://www.w3.org/2000/svg" width="640" height="390" viewBox="0 0 640 390" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc">
  <title id="title">23 복성고 12번 극한과 접선 y절편 해설</title>
  <desc id="desc">점 (2,3)에서 곡선의 접선 y=4x−5를 표시해 y절편 −5를 구하는 해설 그래프</desc>
  <style>.background{fill:#fff}.axis{stroke:#171717;stroke-width:1.4;fill:none;stroke-linecap:round;stroke-linejoin:round}.curve{stroke:#111;stroke-width:2.1;fill:none;stroke-linecap:round;stroke-linejoin:round}.tangent{stroke:#3f4a5a;stroke-width:1.7;fill:none;stroke-linecap:round;stroke-linejoin:round}.guide{stroke:#777;stroke-width:.95;stroke-dasharray:4 4;fill:none}.point{stroke:#111;stroke-width:1;fill:#111}.panel{fill:#f7f8fa;stroke:#c7cbd1;stroke-width:1}.title{font-family:"Noto Sans KR","Pretendard","Malgun Gothic",sans-serif;font-size:15px;font-weight:700;fill:#111}.label{font-family:"Noto Sans KR","Pretendard","Malgun Gothic",sans-serif;font-size:12px;fill:#222}.small{font-family:"Noto Sans KR","Pretendard","Malgun Gothic",sans-serif;font-size:11px;fill:#333}.math{font-family:"STIX Two Math","Cambria Math","Times New Roman",serif;font-size:13px;fill:#111}</style>
  <defs><marker id="axis-arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L6,3 L0,6 Z" fill="#171717"/></marker></defs>
  <rect class="background" x="0" y="0" width="640" height="390"/><text class="title" x="32" y="28">q12  극한값에서 접선의 y절편까지</text><text class="small" x="32" y="47">분모가 0으로 가는 극한을 미분계수로 바꾸면 접선이 결정된다.</text>
  <g aria-label="tangent graph"><rect class="panel" x="32" y="65" width="330" height="235" rx="8"/><line class="axis" x1="52" y1="230" x2="345" y2="230" marker-end="url(#axis-arrow)"/><line class="axis" x1="170" y1="280" x2="170" y2="82" marker-end="url(#axis-arrow)"/><path class="curve" d="M60 270 C95 250 125 190 150 145 C175 105 215 92 260 115 C292 132 320 170 340 220"/><path class="tangent" d="M78 280 L290 70"/><circle class="point" cx="230" cy="130" r="3.8"/><line class="guide" x1="230" y1="130" x2="230" y2="230"/><text class="label" x="235" y="124">(2,3)</text><text class="math" x="220" y="92">y=4x−5</text><text class="math" x="335" y="235">x</text><text class="math" x="176" y="90">y</text><text class="small" x="82" y="268">f(2)=3, f′(2)=4</text></g>
  <g aria-label="calculation"><rect class="panel" x="380" y="65" width="228" height="235" rx="8"/><text class="title" x="398" y="92">계산</text><text class="math" x="398" y="126">f(2)=3</text><text class="math" x="398" y="154">f′(2)/4=1 ⇒ f′(2)=4</text><text class="math" x="398" y="186">y−3=4(x−2)</text><line class="guide" x1="398" y1="201" x2="590" y2="201"/><text class="label" x="398" y="237">y=4x−5</text><text class="label" x="398" y="272">y절편 −5  (정답: ③)</text></g>
</svg>
