<svg xmlns="http://www.w3.org/2000/svg" width="640" height="450" viewBox="0 0 640 450" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc" data-fact-hash="sha256:6d59b104e7a12244adea252df93fe8289187dbb5e1631e3ad788aafce52cef74" data-visual-provenance="PYTHON_DERIVED_LAYOUT_REVIEWED">
  <title id="title">23 복성고 19번 움직이는 선분의 교점 극한 해설</title>
  <desc id="desc">A=(3,0), B=(0,2), P와 Q가 접근할 때 PQ와 AB의 교점 R을 표시한다</desc>
  <style>.background{fill:#fff}.axis{stroke:#171717;stroke-width:1.4;fill:none;stroke-linecap:round;stroke-linejoin:round}.curve{stroke:#111;stroke-width:2.1;fill:none;stroke-linecap:round;stroke-linejoin:round}.tangent{stroke:#b23a48;stroke-width:2;fill:none;stroke-linecap:round}.normal{stroke:#b23a48;stroke-width:2;fill:none;stroke-linecap:round}.perp{stroke:#356a9a;stroke-width:1.9;fill:none;stroke-linecap:round}.secant{stroke:#356a9a;stroke-width:1.9;fill:none;stroke-linecap:round}.line{stroke:#356a9a;stroke-width:1.9;fill:none;stroke-linecap:round}.line-main{stroke:#356a9a;stroke-width:1.9;fill:none;stroke-linecap:round}.level{stroke:#6b7280;stroke-width:1.2;stroke-dasharray:5 4;fill:none}.guide{stroke:#777;stroke-width:.95;stroke-dasharray:4 4;fill:none}.point{stroke:#111;stroke-width:1;fill:#111}.open{stroke:#111;stroke-width:1.3;fill:#fff}.closed{stroke:#111;stroke-width:1;fill:#111}.panel{fill:#f7f8fa;stroke:#c7cbd1;stroke-width:1}.title{font-family:"Noto Sans KR","Pretendard","Malgun Gothic",sans-serif;font-size:15px;font-weight:700;fill:#111}.label{font-family:"Noto Sans KR","Pretendard","Malgun Gothic",sans-serif;font-size:12px;fill:#222}.small{font-family:"Noto Sans KR","Pretendard","Malgun Gothic",sans-serif;font-size:11px;fill:#333}.math{font-family:"STIX Two Math","Cambria Math","Times New Roman",serif;font-size:13px;fill:#111}</style>
  <defs><marker id="axis-arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L6,3 L0,6 Z" fill="#171717"/></marker><clipPath id="graph-clip"><rect x="32" y="65" width="342" height="296" rx="8"/></clipPath></defs>
  <rect class="background" x="0" y="0" width="640" height="450"/>
  <text class="title" x="32.000" y="28.000">23 복성고 19번 움직이는 선분의 교점 극한</text>
  <text class="small" x="32.000" y="47.000">A=(3,0), B=(0,2), P와 Q가 접근할 때 PQ와 AB의 교점 R을 표시한다</text>
  <g aria-label="graph"><rect class="panel" x="32" y="65" width="342" height="296" rx="8"/><g clip-path="url(#graph-clip)"><line class="axis" x1="52.000" y1="300.000" x2="352.000" y2="300.000" marker-end="url(#axis-arrow)"/><line class="axis" x1="100.000" y1="346.000" x2="100.000" y2="82.000" marker-end="url(#axis-arrow)"/><line class="line-main" x1="280.000" y1="300.000" x2="100.000" y2="180.000"/><line class="line-main" x1="256.000" y1="300.000" x2="100.000" y2="156.000"/><circle class="point" cx="280.000" cy="300.000" r="4.00"/><text class="label" x="286.000" y="318.000">A=(3,0)</text><circle class="point" cx="100.000" cy="180.000" r="4.00"/><text class="label" x="106.000" y="172.000">B=(0,2)</text><circle class="point" cx="256.000" cy="300.000" r="4.00"/><text class="label" x="248.000" y="318.000">P</text><circle class="point" cx="100.000" cy="156.000" r="4.00"/><text class="label" x="106.000" y="148.000">Q</text><circle class="point" cx="193.600" cy="242.400" r="4.00"/><text class="label" x="199.600" y="234.400">R</text><text class="math" x="354.000" y="305.000">x</text><text class="math" x="106.000" y="88.000">y</text></g></g>
  <g aria-label="calculation"><rect class="panel" x="392" y="65" width="216" height="296" rx="8"/><text class="title" x="410.000" y="92.000">계산</text><text class="math" x="410.000" y="132.000">P=(3−t,0)</text><text class="math" x="410.000" y="166.000">Q=(0,2+t)</text><text class="math" x="410.000" y="200.000">y_R=(4+2t)/5</text><text class="math" x="410.000" y="234.000">x_R=(6−3y_R)/2</text><text class="math" x="410.000" y="268.000">t→0: R→(9/5,4/5)</text><text class="label" x="410.000" y="302.000">정답: ④</text></g>
  <rect class="panel" x="32" y="382" width="576" height="38" rx="7"/><text class="small" x="50.000" y="406.000">대표값 t=0.4로도 AB는 고정되고 PQ와의 교점 R이 계산식 위에 놓인다.</text>
</svg>
