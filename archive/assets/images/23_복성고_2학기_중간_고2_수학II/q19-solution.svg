<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc">
  <title id="title">23 복성고 19번 움직이는 선분의 교점 극한 해설</title>
  <desc id="desc">A=(3,0), B=(0,2), P와 Q가 A와 B에 접근할 때 PQ와 AB의 교점 R이 (9/5,4/5)에 접근하는 도형</desc>
  <style>.background{fill:#fff}.axis{stroke:#171717;stroke-width:1.4;fill:none;stroke-linecap:round;stroke-linejoin:round}.line-main{stroke:#3f4a5a;stroke-width:1.7;fill:none;stroke-linecap:round;stroke-linejoin:round}.guide{stroke:#777;stroke-width:.95;stroke-dasharray:4 4;fill:none}.point{stroke:#111;stroke-width:1;fill:#111}.panel{fill:#f7f8fa;stroke:#c7cbd1;stroke-width:1}.target{fill:#e7eef5;stroke:#55718a;stroke-width:1.1}.title{font-family:"Noto Sans KR","Pretendard","Malgun Gothic",sans-serif;font-size:15px;font-weight:700;fill:#111}.label{font-family:"Noto Sans KR","Pretendard","Malgun Gothic",sans-serif;font-size:12px;fill:#222}.small{font-family:"Noto Sans KR","Pretendard","Malgun Gothic",sans-serif;font-size:11px;fill:#333}.math{font-family:"STIX Two Math","Cambria Math","Times New Roman",serif;font-size:13px;fill:#111}</style>
  <defs><marker id="axis-arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L6,3 L0,6 Z" fill="#171717"/></marker></defs>
  <rect class="background" x="0" y="0" width="640" height="420"/><text class="title" x="32" y="28">q19  AB와 PQ의 교점이 다가가는 점</text><text class="small" x="32" y="47">AP=BQ=t로 두고 두 직선의 교점을 구한 뒤 t→0을 취한다.</text>
  <g aria-label="geometry diagram"><rect class="panel" x="32" y="65" width="330" height="275" rx="8"/><line class="axis" x1="52" y1="300" x2="345" y2="300" marker-end="url(#axis-arrow)"/><line class="axis" x1="80" y1="325" x2="80" y2="82" marker-end="url(#axis-arrow)"/><line class="line-main" x1="80" y1="200" x2="230" y2="300"/><line class="line-main" x1="95" y1="185" x2="215" y2="295"/><line class="guide" x1="80" y1="200" x2="80" y2="300"/><line class="guide" x1="230" y1="300" x2="230" y2="200"/><circle class="point" cx="230" cy="300" r="3.8"/><circle class="point" cx="80" cy="200" r="3.8"/><circle class="point" cx="215" cy="295" r="3.8"/><circle class="point" cx="95" cy="185" r="3.8"/><circle class="point" cx="170" cy="260" r="3.8"/><text class="label" x="62" y="190">B=(0,2)</text><text class="label" x="232" y="318">A=(3,0)</text><text class="label" x="220" y="288">P</text><text class="label" x="84" y="180">Q</text><text class="label" x="174" y="255">R</text><text class="math" x="328" y="305">x</text><text class="math" x="86" y="90">y</text></g>
  <g aria-label="calculation"><rect class="panel" x="380" y="65" width="228" height="275" rx="8"/><text class="title" x="398" y="92">교점 좌표</text><text class="math" x="398" y="124">P=(3−t,0)</text><text class="math" x="398" y="151">Q=(0,2+t)</text><text class="math" x="398" y="178">y_R=(4+2t)/5</text><text class="math" x="398" y="205">x_R=(6−3y_R)/2</text><line class="guide" x1="398" y1="219" x2="590" y2="219"/><text class="label" x="398" y="250">t→0: R→(9/5,4/5)</text><text class="small" x="398" y="282">정답: ④</text><text class="small" x="398" y="314">AB는 고정, PQ만 움직인다.</text></g>
</svg>
