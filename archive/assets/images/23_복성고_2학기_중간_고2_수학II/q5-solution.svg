<svg xmlns="http://www.w3.org/2000/svg" width="640" height="410" viewBox="0 0 640 410" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc">
  <title id="title">23 복성고 5번 극한과 불연속점 해설</title>
  <desc id="desc">x=−1,0,1의 branch와 열린 점·닫힌 점으로 극한 존재와 불연속을 구분한다</desc>
  <style>.background{fill:#fff}.axis{stroke:#171717;stroke-width:1.4;fill:none;stroke-linecap:round;stroke-linejoin:round}.curve{stroke:#111;stroke-width:2.1;fill:none;stroke-linecap:round;stroke-linejoin:round}.guide{stroke:#777;stroke-width:.95;stroke-dasharray:4 4;fill:none}.open{stroke:#111;stroke-width:1.4;fill:#fff}.closed{stroke:#111;stroke-width:1;fill:#111}.panel{fill:#f7f8fa;stroke:#c7cbd1;stroke-width:1}.target{fill:#e7eef5;stroke:#55718a;stroke-width:1.1}.title{font-family:"Noto Sans KR","Pretendard","Malgun Gothic",sans-serif;font-size:15px;font-weight:700;fill:#111}.label{font-family:"Noto Sans KR","Pretendard","Malgun Gothic",sans-serif;font-size:12px;fill:#222}.small{font-family:"Noto Sans KR","Pretendard","Malgun Gothic",sans-serif;font-size:11px;fill:#333}.math{font-family:"STIX Two Math","Cambria Math","Times New Roman",serif;font-size:13px;fill:#111}</style>
  <defs><marker id="axis-arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L6,3 L0,6 Z" fill="#171717"/></marker></defs>
  <rect class="background" x="0" y="0" width="640" height="410"/><text class="title" x="32" y="28">q5  극한이 없는 점과 불연속점</text><text class="small" x="32" y="47">좌우 접근값이 다르면 극한이 없고, 극한과 실제 점의 값이 다르면 불연속이다.</text>
  <g aria-label="graph"><rect class="panel" x="32" y="65" width="350" height="260" rx="8"/><line class="axis" x1="52" y1="220" x2="365" y2="220" marker-end="url(#axis-arrow)"/><line class="axis" x1="205" y1="305" x2="205" y2="82" marker-end="url(#axis-arrow)"/><path class="curve" d="M55 150 L130 180 L155 180"/><path class="curve" d="M155 120 L205 90 L255 150"/><path class="curve" d="M255 180 L300 220 L350 180"/><circle class="open" cx="155" cy="180" r="4.6"/><circle class="closed" cx="155" cy="120" r="4"/><circle class="open" cx="205" cy="90" r="4.6"/><circle class="closed" cx="205" cy="180" r="4"/><circle class="open" cx="255" cy="150" r="4.6"/><circle class="closed" cx="255" cy="180" r="4"/><line class="guide" x1="155" y1="120" x2="155" y2="220"/><line class="guide" x1="205" y1="90" x2="205" y2="220"/><line class="guide" x1="255" y1="150" x2="255" y2="220"/><text class="label" x="149" y="242">−1</text><text class="label" x="199" y="242">0</text><text class="label" x="249" y="242">1</text><text class="small" x="58" y="286">특이점: −1, 0, 1</text><text class="math" x="352" y="225">x</text><text class="math" x="211" y="90">y</text></g>
  <g aria-label="count panel"><rect class="panel" x="400" y="65" width="208" height="260" rx="8"/><text class="title" x="418" y="92">개수 세기</text><text class="small" x="418" y="128">극한 불존재: x=0</text><text class="small" x="418" y="158">불연속: x=−1,0,1</text><line class="guide" x1="418" y1="177" x2="590" y2="177"/><text class="math" x="418" y="212">a=0</text><text class="math" x="418" y="242">b=3</text><text class="label" x="418" y="281">a+b=3  (정답: ③)</text><text class="small" x="418" y="310">극한 불존재 점은 불연속에도 포함된다.</text></g>
</svg>
