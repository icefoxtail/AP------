<svg xmlns="http://www.w3.org/2000/svg" width="640" height="430" viewBox="0 0 640 430" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc">
  <title id="title">23 복성고 21번 합성함수의 연속 조건 해설</title>
  <desc id="desc">입력 함수 f의 x=0,1 불연속과 바깥 함수 g의 g(1)=g(2)=g(3) 조건을 연결한다</desc>
  <style>.background{fill:#fff}.axis{stroke:#171717;stroke-width:1.4;fill:none;stroke-linecap:round;stroke-linejoin:round}.curve{stroke:#111;stroke-width:2.1;fill:none;stroke-linecap:round;stroke-linejoin:round}.guide{stroke:#777;stroke-width:.95;stroke-dasharray:4 4;fill:none}.open{stroke:#111;stroke-width:1.4;fill:#fff}.closed{stroke:#111;stroke-width:1;fill:#111}.panel{fill:#f7f8fa;stroke:#c7cbd1;stroke-width:1}.title{font-family:"Noto Sans KR","Pretendard","Malgun Gothic",sans-serif;font-size:15px;font-weight:700;fill:#111}.label{font-family:"Noto Sans KR","Pretendard","Malgun Gothic",sans-serif;font-size:12px;fill:#222}.small{font-family:"Noto Sans KR","Pretendard","Malgun Gothic",sans-serif;font-size:11px;fill:#333}.math{font-family:"STIX Two Math","Cambria Math","Times New Roman",serif;font-size:13px;fill:#111}</style>
  <defs><marker id="axis-arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L6,3 L0,6 Z" fill="#171717"/></marker></defs>
  <rect class="background" x="0" y="0" width="640" height="430"/><text class="title" x="32" y="28">q21  불연속 입력을 합성으로 닫기</text><text class="small" x="32" y="47">f의 좌우 접근값을 g에서 같은 값으로 보내면 g∘f가 연속이 된다.</text>
  <g aria-label="piecewise input graph"><rect class="panel" x="32" y="65" width="315" height="270" rx="8"/><line class="axis" x1="50" y1="235" x2="330" y2="235" marker-end="url(#axis-arrow)"/><line class="axis" x1="145" y1="305" x2="145" y2="82" marker-end="url(#axis-arrow)"/><path class="curve" d="M55 270 L145 180"/><path class="curve" d="M145 180 L205 180"/><path class="curve" d="M205 180 L300 90"/><circle class="open" cx="145" cy="180" r="4.6"/><circle class="closed" cx="145" cy="215" r="4"/><circle class="open" cx="205" cy="180" r="4.6"/><circle class="closed" cx="205" cy="145" r="4"/><line class="guide" x1="145" y1="180" x2="145" y2="235"/><line class="guide" x1="205" y1="180" x2="205" y2="235"/><text class="label" x="138" y="255">0</text><text class="label" x="198" y="255">1</text><text class="math" x="96" y="180">1</text><text class="math" x="214" y="140">3</text><text class="small" x="56" y="298">x=0: 1↔2</text><text class="small" x="165" y="298">x=1: 2↔3</text></g>
  <g aria-label="cubic condition panel"><rect class="panel" x="365" y="65" width="243" height="270" rx="8"/><text class="title" x="383" y="92">g의 값 맞추기</text><text class="math" x="383" y="126">g(1)=g(2)</text><text class="math" x="383" y="154">g(2)=g(3)</text><text class="math" x="383" y="182">3a+b=−7</text><text class="math" x="383" y="210">5a+b=−19</text><line class="guide" x1="383" y1="224" x2="590" y2="224"/><text class="math" x="383" y="255">a=−6, b=11</text><text class="label" x="383" y="294">g∘f 연속 조건 성립</text><text class="small" x="383" y="320">g(1),g(2),g(3)를 하나로 연결한다.</text></g>
</svg>
