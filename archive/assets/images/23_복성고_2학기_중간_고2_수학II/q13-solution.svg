<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc">
  <title id="title">23 복성고 13번 접선과 재교점 해설</title>
  <desc id="desc">곡선 y=x³−4x의 점 A=(1,−3), 접선 y=−x−2, 재교점 B=(−2,0)와 B에서의 접선 기울기 8을 표시한다</desc>
  <style>.background{fill:#fff}.axis{stroke:#171717;stroke-width:1.4;fill:none;stroke-linecap:round;stroke-linejoin:round}.curve{stroke:#111;stroke-width:2.1;fill:none;stroke-linecap:round;stroke-linejoin:round}.tangent{stroke:#3f4a5a;stroke-width:1.7;fill:none;stroke-linecap:round;stroke-linejoin:round}.guide{stroke:#777;stroke-width:.95;stroke-dasharray:4 4;fill:none}.point{stroke:#111;stroke-width:1;fill:#111}.panel{fill:#f7f8fa;stroke:#c7cbd1;stroke-width:1}.title{font-family:"Noto Sans KR","Pretendard","Malgun Gothic",sans-serif;font-size:15px;font-weight:700;fill:#111}.label{font-family:"Noto Sans KR","Pretendard","Malgun Gothic",sans-serif;font-size:12px;fill:#222}.small{font-family:"Noto Sans KR","Pretendard","Malgun Gothic",sans-serif;font-size:11px;fill:#333}.math{font-family:"STIX Two Math","Cambria Math","Times New Roman",serif;font-size:13px;fill:#111}</style>
  <defs><marker id="axis-arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L6,3 L0,6 Z" fill="#171717"/></marker></defs>
  <rect class="background" x="0" y="0" width="640" height="400"/><text class="title" x="32" y="28">q13  접선과 삼차곡선의 재교점</text><text class="small" x="32" y="47">첫 접선과 곡선을 연립해 중복 접점 뒤의 다른 교점을 찾는다.</text>
  <g aria-label="curve graph"><rect class="panel" x="32" y="65" width="330" height="245" rx="8"/><line class="axis" x1="52" y1="215" x2="345" y2="215" marker-end="url(#axis-arrow)"/><line class="axis" x1="180" y1="280" x2="180" y2="82" marker-end="url(#axis-arrow)"/><path class="curve" d="M55 280 C95 245 120 180 155 135 C180 105 210 135 230 205 C248 255 280 285 340 270"/><path class="tangent" d="M70 180 L300 250"/><path class="tangent" d="M52 300 L310 90"/><circle class="point" cx="230" cy="205" r="3.8"/><circle class="point" cx="95" cy="250" r="3.8"/><text class="label" x="235" y="199">A=(1,−3)</text><text class="label" x="63" y="244">B=(−2,0)</text><text class="math" x="190" y="188">y=−x−2</text><text class="math" x="250" y="105">B tangent slope 8</text><text class="math" x="337" y="220">x</text><text class="math" x="186" y="90">y</text></g>
  <g aria-label="calculation"><rect class="panel" x="380" y="65" width="228" height="245" rx="8"/><text class="title" x="398" y="92">재교점 계산</text><text class="math" x="398" y="126">y′=3x²−4</text><text class="math" x="398" y="154">A tangent: y=−x−2</text><text class="math" x="398" y="182">(x−1)²(x+2)=0</text><line class="guide" x1="398" y1="197" x2="590" y2="197"/><text class="small" x="398" y="228">B의 x좌표 = −2</text><text class="label" x="398" y="264">y′(−2)=8  (정답: ①)</text><text class="small" x="398" y="294">중복 접점 x=1을 제외한다.</text></g>
</svg>
