<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" width="480" height="320" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">합동인 두 사다리꼴을 이어 붙여 만든 직사각형으로, 한 사다리꼴의 윗변에 2a, 아랫변에 b, 높이에 2a-b가 표시되어 있다.</title><desc id="visual-desc">직사각형이 비스듬한 선분 하나로 합동인 두 사다리꼴로 나뉘어 있고, 왼쪽 사다리꼴의 윗변에 2a, 아랫변에 b, 높이에 2a-b가 치수선과 함께 표시되어 있다.</desc><rect width="480" height="320" fill="#fff"/><g data-layer="30"><line id="sP0S" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="118.75002133" y1="245.02482333" x2="175.433236883" y2="245.02482333"/></g><g data-layer="30"><line id="sSP1" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="175.433236883" y1="245.02482333" x2="402.166099095" y2="245.02482333"/></g><g data-layer="30"><line id="sP1P2" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="402.166099095" y1="245.02482333" x2="402.166099095" y2="74.97517667"/></g><g data-layer="30"><line id="sP2T" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="402.166099095" y1="74.97517667" x2="345.482883542" y2="74.97517667"/></g><g data-layer="30"><line id="sTP3" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="345.482883542" y1="74.97517667" x2="118.75002133" y2="74.97517667"/></g><g data-layer="30"><line id="sP3P0" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="118.75