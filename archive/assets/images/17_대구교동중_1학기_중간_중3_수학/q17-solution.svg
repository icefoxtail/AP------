<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 600" width="720" height="600" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">√5는 약 2.24, √7은 약 2.65이므로 그 사이에는 무리수가 무수히 많다. 예를 들어 √21/2, √22/2, √23/2, √6, √26/2는 모두 √5보다 크고 √7보다 작은 무리수이다. 따라서 답은 √21/2, √22/2, √23/2, √6, √26/2이다.</title><desc id="visual-desc">가로선 위에 √5와 √7의 위치가 표시되어 있고, 그 사이에 다섯 개의 작은 점이 놓여 있다.</desc><rect width="720" height="600" fill="#fff"/><g data-layer="30"><line id="sAxis" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="67.142857143" y1="300" x2="652.857142857" y2="300"/></g><g data-layer="52"><line id="d5-ext-from" data-role="indicator" stroke="#111" stroke-width="0.8" fill="none" data-mark="dimension" data-mark-id="d5" data-mark-part="ext-from" x1="67.142857143" y1="304" x2="67.142857143" y2="371"/></g><g data-layer="52"><line id="d5-ext-to" data-role="indicator" stroke="#111" stroke-width="0.8" fill="none" data-mark="dimension" data-mark-id="d5" data-mark-part="ext-to" x1="503.695238095" y1="304" x2="503.695238095" y2="371"/></g><g data-layer="52"><line id="d5-line" data-role="indicator" stroke="#111" stroke-width="1.0" fill="none" data-mark="dimension" data-mark-id="d5" data-mark-part="line" x1="67.142857143" y1="368" x2="503.695238095" y2="368"/></g><g data-layer="52"><polygon id="d5-arrow-from" data-role="indicator" stroke="#111" stroke