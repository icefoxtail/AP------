<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 460" width="700" height="460" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">첫째 항은 a(2−√2), 둘째 항은 2√2−2이므로 두 항의 합은 (2a−2)+(2−a)√2이다. 이 값이 유리수가 되려면 √2의 계수가 0이어야 하므로 2−a=0, 즉 a=2이다. 이때 주어진 식의 값은 2a−2=2이다. 따라서 답은 ④이다.</title><desc id="visual-desc">다섯 개의 가로선이 위아래로 놓이고, 각 선 위에 두 항을 간단히 한 결과와 합한 식, a의 값, 식의 값이 차례로 적힌 풀이 흐름 그림이다.</desc><rect width="700" height="460" fill="#fff"/><g data-layer="30"><line id="s1" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="173.214285714" y1="53.214285714" x2="526.785714286" y2="53.214285714"/></g><g data-layer="30"><line id="s2" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="173.214285714" y1="141.607142857" x2="526.785714286" y2="141.607142857"/></g><g data-layer="30"><line id="s3" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="173.214285714" y1="230" x2="526.785714286" y2="230"/></g><g data-layer="30"><line id="s4" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="173.214285714" y1="318.392857143" x2="526.785714286" y2="318.392857143"/></g><g data-layer="30"><line id="s5" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="173.214285714" y1="406.785714286" x2="526.785714286" y2="406.785714286"/></g><g data-layer="90"><g id="l1" data-label-kind="EQUATION_LABEL" data-