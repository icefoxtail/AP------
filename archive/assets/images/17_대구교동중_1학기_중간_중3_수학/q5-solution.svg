<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 320" width="420" height="320" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">√10은 3.16…으로 3보다 크므로 √10&lt;3은 거짓이다. √40&gt;√30과 −√7&lt;−√5는 참이다. √(1/3)&gt;1/4과 √2+1&lt;√2+√3도 참이다. 따라서 답은 ①이다.</title><desc id="visual-desc">왼쪽 끝을 맞춘 두 개의 가로 막대가 위아래로 놓여 있고, 위 막대에는 √10, 아래 막대에는 3이 적혀 있다. 아래 막대의 오른쪽 끝에서 위로 올린 점선은 위 막대의 끝보다 왼쪽에 있어, 위 막대가 오른쪽으로 조금 더 길게 뻗어 있다.</desc><rect width="420" height="320" fill="#fff"/><g data-layer="30"><line id="s1" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="51.071428571" y1="109.7379597" x2="368.928571429" y2="109.7379597"/></g><g data-layer="30"><line id="s2" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="51.071428571" y1="210.2620403" x2="352.643670371" y2="210.2620403"/></g><g data-layer="30"><line id="sGuide" data-role="line" stroke="#111" stroke-width="1.6" fill="none" stroke-dasharray="6 4" x1="352.643670371" y1="210.2620403" x2="352.643670371" y2="109.7379597"/></g><g data-layer="90"><g id="t1" data-label-kind="EQUATION_LABEL" data-priority="1" data-font-px="20" data-owner="s1" data-fragment-sha="sha256:85db2b4453a2a3cf5a3723e3aede607ac8c037921b2a9b24d9f5acf22db0f6c3" transform="translate(191.47 80.5379597)"><svg xmlns="http://www.w3.org/2000/svg" width="37.06" height="21.2" viewBox="0 0 37.06 21.2" data-outline-wid