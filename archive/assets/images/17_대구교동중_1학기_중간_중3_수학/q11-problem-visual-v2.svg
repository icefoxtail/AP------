<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 705 387" width="705" height="387" role="img" aria-labelledby="title desc"><title id="title">넓이 종류에 따라 그린 정사각형과 직사각형 조각</title><desc id="desc">왼쪽부터 넓이 x²인 같은 정사각형 두 개, 넓이 x인 같은 직사각형 세 개, 넓이 1인 작은 정사각형 하나를 늘어놓았다. 큰 정사각형의 변은 x, 직사각형의 변은 x와 1, 작은 정사각형의 변은 1이다.</desc><rect width="705" height="387" fill="white" /><rect x="80" y="136" width="105" height="105" fill="#e7f0fa" stroke="#205d9c" stroke-width="4.2" /><text x="132.5000" y="196.5000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#205d9c" text-anchor="middle">x²</text><text x="132.5000" y="119.0000" font-size="27" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#586574" text-anchor="middle">x</text><text x="195.0000" y="197.5000" font-size="26" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#586574" text-anchor="start">x</text><rect x="214" y="136" width="105" height="105" fill="#e7f0fa" stroke="#205d9c" stroke-width="4.2" /><text x="266.5000" y="196.5000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#205d9c" text-anchor="middle">x²</text><text x="266.5000" y="119.0000" font-size="27" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#586574" text-anchor="middle">x</text><text x="329.0000" y="197.5000" font-size="26" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#586574" text-anchor="start">x</text><rect x="348" y="136" width="38" height="105" fill="#e9f3e9" stroke="#266f73" stroke-width="4.2" /><text x="367.0000" y="196.5000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#266f73" text-anchor="middle">x</text><text x="367.0000" y="119.0000" font-size="27" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#586574" text-anchor="middle">1</text><text x="396.0000" y="197.5000" font-size="26" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#586574" text-anchor="start">x</text><rect x="415" y="136" width="38" height="105" fill="#e9f3e9" stroke="#266f73" stroke-width="4.2" /><text x="434.0000" y="196.5000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#266f73" text-anchor="middle">x</text><text x="434.0000" y="119.0000" font-size="27" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#586574" text-anchor="middle">1</text><text x="463.0000" y="197.5000" font-size="26" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#586574" text-anchor="start">x</text><rect x="482" y="136" width="38" height="105" fill="#e9f3e9" stroke="#266f73" stroke-width="4.2" /><text x="501.0000" y="196.5000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#266f73" text-anchor="middle">x</text><text x="501.0000" y="119.0000" font-size="27" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#586574" text-anchor="middle">1</text><text x="530.0000" y="197.5000" font-size="26" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#586574" text-anchor="start">x</text><rect x="549" y="203" width="38" height="38" fill="#faecdc" stroke="#aa5411" stroke-width="4.2" /><text x="568.0000" y="230.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#aa5411" text-anchor="middle">1</text><text x="568.0000" y="186.0000" font-size="27" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#586574" text-anchor="middle">1</text></svg>
