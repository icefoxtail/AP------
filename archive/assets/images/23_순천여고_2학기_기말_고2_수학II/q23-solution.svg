<svg xmlns="http://www.w3.org/2000/svg" width="720" height="430" viewBox="0 0 720 430" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc"><title id="title">23 순천여고 기말 q23 해설 구간분할</title><desc id="desc">0&lt;t&lt;2에서 절댓값 |x-t|를 t=x 기준으로 x-t와 t-x로 나누어 정적분을 계산한다.</desc><style>
.bg{fill:#fff}.axis{stroke:#171717;stroke-width:1.4;fill:none;stroke-linecap:round;stroke-linejoin:round}.curve{stroke:#111;stroke-width:2.0;fill:none;stroke-linecap:round;stroke-linejoin:round}.guide{stroke:#777;stroke-width:1;stroke-dasharray:4 4;fill:none}.thin{stroke:#555;stroke-width:1.15;fill:none}.strong{stroke:#111;stroke-width:1.8;fill:none}.point{fill:#111}.open{fill:#fff;stroke:#111;stroke-width:1.3}.shade{fill:#eceff1;stroke:none}.panel{fill:#f7f8fa;stroke:#c7cbd1;stroke-width:1}.title{font-family:"NanumGothic","Noto Sans CJK KR","Malgun Gothic",sans-serif;font-size:16px;font-weight:700;fill:#111}.label{font-family:"NanumGothic","Noto Sans CJK KR","Malgun Gothic",sans-serif;font-size:13px;fill:#222}.small{font-family:"NanumGothic","Noto Sans CJK KR","Malgun Gothic",sans-serif;font-size:11.5px;fill:#333}.math{font-family:"STIX Two Math","Cambria Math","Times New Roman",serif;font-size:13px;fill:#111}.tick{font-family:"STIX Two Math","Cambria Math","Times New Roman",serif;font-size:11.5px;fill:#222}</style><defs><marker id="arr" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L6,3 L0,6 Z" fill="#171717"/></marker></defs><rect class="bg" x="0" y="0" width="720" height="430"/><text class="title" x="28" y="32">q23 |x-t|를 t=x에서 나누기</text>
<rect class="panel" x="45" y="63" width="630" height="130" rx="8"/>
<line class="axis" x1="90" y1="130" x2="630" y2="130"/>
<circle class="point" cx="120" cy="130" r="4"/><circle class="point" cx="360" cy="130" r="4"/><circle class="point" cx="600" cy="130" r="4"/>
<text class="tick" x="115" y="154">0</text><text class="tick" x="355" y="154">x</text><text class="tick" x="595" y="154">2</text>
<text class="label" x="175" y="108">|x-t|=x-t</text><text class="label" x="432" y="108">|x-t|=t-x</text>
<rect class="panel" x="45" y="222" width="630" height="155" rx="8"/>
<text class="math" x="67" y="252">f(x)=Int0ˣ t(x-t)dt + Intₓ^2 t(t-x)dt</text>
<text class="math" x="67" y="284">= x^3/3 - 2x + 8/3</text>
<text class="math" x="67" y="318">f'(x)=x^2-2</text>
<text class="label" x="67" y="352">f'(1)=-1</text></svg>