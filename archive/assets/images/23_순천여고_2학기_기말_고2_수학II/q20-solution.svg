<svg xmlns="http://www.w3.org/2000/svg" width="720" height="430" viewBox="0 0 720 430" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc"><title id="title">23 순천여고 기말 q20 해설 도식</title><desc id="desc">방정식의 서로 다른 실근 개수 함수 f(t)의 세 불연속점 -32, -5, 0을 표시하고 연속성을 위해 g가 세 점에서 0이어야 함을 정리한다.</desc><style>
.bg{fill:#fff}.axis{stroke:#171717;stroke-width:1.4;fill:none;stroke-linecap:round;stroke-linejoin:round}.curve{stroke:#111;stroke-width:2.0;fill:none;stroke-linecap:round;stroke-linejoin:round}.guide{stroke:#777;stroke-width:1;stroke-dasharray:4 4;fill:none}.thin{stroke:#555;stroke-width:1.15;fill:none}.strong{stroke:#111;stroke-width:1.8;fill:none}.point{fill:#111}.open{fill:#fff;stroke:#111;stroke-width:1.3}.shade{fill:#eceff1;stroke:none}.panel{fill:#f7f8fa;stroke:#c7cbd1;stroke-width:1}.title{font-family:"NanumGothic","Noto Sans CJK KR","Malgun Gothic",sans-serif;font-size:16px;font-weight:700;fill:#111}.label{font-family:"NanumGothic","Noto Sans CJK KR","Malgun Gothic",sans-serif;font-size:13px;fill:#222}.small{font-family:"NanumGothic","Noto Sans CJK KR","Malgun Gothic",sans-serif;font-size:11.5px;fill:#333}.math{font-family:"STIX Two Math","Cambria Math","Times New Roman",serif;font-size:13px;fill:#111}.tick{font-family:"STIX Two Math","Cambria Math","Times New Roman",serif;font-size:11.5px;fill:#222}</style><defs><marker id="arr" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L6,3 L0,6 Z" fill="#171717"/></marker></defs><rect class="bg" x="0" y="0" width="720" height="430"/><text class="title" x="28" y="32">q20 실근 개수 f(t)의 불연속점</text>
<rect class="panel" x="35" y="58" width="650" height="150" rx="8"/>
<text class="small" x="55" y="84">h(x)=x^2(x-6): h(0)=0 (극대), h(4)=-32 (극소), h(1)=-5</text>
<line class="axis" x1="65" y1="139" x2="655" y2="139"/>
<circle class="point" cx="210" cy="139" r="4"/><circle class="point" cx="400" cy="139" r="4"/><circle class="point" cx="565" cy="139" r="4"/>
<text class="tick" x="194" y="162">-32</text><text class="tick" x="391" y="162">-5</text><text class="tick" x="560" y="162">0</text>
<text class="small" x="76" y="119">f=2</text><text class="small" x="265" y="119">f=4</text><text class="small" x="455" y="119">f=4</text><text class="small" x="605" y="119">f=2</text>
<text class="small" x="176" y="189">f(-32)=3</text><text class="small" x="368" y="189">f(-5)=3</text><text class="small" x="540" y="189">f(0)=3</text>
<rect class="panel" x="35" y="230" width="650" height="150" rx="8"/>
<text class="label" x="58" y="259">f(t)g(t)가 연속 ⇒ 세 점에서 g=0</text>
<text class="math" x="58" y="290">g(x)=c*x(x+5)(x+32)   (deg g&lt;=3)</text>
<text class="math" x="58" y="321">g(-4)=c(-4)(1)(28)=28 ⇒ c=-1/4</text>
<text class="math" x="58" y="352">g(-1)=-1/4*(-1)*4*31=31 -&gt; 정답 ⑤</text></svg>