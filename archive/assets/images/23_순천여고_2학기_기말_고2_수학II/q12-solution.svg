<svg xmlns="http://www.w3.org/2000/svg" width="720" height="430" viewBox="0 0 720 430" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc"><title id="title">23 순천여고 기말 q12 해설 부호표</title><desc id="desc">도함수 그래프의 영점 -3, 1, 4에서 부호 변화를 읽어 f의 극대*극소와 보기의 참거짓을 판정한다.</desc><style>
.bg{fill:#fff}.axis{stroke:#171717;stroke-width:1.4;fill:none;stroke-linecap:round;stroke-linejoin:round}.curve{stroke:#111;stroke-width:2.0;fill:none;stroke-linecap:round;stroke-linejoin:round}.guide{stroke:#777;stroke-width:1;stroke-dasharray:4 4;fill:none}.thin{stroke:#555;stroke-width:1.15;fill:none}.strong{stroke:#111;stroke-width:1.8;fill:none}.point{fill:#111}.open{fill:#fff;stroke:#111;stroke-width:1.3}.shade{fill:#eceff1;stroke:none}.panel{fill:#f7f8fa;stroke:#c7cbd1;stroke-width:1}.title{font-family:"NanumGothic","Noto Sans CJK KR","Malgun Gothic",sans-serif;font-size:16px;font-weight:700;fill:#111}.label{font-family:"NanumGothic","Noto Sans CJK KR","Malgun Gothic",sans-serif;font-size:13px;fill:#222}.small{font-family:"NanumGothic","Noto Sans CJK KR","Malgun Gothic",sans-serif;font-size:11.5px;fill:#333}.math{font-family:"STIX Two Math","Cambria Math","Times New Roman",serif;font-size:13px;fill:#111}.tick{font-family:"STIX Two Math","Cambria Math","Times New Roman",serif;font-size:11.5px;fill:#222}</style><defs><marker id="arr" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L6,3 L0,6 Z" fill="#171717"/></marker></defs><rect class="bg" x="0" y="0" width="720" height="430"/><text class="title" x="28" y="32">q12 f'(x)의 부호로 f의 증감과 극값 판정</text>
<rect class="panel" x="38" y="61" width="644" height="145" rx="8"/>
<line class="axis" x1="72" y1="128" x2="648" y2="128"/>
<circle class="point" cx="205" cy="128" r="4"/><circle class="point" cx="365" cy="128" r="4"/><circle class="point" cx="525" cy="128" r="4"/>
<text class="tick" x="194" y="151">-3</text><text class="tick" x="360" y="151">1</text><text class="tick" x="520" y="151">4</text>
<text class="label" x="107" y="105">f' &gt; 0</text><text class="label" x="258" y="105">f' &lt; 0</text><text class="label" x="414" y="105">f' &gt; 0</text><text class="label" x="565" y="105">f' &lt; 0</text>
<text class="small" x="67" y="184">x=-3: 극대 * x=1: 극소 * x=4: 극대</text>
<rect class="panel" x="38" y="230" width="644" height="150" rx="8"/>
<text class="label" x="63" y="260">ㄱ O : x=4에서 f'가 +-&gt;-로 바뀐다.</text>
<text class="label" x="63" y="291">ㄴ X : [1,4]에서는 f'&gt;=0이므로 f는 계속 증가한다.</text>
<text class="label" x="63" y="322">ㄷ O : f(1)&gt;0이면 f=f(1)은 3근, f=-f(1)은 2근이다.</text>
<text class="label" x="63" y="353">따라서 |f(x)|=f(1)의 실근은 5개 -&gt; 정답 ③ (ㄱ, ㄷ)</text></svg>