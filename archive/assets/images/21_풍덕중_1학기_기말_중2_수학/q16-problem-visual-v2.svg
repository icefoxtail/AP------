<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 716 447" width="716" height="447" role="img" aria-labelledby="title desc"><title id="title">마름모의 두 대각선에 표시한 각</title><desc id="desc">위쪽 꼭짓점 A와 아래쪽 C, 왼쪽 B와 오른쪽 D를 각각 이었다. B의 위쪽 각은 30°이다. O의 왼쪽 위에 x, D의 왼쪽 위에 y를 표시했다.</desc><rect width="716" height="447" fill="white" /><line x1="358.0000" y1="65.8834" x2="85.0000" y2="223.5000" stroke="#202020" stroke-width="5.35" stroke-linecap="round" /><line x1="85.0000" y1="223.5000" x2="358.0000" y2="381.1166" stroke="#202020" stroke-width="5.35" stroke-linecap="round" /><line x1="358.0000" y1="381.1166" x2="631.0000" y2="223.5000" stroke="#202020" stroke-width="5.35" stroke-linecap="round" /><line x1="631.0000" y1="223.5000" x2="358.0000" y2="65.8834" stroke="#202020" stroke-width="5.35" stroke-linecap="round" /><line x1="358.0000" y1="65.8834" x2="358.0000" y2="381.1166" stroke="#227365" stroke-width="5" stroke-linecap="round" /><line x1="85.0000" y1="223.5000" x2="631.0000" y2="223.5000" stroke="#774698" stroke-width="5" stroke-linecap="round" /><path d="M 144.0000 223.5000 A 59 59 0 0 0 136.0955 194.0000" stroke="#a34c1f" stroke-width="2.25" fill="none" /><text x="176.7630" y="206.9122" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#a34c1f" text-anchor="middle">30°</text><path d="M 358.0000 189.5000 A 34 34 0 0 0 324.0000 223.5000" stroke="#227365" stroke-width="2.25" fill="none" /><text x="315.5736" y="189.0736" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#227365" text-anchor="middle">x</text><path d="M 578.1725 193.0000 A 61 61 0 0 0 570.0000 223.5000" stroke="#774698" stroke-width="2.25" fill="none" /><text x="548.8963" y="209.5004" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#774698" text-anchor="middle">y</text><circle cx="358.0" cy="65.88337651123217" r="4.9" fill="#28364b" /><text x="358.0000" y="49.8834" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">A</text><circle cx="85.0" cy="223.5" r="4.9" fill="#28364b" /><text x="65.0000" y="231.5000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">B</text><circle cx="358.0" cy="381.1166234887678" r="4.9" fill="#28364b" /><text x="358.0000" y="406.1166" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">C</text><circle cx="631.0" cy="223.5" r="4.9" fill="#28364b" /><text x="654.0000" y="231.5000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">D</text><circle cx="358.0" cy="223.5" r="4.9" fill="#28364b" /><text x="344.0000" y="247.5000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">O</text></svg>
