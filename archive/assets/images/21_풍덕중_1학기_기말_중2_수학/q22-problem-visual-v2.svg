<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 716 421" width="716" height="421" role="img" aria-labelledby="title desc"><title id="title">두 대각선이 O에서 만나는 사다리꼴</title><desc id="desc">사다리꼴에서 윗변 AD와 아랫변 BC가 평행하다. 보라색 BD와 청록색 AC는 O에서 만난다.</desc><rect width="716" height="421" fill="white" /><line x1="186.0000" y1="103.0000" x2="100.0000" y2="318.0000" stroke="#202020" stroke-width="5.35" stroke-linecap="round" /><line x1="100.0000" y1="318.0000" x2="616.0000" y2="318.0000" stroke="#202020" stroke-width="5.35" stroke-linecap="round" /><line x1="616.0000" y1="318.0000" x2="444.0000" y2="103.0000" stroke="#202020" stroke-width="5.35" stroke-linecap="round" /><line x1="444.0000" y1="103.0000" x2="186.0000" y2="103.0000" stroke="#202020" stroke-width="5.35" stroke-linecap="round" /><line x1="186.0000" y1="103.0000" x2="616.0000" y2="318.0000" stroke="#227365" stroke-width="5" stroke-linecap="round" /><line x1="100.0000" y1="318.0000" x2="444.0000" y2="103.0000" stroke="#774698" stroke-width="5" stroke-linecap="round" /><circle cx="186.0" cy="103.0" r="4.9" fill="#28364b" /><text x="170.0000" y="86.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">A</text><circle cx="100.0" cy="318.0" r="4.9" fill="#28364b" /><text x="83.0000" y="346.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">B</text><circle cx="616.0" cy="318.0" r="4.9" fill="#28364b" /><text x="635.0000" y="346.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">C</text><circle cx="444.0" cy="103.0" r="4.9" fill="#28364b" /><text x="463.0000" y="86.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">D</text><circle cx="329.3333333333333" cy="174.66666666666666" r="4.9" fill="#28364b" /><text x="348.3333" y