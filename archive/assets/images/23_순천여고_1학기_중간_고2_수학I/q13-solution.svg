<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-labelledby="title desc"><title id="title">로그함수의 대칭과 평행이동</title><desc id="desc">두 그래프는 y=2를 대칭축으로 하고 (4,2)에서 만난다.</desc><rect width="640" height="360" fill="#fff"/><line x1="75" y1="280" x2="560" y2="280" stroke="#374151" stroke-width="2" /><line x1="75" y1="52" x2="75" y2="315" stroke="#374151" stroke-width="2" /><polyline points="102.5,328 130,280 185,232 295,184 405,155.92 515,136" fill="none" stroke="#2563eb" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><polyline points="102.5,40 130,88 185,136 295,184 405,212.08 515,232" fill="none" stroke="#dc2626" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><line x1="75" y1="184" x2="560" y2="184" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="6 5"/><circle cx="295" cy="184" r="5" fill="#dc2626"/><text x="84" y="38" font-family="Arial,'Noto Sans KR',sans-serif" font-size="15" fill="#1d4ed8" >y=log2(x)</text><text x="378" y="77" font-family="Arial,'Noto Sans KR',sans-serif" font-size="15" fill="#b91c1c" >y=-log2(x)+4</text><text x="446" y="176" font-family="Arial,'Noto Sans KR',sans-serif" font-size="13" fill="#111827" >y=2</text><text x="303" y="176" font-family="Arial,'Noto Sans KR',sans-serif" font-size="13" fill="#111827" >(4,2)</text><text x="560" y="298" font-family="Arial,'Noto Sans KR',sans-serif" font-size="13" fill="#111827" >x</text></svg>