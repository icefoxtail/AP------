<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-labelledby="title desc"><title id="title">코사인 치역을 절댓값 구간으로 바꾸기</title><desc id="desc">f(x)-1 ranges over [k-3,k+1]; the two solutions for M-m=3 are 0 and 2.</desc><rect width="640" height="360" fill="#fff"/><line x1="95" y1="190" x2="565" y2="190" stroke="#374151" stroke-width="2" /><polygon points="155,174 155,206 385,206 385,174" fill="#bfdbfe" stroke="#2563eb" stroke-width="2"/><line x1="270" y1="150" x2="270" y2="232" stroke="#dc2626" stroke-width="2"/><text x="260" y="250" font-family="Arial,'Noto Sans KR',sans-serif" font-size="13" fill="#111827" >0</text><text x="132" y="165" font-family="Arial,'Noto Sans KR',sans-serif" font-size="13" fill="#111827" >k-3</text><text x="388" y="165" font-family="Arial,'Noto Sans KR',sans-serif" font-size="13" fill="#111827" >k+1</text><text x="225" y="128" font-family="Arial,'Noto Sans KR',sans-serif" font-size="16" fill="#111827" >u=f(x)-1</text><text x="300" y="88" font-family="Arial,'Noto Sans KR',sans-serif" font-size="15" fill="#111827" >range [k-3, k+1]</text><text x="80" y="302" font-family="Arial,'Noto Sans KR',sans-serif" font-size="14" fill="#111827" >if k=0: [-3,1]  |u|max=3</text><text x="80" y="327" font-family="Arial,'Noto Sans KR',sans-serif" font-size="14" fill="#111827" >if k=2: [-1,3]  |u|max=3</text><text x="82" y="53" font-family="Arial,'Noto Sans KR',sans-serif" font-size="15" fill="#b91c1c" >M-m=3 at k=0 or 2; product 0</text></svg>