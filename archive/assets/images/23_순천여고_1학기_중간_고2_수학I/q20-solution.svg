<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-labelledby="title" aria-describedby="desc"><title id="title">코사인 함수의 치역과 절댓값</title><desc id="desc">f(x)−1의 치역 구간 [k−3,k+1]과 두 해의 차 M−m=3인 조건을 나타낸다.</desc><rect width="640" height="360" fill="#fff"/><line x1="95" y1="190" x2="565" y2="190" stroke="#374151" stroke-width="2"/><polygon points="155,174 155,206 385,206 385,174" fill="#bfdbfe" stroke="#2563eb" stroke-width="2"/><line x1="270" y1="150" x2="270" y2="232" stroke="#dc2626" stroke-width="2"/><text x="260" y="250" font-family="Arial,'Noto Sans KR',sans-serif" font-size="13" fill="#111827">0</text><text x="132" y="165" font-family="Arial,'Noto Sans KR',sans-serif" font-size="13" fill="#111827">k-3</text><text x="388" y="165" font-family="Arial,'Noto Sans KR',sans-serif" font-size="13" fill="#111827">k+1</text><text x="225" y="128" font-family="Arial,'Noto Sans KR',sans-serif" font-size="16" fill="#111827">u=f(x)-1</text><text x="300" y="88" font-family="Arial,'Noto Sans KR',sans-serif" font-size="15" fill="#111827">치역 [k-3, k+1]</text><text x="80" y="302" font-family="Arial,'Noto Sans KR',sans-serif" font-size="14" fill="#111827">k=0일 때 구간은 [-3,1], |u|의 최댓값=3</text><text x="80" y="327" font-family="Arial,'Noto Sans KR',sans-serif" font-size="14" fill="#111827">k=2일 때 구간은 [-1,3], |u|의 최댓값=3</text><text x="82" y="53" font-family="Arial,'Noto Sans KR',sans-serif" font-size="15" fill="#b91c1c">k=0 또는 2일 때 M−m=3이고 곱은 0</text></svg>