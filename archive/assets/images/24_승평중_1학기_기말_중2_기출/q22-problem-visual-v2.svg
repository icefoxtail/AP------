<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 744 528" width="744" height="528" role="img" aria-labelledby="title desc"><title id="title">세 꼭짓점이 좌표축에 놓인 두 직선의 그래프</title><desc id="desc">오르막인 y=ax+2와 내리막인 y=−x+b가 세로축에서 A로 만난다. 왼쪽 오르막은 가로축의 B, 오른쪽 내리막은 C를 지난다.</desc><rect width="744" height="528" fill="white" /><polygon points="109.8947,385.2222 563.2105,247.4444 578.8421,385.2222" fill="none" /><line x1="63.0000" y1="385.2222" x2="643.0000" y2="385.2222" stroke="#65788a" stroke-width="2.2" stroke-linecap="round" /><polygon points="657.0000,385.2222 643.0000,379.6222 643.0000,390.8222" fill="#65788a" /><line x1="563.2105" y1="461.0000" x2="563.2105" y2="103.0000" stroke="#65788a" stroke-width="2.2" stroke-linecap="round" /><polygon points="563.2105,89.0000 557.6105,103.0000 568.8105,103.0000" fill="#65788a" /><line x1="63.0000" y1="399.4751" x2="657.0000" y2="218.9387" stroke="#24659b" stroke-width="7.0" stroke-linecap="round" /><line x1="546.4066" y1="99.3333" x2="586.3453" y2="451.3556" stroke="#a74c1b" stroke-width="6.8" stroke-linecap="round" stroke-dasharray="12 7" /><circle cx="563.2105263157895" cy="247.44444444444446" r="6.0" fill="#273a49" stroke="white" stroke-width="1.6" /><text x="539.2105" y="231.4444" font-size="30" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#273a49" text-anchor="middle">A</text><circle cx="109.89473684210526" cy="385.22222222222223" r="6.0" fill="#273a49" stroke="white" stroke-width="1.6" /><text x="97.8947" y="412.2222" font-size="30" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#273a49" text-anchor="middle">B</text><circle cx="578.8421052631579" cy="385.22222222222223" r="6.0" fill="#273a49" stroke="white" stroke-width="1.6" /><text x="610.8421" y="412.2222" font-size="30" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#273a49" text-anchor="middle">C</text><text x="680.0000" y="378.2222" font-size="30" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#65788a" text-anchor="middle">x</text><text x="580.2105" y="81.0000" font-size="30" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#65788a" text-anchor="middle">y</text><line x1="76.0000" y1="39.0000" x2="121.0000" y2="39.0000" stroke="#24659b" stroke-width="5.65" stroke-linecap="round" /><text x="132.0000" y="46.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#24659b" text-anchor="start">y = ax + 2</text><line x1="366.0000" y1="39.0000" x2="411.0000" y2="39.0000" stroke="#a74c1b" stroke-width="5.65" stroke-linecap="round" stroke-dasharray="12 7" /><text x="422.0000" y="46.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#a74c1b" text-anchor="start">y = −x + b</text></svg>
