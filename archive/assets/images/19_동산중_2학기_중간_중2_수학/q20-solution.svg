<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 384 320" width="384" height="320" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">등변사다리꼴이므로 점 D에서 BC에 내린 수선의 발을 H′이라 하면 BH=H′C이고 HH′=AD=3cm이다. 따라서 BH=(BC−AD)/2=(5−3)/2=1cm이다. 답은 ①이다.</title><desc id="visual-desc">등변사다리꼴 ABCD에서 윗변 AD 3, 아랫변 BC 5가 적혀 있고 A에서 BC로 내린 수선의 발 H에 직각 표시가 있으며 BH 1, HC 4가 적혀 있고 두 다리 AB와 CD에 같은 눈금이 있다.</desc><rect width="384" height="320" fill="#fff"/><g data-layer="30"><line id="AB" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="117.691172653" y1="46.861765469" x2="68.151954421" y2="245.018638395"/></g><g data-layer="30"><line id="BH" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="68.151954421" y1="245.018638395" x2="117.691172653" y2="245.018638395"/></g><g data-layer="30"><line id="HC" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="117.691172653" y1="245.018638395" x2="315.848045579" y2="245.018638395"/></g><g data-layer="30"><line id="CD" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="315.848045579" y1="245.018638395" x2="266.308827347" y2="46.861765469"/></g><g data-layer="30"><line id="DA" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="266.308827347" y1="46.861765469" x2="117.691172653" y2="46.861765469"/></g><g data-layer="30"><line id="AH" data-role="line" stroke=