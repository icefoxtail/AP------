<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 400" width="480" height="400" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">평행사변형의 두 대각선은 서로 다른 것을 이등분하므로 AO=AC/2=4cm이고 OD=BD/2=6cm이다. 또 AD=BC=10cm이므로 삼각형 AOD의 둘레의 길이는 4+6+10=20cm이다. 따라서 답은 ②이다.</title><desc id="visual-desc">평행사변형 ABCD의 두 대각선이 점 O에서 만나고, 선분 AO와 OD에 각각 4와 6, 변 BC와 AD에 10이 표시되어 있다.</desc><rect width="480" height="400" fill="#fff"/><g data-layer="30"><line id="sAB" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="116.19047619" y1="107.142857143" x2="54.285714286" y2="292.857142857"/></g><g data-layer="30"><line id="sBC" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="54.285714286" y1="292.857142857" x2="363.80952381" y2="292.857142857"/></g><g data-layer="30"><line id="sCD" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="363.80952381" y1="292.857142857" x2="425.714285714" y2="107.142857143"/></g><g data-layer="30"><line id="sDA" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="425.714285714" y1="107.142857143" x2="116.19047619" y2="107.142857143"/></g><g data-layer="30"><line id="sAO" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="116.19047619" y1="107.142857143" x2="240" y2="200"/></g><g data-layer="30"><line id="sOC" data-role="line" stroke="#111" stroke-width="1.6" fill="none