<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 384 320" width="384" height="320" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">예: 직각삼각형 ABC와 DEF(직각은 C, F)를 빗변 AB=DE로 그렸다. 빗변과 한 변, 또는 빗변과 한 예각이 같으면 RHS, RHA 합동이고, 한 예각과 한 변이 같아도 합동이 된다(①~④). 그러나 ⑤처럼 빗변 AB=DE 하나만 같으면 그림처럼 다른 모양의 삼각형이 될 수 있어 합동이라고 할 수 없다. 따라서 합동이 되지 않는 조건은 ⑤이다.</title><desc id="visual-desc">빗변의 길이가 같은 두 직각삼각형 ABC와 DEF가 나란히 있고 각각 직각 표시가 있으며 빗변 AB와 DE에 같은 눈금이 있다. 두 삼각형의 예각의 크기가 서로 다르다.</desc><rect width="384" height="320" fill="#fff"/><g data-layer="30"><line id="AB" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="168.19047619" y1="189.309754554" x2="49.142857143" y2="189.309754554"/></g><g data-layer="30"><line id="BC" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="49.142857143" y1="189.309754554" x2="119.002867718" y2="130.690245446"/></g><g data-layer="30"><line id="CA" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="119.002867718" y1="130.690245446" x2="168.19047619" y2="189.309754554"/></g><g data-layer="30"><line id="DE" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="334.857142857" y1="189.309754554" x2="215.80952381" y2="189.309754554"/></g><g data-layer="30"><line id="EF" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="215.80952381" y1="189.309754554" x2="245.571428571" 