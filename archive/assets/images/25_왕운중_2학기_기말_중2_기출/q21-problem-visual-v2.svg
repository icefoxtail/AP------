<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 612 610" width="612" height="610" role="img" aria-labelledby="title desc"><title id="title">좌표축과 직선 위에 내린 수선</title><desc id="desc">파란 직선은 세로축의 위쪽 B부터 가로축의 오른쪽 A를 지나 아래로 내려간다. 두 축이 만나는 원점 O에서 직선으로 내린 청록색 수선의 발은 C이고, 직각이 표시돼 있다.</desc><rect width="612" height="610" fill="white" /><line x1="125.0000" y1="512.0000" x2="462.0000" y2="512.0000" stroke="#586574" stroke-width="2.05" stroke-linecap="round" /><polygon points="475.0000,512.0000 462.0000,506.8000 462.0000,517.2000" fill="#586574" /><line x1="195.0000" y1="561.0000" x2="195.0000" y2="84.0000" stroke="#586574" stroke-width="2.05" stroke-linecap="round" /><polygon points="195.0000,71.0000 189.8000,84.0000 200.2000,84.0000" fill="#586574" /><polygon points="195.0000,512.0000 370.0000,512.0000 195.0000,92.0000" fill="#eaf3fa" /><line x1="186.2500" y1="71.0000" x2="390.4167" y2="561.0000" stroke="#205d9c" stroke-width="6.85" stroke-linecap="round" /><line x1="195.0000" y1="512.0000" x2="344.1124" y2="449.8698" stroke="#266f73" stroke-width="5.4" stroke-linecap="round" /><line x1="330.2663" y1="455.6391" x2="336.0355" y2="469.4852" stroke="#266f73" stroke-width="2" stroke-linecap="round" /><line x1="336.0355" y1="469.4852" x2="349.8817" y2="463.7160" stroke="#266f73" stroke-width="2" stroke-linecap="round" /><circle cx="370.0" cy="512.0" r="6.5" fill="#266f73" stroke="white" stroke-width="2" /><circle cx="195.0" cy="92.0" r="6.5" fill="#266f73" stroke="white" stroke-width="2" /><circle cx="344.112426035503" cy="449.8698224852071" r="6.5" fill="#266f73" stroke="white" stroke-width="2" /><text x="491.000" y="499.000" fill="#586574" font-size="29" font-weight="600" font-family="Malgun Gothic, Cambria Math, sans-serif" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="4.0" stroke-linejoin="round">x</text><text x="214.000" y="66.000" fill="#586574" font-size="29" font-weight="600" font-family="Malgun Gothic, Cambria Math, sans-serif" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="4.0" stroke-linejoin="round">y</text><text x="176.000" y="543.000" fill="#586574" font-size="29" font-weight="600" font-family="Malgun Gothic, Cambria Math, sans-serif" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="4.0" stroke-linejoin="round">O</text><text x="377.000" y="545.000" fill="#28364b" font-size="29" font-weight="600" font-family="Malgun Gothic, Cambria Math, sans-serif" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="4.0" stroke-linejoin="round">A</text><text x="174.000" y="86.000" fill="#28364b" font-size="29" font-weight="600" font-family="Malgun Gothic, Cambria Math, sans-serif" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="4.0" stroke-linejoin="round">B</text><text x="363.112" y="431.870" fill="#28364b" font-size="29" font-weight="600" font-family="Malgun Gothic, Cambria Math, sans-serif" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="4.0" stroke-linejoin="round">C</text></svg>
