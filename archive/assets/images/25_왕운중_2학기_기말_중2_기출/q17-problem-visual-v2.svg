<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 735 547" width="735" height="547" role="img" aria-labelledby="title desc"><title id="title">두 삼각형과 조건 카드 네 장</title><desc id="desc">두 삼각형에서 BC는 12 cm, EF는 6 cm, ED는 7 cm이다. B와 E의 각에 같은 표시가 있다. 아래 카드에는 AC=14 cm, DF=7 cm, A의 각과 D의 각이 같다는 조건, AB=14 cm가 하나씩 적혀 있다.</desc><rect width="735" height="547" fill="white" /><polygon points="122.0000,70.0000 44.0000,228.0000 300.0000,228.0000" fill="#e8f3fa" /><line x1="122.0000" y1="70.0000" x2="44.0000" y2="228.0000" stroke="#205d9c" stroke-width="4.45" stroke-linecap="round" /><line x1="44.0000" y1="228.0000" x2="300.0000" y2="228.0000" stroke="#205d9c" stroke-width="4.45" stroke-linecap="round" /><line x1="300.0000" y1="228.0000" x2="122.0000" y2="70.0000" stroke="#205d9c" stroke-width="4.45" stroke-linecap="round" /><polygon points="509.3682,77.3568 435.0000,228.0000 579.0000,228.0000" fill="#e4f2ea" /><line x1="509.3682" y1="77.3568" x2="435.0000" y2="228.0000" stroke="#266f73" stroke-width="4.45" stroke-linecap="round" /><line x1="435.0000" y1="228.0000" x2="579.0000" y2="228.0000" stroke="#266f73" stroke-width="4.45" stroke-linecap="round" /><line x1="579.0000" y1="228.0000" x2="509.3682" y2="77.3568" stroke="#266f73" stroke-width="4.45" stroke-linecap="round" /><circle cx="122" cy="70" r="4" fill="#28364b" /><text x="118.0000" y="56.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">A</text><circle cx="44" cy="228" r="4" fill="#28364b" /><text x="28.0000" y="249.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">B</text><circle cx="300" cy="228" r="4" fill="#28364b" /><text x="317.0000" y="249.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">C</text><circle cx="509.3681656756598" cy="77.35679260571482" r="4" fill="#28364b" /><text x="511.3682" y="62.3568" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">D</text><circle cx="435" cy="228" r="4" fill="#28364b" /><text x="420.0000" y="250.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">E</text><circle cx="579" cy="228" r="4" fill="#28364b" /><text x="596.0000" y="249.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">F</text><path d="M 73.000 228.000 A 29 29 0 0 0 56.837 201.996" fill="none" stroke="#aa5411" stroke-width="2.65" /><path d="M 464.000 228.000 A 29 29 0 0 0 447.837 201.996" fill="none" stroke="#aa5411" stroke-width="2.65" /><text x="172.0000" y="277.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#205d9c" text-anchor="middle">12 cm</text><text x="507.0000" y="277.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#266f73" text-anchor="middle">6 cm</text><text x="418.1841" y="158.6784" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#266f73" text-anchor="middle">7 cm</text><rect x="87" y="330" width="263" height="76" rx="12" fill="#f2f7fb" stroke="#a7bfd3" stroke-width="2" /><text x="218.5000" y="378.0000" font-size="30" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">AC = 14 cm</text><rect x="386" y="330" width="263" height="76" rx="12" fill="#f2f7fb" stroke="#a7bfd3" stroke-width="2" /><text x="517.5000" y="378.0000" font-size="30" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">DF = 7 cm</text><rect x="87" y="427" width="263" height="76" rx="12" fill="#f2f7fb" stroke="#a7bfd3" stroke-width="2" /><text x="218.5000" y="475.0000" font-size="30" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">∠A = ∠D</text><rect x="386" y="427" width="263" height="76" rx="12" fill="#f2f7fb" stroke="#a7bfd3" stroke-width="2" /><text x="517.5000" y="475.0000" font-size="30" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">AB = 14 cm</text></svg>
