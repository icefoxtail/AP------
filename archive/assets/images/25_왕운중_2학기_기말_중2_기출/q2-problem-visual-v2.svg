<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 664 568" width="664" height="568" role="img" aria-labelledby="title desc"><title id="title">복사 용지를 차례로 반으로 나눈 그림</title><desc id="desc">세로가 긴 A0 용지의 위 절반은 A1이다. 아래 남은 직사각형은 왼쪽 A2와 오른쪽으로 나뉜다. 오른쪽 윗부분에 A3, 아랫부분 왼쪽에 A4가 있다.</desc><rect width="664" height="568" fill="white" /><rect x="169" y="44.0" width="322" height="227.68838354206832" fill="#e3f0fa" stroke="#205d9c" stroke-width="3.75" /><text x="330.0000" y="167.8442" font-size="32" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">A₁</text><rect x="169" y="271.6883835420683" width="161.0" height="227.68838354206832" fill="#dff0e7" stroke="#205d9c" stroke-width="3.75" /><text x="249.5000" y="395.5326" font-size="32" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">A₂</text><rect x="330.0" y="271.6883835420683" width="161.0" height="113.84419177103416" fill="#faecd8" stroke="#205d9c" stroke-width="3.75" /><text x="410.5000" y="338.6105" font-size="32" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">A₃</text><rect x="330.0" y="385.5325753131025" width="80.5" height="113.84419177103416" fill="#eee8f4" stroke="#205d9c" stroke-width="3.75" /><text x="370.2500" y="452.4547" font-size="32" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">A₄</text><rect x="410.5" y="385.5325753131025" width="80.5" height="113.84419177103416" fill="#f1f5f8" stroke="#205d9c" stroke-width="3.75" /><rect x="169" y="44" width="322" height="455.37676708413665" fill="none" stroke="#205d9c" stroke-width="4.6" /></svg>
