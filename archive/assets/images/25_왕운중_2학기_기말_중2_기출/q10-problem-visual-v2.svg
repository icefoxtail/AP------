<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 747 410" width="747" height="410" role="img" aria-labelledby="title desc"><title id="title">세 평행선과 일정한 폭의 액자</title><desc id="desc">왼쪽 ㄱ에서 평행한 세 선 l, m, n에 두 사선이 교차한다. 오른쪽 ㄴ의 바깥 액자는 15 cm×12 cm이고 테두리 폭은 위와 왼쪽으로 각각 2 cm 표시돼 있다. 안쪽 직사각형은 EFGH이다.</desc><rect width="747" height="410" fill="white" /><text x="55.0000" y="64.0000" font-size="31" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#205d9c" text-anchor="middle">ㄱ</text><text x="388.0000" y="54.0000" font-size="31" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#266f73" text-anchor="middle">ㄴ</text><line x1="91.0000" y1="115.0000" x2="334.0000" y2="115.0000" stroke="#586574" stroke-width="2.65" stroke-linecap="round" /><text x="70.0000" y="122.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#586574" text-anchor="middle">l</text><line x1="91.0000" y1="188.0000" x2="334.0000" y2="188.0000" stroke="#586574" stroke-width="2.65" stroke-linecap="round" /><text x="70.0000" y="195.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#586574" text-anchor="middle">m</text><line x1="91.0000" y1="279.0000" x2="334.0000" y2="279.0000" stroke="#586574" stroke-width="2.65" stroke-linecap="round" /><text x="70.0000" y="286.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#586574" text-anchor="middle">n</text><line x1="164.0000" y1="89.0000" x2="109.0000" y2="304.0000" stroke="#205d9c" stroke-width="4.45" stroke-linecap="round" /><line x1="234.0000" y1="89.0000" x2="263.0000" y2="304.0000" stroke="#266f73" stroke-width="4.45" stroke-linecap="round" /><circle cx="157.34883720930233" cy="115" r="4.7" fill="#28364b" /><circle cx="237.50697674418603" cy="115" r="4.7" fill="#28364b" /><circle cx="138.67441860465115" cy="188" r="4.7" fill="#28364b" /><circle cx="247.353488372093"