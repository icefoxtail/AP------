<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 753 529" width="753" height="529" role="img" aria-labelledby="title desc"><title id="title">지팡이와 피라미드가 땅에 드리운 그림자</title><desc id="desc">왼쪽의 세워 놓은 지팡이는 49 cm이고 그림자는 60 cm이다. 오른쪽 피라미드의 정사각형 밑면 한 모서리는 220 m이고 밑면 바깥 그림자는 70 m이다. 두 물체에 내리쬐는 빛의 방향을 같은 색으로 표시했다.</desc><rect width="753" height="529" fill="white" /><polygon points="94.0000,229.9500 94.0000,350.0000 241.0000,350.0000" fill="#ecf5fa" /><line x1="94.0000" y1="350.0000" x2="241.0000" y2="350.0000" stroke="#586574" stroke-width="3.2" stroke-linecap="round" /><line x1="94.0000" y1="350.0000" x2="94.0000" y2="229.9500" stroke="#205d9c" stroke-width="5.35" stroke-linecap="round" /><line x1="94.0000" y1="229.9500" x2="241.0000" y2="350.0000" stroke="#aa5411" stroke-width="4.3" stroke-linecap="round" /><line x1="110.0000" y1="350.0000" x2="110.0000" y2="334.0000" stroke="#586574" stroke-width="2.0" stroke-linecap="round" /><line x1="110.0000" y1="334.0000" x2="94.0000" y2="334.0000" stroke="#586574" stroke-width="2.0" stroke-linecap="round" /><text x="48.0000" y="295.9750" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#205d9c" text-anchor="middle">49 cm</text><text x="167.5000" y="399.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#586574" text-anchor="middle">60 cm</text><circle cx="94" cy="229.95" r="4" fill="#28364b" /><text x="82.0000" y="215.9500" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">A</text><circle cx="94" cy="350" r="4" fill="#28364b" /><text x="79.0000" y="377.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">B</text><circle cx="241.0" cy="350" r="4" fill="#28364b" /><text x="259.0000" y="372.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b"