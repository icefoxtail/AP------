<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 658 526" width="658" height="526" role="img" aria-labelledby="title desc"><title id="title">정육각형과 변을 따라 움직이는 점 P</title><desc id="desc">육각형의 여섯 꼭짓점은 왼쪽 위 A에서 시작하여 반시계 방향으로 B, C, D, E, F 순이다. 위쪽 가로변 AF는 길이가 1이다. 왼쪽 기울어진 변 AB를 따라 내려가는 주황색 화살표 옆에 점 P가 표시돼 있다.</desc><rect width="658" height="526" fill="white" /><polygon points="230.0000,95.2590 132.0000,265.0000 230.0000,434.7410 426.0000,434.7410 524.0000,265.0000 426.0000,95.2590" fill="#ecf5fb" /><line x1="230.0000" y1="95.2590" x2="132.0000" y2="265.0000" stroke="#205d9c" stroke-width="4.65" stroke-linecap="round" /><line x1="132.0000" y1="265.0000" x2="230.0000" y2="434.7410" stroke="#205d9c" stroke-width="4.65" stroke-linecap="round" /><line x1="230.0000" y1="434.7410" x2="426.0000" y2="434.7410" stroke="#205d9c" stroke-width="4.65" stroke-linecap="round" /><line x1="426.0000" y1="434.7410" x2="524.0000" y2="265.0000" stroke="#205d9c" stroke-width="4.65" stroke-linecap="round" /><line x1="524.0000" y1="265.0000" x2="426.0000" y2="95.2590" stroke="#205d9c" stroke-width="4.65" stroke-linecap="round" /><line x1="426.0000" y1="95.2590" x2="230.0000" y2="95.2590" stroke="#205d9c" stroke-width="4.65" stroke-linecap="round" /><text x="216.5000" y="81.8763" font-size="30" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">A</text><text x="105.0000" y="275.0000" font-size="30" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">B</text><text x="216.5000" y="468.1237" font-size="30" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">C</text><text x="439.5000" y="468.1237" font-size="30" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">D</text><text x="551.0000" y="275.0000" font-size="30" font-family="Malgun Gothic, Cambria Math, sans-serif" font-