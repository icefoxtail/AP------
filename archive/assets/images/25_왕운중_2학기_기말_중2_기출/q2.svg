<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 900" role="img" aria-labelledby="title desc">
  <title id="title">A0 용지 안의 A1, A2, A3, A4 용지 배치</title>
  <desc id="desc">큰 직사각형을 위아래로 나누고, 아래쪽을 다시 나누어 A1부터 A4까지의 용지 배치를 나타낸 도식</desc>
  <rect width="640" height="900" fill="#fff"/>
  <g fill="none" stroke="#111" stroke-width="4" shape-rendering="geometricPrecision">
    <rect x="20" y="20" width="600" height="860"/>
    <path d="M20 450H620 M320 450V880 M320 665H620 M480 665V880"/>
  </g>
  <g fill="#111" font-family="Georgia, 'Times New Roman', serif" font-size="42" text-anchor="middle" dominant-baseline="middle">
    <text x="320" y="235">A1</text>
    <text x="170" y="665">A2</text>
    <text x="470" y="555">A3</text>
    <text x="400" y="775">A4</text>
  </g>
</svg>
