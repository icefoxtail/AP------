<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc" data-scale-policy="GEOMETRY_HYBRID">
<title id="title">2024 조대부고 8번 포물선 접선 해설</title><desc id="desc">점 (1,4)에서 포물선에 그은 두 접선 중 기울기 음수인 접선</desc>
<rect width="640" height="400" fill="white"/><g stroke="#111" fill="none" stroke-linecap="round" stroke-linejoin="round"><line x1="45" y1="330" x2="600" y2="330" stroke-width="1.3"/><line x1="210" y1="370" x2="210" y2="28" stroke-width="1.3"/><path d="M70 95 Q300 310 560 95" stroke="#333" stroke-width="2.3"/><line x1="60" y1="150" x2="510" y2="35" stroke="#777" stroke-width="1.8"/><line x1="60" y1="338" x2="560" y2="88" stroke="#d33" stroke-width="2.2"/><circle cx="210" cy="78" r="5" fill="#111" stroke="none"/><circle cx="390" cy="252" r="5" fill="#d33" stroke="none"/><circle cx="270" cy="140" r="5" fill="#777" stroke="none"/></g><g font-family="Noto Sans KR, Pretendard, Malgun Gothic, sans-serif" fill="#111" font-size="14"><text x="555" y="86">y=−x²+x+3</text><text x="218" y="70">(1,4)</text><text x="398" y="248">t=2</text><text x="277" y="135">t=0</text><text x="390" y="110" fill="#d33">y=−3x+7</text><text x="360" y="30" fill="#777">y=x+3</text><text x="360" y="380" fill="#d33">p=−3, q=7　→　pq=−21</text></g></svg>
