<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc" data-scale-policy="SOLUTION_GRAPH">
<title id="title">2024 조대부고 12번 곱함수 연속 해설</title><desc id="desc">조각함수 f의 영점 −1, 2−√2, 2+√2, 5를 표시</desc>
<rect width="640" height="400" fill="white"/><g stroke="#111" fill="none" stroke-linecap="round" stroke-linejoin="round"><line x1="40" y1="260" x2="600" y2="260" stroke-width="1.3"/><line x1="300" y1="355" x2="300" y2="28" stroke-width="1.3"/><path d="M55 320 L160 170" stroke="#333" stroke-width="2.2"/><path d="M300 320 Q405 135 510 320" stroke="#333" stroke-width="2.2"/><line x1="510" y1="320" x2="590" y2="190" stroke="#333" stroke-width="2.2"/><line x1="195" y1="260" x2="195" y2="274" stroke="#1b6ca8" stroke-width="2"/><line x1="380" y1="260" x2="380" y2="274" stroke="#1b6ca8" stroke-width="2"/><line x1="432" y1="260" x2="432" y2="274" stroke="#1b6ca8" stroke-width="2"/><line x1="545" y1="260" x2="545" y2="274" stroke="#1b6ca8" stroke-width="2"/><circle cx="195" cy="260" r="4" fill="#1b6ca8" stroke="none"/><circle cx="380" cy="260" r="4" fill="#1b6ca8" stroke="none"/><circle cx="432" cy="260" r="4" fill="#1b6ca8" stroke="none"/><circle cx="545" cy="260" r="4" fill="#1b6ca8" stroke="none"/></g><g font-family="Noto Sans KR, Pretendard, Malgun Gothic, sans-serif" fill="#111" font-size="14"><text x="570" y="250">x</text><text x="310" y="42">y</text><text x="173" y="300">−1</text><text x="348" y="300">2−√2</text><text x="420" y="330">2+√2</text><text x="538" y="300">5</text><text x="335" y="70">y=f(x)</text><text x="75" y="375" fill="#1b6ca8">f(k)=0이면 f(x)f(x−k)의 점프가 사라짐</text></g></svg>
