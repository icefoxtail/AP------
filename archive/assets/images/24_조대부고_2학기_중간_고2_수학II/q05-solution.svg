<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc" data-scale-policy="SOLUTION_GRAPH">
<title id="title">2024 조대부고 5번 제곱함수 연속 해설</title><desc id="desc">0에서 좌극한 6과 함숫값 −2를 제곱해 같게 만드는 a=2</desc>
<rect width="640" height="360" fill="white"/><g stroke="#111" fill="none" stroke-linecap="round" stroke-linejoin="round"><line x1="45" y1="236" x2="600" y2="236" stroke-width="1.3"/><line x1="300" y1="320" x2="300" y2="28" stroke-width="1.3"/><path d="M55 315 C85 235 150 138 238 98 C270 84 292 82 300 82" stroke="#333" stroke-width="2.2"/><line x1="300" y1="280" x2="590" y2="132" stroke="#333" stroke-width="2.2"/><circle cx="300" cy="82" r="5" fill="white" stroke="#d33" stroke-width="2"/><circle cx="300" cy="280" r="5" fill="#1b6ca8" stroke="none"/><line x1="300" y1="82" x2="300" y2="280" stroke="#777" stroke-width="1" stroke-dasharray="4 4"/></g><g font-family="Noto Sans KR, Pretendard, Malgun Gothic, sans-serif" fill="#111" font-size="14"><text x="310" y="70">6</text><text x="310" y="285">−2</text><text x="510" y="82">y=f(x)</text><text x="312" y="340">x=0</text><text x="80" y="345" fill="#1b6ca8">(6−a)²=(−2−a)²</text><text x="390" y="345" fill="#1b6ca8">a=2</text></g></svg>
