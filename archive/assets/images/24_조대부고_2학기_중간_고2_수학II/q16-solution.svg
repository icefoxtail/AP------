<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc" data-scale-policy="SOLUTION_GRAPH">
<title id="title">2024 조대부고 16번 접선 y절편 함수 해설</title><desc id="desc">g(t)=−2t³+3t²와 t=2에서 이어지는 직선의 함수값과 기울기 일치</desc>
<rect width="640" height="400" fill="white"/><g stroke="#111" fill="none" stroke-linecap="round" stroke-linejoin="round"><line x1="48" y1="285" x2="600" y2="285" stroke-width="1.3"/><line x1="170" y1="360" x2="170" y2="28" stroke-width="1.3"/><path d="M60 65 C100 90 135 145 170 285 C205 410 245 320 285 170" stroke="#333" stroke-width="2.2"/><line x1="285" y1="170" x2="575" y2="340" stroke="#d33" stroke-width="2.2"/><circle cx="285" cy="170" r="5" fill="#d33" stroke="none"/><line x1="285" y1="170" x2="285" y2="285" stroke="#777" stroke-width="1" stroke-dasharray="4 4"/></g><g font-family="Noto Sans KR, Pretendard, Malgun Gothic, sans-serif" fill="#111" font-size="14"><text x="500" y="115">g(t)=−2t³+3t²</text><text x="298" y="164">g(2)=−4</text><text x="310" y="350" fill="#d33">2at+b,　2a=−12</text><text x="72" y="380" fill="#d33">a=−6, b=20　→　a+b=14</text></g></svg>
