<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" width="680" height="300" role="img" aria-labelledby="title desc">
  <title id="title">Common chord calculation</title>
  <desc id="desc">Find d from the triangle area and then determine k from the common chord line.</desc>
  <rect width="680" height="300" fill="#fff"/>
  <text x="340" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#1e3a5f">Common chord AB, center C(0,1)</text>
  <rect x="22" y="52" width="300" height="222" rx="10" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="42" y="86" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#1d4ed8">Area condition</text>
  <text x="42" y="122" font-family="Arial, sans-serif" font-size="17">AM=√(13−d²)</text>
  <text x="42" y="157" font-family="Arial, sans-serif" font-size="17">d·√(13−d²)=6</text>
  <text x="42" y="192" font-family="Arial, sans-serif" font-size="17">d²=4 or 9</text>
  <text x="42" y="228" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#b91c1c">d=2 or 3</text>
  <rect x="350" y="52" width="308" height="222" rx="10" fill="#fff7ed" stroke="#fed7aa"/>
  <text x="370" y="86" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#9a3412">Common chord line</text>
  <text x="370" y="122" font-family="Arial, sans-serif" font-size="17">−8x+6y+32−k=0</text>
  <text x="370" y="157" font-family="Arial, sans-serif" font-size="17">dist(C,AB)=|38−k|/10</text>
  <text x="370" y="192" font-family="Arial, sans-serif" font-size="17">d=2 → k=18, 58</text>
  <text x="370" y="222" font-family="Arial, sans-serif" font-size="17">d=3 → k=8, 68</text>
  <text x="370" y="254" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#b91c1c">mean(k)=38</text>
</svg>
