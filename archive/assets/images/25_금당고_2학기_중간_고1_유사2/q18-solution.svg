<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" width="680" height="300" role="img" aria-labelledby="title" data-scale-policy="SCHEMATIC_ALLOWED" aria-describedby="desc">
  <title id="title">공통현의 직선과 삼각형의 넓이</title>
  <desc id="desc">두 원의 교점이 이루는 공통현의 직선 방정식과, 그 교점 및 좌표축이 이루는 삼각형의 넓이를 나타낸 해설 그림.</desc>
  <rect width="680" height="300" fill="#fff"/>
  <text x="340" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#1e3a5f">공통현 AB, 중심 C(0,1)</text>
  <rect x="22" y="52" width="300" height="222" rx="10" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="42" y="86" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#1d4ed8">넓이 조건</text>
  <text x="42" y="122" font-family="Arial, sans-serif" font-size="17">AM=√(13−d²)</text>
  <text x="42" y="157" font-family="Arial, sans-serif" font-size="17">d·√(13−d²)=6</text>
  <text x="42" y="192" font-family="Arial, sans-serif" font-size="17">d²=4 또는 9</text>
  <text x="42" y="228" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#b91c1c">d=2 또는 3</text>
  <rect x="350" y="52" width="308" height="222" rx="10" fill="#fff7ed" stroke="#fed7aa"/>
  <text x="370" y="86" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#9a3412">공통현의 직선</text>
  <text x="370" y="122" font-family="Arial, sans-serif" font-size="17">−8x+6y+32−k=0</text>
  <text x="370" y="157" font-family="Arial, sans-serif" font-size="17">dist(C,AB)=|38−k|/10</text>
  <text x="370" y="192" font-family="Arial, sans-serif" font-size="17">d=2 → k=18, 58</text>
  <text x="370" y="222" font-family="Arial, sans-serif" font-size="17">d=3 → k=8, 68</text>
  <text x="370" y="254" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#b91c1c">평균(k)=38</text>
</svg>