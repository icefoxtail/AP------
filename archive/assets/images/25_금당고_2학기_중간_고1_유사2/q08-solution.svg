<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" width="640" height="260" role="img" aria-labelledby="title desc">
  <title id="title">Radius condition</title>
  <desc id="desc">Complete the square and select natural numbers k satisfying r less than or equal to 6.</desc>
  <rect width="640" height="260" fill="#fff"/>
  <text x="320" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#1e3a5f">Radius condition</text>
  <rect x="24" y="52" width="592" height="180" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="48" y="88" font-family="Arial, sans-serif" font-size="18" fill="#0f172a">x²+y²−6kx−4y+5k²−8=0</text>
  <text x="48" y="124" font-family="Arial, sans-serif" font-size="18" fill="#0f172a">→ (x−3k)²+(y−2)²=4k²+12</text>
  <text x="48" y="160" font-family="Arial, sans-serif" font-size="18" fill="#0f172a">r≤6 → 4k²+12≤36 → k²≤6</text>
  <text x="48" y="200" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#b91c1c">k=1, 2 → k-sum=3</text>
</svg>
