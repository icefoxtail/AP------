<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" width="520" height="380" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">세 평행선 l, m, n이 두 직선과 만나는 그림이다. 한 직선에서는 l과 m 사이가 4, m과 n 사이가 8이고, 다른 직선에서는 l과 m 사이가 5, m과 n 사이가 x로 표시되어 있다.</title><desc id="visual-desc">세 가로 평행선 l, m, n을 두 직선이 가로지른다. 왼쪽 직선에는 위쪽 4와 아래쪽 8이, 오른쪽 직선에는 위쪽 5와 아래쪽 x가 표시되어 있다.</desc><rect width="520" height="380" fill="#fff"/><g data-layer="30"><line id="sl" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="59.152542373" y1="56.101694915" x2="460.847457627" y2="56.101694915"/></g><g data-layer="30"><line id="sm" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="59.152542373" y1="145.367231638" x2="460.847457627" y2="145.367231638"/></g><g data-layer="30"><line id="sn" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="59.152542373" y1="323.898305085" x2="460.847457627" y2="323.898305085"/></g><g data-layer="30"><line id="sL1M1" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="103.785310734" y1="56.101694915" x2="103.785310734" y2="145.367231638"/></g><g data-layer="30"><line id="sM1N1" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="103.785310734" y1="145.367231638" x2="103.785310734" y2="323.898305085"/></g><g data-layer="30"><line id="sL2M2" data-role="line" stroke="#111" stroke