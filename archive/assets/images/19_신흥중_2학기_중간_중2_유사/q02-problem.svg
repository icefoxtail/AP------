<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 600" width="560" height="600" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">각 C가 직각인 직각삼각형 ABC에서 빗변 AB의 수직이등분선이 변 BC와 만나는 점 D를 나타낸 그림이다. 선분 AD가 각 A를 이등분하는 표시가 있다.</title><desc id="visual-desc">직각삼각형 ABC가 있고 꼭짓점 C에 직각 표시가 있다. 빗변 AB의 수직이등분선이 변 BC 위의 점 D에서 만나고, 점 D와 꼭짓점 A를 잇는 선분이 그려져 있다. 선분 AD와 DB의 길이가 같다는 표시와, 각 A가 같은 크기의 두 각으로 나뉜 표시가 있다.</desc><rect width="560" height="600" fill="#fff"/><g data-layer="30"><line id="AB" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="501.428571429" y1="172.158154679" x2="58.571428571" y2="427.841845321"/></g><g data-layer="30"><line id="BD" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="58.571428571" y1="427.841845321" x2="353.80952381" y2="427.841845321"/></g><g data-layer="30"><line id="DC" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="353.80952381" y1="427.841845321" x2="501.428571429" y2="427.841845321"/></g><g data-layer="30"><line id="CA" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="501.428571429" y1="427.841845321" x2="501.428571429" y2="172.158154679"/></g><g data-layer="30"><line id="AD" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="501.428571429" y1="172.158154679" x2="353.80952381" y2="427.841845321"/></g><g data-layer="55"><line id="eq0-AD-