<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 370"><rect width="650" height="370" fill="white"/><text x="20" y="28" font-size="18" font-weight="700">q8 vertical angles</text><line x1="105" y1="62" x2="430" y2="225" stroke="black" stroke-width="2"/><line x1="430" y1="62" x2="105" y2="225" stroke="black" stroke-width="2"/><text x="82" y="58" font-size="14">A 40°</text><text x="435" y="58" font-size="14">B 58°</text><text x="82" y="246" font-size="14">C 30°</text><text x="435" y="246" font-size="14">D x</text><text x="252" y="142" font-size="14">O</text><text x="24" y="292" font-size="15">∠AOB = 180° − 40° − 58° = 82°</text><text x="24" y="318" font-size="15">∠COD = ∠AOB = 82° (vertical angles)</text><text x="24" y="344" font-size="15">x = 180° − 82° − 30° = 68°</text></svg>