<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" role="img" aria-label="두 삼각형에서 맞꼭지각을 이용해 x 계산">
  <rect width="680" height="420" fill="#fff"/>
  <g fill="none" stroke="#111" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <line x1="95" y1="82" x2="425" y2="82"/>
    <line x1="95" y1="252" x2="425" y2="252"/>
    <line x1="95" y1="82" x2="425" y2="252"/>
    <line x1="425" y1="82" x2="95" y2="252"/>
    <circle cx="260" cy="167" r="4" fill="#111"/>
  </g>
  <g fill="#111" font-family="sans-serif">
    <text x="24" y="32" font-size="20" font-weight="700">두 삼각형과 맞꼭지각</text>
    <text x="72" y="70" font-size="16">A</text>
    <text x="432" y="74" font-size="16">B</text>
    <text x="72" y="273" font-size="16">C</text>
    <text x="432" y="273" font-size="16">D</text>
    <text x="245" y="158" font-size="16">O</text>
    <text x="121" y="104" font-size="16">40°</text>
    <text x="370" y="105" font-size="16">58°</text>
    <text x="115" y="238" font-size="16">30°</text>
    <text x="379" y="238" font-size="16">x</text>
    <text x="24" y="318" font-size="17">△AOB에서 ∠AOB=180°−40°−58°=82°</text>
    <text x="24" y="350" font-size="17">맞꼭지각이므로 ∠COD=∠AOB=82°</text>
    <text x="24" y="382" font-size="17">△COD에서 x=180°−82°−30°=68°</text>
  </g>
</svg>
