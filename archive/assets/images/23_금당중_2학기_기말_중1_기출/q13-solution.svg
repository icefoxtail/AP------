<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 525" role="img" aria-label="정삼각형 담장에 묶인 끈의 이동 가능 영역">
  <rect width="760" height="525" fill="#fff"/>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M207 281 A105 105 0 1 1 313 281" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5"/>
    <path d="M260 190 L190 310 L330 310 Z" fill="#fff" stroke="#111" stroke-width="3"/>
    <line x1="260" y1="190" x2="207" y2="281" stroke="#111" stroke-width="1.7" stroke-dasharray="5 4"/>
    <line x1="260" y1="190" x2="313" y2="281" stroke="#111" stroke-width="1.7" stroke-dasharray="5 4"/>
    <path d="M220 327 A35 35 0 0 1 160 327" stroke="#2563eb" stroke-width="2.5"/>
    <path d="M300 327 A35 35 0 0 1 360 327" stroke="#2563eb" stroke-width="2.5"/>
    <circle cx="260" cy="190" r="4" fill="#111"/>
  </g>
  <g fill="#111" font-family="sans-serif">
    <text x="24" y="34" font-size="20" font-weight="700">정삼각형 담장에 묶인 끈의 이동 영역</text>
    <text x="24" y="70" font-size="15" fill="#475569">처음 묶은 점에서 300° 이동, 끈의 길이는 6 m</text>
    <text x="267" y="184" font-size="16">묶은 점</text>
    <text x="138" y="303" font-size="16">4 m</text>
    <text x="337" y="303" font-size="16">4 m</text>
    <text x="164" y="360" font-size="15" fill="#2563eb">120°</text>
    <text x="315" y="360" font-size="15" fill="#2563eb">120°</text>
    <text x="24" y="395" font-size="17">처음 묶은 꼭짓점: 360°−60°=300°</text>
    <text x="24" y="425" font-size="17">(300°/360°)π·6²=30π m²</text>
    <text x="24" y="455" font-size="17">이웃한 두 꼭짓점: 2·(120°/360°)π·(6−4)²=8π/3 m²</text>
    <text x="24" y="492" font-size="18" font-weight="700">전체 넓이=30π+8π/3=98π/3 m²</text>
  </g>
</svg>
