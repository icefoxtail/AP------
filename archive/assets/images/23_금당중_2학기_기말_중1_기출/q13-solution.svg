<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" role="img" aria-label="정삼각형 담장에 묶인 끈의 이동 가능 영역">
  <rect width="760" height="500" fill="#fff"/>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M207 221 A105 105 0 1 0 313 221" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5"/>
    <path d="M260 130 L190 250 L330 250 Z" stroke="#111" stroke-width="3"/>
    <line x1="260" y1="130" x2="207" y2="221" stroke="#111" stroke-width="1.7" stroke-dasharray="5 4"/>
    <line x1="260" y1="130" x2="313" y2="221" stroke="#111" stroke-width="1.7" stroke-dasharray="5 4"/>
    <path d="M220 267 A35 35 0 0 1 160 267" stroke="#2563eb" stroke-width="2.5"/>
    <path d="M300 267 A35 35 0 0 1 360 267" stroke="#2563eb" stroke-width="2.5"/>
    <circle cx="260" cy="130" r="4" fill="#111"/>
  </g>
  <g fill="#111" font-family="sans-serif">
    <text x="24" y="34" font-size="20" font-weight="700">정삼각형 담장에 묶인 끈의 이동 영역</text>
    <text x="267" y="124" font-size="17">묶은 점</text>
    <text x="142" y="271" font-size="16">4 m</text>
    <text x="331" y="271" font-size="16">4 m</text>
    <text x="112" y="205" font-size="15" fill="#475569">300° · 반지름 6 m</text>
    <text x="164" y="300" font-size="14" fill="#2563eb">120°</text>
    <text x="315" y="300" font-size="14" fill="#2563eb">120°</text>
    <text x="24" y="375" font-size="17">처음 묶은 꼭짓점: 360°−60°=300°</text>
    <text x="24" y="405" font-size="17">(300°/360°)π·6²=30π m²</text>
    <text x="24" y="435" font-size="17">이웃한 두 꼭짓점: 2·(120°/360°)π·(6−4)²=8π/3 m²</text>
    <text x="24" y="475" font-size="18" font-weight="700">전체 넓이 = 30π+8π/3 = 98π/3 m²</text>
  </g>
</svg>
