<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500"><rect width="760" height="500" fill="white"/><text x="20" y="28" font-size="18" font-weight="700">q13 leash region decomposition</text><circle cx="320" cy="180" r="135" fill="none" stroke="#555" stroke-width="2" stroke-dasharray="7 5"/><polygon points="320,180 275,258 365,258" fill="none" stroke="black" stroke-width="3"/><text x="311" y="170" font-size="15">P</text><text x="254" y="276" font-size="15">Q</text><text x="370" y="276" font-size="15">R</text><text x="282" y="225" font-size="15">4 m</text><text x="346" y="225" font-size="15">4 m</text><path d="M253 258 A22 22 0 0 1 275 236" fill="none" stroke="#555" stroke-width="2" stroke-dasharray="5 4"/><path d="M365 236 A22 22 0 0 1 387 258" fill="none" stroke="#555" stroke-width="2" stroke-dasharray="5 4"/><text x="20" y="385" font-size="15">P sector (300°): (300°/360°)π·6² = 30π m²</text><text x="20" y="417" font-size="15">At Q and R, remaining rope = 6 − 4 = 2 m; each sector is 120°</text><text x="20" y="449" font-size="15">Added area: 2·(120°/360°)π·2² = 8π/3 m²</text><text x="20" y="481" font-size="15">Total: 30π + 8π/3 = 98π/3 m²</text></svg>