<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 440" role="img" aria-label="두 정비례 그래프에서 6000미터에 도착하는 시간 비교">
  <rect width="700" height="440" fill="#fff"/>
  <g fill="none" stroke-linecap="round">
    <path d="M85 360 H535 M85 360 V70" stroke="#111" stroke-width="2"/>
    <path d="M85 360 L160 90 M85 360 L460 90" stroke="#111" stroke-width="2.5"/>
    <path d="M85 90 H460 M100 90 V360 M100 306 H85 M100 349 H85" stroke="#64748b" stroke-width="1.5" stroke-dasharray="6 5"/>
    <path d="M160 90 V360 M460 90 V360" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="5 5"/>
    <circle cx="100" cy="306" r="4" fill="#111"/>
    <circle cx="100" cy="349" r="4" fill="#111"/>
  </g>
  <g fill="#111" font-family="sans-serif">
    <text x="24" y="34" font-size="20" font-weight="700">정비례 관계식과 도착 시간</text>
    <text x="535" y="366" font-size="16">x(분)</text>
    <text x="48" y="75" font-size="16">y(m)</text>
    <text x="52" y="97" font-size="15">6000</text>
    <text x="45" y="311" font-size="14">1200</text>
    <text x="54" y="354" font-size="14">240</text>
    <text x="94" y="384" font-size="14">3</text>
    <text x="151" y="384" font-size="14">15</text>
    <text x="450" y="384" font-size="14">75</text>
    <text x="110" y="297" font-size="14">진수 (3,1200)</text>
    <text x="110" y="344" font-size="14">영서 (3,240)</text>
    <text x="128" y="145" font-size="15">진수 y=400x</text>
    <text x="278" y="230" font-size="15">영서 y=80x</text>
    <text x="24" y="415" font-size="16">진수 6000÷400=15분, 영서 6000÷80=75분, 도착 차이는 60분</text>
  </g>
</svg>
