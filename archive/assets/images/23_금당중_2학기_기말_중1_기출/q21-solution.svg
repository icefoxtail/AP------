<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 380"><rect width="620" height="380" fill="white"/><text x="20" y="28" font-size="18" font-weight="700">q21 proportional graphs</text><line x1="75" y1="205" x2="570" y2="205" stroke="black"/><line x1="75" y1="220" x2="75" y2="48" stroke="black"/><line x1="75" y1="205" x2="210" y2="65" stroke="black" stroke-width="2"/><line x1="75" y1="205" x2="430" y2="95" stroke="black" stroke-width="2"/><line x1="75" y1="72" x2="560" y2="72" stroke="black" stroke-dasharray="5 4"/><text x="15" y="77" font-size="14">6000</text><text x="194" y="54" font-size="14">진수</text><text x="420" y="90" font-size="14">영서</text><text x="24" y="265" font-size="15">Jinsoo: (3, 1200)에서 y = 400x, 6000/400 = 15분</text><text x="24" y="295" font-size="15">Youngseo: (3, 240)에서 y = 80x, 6000/80 = 75분</text><text x="24" y="325" font-size="15">arrival time difference: 75 − 15 = 60분</text></svg>