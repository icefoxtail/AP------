<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 330" role="img" aria-labelledby="svg-title-42ff8940af" aria-describedby="svg-desc-42ff8940af"><title id="svg-title-42ff8940af">평면도형의 성질: 중심 O인 원에서 ∠AOB=30°, ∠BOC=90°, 호 AB와 BC의 비 1:3, B</title><desc id="svg-desc-42ff8940af">중심 O인 원에서 ∠AOB=30°, ∠BOC=90°, 호 AB와 BC의 비 1:3, B-O-D 일직선이 표시된 그림</desc><rect width="520" height="330" fill="white"/><text x="20" y="28" font-size="18" font-weight="700">q12 호와 중심각</text><circle cx="260" cy="170" r="110" fill="none" stroke="black"/><line x1="182" y1="248" x2="338" y2="92" stroke="black"/><line x1="260" y1="170" x2="338" y2="248" stroke="black"/><line x1="260" y1="170" x2="288" y2="64" stroke="black"/><text x="292" y="61" font-size="14">A</text><text x="344" y="88" font-size="14">B</text><text x="344" y="264" font-size="14">C</text><text x="162" y="264" font-size="14">D</text><text x="244" y="190" font-size="14">O</text><text x="24" y="246" font-size="15">∠AOB=30°, ∠BOC=90°</text><text x="24" y="267" font-size="15">호 AB : 호 BC = 1 : 3</text><text x="24" y="288" font-size="15">∠AOC=120° → 호 AC = 4·호 AB</text><text x="24" y="309" font-size="15">B-O-D가 일직선 → BD는 지름</text></svg>