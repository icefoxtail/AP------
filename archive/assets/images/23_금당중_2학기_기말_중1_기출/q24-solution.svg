<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 500" role="img" aria-label="반지름 2cm 높이 5cm인 원기둥과 밑변 6cm 높이 7cm인 정사각뿔의 겉넓이와 부피">
  <rect width="860" height="500" fill="#fff"/>
  <g fill="none" stroke="#111" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round">
    <ellipse cx="170" cy="120" rx="50" ry="14"/>
    <line x1="120" y1="120" x2="120" y2="245"/><line x1="220" y1="120" x2="220" y2="245"/>
    <ellipse cx="170" cy="245" rx="50" ry="14"/>
    <line x1="170" y1="120" x2="220" y2="120" stroke="#64748b" stroke-dasharray="6 5"/>
    <line x1="235" y1="120" x2="235" y2="245" stroke="#64748b" stroke-dasharray="6 5"/>
    <path d="M590 105 L486 245 L590 305 L694 245 Z"/>
    <path d="M590 105 L590 185" stroke="#64748b" stroke-dasharray="6 5"/>
    <path d="M694 245 L590 185 L486 245" stroke="#64748b" stroke-dasharray="6 5"/>
    <line x1="590" y1="105" x2="590" y2="245" stroke="#64748b" stroke-dasharray="5 5"/>
    <path d="M590 245 h16 v-16" stroke="#64748b" stroke-width="1.7"/>
  </g>
  <g fill="#111" font-family="sans-serif">
    <text x="24" y="34" font-size="20" font-weight="700">두 입체도형의 겉넓이와 부피</text>
    <text x="116" y="98" font-size="16">r=2 cm</text>
    <text x="242" y="184" font-size="16">h=5 cm</text>
    <text x="528" y="350" font-size="16">정사각형 밑면: 한 변 6 cm</text>
    <text x="420" y="190" font-size="16">h=7 cm</text>
    <text x="24" y="405" font-size="18">(1) 원기둥: 2π·2² + 2π·2·5 = 28π cm²</text>
    <text x="24" y="445" font-size="18">(2) 정사각뿔: (1/3)·6²·7 = 84 cm³</text>
  </g>
</svg>
