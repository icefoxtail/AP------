<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 390" role="img" aria-label="겉넓이와 부피">
  <rect width="720" height="390" fill="#fff"/>
  <g fill="none" stroke="#111" stroke-width="2" stroke-linejoin="round">
    <rect x="70" y="95" width="180" height="135"/>
    <ellipse cx="160" cy="95" rx="90" ry="16"/>
    <ellipse cx="160" cy="230" rx="90" ry="16"/>
    <path d="M430 225 L565 225 L497 88 Z M430 225 L468 258 L527 258 L565 225"/>
    <line x1="497" y1="88" x2="497" y2="225" stroke-dasharray="5 4"/>
  </g>
  <g fill="#111" font-family="sans-serif">
    <text x="24" y="32" font-size="20" font-weight="700">q24 겉넓이와 부피</text>
    <text x="91" y="275" font-size="18">r=2 cm, h=5 cm</text>
    <text x="450" y="285" font-size="18">밑면 한 변 6 cm, h=7 cm</text>
    <text x="35" y="330" font-size="20">(1) S = 2π(2²)+2π(2)(5) = 28π cm²</text>
    <text x="35" y="365" font-size="20">(2) V = (1/3)×6²×7 = 84 cm³</text>
  </g>
</svg>
