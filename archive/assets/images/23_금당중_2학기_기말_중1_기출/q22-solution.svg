<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img" aria-label="삼각형의 외각">
  <rect width="640" height="420" fill="#fff"/>
  <g fill="none" stroke="#111" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M80 300 L445 90 L480 300 Z"/>
    <line x1="445" y1="90" x2="573" y2="16"/>
  </g>
  <g fill="#111" font-family="sans-serif">
    <text x="24" y="34" font-size="20" font-weight="700">q22 삼각형의 외각</text>
    <text x="100" y="286" font-size="17">(x−30)°</text>
    <text x="438" y="286" font-size="17">80°</text>
    <text x="490" y="65" font-size="17">(2x−10)°</text>
    <text x="40" y="350" font-size="20">2x−10 = (x−30)+80</text>
    <text x="40" y="385" font-size="20">x = 60°</text>
  </g>
</svg>
