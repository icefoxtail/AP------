<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 330"><rect width="520" height="330" fill="white"/><text x="20" y="28" font-size="18" font-weight="700">q17 사각뿔대 겉넓이</text><polygon points="145,80 300,80 390,220 70,220" fill="none" stroke="black" stroke-width="2"/><text x="205" y="70" font-size="14">3</text><text x="220" y="242" font-size="14">7</text><text x="105" y="155" font-size="14">5</text><text x="24" y="246" font-size="15">옆면 1개 = (3+7)÷2×5 = 25</text><text x="24" y="266" font-size="15">옆면 4개 = 100</text><text x="24" y="286" font-size="15">두 밑면 = 3²+7² = 58</text><text x="24" y="306" font-size="15">겉넓이 = 158 cm²</text></svg>