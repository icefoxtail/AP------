<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 330"><rect width="520" height="330" fill="white"/><text x="20" y="28" font-size="18" font-weight="700">q11 부채꼴 넓이</text><circle cx="260" cy="170" r="105" fill="none" stroke="black"/><line x1="260" y1="170" x2="190" y2="92" stroke="black"/><line x1="260" y1="170" x2="350" y2="115" stroke="black"/><line x1="190" y1="92" x2="350" y2="115" stroke="black"/><line x1="260" y1="170" x2="420" y2="190" stroke="black"/><text x="250" y="190" font-size="14">O</text><text x="174" y="87" font-size="14">A</text><text x="355" y="112" font-size="14">B</text><text x="425" y="194" font-size="14">C</text><text x="24" y="246" font-size="15">∠AOB=100°, OA=OB → 밑각 40°</text><text x="24" y="266" font-size="15">AB ∥ OC → ∠BOC=40°</text><text x="24" y="286" font-size="15">넓이 = 40×40/100 = 16</text></svg>