<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 480" role="img" aria-label="육각형의 내각의 합으로 x 계산">
  <rect width="700" height="480" fill="#fff"/>
  <g fill="none" stroke="#111" stroke-width="2.5" stroke-linejoin="round">
    <path d="M110 160 L92 300 L255 410 L445 330 L505 178 L330 58 Z"/>
    <path d="M330 58 L341 82 L364 67" stroke-width="1.5"/>
    <line x1="445" y1="330" x2="555" y2="282" stroke-dasharray="5 4"/>
  </g>
  <g fill="#111" font-family="sans-serif">
    <text x="24" y="34" font-size="20" font-weight="700">육각형의 내각의 합</text>
    <text x="125" y="177" font-size="18">140°</text>
    <text x="96" y="282" font-size="18">110°</text>
    <text x="244" y="388" font-size="18">x</text>
    <text x="412" y="314" font-size="18">130°</text>
    <text x="466" y="190" font-size="18">120°</text>
    <text x="304" y="105" font-size="18">90°</text>
    <text x="506" y="302" font-size="16">바깥각 50°</text>
    <text x="24" y="440" font-size="18">그 꼭짓점의 내각은 180°−50°=130°</text>
    <text x="24" y="466" font-size="18">x=720°−(140°+110°+130°+120°+90°)=130°</text>
  </g>
</svg>
