<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360"><rect width="560" height="360" fill="white"/><text x="20" y="28" font-size="18" font-weight="700">q9 hexagon interior angles</text><polygon points="130,55 300,45 420,105 400,190 230,205 95,145" fill="none" stroke="black" stroke-width="2"/><text x="145" y="83" font-size="14">x</text><text x="285" y="77" font-size="14">110°</text><text x="370" y="115" font-size="14">140°</text><text x="350" y="177" font-size="14">90°</text><text x="205" y="185" font-size="14">120°</text><text x="84" y="136" font-size="14">130°</text><text x="24" y="250" font-size="15">interior angle next to exterior 50° = 180° − 50° = 130°</text><text x="24" y="278" font-size="15">hexagon angle sum: x + 110° + 140° + 90° + 120° + 130° = 720°</text><text x="24" y="306" font-size="15">x = 720° − 590° = 130°</text><text x="24" y="334" font-size="15">따라서 x = 130°</text></svg>