<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 744 581" width="744" height="581" role="img" aria-labelledby="title desc"><title id="title">모니터 화면의 가로와 세로 및 대각선</title><desc id="desc">직사각형 화면의 가로는 80 cm, 세로는 60 cm이다. 왼쪽 아래에서 오른쪽 위로 이어지는 청록색 선이 대각선이다.</desc><rect width="744" height="581" fill="white" /><rect x="100" y="60" width="458" height="350" rx="13" fill="none" stroke="#293b4b" stroke-width="4.7" /><rect x="113" y="73" width="432" height="324" fill="none" stroke="#202020" stroke-width="5" /><line x1="113.0000" y1="397.0000" x2="545.0000" y2="73.0000" stroke="#227365" stroke-width="6.6" stroke-linecap="round" /><line x1="329.0000" y1="411.0000" x2="329.0000" y2="437.0000" stroke="#293b4b" stroke-width="5.1" stroke-linecap="round" /><line x1="280.0000" y1="438.0000" x2="378.0000" y2="438.0000" stroke="#293b4b" stroke-width="5.1" stroke-linecap="round" /><line x1="113.0000" y1="496.0000" x2="545.0000" y2="496.0000" stroke="#202020" stroke-width="1.85" stroke-linecap="round" /><line x1="113.0000" y1="490.0000" x2="113.0000" y2="502.0000" stroke="#202020" stroke-width="2" stroke-linecap="round" /><line x1="545.0000" y1="490.0000" x2="545.0000" y2="502.0000" stroke="#202020" stroke-width="2" stroke-linecap="round" /><text x="329.0000" y="480.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#202020" text-anchor="middle">80 cm</text><line x1="590.0000" y1="73.0000" x2="590.0000" y2="397.0000" stroke="#202020" stroke-width="1.85" stroke-linecap="round" /><line x1="583.0000" y1="73.0000" x2="597.0000" y2="73.0000" stroke="#202020" stroke-width="1.85" stroke-linecap="round" /><line x1="583.0000" y1="397.0000" x2="597.0000" y2="397.0000" stroke="#202020" stroke-width="1.85" stroke-linecap="round" /><text x="638.0000" y="247.0000" font-size="32" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#202020" text-anchor="middle">60 cm</text></svg>
