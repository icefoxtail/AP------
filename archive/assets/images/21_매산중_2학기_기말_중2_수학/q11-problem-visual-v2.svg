<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 748 666" width="748" height="666" role="img" aria-labelledby="title desc"><title id="title">직각삼각형 세 변의 바깥 반원</title><desc id="desc">직각삼각형 ABC의 세 변을 지름으로 하는 반원은 AB 바깥쪽 P, AC 바깥쪽 Q, BC 아래쪽 R이다. BC는 18 cm이다.</desc><rect width="748" height="666" fill="white" /><path d="M 116.78749999999997 358.375 A 164.46253372729 164.46253372729 0 0 1 327.6875 105.96087598947639" stroke="#202020" stroke-width="4.6" fill="none" /><line x1="116.7875" y1="358.3750" x2="327.6875" y2="105.9609" stroke="#202020" stroke-width="5.25" stroke-linecap="round" /><text x="167.9685" y="196.8244" font-size="37" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#202020" text-anchor="middle">P</text><path d="M 327.6875 105.96087598947639 A 196.8357818080849 196.8357818080849 0 0 1 629.7875 358.375" stroke="#227365" stroke-width="4.6" fill="none" /><line x1="327.6875" y1="105.9609" x2="629.7875" y2="358.3750" stroke="#227365" stroke-width="5.25" stroke-linecap="round" /><text x="533.0065" y="177.2164" font-size="37" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#227365" text-anchor="middle">Q</text><path d="M 629.7875 358.375 A 256.5 256.5 0 0 1 116.78749999999997 358.375" stroke="#774698" stroke-width="4.6" fill="none" /><line x1="629.7875" y1="358.3750" x2="116.7875" y2="358.3750" stroke="#774698" stroke-width="5.25" stroke-linecap="round" /><text x="373.2875" y="478.6700" font-size="37" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#774698" text-anchor="middle">R</text><line x1="311.6580" y1="125.1457" x2="330.8428" y2="141.1751" stroke="#586574" stroke-width="1.8" stroke-linecap="round" /><line x1="330.8428" y1="141.1751" x2="346.8723" y2="121.9904" stroke="#586574" stroke-width="1.8" stroke-linecap="round" /><text x="373.2875" y="342.3750" font-size="33" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#774698" text-anchor="mi