<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 751 541" width="751" height="541" role="img" aria-labelledby="title desc"><title id="title">서로 합동인 두 직각삼각형이 받치는 모양</title><desc id="desc">B, E, C가 한 수평선에 있고 B와 C에서 수직으로 올린 길이는 각각 12 cm와 16 cm이다. 꼭짓점 A, E, D를 서로 이었다.</desc><rect width="751" height="541" fill="white" /><line x1="140.3000" y1="203.3000" x2="610.7000" y2="136.1000" stroke="#687889" stroke-width="4.4" stroke-linecap="round" /><line x1="140.3000" y1="203.3000" x2="140.3000" y2="404.9000" stroke="#21639a" stroke-width="5.15" stroke-linecap="round" /><line x1="409.1000" y1="404.9000" x2="610.7000" y2="404.9000" stroke="#21639a" stroke-width="5.15" stroke-linecap="round" /><line x1="140.3000" y1="404.9000" x2="409.1000" y2="404.9000" stroke="#a34c1f" stroke-width="5.15" stroke-linecap="round" /><line x1="610.7000" y1="404.9000" x2="610.7000" y2="136.1000" stroke="#a34c1f" stroke-width="5.15" stroke-linecap="round" /><line x1="140.3000" y1="203.3000" x2="409.1000" y2="404.9000" stroke="#774698" stroke-width="5.15" stroke-linecap="round" /><line x1="409.1000" y1="404.9000" x2="610.7000" y2="136.1000" stroke="#774698" stroke-width="5.15" stroke-linecap="round" /><line x1="140.3000" y1="383.9000" x2="161.3000" y2="383.9000" stroke="#586574" stroke-width="1.8" stroke-linecap="round" /><line x1="161.3000" y1="383.9000" x2="161.3000" y2="404.9000" stroke="#586574" stroke-width="1.8" stroke-linecap="round" /><line x1="610.7000" y1="383.9000" x2="589.7000" y2="383.9000" stroke="#586574" stroke-width="1.8" stroke-linecap="round" /><line x1="589.7000" y1="383.9000" x2="589.7000" y2="404.9000" stroke="#586574" stroke-width="1.8" stroke-linecap="round" /><line x1="106.3000" y1="404.9000" x2="106.3000" y2="203.3000" stroke="#21639a" stroke-width="1.7" stroke-linecap="round" /><line x1="100.8000" y1="404.9000" x2="111.8000" y2="404.9000" stroke="#21639a" stroke-width="1.7" stroke-linecap="round" /><line x1="100.8000" y1="203.3000" x2="111.8000" y2="203.3000" stroke="#21639a" stroke-width="1.7" stroke-linecap="round" /><text x="63.3000" y="312.1000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#21639a" text-anchor="middle">12 cm</text><line x1="645.7000" y1="404.9000" x2="645.7000" y2="136.1000" stroke="#a34c1f" stroke-width="1.7" stroke-linecap="round" /><line x1="640.2000" y1="404.9000" x2="651.2000" y2="404.9000" stroke="#a34c1f" stroke-width="1.7" stroke-linecap="round" /><line x1="640.2000" y1="136.1000" x2="651.2000" y2="136.1000" stroke="#a34c1f" stroke-width="1.7" stroke-linecap="round" /><text x="687.7000" y="278.5000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#a34c1f" text-anchor="middle">16 cm</text><circle cx="140.29999999999998" cy="203.3" r="4.9" fill="#28364b" /><text x="122.3000" y="188.3000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">A</text><circle cx="140.29999999999998" cy="404.9" r="4.9" fill="#28364b" /><text x="123.3000" y="427.9000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">B</text><circle cx="610.7" cy="404.9" r="4.9" fill="#28364b" /><text x="627.7000" y="427.9000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">C</text><circle cx="610.7" cy="136.1" r="4.9" fill="#28364b" /><text x="627.7000" y="121.1000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">D</text><circle cx="409.1" cy="404.9" r="4.9" fill="#28364b" /><text x="409.1000" y="429.9000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">E</text></svg>
