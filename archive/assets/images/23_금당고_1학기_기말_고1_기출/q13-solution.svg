<text x="526" y="208" class="sidebody">MC=1, MP:PC=3:2</text>
<text x="526" y="229" class="sidebody">P는 C 바깥, CP=2</text>
<text x="526" y="250" class="sidebody">[NCP]=h/2</text>
<text x="526" y="271" class="sidebody">따라서 k=2</text>
