<svg xmlns="http://www.w3.org/2000/svg" width="760" height="620" viewBox="0 0 760 620" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet">
  <title id="title">25_순천고_2학기_기말_고2_수학II · q5 해설 시각화</title>
  <desc id="desc">문항 5의 원문과 해설 흐름을 source-bound 텍스트 카드로 정리한 SVG</desc>
  <rect width="760" height="620" fill="#fff"/>
  <g font-family="Noto Sans KR, Pretendard, Apple SD Gothic Neo, Malgun Gothic, sans-serif" fill="#111">
    <text x="380" y="32" font-size="21" font-weight="700" text-anchor="middle">25_순천고_2학기_기말_고2_수학II · q5 해설 시각화</text>
    <text x="380" y="59" font-size="15" text-anchor="middle" fill="#475569">문항 원문과 해설의 핵심 흐름</text>
    <rect x="18" y="82" width="350" height="350" rx="12" fill="#eff6ff" stroke="#93c5fd"/>
    <rect x="390" y="82" width="352" height="350" rx="12" fill="#f0fdf4" stroke="#86efac"/>
    <text x="34" y="112" font-size="17" font-weight="700" fill="#1d4ed8">문항 핵심</text>
    <text x="398" y="112" font-size="17" font-weight="700" fill="#15803d">해설 흐름</text>
    <text x="34" y="140" font-size="15">곡선 y=-x^2+4x와 직선 y=2x로 둘러싸인</text>
    <text x="34" y="162" font-size="15">도형의 넓이는? [3.5점]</text>
    <text x="398" y="140" font-size="14">[키포인트] 두 그래프로 둘러싸인 넓이는 교점을</text>
    <text x="398" y="162" font-size="14">구한 뒤 위 함수에서 아래 함수를 뺀 값을</text>
    <text x="398" y="184" font-size="14">적분한다. 조건 정리: 두 곡선은 y=-x^2+4x와</text>
    <text x="398" y="206" font-size="14">y=2x이다. 풀이 방향: 먼저 두 그래프의 교점의</text>
    <text x="398" y="228" font-size="14">x좌표를 구하고, 그 사이에서 어느 그래프가</text>
    <text x="398" y="250" font-size="14">위에 있는지 확인한다. 정석 풀이:</text>
    <text x="398" y="272" font-size="14">-x^2+4x=2x에서 -x^2+2x=x(2-x)=0이므로</text>
    <text x="398" y="294" font-size="14">교점의 x좌표는 0,2이다. 0≤ x≤2에서</text>
    <text x="398" y="316" font-size="14">x(2-x)≥0이므로 곡선 y=-x^2+4x가 직선</text>
    <text x="398" y="338" font-size="14">y=2x보다 위에 있다. 따라서 넓이는 ∫[0,</text>
    <text x="398" y="360" font-size="14">2]{(-x^2+4x)-2x}dx=∫[0,</text>
    <text x="398" y="382" font-size="14">2](-x^2+2x)dx=[-x^3 / 3+x^2][0]^2=4 /</text>
    <text x="398" y="404" font-size="14">3이다. 따라서 정답은 ①이다.</text>
    <rect x="18" y="456" width="724" height="48" rx="10" fill="#fff7ed" stroke="#fdba74"/>
    <text x="380" y="486" font-size="17" text-anchor="middle" fill="#9a3412">결론: ①</text>
    <text x="380" y="532" font-size="11" text-anchor="middle" fill="#64748b">25_순천고_2학기_기말_고2_수학II · q5 · source-bound solution visual</text>
  </g>
</svg>