<svg xmlns="http://www.w3.org/2000/svg" width="760" height="620" viewBox="0 0 760 620" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet">
  <title id="title">25_순천고_2학기_기말_고2_수학II · q11 해설 시각화</title>
  <desc id="desc">문항 11의 원문과 해설 흐름을 source-bound 텍스트 카드로 정리한 SVG</desc>
  <rect width="760" height="620" fill="#fff"/>
  <g font-family="Noto Sans KR, Pretendard, Apple SD Gothic Neo, Malgun Gothic, sans-serif" fill="#111">
    <text x="380" y="32" font-size="21" font-weight="700" text-anchor="middle">25_순천고_2학기_기말_고2_수학II · q11 해설 시각화</text>
    <text x="380" y="59" font-size="15" text-anchor="middle" fill="#475569">문항 원문과 해설의 핵심 흐름</text>
    <rect x="18" y="82" width="350" height="350" rx="12" fill="#eff6ff" stroke="#93c5fd"/>
    <rect x="390" y="82" width="352" height="350" rx="12" fill="#f0fdf4" stroke="#86efac"/>
    <text x="34" y="112" font-size="17" font-weight="700" fill="#1d4ed8">문항 핵심</text>
    <text x="398" y="112" font-size="17" font-weight="700" fill="#15803d">해설 흐름</text>
    <text x="34" y="140" font-size="15">닫힌구간 [-2,2]에서 함수</text>
    <text x="34" y="162" font-size="15">f(x)=2x^3-3x^2-12x+a의 최댓값을 M,</text>
    <text x="34" y="184" font-size="15">최솟값을 m이라고 하자. M+m=-23일 때, 상수</text>
    <text x="34" y="206" font-size="15">a의 값은? [4.2점]</text>
    <text x="398" y="140" font-size="14">[키포인트] 닫힌구간의 최댓값과 최솟값은 양</text>
    <text x="398" y="162" font-size="14">끝점과 구간 안의 임계점에서 함수값을 비교하여</text>
    <text x="398" y="184" font-size="14">구한다. 조건 정리:</text>
    <text x="398" y="206" font-size="14">f(x)=2x^3-3x^2-12x+a이고 정의역은</text>
    <text x="398" y="228" font-size="14">[-2,2]이다. 풀이 방향: f'(x)=0인 점을 찾은</text>
    <text x="398" y="250" font-size="14">뒤 x=-2,-1,2에서의 함수값을 비교하여 M과 m을</text>
    <text x="398" y="272" font-size="14">정한다. 정석 풀이:</text>
    <text x="398" y="294" font-size="14">f'(x)=6x^2-6x-12=6(x+1)(x-2)이므로 구간</text>
    <text x="398" y="316" font-size="14">안에서 확인할 점은 x=-2,-1,2이다. 각각</text>
    <text x="398" y="338" font-size="14">f(-2)=a-4, f(-1)=a+7, f(2)=a-20이다.</text>
    <text x="398" y="360" font-size="14">따라서 최댓값은 M=a+7, 최솟값은 m=a-20이다.</text>
    <text x="398" y="382" font-size="14">M+m=-23이므로 (a+7)+(a-20)=2a-13=-23에서</text>
    <text x="398" y="404" font-size="14">a=-5이다. 따라서 정답은 ②이다.</text>
    <rect x="18" y="456" width="724" height="48" rx="10" fill="#fff7ed" stroke="#fdba74"/>
    <text x="380" y="486" font-size="17" text-anchor="middle" fill="#9a3412">결론: ②</text>
    <text x="380" y="532" font-size="11" text-anchor="middle" fill="#64748b">25_순천고_2학기_기말_고2_수학II · q11 · source-bound solution visual</text>
  </g>
</svg>