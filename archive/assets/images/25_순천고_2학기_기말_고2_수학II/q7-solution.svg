<svg xmlns="http://www.w3.org/2000/svg" width="650" height="355" viewBox="0 0 650 355" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="t7 d7"><title id="t7">도함수의 부호표</title><desc id="d7">도함수의 부호가 x=1,2,3에서 차례로 음에서 양, 양에서 음, 음에서 양으로 바뀐다. 따라서 f는 1에서 극소, 2에서 극대, 3에서 극소이며 (2,3)에서 감소한다.</desc><style>text{font-family:Arial,'Noto Sans KR','Malgun Gothic',sans-serif;fill:#152238}.title{font-size:21px;font-weight:700}.sub{font-size:16px}.axis{stroke:#667085;stroke-width:1.5}.guide{stroke:#98a2b3;stroke-width:1.1;stroke-dasharray:5 5}.curve{stroke:#2563eb;stroke-width:2.8;fill:none}.point{fill:white;stroke:#182230;stroke-width:2.2}.accent{fill:#1455aa;font-size:17px;font-weight:700}.body{fill:#344054;font-size:17px}.card{stroke:#d0d5dd;stroke-width:1.4;fill:#f8fafc}</style><rect width="650" height="355" fill="#fff"/><text class="title" x="26" y="34">f′(x)의 부호 → f(x)의 증감</text><line class="axis" x1="68" x2="595" y1="146" y2="146"/><g><circle class="point" cx="210" cy="146" r="4"/><text x="206" y="176" class="sub">1</text><circle class="point" cx="330" cy="146" r="4"/><text x="326" y="176" class="sub">2</text><circle class="point" cx="450" cy="146" r="4"/><text x="446" y="176" class="sub">3</text></g><text x="95" y="119" class="accent">−</text><text x="266" y="119" class="accent">+</text><text x="386" y="119" class="accent">−</text><text x="530" y="119" class="accent">+</text><text x="78" y="211" class="body">감소 ↘</text><text x="228" y="211" class="body">증가 ↗</text><text x="355" y="211" class="body">감소 ↘</text><text x="497" y="211" class="body">증가 ↗</text><text x="174" y="268" class="sub">극솟값</text><text x="303" y="268" class="sub">극댓값</text><text x="429" y="268" class="sub">극솟값</text><text x="72" y="318" class="accent">2&lt;x₁&lt;x₂&lt;3 ⇒ f(x₁)&gt;f(x₂)   (ㄷ 참)</text></svg>