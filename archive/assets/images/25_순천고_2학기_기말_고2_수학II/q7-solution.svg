<svg xmlns="http://www.w3.org/2000/svg" width="760" height="620" viewBox="0 0 760 620" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet">
  <title id="title">25_순천고_2학기_기말_고2_수학II · q7 해설 시각화</title>
  <desc id="desc">문항 7의 원문과 해설 흐름을 source-bound 텍스트 카드로 정리한 SVG</desc>
  <rect width="760" height="620" fill="#fff"/>
  <g font-family="Noto Sans KR, Pretendard, Apple SD Gothic Neo, Malgun Gothic, sans-serif" fill="#111">
    <text x="380" y="32" font-size="21" font-weight="700" text-anchor="middle">25_순천고_2학기_기말_고2_수학II · q7 해설 시각화</text>
    <text x="380" y="59" font-size="15" text-anchor="middle" fill="#475569">문항 원문과 해설의 핵심 흐름</text>
    <rect x="18" y="82" width="350" height="300" rx="12" fill="#eff6ff" stroke="#93c5fd"/>
    <rect x="390" y="82" width="352" height="300" rx="12" fill="#f0fdf4" stroke="#86efac"/>
    <text x="34" y="112" font-size="17" font-weight="700" fill="#1d4ed8">문항 핵심</text>
    <text x="398" y="112" font-size="17" font-weight="700" fill="#15803d">해설 흐름</text>
    <text x="34" y="140" font-size="15">아래 그래프는 사차함수 y=f(x)의 도함수 y=f'(x)의 그래프이다.</text>
    <text x="34" y="162" font-size="15">보기에서 옳은 것만을 있는 대로 고른 것은? (단,</text>
    <text x="34" y="184" font-size="15">f'(1)=f'(2)=f'(3)=0이다.) [3.7점]</text>
    <text x="398" y="140" font-size="14">[키포인트] 도함수 그래프의 부호와 부호 변화로 함수의 증가·감소와 극값을</text>
    <text x="398" y="162" font-size="14">판정한다. 조건 정리: f'(x)의 부호는 x&lt; 1에서 음수, 1&lt; x&lt; 2에서 양수, 2&lt;</text>
    <text x="398" y="184" font-size="14">x&lt; 3에서 음수, x&gt; 3에서 양수이다. 풀이 방향: 각 영점에서 f'(x)의 부호가</text>
    <text x="398" y="206" font-size="14">어떻게 바뀌는지 확인하고, 그 결과를 세 보기와 대조한다. 정석 풀이:</text>
    <text x="398" y="228" font-size="14">x=2에서는 f'(x)의 부호가 양수에서 음수로 바뀌므로 f는 극댓값을 갖는다.</text>
    <text x="398" y="250" font-size="14">따라서 ㄱ은 거짓이다. x&lt; 1에서 f'(x)&lt; 0이므로 f는 감소하고, ㄴ도</text>
    <text x="398" y="272" font-size="14">거짓이다. 2&lt; x[1]&lt; x[2]&lt; 3이면 이 구간에서 f'(x)&lt; 0이므로 f(x[1])&gt;</text>
    <text x="398" y="294" font-size="14">f(x[2])이고 ㄷ은 참이다. 따라서 옳은 것은 ㄷ뿐이며 정답은 ②이다.</text>
    <path d="M350 314 L410 314" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="18" y="350" width="724" height="48" rx="10" fill="#fff7ed" stroke="#fdba74"/>
    <text x="380" y="380" font-size="17" text-anchor="middle" fill="#9a3412">결론: ②</text>
    <text x="380" y="452" font-size="11" text-anchor="middle" fill="#64748b">25_순천고_2학기_기말_고2_수학II · q7 · source-bound solution visual</text>
  </g>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#64748b"/></marker></defs>
</svg>