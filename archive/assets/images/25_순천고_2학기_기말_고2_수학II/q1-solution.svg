<svg xmlns="http://www.w3.org/2000/svg" width="760" height="620" viewBox="0 0 760 620" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet">
  <title id="title">25_순천고_2학기_기말_고2_수학II · q1 해설 시각화</title>
  <desc id="desc">문항 1의 원문과 해설 흐름을 source-bound 텍스트 카드로 정리한 SVG</desc>
  <rect width="760" height="620" fill="#fff"/>
  <g font-family="Noto Sans KR, Pretendard, Apple SD Gothic Neo, Malgun Gothic, sans-serif" fill="#111">
    <text x="380" y="32" font-size="21" font-weight="700" text-anchor="middle">25_순천고_2학기_기말_고2_수학II · q1 해설 시각화</text>
    <text x="380" y="59" font-size="15" text-anchor="middle" fill="#475569">문항 원문과 해설의 핵심 흐름</text>
    <rect x="18" y="82" width="350" height="300" rx="12" fill="#eff6ff" stroke="#93c5fd"/>
    <rect x="390" y="82" width="352" height="300" rx="12" fill="#f0fdf4" stroke="#86efac"/>
    <text x="34" y="112" font-size="17" font-weight="700" fill="#1d4ed8">문항 핵심</text>
    <text x="398" y="112" font-size="17" font-weight="700" fill="#15803d">해설 흐름</text>
    <text x="34" y="140" font-size="15">x축 위를 움직이는 점 P의 시각 t일 때의 좌표가 x=t^3-3t^2-9t, t≥ 0</text>
    <text x="34" y="162" font-size="15">이다. 점 P가 운동 방향을 바꾸는 시각에서 가속도는? [3.2점]</text>
    <text x="398" y="140" font-size="14">[키포인트] 운동 방향이 바뀌는 시각은 속도의 부호가 바뀌는 시각이므로</text>
    <text x="398" y="162" font-size="14">위치함수를 미분하여 속도를 먼저 조사한다. 조건 정리: 점 P의 위치는</text>
    <text x="398" y="184" font-size="14">x(t)=t^3-3t^2-9t이고 t≥0이다. 풀이 방향: 속도 v(t)=x'(t)의 영점과</text>
    <text x="398" y="206" font-size="14">부호를 확인하여 방향이 바뀌는 시각을 정한 뒤, 가속도 a(t)=v'(t)를 그</text>
    <text x="398" y="228" font-size="14">시각에 대입한다. 정석 풀이: v(t)=x'(t)=3t^2-6t-9=3(t-3)(t+1)이다.</text>
    <text x="398" y="250" font-size="14">t≥0에서 속도가 0이 되는 시각은 t=3뿐이고, 0≤ t&lt;3에서는 v(t)&lt;0,</text>
    <text x="398" y="272" font-size="14">t&gt;3에서는 v(t)&gt;0이므로 t=3에서 운동 방향이 바뀐다. 가속도는</text>
    <text x="398" y="294" font-size="14">a(t)=v'(t)=6t-6이므로 a(3)=18-6=12이다. 따라서 정답은 ⑤이다.</text>
    <path d="M350 314 L410 314" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="18" y="350" width="724" height="48" rx="10" fill="#fff7ed" stroke="#fdba74"/>
    <text x="380" y="380" font-size="17" text-anchor="middle" fill="#9a3412">결론: ⑤</text>
    <text x="380" y="452" font-size="11" text-anchor="middle" fill="#64748b">25_순천고_2학기_기말_고2_수학II · q1 · source-bound solution visual</text>
  </g>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#64748b"/></marker></defs>
</svg>