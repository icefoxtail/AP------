<svg xmlns="http://www.w3.org/2000/svg" width="650" height="350" viewBox="0 0 650 350" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="t10 d10"><title id="t10">접선의 기울기에서 원래 함수 찾기</title><desc id="d10">접선의 기울기 f′(x)=6x²−2x+3을 적분하여 f(x)=2x³−x²+3x+C를 구하고, 점 (−1,−2)를 대입해 C=4를 결정한다.</desc><style>text{font-family:Arial,'Noto Sans KR','Malgun Gothic',sans-serif;fill:#152238}.title{font-size:21px;font-weight:700}.sub{font-size:16px}.axis{stroke:#667085;stroke-width:1.5}.guide{stroke:#98a2b3;stroke-width:1.1;stroke-dasharray:5 5}.curve{stroke:#2563eb;stroke-width:2.8;fill:none}.point{fill:white;stroke:#182230;stroke-width:2.2}.accent{fill:#1455aa;font-size:17px;font-weight:700}.body{fill:#344054;font-size:17px}.card{stroke:#d0d5dd;stroke-width:1.4;fill:#f8fafc}</style><rect width="650" height="350" fill="#fff"/><text class="title" x="25" y="34">접선의 기울기 → 원래 함수</text><rect class="card" x="55" y="65" width="540" height="63" rx="8"/><text class="body" x="80" y="104">f′(x) = 6x² − 2x + 3</text><text class="accent" x="299" y="151">↓ 부정적분</text><rect class="card" x="55" y="170" width="540" height="66" rx="8"/><text class="body" x="80" y="211">f(x) = 2x³ − x² + 3x + C</text><text class="accent" x="153" y="270">f(−1)=−2  ⇒  C=4</text><text class="accent" x="153" y="318">f(2)=16−4+6+4=22</text></svg>