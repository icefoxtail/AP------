<svg xmlns="http://www.w3.org/2000/svg" width="760" height="620" viewBox="0 0 760 620" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet">
  <title id="title">25_순천고_2학기_기말_고2_수학II · q10 해설 시각화</title>
  <desc id="desc">문항 10의 원문과 해설 흐름을 source-bound 텍스트 카드로 정리한 SVG</desc>
  <rect width="760" height="620" fill="#fff"/>
  <g font-family="Noto Sans KR, Pretendard, Apple SD Gothic Neo, Malgun Gothic, sans-serif" fill="#111">
    <text x="380" y="32" font-size="21" font-weight="700" text-anchor="middle">25_순천고_2학기_기말_고2_수학II · q10 해설 시각화</text>
    <text x="380" y="59" font-size="15" text-anchor="middle" fill="#475569">문항 원문과 해설의 핵심 흐름</text>
    <rect x="18" y="82" width="350" height="328" rx="12" fill="#eff6ff" stroke="#93c5fd"/>
    <rect x="390" y="82" width="352" height="328" rx="12" fill="#f0fdf4" stroke="#86efac"/>
    <text x="34" y="112" font-size="17" font-weight="700" fill="#1d4ed8">문항 핵심</text>
    <text x="398" y="112" font-size="17" font-weight="700" fill="#15803d">해설 흐름</text>
    <text x="34" y="140" font-size="15">점 (-1,-2)를 지나는 곡선 y=f(x) 위의</text>
    <text x="34" y="162" font-size="15">임의의 점 (x,f(x))에서 접선의 기울기는</text>
    <text x="34" y="184" font-size="15">6x^2-2x+3이다. 이때, f(2)의 값은?</text>
    <text x="34" y="206" font-size="15">[4.0점]</text>
    <text x="398" y="140" font-size="14">[키포인트] 곡선 위 점에서의 접선 기울기가 곧</text>
    <text x="398" y="162" font-size="14">f'(x)이므로, 주어진 기울기식을 적분하여</text>
    <text x="398" y="184" font-size="14">f(x)를 복원한다. 조건 정리: 모든 점</text>
    <text x="398" y="206" font-size="14">(x,f(x))에서 접선의 기울기가 6x^2-2x+3이고</text>
    <text x="398" y="228" font-size="14">곡선은 점 (-1,-2)를 지난다. 풀이 방향:</text>
    <text x="398" y="250" font-size="14">f'(x)=6x^2-2x+3을 적분한 뒤 f(-1)=-2로</text>
    <text x="398" y="272" font-size="14">적분상수를 정하고 f(2)를 계산한다. 정석</text>
    <text x="398" y="294" font-size="14">풀이: f'(x)=6x^2-2x+3이므로</text>
    <text x="398" y="316" font-size="14">f(x)=2x^3-x^2+3x+C이다. f(-1)=-2를</text>
    <text x="398" y="338" font-size="14">대입하면 -2-1-3+C=-2이므로 C=4이다. 따라서</text>
    <text x="398" y="360" font-size="14">f(2)=2×2^3-2^2+3×2+4=16-4+6+4=22이다.</text>
    <text x="398" y="382" font-size="14">따라서 정답은 ④이다.</text>
    <rect x="18" y="434" width="724" height="48" rx="10" fill="#fff7ed" stroke="#fdba74"/>
    <text x="380" y="464" font-size="17" text-anchor="middle" fill="#9a3412">결론: ④</text>
    <text x="380" y="510" font-size="11" text-anchor="middle" fill="#64748b">25_순천고_2학기_기말_고2_수학II · q10 · source-bound solution visual</text>
  </g>
</svg>