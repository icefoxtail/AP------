<svg xmlns="http://www.w3.org/2000/svg" width="760" height="620" viewBox="0 0 760 620" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet">
  <title id="title">25_순천고_2학기_기말_고2_수학II · q2 해설 시각화</title>
  <desc id="desc">문항 2의 원문과 해설 흐름을 source-bound 텍스트 카드로 정리한 SVG</desc>
  <rect width="760" height="620" fill="#fff"/>
  <g font-family="Noto Sans KR, Pretendard, Apple SD Gothic Neo, Malgun Gothic, sans-serif" fill="#111">
    <text x="380" y="32" font-size="21" font-weight="700" text-anchor="middle">25_순천고_2학기_기말_고2_수학II · q2 해설 시각화</text>
    <text x="380" y="59" font-size="15" text-anchor="middle" fill="#475569">문항 원문과 해설의 핵심 흐름</text>
    <rect x="18" y="82" width="350" height="394" rx="12" fill="#eff6ff" stroke="#93c5fd"/>
    <rect x="390" y="82" width="352" height="394" rx="12" fill="#f0fdf4" stroke="#86efac"/>
    <text x="34" y="112" font-size="17" font-weight="700" fill="#1d4ed8">문항 핵심</text>
    <text x="398" y="112" font-size="17" font-weight="700" fill="#15803d">해설 흐름</text>
    <text x="34" y="140" font-size="15">지면으로부터 10m 떨어진 건물 옥상에서</text>
    <text x="34" y="162" font-size="15">지면과 수직으로 위로 쏘아 올린 로켓의 t초</text>
    <text x="34" y="184" font-size="15">후의 속도 v(t)가 v(t)=30-3t일 때 이 로켓이</text>
    <text x="34" y="206" font-size="15">출발 이후 처음으로 이동 방향을 바꿀 때</text>
    <text x="34" y="228" font-size="15">지면으로부터의 높이는? (단, 0≤ t≤ 20이고</text>
    <text x="34" y="250" font-size="15">이 로켓의 이동 경로는 출발 지점에서 지면과</text>
    <text x="34" y="272" font-size="15">수직으로 그은 반직선이고 속도의 단위는</text>
    <text x="34" y="294" font-size="15">m/s이다.) [3.2점]</text>
    <text x="398" y="140" font-size="14">[키포인트] 처음 이동 방향이 바뀌는 시각까지의</text>
    <text x="398" y="162" font-size="14">변위를 적분하고, 출발 높이 10m를 더해 실제</text>
    <text x="398" y="184" font-size="14">높이를 구한다. 조건 정리: 속도는</text>
    <text x="398" y="206" font-size="14">v(t)=30-3t이고 출발할 때 지면으로부터의</text>
    <text x="398" y="228" font-size="14">높이는 10m이다. 풀이 방향: v(t)의 부호가</text>
    <text x="398" y="250" font-size="14">처음 바뀌는 시각을 찾은 뒤, 0초부터 그</text>
    <text x="398" y="272" font-size="14">시각까지의 변위를 정적분으로 계산한다. 정석</text>
    <text x="398" y="294" font-size="14">풀이: v(t)=30-3t=0에서 t=10이다. 0≤</text>
    <text x="398" y="316" font-size="14">t&lt;10에서는 v(t)&gt;0, 10&lt; t≤20에서는</text>
    <text x="398" y="338" font-size="14">v(t)&lt;0이므로 처음 방향을 바꾸는 시각은</text>
    <text x="398" y="360" font-size="14">t=10이다. 이때까지의 변위는 ∫[0,</text>
    <text x="398" y="382" font-size="14">10](30-3t)dt=[30t-3 /</text>
    <text x="398" y="404" font-size="14">2t^2][0]^10=300-150=150이다. 따라서</text>
    <text x="398" y="426" font-size="14">지면으로부터의 높이는 10+150=160m이다.</text>
    <text x="398" y="448" font-size="14">따라서 정답은 ③이다.</text>
    <rect x="18" y="500" width="724" height="48" rx="10" fill="#fff7ed" stroke="#fdba74"/>
    <text x="380" y="530" font-size="17" text-anchor="middle" fill="#9a3412">결론: ③</text>
    <text x="380" y="576" font-size="11" text-anchor="middle" fill="#64748b">25_순천고_2학기_기말_고2_수학II · q2 · source-bound solution visual</text>
  </g>
</svg>