<svg xmlns="http://www.w3.org/2000/svg" width="760" height="620" viewBox="0 0 760 620" role="img" aria-labelledby="title desc">
  <title id="title">25_순천고_2학기_기말_고2_수학II · q2 해설 시각화</title>
  <desc id="desc">문항 2의 원문과 해설 흐름을 source-bound 텍스트 카드로 정리한 SVG</desc>
  <rect width="760" height="620" fill="#fff"/>
  <g font-family="Arial, sans-serif" fill="#111">
    <text x="380" y="32" font-size="21" font-weight="700" text-anchor="middle">25_순천고_2학기_기말_고2_수학II · q2 해설 시각화</text>
    <text x="380" y="59" font-size="15" text-anchor="middle" fill="#475569">적분의 활용 · 속도와 위치</text>
    <rect x="18" y="82" width="350" height="350" rx="12" fill="#eff6ff" stroke="#93c5fd"/>
    <rect x="390" y="82" width="352" height="350" rx="12" fill="#f0fdf4" stroke="#86efac"/>
    <text x="34" y="112" font-size="17" font-weight="700" fill="#1d4ed8">문항 핵심</text>
    <text x="398" y="112" font-size="17" font-weight="700" fill="#15803d">해설 흐름</text>
    <text x="34" y="140" font-size="15">지면으로부터 10\mathrmm 떨어진 건물 옥상에서 지면과 수직으로 위로 쏘아 올린 로켓</text>
    <text x="34" y="162" font-size="15">의 t초 후의 속도 v(t)가 v(t)=30-3t일 때 이 로켓이 출발 이후 처음으로 이동</text>
    <text x="34" y="184" font-size="15"> 방향을 바꿀 때 지면으로부터의 높이는? (단, 0\le t\le 20이고 이 로켓의 이동</text>
    <text x="34" y="206" font-size="15"> 경로는 출발 지점에서 지면과 수직으로 그은 반직선이고 속도의 단위는 \mathrmm/s이</text>
    <text x="34" y="228" font-size="15">다.) [3.2점]</text>
    <text x="398" y="140" font-size="14">[키포인트] 처음 이동 방향이 바뀌는 시각까지의 변위를 적분하고, 출발 높이 10\math</text>
    <text x="398" y="162" font-size="14">rmm를 더해 실제 높이를 구한다. 조건 정리: 속도는 v(t)=30-3t이고 출발할 때 </text>
    <text x="398" y="184" font-size="14">지면으로부터의 높이는 10\mathrmm이다. 풀이 방향: v(t)의 부호가 처음 바뀌는 </text>
    <text x="398" y="206" font-size="14">시각을 찾은 뒤, 0초부터 그 시각까지의 변위를 정적분으로 계산한다. 정석 풀이: v(t)</text>
    <text x="398" y="228" font-size="14">=30-3t=0에서 t=10이다. 0\le t&lt;10에서는 v(t)&gt;0, 10&lt; t\le20</text>
    <text x="398" y="250" font-size="14">에서는 v(t)&lt;0이므로 처음 방향을 바꾸는 시각은 t=10이다. 이때까지의 변위는 ∫_0</text>
    <text x="398" y="272" font-size="14">^10(30-3t)dt=[30t-32t^2]_0^10=300-150=150이다. 따라서 지</text>
    <text x="398" y="294" font-size="14">면으로부터의 높이는 10+150=160\mathrmm이다. 따라서 정답은 ③이다.</text>
    <path d="M350 374 L410 374" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="18" y="396" width="724" height="48" rx="10" fill="#fff7ed" stroke="#fdba74"/>
    <text x="380" y="426" font-size="17" text-anchor="middle" fill="#9a3412">정답/결론: ③</text>
    <text x="380" y="471" font-size="13" text-anchor="middle" fill="#64748b">source: archive/exams/original/high/h2/2final/25_순천고_2학기_기말_고2_수학II.js · q2 · archive/assets/images/25_순천고_2학기_기말_고2_수학II/q2-solution.svg</text>
  </g>
