<svg xmlns="http://www.w3.org/2000/svg" width="760" height="620" viewBox="0 0 760 620" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet">
  <title id="title">25_순천고_2학기_기말_고2_수학II · q20 해설 시각화</title>
  <desc id="desc">문항 20의 원문과 해설 흐름을 source-bound 텍스트 카드로 정리한 SVG</desc>
  <rect width="760" height="620" fill="#fff"/>
  <g font-family="Noto Sans KR, Pretendard, Apple SD Gothic Neo, Malgun Gothic, sans-serif" fill="#111">
    <text x="380" y="32" font-size="21" font-weight="700" text-anchor="middle">25_순천고_2학기_기말_고2_수학II · q20 해설 시각화</text>
    <text x="380" y="59" font-size="15" text-anchor="middle" fill="#475569">문항 원문과 해설의 핵심 흐름</text>
    <rect x="18" y="82" width="350" height="328" rx="12" fill="#eff6ff" stroke="#93c5fd"/>
    <rect x="390" y="82" width="352" height="328" rx="12" fill="#f0fdf4" stroke="#86efac"/>
    <text x="34" y="112" font-size="17" font-weight="700" fill="#1d4ed8">문항 핵심</text>
    <text x="398" y="112" font-size="17" font-weight="700" fill="#15803d">해설 흐름</text>
    <text x="34" y="140" font-size="15">최고차항의 계수가 1인 삼차함수 f(x)에 대하여 함수 f(x)는 다음</text>
    <text x="34" y="162" font-size="15">&lt;조건&gt;을 만족한다. &lt;조건&gt; (가) 함수 y=f'(x)는 x=-1에서 최솟값을</text>
    <text x="34" y="184" font-size="15">갖는다. (나) f'(2)=0 함수 g(x)=|f(x)-f(-1)|이라고 할 때,</text>
    <text x="34" y="206" font-size="15">g(x)=f(-3)의 서로 다른 실근의 개수가 4개라고 하자. 이때, f(1)의</text>
    <text x="34" y="228" font-size="15">값은? [4.8점]</text>
    <text x="398" y="140" font-size="14">[키포인트] 도함수의 극값과 방정식의 실근 개수를 연결하여 상수항을</text>
    <text x="398" y="162" font-size="14">결정한다. 조건 정리: f의 최고차항 계수는 1이고 f'(x)는 x=-1에서</text>
    <text x="398" y="184" font-size="14">최솟값을 가지며 f'(2)=0이다. 풀이 방향: 먼저 f'(x)와 f(x)-f(-1)을</text>
    <text x="398" y="206" font-size="14">구한 뒤, 절댓값 방정식의 네 근 조건을 f'(x)의 극값과 비교한다. 정석</text>
    <text x="398" y="228" font-size="14">풀이: f'(x)는 최고차항 계수가 3인 이차식이고 꼭짓점의 x좌표가 -1이므로</text>
    <text x="398" y="250" font-size="14">f'(x)=3(x+1)^2+c이다. f'(2)=0에서 27+c=0이므로</text>
    <text x="398" y="272" font-size="14">f'(x)=3(x-2)(x+4)이다. 적분하면 f(x)=x^3+3x^2-24x+C이고,</text>
    <text x="398" y="294" font-size="14">h(x)=f(x)-f(-1)=x^3+3x^2-24x-26=(x+1)(x^2+2x-26)이다.</text>
    <text x="398" y="316" font-size="14">h'(x)=f'(x)이므로 h는 x=-4에서 최댓값 h(-4)=54, x=2에서 최솟값</text>
    <text x="398" y="338" font-size="14">h(2)=-54를 갖는다. 식 |h(x)|=f(-3)의 서로 다른 실근이 네 개이려면 두</text>
    <text x="398" y="360" font-size="14">수평선 h(x)=f(-3), h(x)=-f(-3)가 각각 한 극값에서 접하고 바깥쪽에서</text>
    <text x="398" y="382" font-size="14">한 번씩 더 만나야 한다. 따라서 f(-3)=54이다. f(-3)=72+C=54이므로</text>
    <text x="398" y="404" font-size="14">C=-18이고 f(1)=1+3-24-18=-38이다. 따라서 정답은 ⑤이다.</text>
    <path d="M350 342 L410 342" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="18" y="378" width="724" height="48" rx="10" fill="#fff7ed" stroke="#fdba74"/>
    <text x="380" y="408" font-size="17" text-anchor="middle" fill="#9a3412">결론: ⑤</text>
    <text x="380" y="480" font-size="11" text-anchor="middle" fill="#64748b">25_순천고_2학기_기말_고2_수학II · q20 · source-bound solution visual</text>
  </g>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#64748b"/></marker></defs>
</svg>