<svg xmlns="http://www.w3.org/2000/svg" width="760" height="620" viewBox="0 0 760 620" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet">
  <title id="title">25_순천고_2학기_기말_고2_수학II · q23 해설 시각화</title>
  <desc id="desc">문항 23의 원문과 해설 흐름을 source-bound 텍스트 카드로 정리한 SVG</desc>
  <rect width="760" height="620" fill="#fff"/>
  <g font-family="Noto Sans KR, Pretendard, Apple SD Gothic Neo, Malgun Gothic, sans-serif" fill="#111">
    <text x="380" y="32" font-size="21" font-weight="700" text-anchor="middle">25_순천고_2학기_기말_고2_수학II · q23 해설 시각화</text>
    <text x="380" y="59" font-size="15" text-anchor="middle" fill="#475569">문항 원문과 해설의 핵심 흐름</text>
    <rect x="18" y="82" width="350" height="350" rx="12" fill="#eff6ff" stroke="#93c5fd"/>
    <rect x="390" y="82" width="352" height="350" rx="12" fill="#f0fdf4" stroke="#86efac"/>
    <text x="34" y="112" font-size="17" font-weight="700" fill="#1d4ed8">문항 핵심</text>
    <text x="398" y="112" font-size="17" font-weight="700" fill="#15803d">해설 흐름</text>
    <text x="34" y="140" font-size="15">서답형 3. (서술형) 함수 f(x)는 최고차항의</text>
    <text x="34" y="162" font-size="15">계수가 1인 삼차함수이다. 함수 y=f'(x)의</text>
    <text x="34" y="184" font-size="15">그래프가 아래 그림과 같을 때, 함수 f(x)의</text>
    <text x="34" y="206" font-size="15">극댓값이 4이다. 함수 f(x)를 구하는 과정을</text>
    <text x="34" y="228" font-size="15">풀이 과정과 함께 서술하시오. (단,</text>
    <text x="34" y="250" font-size="15">f'(0)=f'(2)=0이다.) [부분 점수 있음,</text>
    <text x="34" y="272" font-size="15">4점]</text>
    <text x="398" y="140" font-size="14">[키포인트] 도함수의 영점과 극댓값 조건으로</text>
    <text x="398" y="162" font-size="14">삼차함수의 상수항을 결정한다. 조건 정리: f의</text>
    <text x="398" y="184" font-size="14">최고차항 계수는 1이고 f'(0)=f'(2)=0이며,</text>
    <text x="398" y="206" font-size="14">도함수 그래프는 위로 열린 포물선이다. 풀이</text>
    <text x="398" y="228" font-size="14">방향: 도함수의 최고차항 계수와 두 근으로</text>
    <text x="398" y="250" font-size="14">f'(x)를 정한 뒤 적분하고, x=0에서의</text>
    <text x="398" y="272" font-size="14">극댓값으로 적분상수를 구한다. 정석 풀이:</text>
    <text x="398" y="294" font-size="14">f'(x)의 최고차항 계수는 3이고 근은 0,</text>
    <text x="398" y="316" font-size="14">2이므로 f'(x)=3x(x-2)이다. f'(x)의 부호는</text>
    <text x="398" y="338" font-size="14">x&lt; 0에서 양수, 0&lt; x&lt; 2에서 음수, x&gt; 2에서</text>
    <text x="398" y="360" font-size="14">양수이므로 x=0에서 극댓값을 갖는다.</text>
    <text x="398" y="382" font-size="14">f(x)=x^3-3x^2+C이고 f(0)=4이므로 C=4이다.</text>
    <text x="398" y="404" font-size="14">따라서 구하는 함수는 f(x)=x^3-3x^2+4이다.</text>
    <rect x="18" y="456" width="724" height="48" rx="10" fill="#fff7ed" stroke="#fdba74"/>
    <text x="380" y="486" font-size="17" text-anchor="middle" fill="#9a3412">결론: f(x)=x^3-3x^2+4</text>
    <text x="380" y="532" font-size="11" text-anchor="middle" fill="#64748b">25_순천고_2학기_기말_고2_수학II · q23 · source-bound solution visual</text>
  </g>
</svg>