<svg xmlns="http://www.w3.org/2000/svg" width="760" height="620" viewBox="0 0 760 620" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet">
  <title id="title">25_순천고_2학기_기말_고2_수학II · q23 해설 시각화</title>
  <desc id="desc">문항 23의 원문과 해설 흐름을 source-bound 텍스트 카드로 정리한 SVG</desc>
  <rect width="760" height="620" fill="#fff"/>
  <g font-family="Noto Sans KR, Pretendard, Apple SD Gothic Neo, Malgun Gothic, sans-serif" fill="#111">
    <text x="380" y="32" font-size="21" font-weight="700" text-anchor="middle">25_순천고_2학기_기말_고2_수학II · q23 해설 시각화</text>
    <text x="380" y="59" font-size="15" text-anchor="middle" fill="#475569">도함수의 활용 · 도함수의 그래프</text>
    <rect x="18" y="82" width="350" height="350" rx="12" fill="#eff6ff" stroke="#93c5fd"/>
    <rect x="390" y="82" width="352" height="350" rx="12" fill="#f0fdf4" stroke="#86efac"/>
    <text x="34" y="112" font-size="17" font-weight="700" fill="#1d4ed8">문항 핵심</text>
    <text x="398" y="112" font-size="17" font-weight="700" fill="#15803d">해설 흐름</text>
    <text x="34" y="140" font-size="15">서답형 3. (서술형) 함수 f(x)는 최고차항의 계수가 1인 삼차함수이다. 함수 y=f'</text>
    <text x="34" y="162" font-size="15">(x)의 그래프가 아래 그림과 같을 때, 함수 f(x)의 극댓값이 4이다. 함수 f(x)를</text>
    <text x="34" y="184" font-size="15"> 구하는 과정을 풀이 과정과 함께 서술하시오. (단, f'(0)=f'(2)=0이다.) [부</text>
    <text x="34" y="206" font-size="15">분 점수 있음, 4점]</text>
    <text x="398" y="140" font-size="14">[키포인트] 도함수의 영점과 극댓값 조건으로 삼차함수의 상수항을 결정한다. 조건 정리: f</text>
    <text x="398" y="162" font-size="14">의 최고차항 계수는 1이고 f'(0)=f'(2)=0이며, 도함수 그래프는 위로 열린 포물선</text>
    <text x="398" y="184" font-size="14">이다. 풀이 방향: 도함수의 최고차항 계수와 두 근으로 f'(x)를 정한 뒤 적분하고, x</text>
    <text x="398" y="206" font-size="14">=0에서의 극댓값으로 적분상수를 구한다. 정석 풀이: f'(x)의 최고차항 계수는 3이고 </text>
    <text x="398" y="228" font-size="14">근은 0, 2이므로 f'(x)=3x(x-2)이다. f'(x)의 부호는 x&lt; 0에서 양수, </text>
    <text x="398" y="250" font-size="14">0&lt; x&lt; 2에서 음수, x&gt; 2에서 양수이므로 x=0에서 극댓값을 갖는다. f(x)=x^</text>
    <text x="398" y="272" font-size="14">3-3x^2+C이고 f(0)=4이므로 C=4이다. 따라서 구하는 함수는 f(x)=x^3-3</text>
    <text x="398" y="294" font-size="14">x^2+4이다.</text>
    <path d="M350 374 L410 374" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="18" y="396" width="724" height="48" rx="10" fill="#fff7ed" stroke="#fdba74"/>
    <text x="380" y="426" font-size="17" text-anchor="middle" fill="#9a3412">결론: f(x)=x^3-3x^2+4</text>
    <text x="380" y="471" font-size="13" text-anchor="middle" fill="#64748b">source: archive/exams/original/high/h2/2final/25_순천고_2학기_기말_고2_수학II.js · q23 · archive/assets/images/25_순천고_2학기_기말_고2_수학II/q23-solution.svg</text>
  </g>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#64748b"/></marker></defs>
</svg>