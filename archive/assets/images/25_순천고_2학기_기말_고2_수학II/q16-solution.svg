<svg xmlns="http://www.w3.org/2000/svg" width="640" height="430" viewBox="0 0 640 430" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet">
  <title id="title">삼각형 POH 넓이의 최댓값</title><desc id="desc">곡선 f(x)=x(a-x)^2 위에서 삼각형 POH의 넓이가 최대가 되는 p=a/2를 O와 A의 정확한 중점으로 표시한다.</desc>
  <rect width="640" height="430" fill="#fff"/><g font-family="Arial, sans-serif" fill="#111">
    <text x="320" y="27" font-size="20" text-anchor="middle" font-weight="700">S(t)=1/2·t²(a−t)²의 최댓값</text>
    <g transform="translate(28 48)"><line x1="30" y1="270" x2="470" y2="270" stroke="#111" stroke-width="2"/><line x1="65" y1="25" x2="65" y2="300" stroke="#111" stroke-width="2"/>
      <polyline points="65,270 120,148 175,90 193.33,80 230,84 257.5,99 340,165 395,222 450,270" fill="none" stroke="#1d4ed8" stroke-width="3"/>
      <polygon points="65,270 257.5,99 257.5,270" fill="#bfdbfe" opacity="0.9"/><line x1="257.5" y1="99" x2="257.5" y2="270" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 5"/><line x1="65" y1="270" x2="257.5" y2="270" stroke="#dc2626" stroke-width="2"/>
      <circle data-point="O" cx="65" cy="270" r="5" fill="#111"/><circle data-point="P" cx="257.5" cy="99" r="5" fill="#111"/><circle data-point="H" cx="257.5" cy="270" r="5" fill="#111"/><circle data-point="A" cx="450" cy="270" r="5" fill="#111"/>
      <text x="58" y="292" font-size="16">O</text><text x="264.5" y="91" font-size="16">P(p,f(p))</text><text x="264.5" y="292" font-size="16">H=(p,0)</text><text x="450" y="292" font-size="16" text-anchor="middle">A(a,0)</text><text x="257.5" y="316" font-size="16" text-anchor="middle" fill="#dc2626">p=a/2</text>
      <text x="365" y="42" font-size="15" fill="#1d4ed8">f(x)=x(a−x)²</text><text x="430" y="255" font-size="15">x</text><text x="48" y="36" font-size="15">y</text>
    </g>
    <g transform="translate(500 75)"><text x="0" y="0" font-size="16" font-weight="700">부호표</text><text x="0" y="35" font-size="15" fill="#15803d">0&lt;t&lt;a/2: S′&gt;0</text><text x="0" y="66" font-size="15" fill="#b91c1c">a/2&lt;t&lt;a: S′&lt;0</text><text x="0" y="115" font-size="15">S′=t(a−t)(a−2t)</text><text x="0" y="160" font-size="15" fill="#1d4ed8">M/p = a³/16</text></g>
  </g></svg>
