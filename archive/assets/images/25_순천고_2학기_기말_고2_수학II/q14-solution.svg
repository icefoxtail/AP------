<svg xmlns="http://www.w3.org/2000/svg" width="760" height="620" viewBox="0 0 760 620" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet">
  <title id="title">25_순천고_2학기_기말_고2_수학II · q14 해설 시각화</title>
  <desc id="desc">문항 14의 원문과 해설 흐름을 source-bound 텍스트 카드로 정리한 SVG</desc>
  <rect width="760" height="620" fill="#fff"/>
  <g font-family="Noto Sans KR, Pretendard, Apple SD Gothic Neo, Malgun Gothic, sans-serif" fill="#111">
    <text x="380" y="32" font-size="21" font-weight="700" text-anchor="middle">25_순천고_2학기_기말_고2_수학II · q14 해설 시각화</text>
    <text x="380" y="59" font-size="15" text-anchor="middle" fill="#475569">문항 원문과 해설의 핵심 흐름</text>
    <rect x="18" y="82" width="350" height="350" rx="12" fill="#eff6ff" stroke="#93c5fd"/>
    <rect x="390" y="82" width="352" height="350" rx="12" fill="#f0fdf4" stroke="#86efac"/>
    <text x="34" y="112" font-size="17" font-weight="700" fill="#1d4ed8">문항 핵심</text>
    <text x="398" y="112" font-size="17" font-weight="700" fill="#15803d">해설 흐름</text>
    <text x="34" y="140" font-size="15">곡선 y=x^2을 x축에 대하여 대칭이동한 후</text>
    <text x="34" y="162" font-size="15">x축의 방향으로 2만큼, y축의 방향으로 4만큼</text>
    <text x="34" y="184" font-size="15">평행이동한 곡선을 y=f(x)라 하자. 두 곡선</text>
    <text x="34" y="206" font-size="15">y=x^2, y=f(x)로 둘러싸인 도형의 넓이는?</text>
    <text x="34" y="228" font-size="15">[4.3점]</text>
    <text x="398" y="140" font-size="14">[키포인트] 이동한 곡선의 식과 두 교점을 구한</text>
    <text x="398" y="162" font-size="14">뒤 위·아래 함수의 차를 적분한다. 조건 정리:</text>
    <text x="398" y="184" font-size="14">y=x^2를 x축 대칭하면 y=-x^2이고, 오른쪽으로</text>
    <text x="398" y="206" font-size="14">2, 위로 4만큼 이동하면</text>
    <text x="398" y="228" font-size="14">f(x)=-(x-2)^2+4=-x^2+4x이다. 풀이 방향:</text>
    <text x="398" y="250" font-size="14">두 곡선의 교점을 구하고, 교점 사이에서 위에</text>
    <text x="398" y="272" font-size="14">있는 곡선에서 아래에 있는 곡선을 뺀다. 정석</text>
    <text x="398" y="294" font-size="14">풀이: x^2=-x^2+4x에서 2x(x-2)=0이므로</text>
    <text x="398" y="316" font-size="14">교점의 x좌표는 0,2이다. 0&lt; x&lt; 2에서는 f(x)&gt;</text>
    <text x="398" y="338" font-size="14">x^2이므로 S =∫[0, 2]{(-x^2+4x)-x^2}dx;</text>
    <text x="398" y="360" font-size="14">=∫[0, 2](-2x^2+4x)dx=[-2 /</text>
    <text x="398" y="382" font-size="14">3x^3+2x^2][0]^2=8 / 3. 따라서 정답은</text>
    <text x="398" y="404" font-size="14">①이다.</text>
    <rect x="18" y="456" width="724" height="48" rx="10" fill="#fff7ed" stroke="#fdba74"/>
    <text x="380" y="486" font-size="17" text-anchor="middle" fill="#9a3412">결론: ①</text>
    <text x="380" y="532" font-size="11" text-anchor="middle" fill="#64748b">25_순천고_2학기_기말_고2_수학II · q14 · source-bound solution visual</text>
  </g>
</svg>