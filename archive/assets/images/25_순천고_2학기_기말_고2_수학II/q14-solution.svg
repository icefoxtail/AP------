<svg xmlns="http://www.w3.org/2000/svg" width="760" height="620" viewBox="0 0 760 620" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet">
  <title id="title">25_순천고_2학기_기말_고2_수학II · q14 해설 시각화</title>
  <desc id="desc">문항 14의 원문과 해설 흐름을 source-bound 텍스트 카드로 정리한 SVG</desc>
  <rect width="760" height="620" fill="#fff"/>
  <g font-family="Noto Sans KR, Pretendard, Apple SD Gothic Neo, Malgun Gothic, sans-serif" fill="#111">
    <text x="380" y="32" font-size="21" font-weight="700" text-anchor="middle">25_순천고_2학기_기말_고2_수학II · q14 해설 시각화</text>
    <text x="380" y="59" font-size="15" text-anchor="middle" fill="#475569">적분의 활용 · 평행이동과 넓이</text>
    <rect x="18" y="82" width="350" height="350" rx="12" fill="#eff6ff" stroke="#93c5fd"/>
    <rect x="390" y="82" width="352" height="350" rx="12" fill="#f0fdf4" stroke="#86efac"/>
    <text x="34" y="112" font-size="17" font-weight="700" fill="#1d4ed8">문항 핵심</text>
    <text x="398" y="112" font-size="17" font-weight="700" fill="#15803d">해설 흐름</text>
    <text x="34" y="140" font-size="15">곡선 y=x^2을 x축에 대하여 대칭이동한 후 x축의 방향으로 2만큼, y축의 방향으로 4</text>
    <text x="34" y="162" font-size="15">만큼 평행이동한 곡선을 y=f(x)라 하자. 두 곡선 y=x^2, y=f(x)로 둘러싸인 </text>
    <text x="34" y="184" font-size="15">도형의 넓이는? [4.3점]</text>
    <text x="398" y="140" font-size="14">[키포인트] 이동한 곡선의 식과 두 교점을 구한 뒤 위·아래 함수의 차를 적분한다. 조건 </text>
    <text x="398" y="162" font-size="14">정리: y=x^2를 x축 대칭하면 y=-x^2이고, 오른쪽으로 2, 위로 4만큼 이동하면 </text>
    <text x="398" y="184" font-size="14">f(x)=-(x-2)^2+4=-x^2+4x이다. 풀이 방향: 두 곡선의 교점을 구하고, 교</text>
    <text x="398" y="206" font-size="14">점 사이에서 위에 있는 곡선에서 아래에 있는 곡선을 뺀다. 정석 풀이: x^2=-x^2+4</text>
    <text x="398" y="228" font-size="14">x에서 2x(x-2)=0이므로 교점의 x좌표는 0,2이다. 0&lt; x&lt; 2에서는 f(x)&gt; </text>
    <text x="398" y="250" font-size="14">x^2이므로 \beginalignedS&amp;=∫_0^2\(-x^2+4x)-x^2\dx\\ &amp;=</text>
    <text x="398" y="272" font-size="14">∫_0^2(-2x^2+4x)dx=[-23x^3+2x^2]_0^2=83. \endaligne</text>
    <text x="398" y="294" font-size="14">d 따라서 정답은 ①이다.</text>
    <path d="M350 374 L410 374" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="18" y="396" width="724" height="48" rx="10" fill="#fff7ed" stroke="#fdba74"/>
    <text x="380" y="426" font-size="17" text-anchor="middle" fill="#9a3412">결론: ①</text>
    <text x="380" y="471" font-size="13" text-anchor="middle" fill="#64748b">source: archive/exams/original/high/h2/2final/25_순천고_2학기_기말_고2_수학II.js · q14 · archive/assets/images/25_순천고_2학기_기말_고2_수학II/q14-solution.svg</text>
  </g>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#64748b"/></marker></defs>
</svg>