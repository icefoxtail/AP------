<svg xmlns="http://www.w3.org/2000/svg" width="760" height="620" viewBox="0 0 760 620" role="img" aria-labelledby="title desc">
  <title id="title">25_순천고_2학기_기말_고2_수학II · q13 해설 시각화</title>
  <desc id="desc">문항 13의 원문과 해설 흐름을 source-bound 텍스트 카드로 정리한 SVG</desc>
  <rect width="760" height="620" fill="#fff"/>
  <g font-family="Arial, sans-serif" fill="#111">
    <text x="380" y="32" font-size="21" font-weight="700" text-anchor="middle">25_순천고_2학기_기말_고2_수학II · q13 해설 시각화</text>
    <text x="380" y="59" font-size="15" text-anchor="middle" fill="#475569">적분의 활용 · 구간함수와 넓이</text>
    <rect x="18" y="82" width="350" height="350" rx="12" fill="#eff6ff" stroke="#93c5fd"/>
    <rect x="390" y="82" width="352" height="350" rx="12" fill="#f0fdf4" stroke="#86efac"/>
    <text x="34" y="112" font-size="17" font-weight="700" fill="#1d4ed8">문항 핵심</text>
    <text x="398" y="112" font-size="17" font-weight="700" fill="#15803d">해설 흐름</text>
    <text x="34" y="140" font-size="15">함수 f(x)=\begincases-x+1&amp;(x&lt; -1)\\x^2-x&amp;(x\ge -1)\e</text>
    <text x="34" y="162" font-size="15">ndcases에 대해 닫힌구간 [-2,2]에서 y=f(x)의 그래프, x=-2, x=2, </text>
    <text x="34" y="184" font-size="15">x축으로 둘러싸인 도형의 넓이를 k라고 할 때 3k의 값은? [4.2점]</text>
    <text x="398" y="140" font-size="14">[키포인트] 구간함수의 식과 부호를 모두 확인하여 넓이를 네 구간의 적분으로 나눈다. 조건</text>
    <text x="398" y="162" font-size="14"> 정리: [-2,-1)에서는 f(x)=-x+1&gt; 0, [-1,0]에서는 f(x)=x^2-x</text>
    <text x="398" y="184" font-size="14">\ge0, (0,1)에서는 f(x)&lt; 0, [1,2]에서는 f(x)\ge0이다. 풀이 방향</text>
    <text x="398" y="206" font-size="14">: x=-1,0,1을 기준으로 부호를 나누고, 음수 구간의 적분에는 마이너스를 붙인다. 정</text>
    <text x="398" y="228" font-size="14">석 풀이: \beginalignedk&amp;=∫_-2^-1(-x+1)dx+∫_-1^0(x^2-x</text>
    <text x="398" y="250" font-size="14">)dx-∫_0^1(x^2-x)dx+∫_1^2(x^2-x)dx\\ &amp;=52+56+16+56=</text>
    <text x="398" y="272" font-size="14">133. \endaligned 따라서 3k=13이고 정답은 ④이다.</text>
    <path d="M350 352 L410 352" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="18" y="374" width="724" height="48" rx="10" fill="#fff7ed" stroke="#fdba74"/>
    <text x="380" y="404" font-size="17" text-anchor="middle" fill="#9a3412">정답/결론: ④</text>
    <text x="380" y="449" font-size="13" text-anchor="middle" fill="#64748b">source: archive/exams/original/high/h2/2final/25_순천고_2학기_기말_고2_수학II.js · q13 · archive/assets/images/25_순천고_2학기_기말_고2_수학II/q13-solution.svg</text>
  </g>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#64748b"/></marker></defs>
</svg>