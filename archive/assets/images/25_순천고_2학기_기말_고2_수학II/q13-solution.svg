<svg xmlns="http://www.w3.org/2000/svg" width="760" height="620" viewBox="0 0 760 620" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet">
  <title id="title">25_순천고_2학기_기말_고2_수학II · q13 해설 시각화</title>
  <desc id="desc">문항 13의 원문과 해설 흐름을 source-bound 텍스트 카드로 정리한 SVG</desc>
  <rect width="760" height="620" fill="#fff"/>
  <g font-family="Noto Sans KR, Pretendard, Apple SD Gothic Neo, Malgun Gothic, sans-serif" fill="#111">
    <text x="380" y="32" font-size="21" font-weight="700" text-anchor="middle">25_순천고_2학기_기말_고2_수학II · q13 해설 시각화</text>
    <text x="380" y="59" font-size="15" text-anchor="middle" fill="#475569">문항 원문과 해설의 핵심 흐름</text>
    <rect x="18" y="82" width="350" height="306" rx="12" fill="#eff6ff" stroke="#93c5fd"/>
    <rect x="390" y="82" width="352" height="306" rx="12" fill="#f0fdf4" stroke="#86efac"/>
    <text x="34" y="112" font-size="17" font-weight="700" fill="#1d4ed8">문항 핵심</text>
    <text x="398" y="112" font-size="17" font-weight="700" fill="#15803d">해설 흐름</text>
    <text x="34" y="140" font-size="15">함수 f(x)=-x+1 (x&lt; -1); x^2-x (x≥ -1)에</text>
    <text x="34" y="162" font-size="15">대해 닫힌구간 [-2,2]에서 y=f(x)의 그래프,</text>
    <text x="34" y="184" font-size="15">x=-2, x=2, x축으로 둘러싸인 도형의 넓이를</text>
    <text x="34" y="206" font-size="15">k라고 할 때 3k의 값은? [4.2점]</text>
    <text x="398" y="140" font-size="14">[키포인트] 구간함수의 식과 부호를 모두</text>
    <text x="398" y="162" font-size="14">확인하여 넓이를 네 구간의 적분으로 나눈다.</text>
    <text x="398" y="184" font-size="14">조건 정리: [-2,-1)에서는 f(x)=-x+1&gt; 0,</text>
    <text x="398" y="206" font-size="14">[-1,0]에서는 f(x)=x^2-x≥0, (0,1)에서는</text>
    <text x="398" y="228" font-size="14">f(x)&lt; 0, [1,2]에서는 f(x)≥0이다. 풀이 방향:</text>
    <text x="398" y="250" font-size="14">x=-1,0,1을 기준으로 부호를 나누고, 음수</text>
    <text x="398" y="272" font-size="14">구간의 적분에는 마이너스를 붙인다. 정석 풀이:</text>
    <text x="398" y="294" font-size="14">k =∫[-2, -1](-x+1)dx+∫[-1,</text>
    <text x="398" y="316" font-size="14">0](x^2-x)dx-∫[0, 1](x^2-x)dx+∫[1,</text>
    <text x="398" y="338" font-size="14">2](x^2-x)dx; =5 / 2+5 / 6+1 / 6+5 / 6=13 /</text>
    <text x="398" y="360" font-size="14">3. 따라서 3k=13이고 정답은 ④이다.</text>
    <rect x="18" y="412" width="724" height="48" rx="10" fill="#fff7ed" stroke="#fdba74"/>
    <text x="380" y="442" font-size="17" text-anchor="middle" fill="#9a3412">결론: ④</text>
    <text x="380" y="488" font-size="11" text-anchor="middle" fill="#64748b">25_순천고_2학기_기말_고2_수학II · q13 · source-bound solution visual</text>
  </g>
</svg>