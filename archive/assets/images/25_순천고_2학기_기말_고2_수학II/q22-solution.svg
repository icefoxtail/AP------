<svg xmlns="http://www.w3.org/2000/svg" width="760" height="814" viewBox="0 0 760 814" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet">
  <title id="title">25_순천고_2학기_기말_고2_수학II · q22 해설 시각화</title>
  <desc id="desc">문항 22의 원문과 해설 흐름을 source-bound 텍스트 카드로 정리한 SVG</desc>
  <rect width="760" height="814" fill="#fff"/>
  <g font-family="Noto Sans KR, Pretendard, Apple SD Gothic Neo, Malgun Gothic, sans-serif" fill="#111">
    <text x="380" y="32" font-size="21" font-weight="700" text-anchor="middle">25_순천고_2학기_기말_고2_수학II · q22 해설 시각화</text>
    <text x="380" y="59" font-size="15" text-anchor="middle" fill="#475569">문항 원문과 해설의 핵심 흐름</text>
    <rect x="18" y="82" width="350" height="592" rx="12" fill="#eff6ff" stroke="#93c5fd"/>
    <rect x="390" y="82" width="352" height="592" rx="12" fill="#f0fdf4" stroke="#86efac"/>
    <text x="34" y="112" font-size="17" font-weight="700" fill="#1d4ed8">문항 핵심</text>
    <text x="398" y="112" font-size="17" font-weight="700" fill="#15803d">해설 흐름</text>
    <text x="34" y="140" font-size="15">서답형 2. (서술형) 다항함수 f(x)와</text>
    <text x="34" y="162" font-size="15">삼차함수 g(x)가 다음 조건을 모두 만족시킬</text>
    <text x="34" y="184" font-size="15">때 g'(-2)의 최댓값을 구하는 과정을 풀이</text>
    <text x="34" y="206" font-size="15">과정과 함께 서술하시오. [부분 점수 있음,</text>
    <text x="34" y="228" font-size="15">6점] &lt;조건&gt; (가) 모든 실수 t에 대해</text>
    <text x="34" y="250" font-size="15">-74≤∫[2t-4, 2t]f'(x)dx≤74 (나) 모든</text>
    <text x="34" y="272" font-size="15">실수 x[1], x[2]에 대해 x[1]≠ x[2]면</text>
    <text x="34" y="294" font-size="15">g(x[1])≠ g(x[2]) (다) g'(-3)=0,</text>
    <text x="34" y="316" font-size="15">f'(1)+∫[0, 1] 3g'(x)dx=0</text>
    <text x="398" y="140" font-size="14">[키포인트] (가)의 적분을 함수값의 차로 바꾸어</text>
    <text x="398" y="162" font-size="14">f의 차수를 제한하고, 일대일 삼차함수의 도함수</text>
    <text x="398" y="184" font-size="14">형태를 이용한다. 조건 정리: 모든 실수 t에 대해</text>
    <text x="398" y="206" font-size="14">-74≤∫[2t-4, 2t]f'(x)dx≤74이고, g는</text>
    <text x="398" y="228" font-size="14">일대일인 삼차함수이며 g'(-3)=0이다. 풀이</text>
    <text x="398" y="250" font-size="14">방향: 먼저 (가)에서 f가 일차 이하임을 보이고</text>
    <text x="398" y="272" font-size="14">f'(1)의 범위를 구한다. 다음으로 g'가 x=-3을</text>
    <text x="398" y="294" font-size="14">중근으로 갖는 이차식임을 이용하여 g'(-2)의</text>
    <text x="398" y="316" font-size="14">범위를 정한다. 정석 풀이: 미적분의 기본정리에</text>
    <text x="398" y="338" font-size="14">의해 ∫[2t-4,</text>
    <text x="398" y="360" font-size="14">2t]f'(x)dx=f(2t)-f(2t-4)이다. f가 이차</text>
    <text x="398" y="382" font-size="14">이상인 다항함수라면 이 차는 t에 대한 비상수</text>
    <text x="398" y="404" font-size="14">다항식이 되어 모든 실수 t에서 유계일 수 없다.</text>
    <text x="398" y="426" font-size="14">따라서 f(x)=Ax+B이고, (가)는</text>
    <text x="398" y="448" font-size="14">-74≤4A≤74이므로 |A|≤37 / 2이다. 따라서</text>
    <text x="398" y="470" font-size="14">f'(1)=A이다. g가 일대일인 삼차함수이므로</text>
    <text x="398" y="492" font-size="14">g'는 실수 전체에서 부호가 바뀌지 않는다.</text>
    <text x="398" y="514" font-size="14">g'(-3)=0이고 g'는 이차식이므로 -3은</text>
    <text x="398" y="536" font-size="14">중근이고 g'(x)=C(x+3)^2 (C≠0)로 둘 수 있다.</text>
    <text x="398" y="558" font-size="14">이때 g'(-2)=C이다. (다)에서 A+∫[0, 1]</text>
    <text x="398" y="580" font-size="14">3C(x+3)^2dx=A+37C=0이므로 C=-A / 37이다.</text>
    <text x="398" y="602" font-size="14">따라서 |C|≤1 / 2이고, A=-37 / 2일 때 C=1 /</text>
    <text x="398" y="624" font-size="14">2가 가능하다. 따라서 구하는 최댓값은 1 /</text>
    <text x="398" y="646" font-size="14">2이다.</text>
    <rect x="18" y="698" width="724" height="48" rx="10" fill="#fff7ed" stroke="#fdba74"/>
    <text x="380" y="728" font-size="17" text-anchor="middle" fill="#9a3412">결론: 1 / 2</text>
    <text x="380" y="774" font-size="11" text-anchor="middle" fill="#64748b">25_순천고_2학기_기말_고2_수학II · q22 · source-bound solution visual</text>
  </g>
</svg>