<svg xmlns="http://www.w3.org/2000/svg" width="760" height="620" viewBox="0 0 760 620" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet">
  <title id="title">25_순천고_2학기_기말_고2_수학II · q6 해설 시각화</title>
  <desc id="desc">문항 6의 원문과 해설 흐름을 source-bound 텍스트 카드로 정리한 SVG</desc>
  <rect width="760" height="620" fill="#fff"/>
  <g font-family="Noto Sans KR, Pretendard, Apple SD Gothic Neo, Malgun Gothic, sans-serif" fill="#111">
    <text x="380" y="32" font-size="21" font-weight="700" text-anchor="middle">25_순천고_2학기_기말_고2_수학II · q6 해설 시각화</text>
    <text x="380" y="59" font-size="15" text-anchor="middle" fill="#475569">도함수의 활용 · 속도와 높이</text>
    <rect x="18" y="82" width="350" height="350" rx="12" fill="#eff6ff" stroke="#93c5fd"/>
    <rect x="390" y="82" width="352" height="350" rx="12" fill="#f0fdf4" stroke="#86efac"/>
    <text x="34" y="112" font-size="17" font-weight="700" fill="#1d4ed8">문항 핵심</text>
    <text x="398" y="112" font-size="17" font-weight="700" fill="#15803d">해설 흐름</text>
    <text x="34" y="140" font-size="15">지상에서 똑바로 위를 향하여 속도 30\mathrmm/s로 던진 물체가 t초 후에 도달하는</text>
    <text x="34" y="162" font-size="15"> 높이를 x\mathrmm라고 하면 x=30t-5t^2 인 관계가 성립한다. 이 물체가 최</text>
    <text x="34" y="184" font-size="15">고 지점에 도달했을 때 지면으로부터의 높이는? (단, 0\le t\le 6) [3.6점]</text>
    <text x="398" y="140" font-size="14">[키포인트] 높이함수의 최댓값은 상승에서 하강으로 바뀌는 시각, 즉 속도가 양수에서 음수로</text>
    <text x="398" y="162" font-size="14"> 바뀌는 시각에서 얻어진다. 조건 정리: 물체의 높이는 x(t)=30t-5t^2이고 0\l</text>
    <text x="398" y="184" font-size="14">e t\le6이다. 풀이 방향: 속도 x'(t)가 0이 되는 시각과 그 전후의 부호를 확인</text>
    <text x="398" y="206" font-size="14">하여 최고점 도달 시각을 정한 뒤 높이함수에 대입한다. 정석 풀이: x'(t)=30-10t</text>
    <text x="398" y="228" font-size="14">=10(3-t)이므로 x'(t)=0인 시각은 t=3이다. 0\le t&lt;3에서는 x'(t)&gt;</text>
    <text x="398" y="250" font-size="14">0이고 3&lt; t\le6에서는 x'(t)&lt;0이므로 t=3에서 높이가 최대가 된다. 따라서 최</text>
    <text x="398" y="272" font-size="14">고 높이는 x(3)=30×3-5×3^2=90-45=45이다. 따라서 정답은 ②이다.</text>
    <path d="M350 352 L410 352" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="18" y="374" width="724" height="48" rx="10" fill="#fff7ed" stroke="#fdba74"/>
    <text x="380" y="404" font-size="17" text-anchor="middle" fill="#9a3412">결론: ②</text>
    <text x="380" y="449" font-size="13" text-anchor="middle" fill="#64748b">source: archive/exams/original/high/h2/2final/25_순천고_2학기_기말_고2_수학II.js · q6 · archive/assets/images/25_순천고_2학기_기말_고2_수학II/q6-solution.svg</text>
  </g>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#64748b"/></marker></defs>
</svg>