<svg xmlns="http://www.w3.org/2000/svg" width="760" height="620" viewBox="0 0 760 620" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet">
  <title id="title">25_순천고_2학기_기말_고2_수학II · q6 해설 시각화</title>
  <desc id="desc">문항 6의 원문과 해설 흐름을 source-bound 텍스트 카드로 정리한 SVG</desc>
  <rect width="760" height="620" fill="#fff"/>
  <g font-family="Noto Sans KR, Pretendard, Apple SD Gothic Neo, Malgun Gothic, sans-serif" fill="#111">
    <text x="380" y="32" font-size="21" font-weight="700" text-anchor="middle">25_순천고_2학기_기말_고2_수학II · q6 해설 시각화</text>
    <text x="380" y="59" font-size="15" text-anchor="middle" fill="#475569">문항 원문과 해설의 핵심 흐름</text>
    <rect x="18" y="82" width="350" height="350" rx="12" fill="#eff6ff" stroke="#93c5fd"/>
    <rect x="390" y="82" width="352" height="350" rx="12" fill="#f0fdf4" stroke="#86efac"/>
    <text x="34" y="112" font-size="17" font-weight="700" fill="#1d4ed8">문항 핵심</text>
    <text x="398" y="112" font-size="17" font-weight="700" fill="#15803d">해설 흐름</text>
    <text x="34" y="140" font-size="15">지상에서 똑바로 위를 향하여 속도 30m/s로</text>
    <text x="34" y="162" font-size="15">던진 물체가 t초 후에 도달하는 높이를 xm라고</text>
    <text x="34" y="184" font-size="15">하면 x=30t-5t^2 인 관계가 성립한다. 이</text>
    <text x="34" y="206" font-size="15">물체가 최고 지점에 도달했을 때</text>
    <text x="34" y="228" font-size="15">지면으로부터의 높이는? (단, 0≤ t≤ 6)</text>
    <text x="34" y="250" font-size="15">[3.6점]</text>
    <text x="398" y="140" font-size="14">[키포인트] 높이함수의 최댓값은 상승에서</text>
    <text x="398" y="162" font-size="14">하강으로 바뀌는 시각, 즉 속도가 양수에서</text>
    <text x="398" y="184" font-size="14">음수로 바뀌는 시각에서 얻어진다. 조건 정리:</text>
    <text x="398" y="206" font-size="14">물체의 높이는 x(t)=30t-5t^2이고 0≤</text>
    <text x="398" y="228" font-size="14">t≤6이다. 풀이 방향: 속도 x'(t)가 0이 되는</text>
    <text x="398" y="250" font-size="14">시각과 그 전후의 부호를 확인하여 최고점 도달</text>
    <text x="398" y="272" font-size="14">시각을 정한 뒤 높이함수에 대입한다. 정석</text>
    <text x="398" y="294" font-size="14">풀이: x'(t)=30-10t=10(3-t)이므로</text>
    <text x="398" y="316" font-size="14">x'(t)=0인 시각은 t=3이다. 0≤ t&lt;3에서는</text>
    <text x="398" y="338" font-size="14">x'(t)&gt;0이고 3&lt; t≤6에서는 x'(t)&lt;0이므로</text>
    <text x="398" y="360" font-size="14">t=3에서 높이가 최대가 된다. 따라서 최고</text>
    <text x="398" y="382" font-size="14">높이는 x(3)=30×3-5×3^2=90-45=45이다.</text>
    <text x="398" y="404" font-size="14">따라서 정답은 ②이다.</text>
    <rect x="18" y="456" width="724" height="48" rx="10" fill="#fff7ed" stroke="#fdba74"/>
    <text x="380" y="486" font-size="17" text-anchor="middle" fill="#9a3412">결론: ②</text>
    <text x="380" y="532" font-size="11" text-anchor="middle" fill="#64748b">25_순천고_2학기_기말_고2_수학II · q6 · source-bound solution visual</text>
  </g>
</svg>