  <title id="title">25_순천고_2학기_기말_고2_수학II · q21 해설 시각화</title>
  <desc id="desc">문항 21의 원문과 해설 흐름을 source-bound 텍스트 카드로 정리한 SVG</desc>
  <rect width="760" height="620" fill="#fff"/>
  <g font-family="Arial, sans-serif" fill="#111">
    <text x="380" y="32" font-size="21" font-weight="700" text-anchor="middle">25_순천고_2학기_기말_고2_수학II · q21 해설 시각화</text>
    <text x="380" y="59" font-size="15" text-anchor="middle" fill="#475569">적분의 활용 · 속도와 거리</text>
    <rect x="18" y="82" width="350" height="350" rx="12" fill="#eff6ff" stroke="#93c5fd"/>
    <rect x="390" y="82" width="352" height="350" rx="12" fill="#f0fdf4" stroke="#86efac"/>
    <text x="34" y="112" font-size="17" font-weight="700" fill="#1d4ed8">문항 핵심</text>
    <text x="398" y="112" font-size="17" font-weight="700" fill="#15803d">해설 흐름</text>
    <text x="34" y="140" font-size="15">서답형 1. (서술형) 원점을 출발하여 수직선 위를 움직이는 점 P의 시각 t에서의 속도 </text>
    <text x="34" y="162" font-size="15">v(t)가 v(t)=t^3-3t^2+2t일 때 점 P가 출발한 후 처음으로 16에 위치할 </text>
    <text x="34" y="184" font-size="15">때까지 움직인 거리를 구하는 과정을 풀이 과정과 함께 서술하시오. [부분 점수 있음, 4점</text>
    <text x="34" y="206" font-size="15">]</text>
    <text x="398" y="140" font-size="14">[키포인트] 속도의 부호로 방향을 나누고, 위치함수로 처음 도달하는 시각을 확인한다. 조건</text>
    <text x="398" y="162" font-size="14"> 정리: s(0)=0, v(t)=t(t-1)(t-2)이고 목표 위치는 16이다. 풀이 방향</text>
    <text x="398" y="184" font-size="14">: v(t)를 적분하여 위치함수를 구한 뒤, 부호가 바뀌는 시각에서 구간을 나누어 이동거리</text>
    <text x="398" y="206" font-size="14">를 계산한다. 정석 풀이: s(t)=∫_0^tv(u)du=t^44-t^3+t^2이다. 0&lt;</text>
    <text x="398" y="228" font-size="14"> t&lt; 1과 2&lt; t에서 v(t)&gt; 0, 1&lt; t&lt; 2에서 v(t)&lt; 0이다. s(1)=1</text>
    <text x="398" y="250" font-size="14">4, s(2)=0이고 s(4)=16이며, 0\le t\le2에서는 s(t)\le14이므로 </text>
    <text x="398" y="272" font-size="14">16에 처음 도달하는 시각은 t=4이다. 따라서 이동거리는 ∫_0^1v(t)dt-∫_1^2</text>
    <text x="398" y="294" font-size="14">v(t)dt+∫_2^4v(t)dt=(s(1)-s(0))+(s(1)-s(2))+(s(4)-s</text>
    <text x="398" y="316" font-size="14">(2))=14+14+16=332이다. 따라서 구하는 값은 332이다.</text>
    <path d="M350 396 L410 396" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="18" y="418" width="724" height="48" rx="10" fill="#fff7ed" stroke="#fdba74"/>
    <text x="380" y="448" font-size="17" text-anchor="middle" fill="#9a3412">정답/결론: 332</text>
