<svg xmlns="http://www.w3.org/2000/svg" width="760" height="638" viewBox="0 0 760 638" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet">
  <title id="title">25_순천고_2학기_기말_고2_수학II · q21 해설 시각화</title>
  <desc id="desc">문항 21의 원문과 해설 흐름을 source-bound 텍스트 카드로 정리한 SVG</desc>
  <rect width="760" height="638" fill="#fff"/>
  <g font-family="Noto Sans KR, Pretendard, Apple SD Gothic Neo, Malgun Gothic, sans-serif" fill="#111">
    <text x="380" y="32" font-size="21" font-weight="700" text-anchor="middle">25_순천고_2학기_기말_고2_수학II · q21 해설 시각화</text>
    <text x="380" y="59" font-size="15" text-anchor="middle" fill="#475569">문항 원문과 해설의 핵심 흐름</text>
    <rect x="18" y="82" width="350" height="416" rx="12" fill="#eff6ff" stroke="#93c5fd"/>
    <rect x="390" y="82" width="352" height="416" rx="12" fill="#f0fdf4" stroke="#86efac"/>
    <text x="34" y="112" font-size="17" font-weight="700" fill="#1d4ed8">문항 핵심</text>
    <text x="398" y="112" font-size="17" font-weight="700" fill="#15803d">해설 흐름</text>
    <text x="34" y="140" font-size="15">서답형 1. (서술형) 원점을 출발하여 수직선</text>
    <text x="34" y="162" font-size="15">위를 움직이는 점 P의 시각 t에서의 속도</text>
    <text x="34" y="184" font-size="15">v(t)가 v(t)=t^3-3t^2+2t일 때 점 P가</text>
    <text x="34" y="206" font-size="15">출발한 후 처음으로 16에 위치할 때까지</text>
    <text x="34" y="228" font-size="15">움직인 거리를 구하는 과정을 풀이 과정과 함께</text>
    <text x="34" y="250" font-size="15">서술하시오. [부분 점수 있음, 4점]</text>
    <text x="398" y="140" font-size="14">[키포인트] 속도의 부호로 방향을 나누고,</text>
    <text x="398" y="162" font-size="14">위치함수로 처음 도달하는 시각을 확인한다.</text>
    <text x="398" y="184" font-size="14">조건 정리: s(0)=0, v(t)=t(t-1)(t-2)이고</text>
    <text x="398" y="206" font-size="14">목표 위치는 16이다. 풀이 방향: v(t)를</text>
    <text x="398" y="228" font-size="14">적분하여 위치함수를 구한 뒤, 부호가 바뀌는</text>
    <text x="398" y="250" font-size="14">시각에서 구간을 나누어 이동거리를 계산한다.</text>
    <text x="398" y="272" font-size="14">정석 풀이: s(t)=∫[0, t]v(u)du=t^4 /</text>
    <text x="398" y="294" font-size="14">4-t^3+t^2이다. 0&lt; t&lt; 1과 2&lt; t에서 v(t)&gt; 0,</text>
    <text x="398" y="316" font-size="14">1&lt; t&lt; 2에서 v(t)&lt; 0이다. s(1)=1 / 4,</text>
    <text x="398" y="338" font-size="14">s(2)=0이고 s(4)=16이며, 0≤ t≤2에서는</text>
    <text x="398" y="360" font-size="14">s(t)≤1 / 4이므로 16에 처음 도달하는 시각은</text>
    <text x="398" y="382" font-size="14">t=4이다. 따라서 이동거리는 ∫[0,</text>
    <text x="398" y="404" font-size="14">1]v(t)dt-∫[1, 2]v(t)dt+∫[2,</text>
    <text x="398" y="426" font-size="14">4]v(t)dt=(s(1)-s(0))+(s(1)-s(2))+(s(4)</text>
    <text x="398" y="448" font-size="14">-s(2))=1 / 4+1 / 4+16=33 / 2이다. 따라서</text>
    <text x="398" y="470" font-size="14">구하는 값은 33 / 2이다.</text>
    <rect x="18" y="522" width="724" height="48" rx="10" fill="#fff7ed" stroke="#fdba74"/>
    <text x="380" y="552" font-size="17" text-anchor="middle" fill="#9a3412">결론: 33 / 2</text>
    <text x="380" y="598" font-size="11" text-anchor="middle" fill="#64748b">25_순천고_2학기_기말_고2_수학II · q21 · source-bound solution visual</text>
  </g>
</svg>