<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="650" height="300" viewBox="0 0 650 300" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="ttl4 des4"><title id="ttl4">감소 조건과 도함수의 최댓값</title><desc id="des4">x가 0에서 2일 때 3x²+8x는 0부터 28까지 증가한다. 따라서 f′(x)의 최댓값은 28−a이며 감소 조건은 a≥28이다.</desc><style>text{font-family:Arial,'Noto Sans KR','Malgun Gothic',sans-serif;fill:#1e293b}.title{font-size:21px;font-weight:700}.subtitle{font-size:16px;fill:#475569}.axis{stroke:#64748b;stroke-width:1.4}.guide{stroke:#9ca3af;stroke-dasharray:5 5;stroke-width:1.1}.curve{stroke:#1d4ed8;stroke-width:2.9;stroke-linejoin:round;stroke-linecap:round;fill:none}.curve2{stroke:#334155;stroke-width:2.4;stroke-linecap:round;fill:none}.point{fill:#fff;stroke:#111827;stroke-width:2.2}.lab{font-size:16px;font-weight:600}.small{font-size:15px}.shade{fill:#60a5fa;opacity:.25}.negative{fill:#f59e0b;opacity:.18}</style><rect width="650" height="300" fill="#fff"/><text class="title" x="28" y="35">감소 조건은 도함수의 최댓값으로 확인</text><line class="axis" x1="88" x2="560" y1="132" y2="132"/><line stroke="#1d4ed8" stroke-width="5" x1="160" x2="505" y1="132" y2="132"/><circle class="point" cx="160" cy="132" r="5"/><circle class="point" cx="505" cy="132" r="5"/><text class="lab" x="146" y="166">0</text><text class="lab" x="498" y="166">2</text><text class="subtitle" x="148" y="108">3x²+8x 는 증가</text><text class="lab" x="300" y="211">f′(x) ≤ f′(2) = 28−a</text><text class="lab" x="300" y="252">28−a ≤ 0   →   a ≥ 28</text></svg>