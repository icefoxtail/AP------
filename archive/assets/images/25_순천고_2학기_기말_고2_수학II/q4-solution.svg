<svg xmlns="http://www.w3.org/2000/svg" width="760" height="620" viewBox="0 0 760 620" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet">
  <title id="title">25_순천고_2학기_기말_고2_수학II · q4 해설 시각화</title>
  <desc id="desc">문항 4의 원문과 해설 흐름을 source-bound 텍스트 카드로 정리한 SVG</desc>
  <rect width="760" height="620" fill="#fff"/>
  <g font-family="Noto Sans KR, Pretendard, Apple SD Gothic Neo, Malgun Gothic, sans-serif" fill="#111">
    <text x="380" y="32" font-size="21" font-weight="700" text-anchor="middle">25_순천고_2학기_기말_고2_수학II · q4 해설 시각화</text>
    <text x="380" y="59" font-size="15" text-anchor="middle" fill="#475569">문항 원문과 해설의 핵심 흐름</text>
    <rect x="18" y="82" width="350" height="328" rx="12" fill="#eff6ff" stroke="#93c5fd"/>
    <rect x="390" y="82" width="352" height="328" rx="12" fill="#f0fdf4" stroke="#86efac"/>
    <text x="34" y="112" font-size="17" font-weight="700" fill="#1d4ed8">문항 핵심</text>
    <text x="398" y="112" font-size="17" font-weight="700" fill="#15803d">해설 흐름</text>
    <text x="34" y="140" font-size="15">실수 a, b에 대해 함수</text>
    <text x="34" y="162" font-size="15">f(x)=x^3+4x^2-ax+b가 닫힌구간 [0,2]에서</text>
    <text x="34" y="184" font-size="15">감소하도록 하는 a의 값의 범위는? [3.5점]</text>
    <text x="398" y="140" font-size="14">[키포인트] 닫힌구간 전체에서 감소하려면 그</text>
    <text x="398" y="162" font-size="14">구간에서 도함수가 항상 0 이하가 되어야 한다.</text>
    <text x="398" y="184" font-size="14">조건 정리: f'(x)=3x^2+8x-a이고 0≤ x≤2이다.</text>
    <text x="398" y="206" font-size="14">풀이 방향: f'(x)가 [0,2]에서 어디서 가장</text>
    <text x="398" y="228" font-size="14">큰지 확인한 뒤 그 최댓값이 0 이하가 되도록 a의</text>
    <text x="398" y="250" font-size="14">범위를 정한다. 정석 풀이: f''(x)=6x+8이고</text>
    <text x="398" y="272" font-size="14">0≤ x≤2에서 f''(x)&gt;0이므로 f'(x)는</text>
    <text x="398" y="294" font-size="14">[0,2]에서 증가한다. 따라서 f'(x)의 최댓값은</text>
    <text x="398" y="316" font-size="14">x=2에서의 f'(2)=12+16-a=28-a이다. 함수</text>
    <text x="398" y="338" font-size="14">f가 [0,2]에서 감소하려면 f'(x)≤0이어야</text>
    <text x="398" y="360" font-size="14">하므로 28-a≤0, 즉 a≥28이다. 따라서 정답은</text>
    <text x="398" y="382" font-size="14">⑤이다.</text>
    <rect x="18" y="434" width="724" height="48" rx="10" fill="#fff7ed" stroke="#fdba74"/>
    <text x="380" y="464" font-size="17" text-anchor="middle" fill="#9a3412">결론: ⑤</text>
    <text x="380" y="510" font-size="11" text-anchor="middle" fill="#64748b">25_순천고_2학기_기말_고2_수학II · q4 · source-bound solution visual</text>
  </g>
</svg>