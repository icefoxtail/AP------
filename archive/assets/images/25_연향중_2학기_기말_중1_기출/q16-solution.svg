<svg xmlns="http://www.w3.org/2000/svg" width="720" height="455" viewBox="0 0 720 455" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="t d" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-geometry-fact-hash="635e1553be71173329d62b3ad4ebf750b8f3628417265b5a557b5917629bc24e" data-visual-provenance="deterministic-python-independent-facts" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round"><title id="t">잘린 원기둥의 겉넓이</title><desc id="d">중심각 240°, 반지름 3 cm, 높이 6 cm인 남은 원기둥 조각의 면을 나누어 계산한다.</desc><style>.title{font:700 24px "Noto Sans KR","Malgun Gothic",sans-serif;fill:#111}.head{font:700 20px "Noto Sans KR","Malgun Gothic",sans-serif;fill:#111}.label{font:600 17px "Noto Sans KR","Malgun Gothic",sans-serif;fill:#111}.small{font:500 15px "Noto Sans KR","Malgun Gothic",sans-serif;fill:#333}.math{font:600 17px "STIX Two Math","Times New Roman",serif;fill:#111}.main{fill:none;stroke:#111;stroke-width:2.05}.secondary{fill:none;stroke:#555;stroke-width:1.6}.aux{fill:none;stroke:#777;stroke-width:1;stroke-dasharray:4 4}.card{fill:#fff;stroke:#c4ccd3;stroke-width:1.2}</style><rect width="100%" height="100%" fill="#fff"/><text x="360" y="34" class="title" text-anchor="middle">겉넓이를 곡면 · 부채꼴 면 · 절단면으로 나누기</text><path d="M 63.933 170 A 104 104 0 1 0 244.067 170 L 154 222 Z" fill="#eef3f7" stroke="#111111" stroke-width="2.05"/><circle cx="154" cy="222" r="3" fill="#111111" stroke="#111111" stroke-width="0"/><text x="154" y="94" class="head" text-anchor="middle">남은 중심각 240°</text><text x="154" y="358" class="small" text-anchor="middle">r=3 cm · h=6 cm</text><rect x="318" y="90" width="370" height="74" rx="12" class="card"/><text x="336" y="116" class="label" text-anchor="start">옆 곡면</text><text x="336" y="145" class="math" text-anchor="start">(240/360) × 2π × 3 × 6 = 24π cm²</text><rect x="318" y="176" width="370" height="74" rx="12" class="card"/><text x="336" y="202" class="label" text-anchor="start">윗면 + 아랫면</text><text x="336" y="231" class="math" text-anchor="start">2 × (240/360) × π × 3² = 12π cm²</text><rect x="318" y="262" width="370" height="74" rx="12" class="card"/><text x="336" y="288" class="label" text-anchor="start">절단 직사각형 2개</text><text x="336" y="317" class="math" text-anchor="start">2 × 3 × 6 = 36 cm²</text><rect x="36" y="374" width="648" height="52" rx="12" fill="#eef3f7" stroke="#8a969f" stroke-width="1.2"/><text x="360" y="407" class="math" text-anchor="middle">전체 겉넓이 = 24π + 12π + 36 = 36π + 36 cm²</text></svg>
