<svg xmlns="http://www.w3.org/2000/svg" width="420" height="310" viewBox="0 0 420 310" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-geometry-fact-hash="635e1553be71173329d62b3ad4ebf750b8f3628417265b5a557b5917629bc24e" data-visual-provenance="deterministic-python-independent-facts" style="max-width:100%;height:auto;stroke-linecap:round;stroke-linejoin:round" data-geometry-safe-margin="32"><title id="title">잘린 원기둥의 노출된 면 넓이</title><desc id="desc">잘린 원기둥의 노출된 면 넓이. 원문 조건과 독립 계산값을 사용한 해설 도형.</desc><style>.main{fill:none;stroke:#111;stroke-width:2.05}.secondary{fill:none;stroke:#555;stroke-width:1.6}.aux{fill:none;stroke:#777;stroke-width:1;stroke-dasharray:4 4}.hidden{fill:none;stroke:#777;stroke-width:1.8;stroke-dasharray:4 4}.title{font:700 18px "Malgun Gothic",sans-serif;fill:#111}.note{font:14px "Malgun Gothic",sans-serif;fill:#111}.formula{font:15px "STIX Two Math","Times New Roman",serif;fill:#111}.vertex{font:italic 13.25px "STIX Two Math","Times New Roman",serif;fill:#111}.angle{font:11.75px "STIX Two Math","Times New Roman",serif;fill:#111}.symbol{font:italic 13.25px "STIX Two Math","Times New Roman",serif;fill:#111}</style><g data-geometry-layer="0"><rect width="420" height="310" fill="#fff" /></g><g data-geometry-layer="40"><path d="M 42.842 114 A 66 66 0 1 0 157.158 114 L 100 147 Z" fill="#eee" stroke="#111" stroke-width="2.05" /></g><g data-geometry-layer="90"><text x="210" y="25" text-anchor="middle" class="title">노출된 면의 넓이를 합하기</text><text x="100" y="58" text-anchor="middle" class="note">남은 중심각 240°</text><text x="100" y="239" text-anchor="middle" class="note">r=3 cm · h=6 cm</text><text x="184" y="73" text-anchor="start" class="note">옆 곡면</text><text x="184" y="98" text-anchor="start" class="formula">(240/360)·2π·3·6 = 24π</text><text x="184" y="136" text-anchor="start" class="note">위·아래 부채꼴</text><text x="184" y="161" text-anchor="start" class="formula">2·(240/360)·π·3² = 12π</text><text x="184" y="199" text-anchor="start" class="note">절단 직사각형 2개</text><text x="184" y="224" text-anchor="start" class="formula">2·3·6 = 36</text><text x="210" y="289" text-anchor="middle" class="formula">겉넓이 = 36π + 36 cm²</text></g></svg>
