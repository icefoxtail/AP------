<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 538" width="512" height="538" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="UNEQUAL_UNIT_DECLARED" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">f(x)=x²-x+3의 도함수는 2x-1이고 기울기가 3이려면 2x-1=3에서 x=2이다. f(2)=5이므로 접점은 T(2,5)이고 접선은 y-5=3(x-2), 즉 y=3x-1이다. 따라서 답은 ②이다.</title><desc id="visual-desc">아래로 볼록한 포물선과 점 T에서 접하는 기울기가 양수인 직선 l을 나타낸 그래프이다.</desc><rect width="512" height="538" fill="#fff"/><g data-layer="30"><line id="x-axis" data-role="axis" stroke="#111" stroke-width="1.2" fill="none" data-axis="x" x1="32" y1="465.947623124" x2="480" y2="465.947623124"/></g><g data-layer="30"><line id="y-axis" data-role="axis" stroke="#111" stroke-width="1.2" fill="none" data-axis="y" x1="137.649207708" y1="506" x2="137.649207708" y2="32"/></g><g data-layer="40"><polyline id="f-piece-1-branch-0" data-role="curve" stroke="#111" stroke-width="2.1" fill="none" data-branch="PIECE_1" points="72,219.763094219 73.230769231,220.988094938 74.461538462,222.201558634 75.692307692,223.403485306 76.923076923,224.593874954 78.153846154,225.77272758 79.384615385,226.940043181 80.615384615,228.09582176 81.846153846,229.240063314 83.076923077,230.372767846 84.307692308,231.493935354 85.538461538,232.603565838 86.769230769,233.701659299 88,234.788215736 89.230769231,235.86323515 90.461538462,236.926717541 91.692307692,237.978662908 92.923076923,239.019071252 94.153846154,24