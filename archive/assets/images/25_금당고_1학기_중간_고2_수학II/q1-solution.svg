<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 598" width="512" height="598" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="UNEQUAL_UNIT_DECLARED" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">y=2x²-x+3의 도함수는 4x-1이므로 x=1에서 접선의 기울기는 4-1=3이다. 그림의 직선 l은 접점 T(1,4)에서 곡선에 접하는 접선 y=3x+1이고 기울기가 3이다. 따라서 답은 ④이다.</title><desc id="visual-desc">아래로 볼록한 포물선과 곡선 위의 점 T에서 접하는 직선 l을 나타낸 그래프이다.</desc><rect width="512" height="598" fill="#fff"/><g data-layer="30"><line id="x-axis" data-role="axis" stroke="#111" stroke-width="1.2" fill="none" data-axis="x" x1="32" y1="525.514351136" x2="480" y2="525.514351136"/></g><g data-layer="30"><line id="y-axis" data-role="axis" stroke="#111" stroke-width="1.2" fill="none" data-axis="y" x1="207.908610682" y1="566" x2="207.908610682" y2="32"/></g><g data-layer="40"><polyline id="f-piece-1-branch-0" data-role="curve" stroke="#111" stroke-width="2.1" fill="none" data-branch="PIECE_1" points="72,83.81136642 73.230769231,86.264545627 74.461538462,88.701006325 75.692307692,91.120748514 76.923076923,93.523772193 78.153846154,95.910077364 79.384615385,98.279664025 80.615384615,100.632532177 81.846153846,102.96868182 83.076923077,105.288112954 84.307692308,107.590825579 85.538461538,109.876819695 86.769230769,112.146095301 88,114.398652398 89.230769231,116.634490987 90.461538462,118.853611066 91.692307692,121.056012636 92.923076923,123.241695697 94.153846154,125.410660248