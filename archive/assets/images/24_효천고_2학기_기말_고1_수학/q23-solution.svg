<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="t d"><title id="t">통로 topology와 경계별 경로 누적표</title><desc id="d">해설의 실제 수학 관계를 나타낸 그림</desc><rect width="960" height="560" fill="#fff"/><style>text{font-family:Arial,'Malgun Gothic',sans-serif;fill:#18212f}.title{font-size:27px;font-weight:700}.label{font-size:22px;font-weight:700}.note{font-size:18px}.edge{stroke:#334155;stroke-width:4;fill:none}.node{fill:#e0f2fe;stroke:#0369a1;stroke-width:3}</style><text x="40" y="48" class="title">통로 topology와 경계별 경로 누적표</text><g transform="translate(45 100)"><g class="edge"><path d="M0 0H440 M0 78H88 M176 78H440 M88 156H352 M0 234H264 M352 234H440 M0 312H440"/><path d="M0 0V312 M88 0V312 M176 0V312 M264 0V78 M264 156V312 M352 0V312 M440 0V312"/></g><text x="-2" y="345" class="label">A</text><text x="442" y="345" class="label">B</text><text x="58" y="-15" class="note">1</text><text x="146" y="-15" class="note">2</text><text x="234" y="-15" class="note">3</text><text x="322" y="-15" class="note">4</text><text x="410" y="-15" class="note">5</text></g><g transform="translate(560 105)"><text x="0" y="0" class="label">높이별 누적 경로 수</text><text x="0" y="38" class="note">행: 위에서 아래</text><text x="0" y="76" class="note">1: 1, 1, 0, 1, 1</text><text x="0" y="112" class="note">2: 4, 0, 4, 4, 4</text><text x="0" y="148" class="note">3: 16, 16, 16, 16, 16</text><text x="0" y="184" class="note">4: 32, 32, 48, 0, 48</text><text x="0" y="220" class="note">5: 160, 160, 0, 160, 160</text><text x="0" y="282" class="label">160 × 4 = 640</text></g></svg>
