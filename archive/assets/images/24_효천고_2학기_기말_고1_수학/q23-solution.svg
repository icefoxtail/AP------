<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="500" viewBox="0 0 760 500" role="img" aria-labelledby="title desc"><title id="title">원본 길 연결과 경계별 경로 수 전달</title><desc id="desc">원본 길의 수평 통로와 수직 통로 전체를 정확히 재현한다. 네 번째 세로 열의 위와 아래는 단절이며 각 경계 누적 수가 1,4,16,32/48,160으로 전달된다.</desc><rect width="760" height="500" fill="#fff"/><style>text{font-family:Arial,'Malgun Gothic',sans-serif;fill:#172033}.title{font-size:28px;font-weight:700}.note{font-size:25px}.value{font-size:30px;font-weight:700}.small{font-size:25px}.label{font-size:26px;font-weight:700}</style><text x="30" y="48" text-anchor="start" class="title">원본 길 연결과 경계별 경로 수 전달</text><g stroke="#334155" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="58" y1="126" x2="453" y2="126"/><line x1="58" y1="183" x2="137" y2="183"/><line x1="216" y1="183" x2="453" y2="183"/><line x1="137" y1="240" x2="374" y2="240"/><line x1="58" y1="297" x2="295" y2="297"/><line x1="374" y1="297" x2="453" y2="297"/><line x1="58" y1="354" x2="453" y2="354"/><line x1="58" y1="126" x2="58" y2="354"/><line x1="137" y1="126" x2="137" y2="354"/><line x1="216" y1="126" x2="216" y2="354"/><line x1="374" y1="126" x2="374" y2="354"/><line x1="453" y1="126" x2="453" y2="354"/><line x1="295" y1="126" x2="295" y2="183"/><line x1="295" y1="240" x2="295" y2="354"/></g><circle cx="58" cy="354" r="8" fill="#2563eb"/><circle cx="453" cy="354" r="8" fill="#16a34a"/><text x="35" y="359" text-anchor="middle" class="label">A</text><text x="479" y="359" text-anchor="middle" class="label">B</text><text x="97.5" y="104" text-anchor="middle" class="small">1</text><text x="176.5" y="104" text-anchor="middle" class="small">2</text><text x="255.5" y="104" text-anchor="middle" class="small">3</text><text x="334.5" y="104" text-anchor="middle" class="small">4</text><text x="413.5" y="104" text-anchor="middle" class="small">5</text><rect x="497" y="107" width="243" height="326" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="2"/><text x="618" y="144" text-anchor="middle" class="label">경계1</text><text x="618" y="168" text-anchor="middle" class="small">1, 1, 0, 1, 1</text><text x="618" y="198" text-anchor="middle" class="label">경계2</text><text x="618" y="222" text-anchor="middle" class="small">4, 0, 4, 4, 4</text><text x="618" y="252" text-anchor="middle" class="label">경계3</text><text x="618" y="276" text-anchor="middle" class="small">모든 높이 16</text><text x="618" y="306" text-anchor="middle" class="label">경계4</text><text x="618" y="330" text-anchor="middle" class="small">위 32, 아래 48</text><text x="618" y="360" text-anchor="middle" class="label">경계5</text><text x="618" y="384" text-anchor="middle" class="small">4개 출구 각 160</text><line x1="510" y1="425" x2="728" y2="425" stroke="#cbd5e1" stroke-width="2" stroke-linejoin="round"/><text x="380" y="469" text-anchor="middle" class="small">마지막 경계: 160 × 4 = 640</text></svg>
