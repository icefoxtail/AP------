<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="500" viewBox="0 0 760 500" role="img" aria-labelledby="title desc"><title id="title">합성함수는 안쪽부터: 4→3→−3→0</title><desc id="desc">f(4), g(3), f의 역함수(-3)를 순서대로 계산하고 x&lt;1 범위에서 x=0을 찾는다.</desc><rect width="760" height="500" fill="#fff"/><style>text{font-family:Arial,'Malgun Gothic',sans-serif;fill:#172033}.title{font-size:28px;font-weight:700}.note{font-size:25px}.value{font-size:30px;font-weight:700}.small{font-size:25px}.label{font-size:26px;font-weight:700}</style><text x="34" y="48" text-anchor="start" class="title">합성함수는 안쪽부터: 4→3→−3→0</text><text x="380" y="109" text-anchor="middle" class="note">오른쪽 함수부터 왼쪽 함수 순으로 적용</text><rect x="45" y="153" width="130" height="110" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="110" y="224" text-anchor="middle" class="value">4</text><line x1="175" y1="208" x2="228" y2="208" stroke="#475569" stroke-width="3" /><text x="202" y="146" text-anchor="middle" class="small">f 적용</text><rect x="232" y="153" width="130" height="110" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="297" y="224" text-anchor="middle" class="value">3</text><line x1="362" y1="208" x2="415" y2="208" stroke="#475569" stroke-width="3" /><text x="389" y="146" text-anchor="middle" class="small">g 적용</text><rect x="419" y="153" width="130" height="110" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="484" y="224" text-anchor="middle" class="value">−3</text><line x1="549" y1="208" x2="602" y2="208" stroke="#475569" stroke-width="3" /><text x="576" y="146" text-anchor="middle" class="small">f의 역함수</text><rect x="606" y="153" width="130" height="110" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="671" y="224" text-anchor="middle" class="value">0</text><text x="380" y="337" text-anchor="middle" class="label">f(4)=3 → g(3)=−3</text><text x="380" y="384" text-anchor="middle" class="note">f(x)=−3은 x&lt;1 가지에서 x=0</text><text x="380" y="440" text-anchor="middle" class="value">결과 0</text></svg>
