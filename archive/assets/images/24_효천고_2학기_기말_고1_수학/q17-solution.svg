<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="460" viewBox="0 0 960 460" role="img" aria-labelledby="t d"><title id="t">합성함수 원상 개수의 경우 분리</title><desc id="d">바깥 함수값 t와 각 t의 원상 개수를 나누어 합한다</desc><rect width="960" height="460" fill="#fff"/><style>text{font-family:Arial,'Malgun Gothic',sans-serif;fill:#172033}.title{font-size:28px;font-weight:700}.head{font-size:21px;font-weight:700}.body{font-size:21px}.box{fill:#eff6ff;stroke:#2563eb;stroke-width:2}.sum{font-size:25px;font-weight:700}</style><text x="42" y="52" class="title">f(f(a))=4를 두 단계로 센다</text><rect x="48" y="105" width="864" height="64" rx="10" fill="#dbeafe"/><text x="80" y="146" class="head">먼저 f(t)=4를 만족하는 t=f(a)부터 찾는다.</text><rect x="48" y="195" width="260" height="116" rx="12" class="box"/><rect x="350" y="195" width="260" height="116" rx="12" class="box"/><rect x="652" y="195" width="260" height="116" rx="12" class="box"/><text x="74" y="236" class="head">t=2</text><text x="74" y="273" class="body">f(a)=2</text><text x="74" y="300" class="body">원상 4개</text><text x="376" y="236" class="head">t=4</text><text x="376" y="273" class="body">f(a)=4</text><text x="376" y="300" class="body">원상 4개</text><text x="678" y="236" class="head">t=3+√17</text><text x="678" y="273" class="body">f(a)=t</text><text x="678" y="300" class="body">원상 2개</text><text x="334" y="385" class="sum">4 + 4 + 2 = 10</text></svg>