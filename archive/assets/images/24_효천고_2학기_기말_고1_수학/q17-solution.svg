<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="500" viewBox="0 0 760 500" role="img" aria-labelledby="title desc"><title id="title">합성함수의 해 개수: 중간 함수값별로 세기</title><desc id="desc">f(f(a))=4의 중간값 t는 2,4,3+√17이며 각각 원상 실수 a가 4,4,2개임을 구분하여 합한다.</desc><rect width="760" height="500" fill="#fff"/><style>text{font-family:Arial,'Malgun Gothic',sans-serif;fill:#172033}.title{font-size:28px;font-weight:700}.note{font-size:25px}.value{font-size:30px;font-weight:700}.small{font-size:25px}.label{font-size:26px;font-weight:700}</style><text x="26" y="48" text-anchor="start" class="title">합성함수의 해 개수: 중간 함수값별로 세기</text><text x="380" y="107" text-anchor="middle" class="note">먼저 t=f(a) ≥ 0에 대하여 f(t)=4를 푼다.</text><rect x="36" y="144" width="216" height="202" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><rect x="272" y="144" width="216" height="202" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><rect x="508" y="144" width="216" height="202" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="144" y="199" text-anchor="middle" class="label">t = 2</text><text x="144" y="252" text-anchor="middle" class="note">a의 해 4개</text><text x="144" y="308" text-anchor="middle" class="small">두 이차식 각각 2개</text><text x="380" y="199" text-anchor="middle" class="label">t = 4</text><text x="380" y="252" text-anchor="middle" class="note">a의 해 4개</text><text x="380" y="308" text-anchor="middle" class="small">두 이차식 각각 2개</text><text x="616" y="199" text-anchor="middle" class="label">t = 3+√17</text><text x="616" y="252" text-anchor="middle" class="note">a의 해 2개</text><text x="616" y="308" text-anchor="middle" class="small">한 이차식만 2개</text><text x="380" y="396" text-anchor="middle" class="note">세 t값은 서로 달라 중복되는 a가 없다.</text><text x="380" y="454" text-anchor="middle" class="value">4 + 4 + 2 = 10개</text></svg>
