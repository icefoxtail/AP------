<svg xmlns="http://www.w3.org/2000/svg" width="760" height="500" viewBox="0 0 760 500" role="img" aria-labelledby="title desc"><title id="title">근호의 정의역: 공통 구간과 정수</title><desc id="desc">두 제곱근 조건의 공통 구간 -5/3 이상 2 이하에서 정수 네 개를 표시한 수직선.</desc><rect width="760" height="500" fill="#fff"/><style>text{font-family:Arial,'Malgun Gothic',sans-serif;fill:#172033}.title{font-size:28px;font-weight:700}.note{font-size:25px}.value{font-size:30px;font-weight:700}.small{font-size:25px}.label{font-size:26px;font-weight:700}</style><text x="34" y="48" text-anchor="start" class="title">근호의 정의역: 공통 구간과 정수</text><text x="380" y="114" text-anchor="middle" class="value">−5/3 ≤ x ≤ 2 의 정수 찾기</text><line x1="95" y1="255" x2="670" y2="255" stroke="#475569" stroke-width="3.5" /><line x1="170.66666666666669" y1="255" x2="519" y2="255" stroke="#2563eb" stroke-width="9" /><line x1="139.00000000000003" y1="244" x2="139.00000000000003" y2="268" stroke="#334155" stroke-width="2" /><text x="139.00000000000003" y="295" text-anchor="middle" class="note">-2</text><line x1="234" y1="244" x2="234" y2="268" stroke="#334155" stroke-width="2" /><text x="234" y="295" text-anchor="middle" class="note">-1</text><line x1="329" y1="244" x2="329" y2="268" stroke="#334155" stroke-width="2" /><text x="329" y="295" text-anchor="middle" class="note">0</text><line x1="424" y1="244" x2="424" y2="268" stroke="#334155" stroke-width="2" /><text x="424" y="295" text-anchor="middle" class="note">1</text><line x1="519" y1="244" x2="519" y2="268" stroke="#334155" stroke-width="2" /><text x="519" y="295" text-anchor="middle" class="note">2</text><line x1="614" y1="244" x2="614" y2="268" stroke="#334155" stroke-width="2" /><text x="614" y="295" text-anchor="middle" class="note">3</text><circle cx="170.66666666666669" cy="255" r="8" fill="#2563eb"/><text x="170.66666666666669" y="216" text-anchor="middle" class="label">−5/3</text><circle cx="519" cy="255" r="8" fill="#2563eb"/><circle cx="234" cy="255" r="8" fill="#d97706"/><circle cx="329" cy="255" r="8" fill="#d97706"/><circle cx="424" cy="255" r="8" fill="#d97706"/><circle cx="519" cy="255" r="8" fill="#d97706"/><text x="380" y="369" text-anchor="middle" class="label">허용되는 정수: −1, 0, 1, 2</text><text x="380" y="423" text-anchor="middle" class="value">정수 4개</text></svg>
