<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="t d"><title id="t">무리함수 정의역과 사분면 판정</title><desc id="d">정확한 좌표를 특정하지 않고, 음의 x축 구간에서 제2·3사분면을 지나는 무리함수의 개형을 나타낸 도식</desc><rect width="960" height="560" fill="#fff"/><style>text{font-family:Arial,'Malgun Gothic',sans-serif;fill:#18212f}.title{font-size:27px;font-weight:700}.label{font-size:22px;font-weight:700}.note{font-size:18px}.edge{stroke:#334155;stroke-width:4;fill:none}.node{fill:#e0f2fe;stroke:#0369a1;stroke-width:3}</style><text x="40" y="48" class="title">무리함수 정의역과 사분면 판정</text><line x1="120" y1="300" x2="650" y2="300" class="edge"/><line x1="600" y1="500" x2="600" y2="90" class="edge"/><path d="M 490 400 Q 462 350 450 300 Q 415 210 300 105" stroke="#2563eb" stroke-width="5" fill="none"/><circle cx="490" cy="400" r="6" fill="#1d4ed8"/><circle cx="450" cy="300" r="6" fill="#dc2626"/><text x="410" y="440" class="note">(b/c,-a)</text><text x="355" y="338" class="note">((a²+b)/c,0)</text><text x="160" y="170" class="label">제2사분면</text><text x="505" y="360" class="label">제3사분면</text><text x="680" y="420" class="note">정의역: x≤b/c&lt;0</text></svg>
