<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="500" viewBox="0 0 760 500" role="img" aria-labelledby="title desc"><title id="title">양의 약수는 지수 선택의 곱</title><desc id="desc">180을 세 소인수의 거듭제곱으로 분해하고 지수 선택 3,3,2가 독립적임을 보여준다.</desc><rect width="760" height="500" fill="#fff"/><style>text{font-family:Arial,'Malgun Gothic',sans-serif;fill:#172033}.title{font-size:28px;font-weight:700}.note{font-size:21px}.value{font-size:26px;font-weight:700}.small{font-size:18px}.label{font-size:23px;font-weight:700}</style><text x="34" y="48" text-anchor="start" class="title">양의 약수는 지수 선택의 곱</text><text x="380" y="100" text-anchor="middle" class="value">180 = 2² × 3² × 5</text><rect x="36" y="145" width="219" height="162" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="2"/><text x="145" y="185" text-anchor="middle" class="label">2의 지수</text><text x="145" y="228" text-anchor="middle" class="value">0 · 1 · 2</text><text x="145" y="274" text-anchor="middle" class="note">3가지</text><rect x="278" y="145" width="219" height="162" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="2"/><text x="387" y="185" text-anchor="middle" class="label">3의 지수</text><text x="387" y="228" text-anchor="middle" class="value">0 · 1 · 2</text><text x="387" y="274" text-anchor="middle" class="note">3가지</text><rect x="520" y="145" width="219" height="162" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="2"/><text x="629" y="185" text-anchor="middle" class="label">5의 지수</text><text x="629" y="228" text-anchor="middle" class="value">0 · 1</text><text x="629" y="274" text-anchor="middle" class="note">2가지</text><text x="380" y="365" text-anchor="middle" class="note">각 소인수의 지수를 한 가지씩 고른다.</text><text x="380" y="425" text-anchor="middle" class="value">3 × 3 × 2 = 18개</text></svg>
