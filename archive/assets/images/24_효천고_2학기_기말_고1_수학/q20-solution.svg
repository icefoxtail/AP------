<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="500" viewBox="0 0 760 500" role="img" aria-labelledby="title desc"><title id="title">역함수 합성: 1 → −3 → 3</title><desc id="desc">(f∘g 역함수)의 역은 g∘f 역함수다. 먼저 f 역함수(1)=-3, 그다음 g(-3)=3인 순서를 보여준다.</desc><rect width="760" height="500" fill="#fff"/><style>text{font-family:Arial,'Malgun Gothic',sans-serif;fill:#172033}.title{font-size:28px;font-weight:700}.note{font-size:25px}.value{font-size:30px;font-weight:700}.small{font-size:25px}.label{font-size:26px;font-weight:700}</style><text x="34" y="48" text-anchor="start" class="title">역함수 합성: 1 → −3 → 3</text><text x="380" y="106" text-anchor="middle" class="note">합성함수의 역함수는 순서를 거꾸로 적용</text><rect x="30" y="166" width="200" height="145" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="130" y="222" text-anchor="middle" class="value">1</text><text x="130" y="271" text-anchor="middle" class="small">역함수의 입력</text><text x="255" y="243" text-anchor="middle" class="value">→</text><rect x="280" y="166" width="200" height="145" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="380" y="222" text-anchor="middle" class="value">−3</text><text x="380" y="271" text-anchor="middle" class="small">f의 역함수 값</text><text x="505" y="243" text-anchor="middle" class="value">→</text><rect x="530" y="166" width="200" height="145" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="2"/><text x="630" y="222" text-anchor="middle" class="value">3</text><text x="630" y="271" text-anchor="middle" class="small">g(−3)</text><text x="380" y="379" text-anchor="middle" class="note">먼저 f(x)=1에서 x=−3을 구한다.</text><text x="380" y="428" text-anchor="middle" class="value">그다음 g(−3)=√9=3</text></svg>
