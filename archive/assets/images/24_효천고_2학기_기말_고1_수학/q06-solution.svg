<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="500" viewBox="0 0 760 500" role="img" aria-labelledby="title desc"><title id="title">적어도 두 여학생이 이웃함: 여집합</title><desc id="desc">여-남-여-남-여 배치만 세 여학생이 모두 떨어진 경우임을 다섯 자리 그림으로 보인다.</desc><rect width="760" height="500" fill="#fff"/><style>text{font-family:Arial,'Malgun Gothic',sans-serif;fill:#172033}.title{font-size:28px;font-weight:700}.note{font-size:25px}.value{font-size:30px;font-weight:700}.small{font-size:25px}.label{font-size:26px;font-weight:700}</style><text x="34" y="48" text-anchor="start" class="title">적어도 두 여학생이 이웃함: 여집합</text><text x="380" y="109" text-anchor="middle" class="note">여학생이 모두 떨어진 유일한 성별 배치</text><rect x="70" y="155" width="104" height="100" rx="10" fill="#fce7f3" stroke="#be185d" stroke-width="2"/><text x="122" y="217" text-anchor="middle" class="value">여</text><rect x="202" y="155" width="104" height="100" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="254" y="217" text-anchor="middle" class="value">남</text><rect x="334" y="155" width="104" height="100" rx="10" fill="#fce7f3" stroke="#be185d" stroke-width="2"/><text x="386" y="217" text-anchor="middle" class="value">여</text><rect x="466" y="155" width="104" height="100" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="518" y="217" text-anchor="middle" class="value">남</text><rect x="598" y="155" width="104" height="100" rx="10" fill="#fce7f3" stroke="#be185d" stroke-width="2"/><text x="650" y="217" text-anchor="middle" class="value">여</text><text x="380" y="311" text-anchor="middle" class="note">여학생 자리: 3! = 6가지</text><text x="380" y="349" text-anchor="middle" class="note">남학생 자리: 2! = 2가지</text><text x="380" y="422" text-anchor="middle" class="value">전체 120 − 떨어진 12 = 108</text></svg>
