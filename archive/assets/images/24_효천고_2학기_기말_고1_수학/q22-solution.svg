<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="500" viewBox="0 0 760 500" role="img" aria-labelledby="title desc"><title id="title">중앙 E와 네 바깥 영역의 실제 인접 관계</title><desc id="desc">원본 구조와 같은 위 A, 왼쪽 B, 아래 C, 오른쪽 D, 가운데 E. A-D-C-B-A의 바깥 고리와 E의 네 인접 관계를 실제 영역으로 표시한다.</desc><rect width="760" height="500" fill="#fff"/><style>text{font-family:Arial,'Malgun Gothic',sans-serif;fill:#172033}.title{font-size:28px;font-weight:700}.note{font-size:25px}.value{font-size:30px;font-weight:700}.small{font-size:25px}.label{font-size:26px;font-weight:700}</style><text x="30" y="48" text-anchor="start" class="title">중앙 E와 네 바깥 영역의 실제 인접 관계</text><g stroke="#475569" stroke-width="2.6" stroke-linejoin="round"><polygon points="60,130 520,130 355,215 230,215" fill="#eff6ff"/><polygon points="60,130 230,215 230,305 60,390" fill="#fdf2f8"/><polygon points="60,390 230,305 355,305 520,390" fill="#f0fdf4"/><polygon points="520,130 520,390 355,305 355,215" fill="#fef3c7"/><rect x="230" y="215" width="125" height="90" fill="#e2e8f0"/></g><text x="295" y="165" text-anchor="middle" class="value">A</text><text x="133" y="261" text-anchor="middle" class="value">B</text><text x="292" y="366" text-anchor="middle" class="value">C</text><text x="444" y="261" text-anchor="middle" class="value">D</text><text x="292" y="266" text-anchor="middle" class="value">E</text><text x="290" y="427" text-anchor="middle" class="small">A와 C, B와 D는 인접하지 않는다.</text><rect x="540" y="123" width="196" height="327" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="2"/><text x="640" y="163" text-anchor="middle" class="note">중앙 E: 5색</text><text x="640" y="205" text-anchor="middle" class="note">A: 4색</text><text x="640" y="239" text-anchor="middle" class="note">D: 3색</text><line x1="560" y1="262" x2="713" y2="262" stroke="#cbd5e1" stroke-width="2" stroke-linejoin="round"/><text x="640" y="296" text-anchor="middle" class="note">C=A: 36</text><text x="640" y="335" text-anchor="middle" class="note">C≠A: 48</text><line x1="560" y1="357" x2="713" y2="357" stroke="#cbd5e1" stroke-width="2" stroke-linejoin="round"/><text x="640" y="406" text-anchor="middle" class="note">5×(36+48)</text><text x="640" y="438" text-anchor="middle" class="value">= 420</text></svg>
