<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="t d"><title id="t">영역 인접 그래프</title><desc id="d">네 바깥 영역의 4-cycle과 가운데 E의 인접 관계</desc><rect width="960" height="560" fill="#fff"/><style>text{font-family:Arial,'Malgun Gothic',sans-serif;fill:#18212f}.title{font-size:27px;font-weight:700}.label{font-size:24px;font-weight:700}.note{font-size:19px}.edge{stroke:#334155;stroke-width:4;fill:none}</style><text x="40" y="48" class="title">인접 영역을 4-cycle 그래프로 바꾸기</text><path d="M480 145 L655 300 L480 455 L305 300 Z" class="edge"/><path d="M480 145 L480 300 M655 300 L480 300 M480 455 L480 300 M305 300 L480 300" class="edge"/><circle cx="480" cy="145" r="28" fill="#dbeafe" stroke="#1d4ed8" stroke-width="3"/><circle cx="655" cy="300" r="28" fill="#dbeafe" stroke="#1d4ed8" stroke-width="3"/><circle cx="480" cy="455" r="28" fill="#dbeafe" stroke="#1d4ed8" stroke-width="3"/><circle cx="305" cy="300" r="28" fill="#dbeafe" stroke="#1d4ed8" stroke-width="3"/><circle cx="480" cy="300" r="31" fill="#fef3c7" stroke="#b45309" stroke-width="3"/><text x="471" y="154" class="label">A</text><text x="646" y="309" class="label">D</text><text x="471" y="464" class="label">C</text><text x="296" y="309" class="label">B</text><text x="471" y="309" class="label">E</text><text x="70" y="520" class="note">E와 A, B, C, D는 모두 인접. 바깥은 A-D-C-B-A의 cycle.</text></svg>