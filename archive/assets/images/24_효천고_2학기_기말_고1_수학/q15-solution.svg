<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="500" viewBox="0 0 760 500" role="img" aria-labelledby="title desc"><title id="title">계단 폭은 양의 정수 10개의 합이 13</title><desc id="desc">폭 0.6m 한 단위씩 10단에 미리 배분하고 남은 세 단위를 칸막이 아홉 개로 열 곳에 나누는 원리.</desc><rect width="760" height="500" fill="#fff"/><style>text{font-family:Arial,'Malgun Gothic',sans-serif;fill:#172033}.title{font-size:28px;font-weight:700}.note{font-size:25px}.value{font-size:30px;font-weight:700}.small{font-size:25px}.label{font-size:26px;font-weight:700}</style><text x="34" y="48" text-anchor="start" class="title">계단 폭은 양의 정수 10개의 합이 13</text><text x="380" y="103" text-anchor="middle" class="note">열 단에 먼저 1단위씩 배분</text><rect x="43" y="143" width="60" height="91" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><circle cx="73" cy="188" r="9" fill="#2563eb"/><text x="73" y="260" text-anchor="middle" class="small">1</text><rect x="112" y="143" width="60" height="91" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><circle cx="142" cy="188" r="9" fill="#2563eb"/><text x="142" y="260" text-anchor="middle" class="small">2</text><rect x="181" y="143" width="60" height="91" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><circle cx="211" cy="188" r="9" fill="#2563eb"/><text x="211" y="260" text-anchor="middle" class="small">3</text><rect x="250" y="143" width="60" height="91" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><circle cx="280" cy="188" r="9" fill="#2563eb"/><text x="280" y="260" text-anchor="middle" class="small">4</text><rect x="319" y="143" width="60" height="91" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><circle cx="349" cy="188" r="9" fill="#2563eb"/><text x="349" y="260" text-anchor="middle" class="small">5</text><rect x="388" y="143" width="60" height="91" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><circle cx="418" cy="188" r="9" fill="#2563eb"/><text x="418" y="260" text-anchor="middle" class="small">6</text><rect x="457" y="143" width="60" height="91" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><circle cx="487" cy="188" r="9" fill="#2563eb"/><text x="487" y="260" text-anchor="middle" class="small">7</text><rect x="526" y="143" width="60" height="91" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><circle cx="556" cy="188" r="9" fill="#2563eb"/><text x="556" y="260" text-anchor="middle" class="small">8</text><rect x="595" y="143" width="60" height="91" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><circle cx="625" cy="188" r="9" fill="#2563eb"/><text x="625" y="260" text-anchor="middle" class="small">9</text><rect x="664" y="143" width="60" height="91" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><circle cx="694" cy="188" r="9" fill="#2563eb"/><text x="694" y="260" text-anchor="middle" class="small">10</text><text x="380" y="318" text-anchor="middle" class="note">기본 10단위 + 남은 3단위 = 전체 13단위</text><circle cx="337" cy="367" r="12" fill="#f59e0b"/><circle cx="380" cy="367" r="12" fill="#f59e0b"/><circle cx="423" cy="367" r="12" fill="#f59e0b"/><text x="380" y="413" text-anchor="middle" class="note">남은 세 단위를 10곳에 자유롭게 나누기</text><text x="380" y="465" text-anchor="middle" class="small">3개 단위 + 9개 칸막이 → 12개 중 9곳</text></svg>
