<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="500" viewBox="0 0 760 500" role="img" aria-labelledby="title desc"><title id="title">같은 E 두 장을 양 끝에 고정</title><desc id="desc">일곱 카드 중 양 끝 E를 고정하고 가운데 서로 다른 다섯 카드의 배열 수를 구한다.</desc><rect width="760" height="500" fill="#fff"/><style>text{font-family:Arial,'Malgun Gothic',sans-serif;fill:#172033}.title{font-size:28px;font-weight:700}.note{font-size:25px}.value{font-size:30px;font-weight:700}.small{font-size:25px}.label{font-size:26px;font-weight:700}</style><text x="34" y="48" text-anchor="start" class="title">같은 E 두 장을 양 끝에 고정</text><text x="380" y="100" text-anchor="middle" class="note">양 끝의 E는 고정, 가운데 다섯 자리만 배열</text><rect x="48" y="167" width="86" height="90" rx="8" fill="#e0f2fe" stroke="#2563eb" stroke-width="2"/><text x="91" y="226" text-anchor="middle" class="value">E</text><text x="91" y="296" text-anchor="middle" class="small">고정</text><rect x="144" y="167" width="86" height="90" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><text x="187" y="226" text-anchor="middle" class="value">?</text><text x="187" y="296" text-anchor="middle" class="small">5가지</text><rect x="240" y="167" width="86" height="90" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><text x="283" y="226" text-anchor="middle" class="value">?</text><text x="283" y="296" text-anchor="middle" class="small">4가지</text><rect x="336" y="167" width="86" height="90" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><text x="379" y="226" text-anchor="middle" class="value">?</text><text x="379" y="296" text-anchor="middle" class="small">3가지</text><rect x="432" y="167" width="86" height="90" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><text x="475" y="226" text-anchor="middle" class="value">?</text><text x="475" y="296" text-anchor="middle" class="small">2가지</text><rect x="528" y="167" width="86" height="90" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><text x="571" y="226" text-anchor="middle" class="value">?</text><text x="571" y="296" text-anchor="middle" class="small">1가지</text><rect x="624" y="167" width="86" height="90" rx="8" fill="#e0f2fe" stroke="#2563eb" stroke-width="2"/><text x="667" y="226" text-anchor="middle" class="value">E</text><text x="667" y="296" text-anchor="middle" class="small">고정</text><text x="380" y="382" text-anchor="middle" class="note">P, R, M, U, T : 서로 다른 다섯 카드</text><text x="380" y="432" text-anchor="middle" class="value">5 × 4 × 3 × 2 × 1 = 120</text></svg>
