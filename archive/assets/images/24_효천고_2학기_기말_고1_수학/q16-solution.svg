<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="500" viewBox="0 0 760 500" role="img" aria-labelledby="title desc"><title id="title">포함배제: 두 사람이 제자리를 피하는 배치</title><desc id="desc">A가 제자리에 앉는 24가지와 B가 제자리에 앉는 24가지의 겹침 6가지를 벤다이어그램에 구분한다. 바깥이 78가지다.</desc><rect width="760" height="500" fill="#fff"/><style>text{font-family:Arial,'Malgun Gothic',sans-serif;fill:#172033}.title{font-size:28px;font-weight:700}.note{font-size:21px}.value{font-size:26px;font-weight:700}.small{font-size:18px}.label{font-size:23px;font-weight:700}</style><text x="34" y="48" text-anchor="start" class="title">포함배제: 두 사람이 제자리를 피하는 배치</text><text x="380" y="106" text-anchor="middle" class="note">운전자 제외 5명 배치: 120가지</text><circle cx="303" cy="286" r="143" fill="#dbeafe" fill-opacity=".72" stroke="#2563eb" stroke-width="3"/><circle cx="459" cy="286" r="143" fill="#fce7f3" fill-opacity=".72" stroke="#be185d" stroke-width="3"/><text x="250" y="238" text-anchor="middle" class="note">A만 제자리</text><text x="250" y="277" text-anchor="middle" class="value">18</text><text x="381" y="256" text-anchor="middle" class="note">둘 다</text><text x="381" y="294" text-anchor="middle" class="value">6</text><text x="515" y="238" text-anchor="middle" class="note">B만 제자리</text><text x="515" y="277" text-anchor="middle" class="value">18</text><text x="381" y="447" text-anchor="middle" class="note">둘 다 자리를 피함 = 120 − 18 − 6 − 18 = 78</text></svg>
