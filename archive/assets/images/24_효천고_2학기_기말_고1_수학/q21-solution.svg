<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="500" viewBox="0 0 760 500" role="img" aria-labelledby="title desc"><title id="title">짝수 합의 조건은 홀수 0개 또는 2개</title><desc id="desc">세 개의 서로 다른 자연수의 합이 짝수이면 세 수 중 홀수의 개수는 정확히 0개 또는 2개임을 분기하여 센다.</desc><rect width="760" height="500" fill="#fff"/><style>text{font-family:Arial,'Malgun Gothic',sans-serif;fill:#172033}.title{font-size:28px;font-weight:700}.note{font-size:21px}.value{font-size:26px;font-weight:700}.small{font-size:18px}.label{font-size:23px;font-weight:700}</style><text x="34" y="48" text-anchor="start" class="title">짝수 합의 조건은 홀수 0개 또는 2개</text><rect x="246" y="88" width="270" height="69" rx="10" fill="#f8fafc" stroke="#475569" stroke-width="2"/><text x="381" y="130" text-anchor="middle" class="label">a + b + c 가 짝수</text><line x1="380" y1="157" x2="380" y2="184" stroke="#334155" stroke-width="2" /><line x1="188" y1="184" x2="570" y2="184" stroke="#334155" stroke-width="2" /><line x1="188" y1="184" x2="188" y2="207" stroke="#334155" stroke-width="2" /><line x1="570" y1="184" x2="570" y2="207" stroke="#334155" stroke-width="2" /><rect x="38" y="207" width="302" height="174" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><rect x="419" y="207" width="302" height="174" rx="10" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/><text x="190" y="252" text-anchor="middle" class="label">홀수 0개</text><text x="190" y="297" text-anchor="middle" class="note">짝수 7개 중 3개</text><text x="190" y="346" text-anchor="middle" class="value">35가지</text><text x="570" y="252" text-anchor="middle" class="label">홀수 2개</text><text x="570" y="295" text-anchor="middle" class="note">홀수 8개 중 2개</text><text x="570" y="327" text-anchor="middle" class="small">짝수 7개 중 1개</text><text x="570" y="357" text-anchor="middle" class="value">196가지</text><text x="380" y="445" text-anchor="middle" class="value">35 + 196 = 231가지</text></svg>
