<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="500" viewBox="0 0 760 500" role="img" aria-labelledby="title desc"><title id="title">역함수가 존재하므로 일대일 대응</title><desc id="desc">다섯 원소의 함수 대응은 -2에서 -1, -1에서 0, 0에서 2, 1에서 1, 2에서 -2로 각각 다르게 대응한다.</desc><rect width="760" height="500" fill="#fff"/><style>text{font-family:Arial,'Malgun Gothic',sans-serif;fill:#172033}.title{font-size:28px;font-weight:700}.note{font-size:21px}.value{font-size:26px;font-weight:700}.small{font-size:18px}.label{font-size:23px;font-weight:700}</style><text x="34" y="48" text-anchor="start" class="title">역함수가 존재하므로 일대일 대응</text><text x="380" y="112" text-anchor="middle" class="note">다섯 입력은 서로 다른 다섯 출력으로 대응한다.</text><rect x="155" y="118" width="137" height="47" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><rect x="468" y="118" width="137" height="47" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/><text x="222" y="149" text-anchor="middle" class="label">−2</text><text x="536" y="149" text-anchor="middle" class="label">−1</text><line x1="298" y1="141" x2="459" y2="141" stroke="#64748b" stroke-width="2.6" /><text x="378" y="132" text-anchor="middle" class="note">→</text><rect x="155" y="176" width="137" height="47" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><rect x="468" y="176" width="137" height="47" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/><text x="222" y="207" text-anchor="middle" class="label">−1</text><text x="536" y="207" text-anchor="middle" class="label">0</text><line x1="298" y1="199" x2="459" y2="199" stroke="#64748b" stroke-width="2.6" /><text x="378" y="190" text-anchor="middle" class="note">→</text><rect x="155" y="234" width="137" height="47" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><rect x="468" y="234" width="137" height="47" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/><text x="222" y="265" text-anchor="middle" class="label">0</text><text x="536" y="265" text-anchor="middle" class="label">2</text><line x1="298" y1="257" x2="459" y2="257" stroke="#64748b" stroke-width="2.6" /><text x="378" y="248" text-anchor="middle" class="note">→</text><rect x="155" y="292" width="137" height="47" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><rect x="468" y="292" width="137" height="47" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/><text x="222" y="323" text-anchor="middle" class="label">1</text><text x="536" y="323" text-anchor="middle" class="label">1</text><line x1="298" y1="315" x2="459" y2="315" stroke="#64748b" stroke-width="2.6" /><text x="378" y="306" text-anchor="middle" class="note">→</text><rect x="155" y="350" width="137" height="47" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><rect x="468" y="350" width="137" height="47" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/><text x="222" y="381" text-anchor="middle" class="label">2</text><text x="536" y="381" text-anchor="middle" class="label">−2</text><line x1="298" y1="373" x2="459" y2="373" stroke="#64748b" stroke-width="2.6" /><text x="378" y="364" text-anchor="middle" class="note">→</text><text x="215" y="451" text-anchor="middle" class="label">입력 x</text><text x="538" y="451" text-anchor="middle" class="label">함숫값 f(x)</text></svg>
