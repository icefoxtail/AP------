<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="500" viewBox="0 0 760 500" role="img" aria-labelledby="title desc"><title id="title">남학생 선택과 여학생 선택의 곱</title><desc id="desc">남학생 여섯 명 중 둘, 여학생 네 명 중 둘을 각각 순서 없이 선택하고 경우의 수를 곱한다.</desc><rect width="760" height="500" fill="#fff"/><style>text{font-family:Arial,'Malgun Gothic',sans-serif;fill:#172033}.title{font-size:28px;font-weight:700}.note{font-size:21px}.value{font-size:26px;font-weight:700}.small{font-size:18px}.label{font-size:23px;font-weight:700}</style><text x="34" y="48" text-anchor="start" class="title">남학생 선택과 여학생 선택의 곱</text><rect x="45" y="100" width="316" height="220" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><rect x="400" y="100" width="316" height="220" rx="10" fill="#fdf2f8" stroke="#be185d" stroke-width="2"/><text x="203" y="145" text-anchor="middle" class="label">남학생 6명 중 2명</text><text x="558" y="145" text-anchor="middle" class="label">여학생 4명 중 2명</text><circle cx="86" cy="204" r="15" fill="#1d4ed8"/><circle cx="132" cy="204" r="15" fill="#1d4ed8"/><circle cx="178" cy="204" r="15" fill="#94a3b8"/><circle cx="224" cy="204" r="15" fill="#94a3b8"/><circle cx="270" cy="204" r="15" fill="#94a3b8"/><circle cx="316" cy="204" r="15" fill="#94a3b8"/><circle cx="465" cy="204" r="15" fill="#be185d"/><circle cx="525" cy="204" r="15" fill="#be185d"/><circle cx="585" cy="204" r="15" fill="#cbd5e1"/><circle cx="645" cy="204" r="15" fill="#cbd5e1"/><text x="203" y="284" text-anchor="middle" class="value">15가지</text><text x="558" y="284" text-anchor="middle" class="value">6가지</text><text x="380" y="360" text-anchor="middle" class="note">두 선택을 짝지어 한 모둠을 만든다.</text><text x="380" y="426" text-anchor="middle" class="value">15 × 6 = 90가지</text></svg>
