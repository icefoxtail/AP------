<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="500" viewBox="0 0 760 500" role="img" aria-labelledby="title desc"><title id="title">A·B가 있는 조 먼저 고정하고 남은 두 조 나누기</title><desc id="desc">A와 B를 포함하는 네 명 조는 45가지이고 나머지 두 개의 이름 없는 네 명 조는 35가지임을 그림으로 분리한다.</desc><rect width="760" height="500" fill="#fff"/><style>text{font-family:Arial,'Malgun Gothic',sans-serif;fill:#172033}.title{font-size:28px;font-weight:700}.note{font-size:21px}.value{font-size:26px;font-weight:700}.small{font-size:18px}.label{font-size:23px;font-weight:700}</style><text x="34" y="48" text-anchor="start" class="title">A·B가 있는 조 먼저 고정하고 남은 두 조 나누기</text><rect x="35" y="116" width="330" height="245" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><rect x="396" y="116" width="330" height="245" rx="10" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/><text x="200" y="161" text-anchor="middle" class="label">A와 B가 속한 조</text><text x="560" y="161" text-anchor="middle" class="label">나머지 8명</text><rect x="73" y="190" width="61" height="65" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="103" y="231" text-anchor="middle" class="value">A</text><rect x="148" y="190" width="61" height="65" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="178" y="231" text-anchor="middle" class="value">B</text><rect x="223" y="190" width="61" height="65" rx="6" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="253" y="231" text-anchor="middle" class="value">?</text><rect x="298" y="190" width="61" height="65" rx="6" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="328" y="231" text-anchor="middle" class="value">?</text><text x="200" y="304" text-anchor="middle" class="note">남은 10명 중 2명</text><text x="200" y="337" text-anchor="middle" class="value">45가지</text><rect x="427" y="195" width="127" height="73" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="2"/><rect x="570" y="195" width="127" height="73" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="2"/><text x="491" y="241" text-anchor="middle" class="value">4명</text><text x="633" y="241" text-anchor="middle" class="value">4명</text><text x="560" y="305" text-anchor="middle" class="note">70 ÷ 2 = 35</text><text x="560" y="340" text-anchor="middle" class="small">조에 이름 없음</text><text x="380" y="432" text-anchor="middle" class="value">45 × 35 = 1575가지</text></svg>
