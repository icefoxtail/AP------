<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="500" viewBox="0 0 760 500" role="img" aria-labelledby="title desc"><title id="title">조합 항등식: 임원 먼저와 회장 먼저</title><desc id="desc">임원과 회장을 함께 뽑는 동일한 경우를 두 가지 순서로 세어 항등식을 설명한다.</desc><rect width="760" height="500" fill="#fff"/><style>text{font-family:Arial,'Malgun Gothic',sans-serif;fill:#172033}.title{font-size:28px;font-weight:700}.note{font-size:25px}.value{font-size:30px;font-weight:700}.small{font-size:25px}.label{font-size:26px;font-weight:700}</style><text x="34" y="48" text-anchor="start" class="title">조합 항등식: 임원 먼저와 회장 먼저</text><text x="380" y="101" text-anchor="middle" class="note">같은 임원 구성을 뽑는 두 순서</text><rect x="35" y="139" width="329" height="235" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><rect x="398" y="139" width="329" height="235" rx="10" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/><text x="200" y="183" text-anchor="middle" class="label">임원을 먼저</text><text x="563" y="183" text-anchor="middle" class="label">회장을 먼저</text><text x="200" y="235" text-anchor="middle" class="note">n명에서 r명 선택</text><text x="200" y="276" text-anchor="middle" class="note">그중 1명 회장</text><text x="200" y="333" text-anchor="middle" class="value">r × nCr</text><text x="563" y="235" text-anchor="middle" class="note">n명에서 회장 1명</text><text x="563" y="276" text-anchor="middle" class="note">남은 n−1명에서 r−1명</text><text x="563" y="333" text-anchor="middle" class="value">n × (n−1)C(r−1)</text><text x="380" y="432" text-anchor="middle" class="note">두 수가 같으므로 (가)=r!, (나)=r−1</text></svg>
