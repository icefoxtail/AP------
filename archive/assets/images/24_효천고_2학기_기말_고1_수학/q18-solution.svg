<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="500" viewBox="0 0 760 500" role="img" aria-labelledby="title desc"><title id="title">B가 A에 포함될 때 두 근의 대응은 두 가지</title><desc id="desc">g의 근 r,s에 f를 적용하면 다시 r,s가 나오며, 항등 대응 또는 서로 바뀌는 대응 두 경우뿐임을 화살표로 보인다.</desc><rect width="760" height="500" fill="#fff"/><style>text{font-family:Arial,'Malgun Gothic',sans-serif;fill:#172033}.title{font-size:28px;font-weight:700}.note{font-size:21px}.value{font-size:26px;font-weight:700}.small{font-size:18px}.label{font-size:23px;font-weight:700}</style><text x="34" y="48" text-anchor="start" class="title">B가 A에 포함될 때 두 근의 대응은 두 가지</text><text x="380" y="102" text-anchor="middle" class="note">두 근 r, s는 서로 다른 두 근에 대응해야 한다.</text><rect x="36" y="143" width="329" height="236" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><rect x="396" y="143" width="329" height="236" rx="10" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/><text x="200" y="179" text-anchor="middle" class="label">경우 1: 그대로 대응</text><text x="560" y="179" text-anchor="middle" class="label">경우 2: 서로 교환</text><text x="104" y="236" text-anchor="middle" class="value">r</text><text x="275" y="236" text-anchor="middle" class="value">r</text><line x1="133" y1="229" x2="241" y2="229" stroke="#2563eb" stroke-width="2.8" /><text x="104" y="287" text-anchor="middle" class="value">s</text><text x="275" y="287" text-anchor="middle" class="value">s</text><line x1="133" y1="280" x2="241" y2="280" stroke="#2563eb" stroke-width="2.8" /><text x="200" y="352" text-anchor="middle" class="note">p=1, q=−3</text><text x="474" y="236" text-anchor="middle" class="value">r</text><text x="655" y="236" text-anchor="middle" class="value">s</text><text x="474" y="287" text-anchor="middle" class="value">s</text><text x="655" y="287" text-anchor="middle" class="value">r</text><line x1="495" y1="234" x2="635" y2="234" stroke="#15803d" stroke-width="2.8" /><line x1="495" y1="282" x2="635" y2="282" stroke="#15803d" stroke-width="2.8" /><text x="560" y="352" text-anchor="middle" class="note">p=−1, q=−4</text><text x="380" y="447" text-anchor="middle" class="value">pq = −3 또는 4 → 최댓값 4</text></svg>
