<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" width="640" height="280" role="img" aria-labelledby="title desc">
  <title id="title">두 축과 직선에 접하는 두 원</title>
  <desc id="desc">제1사분면에서 두 좌표축과 직선 5x+12y-6=0에 동시에 접하는 두 원의 중심과 접점을 나타낸 그림이다.</desc>
  <rect width="640" height="280" fill="#fff"/>
  <text x="320" y="28" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="22" font-weight="700" fill="#1e3a5f">M=(r,r)  와  5x+12y−6=0</text>
  <rect x="18" y="44" width="365" height="215" rx="8" fill="#f8fafc" stroke="#dbe3ef"/>
  <line x1="50" y1="223" x2="350" y2="223" stroke="#0f172a" stroke-width="2"/><line x1="76" y1="244" x2="76" y2="59" stroke="#0f172a" stroke-width="2"/>
  <line x1="50" y1="205" x2="350" y2="92" stroke="#dc2626" stroke-width="2.5"/>
  <circle cx="94" cy="205" r="18" fill="#dbeafe" fill-opacity=".75" stroke="#2563eb" stroke-width="2.3"/><circle cx="218" cy="153" r="61" fill="#dcfce7" fill-opacity=".55" stroke="#059669" stroke-width="2.4"/>
  <line x1="94" y1="205" x2="94" y2="223" stroke="#2563eb" stroke-width="1.8" stroke-dasharray="4 3"/><line x1="218" y1="153" x2="218" y2="223" stroke="#059669" stroke-width="1.8" stroke-dasharray="4 3"/><line x1="94" y1="205" x2="94" y2="187" stroke="#2563eb" stroke-width="1.8"/><line x1="218" y1="153" x2="218" y2="92" stroke="#059669" stroke-width="1.8"/>
  <circle cx="94" cy="205" r="4" fill="#1d4ed8"/><circle cx="218" cy="153" r="4" fill="#047857"/><circle cx="104" cy="201" r="4" fill="#dc2626"/><circle cx="268" cy="123" r="4" fill="#dc2626"/>
  <text x="99" y="196" font-family="Arial, sans-serif" font-size="15" fill="#1d4ed8">M₁</text><text x="222" y="148" font-family="Arial, sans-serif" font-size="15" fill="#047857">M₂</text><text x="274" y="119" font-family="Arial, sans-serif" font-size="15" fill="#b91c1c">l</text><text x="54" y="243" font-family="Arial, sans-serif" font-size="15">x축</text><text x="80" y="70" font-family="Arial, sans-serif" font-size="15">y축</text>
  <rect x="407" y="44" width="215" height="215" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="427" y="76" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="18" font-weight="700" fill="#1e3a5f">두 반지름</text>
  <text x="427" y="112" font-family="Arial, sans-serif" font-size="17">r=1/5, 3/2</text><text x="427" y="145" font-family="Arial, sans-serif" font-size="16">M₁=(1/5,1/5)</text><text x="427" y="177" font-family="Arial, sans-serif" font-size="16">M₂=(3/2,3/2)</text>
  <line x1="427" y1="189" x2="600" y2="189" stroke="#cbd5e1"/>
  <text x="427" y="219" font-family="Arial, sans-serif" font-size="15">P₁, P₂: 수선의 발</text><text x="427" y="246" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="17" font-weight="700" fill="#b91c1c">넓이=119/200  →  ⑤</text>
</svg>
