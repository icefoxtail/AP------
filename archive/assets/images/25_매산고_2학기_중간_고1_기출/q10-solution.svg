<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" width="640" height="260" role="img" aria-labelledby="title desc" data-scale-policy="SCHEMATIC_ALLOWED">
  <title id="title">인공위성에서 지구에 그은 두 접선</title>
  <desc id="desc">지구를 나타내는 원 x²+y²=9와 위성 A(15,0)에서 그은 두 접선의 기울기 ±1/√24를 나타낸 그림이다.</desc>
  <rect width="640" height="260" fill="#fff"/>
  <text x="320" y="28" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="22" font-weight="700" fill="#1e3a5f">지구 원  x² + y² = 9  와  위성 A(15,0)</text>
  <rect x="18" y="44" width="345" height="190" rx="8" fill="#f8fafc" stroke="#dbe3ef"/>
  <line x1="42" y1="166" x2="350" y2="166" stroke="#0f172a" stroke-width="1.4"/><line x1="130" y1="224" x2="130" y2="58" stroke="#0f172a" stroke-width="1.4"/>
  <circle cx="130" cy="166" r="54" fill="#bfdbfe" fill-opacity=".65" stroke="#2563eb" stroke-width="2.5"/>
  <line x1="310" y1="166" x2="154" y2="115" stroke="#0f766e" stroke-width="2.3"/><line x1="310" y1="166" x2="154" y2="217" stroke="#f97316" stroke-width="2.3"/>
  <circle cx="310" cy="166" r="5" fill="#dc2626"/><circle cx="154" cy="115" r="4" fill="#0f766e"/><circle cx="154" cy="217" r="4" fill="#f97316"/><circle cx="130" cy="166" r="4" fill="#1d4ed8"/>
  <text x="314" y="160" font-family="Arial, sans-serif" font-size="16" fill="#b91c1c">A(15,0)</text><text x="162" y="112" font-family="Arial, sans-serif" font-size="15" fill="#0f766e">T₁</text><text x="162" y="224" font-family="Arial, sans-serif" font-size="15" fill="#c2410c">T₂</text><text x="83" y="161" font-family="Arial, sans-serif" font-size="16" fill="#1d4ed8">O</text>
  <rect x="390" y="44" width="232" height="190" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="410" y="76" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="18" font-weight="700" fill="#1e3a5f">거리 조건</text>
  <text x="410" y="113" font-family="Arial, sans-serif" font-size="17">y=m(x−15)</text><text x="410" y="145" font-family="Arial, sans-serif" font-size="17">15|m|/√(m²+1)=3</text><text x="410" y="177" font-family="Arial, sans-serif" font-size="17">m²=1/24</text>
  <line x1="410" y1="189" x2="600" y2="189" stroke="#cbd5e1"/>
  <text x="410" y="218" font-family="Arial, sans-serif" font-size="16">m₁m₂=−1/24</text><text x="410" y="244" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="17" font-weight="700" fill="#b91c1c">a+b=25  →  ③</text>
</svg>
