<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" width="640" height="260" role="img" aria-labelledby="title desc" data-scale-policy="SCHEMATIC_ALLOWED">
  <title id="title">두 원에 공통으로 접하는 직선</title>
  <desc id="desc">첫 번째 원의 접점 T(-2,1)에서의 접선 x+3y-1=0이 두 번째 원에도 접하는 구조를 나타낸 그림이다.</desc>
  <rect width="640" height="260" fill="#fff"/>
  <text x="320" y="28" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="22" font-weight="700" fill="#1e3a5f">접선  x + 3y − 1 = 0</text>
  <rect x="18" y="44" width="350" height="190" rx="8" fill="#f8fafc" stroke="#dbe3ef"/>
  <line x1="48" y1="205" x2="335" y2="64" stroke="#dc2626" stroke-width="2.5"/>
  <circle cx="140" cy="150" r="49" fill="#dbeafe" fill-opacity=".58" stroke="#2563eb" stroke-width="2.4"/><circle cx="270" cy="150" r="49" fill="#dcfce7" fill-opacity=".52" stroke="#059669" stroke-width="2.4"/>
  <line x1="140" y1="150" x2="116" y2="112" stroke="#7c3aed" stroke-width="2" stroke-dasharray="5 4"/><line x1="270" y1="150" x2="246" y2="112" stroke="#7c3aed" stroke-width="2" stroke-dasharray="5 4"/>
  <circle cx="116" cy="112" r="4" fill="#dc2626"/><circle cx="246" cy="112" r="4" fill="#dc2626"/><circle cx="140" cy="150" r="4" fill="#1d4ed8"/><circle cx="270" cy="150" r="4" fill="#047857"/>
  <text x="81" y="145" font-family="Arial, sans-serif" font-size="15" fill="#1d4ed8">C₁(−3,−2)</text><text x="274" y="146" font-family="Arial, sans-serif" font-size="15" fill="#047857">C₂(3,−4)</text><text x="72" y="105" font-family="Arial, sans-serif" font-size="15" fill="#b91c1c">T(−2,1)</text><text x="251" y="104" font-family="Arial, sans-serif" font-size="15" fill="#b91c1c">√10</text>
  <rect x="395" y="44" width="227" height="190" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="415" y="76" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="18" font-weight="700" fill="#1e3a5f">두 번째 원</text>
  <text x="415" y="112" font-family="Arial, sans-serif" font-size="17">(x−3)²+(y+4)²=25−k</text><text x="415" y="146" font-family="Arial, sans-serif" font-size="17">거리 = √10</text><text x="415" y="180" font-family="Arial, sans-serif" font-size="17">25−k=10</text>
  <text x="415" y="219" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="18" font-weight="700" fill="#b91c1c">k=15  →  ⑤</text>
</svg>
