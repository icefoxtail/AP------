<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" width="640" height="260" role="img" aria-labelledby="title desc">
  <title id="title">지름의 양 끝점으로 원의 방정식 세우기</title>
  <desc id="desc">A(5,-1), B(-3,5)를 지름의 양 끝점으로 하는 원의 중심과 반지름, 전개 결과를 나타낸 그림이다.</desc>
  <rect width="640" height="260" fill="#fff"/>
  <text x="320" y="28" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="22" font-weight="700" fill="#1e3a5f">지름 AB  →  중심 C(1, 2),  반지름 5</text>
  <rect x="18" y="44" width="325" height="190" rx="8" fill="#f8fafc" stroke="#dbe3ef"/>
  <line x1="47" y1="165" x2="320" y2="165" stroke="#0f172a" stroke-width="1.4"/><line x1="183" y1="221" x2="183" y2="60" stroke="#0f172a" stroke-width="1.4"/>
  <circle cx="183" cy="165" r="70" fill="#dbeafe" fill-opacity=".62" stroke="#2563eb" stroke-width="2.5"/>
  <line x1="127" y1="109" x2="239" y2="221" stroke="#dc2626" stroke-width="2.3"/><circle cx="127" cy="109" r="4.5" fill="#dc2626"/><circle cx="239" cy="221" r="4.5" fill="#dc2626"/><circle cx="183" cy="165" r="4" fill="#1d4ed8"/>
  <text x="88" y="104" font-family="Arial, sans-serif" font-size="16" fill="#b91c1c">B(−3,5)</text><text x="242" y="224" font-family="Arial, sans-serif" font-size="16" fill="#b91c1c">A(5,−1)</text><text x="190" y="160" font-family="Arial, sans-serif" font-size="16" fill="#1d4ed8">C(1,2)</text>
  <text x="154" y="187" font-family="Arial, sans-serif" font-size="15" fill="#b91c1c">AB=10</text>
  <rect x="370" y="44" width="252" height="190" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="390" y="76" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="18" font-weight="700" fill="#1e3a5f">표준형과 비교</text>
  <text x="390" y="113" font-family="Arial, sans-serif" font-size="19">(x−1)²+(y−2)²=25</text>
  <text x="390" y="151" font-family="Arial, sans-serif" font-size="18">x²+y²−2x−4y−20=0</text>
  <text x="390" y="188" font-family="Arial, sans-serif" font-size="18">a=−2, b=−4, c=−20</text>
  <text x="390" y="219" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="18" font-weight="700" fill="#b91c1c">bc/a = −40  →  ②</text>
</svg>
