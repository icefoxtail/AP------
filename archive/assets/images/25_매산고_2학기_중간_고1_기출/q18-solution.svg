<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" width="640" height="280" role="img" aria-labelledby="title desc">
  <title id="title">선분 AB의 교점과 외접원</title>
  <desc id="desc">A(4,2), B(0,4), 선분 AB와 y=x, y=2x의 교점 D,E, 그리고 삼각형 ODE의 외접원을 나타낸 그림이다.</desc>
  <rect width="640" height="280" fill="#fff"/>
  <text x="320" y="28" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="22" font-weight="700" fill="#1e3a5f">A(4,2), B(0,4)  →  D, E  →  외접원</text>
  <rect x="18" y="44" width="365" height="215" rx="8" fill="#f8fafc" stroke="#dbe3ef"/>
  <line x1="47" y1="205" x2="350" y2="205" stroke="#0f172a" stroke-width="1.4"/><line x1="128" y1="240" x2="128" y2="57" stroke="#0f172a" stroke-width="1.4"/>
  <circle cx="195" cy="138" r="61" fill="#ede9fe" fill-opacity=".55" stroke="#7c3aed" stroke-width="2.2"/>
  <line x1="128" y1="205" x2="256" y2="71" stroke="#64748b" stroke-width="1.8"/><line x1="128" y1="205" x2="320" y2="76" stroke="#f97316" stroke-width="1.8"/><line x1="128" y1="205" x2="256" y2="141" stroke="#dc2626" stroke-width="2.2"/>
  <line x1="128" y1="141" x2="320" y2="205" stroke="#0f766e" stroke-width="2.2"/>
  <circle cx="128" cy="205" r="4.5" fill="#1d4ed8"/><circle cx="256" cy="141" r="4" fill="#dc2626"/><circle cx="208" cy="178" r="4" fill="#0f766e"/><circle cx="256" cy="71" r="4" fill="#b91c1c"/><circle cx="320" cy="76" r="4" fill="#b91c1c"/>
  <text x="109" y="222" font-family="Arial, sans-serif" font-size="16" fill="#1d4ed8">O</text><text x="260" y="137" font-family="Arial, sans-serif" font-size="16" fill="#b91c1c">D</text><text x="212" y="196" font-family="Arial, sans-serif" font-size="16" fill="#0f766e">E</text><text x="261" y="67" font-family="Arial, sans-serif" font-size="15">A</text><text x="324" y="72" font-family="Arial, sans-serif" font-size="15">B</text>
  <rect x="407" y="44" width="215" height="215" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="427" y="76" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="18" font-weight="700" fill="#1e3a5f">교점과 원</text>
  <text x="427" y="112" font-family="Arial, sans-serif" font-size="17">D=(8/3,8/3)</text><text x="427" y="143" font-family="Arial, sans-serif" font-size="17">E=(8/5,16/5)</text><text x="427" y="177" font-family="Arial, sans-serif" font-size="17">u=v=−8/3</text>
  <line x1="427" y1="189" x2="600" y2="189" stroke="#cbd5e1"/>
  <text x="427" y="218" font-family="Arial, sans-serif" font-size="16">k=32/9</text><text x="427" y="246" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="17" font-weight="700" fill="#b91c1c">36k=128  →  ①</text>
</svg>
