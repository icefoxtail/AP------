2.5"/></g><rect x="582" y="70" width="210" height="320" rx="12" fill="#f8fafc" stroke="#dbe3ef"/><text x="602" y="100" class="head">핵심 관계</text><text x="602" y="138" class="note">A-P-B</text><text x="602" y="166" class="note">AP:PB=1:3</text><text x="602" y="204" class="note">AB: y=-x/2+2</text><text x="602" y="232" class="note">l: y=2x+2</text><text x="602" y="260" class="note">AB ⟂ l at P</text><text x="602" y="298" class="note">sx=sy=30</text></svg>