<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 430" width="820" height="430" preserveAspectRatio="xMidYMid meet" role="img" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-axis-scale-mode="EQUAL_UNIT"><title>선분 AB와 수직인 직선</title><desc>AB 위의 내분점 P와 P를 지나는 직선 y=2x+2, 그리고 두 직선의 수직 관계를 나타낸다.</desc><style>.axis{font:italic 14px serif;fill:#111827}.label{font:600 13px "Malgun Gothic",sans-serif}.note{font:12px "Malgun Gothic",sans-serif;fill:#334155}.head{font:700 17px "Malgun Gothic",sans-serif;fill:#0f172a}</style><rect width="820" height="430" fill="#fff"/><text x="28" y="32" class="head">내분점 P를 지나는 수직선</text><text x="28" y="54" class="note">P=(0,2), AP:PB=1:3이고 AB와 y=2x+2는 수직</text><rect x="28" y="70" width="530" height="320" rx="12" fill="#fff" stroke="#cbd5e1"/><g stroke="#e5e7eb" stroke-width="1"><line x1="48" y1="110" x2="538" y2="110"/><line x1="48" y1="150" x2="538" y2="150"/><line x1="48" y1="190" x2="538" y2="190"/><line x1="48" y1="230" x2="538" y2="230"/><line x1="48" y1="270" x2="538" y2="270"/><line x1="48" y1="310" x2="538" y2="310"/><line x1="48" y1="350" x2="538" y2="350"/><line x1="68" y1="90" x2="68" y2="375"/><line x1="107" y1="90" x2="107" y2="375"/><line x1="146" y1="90" x2="146" y2="375"/><line x1="185" y1="90" x2="185" y2="375"/><line x1="224" y1="90" x2="224" y2="375"/><line x1="263" y1="90" x2="263" y2="375"/><line x1="302" y1="90" x2="302" y2="375"/><line x1="341" y1="90" x2="341" y2="375"/><line x1="380" y1="90" x2="380" y2="375"/><line x1="419" y1="90" x2="419" y2="375"/><line x1="458" y1="90" x2="458" y2="375"/><line x1="497" y1="90" x2="497" y2="375"/></g><line x1="48" y1="230" x2="538" y2="230" stroke="#111827" stroke-width="1.4"/><line x1="224" y1="90" x2="224" y2="375" stroke="#111827" stroke-width="1.4"/><text x="528" y="222" class="axis">x</text><text x="232" y="105" class="axis">y</text><line data-geometry="line" data-equation="y=-x/2+2" x1="68" y1="142.5" x2="