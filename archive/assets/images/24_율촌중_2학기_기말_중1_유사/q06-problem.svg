<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 440" width="600" height="440" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">밑면의 반지름과 높이가 주어진 원기둥 A와, 밑면의 반지름만 주어진 원기둥 B를 나란히 놓은 그림이다. 두 원기둥의 부피는 서로 같다.</title><desc id="visual-desc">왼쪽 원기둥 A에는 반지름 4센티미터와 높이 9센티미터가, 오른쪽 원기둥 B에는 반지름 3센티미터와 높이 h가 표시되어 있다.</desc><rect width="600" height="440" fill="#fff"/><g data-layer="30"><line id="sA1A2" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="70.731707317" y1="380.487804878" x2="254.146341463" y2="380.487804878"/></g><g data-layer="30"><line id="sA2A3" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="254.146341463" y1="380.487804878" x2="254.146341463" y2="174.146341463"/></g><g data-layer="30"><line id="sA3A4" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="254.146341463" y1="174.146341463" x2="70.731707317" y2="174.146341463"/></g><g data-layer="30"><line id="sA4A1" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="70.731707317" y1="174.146341463" x2="70.731707317" y2="380.487804878"/></g><g data-layer="30"><line id="sAcAr" data-role="line" stroke="#111" stroke-width="1.6" fill="none" stroke-dasharray="6 4" x1="162.43902439" y1="277.317073171" x2="254.146341463" y2="277.317073171"/></g><g data-layer="30"><line id="sB1B2" data-role="line" stroke="#111" stroke-width="1.6