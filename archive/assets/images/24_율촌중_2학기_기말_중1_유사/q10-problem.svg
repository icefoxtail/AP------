<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 420" width="480" height="420" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">밑면의 반지름이 6미터, 높이가 8미터인 원뿔을 꼭짓점에서 4미터 아래에서 잘라 위쪽 작은 원뿔을 제거한 모양이다. 잘린 단면의 반지름도 표시되어 있다.</title><desc id="visual-desc">아래쪽 원뿔대와 그 위의 점선으로 된 작은 원뿔이 보인다. 밑면 반지름 6미터, 윗면 반지름 3미터, 작은 원뿔의 높이 4미터, 남은 부분의 높이 4미터가 표시되어 있다.</desc><rect width="480" height="420" fill="#fff"/><g data-layer="30"><line id="sLP" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="54.285714286" y1="333.80952381" x2="147.142857143" y2="210"/></g><g data-layer="30"><line id="sRQ" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="425.714285714" y1="333.80952381" x2="332.857142857" y2="210"/></g><g data-layer="30"><line id="sPC" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="147.142857143" y1="210" x2="240" y2="210"/></g><g data-layer="30"><line id="sCQ" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="240" y1="210" x2="332.857142857" y2="210"/></g><g data-layer="30"><line id="sLO" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="54.285714286" y1="333.80952381" x2="240" y2="333.80952381"/></g><g data-layer="30"><line id="sOR" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="240" y1="333.80952381" x2="425.714285714" y2="333.80952381"/></g><g data-