<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 528 378" width="528" height="378" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-ellipse-figure="ellipse-figure-v1" data-major-axis="X" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="6" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round"><title id="visual-title">타원의 두 초점 F,F′와 타원 위의 두 점 A,B가 직사각형 FAF′B를 이루고 대각선 FF′,AB가 중심 O에서 만나는 그림. AF=5, AF′=12</title><desc id="visual-desc">가로로 긴 타원 안에 초점 F, F′가 있고 A는 타원의 오른쪽 위, B는 왼쪽 아래에 있다. F-A-F′-B가 직사각형을 이루며 두 대각선은 타원의 중심 O에서 교차한다. A에서 F까지 길이 5, A에서 F′까지 길이 12이다.</desc><rect width="528" height="378" fill="#fff"/><g data-layer="10"><line id="axis-x" data-role="axis" data-axis="x" x1="34" y1="189.16" x2="494" y2="189.16" fill="none" stroke="#444" stroke-width="1.1"/></g><g data-layer="10"><line id="axis-y" data-role="axis" data-axis="y" x1="264" y1="344" x2="264" y2="34.32" fill="none" stroke="#444" stroke-width="1.1"/></g><g data-layer="11"><polygon id="axis-x-head" data-role="axis-head" data-axis="x" points="494,189.16 485,185.56 485,192.76" fill="#444" stroke="none"/></g><g data-layer="11"><polygon id="axis-y-head" data-role="axis-head" data-axis="y" points="264,34.32 260.4,43.32 267.6,43.32" fill="#444" stroke="none"/></g><g data-layer="25"><ellipse id="ellipse" data-role="ellipse" cx="264" cy="189.16" rx="211.35" ry="136.19" fill="none" stroke="#111" stroke-width="1.7"/></g><g data-layer="30"><line id="segment-sFA" data-role="segment" data-from="F" data-to="A" x1="425.62" y1="189.16" x2="377.8" y2="74.4" fill="none" stroke="#111" stroke-width="1.3"/></g><g data-layer="30"><line id="segment-sAFp" data-role="segment" data-from="A" data-to="F'" x1="377.8" y1="74.4" x2="102.38" y2="189.16" fill="none" stroke="#111" stroke-width="1.3"/></g><g data-layer="30"><line id="segment-sFpB" data-role="segment" data-from="F'" data-to="B" x1="102.38" y1="189.16" x2="150.2" y2="303.92" fi