<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 456" width="520" height="456" role="img" aria-labelledby="title desc"><title id="title">지름 AB 위쪽에 이어진 두 호</title><desc id="desc">원 O에서 A와 B는 지름의 양 끝이다. 위쪽 반원에는 점 C와 선분 OC가 있고, 두 호 AC와 BC를 다른 색으로 표시했다.</desc><rect width="520" height="456" fill="white" /><circle cx="260" cy="224" r="167" fill="none" stroke="#28364b" stroke-width="2.7" /><path d="M 93.0000 224.0000 A 167.0000 167.0000 0 0 1 378.0868 105.9132" stroke="#205d9c" stroke-width="4.1" fill="none" stroke-linecap="round" /><path d="M 378.0868 105.9132 A 167.0000 167.0000 0 0 1 427.0000 224.0000" stroke="#aa5411" stroke-width="4.1" fill="none" stroke-linecap="round" /><line x1="93.0000" y1="224.0000" x2="427.0000" y2="224.0000" stroke="#28364b" stroke-width="2.7" stroke-linecap="round" /><line x1="260.0000" y1="224.0000" x2="378.0868" y2="105.9132" stroke="#28364b" stroke-width="2.45" stroke-linecap="round" /><circle cx="93.0000" cy="224.0000" r="4" fill="#28364b" /><text x="74.0000" y="233.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">A</text><circle cx="427.0000" cy="224.0000" r="4" fill="#28364b" /><text x="447.0000" y="233.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">B</text><circle cx="378.0868" cy="105.9132" r="4" fill="#28364b" /><text x="398.0868" y="93.9132" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">C</text><circle cx="260.0000" cy="224.0000" r="4" fill="#28364b" /><text x="255.0000" y="254.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">O</text></svg>
