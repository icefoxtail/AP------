<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 370" role="img" aria-labelledby="title desc">
<title id="title">정육각형에서 예각삼각형이 되는 점 A, C, E</title>
<desc id="desc">원 위 6개 점을 정육각형 순서대로 놓으면 서로 2칸씩 떨어진 A, C, E가 예각삼각형인 정삼각형을 이룬다.</desc>
<circle cx="180" cy="170" r="115" fill="none" stroke="#555" stroke-width="2"/>
<polygon points="180.0,55.0 279.593,227.5 80.407,227.5" fill="#ddd" fill-opacity="0.5" stroke="#a03939" stroke-width="3"/>
<circle cx="180.0" cy="55.0" r="4"/><text x="189.0" y="47.0" font-size="21">A</text>
<circle cx="279.593" cy="112.5" r="4"/><text x="288.593" y="132.5" font-size="21">B</text>
<circle cx="279.593" cy="227.5" r="4"/><text x="288.593" y="247.5" font-size="21">C</text>
<circle cx="180.0" cy="285.0" r="4"/><text x="164.0" y="305.0" font-size="21">D</text>
<circle cx="80.407" cy="227.5" r="4"/><text x="64.407" y="247.5" font-size="21">E</text>
<circle cx="80.407" cy="112.5" r="4"/><text x="64.407" y="132.5" font-size="21">F</text>
<text x="20" y="340" font-size="17">예각: (a,b)=(2,2),(4,4) / 삼각형 20쌍</text></svg>