<g fill="#dc2626" stroke="white" stroke-width="1.5"><circle cx="272.00" cy="468.00" r="5"/><circle cx="374.86" cy="330.00" r="5"/><circle cx="180.57" cy="304.45" r="5"/></g><circle cx="272.00" cy="360.67" r="4" fill="#111827"/>
<g fill="#111827" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="600"><text x="58.00" y="491.00">A</text><text x="425.00" y="491.00">B</text><text x="304.29" y="88.01">C</text><text x="268.00" y="492.00">F</text><text x="382.86" y="331.00">D</text><text x="160.57" y="296.45">E</text><text x="280.00" y="353.67">O</text></g>
<g fill="#111827" font-family="DejaVu Sans,Arial,sans-serif" font-size="18"><text x="148" y="506">AF = 4 cm</text><text x="297" y="506">BF = 3 cm</text><text x="414" y="325">BD = 3 cm</text><text x="349" y="181">CD = 5 cm</text><text x="150" y="203">CE = 5 cm</text><text x="128" y="345">AE = 4 cm</text></g>
