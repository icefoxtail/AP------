<svg xmlns="http://www.w3.org/2000/svg" width="570" height="550" viewBox="0 0 570 550">
<title>ALIVE replacement figure for q20: triangle ABC with incircle</title>
<desc>Triangle ABC has an incircle centered at O, tangent to AB, BC, CA at F,D,E. AF=AE=4 cm, BF=BD=3 cm, CE=CD=5 cm. The source q20 crop remains preserved separately and was not used to infer these replacement values.</desc>
