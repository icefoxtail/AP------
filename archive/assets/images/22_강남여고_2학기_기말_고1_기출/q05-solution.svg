<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc" data-visual-case="set-2022-pilot" data-fact-hash="a3d7b9fc7382cd0ac5222b4a2dadbccf78229cd3ece10bfbf0b907465d0adacd" data-visual-provenance="2026-09-05-set-visual-pilot"><title id="title">문항 5 해설: 집합 연산식의 동치 변형</title><desc id="desc">문항의 실제 연산식이 A−(B−C)와 같아지는 두 단계 대수 변형</desc>
