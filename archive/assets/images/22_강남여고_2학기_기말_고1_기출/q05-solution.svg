    <rect width="760" height="430" fill="#f8fafc"/><text x="28" y="38" font-size="22" text-anchor="start" class="text" font-weight="700">차집합을 교집합으로 바꾸고 A를 묶는다</text><text x="28" y="67" font-size="15" text-anchor="start" class="muted">문항의 실제 식 (A−B)∪(A∩C)와 다섯 번째 보기를 비교</text><rect x="34" y="98" width="692" height="214" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/><text x="50" y="125" font-size="15" text-anchor="start" class="text" fill="#2563eb" font-weight="700">동일한 집합으로 가는 두 경로</text><text x="54" y="143" font-size="19" text-anchor="start" class="math-strong">(A−B)∪(A∩C)</text><text x="335" y="143" font-size="18" text-anchor="start" class="text" fill="#1d4ed8" font-weight="700">= (A∩Bᶜ)∪(A∩C)</text><text x="54" y="205" font-size="20" text-anchor="start" class="text" fill="#166534" font-weight="700">= A∩(Bᶜ∪C)</text><text x="335" y="205" font-size="20" text-anchor="start" class="text" fill="#166534" font-weight="700">= A−(B−C)</text><line x1="54" y1="242" x2="704" y2="242" stroke="#e2e8f0" stroke-width="1.4" stroke-linecap="round"/><rect x="54" y="270" width="260" height="30" rx="15" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/><text x="184" y="290" font-size="14" text-anchor="middle" class="text" fill="#166534" font-weight="700">동치식: A−(B−C)</text><text x="354" y="293" font-size="18" text-anchor="start" class="text" fill="#1d4ed8" font-weight="700">A∩(Bᶜ∪C)와 같은 식</text></svg>