<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 320" width="420" height="320" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">직각삼각형의 빗변에 b, 밑변에 2a가 표시되어 있고, 밑변과 높이가 만나는 꼭짓점에 직각 표시가 있다.</title><desc id="visual-desc">직각삼각형 세 변이 검은 선으로 그려져 있고, 가장 긴 빗변 옆에 b, 아래쪽 밑변 옆에 2a가 적혀 있으며 오른쪽 아래 꼭짓점에 직각 기호가 있다.</desc><rect width="420" height="320" fill="#fff"/><g data-layer="30"><line id="sAB" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="275.306122449" y1="45.714285714" x2="144.693877551" y2="274.285714286"/></g><g data-layer="30"><line id="sBC" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="144.693877551" y1="274.285714286" x2="275.306122449" y2="274.285714286"/></g><g data-layer="30"><line id="sCA" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="275.306122449" y1="274.285714286" x2="275.306122449" y2="45.714285714"/></g><g data-layer="60"><polyline id="r0" data-role="indicator" stroke="#111" stroke-width="0.8" fill="none" points="275.306122449,264.285714286 265.306122449,264.285714286 265.306122449,274.285714286"/></g><g data-layer="90"><g id="lAB" data-label-kind="EQUATION_LABEL" data-priority="1" data-font-px="20" data-owner="sAB" data-fragment-sha="sha256:31b780729aa22b29270f1fc10e60f76baa36f3feb077f17195e45052cf613dd8" transform="translate(195.42 139.9)"><svg xmlns="http://www.w3