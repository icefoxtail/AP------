<svg xmlns="http://www.w3.org/2000/svg" width="660" height="430" viewBox="0 0 660 430" role="img" aria-label="선분 위 움직이는 점의 최솟값"><rect width="660" height="430" fill="white"/><text x="22" y="33" font-size="20" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" fill="#172b4d">선분 위 움직이는 점의 최솟값</text><line x1="285.02" y1="60" x2="285.02" y2="350" stroke="#c1cbd7" stroke-width="1"/><line x1="48" y1="219.99" x2="612" y2="219.99" stroke="#c1cbd7" stroke-width="1"/><line x1="303.01" y1="309.95" x2="303.01" y2="94.05" stroke="#1a718c" stroke-width="2.5"/><line x1="374.98" y1="166.02" x2="303.01" y2="237.98" stroke="#d97706" stroke-width="2.5" stroke-dasharray="7 6"/><line x1="303.01" y1="309.95" x2="374.98" y2="166.02" stroke="#d97706" stroke-width="2.5" stroke-dasharray="7 6"/><circle cx="303.01" cy="309.95" r="4.8" fill="#163a60"/><text x="313.01" y="300.95" font-family="Noto Sans CJK KR, sans-serif" font-size="14" fill="#172b4d">A(1, -5)</text><circle cx="374.98" cy="166.02" r="4.8" fill="#163a60"/><text x="384.98" y="157.02" font-family="Noto Sans CJK KR, sans-serif" font-size="14" fill="#172b4d">B(5, 3)</text><circle cx="303.01" cy="94.05" r="4.8" fill="#163a60"/><text x="313.01" y="85.05" font-family="Noto Sans CJK KR, sans-serif" font-size="14" fill="#172b4d">C(1, 7)</text><circle cx="303.01" cy="237.98" r="4.8" fill="#163a60"/><text x="313.01" y="228.98" font-family="Noto Sans CJK KR, sans-serif" font-size="14" fill="#172b4d">P(1, -1)</text><text x="25" y="374" font-family="Noto Sans CJK KR, sans-serif" font-size="15" fill="#31465f">AP² + BP²는 P가 AB의 중점에 가장 가까울 때 최소</text><text x="25" y="396" font-family="Noto Sans CJK KR, sans-serif" font-size="15" fill="#31465f">P는 선분 AC 위의 최솟값 위치</text></svg>
