<svg xmlns="http://www.w3.org/2000/svg" width="660" height="430" viewBox="0 0 660 430" role="img" aria-label="해설: 직각 조건으로 a 결정"><rect width="660" height="430" fill="white"/><text x="22" y="33" font-size="20" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" fill="#172b4d">해설: 직각 조건으로 a 결정</text><line x1="330.00" y1="60" x2="330.00" y2="350" stroke="#c1cbd7" stroke-width="1"/><line x1="48" y1="287.50" x2="612" y2="287.50" stroke="#c1cbd7" stroke-width="1"/><polygon points="444.00,211.50 216.00,116.50 330.00,287.50" fill="#e4f4fa" fill-opacity="0.8" stroke="#1a718c" stroke-width="2.3"/><circle cx="444.00" cy="211.50" r="4.8" fill="#163a60"/><text x="454.00" y="202.50" font-family="Noto Sans CJK KR, sans-serif" font-size="14" fill="#172b4d">A(2, 4/3)</text><circle cx="216.00" cy="116.50" r="4.8" fill="#163a60"/><text x="226.00" y="107.50" font-family="Noto Sans CJK KR, sans-serif" font-size="14" fill="#172b4d">B(-2, 3)</text><circle cx="330.00" cy="287.50" r="4.8" fill="#163a60"/><text x="340.00" y="278.50" font-family="Noto Sans CJK KR, sans-serif" font-size="14" fill="#172b4d">C(0, 0)</text><text x="25" y="374" font-family="Noto Sans CJK KR, sans-serif" font-size="15" fill="#31465f">(A-C)·(B-C) = 0 → a = 4/3</text><text x="25" y="396" font-family="Noto Sans CJK KR, sans-serif" font-size="15" fill="#31465f">AC² + BC² = AB² (빗변 AB)</text></svg>
