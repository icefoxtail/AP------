<svg xmlns="http://www.w3.org/2000/svg" width="660" height="430" viewBox="0 0 660 430" role="img" aria-label="해설: 직각 조건으로 a 결정"><rect width="660" height="430" fill="white"/><text x="22" y="33" font-size="20" font-family="Noto Sans CJK KR, sans-serif" font-weight="700" fill="#172b4d">해설: 직각 조건으로 a 결정</text><line x1="289.29" y1="60" x2="289.29" y2="350" stroke="#c1cbd7" stroke-width="1"/><line x1="48" y1="303.79" x2="612" y2="303.79" stroke="#c1cbd7" stroke-width="1"/><polygon points="452.14,100.21 207.86,100.21 330.00,222.36" fill="#e4f4fa" fill-opacity="0.8" stroke="#1a718c" stroke-width="2.3"/><circle cx="452.14" cy="100.21" r="4.8" fill="#163a60"/><text x="462.14" y="91.21" font-family="Noto Sans CJK KR, sans-serif" font-size="14" fill="#172b4d">A(4, 5)</text><circle cx="207.86" cy="100.21" r="4.8" fill="#163a60"/><text x="217.86" y="91.21" font-family="Noto Sans CJK KR, sans-serif" font-size="14" fill="#172b4d">B(-2, 5)</text><circle cx="330.00" cy="222.36" r="4.8" fill="#163a60"/><text x="340.00" y="213.36" font-family="Noto Sans CJK KR, sans-serif" font-size="14" fill="#172b4d">C(1, 2)</text><text x="25" y="374" font-family="Noto Sans CJK KR, sans-serif" font-size="15" fill="#31465f">(A-C)·(B-C) = 0 → a = 5</text><text x="25" y="396" font-family="Noto Sans CJK KR, sans-serif" font-size="15" fill="#31465f">AC² + BC² = AB² (빗변 AB)</text></svg>
