<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 384 320" width="384" height="320" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">빗변의 길이가 25 cm이고 한 직각변이 24 cm인 직각삼각형이다. 피타고라스 정리에서 x²=25²−24²=625−576=49이므로 x=7 cm이다. 따라서 답은 ①이다.</title><desc id="visual-desc">직각이 표시된 두 변에 24와 다른 한 변의 길이가 적혀 있고 빗변에 25가 적힌 직각삼각형이다.</desc><rect width="384" height="320" fill="#fff"/><g data-layer="30"><line id="AB" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="49.142857143" y1="201.666666667" x2="334.857142857" y2="201.666666667"/></g><g data-layer="30"><line id="BC" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="334.857142857" y1="201.666666667" x2="49.142857143" y2="118.333333333"/></g><g data-layer="30"><line id="CA" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="49.142857143" y1="118.333333333" x2="49.142857143" y2="201.666666667"/></g><g data-layer="60"><polyline id="r" data-role="indicator" stroke="#111" stroke-width="0.8" fill="none" points="59.142857143,201.666666667 59.142857143,191.666666667 49.142857143,191.666666667"/></g><g data-layer="70"><circle id="A" data-role="point" stroke="#111" stroke-width="0.8" fill="#111" cx="49.142857143" cy="201.666666667" r="3.2"/></g><g data-layer="70"><circle id="B" data-role="point" stroke="#111" stroke-width="0.8" fill="#111" cx="334.857142857" cy="201