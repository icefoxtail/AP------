<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 752 640" width="752" height="640" role="img" aria-labelledby="title desc"><title id="title">한 중선 위의 두 무게중심</title><desc id="desc">A에서 밑변의 중점 D로 내린 중선에 G와 G′가 있다. G는 삼각형 ABC의 무게중심이고 G′는 삼각형 GBC의 무게중심이다.</desc><rect width="752" height="640" fill="white" /><line x1="478.6000" y1="114.8000" x2="106.2000" y2="525.2000" stroke="#21639a" stroke-width="5.15" stroke-linecap="round" /><line x1="106.2000" y1="525.2000" x2="645.8000" y2="525.2000" stroke="#21639a" stroke-width="5.15" stroke-linecap="round" /><line x1="645.8000" y1="525.2000" x2="478.6000" y2="114.8000" stroke="#21639a" stroke-width="5.15" stroke-linecap="round" /><line x1="478.6000" y1="114.8000" x2="376.0000" y2="525.2000" stroke="#774698" stroke-width="4.8" stroke-linecap="round" /><line x1="106.2000" y1="525.2000" x2="410.2000" y2="388.4000" stroke="#227365" stroke-width="4.4" stroke-linecap="round" /><line x1="645.8000" y1="525.2000" x2="410.2000" y2="388.4000" stroke="#227365" stroke-width="4.4" stroke-linecap="round" /><line x1="106.2000" y1="525.2000" x2="387.4000" y2="479.6000" stroke="#a34c1f" stroke-width="4.35" stroke-linecap="round" stroke-dasharray="9 6" /><line x1="246.4960" y1="532.2000" x2="246.4960" y2="518.2000" stroke="#21639a" stroke-width="2.5" stroke-linecap="round" /><line x1="516.2960" y1="532.2000" x2="516.2960" y2="518.2000" stroke="#21639a" stroke-width="2.5" stroke-linecap="round" /><circle cx="478.6" cy="114.79999999999998" r="4.9" fill="#28364b" /><text x="478.6000" y="95.8000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">A</text><circle cx="106.19999999999999" cy="525.2" r="4.9" fill="#28364b" /><text x="89.2000" y="548.2000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">B</text><circle cx="645.8" cy="525.2" r="4.9" fill="#28364b" /><text x="662.8000" y="548.2000" font-size="2