<svg xmlns="http://www.w3.org/2000/svg" width="420" height="280" viewBox="0 0 420 280" role="img" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_1_DRAFT" data-geometry-preset="ISOSCELES_ALTITUDE" data-geometry-fact-hash="q24-BC10-area60-height12-halfbase5-AB13" data-visual-provenance="CONSTRUCTED_REALIZATION" aria-labelledby="svg-title-fd7e698997" aria-describedby="svg-desc-fd7e698997">
<title id="svg-title-fd7e698997">이등변삼각형의 넓이와 변의 길이</title><desc id="svg-desc-fd7e698997">BC=10cm, 넓이 60cm²에서 높이는 12cm이다. AB=AC이므로 높이는 BC를 이등분해 반쪽 길이는 5cm이고, 피타고라스 정리로 AB=√(12²+5²)=13cm이다.</desc><rect width="420" height="280" fill="#fff"/>
