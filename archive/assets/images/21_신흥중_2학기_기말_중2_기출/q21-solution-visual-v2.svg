<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 748 644" width="748" height="644" role="img" aria-labelledby="title desc"><title id="title">붙여 놓은 두 정사각형과 선분 BF</title><desc id="desc">B, C, E는 같은 수평선 위에 있다. 검은 작은 정사각형과 청록 큰 정사각형에 걸쳐 B부터 F까지 사선을 이었다. 두 정사각형의 한 변이 2 cm와 6 cm이므로 가로 BE는 8 cm이다. 직각삼각형 BEF만 옅게 색칠했다.</desc><rect width="748" height="644" fill="white" /><polygon points="122.0000,511.0000 626.0000,511.0000 626.0000,133.0000" fill="#e2f1eb" /><line x1="122.0000" y1="385.0000" x2="122.0000" y2="511.0000" stroke="#202020" stroke-width="4.95" stroke-linecap="round" /><line x1="122.0000" y1="511.0000" x2="248.0000" y2="511.0000" stroke="#202020" stroke-width="4.95" stroke-linecap="round" /><line x1="248.0000" y1="511.0000" x2="248.0000" y2="385.0000" stroke="#202020" stroke-width="4.95" stroke-linecap="round" /><line x1="248.0000" y1="385.0000" x2="122.0000" y2="385.0000" stroke="#202020" stroke-width="4.95" stroke-linecap="round" /><line x1="248.0000" y1="511.0000" x2="626.0000" y2="511.0000" stroke="#227365" stroke-width="4.95" stroke-linecap="round" /><line x1="626.0000" y1="511.0000" x2="626.0000" y2="133.0000" stroke="#227365" stroke-width="4.95" stroke-linecap="round" /><line x1="626.0000" y1="133.0000" x2="248.0000" y2="133.0000" stroke="#227365" stroke-width="4.95" stroke-linecap="round" /><line x1="248.0000" y1="133.0000" x2="248.0000" y2="511.0000" stroke="#227365" stroke-width="4.95" stroke-linecap="round" /><line x1="122.0000" y1="511.0000" x2="626.0000" y2="133.0000" stroke="#774698" stroke-width="5.8" stroke-linecap="round" /><line x1="603.0000" y1="511.0000" x2="603.0000" y2="488.0000" stroke="#586574" stroke-width="1.8" stroke-linecap="round" /><line x1="603.0000" y1="488.0000" x2="626.0000" y2="488.0000" stroke="#586574" stroke-width="1.8" stroke-linecap="round" /><line x1="122.0000" y1="551.0000" x2="626.0000" y2="551.0000" stroke="#202020" stroke-width="1.7" stroke-linecap="round" /><line x1="122.0000" y1="545.5000" x2="122.0000" y2="556.500