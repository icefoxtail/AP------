<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 746 440" width="746" height="440" role="img" aria-labelledby="title desc"><title id="title">집에서 학교를 거쳐 도서관으로 이어지는 길</title><desc id="desc">집과 학교를 연결하는 길 두 개는 파랑이고, 학교와 도서관을 연결하는 길 네 개는 청록이다. 학교에서만 두 구간이 이어진다.</desc><rect width="746" height="440" fill="white" /><circle cx="133" cy="190" r="7" fill="#293b4b" stroke="white" stroke-width="1.8" /><text x="133.0000" y="308.0000" font-size="35" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#293b4b" text-anchor="middle">집</text><circle cx="362" cy="190" r="7" fill="#293b4b" stroke="white" stroke-width="1.8" /><text x="362.0000" y="308.0000" font-size="35" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#293b4b" text-anchor="middle">학교</text><circle cx="608" cy="190" r="7" fill="#293b4b" stroke="white" stroke-width="1.8" /><text x="608.0000" y="308.0000" font-size="35" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#293b4b" text-anchor="middle">도서관</text><path d="M 133 190 C 205 120, 283 120, 362 190" fill="none" stroke="#21639a" stroke-width="4.95" stroke-linecap="round" /><path d="M 133 190 C 205 277, 283 277, 362 190" fill="none" stroke="#21639a" stroke-width="4.95" stroke-linecap="round" /><path d="M 362 190 C 430 51, 530 51, 608 190" fill="none" stroke="#227365" stroke-width="4.9" stroke-linecap="round" /><path d="M 362 190 C 430 139, 530 139, 608 190" fill="none" stroke="#227365" stroke-width="4.9" stroke-linecap="round" /><path d="M 362 190 C 430 246, 530 246, 608 190" fill="none" stroke="#227365" stroke-width="4.9" stroke-linecap="round" /><path d="M 362 190 C 430 335, 530 335, 608 190" fill="none" stroke="#227365" stroke-width="4.9" stroke-linecap="round" /></svg>
