<svg xmlns="http://www.w3.org/2000/svg" width="480" height="476" viewBox="0 0 480 476" role="img" aria-labelledby="visual-title visual-desc" data-composite="composite-panels-v1"><title id="visual-title">주사위의 여섯 면 중 1이 3개, 2가 2개, 3이 1개이다. 확률은 각각 3/6, 2/6, 1/6이고, 기댓값은 5/3, 제곱의 기댓값은 10/3이다. 분산은 10/3 빼기 25/9, 즉 5/9이고, 3X-9의 분산은 9 곱하기 5/9, 즉 5이다. 따라서 답은 ⑤이다.</title><desc id="visual-desc">정육면체 주사위가 비스듬히 보이고, 보이지 않는 모서리는 점선으로 표시되어 있다.</desc><g id="p1-caption" data-role="caption" data-panel="1" data-font-px="21.4"><g id="p1-p1-caption-text" transform="translate(210.46800000000002 38.5064)" data-label-kind="CAPTION" data-owner="panel-1" data-fragment-sha="sha256:b35675e1cd2ec14b4904a1b39fb076713a86cb9ec78632d3865b2fbfdd966d88"><svg xmlns="http://www.w3.org/2000/svg" width="59.06399999999999" height="30.9872" viewBox="0 0 59.06399999999999 30.9872" data-outline-width="59.06399999999999" data-outline-height="30.9872" id="lb-fa93e8b4b2ed1067891c6dc4fd0ebab3363f105af16c4bf31359c2fbba0595d6" data-owner="panel-1" data-fact-role="GIVEN"><path d="M9.43740 10.03660L9.43740 8.98800L10.05800 8.98800L10.05800 10.03660Q10.05800 11.06380 9.57650 11.95190Q9.09500 12.84000 8.29250 13.56760Q7.49000 14.29520 6.52700 14.85160Q5.56400 15.40800 4.59030 15.78250Q3.61660 16.15700 2.78200 16.34960L2.78200 16.34960L2.46100 15.75040Q3.18860 15.62200 4.10880 15.27960Q5.02900 14.93720 5.95990 14.42360Q6.89080 13.91000 7.68260 13.23590Q8.47440 12.56180 8.95590 11.75930Q9.43740 10.95680 9.43740 10.03660L9.43740 10.03660ZM9.52300 10.03660L9.52300 8.98800L10.12220 8.98800L10.12220 10.03660Q10.12220 10.95680 10.60370 11.75930Q11.08520 12.56180 11.87700 13.23590Q12.66880 13.91000 13.59970 14.42360Q14.53060 14.93720 15.45080 15.27960Q16.37100 15.62200 17.09860 15.75040L17.09860 15.75040L16.79900 16.34960Q15.96440 16.15700 14.98000 15.78250Q13.99560 15.40800 13.03260 14.85160Q12.06960 14.29520 11.27780 13.56760Q10.48600 12.84000 10.00450 11.95190Q9.52300 11.06380 9.52300 10.03660L9.52300 10.03660ZM9.43740 26.2