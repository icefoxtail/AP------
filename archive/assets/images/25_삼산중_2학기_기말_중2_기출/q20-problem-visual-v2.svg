<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 744 842" width="744" height="842" role="img" aria-labelledby="title desc"><title id="title">직각이등변삼각형 둘로 넓이를 비교하는 증명 그림</title><desc id="desc">위의 두 그림은 직각이등변삼각형 DBC와 ACE의 넓이로 사각형 DBEA를 비교한다. 아래 방법 1에는 두 삼각형의 넓이의 합 뒤에 (A) 빈칸이 있다. 방법 2에는 삼각형 ABC와 EDC의 합동 조건 (B), 큰 삼각형 DBE에서 삼각형 AED를 뺀 넓이 (C)가 빈칸으로 남아 있다.</desc><rect width="744" height="842" fill="white" /><polygon points="208.0000,100.6000 45.6000,263.0000 314.4000,263.0000" fill="#edf5fa" /><polygon points="208.0000,100.6000 45.6000,263.0000 314.4000,263.0000 208.0000,156.6000" fill="#dcefe6" /><line x1="208.0000" y1="100.6000" x2="45.6000" y2="263.0000" stroke="#205d9c" stroke-width="4.05" stroke-linecap="round" /><line x1="45.6000" y1="263.0000" x2="314.4000" y2="263.0000" stroke="#205d9c" stroke-width="4.05" stroke-linecap="round" /><line x1="314.4000" y1="263.0000" x2="208.0000" y2="100.6000" stroke="#205d9c" stroke-width="4.05" stroke-linecap="round" /><line x1="208.0000" y1="100.6000" x2="208.0000" y2="263.0000" stroke="#586574" stroke-width="4.05" stroke-linecap="round" /><line x1="45.6000" y1="263.0000" x2="208.0000" y2="156.6000" stroke="#266f73" stroke-width="4.05" stroke-linecap="round" /><line x1="208.0000" y1="156.6000" x2="314.4000" y2="263.0000" stroke="#266f73" stroke-width="4.05" stroke-linecap="round" /><line x1="195.0000" y1="263.0000" x2="195.0000" y2="250.0000" stroke="#586574" stroke-width="2.0" stroke-linecap="round" /><line x1="195.0000" y1="250.0000" x2="208.0000" y2="250.0000" stroke="#586574" stroke-width="2.0" stroke-linecap="round" /><circle cx="208" cy="100.6" r="3.7" fill="#28364b" /><text x="209.0000" y="84.6000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">D</text><circle cx="208" cy="156.60000000000002" r="3.7" fill="#28364b" /><text x="191.0000" y="148.6000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">A</text><circle cx="45.599999999999994" cy="263" r="3.7" fill="#28364b" /><text x="28.6000" y="285.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">B</text><circle cx="208" cy="263" r="3.7" fill="#28364b" /><text x="209.0000" y="287.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">C</text><circle cx="314.4" cy="263" r="3.7" fill="#28364b" /><text x="330.4000" y="285.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">E</text><polygon points="583.0000,100.6000 420.6000,263.0000 689.4000,263.0000" fill="#edf5fa" /><polygon points="583.0000,156.6000 689.4000,263.0000 583.0000,100.6000" fill="#f8ecd9" /><line x1="583.0000" y1="100.6000" x2="420.6000" y2="263.0000" stroke="#205d9c" stroke-width="4.05" stroke-linecap="round" /><line x1="420.6000" y1="263.0000" x2="689.4000" y2="263.0000" stroke="#205d9c" stroke-width="4.05" stroke-linecap="round" /><line x1="689.4000" y1="263.0000" x2="583.0000" y2="100.6000" stroke="#205d9c" stroke-width="4.05" stroke-linecap="round" /><line x1="583.0000" y1="100.6000" x2="583.0000" y2="263.0000" stroke="#586574" stroke-width="4.05" stroke-linecap="round" /><line x1="420.6000" y1="263.0000" x2="583.0000" y2="156.6000" stroke="#266f73" stroke-width="4.05" stroke-linecap="round" /><line x1="583.0000" y1="156.6000" x2="689.4000" y2="263.0000" stroke="#266f73" stroke-width="4.05" stroke-linecap="round" /><line x1="570.0000" y1="263.0000" x2="570.0000" y2="250.0000" stroke="#586574" stroke-width="2.0" stroke-linecap="round" /><line x1="570.0000" y1="250.0000" x2="583.0000" y2="250.0000" stroke="#586574" stroke-width="2.0" stroke-linecap="round" /><line x1="583.0000" y1="156.6000" x2="608.6705" y2="139.7814" stroke="#aa5411" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="8 