1="336.0000" y1="185.0000" x2="380.0000" y2="185.0000" stroke="#586574" stroke-width="2.55" stroke-linecap="round" /><polygon points="388.0000,185.0000 376.0000,179.0000 376.0000,191.0000" fill="#586574" /><rect x="17" y="339" width="347" height="486" rx="11" fill="#f7fafc" stroke="#d8e3ed" stroke-width="1.5" /><rect x="381" y="339" width="347" height="486" rx="11" fill="#f7fafc" stroke="#d8e3ed" stroke-width="1.5" /><text x="39.0000" y="394.0000" font-size="34" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#205d9c" text-anchor="start">방법 1</text><text x="404.0000" y="394.0000" font-size="34" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#266f73" text-anchor="start">방법 2</text><text x="39.0000" y="447.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="start">△DBC와 △ACE가</text><text x="39.0000" y="484.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="start">직각이등변삼각형이므로</text><text x="39.0000" y="544.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="start">사각형 DBEA의 넓이는</text><text x="39.0000" y="592.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="start">= △DBC 넓이</text><text x="39.0000" y="631.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="start">+ △ACE 넓이</text><text x="39.0000" y="696.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="start">=</text><rect x="72" y="660" width="169" height="51" rx="6" fill="white" stroke="#266f73" stroke-width="2.1" /><text x="156.5000" y="695.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#266f73" text-anchor="middle">(A)</text><text x="403.0000" y="441.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="start">△DBC와 △ACE가</text><text x="403.0000" y="478.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="start">직각이등변삼각형이므로</text><text x="403.0000" y="519.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="start">△ABC ≡ △EDC</text><text x="403.0000" y="603.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="start">따라서 DE = c이다.</text><text x="403.0000" y="640.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="start">이를 이용하여</text><text x="403.0000" y="677.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="start">사각형 DBEA의 넓이는</text><text x="403.0000" y="713.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="start">= △DBE 넓이</text><text x="403.0000" y="750.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="start">− △AED 넓이</text><text x="403.0000" y="792.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="start">=</text><text x="403.0000" y="558.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="start">(</text><text x="492.0000" y="558.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="start">합동)이다.</text><rect x="427" y="524" width="50" height="51" rx="6" fill="white" stroke="#266f73" stroke-width="2.1" /><text x="452.0000" y="559.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#266f73" text-anchor="middle">(B)</text><rect x="438" y="760" width="132" height="51" rx="6" fill="white" stroke="#266f73" stroke-width="2.1" /><text x="504.0000" y="795.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#266f73" text-anchor="middle">(C)</text></svg>
