<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" width="600" height="420" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-visual-provenance="M2_PRIORITY4_R1_20260928|25_삼산중_2학기_기말_중2_기출|q8|LANE_A|EXACT_COORD_PARITY">
<title id="title">8번 해설 도형</title><desc id="desc">직사각형 ABCD에서 접어 옮긴 점 C'과 점 E를 이용한 닮음. 좌표는 A(162.5,80), B(162.5,300), C(437.5,300), D(437.5,80), C'(327.5,80), E(437.5,162.5)로 동일 축척 변환했다.</desc><style>.main{fill:none;stroke:#111;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}.sec{fill:none;stroke:#333;stroke-width:1.55;stroke-linecap:round;stroke-linejoin:round}.dot{fill:#111}.v{font:14px system-ui,sans-serif;fill:#111}.e{font:12.5px system-ui,sans-serif;fill:#222}.note{font:12.5px system-ui,sans-serif;fill:#222}</style>
<path class="main" d="M162.5 300 L162.5 80 L437.5 80 L437.5 300 Z"/><path class="sec" d="M162.5 300 L327.5 80 M162.5 300 L437.5 162.5 M327.5 80 L437.5 162.5"/><circle class="dot" cx="327.5" cy="80" r="3"/><circle class="dot" cx="437.5" cy="162.5" r="3"/><text class="v" x="145" y="72">A</text><text class="v" x="145" y="320">B</text><text class="v" x="446" y="320">C</text><text class="v" x="446" y="72">D</text><text class="v" x="316" y="66">C'</text><text class="v" x="446" y="167">E</text><text class="e" x="120" y="195">AB=8</text><text class="e" x="275" y="322">BC=10</text><text class="e" x="446" y="126">DE=3</text><text class="note" x="78" y="374">BC'=10 → AC'=6 → C'D=4, EC'=5</text><text class="note" x="78" y="398">6:8:10 = 3:4:5 → 두 직각삼각형은 닮음</text>
</svg>
