<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 721 550" width="721" height="550" role="img" aria-labelledby="title desc"><title id="title">삼각형의 무게중심과 가로로 이어진 두 선</title><desc id="desc">M과 N은 변 AB와 AC의 중점이고 L은 BC의 가운데이다. M과 N을 이은 선은 중선 AL과 P에서 만난다. 무게중심 G를 지나며 BC와 평행한 선은 D와 E를 잇는다.</desc><rect width="721" height="550" fill="white" /><polygon points="422.8684,77.5000 85.0395,472.5000 635.9605,472.5000" fill="#edf5fb" /><line x1="422.8684" y1="77.5000" x2="85.0395" y2="472.5000" stroke="#205d9c" stroke-width="4.5" stroke-linecap="round" /><line x1="85.0395" y1="472.5000" x2="635.9605" y2="472.5000" stroke="#205d9c" stroke-width="4.5" stroke-linecap="round" /><line x1="635.9605" y1="472.5000" x2="422.8684" y2="77.5000" stroke="#205d9c" stroke-width="4.5" stroke-linecap="round" /><line x1="422.8684" y1="77.5000" x2="360.5000" y2="472.5000" stroke="#704895" stroke-width="4.05" stroke-linecap="round" /><line x1="85.0395" y1="472.5000" x2="529.4145" y2="275.0000" stroke="#704895" stroke-width="3.55" stroke-linecap="round" /><line x1="635.9605" y1="472.5000" x2="253.9539" y2="275.0000" stroke="#704895" stroke-width="3.55" stroke-linecap="round" /><line x1="253.9539" y1="275.0000" x2="529.4145" y2="275.0000" stroke="#266f73" stroke-width="4.3" stroke-linecap="round" /><line x1="197.6491" y1="340.8333" x2="564.9298" y2="340.8333" stroke="#aa5411" stroke-width="4.05" stroke-linecap="round" /><circle cx="422.86842105263156" cy="77.5" r="4.9" fill="#28364b" /><text x="423.8684" y="59.5000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">A</text><circle cx="85.03947368421052" cy="472.5" r="4.9" fill="#28364b" /><text x="68.0395" y="496.5000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">B</text><circle cx="635.9605263157895" cy="472.5" r="4.9" fill="#28364b" /><text x="652.9605" y="496.5000" font-size="29" font-family="Malgun