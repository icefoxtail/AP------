<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 726 506" width="726" height="506" role="img" aria-labelledby="title desc"><title id="title">세 평행선과 두 가로지르는 선</title><desc id="desc">가로로 평행한 세 선은 위에서 l, m, n 순이다. 왼쪽의 가로지르는 선에서 l과 m 사이가 4 cm, l과 n 사이가 12 cm이다. 오른쪽 사선에서 l과 m 사이가 6 cm이고 m과 n 사이는 x cm이다.</desc><rect width="726" height="506" fill="white" /><line x1="95.0000" y1="122.0000" x2="646.0000" y2="122.0000" stroke="#586574" stroke-width="2.4" stroke-linecap="round" /><text x="670.0000" y="132.0000" font-size="31" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#586574" text-anchor="middle">l</text><line x1="95.0000" y1="219.0000" x2="646.0000" y2="219.0000" stroke="#586574" stroke-width="2.4" stroke-linecap="round" /><text x="670.0000" y="229.0000" font-size="31" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#586574" text-anchor="middle">m</text><line x1="95.0000" y1="413.0000" x2="646.0000" y2="413.0000" stroke="#586574" stroke-width="2.4" stroke-linecap="round" /><text x="670.0000" y="423.0000" font-size="31" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#586574" text-anchor="middle">n</text><line x1="246.4021" y1="61.0000" x2="216.7423" y2="472.0000" stroke="#205d9c" stroke-width="4.65" stroke-linecap="round" /><line x1="253.2206" y1="67.0000" x2="704.7719" y2="469.0000" stroke="#266f73" stroke-width="4.65" stroke-linecap="round" /><line x1="199.0000" y1="122.0000" x2="199.0000" y2="219.0000" stroke="#205d9c" stroke-width="1.7" stroke-linecap="round" /><line x1="193.0000" y1="122.0000" x2="205.0000" y2="122.0000" stroke="#205d9c" stroke-width="1.7" stroke-linecap="round" /><line x1="193.0000" y1="219.0000" x2="205.0000" y2="219.0000" stroke="#205d9c" stroke-width="1.7" stroke-linecap="round" /><text x="146.0000" y="179.5000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#205d9c" text-anchor="middle">4 cm</text><line x1="124.0000" y1="122.0000" x2="124.0000" y2="413.0000" stroke="#205d9c" stroke-width="1.7" stroke-linecap="round" /><line x1="118.0000" y1="122.0000" x2="130.0000" y2="122.0000" stroke="#205d9c" stroke-width="1.7" stroke-linecap="round" /><line x1="118.0000" y1="413.0000" x2="130.0000" y2="413.0000" stroke="#205d9c" stroke-width="1.7" stroke-linecap="round" /><text x="71.0000" y="276.5000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#205d9c" text-anchor="middle">12 cm</text><text x="416.4782" y="164.5000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#266f73" text-anchor="middle">6 cm</text><text x="579.9128" y="310.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#266f73" text-anchor="middle">x cm</text><circle cx="242" cy="122" r="4.25" fill="#28364b" /><circle cx="235" cy="219" r="4.25" fill="#28364b" /><circle cx="221" cy="413" r="4.25" fill="#28364b" /><circle cx="315" cy="122" r="4.25" fill="#28364b" /><circle cx="423.95641330366925" cy="219" r="4.25" fill="#28364b" /><circle cx="641.8692399110079" cy="413" r="4.25" fill="#28364b" /></svg>
