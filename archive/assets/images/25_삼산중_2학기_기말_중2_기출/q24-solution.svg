<title id="title">직각삼각형과 평행선으로 만든 마름모</title><desc id="desc">BC=8, CD=6, BD=10이다. O는 BD의 중점이므로 BO=5이며 닮음 △BOF∼△BCD에서 OF/6=5/8, OF=15/4이다. 마름모의 대각선 길이 EF=15/2이므로 넓이는 75/2이다.</desc><style>.main{fill:none;stroke:#111;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}.sec{fill:none;stroke:#333;stroke-width:1.55;stroke-linecap:round;stroke-linejoin:round}.dot{fill:#111}.v{font:14px system-ui,sans-serif;fill:#111}.e{font:12.5px system-ui,sans-serif;fill:#222}.note{font:12.5px system-ui,sans-serif;fill:#222}</style>
