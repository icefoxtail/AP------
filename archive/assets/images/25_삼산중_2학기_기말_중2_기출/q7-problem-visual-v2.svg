<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 722 548" width="722" height="548" role="img" aria-labelledby="title desc"><title id="title">사다리꼴을 나누는 수직선과 세 길이</title><desc id="desc">사각형 ABCD의 위 AD와 아래 BC가 나란하다. A에서 C까지 점선은 두 가로변에 수직이다. AB는 13 cm, BC는 5 cm, CD는 15 cm이다.</desc><rect width="722" height="548" fill="white" /><polygon points="295.5000,77.5000 131.7500,470.5000 295.5000,470.5000 590.2500,77.5000" fill="none" /><line x1="295.5000" y1="77.5000" x2="131.7500" y2="470.5000" stroke="#205d9c" stroke-width="4.55" stroke-linecap="round" /><line x1="131.7500" y1="470.5000" x2="295.5000" y2="470.5000" stroke="#205d9c" stroke-width="4.55" stroke-linecap="round" /><line x1="295.5000" y1="470.5000" x2="590.2500" y2="77.5000" stroke="#205d9c" stroke-width="4.55" stroke-linecap="round" /><line x1="590.2500" y1="77.5000" x2="295.5000" y2="77.5000" stroke="#205d9c" stroke-width="4.55" stroke-linecap="round" /><line x1="295.5000" y1="77.5000" x2="295.5000" y2="470.5000" stroke="#266f73" stroke-width="3.4" stroke-linecap="round" stroke-dasharray="9 6" /><line x1="311.5000" y1="77.5000" x2="311.5000" y2="93.5000" stroke="#586574" stroke-width="1.8" stroke-linecap="round" /><line x1="311.5000" y1="93.5000" x2="295.5000" y2="93.5000" stroke="#586574" stroke-width="1.8" stroke-linecap="round" /><line x1="279.5000" y1="470.5000" x2="279.5000" y2="454.5000" stroke="#586574" stroke-width="1.8" stroke-linecap="round" /><line x1="279.5000" y1="454.5000" x2="295.5000" y2="454.5000" stroke="#586574" stroke-width="1.8" stroke-linecap="round" /><line x1="103.1346" y1="458.5769" x2="266.8846" y2="65.5769" stroke="#205d9c" stroke-width="1.7" stroke-linecap="round" /><line x1="98.0577" y1="456.4615" x2="108.2115" y2="460.6923" stroke="#205d9c" stroke-width="1.7" stroke-linecap="round" /><line x1="261.8077" y1="63.4615" x2="271.9615" y2="67.6923" stroke="#205d9c" stroke-width="1.7" stroke-linecap="round" /><text x="153.6250" y="257.0000" font-size="28" font-family="Malgun Gothic, Cambr