<title id="title">직각이등변삼각형으로 보이는 피타고라스 관계</title><desc id="desc">△DBC와 △ACE는 직각이등변삼각형이고 DE=AB=c이다. 사각형 DBEA의 넓이를 두 방법으로 나타내면 (a²+b²)/2=c²/2이므로 a²+b²=c²이다.</desc><style>.main{fill:none;stroke:#111;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}.sec{fill:none;stroke:#333;stroke-width:1.55;stroke-linecap:round;stroke-linejoin:round}.dot{fill:#111}.v{font:14px system-ui,sans-serif;fill:#111}.e{font:12.5px system-ui,sans-serif;fill:#222}.note{font:12.5px system-ui,sans-serif;fill:#222}</style>
