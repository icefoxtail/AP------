<svg xmlns="http://www.w3.org/2000/svg" width="760" height="240" viewBox="0 0 760 240" role="img" aria-labelledby="title desc">
<title id="title">이차부등식이 항상 양수인 정수 매개변수</title>
<desc id="desc">−2보다 크고 6보다 작은 정수 a는 −1, 0, 1, 2, 3, 4, 5이다.</desc>
<defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#334155"/></marker></defs>
<style>text{font:20px sans-serif;fill:#172033}.axis{stroke:#334155;stroke-width:2}.range{stroke:#2563eb;stroke-width:7;stroke-linecap:round}.open{fill:#fff;stroke:#2563eb;stroke-width:3}.closed{fill:#2563eb;stroke:#1d4ed8;stroke-width:2}.tick{stroke:#334155;stroke-width:2}</style>
<text x="28" y="36">−2 &lt; a &lt; 6, 정수 a의 합</text><line class="axis" x1="70" y1="128" x2="690" y2="128" marker-end="url(#arr)"/><line class="range" x1="120" y1="128" x2="600" y2="128"/><circle class="open" cx="120" cy="128" r="8"/><circle class="open" cx="600" cy="128" r="8"/>
<line class="tick" x1="180" y1="117" x2="180" y2="139"/><circle class="closed" cx="180" cy="128" r="5"/><text x="174" y="169">−1</text>
<line class="tick" x1="240" y1="117" x2="240" y2="139"/><circle class="closed" cx="240" cy="128" r="5"/><text x="235" y="169">0</text>
<line class="tick" x1="300" y1="117" x2="300" y2="139"/><circle class="closed" cx="300" cy="128" r="5"/><text x="295" y="169">1</text>
<line class="tick" x1="360" y1="117" x2="360" y2="139"/><circle class="closed" cx="360" cy="128" r="5"/><text x="355" y="169">2</text>
<line class="tick" x1="420" y1="117" x2="420" y2="139"/><circle class="closed" cx="420" cy="128" r="5"/><text x="415" y="169">3</text>
<line class="tick" x1="480" y1="117" x2="480" y2="139"/><circle class="closed" cx="480" cy="128" r="5"/><text x="475" y="169">4</text>
<line class="tick" x1="540" y1="117" x2="540" y2="139"/><circle class="closed" cx="540" cy="128" r="5"/><text x="535" y="169">5</text>
<text x="630" y="118">a</text><text x="610" y="205">합=14</text>
</svg>