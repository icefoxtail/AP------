<svg xmlns="http://www.w3.org/2000/svg" width="760" height="220" viewBox="0 0 760 220" role="img" aria-labelledby="title desc">
<title id="title">일곱 정수를 포함하는 절댓값 구간</title>
<desc id="desc">정수 x가 −2부터 4까지 모두 절댓값 조건을 만족하려면 a가 4보다 커야 한다.</desc>
<defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#334155"/></marker></defs>
<style>text{font:20px sans-serif;fill:#172033}.axis{stroke:#334155;stroke-width:2}.range{stroke:#2563eb;stroke-width:7;stroke-linecap:round}.closed{fill:#2563eb;stroke:#1d4ed8;stroke-width:2}.open{fill:#fff;stroke:#2563eb;stroke-width:3}.tick{stroke:#334155;stroke-width:2}</style>
<text x="28" y="35">x는 −2, −1, 0, 1, 2, 3, 4</text>
<line class="axis" x1="70" y1="115" x2="690" y2="115" marker-end="url(#arr)"/>
<line class="range" x1="114.17" y1="115" x2="605.83" y2="115"/>
<circle class="open" cx="114.17" cy="115" r="8"/><circle class="open" cx="605.83" cy="115" r="8"/>
<line class="tick" x1="163.33" y1="104" x2="163.33" y2="126"/><circle class="closed" cx="163.33" cy="115" r="5"/><text x="155" y="154">−2</text>
<line class="tick" x1="212.5" y1="104" x2="212.5" y2="126"/><circle class="closed" cx="212.5" cy="115" r="5"/><text x="205" y="154">−1</text>
<line class="tick" x1="261.67" y1="104" x2="261.67" y2="126"/><circle class="closed" cx="261.67" cy="115" r="5"/><text x="257" y="154">0</text>
<line class="tick" x1="310.83" y1="104" x2="310.83" y2="126"/><circle class="closed" cx="310.83" cy="115" r="5"/><text x="305" y="154">1</text>
<line class="tick" x1="360" y1="104" x2="360" y2="126"/><circle class="closed" cx="360" cy="115" r="5"/><text x="354" y="154">2</text>
<line class="tick" x1="409.17" y1="104" x2="409.17" y2="126"/><circle class="closed" cx="409.17" cy="115" r="5"/><text x="402" y="154">3</text>
<line class="tick" x1="458.33" y1="104" x2="458.33" y2="126"/><circle class="closed" cx="458.33" cy="115" r="5"/><text x="451" y="154">4</text>
<text x="82" y="191">−3</text><text x="595" y="191">7</text><text x="500" y="191">a=5일 때 모든 정수 포함</text>
</svg>