<svg xmlns="http://www.w3.org/2000/svg" width="760" height="250" viewBox="0 0 760 250" role="img" aria-labelledby="title desc">
<title id="title">서로 반대 방향인 두 부등식의 해</title>
<desc id="desc">계수가 양수이면 두 부등식은 각각 한쪽 반직선의 해를 갖는다. 두 해가 모두 없으려면 계수와 경계값이 모두 0이어야 한다.</desc>
<defs><marker id="left" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto"><path d="M8,0 L0,4 L8,8 Z" fill="#2563eb"/></marker><marker id="right" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2563eb"/></marker></defs>
<style>text{font:20px sans-serif;fill:#172033}.axis{stroke:#334155;stroke-width:2}.ray{stroke:#2563eb;stroke-width:6;stroke-linecap:round}.open{fill:#fff;stroke:#2563eb;stroke-width:3}.tick{stroke:#334155;stroke-width:2}</style>
<text x="28" y="35">|2a−1|x &gt; b−4</text><line class="axis" x1="70" y1="85" x2="690" y2="85"/><line class="ray" x1="360" y1="85" x2="665" y2="85" marker-end="url(#right)"/><circle class="open" cx="360" cy="85" r="8"/><line class="tick" x1="360" y1="74" x2="360" y2="96"/><text x="322" y="119">(b−4)/|2a−1|</text>
<text x="28" y="158">|2a−1|x &lt; b−4</text><line class="axis" x1="70" y1="205" x2="690" y2="205"/><line class="ray" x1="360" y1="205" x2="80" y2="205" marker-end="url(#left)"/><circle class="open" cx="360" cy="205" r="8"/><line class="tick" x1="360" y1="194" x2="360" y2="216"/><text x="478" y="240">둘 다 해가 없으면 |2a−1|=0, b−4=0</text>
</svg>