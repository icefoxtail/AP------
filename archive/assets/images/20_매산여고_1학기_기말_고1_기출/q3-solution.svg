<svg xmlns="http://www.w3.org/2000/svg" width="760" height="250" viewBox="0 0 760 250" role="img" aria-labelledby="title desc">
<title id="title">부등식 두 해의 교집합과 매개변수 범위</title>
<desc id="desc">주어진 해집합 3 이상 5 미만과 이를 만드는 매개변수 a의 범위를 수직선으로 나타낸다.</desc>
<defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#334155"/></marker></defs>
<style>text{font:20px sans-serif;fill:#172033}.axis{stroke:#334155;stroke-width:2}.range{stroke:#2563eb;stroke-width:7;stroke-linecap:round}.tick{stroke:#334155;stroke-width:2}.closed{fill:#2563eb;stroke:#1d4ed8;stroke-width:2}.open{fill:#fff;stroke:#2563eb;stroke-width:3}</style>
<text x="28" y="32">구해진 x의 범위</text><line class="axis" x1="70" y1="83" x2="685" y2="83" marker-end="url(#arr)"/><line class="range" x1="402.86" y1="83" x2="574.29" y2="83"/><line class="tick" x1="402.86" y1="72" x2="402.86" y2="94"/><line class="tick" x1="574.29" y1="72" x2="574.29" y2="94"/><circle class="closed" cx="402.86" cy="83" r="8"/><circle class="open" cx="574.29" cy="83" r="8"/><text x="395" y="118">3</text><text x="568" y="118">5</text><text x="610" y="73">x</text>
<text x="28" y="157">가능한 매개변수</text><line class="axis" x1="70" y1="206" x2="685" y2="206" marker-end="url(#arr)"/><line class="range" x1="145.71" y1="206" x2="574.29" y2="206"/><line class="tick" x1="145.71" y1="195" x2="145.71" y2="217"/><line class="tick" x1="574.29" y1="195" x2="574.29" y2="217"/><circle class="closed" cx="145.71" cy="206" r="8"/><circle class="open" cx="574.29" cy="206" r="8"/><text x="136" y="240">−2</text><text x="568" y="240">3</text><text x="610" y="196">a</text>
</svg>