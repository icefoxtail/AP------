<svg xmlns="http://www.w3.org/2000/svg" width="760" height="230" viewBox="0 0 760 230" role="img" aria-labelledby="title desc">
<title id="title">두 절댓값 부등식의 공통 정수 범위</title>
<desc id="desc">공통 범위는 −1 이상 2 미만이고, 정수해는 −1, 0, 1이다.</desc>
<defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#334155"/></marker></defs>
<style>text{font:20px sans-serif;fill:#172033}.axis{stroke:#334155;stroke-width:2}.range{stroke:#2563eb;stroke-width:7;stroke-linecap:round}.closed{fill:#2563eb;stroke:#1d4ed8;stroke-width:2}.open{fill:#fff;stroke:#2563eb;stroke-width:3}.tick{stroke:#334155;stroke-width:2}</style>
<text x="28" y="36">−1 ≤ x &lt; 2, 정수해</text><line class="axis" x1="70" y1="118" x2="690" y2="118" marker-end="url(#arr)"/><line class="range" x1="180" y1="118" x2="540" y2="118"/><circle class="closed" cx="180" cy="118" r="8"/><circle class="open" cx="540" cy="118" r="8"/>
<line class="tick" x1="180" y1="107" x2="180" y2="129"/><line class="tick" x1="300" y1="107" x2="300" y2="129"/><line class="tick" x1="420" y1="107" x2="420" y2="129"/><line class="tick" x1="540" y1="107" x2="540" y2="129"/>
<circle class="closed" cx="180" cy="118" r="5"/><circle class="closed" cx="300" cy="118" r="5"/><circle class="closed" cx="420" cy="118" r="5"/>
<text x="171" y="157">−1</text><text x="295" y="157">0</text><text x="415" y="157">1</text><text x="533" y="157">2</text><text x="600" y="210">최솟값 −1</text>
</svg>