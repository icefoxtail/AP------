<text x="182" y="352" class="label">A</text>
<circle cx="275" cy="330" r="4" class="dot"/>
<text x="273" y="353" class="label">B</text>
<circle cx="275" cy="280" r="4" class="dot"/>
<text x="285" y="272" class="label">C</text>
<circle cx="425" cy="330" r="4" class="dot"/>
<text x="435" y="352" class="label">D</text>
<circle cx="275" cy="180" r="4" class="dot"/>
