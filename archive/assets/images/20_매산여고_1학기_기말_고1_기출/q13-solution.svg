<circle cx="50" cy="430" r="4" class="dot"/>
<text x="45" y="454" class="label">F</text>
<text x="275" y="492" text-anchor="middle" class="note">점 D, E, F는 각각 AB, BC, CA의 연장선 위에 놓인다.</text>
