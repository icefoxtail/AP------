<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="540" viewBox="0 0 1100 540" role="img">
<style>text{font-family:'Malgun Gothic',sans-serif;fill:#111}.title{font-size:20px;font-weight:600}.note{font-size:15px}.label{font-size:17px}.axis{stroke:#777;stroke-width:1}.shape{stroke:#111;stroke-width:2.4;fill:none}.extend{stroke:#555;stroke-width:1.8;stroke-dasharray:7 5;fill:none}.triangle{fill:#eaf1f8;stroke:#111;stroke-width:2}.dot{fill:#111}.centroid{fill:#b42318;stroke:#fff;stroke-width:2}</style>
<text x="275" y="38" text-anchor="middle" class="title">외분점의 위치</text>
<text x="275" y="66" text-anchor="middle" class="note">AD:DB = BE:EC = CF:FA = 3:2</text>
<text x="810" y="38" text-anchor="middle" class="title">계산된 좌표와 무게중심</text>
<text x="810" y="66" text-anchor="middle" class="note">△DEF의 무게중심은 G</text>
<line x1="200" y1="330" x2="275" y2="330" class="shape"/>
<line x1="275" y1="330" x2="275" y2="280" class="shape"/>
<line x1="275" y1="280" x2="200" y2="330" class="shape"/>
