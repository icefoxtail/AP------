<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 400" width="480" height="400" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">전개식에서 a=4, b=2이므로 밑변 a−b=2, 빗변 a+b=6이다. 직각삼각형의 높이는 √(6²−2²)=4√2이며 넓이는 4√2이다.</title><desc id="visual-desc">왼쪽 아래가 직각인 삼각형이다. 아래 변은 2, 오른쪽으로 기울어진 빗변은 6, 왼쪽 높이는 피타고라스 정리로 얻은 4루트 2로 표시되어 있다.</desc><rect width="480" height="400" fill="#fff"/><g data-layer="30"><line id="sAB" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="191.128200073" y1="325.048288044" x2="288.871799927" y2="325.048288044"/></g><g data-layer="30"><line id="sAC" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="191.128200073" y1="325.048288044" x2="191.128200073" y2="48.587638946"/></g><g data-layer="30"><line id="sBC" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="288.871799927" y1="325.048288044" x2="191.128200073" y2="48.587638946"/></g><g data-layer="52"><line id="dBase-ext-from" data-role="indicator" stroke="#111" stroke-width="0.8" fill="none" data-mark="dimension" data-mark-id="dBase" data-mark-part="ext-from" x1="191.128200073" y1="329.048288044" x2="191.128200073" y2="344.548288044"/></g><g data-layer="52"><line id="dBase-ext-to" data-role="indicator" stroke="#111" stroke-width="0.8" fill="none" data-mark="dimension" data-mark-id="dBase" data-mark-part="ext-to" x1="288.871799927"