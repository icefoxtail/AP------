<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 640" width="742" height="640" role="img" aria-labelledby="title desc"><title id="title">같은 직사각형을 쌓은 두 구성</title><desc id="desc">[그림 1]에서 왼쪽 세로 직사각형 세 개와 오른쪽 가로 직사각형 두 개를 아래에서 맞추었다. 오른쪽 윗면에서 왼쪽 윗면까지 높이 차이가 15 cm이다. [그림 2]에서 가로로 놓은 세 개 위에 세로로 놓은 하나를 얹었으며 전체 높이는 16 cm이다.</desc><rect width="742" height="640" fill="white" /><rect x="57" y="393" width="63" height="147" fill="#fff" stroke="#21639a" stroke-width="4.8" /><rect x="57" y="246" width="63" height="147" fill="#fff" stroke="#21639a" stroke-width="4.8" /><rect x="57" y="99" width="63" height="147" fill="#fff" stroke="#21639a" stroke-width="4.8" /><rect x="120" y="477" width="147" height="63" fill="#fff" stroke="#21639a" stroke-width="4.8" /><rect x="120" y="414" width="147" height="63" fill="#fff" stroke="#21639a" stroke-width="4.8" /><rect x="420" y="477" width="147" height="63" fill="#fff" stroke="#21639a" stroke-width="4.8" /><rect x="420" y="414" width="147" height="63" fill="#fff" stroke="#21639a" stroke-width="4.8" /><rect x="420" y="351" width="147" height="63" fill="#fff" stroke="#21639a" stroke-width="4.8" /><rect x="462.0" y="204" width="63" height="147" fill="#fff" stroke="#21639a" stroke-width="4.8" /><line x1="120.0000" y1="99.0000" x2="303.0000" y2="99.0000" stroke="#687889" stroke-width="1.7" stroke-linecap="round" stroke-dasharray="6 5" /><line x1="265.0000" y1="414.0000" x2="303.0000" y2="414.0000" stroke="#687889" stroke-width="1.7" stroke-linecap="round" stroke-dasharray="6 5" /><line x1="567.0000" y1="540.0000" x2="616.0000" y2="540.0000" stroke="#687889" stroke-width="1.7" stroke-linecap="round" stroke-dasharray="6 5" /><line x1="525.0000" y1="204.0000" x2="616.0000" y2="204.0000" stroke="#687889" stroke-width="1.7" stroke-linecap="round" stroke-dasharray="6 5" /><line x1="303.0000" y1="99.0000" x2="303.0000" y2="414.0000" stroke="#227365" stroke-width="2.3" stroke-linecap="round" /><line x1="295.0000" y1="99.0000" x2="311.0000" y2="99.00