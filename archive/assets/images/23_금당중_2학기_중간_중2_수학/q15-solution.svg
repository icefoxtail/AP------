<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img" aria-label="삼각형의 세 중점을 이은 중점삼각형의 변 길이와 둘레">
  <g fill="none" stroke="#111" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
    <path d="M95 350 L248 125.111 L503 350 Z"/>
    <path d="M171.5 237.556 L299 350 L375.5 237.556 Z"/>
  </g>
  <g font-family="sans-serif" font-size="19" fill="#111">
    <text x="240" y="113.111">A</text>
    <text x="73" y="376">B</text>
    <text x="511" y="376">C</text>
    <text x="149.5" y="232.556">D</text>
    <text x="292" y="377">E</text>
    <text x="383.5" y="232.556">F</text>
    <text x="130" y="225">AB=8</text>
    <text x="405" y="225">AC=10</text>
    <text x="330" y="405">BC=12</text>
    <text x="190" y="294">DE=5</text>
    <text x="342" y="294">EF=4</text>
    <text x="273" y="207">FD=6</text>
    <text x="50" y="48">D,E,F는 각 변의 중점</text>
    <text x="50" y="78">DE=AC/2=5, EF=AB/2=4, FD=BC/2=6</text>
    <text x="50" y="108">둘레 = 5+4+6 = 15 cm</text>
  </g>
</svg>