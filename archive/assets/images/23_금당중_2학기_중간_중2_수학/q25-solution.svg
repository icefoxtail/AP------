<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 450" role="img" aria-label="삼각형의 세 중선과 무게중심, 중점연결선의 넓이 비">
  <g fill="none" stroke="#111" stroke-width="3" stroke-linejoin="round">
    <path d="M330 40 L70 390 L590 390 Z"/>
    <line x1="330" y1="40" x2="330" y2="390"/>
    <line x1="70" y1="390" x2="460" y2="215"/>
    <line x1="590" y1="390" x2="200" y2="215"/>
    <line x1="200" y1="215" x2="460" y2="215"/>
    <circle cx="330" cy="273.333" r="4" fill="#111"/>
    <circle cx="330" cy="215" r="4" fill="#111"/>
  </g>
  <g font-family="sans-serif" font-size="20" fill="#111">
    <text x="322" y="28">A</text><text x="50" y="416">B</text><text x="598" y="416">C</text>
    <text x="315" y="417">D</text><text x="182" y="208">F</text><text x="468" y="208">E</text>
    <text x="342" y="211">H</text><text x="342" y="276">G</text>
    <text x="55" y="55">F, E, D는 각 변의 중점</text>
    <text x="55" y="85">H는 AD의 중점, AG:GD=2:1</text>
    <text x="55" y="115">AH:HG:GD = 3:1:2</text>
    <text x="385" y="300">[ABC]=12로 두면</text>
    <text x="385" y="330">[AFE]=3, [FGE]=1</text>
    <text x="385" y="360">[GBC]=4</text>
    <text x="385" y="390">→ 3:1:4</text>
  </g>
</svg>