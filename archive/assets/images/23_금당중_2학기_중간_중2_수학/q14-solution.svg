<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img" aria-label="평행선으로 생기는 닮음에서 AD를 구하는 그림">
  <g fill="none" stroke="#111" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
    <path d="M85 350 L353.8 148.4 L505 350 Z"/>
    <line x1="174.6" y1="282.8" x2="454.6" y2="282.8"/>
    <path d="M307.6 277.8 l14 5 l-14 5"/>
    <path d="M288 345 l14 5 l-14 5"/>
  </g>
  <g font-family="sans-serif" font-size="19" fill="#111">
    <text x="345.8" y="136.4">A</text>
    <text x="63" y="376">B</text>
    <text x="513" y="376">C</text>
    <text x="151.6" y="287.8">D</text>
    <text x="462.6" y="287.8">E</text>
    <text x="190" y="190">AD=8</text>
    <text x="410" y="182">AE=6</text>
    <text x="160" y="305">DB=4</text>
    <text x="500" y="306">EC=3</text>
    <text x="48" y="48">AC=6+3=9</text>
    <text x="48" y="78">DE ∥ BC → AD/AB = AE/AC = 6/9 = 2/3</text>
    <text x="48" y="108">AD = 12×2/3 = 8</text>
  </g>
</svg>