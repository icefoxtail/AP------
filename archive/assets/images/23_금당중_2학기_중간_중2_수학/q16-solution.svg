<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 390" role="img" aria-label="중점과 평행선을 이용해 CN과 ME의 비를 나타낸 그림">
  <g fill="none" stroke="#111" stroke-width="3" stroke-linejoin="round">
    <path d="M40 320 L300 40 L520 320 Z"/>
    <line x1="300" y1="40" x2="280" y2="320"/>
    <line x1="213.333" y1="133.333" x2="520" y2="320"/>
    <line x1="126.667" y1="226.667" x2="280" y2="320"/>
    <circle cx="290" cy="180" r="4" fill="#111"/>
  </g>
  <g font-family="sans-serif" font-size="20" fill="#111">
    <text x="291" y="30">A</text><text x="22" y="345">B</text><text x="528" y="345">C</text>
    <text x="196" y="124">D</text><text x="108" y="221">E</text><text x="266" y="347">M</text><text x="298" y="177">N</text>
    <text x="58" y="72">BM=CM, AN=MN</text>
    <text x="58" y="102">ME ∥ CD, ME=4 cm</text>
    <text x="345" y="122">CN:ND = 3:1</text>
    <text x="345" y="152">ME = 1/2·CD</text>
    <text x="345" y="182">CN = 3/4·CD</text>
    <text x="345" y="212">CN:ME = 3:2</text>
    <text x="345" y="242">CN = 6 cm</text>
  </g>
</svg>