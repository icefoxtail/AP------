<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 430" role="img" aria-label="9-12-15 직각삼각형과 세 변 위 반원의 넓이 관계">
  <g fill="none" stroke="#111" stroke-width="3" stroke-linejoin="round">
    <path d="M110 330 L430 90 L610 330 Z"/>
    <path d="M420 103 L440 118 L455 98"/>
    <path d="M110 330 A200 200 0 0 1 430 90"/>
    <path d="M430 90 A150 150 0 0 1 610 330"/>
    <path d="M610 330 A250 250 0 0 0 110 330"/>
  </g>
  <g font-family="sans-serif" font-size="20" fill="#111">
    <text x="420" y="76">A</text><text x="88" y="356">B</text><text x="617" y="356">C</text>
    <text x="245" y="193">AB=12</text><text x="515" y="194">AC=9</text><text x="325" y="358">BC=15</text>
    <text x="48" y="45">12² + 9² = 15²</text>
    <text x="48" y="74">→ 두 작은 반원의 넓이 합 = 큰 반원의 넓이</text>
    <text x="48" y="103">→ 두 활꼴 공통 부분을 빼면 색칠한 두 부분 = △ABC</text>
    <text x="48" y="132">[ABC] = 1/2 × 12 × 9 = 54 cm²</text>
  </g>
</svg>