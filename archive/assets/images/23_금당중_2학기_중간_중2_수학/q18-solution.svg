<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img" aria-label="삼각형 ABC와 두 무게중심 G, G'의 정확한 높이 비">
  <g fill="none" stroke="#111" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
    <path d="M300 40 L60 350 L540 350 Z"/>
    <line x1="300" y1="40" x2="300" y2="350"/>
    <line x1="60" y1="350" x2="300" y2="246.667"/>
    <line x1="540" y1="350" x2="300" y2="246.667"/>
    <line x1="60" y1="350" x2="300" y2="315.556"/>
    <line x1="540" y1="350" x2="300" y2="315.556"/>
    <circle cx="300" cy="246.667" r="4" fill="#111"/>
    <circle cx="300" cy="315.556" r="4" fill="#111"/>
  </g>
  <g font-family="sans-serif" font-size="19" fill="#111">
    <text x="292" y="28">A</text><text x="42" y="377">B</text><text x="548" y="377">C</text><text x="290" y="377">D</text>
    <text x="312" y="251.667">G</text><text x="312" y="320.556">G'</text>
    <text x="48" y="52">D는 BC의 중점</text>
    <text x="48" y="82">G의 높이 = h/3</text>
    <text x="48" y="112">G'의 높이 = h/9</text>
    <text x="365" y="290">BD = BC/2</text>
    <text x="365" y="320">[G'BD] = [ABC]/18</text>
    <text x="365" y="350">6×18 = 108 cm²</text>
  </g>
</svg>