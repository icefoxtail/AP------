<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 420" role="img" aria-label="삼각형 ABC와 두 무게중심 G, G'의 높이 비">
  <g fill="none" stroke="#111" stroke-width="3" stroke-linejoin="round">
    <path d="M300 40 L60 350 L540 350 Z"/>
    <line x1="300" y1="40" x2="300" y2="350"/>
    <line x1="60" y1="350" x2="300" y2="250"/>
    <line x1="540" y1="350" x2="300" y2="250"/>
    <line x1="60" y1="350" x2="300" y2="316.667"/>
    <line x1="540" y1="350" x2="300" y2="316.667"/>
    <circle cx="300" cy="250" r="4" fill="#111"/>
    <circle cx="300" cy="316.667" r="4" fill="#111"/>
  </g>
  <g font-family="sans-serif" font-size="20" fill="#111">
    <text x="292" y="28">A</text><text x="42" y="377">B</text><text x="548" y="377">C</text><text x="290" y="377">D</text>
    <text x="312" y="250">G</text><text x="312" y="318">G'</text>
    <text x="62" y="70">D는 BC의 중점</text>
    <text x="62" y="100">G의 높이 = h/3</text>
    <text x="62" y="130">G'의 높이 = h/9</text>
    <text x="355" y="292">BD = BC/2</text>
    <text x="355" y="322">[G'BD] = [ABC]/18</text>
    <text x="355" y="352">6×18 = 108 cm²</text>
  </g>
</svg>