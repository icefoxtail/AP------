<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 450" role="img" aria-label="두 평행선을 이용해 EC를 구하는 닮음비 그림">
  <g fill="none" stroke="#111" stroke-width="3" stroke-linejoin="round">
    <path d="M60 390 L320 40 L560 390 Z"/>
    <line x1="171.429" y1="240.000" x2="457.143" y2="240.000"/>
    <line x1="171.429" y1="240.000" x2="398.367" y2="154.286"/>
    <line x1="60" y1="390" x2="457.143" y2="240.000"/>
  </g>
  <g font-family="sans-serif" font-size="20" fill="#111">
    <text x="310" y="28">A</text><text x="40" y="415">B</text><text x="568" y="415">C</text>
    <text x="146.429" y="265.000">D</text>
    <text x="408.367" y="149.286">F</text>
    <text x="467.143" y="260.000">E</text>
    <text x="420" y="95">AF=8</text><text x="475" y="190">FE=6</text>
    <text x="70" y="65">AE=14</text>
    <text x="70" y="95">DF ∥ BE → AD:AB = AF:AE = 4:7</text>
    <text x="70" y="125">DE ∥ BC → AE:AC = 4:7</text>
    <text x="70" y="155">AC = 14×7/4 = 49/2</text>
    <text x="70" y="185">EC = 49/2 - 14 = 21/2 cm</text>
  </g>
</svg>