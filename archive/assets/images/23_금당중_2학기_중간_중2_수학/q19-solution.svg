<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img" aria-label="두 무게중심 G와 G'의 중선 위 분할비로 AD를 구하는 그림">
  <g fill="none" stroke="#111" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
    <path d="M320 81 L165 360 L475 360 Z"/>
    <line x1="320" y1="81" x2="320" y2="360"/>
    <line x1="165" y1="360" x2="320" y2="267"/>
    <line x1="475" y1="360" x2="320" y2="267"/>
    <line x1="165" y1="360" x2="320" y2="329"/>
    <line x1="475" y1="360" x2="320" y2="329"/>
    <circle cx="320" cy="267" r="4" fill="#111"/>
    <circle cx="320" cy="329" r="4" fill="#111"/>
  </g>
  <g font-family="sans-serif" font-size="19" fill="#111">
    <text x="312" y="69">A</text>
    <text x="141" y="385">B</text>
    <text x="483" y="385">C</text>
    <text x="312" y="387">D</text>
    <text x="332" y="272">G</text>
    <text x="332" y="334">G'</text>
    <text x="340" y="280">GG'=4</text>
    <text x="50" y="48">AG:GD = 2:1 → GD = AD/3</text>
    <text x="50" y="78">△GBC의 무게중심 G' → G'D = GD/3 = AD/9</text>
    <text x="50" y="108">GG' = GD−G'D = 2AD/9 = 4</text>
    <text x="50" y="138">AD = 18 cm</text>
  </g>
</svg>