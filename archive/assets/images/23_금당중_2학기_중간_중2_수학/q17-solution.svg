<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img" aria-label="세 평행선과 두 닮은 삼각형의 비로 EF를 구하는 그림">
  <g fill="none" stroke="#111" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
    <line x1="100" y1="138.5" x2="100" y2="380"/>
    <line x1="468" y1="58" x2="468" y2="380"/>
    <line x1="100" y1="138.5" x2="468" y2="380"/>
    <line x1="100" y1="380" x2="468" y2="58"/>
    <line x1="100" y1="380" x2="468" y2="380"/>
    <line x1="257.714" y1="242" x2="257.714" y2="380"/>
  </g>
  <g font-family="sans-serif" font-size="19" fill="#111">
    <text x="92" y="126.5">A</text>
    <text x="78" y="405">B</text>
    <text x="476" y="405">C</text>
    <text x="461" y="46">D</text>
    <text x="265.714" y="236">E</text>
    <text x="249.714" y="405">F</text>
    <text x="55" y="245">AB=21</text>
    <text x="490" y="228">DC=28</text>
    <text x="267.714" y="311">EF=12</text>
    <text x="50" y="48">AB ∥ EF ∥ DC</text>
    <text x="50" y="78">△ABE ∽ △CDE → BE:ED = 21:28 = 3:4</text>
    <text x="50" y="108">BE:BD = 3:7</text>
    <text x="50" y="138">△BEF ∽ △BDC → EF/DC = 3/7</text>
    <text x="50" y="168">EF = 28×3/7 = 12 cm</text>
  </g>
</svg>