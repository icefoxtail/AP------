<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img" aria-label="3-4-5 직각삼각형에서 빗변에 내린 높이 AH를 넓이로 구하는 그림">
  <g fill="none" stroke="#111" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
    <path d="M156 330 L300 138 L556 330 Z"/>
    <line x1="300" y1="138" x2="300" y2="330"/>
    <path d="M292.8 147.6 L302.4 154.8 L309.6 145.2"/>
    <path d="M300 318 L288 318 L288 330"/>
  </g>
  <g font-family="sans-serif" font-size="19" fill="#111">
    <text x="290" y="126">A</text>
    <text x="132" y="356">B</text>
    <text x="564" y="356">C</text>
    <text x="291" y="357">H</text>
    <text x="170" y="232">AB=3</text>
    <text x="405" y="232">AC=4</text>
    <text x="420" y="355">BC=5</text>
    <text x="312" y="255">AH=12/5</text>
    <text x="48" y="52">3²+4²=5²</text>
    <text x="48" y="82">½×3×4 = ½×5×AH</text>
    <text x="48" y="112">AH = 12/5 cm</text>
  </g>
</svg>