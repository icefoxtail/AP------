<svg xmlns="http://www.w3.org/2000/svg" width="930" height="375" viewBox="0 0 930 375"><rect width="930" height="375" fill="white"/><text x="36" y="42" fill="#222" font-size="25" font-family="NanumGothic" font-weight="bold">q10 풀이 · 2 - √2 가리키기</text><text x="36" y="70" fill="#666" font-size="15" font-family="NanumGothic">정사각형 대각선: √(1² + 1²) = √2</text><line x1="80.0" y1="200.0" x2="820.0" y2="200.0" stroke="#444" stroke-width="2" /><line x1="130.0" y1="193.0" x2="130.0" y2="207.0" stroke="#222" stroke-width="3" /><text x="130" y="235" text-anchor="middle" font-family="NanumGothic" font-size="20" fill="#222">-2</text><line x1="280.0" y1="193.0" x2="280.0" y2="207.0" stroke="#222" stroke-width="3" /><text x="280" y="235" text-anchor="middle" font-family="NanumGothic" font-size="20" fill="#222">-1</text><line x1="430.0" y1="193.0" x2="430.0" y2="207.0" stroke="#222" stroke-width="3" /><text x="430" y="235" text-anchor="middle" font-family="NanumGothic" font-size="20" fill="#222">0</text><line x1="580.0" y1="193.0" x2="580.0" y2="207.0" stroke="#222" stroke-width="3" /><text x="580" y="235" text-anchor="middle" font-family="NanumGothic" font-size="20" fill="#222">1</text><line x1="730.0" y1="193.0" x2="730.0" y2="207.0" stroke="#222" stroke-width="3" /><text x="730" y="235" text-anchor="middle" font-family="NanumGothic" font-size="20" fill="#222">2</text><line x1="517.9" y1="146.0" x2="517.9" y2="209.0" stroke="#cc3333" stroke-width="4" /><circle cx="517.8679656440357" cy="200" r="8" fill="#ce3333"/><text x="517.8679656440357" y="122" text-anchor="middle" font-family="NanumGothic" font-size="22" fill="#b52f2f">㉤ (2 - √2)</text><text x="475" y="296" text-anchor="middle" font-family="NanumGothic" font-size="24" fill="#222">2 에서 왼쪽으로 √2 이동</text><text x="475" y="337" text-anchor="middle" font-family="NanumGothic" font-size="20" fill="#1555a5">0 &lt; 2 - √2 &lt; 1</text></svg>