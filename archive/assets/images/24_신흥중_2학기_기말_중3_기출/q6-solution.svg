<svg xmlns="http://www.w3.org/2000/svg" width="440" height="320" viewBox="0 0 440 320">
  <rect width="440" height="320" fill="white"/>
  <style>
    .g{fill:none;stroke:#111;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
    .aux{fill:none;stroke:#777;stroke-width:1.5;stroke-dasharray:5 5}
    .t{font-family:Arial,'Noto Sans KR',sans-serif;font-size:16px;fill:#111}
    .s{font-family:Arial,'Noto Sans KR',sans-serif;font-size:14px;fill:#444}
    .em{font-family:Arial,'Noto Sans KR',sans-serif;font-size:15px;font-weight:700;fill:#111}
  </style>
  <!-- Exact geometry: O=(220,160), r=110; P=-90°, A=170°, B=90°, C=-30°. -->
  <!-- Thus minor arc AB=80° and minor arc BC=120°, so ∠APB=40°, ∠BPC=60°. -->
  <circle class="g" cx="220" cy="160" r="110"/>
  <line class="g" x1="220" y1="50" x2="111.67" y2="179.10"/>
  <line class="g" x1="220" y1="50" x2="220" y2="270"/>
  <line class="g" x1="220" y1="50" x2="315.26" y2="105"/>
  <line class="aux" x1="220" y1="160" x2="111.67" y2="179.10"/>
  <line class="aux" x1="220" y1="160" x2="220" y2="270"/>
  <line class="aux" x1="220" y1="160" x2="315.26" y2="105"/>
  <circle cx="220" cy="160" r="3.2" fill="#111"/>
  <text class="t" x="211" y="42">P</text>
  <text class="t" x="94" y="186">A</text>
  <text class="t" x="212" y="290">B</text>
  <text class="t" x="322" y="106">C</text>
  <text class="t" x="229" y="158">O</text>
  <path class="g" d="M204 67 A24 24 0 0 1 220 74"/>
  <path class="g" d="M220 78 A28 28 0 0 1 244 64"/>
  <text class="em" x="183" y="92">40°</text>
  <text class="em" x="244" y="88">60°</text>
  <text class="s" x="78" y="252">호 80° → 10 cm</text>
  <text class="s" x="282" y="238">호 120° → 15 cm</text>
  <text class="s" x="125" y="310">같은 원에서 호의 길이 ∝ 중심각</text>
</svg>
