<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 320" width="440" height="320" role="img" aria-label="지름 AB 16, 각 A 30도, 접선으로 BD가 8이 되어 AD가 24"><style>.g{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.aux{fill:none;stroke:currentColor;stroke-width:1.5;stroke-dasharray:6 5}.hi{fill:none;stroke:currentColor;stroke-width:3}.dot{fill:currentColor}.shade{fill:currentColor;fill-opacity:.08;stroke:none}.txt{font:16px sans-serif;fill:currentColor}.small{font:14px sans-serif;fill:currentColor}.num{font:15px sans-serif;fill:currentColor;font-weight:600}</style><circle class="g" cx="180" cy="170" r="80"/><line class="g" x1="100.00" y1="170.00" x2="340.00" y2="170.00"/><line class="g" x1="100.00" y1="170.00" x2="220.00" y2="100.72"/><line class="g" x1="260.00" y1="170.00" x2="220.00" y2="100.72"/><line class="g" x1="220.00" y1="100.72" x2="340.00" y2="170.00"/><circle class="dot" cx="100.00" cy="170.00" r="4"/><text class="txt" x="88.00" y="176.00" text-anchor="middle">A</text><circle class="dot" cx="260.00" cy="170.00" r="4"/><text class="txt" x="260.00" y="192.00" text-anchor="middle">B</text><circle class="dot" cx="220.00" cy="100.72" r="4"/><text class="txt" x="220.00" y="88.72" text-anchor="middle">C</text><circle class="dot" cx="340.00" cy="170.00" r="4"/><text class="txt" x="352.00" y="176.00" text-anchor="middle">D</text><circle class="dot" cx="180.00" cy="170.00" r="4"/><text class="txt" x="180.00" y="192.00" text-anchor="middle">O</text><text class="num" x="135.00" y="154.00" text-anchor="middle">30°</text><text class="small" x="220.00" y="192.00" text-anchor="middle">16 cm</text><text class="small" x="300.00" y="193.00" text-anchor="middle">8 cm</text><text class="num" x="220.00" y="305.00" text-anchor="middle">AD = 16 + 8 = 24 cm</text></svg>