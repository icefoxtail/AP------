<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 384 320" width="384" height="320" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">삼각형의 세 중선은 삼각형을 넓이가 같은 6개로 나누므로 △GDC=(1/6)×84=14cm²이다(연한 색). E가 GC의 중점이므로 △GDC에서 꼭짓점 D를 공유하고 밑변 GE, EC가 같은 △GDE와 △EDC의 넓이가 같다. 따라서 △EDC=(1/2)×14=7cm²(진한 색)이고 답은 ③이다.</title><desc id="visual-desc">삼각형 ABC의 중선 AD 위에 무게중심 G가 있고 GC의 중점 E에서 D로 선분이 그어져 있다. 삼각형 GDC는 연하게, 그 절반인 삼각형 EDC는 진하게 칠해져 있고 넓이 14와 7이 적혀 있다.</desc><rect width="384" height="320" fill="#fff"/><g data-layer="10"><path id="rg0" data-role="region" stroke="none" stroke-width="1.6" fill="#e4e7ec" data-owner-points="C D G" data-mark="region" data-mark-id="rg0" fill-rule="evenodd" d="M168.19047619 195.714285714 L192 267.142857143 L334.857142857 267.142857143 L168.19047619 195.714285714 Z"/></g><g data-layer="10"><path id="rg1" data-role="region" stroke="none" stroke-width="1.6" fill="#e4e7ec" data-owner-points="C D E" data-mark="region" data-mark-id="rg1" fill-rule="evenodd" d="M251.523809524 231.428571429 L192 267.142857143 L334.857142857 267.142857143 L251.523809524 231.428571429 Z"/></g><g data-layer="30"><line id="AB" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="120.571428571" y1="52.857142857" x2="49.142857143" y2="267.142857143"/></g><g data-layer="30"><line id="BD" data-role="line" stroke="#111" stroke-width="1.6" fill="n