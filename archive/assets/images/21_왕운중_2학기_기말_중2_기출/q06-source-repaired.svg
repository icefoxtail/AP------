<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc">
  <title id="title">2021 왕운중학교 2학기 기말고사 6번 도형</title>
  <desc id="desc">각 A가 직각인 삼각형 ABC. 점 D는 빗변 BC 위에 있고 AD는 BC에 수직이다. AB의 길이는 20, BD의 길이는 16이며 AD, AC, DC에는 각각 x, y, z가 표시되어 있다.</desc>
  <rect width="480" height="360" fill="#ffffff"/>
  <g fill="none" stroke="#202124" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M80 270 L240 150 L330 270 L80 270"/>
    <path d="M240 150 L240 270"/>
    <path d="M225.6 160.8 L236.4 175.2 L250.8 164.4" stroke-width="1.8"/>
    <path d="M228 270 L228 258 L240 258" stroke-width="1.8"/>
    <path d="M70 262 Q142 156 233 140" stroke="#5f6368" stroke-width="1.3" stroke-dasharray="4 5"/>
    <path d="M80 281 Q158 294 240 281" stroke="#5f6368" stroke-width="1.3" stroke-dasharray="4 5"/>
  </g>
  <g fill="#202124" font-family="Arial, Noto Sans KR, sans-serif" font-size="20" text-anchor="middle">
    <text x="240" y="126">A</text>
    <text x="64" y="290">B</text>
    <text x="344" y="290">C</text>
    <text x="240" y="292">D</text>
    <text x="158" y="188">20</text>
    <text x="160" y="316">16</text>
    <text x="226" y="220">x</text>
    <text x="294" y="211">y</text>
    <text x="288" y="294">z</text>
  </g>
</svg>
