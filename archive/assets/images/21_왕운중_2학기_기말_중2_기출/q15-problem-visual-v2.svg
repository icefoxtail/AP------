<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 748 683" width="748" height="683" role="img" aria-labelledby="title desc"><title id="title">직각삼각형의 세 변에 붙인 세 반원</title><desc id="desc">A와 B는 아래 수평선에 있고 C가 위의 직각 꼭짓점이다. AB 바깥 반원은 S₁, BC 바깥 반원은 S₂, CA 바깥 반원은 S₃이다.</desc><rect width="748" height="683" fill="white" /><path d="M 126.5 350.0 A 200.0 200.0 0 0 1 446.5 110.00000000000003 Z" fill="none" stroke="#227365" stroke-width="4.65" /><text x="232.5000" y="170.0000" font-size="37" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#227365" text-anchor="middle">S₃</text><path d="M 446.5 110.00000000000003 A 150.0 150.0 0 0 1 626.5 350.0 Z" fill="none" stroke="#a34c1f" stroke-width="4.65" /><text x="590.5000" y="201.5000" font-size="37" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#a34c1f" text-anchor="middle">S₂</text><path d="M 626.5 350.0 A 250.0 250.0 0 0 1 126.5 350.0 Z" fill="none" stroke="#774698" stroke-width="4.65" /><text x="376.5000" y="474.5000" font-size="37" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#774698" text-anchor="middle">S₁</text><line x1="428.1000" y1="123.8000" x2="441.9000" y2="142.2000" stroke="#586574" stroke-width="1.8" stroke-linecap="round" /><line x1="441.9000" y1="142.2000" x2="460.3000" y2="128.4000" stroke="#586574" stroke-width="1.8" stroke-linecap="round" /><circle cx="126.5" cy="350.0" r="4.9" fill="#28364b" /><text x="107.5000" y="365.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">A</text><circle cx="626.5" cy="350.0" r="4.9" fill="#28364b" /><text x="645.5000" y="365.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">B</text><circle cx="446.5" cy="110.00000000000003" r="4.9" fill="#28364b" /><text x="448.5000" y="89.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">C</text></svg>
