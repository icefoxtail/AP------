<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 668" width="740" height="668" role="img" aria-labelledby="title desc"><title id="title">같은 폭으로 넓어지는 동심원 과녁</title><desc id="desc">중심 O에서 오른쪽으로 P, Q, R이 놓인다. OP, PQ, QR에는 같은 눈금을 붙였다. 안에서부터 영역은 (가), (나), (다)이다.</desc><rect width="740" height="668" fill="white" /><circle cx="362" cy="327" r="249" stroke="#774698" stroke-width="5.2" fill="none" /><circle cx="362" cy="327" r="166" stroke="#687889" stroke-width="5.2" fill="white" /><circle cx="362" cy="327" r="83" stroke="#227365" stroke-width="5.2" fill="none" /><circle cx="362" cy="327" r="6.5" fill="#293b4b" stroke="white" stroke-width="1.7" /><text x="362.0000" y="365.0000" font-size="36" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#293b4b" text-anchor="middle">O</text><line x1="362.0000" y1="327.0000" x2="445.0000" y2="327.0000" stroke="#202020" stroke-width="4.6" stroke-linecap="round" /><circle cx="445" cy="327" r="6.5" fill="#293b4b" stroke="white" stroke-width="1.7" /><text x="445.0000" y="365.0000" font-size="36" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#293b4b" text-anchor="middle">P</text><line x1="445.0000" y1="327.0000" x2="528.0000" y2="327.0000" stroke="#202020" stroke-width="4.6" stroke-linecap="round" /><circle cx="528" cy="327" r="6.5" fill="#293b4b" stroke="white" stroke-width="1.7" /><text x="528.0000" y="365.0000" font-size="36" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#293b4b" text-anchor="middle">Q</text><line x1="528.0000" y1="327.0000" x2="611.0000" y2="327.0000" stroke="#202020" stroke-width="4.6" stroke-linecap="round" /><circle cx="611" cy="327" r="6.5" fill="#293b4b" stroke="white" stroke-width="1.7" /><text x="611.0000" y="365.0000" font-size="36" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#293b4b" text-anchor="middle">R</text><line x1="403.5000" y1="318.0000" x2="403.5000" y2="336.0000" stroke="#202020" stroke-width="3.6" stroke-linecap="round" /><line x1="486.5000" y1="318.0000" x2="486.5000" y2="336.0000" stroke="#202020" stroke-width="3.6" stroke-linecap="round" /><line x1="569.5000" y1="318.0000" x2="569.5000" y2="336.0000" stroke="#202020" stroke-width="3.6" stroke-linecap="round" /><text x="362.0000" y="281.3500" font-size="35" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#227365" text-anchor="middle">(가)</text><text x="362.0000" y="198.3500" font-size="35" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#687889" text-anchor="middle">(나)</text><text x="362.0000" y="115.3500" font-size="35" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#774698" text-anchor="middle">(다)</text></svg>
