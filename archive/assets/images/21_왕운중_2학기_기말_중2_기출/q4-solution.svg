<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 384 320" width="384" height="320" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">각 단은 등변사다리꼴이고 양쪽 옆선이 곧으므로 같은 높이만큼 올라갈 때마다 평행한 변의 길이가 같은 양만큼 줄어든다. 가장 아래 72와 가장 위 48의 차 24를 같은 높이의 두 구간으로 나누면 한 구간마다 12씩 줄어든다. 따라서 가운데 변의 길이는 72−12=60이다. 따라서 답은 ③이다.</title><desc id="visual-desc">아래로 갈수록 넓어지는 세 단의 사다리꼴이 포개진 뜀틀 앞면이 있고, 세 단의 가로 변에 72, 60, 48이 적혀 있다.</desc><rect width="384" height="320" fill="#fff"/><g data-layer="30"><line id="AB" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="49.142857143" y1="207.619047619" x2="334.857142857" y2="207.619047619"/></g><g data-layer="30"><line id="BC" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="334.857142857" y1="207.619047619" x2="287.238095238" y2="112.380952381"/></g><g data-layer="30"><line id="CD" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="287.238095238" y1="112.380952381" x2="96.761904762" y2="112.380952381"/></g><g data-layer="30"><line id="DA" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="96.761904762" y1="112.380952381" x2="49.142857143" y2="207.619047619"/></g><g data-layer="30"><line id="EF" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="72.952380952" y1="160" x2="311.047619048" y2="160"/></g><g data-layer="30"><line id="AE" data-role="line" strok