<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 682 569" width="682" height="569" role="img" aria-labelledby="title desc"><title id="title">직사각형 안의 이웃하는 네 영역</title><desc id="desc">왼쪽 위에 A, 그 아래 B, 오른쪽 위에 D, 전체 아랫줄에 C를 두었다. 경계선을 공유하는 영역을 읽을 수 있다.</desc><rect width="682" height="569" fill="white" /><rect x="160" y="52" width="183" height="159" fill="#f1f6fa" /><text x="251.5000" y="147.5000" font-size="44" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#273846" text-anchor="middle">A</text><rect x="160" y="211" width="183" height="111" fill="#f1f6fa" /><text x="251.5000" y="282.5000" font-size="44" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#273846" text-anchor="middle">B</text><rect x="343" y="52" width="183" height="270" fill="#f1f6fa" /><text x="434.5000" y="203.0000" font-size="44" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#273846" text-anchor="middle">D</text><rect x="160" y="322" width="366" height="187" fill="#f1f6fa" /><text x="343.0000" y="431.5000" font-size="44" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#273846" text-anchor="middle">C</text><line x1="160.0000" y1="52.0000" x2="526.0000" y2="52.0000" stroke="#21639a" stroke-width="5.1" stroke-linecap="round" /><line x1="526.0000" y1="52.0000" x2="526.0000" y2="509.0000" stroke="#21639a" stroke-width="5.1" stroke-linecap="round" /><line x1="526.0000" y1="509.0000" x2="160.0000" y2="509.0000" stroke="#21639a" stroke-width="5.1" stroke-linecap="round" /><line x1="160.0000" y1="509.0000" x2="160.0000" y2="52.0000" stroke="#21639a" stroke-width="5.1" stroke-linecap="round" /><line x1="160.0000" y1="322.0000" x2="526.0000" y2="322.0000" stroke="#21639a" stroke-width="5.1" stroke-linecap="round" /><line x1="343.0000" y1="52.0000" x2="343.0000" y2="322.0000" stroke="#21639a" stroke-width="5.1" stroke-linecap="round" /><line x1="160.0000" y1="211.0000" x2="343.0000" y2="211.0000" stroke="#21639a" stroke-width="5.1" stroke-linecap="round" /></svg>
