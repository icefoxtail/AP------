<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 571" width="742" height="571" role="img" aria-labelledby="title desc"><title id="title">세 반원이 만드는 두 초승달</title><desc id="desc">직각삼각형 ABC에서 AB가 20 cm이고 BC가 25 cm이다. 두 작은 반원에서 BC가 지름인 반원 바깥에 남긴 두 초승달에 색이 칠해져 있다. AC에는 계산한 15 cm를 표시했다.</desc><rect width="742" height="571" fill="white" /><path d="M 106 426 A 212.0 212.0 0 0 1 445.2 171.6 A 265.0 265.0 0 0 0 106 426 Z" fill="#a2d5c0" /><path d="M 445.2 171.6 A 159.0 159.0 0 0 1 636 426 A 265.0 265.0 0 0 0 445.2 171.6 Z" fill="#f4cdaa" /><path d="M 106 426 A 212.0 212.0 0 0 1 445.2 171.6" fill="none" stroke="#227365" stroke-width="5.0" /><path d="M 445.2 171.6 A 159.0 159.0 0 0 1 636 426" fill="none" stroke="#a34c1f" stroke-width="5.0" /><path d="M 106 426 A 265.0 265.0 0 0 1 636 426" fill="none" stroke="#21639a" stroke-width="5.0" /><line x1="106.0000" y1="426.0000" x2="445.2000" y2="171.6000" stroke="#227365" stroke-width="4.25" stroke-linecap="round" /><line x1="445.2000" y1="171.6000" x2="636.0000" y2="426.0000" stroke="#a34c1f" stroke-width="4.25" stroke-linecap="round" /><line x1="106.0000" y1="426.0000" x2="636.0000" y2="426.0000" stroke="#21639a" stroke-width="4.25" stroke-linecap="round" /><line x1="423.6000" y1="187.8000" x2="439.8000" y2="209.4000" stroke="#687889" stroke-width="2.5" stroke-linecap="round" /><line x1="439.8000" y1="209.4000" x2="461.4000" y2="193.2000" stroke="#687889" stroke-width="2.5" stroke-linecap="round" /><text x="269.0000" y="368.0000" font-size="32" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#227365" text-anchor="middle">20 cm</text><text x="377.0000" y="476.0000" font-size="32" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#21639a" text-anchor="middle">25 cm</text><text x="507.0000" y="339.0000" font-size="32" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#a34c1f" text-anchor="middle">15 cm</text><text x="453.2000" y="149.6000" font-size="34" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#273846" text-anchor="middle">A</text><text x="81.0000" y="445.0000" font-size="34" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#273846" text-anchor="middle">B</text><text x="658.0000" y="447.0000" font-size="34" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#273846" text-anchor="middle">C</text></svg>
