<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 675 457" width="675" height="457" role="img" aria-labelledby="title desc"><title id="title">교실 평면도를 직사각형으로 해석하기</title><desc id="desc">책상과 문이 있던 직사각형을 같은 크기인 넓이 모형으로 나타냈다. 가로 5a와 2의 경계를 기준으로 네 부분 넓이를 본다.</desc><rect width="675" height="457" fill="white" /><rect x="124" y="93" width="320" height="128" fill="#e1edf9" stroke="#205d9c" stroke-width="2.7" /><text x="284.0000" y="166.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#205d9c" text-anchor="middle">10a²</text><rect x="444" y="93" width="80" height="128" fill="#fae6cf" stroke="#aa5411" stroke-width="2.7" /><text x="484.0000" y="166.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#aa5411" text-anchor="middle">4a</text><rect x="124" y="221" width="320" height="120" fill="#fae6cf" stroke="#aa5411" stroke-width="2.7" /><text x="284.0000" y="290.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#aa5411" text-anchor="middle">15a</text><rect x="444" y="221" width="80" height="120" fill="#e5f2e4" stroke="#277339" stroke-width="2.7" /><text x="484.0000" y="290.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#277339" text-anchor="middle">6</text><text x="284.0000" y="71.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#205d9c" text-anchor="middle">5a</text><text x="484.0000" y="71.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#aa5411" text-anchor="middle">2</text><text x="88.0000" y="166.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#205d9c" text-anchor="middle">2a</text><text x="88.0000" y="290.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#277339" text-anchor="middle">3</text></svg>
