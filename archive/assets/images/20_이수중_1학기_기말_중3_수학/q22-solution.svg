<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 443" width="700" height="443" role="img" aria-labelledby="title desc"><title id="title">큰 정사각형과 작은 정사각형의 넓이 차</title><desc id="desc">큰 정사각형에서 안쪽 작은 정사각형을 뺀 나머지를 파란 긴 조각과 주황 작은 조각으로 표시했다. 두 조각을 오른쪽에서 한 줄로 이었다.</desc><rect width="700" height="443" fill="white" /><rect x="78" y="100" width="202.5" height="202.5" fill="none" stroke="#205d9c" stroke-width="3" /><rect x="78" y="100" width="157.5" height="157.5" fill="#eef2f7" stroke="#4e6075" stroke-width="2" /><rect x="235.5" y="100" width="45" height="157.5" fill="#fae6cf" stroke="#aa5411" stroke-width="2.6" /><rect x="78" y="257.5" width="202.5" height="45" fill="#e1edf9" stroke="#205d9c" stroke-width="2.6" /><text x="156.7500" y="178.7500" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#4e6075" text-anchor="middle">3.5</text><text x="179.2500" y="348.5000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#205d9c" text-anchor="middle">4.5</text><rect x="326" y="184" width="202.5" height="45" fill="#e1edf9" stroke="#205d9c" stroke-width="2.6" /><rect x="528.5" y="184" width="157.5" height="45" fill="#fae6cf" stroke="#aa5411" stroke-width="2.6" /><text x="427.2500" y="274.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#205d9c" text-anchor="middle">4.5</text><text x="607.2500" y="274.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#aa5411" text-anchor="middle">3.5</text><text x="427.2500" y="167.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#4e6075" text-anchor="middle">높이 1</text></svg>
