<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" width="720" height="440" role="img" aria-labelledby="title desc"><title id="title">두 직사각형의 넓이를 부분 넓이로 나누기</title><desc id="desc">왼쪽 x와 x+3의 직사각형을 두 조각으로, 오른쪽 x+1과 x+2의 직사각형을 네 조각으로 나누어 같은 차수의 넓이를 비교한다.</desc><rect width="720" height="440" fill="white" /><rect x="69" y="139" width="92" height="92" fill="#e1edf9" stroke="#205d9c" stroke-width="2.7" /><text x="115.0000" y="194.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#205d9c" text-anchor="middle">x²</text><rect x="161" y="139" width="138" height="92" fill="#fae6cf" stroke="#aa5411" stroke-width="2.7" /><text x="230.0000" y="194.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#aa5411" text-anchor="middle">3x</text><rect x="448" y="139" width="92" height="92" fill="#e1edf9" stroke="#205d9c" stroke-width="2.7" /><text x="494.0000" y="194.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#205d9c" text-anchor="middle">x²</text><rect x="540" y="139" width="92" height="92" fill="#fae6cf" stroke="#aa5411" stroke-width="2.7" /><text x="586.0000" y="194.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#aa5411" text-anchor="middle">2x</text><rect x="448" y="231" width="92" height="46" fill="#fae6cf" stroke="#aa5411" stroke-width="2.7" /><text x="494.0000" y="263.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#aa5411" text-anchor="middle">x</text><rect x="540" y="231" width="92" height="46" fill="#e5f2e4" stroke="#277339" stroke-width="2.7" /><text x="586.0000" y="263.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#277339" text-anchor="middle">2</text><text x="184.0000" y="110.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#4e6075" text-anchor="middle">x(x + 3)</text><text x="540.0000" y="110.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#4e6075" text-anchor="middle">(x + 1)(x + 2)</text><text x="362.0000" y="194.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#4e6075" text-anchor="middle">+</text></svg>
