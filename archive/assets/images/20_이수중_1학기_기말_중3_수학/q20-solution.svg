<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 670 245" width="670" height="245" role="img" aria-labelledby="title desc"><title id="title">두 정수 사이에 놓이는 2√3</title><desc id="desc">3과 4 사이 주황 점은 2√3을 나타낸다. 세 수의 제곱을 비교하면 그 점이 어느 위치에 놓이는지 알 수 있다.</desc><rect width="670" height="245" fill="white" /><line x1="46.0000" y1="122.0000" x2="625.0000" y2="122.0000" stroke="#4e6075" stroke-width="2.15" stroke-linecap="round" /><polygon points="635.0000,122.0000 623.0000,117.0000 623.0000,127.0000" fill="#4e6075" /><line x1="125.7174" y1="114.0000" x2="125.7174" y2="130.0000" stroke="#4e6075" stroke-width="1.7" stroke-linecap="round" /><circle cx="125.71739130434779" cy="122" r="4.8" fill="#205d9c" /><text x="125.7174" y="164.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#205d9c" text-anchor="middle">3</text><line x1="320.4383" y1="114.0000" x2="320.4383" y2="130.0000" stroke="#4e6075" stroke-width="1.7" stroke-linecap="round" /><circle cx="320.4382863512751" cy="122" r="4.8" fill="#aa5411" /><text x="320.4383" y="164.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#aa5411" text-anchor="middle">2√3</text><line x1="545.2826" y1="114.0000" x2="545.2826" y2="130.0000" stroke="#4e6075" stroke-width="1.7" stroke-linecap="round" /><circle cx="545.282608695652" cy="122" r="4.8" fill="#205d9c" /><text x="545.2826" y="164.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#205d9c" text-anchor="middle">4</text><line x1="125.7174" y1="98.0000" x2="545.2826" y2="98.0000" stroke="#205d9c" stroke-width="3.5" stroke-linecap="round" /></svg>
