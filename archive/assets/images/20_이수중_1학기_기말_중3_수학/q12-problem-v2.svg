<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 462" width="680" height="462" role="img" aria-labelledby="title desc"><title id="title">세 종류의 타일을 직사각형에 맞추기</title><desc id="desc">파란 x 정사각형, 옆 주황 x와 1의 직사각형, 초록 단위 정사각형의 세 종류가 있다. 단위 타일은 18개이다.</desc><rect width="680" height="462" fill="white" /><rect x="98" y="120" width="162" height="162" fill="#e1edf9" stroke="#205d9c" stroke-width="3.2" /><text x="179.0000" y="337.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#205d9c" text-anchor="middle">1개</text><rect x="365" y="120" width="42" height="162" fill="#fae6cf" stroke="#aa5411" stroke-width="3.2" /><text x="386.0000" y="337.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#aa5411" text-anchor="middle">?개</text><rect x="524" y="120" width="42" height="42" fill="#e5f2e4" stroke="#277339" stroke-width="3.2" /><text x="545.0000" y="217.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#277339" text-anchor="middle">18개</text><text x="179.0000" y="102.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#205d9c" text-anchor="middle">x</text><text x="78.0000" y="206.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#205d9c" text-anchor="middle">x</text><text x="388.0000" y="102.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#aa5411" text-anchor="middle">1</text><text x="346.0000" y="206.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#aa5411" text-anchor="middle">x</text><text x="545.0000" y="102.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#277339" text-anchor="middle">1</text><text x="506.0000" y="149.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#277339" text-anchor="middle">1</text></svg>
