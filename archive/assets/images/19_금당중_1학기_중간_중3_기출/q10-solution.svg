<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 705 460" width="705" height="460" role="img" aria-labelledby="title desc"><title id="title">낙하 거리와 지면에 닿는 시간</title><desc id="desc">가로축은 낙하 시간이며 세로축은 낙하 거리이다. 주어진 높이 98 m에서 파란 곡선을 만나 아래로 점선을 내렸다.</desc><rect width="705" height="460" fill="white" /><line x1="84.0000" y1="376.9254" x2="646.0000" y2="376.9254" stroke="#586574" stroke-width="1.75" stroke-linecap="round" /><line x1="117.1589" y1="390.8952" x2="117.1589" y2="53.0000" stroke="#586574" stroke-width="1.75" stroke-linecap="round" /><path d="M 117.1589 376.9254 Q 377.7534 376.9254 638.3480 55.3979" stroke="#205d9c" stroke-width="5.65" stroke-linecap="round" fill="none" /><line x1="117.1589" y1="205.7950" x2="497.3919" y2="205.7950" stroke="#704895" stroke-width="2.05" stroke-linecap="round" stroke-dasharray="6 5" /><line x1="497.3919" y1="376.9254" x2="497.3919" y2="205.7950" stroke="#704895" stroke-width="2.05" stroke-linecap="round" stroke-dasharray="6 5" /><circle cx="497.39189208922295" cy="205.79499896672868" r="4.6" fill="#aa5411" /><circle cx="117.1588502269289" cy="376.92539780946476" r="4.6" fill="#205d9c" /><text x="73.1589" y="214.7950" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#704895" text-anchor="middle">98 m</text><text x="497.3919" y="420.9254" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#704895" text-anchor="middle">낙하 시간</text><text x="175.0000" y="43.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#586574" text-anchor="middle">낙하 거리(m)</text><text x="646.0000" y="419.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#586574" text-anchor="middle">t(초)</text></svg>
