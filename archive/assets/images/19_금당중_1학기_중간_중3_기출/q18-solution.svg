<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 718 615" width="718" height="615" role="img" aria-labelledby="title desc"><title id="title">두 정사각형 넓이의 차를 직사각형으로 바꾸기</title><desc id="desc">왼쪽 ㄱ자 도형은 파랑과 주황 직사각형으로 나뉜다. 파란 부분을 돌려 오른쪽에 놓으면 가로 265+135, 세로 265−135인 직사각형이 된다.</desc><rect width="718" height="615" fill="white" /><rect x="208" y="74" width="133.9" height="272.95" fill="#e1eefb" stroke="#205d9c" stroke-width="4.0" /><rect x="341.9" y="213.05" width="139.05" height="133.9" fill="#fae6ce" stroke="#aa5411" stroke-width="4.0" /><line x1="341.9000" y1="74.0000" x2="480.9500" y2="74.0000" stroke="#586574" stroke-width="1.7" stroke-linecap="round" stroke-dasharray="7 5" /><line x1="480.9500" y1="74.0000" x2="480.9500" y2="213.0500" stroke="#586574" stroke-width="1.7" stroke-linecap="round" stroke-dasharray="7 5" /><rect x="120" y="417" width="320.65" height="157.29999999999998" fill="#e1eefb" stroke="#205d9c" stroke-width="4.2" /><rect x="440.65" y="417" width="163.35" height="157.29999999999998" fill="#fae6ce" stroke="#aa5411" stroke-width="4.2" /><text x="280.3250" y="485.0000" font-size="30" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#205d9c" text-anchor="middle">265</text><text x="522.3250" y="485.0000" font-size="30" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#aa5411" text-anchor="middle">135</text><text x="364.4200" y="607.3000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">가로 265+135</text><text x="70.0000" y="495.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#586574" text-anchor="middle">130</text><line x1="184.0000" y1="74.0000" x2="184.0000" y2="346.9500" stroke="#586574" stroke-width="1.65" stroke-linecap="round" /><text x="119.0000" y="218.4750" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#586574" text-anchor="middle">265 cm</text><line x1="208.0000" y1="369.9500" x2="480.9500" y2="369.9500" stroke="#586574" stroke-width="1.65" stroke-linecap="round" /><text x="344.4750" y="401.9500" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#586574" text-anchor="middle">265 cm</text><line x1="358.9000" y1="74.0000" x2="358.9000" y2="213.0500" stroke="#586574" stroke-width="1.65" stroke-linecap="round" /><text x="411.9000" y="151.5250" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#586574" text-anchor="middle">135 cm</text></svg>
