<svg xmlns="http://www.w3.org/2000/svg" width="920" height="560" viewBox="0 0 920 560"><rect x="0" y="0" width="920" height="560" fill="white"/><style>text{font-family:"Noto Sans CJK KR","DejaVu Sans",sans-serif; fill:#142333;} .lbl{font-size:26px;font-weight:600}.small{font-size:21px}.math{font-size:29px;font-weight:600}.line{stroke:#183653;stroke-width:4;fill:none;stroke-linejoin:round;stroke-linecap:round}.dash{stroke:#62788f;stroke-width:2.6;stroke-dasharray:8 6;fill:none}</style><text x="35" y="45" class="lbl">q20 | 직각삼각형 OPQ</text>
<rect x="85" y="100" width="360" height="360" fill="none" stroke="#183653" stroke-width="4"/>
<path d="M85 220 L385 100 L85 100 Z" fill="#e1edf9" stroke="#2675b3" stroke-width="4"/>
<path d="M85 100h27v27h-27" fill="none" stroke="#2675b3" stroke-width="3"/>
<circle cx="85" cy="100" r="5" fill="#183653"/><circle cx="85" cy="220" r="5" fill="#183653"/><circle cx="385" cy="100" r="5" fill="#183653"/>
<text x="49" y="90" class="lbl">O</text><text x="49" y="238" class="lbl">P</text><text x="377" y="88" class="lbl">Q</text>
<text x="52" y="484" class="lbl">A</text><text x="446" y="484" class="lbl">B</text><text x="446" y="102" class="lbl">C</text>
<text x="113" y="175" class="small">OP=2t</text><text x="211" y="85" class="small">OQ=12-t</text>
<text x="503" y="145" class="math">넓이 = (1/2)·OP·OQ</text>
<text x="503" y="193" class="math">= t(12-t) = 20</text>
<text x="503" y="255" class="small">(t-2)(t-10) = 0</text>
<text x="503" y="300" class="small">P는 t=6초에 A에 도착</text>
<text x="503" y="352" class="lbl">0 ≤ t ≤ 6</text>
<text x="503" y="413" class="lbl">정답: 2초</text>
</svg>