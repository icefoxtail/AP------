<svg xmlns="http://www.w3.org/2000/svg" width="920" height="560" viewBox="0 0 920 560"><rect x="0" y="0" width="920" height="560" fill="white"/><style>text{font-family:"Noto Sans CJK KR","DejaVu Sans",sans-serif; fill:#142333;} .lbl{font-size:26px;font-weight:600}.small{font-size:21px}.math{font-size:29px;font-weight:600}.line{stroke:#183653;stroke-width:4;fill:none;stroke-linejoin:round;stroke-linecap:round}.dash{stroke:#62788f;stroke-width:2.6;stroke-dasharray:8 6;fill:none}</style><text x="35" y="45" class="lbl">q19 | 인접한 두 정사각형</text>
<rect x="65" y="120" width="300" height="300" fill="#dcebf7" stroke="#183653" stroke-width="4"/>
<rect x="365" y="240" width="180" height="180" fill="#e7f5ed" stroke="#183653" stroke-width="4"/>
<text x="195" y="265" class="math">25</text><text x="437" y="350" class="math">9</text>
<text x="45" y="458" class="lbl">A</text><text x="354" y="458" class="lbl">P</text><text x="541" y="458" class="lbl">B</text>
<path d="M65 480 V497 H365 V480" class="line"/><path d="M365 480 V497 H545 V480" class="line"/>
<text x="197" y="535" class="small">AP = 5 cm</text><text x="388" y="535" class="small">PB = 3 cm</text>
<text x="610" y="156" class="math">AP + PB = 8</text><text x="610" y="205" class="math">AP² + PB² = 34</text>
<text x="610" y="263" class="small">x² + (8-x)² = 34</text>
<text x="610" y="313" class="small">(x-3)(x-5) = 0</text>
<text x="610" y="363" class="small">AP &gt; PB ⇒ AP = 5</text>
<text x="610" y="417" class="lbl">정답: 5 cm</text>
</svg>