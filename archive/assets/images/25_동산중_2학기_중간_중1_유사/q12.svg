<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 280" width="1400" height="280" role="img" aria-labelledby="q12-title q12-desc">
  <title id="q12-title">수직선 위의 점 ㄱ, ㄴ, ㄷ, ㄹ, ㅁ</title>
  <desc id="q12-desc">수직선 위에 표시된 다섯 점 ㄱ, ㄴ, ㄷ, ㄹ, ㅁ의 위치를 나타낸 그림</desc>
  <rect width="1400" height="280" fill="#ffffff"/>
  <g fill="#141414" stroke="#141414">
    <!-- Main horizontal axis with arrows -->
    <line x1="82" y1="136" x2="1318" y2="136" stroke-width="4"/>
    <polygon points="80,136 103,125.5 103,146.5" stroke="none"/>
    <polygon points="1320,136 1297,125.5 1297,146.5" stroke="none"/>
    
    <!-- Integer main ticks (-4 to +4) -->
    <line x1="148" y1="122.5" x2="148" y2="149.5" stroke-width="3"/>
    <line x1="286" y1="122.5" x2="286" y2="149.5" stroke-width="3"/>
    <line x1="424" y1="122.5" x2="424" y2="149.5" stroke-width="3"/>
    <line x1="562" y1="122.5" x2="562" y2="149.5" stroke-width="3"/>
    <line x1="700" y1="122.5" x2="700" y2="149.5" stroke-width="3"/>
    <line x1="838" y1="122.5" x2="838" y2="149.5" stroke-width="3"/>
    <line x1="976" y1="122.5" x2="976" y2="149.5" stroke-width="3"/>
    <line x1="1114" y1="122.5" x2="1114" y2="149.5" stroke-width="3"/>
    <line x1="1252" y1="122.5" x2="1252" y2="149.5" stroke-width="3"/>
    
    <!-- Minor subdivision ticks -->
    <!-- [-3, -2] 2 parts: x = 355 -->
    <line x1="355" y1="129" x2="355" y2="143" stroke-width="2"/>
    <!-- [-2, -1] 3 parts: x = 470, 516 -->
    <line x1="470" y1="129" x2="470" y2="143" stroke-width="2"/>
    <line x1="516" y1="129" x2="516" y2="143" stroke-width="2"/>
    <!-- [0, 1] 4 parts: x = 734.5, 769, 803.5 -->
    <line x1="734.5" y1="129" x2="734.5" y2="143" stroke-width="2"/>
    <line x1="769" y1="129" x2="769" y2="143" stroke-width="2"/>
    <line x1="803.5" y1="129" x2="803.5" y2="143" stroke-width="2"/>
    <!-- [1, 2] 3 parts: x = 884, 930 -->
    <line x1="884" y1="129" x2="884" y2="143" stroke-width="2"/>
    <line x1="930" y1="129" x2="930" y2="143" stroke-width="2"/>
    <!-- [3, 4] 2 parts: x = 1183 -->
    <line x1="1183" y1="129" x2="1183" y2="143" stroke-width="2"/>
  </g>
  
  <!-- Pointer arrows to the 5 points -->
  <g fill="#141414" stroke="none">
    <!-- Point ㄱ at x=355 -->
    <line x1="355" y1="60" x2="355" y2="106" stroke="#141414" stroke-width="4"/>
    <polygon points="342.5,105 367.5,105 355,127"/>
    <!-- Point ㄴ at x=470 -->
    <line x1="470" y1="60" x2="470" y2="106" stroke="#141414" stroke-width="4"/>
    <polygon points="457.5,105 482.5,105 470,127"/>
    <!-- Point ㄷ at x=803.5 -->
    <line x1="803.5" y1="60" x2="803.5" y2="106" stroke="#141414" stroke-width="4"/>
    <polygon points="791,105 816,105 803.5,127"/>
    <!-- Point ㄹ at x=930 -->
    <line x1="930" y1="60" x2="930" y2="106" stroke="#141414" stroke-width="4"/>
    <polygon points="917.5,105 942.5,105 930,127"/>
    <!-- Point ㅁ at x=1183 -->
    <line x1="1183" y1="60" x2="1183" y2="106" stroke="#141414" stroke-width="4"/>
    <polygon points="1170.5,105 1195.5,105 1183,127"/>
  </g>
  
  <!-- Marked circular points on axis -->
  <g fill="#ffffff" stroke="#141414" stroke-width="4">
    <circle cx="355" cy="136" r="6.5"/>
    <circle cx="470" cy="136" r="6.5"/>
    <circle cx="803.5" cy="136" r="6.5"/>
    <circle cx="930" cy="136" r="6.5"/>
    <circle cx="1183" cy="136" r="6.5"/>
  </g>
  
  <!-- Point letter labels (ㄱ, ㄴ, ㄷ, ㄹ, ㅁ) -->
  <g font-family="Noto Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" font-size="40" font-weight="700" fill="#141414" text-anchor="middle">
    <text x="355" y="46">ㄱ</text>
    <text x="470" y="46">ㄴ</text>
    <text x="803.5" y="46">ㄷ</text>
    <text x="930" y="46">ㄹ</text>
    <text x="1183" y="46">ㅁ</text>
  </g>
  
  <!-- Integer axis numbers -->
  <g font-family="Noto Sans KR, sans-serif" font-size="34" fill="#141414" text-anchor="middle">
    <text x="148" y="206">-4</text>
    <text x="286" y="206">-3</text>
    <text x="424" y="206">-2</text>
    <text x="562" y="206">-1</text>
    <text x="700" y="206">0</text>
    <text x="838" y="206">+1</text>
    <text x="976" y="206">+2</text>
    <text x="1114" y="206">+3</text>
    <text x="1252" y="206">+4</text>
  </g>
</svg>
