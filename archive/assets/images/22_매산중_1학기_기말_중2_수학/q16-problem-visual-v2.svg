<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 518" width="730" height="518" role="img" aria-labelledby="title desc"><title id="title">오른쪽 아래로 향하는 일차방정식의 그래프</title><desc id="desc">파란 직선은 왼쪽 위에서 오른쪽 아래로 내려간다. 원점의 위에서 세로축과 만나고 원점의 오른쪽에서 가로축과 만난다.</desc><rect width="730" height="518" fill="white" /><line x1="91.0000" y1="292.6032" x2="640.0000" y2="292.6032" stroke="#586574" stroke-width="2.05" stroke-linecap="round" /><polygon points="653.0000,292.6032 640.0000,287.4032 640.0000,297.8032" fill="#586574" /><line x1="350.6196" y1="443.0000" x2="350.6196" y2="77.0000" stroke="#586574" stroke-width="2.05" stroke-linecap="round" /><polygon points="350.6196,64.0000 345.4196,77.0000 355.8196,77.0000" fill="#586574" /><line x1="168.0282" y1="70.0640" x2="615.0674" y2="436.9360" stroke="#21639a" stroke-width="7.7" stroke-linecap="round" /><text x="669.000" y="279.603" fill="#586574" font-size="32" font-weight="600" font-family="Malgun Gothic, Cambria Math, sans-serif" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="4.0" stroke-linejoin="round">x</text><text x="369.620" y="59.000" fill="#586574" font-size="32" font-weight="600" font-family="Malgun Gothic, Cambria Math, sans-serif" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="4.0" stroke-linejoin="round">y</text><text x="324.620" y="324.603" fill="#586574" font-size="32" font-weight="600" font-family="Malgun Gothic, Cambria Math, sans-serif" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="4.0" stroke-linejoin="round">O</text></svg>
