<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 518" width="730" height="518" role="img" aria-labelledby="title desc"><title id="title">한 점에서 만나는 두 일차방정식의 그래프</title><desc id="desc">두 직선이 만나고 교점 높이에서 왼쪽으로 이은 점선이 세로축의 3을 가리킨다. 기울기가 덜 가파른 파란 직선이 x−ay=4이다.</desc><rect width="730" height="518" fill="white" /><line x1="91.0000" y1="350.3264" x2="640.0000" y2="350.3264" stroke="#586574" stroke-width="2.05" stroke-linecap="round" /><polygon points="653.0000,350.3264 640.0000,345.1264 640.0000,355.5264" fill="#586574" /><line x1="247.8372" y1="443.0000" x2="247.8372" y2="77.0000" stroke="#586574" stroke-width="2.05" stroke-linecap="round" /><polygon points="247.8372,64.0000 242.6372,77.0000 253.0372,77.0000" fill="#586574" /><line x1="102.2400" y1="102.4246" x2="641.7600" y2="373.1014" stroke="#21639a" stroke-width="7.1" stroke-linecap="round" /><line x1="187.1090" y1="70.8220" x2="551.2275" y2="436.1780" stroke="#a34c1f" stroke-width="6.45" stroke-linecap="round" stroke-dasharray="12 6" /><line x1="247.8372" y1="219.1845" x2="334.9690" y2="219.1845" stroke="#98aebe" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="7 6" /><line x1="242.8372" y1="219.1845" x2="252.8372" y2="219.1845" stroke="#586574" stroke-width="1.6" stroke-linecap="round" /><circle cx="334.968992248062" cy="219.18454440599768" r="7.4" fill="#293b4b" stroke="white" stroke-width="2" /><line x1="446.4977" y1="275.1384" x2="480.4791" y2="254.1557" stroke="#21639a" stroke-width="1.7" stroke-linecap="round" /><text x="669.000" y="337.326" fill="#586574" font-size="32" font-weight="600" font-family="Malgun Gothic, Cambria Math, sans-serif" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="4.0" stroke-linejoin="round">x</text><text x="266.837" y="59.000" fill="#586574" font-size="32" font-weight="600" font-family="Malgun Gothic, Cambria Math, sans-serif" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="4.0" stroke-linejoin="round">y</text><text x="220.837" y="382.326" fill="#586574" font-size="32" font-weight="600" font-family="Malgun Gothic, Cambria Math, sans-serif" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="4.0" stroke-linejoin="round">O</text><text x="218.837" y="227.185" fill="#586574" font-size="32" font-weight="600" font-family="Malgun Gothic, Cambria Math, sans-serif" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="4.0" stroke-linejoin="round">3</text><text x="528.101" y="239.899" fill="#21639a" font-size="32" font-weight="600" font-family="Malgun Gothic, Cambria Math, sans-serif" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="4.0" stroke-linejoin="round">x − ay = 4</text></svg>
