<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="590" viewBox="0 0 760 590" role="img"><title>문항 6 두 점근선과 y=2가 둘러싸는 삼각형</title><desc>두 직선 y=x/2, y=-x/2의 교점 O(0,0)와 직선 y=2의 교점 (-4,2), (4,2)를 표시한다. 밑변 길이 8, 높이 2이므로 삼각형 넓이는 8이다.</desc><rect width="760" height="590" fill="#fff" /><line x1="105" y1="382" x2="655" y2="382" stroke="#374151" stroke-width="2" stroke-dasharray="4 4" /><line x1="380" y1="427.0" x2="380" y2="22" stroke="#374151" stroke-width="2" /><line x1="105" y1="157.0" x2="655" y2="607.0" stroke="#374151" stroke-width="2" /><line x1="105" y1="607.0" x2="655" y2="157.0" stroke="#374151" stroke-width="2" /><line x1="105" y1="202" x2="655" y2="202" stroke="#374151" stroke-width="2" /><circle cx="160" cy="202" r="4" fill="#111827" /><text x="80" y="192" font-size="20" font-family="Noto Sans CJK KR, NanumGothic, DejaVu Sans">(-4,2)</text><circle cx="600" cy="202" r="4" fill="#111827" /><text x="608" y="192" font-size="20" font-family="Noto Sans CJK KR, NanumGothic, DejaVu Sans">(4,2)</text><circle cx="380" cy="382" r="4" fill="#111827" /><text x="390" y="402" font-size="20" font-family="Noto Sans CJK KR, NanumGothic, DejaVu Sans">O</text><rect x="0" y="475" width="760" height="115" fill="white" /><line x1="38" y1="481" x2="722" y2="481" stroke="#d1d5db" /><text x="50" y="500" font-size="19" font-family="Noto Sans CJK KR, NanumGothic, DejaVu Sans">점근선 y=±x/2, 윗변 y=2</text><text x="50" y="540" font-size="20" font-family="Noto Sans CJK KR, NanumGothic, DejaVu Sans">삼각형 넓이 = (1/2) × 8 × 2 = 8</text></svg>