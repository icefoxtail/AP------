<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 600" width="640" height="600" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">점 A에서 원 O에 그은 두 접선의 접점이 D, E이고, 선분 BC가 원 O에 접하는 그림이다. 각 DAE는 60, 반지름 OD는 30 cm이며 삼각형 ABC의 둘레를 구하는 문제에 필요한 도형이 나타나 있다.</title><desc id="visual-desc">원 O의 왼쪽 바깥 점 A에서 원에 두 접선 AD, AE가 그어져 접점이 D, E이다. 원의 왼쪽에서 선분 BC가 원에 접하며 두 접선과 만나 삼각형 ABC를 이루고, 각 DAE에는 60, 반지름 OD에는 30 cm가 표시되어 있다.</desc><rect width="640" height="600" fill="#fff"/><g data-layer="12"><polygon id="A60-sector" data-role="angleSector" stroke="none" stroke-width="1.6" fill="#d9d9d9" data-owner-points="D A E" data-mark="angle" data-mark-id="A60" data-mark-index="0" data-mark-count="1" data-mark-side="INNER" points="90.822281167,300 115.070992473,286 115.93471793,287.615916674 116.690908077,289.284863894 117.336324793,290.999694972 117.868204303,292.753066737 118.284269018,294.537470984 118.582737286,296.345266618 118.762331018,298.168712382 118.822281167,300 118.762331018,301.831287618 118.582737286,303.654733382 118.284269018,305.462529016 117.868204303,307.246933263 117.336324793,309.000305028 116.690908077,310.715136106 115.93471793,312.384083326 115.070992473,314"/></g><g data-layer="30"><line id="AB" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="90.822281167" y1="300" x2="249.973474801" y2="208.114015514"/></g><g data-layer