<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" width="720" height="520" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">한 변의 길이가 x인 정사각형 2개, 가로가 1이고 세로가 x인 직사각형 5개, 한 변의 길이가 1인 정사각형 2개가 서로 떨어져 놓여 있다.</title><desc id="visual-desc">위쪽에 큰 정사각형 두 개가 있고, 아래쪽에는 폭이 좁고 세로로 긴 직사각형 다섯 개와 작은 정사각형 두 개가 있다. 큰 정사각형의 변과 직사각형의 긴 변에는 x, 직사각형의 짧은 변과 작은 정사각형의 변에는 1이 적혀 있다.</desc><rect width="720" height="520" fill="#fff"/><g data-layer="30"><line id="sAB" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="90.901287554" y1="211.072961373" x2="237.682403433" y2="211.072961373"/></g><g data-layer="30"><line id="sBC" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="237.682403433" y1="211.072961373" x2="237.682403433" y2="64.291845494"/></g><g data-layer="30"><line id="sCD" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="237.682403433" y1="64.291845494" x2="90.901287554" y2="64.291845494"/></g><g data-layer="30"><line id="sDA" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="90.901287554" y1="64.291845494" x2="90.901287554" y2="211.072961373"/></g><g data-layer="30"><line id="sEF" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="286.60944206" y1="211.072961373" x2="433.39055794" y2="211.072961373"/></g><g data-layer="30"><line id="sFG" data-role="line" stroke="#11