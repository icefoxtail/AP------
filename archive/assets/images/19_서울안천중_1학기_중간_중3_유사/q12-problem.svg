<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 600" width="640" height="600" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">한 변의 길이가 6인 바깥 정사각형 안에 각 변의 중점을 이어 만든 정사각형과, 그 정사각형의 각 변의 중점을 이어 만든 정사각형이 차례로 그려져 있다. 두 안쪽 정사각형 사이의 부분이 색칠되어 있다.</title><desc id="visual-desc">바깥 정사각형의 아래쪽 변에 6이 적혀 있고, 그 안에 45도 기울어진 첫 번째 중점 정사각형과 다시 그 중점을 이은 두 번째 정사각형이 있다. 첫 번째와 두 번째 정사각형 사이의 네 구간이 하나의 테두리 모양으로 색칠되어 있다.</desc><rect width="640" height="600" fill="#fff"/><g data-layer="10"><path id="ring" data-role="region" stroke="none" stroke-width="1.6" fill="#c7ccd5" data-owner-points="E F G H I J K L" data-mark="region" data-mark-id="ring" fill-rule="evenodd" d="M320 539.285714286 L559.285714286 300 L320 60.714285714 L80.714285714 300 L320 539.285714286 Z M439.642857143 419.642857143 L439.642857143 180.357142857 L200.357142857 180.357142857 L200.357142857 419.642857143 L439.642857143 419.642857143 Z"/></g><g data-layer="30"><line id="sAB" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="80.714285714" y1="539.285714286" x2="559.285714286" y2="539.285714286"/></g><g data-layer="30"><line id="sBC" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="559.285714286" y1="539.285714286" x2="559.285714286" y2="60.714285714"/></g><g data-layer="30"><line id="sCD" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="55