<svg xmlns="http://www.w3.org/2000/svg" width="700" height="390" viewBox="0 0 700 390" role="img" aria-label="A(5,1), B(1,4), 수평 거리4 수직 거리3 빗변5인 직각삼각형">
<rect width="700" height="390" fill="white"/><style>
  .title{font:700 21px "Noto Sans CJK KR",sans-serif;fill:#172b4d}
  .label{font:16px "Noto Sans CJK KR",sans-serif;fill:#172b4d}
  .note{font:15px "Noto Sans CJK KR",sans-serif;fill:#465b73}
  .length{font:700 17px "Noto Sans CJK KR",sans-serif;fill:#126b85}
  .tri{fill:#def5f1;stroke:#146e83;stroke-width:3}
  .leg{stroke:#e29a36;stroke-width:3;stroke-dasharray:7 5}
  .dot{fill:#172b4d}
</style>
<text x="26" y="36" class="title">양수 k를 선택하는 거리 공식</text>
<polygon class="tri" fill="#def5f1" stroke="#146e83" stroke-width="3" points="540,300 340,150 340,300"/>
<path class="leg" fill="none" d="M 540 300 H 340 V 150"/>
<path d="M 340 282 H 358 V 300" fill="none" stroke="#e29a36" stroke-width="2"/>
<circle class="dot" cx="540" cy="300" r="5"/><circle class="dot" cx="340" cy="150" r="5"/>
<text class="label" x="550" y="325">A(5,1)</text>
<text class="label" x="272" y="137">B(1,4)</text>
<text class="label" x="288" y="319">C(1,1)</text>
<text class="length" x="433" y="326">4</text>
<text class="length" x="357" y="230">3</text>
<text class="length" x="456" y="215">5</text>
<text class="note" x="30" y="98">AB² = (k-1)² + 3² = 5²</text>
<text class="note" x="30" y="127">(k-1)² = 16</text>
<text class="note" x="30" y="156">k = 5 또는 -3</text>
<text class="note" x="30" y="185">k &gt; 0 → k = 5</text>
<text class="note" x="30" y="366">직각삼각형의 가로 4 · 세로 3 · 빗변 5</text>
</svg>