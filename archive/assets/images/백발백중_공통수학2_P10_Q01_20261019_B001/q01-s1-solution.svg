<svg xmlns="http://www.w3.org/2000/svg" width="760" height="400" viewBox="0 0 760 400" role="img" aria-label="두 점 사이 거리 루트41인 두 경우: t=-4와 t=6, 가로 차 5 세로 차 4">
<rect width="760" height="400" fill="white"/><style>
  .title{font:700 21px "Noto Sans CJK KR",sans-serif;fill:#172b4d}
  .label{font:16px "Noto Sans CJK KR",sans-serif;fill:#172b4d}
  .note{font:15px "Noto Sans CJK KR",sans-serif;fill:#465b73}
  .length{font:700 17px "Noto Sans CJK KR",sans-serif;fill:#126b85}
  .tri{fill:#def5f1;stroke:#146e83;stroke-width:3}
  .leg{stroke:#e29a36;stroke-width:3;stroke-dasharray:7 5}
  .dot{fill:#172b4d}
</style>
<text x="28" y="36" class="title">두 점 사이 거리: 두 가지 가능한 t</text>
<rect x="18" y="58" width="350" height="296" rx="14" fill="#f5f9fc"/>
<rect x="392" y="58" width="350" height="296" rx="14" fill="#f5f9fc"/>
<text x="38" y="90" class="title">t = -4</text>
<polygon class="tri" fill="#def5f1" stroke="#146e83" stroke-width="3" points="100,280 250,160 250,280"/>
<path class="leg" fill="none" d="M 100 280 H 250 V 160"/>
<path d="M 234 280 V 264 H 250" fill="none" stroke="#e29a36" stroke-width="2"/>
<circle class="dot" cx="100" cy="280" r="5"/><circle class="dot" cx="250" cy="160" r="5"/>
<text class="label" x="42" y="308">A(-4,-2)</text><text class="label" x="258" y="151">B(1,2)</text>
<text class="length" x="162" y="304">5</text><text class="length" x="259" y="225">4</text>
<text class="length" x="138" y="204">√41</text>
<text x="414" y="90" class="title">t = 6</text>
<polygon class="tri" fill="#def5f1" stroke="#146e83" stroke-width="3" points="540,280 390,160 390,280"/>
<path class="leg" fill="none" d="M 540 280 H 390 V 160"/>
<path d="M 390 264 H 406 V 280" fill="none" stroke="#e29a36" stroke-width="2"/>
<circle class="dot" cx="540" cy="280" r="5"/><circle class="dot" cx="390" cy="160" r="5"/>
<text class="label" x="524" y="309">A(6,-2)</text><text class="label" x="400" y="149">B(1,2)</text>
<text class="length" x="461" y="304">5</text><text class="length" x="408" y="226">4</text>
<text class="length" x="466" y="204">√41</text>
<text x="35" y="382" class="note">가로 차 5, 세로 차 4 → AB² = 5² + 4² = 41; 두 값의 합 = -4 + 6 = 2</text>
</svg>