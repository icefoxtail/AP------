<g stroke="#DDD" stroke-width="1"><path d="M124 40 V364 M178 40 V364 M232 40 V364 M286 40 V364 M340 40 V364 M394 40 V364 M448 40 V364 M502 40 V364"/><path d="M100 40 H502 M100 94 H502 M100 148 H502 M100 202 H502 M100 256 H502 M100 310 H502 M100 364 H502"/></g>
<g stroke="#222" stroke-width="2.5" fill="none"><path d="M90 202 H523" marker-end="url(#arrow)"/><path d="M178 386 V19" marker-end="url(#arrow)"/></g>
<g fill="#222" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="19"><text x="528" y="210">x</text><text x="164" y="18">y</text><text x="155" y="227">O</text><text x="224" y="225">1</text><text x="280" y="225">2</text><text x="335" y="225">3</text><text x="389" y="225">4</text><text x="155" y="152">1</text><text x="155" y="99">2</text><text x="155" y="260">-1</text></g>
<path d="M124 40 L448 364" stroke="#164F91" stroke-width="3.6" fill="none" stroke-linecap="round"/>
<g fill="#164F91" stroke="#FFF" stroke-width="2"><circle cx="178" cy="94" r="6.5"/><circle cx="286" cy="202" r="6.5"/><circle cx="340" cy="256" r="6.5"/></g>
<g font-family="Arial, 'Noto Sans KR', sans-serif" font-size="19" fill="#164F91" font-weight="600"><text x="196" y="82">(0, 2)</text><text x="275" y="187">(2, 0)</text><text x="354" y="278">(3, -1)</text><text x="379" y="79">y = -x + 2</text></g>
