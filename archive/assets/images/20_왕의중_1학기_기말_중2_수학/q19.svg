<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" role="img" aria-labelledby="ttl desc">
<title id="ttl">일차함수 y=-x+2의 좌표평면 그래프</title><desc id="desc">직선은 (0,2), (2,0), (3,-1)을 지나고 기울기가 -1이다.</desc>
