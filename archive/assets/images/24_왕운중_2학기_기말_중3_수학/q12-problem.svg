<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" width="600" height="480" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">원 O에서 AB는 지름이고 P는 원 위의 점이다. 원주각 PAB는 55도이며 P에서 반지름 PO와 현 PB가 이루는 각을 x로 표시한다.</title><desc id="visual-desc">원의 중심 O를 통과하는 지름 AB의 양 끝이 왼쪽 아래 A와 오른쪽 위 B에 있다. 원 위 왼쪽 위의 P에서 A와 B로 현을 긋고 P와 O도 연결했다. A의 각 PAB는 55도, P의 각 OPB는 미지수 x로 표시된다.</desc><rect width="600" height="480" fill="#fff"/><g data-layer="30"><line id="diameterAB" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="179.334663575" y1="377.359693249" x2="409.851599463" y2="102.640306751"/></g><g data-layer="30"><line id="chordPA" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="126.096523654" y1="178.672250162" x2="179.334663575" y2="377.359693249"/></g><g data-layer="30"><line id="chordPB" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="126.096523654" y1="178.672250162" x2="409.851599463" y2="102.640306751"/></g><g data-layer="30"><line id="radiusPO" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="126.096523654" y1="178.672250162" x2="294.593131519" y2="240"/></g><g data-layer="40"><circle id="k" data-role="circle" stroke="#111" stroke-width="2.05" fill="none" cx="294.593131519" cy="240" r="179.310344828"/></g><g data-layer="60"><polyline id="anglePAB-arc-1" data-role="indicator" stro