<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" width="640" height="260" role="img" aria-labelledby="title desc" data-scale-policy="SCHEMATIC_ALLOWED">
  <title id="title">두 원의 공통현</title>
  <desc id="desc">두 원의 교점 A,B와 공통현 직선 x+2y+1=0을 나타내고 두 원의 방정식을 빼서 직선을 얻는 과정을 보여준다.</desc>
  <rect width="640" height="260" fill="#fff"/>
  <text x="320" y="28" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="22" font-weight="700" fill="#1e3a5f">두 원의 교점 A, B  →  공통현 직선</text>
  <rect x="18" y="44" width="350" height="190" rx="8" fill="#f8fafc" stroke="#dbe3ef"/>
  <line x1="47" y1="185" x2="340" y2="72" stroke="#dc2626" stroke-width="2.5"/>
  <circle cx="150" cy="145" r="67" fill="#dbeafe" fill-opacity=".48" stroke="#2563eb" stroke-width="2.4"/><circle cx="245" cy="145" r="67" fill="#dcfce7" fill-opacity=".45" stroke="#059669" stroke-width="2.4"/>
  <circle cx="195" cy="116" r="4.5" fill="#dc2626"/><circle cx="195" cy="174" r="4.5" fill="#dc2626"/>
  <text x="202" y="112" font-family="Arial, sans-serif" font-size="16" fill="#b91c1c">A</text><text x="202" y="191" font-family="Arial, sans-serif" font-size="16" fill="#b91c1c">B</text><text x="72" y="93" font-family="Arial, sans-serif" font-size="15" fill="#1d4ed8">C₁</text><text x="273" y="93" font-family="Arial, sans-serif" font-size="15" fill="#047857">C₂</text><text x="219" y="88" font-family="Arial, sans-serif" font-size="15" fill="#b91c1c">x+2y+1=0</text>
  <rect x="390" y="44" width="232" height="190" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="410" y="76" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="18" font-weight="700" fill="#1e3a5f">이차항 소거</text>
  <text x="410" y="112" font-family="Arial, sans-serif" font-size="17">첫째 식 − 둘째 식</text><text x="410" y="145" font-family="Arial, sans-serif" font-size="17">2x−(a+b)y+…=0</text><text x="410" y="178" font-family="Arial, sans-serif" font-size="17">=2(x+2y+1)=0</text>
  <text x="410" y="216" font-family="Arial, sans-serif" font-size="17">a=−4, b=0</text><text x="410" y="242" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="17" font-weight="700" fill="#b91c1c">a²+b²=16  →  ②</text>
</svg>
