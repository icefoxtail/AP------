<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="720" height="360" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_1" data-geometry-preset="GEOMETRY_STANDARD" data-axis-scale-mode="EQUAL_UNIT" data-fact-hash="48d03737dd85086ff65d739d23806cc238b41f9f8f51a941d6e11d3c80125318" data-geometry-fact-hash="48d03737dd85086ff65d739d23806cc238b41f9f8f51a941d6e11d3c80125318" data-visual-provenance="deterministic-python-independent-facts"><title id="title">원 위 점과 직선까지의 자연수 거리</title><desc id="desc">중심 C(1,−3), 반지름 2인 원과 기준 직선 3x−4y+5=0, 거리 2와 거리 6의 실제 경계선을 표시한 해설 도형</desc><style>.axis{font:italic 13px "STIX Two Math","Malgun Gothic",serif;fill:#111}.label,.note{font:12px "Noto Sans KR","Malgun Gothic",sans-serif;font-weight:600}.title{font:700 15px "Noto Sans KR","Malgun Gothic",sans-serif;fill:#111827}</style><rect width="720" height="360" fill="#fff"/><text x="28" y="32" class="title">원 위 점과 직선까지의 자연수 거리</text><text x="28" y="51" class="note">거리 2와 거리 6의 경계선을 실제 위치로 표시한 해설 도형</text><rect x="24" y="62" width="376" height="263" rx="10" fill="#fff" stroke="#cbd5e1"/><g stroke="#e5e7eb" stroke-width="0.8"><line x1="192.62" y1="72" x2="192.62" y2="324"/><line x1="241.08" y1="72" x2="241.08" y2="324"/><line x1="34" y1="294.92" x2="390" y2="294.92"/><line x1="34" y1="246.46" x2="390" y2="246.46"/><line x1="34" y1="198" x2="390" y2="198"/><line x1="34" y1="149.54" x2="390" y2="149.54"/><line x1="34" y1="101.08" x2="390" y2="101.08"/></g><line x1="192.62" y1="72" x2="192.62" y2="324" stroke="#111" stroke-width="1.35"/><line x1="34" y1="246.46" x2="390" y2="246.46" stroke="#111" stroke-width="1.35"/><text x="199.62" y="86" class="axis">y</text><text x="384" y="239.46" text-anchor="end" class="axis">x</text><circle data-geometry="circle" data-center-x="1" data-center-y="-3" data-radius="2" cx="202.31" cy="275.54" r="19.38" stroke="#2563eb" stroke-width="2.05" fill="#dbeafe" fill-opacity=".25"/><line data-geometry="line" data-equation="3x-4y+5=0" x1="153.85" y1="263.42" x2="270.15" y2="176.19" stroke="#0f766e" stroke-width="2.3"/><line data-geometry="line" data-equation="3x-4y-5=0" x1="153.85" y1="287.65" x2="270.15" y2="200.42" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="6 4"/><line data-geometry="line" data-equation="3x-4y-25=0" x1="170" y1="324" x2="390" y2="159" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="6 4"/><circle data-point-label="C(1,−3)" data-point-x="1" data-point-y="-3" cx="202.31" cy="275.54" r="3" fill="#111827"/><text x="208.31" y="269.54" class="label" fill="#111827">C(1,−3)</text><rect x="420" y="62" width="276" height="263" rx="10" fill="#f8fafc" stroke="#dbe3ef"/><text x="438" y="91" class="title">핵심 수치</text><text x="438" y="116" class="note">기준 직선: 3x−4y+5=0</text><text x="438" y="134" class="note">거리 범위: 2≤d≤6</text><text x="438" y="152" class="note">d=2 경계: 3x−4y−5=0</text><text x="438" y="170" class="note">d=6 경계: 3x−4y−25=0</text><text x="438" y="188" class="note">d=2,6은 접선</text><text x="438" y="206" class="note">점 개수=1+2+2+2+1=8</text></svg>
