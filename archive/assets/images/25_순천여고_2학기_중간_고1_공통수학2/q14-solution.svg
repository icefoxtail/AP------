<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 270" width="640" height="270" role="img" aria-labelledby="title desc" data-scale-policy="SCHEMATIC_ALLOWED">
  <title id="title">원 위 점에서 직선까지의 거리 개수</title>
  <desc id="desc">중심 (1,-3), 반지름 2인 원과 직선까지의 거리 2부터 6까지의 평행선, 각 거리의 교점 수를 나타낸 그림이다.</desc>
  <rect width="640" height="270" fill="#fff"/>
  <text x="320" y="28" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="22" font-weight="700" fill="#1e3a5f">거리의 범위  2 ≤ d ≤ 6</text>
  <rect x="18" y="44" width="350" height="200" rx="8" fill="#f8fafc" stroke="#dbe3ef"/>
  <line x1="49" y1="218" x2="337" y2="70" stroke="#0f766e" stroke-width="2.4"/>
  <line x1="76" y1="245" x2="364" y2="97" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="6 4"/><line x1="38" y1="180" x2="326" y2="32" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="6 4"/>
  <circle cx="190" cy="151" r="70" fill="#dbeafe" fill-opacity=".62" stroke="#2563eb" stroke-width="2.5"/>
  <line x1="190" y1="151" x2="214" y2="139" stroke="#7c3aed" stroke-width="2" stroke-dasharray="5 4"/>
  <circle cx="190" cy="151" r="4.5" fill="#1d4ed8"/><circle cx="214" cy="139" r="4" fill="#7c3aed"/>
  <circle cx="124" cy="185" r="4" fill="#dc2626"/><circle cx="258" cy="117" r="4" fill="#dc2626"/>
  <text x="198" y="147" font-family="Arial, sans-serif" font-size="15" fill="#1d4ed8">C(1,−3)</text><text x="218" y="135" font-family="Arial, sans-serif" font-size="15" fill="#6d28d9">d=4</text><text x="53" y="215" font-family="Arial, sans-serif" font-size="15" fill="#0f766e">3x−4y+5=0</text><text x="96" y="240" font-family="Arial, sans-serif" font-size="14" fill="#b45309">d=2, 6 (접선)</text>
  <rect x="390" y="44" width="232" height="200" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="410" y="76" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="18" font-weight="700" fill="#1e3a5f">교점 수 세기</text>
  <text x="410" y="111" font-family="Arial, sans-serif" font-size="17">d=2: 1개</text><text x="410" y="142" font-family="Arial, sans-serif" font-size="17">d=3,4,5: 각 2개</text><text x="410" y="173" font-family="Arial, sans-serif" font-size="17">d=6: 1개</text>
  <line x1="410" y1="187" x2="600" y2="187" stroke="#cbd5e1"/><text x="410" y="218" font-family="Arial, sans-serif" font-size="17">1+2+2+2+1</text><text x="410" y="242" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="17" font-weight="700" fill="#b91c1c">=8  →  ⑤</text>
</svg>
