<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" width="760" height="320" role="img" aria-labelledby="title desc">
  <title id="title">OAP와 OMP의 닮음으로 삼각형 넓이 구하기</title>
  <desc id="desc">점 A에서 원에 그은 두 접선의 접점 P, Q와 AO와 PQ의 교점 M을 표시하고, OM, PM, PQ, AM의 길이 관계를 나타낸 그림이다.</desc>
  <rect width="760" height="320" fill="#fff"/>
  <text x="380" y="28" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="22" font-weight="700" fill="#1e3a5f">직각삼각형 OAP와 OMP의 닮음</text>
  <rect x="18" y="44" width="430" height="258" rx="8" fill="#f8fafc" stroke="#dbe3ef"/>
  <line x1="45" y1="250" x2="405" y2="250" stroke="#0f172a" stroke-width="1.2"/>
  <line x1="130" y1="278" x2="130" y2="62" stroke="#0f172a" stroke-width="1.2"/>
  <circle cx="130" cy="230" r="54" fill="#dbeafe" fill-opacity=".68" stroke="#2563eb" stroke-width="2.5"/>
  <line x1="130" y1="230" x2="206" y2="78" stroke="#64748b" stroke-width="1.8" stroke-dasharray="6 4"/>
  <line x1="92" y1="192" x2="183" y2="238" stroke="#dc2626" stroke-width="2.5"/>
  <line x1="206" y1="78" x2="92" y2="192" stroke="#0f766e" stroke-width="2.3"/>
  <line x1="206" y1="78" x2="183" y2="238" stroke="#f97316" stroke-width="2.3"/>
  <line x1="130" y1="230" x2="138" y2="215" stroke="#7c3aed" stroke-width="2.4"/>
  <line x1="138" y1="215" x2="92" y2="192" stroke="#16a34a" stroke-width="2.2"/>
  <path d="M132 222 l8 2 l-3 8" fill="none" stroke="#0f172a" stroke-width="1.5"/>
  <circle cx="130" cy="230" r="4" fill="#1d4ed8"/><circle cx="206" cy="78" r="5" fill="#dc2626"/>
  <circle cx="92" cy="192" r="4" fill="#0f766e"/><circle cx="183" cy="238" r="4" fill="#f97316"/><circle cx="138" cy="215" r="4" fill="#7c3aed"/>
  <text x="136" y="226" font-family="Arial, sans-serif" font-size="15" fill="#1d4ed8">O</text>
  <text x="211" y="74" font-family="Arial, sans-serif" font-size="15" fill="#b91c1c">A(2,4)</text>
  <text x="77" y="187" font-family="Arial, sans-serif" font-size="15" fill="#0f766e">P</text>
  <text x="188" y="242" font-family="Arial, sans-serif" font-size="15" fill="#c2410c">Q</text>
  <text x="142" y="211" font-family="Arial, sans-serif" font-size="15" fill="#6d28d9">M</text>
  <text x="132" y="216" font-family="Arial, sans-serif" font-size="13" fill="#6d28d9">OM</text>
  <text x="105" y="207" font-family="Arial, sans-serif" font-size="13" fill="#16a34a">PM</text>
  <text x="121" y="259" font-family="Arial, sans-serif" font-size="13" fill="#dc2626">PQ</text>
  <text x="171" y="145" font-family="Arial, sans-serif" font-size="13" fill="#64748b">AO</text>
  <rect x="468" y="44" width="274" height="258" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="488" y="75" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="18" font-weight="700" fill="#1e3a5f">닮음과 길이</text>
  <text x="488" y="105" font-family="Arial, sans-serif" font-size="15">OA=2√5, OP=√2</text>
  <text x="488" y="130" font-family="Arial, sans-serif" font-size="15">AP=√(20−2)=3√2</text>
  <text x="488" y="155" font-family="Arial, sans-serif" font-size="15">△OMP ∼ △OPA</text>
  <text x="488" y="180" font-family="Arial, sans-serif" font-size="15">OM/OP=OP/OA=PM/AP</text>
  <text x="488" y="205" font-family="Arial, sans-serif" font-size="15">OM=1/√5, PM=3/√5</text>
  <text x="488" y="230" font-family="Arial, sans-serif" font-size="15">PQ=2PM=6/√5</text>
  <text x="488" y="255" font-family="Arial, sans-serif" font-size="15">AM=AO−OM=9/√5</text>
  <line x1="488" y1="266" x2="722" y2="266" stroke="#cbd5e1"/>
  <text x="488" y="289" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="16" font-weight="700" fill="#b91c1c">넓이=½·PQ·AM=27/5</text>
</svg>
