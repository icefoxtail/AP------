<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 430" width="820" height="430" preserveAspectRatio="xMidYMid meet" role="img" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-axis-scale-mode="EQUAL_UNIT"><title>삼각형 ABC와 내분점 P</title><desc>A(0,0), B(8,0), P(6,0), C=(2,-2√3)를 동일 축척으로 표시하고 AP:PB=3:1과 CP를 나타낸다.</desc><style>.axis{font:italic 14px serif;fill:#111827}.label{font:600 12px "Malgun Gothic",sans-serif}.note{font:12px "Malgun Gothic",sans-serif;fill:#334155}.head{font:700 17px "Malgun Gothic",sans-serif;fill:#0f172a}</style><rect width="820" height="430" fill="#fff"/><text x="28" y="32" class="head">삼각형 ABC의 내분점 P와 CP</text><text x="28" y="54" class="note">원본 방향대로 C는 AB 아래, P는 AB를 3:1로 내분</text><rect x="28" y="70" width="530" height="320" rx="12" fill="#fff" stroke="#cbd5e1"/><g data-origin-x="100" data-origin-y="170" data-sx="40" data-sy="40"><line x1="48" y1="170" x2="528" y2="170" stroke="#111827" stroke-width="1.4"/><line x1="100" y1="90" x2="100" y2="370" stroke="#111827" stroke-width="1.4"/><text x="518" y="162" class="axis">x</text><text x="108" y="104" class="axis">y</text><polygon points="100,170 420,170 180,308.6" fill="#dbeafe" fill-opacity=".5" stroke="#2563eb" stroke-width="2.6"/><line x1="100" y1="170" x2="340" y2="170" stroke="#16a34a" stroke-width="5"/><line x1="340" y1="170" x2="420" y2="170" stroke="#f59e0b" stroke-width="5"/><line x1="180" y1="308.6" x2="340" y2="170" stroke="#dc2626" stroke-width="3"/><circle data-point-label="A" data-point-x="0" data-point-y="0" cx="100" cy="170" r="6" fill="#111827"/><text x="108" y="162" class="label">A(0,0)</text><circle data-point-label="P" data-point-x="6" data-point-y="0" cx="340" cy="170" r="6" fill="#dc2626"/><text x="348" y="162" class="label" fill="#b91c1c">P(6,0)</text><circle data-point-label="B" data-point-x="8" data-point-y="0" cx="420" cy="170" r="6" fill="#111827"/><text x="428" y="162" class="label">B(8,0)</text><circle data-point-label="C" data-point-x="2" data-point-y="-3.46410162" cx="180" cy="308.6" r="6" fill="#111827"/><text x="188" y="326.6" class="label">C(2,-2√3)</text></g><rect x="582" y="70" width="210" height="320" rx="12" fill="#f8fafc" stroke="#dbe3ef"/><text x="602" y="100" class="head">주어진 길이와 계산</text><text x="602" y="138" class="note">AB=8, AC=4</text><text x="602" y="166" class="note">BC=4√3</text><text x="602" y="204" class="note">AP:PB=3:1</text><text x="602" y="232" class="note">P=(6,0)</text><text x="602" y="270" class="note">CP²=28</text><text x="602" y="298" class="note">CP=2√7</text><text x="602" y="326" class="note">sx=sy=40</text></svg>