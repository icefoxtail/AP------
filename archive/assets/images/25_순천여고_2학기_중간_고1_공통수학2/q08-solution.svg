<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 430" width="820" height="430" preserveAspectRatio="xMidYMid meet" role="img" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-axis-scale-mode="EQUAL_UNIT"><title>삼각형 ABC와 내분점 P</title><desc>원본 그림과 같은 방향으로 C를 AB 아래에 두고 A(0,0), B(8,0), P(6,0), C=(2,-2√3)를 표시한다.</desc><style>.axis{font:italic 14px serif;fill:#111827}.label{font:600 13px "Malgun Gothic",sans-serif}.note{font:12px "Malgun Gothic",sans-serif;fill:#334155}.head{font:700 17px "Malgun Gothic",sans-serif;fill:#0f172a}</style><rect width="820" height="430" fill="#fff"/><text x="28" y="32" class="head">삼각형 ABC의 내분점 P와 CP</text><text x="28" y="54" class="note">원본 문제 그림처럼 C는 AB 아래에 있고, P는 AB를 3:1로 내분한다.</text><rect x="28" y="70" width="530" height="320" rx="12" fill="#fff" stroke="#cbd5e1"/><g stroke="#e5e7eb" stroke-width="1"><line x1="48" y1="110" x2="528" y2="110"/><line x1="48" y1="160" x2="528" y2="160"/><line x1="48" y1="210" x2="528" y2="210"/><line x1="48" y1="260" x2="528" y2="260"/><line x1="48" y1="310" x2="528" y2="310"/><line x1="48" y1="360" x2="528" y2="360"/><line x1="48" y1="90" x2="48" y2="375"/><line x1="98" y1="90" x2="98" y2="375"/><line x1="148" y1="90" x2="148" y2="375"/><line x1="198" y1="90" x2="198" y2="375"/><line x1="248" y1="90" x2="248" y2="375"/><line x1="298" y1="90" x2="298" y2="375"/><line x1="348" y1="90" x2="348" y2="375"/><line x1="398" y1="90" x2="398" y2="375"/><line x1="448" y1="90" x2="448" y2="375"/><line x1="498" y1="90" x2="498" y2="375"/></g><line x1="48" y1="160" x2="528" y2="160" stroke="#111827" stroke-width="1.4"/><line x1="98" y1="90" x2="98" y2="375" stroke="#111827" stroke-width="1.4"/><text x="518" y="152" class="axis">x</text><text x="106" y="105" class="axis">y</text><polygon points="98,160 498,160 198,283.4" fill="#dbeafe" fill-opacity=".5" stroke="#2563eb" stroke-width="2.6"/><line data-geometry="segment" x1="198" y1="283.4" x2="398" y2="160" stroke="#dc2626" stroke-width="3"/><line x1="98" y1="160" x2="498" y2="160" stroke="#111827" stroke-width="4"/><line x1="98" y1="172" x2="398" y2="172" stroke="#16a34a" stroke-width="4"/><line x1="398" y1="172" x2="498" y2="172" stroke="#f59e0b" stroke-width="4"/><circle data-point-label="A" data-point-x="0" data-point-y="0" cx="98" cy="160" r="5" fill="#111827"/><text x="106" y="151" class="label">A(0,0)</text><circle data-point-label="P" data-point-x="6" data-point-y="0" cx="398" cy="160" r="6" fill="#dc2626"/><text x="406" y="151" class="label" fill="#b91c1c">P(6,0)</text><circle data-point-label="B" data-point-x="8" data-point-y="0" cx="498" cy="160" r="5" fill="#111827"/><text x="506" y="151" class="label">B(8,0)</text><circle data-point-label="C" data-point-x="2" data-point-y="-3.4641016" cx="198" cy="283.4" r="5" fill="#111827"/><text x="206" y="302" class="label">C(2,-2√3)</text><text x="244" y="300" class="note" fill="#b91c1c">CP</text><text x="220" y="148" class="note" fill="#15803d">AP:PB=3:1</text><rect x="582" y="70" width="210" height="320" rx="12" fill="#f8fafc" stroke="#dbe3ef"/><text x="602" y="100" class="head">주어진 길이와 계산</text><text x="602" y="138" class="note">AB=8</text><text x="602" y="166" class="note">AC=4</text><text x="602" y="194" class="note">BC=4√3</text><text x="602" y="222" class="note">u=2</text><text x="602" y="250" class="note">v²=12</text><text x="602" y="278" class="note">P=(6,0)</text><text x="602" y="306" class="note">CP²=16+12=28</text><text x="602" y="334" class="note">CP=2√7</text></svg>
