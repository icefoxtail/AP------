<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 430" width="820" height="430" preserveAspectRatio="xMidYMid meet" role="img" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-axis-scale-mode="EQUAL_UNIT"><title>무게중심과 중선의 내분</title><desc>A(12,-2), G(6,4), M(3,7)가 중선 AM 위에 A-G-M 순서로 놓이고 AG:GM=2:1임을 동일 축척으로 나타낸다.</desc><style>.axis{font:italic 14px serif;fill:#111827}.label{font:600 12px "Malgun Gothic",sans-serif}.note{font:12px "Malgun Gothic",sans-serif;fill:#334155}.head{font:700 17px "Malgun Gothic",sans-serif;fill:#0f172a}</style><rect width="820" height="430" fill="#fff"/><text x="28" y="32" class="head">중선 AM 위의 무게중심 G</text><text x="28" y="54" class="note">A-G-M의 순서와 AG:GM=2:1을 좌표평면에서 확인</text><rect x="28" y="70" width="530" height="320" rx="12" fill="#fff" stroke="#cbd5e1"/><g data-origin-x="100" data-origin-y="330" data-sx="20" data-sy="20"><line x1="48" y1="330" x2="528" y2="330" stroke="#111827" stroke-width="1.4"/><line x1="100" y1="90" x2="100" y2="375" stroke="#111827" stroke-width="1.4"/><text x="518" y="322" class="axis">x</text><text x="108" y="104" class="axis">y</text><line data-geometry="line" data-equation="y=-x+10" x1="120" y1="150" x2="380" y2="410" stroke="#2563eb" stroke-width="3"/><line x1="340" y1="370" x2="220" y2="250" stroke="#16a34a" stroke-width="5"/><line x1="220" y1="250" x2="160" y2="190" stroke="#f59e0b" stroke-width="5"/><circle data-point-label="A" data-point-x="12" data-point-y="-2" cx="340" cy="370" r="6" fill="#111827"/><text x="348" y="364" class="label">A(12,-2)</text><circle data-point-label="G" data-point-x="6" data-point-y="4" cx="220" cy="250" r="6" fill="#dc2626"/><text x="228" y="244" class="label" fill="#b91c1c">G(6,4)</text><circle data-point-label="M" data-point-x="3" data-point-y="7" cx="160" cy="190" r="6" fill="#111827"/><text x="168" y="184" class="label">M(3,7)</text></g><rect x="582" y="70" width="210" height="320" rx="12" fill="#f8fafc" stroke="#dbe3ef"/><text x="602" y="100" class="head">좌표 관계</text><text x="602" y="138" class="note">A-G-M</text><text x="602" y="166" class="note">AG:GM=2:1</text><text x="602" y="204" class="note">6=(xA+2·3)/3</text><text x="602" y="232" class="note">xA=12</text><text x="602" y="270" class="note">4=(yA+2·7)/3</text><text x="602" y="298" class="note">yA=-2</text><text x="602" y="326" class="note">sx=sy=20</text></svg>