"138" y1="240" x2="248" y2="195" stroke="#16a34a" stroke-width="5"/><line x1="248" y1="195" x2="348" y2="145" stroke="#f59e0b" stroke-width="5"/><circle data-point-label="A" data-point-x="12" data-point-y="-2" cx="448" cy="320" r="6" fill="#111827"/><text x="358" y="338" class="label">A(12,-2)</text><circle data-point-label="G" data-point-x="6" data-point-y="4" cx="248" cy="180" r="6" fill="#dc2626"/><text x="256" y="174" class="label" fill="#b91c1c">G(6,4)</text><circle data-point-label="M" data-point-x="3" data-point-y="7" cx="148" cy="105" r="6" fill="#111827"/><text x="156" y="101" class="label">M(3,7)</text><text x="170" y="225" class="note" fill="#15803d">AG</text><text x="296" y="175" class="note" fill="#b45309">GM</text><rect x="582" y="70" width="210" height="320" rx="12" fill="#f8fafc" stroke="#dbe3ef"/><text x="602" y="100" class="head">좌표 관계</text><text x="602" y="138" class="note">A-G-M</text><text x="602" y="166" class="note">AG:GM=2:1</text><text x="602" y="204" class="note">x: 6=(xA+2·3)/3</text><text x="602" y="232" class="note">xA=12</text><text x="602" y="270" class="note">y: 4=(yA+2·7)/3</text><text x="602" y="298" class="note">yA=-2</text><text x="602" y="334" class="note">A=(12,-2)</text></svg>
