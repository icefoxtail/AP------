<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 694 307" width="694" height="307" role="img" aria-labelledby="title desc"><title id="title">같은 해의 시작점을 나타내는 두 표현</title><desc id="desc">수직선의 −1에서 오른쪽으로 뻗는 범위이다. −1을 포함하는 닫힌 점이고 같은 경계점을 (a+4)/4로도 나타냈다.</desc><rect width="694" height="307" fill="white" /><line x1="62.0000" y1="197.0000" x2="630.0000" y2="197.0000" stroke="#677989" stroke-width="2.15" stroke-linecap="round" /><line x1="82.0000" y1="197.0000" x2="60.0000" y2="197.0000" stroke="#677989" stroke-width="2.15" stroke-linecap="round" /><polygon points="47.0000,197.0000 60.0000,202.2000 60.0000,191.8000" fill="#677989" /><line x1="610.0000" y1="197.0000" x2="632.0000" y2="197.0000" stroke="#677989" stroke-width="2.15" stroke-linecap="round" /><polygon points="645.0000,197.0000 632.0000,191.8000 632.0000,202.2000" fill="#677989" /><line x1="86.0000" y1="191.0000" x2="86.0000" y2="203.0000" stroke="#677989" stroke-width="1.85" stroke-linecap="round" /><text x="86.0000" y="236.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#293b4a" text-anchor="middle">−3</text><line x1="172.6667" y1="191.0000" x2="172.6667" y2="203.0000" stroke="#677989" stroke-width="1.85" stroke-linecap="round" /><text x="172.6667" y="236.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#293b4a" text-anchor="middle">−2</text><line x1="259.3333" y1="191.0000" x2="259.3333" y2="203.0000" stroke="#677989" stroke-width="1.85" stroke-linecap="round" /><text x="259.3333" y="236.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#293b4a" text-anchor="middle">−1</text><line x1="346.0000" y1="191.0000" x2="346.0000" y2="203.0000" stroke="#677989" stroke-width="1.85" stroke-linecap="round" /><text x="346.0000" y="236.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#293b4a" text-anchor="middle">0</text><line x1="432.6667" y1="191.0000" x2="432.6667" y2="203.0000" stroke="#677989" stroke-width="1.85" stroke-linecap="round" /><text x="432.6667" y="236.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#293b4a" text-anchor="middle">1</text><line x1="519.3333" y1="191.0000" x2="519.3333" y2="203.0000" stroke="#677989" stroke-width="1.85" stroke-linecap="round" /><text x="519.3333" y="236.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#293b4a" text-anchor="middle">2</text><line x1="606.0000" y1="191.0000" x2="606.0000" y2="203.0000" stroke="#677989" stroke-width="1.85" stroke-linecap="round" /><text x="606.0000" y="236.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#293b4a" text-anchor="middle">3</text><polygon points="259.3333,197.0000 636.0000,197.0000 636.0000,130.0000 259.3333,130.0000" fill="none" /><line x1="259.3333" y1="197.0000" x2="259.3333" y2="130.0000" stroke="#23639b" stroke-width="3.45" stroke-linecap="round" /><line x1="259.3333" y1="130.0000" x2="619.0000" y2="130.0000" stroke="#23639b" stroke-width="4.2" stroke-linecap="round" /><polygon points="636.0000,130.0000 619.0000,123.2000 619.0000,136.8000" fill="#23639b" /><circle cx="259.33333333333337" cy="197" r="7.5" fill="#23639b" stroke="#23639b" stroke-width="3.2" /><text x="660.0000" y="181.0000" font-size="30" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#677989" text-anchor="middle">x</text><text x="265.0000" y="84.0000" font-size="30" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#293b4a" text-anchor="middle">(a + 4)/4</text></svg>
