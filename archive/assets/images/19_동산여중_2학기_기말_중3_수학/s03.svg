<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 340" role="img" aria-labelledby="t d"><title id="t">기울기 60도이고 x절편이 −2인 직선</title><desc id="d">직선은 (−2,0)을 지나고 x축과 양의 방향으로 60°를 이룸</desc><rect width="520" height="340" fill="white"/><style>text{font-family:'Noto Sans KR','Malgun Gothic',sans-serif;font-size:17px;fill:#111}.line{stroke:#111;stroke-width:2.3;fill:none}.aux{stroke:#555;stroke-width:1.5;stroke-dasharray:6 5;fill:none}</style><line class="line" x1="60" y1="260" x2="470" y2="260"/><line class="line" x1="220" y1="310" x2="220" y2="45"/><line class="line" x1="150" y1="260" x2="300" y2="0"/><line class="aux" x1="150" y1="260" x2="220" y2="260"/><line class="aux" x1="220" y1="260" x2="220" y2="139"/><text x="150" y="286" text-anchor="middle">−2</text><text x="462" y="282" text-anchor="middle">x</text><text x="226" y="55" text-anchor="start">y</text><text x="177" y="238" text-anchor="middle">60°</text></svg>