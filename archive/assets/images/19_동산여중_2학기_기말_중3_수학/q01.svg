<svg xmlns="http://www.w3.org/2000/svg" width="540" height="410" viewBox="0 0 540 410" role="img" aria-labelledby="title desc">
  <title id="title">q01: similar right triangles</title>
  <desc id="desc">Right triangle ADE with right angle at D. B lies on AE, C lies on AD, and BC is parallel to DE. AB is 5 cm and AC is 4 cm.</desc>
  <rect width="540" height="410" fill="#ffffff"/>
  <g stroke="#1f2937" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Outer right triangle ADE and inner right triangle ABC -->
    <path d="M70 320 L430 320 L430 50 Z"/>
    <path d="M310 140 L310 320"/>
    <!-- right-angle markers at C and D -->
    <path d="M310 320 L310 300 L330 300 L330 320" stroke-width="2"/>
    <path d="M430 320 L410 320 L410 300 L430 300" stroke-width="2"/>
    <!-- matching parallel marks on BC and DE -->
    <path d="M303 220 L317 220 M423 220 L437 220" stroke-width="2"/>
  </g>
  <g fill="#111827" font-family="Arial, sans-serif" font-size="21">
    <text x="50" y="345">A</text>
    <text x="300" y="133">B</text>
    <text x="297" y="350">C</text>
    <text x="438" y="344">D</text>
    <text x="438" y="55">E</text>
  </g>
  <g fill="#374151" font-family="Arial, sans-serif" font-size="18">
    <text x="161" y="236" transform="rotate(-36.9 161 236)">5 cm</text>
    <text x="168" y="350">4 cm</text>
    <text x="151" y="388" font-size="16">BC ∥ DE</text>
  </g>
</svg>
