nchor="middle">B</text><circle cx="315.0" cy="248.5" r="4.9" fill="#28364b" /><text x="327.0000" y="234.5000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">O</text><circle cx="253.66666666666666" cy="248.5" r="4.9" fill="#28364b" /><text x="231.6667" y="234.5000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">M</text><circle cx="253.66666666666666" cy="75.02313634890032" r="4.9" fill="#28364b" /><text x="263.6667" y="59.0231" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">C</text><circle cx="253.66666666666666" cy="421.9768636510997" r="4.9" fill="#28364b" /><text x="266.6667" y="447.9769" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">D</text></svg>
