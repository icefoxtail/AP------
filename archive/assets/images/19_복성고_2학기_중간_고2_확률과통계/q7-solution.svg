<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 440" width="440" height="440" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">두 정사각형과 원이 만드는 영역은 큰 정사각형 안쪽의 네 삼각형과 가운데 마름모, 원과 큰 정사각형 사이의 네 활꼴을 합해 9개이다. 9가지 색을 모두 한 번씩 쓰는 배치는 9!가지이고, 90도씩 회전한 네 배치가 같은 문양이 된다. 모든 색이 달라 90도, 180도, 270도 회전이 색 배치를 그대로 두지 않으므로 9!을 4로 나눈다. 따라서 답은 ①이다.</title><desc id="visual-desc">원 안에 정사각형이 내접하고, 그 정사각형의 각 변의 중점을 이은 마름모가 있으며, 원 위의 한 사분원에 90도 호가 표시되어 있다.</desc><rect width="440" height="440" fill="#fff"/><g data-layer="30"><line id="sP1P2" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="327.173897083" y1="123.328289648" x2="112.826102917" y2="123.328289648"/></g><g data-layer="30"><line id="sP2P3" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="112.826102917" y1="123.328289648" x2="112.826102917" y2="337.676083813"/></g><g data-layer="30"><line id="sP3P4" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="112.826102917" y1="337.676083813" x2="327.173897083" y2="337.676083813"/></g><g data-layer="30"><line id="sP4P1" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="327.173897083" y1="337.676083813" x2="327.173897083" y2="123.328289648"/></g><g data-layer="30"><line id="sQ1Q2" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="220" y1="123.328289648" x2="112.826102917" y2="23