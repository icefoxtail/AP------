<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 420" width="500" height="420" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">가운데가 뚫린 원기둥을 위에서 본 모양으로, 바깥 원의 반지름은 16.5 cm, 안쪽 원의 반지름은 13.5 cm이다. 오른쪽의 점선 선분은 원기둥의 높이 10 cm를 나타낸다.</title><desc id="visual-desc">두 개의 동심원이 있고, 중심에서 바깥 원과 안쪽 원까지 그은 두 반지름 및 오른쪽 세로 점선이 보인다. 반지름과 높이의 길이가 각각 16.5 cm, 13.5 cm, 10 cm로 적혀 있다.</desc><rect width="500" height="420" fill="#fff"/><g data-layer="30"><line id="sOR" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="241.630094044" y1="210" x2="395.078369906" y2="210"/></g><g data-layer="30"><line id="sOL" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="241.630094044" y1="210" x2="116.081504702" y2="210"/></g><g data-layer="30"><line id="sRH" data-role="line" stroke="#111" stroke-width="1.6" fill="none" stroke-dasharray="6 4" x1="395.078369906" y1="210" x2="395.078369906" y2="117.001044932"/></g><g data-layer="40"><circle id="cOuter" data-role="circle" stroke="#111" stroke-width="2.05" fill="none" cx="241.630094044" cy="210" r="153.448275862"/></g><g data-layer="40"><circle id="cInner" data-role="circle" stroke="#111" stroke-width="2.05" fill="none" cx="241.630094044" cy="210" r="125.548589342"/></g><g data-layer="85"><line id="lInner-owner-leader" data-role="leader" data-owner-label="lInner" data-owner="sOL" x1="178.855