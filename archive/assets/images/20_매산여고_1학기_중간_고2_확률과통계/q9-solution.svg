<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 420" width="700" height="420" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">10명을 일렬로 앉히는 배열은 10!가지이다. 직사각형 탁자는 180° 회전한 배열과만 겹치므로 서로 다른 배열은 10!을 2로 나눈 5×9!가지이다. 따라서 답은 ④이다.</title><desc id="visual-desc">직사각형 탁자 둘레에 번호가 붙은 열 개의 좌석이 위아래에 세 개씩, 좌우에 두 개씩 배치되어 있다.</desc><rect width="700" height="420" fill="#fff"/><g data-layer="30"><line id="sT12" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="108.928571429" y1="301.071428571" x2="591.071428571" y2="301.071428571"/></g><g data-layer="30"><line id="sT23" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="591.071428571" y1="301.071428571" x2="591.071428571" y2="140.357142857"/></g><g data-layer="30"><line id="sT34" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="591.071428571" y1="140.357142857" x2="108.928571429" y2="140.357142857"/></g><g data-layer="30"><line id="sT41" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="108.928571429" y1="140.357142857" x2="108.928571429" y2="301.071428571"/></g><g data-layer="90"><g id="n1" data-label-kind="EQUATION_LABEL" data-priority="1" data-font-px="31.2" data-owner="n1" data-fragment-sha="sha256:6b9fd016d6add6e9c56b537bb32f47df0ee8d580cfa4bfa1ea9a416211a26bd8" data-text="1" transform="translate(207.943828571 64.196914286)"><svg 