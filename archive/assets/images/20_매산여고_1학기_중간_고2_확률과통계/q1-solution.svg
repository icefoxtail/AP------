<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 440" width="440" height="440" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">일렬 배열에서는 첫 자리가 달라지면 다른 배열이므로 ABCD와 BCDA는 다르다. 원형 배열에서는 한 자리씩 회전한 BCDA를 ABCD와 같은 것으로 본다. 서로 다른 n개를 원형으로 배열하면 회전하여 같아지는 경우가 n가지씩 생기므로 회전 중복을 n으로 나눈다. 따라서 세 진술 ㄱ, ㄴ, ㄷ이 모두 옳다. 따라서 답은 ①이다.</title><desc id="visual-desc">원 위에 A, B, C, D가 차례로 놓여 있고, A와 B 사이에 한 칸 회전을 나타내는 파란 호가 있다.</desc><rect width="440" height="440" fill="#fff"/><g data-layer="40"><circle id="k" data-role="circle" stroke="#111" stroke-width="2.05" fill="none" cx="177.290382275" cy="220" r="129.723555602"/></g><g data-layer="46"><polyline id="arcOne" data-role="circularArc" stroke="#1f5fa8" stroke-width="3.2" fill="none" data-owner-points="A B" data-center-point="O" data-owner-radius="6.0" data-sweep="CW" data-mark="arc" data-mark-id="arcOne" points="177.290382275,90.276444398 183.655615454,90.432702101 190.005514228,90.901098775 196.324781136,91.680506009 202.59819251,92.769046144 208.810635153,94.16409679 214.947142745,95.862297149 220.992931903,97.859556108 226.933437791,100.151062094 232.75434921,102.731294669 238.441643075,105.594037827 243.981618196,108.732394969 249.360928289,112.138805517 254.566614123,115.80506313 259.586134747,119.722335472 264.407397694,123.881185491 269.018788121,128.271594154 273.409196783,132.882984581 277.56804680