<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 480" width="560" height="480" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">OA=u, OB=v로 두면 |u|=|v|=1이고 u·v=1/2이다. 좌표로 x=(3, 3√3)이고 이는 6v와 같다. 점 X는 반직선 OB 위에서 OX=6인 점이고 BX=5이다. 점선 AX의 길이는 |u−x|=|u−6v|이고 |u−6v|²=1+36−6=31이다. 따라서 답은 ①이다.</title><desc id="visual-desc">원점 O에서 길이 1인 OA와 OB가 60°를 이루고, OB의 연장선 위에 OX=6인 점 X가 있다. A와 X를 점선이 잇고 길이가 표시되어 있다.</desc><rect width="560" height="480" fill="#fff"/><g data-layer="30"><line id="OA" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="172.77780715" y1="425.714285714" x2="244.25926905" y2="425.714285714"/></g><g data-layer="30"><line id="OB" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="172.77780715" y1="425.714285714" x2="208.5185381" y2="363.80952381"/></g><g data-layer="30"><line id="BX" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="208.5185381" y1="363.80952381" x2="387.22219285" y2="54.285714286"/></g><g data-layer="30"><line id="AX" data-role="line" stroke="#111" stroke-width="1.6" fill="none" stroke-dasharray="6 4" x1="244.25926905" y1="425.714285714" x2="387.22219285" y2="54.285714286"/></g><g data-layer="60"><polyline id="th-arc-1" data-role="indicator" stroke="#111" stroke-width="1.6" fill="none" data-owner-points="A O B" data-mark="angle" data-mark-id="th" data-mark-index="