<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">타원의 두 초점과 중심</title><desc id="desc">가로축 길이 2루트45, 세로축 길이 2루트20인 타원과 초점 F와 F 프라임을 표시한다.</desc><rect width="640" height="360" fill="#fff"/><text x="30" y="34" font-size="19" font-family="sans-serif" font-weight="700">타원의 장축과 초점</text><line x1="105" y1="185" x2="535" y2="185" stroke="#777"/><line x1="320" y1="70" x2="320" y2="300" stroke="#777"/><ellipse cx="320" cy="185" rx="190" ry="126.67" fill="#eff6ff" stroke="#1d4ed8" stroke-width="3"/><circle cx="320" cy="185" r="5" fill="#111"/><circle cx="178.58" cy="185" r="6" fill="#dc2626"/><circle cx="461.42" cy="185" r="6" fill="#dc2626"/><text x="308" y="207" font-size="16" font-family="sans-serif">O</text><text x="153" y="174" font-size="16" font-family="sans-serif">F′</text><text x="466" y="174" font-size="16" font-family="sans-serif">F</text><text x="180" y="246" font-size="16" font-family="sans-serif">c=5</text><text x="30" y="314" font-size="17" font-family="sans-serif">c²=45−20=25,  FF′=2c=10</text></svg>