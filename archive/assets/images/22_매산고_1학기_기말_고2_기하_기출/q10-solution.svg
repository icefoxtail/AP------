<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="svg-title-55b61a8ad5" aria-describedby="svg-desc-55b61a8ad5">
<title id="svg-title-55b61a8ad5">구와 xz평면의 단면</title>
<desc id="svg-desc-55b61a8ad5">중심 C(4,3,1)인 구를 xz평면으로 자를 때, 중심에서 평면까지 거리 d=3과 단면 반지름 ρ=√2를 나타낸다.</desc><path d="M360 45 L360 315" fill="none" stroke="#2457a6" stroke-width="3"/><ellipse cx="360" cy="180" rx="10" ry="71" fill="#eef4fb" stroke="#2457a6" stroke-width="2"/><circle cx="210" cy="180" r="166" fill="none" stroke="#788593" stroke-width="2"/>
<path d="M210 180 L360 180 M360 180 L360 251" fill="none" stroke="#b64a3a" stroke-width="2"/><circle cx="210" cy="180" r="4" fill="#171717"/><circle cx="360" cy="180" r="4" fill="#171717"/>
<g font-family="Arial,sans-serif" font-size="19" fill="#171717"><text x="132" y="166">C(4,3,1)</text><text x="369" y="66">xz평면</text><text x="272" y="169">d=3</text><text x="367" y="240">ρ=√2</text><text x="385" y="330">r²=11, ρ²=r²-d²=2</text></g></svg>