<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 384 320" width="384" height="320" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">AB=9cm는 지름이므로 반지름 OC=OA=4.5cm이다. OC⊥CT와 AH⊥CT에서 수직 높이 차는 6−4.5=1.5cm이고 CH²=4.5²−1.5²=18, 따라서 CH=3√2cm이다.</title><desc id="visual-desc">원 O에 지름 AB와 원 위 점 C가 보이고 C를 지나는 수평 접선이 T, C, H를 잇는다. A에서 H로 내린 수선은 6cm, 지름 AB는 9cm, 반지름 OC는 4.5cm이고 밑변 CH에 3√2cm가 직접 표시된다. 접선의 직각 세 위치는 작은 정사각형으로 나타난다.</desc><rect width="384" height="320" fill="#fff"/><g data-layer="30"><line id="AB" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="309.553232169" y1="118.516261518" x2="114.784659908" y2="187.377350622"/></g><g data-layer="30"><line id="AC" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="309.553232169" y1="118.516261518" x2="212.168946039" y2="256.238439726"/></g><g data-layer="30"><line id="BC" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="114.784659908" y1="187.377350622" x2="212.168946039" y2="256.238439726"/></g><g data-layer="30"><line id="OA" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="212.168946039" y1="152.94680607" x2="309.553232169" y2="118.516261518"/></g><g data-layer="30"><line id="OC" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="212.168946039" y1="152.94680607" x2="212.168946039" y2="256.238439726"/></g><g data-l