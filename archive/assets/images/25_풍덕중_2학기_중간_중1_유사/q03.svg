<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" width="500" height="120" role="img" aria-labelledby="q03-title q03-desc">
  <title id="q03-title">선분 AB와 중점 M, N</title>
  <desc id="q03-desc">선분 AB 위의 중점 M과 선분 MB의 중점 N</desc>
  <rect width="500" height="120" fill="#ffffff"/>
  <line x1="50" y1="60" x2="450" y2="60" stroke="#222222" stroke-width="2.5"/>
  <circle cx="50" cy="60" r="4.5" fill="#222222"/>
  <circle cx="250" cy="60" r="4.5" fill="#222222"/>
  <circle cx="350" cy="60" r="4.5" fill="#222222"/>
  <circle cx="450" cy="60" r="4.5" fill="#222222"/>
  <line x1="50" y1="52" x2="50" y2="68" stroke="#222222" stroke-width="2"/>
  <line x1="250" y1="52" x2="250" y2="68" stroke="#222222" stroke-width="2"/>
  <line x1="350" y1="52" x2="350" y2="68" stroke="#222222" stroke-width="2"/>
  <line x1="450" y1="52" x2="450" y2="68" stroke="#222222" stroke-width="2"/>
  <g font-family="sans-serif" font-size="16" font-weight="bold" fill="#111111" text-anchor="middle">
    <text x="50" y="40">A</text>
    <text x="250" y="40">M</text>
    <text x="350" y="40">N</text>
    <text x="450" y="40">B</text>
    <text x="400" y="88" font-size="14" fill="#1f5fa8">4 cm</text>
  </g>
</svg>