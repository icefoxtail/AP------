<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" width="600" height="200" role="img" aria-labelledby="q01-title q01-desc">
  <title id="q01-title">세 평면도형 및 입체도형</title>
  <desc id="q01-desc">도형 1 사각형, 도형 2 원, 도형 3 삼각뿔을 나타낸 그림</desc>
  <rect width="600" height="200" fill="#ffffff"/>
  <!-- 도형 1: 사각형 -->
  <polygon points="50,150 70,70 150,60 170,150" fill="none" stroke="#222222" stroke-width="2"/>
  <circle cx="50" cy="150" r="4" fill="#222222"/>
  <circle cx="70" cy="70" r="4" fill="#222222"/>
  <circle cx="150" cy="60" r="4" fill="#222222"/>
  <circle cx="170" cy="150" r="4" fill="#222222"/>
  <text x="110" y="180" font-family="sans-serif" font-size="14" font-weight="bold" fill="#111111" text-anchor="middle">&lt;도형 1&gt;</text>
  
  <!-- 도형 2: 원 -->
  <circle cx="300" cy="105" r="50" fill="none" stroke="#222222" stroke-width="2"/>
  <text x="300" y="180" font-family="sans-serif" font-size="14" font-weight="bold" fill="#111111" text-anchor="middle">&lt;도형 2&gt;</text>
  
  <!-- 도형 3: 삼각뿔 -->
  <polygon points="500,40 440,140 520,155" fill="none" stroke="#222222" stroke-width="2"/>
  <line x1="500" y1="40" x2="560" y2="130" stroke="#222222" stroke-width="2"/>
  <line x1="520" y1="155" x2="560" y2="130" stroke="#222222" stroke-width="2"/>
  <line x1="440" y1="140" x2="560" y2="130" stroke="#888888" stroke-width="2" stroke-dasharray="4,4"/>
  <circle cx="500" cy="40" r="4" fill="#222222"/>
  <circle cx="440" cy="140" r="4" fill="#222222"/>
  <circle cx="520" cy="155" r="4" fill="#222222"/>
  <circle cx="560" cy="130" r="4" fill="#222222"/>
  <text x="500" y="180" font-family="sans-serif" font-size="14" font-weight="bold" fill="#111111" text-anchor="middle">&lt;도형 3&gt;</text>
</svg>