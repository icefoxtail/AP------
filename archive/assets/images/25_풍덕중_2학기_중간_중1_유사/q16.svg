<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 300" width="450" height="300" role="img" aria-labelledby="q16-title q16-desc">
  <title id="q16-title">두 정삼각형의 회전과 합동</title>
  <desc id="q16-desc">공통 꼭짓점 A를 갖는 두 정삼각형 ABC와 ADE에서 선분 BD 위의 점 E와 선분 CD의 관계도</desc>
  <rect width="450" height="300" fill="#ffffff"/>
  <!-- Triangle ABC: A=(180,77), B=(80,250), C=(280,250) -->
  <polygon points="180,77 80,250 280,250" fill="none" stroke="#222222" stroke-width="2"/>
  <!-- Triangle ADE: A=(180,77), D=(267,116), E=(189,172) -->
  <polygon points="180,77 267,116 189,172" fill="none" stroke="#1f5fa8" stroke-width="2"/>
  <!-- Straight line B-E-D -->
  <line x1="80" y1="250" x2="267" y2="116" stroke="#222222" stroke-width="2"/>
  <!-- Segment CD -->
  <line x1="280" y1="250" x2="267" y2="116" stroke="#e67e22" stroke-width="2" stroke-dasharray="4,4"/>
  <circle cx="180" cy="77" r="4.5" fill="#222222"/>
  <circle cx="80" cy="250" r="4.5" fill="#222222"/>
  <circle cx="280" cy="250" r="4.5" fill="#222222"/>
  <circle cx="267" cy="116" r="4.5" fill="#222222"/>
  <circle cx="189" cy="172" r="4.5" fill="#222222"/>
  <g font-family="sans-serif" font-size="16" font-weight="bold" fill="#111111">
    <text x="175" y="60">A</text>
    <text x="60" y="265">B</text>
    <text x="290" y="265">C</text>
    <text x="280" y="115">D</text>
    <text x="175" y="190">E</text>
    <text x="230" y="90" font-size="13" fill="#1f5fa8">5 cm</text>
    <text x="120" y="200" font-size="13" fill="#1f5fa8">12 cm</text>
  </g>
</svg>
