<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 350" width="450" height="350" role="img" aria-labelledby="q07-title q07-desc">
  <title id="q07-title">사각기둥 ABCD-EFGH</title>
  <desc id="q07-desc">사각기둥의 꼭짓점과 모서리를 나타낸 겨냥도</desc>
  <rect width="450" height="350" fill="#ffffff"/>
  <!-- 윗면 ABCD: A=(120,90), B=(280,90), C=(350,50), D=(190,50) -->
  <!-- 아랫면 EFGH: E=(120,250), F=(280,250), G=(350,210), H=(190,210) -->
  <polygon points="120,90 280,90 350,50 190,50" fill="none" stroke="#222222" stroke-width="2"/>
  <!-- 외곽선 -->
  <line x1="120" y1="90" x2="120" y2="250" stroke="#222222" stroke-width="2"/>
  <line x1="280" y1="90" x2="280" y2="250" stroke="#222222" stroke-width="2"/>
  <line x1="350" y1="50" x2="350" y2="210" stroke="#222222" stroke-width="2"/>
  <line x1="120" y1="250" x2="280" y2="250" stroke="#222222" stroke-width="2"/>
  <line x1="280" y1="250" x2="350" y2="210" stroke="#222222" stroke-width="2"/>
  <!-- 숨은선 -->
  <line x1="190" y1="50" x2="190" y2="210" stroke="#888888" stroke-width="2" stroke-dasharray="5,5"/>
  <line x1="120" y1="250" x2="190" y2="210" stroke="#888888" stroke-width="2" stroke-dasharray="5,5"/>
  <line x1="190" y1="210" x2="350" y2="210" stroke="#888888" stroke-width="2" stroke-dasharray="5,5"/>
  <g font-family="sans-serif" font-size="15" font-weight="bold" fill="#111111">
    <text x="100" y="85">A</text>
    <text x="290" y="85">B</text>
    <text x="360" y="50">C</text>
    <text x="180" y="45">D</text>
    <text x="100" y="265">E</text>
    <text x="290" y="265">F</text>
    <text x="360" y="215">G</text>
    <text x="175" y="215">H</text>
  </g>
</svg>