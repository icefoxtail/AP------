<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 300" width="450" height="300" role="img" aria-labelledby="q24-title q24-desc">
  <title id="q24-title">삼각형 ABC와 외각 x</title>
  <desc id="q24-desc">둔각삼각형 ABC에서 각 B와 각 BAC, 그리고 점 C에서의 외각 x</desc>
  <rect width="450" height="300" fill="#ffffff"/>
  <!-- Triangle ABC: B=(170,220), A=(110,105), C=(340,220) -->
  <polygon points="170,220 110,105 340,220" fill="none" stroke="#222222" stroke-width="2"/>
  <!-- BC 연장선 -->
  <line x1="340" y1="220" x2="430" y2="220" stroke="#222222" stroke-width="2" stroke-dasharray="4,4"/>
  <circle cx="110" cy="105" r="4.5" fill="#222222"/>
  <circle cx="170" cy="220" r="4.5" fill="#222222"/>
  <circle cx="340" cy="220" r="4.5" fill="#222222"/>
  <g font-family="sans-serif" font-size="16" font-weight="bold" fill="#111111">
    <text x="105" y="90">A</text>
    <text x="175" y="240">B</text>
    <text x="335" y="240">C</text>
    <text x="185" y="210">118°</text>
    <text x="130" y="140">26°</text>
    <text x="365" y="210" fill="#c0392b">x</text>
  </g>
</svg>
