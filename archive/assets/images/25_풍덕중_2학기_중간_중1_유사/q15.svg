<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 300" width="450" height="300" role="img" aria-labelledby="q15-title q15-desc">
  <title id="q15-title">맞꼭지각과 평행선에서의 삼각형 합동</title>
  <desc id="q15-desc">선분 AD와 BC의 교점 M과 평행한 두 선분 AB, CD</desc>
  <rect width="450" height="300" fill="#ffffff"/>
  <!-- AB top horizontal: (100,60) to (250,60) -->
  <!-- CD bottom horizontal: (200,240) to (350,240) -->
  <!-- AD connects (100,60) to (350,240) -->
  <!-- BC connects (250,60) to (200,240) -->
  <!-- M is intersection: (225,150) -->
  <line x1="100" y1="60" x2="250" y2="60" stroke="#222222" stroke-width="2.5"/>
  <line x1="200" y1="240" x2="350" y2="240" stroke="#222222" stroke-width="2.5"/>
  <line x1="100" y1="60" x2="350" y2="240" stroke="#222222" stroke-width="2"/>
  <line x1="250" y1="60" x2="200" y2="240" stroke="#222222" stroke-width="2"/>
  <circle cx="100" cy="60" r="4.5" fill="#222222"/>
  <circle cx="250" cy="60" r="4.5" fill="#222222"/>
  <circle cx="200" cy="240" r="4.5" fill="#222222"/>
  <circle cx="350" cy="240" r="4.5" fill="#222222"/>
  <circle cx="225" cy="150" r="4.5" fill="#222222"/>
  <!-- 같은 길이 표시 on BM and CM -->
  <line x1="235" y1="102" x2="241" y2="108" stroke="#e67e22" stroke-width="2"/>
  <line x1="210" y1="192" x2="216" y2="198" stroke="#e67e22" stroke-width="2"/>
  <g font-family="sans-serif" font-size="16" font-weight="bold" fill="#111111">
    <text x="85" y="55">A</text>
    <text x="260" y="55">B</text>
    <text x="180" y="255">C</text>
    <text x="360" y="255">D</text>
    <text x="240" y="155">M</text>
  </g>
</svg>