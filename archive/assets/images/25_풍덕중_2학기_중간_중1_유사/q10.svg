<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 300" width="450" height="300" role="img" aria-labelledby="q10-title q10-desc">
  <title id="q10-title">두 직선과 한 직선이 만날 때의 각</title>
  <desc id="q10-desc">두 직선과 횡단선이 만나 생기는 동위각과 엇각 위치 관계도</desc>
  <rect width="450" height="300" fill="#ffffff"/>
  <!-- 두 직선 l1, l2, transversal t -->
  <line x1="50" y1="90" x2="400" y2="90" stroke="#222222" stroke-width="2"/>
  <line x1="50" y1="210" x2="400" y2="210" stroke="#222222" stroke-width="2"/>
  <line x1="130" y1="30" x2="310" y2="270" stroke="#222222" stroke-width="2"/>
  <g font-family="sans-serif" font-size="15" font-weight="bold" fill="#111111">
    <text x="205" y="80">110°</text>
    <text x="205" y="115" fill="#c0392b">d</text>
    <text x="285" y="195" fill="#1f5fa8">e</text>
    <text x="285" y="235">65°</text>
  </g>
