<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" role="img" aria-labelledby="title desc" width="760" height="320"><title id="title">문항 5 해설: A의 영역 분해</title><desc id="desc">A 전체 69와 A만 38에서 교집합을 구하고 합집합과 바깥을 계산하는 Venn diagram</desc><style>text{font-family:"Noto Sans KR",Arial,sans-serif;fill:#172033}.m{fill:#56657a}</style><rect width="760" height="320" rx="18" fill="#f8fafc"/><text x="28" y="38" font-size="22" font-weight="700">A 전체를 두 영역으로 분해하기</text><rect x="28" y="78" width="430" height="180" rx="14" fill="#fff" stroke="#cbd5e1"/><circle cx="220" cy="168" r="68" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><circle cx="300" cy="168" r="68" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text x="170" y="128" font-size="17">A 69</text><text x="318" y="128" font-size="17">B 43</text><text x="180" y="180" text-anchor="middle" font-size="18">38</text><text x="260" y="180" text-anchor="middle" font-size="22" fill="#7c3aed">?</text><text x="350" y="180" text-anchor="middle" font-size="18">43−?</text><text x="52" y="236" font-size="16">A∩B=69−38</text><rect x="490" y="90" width="238" height="132" rx="14" fill="#fff" stroke="#cbd5e1"/><text x="514" y="126" font-size="17">n(A∪B)=69+43−?</text><text x="514" y="162" font-size="17">바깥=100−n(A∪B)</text><text x="514" y="198" font-size="17">Aᶜ∩Bᶜ=(A∪B)ᶜ</text><text x="28" y="294" class="m" font-size="14">A만 영역과 A 전체를 구분하면 다음 계산의 방향이 보인다.</text></svg>
