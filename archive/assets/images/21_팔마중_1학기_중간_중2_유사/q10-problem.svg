<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 320" width="420" height="320" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">가로 3a+2b, 세로 2a+3b인 직사각형의 오른쪽 위 모퉁이를 가로 a, 세로 b만큼 잘라 낸 ㄴ자 모양 도형이다.</title><desc id="visual-desc">직사각형의 아래쪽 변에 3a+2b, 왼쪽 변에 2a+3b가 적혀 있고 오른쪽 위 모퉁이가 계단처럼 잘려 나간 ㄴ자 모양이며, 잘린 부분의 가로에 a, 세로에 b가 적혀 있다.</desc><rect width="420" height="320" fill="#fff"/><g data-layer="30"><line id="sAP" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="126.967608704" y1="45.668449365" x2="297.82322576" y2="45.668449365"/></g><g data-layer="30"><line id="sPQ" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="297.82322576" y1="45.668449365" x2="297.82322576" y2="74.144385541"/></g><g data-layer="30"><line id="sQR" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="297.82322576" y1="74.144385541" x2="354.775098113" y2="74.144385541"/></g><g data-layer="30"><line id="sRC" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="354.775098113" y1="74.144385541" x2="354.775098113" y2="245.000002597"/></g><g data-layer="30"><line id="sCB" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="354.775098113" y1="245.000002597" x2="126.967608704" y2="245.000002597"/></g><g data-layer="30"><line id="sBA" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="126.9