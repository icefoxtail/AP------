<svg xmlns="http://www.w3.org/2000/svg" width="760" height="500" viewBox="0 0 760 500" role="img" aria-labelledby="title desc">
  <title id="title">왕운중 2023 중1 2학기 중간고사 16번 직육면체 절단도</title>
  <desc id="desc">직육면체에서 꼭짓점 A, G, C를 지나는 평면으로 잘라낸 삼각형 단면 AGC. 숨은 모서리는 점선이고 단면과의 투영 교차부는 끊어 실제 교점을 구분한다.</desc>
  <rect width="760" height="500" fill="#ffffff"/>
  <path d="M170 80 L430 150 L240 300 Z" fill="#f2f4f5" stroke="none"/>
  <g fill="none" stroke="#202124" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M170 80 L360 80 L430 150 L430 300 L240 300 L170 230 Z"/>
    <path d="M360 80 L360 122 M360 140 L360 230 M170 230 L319 230 M339 230 L360 230 M360 230 L430 300" stroke="#666666" stroke-width="2" stroke-dasharray="7 6"/>
    <path d="M170 80 L430 150 L240 300 Z" stroke="#202124" stroke-width="2.5"/>
  </g>
  <circle cx="360" cy="230" r="3" fill="#202124"/>
  <g fill="#202124" font-family="Noto Sans KR, Arial, sans-serif" font-size="25">
    <text x="145" y="75">A</text>
    <text x="365" y="72">B</text>
    <text x="442" y="153">C</text>
    <text x="143" y="242">D</text>
    <text x="368" y="243">E</text>
    <text x="435" y="325">F</text>
    <text x="225" y="325">G</text>
  </g>
</svg>