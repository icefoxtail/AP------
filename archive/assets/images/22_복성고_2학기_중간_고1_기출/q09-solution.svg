<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 390" role="img" aria-labelledby="title desc">
  <title id="title">문항 9 해설: B와 C에 속하고 A에는 속하지 않는 영역</title>
  <desc id="desc">세 집합 Venn diagram에서 B와 C의 교집합 중 A 바깥 부분을 강조</desc>
  <defs>
    <clipPath id="bClip"><circle cx="305" cy="228" r="88"/></clipPath>
    <clipPath id="cClip"><circle cx="190" cy="228" r="88"/></clipPath>
    <mask id="notA" maskUnits="userSpaceOnUse" x="40" y="88" width="420" height="260">
      <rect x="40" y="88" width="420" height="260" fill="white"/>
      <circle cx="248" cy="165" r="88" fill="black"/>
    </mask>
  </defs>
  <style>
    text{font-family:"Noto Sans KR","Malgun Gothic",Arial,sans-serif;fill:#172033}
    .muted{fill:#56657a}.formula{font-family:Georgia,"Times New Roman",serif}
  </style>
  <rect width="760" height="390" rx="18" fill="#f8fafc"/>
  <text x="30" y="38" font-size="22" font-weight="700">색칠 영역을 소속 조건으로 읽기</text>
  <text x="30" y="67" class="muted" font-size="15">B와 C에는 들어가고, A에서는 제외한다.</text>
  <rect x="30" y="88" width="430" height="260" rx="12" fill="#fff" stroke="#cbd5e1"/>
  <g clip-path="url(#bClip)"><g clip-path="url(#cClip)"><rect x="30" y="88" width="430" height="260" fill="#fca5a5" mask="url(#notA)"/></g></g>
  <circle cx="248" cy="165" r="88" fill="#dbeafe" fill-opacity=".34" stroke="#2563eb" stroke-width="3"/>
  <circle cx="305" cy="228" r="88" fill="#dcfce7" fill-opacity=".30" stroke="#16a34a" stroke-width="3"/>
  <circle cx="190" cy="228" r="88" fill="#fef3c7" fill-opacity=".28" stroke="#d97706" stroke-width="3"/>
  <text x="248" y="105" text-anchor="middle" font-size="20" font-weight="700" fill="#2563eb">A</text>
  <text x="360" y="270" font-size="20" font-weight="700" fill="#15803d">B</text>
  <text x="130" y="270" font-size="20" font-weight="700" fill="#b45309">C</text>
  <rect x="500" y="108" width="225" height="210" rx="14" fill="#fff" stroke="#cbd5e1"/>
  <text x="522" y="145" font-size="16" font-weight="700">정답 영역</text>
  <text x="522" y="184" class="formula" font-size="25">B∩C∩Aᶜ</text>
  <text x="522" y="220" class="muted" font-size="14">B∩C를 먼저 잡고</text>
  <text x="522" y="244" class="muted" font-size="14">A와 겹치는 부분을 제외</text>
  <rect x="522" y="266" width="68" height="30" rx="15" fill="#2563eb"/>
  <text x="556" y="287" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">①</text>
</svg>
