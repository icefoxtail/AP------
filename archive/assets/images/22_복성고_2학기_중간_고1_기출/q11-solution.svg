<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" role="img" aria-labelledby="title desc"><title id="title">참·거짓 명제 판정</title><desc id="desc">ㄱ, ㄴ, ㄷ은 각각의 반례로 거짓이고 ㄹ은 원점 대칭으로 참이다.</desc><style>text{font-family:"Noto Sans KR","Malgun Gothic",Arial,sans-serif;fill:#172033}.muted{fill:#56657a}</style><rect width="760" height="430" fill="#f8fafc"/><text x="28" y="38" font-size="22" font-weight="700">참·거짓 명제 판정</text><rect x="42" y="96" width="676" height="240" rx="12" fill="#fff" stroke="#cbd5e1"/><line x1="42" y1="156" x2="718" y2="156" stroke="#e2e8f0"/><line x1="42" y1="216" x2="718" y2="216" stroke="#e2e8f0"/><line x1="42" y1="276" x2="718" y2="276" stroke="#e2e8f0"/><text x="68" y="134" font-size="18" font-weight="700">ㄱ</text><text x="120" y="134" class="muted" font-size="16">거짓 — 수직선 반례</text><text x="68" y="194" font-size="18" font-weight="700">ㄴ</text><text x="120" y="194" class="muted" font-size="16">거짓 — 공집합 반례</text><text x="68" y="254" font-size="18" font-weight="700">ㄷ</text><text x="120" y="254" class="muted" font-size="16">거짓 — 합성 순서 반례: a=1, b=3, a−b=−2</text><text x="68" y="314" font-size="18" font-weight="700">ㄹ</text><text x="120" y="314" class="muted" font-size="16">참 — 원점 대칭</text></svg>
