<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" role="img" aria-labelledby="title desc">
  <title id="title">문항 17 해설: 구간과 여집합의 교집합</title>
  <desc id="desc">A=[-3,5]와 B의 여집합 [a,b]가 [−3,2]가 되는 수직선</desc>
  <style>
    text{font-family:"Noto Sans KR","Malgun Gothic",Arial,sans-serif;fill:#172033}
    .muted{fill:#56657a}.math{font-family:Georgia,"Times New Roman",serif}
  </style>
  <rect width="760" height="380" rx="18" fill="#f8fafc"/>
  <text x="30" y="38" font-size="22" font-weight="700">차집합 조건을 수직선에 표시</text>
  <text x="30" y="67" class="muted" font-size="15">A=[−3,5],  Bᶜ=[a,b],  A∩Bᶜ=[−3,2]</text>
  <rect x="30" y="92" width="700" height="202" rx="14" fill="#fff" stroke="#cbd5e1"/>
  <line x1="105" y1="174" x2="690" y2="174" stroke="#172033" stroke-width="2"/>
  <path d="m690 174-10-6v12z" fill="#172033"/>
  <line x1="105" y1="244" x2="690" y2="244" stroke="#172033" stroke-width="2"/>
  <path d="m690 244-10-6v12z" fill="#172033"/>
  <g font-size="14" class="muted" text-anchor="middle">
    <text x="150" y="267">−5</text><text x="240" y="267">−3</text><text x="330" y="267">−1</text><text x="375" y="267">0</text><text x="465" y="267">2</text><text x="600" y="267">5</text>
  </g>
  <g stroke="#64748b" stroke-width="2">
    <line x1="150" y1="168" x2="150" y2="180"/><line x1="240" y1="168" x2="240" y2="180"/><line x1="330" y1="168" x2="330" y2="180"/><line x1="375" y1="168" x2="375" y2="180"/><line x1="465" y1="168" x2="465" y2="180"/><line x1="600" y1="168" x2="600" y2="180"/>
    <line x1="150" y1="238" x2="150" y2="250"/><line x1="240" y1="238" x2="240" y2="250"/><line x1="330" y1="238" x2="330" y2="250"/><line x1="375" y1="238" x2="375" y2="250"/><line x1="465" y1="238" x2="465" y2="250"/><line x1="600" y1="238" x2="600" y2="250"/>
  </g>
  <text x="82" y="179" text-anchor="end" font-size="17" font-weight="700" fill="#2563eb">A</text>
  <line x1="240" y1="174" x2="600" y2="174" stroke="#2563eb" stroke-width="12" stroke-linecap="round"/>
  <circle cx="240" cy="174" r="8" fill="#2563eb"/><circle cx="600" cy="174" r="8" fill="#2563eb"/>
  <text x="82" y="249" text-anchor="end" font-size="17" font-weight="700" fill="#ea580c">Bᶜ</text>
  <line x1="240" y1="244" x2="465" y2="244" stroke="#f97316" stroke-width="12" stroke-linecap="round"/>
  <circle cx="240" cy="244" r="8" fill="#f97316"/><circle cx="465" cy="244" r="8" fill="#f97316"/>
  <rect x="30" y="318" width="700" height="35" rx="10" fill="#eff6ff"/>
  <text x="380" y="341" text-anchor="middle" font-size="16" font-weight="700" fill="#1d4ed8">Bᶜ=[−3,2]⊂A  →  a=−3, b=2  →  b−a=5</text>
</svg>
