    <rect width="760" height="430" fill="#f8fafc"/><text x="28" y="38" font-size="22" text-anchor="start" class="text" font-weight="700">교집합에 들어갈 두 약수를 먼저 고정하고 k를 나열한다</text><text x="28" y="67" font-size="15" text-anchor="start" class="muted">B={2,5,6}, 정확히 두 개가 약수인 k만 남긴 뒤 A−B의 합의 홀짝을 확인</text><rect x="34" y="94" width="692" height="244" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/><text x="52" y="122" font-size="15" text-anchor="start" class="text" font-weight="700">k</text><text x="146" y="122" font-size="15" text-anchor="start" class="text" font-weight="700">B와의 교집합</text><text x="342" y="122" font-size="15" text-anchor="start" class="text" font-weight="700">A−B</text><text x="604" y="122" font-size="15" text-anchor="start" class="text" font-weight="700">합</text><line x1="44" y1="136" x2="716" y2="136" stroke="#94a3b8" stroke-width="1.4" stroke-linecap="round"/><text x="52" y="169" font-size="15" text-anchor="start" class="math-strong" fill="#166534">10</text><text x="146" y="169" font-size="15" text-anchor="start" class="text">{2,5}</text><text x="342" y="169" font-size="15" text-anchor="start" class="text">{1,10}</text><text x="604" y="169" font-size="15" text-anchor="start" class="text" fill="#166534">11</text><line x1="44" y1="179" x2="716" y2="179" stroke="#e2e8f0" stroke-width="1" stroke-linecap="round"/><text x="52" y="203" font-size="15" text-anchor="start" class="math-strong" fill="#166534">20</text><text x="146" y="203" font-size="15" text-anchor="start" class="text">{2,5}</text><text x="342" y="203" font-size="15" text-anchor="start" class="text">{1,4,10,20}</text><text x="604" y="203" font-size="15" text-anchor="start" class="text" fill="#166534">35</text><line x1="44" y1="213" x2="716" y2="213" stroke="#e2e8f0" stroke-width="1" stroke-linecap="round"/><text x="52" y="237" font-size="15" text-anchor="start" class="math-strong" fill="#64748b">6</text><text x="146" y="237" font-size="15" text-anchor="start" class="text">{2,6}</text><text