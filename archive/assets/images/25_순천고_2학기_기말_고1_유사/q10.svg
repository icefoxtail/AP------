<svg xmlns="http://www.w3.org/2000/svg" width="660" height="400" viewBox="0 0 660 400"><title>q10 그래프와 y=x</title><desc>f(a)=e, f(b)=d, f(c)=b, f(d)=c, f(e)=a. 대응 순서와 점선 y=x를 함께 표시.</desc><rect width="660" height="400" fill="white"/><g fill="none" stroke="#555" stroke-width="1.6"><path d="M120 340H390 M120 345V75"/><path d="M150 320L350 120" stroke="#888" stroke-dasharray="6 5"/><polyline points="150,120 200,170 250,270 300,220 350,320" stroke="#205d9b" stroke-width="3"/></g><g fill="#205d9b"><circle cx="150" cy="120" r="4"/><circle cx="200" cy="170" r="4"/><circle cx="250" cy="270" r="4"/><circle cx="300" cy="220" r="4"/><circle cx="350" cy="320" r="4"/></g><g font-family="Arial,sans-serif" font-size="24" fill="#222"><text x="145" y="368">a</text><text x="90" y="325">a</text><text x="195" y="368">b</text><text x="90" y="275">b</text><text x="245" y="368">c</text><text x="90" y="225">c</text><text x="295" y="368">d</text><text x="90" y="175">d</text><text x="345" y="368">e</text><text x="90" y="125">e</text><text x="365" y="95">y=x</text><text x="388" y="165">y=f(x)</text><text x="395" y="220">f(c)=b</text><text x="395" y="251">f(b)=d</text><text x="395" y="282">f(f(c))=d</text></g></svg>
