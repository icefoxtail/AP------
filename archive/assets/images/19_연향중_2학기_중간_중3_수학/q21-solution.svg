<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 699 388" width="699" height="388" role="img" aria-labelledby="title desc"><title id="title">세 배 늘어난 평균에서의 거리</title><desc id="desc">위는 원래 평균과 한 변량의 예시이다. 아래는 모든 변량을 세 배하고 1을 더한 뒤이며, 평균과 그 변량 사이 거리가 세 배가 된다.</desc><rect width="699" height="388" fill="white" /><line x1="139.0000" y1="124.0000" x2="607.0000" y2="124.0000" stroke="#586574" stroke-width="2.1" stroke-linecap="round" /><line x1="187.0000" y1="124.0000" x2="298.0000" y2="124.0000" stroke="#205d9c" stroke-width="4.55" stroke-linecap="round" /><circle cx="187" cy="124" r="8.0" fill="#aa5411" /><text x="187.0000" y="169.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#aa5411" text-anchor="middle">33</text><line x1="187.0000" y1="83.0000" x2="187.0000" y2="92.0000" stroke="#205d9c" stroke-width="2.0" stroke-linecap="round" /><circle cx="298" cy="124" r="8.0" fill="#205d9c" /><text x="298.0000" y="169.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#205d9c" text-anchor="middle">33+d</text><line x1="298.0000" y1="83.0000" x2="298.0000" y2="92.0000" stroke="#205d9c" stroke-width="2.0" stroke-linecap="round" /><line x1="187.0000" y1="87.0000" x2="298.0000" y2="87.0000" stroke="#205d9c" stroke-width="1.9" stroke-linecap="round" /><text x="242.5000" y="69.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#205d9c" text-anchor="middle">거리 d</text><line x1="139.0000" y1="297.0000" x2="607.0000" y2="297.0000" stroke="#586574" stroke-width="2.1" stroke-linecap="round" /><line x1="187.0000" y1="297.0000" x2="520.0000" y2="297.0000" stroke="#205d9c" stroke-width="4.55" stroke-linecap="round" /><circle cx="187" cy="297" r="8.0" fill="#aa5411" /><text x="187.0000" y="342.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#aa5411" text-anchor="middle">100</text><line x1="187.0000" y1="256.0000" x2="187.0000" y2="265.0000" stroke="#205d9c" stroke-width="2.0" stroke-linecap="round" /><circle cx="520" cy="297" r="8.0" fill="#205d9c" /><text x="520.0000" y="342.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#205d9c" text-anchor="middle">100+3d</text><line x1="520.0000" y1="256.0000" x2="520.0000" y2="265.0000" stroke="#205d9c" stroke-width="2.0" stroke-linecap="round" /><line x1="187.0000" y1="260.0000" x2="520.0000" y2="260.0000" stroke="#205d9c" stroke-width="1.9" stroke-linecap="round" /><text x="353.5000" y="242.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#205d9c" text-anchor="middle">거리 3d</text><text x="92.0000" y="127.0000" font-size="26" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#586574" text-anchor="middle">변환 전</text><text x="92.0000" y="300.0000" font-size="26" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#586574" text-anchor="middle">변환 후</text></svg>
