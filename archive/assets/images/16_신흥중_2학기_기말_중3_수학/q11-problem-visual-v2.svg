<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 613 534" width="613" height="534" role="img" aria-labelledby="title desc"><title id="title">길이가 주어진 두 호와 원주각</title><desc id="desc">왼쪽 원호 AB의 길이는 6 cm이며 중심에서 이 호를 본 각은 60도이다. 아래 오른쪽 원호 CD의 길이는 2 cm이다. 원 위 P에서 C와 D를 이은 두 현이 각 x를 이룬다.</desc><rect width="613" height="534" fill="white" /><circle cx="306.5" cy="267.0" r="189.5" fill="none" stroke="#205d9c" stroke-width="3.6" /><path d="M 149.397 161.033 A 189.5000 189.5000 0 0 0 136.179 350.071" stroke="#266f73" stroke-width="5.3" fill="none" stroke-linecap="round" /><path d="M 306.500 456.500 A 189.5000 189.5000 0 0 0 371.313 445.072" stroke="#aa5411" stroke-width="5.3" fill="none" stroke-linecap="round" /><line x1="149.3974" y1="161.0329" x2="306.5000" y2="267.0000" stroke="#266f73" stroke-width="4.1" stroke-linecap="round" /><line x1="136.1785" y1="350.0713" x2="306.5000" y2="267.0000" stroke="#266f73" stroke-width="4.1" stroke-linecap="round" /><line x1="380.5435" y1="92.5643" x2="306.5000" y2="456.5000" stroke="#586574" stroke-width="4.1" stroke-linecap="round" /><line x1="380.5435" y1="92.5643" x2="371.3128" y2="445.0718" stroke="#586574" stroke-width="4.1" stroke-linecap="round" /><path d="M 277.4837 247.4282 A 35 35 0 0 0 275.0422 282.3430" stroke="#266f73" stroke-width="2.25" fill="none" /><text x="234.6754" y="269.9775" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#266f73" text-anchor="middle">60°</text><path d="M 369.7777 145.4803 A 54 54 0 0 0 379.1300 146.5458" stroke="#aa5411" stroke-width="2.25" fill="none" /><text x="382.6760" y="197.9472" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#aa5411" text-anchor="middle">x</text><text x="70.4616" y="260.7811" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#266f73" text-anchor="middle">6 cm</text><text x="376.4063" y="490.6211" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#aa5411" text-anchor="middle">2 cm</text><circle cx="149.3973800008196" cy="161.03294479229345" r="4.9" fill="#28364b" /><text x="135.3974" y="145.0329" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">A</text><circle cx="136.17852822630783" cy="350.07133231653006" r="4.9" fill="#28364b" /><text x="120.1785" y="370.0713" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">B</text><circle cx="306.5" cy="267.0" r="4.9" fill="#28364b" /><text x="316.5000" y="287.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">O</text><circle cx="380.5435488487174" cy="92.56433027076258" r="4.9" fill="#28364b" /><text x="384.5435" y="75.5643" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">P</text><circle cx="306.49999999999994" cy="456.5" r="4.9" fill="#28364b" /><text x="292.5000" y="483.5000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">C</text><circle cx="371.3128171602141" cy="445.07175163892964" r="4.9" fill="#28364b" /><text x="385.3128" y="470.0718" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">D</text></svg>
