<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 579 531" width="579" height="531" role="img" aria-labelledby="title desc"><title id="title">두 원과 내부 원 위의 접선</title><desc id="desc">큰 원의 가로 지름은 AB이고 중심은 O이다. 선분 OB가 작은 원의 지름이고 그 중심은 O′이다. A에서 나온 선분은 작은 원의 P에 접하며 큰 원의 Q에 닿는다. OA는 4이다.</desc><rect width="579" height="531" fill="white" /><circle cx="289.5" cy="265.5" r="188.0" fill="none" stroke="#205d9c" stroke-width="3.6" /><circle cx="383.5" cy="265.5" r="94.0" fill="none" stroke="#266f73" stroke-width="3.6" /><line x1="101.5000" y1="265.5000" x2="477.5000" y2="265.5000" stroke="#586574" stroke-width="4.1" stroke-linecap="round" /><line x1="101.5000" y1="265.5000" x2="435.7222" y2="147.3346" stroke="#aa5411" stroke-width="4.1" stroke-linecap="round" /><line x1="101.5000" y1="292.5000" x2="289.5000" y2="292.5000" stroke="#205d9c" stroke-width="1.7" stroke-linecap="round" /><line x1="101.5000" y1="287.0000" x2="101.5000" y2="298.0000" stroke="#205d9c" stroke-width="1.7" stroke-linecap="round" /><line x1="289.5000" y1="287.0000" x2="289.5000" y2="298.0000" stroke="#205d9c" stroke-width="1.7" stroke-linecap="round" /><text x="195.5000" y="319.5000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#205d9c" text-anchor="middle">4</text><circle cx="101.5" cy="265.5" r="4.9" fill="#28364b" /><text x="86.5000" y="277.5000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">A</text><circle cx="477.5" cy="265.5" r="4.9" fill="#28364b" /><text x="496.5000" y="274.5000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">B</text><circle cx="289.5" cy="265.5" r="4.9" fill="#28364b" /><text x="275.5000" y="245.5000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">O</text><circle cx="352.1666666666667" cy="176.87595009128603" r="4.9" fill="#28364b" /><text x="349.1667" y="160.8760" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">P</text><circle cx="435.72222222222223" cy="147.33460012171471" r="4.9" fill="#28364b" /><text x="450.7222" y="135.3346" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">Q</text><circle cx="383.5" cy="265.5" r="4.9" fill="#28364b" /><text x="383.5000" y="294.5000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">O′</text></svg>
