<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 579 537" width="579" height="537" role="img" aria-labelledby="title desc"><title id="title">두 현의 교점과 같은 길이인 두 변</title><desc id="desc">원의 위쪽 A와 아래쪽 B를 연결했다. C와 D를 이은 현이 AB와 E에서 만난다. AC와 AD에 같은 길이 눈금이 있다. AE는 3 cm, BE는 9 cm이다.</desc><rect width="579" height="537" fill="white" /><circle cx="289.5" cy="268.5" r="191.0" fill="none" stroke="#205d9c" stroke-width="3.6" /><polygon points="289.5000,77.5000 124.0891,173.0000 454.9109,173.0000" fill="none" /><line x1="289.5000" y1="77.5000" x2="289.5000" y2="459.5000" stroke="#266f73" stroke-width="4.1" stroke-linecap="round" /><line x1="124.0891" y1="173.0000" x2="454.9109" y2="173.0000" stroke="#586574" stroke-width="4.1" stroke-linecap="round" /><line x1="289.5000" y1="77.5000" x2="124.0891" y2="173.0000" stroke="#aa5411" stroke-width="4.1" stroke-linecap="round" /><line x1="289.5000" y1="77.5000" x2="454.9109" y2="173.0000" stroke="#aa5411" stroke-width="4.1" stroke-linecap="round" /><line x1="205.5376" y1="117.8928" x2="212.5376" y2="130.0172" stroke="#aa5411" stroke-width="2.5" stroke-linecap="round" /><line x1="197.7434" y1="122.3928" x2="204.7434" y2="134.5172" stroke="#aa5411" stroke-width="2.5" stroke-linecap="round" /><line x1="366.4624" y1="130.0172" x2="373.4624" y2="117.8928" stroke="#aa5411" stroke-width="2.5" stroke-linecap="round" /><line x1="374.2566" y1="134.5172" x2="381.2566" y2="122.3928" stroke="#aa5411" stroke-width="2.5" stroke-linecap="round" /><text x="325.5000" y="134.2500" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#266f73" text-anchor="middle">3 cm</text><text x="338.5000" y="326.2500" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#266f73" text-anchor="middle">9 cm</text><circle cx="289.5" cy="77.5" r="4.9" fill="#28364b" /><text x="289.5000" y="61.5000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28