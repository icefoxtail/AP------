<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 571 545" width="571" height="545" role="img" aria-labelledby="title desc"><title id="title">원의 반지름과 가로 현의 길이</title><desc id="desc">원 O의 중심에서 원 위 B로 이어지는 반지름의 길이는 5이다. 아래쪽 현 BC는 6이고 A와 B, A와 C를 이었다.</desc><rect width="571" height="545" fill="white" /><circle cx="285.5" cy="272.5" r="195.0" fill="none" stroke="#205d9c" stroke-width="3.6" /><polygon points="285.5000,77.5000 168.5000,428.5000 402.5000,428.5000" fill="none" /><line x1="285.5000" y1="77.5000" x2="168.5000" y2="428.5000" stroke="#586574" stroke-width="4.1" stroke-linecap="round" /><line x1="168.5000" y1="428.5000" x2="402.5000" y2="428.5000" stroke="#aa5411" stroke-width="4.1" stroke-linecap="round" /><line x1="402.5000" y1="428.5000" x2="285.5000" y2="77.5000" stroke="#586574" stroke-width="4.1" stroke-linecap="round" /><line x1="285.5000" y1="272.5000" x2="168.5000" y2="428.5000" stroke="#266f73" stroke-width="4.1" stroke-linecap="round" /><text x="254.0000" y="359.5000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#266f73" text-anchor="middle">5</text><line x1="168.5000" y1="490.5000" x2="402.5000" y2="490.5000" stroke="#aa5411" stroke-width="1.7" stroke-linecap="round" /><line x1="168.5000" y1="485.0000" x2="168.5000" y2="496.0000" stroke="#aa5411" stroke-width="1.7" stroke-linecap="round" /><line x1="402.5000" y1="485.0000" x2="402.5000" y2="496.0000" stroke="#aa5411" stroke-width="1.7" stroke-linecap="round" /><text x="285.5000" y="516.5000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#aa5411" text-anchor="middle">6</text><circle cx="285.5" cy="77.5" r="4.9" fill="#28364b" /><text x="285.5000" y="59.5000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">A</text><circle cx="168.5" cy="428.5" r="4.9" fill="#28364b" /><text x="150.5000" y="442.5000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">B</text><circle cx="402.5" cy="428.5" r="4.9" fill="#28364b" /><text x="418.5000" y="443.5000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">C</text><circle cx="285.5" cy="272.5" r="4.9" fill="#28364b" /><text x="291.5000" y="254.5000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">O</text></svg>
