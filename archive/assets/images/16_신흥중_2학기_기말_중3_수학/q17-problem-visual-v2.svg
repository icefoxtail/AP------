<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 602 537" width="602" height="537" role="img" aria-labelledby="title desc"><title id="title">수직인 두 현과 표시된 두 원호</title><desc id="desc">원 위 A에서 B를 잇는 현과 C에서 D를 잇는 현이 직각으로 만난다. A에서 D까지의 작은 호는 3π, 반대쪽 C에서 B까지의 작은 호는 7π이다.</desc><rect width="602" height="537" fill="white" /><circle cx="301.0" cy="268.5" r="191.0" fill="none" stroke="#205d9c" stroke-width="3.6" /><path d="M 251.566 84.008 A 191.0000 191.0000 0 0 1 421.200 120.065" stroke="#266f73" stroke-width="5.2" fill="none" stroke-linecap="round" /><path d="M 110.465 281.823 A 191.0000 191.0000 0 0 0 423.772 414.814" stroke="#aa5411" stroke-width="5.2" fill="none" stroke-linecap="round" /><line x1="251.5656" y1="84.0082" x2="423.7724" y2="414.8145" stroke="#586574" stroke-width="4.1" stroke-linecap="round" /><line x1="110.4653" y1="281.8235" x2="421.2002" y2="120.0651" stroke="#586574" stroke-width="4.1" stroke-linecap="round" /><line x1="294.6520" y1="166.7764" x2="309.7312" y2="158.9267" stroke="#586574" stroke-width="1.8" stroke-linecap="round" /><line x1="309.7312" y1="158.9267" x2="317.5809" y2="174.0059" stroke="#586574" stroke-width="1.8" stroke-linecap="round" /><text x="352.7111" y="53.6738" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#266f73" text-anchor="middle">3π</text><text x="220.3704" y="475.3164" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#aa5411" text-anchor="middle">7π</text><circle cx="251.5655623854185" cy="84.00816717878794" r="4.9" fill="#28364b" /><text x="241.5656" y="66.0082" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">A</text><circle cx="423.77243345012903" cy="414.81448863572484" r="4.9" fill="#28364b" /><text x="437.7724" y="439.8145" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">B</text><circle cx="110.46526640037357" cy="281.82348648512783" r="4.9" fill="#28364b" /><text x="92.4653" y="293.8235" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">C</text><circle cx="421.20019469051897" cy="120.06512136171855" r="4.9" fill="#28364b" /><text x="435.2002" y="102.0651" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">D</text></svg>
