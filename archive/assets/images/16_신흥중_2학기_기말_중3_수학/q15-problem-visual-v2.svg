<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 541" width="680" height="541" role="img" aria-labelledby="title desc"><title id="title">정사각형 안에서 사분원 둘과 접하는 원</title><desc id="desc">정사각형 ABCD의 한 변은 10 cm이다. 왼쪽 아래 B를 중심으로 위쪽 A에서 오른쪽 아래 C를 잇는 사분원이 있다. 오른쪽 아래 C에서 그린 사분원은 B와 D를 잇고 두 호가 E에서 교차한다. 아래 원 O가 두 호와 바닥 BC에 접한다.</desc><rect width="680" height="541" fill="white" /><polygon points="147.0000,77.5000 147.0000,463.5000 533.0000,463.5000 533.0000,77.5000" fill="none" /><line x1="147.0000" y1="77.5000" x2="147.0000" y2="463.5000" stroke="#586574" stroke-width="4.1" stroke-linecap="round" /><line x1="147.0000" y1="463.5000" x2="533.0000" y2="463.5000" stroke="#586574" stroke-width="4.1" stroke-linecap="round" /><line x1="533.0000" y1="463.5000" x2="533.0000" y2="77.5000" stroke="#586574" stroke-width="4.1" stroke-linecap="round" /><line x1="533.0000" y1="77.5000" x2="147.0000" y2="77.5000" stroke="#586574" stroke-width="4.1" stroke-linecap="round" /><path d="M 147.000 77.500 A 386.0000 386.0000 0 0 1 533.000 463.500" stroke="#205d9c" stroke-width="4.4" fill="none" stroke-linecap="round" /><path d="M 147.000 463.500 A 386.0000 386.0000 0 0 1 533.000 77.500" stroke="#266f73" stroke-width="4.4" fill="none" stroke-linecap="round" /><circle cx="340.0" cy="318.75" r="144.75" fill="none" stroke="#aa5411" stroke-width="3.6" /><line x1="117.0000" y1="463.5000" x2="117.0000" y2="77.5000" stroke="#586574" stroke-width="1.7" stroke-linecap="round" /><line x1="111.5000" y1="463.5000" x2="122.5000" y2="463.5000" stroke="#586574" stroke-width="1.7" stroke-linecap="round" /><line x1="111.5000" y1="77.5000" x2="122.5000" y2="77.5000" stroke="#586574" stroke-width="1.7" stroke-linecap="round" /><text x="69.0000" y="278.5000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#586574" text-anchor="middle">10 cm</text><circle cx="147.0" cy="77.5" r="4.9" fill="#28364b" /><text x="136.0000" y="61.5000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">A</text><circle cx="147.0" cy="463.5" r="4.9" fill="#28364b" /><text x="132.0000" y="489.5000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">B</text><circle cx="533.0" cy="463.5" r="4.9" fill="#28364b" /><text x="553.0000" y="487.5000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">C</text><circle cx="533.0" cy="77.5" r="4.9" fill="#28364b" /><text x="549.0000" y="62.5000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">D</text><circle cx="340.0" cy="129.2141941392067" r="4.9" fill="#28364b" /><text x="344.0000" y="163.2142" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">E</text><circle cx="340.0" cy="318.75" r="4.9" fill="#28364b" /><text x="347.0000" y="346.7500" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">O</text></svg>
