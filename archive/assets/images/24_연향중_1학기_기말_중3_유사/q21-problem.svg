<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 360" width="420" height="360" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">한 점을 중심으로 하는 두 원이 있고, 안쪽 원의 반지름 8 cm와 바깥 원까지 늘어난 길이 x cm가 표시되어 있다.</title><desc id="visual-desc">같은 중심을 갖는 두 원에서 안쪽 원의 반지름은 8 cm이고, 바깥 원의 반지름은 안쪽 원보다 x cm 더 길게 그려져 있다.</desc><rect width="420" height="360" fill="#fff"/><g data-layer="30"><line id="sOP" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="206.172413793" y1="180" x2="291.229885057" y2="180"/></g><g data-layer="30"><line id="sPQ" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="291.229885057" y1="180" x2="333.75862069" y2="180"/></g><g data-layer="40"><circle id="cIn" data-role="circle" stroke="#111" stroke-width="2.05" fill="none" cx="206.172413793" cy="180" r="85.057471264"/></g><g data-layer="40"><circle id="cOut" data-role="circle" stroke="#111" stroke-width="2.05" fill="none" cx="206.172413793" cy="180" r="127.586206897"/></g><g data-layer="90"><g id="rAdd" data-label-kind="EQUATION_LABEL" data-priority="1" data-font-px="20" data-owner="sPQ" data-fragment-sha="sha256:68af1bbebc8fa842c78ff3ba6350a0fdedd1803e88d22d5489075d9168d0d5b0" data-tex="x\,\mathrm{cm}" transform="translate(340.057471264 175.41)"><svg xmlns="http://www.w3.org/2000/svg" width="40.32" height="9.18" viewBox="0 0 40.32 9.18" data-outline-wid