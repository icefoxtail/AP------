<title id="q17-title">두 곡선의 차를 이용한 넓이 계산</title>
<desc id="q17-desc">두 곡선 y=f(x)와 y=-12x squared의 차 h(x)=f(x)+12x squared=x(x+2)(x+4)를 그린 그래프이다. 영점은 -4, -2, 0이고 -4에서 -2 구간의 양의 넓이와 -2에서 0 구간의 음의 넓이의 절댓값이 각각 4이다.</desc>
