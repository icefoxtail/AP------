<title id="q14-title">도함수 그래프에서 원함수의 극댓값과 극솟값 찾기</title>
<desc id="q14-desc">도함수 y=f prime x는 x=-3과 x=1에서 x축과 만나는 위로 열린 포물선이다. 도함수 부호는 -3에서 양에서 음으로, 1에서 음에서 양으로 바뀌므로 원함수는 x=-3에서 극대, x=1에서 극소이다.</desc>
