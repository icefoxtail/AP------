<title id="q20-title">적분으로 정의된 함수 g의 그래프</title>
<desc id="q20-desc">a=0일 때 g(x)=x cubed times 4 minus x의 그래프이다. g는 x=0에서 중근 형태로 0이고 x=4에서 부호를 바꾸며 0이 된다. 따라서 absolute g는 x=4에서만 미분 불가능하다.</desc>
