<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 380" role="img" aria-label="반지름 6인 사분원 활꼴의 회전체를 반구에서 원뿔을 뺀 것으로 분해">
<path d="M 180 300 A 180 180 0 0 1 360 120" fill="none" stroke="#111" stroke-width="3"/>
