<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 400" role="img" aria-label="원기둥 안에 같은 크기의 공 세 개가 세로로 맞닿은 관계">
<ellipse cx="220" cy="50" rx="52" ry="18" fill="none" stroke="#111" stroke-width="3"/>
<ellipse cx="220" cy="362" rx="52" ry="18" fill="none" stroke="#111" stroke-width="3"/>
<line x1="168.00" y1="50.00" x2="168.00" y2="362.00" stroke="#111" stroke-width="3" />
<line x1="272.00" y1="50.00" x2="272.00" y2="362.00" stroke="#111" stroke-width="3" />
<circle cx="220.00" cy="102.00" r="52.00" fill="none" stroke="#111" stroke-width="3" />
<circle cx="220.00" cy="206.00" r="52.00" fill="none" stroke="#111" stroke-width="3" />
<circle cx="220.00" cy="310.00" r="52.00" fill="none" stroke="#111" stroke-width="3" />
<text x="320.00" y="90.00" font-family="sans-serif" font-size="20" fill="#111">원기둥 반지름 = r</text>
<text x="320.00" y="125.00" font-family="sans-serif" font-size="20" fill="#111">높이 = 6r</text>
<text x="320.00" y="165.00" font-family="sans-serif" font-size="20" fill="#111">6πr³ = 384π</text>
<text x="320.00" y="200.00" font-family="sans-serif" font-size="20" fill="#111">r = 4</text>
<text x="320.00" y="240.00" font-family="sans-serif" font-size="20" fill="#111">구 겉넓이 = 4πr² = 64π</text>
</svg>
