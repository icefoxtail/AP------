<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="840" height="520" viewBox="0 0 840 520" role="img" data-visual-provenance="R1-q21-interval-fallback">
<title>세 정수 조건을 만족하는 a의 범위</title>
<desc>정수 후보 2부터 7까지를 열린 구간과 비교해 a의 두 범위를 나타낸 해설 그림.</desc>
<style>text{font-family:Arial,"Malgun Gothic",sans-serif;fill:#111}.title{font-size:22px;font-weight:700}.panel-title{font-size:16px;font-weight:700}.label{font-size:14px}.small{font-size:13px}.axis{stroke:#222;stroke-width:1.5}.candidate{stroke:#555;stroke-width:1.5}.inside{fill:#1d4ed8;stroke:#1d4ed8;stroke-width:2}.outside{fill:#fff;stroke:#777;stroke-width:2}.window{stroke:#1d4ed8;stroke-width:5;stroke-linecap:round}.open{fill:#fff;stroke:#1d4ed8;stroke-width:3}.closed{fill:#1d4ed8;stroke:#1d4ed8;stroke-width:2}.panel{fill:#fff;stroke:#d1d5db;stroke-width:1.2}.accent{fill:#1d4ed8}</style>
<text class="title" x="42" y="36">x={2,3,4,5,6,7}</text>
<rect class="panel" x="35" y="55" width="770" height="160" rx="12"/>
<text class="panel-title" x="55" y="83">a=1: -3 &lt; x &lt; 5</text>
<line class="window" x1="122.353" y1="137" x2="461.176" y2="137"/>
<circle class="open" data-role="open-window-boundary" data-value="-3" cx="122.353" cy="137" r="7"/>
<circle class="open" data-role="open-window-boundary" data-value="5" cx="461.176" cy="137" r="7"/>
<text class="small" x="117.353" y="125">-3</text>
<text class="small" x="456.176" y="125">5</text>
<line class="axis" x1="80.000" y1="177" x2="800.000" y2="177"/>
<line class="candidate" x1="334.118" y1="170" x2="334.118" y2="184"/>
<circle class="inside" data-role="candidate-integer" data-value="2" data-included="true" cx="334.118" cy="177" r="5.5"/>
<text class="small" text-anchor="middle" x="334.118" y="202">2</text>
<line class="candidate" x1="376.471" y1="170" x2="376.471" y2="184"/>
<circle class="inside" data-role="candidate-integer" data-value="3" data-included="true" cx="376.471" cy="177" r="5.5"/>
<text class="small" text-anchor="middle" x="376.471" y="202">3</text>
<line class="candidate" x1="418.824" y1="170" x2="418.824" y2="184"/>
<circle class="inside" data-role="candidate-integer" data-value="4" data-included="true" cx="418.824" cy="177" r="5.5"/>
<text class="small" text-anchor="middle" x="418.824" y="202">4</text>
<line class="candidate" x1="461.176" y1="170" x2="461.176" y2="184"/>
<circle class="outside" data-role="candidate-integer" data-value="5" data-included="false" cx="461.176" cy="177" r="5.5"/>
<text class="small" text-anchor="middle" x="461.176" y="202">5</text>
<line class="candidate" x1="503.529" y1="170" x2="503.529" y2="184"/>
<circle class="outside" data-role="candidate-integer" data-value="6" data-included="false" cx="503.529" cy="177" r="5.5"/>
<text class="small" text-anchor="middle" x="503.529" y="202">6</text>
<line class="candidate" x1="545.882" y1="170" x2="545.882" y2="184"/>
<circle class="outside" data-role="candidate-integer" data-value="7" data-included="false" cx="545.882" cy="177" r="5.5"/>
<text class="small" text-anchor="middle" x="545.882" y="202">7</text>
<text class="label accent" x="580" y="83">2, 3, 4 -> 3</text>
<rect class="panel" x="35" y="230" width="770" height="160" rx="12"/>
<text class="panel-title" x="55" y="258">a=8: 4 &lt; x &lt; 12</text>
<line class="window" x1="418.824" y1="312" x2="757.647" y2="312"/>
<circle class="open" data-role="open-window-boundary" data-value="4" cx="418.824" cy="312" r="7"/>
<circle class="open" data-role="open-window-boundary" data-value="12" cx="757.647" cy="312" r="7"/>
<text class="small" x="413.824" y="300">4</text>
<text class="small" x="752.647" y="300">12</text>
<line class="axis" x1="80.000" y1="352" x2="800.000" y2="352"/>
<line class="candidate" x1="334.118" y1="345" x2="334.118" y2="359"/>
<circle class="outside" data-role="candidate-integer" data-value="2" data-included="false" cx="334.118" cy="352" r="5.5"/>
<text class="small" text-anchor="middle" x="334.118" y="377">2</text>
<line class="candidate" x1="376.471" y1="345" x2="376.471" y2="359"/>
<circle class="outside" data-role="candidate-integer" data-value="3" data-included="false" cx="376.471" cy="352" r="5.5"/>
<text class="small" text-anchor="middle" x="376.471" y="377">3</text>
<line class="candidate" x1="418.824" y1="345" x2="418.824" y2="359"/>
<circle class="outside" data-role="candidate-integer" data-value="4" data-included="false" cx="418.824" cy="352" r="5.5"/>
<text class="small" text-anchor="middle" x="418.824" y="377">4</text>
<line class="candidate" x1="461.176" y1="345" x2="461.176" y2="359"/>
<circle class="inside" data-role="candidate-integer" data-value="5" data-included="true" cx="461.176" cy="352" r="5.5"/>
<text class="small" text-anchor="middle" x="461.176" y="377">5</text>
<line class="candidate" x1="503.529" y1="345" x2="503.529" y2="359"/>
<circle class="inside" data-role="candidate-integer" data-value="6" data-included="true" cx="503.529" cy="352" r="5.5"/>
<text class="small" text-anchor="middle" x="503.529" y="377">6</text>
<line class="candidate" x1="545.882" y1="345" x2="545.882" y2="359"/>
<circle class="inside" data-role="candidate-integer" data-value="7" data-included="true" cx="545.882" cy="352" r="5.5"/>
<text class="small" text-anchor="middle" x="545.882" y="377">7</text>
<text class="label accent" x="580" y="258">5, 6, 7 -> 3</text>
<text class="panel-title" x="55" y="420">가능한 a</text>
<line class="axis" x1="80.000" y1="470" x2="800.000" y2="470"/>
<line class="window" data-role="answer-interval" data-left="0" data-right="1" x1="145.455" y1="470" x2="210.909" y2="470"/>
<circle class="open" data-role="answer-boundary" data-value="0" data-state="OPEN" cx="145.455" cy="470" r="7"/>
<circle class="closed" data-role="answer-boundary" data-value="1" data-state="CLOSED" cx="210.909" cy="470" r="7"/>
<text class="label" text-anchor="middle" x="178.182" y="455">0 &lt; a ≤ 1</text>
<line class="window" data-role="answer-interval" data-left="8" data-right="9" x1="669.091" y1="470" x2="734.545" y2="470"/>
<circle class="closed" data-role="answer-boundary" data-value="8" data-state="CLOSED" cx="669.091" cy="470" r="7"/>
<circle class="open" data-role="answer-boundary" data-value="9" data-state="OPEN" cx="734.545" cy="470" r="7"/>
<text class="label" text-anchor="middle" x="701.818" y="455">8 ≤ a &lt; 9</text>
<text class="small" text-anchor="middle" x="145.455" y="493">0</text>
<text class="small" text-anchor="middle" x="210.909" y="493">1</text>
<text class="small" text-anchor="middle" x="669.091" y="493">8</text>
<text class="small" text-anchor="middle" x="734.545" y="493">9</text>

</svg>
