<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 384 320" width="384" height="320" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">원점을 지나는 원의 방정식을 x²+y²+Dx+Ey=0으로 놓는다. (0,3)을 대입하면 9+3E=0에서 E=−3이고 (−2,−1)을 대입하면 5−2D−E=0에서 D=4이다. 표준형으로 바꾸면 (x+2)²+(y−3/2)²=25/4이므로 중심은 M(−2,3/2)이고 반지름은 5/2이다. 따라서 원의 둘레의 길이는 2π×5/2=5π이고 답은 ③이다.</title><desc id="visual-desc">원점 O와 점 A(−2,−1), 점 B(0,3)을 지나는 원이 그려져 있고 중심 M에서 원점 O로 반지름 선분이 그어져 있으며 반지름 5/2가 적혀 있다.</desc><rect width="384" height="320" fill="#fff"/><g data-layer="30"><line id="MO" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="192" y1="154.946038431" x2="276.232692814" y2="218.120558042"/></g><g data-layer="40"><circle id="cc" data-role="circle" stroke="#111" stroke-width="2.05" fill="none" cx="192" cy="154.946038431" r="105.290866017"/></g><g data-layer="70"><circle id="O" data-role="point" stroke="#111" stroke-width="0.8" fill="#111" cx="276.232692814" cy="218.120558042" r="3.2"/></g><g data-layer="70"><circle id="A" data-role="point" stroke="#111" stroke-width="0.8" fill="#111" cx="192" cy="260.236904449" r="3.2"/></g><g data-layer="70"><circle id="B" data-role="point" stroke="#111" stroke-width="0.8" fill="#111" cx="276.232692814" cy="91.771518821" r="3.2"/></g><g data-layer="70"><circle id="M" data-role="point" stroke="#111" stroke-width="0.8" fill="#111" cx="192" cy="154