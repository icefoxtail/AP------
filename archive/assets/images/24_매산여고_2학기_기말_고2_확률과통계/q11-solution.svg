<svg xmlns="http://www.w3.org/2000/svg" width="500" height="320" viewBox="0 0 500 320" role="img" aria-labelledby="title desc"><title id="title">구간별 확률밀도함수와 사다리꼴 확률</title><desc id="desc">0부터 k까지 높이가 k인 직사각형, k에서 3k까지 직선적으로 감소하는 삼각형이 있고 k부터 2k 구간만 색칠하였다. k에서 높이는 k, 2k에서 높이는 k/2이다.</desc><style>.main{stroke:#222;stroke-width:3;fill:none;stroke-linejoin:round}.axis{stroke:#666;stroke-width:1.4}.guide{stroke:#777;stroke-width:1.4;stroke-dasharray:5 5}.shade{fill:#ccddf4}.label{font:17px Arial,'Noto Sans KR',sans-serif;fill:#222}.note{font:16px Arial,'Noto Sans KR',sans-serif;fill:#222}</style><text class="note" x="30" y="30">전체 넓이 = 1</text><path class="shade" d="M170 240 L170 70 L290 155 L290 240 Z"/><line class="axis" x1="36" y1="240" x2="453" y2="240"/><line class="axis" x1="50" y1="245" x2="50" y2="45"/><path class="main" d="M50 70 L170 70 L410 240"/><line class="guide" x1="170" y1="70" x2="170" y2="240"/><line class="guide" x1="290" y1="155" x2="290" y2="240"/><line class="guide" x1="50" y1="70" x2="170" y2="70"/><text class="label" x="41" y="263">0</text><text class="label" x="170" y="263" text-anchor="middle">k</text><text class="label" x="290" y="263" text-anchor="middle">2k</text><text class="label" x="410" y="263" text-anchor="middle">3k</text><text class="label" x="25" y="77">k</text><text class="label" x="293" y="150">k/2</text><text class="label" x="454" y="240">x</text><text class="note" x="186" y="209">구하는 넓이</text></svg>