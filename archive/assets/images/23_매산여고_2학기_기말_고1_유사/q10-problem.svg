<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 560" width="560" height="560" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">입구에서 폭포로 다섯 갈래의 등산로가, 폭포에서 정상으로 네 갈래의 등산로가 이어져 있는 모습을 보여 주는 그림이다.</title><desc id="visual-desc">아래쪽 입구에서 가운데 폭포까지 다섯 갈래의 길이 넓게 펼쳐져 이어져 있고, 폭포에서 위쪽 정상까지 네 갈래의 길이 넓게 펼쳐져 이어져 있다. 각 길은 서로 겹치지 않게 배치되어 있으며, 주요 지점에 각각 입구, 폭포, 정상이라는 글자가 표시되어 있다.</desc><rect width="560" height="560" fill="#fff"/><g data-layer="30"><line id="sEL1a" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="280" y1="501.428571429" x2="67.428571429" y2="430.571428571"/></g><g data-layer="30"><line id="sL1aL1b" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="67.428571429" y1="430.571428571" x2="67.428571429" y2="350.857142857"/></g><g data-layer="30"><line id="sL1bW" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="67.428571429" y1="350.857142857" x2="280" y2="280"/></g><g data-layer="30"><line id="sEL2a" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="280" y1="501.428571429" x2="173.714285714" y2="430.571428571"/></g><g data-layer="30"><line id="sL2aL2b" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="173.714285714" y1="430.571428571" x2="173.714285714" y2="350.857142857"/></g><g data-layer="30"><line id="sL2bW" data-role="line" stroke="#111" stroke-width="