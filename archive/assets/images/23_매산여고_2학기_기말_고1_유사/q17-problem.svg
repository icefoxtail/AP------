<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 380" width="480" height="380" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">세 분단 세 줄로 놓인 아홉 개의 좌석이 격자 모양으로 그려져 있고, 3분단 첫째 줄 좌석에는 두 대각선이 그어져 있다.</title><desc id="visual-desc">세로선 네 개와 가로선 네 개가 만나 가로 세 칸, 세로 세 칸의 좌석 격자가 그려져 있다. 격자 위쪽에 1분단, 2분단, 3분단이라는 글자가 왼쪽부터 차례로 붙어 있다. 오른쪽 위 칸 안에는 두 대각선이 엑스 모양으로 그어져 있다.</desc><rect width="480" height="380" fill="#fff"/><g data-layer="30"><line id="sv0" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="98.928571429" y1="331.071428571" x2="98.928571429" y2="48.928571429"/></g><g data-layer="30"><line id="sv1" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="192.976190476" y1="331.071428571" x2="192.976190476" y2="48.928571429"/></g><g data-layer="30"><line id="sv2" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="287.023809524" y1="331.071428571" x2="287.023809524" y2="48.928571429"/></g><g data-layer="30"><line id="sv3" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="381.071428571" y1="331.071428571" x2="381.071428571" y2="48.928571429"/></g><g data-layer="30"><line id="sh0" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="98.928571429" y1="331.071428571" x2="381.071428571" y2="331.071428571"/></g><g data-layer="30"><line id="sh1" data-role="line" stroke="#111" st