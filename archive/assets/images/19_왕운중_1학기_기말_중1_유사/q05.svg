<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 360" width="400" height="360" role="img" aria-labelledby="q05-title q05-desc">
  <title id="q05-title">좌표평면 위의 다섯 점 A, B, C, D, E</title>
  <desc id="q05-desc">좌표평면 위에 다섯 점 A(3, 3), B(4, -2), C(1, -3), D(-3, -2), E(-2, 4)와 원점 O가 표시된 그림</desc>
  <rect width="400" height="360" fill="#ffffff"/>

  <!-- Coordinate Axes -->
  <g stroke="#333333" stroke-width="1.5">
    <!-- X axis -->
    <line x1="30" y1="180" x2="370" y2="180"/>
    <polyline points="362,175 370,180 362,185" fill="none"/>
    <!-- Y axis -->
    <line x1="200" y1="330" x2="200" y2="30"/>
    <polyline points="195,38 200,30 205,38" fill="none"/>
  </g>

  <!-- Axis and Origin Labels -->
  <g font-family="sans-serif" font-size="14" fill="#111111" font-weight="bold">
    <text x="375" y="185">x</text>
    <text x="200" y="22" text-anchor="middle">y</text>
    <text x="186" y="196">O</text>
  </g>

  <!-- Dashed Guidelines -->
  <g stroke="#888888" stroke-width="1.2" stroke-dasharray="4,4">
    <!-- Point A(3, 3) -> (296, 84) -->
    <line x1="296" y1="180" x2="296" y2="84"/>
    <line x1="200" y1="84" x2="296" y2="84"/>
    <!-- Point B(4, -2) -> (328, 244) -->
    <line x1="328" y1="180" x2="328" y2="244"/>
    <line x1="200" y1="244" x2="328" y2="244"/>
    <!-- Point C(1, -3) -> (232, 276) -->
    <line x1="232" y1="180" x2="232" y2="276"/>
    <line x1="200" y1="276" x2="232" y2="276"/>
    <!-- Point D(-3, -2) -> (104, 244) -->
    <line x1="104" y1="180" x2="104" y2="244"/>
    <line x1="104" y1="244" x2="200" y2="244"/>
    <!-- Point E(-2, 4) -> (136, 52) -->
    <line x1="136" y1="180" x2="136" y2="52"/>
    <line x1="136" y1="52" x2="200" y2="52"/>
  </g>

  <!-- Axis Ticks & Numbers -->
  <g font-family="sans-serif" font-size="12" fill="#333333">
    <!-- X axis ticks -->
    <text x="296" y="196" text-anchor="middle">3</text>
    <text x="328" y="196" text-anchor="middle">4</text>
    <text x="232" y="196" text-anchor="middle">1</text>
    <text x="104" y="196" text-anchor="middle">-3</text>
    <text x="136" y="196" text-anchor="middle">-2</text>
    <!-- Y axis ticks -->
    <text x="194" y="88" text-anchor="end">3</text>
    <text x="194" y="56" text-anchor="end">4</text>
    <text x="206" y="248" text-anchor="start">-2</text>
    <text x="206" y="280" text-anchor="start">-3</text>
  </g>

  <!-- Points and Labels -->
  <g fill="#d9534f" stroke="#ffffff" stroke-width="1">
    <circle cx="296" cy="84" r="4.5"/>
    <circle cx="328" cy="244" r="4.5"/>
    <circle cx="232" cy="276" r="4.5"/>
    <circle cx="104" cy="244" r="4.5"/>
    <circle cx="136" cy="52" r="4.5"/>
  </g>

  <g font-family="sans-serif" font-size="14" font-weight="bold" fill="#111111">
    <text x="306" y="80">A</text>
    <text x="338" y="248">B</text>
    <text x="242" y="282">C</text>
    <text x="88" y="248">D</text>
    <text x="120" y="48">E</text>
  </g>
</svg>
