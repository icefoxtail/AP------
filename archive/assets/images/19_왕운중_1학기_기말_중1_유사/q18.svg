<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 260" width="460" height="260" role="img" aria-labelledby="q18-title q18-desc">
  <title id="q18-title">성냥개비로 만든 정삼각형과 정사각형 패턴</title>
  <desc id="q18-desc">성냥개비를 이어 붙여 정삼각형과 정사각형을 1개, 2개, 3개씩 만들어 가는 규칙적인 모양</desc>
  <rect width="460" height="260" fill="#ffffff"/>

  <!-- Row 1: Equilateral Triangles (A) -->
  <g font-family="sans-serif" font-size="14" font-weight="bold" fill="#111111">
    <text x="30" y="40">정삼각형 (A)</text>
  </g>

  <!-- 1 Triangle -->
  <g stroke="#8a5a36" stroke-width="3" stroke-linecap="round">
    <line x1="140" y1="80" x2="180" y2="80"/>
    <line x1="140" y1="80" x2="160" y2="45"/>
    <line x1="180" y1="80" x2="160" y2="45"/>
  </g>
  <!-- Match heads -->
  <g fill="#d9534f">
    <circle cx="140" cy="80" r="3.5"/>
    <circle cx="180" cy="80" r="3.5"/>
    <circle cx="160" cy="45" r="3.5"/>
  </g>
  <text x="160" y="100" font-family="sans-serif" font-size="12" fill="#555555" text-anchor="middle">1개</text>

  <!-- 2 Triangles connected -->
  <g stroke="#8a5a36" stroke-width="3" stroke-linecap="round">
    <line x1="220" y1="80" x2="260" y2="80"/>
    <line x1="220" y1="80" x2="240" y2="45"/>
    <line x1="260" y1="80" x2="240" y2="45"/>
    <line x1="260" y1="80" x2="300" y2="80"/>
    <line x1="300" y1="80" x2="280" y2="45"/>
    <line x1="260" y1="80" x2="280" y2="45"/>
  </g>
  <g fill="#d9534f">
    <circle cx="220" cy="80" r="3.5"/>
    <circle cx="260" cy="80" r="3.5"/>
    <circle cx="300" cy="80" r="3.5"/>
    <circle cx="240" cy="45" r="3.5"/>
    <circle cx="280" cy="45" r="3.5"/>
  </g>
  <text x="260" y="100" font-family="sans-serif" font-size="12" fill="#555555" text-anchor="middle">2개</text>

  <!-- 3 Triangles connected -->
  <g stroke="#8a5a36" stroke-width="3" stroke-linecap="round">
    <line x1="330" y1="80" x2="365" y2="80"/>
    <line x1="330" y1="80" x2="347" y2="45"/>
    <line x1="365" y1="80" x2="347" y2="45"/>
    <line x1="365" y1="80" x2="400" y2="80"/>
    <line x1="400" y1="80" x2="382" y2="45"/>
    <line x1="365" y1="80" x2="382" y2="45"/>
    <line x1="400" y1="80" x2="435" y2="80"/>
    <line x1="435" y1="80" x2="417" y2="45"/>
    <line x1="400" y1="80" x2="417" y2="45"/>
  </g>
  <g fill="#d9534f">
    <circle cx="330" cy="80" r="3.5"/>
    <circle cx="365" cy="80" r="3.5"/>
    <circle cx="400" cy="80" r="3.5"/>
    <circle cx="435" cy="80" r="3.5"/>
    <circle cx="347" cy="45" r="3.5"/>
    <circle cx="382" cy="45" r="3.5"/>
    <circle cx="417" cy="45" r="3.5"/>
  </g>
  <text x="382" y="100" font-family="sans-serif" font-size="12" fill="#555555" text-anchor="middle">3개</text>

  <!-- Divider line -->
  <line x1="30" y1="120" x2="430" y2="120" stroke="#e0e0e0" stroke-width="1"/>

  <!-- Row 2: Squares (B) -->
  <g font-family="sans-serif" font-size="14" font-weight="bold" fill="#111111">
    <text x="30" y="160">정사각형 (B)</text>
  </g>

  <!-- 1 Square -->
  <g stroke="#8a5a36" stroke-width="3" stroke-linecap="round">
    <line x1="140" y1="195" x2="175" y2="195"/>
    <line x1="140" y1="160" x2="175" y2="160"/>
    <line x1="140" y1="160" x2="140" y2="195"/>
    <line x1="175" y1="160" x2="175" y2="195"/>
  </g>
  <g fill="#d9534f">
    <circle cx="140" cy="160" r="3.5"/>
    <circle cx="175" cy="160" r="3.5"/>
    <circle cx="140" cy="195" r="3.5"/>
    <circle cx="175" cy="195" r="3.5"/>
  </g>
  <text x="157" y="220" font-family="sans-serif" font-size="12" fill="#555555" text-anchor="middle">1개</text>

  <!-- 2 Squares connected -->
  <g stroke="#8a5a36" stroke-width="3" stroke-linecap="round">
    <line x1="220" y1="195" x2="255" y2="195"/>
    <line x1="255" y1="195" x2="290" y2="195"/>
    <line x1="220" y1="160" x2="255" y2="160"/>
    <line x1="255" y1="160" x2="290" y2="160"/>
    <line x1="220" y1="160" x2="220" y2="195"/>
    <line x1="255" y1="160" x2="255" y2="195"/>
    <line x1="290" y1="160" x2="290" y2="195"/>
  </g>
  <g fill="#d9534f">
    <circle cx="220" cy="160" r="3.5"/>
    <circle cx="255" cy="160" r="3.5"/>
    <circle cx="290" cy="160" r="3.5"/>
    <circle cx="220" cy="195" r="3.5"/>
    <circle cx="255" cy="195" r="3.5"/>
    <circle cx="290" cy="195" r="3.5"/>
  </g>
  <text x="255" y="220" font-family="sans-serif" font-size="12" fill="#555555" text-anchor="middle">2개</text>

  <!-- 3 Squares connected -->
  <g stroke="#8a5a36" stroke-width="3" stroke-linecap="round">
    <line x1="330" y1="195" x2="365" y2="195"/>
    <line x1="365" y1="195" x2="400" y2="195"/>
    <line x1="400" y1="195" x2="435" y2="195"/>
    <line x1="330" y1="160" x2="365" y2="160"/>
    <line x1="365" y1="160" x2="400" y2="160"/>
    <line x1="400" y1="160" x2="435" y2="160"/>
    <line x1="330" y1="160" x2="330" y2="195"/>
    <line x1="365" y1="160" x2="365" y2="195"/>
    <line x1="400" y1="160" x2="400" y2="195"/>
    <line x1="435" y1="160" x2="435" y2="195"/>
  </g>
  <g fill="#d9534f">
    <circle cx="330" cy="160" r="3.5"/>
    <circle cx="365" cy="160" r="3.5"/>
    <circle cx="400" cy="160" r="3.5"/>
    <circle cx="435" cy="160" r="3.5"/>
    <circle cx="330" cy="195" r="3.5"/>
    <circle cx="365" cy="195" r="3.5"/>
    <circle cx="400" cy="195" r="3.5"/>
    <circle cx="435" cy="195" r="3.5"/>
  </g>
  <text x="382" y="220" font-family="sans-serif" font-size="12" fill="#555555" text-anchor="middle">3개</text>
</svg>
