<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 340" width="420" height="340" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">벽을 한 변으로 하는 직사각형 닭장을 철망으로 둘러싼 그림이다. 벽에 수직인 두 변의 길이는 각각 x m이고, 철망으로 둘러싼 세 변의 길이의 합은 16 m이다.</title><desc id="visual-desc">위쪽에 벽이 있고 그 아래에 직사각형 닭장이 있다. 왼쪽과 오른쪽 세로변 옆에 각각 x m가 적혀 있으며, 벽을 제외한 세 변을 따라 전체 길이 16 m가 표시되어 있다.</desc><rect width="420" height="340" fill="#fff"/><g data-layer="30"><line id="sAB" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="65.244755245" y1="49.370629371" x2="65.244755245" y2="290.629370629"/></g><g data-layer="30"><line id="sBC" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="65.244755245" y1="290.629370629" x2="354.755244755" y2="290.629370629"/></g><g data-layer="30"><line id="sCD" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="354.755244755" y1="290.629370629" x2="354.755244755" y2="49.370629371"/></g><g data-layer="30"><line id="sDA" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="354.755244755" y1="49.370629371" x2="65.244755245" y2="49.370629371"/></g><g data-layer="85"><line id="pWire-label-owner-leader" data-role="leader" data-owner-label="pWire-label" data-owner="pWire" x1="210" y1="290.629370629" x2="210" y2="266.629370629" stroke="#666" stroke-width="0.8" fill="none"/></g><g data-layer="90"><g id="p