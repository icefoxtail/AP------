<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 420" width="420" height="420" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">구를 중심 O에서 5 cm 떨어진 평면으로 자른 모습을 나타낸 그림이다. 단면의 양 끝이 구의 원 위에 있고, 중심 O에서 단면까지의 거리 5 cm가 표시되어 있다.</title><desc id="visual-desc">큰 원으로 나타낸 구의 중심 O 위쪽에 수평으로 놓인 단면이 있고, 단면의 양 끝이 구의 원 위에 있다. 중심 O와 단면의 중심을 잇는 세로 점선 옆에 5 cm가 적혀 있다.</desc><rect width="420" height="420" fill="#fff"/><g data-layer="30"><line id="sAA2" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="337.589083304" y1="124.750957854" x2="82.410916696" y2="124.750957854"/></g><g data-layer="30"><line id="sOH" data-role="line" stroke="#111" stroke-width="1.6" fill="none" stroke-dasharray="6 4" x1="210" y1="210" x2="210" y2="124.750957854"/></g><g data-layer="40"><circle id="sph" data-role="circle" stroke="#111" stroke-width="2.05" fill="none" cx="210" cy="210" r="153.448275862"/></g><g data-layer="70"><circle id="O" data-role="point" stroke="#111" stroke-width="0.8" fill="#111" cx="210" cy="210" r="3.2"/></g><g data-layer="90"><g id="O-name" data-label-kind="POINT_NAME" data-priority="1" data-font-px="20" data-owner="O" data-fragment-sha="sha256:16e0b84c9d73d1308eb08095edd5f4d54a0fb404466598ac037459ade844d275" transform="translate(222 183.48)"><svg xmlns="http://www.w3.org/2000/svg" width="15.26" height="14.52" viewBox="0 0 15.26 14.52" d