<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 340" width="460" height="340" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">평행한 두 직선 사이에 놓여 두 직선에 접하는 원 O가 그려져 있다. 원의 중심 O에서 아래 직선에 내린 반지름의 길이와, 두 직선 사이를 가로지르는 접선 CD의 길이가 표시되어 있다.</title><desc id="visual-desc">위아래로 평행한 두 직선 사이에 원이 놓여 두 직선에 접해 있고 중심 O가 표시되어 있다. 중심에서 위아래 직선에 내린 반지름과 직각 표시가 보이며, 아래 직선의 점 C와 위 직선의 점 D를 잇는 접선이 원에 접해 있다. 반지름 옆에 3, 접선 옆에 10이 적혀 있다.</desc><rect width="460" height="340" fill="#fff"/><g data-layer="30"><line id="sTop" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="109.292674307" y1="95.026505781" x2="384.195486444" y2="95.026505781"/></g><g data-layer="30"><line id="sBot" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="109.292674307" y1="244.973494219" x2="384.195486444" y2="244.973494219"/></g><g data-layer="30"><line id="sCD" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="359.204321704" y1="244.973494219" x2="159.275003787" y2="95.026505781"/></g><g data-layer="30"><line id="sOE" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="134.283839047" y1="170" x2="134.283839047" y2="95.026505781"/></g><g data-layer="30"><line id="sOG" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="134.283839047" y1="170" x2="134.283839047" y2="244.973494219"/></g><g data-layer="30"><line i