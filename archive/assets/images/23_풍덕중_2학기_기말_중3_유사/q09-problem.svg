<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 384 320" width="384" height="320" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">삼각형 ABC의 두 변 AB, BC의 연장선과 변 AC에 접하는 방접원 O가 있고, 세 접점 P, Q, R과 세 변의 길이 7, 9, 6이 표시된 그림이다.</title><desc id="visual-desc">삼각형 ABC에서 변 AB를 A 너머로 연장한 직선 위에 P, 변 BC를 C 너머로 연장한 직선 위에 Q, 변 AC 위에 R이 있고 이 세 점에서 방접원 O에 접한다. 원의 중심 O에서 P, Q, R로 반지름이 그려져 있고 각 변 곁에 7, 9, 6이 적혀 있다.</desc><rect width="384" height="320" fill="#fff"/><g data-layer="30"><line id="sAB" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="196.656226765" y1="227.250457408" x2="318.447826507" y2="227.250457408"/></g><g data-layer="30"><line id="sBC" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="318.447826507" y1="227.250457408" x2="201.627312469" y2="122.976083986"/></g><g data-layer="30"><line id="sCA" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="201.627312469" y1="122.976083986" x2="196.656226765" y2="227.250457408"/></g><g data-layer="30"><line id="sAP" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="196.656226765" y1="227.250457408" x2="127.061026913" y2="227.250457408"/></g><g data-layer="30"><line id="sCQ" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="201.627312469" y1="122.976083986" x2="175.667198238" y2="99.804001003"/></g><g data-layer="30"><line