<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 384 320" width="384" height="320" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">사각형 ABCD에서 변 BC를 점 C 너머로 연장한 위에 점 E를 잡은 그림이다. 선분 AC와 선분 DE에 평행 표시가 있고, 변 BC와 CE의 길이의 비는 4 : 5로 표시되어 있다. 사각형 ABCD의 넓이는 45 제곱센티미터이다.</title><desc id="visual-desc">사각형 ABCD와 변 BC를 연장한 선분 위의 점 E가 있고, E와 D를 잇는 선분이 그려져 있다. AC와 DE에 평행 표시가 있으며, BC에 4, CE에 5라는 수가 적혀 있다. 사각형 전체 영역에 45라는 넓이 값이 지시선으로 붙어 있다.</desc><rect width="384" height="320" fill="#fff"/><g data-layer="10"><path id="rg0" data-role="region" stroke="none" stroke-width="1.6" fill="#e4e7ec" data-owner-points="A B C D" data-mark="region" data-mark-id="rg0" fill-rule="evenodd" d="M80.888888889 120.317460317 L49.142857143 199.682539683 L176.126984127 199.682539683 L239.619047619 120.317460317 L80.888888889 120.317460317 Z"/></g><g data-layer="30"><line id="AB" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="80.888888889" y1="120.317460317" x2="49.142857143" y2="199.682539683"/></g><g data-layer="30"><line id="BC" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="49.142857143" y1="199.682539683" x2="176.126984127" y2="199.682539683"/></g><g data-layer="30"><line id="CE" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="176.126984127" y1="199.682539683" x2="334.857142857" y2="199.682539683"/></g><g data-laye