<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 460" width="460" height="460" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">가운데 영역 A를 다섯 개의 영역 B, C, D, E, F가 고리 모양으로 둘러싸고 있는 그림이다.</title><desc id="visual-desc">작은 원 모양의 가운데 영역에 A가 적혀 있고, 그 둘레를 다섯 조각으로 나뉜 고리 모양의 영역이 감싸고 있다. 고리의 각 조각에는 위에서부터 시계 반대 방향으로 B, C, D, E, F가 적혀 있다. 이웃한 영역은 곡선이나 선분 하나를 사이에 두고 맞닿아 있다.</desc><rect width="460" height="460" fill="#fff"/><g data-layer="10"><path id="rA" data-role="region" stroke="none" stroke-width="1.6" fill="#e4e7ec" data-owner-points="I0 I1 I2 I3 I4 I5 I6 I7 I8 I9" data-mark="region" data-mark-id="rA" fill-rule="evenodd" d="M230 141.607142857 L178.047098214 158.490178571 L145.931026786 202.686607143 L145.931026786 257.313392857 L178.047098214 301.509821429 L230 318.392857143 L281.952901786 301.509821429 L314.068973214 257.313392857 L314.068973214 202.686607143 L281.952901786 158.490178571 L230 141.607142857 Z"/></g><g data-layer="10"><path id="rB" data-role="region" stroke="none" stroke-width="1.6" fill="#e4e7ec" data-owner-points="I0 I1 I2 O0 O1 O2" data-mark="region" data-mark-id="rB" fill-rule="evenodd" d="M230 53.214285714 L126.086830357 86.980357143 L61.862053571 175.373214286 L145.931026786 202.686607143 L178.047098214 158.490178571 L230 141.607142857 L230 53.214285714 Z"/></g><g data-layer="10"><path id="rC" data-role="region" stroke