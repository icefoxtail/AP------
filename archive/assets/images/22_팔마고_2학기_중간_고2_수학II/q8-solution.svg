<svg xmlns="http://www.w3.org/2000/svg" width="640" height="460" viewBox="0 0 640 460" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc">
  <title id="title">22 팔마고 8번 최대정수함수와 좌우극한 해설</title>
  <desc id="desc">f의 x=1,2 열린 점과 닫힌 점, g의 x=1 좌극한, x+1의 우측 접근을 함께 설명하는 해설 그림</desc>
  <style>
    .background{fill:#fff}
    .axis{stroke:#171717;stroke-width:1.4;fill:none;stroke-linecap:round;stroke-linejoin:round}
    .curve{stroke:#111;stroke-width:2.1;fill:none;stroke-linecap:round;stroke-linejoin:round}
    .guide{stroke:#777;stroke-width:.95;stroke-dasharray:4 4;fill:none}
    .point-open{stroke:#111;stroke-width:1.4;fill:#fff}
    .point-closed{stroke:#111;stroke-width:1;fill:#111}
    .panel{fill:#f7f8fa;stroke:#c7cbd1;stroke-width:1}
    .title{font-family:"Noto Sans KR","Pretendard","Malgun Gothic",sans-serif;font-size:15px;font-weight:700;fill:#111}
    .label{font-family:"Noto Sans KR","Pretendard","Malgun Gothic",sans-serif;font-size:12px;fill:#222}
    .small{font-family:"Noto Sans KR","Pretendard","Malgun Gothic",sans-serif;font-size:11px;fill:#333}
    .math{font-family:"STIX Two Math","Cambria Math","Times New Roman",serif;font-size:13px;fill:#111}
    .tick{font-family:"STIX Two Math","Cambria Math","Times New Roman",serif;font-size:11.5px;fill:#222}
  </style>
  <defs>
    <marker id="axis-arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 Z" fill="#171717"/>
    </marker>
  </defs>
  <rect class="background" x="0" y="0" width="640" height="460"/>
  <text class="title" x="32" y="28">q8  좌우극한과 최대정수함수</text>
  <text class="small" x="32" y="47">점의 값과 접근값을 분리한 뒤, t=x+1의 접근 방향을 보존한다.</text>

  <g aria-label="f graph">
    <rect class="panel" x="32" y="65" width="210" height="225" rx="8"/>
    <text class="label" x="48" y="88">y=f(t)</text>
    <line class="axis" x1="48" y1="220" x2="220" y2="220" marker-end="url(#axis-arrow)"/>
    <line class="axis" x1="130" y1="220" x2="130" y2="98" marker-end="url(#axis-arrow)"/>
    <path class="curve" d="M50 125 L130 220"/>
    <path class="curve" d="M130 220 L170 125"/>
    <path class="curve" d="M170 125 L215 80"/>
    <circle class="point-open" cx="130" cy="220" r="4.5" fill="#fff"/>
    <circle class="point-closed" cx="130" cy="125" r="4" fill="#111"/>
    <circle class="point-open" cx="170" cy="125" r="4.5" fill="#fff"/>
    <circle class="point-closed" cx="170" cy="220" r="4" fill="#111"/>
    <line class="guide" x1="130" y1="125" x2="130" y2="220"/>
    <line class="guide" x1="170" y1="125" x2="170" y2="220"/>
    <text class="tick" x="125" y="238">1</text>
    <text class="tick" x="166" y="238">2</text>
    <text class="tick" x="112" y="129">1</text>
    <text class="small" x="84" y="259">f(1)=1, lim t→1 f(t)=0</text>
    <text class="small" x="80" y="277">lim t→2+ f(t)=1+</text>
  </g>

  <g aria-label="g graph">
    <rect class="panel" x="254" y="65" width="150" height="225" rx="8"/>
    <text class="label" x="270" y="88">y=g(x)</text>
    <line class="axis" x1="270" y1="220" x2="390" y2="220" marker-end="url(#axis-arrow)"/>
    <line class="axis" x1="330" y1="220" x2="330" y2="98" marker-end="url(#axis-arrow)"/>
    <path class="curve" d="M272 125 C292 128 318 160 330 220"/>
    <path class="curve" d="M330 125 C354 128 376 155 386 220"/>
    <circle class="point-open" cx="330" cy="220" r="4.5" fill="#fff"/>
    <circle class="point-closed" cx="330" cy="125" r="4" fill="#111"/>
    <line class="guide" x1="330" y1="125" x2="330" y2="220"/>
    <text class="tick" x="326" y="238">1</text>
    <text class="tick" x="314" y="129">1</text>
    <text class="small" x="274" y="259">lim x→1− g(x)=0</text>
    <text class="small" x="278" y="277">g(1)=1은 별도 값</text>
  </g>

  <g aria-label="calculation panel">
    <rect class="panel" x="416" y="65" width="192" height="225" rx="8"/>
    <text class="title" x="434" y="91">계산 흐름</text>
    <text class="math" x="434" y="122">x→1+  ⇒  t=x+1→2+</text>
    <text class="math" x="434" y="151">1 &lt; f(t) &lt; 2</text>
    <text class="small" x="434" y="171">따라서 ⌊f(t)⌋=1</text>
    <line class="guide" x1="434" y1="184" x2="590" y2="184"/>
    <text class="math" x="434" y="211">lim ⌊f(x+1)⌋ = 1</text>
    <text class="math" x="434" y="239">lim g(x) = 0</text>
    <text class="label" x="434" y="261">합 = 1+0 = 1</text>
  </g>

  <g aria-label="warning panel">
    <rect class="panel" x="32" y="300" width="576" height="110" rx="8"/>
    <text class="title" x="50" y="328">주의할 점</text>
    <text class="small" x="50" y="352">① f(2)=0인 닫힌 점을 대입하지 않는다. x→1+이면 입력은 2+이다.</text>
    <text class="small" x="50" y="375">② f의 열린 점·닫힌 점과 g의 x=1 좌극한을 각각 읽는다.</text>
    <text class="small" x="50" y="398">③ 접근값이 1보다 조금 큰 구간이므로 최대정수값은 계속 1이다.</text>
  </g>
</svg>
