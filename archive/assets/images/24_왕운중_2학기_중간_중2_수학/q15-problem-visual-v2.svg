<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 607 603" width="607" height="603" role="img" aria-labelledby="title desc"><title id="title">같은 중심의 두 원으로 이루어진 과녁</title><desc id="desc">두 원의 중심은 O이다. 빗금을 그은 바깥 고리는 (가), 색을 채운 안의 원은 (나)이다. 중심에서 아래로 뻗은 선은 안의 원을 P, 바깥 원을 Q에서 지난다.</desc><rect width="607" height="603" fill="white" /><defs><pattern id="target-hatching" width="13" height="13" patternUnits="userSpaceOnUse" patternTransform="rotate(37)"><line x1="2" y1="0" x2="2" y2="13" stroke="#7a9bb3" stroke-width="2" /></pattern></defs><circle cx="303" cy="283" r="228" fill="#e9f3fa" stroke="#23649a" stroke-width="4.2" /><circle cx="303" cy="283" r="228" fill="url(#target-hatching)" /><circle cx="303" cy="283" r="76" fill="#ddf0e5" stroke="#217264" stroke-width="4.15" /><text x="303.0000" y="143.0000" font-size="32" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#23649a" text-anchor="middle">(가)</text><text x="303.0000" y="252.0000" font-size="31" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#217264" text-anchor="middle">(나)</text><line x1="303.0000" y1="283.0000" x2="303.0000" y2="359.0000" stroke="#217264" stroke-width="4.15" stroke-linecap="round" /><line x1="303.0000" y1="359.0000" x2="303.0000" y2="511.0000" stroke="#23649a" stroke-width="4.0" stroke-linecap="round" /><circle cx="303" cy="283" r="5" fill="#217264" /><text x="280.0000" y="290.0000" font-size="30" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#283b49" text-anchor="middle">O</text><circle cx="303" cy="359" r="5" fill="#217264" /><text x="324.0000" y="368.0000" font-size="30" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#283b49" text-anchor="middle">P</text><circle cx="303" cy="511" r="5" fill="#23649a" /><text x="304.0000" y="543.0000" font-size="30" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#283b49" text-anchor="middle">Q</text></svg>
