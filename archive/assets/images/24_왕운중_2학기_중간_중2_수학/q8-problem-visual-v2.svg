<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 735 493" width="735" height="493" role="img" aria-labelledby="title desc"><title id="title">밑면의 크기가 다른 닮은 두 원뿔</title><desc id="desc">왼쪽 (가)와 오른쪽 (나)는 닮은 원뿔이다. (가)와 (나)의 밑면 반지름 비는 2 대 3이다. 밑면의 보이는 쪽과 뒤쪽 경계를 실선, 점선으로 구별했다.</desc><rect width="735" height="493" fill="white" /><polygon points="65.5000,370.0000 167.0000,171.0000 268.5000,370.0000" fill="none" /><ellipse cx="167" cy="370" rx="101.5" ry="29.435" fill="none" /><line x1="65.5000" y1="370.0000" x2="167.0000" y2="171.0000" stroke="#23649a" stroke-width="4.55" stroke-linecap="round" /><line x1="167.0000" y1="171.0000" x2="268.5000" y2="370.0000" stroke="#23649a" stroke-width="4.55" stroke-linecap="round" /><path d="M 65.500 370.000 A 101.50 29.43 0 0 1 268.500 370.000" fill="none" stroke="#65788a" stroke-width="3.5" stroke-dasharray="8 5" /><path d="M 65.500 370.000 A 101.50 29.43 0 0 0 268.500 370.000" fill="none" stroke="#217264" stroke-width="3.5" /><text x="167.0000" y="449.4350" font-size="32" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#283b49" text-anchor="middle">(가)</text><polygon points="350.7500,370.0000 503.0000,71.5000 655.2500,370.0000" fill="none" /><ellipse cx="503" cy="370" rx="152.25" ry="44.152499999999996" fill="none" /><line x1="350.7500" y1="370.0000" x2="503.0000" y2="71.5000" stroke="#23649a" stroke-width="4.55" stroke-linecap="round" /><line x1="503.0000" y1="71.5000" x2="655.2500" y2="370.0000" stroke="#23649a" stroke-width="4.55" stroke-linecap="round" /><path d="M 350.750 370.000 A 152.25 44.15 0 0 1 655.250 370.000" fill="none" stroke="#65788a" stroke-width="3.5" stroke-dasharray="8 5" /><path d="M 350.750 370.000 A 152.25 44.15 0 0 0 655.250 370.000" fill="none" stroke="#217264" stroke-width="3.5" /><text x="503.0000" y="464.1525" font-size="32" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#283b49" text-anchor="middle">(나)</text></svg>
