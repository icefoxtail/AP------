<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 703 527" width="703" height="527" role="img" aria-labelledby="title desc"><title id="title">외심에서 세 꼭짓점으로 그은 선과 두 주어진 각</title><desc id="desc">삼각형 ABC의 가운데 외심 O에서 세 꼭짓점까지 선이 있다. 왼쪽 B의 OBC는 25도, 오른쪽 C의 OCA는 40도이며 위쪽 A의 BAO가 x이다.</desc><rect width="703" height="527" fill="white" /><polygon points="420.8393,77.5000 108.6942,449.5000 594.3058,449.5000" fill="none" /><line x1="420.8393" y1="77.5000" x2="108.6942" y2="449.5000" stroke="#23649a" stroke-width="4.7" stroke-linecap="round" /><line x1="108.6942" y1="449.5000" x2="594.3058" y2="449.5000" stroke="#23649a" stroke-width="4.7" stroke-linecap="round" /><line x1="594.3058" y1="449.5000" x2="420.8393" y2="77.5000" stroke="#23649a" stroke-width="4.7" stroke-linecap="round" /><line x1="351.5000" y1="336.2778" x2="420.8393" y2="77.5000" stroke="#217264" stroke-width="4.4" stroke-linecap="round" /><line x1="351.5000" y1="336.2778" x2="108.6942" y2="449.5000" stroke="#217264" stroke-width="4.4" stroke-linecap="round" /><line x1="351.5000" y1="336.2778" x2="594.3058" y2="449.5000" stroke="#217264" stroke-width="4.4" stroke-linecap="round" /><path d="M 172.6942 449.5000 A 64 64 0 0 0 166.6979 422.4524" stroke="#217264" stroke-width="2.25" fill="none" /><text x="219.1105" y="433.9081" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#217264" text-anchor="middle">25°</text><path d="M 552.6156 430.0596 A 46 46 0 0 1 574.8653 407.8098" stroke="#217264" stroke-width="2.25" fill="none" /><text x="536.3230" y="399.5172" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#217264" text-anchor="middle">40°</text><path d="M 389.3427 115.0362 A 49 49 0 0 0 408.1572 124.8304" stroke="#764795" stroke-width="2.25" fill="none" /><text x="380.2054" y="163.5570" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#764795" text-anchor="middle">x</text><circle cx="420.