<svg xmlns="http://www.w3.org/2000/svg" width="640" height="450" viewBox="0 0 640 450" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc">
  <title id="title">25 제일고 9번 곱의 연속과 합성 극한 해설</title>
  <desc id="desc">f와 g의 좌우 값을 비교해 x=1의 곱은 연속이고 x=0의 합성 극한은 존재하지 않음을 보인다</desc>
  <style>.background{fill:#fff}.axis{stroke:#171717;stroke-width:1.3;fill:none;stroke-linecap:round;stroke-linejoin:round}.curve{stroke:#111;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}.guide{stroke:#777;stroke-width:.95;stroke-dasharray:4 4;fill:none}.open{stroke:#111;stroke-width:1.4;fill:#fff}.closed{stroke:#111;stroke-width:1;fill:#111}.panel{fill:#f7f8fa;stroke:#c7cbd1;stroke-width:1}.title{font-family:"Noto Sans KR","Pretendard","Malgun Gothic",sans-serif;font-size:15px;font-weight:700;fill:#111}.label{font-family:"Noto Sans KR","Pretendard","Malgun Gothic",sans-serif;font-size:12px;fill:#222}.small{font-family:"Noto Sans KR","Pretendard","Malgun Gothic",sans-serif;font-size:11px;fill:#333}.math{font-family:"STIX Two Math","Cambria Math","Times New Roman",serif;font-size:13px;fill:#111}</style>
  <rect class="background" x="0" y="0" width="640" height="450"/><text class="title" x="32" y="28">q9  곱의 연속과 합성 극한</text><text class="small" x="32" y="47">불연속점의 좌우값을 곱하고, x−1의 접근 방향을 f에 전달한다.</text>
  <g aria-label="f-graph"><rect class="panel" x="32" y="65" width="270" height="214" rx="8"/><text class="label" x="48" y="90">f(x)</text><line class="axis" x1="48" y1="214" x2="286" y2="214"/><path class="curve" d="M52 154 L112 154 L150 198 L198 120 L238 120 L282 186"/><circle class="open" cx="112" cy="154" r="4.5"/><circle class="closed" cx="112" cy="198" r="4"/><circle class="open" cx="198" cy="120" r="4.5"/><circle class="closed" cx="198" cy="186" r="4"/><line class="guide" x1="112" y1="154" x2="112" y2="214"/><line class="guide" x1="198" y1="120" x2="198" y2="214"/><text class="label" x="104" y="238">−1</text><text class="label" x="190" y="238">1</text></g>
  <g aria-label="g-graph"><rect class="panel" x="322" y="65" width="286" height="214" rx="8"/><text class="label" x="338" y="90">g(x)</text><line class="axis" x1="338" y1="214" x2="592" y2="214"/><path class="curve" d="M342 186 L414 186 L462 140 L520 140 L584 104"/><circle class="open" cx="462" cy="140" r="4.5"/><circle class="closed" cx="462" cy="186" r="4"/><text class="label" x="454" y="238">1</text><text class="small" x="338" y="264">x=1에서 g의 값이 갈림</text></g>
  <g aria-label="decision"><rect class="panel" x="32" y="300" width="576" height="72" rx="8"/><text class="math" x="50" y="328">x=1: f·g의 좌우값=−1, 실제값=−1 ⇒ ㄴ 참</text><text class="math" x="50" y="354">x→0−: f(x−1)g(x)→1,  x→0+: →−1 ⇒ ㄷ 거짓 · 정답: ②</text></g>
  <rect class="panel" x="32" y="390" width="576" height="38" rx="7"/><text class="small" x="50" y="414">곱은 두 인수의 값을 함께 보고, 합성은 x−1의 좌우 방향을 따로 본다.</text>
</svg>
