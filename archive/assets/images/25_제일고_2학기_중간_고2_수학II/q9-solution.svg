<svg xmlns="http://www.w3.org/2000/svg" width="640" height="450" viewBox="0 0 640 450" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc">
  <title id="title">25 제일고 9번 곱의 연속과 합성 극한 해설</title>
  <desc id="desc">원문 그래프와 동일하게 f의 열린점·닫힌점과 g의 포물선 및 열린점·닫힌점을 표시하고, x=1의 곱은 연속이며 x=0의 합성 극한은 존재하지 않음을 보인다.</desc>
  <style>
    .background{fill:#fff}
    .axis{stroke:#171717;stroke-width:1.3;fill:none;stroke-linecap:round;stroke-linejoin:round}
    .curve{stroke:#111;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
    .guide{stroke:#777;stroke-width:.95;stroke-dasharray:4 4;fill:none}
    .open{stroke:#111;stroke-width:1.4;fill:#fff}
    .closed{stroke:#111;stroke-width:1;fill:#111}
    .panel{fill:#f7f8fa;stroke:#c7cbd1;stroke-width:1}
    .title{font-family:"Noto Sans KR","Pretendard","Malgun Gothic",sans-serif;font-size:15px;font-weight:700;fill:#111}
    .label{font-family:"Noto Sans KR","Pretendard","Malgun Gothic",sans-serif;font-size:12px;fill:#222}
    .small{font-family:"Noto Sans KR","Pretendard","Malgun Gothic",sans-serif;font-size:11px;fill:#333}
    .math{font-family:"STIX Two Math","Cambria Math","Times New Roman",serif;font-size:13px;fill:#111}
  </style>

  <rect class="background" x="0" y="0" width="640" height="450"/>
  <text class="title" x="32" y="28">q9  곱의 연속과 합성 극한</text>
  <text class="small" x="32" y="47">원문 그래프의 열린점·닫힌점과 좌우 극한을 그대로 비교한다.</text>

  <!-- f(x): x≤−1에서 1, −1&lt;x&lt;1에서 y=x, x≥1에서 −1 -->
  <g aria-label="f-graph">
    <rect class="panel" x="32" y="65" width="270" height="214" rx="8"/>
    <text class="label" x="48" y="90">f(x)</text>

    <!-- axes: origin=(168,186), scale 48px/unit -->
    <line class="axis" x1="48" y1="186" x2="286" y2="186"/>
    <line class="axis" x1="168" y1="94" x2="168" y2="260"/>

    <line class="guide" x1="120" y1="138" x2="120" y2="234"/>
    <line class="guide" x1="216" y1="138" x2="216" y2="234"/>
    <line class="guide" x1="120" y1="138" x2="216" y2="138"/>
    <line class="guide" x1="120" y1="234" x2="216" y2="234"/>

    <line class="curve" x1="52" y1="138" x2="120" y2="138"/>
    <line class="curve" x1="120" y1="234" x2="216" y2="138"/>
    <line class="curve" x1="216" y1="234" x2="282" y2="234"/>

    <!-- source parity: (-1,1) closed / (-1,-1) open / (1,1) open / (1,-1) closed -->
    <circle class="closed" cx="120" cy="138" r="4"/>
    <circle class="open" cx="120" cy="234" r="4.5"/>
    <circle class="open" cx="216" cy="138" r="4.5"/>
    <circle class="closed" cx="216" cy="234" r="4"/>

    <text class="label" x="109" y="205">−1</text>
    <text class="label" x="211" y="205">1</text>
    <text class="label" x="174" y="142">1</text>
    <text class="label" x="174" y="238">−1</text>
  </g>

  <!-- g(x): x≤−1에서 −1, −1≤x&lt;1에서 원문 포물선(−1,−1),(0,1),(1,−1),
       x≥1에서 1.  x=1에서 아래 open / 위 closed -->
  <g aria-label="g-graph">
    <rect class="panel" x="322" y="65" width="286" height="214" rx="8"/>
    <text class="label" x="338" y="90">g(x)</text>

    <!-- axes: origin=(468,186), scale 48px/unit -->
    <line class="axis" x1="338" y1="186" x2="592" y2="186"/>
    <line class="axis" x1="468" y1="94" x2="468" y2="260"/>

    <line class="guide" x1="420" y1="138" x2="420" y2="234"/>
    <line class="guide" x1="516" y1="138" x2="516" y2="234"/>
    <line class="guide" x1="420" y1="138" x2="516" y2="138"/>
    <line class="guide" x1="420" y1="234" x2="516" y2="234"/>

    <line class="curve" x1="342" y1="234" x2="420" y2="234"/>

    <!-- quadratic y = 1 - 2x^2 in math coordinates; sampled deterministically -->
    <polyline class="curve"
      points="420,234 424.8,215.76 429.6,199.44 434.4,185.04 439.2,172.56 444,162
              448.8,153.36 453.6,146.64 458.4,141.84 463.2,138.96 468,138
              472.8,138.96 477.6,141.84 482.4,146.64 487.2,153.36 492,162
              496.8,172.56 501.6,185.04 506.4,199.44 511.2,215.76 516,234"/>

    <line class="curve" x1="516" y1="138" x2="588" y2="138"/>

    <circle class="open" cx="516" cy="234" r="4.5"/>
    <circle class="closed" cx="516" cy="138" r="4"/>

    <text class="label" x="409" y="205">−1</text>
    <text class="label" x="511" y="205">1</text>
    <text class="label" x="474" y="142">1</text>
    <text class="label" x="474" y="238">−1</text>
  </g>

  <g aria-label="decision">
    <rect class="panel" x="32" y="300" width="576" height="72" rx="8"/>
    <text class="math" x="50" y="328">x=1: f·g의 좌우극한=−1, 실제값=−1 ⇒ ㄴ 참</text>
    <text class="math" x="50" y="354">x→0−: f(x−1)g(x)→1,  x→0+: →−1 ⇒ ㄷ 거짓 · 정답: ②</text>
  </g>

  <rect class="panel" x="32" y="390" width="576" height="38" rx="7"/>
  <text class="small" x="50" y="414">f의 x=−1,1과 g의 x=1에서 열린점·닫힌점을 원문과 동일하게 읽는다.</text>
</svg>
