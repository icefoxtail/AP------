<svg xmlns="http://www.w3.org/2000/svg" width="640" height="410" viewBox="0 0 640 410" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc">
  <title id="title">25 제일고 18번 접선 조건과 삼중근 해설</title>
  <desc id="desc">g=f−x가 x=1에서 중근을 갖고 조건 3g(2)=h(2)로 세제곱을 확정한다</desc>
  <style>.background{fill:#fff}.axis{stroke:#171717;stroke-width:1.4;fill:none;stroke-linecap:round;stroke-linejoin:round}.curve{stroke:#111;stroke-width:2.1;fill:none;stroke-linecap:round;stroke-linejoin:round}.line{stroke:#356a9a;stroke-width:1.8;fill:none;stroke-linecap:round}.guide{stroke:#777;stroke-width:.95;stroke-dasharray:4 4;fill:none}.point{stroke:#111;stroke-width:1;fill:#111}.panel{fill:#f7f8fa;stroke:#c7cbd1;stroke-width:1}.title{font-family:"Noto Sans KR","Pretendard","Malgun Gothic",sans-serif;font-size:15px;font-weight:700;fill:#111}.label{font-family:"Noto Sans KR","Pretendard","Malgun Gothic",sans-serif;font-size:12px;fill:#222}.small{font-family:"Noto Sans KR","Pretendard","Malgun Gothic",sans-serif;font-size:11px;fill:#333}.math{font-family:"STIX Two Math","Cambria Math","Times New Roman",serif;font-size:13px;fill:#111}</style>
  <defs><marker id="axis-arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L6,3 L0,6 Z" fill="#171717"/></marker></defs>
  <rect class="background" x="0" y="0" width="640" height="410"/><text class="title" x="32" y="28">q18  접선 조건으로 g 확정</text><text class="small" x="32" y="47">f의 y=x 접선은 g(x)=f(x)−x의 x=1 중근을 만든다.</text>
  <g aria-label="graph"><rect class="panel" x="32" y="65" width="342" height="264" rx="8"/><line class="axis" x1="52" y1="246" x2="352" y2="246" marker-end="url(#axis-arrow)"/><line class="axis" x1="180" y1="310" x2="180" y2="82" marker-end="url(#axis-arrow)"/><path class="curve" d="M54 306 C104 296 132 260 154 246 C176 232 202 260 224 246 C252 226 282 166 350 96"/><path class="line" d="M54 306 L350 96"/><circle class="point" cx="180" cy="246" r="4"/><circle class="point" cx="224" cy="246" r="4"/><line class="guide" x1="180" y1="246" x2="180" y2="270"/><text class="label" x="172" y="288">x=1</text><text class="label" x="228" y="240">x=2</text><text class="math" x="354" y="251">x</text><text class="math" x="186" y="88">f, y=x</text></g>
  <g aria-label="calculation"><rect class="panel" x="392" y="65" width="216" height="264" rx="8"/><text class="title" x="410" y="92">중근 조건</text><text class="math" x="410" y="132">g=(x−1)²(x−a)</text><text class="math" x="410" y="168">g(2)=2−a</text><text class="math" x="410" y="204">h(2)=g′(2)=5−2a</text><text class="math" x="410" y="240">3(2−a)=5−2a</text><text class="math" x="410" y="276">a=1,  f(2)=3</text><text class="label" x="410" y="310">정답: ⑤</text></g>
  <rect class="panel" x="32" y="348" width="576" height="38" rx="7"/><text class="small" x="50" y="372">a=1이므로 g(x)=(x−1)³, f(x)=g(x)+x이고 f(2)=3이다.</text>
</svg>
