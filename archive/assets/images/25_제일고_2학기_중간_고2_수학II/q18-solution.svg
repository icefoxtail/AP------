0,190.215 202.812,185.831 204.125,181.257 205.438,176.489 206.750,171.519 208.062,166.345 209.375,160.960 210.688,155.358 212.000,149.536 213.312,143.488 214.625,137.208 215.938,130.691 217.250,123.933 218.562,116.927 219.875,109.669 221.188,102.153 222.500,94.375"/><polyline class="line" points="65.000,335.000 222.500,212.500"/><circle class="point" cx="155.000" cy="265.000" r="4.00"/><circle class="point" cx="200.000" cy="195.000" r="4.00"/><line class="guide" x1="155.000" y1="265.000" x2="155.000" y2="300.000"/><text class="label" x="145.000" y="322.000">x=1</text><text class="label" x="206.000" y="187.000">x=2, f(2)=3</text><text class="math" x="354.000" y="251.000">x</text><text class="math" x="116.000" y="88.000">f, y=x</text></g></g>
  <g aria-label="calculation"><rect class="panel" x="392" y="65" width="216" height="296" rx="8"/><text class="title" x="410.000" y="92.000">계산</text><text class="math" x="410.000" y="132.000">g=(x−1)²(x−a)</text><text class="math" x="410.000" y="166.000">g(2)=2−a</text><text class="math" x="410.000" y="200.000">h(2)=g′(2)=5−2a</text><text class="math" x="410.000" y="234.000">3(2−a)=5−2a</text><text class="math" x="410.000" y="268.000">a=1, f(2)=3</text><text class="label" x="410.000" y="302.000">정답: ⑤</text></g>
  <rect class="panel" x="32" y="382" width="576" height="38" rx="7"/><text class="small" x="50.000" y="406.000">a=1이므로 g(x)=(x−1)³이고 f(x)=g(x)+x에서 f(2)=3이다.</text>
</svg>
