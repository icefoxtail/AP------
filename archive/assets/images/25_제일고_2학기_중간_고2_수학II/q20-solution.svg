<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="520" viewBox="0 0 760 520" role="img" aria-labelledby="title desc" data-scale-policy="SCHEMATIC_ALLOWED" data-visual-provenance="reconstructed_from_independent_solution_facts">
  <title id="title">문항 20 해설: 직선 y=x에 접하는 원의 중심거리와 반지름</title>
  <desc id="desc">대표 배치 a=2에서 중심 C와 접점 T를 잇는 반지름이 접선 y=x와 수직이고, 원점에서 원까지의 최댓거리 d가 OC+r임을 나타낸 해설 도형</desc>
  <style>
    text{font-family:Arial,"Malgun Gothic",sans-serif;fill:#111827}
    .axis{stroke:#111827;stroke-width:1.2;stroke-linecap:round}
    .tangent{stroke:#111827;stroke-width:2.05;stroke-linecap:round}
    .circle{fill:#eff6ff;fill-opacity:.36;stroke:#111827;stroke-width:2.05}
    .auxiliary{fill:none;stroke:#64748b;stroke-width:1;stroke-dasharray:5 4;stroke-linecap:round}
    .radius{fill:none;stroke:#2563eb;stroke-width:1.6;stroke-linecap:round}
    .distance{fill:none;stroke:#0f766e;stroke-width:1.6;stroke-linecap:round}
    .point{stroke:#fff;stroke-width:1}
    .label{font-size:22px;font-weight:700}
    .small{font-size:17px}
    .formula{font-family:Georgia,"Times New Roman",serif;font-size:24px}
    .panel-title{font-size:23px;font-weight:700}
    .panel-text{font-size:21px}
    .muted{fill:#475569;font-size:16px}
  </style>

  <rect id="background" x="0" y="0" width="760" height="520" rx="16" fill="#f8fafc"/>
  <rect id="diagram-panel" x="24" y="24" width="448" height="472" rx="14" fill="#fff" stroke="#cbd5e1"/>
  <rect id="formula-panel" x="496" y="24" width="240" height="472" rx="14" fill="#fff" stroke="#cbd5e1"/>

  <line id="x-axis" class="axis" x1="49" y1="405" x2="466" y2="405"/>
  <line id="y-axis" class="axis" x1="100" y1="475" x2="100" y2="35"/>
  <circle id="anchor-x-unit" cx="185" cy="405" r="1" fill="#111827"/>
  <circle id="anchor-y-unit" cx="100" cy="320" r="1" fill="#111827"/>
  <text x="449" y="395" class="label">x</text>
  <text x="108" y="49" class="label">y</text>
  <text x="91" y="423" class="small">O</text>

  <line id="tangent-y-equals-x" class="tangent" x1="66" y1="439" x2="466" y2="39"/>
  <text x="365" y="73" class="label">y=x</text>

  <circle id="circle-c" class="circle" cx="270" cy="277.5" r="30.0520382"/>
  <line id="center-distance-oc" class="distance" x1="100" y1="405" x2="270" y2="277.5"/>
  <line id="max-radius-cp" class="radius" x1="270" y1="277.5" x2="294.0416305603426" y2="259.46877707974306"/>
  <line id="radius-ct" class="radius" x1="270" y1="277.5" x2="248.75" y2="256.25"/>
  <polyline id="right-angle-at-t" points="248.75,256.25 254.05,261.55 259.35,256.25" fill="none" stroke="#2563eb" stroke-width="0.8"/>

  <circle id="point-o" class="point" cx="100" cy="405" r="3.2" fill="#111827"/>
  <circle id="point-c" class="point" cx="270" cy="277.5" r="3.8" fill="#2563eb"/>
  <circle id="point-t" class="point" cx="248.75" cy="256.25" r="3.4" fill="#2563eb"/>
  <circle id="point-p" class="point" cx="294.0416305603426" cy="259.46877707974306" r="3.4" fill="#0f766e"/>
  <text x="277" y="272" class="label">C</text>
  <text x="231" y="248" class="label">T</text>
  <text x="299" y="253" class="label">P</text>
  <text x="179" y="352" class="small" fill="#0f766e">OC</text>
  <text x="276" y="262" class="small" fill="#2563eb">r</text>
  <text x="292" y="291" class="small" fill="#0f766e">d=OC+r</text>
  <text x="121" y="465" class="muted">대표 배치 a=2, 관계를 정확히 보이는 모형</text>

  <text x="520" y="64" class="panel-title">핵심 관계</text>
  <line x1="520" y1="78" x2="712" y2="78" stroke="#e2e8f0"/>
  <text x="520" y="112" class="panel-text">중심 C=(2, 3/2)</text>
  <text x="520" y="143" class="panel-text">접점 T=(7/4, 7/4)</text>
  <text x="520" y="174" class="panel-text">CT ⟂ y=x</text>
  <text x="520" y="216" class="formula">r=CT=1/(2√2)</text>
  <text x="520" y="259" class="formula">d=OC+r</text>
  <text x="520" y="317" class="panel-title">일반식</text>
  <line x1="520" y1="331" x2="712" y2="331" stroke="#e2e8f0"/>
  <text x="520" y="365" class="formula">C=(a, a−1/a)</text>
  <text x="520" y="397" class="formula">r=1/(a√2)</text>
  <text x="520" y="429" class="formula">d/a=OC/a+r/a</text>
  <text x="520" y="461" class="formula">→ √2</text>
  <text x="520" y="481" class="muted">(a→∞, a&gt;1)</text>
</svg>
