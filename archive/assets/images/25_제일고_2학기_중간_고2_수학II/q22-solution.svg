<svg xmlns="http://www.w3.org/2000/svg" width="640" height="390" viewBox="0 0 640 390" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc">
  <title id="title">25 제일고 22번 최소 기울기 접선 해설</title>
  <desc id="desc">f′=3(x−1)²−3의 최솟값과 점 (1,0)에서 접선 y=−3x+3을 구한다</desc>
  <style>.background{fill:#fff}.axis{stroke:#171717;stroke-width:1.4;fill:none;stroke-linecap:round;stroke-linejoin:round}.curve{stroke:#111;stroke-width:2.1;fill:none;stroke-linecap:round;stroke-linejoin:round}.tangent{stroke:#b23a48;stroke-width:2;fill:none;stroke-linecap:round}.guide{stroke:#777;stroke-width:.95;stroke-dasharray:4 4;fill:none}.point{stroke:#111;stroke-width:1;fill:#111}.panel{fill:#f7f8fa;stroke:#c7cbd1;stroke-width:1}.title{font-family:"Noto Sans KR","Pretendard","Malgun Gothic",sans-serif;font-size:15px;font-weight:700;fill:#111}.label{font-family:"Noto Sans KR","Pretendard","Malgun Gothic",sans-serif;font-size:12px;fill:#222}.small{font-family:"Noto Sans KR","Pretendard","Malgun Gothic",sans-serif;font-size:11px;fill:#333}.math{font-family:"STIX Two Math","Cambria Math","Times New Roman",serif;font-size:13px;fill:#111}</style>
  <defs><marker id="axis-arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L6,3 L0,6 Z" fill="#171717"/></marker></defs>
  <rect class="background" x="0" y="0" width="640" height="390"/><text class="title" x="32" y="28">q22  최소 기울기 접선</text><text class="small" x="32" y="47">접선 기울기는 f′의 값이므로 도함수의 꼭짓점을 확인한다.</text>
  <g aria-label="graph"><rect class="panel" x="32" y="65" width="330" height="236" rx="8"/><line class="axis" x1="52" y1="228" x2="340" y2="228" marker-end="url(#axis-arrow)"/><line class="axis" x1="170" y1="280" x2="170" y2="82" marker-end="url(#axis-arrow)"/><path class="curve" d="M54 108 C104 190 136 238 170 246 C204 238 236 190 286 108"/><path class="tangent" d="M72 118 L322 268"/><circle class="point" cx="202" cy="246" r="4"/><line class="guide" x1="202" y1="246" x2="202" y2="228"/><text class="label" x="208" y="242">(1,0)</text><text class="label" x="250" y="260">m=−3</text><text class="math" x="342" y="233">x</text><text class="math" x="176" y="88">y</text></g>
  <g aria-label="calculation"><rect class="panel" x="380" y="65" width="228" height="236" rx="8"/><text class="title" x="398" y="92">완전제곱</text><text class="math" x="398" y="132">f′=3x²−6x</text><text class="math" x="398" y="168">=3(x−1)²−3</text><text class="math" x="398" y="204">f(1)=0,  m=−3</text><text class="math" x="398" y="240">y=−3x+3</text><text class="label" x="398" y="278">정답: y=−3x+3</text></g>
  <rect class="panel" x="32" y="320" width="576" height="38" rx="7"/><text class="small" x="50" y="344">도함수의 최솟값 −3이 접선의 기울기이고, 접점 (1,0)이 절편 3을 정한다.</text>
</svg>
