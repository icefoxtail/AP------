<svg xmlns="http://www.w3.org/2000/svg" width="640" height="410" viewBox="0 0 640 410" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc">
  <title id="title">25 제일고 5번 접선에 수직인 직선 해설</title>
  <desc id="desc">y=2x²−2x+2의 점 (1,2)에서 접선에 수직인 직선 y=−x/2+5/2를 세운다</desc>
  <style>.background{fill:#fff}.axis{stroke:#171717;stroke-width:1.4;fill:none;stroke-linecap:round;stroke-linejoin:round}.curve{stroke:#111;stroke-width:2.1;fill:none;stroke-linecap:round;stroke-linejoin:round}.tangent{stroke:#356a9a;stroke-width:1.8;fill:none;stroke-linecap:round}.normal{stroke:#b23a48;stroke-width:2.1;fill:none;stroke-linecap:round}.point{stroke:#111;stroke-width:1;fill:#111}.panel{fill:#f7f8fa;stroke:#c7cbd1;stroke-width:1}.title{font-family:"Noto Sans KR","Pretendard","Malgun Gothic",sans-serif;font-size:15px;font-weight:700;fill:#111}.label{font-family:"Noto Sans KR","Pretendard","Malgun Gothic",sans-serif;font-size:12px;fill:#222}.small{font-family:"Noto Sans KR","Pretendard","Malgun Gothic",sans-serif;font-size:11px;fill:#333}.math{font-family:"STIX Two Math","Cambria Math","Times New Roman",serif;font-size:13px;fill:#111}</style>
  <defs><marker id="axis-arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L6,3 L0,6 Z" fill="#171717"/></marker></defs>
  <rect class="background" x="0" y="0" width="640" height="410"/><text class="title" x="32" y="28">q5  접선에 수직인 직선</text><text class="small" x="32" y="47">접선의 기울기와 그 음의 역수를 같은 접점에서 비교한다.</text>
  <g aria-label="graph"><rect class="panel" x="32" y="65" width="342" height="264" rx="8"/><line class="axis" x1="52" y1="250" x2="352" y2="250" marker-end="url(#axis-arrow)"/><line class="axis" x1="178" y1="310" x2="178" y2="82" marker-end="url(#axis-arrow)"/><path class="curve" d="M66 116 C110 178 144 224 178 232 C212 224 246 178 290 116"/><path class="tangent" d="M70 168 L334 300"/><path class="normal" d="M74 292 L330 164"/><circle class="point" cx="202" cy="232" r="4"/><line x1="202" y1="232" x2="202" y2="250" stroke="#777" stroke-width=".95" stroke-dasharray="4 4"/><text class="label" x="208" y="228">(1,2)</text><text class="label" x="246" y="294">접선 m=2</text><text class="label" x="238" y="160">수직선 m=−1/2</text><text class="math" x="354" y="255">x</text><text class="math" x="184" y="88">y</text></g>
  <g aria-label="calculation"><rect class="panel" x="392" y="65" width="216" height="264" rx="8"/><text class="title" x="410" y="92">계산</text><text class="math" x="410" y="132">f′(1)=2</text><text class="math" x="410" y="168">수직 기울기=−1/2</text><text class="math" x="410" y="204">y−2=−(x−1)/2</text><text class="math" x="410" y="240">y=−x/2+5/2</text><text class="label" x="410" y="288">정답: ⑤</text></g>
  <rect class="panel" x="32" y="348" width="576" height="38" rx="7"/><text class="small" x="50" y="372">점 (1,2)를 지나고 접선의 기울기 2와 곱이 −1인 직선이 정답이다.</text>
</svg>
