<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="460" viewBox="0 0 760 460" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc" data-scale-policy="SCHEMATIC_ALLOWED" data-visual-provenance="reconstructed_from_independent_solution_facts">
  <title id="title">문항 16 해설: 교점 개수 함수 h(t)의 변화</title>
  <desc id="desc">h(t)가 t가 0과 2를 지날 때 0, 1, 2, 1, 0으로 바뀌는 모습을 나타내고, 연속성을 위해 q(t)=t(t−2)가 두 경계에서 0이어야 함을 보여 주는 해설 도형</desc>
  <style>
    text{font-family:Arial,"Malgun Gothic",sans-serif;fill:#111827}
    .axis{stroke:#111827;stroke-width:1.2;stroke-linecap:round}
    .step{fill:none;stroke:#111827;stroke-width:2.05;stroke-linecap:round}
    .guide{fill:none;stroke:#64748b;stroke-width:1;stroke-dasharray:5 4}
    .point{stroke:#fff;stroke-width:1}
    .open{fill:#fff;stroke:#2563eb;stroke-width:1.6}
    .label{font-size:22px;font-weight:700}
    .small{font-size:17px}
    .formula{font-family:Georgia,"Times New Roman",serif;font-size:24px}
    .panel-title{font-size:23px;font-weight:700}
    .panel-text{font-size:20px}
    .muted{fill:#475569;font-size:15px}
  </style>
  <rect id="background" x="0" y="0" width="760" height="460" rx="16" fill="#f8fafc"/>
  <rect id="diagram-panel" x="24" y="24" width="448" height="412" rx="14" fill="#fff" stroke="#cbd5e1"/>
  <rect id="formula-panel" x="496" y="24" width="240" height="412" rx="14" fill="#fff" stroke="#cbd5e1"/>

  <line id="x-axis" class="axis" x1="45" y1="350" x2="450" y2="350"/>
  <line id="y-axis" class="axis" x1="90" y1="410" x2="90" y2="65"/>
  <circle id="anchor-x-unit" cx="180" cy="350" r="1" fill="#111827"/>
  <circle id="anchor-y-unit" cx="90" cy="260" r="1" fill="#111827"/>
  <text x="430" y="340" class="label">t</text>
  <text x="98" y="79" class="label">h(t)</text>

  <line id="boundary-t0" class="guide" x1="90" y1="390" x2="90" y2="125"/>
  <line id="boundary-t2" class="guide" x1="270" y1="390" x2="270" y2="125"/>
  <line id="h-zero-left" class="step" x1="45" y1="350" x2="90" y2="350"/>
  <line id="h-middle" class="step" x1="90" y1="170" x2="270" y2="170"/>
  <line id="h-zero-right" class="step" x1="270" y1="350" x2="450" y2="350"/>
  <circle id="h-zero-at-t0" class="open" cx="90" cy="350" r="5"/>
  <circle id="h-two-at-t0" class="open" cx="90" cy="170" r="5"/>
  <circle id="h-one-at-t0" class="point" cx="90" cy="260" r="5" fill="#2563eb"/>
  <circle id="h-zero-at-t2" class="open" cx="270" cy="350" r="5"/>
  <circle id="h-two-at-t2" class="open" cx="270" cy="170" r="5"/>
  <circle id="h-one-at-t2" class="point" cx="270" cy="260" r="5" fill="#2563eb"/>
  <text x="57" y="374" class="small">0</text>
  <text x="58" y="181" class="small">2</text>
  <text x="77" y="397" class="label">t=0</text>
  <text x="258" y="397" class="label">t=2</text>
  <text x="302" y="161" class="small">h(t)=2</text>
  <text x="101" y="249" class="small">h(0)=1</text>
  <text x="278" y="249" class="small">h(2)=1</text>
  <text x="121" y="328" class="muted">t&lt;0: 0</text>
  <text x="337" y="328" class="muted">t&gt;2: 0</text>

  <text x="518" y="64" class="panel-title">교점 개수</text>
  <line x1="518" y1="78" x2="714" y2="78" stroke="#e2e8f0"/>
  <text x="518" y="116" class="panel-text">t&lt;0: h(t)=0</text>
  <text x="518" y="148" class="panel-text">t=0: h(t)=1</text>
  <text x="518" y="180" class="panel-text">0&lt;t&lt;2: h(t)=2</text>
  <text x="518" y="212" class="panel-text">t=2: h(t)=1</text>
  <text x="518" y="244" class="panel-text">t&gt;2: h(t)=0</text>
  <text x="518" y="294" class="panel-title">연속 조건</text>
  <line x1="518" y1="308" x2="714" y2="308" stroke="#e2e8f0"/>
  <text x="518" y="347" class="formula">q(t)=t(t−2)</text>
  <text x="518" y="381" class="formula">q(0)=q(2)=0</text>
  <text x="518" y="416" class="muted">점프 경계에서 곱을 0으로 만든다.</text>
</svg>
