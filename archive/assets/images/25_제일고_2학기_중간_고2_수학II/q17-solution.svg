  <text x="48" y="455" class="muted">연속성을 유지하며 식을 바꿀 수 있는 지점: x=1, 3</text>

  <text x="536" y="64" class="panel-title">두 그래프</text>
  <line x1="536" y1="78" x2="752" y2="78" stroke="#e2e8f0"/>
  <text x="536" y="118" class="formula">p(x)=x+1</text>
  <text x="536" y="154" class="formula">q(x)=x²−3x+4</text>
  <text x="536" y="204" class="panel-text">p(x)=q(x)</text>
