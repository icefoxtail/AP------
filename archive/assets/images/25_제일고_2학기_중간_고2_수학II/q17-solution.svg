  <title id="title">문항 17 해설: 두 그래프의 교점과 branch 전환</title>
  <desc id="desc">p(x)=x+1과 q(x)=x²−3x+4의 그래프가 x=1과 x=3에서 만나며, 연속함수 f가 branch를 바꿀 수 있는 지점도 이 두 교점뿐임을 나타낸 해설 도형</desc>
