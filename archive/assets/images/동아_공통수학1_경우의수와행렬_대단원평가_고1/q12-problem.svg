<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 384 320" width="384" height="320" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">피구 대회 여섯 학급의 두 조 승자 진출전 대진표로 각 조에 한 학급의 부전승 자리가 있다.</title><desc id="visual-desc">왼쪽 세 학급과 오른쪽 세 학급이 각각 한 조를 이룬다. 각 조에서 한 학급은 첫 경기 없이 준결승으로 올라가고 나머지 두 학급이 먼저 대결한다. 양쪽 승자가 마지막에 만난다.</desc><rect width="384" height="320" fill="#fff"/><g data-layer="30"><line id="bracket01" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="49.142857143" y1="183.80952381" x2="49.142857143" y2="136.19047619"/></g><g data-layer="30"><line id="bracket02" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="96.761904762" y1="183.80952381" x2="96.761904762" y2="160"/></g><g data-layer="30"><line id="bracket03" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="144.380952381" y1="183.80952381" x2="144.380952381" y2="160"/></g><g data-layer="30"><line id="bracket04" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="239.619047619" y1="183.80952381" x2="239.619047619" y2="136.19047619"/></g><g data-layer="30"><line id="bracket05" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="287.238095238" y1="183.80952381" x2="287.238095238" y2="160"/></g><g data-layer="30"><line id="bracket06" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="334.857142857