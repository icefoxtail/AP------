<svg xmlns="http://www.w3.org/2000/svg" width="640" height="260" viewBox="0 0 640 260" role="img" aria-labelledby="title desc">
  <title id="title">p가 q이기 위한 필요조건일 때의 진리집합</title>
  <desc id="desc">조건 q의 진리집합은 −5와 6 사이의 열린구간이다. q가 p를 함의하려면 이 구간의 모든 x가 x&lt;a를 만족해야 하므로 a≥6이고, 최솟값은 6이다.</desc>
  <defs>
    <marker id="arrow-left" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto">
      <path d="M8,0 L0,4 L8,8" fill="none" stroke="#294f64" stroke-width="1.6"/>
    </marker>
  </defs>
  <rect width="640" height="260" rx="16" fill="#fff"/>
  <g font-family="sans-serif" fill="#17212b">
    <text x="28" y="34" font-size="16" font-weight="700">p가 q이기 위한 필요조건  ⇔  q ⇒ p  ⇔  Q ⊆ P</text>
    <text x="36" y="104" font-size="17" font-weight="700" fill="#27708e">P: x &lt; a</text>
    <text x="36" y="170" font-size="17" font-weight="700" fill="#54845c">Q: −5 &lt; x &lt; 6</text>
    <text x="320" y="228" text-anchor="middle" font-size="18" font-weight="700">Q ⊆ P  ⇔  a ≥ 6  ⇒  a의 최솟값은 6</text>
    <text x="500" y="65" text-anchor="middle" font-size="13" fill="#526873">최솟값 a=6인 경계</text>
  </g>
  <line x1="175" y1="108" x2="475" y2="108" stroke="#27708e" stroke-width="8" stroke-linecap="round" marker-start="url(#arrow-left)"/>
  <line x1="285" y1="174" x2="475" y2="174" stroke="#54845c" stroke-width="8" stroke-linecap="round"/>
  <line x1="285" y1="158" x2="285" y2="190" stroke="#54845c" stroke-width="3"/>
  <line x1="475" y1="84" x2="475" y2="192" stroke="#6f7f88" stroke-width="1.5" stroke-dasharray="4 4"/>
  <circle cx="475" cy="108" r="9" fill="#fff" stroke="#27708e" stroke-width="4"/>
  <circle cx="285" cy="174" r="9" fill="#fff" stroke="#54845c" stroke-width="4"/>
  <circle cx="475" cy="174" r="9" fill="#fff" stroke="#54845c" stroke-width="4"/>
  <g font-family="sans-serif" font-size="16" fill="#17212b">
    <text x="285" y="207" text-anchor="middle">−5</text>
    <text x="475" y="207" text-anchor="middle">6 = a</text>
  </g>
</svg>
