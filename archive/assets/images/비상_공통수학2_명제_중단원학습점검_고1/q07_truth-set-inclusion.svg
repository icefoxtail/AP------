<svg xmlns="http://www.w3.org/2000/svg" width="640" height="250" viewBox="0 0 640 250" role="img" aria-labelledby="title desc">
  <title id="title">조건 p가 조건 q이기 위한 충분조건</title>
  <desc id="desc">p의 진리집합은 x가 2k 이하인 값, q의 진리집합은 x가 8보다 작은 값이다. p가 q를 함의하려면 2k가 8보다 작아야 하므로 k는 4보다 작다.</desc>
  <defs>
    <marker id="arrow-left" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto">
      <path d="M8,0 L0,4 L8,8" fill="none" stroke="#294f64" stroke-width="1.6"/>
    </marker>
  </defs>
  <rect width="640" height="250" rx="16" fill="#fff"/>
  <g font-family="sans-serif" fill="#17212b">
    <text x="28" y="34" font-size="16" font-weight="700">진리집합의 포함 관계 (수직선은 개념도)</text>
    <text x="36" y="103" font-size="17" font-weight="700" fill="#27708e">P: x ≤ 2k</text>
    <text x="36" y="171" font-size="17" font-weight="700" fill="#54845c">Q: x &lt; 8</text>
    <text x="320" y="224" text-anchor="middle" font-size="18" font-weight="700">P ⊆ Q  ⇔  2k &lt; 8  ⇔  k &lt; 4</text>
  </g>
  <line x1="175" y1="108" x2="527" y2="108" stroke="#27708e" stroke-width="8" stroke-linecap="round" marker-start="url(#arrow-left)"/>
  <line x1="175" y1="176" x2="575" y2="176" stroke="#54845c" stroke-width="8" stroke-linecap="round" marker-start="url(#arrow-left)"/>
  <line x1="527" y1="89" x2="527" y2="190" stroke="#6f7f88" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="575" y1="89" x2="575" y2="190" stroke="#6f7f88" stroke-width="1.5" stroke-dasharray="4 4"/>
  <circle cx="527" cy="108" r="9" fill="#27708e" stroke="#27708e" stroke-width="2"/>
  <circle cx="575" cy="176" r="9" fill="#fff" stroke="#54845c" stroke-width="4"/>
  <g font-family="sans-serif" font-size="16" fill="#17212b">
    <text x="527" y="78" text-anchor="middle">2k</text>
    <text x="575" y="207" text-anchor="middle">8</text>
  </g>
</svg>
