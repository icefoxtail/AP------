<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" preserveAspectRatio="xMidYMid meet" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-geometry-fact-hash="6e6be5f87dff6a8592dfb4fa5beb64f5a0fd0c52b40f5c8f78d8e4f3f8273fee" data-visual-provenance="SOURCE_AND_R1_FROZEN_SOLUTION"><title>120° 회전이 만드는 7개 영역의 궤도</title><rect x="0" y="0" width="640" height="360" rx="18" fill="#F8FAFC"/><text x="28" y="38" fill="#17324D" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="19" font-weight="700">120° 회전이 만드는 7개 영역의 궤도</text>
<circle cx="165" cy="205" r="125" fill="#FFFFFF" stroke="#294D68" stroke-width="2.4"/>
<polygon points="165,80 56.7468245,267.5 273.2531755,267.5" fill="#F3F6F8" stroke="#294D68" stroke-width="2.4"/>
<line x1="110.8734123" y1="173.75" x2="219.1265877" y2="173.75" stroke="#294D68" stroke-width="2"/>
<line x1="110.8734123" y1="173.75" x2="165" y2="267.5" stroke="#294D68" stroke-width="2"/>
<line x1="219.1265877" y1="173.75" x2="165" y2="267.5" stroke="#294D68" stroke-width="2"/>
<g font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="16" font-weight="700" text-anchor="middle">
<text x="75" y="209" fill="#147D92">α</text><text x="165" y="306" fill="#147D92">β</text><text x="255" y="209" fill="#147D92">γ</text>
<text x="165" y="145" fill="#C45D3B">A</text><text x="111" y="241" fill="#C45D3B">B</text><text x="219" y="241" fill="#C45D3B">C</text><text x="165" y="210" fill="#4B3D7D">D</text>
</g>
<rect x="315" y="67" width="300" height="237" rx="14" fill="#FFFFFF" stroke="#D4DEE7"/>
<text x="337" y="101" fill="#17324D" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="16" font-weight="700">영역 궤도</text>
<text x="337" y="136" fill="#147D92" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="15">바깥: α → β → γ → α</text>
<text x="337" y="166" fill="#C45D3B" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="15">꼭짓점: A → B → C → A</text>
<text x="337" y="196" fill="#4B3D7D" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="15">가운데: D → D</text>
<line x1="337" y1="213" x2="592" y2="213" stroke="#D4DEE7"/>
<text x="337" y="241" fill="#43586B" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="14">서로 다른 7색이므로 3영역 궤도는</text><text x="337" y="262" fill="#43586B" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="14">비항등 회전에서 고정되지 않는다.</text>
<text x="337" y="288" fill="#17324D" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="17" font-weight="700">8P7 ÷ 3 = 13,440</text>
<text x="28" y="344" fill="#54697C" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="12.5">문자색은 영역 궤도를 구분한다. D는 회전축 중심에 고정되는 영역이다.</text></svg>