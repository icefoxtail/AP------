<text x="493" y="250" fill="#147D92" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="21" font-weight="700">= 360</text>
<text x="28" y="338" fill="#54697C" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="13">같은 좌석 배치는 항등 회전과 180° 회전의 두 배열로 나타난다.</text></svg>
