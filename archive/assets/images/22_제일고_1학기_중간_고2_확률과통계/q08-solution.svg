<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" preserveAspectRatio="xMidYMid meet" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-geometry-fact-hash="93e15a35023ed25ccc962747afacb68a11f3b466c143839da4fa9ec25834db33" data-visual-provenance="SOURCE_AND_R1_FROZEN_SOLUTION"><title>맞은편 좌석을 180° 회전 쌍으로 묶는다</title><rect x="0" y="0" width="640" height="360" rx="18" fill="#F8FAFC"/><text x="28" y="38" fill="#17324D" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="19" font-weight="700">맞은편 좌석을 180° 회전 쌍으로 묶는다</text>
