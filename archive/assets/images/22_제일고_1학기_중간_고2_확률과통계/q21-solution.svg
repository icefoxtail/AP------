<text x="384" y="111" fill="#17324D" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="16" font-weight="700">최소 이동 횟수</text>
<text x="384" y="148" fill="#43586B" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="14">가로·세로로 3칸씩 이동해야</text><text x="384" y="170" fill="#43586B" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="14">하므로 어떤 경로도 3회 미만은</text><text x="384" y="192" fill="#43586B" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="14">불가능하다.</text>
