<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 1200" role="img" aria-labelledby="title desc">
  <title id="title">AECF 넓이를 두 삼각형으로 분해</title>
  <desc id="desc">한 변이 30 cm인 정사각형 ABCD에서 BE가 25 cm이고 F는 DC 위에서 움직인다. 색과 무늬로 목표 사각형 AECF, 빼는 삼각형 ABE와 ADF를 구분한다. F의 그림 위치는 도식이다.</desc>
  <defs>
    <pattern id="subtractA" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
      <rect width="12" height="12" fill="#fff5e8"/>
      <line x1="0" y1="0" x2="0" y2="12" stroke="#c46b16" stroke-width="2.2"/>
    </pattern>
    <pattern id="subtractB" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(-35)">
      <rect width="12" height="12" fill="#f4efff"/>
      <line x1="0" y1="0" x2="0" y2="12" stroke="#7150a6" stroke-width="2.2"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#475569"/>
    </marker>
    <style>
      .head{font-family:"Noto Sans KR","Pretendard","Malgun Gothic",sans-serif;font-size:48px;font-weight:700;fill:#13233d}
      .label{font-family:"Noto Sans KR","Pretendard","Malgun Gothic",sans-serif;font-size:44px;font-weight:600;fill:#172033}
      .body{font-family:"Noto Sans KR","Pretendard","Malgun Gothic",sans-serif;font-size:44px;fill:#172033}
      .math{font-family:"Cambria Math","STIX Two Math","Times New Roman",serif;font-size:44px;fill:#172033}
      .small{font-family:"Noto Sans KR","Pretendard","Malgun Gothic",sans-serif;font-size:44px;fill:#475569}
    </style>
  </defs>
  <rect width="960" height="1080" fill="#ffffff"/>
  <text x="34" y="58" class="head">AECF 넓이를 두 삼각형으로 분해</text>
  <rect x="28" y="82" width="904" height="540" rx="18" fill="#fbfcfe" stroke="#cbd5e1" stroke-width="2.5"/>

  <!-- 30-unit square; E is placed at 25/30 of BC. F's vertical location is schematic because x varies. -->
  <polygon points="118,150 418,510 478,510 478,318" fill="#dff2ff"/>
  <polygon points="118,150 118,510 418,510" fill="url(#subtractA)"/>
  <polygon points="118,150 478,150 478,318" fill="url(#subtractB)"/>
<g fill="none" stroke="#172033" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round">
<path d="M118 150 L478 150 L478 510 L118 510 Z"/>
<path d="M118 150 L418 510 L478 510 L478 318 Z"/>
</g>
<g fill="#172033">
<circle cx="118" cy="150" r="6"/><circle cx="118" cy="510" r="6"/>
<circle cx="478" cy="510" r="6"/><circle cx="478" cy="150" r="6"/>
<circle cx="418" cy="510" r="6"/><circle cx="478" cy="318" r="6"/>
</g>
<g class="label">
<text x="78" y="144">A</text><text x="78" y="555">B</text>
<text x="486" y="555">C</text><text x="486" y="144">D</text>
<text x="404" y="555">E</text><text x="486" y="328">F</text>
<text x="190" y="420">△ABE</text><text x="340" y="205">△ADF</text>
<text x="350" y="420">AECF</text>
</g>
<line x1="118" y1="116" x2="478" y2="116" stroke="#475569" stroke-width="2.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<line x1="118" y1="122" x2="118" y2="144" stroke="#475569" stroke-width="2.2"/>
<line x1="478" y1="122" x2="478" y2="144" stroke="#475569" stroke-width="2.2"/>
<text x="298" y="108" class="label" text-anchor="middle">30 cm</text>
<line x1="118" y1="584" x2="418" y2="584" stroke="#475569" stroke-width="2.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<line x1="118" y1="516" x2="118" y2="590" stroke="#475569" stroke-width="2.2"/>
<line x1="418" y1="516" x2="418" y2="590" stroke="#475569" stroke-width="2.2"/>
<text x="268" y="577" class="label" text-anchor="middle">BE = 25 cm</text>
<text x="492" y="300" class="label">DF = x</text>
<text x="68" y="332" class="label" text-anchor="middle" transform="rotate(-90 68 332)">30 cm</text>
<rect x="28" y="642" width="904" height="540" rx="18" fill="#fbfcfe" stroke="#cbd5e1" stroke-width="2.5"/>
<text x="60" y="700" class="head">넓이를 계산해 부등식을 세운다</text>
<text x="60" y="758" class="body">정사각형 ABCD</text>
<text x="870" y="758" class="math" text-anchor="end">30 × 30 = 900</text>
<text x="60" y="810" class="body">△ABE</text>
<text x="870" y="810" class="math" text-anchor="end">1/2 × 30 × 25 = 375</text>
<text x="60" y="862" class="body">△ADF</text>
<text x="870" y="862" class="math" text-anchor="end">1/2 × 30 × x = 15x</text>
<line x1="60" y1="888" x2="900" y2="888" stroke="#cbd5e1" stroke-width="2.2"/>
<text x="60" y="940" class="math">AECF = 900 − 375 − 15x</text>
<text x="60" y="990" class="math">= 525 − 15x</text>
<text x="60" y="1042" class="math">525 − 15x ≤ (5/9) × 900 = 500</text>
<text x="60" y="1092" class="math" font-weight="700">x ≥ 5/3</text>
<text x="60" y="1150" class="label">가능한 자연수 최솟값: 2 cm</text>
</svg>
