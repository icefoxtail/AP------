<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 705 544" width="705" height="544" role="img" aria-labelledby="title desc"><title id="title">정해진 x절편과 위로 볼록한 포물선</title><desc id="desc">파란 포물선은 아래로 열리고 꼭짓점은 y축 오른쪽에 있다. 오른쪽 x절편의 눈금은 3이다. y절편은 x축 위에 있다.</desc><rect width="705" height="544" fill="white" /><line x1="53.0000" y1="334.1685" x2="649.0000" y2="334.1685" stroke="#4d5d72" stroke-width="1.65" stroke-linecap="round" /><polygon points="649.0000,334.1685 636.0000,329.1685 636.0000,339.1685" fill="#4d5d72" /><text x="666.0000" y="326.1685" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#4d5d72" text-anchor="middle">x</text><line x1="250.8423" y1="473.0000" x2="250.8423" y2="80.0000" stroke="#4d5d72" stroke-width="1.65" stroke-linecap="round" /><polygon points="250.8423,80.0000 245.8423,93.0000 255.8423,93.0000" fill="#4d5d72" /><text x="266.8423" y="86.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#4d5d72" text-anchor="middle">y</text><text x="229.8423" y="362.1685" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#4d5d72" text-anchor="middle">O</text><path d="M 118.9474 452.0685 Q 333.2766 -125.4707 547.6058 452.0685" stroke="#205d9c" stroke-width="6.0" stroke-linecap="round" fill="none" /><circle cx="498.14522821576764" cy="334.16847826086956" r="6.0" fill="white" stroke="#25736e" stroke-width="3.1" /><line x1="498.1452" y1="329.1685" x2="498.1452" y2="339.1685" stroke="#4d5d72" stroke-width="1.7" stroke-linecap="round" /><text x="481.1452" y="369.1685" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#4d5d72" text-anchor="middle">3</text><line x1="64.0000" y1="39.0000" x2="114.0000" y2="39.0000" stroke="#205d9c" stroke-width="5.4" stroke-linecap="round" /><text x="126.0000" y="47.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill