<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 684 620" width="684" height="620" role="img" aria-labelledby="title desc"><title id="title">포물선과 직선 사이의 세로 거리</title><desc id="desc">파란 포물선은 위로 열리고 y축을 2에서 지난다. 주황 점선 직선은 원점을 지난다. 포물선의 P와 직선의 Q는 같은 세로선에 놓인다.</desc><rect width="684" height="620" fill="white" /><line x1="201.8235" y1="542.9869" x2="612.9673" y2="131.8431" stroke="#aa5411" stroke-width="5.1" stroke-linecap="round" stroke-dasharray="14 7" /><line x1="443.8497" y1="157.7745" x2="443.8497" y2="300.9608" stroke="#25736e" stroke-width="4.2" stroke-linecap="round" /><line x1="53.0000" y1="443.7712" x2="628.0000" y2="443.7712" stroke="#4d5d72" stroke-width="1.65" stroke-linecap="round" /><polygon points="628.0000,443.7712 615.0000,438.7712 615.0000,448.7712" fill="#4d5d72" /><text x="645.0000" y="435.7712" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#4d5d72" text-anchor="middle">x</text><line x1="301.0392" y1="549.0000" x2="301.0392" y2="80.0000" stroke="#4d5d72" stroke-width="1.65" stroke-linecap="round" /><polygon points="301.0392,80.0000 296.0392,93.0000 306.0392,93.0000" fill="#4d5d72" /><text x="317.0392" y="86.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#4d5d72" text-anchor="middle">y</text><text x="276.0392" y="429.7712" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#4d5d72" text-anchor="middle">O</text><path d="M 126.6601 91.1647 Q 301.0392 495.7242 475.4183 91.1647" stroke="#205d9c" stroke-width="6.0" stroke-linecap="round" fill="none" /><circle cx="443.8496732026143" cy="157.7745098039216" r="6.0" fill="white" stroke="#25736e" stroke-width="3.1" /><text x="435.8497" y="141.7745" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#25736e" text-anchor="middle">P</text><circle cx="443.8496732026143" cy="300.9607843137255" r="6.0" fill="white" stroke="#25736e" stroke-width="3.1" /><text x="456.8497" y="332.9608" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#25736e" text-anchor="middle">Q</text><line x1="296.0392" y1="293.4444" x2="306.0392" y2="293.4444" stroke="#4d5d72" stroke-width="1.7" stroke-linecap="round" /><text x="267.0392" y="322.4444" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#4d5d72" text-anchor="middle">2</text><line x1="64.0000" y1="39.0000" x2="114.0000" y2="39.0000" stroke="#205d9c" stroke-width="5.4" stroke-linecap="round" /><text x="126.0000" y="47.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#205d9c" text-anchor="start">y = x²/2 + 2</text><line x1="379.0000" y1="39.0000" x2="429.0000" y2="39.0000" stroke="#aa5411" stroke-width="5.4" stroke-linecap="round" stroke-dasharray="14 7" /><text x="441.0000" y="47.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#aa5411" text-anchor="start">y = x</text></svg>
