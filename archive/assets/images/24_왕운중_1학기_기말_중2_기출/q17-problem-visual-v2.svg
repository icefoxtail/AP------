<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 686 533" width="686" height="533" role="img" aria-labelledby="title desc"><title id="title">두 축의 양의 쪽을 지나는 내리막 직선</title><desc id="desc">보라색 직선이 왼쪽 위에서 오른쪽 아래로 내려간다. 세로축의 원점 위, 가로축의 원점 오른쪽에서 두 축을 만난다.</desc><rect width="686" height="533" fill="white" /><line x1="71.0000" y1="326.9209" x2="597.0000" y2="326.9209" stroke="#586574" stroke-width="2.05" stroke-linecap="round" /><polygon points="610.0000,326.9209 597.0000,321.7209 597.0000,332.1209" fill="#586574" /><line x1="271.6278" y1="501.0000" x2="271.6278" y2="74.0000" stroke="#586574" stroke-width="2.05" stroke-linecap="round" /><polygon points="271.6278,61.0000 266.4278,74.0000 276.8278,74.0000" fill="#586574" /><line x1="157.5432" y1="70.6800" x2="594.6996" y2="491.3200" stroke="#774898" stroke-width="7.65" stroke-linecap="round" /><text x="626.000" y="313.921" fill="#586574" font-size="29" font-weight="600" font-family="Malgun Gothic, Cambria Math, sans-serif" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="4.0" stroke-linejoin="round">x</text><text x="290.628" y="56.000" fill="#586574" font-size="29" font-weight="600" font-family="Malgun Gothic, Cambria Math, sans-serif" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="4.0" stroke-linejoin="round">y</text><text x="249.628" y="352.921" fill="#586574" font-size="29" font-weight="600" font-family="Malgun Gothic, Cambria Math, sans-serif" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="4.0" stroke-linejoin="round">O</text></svg>
