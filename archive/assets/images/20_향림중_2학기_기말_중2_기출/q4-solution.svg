<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 384 320" width="384" height="320" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">마름모의 두 대각선은 서로 수직으로 이등분된다. 두 대각선의 길이까지 같으면 교점에서 네 꼭짓점까지의 거리가 모두 같아진다. 네 작은 삼각형이 모두 직각이등변삼각형이므로 마름모의 네 각이 직각이 된다. 따라서 답은 ①이다.</title><desc id="visual-desc">두 대각선이 교점에서 수직으로 만나는 마름모가 있고, 교점에서 한 꼭짓점으로 가는 각이 45로 표시되어 있다.</desc><rect width="384" height="320" fill="#fff"/><g data-layer="30"><line id="AB" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="77.714285714" y1="160" x2="192" y2="274.285714286"/></g><g data-layer="30"><line id="BC" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="192" y1="274.285714286" x2="306.285714286" y2="160"/></g><g data-layer="30"><line id="CD" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="306.285714286" y1="160" x2="192" y2="45.714285714"/></g><g data-layer="30"><line id="DA" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="192" y1="45.714285714" x2="77.714285714" y2="160"/></g><g data-layer="30"><line id="AC" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="77.714285714" y1="160" x2="306.285714286" y2="160"/></g><g data-layer="30"><line id="BD" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="192" y1="274.285714286" x2="192" y2="45.714285714"/></g><g data-layer="60"><polylin