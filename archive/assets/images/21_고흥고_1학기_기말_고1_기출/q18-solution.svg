<svg xmlns="http://www.w3.org/2000/svg" width="620" height="420" viewBox="0 0 620 420" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="svg-title-02422c3840" aria-describedby="svg-desc-02422c3840">
  <title id="svg-title-02422c3840">원 위에서 두 거리 제곱의 최솟값</title><desc id="svg-desc-02422c3840">A=(−1,0), B=(1,0)이므로 PA²+PB²=2(x²+y²)+2이다. 중심 (3,4), 반지름 2인 원에서 원점과의 최소 거리는 3이고, P=(9/5,12/5)에서 PA²+PB²의 최솟값은 20이다.</desc><rect width="620" height="420" fill="#fff"/>
  <text x="24" y="30" font-family="Arial,sans-serif" font-size="18" fill="#111">원 위에서 PA²+PB²의 최솟값을 구한다.</text>
  <line x1="80" y1="390" x2="540" y2="390" stroke="#555" stroke-width="1.5"/>
  <line x1="100" y1="400" x2="100" y2="55" stroke="#555" stroke-width="1.5"/>
  <circle cx="265" cy="170" r="110" fill="#eaf2ff" stroke="#2864c5" stroke-width="3"/>
  <line x1="100" y1="390" x2="199" y2="258" stroke="#d04a40" stroke-width="2.5" stroke-dasharray="7 6"/>
  <line x1="199" y1="258" x2="265" y2="170" stroke="#d04a40" stroke-width="2" stroke-dasharray="5 5"/>
  <circle cx="100" cy="390" r="5" fill="#111"/>
  <circle cx="265" cy="170" r="5" fill="#174e9c"/>
  <circle cx="199" cy="258" r="6" fill="#c33"/>
  <text x="77" y="414" font-family="Arial,sans-serif" font-size="16" fill="#111">O (0,0)</text>
  <text x="276" y="163" font-family="Arial,sans-serif" font-size="16" fill="#174e9c">중심 (3,4)</text>
  <text x="205" y="246" font-family="Arial,sans-serif" font-size="16" fill="#a22">P (9/5,12/5)</text>
  <text x="118" y="325" font-family="Arial,sans-serif" font-size="15" fill="#a22">OP = 3</text>
  <text x="384" y="364" font-family="Arial,sans-serif" font-size="15" fill="#174e9c">반지름 = 2</text>
</svg>