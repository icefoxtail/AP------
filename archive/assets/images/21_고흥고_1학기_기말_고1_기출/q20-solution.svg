<svg xmlns="http://www.w3.org/2000/svg" width="720" height="440" viewBox="0 0 720 440" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="svg-title-b91056c4bf" aria-describedby="svg-desc-b91056c4bf">
  <title id="svg-title-b91056c4bf">같은 배송 비용을 주는 원의 자취</title><desc id="svg-desc-b91056c4bf">A=(0,0), B=(9,0)이고 B의 단위 거리당 비용은 A의 2배이다. 비용이 같은 점은 AP=2BP를 만족하여 중심 (12,0), 반지름 6인 원 (x−12)²+y²=36 위에 놓인다.</desc><rect width="720" height="440" fill="#fff"/>
  <text x="24" y="30" font-family="Arial,sans-serif" font-size="18" fill="#111">운송 비용이 같으면 AP=2BP</text>
  <line x1="70" y1="240" x2="670" y2="240" stroke="#666" stroke-width="1.5"/>
  <line x1="90" y1="420" x2="90" y2="55" stroke="#999" stroke-width="1"/>
  <circle cx="426" cy="240" r="168" fill="#eff6ff" fill-opacity="0.8" stroke="#2864c5" stroke-width="3"/>
  <circle cx="90" cy="240" r="5" fill="#111"/>
  <circle cx="342" cy="240" r="5" fill="#111"/>
  <circle cx="258" cy="240" r="5" fill="#bf3c36"/>
  <circle cx="594" cy="240" r="5" fill="#bf3c36"/>
  <circle cx="426" cy="240" r="5" fill="#174e9c"/>
  <text x="65" y="268" font-family="Arial,sans-serif" font-size="16" fill="#111">A (0,0)</text>
  <text x="322" y="268" font-family="Arial,sans-serif" font-size="16" fill="#111">B (9,0)</text>
  <text x="236" y="215" font-family="Arial,sans-serif" font-size="15" fill="#a22">x=6</text>
  <text x="574" y="215" font-family="Arial,sans-serif" font-size="15" fill="#a22">x=18</text>
  <text x="436" y="228" font-family="Arial,sans-serif" font-size="15" fill="#174e9c">중심 (12,0)</text>
  <text x="110" y="72" font-family="Arial,sans-serif" font-size="16" fill="#174e9c">자취: (x-12)²+y²=36</text>
</svg>