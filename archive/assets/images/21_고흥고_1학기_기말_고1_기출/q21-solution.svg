<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420" preserveAspectRatio="xMidYMid meet">
  <rect width="640" height="400" fill="#fff"/>
  <text x="22" y="28" font-family="Arial,sans-serif" font-size="18" fill="#111">Fixed hypotenuse AB = 6</text>
  <circle cx="300" cy="250" r="150" fill="#eff6ff" fill-opacity="0.8" stroke="#8a9ab4" stroke-width="2" stroke-dasharray="7 6"/>
  <line x1="150" y1="250" x2="450" y2="250" stroke="#2864c5" stroke-width="3"/>
  <line x1="150" y1="250" x2="300" y2="100" stroke="#2864c5" stroke-width="3"/>
  <line x1="450" y1="250" x2="300" y2="100" stroke="#2864c5" stroke-width="3"/>
  <line x1="300" y1="250" x2="300" y2="100" stroke="#278458" stroke-width="2" stroke-dasharray="6 5"/>
  <line x1="300" y1="250" x2="300" y2="200" stroke="#d2473d" stroke-width="2.5" stroke-dasharray="5 4"/>
  <circle cx="150" cy="250" r="5" fill="#111"/>
  <circle cx="450" cy="250" r="5" fill="#111"/>
  <circle cx="300" cy="100" r="6" fill="#c33"/>
  <circle cx="300" cy="250" r="5" fill="#174e9c"/>
  <circle cx="300" cy="200" r="5" fill="#6d3ba8"/>
  <text x="128" y="275" font-family="Arial,sans-serif" font-size="16" fill="#111">A (1,1)</text>
  <text x="452" y="275" font-family="Arial,sans-serif" font-size="16" fill="#111">B (7,1)</text>
  <text x="309" y="96" font-family="Arial,sans-serif" font-size="16" fill="#a22">C (4,4)</text>
  <text x="305" y="270" font-family="Arial,sans-serif" font-size="15" fill="#174e9c">M (4,1)</text>
  <text x="308" y="196" font-family="Arial,sans-serif" font-size="15" fill="#603090">G (4,2)</text>
  <text x="365" y="345" font-family="Arial,sans-serif" font-size="15" fill="#333">Area is maximal when AC = BC.</text>
</svg>

