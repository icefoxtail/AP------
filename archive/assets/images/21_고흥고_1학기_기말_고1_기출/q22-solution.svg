  <text x="238" y="308" font-family="Arial,sans-serif" font-size="14" fill="#a22">R은 CA 위의 점</text>
  <text x="55" y="305" font-family="Arial,sans-serif" font-size="14" fill="#111">C</text>
  <text x="315" y="305" font-family="Arial,sans-serif" font-size="14" fill="#111">A</text>
  <text x="315" y="42" font-family="Arial,sans-serif" font-size="14" fill="#111">B</text>
  <text x="414" y="60" font-family="Arial,sans-serif" font-size="16" fill="#174e9c">대칭으로 펴서 직선으로 만든 경로</text>
  <line x1="520" y1="210" x2="700" y2="30" stroke="#777" stroke-width="2"/>
