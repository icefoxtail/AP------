<svg xmlns="http://www.w3.org/2000/svg" width="760" height="350" viewBox="0 0 760 350" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="svg-title-5b78def62a" aria-describedby="svg-desc-5b78def62a">
  <title id="svg-title-5b78def62a">두 번의 대칭이동으로 펼친 최단 경로</title><desc id="svg-desc-5b78def62a">C=(0,0), A=(6,0), B=(6,6), P=(6,3)으로 둔다. P를 CA, BC에 차례로 대칭이동한 점은 P₂=(−3,6)이고, 펼친 경로의 길이는 PP₂=3√10m이다.</desc><rect width="760" height="350" fill="#fff"/>
  <text x="22" y="28" font-family="Arial,sans-serif" font-size="18" fill="#111">경로를 대칭시켜 직선으로 만든다.</text>
