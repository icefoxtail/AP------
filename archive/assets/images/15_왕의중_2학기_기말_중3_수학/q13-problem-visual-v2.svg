<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 612 546" width="612" height="546" role="img" aria-labelledby="title desc"><title id="title">두 현의 교차점 P에서 생긴 각</title><desc id="desc">왼쪽 A와 오른쪽 C를 잇는 현, 위쪽 D와 아래쪽 B를 잇는 현이 P에서 교차한다. 왼쪽 아래에서 PA와 PB가 이루는 각은 x이다.</desc><rect width="612" height="546" fill="white" /><circle cx="306.0" cy="273.0" r="195.5" fill="none" stroke="#205d9c" stroke-width="3.6" /><line x1="114.0919" y1="310.3032" x2="497.2279" y2="232.3533" stroke="#266f73" stroke-width="4.1" stroke-linecap="round" /><line x1="366.4128" y1="87.0685" x2="282.1745" y2="467.0428" stroke="#704895" stroke-width="4.1" stroke-linecap="round" /><path d="M 285.3467 275.4610 A 42 42 0 0 0 317.4131 308.0919" stroke="#aa5411" stroke-width="2.25" fill="none" /><text x="273.0025" y="322.7493" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#aa5411" text-anchor="middle">x</text><circle cx="326.5035565931686" cy="267.0875157154446" r="4.9" fill="#28364b" /><text x="346.5036" y="287.0875" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">P</text><circle cx="114.0918856359817" cy="310.3031585961145" r="4.9" fill="#28364b" /><text x="96.0919" y="319.3032" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">A</text><circle cx="282.17454336429375" cy="467.0427726458785" r="4.9" fill="#28364b" /><text x="282.1745" y="494.0428" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">B</text><circle cx="497.227855943459" cy="232.35326444512805" r="4.9" fill="#28364b" /><text x="516.2279" y="240.3533" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">C</text><circle cx="366.4128224003022" cy="87.06845106429748" r="4.9" fill="#28364b" /><text x="375.4128" y="71.068