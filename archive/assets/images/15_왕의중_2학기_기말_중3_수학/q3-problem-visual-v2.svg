<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 599 546" width="599" height="546" role="img" aria-labelledby="title desc"><title id="title">반지름 1인 사분원과 삼각비의 각 x</title><desc id="desc">아래 왼쪽 B를 중심으로 하는 사분원이다. 사선은 B에서 호 위의 A를 거쳐 E까지 뻗는다. A와 E에서 가로선 BD에 내린 수선은 C와 D에서 만난다. 사선과 가로선의 각은 x이다.</desc><rect width="599" height="546" fill="white" /><path d="M 104.000 468.500 L 104.000 77.500 A 391.0000 391.0000 0 0 1 495.000 468.500 Z" fill="none" stroke="#205d9c" stroke-width="4.1" /><line x1="104.0000" y1="468.5000" x2="495.0000" y2="77.5000" stroke="#aa5411" stroke-width="4.1" stroke-linecap="round" /><line x1="380.4788" y1="192.0212" x2="380.4788" y2="468.5000" stroke="#266f73" stroke-width="4.1" stroke-linecap="round" /><line x1="495.0000" y1="468.5000" x2="495.0000" y2="77.5000" stroke="#266f73" stroke-width="4.1" stroke-linecap="round" /><line x1="380.4788" y1="452.5000" x2="364.4788" y2="452.5000" stroke="#586574" stroke-width="1.8" stroke-linecap="round" /><line x1="364.4788" y1="452.5000" x2="364.4788" y2="468.5000" stroke="#586574" stroke-width="1.8" stroke-linecap="round" /><line x1="495.0000" y1="452.5000" x2="479.0000" y2="452.5000" stroke="#586574" stroke-width="1.8" stroke-linecap="round" /><line x1="479.0000" y1="452.5000" x2="479.0000" y2="468.5000" stroke="#586574" stroke-width="1.8" stroke-linecap="round" /><path d="M 144.0000 468.5000 A 40 40 0 0 0 132.2843 440.2157" stroke="#aa5411" stroke-width="2.25" fill="none" /><text x="173.6716" y="447.7122" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#aa5411" text-anchor="middle">x</text><text x="242.5929" y="287.9071" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#205d9c" text-anchor="middle">1</text><circle cx="104.0" cy="468.5" r="4.9" fill="#28364b" /><text x="87.0000" y="494.5000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">B</text><circle cx="380.4787514439401" cy="192.0212485560599" r="4.9" fill="#28364b" /><text x="363.4788" y="178.0212" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">A</text><circle cx="380.4787514439401" cy="468.5" r="4.9" fill="#28364b" /><text x="380.4788" y="494.5000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">C</text><circle cx="495.0" cy="468.5" r="4.9" fill="#28364b" /><text x="511.0000" y="494.5000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">D</text><circle cx="495.0" cy="77.5" r="4.9" fill="#28364b" /><text x="506.0000" y="59.5000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">E</text></svg>
