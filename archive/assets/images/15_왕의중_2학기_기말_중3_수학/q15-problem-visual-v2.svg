<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 630 554" width="630" height="554" role="img" aria-labelledby="title desc"><title id="title">같은 길이의 두 호와 접선이 있는 원</title><desc id="desc">원의 아래 A에서 그은 접선 위에 오른쪽 T가 있다. 오른쪽 C와 A, B를 이었다. 호 AC와 BC는 길이가 같다. 각 CAT는 55도, ACB는 x이다.</desc><rect width="630" height="554" fill="white" /><circle cx="319.9875" cy="277.0" r="199.5" fill="none" stroke="#205d9c" stroke-width="3.6" /><line x1="110.5125" y1="476.5000" x2="471.6075" y2="476.5000" stroke="#586574" stroke-width="4.1" stroke-linecap="round" /><line x1="319.9875" y1="476.5000" x2="507.4562" y2="208.7670" stroke="#205d9c" stroke-width="4.1" stroke-linecap="round" /><line x1="191.7514" y1="124.1741" x2="507.4562" y2="208.7670" stroke="#205d9c" stroke-width="4.1" stroke-linecap="round" /><path d="M 319.987 476.500 A 199.5000 199.5000 0 0 0 507.456 208.767" fill="none" stroke="#266f73" stroke-width="5" stroke-linecap="round" /><line x1="489.6183" y1="395.7768" x2="477.1983" y2="387.0802" stroke="#266f73" stroke-width="3.2" stroke-linecap="round" /><path d="M 507.456 208.767 A 199.5000 199.5000 0 0 0 191.751 124.174" fill="none" stroke="#266f73" stroke-width="5" stroke-linecap="round" /><line x1="373.5840" y1="76.9751" x2="369.6598" y2="91.6205" stroke="#266f73" stroke-width="3.2" stroke-linecap="round" /><path d="M 343.5041 442.9148 A 41 41 0 0 1 360.9875 476.5000" stroke="#aa5411" stroke-width="2.25" fill="none" /><text x="394.4003" y="447.4071" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#aa5411" text-anchor="middle">55°</text><path d="M 483.9395 242.3522 A 41 41 0 0 1 467.8532 198.1554" stroke="#704895" stroke-width="2.25" fill="none" /><text x="440.3762" y="238.9983" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#704895" text-anchor="middle">x</text><circle cx="319.9875" cy="277.0" r="4.9" fill="#28364b" /><text x="317.9875" y="262.0000" font-size="29" font-family="Malgun Goth