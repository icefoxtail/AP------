<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 735 572" width="735" height="572" role="img" aria-labelledby="title desc"><title id="title">원의 바깥 두 점 P와 Q에서 만나는 할선</title><desc id="desc">원 위에는 A, B, C, D가 있다. AB와 DC를 연장한 위쪽 교점 P의 각은 23도, AD와 BC를 연장한 왼쪽 교점 Q의 각은 41도이다. C에서 CB와 CD 사이가 x이다.</desc><rect width="735" height="572" fill="white" /><circle cx="417.9231676844212" cy="388.62059608277997" r="105.87940391722002" fill="none" stroke="#205d9c" stroke-width="3.6" /><line x1="272.2965" y1="77.5000" x2="331.1918" y2="449.3505" stroke="#205d9c" stroke-width="4.1" stroke-linecap="round" /><line x1="272.2965" y1="77.5000" x2="504.6545" y2="449.3505" stroke="#205d9c" stroke-width="4.1" stroke-linecap="round" /><line x1="211.1974" y1="449.3505" x2="401.3600" y2="284.0447" stroke="#266f73" stroke-width="4.1" stroke-linecap="round" /><line x1="211.1974" y1="449.3505" x2="504.6545" y2="449.3505" stroke="#266f73" stroke-width="4.1" stroke-linecap="round" /><path d="M 279.8054 124.9090 A 48 48 0 0 0 297.7326 118.2063" stroke="#205d9c" stroke-width="2.25" fill="none" /><text x="342.7645" y="166.9905" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#205d9c" text-anchor="middle">23°</text><path d="M 256.1974 449.3505 A 45 45 0 0 0 245.1594 419.8279" stroke="#266f73" stroke-width="2.25" fill="none" /><text x="288.9412" y="428.2833" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#266f73" text-anchor="middle">41°</text><path d="M 465.6545 449.3505 A 39 39 0 0 1 483.9876 416.2767" stroke="#704895" stroke-width="2.25" fill="none" /><text x="450.4281" y="427.2923" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#704895" text-anchor="middle">x</text><circle cx="272.29649987234455" cy="77.5" r="4.9" fill="#28364b" /><text x="259.2965" y="62.5000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text