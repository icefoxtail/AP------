<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 611 549" width="611" height="549" role="img" aria-labelledby="title desc"><title id="title">중심각 160도와 그 호 위의 원주각</title><desc id="desc">원 위의 B와 C에서 중심 O로 두 선을 이었다. 아래를 향한 중심각 BOC는 160도이다. 아래쪽 원 위 A에서 B와 C를 이은 두 현 사이의 각은 x이다.</desc><rect width="611" height="549" fill="white" /><circle cx="305.5" cy="274.5" r="197.0" fill="none" stroke="#205d9c" stroke-width="3.6" /><polygon points="305.5000,471.5000 111.4929,308.7087 499.5071,308.7087" fill="none" /><line x1="111.4929" y1="308.7087" x2="305.5000" y2="274.5000" stroke="#266f73" stroke-width="4.1" stroke-linecap="round" /><line x1="305.5000" y1="274.5000" x2="499.5071" y2="308.7087" stroke="#266f73" stroke-width="4.1" stroke-linecap="round" /><line x1="305.5000" y1="471.5000" x2="111.4929" y2="308.7087" stroke="#205d9c" stroke-width="4.1" stroke-linecap="round" /><line x1="305.5000" y1="471.5000" x2="499.5071" y2="308.7087" stroke="#205d9c" stroke-width="4.1" stroke-linecap="round" /><path d="M 266.1077 281.4459 A 40 40 0 0 0 344.8923 281.4459" stroke="#266f73" stroke-width="2.25" fill="none" /><text x="305.5000" y="348.5000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#266f73" text-anchor="middle">160°</text><path d="M 270.2620 441.9318 A 46 46 0 0 1 340.7380 441.9318" stroke="#aa5411" stroke-width="2.25" fill="none" /><text x="305.5000" y="411.5000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#aa5411" text-anchor="middle">x</text><circle cx="305.5" cy="274.5" r="4.9" fill="#28364b" /><text x="305.5000" y="259.5000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">O</text><circle cx="305.49999999999994" cy="471.5" r="4.9" fill="#28364b" /><text x="305.5000" y="497.5000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">A</text><circle cx="111.49287265659504" cy="308.70869100038533" r="4.9" fill="#28364b" /><text x="92.4929" y="317.7087" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">B</text><circle cx="499.50712734340493" cy="308.70869100038544" r="4.9" fill="#28364b" /><text x="518.5071" y="317.7087" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">C</text></svg>
