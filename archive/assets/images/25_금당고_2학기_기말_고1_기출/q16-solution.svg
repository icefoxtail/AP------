<title id="q16-title">무리함수의 시작점과 제1·2사분면</title><desc id="q16-desc">유리함수 그래프의 점근선과 기준점으로 a=3, b=2, c=2를 구한다. 무리함수 y=√(3x+2)+2는 x≥−2/3, y≥2이고 시작점 (−2/3,2)에서 출발해 제2사분면과 제1사분면을 차례로 지난다.</desc>
