<title id="q20-title">구간별 일대일 대응과 경계값</title><desc id="q20-desc">x&lt;1에서 직선 y=x+4는 5보다 작은 값을 한 번씩 갖는다. x≥1에서 포물선 y=2(x−1)²+5는 (1,5)부터 위로 증가해 5 이상의 값을 한 번씩 갖는다. 전체 함수는 실수 전체에서 일대일 대응이며 g(3)=13이다.</desc>
