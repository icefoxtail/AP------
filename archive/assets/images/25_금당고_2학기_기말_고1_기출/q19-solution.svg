<title id="q19-title">절댓값 이차함수와 상수함수의 네 교점</title><desc id="q19-desc">y=|(x−3)²−5|의 두 영점은 x=3±√5이다. 수평선 y=2는 곡선과 서로 다른 네 점에서 만나며, 0&lt;k&lt;5일 때만 수평선 y=k와의 네 교점이 생긴다. k=0일 때 두 점, k=5일 때 세 점이다.</desc>
