<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" width="640" height="280" role="img" aria-labelledby="title desc">
  <title id="title">직선과 탈레스 원의 교점 조건</title>
  <desc id="desc">A와 B를 지름의 양 끝점으로 하는 원과 직선 2x-y=k가 만나야 하는 조건, 그리고 가능한 정수 k를 나타낸 그림이다.</desc>
  <rect width="640" height="280" fill="#ffffff"/>
  <text x="320" y="27" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="22" font-weight="700" fill="#1e3a5f">∠APB = 90°  ⇔  P는 AB를 지름으로 하는 원 위</text>
  <rect x="18" y="43" width="282" height="188" rx="8" fill="#f8fafc" stroke="#dbe3ef"/>
  <text x="34" y="68" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="17" font-weight="700" fill="#334155">탈레스 원</text>
  <g stroke="#e2e8f0" stroke-width="1">
    <line x1="74" y1="82" x2="74" y2="215"/><line x1="119" y1="82" x2="119" y2="215"/><line x1="164" y1="82" x2="164" y2="215"/><line x1="209" y1="82" x2="209" y2="215"/><line x1="254" y1="82" x2="254" y2="215"/>
    <line x1="43" y1="104" x2="276" y2="104"/><line x1="43" y1="149" x2="276" y2="149"/><line x1="43" y1="194" x2="276" y2="194"/>
  </g>
  <line x1="42" y1="149" x2="278" y2="149" stroke="#0f172a" stroke-width="1.4"/>
  <line x1="164" y1="219" x2="164" y2="78" stroke="#0f172a" stroke-width="1.4"/>
  <circle cx="164" cy="149" r="67" fill="#dbeafe" fill-opacity="0.62" stroke="#2563eb" stroke-width="2.4"/>
  <line x1="164" y1="149" x2="164" y2="82" stroke="#dc2626" stroke-width="2" stroke-dasharray="5 4"/>
  <line x1="164" y1="82" x2="164" y2="216" stroke="#64748b" stroke-width="2"/>
  <circle cx="164" cy="149" r="4" fill="#1d4ed8"/>
  <circle cx="164" cy="82" r="4" fill="#dc2626"/><circle cx="164" cy="216" r="4" fill="#dc2626"/>
  <text x="176" y="106" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="16" fill="#b91c1c">r = √10</text>
  <text x="174" y="145" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="16" font-weight="700" fill="#1d4ed8">O(0,0)</text>
  <text x="175" y="86" font-family="Arial, sans-serif" font-size="15" fill="#b91c1c">A</text><text x="175" y="216" font-family="Arial, sans-serif" font-size="15" fill="#b91c1c">B</text>
  <line x1="53" y1="193" x2="270" y2="106" stroke="#0f766e" stroke-width="2.2"/>
  <text x="47" y="216" font-family="Arial, sans-serif" font-size="15" fill="#0f766e">l: 2x−y=k</text>
  <text x="45" y="248" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="15" fill="#475569">거리 ≤ 반지름이면 교점 존재</text>
  <rect x="318" y="43" width="304" height="188" rx="8" fill="#fff7ed" stroke="#fed7aa"/>
  <text x="336" y="68" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="17" font-weight="700" fill="#9a3412">정수 k의 범위</text>
  <text x="336" y="96" font-family="Arial, sans-serif" font-size="16" fill="#334155">|k| / √5 ≤ √10  →  |k| ≤ 5√2</text>
  <line x1="347" y1="155" x2="593" y2="155" stroke="#64748b" stroke-width="2"/>
  <path d="M347 155 l8 -4 v8 z M593 155 l-8 -4 v8 z" fill="#64748b"/>
  <line x1="378" y1="155" x2="562" y2="155" stroke="#2563eb" stroke-width="8" stroke-linecap="round"/>
  <line x1="562" y1="155" x2="574" y2="155" stroke="#f97316" stroke-width="3" stroke-dasharray="4 3"/>
  <line x1="368" y1="144" x2="368" y2="166" stroke="#475569" stroke-width="1.5"/><line x1="408" y1="144" x2="408" y2="166" stroke="#475569" stroke-width="1.5"/><line x1="448" y1="144" x2="448" y2="166" stroke="#475569" stroke-width="1.5"/><line x1="488" y1="144" x2="488" y2="166" stroke="#475569" stroke-width="1.5"/><line x1="528" y1="144" x2="528" y2="166" stroke="#475569" stroke-width="1.5"/><line x1="568" y1="144" x2="568" y2="166" stroke="#475569" stroke-width="1.5"/>
  <text x="360" y="181" font-family="Arial, sans-serif" font-size="15">−8</text><text x="400" y="181" font-family="Arial, sans-serif" font-size="15">−7</text><text x="441" y="181" font-family="Arial, sans-serif" font-size="15">0</text><text x="481" y="181" font-family="Arial, sans-serif" font-size="15">7</text><text x="557" y="181" font-family="Arial, sans-serif" font-size="15">8</text>
  <text x="369" y="207" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="15" fill="#2563eb">−7 ≤ k ≤ 7</text><text x="503" y="207" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="15" fill="#c2410c">7 &lt; 5√2 &lt; 8</text>
  <text x="386" y="226" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="16" font-weight="700" fill="#1e3a5f">15개</text>
</svg>
