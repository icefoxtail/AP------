<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 280" width="500" height="280" role="img" aria-labelledby="title desc">
<title id="title">q19 넓이로 가로와 세로 찾기</title>
<desc id="desc">네 부분의 넓이를 이용해 가로를 2x와 7, 세로를 x와 4로 정한다.</desc>
<g fill="none" stroke="currentColor" stroke-width="2.5">
  <rect x="75" y="55" width="350" height="160"/>
  <line x1="285" y1="55" x2="285" y2="215"/>
  <line x1="75" y1="125" x2="425" y2="125"/>
</g>
<g fill="currentColor" font-family="Noto Sans CJK KR, sans-serif" text-anchor="middle">
  <text x="180" y="45" font-size="18">2x</text><text x="355" y="45" font-size="18">7</text>
  <text x="56" y="95" font-size="18">x</text><text x="56" y="178" font-size="18">4</text>
  <text x="180" y="98" font-size="20">2x²</text><text x="355" y="98" font-size="20">7x</text>
  <text x="180" y="178" font-size="20">8x</text><text x="355" y="178" font-size="20">28</text>
  <text x="250" y="246" font-size="18">가로=2x+7, 세로=x+4</text>
  <text x="250" y="271" font-size="18">둘레=2{(2x+7)+(x+4)}=6x+22</text>
</g>
</svg>