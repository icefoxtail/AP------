<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 250" width="540" height="250" role="img" aria-labelledby="title desc">
<title id="title">q9 수직선 위의 두 무리수</title>
<desc id="desc">A=-3에서 길이 루트10, E=2에서 길이 2루트2를 수직선에 옮겨 P와 Q를 정한다.</desc>
<g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
  <line x1="35" y1="180" x2="510" y2="180" stroke-width="2"/>
  <path d="M160 180 L200 180 L200 60 Z" stroke-width="2.5"/>
  <path d="M160 180 L200 60" stroke-width="3"/>
  <path d="M360 180 L440 180 L440 100 Z" stroke-width="2.5"/>
  <path d="M360 180 L440 100" stroke-width="3"/>
  <line x1="160" y1="180" x2="286.49" y2="180" stroke="#2563eb" stroke-width="4"/>
  <line x1="360" y1="180" x2="473.14" y2="180" stroke="#2563eb" stroke-width="4"/>
  <path d="M190 180 L190 170 L200 170" stroke-width="2"/>
  <path d="M430 180 L430 170 L440 170" stroke-width="2"/>
</g>
<g fill="currentColor" font-family="Noto Sans CJK KR, sans-serif" font-size="16">
  <circle cx="160" cy="180" r="4"/><circle cx="286.49" cy="180" r="4"/><circle cx="360" cy="180" r="4"/><circle cx="473.14" cy="180" r="4"/>
  <text x="160" y="203" text-anchor="middle">A=-3</text><text x="286.49" y="203" text-anchor="middle">P=-3+√10</text>
  <text x="360" y="226" text-anchor="middle">E=2</text><text x="473.14" y="203" text-anchor="middle">Q=2+2√2</text>
  <text x="180" y="174" text-anchor="middle">1</text><text x="209" y="124">3</text><text x="168" y="105">AB=√10</text>
  <text x="400" y="174" text-anchor="middle">2</text><text x="449" y="144">2</text><text x="374" y="119">EF=2√2</text>
  <text x="270" y="28" text-anchor="middle" font-size="18">반지름을 수직선의 오른쪽에 옮긴다</text>
</g>
</svg>