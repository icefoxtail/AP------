<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" width="560" height="300" role="img" aria-labelledby="title desc">
<title id="title">q24 수직선 위 네 점과 두 선분</title>
<desc id="desc">중심 -4와 2에서 각각 반지름 루트5와 루트10을 옮겨 A,B,C,D를 정하고 AD와 BC의 차를 비교한다.</desc>
<g fill="none" stroke="currentColor" stroke-linecap="round">
  <line x1="35" y1="130" x2="520" y2="130" stroke-width="2"/>
  <path d="M70.45 130 A71.55 71.55 0 0 1 213.55 130" stroke="#2563eb" stroke-width="3"/>
  <path d="M232.81 130 A101.19 101.19 0 0 1 435.19 130" stroke="#dc2626" stroke-width="3"/>
  <line x1="70.45" y1="130" x2="435.19" y2="130" stroke="#16a34a" stroke-width="4" opacity="0.7"/>
  <line x1="213.55" y1="145" x2="232.81" y2="145" stroke="#7c3aed" stroke-width="4"/>
</g>
<g fill="currentColor" font-family="Noto Sans CJK KR, sans-serif" font-size="15">
  <circle cx="70.45" cy="130" r="4"/><circle cx="142" cy="130" r="4"/><circle cx="213.55" cy="130" r="4"/>
  <circle cx="232.81" cy="130" r="4"/><circle cx="334" cy="130" r="4"/><circle cx="435.19" cy="130" r="4"/>
  <text x="70.45" y="158" text-anchor="middle">A=-4-√5</text><text x="142" y="115" text-anchor="middle">-4</text><text x="213.55" y="180" text-anchor="middle">B=-4+√5</text>
  <text x="232.81" y="205" text-anchor="middle">C=2-√10</text><text x="334" y="115" text-anchor="middle">2</text><text x="435.19" y="158" text-anchor="middle">D=2+√10</text>
  <text x="142" y="48" text-anchor="middle" font-size="18">반지름 √5</text><text x="334" y="48" text-anchor="middle" font-size="18">반지름 √10</text>
  <text x="280" y="238" text-anchor="middle" font-size="17">AD=6+√10+√5</text>
  <text x="280" y="263" text-anchor="middle" font-size="17">BC=6-√10-√5</text>
  <text x="280" y="290" text-anchor="middle" font-size="18">AD-BC=2√10+2√5</text>
</g>
</svg>