<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 432 472" width="432" height="472" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-ellipse-figure="ellipse-figure-v1" data-conic="PARABOLA" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="6" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round"><title id="visual-title">포물선 y²=8x에서 p=2이고 기울기가 m인 접선은 y=mx+p/m이다. m=−2이면 접선은 y=−2x−1이고 접점은 T(1/2, −2)이다. 접선이 x축과 만나는 점은 0=−2x−1에서 Q(−1/2, 0)이다. 따라서 x절편은 −1/2이고 답은 ⑤이다.</title><desc id="visual-desc">오른쪽으로 열린 포물선과 아래쪽 접점 T에서 닿는 기울기 −2의 접선이 있다. 접선이 x축과 만나는 점 Q와 접점 T의 좌표가 표시되어 있다.</desc><rect width="432" height="472" fill="#fff"/><g data-layer="10"><line id="axis-x" data-role="axis" data-axis="x" x1="140" y1="236" x2="291.58" y2="236" fill="none" stroke="#444" stroke-width="1.1"/></g><g data-layer="10"><line id="axis-y" data-role="axis" data-axis="y" x1="187.37" y1="416" x2="187.37" y2="56" fill="none" stroke="#444" stroke-width="1.1"/></g><g data-layer="11"><polygon id="axis-x-head" data-role="axis-head" data-axis="x" points="291.58,236 282.58,232.4 282.58,239.6" fill="#444" stroke="none"/></g><g data-layer="11"><polygon id="axis-y-head" data-role="axis-head" data-axis="y" points="187.37,56 183.77,65 190.97,65" fill="#444" stroke="none"/></g><g data-layer="25"><path id="curve" data-role="curve" data-curve="PARABOLA" d="M291.58 413.74 L290.27 412.63 L288.97 411.5 L287.67 410.38 L286.38 409.25 L285.1 408.13 L283.82 407 L282.56 405.88 L281.3 404.75 L280.05 403.63 L278.81 402.5 L277.58 401.38 L276.36 400.25 L275.14 399.13 L273.94 398 L272.74 396.88 L271.55 395.75 L270.37 394.63 L269.19 393.5 L268.03 392.38 L266.87 391.25 L265.73 390.13 L264.59 389 L263.45 387.88 L262.33 386.75 L261.22 385.63 L260.11 384.5 L259.01 383.38 L257.92 382.25 L256.84 381.13 L255.77 380 L254.7 378.88 L253.65 377.75 L252.6 376.63 L251.56 375.5 L250.53 374.38 L249.51 373.25 L248.49 372.13 L247.49 371 L246.49 369