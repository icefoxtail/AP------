<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 528 368" width="528" height="368" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-ellipse-figure="ellipse-figure-v1" data-major-axis="X" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="6" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round"><title id="visual-title">예: a=5, b=3인 타원에서 F를 지나는 세로 현의 끝점을 A, B로 한 그림이다. F가 현 AB 위에 있으므로 AB=AF+FB이다. 타원의 정의 AF+AF′=2a, BF+BF′=2a를 더하면 삼각형 ABF′의 둘레는 4a이다. 4a=20이므로 a=5이고 c=4에서 b²=25−16=9이므로 b=3이다. 따라서 a+b=8이고 답은 ②이다.</title><desc id="visual-desc">가로로 긴 타원과 두 초점 F, F′가 있다. 오른쪽 초점 F를 지나는 세로 현의 위아래 끝점 A, B와 왼쪽 초점 F′를 잇는 삼각형이 색칠되어 있고 길이가 표시되어 있다.</desc><rect width="528" height="368" fill="#fff"/><g data-layer="10"><line id="axis-x" data-role="axis" data-axis="x" x1="34" y1="184" x2="494" y2="184" fill="none" stroke="#444" stroke-width="1.1"/></g><g data-layer="10"><line id="axis-y" data-role="axis" data-axis="y" x1="264" y1="334" x2="264" y2="34" fill="none" stroke="#444" stroke-width="1.1"/></g><g data-layer="11"><polygon id="axis-x-head" data-role="axis-head" data-axis="x" points="494,184 485,180.4 485,187.6" fill="#444" stroke="none"/></g><g data-layer="11"><polygon id="axis-y-head" data-role="axis-head" data-axis="y" points="264,34 260.4,43 267.6,43" fill="#444" stroke="none"/></g><g data-layer="20"><polygon id="polygon-tri" data-role="polygon" data-points="A,B,F'" points="424,112 424,256 104,184" fill="#eeeeee" stroke="none"/></g><g data-layer="25"><ellipse id="ellipse" data-role="ellipse" cx="264" cy="184" rx="200" ry="120" fill="none" stroke="#111" stroke-width="1.7"/></g><g data-layer="30"><line id="segment-sAF" data-role="segment" data-from="A" data-to="F" x1="424" y1="112" x2="424" y2="184" fill="none" stroke="#111" stroke-width="1.3"/></g><g data-layer="30"><line id="segment-sFB" data-role="segment" data-from="F" data-to="B" x1="424" y1="184" x2="424" y2="256" fill="none" s