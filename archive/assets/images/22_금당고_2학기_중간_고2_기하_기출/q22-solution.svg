<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" width="600" height="420" role="img" aria-labelledby="title desc" data-visual-type="geometry" data-scale-policy="EQUAL_SCALE_REQUIRED" data-axis-scale-mode="EQUAL_UNIT" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT"><title id="title">접은 선과 타원 자취의 한 배치</title><desc id="desc">중심 O인 원의 위 점 A와 내부점 F를 접어 선분 AF의 수직이등분선 l을 만들고, l과 OA의 교점 P가 초점 O,F인 타원 위에 놓이는 한 예시이다.</desc><rect width="600" height="420" fill="#fff"/><text x="24" y="28" font-family="sans-serif" font-size="17" font-weight="700">접은 선을 따라 움직이는 P의 자취</text><circle cx="210" cy="220" r="170" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="7 6"/><ellipse cx="236" cy="220" rx="85" ry="80.9259" fill="#dbeafe" fill-opacity=".35" stroke="#2563eb" stroke-width="3"/><line x1="210" y1="220" x2="380" y2="220" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5 5"/><line x1="321" y1="220" x2="380" y2="220" stroke="#16a34a" stroke-width="4"/><line x1="262" y1="220" x2="321" y2="220" stroke="#f97316" stroke-width="3"/><line x1="321" y1="70" x2="321" y2="370" stroke="#7c3aed" stroke-width="2" stroke-dasharray="6 5"/><path d="M309 220 L309 208 L321 208" fill="none" stroke="#111827" stroke-width="1.5"/><circle cx="210" cy="220" r="5" fill="#111827"/><circle cx="262" cy="220" r="5" fill="#111827"/><circle cx="321" cy="220" r="5" fill="#111827"/><circle cx="380" cy="220" r="5" fill="#111827"/><text x="198" y="246" font-family="sans-serif" font-size="15">O</text><text x="255" y="246" font-family="sans-serif" font-size="15">F</text><text x="314" y="205" font-family="sans-serif" font-size="15">P</text><text x="379" y="205" font-family="sans-serif" font-size="15">A</text><text x="328" y="93" font-family="sans-serif" font-size="15">l</text><text x="302" y="270" font-family="sans-serif" font-size="12">M=P (예시)</text><text x="30" y="375" font-family="sans-serif" font-size="14">AP=PF  ·  OP+PF=OA=r</text><text x="30" y="398" font-family="sans-seri