<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 688 877" width="688" height="877" role="img" aria-labelledby="title desc"><title id="title">열림과 꼭짓점 위치가 다른 다섯 보기</title><desc id="desc">①은 왼쪽 위쪽, ②는 오른쪽 위쪽 꼭짓점에서 위로 열린다. ③은 오른쪽 위에 꼭짓점이 있고 아래로, ④는 오른쪽 아래에서 아래로 열린다. ③과 ④는 x축 아래에서 y축을 지난다. ⑤는 오른쪽 아래에서 위로 열리고 y축의 양의 부분을 지난다.</desc><rect width="688" height="877" fill="white" /><rect x="13" y="14" width="319" height="262" rx="12" fill="#f6fafc" stroke="#d9e3ec" stroke-width="1.4" /><text x="31.0000" y="54.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#205d9c" text-anchor="start">①</text><line x1="36.0000" y1="165.1079" x2="301.0000" y2="165.1079" stroke="#4d5d72" stroke-width="1.65" stroke-linecap="round" /><polygon points="301.0000,165.1079 288.0000,160.1079 288.0000,170.1079" fill="#4d5d72" /><text x="318.0000" y="157.1079" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#4d5d72" text-anchor="middle">x</text><line x1="222.2162" y1="253.0000" x2="222.2162" y2="75.0000" stroke="#4d5d72" stroke-width="1.65" stroke-linecap="round" /><polygon points="222.2162,75.0000 217.2162,88.0000 227.2162,88.0000" fill="#4d5d72" /><text x="238.2162" y="81.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#4d5d72" text-anchor="middle">y</text><text x="235.2162" y="194.1079" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#4d5d72" text-anchor="middle">O</text><path d="M 78.5760 81.6473 Q 168.5000 193.4205 258.4240 81.6473" stroke="#205d9c" stroke-width="5.8" stroke-linecap="round" fill="none" /><rect x="346" y="14" width="319" height="262" rx="12" fill="#f6fafc" stroke="#d9e3ec" stroke-width="1.4" /><text x="364.0000" y="54.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#205d9c" text-anchor="start">②</text><line x1="369.0000" y1="165.1079" x2="634.