<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 460" role="img" aria-label="직선 확률밀도함수와 1부터 3까지 구간의 넓이">
<rect width="840" height="460" fill="white"/>
<text x="420" y="38" font-size="23" font-family="Noto Sans CJK KR, Malgun Gothic, Apple SD Gothic Neo, Nanum Gothic, sans-serif" text-anchor="middle">f(x)=a(x+2), 0 ≤ x ≤ 4</text>
<line x1="88" y1="320" x2="754" y2="320" stroke="#333" stroke-width="2"/><line x1="110" y1="345" x2="110" y2="60" stroke="#333" stroke-width="2"/>
<polygon points="110,320 110,240 710,80 710,320" fill="#e5f2fb"/>
<polygon points="260,320 260,200 560,120 560,320" fill="#89c5ee" opacity="0.9"/>
<line x1="110" y1="240" x2="710" y2="80" stroke="#174d78" stroke-width="4"/>
<g stroke="#666" stroke-width="1.5" stroke-dasharray="6 5"><line x1="260" y1="200" x2="260" y2="320"/><line x1="560" y1="120" x2="560" y2="320"/></g>
<g fill="#174d78"><circle cx="110" cy="240" r="4"/><circle cx="260" cy="200" r="4"/><circle cx="560" cy="120" r="4"/><circle cx="710" cy="80" r="4"/></g>
<g font-family="Noto Sans CJK KR, Malgun Gothic, Apple SD Gothic Neo, Nanum Gothic, sans-serif" font-size="20" fill="#222" text-anchor="middle"><text x="110" y="348">0</text><text x="260" y="348">1</text><text x="560" y="348">3</text><text x="710" y="348">4</text><text x="70" y="244">2a</text><text x="260" y="184">3a</text><text x="560" y="104">5a</text><text x="738" y="84">6a</text><text x="410" y="263" font-size="25">8a = 1/2</text><text x="420" y="404" font-size="19">전체 사다리꼴 넓이 = 16a = 1</text></g>
</svg>