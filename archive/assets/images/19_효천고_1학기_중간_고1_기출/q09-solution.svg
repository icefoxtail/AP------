<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="940" height="490" viewBox="0 0 940 490" role="img" aria-labelledby="title desc">
<title id="title">직선과 이차함수의 두 접점</title>
<desc id="desc">직선 y=x−1과 이차함수 y=x²+kx+1이 접하는 두 경우를 접점 주변에서 각각 보여 준다.</desc>
<style>text{font-family:'Noto Sans KR','Malgun Gothic',sans-serif;fill:#172033}.title{font-size:22px;font-weight:700}.case{font-size:18px;font-weight:700}.label{font-size:17px}.small{font-size:16px}.curve{fill:none;stroke:#1769aa;stroke-width:3.5;stroke-linecap:round}.tangent{fill:none;stroke:#d45a1b;stroke-width:3;stroke-linecap:round}.grid{stroke:#e4e9f0;stroke-width:1}.frame{fill:#fff;stroke:#cbd5e1;stroke-width:1.4}.contact{fill:#5b3fd6;stroke:#fff;stroke-width:2}</style>
<rect width="940" height="490" fill="#fff"/>
<text x="28" y="36" class="title">직선과 이차함수의 접점</text>
<g aria-label="첫째 접점">
<rect x="20" y="56" width="445" height="400" rx="14" class="frame"/>
<text x="42" y="88" class="case">k=1−2√2</text>
<text x="42" y="111" class="small">첫째 접점 주변 확대</text>
<rect x="60" y="130" width="356" height="230" fill="#fbfcfe" stroke="#d5dce6"/>
<line x1="238.000000000" y1="130" x2="238.000000000" y2="360" class="grid"/>
<line x1="60" y1="271.538461538" x2="416" y2="271.538461538" class="grid"/>
<path id="parabola-1" d="M 60.000000000 288.125000000 Q 238.000000000 321.298076923 416.000000000 155.432692308" class="curve"/>
<path id="tangent-1" d="M 60.000000000 337.884615385 L 416.000000000 205.192307692" class="tangent"/>
<circle cx="238.000000000" cy="271.538461538" r="6" class="contact"/>
<text x="248.000000000" y="253.538461538" class="label">T1</text>
<text x="44" y="386" class="small">접점 좌표: (√2, √2−1)</text><line x1="44" y1="430" x2="76" y2="430" class="curve"/><text x="86" y="436" class="small">포물선</text>
<line x1="218" y1="430" x2="250" y2="430" class="tangent"/><text x="260" y="436" class="small">직선 y=x−1</text>
<text x="420" y="357" class="small">x</text><text x="47" y="147" class="small">y</text>
</g>
<g aria-label="둘째 접점">
<rect x="475" y="56" width="445" height="400" rx="14" class="frame"/>
<text x="497" y="88" class="case">k=1+2√2</text>
<text x="497" y="111" class="small">둘째 접점 주변 확대</text>
<rect x="515" y="130" width="356" height="230" fill="#fbfcfe" stroke="#d5dce6"/>
<line x1="693.000000000" y1="130" x2="693.000000000" y2="360" class="grid"/>
<line x1="515" y1="271.538461538" x2="871" y2="271.538461538" class="grid"/>
<path id="parabola-2" d="M 515.000000000 288.125000000 Q 693.000000000 321.298076923 871.000000000 155.432692308" class="curve"/>
<path id="tangent-2" d="M 515.000000000 337.884615385 L 871.000000000 205.192307692" class="tangent"/>
<circle cx="693.000000000" cy="271.538461538" r="6" class="contact"/>
<text x="703.000000000" y="253.538461538" class="label">T2</text>
<text x="494" y="386" class="small">접점 좌표: (−√2, −√2−1)</text><line x1="494" y1="430" x2="526" y2="430" class="curve"/><text x="536" y="436" class="small">포물선</text>
<line x1="668" y1="430" x2="700" y2="430" class="tangent"/><text x="710" y="436" class="small">직선 y=x−1</text>
<text x="875" y="357" class="small">x</text><text x="502" y="147" class="small">y</text>
</g>
</svg>
