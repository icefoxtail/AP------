<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" role="img" aria-labelledby="title desc">
<title id="title">변수 u의 구간에서 함수값 비교</title>
<desc id="desc">u의 구간은 −2에서 6까지이다. 꼭짓점 u=2에서 최솟값 −7이고 양 끝에서 최댓값 9이다.</desc>
<style>text{font-family:'Noto Sans KR','Malgun Gothic',sans-serif;fill:#172033}.title{font-size:23px;font-weight:700}.sub{font-size:18px}.label{font-size:18px;font-weight:600}.tick{font-size:16px}.curve{fill:none;stroke:#1769aa;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.grid{stroke:#e4e9f0;stroke-width:1}.guide{stroke:#64748b;stroke-width:1.5;stroke-dasharray:7 6}.frame{fill:#fff;stroke:#cbd5e1;stroke-width:1.4}.end{fill:#d45a1b;stroke:#fff;stroke-width:2}.vertex{fill:#6b4eff;stroke:#fff;stroke-width:2}</style>
<rect width="1000" height="640" fill="#fff"/>
<text x="38" y="42" class="title">u∈[−2,6]에서의 함수값</text>
<text x="38" y="70" class="sub">G(u)=(u−2)²−7</text>
<rect x="100" y="84" width="800" height="460" class="frame"/>
<line x1="100.000000000" y1="84" x2="100.000000000" y2="544" class="grid"/>
<line x1="300.000000000" y1="84" x2="300.000000000" y2="544" class="grid"/>
<line x1="500.000000000" y1="84" x2="500.000000000" y2="544" class="grid"/>
<line x1="700.000000000" y1="84" x2="700.000000000" y2="544" class="grid"/>
<line x1="900.000000000" y1="84" x2="900.000000000" y2="544" class="grid"/>
<line x1="100" y1="544.000000000" x2="900" y2="544.000000000" class="grid"/>
<line x1="100" y1="441.777777778" x2="900" y2="441.777777778" class="grid"/>
<line x1="100" y1="339.555555556" x2="900" y2="339.555555556" class="grid"/>
<line x1="100" y1="237.333333333" x2="900" y2="237.333333333" class="grid"/>
<line x1="100" y1="135.111111111" x2="900" y2="135.111111111" class="grid"/>
<line x1="100" y1="339.555555556" x2="900" y2="339.555555556" stroke="#172033" stroke-width="2"/>
<line x1="300.000000000" y1="84" x2="300.000000000" y2="544" stroke="#172033" stroke-width="2"/>
<path id="transformed-quadratic" d="M 100.000000000 109.555555556 Q 300.000000000 518.444444444 500.000000000 518.444444444 Q 700.000000000 518.444444444 900.000000000 109.555555556" class="curve"/>
<line x1="100.000000000" y1="339.555555556" x2="100.000000000" y2="109.555555556" class="guide"/>
<line x1="900.000000000" y1="339.555555556" x2="900.000000000" y2="109.555555556" class="guide"/>
<circle id="left-endpoint" cx="100.000000000" cy="109.555555556" r="7" class="end"/>
<circle id="minimum-vertex" cx="500.000000000" cy="518.444444444" r="7" class="vertex"/>
<circle id="right-endpoint" cx="900.000000000" cy="109.555555556" r="7" class="end"/>
<text x="100.000000000" y="567" text-anchor="middle" class="tick">-2</text>
<text x="300.000000000" y="567" text-anchor="middle" class="tick">0</text>
<text x="500.000000000" y="567" text-anchor="middle" class="tick">2</text>
<text x="700.000000000" y="567" text-anchor="middle" class="tick">4</text>
<text x="900.000000000" y="567" text-anchor="middle" class="tick">6</text>
<text x="895" y="596" text-anchor="end" class="label">u</text>
<text x="140" y="130" class="label">G(u)</text>
<text x="112" y="97.55555555555554" class="label">(−2,9)</text>
<text x="512" y="547.4444444444445" class="label">최솟값 −7</text>
<text x="785" y="97.55555555555554" class="label">최댓값 9</text>
<text x="100" y="620" class="sub">양 끝 u=−2,6에서 G(u)=9</text>
</svg>
