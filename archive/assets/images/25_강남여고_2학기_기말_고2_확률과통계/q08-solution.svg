<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="328" viewBox="0 0 720 328" role="img" aria-labelledby="q8-title q8-desc">
<title id="q8-title">확률밀도함수의 삼각형 넓이</title><desc id="q8-desc">x가 2부터 5까지 증가하는 직선. (2,0), (5,0), (5,2/3) 꼭짓점이 이루는 삼각형의 넓이가 1이다.</desc>
<style>.head{font:bold 23px Arial,'Noto Sans KR',sans-serif;fill:#243747}.label{font:21px Arial,'Noto Sans KR',sans-serif;fill:#253a49}.note{font:19px Arial,'Noto Sans KR',sans-serif;fill:#285577}</style>
<rect width="720" height="328" fill="white"/><text x="35" y="40" class="head">전체 확률 = 삼각형 넓이 = 1</text>
<polygon points="175,248 575,248 575,78" fill="#c4dcec" stroke="none" data-left="2" data-right="5" data-height="0.666666666666667"/>
<line x1="90" y1="248" x2="670" y2="248" stroke="#243a49" stroke-width="1.8"/>
<polyline points="175,248 575,78" fill="none" stroke="#273c49" stroke-width="2.6"/>
<line x1="575" y1="78" x2="575" y2="248" stroke="#344c5e" stroke-width="1.8" stroke-dasharray="5 4"/>
<text x="175" y="276" text-anchor="middle" class="label">2</text><text x="575" y="276" text-anchor="middle" class="label">5</text>
<text x="592" y="91" class="label">3a</text><text x="365" y="233" class="label">밑변 3</text><text x="365" y="314" text-anchor="middle" class="note">1/2 × 3 × 3a = 1</text>
</svg>