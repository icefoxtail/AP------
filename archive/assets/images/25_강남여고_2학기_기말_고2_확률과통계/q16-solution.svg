<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" width="720" height="330" viewBox="0 0 720 330" role="img" aria-labelledby="s16-title s16-desc"><title id="s16-title">신뢰구간 두 개의 중심과 반길이</title><desc id="s16-desc">99% 신뢰구간 9.42부터 14.58, 95% 신뢰구간 10.04부터 13.96의 중심은 둘 다 12이며 반길이는 2.58과 1.96이다.</desc><style>.h{fill:#253b4a;font:bold 22px Arial,'Noto Sans KR',sans-serif}.l{fill:#213541;font:19px Arial,'Noto Sans KR',sans-serif}</style><rect width="720" height="330" fill="white"/><text x="30" y="40" class="h">같은 표본이면 중심과 표준오차는 같다</text><line x1="100" y1="270" x2="630" y2="270" stroke="#516a7a" stroke-width="1.5"/><line x1="360" y1="76" x2="360" y2="276" stroke="#7a96a5" stroke-width="1.2" stroke-dasharray="6 5"/><line x1="153.6" y1="120" x2="566.4" y2="120" stroke="#658ba9" stroke-width="8" stroke-linecap="round"/><line x1="203.2" y1="199" x2="516.8" y2="199" stroke="#263f56" stroke-width="8" stroke-linecap="round"/><text x="33" y="120" class="l">99%</text><text x="33" y="200" class="l">95%</text><text x="153.6" y="105" class="l" text-anchor="middle">9.42</text><text x="566.4" y="105" class="l" text-anchor="middle">14.58</text><text x="203.2" y="186" class="l" text-anchor="middle">10.04</text><text x="516.8" y="186" class="l" text-anchor="middle">13.96</text><text x="360" y="78" text-anchor="middle" class="l">중심 12</text><text x="360" y="313" text-anchor="middle" class="l">95% 구간의 자연수: 11, 12, 13</text></svg>