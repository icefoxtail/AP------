<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="330" viewBox="0 0 720 330" role="img" aria-labelledby="q12-title q12-desc">
<title id="q12-title">확률밀도함수에서 1 이상인 확률</title><desc id="q12-desc">전체 함수 그래프의 꼭짓점은 (0,1/2),(3,0),(4,1/2). x=1에서 높이는 1/3이고 1부터 4까지 넓이를 음영으로 나타낸다.</desc>
<style>.h{font:bold 22px Arial,'Noto Sans KR',sans-serif;fill:#203747}.label{font:19px Arial,'Noto Sans KR',sans-serif;fill:#243849}</style>
<rect width="720" height="330" fill="white"/><text x="32" y="41" class="h">전체 넓이는 1, 1 이상인 부분만 구한다</text>
<polygon points="240,249 240,149 480,249 600,99 600,249" fill="#c1dce8" data-a="0.5" data-start-x="1" data-probability="0.5833333333"/>
<line x1="115" y1="249" x2="668" y2="249" stroke="#344b5b" stroke-width="1.6"/>
<polyline points="120,99 480,249 600,99" fill="none" stroke="#293d4b" stroke-width="2.7"/>
<line x1="120" y1="99" x2="120" y2="249" stroke="#597485" stroke-width="1.6"/>
<line x1="600" y1="99" x2="600" y2="249" stroke="#597485" stroke-width="1.3" stroke-dasharray="5 4"/>
<line x1="240" y1="149" x2="240" y2="249" stroke="#597485" stroke-width="1.3" stroke-dasharray="5 4"/>
<text x="120" y="278" text-anchor="middle" class="label">0</text>
<text x="240" y="278" text-anchor="middle" class="label">1</text>
<text x="480" y="278" text-anchor="middle" class="label">3</text>
<text x="600" y="278" text-anchor="middle" class="label">4</text>
<text x="105" y="90" text-anchor="end" class="label">a</text><text x="236" y="136" text-anchor="end" class="label">2a/3</text>
<text x="385" y="317" text-anchor="middle" class="label">음영 넓이 = 7/12</text>
</svg>