<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" width="640" height="280" role="img" aria-labelledby="title desc" data-scale-policy="SCHEMATIC_ALLOWED">
  <title id="title">원과 직선의 접선 조건</title>
  <desc id="desc">중심 O(0,0)의 원과 직선 3x−y−10=0이 접하고 수선의 발 H(3,−1)까지의 거리 OH가 반지름 √10임을 나타낸 그림</desc>
  <rect width="640" height="280" fill="#ffffff"/>
  <text x="320" y="28" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="19" font-weight="700" fill="#1e3a5f">직선과 원이 접할 때: r = 중심에서 직선까지의 거리</text>
  <rect x="18" y="44" width="350" height="218" rx="8" fill="#f8fafc" stroke="#dbe3ef"/>
  <g stroke="#e2e8f0" stroke-width="1">
    <line x1="70" y1="60" x2="70" y2="260"/><line x1="120" y1="60" x2="120" y2="260"/><line x1="220" y1="60" x2="220" y2="260"/><line x1="270" y1="60" x2="270" y2="260"/><line x1="320" y1="60" x2="320" y2="260"/>
    <line x1="42" y1="103" x2="350" y2="103"/><line x1="42" y1="128" x2="350" y2="128"/><line x1="42" y1="153" x2="350" y2="153"/><line x1="42" y1="203" x2="350" y2="203"/><line x1="42" y1="228" x2="350" y2="228"/><line x1="42" y1="253" x2="350" y2="253"/>
  </g>
  <line x1="40" y1="178" x2="350" y2="178" stroke="#0f172a" stroke-width="1.6"/>
  <line x1="170" y1="58" x2="170" y2="260" stroke="#0f172a" stroke-width="1.6"/>
  <text x="338" y="173" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="13" fill="#334155">x</text>
  <text x="176" y="70" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="13" fill="#334155">y</text>
  <circle cx="170" cy="178" r="79.057" fill="#dbeafe" fill-opacity=".72" stroke="#2563eb" stroke-width="2.6"/>
  <line x1="232.5" y1="240.5" x2="280" y2="98" stroke="#dc2626" stroke-width="2.5"/>
  <line x1="170" y1="178" x2="245" y2="203" stroke="#b91c1c" stroke-width="2.3" stroke-dasharray="7 5"/>
  <circle cx="170" cy="178" r="4.5" fill="#1d4ed8"/>
  <circle cx="245" cy="203" r="4.5" fill="#b91c1c"/>
  <text x="178" y="170" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="15" font-weight="700" fill="#1d4ed8">O(0,0)</text>
  <text x="251" y="221" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="15" font-weight="700" fill="#b91c1c">H(3,−1)</text>
  <text x="190" y="147" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="15" fill="#b91c1c">OH = r = √10</text>
  <text x="283" y="92" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14" font-weight="700" fill="#991b1b">3x−y−10=0</text>
  <rect x="390" y="44" width="232" height="218" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="408" y="76" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="17" font-weight="700" fill="#1e3a5f">접점 조건</text>
  <text x="408" y="108" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="15">직선: 3x − y − 10 = 0</text>
  <text x="408" y="140" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="15">수선의 발: H(3,−1)</text>
  <text x="408" y="172" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="15">OH = |−10|/√10 = √10</text>
  <line x1="408" y1="185" x2="604" y2="185" stroke="#cbd5e1"/>
  <text x="408" y="214" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="16">접하면 r = OH</text>
  <text x="408" y="244" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="17" font-weight="700" fill="#1d4ed8">r = √10  →  ②</text>
</svg>
