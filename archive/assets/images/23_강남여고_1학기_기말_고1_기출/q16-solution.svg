<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="720" height="360" role="img" data-fact-hash="115b1ea318e680472b5dd21e69d1d2cf46b5244182c2e9002ca2cef5dff9d273" data-scale-policy="EQUAL_SCALE_REQUIRED" aria-labelledby="svg-title-e541420a99" aria-describedby="svg-desc-e541420a99"><title id="svg-title-e541420a99">좌표 변환식과 점의 대응</title><desc id="svg-desc-e541420a99">그림에 y; x; P1; (1, 2); P2; (0, -1)를 표시한다. 풀이에서는 새 도형의 식 f(-y,x+2)=0은 원래 도형의 점 (X,Y)가 새 좌표 (x,y)에서 X=-y, Y=x+2로 대응함을 뜻한다. 원래 점 P(1,2)가 새 점 (a,b)로 옮겨졌다고 하자. 그러면 -b=1, a+2=2이어야 한다. 따라서 b=-1, a=0이다. 즉 옮겨진 점은 (0,-1)이다. 따라서 정답은 ③이다.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8z" fill="#2563eb"/></marker></defs><rect width="720" height="360" rx="18" fill="#f8fafc"/><text x="32" y="38" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#0f172a">도형의 이동 해설 도형 · 문항 16</text><text x="32" y="64" font-family="Arial,sans-serif" font-size="12" fill="#475569">풀이에 필요한 점·도형·관계를 좌표평면에 표시한 해설 자료</text><rect x="42" y="78" width="636" height="256" rx="14" fill="#ffffff" stroke="#cbd5e1"/><line x1="254.62" y1="92.0" x2="254.62" y2="316.0" stroke="#e2e8f0" stroke-width="1"/><line x1="284.73" y1="92.0" x2="284.73" y2="316.0" stroke="#e2e8f0" stroke-width="1"/><line x1="314.84" y1="92.0" x2="314.84" y2="316.0" stroke="#e2e8f0" stroke-width="1"/><line x1="344.95" y1="92.0" x2="344.95" y2="316.0" stroke="#e2e8f0" stroke-width="1"/><line x1="375.05" y1="92.0" x2="375.05" y2="316.0" stroke="#e2e8f0" stroke-width="1"/><line x1="405.16" y1="92.0" x2="405.16" y2="316.0" stroke="#e2e8f0" stroke-width="1"/><line x1="435.27" y1="92.0" x2="435.27" y2="316.0" stroke="#e2e8f0" stroke-width="1"/><line x1="465.38" y1="92.0" x2="465.38" y2="316.0" stroke="#e2e8f0" stroke-width="1"/><line x1="248.0" y1="309.38" x2="472.0" y2="309.38" stroke="#e2e8f0" stroke-width="1"/><line x1="248.0" y1="279.27" x2="472.0" y2="279.27" stroke="#e2e8f0" stroke-width="1"/><line x1="248.0" y1="249.16" x2="472.0" y2="249.16" stroke="#e2e8f0" stroke-width="1"/><line x1="248.0" y1="219.05" x2="472.0" y2="219.05" stroke="#e2e8f0" stroke-width="1"/><line x1="248.0" y1="188.95" x2="472.0" y2="188.95" stroke="#e2e8f0" stroke-width="1"/><line x1="248.0" y1="158.84" x2="472.0" y2="158.84" stroke="#e2e8f0" stroke-width="1"/><line x1="248.0" y1="128.73" x2="472.0" y2="128.73" stroke="#e2e8f0" stroke-width="1"/><line x1="248.0" y1="98.62" x2="472.0" y2="98.62" stroke="#e2e8f0" stroke-width="1"/><line x1="344.95" y1="92.0" x2="344.95" y2="316.0" stroke="#334155" stroke-width="1.8"/><text x="352.95" y="107.00" font-size="12" fill="#334155">y</text><line x1="248.0" y1="219.05" x2="472.0" y2="219.05" stroke="#334155" stroke-width="1.8"/><text x="464.00" y="211.05" text-anchor="end" font-size="12" fill="#334155">x</text><line data-geometry="segment" x1="375.05" y1="158.84" x2="344.95" y2="249.16" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><g data-point-label="P1" data-point-x="1" data-point-y="2" data-point-provenance="legacy-reviewed-fact"><circle cx="375.05" cy="158.84" r="5.5" fill="#ef4444" stroke="#ffffff" stroke-width="2"/><text x="384.05" y="150.84" font-size="12" font-weight="700" fill="#b91c1c">P1</text><text x="384.05" y="174.84" font-size="10" fill="#475569">(1, 2)</text></g><g data-point-label="P2" data-point-x="0" data-point-y="-1" data-point-provenance="legacy-reviewed-fact"><circle cx="344.95" cy="249.16" r="5.5" fill="#ef4444" stroke="#ffffff" stroke-width="2"/><text x="353.95" y="241.16" font-size="12" font-weight="700" fill="#b91c1c">P2</text><text x="353.95" y="265.16" font-size="10" fill="#475569">(0, -1)</text></g></svg>