<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" width="640" height="280" role="img" aria-labelledby="title desc">
  <title id="title">외부점에서 원에 그은 접선</title>
  <desc id="desc">중심 C(1,−2), 반지름 √5인 원에 외부점 A(−2,2)에서 접선 AT를 그어 CT와 AT가 수직인 직각삼각형을 나타낸 그림</desc>
  <rect width="640" height="280" fill="#ffffff"/>
  <text x="320" y="28" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="20" font-weight="700" fill="#1e3a5f">외부의 점에서 원에 그은 접선의 길이</text>
  <rect x="18" y="44" width="350" height="218" rx="8" fill="#f8fafc" stroke="#dbe3ef"/>
  <g stroke="#e2e8f0" stroke-width="1">
    <line x1="62" y1="60" x2="62" y2="260"/><line x1="84" y1="60" x2="84" y2="260"/><line x1="106" y1="60" x2="106" y2="260"/><line x1="128" y1="60" x2="128" y2="260"/><line x1="172" y1="60" x2="172" y2="260"/><line x1="194" y1="60" x2="194" y2="260"/><line x1="216" y1="60" x2="216" y2="260"/><line x1="238" y1="60" x2="238" y2="260"/><line x1="260" y1="60" x2="260" y2="260"/><line x1="282" y1="60" x2="282" y2="260"/><line x1="304" y1="60" x2="304" y2="260"/><line x1="326" y1="60" x2="326" y2="260"/><line x1="348" y1="60" x2="348" y2="260"/>
    <line x1="42" y1="89" x2="350" y2="89"/><line x1="42" y1="111" x2="350" y2="111"/><line x1="42" y1="133" x2="350" y2="133"/><line x1="42" y1="177" x2="350" y2="177"/><line x1="42" y1="199" x2="350" y2="199"/><line x1="42" y1="221" x2="350" y2="221"/><line x1="42" y1="243" x2="350" y2="243"/>
  </g>
  <line x1="40" y1="155" x2="350" y2="155" stroke="#0f172a" stroke-width="1.6"/>
  <line x1="150" y1="58" x2="150" y2="260" stroke="#0f172a" stroke-width="1.6"/>
  <text x="338" y="150" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="13" fill="#334155">x</text>
  <text x="156" y="70" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="13" fill="#334155">y</text>
  <circle cx="172" cy="199" r="49.193" fill="#dbeafe" fill-opacity=".72" stroke="#2563eb" stroke-width="2.6"/>
  <line x1="70" y1="93" x2="250" y2="183" stroke="#f97316" stroke-width="2.5"/>
  <line x1="172" y1="199" x2="194" y2="155" stroke="#b91c1c" stroke-width="2.4" stroke-dasharray="7 5"/>
  <polyline points="187,169 195,173 199,165" fill="none" stroke="#b91c1c" stroke-width="1.8"/>
  <circle cx="106" cy="111" r="4.5" fill="#f97316"/>
  <circle cx="172" cy="199" r="4.5" fill="#1d4ed8"/>
  <circle cx="194" cy="155" r="4.5" fill="#b91c1c"/>
  <text x="68" y="103" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="15" font-weight="700" fill="#c2410c">A(−2,2)</text>
  <text x="181" y="219" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="15" font-weight="700" fill="#1d4ed8">C(1,−2)</text>
  <text x="202" y="147" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="15" font-weight="700" fill="#991b1b">T(2,0)</text>
  <text x="177" y="184" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14" fill="#991b1b">CT=√5</text>
  <text x="116" y="143" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14" fill="#c2410c">AT=2√5</text>
  <text x="252" y="178" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="13" fill="#991b1b">CT ⟂ AT</text>
  <rect x="390" y="44" width="232" height="218" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="408" y="76" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="18" font-weight="700" fill="#1e3a5f">직각삼각형 ACT</text>
  <text x="408" y="108" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="15">(x−1)²+(y+2)²=5</text>
  <text x="408" y="138" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="15">C(1,−2),  r=√5</text>
  <text x="408" y="168" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="15">AC=5,  CT=√5</text>
  <text x="408" y="198" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="15">AT²=25−5=20</text>
  <text x="408" y="230" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="17" font-weight="700" fill="#1d4ed8">AT=2√5  →  ②</text>
</svg>
