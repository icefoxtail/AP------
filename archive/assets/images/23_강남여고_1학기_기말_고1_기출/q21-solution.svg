  <rect x="390" y="44" width="232" height="238" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="408" y="76" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="17" font-weight="700" fill="#1e3a5f">중심 후보 찾기</text>
  <text x="408" y="103" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14">∠APB=45°  →  ∠ACB=90°</text>
  <text x="408" y="131" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14">AB=6√5,  R=3√10</text>
  <text x="408" y="159" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14">M(2,−3),  AB ⟂ CM</text>
  <text x="408" y="187" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14">CM²=90−45=45</text>
  <text x="408" y="213" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14">y+3=−1/2(x−2)</text>
  <line x1="408" y1="223" x2="604" y2="223" stroke="#cbd5e1"/>
  <text x="408" y="244" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14">x=−4, 8  →  C₁, C₂</text>
  <text x="408" y="265" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14">OC₁=4,  OC₂=10</text>
  <text x="408" y="278" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="15" font-weight="700" fill="#1d4ed8">최댓값 10  →  ④</text>
