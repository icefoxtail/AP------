<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" width="640" height="280" role="img" aria-labelledby="title desc" data-scale-policy="SCHEMATIC_ALLOWED">
  <title id="title">원과 직선이 만나지 않는 조건</title>
  <desc id="desc">중심 O(0,0), 반지름 √2인 원과 경계 직선 x+y=2, x+y=−2가 접하는 모습을 나타낸 그림</desc>
  <rect width="640" height="280" fill="#ffffff"/>
  <text x="320" y="28" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="20" font-weight="700" fill="#1e3a5f">교점이 없는 직선은 접선의 바깥쪽에 있습니다</text>
  <rect x="18" y="44" width="350" height="218" rx="8" fill="#f8fafc" stroke="#dbe3ef"/>
  <g stroke="#e2e8f0" stroke-width="1">
    <line x1="95" y1="60" x2="95" y2="260"/><line x1="120" y1="60" x2="120" y2="260"/><line x1="145" y1="60" x2="145" y2="260"/><line x1="170" y1="60" x2="170" y2="260"/><line x1="220" y1="60" x2="220" y2="260"/><line x1="245" y1="60" x2="245" y2="260"/><line x1="270" y1="60" x2="270" y2="260"/><line x1="295" y1="60" x2="295" y2="260"/><line x1="320" y1="60" x2="320" y2="260"/>
    <line x1="42" y1="85" x2="350" y2="85"/><line x1="42" y1="110" x2="350" y2="110"/><line x1="42" y1="135" x2="350" y2="135"/><line x1="42" y1="185" x2="350" y2="185"/><line x1="42" y1="210" x2="350" y2="210"/><line x1="42" y1="235" x2="350" y2="235"/>
  </g>
  <line x1="40" y1="160" x2="350" y2="160" stroke="#0f172a" stroke-width="1.6"/>
  <line x1="195" y1="58" x2="195" y2="260" stroke="#0f172a" stroke-width="1.6"/>
  <text x="338" y="155" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="13" fill="#334155">x</text>
  <text x="201" y="70" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="13" fill="#334155">y</text>
  <circle cx="195" cy="160" r="35.355" fill="#dbeafe" fill-opacity=".72" stroke="#2563eb" stroke-width="2.6"/>
  <line x1="145" y1="60" x2="295" y2="210" stroke="#f97316" stroke-width="2.4"/>
  <line x1="95" y1="110" x2="245" y2="260" stroke="#f97316" stroke-width="2.4"/>
  <circle cx="195" cy="160" r="4.5" fill="#1d4ed8"/>
  <circle cx="220" cy="135" r="4" fill="#f97316"/>
  <circle cx="170" cy="185" r="4" fill="#f97316"/>
  <text x="203" y="151" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="15" font-weight="700" fill="#1d4ed8">O(0,0)</text>
  <text x="276" y="204" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14" font-weight="700" fill="#c2410c">k=2</text>
  <text x="99" y="104" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14" font-weight="700" fill="#c2410c">k=−2</text>
  <text x="302" y="78" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14" fill="#166534">k&gt;2</text>
  <text x="52" y="250" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14" fill="#166534">k&lt;−2</text>
  <rect x="390" y="44" width="232" height="218" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="408" y="76" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="18" font-weight="700" fill="#1e3a5f">거리 비교</text>
  <text x="408" y="108" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="15">중심 O(0,0), r=√2</text>
  <text x="408" y="140" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="15">d = |k|/√2</text>
  <text x="408" y="172" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="15">d=r  ⇔  |k|=2</text>
  <text x="408" y="201" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="15">|k|=2: 접함</text>
  <text x="408" y="229" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="15">교점 없음 ⇔ |k|&gt;2</text>
  <text x="408" y="250" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="15" font-weight="700" fill="#1d4ed8">k&lt;−2 또는 k&gt;2  →  ⑤</text>
</svg>
