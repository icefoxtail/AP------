<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 400" width="420" height="400" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">각 C와 각 D가 직각이고 변 AD와 변 BC가 평행한 사다리꼴 ABCD를 그린 그림이다. AD는 7 cm, BC는 12 cm, CD는 12 cm로 주어져 있다.</title><desc id="visual-desc">오른쪽 변 CD가 세로로 선 사다리꼴이 보인다. 위쪽의 짧은 변 AD에 7, 아래쪽의 긴 변 BC에 12, 오른쪽 세로변 CD에 12가 적혀 있고, 변 AD와 BC에 평행 표시가 있다. 각 C와 각 D에는 직각 표시가 있다.</desc><rect width="420" height="400" fill="#fff"/><g data-layer="30"><line id="sAB" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="181.244735441" y1="74.977110614" x2="77.058994286" y2="325.022889386"/></g><g data-layer="30"><line id="sBC" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="77.058994286" y1="325.022889386" x2="327.104773059" y2="325.022889386"/></g><g data-layer="30"><line id="sCD" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="327.104773059" y1="325.022889386" x2="327.104773059" y2="74.977110614"/></g><g data-layer="30"><line id="sDA" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="327.104773059" y1="74.977110614" x2="181.244735441" y2="74.977110614"/></g><g data-layer="52"><line id="d1-ext-from" data-role="indicator" stroke="#111" stroke-width="0.8" fill="none" data-mark="dimension" data-mark-id="d1" data-mark-part="ext-from" x1="327.104773059" y1="70.977110614" x2="327.10477