<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 360" width="420" height="360" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">가로의 길이가 10 cm, 세로의 길이가 8 cm인 직사각형 모양의 종이 ABCD에서 꼭짓점 D가 변 BC 위의 점 P에 닿도록 접은 그림이다. 접는 선이 변 CD와 만나는 점은 Q이다.</title><desc id="visual-desc">직사각형 ABCD의 아래쪽 변 BC 위에 점 P가 있고, 오른쪽 변 CD 위에 점 Q가 있다. D가 P에 닿도록 접힌 모양이 되도록 선분 AP, PQ, AQ가 그려져 있고, 직사각형의 가로변에 10, 세로변에 8이 적혀 있다.</desc><rect width="420" height="360" fill="#fff"/><g data-layer="30"><line id="sAB" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="68.419977799" y1="49.652050398" x2="68.419977799" y2="285.012722373"/></g><g data-layer="30"><line id="sBP" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="68.419977799" y1="285.012722373" x2="244.940481781" y2="285.012722373"/></g><g data-layer="30"><line id="sPC" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="244.940481781" y1="285.012722373" x2="362.620817768" y2="285.012722373"/></g><g data-layer="30"><line id="sCQ" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="362.620817768" y1="285.012722373" x2="362.620817768" y2="196.752470383"/></g><g data-layer="30"><line id="sQD" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="362.620817768" y1="196.752470383" x2="362.620817768" y2="49.652050398"/></g><g data-layer="30"><line id="sDA