<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 320" width="420" height="320" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">세 평행선과 두 직선이 만나 생기는 선분의 길이를 나타낸 그림이다.</title><desc id="visual-desc">서로 평행한 세 직선과 이를 지나는 두 직선이 있다. 첫 번째 직선에서 가장 위 직선과 아래 직선 사이의 길이는 12, 가운데 직선과 아래 직선 사이의 길이는 4이다. 두 번째 직선에서 위쪽 두 평행선 사이의 길이는 a, 아래쪽 두 평행선 사이의 길이는 6이다.</desc><rect width="420" height="320" fill="#fff"/><g data-layer="30"><line id="sLaLb" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="132.226443769" y1="58.556231003" x2="368.928571429" y2="58.556231003"/></g><g data-layer="30"><line id="sMaMb" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="84.886018237" y1="193.814589666" x2="368.928571429" y2="193.814589666"/></g><g data-layer="30"><line id="sNaNb" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="51.071428571" y1="261.443768997" x2="368.928571429" y2="261.443768997"/></g><g data-layer="30"><line id="sP1Q1" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="145.752279635" y1="58.556231003" x2="91.64893617" y2="193.814589666"/></g><g data-layer="30"><line id="sQ1R1" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="91.64893617" y1="193.814589666" x2="64.597264438" y2="261.443768997"/></g><g data-layer="30"><line id="sP2Q2" data-role="line" stroke="#111" stroke-