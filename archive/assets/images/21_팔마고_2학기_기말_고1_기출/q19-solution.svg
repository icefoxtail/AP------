<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" role="img" aria-labelledby="title desc" width="760" height="300"><title id="title">문항 19 해설: X의 분할</title><desc id="desc">X의 원소를 A와 B의 서로소 부분으로 나누고 A의 크기 조건을 적용하는 트리</desc><style>text{font-family:"Noto Sans KR",Arial,sans-serif;fill:#172033}.m{fill:#56657a}</style><rect width="760" height="300" rx="18" fill="#f8fafc"/><text x="28" y="38" font-size="22" font-weight="700">X를 A와 B로 분할하기</text><text x="28" y="66" class="m" font-size="15">A를 고르면 B=X−A로 자동 결정된다.</text><rect x="28" y="88" width="704" height="142" rx="14" fill="#fff" stroke="#cbd5e1"/><rect x="60" y="132" width="130" height="54" rx="10" fill="#ede9fe" stroke="#7c3aed"/><text x="125" y="164" text-anchor="middle" font-size="18">X (6개)</text><path d="M190 159H250" stroke="#64748b" stroke-width="2"/><path d="M240 151l12 8-12 8" fill="none" stroke="#64748b" stroke-width="2"/><g fill="#dbeafe" stroke="#2563eb"><rect x="260" y="112" width="86" height="44" rx="9"/><rect x="360" y="112" width="86" height="44" rx="9"/><rect x="460" y="112" width="86" height="44" rx="9"/><rect x="560" y="112" width="86" height="44" rx="9"/></g><g text-anchor="middle" font-size="16"><text x="303" y="140">A 2개</text><text x="403" y="140">A 3개</text><text x="503" y="140">A 4개</text><text x="603" y="140">A 5개</text></g><g text-anchor="middle" font-size="14" class="m"><text x="303" y="198">B=X−A</text><text x="403" y="198">B=X−A</text><text x="503" y="198">B=X−A</text><text x="603" y="198">B=X−A</text></g><text x="28" y="268" class="m" font-size="14">A와 B가 모두 공집합이 아니므로 양 끝 크기는 제외된다.</text></svg>
