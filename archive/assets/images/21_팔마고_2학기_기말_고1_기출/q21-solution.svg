<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="680" height="460" viewBox="0 0 680 460" role="img" aria-labelledby="title desc">
  <title id="title">유리함수와 두 경계 직선 그래프</title>
  <desc id="desc">1≤x≤3에서 F(x)=(x−1)/(x+1)의 그래프와 아래 직선 y=−x+1, 위 직선 y=−x/6+1을 표시한다. F는 (1,0)과 (3,1/2)를 지난다.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#475569"/></marker>
  </defs>
  <rect width="680" height="460" fill="#ffffff"/>
  <rect x="235" y="45" width="290" height="305" fill="#f8fafc"/>
  <text x="28" y="29" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#0f172a">1≤x≤3에서 함수와 경계 직선</text>
  <text x="28" y="53" font-family="system-ui, sans-serif" font-size="14" fill="#334155">F(x) = (x−1)/(x+1) = 1−2/(x+1)</text>
  <line x1="235" y1="106" x2="525" y2="106" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="380" y1="45" x2="380" y2="350" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="235" y1="45" x2="235" y2="350" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4 5"/>
  <line x1="525" y1="45" x2="525" y2="350" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4 5"/>
  <line x1="90" y1="150" x2="585" y2="150" stroke="#475569" stroke-width="1.7" marker-end="url(#arrow)"/>
  <line x1="90" y1="350" x2="90" y2="42" stroke="#475569" stroke-width="1.7" marker-end="url(#arrow)"/>
  <text x="590" y="155" font-family="system-ui, sans-serif" font-size="15" fill="#334155">x</text>
  <text x="82" y="38" font-family="system-ui, sans-serif" font-size="15" fill="#334155">y</text>
  <text x="73" y="155" font-family="system-ui, sans-serif" font-size="12" fill="#475569">0</text>
  <text x="51" y="110" font-family="system-ui, sans-serif" font-size="12" fill="#475569">1/2</text>
  <line x1="86" y1="106" x2="94" y2="106" stroke="#475569" stroke-width="1.4"/>
  <line x1="235" y1="146" x2="235" y2="154" stroke="#475569" stroke-width="1.3"/>
  <line x1="380" y1="146" x2="380" y2="154" stroke="#475569" stroke-width="1.3"/>
  <line x1="525" y1="146" x2="525" y2="154" stroke="#475569" stroke-width="1.3"/>
  <text x="231" y="174" font-family="system-ui, sans-serif" font-size="13" fill="#334155">1</text>
  <text x="376" y="174" font-family="system-ui, sans-serif" font-size="13" fill="#334155">2</text>
  <text x="521" y="174" font-family="system-ui, sans-serif" font-size="13" fill="#334155">3</text>
  <path d="M235 150 L525 326" fill="none" stroke="#dc2626" stroke-width="2.7" stroke-dasharray="9 6"/>
  <path d="M235 76.667 L525 106" fill="none" stroke="#16a34a" stroke-width="2.7" stroke-dasharray="9 6"/>
  <path d="M235 150 L271.25 140.222 L307.5 132.4 L343.75 126 L380 120.667 L416.25 116.154 L452.5 112.286 L488.75 108.933 L525 106" fill="none" stroke="#2563eb" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="235" cy="150" r="5.2" fill="#2563eb" stroke="#ffffff" stroke-width="1.5"/>
  <circle cx="525" cy="106" r="5.2" fill="#2563eb" stroke="#ffffff" stroke-width="1.5"/>
  <rect x="347" y="65" width="195" height="24" rx="4" fill="#ffffff" fill-opacity="0.92"/>
  <text x="353" y="82" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#1d4ed8">F(x)=(x−1)/(x+1)</text>
  <rect x="124" y="61" width="119" height="22" rx="4" fill="#ffffff" fill-opacity="0.94"/>
  <text x="128" y="77" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#15803d">y=−x/6+1</text>
  <rect x="390" y="278" width="105" height="22" rx="4" fill="#ffffff" fill-opacity="0.94"/>
  <text x="394" y="294" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#b91c1c">y=−x+1</text>
  <text x="240" y="142" font-family="system-ui, sans-serif" font-size="12" fill="#0f172a">(1,0)</text>
  <text x="532" y="101" font-family="system-ui, sans-serif" font-size="12" fill="#0f172a">(3,1/2)</text>
  <line x1="30" y1="395" x2="65" y2="395" stroke="#2563eb" stroke-width="3.4"/>
  <text x="72" y="400" font-family="system-ui, sans-serif" font-size="12" fill="#334155">유리함수</text>
  <line x1="164" y1="395" x2="199" y2="395" stroke="#dc2626" stroke-width="2.7" stroke-dasharray="9 6"/>
  <text x="206" y="400" font-family="system-ui, sans-serif" font-size="12" fill="#334155">아래 경계</text>
  <line x1="302" y1="395" x2="337" y2="395" stroke="#16a34a" stroke-width="2.7" stroke-dasharray="9 6"/>
  <text x="344" y="400" font-family="system-ui, sans-serif" font-size="12" fill="#334155">위 경계</text>
  <text x="472" y="400" font-family="system-ui, sans-serif" font-size="12" fill="#475569">1≤x≤3</text>
</svg>
