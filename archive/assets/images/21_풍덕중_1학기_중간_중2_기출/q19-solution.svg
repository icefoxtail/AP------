<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 384 320" width="384" height="320" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">예: 반지름이 같은 원 위에 세 꼭짓점이 있는 삼각형으로 그렸다. 외심 O에서 세 꼭짓점까지의 거리가 같아 OA=OC=r이다. △AOC의 둘레가 20이고 AC=8이므로 2r+8=20, 2r=12에서 r=6이다. 따라서 반지름은 6cm이고 답은 ⑤이다.</title><desc id="visual-desc">삼각형 ABC와 세 꼭짓점을 지나는 원이 있고 외심 O에서 세 꼭짓점으로 길이가 같은 선분이 그어져 있으며 이 선분에 r, 변 CA에 8이 적혀 있다.</desc><rect width="384" height="320" fill="#fff"/><g data-layer="30"><line id="AB" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="122.096952685" y1="243.644239429" x2="192" y2="60.635685641"/></g><g data-layer="30"><line id="BC" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="192" y1="60.635685641" x2="261.903047315" y2="243.644239429"/></g><g data-layer="30"><line id="CA" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="261.903047315" y1="243.644239429" x2="122.096952685" y2="243.644239429"/></g><g data-layer="30"><line id="OA" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="192" y1="165.490256614" x2="122.096952685" y2="243.644239429"/></g><g data-layer="30"><line id="OB" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="192" y1="165.490256614" x2="192" y2="60.635685641"/></g><g data-layer="30"><line id="OC" data-role="line" stroke="#111" stroke-width="1.6" fill="no