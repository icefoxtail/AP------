<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 384 320" width="384" height="320" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">윗변과 아랫변이 평행한 사다리꼴을 높이가 같은 세 단으로 나눈 서랍장 앞면 그림이다. 가장 윗변의 길이는 40 cm, 가장 아랫변의 길이는 70 cm이고 두 가로 경계선이 그려져 있다.</title><desc id="visual-desc">아래로 갈수록 넓어지는 사다리꼴이 두 개의 가로선으로 높이가 같은 세 단으로 나뉘어 있다. 가장 위의 짧은 변 옆에 40 cm, 가장 아래의 긴 변 옆에 70 cm가 적혀 있고, 양옆의 세로 조각들에는 같은 길이 표시가 있다.</desc><rect width="384" height="320" fill="#fff"/><g data-layer="30"><line id="sAB" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="49.142857143" y1="233.469387755" x2="334.857142857" y2="233.469387755"/></g><g data-layer="30"><line id="sDC" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="110.367346939" y1="86.530612245" x2="273.632653061" y2="86.530612245"/></g><g data-layer="30"><line id="sAG" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="49.142857143" y1="233.469387755" x2="69.551020408" y2="184.489795918"/></g><g data-layer="30"><line id="sGE" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="69.551020408" y1="184.489795918" x2="89.959183673" y2="135.510204082"/></g><g data-layer="30"><line id="sED" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="89.959183673" y1="135.510204082" x2="110.367346939" y2="86.530612245"/></g><g data-layer="30"><line id="sBH" dat