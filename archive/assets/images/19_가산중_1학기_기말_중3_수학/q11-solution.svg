<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 481" width="700" height="481" role="img" aria-labelledby="title desc"><title id="title">두 근으로 계수를 정한 뒤 읽는 꼭짓점</title><desc id="desc">파란 포물선은 x축에서 0과 2를 지난다. 그 사이 가운데에 놓인 주황 꼭짓점까지 점선으로 대칭축을 이어 그렸다.</desc><rect width="700" height="481" fill="white" /><line x1="52.0000" y1="299.3626" x2="642.0000" y2="299.3626" stroke="#586574" stroke-width="1.65" stroke-linecap="round" /><polygon points="642.0000,299.3626 629.0000,294.3626 629.0000,304.3626" fill="#586574" /><text x="659.0000" y="291.3626" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#586574" text-anchor="middle">x</text><line x1="220.3906" y1="416.0000" x2="220.3906" y2="50.0000" stroke="#586574" stroke-width="1.65" stroke-linecap="round" /><polygon points="220.3906,50.0000 215.3906,63.0000 225.3906,63.0000" fill="#586574" /><text x="236.3906" y="56.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#586574" text-anchor="middle">y</text><circle cx="220.39055793991417" cy="299.3626373626374" r="4.6" fill="#28364b" /><text x="205.3906" y="326.3626" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">O</text><path d="M 91.2489 51.5766 Q 347.0000 708.0278 602.7511 51.5766" stroke="#205d9c" stroke-width="5.8" stroke-linecap="round" fill="none" /><line x1="347.0000" y1="379.8022" x2="347.0000" y2="299.3626" stroke="#586574" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="7 5" /><circle cx="347.0" cy="379.8021978021978" r="4.6" fill="#aa5411" /><circle cx="473.6094420600858" cy="299.3626373626374" r="4.6" fill="#205d9c" /><text x="473.6094" y="328.3626" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#205d9c" text-anchor="middle">2</text><text x="359.0000" y="412.8022" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#aa5411" text-anchor="middle">꼭짓점</text><text x="480.0000" y="63.0000" font-size="30" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#205d9c" text-anchor="middle">y = 2x² − 4x</text></svg>
