<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 681 514" width="681" height="514" role="img" aria-labelledby="title desc"><title id="title">넓이가 늘어난 꽃밭의 세 부분</title><desc id="desc">기존 꽃밭은 가로 7 m, 세로 5 m인 파랑 직사각형이다. 오른쪽과 위쪽의 주황 띠, 모서리의 작은 초록 정사각형이 새로 늘어난 부분이다.</desc><rect width="681" height="514" fill="white" /><rect x="133" y="169" width="315" height="225" fill="#e1eefb" stroke="#586574" stroke-width="3" /><rect x="133" y="79" width="315" height="90" fill="#fae6ce" stroke="#586574" stroke-width="3" /><rect x="448" y="169" width="90" height="225" fill="#fae6ce" stroke="#586574" stroke-width="3" /><rect x="448" y="79" width="90" height="90" fill="#e5f3e4" stroke="#586574" stroke-width="3" /><text x="290.5000" y="292.5000" font-size="31" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#205d9c" text-anchor="middle">처음 꽃밭</text><text x="290.5000" y="333.9000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#205d9c" text-anchor="middle">35 m²</text><line x1="133.0000" y1="420.0000" x2="448.0000" y2="420.0000" stroke="#205d9c" stroke-width="1.65" stroke-linecap="round" /><line x1="133.0000" y1="415.0000" x2="133.0000" y2="425.0000" stroke="#205d9c" stroke-width="1.65" stroke-linecap="round" /><line x1="448.0000" y1="415.0000" x2="448.0000" y2="425.0000" stroke="#205d9c" stroke-width="1.65" stroke-linecap="round" /><text x="290.5000" y="450.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#205d9c" text-anchor="middle">7 m</text><line x1="448.0000" y1="420.0000" x2="538.0000" y2="420.0000" stroke="#aa5411" stroke-width="1.65" stroke-linecap="round" /><line x1="448.0000" y1="415.0000" x2="448.0000" y2="425.0000" stroke="#aa5411" stroke-width="1.65" stroke-linecap="round" /><line x1="538.0000" y1="415.0000" x2="538.0000" y2="425.0000" stroke="#aa5411" stroke-width="1.65" stroke-linecap="round" /><text x="493.0000" y="450.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#aa5411" text-anchor="middle">x m</text><line x1="106.0000" y1="169.0000" x2="106.0000" y2="394.0000" stroke="#205d9c" stroke-width="1.65" stroke-linecap="round" /><line x1="111.0000" y1="169.0000" x2="101.0000" y2="169.0000" stroke="#205d9c" stroke-width="1.65" stroke-linecap="round" /><line x1="111.0000" y1="394.0000" x2="101.0000" y2="394.0000" stroke="#205d9c" stroke-width="1.65" stroke-linecap="round" /><text x="76.0000" y="289.5000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#205d9c" text-anchor="middle">5 m</text><line x1="106.0000" y1="79.0000" x2="106.0000" y2="169.0000" stroke="#aa5411" stroke-width="1.65" stroke-linecap="round" /><line x1="111.0000" y1="79.0000" x2="101.0000" y2="79.0000" stroke="#aa5411" stroke-width="1.65" stroke-linecap="round" /><line x1="111.0000" y1="169.0000" x2="101.0000" y2="169.0000" stroke="#aa5411" stroke-width="1.65" stroke-linecap="round" /><text x="76.0000" y="132.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#aa5411" text-anchor="middle">x m</text></svg>
