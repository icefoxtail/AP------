0" fill="#586574" text-anchor="middle">1</text><text x="501.4118" y="301.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#aa5411" text-anchor="middle">4</text><text x="274.5882" y="381.9149" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#aa5411" text-anchor="middle">꼭짓점</text><text x="551.4118" y="238.0851" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#205d9c" text-anchor="middle">y절편 6</text></svg>
