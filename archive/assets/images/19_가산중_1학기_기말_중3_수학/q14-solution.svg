<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 723 705" width="723" height="705" role="img" aria-labelledby="title desc"><title id="title">같은 높이로 자른 다섯 포물선의 가로 폭</title><desc id="desc">위에서 가장 좁은 두 모형을 같은 높이에서 자른다. 아래에는 다섯 포물선의 가로 폭을 같은 눈금과 각 번호로 나열했다.</desc><rect width="723" height="705" fill="white" /><line x1="85.0000" y1="127.8099" x2="635.0000" y2="127.8099" stroke="#586574" stroke-width="1.65" stroke-linecap="round" /><polygon points="635.0000,127.8099 622.0000,122.8099 622.0000,132.8099" fill="#586574" /><text x="652.0000" y="119.8099" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#586574" text-anchor="middle">x</text><line x1="360.0000" y1="395.0000" x2="360.0000" y2="77.0000" stroke="#586574" stroke-width="1.65" stroke-linecap="round" /><polygon points="360.0000,77.0000 355.0000,90.0000 365.0000,90.0000" fill="#586574" /><text x="376.0000" y="83.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#586574" text-anchor="middle">y</text><circle cx="360.0" cy="127.80991735537191" r="4.6" fill="#28364b" /><text x="345.0000" y="154.8099" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">O</text><path d="M 162.7193 370.4711 Q 360.0000 -114.8512 557.2807 370.4711" stroke="#205d9c" stroke-width="6.1" stroke-linecap="round" fill="none" stroke-dasharray="10 5" /><circle cx="241.4655172413793" cy="215.41322314049586" r="4.6" fill="#205d9c" /><circle cx="478.5344827586207" cy="215.41322314049586" r="4.6" fill="#205d9c" /><path d="M 183.5468 370.4711 Q 360.0000 -114.8512 536.4532 370.4711" stroke="#aa5411" stroke-width="6.1" stroke-linecap="round" fill="none" /><circle cx="253.97953554957894" cy="215.41322314049586" r="4.6" fill="#aa5411" /><circle cx="466.02046445042106" cy="215.41322314049586" r="4.6" fill="#aa5411" /><line x1="111.0776" y1="215.4132" x2="608.9224" y2="215.4132" stroke="#586574" stroke-width="1.7" stroke-linecap="round" stroke-dasharray="6 5" /><text x="609.2155" y="202.4132" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#586574" text-anchor="middle">−1</text><text x="180.0000" y="72.0000" font-size="31" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#aa5411" text-anchor="middle">y = −5x²</text><text x="546.0000" y="72.0000" font-size="31" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#205d9c" text-anchor="middle">y = −4x²</text><text x="353.0000" y="459.0000" font-size="30" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">꼭짓점에서 같은 높이로 잰 폭</text><text x="147.0000" y="505.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#586574" text-anchor="middle">4</text><line x1="194.0000" y1="497.0000" x2="296.0000" y2="497.0000" stroke="#586574" stroke-width="5.45" stroke-linecap="round" /><circle cx="194" cy="497" r="4" fill="#586574" /><circle cx="296.0" cy="497" r="4" fill="#586574" /><text x="147.0000" y="547.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#586574" text-anchor="middle">1/4</text><line x1="194.0000" y1="539.0000" x2="602.0000" y2="539.0000" stroke="#586574" stroke-width="5.45" stroke-linecap="round" /><circle cx="194" cy="539" r="4" fill="#586574" /><circle cx="602.0" cy="539" r="4" fill="#586574" /><text x="147.0000" y="589.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#aa5411" text-anchor="middle">−5</text><line x1="194.0000" y1="581.0000" x2="285.2316" y2="581.0000" stroke="#aa5411" stroke-width="5.45" stroke-linecap="round" /><circle cx="194" cy="581" r="4" fill="#aa5411" /><circle cx="285.2315734819914" cy="581" r="4" fill="#aa5411" /><text x="147.0000" y="631.0000" font-size="28" font-family="Malgun Gothic, Cambri