<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 718 923" width="718" height="923" role="img" aria-labelledby="title desc"><title id="title">포물선의 평행이동과 같은 폭의 곡선 영역</title><desc id="desc">위 그림은 주어진 파란 포물선과 왼쪽 2, 위 3만큼 옮긴 주황 포물선이다. 아래 그림에서는 왼쪽 가지 두 개 사이의 주황 띠를 그렸다. 어떤 높이에서든 두 가지 사이의 가로 길이는 3이다.</desc><rect width="718" height="923" fill="white" /><line x1="55.0000" y1="375.8633" x2="661.0000" y2="375.8633" stroke="#586574" stroke-width="1.65" stroke-linecap="round" /><polygon points="661.0000,375.8633 648.0000,370.8633 648.0000,380.8633" fill="#586574" /><text x="678.0000" y="367.8633" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#586574" text-anchor="middle">x</text><line x1="367.5229" y1="435.0000" x2="367.5229" y2="106.0000" stroke="#586574" stroke-width="1.65" stroke-linecap="round" /><polygon points="367.5229,106.0000 362.5229,119.0000 372.5229,119.0000" fill="#586574" /><text x="383.5229" y="112.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#586574" text-anchor="middle">y</text><circle cx="367.5228571428571" cy="375.8632911392405" r="4.6" fill="#28364b" /><text x="352.5229" y="402.8633" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">O</text><path d="M 259.3086 156.1829 Q 454.0943 662.1766 648.8800 156.1829" stroke="#205d9c" stroke-width="5.5" stroke-linecap="round" fill="none" /><path d="M 88.7629 112.9098 Q 279.2200 601.0625 469.6771 121.7054" stroke="#aa5411" stroke-width="5.4" stroke-linecap="round" fill="none" stroke-dasharray="13 6" /><line x1="107.8086" y1="375.8633" x2="107.8086" y2="159.3063" stroke="#704895" stroke-width="1.9" stroke-linecap="round" stroke-dasharray="6 5" /><circle cx="107.80857142857141" cy="159.30632911392405" r="4.6" fill="#aa5411" /><text x="98.8086" y="403.8633" font-size="27" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#704895" text-anchor="middle">−3</text><circle cx="454.0942857142857" cy="409.17974683544304" r="4.6" fill="#205d9c" /><circle cx="280.95142857142855" cy="359.20506329113925" r="4.6" fill="#aa5411" /><line x1="67.0000" y1="56.0000" x2="113.0000" y2="56.0000" stroke="#205d9c" stroke-width="5.1" stroke-linecap="round" /><text x="126.0000" y="64.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#205d9c" text-anchor="start">주어진 그래프</text><line x1="371.0000" y1="56.0000" x2="417.0000" y2="56.0000" stroke="#aa5411" stroke-width="5.1" stroke-linecap="round" stroke-dasharray="12 5" /><text x="430.0000" y="64.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#aa5411" text-anchor="start">왼쪽 2, 위 3 이동</text><line x1="52.0000" y1="485.0000" x2="666.0000" y2="485.0000" stroke="#d7dfe8" stroke-width="1.55" stroke-linecap="round" /><path d="M 141.5763 609.3005 Q 198.0734 820.6995 254.5706 820.6995 L 593.5537 820.6995 Q 537.0565 820.6995 480.5593 609.3005 Z" fill="#fae6ce" /><line x1="107.6780" y1="609.3005" x2="516.7175" y2="609.3005" stroke="#586574" stroke-width="1.85" stroke-linecap="round" stroke-dasharray="7 5" /><line x1="211.6328" y1="820.6995" x2="619.5424" y2="820.6995" stroke="#586574" stroke-width="1.85" stroke-linecap="round" stroke-dasharray="7 5" /><line x1="208.9045" y1="786.1710" x2="547.8875" y2="786.1710" stroke="#a45b1c" stroke-width="2.35" stroke-linecap="round" /><polygon points="208.9045,786.1710 215.9045,782.1710 215.9045,790.1710" fill="#a45b1c" /><polygon points="547.8875,786.1710 540.8875,782.1710 540.8875,790.1710" fill="#a45b1c" /><line x1="180.1886" y1="729.0933" x2="519.1717" y2="729.0933" stroke="#a45b1c" stroke-width="2.35" stroke-linecap="round" /><polygon points="180.1886,729.0933 187.1886,725.0933 187.1886,733.0933" fill="#a45b1c" /><polygon points="519.1717,729.0933 512.1717,725.0933 512.1717,733.0933" fill="#a45b1c" /><line x1="156.4974" y1="661.445