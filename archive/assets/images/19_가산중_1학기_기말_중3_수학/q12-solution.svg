<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 716 571" width="716" height="571" role="img" aria-labelledby="title desc"><title id="title">계수의 부호에 따라 포물선이 열리는 방향</title><desc id="desc">왼쪽은 양의 계수 4인 ①의 포물선, 오른쪽은 음의 계수 −4인 ④의 포물선이다. 둘 다 꼭짓점은 원점이고 열리는 방향이 다르다. 아래 수식은 방향에 따라 다섯 그래프를 나눈 것이다.</desc><rect width="716" height="571" fill="white" /><line x1="47.0000" y1="314.5070" x2="325.0000" y2="314.5070" stroke="#586574" stroke-width="1.65" stroke-linecap="round" /><line x1="186.0000" y1="342.0000" x2="186.0000" y2="98.0000" stroke="#586574" stroke-width="1.65" stroke-linecap="round" /><path d="M 80.3266 115.1831 Q 186.0000 513.8310 291.6734 115.1831" stroke="#205d9c" stroke-width="6.0" stroke-linecap="round" fill="none" /><text x="299.8750" y="190.7915" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#205d9c" text-anchor="middle">①</text><text x="186.0000" y="57.0000" font-size="30" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#205d9c" text-anchor="middle">위로 열린 그래프</text><text x="186.0000" y="407.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">①  y = 4x²</text><text x="186.0000" y="455.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">②  y = x²/4</text><line x1="388.0000" y1="125.4930" x2="666.0000" y2="125.4930" stroke="#586574" stroke-width="1.65" stroke-linecap="round" /><line x1="527.0000" y1="342.0000" x2="527.0000" y2="98.0000" stroke="#586574" stroke-width="1.65" stroke-linecap="round" /><path d="M 421.3266 324.8169 Q 527.0000 -73.8310 632.6734 324.8169" stroke="#aa5411" stroke-width="6.0" stroke-linecap="round" fill="none" /><text x="640.8750" y="271.2085" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#aa5411" text-anchor="middle">④</text><text x="527.0000" y="57.0000" font-size="30" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#aa5411" text-anchor="middle">아래로 열린 그래프</text><text x="527.0000" y="407.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">③  y = −5x²</text><text x="527.0000" y="455.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">④  y = −4x²</text><text x="527.0000" y="503.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">⑤  y = −x²/5</text><line x1="358.0000" y1="84.0000" x2="358.0000" y2="529.0000" stroke="#d7dfe8" stroke-width="1.5" stroke-linecap="round" /></svg>
