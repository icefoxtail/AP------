<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 481" width="700" height="481" role="img" aria-labelledby="title desc"><title id="title">차가 일정한 두 수의 곱이 최소가 되는 위치</title><desc id="desc">함수 y=x(x+6)의 두 x절편 한가운데에 주황 꼭짓점이 놓인다. 아래 색 눈금은 두 수가 원점에서 같은 거리에 있음을 표시한다.</desc><rect width="700" height="481" fill="white" /><line x1="52.0000" y1="161.1741" x2="642.0000" y2="161.1741" stroke="#586574" stroke-width="1.65" stroke-linecap="round" /><polygon points="642.0000,161.1741 629.0000,156.1741 629.0000,166.1741" fill="#586574" /><text x="659.0000" y="153.1741" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#586574" text-anchor="middle">x</text><line x1="567.1269" y1="416.0000" x2="567.1269" y2="50.0000" stroke="#586574" stroke-width="1.65" stroke-linecap="round" /><polygon points="567.1269,50.0000 562.1269,63.0000 572.1269,63.0000" fill="#586574" /><text x="583.1269" y="56.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#586574" text-anchor="middle">y</text><circle cx="567.1269035532995" cy="161.1740614334471" r="4.6" fill="#28364b" /><text x="552.1269" y="188.1741" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">O</text><path d="M 74.4619 65.8292 Q 342.5076 706.2118 610.5533 65.8292" stroke="#205d9c" stroke-width="5.8" stroke-linecap="round" fill="none" /><line x1="342.5076" y1="386.0205" x2="342.5076" y2="161.1741" stroke="#586574" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="7 5" /><circle cx="117.88832487309644" cy="161.1740614334471" r="4.6" fill="#205d9c" /><text x="97.8883" y="187.1741" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#205d9c" text-anchor="middle">−6</text><circle cx="342.50761421319794" cy="386.0204778156997" r="4.6" fill="#aa5411" /><text x="358.5076" y="422.0205" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#aa5411" text-anchor="middle">곱이 최소</text><text x="462.0000" y="63.0000" font-size="30" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#205d9c" text-anchor="middle">y = x(x+6)</text><line x1="232.8883" y1="439.0000" x2="555.1269" y2="439.0000" stroke="#277339" stroke-width="3.4" stroke-linecap="round" /><circle cx="232.88832487309645" cy="439" r="4.75" fill="#277339" /><circle cx="394.00761421319794" cy="439" r="4.75" fill="#277339" /><circle cx="555.1269035532995" cy="439" r="4.75" fill="#277339" /><text x="232.8883" y="469.0000" font-size="27" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#277339" text-anchor="middle">−3</text><text x="394.0076" y="469.0000" font-size="27" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#277339" text-anchor="middle">0</text><text x="555.1269" y="469.0000" font-size="27" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#277339" text-anchor="middle">3</text></svg>
