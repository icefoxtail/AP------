<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" width="560" height="420" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">이등변삼각형 ABC에서 각 B의 이등분선과 각 C의 외각의 이등분선이 점 D에서 만난다. 점 E는 변 BC의 연장선 위에 있고, 각 A가 48도로 표시되어 있다.</title><desc id="visual-desc">삼각형 ABC의 밑변 BC를 C 너머 E까지 연장한 그림이다. B에서 각 B의 이등분선이, C에서 각 C의 외각의 이등분선이 그어져 점 D에서 만난다. 각 A에는 48이 적혀 있고 각 BDC에는 값 없이 호만 표시되어 있다.</desc><rect width="560" height="420" fill="#fff"/><g data-layer="30"><line id="AB" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="186.616879392" y1="66.202604363" x2="58.571428571" y2="353.797395637"/></g><g data-layer="30"><line id="BC" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="58.571428571" y1="353.797395637" x2="314.662330212" y2="353.797395637"/></g><g data-layer="30"><line id="CE" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="314.662330212" y1="353.797395637" x2="442.707781032" y2="353.797395637"/></g><g data-layer="30"><line id="CA" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="314.662330212" y1="353.797395637" x2="186.616879392" y2="66.202604363"/></g><g data-layer="30"><line id="BD" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="58.571428571" y1="353.797395637" x2="501.428571429" y2="66.202604363"/></g><g data-layer="30"><line id="CD" data-role="line" str