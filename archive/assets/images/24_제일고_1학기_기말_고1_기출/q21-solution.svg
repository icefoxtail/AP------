<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" width="640" height="280" role="img" aria-labelledby="title desc">
  <title id="title">점에서 원에 그은 두 접선</title>
  <desc id="desc">점 (−1,0)에서 중심 (2,1), 반지름 √5인 원에 그은 두 접선의 방정식을 나타낸 그림</desc>
  <rect width="640" height="280" fill="#fff"/>
  <text x="320" y="28" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="21" font-weight="700" fill="#1e3a5f">접선: 중심에서 직선까지 거리 = √5</text>
  <rect x="18" y="45" width="350" height="215" rx="8" fill="#f8fafc" stroke="#dbe3ef"/>
  <line x1="42" y1="184" x2="344" y2="184" stroke="#0f172a" stroke-width="1.4"/><line x1="158" y1="245" x2="158" y2="58" stroke="#0f172a" stroke-width="1.4"/>
  <circle cx="218" cy="150" r="64" fill="#dbeafe" fill-opacity=".62" stroke="#2563eb" stroke-width="2.5"/>
  <line x1="75" y1="184" x2="290" y2="75" stroke="#0f766e" stroke-width="2.2"/><line x1="75" y1="184" x2="285" y2="230" stroke="#f97316" stroke-width="2.2"/>
  <line x1="218" y1="150" x2="187" y2="126" stroke="#64748b" stroke-width="1.8" stroke-dasharray="5 4"/>
  <circle cx="218" cy="150" r="4.5" fill="#1d4ed8"/><text x="225" y="142" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14" font-weight="700">C(2,1)</text>
  <circle cx="75" cy="184" r="4.5" fill="#111827"/><text x="43" y="177" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14" font-weight="700">(−1,0)</text>
  <circle cx="290" cy="75" r="4" fill="#0f766e"/><circle cx="285" cy="230" r="4" fill="#f97316"/>
  <rect x="388" y="45" width="234" height="215" rx="8" fill="#f8fafc" stroke="#dbe3ef"/>
  <text x="405" y="75" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="17" font-weight="700" fill="#334155">기울기 m 구하기</text>
  <text x="405" y="110" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="15">직선: y=m(x+1)</text>
  <text x="405" y="143" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="15">d(C,l)=√5</text>
  <text x="405" y="176" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="15">2m²−3m−2=0</text>
  <text x="405" y="209" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="15">m=2, −1/2</text>
  <text x="405" y="243" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="16" font-weight="700" fill="#1d4ed8">두 접선 완성</text>
</svg>
