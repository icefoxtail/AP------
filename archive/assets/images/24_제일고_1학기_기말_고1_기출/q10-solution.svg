<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" width="640" height="280" role="img" aria-labelledby="title desc" data-scale-policy="SCHEMATIC_ALLOWED">
  <title id="title">완전제곱식으로 찾은 원의 중심</title>
  <desc id="desc">x²+y²+8x+2y+8=0을 표준형으로 바꾼 원의 중심 (−4,−1)과 반지름 3을 나타낸 그림</desc>
  <rect width="640" height="280" fill="#fff"/>
  <text x="320" y="28" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="21" font-weight="700" fill="#1e3a5f">x²+y²+8x+2y+8=0  →  (x+4)²+(y+1)²=9</text>
  <rect x="18" y="45" width="350" height="215" rx="8" fill="#f8fafc" stroke="#dbe3ef"/>
  <g stroke="#e2e8f0" stroke-width="1"><line x1="70" y1="62" x2="70" y2="242"/><line x1="116" y1="62" x2="116" y2="242"/><line x1="162" y1="62" x2="162" y2="242"/><line x1="208" y1="62" x2="208" y2="242"/><line x1="254" y1="62" x2="254" y2="242"/><line x1="300" y1="62" x2="300" y2="242"/><line x1="42" y1="88" x2="344" y2="88"/><line x1="42" y1="134" x2="344" y2="134"/><line x1="42" y1="180" x2="344" y2="180"/><line x1="42" y1="226" x2="344" y2="226"/></g>
  <line x1="42" y1="180" x2="344" y2="180" stroke="#0f172a" stroke-width="1.5"/><line x1="162" y1="245" x2="162" y2="58" stroke="#0f172a" stroke-width="1.5"/>
  <circle cx="100" cy="203" r="55" fill="#dbeafe" fill-opacity=".65" stroke="#2563eb" stroke-width="2.5"/>
  <line x1="100" y1="203" x2="155" y2="203" stroke="#dc2626" stroke-width="2.1" stroke-dasharray="6 4"/>
  <circle cx="100" cy="203" r="4.5" fill="#1d4ed8"/><text x="48" y="193" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14" font-weight="700">C(−4,−1)</text><text x="112" y="226" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14" fill="#b91c1c">r=3</text>
  <rect x="388" y="45" width="234" height="215" rx="8" fill="#f8fafc" stroke="#dbe3ef"/>
  <text x="405" y="75" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="17" font-weight="700" fill="#334155">표준형 읽기</text>
  <text x="405" y="110" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="15">중심: (−4,−1)</text>
  <text x="405" y="143" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="15">반지름: √9=3</text>
  <text x="405" y="177" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="15">a+b+c=−4−1+3</text>
  <line x1="405" y1="190" x2="603" y2="190" stroke="#cbd5e1"/>
  <text x="405" y="225" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="18" font-weight="700" fill="#1d4ed8">= −2</text>
</svg>
