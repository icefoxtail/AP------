<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320" role="img" aria-labelledby="title desc" data-scale-policy="SCHEMATIC_ALLOWED">
  <title id="title">원의 현과 세 점으로 만든 삼각형</title>
  <desc id="desc">원 (x−5)²+(y−3)²=9와 y=1의 현 AB, 그리고 삼각형 ABC의 넓이가 √5가 되는 세 점 C1,C2,C3을 나타낸 그림</desc>
  <rect width="640" height="320" fill="#fff"/>
  <text x="320" y="28" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="20" font-weight="700" fill="#1e3a5f">[ABC]=√5  →  |y−1|=1  →  y=0 또는 y=2</text>
  <rect x="18" y="45" width="370" height="255" rx="8" fill="#f8fafc" stroke="#dbe3ef"/>
  <line x1="42" y1="215" x2="364" y2="215" stroke="#0f172a" stroke-width="1.4"/><line x1="185" y1="285" x2="185" y2="58" stroke="#0f172a" stroke-width="1.4"/>
  <circle cx="185" cy="140" r="75" fill="#dbeafe" fill-opacity=".48" stroke="#2563eb" stroke-width="2.6"/>
  <line x1="74" y1="190" x2="296" y2="190" stroke="#dc2626" stroke-width="2.3"/>
  <line x1="70" y1="165" x2="300" y2="165" stroke="#f97316" stroke-width="1.9" stroke-dasharray="7 4"/>
  <polygon points="114,165 256,165 185,215" fill="#fef3c7" fill-opacity=".75" stroke="#7c3aed" stroke-width="2.2"/>
  <circle cx="129" cy="190" r="4" fill="#dc2626"/><circle cx="241" cy="190" r="4" fill="#dc2626"/>
  <circle cx="114" cy="165" r="4" fill="#f97316"/><circle cx="256" cy="165" r="4" fill="#f97316"/><circle cx="185" cy="215" r="4" fill="#7c3aed"/>
  <circle cx="185" cy="140" r="4.5" fill="#1d4ed8"/>
  <text x="112" y="184" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14" font-weight="700">A</text><text x="245" y="184" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14" font-weight="700">B</text>
  <text x="96" y="156" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14" font-weight="700" fill="#c2410c">C₁</text><text x="261" y="156" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14" font-weight="700" fill="#c2410c">C₂</text><text x="191" y="232" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14" font-weight="700" fill="#6d28d9">C₃</text>
  <text x="303" y="185" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14" fill="#b91c1c">y=1</text><text x="303" y="160" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14" fill="#c2410c">y=2</text>
  <rect x="407" y="45" width="215" height="255" rx="8" fill="#f8fafc" stroke="#dbe3ef"/>
  <text x="424" y="76" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="17" font-weight="700" fill="#334155">넓이 계산</text>
  <text x="424" y="111" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="15">중심 (5,3), r=3</text>
  <text x="424" y="143" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="15">AB=2√5</text>
  <text x="424" y="175" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="15">C₁,C₂: y=2</text>
  <text x="424" y="207" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="15">C₃: (5,0)</text>
  <text x="424" y="240" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="15">C₁C₂=4√2, 높이=2</text>
  <text x="424" y="273" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="17" font-weight="700" fill="#1d4ed8">넓이=4√2</text>
</svg>
