<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" role="img" aria-labelledby="title desc" data-scale-policy="SCHEMATIC_ALLOWED">
  <title id="title">두 원의 교점을 지나는 원</title>
  <desc id="desc">두 원 F1,F2의 교점과 점 (−1,3)을 지나는 원이 F1+1/2F2=0으로 정해지고 중심 (−2,0), 반지름 제곱 10을 갖는 과정을 나타낸 그림</desc>
  <rect width="640" height="300" fill="#fff"/>
  <text x="320" y="28" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="21" font-weight="700" fill="#1e3a5f">공통 교점은 F₁=F₂=0  →  F₁+½F₂=0</text>
  <rect x="18" y="45" width="370" height="255" rx="8" fill="#f8fafc" stroke="#dbe3ef"/>
  <line x1="42" y1="195" x2="364" y2="195" stroke="#0f172a" stroke-width="1.4"/><line x1="183" y1="285" x2="183" y2="58" stroke="#0f172a" stroke-width="1.4"/>
  <circle cx="220" cy="137" r="79" fill="#dbeafe" fill-opacity=".38" stroke="#2563eb" stroke-width="2.4"/>
  <circle cx="143" cy="208" r="88" fill="#ffedd5" fill-opacity=".38" stroke="#f97316" stroke-width="2.4"/>
  <circle cx="164" cy="195" r="61" fill="#dcfce7" fill-opacity=".42" stroke="#059669" stroke-width="2.7"/>
  <circle cx="194" cy="171" r="3.8" fill="#111827"/><text x="201" y="164" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="13" font-weight="700">(−1,3)</text>
  <text x="276" y="77" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14" fill="#1d4ed8">F₁</text><text x="78" y="270" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14" fill="#c2410c">F₂</text><text x="116" y="137" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14" fill="#047857">구하는 원</text>
  <rect x="407" y="45" width="215" height="255" rx="8" fill="#f8fafc" stroke="#dbe3ef"/>
  <text x="424" y="76" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="17" font-weight="700" fill="#334155">계산 흐름</text>
  <text x="424" y="111" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="15">F₁(−1,3)=−20</text>
  <text x="424" y="142" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="15">F₂(−1,3)=40</text>
  <text x="424" y="174" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="15">t=1/2</text>
  <text x="424" y="207" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="15">(x+2)²+y²=10</text>
  <text x="424" y="244" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="17" font-weight="700" fill="#1d4ed8">넓이=10π</text>
</svg>
