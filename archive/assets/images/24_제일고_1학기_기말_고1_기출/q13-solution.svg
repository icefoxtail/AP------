<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" width="640" height="280" role="img" aria-labelledby="title desc" data-scale-policy="SCHEMATIC_ALLOWED">
  <title id="title">한 점에서 원에 그은 두 접선</title>
  <desc id="desc">중심 (3,−1), 반지름 √13인 원과 점 (1,−7)에서 그은 두 접선의 기울기 방정식을 나타낸 그림</desc>
  <rect width="640" height="280" fill="#fff"/>
  <text x="320" y="28" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="21" font-weight="700" fill="#1e3a5f">거리 = 반지름  →  9m²+24m−23=0</text>
  <rect x="18" y="45" width="350" height="215" rx="8" fill="#f8fafc" stroke="#dbe3ef"/>
  <line x1="42" y1="188" x2="344" y2="188" stroke="#0f172a" stroke-width="1.4"/><line x1="189" y1="245" x2="189" y2="58" stroke="#0f172a" stroke-width="1.4"/>
  <circle cx="214" cy="150" r="66" fill="#dbeafe" fill-opacity=".62" stroke="#2563eb" stroke-width="2.5"/>
  <line x1="90" y1="238" x2="267" y2="91" stroke="#0f766e" stroke-width="2.2"/><line x1="90" y1="238" x2="300" y2="183" stroke="#f97316" stroke-width="2.2"/>
  <line x1="214" y1="150" x2="183" y2="178" stroke="#64748b" stroke-width="1.8" stroke-dasharray="5 4"/>
  <circle cx="214" cy="150" r="4.5" fill="#1d4ed8"/><text x="221" y="142" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14" font-weight="700">C(3,−1)</text>
  <circle cx="90" cy="238" r="4.5" fill="#111827"/><text x="47" y="232" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14" font-weight="700">P(1,−7)</text>
  <circle cx="267" cy="91" r="4" fill="#0f766e"/><circle cx="300" cy="183" r="4" fill="#f97316"/>
  <rect x="388" y="45" width="234" height="215" rx="8" fill="#f8fafc" stroke="#dbe3ef"/>
  <text x="405" y="75" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="17" font-weight="700" fill="#334155">두 기울기의 방정식</text>
  <text x="405" y="110" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="15">직선: y+7=m(x−1)</text>
  <text x="405" y="143" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="15">r²=13</text>
  <text x="405" y="176" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="15">9m²+24m−23=0</text>
  <text x="405" y="209" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="15">m₁+m₂=−24/9</text>
  <text x="405" y="243" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="17" font-weight="700" fill="#1d4ed8">=−8/3</text>
</svg>
