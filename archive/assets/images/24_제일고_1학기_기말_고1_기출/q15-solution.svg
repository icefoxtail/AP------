<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" role="img" aria-labelledby="title desc" data-scale-policy="SCHEMATIC_ALLOWED">
  <title id="title">두 원과 평행이동한 직선</title>
  <desc id="desc">중심 (5,1),(8,2), 반지름 2인 두 원과 직선 y=2(x−m)의 공통 만남 범위를 나타낸 그림</desc>
  <rect width="640" height="300" fill="#fff"/>
  <text x="320" y="28" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="20" font-weight="700" fill="#1e3a5f">두 원과 모두 만남  →  두 거리 조건의 공통 범위</text>
  <rect x="18" y="45" width="370" height="255" rx="8" fill="#f8fafc" stroke="#dbe3ef"/>
  <line x1="42" y1="205" x2="364" y2="205" stroke="#0f172a" stroke-width="1.4"/><line x1="183" y1="285" x2="183" y2="58" stroke="#0f172a" stroke-width="1.4"/>
  <circle cx="132" cy="170" r="42" fill="#dbeafe" fill-opacity=".62" stroke="#2563eb" stroke-width="2.4"/>
  <circle cx="260" cy="130" r="42" fill="#ffedd5" fill-opacity=".62" stroke="#f97316" stroke-width="2.4"/>
  <line x1="50" y1="249" x2="344" y2="82" stroke="#0f766e" stroke-width="2.3"/>
  <line x1="50" y1="223" x2="344" y2="56" stroke="#0f766e" stroke-width="2.1" stroke-dasharray="7 4"/>
  <circle cx="132" cy="170" r="4" fill="#1d4ed8"/><circle cx="260" cy="130" r="4" fill="#ea580c"/>
  <text x="94" y="164" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14" font-weight="700">C₁(5,1)</text><text x="266" y="124" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14" font-weight="700">C₂(8,2)</text>
  <text x="246" y="75" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14" fill="#047857">y=2(x−m)</text>
  <rect x="407" y="45" width="215" height="255" rx="8" fill="#f8fafc" stroke="#dbe3ef"/>
  <text x="424" y="76" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="17" font-weight="700" fill="#334155">거리 조건</text>
  <text x="424" y="111" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="15">C₁: |9−2m|≤2√5</text>
  <text x="424" y="144" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="15">C₂: |14−2m|≤2√5</text>
  <text x="424" y="177" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="15">공통: 7−√5≤m</text>
  <text x="424" y="210" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="15">≤(9+2√5)/2</text>
  <text x="424" y="246" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="17" font-weight="700" fill="#1d4ed8">a+b=23/2</text>
</svg>
