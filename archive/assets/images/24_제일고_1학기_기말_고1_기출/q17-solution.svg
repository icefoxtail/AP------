<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" role="img" aria-labelledby="title desc">
  <title id="title">두 원의 공통현과 삼각형 넓이</title>
  <desc id="desc">두 원의 공통현 AB가 x−2y+1=0이고 두 번째 원 위 점 P에서의 최대 거리를 이용하는 그림</desc>
  <rect width="640" height="300" fill="#fff"/>
  <text x="320" y="28" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="20" font-weight="700" fill="#1e3a5f">두 원의 차  →  공통현 AB  →  P와의 최대 높이</text>
  <rect x="18" y="45" width="370" height="255" rx="8" fill="#f8fafc" stroke="#dbe3ef"/>
  <line x1="42" y1="210" x2="364" y2="210" stroke="#0f172a" stroke-width="1.4"/><line x1="195" y1="285" x2="195" y2="58" stroke="#0f172a" stroke-width="1.4"/>
  <circle cx="135" cy="120" r="62" fill="#dbeafe" fill-opacity=".4" stroke="#2563eb" stroke-width="2.4"/>
  <circle cx="254" cy="178" r="82" fill="#ffedd5" fill-opacity=".42" stroke="#f97316" stroke-width="2.4"/>
  <line x1="66" y1="178" x2="346" y2="278" stroke="#7c3aed" stroke-width="2.5"/>
  <path d="M128 200 L247 242 L319 94 Z" fill="#fef3c7" fill-opacity=".5" stroke="#64748b" stroke-width="1.5"/>
  <circle cx="128" cy="200" r="4" fill="#7c3aed"/><circle cx="247" cy="242" r="4" fill="#7c3aed"/><circle cx="319" cy="94" r="4.5" fill="#111827"/>
  <text x="108" y="194" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14" font-weight="700">A</text><text x="252" y="258" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14" font-weight="700">B</text><text x="325" y="88" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14" font-weight="700">P</text>
  <text x="218" y="116" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14" fill="#7c3aed">AB: x−2y+1=0</text>
  <rect x="407" y="45" width="215" height="255" rx="8" fill="#f8fafc" stroke="#dbe3ef"/>
  <text x="424" y="76" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="17" font-weight="700" fill="#334155">넓이 최댓값</text>
  <text x="424" y="111" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="15">AB=2√5</text>
  <text x="424" y="144" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="15">최대 높이=5+2√5</text>
  <text x="424" y="177" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="15">½·AB·높이</text>
  <line x1="424" y1="190" x2="605" y2="190" stroke="#cbd5e1"/>
  <text x="424" y="225" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="15">=√5(5+2√5)</text>
  <text x="424" y="260" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="17" font-weight="700" fill="#1d4ed8">=10+5√5</text>
</svg>
