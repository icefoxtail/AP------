<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img" aria-labelledby="title desc" width="760" height="360"><title id="title">문항 11 해설: 세 과목 Venn diagram</title><desc id="desc">세 집합의 바깥, 세 집합 교집합, 정확히 한두 과목 영역을 구분한 그림</desc><style>text{font-family:"Noto Sans KR",Arial,sans-serif;fill:#172033}.m{fill:#56657a}</style><rect width="760" height="360" rx="18" fill="#f8fafc"/><text x="28" y="38" font-size="22" font-weight="700">정확히 한 과목·두 과목·세 과목으로 나누기</text><rect x="28" y="72" width="390" height="240" rx="14" fill="#fff" stroke="#cbd5e1"/><circle cx="220" cy="160" r="75" fill="#fef3c7" fill-opacity=".75" stroke="#d97706" stroke-width="3"/><circle cx="180" cy="225" r="75" fill="#dbeafe" fill-opacity=".75" stroke="#2563eb" stroke-width="3"/><circle cx="260" cy="225" r="75" fill="#dcfce7" fill-opacity=".75" stroke="#16a34a" stroke-width="3"/><text x="220" y="95" text-anchor="middle" font-size="16">수학 40</text><text x="88" y="291" font-size="16">과학 56</text><text x="294" y="291" font-size="16">국어 60</text><text x="220" y="208" text-anchor="middle" font-size="19" fill="#c2410c">9</text><text x="48" y="101" font-size="15" fill="#7c3aed">바깥 6</text><rect x="450" y="88" width="282" height="198" rx="14" fill="#fff" stroke="#cbd5e1"/><text x="474" y="122" font-size="17" font-weight="700">영역별 기호</text><text x="474" y="164" font-size="17" fill="#1d4ed8">정확히 한 과목: N₁</text><text x="474" y="202" font-size="17" fill="#1d4ed8">정확히 두 과목: N₂</text><text x="474" y="240" font-size="17" fill="#c2410c">세 과목 모두: 9</text><text x="28" y="338" class="m" font-size="14">합집합은 110−6이고, 과목별 합에서는 N₂가 두 번 세어진다.</text></svg>
