<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 320" width="420" height="320" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">지면에 수직으로 서 있던 나무가 부러져 꼭대기가 지면과 30도의 각을 이루고, 밑동에서 꼭대기가 닿은 지점까지의 수평 거리가 12미터인 그림.</title><desc id="visual-desc">부러진 나무의 남은 수직 부분과 기울어진 윗부분이 보이고, 기울어진 부분이 지면과 만나는 곳에 30도 각 표시가 있다. 밑동에서 꼭대기가 닿은 지점까지 12미터가 적혀 있다.</desc><rect width="420" height="320" fill="#fff"/><g data-layer="12"><polygon id="aC-sector" data-role="angleSector" stroke="none" stroke-width="1.6" fill="#d9d9d9" data-owner-points="A C B" data-mark="angle" data-mark-id="aC" data-mark-index="0" data-mark-count="1" data-mark-side="INNER" points="368.928571429,245.026396303 344.679860123,231.026396303 344.234776027,231.827287672 343.816134666,232.642312977 343.424384331,233.470599468 343.059944518,234.311260196 342.723205479,235.163394961 342.414527803,236.026091274 342.134242028,236.89842534 341.882648292,237.77946304 341.660016009,238.668260938 341.466583577,239.563867286 341.30255813,240.465323048 341.16811531,241.371662921 341.063399082,242.281916373 340.988521578,243.195108684 340.943562979,244.110261984 340.928571429,245.026396303"/></g><g data-layer="30"><line id="sAB" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="51.071428571" y1="61.51148931" x2="51.071428571" y2="245.026396303"/></g><g data-layer="30"><line id="sBC" data-