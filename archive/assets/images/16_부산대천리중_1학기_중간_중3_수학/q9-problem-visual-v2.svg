<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 344" width="700" height="344" role="img" aria-labelledby="title desc"><title id="title">넓이가 절반씩 줄어드는 네 정사각형</title><desc id="desc">정사각형 A, B, C, D가 왼쪽부터 공통 밑변 위에 놓인다. 바로 오른쪽 정사각형의 넓이는 왼쪽 정사각형 넓이의 절반이다.</desc><rect width="700" height="344" fill="white" /><rect x="71" y="60.0" width="210.0" height="210.0" fill="#e7f1fa" stroke="#205d9c" stroke-width="4" /><text x="176.0000" y="175.0000" font-size="31" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#205d9c" text-anchor="middle">A</text><rect x="281.0" y="121.50757595082504" width="148.49242404917496" height="148.49242404917496" fill="#e8f4ee" stroke="#266f73" stroke-width="4" /><text x="355.2462" y="205.7538" font-size="31" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#266f73" text-anchor="middle">B</text><rect x="429.49242404917493" y="165.0" width="105.0" height="105.0" fill="#f9ecda" stroke="#aa5411" stroke-width="4" /><text x="481.9924" y="227.5000" font-size="31" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#aa5411" text-anchor="middle">C</text><rect x="534.4924240491749" y="195.75378797541254" width="74.24621202458748" height="74.24621202458748" fill="#f1ebf6" stroke="#704895" stroke-width="4" /><text x="571.6155" y="242.8769" font-size="31" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#704895" text-anchor="middle">D</text></svg>
