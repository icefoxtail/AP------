<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 576 543" width="576" height="543" role="img" aria-labelledby="title desc"><title id="title">입력값이 거치는 세 단계</title><desc id="desc">가장 위의 어떤 수에서 출발하여 A 단계, B 단계, C 단계를 차례로 아래 방향으로 거쳐 가장 아래의 결과 값에 이른다.</desc><rect width="576" height="543" fill="white" /><rect x="174" y="32" width="228" height="66" rx="12" fill="#f0f3f6" stroke="#586574" stroke-width="2.4" /><text x="288.0000" y="76.0000" font-size="31" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#586574" text-anchor="middle">어떤 수</text><line x1="288.0000" y1="101.0000" x2="288.0000" y2="123.0000" stroke="#586574" stroke-width="2.5" stroke-linecap="round" /><polygon points="288.0000,128.0000 282.0000,118.0000 294.0000,118.0000" fill="#586574" /><rect x="174" y="134" width="228" height="66" rx="12" fill="#e7f1fa" stroke="#205d9c" stroke-width="2.4" /><text x="288.0000" y="178.0000" font-size="31" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#205d9c" text-anchor="middle">A 단계</text><line x1="288.0000" y1="203.0000" x2="288.0000" y2="225.0000" stroke="#586574" stroke-width="2.5" stroke-linecap="round" /><polygon points="288.0000,230.0000 282.0000,220.0000 294.0000,220.0000" fill="#586574" /><rect x="174" y="236" width="228" height="66" rx="12" fill="#e3f2ef" stroke="#266f73" stroke-width="2.4" /><text x="288.0000" y="280.0000" font-size="31" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#266f73" text-anchor="middle">B 단계</text><line x1="288.0000" y1="305.0000" x2="288.0000" y2="327.0000" stroke="#586574" stroke-width="2.5" stroke-linecap="round" /><polygon points="288.0000,332.0000 282.0000,322.0000 294.0000,322.0000" fill="#586574" /><rect x="174" y="338" width="228" height="66" rx="12" fill="#f8ebdb" stroke="#aa5411" stroke-width="2.4" /><text x="288.0000" y="382.0000" font-size="31" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#aa5411" text-anchor="middle">C 단계</text><line x1="288.0000" y1="407.0000" x2="288.0000" y2="429.0000" stroke="#586574" stroke-width="2.5" stroke-linecap="round" /><polygon points="288.0000,434.0000 282.0000,424.0000 294.0000,424.0000" fill="#586574" /><rect x="174" y="440" width="228" height="66" rx="12" fill="#f0f3f6" stroke="#586574" stroke-width="2.4" /><text x="288.0000" y="484.0000" font-size="31" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#586574" text-anchor="middle">결과 값</text></svg>
