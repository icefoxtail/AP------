<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 715 511" width="715" height="511" role="img" aria-labelledby="title desc"><title id="title">같은 직선 위에서 생기는 두 직각삼각형</title><desc id="desc">직선 y=3x 위의 A와 P에서 아래로 내리면 C와 Q가 된다. P의 높이에서 가로로 간 점 R은 세로 AC 위에 있다.</desc><rect width="715" height="511" fill="white" /><line x1="53.0000" y1="415.2895" x2="648.0000" y2="415.2895" stroke="#586574" stroke-width="1.65" stroke-linecap="round" /><polygon points="648.0000,415.2895 635.0000,410.2895 635.0000,420.2895" fill="#586574" /><text x="665.0000" y="407.2895" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#586574" text-anchor="middle">x</text><line x1="113.5941" y1="446.0000" x2="113.5941" y2="57.0000" stroke="#586574" stroke-width="1.65" stroke-linecap="round" /><polygon points="113.5941,57.0000 108.5941,70.0000 118.5941,70.0000" fill="#586574" /><text x="129.5941" y="63.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#586574" text-anchor="middle">y</text><circle cx="113.5940594059406" cy="415.2894736842105" r="4.6" fill="#586574" /><text x="98.5941" y="400.2895" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#586574" text-anchor="middle">O</text><line x1="71.5149" y1="446.0000" x2="593.2970" y2="65.1895" stroke="#205d9c" stroke-width="5.1" stroke-linecap="round" /><line x1="534.3861" y1="108.1842" x2="534.3861" y2="415.2895" stroke="#586574" stroke-width="3.3" stroke-linecap="round" /><line x1="354.7079" y1="239.3182" x2="354.7079" y2="415.2895" stroke="#205d9c" stroke-width="3.65" stroke-linecap="round" /><line x1="354.7079" y1="239.3182" x2="534.3861" y2="239.3182" stroke="#aa5411" stroke-width="3.65" stroke-linecap="round" /><circle cx="534.3861386138614" cy="108.18421052631578" r="4.6" fill="#28364b" /><text x="608.3861" y="122.1842" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">A (10, 30)</text><circle cx="354.7079207920792" cy="239.31815789473683" r="4.6" fill="#205d9c" /><text x="334.7079" y="225.3182" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#205d9c" text-anchor="middle">P</text><circle cx="354.7079207920792" cy="415.2894736842105" r="4.6" fill="#205d9c" /><text x="354.7079" y="444.2895" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#205d9c" text-anchor="middle">Q</text><circle cx="534.3861386138614" cy="415.2894736842105" r="4.6" fill="#586574" /><text x="542.3861" y="442.2895" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#586574" text-anchor="middle">C</text><circle cx="534.3861386138614" cy="239.31815789473683" r="4.6" fill="#aa5411" /><text x="554.3861" y="247.3182" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#aa5411" text-anchor="middle">R</text><line x1="521.3861" y1="239.3182" x2="521.3861" y2="226.3182" stroke="#586574" stroke-width="1.5" stroke-linecap="round" /><line x1="521.3861" y1="226.3182" x2="534.3861" y2="226.3182" stroke="#586574" stroke-width="1.5" stroke-linecap="round" /><text x="416.0000" y="61.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#205d9c" text-anchor="middle">y = 3x</text></svg>
