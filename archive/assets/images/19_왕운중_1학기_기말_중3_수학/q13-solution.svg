<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 714 514" width="714" height="514" role="img" aria-labelledby="title desc"><title id="title">제4사분면을 지나지 않는 포물선의 경계</title><desc id="desc">꼭짓점이 같은 두 파란색과 주황색 곡선을 그렸다. 파란 경계 곡선은 원점을 지나고 주황 곡선은 오른쪽 아래 색칠한 영역을 지난다.</desc><rect width="714" height="514" fill="white" /><polygon points="515.9718,275.0253 654.0000,275.0253 654.0000,439.0000 515.9718,439.0000" fill="#fae6ce" /><line x1="57.0000" y1="275.0253" x2="654.0000" y2="275.0253" stroke="#586574" stroke-width="1.65" stroke-linecap="round" /><polygon points="654.0000,275.0253 641.0000,270.0253 641.0000,280.0253" fill="#586574" /><text x="671.0000" y="267.0253" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#586574" text-anchor="middle">x</text><line x1="515.9718" y1="439.0000" x2="515.9718" y2="58.0000" stroke="#586574" stroke-width="1.65" stroke-linecap="round" /><polygon points="515.9718,58.0000 510.9718,71.0000 520.9718,71.0000" fill="#586574" /><text x="531.9718" y="64.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#586574" text-anchor="middle">y</text><circle cx="515.9718045112782" cy="275.0253164556962" r="4.6" fill="#28364b" /><text x="500.9718" y="302.0253" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">O</text><path d="M 80.0047 78.5001 Q 347.6447 728.7658 615.2848 78.5001" stroke="#205d9c" stroke-width="5.75" stroke-linecap="round" fill="none" /><path d="M 62.0498 170.3944 Q 346.8031 635.4967 631.5564 173.1357" stroke="#aa5411" stroke-width="5.35" stroke-linecap="round" fill="none" stroke-dasharray="14 6" /><circle cx="347.64473684210526" cy="403.63291139240505" r="4.6" fill="#704895" /><circle cx="515.9718045112782" cy="275.0253164556962" r="4.6" fill="#205d9c" /><circle cx="515.9718045112782" cy="322.61012658227844" r="4.6" fill="#aa5411" /><text x="601.0000" y="345.0000" font-size="29"