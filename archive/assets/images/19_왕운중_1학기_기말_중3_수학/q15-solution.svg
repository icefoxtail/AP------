<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 715 511" width="715" height="511" role="img" aria-labelledby="title desc"><title id="title">곡선과 직선의 두 교점이 만드는 삼각형</title><desc id="desc">세로축 위의 점에서 삼각형을 두 조각으로 나눴다. 두 삼각형의 공통 밑변이 세로 3, 그 밑변까지의 거리가 각각 가로 1과 3이다.</desc><rect width="715" height="511" fill="white" /><polygon points="260.7043,337.7500 338.4967,364.5460 338.4967,284.1580" fill="#fae6ce" /><polygon points="571.8739,123.3822 338.4967,364.5460 338.4967,284.1580" fill="#e5f3e4" /><line x1="60.0000" y1="364.5460" x2="652.0000" y2="364.5460" stroke="#586574" stroke-width="1.65" stroke-linecap="round" /><polygon points="652.0000,364.5460 639.0000,359.5460 639.0000,369.5460" fill="#586574" /><text x="669.0000" y="356.5460" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#586574" text-anchor="middle">x</text><line x1="338.4967" y1="431.0000" x2="338.4967" y2="58.0000" stroke="#586574" stroke-width="1.65" stroke-linecap="round" /><polygon points="338.4967,58.0000 333.4967,71.0000 343.4967,71.0000" fill="#586574" /><text x="354.4967" y="64.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#586574" text-anchor="middle">y</text><circle cx="338.4967148488831" cy="364.54597701149424" r="4.6" fill="#28364b" /><text x="323.4967" y="391.5460" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">O</text><path d="M 77.1143 62.0301 Q 338.4967 667.0618 599.8791 62.0301" stroke="#205d9c" stroke-width="5.6" stroke-linecap="round" fill="none" /><line x1="132.3469" y1="426.1767" x2="646.5545" y2="71.9339" stroke="#aa5411" stroke-width="4.5" stroke-linecap="round" /><line x1="260.7043" y1="337.7500" x2="338.4967" y2="364.5460" stroke="#586574" stroke-width="3.1" stroke-linecap="round" /><line x1="571.8739" y1="123.3822" x2="338.4967" y2="364.5460" stroke="#586574" stroke-width="3.1" stroke-linecap="round" /><circle cx="260.7043363994744" cy="337.75" r="4.6" fill="#aa5411" /><text x="208.7043" y="328.7500" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#aa5411" text-anchor="middle">A</text><circle cx="571.873850197109" cy="123.38218390804599" r="4.6" fill="#aa5411" /><text x="588.8739" y="142.3822" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#aa5411" text-anchor="middle">B</text><circle cx="338.4967148488831" cy="284.1580459770115" r="4.6" fill="#586574" /><text x="366.4967" y="298.1580" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#586574" text-anchor="middle">P</text><line x1="260.7043" y1="337.7500" x2="338.4967" y2="337.7500" stroke="#aa5411" stroke-width="1.9" stroke-linecap="round" stroke-dasharray="6 5" /><text x="279.6005" y="385.7500" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#aa5411" text-anchor="middle">1</text><line x1="571.8739" y1="123.3822" x2="338.4967" y2="123.3822" stroke="#277339" stroke-width="1.9" stroke-linecap="round" stroke-dasharray="6 5" /><text x="455.1853" y="104.3822" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#277339" text-anchor="middle">3</text><line x1="338.4967" y1="364.5460" x2="338.4967" y2="284.1580" stroke="#704895" stroke-width="4.5" stroke-linecap="round" /><text x="179.0000" y="478.0000" font-size="30" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#205d9c" text-anchor="middle">y = x²</text><text x="546.0000" y="478.0000" font-size="30" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#aa5411" text-anchor="middle">y = 2x + 3</text></svg>
