<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 714 514" width="714" height="514" role="img" aria-labelledby="title desc"><title id="title">공통 대칭축과 위아래 두 포물선의 대응점</title><desc id="desc">대표인 파랑 y=2x²와 아래 주황 y=−2x²가 원점에서 만난다. 두 곡선의 공통 대칭축은 세로 점선이다.</desc><rect width="714" height="514" fill="white" /><line x1="57.0000" y1="248.5000" x2="654.0000" y2="248.5000" stroke="#586574" stroke-width="1.65" stroke-linecap="round" /><polygon points="654.0000,248.5000 641.0000,243.5000 641.0000,253.5000" fill="#586574" /><text x="671.0000" y="240.5000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#586574" text-anchor="middle">x</text><line x1="355.5000" y1="439.0000" x2="355.5000" y2="58.0000" stroke="#586574" stroke-width="1.65" stroke-linecap="round" /><polygon points="355.5000,58.0000 350.5000,71.0000 360.5000,71.0000" fill="#586574" /><text x="371.5000" y="64.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#586574" text-anchor="middle">y</text><circle cx="355.5" cy="248.50000000000003" r="4.6" fill="#28364b" /><text x="340.5000" y="275.5000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">O</text><path d="M 113.4328 71.5282 Q 355.5000 425.4718 597.5672 71.5282" stroke="#205d9c" stroke-width="5.85" stroke-linecap="round" fill="none" /><path d="M 113.4328 425.4718 Q 355.5000 71.5282 597.5672 425.4718" stroke="#aa5411" stroke-width="5.35" stroke-linecap="round" fill="none" stroke-dasharray="13 6" /><line x1="355.5000" y1="377.3872" x2="355.5000" y2="119.6128" stroke="#704895" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="6 5" /><circle cx="199.56716417910445" cy="175.06424825174827" r="4.6" fill="#205d9c" /><circle cx="199.56716417910445" cy="321.93575174825173" r="4.6" fill="#aa5411" /><circle cx="511.4328358208955" cy="175.06424825174827" r="4.6" fill="#205d9c" /><circle cx="511.4328358208955" cy="321.93575174825173" r="4.6" fill="#aa5411" /><line x1="199.5672" y1="175.0642" x2="511.4328" y2="175.0642" stroke="#586574" stroke-width="1.65" stroke-linecap="round" stroke-dasharray="6 5" /><line x1="199.5672" y1="321.9358" x2="511.4328" y2="321.9358" stroke="#586574" stroke-width="1.65" stroke-linecap="round" stroke-dasharray="6 5" /><text x="530.0000" y="61.0000" font-size="30" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#205d9c" text-anchor="middle">y = 2x²</text><text x="531.0000" y="482.0000" font-size="30" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#aa5411" text-anchor="middle">y = −2x²</text></svg>
