<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 681 528" width="681" height="528" role="img" aria-labelledby="title desc"><title id="title">반지름이 늘어나 생기는 고리 부분의 넓이</title><desc id="desc">파란 안쪽 원의 반지름은 8 cm이다. 오른쪽에서 주황으로 표시한 x cm만큼 바깥 원의 반지름이 더 크다.</desc><rect width="681" height="528" fill="white" /><circle cx="315" cy="260" r="205" fill="#fae6ce" stroke="#aa5411" stroke-width="4.5" /><circle cx="315" cy="260" r="149.0909090909091" fill="#f5f9ff" stroke="#205d9c" stroke-width="4.5" /><line x1="315.0000" y1="260.0000" x2="464.0909" y2="260.0000" stroke="#205d9c" stroke-width="4.65" stroke-linecap="round" /><line x1="464.0909" y1="260.0000" x2="520.0000" y2="260.0000" stroke="#aa5411" stroke-width="4.65" stroke-linecap="round" /><text x="389.5455" y="240.0000" font-size="30" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#205d9c" text-anchor="middle">8 cm</text><line x1="492.0455" y1="264.0000" x2="573.0000" y2="315.0000" stroke="#aa5411" stroke-width="1.8" stroke-linecap="round" /><text x="587.0000" y="351.0000" font-size="30" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#aa5411" text-anchor="middle">x cm</text><circle cx="315" cy="260" r="5" fill="#28364b" /></svg>
