<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 714 514" width="714" height="514" role="img" aria-labelledby="title desc"><title id="title">꼭짓점에서의 높이와 세로축 절편</title><desc id="desc">아래로 열린 포물선의 주황 꼭짓점과 파란 세로축 교점의 높이 차이는 1이다.</desc><rect width="714" height="514" fill="white" /><line x1="57.0000" y1="342.9496" x2="654.0000" y2="342.9496" stroke="#586574" stroke-width="1.65" stroke-linecap="round" /><polygon points="654.0000,342.9496 641.0000,337.9496 641.0000,347.9496" fill="#586574" /><text x="671.0000" y="334.9496" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#586574" text-anchor="middle">x</text><line x1="259.8269" y1="439.0000" x2="259.8269" y2="58.0000" stroke="#586574" stroke-width="1.65" stroke-linecap="round" /><polygon points="259.8269,58.0000 254.8269,71.0000 264.8269,71.0000" fill="#586574" /><text x="275.8269" y="64.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#586574" text-anchor="middle">y</text><circle cx="259.8269230769231" cy="342.94957983193274" r="4.6" fill="#28364b" /><text x="244.8269" y="369.9496" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">O</text><path d="M 85.7019 421.0866 Q 355.5000 -215.4395 625.2981 421.0866" stroke="#205d9c" stroke-width="5.6" stroke-linecap="round" fill="none" /><circle cx="355.5" cy="102.8235294117647" r="4.6" fill="#aa5411" /><circle cx="259.8269230769231" cy="142.84453781512605" r="4.6" fill="#205d9c" /><line x1="259.8269" y1="102.8235" x2="355.5000" y2="102.8235" stroke="#aa5411" stroke-width="2.0" stroke-linecap="round" stroke-dasharray="7 5" /><line x1="254.8269" y1="102.8235" x2="264.8269" y2="102.8235" stroke="#aa5411" stroke-width="1.75" stroke-linecap="round" /><text x="238.8269" y="110.8235" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#aa5411" text-anchor="middle">6</text><line x1="355.5000" y1="342.9496" x2="355.5000" y2="102.8235" stroke="#704895" stroke-width="1.9" stroke-linecap="round" stroke-dasharray="7 5" /><text x="284.8269" y="165.8445" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#205d9c" text-anchor="middle">k</text><text x="307.6635" y="135.8340" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#aa5411" text-anchor="middle">1</text><text x="456.0000" y="43.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#205d9c" text-anchor="middle">y = −(x − 1)² + k + 1</text></svg>
