<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 714 514" width="714" height="514" role="img" aria-labelledby="title desc"><title id="title">직선 위에 놓이는 포물선의 꼭짓점</title><desc id="desc">파란 포물선의 가장 낮은 주황 점까지 세로 점선을 그렸다. 그 점은 같은 가로 눈금에서 초록 직선 위에 놓인다.</desc><rect width="714" height="514" fill="white" /><line x1="57.0000" y1="179.0257" x2="654.0000" y2="179.0257" stroke="#586574" stroke-width="1.65" stroke-linecap="round" /><polygon points="654.0000,179.0257 641.0000,174.0257 641.0000,184.0257" fill="#586574" /><text x="671.0000" y="171.0257" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#586574" text-anchor="middle">x</text><line x1="188.4326" y1="439.0000" x2="188.4326" y2="58.0000" stroke="#586574" stroke-width="1.65" stroke-linecap="round" /><polygon points="188.4326,58.0000 183.4326,71.0000 193.4326,71.0000" fill="#586574" /><text x="204.4326" y="64.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#586574" text-anchor="middle">y</text><circle cx="188.43255813953488" cy="179.02570320077598" r="4.6" fill="#586574" /><text x="202.4326" y="205.0257" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#586574" text-anchor="middle">O</text><path d="M 119.9395 104.8360 Q 373.5488 659.7139 627.1581 104.8360" stroke="#205d9c" stroke-width="5.9" stroke-linecap="round" fill="none" /><line x1="62.5535" y1="196.0247" x2="466.1070" y2="437.7066" stroke="#277339" stroke-width="4.8" stroke-linecap="round" stroke-dasharray="11 5" /><line x1="373.5488" y1="179.0257" x2="373.5488" y2="382.2750" stroke="#704895" stroke-width="2.05" stroke-linecap="round" stroke-dasharray="6 5" /><circle cx="373.5488372093023" cy="382.2749757516974" r="4.6" fill="#aa5411" /><text x="176.0000" y="485.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#277339" text-anchor="middle">y = −3x − 5</text><text x="519.0000" y="485.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#205d9c" text-anchor="middle">y = 2x² − 8x + k</text></svg>
