<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 714 514" width="714" height="514" role="img" aria-labelledby="title desc"><title id="title">이차함수의 식에서 바로 읽는 세로축 교점</title><desc id="desc">파란 예시 포물선이 세로축을 지나는 주황 점을 표시했다. 이 점에서는 가로 좌표가 0이어서 높이는 상수항 c이다.</desc><rect width="714" height="514" fill="white" /><line x1="57.0000" y1="323.8604" x2="654.0000" y2="323.8604" stroke="#586574" stroke-width="1.65" stroke-linecap="round" /><polygon points="654.0000,323.8604 641.0000,318.8604 641.0000,328.8604" fill="#586574" /><text x="671.0000" y="315.8604" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#586574" text-anchor="middle">x</text><line x1="270.5819" y1="439.0000" x2="270.5819" y2="58.0000" stroke="#586574" stroke-width="1.65" stroke-linecap="round" /><polygon points="270.5819,58.0000 265.5819,71.0000 275.5819,71.0000" fill="#586574" /><text x="286.5819" y="64.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#586574" text-anchor="middle">y</text><circle cx="270.5818965517242" cy="323.8604407135362" r="4.6" fill="#28364b" /><text x="255.5819" y="350.8604" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">O</text><path d="M 63.8621 69.1049 Q 356.3578 738.5320 648.8534 69.1049" stroke="#205d9c" stroke-width="5.95" stroke-linecap="round" fill="none" /><circle cx="270.5818965517242" cy="375.0335781741868" r="4.6" fill="#aa5411" /><text x="205.5819" y="390.0336" font-size="30" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#aa5411" text-anchor="middle">(0, c)</text><line x1="234.5560" y1="375.0336" x2="270.5819" y2="375.0336" stroke="#aa5411" stroke-width="1.85" stroke-linecap="round" stroke-dasharray="6 5" /><text x="462.0000" y="51.0000" font-size="30" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#205d9c" text-anchor="middle">y = ax² + bx + c</text></svg>
