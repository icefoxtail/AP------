<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 717 842" width="717" height="842" role="img" aria-labelledby="title desc"><title id="title">먼저 뒤집고 다시 옮기는 이차함수</title><desc id="desc">위에는 가로축에 서로 대칭인 파랑 모형과 주황 모형이 있다. 아래에서는 주황 모형의 꼭짓점을 왼쪽과 위로 이동했다.</desc><rect width="717" height="842" fill="white" /><text x="356.0000" y="57.0000" font-size="31" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">가로축에 대칭</text><line x1="90.0000" y1="238.0000" x2="631.0000" y2="238.0000" stroke="#586574" stroke-width="1.65" stroke-linecap="round" /><polygon points="631.0000,238.0000 618.0000,233.0000 618.0000,243.0000" fill="#586574" /><text x="648.0000" y="230.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#586574" text-anchor="middle">x</text><line x1="360.5000" y1="376.0000" x2="360.5000" y2="100.0000" stroke="#586574" stroke-width="1.65" stroke-linecap="round" /><polygon points="360.5000,100.0000 355.5000,113.0000 365.5000,113.0000" fill="#586574" /><text x="376.5000" y="106.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#586574" text-anchor="middle">y</text><circle cx="360.5" cy="238.0" r="4.6" fill="#28364b" /><text x="345.5000" y="265.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">O</text><path d="M 142.2018 114.2678 Q 360.5000 361.7322 578.7982 114.2678" stroke="#205d9c" stroke-width="5.55" stroke-linecap="round" fill="none" /><path d="M 142.2018 361.7322 Q 360.5000 114.2678 578.7982 361.7322" stroke="#aa5411" stroke-width="5.55" stroke-linecap="round" fill="none" stroke-dasharray="12 5" /><text x="553.0000" y="94.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#205d9c" text-anchor="middle">y = x²</text><text x="562.0000" y="408.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#aa5411" text-anchor="middle">y = −x²</text><line x1="65.0000" y1="447.0000" x2="650.0000" y2="447.0000" stroke="#dae1e8" stroke-width="1.55" stroke-linecap="round" /><text x="359.0000" y="501.0000" font-size="31" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">왼쪽으로 2, 위쪽으로 이동</text><line x1="90.0000" y1="705.4274" x2="631.0000" y2="705.4274" stroke="#586574" stroke-width="1.65" stroke-linecap="round" /><polygon points="631.0000,705.4274 618.0000,700.4274 618.0000,710.4274" fill="#586574" /><text x="648.0000" y="697.4274" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#586574" text-anchor="middle">x</text><line x1="482.8690" y1="787.0000" x2="482.8690" y2="549.0000" stroke="#586574" stroke-width="1.65" stroke-linecap="round" /><polygon points="482.8690,549.0000 477.8690,562.0000 487.8690,562.0000" fill="#586574" /><text x="498.8690" y="555.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#586574" text-anchor="middle">y</text><circle cx="482.8690476190476" cy="705.4274193548388" r="4.6" fill="#28364b" /><text x="467.8690" y="732.4274" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">O</text><path d="M 343.3254 778.4109 Q 482.8690 632.4440 622.4127 778.4109" stroke="#aa5411" stroke-width="5.1" stroke-linecap="round" fill="none" stroke-dasharray="12 5" /><path d="M 109.3214 770.0790 Q 339.7474 372.0662 570.1733 770.0790" stroke="#277339" stroke-width="5.75" stroke-linecap="round" fill="none" /><circle cx="339.74735449735454" cy="571.0725806451613" r="4.6" fill="#277339" /><circle cx="482.8690476190476" cy="705.4274193548388" r="4.6" fill="#aa5411" /><line x1="482.8690" y1="705.4274" x2="339.7474" y2="705.4274" stroke="#704895" stroke-width="1.95" stroke-linecap="round" stroke-dasharray="6 5" /><line x1=