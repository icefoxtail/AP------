<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" role="img" aria-labelledby="title desc">
<title id="title">원 O의 지름 AB와 원주각 그림</title>
<desc id="desc">원 O, 지름 AB, 원 위의 점 A, B, C, D, F, G를 연결한 선분. F에서의 각 x, G에서의 각 DGB는 26도이다. 풀이 흔적은 포함하지 않은 정리 도식.</desc>
<rect width="640" height="520" fill="#fff"/>
<style>text{font-family:'Noto Sans CJK KR','NanumGothic',sans-serif;fill:#26344a}.lbl{font-size:22px}.given{font-size:20px;font-weight:600}.angle{font-size:23px;font-style:italic}</style>
<!-- clean vector redraw of the printed circle/chords and printed 26-degree callout -->
<circle cx="320" cy="260" r="205" fill="none" stroke="#334155" stroke-width="2.5"/>
<line x1="115" y1="260" x2="525" y2="260" stroke="#334155" stroke-width="2.5"/>
<line x1="217.5" y1="82.4" x2="136" y2="350" stroke="#334155" stroke-width="2.2"/>
<line x1="217.5" y1="82.4" x2="446" y2="421" stroke="#334155" stroke-width="2.2"/>
<line x1="410" y1="74" x2="446" y2="421" stroke="#334155" stroke-width="2.2"/>
<line x1="410" y1="74" x2="525" y2="260" stroke="#334155" stroke-width="2.2"/>
<circle cx="320" cy="260" r="4" fill="#334155"/>
<path d="M200 140 A54 54 0 0 1 257 141" fill="none" stroke="#64748b" stroke-width="1.6"/>
<path d="M401 126 A47 47 0 0 1 435 115" fill="none" stroke="#64748b" stroke-width="1.6"/>
<text x="193" y="165" class="angle">x</text>
<text x="438" y="113" class="given">26°</text>
<text x="93" y="264" class="lbl">A</text><text x="532" y="264" class="lbl">B</text>
<text x="121" y="376" class="lbl">C</text><text x="449" y="448" class="lbl">D</text>
<text x="198" y="72" class="lbl">F</text><text x="408" y="58" class="lbl">G</text><text x="329" y="281" class="lbl">O</text>
</svg>