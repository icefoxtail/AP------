<svg xmlns="http://www.w3.org/2000/svg" width="700" height="600" viewBox="0 0 700 600" role="img" aria-labelledby="title desc">
  <title id="title">Circle with two 14 cm chords and perpendicular distances from O</title>
  <desc id="desc">A circle centered at O contains two chords, each labeled 14 cm. Perpendiculars from O to the chords are marked; the lower distance is labeled 7 cm and the upper distance x cm.</desc>
  <rect width="700" height="600" fill="#fff"/>
  <!-- Schematic, preserving the printed labels and perpendicular relationships. -->
  <circle cx="350" cy="275" r="245" fill="none" stroke="#26364a" stroke-width="4"/>
  <!-- Upper chord and perpendicular from O -->
  <path d="M115 190 L585 190" fill="none" stroke="#26364a" stroke-width="4"/>
  <path d="M350 275 L350 190" fill="none" stroke="#26364a" stroke-width="3"/>
  <path d="M350 190 L370 190 L370 210 L350 210" fill="none" stroke="#26364a" stroke-width="2.2"/>
  <text x="190" y="166" font-family="Arial, sans-serif" font-size="25" fill="#26364a" text-anchor="middle">14 cm</text>
  <text x="373" y="238" font-family="Arial, sans-serif" font-size="25" fill="#26364a">x cm</text>
  <!-- Lower chord and perpendicular from O -->
  <path d="M140 405 L560 405" fill="none" stroke="#26364a" stroke-width="4"/>
  <path d="M350 275 L350 405" fill="none" stroke="#26364a" stroke-width="3"/>
  <path d="M350 385 L370 385 L370 405 L350 405" fill="none" stroke="#26364a" stroke-width="2.2"/>
  <text x="502" y="445" font-family="Arial, sans-serif" font-size="25" fill="#26364a" text-anchor="middle">14 cm</text>
  <text x="270" y="355" font-family="Arial, sans-serif" font-size="25" fill="#26364a" text-anchor="end">7 cm</text>
  <!-- Center marker and label -->
  <circle cx="350" cy="275" r="5.5" fill="#26364a"/>
  <text x="367" y="294" font-family="Arial, sans-serif" font-size="25" fill="#26364a">O</text>
</svg>
