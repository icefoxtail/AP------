<svg xmlns="http://www.w3.org/2000/svg" width="620" height="430" viewBox="0 0 620 430" role="img" aria-labelledby="title desc">
  <title id="title">Broken circular dish fragment with chord and sagitta measurements</title>
  <desc id="desc">A circular arc above a chord. The chord is split into two equal parts, each labeled 6 cm. A perpendicular segment from the chord midpoint to the arc is labeled 2 cm.</desc>
  <rect width="620" height="430" fill="#fff"/>
  <!-- Printed problem geometry only: no center, radius, or solution construction. -->
  <path d="M100 300 A320 320 0 0 1 500 300" fill="none" stroke="#26364a" stroke-width="4"/>
  <path d="M100 300 L500 300" fill="none" stroke="#26364a" stroke-width="4"/>
  <!-- midpoint-to-arc measurement, perpendicular to the chord -->
  <path d="M300 300 L300 230" fill="none" stroke="#66758a" stroke-width="2.5" stroke-dasharray="7 6"/>
  <path d="M300 300 L320 300 L320 280 L300 280" fill="none" stroke="#26364a" stroke-width="2.2"/>
  <!-- equal half-chord measurement leaders -->
  <path d="M100 300 L100 334 M300 300 L300 334 M500 300 L500 334" fill="none" stroke="#8792a1" stroke-width="1.7" stroke-dasharray="5 5"/>
  <path d="M100 334 L300 334 M300 334 L500 334" fill="none" stroke="#8792a1" stroke-width="1.7" stroke-dasharray="5 5"/>
  <text x="174" y="366" font-family="Arial, sans-serif" font-size="25" fill="#26364a" text-anchor="middle">6 cm</text>
  <text x="426" y="366" font-family="Arial, sans-serif" font-size="25" fill="#26364a" text-anchor="middle">6 cm</text>
  <text x="330" y="267" font-family="Arial, sans-serif" font-size="25" fill="#26364a">2 cm</text>
</svg>
