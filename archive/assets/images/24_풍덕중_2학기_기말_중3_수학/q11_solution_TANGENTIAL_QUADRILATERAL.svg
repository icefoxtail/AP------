<svg xmlns="http://www.w3.org/2000/svg" width="620" height="380" viewBox="0 0 620 380"><rect width="620" height="380" fill="#fff"/><g fill="none" stroke="#172b4d" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
<rect x="52" y="78" width="516" height="220" rx="14" stroke="#cad5e2"/>
<text x="72" y="111" font-size="18" fill="#14243a" font-family="NanumGothic, Noto Sans CJK KR, sans-serif" font-weight="normal" stroke="none">접하는 사각형: 같은 꼭짓점에서 그은 접선 길이는 같다.</text><text x="72" y="151" font-size="18" fill="#14243a" font-family="NanumGothic, Noto Sans CJK KR, sans-serif" font-weight="normal" stroke="none">AB + CD = AD + BC = 10 + 13 = 23</text><text x="72" y="187" font-size="20" fill="#14243a" font-family="NanumGothic, Noto Sans CJK KR, sans-serif" font-weight="normal" stroke="none">AB - CD = 1</text><text x="72" y="231" font-size="20" fill="#14243a" font-family="NanumGothic, Noto Sans CJK KR, sans-serif" font-weight="normal" stroke="none">두 식을 빼면 2CD = 22</text><text x="72" y="274" font-size="22" fill="#2563eb" font-family="NanumGothic, Noto Sans CJK KR, sans-serif" font-weight="bold" stroke="none">CD = 11 cm</text></g></svg>