<circle cx="569" cy="229" r="10" fill="none" stroke="#e6a035" stroke-width="2" stroke-dasharray="4 3"/><text x="593" y="235" class="small">같은 중심거리의 동심원</text>
<polygon points="558,258 569,248 580,258 569,268" fill="#e4f4f0" stroke="#168b78" stroke-dasharray="3 2"/><text x="593" y="264" class="small">32개 직선이 만드는 안쪽 다각형 윤곽</text>
<text x="555" y="318" class="body">같은 작은 호</text>
<text x="555" y="348" class="body">7 × (360° ÷ 32) = 78.75°</text>
<text x="555" y="392" class="body">같은 호 → 같은 길이의 현</text>
<text x="555" y="422" class="body">같은 길이의 현 → O에서 같은 수선거리</text>
<text x="555" y="452" class="body">각 현의 직선이 하나의 작은 동심원에 접함</text>
<text x="555" y="496" class="small">점을 7칸씩 건너 잇는 경로는 32개 같은 변의</text>
<text x="555" y="520" class="small">별 모양이며, 한 점 간격 회전으로 겹친다.</text>
<rect x="25" y="574" width="890" height="105" rx="14" fill="#f2f6fb"/>
<text x="45" y="610" class="body">주의: 선분은 모두 같은 길이이며 회전대칭 별 모양을 이룬다.</text>
<text x="45" y="642" class="body">안쪽 윤곽은 32개 직선의 다각형이다. 32개만 있으므로 완전한 원은 아니다.</text>
