<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="500" height="400" role="img" aria-labelledby="q15-title q15-desc">
  <title id="q15-title">두 직선과 한 횡단선이 이루는 각</title>
  <desc id="q15-desc">직선 l, m이 직선 n과 만날 때 생기는 동위각과 엇각 a, b, c, d, e, f, g, h</desc>
  <rect width="500" height="400" fill="#ffffff"/>
  <line x1="50" y1="130" x2="450" y2="130" stroke="#111827" stroke-width="2.5"/>
  <text x="460" y="135" font-family="sans-serif" font-size="16" font-style="italic" fill="#111827">l</text>
  <line x1="50" y1="270" x2="450" y2="270" stroke="#111827" stroke-width="2.5"/>
  <text x="460" y="275" font-family="sans-serif" font-size="16" font-style="italic" fill="#111827">m</text>
  <line x1="120" y1="50" x2="380" y2="350" stroke="#2563eb" stroke-width="2.5"/>
  <text x="390" y="360" font-family="sans-serif" font-size="16" font-style="italic" fill="#2563eb">n</text>
  <text x="160" y="115" font-family="sans-serif" font-size="14" font-style="italic" fill="#374151">a</text>
  <text x="215" y="115" font-family="sans-serif" font-size="14" font-style="italic" fill="#374151">b</text>
  <text x="160" y="155" font-family="sans-serif" font-size="14" font-style="italic" fill="#374151">c</text>
  <text x="215" y="155" font-family="sans-serif" font-size="14" font-style="italic" fill="#374151">d</text>
  <text x="282" y="255" font-family="sans-serif" font-size="14" font-style="italic" fill="#374151">e</text>
  <text x="337" y="255" font-family="sans-serif" font-size="14" font-style="italic" fill="#374151">f</text>
  <text x="282" y="295" font-family="sans-serif" font-size="14" font-style="italic" fill="#374151">g</text>
  <text x="337" y="295" font-family="sans-serif" font-size="14" font-style="italic" fill="#374151">h</text>
</svg>
