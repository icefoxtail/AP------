<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 400" width="350" height="400" role="img" aria-labelledby="q05-title q05-desc">
  <title id="q05-title">아래쪽 폭이 넓고 위쪽 폭이 좁은 물병</title>
  <desc id="q05-desc">아래쪽은 넓은 원기둥이고 위쪽은 좁은 원기둥인 물병에 물이 채워지는 모습</desc>
  <rect width="350" height="400" fill="#ffffff"/>
  <line x1="175" y1="20" x2="175" y2="60" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
  <rect x="135" y="60" width="80" height="120" fill="none" stroke="#1f2937" stroke-width="3"/>
  <rect x="85" y="180" width="180" height="160" fill="none" stroke="#1f2937" stroke-width="3"/>
  <line x1="85" y1="180" x2="135" y2="180" stroke="#1f2937" stroke-width="3"/>
  <line x1="215" y1="180" x2="265" y2="180" stroke="#1f2937" stroke-width="3"/>
  <rect x="87" y="240" width="176" height="98" fill="#bae6fd" opacity="0.6"/>
  <text x="175" y="375" font-family="sans-serif" font-size="15" text-anchor="middle" fill="#374151">시간: x초</text>
  <text x="45" y="260" font-family="sans-serif" font-size="15" text-anchor="middle" fill="#374151">높이: y</text>
  <line x1="68" y1="180" x2="68" y2="340" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,4"/>
  <polyline points="64,188 68,180 72,188" fill="none" stroke="#6b7280" stroke-width="1.5"/>
  <polyline points="64,332 68,340 72,332" fill="none" stroke="#6b7280" stroke-width="1.5"/>
</svg>