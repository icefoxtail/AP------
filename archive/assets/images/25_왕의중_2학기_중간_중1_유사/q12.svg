<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="500" height="400" role="img" aria-labelledby="q12-title q12-desc">
  <title id="q12-title">맞꼭지각과 수선이 이루는 각도 관계</title>
  <desc id="q12-desc">두 직선 AB, CD가 점 O에서 교차하고 선분 OF가 AB에 수직일 때 각도 관계</desc>
  <rect width="500" height="400" fill="#ffffff"/>
  <line x1="50" y1="200" x2="450" y2="200" stroke="#111827" stroke-width="2"/>
  <text x="40" y="195" font-family="sans-serif" font-size="16" font-weight="bold" fill="#111827">A</text>
  <text x="455" y="195" font-family="sans-serif" font-size="16" font-weight="bold" fill="#111827">B</text>
  <text x="242" y="222" font-family="sans-serif" font-size="15" font-style="italic" fill="#111827">O</text>
  <line x1="70" y1="326" x2="430" y2="74" stroke="#111827" stroke-width="2"/>
  <text x="60" y="345" font-family="sans-serif" font-size="16" font-weight="bold" fill="#111827">C</text>
  <text x="435" y="70" font-family="sans-serif" font-size="16" font-weight="bold" fill="#111827">D</text>
  <line x1="250" y1="200" x2="250" y2="40" stroke="#2563eb" stroke-width="2"/>
  <text x="250" y="30" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#2563eb">F</text>
  <path d="M 250,180 L 270,180 L 270,200" fill="none" stroke="#2563eb" stroke-width="1.5"/>
  <line x1="250" y1="200" x2="325" y2="70" stroke="#059669" stroke-width="2"/>
  <text x="335" y="65" font-family="sans-serif" font-size="16" font-weight="bold" fill="#059669">E</text>
  <path d="M 190,200 A 60 60 0 0 1 201,242" fill="none" stroke="#dc2626" stroke-width="1.5"/>
  <text x="155" y="235" font-family="sans-serif" font-size="14" fill="#dc2626">35°</text>
  <path d="M 340,148 A 110 110 0 0 0 305,105" fill="none" stroke="#d97706" stroke-width="1.5"/>
  <text x="335" y="125" font-family="sans-serif" font-size="14" fill="#d97706">25°</text>
</svg>