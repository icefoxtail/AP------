    <text x="75" y="145" font-family="sans-serif" font-size="13" fill="#374151">8 cm</text>
    <text x="25" y="80" font-family="sans-serif" font-size="13" fill="#374151">5 cm</text>
    <text x="115" y="80" font-family="sans-serif" font-size="13" fill="#374151">7 cm</text>
  </g>
  <g transform="translate(450, 30)">
