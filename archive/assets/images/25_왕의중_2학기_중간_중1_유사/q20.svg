<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 450" width="650" height="450" role="img" aria-labelledby="q20-title q20-desc">
  <title id="q20-title">삼각형의 합동 조건 보기</title>
  <desc id="q20-desc">여섯 개의 삼각형 ㄱ부터 ㅂ까지 변의 길이와 각의 크기가 주어진 모습</desc>
  <rect width="650" height="450" fill="#ffffff"/>
  <g transform="translate(30, 30)">
    <polygon points="20,130 150,130 90,40" fill="#f8fafc" stroke="#111827" stroke-width="2"/>
    <text x="15" y="25" font-family="sans-serif" font-size="15" font-weight="bold" fill="#111827">ㄱ</text>
    <text x="35" y="125" font-family="sans-serif" font-size="13" fill="#374151">60°</text>
    <text x="120" y="125" font-family="sans-serif" font-size="13" fill="#374151">70°</text>
    <text x="75" y="145" font-family="sans-serif" font-size="13" fill="#374151">7 cm</text>
  </g>
  <g transform="translate(240, 30)">
