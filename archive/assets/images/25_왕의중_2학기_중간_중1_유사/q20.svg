    <text x="15" y="25" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2563eb">ㅁ</text>
    <text x="80" y="145" font-family="sans-serif" font-size="13" fill="#1e40af">8 cm</text>
    <text x="135" y="85" font-family="sans-serif" font-size="13" fill="#1e40af">6 cm</text>
    <text x="122" y="122" font-family="sans-serif" font-size="13" fill="#dc2626">50°</text>
