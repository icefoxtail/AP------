<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500" role="img" aria-labelledby="q06-title q06-desc">
  <title id="q06-title">좌표평면 위의 다섯 개의 정비례 직선</title>
  <desc id="q06-desc">원점을 지나는 서로 다른 다섯 개의 직선 l1, l2, l3, l4, l5</desc>
  <rect width="500" height="500" fill="#ffffff"/>
  <line x1="40" y1="250" x2="460" y2="250" stroke="#111827" stroke-width="2"/>
  <polyline points="450,245 460,250 450,255" fill="none" stroke="#111827" stroke-width="2"/>
  <line x1="250" y1="460" x2="250" y2="40" stroke="#111827" stroke-width="2"/>
  <polyline points="245,50 250,40 255,50" fill="none" stroke="#111827" stroke-width="2"/>
  <text x="465" y="255" font-family="sans-serif" font-size="16" font-style="italic" fill="#111827">x</text>
  <text x="250" y="30" font-family="sans-serif" font-size="16" font-style="italic" text-anchor="middle" fill="#111827">y</text>
  <text x="238" y="268" font-family="sans-serif" font-size="14" font-style="italic" fill="#111827">O</text>
  <line x1="100" y1="50" x2="400" y2="450" stroke="#2563eb" stroke-width="2.5"/>
  <text x="95" y="45" font-family="sans-serif" font-size="16" font-weight="bold" fill="#2563eb">l1</text>
  <line x1="50" y1="150" x2="450" y2="350" stroke="#059669" stroke-width="2.5"/>
  <text x="45" y="145" font-family="sans-serif" font-size="16" font-weight="bold" fill="#059669">l2</text>
  <line x1="50" y1="317" x2="450" y2="183" stroke="#d97706" stroke-width="2.5"/>
  <text x="455" y="180" font-family="sans-serif" font-size="16" font-weight="bold" fill="#d97706">l3</text>
  <line x1="70" y1="430" x2="430" y2="70" stroke="#7c3aed" stroke-width="2.5"/>
  <text x="435" y="65" font-family="sans-serif" font-size="16" font-weight="bold" fill="#7c3aed">l4</text>
  <line x1="150" y1="450" x2="350" y2="50" stroke="#dc2626" stroke-width="2.5"/>
  <text x="355" y="45" font-family="sans-serif" font-size="16" font-weight="bold" fill="#dc2626">l5</text>
</svg>