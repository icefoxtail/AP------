<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" width="500" height="120" role="img" aria-labelledby="q11-title q11-desc">
  <title id="q11-title">직선 l 위의 네 점 A, B, C, D</title>
  <desc id="q11-desc">직선 l 위에 네 점 A, B, C, D가 왼쪽부터 순서대로 놓여 있는 모습</desc>
  <rect width="500" height="120" fill="#ffffff"/>
  <line x1="30" y1="60" x2="470" y2="60" stroke="#111827" stroke-width="2.5"/>
  <polyline points="42,52 30,60 42,68" fill="none" stroke="#111827" stroke-width="2.5"/>
  <polyline points="458,52 470,60 458,68" fill="none" stroke="#111827" stroke-width="2.5"/>
  <text x="475" y="55" font-family="sans-serif" font-size="16" font-style="italic" fill="#111827">l</text>
  <circle cx="100" cy="60" r="4.5" fill="#111827"/>
  <text x="100" y="42" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#111827">A</text>
  <circle cx="190" cy="60" r="4.5" fill="#111827"/>
  <text x="190" y="42" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#111827">B</text>
  <circle cx="290" cy="60" r="4.5" fill="#111827"/>
  <text x="290" y="42" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#111827">C</text>
  <circle cx="390" cy="60" r="4.5" fill="#111827"/>
  <text x="390" y="42" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#111827">D</text>
</svg>