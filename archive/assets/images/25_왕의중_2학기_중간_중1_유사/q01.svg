<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500" role="img" aria-labelledby="q01-title q01-desc">
  <title id="q01-title">좌표평면 위의 다섯 점 A, B, C, D, E</title>
  <desc id="q01-desc">좌표평면 위에 점 A(3, 2), B(-3, 4), C(0, -3), D(-4, -2), E(2, -4)가 표시되어 있다.</desc>
  <rect width="500" height="500" fill="#ffffff"/>
  <!-- Grid -->
  <g stroke="#e5e7eb" stroke-width="1">
    <line x1="50" y1="50" x2="50" y2="450"/>
    <line x1="90" y1="50" x2="90" y2="450"/>
    <line x1="130" y1="50" x2="130" y2="450"/>
    <line x1="170" y1="50" x2="170" y2="450"/>
    <line x1="210" y1="50" x2="210" y2="450"/>
    <line x1="290" y1="50" x2="290" y2="450"/>
    <line x1="330" y1="50" x2="330" y2="450"/>
    <line x1="370" y1="50" x2="370" y2="450"/>
    <line x1="410" y1="50" x2="410" y2="450"/>
    <line x1="450" y1="50" x2="450" y2="450"/>
    <line x1="50" y1="50" x2="450" y2="50"/>
    <line x1="50" y1="90" x2="450" y2="90"/>
    <line x1="50" y1="130" x2="450" y2="130"/>
    <line x1="50" y1="170" x2="450" y2="170"/>
    <line x1="50" y1="210" x2="450" y2="210"/>
    <line x1="50" y1="290" x2="450" y2="290"/>
    <line x1="50" y1="330" x2="450" y2="330"/>
    <line x1="50" y1="370" x2="450" y2="370"/>
    <line x1="50" y1="410" x2="450" y2="410"/>
    <line x1="50" y1="450" x2="450" y2="450"/>
  </g>
  <!-- Axes -->
  <line x1="30" y1="250" x2="470" y2="250" stroke="#111827" stroke-width="2"/>
  <polyline points="460,245 470,250 460,255" fill="none" stroke="#111827" stroke-width="2"/>
  <line x1="250" y1="470" x2="250" y2="30" stroke="#111827" stroke-width="2"/>
  <polyline points="245,40 250,30 255,40" fill="none" stroke="#111827" stroke-width="2"/>
  <text x="475" y="255" font-family="sans-serif" font-size="16" font-style="italic" fill="#111827">x</text>
  <text x="250" y="22" font-family="sans-serif" font-size="16" font-style="italic" text-anchor="middle" fill="#111827">y</text>
  <text x="238" y="266" font-family="sans-serif" font-size="14" font-style="italic" fill="#111827">O</text>
  <!-- Points -->
  <circle cx="370" cy="170" r="5" fill="#1d4ed8"/>
  <text x="382" y="165" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1d4ed8">A</text>
  <circle cx="130" cy="90" r="5" fill="#1d4ed8"/>
  <text x="115" y="85" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1d4ed8">B</text>
  <circle cx="250" cy="370" r="5" fill="#1d4ed8"/>
  <text x="265" y="375" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1d4ed8">C</text>
  <circle cx="90" cy="330" r="5" fill="#1d4ed8"/>
  <text x="75" y="345" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1d4ed8">D</text>
  <circle cx="330" cy="410" r="5" fill="#1d4ed8"/>
  <text x="345" y="420" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1d4ed8">E</text>
</svg>