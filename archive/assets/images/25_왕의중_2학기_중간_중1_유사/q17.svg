<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 550 300" width="550" height="300" role="img" aria-labelledby="q17-title q17-desc">
  <title id="q17-title">크기가 같은 각의 작도 과정</title>
  <desc id="q17-desc">컴퍼스와 눈금 없는 자를 이용하여 크기가 같은 각을 옮겨 작도하는 순서</desc>
  <rect width="550" height="300" fill="#ffffff"/>
  <line x1="80" y1="220" x2="240" y2="220" stroke="#111827" stroke-width="2"/>
  <line x1="80" y1="220" x2="200" y2="80" stroke="#111827" stroke-width="2"/>
  <text x="65" y="235" font-family="sans-serif" font-size="16" font-weight="bold" fill="#111827">O</text>
  <text x="245" y="225" font-family="sans-serif" font-size="16" font-style="italic" fill="#111827">X</text>
  <text x="205" y="75" font-family="sans-serif" font-size="16" font-style="italic" fill="#111827">Y</text>
  <path d="M 170,220 A 90 90 0 0 0 143,146" fill="none" stroke="#2563eb" stroke-width="1.8"/>
  <circle cx="170" cy="220" r="3.5" fill="#2563eb"/>
  <text x="175" y="240" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2563eb">A</text>
  <circle cx="143" cy="146" r="3.5" fill="#2563eb"/>
  <text x="130" y="140" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2563eb">B</text>
  <path d="M 135,160 A 75 75 0 0 0 155,135" fill="none" stroke="#d97706" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="175" y="170" font-family="sans-serif" font-size="14" fill="#2563eb">㉠</text>
  <text x="125" y="125" font-family="sans-serif" font-size="14" fill="#d97706">㉡</text>

  <line x1="340" y1="220" x2="500" y2="220" stroke="#111827" stroke-width="2"/>
  <line x1="340" y1="220" x2="460" y2="80" stroke="#dc2626" stroke-width="2"/>
  <text x="325" y="235" font-family="sans-serif" font-size="16" font-weight="bold" fill="#111827">P</text>
  <text x="505" y="225" font-family="sans-serif" font-size="16" font-style="italic" fill="#111827">X'</text>
  <text x="465" y="75" font-family="sans-serif" font-size="16" font-style="italic" fill="#dc2626">Y'</text>
  <path d="M 430,220 A 90 90 0 0 0 403,146" fill="none" stroke="#2563eb" stroke-width="1.8"/>
  <circle cx="430" cy="220" r="3.5" fill="#2563eb"/>
  <text x="435" y="240" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2563eb">C</text>
  <path d="M 395,160 A 75 75 0 0 0 415,135" fill="none" stroke="#d97706" stroke-width="1.8"/>
  <circle cx="403" cy="146" r="3.5" fill="#dc2626"/>
  <text x="390" y="140" font-family="sans-serif" font-size="15" font-weight="bold" fill="#dc2626">D</text>
