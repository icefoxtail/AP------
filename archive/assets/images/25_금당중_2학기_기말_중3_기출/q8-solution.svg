text.ap-pub-label.ap-pub-numeric,text.ap-pub-label[data-label-kind="angle"],text.ap-pub-label[data-label-kind="angle-arc"],text.ap-pub-label[data-label-kind="length"]{font-size:22px!important;stroke-width:4px!important}
</style></svg>
