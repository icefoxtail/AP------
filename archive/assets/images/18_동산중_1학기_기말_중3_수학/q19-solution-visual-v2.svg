<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 708 530" width="708" height="530" role="img" aria-labelledby="title desc"><title id="title">왼쪽으로 한 칸 옮긴 포물선</title><desc id="desc">파란 y=3x²와 왼쪽으로 1만큼 옮긴 주황 점선 포물선이다. 옮긴 포물선의 왼쪽 가지에 (−3, a)가 있다.</desc><rect width="708" height="530" fill="white" /><line x1="146.8324" y1="429.6401" x2="146.8324" y2="187.1722" stroke="#26716e" stroke-width="2.05" stroke-linecap="round" stroke-dasharray="7 6" /><line x1="53.0000" y1="429.6401" x2="647.0000" y2="429.6401" stroke="#4d5d72" stroke-width="1.65" stroke-linecap="round" /><polygon points="647.0000,429.6401 634.0000,424.6401 634.0000,434.6401" fill="#4d5d72" /><text x="664.0000" y="421.6401" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#4d5d72" text-anchor="middle">x</text><line x1="391.6126" y1="465.0000" x2="391.6126" y2="72.0000" stroke="#4d5d72" stroke-width="1.65" stroke-linecap="round" /><polygon points="391.6126,72.0000 386.6126,85.0000 396.6126,85.0000" fill="#4d5d72" /><text x="407.6126" y="78.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#4d5d72" text-anchor="middle">y</text><text x="375.6126" y="457.6401" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#4d5d72" text-anchor="middle">O</text><path d="M 201.5000 100.5567 Q 391.6126 758.7236 581.7253 100.5567" stroke="#205d9c" stroke-width="5.9" stroke-linecap="round" fill="none" /><path d="M 119.9066 100.5567 Q 310.0192 758.7236 500.1319 100.5567" stroke="#aa5411" stroke-width="5.9" stroke-linecap="round" fill="none" stroke-dasharray="15 7" /><circle cx="146.83241758241763" cy="187.17223650385603" r="6.0" fill="white" stroke="#aa5411" stroke-width="3.0" /><text x="98.8324" y="249.1722" font-size="30" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#aa5411" text-anchor="middle">(−3, a)</text><line x1="60.0000" y1="28.0000" x2="104.0000" y2="28.0000" stroke="#205d9c" stroke-width="5.3" stroke-linecap="round" /><text x="118.0000" y="36.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#205d9c" text-anchor="start">y = 3x²</text><line x1="400.0000" y1="28.0000" x2="444.0000" y2="28.0000" stroke="#aa5411" stroke-width="5.3" stroke-linecap="round" stroke-dasharray="15 7" /><text x="458.0000" y="36.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#aa5411" text-anchor="start">왼쪽으로 1 이동</text></svg>
