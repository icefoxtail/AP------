<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 708 530" width="708" height="530" role="img" aria-labelledby="title desc"><title id="title">세로로 평행이동한 같은 포물선</title><desc id="desc">파랑 y=−2x²는 꼭짓점이 원점이다. 주황 점선 포물선은 같은 폭이고 꼭짓점이 위로 올라갔다. 이동한 포물선 위의 점은 (2, −2)이다.</desc><rect width="708" height="530" fill="white" /><line x1="350.0000" y1="244.1319" x2="350.0000" y2="119.6992" stroke="#26716e" stroke-width="2.05" stroke-linecap="round" stroke-dasharray="7 6" /><line x1="512.7397" y1="244.1319" x2="512.7397" y2="285.6095" stroke="#26716e" stroke-width="2.05" stroke-linecap="round" stroke-dasharray="7 6" /><line x1="53.0000" y1="244.1319" x2="647.0000" y2="244.1319" stroke="#4d5d72" stroke-width="1.65" stroke-linecap="round" /><polygon points="647.0000,244.1319 634.0000,239.1319 634.0000,249.1319" fill="#4d5d72" /><text x="664.0000" y="236.1319" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#4d5d72" text-anchor="middle">x</text><line x1="350.0000" y1="465.0000" x2="350.0000" y2="72.0000" stroke="#4d5d72" stroke-width="1.65" stroke-linecap="round" /><polygon points="350.0000,72.0000 345.0000,85.0000 355.0000,85.0000" fill="#4d5d72" /><text x="366.0000" y="78.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#4d5d72" text-anchor="middle">y</text><text x="334.0000" y="272.1319" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#4d5d72" text-anchor="middle">O</text><path d="M 170.9863 444.8834 Q 350.0000 43.3805 529.0137 444.8834" stroke="#205d9c" stroke-width="5.9" stroke-linecap="round" fill="none" /><path d="M 125.4192 435.6588 Q 350.0000 -196.2603 574.5808 435.6588" stroke="#aa5411" stroke-width="5.9" stroke-linecap="round" fill="none" stroke-dasharray="15 7" /><circle cx="350.0" cy="119.69920844327186" r="6.0" fill="white" stroke="#aa5411" stroke-width="3.0" /><text x="326.0000" y="101.6992" font-size="30" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#aa5411" text-anchor="middle">6</text><circle cx="512.7397260273973" cy="285.6094986807388" r="6.0" fill="white" stroke="#aa5411" stroke-width="3.0" /><text x="583.7397" y="303.6095" font-size="30" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#aa5411" text-anchor="middle">(2, −2)</text><line x1="60.0000" y1="28.0000" x2="104.0000" y2="28.0000" stroke="#205d9c" stroke-width="5.3" stroke-linecap="round" /><text x="118.0000" y="36.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#205d9c" text-anchor="start">옮기기 전</text><line x1="400.0000" y1="28.0000" x2="444.0000" y2="28.0000" stroke="#aa5411" stroke-width="5.3" stroke-linecap="round" stroke-dasharray="15 7" /><text x="458.0000" y="36.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#aa5411" text-anchor="start">옮긴 뒤</text></svg>
