<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 690 440" width="690" height="440" role="img" aria-labelledby="title desc"><title id="title">큰 반원과 두 작은 반원 사이의 넓이</title><desc id="desc">A, C, B가 이 순서로 한 직선 위에 있다. AB에 접하는 큰 반원 아래에 AC와 CB를 각각 지름으로 하는 작은 반원 두 개가 있다. 그 사이 주황 부분을 칠했다.</desc><rect width="690" height="440" fill="white" /><path d="M 66 352 A 279.0 279.0 0 0 1 624 352 A 186.0 186.0 0 0 0 252 352 A 93.0 93.0 0 0 0 66 352 Z" fill="#f7d6ae" stroke="none" /><path d="M 66 352 A 279.0 279.0 0 0 1 624 352" stroke="#205d9c" stroke-width="4.9" fill="none" /><path d="M 66 352 A 93.0 93.0 0 0 1 252 352" stroke="#266f73" stroke-width="4.9" fill="none" /><path d="M 252 352 A 186.0 186.0 0 0 1 624 352" stroke="#277339" stroke-width="4.9" fill="none" /><line x1="66.0000" y1="352.0000" x2="624.0000" y2="352.0000" stroke="#586574" stroke-width="3.0" stroke-linecap="round" /><circle cx="66" cy="352" r="4.7" fill="#28364b" /><text x="66.0000" y="383.0000" font-size="30" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">A</text><circle cx="252" cy="352" r="4.7" fill="#28364b" /><text x="252.0000" y="383.0000" font-size="30" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">C</text><circle cx="624" cy="352" r="4.7" fill="#28364b" /><text x="624.0000" y="383.0000" font-size="30" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">B</text></svg>
