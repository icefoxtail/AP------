<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 708 530" width="708" height="530" role="img" aria-labelledby="title desc"><title id="title">제2사분면을 만나지 않는 경계</title><desc id="desc">아래로 열린 두 포물선의 꼭짓점은 (2, 5)이다. 파란 경계 포물선은 원점을 지난다. 더 폭이 좁은 주황 포물선은 y축을 원점 아래에서 지난다. 그 옆의 옅은 영역은 제2사분면이다.</desc><rect width="708" height="530" fill="white" /><polygon points="53.0000,291.4250 222.7143,291.4250 222.7143,72.0000 53.0000,72.0000" fill="#edf4fb" /><line x1="53.0000" y1="291.4250" x2="647.0000" y2="291.4250" stroke="#4d5d72" stroke-width="1.65" stroke-linecap="round" /><polygon points="647.0000,291.4250 634.0000,286.4250 634.0000,296.4250" fill="#4d5d72" /><text x="664.0000" y="283.4250" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#4d5d72" text-anchor="middle">x</text><line x1="222.7143" y1="465.0000" x2="222.7143" y2="72.0000" stroke="#4d5d72" stroke-width="1.65" stroke-linecap="round" /><polygon points="222.7143,72.0000 217.7143,85.0000 227.7143,85.0000" fill="#4d5d72" /><text x="238.7143" y="78.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#4d5d72" text-anchor="middle">y</text><text x="196.7143" y="319.4250" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#4d5d72" text-anchor="middle">O</text><path d="M 168.4057 448.6250 Q 358.4857 -193.2750 548.5657 448.6250" stroke="#205d9c" stroke-width="5.9" stroke-linecap="round" fill="none" /><path d="M 204.3851 448.3142 Q 358.4857 -192.9642 512.5863 448.3142" stroke="#aa5411" stroke-width="5.9" stroke-linecap="round" fill="none" stroke-dasharray="15 7" /><circle cx="358.48571428571427" cy="127.67500000000001" r="6.0" fill="white" stroke="#26716e" stroke-width="3.0" /><text x="379.4857" y="109.6750" font-size="30" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#26716e" text-anchor="middle">(2, 5)</text><text x="130.3897" y="151.2550" font-size="30" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#26716e" text-anchor="middle">제2사분면</text><line x1="60.0000" y1="28.0000" x2="104.0000" y2="28.0000" stroke="#205d9c" stroke-width="5.3" stroke-linecap="round" /><text x="118.0000" y="36.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#205d9c" text-anchor="start">경계 a = −5/4</text><line x1="400.0000" y1="28.0000" x2="444.0000" y2="28.0000" stroke="#aa5411" stroke-width="5.3" stroke-linecap="round" stroke-dasharray="15 7" /><text x="458.0000" y="36.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#aa5411" text-anchor="start">폭이 더 좁은 경우</text></svg>
