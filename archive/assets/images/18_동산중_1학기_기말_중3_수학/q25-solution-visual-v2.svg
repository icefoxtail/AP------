<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 708 530" width="708" height="530" role="img" aria-labelledby="title desc"><title id="title">위치는 달라도 폭이 같은 두 포물선</title><desc id="desc">위로 열린 두 포물선에 파랑 실선과 주황 점선을 썼다. 꼭짓점은 각각 (0, −3), (3, 0)이다. 두 곡선의 굽은 정도가 같다.</desc><rect width="708" height="530" fill="white" /><line x1="53.0000" y1="355.1717" x2="647.0000" y2="355.1717" stroke="#4d5d72" stroke-width="1.65" stroke-linecap="round" /><polygon points="647.0000,355.1717 634.0000,350.1717 634.0000,360.1717" fill="#4d5d72" /><text x="664.0000" y="347.1717" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#4d5d72" text-anchor="middle">x</text><line x1="234.2857" y1="465.0000" x2="234.2857" y2="72.0000" stroke="#4d5d72" stroke-width="1.65" stroke-linecap="round" /><polygon points="234.2857,72.0000 229.2857,85.0000 239.2857,85.0000" fill="#4d5d72" /><text x="250.2857" y="78.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#4d5d72" text-anchor="middle">y</text><text x="218.2857" y="383.1717" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#4d5d72" text-anchor="middle">O</text><path d="M 82.3143 126.4457 Q 234.2857 742.6856 386.2571 126.4457" stroke="#205d9c" stroke-width="5.9" stroke-linecap="round" fill="none" /><path d="M 324.5429 89.2894 Q 465.7143 621.0541 606.8857 89.2894" stroke="#aa5411" stroke-width="5.9" stroke-linecap="round" fill="none" stroke-dasharray="15 7" /><circle cx="234.2857142857143" cy="434.5656565656566" r="6.0" fill="white" stroke="#205d9c" stroke-width="3.0" /><text x="161.2857" y="452.5657" font-size="30" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#205d9c" text-anchor="middle">(0, −3)</text><circle cx="465.7142857142857" cy="355.17171717171715" r="6.0" fill="white" stroke="#aa5411" stroke-width="3.0" /><text x="516.7143" y="384.1717" font-size="30" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#aa5411" text-anchor="middle">(3, 0)</text><line x1="60.0000" y1="28.0000" x2="104.0000" y2="28.0000" stroke="#205d9c" stroke-width="5.3" stroke-linecap="round" /><text x="118.0000" y="36.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#205d9c" text-anchor="start">y = 3x² − 3</text><line x1="400.0000" y1="28.0000" x2="444.0000" y2="28.0000" stroke="#aa5411" stroke-width="5.3" stroke-linecap="round" stroke-dasharray="15 7" /><text x="458.0000" y="36.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#aa5411" text-anchor="start">y = 3(x − 3)²</text></svg>
