<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 708 530" width="708" height="530" role="img" aria-labelledby="title desc"><title id="title">꼭짓점이 놓이는 직선 찾기</title><desc id="desc">왼쪽 아래의 점은 두 직선 y=2x, y=x/2−3의 교점이다. 파란 포물선의 꼭짓점은 두 직선이 교차하는 점 (−2, −4)이다.</desc><rect width="708" height="530" fill="white" /><line x1="160.3250" y1="459.9108" x2="608.5250" y2="84.4403" stroke="#26716e" stroke-width="2.05" stroke-linecap="round" stroke-dasharray="8 5" /><line x1="66.5000" y1="402.7986" x2="633.5000" y2="284.0504" stroke="#aa5411" stroke-width="2.05" stroke-linecap="round" /><line x1="53.0000" y1="244.4676" x2="647.0000" y2="244.4676" stroke="#4d5d72" stroke-width="1.65" stroke-linecap="round" /><polygon points="647.0000,244.4676 634.0000,239.4676 634.0000,249.4676" fill="#4d5d72" /><text x="664.0000" y="236.4676" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#4d5d72" text-anchor="middle">x</text><line x1="417.5000" y1="465.0000" x2="417.5000" y2="72.0000" stroke="#4d5d72" stroke-width="1.65" stroke-linecap="round" /><polygon points="417.5000,72.0000 412.5000,85.0000 422.5000,85.0000" fill="#4d5d72" /><text x="433.5000" y="78.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#4d5d72" text-anchor="middle">y</text><text x="436.5000" y="272.4676" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#4d5d72" text-anchor="middle">O</text><path d="M 94.1750 137.4783 Q 282.5000 577.6440 470.8250 137.4783" stroke="#205d9c" stroke-width="5.9" stroke-linecap="round" fill="none" /><circle cx="282.5" cy="357.5611510791367" r="6.0" fill="white" stroke="#744ca0" stroke-width="3.0" /><text x="321.5000" y="405.5612" font-size="30" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#744ca0" text-anchor="middle">(−2, −4)</text><line x1="60.0000" y1="28.0000" x2="104.0000" y2="28.0000" stroke="#26716e" stroke-width="5.3" stroke-linecap="round" stroke-dasharray="8 5" /><text x="118.0000" y="36.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#26716e" text-anchor="start">꼭짓점의 자취</text><line x1="400.0000" y1="28.0000" x2="444.0000" y2="28.0000" stroke="#aa5411" stroke-width="5.3" stroke-linecap="round" /><text x="458.0000" y="36.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#aa5411" text-anchor="start">주어진 직선</text></svg>
