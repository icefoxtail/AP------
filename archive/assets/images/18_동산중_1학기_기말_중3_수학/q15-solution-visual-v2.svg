<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 708 530" width="708" height="530" role="img" aria-labelledby="title desc"><title id="title">두 포물선의 가로축 대칭</title><desc id="desc">파란 y=2x²가 위로 열리며 꼭짓점은 O이다. 같은 x=2에서 점 (2, 8)을 표시했다. 주황 점선 y=−2x²는 가로축 아래에 있고 두 그래프가 가로축에 대칭이다.</desc><rect width="708" height="530" fill="white" /><line x1="552.0408" y1="431.4016" x2="552.0408" y2="105.5984" stroke="#277339" stroke-width="2.05" stroke-linecap="round" stroke-dasharray="6 5" /><line x1="53.0000" y1="268.5000" x2="647.0000" y2="268.5000" stroke="#4d5d72" stroke-width="1.65" stroke-linecap="round" /><polygon points="647.0000,268.5000 634.0000,263.5000 634.0000,273.5000" fill="#4d5d72" /><text x="664.0000" y="260.5000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#4d5d72" text-anchor="middle">x</text><line x1="350.0000" y1="465.0000" x2="350.0000" y2="72.0000" stroke="#4d5d72" stroke-width="1.65" stroke-linecap="round" /><polygon points="350.0000,72.0000 345.0000,85.0000 355.0000,85.0000" fill="#4d5d72" /><text x="366.0000" y="78.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#4d5d72" text-anchor="middle">y</text><text x="334.0000" y="296.5000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#4d5d72" text-anchor="middle">O</text><path d="M 135.8367 85.4638 Q 350.0000 451.5362 564.1633 85.4638" stroke="#205d9c" stroke-width="5.9" stroke-linecap="round" fill="none" /><path d="M 135.8367 451.5362 Q 350.0000 85.4638 564.1633 451.5362" stroke="#aa5411" stroke-width="5.9" stroke-linecap="round" fill="none" stroke-dasharray="15 7" /><circle cx="552.0408163265306" cy="105.59844559585497" r="6.0" fill="white" stroke="#205d9c" stroke-width="3.0" /><text x="603.0408" y="125.5984" font-size="30" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#205d9c" text-anchor="middle">(2, 8)</text><circle cx="552.0408163265306" cy="431.4015544041451" r="6.0" fill="white" stroke="#aa5411" stroke-width="3.0" /><line x1="60.0000" y1="28.0000" x2="104.0000" y2="28.0000" stroke="#205d9c" stroke-width="5.3" stroke-linecap="round" /><text x="118.0000" y="36.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#205d9c" text-anchor="start">y = 2x²</text><line x1="400.0000" y1="28.0000" x2="444.0000" y2="28.0000" stroke="#aa5411" stroke-width="5.3" stroke-linecap="round" stroke-dasharray="15 7" /><text x="458.0000" y="36.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#aa5411" text-anchor="start">y = −2x²</text></svg>
