<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 676 522" width="676" height="522" role="img" aria-labelledby="title desc"><title id="title">한 변을 공유하는 두 닮은 직사각형</title><desc id="desc">큰 직사각형 ABCD 안에 작은 직사각형 FCDE가 있다. E와 F로 이은 세로선으로 두 부분을 나눴다. 왼쪽 AB와 아래 첫 구간 BF는 각각 1이고 밑변 BC를 x로 표시했다. 작은 직사각형의 가로 FC는 x−1이다. 길이가 1인 AB, BF, CD에 같은 색과 눈금을 썼다.</desc><rect width="676" height="522" fill="white" /><polygon points="76.0000,77.6374 76.0000,390.3626 388.7252,390.3626 388.7252,77.6374" fill="#e1eefb" /><polygon points="388.7252,390.3626 582.0000,390.3626 582.0000,77.6374 388.7252,77.6374" fill="#fae6ce" /><line x1="76.0000" y1="77.6374" x2="76.0000" y2="390.3626" stroke="#266f73" stroke-width="4.15" stroke-linecap="round" /><line x1="76.0000" y1="390.3626" x2="388.7252" y2="390.3626" stroke="#266f73" stroke-width="4.15" stroke-linecap="round" /><line x1="388.7252" y1="390.3626" x2="582.0000" y2="390.3626" stroke="#aa5411" stroke-width="4.15" stroke-linecap="round" /><line x1="582.0000" y1="390.3626" x2="582.0000" y2="77.6374" stroke="#266f73" stroke-width="4.15" stroke-linecap="round" /><line x1="582.0000" y1="77.6374" x2="388.7252" y2="77.6374" stroke="#586574" stroke-width="4.15" stroke-linecap="round" /><line x1="388.7252" y1="77.6374" x2="76.0000" y2="77.6374" stroke="#586574" stroke-width="4.15" stroke-linecap="round" /><line x1="388.7252" y1="77.6374" x2="388.7252" y2="390.3626" stroke="#586574" stroke-width="4.15" stroke-linecap="round" /><line x1="76.0000" y1="93.6374" x2="92.0000" y2="93.6374" stroke="#586574" stroke-width="1.8" stroke-linecap="round" /><line x1="92.0000" y1="93.6374" x2="92.0000" y2="77.6374" stroke="#586574" stroke-width="1.8" stroke-linecap="round" /><line x1="76.0000" y1="374.3626" x2="92.0000" y2="374.3626" stroke="#586574" stroke-width="1.8" stroke-linecap="round" /><line x1="92.0000" y1="374.3626" x2="92.0000" y2="390.3626" stroke="#586574" stroke-width="1.8" stroke-linecap="round" /><line x1="372.7252" y1="390.3626" x2="372.7252" y2="374.36