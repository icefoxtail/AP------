<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 688 534" width="688" height="534" role="img" aria-labelledby="title desc"><title id="title">꼭짓점과 세로축에서 읽는 이차함수</title><desc id="desc">위로 열린 파란 포물선은 세로축의 3을 지나고 꼭짓점은 (2, −1)이다. 초록 점선이 꼭짓점에서 가로축의 2와 세로축의 −1을 잇는다.</desc><rect width="688" height="534" fill="white" /><line x1="54.0000" y1="380.4444" x2="638.0000" y2="380.4444" stroke="#4d5d72" stroke-width="1.65" stroke-linecap="round" /><polygon points="638.0000,380.4444 625.0000,375.4444 625.0000,385.4444" fill="#4d5d72" /><text x="655.0000" y="372.4444" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#4d5d72" text-anchor="middle">x</text><line x1="161.4421" y1="470.0000" x2="161.4421" y2="67.0000" stroke="#4d5d72" stroke-width="1.65" stroke-linecap="round" /><polygon points="161.4421,67.0000 156.4421,80.0000 166.4421,80.0000" fill="#4d5d72" /><text x="177.4421" y="73.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#4d5d72" text-anchor="middle">y</text><circle cx="161.44213649851633" cy="380.44444444444446" r="4.6" fill="#28364b" /><text x="146.4421" y="407.4444" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">O</text><line x1="161.4421" y1="423.0899" x2="334.7359" y2="423.0899" stroke="#277339" stroke-width="2.1" stroke-linecap="round" stroke-dasharray="7 6" /><line x1="334.7359" y1="423.0899" x2="334.7359" y2="380.4444" stroke="#277339" stroke-width="2.1" stroke-linecap="round" stroke-dasharray="7 6" /><path d="M 93.8576 93.5084 Q 334.7359 752.6714 575.6142 93.5084" stroke="#205d9c" stroke-width="6.1" stroke-linecap="round" fill="none" /><line x1="334.7359" y1="374.4444" x2="334.7359" y2="386.4444" stroke="#4d5d72" stroke-width="1.6" stroke-linecap="round" /><text x="334.7359" y="363.4444" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#4d5d72" text-anchor="middle">2</text><line x1="155.4421" y1="423.0899" x2="167.4421" y2="423.0899" stroke="#4d5d72" stroke-width="1.6" stroke-linecap="round" /><text x="134.4421" y="434.0899" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#4d5d72" text-anchor="middle">−1</text><line x1="155.4421" y1="252.5079" x2="167.4421" y2="252.5079" stroke="#4d5d72" stroke-width="1.6" stroke-linecap="round" /><text x="139.4421" y="263.5079" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#4d5d72" text-anchor="middle">3</text><circle cx="334.7359050445104" cy="423.0899470899471" r="6.0" fill="white" stroke="#277339" stroke-width="3.0" /><circle cx="161.44213649851633" cy="252.50793650793653" r="6.0" fill="white" stroke="#205d9c" stroke-width="3.0" /><line x1="65.0000" y1="38.0000" x2="110.0000" y2="38.0000" stroke="#205d9c" stroke-width="5.5" stroke-linecap="round" /><text x="123.0000" y="47.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#205d9c" text-anchor="start">y = (x − 2)² − 1</text></svg>
