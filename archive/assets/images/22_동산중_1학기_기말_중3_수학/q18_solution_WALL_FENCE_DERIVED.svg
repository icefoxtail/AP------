<svg xmlns="http://www.w3.org/2000/svg" width="920" height="470" viewBox="0 0 920 470">
<rect width="920" height="470" fill="white"/>
<text x="30" y="48" font-family="NanumGothic" font-size="26" font-weight="bold" fill="#1e293b">q18  담장을 이용한 직사각형 놀이터</text>
<rect x="144" y="92" width="412" height="45" fill="#e5e7eb"/>
<g stroke="#9ca3af" stroke-width="2"> <path d="M145,135 l42,-43 M190,135 l42,-43 M235,135 l42,-43 M280,135 l42,-43 M325,135 l42,-43 M370,135 l42,-43 M415,135 l42,-43 M460,135 l42,-43 M505,135 l42,-43"/> </g>
<text x="333" y="123" font-family="NanumGothic" font-size="22" fill="#374151">담장 (철망 불필요)</text>
<rect x="175" y="136" width="354" height="220" fill="#f0f9ff" stroke="none"/>
<path d="M175 136 V356 H529 V136" stroke="#e11d48" stroke-width="6" fill="none" stroke-linecap="round"/>
<path d="M162 136 h-22 M162 356 h-22 M146 136 V356" stroke="#334155" stroke-width="1.8" fill="none"/>
<path d="M141 150 L146 137 L151 150 M141 342 L146 355 L151 342" fill="none" stroke="#334155" stroke-width="2"/>
<text x="111" y="252" font-family="NanumGothic" font-size="28" font-style="italic" fill="#334155">x</text>
<text x="298" y="387" font-family="NanumGothic" font-size="26" fill="#e11d48">20 - 2x</text>
<text x="273" y="258" font-family="NanumGothic" font-size="29" fill="#1d4ed8">넓이 48 m²</text>
<text x="593" y="160" font-family="NanumGothic" font-size="23" fill="#0f172a">철망 길이: 2x + y = 20</text>
<text x="593" y="205" font-family="NanumGothic" font-size="23" fill="#0f172a">y = 20 - 2x</text>
<text x="593" y="250" font-family="NanumGothic" font-size="23" fill="#0f172a">x(20 - 2x) = 48</text>
<text x="593" y="295" font-family="NanumGothic" font-size="23" fill="#0f172a">(x - 4)(x - 6) = 0</text>
<text x="593" y="342" font-family="NanumGothic" font-size="24" font-weight="bold" fill="#0f766e">x = 4, 6  →  합 10 (④)</text>
<text x="30" y="446" font-family="NanumGothic" font-size="17" fill="#64748b">해설용 도식 · 원본 q18.png는 그대로 보존 · 빨간색은 철망 3변</text>
</svg>