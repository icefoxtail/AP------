<text x="461.0" y="151.0" font-family="NanumGothic" font-size="21" font-weight="bold" fill="#1d4ed8">(3, 6)</text>
<text x="448.0" y="503.0" font-family="NanumGothic" font-size="21" font-weight="bold" fill="#be123c">(3, -6)</text>
<text x="152" y="124" font-family="NanumGothic" font-size="21" font-weight="bold" fill="#1d4ed8">y = (2/3)x²</text>
<text x="92" y="508" font-family="NanumGothic" font-size="21" font-weight="bold" fill="#be123c">y = -(2/3)x²</text>
<text x="344" y="344" font-family="NanumGothic" font-size="16" fill="#334155">O</text>
<text x="650" y="89" font-family="NanumGothic" font-size="22" font-weight="bold" fill="#0f172a">① x축 대칭</text>
<text x="650" y="127" font-family="NanumGothic" font-size="19" font-weight="normal" fill="#334155">음수 부호만 바뀝니다.</text>
<text x="650" y="165" font-family="NanumGothic" font-size="21" font-weight="bold" fill="#be123c">y = -(2/3)x²</text>
<text x="650" y="200" font-family="NanumGothic" font-size="20" font-weight="normal" fill="#64748b">↓   x축 반사</text>
<text x="650" y="237" font-family="NanumGothic" font-size="21" font-weight="bold" fill="#1d4ed8">y = +(2/3)x²</text>
<text x="650" y="301" font-family="NanumGothic" font-size="21" font-weight="bold" fill="#0f172a">② 점 (3, b)를 대입</text>
<text x="650" y="339" font-family="NanumGothic" font-size="20" font-weight="normal" fill="#334155">b = (2/3) × 3²</text>
<text x="650" y="374" font-family="NanumGothic" font-size="22" font-weight="bold" fill="#1d4ed8">b = 6</text>
<text x="650" y="438" font-family="NanumGothic" font-size="21" font-weight="bold" fill="#0f172a">③ a와 b의 곱</text>
<text x="650" y="476" font-family="NanumGothic" font-size="20" font-weight="normal" fill="#334155">a = 2/3,  b = 6</text>
<text x="650" y="522" font-family="NanumGothic" font-size="26" font-weight="bold" fill="#047857">ab = 4</text>
<text x="26" y="610" font-family="NanumGothic" font-size="17" fill="#64748b">해설용 신규 SVG · 원본 q25는 그림 없는 발문이며 원문·보기는 그대로 보존합니다.</text>
