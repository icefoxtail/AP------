<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 460" width="460" height="460" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">원탁에서는 회전하여 같은 자리가 되는 배치를 한 가지로 센다. 한 학생의 자리를 고정하면 나머지 5명의 자리를 배열하는 방법만 세면 된다. 이때 경우의 수는 5! = 5×4×3×2×1 = 120이다. 따라서 답은 ②이다.</title><desc id="visual-desc">원 모양의 탁자 둘레에 여섯 개의 점이 같은 간격으로 놓여 있고, 중심에서 각 점으로 점선이 뻗어 있으며 그 점선마다 1부터 6까지의 번호가 붙어 있다. 한 자리 옆의 파란 호에는 고정, 이웃한 자리 사이의 보라색 호에는 회전이라고 적혀 있다.</desc><rect width="460" height="460" fill="#fff"/><g data-layer="30"><line id="s1" data-role="line" stroke="#111" stroke-width="1.6" fill="none" stroke-dasharray="6 4" x1="252.699107902" y1="230" x2="252.699107902" y2="82.00945273"/></g><g data-layer="30"><line id="s2" data-role="line" stroke="#111" stroke-width="1.6" fill="none" stroke-dasharray="6 4" x1="252.699107902" y1="230" x2="124.535534447" y2="156.004726365"/></g><g data-layer="30"><line id="s3" data-role="line" stroke="#111" stroke-width="1.6" fill="none" stroke-dasharray="6 4" x1="252.699107902" y1="230" x2="124.535534447" y2="303.995273635"/></g><g data-layer="30"><line id="s4" data-role="line" stroke="#111" stroke-width="1.6" fill="none" stroke-dasharray="6 4" x1="252.699107902" y1="230" x2="252.699107902" y2="377.99054727"/></g><g data-layer="30"><line id="s5" data-role="line" stroke="#111" stroke-width="1.6" fill="none" stroke-dasharray="6 4" x1="252.6991