<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 470" width="700" height="470" role="img" aria-labelledby="title desc">
<title id="title">정육각형 꼭짓점을 잇는 선분의 길이 분류</title>
<desc id="desc">변 6개는 길이 1이고, 나머지 대각선 9개는 길이가 1보다 크다.</desc>
<rect width="700" height="470" fill="#ffffff"/>
<text x="36" y="42" font-family="sans-serif" font-size="22" font-weight="700" fill="#0f172a">정육각형 꼭짓점 사이의 선분</text>
<text x="36" y="69" font-family="sans-serif" font-size="14" fill="#475569">서로 다른 두 꼭짓점을 잇는 15개 선분을 분류한다.</text>
<line id="side-0-1" data-kind="side" x1="300.000000000" y1="90.000000000" x2="421.243556530" y2="160.000000000" stroke="#334155" stroke-width="3" stroke-linecap="round"/>
