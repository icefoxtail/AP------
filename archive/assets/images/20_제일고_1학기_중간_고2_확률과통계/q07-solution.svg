<line id="side-2-3" data-kind="side" x1="421.243556530" y1="300.000000000" x2="300.000000000" y2="370.000000000" stroke="#334155" stroke-width="3" stroke-linecap="round"/>
<line id="side-3-4" data-kind="side" x1="300.000000000" y1="370.000000000" x2="178.756443470" y2="300.000000000" stroke="#334155" stroke-width="3" stroke-linecap="round"/>
<line id="side-4-5" data-kind="side" x1="178.756443470" y1="300.000000000" x2="178.756443470" y2="160.000000000" stroke="#334155" stroke-width="3" stroke-linecap="round"/>
<line id="diag-short-0-2" data-kind="diagonal" data-length-class="sqrt3" x1="300.000000000" y1="90.000000000" x2="421.243556530" y2="300.000000000" stroke="#d97706" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="7 4"/>
<line id="diag-short-0-4" data-kind="diagonal" data-length-class="sqrt3" x1="300.000000000" y1="90.000000000" x2="178.756443470" y2="300.000000000" stroke="#d97706" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="7 4"/>
<line id="diag-short-1-3" data-kind="diagonal" data-length-class="sqrt3" x1="421.243556530" y1="160.000000000" x2="300.000000000" y2="370.000000000" stroke="#d97706" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="7 4"/>
<line id="diag-short-1-5" data-kind="diagonal" data-length-class="sqrt3" x1="421.243556530" y1="160.000000000" x2="178.756443470" y2="160.000000000" stroke="#d97706" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="7 4"/>
<line id="diag-short-2-4" data-kind="diagonal" data-length-class="sqrt3" x1="421.243556530" y1="300.000000000" x2="178.756443470" y2="300.000000000" stroke="#d97706" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="7 4"/>
<line id="diag-short-3-5" data-kind="diagonal" data-length-class="sqrt3" x1="300.000000000" y1="370.000000000" x2="178.756443470" y2="160.000000000" stroke="#d97706" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="7 4"/>
<line id="diag-long-0-3" data-kind="diagonal" data-length-class="2" x1="300.000000000" y1="90.000000000" x2="300.000000000" y2="370.000000000" stroke="#b91c1c" stroke-width="3.5" stroke-linecap="round"/>
<line id="diag-long-1-4" data-kind="diagonal" data-length-class="2" x1="421.243556530" y1="160.000000000" x2="178.756443470" y2="300.000000000" stroke="#b91c1c" stroke-width="3.5" stroke-linecap="round"/>
<line id="diag-long-2-5" data-kind="diagonal" data-length-class="2" x1="421.243556530" y1="300.000000000" x2="178.756443470" y2="160.000000000" stroke="#b91c1c" stroke-width="3.5" stroke-linecap="round"/>
