<circle id="vertex-5" data-kind="vertex" cx="178.756443470" cy="160.000000000" r="6" fill="#0f172a" stroke="#ffffff" stroke-width="2"/>
<line x1="480" y1="146" x2="520" y2="146" stroke="#334155" stroke-width="3"/>
<text x="534" y="151" font-family="sans-serif" font-size="15" fill="#0f172a">변 6개: 길이 1</text>
<line x1="480" y1="192" x2="520" y2="192" stroke="#d97706" stroke-width="2.5" stroke-dasharray="7 4"/>
<text x="534" y="197" font-family="sans-serif" font-size="15" fill="#0f172a">대각선 6개: 길이 √3</text>
<line x1="480" y1="238" x2="520" y2="238" stroke="#b91c1c" stroke-width="3.5"/>
<text x="534" y="243" font-family="sans-serif" font-size="15" fill="#0f172a">대각선 3개: 길이 2</text>
<rect x="475" y="286" width="200" height="78" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="493" y="318" font-family="sans-serif" font-size="16" font-weight="700" fill="#0f172a">길이 1보다 큰 선분</text>
<text x="493" y="346" font-family="sans-serif" font-size="17" fill="#b91c1c">6 + 3 = 9개</text>
</svg>
