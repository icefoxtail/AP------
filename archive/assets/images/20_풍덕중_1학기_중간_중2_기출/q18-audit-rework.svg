<svg xmlns="http://www.w3.org/2000/svg" width='320' height='260' viewBox='0 0 160 130' role="img" aria-labelledby="student-title student-desc"><title id="student-title">원에 내접하는 삼각형과 외심 O</title><desc id="student-desc">삼각형 ABC의 꼭짓점 A에서 변 AB와 선분 AO 사이, 그리고 AO와 변 AC 사이의 각이 표시되어 있다.</desc><circle cx='80' cy='65' r='50' fill='none' stroke='black'/><path d='M80,15 L36.70,90 L129.24,73.68 Z M80,65 L80,15 M80,65 L36.70,90 M80,65 L129.24,73.68' fill='none' stroke='black'/><path d='M71.5 29.7 A17 17 0 0 0 80 32 M80 32 A17 17 0 0 0 91 28' fill='none' stroke='#b42318' stroke-width='1.2'/><text x='75' y='69' font-size='10'>O</text><text x='49' y='42' font-size='11' font-weight='bold'>30°</text><text x='96' y='42' font-size='11' font-weight='bold'>40°</text><text x='76' y='12' font-size='10'>A</text><text x='27' y='96' font-size='10'>B</text><text x='132' y='78' font-size='10'>C</text></svg>