<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 360" width="440" height="360" role="img" aria-labelledby="title desc" data-visual-provenance="REPAIR_MASTER_DETERMINISTIC_RECONSTRUCTION|M2-1-20-PUNGDEOK-1MID|q17">
<title id="title">삼각형 ABC의 내접원과 접점 D, E, F</title>
<desc id="desc">원본 픽셀을 복제한 그림이 아니라 현재 문항의 수학 조건으로 결정론적으로 재구성한 도형. 내접원이 AB, BC, CA에 각각 D, E, F에서 접하고 중심은 I이다.</desc>
<style>
.main{fill:none;stroke:#111;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.aux{fill:none;stroke:#555;stroke-width:1.5}
.dot{fill:#111}
.label{font:16px system-ui,sans-serif;fill:#111}
.len{font:14px system-ui,sans-serif;fill:#222}
.note{font:13px system-ui,sans-serif;fill:#333}
</style>
<path class="main" d="M348.57 60.36 L80 300 L360 300 Z"/>
<circle class="main" cx="280" cy="223.75" r="76.25"/>
<path class="aux" d="M280 223.75 L229.21 166.87 M280 223.75 L280 300 M280 223.75 L356.19 220.12"/>
<g class="dot">
<circle cx="348.57" cy="60.36" r="3.2"/><circle cx="80" cy="300" r="3.2"/><circle cx="360" cy="300" r="3.2"/>
<circle cx="229.21" cy="166.87" r="3"/><circle cx="280" cy="300" r="3"/><circle cx="356.19" cy="220.12" r="3"/><circle cx="280" cy="223.75" r="3"/>
</g>
<g class="label">
<text x="350" y="43" text-anchor="middle">A</text><text x="62" y="320">B</text><text x="368" y="320">C</text>
<text x="214" y="160">D</text><text x="278" y="323">E</text><text x="365" y="217">F</text><text x="263" y="219">I</text>
</g>
<g class="len">
<text x="292" y="112">AD=4</text><text x="135" y="242">DB=5</text><text x="319" y="320">EC=x</text>
</g>
<text class="note" x="220" y="348" text-anchor="middle">D·E·F는 내접원의 접점</text>
</svg>
