<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" width="560" height="380" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">가운데 세로 철망을 공유하여 나란히 붙어 있는 두 직사각형 모양의 꽃밭이 보인다. 전체 가로 길이를 x, 세로 길이를 y라 하고, 사용한 철망의 총길이는 240 m이다.</title><desc id="visual-desc">바깥 직사각형이 가운데 세로 칸막이로 둘로 나뉘어 두 꽃밭이 서로 다른 색으로 칠해져 있다. 아래 가로변에 x, 왼쪽 세로변에 y가 표시되어 있다.</desc><rect width="560" height="380" fill="#fff"/><g data-layer="10"><path id="leftGarden" data-role="region" stroke="none" stroke-width="1.6" fill="#f2a65a" data-owner-points="A B C F" data-mark="region" data-mark-id="leftGarden" fill-opacity="0.42" fill-rule="evenodd" d="M79.152542373 56.101694915 L79.152542373 323.898305085 L280 323.898305085 L280 56.101694915 L79.152542373 56.101694915 Z"/></g><g data-layer="10"><path id="rightGarden" data-role="region" stroke="none" stroke-width="1.6" fill="#7fa6e8" data-owner-points="C D E F" data-mark="region" data-mark-id="rightGarden" fill-opacity="0.32" fill-rule="evenodd" d="M280 56.101694915 L280 323.898305085 L480.847457627 323.898305085 L480.847457627 56.101694915 L280 56.101694915 Z"/></g><g data-layer="30"><line id="sAB" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="79.152542373" y1="56.101694915" x2="79.152542373" y2="323.898305085"/></g><g data-layer="30"><line id="sBD" data-role="line" stroke="#111" stroke-width="1.6" fill="none"