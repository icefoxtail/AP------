<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 704 546" width="704" height="546" role="img" aria-labelledby="title desc"><title id="title">두 포물선이 둘러싸는 가로 방향 영역</title><desc id="desc">파란 위쪽 경계 y=3x²와 주황 아래쪽 경계 y=−x²가 원점에서 만난다. 각 x에서 두 곡선 사이에 해당하는 영역을 연두색과 옅은 빗금으로 표시했다.</desc><rect width="704" height="546" fill="white" /><defs><clipPath id="plot-window"><rect x="54" y="85" width="592" height="374" /></clipPath><pattern id="slanted-marks" patternUnits="userSpaceOnUse" width="13" height="13" patternTransform="rotate(45)"><rect x="0" y="0" width="13" height="13" fill="#eaf4eb" /><line x1="0" x2="0" y1="0" y2="13" stroke="#a8cabb" stroke-width="2" /></pattern></defs><path d="M 54.0000 -744.2335 Q 350.0000 1298.5271 646.0000 -744.2335 L 646.0000 617.6069 Q 350.0000 -63.3133 54.0000 617.6069 Z" clip-path="url(#plot-window)" fill="url(#slanted-marks)" stroke="none" /><line x1="54.0000" y1="277.1468" x2="646.0000" y2="277.1468" stroke="#4d5d72" stroke-width="1.65" stroke-linecap="round" /><polygon points="646.0000,277.1468 633.0000,272.1468 633.0000,282.1468" fill="#4d5d72" /><text x="663.0000" y="269.1468" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#4d5d72" text-anchor="middle">x</text><line x1="350.0000" y1="459.0000" x2="350.0000" y2="85.0000" stroke="#4d5d72" stroke-width="1.65" stroke-linecap="round" /><polygon points="350.0000,85.0000 345.0000,98.0000 355.0000,98.0000" fill="#4d5d72" /><text x="366.0000" y="91.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#4d5d72" text-anchor="middle">y</text><circle cx="350.0" cy="277.14678899082566" r="4.6" fill="#28364b" /><text x="335.0000" y="304.1468" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">O</text><path d="M 224.8657 94.6073 Q 350.0000 459.6862 475.1343 94.6073" stroke="#205d9c" stroke-width="6.1" stroke-linecap="round" fill="none" /><path d="M 138.8326 450.4220 Q 350.0000 103.8716 561.1674 450.4220" stroke="#aa5411" stroke-width="6" stroke-linecap="round" fill="none" stroke-dasharray="15 7" /><line x1="67.0000" y1="40.0000" x2="118.0000" y2="40.0000" stroke="#205d9c" stroke-width="5.5" stroke-linecap="round" /><text x="129.0000" y="48.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#205d9c" text-anchor="start">y = 3x²</text><line x1="400.0000" y1="40.0000" x2="451.0000" y2="40.0000" stroke="#aa5411" stroke-width="5.5" stroke-linecap="round" stroke-dasharray="15 7" /><text x="462.0000" y="48.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#aa5411" text-anchor="start">y = −x²</text></svg>
