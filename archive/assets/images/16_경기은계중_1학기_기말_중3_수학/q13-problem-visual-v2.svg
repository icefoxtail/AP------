<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 705 365" width="705" height="365" role="img" aria-labelledby="title desc"><title id="title">오른쪽 위로 향하는 일차함수</title><desc id="desc">직선 y=ax+b는 오른쪽으로 갈수록 높아진다. 직선은 y축의 양의 부분과 x축의 음의 부분을 지난다.</desc><rect width="705" height="365" fill="white" /><line x1="85.6920" y1="268.5238" x2="620.4993" y2="105.9857" stroke="#205d9c" stroke-width="5.9" stroke-linecap="round" /><line x1="53.0000" y1="223.6857" x2="649.0000" y2="223.6857" stroke="#4d5d72" stroke-width="1.65" stroke-linecap="round" /><polygon points="649.0000,223.6857 636.0000,218.6857 636.0000,228.6857" fill="#4d5d72" /><text x="666.0000" y="215.6857" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#4d5d72" text-anchor="middle">x</text><line x1="358.9634" y1="294.0000" x2="358.9634" y2="80.0000" stroke="#4d5d72" stroke-width="1.65" stroke-linecap="round" /><polygon points="358.9634,80.0000 353.9634,93.0000 363.9634,93.0000" fill="#4d5d72" /><text x="374.9634" y="86.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#4d5d72" text-anchor="middle">y</text><text x="337.9634" y="251.6857" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#4d5d72" text-anchor="middle">O</text><line x1="64.0000" y1="39.0000" x2="114.0000" y2="39.0000" stroke="#205d9c" stroke-width="5.4" stroke-linecap="round" /><text x="126.0000" y="47.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#205d9c" text-anchor="start">y = ax + b</text></svg>
