<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 567" width="700" height="567" role="img" aria-labelledby="title desc"><title id="title">원의 가운데 지름 위에서 만나는 두 반원</title><desc id="desc">지름 2a+2인 원을 나눴다. 왼쪽 지름 2a의 반원은 위로, 오른쪽 지름 2의 반원은 아래로 향한다. 원 속 주황 영역이 색칠된 부분이다.</desc><rect width="700" height="567" fill="white" /><path d="M 162.500 281.000 A 115.500 115.500 0 0 1 393.500 281.000 A 70.000 70.000 0 0 0 533.500 281.000 A 185.500 185.500 0 0 1 162.500 281.000 Z" fill="none" /><circle cx="348" cy="281" r="185.5" fill="none" stroke="#205d9c" stroke-width="4.35" /><path d="M 162.500 281.000 A 115.500 115.500 0 0 1 393.500 281.000" fill="none" stroke="#aa5411" stroke-width="4.05" /><path d="M 393.500 281.000 A 70.000 70.000 0 0 0 533.500 281.000" fill="none" stroke="#aa5411" stroke-width="4.05" /><line x1="162.5000" y1="281.0000" x2="533.5000" y2="281.0000" stroke="#586574" stroke-width="2.15" stroke-linecap="round" /><circle cx="348" cy="281" r="4.6" fill="#28364b" /><circle cx="393.5" cy="281" r="4.6" fill="#28364b" /><text x="332.0000" y="310.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">O</text><text x="278.0000" y="316.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#586574" text-anchor="middle">2a</text><text x="463.5000" y="255.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#586574" text-anchor="middle">2</text><line x1="162.5000" y1="66.5000" x2="533.5000" y2="66.5000" stroke="#205d9c" stroke-width="1.65" stroke-linecap="round" /><line x1="162.5000" y1="61.5000" x2="162.5000" y2="71.5000" stroke="#205d9c" stroke-width="1.65" stroke-linecap="round" /><line x1="533.5000" y1="61.5000" x2="533.5000" y2="71.5000" stroke="#205d9c" stroke-width="1.65" stroke-linecap="round" /><text x="348.0000" y="49.5000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#205d9c" text-anchor="middle">2a+2</text></svg>
