<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 718 428" width="718" height="428" role="img" aria-labelledby="title desc"><title id="title">발코니와 거실을 합친 한 직사각형</title><desc id="desc">한 직사각형이 왼쪽 발코니와 오른쪽 거실로 나뉜다. 전체 세로는 2a−1, 전체 가로는 x이다. 두 부분의 넓이가 각각 적혀 있다.</desc><rect width="718" height="428" fill="white" /><rect x="150" y="83" width="118.4" height="185" fill="#e5f3e4" stroke="#277339" stroke-width="4" /><rect x="268.4" y="83" width="362.6" height="185" fill="#e1eefb" stroke="#205d9c" stroke-width="4" /><text x="209.2000" y="161.0000" font-size="31" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#277339" text-anchor="middle">발코니</text><text x="209.2000" y="211.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#277339" text-anchor="middle">6a−2</text><text x="449.7000" y="161.0000" font-size="31" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#205d9c" text-anchor="middle">거실</text><text x="449.7000" y="211.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#205d9c" text-anchor="middle">6a²−a−2</text><line x1="125.0000" y1="83.0000" x2="125.0000" y2="268.0000" stroke="#586574" stroke-width="1.65" stroke-linecap="round" /><line x1="130.0000" y1="83.0000" x2="120.0000" y2="83.0000" stroke="#586574" stroke-width="1.65" stroke-linecap="round" /><line x1="130.0000" y1="268.0000" x2="120.0000" y2="268.0000" stroke="#586574" stroke-width="1.65" stroke-linecap="round" /><text x="84.0000" y="183.5000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#586574" text-anchor="middle">2a−1</text><line x1="150.0000" y1="297.0000" x2="631.0000" y2="297.0000" stroke="#586574" stroke-width="1.65" stroke-linecap="round" /><line x1="150.0000" y1="292.0000" x2="150.0000" y2="302.0000" stroke="#586574" stroke-width="1.65" stroke-linecap="round" /><line x1="631.0000" y1="292.0000" x2="631.0000" y2="302.0000" stroke="#586574" stroke-width="1.65" stroke-linecap="round" /><text x="390.5000" y="331.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#586574" text-anchor="middle">x</text></svg>
