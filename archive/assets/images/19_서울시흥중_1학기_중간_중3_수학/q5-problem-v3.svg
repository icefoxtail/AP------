<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 315" width="700" height="315" role="img" aria-labelledby="title desc"><title id="title">수직선의 두 눈금 사이 ㉠ 구간</title><desc id="desc">얇은 수직선의 −2 눈금부터 −1 눈금까지 옅은 파랑 영역이 놓인다. 영역 위에 ㉠이라 표시했다.</desc><rect width="700" height="315" fill="white" /><rect x="214" y="110" width="104" height="77" fill="#e1eefb" /><line x1="49.0000" y1="188.0000" x2="654.0000" y2="188.0000" stroke="#586574" stroke-width="2.2" stroke-linecap="round" /><polygon points="49.0000,188.0000 62.0000,183.0000 62.0000,193.0000" fill="#586574" /><polygon points="654.0000,188.0000 640.0000,183.0000 640.0000,193.0000" fill="#586574" /><line x1="110.0000" y1="181.0000" x2="110.0000" y2="195.0000" stroke="#586574" stroke-width="1.9" stroke-linecap="round" /><text x="110.0000" y="234.0000" font-size="30" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">−3</text><line x1="214.0000" y1="181.0000" x2="214.0000" y2="195.0000" stroke="#586574" stroke-width="1.9" stroke-linecap="round" /><text x="214.0000" y="234.0000" font-size="30" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">−2</text><line x1="318.0000" y1="181.0000" x2="318.0000" y2="195.0000" stroke="#586574" stroke-width="1.9" stroke-linecap="round" /><text x="318.0000" y="234.0000" font-size="30" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">−1</text><line x1="422.0000" y1="181.0000" x2="422.0000" y2="195.0000" stroke="#586574" stroke-width="1.9" stroke-linecap="round" /><text x="422.0000" y="234.0000" font-size="30" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">0</text><line x1="526.0000" y1="181.0000" x2="526.0000" y2="195.0000" stroke="#586574" stroke-width="1.9" stroke-linecap="round" /><text x="526.0000" y="234.0000" font-size="30" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">1</text><line x1="214.0000" y1="188.0000" x2="214.0000" y2="111.0000" stroke="#205d9c" stroke-width="2.3" stroke-linecap="round" stroke-dasharray="6 5" /><line x1="318.0000" y1="188.0000" x2="318.0000" y2="111.0000" stroke="#205d9c" stroke-width="2.3" stroke-linecap="round" stroke-dasharray="6 5" /><line x1="214.0000" y1="111.0000" x2="318.0000" y2="111.0000" stroke="#205d9c" stroke-width="2.3" stroke-linecap="round" stroke-dasharray="6 5" /><text x="266.0000" y="159.0000" font-size="33" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#205d9c" text-anchor="middle">㉠</text></svg>
