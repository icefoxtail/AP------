<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 703 495" width="703" height="495" role="img" aria-labelledby="title desc"><title id="title">두 바깥 정사각형과 안쪽 넓이 S₁, S₂</title><desc id="desc">밑변 위의 점은 A, D, B, C 순이다. 왼쪽 바깥 정사각형은 한 변의 길이가 b, 오른쪽은 a이다. 왼쪽 큰 정사각형 안에 AD로 만든 S₁과 DB로 만든 S₂를 점선으로 그었다.</desc><rect width="703" height="495" fill="white" /><rect x="107" y="56" width="305" height="305" fill="#e9f2fa" stroke="#205d9c" stroke-width="4.5" /><rect x="412" y="200" width="161" height="161" fill="#faeedb" stroke="#aa5411" stroke-width="4.5" /><rect x="107" y="128.0" width="233.0" height="233.0" fill="#e5f3e6" stroke="#266f73" stroke-width="3" stroke-dasharray="8 5" /><text x="223.5000" y="254.5000" font-size="31" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#266f73" text-anchor="middle">S₁</text><rect x="340.0" y="289.0" width="72.0" height="72.0" fill="#f0eaf6" stroke="#704895" stroke-width="3" stroke-dasharray="8 5" /><text x="376.0000" y="335.0000" font-size="31" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#704895" text-anchor="middle">S₂</text><circle cx="107" cy="361" r="4.6" fill="#28364b" /><text x="107.0000" y="387.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">A</text><circle cx="340.0" cy="361" r="4.6" fill="#28364b" /><text x="340.0000" y="387.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">D</text><circle cx="412" cy="361" r="4.6" fill="#28364b" /><text x="412.0000" y="387.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">B</text><circle cx="573" cy="361" r="4.6" fill="#28364b" /><text x="573.0000" y="387.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">C</text><line x1="107.0000" y1="412.0000" x2="412.0000" y2="412.0000" stroke="#205d9c" stroke-width="1.65" stroke-linecap="round" /><line x1="107.0000" y1="406.0000" x2="107.0000" y2="418.0000" stroke="#205d9c" stroke-width="1.7" stroke-linecap="round" /><line x1="412.0000" y1="406.0000" x2="412.0000" y2="418.0000" stroke="#205d9c" stroke-width="1.7" stroke-linecap="round" /><text x="259.5000" y="434.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#205d9c" text-anchor="middle">b</text><line x1="412.0000" y1="412.0000" x2="573.0000" y2="412.0000" stroke="#aa5411" stroke-width="1.65" stroke-linecap="round" /><line x1="412.0000" y1="406.0000" x2="412.0000" y2="418.0000" stroke="#aa5411" stroke-width="1.7" stroke-linecap="round" /><line x1="573.0000" y1="406.0000" x2="573.0000" y2="418.0000" stroke="#aa5411" stroke-width="1.7" stroke-linecap="round" /><text x="492.5000" y="434.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#aa5411" text-anchor="middle">a</text><line x1="80.0000" y1="56.0000" x2="80.0000" y2="361.0000" stroke="#205d9c" stroke-width="1.65" stroke-linecap="round" /><line x1="74.0000" y1="56.0000" x2="86.0000" y2="56.0000" stroke="#205d9c" stroke-width="1.7" stroke-linecap="round" /><line x1="74.0000" y1="361.0000" x2="86.0000" y2="361.0000" stroke="#205d9c" stroke-width="1.7" stroke-linecap="round" /><text x="56.0000" y="217.5000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#205d9c" text-anchor="middle">b</text><line x1="595.0000" y1="200.0000" x2="595.0000" y2="361.0000" stroke="#aa5411" stroke-width="1.65" stroke-linecap="round" /><line x1="589.0000" y1="200.0000" x2="601.0000" y2="200.0000" stroke="#aa5411" stroke-width="1.7" stroke-linecap="round" /><line x1="589.0000" y1="361.0000" x2="601.0000" y2="361.0000" stroke="#aa5411" stroke-width="1.7" stroke-linecap="round" /><text x="619.0000" y="289.5000" font-size="29" font-fa