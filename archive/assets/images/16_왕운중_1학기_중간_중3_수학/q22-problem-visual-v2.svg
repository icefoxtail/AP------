<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 668 595" width="668" height="595" role="img" aria-labelledby="title desc"><title id="title">안쪽과 바깥쪽 두 원이 둘러싼 고리</title><desc id="desc">바깥쪽 원에서 A와 B는 위와 아래의 끝점이다. 같은 세로선이 안쪽 원에서 만나는 점은 위의 C와 아래의 D이다. 두 원 사이를 옅은 청록으로 채웠다.</desc><rect width="668" height="595" fill="white" /><circle cx="331" cy="301" r="223" fill="#e0f1ee" stroke="#205d9c" stroke-width="4.9" /><circle cx="331" cy="301" r="165" fill="white" stroke="#266f73" stroke-width="4.7" /><line x1="331.0000" y1="78.0000" x2="331.0000" y2="524.0000" stroke="#586574" stroke-width="2" stroke-linecap="round" /><line x1="331.0000" y1="78.0000" x2="331.0000" y2="136.0000" stroke="#aa5411" stroke-width="4.1" stroke-linecap="round" /><line x1="331.0000" y1="466.0000" x2="331.0000" y2="524.0000" stroke="#aa5411" stroke-width="4.1" stroke-linecap="round" /><circle cx="331" cy="78" r="4.1" fill="#28364b" /><text x="331.0000" y="63.0000" font-size="30" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">A</text><circle cx="331" cy="136" r="4.1" fill="#28364b" /><text x="349.0000" y="124.0000" font-size="30" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">C</text><circle cx="331" cy="466" r="4.1" fill="#28364b" /><text x="350.0000" y="490.0000" font-size="30" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">D</text><circle cx="331" cy="524" r="4.1" fill="#28364b" /><text x="331.0000" y="554.0000" font-size="30" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">B</text><circle cx="331" cy="301" r="4.1" fill="#586574" /></svg>
