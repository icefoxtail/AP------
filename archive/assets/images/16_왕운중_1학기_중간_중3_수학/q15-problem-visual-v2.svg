<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 696 546" width="696" height="546" role="img" aria-labelledby="title desc"><title id="title">집의 전체 바깥 경계가 직사각형인 평면도</title><desc id="desc">실내에는 침실 세 곳이 표시되어 있다. 위쪽과 가운데는 공용 공간과 작은 실로 나뉘고 오른쪽에는 바닥선이 반복된 좁은 공간이 있다. 집의 바깥 경계는 직사각형이다.</desc><rect width="696" height="546" fill="white" /><rect x="92" y="93" width="512" height="369" fill="#f3f8fb" /><rect x="92" y="93" width="109" height="124" fill="#e8f3fc" stroke="#205d9c" stroke-width="2.7" /><rect x="92" y="295" width="148" height="167" fill="#e8f3fc" stroke="#205d9c" stroke-width="2.7" /><rect x="342" y="271" width="178" height="191" fill="#e8f3fc" stroke="#205d9c" stroke-width="2.7" /><rect x="240" y="371" width="102" height="91" fill="#e0f0e9" stroke="#266f73" stroke-width="2.7" /><rect x="520" y="93" width="84" height="369" fill="#eff4f6" stroke="#586574" stroke-width="2.7" /><text x="145.0000" y="166.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#205d9c" text-anchor="middle">침실</text><text x="164.0000" y="385.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#205d9c" text-anchor="middle">침실</text><text x="431.0000" y="369.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#205d9c" text-anchor="middle">침실</text><line x1="520.0000" y1="129.0000" x2="604.0000" y2="129.0000" stroke="#9eafb9" stroke-width="1.4" stroke-linecap="round" /><line x1="520.0000" y1="165.0000" x2="604.0000" y2="165.0000" stroke="#9eafb9" stroke-width="1.4" stroke-linecap="round" /><line x1="520.0000" y1="201.0000" x2="604.0000" y2="201.0000" stroke="#9eafb9" stroke-width="1.4" stroke-linecap="round" /><line x1="520.0000" y1="237.0000" x2="604.0000" y2="237.0000" stroke="#9eafb9" stroke-width="1.4" stroke-linecap="round" /><line x1="520.0000" y1="273.0000" x2="604.0000" y2="273.0000" stroke="#9eafb9" stroke-width="1.4" stroke-linecap="round" /><l