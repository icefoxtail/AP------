<text class="title" x="24" y="32">삼각형의 넓이를 보조 도형으로 계산</text>
<line x1="82" y1="380" x2="590" y2="380" stroke="#333" stroke-width="2"/><line x1="140" y1="418" x2="140" y2="65" stroke="#333" stroke-width="2"/><text x="596" y="385">x</text><text x="129" y="60">y</text><text x="124" y="397">O</text>
<!-- scale 38 px per unit, origin (140,380) -->
<path d="M140 152 Q197 -76 254 380" fill="none" stroke="#6b7785" stroke-width="3"/>
<path d="M178 76 L254 380 L140 152 Z" fill="#eaf2fb" stroke="#314a68" stroke-width="2"/>
<path d="M178 76 L254 380 L178 380 Z" fill="#d8f2ed" stroke="#087754" stroke-width="2"/>
<path d="M178 76 L178 380 L140 380 L140 152 Z" fill="#ffe9ca" stroke="#d27d1e" stroke-width="2"/>
<path d="M140 380 L254 380 L140 152 Z" fill="#f7dfe3" fill-opacity=".75" stroke="#b9465b" stroke-width="2"/>
<circle cx="178" cy="76" r="4" fill="#111"/><circle cx="254" cy="380" r="4" fill="#111"/><circle cx="140" cy="152" r="4" fill="#111"/><circle cx="178" cy="380" r="4" fill="#111"/>
<text x="182" y="70">A(1,8)</text><text x="258" y="400">B(3,0)</text><text x="82" y="148">C(0,6)</text><text x="183" y="400">D(1,0)</text>
<text class="small" x="326" y="108">△ABD = ½·8·2 = 8</text><text class="small" x="326" y="145">사다리꼴 ADOC = ½(8+6)·1 = 7</text><text class="small" x="326" y="182">△BOC = ½·3·6 = 9</text><text x="326" y="230">삼각형 ABC의 넓이 = 8 + 7 − 9 = 6</text>
<text class="small" x="326" y="274">A(1,8), B(3,0), C(0,6),</text><text class="small" x="326" y="298">D(1,0), O(0,0)</text><text class="small" x="326" y="342">사각형 ABOC의 넓이에서 △BOC의 넓이를</text><text class="small" x="326" y="366">빼서 △ABC의 넓이를 구한다</text></svg>