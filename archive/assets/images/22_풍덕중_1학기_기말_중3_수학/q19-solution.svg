<svg xmlns="http://www.w3.org/2000/svg" width="760" height="630" viewBox="0 0 760 630">
<rect width="760" height="630" fill="#fff"/><style>text{font-family:"Noto Sans CJK KR",sans-serif;fill:#202020;font-size:18px}.title{font-size:22px;font-weight:bold}.small{font-size:16px}</style>
<text class="title" x="24" y="34">두 포물선에서 PA와 PB가 같은 조건</text>
<line x1="80" y1="360" x2="690" y2="360" stroke="#333" stroke-width="2"/><line x1="100" y1="395" x2="100" y2="66" stroke="#333" stroke-width="2"/><text x="696" y="365">x</text><text x="88" y="62">y</text>
<path d="M100.0,360.0 L110.0,359.0 L120.0,356.0 L130.0,351.0 L140.0,344.0 L150.0,335.0 L160.0,324.0 L170.0,311.0 L180.0,296.0 L190.0,279.0 L200.0,260.0 L210.0,239.0 L220.0,216.0 L230.0,191.0 L240.0,164.0 L250.0,135.0 L260.0,104.0 L270.0,71.0" fill="none" stroke="#3159bd" stroke-width="3"/>
<path d="M100.0,360.0 L110.0,359.7 L120.0,358.7 L130.0,357.0 L140.0,354.7 L150.0,351.7 L160.0,348.0 L170.0,343.7 L180.0,338.7 L190.0,333.0 L200.0,326.7 L210.0,319.7 L220.0,312.0 L230.0,303.7 L240.0,294.7 L250.0,285.0 L260.0,274.7 L270.0,263.7 L280.0,252.0 L290.0,239.7 L300.0,226.7 L310.0,213.0" fill="none" stroke="#d05b3b" stroke-width="3"/>
<text class="small" x="348" y="78">y = x²</text><text class="small" x="508" y="250">y = ⅓x²</text>
<!-- equal scale: PA and PB both have length 80.4 px -->
<circle cx="209.8" cy="239.4" r="5" fill="#111"/><circle cx="209.8" cy="319.8" r="5" fill="#111"/><circle cx="290.2" cy="239.4" r="5" fill="#111"/>
<line x1="209.8" y1="239.4" x2="209.8" y2="319.8" stroke="#087754" stroke-width="4"/><line x1="209.8" y1="239.4" x2="290.2" y2="239.4" stroke="#087754" stroke-width="4"/>
<text x="214.8" y="232.4">P</text><text x="214.8" y="324.8">A</text><text x="295.2" y="234.4">B</text>
<text class="small" x="216.8" y="279.6">PA</text><text class="small" x="250.0" y="232.4">PB</text><text class="small" x="40" y="395">B = (s, t²), s &gt; 0</text>
<text class="small" x="40" y="420">s²/3 = t²</text>
<text class="small" x="40" y="445">s² = 3t²</text>
<text class="small" x="40" y="470">s = √3t  (s, t &gt; 0)</text>
<text class="small" x="40" y="495">PA = t² − ⅓t² = ⅔t²</text>
<text class="small" x="40" y="520">PB = s − t = (√3−1)t</text>
<text class="small" x="40" y="545">PA = PB → ⅔t² = (√3−1)t</text>
<text class="small" x="40" y="570">t &gt; 0으로 나누어 t = 3(√3−1)/2</text>
<text class="small" x="40" y="605">좌표축의 가로와 세로 단위는 같다.</text></svg>