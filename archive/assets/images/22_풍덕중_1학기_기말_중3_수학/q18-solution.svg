<path d="M88 243 Q314 243 540 83" fill="none" stroke="#265eaa" stroke-width="4"/>
<circle cx="88" cy="243" r="6" fill="#d55"/><circle cx="314" cy="203" r="6" fill="#d55"/><circle cx="540" cy="83" r="6" fill="#d55"/>
