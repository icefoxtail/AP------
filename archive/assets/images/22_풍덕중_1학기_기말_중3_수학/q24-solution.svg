<svg xmlns="http://www.w3.org/2000/svg" width="700" height="460" viewBox="0 0 700 460">
<rect width="700" height="460" fill="#fff"/><style>text{font-family:"Noto Sans CJK KR",sans-serif;fill:#202020;font-size:17px}.title{font-size:22px;font-weight:bold}.small{font-size:15px}</style>
<text class="title" x="24" y="32">꼭짓점형 그래프의 축과 절편</text>
<line x1="58" y1="290" x2="440" y2="290" stroke="#333" stroke-width="2"/><line x1="244" y1="420" x2="244" y2="66" stroke="#333" stroke-width="2"/><line x1="212" y1="62" x2="212" y2="420" stroke="#d38133" stroke-width="2" stroke-dasharray="6 5"/>
<text x="446" y="294">x</text><text x="236" y="62">y</text><text x="230" y="309">O</text><text class="small" x="142" y="96">x = −1</text>
<!-- Function y=−1/2(x+1)^2+2, scale x=32px/unit, y=32px/unit, origin(244,290) -->
<path d="M116 370 Q212 82 308 370" fill="none" stroke="#3567bb" stroke-width="4"/>
<circle cx="148" cy="290" r="5" fill="#111"/><circle cx="276" cy="290" r="5" fill="#111"/><circle cx="244" cy="242" r="5" fill="#111"/><circle cx="212" cy="226" r="5" fill="#087754"/>
<text x="100" y="278">(−3,0)</text><text x="282" y="278">(1,0)</text><text x="250" y="239">(0,3/2)</text><text x="146" y="212">꼭짓점 (−1,2)</text><text class="small" x="68" y="70">위로 볼록 (아래로 열린)</text>
<text x="478" y="112">축: x = −1</text><text x="478" y="150">꼭짓점: (−1, 2)</text><text x="478" y="188">x절편: (−3, 0), (1, 0)</text><text x="478" y="226">y절편: (0, 3/2)</text><text x="478" y="282">y = −½(x+1)² + 2</text><text class="small" x="478" y="318">y = −½x²를 왼쪽으로 1,</text><text class="small" x="478" y="342">위쪽으로 2만큼 이동</text></svg>