<svg xmlns="http://www.w3.org/2000/svg" width="750" height="420" viewBox="0 0 750 420"><rect width="600" height="420" fill="white"/><text x="20" y="30" font-size="19" font-family="sans-serif" fill="#203040">Inner square EF = 10, outer square AB = 12</text><rect x="110" y="70" width="276" height="276" fill="#f2f6fc" stroke="#263238" stroke-width="2.5"/><polygon points="334.06,70.00 386.00,294.06 161.94,346.00 110.00,121.94" fill="#d3f3ec" fill-opacity=".85" stroke="#0a8075" stroke-width="3"/><line x1="334.06" y1="70" x2="386" y2="294.06" stroke="#ef8a24" stroke-width="2" stroke-dasharray="6 5"/><text x="91" y="58" font-size="17">A</text><text x="389" y="58" font-size="17">B</text><text x="391" y="363" font-size="17">C</text><text x="89" y="365" font-size="17">D</text><text x="329.1" y="59" font-size="16">E</text><text x="390" y="294.1" font-size="16">F</text><text x="156.9" y="365" font-size="16">G</text><text x="91" y="121.9" font-size="16">H</text><text x="414" y="112" font-size="17">AE = BF = CG = DH = t</text><text x="414" y="152" font-size="17">AH = 12 - t</text><text x="414" y="192" font-size="17">t² + (12 - t)² = 100</text><text x="414" y="232" font-size="17">t = 6 + sqrt(14)</text><text x="414" y="272" font-size="17">AH = 6 - sqrt(14)</text></svg>