<svg xmlns="http://www.w3.org/2000/svg" width="750" height="440" viewBox="0 0 750 440">
<rect width="750" height="440" fill="#fff"/><style>text{font-family:"Noto Sans CJK KR",sans-serif;fill:#202020;font-size:18px}.title{font-size:22px;font-weight:bold}.small{font-size:16px}</style>
<text class="title" x="24" y="34">정사각형의 변과 내부 직각삼각형</text>
<rect x="90" y="76" width="260" height="260" fill="#f7f9fc" stroke="#27364b" stroke-width="3"/>
<!-- A top-left, B bottom-left, C bottom-right, D top-right. t=6+√14 -->
<polygon points="90,287 301,336 350,125 139,76" fill="#d8f2ed" stroke="#087c72" stroke-width="3"/>
<path d="M90 287 L90 336 L301 336 Z" fill="#fff3dc" fill-opacity=".7" stroke="#ef8a24" stroke-width="2"/>
<text x="70" y="70">A</text><text x="70" y="356">B</text><text x="354" y="356">C</text><text x="354" y="70">D</text>
<text x="67" y="291">E</text><text x="304" y="357">F</text><text x="352" y="123">G</text><text x="119" y="72">H</text>
<text class="small" x="110" y="312">12−t</text><text class="small" x="183" y="330">t</text><text class="small" x="184" y="306">10</text>
<text x="395" y="100">AE = BF = CG = DH = t</text><text x="395" y="140">직각삼각형 EBF에서</text>
<text x="395" y="174">EB = 12 − t,  BF = t,  EF = 10</text>
<text x="395" y="216">(12 − t)² + t² = 10²</text>
<text x="395" y="246">2t² − 24t + 44 = 0</text><text x="395" y="276">t² − 12t + 22 = 0</text>
<text x="395" y="306">t² − 12t + 36 = 14</text><text x="395" y="336">(t − 6)² = 14</text>
<text x="395" y="366">t = 6 + √14  (DH &gt; AH)</text><text x="395" y="396">AH = 12 − t = 6 − √14 cm</text>
</svg>