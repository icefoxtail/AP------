<text class="title" x="30" y="42">q13 · 원본 직선 부호로 포물선 위치 판단</text>
<text x="55" y="88">직선 y = ax + b</text><text x="440" y="88">포물선 y = b(x+a)²</text>
<path d="M65 282 H350 M190 134 V365" stroke="#202020" stroke-width="2" fill="none"/><text x="357" y="289">x</text><text x="177" y="124">y</text><text x="174" y="306">O</text>
<path d="M108 148 L300 347" stroke="#3949ab" stroke-width="4"/>
<circle cx="190" cy="233" r="5" fill="#d14"/><text x="205" y="225">b &gt; 0</text>
<text class="small" x="82" y="395">우하향 → a &lt; 0</text>
<path d="M428 282 H772 M540 134 V365" stroke="#202020" stroke-width="2" fill="none"/><text x="780" y="289">x</text><text x="527" y="124">y</text><text x="521" y="308">O</text>
<path d="M460 115 Q615 449 750 115" stroke="#087754" stroke-width="4" fill="none"/>
<circle cx="608" cy="284" r="4" fill="#d14"/>
<text x="589" y="321">−a &gt; 0</text>
<text class="small" x="455" y="395">b &gt; 0: 위로 열림, 꼭짓점 오른쪽 → ①</text>
</svg>