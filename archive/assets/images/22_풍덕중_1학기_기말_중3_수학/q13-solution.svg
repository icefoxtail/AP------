<svg xmlns="http://www.w3.org/2000/svg" width="820" height="430" viewBox="0 0 820 430">
<rect width="820" height="430" fill="#fff"/><style>text{font-family:"Noto Sans CJK KR",sans-serif;fill:#202020;font-size:19px}.title{font-size:23px;font-weight:bold}.small{font-size:17px}</style>
<text class="title" x="28" y="38">직선의 기울기와 절편으로 포물선 고르기</text>
<text x="55" y="78">직선 y = ax + b</text><text x="450" y="78">포물선 y = b(x+a)²</text>
<path d="M60 286 H350 M220 108 V360" stroke="#222" stroke-width="2"/><text x="356" y="292">x</text><text x="208" y="104">y</text><text x="204" y="307">O</text>
<!-- line passes through positive y-intercept and positive x-intercept -->
<path d="M130 145 L330 345" stroke="#3456a5" stroke-width="4"/><circle cx="220" cy="235" r="5" fill="#d14"/><text class="small" x="229" y="229">b &gt; 0</text>
<text class="small" x="76" y="388">우하향이므로 a &lt; 0</text>
<path d="M445 286 H775 M570 108 V360" stroke="#222" stroke-width="2"/><text x="780" y="292">x</text><text x="558" y="104">y</text><text x="554" y="307">O</text>
<path d="M560 115 Q660 457 760 115" fill="none" stroke="#087754" stroke-width="4"/><circle cx="660" cy="286" r="5" fill="#d14"/>
<text class="small" x="637" y="313">−a &gt; 0</text><text class="small" x="634" y="340">꼭짓점</text>
<text class="small" x="443" y="388">b &gt; 0 → 위로 열림 · 꼭짓점은 양의 x축 위 → ①</text></svg>