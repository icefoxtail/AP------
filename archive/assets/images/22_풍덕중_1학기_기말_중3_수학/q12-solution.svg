<svg xmlns="http://www.w3.org/2000/svg" width="760" height="470" viewBox="0 0 760 470">
<rect width="760" height="470" fill="#fff"/><style>text{font-family:"Noto Sans CJK KR",sans-serif;fill:#202020;font-size:19px}.title{font-size:23px;font-weight:bold}.small{font-size:16px}</style>
<text class="title" x="30" y="38">닮은 두 직사각형의 대응 변</text>
<!-- scale 90 px per cm: height 2; left width 2; right width √5−1 -->
<rect x="84" y="92" width="291.25" height="180" fill="#fbfcff" stroke="#202020" stroke-width="3"/>
<rect x="84" y="92" width="180" height="180" fill="#eaf2fb" stroke="none"/><path d="M264 92V272" stroke="#202020" stroke-width="3"/>
<text x="66" y="86">A</text><text x="254" y="86">E</text><text x="371" y="86">D</text><text x="66" y="294">B</text><text x="254" y="294">F</text><text x="371" y="294">C</text>
<text class="small" x="145" y="82">AE = 2</text><text class="small" x="28" y="194">AB = 2</text><text class="small" x="440" y="98">DE = x</text>
<text x="104" y="190">AB = AE = 2</text><text class="small" x="278" y="190">DE = x</text><text x="440" y="126">ABCD: 가로 2+x, 세로 2</text><text x="440" y="164">DEFC: 가로 x, 세로 2</text>
<text class="small" x="440" y="198">ABCD ∼ DEFC → AB↔DE, BC↔EF</text>
<text class="small" x="440" y="224">AB:DE = BC:EF, 즉 2:x = (2+x):2</text>
<text x="440" y="258">(2+x)/2 = 2/x</text><text x="440" y="290">x(2+x)=4 → x²+2x−4=0</text>
<text x="440" y="322">(x+1)² = 5</text><text x="440" y="354">x = −1 ± √5</text>
<text x="440" y="386">x&gt;0이므로 x = √5 − 1</text>
<text x="38" y="438">BC = AE + DE = 2 + x = 1 + √5 cm  →  ②</text></svg>