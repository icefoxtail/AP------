<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="500" height="400" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">가로가 세로보다 5 cm 더 긴 직사각형 종이의 네 귀퉁이에서 한 변이 2 cm인 정사각형을 잘라 낸 전개도이다. 점선은 상자로 접을 때 생기는 접는 선이고, 상자의 부피는 168 세제곱센티미터이다.</title><desc id="visual-desc">네 귀퉁이가 정사각형 모양으로 잘려 나간 십자 모양 종이에 가로와 세로로 점선 접는 선이 그려져 있다. 세로의 길이는 x cm, 가로의 길이는 x+5 cm, 잘라 낸 부분의 한 변은 2 cm로 표시되어 있다.</desc><rect width="500" height="400" fill="#fff"/><g data-layer="30"><line id="sAB" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="99.976441753" y1="120.119951561" x2="99.976441753" y2="272.016467347"/></g><g data-layer="30"><line id="sBC" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="99.976441753" y1="272.016467347" x2="143.375446264" y2="272.016467347"/></g><g data-layer="30"><line id="sCD" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="143.375446264" y1="272.016467347" x2="143.375446264" y2="315.415471857"/></g><g data-layer="30"><line id="sDE" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="143.375446264" y1="315.415471857" x2="403.769473325" y2="315.415471857"/></g><g data-layer="30"><line id="sEF" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="403.769473325" y1="315.415471857" x2="403.769473325" y2="272.016467347"/></g><g data-layer="30"><line id="sFG"