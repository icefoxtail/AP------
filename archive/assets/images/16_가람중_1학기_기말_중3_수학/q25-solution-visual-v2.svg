<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 696 507" width="696" height="507" role="img" aria-labelledby="title desc"><title id="title">가로와 세로를 같은 길이만큼 늘인 직사각형</title><desc id="desc">가로 10 cm, 세로 8 cm인 파란 직사각형을 아래 왼쪽에 두었다. 오른쪽과 위쪽에 너비가 같은 띠가 추가되어 더 큰 직사각형을 이룬다.</desc><rect width="696" height="507" fill="white" /><rect x="141" y="82.15" width="366.85" height="308.85" fill="#faecd9" stroke="#aa5411" stroke-width="4.0" stroke-dasharray="none" /><rect x="141" y="159" width="290" height="232" fill="#e9f3fb" stroke="#205d9c" stroke-width="4.3" /><line x1="141.0000" y1="428.0000" x2="431.0000" y2="428.0000" stroke="#205d9c" stroke-width="1.65" stroke-linecap="round" /><line x1="141.0000" y1="422.0000" x2="141.0000" y2="434.0000" stroke="#205d9c" stroke-width="1.6" stroke-linecap="round" /><line x1="431.0000" y1="422.0000" x2="431.0000" y2="434.0000" stroke="#205d9c" stroke-width="1.6" stroke-linecap="round" /><text x="286.0000" y="462.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#205d9c" text-anchor="middle">10 cm</text><line x1="110.0000" y1="159.0000" x2="110.0000" y2="391.0000" stroke="#205d9c" stroke-width="1.65" stroke-linecap="round" /><line x1="104.0000" y1="159.0000" x2="116.0000" y2="159.0000" stroke="#205d9c" stroke-width="1.6" stroke-linecap="round" /><line x1="104.0000" y1="391.0000" x2="116.0000" y2="391.0000" stroke="#205d9c" stroke-width="1.6" stroke-linecap="round" /><text x="70.0000" y="284.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#205d9c" text-anchor="middle">8 cm</text><line x1="431.0000" y1="425.0000" x2="507.8500" y2="425.0000" stroke="#aa5411" stroke-width="1.7" stroke-linecap="round" /><text x="469.4250" y="457.0000" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#aa5411" text-anchor="middle">x</text><line x1="109.0000" y1="82.1500" x2="109.0000" y2="159.0000" stroke="#aa5411" stroke-width="1.7" stroke-linecap="round" /><text x="83.0000" y="127.5750" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#aa5411" text-anchor="middle">x</text></svg>
