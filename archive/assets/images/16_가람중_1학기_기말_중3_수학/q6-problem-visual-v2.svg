<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 705 544" width="705" height="544" role="img" aria-labelledby="title desc"><title id="title">세로축 왼쪽과 가로축 위의 꼭짓점</title><desc id="desc">파란 포물선은 위로 열려 있다. 가장 낮은 꼭짓점은 y축의 왼쪽이며 x축보다 높다.</desc><rect width="705" height="544" fill="white" /><line x1="53.0000" y1="405.8894" x2="649.0000" y2="405.8894" stroke="#4d5d72" stroke-width="1.65" stroke-linecap="round" /><polygon points="649.0000,405.8894 636.0000,400.8894 636.0000,410.8894" fill="#4d5d72" /><text x="666.0000" y="397.8894" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#4d5d72" text-anchor="middle">x</text><line x1="436.0000" y1="473.0000" x2="436.0000" y2="58.0000" stroke="#4d5d72" stroke-width="1.65" stroke-linecap="round" /><polygon points="436.0000,58.0000 431.0000,71.0000 441.0000,71.0000" fill="#4d5d72" /><text x="452.0000" y="64.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#4d5d72" text-anchor="middle">y</text><text x="415.0000" y="433.8894" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#4d5d72" text-anchor="middle">O</text><path d="M 110.0000 69.3693 Q 346.0000 619.0445 582.0000 69.3693" stroke="#205d9c" stroke-width="6.0" stroke-linecap="round" fill="none" /></svg>
