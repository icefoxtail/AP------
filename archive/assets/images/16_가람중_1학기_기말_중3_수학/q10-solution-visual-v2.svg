<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 705 544" width="705" height="544" role="img" aria-labelledby="title desc"><title id="title">두 x절편 사이를 잇는 수평선</title><desc id="desc">위로 열린 포물선은 왼쪽 A와 오른쪽 B에서 x축을 지난다. 두 점 사이를 초록선으로 표시했다.</desc><rect width="705" height="544" fill="white" /><line x1="148.1001" y1="204.8266" x2="561.5788" y2="204.8266" stroke="#25736e" stroke-width="4.4" stroke-linecap="round" /><line x1="53.0000" y1="204.8266" x2="649.0000" y2="204.8266" stroke="#4d5d72" stroke-width="1.65" stroke-linecap="round" /><polygon points="649.0000,204.8266 636.0000,199.8266 636.0000,209.8266" fill="#4d5d72" /><text x="666.0000" y="196.8266" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#4d5d72" text-anchor="middle">x</text><line x1="207.1685" y1="473.0000" x2="207.1685" y2="80.0000" stroke="#4d5d72" stroke-width="1.65" stroke-linecap="round" /><polygon points="207.1685,80.0000 202.1685,93.0000 212.1685,93.0000" fill="#4d5d72" /><text x="223.1685" y="86.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#4d5d72" text-anchor="middle">y</text><text x="186.1685" y="232.8266" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#4d5d72" text-anchor="middle">O</text><path d="M 107.9336 108.1064 Q 354.8394 755.2933 601.7453 108.1064" stroke="#205d9c" stroke-width="6.0" stroke-linecap="round" fill="none" /><circle cx="148.10009910802773" cy="204.8265786993402" r="6.0" fill="white" stroke="#25736e" stroke-width="3.1" /><text x="124.1001" y="190.8266" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#25736e" text-anchor="middle">A</text><circle cx="561.5787908820614" cy="204.8265786993402" r="6.0" fill="white" stroke="#25736e" stroke-width="3.1" /><text x="584.5788" y="189.8266" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#25736e" text-anchor="middle">B</text><line x1="64.0000" y1="39.0000" x2="114.0000" y2="39.0000" stroke="#205d9c" stroke-width="5.4" stroke-linecap="round" /><text x="126.0000" y="47.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#205d9c" text-anchor="start">y = x² − 5x − 6</text></svg>
