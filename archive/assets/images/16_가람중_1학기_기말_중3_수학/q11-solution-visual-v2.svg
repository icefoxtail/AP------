<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 705 544" width="705" height="544" role="img" aria-labelledby="title desc"><title id="title">꼭짓점과 두 축에서 만든 삼각형</title><desc id="desc">아래로 열린 그래프의 꼭짓점 A와 수직인 같은 선 위의 가로축 점 C를 이었다. 세로절편 B와 두 점을 연결한 삼각형을 칠했다.</desc><rect width="705" height="544" fill="white" /><polygon points="351.3758,125.2736 201.0605,251.0336 351.3758,282.4736" fill="#e6f2e8" /><line x1="351.3758" y1="125.2736" x2="201.0605" y2="251.0336" stroke="#25736e" stroke-width="3.6" stroke-linecap="round" /><line x1="201.0605" y1="251.0336" x2="351.3758" y2="282.4736" stroke="#25736e" stroke-width="3.6" stroke-linecap="round" /><line x1="351.3758" y1="282.4736" x2="351.3758" y2="125.2736" stroke="#25736e" stroke-width="3.6" stroke-linecap="round" /><line x1="53.0000" y1="282.4736" x2="649.0000" y2="282.4736" stroke="#4d5d72" stroke-width="1.65" stroke-linecap="round" /><polygon points="649.0000,282.4736 636.0000,277.4736 636.0000,287.4736" fill="#4d5d72" /><text x="666.0000" y="274.4736" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#4d5d72" text-anchor="middle">x</text><line x1="201.0605" y1="473.0000" x2="201.0605" y2="80.0000" stroke="#4d5d72" stroke-width="1.65" stroke-linecap="round" /><polygon points="201.0605,80.0000 196.0605,93.0000 206.0605,93.0000" fill="#4d5d72" /><text x="217.0605" y="86.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#4d5d72" text-anchor="middle">y</text><text x="220.0605" y="311.4736" font-size="29" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#4d5d72" text-anchor="middle">O</text><path d="M 112.3745 443.2075 Q 351.3758 -192.6603 590.3770 443.2075" stroke="#205d9c" stroke-width="6.0" stroke-linecap="round" fill="none" /><circle cx="351.37578814627994" cy="125.27359999999999" r="6.0" fill="white" stroke="#25736e" stroke-width="3.1" /><text x="352.3758" y="107.2736" font-size="29" font-family="Malgun