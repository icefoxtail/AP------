<svg xmlns="http://www.w3.org/2000/svg" width="760" height="720" viewBox="0 0 760 720" aria-labelledby="title desc" role="img"><title id="title">꼭짓점 조건 비교</title><desc id="desc">첫째 파란 포물선은 꼭짓점 V와 y절편 I를 지난다. 둘째 그림은 파란 꼭짓점 V가 주황 직선 위에 있고, V와 x축을 점선으로 이었다.</desc><rect width="760" height="720" fill="white"/><g font-family="STIX Two Text, Noto Sans KR, Cambria Math, serif" font-weight="600" stroke-linecap="round" stroke-linejoin="round"><text x="45.000" y="35.000" fill="#334256" font-size="30">(1) 꼭짓점과 y절편</text><path d="M 55.000,239.000 L 714.000,239.000" fill="none" stroke="#334256" stroke-width="2"/><path d="M 606.000,55.000 L 606.000,328.000" fill="none" stroke="#334256" stroke-width="2"/><text x="716.000" y="231.000" fill="#334256" font-size="32">x</text><text x="622.000" y="70.000" fill="#334256" font-size="32">y</text><path id="curve-intercept" d="M 81.200,314.787 Q 360.000,-116.787 638.800,314.787" fill="none" stroke="#205aa7" stroke-width="5"/><circle cx="360.000" cy="99.000" r="5.5" fill="#205aa7"/><text x="372.000" y="85.000" fill="#205aa7" font-size="32">V</text><circle cx="606.000" cy="267.000" r="5.5" fill="#a84f00"/><text x="622.000" y="279.000" fill="#a84f00" font-size="32">I</text><path d="M 50 360 H 710" stroke="#dbe3ea" stroke-width="1.2"/><text x="45.000" y="401.000" fill="#334256" font-size="30">(2) 꼭짓점을 지나는 직선</text><path d="M 55.000,665.000 L 714.000,665.000" fill="none" stroke="#334256" stroke-width="2"/><path d="M 520.000,420.000 L 520.000,693.000" fill="none" stroke="#334256" stroke-width="2"/><text x="716.000" y="657.000" fill="#334256" font-size="32">x</text><text x="536.000" y="435.000" fill="#334256" font-size="32">y</text><path id="curve-vertexLine" d="M 88.000,640.600 Q 360.000,409.400 632.000,640.600" fill="none" stroke="#205aa7" stroke-width="5"/><path d="M 88.000,457.000 L 632.000,593.000" fill="none" stroke="#a84f00" stroke-width="3" stroke-dasharray="8 6"/><path d="M 360.000,525.000 L 360.000,665.000" fill="none" stroke="#334256" stroke-width="2" stroke-dasharray="8 6"/><circle cx="360.000" cy="525.000" r="5.5" fill="#205aa7"/><text x="374.000" y="508.000" fill="#205aa7" font-size="32">V</text><text x="340.000" y="698.000" fill="#334256" font-size="32">−2</text><path d="M 632.000,593.000 L 638.000,528.000" fill="none" stroke="#a84f00" stroke-width="1.6"/><text x="578.000" y="519.000" fill="#a84f00" font-size="31">y = −x + 5</text></g></svg>
