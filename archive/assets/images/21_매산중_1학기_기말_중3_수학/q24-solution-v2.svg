<svg xmlns="http://www.w3.org/2000/svg" width="760" height="833" viewBox="0 0 760 833" role="img" aria-labelledby="title desc"><title id="title">포물선과 두 도형</title><desc id="desc">첫 그림은 주황 사다리꼴의 평행한 두 변과 포물선을 표시한다. 둘째 그림은 정삼각형을 원점 O에서 두 직각삼각형으로 나눈다.</desc><rect width="760" height="833" fill="white"/><g font-family="STIX Two Text, Noto Sans KR, Cambria Math, serif" font-weight="600" stroke-linecap="round" stroke-linejoin="round"><text x="44.000" y="39.000" fill="#344455" font-size="29">(1) 사다리꼴의 평행변</text><polygon points="394.000,130.000 394.000,223.000 532.000,223.000 532.000,192.000" fill="#f9dcbf" stroke="#a84f00" stroke-width="2"/><path d="M 57.000,223.000 L 715.000,223.000" stroke="#344455" stroke-width="2" fill="none"/><path d="M 532.000,57.000 L 532.000,344.000" stroke="#344455" stroke-width="2" fill="none"/><text x="714.000" y="214.000" fill="#344455" font-size="32">x</text><text x="549.000" y="70.000" fill="#344455" font-size="32">y</text><path id="trap-parabola" d="M 138.700,342.195 Q 394.000,-82.195 649.300,342.195" stroke="#205aa7" stroke-width="4.8" fill="none"/><path d="M 394.000,130.000 L 394.000,223.000" stroke="#a84f00" stroke-width="3.3" fill="none"/><path d="M 532.000,223.000 L 532.000,192.000" stroke="#a84f00" stroke-width="3.3" fill="none"/><path d="M 394.000,130.000 L 532.000,192.000" stroke="#a84f00" stroke-width="2" fill="none"/><circle cx="394.000" cy="130.000" r="5.3" fill="#205aa7"/><text x="370.000" y="112.000" fill="#205aa7" font-size="32">A</text><circle cx="394.000" cy="223.000" r="5.3" fill="#344455"/><text x="362.000" y="256.000" fill="#344455" font-size="32">B</text><circle cx="532.000" cy="223.000" r="5.3" fill="#344455"/><text x="545.000" y="254.000" fill="#344455" font-size="32">O</text><circle cx="532.000" cy="192.000" r="5.3" fill="#205aa7"/><text x="549.000" y="183.000" fill="#205aa7" font-size="32">C</text><path d="M 51 372 H 710" stroke="#dce3e9" stroke-width="1.2"/><text x="44.000" y="414.000" fill="#344455" font-size="29">(2)