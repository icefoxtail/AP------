<svg xmlns="http://www.w3.org/2000/svg" width="700" height="460" viewBox="0 0 700 460" role="img" aria-label="네 영역 A B C D의 인접 관계가 순환형인 새 그림"><title>네 영역 A B C D의 인접 관계가 순환형인 새 그림</title><rect width="700" height="460" fill="white"/><g stroke="#23394f" stroke-width="4" stroke-linejoin="round"><rect x="110" y="90" width="230" height="140" fill="white"/><rect x="340" y="90" width="230" height="140" fill="white"/><rect x="340" y="230" width="230" height="140" fill="white"/><rect x="110" y="230" width="230" height="140" fill="white"/></g><g font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="32" fill="#182433" text-anchor="middle"><text x="225" y="174">A</text><text x="455" y="174">B</text><text x="455" y="313">C</text><text x="225" y="313">D</text><text x="350" y="421" font-size="17">점 접촉은 인접하지 않음 (A/C, B/D)</text></g></svg>