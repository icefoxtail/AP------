<svg xmlns="http://www.w3.org/2000/svg" width="700" height="460" viewBox="0 0 700 460" role="img" aria-label="네 영역의 모든 쌍이 서로 경계선을 공유하는 새 영역 그림"><title>네 영역의 모든 쌍이 서로 경계선을 공유하는 새 영역 그림</title><rect width="700" height="460" fill="white"/><g stroke="#23394f" stroke-width="4" stroke-linejoin="round"><polygon points="100,367 300,71 300,195 215,301" fill="#f1f6f9"/><polygon points="300,71 510,367 391,301 300,195" fill="#f7f5eb"/><polygon points="100,367 215,301 391,301 510,367" fill="#f4f5fa"/><polygon points="300,195 215,301 391,301" fill="#e1eaf1"/></g><g font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="32" fill="#182433" text-anchor="middle"><text x="221" y="202">A</text><text x="387" y="202">B</text><text x="301" y="264">C</text><text x="301" y="339">D</text><text x="350" y="425" font-size="18">A,B,C,D는 각 두 영역씩 경계선을 공유함</text></g></svg>