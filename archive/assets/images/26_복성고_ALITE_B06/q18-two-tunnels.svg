<svg xmlns="http://www.w3.org/2000/svg" width="800" height="460" viewBox="0 0 800 460" role="img" aria-labelledby="svg-title-ea177950e4" aria-describedby="svg-desc-ea177950e4"><title id="svg-title-ea177950e4">원기둥을 관통하는 서로 겹치지 않는 두 구멍</title><desc id="svg-desc-ea177950e4">반지름 10, 높이 4인 원기둥을 한 변 2와 s인 정사각기둥 두 개가 위아래로 관통한다. 두 구멍은 원기둥 안에서 겹치지 않고 0&lt;s&lt;4이며, 남은 겉넓이는 280π+54이다. 2+s를 묻는다.</desc><rect width="800" height="460" fill="white"/><g font-family="Noto Sans KR,Malgun Gothic,sans-serif" font-size="22" fill="#182433" stroke-linejoin="round"><ellipse cx="350" cy="133" rx="250" ry="66" stroke="#23394f" stroke-width="3.5" fill="none"/><path d="M100 133 V345 M600 133 V345 M100 345 Q350 429 600 345" stroke="#23394f" stroke-width="3.5" fill="none"/><polygon points="229,113 277,113 293,142 245,142" fill="white" stroke="#23394f" stroke-width="3"/><polygon points="365,111 449,111 475,156 391,156" fill="white" stroke="#23394f" stroke-width="3"/><path d="M229 113 V321 M277 113 V321 M293 142 V342 M245 142 V342" stroke="#6b8094" stroke-width="2.4" fill="none" stroke-dasharray="9 7"/><path d="M365 111 V305 M449 111 V305 M475 156 V338 M391 156 V338" stroke="#6b8094" stroke-width="2.4" fill="none" stroke-dasharray="9 7"/><text x="240" y="106">2</text><text x="406" y="104">s</text><text x="630" y="245">h=4</text><path d="M608 133 V345" stroke="#23394f" stroke-width="3.5" fill="none"/></g></svg>