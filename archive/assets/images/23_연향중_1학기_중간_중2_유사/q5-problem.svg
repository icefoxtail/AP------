<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" width="680" height="400" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">같은 넓이의 직사각형과 삼각형을 나란히 비교한다. 변의 기호는 발문 값이고 도형 크기는 대표 배치이므로 일반적인 축척을 뜻하지 않는다. 삼각형 높이 h의 값은 주어지지 않았다.</title><desc id="visual-desc">왼쪽 직사각형의 가로 4a의 세제곱 b의 제곱, 세로 3ab가 표시되어 있고, 오른쪽 삼각형의 밑변 8a의 제곱 b의 다섯제곱과 미지 높이 h가 표시되어 있다. 삼각형 높이에는 직각 표식이 있다.</desc><rect width="680" height="400" fill="#fff"/><g data-layer="30"><line id="sAB" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="65" y1="255" x2="211.666666667" y2="255"/></g><g data-layer="30"><line id="sBC" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="211.666666667" y1="255" x2="211.666666667" y2="145"/></g><g data-layer="30"><line id="sCD" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="211.666666667" y1="145" x2="65" y2="145"/></g><g data-layer="30"><line id="sDA" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="65" y1="145" x2="65" y2="255"/></g><g data-layer="30"><line id="sEF" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="321.666666667" y1="255" x2="615" y2="255"/></g><g data-layer="30"><line id="sFG" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="615" y1="255" x2="468.333333333" y2="145"/></g><g data-layer="30"><line id="sGE" data-role="line" stroke