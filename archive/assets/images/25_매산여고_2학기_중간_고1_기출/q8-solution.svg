<svg data-visual-type="proof-flow" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="PROOF_FLOW" data-axis-scale-mode="NOT_APPLICABLE" data-fact-hash="97bc85595068404213b09922de89984869591daab23d89652243fa713b51c5ba" data-visual-provenance="deterministic-python-independent-facts" >
<title id="title">직선의 부호 관계</title><desc id="desc">원본 그래프의 부호 정보에서 새 직선이 지나지 않는 사분면을 판정하는 흐름</desc>
<style>
.text{font-family:"Noto Sans KR", "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;fill:#111111}.math{font-family:"STIX Two Math", "Cambria Math", "Times New Roman", serif;font-style:italic;fill:#111111}
.title{font-family:"Noto Sans KR", "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;font-size:15px;font-weight:700;fill:#111111}.note{font-family:"Noto Sans KR", "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;font-size:11.5px;fill:#333}
.label{font-family:"STIX Two Math", "Cambria Math", "Times New Roman", serif;font-size:13px;font-style:italic;fill:#111111}.small{font-family:"Noto Sans KR", "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;font-size:10.5px;fill:#444}
</style><rect width="640" height="300" fill="#ffffff"/><text x="28.00" y="30.00" class="title" text-anchor="start">그래프의 부호 → 계수의 부호 → 새 직선의 절편</text><rect x="30" y="70" width="170" height="72" rx="8" fill="#f4f4f4" stroke="#555"/><text x="115.00" y="90.00" class="note" text-anchor="middle" font-weight="700">원본 직선</text><text x="115.00" y="106.00" class="note" text-anchor="middle">기울기 &gt; 0</text><text x="115.00" y="122.00" class="note" text-anchor="middle">x절편 &gt; 0</text><text x="115.00" y="138.00" class="note" text-anchor="middle">y절편 &lt; 0</text><rect x="235" y="70" width="170" height="72" rx="8" fill="#f4f4f4" stroke="#555"/><text x="320.00" y="90.00" class="note" text-anchor="middle" font-weight="700">계수 관계</text><text x="320.00" y="106.00" class="note" text-anchor="middle">a,b는 반대 부호</text><text x="320.00" y="122.00" class="note" text-anchor="middle">b,c는 같은 부호</text><rect x="440" y="70" width="170" height="72" rx="8" fill="#f4f4f4" stroke="#555"/><text x="525.00" y="90.00" class="note" text-anchor="middle" font-weight="700">새 직선 bx+cy+a=0</text><text x="525.00" y="106.00" class="note" text-anchor="middle">기울기 &lt; 0</text><text x="525.00" y="122.00" class="note" text-anchor="middle">x절편 &gt; 0</text><text x="525.00" y="138.00" class="note" text-anchor="middle">y절편 &gt; 0</text><line x1="200.00" y1="106.00" x2="235.00" y2="106.00" stroke="#777" stroke-width="1.2" stroke-linecap="round" /><line x1="405.00" y1="106.00" x2="440.00" y2="106.00" stroke="#777" stroke-width="1.2" stroke-linecap="round" /><rect x="170" y="190" width="300" height="66" rx="10" fill="#fff" stroke="#111" stroke-width="2.05"/><text x="320.00" y="218.00" class="note" text-anchor="middle">제1·2·4사분면을 지나고</text><text x="320.00" y="241.00" class="title" text-anchor="middle">제3사분면은 지나지 않는다.</text></svg>
