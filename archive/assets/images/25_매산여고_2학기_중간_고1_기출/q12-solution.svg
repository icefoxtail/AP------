</style><rect width="640" height="360" fill="#ffffff"/><text x="30.00" y="30.00" class="title" text-anchor="start">두 축에 동시에 접하면 중심의 좌표 절댓값이 반지름</text><line x1="201.25" y1="55.00" x2="201.25" y2="305.00" stroke="#111111" stroke-width="1.2" stroke-linecap="round" /><text x="208.25" y="68.00" class="label" text-anchor="start">y</text><line x1="45.00" y1="242.50" x2="405.00" y2="242.50" stroke="#111111" stroke-width="1.2" stroke-linecap="round" /><text x="399.00" y="235.50" class="label" text-anchor="end">x</text><circle cx="138.75" cy="180.00" r="62.50" stroke="#111111" stroke-width="2.05" fill="none" /><circle cx="138.75" cy="180.00" r="2.20" stroke="#111111" stroke-width="1.0" fill="#111111" /><text x="145.75" y="173.00" class="label" text-anchor="start">C(−2,2)</text><circle cx="138.75" cy="242.50" r="2.20" stroke="#111111" stroke-width="1.0" fill="#111111" /><text x="145.75" y="258.50" class="label" text-anchor="start">T₁</text><circle cx="201.25" cy="180.00" r="2.20" stroke="#111111" stroke-width="1.0" fill="#111111" /><text x="209.25" y="172.00" class="label" text-anchor="start">T₂</text><line x1="138.75" y1="180.00" x2="138.75" y2="242.50" stroke="#777" stroke-width="1.0" stroke-linecap="round" /><line x1="138.75" y1="180.00" x2="201.25" y2="180.00" stroke="#777" stroke-width="1.0" stroke-linecap="round" /><rect x="455" y="80" width="160" height="220" rx="8" fill="#f4f4f4" stroke="#bbb" stroke-width="1"/><text x="469.00" y="107.00" class="title" text-anchor="start">핵심 관계</text><text x="469.00" y="133.00" class="note" text-anchor="start">이동 후 중심=(a−4,b−2)</text><text x="469.00" y="155.00" class="note" text-anchor="start">반지름=a</text><text x="469.00" y="177.00" class="note" text-anchor="start">|a−4|=a → a=2</text><text x="469.00" y="199.00" class="note" text-anchor="start">|b−2|=2, b&gt;0 → b=4</text><text x="469.00" y="221.00" class="note" text-anchor="start">a+b=6</text></svg>
