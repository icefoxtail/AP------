<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 510" width="700" height="510" role="img" aria-labelledby="title desc"><title id="title">꼭짓점과 세로축 눈금이 보이는 이차함수의 그래프</title><desc id="desc">파란 포물선은 아래쪽 꼭짓점에서 두 가지가 위로 올라간다. 점선은 꼭짓점을 가로축의 1과 세로축의 −2에 각각 연결한다. 세로축 눈금 1에서 포물선이 축을 지난다.</desc><rect width="700" height="510" fill="white" /><line x1="50.0000" y1="326.4057" x2="650.0000" y2="326.4057" stroke="#586574" stroke-width="1.65" stroke-linecap="round" /><polygon points="650.0000,326.4057 637.0000,321.4057 637.0000,331.4057" fill="#586574" /><text x="667.0000" y="318.4057" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#586574" text-anchor="middle">x</text><line x1="201.4851" y1="455.0000" x2="201.4851" y2="67.0000" stroke="#586574" stroke-width="1.65" stroke-linecap="round" /><polygon points="201.4851,67.0000 196.4851,80.0000 206.4851,80.0000" fill="#586574" /><text x="217.4851" y="73.0000" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#586574" text-anchor="middle">y</text><circle cx="201.4851485148515" cy="326.4057142857143" r="4.6" fill="#28364b" /><text x="186.4851" y="353.4057" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">O</text><line x1="350.0000" y1="415.0914" x2="350.0000" y2="326.4057" stroke="#586574" stroke-width="2.05" stroke-linecap="round" stroke-dasharray="7 5" /><line x1="201.4851" y1="415.0914" x2="350.0000" y2="415.0914" stroke="#586574" stroke-width="2.05" stroke-linecap="round" stroke-dasharray="7 5" /><line x1="196.4851" y1="282.0629" x2="206.4851" y2="282.0629" stroke="#586574" stroke-width="1.9" stroke-linecap="round" /><text x="180.4851" y="290.0629" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#586574" text-anchor="middle">1</text><line x1="196.4851" y1="415.0914" x2="206.4851" y2="415.0914" stroke="#586574" stroke-width="1.9" stroke-linecap="round" /><text x="180.4851" y="423.0914" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#586574" text-anchor="middle">−2</text><line x1="350.0000" y1="321.4057" x2="350.0000" y2="331.4057" stroke="#586574" stroke-width="1.9" stroke-linecap="round" /><text x="353.0000" y="312.4057" font-size="28" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#586574" text-anchor="middle">1</text><path d="M 118.3168 91.3531 Q 350.0000 738.8298 581.6832 91.3531" stroke="#205d9c" stroke-width="6.05" stroke-linecap="round" fill="none" /><circle cx="201.4851485148515" cy="282.0628571428571" r="4.6" fill="#205d9c" /><circle cx="350.0" cy="415.0914285714286" r="4.6" fill="#aa5411" /><text x="437.0000" y="46.0000" font-size="32" font-family="Malgun Gothic, Cambria Math, sans-serif" font-weight="600" fill="#28364b" text-anchor="middle">y = ax² + bx + c</text></svg>
