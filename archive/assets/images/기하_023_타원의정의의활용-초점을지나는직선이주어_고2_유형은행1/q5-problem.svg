<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 528 404" width="528" height="404" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-ellipse-figure="ellipse-figure-v1" data-conic="ELLIPSE" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="6" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round"><title id="visual-title">타원 x²/49+y²/24=1에서 오른쪽 초점 F를 지나는 직선 l과 왼쪽 초점 F′를 지나는 직선 m이 평행하고 그 사이 수선 길이가 6인 그림</title><desc id="visual-desc">가로로 긴 타원의 오른쪽 초점 F를 지나는 대각선 l은 제3사분면의 타원 위 점 P를 지난다. 왼쪽 초점 F′를 지나는 평행선 m은 제1사분면의 점 Q를 지난다. 두 직선 사이에는 점선 수선과 길이 6, 직각 표시가 있다.</desc><rect width="528" height="404" fill="#fff"/><g data-layer="10"><line id="axis-x" data-role="axis" data-axis="x" x1="34" y1="202.35" x2="494" y2="202.35" fill="none" stroke="#444" stroke-width="1.1"/></g><g data-layer="10"><line id="axis-y" data-role="axis" data-axis="y" x1="264" y1="370" x2="264" y2="34.71" fill="none" stroke="#444" stroke-width="1.1"/></g><g data-layer="11"><polygon id="axis-x-head" data-role="axis-head" data-axis="x" points="494,202.35 485,198.75 485,205.95" fill="#444" stroke="none"/></g><g data-layer="11"><polygon id="axis-y-head" data-role="axis-head" data-axis="y" points="264,34.71 260.4,43.71 267.6,43.71" fill="#444" stroke="none"/></g><g data-layer="25"><path id="curve" data-role="curve" data-curve="ELLIPSE" d="M471.74 202.35 L471.71 199.82 L471.62 197.28 L471.46 194.74 L471.24 192.21 L470.95 189.68 L470.6 187.16 L470.19 184.63 L469.72 182.12 L469.18 179.61 L468.59 177.11 L467.93 174.61 L467.2 172.12 L466.42 169.65 L465.57 167.18 L464.66 164.72 L463.69 162.28 L462.66 159.85 L461.57 157.43 L460.42 155.02 L459.21 152.63 L457.94 150.25 L456.61 147.89 L455.23 145.54 L453.78 143.22 L452.28 140.91 L450.72 138.62 L449.1 136.35 L447.43 134.1 L445.7 131.87 L443.91 129.66 L442.07 127.47 L440.18 125.31 L438.23 123.17 L436.23 121.05 L434.17 118.96 L432.07 116.9 L429.91 114.86 L427.7 112.84 L425.45 110.86