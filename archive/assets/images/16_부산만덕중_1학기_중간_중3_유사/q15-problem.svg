<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 380" width="420" height="380" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="visual-title visual-desc" data-engine-version="geometry-visual-v1" data-geometry-style-version="AP_GEOMETRY_PRINT_V1_0_DRAFT" data-geometry-preset="GEOMETRY_STANDARD" data-graph-style-version="AP_GRAPH_PRINT_V1_1_DRAFT" data-geometry-mode="COORDINATE_GEOMETRY_HYBRID" data-axis-scale-mode="EQUAL_UNIT" data-geometry-fact-hash="44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" data-visual-provenance="independent-facts-python" style="max-width:100%;height:auto;stroke-linejoin:round;stroke-linecap:round" data-publication-profile="fragment-publication-spike-v1" data-safe-margin="12"><title id="visual-title">직사각형 두 개가 결합된 형태의 다각형에서 각 변의 길이가 주어져 있다.</title><desc id="visual-desc">직사각형 두 개가 붙은 계단 모양의 다각형이다. 가장 위쪽 가로변의 길이는 루트 32 빼기 루트 3이고, 왼쪽 위 세로변은 2 루트 2, 왼쪽 아래 세로변은 루트 2 더하기 루트 3이며, 가운데 계단 가로변의 길이는 루트 2 더하기 루트 3이다.</desc><rect width="420" height="380" fill="#fff"/><g data-layer="10"><path id="rg1" data-role="region" stroke="none" stroke-width="1.6" fill="#e4e7ec" data-owner-points="A B C D E F G" data-mark="region" data-mark-id="rg1" fill-rule="evenodd" d="M51.071428571 327.256493506 L51.071428571 182.775974026 L51.071428571 52.743506494 L224.448051948 52.743506494 L224.448051948 182.775974026 L368.928571429 182.775974026 L368.928571429 327.256493506 L51.071428571 327.256493506 Z"/></g><g data-layer="30"><line id="sAB" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="51.071428571" y1="327.256493506" x2="51.071428571" y2="182.775974026"/></g><g data-layer="30"><line id="sBC" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="51.071428571" y1="182.775974026" x2="51.071428571" y2="52.743506494"/></g><g data-layer="30"><line id="sCD" data-role="line" stroke="#111" stroke-width="1.6" fill="none" x1="51.071428571" y1="52.743506494" x2="224.448051948" y2="52.743506494"/></g><g data-laye