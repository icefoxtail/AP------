<svg xmlns="http://www.w3.org/2000/svg" width="680" height="380" viewBox="0 0 680 380" role="img" aria-label="삼각형 확률밀도함수. 꼭짓점 (0,0), (1,1), (2,0). 왼쪽 0부터 0.5까지의 작은 삼각형 넓이는 1/8.">
<rect width="680" height="380" fill="#ffffff"/>
<text x="35" y="37" font-size="21" font-family="NanumSquare, sans-serif" fill="#202c3a">확률밀도함수의 넓이로 확률 구하기</text>
<line x1="95" y1="310" x2="615" y2="310" stroke="#25374a" stroke-width="2"/>
<line x1="95" y1="325" x2="95" y2="75" stroke="#25374a" stroke-width="2"/>
<polygon points="95,310 215,210 215,310" fill="#f6be71" fill-opacity=".7"/>
<polyline points="95,310 335,110 575,310" fill="none" stroke="#226da8" stroke-width="4" stroke-linejoin="round"/>
<line x1="215" y1="210" x2="215" y2="310" stroke="#b86b0a" stroke-width="2" stroke-dasharray="6 4"/>
<line x1="335" y1="110" x2="335" y2="310" stroke="#607184" stroke-width="1.5" stroke-dasharray="5 5"/>
<text x="85" y="335" font-size="17" font-family="NanumSquare, sans-serif">0</text><text x="196" y="335" font-size="17" font-family="NanumSquare, sans-serif">1/2</text><text x="330" y="335" font-size="17" font-family="NanumSquare, sans-serif">1</text><text x="570" y="335" font-size="17" font-family="NanumSquare, sans-serif">2</text>
<text x="70" y="117" font-size="18" font-family="NanumSquare, sans-serif">1</text><text x="618" y="315" font-size="18" font-family="NanumSquare, sans-serif">x</text><text x="62" y="80" font-size="18" font-family="NanumSquare, sans-serif">f(x)</text>
<text x="140" y="283" font-size="18" font-family="NanumSquare, sans-serif" fill="#7d4400">1/8</text><text x="400" y="75" font-size="18" font-family="NanumSquare, sans-serif" fill="#226da8">전체 넓이 = 1</text>
<text x="400" y="102" font-size="18" font-family="NanumSquare, sans-serif" fill="#226da8">구하는 넓이 = 7/8</text>
<text x="35" y="365" font-size="15" font-family="NanumSquare, sans-serif" fill="#455366">그림은 x와 f(x)의 선형 비율에 맞춰 그렸습니다.</text>
</svg>