<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>시험지 보관함 · JS 아카이브</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="../archive2-tokens.css?v=20261110-shell-1">
  <link rel="stylesheet" href="../archive2-standalone.css?v=20261116-standalone-1">
  <link rel="stylesheet" href="../archive2-navigation.css?v=20261116-menu-tools-1">
  <link rel="stylesheet" href="../archive2-assign.css?v=20261116-polish-1">
  <style>
/* 시험지 보관함: only what is specific to this page. Frame, buttons, fields and the card family come from archive2-standalone.css. */
.archive-sub { margin-top: 0; }
.stats {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  justify-content: flex-end;
}

/* Filters: category tabs first, then search and selects. */
.filter-band {
  margin: 0 0 24px;
  padding: 0 0 20px;
  border-bottom: 1px solid var(--line);
}
.filter-inner {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}
.fb-tabs {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  flex: 1 1 100%;
}
.fb-search {
  flex: 1 1 320px;
  min-width: 240px;
}
.fb-search input {
  width: 100%;
}
.fb-sel {
  min-width: 140px;
  font-weight: 700;
}
.fb-original-toggle {
  padding: 0 20px;
}

.sec-block { padding: 0; }
.card-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 16px;
  align-items: stretch;
}
.card-grid > .empty-state { grid-column: 1 / -1; }
body.archive2-assessment .exam-card.type-sheet {
  margin: 0;
  cursor: pointer;
}
body.archive2-assessment .exam-card.type-sheet:hover {
  border-color: var(--control-line);
}
body.archive2-assessment .exam-card.is-active {
  border: 2px solid var(--ink);
  background: var(--selected);
}
body.archive2-assessment .exam-card.is-active .card-body { padding: 19px 21px; }
body.archive2-assessment .card-body {
  display: flex;
  flex-direction: column;
  flex: 1 1 auto;
  min-height: 190px;
}
/* The pack title is a button (it opens the preview) that reads as a title. */
.action-btn.paper-title {
  display: block;
  width: 100%;
  min-height: 44px;
  margin: 0 0 4px;
  padding: 0;
  border: 0;
  border-radius: 0;
  background: none;
  color: var(--ink);
  text-align: left;
  font-size: 19px;
  font-weight: 700;
  line-height: 1.35;
}
.action-btn.paper-title:hover:not(:disabled) {
  background: none;
  text-decoration: underline;
  text-underline-offset: 3px;
}
.dx-row {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
  margin-top: 12px;
}
.dx {
  display: inline-flex;
  align-items: center;
  min-height: 24px;
  padding: 0 8px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--chip);
  color: var(--ink);
  font-size: 12px;
  font-weight: 700;
}
.dx-low { border-color: var(--good); background: var(--good-bg); color: var(--good); }
.dx-high { border-color: var(--brand); background: var(--brand-soft); color: var(--brand-soft-ink); }
.skill-line { margin-top: 8px; }

/* Card buttons: pills, 출제 is the filled one. */
.card-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  padding: 0 22px 20px;
}
body.archive2-assessment .exam-card.is-active .card-actions { padding: 0 21px 19px; }
.action-btn {
  padding: 0 16px;
  font-size: 14px;
}
.action-btn[data-action="exam"] {
  background: var(--ink);
  color: #fff;
}
.action-btn[data-action="exam"]:hover:not(:disabled) { background: var(--ink-hover); }

/* Dialogs: panel look (2px ink border, 16px radius), the same as the 출제 panel. */
.modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 2000;
  align-items: center;
  justify-content: center;
  padding: 16px;
  background: rgba(23, 23, 28, 0.5);
}
.modal-overlay.open { display: flex; }
.modal-box {
  width: 420px;
  max-width: 100%;
  max-height: 100%;
  overflow-y: auto;
  padding: 28px 28px 24px;
  border: 2px solid var(--ink);
  border-radius: var(--radius-panel);
  background: var(--surface);
  color: var(--ink);
  text-align: center;
}
.modal-title {
  margin-bottom: 8px;
  font-family: var(--font-display);
  font-weight: 400;
  font-size: 22px;
  line-height: 1.3;
}
.modal-sub {
  color: var(--ink-2);
  font-size: 14px;
  line-height: 1.6;
}
.modal-actions {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin: 22px 0 14px;
}
.modal-btn-primary,
.modal-btn-secondary,
.modal-btn-cancel {
  width: 100%;
  padding: 0 24px;
  font-size: 15px;
}
.modal-btn-primary {
  background: var(--ink);
  color: #fff;
}
.modal-btn-primary:hover:not(:disabled) { background: var(--ink-hover); }
.modal-btn-primary.is-alt {
  background: var(--surface);
  color: var(--ink);
}
.modal-btn-primary.is-alt:hover:not(:disabled) { background: var(--chip); }
.modal-btn-cancel { margin-top: 8px; }
.modal-close-btn {
  min-height: 44px;
  padding: 0 16px;
  border: 0;
  background: none;
  color: var(--brand-ink);
  font-size: 14px;
  text-decoration: underline;
  text-underline-offset: 3px;
}
.modal-close-btn:hover:not(:disabled) { background: none; color: var(--brand-hover); }
.qpp-btns {
  display: flex;
  gap: 12px;
  margin: 22px 0 14px;
}
.qpp-opt {
  flex: 1;
  min-height: 88px;
  padding: 0;
  border: 2px solid var(--ink);
  border-radius: var(--radius-panel);
  font-family: var(--font-display);
  font-weight: 400;
  font-size: 34px;
}
.qpp-opt:hover:not(:disabled) {
  background: var(--ink);
  color: #fff;
}
.teacher-class-stack {
  display: flex;
  flex-direction: column;
  gap: 14px;
  margin: 20px 0 4px;
  text-align: left;
}
.teacher-class-label {
  display: block;
  margin-bottom: 6px;
  color: var(--ink-2);
  font-size: 14px;
  font-weight: 700;
}
.teacher-class-select { width: 100%; }
.teacher-class-note {
  margin-top: 8px;
  color: var(--ink-2);
  font-size: 13px;
  line-height: 1.5;
}
.modal-note {
  margin: 20px 0;
  color: var(--ink-2);
  font-size: 14px;
  line-height: 1.6;
  text-align: left;
}
.modal-note.is-warn { color: var(--danger); }
.modal-login {
  display: flex;
  flex-direction: column;
  gap: 10px;
  padding: 4px 0;
  text-align: left;
}
.modal-login .modal-note { margin: 0; }
.modal-err { min-height: 18px; font-size: 13px; }
.modal-field { width: 100%; }

@media (max-width: 960px) {
  .card-grid { grid-template-columns: 1fr; }
  .stats { justify-content: flex-start; }
}
@media (max-width: 600px) {
  .filter-band { margin-bottom: 16px; padding-bottom: 16px; }
  .fb-search { flex-basis: 100%; min-width: 0; }
  .fb-sel { flex: 1 1 calc(50% - 8px); min-width: 0; }
  .fb-tabs > button { flex: 1 1 auto; padding: 0 12px; }
  body.archive2-assessment .card-body { padding: 18px 16px; min-height: 0; }
  body.archive2-assessment .exam-card.is-active .card-body { padding: 17px 15px; }
  .card-actions { padding: 0 16px 18px; }
  .exam-card.is-active .card-actions { padding: 0 15px 17px; }
  .modal-box { padding: 24px 18px 20px; }
}
  </style>
</head>
<body class="archive2-standalone archive2-assessment archive2-shell">
  <header data-archive-navigation="standalone" data-archive-base="../" data-archive-view="saved" data-archive-title="시험지 보관함" class="archive-navigation"></header>
  <!-- 소단원 평가팩은 빠른 평가에서 들어온 화면이라 메뉴의 현재 칸을 빠른 평가로 둔다. -->
  <script>if (new URLSearchParams(location.search).get('scope') === 'subunit') { var navHost = document.querySelector('[data-archive-navigation]'); navHost.dataset.archiveView = 'five-minute'; navHost.dataset.archiveTitle = '소단원 평가 보관함'; }</script>
  <!-- AP Math OS가 주소 뒤(#apmsess=)에 실어 보낸 로그인을 메뉴가 읽기 전에 먼저 복원한다. -->
  <script src="../archive-session.js"></script>
  <script src="../archive2-session.js?v=20261110-library-2"></script>
  <script src="../archive2-navigation.js?v=20261119-diagnostic-1"></script>
  <script src="../archive2-error-detail.js?v=20261118-error-detail-1"></script>
  <script src="../archive2-assign.js?v=20261119-assessment-pack-1"></script>
  <div class="modal-overlay" id="assessmentPrintModeModal">
    <div class="modal-box">
      <div class="modal-title">시험지 출력 방식 선택</div>
      <div class="modal-sub">원하시는 출력 형태를 선택하세요.</div>
      <div class="modal-actions">
        <button class="modal-btn-primary" type="button" onclick="selectAssessmentPrintMode(false)">일반 시험지 출력</button>
        <button class="modal-btn-primary is-alt" type="button" onclick="selectAssessmentPrintMode(true)">AP 제출 QR 시험지 출력</button>
      </div>
      <button class="modal-close-btn" type="button" onclick="closeAssessmentModal()">취소</button>

  </div>

  <div class="modal-overlay" id="assessmentQppModal">
    <div class="modal-box">
      <div class="modal-title">시험지 출력 형식</div>
      <div class="modal-sub">한 페이지에 담을 문항 수를 선택하세요.</div>
      <div class="qpp-btns">

      <div class="modal-title">출제 학년 선택</div>
      <div class="modal-sub">선택한 학년의 모든 반에 시험지가 출제됩니다.</div>

          <h1 class="archive-title sa-title">시험지 보관함</h1>
          <p class="archive-sub sa-lead">기말 모의고사 · 진단평가 · 단원평가 · 중간·기말평가를 범위 확인 후 바로 출력합니다.</p>
        </div>
        <div class="stats" id="stats"></div>
      </div>
      <div class="filter-band">
        <div class="filter-inner">
          <div class="fb-tabs" role="group" aria-label="평가 구분">
            <button class="fb-original-toggle active" type="button" data-category="26년 2학기 기말 모의고사">26년 2학기 기말 모의고사</button>
            <button class="fb-original-toggle" type="button" data-category="진단평가">진단평가</button>
            <button class="fb-original-toggle" type="button" data-category="단원평가">단원평가</button>
            <button class="fb-original-toggle" type="button" data-category="중간·기말평가">중간·기말평가</button>
          </div>
          <div class="fb-search">
            <input id="search" type="search" aria-label="평가 검색" placeholder="평가명, 학년, 단원, 범위 검색">
          </div>
          <select class="fb-sel" id="grade" aria-label="학년"><option value="">전체 학년</option></select>
          <select class="fb-sel" id="count" aria-label="문항 수">
            <option value="">전체 문항 수</option>
            <option value="10">10문항</option>
            <option value="15">15문항</option>
            <option value="20">20문항</option>

  <script src="assessment-packs-1sem.generated.js"></script>
  <script src="assessment-packs-2sem-final-mock.generated.js"></script>
  <script>
    const MOCK_CATEGORY = '26년 2학기 기말 모의고사';
    const BASE_DATA = window.APMATH_ASSESSMENT_PACKS_1SEM || { packs: [], sourceSummary: {} };
    // 모의고사 자료는 별도 파일이다. 파일이 없거나 비어 있으면 탭을 숨기고 기존 화면 그대로 동작한다.
    const MOCK_DATA = window.APMATH_ASSESSMENT_PACKS_MOCK_2SEM_FINAL || { packs: [], categoryOrder: [] };
    const DATA = {
      ...BASE_DATA,
      packs: [...(MOCK_DATA.packs || []), ...(BASE_DATA.packs || [])],
      categoryOrder: [...(MOCK_DATA.packs || []).length ? [MOCK_CATEGORY] : [],
        ...(BASE_DATA.categoryOrder || ['진단평가', '단원평가', '중간·기말평가'])],
    };
    const subunitScope = new URLSearchParams(location.search).get('scope') === 'subunit';
    const packs = (DATA.packs || []).filter((pack) =>
      !subunitScope || (pack.category === '단원평가' && String(pack.id || '').startsWith('SUB_1SEM_')));
    const categories = subunitScope ? ['단원평가'] :
      (DATA.categoryOrder || ['진단평가', '단원평가', '중간·기말평가']);
    const requestedCategory = new URLSearchParams(location.search).get('category');
    let active = categories.includes(requestedCategory) ? requestedCategory : (categories[0] || '진단평가');

    function escapeHTML(value) {
      return String(value ?? '').replace(/[&<>"']/g, (ch) => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;',
      }[ch]));
    }

    function countObj(obj) {
      return Object.entries(obj || {}).map(([key, value]) => `${key} ${value}`).join(' · ') || '-';
    }

    function renderStats() {
      const summary = DATA.sourceSummary || {};
      if (!subunitScope && active === MOCK_CATEGORY) {
        const mockPacks = packs.filter((pack) => pack.category === MOCK_CATEGORY);
        const total = mockPacks.reduce((n, pack) => n + (pack.questions || []).length, 0);
        const essay = mockPacks.reduce((n, pack) => n + (pack.questions || []).filter((q) => q.questionType === '서술형').length, 0);
        document.getElementById('stats').innerHTML =
          `<div class="stat"><strong>${mockPacks.length}</strong>모의고사</div>` +
          `<div class="stat"><strong>${total}</strong>문항</div>` +
          `<div class="stat"><strong>${essay}</strong>서술형</div>`;
        return;
      }
      if (subunitScope) {
        const questionCount = packs.reduce((total, pack) => total + (pack.questions || []).length, 0);
        document.getElementById('stats').innerHTML =
          `<div class="stat"><strong>${packs.length}</strong>평가</div>` +
          `<div class="stat"><strong>${questionCount}</strong>문항</div>`;
        return;
      }
      document.getElementById('stats').innerHTML = [
        `<div class="stat"><strong>${packs.filter((pack) => pack.category !== MOCK_CATEGORY).length}</strong>평가</div>`,
        `<div class="stat"><strong>${summary.uniqueTextQuestions || 0}</strong>서로 다른 문항</div>`,
        `<div class="stat"><strong>${summary.imageExcluded || 0}</strong>그림 문항 제외</div>`,
      ].join('');
    }

    function setupControls() {
      const availableCategories = new Set(categories);
      document.querySelectorAll('.fb-original-toggle').forEach((button) => {
        if (!availableCategories.has(button.dataset.category)) {
          button.style.display = 'none';
          return;
        }
        button.addEventListener('click', () => {
          active = button.dataset.category;
          render();
        });
      });

      const grades = [...new Set(packs.map((pack) => pack.grade).filter(Boolean))]
        .sort((a, b) => a.localeCompare(b, 'ko'));
      document.getElementById('grade').innerHTML = '<option value="">전체 학년</option>' +
        grades.map((grade) => `<option value="${escapeHTML(grade)}">${escapeHTML(grade)}</option>`).join('');

      ['search', 'grade', 'count'].forEach((id) => {
        document.getElementById(id).addEventListener('input', render);
      });
    }

    function filterPacks() {
      const query = document.getElementById('search').value.trim().toLowerCase();
      const grade = document.getElementById('grade').value;
      const count = document.getElementById('count').value;
      return packs.filter((pack) => {
        if (pack.category !== active) return false;
        if (grade && pack.grade !== grade) return false;
        if (count && String(pack.questionCount) !== count) return false;
        if (!query) return true;
        return [
          pack.title,
          pack.category,
          pack.grade,
          pack.unitLabel,
          pack.unitKey,
          pack.scopeLabel,
          (pack.scopeUnits || []).join(' '),
          pack.purpose,
        ].join(' ').toLowerCase().includes(query);
      });
    }

    function renderDifficultyChips(mix) {
      if (!mix || typeof mix !== 'object') return '';
      const order = ['하', '중', '상'];
      const styles = { '하': 'dx dx-low', '중': 'dx dx-mid', '상': 'dx dx-high' };
      return order
        .filter((k) => mix[k] != null)
        .map((k) => `<span class="${styles[k]}">${escapeHTML(k)}${escapeHTML(String(mix[k]))}</span>`)
        .join('');
    }

    const GRADE_COLORED = new Set(['중1', '중2', '중3', '고1', '고2', '고3']);

    // 카드 범위 설명에서 단원 코드 "(M1-01)", "(H22-C-06~09)"는 화면에 보이지 않게 한다(교사가 모르는 내부 코드).
    function plainScopeText(text) {
      return String(text || '').replace(/\s*\((?:[A-Z]\d*)(?:-[A-Z0-9]+)+(?:~\d+)?\)/g, '');
    }

    function renderMeta(pack) {
      return [
        `<span class="meta-badge primary"${GRADE_COLORED.has(pack.grade) ? ` data-grade="${escapeHTML(pack.grade)}"` : ''}>${escapeHTML(pack.grade || '학년 미정')}</span>`,
        `<span class="meta-badge">${escapeHTML(pack.questionCount || 0)}문항</span>`,
        pack.courseLabel ? `<span class="meta-badge">${escapeHTML(pack.courseLabel)}</span>` : '',
      ].filter(Boolean).join('');
    }

    function isDiagnosticAssessmentPack(pack) {
      if (!pack) return false;
      return pack.category === '진단평가' ||
        (pack.title || '').includes('진단평가') ||
        (pack.id || '').startsWith('DIAG_');
    }

    function getDiagnosticStorageKey(diagnosticId) {
      return `apms.diagnostic.assessment.result.${diagnosticId}`;
    }

    function getDiagnosticResultsListKey() {
      return 'apms.diagnostic.assessment.results';
    }

    function getDiagnosticCurrentKey() {
      return 'apms.diagnostic.assessment.current';
    }

    function todayString() {
      return new Date(Date.now() + 9 * 60 * 60 * 1000).toISOString().slice(0, 10);
    }

    function createDiagnosticAssessmentDraft(pack) {
      // questionCount 0 fallback 금지: 진단평가는 실제 pack.questions 배열이 있을 때만 시작한다.
      const hasDiagnosticQuestions = Array.isArray(pack.questions) && pack.questions.length > 0;
      if (!hasDiagnosticQuestions) {
        alert('문항 수 확인이 필요합니다.');
        return null;
      }
      const diagnosticId = `diagnostic_${String(pack.id || 'pack').replace(/[^a-zA-Z0-9_-]+/g, '_')}_${Date.now()}`;
      const payload = {
        diagnosticId,
        packId: pack.id,
        packTitle: pack.title || '',
        category: pack.category || '',
        type: pack.examType || '',
        grade: pack.grade || '',
        scope: pack.scopeLabel || pack.unitLabel || '',
        range: pack.scopeLabel || pack.unitLabel || '',

      };
      localStorage.setItem(getDiagnosticStorageKey(diagnosticId), JSON.stringify(payload));

    function startDiagnosticAssessment(pack) {

    function openPack(packId, mode) {
      const pack = packs.find((item) => item.id === packId);
      if (!pack) return alert('평가팩을 찾지 못했습니다.');
      if (mode === 'preview') {
        goAssessmentMixedEngine(pack, 'exam', 4, { preview: true }).catch((error) => console.error(error));
        return;
      }
      if (mode === 'diagnostic-start') {
        startDiagnosticAssessment(pack);
        return;

        const analysisUrl = './assessment-analysis.html?packId=' + encodeURIComponent(pack.id);

        return;

      if (mode === 'exam') {
        openAssessmentPrintModeModal(pack);

      goAssessmentMixedEngine(pack, mode || 'exam', 2).catch((error) => console.error(error));

    function escapeModalText(value) {
      return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function getAssessmentQrTeacherName(row) {
      const raw = row?.teacher_name || row?.teacherName || row?.teacher || row?.owner_name || row?.ownerName || '';
      const name = String(raw || '').replace(/\s*선생님\s*$/g, '').trim();
      return name || '담당 미지정';
    }

    function sortAssessmentQrClassesForSelect(list) {
      const gradeRank = { '중1': 1, '중2': 2, '중3': 3, '고1': 4, '고2': 5, '고3': 6 };
      return [...list].sort((a, b) => {
        const ag = gradeRank[String(a.grade || '').trim()] || 99;
        const bg = gradeRank[String(b.grade || '').trim()] || 99;
        if (ag !== bg) return ag - bg;
        const an = String(a.name || '');
        const bn = String(b.name || '');
        const nameDiff = an.localeCompare(bn, 'ko');
        if (nameDiff !== 0) return nameDiff;
        return String(a.id || '').localeCompare(String(b.id || ''), 'ko');
      });
    }

    function getAssessmentClassGrade(row) {
      const explicit = String(row?.grade || row?.grade_label || '').trim();
      if (explicit) return explicit;
      const text = `${row?.name || ''} ${row?.class_name || ''}`;
      return ['중1', '중2', '중3', '고1', '고2'].find((grade) => text.includes(grade)) || '';
    }

    function getAssessmentAvailableGrades(classes) {
      const grades = new Set((classes || []).map(getAssessmentClassGrade).filter(Boolean));
      return ['중1', '중2', '중3', '고1', '고2'].filter((grade) => grades.has(grade));
    }

    function getAssessmentClassesForGrade(grade) {
      return sortAssessmentQrClassesForSelect((_assessmentQrClassRows || []).filter((row) => getAssessmentClassGrade(row) === grade));
    }

    const ASSESSMENT_AP_API_BASE = (window.APMATH_API_BASE || 'https://ap-math-os-v2612.js-pdf.workers.dev/api').replace(/\/+$/, '');
    const ASSESSMENT_QR_AUTH_REQUIRED_HTML = 'AP 제출 QR은 AP Math OS 로그인 후 사용할 수 있습니다. 일반 출력은 가능합니다.';
    const ASSESSMENT_QR_LOGIN_REQUIRED_HTML = 'AP Math OS 로그인 후 다시 시도해 주세요.';
    const ASSESSMENT_QR_FORBIDDEN_HTML = '권한이 없습니다. 원장/담당 선생님 권한을 확인하세요.';
    const ASSESSMENT_QR_NETWORK_HTML = '서버 연결에 실패했습니다. 일반 출력은 가능합니다.';

    function assessmentGeneralPrintButtonHtml() {
      return `<button class="modal-btn-primary" type="button" onclick="closeAssessmentModal(); goAssessmentMixedEngine(window._pendingAssessmentClassSelectPack, 'exam', window._pendingAssessmentClassSelectQpp || 4)">일반 시험지 출력</button>`;
    }

    function assessmentQrNoticeHtml(message) {
      return `<div class="modal-note is-warn">${message}</div>${assessmentGeneralPrintButtonHtml()}`;
    }

    function notifyAssessmentQrApiFailure(status, context) {
      const message = status === 401
        ? ASSESSMENT_QR_LOGIN_REQUIRED_HTML
        : status === 403
          ? ASSESSMENT_QR_FORBIDDEN_HTML
          : ASSESSMENT_QR_NETWORK_HTML;
      console.warn(`[assessment QR] ${context || 'api'} failed:`, status, message);
      if (typeof window.toast === 'function') window.toast(message, status === 403 ? 'warn' : 'error');
    }

    function getApmathSession() {
      try {
        return JSON.parse(localStorage.getItem('APMATH_SESSION') || 'null');
      } catch (error) {
        return null;
      }
    }

    function sanitizeApmathSessionForStorage(data) {
      const safe = { ...(data || {}) };
      delete safe.raw_password;
      delete safe.password;
      delete safe.pw;
      return safe;
    }

    function saveApmathSession(data) {
      localStorage.setItem('APMATH_SESSION', JSON.stringify(sanitizeApmathSessionForStorage(data)));
    }

    function encodeAssessmentSessionPayload(payload) {
      return encodeURIComponent(btoa(unescape(encodeURIComponent(JSON.stringify(payload)))));
    }

    function appendCurrentArchiveSessionToHash(url) {
      const session = getApmathSession();
      if (!session) return url;
      const payload = sanitizeApmathSessionForStorage({
        login_id: session.login_id || session.loginId || '',
        id: session.id || session.user?.id || '',
        name: session.name || session.user?.name || '',
        role: session.role || session.user?.role || session.auth?.role || '',
        session_token: session.session_token || '',
        expires_at: session.expires_at || ''
      });
      if (!payload.session_token && !payload.login_id) return url;
      return url + (url.indexOf('#') === -1 ? '#' : '&') + 'apmsess=' + encodeAssessmentSessionPayload(payload);
    }

    function encodeBasicAuthUnicodeSafe(value) {
      const str = String(value || '');
      try {
        return btoa(unescape(encodeURIComponent(str)));
      } catch (error) {
        return btoa(str);
      }
    }

    function getAssessmentAssignmentAuthHeader() {
      try {
        const session = getApmathSession();
        if (!session) return null;
        if (session.session_token) return { 'Authorization': 'Bearer ' + session.session_token };
        const mem = window.__APMATH_AUTH_MEMORY || {};
        const loginId = mem.login_id || session.login_id || session.loginId;
        const rawPassword = mem.raw_password || session.raw_password;
        if (!loginId || !rawPassword) return null;
        return { 'Authorization': 'Basic ' + encodeBasicAuthUnicodeSafe(`${loginId}:${rawPassword}`) };
      } catch (error) {
        return null;
      }
    }

    function restoreApmathSessionFromHash() {
      const hash = String(window.location.hash || '');
      const match = /(?:^#|&)apmsess=([^&]+)/.exec(hash);
      if (!match) return false;
      try {
        const incoming = JSON.parse(decodeURIComponent(escape(atob(decodeURIComponent(match[1])))));
        if (!incoming || (!incoming.session_token && !incoming.login_id)) return false;
        const existing = getApmathSession();
        saveApmathSession({
          ...(existing || {}),
          ...incoming,
          login_id: incoming.login_id || incoming.loginId || (existing && (existing.login_id || existing.loginId)) || '',
          id: incoming.id || (existing && existing.id) || '',
          name: incoming.name || (existing && existing.name) || '',
          role: incoming.role || (existing && existing.role) || '',
          session_token: incoming.session_token || (existing && existing.session_token) || '',
          expires_at: incoming.expires_at || (existing && existing.expires_at) || '',
          restored_from_archive_hash: true,
          restored_at: new Date().toISOString()
        });
        return true;
      } catch (error) {
        console.warn('[assessment auth] failed to restore AP session from hash:', error);
        return false;
      } finally {
        try {
          history.replaceState(null, '', window.location.pathname + window.location.search);
        } catch (error) {}
      }
    }

    function stableAssessmentJson(value) {
      if (Array.isArray(value)) return `[${value.map(stableAssessmentJson).join(',')}]`;
      if (value && typeof value === 'object') {
        return `{${Object.keys(value).sort().map((key) => `${JSON.stringify(key)}:${stableAssessmentJson(value[key])}`).join(',')}}`;
      }
      return JSON.stringify(value ?? null);
    }

    function simpleAssessmentHash(value) {
      const text = stableAssessmentJson(value);
      let hash = 2166136261;
      for (let i = 0; i < text.length; i++) {
        hash ^= text.charCodeAt(i);
        hash = Math.imul(hash, 16777619);
      }
      return `fnv1a_${(hash >>> 0).toString(16).padStart(8, '0')}`;
    }

    function buildAssessmentPackHash(pack) {
      return simpleAssessmentHash({
        pack_id: pack?.id || '',
        questions: (pack?.questions || []).map((question, index) => ({
          order: index + 1,
          source_file: question?._sourceFile || '',
          source_question_no: question?._sourceQuestionNo || '',
          standard_unit_key: question?.standardUnitKey || '',
          level: question?.level || '',
        })),
      });
    }

    function getAssessmentAssignmentBatchId(pack, gradeLabel) {
      return `batch_assessment_${String(pack?.id || 'pack').replace(/[^a-zA-Z0-9_-]+/g, '_')}_${String(gradeLabel || 'class').replace(/[^a-zA-Z0-9가-힣_-]+/g, '_')}_${Date.now()}`;
    }

    async function registerAssessmentClassExamAssignment(classRow, pack, key, options = {}) {
      const authHeader = getAssessmentAssignmentAuthHeader();
      if (!authHeader) {
        notifyAssessmentQrApiFailure(401, 'class-exam-assignments auth');
        const authError = new Error('auth required');
        authError.status = 401;
        throw authError;
      }
      const gradeLabel = options.gradeLabel || pack?.grade || getAssessmentClassGrade(classRow);
      const payload = {
        class_id: classRow.id,
        exam_title: pack.title,
        exam_date: new Date(Date.now() + 9 * 60 * 60 * 1000).toISOString().split('T')[0],
        question_count: (pack.questions || []).length,
        archive_file: `MIXED:${key}`,
        source_type: 'mixed',
        mixed_payload_json: JSON.stringify({ questions: pack.questions || [], meta: { customTitle: pack.title || '', packId: pack.id || '' } }),
        pdf_qpp: Number(options.qpp || _pendingAssessmentQpp || 4),
        pack_id: pack.id,
        grade_label: gradeLabel,
        pack_hash: buildAssessmentPackHash(pack),
        assignment_batch_id: options.assignmentBatchId || getAssessmentAssignmentBatchId(pack, gradeLabel),
        target_scope: options.target_scope || 'class'
      };
      const res = await fetch(`${ASSESSMENT_AP_API_BASE}/class-exam-assignments`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', ...authHeader },
        body: JSON.stringify(payload),
      });
      if (!res.ok) {
        notifyAssessmentQrApiFailure(res.status, 'class-exam-assignments');
        const httpError = new Error(`assignment failed: ${res.status}`);
        httpError.status = res.status;
        // 서버가 PDF를 만들다 실패해도 출제 행은 이미 생겼을 수 있다(응답에 출제 번호가 오면 그렇다).
        const failedBody = await res.json().catch(() => ({}));
        httpError.assignmentId = failedBody?.assignment?.id || '';
        throw httpError;
      }
      const data = await res.json().catch(() => ({}));
      if (data?.assignment?.pdf_status === 'failed') {
        const pdfError = new Error(data.assignment.pdf_error || '시험지 PDF 생성 실패');
        pdfError.pdfFailed = true;
        pdfError.assignmentId = data.assignment.id || '';
        throw pdfError;
      }
      return data;
    }

    function renderAssessmentTeacherClassSelector(classes) {
      _assessmentQrClassRows = Array.isArray(classes) ? classes : [];
      _assessmentQrGroupedByTeacher = {};

      _assessmentQrClassRows.forEach((classRow) => {
        const teacher = getAssessmentQrTeacherName(classRow);
        if (!_assessmentQrGroupedByTeacher[teacher]) _assessmentQrGroupedByTeacher[teacher] = [];
        _assessmentQrGroupedByTeacher[teacher].push(classRow);
      });

      const teachers = Object.keys(_assessmentQrGroupedByTeacher).sort((a, b) => a.localeCompare(b, 'ko'));
      if (!teachers.length) {
        return '<div class="modal-note is-warn">등록된 반이 없습니다. AP Math OS에서 반을 먼저 생성하세요.</div>';
      }

      const teacherOptions = teachers
        .map((teacher) => `<option value="${escapeModalText(teacher)}">${escapeModalText(teacher)} 선생님</option>`)
        .join('');

      return `
        <div class="teacher-class-stack">
          <div>
            <label class="teacher-class-label" for="assessment-teacher-select">1. 선생님 선택</label>
            <select id="assessment-teacher-select" class="teacher-class-select" onchange="renderAssessmentClassSelectByTeacher()">${teacherOptions}</select>
          </div>
          <div>
            <label class="teacher-class-label" for="assessment-class-select">2. 반 선택</label>
            <select id="assessment-class-select" class="teacher-class-select"></select>
            <div class="teacher-class-note">같은 이름의 반이라도 선택한 선생님의 반으로 구분되어 QR에 연결됩니다.</div>
          </div>
          <button class="modal-btn-secondary" type="button" onclick="previewPendingAssessment()">시험지 확인</button>
          <button class="modal-btn-primary" type="button" onclick="confirmAssessmentClassSelection()">출제</button>
        </div>`;

    function renderAssessmentClassSelectByTeacher() {
      const teacherSelect = document.getElementById('assessment-teacher-select');
      const classSelect = document.getElementById('assessment-class-select');
      if (!teacherSelect || !classSelect) return;

      const teacher = teacherSelect.value || Object.keys(_assessmentQrGroupedByTeacher)[0] || '';
      const rows = sortAssessmentQrClassesForSelect(_assessmentQrGroupedByTeacher[teacher] || []);

      classSelect.innerHTML = rows.map((classRow) => {

        return `<option value="${escapeModalText(classRow.id)}" data-teacher="${escapeModalText(teacher)}" data-class-name="${escapeModalText(classRow.name || '')}">${escapeModalText(labelParts)}</option>`;

          body.innerHTML = `

              <input id="assessment-apmath-login-id" type="text" placeholder="아이디" class="modal-field">

        return;
      }

      try {
        const res = await fetch(`${ASSESSMENT_AP_API_BASE}/qr-classes`, { headers: authHeader });
        if (res.status === 401) {
          body.innerHTML = assessmentQrNoticeHtml(ASSESSMENT_QR_LOGIN_REQUIRED_HTML);

        }
        if (res.status === 403) {
          body.innerHTML = assessmentQrNoticeHtml(ASSESSMENT_QR_FORBIDDEN_HTML);
          return;
        }
        if (!res.ok) throw new Error('API Request Failed');

        const data = await res.json();
        if (data && data.success && Array.isArray(data.classes)) {
          if (data.classes.length === 0) {
            body.innerHTML = '<div class="modal-note is-warn">등록된 반이 없습니다. AP Math OS에서 반을 먼저 생성하세요.</div>';

          body.innerHTML = renderAssessmentTeacherClassSelector(data.classes);
          renderAssessmentClassSelectByTeacher();
        } else {
          throw new Error('Invalid data format');
        }
      } catch (error) {
        console.error(error);
        body.innerHTML = assessmentQrNoticeHtml(ASSESSMENT_QR_NETWORK_HTML);
        return;
      }
    }

      // 여러 반을 등록하는 동안 기다리게 되므로, 새 창은 클릭 순간에 먼저 연다.

    window.previewPendingAssessment = previewPendingAssessment;

    // ── 시험지 열기 보조 (2026-11-19 핫픽스) ──────────────────────────────────────────
    // 열 때마다 mixedQuestions_assessment_<팩>_<시각> / mixedMeta_… 를 새로 쓰는데 지우는 코드가 없어, 오래 쓴 브라우저는 저장 공간(약 5MB)이
    // 가득 차 setItem이 던지고 창이 안 열렸다. 이 두 이름의 키만, 최근 몇 개를 남기고 정리한다. 가득 차면 더 많이 정리한 뒤 다시 쓰고,
    // 그래도 안 되면 엔진이 평가팩 번호(packId)로 팩 자료 파일에서 직접 읽게 한다. Archive 2.0 초안·로그인·mix_ 키는 건드리지 않는다.
    const ASSESSMENT_SNAPSHOT_KEEP = 6;
    const ASSESSMENT_SNAPSHOT_KEEP_ON_QUOTA = 2;
    // 끝이 시각(열 때 만든 키)이면 그 시각으로, 출제 패널의 고정 키(assessment_<팩>_<해시>)는 저장해 둔 meta.generatedAt으로 최근 순서를 정한다.
    const ASSESSMENT_SNAPSHOT_KEY = /^mixed(?:Questions|Meta)_(assessment_.+)$/;
    const ASSESSMENT_SNAPSHOT_TIME = /_(\d{10,})$/;

    function assessmentSnapshotTime(key) {
      const stamped = ASSESSMENT_SNAPSHOT_TIME.exec(key);
      if (stamped) return Number(stamped[1]);
      try {
        const meta = JSON.parse(localStorage.getItem('mixedMeta_' + key) || 'null');
        const parsed = Date.parse(meta && meta.generatedAt);
        return Number.isFinite(parsed) ? parsed : 0;
      } catch (error) { return 0; }
    }

    function listAssessmentSnapshots() {
      const times = new Map();
      try {
        for (let i = 0; i < localStorage.length; i += 1) {
          const match = ASSESSMENT_SNAPSHOT_KEY.exec(localStorage.key(i) || '');
          if (match && !times.has(match[1])) times.set(match[1], assessmentSnapshotTime(match[1]));
        }
      } catch (error) { /* 정리는 보조 동작 */ }
      return [...times].map(([k, t]) => ({ k, t })).sort((a, b) => b.t - a.t);
    }

    function pruneAssessmentSnapshots(keepCount, protectKey) {
      const list = listAssessmentSnapshots();
      const kept = new Set(list.slice(0, keepCount).map((entry) => entry.k));
      if (protectKey) kept.add(protectKey);
      list.forEach((entry) => {
        if (kept.has(entry.k)) return;
        try {
          localStorage.removeItem('mixedQuestions_' + entry.k);
          localStorage.removeItem('mixedMeta_' + entry.k);
        } catch (error) { /* 다음 정리에서 다시 */ }
      });
    }

    // 엔진에 넘길 자료를 저장한다. 저장하지 못하면 false(그때는 packId로 연다).
    function storeAssessmentSnapshot(key, questions, meta) {
      let questionsJson;
      let metaJson;
      try {
        questionsJson = JSON.stringify(questions);
        metaJson = JSON.stringify(meta);
      } catch (error) { return false; }
      const write = () => {
        localStorage.setItem('mixedQuestions_' + key, questionsJson);
        try {
          localStorage.setItem('mixedMeta_' + key, metaJson);
        } catch (error) {
          try { localStorage.removeItem('mixedQuestions_' + key); } catch (ignored) { /* ignore */ }
          throw error;
        }
      };
      pruneAssessmentSnapshots(ASSESSMENT_SNAPSHOT_KEEP - 1, key);
      for (const keep of [null, ASSESSMENT_SNAPSHOT_KEEP_ON_QUOTA, 0]) {
        if (keep !== null) pruneAssessmentSnapshots(keep, key);
        try { write(); return true; } catch (error) { /* 더 많이 정리하고 다시 */ }
      }
      return false;
    }

    // 새 창은 클릭한 그 순간에 먼저 연다. 출제 등록처럼 오래 걸리는 일을 기다린 뒤에 열면 브라우저가 팝업으로 보고 막을 수 있다.
    function openAssessmentWindowNow() {
      let win = null;
      try { win = window.open('', '_blank'); } catch (error) { win = null; }
      if (win) {
        try {
          win.document.title = '시험지 준비 중';
          win.document.body.style.cssText = 'font:16px sans-serif;padding:24px;color:#333';
          win.document.body.textContent = '시험지를 준비하는 중입니다…';
        } catch (error) { /* 안내문은 보조 */ }
      }
      return win;
    }

    function showAssessmentNotice(message, link) {

        box.style.cssText = 'position:fixed;left:50%;top:16px;transform:translateX(-50%);z-index:9999;max-width:min(92vw,640px);padding:14px 18px;border-radius:12px;background:#FFF7E6;border:1px solid #F0B429;color:#5B3A00;font-size:14px;line-height:1.5;box-shadow:0 8px 24px rgba(0,0,0,.18)';
        const text = document.createElement('span');

    function showAssessmentWindowTarget(win, url) {
      if (win && !win.closed) {
        try { win.location.replace(url); return true; } catch (error) { /* 아래에서 다시 연다 */ }
      }
      let again = null;
      try { again = window.open(url, '_blank'); } catch (error) { again = null; }
      if (again) return true;
      showAssessmentNotice('브라우저가 새 창(팝업)을 막았습니다. 이 사이트의 팝업을 허용하거나 아래 링크로 여세요.', url);
      return false;
    }

    // 출제 등록이 실패했을 때 선생님께 보일 안내(영어 원문·내부 용어 없이, 등록됐는지 모를 때는 모른다고 말한다).
    // 등록 요청은 서버가 PDF를 만드는 동안 기다리므로, 실패 응답이어도 출제 행이 이미 생겼을 수 있다: 무조건 "다시 누르라"고 하지 않는다.
    function assessmentRegistrationFailureMessage(error) {
      const status = Number(error?.status || 0);
      const tail = ' 시험지는 QR 없이 열었습니다.';
      if (status === 401) return '로그인이 만료되었거나 로그인되어 있지 않아 출제되지 않았습니다. 다시 로그인한 뒤 출제해 주세요.' + tail;
      if (status === 403) return '이 반에 출제할 권한이 없어 출제되지 않았습니다.' + tail;
      if (status >= 400 && status < 500) return '출제 정보가 올바르지 않아 출제되지 않았습니다.' + tail;
      if (error?.assignmentId) return '출제는 등록된 것으로 보이지만 출제본 PDF를 만들지 못했습니다. 다시 출제하면 같은 반에 중복될 수 있으니 출제 내역에서 먼저 확인해 주세요.' + tail;
      const reason = status >= 500 ? '서버 오류' : '서버에 연결하지 못함';
      return '출제가 등록되었는지 확인하지 못했습니다(' + reason + '). 출제 내역에서 확인한 뒤, 없으면 다시 출제해 주세요.' + tail;
    }

    // 반환: { registrationFailed: '선생님용 안내문' } — 등록이 실패해 QR 없이 연 경우만.
    async function goAssessmentMixedEngine(pack, mode, qpp, options = {}) {
      // 첫 await 전에, 클릭 순간에 창부터 연다(학년별 출제처럼 호출하는 쪽이 이미 열었으면 그것을 쓴다).
      const win = options.targetWindow !== undefined ? options.targetWindow : openAssessmentWindowNow();
      try {
        const key = options.keyOverride || `assessment_${pack.id}_${Date.now()}`;
        const questions = (pack.questions || []).map((question) => ({ ...question }));
        let assignmentRegistered = !!(options.assignmentRegistered || options.preRegistered);
        const meta = {
          title: pack.title,
          customTitle: pack.title,
          count: questions.length,
          qpp,
          generatedAt: new Date().toISOString(),
          assessmentPackId: pack.id,
          category: pack.category,
          packId: pack.id,
          grade: pack.grade,
          gradeLabel: options.gradeLabel || pack.grade,
          scopeLabel: pack.scopeLabel,
          assignmentBatchId: options.assignmentBatchId || '',
          targetScope: options.target_scope || (options.submitQr ? 'class' : ''),
        };
        const stored = storeAssessmentSnapshot(key, questions, meta);

        const url = new URL('../mixed_engine.html', window.location.href);
        url.searchParams.set('key', key);
        url.searchParams.set('qpp', qpp);
        url.searchParams.set('mode', mode || 'exam');
        // 자료를 브라우저에 저장하지 못했으면 엔진이 평가팩 번호로 팩 자료 파일에서 직접 읽는다.
        // (출제 패널로 낸 시험지는 자료가 나중에 정리돼 사라져도 다시 열리도록 packId를 항상 붙인다.)
        if (!stored || options.packIdFallback) url.searchParams.set('packId', pack.id);
        if (options.date) url.searchParams.set('date', options.date);
        if (options.preview) {
          // Reuse the renderer's frozen-paper UI so review cannot shuffle or edit
          // a copy that differs from the pack subsequently assigned by this page.
          url.searchParams.set('studio', '1');
          url.searchParams.set('preview', '1');
          url.searchParams.set('submitQr', '0');
          url.searchParams.set('preRegistered', '1');
          url.searchParams.set('assignmentRegistered', '1');
        }
        let registrationFailed = options.registrationFailed || '';
        if (options.submitQr) url.searchParams.set('submitQr', '1');
        if (options.classId) url.searchParams.set('class', options.classId);
        if (options.teacherName) url.searchParams.set('teacher', options.teacherName);
        if (options.className) url.searchParams.set('className', options.className);
        if (assignmentRegistered) {
          url.searchParams.set('assignmentRegistered', '1');
          url.searchParams.set('preRegistered', '1');
        }
        if (options.submitQr && options.classId && !assignmentRegistered) {
          try {
            await registerAssessmentClassExamAssignment(
              { id: options.classId, name: options.className || '', grade: options.gradeLabel || pack.grade, teacher_name: options.teacherName || '' },
              pack,
              key,
              {
                assignmentBatchId: options.assignmentBatchId || getAssessmentAssignmentBatchId(pack, options.gradeLabel || pack.grade || 'class'),
                target_scope: options.target_scope || 'class',
                gradeLabel: options.gradeLabel || pack.grade || '',
                qpp,
              }
            );
            assignmentRegistered = true;
            url.searchParams.set('assignmentRegistered', '1');
            url.searchParams.set('preRegistered', '1');
          } catch (error) {
            console.warn('[assessment assignment] 사전 등록 실패:', error);
            registrationFailed = assessmentRegistrationFailureMessage(error);
          }
        }
        if (registrationFailed) {
          // 등록이 확인되지 않았는데 제출 QR이 찍혀 나가면 학생이 제출할 곳이 없을 수 있다: QR 없이, 반 연결 없이 연다.
          ['class', 'teacher', 'className', 'assignmentRegistered', 'preRegistered'].forEach((name) => url.searchParams.delete(name));
          url.searchParams.set('submitQr', '0');
        }
        showAssessmentWindowTarget(win, appendCurrentArchiveSessionToHash(url.toString()));
        return registrationFailed ? { registrationFailed } : {};
      } catch (error) {
        if (win && !win.closed) { try { win.close(); } catch (ignored) { /* ignore */ } }
        showAssessmentNotice('시험지를 열지 못했습니다. 화면을 새로고침한 뒤 다시 시도해 주세요.');
        throw error;
      }
    }

    // ── 출제 패널 (2026-11-19) ─────────────────────────────────────────────────────────
    // 보관함의 "AP 제출 QR 시험지 출력"(출제)은 Archive 2.0 출제 패널(archive2-assign.js)의 단원별(unit) 종류로 낸다.
    // 서버·요청 본문은 옛 모달(registerAssessmentClassExamAssignment)과 같다: 머리글 없는 POST /class-exam-assignments,
    // MIXED:<키> + mixed_payload_json, pack_id·pack_hash. 옛 모달 길은 주소에 assign=legacy가 있을 때(또는 패널 스크립트가 없을 때) 그대로 쓴다.
    let _assessmentAssignPanel = null; // { handle, pack, key }

    function assessmentAssignPanelAvailable() {
      const panel = window.Archive2Assign;
      return Boolean(panel && typeof panel.open === 'function' && !(typeof panel.useLegacy === 'function' && panel.useLegacy(window.location.search)));
    }

    // 같은 팩·같은 문항 구성은 늘 같은 키다 → 같은 반·같은 날 다시 출제하면 서버가 같은 건으로 받고 패널이 "이미 출제됨"으로 보여 준다.
    function assessmentAssignKey(pack) {
      return `assessment_${String(pack?.id || 'pack').replace(/[^a-zA-Z0-9_-]+/g, '_')}_${buildAssessmentPackHash(pack)}`;
    }

    // 팩 번호에 학년이 들어 있다(M1=중1, H2=고2). pack.grade는 '고11'처럼 학기가 붙은 표시라서 반 학년과 맞지 않는다.
    function assessmentAssignGrade(pack) {
      const match = /(?:^|_)([MH])([123])(?:_|$)/.exec(String(pack?.id || ''));
      return match ? (match[1] === 'M' ? '중' : '고') + match[2] : String(pack?.grade || '');
    }

    function assessmentAssignItem(pack) {
      return {
        kind: 'unit',
        snapshotKey: assessmentAssignKey(pack),
        title: pack.title,
        identityTitle: pack.title,
        grade: assessmentAssignGrade(pack),
        subject: '',
        count: (pack.questions || []).length,
        packId: pack.id,
        packHash: buildAssessmentPackHash(pack),
        ref: { packId: pack.id },
      };
    }

    // 옛 모달이 보내던 mixed_payload_json과 같은 문항·meta(패널이 쪽당 문항 qpp를 meta에 더한다).
    async function loadAssessmentAssignPayload(item) {
      const pack = packs.find((entry) => entry.id === item?.ref?.packId);
      if (!pack || !Array.isArray(pack.questions) || !pack.questions.length) throw new Error('평가팩 문항을 찾지 못했습니다.');
      return { questions: pack.questions, meta: { customTitle: pack.title || '', packId: pack.id || '' } };
    }

    // 패널에 꽂는 request(route, {method, headers, body, timeoutMs}). unit-past-exams.js assignRequest와 같은 규칙:
    // 로그인이 없으면 요청 없이 status=401, 제한 시간이 지나면 timeout=true, 오류 응답은 error.status/error.data를 달아 던진다.
    function assessmentAssignRequest(route, opt = {}) {
      const rule = window.Archive2Session;
      const memory = window.__APMATH_AUTH_MEMORY || {};
      const loggedIn = !rule || !rule.state || (memory.login_id && memory.raw_password) || rule.state(getApmathSession()).loggedIn;
      const auth = loggedIn ? getAssessmentAssignmentAuthHeader() : null;
      if (!auth) return Promise.reject(Object.assign(new Error('교사 로그인이 필요합니다.'), { status: 401 }));
      const method = opt.method || (opt.body ? 'POST' : 'GET');
      const timeoutMs = Number.isFinite(opt.timeoutMs) && opt.timeoutMs > 0 ? opt.timeoutMs : (method === 'GET' ? 30000 : 0);
      const controller = timeoutMs && typeof AbortController === 'function' ? new AbortController() : null;
      const perform = async () => {
        const response = await fetch(ASSESSMENT_AP_API_BASE + route, {
          method,
          headers: { ...auth, ...(opt.body ? { 'Content-Type': 'application/json' } : {}), ...(opt.headers || {}) },
          ...(opt.body ? { body: JSON.stringify(opt.body) } : {}),
          ...(controller ? { signal: controller.signal } : {}),
        });
        return { response, data: await response.json().catch(() => ({})) };
      };
      return (async () => {
        let result;
        let timer;
        if (timeoutMs) {
          const pending = perform();
          pending.catch(() => {});
          try {
            result = await Promise.race([pending, new Promise((_, reject) => {
              timer = setTimeout(() => {
                if (controller) controller.abort();
                reject(Object.assign(new Error('응답이 늦습니다. 잠시 뒤 다시 시도해 주세요.'), { timeout: true }));
              }, timeoutMs);
            })]);
          } finally { clearTimeout(timer); }
        } else result = await perform();
        const { response, data } = result;
        if (!response.ok || data.success === false) {
          const error = new Error(data.error || `요청 실패 (${response.status})`);
          error.status = response.status;
          error.data = data;
          throw error;
        }
        return data;
      })();
    }

    function openAssessmentAssignPanel(pack, opener) {
      const panel = window.Archive2Assign;
      if (panel.isOpen && panel.isOpen()) return;
      try {
        const item = assessmentAssignItem(pack);
        const handle = panel.open({
          items: [item],
          unit: { load: loadAssessmentAssignPayload },
          request: assessmentAssignRequest,
          opener,
          jobActions: assessmentAssignJobActions,
          onClose: () => { _assessmentAssignPanel = null; },
        });
        _assessmentAssignPanel = { handle, pack, key: item.snapshotKey };
      } catch (error) {
        console.error(error);
        alert(error.message || '출제 준비에 실패했습니다.');
      }
    }

    // 출제가 안 된 반(실패·결과 모름)의 줄에는 시험지를 QR 없이 여는 단추를 둔다: 출제 등록이 안 됐는데 QR이 찍혀 나가면
    // 학생이 제출할 곳이 없을 수 있으니 반 연결 없이 연다(#2565 핫픽스와 같은 규칙). 안내는 패널 줄의 실패 문구가 맡는다.
    function assessmentAssignJobActions(job) {
      return job && (job.status === 'failed' || job.status === 'unknown')
        ? [{ action: 'plain-paper', label: 'QR 없이 시험지 열기' }]
        : [];
    }

    function openAssessmentPlainPaper() {
      const context = _assessmentAssignPanel;
      if (!context) return;
      const qpp = Number(context.handle.model.state.qpp) || 4;
      goAssessmentMixedEngine(context.pack, 'exam', qpp, {
        keyOverride: context.key,
        packIdFallback: true,
        registrationFailed: '출제가 확인되지 않아 시험지를 QR 없이 열었습니다.',
      }).catch((error) => console.error(error));
    }

    // 출제된 건의 시험지·해설·정답 단추(패널 결과 줄). 시험지는 반 연결 + 등록 끝남 표시로 열어 엔진이 다시 등록하지 않는다(옛 출제 뒤 열기와 같다).
    function openAssessmentAssignedOutput(assignmentId, mode) {
      const context = _assessmentAssignPanel;
      const model = context && context.handle && context.handle.model;
      const job = model && model.state.jobs.find((entry) => entry.assignmentId === assignmentId);
      if (!job) return;
      if (mode === 'sol' || mode === 'ans') {
        goAssessmentMixedEngine(context.pack, mode, 2, { keyOverride: context.key, packIdFallback: true }).catch((error) => console.error(error));
        return;
      }
      const cls = (model.state.classes || []).find((entry) => entry.id === job.classId) || {};
      const body = job.body || {};
      goAssessmentMixedEngine(context.pack, 'exam', Number(model.state.qpp) || 4, {
        submitQr: true,
        classId: job.classId,
        teacherName: cls.teacher || '',
        className: job.className || cls.name || '',
        target_scope: body.target_scope || 'class',
        gradeLabel: body.grade_label || '',
        assignmentBatchId: body.assignment_batch_id || '',
        keyOverride: context.key,
        assignmentRegistered: true,
        preRegistered: true,
        packIdFallback: true,
        date: job.date,
      }).catch((error) => console.error(error));
    }

    document.addEventListener('click', (event) => {
      const target = event.target;
      if (!target || !target.closest || !_assessmentAssignPanel) return;
      const output = target.closest('dialog.assign-panel [data-action="assignment-output-direct"]');
      if (output) {
        event.preventDefault();
        openAssessmentAssignedOutput(output.dataset.assignment, output.dataset.mode);
        return;
      }
      if (target.closest('dialog.assign-panel [data-host-action="plain-paper"]')) {
        event.preventDefault();
        openAssessmentPlainPaper();
      }
    });
    // 패널이 열려 있을 때 뒤로 가기는 패널이 먼저 처리한다(닫기·진행 중 잠금).
    window.addEventListener('popstate', () => {
      const panel = window.Archive2Assign;
      if (panel && typeof panel.handlePopState === 'function') panel.handlePopState();
    });

    window.openPack = openPack;
    window.openAssessmentPrintModeModal = openAssessmentPrintModeModal;
    window.selectAssessmentPrintMode = selectAssessmentPrintMode;
    window.confirmAssessmentQpp = confirmAssessmentQpp;
    window.selectAssessmentTarget = selectAssessmentTarget;
    window.openAssessmentClassSelectionModal = openAssessmentClassSelectionModal;
    window.renderAssessmentClassSelectByTeacher = renderAssessmentClassSelectByTeacher;
    window.renderAssessmentGradeClassPreview = renderAssessmentGradeClassPreview;
    window.confirmAssessmentClassSelection = confirmAssessmentClassSelection;
    window.confirmAssessmentGradeSelection = confirmAssessmentGradeSelection;
    window.doAssessmentApmathLoginAndLoadClasses = doAssessmentApmathLoginAndLoadClasses;
    window.doAssessmentApmathLoginAndLoadGrades = doAssessmentApmathLoginAndLoadGrades;
    window.closeAssessmentModal = closeAssessmentModal;
    window.goAssessmentMixedEngine = goAssessmentMixedEngine;

    restoreApmathSessionFromHash();
    // 이미 저장 공간이 가득 찬 브라우저도 이 화면을 여는 것만으로 풀린다(평가 전달 자료만, 최근 몇 개를 남기고 정리).
    pruneAssessmentSnapshots(ASSESSMENT_SNAPSHOT_KEEP);
    if (subunitScope) {
      document.title = '소단원 평가 보관함 · JS 아카이브';
      document.querySelector('.archive-title').textContent = '소단원 평가 보관함';
      document.querySelector('.archive-sub').textContent = '기존 소단원 평가팩을 확인하고 문제·정답·해설을 출력합니다.';
    }
    renderStats();
    setupControls();
    render();
  </script>
</body>
</html>
