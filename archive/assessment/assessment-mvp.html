<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>시험지 보관함 · JS 아카이브</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="../archive2-tokens.css?v=20261110-shell-1">
  <link rel="stylesheet" href="../archive2-standalone.css?v=20261122-header-calm-1">
  <link rel="stylesheet" href="../archive2-navigation.css?v=20261122-header-calm-1">
  <link rel="stylesheet" href="../archive2-assign.css?v=20261116-polish-1">
  <style>
/* 시험지 보관함: only what is specific to this page. Frame, buttons, fields and the card family come from archive2-standalone.css. */
.archive-sub { margin-top: 0; }
.stats {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  justify-content: flex-end;
}

/* Filters: category tabs first, then search and selects. */
.filter-band {
  margin: 0 0 24px;
  padding: 0 0 20px;
  border-bottom: 1px solid var(--line);
}
.filter-inner {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}
.fb-tabs {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  flex: 1 1 100%;
}
.fb-search {
  flex: 1 1 320px;
  min-width: 240px;
}
.fb-search input {
  width: 100%;
}
.fb-sel {
  min-width: 140px;
  font-weight: 700;
}
.fb-original-toggle {
  padding: 0 20px;
}

.sec-block { padding: 0; }
.card-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 16px;
  align-items: stretch;
}
.card-grid > .empty-state { grid-column: 1 / -1; }
body.archive2-assessment .exam-card.type-sheet {
  margin: 0;
  cursor: pointer;
}
body.archive2-assessment .exam-card.type-sheet:hover {
  border-color: var(--control-line);
}
body.archive2-assessment .exam-card.is-active {
  border: 2px solid var(--ink);
  background: var(--selected);
}
body.archive2-assessment .exam-card.is-active .card-body { padding: 19px 21px; }
body.archive2-assessment .card-body {
  display: flex;
  flex-direction: column;
  flex: 1 1 auto;
  min-height: 190px;
}
/* The pack title is a button (it opens the preview) that reads as a title. */
.action-btn.paper-title {
  display: block;
  width: 100%;
  min-height: 44px;
  margin: 0 0 4px;
  padding: 0;
  border: 0;
  border-radius: 0;
  background: none;
  color: var(--ink);
  text-align: left;
  font-size: 19px;
  font-weight: 700;
  line-height: 1.35;
}
.action-btn.paper-title:hover:not(:disabled) {
  background: none;
  text-decoration: underline;
  text-underline-offset: 3px;
}
.dx-row {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
  margin-top: 12px;
}
.dx {
  display: inline-flex;
  align-items: center;
  min-height: 24px;
  padding: 0 8px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--chip);
  color: var(--ink);
  font-size: 12px;
  font-weight: 700;
}
.dx-low { border-color: var(--good); background: var(--good-bg); color: var(--good); }
.dx-high { border-color: var(--brand); background: var(--brand-soft); color: var(--brand-soft-ink); }
.skill-line { margin-top: 8px; }

/* Card buttons: pills, 출제 is the filled one. */
.card-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  padding: 0 22px 20px;
}
body.archive2-assessment .exam-card.is-active .card-actions { padding: 0 21px 19px; }
.action-btn {
  padding: 0 16px;
  font-size: 14px;
}
.action-btn[data-action="exam"] {
  background: var(--ink);
  color: #fff;
}
.action-btn[data-action="exam"]:hover:not(:disabled) { background: var(--ink-hover); }

/* Dialogs: panel look (2px ink border, 16px radius), the same as the 출제 panel. */
.modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 2000;
  align-items: center;
  justify-content: center;
  padding: 16px;
  background: rgba(23, 23, 28, 0.5);
}
.modal-overlay.open { display: flex; }
.modal-box {
  width: 420px;
  max-width: 100%;
  max-height: 100%;
  overflow-y: auto;
  padding: 28px 28px 24px;
  border: 2px solid var(--ink);
  border-radius: var(--radius-panel);
  background: var(--surface);
  color: var(--ink);
  text-align: center;
}
.modal-title {
  margin-bottom: 8px;
  font-family: var(--font-display);
  font-weight: 400;
  font-size: 22px;
  line-height: 1.3;
}
.modal-sub {
  color: var(--ink-2);
  font-size: 14px;
  line-height: 1.6;
}
.modal-actions {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin: 22px 0 14px;
}
.modal-btn-primary,
.modal-btn-secondary,
.modal-btn-cancel {
  width: 100%;
  padding: 0 24px;
  font-size: 15px;
}
.modal-btn-primary {
  background: var(--ink);
  color: #fff;
}
.modal-btn-primary:hover:not(:disabled) { background: var(--ink-hover); }
.modal-btn-primary.is-alt {
  background: var(--surface);
  color: var(--ink);
}
.modal-btn-primary.is-alt:hover:not(:disabled) { background: var(--chip); }
.modal-btn-cancel { margin-top: 8px; }
.modal-close-btn {
  min-height: 44px;
  padding: 0 16px;
  border: 0;
  background: none;
  color: var(--brand-ink);
  font-size: 14px;
  text-decoration: underline;
  text-underline-offset: 3px;
}
.modal-close-btn:hover:not(:disabled) { background: none; color: var(--brand-hover); }
.qpp-btns {
  display: flex;
  gap: 12px;
  margin: 22px 0 14px;
}
.qpp-opt {
  flex: 1;
  min-height: 88px;
  padding: 0;
  border: 2px solid var(--ink);
  border-radius: var(--radius-panel);
  font-family: var(--font-display);
  font-weight: 400;
  font-size: 34px;
}
.qpp-opt:hover:not(:disabled) {
  background: var(--ink);
  color: #fff;
}
.teacher-class-stack {
  display: flex;
  flex-direction: column;
  gap: 14px;
  margin: 20px 0 4px;
  text-align: left;
}
.teacher-class-label {
  display: block;
  margin-bottom: 6px;
  color: var(--ink-2);
  font-size: 14px;
  font-weight: 700;
}
.teacher-class-select { width: 100%; }
.teacher-class-note {
  margin-top: 8px;
  color: var(--ink-2);
  font-size: 13px;
  line-height: 1.5;
}
.modal-note {
  margin: 20px 0;
  color: var(--ink-2);
  font-size: 14px;
  line-height: 1.6;
  text-align: left;
}
.modal-note.is-warn { color: var(--danger); }
.modal-login {
  display: flex;
  flex-direction: column;
  gap: 10px;
  padding: 4px 0;
  text-align: left;
}
.modal-login .modal-note { margin: 0; }
.modal-err { min-height: 18px; font-size: 13px; }
.modal-field { width: 100%; }

@media (max-width: 960px) {
  .card-grid { grid-template-columns: 1fr; }
  .stats { justify-content: flex-start; }
}
@media (max-width: 600px) {
  .filter-band { margin-bottom: 16px; padding-bottom: 16px; }
  .fb-search { flex-basis: 100%; min-width: 0; }
  .fb-sel { flex: 1 1 calc(50% - 8px); min-width: 0; }
  .fb-tabs > button { flex: 1 1 auto; padding: 0 12px; }
  body.archive2-assessment .card-body { padding: 18px 16px; min-height: 0; }
  body.archive2-assessment .exam-card.is-active .card-body { padding: 17px 15px; }
  .card-actions { padding: 0 16px 18px; }
  .exam-card.is-active .card-actions { padding: 0 15px 17px; }
  .modal-box { padding: 24px 18px 20px; }
}
  </style>
</head>
<body class="archive2-standalone archive2-assessment archive2-shell">
  <header data-archive-navigation="standalone" data-archive-base="../" data-archive-view="saved" data-archive-title="시험지 보관함" class="archive-navigation"></header>
  <!-- 소단원 평가팩은 빠른 평가에서 들어온 화면이라 메뉴의 현재 칸을 빠른 평가로 둔다. -->
  <script>if (new URLSearchParams(location.search).get('scope') === 'subunit') { var navHost = document.querySelector('[data-archive-navigation]'); navHost.dataset.archiveView = 'five-minute'; navHost.dataset.archiveTitle = '소단원 평가 보관함'; }</script>
  <!-- AP Math OS가 주소 뒤(#apmsess=)에 실어 보낸 로그인을 메뉴가 읽기 전에 먼저 복원한다. -->
  <script src="../archive-session.js"></script>
  <script src="../archive2-session.js?v=20261119-small-fixes-1"></script>
  <script src="../archive2-navigation.js?v=20261122-ui-quick-3"></script>
  <script src="../archive2-error-detail.js?v=20261118-error-detail-1"></script>
  <script src="../archive2-assign.js?v=20261119-small-fixes-1"></script>
  <div class="modal-overlay" id="assessmentPrintModeModal">
    <div class="modal-box">
      <div class="modal-title">시험지 출력 방식 선택</div>
      <div class="modal-sub">원하시는 출력 형태를 선택하세요.</div>
      <div class="modal-actions">
        <button class="modal-btn-primary" type="button" onclick="selectAssessmentPrintMode(false)">일반 시험지 출력</button>
        <button class="modal-btn-primary is-alt" type="button" onclick="selectAssessmentPrintMode(true)">AP 제출 QR 시험지 출력</button>
      </div>
      <button class="modal-close-btn" type="button" onclick="closeAssessmentModal()">취소</button>
    </div>
  </div>

  <div class="modal-overlay" id="assessmentQppModal">
    <div class="modal-box">
      <div class="modal-title">시험지 출력 형식</div>
      <div class="modal-sub">한 페이지에 담을 문항 수를 선택하세요.</div>
      <div class="qpp-btns">
        <button class="qpp-opt" type="button" onclick="confirmAssessmentQpp(4)">4</button>
        <button class="qpp-opt" type="button" onclick="confirmAssessmentQpp(6)">6</button>
      </div>
      <button class="modal-close-btn" type="button" onclick="closeAssessmentModal()">다음에 하기</button>
    </div>
  </div>

  <div class="modal-overlay" id="assessmentTargetModal">
    <div class="modal-box">
      <div class="modal-title">출제 대상</div>
      <div class="modal-sub">시험지를 출제할 대상을 선택하세요.</div>
      <div class="modal-actions">
        <button class="modal-btn-primary" type="button" onclick="selectAssessmentTarget('class')">반별</button>
        <button class="modal-btn-primary is-alt" type="button" onclick="selectAssessmentTarget('grade')">학년별</button>
      </div>
      <button class="modal-close-btn" type="button" onclick="closeAssessmentModal()">취소</button>
    </div>
  </div>

  <div class="modal-overlay" id="assessmentGradeModalOverlay">
    <div class="modal-box">
      <div class="modal-title">출제 학년 선택</div>
      <div class="modal-sub">선택한 학년의 모든 반에 시험지가 출제됩니다.</div>
      <div id="assessmentGradeModalBody"></div>
      <button class="modal-btn-cancel" type="button" onclick="closeAssessmentModal()">취소</button>
    </div>
  </div>

  <div class="modal-overlay" id="assessmentClassModalOverlay">
    <div class="modal-box">
      <div class="modal-title">출제 학급 선택</div>
      <div class="modal-sub">학생 오답을 수집할 반을 선택하세요.</div>
      <div id="assessmentClassModalBody"></div>
      <button class="modal-btn-cancel" type="button" onclick="closeAssessmentModal()">취소</button>
    </div>
  </div>

  <main class="sa-main content-wrap">
    <section class="sec-block">
      <div class="archive-head sa-head">
        <div>
          <h1 class="archive-title sa-title">시험지 보관함</h1>
          <p class="archive-sub sa-lead">기말 모의고사 · 진단평가 · 단원평가 · 중간·기말평가를 범위 확인 후 바로 출력합니다.</p>
        </div>
        <div class="stats" id="stats"></div>
      </div>
      <div class="filter-band">
        <div class="filter-inner">
          <div class="fb-tabs" role="group" aria-label="평가 구분">
            <button class="fb-original-toggle active" type="button" data-category="26년 2학기 기말 모의고사">26년 2학기 기말 모의고사</button>
            <button class="fb-original-toggle" type="button" data-category="진단평가">진단평가</button>
            <button class="fb-original-toggle" type="button" data-category="단원평가">단원평가</button>
            <button class="fb-original-toggle" type="button" data-category="중간·기말평가">중간·기말평가</button>
          </div>
          <div class="fb-search">
            <input id="search" type="search" aria-label="평가 검색" placeholder="평가명, 학년, 단원, 범위 검색">
          </div>
          <select class="fb-sel" id="grade" aria-label="학년"><option value="">전체 학년</option></select>
          <select class="fb-sel" id="count" aria-label="문항 수">
            <option value="">전체 문항 수</option>
            <option value="10">10문항</option>
            <option value="15">15문항</option>
            <option value="20">20문항</option>
            <option value="25">25문항</option>
          </select>
        </div>
      </div>
      <div class="card-grid" id="grid"></div>
    </section>
  </main>

  <script src="assessment-packs-1sem.generated.js"></script>
  <script src="assessment-packs-2sem-final-mock.generated.js"></script>
  <script src="assessment-pack-core.js?v=20261119-pack-core-1"></script>
  <script>
    const MOCK_CATEGORY = AssessmentPackCore.MOCK_CATEGORY;
    const BASE_DATA = window.APMATH_ASSESSMENT_PACKS_1SEM || { packs: [], sourceSummary: {} };
    // 모의고사 자료는 별도 파일이다. 파일이 없거나 비어 있으면 탭을 숨기고 기존 화면 그대로 동작한다(합치기는 공용 코드).
    const MOCK_DATA = window.APMATH_ASSESSMENT_PACKS_MOCK_2SEM_FINAL || { packs: [], categoryOrder: [] };
    const DATA = AssessmentPackCore.mergeData(BASE_DATA, MOCK_DATA);
    const subunitScope = new URLSearchParams(location.search).get('scope') === 'subunit';
    const packs = (DATA.packs || []).filter((pack) =>
      !subunitScope || (pack.category === '단원평가' && String(pack.id || '').startsWith('SUB_1SEM_')));
    const categories = subunitScope ? ['단원평가'] :
      (DATA.categoryOrder || ['진단평가', '단원평가', '중간·기말평가']);
    const requestedCategory = new URLSearchParams(location.search).get('category');
    let active = categories.includes(requestedCategory) ? requestedCategory : (categories[0] || '진단평가');

    function escapeHTML(value) {
      return String(value ?? '').replace(/[&<>"']/g, (ch) => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;',
      }[ch]));
    }

    function countObj(obj) {
      return AssessmentPackCore.countText(obj);
    }

    function renderStats() {
      const summary = DATA.sourceSummary || {};
      if (!subunitScope && active === MOCK_CATEGORY) {
        const mockPacks = packs.filter((pack) => pack.category === MOCK_CATEGORY);
        const total = mockPacks.reduce((n, pack) => n + (pack.questions || []).length, 0);
        const essay = mockPacks.reduce((n, pack) => n + (pack.questions || []).filter((q) => q.questionType === '서술형').length, 0);
        document.getElementById('stats').innerHTML =
          `<div class="stat"><strong>${mockPacks.length}</strong>모의고사</div>` +
          `<div class="stat"><strong>${total}</strong>문항</div>` +
          `<div class="stat"><strong>${essay}</strong>서술형</div>`;
        return;
      }
      if (subunitScope) {
        const questionCount = packs.reduce((total, pack) => total + (pack.questions || []).length, 0);
        document.getElementById('stats').innerHTML =
          `<div class="stat"><strong>${packs.length}</strong>평가</div>` +
          `<div class="stat"><strong>${questionCount}</strong>문항</div>`;
        return;
      }
      document.getElementById('stats').innerHTML = [
        `<div class="stat"><strong>${packs.filter((pack) => pack.category !== MOCK_CATEGORY).length}</strong>평가</div>`,
        `<div class="stat"><strong>${summary.uniqueTextQuestions || 0}</strong>서로 다른 문항</div>`,
        `<div class="stat"><strong>${summary.imageExcluded || 0}</strong>그림 문항 제외</div>`,
      ].join('');
    }

    function setupControls() {
      const availableCategories = new Set(categories);
      document.querySelectorAll('.fb-original-toggle').forEach((button) => {
        if (!availableCategories.has(button.dataset.category)) {
          button.style.display = 'none';
          return;
        }
        button.addEventListener('click', () => {
          active = button.dataset.category;
          render();
        });
      });

      const grades = [...new Set(packs.map((pack) => pack.grade).filter(Boolean))]
        .sort((a, b) => a.localeCompare(b, 'ko'));
      document.getElementById('grade').innerHTML = '<option value="">전체 학년</option>' +
        grades.map((grade) => `<option value="${escapeHTML(grade)}">${escapeHTML(grade)}</option>`).join('');

      ['search', 'grade', 'count'].forEach((id) => {
        document.getElementById(id).addEventListener('input', render);
      });
    }

    function filterPacks() {
      const query = document.getElementById('search').value.trim().toLowerCase();
      const grade = document.getElementById('grade').value;
      const count = document.getElementById('count').value;
      return AssessmentPackCore.filterPacks(packs, { category: active, grade, count, query });
    }

    function renderDifficultyChips(mix) {
      if (!mix || typeof mix !== 'object') return '';
      const order = ['하', '중', '상'];
      const styles = { '하': 'dx dx-low', '중': 'dx dx-mid', '상': 'dx dx-high' };
      return order
        .filter((k) => mix[k] != null)
        .map((k) => `<span class="${styles[k]}">${escapeHTML(k)}${escapeHTML(String(mix[k]))}</span>`)
        .join('');
    }

    const GRADE_COLORED = new Set(['중1', '중2', '중3', '고1', '고2', '고3']);

    // 카드 범위 설명에서 단원 코드 "(M1-01)", "(H22-C-06~09)"는 화면에 보이지 않게 한다(교사가 모르는 내부 코드).
    function plainScopeText(text) {
      return AssessmentPackCore.plainScopeText(text);
    }

    function renderMeta(pack) {
      return [
        `<span class="meta-badge primary"${GRADE_COLORED.has(pack.grade) ? ` data-grade="${escapeHTML(pack.grade)}"` : ''}>${escapeHTML(pack.grade || '학년 미정')}</span>`,
        `<span class="meta-badge">${escapeHTML(pack.questionCount || 0)}문항</span>`,
        pack.courseLabel ? `<span class="meta-badge">${escapeHTML(pack.courseLabel)}</span>` : '',
      ].filter(Boolean).join('');
    }

    function isDiagnosticAssessmentPack(pack) {
      return AssessmentPackCore.isDiagnosticPack(pack);
    }

    // 진단평가 정답입력 시작(초안을 localStorage에 만들고 분석 화면 주소를 돌려준다)은 공용 코드(assessment-pack-core.js)다.
    function startDiagnosticAssessment(pack) {
      const url = assessmentPackCore.diagnosticInputUrl(pack, './assessment-analysis.html');
      if (!url) return;
      window.location.href = url;
    }

    function render() {
      document.querySelectorAll('.fb-original-toggle').forEach((button) => {
        button.classList.toggle('active', button.dataset.category === active);
      });

      renderStats();
      const list = filterPacks();
      const grid = document.getElementById('grid');
      if (!list.length) {
        grid.innerHTML = '<div class="empty-state">조건에 맞는 평가팩이 없습니다.</div>';
        return;
      }

      grid.innerHTML = list.map((pack) => `
        <article class="exam-card type-sheet" data-pack-id="${escapeHTML(pack.id)}">
          <div class="card-body">
            <div class="card-grade-row">
              <div class="card-grade-label">${escapeHTML(pack.category)}</div>
              <div class="card-type-chip">시험지</div>
            </div>
            <button class="card-main-title action-btn paper-title" type="button" data-action="preview" data-pack-id="${escapeHTML(pack.id)}">${escapeHTML(pack.title)}</button>
            <div class="card-sub-title">${escapeHTML(plainScopeText(pack.scopeLabel || pack.unitLabel) || '범위 확인 필요')}</div>
            <div class="card-meta-line">${renderMeta(pack)}</div>
            <div class="dx-row">${renderDifficultyChips(pack.difficultyMix)}</div>
            <div class="card-sub-title skill-line">유형: ${escapeHTML(countObj(pack.skillMix))}</div>
          </div>
          <div class="card-actions">
            <button class="action-btn" type="button" data-action="preview" data-pack-id="${escapeHTML(pack.id)}">시험지 확인</button>
            <button class="action-btn" type="button" data-action="exam" data-pack-id="${escapeHTML(pack.id)}">출제</button>
            ${isDiagnosticAssessmentPack(pack) ? `<button class="action-btn" type="button" data-action="diagnostic-start" data-pack-id="${escapeHTML(pack.id)}">정답입력</button>` : ''}
            <button class="action-btn" type="button" data-action="ans" data-pack-id="${escapeHTML(pack.id)}">정답</button>
            <button class="action-btn" type="button" data-action="sol" data-pack-id="${escapeHTML(pack.id)}">해설</button>
            ${pack.category === MOCK_CATEGORY ? '' : `<button class="action-btn" type="button" data-action="analysis" data-pack-id="${escapeHTML(pack.id)}">분석표</button>`}
          </div>
        </article>
      `).join('');

      grid.querySelectorAll('.exam-card').forEach((card) => {
        card.addEventListener('click', () => {
          grid.querySelectorAll('.exam-card').forEach((item) => item.classList.remove('is-active'));
          card.classList.add('is-active');
        });
      });

      grid.querySelectorAll('.action-btn').forEach((button) => {
        button.addEventListener('click', (event) => {
          event.stopPropagation();
          _assessmentActionButton = button;
          openPack(button.dataset.packId, button.dataset.action);
        });
      });
    }

    function openPack(packId, mode) {
      const pack = packs.find((item) => item.id === packId);
      if (!pack) return alert('평가팩을 찾지 못했습니다.');
      if (mode === 'preview') {
        goAssessmentMixedEngine(pack, 'exam', 4, { preview: true }).catch((error) => console.error(error));
        return;
      }
      if (mode === 'diagnostic-start') {
        startDiagnosticAssessment(pack);
        return;
      }
      if (mode === 'analysis') {
        const analysisUrl = './assessment-analysis.html?packId=' + encodeURIComponent(pack.id);
        window.location.href = analysisUrl;
        return;
      }
      if (mode === 'exam') {
        openAssessmentPrintModeModal(pack);
        return;
      }
      goAssessmentMixedEngine(pack, mode || 'exam', 2).catch((error) => console.error(error));
    }

    let _pendingAssessmentPack = null;
    let _assessmentActionButton = null;
    let _pendingAssessmentSubmitQr = false;
    let _pendingAssessmentQpp = 4;
    let _assessmentQrClassRows = [];
    let _assessmentQrGroupedByTeacher = {};

    function openAssessmentPrintModeModal(pack) {
      _pendingAssessmentPack = pack;
      document.getElementById('assessmentPrintModeModal').classList.add('open');
    }

    function selectAssessmentPrintMode(withSubmitQr) {
      _pendingAssessmentSubmitQr = withSubmitQr;

      // 출제(제출 QR)는 Archive 2.0 출제 패널로 낸다: 반 고르기·쪽당 문항·실패 안내·이미 낸 건 표시가 다른 화면과 같다.
      // 주소에 assign=legacy가 있거나 패널 스크립트가 없으면 아래 옛 모달 길(쪽당 문항 → 출제 대상 → 반)로 간다.
      if (withSubmitQr && _pendingAssessmentPack && assessmentAssignPanelAvailable()) {
        openAssessmentAssignPanel(_pendingAssessmentPack, _assessmentActionButton);
        return;
      }
      document.getElementById('assessmentQppModal').classList.add('open');
    }

    function confirmAssessmentQpp(qpp) {
      const pack = _pendingAssessmentPack;
      closeAssessmentModal();
      if (!pack) return;
      if (_pendingAssessmentSubmitQr) {
        _pendingAssessmentQpp = qpp;
        window._pendingAssessmentClassSelectPack = pack;
        window._pendingAssessmentClassSelectQpp = qpp;
        openAssessmentTargetModal(pack, qpp);
      } else {
        goAssessmentMixedEngine(pack, 'exam', qpp).catch((error) => console.error(error));
      }
    }

    function openAssessmentTargetModal(pack, qpp) {
      window._pendingAssessmentClassSelectPack = pack;
      window._pendingAssessmentClassSelectQpp = qpp;
      document.getElementById('assessmentTargetModal').classList.add('open');
    }

    function selectAssessmentTarget(targetType) {
      document.getElementById('assessmentTargetModal').classList.remove('open');
      const pack = window._pendingAssessmentClassSelectPack || _pendingAssessmentPack;
      const qpp = window._pendingAssessmentClassSelectQpp || _pendingAssessmentQpp || 4;
      if (!pack) return;
      if (targetType === 'grade') openAssessmentGradeSelectionModal(pack, qpp);
      else openAssessmentClassSelectionModal(pack, qpp);
    }

    function escapeModalText(value) {
      return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function getAssessmentQrTeacherName(row) {
      const raw = row?.teacher_name || row?.teacherName || row?.teacher || row?.owner_name || row?.ownerName || '';
      const name = String(raw || '').replace(/\s*선생님\s*$/g, '').trim();
      return name || '담당 미지정';
    }

    function sortAssessmentQrClassesForSelect(list) {
      const gradeRank = { '중1': 1, '중2': 2, '중3': 3, '고1': 4, '고2': 5, '고3': 6 };
      return [...list].sort((a, b) => {
        const ag = gradeRank[String(a.grade || '').trim()] || 99;
        const bg = gradeRank[String(b.grade || '').trim()] || 99;
        if (ag !== bg) return ag - bg;
        const an = String(a.name || '');
        const bn = String(b.name || '');
        const nameDiff = an.localeCompare(bn, 'ko');
        if (nameDiff !== 0) return nameDiff;
        return String(a.id || '').localeCompare(String(b.id || ''), 'ko');
      });
    }

    function getAssessmentClassGrade(row) {
      const explicit = String(row?.grade || row?.grade_label || '').trim();
      if (explicit) return explicit;
      const text = `${row?.name || ''} ${row?.class_name || ''}`;
      return ['중1', '중2', '중3', '고1', '고2'].find((grade) => text.includes(grade)) || '';
    }

    function getAssessmentAvailableGrades(classes) {
      const grades = new Set((classes || []).map(getAssessmentClassGrade).filter(Boolean));
      return ['중1', '중2', '중3', '고1', '고2'].filter((grade) => grades.has(grade));
    }

    function getAssessmentClassesForGrade(grade) {
      return sortAssessmentQrClassesForSelect((_assessmentQrClassRows || []).filter((row) => getAssessmentClassGrade(row) === grade));
    }

    const ASSESSMENT_AP_API_BASE = (window.APMATH_API_BASE || 'https://ap-math-os-v2612.js-pdf.workers.dev/api').replace(/\/+$/, '');
    const ASSESSMENT_QR_AUTH_REQUIRED_HTML = 'AP 제출 QR은 AP Math OS 로그인 후 사용할 수 있습니다. 일반 출력은 가능합니다.';
    const ASSESSMENT_QR_LOGIN_REQUIRED_HTML = 'AP Math OS 로그인 후 다시 시도해 주세요.';
    const ASSESSMENT_QR_FORBIDDEN_HTML = '권한이 없습니다. 원장/담당 선생님 권한을 확인하세요.';
    const ASSESSMENT_QR_NETWORK_HTML = '서버 연결에 실패했습니다. 일반 출력은 가능합니다.';

    function assessmentGeneralPrintButtonHtml() {
      return `<button class="modal-btn-primary" type="button" onclick="closeAssessmentModal(); goAssessmentMixedEngine(window._pendingAssessmentClassSelectPack, 'exam', window._pendingAssessmentClassSelectQpp || 4)">일반 시험지 출력</button>`;
    }

    function assessmentQrNoticeHtml(message) {
      return `<div class="modal-note is-warn">${message}</div>${assessmentGeneralPrintButtonHtml()}`;
    }

    function notifyAssessmentQrApiFailure(status, context) {
      const message = status === 401
        ? ASSESSMENT_QR_LOGIN_REQUIRED_HTML
        : status === 403
          ? ASSESSMENT_QR_FORBIDDEN_HTML
          : ASSESSMENT_QR_NETWORK_HTML;
      console.warn(`[assessment QR] ${context || 'api'} failed:`, status, message);
      if (typeof window.toast === 'function') window.toast(message, status === 403 ? 'warn' : 'error');
    }

    function getApmathSession() {
      try {
        return JSON.parse(localStorage.getItem('APMATH_SESSION') || 'null');
      } catch (error) {
        return null;
      }
    }

    function sanitizeApmathSessionForStorage(data) {
      const safe = { ...(data || {}) };
      delete safe.raw_password;
      delete safe.password;
      delete safe.pw;
      return safe;
    }

    function saveApmathSession(data) {
      localStorage.setItem('APMATH_SESSION', JSON.stringify(sanitizeApmathSessionForStorage(data)));
    }

    function encodeAssessmentSessionPayload(payload) {
      return encodeURIComponent(btoa(unescape(encodeURIComponent(JSON.stringify(payload)))));
    }

    function appendCurrentArchiveSessionToHash(url) {
      const session = getApmathSession();
      if (!session) return url;
      const payload = sanitizeApmathSessionForStorage({
        login_id: session.login_id || session.loginId || '',
        id: session.id || session.user?.id || '',
        name: session.name || session.user?.name || '',
        role: session.role || session.user?.role || session.auth?.role || '',
        session_token: session.session_token || '',
        expires_at: session.expires_at || ''
      });
      if (!payload.session_token && !payload.login_id) return url;
      return url + (url.indexOf('#') === -1 ? '#' : '&') + 'apmsess=' + encodeAssessmentSessionPayload(payload);
    }

    function encodeBasicAuthUnicodeSafe(value) {
      const str = String(value || '');
      try {
        return btoa(unescape(encodeURIComponent(str)));
      } catch (error) {
        return btoa(str);
      }
    }

    function getAssessmentAssignmentAuthHeader() {
      try {
        const session = getApmathSession();
        if (!session) return null;
        if (session.session_token) return { 'Authorization': 'Bearer ' + session.session_token };
        const mem = window.__APMATH_AUTH_MEMORY || {};
        const loginId = mem.login_id || session.login_id || session.loginId;
        const rawPassword = mem.raw_password || session.raw_password;
        if (!loginId || !rawPassword) return null;
        return { 'Authorization': 'Basic ' + encodeBasicAuthUnicodeSafe(`${loginId}:${rawPassword}`) };
      } catch (error) {
        return null;
      }
    }

    function restoreApmathSessionFromHash() {
      const hash = String(window.location.hash || '');
      const match = /(?:^#|&)apmsess=([^&]+)/.exec(hash);
      if (!match) return false;
      try {
        const incoming = JSON.parse(decodeURIComponent(escape(atob(decodeURIComponent(match[1])))));
        if (!incoming || (!incoming.session_token && !incoming.login_id)) return false;
        const existing = getApmathSession();
        saveApmathSession({
          ...(existing || {}),
          ...incoming,
          login_id: incoming.login_id || incoming.loginId || (existing && (existing.login_id || existing.loginId)) || '',
          id: incoming.id || (existing && existing.id) || '',
          name: incoming.name || (existing && existing.name) || '',
          role: incoming.role || (existing && existing.role) || '',
          session_token: incoming.session_token || (existing && existing.session_token) || '',
          expires_at: incoming.expires_at || (existing && existing.expires_at) || '',
          restored_from_archive_hash: true,
          restored_at: new Date().toISOString()
        });
        return true;
      } catch (error) {
        console.warn('[assessment auth] failed to restore AP session from hash:', error);
        return false;
      } finally {
        try {
          history.replaceState(null, '', window.location.pathname + window.location.search);
        } catch (error) {}
      }
    }

    // 팩 → 문항 구성 해시·MIXED 키·출제 항목은 빠른 평가의 "준비된 평가지"와 같은 공용 코드(assessment-pack-core.js)를 쓴다.
    function buildAssessmentPackHash(pack) {
      return AssessmentPackCore.packHash(pack);
    }

    function getAssessmentAssignmentBatchId(pack, gradeLabel) {
      return `batch_assessment_${String(pack?.id || 'pack').replace(/[^a-zA-Z0-9_-]+/g, '_')}_${String(gradeLabel || 'class').replace(/[^a-zA-Z0-9가-힣_-]+/g, '_')}_${Date.now()}`;
    }

    async function registerAssessmentClassExamAssignment(classRow, pack, key, options = {}) {
      const authHeader = getAssessmentAssignmentAuthHeader();
      if (!authHeader) {
        notifyAssessmentQrApiFailure(401, 'class-exam-assignments auth');
        const authError = new Error('auth required');
        authError.status = 401;
        throw authError;
      }
      const gradeLabel = options.gradeLabel || pack?.grade || getAssessmentClassGrade(classRow);
      const payload = {
        class_id: classRow.id,
        exam_title: pack.title,
        exam_date: new Date(Date.now() + 9 * 60 * 60 * 1000).toISOString().split('T')[0],
        question_count: (pack.questions || []).length,
        archive_file: `MIXED:${key}`,
        source_type: 'mixed',
        mixed_payload_json: JSON.stringify({ questions: pack.questions || [], meta: { customTitle: pack.title || '', packId: pack.id || '' } }),
        pdf_qpp: Number(options.qpp || _pendingAssessmentQpp || 4),
        pack_id: pack.id,
        grade_label: gradeLabel,
        pack_hash: buildAssessmentPackHash(pack),
        assignment_batch_id: options.assignmentBatchId || getAssessmentAssignmentBatchId(pack, gradeLabel),
        target_scope: options.target_scope || 'class'
      };
      const res = await fetch(`${ASSESSMENT_AP_API_BASE}/class-exam-assignments`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', ...authHeader },
        body: JSON.stringify(payload),
      });
      if (!res.ok) {
        notifyAssessmentQrApiFailure(res.status, 'class-exam-assignments');
        const httpError = new Error(`assignment failed: ${res.status}`);
        httpError.status = res.status;
        // 서버가 PDF를 만들다 실패해도 출제 행은 이미 생겼을 수 있다(응답에 출제 번호가 오면 그렇다).
        const failedBody = await res.json().catch(() => ({}));
        httpError.assignmentId = failedBody?.assignment?.id || '';
        throw httpError;
      }
      const data = await res.json().catch(() => ({}));
      if (data?.assignment?.pdf_status === 'failed') {
        const pdfError = new Error(data.assignment.pdf_error || '시험지 PDF 생성 실패');
        pdfError.pdfFailed = true;
        pdfError.assignmentId = data.assignment.id || '';
        throw pdfError;
      }
      return data;
    }

    function renderAssessmentTeacherClassSelector(classes) {
      _assessmentQrClassRows = Array.isArray(classes) ? classes : [];
      _assessmentQrGroupedByTeacher = {};

      _assessmentQrClassRows.forEach((classRow) => {
        const teacher = getAssessmentQrTeacherName(classRow);
        if (!_assessmentQrGroupedByTeacher[teacher]) _assessmentQrGroupedByTeacher[teacher] = [];
        _assessmentQrGroupedByTeacher[teacher].push(classRow);
      });

      const teachers = Object.keys(_assessmentQrGroupedByTeacher).sort((a, b) => a.localeCompare(b, 'ko'));
      if (!teachers.length) {
        return '<div class="modal-note is-warn">등록된 반이 없습니다. AP Math OS에서 반을 먼저 생성하세요.</div>';
      }

      const teacherOptions = teachers
        .map((teacher) => `<option value="${escapeModalText(teacher)}">${escapeModalText(teacher)} 선생님</option>`)
        .join('');

      return `
        <div class="teacher-class-stack">
          <div>
            <label class="teacher-class-label" for="assessment-teacher-select">1. 선생님 선택</label>
            <select id="assessment-teacher-select" class="teacher-class-select" onchange="renderAssessmentClassSelectByTeacher()">${teacherOptions}</select>
          </div>
          <div>
            <label class="teacher-class-label" for="assessment-class-select">2. 반 선택</label>
            <select id="assessment-class-select" class="teacher-class-select"></select>
            <div class="teacher-class-note">같은 이름의 반이라도 선택한 선생님의 반으로 구분되어 QR에 연결됩니다.</div>
          </div>
          <button class="modal-btn-secondary" type="button" onclick="previewPendingAssessment()">시험지 확인</button>
          <button class="modal-btn-primary" type="button" onclick="confirmAssessmentClassSelection()">출제</button>
        </div>`;
    }

    function renderAssessmentClassSelectByTeacher() {
      const teacherSelect = document.getElementById('assessment-teacher-select');
      const classSelect = document.getElementById('assessment-class-select');
      if (!teacherSelect || !classSelect) return;

      const teacher = teacherSelect.value || Object.keys(_assessmentQrGroupedByTeacher)[0] || '';
      const rows = sortAssessmentQrClassesForSelect(_assessmentQrGroupedByTeacher[teacher] || []);

      classSelect.innerHTML = rows.map((classRow) => {
        const labelParts = [classRow.name || '이름 없는 반', classRow.grade ? `(${classRow.grade})` : ''].filter(Boolean).join(' ');
        return `<option value="${escapeModalText(classRow.id)}" data-teacher="${escapeModalText(teacher)}" data-class-name="${escapeModalText(classRow.name || '')}">${escapeModalText(labelParts)}</option>`;
      }).join('');
    }

    async function openAssessmentClassSelectionModal(pack, qpp) {
      const overlay = document.getElementById('assessmentClassModalOverlay');
      const body = document.getElementById('assessmentClassModalBody');
      overlay.classList.add('open');
      body.innerHTML = '<div class="modal-note">반 목록을 불러오는 중...</div>';

      let authHeader = {};
      try {
        authHeader = getAssessmentAssignmentAuthHeader();
        if (!authHeader) {
          body.innerHTML = `
            <div class="modal-login">
              <div class="modal-note">AP Math OS 계정으로 로그인하세요.</div>
              <input id="assessment-apmath-login-id" type="text" placeholder="아이디" class="modal-field">
              <input id="assessment-apmath-login-pw" type="password" placeholder="비밀번호" class="modal-field">
              <div id="assessment-apmath-login-err" class="modal-note is-warn modal-err"></div>
              <button class="modal-btn-primary" type="button" onclick="doAssessmentApmathLoginAndLoadClasses(event)">로그인 후 반 목록 불러오기</button>
              ${assessmentGeneralPrintButtonHtml()}
            </div>`;
          return;
        }
      } catch (error) {
        body.innerHTML = '<div class="modal-note is-warn">오류가 발생했습니다. 새로고침 후 다시 시도하세요.</div>';
        return;
      }

      try {
        const res = await fetch(`${ASSESSMENT_AP_API_BASE}/qr-classes`, { headers: authHeader });
        if (res.status === 401) {
          body.innerHTML = assessmentQrNoticeHtml(ASSESSMENT_QR_LOGIN_REQUIRED_HTML);
          return;
        }
        if (res.status === 403) {
          body.innerHTML = assessmentQrNoticeHtml(ASSESSMENT_QR_FORBIDDEN_HTML);
          return;
        }
        if (!res.ok) throw new Error('API Request Failed');

        const data = await res.json();
        if (data && data.success && Array.isArray(data.classes)) {
          if (data.classes.length === 0) {
            body.innerHTML = '<div class="modal-note is-warn">등록된 반이 없습니다. AP Math OS에서 반을 먼저 생성하세요.</div>';
            return;
          }

          body.innerHTML = renderAssessmentTeacherClassSelector(data.classes);
          renderAssessmentClassSelectByTeacher();
        } else {
          throw new Error('Invalid data format');
        }
      } catch (error) {
        console.error(error);
        body.innerHTML = assessmentQrNoticeHtml(ASSESSMENT_QR_NETWORK_HTML);
        return;
      }
    }

    function renderAssessmentGradeSelector(classes) {
      _assessmentQrClassRows = Array.isArray(classes) ? classes : [];
      const grades = getAssessmentAvailableGrades(_assessmentQrClassRows);
      if (!grades.length) {
        return '<div class="modal-note is-warn">해당 학년에 출제할 반이 없습니다.</div>';
      }
      const options = grades
        .map((grade) => `<option value="${escapeModalText(grade)}">${escapeModalText(grade)} 전체</option>`)
        .join('');
      return `
        <div class="teacher-class-stack">
          <div>
            <label class="teacher-class-label" for="assessment-grade-select">학년 선택</label>
            <select id="assessment-grade-select" class="teacher-class-select" onchange="renderAssessmentGradeClassPreview()">${options}</select>

          <button class="modal-btn-secondary" type="button" onclick="previewPendingAssessment()">시험지 확인</button>
          <button class="modal-btn-primary" type="button" onclick="confirmAssessmentGradeSelection()">출제</button>
        </div>`;

    function renderAssessmentGradeClassPreview() {
      const select = document.getElementById('assessment-grade-select');
      const preview = document.getElementById('assessment-grade-class-preview');
      if (!select || !preview) return;
      const rows = getAssessmentClassesForGrade(select.value);
      preview.textContent = rows.length ? `${select.value} 전체 ${rows.length}개 반에 출제됩니다.` : '해당 학년에 출제할 반이 없습니다.';

    async function openAssessmentGradeSelectionModal(pack, qpp) {
      const overlay = document.getElementById('assessmentGradeModalOverlay');
      const body = document.getElementById('assessmentGradeModalBody');
      overlay.classList.add('open');
      body.innerHTML = '<div class="modal-note">반 목록을 불러오는 중...</div>';

      const authHeader = getAssessmentAssignmentAuthHeader();
      if (!authHeader) {
        body.innerHTML = `
          <div class="modal-login">
            <div class="modal-note">AP Math OS 계정으로 로그인하세요.</div>
            <input id="assessment-grade-apmath-login-id" type="text" placeholder="아이디" class="modal-field">
            <input id="assessment-grade-apmath-login-pw" type="password" placeholder="비밀번호" class="modal-field">
            <div id="assessment-grade-apmath-login-err" class="modal-note is-warn modal-err"></div>
            <button class="modal-btn-primary" type="button" onclick="doAssessmentApmathLoginAndLoadGrades(event)">로그인 후 반 목록 불러오기</button>
            ${assessmentGeneralPrintButtonHtml()}
          </div>`;

      }

      try {
        const res = await fetch(`${ASSESSMENT_AP_API_BASE}/qr-classes`, { headers: authHeader });
        if (res.status === 401) {
          body.innerHTML = assessmentQrNoticeHtml(ASSESSMENT_QR_LOGIN_REQUIRED_HTML);
          return;
        }
        if (res.status === 403) {
          body.innerHTML = assessmentQrNoticeHtml(ASSESSMENT_QR_FORBIDDEN_HTML);
          return;
        }
        if (!res.ok) throw new Error('API Request Failed');
        const data = await res.json();
        if (!data || !data.success || !Array.isArray(data.classes)) throw new Error('Invalid data format');
        body.innerHTML = renderAssessmentGradeSelector(data.classes);
        renderAssessmentGradeClassPreview();

    async function doAssessmentApmathLoginAndLoadGrades(event) {
      if (event && event.preventDefault) event.preventDefault();
      const loginId = document.getElementById('assessment-grade-apmath-login-id')?.value.trim();
      const password = document.getElementById('assessment-grade-apmath-login-pw')?.value;
      const errorElement = document.getElementById('assessment-grade-apmath-login-err');
      if (!loginId || !password) {
        if (errorElement) errorElement.innerText = '아이디와 비밀번호를 입력하세요.';
        return;
      }
      if (errorElement) errorElement.innerText = '로그인 중...';
      try {
        const res = await fetch(`${ASSESSMENT_AP_API_BASE}/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ login_id: loginId, password }),
        });
        const data = await res.json();
        if (!data.success) {
          if (errorElement) errorElement.innerText = '아이디 또는 비밀번호가 맞지 않습니다.';
          return;
        }
        window.__APMATH_AUTH_MEMORY = { login_id: loginId, raw_password: password };
        saveApmathSession({
          login_id: data.login_id || loginId,
          id: data.id,
          name: data.name,
          role: data.role,
          session_token: data.session_token || '',
          expires_at: data.expires_at || '',
        });
        openAssessmentGradeSelectionModal(window._pendingAssessmentClassSelectPack, window._pendingAssessmentClassSelectQpp);
      } catch (error) {
        if (errorElement) errorElement.innerText = '서버 연결 실패. 다시 시도하세요.';
      }
    }

    async function doAssessmentApmathLoginAndLoadClasses(event) {
      if (event && event.preventDefault) event.preventDefault();
      const loginId = document.getElementById('assessment-apmath-login-id')?.value.trim();
      const password = document.getElementById('assessment-apmath-login-pw')?.value;
      const errorElement = document.getElementById('assessment-apmath-login-err');
      if (!loginId || !password) {
        if (errorElement) errorElement.innerText = '아이디와 비밀번호를 입력하세요.';
        return;
      }
      if (errorElement) errorElement.innerText = '로그인 중...';
      try {
        const res = await fetch(`${ASSESSMENT_AP_API_BASE}/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ login_id: loginId, password }),
        });
        const data = await res.json();
        if (!data.success) {
          if (errorElement) errorElement.innerText = '아이디 또는 비밀번호가 맞지 않습니다.';
          return;
        }
        window.__APMATH_AUTH_MEMORY = { login_id: loginId, raw_password: password };
        saveApmathSession({
          login_id: data.login_id || loginId,
          id: data.id,
          name: data.name,
          role: data.role,
          session_token: data.session_token || '',
          expires_at: data.expires_at || '',
        });
        openAssessmentClassSelectionModal(window._pendingAssessmentClassSelectPack, window._pendingAssessmentClassSelectQpp);
      } catch (error) {
        if (errorElement) errorElement.innerText = '서버 연결 실패. 다시 시도하세요.';
      }
    }

    function closeAssessmentModal() {
      document.getElementById('assessmentPrintModeModal').classList.remove('open');
      document.getElementById('assessmentQppModal').classList.remove('open');
      document.getElementById('assessmentTargetModal').classList.remove('open');
      document.getElementById('assessmentGradeModalOverlay').classList.remove('open');
      document.getElementById('assessmentClassModalOverlay').classList.remove('open');
    }

    async function confirmAssessmentClassSelection() {
      const select = document.getElementById('assessment-class-select');
      if (!select || !select.value) return;
      const selectedOption = select.options[select.selectedIndex];
      const selectedClassId = select.value;
      const selectedTeacherName = selectedOption?.dataset?.teacher || document.getElementById('assessment-teacher-select')?.value || '';
      const selectedClassName = selectedOption?.dataset?.className || '';
      const pack = _pendingAssessmentPack;
      if (pack) {
        if (!Array.isArray(pack.questions) || pack.questions.length === 0) {
          console.warn('[assessment class assignment] 문항 수 확인 실패:', pack?.id);
          const classBody = document.getElementById('assessmentClassModalBody');
          if (classBody) classBody.innerHTML = '<div class="modal-note is-warn">문항 수 확인이 필요합니다.</div>';
          return;
        }
        const classBody = document.getElementById('assessmentClassModalBody');
        const progress = document.createElement('p');
        progress.setAttribute('role', 'status');
        progress.setAttribute('aria-live', 'polite');
        progress.style.cssText = 'color:var(--secondary); font-size:13px; margin:14px 0 0;';
        progress.textContent = '출제본 PDF를 준비하는 중입니다. 잠시만 기다려 주세요.';
        classBody?.appendChild(progress);
        try {
          const opened = await goAssessmentMixedEngine(pack, 'exam', _pendingAssessmentQpp, {
            submitQr: true,
            classId: selectedClassId,
            teacherName: selectedTeacherName,
            className: selectedClassName,
            target_scope: 'class',
          });
          if (opened && opened.registrationFailed) {
            // 시험지는 QR 없이 열렸다. 등록 결과를 선생님이 읽을 수 있게 모달을 열어 둔다.
            progress.style.color = 'var(--warn-text)';
            progress.textContent = opened.registrationFailed;
          } else {
            closeAssessmentModal();
          }
        } catch (error) {
          console.error(error);
          progress.style.color = 'var(--warn-text)';
          progress.textContent = '시험지를 열지 못했습니다. 화면을 새로고침한 뒤 다시 시도해 주세요.';
        }
      }
    }

    async function confirmAssessmentGradeSelection() {
      const select = document.getElementById('assessment-grade-select');
      if (!select || !select.value) return;
      const gradeLabel = select.value;
      const rows = getAssessmentClassesForGrade(gradeLabel);
      if (!rows.length) {
        const preview = document.getElementById('assessment-grade-class-preview');
        if (preview) preview.textContent = '해당 학년에 출제할 반이 없습니다.';
        return;
      }
      const pack = _pendingAssessmentPack;
      if (!pack) return;
      if (!Array.isArray(pack.questions) || pack.questions.length === 0) {
        console.warn('[assessment grade assignment] 문항 수 확인 실패:', pack?.id);
        const gradeBody = document.getElementById('assessmentGradeModalBody');
        if (gradeBody) gradeBody.innerHTML = '<div class="modal-note is-warn">문항 수 확인이 필요합니다.</div>';
        return;
      }
      const key = `assessment_${pack.id}_${Date.now()}`;
      const assignmentBatchId = getAssessmentAssignmentBatchId(pack, gradeLabel);
      const preview = document.getElementById('assessment-grade-class-preview');
      // 여러 반을 등록하는 동안 기다리게 되므로, 새 창은 클릭 순간에 먼저 연다.
      const win = openAssessmentWindowNow();
      let registeredRows = 0;
      try {
        for (let index = 0; index < rows.length; index += 1) {
          const row = rows[index];
          if (preview) {
            preview.setAttribute('role', 'status');
            preview.setAttribute('aria-live', 'polite');
            preview.textContent = `${index + 1}/${rows.length}개 반의 출제본 PDF를 준비하는 중입니다.`;
          }
          await registerAssessmentClassExamAssignment(row, pack, key, {
            assignmentBatchId,
            target_scope: 'grade',
            gradeLabel,
            qpp: _pendingAssessmentQpp,
          });
          registeredRows += 1;
        }
        closeAssessmentModal();
        const representative = rows[0];
        goAssessmentMixedEngine(pack, 'exam', _pendingAssessmentQpp, {
          submitQr: true,
          classId: representative.id,
          teacherName: getAssessmentQrTeacherName(representative),
          className: representative.name || '',
          target_scope: 'grade',
          gradeLabel,
          assignmentBatchId,
          keyOverride: key,
          assignmentRegistered: true,
          preRegistered: true,
          targetWindow: win,
        }).catch((error) => console.error(error));
      } catch (error) {
        console.error(error);
        // 시험지는 QR 없이 연다. 일부 반은 이미 등록됐을 수 있으니 몇 개 반인지 함께 알린다.
        const note = assessmentRegistrationFailureMessage(error) +
          (registeredRows ? ` 이미 ${registeredRows}개 반(전체 ${rows.length}개)은 출제가 등록되었습니다.` : '');
        goAssessmentMixedEngine(pack, 'exam', _pendingAssessmentQpp, { targetWindow: win, keyOverride: key, registrationFailed: note })
          .catch((openError) => console.error(openError));
        const body = document.getElementById('assessmentGradeModalBody');
        if (body) body.innerHTML = `<div class="modal-note is-warn">${escapeModalText(note)}</div>`;
      }
    }

    function previewPendingAssessment() {
      if (_pendingAssessmentPack) goAssessmentMixedEngine(_pendingAssessmentPack, 'exam', _pendingAssessmentQpp || 4, { preview: true }).catch((error) => console.error(error));
    }
    window.previewPendingAssessment = previewPendingAssessment;

    // ── 시험지 열기·출제 패널 (공용 코드: assessment-pack-core.js) ──────────────────────────────────
    // 평가 전달 자료(mixedQuestions_assessment_…) 정리·저장, 팝업 차단 대비, 엔진 주소 만들기, 출제 패널 열기는
    // 빠른 평가의 "준비된 평가지"와 같은 코드를 쓴다(두 벌 없음). 이 화면에 남은 것: 옛 출제 모달(?assign=legacy)과 그 등록.
    // 출제 등록이 실패했을 때 선생님께 보일 안내(영어 원문·내부 용어 없이, 등록됐는지 모를 때는 모른다고 말한다).
    // 등록 요청은 서버가 PDF를 만드는 동안 기다리므로, 실패 응답이어도 출제 행이 이미 생겼을 수 있다: 무조건 "다시 누르라"고 하지 않는다.
    function assessmentRegistrationFailureMessage(error) {
      const status = Number(error?.status || 0);
      const tail = ' 시험지는 QR 없이 열었습니다.';
      if (status === 401) return '로그인이 만료되었거나 로그인되어 있지 않아 출제되지 않았습니다. 다시 로그인한 뒤 출제해 주세요.' + tail;
      if (status === 403) return '이 반에 출제할 권한이 없어 출제되지 않았습니다.' + tail;
      if (status >= 400 && status < 500) return '출제 정보가 올바르지 않아 출제되지 않았습니다.' + tail;
      if (error?.assignmentId) return '출제는 등록된 것으로 보이지만 출제본 PDF를 만들지 못했습니다. 다시 출제하면 같은 반에 중복될 수 있으니 출제 내역에서 먼저 확인해 주세요.' + tail;
      const reason = status >= 500 ? '서버 오류' : '서버에 연결하지 못함';
      return '출제가 등록되었는지 확인하지 못했습니다(' + reason + '). 출제 내역에서 확인한 뒤, 없으면 다시 출제해 주세요.' + tail;
    }

    const assessmentPackCore = AssessmentPackCore.create({
      window,
      engineUrl: () => new URL('../mixed_engine.html', window.location.href),
      apiBase: ASSESSMENT_AP_API_BASE,
      authHeader: getAssessmentAssignmentAuthHeader,
      session: getApmathSession,
      sessionHash: appendCurrentArchiveSessionToHash,
      getPacks: () => packs,
      // 옛 출제 모달 길: 엔진을 열기 전에 반 하나를 옛 방식(registerAssessmentClassExamAssignment)으로 등록한다.
      registerLegacy: (classRow, pack, key, opts) => registerAssessmentClassExamAssignment(classRow, pack, key, {
        ...opts,
        assignmentBatchId: opts.assignmentBatchId || getAssessmentAssignmentBatchId(pack, opts.gradeLabel || pack.grade || 'class'),
      }),
      registrationFailureMessage: assessmentRegistrationFailureMessage,
    });
    const ASSESSMENT_SNAPSHOT_KEEP = assessmentPackCore.SNAPSHOT_KEEP;
    const pruneAssessmentSnapshots = assessmentPackCore.pruneSnapshots;
    const openAssessmentWindowNow = assessmentPackCore.openWindowNow;
    const assessmentAssignPanelAvailable = assessmentPackCore.assignPanelAvailable;
    const openAssessmentAssignPanel = assessmentPackCore.openAssignPanel;
    // 반환: { registrationFailed: '선생님용 안내문' } — 등록이 실패해 QR 없이 연 경우만.
    function goAssessmentMixedEngine(pack, mode, qpp, options = {}) {
      return assessmentPackCore.openEngine(pack, mode, qpp, options);
    }
    assessmentPackCore.bindPanelEvents();

    window.openPack = openPack;
    window.openAssessmentPrintModeModal = openAssessmentPrintModeModal;
    window.selectAssessmentPrintMode = selectAssessmentPrintMode;
    window.confirmAssessmentQpp = confirmAssessmentQpp;
    window.selectAssessmentTarget = selectAssessmentTarget;
    window.openAssessmentClassSelectionModal = openAssessmentClassSelectionModal;
    window.renderAssessmentClassSelectByTeacher = renderAssessmentClassSelectByTeacher;
    window.renderAssessmentGradeClassPreview = renderAssessmentGradeClassPreview;
    window.confirmAssessmentClassSelection = confirmAssessmentClassSelection;
    window.confirmAssessmentGradeSelection = confirmAssessmentGradeSelection;
    window.doAssessmentApmathLoginAndLoadClasses = doAssessmentApmathLoginAndLoadClasses;
    window.doAssessmentApmathLoginAndLoadGrades = doAssessmentApmathLoginAndLoadGrades;
    window.closeAssessmentModal = closeAssessmentModal;
    window.goAssessmentMixedEngine = goAssessmentMixedEngine;

    restoreApmathSessionFromHash();
    // 이미 저장 공간이 가득 찬 브라우저도 이 화면을 여는 것만으로 풀린다(평가 전달 자료만, 최근 몇 개를 남기고 정리).
    pruneAssessmentSnapshots(ASSESSMENT_SNAPSHOT_KEEP);
    if (subunitScope) {
      document.title = '소단원 평가 보관함 · JS 아카이브';
      document.querySelector('.archive-title').textContent = '소단원 평가 보관함';
      document.querySelector('.archive-sub').textContent = '기존 소단원 평가팩을 확인하고 문제·정답·해설을 출력합니다.';
    }
    renderStats();
    setupControls();
    render();
  </script>
</body>
</html>
