    <style>
      .five-minute-slider { max-width: 560px; padding: 8px 6px 14px; }
      .five-minute-slider-labels { display: flex; justify-content: space-between; font-weight: 700; }
      .five-minute-slider-rail { position: relative; height: 34px; margin-top: 8px; display: flex; align-items: center; justify-content: space-between; }
      .five-minute-slider-rail::before { content: ""; position: absolute; left: 11px; right: 11px; height: 4px; border-radius: 4px; background: var(--line); }
      .five-minute-slider-rail > span { z-index: 1; width: 14px; height: 14px; margin: 0 4px; border: 2px solid var(--ink); border-radius: 50%; background: var(--surface); pointer-events: none; }
      .five-minute-slider input { position: absolute; z-index: 2; inset: 0; display: block; width: 100%; height: 34px; min-height: 0; margin: 0; padding: 0; border: 0; appearance: none; background: transparent; cursor: pointer; touch-action: pan-y; }
      .five-minute-slider input::-webkit-slider-runnable-track { height: 4px; background: transparent; }
      .five-minute-slider input::-webkit-slider-thumb { appearance: none; width: 22px; height: 22px; margin-top: -9px; border: 2px solid var(--ink); border-radius: 50%; background: var(--ink); box-shadow: 0 0 0 3px var(--surface); }
      .five-minute-slider input:focus-visible { outline: 3px solid var(--ink); outline-offset: 6px; }
      .quick-bundle-entry { display: flex; flex-direction: column; gap: 8px; }
      .quick-bundle-entry > button { width: 100%; }
      .quick-bundle-entry > label { display: flex; align-items: center; gap: 6px; font-size: 14px; cursor: pointer; }
    </style>
