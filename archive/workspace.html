<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Archive 2.0 · 교사용 작업공간</title>
    <link rel="stylesheet" href="archive2.css" />
    <script defer src="mixer-selector.js"></script>
    <script defer src="archive2-core.js"></script>
    <script defer src="archive2-source.js"></script>
    <script defer src="archive2-workspace.js"></script>
  </head>
  <body>
    <a class="skip" href="#content">본문으로 이동</a>
    <header class="appbar">
      <a class="brand" href="workspace.html">JS 아카이브 <span>2.0</span></a>
      <nav aria-label="작업공간">
        <button data-view="find" class="active">기출 찾기</button
        ><button data-view="compose">맞춤 구성</button
        ><button data-view="recent">최근 작업</button
        ><button data-view="health">데이터 상태</button>
      </nav>
      <a class="legacy" href="index.html">전체 기능</a>
    </header>
    <div id="status" class="status" role="status" aria-live="polite">
      문항 목록을 준비하고 있습니다.
    </div>
    <main id="content" tabindex="-1">
      <div class="loading">아카이브를 불러오는 중…</div>
    </main>
    <dialog id="modal" aria-labelledby="modal-title">
      <div id="modal-body"></div>
      <button class="dialog-close" data-action="close-dialog">닫기</button>
    </dialog>
    <input
      id="import-file"
      type="file"
      accept="application/json,.json"
      hidden
    />
  </body>
</html>
