<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>아카이브 자동 진행 현황</title><style>
body{font:15px system-ui,sans-serif;max-width:1250px;margin:32px auto;padding:0 14px;background:#f6f7fa;color:#172234}h1{font-size:24px}p{color:#536176}table{border-collapse:collapse;width:100%;background:white}th,td{text-align:left;padding:11px;border-bottom:1px solid #dde3ed}th{background:#eaf0f7}.wrap{overflow-x:auto;border-radius:10px;border:1px solid #dae2eb}input{font:inherit;padding:10px;border:1px solid #aab8c9;border-radius:6px;width:min(380px,90%)}a{color:#28589e}small{color:#657080}.bad{color:#b42318}.good{color:#166a45}.unknown{color:#936912}
</style></head><body><h1>아카이브 자동 진행 현황</h1><p id="updated">GitHub 집계 데이터를 조회 중입니다.</p><p>GitHub에서 관측된 PR·Actions만 표시합니다. Library 검수와 GPT 채팅 완료는 실시간 관측되지 않습니다. ‘등록 PR 검사’는 공식 R1/R2/R3가 아닙니다. 배포 작업 성공은 파일 일치 검증과 다릅니다. ‘미확인’은 실패나 기존 PASS 취소가 아닙니다.</p><button id="refresh" type="button">새로고침</button> <label for="search">시험지 찾기</label> <input id="search" placeholder="학교 / 연도 / 시험지"><div class="wrap"><table><thead><tr><th>시험지</th><th>등록 PR 검사</th><th>main 반영</th><th>등록 완료</th><th>배포 작업</th><th>파일 일치</th><th>마지막 정상 배포</th><th>최근 실패</th></tr></thead><tbody id="rows"></tbody></table></div><script src="progress.js"></script></body></html>
