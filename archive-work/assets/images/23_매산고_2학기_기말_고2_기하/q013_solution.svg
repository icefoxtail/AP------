<svg xmlns="http://www.w3.org/2000/svg" width="500" height="430" viewBox="0 0 500 430" role="img" aria-labelledby="title desc">
<title id="title">네 옆면 내접원의 밑면 정사영과 가운데 영역</title>
<desc id="desc">정사각형 밑면 위의 네 타원과 가운데 빗금 영역 A, 모서리 타원 조각 T를 나타낸다. 이웃한 타원은 가운데 작은 정사각형의 모서리에서 접한다.</desc>
<defs>
  <pattern id="hatchA" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#fff"/><path d="M 0 0 V 8" stroke="#777" stroke-width="1"/></pattern>
  <pattern id="hatchT" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><rect width="8" height="8" fill="#fff"/><path d="M 0 0 V 8" stroke="#333" stroke-width="1"/></pattern>
  <style>
    text{font-family:Arial,'Malgun Gothic',sans-serif;fill:#111}
    .projected{fill:#e7e7e7;stroke:#222;stroke-width:2}
    .frame{fill:none;stroke:#555;stroke-width:1.5}
    .guide{fill:none;stroke:#777;stroke-width:1;stroke-dasharray:4 4}
  </style>
</defs>
