<svg xmlns="http://www.w3.org/2000/svg" width="640" height="340" viewBox="0 0 640 340" role="img" aria-labelledby="title desc">
  <title id="title">진리집합의 포함 관계</title>
  <desc id="desc">R lies inside both P and Q, while P has points outside Q and the universe has points outside P and R.</desc>
  <rect width="640" height="340" rx="16" fill="#fff"/>
  <rect x="36" y="34" width="568" height="242" rx="8" fill="#fbfdff" stroke="#526873" stroke-width="2"/>
  <g font-family="sans-serif" fill="#17212b">
    <text x="54" y="58" font-size="16" font-weight="700">U</text>
    <text x="167" y="92" font-size="17" font-weight="700">P</text>
    <text x="462" y="92" font-size="17" font-weight="700">Q</text>
    <text x="320" y="171" text-anchor="middle" font-size="16" font-weight="700">R</text>
    <text x="215" y="304" text-anchor="middle" font-size="15" fill="#364a54">R ⊂ Q: true</text>
    <text x="430" y="304" text-anchor="middle" font-size="15" fill="#364a54">P ⊄ Q,  U−R ⊄ P</text>
  </g>
  <ellipse cx="250" cy="178" rx="154" ry="88" fill="#d9edf5" fill-opacity="0.8" stroke="#28718e" stroke-width="3"/>
  <ellipse cx="390" cy="178" rx="154" ry="88" fill="#e3f0df" fill-opacity="0.8" stroke="#54845c" stroke-width="3"/>
  <circle cx="320" cy="178" r="42" fill="#c9b8df" fill-opacity="0.92" stroke="#75549b" stroke-width="3"/>
  <circle cx="165" cy="178" r="5" fill="#17212b"/>
  <text x="151" y="198" font-family="sans-serif" font-size="13" fill="#17212b">p∧¬q</text>
  <circle cx="77" cy="96" r="5" fill="#17212b"/>
  <text x="86" y="101" font-family="sans-serif" font-size="13" fill="#17212b">¬p∧¬r</text>
</svg>
