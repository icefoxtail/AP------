<svg xmlns="http://www.w3.org/2000/svg" width="680" height="300" viewBox="0 0 680 300" role="img" aria-labelledby="title desc">
  <title id="title">집합 차와 교집합의 분배 법칙</title>
  <desc id="desc">세 집합 A, B, C의 벤 다이어그램에서 양변은 모두 C 영역 중 A와 B의 공통 부분을 뺀 영역을 나타낸다.</desc>
  <defs>
    <clipPath id="clip-a-left" clipPathUnits="userSpaceOnUse"><circle cx="142" cy="116" r="61"/></clipPath>
    <clipPath id="clip-b-left" clipPathUnits="userSpaceOnUse"><circle cx="202" cy="116" r="61"/></clipPath>
    <clipPath id="clip-a-right" clipPathUnits="userSpaceOnUse"><circle cx="482" cy="116" r="61"/></clipPath>
    <clipPath id="clip-b-right" clipPathUnits="userSpaceOnUse"><circle cx="542" cy="116" r="61"/></clipPath>
  </defs>
  <rect width="680" height="300" rx="16" fill="#ffffff"/>
  <g font-family="sans-serif" fill="#17212b">
    <text x="170" y="34" text-anchor="middle" font-size="18" font-weight="700">C − (A ∩ B)</text>
    <text x="510" y="34" text-anchor="middle" font-size="18" font-weight="700">(C − A) ∪ (C − B)</text>
    <text x="340" y="157" text-anchor="middle" font-size="27" font-weight="700" fill="#53717d">=</text>
    <text x="340" y="285" text-anchor="middle" font-size="14" fill="#394b56">양쪽 모두 C에서 세 집합의 공통 부분만 제외한 영역</text>
  </g>
  <g stroke="#263640" stroke-width="2.2" fill="none">
    <circle cx="142" cy="116" r="61" fill="#fff"/>
    <circle cx="202" cy="116" r="61" fill="#fff"/>
    <circle cx="172" cy="160" r="61" fill="#b9e8f1" stroke="none"/>
    <g clip-path="url(#clip-a-left)">
      <circle cx="172" cy="160" r="61" fill="#fff" clip-path="url(#clip-b-left)"/>
    </g>
    <circle cx="142" cy="116" r="61"/>
    <circle cx="202" cy="116" r="61"/>
    <circle cx="172" cy="160" r="61"/>

    <circle cx="482" cy="116" r="61" fill="#fff"/>
    <circle cx="542" cy="116" r="61" fill="#fff"/>
    <circle cx="512" cy="160" r="61" fill="#b9e8f1" stroke="none"/>
    <g clip-path="url(#clip-a-right)">
      <circle cx="512" cy="160" r="61" fill="#fff" clip-path="url(#clip-b-right)"/>
    </g>
    <circle cx="482" cy="116" r="61"/>
    <circle cx="542" cy="116" r="61"/>
    <circle cx="512" cy="160" r="61"/>
  </g>
  <g font-family="sans-serif" font-size="15" font-weight="600" fill="#17212b">
    <text x="108" y="54">A</text><text x="224" y="54">B</text><text x="167" y="231">C</text>
    <text x="448" y="54">A</text><text x="564" y="54">B</text><text x="507" y="231">C</text>
  </g>
</svg>
