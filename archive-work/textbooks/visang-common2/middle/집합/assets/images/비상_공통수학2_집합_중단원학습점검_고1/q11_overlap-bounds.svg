<svg xmlns="http://www.w3.org/2000/svg" width="620" height="300" viewBox="0 0 620 300" role="img" aria-labelledby="title desc">
  <title id="title">두 과목 선호 집합의 공통 원소 수 범위</title>
  <desc id="desc">전체 30명, A를 선호하는 14명, B를 선호하는 19명일 때 교집합 x는 3 이상 14 이하이다.</desc>
  <rect x="10" y="10" width="600" height="280" rx="18" fill="#fff" stroke="#566b76" stroke-width="2"/>
  <g font-family="sans-serif" fill="#17212b">
    <text x="36" y="42" font-size="18" font-weight="700">U: 30명</text>
    <text x="175" y="86" text-anchor="middle" font-size="18" font-weight="700">A: 14명</text>
    <text x="355" y="86" text-anchor="middle" font-size="18" font-weight="700">B: 19명</text>
    <circle cx="210" cy="168" r="82" fill="#e6f4fa" fill-opacity="0.9" stroke="#27708e" stroke-width="3"/>
    <circle cx="322" cy="168" r="82" fill="#e8f4e8" fill-opacity="0.82" stroke="#54845c" stroke-width="3"/>
    <text x="171" y="177" text-anchor="middle" font-size="18" font-weight="700">14 − x</text>
    <text x="266" y="177" text-anchor="middle" font-size="18" font-weight="700">x</text>
    <text x="360" y="177" text-anchor="middle" font-size="18" font-weight="700">19 − x</text>
    <text x="485" y="168" text-anchor="middle" font-size="15" fill="#526873">두 집합 모두</text>
    <text x="485" y="190" text-anchor="middle" font-size="18" font-weight="700">x − 3</text>
    <text x="310" y="270" text-anchor="middle" font-size="16" fill="#394b56">14 − x ≥ 0,  x − 3 ≥ 0  ⇒  3 ≤ x ≤ 14</text>
  </g>
</svg>
