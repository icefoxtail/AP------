<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="476" viewBox="0 0 1020 476" role="img">
<rect width="1020" height="476" fill="#f7faff"/>
<rect x="20" y="20" width="980" height="98" rx="16" fill="#153755"/>
<text x="44" y="61" font-family="NanumSquare,Noto Sans CJK KR,DejaVu Sans,sans-serif" font-weight="bold" font-size="29" fill="white">곱셈 나머지로 만든 주기</text>
<text x="44" y="94" font-family="NanumSquare,Noto Sans CJK KR,DejaVu Sans,sans-serif" font-size="19" fill="#e7f2ff">직접 대응을 차례로 계산해 돌아오는지 확인</text>
<rect x="26" y="134" width="968" height="88" rx="13" fill="#fff" stroke="#b6c8db"/>
<text x="42" y="160" font-family="NanumSquare,Noto Sans CJK KR,DejaVu Sans,sans-serif" font-weight="bold" font-size="20" fill="#213e57">제곱이 아닌 곱셈</text>
<text x="42" y="195" font-family="NanumSquare,Noto Sans CJK KR,DejaVu Sans,sans-serif" font-size="22" fill="#1b2b45">1 → 3 → 2 → 6</text>
<text x="980" y="195" text-anchor="end" font-family="NanumSquare,Noto Sans CJK KR,DejaVu Sans,sans-serif" font-weight="bold" font-size="18" fill="#005f58">각 단계 ×3, 7로 나눈 나머지</text>
<rect x="26" y="236" width="968" height="88" rx="13" fill="#fff" stroke="#b6c8db"/>
<text x="42" y="262" font-family="NanumSquare,Noto Sans CJK KR,DejaVu Sans,sans-serif" font-weight="bold" font-size="20" fill="#213e57">한 바퀴 완성</text>
<text x="42" y="297" font-family="NanumSquare,Noto Sans CJK KR,DejaVu Sans,sans-serif" font-size="22" fill="#1b2b45">6 → 4 → 5 → 1</text>
<text x="980" y="297" text-anchor="end" font-family="NanumSquare,Noto Sans CJK KR,DejaVu Sans,sans-serif" font-weight="bold" font-size="18" fill="#005f58">주기 6</text>
<rect x="26" y="338" width="968" height="88" rx="13" fill="#fff" stroke="#b6c8db"/>
<text x="42" y="364" font-family="NanumSquare,Noto Sans CJK KR,DejaVu Sans,sans-serif" font-weight="bold" font-size="20" fill="#213e57">긴 지수 환원</text>
<text x="42" y="399" font-family="NanumSquare,Noto Sans CJK KR,DejaVu Sans,sans-serif" font-size="22" fill="#1b2b45">2027 = 6 × 337 + 5</text>
<text x="980" y="399" text-anchor="end" font-family="NanumSquare,Noto Sans CJK KR,DejaVu Sans,sans-serif" font-weight="bold" font-size="18" fill="#005f58">다섯째 값 5</text>
</svg>
