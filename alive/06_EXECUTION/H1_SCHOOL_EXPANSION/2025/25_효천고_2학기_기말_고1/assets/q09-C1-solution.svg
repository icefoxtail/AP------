<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img">
<rect width="960" height="100%" fill="#fafbff"/>
<rect x="27" y="24" width="906" height="96" rx="18" fill="#173250"/>
<text x="53" y="63" font-family="NanumSquare,Arial,sans-serif" font-weight="bold" font-size="27" fill="white">04 · 미지수 소거</text>
<text x="53" y="95" font-family="NanumSquare,Arial,sans-serif" font-size="19" fill="#d7eaf6">t=f(1)로 놓고 k를 직접 결정</text>
<rect x="35" y="140" width="890" height="88" rx="12" fill="white" stroke="#ccd8e4"/>
<text x="54" y="171" font-family="NanumSquare,Arial,sans-serif" font-weight="bold" font-size="20" fill="#243b53">① 양수 입력</text>
<text x="54" y="207" font-family="DejaVu Sans,NanumSquare,Arial,sans-serif" font-size="23" fill="#23354d">f(2) = 2t + k = 17</text>
<text x="900" y="207" font-family="NanumSquare,Arial,sans-serif" text-anchor="end" font-weight="bold" font-size="23" fill="#006d67">첫 번째 식</text>
<rect x="35" y="242" width="890" height="88" rx="12" fill="white" stroke="#ccd8e4"/>
<text x="54" y="273" font-family="NanumSquare,Arial,sans-serif" font-weight="bold" font-size="20" fill="#243b53">② 음수 입력</text>
<text x="54" y="309" font-family="DejaVu Sans,NanumSquare,Arial,sans-serif" font-size="23" fill="#23354d">f(-1) = k - t = 2</text>
<text x="900" y="309" font-family="NanumSquare,Arial,sans-serif" text-anchor="end" font-weight="bold" font-size="23" fill="#006d67">두 번째 식</text>
<rect x="35" y="344" width="890" height="88" rx="12" fill="white" stroke="#ccd8e4"/>
<text x="54" y="375" font-family="NanumSquare,Arial,sans-serif" font-weight="bold" font-size="20" fill="#243b53">③ 선형항 상쇄</text>
<text x="54" y="411" font-family="DejaVu Sans,NanumSquare,Arial,sans-serif" font-size="23" fill="#23354d">17 + 2×2 = 3k</text>
<text x="900" y="411" font-family="NanumSquare,Arial,sans-serif" text-anchor="end" font-weight="bold" font-size="23" fill="#006d67">k = 7</text>
<rect x="35" y="446" width="890" height="88" rx="12" fill="white" stroke="#ccd8e4"/>
<text x="54" y="477" font-family="NanumSquare,Arial,sans-serif" font-weight="bold" font-size="20" fill="#243b53">④ 대칭 합</text>
<text x="54" y="513" font-family="DejaVu Sans,NanumSquare,Arial,sans-serif" font-size="23" fill="#23354d">f(3)+f(-3) = 9k</text>
<text x="900" y="513" font-family="NanumSquare,Arial,sans-serif" text-anchor="end" font-weight="bold" font-size="23" fill="#006d67">정답 63</text>
<desc>두 입력값을 함수 관계식에 대입해 곱항을 소거하고 계수 k와 기초 함수값의 관계를 구한다.</desc>
</svg>
