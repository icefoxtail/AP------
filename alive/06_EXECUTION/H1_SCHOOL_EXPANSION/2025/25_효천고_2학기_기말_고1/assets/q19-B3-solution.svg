<svg xmlns="http://www.w3.org/2000/svg" width="900" height="450" viewBox="0 0 900 450" role="img" aria-label="B3 구간별로 다른 역함수와 두 입력의 계산; g의 두 출력이 임계값 1을 사이에 두므로 역함수의 서로 다른 분기 사용"><title>구간별로 다른 역함수와 두 입력의 계산</title><desc>B3 구간별로 다른 역함수와 두 입력의 계산; g의 두 출력이 임계값 1을 사이에 두므로 역함수의 서로 다른 분기 사용</desc><rect x="20" y="14" width="860" height="415" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4" /><text x="450" y="54" fill="#17365d" text-anchor="middle" font-family="NanumSquare, Noto Serif CJK KR, sans-serif" font-weight="700" font-size="23">B3  |  구간별로 다른 역함수와 두 입력의 계산</text><line x1="50" y1="69" x2="850" y2="69" stroke="#e2e8f0" stroke-width="2"/><text x="91" y="103" fill="#1e293b" text-anchor="start" font-family="NanumSquare, Noto Serif CJK KR, sans-serif" font-weight="700" font-size="17">f(x)의 분기</text><line x1="115.0" y1="267.72727272727275" x2="470.0" y2="267.72727272727275" stroke="#94a3b8" stroke-width="2"/><line x1="317.85714285714283" y1="355.0" x2="317.85714285714283" y2="115.0" stroke="#94a3b8" stroke-width="2"/><text x="480.0" y="272.72727272727275" fill="#1e293b" text-anchor="middle" font-family="NanumSquare, Noto Serif CJK KR, sans-serif" font-weight="400" font-size="14">x</text><text x="327.85714285714283" y="106.0" fill="#1e293b" text-anchor="middle" font-family="NanumSquare, Noto Serif CJK KR, sans-serif" font-weight="400" font-size="14">y</text><polyline fill="none" stroke="#2563eb" stroke-width="3.2" points="115.00,333.18 165.71,311.36 216.43,289.55 267.14,267.73 317.86,245.91"/><polyline fill="none" stroke="#b45309" stroke-width="3.2" points="317.86,245.91 368.57,202.27 419.29,158.64 470.00,115.00"/><circle cx="317.85714285714283" cy="245.9090909090909" r="5" fill="#b45309" /><text x="329.85714285714283" y="233.9090909090909" fill="#1e293b" text-anchor="start" font-family="NanumSquare, Noto Serif CJK KR, sans-serif" font-weight="400" font-size="15">(0,1)</text><text x="130" y="397" fill="#1e293b" text-anchor="start" font-family="NanumSquare, Noto Serif CJK KR, sans-serif" font-weight="400" font-size="16">파랑: x&lt;0  |  주황: x>=0</text><rect x="525" y="122" width="328" height="100" rx="12" fill="#eef6ff" stroke="#d0dbe6" stroke-width="1.4" /><text x="688" y="154" fill="#1e293b" text-anchor="middle" font-family="NanumSquare, Noto Serif CJK KR, sans-serif" font-weight="700" font-size="19">g(1) = -4 &lt; 1</text><text x="688" y="188" fill="#1e293b" text-anchor="middle" font-family="NanumSquare, Noto Serif CJK KR, sans-serif" font-weight="400" font-size="18">역함수 왼쪽 분기 → -5</text><rect x="525" y="239" width="328" height="100" rx="12" fill="#fdf4e9" stroke="#d0dbe6" stroke-width="1.4" /><text x="688" y="271" fill="#1e293b" text-anchor="middle" font-family="NanumSquare, Noto Serif CJK KR, sans-serif" font-weight="700" font-size="19">g(3) = 4 >= 1</text><text x="688" y="304" fill="#1e293b" text-anchor="middle" font-family="NanumSquare, Noto Serif CJK KR, sans-serif" font-weight="400" font-size="18">역함수 오른쪽 분기 → 3/2</text><text x="688" y="389" fill="#1d4ed8" text-anchor="middle" font-family="NanumSquare, Noto Serif CJK KR, sans-serif" font-weight="700" font-size="21">-5 + 3/2 = -7/2</text></svg>