<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="578" viewBox="0 0 1020 578" role="img">
<rect width="1020" height="578" fill="#f7faff"/>
<rect x="20" y="20" width="980" height="98" rx="16" fill="#153755"/>
<text x="44" y="61" font-family="NanumSquare,Noto Sans CJK KR,DejaVu Sans,sans-serif" font-weight="bold" font-size="29" fill="white">주기 3과 주기 2의 공통 조건</text>
<text x="44" y="94" font-family="NanumSquare,Noto Sans CJK KR,DejaVu Sans,sans-serif" font-size="19" fill="#e7f2ff">두 수열이 동시에 맞는 지수만 세기</text>
<rect x="26" y="134" width="968" height="88" rx="13" fill="#fff" stroke="#b6c8db"/>
<text x="42" y="160" font-family="NanumSquare,Noto Sans CJK KR,DejaVu Sans,sans-serif" font-weight="bold" font-size="20" fill="#213e57">첫 번째</text>
<text x="42" y="195" font-family="NanumSquare,Noto Sans CJK KR,DejaVu Sans,sans-serif" font-size="22" fill="#1b2b45">fⁿ(1) = 3</text>
<text x="980" y="195" text-anchor="end" font-family="NanumSquare,Noto Sans CJK KR,DejaVu Sans,sans-serif" font-weight="bold" font-size="18" fill="#005f58">n ≡ 2 (mod 3)</text>
<rect x="26" y="236" width="968" height="88" rx="13" fill="#fff" stroke="#b6c8db"/>
<text x="42" y="262" font-family="NanumSquare,Noto Sans CJK KR,DejaVu Sans,sans-serif" font-weight="bold" font-size="20" fill="#213e57">두 번째</text>
<text x="42" y="297" font-family="NanumSquare,Noto Sans CJK KR,DejaVu Sans,sans-serif" font-size="22" fill="#1b2b45">fⁿ(4) = 5</text>
<text x="980" y="297" text-anchor="end" font-family="NanumSquare,Noto Sans CJK KR,DejaVu Sans,sans-serif" font-weight="bold" font-size="18" fill="#005f58">n은 홀수</text>
<rect x="26" y="338" width="968" height="88" rx="13" fill="#fff" stroke="#b6c8db"/>
<text x="42" y="364" font-family="NanumSquare,Noto Sans CJK KR,DejaVu Sans,sans-serif" font-weight="bold" font-size="20" fill="#213e57">공통 지수</text>
<text x="42" y="399" font-family="NanumSquare,Noto Sans CJK KR,DejaVu Sans,sans-serif" font-size="22" fill="#1b2b45">n = 5, 11, 17, …, 95</text>
<text x="980" y="399" text-anchor="end" font-family="NanumSquare,Noto Sans CJK KR,DejaVu Sans,sans-serif" font-weight="bold" font-size="18" fill="#005f58">간격 6</text>
<rect x="26" y="440" width="968" height="88" rx="13" fill="#fff" stroke="#b6c8db"/>
<text x="42" y="466" font-family="NanumSquare,Noto Sans CJK KR,DejaVu Sans,sans-serif" font-weight="bold" font-size="20" fill="#213e57">최종 개수</text>
<text x="42" y="501" font-family="NanumSquare,Noto Sans CJK KR,DejaVu Sans,sans-serif" font-size="22" fill="#1b2b45">(95 − 5) / 6 + 1</text>
<text x="980" y="501" text-anchor="end" font-family="NanumSquare,Noto Sans CJK KR,DejaVu Sans,sans-serif" font-weight="bold" font-size="18" fill="#005f58">정답 16</text>
<desc>두 함수 반복의 주기 조건을 표에 놓고 동시에 성립하는 지수와 해당 함수값을 구한다.</desc>
</svg>
