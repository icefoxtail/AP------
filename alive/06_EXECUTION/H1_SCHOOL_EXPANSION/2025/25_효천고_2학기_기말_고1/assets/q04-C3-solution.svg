<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="210" viewBox="0 0 1040 210" role="img" aria-label="정수 조건과 경계 점검"><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L9 4 L0 8" fill="none" stroke="#365679"/></marker></defs><text x="520" y="42" text-anchor="middle" font-size="23" font-weight="bold" fill="#18293a">정수 조건과 경계 점검</text><rect x="151" y="75" width="226" height="88" rx="12" fill="#edf4ff" stroke="#536c8b" stroke-width="2"/><text x="264.0" y="112" text-anchor="middle" font-size="16" fill="#172a39">18의 양의 약수</text><text x="264.0" y="137" text-anchor="middle" font-size="16" fill="#172a39">1 2 3 6 9 18</text><path d="M379 119 L402 119" stroke="#365679" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><rect x="407" y="75" width="226" height="88" rx="12" fill="#edf4ff" stroke="#536c8b" stroke-width="2"/><text x="520.0" y="112" text-anchor="middle" font-size="16" fill="#172a39">몫이 1보다 큼</text><text x="520.0" y="137" text-anchor="middle" font-size="16" fill="#172a39">18 제외</text><path d="M635 119 L658 119" stroke="#365679" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><rect x="663" y="75" width="226" height="88" rx="12" fill="#edf4ff" stroke="#536c8b" stroke-width="2"/><text x="776.0" y="112" text-anchor="middle" font-size="16" fill="#172a39">가능한 a의 합</text><text x="776.0" y="137" text-anchor="middle" font-size="16" fill="#172a39">21</text><text x="520" y="196" text-anchor="middle" font-size="13" fill="#52616f">가능한 약수를 빠짐없이 확인하고 등호 경계를 제외합니다.</text></svg>