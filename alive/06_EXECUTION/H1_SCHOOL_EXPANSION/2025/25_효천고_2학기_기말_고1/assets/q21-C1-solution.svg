<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-label="C1 | 모든 입력에서 출력 범위 포함 여부"><title>C1 | 모든 입력에서 출력 범위 포함 여부</title><desc>a가 0, 1, 2일 때 이동한 출력구간과 허용 구간 0에서 2의 포함 관계를 비교하며 a가 1일 때만 포함된다.</desc><style>text{font-family:NanumSquare,'UnDotum',sans-serif;fill:#193248;font-size:17px}.small{font-size:15px;fill:#435971}.axis{stroke:#8297aa;stroke-width:2}.line{stroke:#2176c2;stroke-width:5;stroke-linecap:round}.focus{stroke:#ef8b36;stroke-width:5;stroke-linecap:round}.guide{stroke:#97a9ba;stroke-width:1.5;stroke-dasharray:6 6}.dot{fill:#2176c2}.open{fill:white;stroke:#ef8b36;stroke-width:3}.panel{fill:#f5f9fe;stroke:#dfebf5;stroke-width:1.5}.pill{fill:#e5f0fc}</style><rect width="960" height="480" fill="white"/><text x="40" y="43" font-size="24" font-weight="700">C1 | 모든 입력에서 출력 범위 포함 여부</text><line x1="40" y1="64" x2="920" y2="64" stroke="#dce7f2" stroke-width="2"/><rect class="panel" x="55" y="86" width="850" height="332" rx="15"/><text x="103" y="164" class="">a = 0</text><line x1="200" y1="157" x2="680" y2="157" class="axis"/><line x1="320" y1="127" x2="320" y2="189" class="guide"/><line x1="560" y1="127" x2="560" y2="189" class="guide"/><line x1="320" y1="139" x2="560" y2="139" class="focus"/><line x1="200" y1="171" x2="440" y2="171" class="line"/><circle cx="320" cy="139" r="6" class="dot"/><circle cx="560" cy="139" r="6" class="dot"/><circle cx="200" cy="171" r="6" class="dot"/><circle cx="440" cy="171" r="6" class="dot"/><text x="780" y="144" class="small">기준 [0,2]</text><text x="780" y="182" class="small">이동 구간</text><text x="103" y="265" class="">a = 1</text><line x1="200" y1="258" x2="680" y2="258" class="axis"/><line x1="320" y1="228" x2="320" y2="290" class="guide"/><line x1="560" y1="228" x2="560" y2="290" class="guide"/><line x1="320" y1="240" x2="560" y2="240" class="focus"/><line x1="320" y1="272" x2="560" y2="272" class="line"/><circle cx="320" cy="240" r="6" class="dot"/><circle cx="560" cy="240" r="6" class="dot"/><circle cx="320" cy="272" r="6" class="dot"/><circle cx="560" cy="272" r="6" class="dot"/><text x="780" y="245" class="small">기준 [0,2]</text><text x="780" y="283" class="small">이동 구간</text><text x="103" y="366" class="">a = 2</text><line x1="200" y1="359" x2="680" y2="359" class="axis"/><line x1="320" y1="329" x2="320" y2="391" class="guide"/><line x1="560" y1="329" x2="560" y2="391" class="guide"/><line x1="320" y1="341" x2="560" y2="341" class="focus"/><line x1="440" y1="373" x2="680" y2="373" class="line"/><circle cx="320" cy="341" r="6" class="dot"/><circle cx="560" cy="341" r="6" class="dot"/><circle cx="440" cy="373" r="6" class="dot"/><circle cx="680" cy="373" r="6" class="dot"/><text x="780" y="346" class="small">기준 [0,2]</text><text x="780" y="384" class="small">이동 구간</text><text x="480" y="454" class="" text-anchor="middle">a = 1 일 때만 [a-1, a+1] 이 [0, 2] 안에 들어감</text></svg>