<svg xmlns="http://www.w3.org/2000/svg" width="900" height="450" viewBox="0 0 900 450" role="img" aria-label="C3 합성 순서 일치 조건과 양의 해 판정; 서로 다른 두 합성식을 a에 관해 전개해 일치 방정식을 만들고 무리근 중 양수 선택"><title>합성 순서 일치 조건과 양의 해 판정</title><desc>C3 합성 순서 일치 조건과 양의 해 판정; 서로 다른 두 합성식을 a에 관해 전개해 일치 방정식을 만들고 무리근 중 양수 선택</desc><rect x="20" y="14" width="860" height="415" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4" /><text x="450" y="54" fill="#17365d" text-anchor="middle" font-family="NanumSquare, Noto Serif CJK KR, sans-serif" font-weight="700" font-size="23">C3  |  합성 순서 일치 조건과 양의 해 판정</text><line x1="50" y1="69" x2="850" y2="69" stroke="#e2e8f0" stroke-width="2"/><rect x="62" y="115" width="380" height="99" rx="12" fill="#eef6ff" stroke="#d0dbe6" stroke-width="1.4" /><text x="252" y="146" fill="#1e293b" text-anchor="middle" font-family="NanumSquare, Noto Serif CJK KR, sans-serif" font-weight="700" font-size="17">f^(-1)(g(a))</text><text x="252" y="181" fill="#1e293b" text-anchor="middle" font-family="NanumSquare, Noto Serif CJK KR, sans-serif" font-weight="400" font-size="18">(a^2 - 4a + 6) / 2</text><rect x="467" y="115" width="370" height="99" rx="12" fill="#fff7ed" stroke="#d0dbe6" stroke-width="1.4" /><text x="652" y="146" fill="#1e293b" text-anchor="middle" font-family="NanumSquare, Noto Serif CJK KR, sans-serif" font-weight="700" font-size="17">g(f^(-1)(a))</text><text x="652" y="181" fill="#1e293b" text-anchor="middle" font-family="NanumSquare, Noto Serif CJK KR, sans-serif" font-weight="400" font-size="18">(a^2 - 6a + 13) / 4</text><text x="450" y="262" fill="#1e293b" text-anchor="middle" font-family="NanumSquare, Noto Serif CJK KR, sans-serif" font-weight="700" font-size="20">두 식을 같게 놓으면  a^2 - 2a - 1 = 0</text><text x="450" y="308" fill="#1e293b" text-anchor="middle" font-family="NanumSquare, Noto Serif CJK KR, sans-serif" font-weight="400" font-size="20">(a - 1)^2 = 2  →  a = 1 ± √2</text><rect x="192" y="333" width="514" height="67" rx="12" fill="#eef6ff" stroke="#d0dbe6" stroke-width="1.4" /><text x="450" y="375" fill="#1d4ed8" text-anchor="middle" font-family="NanumSquare, Noto Serif CJK KR, sans-serif" font-weight="700" font-size="22">a &gt; 0  →  a = 1 + √2</text></svg>