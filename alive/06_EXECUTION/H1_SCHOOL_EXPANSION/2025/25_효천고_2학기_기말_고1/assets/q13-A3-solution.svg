<svg baseProfile="full" height="820px" version="1.1" viewBox="0 0 1400 820" width="1400px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><title>효천고 q13 A3 해설 도형</title><desc>유리함수 점근선에서 공유 계수 b,c를 회수한 뒤 무리함수 사분면 경계로 옮겨야 한다. 점근선과 가지 방향은 원본의 다른 함수 정보를 읽어오는 필수 단계.</desc><defs><clipPath id="plotclipA3"><rect height="554" width="805" x="78" y="167" /></clipPath></defs><rect fill="#FAFCFF" height="820" rx="28" width="1400" x="0" y="0" /><rect fill="#FFFFFF" height="770" rx="24" stroke="#DBE6F2" stroke-width="2" width="1350" x="25" y="25" /><rect fill="#2459C3" height="50" rx="3" width="8" x="48" y="59" /><text fill="#64748B" font-family="Noto Sans CJK KR" font-size="21" x="75" y="70">효천고  ·  공통수학2  |  무리함수의 사분면</text><text fill="#172B4B" font-family="Noto Sans CJK KR" font-size="32" font-weight="bold" x="75" y="112">A3  유리함수 점근선에서 무리함수 매개변수 추론</text><rect fill="#F8FAFE" height="554" rx="8" stroke="#DFE8F3" stroke-width="1" width="805" x="78" y="167" /><rect fill="#FCECEF" height="277.0" opacity=".62" width="287.5" x="78.0" y="444.0" /><line stroke="#E5ECF4" stroke-width="0.8" x1="78.0" x2="78.0" y1="721.0" y2="167.0" /><line stroke="#E5ECF4" stroke-width="0.8" x1="135.5" x2="135.5" y1="721.0" y2="167.0" /><text fill="#64748B" font-family="Noto Sans CJK KR" font-size="16" x="126.5" y="741.0">-4</text><line stroke="#E5ECF4" stroke-width="0.8" x1="193.0" x2="193.0" y1="721.0" y2="167.0" /><line stroke="#E5ECF4" stroke-width="0.8" x1="250.5" x2="250.5" y1="721.0" y2="167.0" /><text fill="#64748B" font-family="Noto Sans CJK KR" font-size="16" x="241.5" y="741.0">-2</text><line stroke="#E5ECF4" stroke-width="0.8" x1="308.0" x2="308.0" y1="721.0" y2="167.0" /><line stroke="#8496B0" stroke-width="2" x1="365.5" x2="365.5" y1="721.0" y2="167.0" /><text fill="#64748B" font-family="Noto Sans CJK KR" font-size="16" x="356.5" y="741.0">0</text><line stroke="#E5ECF4" stroke-width="0.8" x1="423.0" x2="423.0" y1="