<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="효천고 6번 C1 진리집합 추론">
<rect x="0" y="0" width="1200" height="420" fill="#FFFFFF"/>
<text x="42" y="50" font-family="NanumSquare, sans-serif" font-size="28" fill="#182b4b" font-weight="bold">C1 · 진리집합 추론</text>
<rect x="48" y="58" width="1090" height="49" rx="8" fill="#f2f5fa"/>
<text x="70" y="90" font-family="NanumSquare, sans-serif" font-size="21" fill="#335277">전제 1</text>
<text x="270" y="90" font-family="NanumSquare, sans-serif" font-size="23" fill="#132943">P ⊆ Q ∪ R</text>
<rect x="48" y="116" width="1090" height="49" rx="8" fill="#f2f5fa"/>
<text x="70" y="148" font-family="NanumSquare, sans-serif" font-size="21" fill="#335277">전제 2</text>
<text x="270" y="148" font-family="NanumSquare, sans-serif" font-size="23" fill="#132943">Q ⊆ S</text>
<rect x="48" y="174" width="1090" height="49" rx="8" fill="#f2f5fa"/>
<text x="70" y="206" font-family="NanumSquare, sans-serif" font-size="21" fill="#335277">전제 3</text>
<text x="270" y="206" font-family="NanumSquare, sans-serif" font-size="23" fill="#132943">R ∩ S = 공집합</text>
<text x="64" y="260" font-family="NanumSquare, sans-serif" font-size="22" fill="#33475f">P ∩ S ⊆ P ∩ Q  및  P ∩ Q ⊆ P ∩ S</text>
<text x="64" y="306" font-family="NanumSquare, sans-serif" font-size="29" fill="#163c73" font-weight="bold">∴ P ∩ S = P ∩ Q</text>
<text x="64" y="385" font-family="NanumSquare, sans-serif" font-size="17" fill="#667789">집합의 포함 방향과 여집합을 확인한다.</text>
</svg>