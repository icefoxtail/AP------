<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="472" viewBox="0 0 1300 472" role="img" aria-label="Q05 C2 solution algebra diagram">
<rect width="1300" height="472" fill="#f5f8fd"/>
<rect x="24" y="24" width="1252" height="424" rx="18" fill="white" stroke="#cad7e9" stroke-width="2"/>
<rect x="24" y="24" width="11" height="424" rx="5" fill="#3563ab"/>
<text x="68" y="78" font-family="NanumSquare, DejaVu Sans" font-size="30" font-weight="bold" fill="#1e3556">C2 | 괄호의 차를 먼저 계산</text>
<text x="68" y="115" font-family="NanumSquare, DejaVu Sans" font-size="21" fill="#54677d">괄호 안의 -1을 끝까지 유지해야 한다.</text>
<rect x="63" y="141" width="1169" height="88" rx="11" fill="#edf3fe"/>
<text x="89" y="168" font-family="NanumSquare, DejaVu Sans" font-size="19" font-weight="bold" fill="#536987">① 첫 분수의 인수분해</text>
<text x="89" y="202" font-family="DejaVu Sans Mono" font-size="23" fill="#14283f">(x^2-25)/(x^2+3x-10) = (x-5)/(x-2)</text>
<rect x="63" y="237" width="1169" height="88" rx="11" fill="#eef6f5"/>
<text x="89" y="264" font-family="NanumSquare, DejaVu Sans" font-size="19" font-weight="bold" fill="#536987">② 같은 분모끼리 뺄셈</text>
<text x="89" y="298" font-family="DejaVu Sans Mono" font-size="23" fill="#14283f">[(x-5)-(x-4)]/(x-2) = -1/(x-2)</text>
<rect x="63" y="333" width="1169" height="88" rx="11" fill="#fff5e5"/>
<text x="89" y="360" font-family="NanumSquare, DejaVu Sans" font-size="19" font-weight="bold" fill="#536987">③ 마지막 곱셈과 제외값</text>
<text x="89" y="394" font-family="DejaVu Sans Mono" font-size="23" fill="#14283f">-(x+5)/[(x-1)(x+1)]    |    x != -5, -1, 1, 2</text>
</svg>