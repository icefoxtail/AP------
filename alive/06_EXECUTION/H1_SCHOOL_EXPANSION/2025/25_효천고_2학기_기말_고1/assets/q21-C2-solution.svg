<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-label="C2 | 두 전구간 조건의 교집합"><title>C2 | 두 전구간 조건의 교집합</title><desc>첫째 이차식에서 마이너스 루트3부터 루트3, 둘째에서 1 이상을 요구하므로 두 조건의 교집합에 포함된 정수는 1뿐이다.</desc><style>text{font-family:NanumSquare,'UnDotum',sans-serif;fill:#193248;font-size:17px}.small{font-size:15px;fill:#435971}.axis{stroke:#8297aa;stroke-width:2}.line{stroke:#2176c2;stroke-width:5;stroke-linecap:round}.focus{stroke:#ef8b36;stroke-width:5;stroke-linecap:round}.guide{stroke:#97a9ba;stroke-width:1.5;stroke-dasharray:6 6}.dot{fill:#2176c2}.open{fill:white;stroke:#ef8b36;stroke-width:3}.panel{fill:#f5f9fe;stroke:#dfebf5;stroke-width:1.5}.pill{fill:#e5f0fc}</style><rect width="960" height="480" fill="white"/><text x="40" y="43" font-size="24" font-weight="700">C2 | 두 전구간 조건의 교집합</text><line x1="40" y1="64" x2="920" y2="64" stroke="#dce7f2" stroke-width="2"/><rect class="panel" x="55" y="86" width="850" height="330" rx="15"/><line x1="180.0" y1="160" x2="820.0" y2="160" class="axis"/><line x1="266.7949192431123" y1="160" x2="613.2050807568877" y2="160" class="line"/><circle cx="266.7949192431123" cy="160" r="6" class="dot"/><circle cx="613.2050807568877" cy="160" r="6" class="dot"/><text x="648" y="145" class="small">첫째: -sqrt(3) &lt;= a &lt;= sqrt(3)</text><line x1="180.0" y1="258" x2="820.0" y2="258" class="axis"/><line x1="540" y1="258" x2="840" y2="258" class="focus"/><circle cx="540" cy="258" r="6" class="dot"/><circle cx="840" cy="258" r="6" class="dot"/><text x="648" y="243" class="small">둘째 식: a &gt;= 1</text><line x1="180.0" y1="356" x2="820.0" y2="356" class="axis"/><line x1="540" y1="356" x2="613.2050807568877" y2="356" class="line"/><circle cx="540" cy="356" r="6" class="dot"/><circle cx="613.2050807568877" cy="356" r="6" class="dot"/><text x="648" y="341" class="small">두 조건 교집합</text><text x="480" y="448" class="" text-anchor="middle">교집합에서 정수는 a = 1 하나</text></svg>