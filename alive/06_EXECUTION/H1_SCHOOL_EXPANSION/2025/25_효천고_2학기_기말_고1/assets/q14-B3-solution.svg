<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="640px" version="1.1" viewBox="0 0 1040 640" width="1040px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><title>효천고 q14 B3 해설 도형</title><desc>두 변수의 사각 영역과 합 부등식 및 반례 좌표를 비교하지만 정리 적용은 직접적이다. 평면의 q 영역과 세로 경계 및 반례점을 표시한다.</desc><defs /><rect fill="#F7FAFD" height="640" width="1040" x="0" y="0" /><rect fill="#087F8C" height="9" width="1040" x="0" y="0" /><text fill="#63758B" font-family="NanumSquare, Noto Sans CJK KR, sans-serif" font-size="17" font-weight="600" text-anchor="start" x="48" y="62">QID9  ·  14번 해설</text><text fill="#16263E" font-family="NanumSquare, Noto Sans CJK KR, sans-serif" font-size="36" font-weight="700" text-anchor="start" x="48" y="113">두 변수 진리집합의 포함</text><text fill="#63758B" font-family="NanumSquare, Noto Sans CJK KR, sans-serif" font-size="18" font-weight="500" text-anchor="start" x="48" y="149">필요·충분조건의 관계</text><rect fill="#FFFFFF" height="378" rx="16" ry="16" stroke="#DCE6F0" stroke-width="1.3" width="945" x="48" y="190" /><line stroke="#DCE6F0" stroke-linecap="round" stroke-width="1" x1="275" x2="275" y1="236" y2="520" /><line stroke="#DCE6F0" stroke-linecap="round" stroke-width="1" x1="130" x2="700" y1="455" y2="455" /><line stroke="#DCE6F0" stroke-linecap="round" stroke-width="1" x1="346" x2="346" y1="236" y2="520" /><line stroke="#DCE6F0" stroke-linecap="round" stroke-width="1" x1="130" x2="700" y1="390" y2="390" /><line stroke="#DCE6F0" stroke-linecap="round" stroke-width="1" x1="417" x2="417" y1="236" y2="520" /><line stroke="#DCE6F0" stroke-linecap="round" stroke-width="1" x1="130" x2="700" y1="325" y2="325" /><line stroke="#DCE6F0" stroke-linecap="round" stroke-width="1" x1="488" x2="488" y1="236" y2="520" /><line stroke="#DCE6F0" stroke-linecap="round" stroke-width="1" x1="130" x2="700" y1="260" y2="260" /><rect fill="#B6E8E1" fill-opacity="0.65" height="154" width="355" x="275" y="236" /><line stroke="#16263E" stroke-linecap="round" stroke-width="2.2" x1="204" x2="712" y1="520" y2="520" /><line stroke="#16263E" stroke-linecap="round" stroke-width="2.2" x1="204" x2="204" y1="540" y2="218" /><line stroke="#087F8C" stroke-dasharray="8,7" stroke-linecap="round" stroke-width="3.5" x1="275" x2="275" y1="520" y2="236" /><line stroke="#087F8C" stroke-dasharray="8,7" stroke-linecap="round" stroke-width="3.5" x1="204" x2="712" y1="390" y2="390" /><line stroke="#D98A12" stroke-dasharray="6,8" stroke-linecap="round" stroke-width="2.8" x1="346" x2="346" y1="520" y2="236" /><text fill="#63758B" font-family="NanumSquare, Noto Sans CJK KR, sans-serif" font-size="14" font-weight="400" text-anchor="middle" x="275" y="541">1</text><text fill="#63758B" font-family="NanumSquare, Noto Sans CJK KR, sans-serif" font-size="14" font-weight="400" text-anchor="middle" x="346" y="541">2</text><text fill="#63758B" font-family="NanumSquare, Noto Sans CJK KR, sans-serif" font-size="14" font-weight="400" text-anchor="middle" x="417" y="541">3</text><text fill="#63758B" font-family="NanumSquare, Noto Sans CJK KR, sans-serif" font-size="14" font-weight="400" text-anchor="middle" x="488" y="541">4</text><text fill="#63758B" font-family="NanumSquare, Noto Sans CJK KR, sans-serif" font-size="14" font-weight="400" text-anchor="middle" x="559" y="541">5</text><text fill="#63758B" font-family="NanumSquare, Noto Sans CJK KR, sans-serif" font-size="14" font-weight="400" text-anchor="middle" x="630" y="541">6</text><text fill="#63758B" font-family="NanumSquare, Noto Sans CJK KR, sans-serif" font-size="14" font-weight="400" text-anchor="middle" x="186" y="460">1</text><text fill="#63758B" font-family="NanumSquare, Noto Sans CJK KR, sans-serif" font-size="14" font-weight="400" text-anchor="middle" x="186" y="395">2</text><text fill="#63758B" font-family="NanumSquare, Noto Sans CJK KR, sans-serif" font-size="14" font-weight="400" text-anchor="middle" x="186" y="330">3</text><text fill="#63758B" font-family="NanumSquare, Noto Sans CJK KR, sans-serif" font-size="14" font-weight="400" text-anchor="middle" x="186" y="265">4</text><text fill="#087F8C" font-family="NanumSquare, Noto Sans CJK KR, sans-serif" font-size="20" font-weight="700" text-anchor="start" x="730" y="269">청록색: q 영역</text><text fill="#16263E" font-family="NanumSquare, Noto Sans CJK KR, sans-serif" font-size="19" font-weight="500" text-anchor="start" x="730" y="320">x &gt; 1, y &gt; 2</text><text fill="#D98A12" font-family="NanumSquare, Noto Sans CJK KR, sans-serif" font-size="20" font-weight="700" text-anchor="start" x="730" y="385">금색선: x = 2</text><text fill="#B94B50" font-family="NanumSquare, Noto Sans CJK KR, sans-serif" font-size="17" font-weight="500" text-anchor="start" x="730" y="432">(3,0): p₄참, q거짓</text><text fill="#16263E" font-family="NanumSquare, Noto Sans CJK KR, sans-serif" font-size="16" font-weight="500" text-anchor="start" x="730" y="472">(1.5,2.5): q참, p₄거짓</text><line stroke="#DCE6F0" stroke-linecap="round" stroke-width="1.5" x1="48" x2="992" y1="585" y2="585" /><text fill="#63758B" font-family="NanumSquare, Noto Sans CJK KR, sans-serif" font-size="17" font-weight="500" text-anchor="start" x="48" y="614">평면의 진리집합은 서로 겹칠 수 있어도 포함되지 않을 수 있다.</text></svg>