<svg xmlns="http://www.w3.org/2000/svg" width="900" height="450" viewBox="0 0 900 450" role="img" aria-label="C1 서로 다른 두 합성 조건으로 f의 두 계수 역산; f^-1(g(t))의 출력 두 개가 주어졌을 때 f 출력 데이터로 되돌려 일차함수를 복원"><title>서로 다른 두 합성 조건으로 f의 두 계수 역산</title><desc>C1 서로 다른 두 합성 조건으로 f의 두 계수 역산; f^-1(g(t))의 출력 두 개가 주어졌을 때 f 출력 데이터로 되돌려 일차함수를 복원</desc><rect x="20" y="14" width="860" height="415" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4" /><text x="450" y="54" fill="#17365d" text-anchor="middle" font-family="NanumSquare, Noto Serif CJK KR, sans-serif" font-weight="700" font-size="23">C1  |  서로 다른 두 합성 조건으로 f의 두 계수 역산</text><line x1="50" y1="69" x2="850" y2="69" stroke="#e2e8f0" stroke-width="2"/><text x="80" y="111" fill="#1e293b" text-anchor="start" font-family="NanumSquare, Noto Serif CJK KR, sans-serif" font-weight="700" font-size="18">출력 조건을 거꾸로 f의 대응으로 읽기</text><rect x="64" y="139" width="252" height="75" rx="12" fill="#f5f8fc" stroke="#d0dbe6" stroke-width="1.4" />
<text x="190.0" y="166" fill="#17447b" text-anchor="middle" font-family="NanumSquare, Noto Serif CJK KR, sans-serif" font-weight="700" font-size="17">f^(-1)(g(1)) = 2</text>
<text x="190.0" y="195" fill="#1e293b" text-anchor="middle" font-family="NanumSquare, Noto Serif CJK KR, sans-serif" font-weight="400" font-size="17">g(1) = 2</text><line x1="321" y1="178" x2="411" y2="178" stroke="#496787" stroke-width="2"/>
<polygon points="411,178 401,173 401,183" fill="#496787"/><rect x="420" y="139" width="350" height="75" rx="12" fill="#f5f8fc" stroke="#d0dbe6" stroke-width="1.4" />
<text x="595.0" y="166" fill="#17447b" text-anchor="middle" font-family="NanumSquare, Noto Serif CJK KR, sans-serif" font-weight="700" font-size="17">f(2) = 2</text>
<text x="595.0" y="195" fill="#1e293b" text-anchor="middle" font-family="NanumSquare, Noto Serif CJK KR, sans-serif" font-weight="400" font-size="17">2a + b = 2</text><rect x="64" y="256" width="252" height="75" rx="12" fill="#f5f8fc" stroke="#d0dbe6" stroke-width="1.4" />
<text x="190.0" y="283" fill="#17447b" text-anchor="middle" font-family="NanumSquare, Noto Serif CJK KR, sans-serif" font-weight="700" font-size="17">f^(-1)(g(3)) = 5</text>
<text x="190.0" y="312" fill="#1e293b" text-anchor="middle" font-family="NanumSquare, Noto Serif CJK KR, sans-serif" font-weight="400" font-size="17">g(3) = 10</text><line x1="321" y1="293" x2="411" y2="293" stroke="#496787" stroke-width="2"/>
<polygon points="411,293 401,288 401,298" fill="#496787"/><rect x="420" y="256" width="350" height="75" rx="12" fill="#f5f8fc" stroke="#d0dbe6" stroke-width="1.4" />
<text x="595.0" y="283" fill="#17447b" text-anchor="middle" font-family="NanumSquare, Noto Serif CJK KR, sans-serif" font-weight="700" font-size="17">f(5) = 10</text>
<text x="595.0" y="312" fill="#1e293b" text-anchor="middle" font-family="NanumSquare, Noto Serif CJK KR, sans-serif" font-weight="400" font-size="17">5a + b = 10</text><text x="450" y="405" fill="#1d4ed8" text-anchor="middle" font-family="NanumSquare, Noto Serif CJK KR, sans-serif" font-weight="700" font-size="20">두 식의 차: 3a = 8   →   f^(-1)(g(2)) = 25/8</text></svg>