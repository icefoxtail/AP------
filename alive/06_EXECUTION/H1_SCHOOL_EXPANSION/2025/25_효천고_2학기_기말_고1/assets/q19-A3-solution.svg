<svg xmlns="http://www.w3.org/2000/svg" width="900" height="450" viewBox="0 0 900 450" role="img" aria-label="A3 합성 순서의 차이를 비교; f^-1og와 gof^-1을 각각 계산해 일반적으로 합성이 교환되지 않음을 확인"><title>합성 순서의 차이를 비교</title><desc>A3 합성 순서의 차이를 비교; f^-1og와 gof^-1을 각각 계산해 일반적으로 합성이 교환되지 않음을 확인</desc><rect x="20" y="14" width="860" height="415" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4" /><text x="450" y="54" fill="#17365d" text-anchor="middle" font-family="NanumSquare, Noto Serif CJK KR, sans-serif" font-weight="700" font-size="23">A3  |  합성 순서의 차이를 비교</text><line x1="50" y1="69" x2="850" y2="69" stroke="#e2e8f0" stroke-width="2"/><text x="72" y="108" fill="#1e293b" text-anchor="start" font-family="NanumSquare, Noto Serif CJK KR, sans-serif" font-weight="700" font-size="17">① 역함수를 나중에</text><rect x="77" y="135" width="182" height="75" rx="12" fill="#f5f8fc" stroke="#d0dbe6" stroke-width="1.4" />
<text x="168.0" y="162" fill="#17447b" text-anchor="middle" font-family="NanumSquare, Noto Serif CJK KR, sans-serif" font-weight="700" font-size="17">입력</text>
<text x="168.0" y="191" fill="#1e293b" text-anchor="middle" font-family="NanumSquare, Noto Serif CJK KR, sans-serif" font-weight="400" font-size="17">3</text><rect x="355" y="135" width="182" height="75" rx="12" fill="#f5f8fc" stroke="#d0dbe6" stroke-width="1.4" />
<text x="446.0" y="162" fill="#17447b" text-anchor="middle" font-family="NanumSquare, Noto Serif CJK KR, sans-serif" font-weight="700" font-size="17">g 먼저</text>
<text x="446.0" y="191" fill="#1e293b" text-anchor="middle" font-family="NanumSquare, Noto Serif CJK KR, sans-serif" font-weight="400" font-size="17">g(3) = 5</text><rect x="634" y="135" width="182" height="75" rx="12" fill="#f5f8fc" stroke="#d0dbe6" stroke-width="1.4" />
<text x="725.0" y="162" fill="#17447b" text-anchor="middle" font-family="NanumSquare, Noto Serif CJK KR, sans-serif" font-weight="700" font-size="17">f 역함수</text>
<text x="725.0" y="191" fill="#1e293b" text-anchor="middle" font-family="NanumSquare, Noto Serif CJK KR, sans-serif" font-weight="400" font-size="17">f^(-1)(5) = 3</text><line x1="260" y1="172" x2="347" y2="172" stroke="#496787" stroke-width="2"/>
<polygon points="347,172 337,167 337,177" fill="#496787"/><line x1="538" y1="172" x2="626" y2="172" stroke="#496787" stroke-width="2"/>
<polygon points="626,172 616,167 616,177" fill="#496787"/><text x="72" y="266" fill="#1e293b" text-anchor="start" font-family="NanumSquare, Noto Serif CJK KR, sans-serif" font-weight="700" font-size="17">② 역함수를 먼저</text><rect x="77" y="287" width="182" height="75" rx="12" fill="#f5f8fc" stroke="#d0dbe6" stroke-width="1.4" />
<text x="168.0" y="314" fill="#17447b" text-anchor="middle" font-family="NanumSquare, Noto Serif CJK KR, sans-serif" font-weight="700" font-size="17">입력</text>
<text x="168.0" y="343" fill="#1e293b" text-anchor="middle" font-family="NanumSquare, Noto Serif CJK KR, sans-serif" font-weight="400" font-size="17">3</text><rect x="355" y="287" width="182" height="75" rx="12" fill="#f5f8fc" stroke="#d0dbe6" stroke-width="1.4" />
<text x="446.0" y="314" fill="#17447b" text-anchor="middle" font-family="NanumSquare, Noto Serif CJK KR, sans-serif" font-weight="700" font-size="17">f 역함수</text>
<text x="446.0" y="343" fill="#1e293b" text-anchor="middle" font-family="NanumSquare, Noto Serif CJK KR, sans-serif" font-weight="400" font-size="17">f^(-1)(3) = 2</text><rect x="634" y="287" width="182" height="75" rx="12" fill="#f5f8fc" stroke="#d0dbe6" stroke-width="1.4" />
<text x="725.0" y="314" fill="#17447b" text-anchor="middle" font-family="NanumSquare, Noto Serif CJK KR, sans-serif" font-weight="700" font-size="17">g 나중에</text>
<text x="725.0" y="343" fill="#1e293b" text-anchor="middle" font-family="NanumSquare, Noto Serif CJK KR, sans-serif" font-weight="400" font-size="17">g(2) = 0</text><line x1="260" y1="324" x2="347" y2="324" stroke="#496787" stroke-width="2"/>
<polygon points="347,324 337,319 337,329" fill="#496787"/><line x1="538" y1="324" x2="626" y2="324" stroke="#496787" stroke-width="2"/>
<polygon points="626,324 616,319 616,329" fill="#496787"/><text x="450" y="409" fill="#1d4ed8" text-anchor="middle" font-family="NanumSquare, Noto Serif CJK KR, sans-serif" font-weight="700" font-size="20">두 합성의 차 = 3 - 0 = 3</text></svg>