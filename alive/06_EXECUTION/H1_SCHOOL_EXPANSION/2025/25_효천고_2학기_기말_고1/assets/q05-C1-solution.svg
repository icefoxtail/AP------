<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="472" viewBox="0 0 1300 472" role="img" aria-label="Q05 C1 solution algebra diagram">
<rect width="1300" height="472" fill="#f5f8fd"/>
<rect x="24" y="24" width="1252" height="424" rx="18" fill="white" stroke="#cad7e9" stroke-width="2"/>
<rect x="24" y="24" width="11" height="424" rx="5" fill="#3563ab"/>
<text x="68" y="78" font-family="NanumSquare, DejaVu Sans" font-size="30" font-weight="bold" fill="#1e3556">C1 | 약분 전 정의역을 보존</text>
<text x="68" y="115" font-family="NanumSquare, DejaVu Sans" font-size="21" fill="#54677d">나누는 식이 0인 자리까지 원식에서 제외한다.</text>
<rect x="63" y="141" width="1169" height="88" rx="11" fill="#edf3fe"/>
<text x="89" y="168" font-family="NanumSquare, DejaVu Sans" font-size="19" font-weight="bold" fill="#536987">① 나누는 분수를 뒤집어 곱하기</text>
<text x="89" y="202" font-family="DejaVu Sans Mono" font-size="23" fill="#14283f">[(x-5)(x+1)] / [(x-3)(x+3)]  *  [(x+3)(x-1)] / [(x-1)(x+1)]</text>
<rect x="63" y="237" width="1169" height="88" rx="11" fill="#eef6f5"/>
<text x="89" y="264" font-family="NanumSquare, DejaVu Sans" font-size="19" font-weight="bold" fill="#536987">② 공통 인수만 약분</text>
<text x="89" y="298" font-family="DejaVu Sans Mono" font-size="23" fill="#14283f">(x-5) / (x-3)</text>
<rect x="63" y="333" width="1169" height="88" rx="11" fill="#fff5e5"/>
<text x="89" y="360" font-family="NanumSquare, DejaVu Sans" font-size="19" font-weight="bold" fill="#536987">③ 원래 식의 제외값</text>
<text x="89" y="394" font-family="DejaVu Sans Mono" font-size="23" fill="#14283f">x != -3, -1, 1, 3     |     choice 3</text>
</svg>