<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img">
<rect width="960" height="100%" fill="#fafbff"/>
<rect x="27" y="24" width="906" height="96" rx="18" fill="#173250"/>
<text x="53" y="63" font-family="NanumSquare,Arial,sans-serif" font-weight="bold" font-size="27" fill="white">06 · 정수 경계 확인</text>
<text x="53" y="95" font-family="NanumSquare,Arial,sans-serif" font-size="19" fill="#d7eaf6">왼쪽 등호는 포함, 0은 제외</text>
<rect x="35" y="140" width="890" height="88" rx="12" fill="white" stroke="#ccd8e4"/>
<text x="54" y="171" font-family="NanumSquare,Arial,sans-serif" font-weight="bold" font-size="20" fill="#243b53">① 두 조건 소거</text>
<text x="54" y="207" font-family="DejaVu Sans,NanumSquare,Arial,sans-serif" font-size="23" fill="#23354d">2t + k = 10, k - t = 1</text>
<text x="900" y="207" font-family="NanumSquare,Arial,sans-serif" text-anchor="end" font-weight="bold" font-size="23" fill="#006d67">k=4, t=3</text>
<rect x="35" y="242" width="890" height="88" rx="12" fill="white" stroke="#ccd8e4"/>
<text x="54" y="273" font-family="NanumSquare,Arial,sans-serif" font-weight="bold" font-size="20" fill="#243b53">② 함수식</text>
<text x="54" y="309" font-family="DejaVu Sans,NanumSquare,Arial,sans-serif" font-size="23" fill="#23354d">f(n) = 2n² + n</text>
<text x="900" y="309" font-family="NanumSquare,Arial,sans-serif" text-anchor="end" font-weight="bold" font-size="23" fill="#006d67">0 &lt; f(n) ≤ 28</text>
<rect x="35" y="344" width="890" height="88" rx="12" fill="white" stroke="#ccd8e4"/>
<text x="54" y="375" font-family="NanumSquare,Arial,sans-serif" font-weight="bold" font-size="20" fill="#243b53">③ 음수 구간</text>
<text x="54" y="411" font-family="DejaVu Sans,NanumSquare,Arial,sans-serif" font-size="23" fill="#23354d">f(-4)=28, f(-5)=45</text>
<text x="900" y="411" font-family="NanumSquare,Arial,sans-serif" text-anchor="end" font-weight="bold" font-size="23" fill="#006d67">-4,-3,-2,-1</text>
<rect x="35" y="446" width="890" height="88" rx="12" fill="white" stroke="#ccd8e4"/>
<text x="54" y="477" font-family="NanumSquare,Arial,sans-serif" font-weight="bold" font-size="20" fill="#243b53">④ 양수 구간</text>
<text x="54" y="513" font-family="DejaVu Sans,NanumSquare,Arial,sans-serif" font-size="23" fill="#23354d">f(3)=21, f(4)=36</text>
<text x="900" y="513" font-family="NanumSquare,Arial,sans-serif" text-anchor="end" font-weight="bold" font-size="23" fill="#006d67">1,2,3 · 정답 7</text>
</svg>