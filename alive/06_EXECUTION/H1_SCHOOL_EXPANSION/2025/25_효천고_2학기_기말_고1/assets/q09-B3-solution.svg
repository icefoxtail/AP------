<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img">
<rect width="960" height="100%" fill="#fafbff"/>
<rect x="27" y="24" width="906" height="96" rx="18" fill="#173250"/>
<text x="53" y="63" font-family="NanumSquare,Arial,sans-serif" font-weight="bold" font-size="27" fill="white">03 · 음의 정수도 검산</text>
<text x="53" y="95" font-family="NanumSquare,Arial,sans-serif" font-size="19" fill="#d7eaf6">함수식으로 전환한 뒤 네 값 합산</text>
<rect x="35" y="140" width="890" height="88" rx="12" fill="white" stroke="#ccd8e4"/>
<text x="54" y="171" font-family="NanumSquare,Arial,sans-serif" font-weight="bold" font-size="20" fill="#243b53">① 곱항 제거</text>
<text x="54" y="207" font-family="DejaVu Sans,NanumSquare,Arial,sans-serif" font-size="23" fill="#23354d">g(n) = f(n) - n²</text>
<text x="900" y="207" font-family="NanumSquare,Arial,sans-serif" text-anchor="end" font-weight="bold" font-size="23" fill="#006d67">g(n) = 2n</text>
<rect x="35" y="242" width="890" height="88" rx="12" fill="white" stroke="#ccd8e4"/>
<text x="54" y="273" font-family="NanumSquare,Arial,sans-serif" font-weight="bold" font-size="20" fill="#243b53">② 최종 함수식</text>
<text x="54" y="309" font-family="DejaVu Sans,NanumSquare,Arial,sans-serif" font-size="23" fill="#23354d">f(n) = n² + 2n</text>
<text x="900" y="309" font-family="NanumSquare,Arial,sans-serif" text-anchor="end" font-weight="bold" font-size="23" fill="#006d67">모든 정수에 적용</text>
<rect x="35" y="344" width="890" height="88" rx="12" fill="white" stroke="#ccd8e4"/>
<text x="54" y="375" font-family="NanumSquare,Arial,sans-serif" font-weight="bold" font-size="20" fill="#243b53">③ 네 값</text>
<text x="54" y="411" font-family="DejaVu Sans,NanumSquare,Arial,sans-serif" font-size="23" fill="#23354d">f(-3)=3, f(-1)=-1</text>
<text x="900" y="411" font-family="NanumSquare,Arial,sans-serif" text-anchor="end" font-weight="bold" font-size="23" fill="#006d67">f(2)=8, f(4)=24</text>
<rect x="35" y="446" width="890" height="88" rx="12" fill="white" stroke="#ccd8e4"/>
<text x="54" y="477" font-family="NanumSquare,Arial,sans-serif" font-weight="bold" font-size="20" fill="#243b53">④ 합산</text>
<text x="54" y="513" font-family="DejaVu Sans,NanumSquare,Arial,sans-serif" font-size="23" fill="#23354d">3 - 1 + 8 + 24</text>
<text x="900" y="513" font-family="NanumSquare,Arial,sans-serif" text-anchor="end" font-weight="bold" font-size="23" fill="#006d67">정답 34</text>
</svg>