<svg xmlns="http://www.w3.org/2000/svg" width="960" height="396" viewBox="0 0 960 396" role="img">
<rect width="960" height="100%" fill="#fafbff"/>
<rect x="27" y="24" width="906" height="96" rx="18" fill="#173250"/>
<text x="53" y="63" font-family="NanumSquare,Arial,sans-serif" font-weight="bold" font-size="27" fill="white">02 · 음수에서 양수로</text>
<text x="53" y="95" font-family="NanumSquare,Arial,sans-serif" font-size="19" fill="#d7eaf6">부호가 달라지는 두 곱항 구별</text>
<rect x="35" y="140" width="890" height="88" rx="12" fill="white" stroke="#ccd8e4"/>
<text x="54" y="171" font-family="NanumSquare,Arial,sans-serif" font-weight="bold" font-size="20" fill="#243b53">① 0 = 2 + (-2)</text>
<text x="54" y="207" font-family="DejaVu Sans,NanumSquare,Arial,sans-serif" font-size="23" fill="#23354d">0 = f(2) + 1 - 8</text>
<text x="900" y="207" font-family="NanumSquare,Arial,sans-serif" text-anchor="end" font-weight="bold" font-size="23" fill="#006d67">f(2) = 7</text>
<rect x="35" y="242" width="890" height="88" rx="12" fill="white" stroke="#ccd8e4"/>
<text x="54" y="273" font-family="NanumSquare,Arial,sans-serif" font-weight="bold" font-size="20" fill="#243b53">② 4 = 2 + 2</text>
<text x="54" y="309" font-family="DejaVu Sans,NanumSquare,Arial,sans-serif" font-size="23" fill="#23354d">f(4) = 2×7 + 8</text>
<text x="900" y="309" font-family="NanumSquare,Arial,sans-serif" text-anchor="end" font-weight="bold" font-size="23" fill="#006d67">정답 22</text>
<desc>두 입력값을 관계식에 대입해 곱항의 부호를 비교하고 대칭 입력에서 얻은 함수값을 합산한다.</desc>
</svg>
