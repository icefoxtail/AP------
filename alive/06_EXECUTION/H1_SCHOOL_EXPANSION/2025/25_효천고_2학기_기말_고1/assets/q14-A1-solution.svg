<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="640px" version="1.1" viewBox="0 0 1040 640" width="1040px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><title>효천고 q14 A1 해설 도형</title><desc>간단한 구간 세 개라도 충분·필요·동치의 방향을 번갈아 판정해야 하므로 1단계보다 2단계가 타당하다. 포함관계 카드가 방향 착각을 줄인다.</desc><defs /><rect fill="#F7FAFD" height="640" width="1040" x="0" y="0" /><rect fill="#087F8C" height="9" width="1040" x="0" y="0" /><text fill="#63758B" font-family="NanumSquare, Noto Sans CJK KR, sans-serif" font-size="17" font-weight="600" text-anchor="start" x="48" y="62">QID9  ·  14번 해설</text><text fill="#16263E" font-family="NanumSquare, Noto Sans CJK KR, sans-serif" font-size="36" font-weight="700" text-anchor="start" x="48" y="113">세 조건의 함의 방향</text><text fill="#63758B" font-family="NanumSquare, Noto Sans CJK KR, sans-serif" font-size="18" font-weight="500" text-anchor="start" x="48" y="149">필요·충분조건의 관계</text><rect fill="#FFFFFF" height="94" rx="16" ry="16" stroke="#DCE6F0" stroke-width="1.3" width="944" x="48" y="214" /><text fill="#16263E" font-family="NanumSquare, Noto Sans CJK KR, sans-serif" font-size="25" font-weight="600" text-anchor="start" x="80" y="270">p₁ : x &gt; 5</text><text fill="#007F74" font-family="NanumSquare, Noto Sans CJK KR, sans-serif" font-size="25" font-weight="700" text-anchor="start" x="405" y="271">p₁ → q</text><text fill="#63758B" font-family="NanumSquare, Noto Sans CJK KR, sans-serif" font-size="18" font-weight="500" text-anchor="start" x="694" y="262">충분조건만</text><text fill="#007F74" font-family="NanumSquare, Noto Sans CJK KR, sans-serif" font-size="35" font-weight="700" text-anchor="start" x="875" y="274">0</text><rect fill="#FFFFFF" height="94" rx="16" ry="16" stroke="#DCE6F0" stroke-width="1.3" width="944" x="48" y="325" /><text fill="#16263E" font-family="NanumSquare, Noto Sans CJK KR, sans-serif" font-size="25" font-weight="600" text-anchor="start" x="80" y="381">p₂ : x &gt; 1</text><text fill="#D98A12" font-family="NanumSquare, Noto Sans CJK KR, sans-serif" font-size="25" font-weight="700" text-anchor="start" x="405" y="382">q → p₂</text><text fill="#63758B" font-family="NanumSquare, Noto Sans CJK KR, sans-serif" font-size="18" font-weight="500" text-anchor="start" x="694" y="373">필요조건만</text><text fill="#D98A12" font-family="NanumSquare, Noto Sans CJK KR, sans-serif" font-size="35" font-weight="700" text-anchor="start" x="875" y="385">1</text><rect fill="#FFFFFF" height="94" rx="16" ry="16" stroke="#DCE6F0" stroke-width="1.3" width="944" x="48" y="436" /><text fill="#16263E" font-family="NanumSquare, Noto Sans CJK KR, sans-serif" font-size="25" font-weight="600" text-anchor="start" x="80" y="492">p₃ : x &gt; 3</text><text fill="#087F8C" font-family="NanumSquare, Noto Sans CJK KR, sans-serif" font-size="25" font-weight="700" text-anchor="start" x="405" y="493">p₃ ⇔ q</text><text fill="#63758B" font-family="NanumSquare, Noto Sans CJK KR, sans-serif" font-size="18" font-weight="500" text-anchor="start" x="694" y="484">필요충분조건</text><text fill="#087F8C" font-family="NanumSquare, Noto Sans CJK KR, sans-serif" font-size="35" font-weight="700" text-anchor="start" x="875" y="496">3</text><line stroke="#DCE6F0" stroke-linecap="round" stroke-width="1.5" x1="48" x2="992" y1="585" y2="585" /><text fill="#63758B" font-family="NanumSquare, Noto Sans CJK KR, sans-serif" font-size="17" font-weight="500" text-anchor="start" x="48" y="614">포함 방향을 반대로 읽지 않는다: N의 합 = 0 + 1 + 3 = 4</text></svg>