<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="640px" version="1.1" viewBox="0 0 1040 640" width="1040px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><title>효천고 q14 B1 해설 도형</title><desc>6·24·4·12의 배수 포함관계 네 개를 차례로 계산한다. 별도 복합 정리는 없다. 배수 집합의 화살표 관계를 도식화한다.</desc><defs /><rect fill="#F7FAFD" height="640" width="1040" x="0" y="0" /><rect fill="#087F8C" height="9" width="1040" x="0" y="0" /><text fill="#63758B" font-family="NanumSquare, Noto Sans CJK KR, sans-serif" font-size="17" font-weight="600" text-anchor="start" x="48" y="62">QID9  ·  14번 해설</text><text fill="#16263E" font-family="NanumSquare, Noto Sans CJK KR, sans-serif" font-size="36" font-weight="700" text-anchor="start" x="48" y="113">배수 관계로 네 조건 분류</text><text fill="#63758B" font-family="NanumSquare, Noto Sans CJK KR, sans-serif" font-size="18" font-weight="500" text-anchor="start" x="48" y="149">필요·충분조건의 관계</text><rect fill="#FFFFFF" height="144" rx="16" ry="16" stroke="#DCE6F0" stroke-width="1.3" width="464" x="48" y="204" /><text fill="#16263E" font-family="NanumSquare, Noto Sans CJK KR, sans-serif" font-size="25" font-weight="700" text-anchor="start" x="76" y="247">24의 배수</text><text fill="#007F74" font-family="NanumSquare, Noto Sans CJK KR, sans-serif" font-size="20" font-weight="600" text-anchor="start" x="76" y="287">p₂ → q</text><text fill="#007F74" font-family="NanumSquare, Noto Sans CJK KR, sans-serif" font-size="22" font-weight="700" text-anchor="start" x="76" y="327">N = 0</text><rect fill="#FFFFFF" height="144" rx="16" ry="16" stroke="#DCE6F0" stroke-width="1.3" width="464" x="530" y="204" /><text fill="#16263E" font-family="NanumSquare, Noto Sans CJK KR, sans-serif" font-size="25" font-weight="700" text-anchor="start" x="558" y="247">12의 배수</text><text fill="#087F8C" font-family="NanumSquare, Noto Sans CJK KR, sans-serif" font-size="20" font-weight="600" text-anchor="start" x="558" y="287">q, p₄ 동일</text><text fill="#087F8C" font-family="NanumSquare, Noto Sans CJK KR, sans-serif" font-size="22" font-weight="700" text-anchor="start" x="558" y="327">N = 3</text><rect fill="#FFFFFF" height="144" rx="16" ry="16" stroke="#DCE6F0" stroke-width="1.3" width="464" x="48" y="371" /><text fill="#16263E" font-family="NanumSquare, Noto Sans CJK KR, sans-serif" font-size="25" font-weight="700" text-anchor="start" x="76" y="414">6의 배수</text><text fill="#D98A12" font-family="NanumSquare, Noto Sans CJK KR, sans-serif" font-size="20" font-weight="600" text-anchor="start" x="76" y="454">q → p₁</text><text fill="#D98A12" font-family="NanumSquare, Noto Sans CJK KR, sans-serif" font-size="22" font-weight="700" text-anchor="start" x="76" y="494">N = 1</text><rect fill="#FFFFFF" height="144" rx="16" ry="16" stroke="#DCE6F0" stroke-width="1.3" width="464" x="530" y="371" /><text fill="#16263E" font-family="NanumSquare, Noto Sans CJK KR, sans-serif" font-size="25" font-weight="700" text-anchor="start" x="558" y="414">4의 배수</text><text fill="#D98A12" font-family="NanumSquare, Noto Sans CJK KR, sans-serif" font-size="20" font-weight="600" text-anchor="start" x="558" y="454">q → p₃</text><text fill="#D98A12" font-family="NanumSquare, Noto Sans CJK KR, sans-serif" font-size="22" font-weight="700" text-anchor="start" x="558" y="494">N = 1</text><line stroke="#DCE6F0" stroke-linecap="round" stroke-width="1.5" x1="48" x2="992" y1="585" y2="585" /><text fill="#63758B" font-family="NanumSquare, Noto Sans CJK KR, sans-serif" font-size="17" font-weight="500" text-anchor="start" x="48" y="614">24의 배수 ⊂ 12의 배수 ⊂ 6의 배수  /  12의 배수 ⊂ 4의 배수</text></svg>