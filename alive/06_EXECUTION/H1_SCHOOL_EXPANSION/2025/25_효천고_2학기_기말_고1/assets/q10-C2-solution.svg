<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="578" viewBox="0 0 1020 578" role="img">
<rect width="1020" height="578" fill="#f7faff"/>
<rect x="20" y="20" width="980" height="98" rx="16" fill="#153755"/>
<text x="44" y="61" font-family="NanumSquare,Noto Sans CJK KR,DejaVu Sans,sans-serif" font-weight="bold" font-size="29" fill="white">주기 3과 주기 4 동시 조건</text>
<text x="44" y="94" font-family="NanumSquare,Noto Sans CJK KR,DejaVu Sans,sans-serif" font-size="19" fill="#e7f2ff">두 나머지 조건은 주기 12로 되풀이</text>
<rect x="26" y="134" width="968" height="88" rx="13" fill="#fff" stroke="#b6c8db"/>
<text x="42" y="160" font-family="NanumSquare,Noto Sans CJK KR,DejaVu Sans,sans-serif" font-weight="bold" font-size="20" fill="#213e57">1에서 시작</text>
<text x="42" y="195" font-family="NanumSquare,Noto Sans CJK KR,DejaVu Sans,sans-serif" font-size="22" fill="#1b2b45">1 → 2 → 3 → 1</text>
<text x="980" y="195" text-anchor="end" font-family="NanumSquare,Noto Sans CJK KR,DejaVu Sans,sans-serif" font-weight="bold" font-size="18" fill="#005f58">n ≡ 1 (mod 3)</text>
<rect x="26" y="236" width="968" height="88" rx="13" fill="#fff" stroke="#b6c8db"/>
<text x="42" y="262" font-family="NanumSquare,Noto Sans CJK KR,DejaVu Sans,sans-serif" font-weight="bold" font-size="20" fill="#213e57">4에서 시작</text>
<text x="42" y="297" font-family="NanumSquare,Noto Sans CJK KR,DejaVu Sans,sans-serif" font-size="22" fill="#1b2b45">4 → 5 → 6 → 7 → 4</text>
<text x="980" y="297" text-anchor="end" font-family="NanumSquare,Noto Sans CJK KR,DejaVu Sans,sans-serif" font-weight="bold" font-size="18" fill="#005f58">n ≡ 2 (mod 4)</text>
<rect x="26" y="338" width="968" height="88" rx="13" fill="#fff" stroke="#b6c8db"/>
<text x="42" y="364" font-family="NanumSquare,Noto Sans CJK KR,DejaVu Sans,sans-serif" font-weight="bold" font-size="20" fill="#213e57">공통 지수</text>
<text x="42" y="399" font-family="NanumSquare,Noto Sans CJK KR,DejaVu Sans,sans-serif" font-size="22" fill="#1b2b45">n = 10, 22, 34, …, 190</text>
<text x="980" y="399" text-anchor="end" font-family="NanumSquare,Noto Sans CJK KR,DejaVu Sans,sans-serif" font-weight="bold" font-size="18" fill="#005f58">간격 12</text>
<rect x="26" y="440" width="968" height="88" rx="13" fill="#fff" stroke="#b6c8db"/>
<text x="42" y="466" font-family="NanumSquare,Noto Sans CJK KR,DejaVu Sans,sans-serif" font-weight="bold" font-size="20" fill="#213e57">최종 개수</text>
<text x="42" y="501" font-family="NanumSquare,Noto Sans CJK KR,DejaVu Sans,sans-serif" font-size="22" fill="#1b2b45">10 + 12k ≤ 200</text>
<text x="980" y="501" text-anchor="end" font-family="NanumSquare,Noto Sans CJK KR,DejaVu Sans,sans-serif" font-weight="bold" font-size="18" fill="#005f58">k = 0,…,15 → 16개</text>
</svg>