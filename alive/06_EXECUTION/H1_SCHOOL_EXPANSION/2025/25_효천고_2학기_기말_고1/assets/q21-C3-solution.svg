<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-label="C3 | 열린 구간의 접점과 겹침"><title>C3 | 열린 구간의 접점과 겹침</title><desc>a가 마이너스 3 또는 5면 열린 구간은 접점만 공유하므로 겹치지 않는다. a가 4면 공통 구간이 존재한다.</desc><style>text{font-family:NanumSquare,'UnDotum',sans-serif;fill:#193248;font-size:17px}.small{font-size:15px;fill:#435971}.axis{stroke:#8297aa;stroke-width:2}.line{stroke:#2176c2;stroke-width:5;stroke-linecap:round}.focus{stroke:#ef8b36;stroke-width:5;stroke-linecap:round}.guide{stroke:#97a9ba;stroke-width:1.5;stroke-dasharray:6 6}.dot{fill:#2176c2}.open{fill:white;stroke:#ef8b36;stroke-width:3}.panel{fill:#f5f9fe;stroke:#dfebf5;stroke-width:1.5}.pill{fill:#e5f0fc}</style><rect width="960" height="480" fill="white"/><text x="40" y="43" font-size="24" font-weight="700">C3 | 열린 구간의 접점과 겹침</text><line x1="40" y1="64" x2="920" y2="64" stroke="#dce7f2" stroke-width="2"/><rect class="panel" x="55" y="86" width="850" height="329" rx="15"/><text x="78" y="154" class="">a = -3</text><line x1="155" y1="154" x2="831" y2="154" class="axis"/><line x1="415" y1="138" x2="623" y2="138" stroke="#2176c2" stroke-width="5" stroke-linecap="round"/><circle cx="415" cy="138" r="6" fill="white" stroke="#2176c2" stroke-width="3"/><circle cx="623" cy="138" r="6" fill="white" stroke="#2176c2" stroke-width="3"/><line x1="207" y1="170" x2="415" y2="170" stroke="#ef8b36" stroke-width="5" stroke-linecap="round"/><circle cx="207" cy="170" r="6" fill="white" stroke="#ef8b36" stroke-width="3"/><circle cx="415" cy="170" r="6" fill="white" stroke="#ef8b36" stroke-width="3"/><text x="756" y="120" class="small">왼쪽에서 접함</text><text x="78" y="252" class="">a = 5</text><line x1="155" y1="252" x2="831" y2="252" class="axis"/><line x1="415" y1="236" x2="623" y2="236" stroke="#2176c2" stroke-width="5" stroke-linecap="round"/><circle cx="415" cy="236" r="6" fill="white" stroke="#2176c2" stroke-width="3"/><circle cx="623" cy="236" r="6" fill="white" stroke="#2176c2" stroke-width="3"/><line x1="623" y1="268" x2="831" y2="268" stroke="#ef8b36" stroke-width="5" stroke-linecap="round"/><circle cx="623" cy="268" r="6" fill="white" stroke="#ef8b36" stroke-width="3"/><circle cx="831" cy="268" r="6" fill="white" stroke="#ef8b36" stroke-width="3"/><text x="756" y="218" class="small">오른쪽에서 접함</text><text x="78" y="350" class="">a = 4</text><line x1="155" y1="350" x2="831" y2="350" class="axis"/><line x1="415" y1="334" x2="623" y2="334" stroke="#2176c2" stroke-width="5" stroke-linecap="round"/><circle cx="415" cy="334" r="6" fill="white" stroke="#2176c2" stroke-width="3"/><circle cx="623" cy="334" r="6" fill="white" stroke="#2176c2" stroke-width="3"/><line x1="571" y1="366" x2="779" y2="366" stroke="#ef8b36" stroke-width="5" stroke-linecap="round"/><circle cx="571" cy="366" r="6" fill="white" stroke="#ef8b36" stroke-width="3"/><circle cx="779" cy="366" r="6" fill="white" stroke="#ef8b36" stroke-width="3"/><text x="756" y="316" class="small">서로 겹침</text><text x="480" y="451" class="" text-anchor="middle">파랑: (-1,3)  /  주황: (a-2,a+2)  /  빈 원: 끝점 제외</text></svg>