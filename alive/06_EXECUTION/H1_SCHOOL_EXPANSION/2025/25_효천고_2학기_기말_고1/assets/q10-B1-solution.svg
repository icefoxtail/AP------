<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="476" viewBox="0 0 1020 476" role="img">
<rect width="1020" height="476" fill="#f7faff"/>
<rect x="20" y="20" width="980" height="98" rx="16" fill="#153755"/>
<text x="44" y="61" font-family="NanumSquare,Noto Sans CJK KR,DejaVu Sans,sans-serif" font-weight="bold" font-size="29" fill="white">고리 밖에서 시작한 경우</text>
<text x="44" y="94" font-family="NanumSquare,Noto Sans CJK KR,DejaVu Sans,sans-serif" font-size="19" fill="#e7f2ff">첫 한 칸 뒤에 주기 3으로 들어간다</text>
<rect x="26" y="134" width="968" height="88" rx="13" fill="#fff" stroke="#b6c8db"/>
<text x="42" y="160" font-family="NanumSquare,Noto Sans CJK KR,DejaVu Sans,sans-serif" font-weight="bold" font-size="20" fill="#213e57">시작</text>
<text x="42" y="195" font-family="NanumSquare,Noto Sans CJK KR,DejaVu Sans,sans-serif" font-size="22" fill="#1b2b45">1 → 2</text>
<text x="980" y="195" text-anchor="end" font-family="NanumSquare,Noto Sans CJK KR,DejaVu Sans,sans-serif" font-weight="bold" font-size="18" fill="#005f58">첫 적용, 2026 중 1회 사용</text>
<rect x="26" y="236" width="968" height="88" rx="13" fill="#fff" stroke="#b6c8db"/>
<text x="42" y="262" font-family="NanumSquare,Noto Sans CJK KR,DejaVu Sans,sans-serif" font-weight="bold" font-size="20" fill="#213e57">반복 고리</text>
<text x="42" y="297" font-family="NanumSquare,Noto Sans CJK KR,DejaVu Sans,sans-serif" font-size="22" fill="#1b2b45">2 → 3 → 4 → 2</text>
<text x="980" y="297" text-anchor="end" font-family="NanumSquare,Noto Sans CJK KR,DejaVu Sans,sans-serif" font-weight="bold" font-size="18" fill="#005f58">한 바퀴 = 3회</text>
<rect x="26" y="338" width="968" height="88" rx="13" fill="#fff" stroke="#b6c8db"/>
<text x="42" y="364" font-family="NanumSquare,Noto Sans CJK KR,DejaVu Sans,sans-serif" font-weight="bold" font-size="20" fill="#213e57">남은 횟수</text>
<text x="42" y="399" font-family="NanumSquare,Noto Sans CJK KR,DejaVu Sans,sans-serif" font-size="22" fill="#1b2b45">2026 − 1 = 2025 = 3 × 675</text>
<text x="980" y="399" text-anchor="end" font-family="NanumSquare,Noto Sans CJK KR,DejaVu Sans,sans-serif" font-weight="bold" font-size="18" fill="#005f58">정답 2</text>
<desc>함수값 1에서 한 번 적용하면 2가 되고, 이후 2→3→4→2가 세 단계 주기로 반복된다.</desc>
</svg>
