<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img">
<rect width="960" height="100%" fill="#fafbff"/>
<rect x="27" y="24" width="906" height="96" rx="18" fill="#173250"/>
<text x="53" y="63" font-family="NanumSquare,Arial,sans-serif" font-weight="bold" font-size="27" fill="white">05 · 대칭의 차</text>
<text x="53" y="95" font-family="NanumSquare,Arial,sans-serif" font-size="19" fill="#d7eaf6">합이 아니라 차이므로 선형항이 남는다</text>
<rect x="35" y="140" width="890" height="88" rx="12" fill="white" stroke="#ccd8e4"/>
<text x="54" y="171" font-family="NanumSquare,Arial,sans-serif" font-weight="bold" font-size="20" fill="#243b53">① 기본값</text>
<text x="54" y="207" font-family="DejaVu Sans,NanumSquare,Arial,sans-serif" font-size="23" fill="#23354d">2t + k = 13</text>
<text x="900" y="207" font-family="NanumSquare,Arial,sans-serif" text-anchor="end" font-weight="bold" font-size="23" fill="#006d67">t = f(1)</text>
<rect x="35" y="242" width="890" height="88" rx="12" fill="white" stroke="#ccd8e4"/>
<text x="54" y="273" font-family="NanumSquare,Arial,sans-serif" font-weight="bold" font-size="20" fill="#243b53">② 차이 유도</text>
<text x="54" y="309" font-family="DejaVu Sans,NanumSquare,Arial,sans-serif" font-size="23" fill="#23354d">f(3)-f(-3) = 6t-3k</text>
<text x="900" y="309" font-family="NanumSquare,Arial,sans-serif" text-anchor="end" font-weight="bold" font-size="23" fill="#006d67">6t - 3k = 9</text>
<rect x="35" y="344" width="890" height="88" rx="12" fill="white" stroke="#ccd8e4"/>
<text x="54" y="375" font-family="NanumSquare,Arial,sans-serif" font-weight="bold" font-size="20" fill="#243b53">③ 연립 소거</text>
<text x="54" y="411" font-family="DejaVu Sans,NanumSquare,Arial,sans-serif" font-size="23" fill="#23354d">6t+3k=39</text>
<text x="900" y="411" font-family="NanumSquare,Arial,sans-serif" text-anchor="end" font-weight="bold" font-size="23" fill="#006d67">k=5, t=4</text>
<rect x="35" y="446" width="890" height="88" rx="12" fill="white" stroke="#ccd8e4"/>
<text x="54" y="477" font-family="NanumSquare,Arial,sans-serif" font-weight="bold" font-size="20" fill="#243b53">④ 네 번째 값</text>
<text x="54" y="513" font-family="DejaVu Sans,NanumSquare,Arial,sans-serif" font-size="23" fill="#23354d">f(4)=4t+6k</text>
<text x="900" y="513" font-family="NanumSquare,Arial,sans-serif" text-anchor="end" font-weight="bold" font-size="23" fill="#006d67">정답 46</text>
<desc>대칭 입력에서 함수값의 차를 이용해 선형항과 미지 계수를 구하고 마지막 함수값의 합을 계산한다.</desc>
</svg>
