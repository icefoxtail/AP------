<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="680" viewBox="0 0 1020 680" role="img">
<rect width="1020" height="680" fill="#f7faff"/>
<rect x="20" y="20" width="980" height="98" rx="16" fill="#153755"/>
<text x="44" y="61" font-family="NanumSquare,Noto Sans CJK KR,DejaVu Sans,sans-serif" font-weight="bold" font-size="29" fill="white">순환고리와 유입 경로 구분</text>
<text x="44" y="94" font-family="NanumSquare,Noto Sans CJK KR,DejaVu Sans,sans-serif" font-size="19" fill="#e7f2ff">지수 차이가 3 → 주기 1 또는 3에 들어가야 함</text>
<rect x="26" y="134" width="968" height="88" rx="13" fill="#fff" stroke="#b6c8db"/>
<text x="42" y="160" font-family="NanumSquare,Noto Sans CJK KR,DejaVu Sans,sans-serif" font-weight="bold" font-size="20" fill="#213e57">주기 3</text>
<text x="42" y="195" font-family="NanumSquare,Noto Sans CJK KR,DejaVu Sans,sans-serif" font-size="22" fill="#1b2b45">1 → 2 → 3 → 1</text>
<text x="980" y="195" text-anchor="end" font-family="NanumSquare,Noto Sans CJK KR,DejaVu Sans,sans-serif" font-weight="bold" font-size="18" fill="#005f58">1, 2, 3 포함</text>
<rect x="26" y="236" width="968" height="88" rx="13" fill="#fff" stroke="#b6c8db"/>
<text x="42" y="262" font-family="NanumSquare,Noto Sans CJK KR,DejaVu Sans,sans-serif" font-weight="bold" font-size="20" fill="#213e57">고정점</text>
<text x="42" y="297" font-family="NanumSquare,Noto Sans CJK KR,DejaVu Sans,sans-serif" font-size="22" fill="#1b2b45">6 → 6</text>
<text x="980" y="297" text-anchor="end" font-family="NanumSquare,Noto Sans CJK KR,DejaVu Sans,sans-serif" font-weight="bold" font-size="18" fill="#005f58">6 포함</text>
<rect x="26" y="338" width="968" height="88" rx="13" fill="#fff" stroke="#b6c8db"/>
<text x="42" y="364" font-family="NanumSquare,Noto Sans CJK KR,DejaVu Sans,sans-serif" font-weight="bold" font-size="20" fill="#213e57">3주기로 유입</text>
<text x="42" y="399" font-family="NanumSquare,Noto Sans CJK KR,DejaVu Sans,sans-serif" font-size="22" fill="#1b2b45">7 → 1 / 8 → 7 → 1</text>
<text x="980" y="399" text-anchor="end" font-family="NanumSquare,Noto Sans CJK KR,DejaVu Sans,sans-serif" font-weight="bold" font-size="18" fill="#005f58">7, 8 포함</text>
<rect x="26" y="440" width="968" height="88" rx="13" fill="#fff" stroke="#b6c8db"/>
<text x="42" y="466" font-family="NanumSquare,Noto Sans CJK KR,DejaVu Sans,sans-serif" font-weight="bold" font-size="20" fill="#213e57">2주기 및 유입</text>
<text x="42" y="501" font-family="NanumSquare,Noto Sans CJK KR,DejaVu Sans,sans-serif" font-size="22" fill="#1b2b45">4 ↔ 5 / 9 → 5</text>
<text x="980" y="501" text-anchor="end" font-family="NanumSquare,Noto Sans CJK KR,DejaVu Sans,sans-serif" font-weight="bold" font-size="18" fill="#005f58">4, 5, 9 제외</text>
<rect x="26" y="542" width="968" height="88" rx="13" fill="#fff" stroke="#b6c8db"/>
<text x="42" y="568" font-family="NanumSquare,Noto Sans CJK KR,DejaVu Sans,sans-serif" font-weight="bold" font-size="20" fill="#213e57">선택 집합</text>
<text x="42" y="603" font-family="NanumSquare,Noto Sans CJK KR,DejaVu Sans,sans-serif" font-size="22" fill="#1b2b45">{1, 2, 3, 6, 7, 8}</text>
<text x="980" y="603" text-anchor="end" font-family="NanumSquare,Noto Sans CJK KR,DejaVu Sans,sans-serif" font-weight="bold" font-size="18" fill="#005f58">정답 6개</text>
</svg>