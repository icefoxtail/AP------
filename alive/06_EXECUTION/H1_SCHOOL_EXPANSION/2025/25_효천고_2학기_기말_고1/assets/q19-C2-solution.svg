<svg xmlns="http://www.w3.org/2000/svg" width="900" height="450" viewBox="0 0 900 450" role="img" aria-label="C2 세 함수의 중첩 합성 역추적과 입력 제한; f^-1ogof에서 바깥의 역함수를 제거하고 안쪽 식을 대입한 뒤 양의 입력만 선택"><title>세 함수의 중첩 합성 역추적과 입력 제한</title><desc>C2 세 함수의 중첩 합성 역추적과 입력 제한; f^-1ogof에서 바깥의 역함수를 제거하고 안쪽 식을 대입한 뒤 양의 입력만 선택</desc><rect x="20" y="14" width="860" height="415" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4" /><text x="450" y="54" fill="#17365d" text-anchor="middle" font-family="NanumSquare, Noto Serif CJK KR, sans-serif" font-weight="700" font-size="23">C2  |  세 함수의 중첩 합성 역추적과 입력 제한</text><line x1="50" y1="69" x2="850" y2="69" stroke="#e2e8f0" stroke-width="2"/><text x="72" y="113" fill="#1e293b" text-anchor="start" font-family="NanumSquare, Noto Serif CJK KR, sans-serif" font-weight="700" font-size="18">바깥 역함수부터 거꾸로 제거</text><rect x="64" y="150" width="255" height="75" rx="12" fill="#f5f8fc" stroke="#d0dbe6" stroke-width="1.4" />
<text x="191.5" y="177" fill="#17447b" text-anchor="middle" font-family="NanumSquare, Noto Serif CJK KR, sans-serif" font-weight="700" font-size="17">최종 결과</text>
<text x="191.5" y="206" fill="#1e293b" text-anchor="middle" font-family="NanumSquare, Noto Serif CJK KR, sans-serif" font-weight="400" font-size="17">f^(-1)(g(f(a))) = 4</text><line x1="327" y1="188" x2="412" y2="188" stroke="#496787" stroke-width="2"/>
<polygon points="412,188 402,183 402,193" fill="#496787"/><rect x="425" y="150" width="370" height="75" rx="12" fill="#f5f8fc" stroke="#d0dbe6" stroke-width="1.4" />
<text x="610.0" y="177" fill="#17447b" text-anchor="middle" font-family="NanumSquare, Noto Serif CJK KR, sans-serif" font-weight="700" font-size="17">양변에 f 적용</text>
<text x="610.0" y="206" fill="#1e293b" text-anchor="middle" font-family="NanumSquare, Noto Serif CJK KR, sans-serif" font-weight="400" font-size="17">g(f(a)) = 9</text><rect x="64" y="265" width="350" height="75" rx="12" fill="#f5f8fc" stroke="#d0dbe6" stroke-width="1.4" />
<text x="239.0" y="292" fill="#17447b" text-anchor="middle" font-family="NanumSquare, Noto Serif CJK KR, sans-serif" font-weight="700" font-size="17">안쪽 함수 대입</text>
<text x="239.0" y="321" fill="#1e293b" text-anchor="middle" font-family="NanumSquare, Noto Serif CJK KR, sans-serif" font-weight="400" font-size="17">(2a - 2)^2 + 2 = 9</text><line x1="425" y1="301" x2="483" y2="301" stroke="#496787" stroke-width="2"/>
<polygon points="483,301 473,296 473,306" fill="#496787"/><rect x="493" y="265" width="302" height="75" rx="12" fill="#f5f8fc" stroke="#d0dbe6" stroke-width="1.4" />
<text x="644.0" y="292" fill="#17447b" text-anchor="middle" font-family="NanumSquare, Noto Serif CJK KR, sans-serif" font-weight="700" font-size="17">두 해 중 제한 적용</text>
<text x="644.0" y="321" fill="#1e293b" text-anchor="middle" font-family="NanumSquare, Noto Serif CJK KR, sans-serif" font-weight="400" font-size="17">a >= 0 → + 부호 선택</text><text x="450" y="414" fill="#1d4ed8" text-anchor="middle" font-family="NanumSquare, Noto Serif CJK KR, sans-serif" font-weight="700" font-size="23">a = 1 + √7 / 2</text></svg>