<svg xmlns="http://www.w3.org/2000/svg" width="960" height="498" viewBox="0 0 960 498" role="img">
<rect width="960" height="100%" fill="#fafbff"/>
<rect x="27" y="24" width="906" height="96" rx="18" fill="#173250"/>
<text x="53" y="63" font-family="NanumSquare,Arial,sans-serif" font-weight="bold" font-size="27" fill="white">01 · 주어진 값에서 다시 출발</text>
<text x="53" y="95" font-family="NanumSquare,Arial,sans-serif" font-size="19" fill="#d7eaf6">두 분할을 연결하여 f(1)과 f(4)를 찾기</text>
<rect x="35" y="140" width="890" height="88" rx="12" fill="white" stroke="#ccd8e4"/>
<text x="54" y="171" font-family="NanumSquare,Arial,sans-serif" font-weight="bold" font-size="20" fill="#243b53">① 2 = 1 + 1</text>
<text x="54" y="207" font-family="DejaVu Sans,NanumSquare,Arial,sans-serif" font-size="23" fill="#23354d">9 = 2 f(1) + 3</text>
<text x="900" y="207" font-family="NanumSquare,Arial,sans-serif" text-anchor="end" font-weight="bold" font-size="23" fill="#006d67">f(1) = 3</text>
<rect x="35" y="242" width="890" height="88" rx="12" fill="white" stroke="#ccd8e4"/>
<text x="54" y="273" font-family="NanumSquare,Arial,sans-serif" font-weight="bold" font-size="20" fill="#243b53">② 4 = 2 + 2</text>
<text x="54" y="309" font-family="DejaVu Sans,NanumSquare,Arial,sans-serif" font-size="23" fill="#23354d">f(4) = 2×9 + 3×4</text>
<text x="900" y="309" font-family="NanumSquare,Arial,sans-serif" text-anchor="end" font-weight="bold" font-size="23" fill="#006d67">f(4) = 30</text>
<rect x="35" y="344" width="890" height="88" rx="12" fill="white" stroke="#ccd8e4"/>
<text x="54" y="375" font-family="NanumSquare,Arial,sans-serif" font-weight="bold" font-size="20" fill="#243b53">③ 발문의 최종값</text>
<text x="54" y="411" font-family="DejaVu Sans,NanumSquare,Arial,sans-serif" font-size="23" fill="#23354d">f(1) + f(4) = 3 + 30</text>
<text x="900" y="411" font-family="NanumSquare,Arial,sans-serif" text-anchor="end" font-weight="bold" font-size="23" fill="#006d67">정답 33</text>
<desc>f(a+b)=f(a)+f(b)+3ab의 관계에 두 분할 2=1+1과 4=2+2를 대입해 f(1), f(4)를 구하고 두 함수값의 합을 계산한다.</desc>
</svg>
