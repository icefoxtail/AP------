<svg xmlns="http://www.w3.org/2000/svg" width="720" height="286" viewBox="0 0 720 286" role="img" aria-label="귀류법: 제곱수의 나머지 조건과 실제 차의 나머지 비교"><title>C2 귀류법 나머지 충돌</title><desc>두 수를 모두 제곱수라고 가정할 때 제곱수 차의 가능한 나머지와 주어진 두 수의 차로부터 나오는 불가능한 나머지를 대조한다.</desc><rect x="0" y="0" width="720" height="286" fill="#FFFFFF"/><rect x="20" y="21" width="680" height="244" rx="14" fill="#FAFCFE" stroke="#B8C8D5" stroke-width="2"/><text x="35" y="55" font-family="NanumSquare,sans-serif" font-size="20" font-weight="bold" fill="#22354E">모두 제곱수라고 가정 → 나머지 비교</text><rect x="35" y="77" width="296" height="118" rx="10" fill="#E9F3FF" stroke="#4F7BA9"/><rect x="389" y="77" width="296" height="118" rx="10" fill="#FFF2E9" stroke="#B36F45"/><text x="53" y="107" font-family="NanumSquare,sans-serif" font-size="17" font-weight="bold" fill="#255A84">제곱수의 성질</text><text x="53" y="135" font-family="NanumSquare,sans-serif" font-size="15" fill="#263C50">두 수 모두 홀수 제곱수</text><text x="53" y="160" font-family="NanumSquare,sans-serif" font-size="16" fill="#1E5485">제곱의 차: 0 (mod 8)</text><text x="407" y="107" font-family="NanumSquare,sans-serif" font-size="17" font-weight="bold" fill="#8A4322">두 수의 차</text><text x="407" y="136" font-family="NanumSquare,sans-serif" font-size="15" fill="#5B4538">m−n = 4ta ≡ 4ta (mod 8)</text><text x="407" y="167" font-family="NanumSquare,sans-serif" font-size="16" fill="#A34224">나머지 4는 불가능</text><path d="M338 134 L380 134" stroke="#3E555E" stroke-width="2.3"/><path d="M373 126 L382 134 L373 142" fill="none" stroke="#3E555E" stroke-width="2.3"/><path d="M35 217 H685" stroke="#C7D1D8"/><text x="42" y="248" font-family="NanumSquare,sans-serif" font-size="17" fill="#23634C">따라서 두 수가 모두 제곱수일 수 없습니다.</text></svg>