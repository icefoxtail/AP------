<svg xmlns="http://www.w3.org/2000/svg" width="760" height="380" viewBox="0 0 760 380"><title>A3 합성함수의 구간별 식</title><rect width="760" height="380" fill="white"/><text x="65" y="45" font-size="22">A3 | f(f(x))</text><line x1="65" y1="123" x2="665" y2="123" stroke="#789" stroke-width="2"/><text x="260" y="100" font-size="20" text-anchor="middle">-4</text><line x1="260" x2="260" y1="114" y2="132" stroke="#526579" stroke-width="2"/><text x="460" y="100" font-size="20" text-anchor="middle">0</text><line x1="460" x2="460" y1="114" y2="132" stroke="#526579" stroke-width="2"/><rect x="65" y="140" width="190" height="105" rx="8" fill="#eef3fa"/><text x="160" y="192" font-size="20" text-anchor="middle">x+8</text><rect x="265" y="140" width="190" height="105" rx="8" fill="#eef6eb"/><text x="360" y="192" font-size="20" text-anchor="middle">2x+12</text><rect x="465" y="140" width="190" height="105" rx="8" fill="#fff0df"/><text x="560" y="192" font-size="20" text-anchor="middle">4x+12</text><text x="65" y="302" font-size="16">안쪽 경계 x=0; 추가 경계 x=-4</text><text x="65" y="343" font-size="15">최소 경계값 a=-4.</text></svg>