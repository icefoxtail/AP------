<svg xmlns="http://www.w3.org/2000/svg" width="760" height="350" viewBox="0 0 760 350" role="img" aria-labelledby="title desc"><title id="title">C2 합성함수 부등식 수직선</title><desc id="desc">-3에서 5까지 정수 중 x=-1,0,1,2,3을 만족하는 검은 점으로 표시</desc><rect width="760" height="350" fill="#FFFFFF"/><defs><marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6 Z" fill="#333333"/></marker></defs><text x="380" y="55" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="700">합성함수 부등식의 정수해</text><text x="380" y="92" text-anchor="middle" font-family="sans-serif" font-size="15">g(f(x)) = (x−1)²−4 ≤ 0</text><line x1="90" y1="192" x2="674" y2="192" stroke="#888" stroke-width="2"/><line x1="236" y1="192" x2="528" y2="192" stroke="#111" stroke-width="6"/><circle cx="90" cy="192" r="8" fill="#fff" stroke="#111" stroke-width="2" data-x="-3" data-valid="false"/><text x="90" y="226" text-anchor="middle" font-family="sans-serif" font-size="17">−3</text><circle cx="163" cy="192" r="8" fill="#fff" stroke="#111" stroke-width="2" data-x="-2" data-valid="false"/><text x="163" y="226" text-anchor="middle" font-family="sans-serif" font-size="17">−2</text><circle cx="236" cy="192" r="8" fill="#111" stroke="#111" stroke-width="2" data-x="-1" data-valid="true"/><text x="236" y="226" text-anchor="middle" font-family="sans-serif" font-size="17">−1</text><circle cx="309" cy="192" r="8" fill="#111" stroke="#111" stroke-width="2" data-x="0" data-valid="true"/><text x="309" y="226" text-anchor="middle" font-family="sans-serif" font-size="17">0</text><circle cx="382" cy="192" r="8" fill="#111" stroke="#111" stroke-width="2" data-x="1" data-valid="true"/><text x="382" y="226" text-anchor="middle" font-family="sans-serif" font-size="17">1</text><circle cx="455" cy="192" r="8" fill="#111" stroke="#111" stroke-width="2" data-x="2" data-valid="true"/><text x="455" y="226" text-anchor="middle" font-family="sans-serif" font-size="17">2</text><circle cx="528" cy="192" r="8" fill="#111" stroke="#111" stroke-width="2" data-x="3" data-valid="true"/><text x="528" y="226" text-anchor="middle" font-family="sans-serif" font-size="17">3</text><circle cx="601" cy="192" r="8" fill="#fff" stroke="#111" stroke-width="2" data-x="4" data-valid="false"/><text x="601" y="226" text-anchor="middle" font-family="sans-serif" font-size="17">4</text><circle cx="674" cy="192" r="8" fill="#fff" stroke="#111" stroke-width="2" data-x="5" data-valid="false"/><text x="674" y="226" text-anchor="middle" font-family="sans-serif" font-size="17">5</text><text x="380" y="285" text-anchor="middle" font-family="sans-serif" font-size="17">가능한 정수: −1, 0, 1, 2, 3</text></svg>
