<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 630 305" width="630" height="305" role="img" aria-labelledby="graphTitle graphDesc"><title id="graphTitle">C1 충분조건과 진리집합 포함 관계</title><desc id="graphDesc">p의 진리집합은 -1부터 3까지이다. q의 진리집합 [a,a+6]에 p가 포함되려면 정수 a는 -3,-2,-1이다. 네 줄 모두 양 끝점은 포함된다.</desc><rect x="0" y="0" width="630" height="305" fill="white"/><text x="18" y="30" font-size="16" font-family="sans-serif" fill="#162233">진리집합 포함과 정수 매개변수</text><text x="18" y="81" font-size="14" font-family="sans-serif" fill="#263442">p : [-1, 3]</text><line x1="270" y1="77" x2="430" y2="77" stroke="#202d3d" stroke-width="4" stroke-linecap="round"/><circle cx="270" cy="77" r="4" fill="#202d3d"/><circle cx="430" cy="77" r="4" fill="#202d3d"/><text x="18" y="136" font-size="14" font-family="sans-serif" fill="#263442">a = -3</text><line x1="190" y1="132" x2="430" y2="132" stroke="#647b91" stroke-width="3" stroke-linecap="round"/><circle cx="190" cy="132" r="4" fill="#647b91"/><circle cx="430" cy="132" r="4" fill="#647b91"/><text x="18" y="191" font-size="14" font-family="sans-serif" fill="#263442">a = -2</text><line x1="230" y1="187" x2="470" y2="187" stroke="#647b91" stroke-width="3" stroke-linecap="round"/><circle cx="230" cy="187" r="4" fill="#647b91"/><circle cx="470" cy="187" r="4" fill="#647b91"/><text x="18" y="246" font-size="14" font-family="sans-serif" fill="#263442">a = -1</text><line x1="270" y1="242" x2="510" y2="242" stroke="#647b91" stroke-width="3" stroke-linecap="round"/><circle cx="270" cy="242" r="4" fill="#647b91"/><circle cx="510" cy="242" r="4" fill="#647b91"/><line x1="150" y1="275" x2="550" y2="275" stroke="#39495a" stroke-width="1.25"/><line x1="150" y1="272" x2="150" y2="279" stroke="#39495a" stroke-width="1"/><text x="150" y="296" font-size="11.5" font-family="sans-serif" text-anchor="middle" fill="#22313f">-4</text><line x1="190" y1="272" x2="190" y2="279" stroke="#39495a" stroke-width="1"/><text x="190" y="296" font-size="11.5" font-family="sans-serif" text-anchor="middle" fill="#22313f">-3</text><line x1="230" y1="272" x2="230" y2="279" stroke="#39495a" stroke-width="1"/><text x="230" y="296" font-size="11.5" font-family="sans-serif" text-anchor="middle" fill="#22313f">-2</text><line x1="270" y1="272" x2="270" y2="279" stroke="#39495a" stroke-width="1"/><text x="270" y="296" font-size="11.5" font-family="sans-serif" text-anchor="middle" fill="#22313f">-1</text><line x1="310" y1="272" x2="310" y2="279" stroke="#39495a" stroke-width="1"/><text x="310" y="296" font-size="11.5" font-family="sans-serif" text-anchor="middle" fill="#22313f">0</text><line x1="350" y1="272" x2="350" y2="279" stroke="#39495a" stroke-width="1"/><text x="350" y="296" font-size="11.5" font-family="sans-serif" text-anchor="middle" fill="#22313f">1</text><line x1="390" y1="272" x2="390" y2="279" stroke="#39495a" stroke-width="1"/><text x="390" y="296" font-size="11.5" font-family="sans-serif" text-anchor="middle" fill="#22313f">2</text><line x1="430" y1="272" x2="430" y2="279" stroke="#39495a" stroke-width="1"/><text x="430" y="296" font-size="11.5" font-family="sans-serif" text-anchor="middle" fill="#22313f">3</text><line x1="470" y1="272" x2="470" y2="279" stroke="#39495a" stroke-width="1"/><text x="470" y="296" font-size="11.5" font-family="sans-serif" text-anchor="middle" fill="#22313f">4</text><line x1="510" y1="272" x2="510" y2="279" stroke="#39495a" stroke-width="1"/><text x="510" y="296" font-size="11.5" font-family="sans-serif" text-anchor="middle" fill="#22313f">5</text><line x1="550" y1="272" x2="550" y2="279" stroke="#39495a" stroke-width="1"/><text x="550" y="296" font-size="11.5" font-family="sans-serif" text-anchor="middle" fill="#22313f">6</text></svg>
