<svg xmlns="http://www.w3.org/2000/svg" width="760" height="380" viewBox="0 0 760 380"><title>A2 composition intervals</title><rect width="760" height="380" fill="white"/><text x="65" y="45" font-size="22">A2 | f(f(x))</text><line x1="65" y1="123" x2="665" y2="123" stroke="#789" stroke-width="2"/><text x="260" y="100" font-size="20" text-anchor="middle">-1</text><line x1="260" x2="260" y1="114" y2="132" stroke="#526579" stroke-width="2"/><text x="460" y="100" font-size="20" text-anchor="middle">1</text><line x1="460" x2="460" y1="114" y2="132" stroke="#526579" stroke-width="2"/><rect x="65" y="140" width="190" height="105" rx="8" fill="#eef3fa"/><text x="160" y="192" font-size="20" text-anchor="middle">1x+4</text><rect x="265" y="140" width="190" height="105" rx="8" fill="#eef6eb"/><text x="360" y="192" font-size="20" text-anchor="middle">2x+5</text><rect x="465" y="140" width="190" height="105" rx="8" fill="#fff0df"/><text x="560" y="192" font-size="20" text-anchor="middle">4x+3</text><text x="65" y="302" font-size="16">Inner threshold: x=1; new threshold: x=-1</text><text x="65" y="343" font-size="15">Use the correct outer branch for the inner output.</text></svg>