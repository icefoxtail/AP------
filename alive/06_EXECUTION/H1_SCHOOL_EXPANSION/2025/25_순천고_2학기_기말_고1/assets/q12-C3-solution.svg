<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 590 212" width="590" height="212" role="img" aria-label="C3 역함수와 합성 순서 해설"><title>C3 역연산 과정</title><desc>역함수를 적용하는 입력과 출력의 순서를 화살표로 나타낸 해설 그림</desc><rect width="590" height="212" fill="#ffffff"/><text x="22" y="30" font-size="17" font-weight="600" font-family="DejaVu Sans, sans-serif" fill="#1b2a3b">C3  ·  (g⁻¹ ◦ f⁻¹)(25) = 4</text><rect x="26" y="62" width="116" height="62" rx="11" fill="#f3f5f8" stroke="#8194a7" stroke-width="1.3"/><text x="84" y="103" font-size="26" text-anchor="middle" font-family="DejaVu Sans, sans-serif" fill="#1a2b3c">25</text><rect x="210" y="62" width="116" height="62" rx="11" fill="#f5f7f9" stroke="#8194a7" stroke-width="1.3"/><text x="268" y="103" font-size="26" text-anchor="middle" font-family="DejaVu Sans, sans-serif" fill="#1a2b3c">10</text><path d="M 145 94 H 201 m -7 -5 l 7 5 -7 5" stroke="#50687e" stroke-width="2" fill="none"/><text x="173" y="84" text-anchor="middle" font-size="15" font-family="DejaVu Sans, sans-serif" fill="#304b62">f⁻¹</text><rect x="394" y="62" width="116" height="62" rx="11" fill="#e5edf5" stroke="#8194a7" stroke-width="1.3"/><text x="452" y="103" font-size="26" text-anchor="middle" font-family="DejaVu Sans, sans-serif" fill="#1a2b3c">4</text><path d="M 329 94 H 385 m -7 -5 l 7 5 -7 5" stroke="#50687e" stroke-width="2" fill="none"/><text x="357" y="84" text-anchor="middle" font-size="15" font-family="DejaVu Sans, sans-serif" fill="#304b62">g⁻¹</text><text x="22" y="194" font-size="15" font-family="DejaVu Sans, sans-serif" fill="#304359">y를 찾으려면 4 → g(4) = 10 → f(10) = 25 순으로 계산한다.</text></svg>
