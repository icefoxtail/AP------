<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 530 450" width="530" height="450" role="img" aria-label="C1 진리집합 P Q R의 세 수직선과 구간 포함 관계"><title>C1 진리집합 포함관계</title><desc>R은 0부터 6까지, P는 1부터 5까지, Q는 2와 6 사이의 열린구간이므로 P와 Q는 R에 포함되며 P와 Q는 서로 겹친다</desc><rect width="530" height="450" fill="#FFFFFF"/><text x="25" y="29" font-size="18" font-weight="bold" fill="#22364a" font-family="Nanum Gothic, Noto Sans CJK KR, sans-serif">C1 — 진리집합의 포함 관계</text><text x="25" y="54" font-size="14" fill="#455a70" font-family="Nanum Gothic, Noto Sans CJK KR, sans-serif">P⊆R, Q⊆R 이지만 P∩Q는 공집합이 아니다.</text><line x1="84" y1="77" x2="84" y2="385" stroke="#edf0f4" stroke-width="0.9" stroke-dasharray="3 6"/><line x1="133" y1="77" x2="133" y2="385" stroke="#edf0f4" stroke-width="0.9" stroke-dasharray="3 6"/><line x1="182" y1="77" x2="182" y2="385" stroke="#edf0f4" stroke-width="0.9" stroke-dasharray="3 6"/><line x1="231" y1="77" x2="231" y2="385" stroke="#edf0f4" stroke-width="0.9" stroke-dasharray="3 6"/><line x1="280" y1="77" x2="280" y2="385" stroke="#edf0f4" stroke-width="0.9" stroke-dasharray="3 6"/><line x1="329" y1="77" x2="329" y2="385" stroke="#edf0f4" stroke-width="0.9" stroke-dasharray="3 6"/><line x1="378" y1="77" x2="378" y2="385" stroke="#edf0f4" stroke-width="0.9" stroke-dasharray="3 6"/><line x1="427" y1="77" x2="427" y2="385" stroke="#edf0f4" stroke-width="0.9" stroke-dasharray="3 6"/><line x1="476" y1="77" x2="476" y2="385" stroke="#edf0f4" stroke-width="0.9" stroke-dasharray="3 6"/><text x="37" y="144" font-size="21" font-style="italic" fill="#22364a">R</text><line x1="76" y1="138" x2="481" y2="138" stroke="#b7c2cc" stroke-width="1.1"/><line x1="133" y1="138" x2="427" y2="138" stroke="#195b78" stroke-width="7.2" stroke-linecap="round"/><circle cx="133" cy="138" r="6.7" fill="#195b78" stroke="#195b78" stroke-width="2.4"/><circle cx="427" cy="138" r="6.7" fill="#195b78" stroke="#195b78" stroke-width="2.4"/><text x="37" y="237" font-size="21" font-style="italic" fill="#22364a">P</text><line x1="76" y1="231" x2="481" y2="231" stroke="#b7c2cc" stroke-width="1.1"/><line x1="182" y1="231" x2="378" y2="231" stroke="#195b78" stroke-width="7.2" stroke-linecap="round"/><circle cx="182" cy="231" r="6.7" fill="#195b78" stroke="#195b78" stroke-width="2.4"/><circle cx="378" cy="231" r="6.7" fill="#195b78" stroke="#195b78" stroke-width="2.4"/><text x="37" y="330" font-size="21" font-style="italic" fill="#22364a">Q</text><line x1="76" y1="324" x2="481" y2="324" stroke="#b7c2cc" stroke-width="1.1"/><line x1="231" y1="324" x2="427" y2="324" stroke="#195b78" stroke-width="7.2" stroke-linecap="round"/><circle cx="231" cy="324" r="6.7" fill="#FFFFFF" stroke="#195b78" stroke-width="2.4"/><circle cx="427" cy="324" r="6.7" fill="#FFFFFF" stroke="#195b78" stroke-width="2.4"/><text x="22" y="432" font-size="13" fill="#455a70" font-family="Nanum Gothic, Noto Sans CJK KR, sans-serif">●: 포함된 끝점    ○: 제외된 끝점</text><text x="84" y="402" text-anchor="middle" font-size="13" fill="#34495d">-1</text><text x="133" y="402" text-anchor="middle" font-size="13" fill="#34495d">0</text><text x="182" y="402" text-anchor="middle" font-size="13" fill="#34495d">1</text><text x="231" y="402" text-anchor="middle" font-size="13" fill="#34495d">2</text><text x="280" y="402" text-anchor="middle" font-size="13" fill="#34495d">3</text><text x="329" y="402" text-anchor="middle" font-size="13" fill="#34495d">4</text><text x="378" y="402" text-anchor="middle" font-size="13" fill="#34495d">5</text><text x="427" y="402" text-anchor="middle" font-size="13" fill="#34495d">6</text><text x="476" y="402" text-anchor="middle" font-size="13" fill="#34495d">7</text></svg>
