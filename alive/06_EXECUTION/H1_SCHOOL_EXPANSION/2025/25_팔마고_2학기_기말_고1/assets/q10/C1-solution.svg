<svg xmlns="http://www.w3.org/2000/svg" width="650" height="265" viewBox="0 0 650 265" role="img" aria-labelledby="t d"><title id="t">C1 합성 교환조건</title><desc id="d">k=0,1,2 중 k는 0이 아니므로 1과 2가 가능하다</desc><rect width="650" height="265" fill="white"/><g font-family="Arial,sans-serif" fill="#24394f"><text x="24" y="35" font-size="19" font-weight="700">합성 교환조건의 가능한 값</text><text x="24" y="68" font-size="16">k(k−1)(k−2) = 0,   k ≠ 0</text><rect x="25" y="98" width="186" height="110" rx="8" fill="#f3f5f7" stroke="#bcc9d4"/><rect x="232" y="98" width="186" height="110" rx="8" fill="#e8f5f7" stroke="#8cbcca"/><rect x="439" y="98" width="186" height="110" rx="8" fill="#e8f5f7" stroke="#8cbcca"/><g font-size="23" text-anchor="middle"><text data-k="0" x="118" y="144">k = 0</text><text data-k="1" x="325" y="144">k = 1</text><text data-k="2" x="532" y="144">k = 2</text></g><g font-size="17" text-anchor="middle"><text x="118" y="183">제외</text><text x="325" y="183">가능</text><text x="532" y="183">가능</text></g><text x="325" y="247" font-size="17" font-weight="700" text-anchor="middle">가능한 값의 합 = 1 + 2 = 3</text></g></svg>