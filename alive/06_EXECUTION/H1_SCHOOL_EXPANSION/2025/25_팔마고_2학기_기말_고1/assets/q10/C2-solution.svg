<svg xmlns="http://www.w3.org/2000/svg" width="660" height="295" viewBox="0 0 660 295" role="img" aria-labelledby="t d"><title id="t">C2 합성다항식의 계수 비교</title><desc id="d">f(g(x))의 이차항 계수 k², 일차항 0, 상수항 1과 g(f(x))의 이차항 k, 일차항 -2k, 상수항 2k+1을 비교한다</desc><rect width="660" height="295" fill="white"/><g font-family="Arial,sans-serif" fill="#24394f"><text x="22" y="34" font-size="19" font-weight="700">두 합성함수의 계수 비교</text><text x="22" y="59" font-size="14">f(g(x)) = k²x² + 1</text><text x="340" y="59" font-size="14">g(f(x)) = kx² − 2kx + 2k + 1</text><rect x="25" y="78" width="610" height="36" fill="#e8eff4"/><g font-size="15" text-anchor="middle"><text x="119" y="102">항</text><text x="310" y="102">f(g(x))</text><text x="526" y="102">g(f(x))</text></g><rect x="25" y="114" width="610" height="39" fill="#fafbfd" stroke="#d5dfe7"/><rect x="25" y="153" width="610" height="39" fill="#e6f5f7" stroke="#8bbdcc"/><rect x="25" y="192" width="610" height="39" fill="#fafbfd" stroke="#d5dfe7"/><g font-size="17" text-anchor="middle"><text x="119" y="140">x²</text><text x="310" y="140">k²</text><text x="526" y="140">k</text><text x="119" y="179">x</text><text data-coefficient="zero" x="310" y="179">0</text><text data-coefficient="minus2k" x="526" y="179">−2k</text><text x="119" y="218">상수항</text><text x="310" y="218">1</text><text x="526" y="218">2k + 1</text></g><text x="330" y="268" font-size="18" font-weight="700" text-anchor="middle">x의 계수: 0 = −2k → k = 0</text></g></svg>