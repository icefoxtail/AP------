<svg xmlns="http://www.w3.org/2000/svg" width="690" height="325" viewBox="0 0 690 325" role="img" aria-labelledby="t d"><title id="t">C3 세 함수의 쌍별 합성 교환 관계</title><desc id="d">f와 g에서 b=2a, g와 h에서 2c=3b, f와 h에서 c=3a를 얻는다. a+b+c=30이면 a=5,b=10,c=15이다.</desc><rect width="690" height="325" fill="white"/><g font-family="Arial,sans-serif" fill="#25384d"><text x="24" y="34" font-size="20" font-weight="700">세 함수의 합성 순서 교환</text><text x="24" y="62" font-size="14">f(x)=2x+a,  g(x)=3x+b,  h(x)=4x+c</text><rect x="26" y="85" width="636" height="36" fill="#e8eff4"/><g font-size="15" text-anchor="middle"><text x="186" y="109">함수의 쌍</text><text x="486" y="109">교환 조건으로 얻는 관계</text></g><rect x="26" y="121" width="636" height="43" fill="#f9fbfc" stroke="#d2dce5"/><rect x="26" y="164" width="636" height="43" fill="#eef6f8" stroke="#d2dce5"/><rect x="26" y="207" width="636" height="43" fill="#f9fbfc" stroke="#d2dce5"/><g font-size="17" text-anchor="middle"><text x="186" y="149">f 와 g</text><text data-relation="fg" x="486" y="149">b = 2a</text><text x="186" y="192">g 와 h</text><text data-relation="gh" x="486" y="192">2c = 3b</text><text x="186" y="235">f 와 h</text><text data-relation="fh" x="486" y="235">c = 3a</text></g><text x="345" y="279" font-size="15" text-anchor="middle">a + b + c = 6a = 30</text><text x="345" y="307" font-size="19" font-weight="700" text-anchor="middle">a = 5, b = 10, c = 15</text></g></svg>