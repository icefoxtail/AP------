<svg xmlns="http://www.w3.org/2000/svg" width="600" height="224" viewBox="0 0 600 224" preserveAspectRatio="xMidYMid meet" role="img" aria-label="C1 해설 — 두 증가 사슬과 교차 제약"><title>C1 해설 — 두 증가 사슬과 교차 제약</title><desc>f1&lt;f2&lt;f3, f4&lt;f5&lt;f6, f2&lt;f5, f1 홀수. 실제 가능 사례 f1=1에서 f2=2 또는 3.</desc><rect width="600" height="224" fill="#fff"/><text x="34" y="31" font-size="17" font-weight="bold" fill="#111">C1 해설 — 두 증가 사슬과 교차 제약</text><rect x="38" y="57" width="70" height="51" rx="5" fill="white" stroke="#1c1c1c" stroke-width="1.7"/><text x="73" y="89" text-anchor="middle" font-size="15" fill="#111">f(1)</text><rect x="127" y="57" width="70" height="51" rx="5" fill="white" stroke="#1c1c1c" stroke-width="1.7"/><text x="162" y="89" text-anchor="middle" font-size="15" fill="#111">f(2)</text><rect x="216" y="57" width="70" height="51" rx="5" fill="white" stroke="#1c1c1c" stroke-width="1.7"/><text x="251" y="89" text-anchor="middle" font-size="15" fill="#111">f(3)</text><rect x="305" y="57" width="70" height="51" rx="5" fill="white" stroke="#1c1c1c" stroke-width="1.7"/><text x="340" y="89" text-anchor="middle" font-size="15" fill="#111">f(4)</text><rect x="394" y="57" width="70" height="51" rx="5" fill="white" stroke="#1c1c1c" stroke-width="1.7"/><text x="429" y="89" text-anchor="middle" font-size="15" fill="#111">f(5)</text><rect x="483" y="57" width="70" height="51" rx="5" fill="white" stroke="#1c1c1c" stroke-width="1.7"/><text x="518" y="89" text-anchor="middle" font-size="15" fill="#111">f(6)</text><text x="118" y="89" text-anchor="middle" font-size="16" font-weight="bold" fill="#111">&lt;</text><text x="207" y="89" text-anchor="middle" font-size="16" font-weight="bold" fill="#111">&lt;</text><text x="385" y="89" text-anchor="middle" font-size="16" font-weight="bold" fill="#111">&lt;</text><text x="474" y="89" text-anchor="middle" font-size="16" font-weight="bold" fill="#111">&lt;</text><line x1="34" y1="118" x2="558" y2="118" stroke="#999" stroke-width="1"/><text x="34" y="148" font-size="14" fill="#111">추가조건: f(1)은 홀수, f(2)&lt;f(5)</text><text x="34" y="171" font-size="14" fill="#111">f(1)=1, f(2)=2: 4가지 / f(2)=3: 3가지</text><text x="34" y="194" font-size="14" fill="#111">f(1)=3,5는 불가능 → 총 7가지</text></svg>
