<svg xmlns="http://www.w3.org/2000/svg" width="600" height="224" viewBox="0 0 600 224" preserveAspectRatio="xMidYMid meet" role="img" aria-label="C2 해설 — 증가 사슬의 두 가지 완성"><title>C2 해설 — 증가 사슬의 두 가지 완성</title><desc>두 사슬이 증가하고 f1+f4=5이다. 두 사슬의 시작값은 1과 4여야 한다.</desc><rect width="600" height="224" fill="#fff"/><text x="34" y="31" font-size="17" font-weight="bold" fill="#111">C2 해설 — 증가 사슬의 두 가지 완성</text><rect x="38" y="57" width="70" height="51" rx="5" fill="white" stroke="#1c1c1c" stroke-width="1.7"/><text x="73" y="89" text-anchor="middle" font-size="15" fill="#111">f(1)</text><rect x="127" y="57" width="70" height="51" rx="5" fill="white" stroke="#1c1c1c" stroke-width="1.7"/><text x="162" y="89" text-anchor="middle" font-size="15" fill="#111">f(2)</text><rect x="216" y="57" width="70" height="51" rx="5" fill="white" stroke="#1c1c1c" stroke-width="1.7"/><text x="251" y="89" text-anchor="middle" font-size="15" fill="#111">f(3)</text><rect x="305" y="57" width="70" height="51" rx="5" fill="white" stroke="#1c1c1c" stroke-width="1.7"/><text x="340" y="89" text-anchor="middle" font-size="15" fill="#111">f(4)</text><rect x="394" y="57" width="70" height="51" rx="5" fill="white" stroke="#1c1c1c" stroke-width="1.7"/><text x="429" y="89" text-anchor="middle" font-size="15" fill="#111">f(5)</text><rect x="483" y="57" width="70" height="51" rx="5" fill="white" stroke="#1c1c1c" stroke-width="1.7"/><text x="518" y="89" text-anchor="middle" font-size="15" fill="#111">f(6)</text><text x="118" y="89" text-anchor="middle" font-size="16" font-weight="bold" fill="#111">&lt;</text><text x="207" y="89" text-anchor="middle" font-size="16" font-weight="bold" fill="#111">&lt;</text><text x="385" y="89" text-anchor="middle" font-size="16" font-weight="bold" fill="#111">&lt;</text><text x="474" y="89" text-anchor="middle" font-size="16" font-weight="bold" fill="#111">&lt;</text><line x1="34" y1="118" x2="558" y2="118" stroke="#999" stroke-width="1"/><text x="34" y="148" font-size="14" fill="#111">(f1,f2,f3)=(1,2,3), (f4,f5,f6)=(4,5,6)</text><text x="34" y="171" font-size="14" fill="#111">또는 두 세 수 묶음을 교환한 대응 하나</text><text x="34" y="194" font-size="14" fill="#111">따라서 가능한 일대일대응은 2개</text></svg>
