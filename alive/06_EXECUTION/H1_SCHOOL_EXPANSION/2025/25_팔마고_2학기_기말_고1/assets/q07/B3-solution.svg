<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 670" width="920" height="670" role="img" aria-labelledby="t d"><title id="t">끝점 두 곳만 확인하여 k를 선택</title><desc id="d">최솟값 1 이상이고 최댓값 3 이하인 k=1,2,3을 색과 글씨 굵기로 표시</desc><rect width="920" height="670" fill="white"/><text x="65" y="53" font-family="Arial,sans-serif" font-size="22" font-weight="700">끝점 두 곳만 확인하여 k를 선택</text><text x="65" y="82" font-family="Arial,sans-serif" font-size="16">0≤k≤5인 정수, f(0)=k, f(3)=(6+k)/4</text><rect x="70" y="156" width="110" height="60" fill="#e9edf2" stroke="#777"/><text x="125" y="193" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700">k</text><rect x="180" y="156" width="110" height="60" fill="#e9edf2" stroke="#777"/><text x="235" y="193" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700">0</text><rect x="290" y="156" width="110" height="60" fill="#e9edf2" stroke="#777"/><text x="345" y="193" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700">1</text><rect x="400" y="156" width="110" height="60" fill="#e9edf2" stroke="#777"/><text x="455" y="193" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700">2</text><rect x="510" y="156" width="110" height="60" fill="#e9edf2" stroke="#777"/><text x="565" y="193" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700">3</text><rect x="620" y="156" width="110" height="60" fill="#e9edf2" stroke="#777"/><text x="675" y="193" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700">4</text><rect x="730" y="156" width="110" height="60" fill="#e9edf2" stroke="#777"/><text x="785" y="193" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700">5</text><rect x="70" y="216" width="110" height="62" fill="#fff" stroke="#999"/><text x="125" y="253" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" >f(0)</text><rect x="18