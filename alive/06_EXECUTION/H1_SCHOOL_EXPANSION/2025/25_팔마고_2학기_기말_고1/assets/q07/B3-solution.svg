ect x="620" y="278" width="110" height="62" fill="#fff" stroke="#999"/><text x="675" y="315" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" >5/2</text><rect x="730" y="278" width="110" height="62" fill="#fff" stroke="#999"/><text x="785" y="315" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" >11/4</text><rect x="70" y="340" width="110" height="62" fill="#fff" stroke="#999"/><text x="125" y="377" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" >판정</text><rect x="180" y="340" width="110" height="62" fill="#fff" stroke="#999"/><text x="235" y="377" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" >제외</text><rect x="290" y="340" width="110" height="62" fill="#eef3ee" stroke="#999"/><text x="345" y="377" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700">만족</text><rect x="400" y="340" width="110" height="62" fill="#eef3ee" stroke="#999"/><text x="455" y="377" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700">만족</text><rect x="510" y="340" width="110" height="62" fill="#eef3ee" stroke="#999"/><text x="565" y="377" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700">만족</text><rect x="620" y="340" width="110" height="62" fill="#fff" stroke="#999"/><text x="675" y="377" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" >제외</text><rect x="730" y="340" width="110" height="62" fill="#fff" stroke="#999"/><text x="785" y="377" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" >제외</text><text x="70" y="457" font-family="Arial,sans-serif" font-size="17">허용 k = 1, 2, 3 → 총 3개</text></svg>
