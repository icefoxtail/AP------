<svg xmlns="http://www.w3.org/2000/svg" width="580" height="270" viewBox="0 0 580 270" role="img" aria-labelledby="title desc"><title id="title">q08 C1 반복합성 순환</title><desc id="desc">1 → 2 → 3 → 1 / 4 → 5 → 4; 화살표 방향은 함수값 대응이다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#304b67"/></marker></defs><rect width="580" height="270" fill="#ffffff"/><path d="M292 47 L292 224" stroke="#ccd3dd" stroke-width="1" stroke-dasharray="4 5"/><text x="148" y="29" text-anchor="middle" font-size="15" font-weight="600" fill="#293c52">3회 주기</text><line data-from="1" data-to="2" x1="161.50" y1="98.38" x2="193.39" y2="153.62" stroke="#304b67" stroke-width="2.2" marker-end="url(#arrow)"/><line data-from="2" data-to="3" x1="179.89" y1="177.00" x2="116.11" y2="177.00" stroke="#304b67" stroke-width="2.2" marker-end="url(#arrow)"/><line data-from="3" data-to="1" x1="102.61" y1="153.62" x2="134.50" y2="98.38" stroke="#304b67" stroke-width="2.2" marker-end="url(#arrow)"/><circle cx="148.00" cy="75.00" r="20" fill="#fff" stroke="#293c52" stroke-width="2"/><text x="148.00" y="80.00" font-size="16" font-family="Arial,sans-serif" font-weight="600" text-anchor="middle">1</text><circle cx="206.89" cy="177.00" r="20" fill="#fff" stroke="#293c52" stroke-width="2"/><text x="206.89" y="182.00" font-size="16" font-family="Arial,sans-serif" font-weight="600" text-anchor="middle">2</text><circle cx="89.11" cy="177.00" r="20" fill="#fff" stroke="#293c52" stroke-width="2"/><text x="89.11" y="182.00" font-size="16" font-family="Arial,sans-serif" font-weight="600" text-anchor="middle">3</text><text x="418" y="29" text-anchor="middle" font-size="15" font-weight="600" fill="#293c52">2회 주기</text><path data-from="4" data-to="5" d="M 381 131 Q 413 82 447 131" fill="none" stroke="#304b67" stroke-width="2.2" marker-end="url(#arrow)"/><path data-from="5" data-to="4" d="M 447 155 Q 413 203 381 155" fill="none" stroke="#304b67" stroke-width="2.2" marker-end="url(#arrow)"/><circle cx="362.00" cy="143.00" r="20" fill="#fff" stroke="#293c52" stroke-width="2"/><text x="362.00" y="148.00" font-size="16" font-family="Arial,sans-serif" font-weight="600" text-anchor="middle">4</text><circle cx="466.00" cy="143.00" r="20" fill="#fff" stroke="#293c52" stroke-width="2"/><text x="466.00" y="148.00" font-size="16" font-family="Arial,sans-serif" font-weight="600" text-anchor="middle">5</text><text x="290" y="252" text-anchor="middle" font-size="12" font-family="Arial,sans-serif" fill="#526071">화살표 한 번 이동 = 함수 f를 한 번 적용</text></svg>