<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="376" viewBox="0 0 1000 376" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="qt qd"><title id="qt">제일고 q22 A2 귀류법 해설</title><desc id="qd">결론의 부정 가정과 홀짝 및 제곱수 나머지의 모순을 확인하는 단계별 해설 도식.</desc><rect width="1000" height="376" fill="white"/><text x="28" y="30" font-family="sans-serif" font-size="20" font-weight="700">귀류법 증명 단계 · A2</text><rect x="28" y="50" width="944" height="85" rx="10" fill="#f7f7f7" stroke="#dddddd"/><text x="47" y="77" font-size="16" font-family="sans-serif" font-weight="700">부정 가정</text><text x="47" y="110" font-size="20" font-family="sans-serif">a,b 모두 짝수 또는 모두 홀수</text><path d="M500 135 v17" stroke="#999" stroke-width="2"/><rect x="28" y="154" width="944" height="85" rx="10" fill="#f7f7f7" stroke="#dddddd"/><text x="47" y="181" font-size="16" font-family="sans-serif" font-weight="700">둘 다 짝수</text><text x="47" y="214" font-size="20" font-family="sans-serif">왼쪽 짝수 ≠ 오른쪽 홀수</text><path d="M500 239 v17" stroke="#999" stroke-width="2"/><rect x="28" y="258" width="944" height="85" rx="10" fill="#edf3f1" stroke="#8ea79e"/><text x="47" y="285" font-size="16" font-family="sans-serif" font-weight="700">둘 다 홀수</text><text x="47" y="318" font-size="20" font-family="sans-serif">왼쪽 2 (mod 4) ≠ 오른쪽 1 (mod 4)</text><text x="28" y="368" font-size="11" font-family="sans-serif" fill="#777">수의 나머지와 제곱수의 가능한 나머지 비교</text></svg>