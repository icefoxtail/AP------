<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 410" role="img" aria-labelledby="title desc">
<title id="title">C2 점근선 직사각형 해설</title>
<desc id="desc">수직 점근선 x=3, x=11와 수평 점근선 y=2, y=8가 만드는 직사각형. 가로 8, 세로 6, 넓이 48.</desc>
<rect x="0" y="0" width="620" height="410" rx="14" fill="#fff"/>
<text x="18" y="27" font-family="sans-serif" font-weight="700" font-size="16" fill="#283c4b">C2 · 두 함수의 점근선 관계</text>
<line x1="60" y1="314.8" x2="413.6" y2="314.8" stroke="#666" stroke-width="1.25"/>
<line x1="87.2" y1="342" x2="87.2" y2="70" stroke="#666" stroke-width="1.25"/>
<rect x="168.8" y="97.2" width="217.6" height="163.2" fill="#e0f0f4" stroke="#137b9b" stroke-width="2"/>
<line x1="168.8" y1="342" x2="168.8" y2="70" stroke="#c06136" stroke-width="1.7" stroke-dasharray="6 4"/>
<line x1="386.4" y1="342" x2="386.4" y2="70" stroke="#c06136" stroke-width="1.7" stroke-dasharray="6 4"/>
<line x1="60" y1="97.2" x2="413.6" y2="97.2" stroke="#c06136" stroke-width="1.7" stroke-dasharray="6 4"/>
<line x1="60" y1="260.4" x2="413.6" y2="260.4" stroke="#c06136" stroke-width="1.7" stroke-dasharray="6 4"/>
<text x="168.8" y="358" text-anchor="middle" font-size="12" fill="#943e20">x=3</text>
<text x="386.4" y="358" text-anchor="middle" font-size="12" fill="#943e20">x=11</text>
<text x="64" y="90.2" font-size="12" fill="#943e20">y=8</text>
<text x="64" y="253.4" font-size="12" fill="#943e20">y=2</text>
<text x="277.6" y="85.2" text-anchor="middle" font-size="13" fill="#11627a">가로 8</text>
<text x="394.4" y="178.8" font-size="13" fill="#11627a">세로 6</text>
<rect x="13" y="366" width="594" height="32" rx="6" fill="#f0f5f9"/>
<text x="25" y="387" font-family="sans-serif" font-size="15" fill="#293d4c">가로 8 × 세로 6 = 넓이 48</text>
</svg>