<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 410" role="img" aria-labelledby="title desc">
<title id="title">A2 점근선 직사각형 해설</title>
<desc id="desc">수직 점근선 x=3, x=7와 수평 점근선 y=0, y=7가 만드는 직사각형. 가로 4, 세로 7, 넓이 28.</desc>
<rect x="0" y="0" width="620" height="410" rx="14" fill="#fff"/>
<text x="18" y="27" font-family="sans-serif" font-weight="700" font-size="16" fill="#283c4b">A2 · 두 함수의 점근선 관계</text>
<line x1="60" y1="311.78" x2="332" y2="311.78" stroke="#666" stroke-width="1.25"/>
<line x1="90.22" y1="342" x2="90.22" y2="70" stroke="#666" stroke-width="1.25"/>
<rect x="180.89" y="100.22" width="120.89" height="211.56" fill="#e0f0f4" stroke="#137b9b" stroke-width="2"/>
<line x1="180.89" y1="342" x2="180.89" y2="70" stroke="#c06136" stroke-width="1.7" stroke-dasharray="6 4"/>
<line x1="301.78" y1="342" x2="301.78" y2="70" stroke="#c06136" stroke-width="1.7" stroke-dasharray="6 4"/>
<line x1="60" y1="100.22" x2="332" y2="100.22" stroke="#c06136" stroke-width="1.7" stroke-dasharray="6 4"/>
<line x1="60" y1="311.78" x2="332" y2="311.78" stroke="#c06136" stroke-width="1.7" stroke-dasharray="6 4"/>
<text x="180.89" y="358" text-anchor="middle" font-size="12" fill="#943e20">x=3</text>
<text x="301.78" y="358" text-anchor="middle" font-size="12" fill="#943e20">x=7</text>
<text x="64" y="93.22" font-size="12" fill="#943e20">y=7</text>
<text x="64" y="304.78" font-size="12" fill="#943e20">y=0</text>
<text x="241.33" y="88.22" text-anchor="middle" font-size="13" fill="#11627a">가로 4</text>
<text x="309.78" y="206" font-size="13" fill="#11627a">세로 7</text>
<rect x="13" y="366" width="594" height="32" rx="6" fill="#f0f5f9"/>
<text x="25" y="387" font-family="sans-serif" font-size="15" fill="#293d4c">가로 4 × 세로 7 = 넓이 28</text>
</svg>