<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 410" role="img" aria-labelledby="title desc">
<title id="title">C1 점근선 직사각형 해설</title>
<desc id="desc">수직 점근선 x=1, x=6와 수평 점근선 y=1, y=4가 만드는 직사각형. 가로 5, 세로 3, 넓이 15.</desc>
<rect x="0" y="0" width="620" height="410" rx="14" fill="#fff"/>
<text x="18" y="27" font-family="sans-serif" font-weight="700" font-size="16" fill="#283c4b">C1 · 두 함수의 점근선 관계</text>
<line x1="60" y1="296.67" x2="422.67" y2="296.67" stroke="#666" stroke-width="1.25"/>
<line x1="105.33" y1="342" x2="105.33" y2="70" stroke="#666" stroke-width="1.25"/>
<rect x="150.67" y="115.33" width="226.67" height="136" fill="#e0f0f4" stroke="#137b9b" stroke-width="2"/>
<line x1="150.67" y1="342" x2="150.67" y2="70" stroke="#c06136" stroke-width="1.7" stroke-dasharray="6 4"/>
<line x1="377.33" y1="342" x2="377.33" y2="70" stroke="#c06136" stroke-width="1.7" stroke-dasharray="6 4"/>
<line x1="60" y1="115.33" x2="422.67" y2="115.33" stroke="#c06136" stroke-width="1.7" stroke-dasharray="6 4"/>
<line x1="60" y1="251.33" x2="422.67" y2="251.33" stroke="#c06136" stroke-width="1.7" stroke-dasharray="6 4"/>
<text x="150.67" y="358" text-anchor="middle" font-size="12" fill="#943e20">x=1</text>
<text x="377.33" y="358" text-anchor="middle" font-size="12" fill="#943e20">x=6</text>
<text x="64" y="108.33" font-size="12" fill="#943e20">y=4</text>
<text x="64" y="244.33" font-size="12" fill="#943e20">y=1</text>
<text x="264" y="103.33" text-anchor="middle" font-size="13" fill="#11627a">가로 5</text>
<text x="385.33" y="183.33" font-size="13" fill="#11627a">세로 3</text>
<rect x="13" y="366" width="594" height="32" rx="6" fill="#f0f5f9"/>
<text x="25" y="387" font-family="sans-serif" font-size="15" fill="#293d4c">가로 5 × 세로 3 = 넓이 15</text>
</svg>