<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 410" role="img" aria-labelledby="title desc">
<title id="title">A3 점근선 직사각형 해설</title>
<desc id="desc">수직 점근선 x=4, x=6와 수평 점근선 y=-6, y=1가 만드는 직사각형. 가로 2, 세로 7, 넓이 14.</desc>
<rect x="0" y="0" width="620" height="410" rx="14" fill="#fff"/>
<text x="18" y="27" font-family="sans-serif" font-weight="700" font-size="16" fill="#283c4b">A3 · 두 함수의 점근선 관계</text>
<line x1="60" y1="130.44" x2="301.78" y2="130.44" stroke="#666" stroke-width="1.25"/>
<line x1="90.22" y1="342" x2="90.22" y2="70" stroke="#666" stroke-width="1.25"/>
<rect x="211.11" y="100.22" width="60.44" height="211.56" fill="#e0f0f4" stroke="#137b9b" stroke-width="2"/>
<line x1="211.11" y1="342" x2="211.11" y2="70" stroke="#c06136" stroke-width="1.7" stroke-dasharray="6 4"/>
<line x1="271.56" y1="342" x2="271.56" y2="70" stroke="#c06136" stroke-width="1.7" stroke-dasharray="6 4"/>
<line x1="60" y1="100.22" x2="301.78" y2="100.22" stroke="#c06136" stroke-width="1.7" stroke-dasharray="6 4"/>
<line x1="60" y1="311.78" x2="301.78" y2="311.78" stroke="#c06136" stroke-width="1.7" stroke-dasharray="6 4"/>
<text x="211.11" y="358" text-anchor="middle" font-size="12" fill="#943e20">x=4</text>
<text x="271.56" y="358" text-anchor="middle" font-size="12" fill="#943e20">x=6</text>
<text x="64" y="93.22" font-size="12" fill="#943e20">y=1</text>
<text x="64" y="304.78" font-size="12" fill="#943e20">y=-6</text>
<text x="241.33" y="88.22" text-anchor="middle" font-size="13" fill="#11627a">가로 2</text>
<text x="279.56" y="206" font-size="13" fill="#11627a">세로 7</text>
<rect x="13" y="366" width="594" height="32" rx="6" fill="#f0f5f9"/>
<text x="25" y="387" font-family="sans-serif" font-size="15" fill="#293d4c">가로 2 × 세로 7 = 넓이 14</text>
</svg>