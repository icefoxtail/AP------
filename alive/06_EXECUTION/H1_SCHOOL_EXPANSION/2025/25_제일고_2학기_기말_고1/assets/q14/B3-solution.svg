<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 410" role="img" aria-labelledby="title desc">
<title id="title">B3 점근선 직사각형 해설</title>
<desc id="desc">수직 점근선 x=1, x=7와 수평 점근선 y=1, y=5가 만드는 직사각형. 가로 6, 세로 4, 넓이 24.</desc>
<rect x="0" y="0" width="620" height="410" rx="14" fill="#fff"/>
<text x="18" y="27" font-family="sans-serif" font-weight="700" font-size="16" fill="#283c4b">B3 · 두 함수의 점근선 관계</text>
<line x1="60" y1="303.14" x2="409.71" y2="303.14" stroke="#666" stroke-width="1.25"/>
<line x1="98.86" y1="342" x2="98.86" y2="70" stroke="#666" stroke-width="1.25"/>
<rect x="137.71" y="108.86" width="233.14" height="155.43" fill="#e0f0f4" stroke="#137b9b" stroke-width="2"/>
<line x1="137.71" y1="342" x2="137.71" y2="70" stroke="#c06136" stroke-width="1.7" stroke-dasharray="6 4"/>
<line x1="370.86" y1="342" x2="370.86" y2="70" stroke="#c06136" stroke-width="1.7" stroke-dasharray="6 4"/>
<line x1="60" y1="108.86" x2="409.71" y2="108.86" stroke="#c06136" stroke-width="1.7" stroke-dasharray="6 4"/>
<line x1="60" y1="264.29" x2="409.71" y2="264.29" stroke="#c06136" stroke-width="1.7" stroke-dasharray="6 4"/>
<text x="137.71" y="358" text-anchor="middle" font-size="12" fill="#943e20">x=1</text>
<text x="370.86" y="358" text-anchor="middle" font-size="12" fill="#943e20">x=7</text>
<text x="64" y="101.86" font-size="12" fill="#943e20">y=5</text>
<text x="64" y="257.29" font-size="12" fill="#943e20">y=1</text>
<text x="254.29" y="96.86" text-anchor="middle" font-size="13" fill="#11627a">가로 6</text>
<text x="378.86" y="186.57" font-size="13" fill="#11627a">세로 4</text>
<rect x="13" y="366" width="594" height="32" rx="6" fill="#f0f5f9"/>
<text x="25" y="387" font-family="sans-serif" font-size="15" fill="#293d4c">가로 6 × 세로 4 = 넓이 24</text>
</svg>