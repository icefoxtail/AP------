<svg xmlns="http://www.w3.org/2000/svg" width="840" height="312" viewBox="0 0 840 312" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="q21-title q21-description"><title id="q21-title">제일고 q21 C2 유리식 망원합 해설 소거 도식</title><desc id="q21-description">부분분수 분해, 중간항 소거, 남는 항 및 정답을 순서대로 표시하는 해설 도식. 학생용 출제 그래프가 아닌 해설 시각 자료.</desc><rect width="840" height="312" fill="#fff"/><text x="24" y="26" font-family="sans-serif" font-size="17" font-weight="700" fill="#111">유리식의 망원합 · C2</text><g><rect x="24" y="42" width="792" height="78" rx="10" fill="#fafafa" stroke="#dedede" stroke-width="1.2"/><text x="43" y="67" font-family="sans-serif" font-size="15" font-weight="600" fill="#34403f">① 부분분수와 구조</text><text x="43" y="99" font-family="sans-serif" font-size="19" fill="#111">g(x) = f(x+1)</text></g><g><rect x="24" y="128" width="792" height="78" rx="10" fill="#f5f5f5" stroke="#dedede" stroke-width="1.2"/><text x="43" y="153" font-family="sans-serif" font-size="15" font-weight="600" fill="#34403f">② 소거되는 항 확인</text><text x="43" y="185" font-family="sans-serif" font-size="19" fill="#111">{f(1)−f(2)} + … + {f(n)−f(n+1)}</text></g><g><rect x="24" y="214" width="792" height="78" rx="10" fill="#f0f5f4" stroke="#8fa9a3" stroke-width="1.2"/><text x="43" y="239" font-family="sans-serif" font-size="15" font-weight="600" fill="#34403f">③ 남는 항과 답</text><text x="43" y="271" font-family="sans-serif" font-size="19" fill="#111">1/2 − 1/[(n+1)(n+2)] = 9/20  →  n=3</text></g></svg>