<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420"><title>B1 복분수 해설</title><desc>복분수 단계별 통분과 약분. 원래 모든 분모의 정의역 제외 조건은 유지한다.</desc><rect width="720" height="420" fill="white"/><text x="24" y="30" font-size="19" font-weight="bold" font-family="sans-serif">복분수 · B1 계산 순서</text><rect x="22" y="54" width="672" height="59" rx="9" fill="#eef3f9" stroke="#8aabbc"/><text x="39" y="90" font-size="17" font-family="monospace">[1] u=x+(1)</text><rect x="22" y="131" width="672" height="59" rx="9" fill="#eef3f9" stroke="#8aabbc"/><text x="39" y="167" font-size="17" font-family="monospace">[2] 2-1/u = (2u-1)/u</text><rect x="22" y="208" width="672" height="59" rx="9" fill="#eef3f9" stroke="#8aabbc"/><text x="39" y="244" font-size="17" font-family="monospace">[3] 2-u/(2u-1)=(3u-2)/(2u-1)</text><rect x="22" y="285" width="672" height="59" rx="9" fill="#e4f4eb" stroke="#8aabbc"/><text x="39" y="321" font-size="17" font-family="monospace">[4] F(x)=(2u-1)/(3u-2)</text><text x="24" y="398" font-family="sans-serif" font-size="13">원래 식의 분모가 0인 입력은 제외한다.</text></svg>