<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420"><title>C2 4중 복분수 해설</title><desc>복분수의 안쪽에서부터 연속해 통분한 네 단계와 최종 간단한 유리식.</desc><rect width="720" height="420" fill="white"/><text x="24" y="30" font-size="19" font-weight="bold" font-family="sans-serif">C2 · 네 단계 연속 통분</text><rect x="22" y="53" width="675" height="60" rx="9" fill="#f1f5fa" stroke="#8facbb"/><text x="39" y="91" font-size="16" font-family="monospace">1. u = x + (2)</text><rect x="22" y="130" width="675" height="60" rx="9" fill="#f1f5fa" stroke="#8facbb"/><text x="39" y="168" font-size="16" font-family="monospace">2. 4 - 1/u = (4u-1)/u</text><rect x="22" y="207" width="675" height="60" rx="9" fill="#f1f5fa" stroke="#8facbb"/><text x="39" y="245" font-size="16" font-family="monospace">3. 1 - u/(4u-1) = (3u-1)/(4u-1)</text><rect x="22" y="284" width="675" height="60" rx="9" fill="#e1f4e9" stroke="#8facbb"/><text x="39" y="322" font-size="16" font-family="monospace">4. F(x) = (3u-1)/(2u-1)</text><text x="24" y="400" font-family="sans-serif" font-size="13">정의되지 않는 입력은 원래 식에서 제외</text></svg>