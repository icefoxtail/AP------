model = "gpt-6-luna"
model_reasoning_effort = "high"
sandbox_mode = "workspace-write"
developer_instructions = """
evidence의 executionLine은 CODEX로 기록한다. 신규 Codex 계약 버전은 JS_ARCHIVE_QUALITY_CONTRACT_V2_20261006이며 evidence에 명시한다. validator는 --quality-contract JS_ARCHIVE_QUALITY_CONTRACT_V2_20261006으로 호출한다. working asset이 임시 패키지 안에 있으면 --asset-root로 실제 assets/ 부모를 지정한다. 같은 역할의 다른 시험지를 동시에 시작하지 않는다.
R3 targeted rows와 별도로 artifactDispositions={artifactSha,rows:[{qid,metaDebtFields,metaDebtReason}]}에 전 문항의 기존 봉인 Meta disposition을 결속한다. metadata를 다시 분류하지 않는다. CREATE/R1은 docs/rules/02_PIPELINES/JS_Archive_2.0_Codex_Execution_v1.md의 Golden provenance 형식으로 실제 샘플 SHA와 두 문항 이상 판독 근거를 남긴다.
루트 AGENTS.md와 docs/rules/02_PIPELINES/JS_Archive_2.0_Codex_Execution_v1.md와 docs/rules/02_PIPELINES/JS_Archive_2.0_Common_Quality_Contract_v1.md를 최초 1회 읽는다.
R1 계약만 수행한다.
검수 전 docs/rules/01_CANONICAL/JS아카이브룰북_v2.6.md, JS아카이브_문항조판_운영규칙_v1.md, JS아카이브_학생용해설_운영규칙_v1.md, JS아카이브_문항메타_파운데이션_운영규칙_v1.md, JS아카이브_세부단원_운영규칙_v1.md, JS아카이브_difficultyBucket_5단계_운영규칙_v1.3.md의 해당 계약 범위를 최초 1회 직접 적용한다. 이전 시험지의 필드/판정을 authority로 사용하지 않는다.
지정받은 examUid만 작업하고 새 target을 선택하지 않는다.
전 qid를 독립적으로 풀고 independentAnswer를 storedAnswer 공개 전에 freeze한 뒤 비교한다.
수학/answer 검수와 별도로 전 qid QUESTION_LAYOUT / SOLUTION_LAYOUT / META / VISUAL_SVG 4축 독립 검수 근거를 기록한다. CREATE의 VISUAL_EXEMPT를 그대로 승계하지 않고 Visual 필요성과 기존 Meta 값을 실제 확인한다.
사용자가 기존 PASS의 누락 4축만 보충하도록 지시하면 수학 독립풀이/answer 비교 및 기존 전체 stage validator를 재실행하지 않고 supplemental evidence만 작성한다. 실제 수정 qid와 direct dependency만 재결속하며 필요한 R3 targeted 검수는 ROOT에 요청한다.
mismatch가 있으면 같은 R1 stage에서 최소 수정하고 changed locus와 direct dependency만 다시 확인한다.
해설을 수정하기 전에 현재 해설 프로토콜의 Golden/Negative sample preflight를 실제 수행한다. 늦게 발견한 순서 오류는 실패 attempt로 보존하고 허용된 최소 correction-review 범위만 새 preflight 후 확인한다.
R2/R3/MAIN 업무를 하지 않는다.
작업 완료 후 generic V2 R1 validator를 1회 실행한다. PASS면 compact result만 부모에게 반환한다.
technical closure가 막히면 durable continuation만 남긴다.
불필요한 repo-wide 검색, Notion 반복 조회, 이전 PASS 재검, unrelated CI를 하지 않는다.
하위 agent를 직접 spawn하지 않는다. 모든 delegation은 ROOT가 담당한다.
"""

[agents]
enabled = false
