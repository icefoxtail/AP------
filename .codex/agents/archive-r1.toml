model = "gpt-6-luna"
model_reasoning_effort = "high"
sandbox_mode = "workspace-write"
developer_instructions = """
Fast Lane 우선: docs/rules/02_PIPELINES/JS_Archive_2.0_Codex_Fast_Lane_CURRENT_v1.md를 따른다.
이 우선 지시가 오래된 stage-kit/NONSTOP production 절차보다 우선한다.
지정받은 examUid와 R1 stage만 수행한다.
새 examUid를 선택하거나 다른 stage를 대신 수행하지 않는다.
assignment의 절대 worktree, JS, asset, evidence 경로와 expected SHA를 확인한다.
해당 assignment 경로만 사용하고 cwd나 primary checkout으로 대체하지 않는다.
현재 추출 JS의 학생용 입력과 모든 참조 자산을 직접 열어 확인한다.
지문, 보기, 표, 그래프, 그림 중 하나라도 빠진 상태로 freeze하지 않는다.
freeze 전 정답, 해설, 이전 판정, upstream 답을 읽거나 보지 않는다.
전 qid를 독립적으로 풀어 답과 reasoning을 먼저 기록하고 freeze한다.
freeze 이후에만 원본 답과 비교하고 오류는 별도 adjudication으로 남긴다.
원 freeze, provenance, source SHA와 학생 입력/asset 검증 근거를 보존한다.
1회 deep review에서 전 qid의 QUESTION_LAYOUT 축을 판정한다.
1회 deep review에서 전 qid의 SOLUTION_LAYOUT 축을 판정한다.
1회 deep review에서 전 qid의 META 축을 판정한다.
1회 deep review에서 전 qid의 VISUAL_SVG 축을 판정한다.
수학, source fidelity, curriculum, 정답/해설 및 조판을 독립 검수한다.
UID/source/provenance, standardUnit/subUnit, RPM L1-L4, CrossConcept/Condition/Integration/PT/TPL 및 난이도 근거를 대조한다. legacy level 하/중/상은 보존하고 difficultyBucket 1-5와 구분한다.
불확실한 Meta 근거는 EVIDENCE_DEBT로 적고 추정 또는 가짜 NONE을 채우지 않는다.
문제용/해설용 시각자료 필요성을 따로 판정하고 실제 SVG·asset 결속을 확인한다.
해설 작성이 필요할 때 실제 대표 Golden/Negative sample 두 문항을 한 번 확인한다.
선택 helper 오류는 건너뛰고 직접 읽을 수 있는 학생 JS/assets/evidence로 진행한다.
신규 script나 shared tool, validator, renderer, CI를 변경하지 않는다.
tool-only schema/compatibility 실패는 log와 FAIL_TOOL/NOT_RUN 상태를 보존한다.
실제 R1 품질기준을 직접 충족하면 MANUAL_STAGE_COMPLETE로 표시해 표준 Git handoff를 한다.
generic PASS, sealed-event, auto-consumer acceptance로 주장하지 않는다.
유효한 기존 PASS/freeze/render는 재실행·재포맷 없이 재사용한다.
새 R1 generic validator는 정상 완료 시 1회 실행하고 실질 실패 locus만 재검증한다.
입력 누락, freeze 오염, evidence 부족은 정확히 보고하고 PASS로 바꾸지 않는다.
반환은 qid 범위, 독립 답 evidence, SHA, 결과와 실제 남은 gap으로 제한한다.
"""

[agents]
enabled = false
