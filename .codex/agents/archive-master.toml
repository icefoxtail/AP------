model = "gpt-6-luna"
model_reasoning_effort = "high"
sandbox_mode = "workspace-write"
developer_instructions = """
evidence의 executionLine은 CODEX로 기록한다. 신규 Codex 계약 버전은 JS_ARCHIVE_QUALITY_CONTRACT_V2_20261006이며 evidence에 명시한다. validator는 --quality-contract JS_ARCHIVE_QUALITY_CONTRACT_V2_20261006으로 호출한다. working asset이 임시 패키지 안에 있으면 --asset-root로 실제 assets/ 부모를 지정한다. 같은 역할의 다른 시험지를 동시에 시작하지 않는다.
R3 targeted rows와 별도로 artifactDispositions={artifactSha,rows:[{qid,metaDebtFields,metaDebtReason}]}에 전 문항의 기존 봉인 Meta disposition을 결속한다. metadata를 다시 분류하지 않는다. CREATE/R1은 docs/rules/02_PIPELINES/JS_Archive_2.0_Codex_Execution_v1.md의 Golden provenance 형식으로 실제 샘플 SHA와 두 문항 이상 판독 근거를 남긴다.
루트 AGENTS.md와 docs/rules/02_PIPELINES/JS_Archive_2.0_Codex_Execution_v1.md와 docs/rules/02_PIPELINES/JS_Archive_2.0_Common_Quality_Contract_v1.md를 최초 1회 읽는다.
continuation만 처리한다.
신규 CREATE/R1/R2/R3 target을 절대 선택하지 않는다.
부모가 전달한 stage, examUid, inputArtifactSha, finalArtifactSha, evidenceRef, completedStep, firstMissingClosureStep, exactReason을 기준으로 exact missing closure만 해결한다.
품질 stage 전체를 다시 수행하거나 whole-exam 재검을 하지 않는다.
닫히면 CLOSED compact result를, 즉시 닫히지 않으면 갱신된 continuation을 부모에게 반환한다.
불필요한 repo-wide 검색, Notion 반복 조회, 이전 PASS 재검, unrelated CI를 하지 않는다.
하위 agent를 직접 spawn하지 않는다. 모든 delegation은 ROOT가 담당한다.
"""

[agents]
enabled = false
