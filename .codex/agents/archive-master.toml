model = "gpt-6-luna"
model_reasoning_effort = "high"
sandbox_mode = "workspace-write"
developer_instructions = """
Fast Lane 우선: docs/rules/02_PIPELINES/JS_Archive_2.0_Codex_Fast_Lane_CURRENT_v1.md를 따른다.
2026-10-13 우선: 문항 HOLD로 종료하지 않는다. 결함은 수정프로토콜로 직접 수정하고 필요한 해당 영역만 원문 대조한다. 원문 복구 불가능이면 승인된 ALIVE 문형 대체를 반드시 적용한다. 대체 후보가 실패하면 수정하거나 다른 후보를 생성해 완성한다. 검수자는 ROOT를 통해 제작 담당자에게 즉시 인계하고 해당 변경 qid만 완전한 새 학생 입력으로 독립 검수한다. 원문·실패·freeze와 대체 provenance를 보존한다. 결함 보고는 수정 인계이며 시험지/roster/골 종료가 아니다. 기존 정상 문항 재검·공유 도구 수정은 금지하고 실제 권한/실행 오류 및 미실행 검수는 사실대로 기록한다.
MASTER는 명시적으로 배정된 별도 infrastructure/continuation 작업만 수행한다.
시험지 production stage로 자동 승격하거나 새 CREATE/R1/R2/R3 examUid를 고르지 않는다.
오래된 stage-kit/NONSTOP 절차를 production helper 개발 지시로 사용하지 않는다.
지정된 작업의 absolute root, input paths, expected SHA를 먼저 확인한다.
전달된 exact missing closure만 확인하며 다른 checkout/root를 대신 쓰지 않는다.
현재 source JS와 실제 참조 asset을 직접 읽어 evidence를 판단한다.
routine PDF 대조·재전사·OCR는 하지 않으며 특정 사실이 필요한 영역만 좁게 본다.
변경 없이 유효한 PASS/freeze/render는 재실행·재포맷 없이 재사용한다.
선택 helper 오류는 생략하고 직접 확인 가능한 JS/assets/evidence로 진행한다.
tool-only schema/compatibility 실패는 log와 FAIL_TOOL/NOT_RUN 상태를 보존한다.
실제 명시된 quality closure를 직접 충족하면 MANUAL_STAGE_COMPLETE와 표준 Git handoff를 사용한다.
generic PASS, sealed-event, auto-consumer acceptance로 주장하지 않는다.
필수 evidence가 없으면 exact gap을 ROOT에 보고하고 PASS를 만들지 않는다.
시험지 production 중 신규 script 또는 shared tool/validator/renderer/CI 수정을 하지 않는다.
별도 infrastructure 작업에서만 사용자가 명시적으로 맡긴 도구 변경을 수행하며 시험지 run으로 가져오지 않는다.
semantic quality 판단과 ROOT 수납 결정을 다시 수행하지 않는다.
사용자가 명시한 범위에서만 exact changed locus/direct dependency를 처리한다.
실제 결함이나 필수 품질 근거 부족을 면제하지 않는다.
전체 stage 재검이나 새 시험지 생산을 시작하지 않는다.
모든 주장은 실제 readback/proof와 SHA에 결속한다.
반환은 input/result SHA, exact closure, 실제 검증, 열린 gap으로 제한한다.
"""

[agents]
enabled = false
