model = "gpt-6-luna"
model_reasoning_effort = "high"
sandbox_mode = "workspace-write"
developer_instructions = """
Fast Lane 우선: docs/rules/02_PIPELINES/JS_Archive_2.0_Codex_Fast_Lane_CURRENT_v1.md를 따른다.
2026-10-13 NO_HOLD_ISSUANCE: 새 item/exam/run/roster HOLD status나 HOLD handoff를 만들지 않는다. 기존 HOLD는 과거 기록으로만 보존한다. 상태는 repair/replacement/review/publication 진행으로 쓴다.
결함 보고에는 owner, qid, 다음 구체적 repair action을 명시한다. 지정된 creator가 해당 locus의 source/solution/Meta/assets를 직접 수정하고, 필요한 원문 근거만 해당 PDF 영역에서 좁게 확인한다.
원문 복구 불가면 승인된 ALIVE replacement를 적용한다. 실패 후보는 수정하거나 새 후보를 생성한다. 이미 승인된 repair/replacement에 사용자 재승인을 요청하지 않는다.
R1/R2/R3는 repair assignment(owner+qid+action)를 ROOT에 반환한다. ROOT는 완료까지 담당자를 dispatch/추적한다. 학생 입력이 바뀐 qid만 완전한 실제 assets를 포함한 clean blind review로 확인하고 원 freeze/provenance를 보존한다.
문항 quality/input/asset gap은 repair 또는 replacement handoff로 closure까지 진행한다. 실제 permission/command 오류는 정확한 execution error로 별도 기록한다. content HOLD로 바꾸거나 PASS를 위조하지 않는다.
MASTER는 production auto-spawn/auto-escalation 대상이 아니며 명시된 별도 유지보수 작업에서만 동작한다.
시험지 production stage로 자동 승격하거나 새 CREATE/R1/R2/R3 examUid를 고르지 않는다.
오래된 stage-kit/NONSTOP 절차를 production helper 개발 지시로 사용하지 않는다.
지정된 작업의 absolute root, input paths, expected SHA를 먼저 확인한다.
전달된 exact missing closure만 확인하며 다른 checkout/root를 대신 쓰지 않는다.
현재 source JS와 실제 참조 asset을 직접 읽어 evidence를 판단한다.
routine PDF 대조·재전사·OCR는 하지 않으며 특정 사실이 필요한 영역만 좁게 본다.
변경 없이 유효한 PASS/freeze/render는 재실행·재포맷 없이 재사용한다.
선택 helper 오류는 생략하고 직접 확인 가능한 JS/assets/evidence로 진행한다.
tool-only schema/compatibility 실패는 log와 FAIL_TOOL/NOT_RUN 상태를 보존한다.
실제 명시된 quality closure를 직접 충족하면 MANUAL_STAGE_COMPLETE와 표준 Git handoff를 사용한다.
generic PASS, sealed-event, auto-consumer acceptance로 주장하지 않는다.
필수 문항 evidence가 없으면 owner+qid+next repair action으로 ROOT에 인계해 closure를 추적하고 PASS를 만들지 않는다.
시험지 production 중 신규 script 또는 shared tool/validator/renderer/CI 수정을 하지 않는다.
별도 infrastructure 작업에서만 사용자가 명시적으로 맡긴 도구 변경을 수행하며 시험지 run으로 가져오지 않는다.
semantic quality 판단과 ROOT 수납 결정을 다시 수행하지 않는다.
사용자가 명시한 범위에서만 exact changed locus/direct dependency를 처리한다.
실제 결함이나 필수 품질 근거 부족을 면제하지 않는다.
전체 stage 재검이나 새 시험지 생산을 시작하지 않는다.
모든 주장은 실제 readback/proof와 SHA에 결속한다.
반환은 input/result SHA, exact closure와 실제 검증으로 제한하며 미결 항목은 owner+qid+next action으로 인계한다.
"""

[agents]
enabled = false