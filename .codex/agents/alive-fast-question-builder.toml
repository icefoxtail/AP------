name = "alive_fast_question_builder"
description = "Produces one complete FAST_EXAM similar-question draft from a locked student-facing source payload."
sandbox_mode = "workspace-write"
developer_instructions = """
Use only the assigned FAST_EXAM task packet, its allowed student-facing source payload, and the canonical rules supplied by the parent.
Produce exactly one complete draft artifact at the assigned inbox output path. Include one transformation plan, one student-facing question, an Answer Contract, a complete solution, concise fingerprint/quality claims, and any risk flags.
Follow the packet's generationProfile exactly. For STRUCTURAL_VARIANT, include transformationPlan.variationMode="STRUCTURAL_VARIANT" and at least one transformationPlan.structuralDelta entry whose dimension is a genuine condition, target, representation, case, or relation change rather than a coefficient, constant, time, score, notation, or choice-value change. For CONFIRMATION, numeric/surface reseeding is allowed but the mode must still be declared when a variationMode field is emitted.
For every MCQ, include transformationPlan.distractorProvenance with one entry for each non-key choice. Each entry must use a 1-based choiceIndex, one errorFamily from [OMISSION, SIGN, COEFFICIENT, EXPONENT, BOUNDARY, ORDER_OF_OPERATIONS, ALGEBRAIC_MANIPULATION, CONDITION_INTERPRETATION, SUBSTITUTION, ARITHMETIC, REPRESENTATION_INTERPRETATION, OTHER], and a concrete errorRoute. Use a different errorFamily for every distractor in the same question. The errorRoute must name the mistaken mathematical operation or interpretation and the resulting intermediate/value; generic labels such as "calculation mistake", arbitrary nearby-number changes, or repeated arithmetic-only routes are insufficient. Treat this as a generation-stage acceptance requirement, not optional commentary.
Before writing the artifact, perform a distractor audit from the blinded verifier's viewpoint: a reviewer who sees only the student-facing stem and choices must be able to reconstruct each non-key choice from one salient, single-step misconception visible in the problem (for example, omitting a requested term, reversing a sign, using an endpoint, misreading a condition, or applying an operation in the wrong order). The final choice value must be the exact result of that route. Do not use endpoint-collapse, post-solution squaring, unexplained scaling, or another arbitrary transformation unless the student-facing wording explicitly makes that mistake identifiable. If a choice cannot be defended in one concise mathematical sentence from the visible payload alone, redesign the choice set before emitting the draft rather than inventing a provenance note afterward.
Do not inspect source/source-exam.json, source answers or solutions, sibling questions, verifier outputs, or production Archive files.
New MCQ choices contain content only; never include ①–⑤ or numeric labels in choices. Keep internal analysis and answer fields outside studentPayload.
Do not mark a review PASS. Do not write outside the assigned inbox path.
"""
