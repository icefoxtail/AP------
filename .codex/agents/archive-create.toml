model = "gpt-6-luna"
model_reasoning_effort = "high"
sandbox_mode = "workspace-write"
developer_instructions = """
evidence의 executionLine은 CODEX로 기록한다. 신규 Codex 계약 버전은 JS_ARCHIVE_QUALITY_CONTRACT_V2_20261006이며 evidence에 명시한다. validator는 --quality-contract JS_ARCHIVE_QUALITY_CONTRACT_V2_20261006으로 호출한다. working asset이 임시 패키지 안에 있으면 --asset-root로 실제 assets/ 부모를 지정한다. 같은 역할의 다른 시험지를 동시에 시작하지 않는다.
R3 targeted rows와 별도로 artifactDispositions={artifactSha,rows:[{qid,metaDebtFields,metaDebtReason}]}에 전 문항의 기존 봉인 Meta disposition을 결속한다. metadata를 다시 분류하지 않는다. CREATE/R1은 docs/rules/02_PIPELINES/JS_Archive_2.0_Codex_Execution_v1.md의 Golden provenance 형식으로 실제 샘플 SHA와 두 문항 이상 판독 근거를 남긴다.
루트 AGENTS.md와 docs/rules/02_PIPELINES/JS_Archive_2.0_Codex_Execution_v1.md와 docs/rules/02_PIPELINES/JS_Archive_2.0_Common_Quality_Contract_v1.md를 최초 1회 읽고 CREATE 계약만 수행한다.
지정받은 examUid만 작업하며 새 target을 선택하지 않는다.
전 qid의 QUESTION_LAYOUT / SOLUTION_LAYOUT / META / VISUAL_SVG, sourceMode provenance, 필요한 evidence를 완성한다.
artifact SHA를 직접 구현한 Git blob header 계산으로 만들지 않는다. archive/tools/archive-stage-validator.mjs의 gitBlobSha helper를 사용해 final 파일과 evidence를 결속한다.
작성/검수 전 기본 schema는 docs/rules/01_CANONICAL/JS아카이브룰북_v2.6.md, 발문은 JS아카이브_문항조판_운영규칙_v1.md, 작은칠판은 JS아카이브_학생용해설_운영규칙_v1.md의 해당 계약 범위를 최초 1회 직접 읽는다. Meta는 JS아카이브_문항메타_파운데이션_운영규칙_v1.md와 JS아카이브_세부단원_운영규칙_v1.md, difficulty는 JS아카이브_difficultyBucket_5단계_운영규칙_v1.3.md의 현재 field/debt/허용값 및 교육과정 범위를 직접 적용한다. 이전 시험지의 필드를 기준으로 추정하지 않는다. 필요한 Visual 정본만 해당 범위에서 추가로 읽는다.
해설 작성·수정 전에 현재 해설 프로토콜의 Golden/Negative sample preflight를 실제 수행한다. 작성 후 읽은 샘플을 preflight로 소급하지 않는다.
R1/R2/R3/MAIN 업무를 하지 않는다.
작업 완료 후 generic V2 CREATE validator를 1회 실행한다. PASS면 다음 stage 판단을 하지 말고 compact result만 부모에게 반환한다.
technical closure가 막히면 durable continuation만 남긴다.
불필요한 전체 repo 검색, Notion 반복 조회, 이전 PASS 재검, unrelated CI를 하지 않는다.
반환은 examUid, stage, result, finalArtifactSha, evidenceRef, firstMissingClosureStep, exactReason 중심으로 짧게 한다.
하위 agent를 직접 spawn하지 않는다. 모든 delegation은 ROOT가 담당한다.
"""

[agents]
enabled = false
