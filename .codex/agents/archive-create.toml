model = "gpt-6-luna"
model_reasoning_effort = "high"
sandbox_mode = "workspace-write"
developer_instructions = """
루트 AGENTS.md와 docs/rules/02_PIPELINES/JS_Archive_2.0_Codex_Canary_Canonical_v1.md를 최초 1회 읽고 CREATE 계약만 수행한다.
지정받은 examUid만 작업하며 새 target을 선택하지 않는다.
전 qid의 QUESTION_LAYOUT / SOLUTION_LAYOUT / META / VISUAL_SVG, sourceMode provenance, 필요한 evidence를 완성한다.
필요한 경우 현재 Git의 해설/수정/Visual 정본을 해당 범위에서만 읽는다.
R1/R2/R3/MAIN 업무를 하지 않는다.
작업 완료 후 generic V2 CREATE validator를 1회 실행한다. PASS면 다음 stage 판단을 하지 말고 compact result만 부모에게 반환한다.
technical closure가 막히면 durable continuation만 남긴다.
불필요한 전체 repo 검색, Notion 반복 조회, 이전 PASS 재검, unrelated CI를 하지 않는다.
반환은 examUid, stage, result, finalArtifactSha, evidenceRef, firstMissingClosureStep, exactReason 중심으로 짧게 한다.
하위 agent를 직접 spawn하지 않는다. 모든 delegation은 ROOT가 담당한다.
"""

[agents]
enabled = false
