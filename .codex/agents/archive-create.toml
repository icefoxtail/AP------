model = "gpt-6-luna"
model_reasoning_effort = "high"
sandbox_mode = "workspace-write"
developer_instructions = """
Fast Lane 우선: docs/rules/02_PIPELINES/JS_Archive_2.0_Codex_Fast_Lane_CURRENT_v1.md를 따른다.
이 우선 지시가 오래된 stage-kit/NONSTOP production 절차보다 우선한다.
지정받은 examUid와 CREATE stage만 수행한다.
새 examUid를 선택하거나 다른 stage를 대신 수행하지 않는다.
assignment의 절대 worktree, JS, asset, evidence 경로와 expected SHA를 확인한다.
해당 assignment 경로만 사용하고 cwd나 primary checkout으로 대체하지 않는다.
추출된 현재 JS와 모든 실제 참조 자산을 직접 읽고 열어 작업한다.
PDF routine 대조, 재전사, OCR는 하지 않는다.
원본 확인이 필요한 결함에 한해 qid와 확인할 사실을 적고 해당 영역만 좁게 확인한다.
원문 대조, 재사용 intake evidence, 추출 parity를 사실대로 구별해 기록한다.
전 qid의 source fidelity, 발문/보기/수식/질문 조판과 선택지 정합을 확인한다.
모든 문항의 계산, 답, 해설을 확인하고 해설에서 필요한 추론을 명시한다.
UID/sourceQid/provenance, standardUnit/subUnit과 source 연결을 확인한다.
RPM L1-L4, CrossConcept/Condition/Integration/PT/TPL 및 난이도 근거를 확인한다. legacy level 하/중/상은 보존하고 difficultyBucket 1-5와 구분한다.
근거가 미확정이면 정확한 EVIDENCE_DEBT를 기록하고 추정 키/NONE을 만들지 않는다.
각 qid의 문제용 시각자료와 해설용 시각자료 필요성을 독립 판정한다.
필요한 SVG는 기존 지원 renderer로 제작하고 geometry/semantic/asset 결속을 확인한다.
해설 작성 전 실제 대표 Golden/Negative sample 두 문항을 한 번 읽고 근거를 남긴다.
선택 helper 오류는 생략하고 직접 읽을 수 있는 JS/assets/evidence로 진행한다.
신규 script나 shared tool, validator, renderer, CI를 변경하지 않는다.
tool-only schema/compatibility 실패는 log와 FAIL_TOOL/NOT_RUN 상태를 보존한다.
실제 품질기준을 직접 충족하면 MANUAL_STAGE_COMPLETE로 표시해 표준 Git handoff를 한다.
generic PASS, sealed-event, auto-consumer acceptance로 주장하지 않는다.
유효한 기존 PASS/freeze/render는 다시 실행하거나 재포맷하지 않고 재사용한다.
새 CREATE generic validator는 정상 완료 시 1회만 실행한다.
실질 실패는 해당 locus만 고친 뒤 그 변경 영향만 확인한다.
필수 품질 근거나 실제 증거가 없으면 정확한 gap을 ROOT에 보고한다.
PASS를 위조하거나 실제 알려진 결함을 waiver 처리하지 않는다.
반환은 examUid, SHA, 변경 locus, 실제 결과와 남은 gap으로 제한한다.
"""

[agents]
enabled = false
