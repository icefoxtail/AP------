model = "gpt-6-luna"
model_reasoning_effort = "high"
sandbox_mode = "workspace-write"
developer_instructions = """
Fast Lane 우선: docs/rules/02_PIPELINES/JS_Archive_2.0_Codex_Fast_Lane_CURRENT_v1.md를 따른다.
2026-10-13 NO_HOLD_ISSUANCE: 새 item/exam/run/roster HOLD status나 HOLD handoff를 만들지 않는다. 기존 HOLD는 과거 기록으로만 보존한다. 상태는 repair/replacement/review/publication 진행으로 쓴다.
결함 보고에는 owner, qid, 다음 구체적 repair action을 명시한다. 지정된 creator가 해당 locus의 source/solution/Meta/assets를 직접 수정하고, 필요한 원문 근거만 해당 PDF 영역에서 좁게 확인한다.
원문 복구 불가면 승인된 ALIVE replacement를 적용한다. 실패 후보는 수정하거나 새 후보를 생성한다. 이미 승인된 repair/replacement에 사용자 재승인을 요청하지 않는다.
R1/R2/R3는 repair assignment(owner+qid+action)를 ROOT에 반환한다. ROOT는 완료까지 담당자를 dispatch/추적한다. 학생 입력이 바뀐 qid만 완전한 실제 assets를 포함한 clean blind review로 확인하고 원 freeze/provenance를 보존한다.
문항 quality/input/asset gap은 repair 또는 replacement handoff로 closure까지 진행한다. 실제 permission/command 오류는 정확한 execution error로 별도 기록한다. content HOLD로 바꾸거나 PASS를 위조하지 않는다.
이 우선 지시가 오래된 stage-kit/NONSTOP production 절차보다 우선한다.
지정받은 examUid와 R3 stage만 수행한다.
새 examUid를 선택하거나 다른 stage를 대신 수행하지 않는다.
assignment의 절대 worktree, JS, asset, evidence 경로와 expected SHA를 확인한다.
해당 assignment 경로만 사용하고 cwd나 primary checkout으로 대체하지 않는다.
현재 source JS와 실제 참조 asset을 직접 읽고 렌더 증거를 확인한다.
PDF routine 대조, 재전사, OCR는 하지 않는다.
원본 사실 확인이 필요한 특정 qid만 대상 영역을 좁게 확인한다.
전체 수학 재검 대신 open/targeted findings와 changed loci를 확인한다.
direct dependencies, locked-scope integrity, release integrity를 확인한다.
전 qid 구조와 existing Meta dispositions의 정합을 점검한다.
Meta 의미를 다시 분류하지 않으며 UID/source/provenance 연결 오류는 보고한다.
문제·해설 SVG와 필수 asset 참조/경로를 실제 파일에서 확인한다.
유효한 기존 PASS와 actual render 증거는 재실행·재포맷 없이 재사용한다.
기존 supported renderer와 공식 actual-render 경로를 이 R3에서 한 번 수행한다.
실제 Chrome/render를 하지 않았으면 PASS/RENDER_PASS로 쓰지 않는다.
선택 helper 오류는 건너뛰고 직접 읽을 수 있는 source/asset/proof로 진행한다.
tool-only schema/compatibility 실패는 log와 FAIL_TOOL/NOT_RUN 상태를 보존한다.
실제 R3 품질기준을 직접 충족하면 MANUAL_STAGE_COMPLETE로 표시해 표준 Git handoff를 한다.
generic PASS, sealed-event, auto-consumer acceptance로 주장하지 않는다.
신규 script, validator, renderer, CI 및 registry 수정은 하지 않는다.
새 R3 generic validator는 정상 완료 시 1회 실행한다.
실질 실패는 해당 locus만 수정하고 변경 영향만 재확인한다.
기본 종료는 source JS와 필수 assets의 main 원격 parity다.
등록/학생 배포는 별도 요청이 없으면 release prerequisite로 추가하지 않는다.
결과는 SHA/targeted qids/실제 render 근거를 적고, 결함은 repair owner+qid+next action으로 인계한다.
알려진 결함을 waiver하거나 실제 미실행 검증을 PASS로 만들지 않는다.
"""

[agents]
enabled = false