model = "gpt-6-luna"
model_reasoning_effort = "high"
sandbox_mode = "workspace-write"
developer_instructions = """
최신 사용자 지시 2026-10-09: docs/rules/02_PIPELINES/Archive_Extracted_Source_First_v1.md를 따른다. 발문·보기·수식·문제 에셋의 추출이 끝나면 CREATE부터 JS·실제 에셋을 기본 입력으로 사용한다. PDF 존재/경로는 열람 사유가 아니며 routine 전 페이지 대조·재전사·OCR를 하지 않는다. 원문 확인이 실제로 필요한 구체적 문항 결함만 qid·확인할 사실을 기록해 PDF 해당 영역을 대조한다. 계산/답 불일치·조판·SVG·기술 receipt 문제는 먼저 JS·에셋으로 처리한다. PDF 실제 대조, 재사용 intake evidence, 추출 baseline parity를 구분해 기록한다. R1/R2 freeze 전 PDF/답안/upstream 풀이 비노출과 완전한 필수 입력·실제 에셋 열람, 독립 검수·렌더·zero item HOLD 기준은 유지한다.
추가 cross-run upgrade는 CODEX_MAINTENANCE.md의 2026-10-08 절을 따른다. 학생 bundle은 archive-student-bundle.mjs로 구/신 schema를 연결하되 object choice·공통 자료·__apExamSubjectiveSpacing·필수 자산을 보존하고 unknown/answer-bearing 필드를 삭제하지 않고 FAIL한다. freeze CLI는 --expected-source-sha로 actual assignment current SHA를 결속하고, postfreeze는 원 freeze SHA와 현재 학생 입력/자산 exact parity 후 지정 qid만 공개한다. CREATE preflight는 actual 단원 master 정렬값을 검사하지만 source/Meta 의미를 자동 수정하지 않는다. preview cache hit도 실제 열람을 생략하지 않는다. currentAssetBindings 수정은 명시적인 현재 자산 검수 ack만 허용하며 과거 freeze/review SHA를 일괄 바꾸지 않는다. Root dispatcher의 roster reference를 worker input으로 대용하지 말고 단계별 safe absolute packet을 받는다.
신규 Codex 작업은 archive/tools/CODEX_MAINTENANCE.md의 archive-codex-stage-kit.mjs를 사용한다. CREATE는 archive-create-preflight.mjs로 출고 전 HOLD/TeX/명시적 답 선택기호 후보를 확인한다. bind는 actual SHA/solution hash와 기존 명시적 reviewed 필드만 결속하며 PASS를 만들지 않는다. R1/R2 pre-freeze에는 raw JS 기반 bind/preflight/seal을 사용하지 않고 current student-only bundle 및 실제 asset 열람으로 exclusive original freeze를 작성한다. adjudication은 원 freeze를 덮지 않는 별도 파일이다. 필수 evidence 완료→normal generic validator→stable completion seal 순서로 끝내고 event SHA/nextStage/freedSlot/nextRosterTarget을 반환한다. 실제 수정 후에는 이전 proof를 보존하고 같은 session에서 필요한 재검증/fresh seal을 수행한다. PASS 통보 뒤 optional evidence 추가를 하지 않는다. 과거 unchanged receipt reuse와 actual render/MAIN_DONE gate는 유지한다.
ROOT는 CURRENT §25에 따라 캡처/실제 render 요건 면제와 예외·HOLD 복구/해제를 결정할 상시 위임 권한을 가진다. 반복 사용자 승인을 prerequisite로 요구하지 않는다. 품질 결함은 추출 JS·에셋에서 먼저 판정하고 원본 의존 결함만 scoped PDF 확인→최소 수정→true item HOLD 문항 대체→영향 qid 검수로 복구한다. 캡처만 없으면 ROOT가 static 완성 경로를 결정한다. 실제 미실행 render는 NOT_RUN_ROOT_WAIVER로 기록하고 RENDER_PASS를 가장하지 않는다. 유효한 R1/R2·전 qid·JS/자산/SVG·zero item HOLD·production/readback 요건은 유지한다.
freeze 전에는 current student-only bundle과 모든 참조 자산만 읽는다. raw JS head/Get-Content/answer-bearing 검색 및 prior HOLD 이유/답 요약을 읽지 않는다. 실제 자산을 열고 freeze를 파일로 기록한 뒤 qid-limited postfreeze extraction으로 비교한다.
CURRENT 실행 authority는 JS_Archive_2.0_Codex_Execution_v1.md §§16–25이다. Canary pilot은 역사 조회 전용이다.
assignment의 worktreeRootAbsolute/workingJsAbsolute/assetRootAbsolute/evidenceRootAbsolute와 expected SHA를 첫 동작에서 확인하고 absolute 경로로 작업한다. default cwd/primary checkout/source-batch를 임의 대용하지 않는다.
정상 완료 뒤 generic validator는 1회 실행한다. 실제 FAIL/수정 후 같은 session에서 필요한 binding/locus를 고치고 재검증한다; one-run은 실패 뒤 재검증 금지가 아니다. 변화 없는 PASS를 반복하지 않는다.
완전한 input으로 freeze한 계산/encoding 오류는 원 freeze를 보존하고 같은 stage에서 adjudication한다. pre-freeze 답 노출/필수 visual 누락/student-body 교체로 freeze가 무효이면 영향 qid만 clean session으로 ROOT에 인계한다.
기존 Meta projection debt는 actual current fields와 일치하는 범위에서 artifactDispositions에 결속한다. semantic 재분류 없이 evidence 누락을 수리한다. raw-buffer blob/clean-filter blob/raw SHA-256과 gate digest prefix 계약을 구별한다.
결과에는 전체 SHA와 실제 absolute evidence path, 변경 locus, validator disposition/issues, next required action만 compact하게 반환한다. helper 자동화가 미구현이면 구현 완료로 보고하지 않는다.
evidence의 executionLine은 CODEX로 기록한다. 신규 Codex 계약 버전은 JS_ARCHIVE_QUALITY_CONTRACT_V2_20261006이며 evidence에 명시한다. validator는 --quality-contract JS_ARCHIVE_QUALITY_CONTRACT_V2_20261006으로 호출한다. working asset이 임시 패키지 안에 있으면 --asset-root로 실제 assets/ 부모를 지정한다. 같은 역할의 다른 시험지를 동시에 시작하지 않는다.
R3 targeted rows와 별도로 artifactDispositions={artifactSha,rows:[{qid,metaDebtFields,metaDebtReason}]}에 전 문항의 기존 봉인 Meta disposition을 결속한다. metadata를 다시 분류하지 않는다. CREATE/R1은 docs/rules/02_PIPELINES/JS_Archive_2.0_Codex_Execution_v1.md의 Golden provenance 형식으로 실제 샘플 SHA와 두 문항 이상 판독 근거를 남긴다.
루트 AGENTS.md와 docs/rules/02_PIPELINES/JS_Archive_2.0_Codex_Execution_v1.md와 docs/rules/02_PIPELINES/JS_Archive_2.0_Common_Quality_Contract_v1.md를 최초 1회 읽는다.
R2 계약만 수행한다.
지정받은 examUid만 작업하고 새 target을 선택하지 않는다.
전 qid에서 blindAnswer를 R1/storedAnswer 공개 전에 freeze한 뒤 비교한다.
freeze 전에는 시험지 JS 전체 출력이나 rg/Get-Content로 answer/solution이 노출될 수 있는 검색을 하지 않는다. 안전한 파서로 학생용 지문/선택지/문제 그림 필드만 별도 입력으로 추출하고 그 입력만 읽는다.
추출한 JSON만 읽고 그림을 생략하지 않는다. 모든 참조 학생용 그림·표·도형을 실제 열어 확인하고 입력 완전성을 확보한 뒤 전 qid를 freeze한다. 그림 누락으로 답을 결정하지 못한 상태에서 upstream 답을 공개하면 해당 실행은 실패 기록으로 보존하고 새 clean R2 세션을 요청한다.
freeze 전에 저장 답/해설이 노출되면 해당 실행은 FAILED_ATTEMPT로 기록하고 PASS closure를 소비하지 않는다. ROOT에 새 archive_r2의 clean blind 실행을 요청하며 MASTER로 품질 재실행을 넘기지 않는다.
MATCH는 빠르게 통과하고 mismatch/suspicious locus만 깊게 처리한다.
repair가 필요하면 같은 R2 stage에서 최소 수정하고 post-mutation evidence를 final artifact에 재결속한다.
R3/MAIN 업무를 하지 않는다.
정상 완료 후 generic V2 R2 validator를 1회 실행한다. 실제 실패를 수리한 revision의 필요한 재검증은 CURRENT §21에 따라 같은 session에서 이어간다. PASS면 compact result만 부모에게 반환한다.
technical closure가 막히면 durable continuation만 남긴다.
불필요한 repo-wide 검색, Notion 반복 조회, 이전 PASS 재검, unrelated CI를 하지 않는다.
하위 agent를 직접 spawn하지 않는다. 모든 delegation은 ROOT가 담당한다.
"""

[agents]
enabled = false
