<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="robots" content="noindex">
    <title>AP Math 학생 포털로 이동</title>
    <!--
      2026-11-01 사용자 결정: 오답 제출은 학생 포털(apmath/student/)에서 한다.
      이미 인쇄된 옛 제출 QR(../check/?class=...&exam=...&date=...&q=...&archiveFile=...)을
      찍은 학생이 빈 화면을 보지 않도록, 학생 포털의 OMR 목록(omr=1)으로 넘겨 준다.
      학생 포털이 읽는 쿼리 키는 omr(과 wrong_clinic)뿐이라 옛 키(class, exam, date, q 등)는 넘기지 않는다.
    -->
    <style>
        body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #F2F4F6; color: #191F28; font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; line-height: 1.6; }
        main { max-width: 420px; margin: 0 16px; padding: 28px 24px; background: #fff; border-radius: 24px; box-shadow: 0 4px 16px rgba(0,0,0,0.06); text-align: center; }
        p { margin: 0 0 16px; font-size: 16px; }
        p:last-child { margin-bottom: 0; }
        a { color: #1A5CFF; font-weight: 700; font-size: 16px; }
    </style>
</head>
<body>
    <main>
        <p>오답 제출은 학생 포털에서 합니다.<br>학생 포털로 이동하는 중입니다.</p>
        <p><a id="portal-link" href="../apmath/student/?omr=1">자동으로 이동하지 않으면 여기를 눌러 학생 포털로 가기</a></p>
    </main>
    <script>
        (function () {
            var target = '../apmath/student/?omr=1';
            try { window.location.replace(target); } catch (e) { window.location.href = target; }
        })();
    </script>
</body>
</html>
