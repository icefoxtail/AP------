<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" role="img" aria-label="3행 3열 격자점과 거리 1인 가로세로 인접 쌍 12개">
<rect width="600" height="480" fill="#fff"/>
<text x="36" y="45" font-size="22" font-family="Noto Sans CJK KR, NanumGothic, sans-serif" font-weight="bold">거리 1인 쌍만 제외</text>
<text x="36" y="77" font-size="16" font-family="Noto Sans CJK KR, NanumGothic, sans-serif">가로 6쌍 + 세로 6쌍 = 12쌍</text>
<g stroke="#cf4c35" stroke-width="6" stroke-linecap="round">
<path d="M135 145H255H375 M135 255H255H375 M135 365H255H375"/>
<path d="M135 145V255V365 M255 145V255V365 M375 145V255V365"/>
</g>
<g fill="#192c45" stroke="#fff" stroke-width="2">
<circle cx="135" cy="145" r="9"/><circle cx="255" cy="145" r="9"/><circle cx="375" cy="145" r="9"/>
<circle cx="135" cy="255" r="9"/><circle cx="255" cy="255" r="9"/><circle cx="375" cy="255" r="9"/>
<circle cx="135" cy="365" r="9"/><circle cx="255" cy="365" r="9"/><circle cx="375" cy="365" r="9"/>
</g>
<g font-family="Noto Sans CJK KR, NanumGothic, sans-serif" font-size="16" fill="#192c45" text-anchor="middle">
<text x="90" y="127">(1,4)</text><text x="210" y="127">(2,4)</text><text x="330" y="127">(3,4)</text>
<text x="90" y="237">(1,3)</text><text x="210" y="237">(2,3)</text><text x="330" y="237">(3,3)</text>
<text x="90" y="347">(1,2)</text><text x="210" y="347">(2,2)</text><text x="330" y="347">(3,2)</text>
</g>
<text x="420" y="245" font-size="15" font-family="Noto Sans CJK KR, NanumGothic, sans-serif" fill="#cf4c35">빨간 선: 거리 1</text>
<text x="36" y="440" font-size="16" font-family="Noto Sans CJK KR, NanumGothic, sans-serif" fill="#192c45">대각선은 √2 &gt; 1이므로 제외하지 않습니다.</text>
</svg>