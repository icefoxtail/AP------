<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" role="img" aria-label="확률밀도 f(x)=1-x/2와 k=1에서 오른쪽 삼각형 넓이 1/4">
<rect width="640" height="440" fill="#fff"/>
<text x="36" y="38" font-size="22" font-family="Noto Sans CJK KR, NanumGothic, sans-serif" font-weight="bold">f(x) = 1 − x/2</text>
<g stroke="#4b5563" stroke-width="2" fill="none"><path d="M90 350H560 M90 350V65"/></g>
<polygon points="320,350 320,215 550,350" fill="#b8d8f5" stroke="none"/>
<path d="M90 80L550 350" fill="none" stroke="#24456c" stroke-width="3.5"/>
<path d="M320 215V350" fill="none" stroke="#b14b38" stroke-width="2" stroke-dasharray="7 6"/>
<g font-family="Noto Sans CJK KR, NanumGothic, sans-serif" font-size="18" fill="#182a40"><text x="68" y="375">0</text><text x="308" y="377">1</text><text x="545" y="378">2</text><text x="565" y="354">x</text><text x="66" y="80">1</text><text x="326" y="211">1/2</text><text x="155" y="82">f(0)=1</text><text x="345" y="310">g(1)=1/4</text></g>
<text x="38" y="415" font-family="Noto Sans CJK KR, NanumGothic, sans-serif" font-size="16" fill="#182a40">밑변 2−1=1, 높이 f(1)=1/2 → 삼각형 넓이 1/4</text>
</svg>