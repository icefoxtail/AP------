<svg xmlns="http://www.w3.org/2000/svg" width="760" height="390" viewBox="0 0 760 390" role="img" aria-label="22번 문항 조건에 맞춘 해설 보조 시각자료" data-uid="BV-BAKBAL-H-COM2-P131-Q08-T1-R1"><rect x="1" y="1" width="758" height="388" rx="16" fill="#ffffff" stroke="#d5dfeb" stroke-width="2" /><rect x="15" y="13" width="730" height="58" rx="11" fill="#e9f4ff" stroke="none" stroke-width="1" /><text x="34" y="52" fill="#172b46" font-size="25" font-weight="700" font-family="Noto Sans CJK KR, sans-serif" text-anchor="start">22  |  대칭차 연산의 항등원·자기 연산</text><line x1="25" y1="336" x2="735" y2="336" stroke="#d8e3ed" stroke-width="1.5" stroke-linecap="round" /><text x="30" y="365" fill="#55677e" font-size="18" font-weight="400" font-family="Noto Sans CJK KR, sans-serif" text-anchor="start">대칭차는 한쪽에만 속한 원소들의 집합</text><rect x="25" y="95" width="710" height="91" rx="13" fill="#f5faff" stroke="#d5dfeb" stroke-width="1.5" /><text x="43" y="126" fill="#172b46" font-size="19" font-weight="700" font-family="Noto Sans CJK KR, sans-serif" text-anchor="start">핵심 조건</text><text x="43" y="159" fill="#172b46" font-size="23" font-weight="400" font-family="Noto Sans CJK KR, sans-serif" text-anchor="start">A Δ B = (A − B) ∪ (B − A)</text><rect x="25" y="198" width="710" height="122" rx="13" fill="#f1fbf7" stroke="#d5dfeb" stroke-width="1.5" /><text x="43" y="229" fill="#172b46" font-size="19" font-weight="700" font-family="Noto Sans CJK KR, sans-serif" text-anchor="start">결론</text><text x="43" y="262" fill="#172b46" font-size="22" font-weight="400" font-family="Noto Sans CJK KR, sans-serif" text-anchor="start">A Δ A = ∅,  U ≠ ∅이므로 ∅ ≠ U</text></svg>