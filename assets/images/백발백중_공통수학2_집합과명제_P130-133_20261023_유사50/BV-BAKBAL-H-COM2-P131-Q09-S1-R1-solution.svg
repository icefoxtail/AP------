<svg xmlns="http://www.w3.org/2000/svg" width="760" height="390" viewBox="0 0 760 390" role="img" aria-label="26번 문항 조건에 맞춘 해설 보조 시각자료" data-uid="BV-BAKBAL-H-COM2-P131-Q09-S1-R1"><rect x="1" y="1" width="758" height="388" rx="16" fill="#ffffff" stroke="#d5dfeb" stroke-width="2" /><rect x="15" y="13" width="730" height="58" rx="11" fill="#e9f4ff" stroke="none" stroke-width="1" /><text x="34" y="52" fill="#172b46" font-size="25" font-weight="700" font-family="Noto Sans CJK KR, sans-serif" text-anchor="start">26  |  원소의 곱이 짝수인 부분집합</text><line x1="25" y1="336" x2="735" y2="336" stroke="#d8e3ed" stroke-width="1.5" stroke-linecap="round" /><text x="30" y="365" fill="#55677e" font-size="18" font-weight="400" font-family="Noto Sans CJK KR, sans-serif" text-anchor="start">곱이 짝수 ⇔ 짝수 원소를 적어도 하나 포함  |  정답 24</text><rect x="25.0" y="103" width="228.66666666666666" height="210" rx="13" fill="#fff0e1" stroke="#d5dfeb" stroke-width="1.5" /><text x="43.0" y="134" fill="#172b46" font-size="19" font-weight="700" font-family="Noto Sans CJK KR, sans-serif" text-anchor="start">짝수 원소</text><text x="43.0" y="167" fill="#172b46" font-size="20" font-weight="400" font-family="Noto Sans CJK KR, sans-serif" text-anchor="start">[2, 4]</text><text x="43.0" y="198" fill="#172b46" font-size="20" font-weight="400" font-family="Noto Sans CJK KR, sans-serif" text-anchor="start">1개 이상 선택</text><rect x="265.66666666666663" y="103" width="228.66666666666666" height="210" rx="13" fill="#e9f4ff" stroke="#d5dfeb" stroke-width="1.5" /><text x="283.66666666666663" y="134" fill="#172b46" font-size="19" font-weight="700" font-family="Noto Sans CJK KR, sans-serif" text-anchor="start">홀수 원소</text><text x="283.66666666666663" y="167" fill="#172b46" font-size="20" font-weight="400" font-family="Noto Sans CJK KR, sans-serif" text-anchor="start">[1, 3, 5]</text><text x="283.66666666666663" y="198" fill="#172b46" font-size="20" font-weight="400" font-family="Noto Sans CJK KR, sans-serif" text-anchor="start">선택·미선택 자