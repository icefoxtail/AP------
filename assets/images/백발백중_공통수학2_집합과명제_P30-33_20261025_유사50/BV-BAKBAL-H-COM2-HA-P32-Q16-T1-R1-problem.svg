<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 320" width="100%" height="100%">
  <defs>
    <style>
      .sq1 { fill: #dbeafe; stroke: #1d4ed8; stroke-width: 2.2; }
      .sq2 { fill: #fef3c7; stroke: #b45309; stroke-width: 2.2; }
      .base { stroke: #0f172a; stroke-width: 2.5; stroke-linecap: round; }
      .dim { stroke: #64748b; stroke-width: 1.5; stroke-dasharray: 3,3; }
      .label { font-family: sans-serif; font-size: 15px; font-weight: bold; fill: #0f172a; }
      .sublabel { font-family: sans-serif; font-size: 13px; fill: #334155; }
    </style>
  </defs>
  <!-- Baseline AB at y=240, A=(50,240), B=(370,240), C=(180,240) -->
  <!-- Square 1 on AC: width=130, height=130, y goes from 240 up to 110 -->
  <rect x="50" y="110" width="130" height="130" class="sq1" />
  <!-- Square 2 on CB: width=190, height=190, y goes from 240 up to 50 -->
  <rect x="180" y="50" width="190" height="190" class="sq2" />
  <!-- Base segment line AB -->
  <line x1="50" y1="240" x2="370" y2="240" class="base" />
  <!-- Points -->
  <circle cx="50" cy="240" r="4.5" fill="#0f172a" />
  <text x="35" y="260" class="label">A</text>
  <circle cx="180" cy="240" r="4.5" fill="#dc2626" />
  <text x="175" y="262" class="label" fill="#dc2626">C</text>
  <circle cx="370" cy="240" r="4.5" fill="#0f172a" />
  <text x="375" y="260" class="label">B</text>
  <!-- Area labels inside squares -->
  <text x="100" y="180" class="label" fill="#1e40af">S₁</text>
  <text x="260" y="150" class="label" fill="#92400e">S₂</text>
  <!-- Dimension AB = 8 below -->
  <line x1="50" y1="280" x2="370" y2="280" stroke="#475569" stroke-width="1.5" />
  <path d="M 50,275 L 50,285 M 370,275 L 370,285" stroke="#475569" stroke-width="1.5" />
  <text x="205" y="298" class="label" fill="#475569">8</text>
  <!-- Side x and 8-x -->
  <text x="105" y="230" class="sublabel">x</text>
  <text x="260" y="230" class="sublabel">8 - x</text>
</svg>