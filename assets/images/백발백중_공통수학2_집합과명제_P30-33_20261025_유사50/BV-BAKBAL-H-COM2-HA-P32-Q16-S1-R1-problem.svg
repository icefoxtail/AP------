<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 320" width="100%" height="100%">
  <defs>
    <style>
      .sq1b { fill: #f3e8ff; stroke: #7e22ce; stroke-width: 2.2; }
      .sq2b { fill: #ccfbf1; stroke: #0f766e; stroke-width: 2.2; }
      .baseb { stroke: #1e1b4b; stroke-width: 2.5; stroke-linecap: round; }
      .labelb { font-family: sans-serif; font-size: 15px; font-weight: bold; fill: #1e1b4b; }
      .sublabelb { font-family: sans-serif; font-size: 13px; fill: #115e59; }
    </style>
  </defs>
  <!-- Baseline AB at y=240, A=(40,240), B=(380,240), C=(190,240) -->
  <!-- Square 1 on AC: width=150, height=150, y from 240 up to 90 -->
  <rect x="40" y="90" width="150" height="150" class="sq1b" />
  <!-- Square 2 on CB: width=190, height=190, y from 240 up to 50 -->
  <rect x="190" y="50" width="190" height="190" class="sq2b" />
  <!-- Baseline -->
  <line x1="40" y1="240" x2="380" y2="240" class="baseb" />
  <!-- Points -->
  <circle cx="40" cy="240" r="4.5" fill="#1e1b4b" />
  <text x="25" y="260" class="labelb">A</text>
  <circle cx="190" cy="240" r="4.5" fill="#9333ea" />
  <text x="185" y="262" class="labelb" fill="#9333ea">C</text>
  <circle cx="380" cy="240" r="4.5" fill="#1e1b4b" />
  <text x="385" y="260" class="labelb">B</text>
  <!-- Area labels inside squares -->
  <text x="105" y="170" class="labelb" fill="#6b21a8">S₁</text>
  <text x="275" y="150" class="labelb" fill="#115e59">S₂</text>
  <!-- Dimension AB = 10 -->
  <line x1="40" y1="280" x2="380" y2="280" stroke="#047857" stroke-width="1.5" />
  <path d="M 40,275 L 40,285 M 380,275 L 380,285" stroke="#047857" stroke-width="1.5" />
  <text x="200" y="298" class="labelb" fill="#047857">10</text>
  <!-- Side x and 10-x -->
  <text x="105" y="230" class="sublabelb">x</text>
  <text x="270" y="230" class="sublabelb">10 - x</text>
</svg>