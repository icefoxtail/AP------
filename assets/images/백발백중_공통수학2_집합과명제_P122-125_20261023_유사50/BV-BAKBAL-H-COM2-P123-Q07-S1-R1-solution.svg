<svg xmlns="http://www.w3.org/2000/svg" width="720" height="350" viewBox="0 0 720 350" role="img" aria-label="두 합집합이 같아지는 조건"><rect x="2" y="2" width="716" height="346" rx="16" fill="#ffffff" stroke="#c7d9e8" stroke-width="2"/><rect x="18" y="16" width="684" height="50" rx="12" fill="#f1f7fc" stroke="#f1f7fc" stroke-width="1.5"/><text x="35" y="49" font-family="Noto Sans CJK KR, Noto Sans CJK JP, DejaVu Sans, sans-serif" font-size="19" font-weight="bold" text-anchor="start" fill="#2464b6">20</text><text x="365" y="49" font-family="Noto Sans CJK KR, Noto Sans CJK JP, DejaVu Sans, sans-serif" font-size="21" font-weight="bold" text-anchor="middle" fill="#17324b">두 합집합이 같아지는 조건</text><text x="360" y="94" font-family="Noto Sans CJK KR, Noto Sans CJK JP, DejaVu Sans, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" fill="#55718b">A ∪ X = B ∪ X</text><rect x="32" y="111" width="656" height="51" rx="8" fill="#e3f5ec" stroke="#c7d9e8" stroke-width="1.5"/><text x="48" y="142.66666666666666" font-family="Noto Sans CJK KR, Noto Sans CJK JP, DejaVu Sans, sans-serif" font-size="17" font-weight="bold" text-anchor="start" fill="#0f877f">반드시 X에 포함: A △ B</text><text x="672" y="142.66666666666666" font-family="Noto Sans CJK KR, Noto Sans CJK JP, DejaVu Sans, sans-serif" font-size="16" font-weight="normal" text-anchor="end" fill="#17324b">{1, 3}</text><rect x="32" y="172" width="656" height="51" rx="8" fill="#eff5fe" stroke="#c7d9e8" stroke-width="1.5"/><text x="48" y="204.0" font-family="Noto Sans CJK KR, Noto Sans CJK JP, DejaVu Sans, sans-serif" font-size="17" font-weight="bold" text-anchor="start" fill="#17324b">자유 선택: U − (A △ B)</text><text x="672" y="204.0" font-family="Noto Sans CJK KR, Noto Sans CJK JP, DejaVu Sans, sans-serif" font-size="16" font-weight="normal" text-anchor="end" fill="#17324b">{2, 4, 5}</text><rect x="32" y="234" width="656" height="51" rx="8" fill="#fff2df" stroke="#c7d9e8" stroke-width="1.5"/><text x="48" y="265.33333333333337" font-fa