JK KR, Noto Sans CJK JP, DejaVu Sans, sans-serif" font-size="17" font-weight="bold" text-anchor="start" fill="#17324b">ㄷ. 2에 가까운 수</text><text x="672" y="227.0" font-family="Noto Sans CJK KR, Noto Sans CJK JP, DejaVu Sans, sans-serif" font-size="16" font-weight="normal" text-anchor="end" fill="#17324b">거리 기준이 불명확 ×</text><rect x="32" y="249" width="656" height="36" rx="8" fill="#e3f5ec" stroke="#c7d9e8" stroke-width="1.5"/><text x="48" y="273.0" font-family="Noto Sans CJK KR, Noto Sans CJK JP, DejaVu Sans, sans-serif" font-size="17" font-weight="bold" text-anchor="start" fill="#0f877f">ㄹ. x² − 1 = 0의 실수해</text><text x="672" y="273.0" font-family="Noto Sans CJK KR, Noto Sans CJK JP, DejaVu Sans, sans-serif" font-size="16" font-weight="normal" text-anchor="end" fill="#17324b">집합 ○  {−1, 1}</text><rect x="25" y="295" width="670" height="40" rx="8" fill="#f1f7fc" stroke="#f1f7fc" stroke-width="1.5"/><text x="360" y="321" font-family="Noto Sans CJK KR, Noto Sans CJK JP, DejaVu Sans, sans-serif" font-size="19" font-weight="bold" text-anchor="middle" fill="#2464b6">ㄱ, ㄹ  →  ②번</text></svg>