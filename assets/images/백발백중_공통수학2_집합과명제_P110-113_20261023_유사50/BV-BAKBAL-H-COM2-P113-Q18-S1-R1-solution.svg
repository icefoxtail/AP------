<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420" role="img" aria-label="46. 집합 자체도 원소가 된다"><title>46. 집합 자체도 원소가 된다</title><desc>집합 A의 각 원소는 상자 한 칸으로 표시; 중괄호 안 집합은 하나의 원소</desc><rect width="720" height="420" rx="18" fill="#f8fafc"/><rect x="18" y="18" width="684" height="384" rx="15" fill="#ffffff" stroke="#d9e3ed" stroke-width="1.4"/><text x="40" y="55" font-family="'Noto Sans CJK KR','Noto Sans',Arial,sans-serif" font-size="22" font-weight="700" fill="#243348" text-anchor="start" >46. 집합 자체도 원소가 된다</text><rect x="105" y="118" width="350" height="220" rx="22" fill="#eaf5ff" stroke="#2e5e85" stroke-width="3"/><text x="126" y="151" font-family="'Noto Sans CJK KR','Noto Sans',Arial,sans-serif" font-size="22" font-weight="700" fill="#243348" text-anchor="start" >A</text><rect x="130" y="177" width="142" height="55" rx="12" fill="#fff" stroke="#86b8d5"/><text x="201" y="212" font-family="'Noto Sans CJK KR','Noto Sans',Arial,sans-serif" font-size="19" font-weight="700" fill="#22415d" text-anchor="middle" >0</text><rect x="288" y="177" width="142" height="55" rx="12" fill="#fff" stroke="#86b8d5"/><text x="359" y="212" font-family="'Noto Sans CJK KR','Noto Sans',Arial,sans-serif" font-size="19" font-weight="700" fill="#22415d" text-anchor="middle" >1</text><rect x="130" y="252" width="142" height="55" rx="12" fill="#fff" stroke="#86b8d5"/><text x="201" y="287" font-family="'Noto Sans CJK KR','Noto Sans',Arial,sans-serif" font-size="19" font-weight="700" fill="#22415d" text-anchor="middle" >{0, 1}</text><rect x="510" y="95" width="185" height="265" rx="14" fill="#eef6ff" stroke="#c5dcef"/><text x="526" y="127" font-family="'Noto Sans CJK KR','Noto Sans',Arial,sans-serif" font-size="17" font-weight="700" fill="#285c82" text-anchor="start" >핵심 관계</text><text x="525" y="170" font-family="'Noto Sans CJK KR','Noto Sans',Arial,sans-serif" font-size="18" font-weight="600" fill="#243348" text-anchor="start" >0, 1 ∈ A</text><text x="525" y="203"