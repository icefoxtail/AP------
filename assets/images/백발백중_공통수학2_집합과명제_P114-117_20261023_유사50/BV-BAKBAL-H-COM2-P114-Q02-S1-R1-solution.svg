<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 270" width="520" height="270" role="img" aria-label="집합이 같으면 대응 원소가 같다"><rect x="5" y="5" width="510" height="260" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="260" y="32" font-family="Noto Sans CJK KR, NanumSquare, sans-serif" font-size="17" font-weight="bold" fill="#172b4d" text-anchor="middle">집합이 같으면 대응 원소가 같다</text><rect x="25.0" y="70" width="150.0" height="145" rx="12" fill="#e8f5ee" stroke="#5675a3" stroke-width="1.5"/><text x="100.0" y="111" font-family="Noto Sans CJK KR, NanumSquare, sans-serif" font-size="15" font-weight="bold" fill="#172b4d" text-anchor="middle">공통 원소</text><text x="100.0" y="158.0" font-family="Noto Sans CJK KR, NanumSquare, sans-serif" font-size="14" font-weight="normal" fill="#172b4d" text-anchor="middle">1</text><rect x="185.0" y="70" width="150.0" height="145" rx="12" fill="#fff5e7" stroke="#5675a3" stroke-width="1.5"/><text x="260.0" y="111" font-family="Noto Sans CJK KR, NanumSquare, sans-serif" font-size="15" font-weight="bold" fill="#172b4d" text-anchor="middle">다른 원소 조건</text><text x="260.0" y="158.0" font-family="Noto Sans CJK KR, NanumSquare, sans-serif" font-size="14" font-weight="normal" fill="#172b4d" text-anchor="middle">a²−2a=3</text><rect x="345.0" y="70" width="150.0" height="145" rx="12" fill="#eef4ff" stroke="#5675a3" stroke-width="1.5"/><text x="420.0" y="111" font-family="Noto Sans CJK KR, NanumSquare, sans-serif" font-size="15" font-weight="bold" fill="#172b4d" text-anchor="middle">양수 해</text><text x="420.0" y="158.0" font-family="Noto Sans CJK KR, NanumSquare, sans-serif" font-size="14" font-weight="normal" fill="#172b4d" text-anchor="middle">a=3</text><text x="260" y="250" font-family="Noto Sans CJK KR, NanumSquare, sans-serif" font-size="14" font-weight="bold" fill="#265c83" text-anchor="middle">두 집합의 원소가 정확히 일치해야 한다</text></svg>