<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 160" width="180" height="160" role="img" aria-label="세 집합 A, B, C의 벤 다이어그램에서 A와 B의 교집합 중 C를 제외한 부분만 색칠">
<rect x="5" y="5" width="170" height="150" fill="white" stroke="#333" stroke-width="1.5"/>
