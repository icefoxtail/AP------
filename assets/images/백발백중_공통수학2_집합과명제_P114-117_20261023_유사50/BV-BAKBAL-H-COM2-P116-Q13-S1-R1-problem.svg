<defs><clipPath id="clip_pair"><circle cx="90" cy="65" r="42"/></clipPath></defs>
<circle cx="68" cy="105" r="42" fill="#91c6f5" clip-path="url(#clip_pair)"/>
<circle cx="112" cy="105" r="42" fill="white"/>
<circle cx="90" cy="65" r="42" fill="none" stroke="#222" stroke-width="1.3"/>
<circle cx="68" cy="105" r="42" fill="none" stroke="#222" stroke-width="1.3"/>
