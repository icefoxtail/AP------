<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 270" width="520" height="270" role="img" aria-label="대칭차는 겹친 부분을 제외"><rect x="5" y="5" width="510" height="260" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="260" y="32" font-family="Noto Sans CJK KR, NanumSquare, sans-serif" font-size="17" font-weight="bold" fill="#172b4d" text-anchor="middle">대칭차는 겹친 부분을 제외</text><rect x="25" y="50" width="470" height="177" rx="12" fill="#fbfdff" stroke="#d9e2ee" stroke-width="1.5"/><circle cx="212" cy="140" r="78" fill="#8ac7f1" stroke="#34587b" stroke-width="2"/><circle cx="307" cy="140" r="78" fill="#8ac7f1" stroke="#34587b" stroke-width="2"/><defs><clipPath id="xor-clip-33"><circle cx="212" cy="140" r="78"/></clipPath></defs><circle cx="307" cy="140" r="78" fill="#fbfdff" clip-path="url(#xor-clip-33)"/><circle cx="212" cy="140" r="78" fill="none" stroke="#34587b" stroke-width="2"/><circle cx="307" cy="140" r="78" fill="none" stroke="#34587b" stroke-width="2"/><text x="164" y="77" font-family="Noto Sans CJK KR, NanumSquare, sans-serif" font-size="17" font-weight="bold" fill="#172b4d" text-anchor="middle">A</text><text x="354" y="77" font-family="Noto Sans CJK KR, NanumSquare, sans-serif" font-size="17" font-weight="bold" fill="#172b4d" text-anchor="middle">B</text><text x="260" y="208" font-family="Noto Sans CJK KR, NanumSquare, sans-serif" font-size="14" font-weight="bold" fill="#1f567c" text-anchor="middle">색칠 영역</text><text x="260" y="250" font-family="Noto Sans CJK KR, NanumSquare, sans-serif" font-size="14" font-weight="bold" fill="#265c83" text-anchor="middle">A △ B = (A−B)∪(B−A)</text></svg>