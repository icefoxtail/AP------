<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>MathJax fallback smoke</title>
  <script>
    window.__AP_MATHJAX_SOURCE__ = 'local';
    window.__AP_MATHJAX_READY__ = new Promise(resolve => { window.__AP_MATHJAX_RESOLVE__ = resolve; });
    window.__AP_LOAD_MATHJAX_CDN__ = failed => {
      window.__AP_MATHJAX_SOURCE__ = 'cdn-fallback';
      const script = document.createElement('script');
      script.src = 'https://cdn.jsdelivr.net/npm/mathjax@4.1.3/tex-chtml.js';
      script.onload = () => window.__AP_MATHJAX_RESOLVE__?.(true);
      script.onerror = () => window.__AP_MATHJAX_RESOLVE__?.(false);
      failed?.remove();
      document.head.appendChild(script);
    };
    window.MathJax = {
      loader: { load: ['[tex]/boldsymbol'] },
      tex: { inlineMath: [['$', '$']], packages: {'[+]': ['ams', 'boldsymbol']} },
      startup: { typeset: false }
    };
  </script>
  <script defer src="/archive/vendor/mathjax/missing-bundle.js"
    onload="window.__AP_MATHJAX_RESOLVE__?.(true)"
    onerror="window.__AP_LOAD_MATHJAX_CDN__?.(this)"></script>
</head>
<body>
  <div id="math">$\boldsymbol{x}^2$</div>
  <div id="status">boot</div>
  <script>
    window.addEventListener('load', async () => {
      const status = document.getElementById('status');
      try {
        await window.__AP_MATHJAX_READY__;
        await MathJax.startup.promise;
        await MathJax.typesetPromise([document.getElementById('math')]);
        status.textContent = window.__AP_MATHJAX_SOURCE__ + ':done';
      } catch (error) {
        status.textContent = 'error:' + (error?.message || error);
      }
    });
  </script>
</body>
</html>
