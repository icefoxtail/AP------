<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Archive PDF Readiness Browser QA</title>
  <script src="/archive/archive2-pdf-readiness.js?v=20261002-output-envelope-v3"></script>
  <style>
    #print-area .page { width: 300px; height: 240px; overflow: hidden; border: 1px solid #333; }
    #print-area .overflow { height: 500px; }
    #print-area .q-box { height: 40px; overflow: hidden; }
    #print-area .clipped-inner { height: 500px; }
  </style>
</head>
<body>
  <main>
    <h1>Archive PDF Readiness Browser QA</h1>
    <p id="status" role="status">CHECKING</p>
    <section id="print-area"></section>
  </main>
  <script>
    (async () => {
      const mode = new URLSearchParams(location.search).get("case") || "success";
      const identity = {
        contractVersion: "archive2-output-envelope-v1",
        outputRequestId: "11111111-1111-4111-8111-111111111111",
        payloadHash: "a".repeat(64),
      };
      window.__AP_RENDER_READY__ = Promise.resolve({ ok: true, pages: 1 });
      window.__AP_MATHJAX_READY__ = Promise.resolve(true);
      window.__AP_OUTPUT_ENVELOPE_READY__ = { ...identity };
      window.__AP_OUTPUT_RENDER_READY__ = { ...identity, pageCount: 1 };
      const page = document.createElement("div");
      page.className = "page";
      if (mode === "overflow") {
        const content = document.createElement("div");
        content.className = "overflow";
        content.textContent = "layout too tall";
        page.append(content);
      }
      if (mode === "clipped") {
        const box = document.createElement("div");
        box.className = "q-box";
        const content = document.createElement("div");
        content.className = "clipped-inner";
        content.textContent = "question content clipped by its container";
        box.append(content);
        page.append(box);
      }
      document.getElementById("print-area").append(page);
      if (mode === "image") {
        const image = document.createElement("img");
        image.alt = "required asset";
        image.src = "/missing-required-output-image.png";
        page.append(image);
      }
      try {
        const result = await Archive2PdfReadiness.assertReady(identity, { imageTimeoutMs: 3000 });
        document.getElementById("status").textContent = `PASS pages=${result.pageCount} images=${result.imageCount}`;
      } catch (error) {
        document.getElementById("status").textContent = `BLOCKED ${error.message}`;
      }
    })();
  </script>
</body>
</html>
