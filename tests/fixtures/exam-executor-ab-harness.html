<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>Archive exam executor A/B</title>
  <style>
    body { font: 12px/1.45 system-ui, sans-serif; margin: 24px; }
    #status { font-weight: 800; }
    pre { white-space: pre-wrap; word-break: break-word; }
    iframe { position: absolute; width: 1px; height: 1px; border: 0; left: -10000px; top: -10000px; }
  </style>
</head>
<body>
<div id="status">EXAM_EXECUTOR_AB_WAITING</div>
<pre id="detail"></pre>
<script>
  const status = document.getElementById('status');
  const detail = document.getElementById('detail');
  const base = '/archive/engine.html?data=exams/test-fixtures/render-authority-golden.js&mode=exam&qpp=4&renderAuthorityDualRun=1';
  const authorities = ['legacy', 'shared'];
  const frames = Object.fromEntries(authorities.map(authority => {
    const frame = document.createElement('iframe');
    frame.title = `exam-${authority}`;
    frame.src = `${base}&examAuthority=${authority}`;
    document.body.appendChild(frame);
    return [authority, frame];
  }));
  const wait = ms => new Promise(resolve => setTimeout(resolve, ms));
  const normalizeText = value => String(value || '').replace(/\s+/g, ' ').trim();
  const summarize = frame => {
    const doc = frame.contentDocument;
    const root = doc?.documentElement;
    const pages = Array.from(doc?.querySelectorAll('#print-area .page') || []).map((page, pageIndex) => {
      const columns = Array.from(page.querySelectorAll('.grid-col'));
      const boxes = Array.from(page.querySelectorAll('.q-box[data-source-ref]')).map((box, placementOrder) => ({
        placementOrder,
        sourceRef: box.dataset.sourceRef || '',
        displayNo: normalizeText(box.querySelector('.q-num')?.textContent),
        contentText: normalizeText(box.querySelector('.q-content')?.textContent),
        choicesText: normalizeText(box.querySelector('.choices')?.textContent),
        imageCount: box.querySelectorAll('.q-image-wrap img').length,
        imageBrokenCount: Array.from(box.querySelectorAll('.q-image-wrap img')).filter(img => img.complete && !img.naturalWidth).length,
        mathCount: box.querySelectorAll('.mjx-container, .MathJax').length,
        columnNo: Math.max(0, columns.findIndex(column => column.contains(box)) + 1),
        flex: box.style.flex || ''
      }));
      return {
        pageNo: pageIndex + 1,
        hasHeader: Boolean(page.querySelector('.page-header')),
        hasPageNumber: Boolean(Array.from(page.children).find(node => /^-\s*\d+\s*-$/u.test((node.textContent || '').trim()))),
        bodyClientHeight: Number(page.querySelector('.page-body')?.clientHeight || 0),
        overflow: Number(page.querySelector('.page-body')?.scrollHeight || 0) > Number(page.querySelector('.page-body')?.clientHeight || 0) + 2,
        boxes
      };
    });
    const boxes = pages.flatMap(page => page.boxes);
    const sourceCounts = boxes.reduce((counts, box) => {
      counts[box.sourceRef] = (counts[box.sourceRef] || 0) + 1;
      return counts;
    }, {});
    const readiness = root?.dataset?.apPrintReadiness ? JSON.parse(root.dataset.apPrintReadiness) : null;
    return { pages, pageCount: pages.length, boxes, sourceCounts, overflow: pages.some(page => page.overflow), imageBrokenCount: boxes.reduce((sum, box) => sum + box.imageBrokenCount, 0), readiness };
  };
  const comparable = result => ({
    pageCount: result.pageCount,
    pages: result.pages.map(page => ({
      pageNo: page.pageNo,
      hasHeader: page.hasHeader,
      hasPageNumber: page.hasPageNumber,
      bodyClientHeight: 0,
      overflow: page.overflow,
      boxes: page.boxes.map(box => ({ ...box, bodyClientHeight: undefined }))
    }))
  });
  const bodyHeightsEqual = (left, right) => left.pages.length === right.pages.length && left.pages.every((page, index) => Math.abs(page.bodyClientHeight - right.pages[index].bodyClientHeight) <= 1);
  const same = (left, right) => JSON.stringify(comparable(left)) === JSON.stringify(comparable(right));
  const poll = async () => {
    const deadline = Date.now() + 20000;
    let outcomes = [];
    while (Date.now() < deadline) {
      const promises = authorities.map(authority => frames[authority].contentWindow?.__AP_RENDER_READY__);
      if (promises.every(Boolean)) {
        outcomes = await Promise.all(promises.map(promise => Promise.resolve(promise)));
        if (outcomes.every(outcome => outcome?.ok === true)) break;
      }
      await wait(100);
    }
    const result = Object.fromEntries(authorities.map(authority => [authority, summarize(frames[authority])]));
    const legacy = result.legacy;
    const shared = result.shared;
    const expectedCount = 8;
    const orderParity = JSON.stringify(legacy.boxes.map(box => box.displayNo)) === JSON.stringify(shared.boxes.map(box => box.displayNo));
    const semanticParity = JSON.stringify(legacy.boxes.map(box => ({ sourceRef: box.sourceRef, displayNo: box.displayNo, contentText: box.contentText, choicesText: box.choicesText, imageCount: box.imageCount, mathCount: box.mathCount }))) === JSON.stringify(shared.boxes.map(box => ({ sourceRef: box.sourceRef, displayNo: box.displayNo, contentText: box.contentText, choicesText: box.choicesText, imageCount: box.imageCount, mathCount: box.mathCount })));
    const sourceCountsEqual = JSON.stringify(legacy.sourceCounts) === JSON.stringify(shared.sourceCounts);
    const omissionCount = Math.max(0, expectedCount - shared.boxes.length);
    const duplicationCount = Object.values(shared.sourceCounts).filter(count => count > 1).length;
    const pass = outcomes.length === 2 && outcomes.every(outcome => outcome?.ok === true)
      && legacy.readiness?.state === 'RENDER_READY' && shared.readiness?.state === 'RENDER_READY'
      && same(legacy, shared) && bodyHeightsEqual(legacy, shared) && orderParity && semanticParity && sourceCountsEqual
      && shared.boxes.length === expectedCount && omissionCount === 0 && duplicationCount === 0
      && legacy.overflow === false && shared.overflow === false && legacy.imageBrokenCount === 0 && shared.imageBrokenCount === 0;
    status.textContent = pass ? 'EXAM_EXECUTOR_AB_PASS' : 'EXAM_EXECUTOR_AB_HOLD';
    detail.textContent = JSON.stringify({ legacy, shared, checks: { orderParity, semanticParity, sourceCountsEqual, bodyHeightsEqual: bodyHeightsEqual(legacy, shared), omissionCount, duplicationCount } }, null, 2);
  };
  poll().catch(error => { status.textContent = `EXAM_EXECUTOR_AB_ERROR:${error.message}`; detail.textContent = String(error.stack || error); });
</script>
</body>
</html>
