<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
    <title>오답 클리닉 학기 필터 검증</title>
    <link rel="stylesheet" href="../../apmath/css/apms-clinic-print.css">
    <style>:root{--surface:#fff;--surface-2:#f8fafc;--bg:#f3f4f6;--border:#e5e7eb;--text:#1f2937;--secondary:#6b7280;--primary:#2563eb;--primary-soft:#eff6ff;--primary-rgb:37,99,235;--error:#ef4444;}body{margin:0;padding:24px;font:14px Arial,sans-serif;background:var(--bg);}main{max-width:400px;padding:20px;background:var(--surface);border-radius:14px;}h1{margin:0 0 20px;font-size:18px;}.clinic-print-exam-list{max-height:420px;}</style>
    <script>
        window.state = { db: { classes: [{ id: 'qa', grade: '중3', name: '중3 검증반' }], students: [], class_students: [], exam_sessions: [], wrong_answers: [], class_exam_assignments: [
            ['25_왕운중_2학기_중간_중3_수학', '2mid'], ['25_연향중_2학기_중간_중3_수학', '2mid'],
            ['24_왕운중_2학기_중간_중3_수학', '2mid'], ['25_왕운중_1학기_중간_중3_수학', '1mid'],
            ['25_연향중_1학기_기말_중3_수학', '1final'], ['25_왕운중_2학기_기말_중3_수학', '2final']
        ].map(([title, period], i) => ({ id: 'qa-' + i, class_id: 'qa', exam_title: title, exam_date: '2026-09-28', archive_file: `exams/original/middle/m3/${period}/${title}.js`, question_count: 24 })) } };
    </script>
    <script src="../../apmath/js/clinic-print.js"></script>
</head>
<body>
    <main><h1>오답 클리닉 · 시험 선택</h1><section id="filter-controls" class="clinic-print-section"></section></main>
    <script>
        document.getElementById('filter-controls').innerHTML = `
            <div class="clinic-print-period-heading"><div class="clinic-print-section-title">학기별 시험 선택</div><select id="clinic-print-exam-year" aria-label="시험 연도" onchange="clinicPrintSetExamYearFilter('qa',this.value)">${clinicPrintRenderExamYearOptions('qa')}</select></div>
            <div id="clinic-print-exam-period-filters" class="clinic-print-period-grid" role="group" aria-label="학기별 시험 필터">${clinicPrintRenderExamPeriodFilters('qa')}</div>
            <div class="clinic-print-section-head"><div class="clinic-print-section-title">시험 목록</div><button id="select-visible" class="clinic-print-mini-btn" onclick="document.querySelectorAll('input[name=clinic-print-exam]:not(:disabled)').forEach(el=>el.checked=true)">전체 선택</button></div>
            <div id="clinic-print-exam-list" class="clinic-print-exam-list">${clinicPrintRenderExamListHtml('qa')}</div>`;
    </script>
</body>
</html>
