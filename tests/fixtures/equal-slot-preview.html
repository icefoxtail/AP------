<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<title>새 인쇄 엔진 비교</title>
<style>body{font:16px/1.7 system-ui;max-width:900px;margin:50px auto;padding:20px}table{border-collapse:collapse;width:100%}td,th{padding:14px;border:1px solid #ddd;text-align:left}a{color:#1749b1}code{background:#eee;padding:3px}h1{font-size:28px}</style>
<h1>새 인쇄 엔진 비교</h1>
<p>같은 9문항을 사용합니다. 새 엔진은 <strong>엄격한 2×2</strong>를 선택하고, 기존 엔진은 원래 배치 규칙을 사용합니다. 문항 2는 긴 발문, 3은 긴 수식, 4·7은 그림, 5는 긴 선택지, 6은 표, 8은 서술형 배치 힌트가 있습니다.</p>
<table><tr><th>엔진</th><th>새 2×2 엔진</th><th>기존 엔진</th><th>기존 특수 배치 유지</th></tr>
<tr><td>Archive</td><td><a href="?kind=archive">열기</a></td><td><a href="?kind=archive&legacy=1">열기</a></td><td><a href="?kind=archive&compat=1">열기</a></td></tr>
<tr><td>Mixer</td><td><a href="?kind=mixer">열기</a></td><td><a href="?kind=mixer&legacy=1">열기</a></td><td><a href="?kind=mixer&compat=1">열기</a></td></tr>
<tr><td>Wrong</td><td><a href="?kind=wrong">열기</a></td><td><a href="?kind=wrong&legacy=1">열기</a></td><td><a href="?kind=wrong&compat=1">열기</a></td></tr></table>
<p>브라우저의 PDF 저장으로 문항과 선택지가 같은 페이지에 있는지 확인할 수 있습니다. 실제 프린터 출력은 각 엔진의 기존 인쇄 기능을 사용합니다.</p>
<script src="../../archive/exams/test-fixtures/equal-slot-engine-bank.js"></script>
<script>
(async () => {
 const p = new URLSearchParams(location.search), kind = p.get('kind');
 if (!['archive','mixer','wrong'].includes(kind)) return;
 const params = new URLSearchParams({mode:'exam',qpp:'4',fit:'screen',prewarm:'0',solQr:'1',slotEngine:p.get('legacy')==='1'?'legacy':'v2'});
 if (p.get('compat') !== '1') params.set('equalSlots','1');
 let target;
 if (kind==='archive') {
   params.set('data','exams/test-fixtures/equal-slot-engine-bank.js');
   target='/archive/engine.html';
 } else if (kind==='mixer') {
   const bank = window.questionBank.map(q=>({...q,sourceArchiveFile:'test-fixtures/equal-slot-engine-bank.js'}));
   localStorage.setItem('mixedQuestions_equal-slot-preview',JSON.stringify(bank));
   localStorage.setItem('mixedMeta_equal-slot-preview',JSON.stringify({title:'새 엔진 비교 시험지',qpp:4,count:bank.length}));
   params.set('key','equal-slot-preview'); target='/archive/mixed_engine.html';
 } else {
   const archiveFile=new URL('../../archive/exams/test-fixtures/equal-slot-engine-bank.js',location.href).href;
   const payload={mode:'student',printTitle:'새 엔진 비교 시험지',className:'QA',createdDate:'2026-09-15',options:{pageBreakByStudent:true,includeHomeworkCheckBox:true},students:[{studentName:'검증 학생',wrongItems:window.questionBank.map(q=>({archiveFile,sourceArchiveFile:archiveFile,questionNo:q.id,sourceQuestionNo:q.id,examTitle:'비교 검증'}))}]};
   sessionStorage.setItem('AP_CLINIC_PRINT_PAYLOAD',JSON.stringify(payload)); target='/apmath/wrong_print_engine.html';
 }
 location.replace(target+'?'+params);
})().catch(error=>{document.body.append(String(error));});
</script>
</html>
