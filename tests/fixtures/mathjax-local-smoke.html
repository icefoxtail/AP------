<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>MathJax local smoke</title>
  <script>
    window.MathJax = {
      loader: { paths: { mathjax: '/archive/vendor/mathjax', 'mathjax-tex': '/archive/vendor/mathjax-tex-font' }, load: ['[tex]/boldsymbol'] },
      tex: { inlineMath: [['$', '$']], packages: {'[+]': ['ams', 'boldsymbol']} },
      output: { font: 'mathjax-tex', displayOverflow: 'linebreak', linebreaks: { inline: true, width: '100%', lineleading: 0.2 } },
      startup: { typeset: false }
    };
  </script>
  <script defer src="/archive/vendor/mathjax-tex-font/tex-mml-chtml-mathjax-tex.js"></script>
</head>
<body>
  <div id="math">$\boldsymbol{x}^2+\frac{1}{2}$</div>
  <div id="status">boot</div>
  <script>
    window.addEventListener('load', async () => {
      const status = document.getElementById('status');
      try {
        status.textContent = 'startup';
        await MathJax.startup.promise;
        status.textContent = 'typeset';
        await MathJax.typesetPromise([document.getElementById('math')]);
        status.textContent = 'done';
      } catch (error) {
        status.textContent = 'error:' + (error?.message || error);
      }
    });
  </script>
</body>
</html>
